  text: Bless the Lord, seas and rivers; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, моря и реки; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Форма повелительного наклонения во множественном числе обращена к одушевлённо представленному творению. «Благословляйте» сохраняет прямое дополнение и литургический характер повторяющегося призыва.
- source_word: θάλασσαι
  choice: моря
  rationale: Сохранено множественное число и поэтическое обращение к различным морям.
- source_word: ποταμοί
  choice: реки
  rationale: Прямой и естественный русский эквивалент, образующий ясную поэтическую пару со словом «моря».
- source_word: τὸν κύριον
  choice: Господа
  rationale: Κύριος здесь является божественным титулом; форма винительного падежа передана согласно русскому управлению глагола «благословлять».
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол обозначает хвалу в песнопении; «воспевайте» естественно и ёмко передаёт как музыкальный, так и хвалебный оттенок.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Русский глагол передаёт усиленное возвеличивание, выраженное приставочным греческим глаголом, и соответствует возвышенному гимническому регистру.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивое и понятное выражение длительности без конца, уместное в библейском гимническом рефрене.
theological_decisions:
- issue: Передача κύριος как божественного титула
  choice: Господь
  alternative: Владыка
  rationale: Греческий текст содержит κύριος как обращённый к Богу титул. «Господь» является точным и общепонятным русским соответствием; написание с прописной буквы обозначает титульное употребление, не подменяя греческую форму тетраграмматоном.
translation_notes:
  register: Современный литературный русский с достоинством гимнической речи. Параллельные повелительные формы и краткий финал сохраняют ритм исходного призыва; архаизирующее, но широко понятное «вовеки» уместно для повторяющегося литургического рефрена.
