base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/015.yaml
  text: And at this time there is no ruler or prophet or leader, no whole burnt offering or sacrifice or offering or incense, and no place to bring firstfruits before you and to find mercy.
translation:
  language: ru
  text: И в это время нет ни правителя, ни пророка, ни предводителя, ни всесожжения, ни жертвы, ни приношения, ни фимиама; нет и места, где можно было бы принести пред Тобой плоды[a] и обрести милость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принести первые плоды»; возможно также: «совершить приношение». Греческое выражение необычно и допускает несколько толкований.'
    reason: Сохранение лексической неоднозначности τοῦ καρπῶσαι.
lexical_decisions:
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: в это время
  rationale: Естественно передаёт временную отнесённость и непосредственность плача.
- source_word: ἄρχων
  choice: правитель
  rationale: Сохраняет значение лица, наделённого публичной властью, и отличается от ἡγούμενος.
- source_word: προφήτης
  choice: пророк
  rationale: Устойчивый и точный русский эквивалент.
- source_word: ἡγούμενος
  choice: предводитель
  rationale: Передаёт общее значение руководящего лица, не отождествляя его с правителем; также позволяет избежать церковно-титульного значения слова «игумен».
- source_word: ὁλοκαύτωσις
  choice: всесожжение
  rationale: Точный культовый термин для жертвы, целиком сжигаемой на огне, отличённый от более общего θυσία.
- source_word: θυσία
  choice: жертва
  rationale: Естественный общий эквивалент культового термина.
- source_word: προσφορά
  choice: приношение
  rationale: Передаёт дар, представляемый Богу, и сохраняет отличие от жертвы.
- source_word: θυμίαμα
  choice: фимиам
  rationale: Устоявшийся русский библейский термин для культового благовонного курения; соответствует возвышенному, но понятному регистру.
- source_word: τόπος
  choice: место
  rationale: Прямой эквивалент, обозначающий место совершения богослужебного действия.
- source_word: τοῦ καρπῶσαι
  choice: где можно было бы принести ... плоды
  rationale: Сохраняет явную связь глагола с καρπός («плод») и культовый контекст, не устраняя редкость и смысловую неоднозначность греческого выражения.
- source_word: ἐνώπιόν σου
  choice: пред Тобой
  rationale: Естественно передаёт присутствие Бога и культовую направленность действия.
- source_word: εὑρεῖν ἔλεος
  choice: обрести милость
  rationale: Сохраняет греческий образ «найти милость» в естественной для литературного русского форме.
theological_decisions:
- issue: Перечень отсутствующих форм власти и храмового служения
  choice: Сохранить каждый член перечня отдельно
  alternative: Обобщить как «нет властей и жертвоприношений»
  rationale: Накопление терминов выражает полноту лишения в условиях утраты храмового богослужения; сокращение ослабило бы риторическую и богословскую напряжённость стиха.
- issue: Значение τοῦ καρπῶσαι
  choice: «принести ... плоды» с примечанием об альтернативных пониманиях
  alternative: «принести первые плоды» или обобщённое «совершить приношение»
  rationale: Греческое выражение необычно. Передача через «плоды» сохраняет его лексическую форму и культовый контекст, а примечание не позволяет превратить вероятное толкование о первых плодах в несомненное.
translation_notes:
  register: Современный литературный русский с достоинством библейской молитвы. Синтаксический параллелизм и полный перечень сохранены; точка с запятой делает длинную фразу яснее. Местоимение «Тобой» написано с прописной буквы как обращение к Богу.
