translation:
  language: ru
  text: Оно пронеслось и сожгло тех халдеев, которых застало вокруг печи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прошло и подожгло». Греческие глаголы допускают такой более буквальный перевод; основной текст передаёт разрушительную силу происходящего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διώδευσεν
  choice: пронеслось дальше
  rationale: Глагол обозначает движение через некоторое пространство; в контексте распространяющегося из печи огня «пронеслось дальше» естественно передаёт как движение, так и его стремительную разрушительную силу.
- source_word: ἐνεπύρισεν
  choice: сожгло
  rationale: В данном контексте глагол описывает губительное действие огня на людей возле печи. «Сожгло» звучит естественно по-русски и передаёт результат яснее, чем буквальное «подожгло».
- source_word: οὓς εὗρεν
  choice: тех… которых застало
  rationale: 'Так сохраняется относительная конструкция и смысл: огонь поразил тех халдеев, которых встретил на своём пути.'
- source_word: περὶ τὴν κάμινον
  choice: вокруг печи
  rationale: Предлог περί с винительным падежом здесь имеет пространственное значение; «вокруг печи» прямо и естественно передаёт его.
- source_word: τῶν Χαλδαίων
  choice: халдеев
  rationale: Сохранено конкретное наименование Χαλδαῖοι, употреблённое в греческом тексте, без замены на более общее «вавилоняне».
