revisions:
- from: Как при всесожжениях овнов и быков и при десятках тысяч тучных ягнят, так да будет сегодня наша жертва пред Тобой и да совершит умилостивление в Твоём присутствии[a], потому что нет стыда тем, кто возложил упование на Тебя; и да будет она доведена до полноты пред Тобой[b].
  to: Как при всесожжениях овнов и быков, как при десятках тысяч тучных ягнят, так да будет сегодня наша жертва пред Тобой и да послужит искуплением в Твоём присутствии[a], ибо не будут посрамлены те, кто возложил упование на Тебя; и да будет она доведена до завершения пред Тобой[b].
  rationale: Исправлены неестественная конструкция «нет стыда тем», тяжеловесное сочетание «совершит умилостивление» и неосновательная альтернативная интерпретация в сноске b. Необычность повторяющегося ὄπισθέν σου сохранена в примечаниях, а смысл τελειῶσαι не расширен за пределы греческого текста.
