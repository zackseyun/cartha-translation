base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/017.yaml
  text: As with whole burnt offerings of rams and bulls[a], and as with tens of thousands of fat lambs, so let our sacrifice be before you today and make atonement before you, for there is no shame for those who have put their trust in you[b], and let it be brought to completion before you.
translation:
  language: ru
  text: Как при всесожжениях овнов и быков, как при десятках тысяч тучных ягнят, так да будет сегодня наша жертва пред Тобой и да послужит искуплением в Твоём присутствии[a], ибо не будут посрамлены те, кто возложил упование на Тебя; и да будет она доведена до завершения пред Тобой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение, переданное словами «в Твоём присутствии», буквально обычно означает «позади Тебя» или «вслед за Тобой». В данном контексте оно, по-видимому, употреблено в смысле предстояния Богу. Глагол, переведённый словами «да послужит искуплением», может также пониматься как просьба о принятии жертвы.
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте здесь вновь стоит необычное выражение, буквально обычно означающее «позади Тебя» или «вслед за Тобой». Перевод «пред Тобой» передаёт его вероятный контекстуальный смысл; глагол означает «довести до завершения».
    reason: textual_ambiguity
lexical_decisions:
- source_word: ὁλοκαυτώμασι
  choice: всесожжениях
  rationale: Термин обозначает жертвы, целиком сжигаемые на огне; «всесожжение» сохраняет точный культовый смысл и является понятным библейским термином в русском языке.
- source_word: κριῶν καὶ ταύρων
  choice: овнов и быков
  rationale: Переданы конкретные виды жертвенных животных без обобщения.
- source_word: μυριάσιν ἀρνῶν πιόνων
  choice: десятках тысяч тучных ягнят
  rationale: μυριάς буквально указывает на десять тысяч или множество такого масштаба, а πίων — на упитанное, ценное для жертвы животное.
- source_word: θυσία
  choice: жертва
  rationale: Сохраняет прямую связь с перечисленными животными жертвоприношениями и культовую весомость высказывания.
- source_word: ἐξιλάσαι
  choice: да совершит умилостивление
  rationale: Глагол имеет значение умилостивления и искупительного примирения; формулировка сохраняет жертвенно-богословскую силу слова, не сводя его без пояснения к принятию жертвы.
- source_word: τοῖς πεποιθόσιν ἐπὶ σοί
  choice: тем, кто возложил упование на Тебя
  rationale: Перфектное причастие выражает состоявшийся и продолжающийся выбор довериться Богу; «возложил упование» передаёт это устойчивое состояние.
- source_word: τελειῶσαι
  choice: да будет она доведена до полноты
  rationale: Глагол означает доведение до завершения или полноты. Пассивная русская конструкция отражает сжатый и неоднозначный греческий синтаксис, не уточняя сверх текста, в чём именно состоит завершение.
theological_decisions:
- issue: Значение ἐξιλάσαι в молитве о жертве
  choice: да совершит умилостивление
  alternative: да будет принята
  rationale: Основной текст сохраняет присущий греческому глаголу смысл умилостивления, тогда как значение принятия жертвы возможно лишь как контекстуальное истолкование и потому отмечено в сноске.
- issue: Необычное повторение ὄπισθέν σου
  choice: в Твоём присутствии / пред Тобой
  alternative: позади Тебя / вслед за Тобой
  rationale: Обычное пространственное значение греческого выражения здесь даёт неясный русский смысл. Контекст молитвы о жертве позволяет передать направленность действия к Богу как совершение в Его присутствии, но буквальная необычность текста честно отмечена в сносках.
- issue: Подразумеваемый субъект при τελειῶσαι
  choice: жертва
  alternative: молящиеся
  rationale: Ближайшее явно названное существительное — «наша жертва», поэтому в русском тексте местоимение отнесено к ней. Однако греческая конструкция сжата и допускает понимание просьбы о совершенном следовании Богу самих молящихся; эта неоднозначность указана в сноске.
translation_notes:
  register: Современный литературный русский с торжественным молитвенным звучанием. Сохранены традиционные и понятные культовые слова «всесожжение», «жертва», «умилостивление»; архаические формы и искусственная буквальность устранены. Местоимения, относящиеся к Богу, написаны с прописной буквы как стилистический признак молитвенной речи.
