  yaml_path: translation/deuterocanon/prayer_of_azariah/001/005.yaml
  text: And you have executed true judgments in all that you have brought upon us and upon your holy city[a], Jerusalem, the city of our fathers; for in truth and judgment you have done all these things because of our sins.
translation:
  language: ru
  text: И Ты совершил истинные суды во всём, что Ты навёл на нас и на Твой святой город — Иерусалим, город наших отцов, — ибо по истине и по суду[a] Ты сделал всё это за наши грехи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по истине и по справедливости». Греческое слово κρίσει может означать «суд» или «справедливость»; в основном тексте сохранено «суд», чтобы передать повтор судебной лексики этого стиха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίματα ἀληθείας
  choice: истинные суды
  rationale: Сохраняет конкретный судебный смысл множественного κρίματα и передаёт родительный ἀληθείας как характеристику судов, то есть суды, согласные с истиной.
- source_word: ἐποίησας
  choice: совершил / сделал
  rationale: При слове «суды» естественно «совершил», а с «всё это» — «сделал»; контекстное варьирование одного глагола обеспечивает ясный современный русский язык.
- source_word: κατὰ πάντα ἃ ἐπήγαγες ἡμῖν
  choice: во всём, что навёл на нас
  rationale: «Навёл на нас» передаёт причинное значение ἐπάγω применительно к бедствию или наказанию, не уточняя сверх текста его конкретную форму.
- source_word: πόλιν σου τὴν ἁγίαν
  choice: Твой святой город
  rationale: Прямое и естественное соответствие греческому выражению с сохранением его богословской значимости.
- source_word: τὴν τῶν πατέρων ἡμῶν Ἰερουσαλήμ
  choice: Иерусалим, город наших отцов
  rationale: Пояснительное приложение ясно выражает принадлежность Иерусалима предкам говорящих и естественно связано с уже названным городом.
- source_word: ἐν ἀληθείᾳ καὶ κρίσει
  choice: по истине и по суду
  rationale: Сохраняет два существительных и повтор судебной лексики κρίματα / κρίσει, не сводя выражение к одному наречию «справедливо».
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν
  choice: за наши грехи
  rationale: В данном контексте кратко и естественно передаёт причину судебных действий; возможный вариант — «из-за наших грехов».
theological_decisions:
- issue: Повтор судебной лексики в описании Божьих действий
  choice: Сохранить слова «суды» и «суд», представляя постигшее народ и Иерусалим как судебное действие за грехи.
  alternative: Передать оба выражения через «справедливость» или наречие «справедливо».
  rationale: Греческий текст намеренно повторяет однокоренную судебную лексику κρίματα / κρίσει. Её сохранение передаёт исповедание того, что Божьи действия не произвольны, а истинны и судебно обоснованы.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного исповедания. Синтаксис слегка упорядочен для ясности, при этом сохранены повтор судебной лексики, причинная связь с грехами и обращение к Богу с прописной буквы.
