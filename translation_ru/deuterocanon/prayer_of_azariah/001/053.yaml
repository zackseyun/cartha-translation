translation:
  language: ru
  text: Благословляйте Господа, всё, что произрастает на земле; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Форма повелительного наклонения во множественном числе; «благословляйте» сохраняет литургический повтор Песни и значение «воздавайте благословение».
- source_word: πάντα τὰ φυόμενα
  choice: все растения
  rationale: Субстантивированное причастие от φύω обозначает всё произрастающее. В данном обращении к творению естественное русское соответствие — «все растения», без излишнего ограничения отдельными видами растительности.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: 'ἐπί с родительным падежом здесь выражает местонахождение: то, что растёт на земле.'
- source_word: τὸν κύριον
  choice: Господа
  rationale: Передаёт κύριος традиционным и современно понятным библейским словом, не подставляя тетраграмматон, которого в греческом тексте нет.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол обозначает хвалу в песнопении; «воспевайте» сохраняет музыкально-литургический оттенок и звучит естественно по-русски.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Приставочный глагол усиливает идею возвышения. «Превозносите» кратко и идиоматично передаёт усиленное прославление.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение относится к Господу; прописная буква соответствует принятому русскому библейскому оформлению личного местоимения о Боге.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Литургическая формула выражает непрестанную, вечную длительность; «вовеки» естественно для возвышенного библейского рефрена.
theological_decisions:
- issue: Передача κύριος в девтероканоническом литургическом рефрене
  choice: Господа
  alternative: Владыку
  rationale: «Господь» прямо и традиционно передаёт κύριος, не внося в текст отсутствующее в греческом оригинале имя Бога.
translation_notes:
  register: Современный литературный русский с достоинством литургического призыва. Параллельные повелительные формы и краткое «вовеки» сохраняют ритм повторяющегося рефрена; архаические обороты не используются.
