base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/058.yaml
  text: Bless the Lord, four-footed animals and beasts of the earth; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, четвероногие и звери земные; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Повелительное наклонение множественного числа; «благословляйте» сохраняет литургический призыв и отличается от следующего ὑμνεῖτε.
- source_word: τετράποδα
  choice: четвероногие
  rationale: Буквально «четвероногие существа»; субстантивированное «четвероногие» естественно для поэтического перечня творения и не добавляет отсутствующего в греческом определения.
- source_word: θηρία τῆς γῆς
  choice: звери земные
  rationale: θηρία обозначает зверей, нередко диких животных; сочетание «звери земные» сохраняет генитивную связь и возвышенный поэтический строй.
- source_word: τὸν κύριον
  choice: Господа
  rationale: В гимническом обращении κύριος относится к Богу; традиционное и общепонятное соответствие — «Господь».
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол обозначает хвалу в гимне или песнопении; «воспевайте» кратко и естественно передаёт этот оттенок.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Сильный составной глагол со значением чрезвычайного возвеличивания; «превозносите» передаёт усиление без тяжеловесного наречия.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: В рефрене выражает непрестанную, вечную хвалу; «вовеки» сохраняет богослужебно-поэтический регистр и ясно современному читателю.
theological_decisions:
- issue: Передача κύριος в обращённом к Богу гимне
  choice: Господь
  alternative: Владыка
  rationale: «Господь» точно соответствует устойчивому библейскому употреблению κύριος в обращении к Богу и не привносит дополнительного оттенка господства, выраженного словом «Владыка».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным гимническим звучанием. Синтаксический параллелизм и различие между «благословляйте» и «воспевайте» сохранены; архаизирующая форма «вовеки» оправдана повторяющимся литургическим рефреном.
