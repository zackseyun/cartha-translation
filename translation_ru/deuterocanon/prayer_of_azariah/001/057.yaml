base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/057.yaml
  text: Bless the Lord[a], all birds of the sky; sing hymns and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, все птицы небесные[a]; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все птицы неба»; возможно, шире: «все летающие существа в небе».'
    reason: 'Лексическая альтернатива: πετεινά обычно означает птиц, но может обозначать летающих существ более широко.'
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Форма повелительного наклонения во множественном числе; «благословляйте» сохраняет литургический характер призыва и повторяющуюся формулу песни.
- source_word: πάντα τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: все птицы небесные
  rationale: πετεινά может обозначать птиц или шире летающих существ; в перечне творения «птицы небесные» звучит естественно и сохраняет связь с οὐρανοῦ.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Прямое соответствие греческому κύριον в данном славословном обращении; написание с прописной буквы ясно указывает на Бога.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол обозначает хвалу в песнопении; «воспевайте» передаёт музыкально-литургический оттенок и отличается от первого призыва.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Русское «превозносите» естественно передаёт усиленное значение сложного глагола — чрезвычайно возвышать, высоко прославлять.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение прямо отсылает к Господу; форма естественна в русском предложении.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивая и понятная русская формула для выражения непреходящей длительности; соответствует поэтическому рефрену.
theological_decisions:
- issue: Передача κύριος в славословном обращении
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: В греческом тексте стоит κύριος, а не само Тетраграмматон; «Господь» точно передаёт имеющуюся форму без добавочного акцента на реконструируемом Божьем имени.
translation_notes:
  register: Современный литературный русский с возвышенным песенным звучанием. Сохранены параллельные императивы и краткий рефрен; архаизирующие формы сведены к общеупотребительному в библейско-поэтической речи слову «вовеки».
