base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/062.yaml
  text: Bless the Lord[a], servants[b]; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, рабы[a]; воспевайте и превозносите Его вовеки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуги». Греческое слово может обозначать как рабов, так и тех, кто состоит на службе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в века».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Форма повелительного наклонения во множественном числе. «Благословляйте» сохраняет традиционный и прямой смысл обращения хвалы к Богу.
- source_word: δοῦλοι
  choice: рабы
  rationale: Слово обозначает людей, находящихся в служении и принадлежащих господину; «рабы» сохраняет более сильную сторону значения, тогда как «слуги» возможно как контекстуальная альтернатива.
- source_word: τὸν κύριον
  choice: Господа
  rationale: В славословии κύριος выступает как божественный титул; принятое русское соответствие — «Господь».
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол означает воздавать хвалу в песнопении; «воспевайте» естественно передаёт музыкальный и торжественный оттенок.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Приставочный глагол выражает усиленное возвышение; «превозносите» сохраняет эту интенсивность и высокий регистр.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивое выражение передаёт неограниченную длительность; «вовеки» естественно для русского гимнического стиля.
theological_decisions:
- issue: Передача δοῦλοι в обращении к почитателям Бога
  choice: рабы
  alternative: слуги
  rationale: Основной текст сохраняет сильное значение принадлежности и подчинения Господу, не исключая более широкого значения служения; контекстуальная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным гимническим звучанием. Формы «благословляйте», «воспевайте», «превозносите» передают параллельные повеления исходного текста; «вовеки» сохраняет естественный богослужебно-поэтический регистр.
