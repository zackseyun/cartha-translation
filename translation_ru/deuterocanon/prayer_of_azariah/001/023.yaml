  - marker: b
    text: 'Или: «хворостом»; греческое слово κληματίδα может обозначать срезанные виноградные побеги, использовавшиеся как топливо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ διέλειπον
  choice: не переставали
  rationale: Отрицание с имперфектом передаёт непрерывное продолжение действия; современное русское выражение сохраняет этот видовой оттенок.
- source_word: οἱ ἐμβάλλοντες αὐτοὺς
  choice: бросившие их в печь
  rationale: Причастный оборот отождествляет слуг с теми, кто бросил троих в печь; дополнение «в печь» естественно восстанавливается из ближайшего контекста.
- source_word: ὑπηρέται τοῦ βασιλέως
  choice: царские слуги
  rationale: ὑπηρέται обозначает подчинённых, состоящих на службе у царя, без обязательного указания на особую должность.
- source_word: καίοντες τὴν κάμινον
  choice: разжигать её
  rationale: Буквально оборот говорит о поддержании горения печи; «разжигать» естественно по-русски передаёт действие слуг без избыточного добавления результата.
- source_word: ἀφθάλτῳ
  choice: нефтью
  rationale: Термин обозначает горючее природное нефтяное вещество. «Нефть» понятна современному читателю и сохраняет отличие от следующей πίσσα — «смола».
- source_word: πίσσῃ
  choice: смолой
  rationale: Прямой и общеупотребительный русский эквивалент для вязкого горючего смолистого вещества.
- source_word: στιππύῳ
  choice: паклей
  rationale: Слово обозначает волокнистые отходы, в частности льняные, пригодные для растопки; «пакля» точно и достаточно понятно передаёт материал.
- source_word: κληματίδα
  choice: виноградными ветвями
  rationale: В данном перечне топлива слово естественно понимать как срезанные побеги или ветви виноградной лозы; конкретный перевод сохраняет предметный образ греческого текста.
