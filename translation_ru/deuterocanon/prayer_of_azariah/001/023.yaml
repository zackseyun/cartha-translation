  text: And the king’s attendants who threw them in did not stop feeding the furnace with naphtha and pitch and tow and brushwood[b][a], keeping it burning.
translation:
  language: ru
  text: И слуги царя, бросившие их в печь, не переставали поддерживать в ней огонь битумом[a], смолой, паклей и виноградными ветвями[b].
  philosophy: optimal-equivalence
  footnotes:
