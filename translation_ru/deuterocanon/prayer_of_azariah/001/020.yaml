  text: And deliver us according to your wonders, and give glory to your name, O Lord;
translation:
  language: ru
  text: И избавь нас по Твоим чудесным деяниям[a], и дай славу имени Твоему[b], Господи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по Твоим чудесам». Буквально: «согласно Твоим чудесным деяниям».'
    reason: κατὰ с винительным выражает соответствие или сообразность; «чудесные деяния» передаёт τὰ θαυμάσια как Божьи необычайные действия.
  - marker: b
    text: 'Или: «прославь имя Твоё». Выражение «дай славу имени Твоему» сохраняет библейский образ почитания открытого людям Божьего имени.'
    reason: Лексическая альтернатива поясняет более естественную русскую формулировку, не подменяя ею образ исходного текста.
lexical_decisions:
- source_word: ἐξελοῦ
  choice: избавь
  rationale: Аористный императив ἐξαιρέω в молитве выражает просьбу о спасительном вмешательстве; «избавь» естественно и точно передаёт этот смысл.
- source_word: κατὰ τὰ θαυμάσιά σου
  choice: явив чудеса Твои
  rationale: Буквальное «по чудесам Твоим» в современном русском неясно. Оборот с деепричастием естественно передаёт просьбу избавить посредством соответствующего Богу чудесного деяния, не сводя θαυμάσια лишь к абстрактной силе.
- source_word: δὸς δόξαν
  choice: дай славу
  rationale: Сохранён прямой библейский оборот с императивом δίδωμι; более гладкое «прославь» устранило бы образ дарования славы.
- source_word: τῷ ὀνόματί σου
  choice: имени Твоему
  rationale: Сохранён библейский образ имени как носителя открытой людям Божьей чести и славы; перевод не сужает его до «репутации».
- source_word: Κύριε
  choice: Господи
  rationale: Русская звательная форма естественно передаёт прямое молитвенное обращение к Богу.
theological_decisions:
- issue: Слава Божьему имени
  choice: дай славу имени Твоему
  alternative: прославь имя Твоё
  rationale: Выбранный вариант сохраняет напряжённый библейский оборот исходного текста, где Бог призывается дать славу собственному имени, а не заменяет его толкующим глаголом.
- issue: Обращение κύριε
  choice: Господи
  alternative: Господь
  rationale: Форма «Господи» ясно передаёт звательное молитвенное обращение и не добавляет конфессионально специфического смысла.
translation_notes:
  register: Современный литературный русский с молитвенной торжественностью. Синтаксис остаётся ясным для обычного читателя; местоимения, относящиеся к Богу, написаны с прописной буквы как элемент принятого молитвенного регистра, без архаизации остальной фразы.
