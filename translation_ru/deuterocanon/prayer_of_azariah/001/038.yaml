  yaml_path: translation/deuterocanon/prayer_of_azariah/001/038.yaml
  text: Let every power bless the Lord[a]; sing praise and highly exalt him forever.
translation:
  language: ru
  text: Да благословит всякая сила Господа[a]; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все силы да благословят Господа». В греческом тексте «сила» стоит в единственном числе с «всякая»; выражение можно понимать распределительно или собирательно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογείτω
  choice: да благословит
  rationale: Форма третьего лица повелительного наклонения передана русской побудительной конструкцией с «да», естественной для торжественного призыва.
- source_word: πᾶσα ἡ δύναμις
  choice: всякая сила
  rationale: 'Сочетание единственного числа с πᾶσα передано буквально и естественно, с сохранением возможного распределительного смысла: каждая сила.'
- source_word: τὸν κύριον
  choice: Господа
  rationale: κύριος передано традиционным и понятным титулом «Господь»; падеж обусловлен управлением глагола.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол обозначает хвалу, выражаемую в песнопении; «воспевайте» сохраняет музыкальный и богослужебный оттенок.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Русский глагол передаёт усиленное значение греческого сложного глагола — возвеличивать чрезвычайно высоко.
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Господу; прописная буква соответствует принятому русскому благоговейному написанию.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Краткий идиоматический эквивалент, естественный для поэтического и литургического контекста.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — прямой, общеупотребительный библейский титул, не вносящий дополнительного конфессионального толкования.
- issue: Объём значения πᾶσα ἡ δύναμις
  choice: всякая сила
  alternative: все силы
  rationale: Единственное число греческого текста сохранено, при этом не уточняется, идёт ли речь об ангельских силах, природных могуществах или силах вообще.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, песнопевческим ритмом. Формы «воспевайте», «превозносите» и «вовеки» уместны в гимническом контексте и остаются понятными современному читателю.
