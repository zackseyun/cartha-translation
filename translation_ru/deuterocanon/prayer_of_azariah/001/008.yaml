  text: And now[a], all that you have brought upon us, and all that you have done to us, you have done in true judgment[b],
translation:
  language: ru
  text: И ныне всё, что Ты навёл на нас, и всё, что Ты сделал с нами, Ты сделал по справедливому суду[a],
