lexical_decisions:
- source_word: καὶ νῦν
  choice: И ныне
  rationale: Сохраняет соединительное καί и временное νῦν; «ныне» уместно для возвышенной молитвенной речи и понятно современному читателю.
- source_word: πάντα ὅσα
  choice: всё, что
  rationale: Естественно и полно передаёт всеохватное значение греческого оборота; повтор сохранён в обеих параллельных частях.
- source_word: ἐπήγαγες
  choice: Ты навёл
  rationale: «Навёл на нас» точно передаёт причинение или ниспослание постигшего бедствия, не уточняя сверх текста его карательный характер.
- source_word: ἐποίησας ἡμῖν
  choice: Ты сделал нам
  rationale: Сохраняет широкое значение ποιέω и дательный ἡμῖν. Контекст допускает неблагоприятный смысл, но перевод не заменяет его более узким «причинил».
- source_word: ἐν ἀληθινῇ κρίσει
  choice: по истинному суду
  rationale: Передаёт κρίσις как «суд», а ἀληθινῇ — как «истинный». Предлог «по» делает сочетание естественнее по-русски, сохраняя смысл действия в соответствии с истинным судом.
theological_decisions:
- issue: Оценка Божьих действий, постигших молящихся
  choice: Бедствия прямо отнесены к Божьим действиям и признаны совершёнными по истинному суду.
  alternative: «По справедливому суду» или «по праведному суду».
  rationale: Перевод не смягчает выраженную в греческом тексте Божью действенность и не развивает её в более полное учение о воздаянии; слово «истинному» сохраняет собственное значение ἀληθινῇ, не подменяя его толкованием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным оттенком. Местоимение «Ты» написано с прописной буквы как устойчивый русский способ почтительного обращения к Богу. Повтор «всё, что… и всё, что…» сохранён ради греческого параллелизма; конечная запятая отражает продолжение синтаксической фразы в следующем стихе.
