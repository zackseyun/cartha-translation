base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/034.yaml
  text: Bless the Lord[a], all the works of the Lord; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, все творения Господни; воспевайте и превозносите Его вовеки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во веки». Буквально по-гречески: «в века» — устойчивое выражение непрестанной, вечной хвалы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Повелительное наклонение множественного числа; «благословляйте» сохраняет литургическую и славословную силу греческого глагола и естественно звучит в русском библейском стиле.
- source_word: πάντα τὰ ἔργα Κυρίου
  choice: все творения Господни
  rationale: Обращение ко всей совокупности созданного Господом. «Творения» естественнее применительно к призываемым славить Бога небесным и земным реалиям, а форма «Господни» поддерживает возвышенный гимнический регистр.
- source_word: Κυρίου / τὸν κύριον
  choice: Господни / Господа
  rationale: Передаёт соответственно родительный падеж и прямое дополнение, сохраняя оба упоминания κύριος и ясную структуру рефрена.
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол обозначает хвалу в гимне или пении; «воспевайте» кратко и естественно передаёт эту песенную окраску.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Греческий сложный глагол выражает усиленное возвеличивание; «превозносите» сохраняет интенсивность и подходит возвышенному славословию.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивый греческий оборот выражает непрекращающуюся хвалу; «вовеки» естественно для русского гимнического и библейского регистра, при этом буквальный образ веков отмечен в сноске.
theological_decisions:
- issue: Передача κύριος в греческом гимне
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — обычное и контекстуально уместное соответствие κύριος в обращённом к Богу славословии; оснований заменять его более узким по оттенку словом «Владыка» нет.
- issue: Объём значения πάντα τὰ ἔργα Κυρίου
  choice: все творения Господни
  alternative: все дела Господа
  rationale: В контексте песни выражение обращено к составляющим творения, которым предлагается славить Господа. «Творения» делает это обращение понятным, не вводя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с возвышенным гимническим звучанием. Сохранены параллельные повелительные формы и повтор имени Господа; архаичность ограничена общеупотребительными в библейской поэзии формами «Господни» и «вовеки».
