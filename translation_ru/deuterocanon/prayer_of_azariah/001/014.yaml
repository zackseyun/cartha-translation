  yaml_path: translation/deuterocanon/prayer_of_azariah/001/014.yaml
  text: For[a], Master, we have become smaller than all the nations[b], and today we are humbled in all the earth because of our sins.
translation:
  language: ru
  text: Ибо, Владыка, мы стали меньше всех народов[a] и сегодня унижены на всей земле[b] из-за наших грехов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы были умалены более всех народов». Греческий глагол может указывать как на уменьшение, так и на утрату положения и значимости.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во всей стране». Греческое слово γῆ может означать как «землю», так и «страну».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα
  choice: Владыка
  rationale: Звательная форма δεσπότης обозначает властелина, обладающего полной властью. «Владыка» сохраняет отличие от обычного κύριος («Господь») и естественно звучит в молитвенном обращении.
- source_word: ἐσμικρύνθημεν
  choice: мы умалились
  rationale: Глагол означает стать малым, уменьшиться или утратить положение. «Умалились» сохраняет образ малости и не сводит смысл только к численности.
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: более всех народов
  rationale: 'При сравнительном значении глагола παρά вводит меру сравнения: народ стал малым сильнее, чем все прочие народы. В сноске дан более явный современный вариант.'
- source_word: ταπεινοὶ
  choice: унижены
  rationale: В контексте суда и общественного позора прилагательное описывает приниженное состояние, а не добродетель смирения.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: по всей земле
  rationale: γῆ может обозначать как землю вообще, так и страну. Широкий контекст сравнения со всеми народами позволяет сохранить «землю», не устраняя иной возможности.
- source_word: σήμερον
  choice: сегодня
  rationale: Прямой и естественный современный эквивалент временного наречия.
- source_word: διὰ τὰς ἁμαρτίας ἡμῶν
  choice: за наши грехи
  rationale: διά с винительным выражает причину; русское «за наши грехи» естественно передаёт причинную связь и признание вины.
theological_decisions:
- issue: Передача обращения δέσποτα
  choice: Владыка
  alternative: Господь; Повелитель
  rationale: «Владыка» передаёт оттенок верховной власти и сохраняет различие между δεσπότης и более обычным κύριος, не привнося конфессионально особого толкования.
- issue: Характер унижения народа
  choice: унижены
  alternative: смиренны; принижены
  rationale: Речь идёт о состоянии, вызванном грехами и судом, а не прежде всего о внутренней добродетели смирения.
translation_notes:
  register: Современный литературный русский с молитвенной торжественностью. «Владыка» и «умалились» сохраняют высокий регистр, оставаясь понятными; синтаксис близок к греческому, но естественен по-русски.
