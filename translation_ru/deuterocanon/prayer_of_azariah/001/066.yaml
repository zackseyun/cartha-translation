translation:
  language: ru
  text: Благодарите Господа, ибо Он благ, ибо милость Его — вовек.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его неизменная любовь пребывает вовеки». По-гречески буквально: «милость Его — вовек»; в этом богослужебном рефрене слово «милость» может также подразумевать постоянную, верную любовь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: Благодарите
  rationale: В литургическом рефрене глагол означает благодарить или воздавать хвалу, а не исповедовать грехи; «Благодарите» естественно передаёт этот смысл по-русски.
- source_word: τῷ κυρίῳ
  choice: Господа
  rationale: Прямое и традиционное соответствие греческому κύριος в данном контексте; форма обусловлена управлением русского глагола «благодарить».
- source_word: χρηστός
  choice: благ
  rationale: Краткое «благ» сохраняет возвышенный литургический характер устойчивой формулы и передаёт значение доброты, не сужая его до одной лишь доброжелательности.
- source_word: εἰς τὸν αἰῶνα
  choice: вовек
  rationale: Идиоматически передаёт буквальное «на век» и длительную непреходящесть; позволяет сохранить безглагольность греческой фразы.
- source_word: τὸ ἔλεος αὐτοῦ
  choice: милость Его
  rationale: «Милость» — прямое соответствие ἔλεος; порядок слов сохраняет торжественный рефрен, не вводя явно отсутствующее в греческом понятие заветной верности.
theological_decisions:
- issue: Передача возможных заветных оттенков ἔλεος в псалмоподобном рефрене
  choice: милость Его — вовек
  alternative: Его неизменная любовь пребывает вовеки
  rationale: Основной текст следует явному греческому ἔλεος («милость»), а более широкий оттенок постоянной, верной любви сохраняется в сноске, без подмены греческой лексики реконструируемым еврейским фоном.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным литургическим звучанием. Формула «Он благ» и наречие «вовек» понятны современному читателю и соответствуют жанру песнопения; местоимение «Его» написано с прописной буквы согласно принятой русской библейской традиции.
