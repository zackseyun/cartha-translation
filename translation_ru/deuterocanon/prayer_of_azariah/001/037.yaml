base_translation:
  language: en
  yaml_path: translation/deuterocanon/prayer_of_azariah/001/037.yaml
  text: Bless the Lord[a], waters and all that are above the heavens; sing praise to him and highly exalt him forever.
translation:
  language: ru
  text: Благословляйте Господа, воды и всё, что над небом[a]; воспевайте и превозносите Его вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, что выше неба». Греческое выражение может собирательно обозначать все небесные реалии, находящиеся над небом.'
    reason: Сохраняется возможный собирательно-космический смысл фразы πάντα τὰ ἐπάνω τοῦ οὐρανοῦ.
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: Благословляйте
  rationale: Множественное повелительное наклонение сохранено; «благословляйте» точно передаёт литургический призыв к творению и повторяющийся строй песни.
- source_word: ὕδατα
  choice: воды
  rationale: Сохранено множественное число и поэтическое обращение к водам как к части мироздания.
- source_word: πάντα τὰ ἐπάνω τοῦ οὐρανοῦ
  choice: всё, что над небом
  rationale: Передаёт субстантивированное среднее множественное как собирательное «всё» и сохраняет пространственный смысл ἐπάνω без добавления отсутствующих в греческом уточнений.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Обычный русский эквивалент греческого божественного титула κύριος; форма винительного падежа обусловлена глаголом «благословляйте».
- source_word: ὑμνεῖτε
  choice: воспевайте
  rationale: Глагол обозначает хвалу в песнопении; «воспевайте» естественно и сохраняет музыкально-литургический оттенок.
- source_word: ὑπερυψοῦτε
  choice: превозносите
  rationale: Русский глагол передаёт усиленное возвеличивание, выраженное приставочным греческим глаголом.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивое и достойное выражение вечной продолжительности в славословии.
theological_decisions:
- issue: Передача κύριος в греческой второканонической песни
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Исходный греческий текст содержит титул κύριος, а не непосредственно еврейское четырёхбуквенное имя; поэтому обычное «Господь» верно источнику и не вводит чуждую ему типографическую интерпретацию.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным литургическим звучанием. Параллельные повелительные формы сохраняют песенный ритм исходника; местоимение «Его» написано с прописной буквы по принятой русской библейской традиции.
