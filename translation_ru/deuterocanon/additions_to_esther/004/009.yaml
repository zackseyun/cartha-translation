lexical_decisions:
- source_word: Τί ἐστιν
  choice: Что с тобой?
  rationale: В данном обращении краткий греческий вопрос естественно передаётся по-русски как вопрос о состоянии Эсфири. Более буквальное «Что такое?» сохранено в примечании как возможный вариант.
- source_word: ἀδελφός
  choice: брат
  rationale: Основное значение греческого слова — «брат». Хотя здесь оно может обозначать родственника шире, основной текст сохраняет прямое семейное наименование.
- source_word: θάρσει
  choice: Мужайся!
  rationale: 'Краткое современное и достойное побуждение, передающее повелительное значение: обрести мужество и не бояться.'
- source_word: ἐγὼ ὁ ἀδελφός σου
  choice: Я твой брат
  rationale: Полное русское предложение передаёт выраженное местоимением ἐγώ смысловое усиление и успокаивающий характер слов.
theological_decisions:
- issue: Обозначение родства говорящего с Эсфирью
  choice: В основном тексте сохранено буквальное «брат».
  alternative: «родственник»
  rationale: Греческий текст прямо употребляет слово «брат», но контекст допускает более широкое понимание родства. Перевод не устраняет эту неоднозначность, а отмечает альтернативу в сноске.
translation_notes:
