    text: 'Буквально: «облеклась в свою славу». Вероятно, имеются в виду её великолепное царское одеяние и величественный облик.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγενήθη
  choice: И было
  rationale: Сохраняет греческую повествовательную формулу и её торжественный тон, не прибегая к чрезмерно архаичному «и случилось».
- source_word: ἐν τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: на третий день
  rationale: Естественная русская передача стандартного греческого обозначения времени.
- source_word: ὡς ἐπαύσατο προσευχομένη
  choice: когда она закончила молиться
  rationale: Передаёт завершённость молитвы перед последующими действиями; по-русски звучит естественнее буквального «перестала молиться».
- source_word: ἐξεδύσατο τὰ ἱμάτια
  choice: она сняла одежды
  rationale: Точно передаёт снятие одежды и сохраняет достойный литературный регистр.
- source_word: τῆς θεραπείας
  choice: своего служения
  rationale: Сохраняет широкое значение θεραπεία — служение, прислуживание или религиозное усердие — без сведения его исключительно к богослужению.
- source_word: περιεβάλετο
  choice: облеклась
  rationale: Передаёт образ облачения и соответствует возвышенному регистру сцены; дополнение «в» естественно сочетается с «великолепие».
- source_word: τὴν δόξαν αὐτῆς
  choice: в своё великолепие
  rationale: В контексте переодевания указывает на видимое царственное убранство и величие; «великолепие» избегает возможного отвлечённо-богословского оттенка слова «слава».
theological_decisions:
- issue: Значение τῆς θεραπείας применительно к одеждам Есфири
  choice: одежды своего служения
  alternative: одежды поклонения / одежды прислуживания
  rationale: Греческое слово допускает служение, прислуживание и религиозное усердие. Широкая формулировка сохраняет неоднозначность и не утверждает без достаточных оснований, что речь идёт о формальном богослужебном облачении.
- issue: Значение τὴν δόξαν αὐτῆς
  choice: своё великолепие
  alternative: свою славу
  rationale: Непосредственный контекст смены одежды перед явлением к царю делает наиболее вероятным указание на царственное убранство и внешний блеск, однако буквальная возможность «слава» отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Формула «И было» и глагол «облеклась» сохраняют торжественность сцены, оставаясь понятными обычному читателю.
