lexical_decisions:
- source_word: ἐτηρείδετο
  choice: содержали под надзором
  rationale: Имперфект передаёт продолжительное состояние, а пассивная форма τηρέω — то, что женщину держали или сохраняли под присмотром. Формулировка не уточняет, был ли этот надзор охраной или ограничением свободы.
- source_word: τρυφερευομένη
  choice: словно окружая её роскошью
  rationale: Причастие связано с изнеженной, мягкой или роскошной жизнью. Выбор передаёт оказываемое ей привилегированное обращение и сохраняет оттенок ὡς — «словно, как будто».
- source_word: καὶ τῇ μὲν μιᾷ ... ἡ δὲ
  choice: и одну ... а другую —
  rationale: Соотносительная конструкция μὲν...δὲ противопоставляет двух женщин. Винительный падеж в русском обусловлен естественным управлением выбранной глагольной конструкции; тире сохраняет незавершённость фрагмента.
