    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока она не оправилась».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «мирными словами» или «успокаивающими словами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετέβαλεν
  choice: смягчил
  rationale: В сочетании с εἰς πραΰτητα глагол обозначает произведённую Богом перемену к кротости; по-русски «смягчил» естественно и ёмко передаёт всю конструкцию.
- source_word: τὸ πνεῦμα τοῦ βασιλέως
  choice: дух царя
  rationale: Формально сохраняет πνεῦμα и прямое указание на внутреннюю перемену царя, не сводя её однозначно к мыслям или настроению.
- source_word: εἰς πραΰτητα
  choice: смягчил
  rationale: Значение кротости и мягкости включено в естественную русскую глагольную конструкцию; буквальное «изменил к кротости» звучало бы неестественно.
- source_word: ἀγωνιάσας
  choice: в тревоге
  rationale: Передаёт сильное беспокойство царя в контексте обморока Есфири, не приписывая ему более узко определённого переживания.
- source_word: ἀνεπήδησεν
  choice: вскочил
  rationale: Точно и живо выражает внезапное движение вверх с престола.
- source_word: ἀνέλαβεν αὐτὴν ἐπὶ τὰς ἀγκάλας αὐτοῦ
  choice: подхватил её на руки
  rationale: 'Естественно передаёт физическое действие: царь принимает ослабевшую Есфирь на руки.'
- source_word: μέχρις οὗ κατέστη
  choice: пока она не пришла в себя
  rationale: Контекстуально передаёт возвращение Есфири в устойчивое состояние, сохраняя в сноске более буквальную возможность.
- source_word: παρεκάλει
  choice: утешая
  rationale: Имперфект описывает продолжавшееся ободряющее обращение; деепричастная конструкция естественно связывает его с тем временем, пока царь держал Есфирь.
- source_word: λόγοις εἰρηνικοῖς
  choice: мирными словами
  rationale: Сохраняет явную лексическую связь с миром и не сужает выражение исключительно до заверения или успокоения.
theological_decisions:
- issue: Божье воздействие на внутреннее состояние царя
  choice: И Бог смягчил дух царя
  alternative: И Бог смягчил нрав царя / изменил мысли царя
  rationale: Греческий текст прямо называет Бога деятелем и использует широкое слово πνεῦμα. Основной текст сохраняет как прямую божественную причинность, так и богословски ёмкое «дух», а психологические толкования вынесены в сноску.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Короткое первое предложение подчёркивает Божье действие; последующая фраза сохраняет динамику царской реакции. Все сноски отмечены в основном тексте.
