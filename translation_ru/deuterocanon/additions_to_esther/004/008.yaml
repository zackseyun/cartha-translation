  text: And God changed the king’s spirit to gentleness[a], and in anguish he sprang up from his throne and took her into his arms until she recovered[c][b], and he comforted her with peaceful words.
translation:
  language: ru
  text: И Бог смягчил дух царя, сделав его кротким[a]. В смятении царь вскочил с престола, взял её на руки, пока она не пришла в себя[b], и утешал её словами мира[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
