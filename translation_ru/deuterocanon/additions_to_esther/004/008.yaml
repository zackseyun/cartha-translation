  - severity: low
    issue: «Подхватил её на руки и держал» содержит излишний оттенок.
    rationale: «Подхватил» может предполагать падение, а «держал» — отдельное продолжительное действие. ἀνέλαβεν описывает взятие её на руки; временная граница «пока она не пришла в себя» относится к этому действию без необходимости добавлять эти оттенки.
