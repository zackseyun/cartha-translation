    issue: «призвала Бога»
    rationale: Греческое ἐπικαλεσαμένη означает призывать/взывать к Богу, то есть обращаться к Нему в молитве. Русское «призвала Бога» чаще означает позвать Его; «воззвав к Богу» передаёт нужное значение и регистр.
