lexical_decisions:
- source_word: γενηθεῖσα ἐπιφανής
  choice: явившись
  rationale: Естественно передаёт наступление открытого появления Эсфири; буквальное «став видимой» по-русски звучит неестественно. Сноска сохраняет более формальную возможность.
- source_word: ἐπικαλεσαμένη
  choice: призвала
  rationale: В молитвенном контексте означает обращение к Богу, призывание его; деепричастная последовательность по-русски естественно развёрнута в однородное сказуемое.
- source_word: τὸν πάντων ἐπόπτην θεὸν
  choice: Бога, надзирающего за всеми
  rationale: Передаёт ἐπόπτης как того, кто наблюдает за всеми и заботливо надзирает, не превращая выражение только в указание на всеведение.
- source_word: σωτῆρα
  choice: Спасителя
  rationale: Сохраняет возвышенное религиозное наименование и прямой смысл σωτήρ.
- source_word: παρέλαβεν
  choice: взяла с собой
  rationale: В данном контексте глагол обозначает, что Эсфирь берёт сопровождающих вместе с собой, а не просто берёт их физически.
- source_word: τὰς δύο ἅβρας
  choice: двух служанок
  rationale: ἅβραι здесь — молодые женщины-прислужницы, сопровождающие Эсфирь; «служанки» понятно современному читателю.
theological_decisions:
- issue: Соотношение наименований ἐπόπτην и σωτῆρα при θεόν
  choice: Бога, надзирающего за всеми и Спасителя
  alternative: всевидящего Бога и Спасителя
  rationale: Сохранены два самостоятельных определения Бога — его надзор над всеми и его роль Спасителя; ἐπόπτης не сведено исключительно к всеведению.
translation_notes:
