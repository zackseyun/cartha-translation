lexical_decisions:
- source_word: ἐρυθριῶσα
  choice: заливаясь румянцем
  rationale: Передаёт настоящее причастие со значением заметного покраснения лица и естественно звучит по-русски.
- source_word: ἀκμῇ κάλλους αὐτῆς
  choice: в расцвете своей красоты
  rationale: ἀκμή обозначает высшую пору, полноту или расцвет; сочетание сохраняет образ красоты, достигшей своей полноты.
- source_word: τὸ πρόσωπον αὐτῆς ἱλαρὸν
  choice: сохраняла на лице ... радостное выражение
  rationale: ἱλαρός применительно к лицу указывает на светлый, радостный вид; глагольная перестройка делает фразу естественной в современном русском.
- source_word: ὡς προσφιλές
  choice: приветливое
  rationale: προσφιλής может значить «милый, приятный, располагающий к себе»; в описании лица «приветливое» передаёт видимую дружелюбность, а сравнительное ὡς отмечено в сноске.
- source_word: ἡ δὲ καρδία αὐτῆς ἀπεστενωμένη
  choice: но сердце её сжималось
  rationale: Сохраняет телесно-метафорический образ внутренней стеснённости, не сводя его к общему «тревожилась».
- source_word: ἀπὸ τοῦ φόβου
  choice: от страха
  rationale: Прямо передаёт источник или причину состояния.
