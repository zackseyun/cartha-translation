  text: For you are wonderful[a], Lord, and your face is full of grace.
translation:
  language: ru
  text: Ведь Ты дивен, Господи, и лицо Твоё полно благодати.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лицо Твоё полно милости»; возможно также: «Твоё присутствие полно благоволения».'
    reason: 'Лексическая неоднозначность πρόσωπον и χάρις: первое может означать как «лицо», так и «присутствие», а второе — «благодать», «милость» или «благоволение».'
lexical_decisions:
- source_word: ὅτι
  choice: ведь
  rationale: Союз вводит основание сказанного в молитвенном контексте; «ведь» естественно передаёт причинно-пояснительную связь, не делая её чрезмерно жёсткой.
- source_word: θαυμαστὸς
  choice: дивен
  rationale: Прилагательное означает «удивительный, достойный изумления». «Дивен» сохраняет оттенок благоговейного восхищения и уместен в возвышенной молитвенной речи.
- source_word: κύριε
  choice: Господи
  rationale: Форма звательного обращения к Богу естественно передаётся традиционным русским обращением «Господи».
- source_word: πρόσωπόν
  choice: лицо
  rationale: Сохранено прямое значение слова и исходный антропоморфный образ; более отвлечённое «присутствие» не вводится в основной текст.
- source_word: χαρίτων
  choice: благодати
  rationale: Родительный падеж множественного числа χάρις может обозначать благодатные качества, милости или благоволение. Русское собирательное «благодать» естественно сочетается со словами «полно благодати» и сохраняет богословскую насыщенность выражения.
- source_word: μεστόν
  choice: полно
  rationale: Точно и естественно передаёт значение «наполнено, исполнено» и согласуется со словом «лицо».
theological_decisions:
- issue: Антропоморфное выражение «лицо Твоё» применительно к Богу
  choice: Сохранить буквальный образ «лицо Твоё»
  alternative: «Твоё присутствие» или «Твой лик»
  rationale: Греческое πρόσωπον прямо означает «лицо». Перевод сохраняет образность и не разрешает её отвлечённым богословским пересказом.
- issue: Значение χάρις в описании Божьего лица
  choice: «благодать»
  alternative: «милость», «благоволение» или «благосклонность»
  rationale: Контекст допускает несколько близких оттенков. «Благодать» сохраняет ёмкость исходного слова, тогда как возможные значения «милость» и «благоволение» отмечены в сноске.
translation_notes:
  register: Современный литературный русский с возвышенным молитвенным оттенком. Формы «Ты» и «Твоё» написаны с прописной буквы как уважительное обращение к Богу. «Дивен» выбрано вместо более разговорного «удивителен», чтобы сохранить краткость и благоговейный тон оригинала.
