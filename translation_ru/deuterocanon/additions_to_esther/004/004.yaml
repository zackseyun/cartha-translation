lexical_decisions:
- source_word: ἑτέρα
  choice: другая
  rationale: Форма женского рода указывает на ещё одну женщину, по контексту — служанку; краткое «другая» не добавляет отсутствующего в данном фрагменте существительного.
- source_word: ἐπηκολούθει
  choice: шла следом
  rationale: Имперфект передаёт продолжавшееся следование; выражение естественно по-русски и сохраняет пространственный смысл глагола.
- source_word: κουφίζουσα
  choice: поддерживая
  rationale: Причастие означает облегчать тяжесть или снимать бремя. В сочетании с одеждой «поддерживая» естественно передаёт действие служанки, приподнимающей одежду и тем самым облегчающей её тяжесть.
- source_word: τὴν ἔνδυσιν αὐτῆς
  choice: её одежду
  rationale: ἔνδυσις обозначает одежду или одеяние и может иметь собирательный смысл; «её одежду» точно и понятно без неоправданного уточнения.
- source_word: καὶ αὐτὴ
  choice: а она
  rationale: Сочетание открывает незавершённую здесь следующую фразу. «А она» сохраняет переход и не восполняет отсутствующее продолжение.
