  yaml_path: translation/deuterocanon/additions_to_esther/004/013.yaml
  text: And he said to him[a], “I saw you, lord, like an angel of God, and my heart was troubled with fear because of your glory.”
translation:
  language: ru
  text: 'И она сказала ему: «Я увидела тебя, господин, словно ангела Божьего, и сердце моё смутилось от страха перед твоим величием»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от страха перед твоей славой». Греческое δόξα может означать как «славу», так и явленное величие или великолепие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ
  choice: И она сказала ему
  rationale: Форма εἶπεν сама по себе не обозначает род подлежащего, однако ближайший повествовательный контекст ясно указывает на Есфирь; русская грамматика требует обозначить род.
- source_word: Εἶδόν σε
  choice: Я увидела тебя
  rationale: Аорист передан простым прошедшим временем; женский род обусловлен тем, что говорит Есфирь.
- source_word: κύριε
  choice: господин мой
  rationale: Это почтительное обращение Есфири к царю, а не божественный титул. Добавление «мой» естественно передаёт русскую форму почтительного обращения без изменения референта.
- source_word: ὡς
  choice: словно
  rationale: «Словно» естественно выражает сравнение и не отождествляет царя с ангелом.
- source_word: ἄγγελον θεοῦ
  choice: ангела Божьего
  rationale: Безартиклевая форма имеет здесь неопределённо-сравнительный смысл; «ангел» соответствует образу небесного великолепия.
- source_word: ἐταράχθη ἡ καρδία μου
  choice: сердце моё смутилось
  rationale: Сохранён греческий образ сердца как средоточия внутренних чувств; «смутилось» передаёт внутреннее потрясение без избыточного усиления.
- source_word: ἀπὸ φόβου τῆς δόξης σου
  choice: от страха перед твоим величием
  rationale: Генитив после φόβος естественно передан оборотом «страх перед»; δόξα в данном контексте означает внушающее трепет царственное величие и видимый блеск.
theological_decisions:
- issue: К кому относится обращение κύριε
  choice: 'Человеческий правитель: «господин мой» со строчной буквы'
  alternative: Божественный титул «Господь»
  rationale: В непосредственном контексте Есфирь обращается к царю. Написание со строчной буквы не создаёт ошибочного отождествления царя с Богом.
- issue: Характер сравнения с ангелом Божьим
  choice: 'Сравнение: «словно ангела Божьего»'
  alternative: 'Отождествление: «как ангела Божьего» в значении роли или сущности'
  rationale: ὡς допускает разные оттенки, но здесь описание страха перед царским величием указывает на уподобление, а не на утверждение, что царь является ангелом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис близок к греческому, но естественен по-русски; сохранены образ сердца и сравнительный характер высказывания.
