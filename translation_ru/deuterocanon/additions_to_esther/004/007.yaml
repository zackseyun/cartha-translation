  text: '...entirely covered with gold and costly stones, and he was very terrifying. And lifting up his face, blazing with splendor at the height of anger, he looked; and the queen fell and changed color in faintness, and she bent down upon the head of the delicate maidservant who was going before her.'
translation:
  language: ru
  text: …[a] весь в золоте и драгоценных камнях[b], он был очень грозен. Подняв своё лицо, пылавшее величием в пылу гнева, он взглянул. Царица упала; цвет её лица изменился от слабости[c], и она склонилась на голову изящной служанки, шедшей впереди неё.
