lexical_decisions:
- source_word: ὅλος διὰ χρυσοῦ καὶ λίθων πολυτελῶν
  choice: весь в золоте и драгоценных камнях
  rationale: Передаёт роскошный облик царя, не добавляя отсутствующего в сохранившемся отрывке упоминания об одежде; начальная эллиптичность отмечена многоточием.
- source_word: φοβερὸς σφόδρα
  choice: внушал великий ужас
  rationale: Естественно и с достаточной силой передаёт чрезвычайно устрашающий вид царя.
- source_word: ἄρας τὸ πρόσωπον αὐτοῦ
  choice: подняв своё лицо
  rationale: Сохраняет конкретный телесный жест, выраженный в греческом тексте.
- source_word: πεπυρωμένον δόξῃ
  choice: пылавшее величием
  rationale: Сочетает огненный образ причастия с царственным смыслом δόξα; слово «слава» здесь звучало бы менее естественно применительно к выражению лица.
- source_word: ἐν ἀκμῇ θυμοῦ
  choice: в пылу гнева
  rationale: Современный русский оборот передаёт гнев в его полной силе и сохраняет огненную образность контекста.
- source_word: μετέβαλε τὸ χρῶμα αὐτῆς ἐν ἐκλύσει
  choice: побледнев от слабости
  rationale: Передаёт видимую перемену цвета лица и состояние изнеможения; точнее по-русски, чем буквальное «изменилась в цвете».
- source_word: κατέκυψεν ἐπὶ τὴν κεφαλὴν
  choice: склонилась головой на
  rationale: Описывает непроизвольное физическое оседание, не придавая движению значения почтительного поклона.
- source_word: ἅβρας
  choice: служанку
  rationale: В данном контексте субстантивированное ἁβρά обозначает придворную служанку; оттенок изнеженности или утончённости несущественен и по-русски звучал бы неестественно.
- source_word: τῆς προπορευομένης
  choice: шедшую впереди неё
  rationale: Ясно передаёт положение служанки в шествии перед царицей.
