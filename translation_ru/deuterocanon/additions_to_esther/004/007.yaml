- issue: Фрагментарное начало предоставленного греческого сегмента
  choice: Начать перевод с многоточия и не восполнять отсутствующий сказуемый
  alternative: Добавить «он был одет» или «на нём было одеяние»
  rationale: Предоставленный текст начинается в середине описания; многоточие честно сохраняет неполноту источника и не превращает вероятную реконструкцию в основной текст.
