  text: И царь был встревожен, а вся его свита ободряла её.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утешала её»; возможен также смысл «побуждала её». Греческий глагол может обозначать ободрение, утешение, увещание или побуждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράσσετο
  choice: был встревожен
  rationale: Имперфект передаёт продолжавшееся внутреннее смятение царя; «был встревожен» звучит естественно и не усиливает состояние до паники.
- source_word: πᾶσα ἡ θεραπεία αὐτοῦ
  choice: все его придворные
  rationale: В придворном контексте коллективное θεραπεία обозначает людей, состоящих при царе; этот перевод ясен современному читателю и сохраняет совокупный смысл выражения.
- source_word: παρεκάλει αὐτήν
  choice: ободряли её
  rationale: παρακαλέω может означать ободрять, утешать, убеждать или побуждать. По контексту «ободряли» естественно выражает оказываемую ей поддержку, не исключая оттенка побуждения.
