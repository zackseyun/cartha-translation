    text: 'Или: «через все врата» — если речь идёт не о внутренних дверях, а о последовательных дворцовых проходах.'
    reason: lexical_alternative
  - marker: b
    text: Предоставленный греческий текст внезапно обрывается на ἐνεδεΒ — по-видимому, внутри глагольной формы со значением «был облачён» или «надел». Перевод передаёт наиболее вероятный смысл сохранившейся фразы.
    reason: textual_variant
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: пройдя
  rationale: Аористное причастие обозначает предшествующее действие; деепричастие естественно связывает вход Эсфири с тем, что она предстала перед царём.
- source_word: πάσας τὰς θύρας
  choice: через все двери
  rationale: Сохраняет обычное значение θύρα и передаёт движение через ряд дверей; в дворцовом контексте возможен смысл «врата» или «проходы», отмеченный в сноске.
- source_word: κατέστη ἐνώπιον τοῦ βασιλέως
  choice: она предстала перед царём
  rationale: κατέστη здесь описывает, как она заняла место стоя перед царём. «Предстала» естественно и уместно для придворной сцены.
- source_word: θρόνου τῆς βασιλείας αὐτοῦ
  choice: престоле своего царства
  rationale: Формально близко передаёт родительную конструкцию, не сводя её без необходимости к прилагательному «царском».
- source_word: πᾶσαν στολὴν τῆς ἐπιφανείας αὐτοῦ
  choice: во всё своё великолепное одеяние
  rationale: στολή означает одеяние или облачение, а ἐπιφάνεια здесь указывает на его зримое великолепие. Русская формулировка передаёт царскую пышность без богословской терминологизации слова ἐπιφάνεια.
- source_word: ἐνεδεΒ
  choice: облачённый
  rationale: Предоставленный греческий текст обрывается внутри глагольной формы, которая, по контексту, вероятнее всего означает «был облачён» или «надел»; причастная конструкция естественно согласуется с предшествующим ἐκάθητο.
