translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным регистром. «Предстала» и «престол» поддерживают придворную обстановку; синтаксис разделён на два предложения ради ясности. Неясность оборванного греческого текста явно отмечена, а лексическая неоднозначность θύρα сохранена в сноске.
