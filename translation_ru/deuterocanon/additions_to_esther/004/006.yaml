  text: And after she had gone in through all the doors[a], she stood before the king; and he was sitting on the throne of his kingdom[b], and was clothed in all the splendor of his majesty.
translation:
  language: ru
  text: Пройдя через все двери[a], она предстала перед царём. Он сидел на престоле своего царства, облачённый во всё своё великолепное одеяние[b].
  philosophy: optimal-equivalence
  footnotes:
