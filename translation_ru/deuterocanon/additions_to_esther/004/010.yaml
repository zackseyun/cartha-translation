lexical_decisions:
- source_word: οὐ μὴ ἀποθάνῃς
  choice: Ты ни в коем случае не умрёшь
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание будущего события; русский оборот передаёт категорическое заверение.
- source_word: κοινὸν
  choice: общий
  rationale: 'Сохраняет краткость и неоднозначность греческого слова: указ может пониматься как общий, публичный или относящийся ко всем, без преждевременного выбора одного толкования.'
- source_word: πρόσταγμα
  choice: указ
  rationale: В царском контексте обозначает властное предписание; «указ» естественен в современном литературном русском языке.
