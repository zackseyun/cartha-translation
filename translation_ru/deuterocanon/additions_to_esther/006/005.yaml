lexical_decisions:
- source_word: ἔθνη
  choice: народы
  rationale: В контексте Есфири слово обозначает неиудейские народы; «народы» естественно и не вносит дополнительной конфессиональной окраски.
- source_word: ἐπισυναχθέντα
  choice: собрались
  rationale: Причастие имеет пассивную форму и выражает совместное собирание. Русское «собрались» естественно передаёт результат, а формально-пассивный вариант отмечен в сноске.
- source_word: ἀπολέσαι
  choice: чтобы уничтожить
  rationale: Инфинитив выражает цель. «Уничтожить» сохраняет широкое значение греческого глагола, не усиливая его до более узкого «истребить».
- source_word: τὸ ὄνομα
  choice: имя
  rationale: Сохранён буквальный библейский образ; его идиоматический смысл поясняется в сноске.
- source_word: Ἰουδαίων
  choice: иудеев
  rationale: В повествовании об Есфири речь идёт об иудейском народе; «иудеи» — ясное и традиционное русское обозначение в данном историческом контексте.
theological_decisions:
- issue: Идиоматический смысл выражения «уничтожить имя иудеев»
  choice: Сохранить в основном тексте буквальный образ «уничтожить имя иудеев».
  alternative: «стереть память об иудеях»; «истребить иудеев без остатка»
  rationale: Выражение может означать уничтожение народа и самой памяти о нём, однако буквальная передача сохраняет образность и не устраняет присущую оригиналу смысловую ёмкость.
translation_notes:
  register: Современный литературный русский язык; краткая, связная формулировка, сохраняющая библейский образ оригинала. Начальное «а» передаёт греческое δὲ и связь с предшествующим противопоставлением.
