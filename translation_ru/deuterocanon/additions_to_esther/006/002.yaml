  text: For I remembered the dream that I saw concerning these matters[a], for not a word of them has passed by.
translation:
  language: ru
  text: Ведь я вспомнил сон, который видел об этих событиях[a], ведь ни одно слово о них не ускользнуло от меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «об этих словах». Последняя фраза буквально: «ибо ни одно слово из них не прошло мимо»; возможно, имеется в виду, что ничто из увиденного во сне не осталось без исполнения.'
    reason: Лексическая и смысловая неоднозначность λόγοι и оборота с παρῆλθεν; примечание сохраняет более буквальное чтение и возможное значение исполнения, не навязывая его основному тексту.
lexical_decisions:
- source_word: ἐμνήσθην
  choice: я вспомнил
  rationale: Аористная форма имеет активное значение; это естественная передача воспоминания о прежнем сне.
- source_word: ἐνυπνίου
  choice: сон
  rationale: Существительное прямо обозначает сон; добавление «видение» излишне сужало бы смысл.
- source_word: περὶ τῶν λόγων τούτων
  choice: об этих событиях
  rationale: λόγοι здесь может обозначать не только слова, но и дела или события, к которым относился сон; контекстуально «событиях» звучит естественно.
- source_word: οὐδὲ γὰρ παρῆλθεν ἀπʼ αὐτῶν λόγος
  choice: ни одно слово из него не прошло мимо
  rationale: Передача сохраняет образное и несколько сжатое выражение греческого текста, не превращая его однозначно в утверждение об исполнении пророчества.
theological_decisions:
- issue: Смысл оборота οὐδὲ ... παρῆλθεν ἀπʼ αὐτῶν λόγος
  choice: ни одно слово из него не прошло мимо
  alternative: ничто из предсказанного во сне не осталось неисполненным
  rationale: 'Более буквальная формулировка сохраняет неоднозначность: речь может идти как о том, что ни одна подробность не была упущена, так и о том, что всё увиденное сбылось.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Причинное γάρ передано словом «ведь», а второе γάρ — пояснительным двоеточием, чтобы избежать тяжеловесного повтора.
