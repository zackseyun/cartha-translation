lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Естественно передаёт причинно-следственную связь и пояснительную силу греческого оборота.
- source_word: ἐποίησεν
  choice: изготовил
  rationale: Сохраняет общее значение «сделал», не подменяя его более специальным «бросил»; в сочетании со жребиями по-русски звучит ясно.
- source_word: κλήρους δύο
  choice: два жребия
  rationale: κλῆρος обозначает жребий как средство определения исхода; числительное сохранено для структуры противопоставления.
- source_word: ἕνα τῷ λαῷ τοῦ θεοῦ
  choice: один — для народа Божьего
  rationale: Близко передаёт греческую конструкцию и сохраняет её богословское обозначение общины.
- source_word: ἕνα πᾶσι τοῖς ἔθνεσιν
  choice: другой — для всех народов
  rationale: Передаёт собирательное значение ἔθνη и сохраняет контраст с народом Божьим, не сужая его в основном тексте до термина «язычники».
theological_decisions:
- issue: Передача ἔθνεσιν в противопоставлении народу Божьему
  choice: для всех народов
  alternative: для всех язычников
  rationale: «Народы» сохраняет широкий лексический смысл и богословское напряжение между народом Божьим и остальными народами; контекстуально возможное «язычники» вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык; фраза торжественная, но понятная. Двоеточие и параллельная конструкция «один — …, другой — …» естественно передают структуру греческого предложения.
