  language: ru
  text: 'И сказал Мардохей: «Всё это произошло от Бога».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё это пришло от Бога»; γίνομαι также можно передать как «прийти».'
