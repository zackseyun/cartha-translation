lexical_decisions:
- source_word: οἱ δύο κλῆροι οὗτοι
  choice: оба эти жребия
  rationale: «Жребия» сохраняет конкретный образ κλῆροι — того, что определяется или достаётся по жребию, — не сводя его заранее к более толковательному «две участи». Порядок слов сделан естественным для русского языка.
- source_word: ἦλθον
  choice: пришли
  rationale: Прямо передаёт аорист ἔρχομαι. Вариант «выпали» был бы естественен рядом со словом «жребий», но привнёс бы отсутствующий в греческом тексте образ бросания жребия.
- source_word: εἰς ὥραν καὶ καιρόν
  choice: к своему часу и сроку
  rationale: Сочетание передаёт определённый час и надлежащий срок. «Своему» естественно выражает контекстуальную определённость момента, не делая καιρός исключительно техническим «назначенным временем».
- source_word: εἰς ἡμέραν κρίσεως
  choice: ко дню суда
  rationale: Кратко и естественно передаёт направительное εἰς и судебный смысл κρίσις; тире показывает, что «день суда» уточняет названные ранее час и срок.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: пред Богом
  rationale: Сохраняет торжественный и судебный оттенок выражения ἐνώπιον, оставаясь понятным в современном литературном русском.
- source_word: καὶ πᾶσι τοῖς ἔθνεσιν
  choice: и для всех народов
  rationale: У существительного «народы» стоит дательный падеж, поэтому его нельзя безоговорочно подчинить ἐνώπιον, требующему родительного. «Для всех народов» сохраняет дательный отношения/заинтересованности и передаёт всеобщий охват суда.
theological_decisions:
- issue: Значение κλῆροι в контексте
  choice: буквальное «жребия» с неразъяснённой в основном тексте образной силой
  alternative: «участи», «судьбы» или «уделы»
  rationale: В контексте жребии, вероятно, обозначают две противопоставленные участи, однако греческое слово сохраняет конкретный образ жребия. Перевод не должен преждевременно устранять эту смысловую напряжённость.
- issue: Связь καὶ πᾶσι τοῖς ἔθνεσιν с предшествующей фразой
  choice: «и для всех народов»
  alternative: «пред Богом и всеми народами»
  rationale: Форма πᾶσι τοῖς ἔθνεσιν является дательной, тогда как ἐνώπιον обычно управляет родительным, как в τοῦ θεοῦ. Поэтому перевод различает «пред Богом» и «для всех народов», не исправляя морфологическую неоднозначность по английскому образцу.
translation_notes:
  register: Современный литературный русский с торжественной, но ясной библейской интонацией. «Пред Богом» выбрано ради краткости и судебной окраски; архаичные формы и конфессионально окрашенная терминология не используются.
