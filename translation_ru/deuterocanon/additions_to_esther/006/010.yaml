  text: And these days shall be for them in the month of Adar[a], on the fourteenth and on the fifteenth of the same month, with assembly and joy and gladness before God[b], throughout the generations forever among his people Israel.
translation:
  language: ru
  text: И эти дни в месяце адаре — четырнадцатый и пятнадцатый дни этого месяца — будут для них днями собрания, радости и ликования перед Богом, из поколения в поколение, навеки, среди Его народа Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται
  choice: будут
  rationale: Будущее время глагола εἰμί передано прямо; оно сохраняет торжественный, установительный тон.
- source_word: αἱ ἡμέραι αὗται
  choice: эти дни
  rationale: Прямой и естественный эквивалент указательного словосочетания.
- source_word: ἐν μηνὶ Ἀδάρ
  choice: в месяце адаре
  rationale: Название иудейского месяца передано традиционной русской транслитерацией и оформлено по нормам современного русского языка.
- source_word: τῇ τεσσαρεσκαιδεκάτῃ καὶ τῇ πεντεκαιδεκάτῃ τοῦ αὐτοῦ μηνός
  choice: четырнадцатый и пятнадцатый дни этого месяца
  rationale: Календарное значение порядковых числительных выражено явно; повторное указание на месяц сохранено.
- source_word: μετὰ συναγωγῆς
  choice: днями собрания
  rationale: В контексте празднования συναγωγή означает совместное собрание общины, а не здание синагоги. Синтаксическая перестройка делает фразу естественной по-русски.
- source_word: χαρᾶς καὶ εὐφροσύνης
  choice: радости и ликования
  rationale: Два близких существительных сохранены раздельно; «ликование» передаёт усиленный праздничный оттенок εὐφροσύνη.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: перед Богом
  rationale: Краткое традиционное выражение сохраняет прямую богословскую направленность празднования.
- source_word: εἰς γενεὰς εἰς τὸν αἰῶνα
  choice: во все поколения, навеки
  rationale: 'Сохранены оба элемента усиленной формулы длительности: преемственность поколений и непрекращающийся характер установления.'
- source_word: ἐν τῷ λαῷ αὐτοῦ Ἰσραήλ
  choice: среди Его народа Израиля
  rationale: Предлог ἐν при обозначении народа естественно передан словом «среди»; принадлежность народа Богу сохранена без добавочного толкования.
theological_decisions:
- issue: Сохранение явного упоминания Бога в описании празднования
  choice: перед Богом
  alternative: в присутствии Бога
  rationale: В греческом тексте прямо стоит τοῦ θεοῦ, поэтому празднование представлено не только как общественное, но и как совершаемое перед Богом.
- issue: Передача длительности εἰς γενεὰς εἰς τὸν αἰῶνα
  choice: во все поколения, навеки
  alternative: из поколения в поколение вовеки
  rationale: Выбранная формулировка не сводит двойное выражение к одному понятию и сохраняет его усилительную силу.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным установительным тоном. Греческий порядок слов умеренно перестроен ради естественного русского синтаксиса; смысловые повторы и богословская направленность сохранены.
