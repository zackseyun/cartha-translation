  yaml_path: translation/deuterocanon/additions_to_esther/006/006.yaml
  text: But my people—that is[a], Israel—are those who cried out to God and were saved. And the Lord saved his people, and the Lord rescued us from all these evils, and God did the signs and the great wonders that have not happened among the nations.
translation:
  language: ru
  text: Но мой народ — то есть Израиль — это те, кто воззвали к Богу[a] и были спасены. Господь спас Свой народ, и Господь избавил нас от всех этих бедствий, и Бог совершил знамения и великие чудеса, каких не бывало среди народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратились к Богу за помощью». Греческое выражение необычно, но по контексту смысл в том, что Израиль просил Бога о помощи и был Им спасён.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ἔθνος τὸ ἐμόν
  choice: мой народ
  rationale: Хотя ἔθνος может означать «народ» или «племя», здесь речь о народе говорящего, непосредственно отождествлённом с Израилем. «Мой народ» естественно передаёт собирательный и заветный смысл без ассоциации с современным государством.
- source_word: οὗτός ἐστιν Ἰσραήλ
  choice: это Израиль
  rationale: Сохранено прямое и подчёркнутое отождествление народа с Израилем.
- source_word: οἱ βοηθήσαντες πρὸς τὸν θεόν
  choice: те, кто воззвал к Богу
  rationale: Греческое сочетание необычно; контекст спасения указывает на обращение к Богу за помощью, а не на оказание помощи Богу. «Воззвал к Богу» естественно выражает мольбу об избавлении.
- source_word: σωθέντες / ἔσωσεν
  choice: был спасён / спас
  rationale: Повтор корня сохранён, чтобы передать лексическую связь между пассивным причастием и последующим личным глаголом.
- source_word: ἐρρύσατο
  choice: избавил
  rationale: «Избавил» отличает этот глагол от ἔσωσεν, сохраняя близкий смысл спасения из опасности.
- source_word: τῶν κακῶν τούτων
  choice: всех этих бедствий
  rationale: В данном повествовательном контексте κακά обозначает постигшие народ угрозы и несчастья; «бедствия» передаёт это естественнее, чем отвлечённое «зло».
- source_word: σημεῖα καὶ τὰ τέρατα τὰ μεγάλα
  choice: знамения и великие чудеса
  rationale: Устойчивое и понятное библейское сочетание, сохраняющее различие двух греческих существительных и усиление μεγάλα.
- source_word: ἃ οὐ γέγονεν ἐν τοῖς ἔθνεσιν
  choice: каких не бывало среди народов
  rationale: Естественная русская формулировка передаёт совершенный вид и контраст Израиля с прочими народами без излишнего уточнения.
- source_word: κύριος
  choice: Господь
  rationale: Передаёт греческое κύριος как титул Бога; прописная буква соответствует русской библейской традиции, при этом не вводится форма, специально обозначающая еврейское божественное имя.
theological_decisions:
- issue: Смысл βοηθήσαντες πρὸς τὸν θεόν
  choice: Израиль воззвал к Богу за помощью.
  alternative: Израиль обратился к Богу за помощью.
  rationale: Буквальная калька могла бы создать ложное впечатление, будто Израиль помогал Богу. Последующее упоминание спасения показывает, что имеется в виду мольба к Богу и полученное от Него избавление.
- issue: Различение ἔσωσεν и ἐρρύσατο
  choice: спас / избавил
  alternative: спас / выручил
  rationale: Разные русские глаголы отражают различие греческих слов, не разрывая их общей темы божественного избавления.
- issue: Число сказуемого при собирательном обозначении Израиля
  choice: был спасён
  alternative: были спасены
  rationale: Единственное число согласуется с ближайшим отождествлением «народ — это Израиль» и сохраняет коллективное понимание Израиля; греческое причастие множественного числа раскрывает членов этого народа, поэтому вариант множественного числа также возможен.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён ровно настолько, чтобы длинное греческое предложение оставалось ясным; повтор имени «Господь» сохранён ради риторического акцента. Местоимение «Свой» написано с прописной буквы по принятой благоговейной издательской норме.
