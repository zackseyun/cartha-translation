lexical_decisions:
- source_word: ἡ μικρὰ πηγή
  choice: малый источник
  rationale: πηγή обозначает природный источник воды; «малый источник» естественно передаёт исходный образ и его масштаб.
- source_word: ἡ ἐγένετο ποταμός
  choice: ставший рекой
  rationale: Причастный оборот ясно и кратко передаёт превращение источника в реку, сохраняя образ сна.
- source_word: φῶς καὶ ἥλιος
  choice: свет, солнце
  rationale: Оба символа переданы буквально, без устранения их смысловой близости и без дополнительного толкования.
- source_word: ὕδωρ πολύ
  choice: обилие воды
  rationale: Выражение передаёт количественный смысл πολύ и звучит естественнее, чем буквальное «много воды» в этом возвышенном символическом перечислении.
- source_word: Ἐσθὴρ ἐστιν ὁ ποταμός
  choice: это Есфирь
  rationale: Связка с указательным «это» естественно отождествляет преобразившийся источник-реку с Есфирью; существительное «рекой» уже названо непосредственно перед этим.
- source_word: ἣν ἐγάμησεν ὁ βασιλεύς
  choice: на которой царь женился
  rationale: Обычная современная русская конструкция точно передаёт значение ἐγαμέω и женский род относительного местоимения.
- source_word: ἐποίησεν βασίλισσαν
  choice: которую сделал царицей
  rationale: Сохраняет каузативную силу глагола и предикативное значение βασίλισσαν, не подменяя его более узким «назначил».
theological_decisions:
- issue: Порядок и характер отождествления символа сна с Есфирью
  choice: Источник, ставший рекой, прямо отождествлён с Есфирью; свет, солнце и обилие воды сохранены как отдельные элементы образа.
  alternative: 'Более формально и прерывисто: «Малый источник, ставший рекой, — и были свет, солнце и много воды. Есфирь есть река…»'
  rationale: Греческая фраза синтаксически шероховата и повторно называет реку. Русская перестановка делает отождествление понятным, но не объясняет символы и не снимает их неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным повествовательным строем. Сохранены лаконизм и символическая образность исходного текста; порядок частей слегка сглажен ради цельного русского предложения.
