  text: But the two dragons are I and Haman[a].
translation:
  language: ru
  text: А два дракона — это я и Аман[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «два змея — это я и Аман». Греческое слово δράκοντες может означать драконов или больших змеев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... δύο δράκοντες
  choice: два дракона
  rationale: Греческое δράκοντες может обозначать драконов или больших змеев. «Дракона» сохраняет яркий образ видения и прямо передаёт форму множественного числа; возможный вариант отмечен в сноске.
- source_word: ἐγώ εἰμι
  choice: это я
  rationale: Конструкция служит прямому отождествлению символических фигур. Русское «это я и Аман» естественно передаёт греческое ἐγώ εἰμι в составе составного именования двух фигур.
- source_word: Ἁμάν
  choice: Аман
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: δέ
  choice: А
  rationale: Частица δέ обозначает мягкий переход или сопоставление; в данном пояснительном контексте естественно русское «А».
theological_decisions:
- issue: Символическое отождествление персонажей видения Есфири
  choice: Два дракона прямо отождествлены с говорящим, то есть Мардохеем, и Аманом без пояснительного добавления имени Мардохея в основной текст.
  alternative: 'Развернуть местоимение: «два дракона — это Мардохей и Аман»; либо передать δράκοντες как «змеи».'
  rationale: Греческий текст содержит эмфатическое «я», а не имя Мардохея. Сохранение первого лица точно передаёт прямую речь и не подменяет текст толкованием; лексическая неоднозначность δράκοντες вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественно-нейтральная и понятная. Тире подчёркивает прямое отождествление символов, не добавляя отсутствующего в греческом тексте толкования.
