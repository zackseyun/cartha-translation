  yaml_path: translation/deuterocanon/additions_to_esther/006/011.yaml
  text: In the fourth year of the reign of Ptolemy and Cleopatra[a], Dositheus, who said that he was a priest and a Levite, and Ptolemy his son, brought in the following letter of the Purim festival, which they said also existed and had been translated by Lysimachus son of Ptolemy[b], one of those in Jerusalem.
translation:
  language: ru
  text: В четвёртый год царствования Птолемея и Клеопатры Досифей, который говорил, что он священник и левит, и Птолемей, его сын, представили приведённое здесь послание о празднике Пурим[a], о котором, как они говорили, оно существовало и было переведено Лисимахом, сыном Птолемея, одним из тех, кто находился в Иерусалиме[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое название: Φρουραῖα («Фрурайя»); здесь оно употреблено как обозначение иудейского праздника Пурим.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «о котором они говорили, что оно имелось в наличии и было переведено Лисимахом, сыном Птолемея». Краткая греческая формулировка может подчёркивать существование или доступность документа, а не его подлинность.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔτους τετάρτου Βασιλεύοντος Πτολεμαίου καὶ Κλεοπάτρας
  choice: В четвёртый год царствования Птолемея и Клеопатры
  rationale: Передаёт греческую формулу датировки точно и естественно для современного литературного русского языка.
- source_word: εἰσήνεγκεν
  choice: доставили
  rationale: Глагол означает внесение или представление документа; «доставили» сохраняет конкретность действия, не добавляя строго административного оттенка. Единственное число в греческом при составном подлежащем естественно передано русским множественным числом.
- source_word: ὃς ἔφη εἶναι ἱερεὺς καὶ Λευείτης
  choice: называвший себя священником и левитом
  rationale: Нейтрально передаёт сообщение о самоидентификации Досифея, не усиливая возможный скептический оттенок до «утверждавший, будто». Союз καί сохранён без исторического согласования понятий.
- source_word: τὴν προκειμένην ἐπιστολὴν
  choice: приведённое здесь послание
  rationale: προκειμένην указывает на помещённый перед читателем документ; эта формулировка лучше подходит к заключительной приписке, чем пространственное «следующее».
- source_word: τῶν Φρουραίων
  choice: о празднике Пурим
  rationale: Передаёт понятный читателю референт греческого названия Φρουραῖα; форма оригинала отмечена в сноске.
- source_word: ἣν ἔφασαν εἶναι
  choice: Они говорили, что оно существовало
  rationale: Сохраняет сжатую и не вполне ясную формулировку, не подменяя простое εἶναι утверждением о подлинности документа.
- source_word: καὶ ἑρμηνευκέναι
  choice: и что его перевёл
  rationale: В контексте передачи документа ἑρμηνεύω естественнее всего означает перевод; активная русская конструкция ясно связывает действие с названным переводчиком.
- source_word: Λυσίμαχον Πτολεμαίου τῶν ἐν Ἰερουσαλήμ
  choice: Лисимах, сын Птолемея, один из живших в Иерусалиме
  rationale: Родительный Πτολεμαίου естественно понят как указание на отца, а субстантивированная конструкция τῶν ἐν Ἰερουσαλήμ сохранена как принадлежность к людям, находившимся в Иерусалиме.
theological_decisions:
- issue: Нейтральное сообщение или оттенок сомнения в ὃς ἔφη εἶναι
  choice: называвший себя
  alternative: утверждавший, что он священник и левит
  rationale: Основной текст не навязывает скептической оценки, которой греческая фраза сама по себе не требует.
- issue: Значение τῶν Φρουραίων
  choice: о празднике Пурим
  alternative: послание Фрурай
  rationale: Передан общеизвестный референт названия в греческой традиции Есфири, а непривычная греческая форма сохранена для проверки в сноске.
- issue: Смысл ἣν ἔφασαν εἶναι
  choice: они говорили, что оно существовало
  alternative: они говорили, что оно было в наличии / было подлинным
  rationale: Буквальное значение εἶναι сохраняет документальную неоднозначность и не вводит отсутствующего в тексте утверждения о подлинности.
