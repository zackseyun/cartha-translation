revisions:
- from: В четвёртый год царствования Птолемея и Клеопатры Досифей, называвший себя священником и левитом, и его сын Птолемей доставили приведённое здесь послание о празднике Пурим[a]. Они говорили, что оно существовало и что его перевёл Лисимах, сын Птолемея, один из живших в Иерусалиме[b].
  to: В четвёртый год царствования Птолемея и Клеопатры Досифей, который говорил, что он священник и левит, и Птолемей, его сын, представили приведённое здесь послание о празднике Пурим[a], о котором, как они говорили, оно существовало и было переведено Лисимахом, сыном Птолемея, одним из тех, кто находился в Иерусалиме[b].
