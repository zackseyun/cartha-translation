lexical_decisions:
- source_word: ἐμνήσθη
  choice: вспомнил
  rationale: Сохраняет обычную библейскую формулу, которая в данном контексте подразумевает не простое воспоминание, а благоприятное действие Бога, не выражая это значение прямо.
- source_word: ὁ θεός
  choice: Бог
  rationale: Стандартное соответствие греческому θεός; артикль не требует отдельной передачи.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: о Своём народе
  rationale: λαός здесь обозначает принадлежащий Богу народ; местоимение «Своём» ясно соотносится с подлежащим «Бог».
- source_word: ἐδικαίωσεν
  choice: оправдал
  rationale: Передаёт основное юридическое значение δικαιόω и сохраняет смысловую напряжённость греческого текста; контекст допускает понимание как публичного подтверждения правоты и восстановления справедливости.
- source_word: τὴν κληρονομίαν ἑαυτοῦ
  choice: Своё наследие
  rationale: Сохраняет библейскую метафору Божьего народа как Его наследия; возвратное ἑαυτοῦ естественно передано русским «Своё».
