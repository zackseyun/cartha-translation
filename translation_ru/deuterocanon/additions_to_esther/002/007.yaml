    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πάλαι καὶ νῦν δυσμενεῖς
  choice: те, кто был враждебен прежде и враждебен теперь
  rationale: Передаёт временное противопоставление πάλαι и νῦν и сохраняет значение прилагательного δυσμενεῖς, не превращая его без необходимости в существительное «враги».
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: за один день
  rationale: Естественно по-русски выражает сосредоточенность и внезапность гибели в пределах одного дня.
- source_word: βιαίως
  choice: насильственно
  rationale: Сохраняет указание на насильственный, принудительный характер нисхождения, не ослабляя его до простого обозначения смерти.
- source_word: εἰς τὸν ἅδην κατελθόντες
  choice: низойдя в Аид
  rationale: «Низойдя» сохраняет образ движения вниз, а «Аид» прямо передаёт греческое название мира мёртвых.
- source_word: εἰς τὸν μετέπειτα χρόνον ... διὰ τέλους
  choice: на всё последующее время, до самого конца
  rationale: Передаёт оба временных выражения, не сводя их в одно и не уточняя, какой именно конец имеется в виду.
- source_word: εὐσταθῆ καὶ ἀτάραχα
  choice: устойчивое и безмятежное
  rationale: Пара прилагательных передаёт как прочность и упорядоченность положения, так и отсутствие смуты или потрясений.
- source_word: παρέχωσιν ἡμῖν ... τὰ πράγματα
  choice: обеспечили нам ... положение дел
  rationale: Естественное русское выражение для общего состояния общественных или государственных дел; сослагательная форма соответствует целевой конструкции ὅπως.
theological_decisions:
- issue: Передача ᾅδης в греческом девтероканоническом тексте
  choice: Аид
  alternative: могила; мир мёртвых
  rationale: Греческий текст прямо называет царство мёртвых словом ᾅδης. «Аид» сохраняет лексическую специфику источника и не подменяет её представлением о месте окончательного наказания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Синтаксис сохраняет длинную целевую конструкцию оригинала, но «положение дел» делает её понятной современному читателю; временные выражения источника сохранены раздельно.
