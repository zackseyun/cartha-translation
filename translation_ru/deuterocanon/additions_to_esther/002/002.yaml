lexical_decisions:
- source_word: ἐσπεύδετο
  choice: спешно продвигалось
  rationale: Передаёт длительное ускоренное осуществление дела, выраженное имперфектом в пассиве, и при этом звучит естественно по-русски.
- source_word: τὸ πρᾶγμα
  choice: дело
  rationale: Сохраняет общее значение греческого слова и не конкретизирует его как «указ», хотя контекст связан с царским указом.
- source_word: καὶ εἰς Σουσάν
  choice: и в Сузах
  rationale: Передаёт распространение происходящего также на Сузы; русская предложная конструкция здесь естественнее буквального пространственного «в Сузы».
- source_word: ἐκωθωνίζοντο
  choice: возлежали за столом
  rationale: Сохраняет культурно значимый образ участников официальной трапезы, возлежащих на ложах, а не сводит значение лишь к еде или питью.
- source_word: ἐταράσσετο
  choice: был в смятении
  rationale: Передаёт продолжительное состояние тревоги и общественного потрясения, резко противопоставленное спокойной трапезе царя и Амана.
- source_word: ἡ πόλις
  choice: город
  rationale: Прямой и естественный эквивалент; по контексту подразумеваются Сузы и их жители как городское сообщество.
