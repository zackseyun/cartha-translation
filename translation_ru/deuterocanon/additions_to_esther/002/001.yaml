  yaml_path: translation/deuterocanon/additions_to_esther/002/001.yaml
  text: 'And this is the copy of the letter: Great King Artaxerxes writes these things to the rulers and local governors of the one hundred twenty-seven provinces from India to Ethiopia[b][a], who are subject to him.'
translation:
  language: ru
  text: 'Вот копия письма: «Великий царь Артаксеркс пишет следующее[b] правителям и местным начальникам ста двадцати семи областей[a] от Индии до Эфиопии, подвластным ему».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земель» либо «территорий»; греческое слово имеет более широкое значение, но здесь употреблено в контексте имперского управления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пишет это».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολῆς
  choice: письма
  rationale: Обычное и естественное обозначение письменного послания; соответствует официальному контексту.
- source_word: ἀντίγραφον
  choice: копия
  rationale: Передаёт значение копии или воспроизведения документа и естественно звучит в современном русском языке.
- source_word: Βασιλεὺς μέγας
  choice: Великий царь
  rationale: Сохраняет формальный характер царского титула и порядок, привычный для русского языка.
- source_word: Ἀρταξέρξης
  choice: Артаксеркс
  rationale: Традиционная русская форма имени персидского царя.
- source_word: χωρῶν
  choice: областей
  rationale: В контексте имперского управления обозначает территориальные единицы, хотя греческое слово может иметь более широкое значение.
- source_word: ἄρχουσι
  choice: правителям
  rationale: Сохраняет широкое значение лиц, обладающих властью, не смешивая их с более конкретно названными τοπάρχαις.
- source_word: τοπάρχαις
  choice: местным начальникам
  rationale: Передаёт лиц, управляющих отдельными местностями или округами, без малоизвестного заимствования «топархи».
- source_word: ὑποτεταγμένοις
  choice: подвластным ему
  rationale: Естественно передаёт подчинённость адресатов царю; местоимение «ему» ясно выражает подразумеваемое отношение.
- source_word: τάδε γράφει
  choice: пишет следующее
  rationale: Идиоматическая русская формула, сохраняющая официальный эпистолярный характер греческого выражения.
theological_decisions:
- issue: Царская титулатура и административная формула во второканоническом дополнении
  choice: Передать стих как официальное вступление к царскому письму, не добавляя богословского или исторического согласования.
  alternative: Пересказать его как общее царское воззвание.
  rationale: Текст имеет административно-повествовательный, а не доктринальный характер; перевод сохраняет его формальность и не вносит отсутствующих в греческом источнике толкований.
