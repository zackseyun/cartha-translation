  yaml_path: translation/deuterocanon/additions_to_esther/002/006.yaml
  text: Therefore we have instructed those writing to you in the documents written by Haman[a], who was appointed over affairs and was our second father, to destroy all of them—together with women and children—root and branch, by the swords of their enemies, without any pity or sparing, on the fourteenth day of Adar, the twelfth month, of this present year[b],
translation:
  language: ru
  text: Итак, мы повелели тем, кто пишет вам[a], в написанных Аманом документах, — поставленным над делами и бывшим для нас вторым отцом[b], — полностью истребить всех их вместе с женщинами и детьми мечами их врагов, без всякой жалости и пощады, в четырнадцатый день двенадцатого месяца, Адара, нынешнего года,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «тем, кто диктует вам текст». Греческое слово может обозначать как диктовку, так и составление или формулирование документа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вторым нашим отцом». Это почётное придворное выражение, подчёркивающее высокое положение Амана.'
    reason: cultural_note
lexical_decisions:
- source_word: ὑποστεῖλαιμεν
  choice: мы повелели
  rationale: Редкая и контекстуально трудная форма в царском административном письме передаёт издание властного распоряжения; «повелели» естественно вводит следующий инфинитив цели и сохраняет официальный регистр.
- source_word: τοῖς ὑπαγρευομένοις ὑμῖν
  choice: тем, кто пишет вам
  rationale: ὑπαγορεύω может обозначать диктовку или формулирование письменного текста. Нейтральное «пишет вам» не приписывает участникам более точной канцелярской должности, чем позволяет греческий текст; неоднозначность отмечена в сноске.
- source_word: ἐν τοῖς γεγραμμένοις ὑπʼ Ἁμὰν
  choice: в документах, составленных Аманом
  rationale: Субстантивированное причастие обозначает написанные материалы; «документы» соответствует официальному контексту, а «составленных» ясно передаёт авторство Амана.
- source_word: τοῦ τεταγμένου ἐπὶ τῶν πραγμάτων
  choice: поставленным над делами
  rationale: Формально близкая передача сохраняет широкое значение πράγματα и не уточняет без необходимости, что речь именно о государственных делах.
- source_word: δευτέρου πατρὸς ἡμῶν
  choice: бывшим для нас вторым отцом
  rationale: Сохранён необычный придворный образ «второго отца» вместо его замены толкованием вроде «главный советник».
- source_word: ἀπολέσαι
  choice: истребить
  rationale: Глагол выражает прямой приказ о полном физическом уничтожении; «истребить» соответствует дальнейшему усилению и не смягчает жестокость указа.
- source_word: ὁλορριζεί
  choice: искоренив
  rationale: Наречное выражение буквально связано с уничтожением до корня. «Искоренив» сохраняет образ полной ликвидации и естественно звучит по-русски.
- source_word: ταῖς τῶν ἐχθρῶν μαχαίραις
  choice: мечами их врагов
  rationale: Дательный передан инструментально; местоимение «их» естественно относит врагов к намеченным жертвам.
- source_word: ἄνευ παντὸς οἴκτου καὶ φειδοῦς
  choice: без всякой жалости и пощады
  rationale: Парная формула сохраняет усиление и различие между состраданием и отказом щадить.
- source_word: τῇ τεσσαρεσκαιδεκάτῃ τοῦ δωδεκάτου μηνὸς Ἀδὰρ
  choice: в четырнадцатый день двенадцатого месяца, адара
  rationale: Дата передана в ясном русском порядке с сохранением названия месяца и указания, что он двенадцатый.
- source_word: τοῦ ἐνεστῶτος ἔτους
  choice: нынешнего года
  rationale: «Нынешнего года» естественно и достаточно официально передаёт значение текущего года.
theological_decisions:
- issue: Жестокость приказа в царском указе
  choice: Прямо передать приказ истребить всех, включая женщин и детей
  alternative: Смягчить формулировку словами вроде «устранить» или «изгнать»
  rationale: Греческий текст недвусмысленно говорит о полном уничтожении, отдельно упоминает женщин и детей и усиливает приказ выражениями об искоренении и отсутствии жалости. Перевод не должен скрывать нравственную тяжесть текста.
translation_notes:
  register: Современный литературный русский язык с официально-царским оттенком. Синтаксис сохраняет протяжённость исходного указа, а конечная запятая показывает, что предложение продолжается в следующем стихе. Необычный титул Амана и административная неоднозначность причастия сохранены, а не заменены конфессиональным или историко-должностным толкованием.
