revisions:
- from: Когда же я спросил своих советников, как довести это дело до конца[a], Аман указал нам, что делать. Он превосходил всех при нашем дворе благоразумием, доказал неизменность своей доброжелательности и непоколебимую преданность и был удостоен второй по значимости чести в царстве.
  to: Когда же я спросил своих советников, как это можно было бы довести до конца[a], Аман указал нам, как это сделать. Он отличался среди нас благоразумием, оказался неизменно доброжелателен и твёрдо верен и был удостоен второй почести в царстве.
