base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/003.yaml
  text: And when I asked my counselors how this might be brought to completion[a], Haman showed us the way—he who excelled among us in prudence, had been proved unchanging in goodwill and in steadfast loyalty, and had received the second rank of honor in the kingdom.
translation:
  language: ru
  text: Когда же я спросил своих советников, как это можно было бы довести до конца[a], Аман указал нам, как это сделать. Он отличался среди нас благоразумием, оказался неизменно доброжелателен и твёрдо верен и был удостоен второй почести в царстве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как это могло бы быть осуществлено». Греческий текст выражает возможность и не называет исполнителя. После слов «Аман указал нам» прямое дополнение не выражено; в переводе «как это сделать» восполняет его из предшествующего вопроса.'
    reason: Сохранение модально-пассивного оттенка греческого вопроса и пояснение восполненного в русском неявного дополнения.
lexical_decisions:
- source_word: πυθομένου δέ μου τῶν συμβούλων
  choice: Когда же я спросил своих советников
  rationale: Генитив абсолютный задаёт обстоятельство времени; «спросил» естественно передаёт царское обращение за советом, а принадлежность советников ясна из контекста и местоимения μου.
- source_word: πῶς ἂν ἀχθείη τοῦτο ἐπὶ πέρας
  choice: как довести это дело до конца
  rationale: Передаёт значение достижения завершения; русская активная неопределённо-личная конструкция естественно выражает греческую пассивную форму без указания исполнителя.
- source_word: σωφροσύνῃ παρʼ ἡμῖν διενέγκας
  choice: превосходил всех при нашем дворе благоразумием
  rationale: σωφροσύνη в придворно-административном контексте означает благоразумие или здравомыслие; παρʼ ἡμῖν передано контекстуально как «при нашем дворе», а διενέγκας — как превосходство.
- source_word: ἐν τῇ εὐνοίᾳ ἀπαραλλάκτως
  choice: доказал неизменность своей доброжелательности
  rationale: ἀπαραλλάκτως выражает постоянство без перемен, а εὔνοια — благосклонность или доброжелательность. Оборот объединён с последующим ἀποδεδειγμένος ради естественного русского синтаксиса.
- source_word: βεβαίᾳ πίστει ἀποδεδειγμένος
  choice: доказал ... непоколебимую преданность
  rationale: πίστις здесь обозначает верность и надёжность в царской службе, а не религиозную веру; βεβαίᾳ усиливает значение устойчивости.
- source_word: δεύτερον τῶν βασιλείων γέρας ἀπενηνεγμένος
  choice: был удостоен второй по значимости чести в царстве
  rationale: γέρας означает почесть или почётное преимущество; «второй по значимости» ясно передаёт высокий статус после первого лица, не превращая выражение в точный административный титул.
- source_word: Ἁμὰν ἐπεδείξεν ἡμῖν
  choice: Аман указал нам, что делать
  rationale: ἐπιδείκνυμι означает показать или указать. Дополнение в греческом подразумевается из предшествующего вопроса; русское «что делать» делает эллипсис понятным, не добавляя конкретного содержания решения.
theological_decisions:
- issue: Значение πίστις в нерелигиозном придворном контексте
  choice: преданность
  alternative: вера; верность; надёжность
  rationale: Царь характеризует надёжность Амана в служении ему, а не его религиозную веру. «Преданность» естественно передаёт политико-личное значение слова, сохраняя отличие от богословского употребления πίστις.
- issue: Неявное дополнение при ἐπεδείξεν
  choice: указал нам, что делать
  alternative: указал нам это; показал нам путь; дал нам совет
  rationale: Греческий текст не называет прямого дополнения, отсылая к вопросу о завершении дела. Перевод сохраняет смысловую открытость и не уточняет содержание совета.
