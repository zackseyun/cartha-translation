  terminology: «Народы» допустимо передаёт φυλαί в данном имперско-этническом контексте. «Постановления царей» уместно для προστάγματα; множественное число сохранено. «Совместное правление» — безопасный основной вариант для редкого συναρχία, с административной альтернативой в примечании. Враждебная характеристика остаётся словами царского обвинения.
