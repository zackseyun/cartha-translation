base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/004.yaml
  text: among all the tribes throughout the inhabited world there is mixed in a certain hostile people[a], opposed in its laws to every nation, and continually disregarding the decrees of the kings[c][b], so that the blameless joint-rule directed by us may not be maintained.
translation:
  language: ru
  text: Среди всех народов по всей обитаемой земле есть некий враждебный народ, смешанный с ними, чьи законы противны всякому народу[a]. Он постоянно пренебрегает постановлениями царей[b], так что безупречно направляемое нами совместное правление не может сохраняться[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чьи обычаи противны всякому народу». Греческое слово νόμοι может означать как законы, так и установившиеся обычаи.'
    reason: lexical_alternative
  - marker: b
    text: Греческая фраза здесь синтаксически сжата; «пренебрегает постановлениями» передаёт вероятный смысл уклонения от царских повелений или оставления их без внимания.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «безупречно направляемое нами общее управление». Греческое συναρχία может означать совместное правление или общую власть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πάσαις ταῖς κατὰ τὴν οἰκουμένην φυλαῖς
  choice: среди всех народов по всей обитаемой земле
  rationale: φυλαί буквально обозначает племена или роды, но в контексте имперского письма речь идёт об этнических общностях; «народы» естественно передаёт этот широкий смысл. «Обитаемая земля» сохраняет значение οἰκουμένη.
- source_word: ἀναμεμιγμένον
  choice: рассеян и смешан с ними
  rationale: Причастие указывает на смешение с другими группами. Добавление «рассеян» делает пространственный смысл понятным по-русски, не устраняя основной образ смешения.
- source_word: δυσμενῆ λαόν τινα
  choice: некий враждебный народ
  rationale: «Некий» сохраняет неопределённость τινα, а «враждебный» передаёт δυσμενής и обвинительный тон царского письма.
- source_word: τοῖς νόμοις ἀντίθετον πρὸς πᾶν ἔθνος
  choice: чьи законы противны всякому другому народу
  rationale: νόμοι передано как «законы», при сохранении в сноске возможного значения «обычаи». «Другому» по-русски проясняет сопоставление обвиняемого народа со всеми остальными, не меняя смысла πᾶν ἔθνος.
- source_word: τά τε τῶν βασιλέων παραπέμποντας διηνεκῶς προστάγματα
  choice: Он постоянно пренебрегает постановлениями царей
  rationale: Сжатая греческая конструкция раскрыта отдельным предложением. παραπέμπω понято как оставление без внимания, а προστάγματα — как официальные постановления. Множественное «царей» сохранено.
- source_word: πρὸς τὸ μὴ κατατίθεσθαι
  choice: не позволяя сохранять
  rationale: Оборот выражает препятствие достижению или продолжению названного политического порядка. «Сохранять» соответствует контексту действующего управления, хотя глагол допускает также смысл установления.
- source_word: τὴν ὑφʼ ἡμῶν κατευθυνομένην ἀμέμπτως συναρχίαν
  choice: безупречное совместное правление, осуществляемое нами
  rationale: Редкое συναρχία означает совместное или общее правление. «Осуществляемое нами» естественно передаёт κατευθυνομένην, а «безупречное» сохраняет самохвальную имперскую характеристику ἀμέμπτως.
theological_decisions:
- issue: Враждебная политическая риторика обвинения
  choice: Сохранить обвинительный и пропагандистский тон царского письма.
  alternative: 'Смягчить описание до нейтрального: «особый народ с отличающимися обычаями».'
  rationale: Это слова враждебного царского документа, а не нейтральная оценка повествователя. Перевод должен передавать позицию говорящего, не утверждая её как богословский или авторский приговор.
- issue: Неоднозначность συναρχία
  choice: совместное правление
  alternative: общее управление
  rationale: Буквальное политическое значение редкого слова сохранено в тексте, а административная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского письма. Враждебная риторика источника сохранена, но не усилена. Длинная греческая фраза разделена на два предложения для ясности; редкая политическая лексика сопровождается сносками.
