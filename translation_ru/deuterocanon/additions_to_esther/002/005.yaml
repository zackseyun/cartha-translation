base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/002/005.yaml
  text: Therefore[a], having recognized that this nation alone stands in opposition to every man, introducing a foreign way of life in its laws, and being ill-disposed toward our affairs, accomplishing the worst evils, so that the kingdom does not attain stability[b],
translation:
  language: ru
  text: Итак, мы пришли к заключению, что этот народ — единственный, кто постоянно противостоит каждому человеку, изменяя свои законы, вводит чуждый уклад жизни, враждебно относится к нашим делам и совершает самые тяжкие злодеяния, — чтобы царство не обрело устойчивости[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Так говорится во враждебном царском письме: его составители изображают законы и уклад жизни этого народа чуждыми и обвиняют его в подрыве порядка. Последние слова можно также понять как указание на результат: «так что царство не обретает устойчивости».'
    reason: Уточнение речевой перспективы, культурно-риторического контекста и синтаксической неоднозначности.
lexical_decisions:
- source_word: διειληφότες
  choice: установив
  rationale: Причастие передаёт сделанный авторами письма уверенный вывод; «установив» сохраняет официальный тон, не превращая утверждение в формальный указ.
- source_word: ἔθνος
  choice: народ
  rationale: В русском библейском и политическом контексте «народ» естественно обозначает выделяемую этнокультурную общность и не несёт современных биологизирующих оттенков.
- source_word: μονώτατον
  choice: только этот
  rationale: Превосходная степень подчёркивает, что обвинители представляют данный народ единственным и исключительным в своём противостоянии.
- source_word: ἐν ἀντιπαραγωγῇ ... κείμενον
  choice: постоянно противостоит
  rationale: Передаёт устойчивое, продолжающееся положение противодействия; διὰ παντός отражено наречием «постоянно».
- source_word: παντὶ ... ἀνθρώπῳ
  choice: каждому человеку
  rationale: Сохраняет единственное число и обобщающее значение греческого выражения, не заменяя его коллективным «всем народам».
- source_word: διαγωγὴν νόμων ξενίζουσαν παραλλάσσον
  choice: вводит чуждый уклад жизни в своих законах
  rationale: Сжатая и синтаксически трудная фраза связывает отчуждающий уклад жизни с законами; перевод сохраняет правовой и культурный аспекты без чрезмерного уточнения.
- source_word: δυσονοοῦν
  choice: враждебно относится
  rationale: Естественно передаёт недоброжелательное, злонамеренное отношение в обвинительной риторике письма.
- source_word: τοῖς ἡμετέροις πράγμασιν
  choice: к нашим делам
  rationale: Сохраняет широкое обозначение государственных дел и интересов царской власти.
- source_word: τὰ χείριστα συντελοῦν κακὰ
  choice: причиняя тягчайшее зло
  rationale: Передаёт усилительную превосходную степень и идею деятельного осуществления вреда естественным литературным русским языком.
- source_word: πρὸς τὸ μὴ τὴν βασιλείαν εὐσταθείας τυγχάνειν
  choice: чтобы царство не обрело устойчивости
  rationale: Сохраняет целевое либо результирующее звучание конструкции πρὸς τό и политический смысл εὐστάθεια.
theological_decisions:
- issue: Враждебная царская характеристика иудейского народа
  choice: Обвинительная риторика сохранена как речь составителей царского письма.
  alternative: Добавить в основной текст слова дистанцирования, представляющие обвинения как заведомо ложные.
  rationale: Греческий текст прямо передаёт враждебные утверждения письма. Перевод не должен ни смягчать их, ни вводить отсутствующий авторский комментарий; примечание обозначает речевую перспективу.
- issue: Цель или результат в πρὸς τὸ μή
  choice: «чтобы царство не обрело устойчивости»
  alternative: «так что царство не обретает устойчивости»
  rationale: Конструкция допускает оттенок направленности или результата. «Чтобы» сохраняет злонамеренность, приписываемую народу обвинителями, но примечание указывает возможное результирующее понимание.
translation_notes:
  register: Современный литературный русский язык с официально-обвинительным оттенком, соответствующим царскому письму. Синтаксис сохранён как часть незавершённого длинного периода; поэтому стих оканчивается запятой. Маркер [a] присутствует в основном тексте.
