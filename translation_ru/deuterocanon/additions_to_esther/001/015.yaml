translation:
  language: ru
  text: И царь записал эти слова для памяти[a], и Мардохей записал об этих словах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в память», «как памятную запись». Греческое εἰς μνημόσυνον может обозначать как памятное свидетельство, так и запись, сохраняемую для памяти.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «об этих делах», «об этих событиях». Греческое λόγοι может означать не только слова, но также дела или обстоятельства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγραψεν
  choice: записал / написал
  rationale: Глагол γράφω прямо означает письменную фиксацию. В первой части «записал» естественно передаёт сохранение для памяти, а во второй «написал» сохраняет более общий смысл; повтор одного и того же греческого глагола остаётся заметен благодаря общей основе.
- source_word: τοὺς λόγους τούτους
  choice: эти слова
  rationale: λόγοι может обозначать как слова, так и дела или обстоятельства. Буквальное «эти слова» сохраняет лексическую форму и не устраняет контекстуальную неоднозначность.
- source_word: εἰς μνημόσυνον
  choice: на память
  rationale: Оборот обозначает цель письменной фиксации — для сохранения в памяти или в качестве памятной записи. «На память» звучит естественно по-русски, не сужая смысл исключительно до памятника либо официального документа.
- source_word: Μαρδοχαῖος
  choice: Мардохей
  rationale: Использована традиционная русская библейская форма имени.
- source_word: περὶ τῶν λόγων τούτων
  choice: об этих словах
  rationale: περί с родительным падежом означает «о, относительно». Формулировка сохраняет повтор λόγοι и допускает более широкое понимание как событий или обстоятельств, отмеченное в сноске.
