lexical_decisions:
- source_word: φωνῇ
  choice: крику
  rationale: В военном контексте слово обозначает исходящий от них возглас или шум. «Крик» естественно передаёт побуждающий боевой возглас, не уточняя его содержание.
- source_word: ἡτοιμάσθη
  choice: был приготовлен
  rationale: Аорист пассивного залога указывает, что каждый народ был приведён в состояние готовности; пассивная конструкция сохраняет эту особенность греческого текста.
- source_word: πᾶν ἔθνος
  choice: каждый народ
  rationale: Сочетание в единственном числе имеет распределительное значение. «Каждый народ» естественно передаёт его и сохраняет перекличку с последующим словом ἔθνος.
- source_word: εἰς πόλεμον
  choice: к войне
  rationale: Предлог εἰς выражает направленность приготовления; «к войне» кратко и естественно передаёт этот смысл.
- source_word: ὥστε πολεμῆσαι
  choice: чтобы сразиться
  rationale: ὥστε с инфинитивом допускает оттенок цели или предполагаемого результата. Русская конструкция сохраняет эту направленность, не утверждая, что сражение уже состоялось.
- source_word: δικαίων ἔθνος
  choice: народ праведных
  rationale: Родительный падеж δικαίων естественно понимать как обозначение людей, составляющих или характеризующих этот народ. Формулировка сохраняет описательный характер выражения и не подставляет явное этническое название.
theological_decisions:
- issue: Кого обозначает δικαίων ἔθνος
  choice: народ праведных
  alternative: праведный народ; народ иудеев
  rationale: Греческий текст даёт описательное выражение, а не прямое этническое наименование. Перевод не отождествляет этот народ явно с Израилем или иудеями и сохраняет смысловую открытость текста.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно торжественным звучанием. Сохранены пассивная форма, распределительное «каждый народ» и намеренная неоднозначность заключительного выражения.
