  yaml_path: translation/deuterocanon/additions_to_esther/001/001.yaml
  text: In the second year of the reign of Artaxerxes the great king[a], on the first day of Nisan, Mordecai son of Jair, son of Shimei, son of Kish, of the tribe of Benjamin, saw a dream[b],
translation:
  language: ru
  text: На второй год царствования великого царя Артаксеркса, в первый день месяца нисана[a], Мардохей, сын Иаира, сына Семея, сына Киса, из колена Вениамина, увидел сон[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте название месяца дано в форме «Нейса»; здесь употреблена общепринятая русская форма «нисан».
    reason: cultural_note
  - marker: b
    text: 'Буквально по-гречески: «увидел сон»; по смыслу также возможно: «ему приснился сон».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτους δευτέρου βασιλεύοντος
  choice: На второй год царствования
  rationale: Естественная русская формула датировки по году правления, точно передающая временную конструкцию греческого текста.
- source_word: Ἀρταξέρξου τοῦ μεγάλου βασιλέως
  choice: великого царя Артаксеркса
  rationale: Сохранены имя и персидский царский эпитет; порядок слов естественен для современного литературного русского языка.
- source_word: τῇ μιᾷ τοῦ Νεισὰ
  choice: в первый день месяца нисана
  rationale: Календарное выражение раскрыто ясно; Нейса передано принятой русской формой названия еврейского месяца — нисан.
- source_word: ἐνύπνιον εἶδεν
  choice: увидел сон
  rationale: Передаёт буквальный образ греческого выражения и при этом понятно по-русски; более идиоматичный вариант — «приснился сон».
- source_word: Μαρδοχαῖος ὁ τοῦ Ἰαείρου, τοῦ Σεμεείου τοῦ Κεισαίου
  choice: Мардохей, сын Иаира, сына Семея, сына Киса
  rationale: Повторяющиеся родительные формы поняты как последовательная родословная; использованы укоренившиеся русские библейские формы имён.
- source_word: ἐκ φυλῆς Βενιαμείν
  choice: из колена Вениамина
  rationale: «Колено» — понятный и устойчивый русский библейский термин для племенной принадлежности Израиля.
