base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/001/011.yaml
  text: And when Mordecai awoke[a], after seeing this dream and what God had purposed to do, he kept it in his heart[b], and in every matter he wanted to understand it until nightfall.
translation:
  language: ru
  text: Проснувшись после этого сна, Мардохей понял и то, что Бог замыслил совершить. Он хранил это в своём сердце[a] и до наступления ночи во всём[b] стремился постичь это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом печатном тексте перед словами «в сердце» имеется, по-видимому, незначительная опечатка или артефакт передачи текста; смысл выражения ясен: «в своём сердце».'
    reason: textual_variant
  - marker: b
    text: 'Буквально возможно также: «в каждом слове», «в каждом деле» или «во всех отношениях». Греческое выражение имеет широкий смысл и, вероятно, относится ко всему, что было связано со сном.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεγερθεὶς
  choice: пробудившись
  rationale: Аористное страдательное причастие здесь передаёт предшествующее главному действию пробуждение; русское деепричастие естественно сохраняет последовательность повествования.
- source_word: ἑωρακὼς τὸ ἐνύπνιον τοῦτο
  choice: вспомнил этот сон
  rationale: 'Буквально: «увидев этот сон». После пробуждения совершённое восприятие сна подразумевает его удержание в памяти; «вспомнил» делает русскую фразу связной, не превращая сон в видение.'
- source_word: τί ὁ θεὸς βεβούλευται ποιῆσαι
  choice: то, что Бог замыслил совершить
  rationale: Перфект среднего залога βεβούλευται выражает сложившееся намерение; «замыслил» сохраняет смысл обдуманного решения без излишней догматизации.
- source_word: εἶχεν αὐτὸ ... τῇ καρδίᾳ
  choice: хранил всё это в своём сердце
  rationale: Сохранён библейский образ внутреннего памятования и размышления; «всё это» естественно охватывает сон и Божий замысел.
- source_word: ἐν παντὶ λόγῳ
  choice: во всём
  rationale: λόγος допускает значения «слово», «дело», «обстоятельство», «смысл». Широкое «во всём» сохраняет неоднозначность оборота; альтернативы отмечены в сноске.
- source_word: ἤθελεν ἐπιγνῶναι αὐτὸ
  choice: старался ... постичь его смысл
  rationale: Имперфект ἤθελεν указывает на продолжительное стремление, а ἐπιγνῶναι — на полное распознание или понимание. По-русски «старался постичь его смысл» ясно передаёт попытку истолковать сон.
- source_word: ἕως τῆς νυκτός
  choice: до наступления ночи
  rationale: Естественно обозначает временной предел продолжительного размышления.
theological_decisions:
- issue: Передача ὁ θεός
  choice: Бог
  alternative: Господь
  rationale: В источнике стоит общее именование θεός, поэтому оно передано без замены на иной божественный титул.
- issue: Образ сердца
  choice: хранил всё это в своём сердце
  alternative: держал всё это в уме
  rationale: Сохранён антропологический образ καρδία с его одновременно памятным, мыслительным и внутренне переживаемым оттенком.
- issue: Соотношение сна и Божьего замысла
  choice: сон и то, что Бог замыслил совершить, оставлены связанными без пояснения характера этой связи
  alternative: истолковать сон как прямое и исчерпывающее откровение Божьего решения
  rationale: Греческий текст связывает сон с Божьим намерением, но не объясняет точный характер связи; перевод не разрешает эту богословскую напряжённость дополнением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для обычного читателя; образ сердца и неоднозначность ἐν παντὶ λόγῳ сохранены, а текстовый дефект отмечен в сноске.
