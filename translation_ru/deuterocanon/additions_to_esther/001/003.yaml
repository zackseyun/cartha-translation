translation:
  language: ru
  text: Он был из числа тех, кого Навуходоносор, царь Вавилона, увёл в плен из Иерусалима вместе с Иехонией, царём Иудеи[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из плена»; возможно также: «из среды изгнанников».'
