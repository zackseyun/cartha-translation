  - marker: b
    text: «Иудеи» соответствует греческому тексту; исторически имеется в виду Иудейское царство, обычно называемое Иудой.
    reason: cultural_note
lexical_decisions:
- source_word: ἐκ τῆς αἰχμαλωσίας
  choice: из числа пленников
  rationale: Греческое выражение буквально означает «из плена», но в данном контексте указывает на принадлежность к сообществу уведённых в плен. Русское «из числа пленников» естественно передаёт этот смысл, не превращая абстрактное существительное в указание на место происхождения.
- source_word: ᾐχμαλώτευσεν
  choice: увёл
  rationale: Глагол обозначает захват и увод в плен. В сочетании со словом «пленников» форма «увёл» ясно передаёт насильственное переселение и избегает тяжеловесного повтора «пленил пленников».
- source_word: Ναβουχοδονόσορ
  choice: Навуходоносор
  rationale: Устоявшаяся русская библейская форма имени вавилонского царя.
- source_word: μετὰ Ἰεχονίου
  choice: вместе с Иехонией
  rationale: μετά с родительным падежом выражает совместность; «вместе с» недвусмысленно сохраняет это отношение.
- source_word: τῆς Ἰουδαίας
  choice: Иудеи
  rationale: Передаёт непосредственно греческую форму Ἰουδαία, сохраняя формулировку источника; исторически речь идёт о царской линии Иудейского царства.
theological_decisions:
- issue: Передача терминологии плена без привнесения позднейшего богословского смысла
  choice: Он был из числа пленников… которых… увёл
  alternative: Он был из плена… который пленил
  rationale: Выбранная формулировка понимает оборот исторически — как принадлежность к сообществу переселённых — и сохраняет принудительный характер события, не добавляя богословской интерпретации.
- issue: Иудея или Иуда в титуле царя
  choice: царь Иудеи
  alternative: царь Иуды / иудейский царь
  rationale: «Иудеи» формально соответствует греческому τῆς Ἰουδαίας и сохраняет напряжение между греческим наименованием и историческим обозначением Иудейского царства; пояснение вынесено в сноску.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан естественным для русского: относительное местоимение во множественном числе соотнесено с «пленниками». Имена даны в традиционных русских библейских формах.'
