  text: And every righteous nation was thrown into turmoil[a], fearing their own calamities[c][b], and they prepared to perish.
translation:
  language: ru
  text: И все праведные народы пришли в смятение[a], боясь своих бедствий[b], и приготовились погибнуть[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякий праведный народ пришёл в смятение»; в греческом «народ» стоит в единственном числе, но следующие причастие и глагол — во множественном. ἐταράχθη можно также перевести: «был встревожен» или «был потрясён».'
    reason: grammatical_and_lexical_alternative
  - marker: b
    text: 'Буквально: «своих бедствий»; возможно также: «своего зла» или «несчастий, которые должны были их постигнуть».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «приготовились быть уничтоженными». Глагол может подчёркивать как гибель, так и уничтожение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: пришли в смятение
  rationale: Глагол передаёт сильную внутреннюю и общественную тревогу; выражение «пришли в смятение» сохраняет интенсивность и естественно звучит по-русски.
- source_word: δίκαιον
  choice: праведные
  rationale: «Праведные» сохраняет нравственно-религиозную окраску δίκαιος, тогда как «справедливые» здесь могло бы прозвучать преимущественно в социально-правовом смысле.
- source_word: πᾶν ἔθνος
  choice: все ... народы
  rationale: В греческом стоит распределительное единственное число «всякий народ», но следующие причастие и глагол имеют множественное число. Русское множественное число естественно согласует всю фразу, сохраняя собирательно-распределительный смысл.
- source_word: φοβούμενοι
  choice: боясь
  rationale: 'Деепричастие кратко сохраняет обстоятельственную связь: страх сопровождает и объясняет смятение.'
- source_word: τὰ ἑαυτῶν κακά
  choice: грозивших им бедствий
  rationale: В контексте предстоящей гибели κακά обозначает несчастья или бедствия, а возвратное ἑαυτῶν указывает на то, что они должны были постигнуть сами народы. Формулировка не приписывает им нравственного зла.
- source_word: ἡτοιμάσθησαν
  choice: приготовились
  rationale: Форма имеет средне-пассивный вид, но по смыслу естественно передаётся возвратным глаголом «приготовились».
- source_word: ἀπολέσθαι
  choice: погибнуть
  rationale: Средний инфинитив допускает значение как гибели, так и уничтожения; «погибнуть» сохраняет эту серьёзность без излишнего уточнения способа.
theological_decisions:
- issue: Значение δίκαιον как характеристики ἔθνος
  choice: нравственно-религиозное «праведные»
  alternative: социально-правовое «справедливые»
  rationale: В данном противопоставлении невиновного народа грозящему злу «праведные» лучше сохраняет библейскую нравственную окраску слова, не утверждая безгрешности.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. Синтаксис сделан плавным; переход греческого текста от единственного числа к множественному отражён в примечании, а в основном тексте использовано естественное русское согласование во множественном числе.
