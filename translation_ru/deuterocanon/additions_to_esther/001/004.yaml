lexical_decisions:
- source_word: ἐνύπνιον
  choice: сон
  rationale: Обычное значение слова; вариант «сновидение» возможен, но здесь более естественно краткое «сон», без добавления идеи особого видения.
- source_word: ἰδοὺ
  choice: и вот
  rationale: Передаёт внезапность и наглядность разворачивающейся картины сна, оставаясь естественным для современного литературного русского языка.
- source_word: φωναὶ
  choice: голоса
  rationale: Наиболее прямое соответствие, сохраняющее возможность понимать речь как о голосах или вообще о слышимых звуках.
- source_word: θόρυβος
  choice: шум
  rationale: Передаёт громкое беспорядочное движение или волнение, не уточняя его источник.
- source_word: βρονταὶ
  choice: раскаты грома
  rationale: Естественно передаёт греческое множественное число, не прибегая к менее обычному русскому «громы».
- source_word: σεισμός
  choice: землетрясение
  rationale: Основное значение в контексте грозных природных явлений; более общее «сотрясение» здесь менее вероятно.
- source_word: τάραχος
  choice: смятение
  rationale: Сохраняет смысл волнения и беспорядка, не решая, является ли происходящее природным, общественным или одновременно тем и другим.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Русское выражение естественно допускает как широкий смысл всей земли, так и более локальный смысл страны или суши, сохраняя неоднозначность γῆ.
theological_decisions:
- issue: Масштаб значения γῆ в образах сна
  choice: на земле
  alternative: в стране
  rationale: Контекст грома и землетрясения допускает всемирный масштаб, но греческое γῆ может обозначать и отдельную землю или страну. Формулировка «на земле» не вводит позднейшую апокалиптическую схему и оставляет масштаб открытым.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом. Перечисление и резкий переход «и вот» сохраняют напряжённость образов сна; неоднозначность слышимых явлений и масштаба происходящего пояснена в сноске.
