lexical_decisions:
- source_word: ἰδοὺ
  choice: и вот
  rationale: Передаёт внезапность и наглядность образа в рассказе о видении, оставаясь естественным для современного литературного русского языка.
- source_word: δράκοντες μεγάλοι
  choice: два огромных дракона
  rationale: «Драконы» сохраняет возвышенный символический образ, не подменяя его толкованием; «огромные» естественно передаёт здесь μέγας как указание на внушительную величину.
- source_word: προῆλθον
  choice: выступили
  rationale: Глагол выражает выход вперёд, навстречу столкновению; «выступили» передаёт это движение кратко и без излишне военного оттенка.
- source_word: ἀμφότεροι ἕτοιμοι παλαίειν
  choice: оба готовые сразиться
  rationale: «Оба» точно передаёт ἀμφότεροι, а «сразиться» естественно выражает предстоящее взаимное столкновение, не ограничивая его спортивной борьбой.
- source_word: φωνὴ μεγάλη
  choice: громкий звук
  rationale: φωνή допускает значения «голос», «крик» и более общее «звук»; нейтральное «звук» не приписывает драконам членораздельной речи, а «громкий» естественно передаёт интенсивность μεγάλη.
- source_word: αὐτῶν
  choice: от них
  rationale: При конструкции ἐγένετο ... αὐτῶν генитив естественно понимается как указание на источник звука.
theological_decisions:
- issue: Природа драконов в видении Мардохея
  choice: Сохранить образ «драконов» без истолкования в основном тексте.
  alternative: Назвать драконов конкретными историческими лицами, народами или царствами.
  rationale: В данном стихе символы ещё не объясняются, поэтому перевод не должен преждевременно отождествлять их с кем-либо.
