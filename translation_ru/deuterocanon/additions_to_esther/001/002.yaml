lexical_decisions:
- source_word: ἄνθρωπος Ἰουδαῖος
  choice: иудей
  rationale: Сочетание обозначает конкретного мужчину по его этнической и религиозной принадлежности. Русское «иудей» естественно передаёт это значение без избыточного повторения слова «человек».
- source_word: οἰκῶν
  choice: живший
  rationale: Причастие указывает на постоянное или обычное проживание; «живший» ясно и естественно в современном русском повествовании.
- source_word: ἐν Σούσοις τῇ πόλει
  choice: в городе Сузы
  rationale: Передаёт и название места, и явно выраженное в греческом тексте слово «город», сохраняя естественный русский порядок слов.
- source_word: ἄνθρωπος μέγας
  choice: человек знатный
  rationale: В придворном контексте μέγας, вероятнее всего, указывает на высокий статус или влиятельность. «Знатный» сохраняет социальный оттенок и достоинство речи.
- source_word: θεραπεύων
  choice: служивший
  rationale: В контексте царского двора причастие обозначает службу или исполнение обязанностей при дворе, без религиозного оттенка.
- source_word: ἐν τῇ αὐλῇ τοῦ βασιλέως
  choice: при царском дворе
  rationale: αὐλή здесь обозначает сферу царского двора; предложная конструкция «при царском дворе» естественно выражает придворную службу.
