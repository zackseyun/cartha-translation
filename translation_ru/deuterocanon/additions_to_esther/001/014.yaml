translation:
  language: ru
  text: И царь допросил двух евнухов, и, после того как они признались, их увели.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξήτασεν
  choice: допросил
  rationale: Глагол обозначает расспрос или разбирательство; в данном контексте «допросил» естественно передаёт официальное выяснение обстоятельств, не добавляя указания на жестокость.
- source_word: εὐνούχους
  choice: евнухов
  rationale: Греческое слово прямо называет евнухов; более общее «придворных» скрыло бы конкретное обозначение исходного текста.
- source_word: ὁμολογήσαντες
  choice: после того как они признались
  rationale: Причастие передаёт признание в ответ на допрос; придаточное ясно выражает предшествование признания последующему уводу.
- source_word: ἀπήχθησαν
  choice: их увели
  rationale: Пассивная форма указывает, что их удалили под властью других лиц; «их увели» звучит естественно и не уточняет не названные в тексте место или дальнейшее наказание.
