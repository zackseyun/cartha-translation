  yaml_path: translation/deuterocanon/additions_to_esther/001/007.yaml
  text: And behold[a], a day of darkness and gloom, of affliction and distress, of misery and great turmoil upon the earth.
translation:
  language: ru
  text: И вот — день тьмы и мрака, скорбь и теснота, бедствие и великое смятение на земле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в стране». Греческое слово γῆ может обозначать как землю вообще, так и определённую страну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: И вот
  rationale: Сохраняет внезапность и возвышенно-пророческую силу междометия, оставаясь естественным для современного русского языка.
- source_word: ἡμέρα
  choice: день
  rationale: В именной восклицательной конструкции определённость не выражена; русский язык не требует артикля, а форма «день» сохраняет краткость зловещего возвещения.
- source_word: σκότους
  choice: тьмы
  rationale: Прямо передаёт образ отсутствия света и естественно входит в устойчивую возвышенную пару.
- source_word: γνόφου
  choice: мрака
  rationale: Отличает слово от σκότους и сохраняет поэтический параллелизм; «густая тьма» было бы более тяжеловесно.
- source_word: θλίψις
  choice: скорбь
  rationale: Передаёт тяжёлое страдание и беду без узкого эсхатологического оттенка.
- source_word: στενοχωρία
  choice: теснота
  rationale: Сохраняет буквальный образ стеснённости и давления, а также традиционную, понятную русскую пару «скорбь и теснота».
- source_word: κάκωσις
  choice: бедствие
  rationale: Соответствует перечню несчастий и не вводит конкретного виновника, которого греческий текст здесь не называет.
- source_word: τάραχος μέγας
  choice: великое смятение
  rationale: Передаёт как внутреннюю тревогу, так и общий беспорядок; прилагательное μέγας выражено непосредственно.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Естественно передаёт греческое выражение и сохраняет возможность понимать γῆ как всю землю либо как конкретную страну; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Объём значения γῆ в формуле бедствия
  choice: на земле
  alternative: в стране
  rationale: Широкий, почти космический тон перечисления поддерживает значение «земля», однако греческое слово допускает и более узкое значение «страна»; перевод не должен безоговорочно устранять эту возможность.
translation_notes:
  register: Современный литературный русский с возвышенным, пророческим ритмом. Бессоюзное перечисление и пары существительных сохраняют напряжённость и поэтическую структуру греческого текста.
