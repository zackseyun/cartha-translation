  source_fidelity: 'Перевод точно передаёт последовательность и параллельную структуру греческого текста: ἰδού сохранено как вводное «И вот», ἡμέρα σκότους καὶ γνόφου — как «день тьмы и мрака», а четыре последующих обозначения бедствия переданы без добавления действующего лица или догматического истолкования. «Бедствие» для κάκωσις допустимо в данном перечне несчастий; «великое смятение» адекватно передаёт τάραχος μέγας.'
