  text: He listened to their plans and investigated their intentions[a], and he learned that they were preparing to lay hands on King Artaxerxes. And he informed the king about them.
translation:
  language: ru
  text: Он выслушал их замыслы и тщательно выяснил, что их тревожило, и узнал, что они готовятся поднять руку на царя Артаксеркса[a]. Затем он сообщил царю о них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «напасть на царя Артаксеркса». Греческое выражение буквально означает «возложить руки на» и обозначает враждебное действие, точный характер которого здесь не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκρόασεν
  choice: выслушал
  rationale: Передаёт внимательное, намеренное слушание, а не простое восприятие на слух.
- source_word: λογισμοὺς
  choice: замыслы
  rationale: В контексте придворного заговора речь идёт о продуманных намерениях или планах; «замыслы» естественно передаёт и мыслительную, и практическую сторону.
- source_word: μερίμνας
  choice: что их тревожило
  rationale: Сохраняет обычное значение «заботы, тревоги, то, что занимает человека» и не сводит слово безоговорочно к намерениям заговорщиков.
- source_word: ἐξηραύνησεν
  choice: разузнал
  rationale: Передаёт тщательное выяснение скрытых обстоятельств и естественно звучит в повествовании о заговоре.
- source_word: ἑτοιμάζουσιν
  choice: готовятся
  rationale: Настоящее время обозначает подготовку, происходящую в момент обнаружения заговора.
- source_word: τὰς χεῖρας ἐπιβαλεῖν
  choice: поднять руку на
  rationale: Русская идиома сохраняет образ руки и ясно выражает враждебное действие, не уточняя без достаточного основания, шла ли речь о нападении, захвате или убийстве.
- source_word: ὑπέδειξεν
  choice: сообщил
  rationale: В данном контексте глагол означает доведение сведений до царя; «сообщил» кратко и естественно передаёт смысл.
