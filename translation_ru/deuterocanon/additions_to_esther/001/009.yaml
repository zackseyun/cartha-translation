  source_fidelity: 'Первая часть передана точно: ἐβόησαν πρὸς τὸν θεόν — «воззвали к Богу», ἀπὸ τῆς βοῆς αὐτῶν — «от их вопля». Образ возникновения великой реки из малого источника и сравнительный оттенок ὡσανεί сохранены. Однако «обилие воды» неудачно передаёт ὕδωρ πολύ: греческое выражение характеризует реку как имеющую много воды, тогда как русский вариант звучит как отвлечённое приложение и нарушает образную связность.'
