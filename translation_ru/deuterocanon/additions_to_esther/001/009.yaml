  text: And they cried out to God[a], and from their cry there came, as it were, a great river from a little spring, abundant water.
translation:
  language: ru
  text: И они воззвали к Богу, и от их вопля возникла великая река, словно из малого источника, полная воды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόησαν
  choice: воззвали
  rationale: Глагол передаёт громкий, настойчивый зов; в сочетании с обращением к Богу «воззвали» естественно выражает горячую молитвенную просьбу.
- source_word: πρὸς τὸν θεόν
  choice: к Богу
  rationale: Предлог πρός при глаголе зова указывает на адресата; «к Богу» — естественная русская передача.
- source_word: βοῆς
  choice: вопля
  rationale: Существительное обозначает громкий крик. «Вопль» сохраняет силу образа и смысловую связь с «воззвали».
- source_word: ἐγένετο
  choice: возникла
  rationale: Здесь глагол говорит о появлении реки, а не о превращении одного предмета в другой.
- source_word: ὡσανεὶ
  choice: словно
  rationale: Союз сохраняет сравнительный, образный характер видения и не представляет реку как однозначно буквальную.
- source_word: μικρᾶς πηγῆς
  choice: малого источника
  rationale: πηγή обозначает природный источник; прилагательное «малый» ясно передаёт контраст с великой рекой.
- source_word: ποταμὸς μέγας
  choice: великая река
  rationale: Сочетание прямо передаёт масштаб реки и сохраняет её противопоставление малому источнику.
- source_word: ὕδωρ πολύ
  choice: обилие воды
  rationale: Фраза уточняет полноводность реки. «Обилие воды» естественнее по-русски, чем буквальное «много воды», и не добавляет нового образа.
theological_decisions:
- issue: Характер образа реки
  choice: Сохранить сравнительный показатель «словно»
  alternative: Передать возникновение реки как прямое, буквальное событие без сравнительного слова
  rationale: Греческое ὡσανεί явно отмечает сравнение или образное уподобление; его сохранение не снимает намеренно оставленную в тексте грань между видением и буквальным описанием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис сохраняет последовательность греческого образа, а тире показывает пояснительную функцию слов ὕδωρ πολύ.
