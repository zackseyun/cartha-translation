lexical_decisions:
- source_word: φῶς
  choice: Свет
  rationale: Сохраняет отдельный, лишённый артикля образ в начале фразы и не сводит его к обозначению времени суток.
- source_word: ὁ ἥλιος
  choice: солнце
  rationale: Прямое и естественное соответствие греческому существительному с артиклем.
- source_word: ἀνέτειλεν
  choice: взошло
  rationale: Обычное русское обозначение восхода солнца, точно передающее глагол в данном контексте.
- source_word: οἱ ταπεινοὶ
  choice: униженные
  rationale: Передаёт низкое, приниженное положение и подчёркивает последующую перемену статуса; возможность понимания как «смиренные» отмечена в сноске.
- source_word: ὑψώθησαν
  choice: возвысились
  rationale: Сохраняет образ возвышения и смысл резкой перемены положения; русская возвратная форма естественно передаёт греческий пассив без указания деятеля.
- source_word: κατέφαγον
  choice: пожрали
  rationale: Сохраняет резкую, зримую силу усиленного глагола «съесть, поглотить», не сглаживая метафору победы.
- source_word: τοὺς ἐνδόξους
  choice: прославленных
  rationale: Передаёт людей, обладающих славой, почётом и известностью, сохраняя противопоставление униженным.
theological_decisions:
- issue: Следует ли истолковать образный язык как прямое сообщение об избавлении и победе
  choice: Сохранить сжатые образы света, восходящего солнца, возвышения и пожирания.
  alternative: Раскрыть смысл пересказом о спасении униженных и их победе над знатными.
  rationale: Греческий текст намеренно образен и не разъясняет символы; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством и библейской образностью. Тире после «Свет» сохраняет отрывистое, образное начало; точка с запятой ясно разделяет небесный образ и последующий переворот человеческого положения.
