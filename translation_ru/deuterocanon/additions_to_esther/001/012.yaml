lexical_decisions:
- source_word: ἡσύχασεν
  choice: оставался
  rationale: Глагол ἡσυχάζω обозначает покой, бездействие или пребывание в тишине. В данном повествовательном контексте «оставался» естественно передаёт продолжение пребывания Мардохея при дворе, не сводя смысл исключительно к молчанию.
- source_word: ἐν τῇ αὐλῇ / τὴν αὐλήν
  choice: во дворе / двор
  rationale: αὐλή здесь обозначает ограждённый двор царской резиденции; повтор одного и того же слова сохранён вслед за греческим текстом.
- source_word: μετά
  choice: вместе с
  rationale: Предлог выражает совместное пребывание Мардохея с двумя названными лицами.
- source_word: εὐνούχων
  choice: евнухами
  rationale: Греческий текст прямо называет этих царских служителей евнухами; более общее «придворными» устранило бы конкретность оригинала.
- source_word: φυλασσόντων
  choice: охранявшими
  rationale: Причастие настоящего времени указывает на их постоянную или текущую обязанность охранять двор.
- source_word: Μαρδοχαῖος
  choice: Мардохей
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: Γαβὰθα
  choice: Гавафа
  rationale: Русская передача греческой формы имени с традиционным воспроизведением β как «в» и θ как «ф».
- source_word: Θαῤῥὰ
  choice: Фарра
  rationale: Русская передача греческой формы имени с воспроизведением θ как «ф» и удвоенного ρ как «рр».
