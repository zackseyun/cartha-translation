  text: And the king ordered Mordecai to serve in the court[a], and he gave him gifts on account of these things.
translation:
  language: ru
  text: И царь приказал Мардохею служить при дворе[a] и дал ему дары за всё это.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во дворце». Греческое выражение буквально означает «во дворе» и может указывать на царский двор либо на территорию дворца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέταξεν
  choice: приказал
  rationale: Передаёт властное распоряжение царя, не подразумевая формального назначения на должность.
- source_word: θεραπεύειν
  choice: служить
  rationale: В придворном контексте глагол означает прислуживать или состоять на службе; «служить» естественно и не придаёт выражению религиозного оттенка.
- source_word: ἐν τῇ αὐλῇ
  choice: при дворе
  rationale: Идиоматическое русское выражение для службы в окружении царя; возможный буквальный пространственный смысл отмечен в сноске.
- source_word: δόματα
  choice: дары
  rationale: Прямо передаёт нейтральное значение существительного, не уточняя, были ли это награды.
- source_word: περὶ τούτων
  choice: за всё это
  rationale: Естественно выражает обусловленность дара предшествующими событиями и сохраняет указание на совокупность обстоятельств.
