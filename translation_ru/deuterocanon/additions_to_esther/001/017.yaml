  yaml_path: translation/deuterocanon/additions_to_esther/001/017.yaml
  text: And Haman son of Hammedatha[a], the Bougaean, was honored before the king, and he was seeking to harm Mordecai and his people because of the king’s two eunuchs.
translation:
  language: ru
  text: И Аман, сын Амадафа, вугеянин[a], был в почёте у царя и стремился причинить зло Мардохею и его народу из-за двух царских евнухов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «вугеянин». В более известной текстовой традиции Аман назван «агагитянином», но в данном греческом тексте стоит «вугеянин».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἁμὰν Ἁμαδάθου
  choice: Аман, сын Амадафа
  rationale: Родительный падеж имени Ἁμαδάθου естественно передаёт отчество по отцу; имена даны в укоренившейся русской библейской форме.
- source_word: Βουγαῖος
  choice: вугеянин
  rationale: Неясное родовое или этническое обозначение передано транслитерацией без отождествления с иной текстовой традицией.
- source_word: ἔνδοξος ἐνώπιον τοῦ βασιλέως
  choice: был в почёте у царя
  rationale: Оборот описывает высокое положение Амана при царском дворе, а не присущую ему славу; русская формулировка естественна и точна.
- source_word: ἐζήτει κακοποιῆσαι
  choice: стремился причинить зло
  rationale: «Стремился» сохраняет длительный характер имперфекта ἐζήτει, а «причинить зло» передаёт широкое значение злонамеренного вреда.
- source_word: τὸν Μαρδοχαῖον καὶ τὸν λαὸν αὐτοῦ
  choice: Мардохею и его народу
  rationale: λαός здесь означает народ, к которому принадлежал Мардохей.
- source_word: ὑπὲρ τῶν δύο εὐνούχων τοῦ βασιλέως
  choice: из-за двух царских евнухов
  rationale: В контексте ὑπέρ указывает на причину вражды, связанную с двумя царскими евнухами; εὐνοῦχοι передано своим прямым придворным значением.
theological_decisions:
- issue: Передача неясного обозначения Βουγαῖος
  choice: вугеянин
  alternative: агагитянин
  rationale: Греческий источник содержит Βουγαῖος, поэтому перевод сохраняет именно это чтение и не гармонизирует его с более известной традицией; альтернативное чтение отмечено в сноске.
- issue: Смысл предлога ὑπέρ
  choice: из-за
  alternative: по поводу / ради
  rationale: Контекст связывает намерение Амана причинить зло с делом двух евнухов, поэтому причинное понимание наиболее естественно, хотя сам предлог допускает более широкую связь.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; придворная терминология и длительность намерения Амана сохранены.
