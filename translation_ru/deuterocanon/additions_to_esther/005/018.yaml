- source_word: πρὸς ταῖς Σούσων πύλαις
  choice: у ворот Суз
  rationale: Сохраняет локальное значение πρός с дательным и формальное множественное число πύλαις.
- source_word: ἐσταυρῶσθαι
  choice: был распят
  rationale: Прямо передаёт греческий глагол; возможная более широкая отсылка к казни на столбе отмечена в сноске.
- source_word: σὺν τῇ πανοικίᾳ
  choice: вместе со всем своим домом
  rationale: «Дом» в данном контексте обозначает всё домохозяйство, включая семью и зависимых; формулировка сохраняет библейскую выразительность и остаётся понятной.
- source_word: τὴν καταξίαν
  choice: заслуженным
  rationale: Передаёт значение должного, соответствующего деяниям воздаяния.
- source_word: τοῦ τὰ πάντα ἐπικρατοῦντος θεοῦ
  choice: Бог, властвующий над всем
  rationale: Передаёт господство и власть, выраженные ἐπικρατέω, без дополнительной догматической конкретизации.
- source_word: διὰ τάχους
  choice: вскоре
  rationale: Естественно выражает быстрое наступление воздаяния; допускает значение «быстро, без промедления».
- source_word: ἀποδόντος αὐτῷ κρίσιν
  choice: воздал ему ... наказанием
  rationale: «Воздал» сохраняет значение ответного возмездия в ἀποδίδωμι, а «наказанием» передаёт судебно-карательный смысл κρίσις в сочетании с καταξίαν.
theological_decisions:
