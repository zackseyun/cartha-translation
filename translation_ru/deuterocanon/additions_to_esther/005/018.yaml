lexical_decisions:
- source_word: διὰ τὸ
  choice: потому что
  rationale: Передаёт причинное значение оборота и его связь с предшествующим высказыванием.
- source_word: αὐτὸν τὸν ταῦτα ἐξεργασάμενον
