lexical_decisions:
- source_word: ἀντίγραφον
  choice: копию
  rationale: Слово обозначает копию или дубликат документа; винительный падеж естественно передан как объект инфинитивной конструкции указа.
- source_word: ἐπιστολῆς
  choice: письма
  rationale: Обычное значение ἐπιστολή — «письмо»; официальный характер документа ясен из контекста и не требует замены на более толковательное «указ».
- source_word: ἐκθέντες
  choice: следует ... вывесить
  rationale: В данном административном контексте причастие означает публично выставить документ. Русская предписывающая конструкция естественно передаёт связь с формулировкой указа, хотя изолированный греческий отрывок синтаксически зависит от предшествующего текста.
- source_word: ἐν παντὶ τόπῳ
  choice: в каждом месте
  rationale: Сохраняет распределительное значение греческого выражения и конкретность публичного размещения.
- source_word: μετὰ παρρησίας
  choice: открыто
  rationale: Здесь παρρησία указывает на открытый, публичный характер обнародования, а не обязательно на смелость.
- source_word: ἐᾶν
  choice: позволить
  rationale: Инфинитив означает разрешить; «позволить» понятно современному читателю и сохраняет официальный смысл.
- source_word: χρῆσθαι
  choice: соблюдать
  rationale: Буквально глагол значит «пользоваться», но по отношению к законам или установленным обычаям естественное русское сочетание — «соблюдать».
- source_word: τοῖς ἑαυτῶν νομίμοις
  choice: свои законы
  rationale: νόμιμα может обозначать как законы, так и установленные обычаи; основной вариант краток и уместен в официальном контексте, а смысловая широта отмечена в сноске.
