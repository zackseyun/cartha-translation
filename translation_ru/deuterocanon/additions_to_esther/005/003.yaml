    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτεταγμένους
  choice: подвластным нам
  rationale: Причастие обозначает людей, находящихся под чьей-либо властью; этот вариант сохраняет отношение подчинённости, не уточняя без необходимости их политический статус.
- source_word: ζητοῦσι κακοποιεῖν
  choice: стремятся причинить зло
  rationale: Передаёт как целенаправленность ζητοῦσι, так и широкое значение κακοποιεῖν — делать зло или причинять вред.
- source_word: κόρον
  choice: изобилие
  rationale: Слово может обозначать сытость, пресыщение или избыток благ. «Изобилие» естественно звучит в данном контексте, а неоднозначность сохранена в сноске.
- source_word: οὐ δυνάμενοι φέρειν
  choice: не в силах вынести
  rationale: Сохраняет образное значение φέρειν — выдерживать или переносить некое состояние.
- source_word: τοῖς ἑαυτῶν εὐεργέταις
  choice: против собственных благодетелей
  rationale: «Благодетели» точно передаёт εὐεργέταις, то есть тех, кто оказал им добро, а «собственных» отражает возвратное ἑαυτῶν.
- source_word: ἐπιχειροῦσι μηχανᾶσθαι
  choice: пытаются строить козни
  rationale: Сочетание передаёт попытку замыслить и осуществить враждебный умысел; направленность против благодетелей ясна из контекста и дательного дополнения.
