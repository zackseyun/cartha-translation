  text: And they seek not only to mistreat those subject to us[a], but, unable to bear prosperity, they even attempt to scheme against their own benefactors;
translation:
  language: ru
  text: И они стремятся не только причинять вред тем, кто нам подвластен, но и, не в силах вынести изобилие[a], пытаются строить козни даже против собственных благодетелей.
