lexical_decisions:
- source_word: υἱοὺς
  choice: сынами
  rationale: Сохраняет прямо выраженное в греческом тексте сыновнее отношение; форма творительного падежа обусловлена причастным оборотом «будучи сынами».
- source_word: τοῦ ὑψίστου μεγίστου ζῶντος θεοῦ
  choice: Всевышнего, величайшего, живого Бога
  rationale: Передаёт накопление божественных эпитетов и их возвышенное звучание, не превращая их в одно сглаженное определение.
- source_word: κατευθύνοντος
  choice: который направляет
  rationale: Передаёт значение руководства и упорядочивающего действия, не уточняя сверх текста способ Божьего управления.
- source_word: τὴν βασιλείαν
  choice: царство
  rationale: Естественно охватывает здесь царство как область и установленную царскую власть, не сужая смысл до одного лишь правления.
- source_word: ἡμῖν τε καὶ τοῖς προγόνοις ἡμῶν
  choice: для нас и наших предков
  rationale: Сохраняет дательный падеж заинтересованного лица и историко-родовую связь, выраженную словом πρόγονοι.
- source_word: ἐν τῇ καλλίστῃ διαθέσει
  choice: наилучшим образом
  rationale: Естественно по-русски передаёт превосходную степень и смысл наилучшего устроения или порядка, избегая тяжеловесного буквального оборота.
theological_decisions:
- issue: Корпоративный язык сыновства по отношению к Богу
  choice: будучи сынами Всевышнего, величайшего, живого Бога
  alternative: будучи детьми Всевышнего, величайшего, живого Бога
  rationale: Основной текст сохраняет явное υἱούς и связанную с ним богословскую силу сыновнего статуса, не заменяя её нейтральным обозначением.
- issue: Характер Божьего действия по отношению к царству
  choice: который наилучшим образом направляет царство для нас и наших предков
  alternative: который устрояет царство для нас и наших предков в наилучшем порядке
  rationale: Настоящее причастие передано как продолжающееся действие; перевод не навязывает ни исключительно прошлое историческое действие, ни более узкое значение царской власти.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Начальный причастный оборот сохранён как фрагмент связного контекста; причинное «поскольку» не добавлено. Порядок эпитетов намеренно не сглажен.
