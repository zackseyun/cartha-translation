  terminology: «Всевышний», «живой Бог», «царство» и «предки» уместны и последовательны. Сохранение «сынами» в основном тексте обосновано исходным υἱούς; сноска корректно отмечает вариант «детьми». Сноска b предлагает допустимое, более структурно-буквальное уточнение без изменения смысла.
