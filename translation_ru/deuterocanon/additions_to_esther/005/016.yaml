  source_fidelity: Перевод точно передаёт начальное причастие ὄντας без внесения причинного значения, сохраняет мужское множественное υἱούς («сынами») и воспроизводит цепочку божественных эпитетов. «Направляет царство для нас и наших предков» адекватно передаёт κατευθύνοντος ... τὴν βασιλείαν ἡμῖν τε καὶ τοῖς προγόνοις ἡμῶν; «наилучшим образом» является естественной передачей ἐν τῇ καλλίστῃ διαθέσει, не сужая спорное διάθεσις до одного значения.
