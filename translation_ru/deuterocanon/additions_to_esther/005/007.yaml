base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/007.yaml
  text: But consider whether it is possible[a], not so much from the earlier histories that we have handed down as from the things lying at your feet, while you investigate[c][b], to discern how many lawless deeds have been accomplished by the pestilence of those who rule unworthily.
translation:
  language: ru
  text: 'Но подумайте: можете ли вы, исследуя то, что у вас под ногами[a], узнать — не столько из более ранних повествований, переданных нами, — сколько нечестивых деяний[b] совершено пагубой[c] тех, кто недостойно властвует?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из того, что у вас перед глазами» или «из того, что у вас под рукой». Буквально: «у ваших ног»; выражение указывает на то, что находится непосредственно перед вами.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «беззаконных деяний». Греческое слово может подчёркивать как нравственную порочность, так и попрание священного.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «мором» или «поветрием». Здесь это, вероятно, метафора разрушительной пагубы тех, кто недостойно осуществляет власть.'
    reason: cultural_note
lexical_decisions:
- source_word: σκοπεῖτε
  choice: посмотрите
  rationale: Повелительное наклонение множественного числа призывает не просто увидеть, а обратить внимание и вдумчиво оценить; в данном контексте «посмотрите» естественно вводит последующее рассуждение.
- source_word: ἐξέστιν
  choice: можете
  rationale: Передаёт значение возможности, а не дозволения, и позволяет построить ясную русскую фразу.
- source_word: παλαιοτέρων ... ἱστοριῶν
  choice: более древних повествований
  rationale: Сохраняет сравнительную степень παλαιοτέρων; «повествования» здесь означает переданные исторические рассказы или записи.
- source_word: ὡς παρεδώκαμεν
  choice: переданных нами
  rationale: Передаёт указание на то, что прежние повествования были сообщены или оставлены авторами послания.
- source_word: παρὰ πόδας ὑμᾶς
  choice: прямо у ваших ног
  rationale: Сохраняет наглядный греческий образ непосредственной близости; смысловой вариант «у вас на глазах» вынесен в примечание.
- source_word: ἐξητοῦντας
  choice: внимательно исследуя
  rationale: Причастие выражает тщательное разыскание и рассмотрение; деепричастный оборот естественно передаёт сопутствующее действие.
- source_word: ἀνοσίως
  choice: нечестивых злодеяний
  rationale: Греческое наречие характеризует совершённое как попирающее святое и нравственно должное. В русском эта сила естественно передаётся сочетанием «нечестивые злодеяния», хотя формально наречие преобразовано в определение.
- source_word: συντετελεσμένα
  choice: совершено
  rationale: 'Передаёт результативность перфектного страдательного причастия: речь идёт о уже доведённых до осуществления злодеяниях.'
- source_word: λοιμότητι
  choice: моровой заразы
  rationale: Сохраняет яркую метафору мора или эпидемии, обозначающую разрушительное воздействие недостойных правителей.
- source_word: τῶν ἀναξία δυναστευόντων
  choice: тех, кто недостойно властвует
  rationale: ἀναξία понято наречно при δυναστευόντων; перевод не превращает выражение в неоднозначное «недостойные правители», а указывает на недостойный образ осуществления власти.
theological_decisions:
- issue: Нравственно-религиозная сила ἀνοσίως
  choice: нечестивых злодеяний
  alternative: беззаконных деяний; злодеяний, совершённых нечестиво
  rationale: «Нечестивых» сохраняет религиозно-нравственный оттенок нарушения святого и должного, не сводя слово исключительно к нарушению государственного закона.
- issue: Образ λοιμότης применительно к властителям
  choice: сохранена метафора «моровой заразы»
  alternative: пагубность; разложение
  rationale: Исходный текст намеренно использует резкий образ мора. Его сохранение передаёт осуждение разрушительного властвования, не объясняя метафору как особое богословское учение.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского послания. Синтаксис слегка возвышенный, но остаётся понятным. Сохранены образ «у ваших ног» и метафора мора; их смысл пояснён в примечаниях.
