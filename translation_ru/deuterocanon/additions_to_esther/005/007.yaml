  naturalness: 'Исходная фраза понятна, но тяжеловесна: «не столько из... сколько из...» отделено от «можете понять» длинным деепричастным оборотом, а «моровая зараза» стилистически избыточна. Перестройка делает современный литературный русский яснее, не упрощая официальный и риторический тон.'
