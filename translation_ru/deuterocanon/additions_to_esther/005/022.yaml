  yaml_path: translation/deuterocanon/additions_to_esther/005/022.yaml
  text: And so you also[a], on your appointed festivals, keep a notable day with every kind of feasting,
translation:
  language: ru
  text: Итак, и вы во время ваших праздников, носящих особые названия[a], празднуйте знаменательный день с всевозможными пиршествами,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «праздников, носящих имя (название)». Возможны также переводы: «памятных праздников» или «установленных праздников».'
    reason: Греческое ἐπωνύμοις означает «носящий имя, названный, обозначенный». В данном контексте точный оттенок — собственно названные, памятные или официально установленные праздники — остаётся неоднозначным.
lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
  choice: Так и вы
  rationale: Передаёт соединительное καί, выводное οὖν и подчёркнутое ὑμεῖς естественной русской формулой, связывающей повеление с предшествующим контекстом.
- source_word: ἐν ταῖς ἐπωνύμοις ὑμῶν ἑορταῖς
  choice: во время своих установленных праздников[a]
  rationale: Предлог ἐν при обозначении праздников передан временным оборотом. «Установленных» звучит естественно в контексте официально обозначенных праздников, а буквальный образ ἐπωνύμοις — «носящих название» — сохранён в сноске как подлинная лексическая неоднозначность.
- source_word: ἐπίσημον ἡμέραν
  choice: этот знаменательный день
  rationale: ἐπίσημος означает «отмеченный, примечательный, знаменательный». Указательное «этот» естественно отсылает к дню, о котором говорится в контексте, не изменяя сути предписания.
- source_word: μετὰ πάσης εὐωχίας
  choice: всевозможными пиршествами
  rationale: εὐωχία обозначает пиршество и праздничное угощение; πάσης передано как «всевозможными», сохраняя полноту выражения.
- source_word: ἄγετε
  choice: отмечайте
  rationale: В сочетании с обозначением дня глагол означает праздновать или соблюдать его; «отмечайте» естественно и сохраняет повелительное значение настоящего времени.
