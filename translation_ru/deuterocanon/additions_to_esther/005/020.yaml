lexical_decisions:
- source_word: συνεπισχύειν
  choice: поддержать
  rationale: Инфинитив означает придать дополнительную силу или оказать поддержку; «поддержать» естественно по-русски и сохраняет значение содействия.
- source_word: ὅπως
  choice: чтобы
  rationale: Передаёт целевое значение союза.
- source_word: ἐν καιρῷ θλίψεως
  choice: во время бедствия
  rationale: Сохраняет образ времени тяжёлых обстоятельств, давления или бедствия, не сужая его до конкретного вида несчастья.
- source_word: ἐπιθεμένους
  choice: напавших
  rationale: Причастие ἐπιτίθημι здесь имеет явно враждебное значение; «напавших» точно и современно передаёт его.
- source_word: ἀμύνωνται
  choice: могли защищаться
  rationale: Средний залог указывает на защиту самих себя; русская возвратная форма передаёт это без лишнего уточнения.
- source_word: τῇ τρισκαιδεκάτῃ τοῦ δωδεκάτου μηνὸς Ἀδὰρ
  choice: в тринадцатый день двенадцатого месяца — адара
  rationale: Сохраняет полную формулу даты и транслитерированное название месяца; тире естественно оформляет приложение в русском тексте.
- source_word: τῇ αὐτῇ ἡμέρᾳ
  choice: в тот самый день
  rationale: Передаёт подчёркнутое тождество указанной даты.
