  source_fidelity: Греч. συνεπισχύειν точнее передаётся как «укрепить», хотя «поддержать» допустимо. Причастие ἐπιθεμένους обозначает враждебно действующих против них; «напавших» в русском слишком легко воспринимается как уже совершившееся нападение. Формулировка «тех, кто нападёт на них» естественна в контексте предписания на определённую будущую дату и сохраняет целевую направленность ὅπως ... ἀμύνωνται. Дата и усилительное «в тот самый день» сохранены.
