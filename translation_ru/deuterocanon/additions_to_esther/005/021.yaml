lexical_decisions:
- source_word: ταύτην
  choice: это
  rationale: Указательное местоимение отсылает к только что упомянутому событию, не сужая его референт.
- source_word: ὁ πάντα δυναστεύων θεὸς
  choice: Бог, владычествующий над всем
  rationale: Дυναστεύω обозначает осуществление власти; «владычествующий над всем» сохраняет активный смысл Божьего верховенства и звучит естественно и возвышенно по-русски.
- source_word: ἀντʼ ὀλεθρίας
  choice: вместо гибели
  rationale: Ἀντί выражает замену и резкое противопоставление, а ὀλεθρία — гибель или уничтожение. «Гибель» передаёт угрозу народу без стилистической тяжеловесности.
- source_word: τοῦ ἐκλεκτοῦ γένους
  choice: избранного народа
  rationale: В данном контексте γένος обозначает Израиль как общность происхождения и завета. «Народ» яснее современному читателю; более буквальное «род» сохранено в сноске.
- source_word: ἐποίησεν αὐτοῖς εὐφροσύνην
  choice: обратил это для них в радость
  rationale: Конструкция ποιέω с двумя винительными допускает смысл превращения одного в другое; русский оборот ясно передаёт переход от ожидаемой гибели к радости.
theological_decisions:
- issue: Передача Божьего верховенства в ὁ πάντα δυναστεύων θεὸς
  choice: Бог, владычествующий над всем
  alternative: Бог, имеющий власть над всем
  rationale: Основной вариант сохраняет акцент на действующем Божьем владычестве, не превращая греческое описание в позднейший закреплённый титул.
- issue: Передача τοῦ ἐκλεκτοῦ γένους
  choice: избранного народа
  alternative: избранного рода
  rationale: Контекст говорит об Израиле как избранной Богом общности. «Народ» естественнее в современном русском, а сноска сохраняет оттенок происхождения, присущий γένος.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Причинный союз γάρ передан словом «ведь»; смысловая напряжённость между угрожавшей гибелью и дарованной радостью сохранена.
