  text: For God[a], who rules over all, has made this a joy for them instead of the destruction of the chosen race,
translation:
  language: ru
  text: Ведь Бог, владычествующий над всем, обратил это для них в радость вместо гибели избранного народа.[a]
  philosophy: optimal-equivalence
  footnotes:
