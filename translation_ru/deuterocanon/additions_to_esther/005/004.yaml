  yaml_path: translation/deuterocanon/additions_to_esther/005/004.yaml
  text: And[a], while taking away gratitude not only from men, but also being puffed up by the boasts of those who are exceedingly good[b], they suppose they will escape the judgment of the God who always sees all things and hates evil.
translation:
  language: ru
  text: И, не только отнимая у людей благодарность, но и возгордившись похвальбой тех, кого считают исключительно добрыми[a], они думают, что избегнут суда[b] Бога, Который всегда видит всё и ненавидит зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Переданное здесь греческое слово имеет необычную форму и трудно для точного истолкования; вероятно, речь идёт о людях, которых считают исключительно хорошими или благородными.
    reason: textual_variant
  - marker: b
    text: 'Или: «избегнут справедливого воздаяния», «избегнут наказания». Греческое слово δίκη может иметь как судебный, так и карательный оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστίαν
  choice: благодарность
  rationale: Существительное обозначает благодарность или признательность; отвлечённое «благодарность» естественно сочетается здесь с идеей её устранения из человеческих отношений.
- source_word: ἀνταναιροῦντες
  choice: искореняя
  rationale: Причастие передаёт устранение или уничтожение. «Искореняя» естественно по-русски выражает полное устранение благодарности среди людей, не усиливая фразу до физического насилия.
- source_word: κόμποις
  choice: похвальбой
  rationale: Слово может обозначать хвастовство, напыщенные речи или самовосхваление. «Похвальба» сохраняет отрицательный оттенок и связь с последующей гордыней.
- source_word: ἐπαρθέντες
  choice: возгордившись
  rationale: Пассивное причастие буквально описывает тех, кто был вознесён или надмился; «возгордившись» ясно передаёт нравственный оттенок высокомерия.
- source_word: ἀπεράγἀθων
  choice: тех, кого считают превосходнейшими
  rationale: Переданная форма текстуально и лексически трудна. Перевод сохраняет вероятное указание на людей, представляемых исключительно хорошими или благородными, а оборот «кого считают» не выдаёт эту оценку за объективное утверждение текста.
- source_word: κατοπτεύοντος
  choice: Который всегда видит всё
  rationale: Причастие обозначает наблюдение или надзор; вместе с τὰ πάντα и ἀεί выражает постоянное Божье видение всего происходящего.
- source_word: μισοπόνηρον
  choice: ненавидит зло
  rationale: Сложное прилагательное буквально означает «ненавидящий зло». Глагольная передача естественна для современного русского языка и сохраняет нравственную характеристику Бога.
- source_word: δίκην
  choice: суда
  rationale: В контексте слово обозначает судебное воздаяние, которое виновные надеются избежать. «Суд» сохраняет как юридическую, так и возможную карательную сторону значения.
theological_decisions:
- issue: Божье всеведение и нравственное неприятие зла
  choice: Бога, Который всегда видит всё и ненавидит зло
  alternative: всегда всевидящего Бога, ненавистника зла
  rationale: Греческий текст компактно соединяет постоянное наблюдение Бога за всем и Его противостояние злу. Выбранная формулировка сохраняет оба утверждения без привнесения позднейшей догматической терминологии.
- issue: Характер δίκην как суда или наказания
  choice: избегнут суда
  alternative: избегнут наказания
  rationale: «Суд» не сужает значение до уже назначенной кары и сохраняет напряжение между судебным разбирательством, справедливым воздаянием и наказанием.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет накопление деепричастных обстоятельств и итоговое ошибочное ожидание виновных; трудное чтение не сглажено без пояснения.
