  terminology: «Благодарность», «похвальба», «суд», «видит всё» и «ненавидит зло» уместны. Трудное ἀπεράγἀθων следует по-прежнему сопровождать примечанием; «исключительно добрыми или благородными» сохраняет текстологическую осторожность.
