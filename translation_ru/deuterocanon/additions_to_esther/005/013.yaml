  text: having sought[a], by devious schemes of deceit, the destruction of Mordecai, our savior and continual benefactor, and Esther, the blameless partner of the kingdom[b], together with all their nation.
translation:
  language: ru
  text: и, прибегнув к хитросплетённым обманным уловкам, ходатайствовал о гибели Мардохея — нашего спасителя[a] и постоянного благодетеля, — а также Есфири, безупречной сопричастницы царской власти[b], вместе со всем их народом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавителя». Здесь слово «спаситель» означает того, кто спас или сохранил, и не обязательно является особым титулом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сопричастницы царства»; выражение может указывать на участие Есфири в царском положении или власти.'
    reason: ambiguity
lexical_decisions:
- source_word: σωτῆρα
  choice: спасителя
  rationale: Прямо передаёт значение того, кто спас или избавил; здесь слово относится к Мардохею в обычном, не титульном смысле.
- source_word: διὰ παντὸς εὐεργέτην
  choice: неизменного благодетеля
  rationale: Передаёт постоянство оказываемых благодеяний и уместно для придворно-политического контекста.
- source_word: ἄμεμπτον
  choice: безупречную
  rationale: Сохраняет смысл отсутствия вины или повода для порицания и естественно сочетается с последующим существительным.
- source_word: τῆς Βασιλείας κοινωνὸν
  choice: сопричастницу царской власти
  rationale: κοινωνός обозначает участницу или ту, кто разделяет нечто; Βασιλεία здесь может указывать не только на царство как территорию, но и на царскую власть. Формулировка сохраняет придворный смысл, не сводя выражение к личному товариществу.
- source_word: σὺν παντὶ τῷ τούτων ἔθνει
  choice: вместе со всем их народом
  rationale: Plural τούτων естественно отсылает к Мардохею и Есфири, а ἔθνος в данном повествовании означает их народ.
- source_word: πολυπλόκοις μεθόδων παραλογισμοῖς
  choice: прибегнув к хитросплетённым обманным уловкам
  rationale: Передаёт нагромождение греческих слов со значениями сложности, коварного приёма и обмана, оставаясь понятным по-русски.
- source_word: αἰτησάμενος εἰς ἀπώλειαν
  choice: потребовал погубить
  rationale: Причастие означает обращение с просьбой или требованием, а εἰς ἀπώλειαν выражает намеченный гибельный исход. В контексте царского указа «потребовал погубить» звучит естественно и сохраняет направленность действия.
theological_decisions:
- issue: Употребление слова «спаситель» применительно к Мардохею
  choice: Сохранено «спаситель» в обычном значении избавителя.
  alternative: избавитель; тот, кто спас
  rationale: Греческое σωτήρ не является исключительно богословским титулом; в данном контексте оно характеризует совершённое Мардохеем спасение.
- issue: Значение выражения τῆς Βασιλείας κοινωνὸν
  choice: сопричастница царской власти
  alternative: участница царства; разделяющая царское достоинство
  rationale: Родительный падеж допускает связь как с царством, так и с царским положением или властью. Выбранный вариант естественен в контексте Есфири и не превращает κοινωνός в обозначение личной близости.
- issue: К кому относится «их народ»
  choice: К Мардохею и Есфири вместе.
  alternative: народ Мардохея; народ этих людей
  rationale: Множественное τούτων наиболее естественно относится к двум названным лицам и связывает обоих с народом, которому угрожало уничтожение.
translation_notes:
  register: Современный литературный русский язык с торжественным придворным оттенком. Синтаксис сохраняет зависимость от более широкого контекста царского послания; риторически насыщенное греческое выражение об уловках передано образно, но понятно. Все сноски отмечены в основном тексте.
