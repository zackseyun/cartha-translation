  terminology: «Высокомерие», «вознамерился», «лишить», «власть» и «жизнь» уместны в современном литературном и возвышенном библейском регистре. Примечание следует сформулировать как перечень альтернативных значений πνεῦμα, а не как «дух (дыхание)», что может ошибочно представить их одним значением.
