  text: But[a], unable to bear his arrogance, he made it his aim to deprive us of both our position and our life.
translation:
  language: ru
  text: Но, не стерпев высокомерия, он вознамерился лишить нас и власти, и жизни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишить нас и власти, и духа» или «лишить нас и власти, и дыхания». Греческое ἀρχή может означать «власть», «правление» или «должность», а πνεῦμα — «дух», «дыхание» или «жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐνέγκας
  choice: не стерпев
  rationale: Идиоматическое употребление аористного причастия передаёт неспособность вынести или терпеть нечто; деепричастие естественно сохраняет обстоятельственно-причинную связь.
- source_word: τὴν ὑπερηφανίαν
  choice: его высокомерия
  rationale: ὑπερηφανία обозначает надменную гордость; «высокомерие» точно передаёт отрицательную нравственную оценку и естественно звучит по-русски.
- source_word: ἐπετήδευσεν
  choice: вознамерился
  rationale: Глагол выражает целенаправленное намерение или стремление, не утверждая, что замысел был осуществлён.
- source_word: τῆς ἀρχῆς
  choice: власти
  rationale: В политико-придворном контексте ἀρχή может означать власть, правление или должностное положение; «власть» сохраняет основной политический смысл без излишнего уточнения.
- source_word: στερῆσαι ἡμᾶς
  choice: лишить нас
  rationale: Прямое и естественное соответствие конструкции со значением лишения кого-либо чего-либо.
- source_word: καὶ τοῦ πνεύματος
  choice: и самой жизни
  rationale: В сочетании с лишением власти πνεῦμα наиболее естественно обозначает дыхание жизни, то есть жизнь; «самой» передаёт кульминационное усиление парной конструкции, не вводя представления о нематериальном духе.
theological_decisions:
- issue: Значение πνεῦμα в контексте политической угрозы
  choice: жизнь
  alternative: дух; дыхание
  rationale: Сопоставление утраты власти с утратой πνεῦμα указывает на смертельную угрозу. «Жизнь» ясно передаёт контекстуальный смысл, а примечание сохраняет лексическую многозначность греческого слова.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. «Вознамерился» передаёт обдуманный злой умысел, а парная конструкция «и власти, и самой жизни» сохраняет риторическое нарастание исходного текста.
