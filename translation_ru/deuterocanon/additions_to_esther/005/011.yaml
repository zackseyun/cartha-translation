  text: We have attained such goodwill toward every nation that he is proclaimed our father and is honored by all[a], continuing as the second person to the royal throne.
translation:
  language: ru
  text: Мы обрели ко всем народам такую благосклонность, что он провозглашён нашим отцом и, почитаемый всеми[a], неизменно остаётся вторым лицом после царского престола.
  philosophy: optimal-equivalence
  footnotes:
