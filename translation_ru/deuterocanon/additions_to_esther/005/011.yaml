    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυχεν ἧς ἔχομεν
  choice: мы проявили
  rationale: Греческая конструкция в данном контексте указывает на проявляемое царём благоволение; по-русски «мы проявили… благосклонность» естественно передаёт смысл, не воспроизводя синтаксическую неровность текста.
- source_word: φιλανθρωπίας
  choice: благосклонность
  rationale: Слово обозначает доброжелательное, милостивое отношение; «благосклонность» соответствует придворно-царскому контексту и современному литературному регистру.
- source_word: πρὸς πᾶν ἔθνος
  choice: ко всем народам
  rationale: ἔθνος здесь означает народы империи; множественное число естественно передаёт собирательное πᾶν ἔθνος по-русски.
- source_word: ἐπὶ τοσοῦτον ὥστε
  choice: такую… что
  rationale: Передаёт конструкцию степени и следствия естественным русским оборотом.
- source_word: ἀναγορεύεσθαι
  choice: провозглашён
  rationale: Сохраняет оттенок публичного и официального признания.
- source_word: πατέρα
  choice: отцом
  rationale: Сохраняется буквальный родственный титул, который в придворной речи может также выражать покровительство.
- source_word: προσκυνούμενον
  choice: почитаемый
  rationale: В придворном контексте обозначает выражение почтения и покорности перед высшим лицом, не обязательно богопоклонение; телесный оттенок отмечен в сноске.
- source_word: τὸ δεύτερον τοῦ Βασιλικοῦ θρόνου πρόσωπον
  choice: вторым лицом после царского престола
  rationale: Передаёт ранг ближайшего к царской власти сановника и сохраняет необычный образ престола без чрезмерного разъяснения.
- source_word: διατελεῖν
  choice: неизменно остаётся
  rationale: Передаёт длительное, продолжающееся пребывание в указанном положении.
theological_decisions:
- issue: Значение προσκυνούμενον в придворном контексте
  choice: почитаемый всеми
  alternative: все падают перед ним ниц; ему поклоняются все
  rationale: Глагол может обозначать как земной поклон и почтение к высокопоставленному человеку, так и религиозное поклонение. Контекст персидского двора благоприятствует значению придворного почтения, но телесная и потенциально более сильная окраска сохранена в сноске.
