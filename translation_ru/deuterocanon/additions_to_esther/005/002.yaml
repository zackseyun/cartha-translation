lexical_decisions:
- source_word: πολλοὶ
  choice: Многие
  rationale: Субстантивированное прилагательное вводит общее наблюдение; краткий и естественный русский эквивалент.
- source_word: τῇ πλείστῃ ... χρηστότητι
  choice: благодаря величайшей доброте
  rationale: Дательный падеж указывает на основание или средство оказываемых почестей; «доброта» передаёт χρηστότης, а «величайшая» сохраняет превосходную степень πλείστῃ.
- source_word: τῶν εὐεργετούντων
  choice: своих благодетелей
  rationale: Причастие обозначает тех, кто оказывает им добро; «благодетели» — точный и естественный контекстуальный эквивалент. Притяжательное «своих» ясно выражает отношение к получателям благодеяний.
- source_word: πυκνότερον
  choice: чем бо́льшие почести получали
  rationale: Сравнительное наречие, буквально связанное с частотой или усилением, естественно передано в русской соотносительной конструкции «чем… тем…».
- source_word: τιμώμενοι
  choice: почести получали
  rationale: Пассивное причастие τιμάω передано личной формой, естественной для русского синтаксиса и сохраняющей значение оказания чести.
- source_word: μεῖζον ἐφρόνησαν
  choice: тем больше превозносились
  rationale: Греческая идиома буквально означает «стали думать больше/выше» и в контексте выражает возрастание самомнения; «превозносились» сохраняет нравственный оттенок, не делая формулировку чрезмерно разговорной.
