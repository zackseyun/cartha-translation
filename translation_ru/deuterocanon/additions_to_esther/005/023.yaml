lexical_decisions:
- source_word: ὅπως
  choice: чтобы
  rationale: Передаёт целевое или результативное значение союза и естественно вводит продолжение указа.
- source_word: καὶ νῦν καὶ μετὰ ταῦτα
  choice: и ныне, и впредь
  rationale: Сохраняет противопоставление настоящего и последующего времени, но звучит естественно и торжественно по-русски.
- source_word: σωτηρία
  choice: избавление
  rationale: В придворно-политическом контексте обозначает конкретное спасение от опасности; «избавление» сохраняет также более широкий смысл слова.
- source_word: τοῖς εὐνοοῦσιν Πέρσαις
  choice: благожелательным к нам персам
  rationale: Точно передаёт благосклонное расположение, не превращая этих персов непременно в друзей или сторонников.
- source_word: τοῖς δὲ ἡμῖν ἐπιβουλεύουσιν
  choice: а тем, кто замышляет против нас
  rationale: Передаёт враждебный и скрытый характер умысла; союз δέ выражен противопоставлением «а».
- source_word: μνημόσυνον τῆς ἀπωλείας
  choice: памятование о гибели
  rationale: Сохраняет краткость, торжественность и смысловую неоднозначность греческого оборота, не уточняя без достаточных оснований, чья именно гибель имеется в виду.
theological_decisions:
- issue: Значение σωτηρία в повествовании о царском указе
  choice: избавление
  alternative: спасение
  rationale: «Избавление» лучше указывает на сохранение от непосредственной опасности, не исключая религиозного оттенка и не придавая выражению узко догматического смысла.
- issue: Смысл μνημόσυνον τῆς ἀπωλείας
  choice: памятование о гибели
  alternative: напоминание об их гибели
  rationale: Греческий оборот сжат и допускает разные смысловые связи. Перевод сохраняет эту напряжённость и не добавляет отсутствующее в тексте местоимение «их».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной интонацией царского указа. «Ныне» и «памятование» поддерживают официальный библейский регистр, оставаясь понятными из контекста.
