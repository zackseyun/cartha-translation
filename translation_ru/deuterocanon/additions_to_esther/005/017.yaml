  text: Therefore you will do well not to make use of the letters sent out by Haman son of Hammedatha,[a]
translation:
  language: ru
  text: Поэтому вы поступите правильно, если не воспользуетесь письмами, разосланными Аманом, сыном Амадафа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если не будете действовать на основании писем, разосланных Аманом, сыном Амадафа». Греческий глагол может означать «воспользоваться» чем-либо; в данном контексте он, возможно, подразумевает отказ исполнять предписания этих писем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς οὖν ποιήσετε
  choice: Поэтому вы поступите правильно
  rationale: Передаёт логическое следствие οὖν и естественно выражает оборот καλῶς ποιήσετε, сохраняя форму будущего времени с мягкой побудительной силой.
- source_word: μὴ προσχρησάμενοι
  choice: если не воспользуетесь
  rationale: Причастный оборот указывает, каким образом адресаты поступят правильно. «Не воспользуетесь» сохраняет широкое значение προσχράομαι и не сужает его до «не подчинитесь» или «не исполните».
- source_word: τοῖς ... ἀποσταλεῖσι γράμμασιν
  choice: письмами, разосланными
  rationale: В царско-административном контексте γράμματα обозначает письменные послания, а «разосланными» естественно передаёт распространение таких писем среди многих адресатов.
- source_word: ὑπὸ Ἁμὰν Ἁμαδάθου
  choice: Аманом, сыном Амадафа
  rationale: Родительный Ἁμαδάθου понят как патронимический; добавление «сыном» явно и естественно выражает это отношение по-русски.
