  source_fidelity: 'Русский текст точно передаёт выводное οὖν («Поэтому»), оборот καλῶς ποιήσετε («вы поступите правильно») и смысл μὴ προσχρησάμενοι через естественную условную конструкцию «если не воспользуетесь». «Письмами, разосланными Аманом» верно отражает τοῖς ... ὑπὸ Ἁμὰν Ἁμαδάθου ἀποσταλεῖσι γράμμασιν. Патроним передан корректно: «Аманом, сыном Амадафа».'
