  source_fidelity: 'Текст точно передаёт греческий смысл: противопоставление вводится союзом «Но»; иудеи представлены как переданные виновником «на уничтожение»; отрицание их преступности и положительная характеристика их жизни по законам сохранены. «Установили» является допустимой официально-судебной передачей εὑρίσκομεν в контексте царского заключения, хотя греческая форма формально настоящего времени.'
