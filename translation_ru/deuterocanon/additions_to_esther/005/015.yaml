  yaml_path: translation/deuterocanon/additions_to_esther/005/015.yaml
  text: But we find that the Jews, who have been handed over to destruction by that thrice-accursed man, are not criminals, but are governed by most righteous laws,
translation:
  language: ru
  text: Но мы установили, что иудеи, которых этот трижды проклятый человек предал на уничтожение,[a] не преступники, а живут по справедливейшим законам.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «которых предал на уничтожение трижды проклятый». Греческое слово τρισαλιτήριος — необычайно сильное оскорбление в адрес виновника.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «ведут свою общественную жизнь по справедливейшим законам». Греческий глагол может обозначать жизнь и поведение гражданина в соответствии с законами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: Но мы
  rationale: δέ противопоставляет итог царского расследования прежнему обвинению; «но» естественно передаёт этот поворот.
- source_word: τοὺς ... Ἰουδαίους
  choice: иудеи
  rationale: В контексте греческой Есфири слово обозначает иудейский народ как этнорелигиозную общность.
- source_word: ὑπὸ τοῦ τρισαλιτηρίου
  choice: этот трижды проклятый человек
  rationale: Редкое усиленное ругательство передано выразительно и близко к буквальному смыслу; «человек» проясняет субстантивированное прилагательное.
- source_word: παραδεδομένους εἰς ἀφανισμόν
  choice: предал на уничтожение
  rationale: Оборот выражает передачу людей на погибель; активная русская конструкция естественна, поскольку деятель назван непосредственно.
- source_word: εὑρίσκομεν
  choice: мы установили
  rationale: В официально-судебном контексте глагол означает вывод, сделанный после рассмотрения дела; «установили» звучит естественнее формального «находим».
- source_word: οὐ κακούργους ὄντας
  choice: не преступники
  rationale: κακοῦργος здесь имеет судебно-правовой оттенок и обозначает преступника или злодея.
- source_word: δικαιοτάτοις ... νόμοις
  choice: по справедливейшим законам
  rationale: Сохраняются превосходная степень и нравственно-правовой смысл δικαιότατος.
- source_word: πολιτευομένους
  choice: живут по
  rationale: Средний залог указывает на образ общественной или гражданской жизни согласно законам, а не просто на пассивное подчинение управлению.
theological_decisions:
- issue: Передача δικαιοτάτοις в нравственно-правовом контексте
  choice: справедливейшим
  alternative: праведнейшим
  rationale: «Справедливейшим» естественно характеризует законы по-русски и сохраняет юридическую и нравственную стороны слова, не придавая ему исключительно конфессионального оттенка.
