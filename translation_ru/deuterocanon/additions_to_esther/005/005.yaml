  yaml_path: translation/deuterocanon/additions_to_esther/005/005.yaml
  text: And often[a], by madness, she has made many of those appointed to positions of authority, trusted to manage affairs as friends, sharers in innocent blood, and has engulfed them in disasters beyond remedy[b],
translation:
  language: ru
  text: И часто[a] она в безумии делала многих из тех, кто был назначен на властные должности, — тех, кому как друзьям было доверено управлять делами, — соучастниками пролития невинной крови[b] и ввергала их в непоправимые бедствия,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте подразумевается подлежащее женского рода («она делала… ввергала»), но в этом стихе оно прямо не названо.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «соучастниками невинной крови»; речь идёт о причастности к пролитию невинной крови.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλάκις
  choice: часто
  rationale: Передаёт повторяемость действия естественным современным русским наречием.
- source_word: τῶν ἐπʼ ἐξουσίας τεταγμένων
  choice: из поставленных у власти
  rationale: Сохраняет значение назначения людей на властные должности, а не просто обладания влиянием.
- source_word: τῶν πιστευθέντων χειρίζειν φίλων τὰ πράγματα
  choice: тех, кому как друзьям было доверено управлять делами
  rationale: Передаёт значение доверия, инфинитив χειρίζειν как управление делами и синтаксически сжатое φίλων как положение доверенных друзей.
- source_word: παρανοίᾳ
  choice: в своём безумии
  rationale: Передаёт инструментально-причинный дательный и сильное значение помрачения рассудка; притяжательное местоимение естественно связывает безумие с подразумеваемым женским субъектом.
- source_word: μετόχους αἱμάτων ἀθώων
  choice: соучастниками пролития невинной крови
  rationale: Выражает причастность к кровопролитию и естественно передаёт семитизированный оборот с множественным αἱμάτων.
- source_word: καταστῆσα
  choice: делала
  rationale: 'Передаёт каузативный смысл: она приводила этих людей в состояние соучастников.'
- source_word: περιέβαλε συμφοραῖς ἀνηκέστοις
  choice: ввергала их в непоправимые бедствия
  rationale: Естественно передаёт образ охватывания бедствиями и значение ἀνήκεστος — того, что нельзя исправить или устранить.
theological_decisions:
- issue: Референт подразумеваемого подлежащего женского рода
  choice: Сохранить местоимение «она», не называя референт
  alternative: Назвать её судьбой, яростью царя или олицетворённым пагубным побуждением
  rationale: Греческие глагольные формы указывают на субъект женского рода, однако в пределах данного стиха он прямо не назван; перевод сохраняет эту неоднозначность.
