    text: 'Так в греческом добавлении: «македонянин». Это обозначение может отражать историческую обстановку или полемическую направленность греческой традиции.'
    reason: cultural_note
  - marker: b
    text: Греческое выражение, переданное словами «чуждый подлинно персидскому роду», синтаксически трудно; по смыслу речь идёт о том, что Аман не был подлинно персидского происхождения.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἁμὰν Ἁμαδάθου
  choice: Аман, сын Амадафа
  rationale: Родительный падеж имени естественно передаёт отчество; форма «Амадаф» соответствует греческому Ἁμαδάθου.
- source_word: Μακεδὼν
  choice: македонянин
  rationale: Сохраняет прямо указанную в греческом тексте этническую принадлежность Амана.
- source_word: ταῖς ἀληθείας ἀλλότριος τοῦ τῶν Περσῶν αἵματος
  choice: чуждый истинно персидскому роду
  rationale: Греческая конструкция синтаксически трудна. Перевод сохраняет значение ἀλλότριος и возможную связь ἀληθείας с подлинностью персидского происхождения, но передаёт метафору крови естественным русским словом «род».
- source_word: πολὺ διεστηκὼς
  choice: весьма далёкий
  rationale: Передаёт устойчивое состояние значительной нравственной дистанции.
- source_word: τῆς ἡμετέρας χρηστότητος
  choice: от нашей доброты
  rationale: χρηστότης здесь обозначает доброту или благосклонность царя; «доброта» близка к форме исходного выражения и естественна в контексте.
- source_word: ἐπιξενωθεὶς ἡμῖν
  choice: хотя и был принят нами как гость
  rationale: Пассивная форма обозначает оказанное гостеприимство; союз «хотя» выявляет подразумеваемое контекстом уступительное отношение.
theological_decisions:
- issue: Этническое обозначение Амана в греческом добавлении
  choice: Сохранить «македонянин» в основном тексте
  alternative: Передать обобщённо как «чужеземец» или счесть поздней глоссой
  rationale: Чтение Μακεδών прямо засвидетельствовано данным греческим источником. Исторически или полемически окрашенное обозначение не следует устранять при переводе.
- issue: Неясная конструкция о персидском происхождении
  choice: «чуждый истинно персидскому роду»
  alternative: «не принадлежавший к персидскому роду»
  rationale: Выбранный вариант сохраняет присутствующую в тексте идею ἀληθείας, не превращая трудную конструкцию в однозначное историческое утверждение сверх источника.
