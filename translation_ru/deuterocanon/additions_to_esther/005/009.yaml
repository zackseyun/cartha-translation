lexical_decisions:
- source_word: χρώμενοι ταῖς μεταβολαῖς
  choice: пользуясь переменами
  rationale: Причастный оборот передаёт использование изменившихся обстоятельств; сохраняет общность и некоторую неоднозначность греческого выражения.
