  source_fidelity: 'Черновик существенно перестраивает смысл: «обеспечить всем людям мирную и спокойную жизнь в царстве» заменяет объект παρέξεσθαι («предоставить/обеспечить царство») на «жизнь» и добавляет это понятие, которого в греческом тексте нет. Кроме того, ἀτάραχον относится к βασιλείαν, а не непосредственно к жизни людей. Исправленный текст сохраняет «царство» как объект и отдельно передаёт его свободу от волнений и μετʼ εἰρήνης.'
  naturalness: «Уделять внимание тому, что будет после этого» — современная литературная и естественная передача προσέχειν εἰς τὰ μετὰ ταῦτα. Формула «предоставить всем людям царство, свободное от потрясений, в мире» несколько приподнята, но уместна в официальном регистре царского обращения и ближе к синтаксису оригинала, чем экспликация «жизнь в царстве».
  terminology: Βασιλεία передано словом «царство» без неоправданного сведения к «жизни в царстве». Ἀτάραχον передано как «свободное от потрясений», что передаёт отсутствие смуты/волнений; «в мире» сохраняет отдельное μετʼ εἰρήνης. «Все люди» верно передаёт τοῖς πᾶσιν ἀνθρώποις.
