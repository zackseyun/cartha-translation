lexical_decisions:
- source_word: προσέχειν
  choice: заботиться
  rationale: Глагол означает «обращать внимание, принимать во внимание, заботиться»; в сочетании с последующей временной фразой передаёт осмотрительное внимание к будущим последствиям.
- source_word: τὰ μετὰ ταῦτα
  choice: о том, что будет после этого
  rationale: 'Естественно передаёт временное значение: последующие события или последствия.'
- source_word: Βασιλείαν
  choice: жизнь в царстве
  rationale: Βασιλεία может обозначать царство, государство или царское правление. В данной синтаксической конструкции по-русски требуется небольшая экспликация, чтобы царство как политический порядок могло быть обеспечено людям.
- source_word: ἀτάραχον
  choice: спокойную
  rationale: Передаёт состояние без смуты, потрясений и волнений; в контексте государственного устройства естественно сочетается со словом «мирную».
- source_word: τοῖς πᾶσιν ἀνθρώποις
  choice: всем людям
  rationale: Сохраняет универсальный объём выражения и не ограничивает ἀνθρώποις мужчинами.
- source_word: μετʼ εἰρήνης
  choice: мирную
  rationale: По-русски атрибутивная передача рядом со словом «спокойную» естественно выражает жизнь в условиях мира, хотя буквально оборот означает «с миром».
- source_word: παρέξεσθαι
  choice: обеспечить
  rationale: Будущий средний инфинитив означает предоставить или обеспечить; «обеспечить» естественно передаёт целенаправленное создание устойчивого государственного порядка.
