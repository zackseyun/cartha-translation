lexical_decisions:
- source_word: διὰ γὰρ τῶν τρόπων τούτων
  choice: Ибо… такими средствами
  rationale: γάρ сохраняет пояснительную связь с предыдущим высказыванием, а τρόποι в контексте политического заговора обозначает способы или средства достижения цели.
- source_word: ᾠήθη
  choice: он полагал
  rationale: Глагол передаёт предположение или расчёт; «полагал» естественно вводит последующее содержание мысли и соответствует достоинству регистра.
- source_word: λαβὼν ἡμᾶς ἐρήμους
  choice: доведя нас до запустения
  rationale: Идиоматическое сочетание причастия λαβών с предикативным ἐρήμους описывает наступившее для «нас» состояние опустошённости или оставленности. Русская формулировка передаёт предшествующее действие, не ограничивая смысл исключительно физическим разорением.
- source_word: τὴν τῶν Περσῶν ἐπικράτησιν
  choice: господство персов
  rationale: ἐπικράτησις означает господство, преобладание или власть. «Господство» сохраняет отвлечённый политический смысл существительного и не подменяет его более конкретным словом «империя».
- source_word: εἰς τοὺς Μακεδόνας μετάξει
  choice: передаст… македонянам
  rationale: μετάξει обозначает перенос власти от одной стороны к другой; в русском политическом контексте «передаст» звучит естественнее буквального «перенесёт». Будущее время сохраняется внутри косвенно переданного содержания мысли.
theological_decisions:
- issue: Историко-политическая формулировка в греческом добавлении к книге Есфирь
  choice: Сохранить прямое упоминание господства персов и македонян.
  alternative: Обобщить как «передать Персидское царство грекам».
  rationale: Греческий текст прямо называет персов и македонян и говорит о переходе господства; историческая гармонизация или замена этнонимов не оправдана источником.
