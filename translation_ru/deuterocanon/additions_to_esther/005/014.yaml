  text: For by these methods he thought that[a], once he had made us desolate, he would transfer the rule of the Persians to the Macedonians.
translation:
  language: ru
  text: Ибо он полагал, что такими средствами, доведя нас до запустения[a], передаст господство персов македонянам.
  philosophy: optimal-equivalence
  footnotes:
