  text: 'The following is a copy of the letter: Great King Artaxerxes to the rulers of the provinces of the one hundred twenty-seven satrapies from India to Ethiopia[a], and to those who are loyal to our interests: greetings.'
translation:
  language: ru
  text: 'Ниже приводится копия письма: «Великий царь Артаксеркс приветствует правителей областей в ста двадцати семи сатрапиях от Индии до Эфиопии и тех, кто поддерживает наши интересы[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тех, кто мыслит о нашем»; то есть тех, кто поддерживает сторону царя или благосклонен к его делу.'
    reason: Сноска сохраняет необычную буквальную форму греческого оборота и поясняет его политический смысл.
