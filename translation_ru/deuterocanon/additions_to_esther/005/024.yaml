base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/005/024.yaml
  text: But every city or region as a whole that does not act according to these orders will be consumed with spear and fire in wrath[a]; it will be made not only impassable to men[b], but also most hateful to wild animals and birds for all time.
translation:
  language: ru
  text: Но всякий город или всякая область, которые целиком не поступят в соответствии с этими предписаниями, будут в гневе уничтожены копьём[a] и огнём; они станут не только непроходимыми для людей, но и крайне ненавистными диким зверям и птицам на все времена[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «копьём и огнём»; слово «копьё» может в этом контексте обозначать вооружённую силу вообще, поэтому иногда переводят «мечом».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «в гневе» может указывать на ярость, сопровождающую уничтожение; в греческом тексте не сказано прямо, чей это гнев.
    reason: preserve_ambiguity
lexical_decisions:
- source_word: πᾶσα δὲ πόλις ἢ χώρα τὸ σύνολον
  choice: Но всякий город или всякая область в целом
  rationale: Передаёт разделительное «город или область» и усиление целостности в τὸ σύνολον. Повторение «всякий / всякая» естественно выражает дистрибутивный смысл πᾶσα по-русски.
- source_word: κατὰ ταῦτα μὴ ποιήσῃ
  choice: где не поступят согласно этому
  rationale: Сохраняет формальную отсылку ταῦτα к изложенному ранее предписанию, не подменяя её более конкретным словом «указ»; безлично-множественная конструкция позволяет естественно согласовать «город или область».
- source_word: δόρατι καὶ πυρὶ
  choice: копьём и огнём
  rationale: δόρυ прямо означает «копьё»; конкретный образ вооружённого насилия сохранён, а не обобщён словом «меч».
- source_word: καταναλωθήσεται μετʼ ὀργῆς
  choice: подвергнется уничтожению ... во гневе
  rationale: Передаёт результативную силу καταναλίσκω и сохраняет отдельно стоящее указание на гнев, не уточняя отсутствующего в греческом тексте носителя этого гнева.
- source_word: ἄβατος
  choice: непроходимой
  rationale: Отражает буквальный смысл места, куда нельзя войти или через которое нельзя пройти; по контексту речь идёт об опустошённой местности.
- source_word: ἀνθρώποις
  choice: для людей
  rationale: ἀνθρώποις обозначает здесь людей вообще; русское «людей» точно и естественно передаёт родовое значение.
- source_word: θηρίοις καὶ πετεινοῖς
  choice: диким зверям и птицам
  rationale: Различает диких животных (θηρία) и летающих существ, то есть птиц (πετεινά), ясным современным языком.
- source_word: εἰς τὸν ἅπαντα χρόνον
  choice: на все времена
  rationale: Сохраняет усиленное указание на полную и продолжительную длительность, не ослабляя его до неопределённого «надолго».
- source_word: ἔχθιστος κατασταθήσεται
  choice: станет ... крайне ненавистной
  rationale: «Крайне ненавистной» передаёт превосходную степень ἔχθιστος, а «станет» — изменение состояния в κατασταθήσεται.
theological_decisions:
- issue: Неуказанный носитель гнева в μετʼ ὀργῆς
  choice: во гневе
  alternative: с яростью / из-за гнева
  rationale: Греческий текст не называет прямо, чей это гнев, и допускает понимание оборота как указания на сопровождающую наказание ярость. Перевод не приписывает гнев явно ни Богу, ни царю, ни исполнителям.
- issue: Конкретный образ δόρατι
  choice: копьём
  alternative: мечом / оружием
  rationale: Приоритет греческого источника требует сохранить конкретное «копьё», не заменяя его традиционным или обобщающим обозначением вооружённого уничтожения.
translation_notes:
  register: Современный литературный русский язык с торжественной, указной интонацией. Конструкции остаются понятными обычному читателю; формула «согласно этому» намеренно сохраняет анафорическую неопределённость оригинала. Во втором предложении введено «эта местность» для естественного русского согласования после пары «город или область», без изменения референта.
