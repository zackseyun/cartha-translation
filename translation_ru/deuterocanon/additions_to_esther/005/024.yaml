revisions:
- from: Но всякий город или всякая область в целом, где не поступят согласно этому, подвергнется уничтожению копьём и огнём во гневе[a][b]. Эта местность станет не только непроходимой для людей, но и на все времена крайне ненавистной диким зверям и птицам.
  to: Но всякий город или всякая область, которые целиком не поступят в соответствии с этими предписаниями, будут в гневе уничтожены копьём[a] и огнём; они станут не только непроходимыми для людей, но и крайне ненавистными диким зверям и птицам на все времена[b].
  rationale: Исправлены синтаксическая связь первого придаточного и сужающий референт «эта местность». Анафорическое ταῦτα передано как «эти предписания» в соответствии с контекстом указа и английским аудит-трейлом. Сноски переставлены так, чтобы якорь [a] стоял после «копьём», а [b] — после утверждения, включающего «в гневе»; содержание примечаний не меняет смысла текста.
