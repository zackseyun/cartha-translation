review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: κύριος дважды передан как «Господь», πάντων — как «всего», а второе τῷ κυρίῳ обоснованно понято как молитвенное обращение «Господи». Однако «восстанет против» может обозначать именно мятеж или восстание, тогда как ἀντιτάξεται шире: «выступит против», «противостанет».'
  naturalness: Фраза литературна и соответствует возвышенному молитвенному регистру. «Выступит против Тебя» звучит современно и точнее без излишней конкретизации характера противодействия.
  terminology: «Господь всего» и «Господи» уместны. Альтернативное «Господь всех» в сноске может в русском языке восприниматься преимущественно как власть над людьми и потому несколько сужает широкий охват πάντων; «Господь над всем» лучше сохраняет его.
  issues:
  - severity: medium
    issue: «восстанет против» для ἀντιτάξεται
    rationale: Русское «восстать» обычно вызывает представление о бунте или мятеже. Греческое слово означает занять позицию против, противостоять; нейтральное «выступит против» точнее сохраняет широту исходного выражения.
  - severity: low
    issue: Сноска «Господь всех»
    rationale: При возможном широком, не только личном значении πάντων вариант «всех» в русском может сузить референцию до людей. «Господь над всем» сохраняет всеохватность, оставаясь допустимым смысловым вариантом.
  revised_text: И Ты — Господь всего[a], и нет никого, кто выступит против Тебя, Господи.
