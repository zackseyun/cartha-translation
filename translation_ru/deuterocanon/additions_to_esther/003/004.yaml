lexical_decisions:
- source_word: κύριος
  choice: Господь
  rationale: В молитвенном обращении это божественный титул; «Господь» естественно передаёт и власть, и благоговейное звучание.
- source_word: πάντων
  choice: всего
  rationale: Родительный падеж после κύριος передан близким и естественным сочетанием «Господь всего»; форма сохраняет широкий охват греческого πάντων.
- source_word: οὐκ ἔστιν ὃς
  choice: нет никого, кто
  rationale: Сохраняет общую отрицательную конструкцию и структуру относительного придаточного, не добавляя модального значения «не может».
- source_word: ἀντιτάξεται
  choice: восстанет против
  rationale: Передаёт будущее среднее значение глагола — занять позицию против кого-либо; формулировка уместна для возвышенной молитвенной речи.
- source_word: σοι
  choice: против Тебя
  rationale: Дательный падеж при ἀντιτάσσομαι по-русски естественно передаётся предложной конструкцией «против Тебя».
- source_word: τῷ κυρίῳ
  choice: Господи
  rationale: Артикулированный дательный в контексте молитвы понят как обращение, что соответствует употреблению форм с артиклем в функции вокатива в койне и LXX.
theological_decisions:
- issue: Повтор κύριος в прямом обращении к Богу
  choice: Господь … Господи
  alternative: Господь … Господу
  rationale: Второе τῷ κυρίῳ формально является дательным с артиклем, но молитвенный контекст поддерживает вокативную функцию. «Господи» сохраняет связный смысл и силу прямого обращения, не вводя дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Заглавные буквы в местоимениях «Ты», «Тебя» отмечают прямое обращение к Богу согласно принятой русской религиозно-литературной норме.
