lexical_decisions:
- source_word: καὶ νῦν
  choice: И ныне
  rationale: Сохраняет присоединительную связь и временное значение без добавления невыраженного противопоставления; «ныне» уместно в возвышенной молитвенной речи.
- source_word: ἡμάρτομεν
  choice: мы согрешили
  rationale: Аорист ἁμαρτάνω передан естественной русской формой совершенного вида, обозначающей совершённый грех с сохраняющимися последствиями.
- source_word: ἐνώπιόν σου
  choice: пред Тобой
  rationale: Передаёт пребывание перед Божьим лицом и сохраняет одновременно личный и судебный оттенок выражения.
- source_word: παρέδωκας
  choice: Ты предал нас
  rationale: Прямо выражает передачу народа под власть врагов и сохраняет указанное греческим текстом действие Бога как суда.
- source_word: εἰς χεῖρας
  choice: в руки
  rationale: Сохраняет естественный для русского библейского языка образ власти и подчинения.
- source_word: τῶν ἐχθρῶν ἡμῶν
  choice: наших врагов
  rationale: Прямой и контекстуально точный эквивалент, не заменяющий враждебный статус эмоциональной характеристикой.
theological_decisions:
- issue: Божественное действие в суде над Израилем
  choice: Сохранено прямое утверждение, что Бог предал народ в руки врагов вследствие его греха.
  alternative: Смягчить формулировку так, чтобы Божье действие было лишь косвенным или неявным.
  rationale: Греческий текст прямо обращается к Богу во втором лице и ставит Его субъектом παρέδωκας; эту богословскую напряжённость нельзя скрывать.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Формы «ныне» и «пред Тобой» сохраняют достоинство и библейскую интонацию, оставаясь понятными современному читателю. Заглавные буквы в местоимениях обращения к Богу использованы последовательно в пределах стиха.
