translation:
  language: ru
  text: и открыть уста народов для восхваления ничтожных вещей[a], и чтобы царём из плоти[b] восхищались вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для возвещения достоинств ничтожных вещей» или «для восхваления суетного». В контексте речь может идти о ничтожных идолах, однако в греческом тексте слово «идолы» отсутствует.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «смертным царём» или «всего лишь человеческим царём». Буквально: «царём из плоти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοῖξαι στόμα
  choice: открыть уста
  rationale: Сохранён греческий образ, обозначающий возможность или повод заговорить; «уста» соответствует достоинству молитвенного контекста и остаётся понятным современному читателю.
- source_word: ἐθνῶν
  choice: народов
  rationale: Передаёт широкое значение ἔθνη без более узкого и конфессионально окрашенного варианта «язычников».
- source_word: ἀρετὰς
  choice: прославления
  rationale: В данном сочетании слово обозначает приписывание достоинств, то есть хвалу или прославление. Такой вариант естественнее по-русски, чем буквальное «достоинства ничтожных вещей».
- source_word: ματαίων
  choice: ничтожных вещей
  rationale: Сохраняет субстантивированное и намеренно неопределённое значение греческого слова — нечто пустое, суетное или лишённое подлинной ценности — без добавления отсутствующего существительного «идолы».
- source_word: θαυμασθῆναι
  choice: чтобы … восхищались
  rationale: Передаёт пассивную идею удивления и почтительного восхищения, не усиливая её до прямого поклонения.
- source_word: βασιλέα σάρκινον
  choice: царём из плоти
  rationale: Сохранён конкретный греческий образ царя, состоящего из плоти, и тем самым контраст между человеческим правителем и Богом; вариант «плотской царь» по-русски мог бы ошибочно подразумевать нравственную порочность.
- source_word: εἰς αἰῶνα
  choice: вовеки
  rationale: Традиционно и естественно передаёт значение неограниченной продолжительности в возвышенном молитвенном регистре.
theological_decisions:
- issue: Следует ли явно понимать ματαίων как идолов
  choice: ничтожных вещей
  alternative: ничтожных идолов
  rationale: Контекст допускает антиидолопоклоннический смысл, однако само греческое слово не называет идолов прямо. Основной текст сохраняет эту неопределённость, а примечание указывает возможное контекстуальное понимание.
- issue: Как передать противопоставление человеческого царя Богу в σάρκινον
  choice: царь из плоти
  alternative: смертный царь; всего лишь человеческий царь
  rationale: Буквальный образ плоти сохраняет богословское напряжение текста и не разворачивает его в пояснительный пересказ.
- issue: Насколько усиливать θαυμασθῆναι до культового почитания
  choice: восхищались
  alternative: поклонялись; почитали
  rationale: Глагол выражает удивление или восхищение. Хотя контекст сближает это с неправомерным возвеличиванием царя, перевод «поклонялись» был бы лексически сильнее оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной молитвенной лексикой. «Уста» и «вовеки» поддерживают торжественный регистр; синтаксис сохраняет координацию греческих инфинитивных оборотов. Все примечания отмечены в основном тексте.
