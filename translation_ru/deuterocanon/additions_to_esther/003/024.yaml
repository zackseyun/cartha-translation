lexical_decisions:
- source_word: ῥῦσαι
  choice: избавь
  rationale: Аорист повелительного наклонения передаёт настоятельную мольбу об избавлении от опасности; «избавь» естественно для русской молитвенной речи и не сужает смысл до физического спасения.
- source_word: ἐν χειρί σου
  choice: Своей рукой
  rationale: Сохраняет библейский образ руки как орудия силы и действия Бога; творительный падеж естественно выражает средство действия по-русски.
- source_word: βοήθησόν μοι
  choice: помоги мне
  rationale: Прямо и естественно передаёт императив с дательным местоимением.
- source_word: τῇ μόνῃ
  choice: одинокой
  rationale: Форма женского рода относится к говорящей Эсфири; «одинокой» сохраняет и грамматическое согласование, и смысл её оставленности.
- source_word: μὴ ἔχουσῃ εἰ μὴ σέ
  choice: у которой нет никого, кроме Тебя
  rationale: Естественно передаёт продолжающееся описание говорящей и подразумеваемый личный объект, не устраняя исключительное упование на Бога.
- source_word: Κύριε
  choice: Господи
  rationale: В прямом обращении к Богу употреблена нормативная русская звательная форма титула «Господь».
- source_word: πάντων γνῶσιν ἔχεις
  choice: Ты обладаешь знанием обо всём
  rationale: Сохраняет именную конструкцию γνῶσιν ἔχεις, её возвышенный молитвенный регистр и широкое значение πάντων.
theological_decisions:
- issue: Передача κύριος при прямом обращении к Богу
  choice: Господи
  alternative: Владыка
  rationale: Контекст представляет молитвенное обращение к Богу Израиля; «Господи» является естественной и традиционной передачей κύριε без внесения дополнительного конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Сохранены образ «руки», женский род самоописания Эсфири и именная конструкция о Божьем знании. Конечная запятая отражает синтаксическое продолжение мысли в следующем сегменте.
