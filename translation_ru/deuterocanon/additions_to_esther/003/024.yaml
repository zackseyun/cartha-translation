  source_fidelity: 'Текст точно передаёт все элементы греческого оригинала: просьбу об избавлении «рукой» Бога, личную просьбу о помощи, женское самоописание говорящей как оставшейся одной, исключение «кроме Тебя», обращение «Господи» и утверждение о всеобъемлющем Божьем знании. Конечная запятая оправданно сохраняет незавершённость греческой фразы.'
