translation:
  language: ru
  text: И раба Твоя со дня моей перемены и доныне не находила радости, кроме как в Тебе, Господи, Боже Авраама.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλη
  choice: раба
  rationale: Форма женского рода обозначает рабыню и служит здесь смиренным самоименованием Эсфири перед Богом. «Раба Твоя» точно передаёт зависимое положение и естественно звучит в русском молитвенном регистре.
- source_word: ηὐφράνθη
  choice: не находила радости
  rationale: Глагол означает радоваться, быть в радости. Такая передача позволяет естественно соединить его с выражением πλὴν ἐπὶ σοί, не усиливая и не ослабляя эмоциональный смысл.
- source_word: ἀφʼ ἡμέρας μεταβολῆς μου
  choice: со дня перемены моей
  rationale: μεταβολή означает перемену, изменение или поворот обстоятельств. Близкая к греческому формулировка сохраняет неуточнённым, о какой именно перемене идёт речь.
- source_word: πλὴν ἐπὶ σοί
  choice: ни в чём, кроме Тебя
  rationale: πλήν вводит исключение, а ἐπί с дательным указывает на основание или сферу радости. Перевод ясно выражает, что единственным источником радости для Эсфири был Бог.
- source_word: Κύριε ὁ θεὸς Ἀβραάμ
  choice: Господи, Боже Авраама
  rationale: Сохраняются обращение к Господу и заветный титул Бога Авраама; русский звательный молитвенный оборот естественно требует форм «Господи, Боже».
theological_decisions:
- issue: Самоименование δούλη в молитве
  choice: раба Твоя
  alternative: служанка Твоя
  rationale: «Раба» сохраняет силу слова δούλη и выраженное в молитве полное смирение и зависимость от Бога; «служанка» возможно лексически, но смягчает исходный образ.
- issue: Смысл μεταβολή в молитве Эсфири
  choice: перемена моя
  alternative: переворот в моей судьбе; изменение моего положения
  rationale: Греческий текст не поясняет, относится ли перемена к положению, обстоятельствам или судьбе Эсфири. Основной текст сохраняет эту смысловую открытость.
- issue: Бог как единственное основание радости
  choice: не находила радости ни в чём, кроме Тебя
  alternative: не радовалась, кроме как о Тебе
  rationale: Выбранная формулировка естественно передаёт πλὴν ἐπὶ σοί и не уточняет сверх текста, была ли эта радость направлена на Бога или основана на Нём.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Инверсия «раба Твоя» и формы «Господи, Боже» сохраняют уместный библейско-молитвенный строй, не делая текст архаичным; неуточнённость слова μεταβολή сохранена.
