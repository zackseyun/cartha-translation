  source_fidelity: 'Основной смысл передан верно: δούλη — женское смиренное самоименование перед Богом; χρονологические границы «со дня … доныне» сохранены; μεταβολή не конкретизируется; обращение «Господи, Боже Авраама» точно. Однако «ни в чём» вводит всеобъемлющий объект, которого в греческом нет: πλὴν ἐπὶ σοί противопоставляет радость Богу как её сфере/основанию, а не утверждает буквально отсутствие радости во всех иных предметах.'
