revisions:
- from: Я с рождения слышала в колене моего отцовского рода, что Ты, Господи, взял Израиль из всех народов и отцов наших — из всех их предков Себе в вечное наследие и сделал для них всё, что сказал.[a]
  to: Я с рождения слышала в колене моего рода, что Ты, Господи, взял Израиль из всех народов и наших отцов — из всех их предков — как вечное наследие и сделал для них всё, что сказал.[a]
  rationale: Исправление устраняет невыраженное в оригинале «Себе», делает обозначение родовой группы естественнее и уточняет пунктуацией параллельную, намеренно несколько напряжённую конструкцию оригинала. Альтернативное, более идиоматичное понимание последней части сохранено в сноске без подмены «сказал» словом «обещал».
