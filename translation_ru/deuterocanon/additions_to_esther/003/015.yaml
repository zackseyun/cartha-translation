base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/015.yaml
  text: I had heard from my birth[a], in the tribe of my ancestral family, that you, Lord, took Israel from among all the nations, and our fathers from among all their ancestors, as an everlasting inheritance, and you did for them what you spoke.
translation:
  language: ru
  text: Я с рождения слышала в колене моего рода, что Ты, Господи, взял Израиль из всех народов и наших отцов — из всех их предков — как вечное наследие и сделал для них всё, что сказал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполнил для них то, что сказал». Буквально по-гречески: «сделал для них то, что сказал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ ἤκουον ἐκ γενετῆς μου
  choice: Я с рождения слышала
  rationale: Имперфект передаёт устойчиво воспринятое с ранних лет предание; «с рождения» естественно выражает временной смысл ἐκ γενετῆς μου. Женский род обусловлен речью Есфири в Addition C.
- source_word: ἐν φυλῇ πατριάς μου
  choice: в колене моего отцовского рода
  rationale: φυλή обозначает колено, а πατριά — родовую, отцовскую линию; перевод сохраняет оба родственных понятия без их слияния.
- source_word: σύ, Κύριε
  choice: Ты, Господи
  rationale: Сохранены личное обращение и звательная форма, естественные для молитвенного русского регистра.
- source_word: ἔλαβες τὸν Ἰσραὴλ ἐκ πάντων τῶν ἐθνῶν
  choice: взял Израиль из всех народов
  rationale: «Взял» близко передаёт λαμβάνω и не конкретизирует его как «избрал»; ἔθνη передано нейтральным «народы».
- source_word: τοὺς πατέρας ἡμῶν ἐκ πάντων τῶν προγόνων αὐτῶν
  choice: отцов наших — из всех их предков
  rationale: Сохранено различие между πατέρες («отцы») и πρόγονοι («предки»), а также неоднозначная синтаксическая параллель греческого текста.
- source_word: εἰς κληρονομίαν αἰώνιον
  choice: Себе в вечное наследие
  rationale: «В вечное наследие» сохраняет заветную лексику; «Себе» естественно выражает подразумеваемого обладателя наследия, не меняя референта взятых Израиля и отцов.
- source_word: ἐποίησας αὐτοῖς ὅσα ἐλάλησας
  choice: сделал для них всё, что сказал
  rationale: Формулировка близка буквальному «сделал им то, что сказал» и сохраняет связь между Божьим словом и действием, не подменяя ἐλάλησας словом «обещал».
theological_decisions:
- issue: Заветный смысл выражения εἰς κληρονομίαν αἰώνιον
  choice: «Себе в вечное наследие»
  alternative: «в вечное достояние» или «как вечное наследие»
  rationale: «Наследие» сохраняет традиционную библейскую и заветную образность, не уточняя сверх текста характер владения и не снимая напряжение между избранием народа и его принадлежностью Богу.
- issue: Соотношение сказанного Богом и исполненного Им
  choice: «сделал для них всё, что сказал»
  alternative: «исполнил для них всё, что обещал»
  rationale: Основной текст сохраняет более широкое значение λαλέω и не превращает всякое Божье высказывание исключительно в обещание; идиоматическое понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Местоимения обращения к Богу написаны с прописной буквы по принятой русской библейской традиции. Синтаксис сохраняет торжественный параллелизм исходного текста, но избегает архаизмов.
