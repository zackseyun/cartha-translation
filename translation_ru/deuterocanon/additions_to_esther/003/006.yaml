lexical_decisions:
- source_word: ἠδυνάμην
  choice: я могла бы
  rationale: Имперфект δύναμαι в контексте молитвы выражает возможность или готовность в гипотетическом смысле; условная форма естественна по-русски и не представляет действие как действительно совершённое.
- source_word: φιλεῖν
  choice: целовать
  rationale: При телесном объекте «подошвы его ног» глагол естественнее всего обозначает поцелуй как жест крайнего почтения или покорности, а не любовь вообще.
- source_word: πέλματα ποδῶν αὐτοῦ
  choice: подошвы его ног
  rationale: πέλμα означает подошву, нижнюю поверхность стопы; перевод сохраняет конкретный и выразительный образ греческого текста.
- source_word: πρὸς σωτηρίαν Ἰσραήλ
  choice: ради спасения Израиля
  rationale: πρός здесь указывает на цель, а σωτηρία — на спасение или избавление. «Ради» ясно передаёт целевое значение и звучит естественно в данном порядке слов.
theological_decisions:
- issue: Характер слов Есфири о покорности царю
  choice: Гипотетическое выражение готовности к крайнему жесту почтения ради спасения Израиля
  alternative: Сообщение о действительно совершённом поступке либо об общей любви и привязанности
  rationale: Форма ἠδυνάμην в контексте допускает условное понимание, а конкретное упоминание подошв ног указывает на крайний жест покорности, не на обобщённую привязанность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Порядок слов «ради спасения Израиля» подчёркивает мотив поступка; образ подошв ног сохранён без смягчения.
