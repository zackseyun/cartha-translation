base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/005.yaml
  text: You know all things; you know[a], Lord, that it was not in insolence or in pride or in ambition that I did this—refusing to bow down to the proud Haman.
translation:
  language: ru
  text: 'Ты знаешь всё; Ты знаешь, Господи, что я сделал это не из дерзости, не из гордости и не из честолюбия: я не поклонился[a] надменному Аману.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не простёрся ниц перед надменным Аманом».'
    reason: Глагол προσκυνέω может обозначать как поклон, так и простирание ниц в знак почтения.
lexical_decisions:
- source_word: σὺ πάντα γινώσκεις
  choice: Ты знаешь всё
  rationale: Сохраняет всеохватность Божьего знания и прямое молитвенное обращение; формулировка естественна для современного русского языка.
- source_word: σὺ οἶδας
  choice: Ты знаешь
  rationale: Повтор глагола знания сохранён, поскольку в греческом тексте он служит молитвенному усилению.
- source_word: Κύριε
  choice: Господи
  rationale: Традиционная и естественная русская форма прямого обращения к Богу.
- source_word: οὐκ ἐν ὕβρει
  choice: не из дерзости
  rationale: Передаёт вызывающую, оскорбительную самонадеянность ὕβρις и при этом отличается от следующего обозначения гордости.
- source_word: οὐδὲ ἐν ὑπερηφανείᾳ
  choice: не из гордости
  rationale: Прямой современный эквивалент, сохраняющий отдельный элемент трёхчастного перечисления мотивов.
- source_word: οὐδὲ ἐν φιλοδοξίᾳ
  choice: не из честолюбия
  rationale: Передаёт стремление к почёту и возвышению себя, присущее φιλοδοξία, точнее контекстуально, чем нейтральное «стремление к успеху».
- source_word: ἐποίησα τοῦτο
  choice: я сделал это
  rationale: Сохраняет указательную формулировку оригинала; последующая фраза поясняет, в чём состоял поступок.
- source_word: τὸ μὴ προσκυνεῖν
  choice: я не поклонился
  rationale: Естественно передаёт пояснительный инфинитив и жест почтения перед человеком; более буквальный телесный оттенок отмечен в сноске.
- source_word: τὸν ὑπερήφανον Ἁμάν
  choice: надменному Аману
  rationale: «Надменному» сохраняет нравственную характеристику Амана и позволяет не повторять слово «гордый» вслед за существительным «гордость».
theological_decisions:
- issue: Мотив отказа Мардохея оказать почтение Аману
  choice: Отказ представлен как поступок, совершённый не из дерзости, гордости или честолюбия, без указания положительного мотива.
  alternative: Прямо определить мотив как исключительно религиозный либо как политический или личный.
  rationale: Греческий текст отрицает три недостойных мотива, но в этом стихе не называет положительного; перевод не восполняет намеренное умолчание.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Повтор «Ты знаешь» и трёхчастное отрицание сохранены; двоеточие ясно связывает «сделал это» с последующим пояснением.
