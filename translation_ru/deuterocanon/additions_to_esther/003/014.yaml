    reason: lexical_alternative
lexical_decisions:
- source_word: κίνδυνός μου
  choice: моя жизнь в опасности
  rationale: Существительное κίνδυνος буквально означает «опасность, риск». В данном выражении речь идёт об угрозе самой жизни; перевод передаёт смысл естественно по-русски, не создавая ложного впечатления, будто говорящая распоряжается своей жизнью.
- source_word: ἐν χειρί μου
  choice: в опасности
  rationale: Буквальное «в моей руке» входит в греческое выражение о непосредственной личной опасности. Русское «моя жизнь у меня в руках» обычно означает возможность самому управлять исходом, поэтому здесь метафора раскрыта по смыслу.
- source_word: ὅτι
  choice: ведь
  rationale: ὅτι вводит обоснование предшествующих слов. «Ведь» естественно передаёт пояснительно-причинную связь и сохраняет краткость фразы.
