base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/023.yaml
  text: Put fitting words in my mouth before the lion, and turn his heart to hatred against the one who is warring against us, to his destruction and that of those who are of one mind with him.
translation:
  language: ru
  text: Вложи в мои уста подходящие слова[a] перед львом[b] и обрати его сердце к ненависти к тому, кто воюет против нас, — к его погибели и погибели его единомышленников[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дай мне стройную речь». Греческое выражение может обозначать уместную, хорошо построенную речь.'
    reason: lexical_alternative
  - marker: b
    text: «Лев» — образное обозначение царя в молитве Есфири; в греческом тексте этот образ сохранён.
    reason: cultural_note
  - marker: c
    text: 'Греческое слово может означать «конец» или «завершение»; в данном контексте: «погибель», «гибельный конец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δὸς λόγον εὔρυθμον εἰς τὸ στόμα μου
  choice: Вложи в мои уста подходящие слова
  rationale: δὸς буквально означает «дай», однако в сочетании с «в уста» русское «вложи» естественно передаёт просьбу даровать нужную речь. λόγον εὔρυθμον обозначает уместно и стройно составленную речь; множественное «слова» идиоматично по-русски.
- source_word: ἐνώπιον τοῦ λέοντος
  choice: перед львом
  rationale: Сохранён прямой метафорический образ греческого текста; в контексте под львом подразумевается царь.
- source_word: μετάθες τὴν καρδίαν αὐτοῦ εἰς μῖσος
  choice: обрати его сердце к ненависти
  rationale: Передаёт просьбу изменить внутреннее расположение царя и сохраняет образ сердца и направленность, выраженную εἰς.
- source_word: τοῦ πολεμοῦντος ἡμᾶς
  choice: против того, кто воюет с нами
  rationale: Сохранены единственное число и активное значение причастия; выражение, вероятно, указывает на Амана, но не называет его вместо исходного текста.
- source_word: εἰς συντέλειαν αὐτοῦ
  choice: чтобы погиб и он
  rationale: В данном контексте συντέλεια означает доведённый до конца, гибельный исход. Конструкция с «чтобы» ясно передаёт возможный оттенок результата или цели εἰς, не изображая его как пространственное движение.
- source_word: τῶν ὁμονοούντων αὐτῷ
  choice: его единомышленники
  rationale: Краткое естественное соответствие тем, кто разделяет его намерение и действует с ним заодно; сохраняет смысл общей направленности мысли.
theological_decisions:
- issue: Следует ли раскрывать «льва» как царя в основном тексте
  choice: Сохранить «перед львом»
  alternative: перед царём
  rationale: Греческий текст намеренно сохраняет образ льва. Его замена прямым обозначением царя устранила бы литературную выразительность молитвы; пояснение вынесено в сноску.
- issue: Следует ли обобщать τοῦ πολεμοῦντος ἡμᾶς до множественного числа
  choice: 'Сохранить единственное число: «того, кто воюет с нами»'
  alternative: наших врагов
  rationale: Причастие в греческом стоит в единственном числе и указывает на главного противника, тогда как следующая фраза отдельно охватывает его сторонников.
- issue: Как передать εἰς συντέλειαν
  choice: 'Передать как результат или цель: «чтобы погиб»'
  alternative: к его концу / к его погибели
  rationale: Формулировка сохраняет гибельный смысл συντέλεια и естественно выражает направленность εἰς; она не уточняет сверх текста, идёт ли речь строго о цели или о результате.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Сохранены метафора льва, единственное число главного противника и напряжение между целью и результатом в заключительной конструкции; синтаксис сделан естественным для обычного современного читателя.
