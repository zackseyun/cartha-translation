  yaml_path: translation/deuterocanon/additions_to_esther/003/007.yaml
  text: But I did this so that I might not place the glory of man above the glory of God; and I will bow down to no one except you[a], my lord, and I will not do these things in pride.
translation:
  language: ru
  text: Но я поступил так, чтобы не поставить славу человека выше славы Бога; и я не поклонюсь никому, кроме Тебя[a], моего Господа, и не стану делать этого из гордости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и не буду поклоняться никому, кроме Тебя, моего Господа». Греческий глагол может означать как поклон в знак почтения, так и поклонение — в зависимости от контекста.'
    reason: Лексическая неоднозначность προσκυνέω.
lexical_decisions:
- source_word: ἐποίησα
  choice: я поступил
  rationale: Аорист передаёт совершённое действие; «поступил» естественно указывает на осознанный образ действий в данном контексте.
- source_word: ἵνα μὴ θῶ
  choice: чтобы не поставить
  rationale: Сохраняет целевое значение ἵνα и пространственную метафору τίθημι — поставить одну славу выше другой.
- source_word: δόξαν ἀνθρώπου
  choice: славу человека
  rationale: Повтор «слава... слава» сохраняет контраст исходного текста; единственное ἀνθρώπου передано обобщённым русским «человека».
- source_word: ὑπεράνω
  choice: выше
  rationale: 'Естественно выражает сравнительно-пространственное значение: человеческая слава не должна ставиться выше Божьей.'
- source_word: οὐ προσκυνήσω
  choice: не поклонюсь
  rationale: Русское «поклониться» сохраняет возможные значения телесного поклона, почтения и поклонения, не устраняя контекстуальную неоднозначность προσκυνέω.
- source_word: πλὴν σοῦ
  choice: никому, кроме Тебя
  rationale: Точно и естественно передаёт исключение; прописная буква отражает обращение к Богу, явное из молитвенного контекста и упоминания Божьей славы.
- source_word: τοῦ κυρίου μου
  choice: Господа моего
  rationale: Приложение после местоимения передано с сохранением торжественного порядка слов; в молитвенном контексте κύριος относится к Богу.
- source_word: οὐ ποιήσω αὐτὰ
  choice: сделаю это не
  rationale: Хотя αὐτά формально во множественном числе, по-русски здесь естественнее собирательное «это», относящееся к упомянутому поведению; отрицание объединено с обстоятельством причины.
- source_word: ἐν ὑπερηφανίᾳ
  choice: не из гордости
  rationale: В данном контексте оборот обозначает мотив поступка; «не из гордости» ясно и естественно передаёт, что отказ вызван не высокомерием.
theological_decisions:
- issue: Значение προσκυνέω при отказе воздать почтение человеку
  choice: «не поклонюсь» с примечанием
  alternative: «не буду поклоняться» или «не паду ниц»
  rationale: «Поклонюсь» удерживает связь и с внешним жестом почтения, и с религиозным поклонением, позволяя не разрешать заложенное в греческом глаголе напряжение.
- issue: К кому относится τοῦ κυρίου μου
  choice: Божественное обращение «Господа моего»
  alternative: Нейтральное «господина моего»
  rationale: 'Речь представляет собой обращение к Богу: местоимение σοῦ и приложение κυρίου μου следуют за прямым противопоставлением славы человека славе Бога. Поэтому божественное обозначение контекстуально обосновано, а не привнесено извне.'
- issue: Смысл заключительного отрицания
  choice: «и сделаю это не из гордости»
  alternative: «и не сделаю этого в гордости»
  rationale: Греческое οὐ ποιήσω αὐτὰ ἐν ὑπερηφανίᾳ формально допускает механическое присоединение отрицания к глаголу, но по смыслу Мардохей объясняет, что его поступок не продиктован гордостью. Русская формулировка передаёт это без утверждения, будто он вообще не совершит ранее названного действия.
translation_notes:
  register: Современный литературный русский язык с молитвенно-торжественным, но понятным синтаксисом. Повтор «слава... слава» и антитеза человека и Бога сохранены. Местоимение обращения к Богу написано с прописной буквы согласно принятой русской библейской норме.
