  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис ясен для широкого читателя; конкретные образы «скипетр» и «падение» сохранены, а неоднозначность необычного выражения τοῖς μὴ οὖσιν не устранена толкованием.
