base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/021.yaml
  text: Do not hand over your scepter[a], Lord, to those who do not exist, and do not let them gloat over our downfall; instead, turn their plan against them, and make an example of the one who began this attack against us.
translation:
  language: ru
  text: Не отдавай, Господи, Твой скипетр тем, кого нет[a], и не дай им насмехаться над нашим падением. Но обрати их замысел против них самих, а того, кто начал действовать против нас, сделай примером для других.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ничтожным»; или: «тем, кто — ничто». Буквально по-гречески: «тем, кто не существует».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ παραδῷς
  choice: Не отдавай
  rationale: Передаёт обычное значение παραδίδωμι — «передавать, отдавать» — и естественно звучит в молитвенном обращении.
- source_word: τὸ σκῆπρόν σου
  choice: Твой скипетр
  rationale: Сохраняет конкретный образ царской власти, выраженный словом σκῆπτρον, не заменяя его абстрактным «власть».
- source_word: τοῖς μὴ οὖσιν
  choice: тем, кого нет
  rationale: Близко воспроизводит резкое буквальное выражение «тем, кто не существует», сохраняя его возможный полемический и богословский подтекст.
- source_word: μὴ καταγελασάτωσαν ἐν τῇ πτώσει ἡμῶν
  choice: не дай им насмехаться над нашим падением
  rationale: καταγελάω означает насмешку и издевательство; «над нашим падением» естественно передаёт связь с πτῶσις, не ограничивая смысл одним лишь злорадством.
- source_word: στρέψον τὴν βουλὴν αὐτῶν ἐπʼ αὐτούς
  choice: обрати их замысел против них самих
  rationale: βουλή в данном враждебном контексте означает замысел или план; возвратное «них самих» ясно передаёт обращение замысла на его составителей.
- source_word: τὸν δὲ ἀρξάμενον ἐφʼ ἡμᾶς
  choice: а того, кто первым выступил против нас
  rationale: Передаёт ἀρξάμενον как инициатора враждебного действия, не добавляя более конкретного существительного «нападение», отсутствующего в греческом тексте.
- source_word: παραδειγμάτισον
  choice: сделай примером для других
  rationale: Передаёт идею показательного публичного наказания или посрамления, не уточняя его способ сверх исходного текста.
theological_decisions:
- issue: Смысл τοῖς μὴ οὖσιν
  choice: тем, кого нет
  alternative: ничтожным; тем, кто — ничто
  rationale: Греческое выражение буквально означает «тем, кто не существует». Основной текст сохраняет его намеренную резкость и возможную полемику о мнимой значимости врагов, а примечание указывает более идиоматические варианты.
