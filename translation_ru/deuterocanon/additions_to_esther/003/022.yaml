lexical_decisions:
- source_word: μνήσθητι
  choice: Вспомни
  rationale: Аористный императив в молитвенном обращении передан традиционным и понятным библейским призывом. Отсутствующий в греческом тексте объект не добавлен.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма κύριος здесь является обращением к Богу; «Господи» — естественный русский эквивалент.
- source_word: γνώρισθητι
  choice: Яви Себя
  rationale: Форма пассивного императива в контексте молитвы выражает просьбу о том, чтобы Бог сделал Себя явным. «Яви Себя» естественно передаёт это значение, тогда как буквальное «стань известен» по-русски звучит неуместно.
- source_word: ἐν καιρῷ θλίψεως ἡμῶν
  choice: во время нашей скорби
  rationale: Сочетание сохраняет временное значение καιρός и передаёт θλῖψις как тяжёлое бедствие и страдание; «скорбь» уместно в возвышенной молитвенной речи.
- source_word: ἐμὲ θάρσυνον
  choice: придай мне мужества
  rationale: θαρσύνω означает ободрить, вселить смелость. «Придай мне мужества» непосредственно передаёт просьбу говорящей укрепить её решимость.
- source_word: Βασιλεῦ τῶν θεῶν
  choice: Царь богов
  rationale: Сохранена явная родительная конструкция греческого текста без смягчающего толкования «Царь над богами».
- source_word: πάσης ἀρχῆς ἐπικρατῶν
  choice: властвующий над всякой властью
  rationale: Причастие ἐπικρατῶν согласуется с обращением «Царь» и обозначает господство; ἀρχή сохраняет широкий смысл власти, начальства или правящей силы.
theological_decisions:
- issue: Божественный титул Βασιλεῦ τῶν θεῶν
  choice: Царь богов
  alternative: Царь над богами
  rationale: Буквальная конструкция сохранена, чтобы не устранять напряжение исходного текста. В контексте иудейской молитвы титул утверждает верховенство Господа, но перевод не уточняет самовольно, кого именно обозначают «боги».
- issue: Залог и смысл γνώρισθητι
  choice: Яви Себя
  alternative: Стань явным / стань известен
  rationale: Греческая пассивная форма допускает более буквальное прочтение, однако в молитвенном контексте естественно выражает просьбу о Божьем самоявлении. Альтернатива отмечена в сноске без догматического уточнения характера этого явления.
- issue: Синтаксическая связь ἐπικρατῶν
  choice: 'Причастие относится к «Царю»: «Царь богов, властвующий над всякой властью»'
  alternative: «Царь богов и властитель над всякой властью»
  rationale: Мужское причастие в звательной конструкции грамматически характеризует названного Царя. Причастный оборот точнее сохраняет структуру греческого текста, не превращая ἐπικρατῶν в дополнительное существительное-титул.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Краткие восклицательные предложения передают настойчивость просьбы. Сохранены обращения «Господи» и «Царь богов»; архаичные формы и конфессионально специфическая терминология не использованы.
