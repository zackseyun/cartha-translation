lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: за то, что
  rationale: Оборот вводит основание предшествующего суда или бедствия. «За то, что» естественно передаёт причинный смысл и сохраняет оттенок воздаяния, присущий ἀντί с относительным местоимением.
- source_word: ἐδοξάσαμεν
  choice: мы прославляли
  rationale: Глагол δοξάζω означает воздавать славу или почёт. «Прославляли» кратко и прямо передаёт признание почитания чужих богов; несовершенный вид уместно представляет это как прежнее поведение народа.
- source_word: τοὺς θεοὺς αὐτῶν
  choice: их богов
  rationale: Естественная русская передача множественного числа с притяжательным местоимением, сохраняющая противопоставление чужих богов Господу.
- source_word: δίκαιος
  choice: праведен
  rationale: «Праведен» сохраняет нравственно-богословскую широту δίκαιος в исповедальном обращении к Богу; возможный судебный оттенок «справедлив» отмечен в сноске.
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма «Господи» является естественной и традиционно понятной передачей обращения Κύριε к Богу.
theological_decisions:
- issue: Значение δίκαιος в обращении к Богу
  choice: Праведен Ты
  alternative: Справедлив Ты
  rationale: Контекст исповедует правоту Бога перед лицом греха народа. «Праведен» сохраняет широкий нравственный и богословский смысл, не устраняя судебного оттенка; «справедлив» дано как допустимая альтернатива.
- issue: Передача κύριος как божественного обращения
  choice: Господи
  alternative: Владыка
  rationale: В молитвенном контексте Κύριε служит обращением к Богу; «Господи» — точная и естественная русская форма без внесения дополнительного толкования.
translation_notes:
