    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ἱκανώθησαν
  choice: им оказалось мало
  rationale: 'Передаёт значение пассивной формы: прежнего угнетения им было недостаточно; по-русски звучит естественно и сохраняет обвинительный оттенок.'
- source_word: ἐν πικρασμῷ δουλείας ἡμῶν
  choice: горечи нашего рабства
  rationale: Сохраняет прямое значение πικρασμός — «горечь» — и сильное обозначение δουλεία как «рабство», не сводя выражение лишь к внутреннему переживанию.
- source_word: ἔθηκαν τὰς χεῖρας αὐτῶν
  choice: они подняли на нас руку
  rationale: Греческое выражение буквально говорит о возложении/протягивании рук, но эллиптично. Русская идиома естественно выражает враждебное посягательство; подразумеваемое «на нас» проясняется контекстом.
theological_decisions:
- issue: Передача δουλεία в контексте национального порабощения
  choice: рабство
  alternative: неволя; подневольное положение
  rationale: «Рабство» прямо сохраняет тяжесть обозначенного состояния и не смягчает плач о подчинении.
- issue: Неоднозначность образа ἔθηκαν τὰς χεῖρας αὐτῶν
  choice: подняли на нас руку
  alternative: протянули к нам руки; посягнули на нас
  rationale: Выбранный русский оборот передаёт вероятное враждебное действие, а примечание сохраняет буквальный образ и отмечает эллиптичность оригинала.
