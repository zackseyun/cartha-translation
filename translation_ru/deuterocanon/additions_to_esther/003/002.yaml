  text: And he said[a], “Lord, Lord, King over all powers, because everything is in your authority, and there is no one who can oppose you when you desire to save Israel.”
translation:
  language: ru
  text: 'И он сказал: «Господи, Господи, Царь над всеми силами, ибо всё в Твоей власти, и никто не может воспротивиться Тебе, когда Ты желаешь спасти Израиль».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε, κύριε
  choice: Господи, Господи
  rationale: Сохранены звательная форма божественного титула и его повтор, передающий настойчивость и благоговение молитвы.
- source_word: βασιλεῦ πάντων κρατῶν
  choice: Царь над всеми силами
  rationale: Кράτος может обозначать силу, могущество или власть. Формулировка сохраняет широкий смысл и не ограничивает его земными царствами.
- source_word: ἐν ἐξουσίᾳ σου τὸ πᾶν ἐστιν
  choice: всё в Твоей власти
  rationale: Естественная русская передача всеохватной власти; ἐξουσία здесь означает власть и полномочие, а не только способность.
- source_word: ὁ ἀντιδρῶσων σοι
  choice: никто не может воспротивиться Тебе
  rationale: Субстантивированное причастие выражает того, кто способен оказать действенное сопротивление; отрицательная конструкция естественно передана словом «никто».
- source_word: ἐν τῷ θέλειν σε
  choice: когда Ты желаешь
  rationale: Конструкция ἐν с артиклевым инфинитивом передана как временно-обстоятельственная, без устранения оттенка волеизъявления.
- source_word: σῶσαι τὸν Ἰσραήλ
  choice: спасти Израиль
  rationale: Прямая передача σῴζω, уместная в контексте молитвы об избавлении народа.
theological_decisions:
- issue: Повтор божественного обращения Κύριε, κύριε
  choice: Господи, Господи
  alternative: О Господи, Господи; Господи, Владыка
  rationale: Повтор сохранён буквально; притяжательное местоимение или дополнительный титул не добавлены.
- issue: Объём значения κρατῶν
  choice: над всеми силами
  alternative: всех властей; всех могуществ; всех владений
  rationale: Выбранная формулировка сохраняет всеобщность Божьего царствования и допускает как личные силы, так и абстрактные формы могущества, не сводя выражение к политическим царствам.
- issue: Связь Божьего желания и спасения Израиля
  choice: когда Ты желаешь спасти Израиль
  alternative: если Ты пожелаешь спасти Израиль
  rationale: Временная передача ближе к конструкции ἐν τῷ θέλειν и не превращает высказывание в условие.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным регистром. Прописные буквы в местоимениях при обращении к Богу поддерживают традиционную русскую библейскую стилистику; восклицательный знак естественно завершает развернутое обращение.
