  text: Do not overlook your portion[a], which I redeemed for myself out of the land of Egypt.
translation:
  language: ru
  text: Не оставь без внимания Свою долю[a], которую Ты искупил Себе из земли Египетской.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Свой удел, который Ты искупил как Своё достояние».'
    reason: Передаёт возможный заветный оттенок μερίς и более явно раскрывает значение возвратного дательного σεαυτῷ.
lexical_decisions:
- source_word: μὴ ὑπερίδῃς
  choice: Не оставь без внимания
  rationale: Передаёт запретительное значение и оттенок пренебрежения или невнимания, не усиливая его до «не презри».
- source_word: τὴν μερίδα σου
  choice: Свою долю
  rationale: «Доля» прямо передаёт μερίς и сохраняет возможный заветный смысл народа как принадлежащего Богу удела, не подменяя его более специальным словом «наследие».
- source_word: ἣν
  choice: которую
  rationale: Относительное местоимение естественно связывает придаточное предложение со словом женского рода «долю».
- source_word: σεαυτῷ
  choice: Себе
  rationale: Возвратное местоимение относится к адресату молитвы и подчёркивает, что Бог приобрёл эту долю для Себя; такая передача естественна по-русски.
- source_word: ἐλυτρώσω
  choice: Ты искупил
  rationale: 'Форма ἐλυτρώσω — второе лицо единственного числа аориста: «Ты искупил». Глагол сохраняет выкупной и спасительный оттенок λυτρόω.'
- source_word: ἐκ γῆς Αἰγύπτου
  choice: из земли Египетской
  rationale: Сохраняет полную библейскую формулу исхода и звучит достойно и понятно в современном литературном русском языке.
theological_decisions:
- issue: Заветный оттенок μερίς применительно к Израилю как Божьему достоянию
  choice: Свою долю
  alternative: Свой удел; Своё наследие
  rationale: Исходный текст говорит именно о «доле» и не называет народ прямо. Выбранная формулировка сохраняет метафору и не делает подразумеваемую богословскую связь явной сверх текста.
- issue: Смысл σεαυτῷ при ἐλυτρώσω
  choice: которую Ты искупил Себе
  alternative: которую Ты искупил как Своё достояние
  rationale: '«Себе» точно сохраняет возвратный дательный и оставляет открытым его оттенок: приобретение для Себя или в Своё владение. Более развёрнутое толкование вынесено в примечание.'
- issue: Лицо глагола ἐλυτρώσω
  choice: Ты искупил
  alternative: я искупил
  rationale: В молитве обращение направлено к Богу, а ἐλυτρώσω морфологически является формой второго лица единственного числа аориста медиального залога. Поэтому первое лицо, присутствующее в английском слое, не принимается.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Прописные формы местоимений при обращении к Богу соответствуют принятому русскому религиозному регистру; синтаксис остаётся ясным для широкого читателя.
