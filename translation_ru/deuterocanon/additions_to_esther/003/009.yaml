  source_fidelity: 'Перевод точно передаёт греческий текст: μὴ ὑπερίδῃς передано как «Не оставь без внимания» без неоправданного усиления; τὴν μερίδα σου — «Свою долю»; относительное придаточное сохранено. Форма ἐλυτρώσω здесь является аористом среднего залога, 2-го лица ед. числа, поэтому «которую Ты искупил Себе» верно отражает и лицо, и возвратный дательный σεαυτῷ. Это исправляет ошибочное первое лицо в английском audit trail. «Из земли Египетской» полно передаёт ἐκ γῆς Αἰγύπτου.'
  naturalness: Фраза грамматична, ясна и звучит естественно в современном литературном русском с уместной умеренно библейской торжественностью. «Не оставь без внимания» — хороший, неархаичный способ выразить запретительное «не упусти / не пренебреги». Формула «из земли Египетской» несколько традиционна, но понятна и стилистически оправданна в данном контексте.
  terminology: «Доля» сохраняет широту μερίς и не навязывает более узкие варианты вроде «наследия». «Искупил Себе» точно передаёт λυτρόω и σεαυτῷ, не превращая подразумеваемую принадлежность в развёрнутое догматическое утверждение. Примечание корректно отмечает более эксплицитный вариант и привязано к слову «долю».
