  text: And your servant did not eat at Haman’s table[a], and I did not honor the king’s banquet, nor did I drink the wine of libations[b];
translation:
  language: ru
  text: И Твоя рабыня[a] не ела за столом Амана, не почтила царский пир и не пила вина возлияний[b].
  philosophy: optimal-equivalence
  footnotes:
