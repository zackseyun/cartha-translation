lexical_decisions:
- source_word: ἡ δούλη σου
  choice: Твоя рабыня
  rationale: 'Женская форма δούλη прямо обозначает рабыню и выражает сильное самоуничижение Эсфири перед Богом. Формулировка также сохраняет переход от третьего лица к первому: «Твоя рабыня… я».'
- source_word: ἔφαγεν … τράπεζαν Ἁμάν
  choice: не ела за столом Амана
  rationale: Буквальное «не ела стол Амана» в русском невозможно; оборот «есть за чьим-либо столом» естественно передаёт конкретный образ и смысл греческой конструкции.
- source_word: ἐδόξασα
  choice: не чтила
  rationale: В отношении царского пира δοξάζω означает оказывать честь, высоко ценить, а не «прославлять» в узко религиозном смысле. «Не чтила» сохраняет силу и некоторую необычность исходного выражения.
- source_word: συμπόσιον βασιλέως
  choice: царский пир
  rationale: συμπόσιον обозначает пиршество, обычно связанное с вином. «Царский пир» звучит естественно, кратко и соответствует возвышенному контексту.
- source_word: οἶνον σπονδῶν
  choice: вина возлияний
  rationale: Родительный оборот сохранён; σπονδαί — ритуальные возлияния. Такая передача не сводит выражение к обычному вину и не уточняет сверх сказанного в греческом тексте, кому именно совершались возлияния.
theological_decisions:
- issue: Сила слова δούλη в самообозначении Эсфири
  choice: рабыня
  alternative: служанка
  rationale: «Рабыня» сохраняет выраженную в греческом зависимость и самоуничижение перед Богом; более мягкое «служанка» ослабило бы исходное слово.
- issue: Культовый оттенок οἶνον σπονδῶν
  choice: вино возлияний
  alternative: вино, предназначенное для возлияний
  rationale: Краткий родительный оборот сохраняет культовую связь вина с возлияниями, но не решает без достаточных оснований, было ли оно уже принесено или лишь предназначалось для обряда.
