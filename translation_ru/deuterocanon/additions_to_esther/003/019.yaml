lexical_decisions:
- source_word: ἐξᾶραι ὁρισμὸν στόματός σου
  choice: отменить определение, изречённое Твоими устами
  rationale: ἐξαίρω здесь передаёт устранение или упразднение, а ὁρισμός — установленное решение, определение. Развёрнутая формулировка естественно выражает смысл родительного στόματός σου и сохраняет образ Божьего властного слова.
- source_word: ἀφανίσαι κληρονομίαν σου
  choice: истребить Твоё наследие
  rationale: ἀφανίζω обозначает уничтожение, доведение до исчезновения; «истребить» соответствует тяжести угрозы. «Наследие» сохраняет библейское заветное значение κληρονομία, не уточняя его референт в основном тексте.
- source_word: ἐμφράξαι στόμα αἰνούντων σοι
  choice: заградить уста восхваляющих Тебя
  rationale: «Заградить уста» сохраняет конкретную греческую идиому и параллель с упоминанием Божьих уст; причастная конструкция передаёт настоящее αἰνούντων.
- source_word: σβέσαι δόξαν οἴκου σου
  choice: угасить славу Твоего дома
  rationale: σβέννυμι буквально означает гасить огонь или свет и здесь образно сочетается со «славой». «Дом» оставлен без уточнения «храм», как в греческом тексте.
- source_word: θυσιαστήριόν σου
  choice: Твой жертвенник
  rationale: «Жертвенник» — обычный точный эквивалент θυσιαστήριον в библейском контексте.
theological_decisions:
- issue: Референт выражения «Твоё наследие»
  choice: Сохранено «Твоё наследие» без пояснения в основном тексте
  alternative: Твой народ; Твоё достояние
  rationale: В контексте речь, вероятно, идёт о принадлежащем Богу народе, однако греческий текст не называет Израиль прямо. Буквенная заветная формулировка сохраняет смысловую открытость.
- issue: Значение «Твоего дома»
  choice: Сохранено буквальное «Твоего дома»
  alternative: Твоего храма
  rationale: Контекст указывает на храм, особенно благодаря следующему упоминанию жертвенника, но οἶκος буквально означает «дом». Перевод не подменяет исходную метафору толкованием.
- issue: Связь «определения» с Божьими устами
  choice: «определение, изречённое Твоими устами»
  alternative: определение Твоих уст; веление Твоих уст
  rationale: Так передаётся мысль о властном Божьем постановлении без догматического уточнения его содержания; одновременно избегается неестественная для современного русского языка конструкция «определение из Твоих уст».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Местоимения, относящиеся к Богу, написаны с прописной буквы. Ритмический ряд инфинитивов сохранён; союзы и синтаксис сглажены для естественного русского звучания. Все маркеры сносок размещены непосредственно после соответствующих выражений.
