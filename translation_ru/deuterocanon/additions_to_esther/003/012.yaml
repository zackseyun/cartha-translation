base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/012.yaml
  text: And taking off her garments of glory[a], she put on garments of distress and mourning; and instead of splendid perfumes, she filled her head with ashes and dung, and she humbled her body greatly[c][b], and every place of her joyful adornment she filled with the twisting of her hair.
translation:
  language: ru
  text: И, сняв с себя одежды своего великолепия, она облачилась в одежды скорби и плача; вместо роскошных благовоний она осыпала голову пеплом и навозом[a], сильно смирила своё тело и каждое место своего радостного убранства заполнила скрученными прядями своих волос[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполнила голову пеплом и навозом».'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительный греческий оборот труден. Буквально: «каждое место своего радостного убранства она наполнила скрученными волосами». Вероятно, речь идёт о волосах, оставленных неубранными или спутанными в знак скорби.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφελομένη τὰ ἱμάτια τῆς δόξης αὐτῆς
  choice: сняв с себя свои славные одежды
  rationale: Передаёт намеренное снятие пышного одеяния и сохраняет противопоставление одеждам скорби; «славные» здесь означает великолепные, соответствующие высокому положению.
- source_word: ἱμάτια στενοχωρίας καὶ πένθους
  choice: одежды скорби и плача
  rationale: στενοχωρία выражает бедствие и душевную тесноту, а πένθος — траурный плач; формула естественна по-русски и сохраняет оба аспекта.
- source_word: ἀντὶ τῶν ὑπερηφάνων ἡδυσμάτων
  choice: вместо роскошных благовоний
  rationale: Буквально ὑπερήφανος значит «гордый», однако применительно к благовониям указывает на их пышность и дороговизну; «роскошных» естественно передаёт контекстуальный смысл.
- source_word: σποδοῦ καὶ κοπριῶν ἔπλησεν τὴν κεφαλήν
  choice: осыпала голову пеплом и навозом
  rationale: Буквальное «наполнила голову» неестественно и способно создать ложный анатомический смысл; «осыпала» ясно выражает внешний жест уничижения, сохраняя резкое слово «навоз».
- source_word: τὸ σῶμα ἐταπείνωσεν σφόδρα
  choice: глубоко смирила своё тело
  rationale: Сохраняет телесный объект и значение сильного самоуничижения, не уточняя не названный прямо обряд.
- source_word: πάντα τόπον κόσμου ἀγαλλιάματος αὐτῆς
  choice: всё, что прежде украшала для радости
  rationale: κόσμος означает украшение, а ἀγαλλίαμα — радость или ликование. Русская формулировка передаёт части её облика, прежде служившие праздничному украшению, без буквальной неясности «место украшения».
- source_word: στρεπτῶν τριχῶν αὐτῆς
  choice: своими спутанными волосами
  rationale: στρεπτός связан со скручиванием; в траурном контексте вероятен образ неубранных, спутанных волос. Неясность оборота отмечена в сноске.
theological_decisions:
- issue: Телесная резкость траурного самоуничижения Есфири
  choice: Сохранить конкретные образы пепла, навоза и смирения тела.
  alternative: Смягчить до «пепла и нечистот» и общего описания скорби.
  rationale: Греческий текст намеренно подчёркивает крайнее телесное уничижение; смягчение ослабило бы смысл.
- issue: Неясный заключительный оборот о волосах
  choice: Передать вероятный траурный образ спутанных волос и отметить неясность в сноске.
  alternative: Буквально перевести как «наполнила скручиванием своих волос».
  rationale: Синтаксис и точный образ трудны, поэтому основной текст должен быть понятным, но сноска сохраняет подлинную неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Сохранены резкость траурных образов и двусмысленность заключительной фразы; громоздкие буквальные кальки вынесены в сноски.
