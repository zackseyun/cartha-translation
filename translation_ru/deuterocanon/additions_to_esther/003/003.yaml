  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, чему дивятся под небом»; греческое причастие может обозначать то, что вызывает удивление или считается дивным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: В контексте молитвы союз вводит основание предшествующего утверждения; причинное «потому что» естественно передаёт эту связь.
- source_word: ἐποίησας
  choice: Ты сотворил
  rationale: Хотя ποιέω буквально имеет широкое значение «делать, создавать», при дополнениях «небо и земля» русское «сотворил» точно и естественно выражает создание мира.
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: небо и землю
  rationale: Устоявшаяся русская формула сохраняет греческую пару, обозначающую весь сотворённый мир.
- source_word: πᾶν θαυμαζόμενον
  choice: всё дивное
  rationale: Субстантивированное причастие обозначает всё вызывающее изумление или достойное удивления. «Всё дивное» кратко, естественно и сохраняет оттенок чуда и восхищения.
- source_word: ἐν τῇ ὑπʼ οὐρανόν
  choice: под небом
  rationale: Краткий русский оборот передаёт область мира, находящуюся под небом, не перегружая фразу подразумеваемым существительным.
theological_decisions:
- issue: Объём утверждения о творении
  choice: Фраза говорит, что Бог сотворил небо, землю и всё дивное в поднебесном мире.
  alternative: Передать ἐποίησας нейтральнее как «создал» или истолковать πᾶν θαυμαζόμενον как совокупность всех творений.
  rationale: Перевод сохраняет все названные в греческом тексте составляющие и широкий космический охват, но не превращает обычный глагол и описательное причастие в специальную догматическую формулу.
translation_notes:
  register: Современный литературный русский с молитвенно-библейской торжественностью. Заглавное «Ты» уместно как уважительное обращение к Богу; синтаксис остаётся ясным и не архаичным.
