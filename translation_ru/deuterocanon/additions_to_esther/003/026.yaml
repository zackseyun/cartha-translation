base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/026.yaml
  text: You know my distress[a], that I loathe the sign of my pride, which is upon my head in the days of my appearance; I loathe it like a menstrual cloth[e][d][c][b], and I do not wear it in the days of my rest.
translation:
  language: ru
  text: 'Ты знаешь мою нужду[a]: мне отвратителен знак моей гордости[b], который бывает у меня на голове в дни моего появления[c]. Он отвратителен мне, как тряпка при месячных[d], и в дни моего покоя[e] я его не ношу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моё бедственное положение», «мою необходимость»; греческое слово может также передавать вынужденность и стеснённые обстоятельства.'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, речь идёт о царском украшении или знаке высокого положения на голове Есфири, но греческий текст не называет конкретный предмет.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «в дни моего появления» — вероятно, во время публичных появлений или при дворе.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «как тряпка при месячных». Это намеренно резкое выражение сильного отвращения.'
    reason: lexical_alternative
  - marker: e
    text: 'Или: «тишины», «уединения»; выражение противопоставлено дням публичного появления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγκην
  choice: нужду
  rationale: Слово может означать необходимость, нужду, бедственное положение или вынужденность. В молитве Есфири «нужда» естественно передаёт её тяжёлое, стеснённое положение, не сводя смысл только к эмоциональному страданию.
- source_word: βδελύσσομαι
  choice: мне отвратителен
  rationale: Глагол выражает сильное отвращение; эта формулировка звучит естественно и сохраняет силу обоих употреблений.
- source_word: σημεῖον τῆς ὑπερηφανίας μου
  choice: знак моей гордости
  rationale: Буквально сохранены общий термин «знак» и отрицательно окрашенная «гордость»; предмет не конкретизирован как корона или диадема.
- source_word: ἐν ἡμέραις ὀπτασίας μου
  choice: в дни, когда появляюсь перед людьми
  rationale: В данном контексте ὀπτασία обозначает случаи, когда Есфирь показывается другим, вероятно публично или при дворе. Добавление «перед людьми» ясно выражает контекстуальный смысл без чрезмерной конкретизации.
- source_word: ῥάκος καταμηνίων
  choice: тряпка с менструальной кровью
  rationale: Конкретная и намеренно резкая метафора сохранена без эвфемизма; «тряпка» передаёт ῥάκος, а определение раскрывает значение καταμηνίων естественным современным русским языком.
- source_word: φορῶ
  choice: ношу
  rationale: Обычный русский эквивалент применительно к предмету или знаку, находящемуся на голове.
- source_word: ἡσυχίας
  choice: покоя
  rationale: Слово допускает значения тишины, покоя, уединения и отсутствия публичной деятельности. «Покой» сохраняет широту значения и контраст с днями появления перед людьми.
theological_decisions:
- issue: Что представляет собой отвергаемый Есфирью предмет
  choice: Оставить общее выражение «знак моей гордости», пояснив лишь, что его носят на голове.
  alternative: Корона, диадема или царский головной убор.
  rationale: Греческий текст не называет предмет, поэтому перевод не должен догматически отождествлять его с конкретной царской регалией.
- issue: Степень прямоты сравнения с менструальной нечистотой
  choice: Сохранить прямое упоминание менструальной крови в основном тексте.
  alternative: Смягчить до «нечистой» или «грязной тряпки».
  rationale: Источник использует явное и резкое выражение; его смягчение устранило бы существенную силу самоописания Есфири.
translation_notes:
  register: 'Современный литературный русский язык с молитвенной серьёзностью, но без архаизмов. Синтаксис слегка перестроен ради ясности: относительное придаточное «который… на голове» передано естественной конструкцией «который я ношу на голове». Яркая телесная метафора сохранена. Все примечания отмечены в основном тексте.'
