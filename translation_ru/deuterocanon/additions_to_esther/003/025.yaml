base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/025.yaml
  text: And you know that I hated the glory of the lawless[a], and I abhor the bed of the uncircumcised and of every foreigner.
translation:
  language: ru
  text: И Ты знаешь, что я возненавидела славу беззаконных и гнушаюсь ложем необрезанных и всякого чужеземца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «брачным ложем» либо «половой связью»; греческое слово «ложе» может обозначать брачные или половые отношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμίσησα
  choice: я возненавидела
  rationale: Аорист передаёт совершённое или суммарно рассматриваемое отношение в контексте молитвы; форма женского рода обусловлена речью Эсфири. «Возненавидела» сохраняет сильное значение глагола.
- source_word: δόξαν
  choice: славу
  rationale: «Слава» сохраняет возвышенный регистр и передаёт значение блеска, почёта или высокого положения, не сужая его до одной лишь репутации.
- source_word: ἀνόμων
  choice: беззаконных
  rationale: Передаёт прямую связь слова с понятием закона и не заменяет его более общим «нечестивых» или «злых».
- source_word: βδελύσσομαι
  choice: гнушаюсь
  rationale: Выражает сильное отвращение и естественно звучит в торжественном контексте молитвы.
- source_word: κοίτην
  choice: ложем
  rationale: 'Сохраняет образ греческого текста и присущую ему неоднозначность: речь может идти о брачном ложе или половой связи.'
- source_word: ἀπεριτμήτων
  choice: необрезанных
  rationale: Буквально передаёт субстантивированное прилагательное во множественном числе, не добавляя отсутствующего в греческом существительного.
- source_word: παντὸς ἀλλοτρίου
  choice: всякого чужеземца
  rationale: В сочетании с «необрезанных» выражение естественнее всего относится к чужому по народу человеку; «чужеземец» сохраняет личное значение и достойный регистр.
theological_decisions:
- issue: Следует ли явно передавать κοίτην как половую связь или брачное ложе
  choice: ложем
  alternative: брачным ложем; половой связью
  rationale: Буквальный образ понятен по-русски и сохраняет намеренную недосказанность источника, не навязывая более узкого толкования.
- issue: Следует ли переводить ἀνόμων обобщённо как «нечестивых»
  choice: беззаконных
  alternative: нечестивых
  rationale: «Беззаконных» точнее сохраняет лексическую связь с законом и не превращает конкретную характеристику в общую нравственную оценку.
- issue: К кому относится выражение παντὸς ἀλλοτρίου
  choice: к каждому чужеземцу как человеку
  alternative: ко всему чужому
  rationale: Параллель с «необрезанными» и зависимость от «ложа» поддерживают личное значение, хотя само прилагательное может иметь более широкую семантику.
translation_notes:
  register: Современный литературный русский с торжественным молитвенным звучанием. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Сильная эмоциональная лексика оригинала сохранена без смягчения.
