  yaml_path: translation/deuterocanon/additions_to_esther/003/008.yaml
  text: And now[a], Lord God, King, God of Abraham, spare your people[b], because they are watching us for destruction and have desired to destroy your inheritance from the beginning.
translation:
  language: ru
  text: И ныне, Господи Боже, Царь, Бог Авраама, пощади народ Твой, ибо они смотрят на нас, стремясь к нашей гибели,[a] и возжелали погубить Твоё наследие, издревле принадлежащее Тебе.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «они смотрят на нас для погибели»; смысл сжатого греческого оборота — их взгляд и намерение направлены на нашу гибель.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Твоё наследие от начала»; греческое выражение может также означать «Твоё древнее наследие».'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ νῦν
  choice: И ныне
  rationale: Сохраняет переход к непосредственной мольбе и возвышенный молитвенный регистр без архаической грамматики.
- source_word: Κύριε ὁ θεὸς ὁ βασιλεὺς ὁ θεὸς Ἀβραάμ
  choice: Господи Боже, Царь, Бог Авраама
  rationale: Передаёт цепочку обращений и приложений в греческом тексте, не сводя их к одному составному титулу.
- source_word: φεῖσαι τοῦ λαοῦ σου
  choice: пощади народ Твой
  rationale: Глагол φείδομαι здесь выражает просьбу не подвергать народ гибели; «пощади» точно и естественно передаёт повелительную форму.
- source_word: ἐπιβλέπουσιν ἡμῖν εἰς καταφθοράν
  choice: они устремили на нас взор, чтобы погубить нас
  rationale: Передаёт сжатый греческий оборот как направленное на молящихся враждебное намерение; целевая конструкция отражает εἰς καταφθοράν.
- source_word: ἐπεθύμησαν ἀπολέσαι
  choice: возжелали уничтожить
  rationale: «Возжелали» сохраняет значение сильного желания или намерения, а «уничтожить» соответствует контексту корпоративной гибели.
- source_word: τὴν ἐξ ἀρχῆς κληρονομίαν σου
  choice: Твоё наследие, издревле принадлежащее Тебе
  rationale: Сохраняет метафору κληρονομία и естественно передаёт ἐξ ἀρχῆς как давнюю принадлежность, не утверждая однозначно абсолютное начало времени.
theological_decisions:
- issue: К чему относится «Твоё наследие»
  choice: Метафора сохранена без прямой замены словом «народ»
  alternative: Явно истолковать как народ Израиля либо как землю и заветное достояние
  rationale: Параллель с «народом Твоим» указывает прежде всего на заветный народ, однако греческое κληρονομία допускает более широкие ассоциации с наследственным достоянием; перевод не устраняет эту образность.
- issue: Значение ἐξ ἀρχῆς
  choice: издревле принадлежащее Тебе
  alternative: от начала / с самого начала
  rationale: В контексте молитвы выражение может обозначать древнюю, изначально установленную принадлежность, а не обязательно абсолютное начало; сноска сохраняет более буквальный вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Формы «Господи», «пощади», «возжелали», «издревле» поддерживают возвышенный библейский регистр, оставаясь понятными современному читателю. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской религиозно-издательской практике.
