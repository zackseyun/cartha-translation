  source_fidelity: 'Смысл греческого текста в целом передан точно: молитвенное обращение, Божья власть «над всеми», просьба услышать отчаявшихся, двукратное прошение об избавлении и образ «руки» сохранены. «От моего страха» корректно удерживает основное, неразрешённое значение ἐκ τοῦ φόβου μου; примечание уместно фиксирует возможное понимание как опасности, которой боится молящаяся.'
