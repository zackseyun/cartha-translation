base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/029.yaml
  text: O God[a], who are mighty over all, hear the voice of those who have lost hope, and rescue us from the hand of those who do evil, and rescue me from my fear.
translation:
  language: ru
  text: Боже, Ты силён над всеми, услышь голос тех, кто потерял надежду, избавь нас от руки тех, кто творит зло, и избавь меня от моего страха.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавь меня от того, чего я боюсь». Греческое выражение может обозначать как страх Есфири, так и опасность, которой она страшится.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς
  choice: Боже
  rationale: Именительный с артиклем выполняет функцию обращения; русский звательный по функции оборот естественно передаётся формой «Боже».
- source_word: ὁ ἰσχύων ἐπὶ πάντας
  choice: сильный над всеми
  rationale: Причастный оборот выражает Божью силу и превосходство над всеми; формулировка сохраняет широкий объём πάντας.
- source_word: εἰσάκουσον φωνὴν ἀπηλπισμένων
  choice: услышь голос потерявших надежду
  rationale: ἐισάκουσον — молитвенная просьба услышать и внять; перфектное причастие ἀπηλπισμένων передаёт состояние людей, лишившихся надежды.
- source_word: ῥῦσαι ἡμᾶς
  choice: избавь нас
  rationale: ῥύομαι обозначает избавление от грозящей опасности; «избавь» естественно для современной русской молитвенной речи.
- source_word: ἐκ χειρὸς τῶν πονηρευομένων
  choice: от руки творящих зло
  rationale: Сохранена прозрачная библейская метафора «руки» как власти, а причастие передано без сужения зла до одного лишь заговора.
- source_word: ῥῦσαί με ἐκ τοῦ φόβου μου
  choice: избавь меня от моего страха
  rationale: Повтор глагола сохранён ради параллелизма; наиболее прямое значение φόβος — «страх», при этом возможное указание на предмет страха вынесено в примечание.
theological_decisions:
- issue: Означает ли ἐκ τοῦ φόβου μου избавление от внутреннего страха или от внешней опасности, вызывающей страх
  choice: от моего страха
  alternative: от того, чего я боюсь
  rationale: Греческое выражение допускает оба понимания. Основной текст сохраняет буквальное эмоциональное значение, а примечание отмечает возможную метонимию, не устраняя напряжения.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным звучанием. Сохранены обращение, образ «руки» и повтор «избавь».
