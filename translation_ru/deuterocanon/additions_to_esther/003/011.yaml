    reason: lexical_alternative
lexical_decisions:
- source_word: κατέφυγεν
  choice: прибегла к
  rationale: Глагол означает бежать к кому-либо в поисках убежища или защиты. Русское «прибегла к Господу» естественно передаёт обращение к Нему как к прибежищу, сохраняя направленность греческого выражения.
- source_word: κύριον
  choice: Господу
  rationale: В данном молитвенном контексте κύριος относится к Богу. «Господь» точно соответствует греческому титулу и не подменяет его передачей явного божественного имени.
- source_word: ἐν ἀγῶνι θανάτου
  choice: смертной борьбой
  rationale: Выражение соединяет образ напряжённой борьбы с близостью смерти. «Смертная борьба» сохраняет его краткость и напряжённость, не сводя смысл исключительно к душевной муке.
- source_word: κατειλημμένη
  choice: охваченная
  rationale: Страдательное причастие описывает состояние, которое настигло и властно объяло Есфирь. «Охваченная» звучит естественно по-русски и сохраняет интенсивность образа.
theological_decisions:
- issue: Передача обращения Есфири к Богу через κύριον
  choice: к Господу
  alternative: к ГОСПОДУ
  rationale: Греческий текст содержит κύριον, а не явное воспроизведение божественного имени. Поэтому выбран титул «Господь» без типографического обозначения тетраграмматона.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного повествования. Сохранена вводная связь «И» и завершающая запятая, поскольку стих синтаксически продолжается далее; краткая формула «смертная борьба» сохраняет напряжение и некоторую смысловую открытость греческого текста.
