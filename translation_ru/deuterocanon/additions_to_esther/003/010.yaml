base_translation:
  language: en
  yaml_path: translation/deuterocanon/additions_to_esther/003/010.yaml
  text: Hear my petition and be merciful to your allotted people[a], and turn our mourning into gladness, so that, living, we may sing praise to your name, O Lord, and do not destroy the mouth of those who praise you. And all Israel cried out with all their strength[b], because their death was before their eyes.
translation:
  language: ru
  text: Услышь моё моление и помилуй Твой народ, Твой удел[a]. Обрати нашу скорбь в ликование, чтобы мы, оставшись в живых, воспевали Твоё имя, Господи; не погуби уста восхваляющих Тебя[b]. И весь Израиль воззвал изо всех сил, потому что смерть была у них перед глазами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будь милостив к Твоему уделу». Здесь «удел» означает принадлежащий Богу народ.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не погуби уста восхваляющих Тебя» — то есть не уничтожь тех, кто возносит Тебе хвалу.'
    reason: lexical_explanation
lexical_decisions:
- source_word: κουσον τῆς δεήσεώς μου
  choice: Услышь моё моление
  rationale: Начальная форма в предоставленном тексте, вероятно, утратила ἄ при нормализации; сочетание ἀκούω с родительным падежом в молитвенной речи естественно передаётся как «услышь». «Моление» сохраняет оттенок настоятельной просьбы δέησις и достойный современный регистр.
- source_word: ἱλάσθητι τῷ κλήρῳ σου
  choice: помилуй народ, доставшийся Тебе в удел
  rationale: «Помилуй» доступно передаёт просьбу о милости без внесения специальной терминологии искупления. κλῆρος буквально означает жребий или удел, но здесь обозначает Израиль как принадлежащий Богу народ; формулировка сохраняет образ удела и проясняет референт.
- source_word: στρέψον τὸ πένθος ἡμῶν εἰς εὐφροσύνην
  choice: Обрати наш плач в ликование
  rationale: Передаёт резкую смену скорби радостью; «плач» уместен для πένθος в контексте общей угрозы, а «ликование» отражает активную радость εὐφροσύνη.
- source_word: ἵνα ζῶντες ὑμνῶμεν σου τὸ ὄνομα
  choice: чтобы мы, оставшись в живых, воспевали Твоё имя
  rationale: Причастие ζῶντες связывает возможность хвалы с избавлением от смерти. «Воспевали» сохраняет песенный оттенок ὑμνέω.
- source_word: μὴ ἀφανίσῃς στόμα αἰνούντων σου
  choice: не погуби уста восхваляющих Тебя
  rationale: 'Сохранён конкретный и напряжённый греческий образ: уничтожение народа погасило бы его хвалу. Буквальное «уста» предпочтено толкующему «не заставь умолкнуть».'
- source_word: ἐκέκραξαν ἐξ ἰσχύος αὐτῶν
  choice: воззвал изо всех сил
  rationale: Идиоматическая русская передача напряжённого, громкого обращения; единственное число согласуется с собирательным «весь Израиль».
- source_word: θάνατος αὐτῶν ἐν ὀφθαλμοῖς αὐτῶν
  choice: видел перед собой собственную смерть
  rationale: Естественная русская передача буквального образа «их смерть была перед их глазами», сохраняющая непосредственность смертельной угрозы и принадлежность смерти самому Израилю.
theological_decisions:
- issue: Передача κύριε
  choice: Господи
  alternative: о Господь
  rationale: Звательная форма «Господи» естественна для русской молитвенной речи и точно соответствует обращению κύριε; написание не предполагает реконструкции еврейского тетраграмматона.
- issue: Референт τῷ κλήρῳ σου
  choice: народ, доставшийся Тебе в удел
  alternative: Твой удел
  rationale: Греческая метафора допускает буквальное «Твой удел», однако в контексте моления речь идёт об Израиле. Включение слова «народ» делает смысл доступным, сохраняя образ удела и не уточняя механизм избрания сверх текста.
- issue: Образ уничтоженных уст
  choice: не погуби уста восхваляющих Тебя
  alternative: не заставь умолкнуть восхваляющих Тебя
  rationale: Сохранён суровый буквальный образ, связывающий физическое уничтожение молящихся с прекращением хвалы; более гладкая альтернатива уже истолковывает метафору.
translation_notes:
  register: Современный литературный русский с достойным молитвенным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции. Синтаксис сделан естественным, но ключевые образы удела, живых хвалителей и уст сохранены.
