  text: And she was pleading with the Lord[a], the God of Israel, and said, “My Lord, our king, you alone are the only one; help me, who am alone and have no helper except you,”
translation:
  language: ru
  text: 'И она обращалась с мольбой к Господу, Богу Израиля, и сказала: «Господь мой, Царь наш, Ты один[a]. Помоги мне, одинокой, у которой нет иного помощника, кроме Тебя».'
  philosophy: optimal-equivalence
  footnotes:
