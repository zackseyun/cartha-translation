    text: 'Греч. букв. «Ты один есть»; дальнейшее сказуемое не выражено. Возможен также более разъяснительный перевод: «Ты — единственный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεῖτο
  choice: молила
  rationale: Передаёт настойчивую мольбу; форма прошедшего времени в контексте сохраняет длительный характер имперфекта без тяжеловесной конструкции.
- source_word: Κυρίου θεοῦ Ἰσραήλ
  choice: Господа, Бога Израиля
  rationale: Сохраняет оба божественных наименования и их приложительное отношение.
- source_word: Κύριέ μου
  choice: Господь мой
  rationale: Явно передаёт притяжательное μου и торжественное прямое обращение.
- source_word: ὁ βασιλεὺς ἡμῶν
  choice: Царь наш
  rationale: Сохраняет обращённый к Богу царский титул и его противопоставление земной царской власти в повествовании.
- source_word: σὺ εἶ μόνος
  choice: Ты один
  rationale: Естественно передаёт эмфатическое σὺ и μόνος, не добавляя отсутствующего в греческом тексте именного сказуемого; эллиптичность отмечена сноской.
- source_word: βοήθησόν μοι
  choice: Помоги мне
  rationale: Кратко и непосредственно передаёт повелительную форму настоятельной просьбы.
- source_word: τῇ μόνῃ
  choice: мне, одинокой
  rationale: Сохраняет женский род и личное описание положения Эсфири.
- source_word: μὴ ἔχουσῃ βοηθὸν εἰ μὴ σέ
  choice: у которой нет иного помощника, кроме Тебя
  rationale: Сохраняет личное существительное «помощник» и абсолютное исключение всех, кроме Бога; «иного» естественно выражает смысл конструкции εἰ μή.
theological_decisions:
- issue: Божественный царский титул
  choice: «Царь наш» сохранено как прямое обращение к Богу.
  alternative: «Правитель наш»
  rationale: Греческое βασιλεύς прямо означает царя; смягчение ослабило бы мотив Божьего верховенства.
- issue: Эллиптическое исповедание σὺ εἶ μόνος
  choice: «Ты один» с пояснительной сноской.
  alternative: «Ты — единственный» / «Ты один есть»
  rationale: Основной текст остаётся естественным по-русски и не восполняет невыраженное сказуемое, а сноска сохраняет реальную синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский с молитвенно-торжественным, но понятным строем. Заглавные буквы в обращениях и местоимении «Тебя» поддерживают традиционный русский библейский регистр. Пунктуация делит длинную греческую фразу на естественные русские молитвенные реплики.
