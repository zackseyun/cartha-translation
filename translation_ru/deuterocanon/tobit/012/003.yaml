base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/003.yaml
  text: because he brought me back to you healthy, and he healed my wife and brought back my money, and he likewise healed you.
translation:
  language: ru
  text: ведь он привёл меня к тебе здоровым, исцелил мою жену, принёс мои деньги и тебя также исцелил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑγιῆ
  choice: невредимым
  rationale: В контексте возвращения передаёт состояние целости и благополучия; естественнее по-русски, чем буквальное «здоровым» после глагола «привёл».
- source_word: ἐθεράπευσεν
  choice: исцелил
  rationale: Точно передаёт совершившееся исцеление и сохраняет повтор одного греческого глагола применительно к жене и отцу.
- source_word: τὸ ἀργύριόν μου
  choice: мои деньги
  rationale: ἀργύριον здесь обозначает денежные средства, а не материал «серебро».
- source_word: ἤνεγκεν
  choice: принёс
  rationale: Передаёт простой аорист от φέρω без добавления отсутствующего в греческом значения «вернул».
- source_word: ὁμοίως
  choice: так же
  rationale: Сохраняет явное сопоставление двух исцелений.
