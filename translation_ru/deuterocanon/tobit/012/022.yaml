translation:
  language: ru
  text: И они прославляли Его великие и дивные дела[a], рассказывая, как им явился ангел Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий глагол может также означать: «открыто признавали», «воздавали благодарность за» или «воздавали хвалу за».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολογοῦντο
  choice: прославляли
  rationale: Глагол может означать открытое признание, исповедание, благодарение или хвалу. При прямом дополнении «Его великие и дивные дела» русское «прославляли» естественно передаёт публичное признание Божьих деяний, не сводя смысл к признанию вины.
- source_word: τὰ ἔργα τὰ μεγάλα καὶ θαυμαστὰ αὐτοῦ
  choice: Его великие и дивные дела
  rationale: «Дела» естественно передаёт ἔργα, а «дивные» сохраняет возвышенный, но понятный современному читателю оттенок θαυμαστά как деяний, вызывающих изумление.
- source_word: ὡς
  choice: потому что
  rationale: 'В данном повествовательном контексте союз можно понять как указывающий на основание прославления: им явился ангел Господа. Возможное содержательное значение «как» сохранено в примечании.'
- source_word: ὤφθη
  choice: явился
  rationale: Пассивная по форме глагольная форма в языке явлений обычно имеет значение «явился»; это естественнее буквального «был увиден».
- source_word: ἄγγελος Κυρίου
  choice: ангел Господа
  rationale: Греческое ἄγγελος употреблено без артикля. Русский язык не выражает здесь определённость артиклем, поэтому нейтральное «ангел Господа» не навязывает отождествления с каким-либо единственным особым ангелом.
theological_decisions:
- issue: Определённость выражения ἄγγελος Κυρίου
  choice: ангел Господа
  alternative: Ангел Господень / тот ангел Господа
  rationale: В греческом тексте перед ἄγγελος нет артикля. Нейтральная русская формулировка сохраняет это и не вводит более конкретное богословское отождествление, которого данная форма сама по себе не требует.
- issue: Связь явления ангела с прославлением Божьих дел
  choice: потому что им явился
  alternative: рассказывая, как им явился
  rationale: ὡς допускает причинное и содержательное понимание. Основной текст выбирает естественную для контекста причинную связь, а альтернативу отмечает, чтобы не скрывать подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Дивные» сохраняет торжественный оттенок, оставаясь понятным; форма «исповедовали дела» отвергнута как неестественная и способная вызвать неверную ассоциацию с исповеданием грехов.
