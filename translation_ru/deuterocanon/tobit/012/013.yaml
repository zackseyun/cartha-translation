base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/013.yaml
  text: And when you did not hesitate to rise and leave your meal so that you might go and wrap the dead man[a], your doing good did not escape me[b], but I was with you.
translation:
  language: ru
  text: И когда ты без колебаний встал и оставил свою трапезу[a], чтобы пойти и обернуть умершего[b], от меня не укрылось, что ты делаешь добро, но я был с тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может обозначать дневной или главный приём пищи; точное время здесь не указано.
    reason: cultural_note
  - marker: b
    text: 'Или: «приготовить умершего к погребению». Греческий глагол может означать обернуть тело или иным образом привести его в порядок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ὤκνησας
  choice: без колебаний
  rationale: Передаёт отсутствие нерешительности или промедления естественным современным русским выражением и сохраняет похвалу готовности Товита действовать.
- source_word: ἀναστῆναι
  choice: встал
  rationale: В контексте речь идёт о том, что Товит поднялся из-за трапезы; «встал» ясно и естественно передаёт действие.
- source_word: καταλιπεῖν τὸ ἄριστόν σου
  choice: оставил свою трапезу
  rationale: ἄριστον обозначает приём пищи, нередко главный или дневной, однако точное время здесь не указано. «Трапеза» сохраняет конкретный образ без неоправданного уточнения.
- source_word: ὅπως ἀπελθὼν
  choice: чтобы пойти
  rationale: Целевая конструкция естественно передаётся русским придаточным с «чтобы»; причастие ἀπελθών выражено глаголом движения.
- source_word: περιστείλῃς τὸν νεκρόν
  choice: обернуть умершего
  rationale: περιστέλλω может означать оборачивать, покрывать или приводить тело в порядок. Выбор близок к греческому и не подменяет подготовительное действие всем обрядом погребения.
- source_word: οὐκ ἔλαθές με ἀγαθοποιῶν
  choice: от меня не укрылось, что ты делаешь добро
  rationale: Сохраняет идиому λανθάνω со значением «остаться незамеченным» и глагольную силу причастия ἀγαθοποιῶν, не сводя его заранее к отвлечённой добродетели.
- source_word: σὺν σοὶ ἤμην
  choice: я был с тобой
  rationale: Прямо и без богословского расширения передаёт утверждение Рафаила о его присутствии.
theological_decisions:
- issue: Характер присутствия и осведомлённости Рафаила
  choice: Рафаил говорит, что доброе действие Товита не осталось для него незамеченным и что он был с Товитом.
  alternative: Можно было бы истолковать слова как указание на более широкое ангельское хранительство, посредничество или особую всеведущую осведомлённость.
  rationale: Греческий текст утверждает лишь присутствие Рафаила в данной ситуации и его знание о поступке Товита; перевод не добавляет более широкого учения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохранён близким к греческому, но сделан естественным для обычного читателя; неоднозначность названия трапезы и действия над телом вынесена в примечания.
