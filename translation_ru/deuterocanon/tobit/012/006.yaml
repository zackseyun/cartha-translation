base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/006.yaml
  text: And calling the two of them privately[a], he said to them, “Bless God and give thanks to him; give him greatness, and give thanks to him before all the living for what he has done with you. It is good to bless God and to exalt his name, showing forth with honor the words of the works of God[c][b]; and do not be reluctant
translation:
  language: ru
  text: 'И, отозвав обоих в сторону, он сказал им: «Благословляйте Бога и благодарите Его; воздавайте Ему величие и благодарите Его перед всеми живущими за то, что Он сделал с вами[a]. Благо благословлять Бога и превозносить Его имя, с честью возвещая о делах Божьих; и не…[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение буквально означает «что Он сделал с вами»; его можно также понять как «что Он сделал для вас».
    reason: lexical_alternative
  - marker: b
    text: Предоставленный греческий текст в этом месте обрывается на словах «и не…»; продолжение запрета находится в следующем стихе.
    reason: textual_variant
lexical_decisions:
- source_word: καλέσας τοὺς δύο κρυπτῶς
  choice: отозвав обоих в сторону
  rationale: Передаёт призыв двух собеседников к отдельному, непубличному разговору; естественнее по-русски, чем буквальное «позвав обоих тайно».
- source_word: Εὐλογεῖτε τὸν θεόν
  choice: Благословляйте Бога
  rationale: Сохраняет обращённую к Богу библейскую формулу и форму продолжительного повеления.
- source_word: ἐξομολογεῖσθε
  choice: благодарите
  rationale: В контексте публичного признания Божьих деяний глагол выражает благодарное прославление, а не исповедание грехов.
- source_word: μεγαλωσύνην δίδοτε αὐτῷ
  choice: воздавайте Ему величие
  rationale: Сохраняет существительное «величие», но выражает греческую конструкцию естественной русской формулой приписывания Богу величия.
- source_word: ἐνώπιον πάντων τῶν ζώντων
  choice: перед всеми живущими
  rationale: Близко передаёт универсальный и публичный охват исходного выражения.
- source_word: περὶ ὧν ἐποίησεν μεθʼ ὑμῶν
  choice: за то, что Он сделал с вами
  rationale: Сохраняет необычное μετά «с вами» и не устраняет возможный смысл «для вас», указанный в сноске.
- source_word: ἀγαθὸν τὸ εὐλογεῖν τὸν θεόν
  choice: Благо благословлять Бога
  rationale: Достоинная и ясная формулировка общего нравственного суждения.
- source_word: ὑψοῦν τὸ ὄνομα αὐτοῦ
  choice: превозносить Его имя
  rationale: Естественно передаёт библейский образ возвышения Божьего имени.
- source_word: τοὺς λόγους τῶν ἔργων τοῦ θεοῦ ἐντίμως ὑποδεικνύντες
  choice: с честью возвещая о делах Божьих
  rationale: Передаёт публичное объявление и почтительный образ действия, избегая неестественного буквального сочетания «слова дел».
- source_word: καὶ μὴ
  choice: и не…
  rationale: Многоточие открыто обозначает незавершённость предоставленного греческого свидетельства.
theological_decisions:
- issue: Обращённое к Богу εὐλογεῖν
  choice: благословлять Бога
  alternative: прославлять Бога
  rationale: «Благословлять» сохраняет особую библейскую формулу исходного текста, не сводя её к более общему прославлению.
- issue: Значение ἐξομολογεῖσθε
  choice: благодарите
  alternative: исповедуйте / прославляйте
  rationale: Контекст Божьих благодеяний и публичного свидетельства указывает на благодарное признание; оттенок публичного признания сохраняется дальнейшими словами стиха.
- issue: Действие Бога μεθʼ ὑμῶν
  choice: что Он сделал с вами
  alternative: что Он сделал для вас
  rationale: Основной текст сохраняет формальную неоднозначность предлога μετά, а более благоприятный бенефактивный смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской религиозно-издательской норме. Синтаксис сделан естественным, но значимые повторы и неоднозначность сохранены.
