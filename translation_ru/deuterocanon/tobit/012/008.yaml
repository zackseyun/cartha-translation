base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/008.yaml
  text: Prayer with fasting[a], almsgiving, and righteousness is good; a little with righteousness is better than much with unrighteousness[b]. It is good to do almsgiving rather than to store up gold.
translation:
  language: ru
  text: Хороша молитва с постом, милостыней и праведностью; лучше малое с праведностью, чем многое с неправедностью.[a] Хорошо подавать милостыню, а не копить золото.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со справедливостью… с несправедливостью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθὸν
  choice: хороша / лучше
  rationale: Предикативное прилагательное выражает положительную оценку; во втором изречении сравнительная конструкция с ἢ естественно требует русского «лучше».
- source_word: προσευχὴ
  choice: молитва
  rationale: Стандартное и естественное обозначение молитвы.
- source_word: μετὰ
  choice: с
  rationale: Сохраняет простую связь молитвы с сопутствующими благочестивыми практиками, не уточняя характер этой связи.
- source_word: νηστείας
  choice: постом
  rationale: Обычный русский религиозный термин, передающий практику воздержания.
- source_word: ἐλεημοσύνης / ἐλεημοσύνην
  choice: милостыней / подавать милостыню
  rationale: В данном иудейско-греческом контексте речь идёт о помощи нуждающимся; во второй части идиоматическое «подавать милостыню» передаёт ποιῆσαι ἐλεημοσύνην.
- source_word: δικαιοσύνης
  choice: праведностью
  rationale: Сохраняет широкий нравственно-религиозный смысл слова и его явное противопоставление ἀδικία.
- source_word: τὸ ὀλίγον / πολὺ
  choice: малое / многое
  rationale: Краткая субстантивированная пара сохраняет афористичность и количественный контраст греческого текста.
- source_word: ἀδικίας
  choice: неправедностью
  rationale: Передаёт прямую лексическую антитезу к «праведности»; возможный оттенок несправедливости отмечен в сноске.
- source_word: καλὸν
  choice: хорошо
  rationale: Естественно передаёт положительную нравственную оценку без излишнего усиления до «благородно».
- source_word: θησαυρίσαι χρυσίον
  choice: копить золото
  rationale: Кратко и идиоматично передаёт накопление золота, не добавляя отрицательной окраски глагола «копить» сверх контекста.
theological_decisions:
- issue: Передача δικαιοσύνη / ἀδικία в нравоучительном контексте
  choice: праведность / неправедность
  alternative: справедливость / несправедливость
  rationale: Основной вариант сохраняет более широкий нравственно-религиозный смысл и формальную антитезу; социально-этический оттенок «справедливости» остаётся возможным и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и афористичным строем. Первая триада сохранена без поясняющих добавлений; выражение «подавать милостыню» выбрано как естественное русское соответствие буквальному «совершать милостыню».
