base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/012.yaml
  text: And now[a], when you and your bride Sarah were praying, I brought the memorial of your prayer before the Holy One. And when you were burying the dead[c][b], I likewise was with you.
translation:
  language: ru
  text: И теперь, когда ты и твоя жена Сарра[a] молились, я принёс перед Святым[c] память о вашей молитве[b]. И когда ты хоронил мёртвых, я также был рядом с тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое νύμφη может означать «невеста» или «молодая жена».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «напоминание о вашей молитве»; выражение может иметь культовый оттенок памятного приношения перед Богом.'
    reason: lexical_alternative
  - marker: c
    text: В контексте «Святой», вероятнее всего, относится к Богу; греческая формулировка остаётся краткой.
    reason: referent_clarification
lexical_decisions:
- source_word: νῦν
  choice: теперь
  rationale: Обычное временное наречие, которое здесь естественно служит переходом в речи.
- source_word: προσηύξω
  choice: молились
  rationale: Аорист обозначает совершавшуюся в тот момент молитву; русская форма множественного числа согласуется с составным подлежащим «ты и твоя жена Сарра».
- source_word: νύμφη
  choice: жена
  rationale: Слово может означать невесту или молодую жену. В данном контексте «жена» звучит естественно по-русски, а более узкий оттенок сохранён в сноске.
- source_word: προσήγαγον
  choice: представил
  rationale: Глагол означает поднести, привести или представить. «Представил» передаёт внесение молитвы в Божье присутствие, не добавляя прямо отсутствующего в тексте понятия жертвы.
- source_word: μνημόσυνον τῆς προσευχῆς ὑμῶν
  choice: память о вашей молитве
  rationale: Сохранены единственное число и возможный культовый оттенок существительного μνημόσυνον; неоднозначность пояснена в сноске.
- source_word: ἐνώπιον τοῦ ἁγίου
  choice: пред Святым
  rationale: Формально передаёт субстантивированное «Святым» и сохраняет торжественный регистр; контекстуальный референт указан в сноске без развёртывания его в основном тексте.
- source_word: ἐθάπτες τοὺς νεκρούς
  choice: хоронил мёртвых
  rationale: Имперфект допускает повторяющееся или продолжавшееся действие; несовершенный вид русского глагола сохраняет эту аспектуальность.
- source_word: ὡσαύτως συμπαρήμην σοι
  choice: я также был рядом с тобой
  rationale: Передаёт как соответствие предыдущему утверждению, так и оттенок сопутствующего присутствия, выраженный сложным глаголом.
theological_decisions:
- issue: Кого обозначает τοῦ ἁγίου («Святой»)
  choice: Бог, названный «Святым»
  alternative: небесное святое существо или ангельское присутствие
  rationale: По контексту Рафаил приносит молитву в Божье присутствие. Основной текст сохраняет краткую греческую формулировку, а сноска проясняет наиболее вероятный референт, не заменяя её толкованием.
- issue: Культовый оттенок μνημόσυνον
  choice: сохранить буквальное «память» с пояснением
  alternative: «памятная жертва» или «напоминание»
  rationale: Греческое слово может иметь культовые ассоциации, но само по себе здесь прямо не называет приношение; перевод не должен усиливать этот смысл сверх источника.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Форма «пред Святым» сохраняет достоинство и компактность оригинала; остальной синтаксис сделан прозрачным для обычного современного читателя.
