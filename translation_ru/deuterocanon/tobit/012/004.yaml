translation:
  language: ru
  text: 'И старец сказал: «Ему это причитается по праву».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρεσβύτης
  choice: старик
  rationale: В данном повествовательном контексте обозначает пожилого Товита; «старейшина» могло бы ошибочно подразумевать должность или общественный статус.
- source_word: Δικαιοῦται αὐτῷ
  choice: Это ему по праву
  rationale: 'Передаёт безлично-пассивную форму и дательный αὐτῷ естественным русским выражением: речь идёт о том, что названная ранее доля справедливо причитается ему. Формулировка не превращает высказывание в богословское утверждение об оправдании человека.'
theological_decisions:
- issue: Возможное прочтение δικαιοῦται как богословского «оправдывается»
  choice: Это ему по праву
  alternative: Он оправдан
  rationale: Контекст касается справедливого вознаграждения, а не оправдания перед Богом; при этом сохранена краткость и некоторая эллиптичность греческой фразы.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная повествовательная формулировка. Местоименное «это» сохраняет связь с названным в предыдущем стихе вознаграждением.
