  text: And now give thanks to God[a], because I am ascending to the one who sent me; and write all that has been accomplished in a book.
translation:
  language: ru
  text: А теперь благодарите Бога[a], потому что я восхожу к пославшему меня; и запишите в книгу всё, что совершилось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исповедуйте Бога»; возможно также: «восхваляйте Бога». Греческий глагол может обозначать открытое признание, выраженное в благодарении или хвале.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: благодарите
  rationale: В эллинистическом иудейском употреблении с дательным θεῷ глагол обычно означает открытое признание Божьих дел, выраженное благодарением или хвалой, а не исповедание грехов. Контекст прощания Рафаила поддерживает значение благодарности.
- source_word: ἀναβαίνω
  choice: я восхожу
  rationale: Настоящее время передаёт начинающееся или близкое действие, а «восхожу» сохраняет направленность вверх и небесный смысл, не подменяя её толкованием «возвращаюсь».
- source_word: τὸν ἀποστείλαντά με
  choice: к Пославшему меня
  rationale: Субстантивированное причастие естественно передано русским причастным оборотом. Заглавная буква указывает на подразумеваемого Бога, не добавляя Его имени в сам текст.
- source_word: γράψατε
  choice: запишите
  rationale: Императив требует письменно зафиксировать события; «запишите» в данном контексте естественнее простого «напишите» и не выходит за смысл греческого глагола.
- source_word: πάντα τὰ συντελεσθέντα
  choice: всё, что совершилось
  rationale: Перфектное страдательное причастие обозначает всё происшедшее и доведённое до завершения. «Совершилось» сохраняет оттенок завершённости, не уточняя действующего лица.
- source_word: εἰς βιβλίον
  choice: в книгу
  rationale: Оборот обозначает внесение сведений в письменный документ. «В книгу» прямо передаёт направление записи; перевод «свиток» был бы неоправданным культурным уточнением.
theological_decisions:
- issue: Смысл восхождения Рафаила к пославшему его
  choice: Сохранить прямое указание на восхождение к Пославшему без дальнейшего разъяснения ангелологии.
  alternative: Передать как «возвращаюсь» либо прямо добавить «к Богу, Который послал меня».
  rationale: Греческий текст подразумевает небесное восхождение к Божественному Пославшему, но в этой части стиха повторно не называет Бога. Перевод сохраняет это подразумевание и не делает его более явным, чем источник.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис близок к греческому, но естественен по-русски; сохранены завершённость событий и неоднозначность глагола ἐξομολογεῖσθε.
