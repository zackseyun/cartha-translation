  text: And now God has sent me to heal you and Sarah your bride[a].
translation:
  language: ru
  text: И теперь Бог послал меня исцелить тебя и твою невестку Сарру[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сарру, твою невесту (молодую жену)». Греческое слово νύμφη может означать как «невеста, молодая жена», так и «невестка»; здесь Рафаил обращается к Товиту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: И теперь
  rationale: Сохраняет соединительный союз и переход к нынешнему моменту в речи Рафаила.
- source_word: ἀπέστειλέν με ὁ θεὸς
  choice: Бог послал меня
  rationale: Прямо передаёт совершившееся Божье поручение; русское прошедшее время естественно выражает греческий аорист.
- source_word: ἰάσασθαί σε
  choice: исцелить тебя
  rationale: Глагол ἰάομαι обозначает исцеление; формулировка не ограничивает его смысл только телесной болезнью.
- source_word: τὴν νύμφην σου
  choice: твою невестку
  rationale: Рафаил обращается к Товиту, а Сарра является женой его сына Товии, поэтому в данном отношении естественное значение νύμφη — «невестка». Лексически возможное значение «невеста, молодая жена» сохранено в сноске.
- source_word: Σάρραν
  choice: Сарру
  rationale: Устоявшаяся русская форма имени Σάρρα в винительном падеже.
theological_decisions:
- issue: Значение νύμφη применительно к Товиту и Сарре
  choice: твою невестку
  alternative: твою невесту / молодую жену
  rationale: Адресат — Товит, а Сарра недавно стала женой его сына, поэтому родственное значение «невестка» лучше всего соответствует повествовательному контексту. Поскольку само греческое слово допускает также брачное значение, эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным библейским звучанием. Порядок слов остаётся естественным для русского языка и сохраняет приложение имени Сарры к обозначению её родства.
