  terminology: Имена «Товит», «Товия», «Сарра» и «Рафаил» в пояснении употреблены в традиционных русских формах. «Невестка» — точное контекстуальное обозначение родственной связи; сноска корректно фиксирует более широкий лексический диапазон греческого νύμφη без догматического или интерпретационного навязывания.
