  source_fidelity: «И теперь Бог послал меня исцелить тебя и твою невестку Сарру» точно передаёт греческое καὶ νῦν ἀπέστειλέν με ὁ θεὸς ἰάσασθαί σε καὶ τὴν νύμφην σου Σάρραν. Русское прошедшее «послал» адекватно передаёт аорист, а «исцелить» охватывает оба объекта, как и греческий инфинитив. Выбор «невестку» контекстуально наиболее естественен, поскольку адресат — Товит, а Сарра является женой его сына; лексическая возможность иного значения νύμφη не скрыта.
