  text: 'И он позвал ангела и сказал ему: «Возьми половину всего, что…»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный греческий фрагмент этого стиха неполон и обрывается посреди предложения после слов «всего, что». Поэтому перевод сохраняет незавершённую фразу и не добавляет отсутствующих в источнике слов.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: позвал
  rationale: Аорист καλέω в повествовательном контексте естественно передаётся как «позвал»; это современнее и менее официально, чем «призвал».
- source_word: τὸν ἄγγελον
  choice: ангела
  rationale: Хотя ἄγγελος может означать и «вестник», в контексте Товита речь идёт о небесном существе, поэтому выбрано «ангел».
- source_word: Λάβε
  choice: Возьми
  rationale: Прямое повеление от λαμβάνω в контексте предложения вознаграждения естественно передаётся словом «Возьми».
- source_word: τὸ ἥμισυ
  choice: половину
  rationale: В винительном падеже после «возьми» значение точно и естественно передаётся как «половину».
- source_word: πάντων
  choice: всего
  rationale: Субстантивированное πάντων имеет широкое значение «всего» и связано с последующим относительным местоимением.
- source_word: ὧν
  choice: что
  rationale: Относительное местоимение вводит оборванное придаточное; русское «что» естественно сохраняет незавершённость исходного фрагмента.
