review_pass:
  verdict: revise
  source_fidelity: 'Основной текст в целом точно передаёт греческий оригинал: ἐλεημοσύνη — «милостыня», ῥύεται — «избавляет», будущее ἀποκαθαριεῖ — «очистит», а πλησθήσονται ζωῆς — «исполнятся жизнью». Прямое утверждение об избавлении от смерти и очищении от всякого греха сохранено без богословского смягчения. Однако в обосновании сноски неверно назван греческий глагол: в источнике стоит πλησθήσονται, а не форма от πληρόω.'
  naturalness: «Те, кто творит дела милосердия и праведные дела» понятно, но повтор «дела» тяжеловесен. «Совершает дела милосердия и праведности» звучит естественнее в современном литературном русском и сохраняет практический смысл греческих множественных чисел.
  terminology: «Милостыня» уместно передаёт ἐλεημοσύνη как помощь нуждающимся. «Праведность» сохраняет ключевой термин δικαιοσύνη; выражение «дела ... праведности» отражает его множественное число и конкретно-практический оттенок. «Исполнятся жизнью» сохраняет образ и не предрешает, означает ли ζωή долголетие, жизненную полноту или иной вид жизни.
  issues:
  - severity: medium
    issue: В причине сноски неверно указан греческий глагол.
    rationale: В тексте LXX стоит πλησθήσονται («будут наполнены/насытятся»), а не πληρόω. Сноска должна объяснять фактическую форму и не содержать ошибочной лексической атрибуции.
  - severity: low
    issue: Повтор «дела» в последней части фразы стилистически тяжеловесен.
    rationale: Замена на «дела милосердия и праведности» делает фразу более плавной, не меняя значения и не устраняя практический смысл множественного числа.
  revised_text: Милостыня избавляет от смерти и очистит от всякого греха. Те, кто совершает дела милосердия и праведности, исполнятся жизнью.[a]
  revised_footnotes:
