base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/009.yaml
  text: Almsgiving rescues from death[a], and it will cleanse away every sin. Those who do acts of almsgiving and righteousness will be filled with life.
translation:
  language: ru
  text: Милостыня избавляет от смерти и очистит от всякого греха. Те, кто совершает дела милосердия и праведности, исполнятся жизнью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «насытятся жизнью».'
    reason: Форма πλησθήσονται с родительным ζωῆς может передавать как наполнение, так и насыщение чем-либо.
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: милостыня
  rationale: В единственном числе слово обозначает конкретную помощь нуждающимся и одновременно практику такой помощи. «Милостыня» сохраняет этот определённый смысл лучше, чем более широкие «милосердие» или «благотворительность».
- source_word: ῥύεται
  choice: избавляет
  rationale: Глагол означает избавление или спасение от опасности; «избавляет от смерти» естественно звучит по-русски и не добавляет к тексту более узкого богословского толкования.
- source_word: ἐκ θανάτου
  choice: от смерти
  rationale: Предлог ἐκ с родительным указывает, от чего происходит избавление; буквальный и естественный русский эквивалент — «от смерти».
- source_word: ἀποκαθαριεῖ
  choice: очистит
  rationale: Будущее время сохранено. В сочетании «очистит от всякого греха» русский язык передаёт как очищение, так и устранение нечистоты, выраженное сложным греческим глаголом.
- source_word: πᾶσαν ἁμαρτίαν
  choice: от всякого греха
  rationale: Единственное число с πᾶσαν имеет всеобъемлющий, распределительный смысл, естественно передаваемый как «всякого греха».
- source_word: οἱ ποιοῦντες
  choice: те, кто творит
  rationale: Субстантивированное причастие обозначает людей, постоянно совершающих названные дела. Конструкция «те, кто творит» ясна и сохраняет деятельный характер выражения.
- source_word: ἐλεημοσύνας
  choice: дела милосердия
  rationale: Множественное число указывает на конкретные поступки помощи. «Дела милосердия» передаёт практический и повторяющийся характер, избегая неестественного русского множественного «милостыни» в данной конструкции.
- source_word: δικαιοσύνας
  choice: праведные дела
  rationale: Множественное число и параллель с делами милосердия указывают на конкретные проявления праведности. «Праведные дела» сохраняет библейский корень и ясно выражает практический смысл.
- source_word: πλησθήσονται ζωῆς
  choice: исполнятся жизнью
  rationale: Будущий пассив с родительным допускает значения наполнения и насыщения. «Исполнятся жизнью» близко передаёт образ, не уточняя, идёт ли речь о долголетии, полноте жизненных сил или более широкой полноте жизни.
theological_decisions:
- issue: Связь милостыни с избавлением от смерти и очищением от греха
  choice: 'Прямое утверждение греческого текста сохранено без смягчающих пояснений: милостыня избавляет от смерти и очистит от всякого греха.'
  alternative: Истолковать слова как гиперболическое изречение мудрости о практической пользе щедрости либо явно связать очищение с покаянием и заветом.
  rationale: Исходный текст формулирует причинную связь прямо. Перевод сохраняет богословское напряжение и не вводит в стих отсутствующие в нём догматические оговорки.
- issue: Значение δικαιοσύνας во множественном числе
  choice: Перевести как «праведные дела», подчеркнув конкретные поступки.
  alternative: «праведность» или «дела справедливости»
  rationale: Хотя δικαιοσύνη может означать праведность или справедливость, множественное число и сочетание с ἐλεημοσύνας здесь естественно указывают на конкретные проявления праведного поведения.
- issue: Смысл образа πλησθήσονται ζωῆς
  choice: Сохранить открытый образ «исполнятся жизнью».
  alternative: «насытятся жизнью» или истолковывающее указание на долголетие либо вечную жизнь
  rationale: Греческая фраза допускает наполнение или насыщение жизнью и сама не определяет точнее характер этой жизни; перевод не снимает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Творит» и «исполнятся жизнью» сохраняют возвышенный регистр, оставаясь понятными; синтаксис упрощён конструкцией «те, кто». Маркер [a] помещён непосредственно после фразы, к которой относится лексическая альтернатива.
