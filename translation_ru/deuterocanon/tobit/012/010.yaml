  text: But those who sin are enemies of their own life[a].
translation:
  language: ru
  text: Но те, кто грешит, — враги собственной жизни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «враги собственной души». Греческое слово имеет более широкий диапазон значений, однако здесь прямой смысл — «жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ἁμαρτάνοντες
  choice: те, кто грешит
  rationale: Субстантивированное причастие настоящего времени обозначает людей по совершаемому ими действию. Формулировка сохраняет глагольный оттенок и звучит естественно по-русски.
- source_word: δὲ
  choice: Но
  rationale: Частица выражает лёгкое противопоставление предыдущей мысли; союз «но» ясно и естественно передаёт эту связь.
- source_word: πολέμιοί
  choice: враги
  rationale: Слово обозначает тех, кто враждебен или действует как враг. «Враги» — прямой и выразительный русский эквивалент.
- source_word: τῆς ἑαυτῶν ζωῆς
  choice: собственной жизни
  rationale: Рефлексивное выражение показывает, что грешащие выступают против своей же жизни. Единственное число оригинала сохранено; вариант не вводит отсутствующего в греческом тексте специального учения о душе.
theological_decisions:
- issue: Значение ζωή в нравственно-назидательном контексте
  choice: жизнь
  alternative: душа
  rationale: Греческое ζωή обычно означает «жизнь» и здесь указывает на собственную жизнь или жизненное благо человека. Перевод «душа» был бы возможным толкованием, но мог бы привнести не выраженную прямо антропологическую категорию.
translation_notes:
  register: Современный литературный русский язык; краткая афористичная конструкция сохраняет противопоставление и нравственную остроту оригинала. Тире отделяет распространённое подлежащее от именной части сказуемого и облегчает чтение.
