  text: I will certainly not hide any word from you[a]. I have indeed said, ‘It is good to hide a king’s secret[b], but to reveal the works of God gloriously.’
translation:
  language: ru
  text: 'Я ни за что не скрою от вас ни единого слова. Ведь я уже сказал: «Хранить тайну царя[a] — хорошо, а дела Бога — открывать со славой[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «секрет царя». Здесь греческое слово обозначает доверительное, не подлежащее разглашению дело, а не обязательно богословское «таинство».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с честью»; «достойным образом». Наречие может указывать на подобающий, почётный способ возвещения Божьих дел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ κρύψω
  choice: Я ни за что не скрою
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание с направленностью в будущее; «ни за что не скрою» естественно передаёт это твёрдое заверение.
- source_word: ἀφʼ ὑμῶν
  choice: от вас
  rationale: После κρύπτω предлог ἀπό с родительным падежом обозначает того, от кого нечто скрывают или утаивают.
- source_word: πᾶν ῥῆμα
  choice: ни единого слова
  rationale: Буквально — «каждое слово»; при отрицании русское «ни единого слова» сохраняет образ речи и передаёт смысл полного отсутствия утайки.
- source_word: εἴρηκα δὴ
  choice: Ведь я уже сказал
  rationale: Перфект εἴρηκα указывает на ранее произнесённые слова, сохраняющие значение сейчас; δή придаёт утверждению подчёркнутый характер. «Ведь» естественно связывает его с предшествующим заверением.
- source_word: μυστήριον βασιλέως
  choice: тайну царя
  rationale: В данном изречении μυστήριον означает доверительную, не подлежащую огласке тайну, а не обязательно богословское «таинство» или «мистерию».
- source_word: κρύψαι καλόν
  choice: Хранить … — хорошо
  rationale: Инфинитив с καλόν формулирует общее правило. Глагол «хранить» идиоматичен в сочетании «хранить тайну», сохраняя смысл сокрытия.
- source_word: τὰ δὲ ἔργα τοῦ θεοῦ
  choice: а дела Бога
  rationale: Противительный δέ передан союзом «а»; ἔργα здесь охватывает совершённые Богом дела.
- source_word: ἀνακαλύπτειν
  choice: открывать
  rationale: Глагол означает раскрывать, делать известным и образует прямой смысловой контраст с «хранить тайну».
- source_word: ἐνδόξως
  choice: со славой
  rationale: Так сохраняется связь наречия с понятием славы и одновременно не устраняется возможный оттенок достойного, почётного способа возвещения.
theological_decisions:
- issue: Значение μυστήριον в контексте мудрого изречения
  choice: тайна
  alternative: таинство; сокровенная тайна
  rationale: Речь идёт о конфиденциальном деле царя, которое следует хранить. Перевод «тайна» не привносит более поздних специальных богословских значений.
- issue: Оттенок ἐνδόξως при раскрытии Божьих дел
  choice: со славой
  alternative: с честью; достойным образом
  rationale: Греческое наречие допускает оттенки славы, почёта и достойного образа действия. Основной текст сохраняет образ славы, а примечание указывает реальную лексическую альтернативу, не уточняя насильно, кому именно воздаётся слава.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и слегка возвышенным строем. Усиленное отрицание передано естественной формулой «ни за что не… ни единого», а параллелизм изречения сохранён тире и противопоставлением «тайну царя — … дела Бога — …».
