  text: 'И он сказал: «Отец, я не понесу убытка[a], отдав ему половину того, что принёс обратно[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «я не терплю ущерба, отдав ему половину того, что принёс». То есть такое вознаграждение не оставит Товию в убытке.'
    reason: lexical_alternative
  - marker: b
    text: Греческое выражение можно перевести и как «то, что я принёс». Косвенная семитская параллель говорит о принесённом «оттуда» и контекстуально поддерживает смысл возвращения с имуществом; первичным основанием перевода остаётся греческий текст.
    reason: cross_reference
lexical_decisions:
- source_word: Πάτερ
  choice: Отец
  rationale: Прямое обращение Товии к отцу. В современном русском обращение без притяжательного местоимения естественно и сохраняет непосредственность греческого текста.
- source_word: οὐ βλάπτομαι
  choice: я ничего не потеряю
  rationale: 'Форма выражает отсутствие ущерба или убытка. В контексте предлагаемого вознаграждения будущее время по-русски естественно передаёт смысл: Товия не окажется в проигрыше.'
- source_word: δοὺς αὐτῷ
  choice: если отдам ему
  rationale: Аористное причастие обозначает сопутствующее обстоятельство. Условная конструкция естественно передаёт ещё только предполагаемую выплату, не утверждая, что она уже совершена.
- source_word: τὸ ἥμυσυ
  choice: половину
  rationale: Обычное русское соответствие субстантивированному греческому обозначению половины.
- source_word: ὧν ἐνήνοχα
  choice: того, что принёс обратно
  rationale: Перфект подчёркивает завершённое действие с сохраняющимся результатом; «обратно» отражает возвращение Товии с доставленными деньгами и имуществом, не сужая выражение только до денег.
