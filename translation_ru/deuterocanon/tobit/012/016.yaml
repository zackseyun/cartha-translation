translation:
  language: ru
  text: И оба пришли в смятение и пали ниц, потому что испугались.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: пришли в смятение
  rationale: Передаёт внезапное внутреннее потрясение и смятение, не подменяя его более сильным значением ужаса, который отдельно выражен далее.
- source_word: οἱ δύο
  choice: оба
  rationale: Естественно и точно передаёт субстантивированное числительное и указывает на Товита и Товию вместе.
- source_word: ἔπεσον ἐπὶ πρόσωπον
  choice: пали ниц
  rationale: Устойчивое русское выражение для падения лицом к земле; сохраняет телесную позу и возвышенный повествовательный регистр.
- source_word: ἐφοβήθησαν
  choice: испугались
  rationale: Естественно передаёт наступивший страх, выраженный греческим аористом φοβέομαι.
- source_word: ὅτι
  choice: потому что
  rationale: 'Ясно сохраняет причинную связь: они пали ниц вследствие страха.'
theological_decisions:
- issue: Характер реакции на откровение Рафаила
  choice: Падение ниц представлено как вызванное страхом, без добавления языка поклонения.
  alternative: Действие можно понимать как благоговейное простирание перед ангелом.
  rationale: Греческий текст прямо объясняет это действие страхом. Перевод сохраняет физическую позу и эмоциональную реакцию, не вводя отсутствующего в стихе утверждения о поклонении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Пали ниц» понятно широкому читателю и точно передаёт простирание лицом к земле; «пришли в смятение» сохраняет отличие внутреннего потрясения от прямо названного затем страха.
