base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/015.yaml
  text: I am Raphael[a], one of the seven holy angels who present the prayers of the holy ones and enter before the glory of the Holy One.
translation:
  language: ru
  text: «Я — Рафаил, один из семи святых ангелов, которые возносят молитвы святых[a] и входят в присутствие славы Святого».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «святых», то есть принадлежащих Богу людей; традиционный перевод: «святых».'
    reason: Поясняет субстантивированное τῶν ἁγίων, сохраняет множественное число и предотвращает отождествление исключительно с позднейшей категорией канонизированных святых.
lexical_decisions:
- source_word: Ῥαφαήλ
  choice: Рафаил
  rationale: Устоявшаяся русская библейская форма имени, непосредственно передающая греческое Ῥαφαήλ.
- source_word: εἷς ἐκ τῶν ἑπτὰ
  choice: один из семи
  rationale: Естественно передаёт партитивную конструкцию и сохраняет точное число.
- source_word: ἁγίων ἀγγέλων
  choice: святых ангелов
  rationale: Прямой и привычный русский эквивалент, сохраняющий значение ἅγιος.
- source_word: προσαναφέρουσιν
  choice: возносят
  rationale: Передаёт направленное к Богу принесение молитв; в сочетании «возносят молитвы» звучит естественно и не сводит действие к формальной передаче.
- source_word: τὰς προσευχὰς
  choice: молитвы
  rationale: Прямой и общеупотребительный эквивалент προσευχή.
- source_word: τῶν ἁγίων
  choice: святых
  rationale: Сохраняет субстантивированное значение «святые» и лексическую связь с ἅγιος; сноска поясняет, что речь может идти о принадлежащем Богу святом народе, а не о позднейшей категории канонизированных святых.
- source_word: εἰσπορεύονται ἐνώπιον
  choice: входят в присутствие
  rationale: Сохраняет как движение внутрь, выраженное εἰσπορεύονται, так и значение нахождения перед кем-либо у ἐνώπιον, избегая архаического русского оборота «входят пред».
- source_word: τῆς δόξης
  choice: славы
  rationale: Сохраняет самостоятельное существительное δόξα и образ явленной Божьей славы, не заменяя его толкованием.
- source_word: τοῦ ἁγίου
  choice: Святого
  rationale: Субстантивированное единственное число передано как почтительное именование Бога; прописная буква указывает на титульное употребление.
theological_decisions:
- issue: К кому относится выражение τοῦ ἁγίου
  choice: «Святого» как именование Бога
  alternative: Понимать выражение как менее определённое указание на божественную святость или присутствие
  rationale: Контекст небесного двора и грамматически субстантивированное τοῦ ἁγίου естественнее всего указывают на Бога. Формулировка не добавляет отсутствующего в греческом имени и сохраняет образ «славы Святого».
- issue: Кого обозначает τῶν ἁγίων
  choice: «святых» — принадлежащих Богу людей
  alternative: «святого народа» или церковно-традиционное понимание особо почитаемых святых
  rationale: Греческая форма буквально означает «святых» и в данном контексте относится к Божьим людям. Краткая сноска удерживает широту выражения и предотвращает неоправданное позднейшее сужение смысла.
translation_notes:
  register: Современный литературный русский с возвышенным, но не архаическим библейским звучанием. Конструкция «входят в присутствие славы» несколько торжественна, однако сохраняет необычный образ и движение исходного текста; «слава Святого» намеренно оставлена без разъясняющей перифразы.
