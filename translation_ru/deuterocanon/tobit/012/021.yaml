  text: And they stood up[a], and they did not see him.
translation:
  language: ru
  text: И они встали и не увидели его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не увидели его»; эти слова могут означать, что они больше его не видели, не называя прямо его исчезновения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστησαν
  choice: встали
  rationale: Аорист ἀνίστημι обозначает простое физическое действие; «встали» естественно и точно передаёт его в повествовательном контексте.
- source_word: οὐκ εἶδον
  choice: не увидели
  rationale: Греческий текст прямо сообщает наблюдаемый результат — они его не увидели, — не уточняя механизм исчезновения. Частица «уже» естественно передаёт подразумеваемое контекстом прекращение видимости, не превращая его в явно выраженную невозможность.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение мужского рода в винительном падеже относится в контексте к Рафаилу; прямой русский эквивалент — «его».
theological_decisions:
- issue: Следует ли прямо называть чудесное исчезновение
  choice: 'Сохранить точку зрения наблюдателей: «уже не увидели его»'
  alternative: «он исчез из виду» / «они уже не могли видеть его»
  rationale: Греческий текст сообщает лишь то, что они его не увидели, и не описывает способ исчезновения. Такой перевод сохраняет сдержанность и богословскую напряжённость исходного текста.
translation_notes:
  register: Современный литературный русский язык; краткий, достойный повествовательный стиль. Союз «но» естественно выражает контраст между тем, что они встали, и тем, что Рафаил уже не был видим, хотя греческий текст использует повторное καί («и»).
