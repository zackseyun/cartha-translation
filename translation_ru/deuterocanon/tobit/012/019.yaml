translation:
  language: ru
  text: Все эти дни я являлся вам[a], но не ел и не пил; а вы видели видение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Все эти дни я был видим вам…» Греческая форма может подчёркивать продолжавшееся явление на протяжении всего этого времени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσας τὰς ἡμέρας
  choice: Все эти дни
  rationale: Передаёт весь период времени естественным для современного русского языка выражением, сохраняя упоминание дней.
- source_word: ὠπτανόμην
  choice: я являлся вам
  rationale: Глагол обозначает явление или становление видимым; форма несовершенного вида уместно передаёт продолжавшееся на протяжении всего периода явление.
- source_word: οὐκ ἔφαγον οὐδὲ ἔπιον
  choice: не ел и не пил
  rationale: Сохраняет парную отрицательную конструкцию и её ясный, уравновешенный ритм.
- source_word: ἀλλὰ
  choice: вы же
  rationale: Русская противительная конструкция после точки с запятой естественно передаёт переход от отрицания реального принятия пищи к тому, что воспринимали собеседники.
- source_word: ὅρασιν
  choice: видение
  rationale: Слово может означать видение или зрительное явление; «видение» сохраняет сверхъестественный характер высказывания, не объясняя его сверх текста.
- source_word: ὑμεῖς ἐθεωρεῖτε
  choice: вы же созерцали
  rationale: «Созерцали» передаёт длительное зрительное восприятие, выраженное греческим имперфектом, и сочетается с существительным «видение» естественнее, чем буквальное «видели видение».
theological_decisions:
- issue: Характер видимого присутствия и действий Рафаила
  choice: Сохранено прямое утверждение, что Рафаил являлся им, не принимая пищи и питья, а они созерцали видение.
  alternative: Свести смысл к тому, что им лишь казалось, будто он ел и пил, либо подробно определить природу ангельского тела.
  rationale: Греческий текст противопоставляет явление Рафаила отсутствию еды и питья и называет воспринятое ὅρασις. Перевод сохраняет эту богословскую напряжённость и не добавляет отсутствующего в стихе объяснения.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Являлся» и «созерцали видение» сохраняют оттенок сверхъестественного явления; синтаксис остаётся понятным обычному читателю.
