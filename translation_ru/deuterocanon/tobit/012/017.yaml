  text: And he said to them[a], “Do not be afraid; peace be with you. But bless God forever.”
translation:
  language: ru
  text: 'И он сказал им: «Не бойтесь; мир будет с вами.[a] А Бога благословляйте вовеки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «мир будет вам». Греческий текст буквально: «мир вам будет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβεῖσθε
  choice: Не бойтесь
  rationale: Естественный современный русский запрет, точно передающий форму и смысл φοβέομαι без архаизации.
- source_word: εἰρήνη ὑμῖν ἔσται
  choice: мир будет с вами
  rationale: Сохраняет будущее время ἔσται и дательный ὑμῖν, представляя слова как заверение, а не только как формулу приветствия.
- source_word: τὸν δὲ θεὸν
  choice: А Бога
  rationale: 'Частица δέ обозначает мягкий контраст и переход: вместо страха им следует благословлять Бога.'
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Сохраняет основное лексическое значение εὐλογέω и уместный библейский регистр; по отношению к Богу подразумевает прославление.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Краткое, понятное и стилистически достойное русское соответствие устойчивому выражению о непрестанной длительности.
theological_decisions:
- issue: Смысл слов о мире
  choice: 'Заверение о будущем: «мир будет с вами»'
  alternative: 'Благопожелание или приветствие: «мир вам» / «да будет с вами мир»'
  rationale: Будущее ἔσται непосредственно поддерживает понимание как обещания после призыва не бояться; примечание сохраняет возможный оттенок формулы мира.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским, но понятным регистром. Порядок «А Бога» сохраняет смысловой акцент греческого текста; «вовеки» употреблено как живое богослужебно-библейское слово.
