base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/007.yaml
  text: Do not hesitate to acknowledge him[a]. It is good to conceal a king’s secret, but to reveal the works of God gloriously. Do what is good[b], and evil will not find you.
translation:
  language: ru
  text: Не стесняйтесь открыто признавать Его[a]. Хорошо хранить тайну царя, а дела Бога — славно[b] возвещать. Делайте добро, и зло не постигнет вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исповедоваться Ему», «благодарить Его» или «открыто хвалить Его». Греческий глагол допускает эти значения открытого признания в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с честью», «достойным образом». Греческое наречие может указывать на подобающий способ возвещения Божьих дел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκνεῖτε
  choice: Не медлите
  rationale: Передаёт повеление не мешкать и не уклоняться; естественно сочетается с инфинитивом «исповедовать».
- source_word: ἐξομολογεῖσθαι αὐτῷ
  choice: открыто исповедовать Его
  rationale: Глагол допускает значения открытого признания, благодарения и хвалы. В контексте возвещения дел Бога речь, вероятнее всего, идёт о публичном прославляющем признании, а не об исповедании греха.
- source_word: μυστήριον βασιλέως
  choice: тайну царя
  rationale: Здесь μυστήριον означает доверенную тайну, а не богословское таинство.
- source_word: καλὸν κρύψαι
  choice: хорошо хранить
  rationale: Русское «хранить тайну» естественно передаёт буквальное «скрывать» и сохраняет характер общего изречения.
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: дела Бога
  rationale: Прямо и ясно передаёт Божьи деяния без сужения смысла.
- source_word: ἀνακαλύπτειν
  choice: возвещать
  rationale: В контексте открытого рассказа о Божьих делах естественнее буквального «раскрывать», сохраняя противопоставление сокрытию.
- source_word: ἐνδόξως
  choice: славно
  rationale: Сохраняет связь со славой и допускает как прославляющий, так и достойный способ возвещения.
- source_word: ἀγαθὸν ποιήσατε
  choice: Делайте добро
  rationale: Естественное современное русское выражение, точно передающее нравственное повеление.
- source_word: κακὸν οὐχ εὑρήσει ὑμᾶς
  choice: зло не постигнет вас
  rationale: «Постигнет» естественно передаёт образ зла, которое находит человека, и не ограничивает значение только бедствием или вредом.
theological_decisions:
- issue: Значение ἐξομολογεῖσθαι αὐτῷ
  choice: открыто исповедовать Его
  alternative: исповедоваться Ему; благодарить Его; открыто хвалить Его
  rationale: Контраст между хранением царской тайны и возвещением Божьих дел указывает на публичное признание и прославление. Сноска сохраняет семантическую широту глагола.
- issue: Смысл ἐνδόξως
  choice: славно
  alternative: с честью; достойным образом
  rationale: Перевод сохраняет возможный доксологический оттенок, не исключая значения достойного способа речи; альтернатива указана в сноске.
- issue: Обещание κακὸν οὐχ εὑρήσει ὑμᾶς
  choice: зло не постигнет вас
  alternative: беда не настигнет вас; вред не постигнет вас
  rationale: Сохранено широкое и напряжённое значение κακόν без сведения изречения исключительно к физической безопасности.
translation_notes:
  register: Современный литературный русский язык с достоинством краткого поучительного изречения. «Хранить тайну» и «делать добро» выбраны как естественные устойчивые сочетания; синтаксический параллелизм и противопоставление сохранены.
