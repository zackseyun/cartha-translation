  text: For it was not by my own favor[a], but by the will of your God. Therefore bless him forever.
translation:
  language: ru
  text: Ведь это было не по моей собственной милости[a], а по воле вашего Бога. Поэтому благословляйте его вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не по моей собственной благодати». Греческое χάρις может означать «милость», «благоволение» или «благодать»; здесь, вероятно, имеется в виду, что Рафаил действовал не по собственной инициативе и не оказывал помощь независимо от Бога.'
    reason: 'Лексическая альтернатива: сохранение многозначности χάρις.'
lexical_decisions:
- source_word: χάριτι
  choice: милости
  rationale: В данном повествовательном контексте χάρις обозначает личную милость или благоволение Рафаила, а не самостоятельное действие с его стороны. «Милость» сохраняет многозначность слова и естественно сочетается с оборотом «по моей собственной».
- source_word: θελήσει
  choice: воле
  rationale: θέλημα здесь означает волю или намерение; «по воле вашего Бога» прямо и естественно передаёт греческий оборот.
- source_word: τοῦ θεοῦ ὑμῶν
  choice: вашего Бога
  rationale: Родительный оборот выражает отношение принадлежности и сохраняет прямое обращение к Товиту и его близким.
- source_word: ὅθεν
  choice: поэтому
  rationale: ὅθεν вводит вывод и последующее повеление; «поэтому» ясно передаёт логическую связь.
- source_word: εὐλογεῖτε
  choice: благословляйте
  rationale: Форма повелительного наклонения во множественном числе призывает постоянно благословлять Бога; выбранное слово сохраняет библейскую лексику и не сужает смысл до одной лишь хвалы.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Устойчивый греческий оборот означает непрестанно, навеки; «вовеки» кратко и уместно для возвышенного библейского регистра.
- source_word: ἐμαυτοῦ
  choice: моей собственной
  rationale: Возвратное местоимение подчёркивает, что Рафаил отрицает собственную инициативу или заслугу.
theological_decisions:
- issue: Смысл χάρις в словах Рафаила об источнике его действий
  choice: Рафаил говорит, что всё произошло не по его собственной милости или инициативе, а по воле Бога.
  alternative: «Не по моей собственной благодати, а по воле вашего Бога».
  rationale: χάρις допускает значения «милость», «благоволение» и «благодать». В повествовательном контексте речь прежде всего о подчинённости Рафаила Божьей воле, однако вариант «благодать» сохранён в примечании, чтобы не скрывать лексическую многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Эллиптическая греческая конструкция естественно восполнена словами «это было», без уточнения конкретного действия. Местоимение «его» оставлено со строчной буквы в соответствии с нейтральной современной орфографической практикой.
