base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/012/001.yaml
  text: Then Tobit called Tobias his son and said to him[a], “See, child, wages must be given to the man who went with you, and more must be added for him.”
translation:
  language: ru
  text: 'Тогда Товит позвал своего сына Товию и сказал ему: «Смотри, дитя[a], человеку, который сопровождал тебя, следует дать плату, и следует дать ему ещё».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. «дитя»; в параллельной семитской формулировке: «сын мой».'
    reason: Уточняет, что основное обращение следует греческому τέκνον, тогда как более конкретное семейное обращение имеется в параллельной семитской формулировке.
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: позвал
  rationale: Обычное повествовательное значение — позвать кого-либо к себе; современное и естественное русское выражение.
- source_word: Ὅρα
  choice: Смотри
  rationale: Императив привлекает внимание к последующему наставлению и сохраняет прямоту греческого выражения.
- source_word: τέκνον
  choice: сын мой
  rationale: Буквально греческое слово означает «дитя», однако в русском обращение «сын мой» естественнее передаёт ласковое родительское обращение к взрослому сыну; буквальное соответствие отмечено в сноске.
- source_word: μισθὸν
  choice: плату
  rationale: Речь идёт о вознаграждении, полагающемся спутнику за оказанную услугу; «плата» естественнее в данном контексте, чем «заработок» или «награда».
- source_word: τῷ ἀνθρώπῳ
  choice: человеку
  rationale: Передаёт греческое существительное и естественно обозначает уже известного участникам разговора спутника.
- source_word: τῷ συνελθόντι σοι
  choice: который ходил с тобой
  rationale: Близко передаёт причастную конструкцию «шедшему вместе с тобой», сохраняя связь со всем путешествием.
- source_word: προσθεῖναι αὐτῷ δεῖ
  choice: следует ... прибавить сверх неё
  rationale: «Следует» сохраняет безличное выражение необходимости δεῖ, а «сверх неё» ясно обозначает добавку к основной плате без введения неуказанного субъекта.
