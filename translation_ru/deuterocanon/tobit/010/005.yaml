  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ μέλει μοι
  choice: Неужели мне всё равно
  rationale: Греческий оборот μέλει μοι выражает заботу и личную озабоченность; риторический вопрос с «неужели» сохраняет форму и силу переживания, не превращая его в простое утверждение.
- source_word: τέκνον
  choice: дитя
  rationale: Ласковое семейное обращение без излишнего уточнения пола; «дитя» звучит в современном литературном русском возвышенно, но понятно.
- source_word: ἀφῆκά σε
  choice: я отпустила тебя
  rationale: ἀφίημι здесь означает позволить уйти, отпустить. Форма первого лица сама по себе не обозначает пола, однако в контексте слова принадлежат Анне, поэтому по-русски требуется женская форма.
- source_word: τὸ φῶς τῶν ὀφθαλμῶν μου
  choice: свет моих очей
  rationale: Сохранена выразительная метафора оригинала. Устойчивое русское сочетание понятно и передаёт нежность и эмоциональную напряжённость.
