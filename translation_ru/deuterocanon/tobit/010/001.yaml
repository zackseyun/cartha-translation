base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/010/001.yaml
  text: And Tobit his father counted each day[a]; and when the days of the journey were completed and they were not coming back[b],
translation:
  language: ru
  text: А Товит, его отец, день за днём считал дни; и когда истекли дни пути[b], а они всё не возвращались[a]...
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «они всё не приходили». Греческий имперфект указывает, что по истечении ожидаемого срока пути они по-прежнему не прибыли; в данном контексте речь идёт об их возвращении домой.'
    reason: lexical_alternative
  - marker: b
    text: 'В параллельной семитской традиции эта сцена изложена подробнее: там упомянуты подсчёт дней и ночей и скорбь родителей. Основной текст здесь следует более краткому греческому чтению.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλογίζετο ἑκάστης ἡμέρας
  choice: считал дни один за другим
  rationale: В данном контексте ἐλογίζετο означает не отвлечённое размышление, а подсчёт проходящих дней. Формулировка передаёт длительное действие и дистрибутивный смысл ἑκάστης ἡμέρας естественным современным русским языком.
- source_word: ἐπληρώθησαν αἱ ἡμέραι τῆς πορείας
  choice: миновало время, отведённое на дорогу
  rationale: Оборот обозначает истечение ожидаемого срока пути. «Миновало время» по-русски естественнее буквального «исполнились дни» и не создаёт ненужного богословского оттенка.
- source_word: οὐκ ἤρχοντο
  choice: они всё не возвращались
  rationale: Имперфект выражает продолжающееся отсутствие ожидаемого прибытия. По контексту Товит ждёт их дома, поэтому «возвращались» естественно передаёт направление, а частица «всё» — затянувшееся ожидание, не превращая форму в однократное завершённое действие.
- source_word: Τωβεὶτ ὁ πατὴρ αὐτοῦ
  choice: отец его, Товит
  rationale: Сохранено приложение греческого текста, но порядок слов приспособлен к ясной и естественной русской фразе.
- source_word: Καὶ … καὶ ὡς
  choice: А … когда же
  rationale: Связки переданы как естественное продолжение повествования и переход к моменту, когда ожидаемый срок уже истёк.
