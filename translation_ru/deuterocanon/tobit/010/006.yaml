translation:
  language: ru
  text: 'И Товит сказал ей: «Тише, не тревожься[a]. Будь здорова».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не имей слова (или дела)». Здесь, по смыслу: «не тревожься».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίγα
  choice: Успокойся
  rationale: Повелительная форма буквально призывает замолчать, но в данном обращении к встревоженной Анне служит кратким успокаивающим призывом. «Успокойся» естественно передаёт эту функцию без излишней резкости.
- source_word: μὴ λόγον ἔχε
  choice: не тревожься
  rationale: 'Буквально: «не имей слова/дела». Выражение неясно при дословной передаче; контекст указывает на тревогу Анны, поэтому выбран естественный русский эквивалент с сохранением буквальной особенности в сноске.'
- source_word: ὑγίαινε
  choice: Будь здорова
  rationale: Императив ὑγιαίνω обозначает здоровье, благополучие или здравое состояние. «Будь здорова» сохраняет прямую связь со здоровьем и согласуется с женским адресатом.
- source_word: λέγει αὐτῇ
  choice: сказал ей
  rationale: Историческое настоящее греческого повествования естественно передано русским прошедшим временем.
- source_word: Τωβείτ
  choice: Товит
  rationale: Использована традиционная русская форма имени персонажа книги Товита.
