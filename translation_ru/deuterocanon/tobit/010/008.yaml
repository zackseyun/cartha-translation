lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: Тогда … сказал
  rationale: Частица δέ здесь служит лёгкой повествовательной связкой; «тогда» естественно передаёт переход к следующему действию, не создавая сильного противопоставления.
- source_word: Τωβείας
  choice: Товия
  rationale: Использована традиционная русская форма имени, соответствующая греческому Τωβείας.
- source_word: τῷ Ῥαγουὴλ
  choice: Рагуилу
  rationale: Дательный падеж передан русским дательным; использована традиционная русская форма имени.
- source_word: Ἐξαπόστειλόν με
  choice: Отпусти меня
  rationale: Аористный императив выражает прямую просьбу разрешить отправиться в путь; «отпусти меня» естественно передаёт как просьбу об уходе, так и решающую роль Рагуила.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит причину просьбы; прямое причинное значение ясно передаётся сочетанием «потому что».
- source_word: ὁ πατήρ μου καὶ ἡ μήτηρ μου
  choice: отец мой и мать моя
  rationale: Сохранено раздельное и подчёркнутое упоминание обоих родителей, присутствующее в греческом тексте.
- source_word: οὐκέτι
  choice: уже не
  rationale: Естественно и точно выражает прекращение прежнего ожидания или надежды.
- source_word: ἐλπίζουσιν
  choice: надеются
  rationale: Глагол ἐλπίζω может обозначать и надежду, и ожидание. Основной перевод «надеются» сохраняет эмоциональную силу контекста, а значение «ожидают» приведено в сноске.
- source_word: ὄψεσθαί με
  choice: увидеть меня
  rationale: Инфинитив после ἐλπίζω естественно передаётся русским инфинитивом и сохраняет прямой смысл греческой конструкции.
