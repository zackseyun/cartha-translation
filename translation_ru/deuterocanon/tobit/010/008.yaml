  text: Then Tobias said to Raguel[a], “Send me away, because my father and my mother no longer expect to see me.”
translation:
  language: ru
  text: 'Тогда Товия сказал Рагуилу: «Отпусти меня, потому что отец мой и мать моя уже не надеются[a] увидеть меня».'
  philosophy: optimal-equivalence
