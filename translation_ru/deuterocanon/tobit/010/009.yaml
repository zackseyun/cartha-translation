  text: Then his father-in-law said to him[a], “Stay with me, and I will send word to your father, and they will make known to him the things concerning you.”
translation:
  language: ru
  text: 'Тогда тесть сказал ему: «Останься у меня, а я пошлю к твоему отцу, и ему сообщат[a], как у тебя дела».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «они сообщат ему то, что касается тебя». Множественное число, вероятно, неопределённо указывает на тех, кого пошлют с известием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πενθερός
  choice: тесть
  rationale: В данном контексте πενθερός обозначает отца жены Товии; современное русское «тесть» точно и естественно передаёт это родство.
- source_word: Μεῖνον παρʼ ἐμοί
  choice: Останься у меня
  rationale: Так естественно передаётся повелительная форма μένω и пребывание у говорящего; «у меня» уместно для приглашения остаться в его доме.
- source_word: κἀγὼ ἐξαποστελῶ πρὸς τὸν πατέρα σου
  choice: а я пошлю к твоему отцу
  rationale: Перевод сохраняет отсутствие прямо названного дополнения при глаголе «пошлю» и не добавляет в основной текст ни «весть», ни «посланников», хотя они подразумеваются контекстом.
- source_word: δηλώσουσιν
  choice: ему сообщат
  rationale: Неопределённо-личная русская конструкция естественно передаёт греческую форму третьего лица множественного числа без выраженного подлежащего и не вынуждает явно отождествлять действующих лиц.
- source_word: τὰ κατὰ σέ
  choice: как у тебя дела
  rationale: Это естественная современная передача идиомы о положении и обстоятельствах человека; буквальный оборот «то, что касается тебя» в прямой речи звучал бы тяжеловесно.
