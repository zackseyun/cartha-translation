lexical_decisions:
- source_word: λέγει
  choice: говорит
  rationale: Сохранено историческое настоящее греческого повествования; в русском оно естественно и передаёт форму источника без необходимости заменять её прошедшим временем.
- source_word: Ἐξαπόστειλόν
  choice: Отпусти меня
  rationale: В данном контексте императив означает позволить Товии отправиться прочь. «Отпусти меня» естественно по-русски и сохраняет направленность удаления, не добавляя отсутствующего в тексте значения «домой».
- source_word: πρὸς τὸν πατέρα μου
  choice: к моему отцу
  rationale: Предлог πρός с винительным обозначает движение к лицу. Перевод не добавляет слов «в дом» или «обратно», которых нет в греческом тексте.
- source_word: Τωβείας
  choice: Товия
  rationale: Использована традиционная русская библейская форма имени, соответствующая греческому Τωβείας и отличающая сына от Товита в принятом русском употреблении.
