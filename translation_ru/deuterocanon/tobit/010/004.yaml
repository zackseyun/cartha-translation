    reason: textual_variant
lexical_decisions:
- source_word: Ἀπώλετο
  choice: погиб
  rationale: В контексте скорби глагол выражает убеждение матери, что сын умер; «погиб» сохраняет силу высказывания, не уточняя обстоятельств смерти.
- source_word: τὸ παιδίον
  choice: наш ребёнок
  rationale: Буквально — «ребёнок»; притяжательное «наш» естественно в русской речи матери, обращённой к отцу, и не меняет референта.
- source_word: κεχρόνικεν
  choice: так долго не возвращается
  rationale: Перфект χρονίζω указывает на затянувшееся отсутствие. Русская формулировка естественно передаёт длительную задержку в данном контексте, не представляя её непременно как вызванную внешней силой.
- source_word: ἤρξατο θρηνεῖν
  choice: стала она оплакивать
  rationale: Передаёт начало погребального плача по тому, кого считают погибшим; «оплакивать» здесь точнее общего «скорбеть».
- source_word: αὐτὸν αὐτὸν
  choice: его
  rationale: Двойное местоимение в греческом тексте в основном тексте сглажено ради естественного русского синтаксиса, а повтор отмечен в сноске.
