translation:
  language: ru
  text: 'он сказал: «Не был ли он посрамлён[a]? Или, может быть, Гаваил умер, и никто не отдаёт ему деньги?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не был ли он посрамлён?» Эти слова могут подразумевать унизительную неудачу или препятствие, однако точные обстоятельства не названы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μή ποτε
  choice: Не … ли / Или, может быть
  rationale: Оборот вводит тревожные предположительные вопросы; русские формулировки естественно передают опасение, не превращая его в утверждение.
- source_word: κατῄσχυνται
  choice: опозорился
  rationale: Перфектная пассивная форма καταισχύνω буквально указывает на постыжение или позор. Русское возвратное «опозорился» сохраняет смысл постигшего человека унижения, не уточняя не названную в тексте причину.
- source_word: ἀπέθανεν
  choice: умер
  rationale: Простой и прямой эквивалент греческого аориста; результат смерти подразумевается контекстом.
- source_word: Γαβαήλ
  choice: Гаваил
  rationale: Имя передано по греческой форме Γαβαήλ в привычной для русского библейского регистра передаче; смешение с именем Гавриил не допускается.
- source_word: δίδωσιν αὐτῷ τὸ ἀργύριον
  choice: никто не отдаёт ему деньги
  rationale: ἀργύριον в данном повествовательном контексте означает денежную сумму, а не серебро как материал. «Отдаёт» естественно отражает выдачу хранившихся денег, не вводя более специального понятия выплаты или возврата долга.
