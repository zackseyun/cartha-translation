  yaml_path: translation/deuterocanon/tobit/010/011.yaml
  text: Then Raguel rose and gave him Sarah his wife[a], and half of his possessions—servants and livestock and silver—and after blessing them he sent them away, saying, “May the God of heaven prosper you, children[b], before I die.”
translation:
  language: ru
  text: 'Тогда Рагуил встал, отдал ему Сарру, его жену, и половину своего имущества — рабов[a], скот и серебро. Благословив их, он отправил их в путь со словами: «Да пошлёт[b] вам успех Бог небесный, дети, прежде чем я умру».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тела»; в перечне имущества имеются в виду рабы.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «Бог небесный пошлёт вам успех»; греческая форма будущего времени в этом контексте может выражать благословение.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναστὰς
  choice: встал
  rationale: Аористное причастие от ἀνίστημι обозначает, что Рагуил поднялся, чтобы совершить последующее действие; краткое «встал» естественно для русского повествования.
- source_word: ἔδωκεν αὐτῷ Σάρραν τὴν γυναῖκα αὐτοῦ
  choice: отдал ему Сарру, его жену
  rationale: Сохраняет прямое значение ἔδωκεν и приложение «его жену», не превращая действие в новое заключение брака.
- source_word: τὰ ἥμισυ τῶν ὑπαρχόντων
  choice: половину своего имущества
  rationale: ὑπάρχοντα здесь обозначает совокупность принадлежащего Рагуилу; «имущество» естественно вводит последующее перечисление.
- source_word: σώματα
  choice: рабов
  rationale: Буквально «тела»; в перечне имущества слово обозначает порабощённых людей. Русское «рабов» ясно передаёт социально-правовую реальность, не скрывая её эвфемизмом; буквальное выражение отмечено в сноске.
- source_word: κτήνη
  choice: скот
  rationale: Общее обозначение домашних животных как имущества; «скот» точно и естественно в данном перечне.
- source_word: ἀργύριον
  choice: серебро
  rationale: Сохранено конкретное значение слова, хотя серебро могло выполнять функцию денег.
- source_word: εὐλογήσας αὐτοὺς
  choice: благословив их
  rationale: Деепричастная конструкция естественно передаёт действие, предшествующее отправлению.
- source_word: ἐξαπέστειλεν
  choice: отпустил их
  rationale: В контексте отъезда глагол означает, что Рагуил отправил их в путь; «отпустил» естественно передаёт прощание и разрешение уехать.
- source_word: Εὐοδώσει ὑμᾶς
  choice: да пошлёт вам успех
  rationale: Формально это будущее время, но контекст благословения допускает и, вероятно, предполагает пожелание. Формула «да пошлёт» сохраняет благословительный характер и не сужает значение до одной лишь дороги.
- source_word: τέκνα
  choice: дети
  rationale: Передаёт обращение во множественном числе без добавления отсутствующего в греческом притяжательного местоимения «мои».
- source_word: ὁ θεὸς τοῦ οὐρανοῦ
  choice: Бог небесный
  rationale: Достоинственно и естественно передаёт иудейский титул Бога; вариант «Бог неба» был бы формальнее, но менее обычен по-русски.
- source_word: πρὸ τοῦ μὲ ἀποθανεῖν
  choice: прежде чем я умру
  rationale: Идиоматический русский эквивалент инфинитивной конструкции; субъект первого лица определяется прямой речью.
theological_decisions:
- issue: Сила будущего времени в Εὐοδώσει в формуле благословения
  choice: 'Пожелание: «Да пошлёт вам успех Бог небесный»'
  alternative: 'Предсказание: «Бог небесный пошлёт вам успех»'
  rationale: Речь сопровождает родительское благословение перед отъездом, поэтому будущее время естественно воспринимается как благопожелание. Возможное предсказательное прочтение сохранено в сноске.
- issue: Передача σώματα в перечне имущества
  choice: «рабов» в основном тексте с указанием буквального «тела» в сноске
  alternative: «слуг» или буквально «тела»
  rationale: В данном имущественном перечне речь идёт о людях, находившихся в собственности. «Слуги» могло бы затушевать эту реальность, тогда как буквальное «тела» без пояснения было бы непонятно современному читателю.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён до естественных русских фраз, но порядок событий и неоднозначность благословительной формы сохранены. Лексема σώματα передана прямо как «рабы», поскольку это точнее контекста собственности; сноска раскрывает необычную буквальную форму оригинала.
