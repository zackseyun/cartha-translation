  text: And he said to his daughter[a], “Honor your parents-in-law; they are now your parents. May I hear a good report about you.” And he kissed her. And Edna said to Tobiah, “Beloved brother, may the Lord of heaven restore you, and may he grant me to see children from you and from Sarah my daughter, so that I may rejoice before the Lord. And look, I entrust my daughter to you as a deposit[b]; do not grieve her.”
translation:
  language: ru
  text: 'И сказал он своей дочери: «Почитай свёкра и свекровь: теперь они твои родители. Пусть я услышу о тебе доброе». И поцеловал её. А Една сказала Товии: «Дорогой брат, да возвратит тебя[a] Господь небес и да даст мне увидеть твоих детей от Сарры, моей дочери, чтобы мне возрадоваться пред Господом. Вот, я вверяю тебе мою дочь на хранение[b]; не огорчай её».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может означать также «восстановит тебя»; в контексте предстоящего пути он, вероятно, включает мысль о благополучном возвращении.
    reason: lexical_alternative
  - marker: b
    text: То есть вверяю её твоей заботе и ответственности; буквально выражение означает «как переданное на хранение», «как вверенное».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίμα τοὺς πενθερούς σου
  choice: Почитай свёкра и свекровь
  rationale: В обращении к замужней дочери множественное πενθερούς обозначает родителей её мужа. «Почитай» сохраняет нравственную весомость τιμάω, а конкретное «свёкра и свекровь» точнее общего «родственников мужа».
- source_word: ἀκούσαιμί σου ἀκοὴν καλήν
  choice: Пусть я услышу о тебе доброе
  rationale: Естественная русская передача греческого пожелания услышать добрую весть или добрый отзыв о человеке без излишнего уточнения характера вести.
- source_word: ἀδελφὲ ἀγαπητέ
  choice: Дорогой брат
  rationale: Передаёт родственное и тёплое обращение современным литературным русским языком; «возлюбленный брат» здесь звучало бы чрезмерно возвышенно.
- source_word: ἀποκαταστήσει σε
  choice: да возвратит тебя
  rationale: В сцене проводов глагол естественно указывает на возвращение Товии, но его более широкое значение «восстановить» сохранено в примечании.
- source_word: ὁ κύριος τοῦ οὐρανοῦ
  choice: Господь небес
  rationale: Достоинственная и естественная передача божественного титула с сохранением родительного оборота.
- source_word: δῴη μοι ἰδεῖν σου παιδία ἐκ Σάρρας τῆς θυγατρός μου
  choice: да даст мне увидеть твоих детей от Сарры, моей дочери
  rationale: «Твоих детей от Сарры» точно и естественно передаёт принадлежность σου и происхождение ἐκ Σάρρας, не превращая происхождение в инструментальную связь.
- source_word: ἵνα εὐφρανθῶ ἐνώπιον τοῦ κυρίου
  choice: чтобы мне возрадоваться пред Господом
  rationale: «Возрадоваться» и «пред Господом» сохраняют молитвенный и торжественный тон исходного выражения.
- source_word: παρατίθεμαί σοι τὴν θυγατέρα μου ἐν παρακαταθήκῃ
  choice: я вверяю тебе мою дочь как залог
  rationale: «Вверяю» передаёт поручение заботе другого, а «как залог» сохраняет явную юридико-доверительную метафору παρακαταθήκη; её смысл пояснён в сноске.
- source_word: μὴ λυπήσῃς αὐτήν
  choice: не огорчай её
  rationale: Кратко и непосредственно передаёт каузативный смысл λυπέω — не причинять ей печали или страдания.
theological_decisions:
- issue: Передача κύριος в божественном титуле
  choice: Господь
  alternative: Владыка
  rationale: В данном контексте κύριος является божественным титулом. «Господь» соответствует устойчивому русскому библейскому употреблению и не добавляет конфессионально специфического толкования.
- issue: Неоднозначность ἀποκαταστήσει в молитвенном пожелании перед дорогой
  choice: да возвратит тебя
  alternative: да восстановит тебя
  rationale: Контекст отъезда поддерживает смысл возвращения, тогда как словарно возможный более широкий смысл восстановления не исключён и потому отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «пред Господом» и «да возвратит» поддерживают молитвенный регистр, тогда как синтаксис и остальная лексика остаются ясными для современного читателя. Все сноски привязаны к соответствующим неоднозначным выражениям исходного текста.
