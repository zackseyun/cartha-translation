  yaml_path: translation/deuterocanon/tobit/010/013.yaml
  text: After these things Tobiah also went on his way[a], blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
translation:
  language: ru
  text: После этого Товия продолжил путь, благословляя Бога за то, что Он сделал его путь успешным[a], и благословлял Рагуила и его жену Едну. Он шёл дальше, пока они не приблизились к Ниневии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделал успешной его дорогу». Это выражение означает, что Бог даровал Товии успех в пути.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте глагол «приблизились» стоит во множественном числе, тогда как далее имеется форма, обычно понимаемая как «его». Конструкция нерегулярна; перевод передаёт её вероятный повествовательный смысл: Товия и его спутники приблизились к Ниневии.'
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: После этого
  rationale: Естественный современный переход, сохраняющий связь с предшествующими событиями без ненужной буквальности «после этих вещей».
- source_word: ἐπορεύετο
  choice: продолжил путь / шёл дальше
  rationale: Имперфект передаёт продолжающееся движение; вариативность формулировки делает русский текст естественным.
- source_word: εὐλογῶν τὸν θεόν
  choice: благословляя Бога
  rationale: Сохраняет библейское значение εὐλογέω и лексическую связь с последующим κατευλόγει.
- source_word: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ
  choice: за то, что Он даровал успех его дороге
  rationale: Передаёт образ исходного выражения с ὁδός и ясно указывает, что успех пути дарован Богом.
- source_word: κατευλόγει
  choice: не переставал благословлять
  rationale: Имперфект выражает продолжительное или повторяющееся действие; приставочная форма усиливает значение благословения.
- source_word: Ῥαγουὴλ καὶ Ἔδναν τὴν γυναῖκα αὐτοῦ
  choice: Рагуила и его жену Едну
  rationale: Естественный русский порядок слов ясно передаёт, что Една — жена Рагуила.
- source_word: μέχρις οὗ ἤγγισαν αὐτὸν εἰς Νινευή
  choice: пока его не подвели к Ниневии
  rationale: Формулировка сохраняет множественное число глагола и αὐτόν как объект, не называя отсутствующего в греческом тексте субъекта.
theological_decisions:
- issue: Кто даровал успех дороге Товии
  choice: Бог даровал успех его дороге
  alternative: Бог сделал успешным всё предприятие Товии в более широком смысле
  rationale: Не выраженный явно субъект εὐώδωσεν естественно соотносится с непосредственно упомянутым Богом; дорожная образность исходного текста сохранена.
- issue: Благословение Рагуила и Едны
  choice: Товия продолжительно благословлял их
  alternative: Товия однократно простился с ними, пожелав им благополучия
  rationale: Имперфект κατευλόγει указывает на продолжающееся или повторявшееся действие, но текст не уточняет его словесную форму.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Имена переданы в традиционной русской форме. Необычная конструкция последней фразы сохранена в основном тексте и пояснена в сноске без устранения её неоднозначности.
