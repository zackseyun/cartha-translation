  text: And she said to him[a], “Be quiet; do not mislead me. My child has perished.” And every day she would go out to the road by which he had departed, and by day she would eat no bread, and at night she did not cease mourning for Tobias her son, until the fourteen days of the wedding feast were completed[b], which Raguel had sworn that he should spend there.
translation:
  language: ru
  text: 'И сказала она ему: «Замолчи, не вводи меня в заблуждение. Моё дитя погибло[a]». Каждый день она выходила на дорогу, по которой он ушёл; днём она не ела хлеба, а ночью не переставала оплакивать своего сына Товию, пока не окончились четырнадцать дней свадебного пира[b], которые Рагуил поклялся заставить его провести там.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пропало». Греческое слово ἀπώλετο может означать как гибель, так и утрату; здесь это исполненный страха вывод матери, а не подтверждение рассказчика.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «четырнадцать дней брака». По контексту имеются в виду дни свадебного празднования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίγα
  choice: Замолчи
  rationale: Краткое повеление сохраняет резкость ответа матери и прямо передаёт требование молчать.
- source_word: μὴ πλάνα με
  choice: не вводи меня в заблуждение
  rationale: Передаёт отказ от утешения, которое она считает ложным, не приписывая собеседнику намеренного обмана.
- source_word: ἀπώλετο
  choice: погибло
  rationale: По контексту мать убеждена в смерти сына, однако греческое слово допускает также значение утраты; эта неоднозначность отмечена в сноске.
- source_word: τὸ παιδίον μου
  choice: моё дитя
  rationale: Сохраняет материнскую нежность выражения и отличает его от последующего явного «сына».
- source_word: καθʼ ἡμέραν
  choice: каждый день
  rationale: Естественная передача повторяющегося действия.
- source_word: εἰς τὴν ὁδὸν ἔξω οἵας ἀπῆλθεν
  choice: выходила на дорогу, по которой он ушёл
  rationale: Ясно передаёт, что она ежедневно высматривала сына на пути его ухода.
- source_word: ἡμέρας τε ἄρτον οὐκ ἤσθιεν
  choice: днём она не ела хлеба
  rationale: Сохраняет конкретный образ хлеба, который может также обозначать пищу вообще.
- source_word: οὐ διέλιμπανεν θρηνοῦσα
  choice: не переставала оплакивать
  rationale: Передаёт длительный и непрерывный характер плача, выраженный имперфектом с причастием.
- source_word: αἱ δέκα τέσσαρες ἡμέραι τοῦ γάμου
  choice: четырнадцать дней свадебного пира
  rationale: По контексту речь идёт о сроке свадебного празднования, а не о браке как состоянии.
- source_word: ἃς ὤμοσεν Ῥαγουὴλ ποιῆσαι αὐτὸν ἐκεῖ
  choice: которые Рагуил поклялся удерживать его там
  rationale: Греческая конструкция сжата и несколько шероховата; перевод сохраняет отнесение четырнадцати дней к обещанному пребыванию Товии у Рагуила.
theological_decisions:
- issue: Слова матери о судьбе Товии
  choice: Передать ἀπώλετο как «погибло» и отметить альтернативу в сноске
  alternative: «пропало» или «потеряно»
  rationale: Реплика выражает отчаянный вывод матери, но не является авторским подтверждением смерти Товии; сноска сохраняет смысловой диапазон греческого слова.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сохранён повествовательным и плавным; конкретные образы «дитя», «хлеб» и продолжительное оплакивание переданы без архаизации.
