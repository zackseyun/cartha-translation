base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/006.yaml
  text: And the angel said to him[a], “I will go with you, and I am familiar with the way, and I have lodged with Gabael our brother.”
translation:
  language: ru
  text: 'И ангел сказал ему: «Я пойду с тобой. Я хорошо знаю дорогу[a] и останавливался у Гаваила, брата нашего».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «я опытен в дороге», то есть хорошо знаком с маршрутом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πορεύσομαι μετὰ σοῦ
  choice: Я пойду с тобой
  rationale: Будущая форма πορεύομαι с μετά и родительным падежом прямо выражает обещание сопровождать собеседника; это естественная современная русская формулировка.
- source_word: τῆς ὁδοῦ ἐμπειρῶ
  choice: Я хорошо знаю дорогу
  rationale: Сжатый греческий оборот означает практическое знакомство с дорогой или маршрутом. Перевод передаёт опытное знание, не утяжеляя фразу буквальным «опытен в дороге».
- source_word: παρὰ Γαβαὴλ
  choice: у Гаваила
  rationale: Παρά с именем лица при глаголе αὐλίζομαι указывает на пребывание у этого человека, вероятно в его доме.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: брата нашего
  rationale: Сохранено буквальное родственное обозначение ἀδελφός и несколько торжественный порядок слов; в контексте оно может обозначать также соплеменника или родственника.
- source_word: ηὐλίσθην
  choice: останавливался
  rationale: Аорист αὐλίζομαι обозначает ночлег или временное пребывание в пути. «Останавливался» естественно по-русски и не вводит отсутствующего в тексте уточнения о числе ночей.
theological_decisions:
- issue: Значение и написание ὁ ἄγγελος
  choice: ангел
  alternative: вестник
  rationale: В повествовании Товита это ангельское существо, поэтому контекстуально точен перевод «ангел». Строчная буква сохраняет употребление общего существительного в данной фразе.
- issue: Значение ἀδελφός применительно к Гаваилу
  choice: брат
  alternative: родственник / соплеменник
  rationale: Греческий текст непосредственно говорит «брат наш»; более узкое толкование степени родства или замена на «соплеменник» преждевременно разрешили бы возможную семитскую широту выражения.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным звучанием. Реплика разделена на короткие предложения для естественности; лексическая неоднозначность греческого оборота об опытном знании дороги отмечена сноской.
