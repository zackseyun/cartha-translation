lexical_decisions:
- source_word: ἐπιγνῶναι
  choice: узнать
  rationale: Инфинитив обозначает получение сведений о собеседнике; «узнать» естественно передаёт это значение по-русски.
- source_word: γένος
  choice: род
  rationale: В контексте речь идёт о происхождении и родственной группе; «род» кратко и точно сохраняет генеалогический оттенок.
- source_word: ὄνομα
  choice: имя
  rationale: Прямое обозначение имени человека, не требующее смыслового расширения.
- source_word: Ἐγὼ Ἀζαρίας
  choice: Я — Азария
  rationale: Имя передано в традиционной русской библейской форме, соответствующей греческому Ἀζαρίας.
- source_word: Ἀνανίου
  choice: Анании
  rationale: Родительный падеж выражает отчество по отцу; использована традиционная русская форма имени.
- source_word: τοῦ μεγάλου
  choice: Великого
  rationale: Сохранено буквальное и потенциально почётное значение прилагательного μέγας без истолкования как «старший».
- source_word: τῶν ἀδελφῶν σου
  choice: одного из твоих братьев
  rationale: Родительный оборот естественно понимается как указание на принадлежность Анании к кругу братьев адресата; добавление «одного из» делает эллиптическую греческую конструкцию грамматичной по-русски, а буквальный термин «братья» сохраняется.
theological_decisions:
- issue: Широта значения родственного термина ἀδελφῶν
  choice: братьев
  alternative: родственников / сородичей
  rationale: Основной текст сохраняет мужской родственный термин греческого оригинала и не устраняет возможную неоднозначность между родными братьями и более широким кругом родни; расширительное понимание отмечено в сноске.
