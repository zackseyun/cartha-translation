base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/017.yaml
  text: They agreed to this[a]. Then he said to Tobiah, “Get ready for the journey, and may your journey be prosperous.” So his son prepared what was needed for the journey. Then his father said to him, “Go with the man, and may God, who dwells in heaven, make your journey prosper, and may his angel go with you.” So both went out to depart[b], and the boy’s dog went with them.
translation:
  language: ru
  text: 'Они согласились. Тогда он сказал Товии: «Приготовься к дороге, и да будет путь ваш успешен». Его сын приготовил всё необходимое для дороги. Отец сказал ему: «Иди с этим человеком. Пусть Бог, обитающий на небе, дарует успех вашему пути, и пусть Его ангел идёт вместе с вами[a]». И оба они вышли, чтобы отправиться в путь, а с ними пошла и собака юноши.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «ангел» может также означать «вестник», однако в контексте книги Товита речь, по всей вероятности, идёт о небесном существе.
    reason: alternative_reading
lexical_decisions:
- source_word: εὐδόκησαν
  choice: Они согласились
  rationale: В контексте глагол выражает одобрение предложенного плана и согласие с ним, а не только эмоциональное удовлетворение.
- source_word: Ἔτοιμος γίνου πρὸς τὴν ὁδόν
  choice: Приготовься к дороге
  rationale: Естественно передаёт повеление приготовиться к предстоящему путешествию, сохраняя образ дороги.
- source_word: εὐοδωθεῖητε
  choice: да будет путь ваш успешен
  rationale: Оптатив выражает пожелание благополучного исхода путешествия; множественное число «ваш» сохранено по греческому тексту.
- source_word: τὰ πρὸς τὴν ὁδόν
  choice: всё необходимое для дороги
  rationale: Передаёт подразумеваемые приготовления или дорожные принадлежности, не уточняя их сверх текста.
- source_word: ὁ ἐν τῷ οὐρανῷ οἰκῶν θεός
  choice: Бог, обитающий на небе
  rationale: Сохраняет возвышенную описательную формулу и причастный смысл оригинала.
- source_word: εὐοδώσει τὴν ὁδὸν ὑμῶν
  choice: дарует успех вашему пути
  rationale: 'Естественно по-русски передаёт каузативный смысл: Бог сделает их путь успешным.'
- source_word: ὁ ἄγγελος αὐτοῦ συμπορευθήτω ὑμῖν
  choice: пусть Его ангел идёт вместе с вами
  rationale: Сохраняет пожелание и буквальный мотив совместного пути; в повествовательном контексте Товита ἄγγελος обозначает небесного ангела.
- source_word: ἐξῆλθαν ἀμφότεροι ἀπελθεῖν
  choice: оба они вышли, чтобы отправиться в путь
  rationale: Сохраняет несколько избыточную последовательность греческого текста «вышли, чтобы уйти», но звучит естественно по-русски.
- source_word: ὁ κύων τοῦ παιδαρίου
  choice: собака юноши
  rationale: παιδάριον указывает на молодого Товию; «юноша» уместнее современного «мальчик» для человека, отправляющегося в самостоятельное путешествие.
theological_decisions:
- issue: Значение ἄγγελος
  choice: Его ангел
  alternative: Его вестник
  rationale: Хотя слово может обозначать вестника вообще, развитие книги ясно поддерживает значение небесного ангела; перевод не добавляет позднейших догматических уточнений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор слова «путь/дорога» сохранён как важный мотив оригинала; формы множественного числа в благословении переданы согласно греческому тексту.
