  text: And he called him[a], and he went in, and they greeted one another.
translation:
  language: ru
  text: Он позвал его[a]; тот вошёл, и они поприветствовали друг друга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь краток: «Он позвал его; тот вошёл, и они поприветствовали друг друга». В более пространной семитской по форме традиции книги Товита в этой части повествования сохраняется дополнительный диалог, однако основной текст следует сохранившемуся греческому свидетельству, принятому для этого перевода.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: позвал
  rationale: Аорист καλέω в этой бытовой сцене естественно означает «позвал»; «призвал» звучало бы чрезмерно торжественно, а «пригласил» уточняло бы цель, не выраженную в греческом тексте.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение мужского рода в винительном падеже передано без поясняющего имени, поскольку его референт определяется ближайшим контекстом.
- source_word: εἰσῆλθεν
  choice: вошёл
  rationale: Обычное и точное соответствие глаголу со значением входа; добавленное «тот» естественно разграничивает действующих лиц в русском повествовании, не называя референта прямо.
- source_word: ἠσπάσαντο
  choice: поприветствовали
  rationale: ἀσπάζομαι здесь обозначает приветствие; перевод не привносит конкретного телесного жеста, например объятия.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Естественное русское соответствие взаимному местоимению, сохраняющее обоюдность действия.
