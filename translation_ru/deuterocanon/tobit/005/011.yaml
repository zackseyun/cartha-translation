  text: And Tobit said to him, “Brother, from what tribe and from what homeland are you? Show me.”
translation:
  language: ru
  text: 'И Товит сказал ему: «Брат, из какого ты племени и откуда родом? Объясни мне».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδελφέ
  choice: Брат
  rationale: Прямое обращение, естественно передающее уважительное и дружеское «брат» без утверждения буквального родства.
- source_word: φυλῆς
  choice: племени
  rationale: В контексте происхождения обозначает родоплеменную принадлежность; «племя» сохраняет историко-библейский смысл.
- source_word: πατρίδος
  choice: откуда родом
  rationale: Передаёт место или землю происхождения естественным современным русским оборотом, не сужая значение до города или страны.
- source_word: ὑπόδειξόν μοι
  choice: Объясни мне
  rationale: Глагол может означать «покажи, укажи, сообщи»; при просьбе раскрыть происхождение буквальное «покажи» по-русски неестественно, тогда как «объясни» сохраняет побуждение дать ясные сведения.
