  text: And Tobiah answered him[a], “Father, I will do everything that you have commanded me.”
translation:
  language: ru
  text: 'И Товия ответил ему[a]: «Отец, я сделаю всё, что ты мне повелел».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Параллельный свидетель в семитской форме прямо говорит: «Товия ответил своему отцу… всё, что ты повелел мне, отец мой, я сделаю». В основном греческом свидетеле сказано проще: «ответил ему», а затем следует обращение «Отец».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: ответил
  rationale: Обычная повествовательная формула, вводящая прямую речь; личная форма естественна по-русски и точно передаёт функцию греческого причастия.
- source_word: Τωβίας
  choice: Товия
  rationale: Форма имени соответствует принятой русской библейской передаче и позволяет отличать сына Товию от его отца Товита.
- source_word: αὐτῷ
  choice: ему
  rationale: Сохраняет местоимение греческого основного свидетеля, не подставляя явно обозначенного отца; обращение «Отец» делает референта понятным.
- source_word: Πάτερ
  choice: Отец
  rationale: Точно передаёт звательный смысл без добавления притяжательного местоимения, которого в основном греческом тексте нет.
- source_word: ποιήσω
  choice: я сделаю
  rationale: Будущее время выражает намерение исполнить поручение; простая формулировка естественна в семейном диалоге.
- source_word: πάντα ὅσα
  choice: всё, что
  rationale: Естественная русская конструкция, сохраняющая значение полного исполнения сказанного.
- source_word: ἐντέταλσαί μοι
  choice: ты мне повелел
  rationale: «Повелел» передаёт данное поручение или заповедь, а дательный μοι — адресата; результат ранее данного повеления остаётся актуальным.
