lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Противительный союз вводит практическое возражение в ответ на предыдущее поручение.
- source_word: πῶς δυνησομαι
  choice: как я смогу
  rationale: Передаёт и вопрос об образе действия, и будущую возможность, выраженную формой δύναμαι.
- source_word: λαβεῖν
  choice: получить
  rationale: В контексте речь идёт о получении назад денег, отданных на хранение; «получить» естественно передаёт смысл, не уточняя сверх греческого текста способ передачи.
- source_word: τὸ ἀργύριον
  choice: эти деньги
  rationale: ἀργύριον буквально обозначает серебро, но здесь относится к денежной сумме; указательное «эти» естественно отсылает к уже упомянутым деньгам.
- source_word: καὶ
  choice: если
  rationale: Формально союз означает «и», однако здесь связывает невозможность получить деньги с отсутствием знакомства. Условно-причинное «если» естественно выражает эту связь по-русски, сохраняя вопросительную форму.
- source_word: οὐ γινώσκω αὐτόν
  choice: я его не знаю
  rationale: Передаёт отсутствие личного знакомства или узнавания без излишнего уточнения.
