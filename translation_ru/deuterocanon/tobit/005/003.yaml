translation:
  language: ru
  text: 'И он передал ему письменный документ[a] и сказал: «Найди себе человека, который пойдёт с тобой; я дам ему плату, пока жив. Затем отправляйся и забери серебро[b]».'
  philosophy: optimal-equivalence
  footnotes:
