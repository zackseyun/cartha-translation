    reason: lexical_alternative
  - marker: b
    text: 'Или: «деньги». Греческое слово буквально означает «серебро», но здесь речь идёт о средствах, отданных на хранение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χειρόγραφον
  choice: расписку
  rationale: Слово обозначает собственноручно написанный документ; в данном контексте это документ, связанный с отданными на хранение средствами. «Расписка» естественно передаёт эту функцию, не превращая документ в обычное письмо.
- source_word: Ζήτησον σεαυτῷ ἄνθρωπον
  choice: Найди себе человека
  rationale: Передаёт прямое значение греческой фразы и сохраняет указание на конкретного спутника, не добавляя роли проводника, которой сам текст прямо не называет.
- source_word: συμπορεύσεταί σοι
  choice: который пойдёт с тобой
  rationale: Сохраняет конкретный смысл совместного пути и звучит естественно по-русски.
- source_word: μισθὸν
  choice: буду платить ему
  rationale: В контексте найма μισθός означает вознаграждение за услугу. Глагольная формулировка естественнее русского «дам ему плату» и не предполагает обязательно регулярной заработной платы.
- source_word: ἕως ζῶ
  choice: пока я жив
  rationale: Близко передаёт временную формулу греческого текста без уточнения, относится ли она к сроку обязательства или к заверению в личной оплате.
- source_word: λάβε πορευθεὶς τὸ ἀργύριον
  choice: а ты отправляйся и забери серебро
  rationale: Причастная конструкция передана естественной последовательностью действий. «Серебро» сохраняет буквальное значение ἀργύριον, тогда как контекст допускает значение денежных средств.
