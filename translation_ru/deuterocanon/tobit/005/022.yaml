  text: For a good angel will go with him, and his journey will be successful, and he will return in good health.
translation:
  language: ru
  text: Ведь добрый ангел пойдёт вместе с ним, и путь его будет благополучен, и он вернётся здоровым.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: ангел
  rationale: В контексте книги Товита речь идёт о небесном существе, поэтому «ангел» точнее, чем общее «вестник».
- source_word: ἀγαθὸς
  choice: добрый
  rationale: Передаёт простое определение характера или благотворной роли ангела без дополнительного истолкования.
- source_word: συνπορεύσεται
  choice: пойдёт вместе с ним
  rationale: Сохраняет заложенное в глаголе значение совместного пути и естественно звучит по-русски.
- source_word: εὐοδωθήσεται
  choice: будет благополучен
  rationale: Передаёт значение удачного, благоприятного исхода пути; пассивная форма греческого допускает такое естественное русское выражение.
- source_word: ἡ ὁδὸς αὐτοῦ
  choice: путь его
  rationale: Сохраняет образ пути и в данном контексте естественно обозначает путешествие.
- source_word: ὑποστρέψει
  choice: он вернётся
  rationale: Прямо и ясно передаёт обычное значение глагола — возвращение.
- source_word: ὑγιαίνων
  choice: здоровым
  rationale: Причастие обозначает состояние здоровья; творительный предикативный естественно передаёт «вернётся, будучи здоров».
theological_decisions:
- issue: Природа ἄγγελος в контексте
  choice: небесный ангел
  alternative: вестник в общем смысле
  rationale: В повествовательном контексте Товита подразумевается ангельский спутник и защитник; перевод «ангел» отражает референт, не добавляя иных доктринальных утверждений.
translation_notes:
  register: Современный литературный русский язык; тон простой и достойный. Синтаксический параллелизм трёх будущих действий сохранён, а подлинная причинная связь, выраженная γὰρ, передана словом «ведь».
