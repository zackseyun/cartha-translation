base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/009.yaml
  text: And he went in and said to his father[a], “Look, I have found someone who will travel with me.” And he said, “Call him to me, so that I may learn what tribe he is from[c][b], and whether he is trustworthy to go with you.”
translation:
  language: ru
  text: 'Войдя, он сказал отцу: «Вот, я нашёл человека, который пойдёт со мной». Отец ответил: «Позови его ко мне, чтобы я узнал, из какого он колена[a] и надёжен ли он, чтобы идти с тобой[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть к какому из колен Израиля он принадлежит.
    reason: cultural_note
  - marker: b
    text: 'Или: «можно ли ему доверять в пути с тобой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: Войдя
  rationale: Аористное причастие обозначает действие, предшествующее главному; русское деепричастие кратко и естественно передаёт последовательность.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Частица привлекает внимание и в современном русском естественно передаётся словом «вот», без архаизации.
- source_word: εὕρηκα
  choice: я нашёл
  rationale: 'Русское прошедшее время в контексте сохраняет результативный смысл греческого перфекта: спутник уже найден.'
- source_word: ὃς συμπορεύσεταί μοι
  choice: человека, который пойдёт со мной
  rationale: Передаёт совместное путешествие и естественно восполняет подразумеваемое лицо после относительного местоимения.
- source_word: Φώνησον αὐτὸν πρὸς μέ
  choice: Позови его ко мне
  rationale: Точно и естественно передаёт приказ позвать человека к говорящему.
- source_word: ἐπιγνῶ
  choice: чтобы я узнал
  rationale: В контексте речь идёт о выяснении личности и пригодности спутника.
- source_word: ποίας φυλῆς ἐστίν
  choice: из какого он колена
  rationale: В библейском контексте φυλή обозначает колено Израиля; «колено» сохраняет конкретную родоплеменную принадлежность.
- source_word: πιστὸς τοῦ πορευθῆναι μετὰ σοῦ
  choice: можно ли ему доверять в пути с тобой
  rationale: Передаёт практический смысл πιστός — надёжность предполагаемого спутника — и естественно связывает его с путешествием.
theological_decisions:
- issue: Значение φυλή как обозначения общественной принадлежности
  choice: колено
  alternative: племя; род
  rationale: В израильском контексте «колено» точнее сохраняет историко-библейскую категорию и не обобщает её до рода или семьи.
- issue: Значение πιστός при оценке спутника
  choice: можно ли ему доверять
  alternative: верен ли он; надёжен ли он
  rationale: Контекст требует оценки надёжности в дороге, а не утверждения о религиозной верности; выбранная формулировка сохраняет личностный и практический оттенки.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён без утраты содержания; «колено» сохранено как необходимый библейский историко-культурный термин.
