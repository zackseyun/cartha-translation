  yaml_path: translation/deuterocanon/tobit/005/018.yaml
  text: But Anna his mother wept and said to Tobit[a], “Why did you send our child away? Is he not the staff of our hand as he goes in and goes out before us?”
translation:
  language: ru
  text: 'Но Анна, его мать, заплакала и сказала Товиту: «Зачем ты отослал нашего ребёнка? Разве он не посох в нашей руке[a], когда входит и выходит перед нами?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу: «наша опора». В основном тексте сохранён образ посоха из греческого текста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔκλαυσεν
  choice: заплакала
  rationale: Аорист κλαίω обозначает плач; «заплакала» естественно передаёт начало явного проявления скорби в данном повествовательном контексте.
- source_word: ἐξαπέστειλας
  choice: отослал
  rationale: Сложный глагол выражает отправление прочь от себя; «отослал» кратко и естественно передаёт укор Анны из-за ухода ребёнка.
- source_word: τὸ παιδίον ἡμῶν
  choice: нашего ребёнка
  rationale: παιδίον значит «ребёнок, дитя, мальчик»; контекст допускает «сына», но «ребёнка» сохраняет ласковый материнский оттенок и не сужает значение существительного.
- source_word: ῥάβδος τῆς χειρὸς ἡμῶν
  choice: посох в нашей руке
  rationale: Сохранён конкретный образ опоры. Русское «посох нашей руки» было бы чрезмерно калькированным, тогда как «посох в нашей руке» остаётся образным и понятным.
- source_word: ἐν τῷ εἰσπορεύεσθαι αὐτὸν καὶ ἐκπορεύεσθαι
  choice: когда входит и выходит
  rationale: Конструкция описывает его привычные приходы и уходы. Парная формула сохранена, а местоимение естественно подразумевается русским глаголом.
- source_word: ἐνώπιον ἡμῶν
  choice: перед нами
  rationale: Прямое соответствие греческому выражению; оно сохраняет пространственный образ и ритм исходной фразы.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Образ «посоха» сохранён, но греческая конструкция слегка адаптирована к естественному русскому синтаксису; идиома «входит и выходит перед нами» намеренно не сглажена полностью.
