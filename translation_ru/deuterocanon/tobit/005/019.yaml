  text: Не ставь серебро выше нашего сына[a]; пусть оно станет сором в сравнении с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст буквально и несколько неясно: «не дать серебру опередить серебро, но пусть оно станет сором нашего ребёнка». Это сжатый идиоматический оборот: деньги не следует считать чем-то ценным в сравнении с ребёнком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀργύριον … τῷ ἀργυρίῳ
  choice: серебро серебром
  rationale: Повтор конкретного слова «серебро» сохраняет сжатую, почти пословичную форму греческого выражения; творительный падеж по-русски передаёт средство или меру оценки, не устраняя подлинной неясности оборота.
- source_word: μὴ φθάσαι
  choice: не оценивай
  rationale: Буквально φθάνω означает «опережать, приходить прежде», однако здесь оборот предостерегает от того, чтобы деньги определяли решение. «Не оценивай» передаёт смысл в естественной русской форме, а буквальная образность отмечена в сноске.
- source_word: ἀλλά
  choice: пусть
  rationale: Противопоставление передано точкой с запятой и побудительной конструкцией; явное «но» в русском необязательно, поскольку контраст уже выражен синтаксисом.
- source_word: περίψημα
  choice: сор
  rationale: Слово обозначает соскобленное, смытое или выброшенное — отбросы, сор. «Сор» краток, современен и сохраняет резкое обесценивание серебра.
- source_word: τοῦ παιδίου ἡμῶν
  choice: по сравнению с нашим сыном
  rationale: Греческий родительный падеж с περίψημα предельно сжат. В контексте речь идёт об их сыне; сравнительная формулировка ясно передаёт ничтожную ценность денег относительно ребёнка, не превращая «сор» в характеристику самого сына.
- source_word: γένοιτο
  choice: пусть оно станет
  rationale: Оптатив выражает пожелание или решимость. «Пусть оно станет» сохраняет его волевой оттенок и глагольную динамику.
theological_decisions:
- issue: Соотношение материального достатка и ценности сына в эллиптическом греческом обороте
  choice: Серебро представлено как сор по сравнению с сыном.
  alternative: Пусть серебро станет сором ради нашего сына.
  rationale: Оборот прежде всего выражает несопоставимость денег и благополучия ребёнка. Выбранный вариант делает эту мысль понятной, но сноска сохраняет буквальную трудность первой части и возможный оттенок отказа от денег ради сына.
translation_notes:
  register: Современный литературный русский язык; тон краткий, решительный и достойный. Слово «сын» выбрано по контексту, тогда как греческое παιδίον буквально означает «ребёнок, дитя».
