lexical_decisions:
- source_word: μισθὸν
  choice: плату
  rationale: μισθός обозначает вознаграждение за труд или услугу; «плата» естественно звучит в вопросе о найме и не сужает смысл до современной регулярной зарплаты.
- source_word: δραχμὴν τῆς ἡμέρας
  choice: драхму в день
  rationale: Родительная конструкция выражает дневную ставку; сохранено древнее название денежной единицы без модернизации.
- source_word: τὰ δέοντά σοι
  choice: всё необходимое тебе
  rationale: Субстантивированное причастие обозначает то, что человеку нужно; формулировка естественна по-русски и не уточняет без основания, идёт ли речь только о пище, дорожных припасах или расходах.
- source_word: ὡς καὶ τῷ υἱῷ μου
  choice: как и моему сыну
  rationale: 'Передана сравнительная конструкция: Товит намерен обеспечивать спутника так же, как сына, без добавления отсутствующего в греческом усиления «родному».'
- source_word: τίνα σοὶ ἔσομαι μισθὸν διδόναι
  choice: какую плату мне давать тебе
  rationale: Будущее εἰμί с инфинитивом выражает предполагаемое или надлежащее действие. Русская конструкция сохраняет прямой вопрос и несколько необычный порядок смысловых компонентов оригинала.
