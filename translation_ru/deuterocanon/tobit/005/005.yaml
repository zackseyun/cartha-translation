  text: And he said to him[a], “Can I travel with you to Rages of Media[b], and are you familiar with the places?”
translation:
  language: ru
  text: 'И он спросил его: «Могу ли я отправиться с тобой в Раги[a][b] Мидии, и знаком ли ты с этими местами?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое ἐν Ῥάγοις буквально можно передать как «в Рагах», однако при глаголе движения здесь, вероятнее всего, имеется в виду направление: «в Раги».'
    reason: lexical_alternative
  - marker: b
    text: Раги — передача греческого названия Ῥάγοι; встречаются также формы «Рага» и «Рагес».
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ
  choice: И он спросил его
  rationale: Глагол εἶπεν буквально означает «сказал», но здесь вводит прямой вопрос; «спросил» естественно передаёт речевую функцию фразы, не меняя её смысла.
- source_word: Εἰ δύναμαι πορευθῆναι μετὰ σοῦ
  choice: Могу ли я отправиться с тобой
  rationale: δύναμαι сохраняет значение возможности или способности («могу ли»), πορευθῆναι обозначает отправление в путь, а μετὰ σοῦ — совместное путешествие.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: в Раги Мидии
  rationale: Хотя ἐν обычно значит «в», при глаголе движения выражение по контексту обозначает место назначения. Родительный τῆς Μηδείας передан без добавочного толкования как «Мидии».
- source_word: ἔμπειρος εἶ τῶν τόπων
  choice: хорошо ли ты знаешь те места
  rationale: ἔμπειρος с родительным указывает на знакомство, опытное знание местности. Такая формулировка естественна по-русски и сохраняет множественное число τῶν τόπων.
