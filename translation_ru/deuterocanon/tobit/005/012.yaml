translation:
  language: ru
  text: 'Он сказал ему: «Ты ищешь колено и род или наёмного человека, который отправится вместе с твоим сыном?» Товит ответил ему: «Я хочу знать[a], брат…[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом ответ выражен неполно: буквально «Я хочу, брат». Слово «знать» восстановлено по смыслу предшествующего вопроса.'
    reason: lexical_alternative
  - marker: b
    text: В предоставленной греческой транскрипции реплика заканчивается после обращения «брат»; поэтому её дальнейшее продолжение не переводится.
    reason: textual_variant
lexical_decisions:
- source_word: Φυλὴν
  choice: колено
  rationale: В данном контексте слово обозначает племенную принадлежность; «колено» точно передаёт этот смысл и естественно сочетается с «родом».
- source_word: πατριὰν
  choice: род
  rationale: Слово указывает на происхождение и родственную линию. «Род» сохраняет генеалогический смысл без излишне специального оттенка.
- source_word: μίσθιον
  choice: наёмного человека
  rationale: Существительное обозначает человека, нанятого за плату. Нейтральное выражение не добавляет ни уничижительного оттенка, ни прямо не названной в греческом роли проводника.
- source_word: συμπορεύσεται
  choice: пойдёт с
  rationale: Прямо и естественно передаёт совместное путешествие, выраженное глаголом.
- source_word: Βούλομαι
  choice: Я хочу знать
  rationale: 'В греческом ответ эллиптичен: буквально «Я хочу, брат». Объект «знать» восстановлен из предшествующего вопроса для ясности по-русски и отмечен сноской.'
- source_word: ἀδελφέ
  choice: брат
  rationale: Сохранено буквальное обращение, которое здесь также служит вежливой формой речи.
