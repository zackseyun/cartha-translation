  text: And he said to him[a], “Go, and do not delay.”
translation:
  language: ru
  text: 'И он сказал ему[a]: «Отправляйся и не задерживайся».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «Иди и не задерживайся». Семитский параллельный материал для этого раздела подробнее в соседних стихах, однако само это повеление ясно и не вносит существенных различий в перевод данного стиха.'
    reason: cross_reference
lexical_decisions:
- source_word: Πορεύου
  choice: Отправляйся
  rationale: Повелительная форма πορεύομαι в данном контексте означает приказ тронуться в путь. «Отправляйся» естественно передаёт смысл и сохраняет краткость греческого текста.
- source_word: μὴ χρονίσῃς
  choice: не задерживайся
  rationale: Форма от χρονίζω запрещает медлить или задерживаться. Современное русское «не задерживайся» ясно и без архаизации передаёт этот смысл.
- source_word: καὶ
  choice: и
  rationale: Союз соединяет две части высказывания без необходимости усиливать временной оттенок.
- source_word: εἶπεν αὐτῷ
  choice: он сказал ему
  rationale: Стандартная повествовательная формула, близко соответствующая греческому выражению; субъект остаётся не назван по имени, как и в исходном тексте.
