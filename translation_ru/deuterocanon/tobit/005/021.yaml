  text: And Tobit said to her[a], “Do not worry, sister; he will return safe and sound, and your eyes will see him.”
translation:
  language: ru
  text: 'И сказал ей Товит: «Не тревожься, сестра[a]; он вернётся благополучно, и твои глаза увидят его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сестра» — буквальная форма обращения в греческом тексте. Здесь Товит обращается к своей жене; это семейно-супружеское обращение, а не указание на родство между братом и сестрой.
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ λόγον ἔχε
  choice: Не тревожься
  rationale: Греческое выражение буквально связано с «иметь слово/дело», но в данном контексте служит утешением встревоженной жене. «Не тревожься» естественно передаёт его смысл по-русски.
- source_word: ἀδελφή
  choice: сестра
  rationale: Сохранено буквальное обращение греческого текста, отражающее семейно-супружеское словоупотребление, а не указание на биологическое родство.
- source_word: ὑγιαίνων
  choice: здоровым
  rationale: Причастие означает пребывание в добром здоровье, целости и благополучии. В сочетании с глаголом движения творительный предикативный «здоровым» точно и естественно передаёт смысл.
- source_word: ἐλεύσεται
  choice: вернётся
  rationale: Сам глагол означает «придёт», однако в сцене речь идёт о возвращении сына из путешествия; «вернётся» ясно выражает подразумеваемое направление.
- source_word: οἱ ὀφθαλμοί σου ὄψονται αὐτόν
  choice: твои глаза увидят его
  rationale: Сохранён явный образ греческого текста, усиливающий эмоциональную выразительность обещания и естественно звучащий в торжественной современной русской речи.
