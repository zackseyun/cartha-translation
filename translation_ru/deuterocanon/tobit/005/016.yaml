translation:
  language: ru
  text: И я ещё прибавлю тебе к плате, если вы вернётесь здоровыми.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если вернётесь, будучи здоровыми». Греческий текст подчёркивает физическое благополучие путников при возвращении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι προσθήσω
  choice: ещё прибавлю
  rationale: Сочетание передаёт обещание добавить сверх условленной платы; «ещё прибавлю» естественно и близко греческой конструкции.
- source_word: σοι ἐπὶ τὸν μισθόν
  choice: тебе к плате
  rationale: σοι указывает на получателя, а ἐπὶ с винительным выражает добавление к уже назначенной плате. Единственное число «плата» соответствует μισθόν.
- source_word: ἐὰν
  choice: если
  rationale: Частица вводит условие, от которого зависит обещанная доплата.
- source_word: ὑγιαίνοντες
  choice: здоровыми
  rationale: Причастие означает пребывание в здоровом, благополучном телесном состоянии; перевод сохраняет прямое значение без расширения до общего «целыми и невредимыми».
- source_word: ἐπιστρέψητε
  choice: вы вернётесь
  rationale: В контексте путешествия глагол обозначает возвращение; форма второго лица множественного числа передана местоимением «вы».
