translation:
  language: ru
  text: 'Товия сказал ему[a]: «Подожди меня, и я скажу отцу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст краток: «Товия сказал ему: „Подожди меня, и я скажу отцу“». Параллельный текст семитской формы излагает сцену подробнее: Товия пошёл и рассказал отцу о найденном человеке, а затем вышел позвать его. Основной текст следует греческому источнику, а более полный вариант отмечен здесь.'
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπόμεινόν με
  choice: Подожди меня
  rationale: Аористный императив ὑπομένω в данном контексте означает просьбу остаться и подождать, пока Товия поговорит с отцом. Это естественная и точная современная русская формулировка.
- source_word: ἐρῶ
  choice: скажу
  rationale: Будущее время от λέγω буквально означает «скажу». Контекст подразумевает, что Товия сообщит отцу о найденном спутнике, однако краткое «скажу» сохраняет лаконичность и некоторую недосказанность греческого текста.
- source_word: τῷ πατρί
  choice: отцу
  rationale: Определённый артикль при обозначении родства указывает здесь на отца Товии. Русское «отцу» в прямой речи естественно передаёт смысл без обязательного добавления притяжательного местоимения.
- source_word: Τωβίας
  choice: Товия
  rationale: Форма «Товия» соответствует принятой русской библейской передаче семитского имени и различает сына Товию и его отца Товита.
