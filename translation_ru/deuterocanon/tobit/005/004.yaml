base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/005/004.yaml
  text: And he went to look for a man[a], and he found Raphael, who was an angel, but he did not know it.
translation:
  language: ru
  text: Он пошёл искать человека и нашёл Рафаила, который был ангелом, но Товия этого не знал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не знал»; из контекста ясно, что Товия не знал, что Рафаил — ангел.'
    reason: В греческом субъект и объект последнего глагола не выражены явно; примечание поясняет их контекстуальное восстановление в переводе.
lexical_decisions:
- source_word: ἐπορεύθη
  choice: пошёл
  rationale: Обычное повествовательное значение πορεύομαι; форма передаёт начало целенаправленного действия без излишней торжественности.
- source_word: ζητῆσαι
  choice: искать
  rationale: Инфинитив цели; современное и точное обозначение поиска подходящего человека.
- source_word: ἄνθρωπον
  choice: человека
  rationale: Прямое соответствие греческому ἄνθρωπον. В данном контексте речь идёт о спутнике, однако источник здесь употребляет общее слово «человек».
- source_word: εὗρεν
  choice: нашёл
  rationale: Прямой и естественный повествовательный эквивалент εὑρίσκω.
- source_word: Ῥαφαὴλ
  choice: Рафаила
  rationale: Традиционная русская форма имени в требуемом винительном падеже.
- source_word: ἄγγελος
  choice: ангелом
  rationale: Хотя ἄγγελος может означать также посланника, повествователь прямо раскрывает небесную природу Рафаила.
- source_word: οὐκ ᾔδει
  choice: Товия этого не знал
  rationale: В греческом субъект и дополнение подразумеваются. Имя Товии делает русскую фразу однозначной, а «этого» отсылает к только что раскрытой читателю природе Рафаила.
theological_decisions:
- issue: Значение ἄγγελος применительно к Рафаилу
  choice: ангел
  alternative: посланник
  rationale: В повествовательном мире книги Рафаил является небесным существом; вариант «посланник» неоправданно затемнил бы прямое авторское сообщение.
- issue: Кто не знал, что Рафаил был ангелом
  choice: Товия этого не знал
  alternative: но он этого не знал
  rationale: Греческий сохраняет подразумеваемым субъект предшествующего действия — Товию. Повтор имени предотвращает возможное в русском ошибочное отнесение местоимения к Рафаилу, не меняя смысла источника.
translation_notes:
  register: Современный литературный русский язык с простым и достойным повествовательным строем. Синтаксис близок к греческой последовательности действий, но имя Товии повторено ради ясности русского текста.
