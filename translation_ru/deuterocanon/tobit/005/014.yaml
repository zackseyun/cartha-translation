  yaml_path: translation/deuterocanon/tobit/005/014.yaml
  text: And he said to him[a], “May you come in health, brother; and do not be angry with me because I sought to learn your tribe and your family. And you indeed turn out to be my brother, from a good and noble lineage. For I knew Ananias and Jathan, the sons of Shemaiah the great, as we used to go together to Jerusalem to worship, bringing the firstborn and the tithes of the produce; and they were not led astray in the error of our brothers. You are from a good root[b], brother.”
translation:
  language: ru
  text: 'И он сказал ему: «Да придёшь ты в здравии, брат![a] Не сердись на меня за то, что я хотел узнать, из какого ты колена и рода. Ведь ты, оказывается, мой брат, из доброго и славного рода. Ибо я был знаком с Ананией и Иафаном, сыновьями великого Шемайи: мы вместе ходили в Иерусалим на поклонение, принося первенцев и десятины от урожая. Они не были увлечены заблуждением наших братьев.[b] Ты от доброго корня, брат».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иди в здравии». Греческое выражение буквально означает: «Да придёшь ты в здравии» и служит пожеланием благополучия.'
    reason: lexical_alternative
  - marker: b
    text: «Братья» здесь — соплеменники, израильтяне, а не обязательно родные братья мужского пола.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑγιαίνων ἔλθοις
  choice: Да придёшь ты в здравии
  rationale: Сохраняет форму пожелания и буквальный образ прихода в благополучии, хотя по-русски выражение намеренно звучит несколько торжественно; возможное идиоматическое значение пояснено в сноске.
- source_word: φυλήν ... πατριάν
  choice: колена и рода
  rationale: «Колено» передаёт принадлежность к израильскому племени, а «род» — более узкую семейно-родовую линию, сохраняя различие двух греческих терминов.
- source_word: τυγχάνεις ἀδελφός μου
  choice: ты, оказывается, мой брат
  rationale: «Оказывается» передаёт смысл обнаружившегося родства в τυγχάνεις, а «брат» сохраняет родственный язык оригинала.
- source_word: ἐκ τῆς καλῆς καὶ ἀγαθῆς γενεᾶς
  choice: из хорошего и благородного рода
  rationale: Передаёт положительную нравственно-социальную оценку происхождения, не сводя γενεά к временному «поколению».
- source_word: κοινῶς
  choice: вместе
  rationale: Естественно передаёт совместное паломничество.
- source_word: προσκυνεῖν
  choice: на поклонение
  rationale: В контексте паломничества в Иерусалим обозначает культовое поклонение, сохраняя при этом оттенок действия, ради которого шли.
- source_word: τὰ πρωτότοκα
  choice: первенцев
  rationale: Прямо сохраняет субстантивированное обозначение перворождённых, приносимых в рамках богослужения, не добавляя отсутствующего в тексте уточнения о животных.
- source_word: τὰς δεκάτας τῶν γενημάτων
  choice: десятины с урожая
  rationale: Естественная русская формулировка для десятых долей сельскохозяйственного произведения.
- source_word: οὐκ ἐπλανήθησαν ἐν τῇ πλάνῃ
  choice: не впали в заблуждение
  rationale: Сохраняет повторяющийся корневой смысл греческой конструкции в ясной современной форме.
- source_word: ἐκ ῥίζης καλῆς
  choice: от доброго корня
  rationale: Сохранена родословная метафора корня, значимая для характеристики происхождения.
theological_decisions:
- issue: Родословная и язык родства
  choice: Сохранены слова «брат», «колено», «род» и «корень».
  alternative: Передать всё обобщённо как «родственник» и «хорошая семья».
  rationale: Оригинал подчёркивает происхождение, общность Израиля и верность в поклонении; буквальные родственные образы сохраняют эту богословско-социальную ткань.
- issue: Заблуждение «наших братьев»
  choice: Оставлено без уточнения, в чём именно заключалось заблуждение.
  alternative: Пояснить его как отступничество, идолопоклонство или отказ от иерусалимского богослужения.
  rationale: Стих связывает заблуждение с поведением части соплеменников, но прямо не определяет его содержания; конкретизация устранила бы подлинную недосказанность текста.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя; родословные термины и метафора корня сохранены. Имена переданы в форме, отражающей греческие свидетельства и вероятную семитскую основу: Анания, Иафан, Шемайя.'
