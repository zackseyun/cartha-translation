base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/003.yaml
  text: I[a], Tobit, walked in the ways of truth and righteousness all the days of my life[b], and I did many acts of mercy for my brothers and for my people who went with me into the land of the Assyrians, to Nineveh.
translation:
  language: ru
  text: Я, Товит, всю жизнь ходил путями истины и праведности и совершил много дел милосердия для моих братьев[a] и моего народа, то есть для тех, кто вместе со мной отправился в землю ассирийцев, в Ниневию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «братьями» здесь, вероятно, имеются в виду не только родные братья, но и родичи или соплеменники Товита.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοῖς ἀληθείας ἐπορευόμην
  choice: ходил путями истины
  rationale: Сохраняется библейская метафора пути как образа нравственной жизни; русский оборот звучит естественно и торжественно.
- source_word: δικαιοσύνῃ
  choice: в праведности
  rationale: В контексте итоговой характеристики жизни речь идёт о нравственной и религиозной правоте, а не только о судебной или общественной справедливости.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς μου
  choice: всю жизнь
  rationale: Естественный современный русский эквивалент, полностью передающий временной охват греческого выражения.
- source_word: ἐλεημοσύνας πολλὰς ἐποίησα
  choice: совершал много дел милосердия
  rationale: ἐλεημοσύνη может означать как милостыню в узком смысле, так и дела милосердия шире; основной текст не сужает значение без необходимости.
- source_word: τοῖς ἀδελφοῖς μου
  choice: для моих братьев
  rationale: Сохраняется формальное значение мужского множественного числа, а вероятный широкий смысл — соплеменники или родичи — поясняется в сноске.
- source_word: τῷ ἔθνει
  choice: моего народа
  rationale: В контексте принадлежности Товита к Израилю «народ» естественнее русского «племя» или «нация» и передаёт этническую общность.
- source_word: τοῖς προπορευθεῖσιν μετʼ ἐμοῦ
  choice: которые вместе со мной отправились
  rationale: Передаётся совместное перемещение в Ассирию; буквальный оттенок предшествования у προπορευθεῖσιν грамматически заметен, но сочетание с μετʼ ἐμοῦ неоднозначно и при буквальной передаче создаёт неестественный русский оборот.
- source_word: εἰς χώραν Ἀσσυρίων εἰς Νινευή
  choice: в землю ассирийцев, в Ниневию
  rationale: Сохраняются оба указания места назначения и конкретизирующее отношение Ниневии к земле ассирийцев.
theological_decisions:
- issue: Значение δικαιοσύνη в нравственном самоописании Товита
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет целостный нравственно-религиозный смысл поведения перед Богом; «справедливость» могла бы неоправданно сузить его до общественно-правовой сферы.
- issue: Объём значения ἐλεημοσύνη
  choice: дела милосердия
  alternative: милостыня
  rationale: Греческое слово допускает конкретное значение раздачи милостыни, но также более широкое обозначение милосердных поступков. Контекст не требует однозначно ограничивать его денежной помощью.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Сохранена метафора «ходить путями», но громоздкое «во все дни моей жизни» передано естественным выражением «всю жизнь». Синтаксис сделан ясным без устранения смысловой широты ключевых греческих слов.
