  terminology: «Сеннахирим» — устоявшаяся русская форма имени; текстовая форма «Ахреил» надлежащим образом отмечена. «Иудея», «тела», «в гневе своём» соответствуют нейтральному литературному библейскому регистру. Сноска сохраняет неоднозначность формы имени, не выдавая контекстуальное отождествление за буквальное чтение Swete.
