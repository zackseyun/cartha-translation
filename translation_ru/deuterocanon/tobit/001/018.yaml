    text: В греческом тексте издания Swete здесь стоит «царь Ахреил» (Ἀχρειλ ὁ βασιλεύς); по контексту имеется в виду Сеннахирим.
    reason: textual_variant
lexical_decisions:
- source_word: καὶ εἴ τινα
  choice: И если… кого-нибудь
  rationale: Сохраняет условно-неопределённую конструкцию греческого текста; последующее множественное αὐτούς передано контекстуально как «убитых».
- source_word: Ἀχρειλ ὁ βασιλεύς
  choice: царь Сеннахирим
  rationale: По контексту речь идёт о Сеннахириме; необычная форма имени в данном греческом свидетеле отмечена в сноске.
- source_word: ὅτε ἦλθεν φεύγων ἐκ τῆς Ἰουδαίας
  choice: когда бежал из Иудеи
  rationale: Естественно передаёт сочетание глагола движения с причастием, не добавляя отсутствующего в источнике указания на возвращение.
- source_word: ἔθαψα αὐτοὺς κλέπτων
  choice: я тайно хоронил убитых
  rationale: κλέπτων здесь обозначает скрытное действие, а не кражу; «убитых» ясно передаёт местоимение αὐτούς и его контекстуальный референт.
- source_word: ἐν τῷ θυμῷ αὐτοῦ
  choice: в гневе своём
  rationale: Передаёт θυμός нейтрально и литературно, без усиления до «ярости».
- source_word: ἐξητήθη ὑπὸ τοῦ βασιλέως τὰ σώματα
  choice: царь велел искать тела
  rationale: Русская активная конструкция естественно выражает пассив и царскую инициативу; она допускает, что поиск осуществляли другие по его распоряжению.
- source_word: καὶ οὐχ εὑρέθη
  choice: но их не нашли
  rationale: Смысловое множественное согласование с τὰ σώματα передано по нормам русского языка; союз «но» естественно выражает результат, противопоставленный поиску.
theological_decisions:
- issue: Форма имени ассирийского царя
  choice: В основном тексте — «Сеннахирим», с указанием формы «Ахреил» в сноске.
  alternative: 'Передать буквально: «царь Ахреил».'
  rationale: Контекст повествования отождествляет царя с Сеннахиримом, однако необычная форма Ἀχρειλ в издании Swete является реальным текстовым фактом и потому сохраняется для прозрачности в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским достоинством. Синтаксис сделан естественным для широкого читателя; историко-текстовая неопределённость имени не скрыта.
