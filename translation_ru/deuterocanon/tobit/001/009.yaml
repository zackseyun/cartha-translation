revisions:
- from: Когда я стал взрослым, я взял в жёны Анну из рода нашего отца и от неё родил сына — Товию.
  to: Когда я стал мужчиной, я взял себе в жёны Анну из потомков нашего рода, и от неё у меня родился Товия.
  rationale: Исправлены русская грамматическая неестественность при передаче ἐγέννησα, необоснованная отсылка к конкретному «нашему отцу» и ненужное добавление «сына». «Из потомков нашего рода» передаёт происхождение Анны внутри родовой группы, не превращая αυτό в юридическое или конфессиональное утверждение.
