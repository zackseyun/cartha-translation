base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/009.yaml
  text: And when I became a man[a], I took Anna as my wife from the seed of our ancestral family[b], and by her I fathered Tobiah.
translation:
  language: ru
  text: Когда я стал мужчиной, я взял себе в жёны Анну из потомков нашего рода, и от неё у меня родился Товия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγενόμην ἀνήρ
  choice: стал взрослым
  rationale: Оборот обозначает достижение мужчиной зрелого возраста. По-русски «стал взрослым» естественно передаёт этап жизни, тогда как буквальное «стал мужчиной» может ошибочно восприниматься как указание на половую принадлежность или мужественность.
- source_word: ἔλαβον Ἄνναν γυναῖκα
  choice: взял в жёны Анну
  rationale: Сохраняет брачную идиому греческого текста и остаётся понятным и достойным выражением в современном русском языке.
- source_word: ἐκ τοῦ σπέρματος τῆς πατριᾶς ἡμῶν
  choice: из рода нашего отца
  rationale: σπέρμα здесь обозначает происхождение или потомство, а πατριά — родовую группу по отцовской линии. Русское «из рода нашего отца» естественно сохраняет эту патрилинейную направленность без неуместно буквального «из семени».
- source_word: ἐγέννησα ἐξ αὐτῆς
  choice: от неё родил сына
  rationale: Глагол имеет говорящего мужчину своим подлежащим и означает, что он стал отцом. Формулировка сохраняет его грамматическую перспективу; «сына» эксплицирует очевидный по мужскому имени объект, делая русскую фразу естественной.
- source_word: Τωβίαν
  choice: Товию
  rationale: Форма «Товия» непосредственно и узнаваемо передаёт греческое Τωβίας и соответствует русской библейской традиции имён; здесь употреблён винительный падеж.
theological_decisions:
- issue: Обозначение мужской зрелости
  choice: стал взрослым
  alternative: стал мужчиной
  rationale: Контекст говорит о достижении брачного возраста, а не формулирует учение о мужественности. Естественная русская идиома сохраняет смысл, не привнося дополнительного оттенка.
- issue: Брак внутри отцовского рода
  choice: из рода нашего отца
  alternative: из нашего рода
  rationale: Сохранено указание на отцовскую родовую линию, присутствующее в πατριά, но оно не расширено до правового или вероучительного утверждения, которого стих прямо не делает.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис близок к греческому повествованию, но устранены неестественные для русского буквальные кальки. Слово «сына» добавлено для ясности конструкции; референт и его мужской пол однозначно заданы именем Τωβίαν.
