  yaml_path: translation/deuterocanon/tobit/001/021.yaml
  text: And before fifty days had passed[a], his two sons killed him and fled to the mountains of Ararat. And Sacherdonos his son reigned in his place, and he appointed Achiacharos, the son of Anael, my brother's son[b], over all the accounts of his kingdom and over the whole administration.
translation:
  language: ru
  text: Не прошло и пятидесяти дней, как два его сына убили его и бежали в горы Арарата. Вместо него воцарился его сын Сахердонос[a]. Он поставил Ахиахароса[b], сына Анаила, сына моего брата, ведать всей отчётностью своего царства и всем управлением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сахердонос — греческая форма имени ассирийского царя, обычно передаваемого по-русски как Асархаддон.
    reason: lexical_alternative
  - marker: b
    text: Ахиахарос — греческая форма имени, также передаваемого как Ахикар.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ διῆλθον ἡμέραι πεντήκοντα ἕως οὗ
  choice: Не прошло и пятидесяти дней, как
  rationale: Естественная русская передача греческого оборота, подчёркивающая, что событие произошло менее чем через пятьдесят дней.
- source_word: ἀπέκτειναν
  choice: убили
  rationale: Прямое и нейтральное соответствие, не добавляющее правовой или нравственной квалификации, которой сам глагол здесь не выражает.
- source_word: ἔφυγον εἰς τὰ ὄρη Ἀραράθ
  choice: бежали в горы Арарата
  rationale: «Бежали» передаёт бегство после убийства; «горы Арарата» соответствует форме множественного числа в источнике.
- source_word: ἐβασίλευσεν ... ἀντʼ αὐτοῦ
  choice: Вместо него воцарился
  rationale: Передаёт как восшествие на престол, так и смену прежнего царя, сохраняя естественный русский синтаксис.
- source_word: ἔταξεν
  choice: поставил
  rationale: В административном контексте обозначает официальное назначение; это ясное и стилистически уместное библейское выражение.
- source_word: ἐπὶ πᾶσαν τὴν ἐκλογιστείαν
  choice: ведать всей отчётностью
  rationale: Редкое существительное связано с подсчётами и ведением счетов. «Отчётность» сохраняет финансово-административный смысл, не сужая его до одной казны.
- source_word: ἐπὶ πᾶσαν τὴν διοίκησιν
  choice: и всем управлением
  rationale: Передаёт более широкую сферу административного руководства, параллельную ведению отчётности.
- source_word: Σαχερδονός / Ἀχιάχαρον / Ἀναήλ
  choice: Сахердонос / Ахиахарос / Анаил
  rationale: Имена переданы по формам греческого источника, а не заменены более привычными историческими или иноязычными вариантами.
theological_decisions:
- issue: Формы имён, известных по другим библейским и историческим традициям
  choice: 'В основном тексте сохранены формы, отражающие греческий источник: Сахердонос и Ахиахарос.'
  alternative: Использовать традиционные формы Асархаддон и Ахикар.
  rationale: Такой выбор следует данному греческому свидетельству и не гармонизирует его без необходимости с иными текстовыми традициями.
- issue: Родственная связь Ахиахароса с рассказчиком
  choice: «Ахиахароса, сына Анаила, сына моего брата»
  alternative: «Ахиахароса, сына моего брата Анаила»
  rationale: Последовательность родительных форм в греческом тексте указывает, что Анаил — сын брата рассказчика, а Ахиахарос — сын Анаила. Альтернативная передача ошибочно сделала бы Анаила братом рассказчика.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Повтор союзов сокращён ради естественности русского текста, однако последовательность событий и административный параллелизм сохранены. Родословная оставлена в формально точной форме, хотя повтор слова «сын» несколько тяжеловесен, поскольку более плавная перефразировка могла бы ослабить точность родственной связи.
