    rationale: 'Греческое ἐν προστάγματι αἰωνίῳ непосредственно характеризует то, где это предписано: «в вечном установлении». Вариант без «в» допускает менее ясное орудийное прочтение.'
  - severity: low
    issue: Формулировка для προκουρίας
    rationale: «Первая шерсть со стрижки» несколько неуклюже и может обозначать не долю, а шерсть как материал. «Первая доля шерсти от стрижки» яснее передаёт вероятный смысл, оставляя его отмеченным в сноске.
