base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/006.yaml
  text: But I alone would often go to Jerusalem for the feasts[a], as it is written for all Israel in an everlasting ordinance[b], bringing the firstfruits and the tithes of the produce and the first shearings.
translation:
  language: ru
  text: Я же один часто ходил в Иерусалим на праздники, как предписано всему Израилю в вечном установлении, неся с собой начатки, десятины от урожая и первую долю шерсти от стрижки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Редкое греческое слово, переведённое как «первая доля шерсти от стрижки», вероятно, означает первую долю шерсти, полученной при стрижке скота; возможно и более широкое понимание: первые приношения от скотоводства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνος
  choice: я же один
  rationale: Передаёт подчёркнутое противопоставление личной верности Товита поведению остальных соплеменников; частица δέ отражена словом «же».
- source_word: ἐπορευόμην πλεονάκις
  choice: часто ходил
  rationale: Имперфект вместе с πλεονάκις обозначает неоднократное, привычное действие в прошлом; «ходил» естественно для регулярных паломничеств.
- source_word: ἐν Ἱεροσολύμοις ταῖς ἑορταῖς
  choice: в Иерусалим на праздники
  rationale: Хотя в греческом стоит ἐν, при глаголе движения контекст указывает на место назначения; русское «ходил в Иерусалим на праздники» передаёт это естественно.
- source_word: καθὼς γέγραπται
  choice: как предписано
  rationale: В данном правовом контексте формула указывает не просто на записанный текст, а на установленное Писанием требование; перевод сохраняет юридический смысл без лишнего уточнения.
- source_word: παντὶ τῷ Ἰσραήλ
  choice: всему Израилю
  rationale: Сохраняет собирательное обозначение всего народа и универсальность предписания.
- source_word: ἐν προστάγματι αἰωνίῳ
  choice: вечным установлением
  rationale: πρόσταγμα обозначает обязательное постановление, а αἰώνιος — его непреходящую, постоянно действующую силу в библейской правовой формуле.
- source_word: ἀπαρχάς
  choice: начатки
  rationale: Устоявшийся русский библейский термин для первых плодов, посвящаемых Богу.
- source_word: δεκάτας τῶν γενημάτων
  choice: десятины от урожая
  rationale: Передаёт как десятую долю, так и широкое значение γενήματα — сельскохозяйственные плоды, урожай.
- source_word: προκουρίας
  choice: первую шерсть со стрижки
  rationale: Редкое слово, вероятнее всего, обозначает первую долю шерсти, полученной при стрижке скота; формулировка понятна современному читателю и сохраняет предметный смысл.
- source_word: ἔχων
  choice: принося
  rationale: Причастие указывает, что Товит нёс перечисленные дары с собой в Иерусалим; «принося» естественно выражает их назначение как приношений.
theological_decisions:
- issue: Характер послушания Товита закону о праздниках и приношениях
  choice: Стих изображает Товита лично исполняющим конкретные предписания Израилю о паломничестве и приношениях в Иерусалиме.
  alternative: Понимать перечисление лишь как общее описание благочестия.
  rationale: Ссылка на письменное вечное установление и конкретный перечень приношений указывают на исполнение предписаний, а не только на общую набожность.
- issue: Значение αἰώνιος в правовой формуле
  choice: вечный
  alternative: непреложный; постоянный
  rationale: «Вечный» сохраняет традиционный библейский регистр и идею непреходящей силы установления, не добавляя философского определения длительности.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Термины «начатки», «десятины» и «вечное установление» сохраняют культово-правовой характер текста, оставаясь понятными обычному читателю. Неестественное буквальное «ходил в Иерусалиме» устранено по смыслу глагола движения.
