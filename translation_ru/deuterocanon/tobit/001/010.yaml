lexical_decisions:
- source_word: ᾐχμαλωτίσθημεν
  choice: нас увели в плен
  rationale: Пассивный аорист обозначает насильственное пленение и переселение; эта формулировка ясно передаёт оба оттенка и естественно звучит по-русски.
- source_word: εἰς Νινευή
  choice: в Ниневию
  rationale: Предлог εἰς при глаголе движения указывает на место назначения.
- source_word: πάντες οἱ ἀδελφοί μου
  choice: все мои братья
  rationale: Буквально и естественно передаёт ἀδελφοί, сохраняя различие с более широким кругом родства далее.
- source_word: οἱ ἐκ τοῦ γένους
  choice: родственники
  rationale: Передаёт принадлежность к роду или родственной группе, не привнося современных расовых коннотаций.
- source_word: ἤσθιον
  choice: ели
  rationale: Имперфект допускает длительное или обычное действие; русское прошедшее несовершенного вида сохраняет этот аспект.
- source_word: ἐκ τῶν ἄρτων τῶν ἐθνῶν
  choice: пищу язычников
  rationale: ἄρτοι буквально означает «хлебы», но здесь употреблено как обозначение пищи или съестных припасов; «язычников» передаёт религиозно-этническое противопоставление иудеев другим народам.
theological_decisions:
- issue: Религиозно-этническое значение ἐθνῶν
  choice: язычников
  alternative: народов / иноплеменников
  rationale: В контексте жизни Товита среди неиудеев слово обозначает людей из других народов также в религиозном отношении; «язычники» естественно передаёт этот смысл по-русски.
- issue: Следует ли прямо назвать пищу нечистой
  choice: Не добавлять слово «нечистую»
  alternative: нечистую пищу язычников
  rationale: В данном греческом предложении пища прямо не названа нечистой; такое пояснение преждевременно устранило бы подразумеваемый, но не выраженный смысл.
- issue: Передача буквального образа «хлебов»
  choice: пища язычников с буквальным вариантом в сноске
  alternative: хлеб язычников
  rationale: В основном тексте «пища» ясно передаёт идиоматический смысл, а сноска сохраняет доступ к буквальному образу и его неоднозначности.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно торжественным библейским регистром. Союз καί в начале передан не отдельным «и», а естественной временной конструкцией. Конечная точка с запятой заменена точкой как соответствующая русской пунктуации отдельного стиха.
