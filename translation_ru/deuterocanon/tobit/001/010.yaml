base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/010.yaml
  text: And when we were taken captive to Nineveh[a], all my brothers and those of my kindred ate from the bread of the Gentiles;
translation:
  language: ru
  text: Когда нас увели в плен в Ниневию, все мои братья и родственники ели пищу язычников[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлебы язычников»; это выражение может обозначать их пищу или съестные припасы.'
