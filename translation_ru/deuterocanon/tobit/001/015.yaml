  text: And when Enemessar died[a], Achreil his son became king in his place, and his roads became unsafe[b], and I was no longer able to go into Media.
translation:
  language: ru
  text: Когда Энемессар умер, вместо него воцарился его сын Ахреил[a], а его дороги стали небезопасными[b], и я уже не мог больше отправляться в Мидию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В использованном греческом тексте имена царей даны в формах «Энемессар» и «Ахреил»; в других текстовых традициях книги Товита встречаются иные написания, а иногда и другие имена.
    reason: textual_variant
  - marker: b
    text: Переведённый здесь как «стали небезопасными» греческий глагол труден и употреблён в необычной форме. Из контекста поездок следует, что дороги пришли в расстройство или стали ненадёжными, так что Товит больше не мог отправляться в Мидию.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανεν
  choice: умер
  rationale: Прямой и нейтральный повествовательный эквивалент греческого глагола.
- source_word: ἐβασίλευσεν
  choice: воцарился
  rationale: Аорист в контексте преемства обозначает вступление на престол, а не просто длительное царствование.
- source_word: ἀντʼ αὐτοῦ
  choice: вместо него
  rationale: Сохраняет формулу замещения и ясно указывает на преемство после смерти царя.
- source_word: αἱ ὁδοὶ αὐτοῦ
  choice: дороги при нём
  rationale: Контекст поездок требует буквального значения «дороги, пути»; оборот передаёт их связь с правлением нового царя, не утверждая личной собственности.
- source_word: ἠκαταστάτησαν
  choice: стали небезопасны
  rationale: Необычная и трудная форма по контексту указывает на расстройство или ненадёжность путей; перевод передаёт практическое препятствие для поездок, не утверждая полной непроходимости.
- source_word: οὐκέτι ἠδυνάσθην
  choice: я уже не мог
  rationale: Естественно передаёт прекращение прежней возможности.
- source_word: πορευθῆναι εἰς τὴν Μηδείαν
  choice: ездить в Мидию
  rationale: В данном контексте речь идёт о повторявшихся поездках Товита; «в Мидию» естественно передаёт направление.
