  text: But one of the men in Nineveh went and informed the king about me[a], that I was burying them; and I hid myself. Then, realizing that I was being sought to be put to death[b], I withdrew in fear.
translation:
  language: ru
  text: Но один из тех, кто был в Ниневии[a], пошёл и сообщил царю обо мне, что я хороню их. Тогда я спрятался. Узнав же, что меня разыскивают, чтобы предать смерти[b], я в страхе ушёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «один из жителей Ниневии». Буквально: «один из тех, кто в Ниневии».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «меня разыскивают, чтобы убить». Греческое выражение буквально ближе к: «меня разыскивают, чтобы я умер».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: пошёл
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу; личная форма естественно передаёт последовательность действий по-русски.
- source_word: εἷς τῶν ἐν Νινευὴ
  choice: один из тех, кто находился в Ниневии
  rationale: Сохраняет эллиптическое и достаточно широкое греческое выражение, не уточняя без необходимости, был ли этот человек постоянным жителем города.
- source_word: ὑπέδειξε
  choice: донёс
  rationale: В данном контексте глагол означает сообщение властителю сведений, изобличающих Товита; «донёс» естественно передаёт неблагоприятный для него характер сообщения.
- source_word: ὅτι θάπτω αὐτούς
  choice: что я хороню их
  rationale: Настоящее время θάπτω передаёт продолжающееся или повторяющееся действие и сохранено в придаточном изъяснительном.
- source_word: ἐκρύβην
  choice: я спрятался
  rationale: Форма передаёт непереходное или возвратное действие; «спрятался» ясно и естественно в повествовательном контексте.
- source_word: ἐπιγνοὺς
  choice: узнав
  rationale: Причастие обозначает получение достоверного понимания возникшей опасности; «узнав» хорошо связывает его с последующим уходом.
- source_word: ζητοῦμαι ἀποθανεῖν
  choice: меня разыскивают, чтобы предать смерти
  rationale: Сохранена пассивная направленность ζητοῦμαι и цель поисков, выраженная инфинитивом ἀποθανεῖν, без неестественной русской конструкции.
- source_word: φοβηθεὶς
  choice: в страхе
  rationale: Передаёт сопутствующее эмоциональное состояние и возможную причинную связь с уходом, не разворачивая причастие в отдельное пояснение.
- source_word: ἀνεχώρησα
  choice: я ушёл
  rationale: Нейтрально передаёт удаление ради безопасности и не усиливает глагол до «бежал», хотя контекст содержит реальную угрозу.
theological_decisions:
- issue: Характер реакции Товита на преследование
  choice: «я в страхе ушёл»
  alternative: «я в страхе бежал»
  rationale: Греческое ἀνεχώρησα обозначает уход или отступление и само по себе не требует более драматичного «бежал»; перевод сохраняет одновременно страх Товита и сдержанность исходного выражения.
- issue: Цель розыска Товита
  choice: «чтобы предать смерти»
  alternative: «чтобы убить меня»
  rationale: Выбранная формулировка сохраняет пассивный оттенок сжатой греческой конструкции ζητοῦμαι ἀποθανεῖν и не уточняет исполнителя казни.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для широкого читателя; при этом сохранены последовательность событий, сдержанная сила глагола ἀναχωρέω и сжатость конструкции, описывающей смертельную угрозу.
