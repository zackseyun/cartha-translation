  source_fidelity: 'Имперфекты последовательно переданы как привычные повторявшиеся действия. «Сынам Аарона», «сынам Левия», «десятая часть» и «вторая десятая часть» точно отражают греческие выражения. Однако «тратил вырученные деньги» вводит в основной текст слово «деньги», которого в греческом нет: αὐτά остаётся множественным числом и может охватывать проданное/вырученные средства без такого уточнения.'
  naturalness: Фраза «для жертвенника, из урожая» синтаксически разорвана и по-русски воспринимается как неясное обстоятельство при «отдавал». Перестановка «из урожая — для жертвенника» делает связь понятнее, сохраняя сжатость и некоторую неоднозначность греческой конструкции. «Расходовал их» после «продавал» естественно и не добавляет отсутствующего в оригинале обозначения денег.
  terminology: Термины «жертвенник», «священники», «сыны Аарона», «сыны Левия» и буквальные обозначения десятых долей удачны. Сноска к «второй десятой части» корректно отмечает возможность обращения в деньги; поэтому это не следует утверждать в основном тексте сильнее, чем позволяет греческий текст.
