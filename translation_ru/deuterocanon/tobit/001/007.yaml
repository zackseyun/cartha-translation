base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/007.yaml
  text: And I would give them to the priests[a], the sons of Aaron, for the altar, from the produce; I would give the tenth to the sons of Levi who minister in Jerusalem[b], and I would sell the second tenth and go and spend it in Jerusalem each year.
translation:
  language: ru
  text: И я отдавал их священникам, сынам Аарона, из урожая — для жертвенника; десятую часть[a] я отдавал сынам Левия, служившим в Иерусалиме, а вторую десятую часть продавал[b], затем шёл в Иерусалим и каждый год расходовал их там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, употребляя привычный библейский термин: «десятину» и «вторую десятину». По-гречески буквально: «десятую часть» и «вторую десятую часть».'
    reason: Лексическая альтернатива и пояснение культового термина.
  - marker: b
    text: Глагол, переведённый как «продавал», можно также понимать как обращение второй десятой части в деньги перед путешествием в Иерусалим, где затем расходовалось вырученное.
    reason: Сохранение допустимого контекстуального прочтения глагола.
lexical_decisions:
- source_word: ἐδίδουν
  choice: я отдавал
  rationale: Имперфект передаёт регулярно повторявшееся действие в прошлом; русская форма несовершенного вида естественно сохраняет этот оттенок.
- source_word: αὐτὰς
  choice: их
  rationale: Женское местоимение во множественном числе отсылает к названным ранее приношениям или долям; местоименная связь сохранена без поясняющей вставки.
- source_word: τοῖς ἱερεῦσιν τοῖς υἱοῖς Ἀαρών
  choice: священникам, сынам Аарона
  rationale: Сохранено явное приложение, называющее происхождение священников, без свёртывания в конфессионально окрашенный термин.
- source_word: πρὸς τὸ θυσιαστήριον τῶν γενημάτων
  choice: для жертвенника, из урожая
  rationale: Сжатая греческая конструкция передана с сохранением назначения приношения и его происхождения из сельскохозяйственных плодов.
- source_word: τὴν δεκάτην
  choice: десятую часть
  rationale: Это буквальное значение греческого выражения; привычный термин «десятина» отмечен в сноске.
- source_word: τοῖς υἱοῖς Λευεὶ
  choice: сынам Левия
  rationale: Сохранена явная форма греческого текста, хотя по смыслу речь идёт о левитах.
- source_word: τοῖς θεραπεύουσιν εἰς Ἱερουσαλήμ
  choice: служившим в Иерусалиме
  rationale: В культовом контексте θεραπεύω обозначает служение; причастие согласовано с повествованием о прошлом.
- source_word: τὴν δευτέραν δεκάτην
  choice: вторую десятую часть
  rationale: Сохранено буквальное выражение греческого текста без преждевременного отождествления с определённой системой десятин.
- source_word: ἀπεπρατιζόμην
  choice: продавал
  rationale: Глагол обозначает продажу или отчуждение посредством продажи; последующая трата в Иерусалиме подразумевает получение денег.
- source_word: ἐδαπάνων αὐτὰ
  choice: тратил вырученные деньги
  rationale: После упоминания продажи русский текст естественно называет подразумеваемые денежные средства; это делает последовательность действий ясной, не меняя её смысла.
- source_word: καθʼ ἕκαστον ἐνιαυτόν
  choice: каждый год
  rationale: Естественная и точная передача распределительного оборота.
theological_decisions:
- issue: Передача терминов, связанных с несколькими десятыми долями
  choice: В основном тексте сохранены буквальные выражения «десятая часть» и «вторая десятая часть».
  alternative: «десятина» и «вторая десятина»
  rationale: Буквальная форма сохраняет устройство греческого текста и не навязывает читателю заранее определённую классификацию установлений Торы; традиционная терминология указана в сноске.
- issue: Понимание ἀπεπρατιζόμην применительно ко второй десятой части
  choice: «продавал»
  alternative: «обращал в деньги»
  rationale: Продажа прямо соответствует значению глагола, тогда как контекст допускает понимание результата как обращения этой доли в деньги; эта смысловая возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сохраняет последовательность греческого повествования, но формы несовершенного вида естественно передают обычные ежегодные действия. Термины не перегружены поздней конфессиональной интерпретацией.
