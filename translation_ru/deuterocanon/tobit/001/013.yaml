lexical_decisions:
- source_word: ὁ ὕψιστος
  choice: Всевышний
  rationale: Сохраняет употреблённый в греческом тексте традиционный божественный титул, не заменяя его общим словом «Бог».
- source_word: χάριν
  choice: благосклонность
  rationale: В придворном контексте речь идёт о благоприятном отношении правителя; «благосклонность» точнее по контексту, чем богословски нагруженная «благодать».
- source_word: μορφήν
  choice: благообразие
  rationale: μορφή прежде всего обозначает облик или наружный вид. «Благообразие» естественно передаёт подразумеваемую здесь положительную оценку, не превращая внешний облик в отвлечённое «положение».
- source_word: ἐνώπιον
  choice: перед
  rationale: Кратко и естественно передаёт нахождение и благоприятное восприятие в присутствии царя.
- source_word: Ἐνεμεσσάρου
  choice: Енемессаром
  rationale: Транслитерирует форму имени данного греческого свидетеля, не гармонизируя её с более известным именем Салманасара.
- source_word: ἀγοραστής
  choice: закупщиком
  rationale: Обозначает человека, который покупает необходимое; в русском «закупщик» сохраняет буквальную основу слова и одновременно допускает служебную функцию при дворе.
theological_decisions:
- issue: Божественный титул ὁ ὕψιστος
  choice: Всевышний
  alternative: Бог; Высочайший
  rationale: «Всевышний» сохраняет титульный характер греческого выражения и соответствует укоренившемуся библейскому употреблению.
- issue: Значение μορφήν в придворном контексте
  choice: благообразие
  alternative: хорошее положение; достойный вид; облик
  rationale: Греческое слово непосредственно относится к форме или внешнему облику. Контекст допускает более широкую придворную оценку, но её не следует молча подставлять вместо основного лексического значения; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Благообразие» несколько возвышенно, но понятно и позволяет сохранить предметное значение μορφή, тогда как «хорошее положение» чрезмерно истолковывает контекст. Порядок сносок приведён к последовательному [a], [b].
