lexical_decisions:
- source_word: καθότι
  choice: потому что
  rationale: Союз вводит причину сказанного ранее; «потому что» ясно передаёт причинное значение.
- source_word: ἐμεμνήμην
  choice: я помнил
  rationale: Форма μιμνῄσκομαι обозначает сохраняемую память и осознанную обращённость к Богу; несовершенный вид по-русски естественно выражает устойчивое состояние.
- source_word: τοῦ θεοῦ
  choice: о Боге
  rationale: Греческий родительный падеж управляется глаголом памяти; русская идиома требует предложного сочетания «помнить о ком».
- source_word: ἐν ὅλῃ τῇ ψυχῇ μου
  choice: всей душой
  rationale: Это естественное русское выражение точно сохраняет полноту внутренней преданности и передаёт ψυχή словом «душа».
theological_decisions:
- issue: Антропологическое значение ψυχή
  choice: душа
  alternative: всё существо
  rationale: «Душа» сохраняет библейскую антропологическую лексику, не навязывая более узкого технического понимания; выражение указывает на всецелую внутреннюю преданность.
translation_notes:
