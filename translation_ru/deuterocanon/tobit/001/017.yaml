  yaml_path: translation/deuterocanon/tobit/001/017.yaml
  text: I gave my bread to the hungry and clothing to the naked[a], and if I saw any of my kin dead and thrown behind the wall of Nineveh, I buried him.
translation:
  language: ru
  text: Я отдавал свой хлеб голодным и одежду нагим, а если видел кого-нибудь из моего рода умершим и брошенным за стеной Ниневии[a], то хоронил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вне стены Ниневии». Буквально по-гречески: «позади стены Ниневии»; возможно, речь идёт о телах, выброшенных за городскую стену.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς ἄρτους μου
  choice: свой хлеб
  rationale: Форма множественного числа буквально означает «мои хлебы/буханки», однако русское собирательное «хлеб» естественно в контексте помощи нуждающимся; возвратное «свой» ясно сохраняет принадлежность говорящему.
- source_word: ἐδίδουν
  choice: отдавал
  rationale: Имперфект выражает обычное, повторявшееся действие; русское несовершенное прошедшее «отдавал» передаёт это непосредственно.
- source_word: τοῖς πεινῶσιν
  choice: голодным
  rationale: Субстантивированное причастие естественно и кратко передаётся субстантивированным прилагательным.
- source_word: ἱμάτια
  choice: одежду
  rationale: Современное обобщающее слово, точно обозначающее предметы одежды без излишней книжности.
- source_word: τοῖς γυμνοῖς
  choice: нагим
  rationale: Прямой эквивалент, сохраняющий параллелизм благотворительных дел; в контексте может подразумевать людей без достаточной одежды.
- source_word: ἐκ τοῦ γένους μου
  choice: из моих родичей
  rationale: «Родичи» сохраняет широту γένος между близкой семьёй и более обширным кругом соплеменников, не сводя значение лишь к домашним родственникам.
- source_word: ἐθεώρουν
  choice: видел
  rationale: Несовершенный вид в конструкции «если видел» естественно передаёт повторяющиеся случаи.
- source_word: τεθνηκότα
  choice: умершим
  rationale: Сохраняет отнесённость определения к человеку и не подменяет его выражением «труп».
- source_word: ἐρριμμένον
  choice: брошенным
  rationale: Передаёт состояние тела, которое бросили и оставили, сохраняя оттенок унижения.
- source_word: ὀπίσω τοῦ τείχους Νινευή
  choice: за стеной Ниневии
  rationale: 'Русское «за стеной» близко греческому «позади стены» и сохраняет пространственную неоднозначность: место могло находиться с внешней стороны городской стены.'
- source_word: ἔθαπτον αὐτόν
  choice: хоронил его
  rationale: Несовершенный вид точно передаёт обычное действие, совершавшееся всякий раз при таком случае.
theological_decisions:
- issue: Объём значения γένος μου
  choice: «из моих родичей» — родственная или этнически родственная группа без строгого сужения
  alternative: «из моей семьи» или «из моего народа»
  rationale: Греческое γένος допускает как семейное, так и более широкое родовое или этническое понимание; перевод не должен без основания выбирать лишь одно.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Несовершенный вид глаголов сохраняет повторяемость описанных дел. Формулировка «за стеной» естественна по-русски и не устраняет неоднозначность греческого пространственного выражения.
