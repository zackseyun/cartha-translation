  text: I used to go to Media[a], and I deposited ten talents of silver with Gabael, the brother of Gabri[c][b], in Rages of Media.
translation:
  language: ru
  text: Я ездил в Мидию[a] и оставил на хранение[b] Гаваилу, брату Гаврии, в Рагах Мидийских десять талантов серебра.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «Я отправился в Мидию». Греческий имперфект может описывать как повторявшиеся поездки, так и действие в его прошлом течении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «доверил». Греческий глагол означает передачу чего-либо на попечение другому; здесь речь идёт о серебре.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορευόμην
  choice: я ездил
  rationale: Имперфект передаёт действие в прошлом как продолжавшееся или повторявшееся; русское «ездил» естественно допускает значение неоднократных поездок, не исключая общего описания прошлого.
- source_word: παρεθέμην
  choice: оставил на хранение
  rationale: В контексте серебра глагол означает передачу имущества на попечение другому лицу. Такая формулировка сохраняет смысл доверительного хранения и не привносит современную банковскую терминологию.
- source_word: ἀργυρίου
  choice: серебра
  rationale: Греческий текст прямо называет серебро; буквальное обозначение металла сохраняет древнюю денежно-весовую реалию.
- source_word: τάλαντα δέκα
  choice: десять талантов
  rationale: Талант — древняя крупная мера веса и стоимости. Традиционный термин точнее пересчёта в современные деньги.
- source_word: Γαβηλῷ
  choice: Гаваилу
  rationale: Выбрана укоренившаяся в русской библейской традиции форма имени, соответствующая греческому Γαβήλ/Γαβαήλ в данном контексте.
- source_word: τῷ ἀδελφῷ Γαβρίᾳ
  choice: брату Гаврии
  rationale: 'Сохраняется прямое значение родства: Гаваил назван братом Гаврии.'
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: в Рагах Мидийских
  rationale: Передано название города Раги и его принадлежность к области Мидия; форма естественна для современного литературного русского языка.
