base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/011.yaml
  text: But I kept watch over myself so as not to eat[b][a],
translation:
  language: ru
  text: Я же воздержался от еды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «я сохранил (оберегал) себя, не есть». Здесь «душа» — идиоматическое обозначение самого человека. Сохранившийся греческий текст в этом месте краток, и мысль продолжается в следующем стихе.'
    reason: lexical_alternative;textual_variant
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: Я же
  rationale: δέ обозначает мягкое противопоставление поведению окружающих; русская конструкция «я же» естественно передаёт этот контраст.
- source_word: συνετήρησα
  choice: удержался
  rationale: В сочетании с τὴν ψυχήν μου и отрицательным инфинитивом глагол выражает осознанное самоограничение. «Удержался» естественно передаёт смысл, не превращая образное выражение в учение о составе человека.
- source_word: τὴν ψυχήν μου
  choice: себя (передано возвратной формой «удержался»)
  rationale: Буквально — «мою душу», но здесь ψυχή употреблено идиоматически и обозначает самого говорящего.
- source_word: μὴ φαγεῖν
  choice: и не стал есть
  rationale: Отрицательный инфинитив указывает, в чём состояло самоограничение. Сочинительная конструкция звучит по-русски естественно и сохраняет незавершённость мысли, продолжающейся далее.
theological_decisions:
- issue: Антропологическое значение ψυχή в выражении τὴν ψυχήν μου
  choice: Идиоматическое обозначение самого говорящего
  alternative: Буквальное «мою душу»
  rationale: Контекст говорит о сознательном воздержании от пищи, а не формулирует учение о различии души и тела. Идиоматический перевод не привносит отсутствующего в тексте богословского утверждения.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная повествовательная формулировка. «Я же» сохраняет личное противопоставление, а «удержался» естественно выражает самоконтроль.
