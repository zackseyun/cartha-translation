  rationale: В сочетании ἐν τῇ χώρᾳ μου слово обозначает родную страну; последующее «в земле Израиля» уточняет её название.
- source_word: νεωτέρου μου ὄντος
  choice: будучи молодым
  rationale: Естественно передаёт генитив абсолютный, указывающий на возраст Товита в описываемое время.
- source_word: ἀπέστη
  choice: отступило
  rationale: Передаёт религиозное и культовое отпадение, не превращая выражение в позднейший технический богословский термин.
- source_word: τοῦ Νεφθαλεὶμ τοῦ πατρός μου
  choice: моего предка Неффалима
  rationale: πατήρ здесь естественно понимать как родоначальника колена; «предок» устраняет ошибочное впечатление, будто Неффалим был непосредственным отцом рассказчика.
- source_word: οἶκος Ἱεροσολύμων
  choice: дом Иерусалима
  rationale: Сохраняет необычное буквальное выражение и не смешивает его с последующим ναός, прямо названным храмом.
- source_word: ἐκλεγείσης
  choice: избранного
  rationale: Сохраняет пассивное значение и согласуется с ближайшим выражением «дом Иерусалима», понимаемым как святилище.
- source_word: εἰς τὸ θυσιάζειν πάσαις ταῖς φυλαῖς
  choice: чтобы все колена приносили там жертвы
  rationale: Ясно передаёт цель избрания центрального святилища; «там» выражает подразумеваемое место действия.
- source_word: ναός
  choice: храм
  rationale: Обычный и точный русский эквивалент в данном контексте.
- source_word: κατασκήνωσις
  choice: обитель
  rationale: Передаёт мысль о месте пребывания Бога, не вызывая нежелательной ассоциации исключительно со скинией.
- source_word: ὑψίστου
  choice: Всевышнего
  rationale: Устоявшаяся русская передача божественного титула.
- source_word: ἡγιάσθη
  choice: был освящён
  rationale: Точно выражает отделение храма как святого места и сохраняет аористное повествование.
- source_word: ᾠκοδομήθη
  choice: построен
  rationale: Сохраняет прямое архитектурное значение глагола.
- source_word: εἰς πάσας
  choice: на все поколения
  rationale: Греческая строка обрывается после формы женского рода множественного числа; дополнение «поколения» даёт связный смысл, но отмечено как текстуально обусловленное восполнение.
theological_decisions:
- issue: Отступление колена Неффалима от иерусалимского богослужения
  choice: отступило
  alternative: отпало; отошло; восстало
  rationale: Формулировка сохраняет серьёзность культового и заветного отступления, не навязывая более узкого позднего значения.
- issue: Избрание Иерусалима как места жертвоприношений
  choice: избранного из всех колен Израиля, чтобы все колена приносили там жертвы
  alternative: избранного среди всех колен Израиля для жертвоприношений всех колен
  rationale: Передаёт избрание центрального места богослужения и сохраняет различие между источником избрания «из всех колен» и назначением «для всех колен».
- issue: Обитель Всевышнего
  choice: храм — обитель Всевышнего
  alternative: храм скинии Всевышнего
  rationale: Сохраняет богословскую мысль о Божьем пребывании, не отождествляя храм со скинией и не устраняя трудность греческого сочетания.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Необычное «дом Иерусалима» сохранено ради различия с «храмом» и пояснено в примечании. «Неффалим» передан в традиционной русской библейской форме; πατήρ контекстуально переведено как «предок».
