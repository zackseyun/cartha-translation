base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/004.yaml
  text: And when I was in my own country[a], in the land of Israel, while I was still young, the whole tribe of my father Naphtali fell away from the house of Jerusalem, which had been chosen from all the tribes of Israel for all the tribes to sacrifice there; and the temple, the dwelling place of the Most High[c][b], was consecrated and built for all generations.
translation:
  language: ru
  text: И когда я был в своей стране[a], в земле Израиля, в юности, всё колено Неффалима, моего праотца, отступило от дома Иерусалима, избранного из всех колен Израиля, чтобы все колена приносили там жертвы; а храм, обитель Всевышнего[c], был освящён и построен на все поколения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте «дом Иерусалима» отличается от последующего слова «храм»: первое выражение, вероятно, шире обозначает иерусалимское святилище, а второе прямо называет храм.'
    reason: lexical_alternative
  - marker: b
    text: 'Конец греческой строки текстуально труден: она обрывается словами «на все» (εἰς πάσας). Слово «поколения» восполнено по смыслу; более пространная текстовая традиция книги поддерживает указание на непрерывность из поколения в поколение.'
    reason: textual_variant
  - marker: c
    text: Кумранские фрагменты книги Товита в целом чаще согласуются с более пространной греческой традицией, однако данный перевод стиха основан на греческом тексте издания Суита.
    reason: cross_reference
lexical_decisions:
- source_word: χώρα
