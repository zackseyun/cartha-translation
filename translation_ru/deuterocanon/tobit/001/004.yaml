revisions:
- from: И когда я ещё жил в своей стране[a], в земле Израиля, будучи молодым, всё колено моего предка Неффалима отступило от дома Иерусалима, избранного из всех колен Израиля, чтобы все колена приносили там жертвы. Храм — обитель Всевышнего[c] — был освящён и построен на все поколения[b].
  to: И когда я был в своей стране[a], в земле Израиля, в юности, всё колено Неффалима, моего праотца, отступило от дома Иерусалима, избранного из всех колен Израиля, чтобы все колена приносили там жертвы; а храм, обитель Всевышнего[c], был освящён и построен на все поколения[b].
  rationale: Убраны не подтверждённые греческим текстом «ещё жил» и связанное с ними дополнительное значение. «Неффалим, мой праотец» точнее передаёт племенно-генеалогический смысл τοῦ Νεφθαλεὶμ τοῦ πατρός μου. Знак перед заключительной частью приведён ближе к греческому сочленению двух аористных сказуемых; текстуальную неопределённость заключительных слов по-прежнему явно фиксирует сноска b.
