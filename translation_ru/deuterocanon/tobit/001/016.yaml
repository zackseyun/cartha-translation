    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις
  choice: во дни
  rationale: Сохраняет греческий временной оборот и соответствует достоинству библейского повествования; выражение понятно современному русскому читателю.
- source_word: Ἐνεμεσσάρου
  choice: Енемессара
  rationale: Имя передано транслитерацией с восстановлением формы именительного падежа Енемессар; в тексте употреблён требуемый родительный падеж.
- source_word: ἐλεημοσύνας πολλὰς
  choice: много дел милосердия
  rationale: Передаёт множественное число и широкий смысл конкретных милосердных поступков, не сужая значение только до денежной милостыни.
- source_word: ἐποίουν
  choice: я совершал
  rationale: Несовершенный вид естественно передаёт имперфект, указывая на повторявшуюся или продолжительную деятельность; глагол хорошо сочетается с выражением «дела милосердия».
- source_word: τοῖς ἀδελφοῖς μου
  choice: для моих братьев
  rationale: Сохраняет буквальный родственный образ греческого текста и передаёт дательный как указание на тех, кому оказывалась помощь.
theological_decisions:
- issue: Объём значения ἀδελφοῖς μου
  choice: моих братьев
  alternative: моих соплеменников; моих собратьев-израильтян
  rationale: 'Основной текст сохраняет буквальное «братьев», не разрешая неоднозначность: слово может обозначать как родных братьев, так и более широкий круг родственников или соплеменников.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Оборот «во дни» сохранён как естественный для Писания; остальная фраза избегает архаизмов. Маркеры сносок расположены непосредственно после выражения, которое они поясняют.
