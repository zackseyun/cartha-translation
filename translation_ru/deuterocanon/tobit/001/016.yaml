translation:
  language: ru
  text: И во дни Енемессара я совершал много дел милосердия[a] для моих братьев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «много милостыни»; греческое слово может обозначать конкретные дела милосердия, особенно помощь нуждающимся.'
