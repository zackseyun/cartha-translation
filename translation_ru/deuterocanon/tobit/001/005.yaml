base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/005.yaml
  text: and all the tribes that had apostatized were sacrificing to Baal the heifer[a], including the house of my father[b], Naphtali.
translation:
  language: ru
  text: И все колена, сообща отпавшие, приносили жертвы Ваалу-телице[a], в том числе и дом Неффалима, дом моего отца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ваалу-телёнку». Греческое слово означает молодую корову, тёлку. Это наименование, вероятно, связано с бычьим культовым образом северного Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Концовка греческой фразы сжата; буквально: «и дом Неффалима моего отца». По смыслу среди участвовавших был и род, к которому принадлежал Товит.'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶσαι αἱ φυλαί
  choice: все колена
  rationale: В историческом контексте речь идёт о коленах Израиля; «колена» — естественный и традиционно понятный русский эквивалент.
- source_word: αἱ συναποστᾶσαι
  choice: отпавшие вместе с другими
  rationale: Причастие обозначает совместное отпадение; контекст жертвоприношения Ваалу придаёт ему религиозный смысл. Формулировка сохраняет значение приставки συν- и не вводит тяжёлый термин «апостасия».
- source_word: ἔθυον
  choice: приносили жертвы
  rationale: Имперфект передаёт продолжительное или обычное действие в прошлом; русский несовершенный вид это сохраняет.
- source_word: τῇ Βάαλ
  choice: Ваалу
  rationale: Дательный падеж после θύω обозначает божество, которому приносится жертва.
- source_word: τῇ δαμάλει
  choice: телице
  rationale: δαμάλις обозначает молодую корову, тёлку; русское «телица» точно передаёт женский род и культовый образ, не подменяя его более общим «телёнок».
- source_word: ὁ οἶκος Νεφθαλεὶμ τοῦ πατρός μου
  choice: в том числе и дом Неффалима, моего отца
  rationale: Греческая концовка синтаксически сжата и присоединяет собственный род Товита к отпавшим коленам. «В том числе» естественно выражает включение, а приложение сохраняет формальную неоднозначность связи Νεφθαλεὶμ и τοῦ πατρός μου.
theological_decisions:
- issue: Религиозный смысл συναποστᾶσαι
  choice: отпавшие вместе с другими
  alternative: отступившие; впавшие в отступничество
  rationale: Последующее жертвоприношение Ваалу показывает религиозное, заветное отпадение. Выбранная формулировка передаёт это без добавления конфессионально нагруженной терминологии.
- issue: Соотношение Βάαλ и δαμάλει
  choice: Ваалу-телице
  alternative: Ваалу, телице; Ваалу-телёнку
  rationale: Одинаковые артикли и дательный падеж допускают чтение δαμάλει как приложения к Βάαλ. Дефис сохраняет тесную связь наименования с бычьим культовым образом, не разъясняя сверх текста его точную природу.
- issue: Сжатая генеалогическая концовка
  choice: дом Неффалима, моего отца
  alternative: дом моего отца из колена Неффалима
  rationale: Основной текст следует греческой конструкции настолько близко, насколько позволяет русский язык, а примечание сообщает более ясный контекстуальный смысл, не выдавая его за единственно возможный синтаксический разбор.
translation_notes:
  register: Современный литературный русский с умеренно библейской лексикой («колена», «приносили жертвы»). Синтаксис сделан ясным, но неоднозначность культового наименования и сжатой генеалогической конструкции сохранена в основном тексте и примечаниях.
