  source_fidelity: 'Основная мысль передана верно: все отпавшие колена совершали жертвоприношения Ваалу, и к ним относился род Товита. Однако «отпавшие вместе с другими» неудачно передаёт συν-: при подлежащем «все ... колена» оборот создаёт неопределённое и логически неловкое противопоставление «другим». В конце «Неффалима, моего отца» по-русски воспринимается как имя отца Товита, тогда как греческая сжатая конструкция скорее относит отцовский дом к Неффалиму/колену Неффалима и не должна так однозначно истолковываться.'
