base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/008.yaml
  text: And the third I would give to those to whom it was due[a], just as Deborah, my father's mother, commanded[c][b], because I was left an orphan by my father.
translation:
  language: ru
  text: А третью долю[a] я отдавал тем, кому она полагалась, как велела Деввора, мать моего отца[b], потому что я остался без отца[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «третью»; существительное, например «долю» или «часть», подразумевается из контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть бабушка по отцу. Греческий текст буквально говорит: «мать моего отца».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «я был оставлен сиротой моим отцом». Эта необычная греческая формулировка означает, что он лишился отца; вероятно, после его смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν τρίτην
  choice: третью долю
  rationale: Субстантивированное прилагательное женского рода указывает на третью часть из контекста, однако само существительное в греческом не выражено. «Третью долю» естественно передаёт смысл по-русски, а примечание сохраняет эллиптичность оригинала.
- source_word: ἐδίδουν
  choice: я отдавал
  rationale: Имперфект обозначает обычное, неоднократное действие в прошлом; русская форма несовершенного вида естественно передаёт этот оттенок.
- source_word: οἷς καθήκει
  choice: тем, кому она полагалась
  rationale: καθήκει выражает подобающее, надлежащее или причитающееся. Формулировка не уточняет сверх текста, на каком именно основании доля полагалась получателям.
- source_word: καθὼς ἐνετείλατο
  choice: как велела
  rationale: Глагол передаёт распоряжение или повеление; «велела» сохраняет его силу и естественно звучит в семейном контексте.
- source_word: Δεββώρα
  choice: Деввора
  rationale: Использована традиционная русская библейская передача имени, соответствующая греческой форме Δεββώρα.
- source_word: ἡ μήτηρ τοῦ πατρός μου
  choice: мать моего отца
  rationale: Сохранено конкретное родственное обозначение греческого текста вместо сглаживающего «моя бабушка».
- source_word: διότι
  choice: потому что
  rationale: Союз прямо вводит причину того, почему Деввора наставляла Товита.
- source_word: ὀρφανὸς κατελείφθην ὑπὸ τοῦ πατρός μου
  choice: отец оставил меня сиротой
  rationale: Формулировка близко сохраняет необычную конструкцию оригинала и не добавляет прямо отсутствующее слово «умер», хотя в контексте речь, вероятно, идёт об утрате отца.
