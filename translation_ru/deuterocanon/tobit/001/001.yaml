base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/001.yaml
  text: The book of the words of Tobit son of Tobiel[a], son of Ananiel, son of Aduel, son of Gabael, from the seed of Asiel, from the tribe of Naphtali[b],
translation:
  language: ru
  text: Книга слов[a] Товита, сына Товиила, сына Ананиила, сына Адуила, сына Гаваила[b], из рода Асиила, из племени Неффалима,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Книга слов» — формула, похожая на заглавие; по смыслу возможно также: «Запись» или «Повествование».'
    reason: lexical_alternative
  - marker: b
    text: Греческая форма имени в этом месте неясна. В рукописях и позднейших традициях встречаются формы, близкие к «Гавиил» и «Вагаваил».
    reason: alternative_reading
lexical_decisions:
- source_word: ΒΙΒΛΟΣ λόγων
  choice: Книга слов
  rationale: Сохраняет формальную, имеющую семитский оттенок заглавную формулу греческого текста. Более свободное «повествование» было бы естественнее, но скрыло бы структуру оригинала.
- source_word: Τωβείτ
  choice: Товит
  rationale: Традиционная русская форма имени, соответствующая греческому Τωβείτ.
- source_word: τοῦ Τωβιὴλ τοῦ Ἀνανιὴλ τοῦ Ἀδουὴλ τοῦ ΒαΓαβαήλ
  choice: сына Товиила, сына Ананиила, сына Адуила, сына Гаваила
  rationale: Последовательные родительные падежи поняты как родословная цепь и для ясности переданы с повторением слова «сына». Имена оформлены в традиционной русской библейской транслитерации; трудная форма ΒαΓαβαήλ нормализована как «Гаваил» с примечанием.
- source_word: ἐκ τοῦ σπέρματος Ἀσιήλ
  choice: из рода Асиила
  rationale: σπέρμα буквально означает «семя», но здесь обозначает происхождение или род. «Из рода» естественно по-русски и сохраняет генеалогический смысл.
- source_word: ἐκ τῆς φυλῆς Νεφθαλείμ
  choice: из племени Неффалима
  rationale: φυλή в контексте израильской родословной означает «племя»; «Неффалим» — принятая русская библейская форма имени.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством формального родословного заглавия. Генитивная цепь раскрыта словом «сына», а буквальное «из семени» передано естественным выражением «из рода». Конечная запятая сохранена, поскольку стих синтаксически продолжается далее.
