base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/022.yaml
  text: And Ahiacharus interceded for me[a], and I came to Nineveh. Now Ahiacharus was the cupbearer, keeper of the signet ring, administrator, and accountant, and Sacherdonos appointed him second in rank. He was my cousin.
translation:
  language: ru
  text: И Ахиахар ходатайствовал за меня, и я пришёл в Ниневию. Ахиахар был виночерпием, хранителем царского перстня-печати, управляющим и счетоводом, и Сахердонос назначил его вторым по положению[a]. Он был моим двоюродным братом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст здесь необычен и буквально читается приблизительно как «сын от второй»; выражение текстуально неясно. По контексту его обычно понимают в том смысле, что Ахиахар занимал второе по положению место, непосредственно после царя.
    reason: textual_variant
lexical_decisions:
- source_word: ἠξίωσεν ... περὶ ἐμοῦ
  choice: ходатайствовал за меня
  rationale: В данном повествовательном и придворном контексте оборот обозначает заступничество или обращение в пользу Товита. «Ходатайствовал за меня» естественно передаёт этот смысл, не уточняя не названную в тексте юридическую процедуру.
- source_word: ἦλθον εἰς Νινευήν
  choice: я пришёл в Ниневию
  rationale: Передаёт обычное значение ἔρχομαι и сохраняет форму повествования от первого лица; «вернулся» добавляло бы смысл, прямо не выраженный в этой фразе.
- source_word: οἰνοχόος
  choice: виночерпий
  rationale: Традиционное и точное русское название придворного, подававшего царю вино.
- source_word: ἐπὶ τοῦ δακτυλίου
  choice: хранитель царского перстня-печати
  rationale: Буквально «над перстнем»; в придворно-административном контексте имеется в виду должностная ответственность за царский перстень, служивший печатью. Слово «царского» выводится из контекста двора и делает функцию понятной.
- source_word: διοικητής
  choice: управляющий
  rationale: Обозначает человека, ведающего управлением делами; русский эквивалент достаточно широк и не приписывает ему более узкой должности правителя области.
- source_word: ἐκλογιστής
  choice: счетовод
  rationale: Слово связано с подсчётами и ведением расчётов. «Счетовод» передаёт придворно-финансовую функцию и стилистически согласуется с древним повествованием.
- source_word: κατέστησεν αὐτὸν
  choice: назначил его
  rationale: В контексте придворных должностей καθίστημι означает поставление или назначение на положение.
- source_word: υἱὸς ἐκ δευτέρας
  choice: вторым по положению
  rationale: Греческая формулировка в данной редакции необычна и текстуально трудна. Основной текст передаёт принятое контекстуальное понимание высокого положения Ахиахара, а буквальная форма и её неопределённость отмечены в сноске.
- source_word: ἐξάδελφός μου
  choice: моим двоюродным братом
  rationale: ἐξάδελφος обозначает двоюродного родственника; мужской род позволяет естественно и точно перевести «двоюродный брат».
