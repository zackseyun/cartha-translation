  text: And all my possessions were plundered[a], and nothing was left to me except Anna my wife and Tobit my son.
translation:
  language: ru
  text: И всё моё имущество было разграблено, и ничего у меня не осталось, кроме жены моей Анны и сына моего Товита.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Смысл в том, что после разграбления имущества рядом с Товитом остались только жена и сын; жена и сын не называются его собственностью.
    reason: Предотвращение возможного неверного понимания греческой конструкции.
lexical_decisions:
- source_word: διηρπάγη
  choice: было разграблено
  rationale: Пассивная форма передаёт насильственное расхищение имущества; «было разграблено» естественно и точно выражает изъятие добычи.
- source_word: πάντα τὰ ὑπάρχοντά μου
  choice: всё моё имущество
  rationale: Субстантивированное выражение обозначает совокупность материального достояния, а πάντα подчёркивает полноту утраты.
- source_word: οὐ κατελείφθη μοι οὐδέν
  choice: ничего у меня не осталось
  rationale: Естественная русская конструкция сохраняет отрицание и подчёркнутую полноту потери.
- source_word: πλὴν
  choice: кроме
  rationale: Предлог ясно вводит единственное исключение из сказанного о том, что осталось при Товите.
- source_word: Ἄννας
  choice: Анны
  rationale: Передаёт греческую форму имени Ἄννα в привычном русском виде и в требуемом родительном падеже.
- source_word: Τωβεὶτ
  choice: Товита
  rationale: Форма «Товит» непосредственно соответствует греческому Τωβεὶτ и согласуется с русским названием книги; здесь употреблён родительный падеж.
theological_decisions:
- issue: Отнесение жены и сына к «имуществу»
  choice: Сохранить греческий синтаксис, но пояснить его смысл сноской
  alternative: Перестроить фразу так, чтобы жена и сын были полностью отделены от упоминания имущества
  rationale: Оригинал говорит, что после разграбления имущества у рассказчика не осталось никого или ничего, кроме жены и сына; это не означает, что они считались его собственностью. Сноска сохраняет форму и устраняет возможное ложное прочтение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Порядок «жены моей… и сына моего…» слегка возвышенный, но понятный и сохраняет ритм исходного текста.
