base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/001/002.yaml
  text: who was taken captive in the days of Enemessaros king of the Assyrians[a], from Thisbe, which is to the south of Kedesh of Naphtali in Galilee[b], above Asher.
translation:
  language: ru
  text: который был взят в плен во дни Енемессара, царя ассирийцев[a], из Фисвы, находящейся справа от Кидиоса Неффалимова, в Галилее, выше Асира[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Енемессара иногда отождествляют с ассирийским царём Салманасаром, однако в греческом тексте здесь стоит форма «Енемессар».
    reason: alternative_reading
  - marker: b
    text: Географические названия и ориентиры в этом стихе не вполне ясны. Кидиос иногда отождествляют с другим известным местом; выражения «справа от» и «выше Асира» переведены сравнительно буквально, без замены на предположительные стороны света.
    reason: cultural_note
lexical_decisions:
- source_word: ᾐχμαλωτεύθη
  choice: был взят в плен
  rationale: Пассивная форма передаёт насильственное пленение; перевод ясен и точнее, чем более широкое «был изгнан».
- source_word: ἐν ἡμέραις
  choice: во дни
  rationale: Сохраняет обычную библейскую временную формулу греческого текста и естественно звучит в литературном русском.
- source_word: Ἐνεμεσσαάρου
  choice: Енемессара
  rationale: Передаёт засвидетельствованную в греческом тексте форму имени, не отождествляя её безоговорочно с более известным именем Салманасара.
- source_word: ἐκ Θίσβης
  choice: из Фисвы
  rationale: Предлог ἐκ обозначает происхождение; «из Фисвы» точно передаёт географическую связь.
- source_word: ἐκ δεξιῶν
  choice: справа от
  rationale: Буквально сохраняет пространственное выражение источника, не превращая его в предположительное направление «к югу от».
- source_word: Κυδίως
  choice: Кидиоса
  rationale: Неясный топоним передан транслитерацией греческой формы, без недоказанного отождествления с Кедесом.
- source_word: τῆς Νεφθαλεὶμ
  choice: Неффалимова
  rationale: Притяжательная форма естественно передаёт родительный падеж и связь места с областью колена Неффалима.
- source_word: ἐν τῇ Γαλειλαίᾳ
  choice: в Галилее
  rationale: Стандартная и ясная передача географического названия.
- source_word: ὑπεράνω Ἀσήρ
  choice: выше Асира
  rationale: Сохраняет пространственную неопределённость ὑπεράνω и не заменяет её более толковательным «к северу от».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис сохраняет форму придаточного продолжения («который»), соответствующую греческому ὃς. Неясные географические указания оставлены открытыми, а имена переданы в привычной для русской библейской традиции форме.
