  yaml_path: translation/deuterocanon/tobit/002/013.yaml
  text: But when she came to me[a], she began to cry out, and I said to her, “Where is the young goat from? Is it stolen? Give it back to its owners, for it is not lawful to eat what is stolen.”
translation:
  language: ru
  text: 'Когда она пришла ко мне, раздался крик[a], и я сказал ей: «Откуда этот козлёнок? Не украден ли он? Верни его хозяевам, потому что нельзя есть краденое».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте буквально: «начал кричать»; субъект глагола не назван. По контексту это может быть козлёнок, но возможно и понимание: «она начала кричать».'
    reason: source_ambiguity
lexical_decisions:
- source_word: ὅτε δὲ ἦλθεν πρὸς μέ
  choice: Когда она подошла ко мне
  rationale: Глагольная форма не называет субъекта, но контекст указывает на женщину, пришедшую к Товиту; «подошла» естественно передаёт движение к говорящему.
- source_word: ἤρξατο κράζειν
  choice: козлёнок начал кричать
  rationale: Конструкция обозначает начало громкого крика. В повествовательном контексте наиболее вероятный субъект — козлёнок, однако в греческом он прямо не назван; эта неоднозначность отмечена в сноске.
- source_word: Πόθεν τὸ ἔριφον;
  choice: Откуда этот козлёнок?
  rationale: πόθεν спрашивает об источнике или происхождении, а ἔριφον обозначает молодую козу; «козлёнок» — ясное и естественное современное русское соответствие.
- source_word: μὴ κλεμμάιον ἐστίν;
  choice: Не украден ли он?
  rationale: Вопрос с μή выражает подозрение или опасение. Русская конструкция «не ... ли» сохраняет этот оттенок, не превращая вопрос в категорическое обвинение.
- source_word: ἀπόδος αὐτὸ τοῖς κυρίοις
  choice: Верни его хозяевам
  rationale: ἀπόδος требует возвратить, а κύριοι в данном контексте — владельцы животного. «Хозяевам» звучит естественно и не несёт богословского значения слова «Господь».
- source_word: οὐ γὰρ θεμιτὸν ἐστιν φαγεῖν κλεψιμαῖον
  choice: потому что нельзя есть краденое
  rationale: θεμιτόν выражает морально-нормативную допустимость. «Нельзя» естественно передаёт запрет в современной русской речи, а «краденое» сохраняет обобщённость греческого выражения.
theological_decisions:
- issue: Морально-правовая сила θεμιτόν
  choice: потому что нельзя есть краденое
  alternative: потому что не дозволено есть краденое
  rationale: Формулировка сохраняет нравственный запрет, но не связывает его с какой-либо поздней конфессиональной системой права.
- issue: Неназванный субъект ἤρξατο κράζειν
  choice: козлёнок начал кричать
  alternative: она начала кричать
  rationale: Греческий текст грамматически не называет субъекта, но контекст и естественная последовательность рассказа позволяют понимать крик как голос козлёнка, благодаря которому Товит узнал о нём. Подлинная неоднозначность указана в сноске.
translation_notes:
  register: Современный литературный русский язык; речь Товита передана просто и достойно. Использованы общеупотребительные «козлёнок», «хозяева» и «краденое», без архаизации и конфессионально окрашенной терминологии.
