base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/008.yaml
  text: And the neighbors were mocking[a], saying, “He is no longer afraid of being put to death over this matter; he ran away, and look, he is burying the dead again.”
translation:
  language: ru
  text: 'А соседи насмехались[a], говоря: «Он уже не боится, что его убьют за это дело. Он убежал — и вот, снова хоронит мёртвых».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В других текстовых традициях книги Товита это место существенно отличается. В косвенном еврейском обратном переводе здесь Анна говорит, что милосердие и праведные дела Товита не помогли ему в бедствии и позоре; насмешки соседей над погребением мёртвых там не упоминаются.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ πλησίον
  choice: соседи
  rationale: Субстантивированное прилагательное во множественном числе обозначает людей, живущих или находящихся рядом; в данном контексте естественно передаётся словом «соседи».
- source_word: ἐνέγελων
  choice: насмехались
  rationale: Имперфект выражает продолжительное или повторяющееся осмеяние; «насмехались» сохраняет и характер действия, и его несовершенный вид.
- source_word: Οὐκέτι φοβεῖται
  choice: уже не боится
  rationale: Сочетание настоящего времени с οὐκέτι прямо указывает, что прежний страх прекратился.
- source_word: φονευθῆναι
  choice: что его убьют
  rationale: Страдательный инфинитив означает быть убитым. Формулировка не уточняет сверх греческого текста, идёт ли речь о судебной казни или ином убийстве.
- source_word: περὶ τοῦ πράγματος τούτου
  choice: за это дело
  rationale: Здесь πρᾶγμα означает дело или поступок, а περί передаёт основание грозящего убийства; русское «за это дело» звучит естественно и сохраняет причинный оттенок.
- source_word: ἀπέδρα
  choice: убежал
  rationale: Аорист отсылает к прежнему бегству Товита. «Убежал» передаёт действие прямо и подходит к насмешливой реплике соседей.
- source_word: καὶ ἰδοὺ
  choice: и вот
  rationale: Частица ἰδού привлекает внимание к происходящему; «и вот» естественно для современного литературного русского и сохраняет выразительность.
- source_word: πάλιν
  choice: снова
  rationale: Прямо передаёт повторение действия.
- source_word: θάπτει τοὺς νεκρούς
  choice: хоронит мёртвых
  rationale: Настоящее время после «и вот» представляет действие как происходящее перед глазами или вновь совершаемое; русский несовершенный вид это сохраняет.
theological_decisions:
- issue: Соотношение греческого текста и существенно отличающейся семитской традиции
  choice: 'Основной текст следует греческому свидетельству: соседи насмехаются над Товитом из-за того, что он вновь хоронит мёртвых.'
  alternative: Косвенный еврейский обратный перевод содержит слова Анны о том, что милосердие и праведные дела Товита не помогли ему во время бедствия и позора.
  rationale: Предоставленный греческий текст является основным и высоконадёжным источником. Еврейский текст Нойбауэра — поздний обратный перевод с арамейской рукописи, а не древнее еврейское свидетельство, поэтому он не может заменить греческое чтение, но его существенное отличие следует отметить в сноске.
translation_notes:
  register: Современный литературный русский язык; прямая речь передаёт насмешливый тон без архаизации. Формулировка «что его убьют» сохраняет широту греческого φονευθῆναι и не навязывает более узкое понимание как официальной казни.
