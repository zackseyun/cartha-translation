base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/006.yaml
  text: And I remembered the prophecy of Amos[a], as he said, “Your festivals will be turned into mourning, and all your rejoicing into lamentation.” And I wept.
translation:
  language: ru
  text: 'И вспомнил я пророчество Амоса[a], как он сказал: «Ваши праздники обратятся в скорбь, и всё ваше ликование — в плач». И я заплакал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эти слова перекликаются с Ам 8:10 в традиции Септуагинты.
    reason: cross_reference
lexical_decisions:
- source_word: ἐμνήσθην
  choice: вспомнил я
  rationale: Аорист формы с пассивным окончанием имеет здесь активное значение. Инверсия сохраняет достоинство повествовательной речи, не делая её архаичной.
- source_word: προφητείας
  choice: пророчество
  rationale: Единственное число указывает на вспоминаемое пророческое изречение Амоса; обычный русский библейский термин точно передаёт смысл.
- source_word: Στραφήσονται
  choice: обратятся
  rationale: Передаёт будущую перемену состояния и сохраняет возвышенный пророческий регистр, не уточняя прямо деятеля этой перемены.
- source_word: ἑορταὶ
  choice: праздники
  rationale: Обозначает общинные праздничные торжества и в современном русском звучит естественнее, чем более узкое «пиры».
- source_word: πένθος
  choice: скорбь
  rationale: Передаёт состояние и проявление траура в контексте пророческого переворота от праздника к горю.
- source_word: εὐφροσύναι
  choice: ликование
  rationale: Собирательное «всё ваше ликование» естественно передаёт множественное число выражений и поводов для радости, сохраняя возвышенный тон.
- source_word: θρῆνον
  choice: плач
  rationale: Передаёт открытое выражение скорби и звучит естественно; более специальное «причитание» могло бы неоправданно сузить значение.
- source_word: ἔκλαυσα
  choice: я заплакал
  rationale: Простой аорист обозначает наступившее действие; «заплакал» естественно передаёт его как реакцию на вспомнившиеся слова.
theological_decisions:
- issue: Передача встроенной цитаты из Амоса
  choice: 'Сохранить прямую пророческую речь во втором лице множественного числа: «Ваши праздники обратятся в скорбь, и всё ваше ликование — в плач»'
  alternative: Передать менее формально либо приблизить формулировку к еврейскому тексту Ам 8:10, где упомянуты песни
  rationale: Греческий текст прямо вводит пророчество и цитирует его. Перевод следует данной греческой форме, включая εὐφροσύναι («ликование»), не подменяя её чтением масоретской традиции и не называя явно того, кто произведёт перемену.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Инверсия «вспомнил я» поддерживает повествовательный ритм; тире во второй части цитаты естественно обозначает подразумеваемое сказуемое.
