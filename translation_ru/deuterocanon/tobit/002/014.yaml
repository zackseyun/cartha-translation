  yaml_path: translation/deuterocanon/tobit/002/014.yaml
  text: But she said[a], “It was given to me as a gift in addition to my wages.” But I did not believe her, and I told her to give it back to its owners; and I was embarrassed before her. Then she answered and said to me, “Where are your acts of mercy and your righteous deeds? Behold[d][c][b], everything about you is known.”
translation:
  language: ru
  text: 'Она же сказала: «Его дали мне в подарок вдобавок к моей плате[a]». Но я не поверил ей и велел вернуть его хозяевам[b]; и мне стало стыдно перед ней[c]. Тогда она ответила мне: «Где твои дела милосердия и праведные поступки[d]? Вот, всё о тебе известно[e]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вместе с моей платой» или «как часть моей платы». Греческое выражение связывает подарок с заработком; по контексту Анна, вероятнее всего, говорит о подарке сверх обычной платы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «господам»; здесь имеются в виду хозяева спорной вещи.'
    reason: lexical_alternative
  - marker: c
    text: Греческий глагол буквально означает, что человек краснеет; здесь речь идёт о стыде или смущении.
    reason: lexical_alternative
  - marker: d
    text: 'Или: «твои милостыни и дела праведности». Оба греческих существительных стоят во множественном числе и указывают на конкретные дела.'
    reason: lexical_alternative
  - marker: e
    text: 'Греческая фраза кратка и допускает также перевод: «Вот, всё при тебе явно». Она не уточняет, кому именно всё известно.'
    reason: ambiguity
lexical_decisions:
- source_word: Δῶρον
  choice: в подарок
  rationale: Передаёт обычное значение существительного «дар, подарок» и естественно звучит в объяснении происхождения спорной вещи.
- source_word: ἐπὶ τῷ μισθῷ
  choice: сверх платы
  rationale: Передаёт наиболее вероятный контекстуальный смысл добавочного дара, связанного с заработком, не скрывая в сноске возможности иных оттенков.
- source_word: οὐκ ἐπίστευον αὐτῇ
  choice: я не поверил ей
  rationale: Естественная русская передача повествовательного имперфекта; первое лицо определяется ближайшим контекстом и последующим μοι.
- source_word: ἀποδιδόναι αὐτὸ τοῖς κυρίοις
  choice: вернуть его хозяевам
  rationale: ἀποδιδόναι означает возвратить, а κύριοι в данном хозяйственном контексте — людей, которым принадлежит спорная вещь, а не «господ» в богословском смысле.
- source_word: ἠρυθρίων πρὸς αὐτήν
  choice: мне стало стыдно перед ней
  rationale: Глагол буквально связан с покраснением, но здесь естественно выражает переживание стыда или смущения перед Анной.
- source_word: ἐλεημοσύναι
  choice: дела милосердия
  rationale: Сохраняет этическое значение милосердных дел; возможный более узкий смысл раздачи милостыни указан в сноске.
- source_word: δικαιοσύναι
  choice: праведные поступки
  rationale: Греческое множественное число указывает здесь на конкретные проявления праведности, а не только на отвлечённое качество.
- source_word: ἰδοὺ γνωστὰ πάντα μετὰ σοῦ
  choice: Вот, всё о тебе известно
  rationale: Сохраняет краткость и неоднозначность сжатой греческой фразы, не уточняя без основания, кому именно и в каком смысле всё известно.
theological_decisions:
- issue: Значение множественного δικαιοσύναι в нравственном контексте
  choice: праведные поступки
  alternative: дела праведности
  rationale: Форма множественного числа обозначает конкретные дела, однако перевод сохраняет религиозно-нравственный смысл праведности и не превращает фразу в утверждение о статусе оправдания.
- issue: Сила заключительного упрёка Анны
  choice: Вот, всё о тебе известно
  alternative: Вот, всё при тебе явно
  rationale: Греческая фраза допускает разные понимания того, что именно стало явным. Выбранный перевод сохраняет резкость упрёка, но не определяет его как исключительно человеческий позор, Божий суд или доказательство бесплодности благочестия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; частица «вот» передаёт ἰδού без архаического «се». Лексика избегает ненужной конфессиональной окраски и сохраняет резкий, но неоднозначный упрёк Анны.
