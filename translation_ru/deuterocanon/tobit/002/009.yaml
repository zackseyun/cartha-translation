  text: And on that very night[a], after I had gone out and buried him, I lay down to sleep in a defiled state beside the wall of the courtyard, and my face was uncovered.
translation:
  language: ru
  text: В ту самую ночь, похоронив его, я вернулся и лёг спать у стены двора, будучи нечистым[a], с непокрытым лицом.
  philosophy: optimal-equivalence
  footnotes:
