  naturalness: Текст звучит современно и литературно. Оборот «с непокрытым лицом» естественнее, чем отдельное «лицо моё оставалось непокрытым», и точнее передаёт описательное состояние без добавочного значения.
  terminology: «Нечистым» вместе со сноской корректно обозначает ритуальную, а не нравственную нечистоту. «Двор» и «у стены двора» естественны и соответствуют αὐλή.
