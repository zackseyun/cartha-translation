    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ τῇ νυκτί
  choice: в ту же ночь
  rationale: Сочетание указательного местоимения с усилительной конструкцией подчёркивает, что действие произошло именно в эту ночь; «в ту же ночь» естественно передаёт это по-русски.
- source_word: ἀνέλυσα
  choice: я вернулся
  rationale: В данном повествовательном контексте глагол естественно понимать как возвращение после погребения. Сам по себе он допускает более общее значение ухода или отбытия, поэтому это контекстуальный, а не безусловный выбор.
- source_word: θάψας
  choice: похоронив его
  rationale: Аористное причастие обозначает действие, предшествующее возвращению. Дополнение «его» восстанавливается из ближайшего контекста.
- source_word: ἐκοιμήθην
  choice: лёг спать
  rationale: Форма глагола может обозначать сон или укладывание спать; описание места и открытого лица поддерживает конкретное значение «лёг спать».
- source_word: μεμιαμμένος
  choice: будучи нечистым
  rationale: Перфектное причастие описывает сохранявшееся после погребения состояние нечистоты. Сноска уточняет обрядовый, а не нравственный характер выражения.
- source_word: παρὰ τὸν τοῖχον τῆς αὐλῆς
  choice: у стены двора
  rationale: Краткая и естественная пространственная формулировка, сохраняющая домашнюю обстановку исходного текста.
- source_word: τὸ πρόσωπόν μου ἀκάλυπτον ἦν
  choice: лицо моё оставалось непокрытым
  rationale: Греческий текст прямо говорит о лице, а не о голове. «Оставалось» естественно описывает состояние во время сна и подготавливает последующее событие.
theological_decisions:
- issue: Нечистота после участия в погребении
  choice: будучи нечистым
  alternative: будучи осквернённым
  rationale: Контекст указывает на обрядовую нечистоту, а не на нравственную вину. Основной текст сохраняет традиционный библейский термин, а сноска предотвращает его этическое переосмысление.
