base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/001.yaml
  text: When I had come down to my house[a], and Anna my wife and Tobiah my son were restored to me, on the feast of Pentecost, which is the holy feast of seven weeks, a fine meal was prepared for me[c][b], and I reclined to eat.
translation:
  language: ru
  text: Когда же я спустился к себе домой и мне вернули мою жену Анну и моего сына Товию, в праздник Пятидесятницы, то есть священный праздник семи недель, для меня приготовили прекрасную трапезу[a], и я возлёг, чтобы поесть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В параллельной семитской традиции этот стих пространнее: Товия послан пригласить к трапезе бедного сородича. В переведённом здесь кратком греческом тексте этого эпизода нет.'
    reason: textual_variant
  - marker: b
    text: В древности за праздничной трапезой обычно не сидели, а возлежали.
    reason: cultural_note
lexical_decisions:
- source_word: κατῆλθον εἰς τὸν οἶκόν μου
  choice: я спустился к себе домой
  rationale: Сохраняет направительное значение κατέρχομαι («спускаться») и естественно передаёт возвращение в собственный дом.
- source_word: ἀπεδόθη μοι
  choice: мне вернули
  rationale: Пассивная форма означает «было возвращено мне»; русская неопределённо-личная конструкция естественна и не вводит не названного в греческом тексте деятеля.
- source_word: Τωβίας
  choice: Товия
  rationale: Форма имени передаёт греческое Τωβίας с учётом его семитского происхождения и избегает латинизированной формы «Товит/Тобиас» для сына.
- source_word: ἐν τῇ πεντηκοστῇ ἑορτῇ
  choice: в праздник Пятидесятницы
  rationale: Передаёт греческое название праздника, а последующее пояснение сохраняет его иудейское содержание как праздника семи недель.
- source_word: ᾗ ἐστιν ἁγία ἑπτὰ ἑβδομάδων
  choice: то есть священный праздник семи недель
  rationale: Греческая фраза шероховата, но явно поясняет Пятидесятницу через семь недель; слово «праздник» восполнено по ближайшему контексту ради ясного русского синтаксиса.
- source_word: ἐγενήθη ἄριστον καλὸν μοι
  choice: для меня приготовили прекрасную трапезу
  rationale: Идиоматически передаёт буквальное «для меня состоялась/получилась хорошая дневная трапеза», не утрачивая положительной оценки καλόν.
- source_word: ἀνέπεσα τοῦ φαγεῖν
  choice: я возлёг, чтобы поесть
  rationale: Сохраняет древний обычай возлежать за столом и целевое значение инфинитива «чтобы поесть».
theological_decisions:
- issue: Название и характер праздника πεντηκοστή
  choice: праздник Пятидесятницы, то есть священный праздник семи недель
  alternative: праздник Недель
  rationale: Сохранено собственно греческое наименование «Пятидесятница» вместе с авторским пояснением, чтобы не затемнять его иудейский праздничный контекст.
- issue: Расширение стиха в параллельной семитской традиции
  choice: Переведён краткий греческий текст без добавления отправки Товии за бедным родственником
  alternative: Включить более пространное повествование семитской традиции
  rationale: Основным источником является указанный греческий текст; отсутствующий в нём материал не следует вносить в основной перевод, но он отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Трапеза» и «возлёг» уместно сохраняют историко-культурный колорит; синтаксис остаётся понятным современному читателю. Все сноски обозначены в основном тексте.
