  naturalness: Фраза в целом естественна, но «сделанное» — добавленное, слишком неопределённое дополнение. «Работу» яснее связывает действие с контекстом и остаётся нейтральным. «Заплатили ей плату» в современной литературной речи звучит естественно.
  terminology: «Хозяевам» допустимо для κυρίοις в данном бытовом контексте; примечание надлежащим образом сохраняет варианты «господам» и «владельцам». «Плата» точно передаёт μισθός и избегает возможного у «заработка» оттенка общего дохода.
