  text: And she would send it to the owners[a], and they also paid her wages, adding a young goat.
translation:
  language: ru
  text: Она отсылала работу хозяевам[a], и они заплатили ей плату, дав сверх того ещё и козлёнка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «господам», «владельцам». Греческое слово κυρίοις здесь обозначает тех, для кого она работала.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστελλεν
  choice: отсылала
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие; несовершенный вид сохраняет эту аспектуальную окраску.
- source_word: τοῖς κυρίοις
  choice: хозяевам
  rationale: Во множественном числе и в данном трудовом контексте слово обозначает людей, для которых выполнялась работа; «хозяевам» естественно передаёт отношение без богословского оттенка.
- source_word: ἀπέδωκαν
  choice: выплачивали
  rationale: В сочетании с μισθόν глагол означает выдачу причитающейся платы; несовершенный вид согласует фразу с повторяющимся характером работы, хотя греческая форма сама по себе аористная.
- source_word: τὸν μισθόν
  choice: заработок
  rationale: Слово обозначает вознаграждение за труд; «заработок» звучит естественно в повествовании и ясно указывает на заработанную плату.
- source_word: προσδόντες
  choice: добавив к нему
  rationale: Причастие выражает дополнительный дар сверх платы; перевод сохраняет его добавочное значение.
- source_word: ἔριφον
  choice: козлёнка
  rationale: ἔριφος обозначает молодую козу; «козлёнок» — точный и обычный русский эквивалент.
theological_decisions:
- issue: Значение κυρίοις вне богословского контекста
  choice: хозяевам
  alternative: господам; владельцам; нанимателям
  rationale: Здесь речь идёт о людях, заказывавших или принимавших выполненную работу, а не о божественном титуле. «Хозяевам» сохраняет основное значение слова и подходит бытовому контексту; примечание отмечает возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Не выраженное в греческом объектное дополнение передано словом «сделанное», чтобы фраза была естественной и сохраняла связь с работой, упомянутой в контексте.
