translation:
  language: ru
  text: И я заплакал. Когда солнце зашло, я пошёл и, выкопав[a], похоронил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст буквально: «выкопав, похоронил его»; что именно было выкопано, прямо не указано.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαυσα
  choice: я заплакал
  rationale: Аорист κλαίω обозначает плач; «заплакал» естественно передаёт начало и факт действия в русском повествовании, не превращая его в формальный траур.
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: когда зашло солнце
  rationale: Оборот прямо указывает на наступивший закат и естественно передаётся устойчивым русским выражением.
- source_word: ᾠχόμην
  choice: я пошёл
  rationale: Глагол означает уход или отправление; нейтральное «пошёл» соответствует повествовательному контексту без излишней книжности.
- source_word: ὀρύξας
  choice: выкопав могилу
  rationale: Причастие буквально означает «выкопав», а предмет действия подразумевается последующим погребением; в русском для ясности естественно назвать могилу, отметив это в сноске.
- source_word: ἔθαψα αὐτόν
  choice: похоронил его
  rationale: Прямой и общепонятный эквивалент θάπτω, сохраняющий мужской объект αὐτόν.
