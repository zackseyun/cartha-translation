base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/005.yaml
  text: And when I returned[b][a], I washed myself and ate my bread in sorrow.
translation:
  language: ru
  text: Вернувшись, я омылся[a] и ел свой хлеб[b] в скорби.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст буквально говорит: «омылся». По контексту, вероятно, имеется в виду омовение после соприкосновения с умершим; в параллельной семитской традиции связь с ритуальной чистотой выражена яснее.'
    reason: cultural_note
  - marker: b
    text: 'Или: «свою трапезу» или «свою пищу». Греческое «хлеб» может обозначать пищу в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψας
  choice: Вернувшись
  rationale: Аористное причастие обозначает действие, предшествующее основным глаголам; деепричастие естественно и точно передаёт последовательность.
- source_word: ἐλουσάμην
  choice: я омылся
  rationale: Средний залог указывает на омовение самого себя. «Омылся» сохраняет возможный контекст ритуальной чистоты, не добавляя прямо не выраженного значения «очистился».
- source_word: ἤσθιον
  choice: ел
  rationale: Имперфект передан прошедшим временем несовершенного вида, что сохраняет видовое значение греческой формы и естественно звучит в повествовании.
- source_word: τὸν ἄρτον μου
  choice: свой хлеб
  rationale: ἄρτος буквально означает «хлеб», но может обозначать пищу или трапезу вообще. Конкретный образ сохранён в основном тексте.
- source_word: ἐν λύπῃ
  choice: в скорби
  rationale: λύπη обозначает скорбь, печаль или душевную боль; «в скорби» сохраняет форму и достоинство исходного выражения.
theological_decisions:
- issue: Следует ли прямо назвать омовение ритуальным очищением
  choice: В основном тексте оставлено «омылся» без добавления «для очищения».
  alternative: «очистился» или «совершил очистительное омовение»
  rationale: Контекст погребения и параллельная семитская традиция указывают на связь с нечистотой от мёртвого тела, однако греческий текст прямо говорит лишь об омовении. Перевод не устраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Омылся» выбрано вместо разговорного «помылся», а «в скорби» — как точное и естественное выражение глубокого горя.
