base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/003.yaml
  text: And he came and said[a], “Father, one of our own people has been strangled and thrown down in the marketplace.”
translation:
  language: ru
  text: 'И он пришёл и сказал: «Отец, один из нашего народа[a] задушен и брошен на площади».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «один из наших родных». Греческое слово γένος может обозначать род, круг родственников или народ.'
    reason: Сохранение лексической неоднозначности выражения εἷς ἐκ τοῦ γένους ἡμῶν.
lexical_decisions:
- source_word: ἐλθὼν εἶπεν
  choice: он пришёл и сказал
  rationale: Предшествующее аористное причастие естественно передано в русском повествовании однородным сказуемым, без изменения последовательности действий.
- source_word: Πάτερ
  choice: Отец
  rationale: Сохраняет прямое обращение в звательном значении; притяжательное местоимение в греческом тексте отсутствует.
- source_word: εἷς ἐκ τοῦ γένους ἡμῶν
  choice: один из нашего народа
  rationale: γένος здесь допускает значения рода, круга родных и народа. По контексту речь, вероятнее всего, идёт о принадлежности к одной этнорелигиозной общине, а не обязательно о близком родственнике; неоднозначность отмечена в сноске.
- source_word: ἐστραγγαλωμένος
  choice: задушен
  rationale: Передаёт совершившуюся насильственную смерть от удушения и не уточняет без достаточных оснований повешение как конкретный способ.
- source_word: ἔρριπται
  choice: брошен
  rationale: Перфект страдательного залога обозначает, что тело бросили и оно остаётся лежать там; краткое страдательное причастие естественно выражает этот результат по-русски.
- source_word: ἐν τῇ ἀγορᾷ
  choice: на площади
  rationale: ἀγορά обозначает городскую общественную и торговую площадь; «на площади» естественно для русского языка и сохраняет публичный характер места.
theological_decisions:
- issue: Объём значения γένος ἡμῶν
  choice: 'общинно-этническая принадлежность: «один из нашего народа»'
  alternative: 'родственная принадлежность: «один из наших родных» или «один из нашего рода»'
  rationale: Контекст погребения соплеменника позволяет понимать выражение шире ближайшего кровного родства. Основной текст не утверждает, что умерший был членом семьи Товита, а сноска сохраняет лексическую широту греческого выражения.
translation_notes:
  register: Современный литературный русский язык с простым и достойным повествовательным строем. Сохранены прямота обращения и резкость сообщения о насильственной смерти; способ убийства и степень родства не уточняются сверх греческого текста.
