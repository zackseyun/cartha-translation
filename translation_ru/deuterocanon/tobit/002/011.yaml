lexical_decisions:
- source_word: ἡ γυνή μου
  choice: жена моя
  rationale: В сочетании с притяжательным местоимением γυνή естественно означает супругу; порядок слов сохраняет достоинство повествовательной речи.
- source_word: Ἄννα
  choice: Анна
  rationale: Имя передано в традиционной русской библейской форме.
- source_word: ἠριθεύετο
  choice: выполняла работу
  rationale: Глагол обозначает труд, в том числе работу по найму. Нейтральная передача не добавляет не удостоверенных самим стихом значений «получала плату» или названия конкретного ремесла.
- source_word: ἐν τοῖς γυναικείοις
  choice: женскую работу
  rationale: Субстантивированное выражение, вероятнее всего, указывает на область занятий, обычно выполнявшихся женщинами. Формулировка не уточняет конкретное ремесло и не сводит выражение к физическому месту.
