  yaml_path: translation/deuterocanon/tobit/002/010.yaml
  text: And I did not know that sparrows were in the wall[a]; and while my eyes were open, the sparrows dropped warm dung into my eyes, and white films formed on my eyes. Then I went to physicians, but they did not help me[b]. But Achiacharus supported me until I went to Elymais.
translation:
  language: ru
  text: Я не знал, что в стене были воробьи[a]. Когда мои глаза были открыты, воробьи испражнились мне в глаза; их помёт был тёплым, и в глазах у меня появились белые плёнки[b]. Я ходил к врачам, но они мне не помогли. А Ахиахар содержал меня, пока я не отправился в Элимаиду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мелкие птицы»; греческое слово может обозначать мелких птиц вообще, хотя наиболее вероятное значение здесь — «воробьи».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово означает белые плёнки или помутнения на глазах. Речь может идти о состоянии, похожем на катаракту, но точного медицинского диагноза текст не даёт.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: воробьи
  rationale: Уменьшительная форма может обозначать воробьёв или вообще мелких птиц; «воробьи» — наиболее вероятное и традиционное значение, а более широкая возможность отмечена в сноске.
- source_word: ἐν τῷ τοίχῳ
  choice: в стене
  rationale: Сохраняет прямое пространственное значение греческого текста и не заменяет его истолкованием вроде «на стене» или «под крышей».
- source_word: τῶν ὀφθαλμῶν μου ἀνεῳγότων
  choice: когда мои глаза были открыты
  rationale: Естественно передаёт временное значение абсолютной генитивной конструкции.
- source_word: ἀφώδευσαν ... θερμὰ
  choice: испражнились ... тёплым помётом
  rationale: Передаёт прямоту греческого глагола и значение θερμά, оставаясь понятным и литературно приемлемым по-русски.
- source_word: λευκώματα
  choice: белые плёнки
  rationale: Описательно передаёт белёсые непрозрачные образования, не навязывая точного современного медицинского диагноза.
- source_word: ἰατρούς
  choice: врачам
  rationale: Современный нейтральный русский эквивалент для медицинских специалистов.
- source_word: οὐκ ὠφέλησάν με
  choice: они мне не помогли
  rationale: Ясно и естественно передаёт отсутствие пользы от лечения.
- source_word: ἔτρεφέν με
  choice: содержал меня
  rationale: В данном контексте охватывает не только кормление, но и материальное обеспечение утратившего трудоспособность человека.
- source_word: Ἐλυμαΐδα
  choice: Элимаиду
  rationale: Русская передача греческого географического названия Ἐλυμαΐς в форме винительного падежа.
theological_decisions:
- issue: Медицинское описание утраты зрения Товитом
  choice: Описательно перевести λευκώματα как «белые плёнки».
  alternative: «бельма», «катаракта», «помутнения»
  rationale: Греческий текст описывает видимое поражение глаз, но не устанавливает точного современного диагноза; описательный перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного текста. Сохранены телесная конкретность оригинала, буквальное «в стене» и неопределённость медицинского описания; синтаксис сделан естественным для обычного современного читателя.
