base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/002/002.yaml
  text: And I saw much food[a], and I said to my son, “Go and bring whichever one of our brothers you may find in need, who remembers the Lord; and behold[c][b], I am waiting for you.”
translation:
  language: ru
  text: 'И увидел я много приготовленной еды[a] и сказал своему сыну: «Пойди и приведи кого-нибудь из наших братьев[b], если найдёшь нуждающегося, который помнит Господа. И вот, я буду ждать тебя»[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «много блюд»; греческое слово означает приготовленную пищу, подаваемую к трапезе.'
    reason: lexical_alternative
  - marker: b
    text: «Наши братья» здесь — соплеменники Товита, а не только родные братья.
    reason: cultural_note
  - marker: c
    text: Заключительные слова в греческой рукописной традиции сформулированы необычно; по смыслу Товит остаётся ждать возвращения сына.
    reason: textual_variant
lexical_decisions:
- source_word: ἐθεασάμην
  choice: увидел я
  rationale: Аорист θεάομαι здесь обозначает простое зрительное восприятие; инверсия естественна для приподнятого повествовательного регистра.
- source_word: ὄψα πολλά
  choice: множество яств
  rationale: ὄψα обозначает приготовленную пищу или блюда, подаваемые к трапезе. «Яства» сохраняет множественное число и не сужает значение до мяса.
- source_word: Βάδισον
  choice: ступай
  rationale: Повелительная форма передаёт распоряжение отправиться; «ступай» естественно звучит в прямой речи и сохраняет достойный регистр.
- source_word: ἄγαγε
  choice: приведи
  rationale: Речь идёт о том, чтобы привести нуждающегося человека к трапезе, поэтому «приведи» точнее русского «принеси» применительно к человеку.
- source_word: ὃν ἐὰν εὕρῃς
  choice: кого-нибудь ... кого найдёшь
  rationale: 'Конструкция с ἐάν выражает неопределённость: подойдёт любой отвечающий указанным условиям человек.'
- source_word: τῶν ἀδελφῶν ἡμῶν
  choice: из наших братьев
  rationale: Сохранён родственный образ исходного текста; в данном контексте он обозначает соплеменников или членов общины, что поясняется в сноске.
- source_word: ἐνδεής
  choice: нуждающимся
  rationale: Слово обозначает человека, испытывающего нужду, и не ограничивается исключительно денежной бедностью.
- source_word: ὃς μέμνηται τοῦ κυρίου
  choice: помнящим Господа
  rationale: Передано прямое значение μέμνηται — «помнить, быть памятующим» — без истолкования характера этой религиозной верности.
- source_word: ἰδοὺ μένω σε
  choice: А я буду ждать тебя
  rationale: Греческое выражение передано по очевидному контекстуальному смыслу без неестественного буквального «вот»; трудность текста отмечена в сноске.
theological_decisions:
- issue: Передача κύριος в формуле благочестия
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Греческий источник содержит κύριος, а не непосредственно еврейское Божественное имя; поэтому используется обычное «Господь».
- issue: Объём значения ἀδελφῶν ἡμῶν
  choice: наши братья
  alternative: наши соплеменники
  rationale: Основной текст сохраняет мужской родственный термин источника, тогда как его более широкое общинное значение разъясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Архаизирующие формы сведены к минимуму; «яства» и «ступай» выбраны как понятные слова достойного повествовательного регистра.
