  text: And I, before I had tasted anything, sprang up and removed him into a room until the sun set.
translation:
  language: ru
  text: А я, не успев ничего отведать, вскочил и отнёс его в какое-то помещение, где он оставался до захода солнца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὶν ἢ γεύσασθαί με
  choice: не успев ничего отведать
  rationale: Естественно передаёт временное значение греческого оборота и подразумеваемую по контексту пищу, не добавляя конкретного названия трапезы.
- source_word: ἀναπηδήσας
  choice: вскочил
  rationale: Сохраняет резкость и быстроту действия, выраженные глаголом ἀναπηδάω.
- source_word: ἀνειλόμην αὐτόν
  choice: перенёс его
  rationale: Средняя форма αἴρω здесь указывает на то, что рассказчик поднял и убрал тело с прежнего места; «перенёс» ясно передаёт действие без ненужного уточнения.
- source_word: εἰς τι οἴκημα
  choice: в одну из комнат
  rationale: Неопределённое τι сохранено оборотом «в одну из»; οἴκημα в данном контексте естественно понимать как отдельное помещение или комнату.
- source_word: ἕως οὗ ἔδυ ὁ ἥλιος
  choice: чтобы оставить там до захода солнца
  rationale: Передаёт предел времени; добавленные слова «чтобы оставить там» делают по-русски ясной подразумеваемую временную цель переноса, не утверждая самого последующего погребения.
theological_decisions:
- issue: Причина ожидания до захода солнца
  choice: Не разъяснять в основном тексте
  alternative: Указать, что Товит ждал вечера ради погребения или из-за религиозного обычая
  rationale: Греческий стих сообщает только о переносе тела до захода солнца; объяснение причины здесь было бы толкованием или заимствованием из иной текстовой традиции.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и энергичное. Местоимение «его» сохраняет анафорическую связь с погибшим из контекста, а формулировка не вносит деталей косвенной поздней еврейской версии.
