base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/011.yaml
  text: And now, children, see what almsgiving does, and how righteousness delivers. And while he was saying these things, his life came to an end on the bed. He was a hundred fifty-eight years old, and he buried him honorably.
translation:
  language: ru
  text: А теперь, дети, посмотрите, что делает милостыня и как праведность избавляет.[a] И когда он говорил это, жизнь его угасла в постели.[b] Ему было сто пятьдесят восемь лет, и он с почестями похоронил его.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость избавляет». Греческое слово может означать как праведность, так и справедливость.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «душа его иссякла». Это греческий оборот, обозначающий смерть.'
    reason: lexical_alternative
  - marker: c
    text: 'Можно было бы ожидать: «его с почестями похоронили», однако в данном греческом тексте глагол стоит в единственном числе: «он… похоронил его».'
    reason: textual_variant
lexical_decisions:
- source_word: παιδία
  choice: дети
  rationale: Форма обращения во множественном числе к потомкам или младшим; «дети» естественно передаёт семейный характер обращения, не уточняя пол.
- source_word: ἴδετε
  choice: посмотрите
  rationale: Императив множественного числа сохраняет прямой призыв увидеть и осмыслить сказанное.
- source_word: ἐλεημοσύνη
  choice: милостыня
  rationale: В книге Товита слово обозначает конкретную помощь нуждающимся; «милостыня» сохраняет этот практический смысл.
- source_word: ποιεῖ
  choice: делает
  rationale: Простое настоящее время и открытая формулировка оригинала переданы без добавочного уточнения результата.
- source_word: δικαιοσύνη
  choice: праведность
  rationale: В наставительном контексте речь идёт о нравственно праведной жизни; возможный смысл «справедливость» отмечен в сноске.
- source_word: ῥύεται
  choice: избавляет
  rationale: Передаёт спасение от беды, не сужая его до исключительно физического либо эсхатологического спасения.
- source_word: ἐξέλιπεν αὐτοῦ ἡ ψυχὴ
  choice: жизнь его угасла
  rationale: Естественный и достойный русский оборот для смерти, сохраняющий образ прекращения жизни, но не навязывающий отдельного антропологического учения.
- source_word: κλίνη
  choice: постель
  rationale: Обычное значение в повествовании о смерти; «постель» соответствует литературному регистру.
- source_word: ἐτῶν ἑκατὸν πεντήκοντα ὀκτώ
  choice: ему было сто пятьдесят восемь лет
  rationale: Естественная современная русская формулировка возраста.
- source_word: ἔθαψεν αὐτὸν ἐνδόξως
  choice: он с почестями похоронил его
  rationale: Сохраняет единственное число глагола в данном греческом свидетельстве и передаёт ἐνδόξως как почётный характер погребения.
theological_decisions:
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: Наставительный контекст поддерживает широкий смысл нравственной правоты; реальная лексическая возможность значения «справедливость» сохранена в сноске.
- issue: Оборот о смерти ἐξέλιπεν αὐτοῦ ἡ ψυχὴ
  choice: жизнь его угасла
  alternative: душа его оставила его / он испустил дух
  rationale: Выбранный оборот ясно сообщает о смерти и не превращает греческую идиому в более определённое утверждение о природе или отделении души.
- issue: Неявный субъект ἔθαψεν
  choice: он с почестями похоронил его
  alternative: его с почестями похоронили
  rationale: Форма глагола в указанном греческом тексте — единственное число; перевод сохраняет эту трудность, а не исправляет её по ожиданию читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростного наставления. Синтаксис остаётся близким к греческому, но читается естественно; необычное единственное число последнего глагола намеренно сохранено и пояснено.
