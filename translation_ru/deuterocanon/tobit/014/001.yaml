    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαύσατο
  choice: окончил
  rationale: Аорист среднего залога от παύω обозначает прекращение или завершение действия. В данном контексте «окончил» естественно передаёт завершение предшествующей хвалебной речи и не создаёт впечатления внезапного перерыва.
- source_word: ἐξομολογούμενος
  choice: возносить хвалу
  rationale: Причастие допускает значения исповедания, благодарения и хвалы. Поскольку стих завершает предшествующую хвалебную речь Товита, выражение «возносить хвалу» лучше всего соответствует ближайшему контексту, а иной возможный смысл сохранён в сноске.
- source_word: Τωβείτ
  choice: Товит
  rationale: Использована общепринятая русская форма имени персонажа и названия книги.
theological_decisions:
- issue: Значение ἐξομολογούμενος в контексте богослужебной речи
  choice: возносить хвалу
  alternative: исповедоваться
  rationale: Предшествующий контекст представляет заключение благословения и хвалебной речи, поэтому основной текст передаёт значение хвалы. Возможное покаянное значение не исключается молча, а отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и естественной формулировкой. Оборот «возносить хвалу» уместен для молитвенно-гимнического контекста и остаётся понятным широкому читателю.
