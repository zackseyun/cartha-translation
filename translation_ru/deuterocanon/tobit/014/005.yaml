base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/005.yaml
  text: And God will again have mercy on them and bring them back to the land[a], and they will build the house, though not like the former one, until the times of the age are fulfilled. And after these things they will return from the captivities and build Jerusalem honorably, and the house of God in her will be built gloriously[c][b], just as the prophets spoke concerning her.
translation:
  language: ru
  text: И снова Бог помилует их и вернёт их в страну, и они построят Дом, но не такой, как прежний, пока не исполнятся времена века[a]. После этого они возвратятся из пленений[b] и с честью отстроят Иерусалим, и Дом Божий в нём будет возведён во славе, как говорили о нём пророки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «времена века». Выражение может указывать на назначенные сроки, ведущие к более полному восстановлению; греческий текст не уточняет его точного эсхатологического смысла.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте стоит множественное число — «из пленений»; возможно, имеются в виду разные места или случаи плена.
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν ἐλεήσει αὐτοὺς ὁ θεός
  choice: И снова Бог помилует их
  rationale: «Снова» передаёт повторность Божьего милосердного действия, а «помилует» сохраняет религиозный и заветный оттенок ἐλεέω.
- source_word: ἐπιστρέψει αὐτοὺς εἰς τὴν γῆν
  choice: возвратит их в землю
  rationale: 'Переходный глагол имеет каузативный смысл: Бог вернёт их. «В землю» сохраняет определённость греческого выражения без добавления отсутствующего местоимения «их».'
- source_word: οἰκοδομήσουσιν τὸν οἶκον
  choice: они построят Дом
  rationale: Сохранено буквальное «Дом», в контексте обозначающее храм; прописная буква естественно указывает на сакральный референт, который далее прямо назван Домом Божьим.
- source_word: οὐχ οἷος ὁ πρότερος
  choice: но не такой, как прежний
  rationale: Естественно передаёт отличие восстановленного Дома от прежнего, не уточняя, состоит ли оно в меньшем величии или в ином качестве.
- source_word: ἕως πληρωθῶσιν καιροὶ τοῦ αἰῶνος
  choice: пока не исполнятся времена века
  rationale: Формулировка намеренно сохраняет необычность и эсхатологическую открытость сочетания καιροὶ τοῦ αἰῶνος, не сводя его к конкретной схеме последних времён.
- source_word: ἐκ τῶν αἰχμαλωσιῶν
  choice: из пленений
  rationale: Сохранено явное множественное число греческого текста, которое может подразумевать разные места или случаи плена.
- source_word: οἰκοδομήσουσιν Ἰερουσαλὴμ ἐντίμως
  choice: с честью отстроят Иерусалим
  rationale: «Отстроят» естественно для восстановления города, а «с честью» сохраняет смысл достойного, почётного устроения, не ограничивая его одной архитектурной пышностью.
- source_word: ἐνδόξως
  choice: во славе
  rationale: Передаёт как великолепие, так и богословский оттенок славы, связанный с корнем δόξα.
- source_word: ἐν αὐτῇ … περὶ αὐτῆς
  choice: в нём … о нём
  rationale: В русском название «Иерусалим» мужского рода, поэтому естественное согласование сохраняет тот же референт без искусственной феминизации, обусловленной грамматикой греческого языка.
theological_decisions:
- issue: Временное выражение καιροὶ τοῦ αἰῶνος
  choice: пока не исполнятся времена века
  alternative: пока не исполнятся назначенные времена; пока не завершатся времена этого века
  rationale: Греческое выражение допускает эсхатологическое понимание, но не определяет его точнее; формальный оборот сохраняет эту напряжённость и открытость.
- issue: Референт слова οἶκος
  choice: Дом
  alternative: храм
  rationale: По контексту речь идёт о храме, однако исходный текст сначала говорит «Дом», а затем уточняет «Дом Божий». Это развитие сохранено.
- issue: Грамматический род Иерусалима
  choice: в нём / о нём
  alternative: в ней / о ней
  rationale: Женские местоимения в греческом согласованы с грамматически женским Ἰερουσαλήμ. В русском «Иерусалим» мужского рода; согласование в мужском роде естественно и не устраняет содержательную персонификацию, поскольку она здесь не выражена независимо от грамматики.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис упрощён лишь там, где это требуется естественностью русского текста; необычная временная формула сохранена и пояснена. Формы «в нём» и «о нём» согласованы с русским грамматическим родом названия «Иерусалим».
