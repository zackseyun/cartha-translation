  text: And he was fifty-eight years old when he lost his sight[a], and after eight years he regained it; and he did acts of mercy[c][b], and he continued to fear God.
translation:
  language: ru
  text: Ему было пятьдесят восемь лет, когда он потерял зрение[a], а через восемь лет вновь прозрел. Он творил дела милосердия[b] и продолжал бояться Бога[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение буквально говорит об утрате «зрения/способности видеть»; далее употреблён глагол со значением «снова увидеть, прозреть».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подавал милостыню». Греческое слово может обозначать как милостыню, так и дела милосердия вообще.'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте сказано лишь «продолжал бояться»; слово «Бога» подразумевается благочестивым контекстом.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐτῶν πεντήκοντα ὀκτὼ
  choice: Ему было пятьдесят восемь лет
  rationale: Естественная русская передача греческого оборота, обозначающего возраст.
- source_word: ἀπώλεσεν τὰς ὄψεις
  choice: потерял зрение
  rationale: Греческое выражение буквально говорит об утрате способности видеть; выбран современный и точный русский эквивалент.
- source_word: μετὰ ἔτη ὀκτὼ
  choice: через восемь лет
  rationale: В данном повествовательном контексте естественно обозначает срок до восстановления зрения.
- source_word: ἀνέβλεψεν
  choice: вновь прозрел
  rationale: В контексте исцеления от слепоты глагол означает восстановление зрения; «прозрел» кратко и естественно передаёт этот смысл.
- source_word: ἐποίει ἐλεημοσύνας
  choice: творил дела милосердия
  rationale: Сохраняет более широкий смысл милосердных поступков, не сужая выражение исключительно до денежной милостыни; несовершенный вид передаёт продолжительное действие.
- source_word: προσεθέτο φοβεῖσθαι
  choice: продолжал бояться Бога
  rationale: Конструкция указывает на продолжение благочестивого страха; объект «Бога» подразумевается контекстом, но отсутствует в сохранившейся греческой формулировке, что отмечено в сноске.
theological_decisions:
- issue: Не выраженный прямо объект φοβεῖσθαι
  choice: продолжал бояться Бога
  alternative: продолжал бояться; продолжал пребывать в благоговении
  rationale: В благочестивом библейском контексте подразумевается страх перед Богом. Добавление делает русский текст ясным, а сноска сохраняет прозрачность по отношению к форме источника, не превращая подразумеваемое в неоговорённую эксплицитную деталь.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; «творил дела милосердия» сохраняет традиционную возвышенность без архаической тяжеловесности. Все интерпретирующие уточнения обозначены сносками.
