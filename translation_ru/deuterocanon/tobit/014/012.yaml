base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/012.yaml
  text: And when Hanna died[a], he buried her with his father. Then Tobias went away with his wife and his sons to Ecbatana, to Raguel his father-in-law.
translation:
  language: ru
  text: Когда Анна умерла, он похоронил её вместе со своим отцом.[a] Затем Товия отправился со своей женой и сыновьями в Екбатаны, к Рагуилу, своему тестю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте субъект глагола «похоронил» не назван; в следующем предложении прямо назван Товия.
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέθανεν
  choice: умерла
  rationale: Прямое и нейтральное соответствие глаголу ἀποθνῄσκω без эвфемистического смягчения.
- source_word: ἔθαψεν
  choice: похоронил
  rationale: Точно передаёт обычное значение θάπτω и естественно звучит в повествовании.
- source_word: μετὰ τοῦ πατρὸς αὐτοῦ
  choice: вместе со своим отцом
  rationale: Сохраняет значение μετά с родительным падежом и не уточняет сверх текста, была ли это одна могила или общее семейное место погребения.
- source_word: ἀπῆλθεν
  choice: отправился
  rationale: Передаёт уход и последующее движение в другое место, оставаясь естественным для современного русского повествования.
- source_word: γυναικὸς αὐτοῦ
  choice: своей женой
  rationale: В семейном контексте γυνή означает именно жену; возвратное притяжательное местоимение естественно для русского языка.
- source_word: υἱῶν αὐτοῦ
  choice: сыновьями
  rationale: Греческое слово обозначает сыновей, поэтому оно не обобщено до «детей».
- source_word: Ἐκβάτανα
  choice: Екбатаны
  rationale: Употреблена традиционная русская форма названия древнего города.
- source_word: πρὸς Ῥαγουὴλ τὸν πενθερὸν αὐτοῦ
  choice: к Рагуилу, своему тестю
  rationale: πρός передаёт движение к лицу, а πενθερός точно соответствует русскому «тесть».
theological_decisions:
- issue: Субъект сообщения о погребении
  choice: Сохранено местоимение «он», а имя Товии названо лишь в следующем предложении.
  alternative: Прямо назвать Товию субъектом погребения.
  rationale: В форме ἔθαψεν субъект грамматически подразумевается, но не назван; в следующей части текста имя Τωβίας выражено явно. Перевод сохраняет эту особенность и не устраняет возможную референциальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным строем. Имена переданы в принятых русских библейских формах; синтаксическая неоднозначность исходного текста сохранена и пояснена в сноске.
