  text: And all the nations will truly turn to fear the Lord God[a]; they will bury their idols.
translation:
  language: ru
  text: И все народы поистине обратятся, чтобы бояться Господа Бога[a], и закопают своих идолов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поистине возвратятся к страху перед Господом Богом». Греческий глагол может означать как «обратиться», так и «возвратиться»; здесь речь идёт об искреннем повороте народов к Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: Передаёт универсальный охват выражения и не сужает его до противопоставления язычников иудеям.
- source_word: ἐπιστρέψουσιν
  choice: обратятся
  rationale: Сохраняет образ поворота к Богу и допускает оттенок возвращения, не вводя более позднюю техническую терминологию обращения.
- source_word: ἀληθινῶς
  choice: поистине
  rationale: Передаёт подлинность и искренность обращения; слово естественно для современного литературного русского в библейском регистре.
- source_word: φοβεῖσθαι
  choice: чтобы бояться
  rationale: Сохраняет прямое значение и библейское богословское напряжение страха перед Богом, не подменяя его толкованием «почитать» или «поклоняться».
- source_word: Κύριον τὸν θεόν
  choice: Господа Бога
  rationale: Точно передаёт греческое наименование без отсутствующего в источнике притяжательного местоимения.
- source_word: κατορύξουσιν
  choice: закопают
  rationale: Передаёт конкретный образ закапывания в землю и в данном контексте естественнее русского «погребут» применительно к идолам.
- source_word: τὰ εἴδωλα αὐτῶν
  choice: своих идолов
  rationale: Возвратное «своих» естественно по-русски соотносит идолов с подлежащим «народы», сохраняя значение греческого αὐτῶν.
theological_decisions:
- issue: Сохранять ли прямое значение φοβεῖσθαι или смягчить его до почитания
  choice: бояться
  alternative: почитать
  rationale: Греческий текст использует обычный библейский язык страха перед Богом; прямой перевод сохраняет его богословскую ёмкость и напряжение.
- issue: Передавать ли ἐπιστρέψουσιν техническим языком религиозного обращения
  choice: обратятся
  alternative: примут веру
  rationale: «Обратятся» сохраняет исходную метафору поворота и не добавляет отсутствующей в греческом конфессиональной конкретизации.
- issue: Относить ли ἀληθινῶς к обращению или к страху перед Богом
  choice: поистине обратятся
  alternative: обратятся, чтобы истинно бояться
  rationale: Положение наречия непосредственно после глагола благоприятствует связи с обращением, однако синтаксис допускает смысловой охват всего выражения; перевод не устраняет эту естественную широту полностью.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис сохранён компактным; «обратятся, чтобы бояться» намеренно оставляет заметным греческий образ обращения и прямое богословское значение страха перед Богом.
