  source_fidelity: 'Смысл греческого текста в целом передан верно: известие о гибели Ниневии получено до смерти героя; необычное утверждение о том, что Ниневию «взяли в плен» названные правители, не гармонизируется; заключительное «Аминь» сохранено. Однако имя Ἀσύηρος в русской библейской традиции обычно передаётся «Ассуир», а оборот «порадовался о Ниневии» не соответствует естественному современному литературному употреблению.'
