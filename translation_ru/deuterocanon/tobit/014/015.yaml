  text: And before he died[a], he heard of the destruction of Nineveh, which Nebuchadnezzar and Ahasuerus had taken captive; before dying, he rejoiced over Nineveh. Amen.
translation:
  language: ru
  text: Прежде чем он умер, он услышал о гибели Ниневии, которую Навуходоносор и Ассуир взяли в плен.[a] Перед смертью он порадовался из-за Ниневии. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Так в греческом тексте: «которую Навуходоносор и Ассуир взяли в плен». Историческое отождествление этих правителей в связи с падением Ниневии остаётся предметом споров.'
    reason: Сохраняет необычную формулировку и историческое напряжение исходного текста, не исправляя его в основном переводе.
lexical_decisions:
- source_word: ἤκουσεν
  choice: услышал о
  rationale: Глагол означает «услышал»; сочетание «услышал о гибели» естественно вводит известие о событии и не предполагает, что герой непосредственно слышал само разрушение.
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: прежде чем умереть
  rationale: Временная инфинитивная конструкция передана естественным русским оборотом, сохраняющим последовательность событий.
- source_word: ἀπωλίαν
  choice: гибели
  rationale: В историческом контексте слово обозначает уничтожение или крушение города; «гибель Ниневии» ясно и литературно передаёт этот смысл.
- source_word: ᾐχμαλώτισεν
  choice: пленили
  rationale: Сохранён основной смысл взятия в плен. Город назван метонимически вместо его жителей; эта особенность исходного текста не сглаживается до нейтрального «захватили».
- source_word: Ναβουχοδονοσὸρ
  choice: Навуходоносор
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: Ἀσύηρος
  choice: Асуир
  rationale: Форма близко передаёт греческое Ἀσύηρος и не навязывает спорного исторического отождествления правителя.
- source_word: ἐχάρη
  choice: порадовался
  rationale: Глагол передаёт радость героя; форма естественна в современном литературном русском языке.
- source_word: ἐπὶ Νινευή
  choice: о Ниневии
  rationale: Предлог обозначает объект или повод радости. Формулировка сохраняет неоднозначность, не добавляя прямо отсутствующих в греческом слов «её падению».
- source_word: ἀμήν
  choice: Аминь
  rationale: Явно присутствующее в греческом тексте заключительное слово сохранено в традиционной русской форме.
theological_decisions:
- issue: Историческая идентификация правителей, названных при гибели Ниневии
  choice: Сохранить в основном тексте имена «Навуходоносор и Асуир», не исправляя их по внешней исторической реконструкции.
  alternative: Отождествить названных лиц с другими правителями или заменить имена согласно принятой реконструкции падения Ниневии.
  rationale: Перевод должен передавать имеющееся греческое свидетельство и сохранять историческое напряжение, а не молча гармонизировать его с позднейшими реконструкциями.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор временного оборота сохранён вслед за греческим текстом; формулировка «порадовался о Ниневии» намеренно удерживает неоднозначность ἐπὶ Νινευή.
