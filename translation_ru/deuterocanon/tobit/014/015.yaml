  to: Прежде чем он умер, он услышал о гибели Ниневии, которую Навуходоносор и Ассуир взяли в плен.[a] Перед смертью он порадовался из-за Ниневии. Аминь.
  rationale: Исправлены только вопросы русской нормы и традиционной передачи имени. Необычная метонимия «Ниневию ... взяли в плен» сохранена, как и повторное указание на время перед смертью. «Из-за Ниневии» передаёт ἐπὶ Νινευή как повод радости, не превращая подразумеваемую связь с гибелью города в явно добавленное истолкование.
