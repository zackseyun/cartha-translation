  source_fidelity: 'Перевод точно передаёт синтаксическую последовательность и основные значения греческого текста: все народы благословляют Господа, Его народ благодарит Бога, Господь возвышает Свой народ, а любящие Господа Бога радуются. Причастие ποιοῦντες корректно отнесено к тем, кто любит Бога и радуется; дательный τοῖς ἀδελφοῖς ἡμῶν естественно передан конструкцией «к нашим братьям».'
