  variant: modern literary Russian
source:
  edition: lxx-swete-1909
  text: καὶ εὐλογήσουσιν πάντα τὰ ἔθνη Κύριον. καὶ ὁ λαὸς αὐτοῦ ἐξομολογήσεται τῷ θεῷ, καὶ ὑψώσει Κύριος τὸν λαὸν αὐτοῦ· καὶ χαρήσονται πάντες οἱ ἀγαπῶντες Κύριον τὸν θεὸν ἐν ἀληθείᾳ καὶ δικαιοσύνῃ, ποιοῦντες ἔλεος τοῖς ἀδελφοῖς ἡμῶν.
  language: Greek
  pages: []
  confidence: high
base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/007.yaml
  text: And all the nations will bless the Lord[a]. And his people will give thanks to God, and the Lord will exalt his people; and all who love the Lord God in truth and righteousness will rejoice[c][b], showing mercy to our brothers.
translation:
  language: ru
  text: И все народы благословят Господа. И Его народ возблагодарит Бога[a], и Господь возвысит Свой народ; и возрадуются все, любящие Господа Бога в истине и праведности[b] и проявляющие милость к нашим братьям[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прославит Бога»; греческий глагол может означать благодарение, хвалу или исповедание — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: «Праведность» можно также передать как «справедливость», однако здесь, вероятно, имеются в виду правота перед Богом и праведное поведение.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «нашим братьям»; это слово может обозначать также сородичей или членов своей общины в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογήσουσιν
  choice: благословят
  rationale: Прямо передаёт значение εὐλογέω при Господе как объекте; сохраняет библейский образ речи, обращённой к Богу, не сводя его только к хвале.
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: Передаёт универсальный охват выражения и не уточняет без необходимости, имеются ли в виду исключительно язычники.
- source_word: ἐξομολογήσεται
  choice: возблагодарит
  rationale: В данном ряду действий, прославляющих Бога, глагол естественно означает благодарение; возвратный оттенок русской формы не требуется, а покаянное «исповедуется» было бы чрезмерным уточнением.
- source_word: ὑψώσει
  choice: возвысит
  rationale: Сохраняет как метафору поднятия, так и смысл дарования чести и высокого положения.
- source_word: ἐν ἀληθείᾳ καὶ δικαιοσύνῃ
  choice: в истине и праведности
  rationale: Сохраняет именные понятия и допускает их связь как с искренней преданностью, так и с праведным образом жизни, не заменяя праведность более узким понятием справедливости.
- source_word: ποιοῦντες ἔλεος
  choice: проявляющие милость
  rationale: Естественно передаёт семитизированное выражение «делать милость» и согласует причастие с теми, кто любит Бога.
- source_word: τοῖς ἀδελφοῖς ἡμῶν
  choice: к нашим братьям
  rationale: Сохраняет явно мужскую форму греческого текста, не исключая возможного собирательного значения членов родственной или религиозной общины.
theological_decisions:
- issue: Передача Κύριος
  choice: Господь
  alternative: Владыка; ГОСПОДЬ
  rationale: «Господь» — естественное и традиционное соответствие в данном богословском контексте; написание «ГОСПОДЬ» внесло бы не обозначенное самим греческим текстом решение о стоящем за ним еврейском имени.
- issue: Передача δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: Здесь слово относится к характеру любви к Богу и нравственному поведению, а не специально к судебной или общественной справедливости.
- issue: Референт ἀδελφοῖς
  choice: братья
  alternative: братья и сёстры; ближние; соплеменники
  rationale: Основной текст сохраняет грамматически мужское множественное число; примечание указывает на возможную более широкую представительскую функцию слова, не закрепляя её как единственно возможную.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм греческой фразы сохранён, но тяжеловесное буквальное «делающие милость» заменено естественным «проявляющие милость». Заглавные местоимения при Боге использованы последовательно в рамках данного стиха.
