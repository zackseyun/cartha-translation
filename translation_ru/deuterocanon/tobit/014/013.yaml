base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/013.yaml
  text: And he grew old honorably[a], and he buried his parents-in-law with honor, and he inherited their property and that of Tobit his father.
translation:
  language: ru
  text: И он достиг почтенной старости, с почестями похоронил родителей своей жены и унаследовал их имущество, а также имущество своего отца Товита.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγήρασεν ἐντίμως
  choice: достиг почтенной старости
  rationale: Передаёт наступление старости и оттенок почёта естественным современным русским выражением; наречие ἐντίμως характеризует его старость как достойную уважения.
- source_word: ἔθαψεν
  choice: похоронил
  rationale: Прямой и нейтральный эквивалент греческого глагола без ненужного эвфемизма.
- source_word: τοὺς πενθεροὺς αὐτοῦ
  choice: родителей своей жены
  rationale: Во множественном числе выражение обозначает родителей супруга или супруги; контекст Товита позволяет ясно и естественно сказать «родителей своей жены».
- source_word: ἐνδόξως
  choice: с почестями
  rationale: В контексте погребения указывает на почётный, достойно совершённый обряд; формулировка также сохраняет отличие от ἐντίμως в первой части стиха.
- source_word: ἐκληρονόμησεν
  choice: унаследовал
  rationale: Точно передаёт получение имущества по наследству.
- source_word: τὴν οὐσίαν αὐτῶν
  choice: их имущество
  rationale: οὐσία здесь обозначает имущество или владения; «имущество» ясно и не создаёт излишне юридического оттенка.
- source_word: καὶ Τωβεὶτ τοῦ πατρὸς αὐτοῦ
  choice: а также имущество своего отца Товита
  rationale: В греческом подразумевается повтор существительного «имущество»; его восстановление по-русски устраняет неясность и сохраняет Товита как приложение к слову «отца».
