base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/010.yaml
  text: And bury me properly[a], and your mother with me, and do not stay any longer in Nineveh. Child, see what Nadab did to Ahikar, who had reared him—how he brought him from the light into the darkness, and all that he repaid him. But Ahikar was saved, while that man received the repayment, and he himself went down into the darkness. Manasseh did acts of mercy, and he was saved from the deadly snare that Nadab had set for him[b]; but Nadab fell into the trap and perished.
translation:
  language: ru
  text: 'И похорони меня как должно, а вместе со мной — и твою мать. И больше не оставайтесь в Ниневии. Сын мой, посмотри, что Надав[a] сделал с Ахикаром, который его воспитал: как он низвёл его из света во тьму и всё то, чем ему отплатил. Но Ахикар был спасён, а тот получил воздаяние и сам сошёл во тьму. Манассия совершил дело милосердия[b] и был спасён из смертельной западни, которую Надав устроил для него; Надав же сам попал в эту западню и погиб.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте здесь стоит имя «Адам». Речь идёт не о первом человеке, а о коварном воспитаннике Ахикара, известном в сказании также под именем Надав (или Надан).
    reason: alternative_reading
  - marker: b
    text: 'Или: «подал милостыню». Греческое слово ἐλεημοσύνη в книге Товита часто означает благотворительное подаяние, хотя может обозначать дело милосердия шире.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θάψον με καλῶς
  choice: похорони меня как должно
  rationale: Передаёт прямое повеление θάψον и значение καλῶς как достойного, надлежащего исполнения, не добавляя отсутствующей в тексте идеи почётного погребения.
- source_word: μηκέτι αὐλισθῆτε εἰς Νινευή
  choice: больше не оставайтесь в Ниневии
  rationale: Форма множественного числа сохранена; αὐλίζομαι в данном контексте означает пребывание или проживание, а не только ночлег.
- source_word: τέκνον
  choice: Сын мой
  rationale: В контексте Товит обращается к своему сыну. Русское «Сын мой» естественно передаёт тёплое семейное обращение, хотя буквально существительное означает «дитя» и местоимение не выражено.
- source_word: Ἀδὰμ
  choice: Надав
  rationale: Это имя коварного воспитанника из сказания об Ахикаре, а не имя праотца Адама. Форма «Надав» предотвращает ложное отождествление; буквальная форма греческого текста отмечена в сноске.
- source_word: τῷ θρέψαντι αὐτόν
  choice: который его воспитал
  rationale: В контексте θρέφω обозначает не просто кормление, а воспитание и содержание ребёнка.
- source_word: ἐκ τοῦ φωτὸς ... εἰς τὸ σκότος
  choice: из света во тьму
  rationale: Сохранён выразительный метафорический контраст исходного текста без истолкования образа.
- source_word: ἀνταπέδωκεν / ἀνταπόδομα ἀπεδόθη
  choice: отплатил / получил воздаяние
  rationale: Русские слова сохраняют связь между поступком Надава и последовавшим ответным воздаянием, не уточняя, кем оно было совершено.
- source_word: ἔσωσεν / ἐσώθη
  choice: был спасён
  rationale: Прямо передаёт пассив σῴζω; в повествовательном контексте речь идёт об избавлении от смертельной опасности.
- source_word: ἐλεημοσύνην
  choice: совершил дело милосердия
  rationale: Формулировка сохраняет конкретное этическое действие и не сужает значение исключительно до денежной милостыни; более узкое значение отмечено в сноске.
- source_word: παγίδος θανάτου
  choice: смертельной западни
  rationale: Естественно по-русски передаёт западню, грозящую смертью, сохраняя последующее повторение образа ловушки.
theological_decisions:
- issue: Значение спасения Ахикара и Манассии
  choice: избавление от смертельной опасности
  alternative: духовное или вечное спасение
  rationale: Окружение прямо говорит о заговоре, смертельной западне и гибели Надава. При этом в основном тексте сохранено ёмкое слово «спасён», без догматического перефразирования.
- issue: Значение ἐλεημοσύνη
  choice: дело милосердия
  alternative: милостыня, благотворительное пожертвование
  rationale: Греческое слово в книге Товита нередко означает подаяние нуждающимся, но допускает более широкое значение милосердного поступка. Основной текст сохраняет широту, а частное значение указано в сноске.
- issue: Образ света и тьмы
  choice: сохранить без толкования
  alternative: явно истолковать тьму как темницу, бедствие или смерть
  rationale: Исходный текст намеренно использует образный язык и затем повторяет сошествие во тьму; перевод не устраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, но понятным библейским регистром. Синтаксис сохраняет последовательность наставления и назидательного примера; метафоры света, тьмы и западни оставлены без поясняющего расширения.
