lexical_decisions:
- source_word: ἀπέθανεν
  choice: умер
  rationale: Прямой и естественный эквивалент аориста; не вводит отсутствующего в оригинале эвфемизма.
- source_word: ἐτῶν ἑκατὸν ἑπτά
  choice: в возрасте ста семи лет
  rationale: Родительный возраста указывает, сколько ему было лет при смерти; выбран естественный для современного литературного русского оборот.
- source_word: ἐν Ἐκβατάνοις
  choice: в Экбатанах
  rationale: Предлог ἐν обозначает место; традиционная русская форма названия города употребляется во множественном числе и склоняется.
- source_word: τῆς Μηδείας
  choice: Мидийских
  rationale: Генитив уточняет, о каких Экбатанах идет речь; прилагательное естественно передает географическую принадлежность и сохраняет различительную функцию греческого выражения.
