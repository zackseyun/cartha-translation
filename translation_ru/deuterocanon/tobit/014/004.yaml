base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/014/004.yaml
  text: 'Go to Media[a], my child, because I am convinced that what Jonah the prophet spoke concerning Nineveh will happen: it will be overthrown. But in Media there will be peace for a while. And our brothers will be scattered from the good land, and Jerusalem will be desolate, and the house of God in it will be burned down[b], and it will be desolate until a time.'
translation:
  language: ru
  text: 'Ступай в Мидию, дитя моё, потому что я убеждён: сбудется сказанное пророком Ионой о Ниневии — она будет разрушена. В Мидии же до поры будет относительно мирно[a]. Наши братья будут рассеяны вдали от благой земли; Иерусалим опустеет, дом Божий в нём будет сожжён[b] и будет лежать в запустении до времени.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «в Мидии будет больше мира до поры». Сравнительное слово может указывать на относительную безопасность Мидии, а не на полный мир.'
    reason: lexical_alternative
  - marker: b
    text: «Дом Божий» — храм в Иерусалиме.
    reason: cross_reference
lexical_decisions:
- source_word: ἄπελθε εἰς τὴν Μηδείαν
  choice: Ступай в Мидию
  rationale: Аористный императив передаёт прямое наставление отправиться в указанную страну; «ступай» естественно и сохраняет личный, несколько торжественный тон.
- source_word: τέκνον
  choice: дитя моё
  rationale: Форма обращения выражает родительскую нежность, не уточняя пол адресата сверх греческого текста.
- source_word: πέπεισμαι
  choice: я убеждён
  rationale: Перфект выражает устойчивое состояние уверенности.
- source_word: ὅσα ἐλάλησεν ... ὅτι καταστραφήσεται
  choice: сбудется сказанное ... — она будет разрушена
  rationale: Формулировка ясно передаёт убеждённость в исполнении пророчества; будущее страдательное καταστραφήσεται передано без указания действующего лица.
- source_word: ἐν δὲ τῇ Μηδείᾳ ἔσται εἰρήνη μᾶλλον ἕως καιροῦ
  choice: В Мидии же до поры будет спокойнее
  rationale: Сравнительное μᾶλλον сохранено словом «спокойнее», что указывает на относительную безопасность, а ἕως καιροῦ — на её временный характер.
- source_word: οἱ ἀδελφοὶ ἡμῶν
  choice: наши братья
  rationale: Буквально сохраняет мужское множественное число; в контексте речь идёт о соплеменниках-израильтянах.
- source_word: σκορπισθήσονται ἀπὸ τῆς ἀγαθῆς γῆς
  choice: будут рассеяны, изгнаны из благодатной земли
  rationale: «Рассеяны» передаёт образ διασπορά, а «изгнаны» естественно выражает отделение ἀπό от земли. «Благодатная» сохраняет положительную библейскую характеристику земли без сведения её лишь к плодородию.
- source_word: ἔρημος
  choice: опустеет / останется в запустении
  rationale: В отношении города и храма слово обозначает разорение и оставленность, а не буквальную пустыню; вариативность избегает тяжёлого повтора.
- source_word: μέχρι χρόνου
  choice: до назначенного времени
  rationale: Передаёт ограниченность периода запустения; «назначенного» делает естественным русский оборот, не определяя, кем именно назначено это время.
theological_decisions:
- issue: Связь убеждённости Товита с пророчеством Ионы
  choice: '«я убеждён: сбудется сказанное пророком Ионой»'
  alternative: «я убеждён во всём, что сказал пророк Иона»
  rationale: Выбранный вариант естественно раскрывает синтаксическую связь πέπεισμαι и содержания пророчества, не добавляя причины или богословского толкования.
- issue: Сравнительное значение μᾶλλον в описании Мидии
  choice: «будет спокойнее»
  alternative: «будет мир»
  rationale: Сравнительная форма сохраняет мысль об относительной безопасности Мидии, а не обещание абсолютного мира.
- issue: Значение «дома Божьего»
  choice: сохранено выражение «дом Божий» с пояснением в сноске
  alternative: заменить в тексте на «храм»
  rationale: Основной текст удерживает образ и лексику источника, тогда как сноска устраняет возможную неясность.
- issue: Временный предел запустения
  choice: «до назначенного времени»
  alternative: «до поры»
  rationale: Формулировка сохраняет неопределённый, но ограниченный срок и не утверждает конкретной хронологии.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясности, но сравнительность μᾶλλον, временные ограничения и пророческая напряжённость сохранены. Все маркеры сносок присутствуют в основном тексте.
