  terminology: «Мидия», «Ниневия», «Иерусалим» и «дом Божий» переданы последовательно. «Благая земля» ближе к ἀγαθή («добрая/благая»), чем «благодатная», которое может вносить не выраженный в тексте конфессионально окрашенный оттенок. Сноска к «дому Божьему» сохраняет пояснение «храм».
