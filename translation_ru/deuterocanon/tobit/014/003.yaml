    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλως δὲ ἐγήρασεν
  choice: Он стал очень стар
  rationale: μεγάλως усиливает глагол старения; современное русское «стал очень стар» естественно передаёт достигнутое состояние глубокой старости. Частица δέ здесь выполняет связующую функцию и не требует отдельного слова в русском тексте.
- source_word: τὸν υἱὸν αὐτοῦ καὶ τοὺς υἱοὺς αὐτοῦ
  choice: своего сына и внуков
  rationale: Последующее обращение к сыну «возьми своих сыновей» показывает, что вторая группа — сыновья сына, то есть внуки Товита. В основном тексте родство выражено естественно, а буквальная форма отмечена в сноске.
- source_word: Τέκνον
  choice: Сын мой
  rationale: τέκνον — тёплое семейное обращение. В данном контексте обращение направлено к родному сыну; «Сын мой» звучит естественно и достойно по-русски, сохраняя ласковый оттенок.
- source_word: λάβε τοὺς υἱούς σου
  choice: возьми своих сыновей
  rationale: Сохранено прямое значение повелительного λάβε без уточнения подразумеваемого дальнейшего действия.
- source_word: ἰδοὺ γεγήρακα
  choice: Вот, я состарился
  rationale: «Вот» передаёт призыв ἰδού обратить внимание, а «я состарился» сохраняет результативный оттенок греческого перфекта γεγήρακα.
- source_word: πρὸς τὸ ἀποτρέχειν ἐκ τοῦ ζῇν εἰμί
  choice: мне уже скоро предстоит уйти из жизни
  rationale: Оборот обозначает близость смерти, но выражает её эвфемистически. Русское «уйти из жизни» сохраняет этот смягчённый тон; «уже скоро предстоит» передаёт непосредственную близость события, не вводя оттенка добровольного решения.
theological_decisions:
- issue: Эвфемистическое обозначение приближающейся смерти
  choice: мне уже скоро предстоит уйти из жизни
  alternative: я скоро умру
  rationale: Греческий текст не употребляет прямой глагол «умирать», а говорит об уходе от жизни. Перевод сохраняет этот образ и не усиливает резкость высказывания.
- issue: Кого обозначают вторые «сыновья»
  choice: внуков
  alternative: его сыновей
  rationale: Фраза, обращённая к сыну, «возьми своих сыновей» контекстуально определяет этих лиц как сыновей сына Товита. Сноска сохраняет прозрачность формальной особенности оригинала.
