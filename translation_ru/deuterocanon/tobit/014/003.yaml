  text: He had grown very old[a]; and he called his son and his grandsons, and said to him, “Child, take your sons. Look, I have grown old[b], and I am about to depart from life.”
translation:
  language: ru
  text: 'Он достиг глубокой старости. Он позвал своего сына и внуков[a] и сказал сыну: «Сын мой, возьми своих сыновей. Вот, я состарился и близок к тому, чтобы уйти из жизни[b]».'
  philosophy: optimal-equivalence
