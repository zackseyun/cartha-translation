translation:
  language: ru
  text: И теперь, дитя[a], уйди из Ниневии, потому что всё, что сказал пророк Иона, непременно сбудется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сын»; греческое τέκνον — родственное обращение, которое в данном контексте может быть передано и так.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνον
  choice: дитя моё
  rationale: Филиальное обращение передано естественным для русского родительским выражением; слово не уточняет пол адресата, а притяжательное местоимение, подразумеваемое обращением, делает фразу по-русски живой и ясной.
- source_word: ἄπελθε
  choice: уйди
  rationale: Аористный императив выражает прямое побуждение покинуть место; «уйди» современно и точно передаёт отделение от Ниневии.
- source_word: ἀπὸ Νινευή
  choice: из Ниневии
  rationale: Предлог ἀπό обозначает удаление от города; в русском с глаголом «уйди» естественно употребить «из Ниневии».
- source_word: πάντως
  choice: непременно
  rationale: Наречие подчёркивает несомненность исполнения предсказанного.
- source_word: ἔσται
  choice: сбудется
  rationale: Буквально «будет», но применительно к пророческим словам русское «сбудется» ясно выражает их осуществление, не добавляя сведений о времени или способе.
- source_word: ἃ ἐλάλησεν
  choice: всё, о чём говорил
  rationale: Относительная конструкция обозначает содержание пророческой речи. «Всё, о чём говорил» естественно по-русски и сохраняет объём множественного ἃ.
- source_word: ὁ προφήτης Ἰωνᾶς
  choice: пророк Иона
  rationale: Прямое титульное наименование с сохранением греческого порядка слов.
theological_decisions:
- issue: Несомненность исполнения пророчества о Ниневии
  choice: «всё, о чём говорил пророк Иона, непременно сбудется»
  alternative: «непременно будет то, что сказал пророк Иона»
  rationale: Формулировка сохраняет подчёркнутую πάντως уверенность в исполнении пророческих слов, не уточняя сроки, обстоятельства или механизм исполнения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным, при этом сохранены прямое обращение, повеление и emphатическая уверенность исходного текста.
