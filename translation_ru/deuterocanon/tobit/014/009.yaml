  yaml_path: translation/deuterocanon/tobit/014/009.yaml
  text: But you, keep the law and the commandments, and become merciful and righteous, so that it may go well with you.
translation:
  language: ru
  text: Ты же соблюдай закон и предписания, стань милосердным и праведным, чтобы тебе было хорошо.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τήρησον
  choice: соблюдай
  rationale: Передаёт повеление хранить и исполнять закон, естественно звучит в современном русском языке.
- source_word: τὰ προστάγματα
  choice: предписания
  rationale: Сохраняет значение установленных повелений, не смешивая их с более общим словом «закон».
- source_word: γενοῦ
  choice: стань
  rationale: Передаёт значение становления, а не просто состояния, сохраняя акцент греческого аористного императива.
- source_word: φιλελεήμων
  choice: милосердным
  rationale: Естественно передаёт редкое греческое обозначение человека, расположенного к милосердию.
- source_word: δίκαιος
  choice: праведным
  rationale: Сохраняет нравственно-религиозный оттенок слова в контексте наставления о законе.
- source_word: ἵνα σοι καλῶς ἦν
  choice: чтобы тебе было хорошо
  rationale: Прямо и естественно передаёт цель или ожидаемый благой исход без излишнего уточнения его характера.
theological_decisions:
- issue: Связь соблюдения закона и благополучия
  choice: Сохранена целевая формулировка «чтобы тебе было хорошо»
  alternative: «и тогда всё у тебя будет хорошо»
  rationale: Греческое ἵνα выражает цель или ожидаемый результат; перевод не уточняет механизм этой связи и не превращает наставление в безусловную формулу воздаяния.
translation_notes:
  register: Современный литературный русский язык с достоинством наставления. «Ты же» сохраняет контрастное σὺ δέ; синтаксис прост и понятен обычному читателю.
