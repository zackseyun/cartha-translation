lexical_decisions:
- source_word: εὐλόγει
  choice: Благословляй
  rationale: Повелительное наклонение настоящего времени, 2-е лицо единственного числа. «Благословляй» сохраняет прямое значение и библейский оборот; «прославляй» возможно, но сужает смысл до хвалы.
- source_word: τὸν θεὸν
  choice: Бога
  rationale: Прямое дополнение с артиклем; по-русски имя «Бог» в данном контексте естественно употребляется без отдельной передачи артикля.
- source_word: τὸν βασιλέα
  choice: Царя
  rationale: Приложение к слову «Бога», обозначающее Его царский титул. Заглавная буква уместна для божественного титула.
- source_word: τὸν μέγαν
  choice: великого
  rationale: Наиболее прямое соответствие μέγας; сохраняет широкое значение величия, не сводя его только к могуществу.
theological_decisions:
- issue: Передача царского титула Бога
  choice: великого Царя
  alternative: великого царя
  rationale: Греческий текст ставит «Царя» в приложение к «Бога» и определяет Его как великого. Заглавная буква отмечает божественный титул, не добавляя к тексту нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного библейского звучания. Продолженная форма повеления «благословляй» передаёт греческий императив настоящего времени. Конечная запятая сохранена, поскольку фраза в предоставленном источнике синтаксически продолжается.
