base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/014.yaml
  text: Oh[a], blessed are those who love you; they will rejoice over your peace. Blessed are all who were grieved over your afflictions, because they will rejoice over you when they see all your glory; and my soul will rejoice forever.
translation:
  language: ru
  text: О, как блаженны те, кто любит тебя! Они возрадуются твоему миру. Блаженны все, кто скорбел о бедствиях, постигших тебя[a], потому что они возрадуются о тебе, увидев всю твою славу; и душа моя будет радоваться вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ударах», «карах» или «наказаниях». Греческое слово μάστιξ буквально может означать бич или удар, а переносно — тяжёлое страдание либо постигшую кару.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: блаженны
  rationale: Сохраняет возвышенную формулу благословения и религиозный оттенок греческого слова; «счастливы» было бы стилистически слабее.
- source_word: οἱ ἀγαπῶντές σε
  choice: любящие тебя
  rationale: Естественно передаёт субстантивированное причастие настоящего времени и продолжающееся отношение любви.
- source_word: χάρησονται / χαρήσονται
  choice: возрадуются
  rationale: Передаёт будущую радость и сохраняет словесный повтор греческого текста.
- source_word: ἐπὶ τῇ εἰρήνῃ σου
  choice: твоему миру
  rationale: Дательный после «возрадуются» естественно выражает основание или повод для радости; «мир» здесь допускает как покой, так и благополучие города.
- source_word: ὅσοι ἐλυπήθησαν
  choice: все, кто скорбел
  rationale: Передаёт пережитую скорбь без неестественной для русского буквальной пассивной конструкции.
- source_word: ἐπὶ ταῖς μάστιξίν σου
  choice: о постигших тебя бедствиях
  rationale: Передаёт переносное значение ударов и страданий, сохраняя направленность бедствий на олицетворённый город; буквальные и дисциплинарные оттенки отмечены в сноске.
- source_word: θεασάμενοι
  choice: увидев
  rationale: Деепричастие кратко и естественно сохраняет обстоятельственную связь греческого причастия с последующей радостью.
- source_word: πᾶσαν τὴν δόξαν σου
  choice: всю твою славу
  rationale: Прямо сохраняет полноту, выраженную πᾶσαν, и возвышенное значение δόξα.
- source_word: εὐφρανθήσεται
  choice: будет радоваться
  rationale: Передаёт продолжительную перспективу радости души в сочетании с «вовеки» и остаётся естественным современным русским выражением.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Краткое, традиционно возвышенное и понятное обозначение непреходящей длительности.
- source_word: ἡ ψυχή μου
  choice: душа моя
  rationale: Сохраняет образ внутреннего «я» и молитвенно-поэтический регистр оригинала.
theological_decisions:
- issue: К кому относятся местоимения второго лица женского рода
  choice: Обращение к олицетворённому Иерусалиму/Сиону без добавления имени в основной текст
  alternative: Обращение в более общем смысле к народу Божьему
  rationale: Контекст гимна говорит об Иерусалиме как о городе-женщине, имеющем мир, бедствия и славу; прямое «тебя/твоему» сохраняет форму текста и не устраняет возможную более широкую символическую отнесённость.
- issue: Смысл μάστιξίν
  choice: Бедствия, постигшие город
  alternative: Бичевания, удары, кары или наказания
  rationale: Слово допускает буквальные удары и переносные страдания. Основной текст использует естественное контекстуальное обозначение, а сноска сохраняет более резкие и богословски значимые варианты.
translation_notes:
  register: Современный литературный русский с достоинством гимнической речи. Восклицание после первой формулы делает начальное ὦ естественным по-русски; «блаженны» и «вовеки» поддерживают возвышенный, но понятный регистр. Женский род адресата следует контексту олицетворённого Иерусалима.
