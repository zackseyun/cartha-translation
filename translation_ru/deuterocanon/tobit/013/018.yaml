lexical_decisions:
- source_word: ῥῦμαι
  choice: улицы
  rationale: ῥύμη обозначает городскую улицу или переулок. «Улицы» естественно звучит по-русски и сохраняет олицетворение города.
- source_word: ἀλληλουιά
  choice: Аллилуия
  rationale: Греческий текст сохраняет литургическую транслитерацию еврейского возгласа; привычная русская форма «Аллилуия» передаёт это решение источника.
- source_word: αἴνεσιν
  choice: хвала
  rationale: Существительное означает хвалу; форма единственного числа сохраняет число греческого слова и подходит к торжественному возгласу.
- source_word: Εὐλογητός
  choice: Благословен
  rationale: В славословии это естественное предикативное наименование Бога, выражающее утверждение, а не пожелание.
- source_word: ὕψωσεν
  choice: возвысил
  rationale: Глагол ὑψόω означает «поднимать, возвышать»; «возвысил» сохраняет возвышенный регистр и прямое значение.
- source_word: πάντας τοὺς αἰῶνας
  choice: все века
  rationale: Необычное греческое выражение буквально говорит о «всех веках». Основной текст сохраняет его образ и смысловую напряжённость, не заменяя без пояснения наречием «вовеки».
theological_decisions:
- issue: Значение πάντας τοὺς αἰῶνας в заключительном славословии
  choice: все века
  alternative: «вовеки», «на протяжении всех веков» или «превыше всех веков»
  rationale: Буквальное значение слов — «все века», хотя в данном контексте возможно идиоматическое понимание вечного возвышения Бога. Необычная формулировка сохранена в тексте, а более гладкие истолкования отмечены в сноске.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным регистром. Сохранены олицетворение улиц, литургическое «Аллилуия» и необычная формулировка о «всех веках».
