  text: And all her streets will say[a], ‘Hallelujah and praise!’ saying, ‘Blessed is God, who has exalted all the ages.’
translation:
  language: ru
  text: 'И все её улицы возгласят[a]: «Аллилуия и хвала!» — и скажут: «Благословен Бог, который возвысил все века».'
