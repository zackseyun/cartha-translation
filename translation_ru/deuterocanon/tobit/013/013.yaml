lexical_decisions:
- source_word: χάρηθι
  choice: Радуйся
  rationale: Прямой и естественный повелительный призыв, сохраняющий значение греческого глагола и возвышенный библейский регистр.
- source_word: ἀγαλλίασαι
  choice: ликуй
  rationale: Передаёт усиленную, торжественную радость и не дублирует предшествующее «радуйся».
- source_word: ἐπὶ τοῖς υἱοῖς τῶν δικαίων
  choice: о сынах праведных
  rationale: Предлог с дательным обозначает предмет или повод радости; «о» здесь естественно по-русски. «Сынах» сохраняет явно мужскую форму греческого υἱοί.
- source_word: συναχθήσονται
  choice: соберутся
  rationale: Естественно передаёт будущую форму и собирательно-восстановительный смысл; русская возвратная форма допускает значение совместного собирания без уточнения деятеля.
- source_word: εὐλογήσουσιν
  choice: будут благословлять
  rationale: Сохраняет обычное библейское значение εὐλογέω и длительно-повторительный оттенок, естественный в данном контексте.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Стандартная передача божественного титула κύριος в иудейском Писании.
- source_word: τῶν δικαίων
  choice: праведных
  rationale: Сохраняет генитивную связь в необычном, но понятном выражении «Господа праведных», не превращая его в характеристику «праведный Господь».
theological_decisions:
- issue: Гендерно маркированное обозначение потомков в τοῖς υἱοῖς τῶν δικαίων
  choice: сынах праведных
  alternative: детях праведных
  rationale: В греческом тексте прямо употреблено «сыновья»; возможный более широкий смысл потомков отмечен в сноске, а не подменяет форму исходного текста.
- issue: Смысл τὸν κύριον τῶν δικαίων
  choice: Господа праведных
  alternative: праведного Господа; Господа, Праведника
  rationale: Наиболее прямое прочтение понимает τῶν δικαίων как родительный множественного числа, относящийся к Господу. Такая передача сохраняет подлинную необычность выражения и не навязывает иную синтаксическую трактовку.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Парные императивы переданы ритмично — «радуйся и ликуй»; необычное выражение «Господа праведных» сохранено ради смысловой и синтаксической прозрачности.
