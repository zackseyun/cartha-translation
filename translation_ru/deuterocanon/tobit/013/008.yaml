  terminology: «Благодарят Его» соответствует русскому управлению и богослужебному контексту. В сноске «исповедуются перед Ним» способно быть понято прежде всего как исповедание грехов, тогда как здесь альтернативный смысл глагола — исповедовать/признавать Бога или воздавать Ему хвалу. Формулировка сноски уточнена без догматического сужения.
