  text: Пусть все говорят и благодарят Его в Иерусалиме[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исповедуют Его»; или: «прославляют Его». Греческий глагол в зависимости от контекста может выражать любой из этих связанных с поклонением смыслов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λεγέτωσαν
  choice: пусть … возглашают
  rationale: Форма повелительного наклонения третьего лица множественного числа от λέγω. В гимническом контексте «возглашают» естественно передаёт публичную речь, не уточняя её содержание сверх греческого текста.
- source_word: πάντες
  choice: все
  rationale: Субстантивированное прилагательное передано кратко и буквально, с сохранением всеобщего охвата.
- source_word: ἐξομολογείσθωσαν
  choice: пусть … благодарят
  rationale: В библейском греческом глагол может означать исповедание, прославление или благодарение. В хвалебном контексте главы «благодарят» естественно передаёт наиболее вероятный смысл, а неоднозначность отмечена в сноске.
- source_word: αὐτῷ
  choice: Его
  rationale: Дательный падеж местоимения обозначает адресата благодарения; русское управление глагола «благодарить» требует винительного падежа. Заглавная буква указывает на Бога как референта.
- source_word: ἐν Ἱεροσολύμοις
  choice: в Иерусалиме
  rationale: Обычная современная русская передача обстоятельства места с ἐν и дательным падежом.
theological_decisions:
- issue: Значение ἐξομολογείσθωσαν в богослужебном контексте
  choice: благодарят
  alternative: исповедуются перед Ним; прославляют Его
  rationale: Доксологический контекст делает благодарение наиболее уместным основным значением, однако греческий глагол сохраняет более широкий диапазон смыслов, поэтому альтернативы указаны в сноске без догматического сужения.
translation_notes:
  register: Современный литературный русский язык с кратким гимническим звучанием. Параллельные повелительные формы объединены конструкцией «пусть все…». «Возглашают» выбрано вместо нейтрального «говорят» ради естественности в литургическом контексте, без добавления объекта речи.
