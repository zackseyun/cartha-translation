  yaml_path: translation/deuterocanon/tobit/013/004.yaml
  text: There declare his greatness[a], and exalt him before every living being; for he is our Lord[c][b], and he is our God and our Father forever.
translation:
  language: ru
  text: Там возвестите о Его величии[a] и превозносите Его перед всяким живущим[b], потому что Он — Господь наш, и Он — Бог и Отец наш во все века[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покажите Его величие»; греческий глагол может означать «показать» или «сделать известным», а существительное — также «величественность».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «перед всяким живущим». Выражение имеет широкий смысл, хотя в данном контексте прежде всего подразумеваются все живые люди.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вовеки». Буквально греческое выражение означает «во все века» и подчёркивает нескончаемую длительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖ
  choice: Там
  rationale: Прямо передаёт указание на место среди народов, связанное с контекстом предыдущего стиха, не добавляя пояснений.
- source_word: ὑποδείξατε
  choice: возвестите
  rationale: Аористный императив множественного числа. В контексте открытого прославления перед народами «возвестите» естественно передаёт смысл «покажите, сделайте известным».
- source_word: τὴν μεγαλοσύνην αὐτοῦ
  choice: о Его величии
  rationale: μεγαλοσύνη означает величие или величественность; «величие» ясно и сохраняет возвышенный тон.
- source_word: ὑψοῦτε αὐτόν
  choice: превозносите Его
  rationale: Настоящий императив выражает продолжающееся действие; «превозносите» естественно для речи о прославлении Бога и сохраняет образ возвышения.
- source_word: ἐνώπιον παντὸς ζῶντος
  choice: перед всяким живущим
  rationale: Сохраняет собирательно-дистрибутивную форму греческого выражения «перед всяким живым/живущим», не сужая её явно до людей.
- source_word: καθότι
  choice: потому что
  rationale: Ясно вводит основание для предшествующих повелений.
- source_word: κύριος ἡμῶν
  choice: Господь наш
  rationale: Традиционное и точное соответствие κύριος; постпозиция местоимения сохраняет торжественный исповедальный строй фразы.
- source_word: θεὸς αὐτὸς πατὴρ ἡμῶν
  choice: Он — Бог, Отец наш
  rationale: Сохраняет повтор αὐτός и тесное следование титулов «Бог» и «Отец наш», не добавляя отсутствующего при θεός местоимения ἡμῶν.
- source_word: εἰς πάντας τοὺς αἰῶνας
  choice: во все века
  rationale: Близко передаёт множественное число αἰῶνας и подчёркивает непрекращающуюся длительность; современному читателю выражение понятно в возвышенном библейском контексте.
theological_decisions:
- issue: Соотношение определений «Господь наш», «Бог» и «Отец наш»
  choice: «Он — Господь наш, и Он — Бог, Отец наш»
  alternative: «Он — наш Господь, и Он — наш Бог и наш Отец»
  rationale: Греческий текст прямо связывает ἡμῶν с κύριος и πατήρ, но не повторяет его при θεός, а αὐτός употребляет дважды. Выбранная форма сохраняет это строение и исповедальное накопление титулов, не сглаживая возможную аппозиционную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, молитвенно-исповедальным звучанием. Постпозиция в сочетаниях «Господь наш» и «Отец наш» намеренно сохраняет ритм и структуру греческого текста, оставаясь понятной современному читателю.
