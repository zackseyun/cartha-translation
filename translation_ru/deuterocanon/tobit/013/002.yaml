base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/002.yaml
  text: For he afflicts and shows mercy; he brings down to Hades and brings up[a], and there is no one who will escape his hand.
translation:
  language: ru
  text: Ибо Он наказывает и милует, низводит в царство мёртвых[a] и возводит, и никто не избежит Его руки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могилу»; буквально по-гречески: «в Аид».'
    reason: Сноска сохраняет буквальное наименование ᾅδης и указывает допустимый контекстуальный вариант, не отождествляя термин исключительно с адом как местом наказания.
lexical_decisions:
- source_word: μαστιγοῖ
  choice: наказывает
  rationale: Глагол буквально связан с бичеванием, но здесь обобщённо обозначает причиняемое Богом страдание или кару. «Наказывает» сохраняет строгость высказывания, не сводя образ к телесному бичеванию.
- source_word: ἐλεᾷ
  choice: милует
  rationale: Краткий и естественный русский эквивалент, сохраняющий смысл милосердия и чёткую антитезу с «наказывает».
- source_word: κατάγει
  choice: низводит
  rationale: Передаёт направленное движение вниз и сохраняет возвышенный библейский параллелизм с «возводит».
- source_word: εἰς ᾅδην
  choice: в царство мёртвых
  rationale: Передаёт греческий ᾅδης как область пребывания умерших, не отождествляя его без пояснения с местом вечного наказания. Буквальное греческое наименование отмечено в сноске.
- source_word: ἀνάγει
  choice: возводит
  rationale: Сохраняет формальную и смысловую противоположность глаголу κατάγει, не уточняя, идёт ли речь об избавлении от смертельной опасности или о возвращении из смерти.
- source_word: οὐκ ἔστιν ὃς ἐκφεύξεται
  choice: никто не избежит
  rationale: Естественно передаёт отрицательную конструкцию и сохраняет будущее время греческого ἐκφεύξεται.
- source_word: τὴν χεῖρα αὐτοῦ
  choice: Его руки
  rationale: Сохраняет конкретный библейский образ руки как выражения власти и могущества Бога.
theological_decisions:
- issue: Смысл нисхождения в ᾅδης и восхождения оттуда
  choice: Общее утверждение о власти Бога над смертью и царством мёртвых без однозначного уточнения механизма возвращения
  alternative: Избавление человека от близкой смерти либо прямое утверждение о воскресении из мёртвых
  rationale: Пара глаголов κατάγει и ἀνάγει выражает власть Бога над жизнью и смертью, однако сама формулировка не вынуждает выбирать между образом избавления от смертельной опасности и более прямым указанием на возвращение из смерти.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Антитетический параллелизм сохранён: «наказывает и милует», «низводит… и возводит». Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.'
