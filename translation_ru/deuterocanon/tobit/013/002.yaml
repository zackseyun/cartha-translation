  source_fidelity: 'Текст точно передаёт греческий оригинал: μαστιγοῖ / ἐλεᾷ отражены сбалансированной парой «наказывает и милует»; κατάγει / ἀνάγει — параллельной парой «низводит … и возводит»; будущее ἐκφεύξεται сохранено в «не избежит». Образ «Его руки» передан без подмены абстрактным понятием власти. Формулировка не навязывает толкование о воскресении, сохраняя широту греческого выражения.'
