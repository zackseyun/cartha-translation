  yaml_path: translation/deuterocanon/tobit/013/003.yaml
  text: Give thanks to him[a], O sons of Israel, before the nations, because he himself has scattered us among them.
translation:
  language: ru
  text: Благодарите Его[a], сыны Израиля, перед народами, потому что Он Сам рассеял нас среди них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Исповедуйте Его»; или: «Восхваляйте Его». Греческий глагол может выражать открытое признание, благодарение и хвалу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: Благодарите
  rationale: В библейском греческом глагол может означать открытое признание, благодарение или хвалу. В контексте обращения к Израилю перед народами «благодарите» естественно передаёт призыв, не связывая его с исповеданием греха; широта значения отмечена в сноске.
- source_word: αὐτῷ
  choice: Его
  rationale: Дательный падеж указывает на Бога как адресата благодарения; по-русски при глаголе «благодарить» требуется винительный падеж.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Сохраняется явно мужское множественное число греческого выражения и его торжественное звательное звучание; отдельная частица для передачи греческого артикля в функции обращения по-русски не нужна.
- source_word: ἐνώπιον τῶν ἐθνῶν
  choice: перед народами
  rationale: Передаёт буквальный пространственно-публичный смысл «в присутствии народов» и не смешивается с последующим «среди них».
- source_word: ὅτι
  choice: потому что
  rationale: 'Ясно передаёт причинную связь: рассеяние служит основанием для призыва.'
- source_word: αὐτὸς
  choice: Он Сам
  rationale: Сохраняет эмфатическое местоимение, не добавляя идеи исключительности.
- source_word: διέσπειρεν
  choice: рассеял
  rationale: Точно передаёт совершённое действие Бога и сохраняет библейски узнаваемый образ рассеяния Израиля.
- source_word: ἡμᾶς
  choice: нас
  rationale: Прямо передаёт объект действия; первое лицо включает говорящего в рассеянный Израиль.
- source_word: ἐν αὐτοῖς
  choice: среди них
  rationale: Местоимение относится к народам; «среди них» естественно обозначает пребывание между этими народами.
theological_decisions:
- issue: Приписывание рассеяния Израиля действию Бога
  choice: потому что Он Сам рассеял нас среди них
  alternative: ибо Он рассеял нас среди них
  rationale: Греческий текст прямо и с эмфазой приписывает рассеяние Богу. Перевод сохраняет это напряжённое богословское утверждение, не смягчая и не объясняя его.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Сыны Израиля» сохраняет форму исходного текста; синтаксис остаётся ясным для обычного современного читателя.
