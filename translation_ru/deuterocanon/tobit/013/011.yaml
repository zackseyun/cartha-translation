  yaml_path: translation/deuterocanon/tobit/013/011.yaml
  text: Many nations will come from far away to the name of the Lord God[a], carrying gifts in their hands, gifts for the King of heaven; generations of generations will give you exultation.
translation:
  language: ru
  text: Многие народы придут издалека к имени Господа Бога, неся в руках дары — дары Царю небесному; поколения поколений принесут тебе ликование.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поколение за поколением будет приносить тебе радость». Буквально по-гречески: «поколения поколений дадут тебе ликование».'
    reason: Лексико-стилистическая альтернатива для необычного оборота γενεαὶ γενεῶν δώσουσίν σοι ἀγαλλίαμα.
lexical_decisions:
- source_word: ἔθνη πολλὰ
  choice: многие народы
  rationale: ἔθνη обозначает народы или нации; «народы» естественно передаёт широкий международный охват и не вносит излишне конкретного противопоставления иудеев и язычников.
- source_word: μακρόθεν ἥξει
  choice: придут издалека
  rationale: Сохраняется пространственный смысл μακρόθεν и естественный для паломничества глагол движения; множественное число согласовано по нормам русского языка с «народы».
- source_word: πρὸς τὸ ὄνομα Κυρίου τοῦ θεοῦ
  choice: к имени Господа Бога
  rationale: Буквальная направительная конструкция сохраняет библейский образ приближения к Божьему имени и не сужает его до толкований «поклониться» или «из-за славы».
- source_word: δῶρα ἐν χερσὶν ἔχοντες
  choice: неся в руках дары
  rationale: Естественно передаёт сопутствующее действие и сохраняет конкретный образ даров в руках пришедших.
- source_word: καὶ δῶρα τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: дары Царю небесному
  rationale: Повтор слова «дары» сохранён как риторическое усиление, а дательный падеж ясно указывает получателя. Титул передан литературно и без парафраза.
- source_word: γενεαὶ γενεῶν
  choice: поколения поколений
  rationale: Сохранён необычный генитивный повтор с семитским поэтическим оттенком; более идиоматический вариант вынесен в примечание.
- source_word: δώσουσίν σοι ἀγαλλίαμα
  choice: принесут тебе ликование
  rationale: «Принесут» естественнее по-русски, чем буквальное «дадут», при этом сохраняется образ того, что поколения доставляют обращённой к ним стороне повод и состояние торжества. «Ликование» передаёт сильную радость ἀγαλλίαμα.
theological_decisions:
- issue: К кому относится местоимение σοι
  choice: Сохранено обращение «тебе», подразумевающее олицетворённый Иерусалим/Сион в контексте гимна
  alternative: Прямо назвать Иерусалим или понимать обращение как относящееся ко всему Израилю
  rationale: Контекст указывает на обращение к Иерусалиму, но подстановка имени в сам стих устранила бы поэтическую форму и сделала бы явным то, что греческий текст оставляет местоимением.
- issue: Смысл выражения «к имени Господа Бога»
  choice: Сохранён библейский образ движения к Божьему имени
  alternative: «Чтобы поклониться Господу Богу» или «привлечённые славой Господа Бога»
  rationale: Поклонение, вероятно, подразумевается, однако исходный текст говорит именно о движении «к имени»; буквальный образ сохраняет широту богословского смысла.
translation_notes:
  register: Современный литературный русский язык с приподнятым поэтическим звучанием. Сохранены библейский оборот «к имени» и намеренно необычное «поколения поколений»; тире помогает естественно передать подчёркнутый повтор слова «дары».
