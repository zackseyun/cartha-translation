base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/007.yaml
  text: I exalt my God[a], and my soul rejoices in the King of heaven, and it will exult in his greatness.
translation:
  language: ru
  text: Я превозношу Бога моего, и душа моя радуется Царю небес[a] и будет ликовать о Его величии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте эта часть фразы эллиптична, буквально: «и душа моя — Царю небес». Глагол «радуется» восполнен по поэтическому контексту; возможны и другие способы понять эту конструкцию.'
    reason: Альтернативное прочтение из-за отсутствия глагола в греческой клаузе.
lexical_decisions:
- source_word: ὑψῶ
  choice: превознесу
  rationale: Будущее время передаёт греческую форму, а «превознесу» сохраняет образ возвышения и естественно звучит в языке хвалы.
- source_word: ψυχή
  choice: душа моя
  rationale: Сохраняет явно названную в греческом тексте «душу» и поэтический, молитвенный строй фразы.
- source_word: βασιλεῖ τοῦ οὐρανοῦ
  choice: Царю небес
  rationale: Дательный падеж сохранён, а сочетание передаёт формальный титул и греческое родительное отношение без превращения его в прилагательное.
- source_word: ἀγαλλιάσεται
  choice: будет ликовать
  rationale: Передаёт будущее время и оттенок сильной, торжествующей радости.
- source_word: μεγαλοσύνην
  choice: величии
  rationale: «Величие» — прозрачное и широкое соответствие, уместное в славословии; предложное оформление необходимо для естественного русского управления.
- source_word: καὶ ἡ ψυχή μου τῷ βασιλεῖ τοῦ οὐρανοῦ
  choice: и душа моя возрадуется Царю небес
  rationale: В греческой клаузе нет выраженного глагола. «Возрадуется» восполняет вероятный поэтический смысл по контексту, а дательный «Царю» сохраняет форму исходного текста и не вводит пространственного образа.
theological_decisions:
- issue: Безглагольная средняя клауза
  choice: 'Понять её как поэтический эллипсис и восполнить глагол радости: «душа моя возрадуется Царю небес»'
  alternative: 'Передать буквально и без глагола: «и душа моя — Царю небес», либо восполнить иной глагол хвалы или принадлежности'
  rationale: Контекст гимна и следующий глагол ликования поддерживают смысл радости, но сам греческий текст не называет глагол; поэтому неоднозначность отмечена в сноске, а принадлежность Богу не утверждается как единственно возможный смысл.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным молитвенно-поэтическим звучанием. Формы «превознесу», «возрадуется» и «ликовать» различают оттенки хвалы и сильной радости; прописные буквы в божественном титуле и местоимении поддерживают традиционный русский библейский регистр.
