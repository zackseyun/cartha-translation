base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/009.yaml
  text: 'Jerusalem[a], city of the Holy One: he will scourge you for the works of your children[b], and again he will show mercy to the children of the righteous.'
translation:
  language: ru
  text: 'Иерусалим, город Святого[a]: Он подвергнет тебя бичеванию за дела твоих детей[b] и снова помилует детей праведных.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «город святого»; греческий родительный падеж допускает более общее понимание, однако в контексте, вероятнее всего, речь идёт о Боге.'
    reason: lexical_alternative
  - marker: b
    text: 'В обоих случаях буквально: «сыновей»; здесь переведено как «детей», поскольку слово употреблено в собирательном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἱεροσόλυμα
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города; в греческом это обращение.
- source_word: πόλις ἁγίου
  choice: город Святого
  rationale: Родительный падеж единственного числа естественнее всего указывает на Бога как Святого; приложение относится к Иерусалиму.
- source_word: μαστιγώσει
  choice: накажет тебя бичом
  rationale: Сохраняет яркий образ бичевания и одновременно ясно передаёт переносный смысл сурового наказания; местоимение «тебя» восполняется из обращения к Иерусалиму и требуется русским синтаксисом.
- source_word: ἐπὶ τὰ ἔργα
  choice: за дела
  rationale: Предлог с винительным выражает основание или причину наказания; по-русски «за дела» звучит естественно и точно.
- source_word: τῶν υἱῶν σου
  choice: твоих детей
  rationale: Хотя буквально сказано «сыновей», в олицетворённом обращении к Иерусалиму речь коллективно идёт о его жителях.
- source_word: πάλιν
  choice: затем снова
  rationale: Передаёт и последующую смену суда милостью, и значение повторности.
- source_word: ἐλεήσει
  choice: помилует
  rationale: Краткий, современный и богословски естественный эквивалент глагола со значением проявления милости.
- source_word: τοὺς υἱοὺς τῶν δικαίων
  choice: детей праведных
  rationale: «Детей» передаёт коллективное значение υἱούς, а субстантивированное δικαίων — категорию праведных людей.
theological_decisions:
- issue: Не названный прямо субъект глаголов «накажет» и «помилует»
  choice: В основном тексте употреблено «Он», подразумевающее Бога
  alternative: Оставить субъект формально неопределённым или перестроить фразу в безличную конструкцию
  rationale: В греческом субъект не выражен, однако контекст и выражение «город Святого» указывают на Бога как действующего. Русское предложение требует естественного обозначения субъекта; прописная буква прозрачно указывает на наиболее вероятный референт, не добавляя имени.
- issue: Значение ἁγίου
  choice: Святого как обозначение Бога
  alternative: «святого» в более общем или неопределённом смысле
  rationale: Контекст наиболее естественно поддерживает божественный референт, однако грамматическая форма сама по себе допускает более общее понимание; альтернатива сохранена в сноске.
- issue: Мужская родственная лексика υἱοί
  choice: «дети» в обоих случаях
  alternative: «сыновья» / «сыны»
  rationale: В поэтическом обращении к городу слово обозначает его жителей или потомков коллективно, а не только мужчин; «дети» точно передаёт референт и сохраняет параллелизм.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Обращение усилено восклицательным знаком; «накажет бичом» сохраняет исходный образ без архаичного глагола «бичевать». Союз «но» естественно обозначает контраст между судом и последующей милостью.
