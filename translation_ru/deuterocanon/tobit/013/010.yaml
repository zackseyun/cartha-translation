base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/010.yaml
  text: Give thanks well to the Lord, and bless the King of the ages, so that his tent may again be built for you with joy; and so that he may gladden within you the captives and love within you the afflicted for all the generations of the age.
translation:
  language: ru
  text: Благодари Господа как должно и благословляй Царя веков, чтобы Его шатёр вновь был с радостью построен для тебя, чтобы Он радовал в тебе пленных и любил в тебе бедствующих во все поколения века.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во все поколения века».'
    reason: Сохраняет необычную форму греческого выражения εἰς πάσας τὰς γενεὰς τοῦ αἰῶνος, не уточняя, о каком именно «веке» идёт речь.
lexical_decisions:
- source_word: ἐξομολόγου
  choice: Благодари
  rationale: В обращении к Господу глагол здесь естественно выражает благодарение и хвалу; «исповедуй» в современном русском неоправданно сужало бы смысл до признания грехов или вероисповедания.
- source_word: ἀγαθῶς
  choice: как должно
  rationale: Передаёт наречное значение «хорошо, достойно, надлежащим образом» естественнее, чем буквальное, но неидиоматичное «хорошо благодари».
- source_word: τὸν βασιλέα τῶν αἰώνων
  choice: Царя веков
  rationale: Сохраняет библейский титул и множественное число αἰώνων, не сводя его только к значению «вечный Царь».
- source_word: ἡ σκηνὴ αὐτοῦ
  choice: Его шатёр
  rationale: Сохраняет конкретный образ σκηνή; «храм» было бы толкованием, а «скиния» менее понятна обычному современному читателю.
- source_word: τοὺς ταλαιπώρους
  choice: бедствующих
  rationale: Передаёт людей, терпящих горе, тяготы и нужду, без излишнего сужения до больных или нищих.
theological_decisions:
- issue: Соотношение Божьего шатра и храма Иерусалима
  choice: Сохранён образ «шатра»
  alternative: «храм» или «скиния»
  rationale: Греческий текст прямо говорит σκηνή; замена на «храм» устранила бы образную напряжённость и внесла толкование.
- issue: Значение ἀγαπήσαι применительно к бедствующим
  choice: «любил»
  alternative: «благоволил» или «помиловал»
  rationale: Сохранено прямое значение «любить», не подменённое предполагаемым проявлением этой любви.
- issue: Местоименное ἐν σοὶ в обращении к городу
  choice: «среди тебя»
  alternative: «в тебе»
  rationale: «Среди тебя» естественно обозначает людей внутри персонифицированного города, сохраняя обращение к нему и не делая пленных частью его физического пространства.
translation_notes:
  register: Современный литературный русский с достоинством библейского гимна. Императивы переданы прямо; синтаксический ряд целевых форм сохранён без добавления конфессиональной терминологии.
