  text: All who hate you are accursed; all who love you will be blessed forever.
translation:
  language: ru
  text: Прокляты все, кто ненавидит тебя, и благословенны будут все, кто любит тебя, вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικατάρατοι
  choice: прокляты
  rationale: Предикативное прилагательное обозначает тех, кто находится под проклятием. Краткая форма «прокляты» естественно передаёт торжественную декларацию и сохраняет отсутствие связки в первой части греческого текста.
- source_word: μισοῦντές
  choice: кто ненавидит
  rationale: Субстантивированное причастие означает «те, кто ненавидит». В русском обобщённо-личная конструкция с единственным числом после «кто» звучит естественно.
- source_word: εὐλογημένοι
  choice: благословенны
  rationale: В данном противопоставлении слово говорит о получении благословения, а не просто похвалы; «благословенны» сохраняет религиозный и декларативный смысл.
- source_word: ἀγαπῶντές
  choice: кто любит
  rationale: Субстантивированное причастие прямо противопоставлено «ненавидит»; нейтральное «любит» точно и естественно передаёт смысл.
- source_word: ἔσονται
  choice: будут
  rationale: Явная форма будущего времени во второй части сохранена, тогда как в первой части греческая связка отсутствует.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Устойчивое русское наречие передаёт неограниченную длительность выражения и соответствует возвышенному поэтическому регистру молитвенного гимна.
theological_decisions:
- issue: Сила формул проклятия и благословения по отношению к Иерусалиму, к которому обращено «тебя»
  choice: Передать как прямые и весомые утверждения о проклятии и благословении, не смягчая их
  alternative: Истолковать как простое общественное неодобрение или одобрение
  rationale: Греческие ἐπικατάρατοι и εὐλογημένοι образуют сильное религиозное противопоставление. Перевод сохраняет его, не уточняя сверх текста источник или механизм проклятия и благословения.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейско-поэтическим звучанием. Параллелизм двух частей сохранён; «вовеки» выбрано как нормативное и уместное здесь слово, а не как тяжёлый архаизм.
