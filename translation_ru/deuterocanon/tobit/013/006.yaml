base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/006.yaml
  text: If you turn to him with all your heart and with all your soul[a], to do what is true before him, then he will turn to you and will certainly not hide his face from you. See what he will do with you, and give thanks to him with your whole being; bless the Lord of righteousness[d][c][b], and exalt the King of the ages.
translation:
  language: ru
  text: Если вы обратитесь к Нему всем сердцем и всей душой и будете поступать пред Ним истинно[a], тогда и Он обратится к вам и никогда не скроет от вас Своего лица. Посмотрите, что Он совершит с вами, и возблагодарите Его всем своим существом[b]; благословите Господа праведности[c] и превознесите Царя веков[d]. Я и в земле моего плена благодарю Его и возвещаю Его силу и величие грешным народам. Обратитесь, грешники, и поступайте праведно пред Ним! Кто знает, не благоволит ли Он к вам и не окажет ли вам милость?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «делать истину пред Ним»; то есть жить и поступать истинно или верно перед Богом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всем вашим телом». Речь идёт о всецелом, в том числе телесно выраженном благодарении.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Господа справедливости».'
    reason: alternative_reading
  - marker: d
    text: 'Или: «вечного Царя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν ἐπιστρέψητε ... τότε ἐπιστρέψει
  choice: если вы обратитесь… тогда и Он обратится
  rationale: 'Повтор одного глагола сохраняет заложенную в греческом тексте взаимность: обращению людей отвечает Божье обращение к ним.'
- source_word: ἐν ὅλῃ καρδίᾳ ὑμῶν καὶ ἐν ὅλῃ τῇ ψυχῇ
  choice: всем сердцем и всей душой
  rationale: Естественная русская библейская формула полной преданности, точно передающая обе части греческого выражения.
- source_word: ποιῆσαι ἐνώπιον αὐτοῦ ἀλήθειαν
  choice: поступать пред Ним истинно
  rationale: Передаёт семитизированное «делать истину» понятным современным языком, не сужая ἀλήθεια исключительно до верности.
- source_word: οὐ μὴ κρύψῃ τὸ πρόσωπον αὐτοῦ ἀφʼ ὑμῶν
  choice: уже не скроет от вас Своего лица
  rationale: «Уже не» в данном условно-восстановительном контексте естественно выражает усиленное греческое отрицание οὐ μή; образ сокрытого лица сохранён.
- source_word: θεάσασθε ἃ ποιήσει μεθʼ ὑμῶν
  choice: посмотрите, что Он сделает для вас
  rationale: Императив передан прямо и современно; μεθ’ ὑμῶν здесь понимается как благотворное действие Бога по отношению к адресатам.
- source_word: ἐξομολογήσασθε / ἐξομολογοῦμαι
  choice: возблагодарите / благодарю
  rationale: В гимническом окружении глагол обозначает открытое благодарение и хвалу, а не исповедание грехов.
- source_word: ἐν ὅλῳ τῷ σώματι ὑμῶν
  choice: всем своим существом
  rationale: Греческое «всем телом» обозначает всецелое, воплощённое благодарение; русский вариант передаёт совокупный смысл, а буквальное значение отмечено в сноске.
- source_word: τὸν κύριον τῆς δικαιοσύνης
  choice: Господа праведности
  rationale: Сохраняется генитивный божественный титул и широкий нравственно-богословский смысл δικαιοσύνη.
- source_word: τὸν βασιλέα τῶν αἰώνων
  choice: Царя веков
  rationale: Формальный вариант сохраняет множественное число αἰώνων и возвышенный славословный регистр.
- source_word: δεικνύω τὴν ἰσχὺν καὶ τὴν μεγαλοσύνην αὐτοῦ
  choice: возвещаю Его силу и величие
  rationale: В обращённом к народам свидетельстве «возвещаю» естественно передаёт публичное явление или провозглашение Божьих свойств.
- source_word: εἰ θελήσει ὑμᾶς
  choice: не благоволит ли Он к вам
  rationale: Необычная конструкция с θέλω и прямым объектом выражает благосклонную волю Бога по отношению к людям; русский оборот сохраняет это значение без грубого буквального «захочет вас».
- source_word: ποιήσει ἐλεημοσύνην ὑμῖν
  choice: окажет ли вам милость
  rationale: В отношении Божьего действия ἐλεημοσύνη означает милость или милосердный поступок, а не человеческую милостыню.
theological_decisions:
- issue: Значение δικαιοσύνη в титуле Бога
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет широкий нравственный и богословский диапазон термина; возможный судебно-общественный оттенок «справедливости» указан в сноске.
- issue: Условный призыв и Божья благосклонность в заключительном вопросе
  choice: Кто знает, не благоволит ли Он к вам и не окажет ли вам милость?
  alternative: Кто знает, пожелает ли Он вас и сотворит ли вам милость?
  rationale: 'Сохранены вопросительность и неопределённость греческого εἰ: текст призывает грешников обратиться, не превращая Божью милость в механически гарантированный результат.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формы «пред Ним», «Царь веков» и образ Божьего лица сохраняют поэтический и молитвенный строй, тогда как синтаксис и основные глаголы остаются понятными современному читателю. В перевод включён весь предоставленный греческий текст стиха, в том числе отсутствующая в английском консультационном слое заключительная часть.
