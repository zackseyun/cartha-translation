translation:
  language: ru
  text: И улицы Иерусалима будут вымощены бериллом, карбункулом и камнем из Суфира[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «камнем из Офира», если Σουφείρ понимать как название местности Офир, а не передавать непосредственно форму греческого текста.'
    reason: alternative_reading
lexical_decisions:
- source_word: πλατεῖαι
  choice: улицы
  rationale: Субстантивированное слово обозначает широкие городские улицы или открытые пространства. В данном описании Иерусалима естественнее всего русское «улицы»; добавление «широкие» возможно, но не обязательно для передачи смысла.
- source_word: βηρύλλῳ
  choice: бериллом
  rationale: Традиционное название драгоценного камня сохраняет конкретность и образное богатство греческого текста, не навязывая спорной современной минералогической идентификации.
- source_word: ἄνθρακι
  choice: карбункулом
  rationale: В перечне драгоценных камней ἄνθραξ означает сияющий красный самоцвет, традиционно называемый карбункулом, а не обычный уголь.
- source_word: λίθῳ ἐκ Σουφεὶρ
  choice: камнем из Суфира
  rationale: Передан греческий топоним Σουφείρ без молчаливого отождествления с Офиром. Единственное число «камнем» соответствует форме λίθῳ и естественно обозначает материал.
- source_word: ψηφολογηθήσονται
  choice: будут вымощены
  rationale: В строительном контексте глагол означает выкладывание поверхности камнями, галькой или мозаикой. «Будут вымощены» ясно и естественно передаёт архитектурный смысл.
