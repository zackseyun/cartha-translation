base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/013/001.yaml
  text: Then Tobit wrote a prayer of rejoicing and said[a], “Blessed is the living God forever, and his kingdom.”
translation:
  language: ru
  text: 'И Товит написал молитву, исполненную ликования, и сказал[a]: «Благословен живой Бог вовеки, и царство Его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст заканчивается краткими словами «и царство Его», без явного сказуемого. Иногда подразумеваемый смысл передают как «и благословенно царство Его» или связывают эти слова с «вовеки»; здесь краткость оригинала сохранена.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγραφεν
  choice: написал
  rationale: Прямо передаёт введение к записанной молитве; «сочинил» добавило бы отсутствующий в греческом литературный оттенок.
- source_word: προσευχὴν εἰς ἀγαλλίασιν
  choice: молитву ликования
  rationale: Сохраняет значение радостного торжества и естественно обозначает характер молитвы, не превращая оборот в обстоятельство образа действия.
- source_word: Εὐλογητὸς
  choice: Благословен
  rationale: Обычная и уместная для библейского славословия передача греческого прилагательного.
- source_word: ὁ θεὸς ὁ ζῶν
  choice: живой Бог
  rationale: Точно воспроизводит устойчивое библейское именование и греческую атрибутивную конструкцию.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Естественная возвышенная передача выражения неограниченной длительности в контексте славословия.
- source_word: βασιλεία
  choice: царство
  rationale: Сохраняет предметное существительное и традиционное библейское звучание; «царствование» было бы допустимо, но более истолковывающим.
theological_decisions:
- issue: Как понимать безглагольное заключение καὶ ἡ βασιλεία αὐτοῦ
  choice: 'Сохранить эллиптическое продолжение: «и царство Его»'
  alternative: «и благословенно царство Его»; «и царство Его — вовеки»
  rationale: В данном греческом тексте сказуемое отсутствует, а фраза обрывается. Добавление сказуемого устранило бы подлинную неоднозначность и внесло бы толкование, которого источник прямо не выражает.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Начальное «И» сохранено как соответствие греческому Καί и как связка с предшествующим повествованием. Эллипсис в конце намеренно не сглажен.
