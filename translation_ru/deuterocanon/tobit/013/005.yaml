  source_fidelity: 'В целом перевод точно передаёт последовательность будущих действий, причинный смысл выражения ἐν ταῖς ἀδικίαις ἡμῶν, образ бичевания, милость, собирание «из всех народов» и намеренный переход от первого лица множественного числа ко второму. Однако «где бы вы ни были рассеяны среди них» неудачно дублирует локативные компоненты: «где» уже отсылает к народам, а «среди них» повторяет эту отсылку. Более прямое «в которых бы вы ни были рассеяны» естественно передаёт οὗ ἐὰν ... ἐν αὐτοῖς, сохраняя неопределённый оттенок и второе лицо.'
  naturalness: Фраза выдержана в современном литературном русском с уместным библейским регистром. «Будет бичевать», «неправды», «помилует» и «соберёт» стилистически согласованы. Исправление последнего оборота устраняет тяжеловесное и несколько тавтологичное «где бы ... среди них».
  terminology: «Бичевать» сохраняет образ μαστιγώσει без богословского сглаживания. «Неправды» — допустимое литературно-библейское соответствие ἀδικίαις во множественном числе. «Народы» верно передаёт ἔθνη в данном контексте; специальное значение «язычники» здесь не навязывается.
