  text: And he will scourge us for our injustices[a], and again he will show mercy and gather us from all the nations among which you were scattered.
translation:
  language: ru
  text: И Он будет бичевать нас за наши неправды, и снова помилует и соберёт нас из всех народов, в которых бы вы ни были рассеяны.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте здесь происходит переход от «нас/наши» к «вы были рассеяны». Некоторые переводы согласуют всё предложение по первому лицу — «мы были рассеяны», однако здесь смена лица сохранена.
    reason: Сохранение грамматического и риторического сдвига исходного текста.
lexical_decisions:
- source_word: μαστιγώσει
  choice: будет бичевать
  rationale: Передаёт буквальный образ сурового наказания бичом, не ослабляя его до общего «накажет»; в данном контексте выражение понимается метафорически как Божье взыскание.
- source_word: ἐν ταῖς ἀδικίαις ἡμῶν
  choice: за наши неправды
  rationale: Предлог ἐν здесь передаёт основание наказания. «Неправды» сохраняет множественное число ἀδικίαις и охватывает несправедливые и неправедные поступки, не заменяя их более общим словом «грехи».
- source_word: πάλιν ἐλεήσει
  choice: снова помилует
  rationale: «Снова» сохраняет обозначенный πάλιν поворот от наказания к милости, а «помилует» естественно и ёмко передаёт действие ἐλεήσει.
- source_word: συνάξει ἡμᾶς
  choice: соберёт нас
  rationale: Прямо передаёт образ собирания рассеянного народа и сохраняет местоимение первого лица множественного числа.
- source_word: ἐξ πάντων τῶν ἐθνῶν
  choice: из всех народов
  rationale: В контексте речь идёт о народах, среди которых произошло рассеяние; перевод не навязывает здесь специального противопоставления Израиля и язычников.
- source_word: οὗ ἐὰν σκορπισθῆτε ἐν αὐτοῖς
  choice: где бы вы ни были рассеяны среди них
  rationale: Оборот с ἐάν сохраняет неопределённо-уступительный оттенок «где бы ни», страдательный залог и переход исходного текста ко второму лицу множественного числа.
theological_decisions:
- issue: Переход от первого лица множественного числа ко второму в последней части стиха
  choice: 'Сохранить: «нас… наши… нас… где бы вы ни были рассеяны»'
  alternative: 'Согласовать всё предложение по первому лицу: «где бы мы ни были рассеяны»'
  rationale: Греческий текст переходит от ἡμᾶς/ἡμῶν к σκορπισθῆτε. Этот риторический сдвиг не следует молча устранять, поскольку он может отражать обращение говорящего к рассеянному народу.
- issue: Соотношение наказания и милости
  choice: 'Сохранить последовательность двух действий без поясняющего богословского смягчения: Бог бичует и снова милует'
  alternative: Передать наказание более общим или смягчённым словом либо добавить причинно-следственное истолкование
  rationale: Текст ставит рядом суровое взыскание за неправды и последующее милосердное собирание; перевод сохраняет это напряжение без конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Будет бичевать» сохраняет силу греческого образа, а «неправды» остаётся понятным без узкоконфессиональной терминологии. Повтор союза «и» отражает структуру греческой фразы.
