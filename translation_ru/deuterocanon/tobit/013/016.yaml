lexical_decisions:
- source_word: οἰκοδομηθήσεται
  choice: будет построен
  rationale: Будущее страдательное от οἰκοδομέω прямо означает «будет построен». Контекст допускает восстановление города, но сама греческая форма не выражает приставочного значения «пере-/вос-».
- source_word: σαπφείρῳ καὶ σμαράγδῳ
  choice: из сапфира и изумруда
  rationale: Дательный падеж обозначает строительный материал или средство; русская конструкция с «из» естественно передаёт образ сооружения из драгоценных материалов.
- source_word: λίθῳ ἐντίμῳ
  choice: из драгоценного камня
  rationale: Сохранено единственное число греческого выражения, допускающее собирательно-вещественное понимание; «драгоценный камень» естественно передаёт ценность материала.
- source_word: τὰ τείχη σου
  choice: стены твои
  rationale: 'Местоимение второго лица явно присутствует в греческом тексте: речь непосредственно обращена к Иерусалиму. Постпозиция местоимения поддерживает возвышенный поэтический регистр без архаизации.'
- source_word: πύργοι
  choice: башни
  rationale: Обычное и понятное обозначение оборонительных башен городской стены.
- source_word: προμαχῶνες
  choice: передовые укрепления
  rationale: Слово обозначает вынесенные вперёд оборонительные сооружения. Этот вариант точнее передаёт пространственно-фортификационный смысл, чем более широкое «укрепления».
- source_word: χρυσίῳ καθαρῷ
  choice: из чистого золота
  rationale: Дательный материала передан конструкцией с «из»; «чистое золото» точно и естественно соответствует χρυσίον καθαρόν.
theological_decisions:
- issue: Образ будущего восстановления и славы Иерусалима
  choice: Сохранить поэтическое обещание будущего великолепного устроения Иерусалима, не уточняя, буквально или символически следует понимать драгоценные материалы.
  alternative: Истолковать стих как буквальное архитектурное описание либо явно обозначить его как символ восстановленной славы.
  rationale: Греческий текст даёт величественный строительный образ, но не требует выбора между буквальным, гиперболическим и символическим прочтением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Прямое обращение к Иерусалиму сохранено в словах «стены твои». Тире восполняют подразумеваемое сказуемое и делают параллельные образы ясными без добавления нового содержания.
