base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/002.yaml
  text: As they were traveling on the road[a], they came by evening to the Tigris River, and they camped there.
translation:
  language: ru
  text: Продолжая путь[a], они к вечеру пришли к реке Тигр и расположились там на ночлег.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Краткая греческая редакция здесь сообщает лишь, что к вечеру путники достигли Тигра и расположились там на ночлег. В пространной редакции и семитской традиции сцена расширена: уже здесь начинается эпизод с рыбой, который в краткой редакции следует далее.'
    reason: textual_variant
lexical_decisions:
- source_word: πορευόμενοι τὴν ὁδόν
  choice: Продолжая путь
  rationale: Естественно передаёт обстоятельственный причастный оборот и продолжающееся движение; слово ὁδός в этом сочетании обозначает путь, а не обязательно буквальную дорогу.
- source_word: ἦλθον ἑσπέρας
  choice: к вечеру пришли
  rationale: Сохраняет временную привязку греческого выражения и естественный русский порядок слов; формулировка не уточняет сверх текста, прибыли ли они до наступления вечера или уже вечером.
- source_word: ἐπὶ τὸν Τίγριν ποταμόν
  choice: к реке Тигр
  rationale: ἐπί с направлением указывает на прибытие к реке; современная русская форма названия — «Тигр».
- source_word: ηὐλίζοντο
  choice: расположились там на ночлег
  rationale: Глагол означает остановиться или разместиться на ночь. Такой перевод точнее общего «остановились» и не навязывает образ устроенного лагеря.
- source_word: ἐκεῖ
  choice: там
  rationale: Прямая и естественная передача наречия места.
