translation:
  language: ru
  text: И она перестала плакать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Использованный здесь греческий текст очень краток: «И она перестала плакать». В более пространной традиции, связанной с семитскими текстами, далее в этом стихе начинается рассказ о путешествии («юноша отправился в путь…»), но этих слов нет в основном греческом тексте, переведённом здесь.'
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Союз непосредственно связывает краткое предложение с предшествующим повествованием; «И» прозрачно передаёт греческое καὶ.
- source_word: ἐπαύσατο
  choice: перестала
  rationale: Аорист медиального залога от παύω обозначает прекращение продолжавшегося действия. В сочетании с инфинитивным по функции оборотом «перестала плакать» это естественно звучит по-русски.
- source_word: κλαίουσα
  choice: плакать
  rationale: Причастие настоящего времени от κλαίω указывает на продолжавшийся плач, который прекратился. Русская конструкция «перестала плакать» естественно передаёт смысл греческого сочетания.
