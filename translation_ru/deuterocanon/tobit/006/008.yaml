  text: And he said to him[a], “The heart and the liver—if a demon or an evil spirit troubles anyone, burn these as smoke before a man or a woman, and he or she will no longer be troubled.”
translation:
  language: ru
  text: 'И он сказал ему: «Сердце и печень: если кого-нибудь беспокоит демон или злой дух, их следует сжечь[a], чтобы пошёл дым, перед мужчиной или женщиной — и его или её больше не будут беспокоить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дать им дымиться». Греческий глагол обозначает действие, при котором органы сжигают, чтобы они дали дым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδία
  choice: сердце
  rationale: В сочетании с печенью слово обозначает буквальный орган рыбы, а не средоточие мыслей или чувств.
- source_word: ἧπαρ
  choice: печень
  rationale: Употреблено в прямом анатомическом значении; речь идёт об органе рыбы.
- source_word: ἐάν τινα ὀχλῇ
  choice: если кого-нибудь беспокоит
  rationale: Передаёт причинение мучительного беспокойства, не конкретизируя его характер сверх греческого текста.
- source_word: δαιμόνιον
  choice: демон
  rationale: Сохраняет отличие от следующего выражения «злой дух».
- source_word: πνεῦμα πονηρόν
  choice: злой дух
  rationale: Прямо передаёт сочетание и не смешивает его с отдельным словом «демон».
- source_word: ταῦτα δὲ καπνίσαι
  choice: ими нужно окурить
  rationale: Русский глагол естественно выражает воздействие дымом от сжигаемых органов; способ получения дыма пояснён в сноске.
- source_word: ἐνώπιον ἀνθρώπου ἢ γυναικός
  choice: окурить мужчину или женщину
  rationale: В контексте действия «перед» человеком по-русски естественно передаётся как окуривание человека; при этом сохранено явное упоминание мужчины и женщины.
- source_word: οὐ μηκέτι ὀχληθῇ
  choice: больше не будет испытывать беспокойства
  rationale: Передаёт усиленное отрицание дальнейшего беспокойства и сохраняет смысловую перекличку с первым употреблением ὀχλέω.
theological_decisions:
- issue: Характер утверждения о демоническом воздействии и средстве против него
  choice: Передать слова как прямое наставление внутри повествования, сохранив сверхъестественную лексику.
  alternative: Истолковать всё как фольклорный образ или медицинскую символику.
  rationale: Греческий текст прямо говорит о демоне или злом духе и предписывает окуривание; перевод не должен ни рационализировать, ни догматически расширять это утверждение.
- issue: Обозначение пола в ἀνθρώπου ἢ γυναικός
  choice: Сохранить явное «мужчину или женщину».
  alternative: Обобщить как «человека».
  rationale: Источник намеренно называет мужчину и женщину отдельно; перевод сохраняет эту форму выражения.
translation_notes:
  register: Современный литературный русский язык с ясной повествовательной интонацией. Конструкция «ими нужно окурить» звучит естественно и достойно, а сноска сохраняет буквальный образ сжигаемых и дымящихся органов.
