base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/018.yaml
  text: Then the demon will smell it and flee[a], and it will never return forever. But when you go in to her, rise, both of you, and cry out to the merciful God, and he will save you and have mercy on you. Do not fear, because she had been prepared for you from eternity, and you will save her, and she will go with you, and I suppose that you will have children by her. And when Tobias heard these things, he kissed her[d][c][b], and his soul was bound to her very strongly.
translation:
  language: ru
  text: Тогда демон почует запах и убежит и уже не вернётся вовеки[a]. Когда же ты приблизишься к ней[b], встаньте оба и воззовите к милосердному Богу, и он спасёт вас и помилует. Не бойся, ведь она была предназначена тебе издревле[c]. Ты спасёшь её, она пойдёт с тобой, и, полагаю, у тебя будут от неё дети. Услышав это, Товия поцеловал её, и его душа крепко к ней привязалась[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не вернётся во век века» — усиленное выражение, означающее окончательное, постоянное невозвращение.'
    reason: lexical_alternative
  - marker: b
    text: В данном брачном контексте выражение может подразумевать, что Товия приближается к Сарре как муж к жене, то есть супружескую близость.
    reason: cultural_note
  - marker: c
    text: 'Или: «от вечности». Греческое выражение может обозначать как далёкую древность, так и вечный горизонт.'
    reason: alternative_reading
  - marker: d
    text: 'Буквально: «душа его крепко прилепилась к ней» — образ глубокой и прочной привязанности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσφρανθήσεται
  choice: почу́ет запах
  rationale: Сохраняет конкретное значение восприятия запаха и естественно звучит по-русски в данном повествовательном контексте.
- source_word: τὸ δαιμόνιον
  choice: демон
  rationale: Прямой и точный эквивалент греческого обозначения злого сверхъестественного существа.
- source_word: οὐκ ἐπανελεύσεται τὸν αἰῶνα τοῦ αἰῶνος
  choice: уже не вернётся вовеки
  rationale: Передаёт усиленное и окончательное отрицание без неестественной для русского речи тавтологии.
- source_word: προσπορεύῃ αὐτῇ
  choice: приблизишься к ней как к жене
  rationale: Ясно передаёт супружеский смысл выражения в контексте брачной ночи, не прибегая к двусмысленной русской кальке.
- source_word: ἐγέρθητε ἀμφότεροι
  choice: встаньте оба
  rationale: Сохраняет прямое повеление и торжественный, но современный регистр.
- source_word: βοήσατε πρὸς τὸν ἐλεήμονα θεόν
  choice: воззовите к милосердному Богу
  rationale: Глагол передаёт настойчивое обращение за помощью; «воззовите» соответствует достоинству библейского повествования.
- source_word: σώσει ὑμᾶς καὶ ἐλεήσει
  choice: Он спасёт вас и помилует
  rationale: Сохраняет оба греческих глагола и их богословскую выразительность без поясняющего расширения.
- source_word: ἡτοίμασμένη ἦν ἀπὸ τοῦ αἰῶνος
  choice: была предназначена тебе издревле
  rationale: «Предназначена» естественно выражает предварительное приготовление в рамках Божьего замысла, а «издревле» сохраняет временную неоднозначность выражения, которое может указывать на далёкую древность либо вечный горизонт.
- source_word: σὺ αὐτὴν σώσεις
  choice: ты спасёшь её
  rationale: Сохраняет повтор того же глагола спасения; ближайший контекст связывает его с избавлением от смертельной угрозы демона.
- source_word: πορεύσεται μετὰ σοῦ
  choice: она пойдёт с тобой
  rationale: Прямой и естественный эквивалент без неоправданного уточнения характера пути.
- source_word: ὑπολαμβάνω
  choice: полагаю
  rationale: Передаёт обозначенную говорящим уверенную оценку, не превращая её в безусловное пророчество.
- source_word: ἐξ αὐτῆς παιδία
  choice: у тебя будут от неё дети
  rationale: Естественно по-русски обозначает детей, рождённых в этом браке.
- source_word: ἡ ψυχὴ αὐτοῦ ἐκολλήθη αὐτῇ σφόδρα
  choice: всей душой глубоко к ней привязался
  rationale: Передаёт образ сильной внутренней привязанности; добавление «всей душой» сохраняет явное упоминание ψυχή, не создавая тяжеловесной кальки.
theological_decisions:
- issue: Временной смысл ἀπὸ τοῦ αἰῶνος
  choice: издревле
  alternative: от вечности
  rationale: Греческое выражение допускает как значение отдалённой древности, так и вечного горизонта. Основной текст сохраняет эту напряжённость более широким словом «издревле», а примечание указывает сильную альтернативу.
- issue: Смысл слов «ты спасёшь её»
  choice: сохранить глагол «спасёшь» в повествовательном смысле избавления от демонической смертельной угрозы
  alternative: защитишь её; даруешь ей духовное спасение
  rationale: Непосредственный контекст говорит об избавлении Сарры от демона. Формулировка сохраняет богословски весомый глагол, но не навязывает более позднее доктринальное содержание.
- issue: Степень уверенности в словах ὑπολαμβάνω
  choice: полагаю
  alternative: знаю; предсказываю
  rationale: Текст формально представляет это как суждение говорящего, поэтому перевод не усиливает его до безусловного пророчества.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис упрощён там, где буквальная греческая цепочка союзов была бы тяжеловесна, но последовательность действий и ключевые повторы сохранены. Заглавные местоимения по отношению к Богу не используются, кроме начального «Он» по правилам предложения; это избегает конфессионально маркированной орфографии.
