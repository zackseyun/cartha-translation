  yaml_path: translation/deuterocanon/tobit/006/017.yaml
  text: And when you enter into the bridal chamber[a], take some of the incense ashes and place on them some of the fish’s heart and liver, and make smoke with them[b],
translation:
  language: ru
  text: И когда войдёшь в брачную комнату, возьми пепел от благовоний[a], положи на него часть сердца и печени рыбы и сделай так, чтобы пошёл дым[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пепел благовоний».'
    reason: lexical_alternative
  - marker: b
    text: То есть вызови дым, положив на пепел части сердца и печени рыбы; греческий глагол означает именно образование дыма, а не просто горение.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυμφῶνα
  choice: брачную комнату
  rationale: Слово обозначает помещение, предназначенное для новобрачных и брачного ложа. «Брачная комната» ясно передаёт смысл и звучит естественно в современном русском языке.
- source_word: λήμψῃ
  choice: возьми
  rationale: В последовательности практических указаний глагол означает взять предмет для дальнейшего употребления.
- source_word: τέφραν θυμιαμάτων
  choice: пепел от благовоний
  rationale: τέφρα означает «пепел», а θυμιαμάτων — благовония или ароматические вещества, которые сжигали. Оборот «пепел от благовоний» естественно передаёт греческое сочетание, не превращая его без достаточных оснований в «пепел из кадильницы».
- source_word: ἐπιθήσεις
  choice: положи на него
  rationale: Глагол означает положить сверху; местоимение «него» относится к пеплу и делает связь компонентов ясной по-русски.
- source_word: ἀπὸ τῆς καρδίας καὶ τοῦ ἥπατος τοῦ ἰχθύος
  choice: часть сердца и печени рыбы
  rationale: 'Предлог ἀπό здесь имеет разделительное значение: следует взять некоторое количество от сердца и печени, а не обязательно использовать органы целиком.'
- source_word: καπνίσεις
  choice: сделай так, чтобы пошёл дым
  rationale: Глагол конкретно указывает на образование дыма. Эта передача сохраняет физическое действие и не добавляет ещё не названную в стихе цель — изгнание духа, принесение жертвы или окуривание определённого помещения.
theological_decisions:
- issue: Характер действия, выраженного καπνίσεις
  choice: Описать действие как образование дыма, не истолковывая его цель.
  alternative: «сожги их как приношение» или «окури комнату»
  rationale: В данном стихе названо физическое действие; его результат раскрывается далее. Поэтому перевод не должен заранее придавать ему жертвенный или прямо экзорцистский смысл.
translation_notes:
  register: Современный литературный русский язык с простой, достойной формой наставления. Сохранена последовательность будущих форм греческого текста посредством естественного для русского повелительного изложения. Завершающая запятая оставлена, поскольку стих синтаксически продолжается далее.
