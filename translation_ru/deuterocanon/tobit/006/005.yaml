  text: And the angel said to him, “Cut open the fish, and after taking the heart and the liver and the gall, put them away safely.”
translation:
  language: ru
  text: 'И ангел сказал ему: «Разрежь рыбу, вынь сердце, печень и желчь[a] и надёжно сохрани их».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может обозначать желчь как жидкость; само по себе оно не уточняет, имеется ли в виду жидкость или желчный пузырь.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάτεμε
  choice: Разрежь
  rationale: Императив ἀνατέμνω означает «разрезать, вскрыть». В контексте речь идёт о вскрытии рыбы для извлечения внутренних органов; «разрежь» естественно и конкретно передаёт действие.
- source_word: τὸν ἰχθύν
  choice: рыбу
  rationale: Прямое дополнение с артиклем; в русском контексте определённость уже ясна, поэтому дополнительное указательное слово не требуется.
- source_word: λαβὼν
  choice: вынь
  rationale: Аористное причастие обозначает действие, предшествующее основному повелению θὲς. Координация повелительных форм естественна по-русски, а «вынь» точно выражает извлечение названных частей из разрезанной рыбы.
- source_word: τὴν καρδίαν
  choice: сердце
  rationale: Обычное анатомическое значение.
- source_word: τὸ ἧπαρ
  choice: печень
  rationale: Обычный анатомический термин.
- source_word: τὴν χολὴν
  choice: желчь
  rationale: χολή означает «желчь»; это прямой и понятный русский эквивалент. Уточнение «желчный пузырь» было бы более узким, чем греческое слово.
- source_word: θὲς ἀσφαλῶς
  choice: надёжно сохрани их
  rationale: Буквально сочетание означает «положи/помести безопасно, надёжно». В данном контексте органы откладываются для последующего употребления, поэтому «надёжно сохрани» ясно передаёт цель действия, не добавляя способа хранения.
theological_decisions:
- issue: Значение ὁ ἄγγελος
  choice: ангел
  alternative: вестник
  rationale: Хотя ἄγγελος может обозначать вестника, в повествовательном контексте Товита этот персонаж является ангельским существом. «Ангел» передаёт прямой смысл рассказа без дополнительных догматических уточнений.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным библейским звучанием. Последовательность действий передана естественными однородными повелениями; смысл предшествования, заложенный в аористном причастии, остаётся очевидным из порядка глаголов. Местоимение «их» грамматически согласуется с перечисленными предметами как совокупностью.
