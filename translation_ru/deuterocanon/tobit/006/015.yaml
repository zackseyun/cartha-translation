base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/015.yaml
  text: And now I am my father's only one[a], and I am afraid that if I go in, I will die, just as the former ones did, because a demon loves her, and it harms no one except those who approach her. And now I am afraid that I may die and bring down the life of my father and my mother in grief because of me to their grave[c][b]; and they have no other son who will bury them.
translation:
  language: ru
  text: И теперь я у отца один[a]. Я боюсь, что, войдя к ней, умру, как и прежние, потому что демон любит её[b] и не причиняет вреда никому, кроме тех, кто приближается к ней. И теперь я боюсь, что умру и из-за меня сведу жизнь моего отца и моей матери с горем в их могилу[c]. А другого сына, который похоронит их, у них нет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «я один у отца»; по смыслу Товия — его единственный сын, что прямо подтверждается в конце стиха.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст буквально говорит: «демон любит её», выражая его зловещую, собственническую привязанность к Сарре.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «сведу жизнь моего отца и моей матери с горем из-за меня в их могилу» — то есть стану причиной того, что они умрут от горя.'
    reason: cultural_note
lexical_decisions:
- source_word: μόνος τῷ πατρί
  choice: я у отца один
  rationale: Передаёт, что Товия — единственный оставшийся у отца ребёнок, не добавляя слово «сын» там, где оно отсутствует в этой фразе; сыновство прямо названо далее.
- source_word: φοβοῦμαι μὴ εἰσελθὼν ἀποθάνω
  choice: боюсь, что, войдя к ней, умру
  rationale: Естественно передаёт конструкцию страха с μή и связывает опасность со вступлением к Сарре; дополнение «к ней» ясно из контекста.
- source_word: οἱ πρότεροι
  choice: прежние
  rationale: Сохраняет краткость и некоторую неявность греческого выражения; по контексту речь о прежних мужьях Сарры.
- source_word: δαιμόνιον
  choice: демон
  rationale: Прямое обозначение личного враждебного духовного существа в повествовательном мире книги.
- source_word: φιλεῖ αὐτήν
  choice: любит её
  rationale: Сохраняет прямое и намеренно напряжённое значение φιλέω; зловредный, собственнический характер этой привязанности следует из контекста.
- source_word: ἀδικεῖ
  choice: причиняет вред
  rationale: В данном контексте передаёт фактическое губительное действие демона яснее, чем буквальное «поступает несправедливо».
- source_word: τῶν προσαγόντων αὐτῇ
  choice: тех, кто приближается к ней
  rationale: Сохраняет широкую формулировку греческого причастия, не ограничивая её явно браком или брачной комнатой.
- source_word: κατάξω τὴν ζωὴν ... εἰς τὸν τάφον αὐτῶν
  choice: жизнь моего отца и моей матери с горем сойдёт в могилу
  rationale: Сохраняет образ нисхождения жизни родителей в могилу и делает причинную связь с говорящим естественной по-русски.
- source_word: μετʼ ὀδύνης
  choice: с горем
  rationale: Кратко и естественно передаёт скорбь и душевную боль.
- source_word: υἱὸς ἕτερος οὐχ ὑπάρχει αὐτοῖς ὃς θάψει αὐτούς
  choice: другого сына, который похоронит их, у них нет
  rationale: Естественная русская конструкция, сохраняющая сыновний долг погребения и будущую направленность действия.
theological_decisions:
- issue: Природа δαιμόνιον
  choice: личный демон, губящий тех, кто приближается к Сарре
  alternative: обобщённое «злой дух»
  rationale: Греческий текст и сюжет изображают конкретное личное духовное существо; «демон» сохраняет это значение.
- issue: Значение φιλεῖ αὐτήν
  choice: «любит её» с сохранением лексической напряжённости
  alternative: «одержим ею» или «привязан к ней»
  rationale: Прямой перевод не устраняет парадокс зловредной любви и не навязывает тексту дополнительного психологического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Сохранены повтор «И теперь я боюсь» в смысловой форме, резкое утверждение «демон любит её» и образ нисхождения жизни родителей в могилу. Синтаксис слегка упрощён ради ясности, без устранения исходной богословской и лексической напряжённости.
