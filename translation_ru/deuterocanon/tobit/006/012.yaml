  yaml_path: translation/deuterocanon/tobit/006/012.yaml
  text: I will speak about her[a], so that she may be given to you as a wife, because her inheritance falls to you, and you alone are from her family[b]; and the young woman is beautiful and sensible.
translation:
  language: ru
  text: Я поговорю о ней, чтобы её отдали тебе в жёны, потому что её наследство причитается тебе[a], и ты один — из её рода[b]; а девушка красива и благоразумна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её наследство полагается тебе» либо «право на её наследство переходит к тебе». Греческое выражение указывает на юридическое право или обязанность, связанные с родством.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ты один из её родственников».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλήσω περὶ αὐτῆς
  choice: Я поговорю о ней
  rationale: Будущее время λαλέω и περὶ с родительным падежом прямо обозначает разговор о ней. Русское «поговорю о ней» естественно и не добавляет явно не выраженного значения «буду ходатайствовать за неё».
- source_word: τοῦ δοθῆναί σοι αὐτὴν εἰς γυναῖκα
  choice: чтобы её отдали тебе в жёны
  rationale: Артикулированный инфинитив с τοῦ передаёт цель; «отдали тебе в жёны» сохраняет страдательную конструкцию и естественно выражает брачный смысл.
- source_word: σοὶ ἐπιβάλλει ἡ κληρονομία αὐτῆς
  choice: её наследство причитается тебе
  rationale: ἐπιβάλλει здесь указывает, что наследство по праву родства достаётся или полагается адресату. «Причитается тебе» передаёт юридический оттенок, не превращая выражение в пространное толкование.
- source_word: σὺ μόνος εἶ ἐκ τοῦ γένους αὐτῆς
  choice: ты один происходишь из её рода
  rationale: ἐκ сохраняет значение происхождения, а γένος обозначает род или круг родственников. Формулировка близка к греческой и не уточняет сверх текста, в каком именно смысле он «один».
- source_word: τὸ κοράσιον
  choice: девушка
  rationale: В контексте предполагаемого брака речь идёт о молодой женщине брачного возраста; «девушка» естественно и не звучит ни по-детски, ни архаично.
- source_word: καλὸν
  choice: красива
  rationale: В описании предполагаемой невесты καλός естественно обозначает внешнюю красоту.
- source_word: φρόνιμόν
  choice: благоразумна
  rationale: φρόνιμος обозначает рассудительность, практическую мудрость и здравое суждение; «благоразумна» сохраняет этот смысл в достойном литературном регистре.
theological_decisions:
- issue: Связь брака и наследства в контексте родственного права
  choice: потому что её наследство причитается тебе и ты один происходишь из её рода
  alternative: потому что её наследство принадлежит тебе и ты единственный из её родственников
  rationale: Выбранный текст сохраняет юридико-социальную связь между родством, наследством и предлагаемым браком, но не вводит отсутствующего в греческом тексте подробного объяснения обычая и не превращает саму женщину в предмет наследования.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным тоном. Синтаксис следует ходу греческой фразы, но остаётся естественным для обычного читателя; юридический оттенок наследственной формулы сохранён без конфессионального истолкования.
