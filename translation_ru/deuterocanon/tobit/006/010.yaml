lexical_decisions:
- source_word: Ὡς δὲ
  choice: Когда же
  rationale: Сочетание вводит следующий эпизод повествования и выражает временной переход; «когда же» естественно передаёт обе функции.
- source_word: προσήγγισαν
  choice: они приблизились
  rationale: Аорист обозначает приближение к месту; этот глагол точно и естественно передаёт направленное движение, не утверждая, что путники уже вошли в город.
- source_word: τῇ Ῥάγῃ
  choice: к Раге
  rationale: Дательный падеж при глаголе приближения обозначает место, к которому направлялись путники. Название Ῥάγη передано принятой русской библейской формой «Рага»; после предлога «к» — «Раге».
