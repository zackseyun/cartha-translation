  text: Then the young man said to the angel[a], “Azariah, brother, I have heard that the girl has been given to seven men[b], and that all of them were hindered in the bridal chamber.”
translation:
  language: ru
  text: 'Тогда юноша сказал ангелу: «Азария, брат, я слышал, что эту девушку выдали замуж за семерых мужчин[a] и что все они были остановлены в брачном покое[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за семерых мужей». Греческое слово может означать как мужчину, так и мужа; брачный контекст допускает более узкий смысл.'
    reason: lexical_alternative
  - marker: b
    text: Греческая фраза сжато говорит, что всем им воспрепятствовали в брачном покое. Из контекста книги известно, что прежние женихи не смогли завершить брак, поскольку погибли там.
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: юноша
  rationale: В данном контексте Товия уже достиг брачного возраста; «юноша» естественно передаёт смысл без неуместного оттенка малолетства.
- source_word: τῷ ἀγγέλῳ
  choice: ангелу
  rationale: В повествовании речь идёт об ангельском существе, поэтому контекстуальное значение ἄγγελος передано прямо.
- source_word: ἀδελφέ
  choice: брат
  rationale: Сохранена прямая форма обращения; здесь она может выражать близость, не обязательно буквальное родство.
- source_word: ἀκήκοα
  choice: я слышал
  rationale: Русское «я слышал» естественно выражает сохраняющийся результат услышанного, передаваемый греческим перфектом.
- source_word: τὸ κοράσιον
  choice: эту девушку
  rationale: «Девушка» — современное и соответствующее брачному контексту обозначение; указательное «эту» естественно в отсылке к уже обсуждаемой Сарре.
- source_word: δεδόσθαι
  choice: отдавали
  rationale: В брачном контексте δίδωμι означает отдавать женщину замуж. Многократная форма по-русски согласуется с семью последовательными браками, не вводя слова «замуж» непосредственно в текст.
- source_word: ἑπτὰ ἀνδράσιν
  choice: семи мужчинам
  rationale: Сохранено более широкое значение ἀνήρ — «мужчина»; брачный контекст допускает значение «муж», отмеченное в сноске.
- source_word: ἐν τῷ νυμφῶνι
  choice: в брачном покое
  rationale: Это ясный и достойный современный эквивалент обозначения помещения для новобрачных.
- source_word: ἀποκωλῦσαι
  choice: встретили препятствие
  rationale: Греческий глагол выражает воспрепятствование и в данной сжатой конструкции не называет прямо ни действие, которому помешали, ни гибель мужчин.
theological_decisions:
- issue: Насколько явно обозначить участь прежних женихов Сарры
  choice: Передать ἀποκωλῦσαι нейтрально как «встретили препятствие»
  alternative: «были убиты», «погибли» или «не смогли приблизиться к ней»
  rationale: Непосредственно греческий текст употребляет глагол препятствования, а не убийства. Более широкий контекст объясняет, что мужчины погибли, однако основной текст сохраняет сдержанность и неоднозначность данного стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сжатость и неопределённость греческой фразы сохранены; контекстуальная гибель прежних женихов пояснена только в сноске.
