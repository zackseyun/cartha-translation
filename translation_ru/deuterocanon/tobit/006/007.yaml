  text: And the young man said to the angel[a], “Azariah, brother, what are the liver and the heart and the gall of the fish for?”
translation:
  language: ru
  text: 'И юноша сказал ангелу: «Брат Азария, для чего нужны печень, сердце и желчь рыбы?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: юноша
  rationale: В повествовательном контексте Товия уже достаточно взрослый, чтобы путешествовать и действовать самостоятельно; «юноша» передаёт его молодость, не создавая впечатления маленького ребёнка.
- source_word: τῷ ἀγγέλῳ
  choice: ангелу
  rationale: Хотя ἄγγελος может означать и «вестник», здесь речь идёт об ангельском спутнике Товии, и контекст прямо поддерживает значение «ангел».
- source_word: Ἀζαρία
  choice: Азария
  rationale: Имя передано принятой русской библейской формой; звательный характер выражен конструкцией прямого обращения.
- source_word: ἀδελφέ
  choice: брат
  rationale: Сохранено буквальное обращение «брат», которое здесь выражает близость и уважение, а не утверждает буквальное родство.
- source_word: τί ἐστιν
  choice: для чего нужны
  rationale: Буквально выражение означает «что это?», но следующий ответ показывает, что вопрос касается назначения и применения названных частей рыбы; русский вопрос о цели естественно передаёт этот смысл.
- source_word: τὸ ἧπαρ
  choice: печень
  rationale: Обычное анатомическое значение слова.
- source_word: ἡ καρδία
  choice: сердце
  rationale: Обычное анатомическое значение слова.
- source_word: ἡ χολή
  choice: желчь
  rationale: Русское «желчь» естественно охватывает значение χολή как желчи, то есть соответствующей жидкости; отдельная оговорка о варианте «bile/gall», существенная для английского, по-русски не требуется.
- source_word: τοῦ ἰχθύος
  choice: рыбы
  rationale: Родительный падеж указывает, что перечисленные части принадлежат рыбе; в русском он естественно относится ко всему ряду.
theological_decisions:
- issue: Обращение ἀδελφέ к ангельскому спутнику
  choice: Сохранено буквальное «брат»
  alternative: Передать как «друг» либо опустить обращение
  rationale: 'Стих не утверждает буквального родства Товии с ангелом: это обычная форма дружеского и уважительного обращения. Однако сохранение слова «брат» лучше передаёт лексику и социальный оттенок греческого текста, не снимая возможного напряжения.'
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным тоном. Формулировка «для чего нужны» передаёт подразумеваемый вопрос о назначении органов; обращение «Брат Азария» сохраняет порядок и лексику источника без архаизации.
