  text: But the angel said to him, “Grab the fish.” So the boy seized the fish and threw it up onto the land.
translation:
  language: ru
  text: 'Но ангел сказал ему: «Хватай рыбу!» Юноша схватил рыбу и выбросил её на сушу.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπιλαβοῦ τοῦ ἰχθύος
  choice: «Хватай рыбу!»
  rationale: Императив ἐπιλαβοῦ означает энергично взяться или ухватиться за что-либо; краткое «хватай» естественно передаёт срочность команды.
- source_word: τὸ παιδάριον
  choice: «юноша»
  rationale: В повествовательном контексте обозначает молодого Товию; «юноша» звучит естественнее и достойнее, чем буквальное «мальчик» или уменьшительное «отрок».
- source_word: ἀνέβαλεν αὐτὸν ἐπὶ τὴν γῆν
  choice: «выбросил её на сушу»
  rationale: Глагол ἀναβάλλω здесь описывает направленное вверх и наружу движение из воды; «выбросил ... на сушу» ясно передаёт действие, а «суша» естественно противопоставлена воде.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза краткая и динамичная, соответствующая напряжённому действию. Местоимение согласовано с русским женским родом слова «рыба», хотя в греческом ἰχθύς мужского рода.
