  source_fidelity: 'Греч. Ἐπιλαβοῦ τοῦ ἰχθύος точно передано энергичным повелением «Хватай рыбу!». τὸ παιδάριον в данном повествовательном контексте допустимо передано как «юноша». «схватил рыбу и выбросил её на сушу» передаёт ἐκράτησεν... καὶ ἀνέβαλεν αὐτὸν ἐπὶ τὴν γῆν: рыба удержана, затем выброшена из воды на землю. Смысловых добавлений или утрат нет.'
