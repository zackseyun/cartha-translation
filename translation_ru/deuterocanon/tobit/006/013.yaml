base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/013.yaml
  text: And now listen to me[a], and I will speak to her father; and when we return from Rages, we will arrange the marriage. For I know that Raguel will certainly not give her to another man contrary to the law of Moses, or he will incur death[b], because it is fitting for you to receive the inheritance rather than any other man.
translation:
  language: ru
  text: 'А теперь послушай меня: я поговорю с её отцом, и, когда мы возвратимся из Раг, устроим свадьбу. Ведь я знаю, что Рагуил ни за что не отдаст её другому мужчине вопреки закону Моисея — иначе он будет подлежать смертной казни[a], — потому что тебе подобает получить наследство прежде любого другого мужчины[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по закону Моисея ... или он будет должен смерть». В контексте речь идёт о том, что, отдав её другому, Рагуил нарушил бы закон и подлежал бы смерти; слово «иначе» передаёт эту подразумеваемую связь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «потому что тебе подобает получить наследство, чем всякому человеку». Это несколько шероховатое греческое выражение означает, что перед любым другим мужчиной преимущественное притязание принадлежит Товии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄκουσόν μου
  choice: послушай меня
  rationale: Повелительная форма призывает внимательно выслушать говорящего; «послушай меня» естественно передаёт этот смысл по-русски.
- source_word: λαλήσω τῷ πατρὶ αὐτῆς
  choice: я поговорю с её отцом
  rationale: Будущее время λαλέω означает речь или разговор; русское «поговорю с» естественнее буквального «буду говорить» и не уточняет содержание беседы.
- source_word: ὑποστρέψωμεν
  choice: мы возвратимся
  rationale: 'Сочетание ὅταν с аористом сослагательного наклонения указывает на будущее обстоятельство: «когда мы возвратимся».'
- source_word: ποιήσωμεν τὸν γάμον
  choice: устроим свадьбу
  rationale: Греческое выражение буквально означает «совершим брак» и может относиться к устройству брака или проведению свадьбы. Выбран естественный русский эквивалент без сведения смысла лишь к празднованию.
- source_word: οὐ μὴ δῷ
  choice: ни за что не отдаст
  rationale: Конструкция οὐ μή с сослагательным наклонением выражает усиленное отрицание; «ни за что не отдаст» сохраняет эту эмфазу.
- source_word: ἀνδρὶ ἑτέρῳ
  choice: другому мужчине
  rationale: ἀνήρ может означать мужчину или мужа. Поскольку речь идёт о предполагаемом браке, нейтральное «другому мужчине» ближе к форме источника.
- source_word: κατὰ τὸν νόμον Μωυσῆ
  choice: вопреки закону Моисея
  rationale: Буквально κατὰ обычно передаётся как «по, согласно», однако в связи с усиленным отрицанием и последующей угрозой смерти смысл состоит в нарушении закона. «Вопреки» ясно передаёт контекстуальную силу выражения.
- source_word: ὀφειλέσει θάνατον
  choice: будет повинен смерти
  rationale: Буквально выражение означает «будет должен смерть» и указывает на смертную ответственность. «Будет повинен смерти» сохраняет юридико-нравственную окраску и звучит естественно и торжественно.
- source_word: τὴν κληρονομίαν
  choice: наследство
  rationale: В греческом стоит определённый артикль без выраженного притяжательного местоимения, поэтому перевод не добавляет «её».
- source_word: σοὶ καθήκει λαβεῖν
  choice: тебе подобает получить
  rationale: καθήκει выражает то, что надлежит, подобает или причитается. «Подобает получить» сохраняет напряжение между уместностью и правом, не превращая его в узкий юридический термин.
- source_word: ἢ πάντα ἄνθρωπον
  choice: прежде любого другого мужчины
  rationale: Буквальная форма «чем всякий человек» по-гречески шероховата; в контексте это сравнительное утверждение о преимущественном притязании Товии перед любым другим мужчиной.
theological_decisions:
- issue: Юридическая сила обязанности Рагуила по закону Моисея
  choice: Рагуил не может отдать Сарру другому мужчине, не нарушив закон и не став повинным смерти.
  alternative: Рагуил не отдаст её другому мужчине согласно закону Моисея.
  rationale: Положение κατὰ τὸν νόμον Μωυσῆ допускает формально буквальное «согласно закону», но следующая фраза об ответственности за смерть показывает, что подразумевается нарушение закона. Основной текст передаёт этот контекстуальный смысл, а сноска сохраняет буквальную форму.
- issue: Характер притязания Товии на наследство
  choice: Товии подобает получить наследство прежде любого другого мужчины.
  alternative: Товия имеет исключительное юридическое право на наследство.
  rationale: καθήκει может обозначать как подобающее, так и должное. Перевод не усиливает выражение до однозначного технического заявления об исключительном праве, сохраняя смысл первоочерёдности.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским достоинством. Синтаксис сделан ясным для обычного читателя; усиленное отрицание, юридическая серьёзность и неоднозначность καθήκει сохранены. Имена переданы в привычной русской библейской форме: Раги, Рагуил.'
