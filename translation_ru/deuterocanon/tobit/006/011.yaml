  yaml_path: translation/deuterocanon/tobit/006/011.yaml
  text: The angel said to the young man, “Brother, today we will lodge with Raguel. He is your relative, and he has a daughter named Sarah.”
translation:
  language: ru
  text: 'Ангел сказал юноше: «Брат, сегодня мы остановимся на ночлег у Рагуила. Он твой родственник, и у него есть дочь по имени Сарра».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδαρίῳ
  choice: юноше
  rationale: В данном контексте Товия уже достаточно взрослый для далёкого путешествия и брака; «юноша» естественно передаёт возраст и положение, не создавая впечатления ребёнка.
- source_word: Ἀδελφέ
  choice: Брат
  rationale: Сохранено прямое братское обращение греческого текста без замены на более общее «друг».
- source_word: σήμερον
  choice: сегодня
  rationale: Прямой и естественный современный эквивалент временного наречия.
- source_word: αὐλισθησόμεθα
  choice: мы остановимся на ночлег
  rationale: Глагол обозначает остановку или размещение на ночь; перевод не уточняет без основания, будет ли это ночёвка под открытым небом или в доме.
- source_word: παρὰ Ῥαγουήλῳ
  choice: у Рагуила
  rationale: παρά с дательным здесь указывает на пребывание у человека, вероятно в его доме; по-русски «у Рагуила» звучит кратко и естественно.
- source_word: συγγενής
  choice: родственник
  rationale: Нейтрально и точно обозначает родственную связь, не конкретизируя её степень.
- source_word: θυγάτηρ
  choice: дочь
  rationale: Прямой эквивалент однозначного термина родства.
- source_word: ὄνομα Σάρρα
  choice: дочь по имени Сарра
  rationale: Естественная русская передача греческой именной конструкции с сохранением смысла.
