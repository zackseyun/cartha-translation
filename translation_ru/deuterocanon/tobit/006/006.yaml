base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/006.yaml
  text: And the young man did as the angel told him. Then they roasted the fish and ate it[a], and both of them traveled on until they came near Ecbatana.
translation:
  language: ru
  text: Юноша сделал так, как сказал ему ангел. Затем они зажарили рыбу и съели её. Оба продолжали путь, пока не приблизились к Экбатанам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст говорит, что они «приблизились к Экбатанам»; это не обязательно означает, что они уже вошли в город.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: юноша
  rationale: В данном повествовательном контексте Товия уже достиг брачного возраста; «юноша» передаёт его молодость, не создавая впечатления, что речь идёт о малом ребёнке.
- source_word: ἐποίησεν ... ὡς εἶπεν αὐτῷ ὁ ἄγγελος
  choice: сделал так, как сказал ему ангел
  rationale: Естественная современная формулировка, точно передающая исполнение сказанного и не усиливающая εἶπεν до значения формального приказа.
- source_word: τὸν δὲ ἰχθὺν ὀπτήσαντες ἔφαγον
  choice: затем они зажарили рыбу и съели её
  rationale: Причастная конструкция естественно передана последовательностью действий; «зажарили» ясно обозначает приготовление рыбы на огне.
- source_word: ὥδευον ἀμφότεροι
  choice: оба продолжали путь
  rationale: Имперфект передаёт продолжающееся путешествие, а «оба» сохраняет прямое указание на двух путников.
- source_word: ἕως ἤγγισαν ἐν Ἐκβατάνοις
  choice: пока не приблизились к Экбатанам
  rationale: ἤγγισαν означает приближение, а не обязательно прибытие или вход в город. Русское управление «к Экбатанам» естественно передаёт общий смысл несколько необычного греческого сочетания с ἐν.
