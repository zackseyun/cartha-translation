translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Частица «и тут» естественно подчёркивает внезапность нападения, выраженную последовательностью событий и глаголом ἀνεπήδησεν. Перевод сохраняет волевое значение ἐβουλήθη и не заменяет его более сильным утверждением о попытке.
