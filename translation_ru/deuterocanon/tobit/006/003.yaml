  text: Then the young man went down to wash himself[a], and a fish leaped up from the river and tried to swallow the young man.
translation:
  language: ru
  text: Юноша спустился, чтобы омыться, и из реки выпрыгнула рыба, которая хотела проглотить его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ παιδάριον
  choice: юноша / его
  rationale: В данном повествовательном контексте речь идёт о Товии, уже способном самостоятельно путешествовать; «юноша» естественнее, чем «ребёнок» или «мальчик». При повторном упоминании использовано местоимение, чтобы избежать тяжеловесного повтора в русском.
- source_word: κατέβη
  choice: спустился к воде
  rationale: Глагол передаёт движение вниз. Добавление «к воде» естественно обозначает цель движения, ясно заданную контекстом реки, не утверждая, что юноша уже вошёл в воду.
- source_word: περικλύσασθαι
  choice: чтобы умыться
  rationale: Средний залог указывает на омовение самого себя. «Умыться» передаёт это естественно и не предполагает полного погружения, которое могло бы подразумевать «искупаться».
- source_word: ἀνεπήδησεν
  choice: выпрыгнула
  rationale: Передаёт внезапное резкое движение рыбы вверх и наружу из реки в естественной русской форме.
- source_word: ἰχθύς
  choice: рыба
  rationale: Первое упоминание неопределённого участника; в русском языке неопределённость не требует артикля и понятна из контекста.
- source_word: ἀπὸ τοῦ ποταμοῦ
  choice: из реки
  rationale: Для движения рыбы наружу русское «из реки» конкретно и естественно передаёт исходную точку.
- source_word: ἐβουλήθη
  choice: хотела
  rationale: Глагол прямо обозначает волю, желание или намерение. «Хотела» сохраняет эту смысловую широту и не усиливает выражение до фактически предпринятой попытки.
- source_word: καταπεῖν
  choice: проглотить
  rationale: Прямо передаёт значение «проглотить целиком», не усиливая образ до более экспрессивного «пожрать».
