base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/006/016.yaml
  text: But the angel said to him[a], “Do you not remember the words that your father commanded you about taking a wife from your own kin? And now listen to me, brother, because she will be your wife, and pay no attention to the demon, for tonight she will be given to you as a wife.”
translation:
  language: ru
  text: 'Но ангел сказал ему: «Разве ты не помнишь, что отец велел тебе взять жену из своего рода? А теперь послушай меня, брат: она станет твоей женой; не обращай внимания на демона[a], потому что этой ночью она будет отдана тебе в жёны».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не беспокойся о демоне». Буквально греческая идиома: «не имей никакого слова о демоне»; то есть не придавай ему значения и не считайся с ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέμνησαι
  choice: разве ты не помнишь
  rationale: Перфектная форма имеет настоящее значение; риторический вопрос естественно передаётся современным русским оборотом «разве ты не помнишь».
- source_word: ἐνετείλατό σοι
  choice: заповедал тебе
  rationale: Глагол обозначает авторитетное предписание. «Заповедал» сохраняет силу отцовского повеления и подходит достоинству библейского регистра.
- source_word: ὑπὲρ τοῦ λαβεῖν σε γυναῖκα
  choice: взять жену
  rationale: Сохранена брачная идиома источника; выражение понятно по-русски и не заменяет её более обобщённым «жениться».
- source_word: ἐκ τοῦ γένους σου
  choice: из своего рода
  rationale: γένος здесь указывает на родственную группу или род; «из своего рода» сохраняет семейно-родовой смысл без необоснованного уточнения племени или народа.
- source_word: ἄκουσόν μου
  choice: послушай меня
  rationale: Императив призывает выслушать и принять сказанное; русский вариант естественен и не усиливает значение до прямого «повинуйся».
- source_word: ἀδελφέ
  choice: брат
  rationale: Сохранено буквальное и тёплое обращение мужского рода.
- source_word: σοὶ ἔσται εἰς γυναῖκα
  choice: она станет твоей женой
  rationale: Русская формулировка естественно передаёт итоговый брачный статус.
- source_word: τοῦ δαιμονίου μηδένα λόγον ἔχε
  choice: не думай о демоне
  rationale: Греческая идиома буквально говорит «не имей никакого слова/счёта о демоне». Основной текст передаёт отсутствие тревожного внимания, а сноска сохраняет подлинную лексическую неоднозначность.
- source_word: δαιμονίου
  choice: демон
  rationale: Прямой и богословски прозрачный эквивалент, не смягчающий обозначение сверхъестественной угрозы.
- source_word: τὴν νύκτα ταύτην
  choice: этой ночью
  rationale: Естественный современный русский эквивалент временного выражения.
- source_word: δοθήσεταί σοι αὕτη εἰς γυναῖκα
  choice: этой ночью она будет отдана тебе в жёны
  rationale: Сохранены пассивная конструкция и повторная брачная формула греческого текста.
theological_decisions:
- issue: Брачная идиома и родственная обязанность
  choice: Сохранить выражения «взять жену», «из своего рода», «станет твоей женой» и «будет отдана тебе в жёны».
  alternative: Последовательно заменить их более общими выражениями «жениться» и «на родственнице».
  rationale: Греческий текст повторяет γυνή и употребляет пассивную брачную формулу. Перевод сохраняет социально-семейную рамку повествования, не добавляя её оценки.
- issue: Обозначение сверхъестественной угрозы
  choice: Передать δαιμόνιον словом «демон».
  alternative: «злой дух»
  rationale: Источник прямо называет демона; более общее «злой дух» уменьшило бы лексическую и богословскую определённость.
- issue: Неоднозначность идиомы μηδένα λόγον ἔχε
  choice: В основном тексте — «не думай о демоне», с указанием вариантов в сноске.
  alternative: «не обращай внимания на демона» или «не беспокойся о демоне».
  rationale: Идиома допускает оттенки отсутствия внимания, заботы или тревоги. Сноска не позволяет одному русскому истолкованию скрыть эту широту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис сделан ясным для обычного читателя; сохранены повтор брачной формулы, прямое обращение «брат» и явное упоминание демона.
