- source_word: χολή
  choice: желчь
  rationale: Прямой и общепонятный эквивалент греческого названия вещества.
- source_word: ἐγχρῖσαι
  choice: помажь
  rationale: Передаёт нанесение вещества на тело; повелительная форма естественно выражает предписание, данное греческим инфинитивом в данном контексте.
- source_word: λευκώματα
  choice: бельма
  rationale: Греческое слово обозначает белые помутнения или пятна в глазах; «бельма» — краткий, естественный и достаточно точный русский эквивалент.
- source_word: ἰαθήσεται
  choice: исцелится
  rationale: Сохраняет пассивно-результативный смысл будущего времени без уточнения действующего лица.
