base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/004.yaml
  text: And he said to them[a], “Do you know Tobit our brother?”
translation:
  language: ru
  text: 'И он спросил их: «Знаете ли вы Товита, нашего брата[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нашего родственника», «нашего сородича». В греческом тексте буквально: «нашего брата»; вероятно, это обозначение более широкого родства или принадлежности к одному народу, а не родного брата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτοῖς
  choice: И он спросил их
  rationale: 'Буквально: «И он сказал им». Поскольку далее следует вопрос, русское «спросил» естественно и точно передаёт речевое действие.'
- source_word: Γινώσκετε
  choice: Знаете ли вы
  rationale: Форма в данном контексте выражает вопрос о личном знакомстве; «знаете ли вы» — ясная и естественная передача.
- source_word: Τωβεὶτ
  choice: Товита
  rationale: Использована традиционная русская форма имени Товит, поставленная в винительный падеж по синтаксису предложения.
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: нашего брата
  rationale: Сохранён буквальный образ греческого текста. Здесь «брат» вероятнее всего обозначает родственника или соплеменника, а не родного брата; это пояснено в сноске.
theological_decisions:
- issue: Значение ἀδελφός как обозначения родства или общности
  choice: нашего брата
  alternative: нашего родственника / нашего сородича
  rationale: Основной текст сохраняет семейную лексику и возможную многозначность греческого оригинала, не сужая её до конкретного вида связи.
translation_notes:
  register: Современный литературный русский язык; речь звучит естественно и достойно. Частица «ли» ясно оформляет вопрос, а исходная семейная метафора сохранена с пояснением в сноске.
