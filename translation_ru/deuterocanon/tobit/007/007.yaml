base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/007.yaml
  text: And he said to him[a], “He is the son of a noble and good man.” And when he heard that Tobit had lost his eyes[b], he was grieved and wept.
translation:
  language: ru
  text: 'И он сказал ему[a]: «Он — сын благородного и доброго человека». Услышав, что Товит лишился зрения[b], он опечалился и заплакал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза здесь эллиптична; буквально: «тот благородного и доброго человека». Слово «сын» добавлено по смыслу контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по-гречески: «потерял свои глаза».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ τοῦ καλοῦ καὶ ἀγαθοῦ ἀνθρώπου
  choice: Он — сын благородного и доброго человека
  rationale: 'Греческое выражение эллиптично: слово «сын» отсутствует, однако родительный оборот в данном контексте естественно указывает на происхождение или родство. Для ясности по-русски слово «сын» добавлено, а эллипсис отмечен в сноске.'
- source_word: καλοῦ
  choice: благородного
  rationale: В сочетании с ἀγαθοῦ слово, вероятно, характеризует человека как достойного и благородного; этот перевод сохраняет различие между двумя определениями и избегает повтора «хорошего и доброго».
- source_word: ἀγαθοῦ
  choice: доброго
  rationale: Прямое и естественное нравственное определение в современном литературном русском языке.
- source_word: ἀκούσας
  choice: услышав
  rationale: Деепричастие точно и естественно передаёт греческое причастие аориста и временную связь действий.
- source_word: ἀπώλεσεν τοὺς ὀφθαλμοὺς ἑαυτοῦ
  choice: лишился зрения
  rationale: Буквально греческий текст говорит «потерял свои глаза», но по-русски это обычно означает физическую утрату глаз. «Лишился зрения» естественно передаёт смысл выражения, а буквальная образность сохранена в сноске.
- source_word: ἐλυπήθη
  choice: опечалился
  rationale: Передаёт скорбь естественным, достойным и доступным современным русским словом.
- source_word: ἔκλαυσεν
  choice: заплакал
  rationale: Точно передаёт начало явного плача и естественно звучит в русском повествовании.
theological_decisions:
- issue: Эллиптическая формула определения родства в начальной фразе
  choice: Добавлено подразумеваемое слово «сын»
  alternative: «Он — от благородного и доброго человека» или буквальное «тот благородного и доброго человека»
  rationale: Рукописный греческий текст синтаксически краток и не называет отношение прямо. Добавление «сын» даёт наиболее вероятный по контексту смысл, не выдавая его за буквальное наличие слова в источнике; неопределённость отмечена сноской.
- issue: Конкретное или смысловое воспроизведение слепоты Товита
  choice: «лишился зрения» в основном тексте
  alternative: «потерял свои глаза»
  rationale: Буквальный русский вариант способен ошибочно подразумевать физическую утрату глаз. Смысловой перевод ясно сообщает о слепоте, тогда как буквальная формулировка греческого текста приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным без архаизмов; подлинная эллиптичность исходного текста и буквальная образность выражения о слепоте вынесены в сноски.
