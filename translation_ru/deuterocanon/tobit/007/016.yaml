  source_fidelity: Перевод верно следует греческому тексту. Безлично по роду аористные формы сами по себе не называют деятеля, но женский род местоимения αὐτῆς в выражении «дочери её» и контекст эпизода обоснованно связывают действия с Эдной. Это точнее английской аудиторской версии, которая подменяет формально женское местоимение мужским «his». «Ввела её туда» передаёт εἰσήγαγεν αὐτὴν ἐκεῖ, а «приняла слёзы» сохраняет образный, несколько необычный ἀπεδέξατο τὰ δάκρυα без добавления невыраженного действия, например «утёрла» или «утешила».
