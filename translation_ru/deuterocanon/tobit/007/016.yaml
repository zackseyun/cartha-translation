  text: And he did as he said and brought her in there[a], and she wept. Then he received the tears of his daughter and said to her,
translation:
  language: ru
  text: 'Она[a] сделала, как он сказал, ввела её туда и заплакала. Потом она приняла слёзы своей дочери и сказала ей:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте действующее лицо прямо не названо. Из ближайшего контекста и слов «своей дочери» следует, что речь идёт об Эдне, матери Сарры.
    reason: source_ambiguity
lexical_decisions:
- source_word: ἐποίησεν ὡς εἶπεν
  choice: сделала, как он сказал
  rationale: Греческие глагольные формы не называют действующее лицо, но ближайший контекст указывает на Эдну, исполняющую сказанное Рагуилом. Русское прошедшее время требует обозначить род субъекта.
- source_word: εἰσήγαγεν αὐτὴν ἐκεῖ
  choice: ввела её туда
  rationale: Передаёт движение внутрь указанного места и сохраняет явно выраженное греческое ἐκεῖ — «туда».
- source_word: ἔκλαυσεν
  choice: заплакала
  rationale: Естественно продолжает цепочку действий одного и того же невыраженного субъекта — Эдны; выбор подтверждается дальнейшими словами о «своей дочери».
- source_word: ἀπεδέξατο τὰ δάκρυα
  choice: приняла слёзы
  rationale: Сохраняет необычную метафору греческого текста. Вариант «утёрла слёзы» звучит естественнее, но вводит конкретное действие, прямо не выраженное глаголом ἀποδέχομαι.
- source_word: τῆς θυγατρὸς αὐτῆς
  choice: своей дочери
  rationale: Возвратное притяжательное местоимение естественно соотносит дочь с субъектом действия, Эдной, и точно передаёт женскую форму αὐτῆς.
- source_word: εἶπεν αὐτῇ
  choice: сказала ей
  rationale: Обычная и точная передача формулы введения прямой речи, продолжающейся в следующем стихе.
theological_decisions:
- issue: Определение невыраженного субъекта глаголов
  choice: Эдна, мать Сарры
  alternative: Рагуил, отец Сарры
  rationale: В самом стихе субъект грамматически не назван, однако форма τῆς θυγατρὸς αὐτῆς содержит женское местоимение, а ближайший контекст представляет Эдну исполнительницей поручения. Поэтому женский субъект лучше согласуется и с грамматикой, и с ходом повествования; решение не связано с конфессиональным толкованием.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным тоном. Сохранена метафора «приняла слёзы», хотя в русском она необычна; двоеточие показывает, что далее следует прямая речь.
