  text: And Edna said to his wife[b][a], “How much the young man Tobit resembles my nephew!”
translation:
  language: ru
  text: 'И сказала Эдна его жене[a]: «Как похож этот юноша Товит на моего племянника[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте сказано: «Эдна сказала его жене», тогда как в семитской параллели Рагуил говорит своей жене Эдне; здесь может отражаться текстовая трудность или особенность передачи текста.'
    reason: textual_variant
  - marker: b
    text: 'Или: «родственника» или «кузена». Греческое слово может обозначать близкого родственника мужского пола, хотя его более конкретное значение — «племянник».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν
  choice: И сказала
  rationale: Обычная повествовательная связка с глаголом речи; женский род согласован с именем Эдна, названным в греческом тексте подлежащим.
- source_word: Ἔδνα
  choice: Эдна
  rationale: Имя передано принятой русской транслитерацией.
- source_word: τῇ γυναικὶ αὐτοῦ
  choice: его жене
  rationale: γυνή в данном контексте означает «жена», а местоимение αὐτοῦ формально сохранено как «его», несмотря на контекстуальную трудность.
- source_word: Ὡς ὅμοιος
  choice: Как похож
  rationale: Естественная русская восклицательная конструкция точно передаёт усилительное ὡς и значение сходства.
- source_word: ὁ νεανίσκος
  choice: этот юноша
  rationale: «Юноша» соответствует обозначению молодого мужчины; указательное «этот» естественно в русской прямой речи при наблюдаемом сходстве, хотя в греческом стоит артикль.
- source_word: Τωβεὶτ
  choice: Товит
  rationale: Имя передано в традиционной русской библейской форме.
- source_word: τῷ ἀνεψιῷ μου
  choice: на моего племянника
  rationale: После русского «похож» требуется конструкция «на» с винительным падежом. ἀνεψιός допускает более широкое родственное значение, но «племянник» является его более конкретным смыслом; альтернатива отмечена в сноске.
theological_decisions:
- issue: Определение говорящего и референта притяжательного местоимения
  choice: 'Следовать греческому тексту: «Эдна ... его жене».'
  alternative: «Рагуил сказал своей жене Эдне».
  rationale: Греческий текст прямо называет Эдну говорящей и содержит выражение «его жене», хотя это затруднительно по контексту. Семитская параллель представляет говорящим Рагуила, обращающегося к своей жене Эдне. Неясность не устраняется молчаливой правкой, а поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Необычность греческого чтения сохранена в основном тексте, а не сглажена по контексту; порядок сносок приведён в последовательность [a], [b].
