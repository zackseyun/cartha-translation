lexical_decisions:
- source_word: ζῇ
  choice: жив
  rationale: В ответе о состоянии человека настоящее время ζάω естественно передаётся по-русски краткой формой «жив».
- source_word: ὑγιαίνει
  choice: здоров
  rationale: ὑγιαίνω означает «быть здоровым»; сочетание «жив и здоров» естественно и точно передаёт греческую пару.
- source_word: Πατήρ μου
  choice: мой отец
  rationale: Прямое и естественное соответствие греческому сочетанию с притяжательным местоимением.
- source_word: ἐστιν
  choice: это
  rationale: В русском при указании на только что названного человека конструкция «Это мой отец» звучит естественнее буквального «Он есть мой отец», сохраняя отождествление.
- source_word: Τωβίας
  choice: Товия
  rationale: Форма «Товия» отражает семитское имя, стоящее за греческим Τωβίας, и избегает латинизированной традиционной формы «Товит/Товия» там, где речь идёт о сыне.
theological_decisions:
- issue: Передача имени Τωβίας
  choice: Товия
  alternative: Товий; Тобиас
  rationale: Выбор не имеет догматического значения. «Товия» узнаваемо передаёт семитскую основу имени и позволяет отличать сына от отца в принятой русской традиции именования персонажей книги.
translation_notes:
  register: Современный литературный русский язык; краткая разговорная реплика сохраняет достоинство повествования. Связка «тогда» передаёт последовательность реплик без добавления смыслового вывода.
