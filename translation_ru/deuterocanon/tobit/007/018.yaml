base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/018.yaml
  text: And Raguel called Edna his wife and said to her[a], “Sister[b], prepare the other chamber and bring her in there.”
translation:
  language: ru
  text: 'И позвал Рагуил свою жену Едну и сказал ей: «Сестра[a], приготовь другую комнату[b] и отведи её туда».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сестра» — обращение Рагуила к жене, а не указание на их кровное родство.
    reason: cultural_note
  - marker: b
    text: 'Или: «другую внутреннюю комнату». Греческое слово может обозначать внутреннюю комнату или отдельное помещение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφή
  choice: Сестра
  rationale: Сохраняет прямое обращение мужа к жене в древней семейной речевой традиции, не заменяя его толкованием вроде «дорогая».
- source_word: ἑτοίμασον
  choice: приготовь
  rationale: Естественно передаёт повелительную форму со значением «сделай готовой».
- source_word: τὸ ἕτερον ταμεῖον
  choice: другую комнату
  rationale: ἕτερον означает «другую», а ταμεῖον здесь естественно понимать как отдельную внутреннюю комнату; «комната» яснее современному читателю, чем архаичное «покои».
- source_word: εἴσαγε αὐτήν
  choice: отведи её туда
  rationale: Передаёт побуждение провести Сарру внутрь указанного помещения; «отведи» в русском естественнее буквального «введи» в данном контексте.
