translation:
  language: ru
  text: 'И он сообщил Рагуилу об этом деле. Рагуил сказал Товии: «Ешь, пей и радуйся, потому что тебе следует взять в жёны мою дочь. Но я скажу тебе правду».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετέδωκεν τὸν λόγον
  choice: сообщил… об этом деле
  rationale: Оборот означает передачу сообщения или изложение дела; такой перевод естественен по-русски и не добавляет отсутствующих в греческом подробностей.
- source_word: ἡδέως γίνου
  choice: радуйся
  rationale: Передаёт призыв пребывать в радостном расположении духа; современнее и естественнее буквального «будь весел» в данном контексте.
- source_word: καθήκει
  choice: подобает
  rationale: Сохраняет оттенок уместности и надлежащего права, не усиливая его до прямого юридического требования.
- source_word: τὸ παιδίον μου
  choice: моё дитя
  rationale: Сохраняет грамматически нейтральное обозначение ребёнка в исходном тексте, не заменяя его контекстуальным «мою дочь».
- source_word: ὑποδείξω τὴν ἀλήθειαν
  choice: открою тебе правду
  rationale: Естественно выражает обещание сообщить истинное положение дел; адресат по-русски восстановлен из непосредственного обращения.
theological_decisions:
- issue: Характер права Товии взять дитя Рагуила
  choice: «тебе подобает»
  alternative: «тебе надлежит» / «ты имеешь право»
  rationale: Формулировка сохраняет смысл καθήκει — то, что уместно или полагается, — не превращая высказывание в безусловную заповедь либо строго юридическое заявление.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Неуказанный субъект первого предложения сохранён местоимением «он»; семейное обозначение оставлено гендерно нейтральным вслед за греческим текстом.
