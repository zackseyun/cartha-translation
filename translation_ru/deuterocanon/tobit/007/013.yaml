lexical_decisions:
- source_word: ἐκάλεσεν
  choice: позвал
  rationale: В данном контексте глагол обозначает простое действие — позвать дочь; вариант «призвал» звучал бы излишне торжественно или официально.
- source_word: λαβὼν τῆς χειρὸς αὐτῆς
  choice: взяв её за руку
  rationale: Сохраняет конкретный жест передачи невесты и естественно звучит по-русски.
- source_word: παρέδωκεν αὐτὴν Τωβείᾳ γυναῖκα
  choice: отдал её Товии в жёны
  rationale: Передаёт формальную передачу дочери в брак; устойчивое русское выражение «отдать в жёны» ясно выражает предикативное значение γυναῖκα.
- source_word: Ἰδοὺ
  choice: вот
  rationale: Естественный современный указательно-побудительный маркер, не имеющий архаического оттенка слова «се».
- source_word: κατὰ τὸν νόμον Μωυσέως
  choice: по закону Моисея
  rationale: Точно сохраняет прямую ссылку на Моисеев закон и естественно передаёт значение соответствия норме.
- source_word: κομίζου
  choice: возьми её
  rationale: Средний императив допускает значения принятия и взятия; «возьми её» естественно обозначает принятие невесты, тогда как следующее повеление выражает дальнейшее движение.
- source_word: ἄπαγε πρὸς τὸν πατέρα σου
  choice: отведи к своему отцу
  rationale: Передаёт значение ведения или увода к указанному месту назначения; дополнение «её» легко восстанавливается из предыдущей фразы и не требует повторения.
- source_word: εὐλόγησεν αὐτούς
  choice: благословил их
  rationale: Прямо и без расширения передаёт действие благословения обоих супругов.
theological_decisions:
- issue: Ссылка на закон Моисея в повествовании Второканонической книги
  choice: Сохранить прямую формулировку «по закону Моисея».
  alternative: «по нашему закону» или просто «по закону»
  rationale: Греческий текст прямо называет Моисея. Перевод сохраняет это утверждение повествования, не добавляя оценок исторического или канонического характера.
