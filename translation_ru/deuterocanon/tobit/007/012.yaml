  yaml_path: translation/deuterocanon/tobit/007/012.yaml
  text: And Raguel said[a], “Take her from now on according to the judgment. You are her brother, and she is yours[c][b]. And may the merciful God prosper what is best for you.”
translation:
  language: ru
  text: 'И Рагуил сказал: «Отныне прими её согласно решению.[a] Ты её родственник,[b] и она твоя. Милосердный Бог дарует вам наилучшее».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно постановлению», «согласно судебному решению».'
    reason: Лексическая альтернатива для κρίσις, которое может обозначать решение, постановление или судебный приговор.
  - marker: b
    text: 'Буквально: «брат». Здесь это обозначение близкого родственника, имевшего право вступить в этот брак согласно семейному обычаю, а не родного брата.'
    reason: Культурно-контекстуальное пояснение широкого родственного употребления ἀδελφός.
  - marker: c
    text: 'Буквальнее: «милосердный Бог даст вам преуспеть в наилучшем» или «милосердный Бог содействует вам в наилучшем». Будущее время может также иметь оттенок благословения: «да дарует вам милосердный Бог наилучшее».'
    reason: Передаёт значение εὐοδώσει ὑμῖν τὰ κάλλιστα и сохраняет возможность понимать будущее изъявительное как благословительную формулу.
lexical_decisions:
- source_word: Κομίζου
  choice: бери
  rationale: Форма среднего залога в повелительном наклонении здесь предписывает Товии принять Сарру как жену. «Бери» естественно передаёт прямоту повеления, не добавляя отсутствующих в греческом тексте пояснений.
- source_word: ἀπὸ τοῦ νῦν
  choice: отныне
  rationale: Кратко и естественно обозначает начало нового семейно-правового положения.
- source_word: κατὰ τὴν κρίσιν
  choice: согласно решению
  rationale: κρίσις может означать суд, постановление или решение. Выбранный вариант сохраняет официальный оттенок, не уточняя сверх текста, идёт ли речь именно о судебном постановлении или о нормативном решении.
- source_word: ἀδελφὸς
  choice: брат
  rationale: Основной текст сохраняет прямое значение греческого слова и присущую ему родственную терминологию; контекстуальное значение близкого родственника разъясняется в сноске.
- source_word: ἐλεήμων
  choice: милосердный
  rationale: Прямой и богословски уместный эквивалент, обозначающий того, кто проявляет милость.
- source_word: εὐοδώσει ὑμῖν τὰ κάλλιστα
  choice: устроит для вас всё наилучшим образом
  rationale: Естественная русская формула благословения, передающая обещание благого устроения и значение превосходной степени τὰ κάλλιστα. Более буквальное строение греческой фразы отмечено в сноске.
theological_decisions:
- issue: Родственный термин в контексте брака
  choice: Сохранить «брат» в основном тексте, понимая его как обозначение близкого родственника.
  alternative: Передать как «родственник» или «сородич».
  rationale: Греческий текст употребляет ἀδελφός. Сохранение исходного образа не скрывает формулировку источника, а сноска предотвращает ошибочное понимание как родного брата.
- issue: Благословение, выраженное будущим временем
  choice: 'Сохранить будущее изъявительное: «Бог устроит».'
  alternative: 'Передать пожеланием: «да устроит Бог».'
  rationale: В контексте фраза действует как благословение, однако греческий текст формально содержит будущее изъявительное εὐοδώσει. Русское будущее сохраняет одновременно оттенок уверенного обещания и благословения, не превращая его однозначно в пожелание.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной и благословительной речи. Синтаксис остаётся ясным для широкого читателя; правовой оттенок κρίσις и исходная родственная терминология сохранены без архаизации.
