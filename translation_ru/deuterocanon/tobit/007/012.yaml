    rationale: «Устроит для вас всё наилучшим образом» описывает способ устроения всех обстоятельств, а не εὐοδώσει ὑμῖν τὰ κάλλιστα — благополучное дарование или осуществление наилучшего для адресатов.
  - severity: medium
    issue: «Ты ей брат» вводит в заблуждение в современном русском
    rationale: Без контекстуального переосмысления эта фраза означает родного брата. Сноска не вполне снимает сильное и ложное первое прочтение; в данном контексте следует передать широкое значение родства и отметить буквальное греческое слово.
