revisions:
- from: 'И Рагуил сказал: «Отныне бери её согласно решению.[a] Ты ей брат,[b] и она твоя. А милосердный Бог устроит для вас всё наилучшим образом».[c]'
  to: 'И Рагуил сказал: «Отныне прими её согласно решению.[a] Ты её родственник,[b] и она твоя. Милосердный Бог дарует вам наилучшее».[c]'
  rationale: Исправлена заключительная фраза, чтобы не подменять благословение о «наилучшем» утверждением о наилучшем устройстве всех обстоятельств. Родственный термин передан смысловым русским эквивалентом, а буквальное «брат» сохранено в сноске, поскольку современное русское основное прочтение «брат» здесь было бы фактически дезориентирующим. Переставлен знак сноски внутрь прямой речи, к слову «наилучшее».
