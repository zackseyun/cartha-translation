  yaml_path: translation/deuterocanon/tobit/007/011.yaml
  text: I gave my child to seven men[a], and whenever they went in to her, they died during the night. But for now, be cheerful. And Tobiah said[b], “I will taste nothing here until you settle and conclude the matter with me.”
translation:
  language: ru
  text: 'Я отдал своё дитя семи мужчинам[a], и всякий раз, когда они входили к ней, они умирали ночью. Но теперь будь весел. А Товия сказал[b]: «Я ничего здесь не вкушу, пока вы не уладите и не завершите это дело со мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семи мужчинам». Из контекста ясно, что речь идёт о мужчинах, которым её отдавали в жёны; поэтому возможен перевод: «семи мужьям».'
    reason: lexical_alternative
  - marker: b
    text: 'Последняя фраза в данном греческом тексте трудна для понимания. Перевод передаёт, по-видимому, подразумеваемый смысл: Товия отказывается есть, пока брачное соглашение с ним не будет окончательно оформлено.'
    reason: textual_variant
lexical_decisions:
- source_word: τὸ παιδίον μου
  choice: моё дитя
  rationale: Уменьшительное παιδίον буквально означает «дитя, ребёнок». В контексте речь идёт о дочери Рагуила Сарре, однако «моё дитя» сохраняет родительское и ласковое звучание греческого выражения, не конкретизируя пол в основном тексте.
- source_word: ἑπτὰ ἀνδράσιν
  choice: семи мужчинам
  rationale: ἀνήρ может означать как «мужчина», так и «муж». Греческая форма сама по себе допускает оба значения; буквальное «мужчинам» сохраняет эту особенность, а брачный смысл поясняется в сноске.
- source_word: ὁπότε ἐὰν εἰσεπορεύοντο πρὸς αὐτήν
  choice: всякий раз, когда они входили к ней
  rationale: Оборот передаёт повторяющееся действие и сохраняет эвфемистический брачный либо половой оттенок греческого выражения, не делая его излишне явным.
- source_word: ἀπέθνησκον ὑπὸ νύκτα
  choice: они умирали ночью
  rationale: Имперфект соответствует повторявшемуся событию, а ὑπὸ νύκτα указывает на время — ночью.
- source_word: ἀλλὰ τὸ νῦν ἔχων ἡδέως γίνου
  choice: Но теперь ободрись
  rationale: Переданный греческий оборот несколько неровен, однако выражает призыв воспрянуть или быть в добром расположении духа. «Ободрись» естественно и достойно звучит по-русски.
- source_word: Οὐ γεύομαι οὐδὲν ὧδε
  choice: Я ничего здесь не вкушу
  rationale: γεύομαι буквально означает «вкушать, пробовать» и в данном контексте выражает отказ от еды. «Не вкушу» сохраняет образность и соответствует возвышенному повествовательному регистру.
- source_word: ἕως ἂν στήσητε καὶ σταθῆτε πρὸς μέ
  choice: пока вы не уладите и не завершите это дело со мной
  rationale: Двойная глагольная конструкция в данном греческом свидетеле трудна и при буквальном переводе неясна. По контексту Товия требует формально решить брачное дело до трапезы; перевод сохраняет два действия, не скрывая трудности в сноске.
theological_decisions:
- issue: Статус семи мужчин
  choice: В основном тексте сохранено «семи мужчинам».
  alternative: «Семи мужьям».
  rationale: Брачный контекст допускает значение «мужья», но греческое ἀνδράσιν формально также означает просто «мужчинам». Сноска сообщает контекстуальную альтернативу, не устраняя лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Архаизмы сведены к минимуму; «вкушу» сохранено как понятное современному читателю слово, близкое к образу исходного глагола. Неясность заключительной греческой конструкции отмечена в сноске.
