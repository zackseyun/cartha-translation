  yaml_path: translation/deuterocanon/tobit/007/003.yaml
  text: And Raguel asked them[a], “Where are you from, brothers?” And they said to him, “We are from the sons of Naphtali[b], the captives from Nineveh.”
translation:
  language: ru
  text: 'И спросил их Рагуил: «Откуда вы, братья?» Они ответили ему: «Мы из сынов Неффалима[a], из числа пленных из Ниневии[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть из потомков Неффалима, из его колена. Буквально: «из сынов Неффалима».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст буквально: «пленных из Ниневии». В контексте это может означать пленников, находившихся в Ниневии; точная связь с Ниневией в этой краткой формуле не уточняется.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἠρώτησεν
  choice: спросил
  rationale: Обычный повествовательный глагол со значением вопроса; «спросил» естественно и точно передаёт греческий аорист.
- source_word: Πόθεν ἐστέ
  choice: Откуда вы
  rationale: Естественный русский вопрос о происхождении или месте, откуда прибыли собеседники.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет прямое мужское обращение и его доброжелательный характер без замены толкованием «друзья» или «сородичи».
- source_word: Ἐκ τῶν υἱῶν Νεφθαλεὶ
  choice: из сынов Неффалима
  rationale: Сохраняет буквальную родоплеменную формулу греческого текста; возможный смысл «из потомков/колена Неффалима» указан в примечании.
- source_word: τῶν αἰχμαλώτων
  choice: из тех, кого увели в плен
  rationale: Передаёт принудительный характер αἰχμάλωτος и яснее связывает определение с названной группой людей, чем субстантивированное «пленные».
- source_word: ἐκ Νινευή
  choice: из Ниневии
  rationale: Формально сохраняет повторённый греческий предлог ἐκ. Вместе с «увели в плен» фраза означает, что названные люди были уведены из Ниневии; более вероятное контекстуальное понимание местонахождения пленников отражено в примечании.
