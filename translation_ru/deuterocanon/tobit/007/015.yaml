  text: And they began to eat[a]. Then Raguel called Edna his wife and said to her, “Sister[b], prepare the other room and bring her in.”
translation:
  language: ru
  text: 'И они начали есть. Тогда Рагуил позвал свою жену Едну и сказал ей: «Сестра[a], приготовь другую комнату[b] и введи её».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сестра». Это обращение мужа к жене; здесь оно служит семейной, ласковой формой обращения.'
    reason: cultural_note
  - marker: b
    text: 'Или: «другой покой». Греческое слово ταμεῖον может обозначать внутреннюю комнату или покой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο ἐσθίειν
  choice: начали есть
  rationale: Прямо передаёт начинательную конструкцию ἄρχομαι с инфинитивом и обычное значение ἐσθίω.
- source_word: ἐκάλεσεν
  choice: позвал
  rationale: Естественно для домашней обстановки и не придаёт глаголу излишне официального оттенка, который возник бы при переводе «призвал».
- source_word: Ἀδελφή
  choice: Сестра
  rationale: Сохраняет буквальное обращение к жене, отражающее семитский способ выражения родственной близости.
- source_word: ἑτοίμασον
  choice: приготовь
  rationale: Естественный современный русский императив, точно передающий повелительную форму.
- source_word: τὸ ἕτερον ταμεῖον
  choice: другую комнату
  rationale: ταμεῖον может обозначать внутреннюю комнату или покой; «комната» ясно и естественно в данном контексте, а «другую» передаёт ἕτερον.
- source_word: εἴσαγε αὐτήν
  choice: введи её
  rationale: Сохраняет значение движения внутрь без добавления отсутствующего в греческом тексте указания «туда»; место назначения ясно из предыдущей части фразы.
