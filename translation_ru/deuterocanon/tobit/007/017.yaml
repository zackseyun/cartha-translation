  source_fidelity: 'Текст точно передаёт греческий оригинал: повторённое Θάρσει передано одинаковым призывом «Мужайся», τέκνον сохранено как не маркированное по полу «дитя», оптатив δῴη передан пожелательной конструкцией «да дарует», а ἀντὶ сохраняет смысл замены («вместо»). Заключительное θύγατερ ясно передано обращением «дочь».'
