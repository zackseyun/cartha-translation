  yaml_path: translation/deuterocanon/tobit/007/017.yaml
  text: Take courage[a], child; may the Lord of heaven and earth grant you favor instead of this sorrow of yours. Take courage, daughter.
translation:
  language: ru
  text: Мужайся, дитя! Господь неба и земли да дарует тебе милость[a] вместо этой твоей печали. Мужайся, дочь!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодать»; греческое χάρις допускает здесь оба значения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θάρσει / θάρσει
  choice: Мужайся
  rationale: Повелительная форма θαρσέω ободряет человека в беде. «Мужайся» сохраняет прямой призыв и позволяет естественно повторить его в конце стиха.
- source_word: τέκνον
  choice: дитя
  rationale: Общее ласковое обращение к ребёнку без указания пола; притяжательное «моё» в греческом отсутствует.
- source_word: ὁ κύριος
  choice: Господь
  rationale: В молитвенном иудейском контексте κύριος употреблено как титул Бога.
- source_word: τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: неба и земли
  rationale: Сохраняет общеупотребительную библейскую формулу, указывающую на всеобъемлющее владычество Бога.
- source_word: δῴη
  choice: да дарует
  rationale: Оптатив выражает пожелание или молитву; конструкция с «да» естественно передаёт это значение в русском библейском регистре.
- source_word: σοι χάριν
  choice: тебе милость
  rationale: В данном благословении χάρις означает благосклонность или благой дар. «Милость» естественна в обращённом к Богу пожелании, тогда как «благодать» может восприниматься как более узкий богословский термин.
- source_word: ἀντὶ τῆς λύπης σου ταύτης
  choice: вместо этой твоей печали
  rationale: ἀντί обозначает замену, а λύπη — печаль или скорбь. Формулировка сохраняет значение возмещения и личное обращение.
- source_word: θύγατερ
  choice: дочь
  rationale: Передаёт прямое обращение в женском роде и сохраняет переход от общего τέκνον к конкретному θύγατερ.
theological_decisions:
- issue: Передача χάρις в молитвенном пожелании
  choice: милость
  alternative: благодать
  rationale: Контекст — утешительное благословение, а не изложение учения. «Милость» передаёт Божью благосклонность без неоправданного сужения смысла; «благодать» остаётся допустимым лексическим вариантом и отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной молитвенной конструкцией «да дарует». Повтор призыва сохранён, обращения переданы без добавления отсутствующего в греческом притяжательного местоимения.
