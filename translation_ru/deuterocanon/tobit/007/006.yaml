  register: Современный литературный русский язык с достоинством библейского повествования. Краткая цепочка действий и повтор союза сохранены; «вскочил» передаёт порывистость, а «горячо поцеловал» — усилительную силу κατεφίλησεν без добавления не названного в греческом объятия.
