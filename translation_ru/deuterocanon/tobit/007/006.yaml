translation:
  language: ru
  text: И Рагуил вскочил, горячо поцеловал его[a] и заплакал.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол здесь сильнее простого «поцеловал» и выражает особую сердечность; он может также подразумевать продолжительный или повторный поцелуй.
    reason: lexical_alternative
  - marker: b
    text: Приведённый параллельный семитский текст — поздний обратный перевод с арамейской рукописи и иначе распределяет содержание стихов; формулировка данного стиха основана на греческом свидетельстве.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνεπήδησεν
  choice: вскочил
  rationale: Глагол передаёт внезапное, порывистое движение вверх; «вскочил» естественно сохраняет эмоциональную непосредственность сцены.
- source_word: κατεφίλησεν
  choice: горячо поцеловал
  rationale: Сложный глагол сильнее нейтрального «поцеловал» и выражает особую сердечность, возможно также продолжительность или повторность поцелуя; наречие передаёт усиление, не добавляя отдельного объятия.
- source_word: ἔκλαυσε
  choice: заплакал
  rationale: Форма аориста обозначает наступившее действие; «заплакал» естественно для последовательного повествования и ясно передаёт начало плача.
- source_word: Ῥαγουὴλ
  choice: Рагуил
  rationale: Передача имени следует греческой форме и принятой русской библейской традиции.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение мужского рода по контексту относится к Товии.
