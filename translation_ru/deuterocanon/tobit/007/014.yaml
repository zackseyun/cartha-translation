  text: And he called Edna his wife, and taking a document, he wrote out a marriage contract[a], and they sealed it.
translation:
  language: ru
  text: И он позвал свою жену Эдну, взял документ, составил договор[a], и они скрепили его печатями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «брачный договор». Греческое слово означает письменное соглашение или договор; брачный характер документа следует из контекста.'
    reason: Сохраняется более широкое значение греческого συγγραφή, а контекстуально возможное уточнение приводится как вариант.
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: позвал
  rationale: Передаёт обычное значение глагола «звать, позвать» естественно и без излишнего оттенка официального вызова.
- source_word: Ἔδναν τὴν γυναῖκα αὐτοῦ
  choice: свою жену Эдну
  rationale: В данном контексте γυνή однозначно означает жену; русский порядок слов естественно передаёт приложение с именем.
- source_word: λαβὼν βιβλίον
  choice: взял документ
  rationale: βιβλίον может обозначать книгу, свиток или письменный документ; последующее составление и запечатывание договора указывает здесь на документ, не уточняя его материальную форму.
- source_word: ἔγραψεν συγγραφήν
  choice: составил договор
  rationale: Буквально выражение говорит, что он «написал договор»; по-русски применительно к юридическому тексту естественнее «составил договор». Сам термин συγγραφή обозначает письменное соглашение или договор.
- source_word: ἐσφραγίσαντο
  choice: они скрепили его печатями
  rationale: Форма глагола стоит в третьем лице множественного числа. Перевод сохраняет множественного деятеля и конкретное действие запечатывания юридического документа.
