base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/007/001.yaml
  text: And he came to Ecbatana and arrived at the house of Raguel[a], and Sarah also met him. She greeted him, and he greeted them[b], and he brought them into the house.
translation:
  language: ru
  text: Он пришёл в Экбатаны и добрался до дома Рагуила. Сарра также вышла ему навстречу и приветствовала его; он же приветствовал их.[a] Затем он ввёл их в дом.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «он же — их»; дополнение стоит во множественном числе, хотя непосредственно перед этим названа Сарра в единственном числе. Кого именно охватывает это «их», не уточнено.'
    reason: Сохранение неоднозначной местоименной связи исходного текста.
  - marker: b
    text: Субъект глагола «ввёл» в греческом тексте прямо не назван; глагол стоит в единственном числе. Перевод «он» следует ближайшему контексту, не называя этого лица.
    reason: Сохранение синтаксической неоднозначности исходного текста.
lexical_decisions:
- source_word: ἦλθεν
  choice: пришёл
  rationale: Основной глагол движения передаёт прибытие в город без излишнего уточнения направления.
- source_word: παρεγένετο
  choice: добрался до
  rationale: Передаёт дальнейшее прибытие к конкретному месту и сохраняет различие с предшествующим ἦλθεν.
- source_word: οἰκίαν
  choice: дом
  rationale: В данном контексте речь прежде всего о жилище; обычное русское «дом» естественно допускает и оттенок домашнего хозяйства.
- source_word: ὑπήντησεν
  choice: вышла ему навстречу
  rationale: Глагол обозначает встречу, нередко с движением навстречу; такая передача отличает её от последующего приветствия.
- source_word: ἐχαιρέτισεν
  choice: приветствовала / приветствовал
  rationale: Прямой современный эквивалент греческого глагола приветствия; формы согласованы с меняющимся субъектом.
- source_word: αὐτὸς αὐτούς
  choice: он же приветствовал их
  rationale: Сохраняет явный переход к мужскому субъекту и множественное дополнение, не устраняя необычность местоименной цепочки.
- source_word: εἰσήγαγεν
  choice: ввёл ... в
  rationale: Кратко и точно передаёт движение внутрь; субъект в греческом не назван прямо.
- source_word: Ἐκβάτανα
  choice: Экбатаны
  rationale: Устоявшаяся русская форма древнего топонима во множественном числе.
- source_word: Ῥαγουήλ
  choice: Рагуил
  rationale: Традиционная русская передача греческой формы имени.
- source_word: Σάρρα
  choice: Сарра
  rationale: Традиционная русская библейская форма имени, соответствующая греческому Σάρρα.
theological_decisions:
- issue: К кому относятся местоимения в сцене приветствия
  choice: «он же приветствовал их»
  alternative: «он приветствовал её в ответ»
  rationale: Греческий текст прямо имеет мужское αὐτός и множественное αὐτούς. Перевод сохраняет эту грамматическую форму и не исправляет её по предполагаемому смыслу.
- issue: Субъект заключительного действия
  choice: «он ввёл их в дом»
  alternative: «их ввели в дом» / «Рагуил ввёл их в дом»
  rationale: Глагол εἰσήγαγεν стоит в единственном числе и предполагает мужской субъект, но прямо его не называет. Местоимение сохраняет неопределённость и не подставляет имя хозяина.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Короткие предложения облегчают чтение; «добрался до» естественно различает два последовательных глагола движения. Местоименная неоднозначность греческого текста не сглажена и пояснена в примечаниях.
