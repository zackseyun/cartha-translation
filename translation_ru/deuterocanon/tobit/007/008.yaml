lexical_decisions:
- source_word: Ἔδνα
  choice: Эдна
  rationale: Личное имя передано традиционной русской транслитерацией, соответствующей греческой форме.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: жена его
  rationale: В данном семейном контексте γυνή однозначно означает супругу; порядок слов сохраняет достоинство библейского повествования и остаётся понятным современному читателю.
- source_word: Σάρρα
  choice: Сарра
  rationale: Использована традиционная русская библейская форма имени.
- source_word: ἡ θυγάτηρ αὐτοῦ
  choice: дочь его
  rationale: Прямое обозначение родства передано ясно и близко к структуре греческого текста.
- source_word: ἔκλαυσαν
  choice: заплакали
  rationale: Аорист обозначает состоявшееся действие; «заплакали» естественно передаёт реакцию персонажей, не уточняя продолжительность плача.
- source_word: ὑπεδέξαντο αὐτοὺς
  choice: приняли гостей
  rationale: В контексте гостеприимства ὑποδέχομαι означает принять или приветствовать прибывших. Добавление «гостей» естественно для русского языка и ясно обозначает социальный смысл действия без изменения референта местоимения.
- source_word: προθύμως
  choice: с сердечной готовностью
  rationale: Наречие выражает добровольную, усердную и искреннюю готовность; этот оборот сохраняет одновременно оттенки радушия и охотного принятия.
