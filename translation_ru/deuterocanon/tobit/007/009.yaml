  yaml_path: translation/deuterocanon/tobit/007/009.yaml
  text: And they slaughtered a ram from the flock and set out many dishes. Then Tobiah said to Raphael, “Azariah, brother, speak about the matter you were talking about on the journey, and let the matter be brought to completion.”
translation:
  language: ru
  text: 'И они закололи барана из стада и подали множество блюд. Тогда Товия сказал Рафаилу: «Азария, брат, поговори о том, о чём ты говорил в пути, и пусть дело будет доведено до конца».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθυσαν
  choice: закололи
  rationale: В контексте приготовления угощения глагол обозначает заклание животного; перевод не навязывает идею культового жертвоприношения.
- source_word: κριὸν προβάτων
  choice: барана из стада
  rationale: Передаёт барана, взятого из овечьего стада, естественным современным русским выражением.
- source_word: παρέθηκαν ὄψα πλείονα
  choice: подали множество блюд
  rationale: παρατίθημι означает подать или поставить перед гостями, а ὄψα в данном контексте — приготовленные кушанья; «множество блюд» сохраняет значение обильной трапезы.
- source_word: λάλησον ὑπὲρ ὧν ἔλεγες
  choice: поговори о том, о чём ты говорил
  rationale: Сохраняет неопределённость предмета разговора и естественно звучит по-русски.
- source_word: τελεσθήτω τὸ πρᾶγμα
  choice: пусть дело будет доведено до конца
  rationale: Передаёт пассивную форму и смысл завершения задуманного дела без преждевременного уточнения его содержания.
theological_decisions:
- issue: Возможный культовый оттенок ἔθυσαν
  choice: закололи
  alternative: принесли в жертву
  rationale: Сцена непосредственно описывает приготовление трапезы, поэтому нейтральное «закололи» лучше сохраняет контекст и не вводит неявно культовое действие.
- issue: Неуточнённое содержание τὸ πρᾶγμα
  choice: дело
  alternative: брак / сватовство
  rationale: Греческий текст оставляет предмет не названным прямо; перевод сохраняет эту повествовательную недосказанность.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанно-достоинственное. Обращение «Брат Азария» сохраняет порядок и теплоту греческого обращения без архаизации.
