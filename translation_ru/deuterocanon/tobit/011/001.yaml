base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/001.yaml
  text: After these things[a], Tobiah also went on his way, blessing God because he had made his journey successful, and he kept blessing Raguel and Edna his wife[b]. And he went on until they came near to Nineveh.
translation:
  language: ru
  text: После этого Товия продолжал путь, благословляя Бога за то, что Он даровал успех его путешествию[a], и продолжал благословлять Рагуила и его жену Едну. Он шёл дальше, пока они не приблизились к Ниневии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделал успешным его путь»; это греческое выражение означает, что Бог даровал ему благополучное путешествие.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная фраза в греческом тексте синтаксически неясна. Вероятный смысл: «пока они не приблизились к Ниневии»; возможно также понимание: «пока он не приблизился к Ниневии».'
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: После этого
  rationale: Естественный современный переход, передающий временное значение греческого выражения без тяжеловесного буквального «после этих событий».
- source_word: ἐπορεύετο
  choice: продолжал путь / шёл дальше
  rationale: Имперфект выражает продолжающееся движение; вариативная передача делает русский текст естественным.
- source_word: εὐλογῶν τὸν θεόν
  choice: благословляя Бога
  rationale: Сохраняет прямое значение глагола и библейский регистр; «прославляя» было бы более истолковывающим.
- source_word: ὅτι εὐώδωσεν τὴν ὁδὸν αὐτοῦ
  choice: за то, что Он даровал успех его путешествию
  rationale: Передаёт греческую идиому о благополучном пути ясным современным русским языком и сохраняет Бога как деятеля.
- source_word: κατευλόγει
  choice: не переставал благословлять
  rationale: Передаёт длительный или повторяющийся характер имперфекта и усиление сложного глагола.
- source_word: Ῥαγουὴλ καὶ Ἔδναν τὴν γυναῖκα αὐτοῦ
  choice: Рагуила и его жену Едну
  rationale: Ясно и естественно обозначает Едну как жену Рагуила.
- source_word: μέχρις οὗ ἤγγισαν αὐτὸν εἰς Νινευή
  choice: пока они не приблизились к Ниневии
  rationale: Сохраняет множественное число ἤγγισαν и передаёт наиболее вероятный смысл синтаксически трудной фразы; неопределённость отмечена в сноске.
theological_decisions:
- issue: Передача θεός
  choice: Бог
  alternative: бог
  rationale: В повествовательном контексте речь идёт о Боге Израиля; прописная буква соответствует норме современного русского религиозного текста.
- issue: Субъект и смысл заключительной трудной фразы
  choice: Он шёл дальше, пока они не приблизились к Ниневии
  alternative: Он шёл дальше, пока не приблизился к Ниневии
  rationale: Первый глагол в греческом стоит в единственном числе, а второй — во множественном. Основной текст сохраняет это напряжение, а сноска сообщает о синтаксической трудности и возможном понимании в единственном числе.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Причастный оборот сохранён там, где он звучит естественно; трудная смена единственного числа на множественное не устранена молча и пояснена сноской.
