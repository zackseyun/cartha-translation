lexical_decisions:
- source_word: προσδραμοῦσα
  choice: подбежала
  rationale: Причастие от προστρέχω передаёт быстрое движение к человеку; «подбежала» естественно и сохраняет живость сцены.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον
  choice: бросилась на шею
  rationale: Устойчивый библейский образ эмоционального объятия. Такой перевод сохраняет конкретную образность греческого выражения и звучит естественно по-русски.
- source_word: τοῦ υἱοῦ αὐτῆς
  choice: своему сыну
  rationale: υἱός означает именно «сын»; возвратное «своему» ясно связывает его с Анной и соответствует нормам русского языка.
- source_word: Εἶδόν σε
  choice: Я увидела тебя
  rationale: Аорист ὁράω обозначает свершившееся радостное событие встречи. Простое прошедшее время сохраняет форму исходного текста, не привнося значения «нашла».
- source_word: παιδίον
  choice: дитя моё
  rationale: παιδίον здесь служит нежным материнским обращением. «Дитя» передаёт ласковый оттенок; «моё» естественно для русского обращения, хотя притяжательное местоимение подразумевается контекстом, а не выражено отдельно.
