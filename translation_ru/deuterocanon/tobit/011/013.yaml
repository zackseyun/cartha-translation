lexical_decisions:
- source_word: ἐλεπίσθη
  choice: отслоились
  rationale: Передаёт образ отделяющегося слоя или чешуек и естественно сочетается с глазными плёнками, не добавляя отсутствующего в тексте указания на действующее лицо.
- source_word: κανθῶν
  choice: уголков
  rationale: В анатомическом контексте обозначает углы глаз; уменьшительная русская форма здесь наиболее естественна.
- source_word: ὀφθαλμῶν
  choice: глаз
  rationale: Обычный современный эквивалент анатомического термина.
- source_word: λευκώματα
  choice: белые плёнки
  rationale: Передаёт белёсые помутнения как видимый слой и согласуется с образом отслаивания лучше, чем «пятна»; при этом не использует излишне клиническую лексику.
- source_word: ἰδὼν
  choice: увидев
  rationale: Деепричастие кратко и естественно передаёт предшествующее обстоятельство греческого аористного причастия.
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: он бросился ему на шею
  rationale: Сохраняет образ греческого выражения и одновременно звучит в современном русском как понятное обозначение порывистого объятия.
