lexical_decisions:
- source_word: ἐγένετο χαρὰ
  choice: радость охватила
  rationale: Естественно передаёт возникновение всеобщей радости, сохраняя χαρά как существительное и не утяжеляя фразу буквальным «была радость».
- source_word: πᾶσι
  choice: всех
  rationale: Сохраняет всеохватность греческой формы.
- source_word: τοῖς ἐν Νινευὴ
  choice: в Ниневии
  rationale: Кратко и точно передаёт указание на место.
- source_word: ἀδελφοῖς αὐτοῦ
  choice: его братьев
  rationale: Основной текст сохраняет буквальное значение греческого ἀδελφοί; возможный более широкий смысл родства отмечен в сноске.
- source_word: παρεγένετο
  choice: пришли
  rationale: В русском согласовано с двумя названными участниками — Ахиахаром и Насвасом; глагол естественно обозначает их прибытие.
- source_word: Ἀχιάχαρος
  choice: Ахиахар
  rationale: Транслитерация греческой формы имени, пригодная для современного русского библейского текста.
- source_word: Νασβὰς
  choice: Насвас
  rationale: Передаёт форму имени в указанном греческом источнике, не заменяя её вариантами из других рукописных традиций.
- source_word: ὁ ἐξάδελφος αὐτοῦ
  choice: его двоюродный брат
  rationale: ἐξάδελφος обозначает именно двоюродного брата, поэтому точное родственное наименование предпочтительнее общего «родственник».
theological_decisions:
- issue: Объём значения ἀδελφοῖς αὐτοῦ
  choice: его братьев
  alternative: его родственников; его родичей
  rationale: Греческое слово буквально означает «братья», но в повествовательном контексте может обозначать более широкий круг родни. Буквальная форма оставлена в основном тексте, а смысловая широта — в сноске.
