  yaml_path: translation/deuterocanon/tobit/011/010.yaml
  text: “From now on I can die.” And both of them wept. Then Tobit went out toward the door and stumbled[a], but his son ran to him,
translation:
  language: ru
  text: «Теперь я могу умереть».[a] И оба заплакали. Товит пошёл к двери, спотыкаясь, но сын подбежал к нему,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Отныне я умру». Здесь это выражение означает, что её желание исполнилось и теперь она готова умереть спокойно.'
    reason: Сноска сохраняет буквальное значение будущего времени и поясняет переданный в тексте идиоматический смысл.
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: теперь
  rationale: Естественно передаёт временное выражение «с этого момента» в эмоциональной реплике; более буквальное «отныне» в современной речи звучало бы несколько архаично.
- source_word: ἀποθανοῦμαι
  choice: я могу умереть
  rationale: Греческая форма буквально означает «я умру», однако в контексте радостной встречи это идиоматическое выражение исполненного желания и готовности умереть спокойно, а не предсказание близкой смерти.
- source_word: ἔκλαυσαν
  choice: заплакали
  rationale: Точно и естественно передаёт начало совместного плача в повествовании.
- source_word: ἀμφότεροι
  choice: оба
  rationale: Сохраняет явное указание на двух участников сцены.
- source_word: ἐξήρχετο πρὸς τὴν θύραν
  choice: пошёл к двери
  rationale: Естественно передаёт направленное движение к двери; длительность имперфекта поддерживается следующим деепричастным оборотом.
- source_word: προσεκόπτεν
  choice: спотыкаясь
  rationale: Передаёт продолженное действие имперфекта προσκόπτω и естественно связывает его с движением Товита.
- source_word: προσέδραμεν αὐτῷ
  choice: сын подбежал к нему
  rationale: Прямо передаёт быстрое движение сына к Товиту.
theological_decisions:
- issue: Эмоциональный смысл ἀποθανοῦμαι
  choice: «я могу умереть» как выражение исполнившегося желания
  alternative: 'Буквально: «я умру»'
  rationale: Контекст радостной встречи указывает не на пророчество или намерение умереть, а на готовность спокойно умереть после исполнения глубочайшего желания.
- issue: Последовательность субъектов в повествовании
  choice: Товит идёт к двери и спотыкается; сын подбегает к нему
  alternative: В иных текстовых традициях окружающие подробности сцены могут отличаться
  rationale: Перевод следует представленному греческому тексту издания Swete и не гармонизирует его с более пространными редакциями.
