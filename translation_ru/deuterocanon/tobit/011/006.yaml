translation:
  language: ru
  text: 'Она заметила его, когда он приближался, и сказала его отцу: «Смотри, идёт мой сын и человек, который отправился вместе с ним».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προενόησεν
  choice: увидела издали
  rationale: Глагол указывает на заблаговременное восприятие приближающегося человека. В данном контексте естественное русское выражение «увидела издали» передаёт зрительное восприятие прежде, чем путники подошли, не утверждая сверх текста, что она уже распознала его.
- source_word: ἐρχόμενον
  choice: идёт
  rationale: Причастие настоящего времени обозначает движение к говорящим; в русском придаточное «идёт» звучит естественно и сохраняет аспект продолжающегося приближения.
- source_word: Ἰδοὺ
  choice: Смотри
  rationale: Непосредственный призыв обратить внимание. «Смотри» современно и естественно, в отличие от архаического «вот» в значении возгласа или «се».
- source_word: ὁ υἱός μου
  choice: мой сын
  rationale: Прямое соответствие греческому притяжательному словосочетанию.
- source_word: ὁ ἄνθρωπος
  choice: человек
  rationale: Сохраняет общее обозначение исходного текста и не заменяет его более толковательным словом «спутник».
- source_word: ὁ πορευθεὶς μετʼ αὐτοῦ
  choice: который ходил с ним
  rationale: Аористное причастие отсылает к совершённому путешествию. «Ходил с ним» близко к греческой формулировке и понятно в контексте возвращения.
