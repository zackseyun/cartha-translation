  text: 'И Рафаил сказал[a]: «Я знаю, что твой отец откроет глаза».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твой отец прозреет». Буквально в греческом тексте говорится, что он «откроет глаза»; здесь это означает возвращение зрения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπίσταμαι
  choice: Я знаю
  rationale: Глагол выражает уверенное знание; «я знаю» прямо и естественно передаёт утверждение Рафаила, не усиливая его дополнительными оттенками.
- source_word: ἀνοίξει τοὺς ὀφθαλμούς
  choice: глаза … откроются
  rationale: Греческий текст буквально говорит об открытии глаз и в данном контексте подразумевает возвращение зрения. Русская возвратная конструкция сохраняет этот образ и при этом звучит естественнее, чем буквальное активное «отец откроет глаза», которое по-русски может означать пробуждение ото сна.
- source_word: ὁ πατήρ σου
  choice: твоего отца
  rationale: Форма родительного падежа обусловлена естественной русской конструкцией «глаза твоего отца откроются» и точно сохраняет отнесённость к отцу Товии.
- source_word: Ῥαφαήλ
  choice: Рафаил
  rationale: Использована традиционная и общепринятая русская форма имени.
theological_decisions:
- issue: Образное обозначение исцеления от слепоты
  choice: Сохранить в основном тексте образ открывающихся глаз
  alternative: «твой отец прозреет» / «к твоему отцу вернётся зрение»
  rationale: Контекст указывает на восстановление зрения, однако греческий текст выражает это через открытие глаз. Сохранение образа не опережает повествование и не устраняет его конкретность; сноска разъясняет смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов выбран ради естественности и ясности; архаизмы не используются.
