  text: because you afflicted me and had mercy on me. Behold[a], I see Tobiah my son. And his son entered rejoicing, and reported to his father the great things that had happened to him in Media.
translation:
  language: ru
  text: «…потому что Ты поразил меня и помиловал меня. Вот, я вижу Товию, сына моего». И вошёл сын его, радуясь, и рассказал отцу своему о великих событиях, происшедших с ним в Мидии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμαστίγωσας
  choice: Ты поразил меня
  rationale: Глагол буквально связан с бичеванием, но может обозначать тяжкое поражение или наказание. «Поразил» сохраняет прямое указание на действие Бога и не навязывает образ буквального бичевания.
- source_word: ἠλέησάς με
  choice: помиловал меня
  rationale: Естественная и традиционно понятная передача ἐλεέω, сохраняющая резкий контраст с предшествующим поражением.
- source_word: ἰδοὺ βλέπω
  choice: Вот, я вижу
  rationale: «Вот» передаёт указательное восклицание ἰδού в современном литературном регистре, а «я вижу» сохраняет простое значение βλέπω и подчёркивает возвращение зрения.
- source_word: χαίρων
  choice: радуясь
  rationale: Деепричастие естественно сохраняет сопутствующее эмоциональное состояние, выраженное греческим причастием.
- source_word: ἀπήγγειλεν
  choice: рассказал
  rationale: В повествовательном контексте это естественная передача сообщения обо всём пережитом; более формальное «возвестил» здесь звучало бы излишне возвышенно.
- source_word: τὰ μεγάλα τὰ γενόμενα αὐτῷ
  choice: о великих событиях, происшедших с ним
  rationale: 'Формулировка сохраняет неопределённость: речь может идти о значительных событиях, благодеяниях или делах, не приписывая их прямо Богу там, где греческий текст этого не уточняет.'
- source_word: ἐν τῇ Μηδείᾳ
  choice: в Мидии
  rationale: Стандартное русское название исторической области Media.
theological_decisions:
- issue: Действие Бога в страдании и милости
  choice: «Ты поразил меня и помиловал меня»
  alternative: «Ты подверг меня страданию и помиловал меня»
  rationale: Греческий текст прямо относит к Богу как тяжкое поражение, так и милость. Перевод не смягчает и не разрешает эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок «сына моего» и «отцу своему» сохраняет достоинство повествования, не делая речь архаичной. Начальное многоточие показывает, что стих начинается продолжением предыдущей реплики.
