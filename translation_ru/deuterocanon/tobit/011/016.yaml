base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/016.yaml
  text: And Tobit went out to meet his daughter-in-law[a], rejoicing and blessing God, at the gate of Nineveh. And those who saw him walking were amazed[b], because he could see.
translation:
  language: ru
  text: И Товит вышел навстречу своей невестке[a], радуясь и благословляя Бога, у ворот Ниневии. Видевшие, как он идёт, удивлялись[b], потому что он мог видеть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое νύμφη может означать как «невеста», так и «невестка»; здесь речь идёт о Сарре, жене сына Товита.
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте здесь стоит форма имени «Товия», однако по контексту речь идёт о старшем Товите: люди удивляются, что прежде слепой Товит теперь видит.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Прямое соответствие повествовательному аористу глагола движения; естественно передаёт выход навстречу прибывающим.
- source_word: Τωβείας
  choice: Товит
  rationale: 'Хотя греческая форма имени может передаваться как «Товия», контекст указывает на исцелённого отца: окружающие удивляются тому, что он видит.'
- source_word: εἰς συνάντησιν
  choice: навстречу
  rationale: Естественная русская передача устойчивого оборота со значением выхода для встречи прибывающего человека.
- source_word: τῇ νύμφῃ αὐτοῦ
  choice: своей невестке
  rationale: νύμφη допускает значения «невеста» и «невестка»; здесь Сарра является женой сына Товита, поэтому контекстуально уместно «невестка».
- source_word: χαίρων καὶ εὐλογῶν τὸν θεόν
  choice: радуясь и благословляя Бога
  rationale: Сохраняются параллельные причастия и прямое значение εὐλογέω без замены на более толковательное «прославляя».
- source_word: πρὸς τῇ πύλῃ Νινευή
  choice: к воротам Ниневии
  rationale: Оборот обозначает место у городских ворот; по-русски при глаголе движения естественно встроить его как направление выхода, не меняя места встречи.
- source_word: οἱ θεωροῦντες αὐτὸν πορευόμενον
  choice: видевшие, как он идёт
  rationale: Естественно передаёт наблюдение за Товитом в движении и сохраняет одновременность действий.
- source_word: ἐθαύμαζον
  choice: удивлялись
  rationale: Имперфект передаёт продолжавшуюся реакцию наблюдавших; «удивлялись» звучит современно и точно.
- source_word: ὅτι ἔβλεψεν
  choice: потому что он видел
  rationale: Близкая передача греческого текста без внесения эксплицитного «прозрел» или «вновь обрёл зрение»; факт восстановления зрения ясен из контекста.
theological_decisions:
- issue: Кого обозначает имя Τωβείας
  choice: Товит, исцелённый отец
  alternative: Товия, сын Товита
  rationale: Заключительная фраза о том, что он видел, в непосредственном повествовательном контексте относится к прежде слепому Товиту. Сохранение формы «Товия» могло бы ошибочно отнести действие к сыну.
- issue: Насколько явно обозначать восстановление зрения
  choice: Сохранить буквальное «он видел»
  alternative: «он прозрел» / «к нему вернулось зрение»
  rationale: Греческое ἔβλεψεν буквально утверждает, что он видел. Контекст подразумевает исцеление, но сам стих не выражает его отдельным глаголом восстановления; перевод сохраняет эту степень эксплицитности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Причастная конструкция первой фразы сохранена, а тяжёлая последовательность греческих оборотов перестроена ради естественного русского порядка слов. Неоднозначность νύμφη и текстовая форма имени отмечены сносками.
