  yaml_path: translation/deuterocanon/tobit/011/008.yaml
  text: You shall anoint his eyes with the gall[a], and when it stings, he will rub them, and the white films will come away[c][b], and he will see you.
translation:
  language: ru
  text: Ты намажь ему глаза желчью[a]. Когда у него от неё защиплет глаза[b], он потрёт их, белые плёнки[c] сойдут, и он увидит тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово обозначает желчь — вещество, используемое здесь как лекарство.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «когда его укусит»; здесь образно говорится о жгучем раздражении глаз.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «белые пятна», «белёсые помутнения». Речь идёт о белых образованиях на глазах, но не обязательно о катаракте в современном медицинском смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγχρισον
  choice: намажь
  rationale: Императив ἐγχρίω означает нанести вещество, намазывая или втирая его; «намажь» естественно передаёт конкретное действие с глазами.
- source_word: χολὴν
  choice: желчью
  rationale: χολή обозначает желчь; русское «желчь» точно и понятно передаёт вещество, употребляемое здесь как лечебное средство.
- source_word: δηχθεὶς
  choice: от жжения
  rationale: Форма передаёт буквальный образ укуса и вызванное веществом острое раздражение. «От жжения» естественно по-русски выражает ощущение, не превращая образ в неясное «когда укусит».
- source_word: διατρίψει
  choice: потрёт их
  rationale: Глагол указывает на растирание; местоимение «их» восполняет подразумеваемый объект — глаза.
- source_word: ἀποβαλεῖται
  choice: сойдут
  rationale: Средняя форма описывает удаление белых образований вследствие растирания; «сойдут» кратко и естественно передаёт их отделение.
- source_word: τὰ λευκώματα
  choice: белые плёнки
  rationale: Термин обозначает белёсые помутнения или образования на глазах. «Белые плёнки» сохраняет наглядность и не вводит более узкий современный диагноз «катаракта».
- source_word: ὄψεταί σε
  choice: он увидит тебя
  rationale: Перевод следует простой формулировке греческого текста, не добавляя явно не выраженного «снова прозреет».
