  yaml_path: translation/deuterocanon/tobit/011/002.yaml
  text: And Raphael said to Tobiah[a], “Do you not know, brother, how you left your father?”
translation:
  language: ru
  text: 'И Рафаил сказал Товии: «Разве ты не знаешь, брат, каким ты оставил своего отца?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как ты оставил своего отца?» Возможен также перевод: «Разве ты не помнишь, каким ты оставил своего отца?» Семитская параллель прямо упоминает слепоту отца, тогда как греческий текст выражается короче.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γινώσκεις
  choice: Разве ты не знаешь
  rationale: Передаёт обычное значение γινώσκω и естественную для русского языка форму риторического вопроса; по контексту выражение также может подразумевать воспоминание или осознание.
- source_word: ἀδελφέ
  choice: брат
  rationale: Сохраняет буквальное обращение и его тёплый, близкий характер, не уточняя, идёт ли речь о родстве или дружеском обращении.
- source_word: πῶς ἀφῆκες
  choice: в каком состоянии ты оставил
  rationale: В данном контексте πῶς указывает не просто на способ ухода, а на состояние отца при расставании; такой перевод естественно выражает подразумеваемый смысл, не называя прямо слепоту.
- source_word: τὸν πατέρα σου
  choice: своего отца
  rationale: Русское возвратное притяжательное местоимение естественно передаёт принадлежность отца субъекту придаточной конструкции.
theological_decisions:
- issue: Соотношение краткого греческого текста и более пространной семитской параллели
  choice: Сохранить краткий вопрос греческого текста, передав πῶς как указание на состояние отца, но не называя слепоту прямо.
  alternative: «Ты ведь знаешь, что твой отец слеп».
  rationale: Основным текстом служит греческий текст Свита. Семитская параллель помогает понять подразумеваемое состояние, однако её пояснение о слепоте не следует вносить в основной текст как явное утверждение.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная. Формулировка «в каком состоянии» раскрывает естественный для контекста смысл πῶς, сохраняя при этом недосказанность греческого текста.
