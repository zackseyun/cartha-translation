base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/011/017.yaml
  text: And Tobit gave thanks before them that God had shown them mercy. And when Tobit came near to Sarah his daughter-in-law[a], he blessed her, saying, “May you come in good health, daughter. Blessed is God, who has brought you to us, and your father and your mother.”
translation:
  language: ru
  text: 'И Товит перед ними благодарил Бога за то, что Он помиловал их. Когда же Товит приблизился к Сарре, своей невестке, он благословил её и сказал: «Да придёшь ты в добром здравии, дочь! Благословен Бог, Который привёл тебя к нам, и твой отец, и твоя мать».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь неожиданно обрывается словами «и твой отец, и твоя мать». Возможно, подразумевается продолжение: «и [благословенны] твой отец и твоя мать», однако в данном греческом свидетельстве такого сказуемого нет.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξωμολογεῖτο
  choice: благодарил Бога
  rationale: В сочетании с пояснением о Божьей милости глагол обозначает открытое благодарение и хвалу, а не исповедание греха. Дополнение «Бога» естественно выражает подразумеваемого адресата благодарения.
- source_word: ἐνώπιον αὐτῶν
  choice: перед всеми
  rationale: Передаёт публичный характер благодарения; местоимение относится к присутствующим людям.
- source_word: ἠλέησεν αὐτοὺς ὁ θεός
  choice: Он помиловал их
  rationale: «Помиловал» сохраняет богословскую весомость ἐλεέω и ясно обозначает уже совершённое действие Бога.
- source_word: τῇ νύμφῃ αὐτοῦ
  choice: своей невестке
  rationale: Здесь νύμφη обозначает жену сына Товита, то есть его невестку; русское «невеста» передало бы иную родственную перспективу.
- source_word: κατευλόγησεν
  choice: благословил
  rationale: Прямой и естественный русский эквивалент; усилительный оттенок приставки не требует отдельного наречия.
- source_word: Ἔλθοις ὑγιαίνουσα
  choice: Да придёшь ты в добром здравии
  rationale: Конструкция с «да» сохраняет желательный оттенок греческого оптатива, движение и благословительный характер слов, хотя в русском звучит возвышенно.
- source_word: θύγατερ
  choice: дочь
  rationale: Сохраняет тёплое семейное обращение без добавления отсутствующего в греческом притяжательного местоимения.
- source_word: εὐλογητὸς ὁ θεός
  choice: Благословен Бог
  rationale: Традиционная и понятная формула благословения, близкая к греческому тексту.
- source_word: ὃς ἤγαγέν σε πρὸς ἡμᾶς
  choice: Который привёл тебя к нам
  rationale: 'Передаёт завершённое действие и его наличный результат: Сарра теперь находится у семьи Товита.'
- source_word: καὶ ὁ πατήρ σου καὶ ἡ μήτηρ σου
  choice: и твой отец, и твоя мать
  rationale: Фраза сохранена без добавления подразумеваемого сказуемого, поскольку данный греческий свидетель обрывается именно так.
theological_decisions:
- issue: Значение ἐξωμολογεῖτο по отношению к Богу
  choice: публичное благодарение Бога
  alternative: исповедание или открытое прославление
  rationale: Придаточное о том, что Бог помиловал их, указывает на благодарное признание Божьего действия, а не на признание проступка.
- issue: Синтаксически незавершённая заключительная фраза
  choice: сохранить буквальное продолжение «и твой отец, и твоя мать»
  alternative: 'восполнить: «и благословенны твой отец и твоя мать»'
  rationale: В греческом свидетеле повторного сказуемого нет. Сохранение обрыва не устраняет подлинную неоднозначность и не вносит отсутствующих слов.
- issue: Желательный оттенок Ἔλθοις
  choice: передать формулой «Да придёшь ты…»
  alternative: «Добро пожаловать» или «Будь здорова»
  rationale: Выбранный вариант сохраняет оптативное пожелание, мотив прибытия и торжественный характер благословения, не сводя выражение только к приветствию или пожеланию здоровья.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Формула «Да придёшь ты в добром здравии» намеренно торжественнее разговорной речи, поскольку передаёт греческий оптатив и произносимое благословение. Финальная синтаксическая шероховатость сохранена и пояснена сноской.
