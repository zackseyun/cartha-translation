  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπελάβετο
  choice: поддержал
  rationale: Средняя форма ἐπιλαμβάνομαι означает «взяться за», «подхватить», «поддержать». В сцене лечения «поддержал» естественно передаёт физическое действие Товии, не добавляя идеи объятия.
- source_word: προσέπασεν
  choice: приложил
  rationale: Глагол обозначает нанесение вещества на поверхность. «Приложил желчь к глазам» звучит естественно в контексте лечебного действия и не делает способ нанесения излишне конкретным.
- source_word: χολήν
  choice: желчь
  rationale: Прямое и традиционное соответствие греческому χολή; сохраняет связь с приготовленным из рыбы средством.
- source_word: ὀφθαλμούς
  choice: глазам
  rationale: Обычное современное соответствие ὀφθαλμοί; дательный падеж обусловлен естественной русской конструкцией «приложить к».
- source_word: λέγων
  choice: говоря
  rationale: Деепричастие сохраняет незавершённый синтаксический переход к прямой речи следующего стиха, как и причастие в греческом тексте.
