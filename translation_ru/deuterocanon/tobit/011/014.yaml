  text: And she wept and said[a], “Blessed are you, O God, and blessed is your name forever, and blessed are all your holy angels,”
translation:
  language: ru
  text: 'И она заплакала и сказала: «Благословен ты, Боже, и благословенно имя твоё вовеки[a], и благословенны все святые ангелы твои,»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По-гречески буквально: «в века»; это устойчивое выражение означает «вечно, навсегда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαυσεν
  choice: она заплакала
  rationale: Греческая форма сама по себе не указывает на род, однако из ближайшего повествовательного контекста ясно, что речь идёт об Анне. Совершенный вид естественно передаёт наступление действия.
- source_word: Εὐλογητὸς εἶ ὁ θεός
  choice: Благословен ты, Боже
  rationale: Сохранена прямая формула благословения с возвышенным, но понятным обращением; русский звательный остаток «Боже» естественен в молитвенной речи.
- source_word: τὸ ὄνομά σου
  choice: имя твоё
  rationale: Буквально и естественно передаёт библейское выражение без истолковывающего расширения.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Устойчивый русский библейский эквивалент греческого идиоматического выражения, обозначающего вечность; сохраняет торжественный регистр и остаётся понятным.
- source_word: εὐλογημένοι πάντες οἱ ἅγιοι ἄγγελοί σου
  choice: благословенны все святые ангелы твои
  rationale: Сохраняется повтор корня εὐλογητ-, полнота πάντες и синтаксическая связь прилагательного ἅγιοι с существительным ἄγγελοι.
theological_decisions:
- issue: Формула благословения, обращённая к Богу
  choice: Благословен ты, Боже
  alternative: Хвала тебе, Боже
  rationale: Повторяющиеся формы εὐλογητ-/εὐλογημέν- выражают именно благословение. Сохранение одного корня передаёт литургическую структуру исходного текста и не подменяет её более общим языком хвалы.
- issue: Характер высказывания об ангелах
  choice: благословенны все святые ангелы твои
  alternative: да будут благословенны все святые ангелы твои
  rationale: Греческое именное выражение естественнее понимать как продолжение декларативной формулы; добавление пожелательного «да будут» сняло бы сохраняющуюся в оригинале грамматическую сжатость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной молитвенной интонацией. Повтор «благословен / благословенно / благословенны» намеренно сохраняет риторическую структуру греческого текста. Местоимения, относящиеся к Богу, даны со строчной буквы как нейтральная современная орфографическая практика, не выражающая богословского различия.
