lexical_decisions:
- source_word: ἤχθη
  choice: праздновали
  rationale: Аорист пассива от ἄγω здесь употреблён в значении проведения торжества. Русская неопределённо-личная конструкция естественно передаёт пассивно-событийный смысл без буквального и неуместного «была ведена».
- source_word: ὁ γάμος
  choice: свадьбу
  rationale: В сочетании с ликованием и продолжительностью в семь дней γάμος обозначает свадебное торжество, а не брак как состояние.
- source_word: Τωβεία
  choice: Товии
  rationale: Генитив имени указывает, чья это свадьба. Форма «Товия» соответствует принятой русской библейской передаче имени, а родительный падеж — «Товии».
- source_word: μετʼ εὐφροσύνης
  choice: с ликованием
  rationale: Сохраняет именную форму греческого оборота и его выраженный праздничный оттенок; звучит торжественно, но понятно современному читателю.
- source_word: ἑπτὰ ἡμέρας
  choice: семь дней
  rationale: Винительный длительности естественно передаётся по-русски сочетанием «семь дней» без обязательного предлога.
