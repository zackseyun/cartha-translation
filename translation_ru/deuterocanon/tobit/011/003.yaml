translation:
  language: ru
  text: «Побежим впереди твоей жены и приготовим дом[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «твоей жены». Хотя из более широкого контекста повествования некоторые могли бы ожидать здесь упоминания другого члена семьи, сохранившийся греческий текст говорит именно о жене; перевод следует ему.'
    reason: alternative_reading
lexical_decisions:
- source_word: προδράμωμεν
  choice: побежим вперёд
  rationale: Аористный сослагательный употреблён как призыв к совместному действию. Перевод сохраняет живой образ быстрого движения, а не ослабляет его до «пойдём».
- source_word: ἔμπροσθεν τῆς γυναικός σου
  choice: опередим твою жену
  rationale: ἔμπροσθεν при глаголе движения указывает на движение впереди кого-либо. В современном русском буквальное «побежим впереди твоей жены» могло бы означать лишь положение перед ней, поэтому «опередим» естественно передаёт направленность движения; γυνή с σου имеет значение «жена».
- source_word: ἑτοιμάσωμεν
  choice: приготовим
  rationale: Второй сослагательный также выражает совместное намерение. «Приготовим» ясно и естественно передаёт приведение места в готовность.
- source_word: τὴν οἰκίαν
  choice: дом
  rationale: В контексте прибытия οἰκία вероятнее всего обозначает жилище, которое следует приготовить, а не домочадцев.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Форма «побежим» сохраняет выразительность греческого глагола, а «опередим» устраняет неестественную для русского буквальную конструкцию. Местоимение «твою» передано без стилистического возвышения.
