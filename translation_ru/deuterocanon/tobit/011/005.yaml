  text: And Anna sat watching the road for her son,[a]
translation:
  language: ru
  text: А Анна сидела, всматриваясь в дорогу в ожидании сына.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «всматриваясь в дорогу, своего сына»; это сжатое выражение означает, что она смотрела на дорогу, ожидая сына.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: сидела
  rationale: Имперфект глагола κάθημαι описывает продолжавшееся положение Анны; простая форма «сидела» естественна для русского повествования.
- source_word: περιβλεπομένη
  choice: всматриваясь
  rationale: Причастие передаёт внимательный, ищущий взгляд. «Всматриваясь» сохраняет оттенок напряжённого ожидания и сочетается с указанием направления взгляда.
- source_word: εἰς τὴν ὁδόν
  choice: в дорогу
  rationale: ὁδός обозначает дорогу, по которой должен был возвратиться сын; «всматриваться в дорогу» — естественное современное русское выражение.
- source_word: τὸν παῖδα αὐτῆς
  choice: в ожидании сына
  rationale: παῖς в данном контексте означает родного сына Анны. Греческое выражение синтаксически сжато; добавление «в ожидании» естественно передаёт смысл, не уточняя сверх контекста способ или момент возвращения.
