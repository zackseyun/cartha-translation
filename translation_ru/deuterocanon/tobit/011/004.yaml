translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным строем. Начальное δέ передано словом «но», а смена субъекта во второй части — союзом «а». Сохранена краткость греческого свидетеля; более пространное параллельное чтение вынесено в примечание.
