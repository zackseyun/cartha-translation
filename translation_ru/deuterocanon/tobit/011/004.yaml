  text: But take the fish’s gall in your hand. And they went on, and the dog came along behind them.
translation:
  language: ru
  text: Но возьми в руку желчь рыбы.[a] Они пошли дальше, а собака последовала за ними.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое χολή означает желчь; здесь имеется в виду вещество, извлечённое из рыбы.
    reason: lexical_alternative
  - marker: b
    text: Параллельная традиция семитской формы этого эпизода значительно пространнее и повествует о том, как Товия прикладывает рыбью желчь к глазам отца. В основном тексте здесь воспроизведена более краткая греческая форма.
    reason: alternative_reading
lexical_decisions:
- source_word: λάβε
  choice: возьми
  rationale: Аористный императив от λαμβάνω выражает прямое практическое повеление; «возьми» естественно и точно передаёт его по-русски.
- source_word: παρὰ χεῖρα
  choice: в руку
  rationale: В данном контексте выражение означает взять или держать предмет в руке; буквальная и естественная русская формулировка сохраняет конкретность греческого текста.
- source_word: χολὴν τοῦ ἰχθύος
  choice: желчь рыбы
  rationale: χολή обозначает желчь как вещество; «желчь» — современный точный русский эквивалент, тогда как отдельного общеупотребительного русского соответствия английскому различению gall/bile здесь нет.
- source_word: ἐπορεύθησαν
  choice: пошли дальше
  rationale: Глагол обозначает дальнейшее движение персонажей; «пошли дальше» естественно передаёт продолжение пути без лишней конкретизации.
- source_word: συνῆλθεν
  choice: последовала
  rationale: В сочетании с ὀπίσωθεν αὐτῶν глагол описывает собаку, двигавшуюся вместе с путниками позади них; «последовала» по-русски передаёт это естественно.
- source_word: ὁ κύων
  choice: собака
  rationale: Артикль указывает на уже известную из повествования собаку; русский определённость передаёт контекстом.
- source_word: ὀπίσωθεν αὐτῶν
  choice: за ними
  rationale: Выражение указывает на движение позади путников; при глаголе «последовала» сочетание «за ними» звучит естественно и не меняет пространственного смысла.
