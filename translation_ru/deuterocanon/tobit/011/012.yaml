  register: 'Современный литературный русский язык с кратким, достойным повествовательным стилем. Перевод следует греческому тексту, а не ошибочному пониманию συνεδήχθησαν как «они сошлись»: в контексте и по форме глагола речь идёт о жжении или рези в глазах.'
