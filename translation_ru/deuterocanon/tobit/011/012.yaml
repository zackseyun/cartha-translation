  source_fidelity: Перевод верно следует греческому Θάρσει, πάτερ. ὡς δὲ συνεδήχθησαν, διέτριψε τοὺς ὀφθαλμοὺς αὐτοῦ. В частности, συνεδήχθησαν здесь передаёт ощущение укуса, жжения или рези (о глазах), а не встречу или воссоединение. Русское «Когда же у него защипало глаза» удачно и естественно выражает этот смысл; «он потёр их» точно передаёт διέτριψε τοὺς ὀφθαλμοὺς αὐτοῦ.
  naturalness: Текст краток, ясен и звучит по-современному литературно. «Мужайся, отец» — несколько возвышенное, но уместное для ободряющего обращения в повествовательном библейском регистре. Безличная конструкция «у него защипало глаза» естественна по-русски.
  terminology: Обращение «отец» соответствует греческому πάτερ без добавления отсутствующего притяжательного местоимения. «Мужайся» обоснованно передаёт императив Θάρσει. Термины и примечания не вносят конфессиональных толкований.
