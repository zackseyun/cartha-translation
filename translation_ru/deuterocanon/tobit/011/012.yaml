lexical_decisions:
- source_word: Θάρσει
  choice: Мужайся
  rationale: Повелительная форма θαρσέω выражает ободрение и призыв не падать духом. «Мужайся» кратко, естественно и сохраняет силу греческого выражения; возможный вариант — «Не бойся» или «Ободрись».
- source_word: πάτερ
  choice: отец
  rationale: Греческое обращение стоит без притяжательного местоимения, поэтому «мой» не добавляется.
- source_word: ὡς δὲ συνεδήχθησαν
  choice: Когда же у него защипало глаза
  rationale: Форма συνεδήχθησαν связана со значением укуса, жжения или рези; подразумеваемое подлежащее во множественном числе — глаза. Русская безличная конструкция естественно передаёт наступившее раздражение глаз.
- source_word: διέτριψε τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: он потёр их
  rationale: Глагол διατρίβω здесь обозначает растирающее движение; местоимение «их» ясно отсылает к только что названным глазам и избегает тяжёлого повтора.
