  yaml_path: translation/deuterocanon/tobit/003/017.yaml
  text: 'of the great Raphael. And he was sent to heal the two: to remove the white films from Tobit''s eyes[a], and to give Sarah daughter of Raguel to Tobiah son of Tobit as a wife, and to bind Asmodeus, the evil demon, because Tobiah was entitled to inherit her. At that same time Tobit returned and entered into his house, and Sarah daughter of Raguel came down from her upper room.'
translation:
  language: ru
  text: 'великого Рафаила. И он был послан исцелить обоих: снять белёсые помутнения с глаз Товита, отдать Сару, дочь Рагуила, в жёны Товии, сыну Товита, и связать Асмодея, злого демона, потому что Товия имел право унаследовать её.[a] В то самое время Товит возвратился и вошёл в свой дом, и Сара, дочь Рагуила, сошла из своей верхней комнаты.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «потому что Товия имел право жениться на ней». В греческом тексте буквально употреблено выражение «унаследовать её», отражающее семейно-правовой уклад повествования.'
    reason: Лексическая альтернатива поясняет необычное употребление наследственного языка в брачном контексте.
lexical_decisions:
- source_word: Ῥαφαήλ
  choice: Рафаила
  rationale: Имя передано в принятой русской библейской форме. Начальный родительный оборот сохранён, поскольку в греческом он связывает стих с предшествующим контекстом.
- source_word: ἀπεστάλη
  choice: он был послан
  rationale: Пассивная форма сохраняет не названного прямо отправителя и не вносит уточнения сверх греческого текста.
- source_word: ἰάσασθαι τοὺς δύο
  choice: исцелить обоих
  rationale: Естественная русская передача, при которой исцеление охватывает и физическое прозрение Товита, и избавление Сарры.
- source_word: λεπίσαι τὰ λευκώματα
  choice: снять белые плёнки с глаз Товита
  rationale: Передаёт образ удаления белёсых глазных помутнений, не навязывая современный диагноз «катаракта». Упоминание глаз эксплицирует очевидный анатомический смысл λευκώματα в данном контексте.
- source_word: δοῦναι ... γυναῖκα
  choice: отдать Сарру ... в жёны Товии
  rationale: Современная и ясная русская формула, сохраняющая древний брачный оборот и направление действия.
- source_word: δῆσαι
  choice: связать
  rationale: Прямая передача глагола, сохраняющая конкретный образ обуздания демона.
- source_word: τὸ πονηρὸν δαιμόνιον
  choice: злого демона
  rationale: Нейтральная и точная современная передача без конфессионально обусловленного расширения.
- source_word: ἐπιβάλλει κληρονομῆσαι αὐτήν
  choice: имел право унаследовать её
  rationale: Сохраняет необычный наследственно-правовой язык греческого текста и одновременно передаёт значение законного притязания.
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: В то самое время
  rationale: Передаёт подчёркнутую одновременность событий.
- source_word: ἐπιστρέψας ... εἰσῆλθεν εἰς τὸν οἶκον αὐτοῦ
  choice: возвратился и вошёл в свой дом
  rationale: Естественно передаёт последовательность двух греческих действий без ненужного буквализма.
- source_word: ὑπερῴου
  choice: верхней комнаты
  rationale: Понятная современному читателю передача помещения на верхнем этаже; не уточняет архитектуру сверх исходного слова.
theological_decisions:
- issue: Объём миссии Рафаила
  choice: «Исцелить обоих» относится ко всей последующей последовательности действий в отношении Товита и Сарры.
  alternative: Ограничить исцеление только телесным недугом Товита, а избавление Сарры описать как отдельную миссию.
  rationale: Инфинитив ἰάσασθαι управляет всей последовательностью после τοὺς δύο, поэтому широкий смысл исцеления и избавления лучше соответствует синтаксису.
- issue: Наследственный язык применительно к Сарре
  choice: В основном тексте сохранено «имел право унаследовать её».
  alternative: «Имел право жениться на ней» или «был следующим, кому надлежало взять её в жёны».
  rationale: Греческий текст намеренно использует κληρονομῆσαι в брачно-родовом правовом контексте. Необычность сохранена, а идиоматический смысл пояснён в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Имена переданы в традиционных русских формах: Рафаил, Товит, Товия, Сарра, Рагуил, Асмодей. Начальный фрагмент сознательно оставлен синтаксически зависимым от предыдущего стиха, как в предоставленном греческом тексте.'
