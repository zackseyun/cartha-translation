  source_fidelity: 'Начальная часть передана точно: σὺ γινώσκεις, Κύριε — «Ты знаешь, Господи», καθαρά εἰμι ἀπὸ πάσης ἁμαρτίας — «я чиста от всякого греха». Однако «чиста ... от мужчины» в русском языке не образует ясной и естественной конструкции. Эллиптическое καὶ ἀνδρός не следует превращать в утверждение о конкретном виде греха; допустимо лишь минимально раскрыть подразумеваемую связь, сохранив неопределённость «мужчина/муж».'
