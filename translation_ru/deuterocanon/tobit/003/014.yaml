translation:
  language: ru
  text: Ты знаешь, Господи, что я чиста от всякого греха и от связи с мужчиной[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. буквально: «и от мужчины»; ἀνήρ может также значить «муж». Краткое выражение эллиптично; возможно, речь идёт о близости с мужчиной.'
    reason: Уточняет необходимую для русского языка связь, сохраняя лексическую и смысловую неопределённость греческого выражения.
lexical_decisions:
- source_word: σὺ γινώσκεις
  choice: Ты знаешь
  rationale: Прямо передаёт усиленное местоимением обращение и настоящее время глагола.
- source_word: καθαρά εἰμι
  choice: я чиста
  rationale: Сохраняет предикативное прилагательное женского рода и допускаемую контекстом нравственную и телесную чистоту.
- source_word: ἀπὸ πάσης ἁμαρτίας
  choice: от всякого греха
  rationale: Формально и естественно передаёт греческую конструкцию с ἀπό и πάσης.
- source_word: καὶ ἀνδρός
  choice: и от мужчины
  rationale: Сохраняет краткость и синтаксический параллелизм оригинала; ἀνήρ в родительном без артикля допускает такое неопределённое, обобщённое прочтение.
theological_decisions:
- issue: Смысл утверждения о чистоте «от мужчины»
  choice: Не уточнять в основном тексте характер отношений
  alternative: «не имела близости с мужчиной» или «чиста от греха с мужчиной»
  rationale: Греческий текст выражен эллиптически и не называет прямо ни половую близость, ни конкретный грех; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; молитвенное обращение передано с достоинством и без архаизации. Женский род «чиста» соответствует говорящей Сарре. Запятая перед сноской сохраняет незавершённость фразы в предоставленном фрагменте.
