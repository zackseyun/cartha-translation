  yaml_path: translation/deuterocanon/tobit/003/018.yaml
  text: Seek counsel from every wise person[a], and do not despise any useful counsel.
translation:
  language: ru
  text: Ищи совета у каждого благоразумного человека и не пренебрегай ни одним полезным советом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβουλίαν / συμβουλίας
  choice: совета / советом
  rationale: Существительное обозначает совет, помогающий принять решение. Лексическое повторение в обеих частях сохраняет повтор греческого текста и естественно звучит по-русски.
- source_word: παρὰ παντὸς φρονίμου
  choice: у каждого благоразумного человека
  rationale: παρά с родительным падежом указывает на источник совета; субстантивированное φρόνιμος имеет обобщённое значение. «Благоразумный человек» передаёт рассудительность без неоправданного ограничения мужским полом.
- source_word: ζήτησον
  choice: ищи
  rationale: Императив выражает активное стремление получить совет; «ищи совета» — естественное и достаточно сильное русское выражение.
- source_word: μὴ καταφρονήσῃς
  choice: не пренебрегай
  rationale: Глагол означает относиться свысока, с презрением или считать недостойным внимания. «Не пренебрегай» сохраняет нравственную силу запрета и естественно сочетается со словом «совет».
- source_word: ἐπὶ πάσης συμβουλίας χρησίμης
  choice: ни одним полезным советом
  rationale: При отрицании оборот «ни одним» естественно передаёт всеохватность πάσης, а «полезным» прямо выражает χρησίμης.
theological_decisions:
- issue: Обобщённое значение φρονίμου
  choice: благоразумного человека
  alternative: мудреца / благоразумного мужчины
  rationale: В греческом употреблено субстантивированное прилагательное без существительного, явно обозначающего мужчину; перевод сохраняет родовую отнесённость ко всякому благоразумному человеку.
translation_notes:
  register: Современный литературный русский язык; наставительный, лаконичный и достойный регистр. Синтаксический параллелизм и повтор слова «совет» отражают структуру греческого текста.
