translation:
  language: ru
  text: И молитва обоих была услышана пред Славой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пред славой Бога»; или: «в присутствии Славы». В этой фразе греческого текста Бог прямо не назван.'
