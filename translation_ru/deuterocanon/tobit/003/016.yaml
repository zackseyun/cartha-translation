lexical_decisions:
- source_word: εἰσηκούσθη
  choice: была услышана
  rationale: Пассивная форма εἰσακούω применительно к молитве указывает на благосклонное услышание. Перевод сохраняет близость к греческому тексту и не усиливает смысл до явного «получила ответ».
- source_word: προσευχὴ
  choice: молитва
  rationale: Прямое и естественное соответствие обычному значению греческого слова.
- source_word: ἀμφοτέρων
  choice: обоих
  rationale: Родительный падеж относится к двум ранее названным людям; «обоих» кратко и естественно передаёт эту связь.
- source_word: ἐνώπιον
  choice: пред
  rationale: Передаёт значение «перед, в присутствии»; форма «пред» здесь уместна в возвышенном, но понятном повествовании и хорошо сочетается со «Славой».
- source_word: τῆς δόξης
  choice: Славой
  rationale: Греческий текст содержит определённый артикль и, вероятно, почтенно обозначает славное присутствие Бога. Существительное сохранено без поясняющего добавления «Божьей», а прописная буква отражает вероятное особое употребление.
theological_decisions:
- issue: Следует ли раскрывать δόξης как прямое указание на Бога
  choice: Славой
  alternative: славой Бога; славным присутствием Бога
  rationale: Хотя из контекста ясно, что речь идёт о Божьем присутствии, в самой греческой фразе Бог прямо не назван. Перевод сохраняет почтенную непрямоту и богословскую выразительность оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Пред» сохраняет достоинство формулировки, оставаясь понятным современному читателю; «Слава» написана с прописной буквы как вероятное почтительное обозначение Божьего присутствия.
