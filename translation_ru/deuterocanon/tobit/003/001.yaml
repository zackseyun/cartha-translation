  footnotes:
  - marker: a
    text: 'Греческий текст здесь краток: «И, опечалившись, я заплакал и с болью молился, говоря». В более пространной традиции семитского типа плач в последующих строках значительно расширен; эта начальная фраза надёжно засвидетельствована в греческом тексте.'
