lexical_decisions:
- source_word: λυπηθεὶς
  choice: опечалившись
  rationale: Деепричастие непосредственно передаёт аористное страдательное причастие и обозначает состояние печали, на фоне которого происходят последующие действия.
- source_word: ἔκλαυσα
  choice: я заплакал
  rationale: Точно передаёт κλαίω как плач, не добавляя отсутствующей в греческом тексте степени интенсивности.
- source_word: προσηυξάμην
  choice: молился
  rationale: Обычный и естественный русский эквивалент προσεύχομαι; отдельное усиление не добавляется, поскольку глубина переживания выражена оборотом μετʼ ὀδύνης.
- source_word: μετʼ ὀδύνης
  choice: в мучительной скорби
  rationale: Передаёт глубокую душевную боль, выраженную словом ὀδύνη, и естественно сочетается с глаголом «молился».
- source_word: λέγων
  choice: говоря
  rationale: Сохраняет причастную конструкцию, вводящую содержание последующей молитвы.
