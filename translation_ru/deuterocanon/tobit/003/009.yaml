  yaml_path: translation/deuterocanon/tobit/003/009.yaml
  text: Why do you flog us? If they have died[a], go with them! May we never see a son or daughter from you forever.
translation:
  language: ru
  text: «За что ты бичуешь нас? Если они умерли[a], ступай вместе с ними! Пусть мы вовеки не увидим у тебя ни сына, ни дочери».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Иными словами, по смыслу: «ступай умирать вместе с ними». В греческом тексте сказано лишь «ступай вместе с ними», однако речь идёт об умерших мужьях Сарры.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαστιγοῖς
  choice: бичуешь
  rationale: Глагол буквально обозначает бичевание и здесь образно передаёт жестокое мучение; «бичуешь» сохраняет резкость оскорбительного упрёка.
- source_word: βάδιζε μετʼ αὐτῶν
  choice: ступай к ним
  rationale: Императив означает «иди, ступай»; в контексте речь об умерших мужьях Сарры. Перевод сохраняет подразумеваемое пожелание смерти, не добавляя отсутствующего в греческом глагола «умри».
- source_word: μὴ ἴδωμέν
  choice: пусть мы… не увидим
  rationale: Сослагательное наклонение с μή выражает сильное пожелание, здесь близкое к проклятию.
- source_word: σου υἱὸν ἢ θυγατέρα
  choice: у тебя ни сына, ни дочери
  rationale: Местоимение σου связано с сыном и дочерью; по контексту имеется в виду, что Сарра не родит детей. Русское «увидим у тебя» естественно передаёт эту мысль.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Устойчивое наречие передаёт значение «никогда, навсегда» и соответствует высокому, но понятному регистру проклятия.
theological_decisions:
- issue: Подразумеваемый смысл выражения «ступай к ним»
  choice: Сохранено буквальное «ступай к ним», а подразумеваемое пожелание присоединиться к умершим разъяснено в сноске.
  alternative: «Ступай умирать вместе с ними» или «умри вместе с ними».
  rationale: Греческий текст прямо говорит только «ступай с ними/к ним». Контекст указывает на смерть мужей, но эксплицитное «умри» устранило бы намеренную имплицитность исходного текста.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного текста. Реплика звучит резко и оскорбительно; «бичуешь» и «вовеки» сохраняют её повышенную, проклинающую тональность. Частица «ни… ни» естественно сочетается с отрицательным пожеланием.
