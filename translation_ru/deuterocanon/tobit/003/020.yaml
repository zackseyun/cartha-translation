  text: And now I am showing you the ten talents of silver that I deposited with Gabael son of Gabrias in Rages of Media[a][b].
translation:
  language: ru
  text: А теперь я указываю тебе[a] на десять талантов серебра, которые оставил на хранение у Гаваила, сына Гаврии, в Рагах Мидии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «даю тебе знать». Греческий глагол может означать не только физическое показывание, но и сообщение о чём-либо или обращение внимания на это.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδεικνύω
  choice: указываю тебе
  rationale: Глагол может означать как «показывать», так и «доводить до сведения, обращать внимание». В данном контексте «указываю тебе» естественно передаёт непосредственное привлечение внимания к вкладу, не утверждая, что серебро физически показывают.
- source_word: τὰ δέκα τάλαντα τοῦ ἀργυρίου
  choice: десять талантов серебра
  rationale: Сохранены древняя мера веса и указание на материал; современный пересчёт был бы неточным и скрыл бы форму исходного текста.
- source_word: παρεθέμην
  choice: оставил на хранение
  rationale: Средний залог обозначает передачу имущества другому лицу для сохранения. Эта формулировка яснее и исторически нейтральнее современного банковского «положил на счёт».
- source_word: Γαβαήλῳ
  choice: у Гаваила
  rationale: Имя передано в традиционной русской библейской форме; предлог «у» естественно сочетается с выражением «оставил на хранение» и передаёт греческий дательный лица.
- source_word: τῷ τοῦ Γαβρεία
  choice: сына Гаврии
  rationale: Артикль с родительным имени отца представляет обычное греческое обозначение происхождения; по-русски оно ясно передаётся словом «сын».
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: в Рагах Мидии
  rationale: Сохранены древние географические названия и конструкция, обозначающая город Раги в области Мидия.
