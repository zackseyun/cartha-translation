  text: When she heard these things[a], she was deeply grieved, so that she wanted to hang herself. But she said, “I am my father’s only child. If I do this, it will be a disgrace to him, and I will bring his old age down with sorrow to Hades.”
translation:
  language: ru
  text: 'Услышав это, она так сильно опечалилась, что захотела повеситься. Но сказала: «Я у отца одна. Если я это сделаю, на него падёт позор, и я сведу его седины со скорбью в Аид[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в мир мёртвых»; также возможно: «в могилу». В греческом тексте: «в Аид».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα ἀκούσασα
  choice: Услышав это
  rationale: Естественно передаёт временное значение причастия и сохраняет указательное ταῦτα без излишнего уточнения.
- source_word: ἐλυπήθη σφόδρα
  choice: так глубоко опечалилась
  rationale: Передаёт сильную душевную скорбь и подготавливает конструкцию следствия с ὥστε.
- source_word: ὥστε ἀπάγξασθαι
  choice: что захотела повеситься
  rationale: Контекст показывает задуманное, но не совершённое действие; формулировка не превращает порыв в окончательно принятое решение.
- source_word: Μία μέν εἰμι τῷ πατρί μου
  choice: Я у отца одна
  rationale: Краткая естественная русская формулировка сохраняет женскую форму μία и смысл единственного ребёнка или единственной дочери, не устраняя возможный оттенок исходного выражения.
- source_word: ὄνειδος αὐτῷ ἔσται
  choice: на него падёт позор
  rationale: Передаёт общественный стыд и поношение, которые её поступок навлёк бы на отца.
- source_word: τὸ γῆρας αὐτοῦ κατάξω
  choice: я сведу его седины
  rationale: Русский библейский идиом естественно выражает причинное значение κατάξω и метонимическое «его старость», сохраняя торжественную образность.
- source_word: μετʼ ὀδύνης
  choice: со скорбью
  rationale: В данном семейном и погребальном контексте ὀδύνη обозначает прежде всего мучительную душевную боль.
- source_word: εἰς ᾅδου
  choice: в Аид
  rationale: Сохраняет прямо названный в греческом тексте ᾅδης и не подменяет его более узким понятием ада как места наказания.
theological_decisions:
- issue: Передача ᾅδης в греческом тексте Второканонической книги
  choice: Аид
  alternative: мир мёртвых; могила
  rationale: Транслитерированное название сохраняет исходный термин и его смысловую широту, не отождествляя его безоговорочно ни с могилой, ни с местом окончательного наказания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Оборот «сведу его седины» выбран как понятный русский эквивалент метонимии «сведу его старость»; синтаксис прямой и доступный. Маркер сноски поставлен непосредственно после слова, к которому относится примечание.
