- source_word: Ἐν τῇ αὐτῇ ἡμέρᾳ
  choice: В тот же день
  rationale: Естественное русское повествовательное начало сохраняет указательное значение αὐτῇ и связь с предшествующими событиями.
- source_word: συνέβη
  choice: случилось
  rationale: Передаёт безличный повествовательный оборот современным литературным русским языком.
- source_word: τῇ θυγατρὶ Ῥαγουὴλ Σάρρᾳ
  choice: Сарре, дочери Рагуила
  rationale: Сохраняет имя, дательный падеж и указание на отца в естественном русском порядке слов.
- source_word: ἐν Ἐκβατάνοις τῆς Μηδείας
  choice: жившей в Экбатанах Мидии
  rationale: Явно связывает географическое указание с Саррой и естественно передаёт региональный генитив; добавленное «жившей» не меняет содержания, а устраняет тяжеловесное нанизывание обстоятельств.
- source_word: καὶ ταύτην
  choice: и Сарре … выслушать
  rationale: «И» сохраняет добавочное значение καί и параллель с участью Товита; повторное местоимение в русском обороте не требуется.
- source_word: ὀνειδισθῆναι
  choice: выслушать упрёки
  rationale: Активная русская конструкция естественно передаёт страдательный инфинитив и смысл оскорбительного порицания, не сводя его только к насмешке.
- source_word: ὑπὸ παιδισκῶν πατρὸς αὐτῆς
  choice: от служанок своего отца
  rationale: «Служанки» передаёт женский пол и подчинённое домашнее положение παιδίσκαι; «своего отца» недвусмысленно относится к Сарре.
