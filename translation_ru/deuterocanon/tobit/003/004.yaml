  source_fidelity: 'Основная последовательность бедствий и различение «они» / «нас» переданы верно. Однако «притчей, вызывающей поношение» меняет связь компонентов: по-русски поношение вызывает сама «притча», тогда как παραβολὴν ὀνειδισμοῦ означает присловье/поговорку, выражающую публичное поношение. Также перфектное состояние ἐσκορπίσμεθα лучше передать настоящим результативным «мы рассеяны».'
  naturalness: «Сделал нас притчей, вызывающей поношение» звучит неестественно и семантически неясно для современного литературного русского. «Присловьем для поношения» сохраняет образ и естественно выражает функцию присловья как унизительного публичного наименования.
  terminology: «Заповеди», «плен», «смерть», «народы» и прямое «Ты отдал» удачны. «Присловье» точнее отражает здесь παραβολή как byword/proverb, чем «притча», которая в современном библейском русском прежде всего обозначает повествовательную притчу.
