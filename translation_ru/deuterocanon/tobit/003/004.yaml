base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/004.yaml
  text: For they disobeyed your commandments, and you gave us over to plunder and captivity and death, and to become a proverb of reproach among all the nations where we have been scattered.
translation:
  language: ru
  text: Ведь они не послушались Твоих заповедей, и Ты отдал нас на разграбление, в плен и на смерть и сделал нас присловьем для поношения[a] среди всех народов, среди которых мы рассеяны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «притчей для поношения», «присловьем позора»; по смыслу: «предметом поношения». Греческое выражение соединяет значения «присловье, поговорка» и «поношение».'
    reason: Лексическая альтернатива для необычного сочетания παραβολὴν ὀνειδισμοῦ.
lexical_decisions:
- source_word: παρήκουσαν
  choice: они не послушались
  rationale: Передаёт буквальный образ отказа внимать и его смысл — неповиновение; форма третьего лица сохраняет различие между согрешившими «ими» и страдающими «нами».
- source_word: τῶν ἐντολῶν σου
  choice: Твоих заповедей
  rationale: «Заповеди» сохраняет религиозный и заветный оттенок ἐντολή; родительный падеж после «не послушались» естественен для современного русского языка.
- source_word: ἔδωκας ἡμᾶς εἰς
  choice: Ты отдал нас на… в… и на… и сделал нас
  rationale: «Отдал» сохраняет прямое указание на Божье действие в суде. Управление варьируется ради естественного русского перечисления; для последнего следствия смысл конструкции раскрыт глаголом «сделал».
- source_word: διαρπαγήν
  choice: на разграбление
  rationale: Передаёт участь людей, отданных на расхищение и грабёж, и сохраняет отглагольный характер греческого существительного.
- source_word: αἰχμαλωσίαν
  choice: в плен
  rationale: Естественный русский эквивалент со значением пленения и пребывания в неволе; не подменяет плен более широким понятием изгнания.
- source_word: θάνατον
  choice: на смерть
  rationale: Прямо передаёт θάνατος без смягчения до общего «бедствия» или расширения до «гибели».
- source_word: παραβολὴν ὀνειδισμοῦ
  choice: притчей, вызывающей поношение
  rationale: 'Сохраняет оба компонента необычного греческого сочетания: παραβολή как притча или присловье и ὀνειδισμός как поношение. Сноска поясняет более идиоматический смысл.'
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: среди всех народов
  rationale: «Народы» соответствует широкому значению ἔθνη в контексте рассеяния и не привносит более специального оттенка слова «язычники».
- source_word: ἐν οἷς ἐσκορπίσμεθα
  choice: между которыми мы были рассеяны
  rationale: Сохраняет соотнесённость местоимения с народами и пассивную форму глагола; «были рассеяны» естественно передаёт состоявшееся рассеяние.
theological_decisions:
- issue: Корпоративное исповедание и действие Бога в суде
  choice: Сохранены «они не послушались» и прямое «Ты отдал нас».
  alternative: Обобщить вину как «мы не послушались» или ослабить Божье действие пассивом «мы были отданы».
  rationale: Греческий текст различает непослушавшихся «их» и страдающих «нас», одновременно прямо приписывая Богу передачу народа бедствиям. Перевод не сглаживает это напряжение.
- issue: Образ публичного позора в παραβολὴν ὀνειδισμοῦ
  choice: В основном тексте сохранены образы притчи и поношения, а идиоматический смысл пояснён в сноске.
  alternative: 'Передать только смыслом: «предметом насмешек» или «посмешищем».'
  rationale: Более свободные варианты понятнее, но утрачивают двойное выражение греческого текста; основной перевод сохраняет его, не оставляя читателя без пояснения.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Прописные местоимения при обращении к Богу соответствуют принятой русской библейской традиции. Синтаксис сохраняет длинное перечисление оригинала, но падежное управление сделано естественным для русского языка.
