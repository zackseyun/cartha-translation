base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/006.yaml
  text: And now deal with me according to what is pleasing to you[a]. Command that my spirit be taken up, so that I may be released and become dust. For it is better for me to die than to live, because I have heard false reproaches, and there is great grief within me. Command that I be released now from this distress into the everlasting place[b], and do not turn your face away from me.
translation:
  language: ru
  text: 'А теперь поступи со мной так, как тебе угодно. Повели взять мой дух, чтобы я освободился и обратился в землю[a], ибо лучше мне умереть, чем жить: я слышал ложные поношения, и великая скорбь во мне. Повели уже отпустить меня из этой беды в вечное место[b] и не отворачивай от меня своего лица.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал прахом». Буквально по-гречески: «обратился в землю»; это образ смерти и возвращения человека в землю.'
    reason: lexical_alternative
  - marker: b
    text: «Вечное место» — общее обозначение места умерших; греческий текст не употребляет здесь более определённого богословского термина.
    reason: cultural_note
lexical_decisions:
- source_word: κατὰ τὸ ἀρεστόν σου
  choice: так, как тебе угодно
  rationale: Естественно передаёт сообразность Божьей воле, сохраняя прямое обращение молитвы.
- source_word: ἐπίταξον
  choice: повели
  rationale: Сохраняет властный и торжественный смысл греческого императива.
- source_word: ἀναλαβεῖν τὸ πνεῦμά μου
  choice: взять мой дух
  rationale: Передаёт πνεῦμα как «дух», а не как «жизнь», и не уточняет не названного в греческом исполнителя повеления.
- source_word: ἀπολυθῶ / ἀπολυθῆναι
  choice: освободился / отпустить меня
  rationale: Сохраняет повторяющийся образ освобождения как благоговейное иносказание смерти; различие русских форм обусловлено синтаксисом.
- source_word: γένωμαι γῆ
  choice: стал землёй
  rationale: Формально передаёт γῆ и сохраняет образ возвращения смертного человека в землю; более привычное «стал прахом» указано в сноске.
- source_word: λυσιτελεῖ μοι
  choice: лучше мне
  rationale: Идиоматично выражает сравнительную предпочтительность смерти перед жизнью в данном контексте.
- source_word: ὀνειδισμοὺς ψευδεῖς
  choice: ложные поношения
  rationale: Передаёт как оскорбительный укор, так и его ложность, сохраняя торжественный регистр.
- source_word: λύπη ἐστὶν πολλὴ ἐν ἐμοί
  choice: великая скорбь во мне
  rationale: Сохраняет именную конструкцию и акцент на внутреннем состоянии говорящего.
- source_word: τῆς ἀνάγκης
  choice: этой беды
  rationale: В плаче ἀνάγκη обозначает тягостное бедствие; «беда» здесь естественнее буквального «необходимость».
- source_word: εἰς τὸν αἰώνιον τόπον
  choice: в вечное место
  rationale: Прямо передаёт широкое греческое выражение, не подменяя его более конкретным термином о посмертном состоянии.
- source_word: μὴ ἀποστρέψῃς τὸ πρόσωπόν σου ἀπʼ ἐμοῦ
  choice: не отворачивай от меня своего лица
  rationale: Сохраняет библейский образ отвращённого лица без истолковывающей замены.
theological_decisions:
- issue: Антропологическая формулировка просьбы о смерти
  choice: взять мой дух
  alternative: лишить меня жизни; принять мой дух
  rationale: Греческий текст прямо называет πνεῦμα, поэтому сохранено слово «дух», но не добавлено учение о том, кем и куда он принимается.
- issue: Обозначение посмертного места
  choice: вечное место
  alternative: вечный дом; могила; преисподняя
  rationale: Источник не называет ни небо, ни Аид, ни могилу, поэтому широкая и несколько загадочная формулировка сохранена.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией молитвы. Божественные местоимения даны со строчной буквы как нейтральная современная издательская норма; повтор повелительного «повели» сохранён ради структуры исходного текста.
