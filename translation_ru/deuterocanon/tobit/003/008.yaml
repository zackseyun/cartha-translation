  yaml_path: translation/deuterocanon/tobit/003/008.yaml
  text: because she had been given to seven husbands[a], and Asmodeus, the evil demon, killed them before they could be with her as with wives. And they said to her, “Do you not understand that you are choking your husbands? Already you have had seven, and you have not benefited from even one of them.”
translation:
  language: ru
  text: 'потому что её выдали замуж за семерых мужей, а злой демон Асмодей убил их прежде, чем они могли сойтись с ней, как сходятся с жёнами.[a] И они говорили ей: «Неужели ты не понимаешь, что душишь своих мужей? У тебя уже было семеро мужей, но ни от одного из них ты не получила пользы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прежде, чем они могли вступить с ней в супружескую близость». Греческий текст иносказательно говорит о супружеском соединении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεδομένη ἀνδράσιν ἑπτά
  choice: её выдавали замуж за семерых мужей
  rationale: Перфект пассива δίδωμι указывает, что её отдавали мужчинам в браке; русское «выдавали замуж» естественно передаёт брачный контекст, а «мужей» сохраняет значение ἀνδράσιν.
- source_word: Ἀσμοδαῖος τὸ πονηρὸν δαιμόνιον
  choice: злой демон Асмодей
  rationale: Сохраняются имя собственное и явная характеристика существа как злого демона; порядок слов естественен для русского языка.
- source_word: ἀπέκτεινεν
  choice: убивал
  rationale: Имперфективное русское прошедшее уместно для повторявшегося действия в отношении семерых мужей, хотя греческий аорист представляет событие суммарно.
- source_word: πρὶν ἢ γενέσθαι αὐτοὺς μετʼ αὐτῆς ὡς ἐν γυναιξίν
  choice: прежде, чем они успевали сойтись с ней как с женой
  rationale: «Сойтись» сохраняет эвфемистический характер греческого выражения о супружеской близости; «как с женой» естественно по-русски передаёт родовое множественное γυναιξίν.
- source_word: Οὐ συνιεῖς
  choice: Неужели ты не понимаешь
  rationale: Передаёт как значение συνίημι, так и насмешливо-обвинительный характер вопроса.
- source_word: ἀποπνίγουσά σου τοὺς ἄνδρας
  choice: что душишь своих мужей
  rationale: «Душишь» непосредственно и выразительно передаёт ἀποπνίγουσα и сохраняет жестокую гиперболу обвинения.
- source_word: ἤδη ἑπτὰ ἔσχες
  choice: У тебя уже было семеро
  rationale: Сохраняет краткость оригинала; слово «мужей» ясно подразумевается из предыдущей фразы.
- source_word: ἑνὸς αὐτῶν οὐκ ὠνάσθης
  choice: ни от одного из них ты не получила пользы
  rationale: ὠνάσθης означает получить пользу или выгоду; формулировка сохраняет резкость оскорбления без домысливания конкретного вида пользы.
theological_decisions:
- issue: Эвфемизм супружеской близости в πρὶν ἢ γενέσθαι αὐτοὺς μετʼ αὐτῆς ὡς ἐν γυναιξίν
  choice: «прежде, чем они успевали сойтись с ней как с женой»
  alternative: «прежде, чем они вступали с ней в супружескую близость»
  rationale: Выбранный вариант сохраняет скромную косвенность греческого текста и вместе с тем понятен современному читателю; примечание поясняет смысл без его навязывания в основном тексте.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Речь служанок намеренно сохраняет обвинительную резкость. Союз «потому что» оставлен со строчной буквы, поскольку стих синтаксически продолжает предшествующий контекст.
