base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/015.yaml
  text: And I have not defiled my name[a], nor the name of my father, in the land of my captivity. I am my father’s only child, and he has no child who will inherit him, nor a near brother, nor does he have a son so that I might keep myself for him as a wife. Already seven have perished from me; why should I live? But if it does not seem good to you to put me to death, command that you look upon me and have mercy on me[c][b], and that I no longer hear reproach.
translation:
  language: ru
  text: И я не опозорила ни своего имени, ни имени моего отца в земле моего плена. Я — единственное дитя моего отца, и нет у него дитяти, которое стало бы его наследником, ни близкого брата[a], ни сына, для которого я могла бы сохранить себя в жёны[b]. Я уже потеряла семерых[c]; зачем мне жить? Но если Тебе не угодно предать меня смерти, повели взглянуть на меня и помиловать меня, чтобы мне больше не слышать поношений.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «близкого брата»; выражение может обозначать близкого родственника-мужчину в семейной линии.'
    reason: lexical_alternative
  - marker: b
    text: Греческая фраза о «близком брате», «сыне» и сохранении себя в жёны синтаксически трудна. Перевод следует её формулировке, не уточняя предполагаемые семейно-правовые отношения.
    reason: textual_difficulty
  - marker: c
    text: То есть семерых мужей, как ясно из контекста повествования; здесь по-гречески сказано только «семерых».
    reason: contextual_clarification
lexical_decisions:
- source_word: ἐμόλυνα
  choice: не опозорила
  rationale: Буквально глагол означает «осквернила», однако при дополнении «имя» речь идёт о нравственном бесчестии и ущербе доброму имени. «Не опозорила» естественно передаёт этот смысл по-русски, не сводя его к ритуальной нечистоте.
- source_word: ὄνομα
  choice: имя
  rationale: Сохранён буквальный образ греческого текста; в контексте «имя» включает честь и доброе имя самой Сарры и её семьи.
- source_word: γῇ τῆς αἰχμαλωσίας μου
  choice: в земле моего плена
  rationale: Формально близкая и понятная передача, сохраняющая тему вынужденного пребывания на чужбине.
- source_word: μονογενής
  choice: единственный ребёнок
  rationale: Обозначает единственного потомка. Такой перевод не добавляет отсутствующего в греческом существительного «дочь» и избегает богословски нагруженного «единородная».
- source_word: παιδίον
  choice: ребёнок
  rationale: Здесь слово означает потомка, а не обязательно малолетнего ребёнка; повтор «ребёнок» сохраняет лексику источника.
- source_word: κληρονομήσει αὐτόν
  choice: унаследует его
  rationale: Сохранён необычный прямой объект греческого выражения. Оно относится к вступлению в права наследника и продолжению рода, не ограничиваясь получением имущества.
- source_word: ἀδελφὸς ἐγγύς
  choice: близкий брат
  rationale: Буквальная передача намеренно сохраняет трудность греческого оборота; возможный более широкий смысл близкого родственника пояснён в сноске.
- source_word: συντηρήσω ἐμαυτὴν αὐτῷ γυναῖκα
  choice: я могла бы хранить себя ему в жёны
  rationale: Сохранены значения сбережения или предназначения себя и брачная направленность фразы без окончательного разрешения её трудного синтаксиса.
- source_word: ἀπώλοντό μοι ἑπτά
  choice: семеро погибли у меня
  rationale: Передаёт личную утрату, выраженную дательным μοι, но не добавляет слово «мужья», которого в данном предложении греческого текста нет.
- source_word: δοκεῖ σοι
  choice: Тебе не угодно
  rationale: В молитвенном обращении это естественная русская передача того, что представляется Богу должным или желательным; заглавная буква обозначает обращение к Богу, очевидное из контекста.
- source_word: ἀποκτεῖναί με
  choice: предать меня смерти
  rationale: Точная по смыслу и соответствующая торжественному молитвенному регистру формулировка.
- source_word: ἐπίταξον ἐπιβλέψαι ἐπʼ ἐμέ
  choice: повели взглянуть на меня
  rationale: Сохранена необычная конструкция источника с повелением и инфинитивом; перевод не заменяет её истолковывающим «соблаговоли».
- source_word: ὀνειδισμόν
  choice: поношений
  rationale: Передаёт словесное унижение и укор в возвышенном, но понятном современном русском регистре.
theological_decisions:
- issue: Кого обозначают «семеро»
  choice: В основном тексте оставить «семеро», не добавляя «мужей».
  alternative: «Уже семеро мужей погибли у меня» или «Я уже потеряла семерых мужей».
  rationale: Из повествовательного контекста ясно, что речь о мужьях Сарры, однако в самом греческом стихе существительное отсутствует. Сноска даёт необходимое пояснение, сохраняя лаконичность источника.
- issue: Трудная фраза о родстве и браке
  choice: 'Передать близко к форме источника: «ни близкого брата, ни сына, ради которого я могла бы хранить себя ему в жёны».'
  alternative: «ни близкого родственника… за которого я могла бы выйти замуж» или иная юридически уточняющая формулировка.
  rationale: Греческий синтаксис неясен и, вероятно, связан с семейно-наследственными и брачными обязанностями. Перевод сохраняет неопределённость и не навязывает конкретной правовой реконструкции.
- issue: Значение осквернения имени
  choice: Перевести «не опозорила… имени».
  alternative: Более формальное «не осквернила… имени».
  rationale: В контексте Сарра утверждает нравственную чистоту и отсутствие бесчестья для семьи. «Не опозорила имени» передаёт живой русский смысл идиомы, не отрицая её нравственной силы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Сохранены повторы «имя», «ребёнок» и необычные места исходного синтаксиса там, где их сглаживание устранило бы подлинную неоднозначность. Формы обращения к Богу написаны с прописной буквы.
