lexical_decisions:
- source_word: εἰπὸν
  choice: Скажи
  rationale: Аористный императив от λέγω передаёт прямую просьбу к Богу. «Скажи» сохраняет образ божественного слова и не усиливает его до более определённого «повели».
- source_word: ἀπολῦσαί με
  choice: чтобы меня освободили
  rationale: ἀπολύω означает «освобождать, отпускать». Русская конструкция с «чтобы» естественно передаёт содержание повелительного εἰπὸν с инфинитивом, не уточняя прямо, каким образом Бог исполнит просьбу.
- source_word: ἀπὸ τῆς γῆς
  choice: от земли
  rationale: γῆ допускает значения «земля, суша, страна». Здесь выражение косвенно указывает на уход из земной жизни; буквальное «от земли» сохраняет метафору и её торжественную сдержанность.
- source_word: καὶ μὴ ἀκοῦσαί με μηκέτι
  choice: и чтобы я больше не слышала
  rationale: Второй инфинитив выражает ещё один желаемый результат. «Больше не» точно передаёт μηκέτι; женская форма согласована с Саррой, говорящей в данном контексте.
- source_word: ὀνειδισμόν
  choice: поношений
  rationale: ὀνειδισμός охватывает словесное поругание, укор и связанный с ними позор. «Поношения» сохраняет смысл публичного унижения и соответствует достоинству молитвенной речи.
theological_decisions:
- issue: Косвенная просьба о смерти в молитве Богу
  choice: освободили от земли
  alternative: забрали с земли; освободили от земной жизни
  rationale: Греческий текст не называет смерть прямо, а говорит об освобождении «от земли». Перевод сохраняет этот эвфемизм и напряжённость молитвы, не превращая её в более прямое богословское утверждение.
- issue: Неуказанный исполнитель освобождения
  choice: безличное «чтобы меня освободили»
  alternative: «чтобы Ты освободил меня»; «повели освободить меня»
  rationale: Инфинитив не выражает отдельного подлежащего. Безличная русская конструкция сохраняет эту неопределённость; явное «Ты» сделало бы Бога непосредственно названным исполнителем, а «повели» усилило бы значение εἰπὸν.
translation_notes:
  register: Современная литературная русская речь с молитвенной сдержанностью. «Поношения» несколько возвышенно, но понятно и уместно в контексте плача; синтаксис сохраняет повтор желаемого результата, не делая просьбу о смерти чрезмерно прямой.
