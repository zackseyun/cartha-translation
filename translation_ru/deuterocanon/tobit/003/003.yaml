base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/003.yaml
  text: Remember me and look upon me[a]; do not punish me for my sins and my errors done in ignorance, and for those of my fathers[c][b], which they committed before you.
translation:
  language: ru
  text: Вспомни обо мне и взгляни на меня; не взыщи с меня[a] за мои грехи, за мои прегрешения, совершённые по неведению[b], и за грехи моих отцов[c], которые они совершили пред Тобой.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не карай меня»; греческий глагол может также означать «мстить» или «совершать справедливое воздаяние».'
    reason: lexical_alternative
  - marker: b
    text: То есть за проступки, совершённые по незнанию или без полного осознания.
    reason: lexical_alternative
  - marker: c
    text: То есть моих предков.
    reason: lexical_alternative
  - marker: d
    text: Форма греческого глагола во множественном числе естественнее всего относит эти слова к отцам; возможно и более широкое понимание — как обобщение всех перечисленных грехов.
    reason: ambiguity
lexical_decisions:
- source_word: μνήσθητί μου
  choice: Вспомни обо мне
  rationale: Прямо передаёт молитвенную просьбу о благосклонном внимании Бога, сохраняя привычный библейский образ без архаизации.
- source_word: ἐπίβλεψον ἐπʼ ἐμέ
  choice: взгляни на меня
  rationale: Естественно передаёт усиленную просьбу обратить внимание на молящегося; современно и вместе с тем достаточно возвышенно.
- source_word: μὴ ἐκδίκῃς
  choice: не взыщи с меня
  rationale: Глагол ἐκδικέω может обозначать отмщение, осуществление правосудия или карательное воздаяние. Русское «не взыщи с меня за» естественно в покаянной молитве и сохраняет судебно-карательный оттенок лучше, чем общее «не наказывай».
- source_word: τὰς ἁμαρτίας μου
  choice: мои грехи
  rationale: Стандартная и точная передача ἁμαρτία, сохраняющая нравственный и богословский вес признания.
- source_word: τοῖς ἀγνοήμασίν μου
  choice: мои прегрешения, совершённые по неведению
  rationale: ἀγνόημα обозначает проступок, совершённый по незнанию или без полного осознания. Формулировка не ослабляет его до простой «ошибки» и ясно раскрывает оттенок неведения.
- source_word: τῶν πατέρων μου
  choice: моих отцов
  rationale: Сохраняет буквальный семейно-заветный образ греческого текста; по контексту речь идёт о предках.
- source_word: ἃ ἥμαρτον ἐνώπιόν σου
  choice: которыми они согрешили пред Тобой
  rationale: Множественное число ἥμαρτον передано явным «они», а оборот «пред Тобой» сохраняет личный и судебный оттенок ἐνώπιόν σου. Конструкция с «которыми» позволяет естественно отнести придаточное к грехам отцов.
theological_decisions:
- issue: К чему относится ἃ ἥμαρτον ἐνώπιόν σου
  choice: 'Придаточное отнесено к грехам отцов: «которыми они согрешили пред Тобой».'
  alternative: Его можно понимать шире, как обобщение всех только что перечисленных грехов.
  rationale: Форма глагола во множественном числе и ближайший смысловой антецедент естественнее всего указывают на отцов. Неоднозначность отмечена в сноске, а не устранена молча.
- issue: Характер просьбы μὴ ἐκδίκῃς
  choice: Передано как просьба не взыскивать с молящегося за грехи.
  alternative: «Не мсти за мои грехи» или «не наказывай меня за мои грехи».
  rationale: Текст просит Бога не совершать карательного воздаяния, но сам глагол шире простого наказания и может иметь оттенок отмщения или осуществления справедливости.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. «Пред Тобой» сохраняет умеренно возвышенный библейский регистр, тогда как остальная фраза избегает устаревших форм. Прописная буква в местоимении «Тобой» используется как традиционный русский знак благоговейного обращения к Богу, не меняющий смысла исходного текста.
