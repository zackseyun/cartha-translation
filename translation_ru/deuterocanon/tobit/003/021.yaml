  text: And she was utterly grieved, so that she wept.
translation:
  language: ru
  text: И не бойся, дитя, того, что мы обеднели. У тебя будет большое богатство, если ты будешь бояться Бога, удаляться от всякого греха и делать угодное Ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный греческий текст этого предложения в стандартной нумерации соответствует Товиту 4:21, а не 3:21. Приведённый английский консультационный текст относится к другому месту и не соответствует данному греческому фрагменту.
    reason: Необходимо открыто обозначить существенное расхождение идентификатора и английского слоя с исходным греческим свидетельством.
lexical_decisions:
- source_word: παιδίον
  choice: дитя
  rationale: Сохраняет ласковое обращение родителя к сыну и соответствует нейтральному значению греческого уменьшительного.
- source_word: ἐπτωχεύσαμεν
  choice: мы обеднели
  rationale: Передаёт наступившее состояние нужды, выраженное аористом, естественным современным русским оборотом.
- source_word: ὑπάρχει σοι πολλὰ
  choice: у тебя будет большое богатство
  rationale: Контекстуально передаёт мысль о подлинном достатке, хотя буквально выражение означает «у тебя есть многое»; будущее лучше связывается в русском языке с последующим условием.
- source_word: φοβηθῇς τὸν θεόν
  choice: будешь бояться Бога
  rationale: Сохраняет библейское выражение о благоговейном страхе перед Богом, не сужая его до одного лишь уважения.
- source_word: ἀποστῇς ἀπὸ πάσης ἁμαρτίας
  choice: удаляться от всякого греха
  rationale: Передаёт сознательное отступление и отказ от греха без конфессионально окрашенного истолкования.
- source_word: τὸ ἀρεστὸν ἐνώπιον αὐτοῦ
  choice: угодное Ему
  rationale: Естественно передаёт буквально «то, что приятно/угодно пред Ним», сохраняя нравственную направленность выражения.
theological_decisions:
- issue: Значение выражения «бояться Бога»
  choice: Сохранить прямую формулировку «бояться Бога»
  alternative: «почитать Бога» или «благоговеть перед Богом»
  rationale: Греческий глагол φοβέομαι сохраняет смысл страха наряду с благоговением; замена только на «почитать» преждевременно устранила бы эту смысловую напряжённость.
- issue: Характер обещанного достатка
  choice: Не уточнять, является ли богатство материальным или духовным
  alternative: «у тебя будет много благ»
  rationale: Греческое πολλὰ неоднозначно. Контекст допускает широкое понимание достатка, поэтому перевод не должен навязывать исключительно духовное или исключительно материальное истолкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис разделён на два предложения ради ясности; обращение «дитя» сохраняет достоинство и родительскую теплоту оригинала.
