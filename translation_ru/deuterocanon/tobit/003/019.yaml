base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/019.yaml
  text: And at all times bless the Lord God[a], and ask from him that your ways may be made straight and that all your paths and plans may prosper. For no nation has counsel, but the Lord himself gives all good things, and whomever he wills he humbles, as he wills. And now, child, remember my commandments[b], and do not let them be blotted out from your heart.
translation:
  language: ru
  text: И во всякое время благословляй Господа Бога и проси у Него, чтобы пути твои стали прямыми[a] и чтобы все твои стези и замыслы были успешны. Ведь ни один народ не имеет совета[b], но Сам Господь даёт все блага и, кого пожелает, смиряет, как Ему угодно. А теперь, дитя, помни мои заповеди, и пусть они не изгладятся из твоего сердца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно также: «чтобы пути твои сделались прямыми» или «были выпрямлены». Греческое выражение допускает оттенок как становления, так и достигнутого благодаря внешнему действию результата.'
    reason: lexical_alternative
  - marker: b
    text: Греческая фраза «ни один народ не имеет совета» предельно кратка. Возможно, имеется в виду, что ни один народ сам по себе не обладает надёжным советом, в противопоставление Господу, Который даёт всё благое.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ
  choice: во всякое время
  rationale: Передаёт распределительное значение греческого оборота и сохраняет возвышенный, но понятный библейский стиль.
- source_word: εὐλόγει
  choice: благословляй
  rationale: Прямо передаёт значение глагола и естественно звучит в библейском призыве, обращённом к почитанию Бога.
- source_word: παρʼ αὐτοῦ αἴτησον
  choice: проси у Него
  rationale: Сохраняет выраженное предлогом значение источника и является естественной современной русской конструкцией.
- source_word: ὅπως αἱ ὁδοί σου εὐθεῖαι γένωνται
  choice: чтобы пути твои стали прямыми
  rationale: Сохраняет образ жизненных путей и наиболее прямо передаёт γένωνται как становление, не исключая возможного результативно-пассивного оттенка.
- source_word: τρίβοι καὶ βουλαὶ
  choice: стези и замыслы
  rationale: Различает два греческих существительных, сохраняя образ пути и передавая βουλαί как намерения или планы.
- source_word: εὐοδωθῶσιν
  choice: увенчались успехом
  rationale: Естественно передаёт пожелание благополучного исхода и успешного осуществления.
- source_word: πᾶν ἔθνος οὐκ ἔχει βουλήν
  choice: ни один народ не имеет совета
  rationale: Сохраняет краткость и некоторую резкость греческой фразы, не добавляя в основной текст толкование о надёжности или истинности совета.
- source_word: δίδωσιν πάντα τὰ ἀγαθὰ
  choice: даёт все блага
  rationale: Передаёт всеохватность выражения и ясно сохраняет Бога как Подателя благ.
- source_word: ὃ ἐὰν θέλῃ ταπεινοῖ
  choice: кого пожелает, смиряет
  rationale: Контекст допускает личное понимание формально среднего местоимения; русский вариант сохраняет утверждение о свободном действии Бога над людьми.
- source_word: μὴ ἐξαλειφθήτωσαν ἐκ τῆς καρδίας σου
  choice: пусть они не изгладятся из твоего сердца
  rationale: Сохраняет сильный образ стирания или изглаживания и его связь с внутренней памятью.
theological_decisions:
- issue: Передача κύριος как титула Бога
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — традиционный и общепонятный русский эквивалент κύριος в обращении к Богу; он не вносит дополнительной конфессиональной конкретизации.
- issue: Божественная свобода в выражении ὃ ἐὰν θέλῃ ταπεινοῖ, καθὼς βούλεται
  choice: кого пожелает, смиряет, как Ему угодно
  alternative: кого хочет, того унижает, как пожелает
  rationale: Выбранный текст сохраняет напряжённое утверждение о свободе Божьего действия, но не усиливает его словом «унижает», способным подразумевать нравственно предосудительное обращение.
- issue: Источник совета и благ
  choice: ни один народ не имеет совета, но Сам Господь даёт все блага
  alternative: ни у одного народа нет верного совета, но Сам Господь дарует всё доброе
  rationale: Не добавлено отсутствующее в греческом определение «верного»; тем самым сохранена лаконичность и неоднозначность противопоставления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Слова «стези», «благословляй» и «изгладятся» сохраняют образность и достоинство оригинала, оставаясь понятными широкому читателю. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской религиозно-литературной нормой.
