- from: И во всякое время благословляй Господа Бога и проси у Него, чтобы пути твои стали прямыми[a] и чтобы все твои стези и замыслы увенчались успехом. Ведь ни один народ не имеет совета[b], но Сам Господь даёт все блага и, кого пожелает, смиряет, как Ему угодно. А теперь, дитя, помни мои заповеди, и пусть они не изгладятся из твоего сердца.
  to: И во всякое время благословляй Господа Бога и проси у Него, чтобы пути твои стали прямыми[a] и чтобы все твои стези и замыслы были успешны. Ведь ни один народ не имеет совета[b], но Сам Господь даёт все блага и, кого пожелает, смиряет, как Ему угодно. А теперь, дитя, помни мои заповеди, и пусть они не изгладятся из твоего сердца.
