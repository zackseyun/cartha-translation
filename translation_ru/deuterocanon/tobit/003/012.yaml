  text: And now[a], Lord, I have set my eyes and my face toward you.
translation:
  language: ru
  text: И теперь, Господи, я обратил к Тебе глаза и лицо[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «я отдал Тебе мои глаза и моё лицо». Вероятно, это телесный образ обращения к Богу в молитве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: И теперь
  rationale: Прямое переходное выражение, обозначающее непосредственный поворот молитвы.
- source_word: Κύριε
  choice: Господи
  rationale: Естественная русская форма звательного обращения к Богу, соответствующая греческому вокативу κύριε.
- source_word: τοὺς ὀφθαλμούς μου
  choice: глаза
  rationale: Буквальный перевод сохраняет телесный образ и параллель с лицом.
- source_word: τὸ πρόσωπόν μου
  choice: лицо
  rationale: Буквальное значение уместно в парном выражении «глаза и лицо» и сохраняет образ направленности к Богу.
- source_word: εἰς σὲ
  choice: к Тебе
  rationale: Передаёт направление, выраженное εἰς, и естественно сочетается в русском с глаголом «обратил».
- source_word: δέδωκα
  choice: я обратил
  rationale: Перфект δίδωμι буквально означает «я дал», но сочетание с глазами и лицом идиоматически описывает сознательное обращение их к Богу; совершенный вид сохраняет завершённость действия.
theological_decisions:
- issue: Передача κύριος в прямом обращении к Богу
  choice: Господи
  alternative: О Господи
  rationale: «Господи» — современная и вместе с тем достойная русская форма молитвенного обращения; частица «о» не требуется и отсутствует в греческом тексте.
translation_notes:
  register: Современный литературный русский с молитвенной торжественностью. Сохранён парный телесный образ «глаза и лицо», а буквальная конструкция с δίδωμι вынесена в примечание. Местоимение «Тебе» написано с прописной буквы как принятая форма почтительного обращения к Богу.
