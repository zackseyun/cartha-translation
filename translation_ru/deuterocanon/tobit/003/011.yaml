  yaml_path: translation/deuterocanon/tobit/003/011.yaml
  text: And she prayed by the window and said[a], “Blessed are you, Lord my God, and blessed is your holy and honored name forever; let all your works bless you forever.”
translation:
  language: ru
  text: 'Она помолилась у окна и сказала: «Благословен Ты[a], Господи, Бог мой, и благословенно святое и чтимое имя Твоё вовеки! Да благословляют Тебя все дела Твои вовеки».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В представленном греческом тексте после εἶ («Ты есть») повторено εἶ. Это повторение не воспроизведено в русском переводе, поскольку его функция в данном контексте неясна.
    reason: textual_note
  - marker: b
    text: 'Или: «Да восхваляют Тебя все дела Твои вовеки». В греческом здесь повторена та же группа слов со значением благословения, что и в начале стиха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθη
  choice: помолилась
  rationale: Глагол обозначает усердное обращение с просьбой; в данном молитвенном контексте «помолилась» звучит естественно и не усиливает без необходимости оттенок отчаяния.
- source_word: πρὸς τῇ θυρίδι
  choice: у окна
  rationale: θυρίς — окно или оконный проём; конструкция с πρός и дательным падежом здесь естественно обозначает местонахождение рядом с окном.
- source_word: Εὐλογητὸς
  choice: Благословен
  rationale: Сохраняет обычную библейскую формулу благословения, обращённую к Богу, и связь с последующим εὐλογησάτωσάν.
- source_word: Κύριε ὁ θεός μου
  choice: Господи, Бог мой
  rationale: Естественная русская форма прямого молитвенного обращения к Богу; κύριος передано традиционным и контекстуально точным словом «Господь».
- source_word: τὸ ὄνομά σου τὸ ἅγιον καὶ ἔντιμον
  choice: святое и чтимое имя Твоё
  rationale: ἔντιμος передаёт значение почитаемого, удостоенного чести; «чтимое» кратко, достойно по регистру и не добавляет значения славы или драгоценности.
- source_word: εἰς τοὺς αἰῶνας / εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: В обеих параллельных формулах выражена неограниченная длительность; единообразное «вовеки» сохраняет молитвенный ритм и возвышенный, но понятный регистр.
- source_word: εὐλογησάτωσάν
  choice: да благословляют
  rationale: Форма передаёт побуждение третьего лица. Повтор корня «благослов-» сохраняет намеренную лексическую связь с началом молитвы.
- source_word: πάντα τὰ ἔργα σου
  choice: все дела Твои
  rationale: ἔργα может обозначать как Божьи деяния, так и всё Им сотворённое. «Все дела Твои» сохраняет эту широту и не сводит выражение только к творениям.
theological_decisions:
- issue: Передача κύριος в прямом обращении к Богу
  choice: Господи
  alternative: Владыка
  rationale: Молитва непосредственно обращена к Богу; «Господи» является естественной и устоявшейся русской передачей κύριος без привнесения дополнительного оттенка господства.
- issue: Благословение, направленное от Божьих дел к Богу
  choice: да благословляют Тебя
  alternative: да восхваляют Тебя
  rationale: Греческий текст повторяет ту же группу слов с корнем εὐλογ-, что и в начале стиха. «Благословляют» сохраняет эту связь и богословское напряжение выражения; «восхваляют» яснее раскрывает предполагаемый смысл, но устраняет повтор.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Формы обращения к Богу написаны с прописной буквы по принятой русской библейской традиции. Порядок «имя Твоё» и «дела Твои» поддерживает достоинство и ритм молитвы, оставаясь понятным современному читателю.
