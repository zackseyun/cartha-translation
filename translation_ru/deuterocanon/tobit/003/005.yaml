base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/005.yaml
  text: And now your judgments are many and true in dealing with me concerning my sins and the sins of my fathers[a], because we did not keep your commandments[b]; for we did not walk in truth before you.
translation:
  language: ru
  text: И ныне многочисленны и истинны[a] Твои суды надо мной за мои грехи и грехи моих отцов, потому что мы не соблюдали Твоих заповедей; ибо мы не ходили в истине[b] пред Тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливы». В греческом тексте буквально «истинны»; в данном контексте это также утверждает правоту Божьих судов.'
    reason: lexical_alternative
  - marker: b
    text: «Ходить в истине» — библейский образ, означающий жить перед Богом правдиво и верно.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσεις
  choice: суды
  rationale: В покаянном контексте слово обозначает Божьи судебные решения или действия. «Суды» сохраняет юридический и библейский оттенок греческого существительного.
- source_word: ἀληθιναί
  choice: истинны
  rationale: Это прямое значение греческого прилагательного. В контексте оно подразумевает правоту Божьих судов, но перевод «истинны» не сводит смысл только к понятию справедливости.
- source_word: ἐξ ἐμοῦ ποιῆσαι
  choice: суды надо мной
  rationale: Греческий оборот необычен; русская формулировка передаёт направленность Божьих судебных действий на Товита, не усиливая её до явно враждебного «против меня».
- source_word: περὶ τῶν ἁμαρτιῶν μου καὶ τῶν πατέρων μου
  choice: за мои грехи и грехи моих отцов
  rationale: Предлог περί здесь указывает на основание или предмет Божьих судов. Повтор слова «грехи» раскрывает эллипсис и обеспечивает ясность.
- source_word: ἐντολάς
  choice: заповедей
  rationale: Устоявшийся русский библейский эквивалент, сохраняющий нравственный и заветный вес слова.
- source_word: ἐπορεύθημεν ἐν ἀληθείᾳ
  choice: мы не ходили в истине
  rationale: Сохранена библейская метафора жизненного пути и смысловая связь с ἀληθιναί. Выражение охватывает как верность, так и правдивость жизни.
- source_word: ἐνώπιόν σου
  choice: пред Тобой
  rationale: Краткое и естественное для возвышенной русской речи выражение, передающее жизнь в Божьем присутствии и под Его взором.
theological_decisions:
- issue: Следует ли прямо назвать Божьи суды «справедливыми», а не «истинными»
  choice: истинны
  alternative: справедливы, праведны
  rationale: Греческое ἀληθιναί буквально означает «истинны». Контекст подтверждает правоту Божьих судов, однако перевод сохраняет исходную формулировку и не устраняет её смысловую широту.
- issue: Говорит ли упоминание грехов отцов о наследуемой личной вине
  choice: грехи моих отцов
  alternative: грехи предков; наша унаследованная вина
  rationale: Текст прямо соединяет грехи говорящего с грехами его отцов в общей исповеди, но не формулирует отдельного учения о наследовании личной виновности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены метафора «ходить в истине» и повтор первого лица множественного числа; местоимения, обращённые к Богу, написаны с прописной буквы согласно принятому русскому религиозному регистру.
