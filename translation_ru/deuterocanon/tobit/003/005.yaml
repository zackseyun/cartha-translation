  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: πολλαὶ... ἀληθιναί — «многочисленны и истинны», κρίσεις — «суды», обращённые на говорящего, περί грехов — «за мои грехи и грехи моих отцов», а также исповедальное «мы не соблюдали... не ходили в истине пред Тобой». Формулировка «суды надо мной за...» несколько более гладко связывает греческий трудный оборот ἐξ ἐμοῦ ποιῆσαι с основанием судов, не добавляя идеи враждебности или доктрины наследственной вины.'
