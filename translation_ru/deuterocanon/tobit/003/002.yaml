base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/003/002.yaml
  text: You are righteous[a], Lord, and all your works and all your ways are mercy and truth, and you judge true and righteous judgment forever.
translation:
  language: ru
  text: Ты праведен, Господи, и все Твои дела, и все Твои пути — милость и истина[a], и Ты во веки судишь истинным и праведным судом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милосердие и верность». Греческое слово, переведённое как «милость», может обозначать отдельные проявления милосердия, а «истина» может иметь оттенок верности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Δίκαιος
  choice: праведен
  rationale: Предикативное определение характера Господа; «праведен» сохраняет нравственно-богословский смысл и естественно звучит в молитвенном обращении.
- source_word: Κύριε
  choice: Господи
  rationale: Естественная русская форма прямого обращения к Богу.
- source_word: ἔργα
  choice: дела
  rationale: Широкое и прозрачное обозначение всего, что совершает Бог.
- source_word: ὁδοί
  choice: пути
  rationale: Сохраняет библейский образ Божьего образа действий и управления.
- source_word: ἐλεημοσύναι
  choice: милость
  rationale: Хотя греческая форма стоит во множественном числе и может обозначать проявления милосердия, в характеристике Божьих путей русское собирательное «милость» естественно и не сужает смысл до раздачи милостыни.
- source_word: ἀλήθεια
  choice: истина
  rationale: Прямое соответствие греческому слову; возможный оттенок верности сохранён в сноске.
- source_word: κρίσιν ἀληθινὴν καὶ δικαίαν σὺ κρίνεις
  choice: суд Твой во веки истинен и праведен
  rationale: Естественная русская передача внутреннего сочетания «судить суд», сохраняющая оба определения суда и личное обращение к Богу.
- source_word: εἰς τὸν αἰῶνα
  choice: во веки
  rationale: Устойчивое, понятное и достойное выражение непреходящей длительности в молитвенном регистре.
theological_decisions:
- issue: Передача ἀλήθεια в сочетании с милостью
  choice: истина
  alternative: верность
  rationale: «Истина» непосредственно передаёт греческое слово, тогда как контекст допускает оттенок надёжности и верности; этот оттенок отмечен, но не подменяет основной текст.
- issue: Грамматическое отношение κρίσιν ... κρίνεις
  choice: суд Твой ... истинен и праведен
  alternative: Ты во веки судишь судом истинным и праведным
  rationale: Основной вариант избегает тяжёлой для современного русского внутренней конструкции, не меняя утверждения о Божьем суде; более формальная передача остаётся возможной.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным звучанием. Формы «Господи», «пути Твои», «во веки» сохраняют достоинство и библейскую образность без архаической перегруженности.
