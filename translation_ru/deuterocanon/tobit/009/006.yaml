lexical_decisions:
- source_word: ὤρθρευσαν
  choice: встали рано
  rationale: Глагол указывает на ранний подъём, на рассвете; перевод сохраняет временной оттенок, не добавляя прямо не выраженного значения отправления в путь.
- source_word: κοινῶς
  choice: вместе
  rationale: Наречие обозначает совместное действие и естественно относится к раннему подъёму и последующему приходу.
- source_word: ἦλθοσαν
  choice: пришли
  rationale: Передаёт буквальное направление греческого глагола, не меняя повествовательную точку зрения.
- source_word: γάμον
  choice: свадьбу
  rationale: Слово может обозначать как бракосочетание, так и свадебное празднество; «свадьба» естественно сохраняет эту широту.
- source_word: εὐλόγησεν
  choice: благословил
  rationale: Прямой эквивалент греческого глагола; форма и содержание благословения в тексте не уточняются.
- source_word: Τωβείας
  choice: Товия
  rationale: Традиционная и узнаваемая русская форма имени персонажа книги Товита.
- source_word: γυναῖκα αὐτοῦ
  choice: свою жену
  rationale: В брачном контексте γυνή означает «жена»; возвратное «свою» естественно указывает на принадлежность подлежащему.
theological_decisions:
- issue: Характер действия Товии по отношению к жене в εὐλόγησεν ... τὴν γυναῖκα αὐτοῦ
  choice: Товия благословил свою жену
  alternative: Товия произнёс благословение над своей женой
  rationale: Греческий текст сообщает о благословении, но не определяет его форму, содержание или обрядовый характер; краткая формулировка сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным строем. Союз «а» перед заключительной частью мягко отделяет новое действие, не вводя резкого противопоставления.
