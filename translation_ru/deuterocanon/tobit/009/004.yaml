translation:
  language: ru
  text: А отец мой считает дни, и если я надолго задержусь, он будет сильно тревожиться.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀριθμεῖ
  choice: считает
  rationale: 'Настоящее время передаёт продолжающееся действие: отец следит за каждым проходящим днём. Русское «считает дни» естественно сохраняет этот смысл.'
- source_word: τὰς ἡμέρας
  choice: дни
  rationale: Прямое соответствие греческому дополнению; выражение «считает дни» в современном русском языке передаёт напряжённое ожидание без добавления новых смыслов.
- source_word: χρονίσω
  choice: я задержусь
  rationale: Аорист конъюнктива после ἐὰν выражает возможное будущее условие. Возвратная форма «задержусь» сохраняет первое лицо и не указывает на внешнюю причину задержки.
- source_word: μέγα
  choice: надолго
  rationale: Здесь μέγα употреблено наречно и характеризует продолжительность задержки. «Надолго» звучит естественно и передаёт смысл «на долгое время».
- source_word: ὀδυνηθήσεται
  choice: он будет тревожиться
  rationale: Форма обозначает сильное душевное страдание, скорбь или тревогу. В контексте отца, ожидающего сына, «будет тревожиться» естественно выражает эмоциональную боль, не сужая её до одной лишь печали.
- source_word: λίαν
  choice: сильно
  rationale: Наречие усиливает переживание отца; «сильно» ясно и современно передаёт высокую степень тревоги.
