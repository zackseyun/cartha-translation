translation:
  language: ru
  text: Он благословил их навеки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях на полях добавлено: «чистым и святым благословением».'
    reason: textual_variant
lexical_decisions:
- source_word: ηυλογησεν
  choice: благословил
  rationale: Аорист εὐλογέω в данном повествовательном контексте естественно передаётся совершенным видом «благословил»; перевод «восхвалил» изменил бы смысл и обычно предполагал бы Бога как объект.
- source_word: τους αιωνας
  choice: навеки
  rationale: Формула τοὺς αἰῶνας выражает неограниченную длительность. «Навеки» естественно и достойно звучит в современном русском языке, тогда как буквальное «на века» здесь менее ясно.
- source_word: подразумеваемый объект при ηυλογησεν
  choice: их
  rationale: Русский переходный глагол требует явного объекта; местоимение восстанавливает адресатов благословения из контекста, не добавляя признака всеобщности, поскольку πάντες отмечено лишь как вариант.
theological_decisions:
- issue: Краткая или расширенная форма благословения
  choice: 'В основном тексте сохранена краткая форма: «Он благословил их навеки».'
  alternative: «Он благословил их чистым и святым благословением навеки».
  rationale: Слова καθαρα και αγια засвидетельствованы как добавление на полях и потому не включены без оговорки в основной текст, а сохранены в сноске.
- issue: Вариант с πάντες
  choice: Не добавлять «всех».
  alternative: «Он благословил их всех навеки».
  rationale: πάντες указано в аппарате как вариант, а не как часть основного чтения; добавление «всех» необоснованно расширило бы основной текст.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и торжественная формулировка. «Навеки» сохраняет библейскую возвышенность без архаической тяжеловесности.
