  text: So Raphael went and lodged with Gabael[a], and he gave him the written note[b]; then Gabael brought out the money bags with the seals and gave them to him.
translation:
  language: ru
  text: И отправился Рафаил и остановился на ночлег у Гаваила. Он отдал ему письменное обязательство[a]; тогда Гаваил вынес запечатанные мешочки[b] и отдал их ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долговую расписку» или «письменный документ». Греческое χειρόγραφον обозначает письменный документ, в данном контексте связанный с финансовым обязательством.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мешочки в печатях», то есть мешочки с неповреждёнными печатями.'
