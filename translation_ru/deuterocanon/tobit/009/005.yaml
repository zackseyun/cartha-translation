lexical_decisions:
- source_word: ἐπορεύθη
  choice: отправился
  rationale: Простой повествовательный аорист движения; «отправился» естественно передаёт начало пути и сохраняет несколько более высокий библейский регистр.
- source_word: ηὐλίσθη παρὰ Γαβαήλ
  choice: остановился на ночлег у Гаваила
  rationale: αὐλίζομαι означает останавливаться или располагаться на ночлег, а παρά с лицом — пребывание у этого человека.
- source_word: τὸ χειρόγραφον
  choice: долговую расписку
  rationale: χειρόγραφον обозначает собственноручно составленный документ, нередко признание долга или финансового обязательства; в контексте возвращения вклада «долговая расписка» ясна и конкретна.
- source_word: προήνεγκεν
  choice: вынес
  rationale: Глагол означает вынести или представить находившийся на хранении предмет; «вынес» естественно описывает конкретное действие.
- source_word: τὰ θυλάκια ἐν ταῖς σφραγῖσιν
  choice: запечатанные мешочки
  rationale: θυλάκια — небольшие мешки или сумки; оборот ἐν ταῖς σφραγῖσιν указывает, что на них сохранялись печати. Сжатое русское выражение передаёт смысл без неестественного буквализма.
- source_word: ἔδωκεν αὐτῷ
  choice: отдал их ему
  rationale: Местоименное дополнение восстановлено во множественном числе по ближайшему предмету — мешочкам; «отдал» уместно для передачи хранившегося имущества.
