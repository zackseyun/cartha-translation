base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/009/002.yaml
  text: Take with yourself a servant and two camels, and go to Rages of Media, to Gabael, and bring me the money, and bring him with you to the wedding.
translation:
  language: ru
  text: Возьми с собой слугу и двух верблюдов и отправляйся в Раги Мидийские к Гаваилу. Привези мне серебро[a] и приведи его ко мне на свадьбу[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «серебро»; здесь имеются в виду деньги, доверенные Гаваилу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на свадебный пир». Греческое слово может обозначать как свадьбу, так и праздничное пиршество.'
    reason: lexical_alternative
  - marker: c
    text: Параллельная семитская традиция расширяет рассказ дополнительными сопровождающими и подробностями о доме Гаваила, тогда как используемый здесь греческий текст короче.
    reason: alternative_reading
lexical_decisions:
- source_word: λάβε μετὰ σεαυτοῦ
  choice: возьми с собой
  rationale: Естественная русская передача греческого оборота со значением сопровождения.
- source_word: παῖδα
  choice: слугу
  rationale: В контексте поездки слово обозначает слугу или сопровождающего; перевод «слуга» не уточняет без достаточных оснований ни возраст, ни юридическое положение.
- source_word: δύο καμήλους
  choice: двух верблюдов
  rationale: Прямая передача числительного и существительного.
- source_word: πορεύθητι
  choice: отправляйся
  rationale: Повелительная форма движения; «отправляйся» естественно подходит к дальней поездке.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: в Раги Мидийские
  rationale: При глаголе движения оборот указывает на место назначения; традиционная русская форма названия соединена с указанием области.
- source_word: παρὰ Γαβαήλ
  choice: к Гаваилу
  rationale: παρά при имени лица здесь указывает на направление к человеку, возможно к месту его пребывания, без добавления отсутствующего в греческом слова «дом».
- source_word: κόμισαί μοι τὸ ἀργύριον
  choice: привези мне серебро
  rationale: ἀργύριον буквально означает серебро и в данном контексте обозначает денежные средства. Основной текст сохраняет конкретный образ, а примечание поясняет смысл.
- source_word: καὶ αὐτὸν ἄγε μοι
  choice: и приведи его ко мне
  rationale: Местоимение относится к Гаваилу; ἄγε передано как личное сопровождение, а μοι сохранено выражением «ко мне».
- source_word: εἰς τὸν γάμον
  choice: на свадьбу
  rationale: γάμος может обозначать как свадьбу, так и свадебный пир; краткий основной перевод сохраняет широкое значение.
