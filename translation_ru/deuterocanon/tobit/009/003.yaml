lexical_decisions:
- source_word: διότι
  choice: ведь
  rationale: Союз вводит основание для предшествующей просьбы; «ведь» естественно передаёт причинно-пояснительную связь в русском повествовании.
- source_word: ὠμόμοκεν
  choice: поклялся
  rationale: Перфект ὄμνυμι обозначает уже данную и по-прежнему действующую клятву. Русское совершенное прошедшее «поклялся» естественно выражает это в данном контексте.
- source_word: ὁ Ῥαγουὴλ
  choice: Рагуил
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: μὴ ἐξελθεῖν με
  choice: не отпускать меня
  rationale: Буквально оборот говорит о том, что говорящий «не выйдет», однако в контексте речь идёт об отъезде из дома Рагуила, зависящем от его согласия. Формулировка передаёт контекстуальный смысл без тяжеловесной русской конструкции.
