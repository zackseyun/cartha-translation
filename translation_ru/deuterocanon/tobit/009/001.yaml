  text: And Tobiah called Raphael and said to him[a], “Azariah[b], brother,”
translation:
  language: ru
  text: 'И Товия позвал Рафаила и сказал ему: «Азария[a], брат!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Товия обращается к Рафаилу именем «Азария», под которым тот сопровождал его в пути.
    reason: cross_reference
  - marker: b
    text: В более пространной традиции, согласующейся с семитским текстом, далее сразу следуют поручения Товии Азарии (Рафаилу); использованный здесь греческий текст сохраняет в этом стихе лишь начало обращения.
    reason: textual_variant
lexical_decisions:
- source_word: ἐκάλεσεν
  choice: позвал
  rationale: В данном контексте аорист καλέω вводит обращение и прямую речь. «Позвал» естественно передаёт смысл, не усиливая его до «призвал» или «велел явиться».
- source_word: Τωβίας
  choice: Товия
  rationale: Форма «Товия» соответствует принятой русской передаче семитского личного имени и отличает сына от традиционной латинизированной формы «Товит».
- source_word: Ῥαφαήλ
  choice: Рафаил
  rationale: Традиционная и узнаваемая русская передача имени.
- source_word: Ἀζαρία
  choice: Азария
  rationale: Хотя повествователь называет спутника Рафаилом, Товия обращается к нему по имени, под которым тот сопровождал его; это прямо сохранено в греческом тексте.
- source_word: ἀδελφέ
  choice: брат
  rationale: Буквально передаёт звательную форму. Здесь это дружеское обращение, а не утверждение о кровном родстве; перевод «друг» неоправданно устранил бы образ исходного текста.
