translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Сохранены порядок обращения и незавершённость краткого греческого чтения; восклицательный знак делает самостоятельное обращение естественным по-русски, не дополняя отсутствующих в греческом поручений.
