  yaml_path: translation/deuterocanon/tobit/004/016.yaml
  text: Give from your bread to the hungry[a], and from your clothing to the naked. Whatever may abound to you, do as almsgiving[b], and do not let your eye be envious when you do almsgiving.
translation:
  language: ru
  text: От своего хлеба давай голодному, и из своей одежды — нагим[a]. Всё, что будет у тебя в избытке, отдавай в качестве милостыни, и пусть глаз твой не жалеет[b], когда ты подаёшь милостыню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тем, у кого нет одежды»; слово может обозначать также людей, одетых недостаточно.'
    reason: lexical_alternative
  - marker: b
    text: То есть не скупись и не отдавай с неохотой. Буквально речь идёт о глазе, который не должен завидовать или жалеть.
    reason: idiom_explanation
lexical_decisions:
- source_word: ἐκ τοῦ ἄρτου σου δίδου πεινῶντι
  choice: От своего хлеба давай голодному
  rationale: Сохраняется конкретный образ хлеба и значение ἐκ — уделять из того, что принадлежит человеку. Субстантивированное причастие πεινῶντι передано обобщённым единственным числом «голодному».
- source_word: ἐκ τῶν ἱματίων σου τοῖς γυμνοῖς
  choice: из своей одежды — нагим
  rationale: ἱμάτια обозначает одежду или предметы одежды; собирательное «одежда» естественно в современном русском. γυμνοῖς прямо передано словом «нагим», а возможный смысл недостаточно одетых отмечен в сноске.
- source_word: πᾶν ὃ ἐὰν περισσεύσῃ σοι
  choice: Всё, что будет у тебя в избытке
  rationale: περισσεύω выражает избыток или наличие сверх необходимого. Формулировка сохраняет неопределённо-будущее значение конструкции ὃ ἐὰν с сослагательным наклонением.
- source_word: ποίει ἐλεημοσύνην
  choice: отдавай как милостыню
  rationale: В данном контексте ἐλεημοσύνη означает конкретную помощь нуждающимся, прежде всего подаяние. Русская конструкция естественно связывает повеление с предшествующим «всё».
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: пусть глаз твой не жалеет
  rationale: Сохранён выразительный образ «глаза», тогда как «не жалеет» передаёт контекстуальное значение φθονέω — не отдавать с неохотой, не скупиться.
- source_word: ἐν τῷ ποιεῖν σε ἐλεημοσύνην
  choice: когда ты подаёшь милостыню
  rationale: Конструкция ἐν с артиклевым инфинитивом имеет временное значение «когда». «Подавать милостыню» — естественное и точное русское обозначение самого действия.
theological_decisions:
- issue: Значение ἐλεημοσύνη
  choice: милостыня
  alternative: дело милосердия; благотворительность
  rationale: В наставлении речь идёт о конкретной материальной помощи бедным, а не только о милосердном расположении или благотворительности в широком современном смысле.
- issue: Образ глаза в μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: 'сохранить образ: «пусть глаз твой не жалеет»'
  alternative: не скупись; не жалей отдавать
  rationale: Сохранение образа передаёт риторическую фактуру исходного текста и не сводит выражение к одному абстрактному нравственному термину; смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством мудрого отцовского наставления. Синтаксис достаточно близок к греческому, но повеления сформулированы естественно; образ «глаза» намеренно сохранён как значимая особенность оригинала.
