base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/005.yaml
  text: All the days[a], child, remember the Lord our God. Do not desire to transgress his commandments. Practice righteousness all the days of your life, and do not walk in the ways of unrighteousness.
translation:
  language: ru
  text: Каждый день, дитя, помни Господа, Бога нашего. Не желай преступать Его заповеди. Твори праведность во все дни своей жизни и не ходи путями неправды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поступай справедливо… и не ходи путями несправедливости». Греческие слова могут обозначать как личную нравственность, так и справедливость в отношении к другим.'
