lexical_decisions:
- source_word: μνημόνευε
  choice: помни
  rationale: Настоящее повелительное наклонение выражает постоянное памятование; «помни» естественно по-русски и сохраняет заветно-нравственную силу обращения.
- source_word: παιδίον
  choice: дитя
  rationale: Ласковое обращение «дитя» передаёт значение греческого слова, не добавляя отсутствующего в тексте местоимения «моё» и не уточняя пол словом «сын».
- source_word: Κυρίου τοῦ θεοῦ ἡμῶν
  choice: Господа, Бога нашего
  rationale: Передаёт определительную конструкцию естественно для русского библейского регистра и сохраняет оба обозначения.
- source_word: μὴ θελήσῃς παραβῆναι
  choice: Не желай преступать
  rationale: Перевод сохраняет и волевой компонент θελήσῃς, и действие παραβῆναι, не сводя выражение к простому запрету нарушения.
- source_word: ἐντολάς
  choice: заповеди
  rationale: «Заповеди» соответствует религиозно-нравственному контексту и остаётся понятным современному читателю.
- source_word: δικαιοσύνην ποίει
  choice: Твори праведность
  rationale: Формулировка близко передаёт греческий оборот «делай праведность», сохраняя деятельный и длительный характер наставления.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς σου
  choice: во все дни своей жизни
  rationale: Сохраняет повтор слова «дни» и риторический акцент оригинала.
- source_word: μὴ πορευθῇς
  choice: не ходи
  rationale: Сохраняет библейскую метафору образа жизни и естественно сочетается со словом «путями».
- source_word: ταῖς ὁδοῖς τῆς ἀδικίας
  choice: путями неправды
  rationale: Сохраняет метафору множественных путей и смысловой контраст между δικαιοσύνη и ἀδικία; «неправда» охватывает нравственное зло и несправедливость.
theological_decisions:
- issue: Передача этической пары δικαιοσύνη / ἀδικία
  choice: праведность / неправда
  alternative: справедливость / несправедливость
  rationale: Основной вариант сохраняет широкий религиозно-нравственный смысл противопоставления, а примечание удерживает возможную общественно-этическую силу греческих слов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и повтор «во все дни» сохранены; архаичные формы устранены, кроме укоренённых и понятных слов «Господь», «заповеди», «праведность».
