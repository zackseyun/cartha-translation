base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/002.yaml
  text: And he said within himself[a], “I have asked for death; why should I not call Tobiah my son, so that I may instruct him before I die?”
translation:
  language: ru
  text: 'И сказал он про себя[a]: «Я просил о смерти; почему бы мне не позвать моего сына Товию, чтобы наставить его прежде, чем я умру?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В параллельной семитской традиции эта мысль изложена подробнее: Товит зовёт Товию, чтобы перед смертью сообщить ему о деньгах, оставленных на хранение у Гаваила.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: сказал он про себя
  rationale: Передаёт внутреннюю речь буквально и вместе с тем естественно для современного русского языка; вариант «подумал» был бы более свободным.
- source_word: ᾐτησάμην θάνατον
  choice: я просил о смерти
  rationale: Глагол означает «просить», а аорист указывает на уже совершённую просьбу Товита. Уточнение «молился о смерти» контекстуально возможно, но добавляет отсутствующее в самом глаголе толкование.
- source_word: τί οὐ καλῶ
  choice: почему бы мне не позвать
  rationale: Конструкция выражает внутреннее решение и побуждение к действию, а не простой вопрос о причине.
- source_word: Τωβείαν τὸν υἱόν μου
  choice: моего сына Товию
  rationale: Форма «Товия» соответствует укоренившейся русской передаче имени и сохраняет ясное приложение «сына».
- source_word: ὑποδείξω
  choice: наставить
  rationale: Глагол допускает значения «показать», «сообщить», «указать» и «наставить». В контексте предсмертного обращения отца к сыну «наставить» естественно передаёт направляющий характер речи, не добавляя её конкретного содержания.
- source_word: πρὶν ἀποθανεῖν με
  choice: прежде, чем я умру
  rationale: Прямая и ясная передача временного оборота без смягчающего эвфемизма.
theological_decisions:
- issue: Учитывать ли расширенное содержание параллельной семитской традиции при передаче ὑποδείξω
  choice: В основном тексте оставить общее «наставить его», а упоминание денег вынести в примечание.
  alternative: 'Конкретизировать в основном тексте: «чтобы сообщить ему о деньгах».'
  rationale: Основной греческий свидетель не называет предмет наставления. Параллельная традиция помогает понять коммуникативный оттенок глагола, но её дополнительное содержание не следует вносить в греческий текст.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Синтаксис внутренней речи сохранён, но сформулирован естественно; подлинная неопределённость глагола ὑποδείξω не устранена чрезмерной конкретизацией.
