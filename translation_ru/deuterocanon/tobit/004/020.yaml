lexical_decisions:
- source_word: ἐπιδεικνύω
  choice: сообщаю тебе о
  rationale: В данном контексте глагол означает, что Товит указывает сыну на существование отданных на хранение денег, а не обязательно показывает их воочию. Настоящее время и обращение к собеседнику сохранены; иной возможный оттенок отмечен в сноске.
- source_word: τὰ δέκα τάλαντα τοῦ ἀργυρίου
  choice: десять талантов серебра
  rationale: Сохранены указанное количество, древняя мера веса и денежной стоимости «талант», а также материал — серебро; пересчёт в современные единицы не производится.
- source_word: παρεθέμην
  choice: отдал на хранение
  rationale: Средняя форма в контексте передачи денег другому лицу обозначает помещение на хранение. Русское выражение ясно передаёт смысл, не добавляя представления о современном банковском вкладе.
- source_word: Γαβαήλῳ
  choice: Гаваилу
  rationale: Имя передано в форме, естественной для русской библейской ономастической традиции и соответствующей греческому Γαβαήλ.
- source_word: τῷ τοῦ Γαβρεία
  choice: сыну Гаврии
  rationale: Греческая конструкция с артиклем и родительным падежом обозначает отца названного лица; слово «сын» восполнено для ясности по-русски.
- source_word: ἐν Ῥάγοις τῆς Μηδείας
  choice: в Рагах Мидии
  rationale: Географические названия переданы русскими формами; родительный «Мидии» сохраняет структуру греческого географического обозначения.
