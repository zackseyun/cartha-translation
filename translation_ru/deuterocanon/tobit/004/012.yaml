base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/012.yaml
  text: Guard yourself[a], child, from all sexual immorality, and first take a wife from the offspring of your fathers. Do not take a foreign woman who is not from the tribe of your father, because we are sons of the prophets. Remember, child, Noah, Abraham, Isaac, and Jacob, our fathers from of old, that they all took wives from among their brothers, and they were blessed in their children[b], and their offspring will inherit the land.
translation:
  language: ru
  text: 'Берегись, дитя, всякого блуда. Прежде всего возьми себе жену из рода своих отцов. Не бери жены из чужого рода, не принадлежащей к колену твоего отца, потому что мы — сыны пророков[a]. Помни, дитя, о Ное, Аврааме, Исааке и Иакове, наших отцах издревле: все они брали жен из числа своих братьев[b], и были благословлены в своих детях, а их потомство унаследует землю.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы — потомки пророков». Буквально по-гречески: «сыны пророков».'
    reason: alternative_reading
  - marker: b
    text: Здесь «братья» означает близких родственников или людей своего рода, а не буквальных братьев.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσεχε σεαυτῷ
  choice: Берегись
  rationale: Возвратный императив естественно передаёт призыв внимательно хранить себя и быть настороже.
- source_word: παιδίον
  choice: дитя
  rationale: Сохраняет ласковое семейное обращение и возвышенный, но понятный библейский регистр, не добавляя отсутствующего в греческом местоимения «моё».
- source_word: πάσης πορνείας
  choice: всякого блуда
  rationale: «Блуд» в русском библейском употреблении охватывает половую распущенность и сохраняет нравственную весомость выражения; «всякого» передаёт πάσης.
- source_word: γυναῖκα πρῶτον λάβε
  choice: Прежде всего возьми себе жену
  rationale: Передаёт брачное значение оборота и заметное положение πρῶτον как указание на приоритет.
- source_word: ἀπὸ τοῦ σπέρματος τῶν πατέρων σου
  choice: из рода своих отцов
  rationale: В данном контексте σπέρμα обозначает происхождение и родовую линию; буквальное «из семени» в современном русском звучало бы неестественно.
- source_word: γυναῖκα ἀλλοτρίαν
  choice: жены из чужого рода
  rationale: Контекст определяет чуждость как принадлежность к иной родовой группе, а не обязательно к другому народу или государству.
- source_word: φυλῆς τοῦ πατρός σου
  choice: колену твоего отца
  rationale: «Колено» точно передаёт племенную принадлежность φυλή и соответствует историко-библейскому контексту.
- source_word: υἱοὶ προφητῶν ἐσμεν
  choice: мы — сыны пророков
  rationale: Сохранена необычная буквальная формулировка источника; возможный смысл родового происхождения разъяснён в сноске.
- source_word: ἀπὸ τοῦ αἰῶνος
  choice: издревле
  rationale: Кратко и естественно выражает древность предков без навязывания значения «от начала мира».
- source_word: ἐκ τῶν ἀδελφῶν αὐτῶν
  choice: из числа своих братьев
  rationale: Сохранено буквальное родственное обозначение греческого текста, а его более широкий клановый смысл пояснён в сноске.
- source_word: εὐλογήθησαν ἐν τοῖς τέκνοις αὐτῶν
  choice: были благословлены в своих детях
  rationale: 'Формулировка сохраняет многозначность ἐν: благословение могло проявиться в детях, осуществиться через них или относиться к ним.'
- source_word: κληρονομήσει γῆν
  choice: унаследует землю
  rationale: Сохраняет и наследственную лексику, и допускаемую контекстом отсылку к обещанной земле, не делая её явной сверх текста.
theological_decisions:
- issue: Смысл выражения «мы — сыны пророков» рядом с перечнем патриархов
  choice: Сохранить в основном тексте буквальное «сыны пророков»
  alternative: «мы — потомки пророков»
  rationale: Греческая формулировка необычна, особенно перед именами Ноя, Авраама, Исаака и Иакова. Перевод не устраняет это напряжение, а возможный генеалогический смысл сообщает в сноске.
- issue: Родственная лексика в предписании о браке
  choice: Сохранить «из числа своих братьев» с пояснительной сноской
  alternative: «из числа своих родственников» или «из своего рода»
  rationale: ἀδελφοί буквально означает «братья», но здесь обозначает близкую родню или родовую общность, а не буквальных братьев как брачных партнёров. Сноска сохраняет и форму источника, и контекстуальный смысл.
- issue: Характер благословения «в детях»
  choice: Не уточнять способ связи благословения с детьми
  alternative: «были благословлены детьми» или «через своих детей»
  rationale: Предлог ἐν допускает несколько смысловых оттенков; буквально близкое выражение сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «дитя», «сыны», «колено» и «издревле» уместны для древнего наставления, но остаются понятными. Синтаксис разбит на короткие фразы для ясности; необычные формулировки источника сохранены там, где они несут смысловое или богословское напряжение.
