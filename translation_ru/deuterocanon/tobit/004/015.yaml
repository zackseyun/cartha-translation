  text: And what you hate[a], do to no one. Do not drink wine to drunkenness, and do not let drunkenness go with you on your way.
translation:
  language: ru
  text: Не делай никому того, что ненавидишь. Не пей вина до опьянения, и пусть опьянение не сопровождает тебя на твоём пути.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ μισεῖς
  choice: чего ненавидишь
  rationale: Относительное выражение имеет широкий, пословичный смысл и сохраняет прямое обращение во втором лице единственного числа. Родительный падеж естественен при русском «ненавидеть» в отрицательной конструкции с соотносительным «того».
- source_word: μηδενὶ
  choice: никому
  rationale: Дательный падеж обозначает того, по отношению к кому не следует совершать действие; «никому» ясно передаёт всеобщий отрицательный смысл.
- source_word: ποίησης
  choice: не делай
  rationale: Обычное этическое значение ποιέω естественно передаётся глаголом «делать»; отрицательная форма выражает прямой запрет.
- source_word: οἶνον εἰς μέθην μὴ πίῃς
  choice: не пей вина до опьянения
  rationale: «До опьянения» передаёт результат или предел, выраженный εἰς μέθην, не смягчая конкретного предостережения против состояния опьянения.
- source_word: μὴ πορευθήτω μετὰ σοῦ μέθη
  choice: пусть опьянение не сопровождает тебя
  rationale: Сохраняется олицетворение опьянения как спутника человека; русская конструкция с «пусть… не» естественно передаёт повелительное наклонение третьего лица.
- source_word: ἐν τῇ ὁδῷ σου
  choice: на твоём пути
  rationale: Выражение сохраняет образ пути, допускающий как буквальное, так и более широкое понимание жизненного пути.
theological_decisions:
- issue: Формулировка отрицательного правила взаимности
  choice: И чего ненавидишь, того не делай никому.
  alternative: И что ненавистно тебе, того не делай никому.
  rationale: Основной вариант близко следует глагольной форме μισεῖς и сохраняет личный характер обращения. Альтернатива отражает возможное понимание оборота как «того, что тебе ненавистно», не изменяя этического содержания.
translation_notes:
  register: Современный литературный русский язык с краткой пословичной формой первой фразы. Во второй части сохранены олицетворение опьянения и образ пути; тон наставительный, достойный и понятный широкому читателю.
