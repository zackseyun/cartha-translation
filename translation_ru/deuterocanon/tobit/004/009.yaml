  language: ru
  text: Ведь так ты собираешь себе доброе сокровище на день нужды[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на день бедствия», «на время тяготы». Греческое выражение может означать как острую нужду, так и тяжёлые обстоятельства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θέμα
  choice: сокровище
  rationale: Существительное обозначает то, что отложено или припасено. В сочетании с θησαυρίζεις слово «сокровище» естественно передаёт образ накопленного блага, не сводя его к денежному вкладу.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим наставлением и звучит естественно в современном русском тексте.
- source_word: ἀγαθὸν
  choice: доброе
  rationale: Сохраняет прямую нравственную оценку сокровища, не сужая значение до материальной ценности или практической пользы.
- source_word: θησαυρίζεις
  choice: собираешь
  rationale: Передаёт продолжающееся накопление сокровища и сохраняет метафору в ясной современной форме.
- source_word: σεαυτῷ
  choice: себе
  rationale: 'Прямо и естественно передаёт дательный падеж выгоды: сокровище собирается для самого действующего лица.'
- source_word: εἰς ἡμέραν ἀνάγκης
  choice: на день нужды
  rationale: Формулировка близка к греческому тексту и сохраняет широту ἀνάγκη, которое может обозначать как острую нужду, так и тяжёлые обстоятельства.
theological_decisions:
- issue: Образ накопления сокровища посредством милостыни
  choice: Сохранить метафору накопления доброго сокровища, не объясняя её механизм.
  alternative: Истолковать выражение как заслуживание небесной награды либо как практический запас на будущее бедствие.
  rationale: Греческий текст утверждает, что человек собирает себе доброе сокровище на день нужды, но не уточняет, каким образом оно принесёт пользу. Перевод сохраняет эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным библейским звучанием. Частица «ведь» сохраняет связь с предшествующим наставлением; метафора сокровища оставлена без конфессионального истолкования.
