  yaml_path: translation/deuterocanon/tobit/004/008.yaml
  text: As much as you have[a], according to your abundance, give alms from it; and if you have little, do not be afraid to give alms according to that little.
translation:
  language: ru
  text: Смотря по тому, чем ты располагаешь[a], по мере своего достатка подавай милостыню из своего имущества; а если у тебя мало, не бойся подавать милостыню по мере своих скромных средств.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В соответствии с тем, чем ты располагаешь».'
    reason: Лексико-синтаксический вариант оборота ὡς σοι ὑπάρχει; он указывает на меру, определяемую имеющимися средствами.
lexical_decisions:
- source_word: ὡς σοι ὑπάρχει
  choice: Сообразно с тем, что у тебя есть
  rationale: Оборот задаёт меру пожертвования в соответствии с имеющимися у человека средствами. Такой перевод сохраняет соразмерность и не добавляет отсутствующего в греческом тексте условия.
- source_word: κατὰ τὸ πλῆθος
  choice: по мере достатка
  rationale: κατά с винительным падежом выражает соразмерность, а πλῆθος здесь обозначает большое количество, то есть достаток или изобилие средств.
- source_word: ποίησον ἐξ αὐτῶν ἐλεημοσύνην
  choice: подавай из своего имущества милостыню
  rationale: ἐλεημοσύνη в контексте книги Товита означает конкретную помощь нуждающимся — милостыню. Местоимение αὐτῶν отсылает к имеющимся средствам; явное «из своего имущества» естественно передаёт эту связь по-русски.
- source_word: ἐὰν ὀλίγον σοι ὑπάρχῃ
  choice: если у тебя мало
  rationale: Краткая формулировка точно сохраняет условие и противопоставление достатку.
- source_word: κατὰ τὸ ὀλίγον
  choice: по мере этого малого
  rationale: Повтор κατά вновь выражает соразмерность. Указательное «этого» связывает выражение с непосредственно предшествующим «мало» и сохраняет риторический параллелизм оригинала.
- source_word: μὴ φοβοῦ ποιεῖν ἐλεημοσύνην
  choice: не бойся подавать милостыню
  rationale: Перевод сохраняет прямое значение φοβοῦ — «бойся» — и естественно передаёт призыв не отступать от милосердного поступка из-за скудости средств.
theological_decisions:
- issue: Значение ἐλεημοσύνη
  choice: милостыня / подавать милостыню
  alternative: благотворительность; дела милосердия
  rationale: В книге Товита это ключевое этическое понятие обозначает прежде всего материальную помощь нуждающимся. «Милостыня» сохраняет конкретность практики и последовательность терминологии, не расширяя смысл до всякого дела милосердия.
translation_notes:
  register: Современный литературный русский язык с достойным наставительным тоном. Сохранены повтор «милостыня» и пропорциональная структура обеих частей стиха; синтаксис слегка упорядочен для ясности без устранения смысловой напряжённости оригинала.
