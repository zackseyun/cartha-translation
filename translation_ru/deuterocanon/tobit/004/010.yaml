  yaml_path: translation/deuterocanon/tobit/004/010.yaml
  text: For almsgiving rescues from death and will not allow one to enter into the darkness[a][b].
translation:
  language: ru
  text: Потому что милостыня избавляет от смерти и не даст войти во тьму[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благотворительность» или «дела милосердия»; греческое слово здесь прежде всего означает помощь нуждающимся.'
    reason: lexical_alternative
  - marker: b
    text: Образ «тьмы», вероятно, указывает на царство смерти или глубокий мрак; греческий текст оставляет его кратким и не до конца определённым.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: милостыня
  rationale: В эллинистическом иудейском употреблении слово обозначает прежде всего материальную помощь нуждающимся. «Милостыня» передаёт этот конкретный смысл, а не только общее чувство сострадания.
- source_word: ἐκ θανάτου
  choice: от смерти
  rationale: Предлог ἐκ указывает на избавление от власти или угрозы смерти; по-русски естественно сказать «избавляет от смерти».
- source_word: ῥύεται
  choice: избавляет
  rationale: Глагол означает вызволять или избавлять от опасности. Этот выбор точно передаёт смысл и не вносит дополнительных систематико-богословских оттенков.
- source_word: οὐκ ἐάσει
  choice: не даст
  rationale: Будущая форма ἐάσει выражает недопущение. Оборот «не даст войти» естественен в современном русском языке и сохраняет будущее время греческого текста.
- source_word: εἰσελθεῖν
  choice: войти
  rationale: Прямое и естественное соответствие инфинитиву εἰσελθεῖν.
- source_word: εἰς τὸ σκότος
  choice: во тьму
  rationale: Русский язык не имеет артикля, поэтому определённость греческого выражения нельзя передать буквально без неестественного усиления. «Во тьму» сохраняет краткий и открытый образ.
theological_decisions:
- issue: Следует ли передавать стих так, будто милостыня заслуживает спасение
  choice: Сохранено прямое утверждение текста, что милостыня избавляет от смерти, без ослабления и без превращения его в развёрнутое догматическое положение.
  alternative: Ограничить «смерть» лишь временной опасностью или смягчить утверждение словами «может избавить».
  rationale: Греческий текст формулирует мысль прямо и без оговорок. Перевод не должен ни ослаблять её, ни заранее согласовывать с позднейшими богословскими системами.
- issue: Кто именно не войдёт во тьму
  choice: Сохранена невыраженность дополнения в обороте «не даст войти».
  alternative: Добавить «тебе», «человеку» или «подающему милостыню».
  rationale: В греческом тексте при ἐάσει и εἰσελθεῖν лицо, которому не будет дано войти, прямо не названо. Русская безличная конструкция сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. «Не даст войти» звучит естественнее буквального «не позволит войти» и одновременно сохраняет будущее время и отсутствие прямо названного лица.
