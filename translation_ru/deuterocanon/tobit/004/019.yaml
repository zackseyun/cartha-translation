base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/019.yaml
  text: And at all times bless the Lord God[a], and ask from him that your ways may be made straight and that all your paths and plans may prosper. For no nation has counsel, but the Lord himself gives all good things, and whomever he wills he humbles, just as he pleases. And now, child, remember my commandments[b], and do not let them be blotted out from your heart.
translation:
  language: ru
  text: Во всякое время благословляй Господа Бога и проси у Него, чтобы пути твои стали прямыми и чтобы все твои стези и замыслы увенчались успехом.[a] Ведь ни у одного народа нет совета,[b] но Сам Господь даёт всё благое и смиряет кого пожелает, как Ему угодно. А теперь, дитя, помни мои заповеди, и пусть они не изгладятся из твоего сердца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы все твои стези и советы имели успех». Греч. βουλαί может означать «замыслы», «намерения» или «советы».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «ни у одного народа нет совета» в греческом тексте звучит резко и может означать, что ни один народ сам по себе не обладает окончательным, определяющим советом — в отличие от Господа, Который дарует благое и смиряет кого пожелает.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν παντὶ καιρῷ
  choice: во всякое время
  rationale: Сохраняет всеохватное временное значение греческого оборота и звучит естественно в современном библейском регистре.
- source_word: εὐλόγει
  choice: благословляй
  rationale: Прямо передаёт значение глагола и сохраняет традиционный библейский оборот, не заменяя его более узким «прославляй».
- source_word: Κύριον τὸν Θεόν
  choice: Господа Бога
  rationale: Передаёт оба греческих титула без добавления отсутствующего в тексте притяжательного местоимения.
- source_word: παρʼ αὐτοῦ αἴτησον
  choice: проси у Него
  rationale: Естественный русский оборот, сохраняющий указание на Бога как на Того, у Кого просят.
- source_word: ὅπως αἱ ὁδοί σου εὐθεῖαι γένωνται
  choice: чтобы пути твои стали прямыми
  rationale: Сохраняет образ прямых путей и не превращает его в отвлечённое указание на правильное поведение.
- source_word: τρίβοι
  choice: стези
  rationale: Сохраняет параллелизм с «путями» и достоинство библейского регистра; слово понятно современному читателю.
- source_word: βουλαὶ
  choice: замыслы
  rationale: В первом употреблении обозначает практические намерения или планы; «замыслы» естественно сочетается с пожеланием успешного исхода.
- source_word: εὐοδωθῶσιν
  choice: увенчались успехом
  rationale: Идиоматично передаёт успешное осуществление путей и замыслов без неестественной пассивной конструкции.
- source_word: πᾶν ἔθνος οὐκ ἔχει βουλήν
  choice: ни у одного народа нет собственного совета
  rationale: Сохраняет резкость и неоднозначность греческого утверждения; «собственного» делает подразумеваемое противопоставление Господу понятнее, не сводя βουλή к интеллектуальной способности.
- source_word: δίδωσιν πάντα τὰ ἀγαθὰ
  choice: даёт всё благое
  rationale: Кратко и прямо передаёт полноту даруемого Богом добра.
- source_word: ὃ ἐὰν θέλῃ ταπεινοῖ
  choice: смиряет кого пожелает
  rationale: Личное понимание относительного местоимения лучше соответствует контексту людей и народов и сохраняет сильное утверждение о Божьей воле.
- source_word: παιδίον
  choice: дитя
  rationale: Передаёт ласковое обращение, не добавляя отсутствующее «моё» и не конкретизируя пол словом «сын».
- source_word: μνημόνευε τῶν ἐντολῶν μου
  choice: помни мои заповеди
  rationale: Естественно передаёт повеление постоянно хранить заповеди в памяти.
theological_decisions:
- issue: Передача κύριος применительно к Богу
  choice: Господь
  alternative: Владыка
  rationale: «Господь» является точным и общепринятым библейским соответствием и не вводит дополнительного смыслового оттенка.
- issue: Противопоставление совета народов Божьему действию
  choice: 'Сохранить сильное утверждение: «ни у одного народа нет собственного совета», тогда как Господь даёт благое и смиряет по Своей воле'
  alternative: Смягчить до «ни один народ не обладает пониманием» или «человеческие советы ненадёжны»
  rationale: Греческий текст формулирует резкий контраст. Перевод сохраняет напряжение между человеческим советом и Божьей властью, не добавляя конфессионального объяснения.
- issue: Объект глагола ταπεινοῖ
  choice: 'Личное прочтение: «смиряет кого пожелает»'
  alternative: 'Безличное или предметное прочтение: «уничижает что пожелает»'
  rationale: Контекст народов делает личное прочтение наиболее связным, однако перевод не уточняет способ или цель Божьего смирения.
translation_notes:
  register: Современный литературный русский с достойным библейским звучанием. Слова «стези» и «не изгладятся» сохраняют образность оригинала, оставаясь понятными; синтаксис упрощён там, где буквальное воспроизведение греческого было бы тяжеловесным. Все сноски отмечены в основном тексте.
