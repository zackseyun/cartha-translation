base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/007.yaml
  text: From what you have[a], give alms, and do not let your eye be grudging when you give alms. Do not turn your face away from any poor person[c][b], and the face of God will not be turned away from you.
translation:
  language: ru
  text: Из того, что у тебя есть, подавай милостыню и не подавай её с сожалением.[a] Не отворачивай лица ни от одного бедняка — и лицо Бога не отвернётся от тебя.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть твой глаз не завидует»; это греческое выражение означает, что милостыню не следует подавать скупо или неохотно.'
    reason: lexical_alternative
  - marker: b
    text: «Лицо Бога» можно понимать как Его благосклонное присутствие; буквальный перевод сохраняет перекличку с призывом не отворачивать своего лица от бедняка.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τῶν ὑπαρχόντων σοι
  choice: Из того, что у тебя есть
  rationale: Передаёт широкое значение имеющегося имущества или средств и естественно звучит по-русски.
- source_word: ποίει ἐλεημοσύνην
  choice: подавай милостыню
  rationale: В данном контексте речь идёт о конкретной материальной помощи нуждающимся; традиционное русское выражение остаётся ясным современному читателю.
- source_word: μὴ φθονεσάτω σου ὁ ὀφθαλμός
  choice: не жалей отдать
  rationale: Передаёт греческую идиому о скупом, неохотном отношении при подаянии. Буквальное упоминание глаза в современном русском здесь было бы малопонятно, поэтому образ раскрыт в сноске.
- source_word: ἐν τῷ ποιεῖν σε ἐλεημοσύνην
  choice: когда подаёшь её
  rationale: Оборот имеет временное значение; местоимение позволяет избежать тяжеловесного повтора при сохранении смысла.
- source_word: μὴ ἀποστρέψῃς τὸ πρόσωπόν σου
  choice: Не отворачивай лица
  rationale: Сохраняет явное упоминание лица и риторическую перекличку с заключительной фразой.
- source_word: ἀπὸ παντὸς πτωχοῦ
  choice: ни от одного бедняка
  rationale: Мужской род единственного числа и распределительное значение греческого выражения переданы естественной русской конструкцией; по смыслу запрет не допускает исключений.
- source_word: οὐ μὴ ἀποστραφῇ
  choice: не отвернётся
  rationale: Категорическое греческое отрицание передано уверенным будущим отрицанием; активная русская конструкция естественнее формально-пассивной.
- source_word: τὸ πρόσωπον τοῦ θεοῦ
  choice: лицо Бога
  rationale: Буквальная формулировка сохраняет антропоморфный язык и намеренную параллель между лицом человека и лицом Бога.
theological_decisions:
- issue: Антропоморфный образ Бога в заключительной части
  choice: лицо Бога
  alternative: присутствие Бога
  rationale: Греческий текст дважды употребляет πρόσωπον, создавая взаимную параллель. Перевод «присутствие» истолковал бы образ и ослабил литературную связь.
- issue: Род и обобщающее значение πτωχοῦ
  choice: ни от одного бедняка
  alternative: ни от одного бедного человека
  rationale: Существительное мужского рода естественно отражает грамматическую форму источника, при этом конструкция имеет обобщающее распределительное значение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Сохранены повелительный тон, образ лица и взаимность двух заключительных частей; непрозрачная для русского читателя идиома о глазе передана по смыслу и отмечена в сноске.
