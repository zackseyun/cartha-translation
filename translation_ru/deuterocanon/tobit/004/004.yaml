base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/004.yaml
  text: And do what is pleasing to her[a], and do not grieve her. Remember, child, that she faced many dangers because of you while you were in the womb; when she dies[b], bury her beside me in one grave.
translation:
  language: ru
  text: 'Делай то, что ей приятно, и не огорчай её. Помни, дитя: она пережила много опасностей из-за тебя, когда ты был у неё во чреве[a]. Когда она умрёт, похорони её рядом со мной, в одной могиле[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «она видела много опасностей из-за тебя во чреве» — выражение об опасностях, которым мать подвергалась во время беременности и родов.'
    reason: лексическая альтернатива и пояснение идиомы
  - marker: b
    text: 'Или: «в той же гробнице».'
    reason: вариант перевода
lexical_decisions:
- source_word: ποίει τὸ ἀρεστὸν αὐτῇ
  choice: делай то, что ей приятно
  rationale: Передаёт значение ἀρεστός — «приятное, угодное, приемлемое» — и сохраняет мать как лицо, которому это приятно.
- source_word: μὴ λυπήσῃς αὐτήν
  choice: не огорчай её
  rationale: Глагол λυπέω означает причинять печаль или огорчение; «не огорчай» естественно звучит как наставление по-русски.
- source_word: μνήσθητι, παιδίον
  choice: помни, дитя
  rationale: παιδίον — ласковое обращение «дитя, ребёнок». «Дитя» сохраняет теплоту и достоинство речи, не добавляя отсутствующего в греческом притяжательного местоимения.
- source_word: πολλοὺς κινδύνους ἑόρακεν
  choice: она подвергалась многим опасностям
  rationale: Буквально — «она видела много опасностей»; в данном контексте это идиома пережитых опасностей. Выбранное выражение естественно передаёт опыт риска, не усиливая его до значения «вытерпела».
- source_word: ἐπὶ σοὶ ἐν τῇ κοιλίᾳ
  choice: из-за тебя, пока носила тебя во чреве
  rationale: ἐπὶ σοὶ имеет причинный смысл «из-за тебя, по твоей причине», а упоминание чрева относится к беременности. Формулировка делает подразумеваемую связь ясной для современного читателя.
- source_word: ὅταν ἀποθάνῃ
  choice: когда она умрёт
  rationale: ὅταν с сослагательным наклонением обозначает ожидаемое будущее событие; по-русски естественно «когда она умрёт».
- source_word: θάψον αὐτὴν παρʼ ἐμοὶ
  choice: похорони её рядом со мной
  rationale: παρά с дательным падежом выражает близость; в контексте погребения «рядом со мной» точно и ясно.
- source_word: ἐν ἑνὶ τάφῳ
  choice: в одной могиле
  rationale: Фраза буквально означает «в одной могиле/гробнице» и указывает на совместное погребение. «В одной могиле» сохраняет числительное и остаётся понятным современному читателю.
theological_decisions:
- issue: Передача семейного обращения παιδίον
  choice: дитя
  alternative: мой ребёнок; сын
  rationale: Греческое слово выражает ласковое обращение, но не содержит явного «мой» и само по себе не требует передачи мужского пола. «Дитя» сохраняет эту сдержанность.
- issue: Идиоматический смысл выражения «видела много опасностей»
  choice: подвергалась многим опасностям
  alternative: видела много опасностей
  rationale: Буквальный вариант по-русски может быть понят как простое наблюдение. Выбранная формулировка передаёт пережитый матерью риск беременности и родов, не превращая подразумеваемое в отдельное богословское утверждение.
- issue: Характер совместного погребения
  choice: рядом со мной, в одной могиле
  alternative: рядом со мной, в той же гробнице
  rationale: Греческое ἐν ἑνὶ τάφῳ буквально сохраняет образ «одной» могилы или гробницы. Основной текст не уточняет устройство места погребения, а допустимый вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский с достоинством семейного наставления. Обращение «дитя» слегка возвышенное, но понятное; остальная фраза изложена естественно и без архаической синтаксической тяжеловесности. Маркеры сносок поставлены непосредственно при поясняемых выражениях.
