base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/001.yaml
  text: On that day Tobit remembered the silver that he had deposited with Gabael in Rages of Media[a][b].
translation:
  language: ru
  text: В тот день Товит вспомнил о серебре[a], которое он отдал на хранение Гаваилу в Рагах Мидии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о деньгах»; греческое слово «серебро» может обозначать деньги — монеты или серебро на вес.'
    reason: lexical_alternative
  - marker: b
    text: Раги — город в Мидии; название также передают как «Рагес».
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: В тот день
  rationale: Естественное современное соответствие греческому определённому указанию времени.
- source_word: ἐμνήσθη
  choice: вспомнил
  rationale: Прямо и без дополнительного толкования передаёт значение аориста среднего залога.
- source_word: περὶ τοῦ ἀργυρίου
  choice: о серебре
  rationale: Сохраняет буквальный образ греческого ἀργύριον, которое в данном контексте обозначает денежные средства; альтернатива пояснена в сноске.
- source_word: ὃ παρέθετο
  choice: которое он отдал на хранение
  rationale: Передаёт контекстуальное значение παρατίθημι — доверить другому лицу для хранения — естественнее по-русски, чем буквальное «положил».
- source_word: Γαβαήλῳ
  choice: Гаваилу
  rationale: Русская библейская передача греческого личного имени Γαβαήλ, с необходимой формой дательного падежа.
- source_word: ἐν Ῥάγοις
  choice: в Рагах
  rationale: Транслитерация греческого топонима Ῥάγοι с русским предложным падежом.
- source_word: τῆς Μηδίας
  choice: Мидии
  rationale: Родительный падеж естественно выражает принадлежность города к области, сохраняя греческую конструкцию.
