  text: Рассыпь свой хлеб на могилу праведных[a] и не давай грешникам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у гробницы праведных». Возможно, речь идёт о благотворительности при погребении или поминовении, но греческое выражение здесь передано буквально.'
