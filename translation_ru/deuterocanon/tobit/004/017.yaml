lexical_decisions:
- source_word: ἔκχεον
  choice: Излей
  rationale: Повелительное наклонение буквально означает «излей, вылей». Конкретный и необычный образ сохранён, поскольку более свободное «щедро раздавай» устранило бы возможную связь с погребальным или поминальным обычаем.
- source_word: τοὺς ἄρτους σου
  choice: свой хлеб
  rationale: Хотя в греческом стоит множественное число («твои хлебы/буханки»), русское собирательное «хлеб» естественно передаёт пищу и сохраняет конкретный образ.
- source_word: ἐπὶ τὸν τάφον τῶν δικαίων
  choice: на могилу праведных
  rationale: 'Предлог с винительным падежом передаёт направленность действия: хлеб изливается или выкладывается «на могилу». Точное значение стоящего за выражением обычая не разъясняется в основном тексте.'
- source_word: τῶν δικαίων
  choice: праведных
  rationale: «Праведные» — обычное и точное библейское соответствие δικαίων, сохраняющее нравственно-религиозный смысл слова.
- source_word: καὶ μὴ δῷς
  choice: и не давай
  rationale: Прямо передаёт союз καί и отрицательное повеление; подразумеваемый объект («хлеб») не добавляется, что сохраняет краткость греческого текста.
- source_word: τοῖς ἁμαρτωλοῖς
  choice: грешникам
  rationale: Стандартное и понятное соответствие слову ἁμαρτωλοῖς без ослабления его нравственно-религиозного значения.
theological_decisions:
- issue: Толкование погребального наставления
  choice: 'В основном тексте сохранён буквальный образ: «излей свой хлеб на могилу праведных».'
  alternative: «Раздавай свой хлеб при погребении праведных» или «делись пищей, поминая праведных».
  rationale: Греческое выражение конкретно, но обозначаемый им культурный обычай не вполне ясен. Буквальный перевод сохраняет неоднозначность, а возможное толкование вынесено в сноску.
- issue: Объём запрета относительно грешников
  choice: «и не давай грешникам» — без добавления прямого дополнения.
  alternative: «и не давай своего хлеба грешникам» или «и не участвуй в таком поминальном благодеянии ради грешников».
  rationale: Во второй части греческого предложения предмет даяния подразумевается. Его явное добавление могло бы сузить или истолковать лаконичный запрет.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Необычное «излей свой хлеб» намеренно сохранено как конкретный образ исходного текста; сноска поясняет возможный контекст, не превращая предположение в перевод.
