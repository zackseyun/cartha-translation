lexical_decisions:
- source_word: ποιοῦντός σου τὴν ἀλήθειαν
  choice: если ты поступаешь по правде
  rationale: Оборот с родительным самостоятельным и διότι в греческом сжат и синтаксически неровен. Условная передача естественна в контексте наставления, а «поступаешь по правде» выражает этический смысл ἀλήθεια — правдивую и верную жизнь — без сведения выражения к одной лишь речи.
- source_word: εὐοδίαιι ἔσονται ἐν τοῖς ἔργοις σου
  choice: тебе будет сопутствовать успех в твоих делах
  rationale: Несмотря на необычную форму εὐοδίαιι, смысл фразы связан с благополучным ходом и успешным исходом начинаний. Такая передача сохраняет будущее время и не ограничивает успех материальным достатком.
- source_word: πᾶσι τοῖς ποιοῦσι
  choice: всем поступающим
  rationale: Причастный оборот обозначает людей, для которых это действие характерно; настоящее причастие «поступающим» сохраняет длительный, жизненный характер поведения.
- source_word: τὴν δικαιοσύνην
  choice: праведно
  rationale: δικαιοσύνη здесь охватывает нравственную правоту и справедливость. Наречная формулировка естественна по-русски и передаёт выражение «творить праведность» без тяжеловесности.
theological_decisions:
- issue: Значение δικαιοσύνη
  choice: праведно
  alternative: справедливо; творя праведность
  rationale: В этическом наставлении слово обозначает праведное, должное поведение в широком смысле, а не только судебную или общественную справедливость. Возможный оттенок справедливости сохранён в примечании.
- issue: Связь праведного поведения с успехом
  choice: будет сопутствовать успех
  alternative: дела будут процветать
  rationale: Перевод передаёт выраженную в стихе связь, но не уточняет природу успеха и не сводит его к обещанию материального процветания.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительной речи. Выражение «поступать по правде» понятно широкому читателю и сохраняет библейскую нравственную ёмкость; синтаксис сделан естественным, при этом неоднозначность δικαιοσύνη отмечена в сноске.
