base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/003.yaml
  text: And calling him[a], he said, “Child, if I die, bury me, and do not neglect your mother; honor her all the days of your life,”
translation:
  language: ru
  text: 'И, позвав его, сказал: «Дитя, если я умру, похорони меня и не оставляй без внимания свою мать[a]; почитай её во все дни своей жизни».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пренебрегай своей матерью», «не забывай о своей матери». В параллельной семитской традиции выражение имеет более сильный смысл: «не покидай её».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλέσας
  choice: позвав
  rationale: Деепричастие естественно передаёт предшествующее речи действие и сохраняет плавность повествования.
- source_word: Παιδίον
  choice: Дитя
  rationale: Ласковое семейное обращение без добавления отсутствующего в греческом местоимения «моё» и без сужения значения до «сын».
- source_word: ἐὰν ἀποθάνω
  choice: если я умру
  rationale: Сохраняет условную форму греческого выражения, не заменяя её более ожидаемым по контексту «когда я умру».
- source_word: θάψον με
  choice: похорони меня
  rationale: Прямой, ясный и современный эквивалент повелительной формы.
- source_word: μὴ ὑπερίδῃς
  choice: не оставляй без внимания
  rationale: Передаёт смысл пренебрежения и невнимания, сохраняя некоторую широту греческого глагола; более сильный оттенок «не оставляй» отмечен в сноске.
- source_word: τίμα
  choice: почитай
  rationale: Устойчивое библейское выражение сыновнего долга, понятное в современном литературном русском языке.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς σου
  choice: во все дни своей жизни
  rationale: Сохраняет торжественную полноту исходного выражения и звучит естественно по-русски.
theological_decisions:
- issue: Использование более пространной параллельной семитской традиции
  choice: Основной текст следует приведённому греческому тексту; параллельная традиция учитывается только для уточнения этической силы наставления о матери.
  alternative: Дополнить стих отсутствующими в данном греческом отрывке наставлениями или перевести μὴ ὑπερίδῃς более категорично как «не покидай».
  rationale: Перевод должен опираться прежде всего на греческий текст Swete; поздний еврейский обратный перевод может подтверждать оттенок смысла, но не служит основанием для внесения дополнительных фраз.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Обращение «Дитя» сохраняет нежность оригинала; синтаксис остаётся ясным и близким к греческому.
