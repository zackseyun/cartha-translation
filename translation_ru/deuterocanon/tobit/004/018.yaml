translation:
  language: ru
  text: Спрашивай совета у каждого мудрого человека и не пренебрегай ни одним полезным советом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пренебрегай никаким полезным советом». В греческом тексте повторено то же слово, которое в начале стиха передано словом «совет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμβουλίαν
  choice: совета
  rationale: Существительное означает совет или наставление; сочетание «просить совета» естественно по-русски и передаёт целенаправленное обращение за руководством.
- source_word: παρὰ παντὸς φρονίμου
  choice: у каждого мудрого
  rationale: παρά с родительным указывает на источник, а субстантивированное φρόνιμος — на мудрого, благоразумного человека. Краткая форма «у каждого мудрого» сохраняет грамматический облик и обобщающий характер наставления.
- source_word: ζήτησον
  choice: проси
  rationale: В данном сочетании ζητέω означает стремиться получить совет; русское «проси совета» звучит естественнее буквального «ищи совета» и сохраняет силу повеления.
- source_word: μὴ καταφρονήσῃς
  choice: не пренебрегай
  rationale: καταφρονέω может означать презирать или относиться с пренебрежением. В контексте совета «не пренебрегай» точно передаёт запрет не отвергать его как недостойный внимания.
- source_word: ἐπὶ πάσης συμβουλίας χρησίμης
  choice: никаким полезным советом
  rationale: При отрицании πάσης естественно передаётся как «никаким», χρησίμης — как «полезным». Управление творительным падежом обусловлено русским глаголом «пренебрегать».
