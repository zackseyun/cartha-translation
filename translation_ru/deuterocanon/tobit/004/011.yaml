translation:
  language: ru
  text: Ибо милостыня — добрый дар для всех, кто подаёт милостыню пред Всевышним[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доброе приношение»; греческое слово может означать как дар вообще, так и, в некоторых контекстах, приношение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δῶρον
  choice: дар
  rationale: Основное значение — «дар»; оно сохраняет широту греческого слова и не навязывает исключительно культового смысла «приношение».
- source_word: ἐλεημοσύνη
  choice: милостыня
  rationale: Слово обозначает конкретную помощь нуждающимся, прежде всего подаяние, а не милосердие вообще.
- source_word: πᾶσι τοῖς ποιοῦσιν αὐτήν
  choice: для всех, кто подаёт её
  rationale: По-русски милостыню естественно «подают»; это передаёт конкретное действие ποιέω с местоимением αὐτήν без неестественного «делает её».
- source_word: ἐνώπιον τοῦ ὑψίστου
  choice: пред Всевышним
  rationale: Сохраняет пространственно-оценочный смысл «перед, в присутствии» и традиционный, понятный современному читателю божественный титул.
- source_word: τοῦ ὑψίστου
  choice: Всевышним
  rationale: «Всевышний» — естественное русское соответствие стандартному иудейскому титулу Бога ὁ ὕψιστος.
theological_decisions:
- issue: Как понимать утверждение, что милостыня является «добрым даром»
  choice: Передать прямую положительную оценку милостыни, не уточняя сверх текста, кому именно адресован дар и какую награду он влечёт.
  alternative: Истолковать «дар» как культовое приношение Богу или как небесную награду подающему.
  rationale: Греческий текст называет милостыню добрым даром для совершающих её пред Всевышним, но не формулирует развитого учения о заслуге, спасении или награде; неоднозначность следует сохранить.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным библейским звучанием. Форма «пред Всевышним» сохраняет достоинство и ритм, оставаясь понятной; «подаёт милостыню» является естественным русским сочетанием.
