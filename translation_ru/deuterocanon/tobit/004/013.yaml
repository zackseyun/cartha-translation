base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/013.yaml
  text: And now[a], child, love your brothers, and do not become proud in your heart over your brothers and the sons and daughters of your people, so as to take a wife for yourself from among them. For in pride there is ruin and much disorder, and in uselessness there is decline and great want[b]; for uselessness is the mother of famine.
translation:
  language: ru
  text: И теперь, дитя, люби своих братьев и не превозносись в сердце своём над своими братьями, сыновьями и дочерьми своего народа, чтобы взять себе жену из их числа.[a] Ведь от гордости — погибель и великий разлад, а от праздности — упадок и тяжкая нужда;[b] ибо праздность — мать голода.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза сжата, поэтому её можно понять и так: «не превозносись над своими братьями, сыновьями и дочерьми своего народа, беря себе жену из их числа». Возможно также, что речь идёт именно о недопустимости гордости при выборе жены среди своего народа.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «никчёмности»; возможны также «лености» или «бесполезности». Упоминание упадка, нужды и голода делает наиболее вероятным смысл праздной, непроизводительной бездеятельности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: дитя
  rationale: Ласковое обращение, сохраняющее семейный тон и не добавляющее отсутствующего в греческом притяжательного местоимения.
- source_word: ἀγάπα
  choice: люби
  rationale: Прямой и естественный эквивалент повелительной формы ἀγαπάω.
- source_word: ἀδελφούς
  choice: братьев
  rationale: Сохраняет грамматически мужскую форму греческого текста; далее круг соплеменников прямо расширен словами «сыновьями и дочерьми».
- source_word: ὑπερηφάνευε τῇ καρδίᾳ σου
  choice: не превозносись в сердце своём
  rationale: Передаёт внутреннюю горделивую установку и сохраняет библейский образ сердца.
- source_word: ἀπὸ τῶν ἀδελφῶν σου καὶ τῶν υἱῶν καὶ θυγατέρων τοῦ λαοῦ σου
  choice: над своими братьями, сыновьями и дочерьми своего народа
  rationale: При глаголе гордости ἀπό указывает на превознесение над другими; русское «над» естественно выражает это отношение.
- source_word: λαβεῖν σεαυτῷ ἐξ αὐτῶν γυναῖκα
  choice: когда берёшь себе жену из их числа
  rationale: Передаёт брачную идиому и связывает инфинитив с предостережением против гордости, не превращая сжатую конструкцию в однозначно сформулированную отдельную заповедь.
- source_word: ἀπώλεια
  choice: погибель
  rationale: Выражает губительный итог гордости, не придавая слову специально эсхатологического смысла.
- source_word: ἀκαταστασία πολλή
  choice: великий разлад
  rationale: Передаёт широкий смысл беспорядка, смуты и неустроенности в естественной для русского изречения форме.
- source_word: ἀχρειότης
  choice: праздность
  rationale: Контекст упадка, нужды и голода указывает на бездеятельность и непроизводительность, а не просто на отвлечённую никчёмность.
- source_word: ἐλάττωσις
  choice: упадок
  rationale: Передаёт уменьшение, оскудение или ухудшение состояния и хорошо сочетается с хозяйственно-нравственным контекстом.
- source_word: ἔνδεια μεγάλη
  choice: тяжкая нужда
  rationale: Естественно выражает сильную нехватку и лишения, сохраняя достоинство назидательного стиля.
theological_decisions:
- issue: Связь предостережения против гордости с брачной оговоркой
  choice: 'Основной текст понимает оговорку ситуативно: нельзя превозноситься над соплеменниками при выборе жены из их числа.'
  alternative: 'Инфинитив можно связать с предшествующим как цель или следствие: «не превозносись… чтобы взять себе жену из их числа», либо увидеть здесь более прямое повеление брать жену из своего народа.'
  rationale: Греческий синтаксис сжат и допускает несколько способов связи. Перевод даёт связный русский текст, а сноска сохраняет реальную неоднозначность и не вводит более широкого учения о браке, чем позволяет стих.
- issue: Смысл ἀχρειότης
  choice: праздность
  alternative: никчёмность, бесполезность или леность
  rationale: Следствия — упадок, нужда и голод — преимущественно поддерживают смысл бездеятельности, хотя более буквальное значение непригодности полностью исключать нельзя.
translation_notes:
  register: Современный литературный русский с достоинством назидательной речи. Параллельные формулы «от гордости — …, а от праздности — …» сохраняют афористичность оригинала. Неоднозначность брачной оговорки вынесена в сноску; основной текст остаётся естественным и не перегруженным.
