  yaml_path: translation/deuterocanon/tobit/004/021.yaml
  text: And do not be afraid[a], child, because we have become poor; you have much, if you fear God and turn away from every sin and do what is pleasing before him.
translation:
  language: ru
  text: 'И не бойся, дитя, что мы обеднели: у тебя много[a], если будешь бояться Бога, сторониться всякого греха и делать то, что угодно Ему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тебе доступно многое». Греческое выражение может обозначать как то, чем человек обладает, так и то, что имеется в его распоряжении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβοῦ
  choice: не бойся
  rationale: Естественная русская передача запретительного повеления, сохраняющая смысл страха, вызванного обеднением.
- source_word: παιδίον
  choice: дитя
  rationale: Ласковое семейное обращение без добавления отсутствующего в греческом притяжательного местоимения «моё».
- source_word: ἐπτωχεύσαμεν
  choice: мы обеднели
  rationale: Совершенный вид передаёт вхождение в состояние бедности, выраженное аористом, а не только наличие бедности.
- source_word: ὑπάρχει σοι πολλὰ
  choice: у тебя есть многое
  rationale: 'Сохраняет широкое значение греческого оборота: то, чем человек обладает или что ему доступно; не ограничивает смысл материальным достатком.'
- source_word: ἐὰν φοβηθῇς τὸν θεὸν
  choice: если будешь бояться Бога
  rationale: Традиционное и понятное библейское выражение сохраняет значение благоговейного страха, не ослабляя его до одного лишь почтения.
- source_word: ἀποστῇς ἀπὸ πάσης ἁμαρτίας
  choice: удаляться от всякого греха
  rationale: Передаёт отделение и сознательное отстранение от греха; несовершенный вид естественно согласуется с описанием устойчивого образа жизни в условной конструкции.
- source_word: ποιήσῃς τὸ ἀρεστὸν
  choice: делать угодное
  rationale: Субстантивированное прилагательное передано кратко и естественно, без добавления слова «то», не обязательного по-русски.
- source_word: ἐνώπιον αὐτοῦ
  choice: Ему
  rationale: В сочетании «угодное Ему» естественно передаёт смысл того, что приятно и приемлемо перед Богом, избегая тяжеловесного буквального оборота «перед Ним».
theological_decisions:
- issue: Смысл слов «у тебя есть многое» в контексте бедности
  choice: 'Оставить утверждение широким: при жизни в страхе Божьем сын обладает многим или многое ему доступно, без уточнения природы этого блага.'
  alternative: Понимать фразу исключительно как обещание материального изобилия либо исключительно как указание на духовное богатство.
  rationale: Греческий текст не определяет, о каких именно благах идёт речь. Такая передача не превращает условие в формулу материального процветания и не сужает смысл до исключительно духовного.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Обращение «дитя» сохраняет семейную теплоту; синтаксис остаётся ясным для обычного читателя.
