revisions:
- from: Плата всякого человека, который работает у тебя, пусть не остаётся у тебя на ночь — отдай ему сразу. Если будешь служить Богу, тебе воздастся. Следи за собой, дитя, во всех своих делах и будь наставлен во всём своём поведении.
  to: Не задерживай до следующего дня оплату труда всякого, кто работает у тебя, но отдавай её сразу. Если будешь служить Богу, тебе воздастся. Следи за собой, дитя, во всех своих делах и будь благоразумен во всём своём поведении.
  rationale: 'Редакция устраняет неестественность и двусмысленность в первом наставлении, при этом сохраняет все существенные элементы греческого текста: всеобщий охват работников, задержку до ночи/следующего дня, немедленную выплату и безличное воздаяние. Финальное выражение передано естественным русским нравственным призывом, соответствующим контексту ἐν πάσῃ ἀναστροφῇ σου.'
