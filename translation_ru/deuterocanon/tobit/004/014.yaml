review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: запрет задерживать заработанное, немедленная выплата, безлично выраженное воздаяние за служение Богу и заключительное нравственное наставление сохранены. Однако «плата всякого человека» двусмысленно и менее естественно передаёт μισθὸς ... ὃς ... ἐργάσηται παρὰ σοί: речь о плате за труд каждого, кто работает у адресата. «Будь наставлен» формально отражает πεπαιδευμένος, но в современном русском звучит неестественно и не передаёт практический, нравственный смысл наставления в контексте поведения.'
  naturalness: Предлагаемая редакция использует естественные современные обороты «не задерживай до следующего дня оплату труда» и «будь благоразумен во всём своём поведении», сохраняя наставительный, достойный регистр.
  terminology: «Богу» и безличное «тебе воздастся» корректно сохраняют дательный τῷ θεῷ и пассив ἀποδοθήσεταί σοι без добавления прямо названного деятеля. «Оплата труда» точно уточняет, что μισθός — причитающееся работнику вознаграждение. «Благоразумен» в данном контексте передаёт результат воспитания/наставления (πεπαιδευμένος), не вводя специальной богословской интерпретации.
  issues:
