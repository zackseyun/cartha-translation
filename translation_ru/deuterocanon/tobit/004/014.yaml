base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/004/014.yaml
  text: Do not let the wages of any man who works for you stay overnight with you, but pay him at once. If you serve God, it will be repaid to you. Watch yourself, child, in all your works, and be disciplined in all your conduct.
translation:
  language: ru
  text: Не задерживай до следующего дня оплату труда всякого, кто работает у тебя, но отдавай её сразу. Если будешь служить Богу, тебе воздастся. Следи за собой, дитя, во всех своих делах и будь благоразумен во всём своём поведении.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μισθὸς
  choice: плата
  rationale: Передаёт заработанное вознаграждение без излишне узкого современного оттенка слова «зарплата».
- source_word: μὴ αὐλισθήτω
  choice: пусть не остаётся ... на ночь
  rationale: Греческий глагол буквально связан с ночлегом; естественная русская формулировка сохраняет образ задержанной до следующего дня платы.
- source_word: παραυτίκα
  choice: сразу
  rationale: Точно и естественно передаёт требование немедленной выплаты.
- source_word: ἐὰν δουλεύσῃς τῷ θεῷ
  choice: если будешь служить Богу
  rationale: Сохраняет условную конструкцию и обычное библейское значение δουλεύω с дательным падежом.
- source_word: ἴσθι πεπαιδευμένος
  choice: будь наставлен
  rationale: Сохраняет пассивно-результативный оттенок причастия; речь идёт о человеке, воспринявшем воспитание и наставление, а не только о самодисциплине.
- source_word: ἀναστροφῇ
  choice: поведении
  rationale: В данном нравственном контексте обозначает образ жизни и поведения.
theological_decisions:
- issue: Неуказанный деятель в ἀποδοθήσεταί σοι
  choice: тебе воздастся
  alternative: Бог воздаст тебе
  rationale: Пассив оригинала не называет деятеля прямо; перевод сохраняет эту форму и не добавляет подлежащее, хотя контекст подразумевает Бога.
- issue: Связь служения Богу с воздаянием
  choice: сохранено прямое условное высказывание
  alternative: если послужишь Богу, Он наградит тебя
  rationale: Перевод не уточняет природу воздаяния и не превращает формулировку в обещание конкретной награды.
translation_notes:
  register: Современный литературный русский язык с достоинством наставления отца ребёнку. Синтаксис близок к греческому, но естественен по-русски; гендерно общий смысл παντὸς ἀνθρώπου передан словом «всякого человека».
