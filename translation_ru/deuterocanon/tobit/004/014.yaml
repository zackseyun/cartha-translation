    issue: «Плата всякого человека»
    rationale: Конструкция грамматически допускает понимание как платы, принадлежащей человеку, но по-русски тяжеловесна и неясно обозначает плату за труд работника.
  - severity: low
    issue: «Будь наставлен»
    rationale: Пассивная форма буквально мотивирована, однако в современном литературном русском неестественна в наставлении о личном поведении. Нужна идиоматичная передача практического нравственного смысла.
