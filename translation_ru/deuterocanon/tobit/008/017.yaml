base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/017.yaml
  text: Blessed are you[a], because you have made me rejoice, and it has not happened to me as I suspected; rather, according to your abundant mercy, you have acted with us. Blessed are you, because you have shown mercy to two only children. Show them mercy, Master[c][b]; bring their life to completion in health with gladness and mercy.
translation:
  language: ru
  text: Благословен Ты, потому что обрадовал меня, и со мной случилось не то, чего я опасался[a], но по великой милости Твоей Ты поступил с нами. Благословен Ты, потому что оказал милость двум единственным детям[b]. Яви им милость, Владыка, и дай им прожить жизнь до конца в здравии, радости и милости[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не так, как я предполагал». Греческий глагол может означать предположение или подозрение; в данном контексте оно окрашено тревогой.'
    reason: lexical_alternative
  - marker: b
    text: То есть каждый из супругов был единственным ребёнком у своих родителей.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «доведи их жизнь до завершения». В греческом тексте слово «жизнь» стоит в единственном числе и может обозначать общий жизненный путь обоих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογητὸς
  choice: Благословен
  rationale: Сохраняет форму обращённого к Богу благословения и возвышенный, но понятный современному читателю тон.
- source_word: ηὔφρανάς
  choice: обрадовал меня
  rationale: Передаёт каузативное значение глагола естественным современным русским выражением.
- source_word: ὑπενόουν
  choice: чего я опасался
  rationale: В контексте речь идёт о тревожном предположении; перевод передаёт контекстуальный оттенок, не утверждая, что основное значение глагола — «бояться».
- source_word: κατὰ τὸ πολὺ ἔλεός σου
  choice: по великой милости Твоей
  rationale: Передаёт меру или основание действия и сохраняет ключевую тему милости.
- source_word: ἐποίησας μεθʼ ἡμῶν
  choice: Ты поступил с нами
  rationale: Естественно передаёт широкий греческий оборот, не конкретизируя само милостивое действие сверх текста.
- source_word: ἠλέησας
  choice: помиловал
  rationale: Кратко и непосредственно передаёт действие ἐλεέω и поддерживает повтор мотива милости.
- source_word: δύο μονογενεῖς
  choice: двух единственных детей
  rationale: В повествовательном контексте обозначает двух людей, каждый из которых является единственным ребёнком у своих родителей, без христологических коннотаций слова «единородный».
- source_word: δέσποτα
  choice: Владыка
  rationale: Сохраняет оттенок верховной власти и отличает δέσποτα от обычной передачи κύριος как «Господь».
- source_word: συντέλεσον τὴν ζωὴν αὐτῶν
  choice: дай им прожить жизнь до конца
  rationale: Передаёт молитву о завершении полного жизненного пути; сохраняет коллективное единственное число «жизнь» в естественной русской конструкции.
- source_word: ἐν ὑγείᾳ
  choice: в здравии
  rationale: Точно передаёт здоровье и соответствует достоинству молитвенного регистра.
- source_word: μετὰ εὐφροσύνης καὶ ἐλέους
  choice: в радости и милости
  rationale: Сохраняет сочетание радостного благополучия с продолжающейся милостью и повтор ἔλεος.
theological_decisions:
- issue: Передача обращения δέσποτα к Богу
  choice: Владыка
  alternative: Господь; Повелитель
  rationale: «Владыка» естественно для русской молитвенной речи, выражает суверенную власть и не смешивает δέσποτα с κύριος.
- issue: Значение μονογενεῖς
  choice: двух единственных детей
  alternative: двух единородных; двух уникальных детей
  rationale: Здесь речь о семейном положении Сарры и Товии — каждый является единственным ребёнком своих родителей; перевод не вносит отсутствующего в контексте богословского смысла.
- issue: Коллективное единственное число ζωὴν
  choice: прожить жизнь до конца
  alternative: доведи их жизни до завершения
  rationale: Сохранено единственное число исходного текста, но русская формулировка ясно относится к обоим супругам и звучит как просьба о полном жизненном пути.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного обращения. Местоимения, относящиеся к Богу, написаны с прописной буквы как стилистический знак почтения. Архаизмы сведены к привычным для возвышенной молитвенной речи словам «благословен», «Владыка», «в здравии».
