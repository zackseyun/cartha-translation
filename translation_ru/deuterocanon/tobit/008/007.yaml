  text: And now[a], Lord, I am not taking this my sister because of sexual immorality, but in truth[b]. Command that I may find mercy and that I and she may grow old together.
translation:
  language: ru
  text: И ныне, Господи, я беру эту мою сестру[a] не ради распутства, но по истине. Повели помиловать меня и её и дать нам состариться вместе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Эту мою сестру» — родственное обозначение близкой родственницы; в повествовании она является допустимой брачной партнёршей. Возможный пояснительный перевод: «эту мою родственницу».'
    reason: cultural_note
  - marker: b
    text: Греческая конструкция кратка и синтаксически трудна. Буквально она содержит просьбу «повели помиловать меня» и «состариться вместе»; распределение местоимения «её» между этими частями понимается по-разному.
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριε
  choice: Господи
  rationale: Это прямое обращение к Богу в молитве; звательная форма «Господи» естественна для современного русского библейского стиля.
- source_word: πορνείαν
  choice: распутства
  rationale: Слово обозначает недозволенное половое поведение; «распутство» сохраняет нравственную направленность термина и в данном контексте указывает на порочное половое побуждение, не сводя смысл только к юридически определённому виду связи.
- source_word: λαμβάνω
  choice: беру
  rationale: Буквально глагол означает «брать, принимать», а здесь употреблён в брачном контексте. «Беру» сохраняет образ исходного текста; перевод «беру в жёны» был бы яснее, но добавлял бы отсутствующие в греческом слова.
- source_word: τὴν ἀδελφήν μου ταύτην
  choice: эту мою сестру
  rationale: Буквальный перевод сохраняет родственный язык книги, где близкая родственница может быть законной брачной партнёршей. Поясняющий вариант «мою родственницу» перенесён в примечание.
- source_word: ἐπʼ ἀληθείας
  choice: по истине
  rationale: Формулировка сохраняет прямое противопоставление распутству и не сужает выражение до одной лишь «искренности»; оно может подразумевать истинное, честное и праведное намерение.
- source_word: ἐπίταξον
  choice: Повели
  rationale: Императив буквально означает «прикажи, распорядись». «Повели» уместно в обращённой к Богу молитве и не ослабляет силу глагола до простого «даруй».
- source_word: ἐλεῆσαί με
  choice: помиловать меня
  rationale: Инфинитив выражает просьбу о милости к молящемуся. Такой перевод прямо передаёт объект με — «меня».
- source_word: αὐτὴν συγκαταγηρᾶσαι
  choice: ей состариться вместе со мной
  rationale: 'Местоимение αὐτήν естественно понимается как винительный падеж субъекта при инфинитиве: «чтобы она состарилась вместе [со мной]». Комитативное «со мной» подразумевается составным глаголом и контекстом супружеской молитвы.'
theological_decisions:
- issue: Значение слова «сестра» в брачной молитве
  choice: Сохранить буквальное «сестра» в основном тексте как язык родства внутри повествования.
  alternative: «родственница» или поясняющее «соплеменница»
  rationale: Греческий текст прямо говорит ἀδελφήν. Буквальный перевод сохраняет культурную и повествовательную особенность, а примечание предотвращает ошибочное понимание как брака между непосредственными братом и сестрой.
- issue: Синтаксис заключительной просьбы
  choice: Различить просьбу о помиловании говорящего и просьбу о том, чтобы женщина состарилась вместе с ним.
  alternative: «Повели помиловать меня и её и дать нам состариться вместе»
  rationale: В данном греческом тексте με непосредственно относится к ἐλεῆσαί, тогда как αὐτήν удобно читать как субъект следующего инфинитива συγκαταγηρᾶσαι. Однако краткая и неровная конструкция допускает более объединённое понимание прошения, поэтому альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Формы «Господи» и «повели» поддерживают достоинство молитвы; намеренно сохранены исходные выражения «беру эту мою сестру» и «по истине», а их культурная и смысловая неоднозначность пояснена сносками.
