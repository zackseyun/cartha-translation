base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/004.yaml
  text: And when the two of them had been shut in together[a], Tobiah rose from the bed and said, “Get up, sister[b], and let us pray that the Lord may show us mercy.”
translation:
  language: ru
  text: 'Когда их обоих заперли вместе[a], Товия встал с постели и сказал: «Встань, сестра[b], и помолимся, чтобы Господь помиловал нас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «заключили вместе»; речь идёт о том, что молодожёнов заперли вместе в комнате.'
    reason: lexical_alternative
  - marker: b
    text: «Сестра» — буквальное греческое обращение; здесь Товия так обращается к своей невесте, используя принятое в повествовании родственное обозначение.
    reason: cultural_note
lexical_decisions:
- source_word: συνεκλείσθησαν
  choice: заперли вместе
  rationale: Пассивная форма указывает, что пару закрыли вместе в комнате; перевод сохраняет как пассивный смысл, так и последовательность повествования.
- source_word: ἀμφότεροι
  choice: их обоих
  rationale: Естественно и точно обозначает двух находящихся вместе людей.
- source_word: ἀνέστη
  choice: встал
  rationale: В сочетании «встал с постели» естественно передаёт действие и сохраняет сдержанный повествовательный тон.
- source_word: κλίνης
  choice: постели
  rationale: В контексте брачной комнаты «постель» является ясным и стилистически уместным соответствием.
- source_word: Ἀνάστηθι
  choice: Встань
  rationale: Точно передаёт повелительную форму и перекликается с предшествующим действием Товии.
- source_word: ἀδελφή
  choice: сестра
  rationale: Буквально сохраняет греческое обращение, не заменяя его истолковывающим вариантом.
- source_word: προσευξώμεθα
  choice: помолимся
  rationale: Естественно передаёт побудительный конъюнктив первого лица множественного числа.
- source_word: ἐλεήσῃ
  choice: помиловал нас
  rationale: Обычное современное библейское соответствие глаголу ἐλεέω; передаёт просьбу о милости Господа.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Устоявшееся русское соответствие κύριος в данном богословском контексте.
theological_decisions:
- issue: Обращение ἀδελφή к невесте Товии
  choice: Сохранить в основном тексте буквальное «сестра»
  alternative: Передать истолковательно как «жена», «дорогая» или опустить обращение
  rationale: Греческий текст прямо содержит «сестра». Такое родственное обращение к невесте отражает язык повествования и не должно быть устранено ради сглаживания; возможное недоразумение поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным тоном. Необычное обращение «сестра» сохранено по греческому оригиналу и разъяснено сноской.
