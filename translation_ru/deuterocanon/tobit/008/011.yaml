  text: И Рагуил пришёл в свой дом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в собственный дом». Греческое возвратное местоимение ἑαυτοῦ допускает более подчёркнутую передачу, однако контекст не требует особого противопоставления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет простой повествовательный союз и паратактическое течение греческого текста, не добавляя явно выраженного временного оттенка.
- source_word: ἦλθεν
  choice: пришёл
  rationale: Естественно передаёт аорист ἔρχομαι; значение входа уже выражено сочетанием εἰς с винительным падежом, поэтому «вошёл» было бы более конкретным, чем исходный глагол.
- source_word: Ῥαγουὴλ
  choice: Рагуил
  rationale: Традиционная русская форма имени, соответствующая греческому Ῥαγουήλ.
- source_word: εἰς τὴν οἰκίαν
  choice: в дом
  rationale: Предлог εἰς с винительным обозначает движение внутрь; «в дом» естественно и точно передаёт пространственное направление.
- source_word: ἑαυτοῦ
  choice: свой
  rationale: Русское возвратно-притяжательное местоимение однозначно соотносит дом с подлежащим Рагуилом и естественно передаёт греческое возвратное местоимение без излишнего смыслового усиления.
