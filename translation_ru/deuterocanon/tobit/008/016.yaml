base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/016.yaml
  text: And Raguel blessed God[a], saying, “Blessed are you, O God, with every blessing; and may your holy ones bless you, and all your creatures[c][b]; may all your angels and your chosen ones bless you forever.”
translation:
  language: ru
  text: 'И Рагуил благословил Бога, сказав: «Благословен Ты, Боже, всяким благословением! Да благословляют Тебя святые Твои[a] и все Твои творения; все ангелы Твои и избранные Твои да благословляют Тебя вовеки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святые существа Твои». Греческое выражение не уточняет, имеются ли в виду праведные люди, небесные существа или те и другие.'
    reason: лексическая и референтная неоднозначность
lexical_decisions:
- source_word: εὐλόγησεν / Εὐλογητὸς / εὐλογείτωσάν
  choice: благословил / Благословен / да благословляют
  rationale: Повтор однокоренных слов сохраняет словесную связь и литургический строй греческого текста; «прославил» было бы менее точно и разрушило бы этот повтор.
- source_word: ἐν πάσῃ εὐλογίᾳ
  choice: всяким благословением
  rationale: Творительный падеж естественно передаёт здесь греческое ἐν с отвлечённым существительным и сохраняет всеохватное значение πάσῃ.
- source_word: οἱ ἅγιοί σου
  choice: святые Твои
  rationale: Передаёт основное значение ἅγιοι, не уточняя без достаточных оснований, идёт ли речь о праведниках, небесных существах или обеих группах.
- source_word: πᾶσαι αἱ κτίσεις σου
  choice: все Твои творения
  rationale: Множественное число «творения» отражает греческое κτίσεις и допускает широкий охват всего сотворённого.
- source_word: οἱ ἐκλεκτοί σου
  choice: избранные Твои
  rationale: Прозрачно передаёт ἐκλεκτοί и не вводит более узкого догматического определения референта.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Естественная для русской библейской речи краткая формула со значением непрестанного, вечного прославления.
theological_decisions:
- issue: Кого обозначают «святые Твои» и «избранные Твои» в перечне, где отдельно названы ангелы
  choice: Сохранены широкие наименования без определения их референта
  alternative: Истолковать оба выражения только как обозначения ангелов либо только как обозначения верных Богу людей
  rationale: Греческий текст не определяет эти группы однозначно и отдельно упоминает ангелов; перевод не должен устранять эту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской интонацией. Сохранены прямое обращение, трёхкратный корень «благослов-» и параллелизм исходного славословия; местоимения при обращении к Богу написаны с прописной буквы.
