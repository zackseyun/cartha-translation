lexical_decisions:
- source_word: ἐκέλευσεν
  choice: велел
  rationale: Аорист κελεύω выражает распоряжение. «Велел» естественно звучит в современном русском повествовании и сохраняет властный характер действия без излишней официальности.
- source_word: τοῖς οἰκέταις
  choice: слугам
  rationale: οἰκέτης обозначает домашнего слугу или раба. В данном повествовательном контексте «слугам» — краткий и естественный эквивалент, не уточняющий сверх текста их правовое положение.
- source_word: χῶσαι
  choice: засыпать
  rationale: χόω означает насыпать землю, покрывать или заполнять. В сочетании с τάφος русское «засыпать могилу» точно передаёт конкретное действие и не подразумевает погребения тела.
- source_word: τὸν τάφον
  choice: могилу
  rationale: τάφος может означать могилу или гробницу. Здесь речь идёт о заранее приготовленном месте погребения, которое следует засыпать, поэтому «могилу» наиболее естественно по-русски.
