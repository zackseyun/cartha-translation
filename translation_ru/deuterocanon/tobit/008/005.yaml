base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/005.yaml
  text: And Tobiah began to say[a], “Blessed are you, O God of our fathers, and blessed is your holy and glorious name forever; may the heavens and all your creation bless you.”
translation:
  language: ru
  text: 'И Товия начал говорить: «Благословен Ты, Бог наших отцов, и благословенно Твоё святое и славное имя вовеки! Да благословят Тебя небеса и все Твои творения[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё Твоё творение». Греческое выражение может широко обозначать всё сотворённое Богом, а не только живых существ.'
    reason: 'Лексическая неоднозначность κτίσεις: множественные «творения» или всё сотворённое в собирательном смысле.'
lexical_decisions:
- source_word: ἤρξατο Τωβίας λέγειν
  choice: И Товия начал говорить
  rationale: Сохраняет значение греческой конструкции ἄρχομαι с инфинитивом и ясно обозначает начало молитвы.
- source_word: Εὐλογητὸς εἶ
  choice: Благословен Ты
  rationale: Передаёт традиционную формулу благословения, обращённую к Богу, естественно и возвышенно по-русски.
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Бог наших отцов
  rationale: Точно сохраняет мужское родовое обозначение πατέρων и при этом использует естественный современный порядок слов.
- source_word: τὸ ὄνομά σου τὸ ἅγιον καὶ ἔνδοξον
  choice: Твоё святое и славное имя
  rationale: Передаёт оба определения без ослабления их смысла; «святое» и «славное» являются привычными библейскими соответствиями.
- source_word: εἰς τοὺς αἰῶνας
  choice: вовеки
  rationale: Кратко и точно передаёт устойчивое выражение неограниченной длительности, сохраняя молитвенный регистр.
- source_word: εὐλογησάτωσάν σε
  choice: Да благословят Тебя
  rationale: Русская конструкция с «да» естественно передаёт греческий императив в пожелательно-молитвенном значении.
- source_word: οἱ οὐρανοὶ
  choice: небеса
  rationale: Сохраняет множественное число греческого существительного и возвышенную образность космической хвалы.
- source_word: πᾶσαι αἱ κτίσεις σου
  choice: все Твои творения
  rationale: Сохраняет множественное число и широкий смысл κτίσεις, который может охватывать всё сотворённое; возможное собирательное прочтение отмечено в сноске.
theological_decisions:
- issue: Родовое обозначение в формуле обращения к Богу
  choice: Бог наших отцов
  alternative: Бог наших предков
  rationale: Греческое πατέρων прямо означает «отцов»; перевод не нейтрализует выражение и не добавляет к нему конфессионального толкования.
- issue: Объём понятия κτίσεις в космической хвале
  choice: все Твои творения
  alternative: всё Твоё творение
  rationale: Основной текст сохраняет греческое множественное число, а сноска отражает возможное широкое собирательное понимание, не ограничивая речь только живыми существами.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Формы «вовеки» и «да благословят» сохраняют достоинство библейской речи без избыточной архаизации; местоимения, относящиеся к Богу, написаны с прописной буквы.
