base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/006.yaml
  text: You made Adam[a], and you gave him Eve as a helper and support, his wife; from these came the seed of mankind. You said, ‘It is not good for the man to be alone[b]; let us make for him a helper like himself.’
translation:
  language: ru
  text: 'Ты сотворил Адама и дал ему Еву — помощницу и опору, его жену; от них произошло потомство людей[a]. Ты сказал: «Нехорошо человеку быть одному[b]; сотворим ему помощницу, подобную ему».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человеческий род». В греческом тексте буквально говорится о «семени людей», то есть о потомстве, происходящем от Адама и Евы.'
    reason: lexical_alternative
  - marker: b
    text: Ср. Бытие 2:18.
    reason: cross_reference
lexical_decisions:
- source_word: ἐποίησας
  choice: сотворил
  rationale: Передаёт обычное значение ποιέω в контексте рассказа о сотворении и звучит естественно для русской библейской молитвы.
- source_word: βοηθὸν Εὔαν στήριγμα τὴν γυναῖκα αὐτοῦ
  choice: Еву — помощницу и опору, его жену
  rationale: 'Сохраняет приложение: Ева названа помощницей, опорой и женой Адама. Тире и соединительный союз делают эту структуру ясной по-русски.'
- source_word: ἐκ τούτων
  choice: от них
  rationale: Естественно указывает на происхождение человеческого рода от только что названной пары.
- source_word: τὸ ἀνθρώπων σπέρμα
  choice: семя человеческого рода
  rationale: Сохраняет конкретный образ семени, потомства, выраженный словом σπέρμα, не сводя его к отвлечённому обозначению человечества.
- source_word: Οὐ καλὸν εἶναι τὸν ἄνθρωπον μόνον
  choice: Нехорошо человеку быть одному
  rationale: Близко следует греческому тексту, сохраняет отсылку к Быт 2:18 и естественно звучит на современном русском.
- source_word: ποιήσωμεν
  choice: создадим
  rationale: Передаёт побудительный оттенок греческого сослагательного наклонения первого лица множественного числа; форма сохраняет множественное число исходного высказывания.
- source_word: βοηθὸν ὅμοιον αὐτῷ
  choice: помощницу, подобную ему
  rationale: «Подобную ему» прямо передаёт ὅμοιον αὐτῷ, не усиливая его до «соответствующую ему»; женский род естественно соотносит ожидаемую помощницу с Евой в непосредственном контексте.
theological_decisions:
- issue: Смысл выражения τὸ ἀνθρώπων σπέρμα
  choice: семя человеческого рода
  alternative: человеческий род / потомство людей
  rationale: Выбранный вариант сохраняет генеалогический образ «семени» и одновременно ясно показывает, что речь идёт обо всём человечестве.
- issue: Отсылка к Быт 2:18
  choice: сохранить близкие к исходному тексту формулы «Нехорошо человеку быть одному» и «помощницу, подобную ему»
  alternative: передать смысл свободным современным пересказом
  rationale: Молитва намеренно воспроизводит рассказ о сотворении; узнаваемая формулировка сохраняет межтекстовую связь без привнесения деталей из еврейского текста.
- issue: Множественное число ποιήσωμεν
  choice: создадим
  alternative: создам
  rationale: Множественное число сохранено как в греческом свидетеле; его богословское объяснение переводом не навязывается.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис молитвы сохранён, но приложение к имени Евы оформлено ясно и естественно. Формулировки не привязаны к конфессиональному толкованию.
