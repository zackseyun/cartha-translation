lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: Выйдя
  rationale: 'Аористное причастие передаёт действие, предшествующее основному: она вышла, а затем сообщила. Деепричастие естественно и кратко воспроизводит греческую конструкцию.'
- source_word: ἀπήγγειλεν
  choice: сообщила
  rationale: Глагол ἀπαγγέλλω означает передать известие, сообщить. В данном повествовательном контексте «сообщила» звучит естественно и точно.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж местоимения обозначает адресатов сообщения и прямо передаётся русским «им».
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание сообщения и естественно передаётся союзом «что».
- source_word: ζῇ
  choice: он жив
  rationale: Форма настоящего времени ζάω буквально означает «живёт» или «жив». Русское «он жив» естественно выражает состояние и сохраняет настоящее время греческого текста; субъект восстанавливается из контекста.
theological_decisions: []
translation_notes:
