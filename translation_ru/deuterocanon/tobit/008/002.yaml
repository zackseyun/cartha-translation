lexical_decisions:
- source_word: πορευόμενος
  choice: войдя
  rationale: Причастие обозначает движение; ближайший контекст брачной комнаты позволяет естественно передать его как вход, не добавляя иных подробностей.
- source_word: ἐμνήσθη
  choice: вспомнил
  rationale: Прямой и естественный русский эквивалент, сохраняющий связь с прежним наставлением Рафаила.
- source_word: λόγων
  choice: слова
  rationale: Буквальный эквивалент, не устраняющий подразумеваемого из контекста значения наставления.
- source_word: τέφραν τῶν θυμιαμάτων
  choice: пепел от благовоний
  rationale: Передаёт остаток сожжённых благовоний ясным современным русским выражением.
- source_word: ἐπέθηκεν
  choice: положил на него
  rationale: Предлоговое значение глагола требует положения сверху; местоимение указывает на пепел и делает действие понятным по-русски.
- source_word: τὴν καρδίαν τοῦ ἰχθύος καὶ τὸ ἧπαρ
  choice: сердце и печень рыбы
  rationale: Сохраняет конкретные анатомические названия и естественно объединяет их принадлежность рыбе.
- source_word: ἐκάπνισεν
  choice: поджёг их, чтобы они дымились
  rationale: Передаёт каузативный смысл производства дыма и сам физический способ действия без внесения специальной ритуальной терминологии.
theological_decisions:
- issue: Соотношение краткой греческой редакции с более пространной семитской традицией в этой сцене
  choice: Переводить данное в греческом тексте действие, допуская контекстуальное значение входа для πορευόμενος.
  alternative: 'Передать неопределённее: «когда он шёл», либо гармонизировать стих с расширенной молитвенной сценой.'
  rationale: Греческий текст остаётся основным; контекст поддерживает вход в брачную комнату, но дополнительные материалы иной редакции в стих не вносятся.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Слово «благовония» выбрано как понятное обозначение ароматического вещества для сожжения; формулировка не придаёт действию более специального ритуального смысла, чем имеется в греческом.
