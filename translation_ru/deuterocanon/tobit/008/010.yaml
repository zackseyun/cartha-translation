  text: And Raguel got up[a], went and dug a grave, saying, “Perhaps he too may die.”
translation:
  language: ru
  text: 'И Рагуил встал, пошёл и выкопал могилу, говоря: «Как бы и этот не умер».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее по смыслу опасения: «не умер бы и этот». Рагуил боится, что Товия умрёт, как прежние женихи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: встал
  rationale: Аористное причастие вводит следующее действие в повествовательной последовательности; «встал» естественно и точно передаёт физическое движение.
- source_word: ἐπορεύθη
  choice: пошёл
  rationale: Глагол означает «пошёл, отправился». Направление наружу в греческом тексте прямо не выражено, поэтому оно не добавляется.
- source_word: ὤρυξεν
  choice: выкопал
  rationale: Передаёт буквальное выкапывание и естественно сочетается со словом «могила».
- source_word: τάφον
  choice: могилу
  rationale: В сочетании с «выкопал» это наиболее естественный современный эквивалент; «гробница» могла бы подразумевать сооружение.
- source_word: Μὴ καὶ
  choice: как бы и … не
  rationale: Русская конструкция естественно выражает тревожное опасение, заложенное в μή с сослагательным наклонением, а καί передано частицей «и».
- source_word: οὗτος
  choice: этот
  rationale: Указательное местоимение сохраняет сопоставление Товии с прежними женихами, не подменяя его более явным обозначением.
- source_word: ἀποθάνῃ
  choice: не умер
  rationale: В конструкции «как бы … не» прошедшая форма совершенного вида идиоматично передаёт опасение относительно возможного события, выраженного аористом конъюнктива.
