base_translation:
  language: en
  yaml_path: translation/deuterocanon/tobit/008/003.yaml
  text: But when the demon smelled the odor[a], it fled to the remotest parts of Egypt, and the angel bound it.
translation:
  language: ru
  text: Но когда демон почувствовал запах, он убежал в самые отдалённые области Египта[a], и ангел связал его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в самые верхние области Египта»; выражение также можно понимать как географическое обозначение: «в Верхний Египет».'
    reason: Альтернативные способы понимания неоднозначного выражения τὰ ἀνώτατα Αἰγύπτου.
lexical_decisions:
- source_word: ὠσφράνθη
  choice: почувствовал запах
  rationale: Аорист от ὀσφραίνομαι имеет здесь активное значение восприятия посредством обоняния; русское выражение естественно и точно.
- source_word: τὸ δαιμόνιον
  choice: демон
  rationale: В повествовании это личное враждебное духовное существо; «демон» прямо передаёт δαιμόνιον.
- source_word: τῆς ὀσμῆς
  choice: этот запах
  rationale: ὀσμή обозначает запах; указательное «этот» естественно связывает его с дымом от сожжённых частей рыбы в предыдущем контексте, не приписывая запаху приятности.
- source_word: ἔφυγεν
  choice: бежал
  rationale: Передаёт стремительное удаление под воздействием опасности и сохраняет повествовательную силу глагола.
- source_word: εἰς τὰ ἀνώτατα Αἰγύπτου
  choice: в самые верхние области Египта
  rationale: Относительно формально сохраняет суперлативное значение ἀνώτατα и не сводит неоднозначное выражение к однозначному географическому названию «Верхний Египет».
- source_word: ἔδησεν
  choice: связал
  rationale: Прямое соответствие δέω; не ослабляет действие до более общего «удержал».
- source_word: ὁ ἄγγελος
  choice: ангел
  rationale: Сохраняет определённое обозначение известного из контекста ангела, не добавляя здесь имени Рафаила.
theological_decisions:
- issue: Природа δαιμόνιον
  choice: личное враждебное духовное существо — «демон»
  alternative: «злой дух»
  rationale: Субъект ощущает запах, бежит и оказывается связан ангелом; «демон» сохраняет личностный и сверхъестественный характер повествования.
- issue: Географический смысл εἰς τὰ ἀνώτατα Αἰγύπτου
  choice: сохранить буквальное «в самые верхние области Египта»
  alternative: «в самые отдалённые области Египта» или «в Верхний Египет»
  rationale: Греческое выражение допускает пространственное и географическое понимание; основной текст не должен без необходимости устранять эту неоднозначность.
