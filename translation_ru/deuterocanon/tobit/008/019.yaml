  text: И он устроил для них свадебный пир, продолжавшийся четырнадцать дней[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И он устроил для них свадьбу, продолжавшуюся четырнадцать дней». Греческое γάμος может означать как саму свадьбу, так и свадебный пир или празднество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν
  choice: устроил
  rationale: В сочетании с γάμον глагол ποιέω имеет идиоматическое значение «устроить, отпраздновать»; «устроил» естественно передаёт действие организатора празднества.
- source_word: αὐτοῖς
  choice: для них
  rationale: Дательный падеж указывает на тех, в чью пользу было устроено празднество; из контекста ясно, что речь идёт о молодожёнах.
- source_word: γάμον
  choice: свадебный пир
  rationale: γάμος может обозначать как свадьбу, так и свадебный пир или празднество. Указанная продолжительность делает значение продолжительного свадебного празднества наиболее вероятным, однако неоднозначность отмечена в сноске.
- source_word: ἡμερῶν δέκα τεσσάρων
  choice: продолжавшийся четырнадцать дней
  rationale: Родительный падеж выражает длительность; причастный оборот ясно и естественно передаёт её по-русски.
