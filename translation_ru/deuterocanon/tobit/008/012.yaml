  text: And Edna said to his wife, “Send one of the servant girls, and let them see whether he is alive; but if not, so that we may bury him and no one may know.”
translation:
  language: ru
  text: 'Эдна сказал своей жене: «Пошли одну из служанок, и пусть они[a] посмотрят, жив ли он; если же нет, мы похороним его так, чтобы никто не узнал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте буквально: «пусть они посмотрят» — во множественном числе, хотя перед этим сказано: «одну из служанок». Перевод сохраняет эту особенность текста.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἀπόστειλον
  choice: Пошли
  rationale: Повелительная форма ἀποστέλλω передана естественным русским глаголом без излишней формальности.
- source_word: μίαν τῶν παιδισκῶν
  choice: одну из служанок
  rationale: παιδίσκη обозначает молодую женщину-прислугу; «служанка» ясно передаёт её домашнюю роль, не конкретизируя без необходимости правовой статус.
- source_word: ἰδέτωσαν
  choice: пусть они посмотрят
  rationale: В греческом тексте стоит повелительная форма третьего лица множественного числа. Перевод сохраняет это грамматическое несогласование с предшествующим «одну из служанок», а не исправляет его молча.
- source_word: εἰ ζῇ
  choice: жив ли он
  rationale: Краткая и естественная русская форма точно передаёт проверку того, остался ли человек в живых.
- source_word: ἵνα θάψωμεν αὐτόν
  choice: мы похороним его так, чтобы
  rationale: Целевая конструкция ἵνα с сослагательным наклонением передана в составе естественной русской фразы, связывающей погребение с намерением сохранить случившееся в тайне.
- source_word: μηδεὶς γνῷ
  choice: никто не узнал
  rationale: Сослагательная форма в целевом обороте естественно передаётся русским прошедшим временем после «чтобы» и сохраняет замысел скрыть случившееся.
