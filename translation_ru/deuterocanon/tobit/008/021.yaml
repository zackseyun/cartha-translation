lexical_decisions:
- source_word: καὶ τότε
  choice: а затем
  rationale: Передаёт последовательность действий естественным современным русским языком.
- source_word: λαβόντα τὸ ἥμισυ τῶν ὑπαρχόντων αὐτοῦ
  choice: взяв половину его имущества
  rationale: Аористное причастие выражает действие, предшествующее отправлению; ὑπάρχοντα здесь обозначает имущество или собственность.
- source_word: πορεύεσθαι μετὰ ὑγείας
  choice: отправиться в добром здравии
  rationale: Сохраняет значение движения и буквальный компонент здоровья и благополучия, не сводя выражение только к безопасности.
- source_word: πρὸς τὸν πατέρα
  choice: к твоему отцу
  rationale: В греческом притяжательное местоимение отсутствует, однако контекст прямого обращения указывает на отца собеседника; это уточнение отмечено сноской.
- source_word: τὰ λοιπά
  choice: остальное же
  rationale: Естественно обозначает оставшуюся часть имущества и сохраняет краткость греческой фразы.
- source_word: ὅταν ἀποθάνω καὶ ἡ γυνή μου
  choice: когда умрём мы с женой
  rationale: Передаёт сжатую греческую конструкцию как относящую смерть к обоим супругам, сохраняя первое лицо говорящего.
