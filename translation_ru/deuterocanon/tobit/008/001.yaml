translation:
  language: ru
  text: Когда они закончили ужин, Товию[a] ввели к ней.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя в греческом тексте — Τωβείας; в этом стихе оно стоит в форме Τωβείαν. Здесь оно передано традиционной русской формой «Товия». В некоторых переводах встречается форма «Тобиас».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по греческому тексту: «ввели Товию к ней». Позднее еврейское переложение арамейской рукописи излагает сцену подробнее: упоминает приготовление комнаты и постели, вход Товии и Сарры в комнату и закрытие двери.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: Когда
  rationale: Сочетание вводит следующее событие и одновременно указывает на время. В русском повествовании «когда» естественно передаёт временную связь; отдельное «и» не требуется.
- source_word: συνετέλεσαν δειπνοῦντες
  choice: закончили ужин
  rationale: Глагол συνετέλεσαν означает завершение действия, а причастие δειπνοῦντες — принятие основной вечерней трапезы. Выражение «закончили ужин» точно и естественно по-русски.
- source_word: εἰσήγαγον
  choice: ввели
  rationale: Форма означает «ввели» или «привели внутрь». Неопределённое множественное подлежащее греческого текста сохранено русской неопределённо-личной конструкцией.
- source_word: Τωβείαν
  choice: Товию
  rationale: 'Винительный падеж имени Τωβείας передан принятой в русской библейской традиции формой «Товия»: «Товию».'
- source_word: πρὸς αὐτήν
  choice: к ней
  rationale: Предлог πρός с винительным падежом здесь обозначает направление к Сарре. «К ней» сохраняет краткость и не добавляет отсутствующих в греческом тексте подробностей.
theological_decisions:
- issue: Форма имени Τωβείας
  choice: Товия
  alternative: Тобиас
  rationale: «Товия» ближе к семитской форме имени и уже укоренена в русской библейской традиции; латинизированная форма «Тобиас» не требуется.
- issue: Кто ввёл Товию
  choice: 'Субъект оставлен неопределённым: «ввели»'
  alternative: Назвать слуг или родственников
  rationale: Греческий текст не называет действующих лиц. Их конкретизация устранила бы сохранённую источником неопределённость.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и нейтрально-достоинственное. Неопределённое действующее лицо и лаконичность греческого текста сохранены.
