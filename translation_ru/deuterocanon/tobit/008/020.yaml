    rationale: Наречие ἐνόρκως естественнее передать личной формой «поклялся», не меняя того, что Рагуил связал своё распоряжение клятвой.
  - severity: low
    issue: «Уезжать» и «все» излишне конкретизируют текст.
    rationale: ἐξελθεῖν означает «уйти/выйти», а числительное с «днями» не требует добавления «все».
