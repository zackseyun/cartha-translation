lexical_decisions:
- source_word: πρὶν ἢ συντελεσθῆναι
  choice: прежде чем завершились
  rationale: Передаёт временное предшествование и идею полного окончания установленного периода естественным современным русским оборотом.
- source_word: τὰς ἡμέρας τοῦ γάμου
  choice: дни свадебного пира
  rationale: В контексте речь идёт не только о заключении брака, но о продолжающемся свадебном празднестве; «свадебный пир» ясно передаёт этот смысл.
- source_word: ἐνόρκως
  choice: под клятвой
  rationale: Наречие указывает, что Рагуил скрепил сказанное клятвой. Выражение сохраняет юридически и нравственно обязывающий оттенок исходного слова.
- source_word: μὴ ἐξελθεῖν αὐτόν
  choice: сказал ему не уезжать
  rationale: Инфинитив передаёт содержание настойчивого указания Рагуила; «уезжать» естественно в контексте предполагаемого отъезда Товии, хотя буквально глагол означает «выходить, уходить».
- source_word: ἐὰν μὴ πληρωθῶσιν
  choice: пока не завершатся
  rationale: Условная конструкция буквально означает «если не исполнятся»; русское «пока не завершатся» естественно выражает тот же предел запрета и сохраняет идею достижения полного срока.
- source_word: αἱ δέκα τέσσαρες ἡμέραι τοῦ γάμου
  choice: все четырнадцать дней свадебного пира
  rationale: Сохраняет явно названный четырнадцатидневный срок; «все» естественно подчёркивает полноту периода, выраженную глаголом πληρόω.
