  source_fidelity: В целом переданы временная рамка, запрет на уход и четырнадцатидневный срок. Однако «свадебный пир» сужает γάμος до трапезы, тогда как слово обозначает свадьбу/свадебное празднество в целом. Добавленное «все» не требуется греческим текстом.
  naturalness: «Под клятвой сказал ему не уезжать» понятно, но для современного литературного русского несколько тяжеловесно и не вполне естественно. «Поклялся ему, что тот не должен уходить» яснее передаёт связь ἐνόρκως с высказыванием Рагуила.
  terminology: «Свадьба» сохраняет более широкий и нейтральный смысл γάμος, не сводя его к пиру. «Уходить» ближе к ἐξελθεῖν, чем контекстуально конкретизированное «уезжать».
  issues:
