lexical_decisions:
- source_word: ἐκοιμήθησαν
  choice: проспали
  rationale: Аорист от κοιμάω здесь прямо обозначает сон. «Проспали» естественно сочетается с указанием продолжительности и передаёт действие на протяжении ночи.
- source_word: ἀμφότεροι
  choice: оба
  rationale: Слово прямо указывает на двоих и кратко сохраняет совместное отнесение действия к обоим.
- source_word: τὴν νύκτα
  choice: всю ночь
  rationale: Винительный продолжительности обозначает протяжённость во времени; по-русски это естественно передаётся выражением «всю ночь».
