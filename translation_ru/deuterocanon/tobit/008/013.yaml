lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохраняет обычную повествовательную связь и последовательность событий.
- source_word: εἰσῆλθεν
  choice: вошла
  rationale: Естественно и точно передаёт аорист εἰσέρχομαι, обозначающий движение внутрь.
- source_word: ἡ παιδίσκη
  choice: служанка
  rationale: Передаёт женский пол и зависимое служебное положение; в современном русском звучит естественнее, чем «девушка-служанка», и менее архаично, чем «рабыня» без контекстуальной необходимости.
- source_word: ἀνοίξασα
  choice: отворив
  rationale: Деепричастие совершенного вида естественно выражает действие, предшествующее основному глаголу, как аористное причастие в греческом.
- source_word: τὴν θύραν
  choice: дверь
  rationale: В бытовом контексте θύρα обычно означает дверь; «ворота» неоправданно изменило бы масштаб объекта.
