  yaml_path: translation/deuterocanon/2_maccabees/015/006.yaml
  text: And Nicanor[a], in complete confidence and with arrogant pride, had decided to make a public example of those with Judas.
translation:
  language: ru
  text: Никанор же, чувствуя себя в полной безопасности и надменно кичась, решил воздвигнуть на виду у всех памятник победе над Иудой и его сторонниками.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В предоставленной транскрипции стоит τρόπον — «способ, образ действия», что могло бы дать неясный смысл: «решил определить общую участь для тех, кто был с Иудой». Основной текст следует контекстуально ожидаемому чтению τρόπαιον — «памятник победы, трофей».'
    reason: textual_variant
lexical_decisions:
- source_word: μετὰ πάσης ἀσφαλείας
  choice: чувствуя себя в полной безопасности
  rationale: Оборот передаёт полную уверенность Никанора в собственной безопасности и успехе; такой перевод естественен по-русски и не сводит смысл к одной лишь физической охране.
- source_word: ὑψαυχενῶν
  choice: надменно кичась
  rationale: Причастие обозначает высокомерное, заносчивое самоутверждение. Выбор сохраняет явно отрицательную оценку автора.
- source_word: διεγνώκει
  choice: решил
  rationale: Плюсквамперфект указывает на уже принятое, твёрдое решение; в русском контексте это естественно передаётся прошедшим временем совершенного вида.
- source_word: κοινὸν … τρόπαιον
  choice: воздвигнуть на виду у всех памятник победе
  rationale: Чтение τρόπαιον означает победный трофей или памятник победе, а κοινόν указывает на его публичный характер. Развёрнутая русская формулировка передаёт смысл без неясного буквального «общий трофей».
- source_word: τῶν περὶ τὸν Ἰούδαν
  choice: над Иудой и его сторонниками
  rationale: Оборот обозначает Иуду вместе с окружающей его группой. «Сторонники» не ограничивает эту группу только военными и звучит естественно в данном контексте.
- source_word: συστήσασθαι
  choice: воздвигнуть
  rationale: В сочетании с τρόπαιον глагол означает установить или воздвигнуть памятник-трофей.
