  - marker: b
    text: 'Или: «злоречивца», «поносителя»; это слово может обозначать оскорбительную или злоречивую речь вообще, но в данном контексте уместен смысл хулы на святыню.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιδειξάμενος
  choice: показав
  rationale: Аористное причастие обозначает действие, предшествующее главному действию следующего стиха; деепричастие сохраняет связь с продолжающимся предложением.
- source_word: μιεροῦ
  choice: осквернённого
  rationale: Сильное религиозно-нравственное порицание; выбранный вариант сохраняет идею нечистоты и осквернения, не вводя отсутствующего в тексте прямого проклятия.
- source_word: δυσφήμου
  choice: хулителя
  rationale: Слово обозначает злоречивого, поносящего человека; в контексте угроз святыне «хулитель» естественно передаёт религиозный оттенок, не сужая значение до одной лишь словесной клеветы.
- source_word: ἐκτείνας
  choice: простёр
  rationale: Торжественно-нейтральный русский глагол уместен для враждебного жеста рукой и сохраняет образ исходного текста.
- source_word: ἐπὶ τὸν ἅγιον ... οἶκον
  choice: против святого дома
  rationale: В данном враждебном контексте ἐπί с винительным имеет направленно-противительное значение; «дом» сохраняет храмовую метафору оригинала.
- source_word: παντοκράτορος
  choice: Вседержителя
  rationale: Устоявшийся русский эквивалент божественного титула παντοκράτωρ, понятный в современном литературном и библейском регистре.
- source_word: ἐμεγαλαύχησεν
  choice: заносчиво похвалялся
  rationale: Глагол выражает хвастовство с оттенком надменности; наречие делает этот оттенок ясным и естественным по-русски.
theological_decisions:
- issue: Передача παντοκράτωρ как божественного титула
  choice: Вседержитель
  alternative: Всемогущий
  rationale: «Вседержитель» точнее сохраняет идею всеобъемлющего владычества и является устоявшимся русским библейским титулом; «Всемогущий» сильнее подчёркивает могущество.
- issue: Характер порицания Никанора в μιερός
  choice: осквернённый
  alternative: проклятый
  rationale: Выбранный вариант сохраняет культово-нравственную семантику загрязнения и не усиливает её до формулы прямого проклятия.
translation_notes:
  register: 'Современный литературный русский с умеренно библейской торжественностью. Сохранена незавершённость синтаксиса: стих представляет собой придаточно-причастную часть предложения, продолжающегося далее. Местоимение «тот» устраняет возможное ошибочное отнесение действий к Иуде и ясно указывает на Никанора.'
