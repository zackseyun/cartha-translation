  yaml_path: translation/deuterocanon/2_maccabees/015/001.yaml
  text: But Nicanor[a], having learned that those with Judas were in the regions of Samaria, resolved to attack them on the day of rest with complete security.
translation:
  language: ru
  text: Никанор же, узнав, что те, кто был с Иудой, находятся в местностях Самарии, решил напасть на них в день покоя[a], рассчитывая на полную безопасность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более конкретно: «в субботу»; буквально по-гречески: «в день покоя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλαβών
  choice: узнав
  rationale: В конструкции с винительным падежом и причастием глагол означает получение сведений или осведомление; «узнав» естественно передаёт это значение.
- source_word: τοὺς περὶ τὸν Ἰούδαν ὄντας
  choice: люди Иуды
  rationale: Оборот οἱ περὶ с именем обозначает людей, связанных с названным предводителем или сопровождающих его; «люди Иуды» кратко и естественно передаёт группу его сторонников.
- source_word: ἐν τοῖς κατὰ Σαμάρειαν τόποις
  choice: в пределах Самарии
  rationale: Оборот указывает на местность, относящуюся к Самарии, без обязательного указания на точное административное деление.
- source_word: ἐβουλεύσατο
  choice: решил
  rationale: Средний залог выражает обдумывание, приведшее к твёрдому намерению; «решил» ясно передаёт итог deliberation без стилистической тяжеловесности.
- source_word: τῇ τῆς καταπαύσεως ἡμέρᾳ
  choice: в день покоя
  rationale: Сохранено буквальное значение выражения «день покоя/прекращения трудов», поскольку здесь не употреблено обычное греческое слово σάββατον; вероятное указание на субботу отмечено в сноске.
- source_word: μετὰ πάσης ἀσφαλείας
  choice: будучи уверен, что это не представляет опасности
  rationale: Фраза выражает расчёт Никанора на полную безопасность нападения для него и его сил. Такая формулировка естественнее по-русски, чем буквальное «со всей безопасностью», и не создаёт ложного впечатления, будто речь идёт о безопасности жертв.
- source_word: ἐπιβαλεῖν
  choice: напасть
  rationale: В военном контексте инфинитив означает наброситься или совершить нападение; «напасть» прямо и идиоматично.
theological_decisions:
- issue: Отождествление «дня покоя»
  choice: В основном тексте сохранено «день покоя», а вероятное значение «суббота» указано в сноске.
  alternative: в субботу / в субботний день
  rationale: Греческий текст использует описательное выражение, а не обычное σάββατον. Буквальная передача сохраняет особенность источника и не делает подразумеваемое отождествление безоговорочным.
translation_notes:
  register: Современный литературный русский язык с повествовательной сдержанностью. Начальное «же» сохраняет связность греческого δέ. Неестественный буквализм «со всей безопасностью» заменён ясным выражением расчёта Никанора на отсутствие опасности.
