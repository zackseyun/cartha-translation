base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/012.yaml
  text: 'His vision was like this: Onias[a], who had become high priest, a noble and good man, modest in bearing, gentle in manner, and one who spoke fittingly, and who from childhood had cultivated all the proper qualities of virtue—this man was stretching out his hands and praying for the whole body of the Jews.'
translation:
  language: ru
  text: 'Видение его было таким: Ония, ставший первосвященником, человек благородный и добрый, скромный в обращении, кроткий нравом, говоривший как подобает и с детства развивавший в себе всё, что свойственно добродетели, — он, простерев руки, молился за всё сообщество иудеев.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за всю общность иудеев». Греческое слово представляет иудеев как единое целое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρία
  choice: видение
  rationale: В контексте сна это слово обозначает увиденную сцену, а не отвлечённое созерцание или внешнее зрелище.
- source_word: γενόμενον ἀρχιερέα
  choice: ставший первосвященником
  rationale: Передаёт буквальный смысл причастия γενόμενον («ставший»), не заменяя его толкованием «бывший первосвященник».
- source_word: καλὸν καὶ ἀγαθόν
  choice: благородный и добрый
  rationale: Сочетание характеризует нравственные достоинства человека; καλός здесь естественно передать как «благородный», а не как указание на внешнюю красоту.
- source_word: αἰδήμονα μὲν τὴν ἀπάντησιν
  choice: скромный в обращении
  rationale: Передаёт уважительную сдержанность во внешнем поведении, не сужая выражение до конкретной встречи или приветствия.
- source_word: πρᾶον δὲ τὸν τρόπον
  choice: кроткий нравом
  rationale: Сохраняет этическую характеристику πρᾶος и звучит естественно в русском литературном повествовании.
- source_word: λαλιάν προειμένον πρεπόντως
  choice: говоривший как подобает
  rationale: Трудное выражение описывает достойную, уместную речь; перевод сохраняет наречие πρεπόντως и не добавляет прямо не выраженного понятия красноречия.
- source_word: ἐκ παιδὸς ἐκμεμελετηκότα
  choice: с детства развивавший в себе
  rationale: Перфектное причастие указывает на длительное и усердное нравственное формирование, а не только на изучение добродетели.
- source_word: πάντα τὰ τῆς ἀρετῆς ἴδια
  choice: всё, что свойственно добродетели
  rationale: Формулировка близко передаёт значение «всего принадлежащего добродетели» и остаётся понятной современному читателю.
- source_word: κατεύχεσθαι
  choice: молился за
  rationale: Глагол обозначает молитву, направленную на благо других; предлог «за» ясно передаёт ходатайственный контекст без дальнейшего богословского расширения.
- source_word: τῷ παντὶ τῶν Ἰουδαίων συστήματι
  choice: за всё сообщество иудеев
  rationale: σύστημα обозначает объединённое целое или общность; «сообщество» сохраняет собирательный смысл без привнесения поздней институциональной терминологии.
theological_decisions:
- issue: Ония представлен в видении как молящийся за иудейский народ
  choice: Прямо перевести, что Ония простёр руки и молился за всё сообщество иудеев.
  alternative: Ослабить смысл до пожелания благополучия иудеям.
  rationale: κατεύχεσθαι ясно обозначает молитву. Перевод сохраняет представленное в повествовании ходатайство, не выводя из него дополнительных вероучительных заключений.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. Длинное описание сохранено, но упорядочено русским тире; лексика понятна широкому читателю и не окрашена конфессиональной терминологией.
