  text: and to keep the thirteenth day of the twelfth month—called Adar in the Syrian language—as a notable day[b][a], one day before Mordecai's day.
translation:
  language: ru
  text: и отмечать тринадцатый день двенадцатого месяца — называемого на местном языке Адаром[a] — как особый день, за один день до дня Мардохея.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение необычно; возможны также переводы: «на сирийском языке», «на общепринятом языке» или «на народном языке».'
    reason: lexical_alternative
  - marker: b
    text: То есть перед памятным днём, связанным с Мардохеем; вероятно, имеется в виду празднование Пурима.
    reason: cross_reference
lexical_decisions:
- source_word: ἔχειν
  choice: считать
  rationale: В сочетании с ἐπίσημον передаёт установление или признание дня как особо отмеченного; буквальное «иметь» по-русски здесь неестественно.
- source_word: ἐπίσημον
  choice: особым
  rationale: Передаёт значение «отмеченный, выделяющийся, примечательный», не превращая его без достаточного основания в официальный праздник.
- source_word: προκαδεκάτην
  choice: тринадцатый день
  rationale: Редкое составное порядковое числительное обозначает тринадцатый день, то есть день перед четырнадцатым.
- source_word: τοῦ δωδεκάτου μηνός
  choice: двенадцатого месяца
  rationale: Прямо передаёт родительный оборот, определяющий месяц.
- source_word: Ἀδὰρ
  choice: адаром
  rationale: Название месяца передано принятой русской транслитерацией и согласовано с конструкцией «называемого ...».
- source_word: τῇ κυριακῇ φωνῇ
  choice: на местном языке
  rationale: Греческое выражение необычно и допускает понимание как указание на обиходное или местное языковое название; перевод сохраняет эту функцию без спорного уточнения «сирийском» в основном тексте.
- source_word: πρὸ μιᾶς ἡμέρας
  choice: за день до
  rationale: Естественно по-русски передаёт временное отношение одного дня до следующей памятной даты.
- source_word: τῆς Μαρδοχαϊκῆς ἡμέρας
  choice: дня Мардохея
  rationale: Сохраняет буквальную связь прилагательного с Мардохеем, не вводя в основной текст отождествление с праздником Пурим.
theological_decisions:
- issue: Характер дня, обозначенного словом ἐπίσημον
  choice: особый памятный день
  alternative: праздничный день; официальный праздник
  rationale: Контекст предполагает календарное воспоминание, однако само прилагательное говорит прежде всего о выделенности дня и не требует более сильного литургического или правового смысла.
- issue: Значение τῇ κυριακῇ φωνῇ
  choice: «на местном языке» с примечанием о неясности
  alternative: «на сирийском языке»; «на общепринятом языке»; «на народном языке»
  rationale: Фраза в данном месте необычна. Основной текст передаёт вероятную функцию выражения, а примечание сохраняет подлинную лексическую неопределённость.
- issue: Соотношение «дня Мардохея» с Пуримом
  choice: не отождествлять прямо в основном тексте
  alternative: перевести как «за день до праздника Пурим»
  rationale: Аллюзия на Пурим весьма вероятна, но греческий текст называет именно «день Мардохея»; пояснение уместнее вынести в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис продолжает предшествующее высказывание, поэтому стих начинается со строчной буквы и союза «и». Необычность τῇ κυριακῇ φωνῇ отмечена в сноске, а вероятная связь с Пуримом не внесена в основной текст.
