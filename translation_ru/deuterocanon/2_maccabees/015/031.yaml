base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/031.yaml
  text: And when he arrived there[a], he called together his fellow countrymen and the priests, stood them before the altar, and sent for those from the citadel.
translation:
  language: ru
  text: Прибыв туда, он созвал своих соотечественников и священников, поставил их перед жертвенником и послал за людьми из крепости[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из Акры» — укреплённой цитадели в Иерусалиме.'
    reason: Сохраняет конкретное историко-географическое понимание слова ἄκρα наряду с его нарицательным значением «крепость».
lexical_decisions:
- source_word: παραγενόμενος
  choice: прибыв туда
  rationale: Аористное причастие обозначает действие, предшествующее основным глаголам; деепричастная конструкция естественно передаёт последовательность действий.
- source_word: συγκαλεσάμενος
  choice: созвал
  rationale: Глагол означает собрать людей, призвав их; «созвал» кратко и естественно передаёт значение совместного собрания.
- source_word: τοὺς ὁμοεθνεῖς
  choice: своих соотечественников
  rationale: ὁμοεθνής обозначает людей одного народа; перевод сохраняет этническую общность, не добавляя прямо отсутствующего в слове уточнения «иудеев».
- source_word: τοὺς ἱερεῖς
  choice: священников
  rationale: Прямой и естественный перевод существительного во множественном числе.
- source_word: πρὸ τοῦ θυσιαστηρίου στῆσας
  choice: поставил их перед жертвенником
  rationale: 'Аорист στῆσας здесь естественно понимать переходно: он поставил перед жертвенником ранее названных соотечественников и священников. Местоимение «их» ясно выражает подразумеваемое дополнение.'
- source_word: μετεπέμψατο
  choice: послал за
  rationale: Средняя форма означает распорядиться, чтобы кого-либо позвали или привели; русское «послал за» точно и идиоматично.
- source_word: τοὺς ἐκ τῆς ἄκρας
  choice: за теми, кто находился в крепости
  rationale: Оборот буквально указывает на людей «из крепости»; контекстуально речь идёт о находившихся там людях, которых велено привести. Исторически возможное понимание ἄκρα как названия Акры сохранено в примечании.
theological_decisions:
- issue: Значение ἄκρα в историческом контексте Иерусалима
  choice: крепость
  alternative: Акра
  rationale: В основном тексте употреблено понятное нарицательное обозначение, а конкретная историко-географическая идентификация как иерусалимской Акры сохранена в примечании; это не устраняет реальную лексическую возможность.
- issue: Переходность στῆσας и подразумеваемое дополнение
  choice: поставил их перед жертвенником
  alternative: встал перед жертвенником
  rationale: Форма ἵστημι в активном аористе обычно имеет переходное значение, а непосредственно предшествующие винительные формы дают естественное подразумеваемое дополнение. Поэтому перевод передаёт действие над собранными людьми, не превращая его в действие одного субъекта.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Жертвенник» выбран как привычный и точный культовый термин; синтаксис сделан ясным и плавным без архаизации.
