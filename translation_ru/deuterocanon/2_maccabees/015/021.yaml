base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/021.yaml
  text: When Maccabeus saw the presence of the crowds[a], the varied array of weapons, and the savagery of the beasts positioned advantageously, he stretched out his hands to heaven and called on the wonder-working Lord, knowing that victory is not secured by weapons, but that, whenever it is judged right by him[b], he grants it to those who are worthy.
translation:
  language: ru
  text: Увидев собравшиеся толпы, разнообразное вооружение и свирепость зверей[a], выгодно размещённых для боя, Маккавей простёр руки к небу и воззвал к Господу, творящему чудеса[b], зная, что победа достигается не оружием, но Господь, как рассудит, дарует её достойным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Судя по контексту, под «зверями», вероятно, подразумеваются боевые слоны, хотя в греческом тексте здесь сказано лишь «звери».
    reason: cultural_note
  - marker: b
    text: 'Или: «к чудотворному Господу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδών
  choice: увидев
  rationale: Передаёт восприятие Маккавеем всей обстановки на поле боя; простое современное слово не исключает оттенка осмысленного наблюдения.
- source_word: τὴν τῶν πλήθων παρουσίαν
  choice: собравшиеся толпы
  rationale: Естественно передаёт присутствие больших масс людей, не сводя выражение исключительно к их численности и не уточняя сверх текста, что это именно войска.
- source_word: τῶν ὅπλων τὴν ποικίλην παρασκευήν
  choice: разнообразное вооружение
  rationale: В сочетании с «оружием» παρασκευή обозначает оснащение или снаряжение; перевод передаёт видимое разнообразие боевой экипировки без тяжеловесного буквального оборота.
- source_word: θηρίων
  choice: зверей
  rationale: Греческое слово не называет конкретный вид животных. В контексте, вероятно, имеются в виду боевые слоны, однако это уточнение оставлено для сноски.
- source_word: ἐπὶ μέρος εὔκαιρον
  choice: выгодно размещённых для боя
  rationale: Передаёт смысл расположения животных на подходящем или тактически выгодном участке; слова «для боя» делают военный смысл выражения ясным.
- source_word: ἀγριότητα
  choice: свирепость
  rationale: Сохраняет значение опасной неукротимости зверей и звучит естественно в современном русском повествовании.
- source_word: ἀνατείνας χεῖρας εἰς τὸν οὐρανόν
  choice: простёр руки к небу
  rationale: Точно передаёт традиционный молитвенный жест и сохраняет достойный, слегка возвышенный библейский регистр.
- source_word: τερατοποιὸν
  choice: творящему чудеса
  rationale: Передаёт Господа как совершающего необычайные, чудесные дела. Оборот естественнее по-русски, чем редкое составное определение.
- source_word: κύριον
  choice: Господу
  rationale: В молитвенном контексте κύριος употреблено как божественный титул и передано традиционным словом «Господь».
- source_word: καθὼς δὲ ἐὰν αὐτῷ κριθῇ
  choice: как рассудит
  rationale: Сохраняет отсылку к свободному решению и суждению Господа, не превращая выражение ни в произвольное желание, ни в формализованный приговор.
- source_word: περιποιεῖται τὴν νίκην
  choice: дарует её
  rationale: В данном контексте глагол означает доставлять или обеспечивать победу кому-либо; «дарует» ясно выражает божественное действие и естественно сочетается с косвенным дополнением.
- source_word: τοῖς ἀξίοις
  choice: достойным
  rationale: Сохраняет оценочное значение исходного текста, не поясняя сверх него, в чём именно состоит достоинство и каким образом оно связано с победой.
theological_decisions:
- issue: Божественное действие и роль оружия в победе
  choice: Победа противопоставлена упованию на оружие и представлена как дар Господа по Его решению.
  alternative: Понять стих как абсолютное отрицание всякой роли человеческих военных средств или как утверждение, что достойные механически заслуживают победу.
  rationale: Греческий текст подчёркивает решающее действие Господа, однако сам по себе не развивает полного учения ни о бесполезности любых человеческих средств, ни о заслуге. Слово «достойным» поэтому сохранено без догматического истолкования.
- issue: Смысл τοῖς ἀξίοις
  choice: достойным
  alternative: заслужившим победу
  rationale: Исходное слово характеризует получателей как достойных, но не уточняет основание этой оценки. Более сильное «заслужившим» внесло бы дополнительное учение о заслуге.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «простёр» и «воззвал» сохраняют достоинство молитвенной сцены, оставаясь понятными широкому читателю. Синтаксис разгружен по сравнению с греческим периодом, но последовательность наблюдения, молитвы и исповедания сохранена.
