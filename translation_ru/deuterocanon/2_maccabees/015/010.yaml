  yaml_path: translation/deuterocanon/2_maccabees/015/010.yaml
  text: And after stirring up their spirits[a], he urged them on[b], at the same time pointing out the godlessness of the nations and the violation of oaths.
translation:
  language: ru
  text: И, пробудив в них решимость[a], он обратился к ним с призывом, одновременно указывая на безбожие народов[b] и нарушение клятв[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пробудив в них мужество (пыл)»; в этом контексте возможно также значение сильного гнева.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «язычников»; в данном контексте, вероятно, имеются в виду неиудейские народы.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально также возможно: «преступление клятв». Греческий текст прямо не уточняет, чьи это клятвы.'
    reason: ambiguity
lexical_decisions:
- source_word: τοῖς θυμοῖς διεγείρας αὐτούς
  choice: пробудив в них решимость
  rationale: В военном увещании θυμός обозначает внутренний пыл, мужество или решимость; этот вариант естественен по-русски и не сводит выражение исключительно к гневу.
- source_word: παρήγγειλεν
  choice: обратился к ним с призывом
  rationale: Глагол может означать приказ, наставление или настойчивое побуждение. В данном контексте формулировка сохраняет побудительную силу, не превращая речь однозначно в военный приказ.
- source_word: ἅμα παρειδείκνυς
  choice: одновременно указывая
  rationale: Передаёт одновременность сопутствующего действия и разъяснительный оттенок причастия.
- source_word: τὴν τῶν ἐθνῶν ἀθεσίαν
  choice: безбожие язычников
  rationale: ἀθεσία означает нечестие или безбожие, а ἔθνη в иудейском повествовательном контексте обозначает неиудейские народы. «Язычники» здесь понятно современному читателю, при этом вариант «народы» отмечен в сноске.
- source_word: τὴν τῶν ὅρκων παράβασιν
  choice: нарушение клятв
  rationale: παράβασις выражает нарушение или преступление установленной границы. Греческий текст не указывает прямо, чьи именно это клятвы, поэтому притяжательное местоимение не добавлено.
theological_decisions:
- issue: Передача ἐθνῶν
  choice: язычников
  alternative: народов / иноплеменников
  rationale: В контексте Второй книги Маккавейской речь идёт о неиудейских противниках. «Язычники» передаёт религиозно-этническое противопоставление, однако не исключает более буквального значения «народы», указанного в сноске.
- issue: Чья именно παράβασις τῶν ὅρκων
  choice: нарушение клятв без указания принадлежности
  alternative: нарушение ими своих клятв
  rationale: Родительный оборот τῶν ὅρκων называет объект нарушения, но грамматически не выражает притяжательности; перевод не делает подразумеваемого субъекта явным.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Синтаксис сохраняет последовательность и одновременность действий греческого текста; неоднозначности θυμός, ἔθνη и принадлежности клятв вынесены в краткие сноски.
