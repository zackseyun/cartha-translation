  - severity: low
    issue: Неопределённо-личные формы для размещения животных и конницы.
    rationale: «Разместили» и «расположили» возможны по-русски, но греческие ἀποκατασταθέντων и τεταγμένης являются пассивными причастиями; пассивная передача лучше сохраняет параллелизм описания построения.
