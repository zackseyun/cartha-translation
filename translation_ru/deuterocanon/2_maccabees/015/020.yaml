  rationale: Уточнено раздельное значение εὐκαίρως («надлежащим образом») и ἐπὶ μέρος («на отдельном участке»); для двух последующих военных диспозиций восстановлены пассивные конструкции, соответствующие греческому тексту. Основной выбор «предстоящего суда» и обе сноски сохранены, поскольку они не снимают присущую κρίσις неоднозначность.
