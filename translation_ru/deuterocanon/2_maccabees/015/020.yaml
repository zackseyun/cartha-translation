lexical_decisions:
- source_word: προσδοκώντων
  choice: ожидали
  rationale: Причастие обозначает напряжённое ожидание; современное русское «ожидали» естественно передаёт этот смысл.
- source_word: τὴν ἐσομένην κρίσιν
  choice: предстоящего суда
  rationale: κρίσις допускает значения «суд», «решение», «решающий исход»; «суд» сохраняет возвышенную тяжесть и возможный богословский оттенок, а неоднозначность отмечена в сноске.
- source_word: προσμιξάντων τῶν πολεμίων
  choice: враги уже вступили в бой
  rationale: В военном контексте глагол обозначает схождение и боевое столкновение; эта формулировка ясна и идиоматична.
- source_word: τῆς στρατιᾶς ἐκταγείσης
  choice: войско было выстроено
  rationale: Пассивное причастие указывает на построение войска в боевой порядок.
- source_word: τῶν θηρίων
  choice: зверей
  rationale: Сохранено широкое значение греческого слова; вероятное указание на боевых слонов вынесено в сноску.
- source_word: ἐπὶ μέρος
  choice: в подходящем месте
  rationale: В сочетании с εὐκαίρως и глаголом размещения передаёт выделенную подходящую позицию, не уточняя сверх текста конкретный участок строя.
- source_word: εὐκαίρως ἀποκατασταθέντων
  choice: разместили в подходящем месте
  rationale: Сочетание выражает надлежащее, тактически уместное размещение.
- source_word: τῆς δὲ ἵππου
  choice: конницу
  rationale: Собирательное военное употребление буквально «коня/конницы» естественно передаётся словом «конница».
- source_word: κατὰ κέρας τεταγμένης
  choice: расположили по флангам
  rationale: κέρας в военной речи означает крыло или фланг; «по флангам» ясно передаёт расположение конницы и допускает множественность крыльев.
theological_decisions:
- issue: Передача κρίσις в контексте предстоящего сражения
  choice: суд
  alternative: решение; решающий исход; кризис
  rationale: Непосредственно речь идёт о решающем исходе боя, однако «суд» входит в смысловой диапазон слова и сохраняет возможный богословский подтекст, не устраняя напряжение; иные прочтения указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Длинная последовательность обстоятельств сохранена как незавершённое вводное построение, продолжающееся в следующем стихе. Военная терминология ясна обычному читателю; подлинная многозначность κρίσις сохранена в основном тексте и сноске.
