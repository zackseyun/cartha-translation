  source_fidelity: 'Смысл в целом передан точно: продолжающееся увещание, страх перед вражеским натиском, прежняя небесная помощь и ожидаемая от Вседержителя победа сохранены. Однако «бывших с ним» двусмысленно: оно может быть понято как «ранее бывших с ним», тогда как греческое τοὺς σὺν αὐτῷ означает людей, находившихся при нём в описываемой ситуации. «Призывал» яснее передаёт παρεκάλει как обращённое к людям побуждение.'
