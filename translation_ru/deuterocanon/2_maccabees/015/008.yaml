base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/008.yaml
  text: And he urged those with him not to fear the attack of the nations, but to keep in mind the help that had previously come to them from heaven, and now to expect the victory that would come to them from the Almighty.
translation:
  language: ru
  text: Он призывал тех, кто был с ним, не робеть перед натиском язычников, но помнить о том, как прежде к ним приходила помощь с неба, и теперь ожидать победы, которая придёт к ним от Вседержителя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλει
  choice: убеждал
  rationale: Имперфект передаёт продолжавшееся настойчивое ободрение; «убеждал» естественно звучит по-русски и сохраняет побудительную силу глагола.
- source_word: τοὺς σὺν αὐτῷ
  choice: бывших с ним
  rationale: Кратко и близко к греческому обозначает людей Иуды, находившихся вместе с ним, без излишнего уточнения их статуса.
- source_word: μὴ δειλιᾷν
  choice: не робеть
  rationale: Глагол означает поддаваться страху, проявлять малодушие. «Не робеть» сохраняет военный и увещательный оттенок точнее, чем нейтральное «не бояться».
- source_word: τὴν τῶν ἐθνῶν ἔφοδον
  choice: перед натиском язычников
  rationale: ἔφοδος обозначает вражеское наступление или нападение; «натиск» передаёт силу военного движения. В данном иудейском контексте ἔθνη — окружающие неиудейские народы, поэтому уместно традиционное «язычники».
- source_word: ἔχοντας δὲ κατὰ νοῦν
  choice: но помнить
  rationale: Естественно передаёт требование держать в уме прежнюю помощь; противительный союз «но» сохраняет структуру мысли.
- source_word: τὰ προγεγονότα αὐτοῖς ἀπʼ οὐρανοῦ βοηθήματα
  choice: как прежде им приходила помощь с неба
  rationale: Передаёт предшествующие случаи небесной помощи идиоматично, не уточняя сверх текста, каким образом она была оказана.
- source_word: τὰ νῦν προσδοκᾷν
  choice: и теперь ожидать
  rationale: Сохраняет временное противопоставление прежней помощи и нынешнего уверенного ожидания.
- source_word: τὴν παρὰ τοῦ παντοκράτορος ἐσομένην αὐτοῖς νίκην
  choice: победы, которая придёт к ним от Вседержителя
  rationale: 'Будущая форма и предлог источника переданы прямо: победа ещё предстоит и исходит от Бога.'
theological_decisions:
- issue: Передача божественного титула παντοκράτωρ
  choice: Вседержитель
  alternative: Всемогущий
  rationale: «Вседержитель» — укоренившийся в русской библейской традиции титул, соответствующий греческому παντοκράτωρ и сохраняющий его титульное звучание. «Всемогущий» также возможен, но сильнее воспринимается как описание свойства.
- issue: Передача ἔθνη в иудейском военном контексте
  choice: язычники
  alternative: народы
  rationale: Здесь речь идёт о неиудейских противниках; «язычники» сохраняет контекстуальное противопоставление, тогда как «народы» может ошибочно восприниматься как все народы вообще.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан плавным и понятным; военная образность и связь прежней небесной помощи с ожидаемой победой сохранены.
