  text: And by encouraging them from the Law and the Prophets, and also by reminding them of the struggles they had already completed, he made them more eager.
translation:
  language: ru
  text: И, ободряя их Законом и Пророками и напоминая им об испытаниях, которые они уже прошли, он вселил в них ещё большую решимость.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραμυθούμενος
  choice: ободряя
  rationale: Причастие обозначает утешение и воодушевление; в военном контексте естественное русское соответствие — «ободряя».
- source_word: ἐκ τοῦ νόμου καὶ τῶν προφητῶν
  choice: словами из Закона и Пророков
  rationale: Предлог ἐκ указывает на источник ободрения; добавление «словами» естественно выражает подразумеваемый способ, сохраняя традиционные названия разделов Писания.
- source_word: τοὺς ἀγῶνας
  choice: о подвигах
  rationale: ἀγών может означать борьбу, состязание или тяжёлое испытание. «Подвиги» здесь передаёт уже совершённые ими мужественные ратные деяния без излишнего акцента на страдании.
- source_word: ἐκτετελεκότες
  choice: уже совершили
  rationale: Перфект от ἐκτελέω подчёркивает доведение прежних подвигов до конца; «совершили» сохраняет значение завершённого действия.
- source_word: προθυμοτέρους
  choice: ещё больше рвения
  rationale: Сравнительная форма означает, что они стали более готовыми и ревностными; идиоматическая конструкция с «ещё больше» ясно сохраняет сравнение.
- source_word: κατέστησεν
  choice: пробудил в них
  rationale: Буквально «сделал их» более ревностными; русская конструкция «пробудил в них… рвение» естественно передаёт причинное значение.
