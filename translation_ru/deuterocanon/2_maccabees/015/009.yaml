revisions:
- from: И, ободряя их словами из Закона и Пророков и напоминая им о подвигах, которые они уже совершили, он пробудил в них ещё больше рвения.
  to: И, ободряя их Законом и Пророками и напоминая им об испытаниях, которые они уже прошли, он вселил в них ещё большую решимость.
  rationale: Убрано необязательное добавление «словами» и заменены «подвиги» на более широкие «испытания», чтобы не сужать ἀγῶνες. Формулировка «которые они уже прошли» естественно передаёт завершённость перфекта ἐκτετελεκότες, а «ещё большую решимость» передаёт сравнительную степень προθυμοτέρους в военном увещевательном контексте.
