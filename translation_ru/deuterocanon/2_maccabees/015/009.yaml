    issue: «Подвиги» сужает значение τοὺς ἀγῶνας.
    rationale: ἀγῶνες может включать борьбу, тяготы и испытания; слово «подвиги» представляет их прежде всего как героические свершения, чего греческое слово само по себе не утверждает.
  - severity: low
    issue: «Словами из Закона и Пророков» добавляет способ выражения, не обозначенный в оригинале.
    rationale: 'Добавление не меняет основной смысл, но «Законом и Пророками» точнее сохраняет открытую связь ἐκ: источник или основание ободрения.'
  revised_text: И, ободряя их Законом и Пророками и напоминая им об испытаниях, которые они уже прошли, он вселил в них ещё большую решимость.
