lexical_decisions:
- source_word: τρισαλιτήριος
  choice: трижды проклятый
  rationale: Редкий резко бранный эпитет с усилительным τρις-. Передача сохраняет как троекратное усиление, так и оттенок проклятия.
- source_word: ἐπηρώτησεν
  choice: спросил
  rationale: Естественно передаёт введение враждебного вопроса; враждебность уже выражена эпитетом и контекстом.
- source_word: δυνάστης
  choice: властитель
  rationale: Обозначает носителя власти и господства; возвышенное, но не узкоконфессиональное слово, не подменяющее исходное понятие титулом «Господь».
- source_word: προστατάξας
  choice: повелевший
  rationale: Передаёт авторитетное распоряжение и согласуется с несколько возвышенным повествовательным регистром.
- source_word: ἄγειν
  choice: соблюдать
  rationale: В сочетании с обозначением дня означает отмечать или соблюдать установленный день; по-русски «соблюдать» звучит естественно и точно.
- source_word: τὴν τῶν σαββάτων ἡμέραν
  choice: день субботний
  rationale: Передаёт обычное значение всей греческой фразы — еженедельный субботний день — без неестественной буквальной множественности.
theological_decisions:
- issue: Определённость обозначения небесной власти
  choice: есть ли на небе властитель
  alternative: на небе ли Властитель, повелевший соблюдать день субботний
  rationale: Хотя δυνάστης употреблено с артиклем, греческий синтаксис допускает как вопрос о существовании некоего небесного властителя, так и более определённую отсылку к Богу Израиля. Основной текст сохраняет естественное неопределённое прочтение, а примечание фиксирует альтернативу.
