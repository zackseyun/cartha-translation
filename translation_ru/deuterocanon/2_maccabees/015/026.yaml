  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: οἱ περὶ τὸν Ἰούδαν — «люди Иуды» (естественная русская передача группы, связанной с Иудой), συνῆψαν — «вступили в бой», τοῖς πολεμίοις — «с врагами». Деепричастный оборот «взывая и молясь» естественно выражает сопутствующие действия, переданные греческим μετὰ ἐπικλήσεως καὶ εὐχῶν. Адресат взывания не добавлен в основной текст.'
