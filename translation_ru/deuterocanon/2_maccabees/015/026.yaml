  yaml_path: translation/deuterocanon/2_maccabees/015/026.yaml
  text: But those around Judas joined battle with the enemies with invocation and prayers[a][b].
translation:
  language: ru
  text: А люди Иуды вступили в бой с врагами, взывая и молясь[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призывая Бога и молясь». В греческом тексте буквально говорится о взывании, но в этой фразе не указано прямо, к кому взывали.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «молясь», может также означать принесение обетов; точное значение определяется контекстом.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ περὶ τὸν Ἰούδαν
  choice: люди Иуды
  rationale: Оборот περὶ с винительным обозначает людей, связанных с предводителем. «Люди Иуды» естественно звучит по-русски и не добавляет более узкой характеристики, чем допускает контекст.
- source_word: μετὰ ἐπικλήσεως
  choice: взывая
  rationale: ἐπίκλησις здесь обозначает религиозное взывание о помощи. Деепричастие естественно передаёт сопутствующее вступлению в бой действие, не называя прямо не указанного в этой фразе адресата.
- source_word: καὶ εὐχῶν
  choice: и молясь
  rationale: εὐχή может означать молитву или обет. В сочетании с ἐπίκλησις и непосредственно перед сражением значение молитвы наиболее вероятно; возможное значение «обеты» отмечено в сноске.
- source_word: συνῆψαν
  choice: вступили в бой
  rationale: В военном контексте συνάπτω означает сходиться с противником, вступать в сражение. Выбран современный и ясный русский оборот.
- source_word: τοῖς πολεμίοις
  choice: с врагами
  rationale: Дательный падеж обозначает противную сторону, с которой вступили в бой; русское управление «вступить в бой с» точно и естественно передаёт эту связь.
theological_decisions:
- issue: Религиозный смысл ἐπίκλησις в контексте сражения
  choice: Сохранить религиозный смысл посредством «взывая», не называя адресата.
  alternative: «призывая Бога» или более общее «обращаясь за помощью»
  rationale: Контекст подразумевает обращение за божественной помощью, однако в самой греческой фразе объект взывания не назван. Перевод сохраняет религиозную окраску и не делает подразумеваемое явным без сноски.
translation_notes:
  register: Современный литературный русский язык; повествовательный тон краткий и торжественный. Именная греческая конструкция «со взыванием и молитвами» передана естественными русскими деепричастиями, при этом смысловые неоднозначности сохранены в сносках.
