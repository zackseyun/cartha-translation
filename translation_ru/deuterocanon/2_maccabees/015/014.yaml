lexical_decisions:
- source_word: ἀποκριθέντα δὲ τὸν Ὀνίαν εἰπεῖν
  choice: Тогда Ония ответил
  rationale: Греческая конструкция с аористным причастием и инфинитивом вводит ответ Они́и. Краткая русская формулировка естественно передаёт повествовательную функцию оборота; «тогда» связывает реплику с предшествующим видением.
- source_word: φιλάδελφος
  choice: который любит своих братьев
  rationale: Прилагательное буквально обозначает любовь к братьям; в контексте речь идёт о братской любви Иеремии к соплеменникам. Развёрнутая конструкция звучит естественно по-русски и сохраняет семейную метафору.
- source_word: πολλὰ προσευχόμενος
  choice: много молится
  rationale: 'Настоящее причастие описывает продолжающееся или характерное действие, а πολλὰ усиливает его: Иеремия усердно и многократно молится.'
- source_word: περὶ τοῦ λαοῦ καὶ τῆς ἁγίας πόλεως
  choice: за народ и святой город
  rationale: В контексте молитвы περί естественно передаётся русским «за». Определённость понятна из контекста, а «святой город» прямо сохраняет ἁγία πόλις.
- source_word: Ἰερεμίας ὁ τοῦ θεοῦ προφήτης
  choice: Иеремия, пророк Божий
  rationale: Приложение передаёт отождествление Иеремии и сохраняет прямой смысл выражения «пророк Бога» в естественной русской библейской форме.
theological_decisions:
- issue: Значение φιλάδελφος в видении об Иеремии, молящемся за Израиль
  choice: который любит своих братьев
  alternative: братолюбивый; любящий братьев
  rationale: Перевод сохраняет образ родственной любви, не сводя его без пояснения к более общему «любит свой народ». При этом сноска сообщает буквальную форму и контекстуальный смысл, не предрешая богословские выводы об изображённом заступничестве.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён по нормам русского языка без утраты содержания; церковнославянизм «братолюбивый» вынесен в сноску.
