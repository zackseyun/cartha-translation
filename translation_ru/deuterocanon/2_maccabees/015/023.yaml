base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/023.yaml
  text: And now[a], O Sovereign of the heavens, send a good angel before us for fear and trembling.
translation:
  language: ru
  text: И ныне, Владыка небес, пошли благого ангела перед нами, чтобы вызвать страх и трепет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для страха и трепета». Греческий текст не уточняет, кого должны охватить страх и трепет, хотя контекст указывает на противников.'
    reason: Сохранение неоднозначности выражения εἰς δέος καὶ τρόμον и указание более формального варианта.
lexical_decisions:
- source_word: δυνάστα
  choice: Владыка
  rationale: Звательная форма обозначает обладающего властью правителя. «Владыка» естественно звучит в возвышенной молитвенной речи и передаёт верховную власть.
- source_word: τῶν οὐρανῶν
  choice: небес
  rationale: Форма «небес» сохраняет множественное число греческого выражения и привычна для современного русского библейского стиля.
- source_word: ἀπόστειλον
  choice: пошли
  rationale: Аористный императив выражает прямую молитвенную просьбу; «пошли» точно и естественно передаёт её.
- source_word: ἄγγελον ἀγαθὸν
  choice: благого ангела
  rationale: В данном контексте ἄγγελος означает ангельское существо. «Благого» сохраняет прямой смысл ἀγαθός и соответствует достоинству молитвенной речи.
- source_word: ἔμπροσθεν ἡμῶν
  choice: перед нами
  rationale: Выражение указывает, что ангел должен идти впереди молящихся; «перед нами» сохраняет пространственный образ без лишнего истолкования.
- source_word: εἰς δέος καὶ τρόμον
  choice: чтобы вызвать страх и трепет
  rationale: εἰς может обозначать цель или результат. Такой перевод естественен по-русски и передаёт предполагаемое воздействие, не называя прямо тех, кто должен испытать страх.
theological_decisions:
- issue: Кого должны охватить страх и трепет
  choice: Не называть объект страха; представить страх и трепет как результат послания ангела.
  alternative: 'Перевести формальнее: «для страха и трепета» или прямо уточнить: «чтобы устрашить врагов».'
  rationale: Военный контекст указывает прежде всего на противников, однако греческий текст прямо их не называет. Поэтому объект не добавлен, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Слова «Владыка» и «благого» поддерживают достоинство регистра, не делая текст архаичным.
