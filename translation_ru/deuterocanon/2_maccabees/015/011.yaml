base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/011.yaml
  text: And after arming each of them[a], not with the security of shields and spears so much as with encouragement from noble words, and after relating to them a trustworthy dream[b], he made them all rejoice.
translation:
  language: ru
  text: Вооружив каждого из них — не столько защитой, которую дают щиты и копья, сколько ободрением, заключённым в благородных словах,[a] — и рассказав им сон, достойный доверия,[b] он чрезвычайно их обрадовал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не столько безопасностью, которую дают щиты и копья, сколько ободрением, заключённым в благородных словах».'
    reason: Сохраняется возможная более буквальная передача ἀσφάλεια («безопасность») и ἐν («в», «заключённым в») при сравнительной конструкции.
  - marker: b
    text: 'Или: «достоверный сон». Греческое слово означает, что сон был достоин доверия.'
    reason: Указывается естественный лексический вариант без усиления утверждения о происхождении сна.
lexical_decisions:
- source_word: καθοπλίσας
  choice: вооружив
  rationale: 'Аористное причастие передаёт предшествующее действие и одновременно допускает переносный смысл: воинов укрепили не только оружием, но и словами.'
- source_word: οὐ τὴν ... ἀσφάλειαν, ὡς τὴν ... παράκλησιν
  choice: не столько надёжностью ... сколько ободрением
  rationale: Сравнительно-противительная конструкция естественно передаёт οὐ ... ὡς, не отрицая буквально наличия щитов и копий.
- source_word: ἀσπίδων καὶ λογχῶν
  choice: щитов и копий
  rationale: Прямые и общеупотребительные русские соответствия военным терминам.
- source_word: ἐν τοῖς ἀγαθοῖς λόγοις
  choice: которое давали благородные слова
  rationale: Передаёт связь ободрения со словами и сохраняет возвышенно-нравственный оттенок ἀγαθοῖς без буквального и неестественного «в добрых словах».
- source_word: προσηγησάμενος
  choice: рассказав им
  rationale: Передаёт повествовательное представление сна слушателям и уместную в контексте направленность действия на воинов.
- source_word: ὄνειρον ἀξιόπιστον
  choice: сон, достойный доверия
  rationale: Близко воспроизводит значение ἀξιόπιστον — «заслуживающий доверия» — и не добавляет утверждения о божественном происхождении сна.
- source_word: ὑπὲρ τὰ πάντα
  choice: чрезвычайно
  rationale: Фраза понята как наречное усиление степени вызванной радости; это точнее, чем превращать её в указание на всех участников.
- source_word: ηὔφραινεν
  choice: обрадовал
  rationale: 'Передаёт каузативное значение εὐφραίνω: он вызвал у них радость.'
theological_decisions:
- issue: Природа сна
  choice: сон, достойный доверия
  alternative: достоверный сон; боговдохновенный сон
  rationale: Греческий текст положительно оценивает сон как заслуживающий доверия, но в этом стихе прямо не называет его источник; перевод не вводит дополнительного богословского определения.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Причастная конструкция сохранена ради связи с контекстом, но расчленена тире для ясности. Формулировки понятны обычному читателю и не вносят конфессиональных уточнений.
