revisions:
- from: И он приказал отсечь голову Никанора и руку вместе с плечом[a] и отнести их в Иерусалим — он, всем телом и душой сражавшийся в первых рядах за сограждан и с юности хранивший доброжелательность к соплеменникам.
  to: И он приказал отсечь голову Никанора и руку вместе с плечом[a] и отнести их в Иерусалим — он, всем телом и душой сражавшийся в первых рядах за сограждан и сохранивший с юности доброе расположение к соплеменникам.
  rationale: Исправлена только сноска, чтобы она не выдавала за вариант значение, не поддержанное σὺν («вместе с»). Небольшая стилистико-семантическая правка «сохранивший с юности доброе расположение» точнее передаёт διαφυλάξας и εὔνοια. Остальная структура и смысл сохранены.
