base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/030.yaml
  text: And he ordered that the head of Nikanor[a], and the hand with the shoulder, be cut off and carried to Jerusalem—he who with his whole body and soul had fought in the forefront for the citizens, and who had preserved from youth his goodwill toward his fellow countrymen.
translation:
  language: ru
  text: И он приказал отсечь голову Никанора и руку вместе с плечом[a] и отнести их в Иерусалим — он, всем телом и душой сражавшийся в первых рядах за сограждан и сохранивший с юности доброе расположение к соплеменникам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «руку вместе с плечом». Греческое слово, обычно означающее «рука», в данном контексте, вероятно, обозначает всю отсечённую верхнюю конечность.'
    reason: Лексическая неоднозначность χείρ и необычное сочетание σὺν τῷ ὤμῳ требуют пояснения без добавления не выраженного в греческом значения «до плеча».
lexical_decisions:
- source_word: προσέταξεν
  choice: приказал
  rationale: Аорист προστάσσω обозначает властное распоряжение; «приказал» естественно и точно передаёт его силу.
- source_word: ὁ καθʼ ὅλον σώματι καὶ ψυχῇ πρωταγωνιστὴς
  choice: он, всем телом и душой сражавшийся в первых рядах
  rationale: Сохраняется образ полной самоотдачи — «телом и душой», а πρωταγωνιστής передаётся как участие в передовых рядах борьбы, без театрального оттенка современного слова «протагонист».
- source_word: ὑπὲρ τῶν πολιτῶν
  choice: за сограждан
  rationale: πολῖται имеет гражданско-общественный оттенок; «сограждане» естественнее русского «граждане» при обозначении тех, за кого он сражался.
- source_word: τὴν τῆς ἡλικίας εὔνοιαν
  choice: с юности ... доброжелательность
  rationale: В контексте τῆς ἡλικίας указывает на жизненную пору; «с юности» передаёт длительность расположения, а εὔνοια — устойчивое благожелательное отношение.
- source_word: ὁμοεθνεῖς
  choice: соплеменники
  rationale: Слово обозначает людей одного народа; «соплеменники» сохраняет этнонациональный смысл без сведения его только к государственному гражданству.
- source_word: διαφυλάξας
  choice: хранивший
  rationale: Глагол выражает бережное и продолжительное сохранение; причастие согласуется с ретроспективной характеристикой Иуды.
- source_word: ἀποτεμόντας
  choice: отсечь
  rationale: Причастие в конструкции после προσέταξεν передаёт содержание приказа; русский инфинитив естественно выражает приказанное действие.
- source_word: τὴν χεῖρα σὺν τῷ ὤμῳ
  choice: руку вместе с плечом
  rationale: χείρ буквально значит «кисть/рука», но в данном контексте обозначает отсечённую верхнюю конечность; «руку вместе с плечом» близко к греческой формулировке, а неоднозначность пояснена в сноске.
- source_word: περιφέρειν εἰς Ἰερουσαλήμ
  choice: отнести ... в Иерусалим
  rationale: При εἰς выражено направление к Иерусалиму. «Отнести» передаёт перенос отсечённых частей, не добавляя прямо не названного в тексте публичного шествия.
theological_decisions:
- issue: К кому относятся приложения ὁ ... ὁ
  choice: К подразумеваемому субъекту «он приказал», то есть к Иуде Маккавею
  alternative: Считать их более свободной авторской похвалой без явной синтаксической привязки
  rationale: Два субстантивированных оборота с ὁ естественно стоят в приложении к субъекту προσέταξεν; русское тире сохраняет эту связь, не вставляя имени, отсутствующего в стихе.
- issue: Передача σώματι καὶ ψυχῇ
  choice: телом и душой
  alternative: всем своим существом
  rationale: Буквенный образ выражает полную самоотдачу и сохраняет антропологическую лексику источника, не придавая ей более поздней догматической определённости.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис слегка приподнят, но остаётся ясным; приложение после тире сохраняет риторическую похвалу Иуде и порядок мысли греческого текста.
