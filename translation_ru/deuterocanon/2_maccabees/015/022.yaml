    text: 'Или: «царе Иуды». В греческом тексте стоит «Иудеи» (Ἰουδαίας), но исторически речь идёт о Езекии, царе Иудейского царства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ ἐπικαλούμενος
  choice: И он говорил, взывая к Нему
  rationale: Сохраняет отдельными несовершенный глагол речи и одновременное молитвенное взывание; прописная буква в местоимении указывает на Бога как адресата молитвы.
- source_word: τόνδε τὸν τρόπον
  choice: так
  rationale: Естественное русское введение прямой речи, точно передающее значение «таким образом».
- source_word: Σύ, δέσποτα
  choice: Ты, Владыка
  rationale: Начальное «Ты» сохраняет эмфазу явного греческого местоимения, а «Владыка» передаёт δέσποτα отдельно от обычного соответствия κύριος.
- source_word: ἀπέστειλας τὸν ἄγγελόν σου
  choice: послал Своего ангела
  rationale: Прямое и контекстуально ясное соответствие; здесь ἄγγελος означает небесного посланника.
- source_word: ἐπὶ Ἐζεκίου
  choice: при Езекии
  rationale: Предлог с родительным понимается как указание на историческое время Езекии; перевод не создаёт ошибочного впечатления, будто ангел был послан против него.
- source_word: τοῦ βασιλέως τῆς Ἰουδαίας
  choice: царе Иудеи[a]
  rationale: Основной текст сохраняет греческое географическое название Ἰουδαία; исторически речь идёт о царстве Иуда, что отмечено в сноске.
- source_word: ἀνεῖλεν
  choice: поразил
  rationale: Передаёт смертельное поражение без архаичного «истребил» или чрезмерно прямого «убил».
- source_word: ἐκ τῆς παρεμβολῆς Σενναχηρείμ
  choice: в стане Сеннахирима
  rationale: Хотя ἐκ буквально обозначает исходную группу или место, по-русски естественно указать место поражения; «стан» сохраняет возвышенный библейский регистр.
- source_word: εἰς ἑκατὸν ὀγδοήκοντα πέντε χιλιάδας
  choice: сто восемьдесят пять тысяч
  rationale: Идиоматически и точно передаёт итоговое число поражённых.
theological_decisions:
- issue: Различение δέσποτα и κύριος
  choice: Владыка
  alternative: Господь; Повелитель
  rationale: «Владыка» естественно выражает верховную власть и не стирает лексическое различие между δέσποτα и κύριος.
- issue: Направленность выражения ἐπὶ Ἐζεκίου
  choice: при Езекии
  alternative: против Езекии; к Езекии
  rationale: Историческая аллюзия говорит о спасительном вмешательстве Бога во время Езекии. Перевод «против Езекии» грамматически возможен при ином употреблении ἐπί, но противоречит роли ангела в упоминаемом событии.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной молитвенно-библейской лексикой. Синтаксис сохраняет торжественность обращения, оставаясь понятным; «стан» употреблено как общеизвестное библейское слово.
