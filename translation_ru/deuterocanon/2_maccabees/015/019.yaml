translation:
  language: ru
  text: Немалой была и тревога тех, кто был заперт в городе, поскольку их тревожила атака на открытой местности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «атака в открытом поле». Греческое выражение противопоставляет город открытому пространству за его пределами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατειλημμένοις
  choice: кто был заперт
  rationale: Совершенное страдательное причастие передаёт положение людей, оказавшихся замкнутыми в городе под давлением обстоятельств; «был заперт» сохраняет страдательный оттенок и естественно звучит по-русски.
- source_word: οὐ πάρεργος
  choice: немалой
  rationale: Буквально выражение означает «не второстепенная, не побочная»; применительно к тревоге русское «немалой» ясно передаёт усиление без буквальной тяжеловесности.
- source_word: ἀγωνία
  choice: тревога
  rationale: Слово обозначает напряжённое душевное беспокойство; «тревога» соответствует страху за исход предстоящего столкновения, не усиливая значение до «муки».
- source_word: ταρασσομένοις
  choice: их волновало
  rationale: Причастие описывает эмоциональное смятение горожан. Такая конструкция естественно выражает по-русски причину их тревоги.
- source_word: τῆς ἐν ὑπαίθρῳ προσβολῆς
  choice: нападение под открытым небом
  rationale: προσβολή имеет военное значение «нападение, атака», а ἐν ὑπαίθρῳ обозначает открытое пространство вне города; буквальный образ сохранён, а возможный смысл «в открытом поле» указан в примечании.
