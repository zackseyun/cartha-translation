lexical_decisions:
- source_word: Λάβε
  choice: Возьми
  rationale: Аористный императив от λαμβάνω передаёт прямое повеление; «возьми» естественно и сохраняет его решительность. Возможное «прими» звучало бы мягче.
- source_word: τὴν ἁγίαν ῥομφαίαν
  choice: святой меч
  rationale: ῥομφαία обозначает крупный меч или клинок, но в данном контексте естественное русское соответствие — «меч»; ἁγίαν прямо передано словом «святой».
- source_word: δῶρον παρὰ τοῦ θεοῦ
  choice: дар от Бога
  rationale: δῶρον поясняет, чем является меч, а παρά с родительным указывает на источник. Конструкция с тире естественно выражает приложение, не добавляя идеи способа принятия.
- source_word: δι' ἧς
  choice: которым
  rationale: Относительное местоимение относится к мечу и выражает орудие действия; творительный падеж естественно передаёт этот смысл по-русски.
- source_word: θραύσεις
  choice: ты сокрушишь
  rationale: Будущее время θραύω означает сильное разрушительное действие. «Сокрушишь» сохраняет образность и возвышенный воинский регистр.
- source_word: τοὺς ὑπεναντίους
  choice: противников
  rationale: ὑπεναντίους обозначает тех, кто противостоит или враждует. «Противников» точно передаёт значение, не усиливая его без необходимости до «врагов».
theological_decisions:
- issue: Передача ἁγίαν как характеристики данного Богом оружия
  choice: святой
  alternative: священный
  rationale: «Святой» прозрачно передаёт ἁγίαν и связь меча с Богом, не сужая смысл до преимущественно культового употребления слова «священный».
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Тире выделяют приложение «дар от Бога» и помогают избежать двусмысленного понимания, будто меч следует взять определённым способом — «как дар».
