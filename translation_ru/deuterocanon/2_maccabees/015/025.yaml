lexical_decisions:
- source_word: Οἱ δὲ περὶ τὸν Νικάνορα
  choice: А Никанор и его люди
  rationale: Греческий оборот οἱ περὶ с винительным обозначает людей, окружающих или сопровождающих предводителя. По-русски «Никанор и его люди» естественно передаёт всю группу, не уточняя её военную структуру.
- source_word: σαλπίγγων
  choice: под звуки труб
  rationale: После μετά родительный указывает на сопровождение. Выражение «под звуки труб» естественно для русского повествования и не навязывает более узкого значения современного военного инструмента.
- source_word: παιάνων
  choice: боевые песни
  rationale: παιάν может обозначать пеан — торжественную либо воинскую песнь. «Боевые песни» понятно передаёт значение в данном военном контексте, а сноска сохраняет более точный термин и смысловой диапазон.
- source_word: προσῆγον
  choice: наступали
  rationale: В контексте приближающегося сражения глагол означает движение навстречу противнику; «наступали» естественно передаёт его направленный военный смысл.
