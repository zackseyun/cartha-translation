  text: For the concern about wives and children[a], and further about brothers and relatives, weighed less with them[b], but the greatest and first fear was for the consecrated temple.
translation:
  language: ru
  text: Забота о жёнах и детях, а также о братьях и родственниках, имела для них меньшее значение[a]; величайшим же и первостепенным был страх за освящённый храм[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «занимала у них меньше места». Греческое выражение буквально означает, что эта забота «занимала меньшую долю», то есть стояла не на первом месте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тревога» или «беспокойство». Греческое слово φόβος в данном контексте может обозначать как страх, так и тревожную заботу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ περὶ γυναικῶν καὶ τέκνων
  choice: забота о жёнах и детях
  rationale: Субстантивированная конструкция с περὶ и родительным падежом обозначает заботу или тревогу о членах семьи. «Забота о» естественно звучит по-русски и соответствует контексту.
- source_word: ἔτι δὲ ἀδελφῶν καὶ συγγενῶν
  choice: а также о братьях и родных
  rationale: ἔτι δέ добавляет следующую группу, а συγγενεῖς обозначает родственников. «Родные» здесь естественнее для современного русского повествования, чем «сородичи» или «родственники».
- source_word: ἐν ἥττονι μέρει κείμενος αὐτοῖς
  choice: занимала у них меньшее место
  rationale: Перевод сохраняет образ греческой идиомы — буквально «лежала в меньшей части» — и передаёт более низкую степень приоритетности, не утверждая отсутствия семейной заботы.
- source_word: μέγιστος δὲ καὶ πρῶτος
  choice: самым же сильным и главным
  rationale: μέγιστος указывает на наибольшую силу, а πρῶτος — на первенство по значимости. Такая пара естественна по-русски и сохраняет двойное усиление оригинала.
- source_word: ὁ περὶ τοῦ καθηγιασμένου ναοῦ φόβος
  choice: страх за освящённый храм
  rationale: φόβος сохранено как «страх», хотя контекст допускает оттенок тревоги; καθηγιασμένου — совершенное причастие, указывающее на храм, посвящённый и освящённый для священного служения.
theological_decisions:
- issue: Значение φόβος в военно-религиозном контексте
  choice: страх за освящённый храм
  alternative: тревога за освящённый храм; беспокойство об освящённом храме
  rationale: «Страх» ближе всего к прямому значению φόβος и сохраняет эмоциональную силу текста. Сноска отмечает допустимый контекстуальный оттенок тревожной заботы, не устраняя неоднозначность.
- issue: Передача καθηγιασμένου ναοῦ
  choice: освящённый храм
  alternative: святой храм; посвящённый храм
  rationale: Причастие καθηγιασμένου выражает не только качество святости, но и состояние после освящения или посвящения. «Освящённый храм» сохраняет этот глагольный и культовый оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет противопоставление семейной заботы и первостепенного страха за храм; архаизмы и конфессионально окрашенные уточнения не используются.
