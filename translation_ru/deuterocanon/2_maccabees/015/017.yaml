base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/017.yaml
  text: And having been encouraged by the very noble words of Judas[a], which were able to stir them on to virtue and to make the souls of young men manly, they resolved not merely to make a campaign, but to press on bravely and, engaging with all courage, settle the matter[d][c][b], because the city and the holy things and the temple were also in danger.
translation:
  language: ru
  text: Воодушевлённые прекрасными словами Иуды, способными побуждать к доблести[a] и делать мужественными души юношей[b], они решили не просто выступить в поход, но храбро идти вперёд и, вступив в бой со всей отвагой, решить исход дела[c], потому что опасность угрожала и городу, и святыням, и храму[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. ἀρετή может означать нравственную добродетель, превосходство или, в военном контексте, доблесть.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «делать мужественными души юношей». Греческий текст сохраняет явно мужскую образность мужества.'
    reason: lexical_alternative
  - marker: c
    text: Смысл не в том, что они решили не воевать, а в том, что они решили не ограничиваться одним лишь походом, но довести сражение до решающего исхода.
    reason: alternative_reading
  - marker: d
    text: В греческом тексте «святыни» и «храм» обозначены разными словами, поэтому здесь сохранены оба понятия.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακληθέντες
  choice: Воодушевлённые
  rationale: В военном контексте передаёт укрепляющее и побуждающее действие речи Иуды; «утешенные» здесь неуместно, а «увещеваемые» звучало бы уже и менее естественно.
- source_word: πάνυ καλοῖς
  choice: прекрасными
  rationale: Передаёт высокую нравственную оценку слов, сохраняя достоинство речи без чрезмерно специального оттенка.
- source_word: δυναμένοις ἐπ' ἀρετὴν παρορμῆσαι
  choice: способными побуждать к доблести
  rationale: «Доблесть» в данном военно-нравственном контексте сохраняет одновременно этическую и героическую окраску ἀρετή.
- source_word: ψυχὰς νέων ἐπανδρῶσαι
  choice: делать мужественными души юношей
  rationale: Сохраняет явную мужскую образность греческого текста и упоминание душ, оставаясь понятным по-русски.
- source_word: διέγνωσαν μὴ στρατεύεσθαι
  choice: решили не просто выступить в поход
  rationale: Негативная конструкция в контрасте с дальнейшими инфинитивами означает не отказ от войны, а решение не ограничиваться обычным походом.
- source_word: γενναίως δὲ ἐφέρεσθαι
  choice: но храбро идти вперёд
  rationale: Передаёт активное продвижение и мужество, подразумеваемые контекстом.
- source_word: μετὰ πάσης εὐανδρείας ἐμπλακέντες
  choice: вступив в бой со всей отвагой
  rationale: Военный смысл ἐμπλακέντες выражен явно, а εὐανδρεία естественно передана словом «отвага»; мужская риторическая окраска уже сохранена в предыдущей фразе.
- source_word: κρῖναι τὰ πράγματα
  choice: решить исход дела
  rationale: Передаёт намерение довести столкновение до решающего результата, а не просто вынести суждение.
- source_word: τὴν πόλιν καὶ τὰ ἅγια καὶ τὸ ἱερὸν
  choice: городу, и святыням, и храму
  rationale: Сохраняет различие между τὰ ἅγια и τὸ ἱερόν, не объединяя святыни с храмом.
- source_word: κινδυνεύειν
  choice: опасность угрожала
  rationale: Естественно выражает состояние под угрозой и причинную связь с принятым решением.
theological_decisions:
- issue: Мужская воинская образность в ψυχὰς νέων ἐπανδρῶσαι и εὐανδρείας
  choice: Сохранить в основном тексте «делать мужественными души юношей».
  alternative: «вселять мужество в молодых» или «ободрять молодых»
  rationale: Греческий текст намеренно использует мужскую лексику; полная нейтрализация устранила бы заметную риторическую черту. При этом повторять её неестественной конструкцией при εὐανδρεία необязательно.
- issue: Значение μὴ στρατεύεσθαι
  choice: «не просто выступить в поход»
  alternative: «не выступать в поход»
  rationale: Буквальное понимание простого отрицания противоречило бы ближайшему контексту, где герои намерены смело вступить в решающий бой; здесь выражен контраст между одним лишь походом и решительным столкновением.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным повествовательным регистром. Военная решимость выражена энергично; буквальные семитизирующие или неестественные обороты сглажены без устранения исходной мужской образности и различия между святынями и храмом.
