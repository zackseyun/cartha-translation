  source_fidelity: Перевод точно передаёт греческий текст. «Да будут повергнуты в ужас» удачно воспроизводит пожелательное повеление καταπλαγήτωσαν и его страдательно-каузативный оттенок; «величием Твоей руки» сохраняет и дательный μεγέθει, и конкретный библейский образ βραχίων. Оборот «те, кто с хулой выступает против Твоего святого народа» передаёт враждебное направленное приближение ἐπὶ τὸν ἅγιον σου λαόν, не уточняя предмет хулы. «На этом он закончил» естественно и верно передаёт заключительную формулу καὶ οὕτως μὲν ἐν τούτοις ἔληξεν, хотя несколько компактнее исходного выражения.
