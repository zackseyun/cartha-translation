  text: Let those who come against your holy people with blasphemy be struck with terror by the greatness of your arm[c][b][a]. And thus he ended in these words.
translation:
  language: ru
  text: Да будут повергнуты в ужас[a] величием Твоей руки[b] те, кто с хулой выступает против Твоего святого народа. На этом он закончил.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «да ужаснутся»; греческий глагол выражает страх и сильное потрясение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «величием Твоей руки». Рука Бога — библейский образ Его силы в действии.'
    reason: cultural_note
  - marker: c
    text: 'Или: «Так он закончил этими словами»; греческое выражение отсылает к только что сказанному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγέθει
  choice: величием
  rationale: Творительный падеж естественно передаёт значение средства или причины при страдательной конструкции и сохраняет прямое значение греческого слова.
- source_word: βραχίονός σου
  choice: Твоей руки
  rationale: Сохранён конкретный библейский образ руки Бога как проявления Его действующей силы; толкование «могущества» не подставлено в основной текст.
- source_word: καταπλαγήτωσαν
  choice: да будут повергнуты в ужас
  rationale: Формулировка сохраняет повелительное пожелание, страдательный оттенок и выраженное глаголом сильное потрясение страхом.
- source_word: οἱ μετὰ βλασφημίας παραγινόμενοι
  choice: те, кто с хулой выступает
  rationale: «Выступает» естественно обозначает враждебное приближение в данном контексте, а «с хулой» передаёт обстоятельственный оборот μετὰ βλασφημίας без уточнения объекта хулы.
- source_word: ἐπὶ τὸν ἅγιον σου λαόν
  choice: против Твоего святого народа
  rationale: При обозначении враждебного движения ἐπί с винительным передано как «против»; «святой народ» прямо сохраняет греческий образ.
- source_word: καὶ οὕτως μὲν ἐν τούτοις ἔληξεν
  choice: На этом он закончил
  rationale: Краткая современная формулировка естественно передаёт завершение на только что произнесённых словах, не добавляя отсутствующего в греческом уточнения о молитве или речи.
theological_decisions:
- issue: Образ «Твоей руки» в обращении к Богу
  choice: Сохранить буквальный образ «Твоей руки»
  alternative: Передать смысл как «Твоим могуществом»
  rationale: Образ руки Бога имеет устойчивые библейские связи и выражает Его силу в действии; его сохранение не требует конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным оборотом «да будут»; синтаксис остаётся ясным для широкого читателя. Местоимение «Твоей» написано с прописной буквы как принятая русская форма почтительного обращения к Богу.
