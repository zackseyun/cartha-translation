base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/027.yaml
  text: And while fighting with their hands[a], they were praying in their hearts to God, and they struck down no fewer than thirty-five thousand and four hundred[b], having been greatly gladdened by the care of God.
translation:
  language: ru
  text: Сражаясь руками, а сердцами молясь Богу, они повергли не менее тридцати пяти тысяч четырёхсот[a] человек, весьма обрадовавшись благодаря Божьей заботе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально греческое числовое выражение передаёт «три мириады, пять тысяч и четыреста», то есть 35 400. В данном свидетельстве слова, относящиеся к пяти тысячам, переданы в сжатой или нерегулярной форме, однако итоговое число достаточно ясно.
    reason: textual_variant
  - marker: b
    text: 'Или: «весьма ободрившись благодаря Божьему промыслительному попечению». Более буквально греческий текст говорит о «заботе Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῖς μὲν χερσὶν ἀγωνιζόμενοι
  choice: сражаясь руками
  rationale: ἀγωνίζομαι в контексте битвы означает участие в борьбе или сражении. Формулировка сохраняет противопоставление внешнего действия руками внутренней молитве сердцами.
- source_word: ταῖς δὲ καρδίαις πρὸς τὸν θεὸν εὐχόμενοι
  choice: молясь сердцами Богу
  rationale: Дательный καρδίαις указывает на внутреннюю сферу или средство молитвы. Необычная, но ясная формулировка сохраняет параллелизм «руками — сердцами» и не сводит выражение просто к безмолвной молитве.
- source_word: κατέστρωσαν
  choice: повергли
  rationale: В военном контексте глагол означает уложить, сразить или повергнуть противника. «Повергли» звучит естественно и сохраняет силу исходного образа.
- source_word: οὐδὲν ἧττον
  choice: не менее
  rationale: Устойчивое выражение подчёркивает минимальное число; «не менее» точно и естественно передаёт этот смысл.
- source_word: μυριάδων πένθων καὶ τετρακισχιλίων
  choice: тридцати пяти тысяч четырёхсот
  rationale: Предполагаемый итог греческого числового выражения — 35 400, хотя переданная форма сжата и нерегулярна. Число дано в обычной современной записи словами, а текстовая особенность отмечена в сноске.
- source_word: τῇ τοῦ θεοῦ μεγάλως ἐφρανθέντες ἐπιμελείᾳ
  choice: исполнившись великой радости благодаря Божьей заботе
  rationale: ἐπιμέλεια прямо означает заботу, попечение или внимание, а ἐφρανθέντες — состояние радости. Перевод сохраняет причинную связь и не подменяет простое понятие заботы более техническим богословским термином «промысл».
theological_decisions:
- issue: Передача τοῦ θεοῦ ἐπιμελείᾳ как «Божьей заботе» или как «Божьему промыслу»
  choice: Божьей заботе
  alternative: Божьему промыслительному попечению / Божьему промыслу
  rationale: ἐπιμέλεια прежде всего обозначает заботу, внимание и попечение. Идея промысла уместна как контекстуальное истолкование, но более прямой перевод сохраняет формулировку текста и не усиливает её до специального богословского термина.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным звучанием. Сохранён риторический параллелизм «руками — сердцами», а числовая и лексико-богословская неоднозначность вынесена в краткие сноски.
