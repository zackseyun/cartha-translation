  text: But once they were relieved of the pressure, and as they withdrew with joy[c][b][a], they recognized Nikanor fallen forward with his armor.
translation:
  language: ru
  text: Освободившись же от настоятельной нужды и с радостью уходя[a], они узнали Никанора, павшего[b] в полном вооружении[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отправляясь с радостью»; глагол может обозначать уход или отбытие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «упавшего вперёд», «павшего наземь» или «лежавшего поверженным»; приставка может передавать движение вперёд, но точное положение тела не уточняется.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «со всем вооружением»; слово может обозначать полный комплект доспехов и боевого снаряжения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γεγυμνωμένοι ἀπὸ τῆς χρείας
  choice: освободившись от настоятельной нужды
  rationale: Буквально оборот говорит о том, что они были «обнажены/избавлены от нужды». В контексте завершившейся битвы это означает освобождение от давившей на них необходимости; «настоятельная нужда» сохраняет значение χρεία и не сужает его до конкретно названной опасности.
- source_word: μετὰ χαρᾶς ἀναλύοντες
  choice: с радостью уходя
  rationale: ἀναλύω обозначает уход или отбытие; нейтральное «уходя» естественно по-русски и не вносит неподтверждённого значения «возвращаясь» либо специально военного «отступая».
- source_word: ἐπέγνωσαν
  choice: узнали
  rationale: 'ἐπιγινώσκω здесь означает опознать человека: в павшем они узнали Никанора.'
- source_word: προπεπτωκότα
  choice: павшего ничком
  rationale: Совершенный причастный оборот описывает Никанора уже лежащим после падения; «ничком» естественно передаёт направленность вперёд, выраженную προ-, хотя возможен и менее конкретный смысл «павшего».
- source_word: σὺν τῇ πανοπλίᾳ
  choice: во всём вооружении
  rationale: πανοπλία означает полный комплект доспехов или боевого снаряжения. «Во всём вооружении» сохраняет идею полноты и естественно сочетается с описанием павшего воина.
