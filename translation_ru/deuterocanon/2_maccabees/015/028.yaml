revisions:
- from: Освободившись же от настоятельной нужды и с радостью уходя[a], они узнали Никанора, павшего ничком во всём вооружении[b].
  to: Освободившись же от настоятельной нужды и с радостью уходя[a], они узнали Никанора, павшего[b] в полном вооружении[c].
  rationale: Убрано «ничком», поскольку оно добавляет не выраженную надёжно деталь о положении тела. Основное «павшего» сохраняет смысл совершенного причастия, а примечание честно передаёт возможный направительный оттенок προ-. «В полном вооружении» естественно передаёт σὺν τῇ πανοπλίᾳ и сохраняет значение полноты комплекта.
