    issue: «Павшего ничком»
    rationale: «Ничком» означает лежать лицом вниз и тем самым добавляет конкретную деталь положения тела. Префикс προ- в προπεπτωκότα может выражать движение вперёд, но не требует такого вывода; следует сохранить неоднозначность.
  - severity: low
    issue: Примечания не отражают неопределённость προπεπτωκότα
    rationale: После снятия избыточно конкретного «ничком» полезно дать вариант «упавшего вперёд», чтобы не утратить возможный оттенок προ- и одновременно не выдавать его за несомненный.
