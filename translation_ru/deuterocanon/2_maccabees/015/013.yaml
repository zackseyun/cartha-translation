  yaml_path: translation/deuterocanon/2_maccabees/015/013.yaml
  text: Then in this way there appeared a man distinguished by his gray hair and glory[b][a], and the majesty surrounding him was in some way marvelous and most splendid.
translation:
  language: ru
  text: Затем явился мужчина, выделявшийся седыми волосами и славой[a]; окружавшее его величие было дивным и необычайно великолепным[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мужчина, превосходивший других седыми волосами и славой». В греческом описании использован сжатый причастный оборот.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «превосходство вокруг него». Здесь это выражение передано как «окружавшее его величие», то есть заметное величие его облика и присутствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶθ᾽ οὕτως
  choice: Затем так
  rationale: Передаёт одновременно последовательность видения и образ появления, не добавляя отсутствующих в греческом тексте пояснений.
- source_word: ἐπιφανῆναι
  choice: явился
  rationale: В контексте передаваемого видения аористный инфинитив обозначает появление зримой фигуры; «явился» естественно передаёт это, не придавая глаголу дополнительного богословского смысла.
- source_word: ἄνδρα
  choice: муж
  rationale: «Муж» сохраняет обозначение взрослого мужчины и соответствует возвышенному библейскому регистру; более нейтральное «человек» ослабило бы это значение.
- source_word: πολιᾷ
  choice: сединами
  rationale: Существительное обозначает седые или белые волосы как признак возраста и достоинства. Творительный падеж естественно сочетается с «отличавшийся».
- source_word: δόξῃ
  choice: славой
  rationale: «Слава» сохраняет широкий библейский диапазон значения — честь, достоинство и зримое великолепие — без преждевременного сужения до одного оттенка.
- source_word: διαφέροντα
  choice: отличавшийся
  rationale: Причастие указывает, что муж заметно выделялся названными качествами. Формулировка сохраняет сжатое построение греческого текста.
- source_word: θαυμαστὴν
  choice: дивным
  rationale: Передаёт вызывающее изумление качество и поддерживает возвышенный, но понятный современному читателю тон.
- source_word: μεγαλοπρεπεστάτην
  choice: в высшей степени величественным
  rationale: Передаёт усиленную превосходную степень прилагательного, выражающего великолепие и величавость.
- source_word: τὴν περὶ αὐτὸν ὑπεροχήν
  choice: окружавшее его величие
  rationale: Выражает связанную с фигурой и словно окружающую её исключительную возвышенность; буквальное «превосходство вокруг него» по-русски неестественно.
theological_decisions:
- issue: Природа фигуры в видении
  choice: Фигура описана просто как явившийся величественный муж, без её отождествления в самом стихе.
  alternative: Прямо назвать его небесным или прославленным существом либо перенести в стих его отождествление из ближайшего контекста.
  rationale: Греческий текст данного стиха описывает появление, седины, славу и величие фигуры, но здесь её не называет. Перевод сохраняет эту сдержанность и неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Слова «муж», «седины», «слава» и «дивный» поддерживают достоинство сцены, оставаясь понятными обычному читателю. Синтаксис следует греческой последовательности, но приспособлен к естественной русской речи.
