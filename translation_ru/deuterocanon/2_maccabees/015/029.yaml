  yaml_path: translation/deuterocanon/2_maccabees/015/029.yaml
  text: And when a cry and turmoil arose[b][a], they blessed the Sovereign in their ancestral language.
translation:
  language: ru
  text: Когда раздался крик и началось смятение, они благословляли Властителя[a] на языке своих предков[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Могущественного»; или: «Правителя». Греческое слово обозначает того, кто обладает силой или властью.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отеческим голосом»; вероятно, имеется в виду их родной, унаследованный от предков язык.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένης
  choice: когда поднялся… и началось
  rationale: Аористное причастие в родительном самостоятельном обороте передаёт временное обстоятельство. Раздельные глаголы позволяют естественно по-русски отнести действие к обоим существительным.
- source_word: κραυγῆς
  choice: крик
  rationale: Сохраняет единственное число и значение громкого возгласа, не уточняя без достаточных оснований, был ли это боевой клич или иной крик.
- source_word: ταραχῆς
  choice: смятение
  rationale: Передаёт возбуждение, замешательство и беспорядок в напряжённой обстановке.
- source_word: εὐλόγουν
  choice: благословляли
  rationale: Имперфект передан глаголом несовершенного вида; «благословляли» сохраняет религиозную окраску εὐλογέω и не сводит его к общему «восхваляли».
- source_word: τὸν δυνάστην
  choice: Властителя
  rationale: δυνάστης обозначает обладающего властью или могуществом. «Властитель» звучит как почтительный титул и сохраняет сочетание власти и силы, не подменяя его иным божественным именованием.
- source_word: τῇ πατρίῳ φωνῇ
  choice: на языке своих предков
  rationale: Дательный падеж указывает на способ или средство; φωνή здесь естественно понимать как речь или язык, а πατρίῳ — как унаследованный от предков. Формулировка ясна современному русскому читателю.
theological_decisions:
- issue: Передача божественного титула τὸν δυνάστην
  choice: Властителя
  alternative: Могущественного; Правителя
  rationale: Контекст указывает на Бога, однако сам греческий титул подчёркивает обладание властью и силой. «Властитель» сохраняет это содержание, не заменяя исходный титул более привычным, но лексически иным именованием вроде «Господь».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан естественным для русского повествования; вид глагола сохраняет длительный оттенок имперфекта. Прописная буква в слове «Властитель» показывает, что в контексте это титул Бога.
