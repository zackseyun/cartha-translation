base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/034.yaml
  text: And they all blessed the manifest Lord toward heaven[a], saying, “Blessed is the one who has kept his own place undefiled.”
translation:
  language: ru
  text: 'А все они, обратившись к небу, благословили явившегося Господа, говоря: «Благословен Тот, кто сохранил Своё место[a] неосквернённым».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своё святилище»; возможно также: «Свой храм». В греческом тексте буквально сказано «место», но по контексту, вероятно, имеется в виду святое место, сохранённое от осквернения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸν οὐρανόν
  choice: обратившись к небу
  rationale: Оборот с εἰς и винительным выражает направленность действия к небу. Русская формулировка естественно передаёт эту направленность, не превращая её в указание на местонахождение Господа.
- source_word: εὐλόγησαν / Εὐλογητός
  choice: благословили / Благословен
  rationale: Сохранён повтор однокоренных слов, значимый для построения греческой фразы; религиозное употребление εὐλογέω естественно передаётся глаголом «благословлять».
- source_word: τὸν ἐπιφανῆ κύριον
  choice: явившего Себя Господа
  rationale: ἐπιφανής обозначает того, кто стал явным, обнаружил себя в действии. Такая передача звучит естественно по-русски и не сводит смысл к внешнему великолепию.
- source_word: διατηρήσας
  choice: сохранил
  rationale: Причастие указывает на сохранение места в должном, неосквернённом состоянии; «сохранил» точно и естественно передаёт этот смысл.
- source_word: τὸν ἑαυτοῦ τόπον
  choice: Своё место
  rationale: τόπος буквально означает «место». Хотя контекст, вероятно, указывает на святилище или храм, основной текст сохраняет более широкое значение исходного слова.
- source_word: ἀμίαντον
  choice: неосквернённым
  rationale: Слово передаёт культовую чистоту и отсутствие осквернения; «неосквернённым» особенно уместно в вероятном храмовом контексте.
theological_decisions:
- issue: Следует ли прямо назвать τὸν ἑαυτοῦ τόπον святилищем или храмом
  choice: В основном тексте оставить «Своё место»
  alternative: «Своё святилище» или «Свой храм»
  rationale: Контекст убедительно указывает на святое место, сохранённое от осквернения, однако в греческом стоит общее τόπος, а не более определённое ναός или ἱερόν. Более узкое понимание отмечено в сноске, но не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Заглавные буквы в «Себя», «Тот» и «Своё» обозначают соотнесённость с Господом; архаизмы и конфессионально окрашенные уточнения не вводятся.
