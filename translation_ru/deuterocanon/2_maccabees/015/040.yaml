  yaml_path: translation/deuterocanon/2_maccabees/015/040.yaml
  text: For just as drinking wine by itself[a], and then again water, is unpleasant, but wine mixed with water becomes pleasing and produces delight, so also the style of the composition delights the ears of those who read the work. Here, then, will be the end.
translation:
  language: ru
  text: Ведь как пить одно лишь вино, так и одну лишь воду неприятно[a], но вино, смешанное с водой, становится приятным и доставляет удовольствие; так и построение повествования услаждает слух тех, кто читает это сочинение. На этом будет конец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вода, в свою очередь, враждебна». По смыслу сравнения и вино само по себе, и вода сама по себе менее приятны, чем их надлежащая смесь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: Ведь как
  rationale: Передаёт сравнительную конструкцию и её пояснительную связь с заключением автора.
- source_word: οἶνον κατὰ μόνας πίνειν
  choice: пить одно только вино
  rationale: κατὰ μόνας означает «само по себе, отдельно»; формулировка естественна по-русски и не добавляет отсутствующего в тексте определения «неразбавленное».
- source_word: ὕδωρ πάλιν πολέμιον
  choice: а с другой стороны — воду, неприятно
  rationale: πάλιν обозначает второй, соответствующий случай, а πολέμιον буквально значит «враждебно»; в контексте питья речь идёт о неприятности каждого напитка по отдельности.
- source_word: συγκερασθεὶς
  choice: смешанное
  rationale: Прямо передаёт смешивание вина с водой.
- source_word: ἐπιτερπῇ τὴν χάριν ἀποτελεῖ
  choice: становится приятным и доставляет удовольствие
  rationale: Сохраняет двойной оттенок приятности и доставляемого наслаждения, не утяжеляя русскую фразу.
- source_word: τὸ τῆς κατασκευῆς τοῦ λόγου
  choice: искусное построение повествования
  rationale: κατασκευή указывает на литературное построение и отделку, а λόγος здесь — изложение или повествование; «искусное» передаёт положительно оценённую литературную обработку.
- source_word: τέρπει τὰς ἀκοὰς
  choice: услаждает слух
  rationale: Сохраняет слуховой образ греческого выражения и соответствует dignified literary Russian.
- source_word: τῶν ἐντυγχανόντων τῇ συντάξει
  choice: тех, кто читает это сочинение
  rationale: ἐντυγχάνω применительно к тексту означает читать или знакомиться с ним, а σύνταξις здесь обозначает составленное произведение.
- source_word: Ἐνταῦθα δὲ ἔσται ἡ τελευτή
  choice: На этом и будет конец
  rationale: Естественно и лаконично передаёт формальную заключительную формулу и оттенок δέ.
