    text: 'Или: «заслуженную кару за его безумие». Греческое выражение τὰ ἐπίχειρα может означать воздаяние — то, что человек получает за свои дела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσαν
  choice: язык
  rationale: Физическое действие ἐκτεμών требует телесного значения слова, а не переносного «речь» или «язык общения».
- source_word: δυσσεβοῦς
  choice: нечестивого
  rationale: Слово обозначает непочтительность к Богу; «нечестивый» сохраняет религиозно-нравственный смысл и уместно в современном литературном русском.
- source_word: ἐκτεμών
  choice: вырезав
  rationale: Аористное причастие обозначает действие, предшествующее ἔφη, и подразумевает удаление языка.
- source_word: ἔφη
  choice: он сказал, что будет
  rationale: Последующие инфинитивы передают заявленное намерение; такая конструкция естественна по-русски.
- source_word: μετὰ μέρος
  choice: по кускам
  rationale: Оборот указывает на разделение на части; в данном контексте это ясно и естественно.
- source_word: τοῖς ὄρνεσιν
  choice: птицам
  rationale: Дательный падеж передаёт получателя того, что намеревались бросить.
- source_word: τὰ δʼ ἐπίχειρα
  choice: воздаяние
  rationale: Выражение обозначает получаемое в ответ за дела, здесь — карающее возмездие; «воздаяние» сохраняет широту значения без чрезмерного уточнения.
- source_word: τῆς ἀνοίας
  choice: за его безумие
  rationale: ἀνοία может означать безрассудство, глупость или безумие; в контексте дерзкого поведения «безумие» передаёт нравственно окрашенное отсутствие разума.
- source_word: κατέναντι τοῦ ναοῦ
  choice: напротив храма
  rationale: κατέναντι обозначает положение напротив или перед чем-либо; «напротив» сохраняет пространственную неоднозначность без уточнения точного места.
- source_word: κρεμιάσαι
  choice: повесит
  rationale: Инфинитив обозначает намерение подвесить предмет для публичного обозрения; русский глагол передаёт это прямо и естественно.
theological_decisions:
- issue: Религиозно-нравственная характеристика Никанора в δυσσεβοῦς
  choice: нечестивого
  alternative: безбожного
  rationale: «Нечестивый» обозначает непочтительность к Богу, не утверждая непременно отрицание Его существования, которое могло бы подразумеваться словом «безбожный».
- issue: Смысл τὰ ἐπίχειρα как результата поступков
  choice: воздаяние
  alternative: заслуженная кара
  rationale: «Воздаяние» сохраняет образ ответного возмещения и не сужает выражение исключительно до юридического наказания, хотя в контексте оно явно носит карательный характер.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис передаёт последовательность греческого текста, а местоимение «его» после «по кускам» проясняет, что речь идёт о языке. Лексическая неоднозначность τὰ ἐπίχειρα сохранена в основном тексте и пояснена сноской.
