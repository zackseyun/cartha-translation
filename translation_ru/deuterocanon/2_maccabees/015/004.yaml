lexical_decisions:
- source_word: ἀποφηναμένων
  choice: они заявили
  rationale: Причастие вводит торжественный и твёрдый ответ; «заявили» передаёт его публичную, категоричную силу естественным современным русским языком.
- source_word: Ἔστιν ὁ κύριος ζῶν
  choice: Жив Господь!
  rationale: Устойчивая русская библейская формула сохраняет исповедальный и близкий к клятвенному характер греческого выражения.
- source_word: δυνάστης
  choice: Владыка
  rationale: Слово обозначает обладающего властью; «Владыка» уместно передаёт верховную небесную власть Бога, сохраняя возвышенный, но понятный регистр.
- source_word: κελεύσας
  choice: повелевший
  rationale: Передаёт властный и обязательный характер данного Богом установления.
- source_word: ἀσκεῖν
  choice: соблюдать
  rationale: В данном сочетании глагол означает практическое исполнение религиозного установления; «соблюдать» естественно сочетается с обозначением священного дня.
- source_word: τὴν ἑβδόμαδα
  choice: седьмой день
  rationale: Сохраняет буквальную форму греческого выражения, тогда как подразумеваемое значение субботы поясняется в сноске.
theological_decisions:
- issue: Передача относящегося к субботе выражения τὴν ἑβδόμαδα
  choice: седьмой день
  alternative: субботу
  rationale: Греческий текст употребляет выражение «седьмой [день]», а не обычное слово «суббота». Основной текст сохраняет эту форму, не устраняя значимую лексическую особенность; контекстуальное значение указано в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Восклицание «Жив Господь!» сохраняет силу исповедальной формулы, а «Владыка» передаёт δυνάστης без архаичного или конфессионально узкого оттенка.
