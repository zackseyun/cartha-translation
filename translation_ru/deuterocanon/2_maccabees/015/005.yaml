base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/005.yaml
  text: But the other said[a], “I also am a ruler upon the earth[b], the one who commands men to take up arms and to carry out the king’s business.” Yet he did not prevail to accomplish his savage purpose.
translation:
  language: ru
  text: 'Другой же сказал: «И я — властитель на земле; я приказываю браться за оружие[a] и выполнять царские поручения». Однако ему не удалось осуществить свой жестокий замысел[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднимать (или брать) оружие»; выражение означает вооружаться или выступать на войну.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные варианты: «злодейский замысел», «чудовищное намерение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνάστης
  choice: властитель
  rationale: Слово обозначает человека, обладающего властью. «Властитель» сохраняет оттенок могущества, не приписывая говорящему прямо титул царя.
- source_word: προστατάσσων
  choice: я приказываю
  rationale: Причастие выражает властное распоряжение; личная форма естественно продолжает самохарактеристику говорящего по-русски.
- source_word: αἴρειν τὰ ὅπλα
  choice: браться за оружие
  rationale: Естественное русское выражение для вступления в вооружённую борьбу, соответствующее буквальному «поднимать/брать оружие».
- source_word: τὰς βασιλικὰς χρείας ἐπιτελεῖν
  choice: выполнять царские поручения
  rationale: Передаёт исполнение дел и обязанностей, относящихся к царю, не сужая выражение до конкретной административной функции.
- source_word: ὅμως
  choice: однако
  rationale: Ясно выражает сильное противопоставление между притязанием говорящего на власть и его последующей неудачей.
- source_word: οὐ κατέσχεν ἐπιτελέσαι
  choice: ему не удалось осуществить
  rationale: В данном контексте сочетание означает, что он не сумел довести намерение до исполнения; русская формулировка передаёт результат без лишнего уточнения причины.
- source_word: σχέτλιον
  choice: жестокий
  rationale: Прилагательное содержит сильную отрицательную оценку — жестокий, злодейский, чудовищный; «жестокий» понятно и уместно в современном литературном русском.
- source_word: βούλημα
  choice: замысел
  rationale: Обозначает сознательное намерение или решение; «замысел» естественно сочетается с отрицательной характеристикой и не конкретизирует не названные в тексте детали.
theological_decisions:
- issue: Самоопределение говорящего как земного обладателя власти в контексте видения
  choice: «И я — властитель на земле» без дополнительного отождествления говорящего
  alternative: «И я — царь на земле» или «И я обладаю властью на земле»
  rationale: Греческий текст передаёт притязание говорящего, но не называет его царём и не требует от перевода богословского отождествления. Сдержанная формулировка сохраняет повествовательное и богословское напряжение.
translation_notes:
  register: Современный литературный русский с достоинством историко-религиозного повествования. Синтаксис прямой речи сделан естественным, а притязание на власть передано без архаизации и без добавочного толкования.
