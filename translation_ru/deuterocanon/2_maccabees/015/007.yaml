lexical_decisions:
- source_word: ἀδιαλείπτως πεποιθώς
  choice: неизменно верил
  rationale: Передаёт длительную, непрерывную уверенность, выраженную наречием и перфектным причастием, естественным современным русским языком.
- source_word: μετὰ πάσης ἐλπίδος
  choice: со всей надеждой
  rationale: Сохраняет необычную полноту выражения πάσης, не сводя его лишь к наречию «твёрдо».
- source_word: ἀντιλήμψεως
  choice: помощь
  rationale: В данном контексте означает поддержку или содействие; «помощь» ясно и точно передаёт смысл.
- source_word: τεύξεσθαι παρὰ τοῦ κυρίου
  choice: что получит помощь от Господа
  rationale: Передаёт будущий инфинитив τεύξεσθαι и источник помощи, обозначенный конструкцией παρά с родительным падежом.
theological_decisions:
- issue: Характер ожидания Божьей помощи
  choice: верил и со всей надеждой ожидал
  alternative: был уверен, что непременно получит
  rationale: Формулировка сохраняет одновременно доверие и надежду исходного текста, не превращая их в утверждение о механически гарантированном исходе.
translation_notes:
  register: Современный литературный русский язык; повествовательный тон с умеренной торжественностью. Союз «же» сохраняет контраст с предыдущим контекстом.
