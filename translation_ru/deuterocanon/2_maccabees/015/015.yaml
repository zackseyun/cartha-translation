  text: 'Тогда Иеремия протянул правую руку и вручил Иуде золотой меч, сказав при этом:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτείναντα … τὴν δεξιὰν
  choice: протянул правую руку
  rationale: Оборот обозначает направленное вперёд движение руки; по-русски естественно восполнить существительное «руку», подразумеваемое субстантивированным прилагательным «правую».
- source_word: παραδοῦναι
  choice: вручил
  rationale: В данном контексте глагол означает передачу меча Иуде во владение. «Вручил» точно передаёт намеренный, торжественный характер действия и лучше соответствует παραδίδωμι, чем общее «дал».
- source_word: Ἰούδα
  choice: Иуде
  rationale: Использована традиционная русская форма имени Иуда в дательном падеже; речь идёт об Иуде Маккавее.
- source_word: ῥομφαίαν χρυσῆν
  choice: золотой меч
  rationale: ῥομφαία обозначает крупный меч или клинок, а χρυσῆν — сделанный из золота либо золотой; общее «золотой меч» ясно и не вводит неподтверждённой разновидности оружия.
- source_word: διδόντα δὲ προσφωνῆσαι τάδε
  choice: сказав при этом
  rationale: Оборот связывает последующую речь с моментом вручения. Краткая русская формулировка сохраняет одновременность действий, избегает тяжёлого повтора «вручил — вручая» и двоеточием вводит следующие слова.
- source_word: Ἰερεμίαν
  choice: Иеремия
  rationale: Принята традиционная русская библейская форма имени пророка.
theological_decisions:
- issue: Иеремия вручает оружие в составе видения
  choice: Передать действие прямо, не добавляя в этот стих пояснения «в видении».
  alternative: Явно уточнить в самом стихе, что действие происходит в видении.
  rationale: Визионный характер сцены установлен ближайшим контекстом, тогда как данный греческий текст непосредственно описывает действие Иеремии. Добавочное уточнение внесло бы в стих отсутствующие в нём слова.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. «Вручил» поддерживает торжественный характер сцены; синтаксис сделан плавным и готовит прямую речь следующего стиха.
