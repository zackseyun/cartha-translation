lexical_decisions:
- source_word: Τῶν ... κατὰ Νικάνορα
  choice: события, связанные с Никанором
  rationale: Оборот обозначает всё происшедшее в связи с Никанором; такой перевод естественно звучит в итоговой фразе и не сужает смысл до действий непосредственно против него.
- source_word: χωρησάντων οὕτως
  choice: завершились таким образом
  rationale: Здесь χωρέω передаёт то, как развивались и к какому исходу пришли события, а οὕτως отсылает к только что изложенному исходу.
- source_word: ἀπ᾿ ἐκείνων τῶν καιρῶν
  choice: с тех пор
  rationale: Идиоматичный русский эквивалент временного выражения; он ясно передаёт начало продолжающегося положения, не утяжеляя фразу буквальным «от тех времён».
- source_word: κρατηθείσης τῆς πόλεως ὑπὸ τῶν Ἐβραίων
  choice: город оставался во владении евреев
  rationale: Передаёт состояние города под властью или контролем евреев, начавшееся с указанного времени. Слово «город» сохранено без поясняющего добавления «Иерусалим», которого в греческом тексте нет.
- source_word: καὶ αὐτὸς
  choice: я и сам
  rationale: Сохраняет подчёркнутое авторское самоупоминание αὐτός и присоединительное значение καί.
- source_word: αὐτόθι τὸν λόγον καταπαύσω
  choice: на этом завершу своё повествование
  rationale: αὐτόθι указывает на данную точку рассказа, λόγος означает письменное повествование, а καταπαύω — прекращение или завершение.
