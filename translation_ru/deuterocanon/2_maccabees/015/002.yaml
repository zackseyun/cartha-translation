base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/015/002.yaml
  text: But when the Jews who were being compelled to accompany him said[a], “Do not destroy them in so savage and barbarous a way; rather[b], assign honor to the day that has been specially honored in holiness by the One who watches over all,”
translation:
  language: ru
  text: 'Когда иудеи, которых вынудили идти с ним, сказали[a]: «Не губи их так жестоко и варварски, но воздай честь[b] дню, который Тот, Кто видит всё, особо почтил священным почётом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «Не убивай их так жестоко и варварски». Греческий глагол может означать как «убить», так и «уничтожить».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «но удели честь (славу) дню, который Тот, Кто видит всё, особо почтил в святости». Речь идёт о должном почтении к священному дню.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ... Ἰουδαίων
  choice: иудеи
  rationale: В контексте речь идёт об иудейском народе как религиозно-этнической общности; традиционное русское «иудеи» здесь уместно и ясно.
- source_word: κατὰ ἀνάγκην συνεπομένων αὐτῷ
  choice: которых заставили идти вместе с ним
  rationale: Передаёт как принуждение, выраженное κατὰ ἀνάγκην, так и совместное следование, выраженное συνεπομένων, не представляя этих людей добровольными сторонниками Никанора.
- source_word: ἀγρίως καὶ βαρβάρως
  choice: так жестоко и бесчеловечно
  rationale: Сохраняет усиленную двойную характеристику жестокости; «бесчеловечно» естественнее в современном русском, чем буквальное «варварски», и передаёт осуждающую силу βαρβάρως.
- source_word: ἀπολέσῃς
  choice: губи
  rationale: Глагол может означать как уничтожение, так и убийство. «Губи» сохраняет эту смысловую широту и соответствует контексту смертельной расправы.
- source_word: δόξαν δὲ ἀπομέρισον
  choice: но воздай подобающую честь
  rationale: Выражение означает выделить или отдать дню честь. «Воздай подобающую честь» естественно передаёт требование проявить должное почтение, не превращая δόξα в отвлечённую богословскую «славу».
- source_word: τῇ προτετιμημένῃ ... μεθʼ ἁγιότητος ἡμέρᾳ
  choice: дню, который в святости особо почтён
  rationale: Передаёт уже установленный особый статус дня и сохраняет отдельную сакральную характеристику μεθʼ ἁγιότητος, не усиливая её до прямо выраженного «освящён».
- source_word: ὑπὸ τοῦ πάντα ἐφορῶντος
  choice: Тем, Кто надзирает за всем
  rationale: Сохраняет почтительное перифрастическое указание на Бога и значение всеохватывающего наблюдения или попечения.
theological_decisions:
- issue: Неявное указание на Бога в τοῦ πάντα ἐφορῶντος
  choice: Тем, Кто надзирает за всем
  alternative: Всевидящим; Тем, Кто видит всё
  rationale: Греческий текст не называет Бога прямо, поэтому сохранён почтительный перифраз без внесения дополнительной богословской терминологии.
- issue: Статус священного дня
  choice: день, который в святости особо почтён
  alternative: святой день, особо почтённый Богом; день, освящённый превыше других
  rationale: Формулировка сохраняет особый, установленный Богом статус дня, но не подменяет причастие προτετιμημένῃ более сильным и прямо не выраженным понятием освящения.
translation_notes:
  register: Современный литературный русский с достоинством историко-религиозного повествования. Синтаксис сделан естественным для широкой аудитории; сохранены неоднозначность ἀπολέσῃς и почтительное непрямое именование Бога. Все сноски отмечены в основном тексте.
