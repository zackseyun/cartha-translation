base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/043.yaml
  text: And after taking up a collection man by man[a], he sent two thousand silver drachmas to Jerusalem to provide a sin offering, acting very well and nobly, because he was reasoning about the resurrection.
translation:
  language: ru
  text: Собрав поимённо две тысячи серебряных драхм[a], он послал их в Иерусалим для принесения жертвы за грех, поступив весьма хорошо и благородно, поскольку размышлял о воскресении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделав подушный сбор»; возможно также: «согласно списку мужчин». Греческое κατʼ ἀνδρολόγιον — несколько техническое выражение; оно может обозначать поимённый сбор или обложение, связанное со списком мужчин.'
    reason: Лексическая неоднозначность технического выражения.
lexical_decisions:
- source_word: ποιησάμενος κατʼ ἀνδρολόγιον
  choice: сделав сбор с каждого мужчины
  rationale: Причастие обозначает предшествующее действие, а технически окрашенное κατʼ ἀνδρολόγιον, вероятно, указывает на подушный сбор или обложение по списку мужчин. Основной текст передаёт распределительный смысл, не уточняя административный порядок сверх сказанного.
- source_word: εἰς ἀργυρίου δραχμὰς δισχιλίας
  choice: на сумму в две тысячи серебряных драхм
  rationale: Оборот обозначает итоговую сумму сбора; перевод сохраняет и денежную единицу, и указание на серебро.
- source_word: ἀπέστειλεν εἰς Ἰερουσαλήμ
  choice: он послал деньги в Иерусалим
  rationale: Дополнение «деньги» естественно восстанавливает в русском языке предмет отправки из непосредственно предшествующего упоминания суммы.
- source_word: προσαγαγεῖν περὶ ἁμαρτίας θυσίαν
  choice: для принесения жертвы за грех
  rationale: Целевая конструкция показывает, что средства были отправлены, чтобы жертва была принесена; безличное отглагольное выражение не создаёт впечатления, будто Иуда должен был лично совершить жертвоприношение.
- source_word: πάνυ καλῶς καὶ ἀστείως πράττων
  choice: поступив весьма хорошо и благородно
  rationale: Перевод сохраняет явную и сильную авторскую похвалу; ἀστείως здесь имеет смысл «достойно, благородно, прекрасно», а не современное значение, связанное с городской утончённостью.
- source_word: ὑπὲρ ἀναστάσεως διαλογιζόμενος
  choice: поскольку размышлял о воскресении
  rationale: Причастный оборот передаёт основание поступка и оттенок обдуманного рассуждения. «О воскресении» сохраняет отсутствие в греческом тексте явного дополнения «мёртвых».
theological_decisions:
- issue: Авторская оценка отправки денег для жертвы за грех в связи с умершими
  choice: 'Сохранена прямая положительная оценка: «поступив весьма хорошо и благородно».'
  alternative: Нейтрализовать или ослабить похвалу.
  rationale: Греческое πάνυ καλῶς καὶ ἀστείως πράττων недвусмысленно выражает сильное одобрение. Перевод не должен смягчать его из-за межконфессиональных разногласий о подразумеваемой практике.
- issue: Значение ἀνάστασις
  choice: воскресение
  alternative: воскресение мёртвых
  rationale: В исходном стихе стоит только существительное ἀνάστασις. Контекст указывает на воскресение умерших, но добавлять отсутствующее определение в основной текст не требуется.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным строем. Синтаксис близок к греческому ходу мысли, но адаптирован к естественной русской речи; богословски значимая авторская похвала и неоднозначность технического выражения сохранены.
