base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/002.yaml
  text: But of the local commanders[a], Timotheus and Apollonius son of Gennaeus, and further Hieronymus and Demophon, and besides these Nicanor the Cypriarch, would not let them live in peace.
translation:
  language: ru
  text: Но местные военачальники — Тимофей, Аполлоний, сын Геннея, а также Иероним и Демофонт и, кроме них, Никанор Киприарх[a] — не давали им жить спокойно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Киприарх — греческий титул, связанный с властью над Кипром или киприотами; точный характер должности неясен.
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν ... κατὰ τόπον στρατηγῶν
  choice: местные военачальники
  rationale: Оборот обозначает военачальников, действовавших в отдельных местностях. «Местные военачальники» естественно передаёт административно-военный смысл, не приписывая им более точного официального ранга, чем дано в греческом.
- source_word: ὁ τοῦ Γενναίου
  choice: сын Геннея
  rationale: Артикль с родительным падежом служит патронимическим обозначением Аполлония; явное «сын» необходимо для ясного и естественного русского текста.
- source_word: ἔτι δὲ
  choice: а также
  rationale: Связка добавляет следующие имена к перечню; «а также» сохраняет её присоединительное значение.
- source_word: πρὸς δὲ τούτοις
  choice: и, кроме них
  rationale: Оборот выделяет Никанора как ещё одно лицо в дополнение к уже названным.
- source_word: ὁ Κυπριάρχης
  choice: Киприарх[a]
  rationale: Сохранён редкий греческий титул без преждевременного уточнения, был ли Никанор правителем Кипра или начальником киприотов; пояснение вынесено в сноску.
- source_word: οὐκ εἴων
  choice: не давали
  rationale: Имперфект выражает продолжавшееся препятствование; несовершенный вид русского глагола сохраняет эту длительность.
- source_word: ἡσυχίαν ἄγειν
  choice: жить спокойно
  rationale: Идиома означает вести спокойную, не тревожимую жизнь. Такое выражение естественно по-русски и не усиливает значение до формального состояния мира.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Перечень оформлен тире, чтобы длинная группа подлежащего оставалась ясной. Имена переданы в традиционных русских формах; редкий титул сохранён транслитерацией, поскольку более конкретное «правитель Кипра» снимает неоднозначность оригинала.
