  - severity: medium
    issue: «Множество запасов военных машин и метательных снарядов» неестественно; формулировка сноски «было установлено множество...» чрезмерно конкретна.
    rationale: παραθέσεις в контексте может обозначать запасы или складированные средства; «значительные запасы» естественнее. Альтернатива должна говорить о размещении/расстановке, а не утверждать установку машин.
