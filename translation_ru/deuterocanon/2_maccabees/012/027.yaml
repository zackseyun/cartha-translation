  yaml_path: translation/deuterocanon/2_maccabees/012/027.yaml
  text: But after the rout and destruction of these men[a], he marched also against Ephron, a fortified city, in which there were mixed multitudes; and strong young men, stationed before the walls, were fighting vigorously[b], while there were many stores of engines and missiles there.
translation:
  language: ru
  text: После разгрома и гибели этих людей он выступил также против Ефрона — укреплённого города, в котором было множество людей разных племён.[a] Крепкие юноши, стоявшие перед стенами, упорно сражались; там имелись значительные запасы военных машин и метательных снарядов.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смешанное население». Греческое выражение может обозначать людей разных племён или родов, живших в городе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «там было много размещений (или расстановок) военных машин и метательных снарядов». Греческое слово может указывать на размещение средств, хотя в данном контексте вероятнее обозначает запасы или складированные средства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τροπὴν καὶ ἀπώλειαν
  choice: разгрома и гибели
  rationale: В военном контексте τροπή обозначает обращение в бегство, разгром, а ἀπώλεια — гибель или уничтожение. Сочетание передаёт решительное поражение с тяжёлыми потерями.
- source_word: ἐπεστράτευσεν ... ἐπὶ
  choice: выступил ... против
  rationale: Глагол обозначает военный поход против кого-либо; русское «выступил против» естественно передаёт и движение войска, и враждебную цель.
- source_word: πόλιν ὀχυράν
  choice: укреплённого города
  rationale: Прилагательное указывает на оборонительную укреплённость города, а не просто на его силу.
- source_word: πάμφυλα ... πλήθη
  choice: разноплемённые толпы народа
  rationale: πάμφυλα указывает на неоднородность по происхождению или племенной принадлежности; перевод сохраняет эту составную, многоэтничную картину.
- source_word: νεανίαι ... ῥωμαλέοι
  choice: сильные юноши
  rationale: νεανίαι — молодые мужчины, а ῥωμαλέοι подчёркивает их телесную силу и крепость.
- source_word: πρὸ τῶν τειχῶν καθεστῶτες
  choice: перед стенами стояли
  rationale: Оборот описывает занятую ими позицию перед городскими стенами; нейтральное «стояли» не добавляет отсутствующего в тексте указания на формальное назначение.
- source_word: εὐρώστως ἀπεμάχοντο
  choice: оказывали упорное сопротивление
  rationale: Имперфект передаёт продолжающийся бой, а наречие — энергичность и стойкость сопротивления.
- source_word: ὀργάνων καὶ βελῶν
  choice: военных машин и метательных снарядов
  rationale: В данном военном контексте ὄργανα — боевые устройства или машины, а βέλη — широкая категория выпускаемых либо бросаемых снарядов.
- source_word: πολλαὶ παραθέσεις
  choice: множество запасов
  rationale: Слово допускает значение размещённых или накопленных средств; по контексту наиболее естественно понимать его как запасы вооружения, при сохранении альтернативы в сноске.
