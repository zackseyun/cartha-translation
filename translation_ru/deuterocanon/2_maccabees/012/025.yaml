  text: But when he had assured them at length that he would restore these men unharmed[b][a], they released him for the safety of their brothers.
translation:
  language: ru
  text: После того как он подробно[a] заверил их, что вернёт этих людей невредимыми, они отпустили его ради спасения своих братьев[b].
