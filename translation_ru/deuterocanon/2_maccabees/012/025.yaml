  rationale: Замена «подтвердил условие — вернуть» на «заверил их, что вернёт» точнее выражает функцию πιστώσαντος и делает содержание τὸν ὁρισμὸν ἀποκαταστῆσαι естественным по-русски. Перевод сохраняет повествовательный регистр, контекстуальное значение σωτηρία и обе необходимые смысловые альтернативы в сносках.
