lexical_decisions:
- source_word: πιστώσαντος
  choice: подтвердил
  rationale: Аористное причастие πιστόω выражает предоставление убедительного заверения или подтверждения; в сочетании с τὸν ὁρισμόν естественно передаётся как «подтвердил условие».
- source_word: διὰ πλειόνων
  choice: пространно
  rationale: Оборот буквально указывает на многословное или подробное заверение; «пространно» сохраняет идею продолжительной речи и соответствует достоинству повествования.
- source_word: τὸν ὁρισμὸν ἀποκαταστῆσαι
  choice: условие — вернуть
  rationale: ὁρισμός обозначает установленное условие, решение или договорённость, а инфинитив поясняет её содержание. Конструкция с тире сохраняет существительное, не превращая его без необходимости только в придаточное предложение.
- source_word: τούτους ἀπημάντους
  choice: этих людей невредимыми
  rationale: ἀπήμαντος означает «невредимый, не потерпевший вреда»; указательное местоимение относится к упомянутым людям.
- source_word: ἀπέλυσαν αὐτόν
  choice: они отпустили его
  rationale: Обычное повествовательное значение ἀπολύω здесь — освободить или отпустить захваченного человека.
- source_word: ἕνεκα τῆς τῶν ἀδελφῶν σωτηρίας
  choice: ради спасения своих братьев
  rationale: σωτηρία в военном контексте означает избавление и сохранение жизни; русское «спасение» естественно охватывает этот смысл. Возвратное «своих» ясно связывает братьев с теми, кто отпустил пленника.
theological_decisions:
- issue: Значение σωτηρία в военно-повествовательном контексте
  choice: спасение
  alternative: безопасность; избавление
  rationale: Речь идёт прежде всего о физическом избавлении находящихся в опасности людей. При этом «спасение» сохраняет широту греческого слова и не навязывает здесь учение о вечном спасении.
- issue: Референт ἀδελφῶν
  choice: своих братьев
  alternative: братьев; своих соплеменников
  rationale: Мужской род и родственная формулировка исходного текста сохранены. Контекст может включать братьев по народу, однако перевод не подменяет образ более узким толкованием «соплеменники».
- issue: Статус ὁρισμός
  choice: условие
  alternative: договорённость; решение
  rationale: Существительное сохранено как отдельный элемент смысла, а не растворено в простом «что он вернёт», поскольку греческий текст указывает на определённое условие или обязательство.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Пространно» передаёт идиому без тяжеловесного буквализма; конструкция с тире делает содержание условия ясным и сохраняет структуру греческой фразы.
