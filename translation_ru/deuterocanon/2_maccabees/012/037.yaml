    issue: ἐνσείσας передано как «напал».
    rationale: Греческий глагол описывает неожиданное потрясение или смятение противников. Хотя это происходит в боевом контексте, значение непосредственного нападения здесь не названо и не должно подменять исходный образ.
  - severity: low
    issue: Оборот о кличе и гимнах лучше передать как единое определение к кличу.
    rationale: τὴν μεθʼ ὕμνων κραυγήν — это клич, совершаемый/звучащий вместе с гимнами; русская перестройка яснее сохраняет эту связь.
  - severity: low
    issue: В сноске a «родной язык» излишне сужает значение.
    rationale: «Родной» в современном русском обычно относится к языку, усвоенному в детстве; «язык предков» или «отеческий язык» точнее оставляют исходную историко-родовую окраску.
