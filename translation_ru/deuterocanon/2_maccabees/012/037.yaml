  yaml_path: translation/deuterocanon/2_maccabees/012/037.yaml
  text: Beginning the battle cry in the language of his fathers[a], with hymns[b], he shook those around Gorgias by surprise and put them to flight.
translation:
  language: ru
  text: Начав выкрикивать на языке предков[a] боевой клич, сопровождаемый гимнами, он неожиданно привёл людей Горгия в смятение и обратил их в бегство[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на отеческом языке». Греческое выражение может подчёркивать как сам язык, так и его связь с предками.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «совершил их поворот»; в военном контексте — обратил в бегство, разгромил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταρξάμενος
  choice: Начав
  rationale: Аористное причастие обозначает действие, предшествующее основному; деепричастие естественно сохраняет эту связь по-русски.
- source_word: τῇ πατρίῳ φωνῇ
  choice: на языке предков
  rationale: πατρῷος означает «отеческий, предковый», а φωνή здесь вероятнее всего обозначает язык или речь. Формулировка сохраняет связь с предками, не уточняя конкретный язык.
- source_word: τὴν μεθʼ ὕμνων κραυγήν
  choice: боевой клич … сопровождая его гимнами
  rationale: В военном контексте κραυγή — громкий боевой клич, а μεθʼ ὕμνων указывает, что он звучал вместе с гимнами. Перевод сохраняет одновременно военную и богослужебную окраску.
- source_word: ἐνσείσας
  choice: напал
  rationale: Глагол буквально связан с резким приведением в движение или потрясением; при дательном обозначении противника в данном военном контексте естественно передаёт стремительное нападение.
- source_word: ἀπροσδοκήτως
  choice: внезапно
  rationale: Наречие указывает, что действие оказалось для противника неожиданным; «внезапно» кратко и естественно передаёт этот смысл.
- source_word: τοῖς περὶ τὸν Γοργίαν
  choice: на отряд Горгия
  rationale: Оборот буквально обозначает находившихся вокруг Горгия, то есть его людей или войско. «Отряд Горгия» ясно передаёт групповой военный смысл.
- source_word: τροπὴν ἐποιήσατο αὐτῶν
  choice: обратил их в бегство
  rationale: Военное значение τροπή — поворот к бегству, отступление или разгром. Русский оборот точно и естественно выражает результат.
theological_decisions:
- issue: Религиозный характер боевого клича
  choice: Боевой клич сопровождается гимнами.
  alternative: Понимать выражение только как хвалебный возглас или как пение гимнов.
  rationale: Сочетание κραυγή и μεθʼ ὕμνων одновременно содержит военную и религиозную составляющие. Перевод сохраняет обе, не превращая описание в дополнительное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Военная ситуация передана ясно, без архаизмов; местоимение «их» сохраняет соотнесённость с людьми, составлявшими отряд Горгия.
