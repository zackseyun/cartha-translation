  text: On the following day[a], the men with Judas came, when the need had arisen, to gather up the bodies of those who had fallen and to restore them with their relatives to the tombs of their fathers.
translation:
  language: ru
  text: На следующий день люди, бывшие с Иудой, пришли, когда возникла необходимость собрать тела павших и вернуть их к родственникам, в родовые гробницы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ δὲ ἐχομένῃ
  choice: На следующий день
  rationale: Естественная русская передача идиоматического обозначения следующего дня.
- source_word: οἱ περὶ τὸν Ἰούδαν
  choice: люди Иуды
  rationale: Оборот обозначает тех, кто составлял окружение или отряд Иуды; эта формулировка кратка и не добавляет отсутствующей в греческом конкретизации.
- source_word: καθʼ ὃν χρόνον τὸ τῆς χρείας ἐγέγονει
  choice: когда настала необходимость
  rationale: Передаёт возникшую по обстоятельствам необходимость совершить названное действие.
- source_word: τὰ σώματα τῶν προπεπτωκότων
  choice: тела павших
  rationale: Сохраняет образ падения и ясно указывает на погибших в данном повествовательном контексте.
- source_word: ἀνακομίσασθαι
  choice: забрать
  rationale: В контексте означает подобрать и унести тела с места сражения; «забрать» естественно выражает это действие по-русски.
- source_word: ἀποκαταστῆσαι
  choice: положить
  rationale: Контекстуально речь идёт о возвращении тел для погребения; «положить» звучит естественно, не вводя прямо не названный глагол «похоронить».
- source_word: μετὰ τῶν συγγενῶν
  choice: рядом с родными
  rationale: Передаёт погребение вместе с родственниками; «рядом с» естественно раскрывает пространственный смысл в русском контексте.
- source_word: εἰς τοὺς πατρῴους τάφους
  choice: в родовых гробницах
  rationale: πατρῷος здесь означает принадлежащий предкам или роду; «родовые гробницы» идиоматично передаёт назначение семейных мест погребения.
theological_decisions:
- issue: Соотношение упоминаний родственников и родовых гробниц
  choice: положить их рядом с родными в родовых гробницах
  alternative: возвратить их вместе с родственниками в гробницы отцов
  rationale: В переводе сохранены оба элемента греческого текста — συγγενῶν и πατρῴους τάφους, — но они выражены естественно для современного русского языка без сведения их к одному понятию.
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный стиль. Синтаксис следует ходу греческой фразы, но избегает неестественной буквальности.
