base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/028.yaml
  text: But after calling on the Sovereign[a], who with judgments shatters the forces of the enemies, they took the city under their control[c][b], and struck down twenty-five thousand of those inside.
translation:
  language: ru
  text: Но, воззвав к Властителю[a], который судами[b] сокрушает силы врагов, они овладели городом[c] и сразили двадцать пять тысяч находившихся в нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Могущественному»; или: «Правителю» — как титул Бога.'
    reason: lexical_alternative
  - marker: b
    text: В переданном греческом тексте слово, переведённое как «судами», имеет необычную форму; по смыслу Бог сокрушает врагов, совершая над ними суд.
    reason: textual_variant
  - marker: c
    text: 'Или: «взяли город»; буквально: «взяли город под руку», то есть подчинили своей власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεσάμενοι
  choice: призвав
  rationale: Аористное причастие обозначает обращение к Богу за помощью перед взятием города; «призвав» естественно передаёт и обращение, и последовательность действий.
- source_word: τὸν δυνάστην
  choice: Властителя
  rationale: Слово обозначает обладающего властью и силой и здесь служит титулом Бога. «Властитель» сохраняет обе смысловые стороны и звучит возвышенно, но понятно.
- source_word: μετὰ κρίτους
  choice: судами
  rationale: Форма κρίτους в переданном греческом тексте необычна. Перевод следует наиболее вероятному пониманию фразы как указания на Божьи акты суда, не скрывая текстовую трудность, отмеченную в сноске.
- source_word: συντρίβοντα
  choice: сокрушает
  rationale: Настоящее причастие описывает характерное действие Бога; «сокрушает» передаёт решительное и полное поражение врагов.
- source_word: τὰς τῶν πολεμίων ὀλκάς
  choice: силы врагов
  rationale: В военном контексте выражение указывает на мощь или силы противника; «силы врагов» естественно сочетается с глаголом «сокрушает» и не сужает смысл до абстрактной силы.
- source_word: ἔλαβον τὴν πόλιν ὑποχείριον
  choice: овладели городом
  rationale: ὑποχείριος буквально указывает на переход под чью-либо руку или власть. «Овладели городом» кратко и естественно передаёт захват и подчинение.
- source_word: κατέστρωσαν
  choice: сразили
  rationale: В военном повествовании глагол означает повергнуть или убить; «сразили» сохраняет серьёзный повествовательный тон без архаичности.
- source_word: τῶν ἔνδον
  choice: находившихся в нём
  rationale: Выражение относится к людям внутри города. Такой перевод не добавляет отсутствующего в греческом указания на пол.
- source_word: εἰς μυριάδας δύο πεντακισχιλίους
  choice: двадцать пять тысяч
  rationale: Числовое выражение составляет 25 000; прямое обозначение числа наиболее ясно для современного читателя.
theological_decisions:
- issue: Божественный титул τὸν δυνάστην
  choice: Властителя
  alternative: Могущественного; Правителя
  rationale: «Властитель» подчёркивает Божью власть и могущество, не подменяя данный титул более специальным именованием Бога.
- issue: Способ Божьего сокрушения врагов в μετὰ κρίτους
  choice: судами
  alternative: актами суда; карами
  rationale: «Судами» сохраняет связь с языком Божьего суда и необычность выражения, тогда как «карами» конкретизировало бы смысл сильнее, чем позволяет форма исходного текста.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Синтаксис сохраняет последовательность обращения к Богу, взятия города и поражения находившихся внутри. Необычное μετὰ κρίτους не сглажено молча, а отражено буквально и пояснено в сноске.
