  text: For if he were not expecting those who had fallen to rise again[a], it would be excessive and foolish to pray for the dead.
translation:
  language: ru
  text: Ведь если бы он не ожидал, что павшие[a] воскреснут, то молиться за умерших было бы излишне и нелепо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умершие»; буквально: «павшие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προπεπτωκότας
  choice: павшие
  rationale: Перфектное причастие сохраняет греческий образ падения и в военном контексте естественно обозначает погибших; примечание поясняет смысл.
- source_word: ἀναστῆναι
  choice: воскреснут
  rationale: В данном контексте инфинитив ἀνίστημι обозначает воскресение; русское «воскреснут» ясно и естественно передаёт этот смысл, не навязывая отсутствующий в форме глагола пассив.
- source_word: προσεδόκα
  choice: ожидал
  rationale: Глагол выражает ожидание, а не обязательно эмоционально окрашенную надежду.
- source_word: περισσὸν
  choice: излишне
  rationale: Передаёт смысл действия, выходящего за пределы необходимого, не усиливая его до «бессмысленно».
- source_word: ληρῶδες
  choice: нелепо
  rationale: Передаёт значение глупости или вздорности и естественно сочетается с «излишне» в современном литературном русском.
- source_word: ὑπὲρ νεκρῶν
  choice: за умерших
  rationale: ὑπέρ с родительным обозначает действие в пользу или от имени кого-либо; «молиться за умерших» — естественная русская формулировка.
- source_word: εὔχεσθαι
  choice: молиться
  rationale: В контексте речь идёт о молитве; это наиболее ясный и прямой русский эквивалент.
theological_decisions:
- issue: Ожидание воскресения как основание молитвы за умерших
  choice: 'Условное рассуждение сохранено прямо: если павшие не воскреснут, молитва за умерших была бы излишней и нелепой.'
  alternative: Можно было уточнить «воскреснут телесно» или истолковать назначение молитвы через более поздние учения о посмертном состоянии.
  rationale: Греческий текст связывает молитву за умерших с ожиданием воскресения, но не раскрывает механизм её пользы и не формулирует позднейших доктрин; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. «Павшие» сохраняет военный образ оригинала, а «умершие» в следующей части естественно передаёт более общее νεκρῶν.
