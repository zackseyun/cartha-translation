  text: But when Judas’s company first appeared[a], and dread came upon the enemies—fear also coming upon them from the appearing of the One who watches over all things—they rushed into flight, each man being driven a different way, so that they were often injured by their own men and run through by the points of their swords.
translation:
  language: ru
  text: Когда же впервые явился отряд Иуды[a], врагов объял ужас; страх напал на них и от явления Того, Кто видит всё. Они бросились бежать, рассеявшись кто куда, так что нередко терпели вред от своих же и бывали пронзены остриями мечей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда же отряд Иуды явился первым». В греческом тексте здесь и далее, в выражении «от явления Того, Кто видит всё», повторяется один и тот же корень со значением появления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφανείσης … ἐπιφανίας
  choice: показался … явления
  rationale: 'Сохраняет повтор корня со значением появления, насколько это допускает естественный русский язык: отряд становится видимым, а применительно к Богу говорится о явлении.'
- source_word: σπείρης
  choice: отряд
  rationale: Передаёт воинское подразделение, не приписывая ему точной римской организационной численности.
- source_word: δέους … φόβου
  choice: ужас … страх
  rationale: Различает два близких греческих существительных и сохраняет нарастание паники.
- source_word: τοῦ τὰ πάντα ἐφορῶντος
  choice: Того, Кто надзирает за всем
  rationale: ἐφοράω включает наблюдение и надзор; формулировка сохраняет смысл всеохватного божественного видения и попечения, не сводя его лишь к зрению.
- source_word: εἰς φυγὴν ὥρμησαν
  choice: бросились бежать
  rationale: Естественно и выразительно передаёт внезапное, стремительное бегство.
- source_word: ἄλλος ἀλλαχῇ φερόμενος
  choice: рассеявшись кто куда
  rationale: Передаёт хаотическое движение каждого в иную сторону без тяжеловесной буквальности.
- source_word: βλάπτεσθαι
  choice: страдали
  rationale: Сохраняет широкое значение причинённого вреда, не уточняя характер ранения сверх греческого текста.
- source_word: ἀναπείρεσθαι … ταῖς τῶν ξιφῶν ἀκμαῖς
  choice: их пронзали острия мечей
  rationale: Передаёт образ пронзания острыми концами мечей; конструкция допускает, что это мечи своих же воинов, как подсказывает контекст.
theological_decisions:
- issue: Передача божественного наименования τοῦ τὰ πάντα ἐφορῶντος
  choice: Того, Кто надзирает за всем
  alternative: Того, Кто всё видит
  rationale: Основной вариант удерживает возможный оттенок провиденциального надзора наряду со всеведением; альтернатива точнее выделяет зрительное значение.
- issue: Значение второго ἐπιφανίας
  choice: явления
  alternative: явления Того, Кто всё видит / Его явления
  rationale: Сохраняется прямой язык божественного явления и повтор с первым глаголом; текст не объясняет конкретную форму этого явления.
