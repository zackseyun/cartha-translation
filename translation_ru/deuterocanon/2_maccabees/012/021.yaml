  text: But when Timothy learned of Judas’s advance[a], he sent the women and the rest of the baggage ahead to the place called Carnion, for the place was hard to besiege and difficult to approach because of the narrowness of all the surrounding terrain.
translation:
  language: ru
  text: Узнав о наступлении Иуды, Тимофей отправил вперед женщин и остальной обоз в место, называемое Карнионом, потому что это место было трудно осадить и к нему было трудно подступиться из-за тесноты всей окружающей местности.[a]
  philosophy: optimal-equivalence
