    text: 'Буквально: «из-за тесноты всех мест»; вероятно, имеются в виду узкие, стеснённые подступы к этому месту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφοδον
  choice: наступлении
  rationale: Слово обозначает приближение войска или нападение; «наступление» сохраняет военный смысл, не утверждая, что штурм уже начался.
- source_word: μεταλαβὼν
  choice: узнав о
  rationale: Причастие передаёт получение известия; по-русски естественнее всего здесь «узнав о».
- source_word: προεξαπέστειλεν
  choice: заранее отправил
  rationale: Передаёт заложенную в сложном глаголе мысль об отправке вперёд, заблаговременно.
- source_word: ἀποσκευήν
  choice: обоз
  rationale: В военном повествовании слово относится к перевозимому имуществу, снаряжению и поклаже; «обоз» естественно передаёт это собирательное значение.
- source_word: τὸ λεγόμενον Κάρνιον
  choice: место, называемое Карнион
  rationale: Сохраняет общий смысл χωρίον и прямо вводит географическое название без оттенка сомнения, который могло бы создать «так называемое».
- source_word: δυσπολιόρκητον
  choice: трудно осадить
  rationale: Точно сохраняет военно-тактическое значение прилагательного.
- source_word: δυσπρόσιτον
  choice: к нему было трудно подступиться
  rationale: Передаёт конкретную труднодоступность местности, не усиливая её до полной неприступности.
- source_word: διὰ τὴν πάντων τῶν τόπων στενότητα
  choice: из-за тесноты всей окружающей местности
  rationale: Читаемо передаёт буквальную мысль о тесноте всех мест вокруг, не сводя её исключительно к дорогам или проходам.
