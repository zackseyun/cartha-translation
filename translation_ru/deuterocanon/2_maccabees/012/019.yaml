translation:
  language: ru
  text: Досифей же и Сосипатр, из военачальников, бывших при Маккавее, выступили и уничтожили оставленных Тимофеем в крепости — более десяти тысяч человек.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν περὶ τὸν Μακκαβαῖον ἡγουμένων
  choice: военачальники Маккавея
  rationale: Родительный оборот характеризует Досифея и Сосипатра как военных руководителей, связанных с Маккавеем. Такой перевод естественен по-русски и не уточняет сверх текста точную служебную иерархию.
- source_word: ἐξοδεύσαντες
  choice: выступили
  rationale: В военном повествовании причастие означает выход или отправление в поход; «выступили» кратко и естественно передаёт этот оттенок.
- source_word: τοὺς ὑπὸ Τιμοθέου … καταλειφθέντας
  choice: оставленных Тимофеем
  rationale: 'ὑπὸ с пассивным причастием обозначает действующее лицо: речь идёт о людях, которых Тимофей оставил в крепости.'
- source_word: ἀπώλεσαν
  choice: уничтожили
  rationale: Глагол обозначает уничтожение или гибель; применительно к военному отряду «уничтожили» сохраняет силу исходного выражения, не заменяя её более узким «убили».
- source_word: ἐν τῷ ὀχυρώματι
  choice: в крепости
  rationale: ὀχύρωμα — укреплённое место или крепость; «в крепости» естественно для данного военного контекста.
- source_word: πλείους τῶν μυρίων ἀνδρῶν
  choice: более десяти тысяч человек
  rationale: Сравнительный оборот прямо указывает на число свыше десяти тысяч; русское «человек» идиоматично при числительном и в контексте означает мужчин из военного отряда.
