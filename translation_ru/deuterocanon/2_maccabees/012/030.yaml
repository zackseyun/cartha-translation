    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπομαρτυρησάντων
  choice: засвидетельствовали
  rationale: Аористное причастие вводит содержание свидетельства местных иудеев; глагол сохраняет значение подтверждённого сообщения и естественно сочетается с придаточным «что».
- source_word: τῶν ἐκεῖ καθεστώτων Ἰουδαίων
  choice: жившие там иудеи
  rationale: Оборот обозначает иудеев, обосновавшихся и постоянно проживавших в этом месте; «жившие там» ясно и естественно передаёт смысл без канцеляризма.
- source_word: οἱ Σκυθοπολεῖται
  choice: жители Скифополя
  rationale: Этникон обозначает население города; описательная форма понятнее современному читателю, чем редкое «скифопольцы».
- source_word: εὔνοιαν
  choice: относились к ним доброжелательно
  rationale: εὔνοια означает благожелательное расположение; глагольная конструкция естественно передаёт оборот ἣν ... ἔχον πρὸς αὐτούς в современном русском языке.
- source_word: ἐν τοῖς τῆς ἀτυχίας καιροῖς
  choice: в тяжёлые времена
  rationale: ἀτυχία указывает на несчастье или бедственное положение. Контекстуальное выражение «в тяжёлые времена» звучит естественно и не усиливает степень бедствия без основания.
- source_word: ἥμερον ἀπάντησιν
  choice: обходились с ними по-доброму
  rationale: Буквально сочетание говорит о кроткой, мягкой встрече или обращении. В контексте оно описывает практическое отношение жителей Скифополя к иудеям во время бедствий.
