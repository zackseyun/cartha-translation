  yaml_path: translation/deuterocanon/2_maccabees/012/040.yaml
  text: But under the tunic of each of the dead they found sacred tokens of the idols of Jamnia[a], which the law forbids the Jews to have[b]; and it became clear to all that for this reason these men had fallen.
translation:
  language: ru
  text: Но под хитоном каждого из погибших нашли культовые предметы[a], связанные с идолами из Иамнии, которые закон запрещал иудеям иметь; и всем стало ясно, что именно по этой причине эти люди пали[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «священные предметы», «посвятительные приношения»; возможно: «амулеты».'
    reason: lexical_alternative
  - marker: b
    text: «Пали» — военное выражение, означающее, что они были убиты.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερώματα
  choice: культовые предметы
  rationale: Слово обозначает предметы, связанные с религиозным почитанием. Такой перевод сохраняет широту значения и не уточняет без достаточных оснований, были ли это приношения, знаки или амулеты.
- source_word: χιτῶνας
  choice: хитоном
  rationale: χитών — нижняя одежда, хитон. Единственное число соответствует конструкции «у каждого» в греческом тексте.
- source_word: τῶν ἀπὸ Ἰαμνίας εἰδώλων
  choice: принадлежавшие идолам из Иамнии
  rationale: Формулировка передаёт связь предметов с идолами и сохраняет географическое указание ἀπὸ Ἰαμνίας, не определяя точнее характер этой связи.
- source_word: ἀπήργει
  choice: запрещал … иметь
  rationale: Глагол выражает запрет или удерживание от чего-либо. Добавление «иметь» естественно передаёт подразумеваемое отношение к найденным предметам.
- source_word: πεπτωκέναι
  choice: пали
  rationale: Сохранён буквальный военный образ глагола πίπτω; в данном контексте он означает гибель в бою.
- source_word: διὰ τήνδε τὴν αἰτίαν
  choice: именно по этой причине
  rationale: Передаёт явно заявленную в тексте причинную связь; «именно» естественно подчёркивает указательное τήνδε.
theological_decisions:
- issue: Причинная связь между культовыми предметами и гибелью воинов
  choice: «всем стало ясно, что именно по этой причине эти люди пали»
  alternative: Передать это лишь как предположение или мнение участников
  rationale: Греческий текст прямо говорит σαφὲς ἐγένετο — «стало ясно» — и указывает причину. Перевод сохраняет это утверждение, не добавляя дальнейшего богословского объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис следует ходу греческой фразы, но остаётся понятным современному читателю; неоднозначность слова ἱερώματα вынесена в примечание.
