- from: Овладев городом по воле Бога, они устроили неисчислимую резню, так что находившееся рядом озеро шириной в два стадия[a], наполненное кровью, казалось переливающимся через край[b].
  to: Овладев городом по воле Бога, они устроили неисчислимую резню, так что находившееся рядом озеро шириной в два стадия[a] казалось переполнявшимся кровью[b].
