  text: And when they had taken the city by the will of God[a], they made an immeasurable slaughter, so that the nearby lake, having a width of two stadia, appeared to be overflowing[b], filled with blood.
translation:
  language: ru
  text: Овладев городом по воле Бога, они устроили неисчислимую резню, так что находившееся рядом озеро шириной в два стадия[a] казалось переполнявшимся кровью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стадий — древняя мера длины; два стадия составляют примерно 370 метров.
    reason: cultural_note
  - marker: b
    text: 'Или: «казалось наполненным кровью». Греческий текст создаёт яркий, несколько неоднозначный образ: озеро выглядит так, словно кровь стекала в него или текла через него, пока оно не наполнилось.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαβόμενοι
  choice: овладев
  rationale: Аористное причастие в военном контексте означает взятие города; «овладев городом» естественно передаёт предшествующее действие.
- source_word: τῇ τοῦ θεοῦ θελήσει
  choice: по воле Бога
  rationale: Дательный падеж допускает значение средства или соответствия; формулировка сохраняет прямое указание текста на Божью волю, не расширяя его богословский смысл.
- source_word: ἀμυθήτους σφαγάς
  choice: устроили неисчислимую резню
  rationale: ἀμυθήτους указывает на то, чего невозможно исчислить или пересказать, а σφαγάς — на массовое кровопролитие. Единственное число «резню» соответствует естественной русской идиоматике.
- source_word: παρακειμένην λίμνην
  choice: находившееся рядом озеро
  rationale: Причастие обозначает водоём, расположенный рядом с городом или местом событий; перевод сохраняет пространственное значение без уточнения топографии.
- source_word: τὸ πλάτος ἔχουσαν σταδίους δύο
  choice: шириной в два стадия
  rationale: Краткая современная конструкция точно передаёт указанную в греческом тексте ширину и сохраняет древнюю меру длины.
- source_word: καταρρεῖν
  choice: переливающимся через край
  rationale: Глагол создаёт образ текущей или льющейся жидкости. В сочетании с озером, наполненным кровью, этот вариант естественно передаёт зрительный образ, не превращая его в буквальное топографическое описание.
- source_word: τὸ αἷμα πεπληρωμένην φαίνεσθαι
  choice: наполненное кровью, казалось
  rationale: Сохраняются и результативное значение причастия «наполненное», и φαίνεσθαι — указание на видимое впечатление, а не обязательно на объективное состояние озера.
theological_decisions:
- issue: Причастность Божьей воли ко взятию города
  choice: по воле Бога
  alternative: согласно воле Бога; Божьей волей
  rationale: Греческий текст прямо связывает взятие города с волей Бога. Перевод сохраняет это напряжённое утверждение, но не добавляет вывода, будто формулировка отдельно одобряет каждое последующее действие.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис умеренно близок к греческому, но избегает неестественных кальк. Маркер примечания о стадии поставлен непосредственно после меры длины, а примечание о неоднозначном образе — после выражения «переливающимся через край».
