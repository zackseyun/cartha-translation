  text: But when the place had been closed up[a], he withdrew, intending to come again and root out the entire citizen body of the people of Joppa.
translation:
  language: ru
  text: Когда же место было закрыто, он отступил, намереваясь вернуться и искоренить всю гражданскую общину иоппийцев[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё гражданское сообщество иоппийцев». Греческое слово может обозначать гражданскую общину, совокупность граждан или политическое сообщество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ... χωρίου
  choice: это место
  rationale: χωρίον обозначает место или местность; нейтральное «место» не уточняет без достаточных оснований, шла ли речь о районе или укреплении.
- source_word: συγκλεισθέντος
  choice: было перекрыто
  rationale: Страдательное причастие от συγκλείω передаёт закрытие или изоляцию места. «Было перекрыто» сохраняет пассивность и не уточняет конкретный военный способ.
- source_word: ἀνέλυσεν
  choice: он отступил
  rationale: В повествовательном и военном контексте ἀναλύω может означать уход или снятие с места; «отступил» естественно передаёт временный отход при намерении вернуться.
- source_word: πάλιν ἥξων
  choice: намереваясь вернуться
  rationale: Будущее причастие выражает цель или намерение; русский оборот прямо и естественно передаёт этот оттенок.
- source_word: ἐκριζῶσαι
  choice: искоренить
  rationale: ἐκριζόω буквально означает «вырвать с корнем» и переносно — полностью устранить; «искоренить» сохраняет метафору и суровость намерения.
- source_word: τὸ σύμπαν τῶν Ἰοππιτῶν πολίτευμα
  choice: всю гражданскую общину иоппийцев
  rationale: πολίτευμα может обозначать организованное гражданское сообщество или совокупность граждан, а σύμπαν подчёркивает полноту. Формулировка сохраняет корпоративно-политический смысл, не сводя его ни только к властям, ни однозначно ко всем жителям как отдельным лицам.
theological_decisions:
- issue: Суровость и охват намерения Иуды в отношении Иоппии
  choice: «искоренить всю гражданскую общину иоппийцев»
  alternative: «уничтожить всех жителей Иоппии» или «искоренить всё государственное устройство Иоппии»
  rationale: Греческий текст ставит в центр πολίτευμα — гражданско-политическое целое. Перевод сохраняет суровый корпоративный смысл, не сужая его до органов управления и не расширяя однозначно до каждого жителя.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Иоппийцы» кратко и точно передаёт название жителей Иоппии; неоднозначность πολίτευμα сохранена в тексте и пояснена в сноске.
