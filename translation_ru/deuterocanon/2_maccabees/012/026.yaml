  yaml_path: translation/deuterocanon/2_maccabees/012/026.yaml
  text: Then he advanced against Carnion and Atargatis[b][a], and slaughtered twenty-five thousand men.
translation:
  language: ru
  text: Затем он выступил против Карниона и Атергатиона[a] и перебил двадцать пять тысяч человек[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно, «Атергатион» — не название второго города, а обозначение святилища богини Атаргатис.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по-гречески: «две мириады тел и пять тысяч», то есть двадцать пять тысяч убитых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξελθὼν
  choice: выступил
  rationale: Причастие буквально означает «выйдя», но в военном повествовании «выступил» естественно передаёт начало движения против цели.
- source_word: ἐπὶ
  choice: против
  rationale: В контексте военного похода предлог обозначает направленность движения на враждебную цель.
- source_word: τὸ Κάρνιον
  choice: Карниона
  rationale: Название места передано транслитерацией и поставлено в падеж, требуемый русским предлогом «против».
- source_word: τὸ Ἀτεργάτιον
  choice: Атергатиона
  rationale: Греческая форма передана как собственное имя без внесения в основной текст спорного толкования о святилище; эта возможность сохранена в сноске.
- source_word: κατέσφαξεν
  choice: перебил
  rationale: Глагол обозначает жестокое массовое умерщвление; «перебил» сохраняет силу выражения и звучит естественно в современном русском повествовании.
- source_word: μυριάδας σωμάτων δύο πεντακισχιλίους
  choice: двадцать пять тысяч человек
  rationale: Числовое выражение означает две мириады и пять тысяч, то есть 25 000; σωμάτων буквально «тел», но здесь это счёт погибших людей.
