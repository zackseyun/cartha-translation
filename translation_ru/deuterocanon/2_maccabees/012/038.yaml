lexical_decisions:
- source_word: ἀναλαβὼν τὸ στράτευμα
  choice: взяв с собой войско
  rationale: Причастие ἀναλαβών в данном контексте обозначает, что Иуда повёл войско с собой; выражение сохраняет основной смысл глагола и естественно звучит по-русски.
- source_word: ἧκεν
  choice: прибыл
  rationale: Глагол выражает прибытие в указанное место; «прибыл» точнее и естественнее в повествовании, чем буквальное «пришёл».
- source_word: Ὀδολλὰμ πόλιν
  choice: в город Одоллам
  rationale: Сохраняется явно названный в греческом тексте город и транслитерированное географическое имя.
- source_word: τῆς ... ἑβδομάδος ἐπιβαλλούσης
  choice: когда наступал конец недели
  rationale: Оборот имеет некоторую неоднозначность и буквально говорит о наступлении или продвижении недели; контекст субботы указывает на её завершение. Неоднозначность отмечена в сноске.
- source_word: κατὰ τὸν ἐθισμόν
  choice: по обычаю
  rationale: Краткий и естественный русский эквивалент выражения, обозначающего установленную обычную практику.
- source_word: ἁγνισθέντες
  choice: совершили очищение
  rationale: Передаёт ритуальный, а не гигиенический смысл глагола и естественно выражает по-русски пассивное причастие с подразумеваемым участием самих воинов.
- source_word: τὸ σάββατον διῆγεν
  choice: провели там субботу
  rationale: Глагол означает проводить или коротать время; перевод не добавляет более сильного утверждения об обрядовом соблюдении, хотя оно подразумевается контекстом.
theological_decisions:
- issue: Ритуальное очищение перед субботой
  choice: совершили там очищение
  alternative: очистились там
  rationale: Выбранная формулировка сохраняет культово-ритуальную окраску ἁγνισθέντες, не сводя действие к физической чистоте и не добавляя не названных в тексте подробностей.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Частица «же» сохраняет повествовательную связь δέ, а синтаксис упрощён для ясности без устранения смысловой неоднозначности временного оборота.
