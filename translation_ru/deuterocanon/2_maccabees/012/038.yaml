  source_fidelity: 'Временной оборот τῆς ... ἑβδομάδος ἐπιβαλλούσης не следует передавать как «наступал конец недели»: это звучит так, будто конец уже наступает, и менее точно отражает образ приближения/завершения недели. «Неделя подходила к концу» естественно передаёт греческий оборот, сохраняя слово «неделя» и не устраняя контекстуальную связь с приближением субботы. Остальные основные соответствия верны: «взяв с собой войско», «прибыл», «город Одоллам» и «провели ... субботу» не добавляют содержания.'
  naturalness: «Когда наступал конец недели» стилистически шероховато, особенно рядом с совершенным видом «совершили»; «Когда неделя подходила к концу» — современная литературная и связная формулировка. «Очистились» точнее передаёт греческое страдательное причастие с рефлексивным смыслом и в данном контексте сохраняет ритуальную окраску без добавления слова «обряд».
  terminology: «Очистились» сохраняет культово-ритуальный смысл ἁγνισθέντες, не сводя его к бытовой гигиене. Географическое имя «Оdolлам» и имя «Иуда» приемлемы. Сноска должна буквально отражать вариант «неделя наступала/приближалась», а не создавать впечатление, что это единственно возможное значение.
