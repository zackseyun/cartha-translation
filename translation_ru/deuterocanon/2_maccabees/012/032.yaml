lexical_decisions:
- source_word: Μετὰ
  choice: после
  rationale: Предлог с винительным падежом выражает время, наступившее вслед за названным праздником.
- source_word: τὴν λεγομένην πεντηκοστήν
  choice: так называемой Пятидесятницы
  rationale: Передаёт буквальное значение λεγομένην («называемой») и сохраняет принятое название праздника, не сводя его к пояснительному «пятидесятому дню».
- source_word: ὥρμησαν
  choice: выступили
  rationale: В военном контексте глагол обозначает начало движения или похода; «выступили» естественно передаёт это значение, не преувеличивая стремительность.
- source_word: ἐπὶ Γοργίαν
  choice: против Горгия
  rationale: ἐπί с винительным при глаголе военного движения указывает на враждебно направленное действие.
- source_word: στρατηγόν
  choice: правителя
  rationale: Слово может обозначать как военачальника, так и областного правителя; сочетание с «Идумеи» позволяет передать должность нейтральным словом «правитель», сохранив неоднозначность через примечание.
- source_word: Ἰδουμαίας
  choice: Идумеи
  rationale: Использовано традиционное русское географическое название, соответствующее греческому Ἰδουμαία.
