base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/003.yaml
  text: 'But the people of Joppa committed such a great act of impiety: they invited the Jews living among them to embark, with their wives and children, in the boats provided by them, as though there were no hostility toward them at all;'
translation:
  language: ru
  text: 'Жители Иоппии совершили столь тяжкое нечестие: они пригласили живших среди них иудеев с жёнами и детьми сесть в приготовленные ими лодки, словно у них вовсе не было к иудеям никакой вражды;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰοππῖται
  choice: жители Иоппии
  rationale: Гражданско-географическое обозначение жителей Иоппии; естественная современная русская передача коллективного смысла.
- source_word: τηλικοῦτο
  choice: столь великое
  rationale: Сохраняет эмфатическое указание на тяжесть совершённого деяния.
- source_word: συνετελέσαντο
  choice: совершили
  rationale: В сочетании с существительным, обозначающим злодеяние, глагол значит довести до исполнения, совершить.
- source_word: δυσσέβημα
  choice: нечестие
  rationale: Передаёт религиозно-нравственную оценку поступка, не сводя её к общему понятию преступления.
- source_word: παρακαλέσαντες
  choice: они пригласили
  rationale: В данном контексте речь о притворно дружелюбном приглашении, посредством которого иудеев побудили сесть в лодки.
- source_word: τοὺς ἐν ἑαυτοῖς οἰκοῦντας Ἰουδαίους
  choice: живших среди них иудеев
  rationale: Точно указывает на иудеев, проживавших внутри местной общины.
- source_word: ἐμβῆναι
  choice: сесть
  rationale: По отношению к лодкам естественное русское выражение «сесть в лодки» точнее и современнее более книжного «взойти на суда».
- source_word: τὰ παρακατασταθέντα ὑπʼ αὐτῶν σκάφη
  choice: приготовленные ими лодки
  rationale: Причастие указывает, что лодки были заранее предоставлены или приведены в готовность самими жителями Иоппии; «приготовленные» сохраняет этот оттенок.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: с жёнами и детьми
  rationale: Естественно передаёт включение семей иудеев без обязательного добавления отсутствующего в греческом притяжательного местоимения.
- source_word: ὡς μηδεμίας ἐνεστώσης πρὸς αὐτοὺς δυσμενείας
  choice: словно у них вовсе не было к иудеям никакой вражды
  rationale: Сохраняет значение притворной видимости и усиленное отрицание μηδεμίας; повтор «к иудеям» устраняет возможную неясность русского местоимения.
theological_decisions:
- issue: Религиозно-нравственная сила δυσσέβημα
  choice: нечестие
  alternative: злодеяние; безбожный поступок
  rationale: «Нечестие» сохраняет религиозную оценку греческого слова и вместе с тем не вносит более узкого конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейско-историческим регистром. Синтаксис сохраняет развитие одной греческой фразы и конечное двоеточие с точкой с запятой, поскольку повествование продолжается в следующем стихе.
