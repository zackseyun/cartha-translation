lexical_decisions:
- source_word: Δωσίθεος
  choice: Досифей
  rationale: Традиционная русская передача греческого личного имени.
- source_word: τῶν τοῦ Βακινόρος
  choice: из людей Вакенора
  rationale: Генитивная конструкция указывает на принадлежность к группе Вакенора, не уточняя воинского звания.
- source_word: ἔφιππος ἀνὴρ καὶ καρτερός
