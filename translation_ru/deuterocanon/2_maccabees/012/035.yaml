- source_word: εἶχεν τοῦ Γοργίου
  choice: схватил Горгия
  rationale: Контекст показывает физический захват; русский совершенный вид естественно вводит последующие действия.
- source_word: λαβόμενος τῆς χλαμύδος
  choice: ухватившись за его плащ
  rationale: χλαμύς — плащ, нередко воинский; местоимение ясно относится к Горгию и естественно для русского текста.
- source_word: ἦγεν αὐτὸν εὐρώστως
  choice: силой тащил его
  rationale: Передаёт энергичное, принудительное перемещение в боевой обстановке.
- source_word: βουλόμενον τὸν κατάρατον λαβεῖν ζωγρείαν
  choice: намереваясь взять этого проклятого живым
  rationale: Сохраняет намерение Досифея захватить Горгия живым и враждебный эпитет κατάρατος.
- source_word: τῶν ἱππέων τινὸς Θρακῶν
  choice: один из фракийских всадников
  rationale: Естественно передаёт принадлежность нападавшего к фракийской коннице.
- source_word: ἐπενεχθέντος αὐτῷ
  choice: бросился на Досифея
  rationale: Передаёт внезапное нападение; имя проясняет референт местоимения без изменения смысла.
- source_word: τὸν ὦμον καθελόντος
  choice: отсёк ему плечо
  rationale: Сохраняет графическую силу выражения, при этом точный анатомический результат греческой фразы остаётся не вполне определённым и отмечен сноской.
- source_word: διέφυγεν Γοργίας εἰς Μαρισά
  choice: Горгий бежал в Марису
  rationale: Прямо передаёт успешное спасение бегством и направление движения.
