  yaml_path: translation/deuterocanon/2_maccabees/012/035.yaml
  text: But a certain Dositheus[a], one of Bacenor’s men, a horseman and a strong man, had hold of Gorgias; and seizing his cloak, he was dragging him along forcefully, intending to take the accursed man alive, when one of the Thracian horsemen rushed upon him and cut off his shoulder, and Gorgias escaped to Marisa.
translation:
  language: ru
  text: Но некий Досифей, один из людей Вакенора, всадник, человек крепкий, держал Горгия; схватив его за плащ, он с силой тащил его, желая взять этого проклятого живым. Но один из фракийских всадников бросился на Досифея и отсёк ему плечо[a], и Горгий спасся бегством в Марису.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нанёс ему сокрушительный удар по плечу»; греческое выражение описывает тяжёлое ранение в области плеча, но точный характер повреждения неясен.'
