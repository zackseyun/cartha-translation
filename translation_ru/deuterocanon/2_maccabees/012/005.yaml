  text: Но Иуда, узнав о жестокости, совершённой против его соплеменников, и отдав распоряжения людям, бывшим при нём,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταλαβών
  choice: узнав
  rationale: В данном контексте причастие означает получение известия или сведений о случившемся; «узнав» естественно передаёт это по-русски.
- source_word: τὴν γεγονυῖαν ... ὠμότητα
  choice: о жестокости, совершённой
  rationale: Конструкция указывает на имевший место акт жестокости; такое выражение сохраняет событийный и намеренный характер произошедшего.
- source_word: τοὺς ὁμοεθνεῖς
  choice: его соплеменников
  rationale: Термин обозначает людей того же народа; местоимение проясняет естественную связь с Иудой, не добавляя конфессионального оттенка.
- source_word: τοῖς περὶ αὐτὸν ἀνδράσιν
  choice: своим воинам
  rationale: Буквально это «мужи при нём», но в военном повествовательном контексте речь идёт о людях его отряда; «воинам» звучит естественно и точно по функции.
