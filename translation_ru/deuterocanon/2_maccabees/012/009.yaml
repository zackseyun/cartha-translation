lexical_decisions:
- source_word: τοῖς Ἰαμνίταις
  choice: на жителей Иамнии
  rationale: Дательный падеж при ἐπιβαλών обозначает тех, на кого было совершено нападение; такой оборот естественен в современном русском языке.
- source_word: νυκτὸς ἐπιβαλὼν
  choice: напав ночью
  rationale: Кратко и естественно передаёт ночное военное нападение, сохраняя причастную связь с последующим действием.
- source_word: ἐνέπρησεν
  choice: поджёг
  rationale: Глагол обозначает преднамеренное предание огню и точно сочетается с гаванью и флотом.
- source_word: τὸν λιμένα σὺν τῷ στόλῳ
  choice: гавань вместе с флотом
  rationale: λιμήν передано конкретным словом «гавань», а στόλος — как совокупность находившихся там кораблей.
- source_word: τὰς αὐγὰς τοῦ φέγγους
  choice: отблески пламени
  rationale: αὐγαί передаёт лучи или отблески света; контекст пожара позволяет естественно обозначить его источник словом «пламя», не меняя образа.
- source_word: εἰς τὰ Ἱεροσόλυμα
  choice: даже в Иерусалиме
  rationale: Оборот указывает, что свет был заметен на всём расстоянии до Иерусалима; русская формулировка ясно выражает дальность видимости.
- source_word: σταδίων ὄντων διακοσίων τεσσεράκοντα
  choice: находившемся в двухстах сорока стадиях оттуда
  rationale: Родительный абсолют сообщает расстояние между местом пожара и Иерусалимом без добавления отсутствующей в греческом тексте уступительности.
