  text: Итак, все прославили деяния Господа — праведного Судьи[a], Который делает тайное явным,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что относится к Господу, праведному Судье»; возможны также: «дела» или «пути Господа». Греческое выражение эллиптично: буквально «то, что [принадлежит] Господу, праведному Судье».'
    reason: Сохраняет синтаксическую и смысловую неопределённость τὰ τοῦ δικαιοκρίτου κυρίου, не превращая Господа в прямое дополнение глагола «прославили».
lexical_decisions:
- source_word: πάντες οὖν
  choice: Итак, все
  rationale: οὖν обозначает вывод или следствие из предшествующего повествования; «итак» естественно передаёт эту связь. πάντες передано прямо как «все».
- source_word: εὐλογήσαντες
  choice: прославили
  rationale: В обращённом к Богу контексте εὐλογέω означает благословлять, восхвалять. Русское «прославили» естественно сочетается с деяниями Бога и сохраняет религиозный оттенок.
- source_word: τὰ τοῦ δικαιοκρίτου κυρίου
  choice: деяния Господа — праведного Судьи
  rationale: Сочетание τὰ с родительным падежом эллиптично и буквально указывает на «то, что относится к Господу». «Деяния» даёт естественный в контексте смысл, не скрывая в сноске возможного иного синтаксического понимания.
- source_word: δικαιοκρίτου
  choice: праведного Судьи
  rationale: Сложное слово обозначает того, кто судит праведно и справедливо. «Праведный Судья» сохраняет связь с библейской лексикой праведности.
- source_word: κυρίου
  choice: Господа
  rationale: κύριος здесь является почтительным божественным титулом, поэтому передано традиционным и понятным словом «Господь».
- source_word: τὰ κεκρυμμένα
  choice: тайное
  rationale: Субстантивированное причастие во множественном числе обозначает скрытое или сокрытые вещи. Русское собирательное «тайное» звучит естественно и сохраняет смысл.
- source_word: φανερὰ ποιοῦντος
  choice: делает … явным
  rationale: 'Оборот буквально выражает причинное действие: Господь делает скрытое открытым, видимым. «Делает тайное явным» прямо сохраняет эту конструкцию.'
theological_decisions:
- issue: Эллиптическое выражение τὰ τοῦ δικαιοκρίτου κυρίου
  choice: деяния Господа — праведного Судьи
  alternative: воздали хвалу Господу, праведному Судье
  rationale: Грамматически τὰ служит прямым дополнением, а последующий родительный падеж указывает на Господа; подразумеваемое существительное не названо. Основной текст передаёт вероятный смысл через «деяния», а сноска сохраняет иную возможность, не разрешая неоднозначность безоговорочно.
- issue: Характер Божьего суда в δικαιοκρίτου
  choice: праведного Судьи
  alternative: справедливого Судьи
  rationale: «Праведный» сохраняет богословски значимую связь с группой слов δικαιο-, тогда как «справедливый» точнее подчёркивал бы лишь беспристрастность суда.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Прописные буквы в «Господа», «Судьи» и «Который» подчёркивают божественный референт по принятой русской религиозной издательской традиции. Конечная запятая сохранена, поскольку стих синтаксически продолжается далее.
