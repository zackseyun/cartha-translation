    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ περὶ τὸν Ἰούδαν
  choice: А те, кто был с Иудой
  rationale: Оборот περὶ с винительным при имени предводителя обозначает связанных с ним людей. Формулировка естественна по-русски и не уточняет сверх текста, что речь непременно идёт только о воинах.
- source_word: ἐπικαλεσάμενοι
  choice: призвав
  rationale: Средний залог здесь передаёт обращение за помощью, то есть молитвенное взывание; «призвав» кратко и ясно сохраняет этот смысл.
- source_word: τὸν μέγαν τοῦ κόσμου δυνάστην
  choice: великого Владыку мира
  rationale: δυνάστης обозначает могущественного правителя; «Владыка» передаёт власть и величие, оставаясь понятным и достойным по регистру.
- source_word: τὸν ἄτερ κριῶν καὶ μηχανῶν ὀργανικῶν
  choice: без таранов и осадных машин
  rationale: κριοί в военном контексте — тараны, а μηχαναί ὀργανικαί — сооружённые механические приспособления для осады. Такой перевод точен и естественен.
- source_word: κατακρημνίσαντα
  choice: низверг
  rationale: Глагол выражает резкое низвержение или обрушение; «низверг» сохраняет силу образа падения Иерихона.
- source_word: τὴν Ἰερειχὼ
  choice: Иерихон
  rationale: Традиционная русская форма библейского топонима.
- source_word: κατὰ τοὺς Ἰησοῦ χρόνους
  choice: во времена Иисуса Навина
  rationale: Упоминание падения Иерихона однозначно указывает на Иисуса Навина. Полная русская форма исключает смешение с Иисусом Христом.
- source_word: ἐνέσεισαν θηριωδῶς τῷ τείχει
  choice: яростно обрушились на стену
  rationale: ἐνέσεισαν буквально связано с сотрясением или сильным ударом, а θηριωδῶς — со звериной свирепостью. В контексте приступа «яростно обрушились» естественно передаёт мощную атаку, не вводя конкретного осадного приёма.
theological_decisions:
- issue: Кого обозначает Ἰησοῦ в указании на время падения Иерихона
  choice: Иисус Навин
  alternative: Иисус
  rationale: Контекст падения Иерихона несомненно отсылает к Иисусу Навину. Стандартная русская форма имени передаёт исторического референта и не создаёт ложной отсылки к Иисусу Христу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет развернутое определение Владыки мира, но оформлен тире для ясного чтения. Прописная буква в «Того, Кто» обозначает отнесённость определения к Богу, не добавляя конфессионально специфического толкования.
