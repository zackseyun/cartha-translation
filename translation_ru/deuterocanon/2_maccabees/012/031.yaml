  source_fidelity: В тексте необоснованно добавлено дополнение «их» к εὐχαριστήσαντες, хотя в греческом получатель благодарности не назван. Кроме того, «поскольку» придаёт генитиву абсолютному причинное значение, тогда как здесь он обозначает сопутствующее время. Остальные основные соответствия — «заранее попросив их», «впредь», «благосклонно относиться к народу» и «приближался» — приемлемо передают греческий текст.
  naturalness: «Выразив благодарность» позволяет по-русски сохранить отсутствие названного адресата. «Когда приближался праздник Недель» естественно передаёт временное обстоятельство. Строчная буква в описательном названии праздника уместна; традиционное название разъяснено в примечании.
  terminology: «Народ» адекватно передаёт γένος в данном контексте. «Праздник Недель» сохраняет описательное греческое название; «Пятидесятница» оставлена как традиционное пояснение, а не подстановка в основной текст.
