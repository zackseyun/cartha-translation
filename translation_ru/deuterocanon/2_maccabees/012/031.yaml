  yaml_path: translation/deuterocanon/2_maccabees/012/031.yaml
  text: After giving thanks and urging them beforehand also in the future to be well-disposed toward the nation[a], they came to Jerusalem, as the feast of weeks was approaching.
translation:
  language: ru
  text: Выразив благодарность и заранее попросив их впредь благосклонно относиться к народу, они пришли в Иерусалим, когда приближался праздник Недель[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Пятидесятница.
    reason: Традиционное название праздника поясняет буквальное греческое выражение «праздник Недель».
lexical_decisions:
- source_word: εὐχαριστήσαντες
  choice: возблагодарив их
  rationale: Аористное причастие обозначает действие, предшествующее приходу в Иерусалим. Хотя дополнение в греческом формально не выражено, ближайший контекст и следующее προπαρακαλέσαντες естественно указывают на тех же людей; русский переходный глагол требует ясного оформления объекта.
- source_word: προπαρακαλέσαντες
  choice: заранее попросив их
  rationale: Передаёт как побудительное значение παρακαλέω, так и временной оттенок приставки προ-; «попросив» естественно в контексте обращения к союзникам и не усиливает высказывание до жёсткого увещания.
- source_word: εἰς τὰ λοιπά
  choice: и впредь
  rationale: Устойчивое обстоятельственное выражение со значением «в дальнейшем», «отныне»; краткое современное русское соответствие.
- source_word: πρὸς τὸ γένος
  choice: к народу
  rationale: В данном историческом контексте γένος означает еврейский народ как этническую общность; «народ» избегает биологизирующего оттенка слова «раса».
- source_word: εὐμενεῖς εἶναι
  choice: благосклонно относиться
  rationale: Естественно передаёт благожелательное, дружественное расположение, выраженное εὐμενής.
- source_word: παρεγενήθησαν
  choice: они пришли
  rationale: Простое повествовательное соответствие глаголу прибытия; «прибыли» было бы несколько более официальным.
- source_word: τῆς τῶν ἑβδομάδων ἑορτῆς
  choice: Праздник недель
  rationale: Прямо передаёт греческое описательное название иудейского праздника, не подменяя его традиционным названием «Пятидесятница».
- source_word: οὔσης ὑπογύου
  choice: приближался
  rationale: Генитив абсолютный задаёт сопутствующее временное обстоятельство, а ὑπόγυος указывает, что праздник был уже близок.
theological_decisions:
- issue: Передача названия τῆς τῶν ἑβδομάδων ἑορτῆς
  choice: Праздник недель
  alternative: Пятидесятница
  rationale: Основной текст сохраняет буквальное название из греческого источника; традиционное название приводится в примечании для узнаваемости без замены исходной формулировки.
translation_notes:
  register: Современный литературный русский, ясный повествовательный синтаксис и умеренно торжественная библейская лексика. Название праздника оформлено с прописной буквы как собственное наименование.
