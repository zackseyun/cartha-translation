    reason: alternative_reading
lexical_decisions:
- source_word: ἀναζεύξαντές
  choice: снялись с места
  rationale: Причастие обозначает снятие лагеря и отправление в путь; русское выражение естественно передаёт этот военно-походный оттенок.
- source_word: ὥρμησαν
  choice: направились
  rationale: В повествовании о передвижении глагол указывает на целенаправленное движение к месту, а не обязательно на стремительный бросок или нападение.
- source_word: ἐπὶ Σκυθῶν πόλιν
  choice: к городу скифов
  rationale: Сохраняет описательное выражение греческого текста и передаёт ἐπί как направление движения, не подменяя его прямо именем собственным «Скифополь».
- source_word: ἀπέχουσαν
  choice: находившемуся ... от
  rationale: Естественная русская передача причастия, обозначающего расстояние города от Иерусалима.
- source_word: σταδίους ἑξακοσίους
  choice: в шестистах стадиях
  rationale: Древняя мера расстояния сохранена ради точности и прозрачности; современный пересчёт был бы приблизительным толкованием.
