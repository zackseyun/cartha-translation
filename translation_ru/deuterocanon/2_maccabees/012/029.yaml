  text: Then they broke camp from there and set out for the city of the Scythians[a], six hundred stadia from Jerusalem.
translation:
  language: ru
  text: Затем они снялись с места и направились к городу скифов[a], находившемуся в шестистах стадиях от Иерусалима.
