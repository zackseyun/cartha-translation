lexical_decisions:
- source_word: παραταξαμένους (παρατάσσω)
  choice: когда же они вступили в бой
  rationale: Аористное причастие среднего залога употреблено в военном контексте и может обозначать как построение в боевой порядок, так и вступление в сражение. Выбран естественный русский оборот, а более формальное значение отмечено в сноске.
- source_word: συνέβη
  choice: случилось так
  rationale: Сохранена безличная повествовательная конструкция греческого текста; формулировка естественна для современного литературного русского языка.
- source_word: πεσεῖν (πίπτω)
  choice: пали
  rationale: Сохранена военная идиома исходного текста. В данном контексте она, вероятно, подразумевает смерть, однако греческий глагол прямо не говорит «были убиты».
- source_word: ὀλίγους
  choice: несколько
  rationale: При субстантивированном прилагательном с родительным падежом это естественная русская передача значения «немногие из».
- source_word: τῶν Ἰουδαίων
  choice: иудеев
  rationale: «Иудеи» — устоявшееся и уместное для исторического контекста 2 Маккавейской книги этнорелигиозное обозначение.
