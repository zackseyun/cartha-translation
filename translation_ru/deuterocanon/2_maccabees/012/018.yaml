  text: But they did not catch Timotheus in those places[a], for he had then withdrawn from the places without accomplishing anything, though he had left a garrison in a certain place[b], and a very strong one at that.
translation:
  language: ru
  text: Но Тимофея в тех местах они не настигли[a], потому что он к тому времени ушёл оттуда, ничего не добившись, однако оставил в одном месте весьма сильный гарнизон[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не захватили Тимофея в тех местах». Греческий глагол может означать «настичь», «захватить» или «застать».'
    reason: lexical_alternative
  - marker: b
    text: Слова «весьма сильный» непосредственно характеризуют гарнизон, хотя по смыслу могут также подразумевать укреплённость места, где он был оставлен.
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέλαβον
  choice: не настигли
  rationale: В контексте военного преследования глагол означает настичь, захватить или застать; «не настигли» естественно передаёт то, что Тимофей успел уйти.
- source_word: ἐπὶ τῶν τόπων
  choice: в тех местах
  rationale: Сохранено множественное число и указание на ранее упомянутые места без излишнего уточнения.
- source_word: ἄπρακτον
  choice: ничего не добившись
  rationale: Передаёт состояние человека, ушедшего без результата, и естественно связывается с подлежащим Тимофей.
- source_word: ἐκ τῶν τόπων ἐκλελυκότα
  choice: ушёл оттуда
  rationale: В данном контексте причастие указывает, что Тимофей покинул эти места; «оттуда» устраняет тяжеловесный повтор, сохраняя смысл.
- source_word: καταλελοιπότα
  choice: оставил
  rationale: Причастие обозначает, что при своём уходе Тимофей оставил военную силу на месте.
- source_word: φρουράν
  choice: гарнизон
  rationale: В военном повествовании слово обозначает отряд, оставленный для охраны или удержания позиции.
- source_word: ἐν τινι τόπῳ
  choice: в одном месте
  rationale: Сохраняет неопределённость греческого выражения и звучит естественно по-русски.
- source_word: μάλιστα ὀχυράν
  choice: весьма сильный
  rationale: Прилагательное женского рода непосредственно согласуется с φρουράν; выражение характеризует гарнизон как особенно сильный, хотя может подразумеваться и укреплённость его позиции.
