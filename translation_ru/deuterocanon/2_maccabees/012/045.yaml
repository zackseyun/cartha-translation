base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/045.yaml
  text: for if he was looking to the splendid reward laid up for those who have fallen asleep in godliness[a], the thought was holy and devout. Therefore he made atonement for the dead[b], so that they might be released from sin.
translation:
  language: ru
  text: Ведь если он взирал на прекраснейшую награду, уготованную тем, кто почил в благочестии[a], то этот замысел был свят и благочестив. Поэтому он совершил искупление за умерших[b], чтобы они были освобождены от греха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «прекраснейший дар, уготованный». Греческое слово εὐχαριστήριον здесь необычно и может означать уготованное благо, дар или воздаяние.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «совершил очищение» либо «умилостивление» за умерших.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτε
  choice: ведь если
  rationale: Сохраняет условно-причинную связь с предшествующим рассуждением, не превращая условие в однозначное причинное утверждение.
- source_word: ἐμβλέπων
  choice: взирал на
  rationale: Передаёт направленное внимание к ожидаемому благу и сохраняет образность греческого глагола.
- source_word: τοῖς μετʼ εὐσεβίας κοιμωμένοις
  choice: тем, кто почил в благочестии
  rationale: «Почил» естественно сохраняет эвфемистический образ сна как смерти, а «в благочестии» выражает религиозно-нравственный характер их жизни и кончины.
- source_word: κάλλιστον ἀποκείμενον εὐχαριστήριον
  choice: прекраснейшую награду, уготованную
  rationale: «Прекраснейшую» отражает превосходную степень κάλλιστον, «уготованную» — идею отложенного и сохраняемого блага; «награда» даёт связный контекстуальный смысл необычному εὐχαριστήριον, чья неоднозначность отмечена в сноске.
- source_word: ὁσία καὶ εὐσεβὴς ἡ ἐπίνοια
  choice: этот замысел был свят и благочестив
  rationale: «Замысел» охватывает как мысль, так и намерение, а парные определения сохраняют нравственно-религиозную оценку оригинала.
- source_word: ὅθεν
  choice: поэтому
  rationale: Ясно передаёт вывод, следующий из предыдущей оценки замысла.
- source_word: περὶ τῶν τεθνηκότων
  choice: за умерших
  rationale: Естественно обозначает тех, ради кого совершается искупительное действие, не уточняя сверх текста механизм заместительности.
- source_word: τὸν ἐξιλασμόν ἐποιήσατο
  choice: совершил искупление
  rationale: Доступная современному читателю формулировка для культового действия, связанного с устранением греха; более узкие варианты оставлены в сноске.
- source_word: τῆς ἁμαρτίας ἀπολυθῆναι
  choice: чтобы они были освобождены от греха
  rationale: Сохраняет пассивную конструкцию и целевое либо результативное значение инфинитива, не добавляя отсутствующих в греческом тексте уточнений.
theological_decisions:
- issue: Посмертная польза искупительного действия за умерших
  choice: Прямо передано, что искупление было совершено за умерших, чтобы они были освобождены от греха.
  alternative: Понимать действие только как поминовение без посмертного освобождения либо истолковывать его через позднейшую разработанную доктрину посмертного очищения.
  rationale: Греческий текст прямо связывает искупление за умерших с освобождением от греха, но не раскрывает механизм и не формулирует позднейшую догматическую систему; перевод сохраняет это утверждение и его богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формы «почил», «благочестие», «искупление» понятны широкому читателю и сохраняют религиозный регистр; синтаксис остаётся ясным и не перегруженным.
