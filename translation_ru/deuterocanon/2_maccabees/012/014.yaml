base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/014.yaml
  text: But those inside[a], trusting in the strength of the walls and in the supply of provisions, treated Judas and his men more arrogantly, reviling them[b], and even blaspheming and speaking what is not lawful.
translation:
  language: ru
  text: 'А те, кто находился внутри, полагаясь на неприступность стен и запас продовольствия, обращались с Иудой и его людьми[a] ещё более дерзко: поносили их, к тому же богохульствовали и говорили то, чего говорить не дозволено.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с теми, кто был вокруг Иуды»; греческий оборот обозначает его спутников, сторонников или воинов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «говорили то, чего не следует говорить». Выражение несёт нравственный или религиозный оттенок недозволенности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἔνδον
  choice: А те, кто находился внутри
  rationale: Прямо передаёт пространственное значение выражения и указывает на защитников, находившихся внутри укрепления, не добавляя отсутствующих в греческом тексте уточнений.
- source_word: πεποιθότες
  choice: полагаясь
  rationale: Совершенное причастие выражает утвердившуюся уверенность; «полагаясь» естественно передаёт их устойчивую опору на укрепления и припасы.
- source_word: τῇ τῶν τειχέων ἐρυμνότητι
  choice: на неприступность стен
  rationale: ἐρυμνότης обозначает укреплённость, защищённость и труднодоступность; в контексте осады «неприступность» ясно передаёт военный смысл.
- source_word: τῇ τε τῶν βρωμάτων παραθέσει
  choice: и запас продовольствия
  rationale: βρώματα здесь означает пищевые припасы, а παράθεσις — их наличие или обеспечение ими; «запас продовольствия» естественен для контекста осады.
- source_word: ἀναυθαγέστερον ἐχρῶντο
  choice: обращались ... ещё более дерзко
  rationale: Сохраняет сравнительную степень наречия и выражает вызывающую, надменную манеру поведения.
- source_word: τοῖς περὶ τὸν Ἰούδαν
  choice: с Иудой и его людьми
  rationale: Греческий оборот обозначает Иуду вместе с окружавшими его сторонниками или воинами; такой перевод естественен по-русски и сохраняет групповой смысл.
- source_word: λοιδοροῦντες
  choice: поносили их
  rationale: Передаёт резкую словесную брань и насмешки, не ослабляя силу исходного слова.
- source_word: βλασφημοῦντες
  choice: богохульствовали
  rationale: Сохраняет возможный и вероятный религиозный смысл, отличая это действие от обычной брани, уже выраженной словом λοιδοροῦντες.
- source_word: λαλοῦντες ἃ μὴ θέμις
  choice: говорили то, чего говорить не дозволено
  rationale: θέμις указывает на то, что дозволено или подобает по нравственному и религиозному порядку; формулировка сохраняет этот оттенок, не уточняя сверх текста содержание речей.
theological_decisions:
- issue: Значение βλασφημοῦντες по отношению к λοιδοροῦντες
  choice: Передать отдельным религиозно окрашенным глаголом «богохульствовали»
  alternative: Передать как общее оскорбительное или злоречивое высказывание
  rationale: 'Последовательность усиливается: они поносили, затем также богохульствовали и произносили недозволенное. Отдельный перевод сохраняет возможную направленность хулы против Бога и не сводит всё к обычной брани.'
- issue: Сила выражения ἃ μὴ θέμις
  choice: «то, чего говорить не дозволено»
  alternative: «то, что противозаконно» или «то, чего не следует говорить»
  rationale: Исходное выражение может указывать не только на формальный закон, но и на нравственно-религиозную недозволенность. Выбранный вариант сохраняет эту широту и напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сохраняет нарастающий ряд словесных проступков, а формулировки остаются понятными без конфессионально специфической терминологии.
