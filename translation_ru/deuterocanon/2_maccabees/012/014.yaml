  text: οἱ δὲ ἔνδον πεποιθότες τῇ τῶν τειχέων ἐρυμνότητι τῇ τε τῶν βρωμάτων παραθέσει, ἀναυθαγέστερον ἐχρῶντο τοῖς περὶ τὸν Ἰούδαν, λοιδοροῦντες, καὶ προσέτι βλασφημοῦντες καὶ λαλούντες ἃ μὴ θέ- μις.
