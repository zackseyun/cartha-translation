revisions:
- from: Когда они, отойдя оттуда на девять стадиев, шли против Тимофея, на него[a] напали арабы — не менее пяти тысяч пеших и пятьсот всадников.
  to: 'Когда они, отойдя оттуда на девять стадиев, шли против Тимофея, на него[a] напали арабы: их было не меньше пяти тысяч, а всадников — пятьсот.'
  rationale: Удалено не имеющее прямого соответствия в оригинале слово «пеших». Численность арабов и число всадников переданы раздельно, без навязывания того, что пять тысяч обозначают именно пеших воинов. Сноска сохранена, поскольку она точно объясняет формальное единственное число греческого местоимения и не устраняет его контекстуальную неоднозначность.
