  yaml_path: translation/deuterocanon/2_maccabees/012/010.yaml
  text: From there[a], after they had gone nine stadia, while making their march against Timotheus, Arabs fell upon him, no fewer than five thousand, and five hundred horsemen.
translation:
  language: ru
  text: 'Когда они, отойдя оттуда на девять стадиев, шли против Тимофея, на него[a] напали арабы: их было не меньше пяти тысяч, а всадников — пятьсот.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте стоит местоимение единственного числа «на него» (αὐτῷ). По контексту его можно понимать как указание на Иуду вместе с его отрядом, поэтому в некоторых переводах стоит «на них».
    reason: Сохранение грамматического числа и указание на возможное собирательное понимание.
lexical_decisions:
- source_word: ἀποστάντες σταδίους ἐννέα
  choice: отойдя оттуда на девять стадиев
  rationale: Причастие обозначает удаление от прежнего места, а винительный меры — пройденное расстояние. Древняя единица сохранена без приблизительного пересчёта.
- source_word: ποιουμένων τὴν πορίαν
  choice: когда они … шли
  rationale: Родительный самостоятельный оборот передаёт сопутствующее продвижение отряда; по-русски естественно выражен придаточным времени.
- source_word: ἐπὶ τὸν Τιμόθεον
  choice: против Тимофея
  rationale: В военном контексте ἐπί с винительным указывает на враждебно направленное движение, а не просто на путь к человеку.
- source_word: ἐπέβαλον
  choice: напали
  rationale: Глагол обозначает внезапное враждебное нападение; современное «напали» точно и ясно передаёт действие.
- source_word: Ἄραβες
  choice: арабы
  rationale: Современное и прямое обозначение народа.
- source_word: αὐτῷ
  choice: на него
  rationale: Сохранено единственное число греческого местоимения, хотя по контексту нападению подвергался также возглавляемый им отряд.
- source_word: οὐκ ἐλάττους τῶν πεντακισχιλίων
  choice: не менее пяти тысяч пеших
  rationale: Оборот задаёт нижнюю границу численности. Слово «пеших» добавлено как естественное противопоставление отдельно названным всадникам, без изменения общей численности нападавших.
- source_word: ἱππεῖς δὲ πεντακόσιοι
  choice: и пятьсот всадников
  rationale: ἱππεῖς означает конных воинов; «всадники» ясно и конкретно передаёт это значение.
