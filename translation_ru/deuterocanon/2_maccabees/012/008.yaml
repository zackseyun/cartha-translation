lexical_decisions:
- source_word: μεταλαβὼν
  choice: Взявшись также за
  rationale: Передаёт переход к следующей группе как к новой цели действий Иуды, не уточняя сверх греческого текста характер военного действия; причастная конструкция остаётся незавершённой и продолжается в следующем стихе.
- source_word: τοὺς ἐν Ἰαμνίᾳ
  choice: тех, кто в Иамнии
  rationale: Сохраняет широкий референт греческой субстантивированной предложной группы, не подменяя его более узким словом «жители».
- source_word: τὸν αὐτὸν ... τρόπον
  choice: таким же образом
  rationale: Естественно передаёт буквальное значение «тем же способом / образом», сохраняя не названный прямо характер задуманного действия.
- source_word: ἐπιτελεῖν
  choice: поступить
  rationale: В сочетании с «таким же образом» естественно выражает намерение совершить соответствующее действие; более буквальное «осуществить» потребовало бы добавить отсутствующее в греческом существительное.
- source_word: βουλομένους
  choice: хотел
  rationale: Передаёт желание или намерение; единственное число согласовано с русской относительной конструкцией «кто» при собирательном значении.
- source_word: τοῖς κατοικοῦσιν Ἰουδαίοις
  choice: с жившими там иудеями
  rationale: Русская конструкция «поступить с» естественно передаёт направленность действия на местных иудеев; «там» ясно отсылает к Иамнии.
