lexical_decisions:
- source_word: Γενομένων
  choice: после заключения
  rationale: Родительный самостоятельный оборот с аористным причастием обозначает завершённое действие, предшествующее основным событиям; по-русски естественно передаётся конструкцией «после заключения».
- source_word: συνθηκῶν
  choice: соглашений
  rationale: Нейтрально передаёт договорённости или условия соглашения, не сужая смысл до межгосударственного договора и не привнося богословской окраски слова «завет».
- source_word: ἀπῆε
  choice: отправился
  rationale: В повествовательном контексте глагол указывает на отбытие; «отправился» звучит естественно и достойно в современном русском тексте.
- source_word: πρὸς τὸν βασιλέα
  choice: к царю
  rationale: πρός с винительным обозначает направление к лицу; указание «обратно» контекстуально возможно, но в греческом прямо не выражено.
- source_word: περὶ τὴν γεωργίαν ἐγίνοντο
  choice: занялись земледелием
  rationale: Сочетание передаёт вовлечённость в сельскохозяйственные работы. «Занялись земледелием» естественно выражает начало или возобновление этой деятельности.
