lexical_decisions:
- source_word: ἐπικαλεσάμενος
  choice: призвав
  rationale: Передаёт обращение к Богу за помощью и к правосудию; деепричастие сохраняет последовательность действий греческого текста.
- source_word: τὸν δίκαιον κριτὴν θεόν
  choice: Бога, праведного Судью
  rationale: Естественная русская аппозиция сохраняет и нравственный, и судебный смысл δίκαιος и κριτής.
- source_word: παραγενόμενος ἐπὶ
  choice: выступил против
  rationale: В военном контексте выражает направленное враждебное движение, не добавляя подробностей о способе нападения.
- source_word: τοὺς μιαιφόνους τῶν ἀδελφῶν
  choice: убийц своих братьев
  rationale: Сильное μιαιφόνος естественно передано словом «убийцы»; «своих» проясняет подразумеваемую связь Иуды с братьями-соплеменниками, не заменяя образ родства толкованием.
- source_word: τὸν μὲν λιμένα νύκτωρ ἐνέπρησεν
  choice: ночью поджёг гавань
  rationale: Сохраняет временное обстоятельство и каузативное значение «предал огню» в ясной современной формулировке.
- source_word: τὰ σκάφη κατέφλεξεν
  choice: сжёг суда
  rationale: σκάφη обозначает плавательные суда; глагол передаёт их уничтожение огнём и отличается от предшествующего «поджёг».
- source_word: τοὺς δὲ ἐκεῖ συμφυγόντας
  choice: тех, кто бежал туда
  rationale: Передаёт движение беглецов к этому месту; оттенок совместного бегства или поиска убежища отмечен в сноске.
- source_word: ἐξεκέντησεν
  choice: пронзил
  rationale: Сохраняет конкретный образ поражения острым оружием, не уточняя не названный в тексте вид оружия.
theological_decisions:
- issue: Характеристика Бога как Судьи в контексте возмездия
  choice: Бога, праведного Судью
  alternative: Бога, справедливого Судью
  rationale: «Праведный» сохраняет широкий нравственно-судебный смысл δίκαιος. Перевод оставляет рядом обращение к Божьему суду и последующее насилие, не превращая повествование в дополнительную богословскую оценку действий Иуды.
translation_notes:
