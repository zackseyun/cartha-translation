  to: Они обратились с мольбой, прося, чтобы совершённый грех был полностью изглажен. Доблестный же Иуда призвал народ беречь себя от греха[a], ведь они своими глазами видели, что произошло из-за греха павших.
  rationale: Убрано невыраженное в стихе временное уточнение «Тогда». Формула о нравственном состоянии заменена на естественное современное «беречь себя от греха», а более буквальные варианты сохранены в сноске. Смысл, образ полного изглаживания греха, военный оттенок «павших» и неоднозначность ἀναμαρτήτους сохранены.
