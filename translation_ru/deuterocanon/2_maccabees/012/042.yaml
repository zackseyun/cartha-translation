  yaml_path: translation/deuterocanon/2_maccabees/012/042.yaml
  text: they turned to supplication[a], asking that the sin that had been committed might be completely blotted out. But the noble Judas urged the multitude to keep themselves free from sin, since they had seen before their eyes the things that had happened because of the sin of those who had fallen.
translation:
  language: ru
  text: Они обратились с мольбой, прося, чтобы совершённый грех был полностью изглажен. Доблестный же Иуда призвал народ беречь себя от греха[a], ведь они своими глазами видели, что произошло из-за греха павших.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сохранять себя безгрешными» или «хранить себя свободными от греха».'
    reason: Лексическая альтернатива для более буквальной передачи ἀναμαρτήτους; основной текст передаёт увещательный смысл естественной русской идиомой.
lexical_decisions:
- source_word: εἰς ἱκεσίαν ἐτράπησαν
  choice: обратились с мольбой
  rationale: Передаёт направленное, настойчивое прошение, выраженное словом ἱκεσία, и естественно звучит по-русски.
- source_word: ἀξιώσαντες
  choice: прося
  rationale: Причастие вводит содержание обращения; «прося» точно и без неоправданного усиления передаёт его функцию.
- source_word: τὸ γεγονὸς ἁμάρτημα
  choice: совершённый грех
  rationale: Кратко и естественно передаёт грех как уже совершившийся поступок.
- source_word: τελείως ἐξαλειφθῆναι
  choice: был полностью изглажен
  rationale: «Изглажен» сохраняет образ стирания или устранения, заключённый в ἐξαλείφω, а «полностью» передаёт τελείως.
- source_word: ὁ δὲ γενναῖος Ἰούδας
  choice: Доблестный же Иуда
  rationale: «Доблестный» сочетает нравственно-похвальный и героический оттенки γενναῖος; частица «же» сохраняет переход δέ.
- source_word: παρεκάλεσε τὸ πλῆθος
  choice: призвал народ
  rationale: В контексте παρακαλέω имеет побудительный смысл; «народ» естественнее буквального «множество» и обозначает собравшихся людей.
- source_word: συντηρεῖν αὐτοὺς ἀναμαρτήτους εἶναι
  choice: хранить себя незапятнанными грехом
  rationale: Сохраняет значение поддержания себя в состоянии ἀναμάρτητοι, не превращая выражение в утверждение об абсолютном безгрешии.
- source_word: ὑπʼ ὄψιν ἑωρακότας
  choice: своими глазами видели
  rationale: Естественный русский эквивалент, сохраняющий акцент на непосредственном зрительном свидетельстве.
- source_word: τὰ γεγονότα
  choice: что произошло
  rationale: Идиоматично передаёт субстантивированное причастие и совершившиеся события.
- source_word: διὰ τὴν τῶν προπεπτωκότων ἁμαρτίαν
  choice: из-за греха павших
  rationale: «Павших» сохраняет контекст гибели в бою, а причинная связь с их грехом остаётся явной.
theological_decisions:
- issue: Значение нравственного состояния в ἀναμαρτήτους
  choice: «незапятнанными грехом»
  alternative: «безгрешными» / «свободными от греха»
  rationale: Выбранная формулировка передаёт призыв избегать греха, ставшего причиной бедствия, но не навязывает чтение об абсолютном безгрешном совершенстве.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования; синтаксис ясен для широкого круга читателей, при этом сохранены образ изглаживания греха и неоднозначность ἀναμαρτήτους.
