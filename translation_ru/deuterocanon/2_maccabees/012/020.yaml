    text: 'В греческом тексте буквально: «двенадцать мириад пехотинцев» (то есть 120 000), «две тысячи всадников и вдобавок семь тысяч». К какому роду войск относились последние семь тысяч, не уточняется.'
    reason: alternative_reading
lexical_decisions:
- source_word: διατάξας τὴν περὶ αὐτὸν στρατιὰν σπειρηδόν
  choice: выстроив бывшее с ним войско по отрядам
  rationale: Аористное причастие обозначает предшествующее построение войска; σπειρηδόν передаёт деление на воинские подразделения без навязывания узкого римского термина.
- source_word: κατέστησεν αὐτοὺς ἐπὶ τῶν σπειρῶν
  choice: поставил их напротив вражеских отрядов
  rationale: В военном контексте ἐπί указывает на противостоящее расположение. Слово «вражеских» эксплицирует подразумеваемую принадлежность вторых отрядов и делает сжатую греческую фразу понятной.
- source_word: ὥρμησαν
  choice: устремились
  rationale: Глагол выражает стремительное наступательное движение; «устремились» сохраняет силу образа, не уточняя способ атаки сверх источника.
- source_word: μυριάδας δώδεκα πεζῶν
  choice: сто двадцать тысяч пехотинцев
  rationale: Двенадцать мириад точно соответствуют 120 000; цифровое значение естественнее и понятнее современному русскому читателю.
- source_word: ἱππεῖς δὲ δισχιλίους
  choice: две тысячи всадников
  rationale: Прямой и доступный эквивалент обозначения конных воинов.
- source_word: καὶ πρὸς τοῖς ἑπτακισχιλίοις
  choice: и вдобавок ещё семь тысяч воинов
  rationale: Оборот имеет добавочное значение, но в греческом тексте не назван род этих дополнительных воинов; обобщающее «воинов» сохраняет эту неопределённость.
