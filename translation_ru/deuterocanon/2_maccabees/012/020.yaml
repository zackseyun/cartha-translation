    rationale: Греческое καὶ πρὸς τοῖς ἑπτακισχιλίοις буквально содержит лишь добавочное указание на «семь тысяч»; род или статус этой группы не назван. Сноска признаёт эту неопределённость, но основной текст её снимает.
  - severity: low
    issue: «Поставил их» можно улучшить до «расставил их».
    rationale: κατέστησεν в контексте построения войска обозначает размещение/развёртывание; «расставил» яснее передаёт это по-русски, не расширяя смысл.
