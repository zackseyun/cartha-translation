  to: Маккавей, выстроив бывшее с ним войско по отрядам, расставил их напротив отрядов. Затем они устремились на Тимофея, при котором было сто двадцать тысяч пехотинцев, две тысячи всадников и вдобавок ещё семь тысяч.[a]
