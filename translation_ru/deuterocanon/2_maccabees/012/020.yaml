  verdict: revise
  source_fidelity: 'Числа переданы верно: двенадцать мириад пехоты — 120 000, затем 2 000 всадников, а последняя группа в 7 000 дана как добавочная. Однако «семь тысяч воинов» добавляет существительное, отсутствующее в эллиптической греческой фразе καὶ πρὸς τοῖς ἑπτακισχιλίοις, хотя сноска справедливо отмечает неопределённость рода войск. Его следует не восполнять в основном тексте.'
  naturalness: Текст в целом естественен для современного литературного русского. «Расставил их напротив отрядов» точнее передаёт военное развёртывание и звучит немного естественнее, чем «поставил их».
  terminology: «Войско», «отряды», «пехотинцы» и «всадники» уместны. Не следует называть последние семь тысяч «воинами», поскольку исходный текст после числительного не указывает ни род войск, ни даже повторно не выражает существительное.
  issues:
