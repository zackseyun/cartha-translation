base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/012/024.yaml
  text: But Timothy himself[a], having fallen into the hands of those with Dositheus and Sosipater, begged with much cunning to be let go unharmed, because he had the parents of many of them, and of others their brothers[b], and it would happen that these would be disregarded.
translation:
  language: ru
  text: Сам же Тимофей попал в руки людей Досифея и Сосипатра и с великим лукавством[a] умолял отпустить его невредимым, потому что держал в своей власти родителей многих, а братьев — других; и случится, что с ними не посчитаются[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с великой хитростью» либо «прибегая ко многим уловкам». Греческое γοητία здесь, вероятно, означает обманное, искусное убеждение, а не буквальное колдовство.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая фраза сжата: Тимофей утверждает, что удерживает в своей власти родителей многих и братьев других; если его убьют, с судьбой этих родственников могут не считаться.'
    reason: clarification
lexical_decisions:
- source_word: ἐμπεσὼν τοῖς περὶ τὸν Δωσίθεον καὶ Σωσίπατρον
  choice: попал в руки людей Досифея и Сосипатра
  rationale: Оборот передаёт попадание Тимофея под власть группы, связанной с Досифеем и Сосипатром; «попал в руки» естественно выражает подразумеваемый захват.
- source_word: ἠξίου
  choice: умолял
  rationale: В положении пленника глагол обозначает настойчивую просьбу; «умолял» передаёт её силу без лишнего добавления.
- source_word: μετὰ πολλῆς γοητίας
  choice: с великим лукавством
  rationale: γοητία здесь указывает на хитрое, обманное убеждение, а не обязательно на буквальное колдовство.
- source_word: ἐξαφεῖναι ὡς σῷον αὐτόν
  choice: отпустить его невредимым
  rationale: Передаёт просьбу об освобождении с сохранением жизни и телесной неприкосновенности.
- source_word: διὰ τὸ πλειόνων μὲν γονεῖς, ὧν δὲ ἀδελφοὺς ἔχειν
  choice: потому что держал в своей власти родителей многих из них, а у других — братьев
  rationale: ἔχειν в контексте означает удерживать или контролировать родственников; добавление «в своей власти» раскрывает подразумеваемый смысл без утверждения не названного прямо статуса заложников.
- source_word: ἀλογηθῆναι συμβήσεται
  choice: иначе с ними могли не посчитаться
  rationale: ἀλογέω означает не принимать в расчёт, считать незначимым; русское выражение естественно передаёт угрозу пренебречь судьбой родственников.
