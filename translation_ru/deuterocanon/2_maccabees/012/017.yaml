lexical_decisions:
- source_word: ἀποσπάσαντες
  choice: выступив
  rationale: Причастие буквально передаёт удаление или отход от места; в контексте военного путешествия «выступив» естественно обозначает начало перехода, не усиливая значение до явно боевого марша.
- source_word: σταδίους ἑπτακοσίους πεντήκοντα
  choice: семьсот пятьдесят стадиев
  rationale: Сохранена древняя мера расстояния, прямо указанная в греческом тексте; современный пересчёт не внесён в основной текст.
- source_word: διήνυσαν
  choice: прошли
  rationale: Глагол означает преодолеть или пройти указанное расстояние; «прошли» естественно сочетается с мерой пути и сохраняет значение завершённого перехода.
- source_word: εἰς τὸν Χάρακα
  choice: прибыли в Харакс
  rationale: Предлог εἰς выражает направленное движение, а форма «в Харакс» естественна для прибытия в населённый пункт; название передано транслитерацией.
- source_word: τοὺς λεγομένους Τουβιηνοὺς Ἰουδαίους
  choice: к иудеям, называемым тувиянами
  rationale: λεγομένους передано нейтральным «называемым», без отрицательного оттенка «так называемым». Этноним Τουβιηνοί передан русской транслитерацией «тувияне», а не истолкован как «Товиады».
