lexical_decisions:
- source_word: Ἐπέβαλεν
  choice: выступил против
  rationale: Глагол обозначает направленное против кого-либо военное действие; этот вариант передаёт наступление, не уточняя преждевременно способ нападения.
- source_word: ἐπί τινα πόλιν
  choice: против одного города
  rationale: Сохраняет неопределённость τινα и естественно вводит ранее не упомянутый город.
- source_word: γεφυρῶν
  choice: города мостов
  rationale: Сжатая родительная конструкция сохранена как описательное обозначение города, примечательного мостами или мостовыми сооружениями.
- source_word: ὀχυρὰν
  choice: хорошо укреплённого
  rationale: Передаёт оборонительную мощь города современным и естественным русским выражением.
- source_word: τείχεσιν περιτεφραγμένην
  choice: окружённого стенами
  rationale: Точно передаёт образ города, со всех сторон ограждённого крепостными стенами.
- source_word: παμμιγέσιν ἔθνεσιν
  choice: населённого смешением разных народов
  rationale: Передаёт одновременно значение полного смешения в παμμιγής и этническую множественность ἔθνεσιν, избегая двусмысленного русского выражения «смешанные народы».
- source_word: κατοικουμένην
  choice: населённого
  rationale: Естественно передаёт пассивное причастие, описывающее состав жителей города.
- source_word: ὄνομα δὲ Κασπείν
  choice: имя ему было Каспин
  rationale: Сохраняет явную греческую формулу именования и литературно звучит по-русски.
