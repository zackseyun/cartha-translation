  verdict: revise
  source_fidelity: '«Выступил также против некоего города» точно передаёт военную направленность Ἐπέβαλεν и неопределённое τινα. «Хорошо укреплённого и окружённого стенами» верно отражает ὀχυράν и τείχεσιν περιτεφραγμένην. Выражение «населённого смешением разных народов» передаёт παμμιγέσιν ἔθνεσιν, но по-русски неестественно: город населён людьми, а не «смешением». Необычный генитив γεφυρῶν лучше передать естественным основным текстом «города с мостами», сохранив более буквальное, но стилистически отмеченное «города мостов» в сноске.'
