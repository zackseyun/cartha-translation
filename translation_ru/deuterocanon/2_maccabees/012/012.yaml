  yaml_path: translation/deuterocanon/2_maccabees/012/012.yaml
  text: But Judas[a], recognizing that they were truly useful to them in many ways, agreed to keep peace with them; and after giving right hands, they parted to their tents.
translation:
  language: ru
  text: Иуда же, поняв, что они и в самом деле во многом полезны, согласился сохранять с ними мир. Пожав друг другу руки[a], они разошлись по своим шатрам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дав друг другу правые руки» — обычный жест, которым скрепляли обещание или соглашение.'
    reason: cultural_note
lexical_decisions:
- source_word: ὑπολαβών
  choice: поняв
  rationale: Причастие передаёт обдуманную оценку Иудой обстоятельств; «поняв» естественно выражает этот смысл, не сводя его к простому предположению.
- source_word: ὡς ἀληθῶς
  choice: и в самом деле
  rationale: Устойчивое современное выражение сохраняет усилительное значение греческого оборота.
- source_word: ἐν πολλοῖς
  choice: во многом
  rationale: 'Передаёт широкий идиоматический смысл: полезность во многих отношениях, без неоправданной конкретизации.'
- source_word: χρησίμους
  choice: могут быть им полезны
  rationale: «Полезны» непосредственно передаёт практическую выгоду; модальная конструкция естественна по-русски и отражает оценку возможной пользы в данных обстоятельствах.
- source_word: ὑπεχώρησεν εἰρήνην ἄξειν πρὸς αὐτούς
  choice: согласился сохранять с ними мир
  rationale: ὑπεχώρησεν обозначает уступку или согласие, а εἰρήνην ἄξειν — поддержание мирных отношений; перевод сохраняет оба элемента.
- source_word: λαβόντες δεξιάς
  choice: пожав друг другу руки
  rationale: Естественно передаёт буквальный жест взаимного заверения, выраженный греческим оборотом.
- source_word: εἰς τὰς σκηνὰς ἐχωρίσθησαν
  choice: разошлись по своим шатрам
  rationale: Сохраняет значение разделения и возвращения участников к шатрам в военном лагере.
theological_decisions:
- issue: Дипломатический жест в λαβόντες δεξιάς
  choice: Сохранить в основном тексте конкретный образ рукопожатия и пояснить его значение в сноске
  alternative: 'Передать только отвлечённый смысл: «заключив соглашение» или «дав друг другу обещание»'
  rationale: Конкретный исторический жест важен для прозрачности перевода, тогда как его передача лишь как договора внесла бы более узкий юридический смысл, которого греческий текст прямо не уточняет.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Союз «же» сохраняет повествовательную связь, «шатры» — историческую обстановку; синтаксис сделан естественным для широкого круга читателей.
