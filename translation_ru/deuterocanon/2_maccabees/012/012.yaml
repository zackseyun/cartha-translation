  source_fidelity: 'В «могут быть им полезны» добавлены модальность («могут») и невыраженный в греческом тексте адресат пользы («им»). Греческое χρησίμους при ἐν πολλοῖς утверждает, что они действительно полезны «во многом»; контекстуальный адресат может оставаться неявным. Остальные элементы переданы точно: оценка Иуды, поддержание мира, взаимный жест правых рук и расхождение к шатрам.'
