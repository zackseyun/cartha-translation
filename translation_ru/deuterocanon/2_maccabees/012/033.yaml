  text: Тогда он выступил с тремя тысячами пеших воинов и четырьмястами всадников.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: выступил
  rationale: Аорист ἐξέρχομαι обозначает выход; в данном военном контексте «выступил» естественно передаёт начало движения войска, не добавляя идеи сражения.
- source_word: μετὰ
  choice: с
  rationale: Предлог выражает сопровождение; простое «с» точно и естественно передаёт эту связь.
- source_word: πεζῶν
  choice: пеших воинов
  rationale: Слово обозначает воинов, передвигающихся пешком, в противопоставлении коннице; «пешие воины» ясно сохраняет указание на людей, а не на собирательный род войск.
- source_word: τρισχιλίων
  choice: тремя тысячами
  rationale: Числительное передано прямо, в форме творительного падежа после предлога «с».
- source_word: ἱππέων
  choice: всадников
  rationale: ἱππεύς обозначает конного воина; «всадники» естественно передаёт людей, а не собирательное понятие «конница».
- source_word: τετρακοσίων
  choice: четырьмястами
  rationale: Числительное передано прямо, с нормативной формой творительного падежа.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой повествовательной формулировкой и сохранением военного контекста. Союз δέ передан как «тогда», чтобы естественно связать стих с предшествующим повествованием; повтор δέ перед вторым числом по-русски не воспроизводится, поскольку обычное соединение через «и» яснее.
