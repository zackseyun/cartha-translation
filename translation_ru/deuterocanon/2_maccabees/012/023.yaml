lexical_decisions:
- source_word: ἐποίει ... τὸν διωγμόν
  choice: продолжал преследование
  rationale: Греческое сочетание обозначает ведение или продолжение погони; такой перевод естественен по-русски и не воспроизводит оборот буквально.
- source_word: εὐτονώτερον
  choice: всё настойчивее
  rationale: Сравнительная форма передаёт усиление энергии и напора преследования; «всё настойчивее» ясно выражает нарастание действия.
- source_word: συνετίνων
  choice: разя
  rationale: В военном контексте причастие описывает энергичное поражение противника. «Разя» сохраняет силу образа, не уточняя оружие или конкретный способ убийства.
- source_word: τοὺς ἀλιτηρίους
  choice: негодяев
  rationale: Слово содержит резкую нравственную оценку. «Негодяи» передаёт осуждающий тон, не придавая выражению узко юридического или конфессионального смысла.
- source_word: διέφθειρεν
  choice: истребил
  rationale: В рассказе о сражении глагол означает погубить или уничтожить множество людей; «истребил» соответствует военному контексту и силе греческого слова.
- source_word: εἰς μυριάδας τρεῖς ἀνδρῶν
  choice: до тридцати тысяч человек
  rationale: Сохранившийся греческий текст буквально говорит о трёх мириадах, то есть о тридцати тысячах. Основной текст следует засвидетельствованному чтению, а контекстуально трудное альтернативное понимание отмечено в сноске.
