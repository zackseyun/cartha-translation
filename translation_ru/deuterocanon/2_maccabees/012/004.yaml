  terminology: «Постановление», «увели», «утопили» и «не менее двухсот человек» удачно соответствуют греческому тексту и современному литературному регистру. «Общее постановление города» точнее передаёт τὸ κοινὸν τῆς πόλεως ψήφισμα.
