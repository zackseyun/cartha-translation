  source_fidelity: 'Смысл в целом передан верно: речь о городском постановлении, согласии этих людей, их последующем уводе и утоплении не менее двухсот человек. Однако «город принял общее постановление» несколько смещает τὸ κοινὸν τῆς πόλεως ψήφισμα: в греческом это скорее общее/публичное постановление города, а не действие города по его принятию. Указательное «те» также оставляет слишком неясной связь с последующим «их».'
