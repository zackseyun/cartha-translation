lexical_decisions:
- source_word: τὸ κοινὸν τῆς πόλεως ψήφισμα
  choice: город принял общее постановление
  rationale: ψήφισμα обозначает официальное решение или постановление, а κοινόν передаёт его общий, коллективный характер. Перестройка фразы делает русское предложение естественным, не превращая решение в царский указ.
- source_word: τούτων ἐπιδεξαμένων
  choice: те согласились с ним
  rationale: ἐπιδέχομαι здесь означает принять предложение или согласиться с решением; местоимение «те» сохраняет указательный характер τούτων.
- source_word: ὡς ἂν εἰρηνεύειν θέλοντων
  choice: словно желая мира
  rationale: «Словно» сохраняет сравнительно-модальную силу конструкции и не утверждает как факт ни искренность, ни притворство названного желания.
- source_word: μηδὲν ὑπόπτον ἐχόντων
  choice: не имея ничего подозрительного
  rationale: 'Близкая к греческой формулировка сохраняет неоднозначность: речь может идти как об отсутствии подозрительного умысла, так и об отсутствии чего-либо, вызывающего подозрение.'
- source_word: ἀχθέντας
  choice: их увели
  rationale: Пассивное причастие от ἄγω означает, что их отвели или увели; «увели» не вводит неуказанного места назначения.
- source_word: ἐβύθισαν
  choice: утопили
  rationale: βυθίζω значит погружать в глубину или топить; применительно к людям «утопили» ясно передаёт совершённое действие.
- source_word: ὄντας οὐκ ἔλαττον τῶν διακοσίων
  choice: не менее двухсот человек
  rationale: Формулировка сохраняет нижнюю границу числа погибших и естественно звучит по-русски.
