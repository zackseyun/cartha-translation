revisions:
- from: Когда завязалась ожесточённая битва и люди Иуды благодаря помощи от Бога одержали верх, ослабленные кочевники просили Иуду протянуть им правую руку[a], обещая предоставить пастбища и впредь помогать им[b].
  to: Когда завязалась ожесточённая битва и люди Иуды благодаря помощи от Бога одержали верх, ослабленные кочевники просили Иуду подать им правую руку[a], обещая предоставить пастбища и впредь быть полезными людям Иуды[b].
  rationale: Уточнён адресат будущей помощи, чтобы исключить смысловой сдвиг, создаваемый местоимением «им». Формула о правой руке слегка исправлена в сторону более естественного русского выражения, при этом образ и культурное пояснение сохранены. Текстологическая неопределённость концовки не скрыта, а отмечена в сноске.
