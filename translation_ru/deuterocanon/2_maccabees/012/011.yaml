  yaml_path: translation/deuterocanon/2_maccabees/012/011.yaml
  text: And when a fierce battle had taken place[a], and those with Judas had prevailed because of the help from God, the nomads, having been weakened, asked Judas to give them his right hand[b], promising both to provide pasture and to be useful to them in the future.
translation:
  language: ru
  text: Когда завязалась ожесточённая битва и люди Иуды благодаря помощи от Бога одержали верх, ослабленные кочевники просили Иуду подать им правую руку[a], обещая предоставить пастбища и впредь быть полезными людям Иуды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дать им правую руку» — выражение, означающее заключить мир или скрепить союз.'
    reason: cultural_note
  - marker: b
    text: Концовка греческого текста выражена сжато и грамматически неровно; по смыслу кочевники обещают обеспечить выпас и впредь помогать людям Иуды.
    reason: textual_variant
lexical_decisions:
- source_word: καρτερᾶς μάχης
  choice: ожесточённая битва
  rationale: καρτερός в контексте сражения указывает на напряжённость и суровый характер боя; «ожесточённая» естественно передаёт это значение.
- source_word: τῶν περὶ τὸν Ἰούδαν
  choice: люди Иуды
  rationale: Греческий оборот обозначает людей, составлявших сторону или отряд Иуды, без необходимости уточнять их военную организацию.
- source_word: διὰ τὴν παρὰ τοῦ θεοῦ βοήθειαν
  choice: благодаря помощи от Бога
  rationale: Переданы как причинная связь, выраженная διά, так и источник помощи, обозначенный παρά.
- source_word: εὐημερησάντων
  choice: одержали верх
  rationale: В контексте битвы глагол означает успешный исход; выражение не утверждает полного разгрома противника.
- source_word: ἐλαττωθέντες
  choice: ослабленные
  rationale: Причастие означает уменьшение сил или ослабление; перевод «побеждённые» был бы чрезмерно определённым.
- source_word: οἱ νομάδες
  choice: кочевники
  rationale: Существительное служит описательным обозначением кочевого народа или группы, а не обязательно собственным именем.
- source_word: δοῦναι ... δεξιὰν αὐτοῖς
  choice: протянуть им правую руку
  rationale: Сохранён образ греческой идиомы, означающей заключение мира или союзное обязательство; смысл пояснён в сноске.
- source_word: βοσκήματα δώσειν
  choice: предоставить пастбища
  rationale: βοσκήματα относится к выпасу или корму для скота; «пастбища» кратко и естественно передаёт вероятную практическую помощь.
- source_word: ἐν τοῖς λοιποῖς ... ὠφέλησεν αὐτούς
  choice: и впредь помогать им
  rationale: 'Передан наиболее вероятный общий смысл сжатой и грамматически неровной концовки: обещание дальнейшей помощи стороне Иуды.'
theological_decisions:
- issue: Приписывание успеха в битве Божьей помощи
  choice: «благодаря помощи от Бога одержали верх»
  alternative: нейтральное сообщение об одном лишь военном успехе
  rationale: Греческий текст прямо связывает успех людей Иуды с помощью, исходящей от Бога; причинная и богословская связь сохранена без усиления.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан плавным, но сохранены причинная связь с Божьей помощью, степень поражения кочевников и образ правой руки. Оба маркера сносок стоят при соответствующих местах текста.
