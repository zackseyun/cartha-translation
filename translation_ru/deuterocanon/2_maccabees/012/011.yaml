review_pass:
  verdict: revise
  source_fidelity: 'Основной ход греческого текста передан точно: ожесточённое сражение, успех людей Иуды вследствие Божьей помощи, ослабление кочевников и их просьба о мирном соглашении сохранены. Однако в русском «впредь помогать им» местоимение естественно может относиться к кочевникам, тогда как по наиболее вероятному смыслу трудной концовки обещанная польза предназначена стороне Иуды. Это следует уточнить в основном тексте, сохранив оговорку сноски о неровности передачи.'
  naturalness: Текст в целом литературен и понятен. «Подать им правую руку» естественнее в русском, чем «протянуть им правую руку», при сохранении образа и его договорного смысла в сноске. Явное «людям Иуды» устраняет неудачную анафорическую двусмысленность.
  terminology: «Иуда», «Бог», «кочевники», «ожесточённая битва» и «одержали верх» уместны. «Предоставить пастбища» допустимо для βοσκήματα в данном контексте и не нуждается в замене; сноска обобщённо объясняет это как обеспечение выпаса.
  issues:
  - severity: medium
    issue: Неясный референт местоимения «им» в заключительной части.
    rationale: В конструкции «кочевники ... обещая ... впредь помогать им» ближайший и обычный референт «им» — кочевники, что меняет направление обещанной помощи. Сжатая и испорченная греческая концовка требует осторожности, но вероятный смысл — будущая польза для людей Иуды — должен быть выражен в основном тексте.
  - severity: low
    issue: «Протянуть им правую руку» не вполне точно передаёт договорный жест.
    rationale: Русское «протянуть руку» чаще обозначает предложение помощи или приветствие. «Подать правую руку» лучше сохраняет формулу взаимного соглашения; поясняющая сноска остаётся необходимой.
  revised_text: Когда завязалась ожесточённая битва и люди Иуды благодаря помощи от Бога одержали верх, ослабленные кочевники просили Иуду подать им правую руку[a], обещая предоставить пастбища и впредь быть полезными людям Иуды[b].
