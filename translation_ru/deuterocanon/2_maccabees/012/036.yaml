  text: But those with Esdrin were fighting for a longer time and were exhausted[a], so Judas called on the Lord to appear as an ally and as the leader of the battle.
translation:
  language: ru
  text: А люди Эздриина долгое время сражались и выбились из сил. Тогда Иуда воззвал к Господу, чтобы Он явился как их союзник и как предводитель в битве.[a]
