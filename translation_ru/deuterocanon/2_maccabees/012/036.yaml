lexical_decisions:
- source_word: τῶν δὲ περὶ τὸν Ἔσδριν
  choice: люди Эздриина
  rationale: Оборот περὶ с именем лица обозначает связанных с ним людей или его отряд; такой перевод естественен по-русски и не уточняет без основания воинское звание Эздриина.
- source_word: ἐπὶ πλεῖον μαχομένων
  choice: сражались дольше
  rationale: В сочетании с μάχομαι выражение вероятнее всего указывает на большую продолжительность боя; прошедшее время естественно передаёт обстоятельственный генитив абсолютный.
- source_word: κατακόπων ὄντων
  choice: уже выбились из сил
  rationale: κατάκοπος означает изнурённого тяжёлым трудом или боем; русское выражение ясно и передаёт сильную степень усталости.
- source_word: ἐπικαλεσάμενος
  choice: призвал
  rationale: В молитвенном контексте глагол означает обращение с призывом о помощи; «призвал Господа» сохраняет возвышенный, но понятный регистр.
- source_word: τὸν κύριον
  choice: Господа
  rationale: В иудейском молитвенном контексте κύριος относится к Богу и традиционно, естественно передаётся словом «Господь».
- source_word: σύμμαχον
  choice: союзником
  rationale: Слово обозначает того, кто вместе участвует в сражении; «союзник» сохраняет военный оттенок точнее, чем общее «помощник».
- source_word: προοδηγὸν
  choice: предводителем
  rationale: προοδηγός — идущий впереди и ведущий за собой; в военном контексте «предводитель» естественно соединяет руководство с образом выступающего впереди.
- source_word: φανῆναι
  choice: явиться
  rationale: Перевод сохраняет смысл проявления Божьего присутствия и помощи, не решая, идёт ли речь о видимом богоявлении.
- source_word: τοῦ πολέμου
  choice: в битве
  rationale: Контекст описывает конкретное сражение; русское «предводителем в битве» естественно выражает связь родительного падежа с προοδηγόν.
theological_decisions:
- issue: Передача κύριος в молитвенном обращении
  choice: Господь
  alternative: Владыка
  rationale: Иуда обращается к Богу; «Господь» сохраняет обычное библейское именование и не вносит дополнительного толкования.
- issue: Характер Божьего явления в φανῆναι
  choice: явиться их союзником и предводителем в битве
  alternative: показать Себя союзником и ведущим впереди в битве
  rationale: «Явиться» сохраняет возможность как явного вмешательства, так и видимого явления, не сводя выражение к одной из этих трактовок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Причастные конструкции греческого оригинала преобразованы в ясные личные предложения; военная образность и двукратная идея явления сохранены в двух однородных дополнениях при одном глаголе.
