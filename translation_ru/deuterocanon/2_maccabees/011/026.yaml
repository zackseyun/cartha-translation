review_pass:
  verdict: revise
  source_fidelity: Нужна небольшая правка. «Людей» добавляет к διαπεμψάμενος не выраженный в греческом объект, хотя в дипломатическом контексте посланцы, вероятно, подразумеваются. Употребление «если пошлёшь» несколько ослабляет связь причастия с εὖ ποιήσεις; деепричастная конструкция передаёт её точнее. «Наше решение» допустимо контекстуально, но «наше намерение» ближе к προαίρεσις. «С готовностью» означает скорее готовность, тогда как ἡδέως — охотно, с удовольствием.
  naturalness: Предлагаемая редакция сохраняет современный литературный и официальный тон. «Направив к ним посланцев» естественно в дипломатическом контексте; «охотно займутся устройством собственных дел» ясно и не чрезмерно разговорно.
  terminology: «Заверения в доброй воле» передаёт дипломатическое значение δοὺς δεξιάς, не оставляя непрозрачного буквального образа в основном тексте. Сноска сохраняет буквальное «правые руки» и объясняет идиому. «Намерение» последовательно передаёт προαίρεσις без добавочного смысла окончательного решения.
  issues:
