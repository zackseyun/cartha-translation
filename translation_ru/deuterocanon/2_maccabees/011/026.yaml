lexical_decisions:
- source_word: εὖ οὖν ποιήσεις
  choice: Поэтому ты хорошо сделаешь
  rationale: Оборот выражает одобрение и побуждение, а не простое предсказание; русское «ты хорошо сделаешь» естественно передаёт эту силу.
- source_word: διαπεμψάμενος πρὸς αὐτούς
  choice: если пошлёшь к ним людей
  rationale: Причастие подчинено основной конструкции. В дипломатическом контексте подразумевается отправка представителей; добавление «людей» делает фразу понятной по-русски, не уточняя их официальный статус.
- source_word: δοὺς δεξιάς
  choice: дашь им заверения в добрых намерениях
  rationale: Буквально говорится о подаче правых рук — устойчивом дипломатическом жесте, означающем гарантии, заверения и верность данному слову. Смысл идиомы вынесен в основной текст, а буквальный образ сохранён в сноске.
- source_word: τὴν ἡμετέραν προαίρεσιν
  choice: о нашем решении
  rationale: προαίρεσις обозначает обдуманное намерение, выбор или принятое решение. В контексте царского распоряжения «решение» звучит естественно и не приписывает ему не выраженной прямо благожелательности.
- source_word: εὔθυμοί τε ὦσιν
  choice: воспрянули духом
  rationale: Прилагательное указывает на бодрость, мужество и уверенность; русская идиома передаёт внутреннее ободрение без сведения смысла к весёлости.
- source_word: ἡδέως διαγίνωνται πρὸς τῇ τῶν ἰδίων ἀντιλήψει
  choice: с готовностью занялись устройством собственных дел
  rationale: Сочетание описывает дальнейшее деятельное занятие тем, что принадлежит им или касается их интересов. «Устройство собственных дел» сохраняет широкий практический смысл, не сужая его до одной лишь собственности.
