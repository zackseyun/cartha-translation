    issue: Добавлено «людей» в переводе διαπεμψάμενος πρὸς αὐτούς.
    rationale: Греческий текст не называет объект отправки. Контекст может предполагать посланцев, однако добавление «людей» в нейтральной формулировке излишне конкретизирует текст; «посланцев» возможно как контекстуально необходимое дипломатическое уточнение, но это следует формулировать именно так.
  - severity: low
    issue: «Если пошлёшь» делает действие условием.
    rationale: Причастие διαπεμψάμενος обозначает способ, которым адресат хорошо поступит, а не явно поставленное условие. Деепричастный оборот ближе к синтаксической связи оригинала.
  - severity: low
    issue: «О нашем решении» и «с готовностью» менее точны семантически.
    rationale: προαίρεσις — намерение, замысел; ἡδέως — охотно, с удовольствием. Исправление сохраняет широту и тон исходника.
