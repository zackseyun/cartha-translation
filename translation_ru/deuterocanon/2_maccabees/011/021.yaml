lexical_decisions:
- source_word: ἔρρωσθε
  choice: Будьте здравы
  rationale: Обычная эпистолярная формула завершения письма буквально желает адресатам здоровья; этот вариант сохраняет её побудительный оттенок и звучит достойно по-русски.
- source_word: ἔτους ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: В сто сорок восьмом году
