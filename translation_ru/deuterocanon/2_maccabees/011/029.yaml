lexical_decisions:
- source_word: ἐνεφάνισεν ἡμῖν
  choice: сообщил нам
  rationale: Глагол означает «дать знать, сообщить, доложить»; выбран естественный оборот, подходящий официальному письму.
- source_word: Μενέλαος
  choice: Менелай
  rationale: Традиционная русская форма греческого личного имени.
- source_word: βουλόμενος
  choice: хочет
  rationale: Причастие мужского рода именительного падежа грамматически относится к Менелаю. Поэтому, вопреки английскому консультационному тексту, желание приписано Менелаю, а не адресатам.
- source_word: κατελθόντας ὑμᾶς
  choice: чтобы вы, спустившись
  rationale: Аористное причастие передаёт предшествующее действие; направление в самом тексте не уточнено, поэтому сохранено буквальное «спустившись».
- source_word: γίνεσθαι πρὸς τοῖς ἰδίοις
  choice: занялись своими делами
  rationale: Идиоматический оборот допускает понимание τοῖς ἰδίοις как собственных дел, интересов, имущества или своих людей. В основном тексте выбран естественный контекстуальный смысл, а существенная альтернатива вынесена в сноску.
