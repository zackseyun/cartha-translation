base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/002.yaml
  text: After gathering about eighty thousand men and all the cavalry[a], he advanced against the Jews, intending to make the city a dwelling place for Greeks,
translation:
  language: ru
  text: Собрав около восьмидесяти тысяч воинов и всю конницу, он выступил против иудеев[a], намереваясь сделать город местом жительства греков,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жителей Иудеи». Греческое слово Ἰουδαίους в зависимости от контекста может обозначать как иудеев, так и жителей Иудеи.'
    reason: 'Лексическая альтернатива: исходное этническо-географическое обозначение допускает оба оттенка.'
lexical_decisions:
- source_word: συναθροίσας
  choice: Собрав
  rationale: Аористное причастие обозначает действие, предшествующее основному; деепричастие естественно передаёт эту последовательность по-русски.
- source_word: περὶ τὰς ὀκτὼ μυριάδας
  choice: около восьмидесяти тысяч воинов
  rationale: Восемь мириад равны восьмидесяти тысячам, а περί при числительном указывает на приблизительность. Слово «воинов» добавлено из военного контекста.
- source_word: τὴν ἵππον ἅπασαν
  choice: всю конницу
  rationale: ἵππος здесь имеет собирательное военное значение и обозначает конницу, а не просто лошадей.
- source_word: παρεγένετο ἐπὶ τοὺς Ἰουδαίους
  choice: он выступил против иудеев
  rationale: ἐπί с винительным падежом в данном военном контексте выражает враждебное движение против противника; «выступил против» сохраняет направленность действия без добавления прямо не названного нападения.
- source_word: λογιζόμενος
  choice: намереваясь
  rationale: В контексте причастие выражает замысел и цель, а не только размышление или расчёт.
- source_word: τὴν μὲν πόλιν
  choice: город
  rationale: Артикль передан определённостью контекста; частица μέν предваряет продолжение мысли в следующем стихе, поэтому предложение оставлено незавершённым.
- source_word: Ἕλλησιν
  choice: греков
  rationale: Дательный падеж указывает, для кого город должен стать местом жительства; русская родительная конструкция естественно передаёт эту связь.
- source_word: οἰκητήριον ποιήσειν
  choice: сделать город местом жительства
  rationale: Передано основное значение конструкции — превратить город в место обитания, без более узкого толкования как колонизации.
theological_decisions:
- issue: Этническое или географическое значение Ἰουδαίους
  choice: иудеев
  alternative: жителей Иудеи
  rationale: В данном повествовании слово может обозначать как еврейский народ, так и население Иудеи. Здесь речь идёт о народе как противостоящей группе, поэтому «иудеев» наиболее естественно, а географическая возможность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и умеренно торжественным библейским регистром. Запятая в конце сохраняет связь с продолжением мысли в следующем стихе. Маркер примечания поставлен непосредственно после слова «иудеев», к которому относится примечание.
