  text: But after a very short time[a], Lysias, the king’s guardian and kinsman and administrator of affairs, taking the events very hard[c][b],
translation:
  language: ru
  text: Но спустя совсем немного времени[a] Лисий, опекун царя[b], его родственник и управляющий государственными делами, крайне тяжело переживая случившееся[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «спустя малое, поистине совсем краткое время». Греческое выражение подчёркнуто передаёт краткость промежутка.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово можно также перевести как «регент» или «попечитель» — в зависимости от того, насколько официально понимается должность Лисия.
    reason: alternative_reading
  - marker: c
    text: Предложение продолжается в следующем стихе; здесь, как и в греческом тексте, оно оканчивается незавершённым причастным оборотом.
    reason: cross_reference
lexical_decisions:
- source_word: Μετʼ ὀλίγον δὲ παντελῶς χρονίσκον
  choice: Но спустя совсем немного времени
  rationale: Сочетание Μετʼ ὀλίγον с уменьшительным χρονίσκον и усилителем παντελῶς подчёркивает чрезвычайную краткость промежутка; русский оборот естественно передаёт эту эмфазу.
- source_word: ἐπίτροπος τοῦ Βασιλέως
  choice: опекун царя
  rationale: ἐπίτροπος обозначает лицо, которому вверена опека или управление; «опекун» сохраняет основное значение, не превращая должность без достаточных оснований в более специальный титул «регент».
- source_word: συγγενής
  choice: его родственник
  rationale: Слово выражает родственную связь. Местоимение «его» естественно связывает определение с царём и устраняет возможную синтаксическую неясность русского текста.
- source_word: ἐπὶ τῶν πραγμάτων
  choice: управляющий государственными делами
  rationale: Идиома указывает на официальную ответственность за дела управления; добавление «государственными» раскрывает подразумеваемую придворно-политическую сферу без введения конкретного титула.
- source_word: λίαν βαρέως φέρων ἐπὶ τοῖς γεγονόσι
  choice: крайне тяжело переживая случившееся
  rationale: Идиома βαρέως φέρειν означает тяжело воспринимать или глубоко переживать нечто; формулировка современна, сохраняет эмоциональную силу и причастную незавершённость греческой фразы.
