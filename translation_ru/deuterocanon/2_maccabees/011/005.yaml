  yaml_path: translation/deuterocanon/2_maccabees/011/005.yaml
  text: But after entering Judea and approaching Beth-zur[a], a fortified place about five schoeni from Jerusalem[b], he was besieging it.
translation:
  language: ru
  text: Войдя в Иудею и подступив к Вефсуре — укреплённому месту, находившемуся примерно в пяти схенах[a] от Иерусалима, — он теснил её[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Схен — древняя мера расстояния, точная длина которой различалась в зависимости от времени и местности.
    reason: cultural_note
  - marker: b
    text: 'Или: «осаждал её». Греческий глагол буквально означает «теснить», «сдавливать» или «притеснять»; здесь он, вероятно, обозначает военное давление на Вефсуру.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: войдя
  rationale: Аористное причастие передаёт действие, предшествующее основной военной операции; русское деепричастие сохраняет последовательность и синтаксическую связь.
- source_word: συνεγγίσας
  choice: подступив к
  rationale: В военном контексте естественно передаёт приближение войска к укреплённому месту, не утверждая само по себе начала осады.
- source_word: Βεθσουρῶν
  choice: Вефсуре
  rationale: Использована укоренившаяся русская библейская форма названия; падежная форма обусловлена управлением «подступив к».
- source_word: ἐρυμνῷ χωρίῳ
  choice: укреплённому месту
  rationale: 'Сохраняет оба компонента: защищённость или укреплённость (ἐρυμνός) и нейтральное обозначение места (χωρίον), не превращая его непременно в город или крепость.'
- source_word: ἀπέχοντι ὡσεὶ σχοίνους πέντε
  choice: находившемуся примерно в пяти схенах от
  rationale: Передаёт приблизительность ὡσεὶ и сохраняет древнюю меру расстояния без неточного пересчёта в современные единицы.
- source_word: τοῦτο
  choice: её
  rationale: Местоимение относится к Вефсуре; женский род согласован с русской формой топонима.
- source_word: ἔθλιβε
  choice: стал осаждать
  rationale: В данном военном контексте длительное «теснил/оказывал давление» естественно понимается как осада; конструкция с «стал» передаёт развёртывающееся действие имперфекта, а буквальная образность отмечена в сноске.
