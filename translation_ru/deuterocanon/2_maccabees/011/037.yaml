  yaml_path: translation/deuterocanon/2_maccabees/011/037.yaml
  text: Therefore hurry[a], and send some men[b], so that we too may learn what your intention is.
translation:
  language: ru
  text: Поэтому поспешите и пришлите нескольких человек[a], чтобы и мы узнали, какого вы мнения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришлите кого-нибудь» либо «пришлите представителей»; греческое неопределённое τινας не уточняет, о каких именно людях идёт речь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каковы вы по мнению»; речь идёт о позиции или решении адресатов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Поэтому
  rationale: Передаёт выводную связь просьбы с предшествующим сообщением.
- source_word: σπεύσατε
  choice: поспешите
  rationale: Аористный императив выражает требование действовать без промедления; «поспешите» звучит естественно и сохраняет настойчивость.
- source_word: πέμψατέ τινας
  choice: пришлите нескольких человек
  rationale: πέμψατε означает «пошлите/пришлите», а неопределённое множественное τινας — не названных точнее людей. В обращённой к адресатам просьбе «пришлите» естественно передаёт движение к автору письма.
- source_word: ὅπως
  choice: чтобы
  rationale: Союз вводит цель требуемого действия.
- source_word: καὶ ἡμεῖς
  choice: и мы
  rationale: Сохраняет включительное или усилительное значение καί при явно выраженном местоимении ἡμεῖς.
- source_word: ἐπιγνῶμεν
  choice: узнали
  rationale: В целевом придаточном аористный конъюнктив обозначает получение знания, то есть выяснение позиции адресатов.
- source_word: ὁποῖοί ἐστε γνώμης
  choice: какого вы мнения
  rationale: Естественная русская передача греческого оборота, сохраняющая γνώμη как «мнение, позиция», не сужая его до одного лишь намерения.
