base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/025.yaml
  text: Therefore[a], since we also choose that this nation should be free from disturbance, we decide that the temple should be restored to them, and that they should live according to the customs of their ancestors.
translation:
  language: ru
  text: Итак, желая, чтобы и этот народ также был свободен от смут, мы постановили, чтобы храм был восстановлен для них и чтобы они жили по обычаям времён своих предков.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устраивали свою общественную жизнь по обычаям своих предков».'
    reason: Лексическая альтернатива сохраняет гражданско-общинный оттенок глагола πολιτεύεσθαι и передаёт возможное нетемпоральное понимание выражения об обычаях предков.
lexical_decisions:
- source_word: αἱρούμενοι
  choice: желая
  rationale: Средний залог причастия выражает предпочтение или избрание определённого курса; в данном распорядительном контексте «желая» естественно передаёт волевой оттенок, не превращая его в отдельный указ.
- source_word: ἐκτὸς ταραχῆς
  choice: не знал смут
  rationale: Оборот указывает на отсутствие общественных волнений или беспорядков; «не знал смут» сохраняет политико-общественный смысл и звучит естественно по-русски.
- source_word: ἔθνος
  choice: народ
  rationale: В контексте царского послания слово обозначает иудеев как отдельную общность; «народ» в современном русском языке точнее и естественнее, чем «нация» для древнего контекста.
- source_word: κρίνομεν
  choice: мы решили
  rationale: Глагол означает «судить, постановлять, решать»; «решили» соответствует административному контексту, не усиливая выражение до специального термина «издали указ».
- source_word: τὸ ἱερὸν
  choice: храм
  rationale: Хотя слово буквально обозначает священное место, здесь оно относится к Иерусалимскому храму или храмовому комплексу; «храм» ясно передаёт референт.
- source_word: ἀποκατασταθῆναι αὐτοῖς
  choice: возвратить им храм
  rationale: Пассивный инфинитив обозначает восстановление прежнего положения. В сочетании с дательным αὐτοῖς речь естественно понимается как возвращение храма народу под его распоряжение; формулировка не уточняет сверх текста административные детали.
- source_word: πολιτεύεσθαι
  choice: позволить им жить
  rationale: Инфинитив относится к устроению общественной жизни и образу жизни общины. Добавленное по-русски «позволить» раскрывает зависимость второго инфинитива от решения властителя, а «жить» не сужает смысл до политического самоуправления.
- source_word: κατὰ τὰ ἐπὶ τῶν προγόνων αὐτῶν ἔθη
  choice: по обычаям времён их предков
  rationale: Оборот ἐπὶ τῶν προγόνων может иметь временной оттенок — обычаи, существовавшие при предках. Перевод сохраняет этот оттенок, не сводя выражение лишь к принадлежности обычаев предкам.
theological_decisions:
- issue: Объём значения πολιτεύεσθαι применительно к иудейскому закону и обычаям
  choice: Передать как разрешение жить и устраивать общинную жизнь по прежним обычаям.
  alternative: «управлять собой по обычаям своих предков»
  rationale: Глагол имеет гражданско-общественный оттенок, однако зависимое выражение об обычаях указывает прежде всего на разрешённый традиционный и религиозно-общинный уклад, а не на недвусмысленное дарование политической независимости.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского послания. Синтаксис сделан плавным и понятным; сохранены общественно-политический смысл «смут» и неоднозначность πολιτεύεσθαι без утверждения полного самоуправления.
