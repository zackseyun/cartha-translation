  rationale: Исправление уточняет значение ἀποκατασταθῆναι как «быть восстановленным», передаёт включительное καί и избегает явной экспликации «позволить». Темпоральный оттенок ἐπὶ τῶν προγόνων сохранён в основном тексте; альтернативное понимание отражено в сноске.
