lexical_decisions:
- source_word: ἦσαν γὰρ γεγραμμέναι
  choice: Ибо … были написаны
  rationale: Перифрастическая пассивная конструкция передана естественной русской формой прошедшего времени; γάρ сохранено как «ибо», поскольку стих поясняет предшествующее повествование.
- source_word: τοῖς Ἰουδαίοις
  choice: иудеям
  rationale: В данном контексте обозначен иудейский народ как этнорелигиозная общность, а не только жители Иудеи.
- source_word: ἐπιστολαὶ
  choice: письма
  rationale: Речь идёт об официальной переписке; общеупотребительное «письма» точно и не создаёт ненужной архаичности.
- source_word: παρὰ μὲν Λυσίου
  choice: Одно из них, от Лисия
  rationale: Παρά с родительным указывает на источник письма, а μέν начинает перечисление корреспонденции от разных отправителей. Формулировка «одно из них» естественно выражает эту связь в русском контексте.
- source_word: περιέχουσαι τὸν τρόπον τοῦτον
  choice: было такого содержания
  rationale: Оборот вводит приводимый далее текст письма и может указывать как на содержание, так и на формулировку; основной перевод остаётся естественным, а неоднозначность отмечена в сноске.
- source_word: τῷ πλήθει τῶν Ἰουδαίων
  choice: множеству иудеев
  rationale: Πλῆθος обозначает многочисленную совокупность людей. Буквально-коллективное выражение сохранено, чтобы не превращать адресата без достаточных оснований в формально учреждённое собрание.
- source_word: χαίρειν
  choice: Приветствие
  rationale: В начале письма χαίρειν является принятой эпистолярной формулой, а не повелением радоваться.
