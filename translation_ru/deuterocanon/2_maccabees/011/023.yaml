lexical_decisions:
- source_word: τοῦ πατρὸς ἡμῶν
  choice: наш отец
  rationale: Сохраняет династический и придворный оборот греческого текста, не добавляя слова «покойный» и не заменяя его толкованием «предшественник».
- source_word: εἰς θεοὺς μεταστάντος
  choice: отошёл к богам
  rationale: Передаёт эллинистическую царскую формулу смерти и сохраняет явно языческое множественное число θεούς, не сглаживая его до нейтрального «умер».
- source_word: βουλόμενοι
  choice: мы желаем
  rationale: Естественно передаёт причастие намерения в форме царского «мы» и соответствует официальному стилю письма.
- source_word: τοὺς ἐκ τῆς βασιλείας
  choice: живущие в царстве
  rationale: Передаёт широкое обозначение людей, принадлежащих царству, не вводя более узкого понятия «подданные», которого прямо нет в тексте.
- source_word: ἀπερισπάστως ὄντας
  choice: не зная тревог
  rationale: В политическом контексте выражает состояние без беспокойства и смуты; это естественнее по-русски, чем буквальное «будучи неотвлекаемыми».
- source_word: γενέσθαι πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν
  choice: занялись делами иудеев
  rationale: Естественно передаёт сжатую греческую конструкцию со значением внимания, попечения или ведения дел, сохраняя возможность более широкого понимания «иудейских дел».
theological_decisions:
- issue: Сохранение языческой царской формулы смерти
  choice: отошёл к богам
  alternative: умер; отошёл в мир иной
  rationale: Это формула эллинистического царского письма. Явную отсылку к богам во множественном числе следует сохранить как часть речи автора документа, а не согласовывать с монотеистической терминологией.
