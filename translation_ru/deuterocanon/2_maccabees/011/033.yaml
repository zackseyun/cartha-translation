lexical_decisions:
- source_word: ἔρρωσθε
  choice: Будьте здоровы
  rationale: Обычная заключительная формула письма; передаёт пожелание благополучия и естественно звучит по-русски, не превращая формулу в буквальное повеление «крепитесь».
- source_word: ἔτους
  choice: в ... году
  rationale: Родительный падеж входит в греческую формулу датировки; по-русски она естественно передаётся предложным оборотом.
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: сто сорок восьмом
  rationale: Сохранено порядковое числительное и историческая система летосчисления исходного текста.
- source_word: Ξανθικοῦ
  choice: месяца ксантика
  rationale: Македонское название месяца транслитерировано; слово «месяца» добавлено для ясности современной русской датировки.
- source_word: πεντεκαιδεκάτῃ
  choice: в пятнадцатый день
  rationale: Дательный падеж обозначает дату; существительное «день» выражено явно, как подразумеваемое в греческом.
