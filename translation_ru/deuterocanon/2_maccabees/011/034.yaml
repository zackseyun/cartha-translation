lexical_decisions:
- source_word: Ἐπέμψαν δὲ καὶ οἱ Ῥωμαῖοι
  choice: Римляне также послали
  rationale: Передаёт аорист πέμπω и добавочное καί естественным современным русским языком; δέ здесь служит связкой повествования и не требует отдельного перевода.
- source_word: πρὸς αὐτοὺς ἐπιστολήν
  choice: им письмо
  rationale: Обычное значение ἐπιστολή — «письмо»; русская конструкция с косвенным дополнением естественно передаёт πρὸς αὐτούς.
- source_word: ἔχουσαν οὕτως
  choice: следующего содержания
  rationale: Документальная формула, вводящая текст письма; выбран естественный и сохраняющий официальный оттенок русский эквивалент.
- source_word: Κόιντος Μέμμιος, Τίτος Μάνιος
  choice: Квинт Меммий и Тит Маний
  rationale: Имена переданы в традиционной русской форме, соответствующей греко-римским именам Quintus Memmius и Titus Manius; союз добавлен для ясности перечисления.
- source_word: πρεσβυταὶ Ῥωμαίων
  choice: старейшины римлян
  rationale: Сохраняется буквальное значение πρεσβυταί без преждевременного уточнения их дипломатической должности; контекстуальный вариант отмечен в сноске.
- source_word: τῷ δήμῳ τῶν Ἰουδαίων
  choice: народу иудеев
  rationale: δήμος обозначает народ как гражданское или корпоративное целое; формулировка близка греческой структуре и уместна в официальном письме.
- source_word: χαίρειν
  choice: Приветствуем вас
  rationale: Передаёт стандартную эпистолярную формулу приветствия естественно для современного русского языка, а не буквально как «радоваться».
