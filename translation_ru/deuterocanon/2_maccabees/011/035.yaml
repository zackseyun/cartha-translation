  text: Concerning the things that Lysias, the king’s kinsman, granted to you, we also approve.
translation:
  language: ru
  text: Что касается того, что Лисий, родственник царя, предоставил вам, мы также это одобряем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: Что же касается того, что
  rationale: Оборот вводит предмет обсуждения; русский вариант естественно передаёт тематическую связь, не придавая предлогу значения замещения.
- source_word: Λυσίας
  choice: Лисий
  rationale: Традиционная русская передача греческого имени Λυσίας.
- source_word: ὁ συγγενὴς τοῦ βασιλέως
  choice: родственник царя
  rationale: συγγενής обозначает родственника или сородича. «Родственник» ясно и без излишней архаичности сохраняет семейную связь, не превращая выражение в конкретный придворный титул.
- source_word: συνεχώρησεν
  choice: даровал
  rationale: В дипломатическом контексте глагол означает официально предоставить, разрешить или уступить; «даровал» передаёт совершённое властное предоставление и соответствует достоинству письма.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж передан естественным русским косвенным дополнением.
- source_word: καὶ ἡμεῖς συνευδοκοῦμεν
  choice: это одобряем и мы
  rationale: Глагол συνευδοκέω выражает совместное одобрение или согласие. Такая формулировка подчёркивает, что авторы письма подтверждают предоставленное Лисием.
