base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/024.yaml
  text: Having heard that the Jews did not approve of my father's change to Greek ways[a], but were choosing their own way of life and asking that their lawful customs be permitted to them,
translation:
  language: ru
  text: Узнав, что иудеи не одобряют перемен, введённых моим отцом в пользу греческих обычаев[a], но предпочитают свой образ жизни и просят разрешить им соблюдать свои законные установления,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перемен, введённых моим отцом в пользу греческого образа жизни». Греческое выражение относится к переходу к эллинистическим обычаям и не ограничивается употреблением греческого языка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκοότες
  choice: Узнав
  rationale: Перфектное причастие вводит основание для последующего царского решения; деепричастие естественно передаёт эту связь по-русски.
- source_word: μὴ συνεὐδοκοῦντας
  choice: не одобряют
  rationale: Передаёт значение несогласия или неодобрения без усиления до открытого противодействия.
- source_word: τῇ τοῦ πατρὸς εἰς τὰ Ἑλληνικὰ μεταθέσει
  choice: перехода моего отца к греческим обычаям
  rationale: μετάθεσις обозначает перемену или переход, а τὰ Ἑλληνικά в данном контексте — эллинистические культурные обычаи, а не только греческий язык.
- source_word: τὴν ἑαυτῶν ἀγωγήν
  choice: свой образ жизни
  rationale: ἀγωγή здесь относится к принятому общинному укладу и образу жизни.
- source_word: αἱρετίζοντας
  choice: предпочитают
  rationale: Глагол выражает сознательный выбор; «предпочитают» ясно передаёт противопоставление навязываемым греческим обычаям.
- source_word: ἀξιοῦν
  choice: просят
  rationale: В данном контексте обозначает просьбу или требование предоставить разрешение; нейтральное «просят» не усиливает оттенок притязания.
- source_word: συγχωρηθῆναι αὐτοῖς τὰ νόμιμα
  choice: разрешить им соблюдать свои установления
  rationale: Естественная русская передача просьбы позволить иудеям следовать установленным законом и обычаем нормам; добавленное «соблюдать» эксплицирует подразумеваемое действие.
theological_decisions:
- issue: Значение εἰς τὰ Ἑλληνικά
  choice: к греческим обычаям
  alternative: к греческому образу жизни; к греческому языку
  rationale: Контекст противопоставляет эллинизацию собственному иудейскому укладу и установлениям, поэтому речь идёт прежде всего о культурных практиках, а не только о языке.
