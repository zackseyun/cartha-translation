  source_fidelity: 'Греческий текст передан в целом точно: адресатами являются народ иудейский, совет старейшин и прочие иудеи; титул, имя и эпистолярное «приветствие» сохранены. Однако «было обращено такое письмо царя» несколько меняет и размывает простую формулу ἡ τοῦ βασιλέως ἐπιστολὴ τοιαύδε ἦν («письмо царя было таким/следующим»).'
