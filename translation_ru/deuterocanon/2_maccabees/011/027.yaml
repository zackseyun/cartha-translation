lexical_decisions:
- source_word: Πρὸς δὲ τὸ ἔθνος
  choice: А к народу
  rationale: Предлог πρός с винительным указывает на адресата письма; «к народу» естественно передаёт коллективный смысл ἔθνος и связь с предшествующим повествованием.
- source_word: ἡ τοῦ βασιλέως ἐπιστολὴ τοιαύδε ἦν
  choice: было обращено такое письмо царя
  rationale: Формула вводит содержание документа; выбранный русский оборот сохраняет адресную направленность письма и звучит естественно.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: Царь Антиох
  rationale: Сохраняется порядок титула и имени в греческом заголовке при нормативной русской форме имени.
- source_word: τῇ γερουσίᾳ τῶν Ἰουδαίων
  choice: совету старейшин иудеев
  rationale: γερουσία обозначает официальный коллегиальный орган старейшин; «совет старейшин» ясно передаёт институциональный смысл без современных ассоциаций слова «сенат».
- source_word: τοῖς ἄλλοις Ἰουδαίοις
  choice: остальным иудеям
  rationale: ἄλλοις противопоставляет более широкую группу только что названному совету; «остальным» естественно и точно выражает это отношение.
- source_word: χαίρειν
  choice: приветствие
  rationale: Это стандартная эпистолярная формула. Существительное «приветствие» уместно передаёт её в официальном заголовке письма.
