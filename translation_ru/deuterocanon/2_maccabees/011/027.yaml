  terminology: «Совет старейшин иудеев» удачно передаёт γερουσία как официальный орган. «Прочим иудеям» точнее сохраняет различительное ἄλλοις, не усиливая его до значения «всем остальным». Имя Антиох и формула «приветствие» нормативны.
