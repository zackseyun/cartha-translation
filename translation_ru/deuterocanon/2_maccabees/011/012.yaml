lexical_decisions:
- source_word: οἱ πλείονες
  choice: большинство из них
  rationale: Субстантивированная сравнительная форма обозначает бо́льшую часть группы; этот вариант точно и естественно передаёт количественный смысл.
- source_word: τραυματίαι
  choice: раненые
  rationale: Слово обозначает людей, получивших ранения; русское субстантивированное прилагательное естественно передаёт их состояние.
- source_word: γυμνοὶ
  choice: нагие
  rationale: 'Сохраняет прямое значение греческого слова и его неоднозначность: речь может идти как о полной наготе, так и о лишении одежды или снаряжения при бегстве.'
- source_word: διεσώθησαν / διεσώθη
  choice: спаслись бегством / спасся
  rationale: В военном контексте глагол означает уцелеть и благополучно уйти; в первом случае добавление «бегством» естественно проясняет ситуацию, а во втором способ ухода прямо выражен причастием φεύγων.
- source_word: αἰσχρῶς
  choice: позорно
  rationale: Наречие прямо оценивает бегство как постыдное и бесчестное.
- source_word: φεύγων
  choice: бежав
  rationale: Деепричастие кратко и естественно передаёт сопутствующее обстоятельство и способ спасения.
