lexical_decisions:
- source_word: ἔρρωσθε
  choice: Будьте здоровы
  rationale: Форма от ῥώννυμι в письмах служит заключительным пожеланием благополучия. Русское «Будьте здоровы» естественно передаёт и эпистолярную формулу, и буквальный оттенок крепости и здоровья.
- source_word: εἴη ἂν
  choice: Пусть всё будет
  rationale: Оптатив с ἄν выражает пожелание; «пусть… будет» сохраняет желательное значение и звучит естественно по-русски. «Всё» эксплицирует подразумеваемый предмет пожелания, не конкретизируя его.
- source_word: ὡς βούλομεθα
  choice: так, как мы желаем
  rationale: βούλομαι обозначает желание или волю; «желаем» соответствует официальному тону письма и остаётся понятным современному читателю.
- source_word: καὶ αὐτοὶ δὲ
  choice: мы и сами
  rationale: 'Сочетание частиц и усилительного αὐτοί передаёт умеренное подчёркивание: адресанты, со своей стороны, также благополучны.'
- source_word: ὑγιαίνομεν
  choice: здоровы
  rationale: Глагол прямо означает пребывание в добром здоровье; краткая форма «здоровы» естественна в русской эпистолярной речи.
