  text: 'And the king’s letter contained this: “King Antiochus to his brother Lysias[b][a], greetings.”'
translation:
  language: ru
  text: 'Письмо царя гласило: «Царь Антиох — брату Лисию[a]: привет!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «брат» здесь может быть придворным титулом, выражающим политическую близость, а не указанием на буквальное родство.
    reason: cultural_note
lexical_decisions:
- source_word: Ἡ ... τοῦ βασιλέως ἐπιστολή
  choice: Письмо царя
  rationale: ἐπιστολή — обычное обозначение письма или письменного послания; «письмо» естественно для современного русского языка.
- source_word: περιεῖχεν οὕτως
  choice: гласило
  rationale: Буквально сочетание означает «содержало так/следующее», но в данном контексте вводит точную формулировку письма; «гласило» кратко и естественно передаёт эту функцию.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: Царь Антиох
  rationale: Стандартная передача титула и имени в заголовке официального письма.
- source_word: τῷ ἀδελφῷ
  choice: брату
  rationale: Сохранено прямое значение ἀδελφός без добавления притяжательного местоимения, отсутствующего в греческом тексте; возможный придворный смысл пояснён в сноске.
- source_word: Λυσίᾳ
  choice: Лисию
  rationale: Традиционная русская форма имени Λυσίας в дательном падеже.
- source_word: χαίρειν
  choice: привет
  rationale: Передаёт принятую греческую эпистолярную формулу приветствия кратко и современно.
