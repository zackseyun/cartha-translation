  source_fidelity: 'Текст точно передаёт греческий оригинал: «Письмо царя» соответствует Ἡ ... τοῦ βασιλέως ἐπιστολή; «гласило» естественно передаёт περιεῖχεν οὕτως как вводную формулу перед содержанием письма. Заголовок «Царь Антиох — брату Лисию: привет!» сохраняет порядок и краткую эпистолярную форму Βασιλεὺς Ἀντίοχος τῷ ἀδελφῷ Λυσίᾳ χαίρειν. Отсутствие притяжательного местоимения в «брату» оправдано: его нет в греческом, а возможный титулярный смысл отмечен.'
