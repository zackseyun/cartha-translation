lexical_decisions:
- source_word: τοῖς ... καταπορευομένοις
  choice: тем, кто отправится в путь
  rationale: Причастие передаёт движение вниз или прочь; в данном административном контексте естественное русское выражение «отправится в путь» сохраняет идею отбытия, не вводя не названного в тексте пункта назначения.
- source_word: μέχρι τριακάδος Ξανθικοῦ
  choice: до тридцатого дня месяца ксантика
  rationale: Передан временной предел; македонское название месяца транслитерировано без пересчёта на иной календарь.
- source_word: ὑπάρξει
  choice: будет дана
  rationale: Будущее время ὑπάρχω здесь выражает наличие предоставляемой гарантии; по-русски пассивная конструкция звучит естественнее буквального «будет существовать».
- source_word: δεξιὰ
  choice: гарантия
  rationale: Буквально «правая рука», но в дипломатико-правовой речи это устойчивый образ заверения, обещания или гарантии; переносное значение вынесено в основной текст, буквальный образ сохранён в примечании.
- source_word: μετὰ τῆς ἀδείας
  choice: вместе с разрешением
  rationale: ἄδεια может обозначать разрешение, свободу действий или дозволение; «разрешение» точно соответствует официальному контексту и не уточняет сверх текста его объём.
