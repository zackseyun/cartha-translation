lexical_decisions:
- source_word: οὐδάμως
  choice: совершенно не
  rationale: Передаёт усиленное отрицание естественным современным русским выражением.
- source_word: ἐπιλογιζόμενος
  choice: считаясь с
  rationale: В данном контексте причастие означает принимать в расчёт, учитывать; оборот «не считаясь с» естественно передаёт пренебрежение Божьей силой.
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: могущество Бога
  rationale: κράτος обозначает действенную силу или мощь; «могущество» сохраняет контраст между Божьей силой и перечисленной военной мощью, не сводя значение к владычеству.
- source_word: πεφρονηματισμένος
  choice: возгордившись
  rationale: Передаёт состояние надменной уверенности, вызванной численностью войска; деепричастие естественно связывает его с перечислением опор этой гордости.
- source_word: μυριάσιν τῶν πεζῶν
  choice: десятками тысяч пеших воинов
  rationale: Сохраняет числовой оттенок μυριάδες, которое может означать как десятитысячные множества, так и вообще очень большое число.
- source_word: χιλιάσι τῶν ἱππέων
  choice: тысячами всадников
  rationale: Точно и естественно передаёт множественное числовое выражение и обозначение конных воинов.
- source_word: ἐλέφασιν τοῖς ὀγδοήκοντα
  choice: восемьюдесятью слонами
  rationale: Передаёт точное число и сохраняет синтаксический параллелизм перечня.
theological_decisions:
- issue: Передача τὸ τοῦ θεοῦ κράτος в контексте хвастовства военной силой
  choice: могущество Бога
  alternative: сила Бога; власть Бога
  rationale: «Могущество» подчёркивает действенную Божью мощь в противопоставлении человеческим военным ресурсам, не привнося более узкого утверждения о владычестве.
