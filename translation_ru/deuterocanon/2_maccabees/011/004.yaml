  text: not at all taking into account the might of God[b][a], but puffed up by the tens of thousands of foot soldiers and the thousands of horsemen and the eighty elephants.
translation:
  language: ru
  text: совершенно не принимая во внимание могущество Бога, но возгордившись десятками тысяч пеших воинов[a], тысячами всадников и восемьюдесятью слонами.
