base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/006.yaml
  text: But when those around Maccabeus learned that he was besieging the strongholds[a], they, together with the crowds, pleaded with the Lord with lamentations and tears to send a good angel for the salvation of Israel.
translation:
  language: ru
  text: Когда же те, кто был с Маккавеем, узнали, что Маккавей осаждает укрепления, они вместе с народом, с плачем и слезами, молили Господа послать доброго ангела для спасения Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для избавления Израиля». Греческое слово σωτηρία может обозначать как спасение в широком смысле, так и конкретное избавление от опасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετέλαβον
  choice: узнали
  rationale: В данном контексте глагол обозначает получение известия; «узнали» естественно передаёт этот смысл и не смешивает его с другим значением — «приняли участие».
- source_word: οἱ περὶ τὸν Μακκαβαῖον
  choice: люди Маккавея
  rationale: Греческий оборот обозначает группу сторонников или соратников, связанных с Маккавеем. Русское выражение естественно и не утверждает сверх текста, входил ли сам Маккавей в обозначенную группу в данный момент.
- source_word: πολιορκοῦντα
  choice: осаждает
  rationale: Причастие от πολιορκέω описывает продолжающуюся осаду укреплённых мест; настоящее время в придаточном сохраняет одновременность с моментом получения известия.
- source_word: τὰ ὀχυρώματα
  choice: укрепления
  rationale: ὀχύρωμα означает укреплённое место или оборонительное сооружение; «укрепления» точно и естественно в военном контексте.
- source_word: μετὰ ὀδυρμῶν καὶ δακρύων
  choice: с рыданиями и слезами
  rationale: Формулировка сохраняет интенсивность скорби и звучит естественно в современном литературном русском.
- source_word: ἱκέτευον
  choice: молили
  rationale: Глагол выражает настойчивую, смиренную просьбу; в обращении к Богу «молили» передаёт и действие, и молитвенный контекст.
- source_word: σὺν τοῖς ὄχλοις
  choice: вместе с народом
  rationale: ὄχλοι буквально указывает на массы или толпы. В данном повествовательном контексте «народ» звучит достойно и ясно, сохраняя коллективный характер обращения.
- source_word: τὸν κύριον
  choice: Господа
  rationale: В иудейской молитве κύριος относится к Богу; традиционное и точное русское соответствие — «Господь».
- source_word: ἀγαθὸν ἄγγελον
  choice: доброго ангела
  rationale: Буквально сохраняет прилагательное ἀγαθός, не конкретизируя сверх текста, означает ли оно благого, благосклонного или приносящего помощь ангела.
- source_word: ἀποστεῖλαι
  choice: послать
  rationale: Прямое и естественное соответствие инфинитиву со значением отправления посланника.
- source_word: πρὸς σωτηρίαν τῷ Ἰσραήλ
  choice: для спасения Израиля
  rationale: «Спасение» сохраняет широкий смысл σωτηρία и богословское звучание, тогда как непосредственный военный контекст допускает также «избавление»; это отражено в примечании.
theological_decisions:
- issue: Передача κύριος в иудейской молитве
  choice: Господь
  alternative: Бог; владыка
  rationale: Исходный текст имеет κύριος, и контекст ясно указывает на Бога. «Господь» сохраняет лексическую форму и почтительный библейский регистр.
- issue: Передача σωτηρία в контексте военной угрозы
  choice: спасение
  alternative: избавление
  rationale: Непосредственно речь идёт об избавлении от военной опасности, однако σωτηρία имеет более широкий смысл. Основной текст сохраняет эту широту, а конкретное контекстуальное прочтение дано в примечании.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Синтаксис сделан естественным для русского повествования; эмоциональная сила молитвы и неоднозначность слова σωτηρία сохранены.
