lexical_decisions:
- source_word: ὑγιαίνετε
  choice: Будьте здоровы
  rationale: Буквальное значение формы — пожелание здоровья; в конце письма это также традиционная прощальная формула. Русское «Будьте здоровы» естественно передаёт и буквальный образ, и функцию заключительного пожелания.
- source_word: ἔτους
  choice: в … году
  rationale: Родительный падеж входит в греческую формулу датировки; по-русски она естественно передаётся предложным сочетанием «в … году».
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: сто сорок восьмом
  rationale: Сохраняется порядковое обозначение года селевкидской эры без добавления отсутствующего в тексте пояснения.
- source_word: Ξανθικοῦ
  choice: месяца ксантика
  rationale: Название македонского месяца передано принятой русской транслитерацией; родовое слово «месяца» добавлено для ясности датировки.
- source_word: πεντεκαιδεκάτῃ
  choice: в пятнадцатый день
  rationale: Форма согласуется с подразумеваемым словом «день»; оно выражено явно, как того требует естественная русская формула даты.
