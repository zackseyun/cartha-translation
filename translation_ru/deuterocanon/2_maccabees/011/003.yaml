  text: and to make the sanctuary taxable in silver[a], like the other temples of the nations, and to make the high priesthood sold each year[b];
translation:
  language: ru
  text: и сделать святилище источником денежных сборов[a], как и прочие языческие храмы, а первосвященство ежегодно выставлять на продажу[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обложить святилище денежной данью». Редкое греческое слово ἀργυρολόγητον означает превращение святилища в источник денежных поступлений, подобно языческим храмам.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сделать первосвященство продаваемым каждый год». То есть саму должность предполагалось ежегодно выставлять на продажу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: святилище
  rationale: Обозначает священное место и храмовый комплекс в Иерусалиме; «святилище» сохраняет культовый смысл и отличает его от τεμένη далее.
- source_word: ἀργυρολόγητον
  choice: источником денежных сборов
  rationale: Редкое прилагательное связано с серебром/деньгами и взиманием платежей. Выбранная формулировка естественно передаёт превращение святилища в объект денежной эксплуатации, не уточняя без достаточных оснований конкретную форму налога.
- source_word: τεμένη
  choice: храмы
  rationale: Здесь имеются в виду священные участки или святилища других народов; в современном русском контексте «храмы» звучит наиболее естественно.
- source_word: τῶν ἐθνῶν
  choice: языческие
  rationale: В данном противопоставлении выражение означает храмы иных народов и их культов; прилагательное естественно передаёт этот контекст.
- source_word: πρατὴν
  choice: выставлять на продажу
  rationale: Передаёт, что сама должность становилась продаваемой; русская глагольная конструкция ясна и сохраняет коммерческий характер замысла.
- source_word: ἀρχιερωσύνην
  choice: первосвященство
  rationale: Речь идёт о должности и достоинстве первосвященника, а не только о лице, которое её занимает.
- source_word: κατʼ ἔτος
  choice: ежегодно
  rationale: Точно и естественно передаёт повторяющийся каждый год характер продажи.
- source_word: ποιήσειν
  choice: сделать / выставлять
  rationale: Один греческий инфинитив относится к обоим замыслам; по-русски его значение естественно передано разными конструкциями согласно дополнениям.
