  yaml_path: translation/deuterocanon/2_maccabees/011/036.yaml
  text: But whatever he has decided should be presented to the king, send someone at once to examine these matters, so that we may settle them as is fitting for us; for we are going on to Antioch.
translation:
  language: ru
  text: Что бы он ни решил представить царю, немедленно пошлите кого-нибудь, чтобы он рассмотрел эти вопросы, — чтобы мы могли поступить так, как нам подобает[a]; ведь мы направляемся в Антиохию.
  philosophy: optimal-equivalence
  footnotes:
