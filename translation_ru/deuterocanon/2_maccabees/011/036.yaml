    text: 'Или: «чтобы мы могли уладить эти вопросы так, как нам подобает». Буквально по-гречески: «чтобы мы имели [их] так, как нам подобает»; вероятно, это выражение означает надлежащим образом распорядиться этими вопросами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δὲ
  choice: А то, что
  rationale: δέ обозначает мягкий переход, а относительное ἃ вводит совокупность вопросов; по-русски естественно «А то, что».
- source_word: ἔκρινεν
  choice: он решил
  rationale: κρίνω здесь означает принятое официальное решение; субъект в греческом тексте оставлен неуточнённым, что сохранено местоимением.
- source_word: προσανενεχθῆναι τῷ Βασιλεῖ
  choice: представить царю
  rationale: Пассивный инфинитив передаёт официальное вынесение вопросов на рассмотрение царя; «представить» сохраняет административный оттенок.
- source_word: πέμψατέ τινα παραχρῆμα
  choice: немедленно пошлите кого-нибудь
  rationale: Императив и наречие срочности переданы прямо; τις не уточняет пол посланника.
- source_word: ἐπισκεψόμενον περὶ τούτων
  choice: разобраться в этих вопросах
  rationale: Причастие выражает цель отправки — рассмотреть или выяснить обсуждаемые дела; выбран естественный современный административный оборот.
- source_word: ἵνʼ ἔχωμεν ὡς καθήκει ἡμῖν
  choice: чтобы мы могли уладить их, как нам подобает
  rationale: Буквальное «чтобы мы имели» в данном контексте идиоматично указывает на надлежащее устройство дел; «уладить» передаёт вероятный практический смысл, а сноска сохраняет неоднозначность.
- source_word: ἡμεῖς γὰρ προσάγομεν πρὸς Ἀντιοχίαν
  choice: потому что мы направляемся в Антиохию
  rationale: При указании пункта назначения προσάγομεν описывает движение к месту; «направляемся» естественно и не уточняет способ передвижения.
