  text: But concerning these matters in detail[b][a], I have given orders that both these men and those from me should speak with you.
translation:
  language: ru
  text: Что же касается этих вопросов по отдельности, я распорядился, чтобы и эти люди, и те, кто от меня, переговорили с вами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ δὲ τούτων
  choice: Что же касается этих дел
  rationale: ὑπέρ с родительным падежом имеет значение «о, касательно»; δέ передано мягким переходом «же», а τούτων по контексту обозначает упомянутые вопросы или дела.
- source_word: κατὰ μέρος
  choice: подробностей
  rationale: Оборот означает рассмотрение по отдельным пунктам, то есть в подробностях; русская конструкция естественно связывает его с предыдущими словами.
- source_word: ἐντέταλμαι
  choice: я поручил
  rationale: Перфект ἐντέλλομαι указывает на данное распоряжение, сохраняющее силу. «Поручил» передаёт официальный характер указания без излишне резкого оттенка.
- source_word: τούτους τε καὶ τοὺς παρʼ ἐμοῦ
  choice: и этим людям, и моим представителям
  rationale: Корреляция τε καί объединяет две группы. Буквальное «те, кто от меня» в данном административном контексте естественно означает представителей правителя.
- source_word: διαλεχθῆναι ὑμῖν
  choice: обсудить их с вами
  rationale: διαλέγομαι здесь означает вести обсуждение или переговоры, а не просто говорить; местоимение «их» естественно отсылает к подробностям названных дел.
