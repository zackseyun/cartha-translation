  text: John and Absalom[a], who were sent by you, delivered the written memorandum and made request concerning the matters indicated in it.
translation:
  language: ru
  text: Иоанн и Авессалом, посланные вами, представили письменное сообщение[a] и обратились с просьбой относительно того, что в нём было обозначено.
  philosophy: optimal-equivalence
