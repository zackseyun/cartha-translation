lexical_decisions:
- source_word: Ἰωάνης
  choice: Иоанн
  rationale: Традиционная русская форма библейского личного имени, соответствующая греческому Ἰωάνης.
- source_word: Ἀβεσσαλώμ
  choice: Авессалом
  rationale: Традиционная русская форма библейского личного имени, сохраняющая узнаваемость.
- source_word: οἱ πεμφθέντες παρʼ ὑμῶν
  choice: посланные вами
  rationale: Естественно передаёт пассивное причастие и значение источника или действующего лица при παρά с родительным падежом.
- source_word: ἐπιδόντες
  choice: передали
  rationale: В контексте официального документа глагол обозначает его вручение или представление адресату.
- source_word: τὸν ὑπογεγραμμένον χρηματισμόν
  choice: письменное обращение
  rationale: Сохраняет официальный документальный оттенок χρηματισμός, не сужая значение до строго определённого жанра; ὑπογεγραμμένον указывает на записанный или приложенный текст.
- source_word: ἠξίουν
  choice: просили рассмотреть
  rationale: Передаёт формальную просьбу в дипломатической переписке; добавление «рассмотреть» естественно связывает просьбу с указанными в документе вопросами, не определяя требуемого решения.
- source_word: περὶ τῶν διʼ αὐτοῦ σημαινομένων
  choice: изложенные в нём вопросы
  rationale: Естественная русская передача содержания, обозначенного посредством документа; местоимение отнесено к письменному обращению.
