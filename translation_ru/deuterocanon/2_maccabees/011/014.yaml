  rationale: 'Исправление сохраняет сжатую двучленную конструкцию оригинала: он убедил адресата как заключить соглашение, так и в том, что убедит царя. «Заставив» восстанавливает силу ἀναγκάζων; уточняющее «того» устраняет возможную неясность, что принуждаемым является царь. Сноска сохраняет допустимую лексическую неоднозначность συλλύεσθαι и τὰ δίκαια.'
