  yaml_path: translation/deuterocanon/2_maccabees/011/014.yaml
  text: He persuaded him to come to terms on all the just demands[a], and that he would also persuade the king, compelling him to become their friend.
translation:
  language: ru
  text: Он убедил его заключить соглашение на всех справедливых условиях[a] и в том, что также убедит царя, заставив того стать их другом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «примириться по всем правомерным вопросам»; возможно также: «договориться обо всех справедливых требованиях». Греческое συλλύεσθαι выражено сжато и может обозначать достижение примирения или урегулирования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεισεν
  choice: убедил
  rationale: Аорист πείθω прямо обозначает успешное убеждение; дополнение «его» восстанавливается из контекста.
- source_word: συλλύεσθαι
  choice: заключить соглашение
  rationale: В дипломатическом контексте инфинитив передаёт достижение примирения или урегулирования, а не буквальное «совместное разрешение».
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: на всех справедливых условиях
  rationale: Субстантивированное τὰ δίκαια здесь относится к справедливым, правомерным условиям урегулирования, а не к богословской праведности.
- source_word: διότι καὶ τὸν βασιλέα πείσει
  choice: и заверил, что убедит также царя
  rationale: Передаёт содержание дальнейшего убеждения и будущность πείσει естественным русским синтаксисом; «заверил» эксплицирует сжатую связь частей греческой фразы.
- source_word: φίλον αὐτοῖς
  choice: их другом
  rationale: Предикативное φίλον при γενέσθαι означает дружественное политическое расположение к ним.
- source_word: ἀναγκάζων γενέσθαι
  choice: настояв на том, чтобы тот стал
  rationale: Причастие ἀναγκάζων выражает сильное давление; «настояв» сохраняет эту силу, не придавая дипломатическому контексту обязательного оттенка физического принуждения.
theological_decisions:
- issue: Значение τοῖς δικαίοις в политико-правовом контексте
  choice: справедливых условиях
  alternative: правомерных требованиях; справедливых делах
  rationale: Речь идёт об условиях или притязаниях при переговорах, поэтому богословский термин «праведность» здесь был бы неуместен.
- issue: Связь διότι со сказуемым ἔπεισεν
  choice: 'передать как содержание заверения: «и заверил, что…»'
  alternative: 'причинное прочтение: «поскольку он убедит также царя»'
  rationale: Греческая конструкция сжата и допускает некоторую неоднозначность. В основном тексте избрана естественная содержательная связь, согласующаяся с развитием дипломатической речи, без изменения заявленного будущего действия.
translation_notes:
  register: Современный литературный русский язык; дипломатический характер сцены передан ясно и достойно. Сжатый греческий синтаксис слегка развёрнут ради естественности, при этом неоднозначность συλλύεσθαι и τοῖς δικαίοις отмечена в сноске.
