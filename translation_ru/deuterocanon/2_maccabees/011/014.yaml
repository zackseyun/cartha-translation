  terminology: «Справедливые условия» уместно передаёт политико-правовое значение τοῖς δικαίοις без богословской окраски. «Стать их другом» корректно передаёт φίλον αὐτοῖς как политическое расположение. Для ἀναγκάζων требуется более сильное «заставив», а не «настояв».
