  terminology: «Законы» удачно сохраняет нормативную силу νόμοις; «припасы» оправданно оставляет δαπανήμασιν широким, а сноска добросовестно отмечает варианты «расходы/средства». «Притеснения» адекватно передаёт παρενοχληθήσεται.
