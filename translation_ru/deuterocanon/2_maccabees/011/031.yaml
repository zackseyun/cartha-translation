base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/031.yaml
  text: that the Jews may make use of their own provisions and laws[a], just as before[b]; and none of them shall in any way be harassed concerning the things done in ignorance.
translation:
  language: ru
  text: чтобы иудеям было дозволено пользоваться своими припасами[a] и следовать своим законам, как и прежде; и никто из них никоим образом не подвергнется притеснениям в связи с тем, что было сделано по неведению[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своими средствами». Греческое слово может обозначать расходы, средства или припасы; здесь, вероятно, имеются в виду практические условия иудейского образа жизни, возможно включая пищу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в отношении того, что осталось неизвестным». Греческое выражение допускает как действия, совершённые по неведению, так и дела, о которых прежде не знали.'
    reason: alternative_reading
lexical_decisions:
- source_word: χρῆσθαι
  choice: было дозволено пользоваться… и следовать
  rationale: Инфинитив выражает предоставленное разрешение. Русское «пользоваться» естественно сочетается с припасами, а «следовать» — с законами; такое разложение греческой конструкции сохраняет её смысл без неестественного «пользоваться законами».
- source_word: δαπανήμασιν
  choice: припасами
  rationale: Слово может обозначать расходы, средства или то, что приобретается и используется. В контексте разрешения иудеям вернуться к прежнему образу жизни «припасы» передаёт вероятный практический смысл, не сужая его прямо до пищи.
- source_word: νόμοις
  choice: законам
  rationale: «Законы» сохраняет формальный и религиозно-правовой смысл νόμοις; перевод «обычаи» был бы слабее.
- source_word: καθὰ καὶ τὸ πρότερον
  choice: как и прежде
  rationale: Естественно передаёт сравнение с прежним положением и практикой.
- source_word: παρενοχληθήσεται
  choice: не подвергнется притеснениям
  rationale: Будущая пассивная форма обозначает защиту от беспокоящего вмешательства или притеснения; выбранная формулировка уместна для официального письма.
- source_word: περὶ τῶν ἠγνοημένων
  choice: в связи с тем, что было сделано по неведению
  rationale: Формулировка сохраняет широту греческого выражения и не превращает его без достаточных оснований в узкую юридическую категорию «непреднамеренных правонарушений».
theological_decisions:
- issue: Объём защитительной оговорки περὶ τῶν ἠγνοημένων
  choice: Общая защита от притеснений в связи с тем, что было сделано по неведению
  alternative: Защита в отношении ранее не замеченных дел либо непреднамеренных нарушений закона
  rationale: Греческий текст не уточняет, чьё именно неведение имеется в виду и носили ли соответствующие действия характер правонарушений. Перевод оставляет эту неоднозначность открытой.
translation_notes:
  register: Современный литературный русский язык с достоинством официального царского послания. Синтаксис остаётся частью продолжающегося предложения («чтобы…»). Греческая конструкция с одним χρῆσθαι перед двумя дополнениями естественно разложена на «пользоваться… и следовать», без изменения объёма предоставленного разрешения.
