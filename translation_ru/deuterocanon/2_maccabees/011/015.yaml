  yaml_path: translation/deuterocanon/2_maccabees/011/015.yaml
  text: And Maccabeus agreed to everything that Lysias urged, being concerned for what was advantageous; for whatever Maccabeus set before Lysias in writing concerning the Jews, the king granted.
translation:
  language: ru
  text: Маккавей согласился на всё, о чём просил Лисий, заботясь о том, что было полезно; ведь всё, что Маккавей письменно представил Лисию относительно иудеев, секретарь[a] одобрил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В приведённом греческом тексте — «секретарь» (ὁ γραμματεύς); в некоторых текстах и переводах — «царь».
    reason: Сохраняет чтение предоставленного греческого источника и прозрачно отмечает значимое расхождение с консультационным английским текстом.
lexical_decisions:
- source_word: ἐπένευσε
  choice: согласился
  rationale: Глагол обозначает выражение согласия или одобрения; в данном контексте естественно передаётся как «согласился».
- source_word: παρεκάλει
  choice: просил
  rationale: Здесь παρακαλέω означает настойчиво просить или убеждать. «Просил» сохраняет смысл без чрезмерного усиления.
- source_word: τοῦ συμφέροντος φροντίζων
  choice: заботясь о том, что было полезно
  rationale: Передаёт мысль о внимании к пользе или выгоде, не уточняя, для кого именно она была полезна, поскольку греческий текст этого не определяет.
- source_word: ἔδωκεν τῷ Λυσίᾳ διὰ γραπτῶν
  choice: письменно представил Лисию
  rationale: Буквальное «дал Лисию посредством письменного» в контексте означает передачу предложений или требований в письменном виде.
- source_word: συνεχώρησεν
  choice: одобрил
  rationale: В контексте переговоров глагол означает согласиться, уступить или удовлетворить просьбу; «одобрил» естественно сочетается с письменно представленными условиями.
- source_word: ὁ γραμματεύς
  choice: секретарь
  rationale: Это прямое значение существительного в предоставленном греческом тексте; титул или принадлежность секретаря не уточняются.
theological_decisions:
- issue: Лицо, утвердившее письменные предложения
  choice: секретарь
  alternative: царь
  rationale: Предоставленный текст LXX Swete прямо читает ὁ γραμματεύς («секретарь/писец»), тогда как консультационный английский текст имеет «the king». Перевод следует указанному оригинальному источнику, а расхождение отмечает в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранена неопределённость выражения «то, что было полезно»; не добавлено, чья именно польза имеется в виду. Официально-деловой оттенок переговоров передан словами «письменно представил» и «одобрил».
