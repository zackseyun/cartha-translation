  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призвал вас», «увещевал вас» или «обратился к вам с просьбой». Греческий глагол παρακαλέω, в зависимости от контекста, может означать ободрять, призывать, увещевать или обращаться с просьбой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπομφα
  choice: я послал
  rationale: Перфект действительного залога указывает на уже совершённую отправку, значимую в момент написания письма. В современном русском это естественно передаётся прошедшим временем.
- source_word: δὲ
  choice: также (в сочетании с καὶ)
  rationale: Частица δέ мягко продолжает мысль и не требует противительного «но»; вместе с καί она естественно передаётся связкой «также».
- source_word: καὶ
  choice: также
  rationale: 'Передаёт добавочное значение: Менелай послан в дополнение к уже названным мерам или посланникам.'
- source_word: τὸν Μενέλαον
  choice: Менелая
  rationale: Греческое личное имя передано принятой русской формой и поставлено в винительный падеж согласно синтаксису.
- source_word: παρακαλέσοντα
  choice: чтобы он обратился к вам с увещанием
  rationale: Будущее действительное причастие после глагола «послал» выражает цель. Формулировка сохраняет присущий παρακαλέω диапазон между ободрением, призывом и настоятельной просьбой, не сводя его к одному узкому оттенку.
- source_word: ὑμᾶς
  choice: к вам
  rationale: Обозначает адресатов предполагаемого обращения Менелая; русская конструкция требует предложного сочетания «к вам».
