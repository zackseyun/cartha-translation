  text: They advanced in battle formation[a], having the ally from heaven before them, because the Lord had shown them mercy.
translation:
  language: ru
  text: Они наступали в боевом строю[a], имея перед собой союзника с неба, потому что Господь помиловал их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они выступили, готовые к бою, а впереди них шёл союзник с неба». Начало греческой фразы сжато и допускает несколько близких толкований.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρόηγον
  choice: наступали … перед собой
  rationale: Сжатый и несколько необычный греческий оборот передан глаголом движения; при этом смысл предшествования естественно сохраняется в последующей фразе «перед собой».
- source_word: ἐν διασκευῇ
  choice: в боевом строю
  rationale: Оборот обозначает снаряжённость и готовность к бою, а в данном военном контексте также допускает представление об организованном построении.
- source_word: σύμμαχον
  choice: союзника
  rationale: Слово обозначает того, кто вместе с кем-либо участвует в борьбе; «союзник» сохраняет его военный оттенок точнее, чем общее «помощник».
- source_word: ἀπʼ οὐρανοῦ
  choice: с неба
  rationale: Буквально передаёт происхождение союзника; в религиозном контексте под небом подразумевается небесная сфера.
- source_word: ἐλεήσαντος
  choice: помиловал
  rationale: Аористное причастие указывает на милость Господа как основание их уверенного выступления; «помиловал» кратко и естественно сохраняет мотив милости.
- source_word: τοῦ κυρίου
  choice: Господь
  rationale: В иудейском библейском контексте κύριος служит благоговейным обозначением Бога и традиционно передаётся словом «Господь».
theological_decisions:
- issue: Кто назван «союзником с неба»
  choice: Личность союзника не уточняется.
  alternative: Ангельский помощник или непосредственная помощь Бога.
  rationale: Греческий текст не определяет этого союзника точнее, поэтому перевод сохраняет исходную богословскую открытость.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-торжественное. Военная образность сохранена без архаизации, а неоднозначность греческого начала отмечена в сноске.
