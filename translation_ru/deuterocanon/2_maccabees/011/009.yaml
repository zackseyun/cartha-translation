  text: And all together they blessed the merciful God and were strengthened in spirit[a], being ready to wound not only men but even the fiercest wild beasts and iron walls.
translation:
  language: ru
  text: И все вместе благословили милосердного Бога и укрепились духом[a], готовые поражать не только людей, но даже самых свирепых зверей и железные стены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укрепились душами». Греческое выражение означает, что они внутренне окрепли и исполнились мужества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοῦ δὲ πάντες
  choice: И все вместе
  rationale: Передаёт совместность и единодушие действия; δέ естественно выражено связующим «и» в продолжении повествования.
- source_word: εὐλόγησαν
  choice: благословили
  rationale: Сохраняет прямое религиозное значение глагола — благословлять Бога, не сводя его лишь к восхвалению.
- source_word: τὸν ἐλεήμονα θεόν
  choice: милосердного Бога
  rationale: Естественно и точно передаёт определение ἐλεήμονα и подчёркнутое в тексте свойство Бога.
- source_word: ἐπερρώσθησαν ταῖς ψυχαῖς
  choice: укрепились духом
  rationale: Русское выражение естественно обозначает обретение внутренней силы и мужества; буквальная связь с ψυχαῖς отмечена в сноске.
- source_word: ἀνθρώπους
  choice: людей
  rationale: Нейтрально и точно передаёт ἀνθρώπους в противопоставлении зверям, не сужая значение до взрослых мужчин.
- source_word: θῆρας δὲ τοὺς ἀγριωτάτους
  choice: но даже самых свирепых зверей
  rationale: Передаёт значение θῆρας и превосходную степень ἀγριωτάτους; «даже» естественно раскрывает усилительное противопоставление.
- source_word: σιδηρᾶ τείχη
  choice: железные стены
  rationale: Сохраняет яркий гиперболический образ исходного текста.
- source_word: τιτρώσκειν
  choice: поражать
  rationale: Глагол означает наносить рану или повреждение. «Поражать» в русском допускает как одушевлённые объекты, так и стены и потому сохраняет необычную широту греческой конструкции.
- source_word: ὄντες ἕτοιμοι
  choice: готовые
  rationale: Причастный оборот естественно связывает внутреннее укрепление с последующей готовностью к бою.
theological_decisions:
- issue: Передача ψυχαῖς в описании мужества перед битвой
  choice: укрепились духом
  alternative: укрепились душами; укрепились в душах
  rationale: Здесь речь идёт о внутренней стойкости и решимости, а не о специальном учении о составе человека. Основной вариант естественен по-русски, а более буквальное значение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным повествовательным оттенком. Сохранены религиозная лексика и гиперболический образ оригинала; синтаксис сделан ясным и естественным без устранения необычного сочетания «поражать… железные стены».
