  text: But springing at the enemies like lions, they struck down eleven thousand of them, and sixteen hundred cavalry; and they forced them all to flee.
translation:
  language: ru
  text: Но, бросившись на врагов, словно львы, они повергли одиннадцать тысяч из них и тысячу шестьсот всадников, а всех принудили к бегству.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λεόντινων δὲ ἐντινάξαντες
  choice: Но, бросившись на врагов, словно львы
  rationale: Передаёт образ львиного натиска естественным современным русским языком; редкая форма λεόντινων понята в соответствии с контекстом и древними переводческими традициями как сравнение со львами.
- source_word: κατέστρωσαν
  choice: повергли
  rationale: Глагол означает буквально «уложили наземь» и в военном контексте указывает на поражение и гибель; «повергли» сохраняет силу образа без излишней буквальности.
- source_word: χιλίους πρὸς τοῖς μυρίοις
  choice: одиннадцать тысяч
  rationale: Греческое выражение складывает одну тысячу с десятью тысячами.
- source_word: ἱππεῖς δὲ ἑξακοσίους πρὸς χιλίοις
  choice: тысячу шестьсот всадников
  rationale: Греческое выражение складывает шестьсот с тысячей; ἱππεῖς обозначает конных воинов, поэтому выбрано конкретное «всадников».
- source_word: τοὺς δὲ πάντας ἠνάγκασαν φεύγειν
  choice: а всех остальных обратили в бегство
  rationale: В контексте «все» естественно относится к уцелевшим вражеским силам; русская военная формула ясно передаёт принуждение к бегству.
