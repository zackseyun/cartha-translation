base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/007.yaml
  text: But Maccabeus himself[a], taking up arms first, urged the others, risking danger along with him, to come to the aid of their brothers[b]; and together they also rushed out eagerly.
translation:
  language: ru
  text: Сам Маккавей первым взялся за оружие и призвал остальных, чтобы они, подвергая себя опасности вместе с ним[a], пришли на помощь своим братьям[b]. И все они вместе охотно устремились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призвал остальных разделить с ним опасность и прийти на помощь своим братьям».'
    reason: Синтаксис греческого причастного оборота допускает передачу совместного риска как содержания призыва.
  - marker: b
    text: Под «братьями» здесь, вероятно, имеются в виду их собратья-иудеи или родичи.
    reason: Контекстуальное пояснение сохранённого в основном тексте языка родства.
lexical_decisions:
- source_word: αὐτὸς δὲ πρῶτος ὁ Μακκαβαῖος
  choice: Сам Маккавей первым
  rationale: «Сам» передаёт усилительное αὐτός, «первым» — ведущую инициативу, выраженную πρῶτος; δέ передано плавным повествовательным переходом без обязательного отдельного союза.
- source_word: ἀναλαβὼν τὰ ὅπλα
  choice: взялся за оружие
  rationale: Естественное русское военное выражение, передающее буквальное «взяв оружие» и смысл вооружения для действия.
- source_word: προετρέψατο τοὺς ἄλλους
  choice: призвал остальных
  rationale: «Призвал» передаёт побуждение к немедленному совместному действию, не придавая речи излишне торжественного оттенка.
- source_word: ἅμα αὐτῷ διακινδυνεύοντας
  choice: вместе с ним подвергавших себя опасности
  rationale: Причастный оборот согласован с «остальными», как и греческое διακινδυνεύοντας с τοὺς ἄλλους, и сохраняет значение совместного риска.
- source_word: ἐπιβοηθεῖν τοῖς ἀδελφοῖς αὐτῶν
  choice: прийти на помощь своим братьям
  rationale: Передаёт срочный характер ἐπιβοηθεῖν и сохраняет буквальный образ родства в ἀδελφοῖς.
- source_word: ὁμοῦ δὲ καὶ προθύμως ἐξώρμησαν
  choice: И все они дружно и с готовностью выступили
  rationale: «Дружно» передаёт совместность ὁμοῦ, «с готовностью» — προθύμως, а «выступили» естественно выражает начало энергичного движения без добавления прямо не названного боя.
theological_decisions:
- issue: Значение ἀδελφοῖς αὐτῶν
  choice: своим братьям
  alternative: своим соплеменникам / своим родичам
  rationale: Греческий текст использует буквальное обозначение братьев; в контексте оно, вероятно, охватывает собратьев-иудеев или родичей. Основной текст сохраняет язык родства, а возможный широкий смысл поясняется в сноске.
- issue: Связь ἅμα αὐτῷ διακινδυνεύοντας с предложением
  choice: остальные уже описаны как подвергающие себя опасности вместе с Маккавеем
  alternative: Маккавей призвал остальных разделить с ним опасность
  rationale: Форма διακινδυνεύοντας грамматически согласована с τοὺς ἄλλους и сохранена как обстоятельственно-определительный причастный оборот. Возможное прочтение оборота как содержания призыва не внесено в основной текст, но отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис близок к греческому, но разбит на два предложения ради ясности; избегаются архаизмы и чрезмерно церковная лексика.
