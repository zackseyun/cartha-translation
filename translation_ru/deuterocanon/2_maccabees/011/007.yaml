revisions:
- from: Сам Маккавей первым взялся за оружие и призвал остальных, вместе с ним подвергавших себя опасности[a], прийти на помощь своим братьям[b]. И все они дружно и с готовностью выступили.
  to: Сам Маккавей первым взялся за оружие и призвал остальных, чтобы они, подвергая себя опасности вместе с ним[a], пришли на помощь своим братьям[b]. И все они вместе охотно устремились.
  rationale: Редакция устраняет неестественное в русском языке определительное прочтение причастного оборота и делает совместный риск частью действия, к которому Маккавей побуждает остальных. Сноска сохраняет допустимую более явно координированную передачу. Финальный глагол усилен с «выступили» до «устремились» для передачи энергичного ἐξώρμησαν, без внесения не названного в оригинале направления или боевого действия.
