  yaml_path: translation/deuterocanon/2_maccabees/011/013.yaml
  text: But since he was not foolish[a], but was considering the defeat that had happened to him and had realized that the Hebrews were unconquerable, because the mighty God was fighting alongside them, he sent ahead
translation:
  language: ru
  text: 'Но он был не глуп: обдумав постигшую его неудачу и осознав, что евреи непобедимы, потому что могущественный Бог сражается на их стороне[a], он заранее послал…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что могущественный Бог является их союзником». Греческий глагол может означать как совместную борьбу, так и помощь в качестве союзника.'
    reason: Сохраняется военно-союзнический смысл συμμαχοῦντος и допустимая альтернативная передача.
lexical_decisions:
- source_word: οὐκ ἀνόους δὲ ὑπάρχων
  choice: Но он был не глуп
  rationale: Отрицательная характеристика передана прямо и естественно; причастная конструкция развёрнута в самостоятельную часть, сохраняющую причинно-логическую связь с последующим решением.
- source_word: πρὸς ἑαυτὸν ἀντιβάλλων
  choice: обдумав
  rationale: Оборот обозначает внутреннее сопоставление или взвешивание. «Обдумав» естественно передаёт размышление про себя, не добавляя отсутствующего в тексте предмета сравнения.
- source_word: τὸ γεγονὸς περὶ αὐτὸν ἐλάττωμα
  choice: постигшее его поражение
  rationale: ἐλάττωμα может обозначать ущерб, неудачу или военное поражение; в данном повествовательном контексте «поражение» ясно выражает военную неудачу, не предполагая окончательного разгрома.
- source_word: συννοήσας
  choice: осознав
  rationale: Форма указывает на достигнутое понимание, предшествующее отправке посланцев.
- source_word: ἀνικήτους εἶναι τοὺς Ἑβραίους
  choice: что евреи непобедимы
  rationale: «Непобедимы» кратко и точно передаёт ἀνίκητοι — тех, кого невозможно одолеть.
- source_word: τοῦ δυναμένου θεοῦ
  choice: могущественный Бог
  rationale: Субстантивированное причастие подчёркивает действенную силу Бога; «могущественный» сохраняет этот акцент и звучит естественно по-русски.
- source_word: συμμαχοῦντος αὐτοῖς
  choice: сражается на их стороне
  rationale: Глагол имеет военное значение совместной борьбы или союзнической помощи; выбранная формулировка передаёт активное участие Бога и оставляет союзнический оттенок для примечания.
- source_word: προαποστείλας
  choice: он заранее послал…
  rationale: Передаёт предварительность действия и сохраняет незавершённость синтаксиса, поскольку содержание отправленного сообщения следует в следующем стихе.
theological_decisions:
- issue: Божественная помощь евреям в сражении
  choice: потому что могущественный Бог сражается на их стороне
  alternative: при могущественном Боге как их союзнике
  rationale: Греческий текст прямо связывает непобедимость евреев с деятельной военной поддержкой Бога. Основной перевод сохраняет это утверждение, не ослабляя его до общего провидения и не расширяя сверх военного контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Двоеточие делает цепочку греческих причастий ясной, а многоточие показывает, что фраза продолжается в следующем стихе.
