  text: If[a], then, you maintain your goodwill in these matters, I will also continue from now on to try to be the cause of good things for you.
translation:
  language: ru
  text: Итак, если вы сохраните доброжелательное отношение к этим делам, то и я впредь постараюсь стать причиной благ для вас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συντηρήσητε
  choice: сохраните
  rationale: Глагол выражает продолжение и сохранение уже существующего расположения; «сохраните» естественно передаёт условный призыв.
- source_word: εὔνοιαν
  choice: доброжелательное отношение
  rationale: Существительное обозначает благосклонность или доброе расположение; выбранная формулировка ясна и уместна в дипломатическом письме.
- source_word: εἰς τὰ πράγματα
  choice: к этим делам
  rationale: Оборот широко указывает на обсуждаемые обстоятельства или дела, не конкретизируя их сверх греческого текста.
- source_word: εἰς τὸ λοιπόν
  choice: впредь
  rationale: Кратко и точно передаёт временную направленность на будущее.
- source_word: πειράσομαι
  choice: постараюсь
  rationale: Передаёт намерение и усилие, не превращая обещание в гарантию результата.
- source_word: αἰτιαῖος ἀγαθῶν γίνεσθαι
  choice: содействовать вашему благу
  rationale: Идиоматично передаёт мысль о том, чтобы стать причиной благоприятных результатов, сохраняя широкий смысл множественного ἀγαθῶν.
