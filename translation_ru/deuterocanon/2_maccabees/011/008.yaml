base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/011/008.yaml
  text: And there[a], when they were near Jerusalem, a horseman appeared going before them[b], clothed in white and brandishing golden armor.
translation:
  language: ru
  text: И там, когда они были близ Иерусалима, явился всадник[b], ехавший впереди них[a], в белом одеянии и размахивая золотым вооружением[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предшествовавший им». Греческое причастие указывает, что всадник находился или двигался впереди них, но само по себе не называет его предводителем.'
    reason: lexical_alternative
  - marker: b
    text: Греческий текст прямо не говорит, кем был этот всадник; повествование позволяет видеть в нём небесного защитника, не называя его так прямо.
    reason: cultural_note
  - marker: c
    text: Греч. πανοπλία означает полное вооружение или полный комплект доспехов; здесь оно связано с глаголом «размахивать, потрясать».
    reason: lexical_note
lexical_decisions:
- source_word: αὐτόθι
  choice: там
  rationale: Наречие указывает на уже упомянутое место; пространственное значение предпочтительнее временного «тогда».
- source_word: πρὸς τοῖς Ἱεροσολύμοις
  choice: близ Иерусалима
  rationale: Конструкция πρός с дательным выражает близость к городу; «близ» сохраняет возвышенный, но понятный современному читателю регистр.
- source_word: ὄντων
  choice: когда они были
  rationale: Родительный самостоятельный оборот естественно передан придаточным времени с подразумеваемым субъектом «они».
- source_word: ἐφάνη
  choice: явился
  rationale: Передаёт внезапное зримое появление, не уточняя природу явившегося.
- source_word: προηγούμενος αὐτῶν
  choice: ехавший впереди них
  rationale: Поскольку речь идёт о всаднике, «ехавший» естественнее общего «шедший»; выражение не приписывает ему прямо роль военачальника.
- source_word: ἔφιππος
  choice: всадник
  rationale: Субстантивированное прилагательное обозначает человека верхом; «всадник» — краткий и точный русский эквивалент.
- source_word: ἐν λευκῇ ἐσθῆτι
  choice: в белом одеянии
  rationale: Сохраняет заметную белую одежду и достоинство повествовательного стиля.
- source_word: πανοπλίαν χρυσῆν
  choice: золотым оружием
  rationale: В сочетании с κραδαίνων по-русски естественно обозначает боевое снаряжение, которым можно потрясать; более буквальное значение πανοπλίαν отмечено в сноске.
- source_word: κραδαίνων
  choice: потрясавший
  rationale: Передаёт энергичное движение боевым предметом и сохраняет торжественно-воинственный образ.
theological_decisions:
- issue: Кем был явившийся всадник
  choice: Фигура названа только всадником, как в греческом тексте.
  alternative: Назвать его ангелом или небесным воином.
  rationale: Текст описывает явление, но прямо не определяет природу всадника; перевод не должен устранять эту намеренную недосказанность.
- issue: Роль всадника по отношению к войску
  choice: «ехавший впереди них»
  alternative: «возглавлявший их» или «предводительствовавший ими»
  rationale: Причастие προηγούμενος указывает прежде всего на положение или движение впереди; формальное командование явно не утверждается.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Близ» и «одеяние» поддерживают достоинство стиля, оставаясь понятными; синтаксис сделан плавным, а неопределённость личности и роли всадника сохранена.
