lexical_decisions:
- source_word: πόλεις
  choice: города
  rationale: Обычное обозначение городских поселений; сохраняет противопоставление сельским областям.
- source_word: χώρας
  choice: сельские области
  rationale: В сочетании с πόλεις означает окружающие сельские территории, а не отдельные государства; множественное число соответствует греческому тексту.
- source_word: ἀπροσδοκήτως ἐρχόμενος
  choice: неожиданно подступая
  rationale: Передаёт внезапность появления и обстоятельственный характер причастия, не добавляя прямо не выраженного значения «нападая».
- source_word: ἐνεπίμπρα
  choice: предавал их огню
  rationale: Передаёт переходное значение «сжигал, поджигал» и повторяющийся характер действия, выраженный имперфектом.
- source_word: ἐπικαίρους τόπους
  choice: стратегически важные места
  rationale: В военном контексте речь идёт о местах, выгодных и подходящих для достижения цели; перевод сохраняет тактический оттенок.
- source_word: ἀπολαμβάνων
  choice: занимая
  rationale: В отношении мест означает овладение ими или установление над ними контроля; «занимая» естественно для военного контекста.
- source_word: οὐκ ὀλίγους
  choice: немало
  rationale: Русское «немало» естественно сохраняет греческую литоту, не заменяя её прямым «многих».
- source_word: τῶν πολεμίων
  choice: врагов
  rationale: Сохраняет множественное число греческого существительного и естественно звучит по-русски.
- source_word: τροπούμενος
  choice: обращал в бегство
  rationale: 'Передаёт военное значение: заставлял противников отступать или бежать, не расширяя его до общего «побеждал».'
