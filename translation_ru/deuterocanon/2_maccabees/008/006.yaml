  text: And coming upon cities and countryside unexpectedly[a], he would set them on fire; and by seizing strategic places, he put not a few of the enemies to flight,
translation:
  language: ru
  text: Неожиданно приходя в города и сельские области, он предавал их огню; занимая стратегически важные места[a], он обращал в бегство немало врагов,
