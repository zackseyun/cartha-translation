base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/002.yaml
  text: And they were calling on the Lord to look upon the people trampled down by all[a], and also to have mercy on the temple that had been defiled by ungodly men;
translation:
  language: ru
  text: И они взывали к Господу, прося взглянуть на народ, попираемый всеми, и сжалиться также над храмом, осквернённым нечестивыми людьми[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишённым святости», «обесчещенным». Греческое слово подчёркивает, что со святыней обошлись как с чем-то несвятым, обыденным.'
    reason: Лексическая альтернатива поясняет смысл βεβηλόω и сохраняет оттенок превращения святого в профанное.
lexical_decisions:
- source_word: ἐπεκαλοῦντο
  choice: взывали
  rationale: Имперфект передаёт продолжавшееся или повторявшееся молитвенное обращение; «взывали» естественно и достойно звучит в современном русском библейском повествовании.
- source_word: τὸν κύριον
  choice: к Господу
  rationale: В молитвенном контексте κύριος выступает как обращение к Богу; «Господь» сохраняет традиционное и понятное русское обозначение, не вводя явно имени-тетраграмматона.
- source_word: ἐφιδεῖν
  choice: взглянуть на
  rationale: Глагол выражает просьбу не просто увидеть, а обратить внимание на бедственное положение; «взглянуть на» сохраняет молитвенный оттенок и не добавляет прямого указания на последующее вмешательство.
- source_word: τὸν ... λαόν
  choice: на народ
  rationale: Речь идёт о народе как едином целом; «народ» точно и естественно передаёт λαός.
- source_word: ὑπὸ πάντων καταπατούμενον
  choice: попираемый всеми
  rationale: Сохранён яркий образ унижения и угнетения, выраженный καταπατέω, а неопределённая широта πάντων передана без добавления отсутствующего в греческом уточнения.
- source_word: οἰκτεῖραι
  choice: сжалиться над
  rationale: «Сжалиться» естественно передаёт просьбу к Богу о сострадании и милости, сохраняя синтаксический параллелизм инфинитивов.
- source_word: τὸν ναόν
  choice: над храмом
  rationale: В данном историческом контексте имеется в виду Иерусалимский храм; «храм» — ясный и стандартный русский эквивалент.
- source_word: βεβηλωθέντα
  choice: осквернённым
  rationale: Перфектное страдательное причастие указывает на совершённое осквернение с сохраняющимся результатом; «осквернённым» понятно передаёт нарушение святости храма.
- source_word: ὑπὸ τῶν ἀσεβῶν ἀνθρώπων
  choice: нечестивыми людьми
  rationale: ἀσεβής обозначает прежде всего непочтительность и нечестие по отношению к Богу, а ἄνθρωποι здесь называет человеческих виновников; «людьми» не вводит биологический пол, которого само существительное в данном употреблении не акцентирует.
theological_decisions:
- issue: Передача κύριος в молитве Богу Израиля
  choice: Господь
  alternative: Владыка
  rationale: «Господь» передаёт почтительное обращение к Богу и соответствует устойчивому русскому библейскому употреблению, не отождествляя явно κύριος с какой-либо реконструированной формой Божьего имени.
- issue: Характер просьбы, выраженной ἐφιδεῖν
  choice: взглянуть на
  alternative: призреть на; обратить внимание на
  rationale: Выбранная формулировка сохраняет просьбу о внимательном Божьем отношении, но не превращает её автоматически в утверждение о спасительном вмешательстве.
- issue: Передача ἀνθρώπων без искусственного уточнения пола
  choice: людьми
  alternative: мужами; мужчинами
  rationale: В сочетании ἀσεβῶν ἀνθρώπων акцент стоит на нечестивых человеческих деятелях, а не на их поле; современное русское «людьми» точно сохраняет эту смысловую направленность.
translation_notes:
  register: Современный литературный русский с достойным молитвенно-повествовательным звучанием. Причастные обороты сохраняют компактность и параллелизм греческой фразы. Маркер сноски поставлен непосредственно после слова «людьми», завершающего оборот об осквернении храма, поскольку сноска поясняет βεβηλωθέντα.
