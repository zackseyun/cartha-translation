  text: After carefully stripping them of their arms[a], they put everything in the proper places, but they carried the rest of the spoils to Jerusalem.
translation:
  language: ru
  text: Тщательно сняв с них оружие[a], они сложили всё в подходящих местах, а остальную добычу отнесли в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собрав у них оружие». Греческое причастие может подчёркивать как снятие оружия с побеждённых, так и сбор их оружия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁπλολογήσαντες
  choice: сняв с них оружие
  rationale: Причастие от ὁπλολογέω обозначает изъятие или сбор оружия у побеждённых; сочетание с αὐτούς естественно передаётся как «сняв с них оружие», при этом альтернативный оттенок отмечен в сноске.
- source_word: ἐπιμελῶς
  choice: тщательно
  rationale: Наречие выражает внимательность и заботливость действия; «тщательно» точно и естественно в современном русском языке.
- source_word: πάντα συνέθηκαν
  choice: они сложили всё
  rationale: συντίθημι здесь означает собрать и поместить изъятое в определённых местах. «Сложили всё» сохраняет конкретность греческого выражения, не вводя излишне узкого значения хранения.
- source_word: εἰς τοὺς ἐπικαίρους τόπους
  choice: в подходящих местах
  rationale: ἐπίκαιρος может означать подходящий, удобный или стратегически уместный. Нейтральное «подходящих» сохраняет эту смысловую широту.
- source_word: τὰ δὲ λοιπὰ τῶν σκύλων
  choice: а остальную добычу
  rationale: σκῦλα — военная добыча, а λοιπά указывает на оставшуюся часть после отделения уже размещённого.
- source_word: ἤνεγκαν εἰς Ἰεροσόλυμα
  choice: отнесли в Иерусалим
  rationale: Аорист φέρω обозначает физическое перемещение; «отнесли» конкретно передаёт действие и направление.
