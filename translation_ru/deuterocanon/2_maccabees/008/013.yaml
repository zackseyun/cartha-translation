translation:
  language: ru
  text: А те, кто трусил и не доверял Божьему суду[a], спасались бегством и покидали свои места.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Божьей справедливости»; в данном контексте возможно также: «Божьему возмездию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δειλανδροῦντες
  choice: пал духом
  rationale: Причастие обозначает утрату мужества и трусость; выражение «пал духом» естественно по-русски и передаёт наступившее состояние, не ослабляя упрёка.
- source_word: ἀπιστοῦντες
  choice: не доверял
  rationale: При прямом объекте речь идёт не об отвлечённом неверии, а о недоверии к тому, что Божий суд совершится.
- source_word: τὴν τοῦ θεοῦ δίκην
  choice: Божьему суду
  rationale: '«Суд» сохраняет широту δίκη: и правосудие как таковое, и конкретное судебное действие Бога, не сужая смысл до мести или кары.'
- source_word: διεδίδρασκον ἑαυτούς
  choice: разбегались
  rationale: Имперфект передаёт продолжавшееся или повторявшееся бегство; русский глагол естественно выражает, что люди один за другим спасались бегством.
- source_word: ἐξετόπιζον
  choice: покидали родные места
  rationale: Глагол указывает на удаление из своей местности; перевод передаёт вынужденное перемещение, не предполагая официальной ссылки.
theological_decisions:
- issue: Значение τὴν τοῦ θεοῦ δίκην
  choice: Божьему суду
  alternative: Божьей справедливости; Божьему возмездию
  rationale: «Суд» допускает как значение праведного Божьего правосудия, так и его конкретного действия в истории, сохраняя смысловую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; фраза звучит естественно и достойно. Сохранены противопоставление, длительный характер бегства и неоднозначность δίκη.
