- source_word: Συνιδὼν
  choice: видя
  rationale: Причастие выражает восприятие Филиппом происходящего и причину его последующего действия; «видя» естественно передаёт эту связь.
- source_word: κατὰ μικρὸν
  choice: мало-помалу
  rationale: Передаёт постепенное, поэтапное развитие, выраженное греческой идиомой.
- source_word: εἰς προκοπὴν ἐρχόμενον
  choice: набирает силу
  rationale: В военно-политическом контексте речь идёт о возрастающем влиянии и продвижении Иуды; оборот звучит естественно и не сводит смысл к материальному процветанию.
- source_word: τὸν ἄνδρα
  choice: этот человек
  rationale: Сохраняет явное обозначение лица в греческом тексте и отсылку к уже названному в контексте Иуде, не подставляя его имя непосредственно в стих.
- source_word: πυκνότερον
  choice: всё чаще
  rationale: Сравнительное наречие естественно понимать как возрастание частоты успешных продвижений; перевод сохраняет сравнительную силу, не устраняя возможный оттенок усиления.
- source_word: ἐν ταῖς εὐημερίαις προβαίνοντα
  choice: добивается успеха
  rationale: Множественное εὐημερίαι обозначает благоприятные исходы или успехи, а προβαίνοντα — дальнейшее продвижение; русский оборот передаёт общий смысл без неестественного буквального повторения.
- source_word: στρατηγὸν
  choice: правителю
  rationale: Здесь титул обозначает должностное лицо, управлявшее Келесирией и Финикией; «правитель» допускает административную и военную стороны полномочий.
- source_word: Κοίλης Συρίας
  choice: Келесирии
  rationale: Устоявшееся русское историко-географическое название области Coele-Syria.
- source_word: ἐπιβοηθεῖν
  choice: чтобы тот пришёл на помощь
  rationale: Передаёт не просто содействие, но прибытие или выступление для оказания поддержки.
- source_word: τοῖς τοῦ βασιλέως πράγματι
  choice: царскому делу
  rationale: Выражение обозначает дело, интересы или положение царя в широком военно-политическом смысле.
