base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/036.yaml
  text: And the one who had undertaken to pay tribute to the Romans from the capture of those in Jerusalem kept proclaiming that the Jews had as their defender one who fought for them[a], and that for this reason the Jews were invulnerable[b], because they followed the laws that had been commanded to them.
translation:
  language: ru
  text: А тот, кто взял на себя обязательство выплатить римлянам дань за счёт пленения жителей Иерусалима[a], продолжал провозглашать, что у иудеев есть защитник, сражающийся за них[b], и что поэтому иудеи неуязвимы, поскольку следуют предписанным им законам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за счёт захвата в плен жителей Иерусалима». Греческое выражение подразумевает предполагаемый доход от пленения жителей города.'
    reason: lexical_alternative
  - marker: b
    text: Защитник здесь прямо не назван; из контекста следует, что имеется в виду Бог, сражающийся за иудеев.
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... ἀναδεξάμενος
  choice: тот, кто взял на себя обязательство
  rationale: Субстантивированное причастие указывает на Никанора и выражает принятие им обязательства; формулировка не сужает смысл до официального договора.
- source_word: φόρον
  choice: дань
  rationale: Передаёт политический и финансовый характер платежа Риму точнее, чем общее «налог» или «платёж».
- source_word: ἀπὸ τῆς τῶν ἐν Ἱεροσολύμοις αἰχμαλωσίας
  choice: за счёт пленения жителей Иерусалима
  rationale: Оборот указывает на предполагавшийся источник средств — доход от захвата и обращения жителей Иерусалима в плен; «пленение» сохраняет событийное значение αἰχμαλωσία.
- source_word: κατορθώσασθαι
  choice: выплатить
  rationale: Буквально глагол означает «осуществить, успешно исполнить», но в данном финансовом контексте речь идёт об исполнении обязательства по уплате дани.
- source_word: κατήγγελλεν
  choice: продолжал провозглашать
  rationale: Имперфект передаёт продолженное или повторяющееся действие, а κατήγγελλεν — открытое объявление.
- source_word: ὑπέρμαχον ἔχειν
  choice: есть защитник, сражающийся за них
  rationale: Так переданы и защитная, и активно-военная составляющие слова ὑπέρμαχος; личность защитника в основном тексте не уточняется.
- source_word: ἀτρώτους
  choice: неуязвимы
  rationale: Соответствует значению «не подверженные ранениям» и естественно звучит в военном контексте.
- source_word: διὰ τὸ ἀκολουθεῖν
  choice: поскольку следуют
  rationale: Сохраняет причинное значение конструкции с διὰ и инфинитивом.
- source_word: τοῖς ἑαυτῶν προστεταγμένοις νόμοις
  choice: предписанным им законам
  rationale: 'Передаёт совершенный пассивный смысл: эти законы были властно установлены для них и остаются обязательными.'
theological_decisions:
- issue: Кто назван защитником иудеев в выражении ὑπέρμαχον ἔχειν
  choice: Не называть защитника прямо в основном тексте, сохранив косвенную формулировку греческого текста
  alternative: Прямо назвать защитником Бога
  rationale: Контекст подразумевает Бога как сражающегося за иудеев, однако в самой фразе Он прямо не назван; неопределённая формулировка сохраняет эту богословскую косвенность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сохраняет развёрнутую причинно-следственную структуру греческого предложения, но остаётся понятным современному читателю.
