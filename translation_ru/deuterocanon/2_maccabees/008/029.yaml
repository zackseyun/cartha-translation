  yaml_path: translation/deuterocanon/2_maccabees/008/029.yaml
  text: After doing these things[a], and making a common prayer of supplication[b], they begged the merciful Lord to be fully reconciled to his servants.
translation:
  language: ru
  text: Совершив всё это и вместе вознеся моление, они умоляли милосердного Господа полностью[a] примириться со Своими рабами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «окончательно»; возможно также: «наконец». Греческое выражение может подчёркивать полноту примирения, его завершённость или то, что оно наконец наступило.'
    reason: alternative_reading
lexical_decisions:
- source_word: διαπραξάμενοι
  choice: совершив всё это
  rationale: Причастие подводит итог предшествующим действиям; «совершив» передаёт их завершённость, не уточняя результат сверх греческого текста.
- source_word: κοινὴν ἱκετίαν ποιησάμενοι
  choice: вместе вознеся моление
  rationale: κοινήν указывает на совместный характер обращения, а ἱκετία — на настойчивую молитвенную просьбу. Формулировка естественна для современного русского языка.
- source_word: ἐλεήμονα κύριον
  choice: милосердного Господа
  rationale: Сохраняются обычное значение прилагательного и κύριος как божественный титул.
- source_word: ἠξίουν
  choice: умоляли
  rationale: В данном контексте глагол обозначает настойчивую просьбу; «умоляли» передаёт её силу лучше нейтрального «просили».
- source_word: εἰς τέλος
  choice: полностью
  rationale: Оборот, вероятнее всего, усиливает полноту примирения, однако может также указывать на его окончательность или значение «наконец»; неоднозначность отмечена в сноске.
- source_word: καταλλαγῆναι
  choice: примириться
  rationale: Передаёт восстановление отношений и благоволения, не сводя смысл лишь к прекращению гнева.
- source_word: τοῖς αὐτοῦ δούλοις
  choice: со Своими рабами
  rationale: «Рабы» прямо передаёт δοῦλοι и в русском библейском употреблении естественно выражает принадлежность Богу и зависимость от Него; возвратное «Своими» ясно соотносится с Господом.
theological_decisions:
- issue: Передача δοῦλοι по отношению к Богу
  choice: со Своими рабами
  alternative: со Своими слугами
  rationale: «Рабы» сохраняет более сильный смысл принадлежности и зависимости, присутствующий в δοῦλοι, и при этом является понятным традиционным русским обозначением отношения людей к Богу.
- issue: Значение εἰς τέλος при καταλλαγῆναι
  choice: полностью примириться
  alternative: окончательно примириться; наконец примириться
  rationale: Наиболее вероятно усилительное значение — полнота восстановления отношений. Поскольку оборот допускает также оттенок завершённости или времени, альтернативы вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. «Вознеся моление» сохраняет достоинство стиля, а порядок слов остаётся ясным и естественным.
