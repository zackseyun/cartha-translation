  yaml_path: translation/deuterocanon/2_maccabees/008/026.yaml
  text: For it was the day before the Sabbath[a], and for that reason they did not continue pursuing them for long.
translation:
  language: ru
  text: Ведь это был день перед субботой[a], и потому они не стали долго преследовать их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение, переданное словами «день перед субботой», в тексте Света сформулировано необычно и лексически затруднительно (ἡ πρὸ τοῦ σαββάτου δίκη). Перевод следует ясному смыслу контекста: приближение субботы ограничило продолжительность погони.'
    reason: textual_variant
lexical_decisions:
- source_word: ἦν γὰρ
  choice: Ведь это был
  rationale: γάρ поясняет причину предшествующего действия; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: ἡ πρὸ τοῦ σαββάτου δίκη
  choice: день перед субботой
  rationale: Слово δίκη в данной фразе текстуально и лексически затруднительно, но сочетание πρὸ τοῦ σαββάτου и контекст ясно указывают на время перед наступлением субботы.
- source_word: διʼ ἣν αἰτίαν
  choice: и потому
  rationale: Кратко и естественно передаёт причинную связь с предыдущей частью предложения.
- source_word: οὐκ ἐμακροτόνησαν
  choice: не стали долго
  rationale: Глагол обозначает непродолжение или незатягивание действия; вместе с причастием речь идёт о том, что погоню не продолжали долго.
- source_word: κατατρέχοντες αὐτούς
  choice: преследовать их
  rationale: Нейтрально и ясно передаёт военный контекст погони за противниками.
