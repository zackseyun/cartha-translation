  text: But they killed the commander among those with Timothy, a thoroughly worthless man who had caused the Jews much distress.
translation:
  language: ru
  text: Они же убили военачальника из людей Тимофея — человека совершенно никчёмного, причинившего иудеям много горя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человека не способного устоять» или «не способного оказать сопротивление». Греческое слово может обозначать неустойчивость, неспособность устоять либо негодность, ничтожность человека.'
    reason: Сохраняет лексическую неоднозначность ἀνυπόστατον, не навязывая однозначно военное или нравственное понимание.
lexical_decisions:
- source_word: φυλάρχην
  choice: предводителя племени
  rationale: Буквально обозначает главу или правителя племени; такой перевод сохраняет конкретный титул, не сводя его к общему «командиру».
- source_word: τῶν περὶ Τιμόθεον
  choice: бывшего среди людей Тимофея
  rationale: Греческое выражение обозначает круг людей, окружавших Тимофея или действовавших с ним; «среди людей Тимофея» сохраняет эту связь без утверждения, что он командовал всей группой.
- source_word: ἀνυπόστατον
  choice: не способного оказать сопротивление
  rationale: В данном контексте слово естественно понимается как «не выдерживающий натиска, неспособный сопротивляться». Это значение предпочтительнее нравственной оценки «никчёмный», которая не является обязательной.
- source_word: ἐπιλελυπηκότα
  choice: причинил … много горя
  rationale: 'Передаёт результативное значение причастия: этот человек прежде многократно огорчал или притеснял иудеев.'
theological_decisions:
- issue: Нравственная или военная характеристика ἀνυπόστατον
  choice: не способного оказать сопротивление
  alternative: совершенно никчёмного / крайне негодного
  rationale: Греческое слово допускает характеристику того, кто не способен устоять или сопротивляться. Контекст военного поражения поддерживает это прочтение, однако лексическая неоднозначность отмечена в сноске.
