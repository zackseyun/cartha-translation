base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/020.yaml
  text: 'And the engagement in Babylonia against the Galatians had gone this way: when all who came to the need were eight thousand[a], together with four thousand Macedonians, and the Macedonians were at a loss, the six thousand destroyed the one hundred twenty thousand because of the help coming to them from heaven, and they received great advantage.'
translation:
  language: ru
  text: 'И о сражении в Вавилонии против галатов[a], которое произошло так: всех прибывших на помощь было восемь тысяч вместе с четырьмя тысячами македонян; когда же македоняне оказались в затруднении, шесть тысяч уничтожили сто двадцать тысяч благодаря помощи, приходившей им с неба, и получили большую пользу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «галлов». Греческое название может обозначать как галатов Малой Азии, так и кельтов в более широком смысле.'
    reason: Альтернативная передача этнонима.
lexical_decisions:
- source_word: παράταξιν
  choice: сражении
  rationale: Слово обозначает боевое построение или столкновение; «сражение» естественно передаёт военный контекст, не расширяя событие до целой кампании.
- source_word: Γαλάτας
  choice: галатов
  rationale: Прямая передача греческого этнонима; возможное более широкое обозначение кельтов отмечено в сноске.
- source_word: ἐπὶ τὴν χρείαν ἦλθον
  choice: пришедших в час нужды
  rationale: Передаёт прибытие в момент крайней необходимости, не уточняя сверх текста, кому именно они пришли помогать.
- source_word: ἀπορουμένων
  choice: оказались в затруднении
  rationale: Сохраняет значение нехватки средств или выхода из положения, не сводя его только к растерянности либо военному натиску.
- source_word: ἀπώλεσαν
  choice: уничтожили
  rationale: Сохраняет сильное и достаточно широкое значение глагола в военном контексте.
- source_word: δώδεκα μυριάδας
  choice: сто двадцать тысяч
  rationale: Греческое «двенадцать мириад» передано привычным современному русскому читателю числительным.
- source_word: διὰ τὴν γινομένην αὐτοῖς ἀπʼ οὐρανοῦ βοήθειαν
  choice: благодаря помощи, приходившей им с неба
  rationale: Сохраняет образ помощи «с неба» и не заменяет почтительное иносказание прямым упоминанием Бога.
- source_word: ὠφέλειαν πολλὴν ἔλαβον
  choice: получили большую выгоду
  rationale: Передаёт общее значение пользы или преимущества, не сужая его до военной добычи.
theological_decisions:
- issue: Смысл помощи «с неба»
  choice: Сохранено буквальное выражение как почтительное указание на божественную помощь.
  alternative: Прямо назвать это помощью Бога или понять как неопределённое благоприятное стечение обстоятельств.
  rationale: В иудейско-греческом контексте выражение обычно указывает на вмешательство Бога, однако сам текст сохраняет почтительную непрямую формулировку; перевод поступает так же.
translation_notes:
  register: Современный литературный русский язык с сдержанным повествовательно-историческим регистром. Начальное «и о сражении» сохраняет синтаксическую связь стиха с предшествующим контекстом. Необычное соотношение чисел оставлено без гармонизации, как в греческом тексте.
