base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/004.yaml
  text: and also to remember the lawless destruction of the innocent infants[a], and the blasphemies committed against his name[b], and to hate evil.
translation:
  language: ru
  text: и также вспомнить о беззаконной гибели невинных младенцев[a], о хулениях, направленных против Его имени, и возненавидеть зло[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безгрешных младенцев». Греческое прилагательное буквально означает «без греха», но здесь, вероятно, подчёркивает невиновность младенцев как жертв.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «возненавидеть нечестие», «исполниться отвращения к злу». Редкий греческий глагол выражает сильную ненависть к злу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνησθῆναι
  choice: вспомнить
  rationale: Аористный инфинитив в последовательности прошений; «вспомнить» прямо и естественно передаёт призыв обратить внимание на совершённое злодеяние.
- source_word: ἀναμαρτήτων
  choice: невинных
  rationale: Буквально прилагательное означает «безгрешных», однако в контексте насильственной гибели младенцев оно прежде всего подчёркивает их невиновность как жертв, не вводя более широкого догматического утверждения.
- source_word: νηπίων
  choice: младенцев
  rationale: Слово обозначает совсем маленьких детей; «младенцев» сохраняет возрастной оттенок и трагическую силу выражения.
- source_word: παρανόμου
  choice: беззаконной
  rationale: Передаёт нарушение закона и справедливости; относится к гибели как к преступному деянию.
- source_word: ἀπωλίας
  choice: гибели
  rationale: В данном контексте речь идёт о насильственной смерти. «Гибель» по-русски естественнее буквального «уничтожение» и не усиливает образ до более толковательного «избиения».
- source_word: βλασφημιῶν
  choice: хулениях
  rationale: Поскольку хула направлена против Божьего имени, религиозное значение слова здесь уместнее общих вариантов «оскорбления» или «клевета».
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: направленных против Его имени
  rationale: Передаёт враждебную направленность хулений и сохраняет прямое упоминание имени.
- source_word: μισοπνηρῆσαι
  choice: возненавидеть зло
  rationale: Редкий глагол выражает сильное неприятие зла; «возненавидеть зло» сохраняет силу выражения и естественно звучит в последовательности инфинитивов.
theological_decisions:
- issue: Значение ἀναμαρτήτων применительно к погибшим младенцам
  choice: невинных младенцев
  alternative: безгрешных младенцев
  rationale: «Невинных» передаёт контекстуальную мысль о непричастности жертв к вине, за которую они пострадали, тогда как «безгрешных» может быть воспринято как отдельное догматическое утверждение об абсолютной безгрешности.
- issue: Субъект действия в заключительном инфинитиве μισοπνηρῆσαι
  choice: 'сохранена единая инфинитивная конструкция: «и возненавидеть зло»'
  alternative: 'истолковать как следствие для молящихся: «чтобы они возненавидели зло»'
  rationale: Греческий текст не вводит нового выраженного субъекта. Перевод сохраняет синтаксическую связь и присущую ей напряжённость, не добавляя толковательного субъекта.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранена фрагментарная инфинитивная структура стиха, связанная с предшествующим контекстом. Местоимение «Его» написано с прописной буквы как указание на Бога.
