  source_fidelity: «Но Иуде стало известно» точно передаёт идиоматическое προσέπεσεν περὶ в значении получения известия. «О наступлении Никанора» обоснованно выбирает нейтральное для контекста значение ἐφόδος, не утверждая уже совершившуюся атаку. «Когда он сообщил тем, кто был с ним, о прибытии войска» удачно передаёт генитивный абсолют и смысл μεταδόντος; значение παρουσία как «прибытие» возможно, а неоднозначность выражения τὴν παρουσίαν τοῦ στρατοπέδου сохранена в примечании.
