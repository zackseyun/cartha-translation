  terminology: Имя «Иуда» и «Никанор» переданы нормативно. «Войско» является допустимой контекстуальной передачей στρατόπεδον, которое может обозначать и войско, и лагерь; примечание корректно обозначает обе возможности. Богословски нагруженных терминов нет.
