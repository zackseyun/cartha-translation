  text: But news of Nicanor’s advance came to Judas[a]; and when he had shared with those with him the presence of the army camp[b],
translation:
  language: ru
  text: Но Иуде стало известно о наступлении Никанора[a]; и когда он сообщил тем, кто был с ним, о прибытии войска[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о нападении Никанора». Греческое слово ἐφόδος может означать наступление, нападение или атаку.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о присутствии поблизости военного лагеря». Сжатое греческое выражение τὴν παρουσίαν τοῦ στρατοπέδου может указывать либо на прибытие войска, либо на то, что войско или его лагерь уже находились поблизости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέπεσεν
  choice: стало известно
  rationale: В сочетании с περὶ выражает получение известия; буквальное «обрушилось» здесь не передаёт смысла греческой идиомы.
- source_word: περὶ τῆς τοῦ Νικάνορος ἐφόδου
  choice: о наступлении Никанора
  rationale: ἐφόδος допускает значения «наступление», «нападение», «атака»; «наступление» сохраняет враждебный характер движения, не утверждая, что бой уже начался.
- source_word: μεταδόντος
  choice: когда он сообщил
  rationale: Генитив абсолютный обозначает последующее сообщение Иудой полученных сведений своим спутникам; это естественная русская передача значения «передать, сообщить».
- source_word: τοῖς σὺν αὐτῷ
  choice: тем, кто был с ним
  rationale: Прямая и нейтральная передача без уточнения статуса этих людей.
- source_word: τὴν παρουσίαν τοῦ στρατοπέδου
  choice: о прибытии войска
  rationale: παρουσία может означать как присутствие, так и прибытие, а στρατόπεδον — лагерь или войско. В контексте приближения противника естественно понимать выражение как сообщение о прибытии войска, сохраняя альтернативу в примечании.
