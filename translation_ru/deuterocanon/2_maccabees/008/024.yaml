  yaml_path: translation/deuterocanon/2_maccabees/008/024.yaml
  text: But with the Almighty as their ally, they slaughtered more than nine thousand of the enemy, and they wounded and maimed most of Nicanor’s army, and forced them all to flee.
translation:
  language: ru
  text: Но когда Вседержитель стал их союзником, они перебили более девяти тысяч врагов, ранили и искалечили бо́льшую часть войска Никанора и всех обратили в бегство.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ παντοκράτορος
  choice: Вседержитель
  rationale: Устоявшийся в русской библейской традиции титул Бога, передающий значение всеобъемлющей власти παντοκράτωρ и сохраняющий возвышенный регистр.
- source_word: συμμάχου
  choice: союзником
  rationale: Слово обозначает того, кто сражается на чьей-либо стороне; «союзник» сохраняет военный смысл контекста.
- source_word: κατέσφαξαν
  choice: перебили
  rationale: Глагол выражает жестокое массовое убийство. «Перебили» естественно звучит в современном русском повествовании о битве и сильнее нейтрального «убили».
- source_word: ὑπὲρ τοὺς ἐννακισχιλίους
  choice: более девяти тысяч
  rationale: ὑπέρ с винительным падежом при числе указывает на превышение названного количества.
- source_word: τραυματίας
  choice: ранили
  rationale: Передаёт превращение воинов в раненых и соответствует обычной русской военной лексике.
- source_word: τοῖς μέλεσιν ἀπηρεῖς
  choice: искалечили
  rationale: Греческое выражение описывает тяжёлое повреждение конечностей; «искалечили» передаёт результат кратко и без архаизма.
- source_word: τὸ πλεῖον μέρος τῆς τοῦ Νικάνορος στρατειᾶς
  choice: бо́льшую часть войска Никанора
  rationale: Точно передаёт большинство военной силы под началом Никанора; ударение графически отличает сравнительную форму «бо́льшую» от значения размера.
- source_word: πάντας δὲ φεύγειν ἠνάγκασαν
  choice: и всех обратили в бегство
  rationale: Сохраняет прямое «всех» без добавления отсутствующего в греческом слова «остальных» и естественно выражает принуждение к бегству.
theological_decisions:
- issue: Передача божественного титула παντοκράτωρ в рассказе о военной помощи
  choice: Вседержитель
  alternative: Всемогущий
  rationale: «Вседержитель» точнее сохраняет титульный характер слова и его смысл верховной власти, не сводя значение только к обладанию силой.
- issue: Образ Бога как συμμάχος
  choice: стал их союзником
  alternative: был их помощником
  rationale: Военный образ исходного текста сохранён прямо, без смягчения до общего понятия помощи и без дополнительных богословских пояснений.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Военная сила исходного текста не смягчена. Синтаксис сделан плавным, при этом сохранено неоднозначно широкое «всех» в заключительной фразе.
