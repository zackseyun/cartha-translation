base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/027.yaml
  text: After they had collected their weapons and stripped the spoils from the enemies[a], they devoted themselves to the Sabbath, abundantly blessing and giving thanks to the Lord who had preserved them to this day[b], having appointed for them the beginning of mercy.
translation:
  language: ru
  text: Собрав оружие и сняв с врагов добычу, они занялись соблюдением субботы[a], горячо благословляя и благодаря Господа, сохранившего их до этого дня и положившего для них начало милости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение можно также передать: «обратились к субботе» или «занялись субботой». Возможно, речь идёт о том, что с наступлением субботы они перешли к её соблюдению.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «даровавшего им первый знак милости». Победа названа началом Божьей милости к ним; греческий текст не утверждает, что восстановление уже совершилось полностью.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁπλολογήσαντες δὲ αὐτοὺς
  choice: собрав оружие
  rationale: Глагол указывает на сбор оружия после сражения. Краткая русская формулировка передаёт военный контекст, не уточняя сверх текста, кому именно прежде принадлежало оружие.
- source_word: τὰ σκῦλα ἐκδύσαντες τῶν πολεμίων
  choice: сняв с врагов всё, что можно было взять как добычу
  rationale: Сочетание ἐκδύω и σκῦλα рисует снятие с побеждённых ценных вещей и вооружения. Развёрнутая формулировка естественна по-русски и сохраняет наглядность греческого выражения.
- source_word: περὶ τὸ σάββατον ἐγίνοντο
  choice: занялись соблюдением субботы
  rationale: Идиоматический оборот означает, что они обратились к субботе и её соблюдению; перевод не добавляет конкретных обрядов, не названных в тексте.
- source_word: περισσῶς
  choice: усердно
  rationale: Наречие усиливает последующие действия. «Усердно» звучит естественно применительно к благодарению и благословению и выражает особую интенсивность.
- source_word: εὐλογοῦντες καὶ ἐξομολογούμενοι
  choice: благословляя и благодаря
  rationale: Первый глагол передан прямо, а второй в данном богослужебном контексте обозначает открытое благодарственное прославление, а не исповедание греха.
- source_word: τῷ κυρίῳ
  choice: Господа
  rationale: В данном контексте κύριος обозначает Бога Израиля; винительный падеж обусловлен естественным русским управлением глаголов «благословлять» и «благодарить».
- source_word: τῷ διασώζοντι εἰς τὴν ἡμέραν ταύτην
  choice: сохранившего их до этого дня
  rationale: Передаёт совершённое к описываемому моменту Божье спасительное сохранение и не превращает «этот день» в современное читателю «сегодня».
- source_word: ἀρχὴν ἐλέους τάξαντος αὐτοῖς
  choice: положившего для них начало милости
  rationale: Формулировка сохраняет образ начала и широкий смысл τάσσω — устанавливать, определять, полагать, — не сводя милость лишь к знамению или полной окончательной перемене.
theological_decisions:
- issue: Смысл выражения ἀρχὴν ἐλέους τάξαντος αὐτοῖς
  choice: Эта победа представлена как начало Божьей милости к ним.
  alternative: Господь даровал им первый знак милости или положил начало новому периоду Своего благоволения.
  rationale: Греческий текст говорит именно о начале, не утверждая, что восстановление уже завершилось. Буквенно близкая формулировка сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным, однако образ «начала милости» намеренно сохранён как необычный и богословски значимый. Конкретные субботние обряды в перевод не добавлены.
