revisions:
- from: Собрав оружие и сняв с врагов всё, что можно было взять как добычу, они занялись соблюдением субботы[a], усердно благословляя и благодаря Господа, сохранившего их до этого дня и положившего для них начало милости[b].
  to: Собрав оружие и сняв с врагов добычу, они занялись соблюдением субботы[a], горячо благословляя и благодаря Господа, сохранившего их до этого дня и положившего для них начало милости[b].
