  text: and to have mercy also on the city that was being destroyed and was about to be leveled to the ground[a], and to hear the blood crying out to him[b];
translation:
  language: ru
  text: и помиловать также разрушаемый город, которому предстояло быть сровненным с землёй, и услышать кровь[a], вопиющую к Нему[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «крови» — в греческом употреблено множественное число, которое может подчёркивать многочисленность кровопролитий или тяжесть вины за пролитую кровь.'
    reason: lexical_alternative
  - marker: b
    text: Образ крови, вопиющей к Богу, вероятно, перекликается с библейским мотивом невинно пролитой крови, взывающей к Нему.
    reason: cross_reference
lexical_decisions:
- source_word: ἐλεῆσαι
  choice: помиловать
  rationale: Аористный инфинитив продолжает содержание предшествующей молитвы. «Помиловать» естественно для русской молитвенной речи и сохраняет смысл милосердного отклика.
- source_word: καταφθειρομένην πόλιν
  choice: разрушаемый город
  rationale: Причастие настоящего времени передаёт уже продолжающееся разрушение; название Иерусалима в греческом тексте здесь прямо не употреблено.
- source_word: μέλλουσαν ἰσόπεδον γίνεσθαι
  choice: которому грозило быть сравненным с землёй
  rationale: Оборот передаёт близкую угрозу полного разрушения. Русская идиома «сравнять с землёй» точно и естественно выражает образ ἰσόπεδον.
- source_word: τῶν ... αἱμάτων
  choice: кровь
  rationale: В греческом стоит множественное число «крови», однако по-русски в этом образе естественно собирательное единственное число «кровь»; особенность оригинала отмечена в сноске.
- source_word: καταβοώντων πρὸς αὐτόν
  choice: вопиющую к Нему
  rationale: Сохраняется олицетворённый образ крови, громко взывающей к Богу, и его библейское звучание без добавления цели этого вопля.
- source_word: εἰσακοῦσαι
  choice: услышать
  rationale: Прямой русский эквивалент сохраняет возможный молитвенный оттенок благосклонного услышания, не делая его явным толкованием.
theological_decisions:
- issue: Возможная библейская аллюзия в образе вопиющей крови
  choice: Сохранить конкретный образ «кровь, вопиющую к Нему» без пояснения в основном тексте, о чём именно она вопиёт.
  alternative: «кровопролитие, взывающее к Нему»; «кровь убитых, взывающую к Нему об отмщении»
  rationale: Греческий текст не называет ни жертв, ни требуемого воздаяния. Буквенный образ сохраняет богословскую напряжённость и вероятную связь с библейским мотивом невинно пролитой крови.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной молитвенной лексикой. Синтаксис сохраняет зависимость инфинитивов от предыдущего контекста; финальная точка с запятой отражает незавершённость периода.
