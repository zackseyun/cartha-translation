    text: Имеется в виду гибель войска Сеннахирима во дни Езекии; см. 4 Царств 19:35 и Исаии 37:36.
    reason: cross_reference
lexical_decisions:
- source_word: προσαναλεξάμενος
  choice: напомнил
  rationale: Причастие обозначает, что Иуда вдобавок перечислил или пересказал людям прежние события; «напомнил» естественно передаёт цель этого рассказа в данном контексте.
- source_word: ἀντιλήμψεις
  choice: помощь
  rationale: Существительное может обозначать помощь, поддержку или избавление. «Помощь» сохраняет широкое значение и не уточняет сверх греческого текста ни её вид, ни прямо названного деятеля.
- source_word: ἐπὶ τῶν προγόνων γενομένας
  choice: которую получали их предки
  rationale: Оборот указывает на помощь, имевшую место применительно к предкам. Такая формулировка ясна по-русски и не добавляет прямо не названного в этой фразе деятеля.
- source_word: τὴν ἐπὶ Σεναχηρεὶμ
  choice: о помощи против Сеннахирима
  rationale: Артикль с предложным оборотом эллиптически возвращает к слову «помощь»; в русском повтор существительного делает связь прозрачной.
- source_word: ἑκατὸν ὀγδοήκοντα πέντε χιλιάδες
  choice: сто восемьдесят пять тысяч
  rationale: Прямая и нормативная передача числительного на современном русском языке.
- source_word: ὡς ἀπώλοντο
  choice: о том, как погибли
  rationale: ὡς вводит содержание воспоминания. Непереходное «погибли» точно соответствует форме ἀπώλοντο и не вводит не выраженного здесь субъекта уничтожения.
theological_decisions:
- issue: Подразумеваемое действие Бога в помощи предкам и гибели войска Сеннахирима
  choice: Не добавлять в основной текст прямое упоминание Бога как действующего лица.
  alternative: «о помощи, которую Бог оказал их предкам» и «как Бог уничтожил сто восемьдесят пять тысяч»
  rationale: Историческая аллюзия подразумевает Божье избавление, однако в данной греческой фразе Бог прямо не назван. Перевод сохраняет богословский смысл контекста, не делая подразумеваемое явным дополнением.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, с сохранением историко-библейской аллюзии и без искусственной архаизации. Маркер сноски поставлен непосредственно после имени Сеннахирима, к которому относится пояснение.
