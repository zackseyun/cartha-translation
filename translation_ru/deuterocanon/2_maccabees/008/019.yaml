revisions:
- from: Он также напомнил им о помощи, которую получали их предки, и о помощи против Сеннахирима[a] — о том, как погибли сто восемьдесят пять тысяч.
  to: Он также рассказал им о помощи, оказанной их предкам, и о помощи против Сеннахирима[a] — о том, как погибли сто восемьдесят пять тысяч.
  rationale: Заменено «напомнил» на «рассказал», что лучше передаёт значение «пересказал, перечислил», и «которую получали их предки» на «оказанной их предкам», чтобы не вносить оттенок продолжительного действия. Остальная формулировка точно и естественно воспроизводит греческий текст, включая неназванного деятеля гибели 185 000.
