  yaml_path: translation/deuterocanon/2_maccabees/008/019.yaml
  text: And he also recounted to them the help that had come to their forefathers[a], and the one against Sennacherib[b], how a hundred eighty-five thousand were destroyed.
translation:
  language: ru
  text: Он также рассказал им о помощи, оказанной их предкам, и о помощи против Сеннахирима[a] — о том, как погибли сто восемьдесят пять тысяч.
  philosophy: optimal-equivalence
  footnotes:
