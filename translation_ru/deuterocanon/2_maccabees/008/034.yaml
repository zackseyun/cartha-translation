lexical_decisions:
- source_word: τρισαλιτήριος
  choice: трижды проклятый
  rationale: Редкое резко бранное прилагательное с усилительным элементом τρις- передано достаточно буквально; выражение сохраняет нравственно-религиозную окраску и понятно в современном русском языке.
- source_word: Νικάνωρ
  choice: Никанор
  rationale: Традиционная и непосредственно соответствующая греческой форме русская передача имени.
- source_word: τρισχιλίους ἐμπόρους
  choice: три тысячи купцов
  rationale: ἐμπόρους обозначает торговцев, приглашённых как покупателей пленников; «купцов» естественно для повествования и исторического контекста.
- source_word: ἐπὶ τὴν πρᾶσιν τῶν Ἰουδαίων
  choice: для продажи иудеев
  rationale: Оборот выражает цель; родительный τῶν Ἰουδαίων обозначает тех, кого намеревались продать.
- source_word: ἀγαγών
  choice: приведший
  rationale: Аористное причастие согласовано с Никанором и передаёт действие, предшествующее дальнейшему сказуемому полного предложения.
theological_decisions:
- issue: Передача редкого ругательного определения τρισαλιτήριος
  choice: трижды проклятый
  alternative: совершенно осквернённый; трижды нечестивый; презреннейший
  rationale: «Трижды проклятый» сохраняет явный усилительный компонент τρις- и возможный религиозно-нравственный смысл второй части, не сводя выражение к простому эмоциональному оскорблению. Смысловая неустойчивость редкого слова отмечена в сноске.
translation_notes:
