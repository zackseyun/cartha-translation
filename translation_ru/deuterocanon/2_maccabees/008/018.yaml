base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/018.yaml
  text: For they[a], he said, have put their confidence in weapons and boldness, but we have put our confidence in Almighty God, who is able with a single nod to bring down both those coming against us and the whole world.
translation:
  language: ru
  text: «Ведь они, — сказал он, — полагаются на оружие и отвагу, а мы уповаем на Бога Вседержителя, который может одним мановением[a] низвергнуть и идущих на нас, и весь мир».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одним кивком», «одним жестом» или «одним знаком». Греческое слово обозначает кивок либо условный знак и подчёркивает, насколько легко Бог способен низвергнуть врагов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλοις
  choice: оружие
  rationale: В военном контексте ὅπλα обозначает боевое вооружение; «оружие» — ясный и современный русский эквивалент.
- source_word: τόλμαις
  choice: отвагу
  rationale: τόλμα здесь передаёт смелость и решительность в бою; «отвага» сохраняет положительный оттенок, не превращая его в безрассудство.
- source_word: πεποίθασιν / πεποίθαμεν
  choice: полагаются / уповаем
  rationale: Перфектные формы выражают устойчивое состояние уверенности. Русские формы настоящего времени естественно передают это состояние; «уповаем» уместно выражает доверие Богу, а параллель двух частей сохраняется смыслом.
- source_word: ἐπὶ τῷ παντοκράτορι θεῷ
  choice: на Бога Вседержителя
  rationale: ἐπί с дательным при πέποιθα указывает на основание доверия. «Уповаем на Бога Вседержителя» естественно по-русски и сохраняет божественный титул.
- source_word: παντοκράτορι
  choice: Вседержителя
  rationale: «Вседержитель» — укоренившийся русский эквивалент божественного титула παντοκράτωρ, передающий верховную власть и могущество Бога.
- source_word: δυναμένῳ
  choice: который может
  rationale: Причастие относится к Богу и объясняет основание упования; придаточное предложение звучит естественно и точно.
- source_word: τοὺς ἐρχομένους ἐφʼ ἡμᾶς
  choice: идущих на нас
  rationale: Фраза буквально описывает тех, кто движется против говорящих; перевод сохраняет и движение, и враждебную направленность, не уточняя без необходимости стадию нападения.
- source_word: τὸν ὅλον κόσμον
  choice: весь мир
  rationale: κόσμος допускает значения «мир» и «мироздание». «Весь мир» естественно сохраняет широкий, риторически всеохватный смысл.
- source_word: ἑνὶ νεύματι
  choice: одним мановением
  rationale: νεῦμα означает кивок, знак или жест. «Одним мановением» — краткое и достойное выражение, подчёркивающее, что Богу достаточно малейшего знака.
- source_word: καταβαλεῖν
  choice: низвергнуть
  rationale: Глагол означает бросить вниз, повергнуть или низложить. «Низвергнуть» подходит и к наступающим врагам, и к гиперболическому упоминанию всего мира.
theological_decisions:
- issue: Передача божественного титула παντοκράτωρ
  choice: Бог Вседержитель
  alternative: всемогущий Бог
  rationale: Титульное «Вседержитель» сохраняет не только представление о силе, но и оттенок всеобъемлющего владычества, не вводя конфессионально специфического толкования.
- issue: Объём значения κόσμος
  choice: весь мир
  alternative: всё мироздание
  rationale: Перевод сохраняет возможную широту высказывания о Божьей власти, не решая однозначно, имеется ли в виду населённый мир или вся вселенная.
- issue: Характер упования, выраженного перфектом πέποιθα
  choice: полагаются / уповаем
  alternative: положились / уповали
  rationale: Настоящее время по-русски лучше выражает наличное, устойчивое состояние доверия, заложенное в греческом перфекте, и не сводит его к разовому прошлому действию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Слова «уповаем», «Вседержитель», «мановением» и «низвергнуть» сохраняют достоинство и богословскую весомость стиха, оставаясь понятными в контексте. Прямая речь оформлена естественно для русского текста; противопоставление «они — мы» и двойное «и … и …» сохранены.
