base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/010.yaml
  text: But Nikanor undertook to pay to the king the tribute owed to the Romans[a], amounting to two thousand talents[b], from the captivity of the Jews.
translation:
  language: ru
  text: Никанор же взялся покрыть за царя дань, причитавшуюся римлянам[a] и составлявшую две тысячи талантов, за счёт пленения иудеев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий оборот сжат и допускает более буквальное развёртывание: «дань царю, для римлян» или «дань царя римлянам». По контексту имеется в виду обязательство царя перед Римом, которое Никанор намеревался покрыть за счёт захвата иудеев.'
    reason: alternative_reading
  - marker: b
    text: То есть захватывая иудеев в плен и получая деньги от их продажи или выкупа.
    reason: cultural_note
lexical_decisions:
- source_word: ἰδιωτεύσατο
  choice: взялся
  rationale: Передаёт личное принятие Никанором обязательства, не навязывая точного административно-правового оттенка.
- source_word: φόρον
  choice: дань
  rationale: В политическом контексте обозначает платёж, причитавшийся господствующей державе; «дань» точнее общего слова «налог».
- source_word: τῷ βασιλεῖ
  choice: царю
  rationale: Прямо передаёт дательный падеж адресата выплаты.
- source_word: τοῖς ις Ῥωμαίοις
  choice: причитавшуюся римлянам
  rationale: Греческое выражение сжато и текстуально затруднено, но по контексту речь идёт об обязательстве царя перед Римом; связь раскрыта в основном тексте, а буквальная конструкция сохранена в примечании.
- source_word: ὄντα
  choice: составлявшую
  rationale: Естественно связывает дань с указанной денежной суммой.
- source_word: τάλαντων δισχιλίων
  choice: две тысячи талантов
  rationale: Сохраняет древнюю денежно-весовую единицу без приблизительного пересчёта в современные деньги.
- source_word: ἐκ τῆς τῶν Ἰουδαίων αἰχμαλωσίας
  choice: за счёт пленения иудеев
  rationale: Передаёт источник предполагаемых средств — захват иудеев с последующей прибылью от их продажи или выкупа — яснее, чем отвлечённое «из плена иудеев».
- source_word: ἐκπληρώσειν
  choice: выплатить
  rationale: В финансовом контексте означает исполнить или погасить денежное обязательство.
theological_decisions:
- issue: Толкование сжатого оборота τῷ βασιλεῖ τοῖς ις Ῥωμαίοις
  choice: дань выплачивается царю как сумма, причитавшаяся римлянам
  alternative: «дань царю — для римлян»
  rationale: Контекст указывает, что Никанор намеревался покрыть обязательство царя перед Римом доходом от захвата иудеев. Примечание сохраняет более буквальную форму и отмечает сжатость греческого текста.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан ясным, но сохранены политическая связь платежа с Римом, древняя единица «талант» и жестокий смысл намерения нажиться на пленниках.
