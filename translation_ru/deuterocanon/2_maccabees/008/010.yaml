  source_fidelity: 'Смысл передан в целом верно: Никанор принимает на себя обязательство покрыть царский платёж, связанный с римлянами, за счёт обращения иудеев в плен; сумма в две тысячи талантов сохранена. Однако формулировка «выплатить царю дань, причитавшуюся римлянам» создаёт в русском тексте ненужную синтаксико-смысловую неясность: дань одновременно выглядит уплачиваемой царю и причитающейся римлянам. Контекстуально оправдано прямо назвать её обязательством царя перед римлянами, при сохранении оговорки о сжатости греческого оборота в примечании.'
