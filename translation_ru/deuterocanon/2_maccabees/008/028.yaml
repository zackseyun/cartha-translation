base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/028.yaml
  text: But after the Sabbath[a], having distributed some of the spoils to those who had been oppressed, and to the widows and the orphans[b], they divided the rest among themselves and their children.
translation:
  language: ru
  text: После субботы они выделили часть добычи пострадавшим, вдовам и сиротам, а остальное разделили между собой и своими детьми.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ δὲ τὸ σάββατον
  choice: После субботы
  rationale: μετά с винительным падежом выражает время после события; δέ здесь служит лёгкой связкой, которую по-русски естественно не передавать отдельным союзом.
- source_word: τοῖς ἠκισμένοις
  choice: пострадавшим
  rationale: Субстантивированное причастие совершенного страдательного вида обозначает людей, подвергшихся жестокому обращению, лишениям или ущербу. «Пострадавшим» сохраняет широту значения, не сужая его до одного вида притеснения.
- source_word: ταῖς χήραις καὶ τοῖς ὀρφανοῖς
  choice: вдовам и сиротам
  rationale: Прямое и естественное обозначение названных в греческом тексте уязвимых социальных групп.
- source_word: μερίσαντες ἀπὸ τῶν σκύλων
  choice: выделили часть добычи
  rationale: μερίζω означает делить или распределять, а ἀπό указывает на долю, взятую из военной добычи; «выделили часть» ясно передаёт это отношение.
- source_word: τὰ λοιπὰ
  choice: остальное
  rationale: Указывает на остаток добычи после первой раздачи.
- source_word: αὐτοὶ καὶ τὰ παιδία διεμερίσαντο
  choice: разделили между собой и своими детьми
  rationale: Средний залог διεμερίσαντο выражает раздел между получателями; «своими детьми» естественно связывает τὰ παιδία с участниками, обозначенными αὐτοί.
theological_decisions:
- issue: Порядок распределения военной добычи
  choice: Сначала часть добычи выделена пострадавшим, вдовам и сиротам, затем остаток разделён между самими воинами и их детьми.
  alternative: 'Более буквально: «разделив из добычи», без явного указания, что уязвимым была выделена часть.'
  rationale: Сочетание μερίσαντες ἀπὸ τῶν σκύλων и последующее τὰ λοιπὰ показывает, что сначала из добычи отделили долю для названных групп, а затем распределили остаток. Это передаёт синтаксис, не добавляя нравоучительного толкования.
translation_notes:
  register: Современный литературный русский язык; изложение ясное, сдержанное и достойное. Причастная конструкция преобразована в последовательные личные формы ради естественности русского повествования.
