    issue: Передача μεγαλοπρεποῦς словом «славное»
    rationale: «Славный» может выражать идею славы, но не передаёт непосредственно значение «великолепный, величественный»; в сочетании с «величественное» также ослабляется различие двух греческих эпитетов.
  - severity: medium
    issue: Толковательное примечание к [b]
    rationale: Фраза «было наречено» не вполне соответствует ἐπίκλησις («призывание, призвание»), а утверждение, что оборот обозначает принадлежность Богу, интерпретирует идиому более определённо, чем необходимо. Примечание должно пояснять образ, сохраняя его возможную широту.
