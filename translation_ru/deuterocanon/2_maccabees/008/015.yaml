  text: and not because of them[a], but because of the covenants made with their fathers[b], and because of the invocation of his majestic and magnificent name over them.
translation:
  language: ru
  text: и если не ради них самих[a], то ради заветов, заключённых с их отцами, и ради призывания над ними Его досточтимого и величественного имени[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не из-за них».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ради призывания над ними Его досточтимого и величественного имени». Это библейский оборот, говорящий о Божьем имени, призванном над народом.'
    reason: cultural_note
lexical_decisions:
- source_word: εἰ μὴ διʼ αὐτούς
  choice: если не ради них самих
  rationale: 'Оборот εἰ μή в продолжающейся просьбе передаёт уступительно-корректирующий смысл: «если не… то…». «Ради них самих» естественно выражает διʼ αὐτούς и подчёркивает противопоставление последующим основаниям.'
- source_word: διὰ τὰς πρὸς τοὺς πατέρας αὐτῶν διαθήκας
  choice: ради заветов, заключённых с их отцами
  rationale: В иудейском библейском контексте διαθῆκαι — «заветы». Причастие «заключённых» эксплицирует подразумеваемое отношение πρὸς к отцам, не меняя его смысла.
- source_word: ἕνεκα
  choice: ради
  rationale: Предлог вводит второе основание просьбы и сохраняет параллелизм с предыдущим διὰ.
- source_word: τῆς ἐπʼ αὐτοὺς ἐπικλήσεως
  choice: того, что над ними было призвано
  rationale: Такая конструкция естественнее отвлечённого русского «призывания» и сохраняет образ имени, призванного над народом, включая направленность ἐπί.
- source_word: τοῦ σεμνοῦ καὶ μεγαλοπρεποῦς ὀνόματος αὐτοῦ
  choice: Его величественное и славное имя
  rationale: 'Оба почётных эпитета сохранены без тяжеловесного буквального дублирования: σεμνός передано как «величественное», μεγαλοπρεπής — как «славное»; прописная буква в «Его» соответствует русской библейской издательской традиции.'
theological_decisions:
- issue: Основания Божьего благоволения
  choice: Просьба основывается не на достоинстве самого народа, а на заветах с предками и на Божьем имени, призванном над народом.
  alternative: Свести смысл либо только к верности древним обещаниям, либо только к заботе Бога о славе Своего имени.
  rationale: Греческий текст явно сохраняет два параллельных основания и противопоставляет их «им самим»; перевод не объединяет и не догматизирует их.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Синтаксис сохраняет зависимость стиха от предшествующей молитвенной просьбы; выражение об имени передано идиоматично, не устраняя исходный образ.
