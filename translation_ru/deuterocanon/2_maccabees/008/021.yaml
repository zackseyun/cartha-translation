base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/021.yaml
  text: With these words he encouraged them and made them ready to die for the laws and the fatherland[a], and he formed the army into four parts.
translation:
  language: ru
  text: Этими словами он вселил в них мужество и готовность умереть за законы и отечество, после чего разделил войско на четыре части.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделал войско четырёхчастным».'
    reason: Буквальная форма греческого выражения поясняет более естественный перевод «разделил войско на четыре части».
lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: Этими словами
  rationale: Оборот отсылает к предшествующей речи Иуды и указывает на её воздействие; перевод естественно передаёт эту связь по-русски.
- source_word: εὐθαρσεῖς αὐτοὺς παραστήσας
  choice: вселил в них мужество
  rationale: Сочетание описывает приведение людей в состояние уверенности и доброй отваги; причинная конструкция сохраняет смысл и звучит естественно.
- source_word: ἑτοίμους ὑπὲρ τῶν νόμων καὶ τῆς πατρίδος ἀποθνήσκειν
  choice: готовность умереть за законы и отечество
  rationale: Сохранены прямое значение инфинитива «умереть», множественное число νόμων и значение защиты или преданности, выраженное ὑπέρ.
- source_word: πατρίδος
  choice: отечество
  rationale: «Отечество» передаёт как родную землю, так и выраженный в контексте мотив верности земле предков, не сводя слово лишь к территории.
- source_word: τετραμερές τι ἐποίησεν τὸ στράτευμα
  choice: разделил войско на четыре части
  rationale: Идиоматически передаёт буквальную мысль о том, что Иуда сделал войско четырёхчастным; неопределённое τι не требует отдельного русского слова.
theological_decisions:
- issue: Связь верности законам с верностью πατρίς
  choice: за законы и отечество
  alternative: за Закон и родную землю
  rationale: Множественное число «законы» сохраняет форму греческого текста, а «отечество» — его родовой и патриотический оттенок, не привнося более поздних национальных концепций.
translation_notes:
  register: Современный литературный русский язык с торжественным, но общепонятным звучанием. Причастная греческая конструкция развёрнута в плавное русское предложение; последовательность действий сохранена.
