  text: having appointed his brothers to lead each division[a], Simon and Joseph and Jonathan, assigning to each one a thousand men in addition to five hundred,
translation:
  language: ru
  text: поставив своих братьев — Симона, Иосифа и Ионафана — предводителями отрядов и поставив под начало каждого тысячу человек сверх пятисот[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть по 1500 человек под началом каждого.
    reason: Необычное греческое выражение буквально означает «тысячу сверх пятисот»; примечание поясняет итоговое число, не заменяя формулировку источника в основном тексте.
lexical_decisions:
- source_word: τάξας
  choice: поставив
  rationale: Аористное причастие обозначает предварительное распорядительное действие Иуды; «поставив» естественно сочетается с последующим «во главе» и передаёт военное назначение.
- source_word: ἀδελφοὺς αὐτοῦ
  choice: своих братьев
  rationale: Сохраняется прямое родственное значение ἀδελφοί; возвратное «своих» естественно указывает на принадлежность при субъекте Иуде.
- source_word: προηγουμένους
  choice: во главе
  rationale: Буквально слово связано с тем, чтобы идти впереди, но в военном контексте означает руководство отрядом; русское выражение передаёт функцию без лишнего истолкования.
- source_word: ἑκάτερας τάξεως
  choice: каждого отряда
  rationale: τάξις обозначает организованное воинское подразделение. «Отряд» понятно современному читателю и не навязывает позднейшую точную структуру войска; распределительное выражение передано как «каждого» в соответствии с перечислением трёх начальников.
- source_word: Σίμωνα καὶ Ἰώσηπον καὶ Ἰωνάθην
  choice: Симона, Иосифа и Ионафана
  rationale: Приняты обычные русские библейские формы имён; перечисление оформлено приложением к слову «братьев».
- source_word: ὑποτάξας ἑκάστῳ
  choice: подчинив каждому
  rationale: Формулировка близко передаёт помещение воинов под власть каждого назначенного начальника и сохраняет военный оттенок ὑποτάσσω.
- source_word: χιλίους πρὸς τοῖς πεντακοσίοις
  choice: тысячу человек сверх пятисот
  rationale: Сохранена необычная аддитивная конструкция греческого текста, а слово «человек» добавлено по подразумеваемому обозначению воинов.
