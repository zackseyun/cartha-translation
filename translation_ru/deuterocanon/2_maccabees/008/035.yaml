base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/035.yaml
  text: Having been humbled by those who were thought to be the least among his own[a], and by the Lord’s help having laid aside his splendid robe, he made himself like a fugitive, traveling through the inland country in isolation and came to Antioch[c][b], having prospered beyond all expectation in the destruction of his army.
translation:
  language: ru
  text: Униженный теми, кого среди его людей считали самыми незначительными, и с помощью Господа сняв свою роскошную одежду, он, словно беглец, в одиночестве прошёл через внутренние области[a] и прибыл в Антиохию, необычайно преуспев в гибели собственного войска[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «через внутреннюю область»; речь идёт о пути по внутренним территориям, вдали от побережья.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение намеренно иронично: его единственным «успехом» стала гибель собственного войска.'
    reason: literary_irony
lexical_decisions:
- source_word: ταπεινωθεὶς
  choice: униженный
  rationale: Передаёт аористное страдательное причастие и заключённый в контексте позор поражения.
- source_word: ὑπὸ τῶν καθʼ αὑτὸν νομιζομένων ἐλαχίστων εἶναι
  choice: теми, кого среди его людей считали самыми незначительными
  rationale: Сохраняет пассивную неопределённость νομιζομένων, связь καθʼ αὑτόν с его стороной и иронию поражения от считавшихся ничтожными.
- source_word: τῇ τοῦ κυρίου βοηθείᾳ
  choice: по содействию Господа
  rationale: Инструментальный дательный связывает произошедшее с помощью Господа; формулировка естественна для возвышенного повествования.
- source_word: τὴν δοξικὴν ἀποθέμενος ἐσθῆτα
  choice: сняв свою роскошную одежду
  rationale: Передаёт снятие одеяния, служившего внешним знаком великолепия и положения.
- source_word: διὰ τῆς μεσογείου
  choice: через внутренние области
  rationale: μεσόγειος здесь означает внутреннюю, удалённую от побережья территорию, а не Средиземное море.
- source_word: δραπέτου τρόπον
  choice: словно беглец
  rationale: Передаёт сравнительно-наречное значение без необязательного уточнения о беглом рабе.
- source_word: ἔρημον ἑαυτὸν ποιήσας
  choice: в одиночестве
  rationale: Естественно выражает буквальную мысль о том, что он сделал себя одиноким, лишённым спутников.
- source_word: ἧκεν εἰς Ἀντιόχειαν
  choice: прибыл в Антиохию
  rationale: Точно и естественно передаёт достижение пункта назначения.
- source_word: ὑπὲρ ἅπαν εὐημερηκὼς
  choice: необычайно «преуспев»
  rationale: Сохраняет гиперболическую иронию греческого выражения; кавычки помогают современному читателю распознать намеренное смысловое столкновение.
- source_word: ἐπὶ τῇ τοῦ στρατοῦ διαφθορᾷ
  choice: в гибели собственного войска
  rationale: Передаёт разрушение войска и ясно обозначает контекстуального обладателя, на котором строится ирония.
theological_decisions:
- issue: Референт κύριος
  choice: Господа
  alternative: господина
  rationale: В повествовательном контексте имеется в виду Бог Израиля; заглавная буква передаёт титульное употребление, не добавляя к греческому тексту особого доктринального уточнения.
- issue: Ирония εὐημερηκὼς ἐπὶ τῇ τοῦ στρατοῦ διαφθορᾷ
  choice: необычайно «преуспев» в гибели собственного войска
  alternative: потерпев чрезвычайную неудачу из-за гибели своего войска
  rationale: Выбранный вариант сохраняет явную и напряжённую иронию оригинала, тогда как альтернатива истолковывает и сглаживает её.
