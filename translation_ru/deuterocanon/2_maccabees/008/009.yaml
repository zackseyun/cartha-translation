base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/009.yaml
  text: But he quickly selected Nicanor son of Patroclus[a], one of his chief Friends, and sent him, having assigned to him no fewer than twenty thousand from the nations of every tribe to wipe out the whole Jewish people. They also appointed with him Gorgias, a military man experienced in matters of war[c][b],
translation:
  language: ru
  text: Он же без промедления избрал Никанора, сына Патрокла, одного из главных Друзей[a], и послал его, подчинив ему не менее двадцати тысяч человек из самых разных народов[b], чтобы истребить весь иудейский народ[c]. Вместе с ним назначили и Горгия — военачальника, опытного в военном деле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одного из первых Друзей». «Друзья», вероятно, — придворный титул высокопоставленных царских приближённых, а не просто указание на личную дружбу.'
    reason: lexical_alternative
  - marker: b
    text: Греческое выражение необычно; оно может означать войско смешанного этнического состава или людей из народов всякого рода.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «чтобы искоренить весь род Иудеи».'
    reason: alternative_reading
lexical_decisions:
- source_word: προχειρισάμενος
  choice: избрал
  rationale: Причастие обозначает выбор или назначение человека для определённого поручения; «избрал» точно и естественно передаёт это значение.
- source_word: τῶν πρώτων φίλων
  choice: одного из главных Друзей
  rationale: В эллинистической придворной речи «Друзья» могло быть титулом царских приближённых. Прописная буква и сноска показывают специальный характер выражения, а «главных» передаёт первых по положению.
- source_word: ὑποτάξας
  choice: подчинив ему
  rationale: Глагол означает поставить людей или войска под чьё-либо командование.
- source_word: παμφύλων ἔθνη
  choice: людей из самых разных народов
  rationale: Редкое сочетание указывает на разноплемённый или разнородный состав сил. Добавление «людей» делает связь с числом двадцать тысяч естественной по-русски, не превращая народы как таковые в воинские подразделения.
- source_word: οὐκ ἐλάττους τῶν δισμυρίων
  choice: не менее двадцати тысяч
  rationale: Прямое и современное соответствие греческой сравнительной конструкции.
- source_word: τὸ πᾶν τῆς Ἰουδαίας ἐξᾶραι γένος
  choice: истребить весь народ Иудеи
  rationale: ἐξᾶραι здесь означает полное уничтожение, а γένος — народ как этническую общность. «Народ Иудеи» сохраняет формальную связь родительного τῆς Ἰουδαίας и избегает современных биологических оттенков слова «раса».
- source_word: συνέστησαν δὲ αὐτῷ καὶ Γοργίαν
  choice: вместе с ним назначили и Горгия
  rationale: Сохраняется неопределённый субъект греческого множественного числа и смысл назначения Горгия действовать совместно с Никанором.
- source_word: ἄνδρα στρατηγὸν
  choice: военачальника
  rationale: στρατηγός обозначает военного руководителя; русское «военачальник» передаёт и должность, и описательную характеристику без ненужного буквального «мужа».
- source_word: εὖ πολεμικαῖς χρείαις ἔχοντα πεῖραν
  choice: хорошо сведущего в военном деле
  rationale: Выражение подчёркивает основательный практический опыт в ведении войны; выбранная формулировка естественна в современном литературном русском.
theological_decisions:
- issue: Передача γένος в этническом контексте замысла уничтожения
  choice: народ Иудеи
  alternative: иудейский род; всё население Иудеи; иудейская раса
  rationale: Здесь речь идёт об истреблении иудеев как целого народа. «Народ» сохраняет коллективный этнический смысл, не внося современных биологических представлений, связанных со словом «раса»; географическая форма исходника отражена в обороте «народ Иудеи».
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан ясным для широкого читателя; придворный термин «Друзья» сохранён и пояснён, необычность παμφύλων ἔθνη и неоднозначность γένος вынесены в сноски.
