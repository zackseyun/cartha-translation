base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/023.yaml
  text: He also brought Eleazar[a], and after bringing forward the holy book and giving the watchword[b], “God’s Help,” he himself led the first company and engaged Nicanor.
translation:
  language: ru
  text: 'Он также вывел вперёд Елеазара, вынес священную книгу и дал пароль: «Божья помощь»[a]. Сам он повёл первый отряд[b] и вступил в бой с Никанором.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «помощь от Бога» или «Бог — помощь». Греческое выражение очень сжато и допускает несколько толкований; слово, переведённое как «пароль», может также означать условный знак или сигнал.'
    reason: lexical_alternative
  - marker: b
    text: Греческое военное слово можно также перевести как «первая когорта» или «первое подразделение».
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγαγὼν
  choice: вынес
  rationale: Аористное причастие обозначает действие, предшествующее основному; применительно к священной книге «вынес» естественно передаёт её торжественное представление собравшимся.
- source_word: τὴν ἱερὰν βίβλον
  choice: священную книгу
  rationale: βίβλος означает книгу и может подразумевать свиток, однако форма предмета в тексте не уточнена; «священная книга» сохраняет смысл без излишней конкретизации.
- source_word: σύνθημα
  choice: пароль
  rationale: В военном контексте слово обозначает заранее установленный опознавательный знак или пароль; «пароль» естественно сочетается с приведённой далее краткой формулой.
- source_word: θεοῦ Βοηθείας
  choice: Божья помощь
  rationale: Сжатое греческое выражение передано как краткий воинский пароль с сохранением связи помощи с Богом; грамматически возможны и другие способы развёртывания фразы.
- source_word: τῆς πρώτης σπείρης
  choice: первый отряд
  rationale: σπεῖρα обозначает воинское подразделение. «Отряд» понятно современному читателю и не навязывает специфически римскую организационную структуру, которую могло бы подразумевать слово «когорта».
- source_word: προηγούμενος
  choice: повёл
  rationale: Причастие изображает Иуду идущим впереди подразделения и лично возглавляющим его; «повёл» естественно передаёт руководство в движении.
- source_word: συνέβαλε τῷ Νικάνορι
  choice: вступил в бой с Никанором
  rationale: Военная идиома обозначает столкновение в сражении; перевод не утверждает одностороннего нападения и сохраняет взаимный характер боевого соприкосновения.
theological_decisions:
- issue: Подразумеваемое подлежащее при причастиях и основном глаголе
  choice: Подлежащее — Иуда, продолжающий действовать как главный участник повествования; Елеазар является лицом, которого он вывел вперёд.
  alternative: Менее вероятно, последующие действия можно теснее связать с Елеазаром.
  rationale: Имя Елеазара стоит в винительном падеже, тогда как формы мужского рода единственного числа естественно продолжают подлежащее из предшествующего контекста. Поэтому последовательность действий приписана Иуде, но неоднозначность, возникающая вне широкого контекста, отмечена в решении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Военные термины переданы ясно и без анахроничной привязки к строго римской структуре; синтаксис разбит на два предложения для естественной русской читаемости при сохранении последовательности греческого текста.
