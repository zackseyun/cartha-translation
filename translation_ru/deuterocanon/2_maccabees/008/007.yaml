    reason: textual_variant
lexical_decisions:
- source_word: μάλιστα
  choice: особенно
  rationale: Передаёт усилительное значение наречия, не добавляя идеи частоты или предпочтения, которой греческий текст прямо не выражает.
- source_word: τὰς νύκτας … συνεργοὺς ἐλάμβανεν
  choice: брал себе в союзницы ночи
  rationale: 'Сохраняет олицетворяющую метафору оригинала: ночи выступают помощниками и союзниками в военных действиях. Женский род слова «ночи» естественно требует формы «союзницы».'
- source_word: πρὸς τὰς τοιαύτας ἐπιβολὰς
  choice: при таких нападениях
  rationale: В данном военном контексте ἐπιβολαί обозначает враждебные предприятия или налёты; «нападения» ясно и без излишней конкретизации передаёт смысл.
- source_word: ἡ ἁλὴ τῆς εὐανδρείας αὐτοῦ
  choice: молва о его доблести
  rationale: Необычное греческое выражение по контексту указывает на распространявшуюся весть или славу о воинской храбрости героя. «Молва» хорошо сочетается с последующим глаголом звучания и сохраняет оттенок широко расходящейся вести.
- source_word: διηχεῖτο πανταχῇ
  choice: разносилась повсюду
  rationale: Передаёт как образ распространяющегося звука, так и контекстуальный смысл повсеместно становящейся известной молвы.
