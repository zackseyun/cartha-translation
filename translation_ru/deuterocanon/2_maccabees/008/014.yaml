base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/014.yaml
  text: But they were selling all that remained[a], and at the same time were imploring the Lord to rescue those who had been sold by the ungodly Nikanor before he encountered them.
translation:
  language: ru
  text: Они же продавали всё оставшееся и в то же время молили Господа избавить тех, кого нечестивый Никанор продал[a] ещё до того, как встретился с ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть, по смыслу, продал в рабство. В греческом тексте буквально сказано: «тех, кто были проданы».'
    reason: Контекстуальное значение ясно, но объект или назначение продажи прямо не выражены исходным греческим словом.
lexical_decisions:
- source_word: τὰ περιλελειμμένα πάντα
  choice: всё оставшееся
  rationale: Субстантивированное причастие совершенного вида с πάντα охватывает всё, что ещё оставалось; перевод сохраняет обобщённость греческого выражения и не уточняет без необходимости, что речь идёт именно об имуществе.
- source_word: ἐπώλουν
  choice: продавали
  rationale: Имперфект передаёт продолжавшееся действие; русская форма несовершенного вида естественно сохраняет этот оттенок.
- source_word: ὁμοῦ δὲ
  choice: и в то же время
  rationale: В данном контексте ὁμοῦ указывает на одновременность продажи и молитвы.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Обращение направлено к Богу; традиционное и ясное русское соответствие — «Господь».
- source_word: ἠξίουν
  choice: молили
  rationale: В контексте молитвы и крайней опасности глагол выражает настойчивую просьбу; «молили» звучит естественно, серьёзно и не архаично.
- source_word: ῥύσασθαι
  choice: избавить
  rationale: Глагол обозначает избавление от непосредственной угрозы или бедствия; «избавить» передаёт это значение без расширительного богословского истолкования.
- source_word: τοὺς ... πεπραμένους
  choice: тех, кого ... продал
  rationale: Перфектное причастие указывает на уже совершённую продажу с сохраняющимся результатом. Формулировка не добавляет в основной текст прямо не названное греческим словом рабство.
- source_word: ὑπὸ τοῦ δυσσεβοῦς Νικάνορος
  choice: кого нечестивый Никанор продал
  rationale: Действительная конструкция естественнее по-русски, а «нечестивый» сохраняет выраженную в δυσσεβής нравственно-религиозную оценку.
- source_word: πρὶν συντυχεῖν
  choice: ещё до того, как встретился с ними
  rationale: Оборот с πρίν обозначает встречу, которая на момент продажи ещё не состоялась. Подразумеваемым субъектом инфинитива по ближайшему контексту является Никанор; «встретился» сохраняет общий смысл, не делая военный характер столкновения излишне явным.
theological_decisions:
- issue: Передача κύριος в молитвенном обращении к Богу
  choice: Господа
  alternative: владыку
  rationale: Контекст однозначно указывает на Бога, поэтому «Господь» является уместным и общеупотребительным соответствием без конфессионального уточнения.
- issue: Следует ли прямо указать продажу в рабство
  choice: тех, кого ... продал
  alternative: тех, кого ... продал в рабство
  rationale: Контекст подразумевает продажу будущих пленников в рабство, однако πεπραμένους буквально сообщает лишь, что они были проданы. Основной текст сохраняет недосказанность источника, а контекстуальное пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сделан плавным и понятным, при этом сохранены одновременность двух действий, длительный характер продажи и намеренная неуточнённость выражения о проданных людях.
