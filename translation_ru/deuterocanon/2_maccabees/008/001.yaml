base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/001.yaml
  text: But Judas[a], who was also called Maccabeus, and those with him, slipping in secretly into the villages, were calling together their relatives; and taking in those who had remained in Judaism, they gathered about six thousand.
translation:
  language: ru
  text: Иуда же, называемый также Маккавеем, и его спутники незаметно пробирались в селения, созывали своих родственников и, принимая к себе тех, кто остался в иудаизме[a], собрали около шести тысяч человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто сохранил верность иудейскому образу жизни». Греческое слово «иудаизм» здесь обозначает иудейскую религиозную принадлежность и уклад жизни в противопоставлении эллинизирующему давлению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεισπορευόμενοι … λεληθότως
  choice: незаметно пробирались
  rationale: Сочетание причастия движения с наречием передаёт скрытное перемещение и стремление остаться необнаруженными; русский оборот естественно выражает обе стороны смысла без избыточного повторения «тайно».
- source_word: προσεκαλοῦντο
  choice: созывали
  rationale: Средний залог указывает на призыв людей к себе, в свою группу. «Созывали» передаёт собирание сторонников, не предполагая формального военного набора.
- source_word: τοὺς συγγενεῖς
  choice: своих родственников
  rationale: Современный и нейтральный эквивалент, сохраняющий семейно-родственное значение и не вводящий ограничения по полу.
- source_word: τοὺς μεμενηκότας ἐν τῷ Ἰουδαϊσμῷ
  choice: тех, кто остался в иудаизме
  rationale: Формально близкая передача сохраняет выраженную в греческом тексте принадлежность к иудейской религиозной и общинной жизни, не добавляя прямо понятия верности.
- source_word: προσλαμβανόμενοι
  choice: принимая к себе
  rationale: Передаёт присоединение и принятие людей в состав группы, не усиливая значение до «вербовали» или «зачисляли».
- source_word: συνῆγον εἰς ἑξακισχιλίους
  choice: собрали около шести тысяч человек
  rationale: «Собрали» естественно передаёт образование группы, а εἰς при числительном допускает указание на приблизительный итог. Слово «человек» ясно обозначает, что речь идёт о числе людей.
- source_word: ὁ καὶ Μακκαβαῖος
  choice: называемый также Маккавеем
  rationale: Конструкция обозначает дополнительное имя или прозвание Иуды; выбранная формулировка ясна и не решает сверх текста, является ли это именем, прозвищем или титулом.
theological_decisions:
- issue: Передача Ἰουδαϊσμός
  choice: иудаизм
  alternative: иудейский образ жизни; верность иудейской вере
  rationale: «Иудаизм» — прямой эквивалент греческого термина, который здесь охватывает религиозную и общинную идентичность в противопоставлении эллинизирующему давлению. Более развёрнутые варианты делают подразумеваемую верность явной и потому вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис несколько упрощён ради ясности, при этом сохранены последовательность действий, скрытный характер передвижения и неоднозначная ёмкость термина «иудаизм».
