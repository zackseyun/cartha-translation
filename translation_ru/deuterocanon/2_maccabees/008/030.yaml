  source_fidelity: 'Смысл в целом передан точно: разгром группы Тимофея и Вакхида, число убитых, захват высоких крепостей, раздел добычи и равное участие уязвимых групп сохранены. Однако «воины Тимофея и Вакхида» несколько сужает греческий оборот οἱ περὶ, который обозначает их группу/войско, а не обязательно только отдельных воинов. Основное прочтение αὐτούς как относящегося к действующей группе допустимо; альтернативное понимание надлежащим образом оставлено в сноске.'
