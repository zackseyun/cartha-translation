base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/030.yaml
  text: And after crushing the forces around Timothy and Bacchides[a], they killed more than twenty thousand of them, gained firm control of very high strongholds, and divided the plentiful plunder, making themselves equal sharers with the oppressed and orphans and widows, and even with the elderly.
translation:
  language: ru
  text: Разгромив войска Тимофея и Вакхида, они убили более двадцати тысяч из них, овладели весьма высокими крепостями и разделили обильную добычу, выделив себе такие же доли, как притесняемым людям, сиротам, вдовам и даже пожилым людям[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дав равные доли притесняемым людям, сиротам, вдовам и даже пожилым людям». Греческое местоимение допускает разные толкования; в основном тексте подразумевается, что воины выделили себе такие же доли, как этим уязвимым людям.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνερείσαντες
  choice: разгромив
  rationale: Причастие передаёт решительную, сокрушительную победу; «разгромив» естественно для военного повествования и сохраняет силу греческого глагола.
- source_word: τοὺς περὶ Τιμόθεον καὶ Βακχίδην
  choice: воинов Тимофея и Вакхида
  rationale: Оборот οἱ περὶ с именами обозначает людей, связанных с названными предводителями; в военном контексте «воины» ясно и естественно передаёт смысл группы.
- source_word: ὑπὲρ τοὺς δισμυρίους ... ἀνεῖλον
  choice: убили более двадцати тысяч из них
  rationale: ὑπέρ с винительным означает превышение числа, а ἀναιρέω в рассказе о сражении — «убить».
- source_word: ὀχυρωμάτων ὑψηλῶν εὖ μάλα ἐγκρατεῖς ἐγένοντο
  choice: овладели весьма высокими крепостями
  rationale: ἐγκρατεῖς ἐγένοντο означает установление владения или контроля; εὖ μάλα усиливает определение ὑψηλῶν, что передано словом «весьма».
- source_word: λάφυρα πλείονος
  choice: обильную добычу
  rationale: Выражение указывает на большое количество военной добычи; «обильную добычу» звучит современно и достойно.
- source_word: ἐμερίσαντο
  choice: разделили
  rationale: Глагол означает разделить или распределить на доли.
- source_word: ἰσομοίρους αὐτοὺς ... ποιήσαντες
  choice: взяв себе такие же доли, как и для
  rationale: 'Передаёт основное прочтение, при котором αὐτούς относится к действующим лицам: они не выделили себе большую долю, а получили столько же, сколько уязвимые группы. Синтаксическая неоднозначность отмечена в сноске.'
- source_word: τοῖς ἠκισμένοις
  choice: притесняемых
  rationale: Слово обозначает людей, подвергшихся дурному обращению, насилию или притеснению; «притесняемые» уместно рядом с другими уязвимыми группами.
- source_word: πρεσβυτέροις
  choice: пожилых
  rationale: Контекст перечисляет нуждающихся, а не должностных лиц; поэтому «пожилые» точнее, чем «старейшины».
theological_decisions:
- issue: Референт αὐτούς в обороте ἰσομοίρους αὐτοὺς ... ποιήσαντες
  choice: Воины взяли себе равные доли с притесняемыми, сиротами, вдовами и пожилыми.
  alternative: Они дали притесняемым, сиротам, вдовам и пожилым равные доли с собой.
  rationale: Местоимение αὐτούς может соотноситься с действующей группой в рефлексивном смысле, однако возможно и прочтение, при котором оно обозначает получателей. Основной текст следует первому пониманию, не устраняя альтернативу, которая сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского исторического повествования. Военная лексика ясна без архаизмов; синтаксическая неоднозначность греческого текста сохранена посредством сноски.
