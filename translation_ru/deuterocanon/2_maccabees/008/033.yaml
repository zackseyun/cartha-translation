base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/033.yaml
  text: And while they were celebrating the victory in their homeland[a], they burned those who had set fire to the sacred gates, including Kallisthenes, who had fled into a certain house for shelter; and he received the reward worthy of his ungodliness.
translation:
  language: ru
  text: Празднуя победу на родной земле, они сожгли тех, кто поджёг священные ворота, а также Каллисфена, укрывшегося в жилище[a]. Так он получил воздаяние, достойное своего нечестия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бежавшего искать убежища в жилище». Греческое выражение εἰς ἐνοίκιον необычно, и точный характер этого места неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπινίκια ... ἄγοντες
  choice: празднуя победу
  rationale: Греческое устойчивое выражение обозначает торжества по случаю победы; выбран естественный и ясный русский эквивалент.
- source_word: ἐν τῇ πατρίδι
  choice: на родной земле
  rationale: πατρίς означает родину или родную землю; такое выражение сохраняет коллективную соотнесённость и звучит естественно.
- source_word: τοὺς ἐμπρήσαντας τοὺς ἱεροὺς πυλῶνας
  choice: тех, кто поджёг священные ворота
  rationale: Передаёт совершившееся ранее действие и культовое значение прилагательного ἱερούς, не уточняя архитектуру сверх греческого текста.
- source_word: Καλλισθένην
  choice: Каллисфена
  rationale: Принята традиционная русская передача греческого имени Καλλισθένης.
- source_word: ὑφήψαν
  choice: сожгли
  rationale: Глагол означает поджечь или предать огню; в данном контексте подразумевается смертельное сожжение виновных.
- source_word: εἰς ἐνοίκιον πεφευγότα
  choice: укрывшегося в одном доме
  rationale: πεφευγότα указывает на бегство ради убежища, тогда как редкое ἐνοίκιον, вероятно, обозначает жилище; неопределённость места отмечена в сноске.
- source_word: τὸν ἄξιον ... μισθόν
  choice: воздаяние, достойное
  rationale: В контексте суда μισθός имеет смысл заслуженного возмездия; «воздаяние» сохраняет оценочную и несколько ироническую силу выражения.
- source_word: δυσσεβείας
  choice: нечестия
  rationale: Слово обозначает религиозно-нравственное нечестие, особенно непочтительность к святыне; русский выбор точен и литературен.
theological_decisions:
- issue: Культовое значение ἱεροὺς πυλῶνας
  choice: священные ворота
  alternative: храмовые ворота
  rationale: «Священные» сохраняет прямую культовую характеристику, не вводя отсутствующего в греческом тексте архитектурного уточнения.
- issue: Религиозно-нравственный смысл δυσσεβείας
  choice: нечестие
  alternative: безбожие
  rationale: «Нечестие» передаёт осуждение поругания святыни, тогда как «безбожие» могло бы чрезмерно сузить смысл до отрицания Бога.
- issue: Характер воздаяния в τὸν ἄξιον ... μισθόν
  choice: получил воздаяние, достойное своего нечестия
  alternative: получил заслуженную плату за своё нечестие
  rationale: Формулировка сохраняет утверждение рассказчика о соответствии наказания проступку, не добавляя отдельной доктринальной интерпретации.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Синтаксис упрощён без утраты последовательности событий; редкое выражение о месте укрытия сохранено в основном тексте обобщённо, а его неопределённость вынесена в сноску.
