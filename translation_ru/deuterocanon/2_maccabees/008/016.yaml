lexical_decisions:
- source_word: Συναγαγών
  choice: собрав
  rationale: Аористное причастие обозначает действие, предшествующее основному; русское деепричастие естественно передаёт эту последовательность.
- source_word: ὁ Μακκαβαῖος
  choice: Маккавей
  rationale: Традиционная русская форма прозвания Иуды, уместная в библейском литературном регистре.
- source_word: τοὺς περὶ αὐτὸν ὄντας
  choice: тех, кто был с ним
  rationale: Точно и естественно передаёт буквально «бывших вокруг него», не добавляя значения принадлежности, как в варианте «его воины».
- source_word: ἀριθμὸν ἑξακισχιλίους
  choice: числом около шести тысяч
  rationale: Сохраняет явное указание на численность; «около» уместно передаёт характер округлённого подсчёта войска.
- source_word: παρεκάλει
  choice: призвал
  rationale: В контексте воинского наставления выражает настойчивое ободрение и побуждение.
- source_word: μὴ καταπλαγῆναι
  choice: не ужасаться
  rationale: Передаёт сильный страх и потрясение, выраженные глаголом καταπλήσσω.
- source_word: τοῖς δεσμίοις
  choice: врагам
  rationale: Обычное лексическое значение — «узникам, пленникам», однако в данном военном контексте речь, по-видимому, идёт о вражеских силах; трудность чтения открыто отмечена в сноске.
- source_word: μηδὲ εὐλαβεῖσθαι
  choice: и не страшиться
  rationale: Передаёт боязливую настороженность и сохраняет параллелизм с предшествующим запретом.
- source_word: τὴν τῶν ... ἐθνῶν πολυπληθείαν
  choice: многочисленности народов
  rationale: Передаёт акцент на огромном числе противников; «народы» сохраняет этнополитический смысл ἔθνη без позднейшей конфессиональной окраски.
- source_word: ἀδίκως παραγενομένων ἐπʼ αὐτούς
  choice: несправедливо выступивших против них
  rationale: «Выступивших против» естественно описывает прибытие вражеского войска, а «несправедливо» сохраняет нравственную оценку автора.
- source_word: ἀγωνίσασθαι δὲ γενναίως
  choice: но сражаться мужественно
  rationale: Военный контекст требует значения «сражаться»; «мужественно» передаёт храбрость и благородную стойкость γενναίως.
theological_decisions:
- issue: Передача ἐθνῶν в иудейском военном контексте
  choice: народы
  alternative: язычники
  rationale: «Народы» сохраняет этнический и политический смысл слова, не усиливая без необходимости религиозное противопоставление.
- issue: Передача трудного τοῖς δεσμίοις
  choice: врагам с указанием буквального значения в сноске
  alternative: узникам / пленникам
  rationale: Буквальное значение плохо согласуется с увещанием перед битвой и следующим упоминанием множества напавших народов. Контекстуальный смысл дан в тексте, а подлинная текстово-лексическая трудность сохранена в сноске.
