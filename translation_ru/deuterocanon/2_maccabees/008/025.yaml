    reason: lexical_alternative
lexical_decisions:
- source_word: χρήματα
  choice: деньги
  rationale: В данном контексте речь идёт о плате, которую принесли люди, намеревавшиеся купить пленников; «деньги» передаёт смысл естественно и конкретно.
- source_word: τῶν παραγενομένων ἐπὶ τὸν ἀγορασμὸν αὐτῶν
  choice: у тех, кто пришёл купить их
  rationale: Оборот буквально обозначает пришедших ради их покупки; местоимение относится к людям, которых торговцы рассчитывали приобрести как пленников.
- source_word: συνδιώξαντες
  choice: преследовав же их
  rationale: Аористное причастие передано предшествующим действием; приставочный оттенок совместного или продолженного преследования не следует чрезмерно подчёркивать в русском тексте.
- source_word: ἐφʼ ἱκανόν
  choice: довольно далеко
  rationale: В контексте движения выражение естественно указывает на значительное расстояние, хотя может обозначать и значительную продолжительность времени.
- source_word: ἀνέλυον
  choice: они повернули назад
  rationale: В контексте преследования глагол означает прекращение движения вперёд и возвращение; этот вариант точнее сохраняет направительный смысл, чем общее «отступили».
- source_word: ἀπὸ τῆς χώρας
  choice: из той местности
  rationale: χώρα здесь обозначает территорию или местность без обязательного политико-географического значения.
- source_word: συγκλειόμενοι
  choice: оказавшись в стеснённом положении
  rationale: Формулировка сохраняет значение ограничения или зажатости, не уточняя без достаточных оснований, кем или какими обстоятельствами они были стеснены.
