base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/011.yaml
  text: So he immediately sent to the cities along the coast[a], inviting them to buy Jewish bodies, promising to hand over ninety bodies for a talent[b]; but he did not expect the punishment from the Almighty that was about to come upon him.
translation:
  language: ru
  text: И он тотчас послал в приморские города, приглашая купить тела иудеев[a] и обещая отдать девяносто тел за один талант; но он не ожидал возмездия[b] от Вседержителя, которое вскоре должно было его настигнуть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тела иудеев». Речь идёт об иудеях как о пленниках, предназначенных для продажи в рабство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «правосудия». Греческое слово может означать как осуществление справедливости, так и последующее наказание.'
    reason: alternative_reading
lexical_decisions:
- source_word: παραθαλασσίους πόλεις
  choice: приморские города
  rationale: Прилагательное обозначает города у моря; «приморские» — точный и естественный русский эквивалент.
- source_word: προκαλούμενος ἐπʼ ἀγορασμόν
  choice: приглашая купить
  rationale: Оборот передаёт обращение к предполагаемым покупателям с предложением совершить покупку.
- source_word: Ἰουδαίων σωμάτων
  choice: тела иудеев
  rationale: Буквальное «тела» сохраняет намеренно обезличивающий, торговый язык оригинала; речь идёт о людях, которых собирались продать в рабство.
- source_word: ἐνενήκοντα σώματα ταλάντου παραχωρήσειν
  choice: отдать девяносто тел за один талант
  rationale: 'Сжатая торговая формула указывает цену: девяносто пленников за талант. Добавление «один» естественно поясняет соотношение, не меняя смысла.'
- source_word: οὐ προσδεχόμενος
  choice: но он не ожидал
  rationale: Передаёт отсутствие ожидания и неспособность героя предвидеть грядущее воздаяние.
- source_word: τὴν ... δίκην
  choice: возмездия
  rationale: δίκη здесь может обозначать как осуществляющуюся справедливость, так и последующее наказание; «возмездие» в русском сохраняет связь обоих смыслов.
- source_word: μέλλουσαν παρακολουθήσειν αὐτῷ
  choice: которое вскоре должно было его настигнуть
  rationale: Передаёт и близость события, выраженную μέλλουσαν, и образ неотступно следующего и настигающего воздаяния в παρακολουθήσειν.
- source_word: τοῦ παντοκράτορος
  choice: от Вседержителя
  rationale: «Вседержитель» — установившийся русский библейский титул, точно передающий παντοκράτωρ и подчёркивающий верховную власть Бога.
theological_decisions:
- issue: Божественный титул παντοκράτωρ
  choice: Вседержитель
  alternative: Всемогущий
  rationale: «Вседержитель» непосредственно передаёт идею владычества над всем и является естественным для русского библейского регистра, не добавляя конфессионально специфического толкования.
- issue: Смысл δίκη как справедливости или наказания
  choice: возмездие
  alternative: кара; правосудие
  rationale: «Возмездие» позволяет сохранить смысловую напряжённость между справедливым судом и его карательным результатом, не сводя слово только к одному из них.
- issue: Сохранение обезличивающего σώματα
  choice: тела иудеев
  alternative: иудеи; иудейские рабы
  rationale: Оригинал намеренно представляет людей как товар. «Иудейские рабы» делает подразумеваемый исход явным, а «иудеи» смягчает жестокость выражения; буквальная формулировка сохраняет риторический эффект.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранён резкий, обезличивающий образ «тел»; синтаксис сделан ясным без устранения смысловой неоднозначности δίκη.
