base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/008/005.yaml
  text: But when Maccabaeus had formed a band[a], he had by then become irresistible to the nations, because the wrath of the Lord had turned to mercy.
translation:
  language: ru
  text: Когда же Маккавей собрал отряд, народы[a] уже не могли ему противостоять, потому что гнев Господа сменился милостью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для язычников»; греческое слово может обозначать окружавшие Иудею нееврейские народы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος ... ἐν συστήματι
  choice: собрал отряд
  rationale: Оборот описывает Маккавея как действующего в составе организованной группы. «Собрал отряд» естественно передаёт возникновение сплочённой боевой силы, не уточняя её численность и устройство.
- source_word: ἀνυπόστατος
  choice: неодолим
  rationale: Прилагательное означает того, кому невозможно противостоять или кого невозможно сдержать. «Неодолим» кратко и уместно передаёт этот смысл в военном контексте.
- source_word: τοῖς ἔθνεσιν
  choice: для народов
  rationale: Это прямое соответствие греческому выражению; в данном контексте имеются в виду окружавшие Иудею нееврейские народы. Возможное уточнение «язычников» вынесено в сноску, чтобы не сужать основной текст.
- source_word: τῆς ὀργῆς τοῦ κυρίου
  choice: гнев Господа
  rationale: «Гнев» сохраняет вес и богословскую серьёзность выражения, а «Господь» ясно обозначает Бога Израиля.
- source_word: εἰς ἔλεον τραπείσης
  choice: сменился милостью
  rationale: Передаёт образ перемены от гнева к милости естественным современным русским языком, не добавляя явно названного деятеля.
theological_decisions:
- issue: Причинный смысл заключительного родительного абсолютного оборота
  choice: потому что гнев Господа сменился милостью
  alternative: когда гнев Господа сменился милостью
  rationale: В контексте оборот объясняет успех Маккавея переменой Божьего отношения к народу. Причинная связь выражена ясно, но без дальнейшего истолкования природы этой перемены.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и торжественное без архаизмов. Сохранена краткость греческого предложения и богословская напряжённость перехода от гнева к милости.
