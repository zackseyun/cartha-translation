  text: having set before their eyes the lawless outrage committed by them against the holy place, and the abuse of the city that had been mocked, and also the overthrow of the ancestral way of life.
translation:
  language: ru
  text: имея перед глазами беззаконное надругательство, совершённое ими над святым местом, жестокое обращение с осмеянным городом и, кроме того, уничтожение уклада жизни предков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸ ὀφθαλμῶν λαβόντας
  choice: держа перед глазами
  rationale: Сохраняет зрительный образ греческого оборота и естественно передаёт призыв постоянно помнить случившееся.
- source_word: ὕβριν
  choice: поругание
  rationale: В контексте святого места передаёт дерзкое оскорбительное надругательство, не сводя значение лишь к насилию или высокомерию.
- source_word: εἰς τὸν ἅγιον τόπον
  choice: над святым местом
  rationale: Русское управление естественно выражает направленность оскорбительного действия против святыни.
- source_word: αἰκισμόν
  choice: издевательство
  rationale: Передаёт жестокое, унизительное обращение; сохраняет отличие от ὕβρις, хотя значения близки.
- source_word: ἐμπεπαιγμένης πόλεως
  choice: над осмеянным городом
  rationale: Сохраняет пассивное значение перфектного причастия ἐμπαίζω — город был подвергнут насмешке и унижению.
- source_word: προγονικῆς πολιτείας
  choice: уклада жизни предков
  rationale: πολιτεία здесь шире государственного строя и охватывает унаследованный общественно-религиозный образ жизни.
- source_word: κατάλυσιν
  choice: уничтожение
  rationale: Передаёт решительное разрушение или упразднение традиционного уклада.
theological_decisions:
- issue: Значение выражения προγονικῆς πολιτείας
  choice: уклад жизни предков
  alternative: отеческие законы / государственное устройство предков
  rationale: Выбран широкий вариант, не ограничивающий смысл только законодательством или политической организацией и сохраняющий культурно-религиозную ёмкость греческого выражения.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет форму зависимого причастного оборота, поскольку стих продолжает предыдущее предложение. Тон сдержанный и торжественный, без архаизации.
