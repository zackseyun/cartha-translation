  source_fidelity: 'Смысл в целом передан верно: речь о трёх основаниях, которые следует иметь перед глазами,— незаконном надругательстве над святым местом, жестоком унижении города и разрушении унаследованного образа жизни. Однако αἰκισμός сильнее простого «издевательства» и обозначает жестокое, оскорбительное обращение.'
