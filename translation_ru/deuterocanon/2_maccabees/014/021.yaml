  text: So they set a day on which they would come together privately; and from each side a sedan chair was brought forward[a], and seats were set out.
translation:
  language: ru
  text: Итак, они назначили день, когда встретятся наедине. С каждой стороны вынесли по паланкину[a] и расставили сиденья.
  philosophy: optimal-equivalence
  footnotes:
