lexical_decisions:
- source_word: δόξαν, λέγων δὲ τὴν ἀρχιερωσύνην
  choice: «…славы — я имею в виду первосвященство»
  rationale: 'δόξαν («славу») синтаксически относится к утраченной в данном отрывке начальной части предложения, а λέγων δὲ τὴν ἀρχιερωσύνην уточняет, о какой именно славе идёт речь: «я имею в виду первосвященство». Такое прочтение точнее греческого, чем понимание оборота как «по поводу первосвященства».'
- source_word: δεύτερον νῦν ἐλήλυθα
  choice: Теперь я пришёл во второй раз
  rationale: Сохраняются и временное νῦν («теперь»), и порядковое δεύτερον («во второй раз»), при этом русская фраза звучит естественно.
- source_word: ὑπὲρ τῶν ἀνηκόντων τῷ βασιλεῖ γνησίως φρονῶν
  choice: искренне заботясь об интересах царя
  rationale: τὰ ἀνήκοντα τῷ βασιλεῖ — относящиеся к царю дела или его интересы; γνησίως φρονῶν выражает искреннюю, неподдельную заботу или расположенность.
- source_word: τῶν ἰδίων πολιτῶν στοχαζόμενος
  choice: думая также о своих согражданах
  rationale: πολῖται означает сограждан, а στοχάζομαι здесь передаёт направленное внимание и заботу. Выбор не добавляет отсутствующего в греческом этнического оттенка.
- source_word: τῇ μὲν γὰρ τῶν προειρημένων
  choice: ведь из-за того, что упомянутые прежде…
  rationale: 'Данный греческий отрывок заканчивается внутри конструкции: артикль τῇ требует продолжения, находящегося за пределами цитаты. Перевод намеренно оставлен незавершённым и не вставляет существительное «безрассудство», которого в представленном тексте нет.'
