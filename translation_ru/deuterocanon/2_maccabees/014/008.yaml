  yaml_path: translation/deuterocanon/2_maccabees/014/008.yaml
  text: 'I have now come a second time concerning the high priesthood: first[a], because I sincerely have in mind the interests of the king, and second, because I am also considering those of my own fellow citizens; for by the folly of the men mentioned before'
translation:
  language: ru
  text: '…славы, то есть первосвященства. Теперь я пришёл во второй раз: во-первых, искренне заботясь об интересах царя, а во-вторых, заботясь также о своих согражданах; ведь из-за упомянутых выше…[a]'
