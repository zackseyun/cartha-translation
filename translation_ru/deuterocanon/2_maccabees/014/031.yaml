base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/031.yaml
  text: But when the other man realized that he had been outmaneuvered by the man’s boldness[a], he came to the greatest and holy temple, while the priests were offering the customary sacrifices, and ordered them to hand over the man.
translation:
  language: ru
  text: Когда же тот понял, что этот человек смело переиграл его, он пришёл к величайшему и святому храму[a] и, пока священники приносили положенные жертвы, велел им выдать этого человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к великому и святому храму». В греческом стоит превосходная степень — «величайшему», однако здесь она может служить возвышенным описанием храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συγνοὺς
  choice: когда же ... понял
  rationale: Аористное причастие передаёт осознание, предшествующее следующему действию; временная конструкция естественна для русского повествования.
- source_word: ὁ ἕτερος
  choice: тот
  rationale: Указательное местоимение отсылает к другому участнику описанного ранее противостояния, не добавляя отсутствующего в стихе имени.
- source_word: γενναίως ... ἐστρατήγηται
  choice: смело переиграл его
  rationale: Наречие γενναίως непосредственно характеризует стратегическое действие и означает «мужественно, смело»; ἐστρατήγηται передаёт успешное применение тактики. «Переиграл» естественно сохраняет стратегический оттенок, а перестройка активным залогом делает русскую фразу ясной.
- source_word: ὑπὸ τοῦ ἀνδρός
  choice: этот человек
  rationale: Обозначает конкретного мужчину, о котором идёт речь; «этот человек» ясно различает двух участников без внесения имени из контекста.
- source_word: παραγενόμενος
  choice: он пришёл
  rationale: Причастие последовательного действия естественно передано личной глагольной формой.
- source_word: ἐπὶ τὸ μέγιστον καὶ ἅγιον ἱερόν
  choice: к величайшему и святому храму
  rationale: Сохранена превосходная степень μέγιστον и обычное в данном контексте значение ἱερόν — Иерусалимский храм как храмовый комплекс.
- source_word: τὰς καθηκούσας θυσίας
  choice: положенные жертвы
  rationale: καθηκούσας обозначает надлежащие, предписанные жертвоприношения; «положенные» кратко и естественно передаёт эту обязательность.
- source_word: προσαγόντων
  choice: приносили
  rationale: В контексте жертвоприношения это нормативный русский эквивалент действия принесения жертв.
- source_word: ἐκέλευσεν παραδοῦναι
  choice: велел им выдать
  rationale: Передаёт властное распоряжение передать разыскиваемого человека; местоимение «им» ясно указывает на священников как адресатов приказа.
- source_word: τὸν ἄνδρα
  choice: этого человека
  rationale: Сохраняет греческое повторение обозначения разыскиваемого лица и не заменяет его неоднозначным местоимением.
theological_decisions:
- issue: Значение ἱερόν применительно к Иерусалимскому святилищу
  choice: храм
  alternative: святилище; храмовый комплекс
  rationale: Здесь ἱερόν может обозначать храм в широком смысле, включая его территорию. «Храм» — естественное и достаточно широкое русское обозначение, не сужающее смысл до внутреннего святилища.
- issue: Связь наречия γενναίως
  choice: 'наречие характеризует стратегическое действие: «смело переиграл»'
  alternative: 'превратить наречие в существительное и передать: «благодаря смелости этого человека»'
  rationale: В греческом γενναίως синтаксически относится к ἐστρατήγηται. Перевод сохраняет эту связь и не делает смелость отдельным средством действия, хотя смысловой оттенок мужества остаётся.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. Синтаксис умеренно развернут, но понятен обычному читателю. Стратегический оттенок передан глаголом «переиграл»; имена из ближайшего контекста не внесены в текст стиха.
