translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Длинная синтаксическая последовательность оригинала сохранена в читаемой форме; конечная запятая показывает, что фраза продолжается в следующем стихе. Маркер [a] помещён непосредственно при выражении о крови, которое он поясняет.
