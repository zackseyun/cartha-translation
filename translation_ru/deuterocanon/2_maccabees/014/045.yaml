  text: Yet still breathing and burning with rage[a], he rose up, though his blood was pouring out in streams and his wounds were severe, and running through the crowds, he stood upon a steep rock[b],
translation:
  language: ru
  text: Всё ещё дыша и пылая яростью, он поднялся и, хотя кровь лилась из него потоками[a], а раны были тяжёлыми, бегом пробрался сквозь толпы и встал на отвесной скале[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кровь била из него, словно из источника»; наречие κρουνηδόν рисует образ сильного потока или струи, подобной бьющей из источника.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на выступающей скале»; слово ἀπορρώγος может обозначать обрывистую, отвесную или выдающуюся вперёд скалу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι δὲ ἔμπνους ὑπάρχων
  choice: Всё ещё дыша
  rationale: ἔμπνους буквально указывает на наличие дыхания и тем самым на то, что человек ещё жив; перевод сохраняет яркий телесный образ.
- source_word: πεπυρωμένος τοῖς θυμοῖς
  choice: пылая яростью
  rationale: πεπυρωμένος передаёт образ разгоревшегося огня, а θυμοῖς в данном контексте обозначает сильный гнев; выражение естественно для современного русского языка и сохраняет интенсивность образа.
- source_word: ἐξαναστὰς
  choice: он поднялся
  rationale: Аористное причастие описывает подъём после падения или тяжёлого ранения; нейтральное «поднялся» не добавляет отсутствующей в тексте драматизации.
- source_word: φερομένων κρουνηδὸν τῶν αἱμάτων
  choice: кровь лилась из него потоками
  rationale: κρουνηδόν описывает обильное, струящееся, словно из источника, течение; «потоками» ясно передаёт этот образ без неестественной буквальности.
- source_word: δυσχερῶν τῶν τραυμάτων ὄντων
  choice: раны были тяжёлыми
  rationale: δυσχερής здесь характеризует раны как тяжкие, мучительные или серьёзные; «тяжёлые» — естественное и достаточно широкое соответствие.
- source_word: δρόμῳ τοὺς ὄχλους διελθών
  choice: бегом пробрался сквозь толпы
  rationale: δρόμῳ обозначает движение бегом, а διελθών — прохождение сквозь множество людей; «пробрался» естественно выражает движение через плотные толпы.
- source_word: στὰς ἐπί τινος πέτρας ἀπορρώγος
  choice: встал на отвесной скале
  rationale: ἀπορρώξ может описывать обрывистую, отвесную либо выступающую скалу. Основной текст выбирает ясное «отвесной», а возможный оттенок выступа отмечен в сноске.
