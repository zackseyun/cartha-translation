  source_fidelity: 'Перевод точно передаёт последовательность и образы греческого текста: Иуда ещё дышит, пылает гневом, поднимается при обильном истечении крови и тяжести ран, бежит сквозь толпы и становится на скале. «Пылая яростью», «кровь лилась из него потоками», «тяжёлыми» и «на отвесной скале» представляют допустимые и точные русские соответствия πεπυρωμένος τοῖς θυμοῖς, κρουνηδόν, δυσχερῶν и ἀπορρώγος. Смысловая неопределённость последнего определения не скрыта, а отмечена сноской.'
