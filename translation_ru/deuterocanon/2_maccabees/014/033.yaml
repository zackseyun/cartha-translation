  terminology: «Храм» для νεώς, «святилище Божье» для σηκός, «жертвенник» для θυσιαστήριον и «храм Дионису» для ἱερόν последовательно отражают различение греческих терминов настолько, насколько это естественно по-русски. Имя «Дионис» и дательный «Дионису» нормативны.
