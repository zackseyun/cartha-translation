base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/033.yaml
  text: 'Stretching out his right hand toward the temple[a], he swore this: “If you do not hand Judas over to me as a prisoner, I will make this sanctuary of God a plain, tear down the altar, and raise up here a splendid temple to Dionysus.”'
translation:
  language: ru
  text: 'Протянув правую руку к храму, он поклялся: «Если вы не выдадите мне Иуду как пленника, я превращу это святилище Божье в чистое поле, разрушу жертвенник и воздвигну здесь великолепный храм Дионису».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προτείνας τὴν δεξιὰν
  choice: Протянув правую руку
  rationale: Передаёт конкретный жест, сопровождающий клятву; притяжательное местоимение в русском не требуется.
- source_word: ἐπὶ τὸν νεών
  choice: к храму
  rationale: При глаголе жеста ἐπί естественно понимать как указание направления; «храм» обозначает храмовое здание.
- source_word: ὤμοσεν ταῦτα
  choice: он поклялся
  rationale: Естественная русская передача формулы введения прямой речи; отдельное «вот в чём» не обязательно.
- source_word: δέσμιον μοι τὸν Ἰούδαν παραδῶτε
  choice: вы не выдадите мне Иуду как пленника
  rationale: Сохраняет значение враждебной передачи и предикативный смысл δέσμιον, не утверждая буквально, что Иуда уже закован.
- source_word: τόνδε τὸν τοῦ θεοῦ σηκόν
  choice: это святилище Божье
  rationale: Σηκός обозначает священное сооружение или святилище; выбор отличает его от νεώς и сохраняет культовую окраску.
- source_word: εἰς πεδίον ποιήσω
  choice: превращу ... в голое поле
  rationale: Сохраняет яркий буквальный образ превращения застроенного священного места в открытую ровную землю.
- source_word: τὸ θυσιαστήριον κατασκάψω
  choice: разрушу жертвенник
  rationale: Κατασκάπτω здесь означает разорить или снести; «жертвенник» — традиционно понятный эквивалент культового алтаря.
- source_word: ἱερὸν ... τῷ Διονύσῳ
  choice: храм Дионису
  rationale: Ἱερόν обозначает посвящённое божеству священное сооружение; дательный передан конструкцией посвящения.
- source_word: ἐπιφανές
  choice: великолепный
  rationale: Передаёт значение заметного, внушительного, славного сооружения в контексте хвастливой угрозы.
theological_decisions:
- issue: Различение наименований священного пространства
  choice: νεώς передано как «храм», σηκός как «святилище», θυσιαστήριον как «жертвенник», а ἱερόν Диониса вновь как «храм»
  alternative: Во всех случаях употребить слово «храм»
  rationale: Греческий текст использует разные культовые термины. Их посильное различение сохраняет риторику угрозы и не сглаживает противопоставление иудейского святилища языческому храму.
- issue: Образ εἰς πεδίον ποιήσω
  choice: «превращу ... в голое поле»
  alternative: «сровняю ... с землёй»
  rationale: Более буквальная передача сохраняет конкретный образ открытого поля, тогда как идиома «сровнять с землёй» несколько ослабляет исходную метафору.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной библейской интонацией. Угроза передана резко и конкретно; архаизмы сведены к понятному культовому слову «жертвенник».
