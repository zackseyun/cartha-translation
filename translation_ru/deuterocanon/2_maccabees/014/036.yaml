  yaml_path: translation/deuterocanon/2_maccabees/014/036.yaml
  text: And now, O Lord, holy in every holiness, keep this house, recently purified, undefiled forever.
translation:
  language: ru
  text: И ныне, Господи, святой всякой святостью[b], сохрани навеки неосквернённым этот недавно очищенный дом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм». Греческое «дом» — распространённое в Библии обозначение святилища.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально близко к: «святой всякой святостью». Необычное греческое обращение можно также понимать как «святой превыше всякого освящения» или как сходное усилительное выражение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγιε
  choice: святой
  rationale: Прямое обращение к Богу в звательном значении; «святой» — прозрачный и естественный русский эквивалент.
- source_word: παντὸς ἁγιασμοῦ
  choice: всякой святостью
  rationale: Необычная греческая генитивная конструкция усиливает утверждение о святости Бога. Формулировка намеренно сохраняет её возвышенность и некоторую смысловую сжатость, не добавляя прямо не выраженного значения «источник».
- source_word: κύριε
  choice: Господи
  rationale: Обычное русское обращение к Богу, соответствующее звательной форме κύριε.
- source_word: διατήρησον
  choice: сохрани
  rationale: Императив выражает молитвенную просьбу поддерживать дом в состоянии чистоты.
- source_word: εἰς αἰῶνα
  choice: навеки
  rationale: Естественно передаёт неограниченную продолжительность в контексте молитвы.
- source_word: ἀμίαντον
  choice: неосквернённым
  rationale: Сохраняет культовый оттенок чистоты и согласуется с просьбой о дальнейшем состоянии святилища.
- source_word: τόνδε τὸν ... οἶκον
  choice: этот ... дом
  rationale: Сохраняет буквальный библейский образ «дома» как обозначения храма; контекст пояснён в сноске.
- source_word: προσφάτως κεκαθερισμένον
  choice: недавно очищенный
  rationale: Передаёт и недавнее время действия, и завершённое очищение дома.
theological_decisions:
- issue: Передача οἶκος как обозначения святилища
  choice: дом
  alternative: храм
  rationale: «Дом» непосредственно соответствует греческому слову и сохраняет распространённое библейское именование святилища, тогда как сноска делает значение явным.
- issue: Передача необычного обращения ἄγιε παντὸς ἁγιασμοῦ κύριε
  choice: Господи, святой всякой святостью
  alternative: Господи, святой превыше всякой святости; Господи, источник всякой святости
  rationale: Выбранная формулировка сохраняет необычность и интенсивность греческого выражения, не разрешая его неоднозначность посредством богословского уточнения, которого нет в тексте.
translation_notes:
  register: Современный литературный русский язык с возвышенным молитвенным звучанием. Синтаксис остаётся ясным, а необычность обращения к Богу сохранена и пояснена сноской.
