base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/015.yaml
  text: But when they heard of Nikanor’s advance and the attack of the Gentiles[a], they sprinkled dust upon themselves and implored the one who had established his people forever[c][b], and who always comes to the aid of his own portion with manifestation.
translation:
  language: ru
  text: Услышав о наступлении Никанора и нападении язычников[a], они посыпали себя землёй и стали умолять Того, кто навеки утвердил Свой народ и всегда явно приходит на помощь Своему уделу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народов». Здесь греческое слово обозначает нееврейские народы, враждебные иудеям.'
    reason: lexical_alternative
  - marker: b
    text: 'Слова «явно приходит на помощь Своему уделу» можно также перевести: «приходит на помощь Своему уделу, являя Себя». «Удел» — это Божий народ как принадлежащая Ему доля или наследие.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀκούσαντες
  choice: Услышав
  rationale: Деепричастие естественно передаёт обстоятельственное значение аористного причастия и предшествование главному действию.
- source_word: ἔφοδον
  choice: наступлении
  rationale: Военный термин передаёт враждебное продвижение Никанора и сохраняет отличие от следующего ἐπίθεσιν — «нападения».
- source_word: ἐπίθεσιν
  choice: нападении
  rationale: Прямое обозначение атаки; вместе с «наступлением» сохраняет пару разных греческих существительных.
- source_word: τῶν ἐθνῶν
  choice: язычников
  rationale: В данном иудейском контексте слово обозначает нееврейские народы, выступающие против иудеев; примечание сохраняет более общее значение «народы».
- source_word: καταπασάμενοι γῆν
  choice: посыпали себя землёй
  rationale: Близко передаёт жест скорби и моления; «землёй» непосредственно соответствует γῆν, не заменяя его без необходимости словом «прах».
- source_word: ἐλιτάνευσαν
  choice: стали умолять
  rationale: Передаёт настойчивую мольбу и естественно связывается с последующими определениями Бога.
- source_word: τὸν ἄχρι αἰῶνος συστήσαντα τὸν αὐτοῦ λαόν
  choice: Того, кто навеки утвердил Свой народ
  rationale: «Утвердил» сохраняет смысл установления и прочного основания народа, а «навеки» — длительность ἄχρι αἰῶνος.
- source_word: ἀεὶ δὲ μετʼ ἐπιφανείας ἀντιλαμβανόμενον
  choice: и всегда явно приходит на помощь
  rationale: «Приходит на помощь» естественно передаёт ἀντιλαμβανόμενον, а «явно» — помощь, сопровождаемую очевидным проявлением, без введения специального термина «эпифания».
- source_word: τῆς ἑαυτοῦ μερίδος
  choice: Своему уделу
  rationale: '«Удел» сохраняет образ выделенной доли и его заветный оттенок: Божий народ как принадлежащая Ему часть.'
theological_decisions:
- issue: Значение τῶν ἐθνῶν в иудейском контексте
  choice: язычников
  alternative: народов
  rationale: «Язычники» ясно передаёт контекстуальное противопоставление Израиля нееврейским народам, тогда как примечание сохраняет более широкое лексическое значение.
- issue: Характер помощи в μετʼ ἐπιφανείας
  choice: явно приходит на помощь
  alternative: приходит на помощь, являя Себя; приходит на помощь явным вмешательством
  rationale: Выражение указывает на явную, очевидную помощь и может подразумевать божественное явление. Основной текст остаётся естественным, а примечание сохраняет эту смысловую напряжённость.
- issue: Образ народа как τῆς ἑαυτοῦ μερίδος
  choice: Своему уделу
  alternative: Своему наследию; Своей доле
  rationale: «Удел» сохраняет образ Божьей доли или собственности, не уточняя его до одного догматического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Синтаксис сделан плавным и понятным; прописные местоимения при указании на Бога соответствуют распространённой русской библейской традиции. Неоднозначность ἐπιφάνεια и заветный образ μερίς сохранены в примечании.
