  yaml_path: translation/deuterocanon/2_maccabees/014/018.yaml
  text: Yet when Nicanor heard of the valor that those around Judas had[a], and of their courage in the struggles for their fatherland, he was reluctant to settle the matter by bloodshed.
translation:
  language: ru
  text: Однако Никанор, услышав о доблести людей Иуды и об их мужестве в борьбе за отечество, не решался разрешить дело кровопролитием.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «решить спор кровью»; возможно также: «совершить суд посредством кровопролития». Греческое выражение допускает значения решения дела, вынесения решения или совершения суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως δὲ
  choice: Однако
  rationale: Передаёт уступительно-противительный переход и естественно звучит в современном русском повествовании.
- source_word: ἀκούων
  choice: услышав
  rationale: Деепричастие естественно передаёт обстоятельственное значение греческого причастия и указывает на причину последующей осторожности Никанора.
- source_word: ἀνδραγαθίαν
  choice: доблесть
  rationale: Сохраняет воинский и почётный оттенок слова, не воспроизводя буквально его гендерную этимологию.
- source_word: οἱ περὶ τὸν Ἰούδαν
  choice: люди Иуды
  rationale: Естественный русский эквивалент идиомы, обозначающей сторонников или соратников Иуды; он не добавляет более узкого определения их статуса.
- source_word: ἐν τοῖς περὶ τῆς πατρίδος ἀγῶσιν
  choice: в борьбе за отечество
  rationale: «Борьба» охватывает широкий смысл ἀγών, а «отечество» сохраняет патриотическую окраску πατρίς.
- source_word: εὐψυχίαν
  choice: мужество
  rationale: Передаёт стойкость и отвагу в опасной борьбе ясным и достойным современным русским словом.
- source_word: ὑπευλαβεῖτο
  choice: не решался
  rationale: Выражает осторожное нежелание и колебание, не усиливая значение до явного страха.
- source_word: τὴν κρίσιν διʼ αἵματος ποιήσασθαι
  choice: разрешить дело кровопролитием
  rationale: Естественно передаёт идиоматическую мысль о решении конфликта посредством пролития крови, сохраняя смысловую широту κρίσις как решения или исхода дела.
