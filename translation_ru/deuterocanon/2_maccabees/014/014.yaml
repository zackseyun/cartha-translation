base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/014.yaml
  text: But those in Judea who had driven Judas out kept flocking in droves to Nicanor from among the nations[a], thinking that the misfortunes and disasters of the Jews would become their own prosperity.
translation:
  language: ru
  text: А те, кто в Иудее вынудил Иуду бежать, толпами сводили к Никанору язычников[a], полагая, что несчастья и бедствия иудеев обернутся их собственным благополучием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народы». Греческое ἔθνη может означать «народы», а в иудейском контексте часто — «язычники». Сжатая конструкция с глаголом συνέμιγνυν допускает оттенки «сводили», «привлекали» или «объединяли с Никанором»; слово «толпами» передаёт ἀγεληδόν.'
    reason: Сохранение лексической и оттеночной синтаксической неоднозначности без изменения наиболее прямой грамматической роли ἔθνη как объекта глагола.
lexical_decisions:
- source_word: οἱ ... πεφυγαδευκότες τὸν Ἰούδαν
  choice: те, кто ... вынудил Иуду бежать
  rationale: 'Перфектное причастие от φυγαδεύω имеет каузативный смысл: эти люди заставили Иуду бежать или изгнали его. Формулировка сохраняет этот смысл, не уточняя сверх греческого текста, был ли он формально изгнан.'
- source_word: ἐπὶ τῆς Ἰουδαίας
  choice: в Иудее
  rationale: 'Оборот естественно связывается с обозначением местонахождения действующих лиц: это те, кто находился в Иудее. Такое прочтение соответствует греческому порядку слов и не превращает фразу в указание на место, откуда был изгнан Иуда.'
- source_word: συνέμιγνυν ἀγεληδὸν τῷ Νικάνορι
  choice: толпами присоединялись к Никанору
  rationale: συνέμιγνυν передаёт смешение или присоединение, а ἀγεληδόν — массовое движение, буквально «стадом». «Толпами присоединялись» естественно по-русски и сохраняет выразительный оттенок оригинала.
- source_word: ἔθνη
  choice: вместе с язычниками
  rationale: В иудейском контексте ἔθνη часто обозначает нееврейские народы, то есть язычников. Из-за сжатого синтаксиса связь слова с остальными членами предложения неоднозначна, что отмечено в сноске.
- source_word: ἀτυχίας καὶ συμφορὰς
  choice: несчастья и бедствия
  rationale: 'Два близких существительных сохранены раздельно: ἀτυχία указывает на несчастье или неудачу, συμφορά — на более тяжёлое бедствие.'
- source_word: ἰδίας εὐημερίας
  choice: их собственным благополучием
  rationale: εὐημερία означает благополучие, процветание или успех. «Благополучие» образует ясный контраст с несчастьями и бедствиями иудеев.
- source_word: δοκοῦντες ἔσεσθαι
  choice: полагая, что ... обернутся
  rationale: Причастие с будущим инфинитивом выражает ожидание. Глагол «обернутся» естественно передаёт предполагаемое превращение чужих бедствий в собственную выгоду.
theological_decisions:
- issue: Значение ἔθνη в иудейском историческом контексте
  choice: язычниками
  alternative: народами
  rationale: В иудейской греческой литературе ἔθνη обычно обозначает неевреев. При этом сноска сохраняет синтаксическую неоднозначность и допускает более буквальную передачу «народами».
- issue: Синтаксическая связь ἐπὶ τῆς Ἰουδαίας
  choice: 'отнесено к людям: «те, кто в Иудее»'
  alternative: 'отнесено к изгнанию Иуды: «изгнал Иуду из Иудеи»'
  rationale: Положение оборота непосредственно после артикля οἱ позволяет понимать его как характеристику действующих лиц. Поскольку конструкция допускает обсуждение, перевод не добавляет богословски значимых уточнений.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Вынудил ... бежать» сохраняет каузативность без канцелярского «изгнал»; «толпами» передаёт образ ἀγεληδόν естественно, без чрезмерно уничижительного буквального «стадами».
