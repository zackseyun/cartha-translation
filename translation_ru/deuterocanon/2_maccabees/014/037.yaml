base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/037.yaml
  text: A certain Razis[a], one of the elders from Jerusalem, was reported to Nicanor—a man devoted to his city and very highly regarded[b], and because of his goodwill called the father of the Jews.
translation:
  language: ru
  text: Никанору сообщили о некоем Разисе[a], одном из иерусалимских старейшин. Он был предан своему городу[b], пользовался большим уважением и за свою доброжелательность был прозван отцом иудеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Никанору донесли на него». Греческий глагол может подразумевать сообщение властям во враждебной обстановке.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «любил свой город», то есть был предан благу своей гражданской общины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ῥαζεὶς
  choice: Разис
  rationale: Личное имя передано принятой русской транслитерацией греческой формы.
- source_word: τῶν ἀπὸ Ἱεροσολύμων πρεσβυτέρων
  choice: одном из иерусалимских старейшин
  rationale: πρεσβύτεροι здесь естественно обозначает признанных старших представителей общины, а не просто пожилых людей; оборот ἀπὸ Ἱεροσολύμων передан естественным русским определением.
- source_word: ἐμηνύθη
  choice: сообщили Никанору
  rationale: Форма указывает на передачу Никанору сведений о Разисе. Нейтральное «сообщили» не исключает враждебного доноса, возможного в контексте; этот оттенок отмечен в сноске.
- source_word: φιλοπολίτης
  choice: предан своему городу
  rationale: Сложное слово выражает любовь к своему полису и заботу о нём; перевод сохраняет гражданский смысл без современного политического оттенка слова «патриот».
- source_word: σφόδρα καλῶς ἀκούων
  choice: пользовался большим уважением
  rationale: Греческая идиома означает добрую репутацию и высокую общественную оценку.
- source_word: εὔνοιαν
  choice: доброжелательность
  rationale: Слово обозначает благожелательное расположение; русский эквивалент сохраняет широту значения, не уточняя объект, которого нет в самом выражении.
- source_word: πατὴρ τῶν Ἰουδαίων
  choice: отцом иудеев
  rationale: Передано как почётное именование, а не указание на буквальное отцовство.
- source_word: προσαγορευόμενος
  choice: был прозван
  rationale: Причастие обозначает устойчивое именование; «был прозван» естественно передаёт получение почётного наименования.
theological_decisions:
- issue: Почётная характеристика Разиса
  choice: Передать положительные гражданские и общинные характеристики прямо, без усиления или ослабления
  alternative: Истолковать φιλοπολίτης и πατὴρ τῶν Ἰουδαίων как «патриот» и «благодетель народа»
  rationale: Греческий текст явно даёт Разису высокую оценку, однако более идеологизированные или пояснительные обозначения добавили бы смысл, прямо не выраженный источником.
- issue: Характер сообщения Никанору
  choice: Основной текст оставляет формулировку сравнительно нейтральной, а возможность враждебного доноса указывает в сноске
  alternative: 'Перевести однозначно: «на него донесли Никанору»'
  rationale: Контекст допускает донос, но сам глагол μηνύω имеет более широкий смысл сообщения или раскрытия сведений; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Длинное греческое предложение разделено на два ради ясности; положительная характеристика Разиса и неоднозначность глагола ἐμηνύθη сохранены.
