lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: На это
  rationale: Естественно передаёт ответную реплику и сохраняет связь с предшествующей речью.
- source_word: Οἱ λεγόμενοι τῶν Ἰουδαίων Ἀσιδαῖοι
  choice: Те из иудеев, кого называют хасидеями
  rationale: Нейтрально передаёт λεγόμενοι, не навязывая возможного пренебрежительного оттенка; название исторической группы транслитерировано.
- source_word: ὧν ἀφηγεῖται
  choice: кого возглавляет
  rationale: Прямо и естественно выражает значение руководства группой, сохраняя относительную конструкцию.
- source_word: Ἰούδας ὁ Μακκαβαῖος
  choice: Иуда Маккавей
  rationale: Устоявшаяся русская библейская форма имени и прозвания.
- source_word: πολεμοτροφοῦσιν
  choice: разжигают войну
  rationale: Передаёт активное поддержание и усиление войны; по-русски звучит естественнее буквального «питают войну», сохраняя образный характер глагола.
- source_word: στασιάζουσιν
  choice: поднимают мятеж
  rationale: Передаёт активное участие в смуте, восстании или междоусобном возмущении без чрезмерно узкого политического толкования.
- source_word: οὐκ ἐῶντες
  choice: не позволяя
  rationale: Сохраняет незавершённость греческой фразы на границе стихов и не добавляет отсутствующего здесь дополнения.
theological_decisions:
- issue: Название группы Ἀσιδαῖοι
  choice: хасидеи
  alternative: благочестивые; асидеи
  rationale: Слово обозначает конкретную историческую группу, поэтому транслитерация точнее оценочного перевода «благочестивые» и не приписывает группе заранее положительную характеристику.
- issue: Оттенок Οἱ λεγόμενοι
  choice: кого называют
  alternative: так называемые
  rationale: Причастие допускает как нейтральное именование, так и дистанцирующий оттенок. В основном тексте оставлен нейтральный вариант, а возможный пренебрежительный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; повествовательная формула и обвинительная речь переданы ясно и сдержанно. Историческое название группы транслитерировано, незавершённый синтаксис на границе стихов намеренно сохранён многоточием.
