lexical_decisions:
- source_word: εἶχεν τὸν Ἰούδαν ... ἐν προσώπῳ
  choice: держал Иуду при себе
  rationale: Греческое выражение буквально связано с нахождением «перед лицом» и в данном контексте естественно передаёт постоянную личную близость или доступ к человеку, не исключая оттенка постоянного внимания.
- source_word: διὰ παντός
  choice: постоянно
  rationale: Выражение обозначает непрерывность или регулярное постоянство; «постоянно» естественно звучит в современном русском повествовании.
- source_word: ψυχικῶς
  choice: всей душой
  rationale: Редкое наречие, образованное от ψυχή, указывает на внутреннюю, душевную расположенность. «Всей душой» сохраняет этот образ и остаётся естественным по-русски.
- source_word: προσεκέκλιτο
  choice: расположился к нему
  rationale: Перфект передаёт сложившуюся, устойчивую благосклонность или привязанность. «Расположился» выражает установившееся внутреннее отношение, не усиливая его до формального союза.
- source_word: τῷ ἀνδρί
  choice: к нему
  rationale: Дательный падеж обозначает объект расположения. Русское местоимение избегает неестественного повтора «к этому человеку», при этом референт — Иуда — однозначен.
