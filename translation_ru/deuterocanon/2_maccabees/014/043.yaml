base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/043.yaml
  text: But since he had not succeeded in the blow because of the urgency of the struggle[a], and the crowds were rushing in within the gates[b], he ran up bravely onto the wall and hurled himself manfully down into the crowds.
translation:
  language: ru
  text: Но, не достигнув цели своим ударом из-за поспешности схватки, когда толпы врывались внутрь через ворота, он мужественно взбежал на стену и по-мужски[b] бросился с неё вниз, в толпу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «отважно». В греческом здесь употреблено слово, буквально связывающее отвагу с поведением мужчины; оно отличается от слова «мужественно» в первой части предложения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ πληγῇ μὴ κατευκτήσας
  choice: так как его удар не достиг цели
  rationale: πληγή может обозначать удар или рану, а κατευκτέω — достижение желаемого результата. В данном контексте речь идёт о неудавшемся ударе, нанесённом самому себе; формулировка сохраняет смысл цели, не достигнутой этим ударом.
- source_word: διὰ τὴν τοῦ ἀγῶνος σπουδήν
  choice: из-за поспешности схватки
  rationale: ἀγών здесь означает ожесточённую борьбу или схватку, а σπουδή указывает на спешку и напряжённость момента. «Поспешность схватки» естественно связывает неудачу со стремительностью происходящего.
- source_word: τῶν ὄχλων ἔσω τῶν θυρωμάτων εἰσβαλλόντων
  choice: толпы уже врывались внутрь ворот
  rationale: Генитивная абсолютная конструкция описывает происходящее одновременно действие; εἰσβάλλω передаёт стремительное вторжение, а ἔσω τῶν θυρωμάτων — движение внутрь, за ворота. «Уже» естественно выражает наступившую непосредственную угрозу, подразумеваемую контекстом.
- source_word: ἀναδραμὼν γενναίως ἐπὶ τὸ τεῖχος
  choice: он мужественно взбежал на стену
  rationale: ἀνατρέχω обозначает быстрое движение вверх, γενναίως — отважное действие, а τεῖχος — крепостную или иную ограждающую стену.
- source_word: ἀπεκρήμνισεν ἑαυτὸν ... εἰς τοὺς ὄχλους
  choice: бросился с неё вниз, в самую толпу
  rationale: ἀποκρημνίζω означает низвергать с высоты. Возвратная конструкция указывает, что он сам бросился вниз; «с неё» ясно соотносит действие со стеной, а «в самую толпу» естественно передаёт направленность εἰς τοὺς ὄχλους.
- source_word: ἀνδρωδῶς
  choice: по-мужски
  rationale: Наречие образовано от ἀνήρ («мужчина, муж») и буквально выражает мужскую отвагу. «По-мужски» сохраняет гендерно маркированный оттенок исходного текста, не сливая его с предшествующим γενναίως.
theological_decisions:
- issue: Гендерно маркированное наречие ἀνδρωδῶς
  choice: по-мужски
  alternative: отважно / мужественно
  rationale: Исходный текст отдельно употребляет γενναίως («мужественно, отважно») и затем ἀνδρωδῶς, буквально связывающее смелость с мужским поведением. Перевод сохраняет это различие и не превращает его в богословское утверждение о поле.
- issue: Оценочная окраска описания самоубийства
  choice: сохранено положительно окрашенное описание храбрости без добавочного нравственного комментария
  alternative: нейтрализовать выражения как «решительно» либо добавить осуждающую характеристику
  rationale: Греческий повествователь использует γενναίως и ἀνδρωδῶς. Перевод передаёт эти слова, но не выводит из них богословского одобрения самого поступка и не добавляет отсутствующего в стихе осуждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сохранён как единое стремительное предложение, соответствующее последовательности греческих причастных конструкций. Выражения «мужественно» и «по-мужски» намеренно разведены, чтобы передать два разных греческих наречия.
