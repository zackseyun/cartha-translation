lexical_decisions:
- source_word: ἰσχρὰ
  choice: пока
  rationale: 'Переданная греческая форма текстологически трудна; в сочетании с περιὼν контекст требует временного смысла: продолжающееся существование Иуды препятствует миру.'
- source_word: Ἰούδας
  choice: Иуда
  rationale: Традиционная русская форма библейского личного имени.
- source_word: περιὼν
  choice: жив
  rationale: Причастие от περίειμι может означать «оставаться в живых, продолжать существовать». В данном контексте краткое «жив» естественно передаёт продолжающееся присутствие Иуды как политической силы.
- source_word: ἀδύνατον
  choice: не может
  rationale: Безличная невозможность по-русски естественно выражена через сказуемое при «положение дел».
- source_word: εἰρήνης
  choice: мирным
  rationale: Прилагательное в составе естественного русского оборота сохраняет основное значение существительного «мир», не сужая его до формального договора.
- source_word: τυχεῖν
  choice: стать
  rationale: Греческий инфинитив означает достичь или обрести некоторое состояние; в русском сочетании с «положение дел» это естественно передаётся глаголом «стать».
- source_word: τὰ πράγματα
  choice: положение дел
  rationale: Выражение обозначает общую политическую ситуацию; «положение дел» сохраняет широту греческого и звучит естественно по-русски.
