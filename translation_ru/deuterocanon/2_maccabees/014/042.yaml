- source_word: ἤπερ
  choice: а не
  rationale: В данном сравнительном противопоставлении естественно выражает предпочтение одного исхода другому.
- source_word: ἀλιτηρίοις
  choice: этих злодеев
  rationale: Сохраняет сильную отрицательную моральную оценку лиц; «злодеи» здесь естественнее, чем более узкое «преступники».
- source_word: ὑποχείριος γενέσθαι
  choice: попасть в руки
  rationale: Устойчиво и ясно передаёт переход под чужую враждебную власть.
- source_word: τῆς ἰδίας εὐγενείας
  choice: его собственного благородства
  rationale: Сохраняет лексическую связь с εὐγενῶς и не устраняет возможный оттенок как нравственного достоинства, так и знатности.
- source_word: ἀναξίως
  choice: недостойному
  rationale: Передаёт несоответствие обращения присущему ему благородству.
- source_word: ὑβρισθῆναι
  choice: подвергнуться унизительному обращению
  rationale: Охватывает оскорбительное, унижающее и, возможно, насильственное дурное обращение, не сводя значение только к словам.
