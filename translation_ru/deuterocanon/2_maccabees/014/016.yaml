  yaml_path: translation/deuterocanon/2_maccabees/014/016.yaml
  text: But when the commander gave the order[a], he broke camp from there at once and joined battle with them near the village of Lessaou.
translation:
  language: ru
  text: Когда военачальник отдал приказ, он, снявшись с лагеря, тотчас выступил оттуда и вступил с ними в бой у селения Лессау.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «сошёлся с ними у селения Лессау» или «вступил с ними в бой, направившись к селению Лессау». Греческий глагол буквально означает «смешивается, сходится» и в военном контексте указывает на столкновение; предлог может обозначать как место действия, так и направление движения.'
    reason: Сохранение лексической и пространственной неоднозначности сочетаний συνμίσγει αὐτοῖς и ἐπὶ κώμην.
lexical_decisions:
- source_word: προστάξαντος
  choice: отдал приказ
  rationale: Аористное причастие в родительном самостоятельном обороте обозначает приказ, послуживший непосредственным толчком к дальнейшему действию; выражение естественно для военного контекста.
- source_word: τοῦ ἡγουμένου
  choice: военачальник
  rationale: В данном военном повествовании ἡγούμενος означает руководителя войска; «военачальник» передаёт это значение, не приписывая ему конкретной гражданской должности.
- source_word: ἀναζεύξας
  choice: снялся с лагеря
  rationale: Глагол употребляется о выступлении войска после сворачивания лагеря; русский оборот сохраняет конкретный военный оттенок.
- source_word: συνμίσγει αὐτοῖς
  choice: вступил с ними в бой
  rationale: Буквально глагол означает «смешивается, сходится», но в военном контексте обозначает боевое столкновение. Выбранный вариант ясен и не усиливает смысл сверх контекста.
- source_word: ἐπὶ κώμην
  choice: у селения
  rationale: Предлог ἐπί с винительным падежом допускает пространственный смысл направления к селению или действия в его районе. «У селения» естественно сохраняет эту пространственную неопределённость.
- source_word: Λεσσαού
  choice: Лессау
  rationale: Название передано транслитерацией греческой формы.
