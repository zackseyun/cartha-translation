lexical_decisions:
- source_word: βασιλείαν
  choice: царство
  rationale: Винительный падеж при τυχεῖν обозначает то, для чего достигается желаемое состояние; «царство» естественно охватывает и державу, и царское правление.
- source_word: εὐσταθείας
  choice: устойчивость
  rationale: Существительное обозначает прочное, стабильное состояние; в политическом контексте «устойчивость» передаёт состояние упорядоченного и надёжного царства.
- source_word: τυχεῖν
  choice: обрело
  rationale: Инфинитив означает «получить, достичь». Конструкция «чтобы царство обрело устойчивость» естественна по-русски и сохраняет значение достижения желаемого состояния.
- source_word: ὅθεν
  choice: Поэтому
  rationale: Наречие вводит следствие из предыдущего утверждения; «поэтому» ясно передаёт причинно-следственную связь.
- source_word: ἀφελόμενος
  choice: лишившись
  rationale: Средняя форма причастия ἀφαιρέω может означать «отнять у себя / лишиться». По контексту речи Алкима естественнее понимать её как указание на утрату им чего-то наследственного, не восполняя отсутствующее существительное.
- source_word: προγονικήν
  choice: наследственного
  rationale: Прилагательное обозначает принадлежащее предкам или полученное от них. Субстантивированное «наследственного…» сохраняет незавершённость дошедшего греческого текста и не подставляет предполагаемый объект.
