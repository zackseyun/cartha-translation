translation_notes:
  register: 'Современный литературный русский язык, сдержанный и понятный. Синтаксис слегка перестроен ради естественности: вместо буквального «царству получить устойчивость» — «чтобы царство обрело устойчивость». Многоточие обозначает физическую незавершённость свидетеля, а не стилистическую паузу.'
