base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/041.yaml
  text: But when the crowds were about to seize the tower[a], and were forcing the courtyard gate, and were ordering that fire be brought and the doors set on fire, he, completely surrounded, put the sword to himself;
translation:
  language: ru
  text: Когда толпы уже готовы были захватить башню, силой ломились в ворота двора и приказывали принести огонь, поджечь ворота и сжечь их, он, оказавшись окружённым со всех сторон, приставил к себе меч[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пал на свой меч» или «вонзил в себя меч». Греческое выражение буквально описывает, что он приставил меч к себе, не уточняя точный способ действия.'
    reason: Греческая конструкция допускает различные способы описания движения; сноска сохраняет эту сдержанность и не создаёт ошибочного образа меча, положенного «под» тело.
lexical_decisions:
- source_word: τῶν ... πληθῶν
  choice: толпы
  rationale: Множественное число передаёт форму греческого текста; слово не добавляет отрицательной оценки, заключённой в русском «чернь» или «сброд».
- source_word: μελλόντων ... καταλαβέσθαι
  choice: уже собирались захватить
  rationale: 'Передаёт близость намереваемого действия: захват башни был непосредственно предстоящим, но ещё не совершился.'
- source_word: τὸν πύργον
  choice: башню
  rationale: Прямое и естественное соответствие πύργος в контексте укреплённого сооружения.
- source_word: τὴν αὐλαίαν θύραν
  choice: ворота двора
  rationale: αὐλαία указывает на двор, а θύρα в данном архитектурном и осадном контексте естественно передаётся как «ворота».
- source_word: βιαζομένων
  choice: силой ломились
  rationale: Передаёт применение насилия к воротам и продолжающуюся попытку прорваться, не утверждая, что ворота уже были взломаны.
- source_word: κελευόντων πῦρ προσάγειν
  choice: требовали принести огонь
  rationale: Сохраняет значение распоряжения или приказа и движение огня к воротам.
- source_word: τὰς θύρας ὑφάπτειν καὶ τὰς θύρας φλέγειν
  choice: поджечь ворота и предать их пламени
  rationale: Сохраняет два близких выражения греческого текста, но избегает неестественного русского повтора «поджечь и сжечь».
- source_word: περικάλυπτος γενόμενος
  choice: оказавшись со всех сторон окружён
  rationale: Передаёт полную безвыходность положения, выраженную приставкой περι- и контекстом осады.
- source_word: ὑπέθηκεν ἑαυτῷ τὸ ξίφος
  choice: подставил под себя меч
  rationale: Близко передаёт образ греческого ὑποτίθημι — помещения меча под себя — и не уточняет сверх текста дальнейшую механику действия.
theological_decisions:
- issue: Описание самоубийственного действия Разиса
  choice: подставил под себя меч
  alternative: вонзил в себя меч; пал на свой меч
  rationale: Формулировка описывает тяжёлое действие прямо, но не превращает повествование в нравственную оценку и не навязывает более определённую механику, чем допускает греческое выражение.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис несколько развёрнут ради сохранения последовательности греческих причастных оборотов; редкие или конфессионально окрашенные слова не используются.
