- source_word: ἐν τοῖς τῆς ἀμιξίας χρόνοις
  choice: во времена обособления
  rationale: «Обособление» сохраняет буквальную идею разобщения или несовместного пребывания, не подменяя её толкованием «отступничество».
- source_word: συννοήσας
  choice: понял
  rationale: Естественно вводит осознание Алкимом своего положения.
- source_word: καθʼ ὁντιναοῦν τρόπον οὐκ ἔστιν αὐτῷ σωτηρία
  choice: ему никоим образом не спастись
  rationale: Идиоматично выражает полную невозможность избавления; инфинитив «не спастись» здесь относится к практическому спасению от опасности, а не обязательно к вечному спасению.
- source_word: πρὸς τὸ ἅγιον θυσιαστήριον ἔτι πρόσοδος
  choice: доступа к святому жертвеннику у него больше нет
  rationale: Передаёт утрату возможности или права приблизиться к священному жертвеннику.
theological_decisions:
- issue: Значение ἀμιξία в историко-религиозном контексте
  choice: времена обособления
  alternative: времена отступничества; времена разобщения
  rationale: Греческое слово буквально указывает на необщение, раздельность или несмешение. Контекст допускает религиозное отступничество и связанную с ним нечистоту, но основной текст не закрепляет это более узкое толкование.
- issue: Значение σωτηρία
  choice: не спастись
  alternative: нет спасения; нет возможности уцелеть
  rationale: В данном контексте речь, вероятнее всего, о безопасности или избавлении Алкима в сложившихся обстоятельствах. Русское «не спастись» сохраняет широту слова, не делая сотериологический смысл обязательным.
