  yaml_path: translation/deuterocanon/2_maccabees/014/005.yaml
  text: That day was quiet. But when he found an opportunity suitable for his own folly[a], and had been summoned by Demetrius to the council and asked in what disposition and purpose the Jews stood,
translation:
  language: ru
  text: В тот день было спокойно. Но, найдя случай, благоприятствовавший его собственному безрассудству[a], он был вызван Димитрием на заседание совета, где его спросили, каковы настроения и намерения иудеев,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «взяв случай как пособника собственного безрассудства». Греческое выражение сжато и представляет удобный случай как пособника его безрассудного замысла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡσυχίαν ἔσχεν
  choice: всё было спокойно
  rationale: Греческая идиома буквально говорит, что тот день «имел спокойствие». Русское «всё было спокойно» естественно передаёт отсутствие волнений, не добавляя идеи формального мира.
- source_word: καιρὸν ... λαβών
  choice: найдя случай
  rationale: Оборот обозначает, что он воспользовался подходящим моментом или возможностью. «Найдя случай» естественно сочетается с последующим определением.
- source_word: τῆς ἰδίας ἀνοίας συνεργόν
  choice: благоприятствовавший его собственному безрассудству
  rationale: Сжатый образ буквально называет подходящий момент «соучастником» его ἀνοία. Выбранная формулировка сохраняет олицетворение слабее, но ясно выражает, что обстоятельства содействовали его безрассудному замыслу.
- source_word: προσκληθεὶς εἰς συνέδριον
  choice: был вызван ... на совет
  rationale: συνέδριον здесь означает совещание или совет как место официального обсуждения; «вызван» уместно передаёт официальный характер приглашения.
- source_word: ὑπὸ τοῦ Δημητρίου
  choice: Димитрием
  rationale: Традиционная русская библейская передача имени Δημήτριος.
- source_word: ἐπερωτηθείς
  choice: его спросили
  rationale: Нейтрально передаёт официальный вопрос, не усиливая его до враждебного допроса.
- source_word: ἐν τίνι διαθέσει καὶ βουλῇ καθεστήκασιν
  choice: каковы настроения и намерения
  rationale: διάθεσις указывает на состояние или настрой, а βουλή — на намерение или замысел. Два русских существительных сохраняют различие понятий; буквальное «в чём стоят» было бы неестественно.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеев
  rationale: В маккавейском контексте это этнорелигиозное и политическое обозначение народа; «иудеи» соответствует русской библейской традиции и не сводит смысл лишь к жителям области.
theological_decisions:
- issue: Передача οἱ Ἰουδαῖοι
  choice: иудеи
  alternative: жители Иудеи
  rationale: Речь идёт о народе как этнорелигиозной и политической общности, а не только о географическом населении Иудеи; выбранный вариант сохраняет широкий смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейско-историческим регистром. Синтаксис сохраняет незавершённость исходного предложения, которое продолжается в следующем стихе; поэтому в конце поставлена запятая.
