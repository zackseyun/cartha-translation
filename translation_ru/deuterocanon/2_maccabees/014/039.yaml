  yaml_path: translation/deuterocanon/2_maccabees/014/039.yaml
  text: But Nikanor[a], wanting to make plain the hostility he had toward the Jews, sent more than five hundred soldiers to arrest him.
translation:
  language: ru
  text: Но Никанор, желая открыто показать свою враждебность к иудеям, послал более пятисот[a] воинов, чтобы схватить его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сверх пятисот».'
    reason: Передаёт буквальную форму греческого выражения ὑπὲρ τοὺς πεντακοσίους при ясном основном переводе «более пятисот».
lexical_decisions:
- source_word: βουλόμενος
  choice: желая
  rationale: Причастие выражает намерение Никанора, побудившее его к последующему действию; «желая» естественно передаёт волевой оттенок, не усиливая его до твёрдого решения.
- source_word: πρόδηλον ποιῆσαι
  choice: открыто показать
  rationale: Сочетание означает сделать нечто явным, очевидным для других; «открыто показать» передаёт и каузативный смысл ποιῆσαι, и публичную явность πρόδηλον.
- source_word: δυσμένειαν
  choice: враждебность
  rationale: Слово обозначает враждебное отношение или неприязнь; «враждебность» уместна в политико-военном контексте и не сводит значение лишь к эмоции ненависти.
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Прямой и естественный русский эквивалент повествовательного глагола отправления.
- source_word: στρατιώτας
  choice: воинов
  rationale: Обозначает отдельных военнослужащих; «воинов» сохраняет достоинство библейского повествования и остаётся понятным современному читателю.
- source_word: ὑπὲρ τοὺς πεντακοσίους
  choice: более пятисот
  rationale: ὑπέρ с винительным падежом при числительном выражает превышение указанного числа; «более пятисот» ясно и точно передаёт этот смысл.
- source_word: συλλαβεῖν
  choice: чтобы схватить
  rationale: В данном контексте глагол означает захват человека и взятие его под стражу; «схватить» сохраняет конкретность и силовой характер действия, не привнося современную юридическую процедуру ареста.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение отсылает к ранее названному Разису; русский текст сохраняет референциальную структуру греческого оригинала.
