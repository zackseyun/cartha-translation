revisions:
- from: Но поскольку выступить против царя было невозможно, он выжидал удобного случая, чтобы с помощью уловки довести дело до конца[a].
  to: Но поскольку выступить против царя было невозможно, он выжидал удобного случая, чтобы с помощью уловки осуществить это[a].
  rationale: 'Заменено «довести дело до конца» на «осуществить это»: новая формулировка естественна по-русски, не вводит «дело» и не конкретизирует подразумеваемый объект. Сноска сокращена и уточнена, чтобы описывать действительную текстовую особенность без вводящей в заблуждение пометы «буквально».'
