  text: But since it was not possible to oppose the king[a], he kept watching for an opportunity to accomplish it by a stratagem.
translation:
  language: ru
  text: Но поскольку выступить против царя было невозможно, он выжидал удобного случая, чтобы с помощью уловки осуществить это[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом не сказано прямо, что именно он намеревался осуществить.
    reason: Сохранение невыраженного объекта инфинитива ἐπιτελέσαι и исходной смысловой неопределённости.
lexical_decisions:
- source_word: ἐπεὶ δὲ
  choice: Но поскольку
  rationale: Передаёт переход, причинное значение ἐπεί и лёгкий противительный оттенок δέ.
- source_word: τῷ βασιλεῖ ἀντιπρᾶξαι
  choice: выступить против царя
  rationale: Естественно передаёт направленное противодействие, выраженное глаголом ἀντιπράσσω с дательным падежом, не добавляя отсутствующего в греческом наречия «открыто».
- source_word: οὐκ ἦν
  choice: было невозможно
  rationale: Сохраняет безличную конструкцию и значение невозможности.
- source_word: εὔκαιρον
  choice: удобного случая
  rationale: Субстантивированное прилагательное обозначает благоприятный момент или подходящую возможность; русский оборот естественен в данном контексте.
- source_word: ἐτήρει
  choice: он выжидал
  rationale: Имперфект указывает на продолжительное ожидание подходящего момента; «выжидал» кратко передаёт и длительность, и целенаправленность.
- source_word: στρατηγήματι
  choice: с помощью уловки
  rationale: Передаёт расчётливый хитроумный приём, не сужая значение до исключительно военной хитрости и не усиливая нравственную оценку словом «обман».
- source_word: τοῦ ἐπιτελέσαι
  choice: чтобы … довести дело до конца
  rationale: Передаёт целевое значение артиклевого инфинитива и идею завершения; добавленное «дело» необходимо для естественного русского выражения, тогда как объект в греческом оставлен невыраженным.
