  source_fidelity: 'В целом переданы размещение вооружённых людей, их готовность, выбор важных позиций, предупредительная цель и последующее совместное обсуждение. Однако «подобающие переговоры» неудачно передаёт τὴν ἁρμόζουσαν ... κοινολογίαν: речь скорее о соответствующем обстоятельствам взаимном обсуждении/совещании, а не обязательно о формальных переговорах.'
  naturalness: «На стратегически важных местах» тяжеловесно; «в ключевых местах» естественнее в современном литературном русском. Слово «злодейство» книжно-архаично и в данной конструкции звучит неестественно; «злое дело» сохраняет широкую семантику κακουργία и остаётся современным.
  terminology: Имена и существенные термины переданы корректно. Сноска поставлена у заключительного идиоматического выражения и должна сохранять альтернативу без навязывания более узкого смысла «переговоров».
