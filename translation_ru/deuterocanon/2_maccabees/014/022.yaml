revisions:
- from: Иуда расставил вооружённых людей в полной готовности на стратегически важных местах, чтобы со стороны врагов внезапно не произошло какого-либо злодейства; и они провели подобающие переговоры.[a]
  to: Иуда расставил вооружённых людей наготове в ключевых местах, чтобы со стороны врагов внезапно не произошло какого-нибудь злого дела; затем они провели уместное совещание.[a]
  rationale: Исправлены две стилистически и семантически менее точные формулировки. «Наготове» передаёт ἑτοίμους без добавления конкретной цели готовности; «в ключевых местах» передаёт тактический оттенок ἐπικαίροις. «Злое дело» сохраняет неспецифическое значение κακουργία, а «уместное совещание» точнее и естественнее передаёт κοινολογίαν. Сноска сохранена на надлежащем якоре и уточнена.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:10:27Z'
