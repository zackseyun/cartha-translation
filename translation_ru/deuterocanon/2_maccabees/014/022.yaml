base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/022.yaml
  text: Judas stationed armed men[a], ready in strategic places, lest some treachery from the enemies should suddenly arise; and they held the fitting conference.
translation:
  language: ru
  text: Иуда расставил вооружённых людей наготове в ключевых местах, чтобы со стороны врагов внезапно не произошло какого-нибудь злого дела; затем они провели уместное совещание.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «затем они уместно обсудили дело». Греческое выражение τὴν ἁρμόζουσαν ἐποίησαν κοινολογίαν обозначает совместное обсуждение или совещание, соответствующее данным обстоятельствам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέταξεν
  choice: расставил
  rationale: В сочетании с ἐνόπλους и указанием мест глагол обозначает размещение людей по позициям, а не только отдачу приказа.
- source_word: ἐνόπλους ἑτοίμους
  choice: вооружённых людей в полной готовности
  rationale: Сохраняет значение вооружённости и подготовленности, не уточняя сверх греческого текста, что это непременно регулярные солдаты.
- source_word: ἐν τοῖς ἐπικαίροις τόποις
  choice: на стратегически важных местах
  rationale: В военном контексте ἐπικαίροις указывает на выгодные или ключевые позиции.
- source_word: μή ποτε
  choice: чтобы ... не
  rationale: Естественно передаёт предупредительную цель предпринятой меры в современном русском языке.
- source_word: ἐκ τῶν πολεμίων
  choice: со стороны врагов
  rationale: Передаёт источник предполагаемой угрозы без чрезмерного уточнения способа действия.
- source_word: ἐφνιδίως κακουργία γένηται
  choice: внезапно не произошло какого-либо злодейства
  rationale: Сохраняет широкое значение κακουργία — злое или преступное действие — и оттенок внезапности, не сужая его обязательно до предательства.
- source_word: τὴν ἁρμόζουσαν ἐποίησαν κοινολογίαν
  choice: они провели подобающие переговоры
  rationale: Идиоматично передаёт взаимное обсуждение, соответствующее обстоятельствам; множественное число указывает на обе стороны встречи.
