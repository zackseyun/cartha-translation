lexical_decisions:
- source_word: προχειρισάμενος
  choice: избрал
  rationale: Причастие обозначает выбор или назначение для поручения; «избрал» позволяет не повторять последующее «назначил».
- source_word: εὐθέως
  choice: тотчас
  rationale: Передаёт незамедлительность действия естественным и достойным русским словом.
- source_word: τὸν γενόμενον ἐλεφαντάρχην
  choice: бывшего начальником боевых слонов
  rationale: ἐλεφαντάρχης — офицер, командовавший боевыми слонами; добавление «боевых» ясно передаёт военный контекст.
- source_word: στρατηγὸν τῆς Ἰουδαίας
  choice: военачальником Иудеи
  rationale: Сохраняет основное военное значение στρατηγός и неоднозначную связь должности с областью; административный оттенок отмечен в сноске.
- source_word: ἀναδείξας
  choice: назначил
  rationale: Глагол означает официальное провозглашение или назначение на должность.
- source_word: ἐξαπέστειλεν
  choice: отправил туда
  rationale: Передаёт направление Никанора в подразумеваемую Иудею; «туда» по-русски завершает фразу естественнее, чем буквальное «отправил его».
