lexical_decisions:
- source_word: κεκρατηκέναι τῆς χώρας
  choice: овладев страной
  rationale: Перфектный инфинитив κρατέω обозначает достигнутое господство над территорией; деепричастный оборот естественно передаёт зависимую конструкцию данного фрагмента.
- source_word: ἐπανελόμενον
  choice: устранив
  rationale: Передаёт устранение политических соперников, не уточняя без достаточных оснований, были ли они свергнуты или убиты.
- source_word: Ἀντίοχον
  choice: Антиоха
  rationale: Общепринятая русская передача личного имени в требуемом падеже.
- source_word: ἐπίτροπον
  choice: опекуна
  rationale: Прямое и понятное соответствие слову ἐπίτροπος; применительно к Лисию слово также может обозначать регента, что отмечено в сноске.
- source_word: Λυσίαν
  choice: Лисия
  rationale: Традиционная русская передача личного имени в требуемом падеже.
