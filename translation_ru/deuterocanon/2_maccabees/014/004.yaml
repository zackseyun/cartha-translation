translation:
  language: ru
  text: Он пришёл к царю Димитрию в сто пятьдесят первом году, принеся ему золотой венец, пальмовую ветвь и, кроме того, обычные приношения — ветви из храма[a]. В тот день он ничего не предпринимал[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и, кроме того, то, что обычно подносили, — ветви из храма». Греческая фраза сжата и допускает разные способы синтаксического членения; не вполне ясно, относится ли «обычные» непосредственно к ветвям или к подразумеваемым приношениям.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «оставался в покое». Вероятно, имеется в виду, что в тот день он не стал действовать дальше или выдвигать обвинения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν πρὸς τὸν βασιλέα Δημήτριον
  choice: Он пришёл к царю Димитрию
  rationale: Конструкция πρός с винительным обозначает движение к царю; «пришёл к» естественно передаёт повествовательный аорист.
- source_word: ὡς πρώτῳ καὶ ἑκατοστῷ καὶ πεντηκοστῷ ἔτει
  choice: в сто пятьдесят первом году
  rationale: Это обычная формула датировки; ὡς здесь не обязательно выражает приблизительность.
- source_word: στέφανον χρυσοῦν
  choice: золотой венец
  rationale: В контексте церемониального дара στέφανος означает венец; этот вариант сохраняет исторический регистр и не смешивает его с царской короной.
- source_word: φοίνικα
  choice: пальмовую ветвь
  rationale: Здесь φοῖνιξ обозначает церемониальную пальмовую ветвь, а не дерево.
- source_word: πρὸς δὲ τούτοις τοῖς νομιζομένοις θαλλῶν τοῦ ἱεροῦ
  choice: и, кроме того, зелёные ветви из храма, которые обычно подносили
  rationale: Сжатая и эллиптическая греческая конструкция связывает обычай с храмовыми зелёными ветвями. Перевод делает подразумеваемое подношение явным, сохраняя неоднозначность в сноске.
- source_word: καὶ τὴν ἡμέραν ἐκείνην ἡσυχίαν ἔσχεν
  choice: В тот день он не стал предпринимать дальнейших действий
  rationale: Идиома буквально выражает пребывание в покое; в контексте речь, вероятно, о том, что он в тот день воздержался от дальнейших действий или обвинений.
