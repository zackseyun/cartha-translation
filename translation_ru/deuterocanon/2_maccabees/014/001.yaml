  text: But after three years[a], word came to those around Judas that Demetrius son of Seleucus had sailed into the harbor at Tripolis with a strong force and a fleet,
translation:
  language: ru
  text: Но спустя три года Иуде и его людям стало известно[a], что Димитрий, сын Селевка, приплыл через гавань у Триполиса с сильным войском и флотом,
