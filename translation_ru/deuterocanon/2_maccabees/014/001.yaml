  source_fidelity: 'Основной смысл передан верно: χρονологический оборот, известие, Димитрий как сын Селевка, его сильные силы и флот сохранены. Однако «приплыл в гавань» не передаёт предлог διά («через, посредством»): в греческом гавань обозначена как путь, которым Димитрий вошёл/приплыл. Сноска также неточно называет объект буквального выражения: τοῖς περὶ τὸν Ἰούδαν — не «на Иуду и тех, кто был с ним», а «на тех, кто был вокруг Иуды».'
  naturalness: «Иуде и его людям стало известно» — естественная современная литературная передача, а незавершённость синтаксиса с запятой уместна, поскольку предложение продолжается. «Приплыл через гавань у Триполиса» достаточно естественно в повествовательном контексте и точнее отражает исходный предлог.
  terminology: Имена «Иуда», «Димитрий», «Селевк» и географическое название «Триполис» переданы последовательно и в принятой русской традиционной форме. «Войско» и «флот» адекватно передают πλῆθος и στόλος в данном военном контексте.
  issues:
