    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τριετῆ χρόνον
  choice: Но спустя три года
  rationale: μετά с винительным падежом обозначает время, по прошествии которого произошло событие; δέ передано мягким повествовательным переходом «но».
- source_word: προσέπεσεν τοῖς περὶ τὸν Ἰούδαν
  choice: Иуде и его людям стало известно[a]
  rationale: Буквальное значение προσπίπτω — «падать, обрушиваться», однако здесь оборот сообщает, что известие дошло до Иуды и его окружения. Русская формулировка естественна и не добавляет в текст явно не названного слова «весть».
- source_word: Δημήτριον τὸν τοῦ Σελεύκου
  choice: Димитрий, сын Селевка
  rationale: Конструкция с родительным падежом выражает происхождение; имена переданы в традиционной русской библейской форме.
- source_word: διὰ τοῦ κατὰ Τρίπολιν λιμένος εἰσπλεύσαντα
  choice: приплыл в гавань у Триполиса
  rationale: εἰσπλέω обозначает прибытие или вход морем; κατὰ Τρίπολιν указывает на гавань при Триполисе. «Приплыл в гавань» естественно передаёт морское движение, не перегружая русский текст буквальным «через гавань».
- source_word: μετὰ πλήθους ἰσχυροῦ καὶ στόλου
  choice: с сильным войском и флотом
  rationale: В военном контексте πλῆθος обозначает многочисленную силу или войско, ἰσχυρός — его мощь, а στόλος здесь уместно передать как «флот».
