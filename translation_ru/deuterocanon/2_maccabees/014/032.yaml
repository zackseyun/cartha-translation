lexical_decisions:
- source_word: τῶν δὲ μεθʼ ὅρκων φασκόντων
  choice: Они же клятвенно утверждали
  rationale: Генитив абсолютный передан самостоятельной обстоятельственной конструкцией, естественной по-русски. Наречие «клятвенно» сохраняет буквальный смысл μεθʼ ὅρκων («с клятвами»), а «утверждали» отражает φασκόντων, не сводя выражение лишь к принесению присяги.
- source_word: μὴ γινώσκειν
  choice: что не знают
  rationale: Инфинитив передаёт содержание утверждения; русская конструкция с придаточным изъяснительным звучит естественно. Настоящее время сохранено в соответствии с греческой косвенной речью.
- source_word: ποῦ ποτʼ ἐστίν
  choice: где находится
  rationale: «Находится» естественно передаёт местонахождение разыскиваемого и сохраняет настоящее время ἐστίν. Частица ποτε здесь придаёт неопределённый оттенок, который по-русски достаточно выражен самим вопросительным оборотом и контекстом.
- source_word: ὁ ζητούμενος
  choice: тот, кого разыскивают
  rationale: Субстантивированное причастие настоящего времени передано без уточнения пола и с сохранением продолжающегося характера поисков.
