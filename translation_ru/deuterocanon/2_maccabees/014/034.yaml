  yaml_path: translation/deuterocanon/2_maccabees/014/034.yaml
  text: 'After saying these things[a], he went away. But the priests, stretching out their hands toward heaven, were calling on the one who is always the champion of our nation, saying these things:'
translation:
  language: ru
  text: 'Сказав это, он ушёл. А священники, простерев руки к небу, взывали к Тому, Кто всегда защищает наш народ[a], говоря:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто всегда сражается за наш народ». Греческое слово означает защитника, выступающего за кого-либо в борьбе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα δὲ εἰπὼν
  choice: Сказав это
  rationale: Естественно передаёт обстоятельственный аористный оборот и отсылает к предшествующей речи без лишнего повторения.
- source_word: ἀπῆλθεν
  choice: он ушёл
  rationale: Прямой и современный русский эквивалент глагола удаления.
- source_word: οἱ δὲ ἱερεῖς
  choice: А священники
  rationale: Частица δέ обозначает переход к другому участнику повествования; «а» передаёт его естественно, не усиливая до резкого противопоставления.
- source_word: προτείναντες τὰς χεῖρας εἰς τὸν οὐρανὸν
  choice: простерев руки к небу
  rationale: Сохраняет описанный молитвенный жест и направленность действия; «простерев» уместно в dignified библейском регистре и понятно современному читателю.
- source_word: ἐπεκαλοῦντο
  choice: взывали
  rationale: Передаёт обращение к Богу в молитве; русское несовершенное значение естественно сохраняет длительность греческого имперфекта.
- source_word: τὸν διὰ παντὸς ὑπέρμαχον τοῦ ἔθνους ἡμῶν
  choice: к Тому, Кто всегда защищает наш народ
  rationale: Функционально передаёт постоянную защиту и боевой оттенок ὑπέρμαχος, не превращая греческое существительное в неестественный русский титул.
- source_word: ταῦτα λέγοντες
  choice: 'говоря:'
  rationale: Двоеточие естественно вводит содержание молитвы в следующем стихе; буквальное повторение «говоря это» по-русски было бы тяжеловесным.
theological_decisions:
- issue: Передача божественного обозначения τὸν διὰ παντὸς ὑπέρμαχον τοῦ ἔθνους ἡμῶν
  choice: к Тому, Кто всегда защищает наш народ
  alternative: к вечному Защитнику нашего народа; к Тому, Кто всегда сражается за наш народ
  rationale: Выбранная формулировка сохраняет Бога как постоянного защитника Израиля и не устраняет военную образность исходного слова; примечание сообщает более буквальную альтернативу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Написание «Тому, Кто» подчёркивает, что речь идёт о Боге, а «наш народ» естественнее русского «наша нация» в данном историко-религиозном контексте.
