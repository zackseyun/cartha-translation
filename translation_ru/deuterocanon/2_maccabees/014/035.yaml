lexical_decisions:
- source_word: ἀπροσδεὴς τῶν ὅλων
  choice: ни в чём не нуждающийся
  rationale: Оборот буквально указывает на отсутствие нужды во всём или зависимости от чего-либо. Русское «ни в чём не нуждающийся» естественно передаёт широту τῶν ὅλων, не сужая её до одних лиц.
- source_word: ηὐδόκησας
  choice: благоволил
  rationale: Глагол выражает благосклонное желание и решение; «благоволил» сохраняет молитвенно-возвышенный регистр, оставаясь понятным современному читателю.
- source_word: ναὸν
  choice: храм
  rationale: В данном контексте ναός обозначает храм как место Божьего присутствия; «храм» — ясный и устоявшийся русский эквивалент.
- source_word: τῆς σῆς σκηνώσεως
  choice: место Твоего обитания
  rationale: Существительное σκηνώσις означает обитание, пребывание или поселение. Конструкция поясняет предназначение храма; такое выражение естественнее буквального «храм Твоего обитания» и не привносит поздней специальной терминологии.
- source_word: ἐν ἡμῖν
  choice: среди нас
  rationale: 'В контексте храма наиболее вероятен общинно-пространственный смысл: храм находится посреди народа. Возможное «в нас» сохранено в сноске.'
- source_word: γενέσθαι
  choice: возник
  rationale: Глагол γίνομαι означает «возникнуть, появиться, стать». Перевод не конкретизирует действие как строительство, чего греческий текст прямо не говорит.
theological_decisions:
- issue: Божественная самодостаточность в ἀπροσδεὴς τῶν ὅλων
  choice: ни в чём не нуждающийся
  alternative: не имеющий нужды ни во всём сущем, ни в ком-либо
  rationale: Формулировка сохраняет напряжение между полной независимостью Бога и Его добровольным благоволением иметь храм среди народа, не превращая выражение в отвлечённый философский термин.
- issue: Общинный или внутренний смысл ἐν ἡμῖν
  choice: среди нас
  alternative: в нас
  rationale: Упоминание реального храма делает общинно-пространственное понимание более вероятным, однако грамматически возможный внутренний смысл не устраняется и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Обращение «Господи» и глагол «благоволил» поддерживают возвышенный регистр без излишней архаизации; местоимение «Ты» пишется с прописной буквы согласно распространённой русской религиозной норме.
