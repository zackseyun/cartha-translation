translation_notes:
  register: 'Современный литературный русский язык с уважительным придворным обращением без архаизации. Начальное δέ передано связью «А ты», а не добавочным «также»: оно продолжает речь и переводит её к прямой просьбе. Сохранён осторожный смысл редкого εὐαπάντητον посредством основной формулировки и сноски.'
