base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/009.yaml
  text: Since you know each of these things[a], O king, take thought for the country and for our nation that is being hard pressed[b], according to the gracious goodwill you have toward all.
translation:
  language: ru
  text: А ты, царь, зная каждое из этих обстоятельств, позаботься о стране и о нашем народе, находящемся в тяжёлом положении[a], в согласии с твоей благосклонной добротой[b] ко всем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народе, окружённом бедами», «народе под давлением». Греческое причастие может обозначать народ, окружённый или теснимый обстоятельствами.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «благосклонная доброта» передаёт редкое греческое сочетание, обозначающее доброжелательность, готовую откликнуться и благожелательно обращённую к людям.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστα ... τούτων
  choice: всё это
  rationale: Греческое выражение имеет распределительный оттенок («каждое из этого»), однако по-русски естественнее «всё это»; совокупность ранее изложенных обстоятельств сохраняется.
- source_word: ἐπεγνωκώς
  choice: зная
  rationale: Перфектное причастие обозначает уже достигнутое знание или ясное понимание; деепричастие «зная» естественно передаёт обстоятельственное значение.
- source_word: προσνοήθητι
  choice: позаботься
  rationale: Императив призывает не просто обдумать положение, а обратить на страну и народ деятельное, благожелательное внимание.
- source_word: χώρας
  choice: стране
  rationale: В политико-территориальном контексте χώρα означает землю или страну; «страна» здесь естественно и ясно.
- source_word: τοῦ περιισταμένου γένους ἡμῶν
  choice: о нашем народе, который тесним
  rationale: γένος обозначает здесь народ как общность, а настоящее причастие περιισταμένου — народ, окружённый бедами, испытывающий постоянное давление; «тесним» сохраняет и страдательность, и продолжающееся положение.
- source_word: καθ᾽ ἣν ἔχεις ... φιλανθρωπίαν
  choice: по той благосклонной доброте, какую ты проявляешь
  rationale: Оборот указывает на меру или основание просьбы — известное расположение царя; φιλανθρωπία передано как человечная доброта, а глагольное «проявляешь» делает русскую фразу естественной.
- source_word: εὐαπάντητον
  choice: благосклонной
  rationale: Редкое прилагательное описывает доброту, готовую откликнуться и доступную просителю; «благосклонной» передаёт положительную и отзывчивую расположенность, а нюанс раскрыт в сноске.
- source_word: πρὸς ἅπαντας
  choice: ко всем
  rationale: Предлог обозначает направленность расположения царя на всех людей.
