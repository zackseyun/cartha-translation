  source_fidelity: 'В целом смысл передан верно: обращение к царю, забота о стране и народе, находящемся под давлением, и ссылка на его благожелательность ко всем сохранены. Однако ἕκαστα τούτων имеет распределительный оттенок, который безопасно передать как «каждое из этих обстоятельств». Формула «который тесним» грамматически возможна, но в современном литературном русском звучит неестественно и недостаточно ясно; «находящемся в тяжёлом положении» сохраняет неспецифический смысл περιισταμένου без добавления причины бедствия.'
  naturalness: Предлагаемая редакция устраняет тяжеловесную и несколько неестественную конструкцию «по той благосклонной доброте, какую ты проявляешь ко всем». Оборот «в согласии с твоей ... добротой ко всем» литературен и передаёт καθ᾽ ἣν. Сноски привязаны непосредственно к поясняемым выражениям.
  terminology: «Страна» для χώρα и «народ» для γένος уместны. «Доброта» передаёт φιλανθρωπία; «благосклонная» осторожно отражает редкое εὐαπάντητον. Богословски нагруженных терминов нет.
