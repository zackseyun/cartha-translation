  yaml_path: translation/deuterocanon/2_maccabees/014/020.yaml
  text: But after fuller consideration of these matters[a], and when the leader had communicated it to the crowds, and unanimous agreement had become evident[b], they assented to the terms.
translation:
  language: ru
  text: После более тщательного рассмотрения этих вопросов[a], когда предводитель довёл это до сведения собравшегося народа и стало очевидно единодушное согласие[b], они согласились на условия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «После более подробного рассмотрения этих дел».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «когда обнаружилось единодушное согласие»; греческий текст подчёркивает ставшее явным единство мнений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλείονος ... γενομένης ... ἐπισκέψεως
  choice: после более тщательного рассмотрения
  rationale: Генитив абсолютный обозначает предшествующее обстоятельство; «более тщательного» передаёт сравнительную силу πλείονος, а «рассмотрения» — значение исследования и обсуждения у ἐπίσκεψις в данном контексте.
- source_word: περὶ τούτων
  choice: этих вопросов
  rationale: Указание относится к обсуждаемым делам; «вопросов» естественно звучит по-русски и не сужает смысл.
- source_word: τοῦ ἡγουμένου
  choice: предводитель
  rationale: Причастие обозначает того, кто ведёт или возглавляет; выбор не приписывает ему конкретной должности, которой греческий текст прямо не называет.
- source_word: τοῖς πλήθεσιν
  choice: собравшемуся народу
  rationale: Множественное πλήθη указывает на массы людей; в русском контексте собравшегося сообщества форма единственного числа звучит естественнее, чем буквальное «толпам».
- source_word: ἀνακοινωσαμένου
  choice: сообщил о них
  rationale: Глагол означает сообщить или довести до сведения; местоимение восполняет подразумеваемый предмет сообщения без усиления до официального провозглашения.
- source_word: φανείσης ὁμοψήφου συγγνώμης
  choice: стало очевидно единодушное согласие
  rationale: ὁμόψηφος буквально связано с единым голосованием и выражает единодушие; συγγνώμη здесь означает согласие, а не прощение; φανείσης передано как выявившееся состояние.
- source_word: ἔνευσαν
  choice: приняли
  rationale: Глагол может обозначать знак согласия или выраженное согласие; при условиях соглашения русское «приняли» естественно передаёт согласие на них.
- source_word: ταῖς συνθήκαις
  choice: предложенные условия
  rationale: συνθῆκαι — условия соглашения или договорённости. «Предложенные» поясняет подразумеваемую соотнесённость условий с обсуждением, не вводя конкретного вида договора.
