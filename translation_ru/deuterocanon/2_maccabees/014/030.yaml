base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/030.yaml
  text: But Maccabaeus[a], perceiving from Nicanor’s actions toward him that he had assumed a harsher than usual manner, and understanding that this severity did not come from the better course, gathered not a few of his men and kept himself hidden from Nicanor.
translation:
  language: ru
  text: Но Маккавей, заметив по поведению Никанора в обращении с ним, что тот стал держаться суровее обычного, и поняв, что такая суровость была вызвана не лучшими соображениями[a], собрал немало людей из своего окружения и скрывался от Никанора.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что такая суровость была не к добру». Греческое выражение может относиться как к побуждениям Никанора, так и к избранному им образу действий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσθητήριον διεξαγαγόντος ... τὰ πρὸς αὐτόν
  choice: по поступкам Никанора по отношению к нему
  rationale: Трудное сочетание описывает проявившееся в обращении Никанора с Маккавеем расположение или поведение. Перевод передаёт наблюдаемые действия, не превращая αἰσθητήριον в отвлечённую «способность восприятия».
- source_word: συνιδὼν
  choice: заметив
  rationale: Причастие обозначает осмысленное распознавание по наблюдаемым признакам, а не просто зрительное восприятие.
- source_word: τὴν ἠθισμένην ἀπάντησιν ἀγριωτέρως ἐσχηκότα
  choice: стал держаться суровее обычного
  rationale: Естественная русская формулировка сохраняет сравнительную степень и перемену в обычной манере Никанора при встречах и обращении с Маккавеем.
- source_word: νοήσας
  choice: поняв
  rationale: Передаёт вывод Маккавея, сделанный из изменившегося поведения Никанора.
- source_word: οὐκ ἀπὸ τοῦ βελτίστου τὴν αὐστηρίαν εἶναι
  choice: эта суровость исходит не из лучших побуждений
  rationale: 'Фраза остаётся несколько широкой: она может указывать как на недобрый мотив, так и на неблагоприятный образ действий. Основной текст звучит естественно, а сноска сохраняет альтернативу.'
- source_word: συστρέψας οὐκ ὀλίγους τῶν περὶ αὐτὸν
  choice: собрал вокруг себя немало своих людей
  rationale: Сохраняется литота «не немногих», естественно выраженная по-русски словом «немало», а также тактическое собирание сторонников вокруг Маккавея.
- source_word: συνεκρύπτετο τὸν Νικάνορα
  choice: скрывался от Никанора
  rationale: Несовершенный вид русского глагола передаёт продолжительный характер греческого имперфекта.
theological_decisions:
- issue: Неоднозначность выражения οὐκ ἀπὸ τοῦ βελτίστου
  choice: не из лучших побуждений
  alternative: была не к добру
  rationale: Греческая идиома допускает отнесение как к мотиву Никанора, так и к неблагому характеру избранного им курса. В сноске сохранено второе прочтение без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с повествовательной торжественностью без архаизмов. Синтаксис упрощён по сравнению с длинной греческой причастной конструкцией, но последовательность наблюдения, вывода и действия сохранена.
