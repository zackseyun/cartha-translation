lexical_decisions:
- source_word: ἐπανελέσθαι
  choice: умертвить
  rationale: В данном контексте глагол означает устранить посредством убийства, а не просто схватить; перевод сохраняет прямоту приказа.
- source_word: σκορπίσαι
  choice: рассеять
  rationale: Передаёт распоряжение разогнать и разобщить сторонников Иуды.
- source_word: καταστῆσαι
  choice: поставить
  rationale: Естественно выражает официальное назначение на должность.
- source_word: τοῦ μεγίστου ἱεροῦ
  choice: величайшего храма
  rationale: Сохраняет превосходную степень μεγίστου и указание на храм как учреждение, при котором служит первосвященник.
