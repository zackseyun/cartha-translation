  yaml_path: translation/deuterocanon/2_maccabees/014/028.yaml
  text: But when these men fell before Nikanor[a], he was thrown into confusion and took it badly that he should set aside the agreed terms[b], though the man had done no wrong.
translation:
  language: ru
  text: Когда Никанор узнал об этом[a], он пришёл в смятение; ему было тяжело при мысли, что он отменит достигнутые соглашения[b], хотя тот человек не сделал ничего дурного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда это обрушилось на Никанора»; то есть когда эти обстоятельства или известия дошли до него.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ранее установленные условия»; «соглашение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπεσόντων
  choice: пали перед
  rationale: Аористное причастие от προσπίπτω сохраняет телесный образ падения перед Никанором и одновременно допускает подразумеваемую мольбу.
- source_word: συνεκέχυτο
  choice: пришёл в смятение
  rationale: Форма передаёт внутреннее замешательство и душевную растерянность; выбранное выражение естественно для современного литературного русского языка.
- source_word: δυσφόρως ἔφερεν
  choice: с тяжёлым чувством думал
  rationale: Идиома означает тяжело переносить предполагаемое действие или относиться к нему с сильным неудовольствием; в сочетании с последующим εἰ по-русски естественно передаётся как тягостная мысль о предстоящем решении.
- source_word: τὰ διεσταλμένα
  choice: достигнутые договорённости
  rationale: Субстантивированная форма указывает на ранее установленные или согласованные условия; «договорённости» сохраняет дипломатический контекст, не сводя выражение к формальному договору.
- source_word: ἀθετήσει
  choice: нарушить
  rationale: Глагол может означать отвергнуть, упразднить или не соблюсти; применительно к договорённостям «нарушить» звучит естественно и передаёт практическое отступление от них.
- source_word: μηδὲν τἀνδρὸς ἠδικηκότος
  choice: хотя тот человек не сделал ничего дурного
  rationale: Генитив абсолютный выражает уступительное обстоятельство и ограниченную нравственно-правовую оценку поведения этого человека в данной ситуации.
- source_word: Νικάνορι
  choice: Никанором
  rationale: Имя передано прямой русской транслитерацией греческой формы Νικάνωρ.
theological_decisions:
- issue: Нравственная характеристика в μηδὲν τἀνδρὸς ἠδικηκότος
  choice: тот человек не сделал ничего дурного
  alternative: тот человек не совершил никакой несправедливости; тот человек никого не обидел
  rationale: Перевод сохраняет ограниченное утверждение текста о проступке в данной ситуации и не расширяет его до всеобъемлющего заявления о невиновности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис сделан естественным для русского, при этом сохранены телесный образ мольбы, внутреннее смятение Никанора и неоднозначность выражения о ранее согласованных условиях.
