  - severity: medium
    issue: «с тяжёлым чувством думал»
    rationale: δυσφόρως ἔφερεν означает тяжело, с неудовольствием или болью переносил перспективу действия, а не просто размышлял о ней. Нужна формулировка, выражающая тягостное отношение.
