  text: For he thought that by arresting him he would bring disaster on these people[a].
translation:
  language: ru
  text: Ведь он думал, что, схватив его, навлечёт беду на этих людей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Ведь ему казалось, что, схватив того человека, он причинит несчастье этим людям».'
    reason: Сноска сохраняет более формальное звучание ἔδοξεν, указательную силу ἐκεῖνον и прямой каузативный смысл ἐνεργάσασθαι.
lexical_decisions:
- source_word: ἔδοξεν
  choice: он думал
  rationale: В данном инфинитивном обороте глагол передаёт суждение действующего лица; «он думал» естественно звучит по-русски и не превращает его замысел в уже принятое решение.
- source_word: συλλαβών
  choice: схватив
  rationale: Причастие обозначает захват конкретного человека; «схватив» сохраняет повествовательную непосредственность, тогда как «арестовав» могло бы привнести более официальный юридический оттенок.
- source_word: ἐκεῖνον
  choice: его
  rationale: Указание относится к ранее названному человеку. В основном тексте русское «его» естественнее буквального «того человека»; указательная сила отражена в сноске.
- source_word: τούτοις
  choice: на этих людей
  rationale: Дательный обозначает группу, на которую обрушится беда. «Эти люди» сохраняет указательную силу и не сужает группу словом «мужчины».
- source_word: ἐνεργάσασθαι
  choice: навлечёт
  rationale: Инфинитив имеет каузативный смысл — причинить, вызвать. С сочетанием «беду на людей» глагол «навлечь» естественно передаёт причинение тяжёлого несчастья.
- source_word: συμφοράν
  choice: беду
  rationale: Слово обозначает тяжёлое несчастье или бедствие. «Беда» ясно и по-русски естественно передаёт смысл, не ослабляя угрозы в контексте.
