base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/026.yaml
  text: But Alcimus[a], perceiving the goodwill toward one another and learning of the agreements that had been made, came to Demetrius and said that Nicanor was favoring interests contrary to the state; for he had appointed Judas, the plotter against his kingdom[b], as successor.
translation:
  language: ru
  text: 'Алким же, увидев их взаимное расположение и получив заключённые договоры[a], пришёл к Димитрию и заявил, что Никанор придерживается взглядов, чуждых государственным интересам[b]: ведь он назначил преемником Иуду, строящего козни против его царства[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узнав о заключённых соглашениях». Буквально: «получив заключённые соглашения»; глагол может указывать как на получение самих договоров, так и на получение известия о них.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «мыслит чуждое делам». В политическом контексте оборот означает позицию, чуждую государственным или общественным интересам.'
    reason: idiom_clarification
  - marker: c
    text: '«Царство» — также возможно: «царская власть» или «царствование».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιδὼν
  choice: увидев
  rationale: Причастие обозначает осознание или распознавание сложившейся ситуации, а не только зрительное восприятие; в русском контексте «увидев» естественно передаёт оба оттенка.
- source_word: τὴν πρὸς ἀλλήλους εὔνοιαν
  choice: их взаимное расположение
  rationale: εὔνοια выражает благожелательность и добрые отношения; «взаимное расположение» сохраняет политико-личный оттенок, не усиливая его до близкой дружбы.
- source_word: τὰς γενομένας συνθήκας λαβὼν
  choice: получив заключённые договоры
  rationale: λαβών буквально означает «получив/взяв», а συνθῆκαι — заключённые соглашения или договоры. Формулировка допускает, что Алким получил сами договорные документы, не подменяя это менее буквальным «узнал о договорах».
- source_word: ἀλλότρια φρονεῖν τῶν πραγμάτων
  choice: держится взглядов, чуждых государственным интересам
  rationale: Сжатый греческий политический оборот буквально говорит о мыслях или позиции, «чуждых делам». Русская формулировка сохраняет компонент φρονεῖν — образ мыслей и политическую позицию — и передаёт обвинение в нелояльности.
- source_word: ἐπίβουλον τῆς βασιλείας αὐτοῦ
  choice: замышляющего против его царства
  rationale: ἐπίβουλος обозначает человека, строящего враждебные замыслы, а βασιλεία может указывать на царство либо царскую власть. Основной текст сохраняет конкретное «царство» и обвинительный характер слов Алкима.
- source_word: διάδοχον ἀπέδειξεν
  choice: назначил преемником
  rationale: ἀποδείκνυμι в данном административно-политическом контексте означает назначить или официально определить, а διάδοχος — преемника. Не добавляется отсутствующее в греческом уточнение, чьим именно преемником должен был стать Иуда.
theological_decisions:
- issue: Характер обвинения против Никанора
  choice: Передать фразу как обвинение в политических взглядах, чуждых государственным интересам.
  alternative: «Мыслит чуждо сложившемуся положению дел» или «действует против интересов государства».
  rationale: φρονεῖν непосредственно относится к образу мыслей или позиции, тогда как τὰ πράγματα в таком обвинении может означать государственные или общественные дела. Выбранный вариант сохраняет политический смысл, не превращая мысль прямо в действие.
- issue: Значение βασιλεία в обвинении против Иуды
  choice: «царство»
  alternative: «царская власть» или «царствование».
  rationale: Оба значения допустимы. «Царство» наиболее прямо и понятно в данном контексте, а сноска сохраняет возможность того, что речь идёт именно о власти или правлении Димитрия.
- issue: Чьим преемником назначен Иуда
  choice: 'Не уточнять: «назначил преемником Иуду».'
  alternative: «назначил Иуду своим преемником».
  rationale: В греческом тексте при διάδοχον нет дополнения, прямо называющего предшественника. Добавление «своим» устранило бы подлинную синтаксическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан ясным для широкого читателя; политическая риторика обвинения сохранена без архаизмов и конфессионально окрашенных добавлений.
