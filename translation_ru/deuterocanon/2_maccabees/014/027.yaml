base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/027.yaml
  text: But the king became enraged[a], and, provoked by the slanders of that utterly wicked man, wrote to Nikanor[b], saying that he took the treaty very badly and ordering him to send Maccabeus to Antioch as a prisoner at once.
translation:
  language: ru
  text: Царь же пришёл в ярость и, подстрекаемый наветами этого отъявленного злодея, написал Никанору, что крайне недоволен соглашением[a], и велел ему немедленно отправить Маккавея узником[b] в Антиохию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «договором»; возможно также: «условиями соглашения».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «связанным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθυμος γενόμενος
  choice: пришёл в ярость
  rationale: Передаёт резкий переход к сильному гневу и естественно звучит в современном русском повествовании.
- source_word: πανπονήρου
  choice: отъявленного злодея
  rationale: Сохраняет усиленную нравственную оценку, выраженную составным прилагательным, без архаичной тяжеловесности.
- source_word: διαβολαῖς
  choice: клеветой
  rationale: В данном контексте обозначает злонамеренные обвинения или наветы; собирательное единственное число естественно по-русски.
- source_word: ἐρεθισθεὶς
  choice: раздражённый
  rationale: Передаёт вызванное клеветой возбуждение и озлобление царя; причинная связь сохраняется причастной конструкцией.
- source_word: συνθηκῶν
  choice: соглашением
  rationale: Форма множественного числа может обозначать заключённое соглашение либо его условия. «Соглашение» уместно в политическом контексте и не конкретизирует сверх греческого текста.
- source_word: φάσκων βαρέως φέρειν
  choice: что крайне недоволен
  rationale: Естественно передаёт идиому со значением тяжёлого недовольства или оскорблённости, сохраняя косвенную речь.
- source_word: δέσμιον
  choice: узником
  rationale: Точно обозначает пленника или человека под стражей, не добавляя прямо не названных цепей.
- source_word: ἐξαποστέλλειν
  choice: отправить
  rationale: Соответствует значению послать или препроводить; в сочетании с «узником» подразумевает конвоирование.
- source_word: ταχέως
  choice: немедленно
  rationale: В контексте царского приказа ясно передаёт требование срочного исполнения.
theological_decisions:
- issue: Нравственная характеристика πανπονήρου
  choice: этого отъявленного злодея
  alternative: этого крайне нечестивого человека
  rationale: Сильная отрицательная оценка прямо присутствует в греческом тексте. Выбранная формулировка сохраняет её, не вводя специального богословского оттенка.
- issue: Степень конкретизации δέσμιον
  choice: узником
  alternative: связанным; в оковах
  rationale: Греческое слово указывает на положение пленника или связанного человека, но не требует понимать его буквально закованным в цепи; основной текст сохраняет более широкое значение.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Синтаксис следует ходу греческой фразы, но устранена неестественная для русского громоздкость. Имена переданы в принятой русской библейской форме: Никанор, Маккавей, Антиохия.'
