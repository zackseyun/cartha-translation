  text: When this man had said such things[a], the rest of the Friends, being quickly ill-disposed toward Judas[b], further incited Demetrius.
translation:
  language: ru
  text: После того как он это сказал, остальные Друзья[a], питавшие некоторую неприязнь к Иуде, тем скорее ещё больше подстрекнули Димитрия[b].
