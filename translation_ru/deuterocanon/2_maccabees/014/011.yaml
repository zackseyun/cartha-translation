lexical_decisions:
- source_word: τοιούτων δὲ ῥηθέντων ὑπὸ τούτου
  choice: После того как он это сказал
  rationale: Генитив абсолютный передан естественным временным придаточным; местоимение указывает на говорившего в предыдущем контексте, а «это» обобщает сказанное им.
- source_word: θᾶττον
  choice: тем скорее
  rationale: Сравнительная форма допускает значение «скорее, с большей готовностью»; в контексте оно связывает прежнюю неприязнь придворных с их быстрой реакцией.
- source_word: οἱ λοιποὶ φίλοι
  choice: остальные Друзья
  rationale: В селевкидском придворном контексте φίλοι, вероятно, служит титулом приближённых царя; прописная буква сохраняет это вероятное специальное значение.
- source_word: δυσμενῶς ἔχοντες τι πρὸς τὸν Ἰούδαν
  choice: уже питавшие некоторую неприязнь к Иуде
  rationale: Оборот обозначает недоброжелательное отношение, а неопределённое τι смягчает его степень; «питавшие неприязнь» естественно передаёт устойчивое расположение духа без усиления до открытой вражды.
- source_word: προετετύρωμαν
  choice: стали подстрекать
  rationale: Редкий глагол в данном контексте выражает дальнейшее возбуждение Димитрия к враждебным действиям; «подстрекать» ясно передаёт побудительный оттенок, не уточняя не названного в греческом тексте действия.
- source_word: τὸν Δημήτριον
  choice: Димитрия
  rationale: Традиционная русская форма имени Δημήτριος.
