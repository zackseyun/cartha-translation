base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/014/038.yaml
  text: For in earlier times[a], when separation was being judged, he had come under accusation for Judaism[b], and had risked both body and soul for Judaism with all earnestness.
translation:
  language: ru
  text: Ведь ещё прежде, когда рассматривалось дело об обособлении[a], он был привлечён к суду за приверженность иудаизму[b] и со всем усердием рисковал телом и душой ради иудаизма.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда разбиралось дело об отказе от общения». Греческое выражение сжато и, вероятно, относится к судебному разбирательству.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «иудаизм» означает не только вероучение, но и верность традиционной иудейской идентичности и образу жизни в условиях давления.
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τοῖς ἔμπροσθεν χρόνοις
  choice: ещё прежде
  rationale: Естественно передаёт отсылку к более раннему времени без архаизации.
- source_word: τῆς ἀμιξίας κρίσις
  choice: когда рассматривалось дело об обособлении
  rationale: Сжатая греческая конструкция, вероятно, имеет судебный смысл; «обособление» сохраняет значение несовместности или отказа от общения, не конкретизируя его сверх текста.
- source_word: εἰσενηνεγμένος
  choice: его привлекли к суду
  rationale: Перфектное причастие εἰσφέρω в данном окружении указывает на внесение дела или привлечение к разбирательству; формулировка передаёт судебный оттенок, не утверждая формального обвинительного акта.
- source_word: Ἰουδαισμοῦ
  choice: за приверженность иудаизму
  rationale: В первом употреблении добавление «приверженность» делает русскую причинную конструкцию ясной, а «иудаизм» сохраняет широкий исторический смысл еврейской веры, идентичности и уклада.
- source_word: σῶμα καὶ ψυχὴν
  choice: телом и душой
  rationale: Сохраняет выразительную антропологическую пару и идею полного самоотвержения.
- source_word: ὑπὲρ τοῦ Ἰουδαισμοῦ
  choice: ради иудаизма
  rationale: Передаёт посвящённость делу и готовность подвергнуться опасности ради него.
- source_word: παραβεβλημένος
  choice: рисковал
  rationale: Глагол обозначает подвергание себя опасности; это естественное русское соответствие при дополнении «телом и душой».
- source_word: μετὰ πάσης ἐκτενίας
  choice: со всем усердием
  rationale: Передаёт полноту напряжённых усилий и ревностную самоотдачу без конфессиональной окраски.
theological_decisions:
- issue: Исторический объём понятия Ἰουδαισμός
  choice: иудаизм
  alternative: иудейский образ жизни
  rationale: '«Иудаизм» прямо соответствует греческому термину и позволяет сохранить его широкий смысл: веру, традиционный уклад и общинную идентичность, не сводя его только к религии или этничности.'
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Судебная окраска сохранена, но неоднозначное содержание ἀμιξία не сведено к одному конкретному историческому запрету.
