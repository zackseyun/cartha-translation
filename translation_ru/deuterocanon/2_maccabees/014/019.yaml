  text: Therefore he sent Posidonius and Theodotus and Mattathias to give and receive pledges[a].
translation:
  language: ru
  text: Поэтому он послал Посидония, Феодота и Маттафию, чтобы они обменялись заверениями в доброй воле[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дали и приняли правые руки». Подать правую руку означало дать или принять заверение в доброй воле либо в соблюдении соглашения.'
    reason: cultural_note
lexical_decisions:
- source_word: διόπερ
  choice: Поэтому
  rationale: Передаёт выводное и причинное значение союза естественным современным русским словом.
- source_word: ἔπεμψεν
  choice: он послал
  rationale: Прямо передаёт аорист πέμπω; субъект восстанавливается из контекста, как и в греческом тексте.
- source_word: Ποσίδωνιον καὶ Θεόδοτον καὶ Ματταθίαν
  choice: Посидония, Феодота и Маттафию
  rationale: Имена переданы в традиционной русской библейской форме; многократное καί естественно сведено к нормативному русскому перечислению.
- source_word: δοῦναι καὶ λαβεῖν δεξιάς
  choice: чтобы они обменялись рукопожатиями в знак согласия
  rationale: Греческое выражение буквально говорит о том, чтобы «дать и принять правые руки», но обозначает взаимное скрепление договорённости. Русское «обменяться рукопожатиями» сохраняет конкретный жест, взаимность и идиоматический смысл.
