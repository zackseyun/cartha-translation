  source_fidelity: διόπερ, ἔπεμψεν и имена переданы верно. Выражение δοῦναι καὶ λαβεῖν δεξιάς — идиома взаимного предоставления гарантий/подтверждения доброй воли, сопровождаемая подачей правой руки. «Обменялись рукопожатиями» передаёт жест, но во множественном числе звучит неестественно и может представить действие лишь как взаимное приветствие посланников, а не как дипломатическое подтверждение договорённости.
