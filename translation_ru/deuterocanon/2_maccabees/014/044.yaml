  text: But when they quickly drew back[a], and a space opened up, he came into the middle of the courtyard.
translation:
  language: ru
  text: Но когда они быстро отступили и образовался промежуток, он попал в самую середину свободного пространства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναποδισάντων
  choice: отступили
  rationale: Причастие обозначает движение назад; «отступили» естественно передаёт физическое действие, не обязательно придавая ему военный смысл.
- source_word: ταχέως
  choice: быстро
  rationale: Прямо передаёт скорость и внезапность движения.
- source_word: γενομένου διαστήματος
  choice: когда образовалось свободное пространство
  rationale: Генитив абсолютный описывает возникший между людьми промежуток; формулировка ясно связывает его с тем, что они отступили.
- source_word: κατὰ μέσον
  choice: прямо посреди
  rationale: Передаёт направленность движения в середину и звучит естественно по-русски.
- source_word: κενεῶνα
  choice: свободное пространство
  rationale: Существительное обозначает пустое, незанятое место; в данном контексте это образовавшийся в толпе просвет, а не обязательно архитектурный двор.
- source_word: ἦλθεν
  choice: оказался
  rationale: Буквально глагол означает «пришёл», но здесь описывает результат прыжка и попадание в освободившееся место. «Оказался» сохраняет сдержанность греческой формулировки и не добавляет прямо не выраженного глагола «упал».
