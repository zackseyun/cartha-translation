revisions:
- from: Но они быстро отступили, и, когда образовалось свободное пространство, он оказался прямо посреди него.[a]
  to: Но когда они быстро отступили и образовался промежуток, он попал в самую середину свободного пространства.
  rationale: Убрано добавочное усиление и выбран более динамичный русский глагол для ἦλθεν. «Промежуток» передаёт διάστημα, а «свободное пространство» — κενεών, не предрешая, идёт ли речь об архитектурном дворе. Сноска снята как не необходимая для перевода и не привязанная к требующему пояснения слову.
