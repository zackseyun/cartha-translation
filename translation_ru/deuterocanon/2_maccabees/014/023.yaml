    reason: lexical_alternative
lexical_decisions:
- source_word: διέτριβεν
  choice: оставался
  rationale: Имперфект передаёт продолжительное пребывание Никанора в Иерусалиме; «оставался» естественно выражает эту длительность без добавочных предположений.
- source_word: ἔπραττεν οὐδὲν ἄτοπον
  choice: не делал ничего неподобающего
  rationale: ἄτοπος может означать неуместное, неподобающее или странное. Выбранная формулировка естественна по-русски и сохраняет достаточно широкий смысл нравственно-политической оценки поведения.
- source_word: συναχθέντας
  choice: собравшиеся
  rationale: 'Передаёт прямое значение причастия: толпы сошлись или были собраны вместе.'
- source_word: ἀγελαίους
  choice: сбившиеся словно в стаи
  rationale: Прилагательное образно уподобляет людей стаду или стае и имеет уничижительный оттенок. Образ «стаи» сохраняет этот оттенок, но сравнительная частица делает выражение естественнее в современном русском тексте.
- source_word: ὄχλους
  choice: толпы
  rationale: Обычное и контекстуально точное соответствие множественному числу ὄχλους; отрицательная окраска передаётся соседним ἀγελαίους.
- source_word: ἀπέλυσεν
  choice: распустил
  rationale: Здесь речь идёт не об освобождении пленников, а о том, что Никанор велел собравшимся группам разойтись.
