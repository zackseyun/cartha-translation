    rationale: 'βραδέως означает «медленно, нескоро»; «постепенно» в данном предложении предполагает постепенный процесс поражения и звучит по-русски неестественно. Более безопасно: «потерпел неудачу не сразу», с примечанием о синтаксической неясности.'
  - severity: medium
    issue: Сноска приписывает ἀφασία значения «растерянность или оцепенение».
    rationale: Основное значение ἀφασία — отсутствие речи, неспособность говорить, онемение. Возможные контекстуальные выводы о растерянности не следует выдавать за лексическое значение, особенно в трудной конструкции.
  - severity: low
