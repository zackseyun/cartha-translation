  rationale: Сохранено военное значение συμβάλλω с дательным («вступил в бой с»), подтверждаемое непосредственным контекстом столкновения. «Не сразу» точнее и естественнее передаёт буквальное временное значение βραδέως, не навязывая спорное понимание его синтаксической роли. Сноска сохраняет странность ἀφασία и неопределённость заключительной конструкции, не подменяя «утрату речи» психологической интерпретацией.
