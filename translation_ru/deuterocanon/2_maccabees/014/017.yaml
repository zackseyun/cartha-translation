  text: But Simon[a], the brother of Judas, had come to terms with Nicanor[c][b], though reluctantly, having stumbled because of the sudden speechlessness of his opponents.
translation:
  language: ru
  text: Симон же, брат Иуды, вступил в бой с Никанором, но потерпел неудачу не сразу из-за внезапного онемения противников.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключительная часть стиха в греческом тексте трудна. Буквально βραδέως означает «медленно, нескоро», а ἀφασία — «неспособность говорить, утрата речи». Точная связь этих слов в предложении не вполне ясна; поэтому смысл выражения «из-за внезапного онемения противников» следует сохранять без дальнейшего истолкования.
    reason: textual_difficulty
lexical_decisions:
- source_word: συμβεβληκὼς ἦν τῷ Νικάνορι
  choice: вступил в бой с Никанором
  rationale: В военном контексте συμβάλλω с дательным падежом естественно означает столкнуться с кем-либо или вступить в бой; перифрастический плюсквамперфект указывает на уже состоявшееся столкновение.
- source_word: βραδέως
  choice: постепенно
  rationale: Наречие непосредственно связано с ἐπταικώς и буквально передаёт медленное развитие неудачи; такое прочтение не переносит его без достаточных оснований на отношение Симона к Никанору.
- source_word: ἐπταικώς
  choice: потерпел неудачу
  rationale: πταίω может означать споткнуться, ошибиться или потерпеть неудачу. В описании боя естественный русский эквивалент передаёт военный setback, не добавляя идеи нравственного проступка или окончательного разгрома.
- source_word: ἀφασίαν
  choice: онемения
  rationale: ἀφασία буквально обозначает утрату речи или неспособность говорить. «Онемение» сохраняет необычный образ и допускает также оттенок внезапного оцепенения.
- source_word: ἐφνίδιον
  choice: внезапного
  rationale: Прилагательное подчёркивает неожиданность и резкость описанного состояния.
- source_word: τῶν ἀντιπάλων
  choice: противников
  rationale: Сохранено нейтральное обозначение противостоящей стороны без добавления притяжательного местоимения, поскольку соотнесение группы в трудной греческой фразе не вполне ясно.
