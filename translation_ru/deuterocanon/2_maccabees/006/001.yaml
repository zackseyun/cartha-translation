  yaml_path: translation/deuterocanon/2_maccabees/006/001.yaml
  text: But after not much time[a], the king sent an aged Athenian to compel the Jews to depart from the laws of their fathers and not to live by the laws of God[b],
translation:
  language: ru
  text: Немного времени спустя[a] царь послал пожилого афинянина принуждать иудеев отступить от законов отцов и не жить по законам Божьим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по прошествии недолгого времени».'
    reason: lexical_alternative
  - marker: b
    text: Глагол, переведённый как «жить», может также подразумевать устройство общественной или гражданской жизни.
    reason: source_ambiguity
lexical_decisions:
- source_word: Μετʼ οὐ πολὺν ... χρόνον
  choice: вскоре после этого
  rationale: Греческое выражение буквально означает «по прошествии недолгого времени». Выбранный вариант естественно передаёт краткость промежутка и связь с предшествующими событиями.
- source_word: ἐξαπέστειλεν
  choice: послал
  rationale: Нейтрально и точно передаёт значение «послал, отправил» без ненужного стилистического усиления.
- source_word: γέροντι Ἀθηναῖον
  choice: одного престарелого афинянина
  rationale: γέρων здесь естественнее понимать как указание на преклонный возраст, а не как название должности. «Одного» по-русски ясно обозначает неопределённое лицо.
- source_word: ἀναγκάζειν
  choice: чтобы тот принуждал
  rationale: Инфинитив обозначает цель поручения; «принуждал» сохраняет выраженную в оригинале насильственность и допускает продолжающееся действие.
- source_word: μεταβαίνειν ἀπὸ τῶν πατρίων νόμων
  choice: отступить от законов отцов
  rationale: «Отступить от» передаёт движение прочь от унаследованных норм, а «законы отцов» сохраняет отцовскую лексику πατρίων.
- source_word: τοῖς τοῦ θεοῦ νόμοις μὴ πολιτεύεσθαι
  choice: не жить по законам Божьим
  rationale: πολιτεύεσθαι может иметь общественно-гражданский оттенок, но здесь охватывает образ жизни, определяемый Божьими законами. «Жить по» ясно и естественно передаёт этот смысл.
theological_decisions:
- issue: Передача πατρίων с отцовской, а не нейтральной родовой лексикой
  choice: законы отцов
  alternative: законы предков; отеческие законы
  rationale: Оригинал использует слово с отцовской и наследственной семантикой. «Законы отцов» сохраняет эту особенность, не добавляя конфессионального толкования.
- issue: Объём значения πολιτεύεσθαι применительно к Божьим законам
  choice: жить по законам Божьим
  alternative: устраивать общественную жизнь по законам Божьим; поступать согласно законам Божьим
  rationale: Выбранный вариант не сужает значение до формальной политики, но сноска сохраняет возможный общественно-гражданский оттенок глагола.
translation_notes:
  register: 'Современный литературный русский язык с достойным повествовательным тоном. Синтаксис сделан естественным для русского: цель посылания раскрыта оборотом «чтобы тот». Формы «иудеи», «законы отцов» и «законы Божьи» сохраняют библейскую окраску без архаизации.'
