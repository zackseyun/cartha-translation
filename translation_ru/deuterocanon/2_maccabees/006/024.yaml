base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/024.yaml
  text: For it is not worthy of our age to pretend[a], so that many of the young, supposing that Eleazar at ninety years of age has changed over to foreign ways,
translation:
  language: ru
  text: Ведь в наши годы недостойно притворяться, чтобы многие молодые люди, подумав, будто девяностолетний Елеазар перешёл к чужеземному образу жизни[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к обычаям иноплеменников»; греческое слово означает принятие неиудейских обычаев и образа жизни.'
    reason: Лексическая альтернатива для ἀλλοφυλισμός и пояснение его контекстуального смысла.
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: Ведь ... недостойно
  rationale: «Ведь» естественно передаёт пояснительную силу γάρ и связывает слова Елеазара с предшествующим рассуждением.
- source_word: τῆς ἡμετέρας ἡλικίας ἄξιόν ἐστιν
  choice: в наши годы недостойно
  rationale: Оборот сохраняет нравственную оценку ἄξιον и передаёт ἡλικία как преклонный возраст и этап жизни, а не просто числовое обозначение возраста.
- source_word: ὑποκριθῆναι
  choice: притворяться
  rationale: В данном контексте глагол означает разыгрывать роль, создавая ложное впечатление внешнего согласия; современное «притворяться» ясно передаёт этот смысл.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз вводит предполагаемое последствие притворства; русское «чтобы» сохраняет направленность мысли, не превращая её в уже наступивший результат.
- source_word: πολλοὶ τῶν νέων
  choice: многие молодые люди
  rationale: Передаёт группу молодых людей естественным современным русским языком, не делая половой состав главным смыслом выражения.
- source_word: ὑπολαβόντες
  choice: подумав, будто
  rationale: Передаёт ошибочный вывод, который молодые могли бы сделать на основании поведения Елеазара.
- source_word: Ἐλεάζαρον τὸν ἐνενηκονταετῆ
  choice: девяностолетний Елеазар
  rationale: Краткая и естественная аппозиционная передача подчёркивает преклонный возраст Елеазара и силу его примера.
- source_word: μεταβεβληκέναι
  choice: перешёл
  rationale: Перфектный инфинитив обозначает предполагаемую завершившуюся перемену образа жизни или принадлежности; «перешёл» ясно выражает такую перемену.
- source_word: εἰς ἀλλοφυλισμόν
  choice: к чужеземному образу жизни
  rationale: Передаёт принятие неиудейских обычаев и идентичности без позднейшей конфессионально окрашенной терминологии.
theological_decisions:
- issue: Передача ἀλλοφυλισμός в контексте верности иудейскому образу жизни
  choice: к чужеземному образу жизни
  alternative: к обычаям иноплеменников
  rationale: Основной вариант охватывает не только отдельные обычаи, но и более широкую перемену образа жизни и общественно-религиозной принадлежности, сохраняя при этом смысловую широту греческого слова.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи старца. Синтаксис намеренно остаётся незавершённым и заканчивается запятой, поскольку стих продолжается в следующем фрагменте. Местоименное «наши» сохранено как форма достойного самоотнесения говорящего к своему возрасту.
