  text: Those who were leading him changed the goodwill they had shown him a little earlier into hostility because of the words just spoken[a], since they regarded them, as they supposed, as madness.
translation:
  language: ru
  text: Те, кто вёл его, сменили своё недавнее благожелательное отношение к нему на враждебность из-за сказанных прежде слов, которые они, как им казалось, сочли безумием.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безрассудством», «неразумием» или «отчаянной дерзостью». Греческое слово передаёт оценку сопровождавших, а не обязательно суждение самого повествователя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶνδε ἀγόντων πρὸς αὐτόν
  choice: те, кто вёл его
  rationale: Генитивная абсолютная конструкция обозначает сопровождавших Елеазара людей; «вёл» естественно передаёт сопровождение под стражей, не добавляя отсутствующих в тексте подробностей.
- source_word: τὴν μικρῷ πρότερον εὐμένειαν
  choice: проявленное незадолго до того расположение
  rationale: εὐμένεια означает благожелательность или расположение, а μικρῷ πρότερον — короткое время перед этим; причастие «проявленное» естественно уточняет отношение к Елеазару.
- source_word: δυσμένειαν
  choice: враждебность
  rationale: Слово составляет смысловой контраст с εὐμένεια и обозначает переход от расположения к неприязненному, враждебному отношению.
- source_word: διὰ τὴν τῶν προειρημένων λόγων
  choice: из-за только что сказанных слов
  rationale: Хотя переданный фрагмент имеет отмеченное незначительное текстовое или синтаксическое несоответствие, выражение ясно отсылает к словам, сказанным в непосредственно предшествующем контексте.
- source_word: ὡς αὐτοὶ ὑπελάμβανον
  choice: которые они, по собственному суждению, сочли
  rationale: Формулировка явно относит оценку к сопровождавшим, а не к повествователю; «по собственному суждению» сохраняет это дистанцирование без тяжеловесного повтора.
- source_word: ἀπόνοιαν
  choice: безумием
  rationale: В данном контексте ἀπόνοια обозначает воспринимаемую ими неразумность, безрассудство или помешательство; «безумие» передаёт силу их отрицательной оценки.
theological_decisions:
- issue: Дистанцирование повествователя от оценки сопровождавших
  choice: Оценка «безумие» прямо представлена как собственное суждение сопровождавших.
  alternative: Сформулировать так, будто сами слова объективно были безумием.
  rationale: Оборот ὡς αὐτοὶ ὑπελάμβανον приписывает эту оценку именно им и не позволяет превращать её в утверждение повествователя.
translation_notes:
  register: Современный литературный русский язык; достоинство повествовательного стиля сохранено. Формулировка доступна широкому читателю, при этом субъективность оценки сопровождавших выражена явно.
