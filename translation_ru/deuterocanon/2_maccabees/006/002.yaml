base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/002.yaml
  text: and also to defile the temple in Jerusalem and to name it for Olympian Zeus[a], and the one on Gerizim, as those who inhabited the place happened to do[b], for Zeus the protector of strangers.
translation:
  language: ru
  text: а также осквернить храм в Иерусалиме и дать ему имя Зевса Олимпийского[a], а храму на Гаризиме — имя Зевса, покровителя гостей и чужеземцев, в соответствии с тем, кем были жители этой местности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переименовать его в храм Зевса Олимпийского». Греческий глагол может означать присвоение дополнительного или нового наименования.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст сжат: буквально «как случались/были жители этой местности». Связь этого оборота с наименованием храма допускает разные оттенки понимания. Греч. «Зевс Ксениос» — Зевс как покровитель гостеприимства, гостей и чужеземцев.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: μολῦναι
  choice: осквернить
  rationale: Глагол выражает культовое и нравственное осквернение святыни; «осквернить» естественно передаёт этот смысл по-русски.
- source_word: νεὼ
  choice: храм
  rationale: В данном контексте речь идёт о храме как культовом сооружении; «храм» — ясный и привычный русский эквивалент.
- source_word: προσονομάσαι
  choice: дать ему имя
  rationale: Глагол допускает присвоение дополнительного или нового наименования. Формулировка не утверждает сверх текста, шла ли речь именно о формальном переименовании или о новом посвящении.
- source_word: Διὸς Ὀλυμπίου
  choice: Зевса Олимпийского
  rationale: Имя транслитерировано, а культовый эпитет переведён стандартной русской формой.
- source_word: Γαριζείν
  choice: Гаризиме
  rationale: Употреблена укоренившаяся в русской библейской традиции форма географического названия.
- source_word: καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες
  choice: сообразно положению живших в том месте
  rationale: Греческая фраза сжата и допускает разные способы восполнения смысла. Перевод сохраняет обстоятельственную связь между наименованием храма и положением местных жителей, не уточняя её чрезмерно.
- source_word: Διὸς ξενίου
  choice: Зевса, покровителя чужеземцев
  rationale: Эпитет ξένιος связан с гостеприимством и покровительством гостям и чужеземцам. Смысловой перевод понятнее одной транслитерации и сохраняет связь с последующим упоминанием жителей.
theological_decisions:
- issue: Передача языческих божественных титулов при описании осквернения иудейских святынь
  choice: Перевести эпитеты как «Олимпийский» и «покровитель чужеземцев»
  alternative: Транслитерировать как «Олимпиос» и «Ксениос»
  rationale: Перевод эпитетов позволяет читателю понять характер навязанного языческого посвящения, не добавляя конфессионального толкования.
- issue: Смысл оборота καθὼς ἐτύγχανον οἱ τὸν τόπον οἰκοῦντες
  choice: Передать как неопределённую связь с положением местных жителей
  alternative: 'Конкретизировать: «по просьбе жителей», «поскольку жители были чужеземцами» или «по обычаю жителей»'
  rationale: В имеющемся греческом тексте оборот эллиптичен. Основной текст сохраняет эту неопределённость, а примечание сообщает о возможных пониманиях.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. Синтаксис сохраняет зависимость инфинитивов от предыдущего стиха; повтор слова «имя» делает параллель между двумя храмами ясным. Архаизмы и конфессионально окрашенные уточнения исключены.
