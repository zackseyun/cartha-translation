base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/007.yaml
  text: And they were being led[a], under bitter compulsion, to the king’s monthly birthday observance for the sacrificial meal; and when a festival of Dionysus came, they were being forced, wearing ivy wreaths[b], to join the procession in honor of Dionysus.
translation:
  language: ru
  text: Их с мучительным принуждением водили на ежемесячное празднование дня рождения царя, чтобы они участвовали в жертвенной трапезе[a]. Когда же наступал праздник Диониса, их заставляли участвовать в шествии в честь Диониса, в венках из плюща[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «для вкушения жертвенных внутренностей (или частей жертвы)». Греческое слово указывает на участие в жертвенном обряде через вкушение принесённых в жертву частей.'
    reason: lexical_alternative
  - marker: b
    text: Буквально сказано «имея плющ». Плющ был связан с почитанием Диониса; вероятно, участники шествия носили венки или гирлянды из плюща.
    reason: cultural_note
lexical_decisions:
- source_word: ἤγον
  choice: их водили
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие; неопределённо-личная конструкция сохраняет отсутствие названного деятеля.
- source_word: μετὰ πικρᾶς ἀνάγκης
  choice: с мучительным принуждением
  rationale: «Мучительным» передаёт переживаемую горечь и тяжесть πικρᾶς, а «принуждение» ясно выражает насилие, подразумеваемое ἀνάγκη.
- source_word: εἰς τὴν κατὰ μῆνα τοῦ βασιλέως γενέθλιον ἡμέραν
  choice: на ежемесячное празднование дня рождения царя
  rationale: κατὰ μῆνα указывает на ежемесячную повторяемость, а γενέθλιον ἡμέραν — на установленное празднование царского дня рождения.
- source_word: ἐπὶ σπλαγχνισμόν
  choice: чтобы они участвовали в жертвенной трапезе
  rationale: В данном обрядовом контексте слово обозначает вкушение внутренностей или иных частей жертвы. Формулировка основного текста ясно передаёт насильственное участие в жертвенном обряде, а буквальная конкретика сохранена в примечании.
- source_word: Διονυσίων ἑορτῆς
  choice: праздник Диониса
  rationale: Прозрачное русское обозначение дионисийского праздника без неоправданного отождествления с конкретной разновидностью Дионисий.
- source_word: κισσοὺς ἔχοντες
  choice: увенчавшись плющом
  rationale: Буквально выражение означает «имея плющ»; в дионисийском шествии плющ обычно носили как венок или гирлянду. Выбранный вариант естественен по-русски, а элемент вероятной культурной экспликации отмечен сноской.
- source_word: πομπεύειν
  choice: идти в шествии
  rationale: Глагол обозначает участие в ритуальной процессии; вариант сохраняет церемониальный смысл и звучит естественно.
- source_word: τῷ Διονύσῳ
  choice: в честь Диониса
  rationale: Дательный падеж выражает посвящённость шествия Дионису; русская формулировка ясно передаёт культовую направленность.
theological_decisions:
- issue: Степень буквальности при передаче принудительного участия в языческой жертвенной трапезе
  choice: «участвовали в жертвенной трапезе» в основном тексте
  alternative: «вкушали жертвенные внутренности (или части жертвы)»
  rationale: Основной вариант сохраняет религиозно-обрядовый смысл и остаётся понятным современному читателю; более узкое лексическое значение вынесено в сноску, чтобы не скрывать конкретику греческого слова и не представлять её как единственно возможную.
translation_notes:
  register: Современный литературный русский язык, понятный широкому кругу читателей. Тон сдержанный и повествовательный; сохранены повторяемость принуждения, культовый характер обоих обрядов и неопределённость относительно носителей плюща там, где греческий текст не называет венки прямо.
