translation:
  language: ru
  text: чтобы, когда наши грехи достигнут предела, Он впоследствии не покарал нас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда наши грехи дойдут до конца»; вероятный смысл — когда они достигнут своего предела или полной меры.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: чтобы… не
  rationale: Передаёт цель, выраженную ἵνα, и отрицание μὴ; такая конструкция естественна для современного русского языка и связывает стих с предшествующим контекстом.
- source_word: πρὸς τέλος ἀφικομένων
  choice: достигнут предела
  rationale: Оборот обозначает достижение конечной границы или полноты; «достигнут предела» сохраняет образ предела и не уточняет сверх греческого текста, идёт ли речь о мере или завершении.
- source_word: ἡμῶν τῶν ἁμαρτιῶν
  choice: наши грехи
  rationale: Естественно передаёт притяжательное значение; в греческом выражение входит в родительный самостоятельный оборот.
- source_word: ὕστερον
  choice: впоследствии
  rationale: Ясно передаёт временное значение и контраст с наказанием в настоящее время.
- source_word: ἐκδικά
  choice: стал карать нас
  rationale: Передаёт судебно-возмездительное значение глагола, но звучит естественнее и достойнее в современном русском, чем буквальное «мстить нам».
theological_decisions:
- issue: Подлежащее при ἐκδικά не выражено в греческом тексте и определяется из ближайшего контекста.
  choice: Он
  alternative: Господь
  rationale: Местоимение необходимо для естественного русского предложения и сохраняет лаконичность греческого текста, не вводя прямо имя, отсутствующее в данном стихе.
- issue: Образ завершения грехов
  choice: грехи достигнут предела
  alternative: грехи достигнут полной меры
  rationale: «Предела» ближе к πρὸς τέλος и сохраняет возможную смысловую напряжённость между достижением конца и наполнением меры, не фиксируя только количественное понимание.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и сдержанный. Заглавное «Он» указывает на Господа из непосредственного контекста, хотя подлежащее в самом греческом предложении не названо.
