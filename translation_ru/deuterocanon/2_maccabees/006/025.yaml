  text: and they too[a], because of my hypocrisy and because of this brief and momentary life, might be led astray because of me[c][b], and I would acquire hatred and a stain upon my old age.
translation:
  language: ru
  text: и они из-за моего притворства[a] и из-за краткой и мимолётной жизни[b] по моей вине собьются с пути, а я навлеку на себя отвращение[c] и запятнаю свою старость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лицемерия»; греческое слово означает притворное поведение, способное ввести наблюдающих в заблуждение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из-за краткого и мгновенного жития». Этот оборот может подразумевать недолгое продолжение земной жизни как повод для притворства.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «омерзение»; речь о том, что он стал бы предметом сильного общественного отвращения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόκρισιν
  choice: притворства
  rationale: Греческое слово обозначает разыгрывание роли, притворное поведение. В контексте речь о мнимом соблюдении царского приказа, которое обмануло бы наблюдавших; «притворство» передаёт это точнее и естественнее современного конфессионально нагруженного «лицемерия».
- source_word: μικρὸν καὶ ἀκαριαῖον ζῆν
  choice: ради краткой и мимолётной жизни
  rationale: Субстантивированный инфинитив ζῆν означает здесь продолжение жизни, а прилагательные подчёркивают её краткость и быстротечность. «Ради» естественно передаёт причинно-целевой смысл διά в данном контексте.
- source_word: πλανηθῶσιν
  choice: собьются с пути
  rationale: Пассивный аорист конъюнктива допускает оттенки «будут введены в заблуждение» и «собьются с пути». Выбранная формулировка сохраняет как обман, так и нравственное заблуждение.
- source_word: μύσος
  choice: отвращение
  rationale: Слово выражает омерзение или отвращение, а не просто неприязнь. «Навлеку на себя отвращение» показывает, что Елеазар станет объектом общественного отвращения.
- source_word: κηλῖδα
  choice: запятнаю
  rationale: Греческий образ пятна на старости естественно передаётся русским глагольным оборотом «запятнаю свою старость», который сохраняет метафору и избегает тяжеловесности.
- source_word: κατακτήσωμαι
  choice: навлеку на себя … и запятнаю
  rationale: Средний залог указывает на то, что говорящий сам приобретёт или навлечёт на себя позорные последствия. В русском это естественно выражено двумя согласованными сказуемыми.
theological_decisions:
- issue: Нравственный смысл ὑπόκρισις в контексте мученичества
  choice: «притворство» как обманчивое внешнее поведение
  alternative: «лицемерие»
  rationale: Текст осуждает ложный пример, способный увести других с верного пути. «Притворство» сохраняет серьёзность поступка, не привнося более узкого позднейшего смысла религиозного лицемерия.
- issue: Смысл заключительной части
  choice: Сам Елеазар навлечёт на себя отвращение и запятнает свою старость
  alternative: «приобрету ненависть и пятно старости»
  rationale: Так передаётся рефлексивный оттенок среднего залога и сохраняется мысль о бесчестье, которое стало бы следствием его собственного компромисса, без добавления доктринальных категорий.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис сделан естественным для русского, при этом сохранены причинная связь, нравственная напряжённость и метафора пятна на старости.
