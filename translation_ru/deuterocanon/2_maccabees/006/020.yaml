  yaml_path: translation/deuterocanon/2_maccabees/006/020.yaml
  text: But after spitting it out[a], he came forward in the manner required for those who choose to resist things that it is not lawful to taste, even for the sake of one’s attachment to life.
translation:
  language: ru
  text: Но, выплюнув это, он выступил вперёд, как надлежит поступать тем, кто стойко противится[a] тому, чего не дозволено вкушать даже из привязанности к жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий оборот сжато соединяет стойкость в испытании и противодействие запретному; возможно также: «тем, кто стойко держится, противясь тому, чего не дозволено вкушать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προπτύσας
  choice: выплюнув это
  rationale: Аористное причастие обозначает предшествующее действие — удаление изо рта предложенной пищи. Местоимение «это» естественно передаёт подразумеваемый объект, ясный из контекста.
- source_word: καθʼ ὃν ἔδει τρόπον
  choice: как и подобало
  rationale: Передаёт нормативную и нравственную силу ἔδει без тяжеловесного буквального оборота «каким образом надлежало».
- source_word: προσέρχεσθαι
  choice: выступил вперёд
  rationale: В повествовательном контексте инфинитив описывает решительное приближение Елеазара к предстоящему испытанию. «Выступил вперёд» сохраняет движение и добровольную решимость, не добавляя отсутствующего в стихе указания на орудие пытки.
- source_word: τοὺς ὑπομένοντας ἀμύνασθαι
  choice: тем, кто стойко отвергает
  rationale: Сочетание ὑπομένω и ἀμύνομαι соединяет стойкость под давлением с активным противодействием. Русский оборот передаёт обе стороны смысла, а сжатость и неоднозначность греческого выражения отмечены в сноске.
- source_word: ὧν οὐ θέμις γεύσασθαι
  choice: то, чего не дозволено вкушать
  rationale: «Не дозволено» сохраняет религиозно-нормативную силу θέμις, а «вкушать» точно отражает γεύσασθαι и соответствует достоинству повествования.
- source_word: διὰ τὴν πρὸς ζῆν φιλοστοργίαν
  choice: даже из привязанности к жизни
  rationale: φιλοστοργία выражает сильную, естественную привязанность; «привязанность к жизни» точнее, чем нейтральное «желание жить». «Даже» ясно передаёт уступительный смысл фразы в данном контексте.
theological_decisions:
- issue: Нормативная сила οὐ θέμις в рассказе о мученичестве за соблюдение Закона
  choice: не дозволено
  alternative: запрещено; незаконно
  rationale: Выражение указывает не на личное предпочтение, а на религиозно-нравственную недозволенность. «Не дозволено» сохраняет эту силу, не вводя более поздней конфессиональной терминологии.
- issue: Связь любви к жизни с вкушением запретной пищи
  choice: чего не дозволено вкушать даже из привязанности к жизни
  alternative: чему следует противиться из-за любви к жизни
  rationale: По смыслу привязанность к жизни могла побуждать вкусить запретную пищу ради спасения, но не оправдывала этого. Русский порядок слов выражает данный смысл, сохраняя напряжение между естественной любовью к жизни и верностью Божьему установлению.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования о мученичестве. Синтаксис сделан естественным для широкого читателя; при этом не добавлены прямо не названные в стихе мучения или орудия пытки.
