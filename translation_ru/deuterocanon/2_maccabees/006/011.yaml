lexical_decisions:
- source_word: ἕτεροι
  choice: другие
  rationale: Передаёт неопределённое противопоставление ранее упомянутой группе без добавления отсутствующего в тексте уточнения.
- source_word: πλησίον συνδρομόντες εἰς τὰ σπήλαια
  choice: собравшись в пещерах неподалёку
  rationale: συνδρομόντες обозначает совместное поспешное схождение, а πλησίον — близкое местонахождение; естественная русская формулировка сохраняет коллективность действия.
- source_word: λεληθότως ἄγειν τὴν ἑβδομάδα
  choice: чтобы тайно соблюдать неделю
  rationale: Сохраняется буквальное τὴν ἑβδομάδα «неделю» и значение тайного соблюдения; вероятный смысл «субботу» указан в примечании, поскольку σάββατον в греческом тексте не употреблено.
- source_word: μηνυθέντες τῷ Φιλίππῳ
  choice: были выданы Филиппу
  rationale: Пассивная форма указывает на донос или предательство; «выданы» естественно передаёт враждебный характер сообщения.
- source_word: συνεφλογίσθησαν
  choice: все вместе сожжены
  rationale: Передаёт совместность, выраженную приставкой συν-, не добавляя прямо не названного слова «заживо».
- source_word: διὰ τὸ εὐλαβῶς ἔχειν βοηθῆσαι αὐτοῖς
  choice: потому что из благоговения ... не решились защищать себя
  rationale: εὐλαβῶς передаёт религиозную щепетильность и благоговейную осторожность, а βοηθῆσαι αὐτοῖς в контексте естественно означает прийти на помощь самим себе, то есть защищаться.
- source_word: κατὰ δόξαν τῆς σεμνοτάτης ἡμέρας
  choice: перед достоинством того священнейшего дня
  rationale: δόξα здесь понимается как честь или достоинство, а превосходная степень σεμνοτάτης подчёркивает исключительную святость и почтенность дня.
theological_decisions:
- issue: Значение τὴν ἑβδομάδα в контексте гонения
  choice: соблюдать неделю
  alternative: соблюдать субботу
  rationale: Основной текст сохраняет прямое значение греческого слова «неделя», тогда как вероятная контекстуальная отсылка к субботе отмечена в сноске, чтобы не устранять подлинную лексическую неоднозначность.
- issue: Характер отказа погибших от действия
  choice: не решились защищать себя из благоговения перед священным днём
  alternative: не стали помогать друг другу или вообще предпринимать какие-либо действия
  rationale: Дательный αὐτοῖς при βοηθῆσαι наиболее естественно имеет возвратный смысл «помочь самим себе»; в повествовательном контексте это означает самозащиту, без дополнительных вероучительных выводов.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранена необычная формулировка «соблюдать неделю», а её вероятный смысл пояснён в сноске; синтаксис упрощён для ясности без устранения смыслового напряжения.
