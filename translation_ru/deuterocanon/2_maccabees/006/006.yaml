lexical_decisions:
- source_word: ἦν
  choice: нельзя было
  rationale: В сочетании с тремя отрицательными инфинитивами форма передаёт существовавший запрет; по-русски это естественно выражается безличной конструкцией «нельзя было».
- source_word: οὔτε … οὔτε … οὔτε
  choice: ни … ни … ни
  rationale: Тройная русская отрицательная конструкция сохраняет параллельное перечисление запрещённых действий.
- source_word: σαββατίζειν
  choice: соблюдать субботу
  rationale: Глагол означает придерживаться предписаний субботнего дня; выражение понятно и точно передаёт иудейскую религиозную практику.
- source_word: πατρίους ἑορτάς
  choice: праздники предков
  rationale: Так сохраняется значение унаследованных от предков религиозных праздников без архаичного оттенка выражения «отеческие праздники».
- source_word: διαφυλάττειν
  choice: хранить
  rationale: Глагол подчёркивает верное сохранение и соблюдение традиционных праздников; «хранить праздники» здесь звучит возвышенно, но понятно.
- source_word: ἁπλῶς
  choice: просто
  rationale: 'Наречие усиливает последнюю часть: запрещалось даже самое основное открытое признание своей принадлежности.'
- source_word: Ἰουδαῖον
  choice: иудеем
  rationale: В контексте запрета субботы и праздников речь идёт прежде всего об этнорелигиозной принадлежности, а не только о географическом происхождении.
- source_word: ὁμολογεῖν εἶναι
  choice: признавать себя
  rationale: Передаёт открытое признание собственной идентичности и не привносит более узкого позднейшего смысла вероисповедной формулы.
theological_decisions:
- issue: Значение Ἰουδαῖον в контексте гонений
  choice: иудеем
  alternative: жителем Иудеи
  rationale: Контекст подавления субботы и традиционных праздников указывает на этнорелигиозную идентичность. При этом сноска сохраняет возможный географически-этнический оттенок слова.
translation_notes:
  register: Современный литературный русский язык с краткой, ритмичной трёхчастной конструкцией. «Хранить праздники предков» сохраняет достоинство стиля и оттенок верности унаследованному обычаю.
