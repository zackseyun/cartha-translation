  text: For indeed[a], not allowing those who act impiously to go on for a long time, but immediately bringing punishments upon them, is a sign of great kindness.
translation:
  language: ru
  text: Ведь не оставлять тех, кто поступает нечестиво, надолго без наказания, а сразу подвергать их наказаниям — знак великого благодеяния[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не позволять тем, кто поступает нечестиво, долго продолжать». Глагол ἐάω может означать как «позволять», так и «оставлять в покое, не трогать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μὴ πολὺν χρόνον ἐᾶσθαι
  choice: то, что ... не дают долго продолжать
  rationale: Субстантивированный инфинитив передан как подлежащее всего высказывания. Оборот сохраняет значение «не позволять продолжать долго», не добавляя прямо не названного в греческом субъекта действия.
- source_word: τοὺς δυσσεβοῦντας
  choice: тем, кто поступает нечестиво
  rationale: Причастие обозначает людей по совершаемому ими действию; глагольная формулировка точнее статичного наименования «нечестивые».
- source_word: ἀλλʼ εὐθέως
  choice: но ... сразу
  rationale: Передаёт резкое противопоставление длительной отсрочке и незамедлительному наказанию.
- source_word: περιπίπτειν τοῖς ἐπιτιμίοις
  choice: подвергаются наказаниям
  rationale: Естественная современная передача буквального «впадать в наказания / подпадать под взыскания», сохраняющая карательный смысл без его смягчения до одного лишь наставления.
- source_word: μεγάλης εὐεργεσίας
  choice: великого благодеяния
  rationale: «Благодеяние» передаёт благотворный, благой поступок и сохраняет напряжённую мысль автора о наказании как проявлении блага, не подменяя её более узким термином «милость».
- source_word: σημεῖόν ἐστιν
  choice: знак
  rationale: Прямая и естественная передача образного значения свидетельства или указания.
theological_decisions:
- issue: Немедленное наказание представлено как благодеяние
  choice: 'Сохранить прямое утверждение: быстрое наказание — знак великого благодеяния.'
  alternative: Передать εὐεργεσία как «милость», а ἐπιτίμια как «вразумление».
  rationale: Такая замена смягчила бы карательный смысл и внесла бы более узкое богословское толкование. Перевод сохраняет парадокс и напряжение исходного текста.
- issue: Кто не позволяет нечестивым долго продолжать
  choice: Не называть Бога грамматическим субъектом, поскольку в стихе он прямо не выражен.
  alternative: «Бог не позволяет тем, кто поступает нечестиво...»
  rationale: Контекст подразумевает божественное действие, однако греческая пассивная конструкция оставляет деятеля невыраженным; перевод сохраняет эту особенность.
translation_notes:
  register: Современный литературный русский язык; синтаксис достоинственный и доступный. Безлично-пассивная формулировка сохраняет невыраженного деятеля исходного текста, а «благодеяние» — его намеренную богословскую напряжённость.
