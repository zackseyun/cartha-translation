    rationale: Вариант «Некий Елеазар… человек… — ему насильно разжимали рот и принуждали…» начинает фразу в именительном падеже, но затем заменяет названное лицо косвенным местоимением. Это возможно как разговорная тематизация, но для литературного повествования тяжеловесно и менее ясно, чем прямое «Елеазара… принуждали».
  - severity: low
    issue: Стилистика характеристики внешности
    rationale: «Весьма красивый лицом» передаёт смысл, но выражение менее естественно для современного литературного русского, чем «с необычайно красивым лицом». Усиление «необычайно» сохраняет суперлатив κάλλιστος.
