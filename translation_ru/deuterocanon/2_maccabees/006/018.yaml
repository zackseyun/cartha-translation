  yaml_path: translation/deuterocanon/2_maccabees/006/018.yaml
  text: A certain Eleazar[a], one of the leading scribes, a man already advanced in age and most handsome in appearance, was being forced, with his mouth pried open, to eat pork.
translation:
  language: ru
  text: Некоторого Елеазара — одного из виднейших книжников, человека уже преклонного возраста, с необычайно красивым лицом — принуждали есть свинину[a], насильно разжимая ему рот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свиное мясо».'
    reason: Указан более буквальный составной эквивалент греческого ὕειον κρέας.
lexical_decisions:
- source_word: Ἐλεάζαρός τις
  choice: некий Елеазар
  rationale: Имя передано в принятой русской библейской форме; неопределённое τις сохраняет повествовательное представление нового лица посредством «некий».
- source_word: τῶν πρωτευόντων γραμματέων
  choice: один из виднейших книжников
  rationale: πρωτεύω обозначает первенство или выдающееся положение, а γραμματεύς в данном иудейском контексте естественно передаётся словом «книжник».
- source_word: ἤδη προβεβηκὼς τὴν ἡλικίαν
  choice: уже преклонного возраста
  rationale: Оборот указывает на человека, далеко продвинувшегося в годах; выбран современный и достойный русского повествования эквивалент.
- source_word: τὴν πρόσοψιν τοῦ προσώπου κάλλιστος
  choice: весьма красивый лицом
  rationale: Перевод сохраняет прямую характеристику внешности и не привносит нравственного значения «благородный». Превосходная степень здесь естественно понимается как усилительная.
- source_word: ἀναχαινόμενον
  choice: ему насильно разжимали рот
  rationale: Причастие описывает физическое принуждение — раскрывание рта против воли; формулировка делает действие ясным и естественным по-русски.
- source_word: ἠναγκάζετο
  choice: принуждали
  rationale: Форма имперфекта в пассиве передаёт продолжавшееся принуждение; русская неопределённо-личная конструкция естественно сохраняет отсутствие названного деятеля.
- source_word: ὕειον κρέας
  choice: свинину
  rationale: Греческое выражение буквально обозначает мясо свиньи; «свинина» — точный и современный русский эквивалент.
theological_decisions:
- issue: Обозначение запрещённого мяса в рассказе о мученичестве
  choice: свинину
  alternative: свиное мясо
  rationale: Греческий текст называет сам вид мяса, не поясняя в этом стихе норму Закона. Перевод сохраняет эту сдержанность и не добавляет богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-мученического повествования. Лексика понятна широкому читателю; синтаксис подчёркивает переход от характеристики Елеазара к совершавшемуся над ним насилию.
