revisions:
- from: Некий Елеазар, один из виднейших книжников, человек уже преклонного возраста и весьма красивый лицом, — ему насильно разжимали рот и принуждали есть свинину[a].
  to: Некоторого Елеазара — одного из виднейших книжников, человека уже преклонного возраста, с необычайно красивым лицом — принуждали есть свинину[a], насильно разжимая ему рот.
  rationale: Перестроен синтаксис, чтобы названный Елеазар оставался прямым объектом принуждения без смены падежной перспективы. «Насильно разжимая ему рот» ясно передаёт ἀναχαινόμενον и сохраняет физическое принуждение; «необычайно красивым» отражает превосходную степень κάλλιστος без добавления моральной оценки.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:04:31Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан в целом точно: Елеазар представлен как один из выдающихся книжников, пожилой и исключительно красивый внешне; над ним совершается физическое принуждение к употреблению свинины. Однако в исходном варианте переход от именительного «Некий Елеазар… человек…» к «ему… принуждали» синтаксически тяжеловесен и ослабляет прямую связь с греческим страдательным описанием.'
  naturalness: «Весьма красивый лицом» понятно, но звучит несколько искусственно; «с необычайно красивым лицом» естественнее в современном литературном русском. Перестройка предложения с винительным объектом («Елеазара… принуждали») устраняет неудачный разрыв конструкции и сохраняет длительность насилия.
  terminology: «Елеазар», «виднейшие книжники», «свинина» выбраны удачно. «Свинина» — современный точный эквивалент ὕειον κρέας; сноска с буквальным вариантом уместна. Не следует заменять характеристику внешности словом «благородный», поскольку греческое κάλλιστος относится к красоте, а не к нравственному достоинству.
