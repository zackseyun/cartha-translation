  text: thus leaving to the young a noble example of dying willingly and bravely for the revered and holy laws. And after saying these things[a], he immediately went to the rack,
translation:
  language: ru
  text: Тем самым он оставил молодым благородный пример того, как с готовностью и мужественно умереть за почитаемые и святые законы. Сказав это, он тотчас подошёл к орудию пытки[a].
