    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς δὲ νέοις
  choice: молодым
  rationale: Субстантивированное νέοις обозначает молодых людей вообще; дательный передаёт адресата оставляемого примера без неоправданного ограничения только мужчинами.
- source_word: ὑπόδειγμα γενναῖον
  choice: благородный пример
  rationale: «Благородный» сохраняет нравственное достоинство γενναῖον и не дублирует наречие γενναίως, далее переданное как «мужественно».
- source_word: καταλελοιπὼς
  choice: оставив
  rationale: Причастие перфекта указывает на оставленный после себя, сохраняющий значение пример; русское «оставив» естественно передаёт это в контексте.
- source_word: εἰς τὸ ... ἀπευθανατίζειν
  choice: того, как ... принять смерть
  rationale: Редкий интенсивный глагол означает пойти на смерть или умереть до конца; оборот «пример того, как принять смерть» естественно выражает образец поведения, не внося идеи самоубийства.
- source_word: προθύμως καὶ γενναίως
  choice: охотно и мужественно
  rationale: «Охотно» передаёт добровольную готовность, а не восторженность; «мужественно» выражает стойкую храбрость.
- source_word: ὑπὲρ τῶν σεμνῶν καὶ ἁγίων νόμων
  choice: за почитаемые и святые законы
  rationale: ὑπέρ означает «за, ради»; «почитаемые» сохраняет оттенок достоинства и благоговейного уважения в σεμνῶν, а «святые» прямо передаёт ἁγίων.
- source_word: τοσαῦτα δὲ εἰπών
  choice: сказав это
  rationale: Краткий естественный русский переход, соответствующий смыслу греческого причастного оборота.
- source_word: ἐπὶ τὸ τύμπανον
  choice: на орудие пытки
  rationale: В данном контексте τύμπανον — приспособление для пытки, вероятно рама или колесообразное устройство; нейтральное родовое обозначение избегает ложной точности слова «дыба».
- source_word: εὐθέως ἦλθεν
  choice: тотчас взошёл
  rationale: εὐθέως передано как «тотчас»; при движении к орудию пытки «взошёл на» естественно сочетается с предлогом ἐπί и подчёркивает добровольность действия без добавления нового смысла.
theological_decisions:
- issue: Положительная оценка мученической смерти и Закона
  choice: Сохранены «охотно и мужественно», а также «почитаемые и святые законы».
  alternative: 'Ослабить оценочность: «стойко умереть за уважаемые законы».'
  rationale: Сам греческий текст прямо представляет поступок Елеазара как благородный пример, а законы — как достойные почитания и святые; перевод не должен нейтрализовать эту оценку.
- issue: Характер добровольности смерти
  choice: «Принять смерть»
  alternative: «Умереть» или «пойти на смерть».
  rationale: Формулировка передаёт готовность претерпеть навязанную мучителями смерть и не превращает текст в утверждение о самоубийстве; при этом интенсивность ἀπευθανατίζειν не сглаживается полностью.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного библейского стиля. Синтаксис сделан естественным для русского языка; редкое название орудия пытки передано функционально, а буквальный образ сохранён в сноске.
