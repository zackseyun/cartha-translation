lexical_decisions:
- source_word: μὴ προαιρουμένους
  choice: кто не решался
  rationale: Передаёт сознательное волевое решение, выраженное προαιρέομαι, не приписывая людям дополнительного мотива.
- source_word: μεταβαίνειν ἐπὶ τὰ Ἑλληνικά
  choice: перейти к греческим обычаям
  rationale: Сохраняет образ перехода и передаёт широкое значение эллинистического образа жизни и практик, а не только языка или этнической принадлежности.
- source_word: κατασφάζειν
  choice: предавать жестокой смерти
  rationale: Отражает усиленное значение глагола — насильственно убивать, истреблять, — избегая чрезмерно разговорного «резать».
- source_word: παρῆν οὖν ὁρᾶν
  choice: Так можно было видеть
  rationale: Естественно передаёт безличный оборот, указывающий на явно наблюдаемую действительность.
- source_word: τὴν ἐνεστῶσαν ταλαιπωρίαν
  choice: постигшее их бедствие
  rationale: Передаёт наличное, уже наступившее бедствие; местоимение «их» естественно связывает его с людьми в контексте, не меняя предмет высказывания.
theological_decisions:
- issue: Объём значения ἐπὶ τὰ Ἑλληνικά
  choice: переход к греческим обычаям и образу жизни
  alternative: этнически стать греками или только перейти на греческий язык
  rationale: Контекст указов Антиоха говорит о принудительном принятии эллинистических культурно-религиозных практик. Перевод не сводит выражение к языку или этничности и не добавляет прямо не названного слова «вероотступничество».
