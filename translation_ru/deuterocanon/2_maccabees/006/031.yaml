  yaml_path: translation/deuterocanon/2_maccabees/006/031.yaml
  text: So then[a], in this way he passed away, leaving behind his own death as an example of courage and a memorial of virtue[c][b], not only for the young but also for most of the nation.
translation:
  language: ru
  text: Так он и скончался, оставив после себя пример мужества и память о добродетели[a] не только молодым, но и большинству своего народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «памятование о нравственном совершенстве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετήλλαξεν
  choice: скончался
  rationale: Глагол представляет смерть возвышенно и эвфемистически; «скончался» сохраняет достоинство повествования и остаётся ясным современному читателю.
- source_word: τοῦτον τὸν τρόπον
  choice: так
  rationale: Кратко и естественно передаёт указание на образ действия, подводя итог описанному ранее.
- source_word: ὑπόδειγμα
  choice: пример
  rationale: Передаёт образец, предлагаемый для подражания, без излишней книжности.
- source_word: γενναιότητος
  choice: мужества
  rationale: В контексте добровольно принятой мучительной смерти слово обозначает благородную стойкость и храбрость; «мужество» естественно выражает основную силу термина.
- source_word: μνημόσυνον
  choice: память
  rationale: Обозначает то, что сохраняет воспоминание; сочетание «память о добродетели» звучит по-русски естественнее, чем буквальное «памятник добродетели».
- source_word: ἀρετῆς
  choice: добродетели
  rationale: Сохраняет нравственный смысл ἀρετή и возвышенный этический регистр текста.
- source_word: τοῖς νέοις
  choice: молодым
  rationale: Передаёт адресатов примера без добавления отсутствующего в греческом указания на пол.
- source_word: τοῖς πλείστοις τοῦ ἔθνους
  choice: большинству своего народа
  rationale: ἔθνος здесь означает еврейский народ; «своего» ясно связывает его с Елеазаром, не вводя конфессионального уточнения.
- source_word: τὸν ἑαυτοῦ θάνατον ... καταλιπών
  choice: оставив своей смертью
  rationale: Русская инструментальная конструкция естественно выражает, что именно его смерть стала оставленным им примером и памятованием.
theological_decisions:
- issue: Нравственная терминология в рассказе о мученичестве
  choice: Передать γενναιότης как «мужество», а ἀρετή как «добродетель».
  alternative: «благородство» и «нравственное совершенство»
  rationale: Выбранная пара сохраняет похвалу стойкости Елеазара и общий нравственный смысл, не привнося позднейших доктринальных категорий.
- issue: Возвышенное обозначение смерти
  choice: Перевести μετήλλαξεν словом «скончался».
  alternative: «умер»
  rationale: «Скончался» отражает эвфемистический и торжественный оттенок греческого глагола, не затемняя смысла.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным тоном. Порядок фразы слегка перестроен ради естественного русского синтаксиса; смысловая связь смерти с примером мужества и памятью о добродетели сохранена.
