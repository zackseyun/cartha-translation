  source_fidelity: 'Греческое τὸν ἑαυτοῦ θάνατον ... καταλιπών означает, что именно его смерть оставлена как образец и памятование. В черновике инструментальная конструкция «оставив своей смертью пример» способна означать, что он оставил пример посредством смерти, а не оставил саму смерть как пример. Остальные смысловые соответствия точны: «скончался» передаёт возвышенный эвфемизм μετήλλαξεν, «мужество» уместно для γενναιότης, а «большинству своего народа» отражает τοῖς πλείστοις τοῦ ἔθνους.'
