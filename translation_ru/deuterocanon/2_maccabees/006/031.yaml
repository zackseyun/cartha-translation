  terminology: «Мужество» и «добродетель» удачно передают нравственно-возвышенную лексику без конфессионального истолкования. «Память о добродетели» — естественное русское выражение для μνημόσυνον в данном контексте; сноска корректно отмечает более эксплицитный вариант «нравственное совершенство».
