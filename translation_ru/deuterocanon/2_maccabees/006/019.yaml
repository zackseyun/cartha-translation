lexical_decisions:
- source_word: μετʼ εὐκλείας θάνατον
  choice: славную смерть
  rationale: εὐκλεία означает добрую славу, почёт, доброе имя. В сочетании со словом «смерть» прилагательное «славную» естественно и кратко передаёт смерть, приносящую честь, не добавляя идеи внешней пышности.
- source_word: μᾶλλον ἢ
  choice: предпочтя …
  rationale: Сравнительная конструкция выражает осознанное предпочтение одного другому; русская деепричастная конструкция естественно связывает этот выбор с последующим добровольным действием.
- source_word: μετὰ μύσους βίον
  choice: осквернённой жизни
  rationale: μύσος обозначает скверну, загрязнение в нравственном или ритуальном смысле. «Осквернённая жизнь» сохраняет этот смысл и контраст со славной смертью.
- source_word: ἀναδεξάμενος
  choice: предпочтя
  rationale: Причастие означает принятие или избрание для себя. Вместе с μᾶλλον ἢ оно передаёт решительное принятие смерти как предпочтительной участи.
- source_word: αὐθαιρέτως
  choice: по своей воле
  rationale: Передаёт самостоятельность и добровольность поступка без оттенка принуждения.
- source_word: ἐπὶ τὸ τύμπανον
  choice: к орудию пытки
  rationale: В данном контексте τύμπανον — пыточное приспособление не вполне ясного устройства. Функциональный перевод понятен современному читателю и не отождествляет его без достаточных оснований с конкретной позднейшей дыбой.
- source_word: προσῆγεν
  choice: пошёл
  rationale: В сочетании с αὐθαιρέτως глагол описывает его собственное движение вперёд, а не то, что его пассивно повели.
theological_decisions:
- issue: Смысл μύσος в рассказе о мученичестве
  choice: осквернённой
  alternative: позорной; нечистой
  rationale: Выбор сохраняет нравственно-ритуальный оттенок скверны в ситуации принуждения к нарушению Закона, не ограничивая значение только общественным бесчестием.
- issue: Обозначение τύμπανον
  choice: орудие пытки
  alternative: тимпан; барабан; дыба; колесо для пыток
  rationale: Контекст ясно указывает на пытку, однако точный вид устройства спорен. Основной текст сообщает функцию, а примечание сохраняет буквальный термин и историческую неопределённость.
translation_notes:
  register: Современный литературный русский язык; изложение сдержанное и достойное. Параллель греческих оборотов с μετά передана естественным русским противопоставлением «славную смерть — осквернённой жизни». Запятая в конце сохранена, поскольку стих синтаксически продолжается далее.
