base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/012.yaml
  text: Therefore I urge those who read this book not to be disheartened because of these calamities[a], but to consider that these punishments are not for destruction[c][b], but for the discipline of our people.
translation:
  language: ru
  text: Итак, я призываю тех, кто читает эту книгу[a], не падать духом[b] из-за этих бедствий, но считать, что эти наказания предназначены не для погибели, а для исправления[c] нашего народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тех, кто встречается с этой книгой»; в данном контексте речь идёт о её читателях.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не быть сломленными».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «наставления», «воспитания». Греческое слово подразумевает исправляющее и воспитывающее воздействие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: я призываю
  rationale: Передаёт настойчивое обращение автора к читателям естественным и достойным современным русским языком.
- source_word: τοὺς ἐντυγχάνοντας τῇδε τῇ βίβλῳ
  choice: тех, кто читает эту книгу
  rationale: В сочетании с βιβλίον глагол ἐντυγχάνω обозначает обращение к письменному произведению, то есть его чтение; буквальный образ встречи с книгой сохранён в примечании.
- source_word: μὴ συντελεσθαι
  choice: не падать духом
  rationale: Контекстуально выражение указывает не на буквальное завершение, а на внутреннюю сломленность или подавленность; русский оборот естественно передаёт этот смысл.
- source_word: διὰ τὰς συμφορὰς
  choice: из-за этих бедствий
  rationale: Слово συμφοραί обозначает тяжёлые несчастья и бедствия; указательное «этих» естественно связывает их с описанными событиями.
- source_word: λογίζεσθαι
  choice: считать
  rationale: Передаёт призыв осмыслить наказания и рассматривать их в указанном далее качестве.
- source_word: τὰς τιμωρίας
  choice: эти наказания
  rationale: Прямое соответствие значению τιμωρία; «эти» связывает наказания с упомянутыми бедствиями, не изменяя смысла.
- source_word: μὴ πρὸς ὄλεθρον
  choice: не погибели
  rationale: Сохраняет целевую направленность πρὸς и контраст с παιδεία; «погибель» передаёт ὄλεθρος как окончательное разорение или уничтожение.
- source_word: ἀλλὰ πρὸς παιδείαν
  choice: а вразумлению
  rationale: «Вразумление» объединяет исправительный и наставляющий оттенки παιδεία в контексте наказания, не сводя его лишь к обучению.
- source_word: τοῦ γένους ἡμῶν
  choice: нашего народа
  rationale: Здесь γένος обозначает общность иудейского народа; этот вариант естественен по-русски и не привносит современных расовых коннотаций.
- source_word: εἶναι
  choice: служат
  rationale: В составе зависимого высказывания после λογίζεσθαι глагол связывает наказания с их направленностью; «служат» естественно выражает эту функцию без излишнего усиления намерения.
theological_decisions:
- issue: Бедствия как губительное наказание или исправительное вразумление
  choice: Наказания представлены как служащие не погибели, а вразумлению народа.
  alternative: Понимать παιδεία только как общее обучение либо считать речь исключительно описанием политических последствий.
  rationale: Явный контраст μὴ πρὸς ὄλεθρον, ἀλλὰ πρὸς παιδείαν придаёт страданию исправительную, а не уничтожающую направленность. Перевод сохраняет это утверждение, не развивая его в более широкую доктрину о природе страдания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет увещательный характер и чёткий контраст между погибелью и вразумлением; архаизмы и конфессионально окрашенная терминология избегаются.
