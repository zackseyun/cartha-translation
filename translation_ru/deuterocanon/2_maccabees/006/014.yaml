base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/014.yaml
  text: 'For he did not decide to deal with us as he does with the other nations: he waits patiently with them until they have reached the full measure of their sins[a], and then punishes them.'
translation:
  language: ru
  text: 'Ибо Владыка[a] решил не поступать с нами так, как с другими народами: Он терпеливо ждёт, пока они не достигнут полноты своих грехов, и лишь тогда наказывает их.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Повелитель», «Господин». Греческое δεσπότης подчёркивает верховную власть Бога; это не обычное слово κύριος («Господь»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναμένει
  choice: ждёт
  rationale: Глагол обозначает ожидание и отсрочку до определённого момента; здесь речь об отложенном наказании народов.
- source_word: μακροθυμῶν
  choice: с долготерпением
  rationale: Причастие характеризует ожидание Владыки как терпеливое воздержание от немедленного суда; оборот сохраняет богословски значимый оттенок μακροθυμία и естественно звучит по-русски.
- source_word: ὁ δεσπότης
  choice: Владыка
  rationale: δεσπότης означает господина, владыку или верховного повелителя. «Владыка» прямо передаёт титул и не смешивает его с обычным соответствием κύριος — «Господь».
- source_word: καταντήσαντας αὐτοὺς πρὸς ἐκπλήρωσιν ἁμαρτιῶν
  choice: они доходят до полноты грехов
  rationale: Оборот выражает достижение грехами полноты или завершения. «Доходят до полноты грехов» сохраняет образ предела, не уточняя сверх текста, является ли это мерой, числом или степенью греха.
- source_word: κολάσῃ
  choice: наказывает
  rationale: Глагол прямо обозначает наказание; настоящее время по-русски передаёт общий порядок действия, описанный греческой конструкцией.
- source_word: οὐ ... οὕτως καὶ ἐφʼ ἡμῶν ἔκρινεν εἶναι
  choice: решил, что с нами будет не так
  rationale: Сжатая греческая сравнительная конструкция отрицает применение к «нам» того же порядка, что к другим народам. Русская формулировка ясно выражает контраст, не поясняя его причины сверх данного стиха.
theological_decisions:
- issue: Различие между долготерпением к другим народам и обращением с Израилем
  choice: 'Сохранён прямой контраст: Владыка не решил обращаться с «нами» по тому же порядку, по которому Он откладывает наказание других народов до полноты их грехов.'
  alternative: 'Передать конструкцию предельно буквально: «не так и о нас определил быть», оставив синтаксический контраст менее явным.'
  rationale: Сочетание οὐ ... καθάπερ ... οὕτως καὶ ἐφʼ ἡμῶν ясно отрицает одинаковый порядок обращения, хотя не раскрывает здесь всей цели более раннего наказания Израиля. Перевод сохраняет эту напряжённость и не добавляет учения об исправительной дисциплине, прямо не высказанного в стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «С долготерпением» несколько возвышенно, но понятно в контексте и точнее простого «терпеливо». Порядок фразы перестроен ради ясного русского синтаксиса; смысловой контраст и образ полноты грехов сохранены.
