  text: so that[a], after doing this, he might be released from death[b], and because of their long-standing friendship with him might receive kindness.
translation:
  language: ru
  text: чтобы, сделав это, он избежал смерти[a] и благодаря давней дружбе с ними удостоился милости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть избежал казни; буквально: «был освобождён от смерти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «удостоился доброго отношения», «получил снисхождение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое значение союза в современном русском языке.
- source_word: τοῦτο πράξας
  choice: сделав это
  rationale: Деепричастный оборот точно и естественно передаёт предшествующее действие аористного причастия.
- source_word: ἀπολυθῇ τοῦ θανάτου
  choice: избежал смерти
  rationale: В данном повествовательно-правовом контексте выражение означает освобождение от грозящей казни; формулировка не привносит представления о посмертном спасении.
- source_word: διὰ τὴν ἀρχαίαν πρὸς αὐτοὺς φιλίαν
  choice: благодаря давней дружбе с ними
  rationale: Передаёт длительные дружеские отношения Елеазара с упомянутыми людьми и сохраняет направленность πρὸς αὐτούς без неестественной буквальности.
- source_word: τύχοι φιλανθρωπίας
  choice: удостоился милости
  rationale: τυγχάνω с родительным означает «получить, удостоиться», а φιλανθρωπία здесь — милость, доброжелательное или гуманное отношение.
theological_decisions:
- issue: Смысл освобождения от смерти
  choice: избежал смерти, то есть был избавлен от казни
  alternative: был освобождён от смерти
  rationale: Это повествовательно-правовое выражение о сохранении жизни, а не утверждение о загробном избавлении или спасении.
translation_notes:
  register: Современный литературный русский язык; ясная и достойная повествовательная формулировка. Синтаксис сохраняет цель предложения, последовательность действий и осторожную смысловую неоднозначность φιλανθρωπία.
