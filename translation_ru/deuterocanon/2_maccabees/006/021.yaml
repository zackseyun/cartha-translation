base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/021.yaml
  text: But those who had been appointed over the unlawful meal[a], because of their long-standing acquaintance with the man, took him aside privately and urged him to bring meat that it was proper for him to use, prepared by himself, and to pretend that he was eating the meats from the sacrifice that had been ordered by the king[b],
translation:
  language: ru
  text: Те же, кому было поручено беззаконное угощение[a], из сострадания к этому человеку, которого они знали с давних времён, отвели его в сторону и стали уговаривать, чтобы он принёс мясо, которое ему дозволено употреблять, приготовленное им самим, и притворился, будто ест предписанное царём жертвенное мясо[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «назначенные для беззаконного [дела]». В контексте речь идёт о принуждении есть запрещённое мясо; греческий текст также прямо упоминает их сострадание к Елеазару.'
    reason: lexical_alternative
  - marker: b
    text: То есть мясо языческого жертвоприношения, которое царь велел ему есть.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ ... πρὸς τὰ παράνομα ... τεταγμένοι
  choice: те же, кому было поручено следить за беззаконной трапезой
  rationale: Причастие τεταγμένοι обозначает назначение или поручение, а эллиптическое τὰ παράνομα в ближайшем контексте относится к принудительной трапезе с запрещённым мясом. «Следить за» естественно передаёт роль назначенных надзирателей, не отождествляя τὰ παράνομα с последующим θυσία.
- source_word: σπλαγχνισμοῦ
  choice: из сострадания
  rationale: Слово прямо выражает жалость или сострадание; в русском тексте этот мотив сохранён явно, а не растворён в упоминании давнего знакомства.
- source_word: διὰ τὴν ἐκ τῶν παλαιῶν χρόνων πρὸς τὸν ἄνδρα γνῶσιν
  choice: к этому человеку, которого они знали с давних времён
  rationale: γνῶσις здесь означает личное знакомство, а не отвлечённое знание. Придаточная конструкция звучит естественно на современном русском языке.
- source_word: ἀπολαμβάνοντες αὐτὸν κατʼ ἰδίαν ἐκάλουν
  choice: отвели его в сторону и стали уговаривать
  rationale: ἀπολαμβάνοντες ... κατʼ ἰδίαν указывает на отделение от остальных для частного разговора; ἐκάλουν в контексте вводит настойчивое предложение.
- source_word: ἐνέγκοντα κρέα
  choice: чтобы он принёс мясо
  rationale: Передаёт содержание обращения и сохраняет прямой смысл ἐνέγκοντα — принести.
- source_word: οἷς καθῆκον αὐτῷ χρᾶσθαι
  choice: которое ему дозволено употреблять
  rationale: В пищевом контексте χρᾶσθαι значит употреблять в пищу, а καθῆκον указывает на подобающее или дозволенное для него мясо. «Дозволено» ясно передаёт соответствие его религиозным нормам без добавления конфессиональной терминологии.
- source_word: διʼ αὐτοῦ παρασκευασθέντα
  choice: приготовленное им самим
  rationale: Фраза указывает, что мясо должно быть приготовлено самим Елеазаром или под его контролем, в противоположность царскому жертвенному мясу.
- source_word: ὑποκρῖναι
  choice: сделал вид
  rationale: В данном контексте глагол означает притвориться, разыграть видимость действия.
- source_word: τὰ ὑπὸ τοῦ βασιλέως τεταγμένα τῶν ἀπὸ τῆς θυσίας κρεῶν
  choice: предписанное царём мясо от жертвоприношения
  rationale: Сохранены и царское предписание, и происхождение мяса от жертвоприношения. Русское собирательное «мясо» естественно передаёт греческое множественное κρεῶν.
theological_decisions:
- issue: Конкретизация τὰ παράνομα
  choice: беззаконная трапеза
  alternative: беззаконные дела; беззаконное жертвоприношение
  rationale: Контекст говорит о принуждении есть запрещённое мясо. «Трапеза» делает подразумеваемый предмет ясным, но не смешивает τὰ παράνομα с отдельно названным далее жертвоприношением (θυσία).
- issue: Выражение мотива σπλαγχνισμοῦ
  choice: явно передать «из сострадания»
  alternative: передать мотив лишь через давнее знакомство
  rationale: Греческий текст прямо содержит понятие сострадания. Его явная передача сохраняет смысловой оттенок источника и напряжение между личной жалостью надзирателей и предлагаемым ими притворством.
- issue: Характер предложенного поступка
  choice: нейтрально передать как «сделал вид»
  alternative: добавить нравственную оценку обмана
  rationale: Стих описывает предложение притвориться, но нравственная оценка раскрывается в последующем повествовании; здесь она не добавляется переводчиком.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис сделан понятным для обычного читателя; сохранён длинный ход греческой фразы и завершающая запятая, поскольку мысль продолжается в следующем стихе. Архаизмы и конфессионально окрашенные добавления исключены.
