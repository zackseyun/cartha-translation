base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/004.yaml
  text: For the sanctuary was filled by the Gentiles with debauchery and revelry, boldly carousing with prostitutes, approaching women in the sacred precincts, and even bringing inside things that were not proper.
translation:
  language: ru
  text: 'Ибо язычники наполнили святилище распутством и разнузданными пиршествами: они бесстыдно веселились с блудницами[a], сходились с женщинами в священных местах[b] и даже вносили внутрь то, чему там не место.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с гетерами». Греческое слово обозначает женщин, содержавшихся ради сексуального общения, и в этом контексте может переводиться как «блудницы» или «куртизанки».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «сходились с женщинами», вероятно, подразумевает непристойные половые отношения на священной территории, хотя греческая формулировка менее пряма, чем «вступали в половую связь».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱερὸν
  choice: святилище
  rationale: В данном контексте слово обозначает Иерусалимский храм именно как священное пространство; «святилище» сохраняет культовый оттенок и согласуется с последующим упоминанием священных пределов и внутреннего пространства.
- source_word: ἀσωτίας
  choice: распутство
  rationale: Слово выражает нравственную распущенность и безудержность; «распутство» естественно по-русски передаёт как общий нравственный, так и присутствующий в контексте половой оттенок.
- source_word: κώμων
  choice: разнузданные пиршества
  rationale: Множественное число обозначает шумные, разгульные празднества. Определение «разнузданные» передаёт их непристойный характер, не сводя значение лишь к пьянству.
- source_word: ἐθνῶν
  choice: язычниками
  rationale: В иудейском повествовательном контексте речь идёт о неевреях, оскверняющих храм. «Язычники» — понятный традиционный русский эквивалент, хотя греческое слово буквально может означать «народы».
- source_word: θρασυνόντων μεθʼ ἑταίρων
  choice: бесстыдно веселились с блудницами
  rationale: Причастие указывает на дерзкое, бесстыдное поведение, а ἑταῖραι в эллинистическом употреблении — женщины, предоставлявшие сексуальное общество. Формулировка сохраняет связь с разгульными празднествами.
- source_word: ἐν τοῖς ἱεροῖς τερβόλων
  choice: в священных пределах
  rationale: Передаёт локальный смысл священной храмовой территории, отражённый контекстом и консультационным слоем, не уточняя архитектурное устройство дворов сверх данных текста.
- source_word: γυναιξὶ πλησιαζόντων
  choice: сходились с женщинами
  rationale: Глагол буквально означает приближаться или сходиться; в данном контексте вероятен половой смысл. Русское «сходились» сохраняет этот намёк, но не делает выражение более явным, чем греческий текст.
- source_word: τὰ μὴ καθήκοντα
  choice: то, чему там не место
  rationale: Греческая формула намеренно широка и говорит о неподобающем, не называя конкретных предметов или действий. Русская формулировка сохраняет широту и подчёркивает неуместность в святилище.
- source_word: ἔνδον εἰσφερόντων
  choice: вносили внутрь
  rationale: 'Передаёт пространственный акцент: неподобающее приносили во внутреннее священное пространство.'
theological_decisions:
- issue: Передача ἐθνῶν в рассказе об осквернении иудейского святилища
  choice: язычниками
  alternative: народами / иноплеменниками
  rationale: Выбранный вариант ясно выражает контекстуальное противопоставление неевреев священному пространству Израиля, не приписывая им более конкретной конфессиональной принадлежности.
- issue: Степень явности полового поведения в γυναιξὶ πλησιαζόντων
  choice: сходились с женщинами
  alternative: вступали с женщинами в половую связь / приближались к женщинам
  rationale: Контекст strongly подразумевает непристойную половую связь, однако сам глагол менее прям. «Сходились» позволяет сохранить одновременно этот смысловой намёк и лексическую сдержанность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис слегка перестроен после двоеточия ради ясного присоединения греческих причастных оборотов. Формулировки избегают как архаической тяжеловесности, так и разговорной грубости; неоднозначность полового намёка сохранена.
