  source_fidelity: 'Требуется исправление передачи ᾅδης: «ад» в современном русском обычно означает место посмертного наказания и потому неоправданно сужает греческое «Аид», обозначающее царство мёртвых. Также «а ещё более — согласное со… законом» синтаксически относит соответствие закону к «решению», тогда как μᾶλλον δὲ… ἀκολούθως относится к тому, как Елеазар дал свой ответ. Исправленный текст передаёт это соотношение и сохраняет все элементы греческой характеристики.'
  naturalness: Исправленный вариант сохраняет торжественный, современный литературный регистр. Прямая речь естественно передаёт λέγων с инфинитивом и яснее выражает обращённое к мучителям требование.
  terminology: «Аид» сохраняет термин ᾅδης без отождествления с геенной или адом как местом кары; пояснение дано в сноске. «Святой, Богом установленный Закон» передаёт ἁγίας καὶ θεοκτίστου νομοθεσίας. «Приобретённый им и славный образ жизни» воспроизводит оба определения ἐπικτήτου καὶ ἐπιφανοῦς πολιτείας, не сводя их к одному лишь общественному положению.
