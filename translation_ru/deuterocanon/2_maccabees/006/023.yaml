revisions:
- from: Но он принял благородное решение, достойное его лет, достоинства старости, заслуженного им почётного положения и безупречного поведения с детства, а ещё более — согласное со святым, установленным Богом законом. Он прямо заявил, чтобы его немедленно отправили в ад[a].
  to: 'Но он, приняв благородное решение, достойное его лет, высокого достоинства старости, приобретённого им и славного образа жизни и прекрасного с детства поведения, — вернее же, следуя святому, Богом установленному Закону, — прямо заявил: «Поскорее отправляйте меня в Аид[a]».'
