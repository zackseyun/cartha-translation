  yaml_path: translation/deuterocanon/2_maccabees/006/023.yaml
  text: But he[a], adopting a noble resolve worthy of his age and of the dignity of old age, and of the distinction of his acquired and honored way of life, and of the finest conduct from childhood—rather, in keeping with the holy and God-given law—declared himself plainly, saying that they should send him quickly to Hades.
translation:
  language: ru
  text: 'Но он, приняв благородное решение, достойное его лет, высокого достоинства старости, приобретённого им и славного образа жизни и прекрасного с детства поведения, — вернее же, следуя святому, Богом установленному Закону, — прямо заявил: «Поскорее отправляйте меня в Аид[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в царство мёртвых». Греч.: «в Аид».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμὸν ἀστεῖον
  choice: благородное решение
  rationale: λόγισμος обозначает обдуманное решение, а ἀστεῖος в данном нравственном контексте — его благородное и достойное качество.
- source_word: ἐπικτήτου καὶ ἐπιφανοῦς πολιτείας
  choice: заслуженного им почётного положения
  rationale: ἐπίκτητος указывает на нечто приобретённое или достигнутое, ἐπιφανής — на почётность и известность; πολιτεία здесь допускает значение общественного положения или образа жизни. Контекст перечисляет основания достоинства Елеазара, поэтому выбран естественный русский оборот, сохраняющий идею достигнутого почёта.
- source_word: ἐκ παιδὸς καλλίστης ἀναστροφῆς
  choice: безупречного поведения с детства
  rationale: ἀναστροφή означает образ жизни или поведение; καλλίστης — превосходную нравственную оценку.
- source_word: τῆς ἁγίας καὶ θεοκτίστου νομοθεσίας
  choice: со святым, установленным Богом законом
  rationale: θεόκτιστος буквально указывает на установленное или учреждённое Богом; νομοθεσία здесь означает законоположение, конкретно Божий закон.
- source_word: ἀπεφήνατο
  choice: прямо заявил
  rationale: Глагол передаёт открытое и решительное выражение собственной позиции; отдельное возвратное местоимение по-русски не требуется.
- source_word: ταχέως ... προπέμπειν εἰς τὸν ᾅδην
  choice: немедленно отправили в ад
  rationale: προπέμπειν означает отправить или препроводить, ταχέως — быстро, немедленно. ᾅδης обозначает ад как царство мёртвых, а не обязательно место окончательного наказания; это уточняется в сноске.
theological_decisions:
- issue: Передача ᾅδης
  choice: ад
  alternative: царство мёртвых
  rationale: Русское «ад» традиционно соответствует греческому ᾅδης, однако может восприниматься как место окончательного наказания. Сноска сохраняет исходное значение царства мёртвых и не снимает богословскую неоднозначность.
- issue: Передача θεοκτίστου νομοθεσίας
  choice: установленный Богом закон
  alternative: богозданное законоположение
  rationale: Выбран ясный современный оборот, сохраняющий мысль о божественном происхождении и установлении закона без искусственного калькирования.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. Длинная греческая конструкция разделена на два предложения ради ясности; риторическое усиление μᾶλλον δὲ сохранено оборотом «а ещё более».
