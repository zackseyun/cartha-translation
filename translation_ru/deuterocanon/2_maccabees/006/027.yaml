lexical_decisions:
- source_word: διόπερ
  choice: Поэтому
  rationale: Передаёт усиленное логическое следствие, связывающее решение говорящего с предшествующими словами.
- source_word: ἀνδρείως
  choice: мужественно
  rationale: Прямо передаёт наречие со значением храбрости и стойкости.
- source_word: νῦν
  choice: теперь
  rationale: Сохраняет временной акцент исходного текста без неестественного сочетания «уже теперь».
- source_word: ἀλλάξας τὸν βίον
  choice: расставаясь с жизнью
  rationale: Идиоматически передаёт эвфемистическое выражение, буквально связанное с переменой жизни, которое в контексте означает добровольное принятие смерти.
- source_word: τοῦ μὲν γήρως ἄξιος φανήσομαι
  choice: я покажу себя достойным своей старости
  rationale: Сохраняет значение явленного или доказанного достоинства и отнесённость к преклонному возрасту говорящего.
theological_decisions:
- issue: Характер добровольного принятия смерти
  choice: расставаясь с жизнью
  alternative: отдавая жизнь
  rationale: Выбранное выражение передаёт решимость принять смерть, но не привносит жертвенную терминологию, которой непосредственно нет в греческом тексте.
