  yaml_path: translation/deuterocanon/2_maccabees/006/016.yaml
  text: Therefore he never withdraws his mercy from us; but while disciplining with calamity, he does not abandon his own people.
translation:
  language: ru
  text: Поэтому Он никогда не лишает нас Своей милости, но, вразумляя бедствием, не оставляет Свой народ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διόπερ
  choice: Поэтому
  rationale: Передаёт вывод, следующий из предшествующего контекста, естественным современным русским союзом.
- source_word: οὐδέποτε
  choice: никогда
  rationale: Прямой и идиоматичный эквивалент наречия со значением полного отрицания во времени.
- source_word: τὸν ἔλεον
  choice: Своей милости
  rationale: ἔλεος означает милость или сострадание; возвратное «Своей» ясно связывает милость с подразумеваемым субъектом — Богом.
- source_word: ἀφʼ ἡμῶν ἀφίστησιν
  choice: не лишает нас
  rationale: По-русски естественно выражает удаление милости от людей, сохраняя смысл греческой конструкции ἀφίστημι с ἀπό.
- source_word: παιδεύων
  choice: вразумляя
  rationale: Передаёт исправительное воспитание через испытание, не сводя действие ни к простому обучению, ни исключительно к карательному наказанию.
- source_word: μετὰ συμφορᾶς
  choice: бедствием
  rationale: Творительный падеж естественно передаёт инструментально-сопроводительное значение μετά, а «бедствие» сохраняет серьёзность συμφορά.
- source_word: οὐκ ἐγκαταλείπει
  choice: не оставляет
  rationale: Современный и ясный эквивалент со значением не покидать и не бросать.
- source_word: τὸν ἑαυτοῦ λαόν
  choice: Свой народ
  rationale: Возвратное притяжательное местоимение сохраняет усиленную принадлежность, выраженную ἑαυτοῦ.
theological_decisions:
- issue: Передача παιδεύων как действия Бога в страдании
  choice: вразумляя
  alternative: наказывая; воспитывая
  rationale: «Вразумляя» сохраняет исправительно-воспитательный смысл и напряжение между бедствием и Божьей верностью, не усиливая односторонне идею кары.
- issue: Выражение принадлежности милости в τὸν ἔλεον
  choice: Своей милости
  alternative: милости
  rationale: Хотя в греческом стоит артикль без притяжательного местоимения, контекст однозначно указывает на Божью милость; русское «Своей» делает связь ясной и естественной.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Заглавные буквы в местоимениях, относящихся к Богу, использованы в соответствии с распространённой русской библейской традицией; синтаксис сохраняет противопоставление между исправительным бедствием и неоставлением народа.
