- source_word: ἀθεμίτοις
  choice: недозволенным
  rationale: Передаёт то, что запрещено или не допускается законом и священным установлением. Субстантивированная форма сохраняет неуточнённость греческого текста относительно конкретных предметов.
- source_word: ἐπεπλήρωτο
