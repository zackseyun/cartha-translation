base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/030.yaml
  text: But as he was about to die under the blows[a], he groaned and said, “To the Lord, who has the holy knowledge, it is clear that, though I could have been released from death, I am enduring cruel pains in my body while being scourged[b]; but in my soul I gladly suffer these things because of fear of him.”
translation:
  language: ru
  text: 'Когда же он был уже близок к смерти от ударов, то, застонав, сказал: «Господу, обладающему святым знанием, ясно, что, хотя я мог быть избавлен от смерти[a], телом я терплю жестокие муки, когда меня бичуют, но душой охотно переношу всё это из страха перед Ним[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть мог избежать казни, согласившись исполнить предъявленное ему требование.
    reason: Поясняет контекстуальный смысл выражения «быть избавленным от смерти», не подменяя им образность греческого текста.
  - marker: b
    text: 'Или: «из благоговения перед Ним». Греческое слово означает «страх», но применительно к Богу может включать благоговейный страх.'
    reason: Сохраняет лексическую и богословскую неоднозначность φόβος.
lexical_decisions:
- source_word: μέλλων ... τελευτᾷν
  choice: был уже близок к смерти
  rationale: Оборот с μέλλων и инфинитивом выражает непосредственную близость смерти; выбран естественный современный русский оборот.
- source_word: ταῖς πληγαῖς
  choice: от ударов
  rationale: Дательный указывает на средство или обстоятельство смерти; перевод сохраняет прямую причинную связь, не уточняя вид ударов сверх греческого текста.
- source_word: ἀναστενάξας
  choice: застонав
  rationale: Глагол обозначает тяжёлый слышимый вздох или стон; в сцене телесных мучений «застонав» звучит естественно и ёмко.
- source_word: Τῷ κυρίῳ τῷ τὴν ἁγίαν γνῶσιν ἔχοντι
  choice: Господу, обладающему святым знанием
  rationale: Сохранены обращение к Господу и необычное сочетание «святое знание» без истолковывающего расширения до всеведения или знания истины.
- source_word: φανερὸν ἐστὶν
  choice: ясно
  rationale: Естественно передаёт безличное утверждение «явно/очевидно».
- source_word: δυνάμενος ἀπολυθῆναι τοῦ θανάτου
  choice: хотя я мог быть избавлен от смерти
  rationale: Причастие понято уступительно по контексту; пассивная форма и образ избавления сохранены, а возможный смысл избежания казни пояснён в сноске.
- source_word: σκληρὰς ... ἀλγηδόνας
  choice: жестокие муки
  rationale: Передаёт как сильную боль, так и суровость страдания; «муки» естественнее буквального сочетания «жестокие боли».
- source_word: κατὰ σῶμα ... κατὰ ψυχὴν
  choice: телом ... душой
  rationale: Сохранена явная антитеза тела и души в краткой, естественной русской форме.
- source_word: μαστιγούμενος
  choice: под бичами
  rationale: Передаёт продолжающееся бичевание и сохраняет высокий, но понятный регистр повествования.
- source_word: ἡδέως
  choice: охотно
  rationale: В контексте мученичества обозначает добровольное, внутренне принимаемое страдание; «охотно» избегает возможного впечатления удовольствия от боли.
- source_word: διὰ τὸν αὐτοῦ φόβον
  choice: из страха перед Ним
  rationale: Сохраняет прямое значение φόβος и не снимает напряжение между страхом и благоговением.
theological_decisions:
- issue: Значение φόβος по отношению к Господу
  choice: страх перед Ним
  alternative: благоговение перед Ним
  rationale: Греческое φόβος прямо означает страх, но в библейской речи может включать благоговейное почтение. Основной текст сохраняет более сильное и неоднозначное слово, а оттенок благоговения отмечен в сноске.
- issue: Значение ψυχή в противопоставлении σῶμα
  choice: душой
  alternative: внутренне; духом
  rationale: «Душой» непосредственно сохраняет антропологическую пару «тело — душа» и не сводит ψυχή только к чувствам или настроению.
- issue: Характер возможного избавления от смерти
  choice: мог быть избавлен от смерти
  alternative: мог избежать смерти
  rationale: Основной вариант сохраняет пассивную форму ἀπολυθῆναι и образ освобождения; сноска поясняет подразумеваемую возможность избежать казни уступкой требованиям гонителей, не внося это пояснение в сам текст.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим рассказу о мученичестве. Синтаксис остаётся близким к греческой антитезе «телом — душой», но избегает тяжеловесной буквальности. Местоимение «Ним» написано с прописной буквы как ясная отсылка к Господу.
