  verdict: revise
  source_fidelity: Черновик неверно истолковывает σπλαγχνίζειν как принуждение есть внутренности жертвенных животных. В данном предложении это второй инфинитив предписанной политики по отношению к иудеям; ни дополнения о жертвенных животных, ни значения принуждения к еде в греческом тексте нет. В соответствии с контекстом и английским аудиторским следом глагол следует передать как убийство, отметив в сноске его особенно жестокую образность.
  naturalness: «Вышел указ для соседних греческих городов» понятно, но «по предложению Птолемея был издан указ, предписывавший ...» точнее передаёт официальный характер постановления и естественнее связывает адресатов с предписанием.
  terminology: «Иудеи» соответствует Ἰουδαῖοι и уместно в историческом контексте. «Греческие города», «указ» и «вести ту же политику» передают соответственно Ἑλληνίδες πόλεις, ψήφισμα и τὴν αὐτὴν ἀγωγήν без неоправданной интерпретации.
