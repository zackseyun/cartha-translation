lexical_decisions:
- source_word: ψήφισμα δὲ ἐξῆλθεν
  choice: вышел указ
  rationale: Сочетание обозначает обнародование официального постановления; «вышел указ» сохраняет греческий образ и естественно звучит по-русски.
- source_word: εἰς τὰς ἀστυγείτονας Ἑλληνίδας πόλεις
  choice: для соседних греческих городов
  rationale: Предлог εἰς указывает на адресатов указа, а ἀστυγείτονας — на города в ближайшей местности.
- source_word: Πτολεμαίου ὑποθεμένου
  choice: по предложению Птолемея
  rationale: Родительный абсолют представляет Птолемея как инициатора этой меры.
- source_word: τὴν αὐτὴν ἀγωγὴν κατὰ τῶν Ἰουδαίων ἄγειν
  choice: проводить против иудеев такую же политику
  rationale: ἀγωγή в административном контексте означает установленный образ действий или обращения, а сочетание с ἄγειν — его проведение.
- source_word: σπλαγχνίζειν
  choice: принуждать их есть внутренности жертвенных животных
  rationale: Глагол связан со σπλάγχνα, «внутренности», и в ближайшем контексте принудительного участия в языческих жертвенных трапезах вероятнее всего означает понуждение вкушать жертвенные внутренности. Необычность и возможное более жестокое понимание отмечены в сноске.
theological_decisions:
- issue: Неоднозначность σπλαγχνίζειν
  choice: принуждать их есть внутренности жертвенных животных
  alternative: жестоко убивать их / потрошить их
  rationale: Ближайший контекст (6:7) говорит о принудительном участии в жертвенной трапезе, а 6:9 отдельно упоминает убийство отказавшихся. Поэтому пищевое значение лучше соответствует ходу повествования, однако редкий и образный глагол допускает насильственное прочтение, которое сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык; официальный характер постановления передан ясно, а редкое и неоднозначное обозначение насилия не сведено без оговорки к одному толкованию.
