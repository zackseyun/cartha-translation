lexical_decisions:
- source_word: πλὴν
  choice: Впрочем
  rationale: 'Передаёт переходно-ограничительный оттенок: автор завершает отступление и возвращается к рассказу.'
- source_word: ἕως ὑπομνήσεως
  choice: достаточно как напоминания
  rationale: Эллиптический оборот буквально указывает на меру или предел сказанного — «до напоминания»; по-русски естественно передать смысл как достаточность сказанного для напоминания.
- source_word: ἡμῖν
  choice: для нас
  rationale: Сохраняет явно выраженное греческое местоимение и включает автора вместе с читателями.
- source_word: διʼ ὀλίγων
  choice: вкратце
  rationale: Устойчиво и естественно передаёт значение «немногими словами».
- source_word: ἐλευστέον ἐπὶ τὴν διήγησιν
  choice: следует … продолжить повествование
  rationale: Безличное отглагольное прилагательное выражает необходимость; сочетание означает переход или возвращение к основному рассказу.
