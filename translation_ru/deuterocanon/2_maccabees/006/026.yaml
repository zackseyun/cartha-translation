base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/006/026.yaml
  text: For even if for the present I escape the punishment from men[b][a], yet I will escape neither alive nor dead from the hands of the Almighty.
translation:
  language: ru
  text: Ведь даже если сейчас я избегну наказания от людей, то рук Вседержителя не избегну ни живым, ни умершим.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть избежать рук Вседержителя невозможно ни при жизни, ни через смерть.
    reason: Поясняет сжатое выражение «ни живым, ни умершим», не расширяя его до более подробного учения о посмертной участи.
lexical_decisions:
- source_word: εἰ γὰρ καὶ
  choice: Ведь даже если
  rationale: «Ведь» передаёт пояснительную силу γάρ, а «даже если» — уступительное сочетание εἰ…καί; выражение естественно для современного русского языка.
- source_word: ἐπὶ τοῦ παρόντος
  choice: сейчас
  rationale: 'Кратко и естественно передаёт временное ограничение: речь идёт о возможности избежать наказания лишь в настоящих обстоятельствах.'
- source_word: ἐξελοῦμαι
  choice: я избегну
  rationale: В данном контексте средняя форма означает избавление от грозящего наказания; «избегну» ясно выражает этот смысл без добавления причины избавления.
- source_word: τὴν ἐξ ἀνθρώπων τιμωρίαν
  choice: наказания от людей
  rationale: Сохраняет конструкцию с ἐξ и прямое противопоставление человеческого наказания власти Вседержителя; по-русски выражение понятно и не требует развёртывания.
- source_word: ἀλλὰ
  choice: то
  rationale: В русской уступительной конструкции «даже если…, то…» естественно обозначает резкий переход к противоположному итогу; отдельное «но» здесь было бы избыточно.
- source_word: τὰς τοῦ παντοκράτορος χεῖρας
  choice: рук Вседержителя
  rationale: Сохраняется яркий библейский образ рук как власти и силы, а παντοκράτωρ передаётся привычным и точным титулом «Вседержитель» без добавленного слова «Бог».
- source_word: οὔτε ζῶν οὔτε ἀποθανών
  choice: ни живым, ни умершим
  rationale: Сохраняет резкую симметрию греческого выражения и мысль о том, что смерть не даёт возможности уйти из-под власти Вседержителя.
- source_word: ἐκφεύξομαι
  choice: не избегну
  rationale: Точно и естественно передаёт будущее значение глагола и его управление с винительным падежом; отрицание раскрывается конструкцией «ни… ни…».
theological_decisions:
- issue: Передача παντοκράτωρ
  choice: Вседержитель
  alternative: Всемогущий
  rationale: «Вседержитель» — узнаваемый русский библейский титул, выражающий всеобъемлющую власть; он не добавляет существительного «Бог», отсутствующего в греческом тексте.
- issue: Смысл οὔτε ζῶν οὔτε ἀποθανών
  choice: ни живым, ни умершим
  alternative: ни при жизни, ни после смерти
  rationale: 'Основной текст следует образной и грамматической форме оригинала, не превращая её в развёрнутое учение о посмертном суде. Сноска поясняет лишь явное следствие слов автора: смерть не позволяет избежать власти Вседержителя.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис краток и риторически выразителен; сохранены образ «рук» и богословская напряжённость между временным избавлением от человеческого наказания и неизбежностью Божьей власти.
