  text: And the pressure of this evil was harsh and grievous for everyone[a].
translation:
  language: ru
  text: Гнёт этого зла был для всех тяжёлым и мучительным[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Наступление этого зла было для всех суровым и труднопереносимым».'
    reason: Лексическое значение ἐπίστασις допускает понимание как наступления или наложения зла, а χαλεπή и δυσχερής — как сурового и труднопереносимого.
lexical_decisions:
- source_word: χαλεπὴ
  choice: тяжёлым
  rationale: Передаёт суровость и тяжесть переживаемого бедствия, сохраняя отличие от следующего определения.
- source_word: δυσχερὴς
  choice: мучительным
  rationale: Выражает то, что трудно переносить и что причиняет глубокое страдание; в современном русском звучит естественнее буквального «труднопереносимым».
- source_word: τοῖς ὅλοις
  choice: для всех
  rationale: Передаёт всеобщий охват без излишнего уточнения, кого именно включает эта группа.
- source_word: ἡ ἐπίστασις
  choice: гнёт
  rationale: В данном контексте обозначает давящее наступление или наложение зла. «Гнёт» естественно передаёт его угнетающее воздействие, а возможный оттенок наступления отмечен в сноске.
- source_word: τῆς κακίας
  choice: этого зла
  rationale: Контекст указывает на уже описанные нечестивые притеснения, а не на зло только как отвлечённое понятие.
theological_decisions:
- issue: Контекстуальное значение κακία
  choice: конкретное зло — уже описанные притеснения и нечестивая политика
  alternative: зло вообще или личная злоба
  rationale: Повествовательный контекст говорит о насаждаемом осквернении и преследовании; указательное «этого» делает связь ясной, не вводя более узкого толкования.
- issue: Характер ἐπίστασις
  choice: угнетающий гнёт зла
  alternative: наступление или насаждение зла
  rationale: Слово допускает оттенки наступления и наложения. Основной текст передаёт переживаемое давление, а сноска сохраняет возможное понимание начала или наступления бедствия.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Пара «тяжёлым и мучительным» сохраняет два близких, но не тождественных определения греческого текста.
