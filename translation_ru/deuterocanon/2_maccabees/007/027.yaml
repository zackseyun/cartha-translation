base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/027.yaml
  text: 'But bending down to him[a], and mocking the cruel tyrant, she spoke in her native tongue as follows: “My son, have mercy on me, who carried you in the womb for nine months, nursed you for three years, raised you, brought you to this age[b], and cared for you.”'
translation:
  language: ru
  text: 'Склонившись к нему и насмехаясь над жестоким тираном, она сказала на родном языке[a]: «Сын мой, сжалься надо мной! Я девять месяцев носила тебя во чреве, три года кормила грудью, вырастила тебя, довела до нынешнего возраста и заботилась о тебе[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на языке предков»; буквально выражение указывает на родную, унаследованную от отцов речь.'
    reason: lexical_alternative
  - marker: b
    text: 'Последний греческий глагол может также означать: «содержала тебя» или «обеспечивала тебя всем необходимым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκύψασα
  choice: склонившись к нему
  rationale: Передаёт направленное к сыну физическое движение без добавления не выраженного в тексте мотива.
- source_word: χλενάσασα
  choice: насмехаясь над
  rationale: Точно выражает презрительную насмешку и открытое неповиновение матери.
- source_word: τὸν ὠμὸν τύραννον
  choice: жестоким тираном
  rationale: ὠμός здесь характеризует тирана как жестокого, без необходимости усиливать смысл словом «зверский».
- source_word: τῇ πατρίᾳ φωνῇ
  choice: на родном языке
  rationale: Естественно передаёт язык, унаследованный от предков и принадлежащий её народу; буквальная связь с отцами отмечена в сноске.
- source_word: ἐλέησόν με
  choice: сжалься надо мной
  rationale: В обращении матери к сыну это современная и эмоционально точная передача просьбы о жалости.
- source_word: τὴν ἐν γαστρὶ περιενέγκασάν σε μῆνας ἐννέα
  choice: Я девять месяцев носила тебя во чреве
  rationale: Сохраняет образ беременности и длительность, выраженные греческим текстом, в достойном русском регистре.
- source_word: θηλάσασάν σε ἔτη τρία
  choice: три года кормила грудью
  rationale: Передаёт конкретный смысл θηλάζω яснее, чем многозначное «кормила».
- source_word: ἐκθρέψασάν σε
  choice: вырастила тебя
  rationale: Естественно охватывает вскармливание и воспитание ребёнка.
- source_word: ἀγαγοῦσαν εἰς τὴν ἡλικίαν ταύτην
  choice: довела до нынешнего возраста
  rationale: Близко воспроизводит образ того, что мать привела сына к достигнутому им возрасту.
- source_word: τροφοφορήσασαν
  choice: заботилась о тебе
  rationale: Редкий глагол обозначает продолжающееся попечение и содержание; широкий русский эквивалент не вносит лишней конкретизации.
theological_decisions:
- issue: Просьба матери ἐλέησόν με
  choice: сжалься надо мной
  alternative: помилуй меня
  rationale: «Сжалься» сохраняет силу личной материнской мольбы и не придаёт ей неуместного здесь специально религиозного оттенка.
- issue: Значение τῇ πατρίᾳ φωνῇ
  choice: на родном языке
  alternative: на языке предков
  rationale: Основной текст остаётся понятным современному читателю, а смысл унаследованного от предков языка сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Прямая речь сделана эмоционально непосредственной, но без разговорной сниженности. Причастные обороты греческого оригинала частично преобразованы в естественный русский синтаксис.
