base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/025.yaml
  text: But since the young man was paying no attention at all, the king called the mother to him and urged her to become an adviser to the youth for his preservation.
translation:
  language: ru
  text: Но юноша совсем не слушал[a]. Тогда царь призвал к себе его мать и убеждал её стать советчицей юноше ради его спасения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совсем не внимал». Греческое выражение подчёркивает полный отказ прислушаться.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ради сохранения его жизни», «ради его безопасности» или «ради его избавления». Греческое слово σωτηρία имеет широкий смысл, но в ближайшем контексте речь идёт прежде всего о сохранении жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ δὲ νεανίου
  choice: Но юноша
  rationale: «Юноша» естественно и точно передаёт обозначение молодого мужчины; δέ обозначает переход и противопоставление в повествовании.
- source_word: μηδαμῶς προσέχοντος
  choice: совсем не слушал
  rationale: Оборот передаёт полное нежелание внимать сказанному; «совсем» сохраняет усиление μηδαμῶς, а «не слушал» звучит естественно по-русски.
- source_word: προσκαλεσάμενος
  choice: призвал к себе
  rationale: Передаёт вызов матери в присутствие царя и возвратный оттенок средней формы.
- source_word: παρῄνει
  choice: убеждал
  rationale: В данном контексте царь настойчиво склоняет мать повлиять на сына; несовершенный вид соответствует форме имперфекта.
- source_word: γενέσθαι ... σύμβουλον
  choice: стать советчицей
  rationale: Сохраняет конструкцию «стать советником» и явно согласуется с матерью, не добавляя содержания предполагаемого совета.
- source_word: τοῦ μειρακίου
  choice: юноше
  rationale: Обозначает молодого человека. Русское «юноше» естественно в этом контексте; варианты «отроку» и «мальчику» соответственно архаизируют или чрезмерно снижают возраст.
- source_word: ἐπὶ σωτηρία
  choice: ради его спасения
  rationale: «Спасение» сохраняет широкий смысл σωτηρία — сохранение жизни, избавление или спасение; местоимение проясняет подразумеваемого носителя пользы без изменения смысла.
theological_decisions:
- issue: Значение σωτηρία в рассказе о мученичестве
  choice: ради его спасения
  alternative: ради сохранения его жизни; ради его безопасности; ради его избавления
  rationale: Непосредственно царь стремится сохранить юноше жизнь ценой уступки, однако греческое слово имеет более широкий смысл. «Спасение» сохраняет эту смысловую ёмкость, а сноска указывает на ближайший контекст, не превращая выражение в однозначно духовно-богословский термин.
translation_notes:
  register: Современный литературный русский язык с повествовательной ясностью и умеренно возвышенным библейским регистром. Синтаксис упрощён до двух предложений без утраты логической связи греческого родительного самостоятельного оборота; смысловая широта σωτηρία сохранена в тексте и пояснена в сноске.
