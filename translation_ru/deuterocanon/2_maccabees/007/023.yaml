base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/023.yaml
  text: Therefore the Creator of the world, who formed the origin of man and devised the origin of all things, will in mercy give back to you both breath and life, since you now disregard yourselves for the sake of his laws.
translation:
  language: ru
  text: Итак, Творец мира, создавший человека и устроивший происхождение всего, по милости вновь возвратит вам дыхание и жизнь, ведь теперь вы не щадите себя ради Его законов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τοῦ κόσμου κτίστης
  choice: Творец мира
  rationale: Точно и естественно передаёт обозначение Бога как создателя мира.
- source_word: ὁ πλάσας ἀνθρώπου γένεσιν
  choice: образовавший человеческий род
  rationale: Сохраняет образ πλάσσω («образовывать, придавать форму») и передаёт γένεσις как происхождение человечества, не ограничивая выражение рождением отдельного человека.
- source_word: πάντων ἐξευρὼν γένεσιν
  choice: положивший начало всему сущему
  rationale: Передаёт Бога как того, кто замыслил и устроил происхождение всего; буквальное «изыскавший происхождение» по-русски неестественно.
- source_word: τὸ πνεῦμα καὶ τὴν ζωὴν
  choice: дыхание и жизнь
  rationale: В контексте возвращения телесной жизни πνεῦμα естественно означает жизненное дыхание; различие двух существительных сохранено.
- source_word: ὑπερορᾶτε ἑαυτοὺς
  choice: не щадите себя
  rationale: Идиоматически выражает добровольное пренебрежение собственной жизнью и безопасностью, не внося идеи самопрезрения.
theological_decisions:
- issue: Характер обещанного возвращения жизни
  choice: «вновь возвратит вам дыхание и жизнь» без пояснения механизма или времени
  alternative: явно назвать это воскресением
  rationale: Контекст указывает на надежду воскресения, однако сам стих выражает её через возвращение дыхания и жизни; перевод сохраняет эту формулировку и её напряжение.
- issue: Значение πνεῦμα
  choice: дыхание
  alternative: дух
  rationale: «Дыхание» лучше соответствует паре с жизнью и контексту восстановления жизненных сил, при этом не навязывает отдельное учение о составе человека.
- issue: μετʼ ἐλέους
  choice: по милости
  alternative: милосердно
  rationale: Сохраняет существительное «милость» и подчёркивает милостивый характер Божьего действия без конфессионального уточнения.
