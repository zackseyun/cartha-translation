  source_fidelity: 'Основной смысл передан верно: Бог как Творец вновь даст мученикам дыхание и жизнь за их самоотверженность ради Его законов. Однако «положивший начало всему сущему» несколько смещает ἐξευρών («изыскавший, замысливший, устроивший») к непосредственному началу творения и не воспроизводит параллель с γένεσις («происхождение»). «Человеческий род» также менее точно, чем «человек», передаёт ἀνθρώπου в данном выражении.'
