  text: So then, let this be enough about the mother’s compassion and the extraordinary tortures.
translation:
  language: ru
  text: Итак, пусть сказанного о материнской любви[a] и необычайных истязаниях будет достаточно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «о глубоких чувствах»; то, что речь идёт о чувствах матери, ясно из контекста.'
    reason: Уточняет, что определение «материнской» подразумевается контекстом, но отсутствует в самом греческом выражении, сохраняя его лексическую широту.
lexical_decisions:
- source_word: τὰ ... περὶ τοὺς σπλαγχνισμούς
  choice: о материнской любви
  rationale: σπλαγχνισμοί обозначает глубокие внутренние чувства, сердечную привязанность или сострадание. Хотя слово «материнской» прямо в этой фразе не выражено, ближайший контекст однозначно указывает на чувства матери; «материнская любовь» естественно передаёт их силу и не сводит их лишь к жалости.
- source_word: τὰς ὑπερβαλλούσας αἰκίας
  choice: необычайных истязаниях
  rationale: αἰκία означает жестокое обращение, надругательство или истязание, а ὑπερβαλλούσας указывает на крайнюю, превосходящую обычную меру степень. В контексте описанных казней «необычайные истязания» точно и естественно передаёт конкретное насилие.
- source_word: ἐπὶ τοσούτου δεδηλώσθω
  choice: пусть сказанного ... будет достаточно
  rationale: 'Сочетание выражает формулу завершения повествования: буквально — «пусть будет изложено до этой степени». Русская формула «пусть сказанного будет достаточно» сохраняет значение ограничения и риторически завершает рассказ.'
- source_word: μὲν οὖν
  choice: итак
  rationale: В данном заключительном предложении частицы подводят итог предыдущему рассказу; «итак» естественно выполняет эту функцию по-русски.
