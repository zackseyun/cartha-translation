  text: But if our living Lord has become angry for a little while for the sake of rebuke and discipline[b][a], he will again be reconciled with his own servants.
translation:
  language: ru
  text: Но если наш живой Господь ненадолго разгневался ради вразумления и наказания, то Он снова примирится со Своими рабами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то Он снова окажет милость Своим слугам». Греческий глагол может подчёркивать прекращение гнева и восстановление благоволения; δοῦλοι в зависимости от контекста означает «рабов» или «слуг».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: но если
  rationale: Передаёт условный переход и лёгкое противопоставление предшествующему контексту.
- source_word: χάριν ἐπιπλήξεως καὶ παιδίας
  choice: ради вразумления и наставления
  rationale: χάριν выражает цель или основание; «вразумление» передаёт порицательно-исправительный смысл ἐπίπληξις, а «наставление» — воспитательный диапазон παιδία, не сводя его лишь к наказанию.
- source_word: ὁ ζῶν κύριος ἡμῶν
  choice: живой Господь наш
  rationale: Сохраняет определение ζῶν, принадлежность ἡμῶν и достоинственный библейский порядок слов.
- source_word: βραχέως ἐπωργίσται
  choice: ненадолго разгневался
  rationale: «Ненадолго» передаёт краткость состояния, а совершенная форма «разгневался» естественно выражает результативность греческого перфекта.
- source_word: καὶ πάλιν καταλλαγήσεται
  choice: то Он снова примирится
  rationale: «Снова» отмечает восстановление отношений после гнева; «примирится» сохраняет медиально-пассивную и реляционную неоднозначность глагола.
- source_word: τοῖς ἑαυτοῦ δούλοις
  choice: со Своими рабами
  rationale: «Рабы» прямо передаёт δοῦλοι и подчёркивает принадлежность Господу; возвратное ἑαυτοῦ передано местоимением «Своими».
theological_decisions:
- issue: Значение καταλλαγήσεται в отношении Бога к людям
  choice: Он снова примирится со Своими рабами
  alternative: Он снова умилостивится к Своим рабам
  rationale: Основной вариант сохраняет образ восстановления отношений, не уточняя его механизма; примечание отмечает возможный акцент на прекращении гнева и возвращении благоволения.
- issue: Передача δοῦλοι при κύριος
  choice: рабы
  alternative: слуги
  rationale: «Рабы» точнее выражает принадлежность господину и сохраняет силу исходного слова, тогда как «слуги» является более мягким контекстуальным вариантом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «Господь наш» сохраняет достоинство фразы, оставаясь понятной; прописные буквы в местоимениях относятся к принятому русскому религиозному регистру.
