  text: Тогда царь пришёл в ярость и приказал раскалить сковороды и котлы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильно нагреть на огне»; греческий глагол означает интенсивное нагревание огнём, возможно докрасна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκθύμως
  choice: в ярость
  rationale: В сочетании с γενόμενος передаёт сильный, вспыхнувший гнев; русское выражение «пришёл в ярость» естественно и сохраняет интенсивность.
- source_word: γενόμενος
  choice: пришёл
  rationale: Причастие имеет значение перехода в состояние; вместе с «в ярость» естественно передаётся как «пришёл в ярость».
- source_word: ὁ βασιλεὺς
  choice: царь
  rationale: Прямой и традиционный русский эквивалент титула без неоправданного уточнения политического статуса.
- source_word: προσέταξεν
  choice: приказал
  rationale: Точно передаёт властное распоряжение и естественно звучит в современном русском повествовании.
- source_word: τήγανα
  choice: сковороды
  rationale: Обычный современный эквивалент для металлических сосудов, предназначенных для жарки; подходит к контексту орудий пытки.
- source_word: λέβητας
  choice: котлы
  rationale: Передаёт крупные металлические сосуды; звучит естественнее и современнее, чем более специальное или архаическое обозначение.
- source_word: ἐκπυροῦν
  choice: раскалить
  rationale: Глагол обозначает сильное нагревание огнём. «Раскалить» сохраняет интенсивность лучше нейтрального «нагреть», не обязательно утверждая буквально красное каление.
