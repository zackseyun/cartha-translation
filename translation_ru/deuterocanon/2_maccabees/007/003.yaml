  source_fidelity: «Тогда царь пришёл в ярость» точно передаёт Ἐκθύμως δὲ γενόμενος, включая переход к состоянию сильного гнева. «Приказал» адекватно передаёт προσέταξεν. «Сковороды и котлы» соответствует τήγανα καὶ λέβητας. «Раскалить» естественно передаёт ἐκπυροῦν как сильное нагревание огнём, не вводя лишних деталей о способе применения сосудов.
