base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/009.yaml
  text: And as he was at his last breath[a], he said, “You, accursed wretch, release us from this present life, but the King of the world will raise us up, who have died for his laws[b], into an everlasting renewal of life.”
translation:
  language: ru
  text: 'Когда же он, испуская последний вздох, сказал: «Ты, проклятый негодяй[a], лишаешь нас нынешней жизни, но Царь мира воскресит нас, умерших за Его законы, к вечному возрождению жизни[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое ἀλάστωρ — резкое оскорбление; возможны также переводы: «проклятый», «проклятый человек» или «мерзавец».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к вечному оживлению жизни»; редкое греческое слово означает оживание или возвращение к жизни. Возможный перевод: «к вечному воскресению к жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐσχάτῃ ... πνοῇ γενόμενος
  choice: когда же он был уже при последнем издыхании
  rationale: Передаёт буквальный образ последнего дыхания и временную функцию причастия γενόμενος; оборот достоинственный и понятный в современном русском языке.
- source_word: ἀλάστωρ
  choice: проклятый негодяй
  rationale: Сохраняет силу прямого оскорбления и оттенок проклятости или крайней порочности, не вводя специального мифологического значения «мститель».
- source_word: ἐκ τοῦ παρόντος ... ζῆν ἀπολύεις
  choice: лишаешь нас нынешней жизни
  rationale: Естественно выражает прекращение земной жизни. Хотя ἀπολύω буквально означает «отпускать, освобождать», в данном контексте речь идёт о насильственном лишении жизни; противопоставление будущему оживлению сохраняется.
- source_word: ὁ τοῦ κόσμου βασιλεὺς
  choice: Царь мира
  rationale: Прямо передаёт титул и сохраняет контраст между земным правителем и верховным Царём всего мира.
- source_word: ἀποθανόντας ἡμᾶς ὑπὲρ τῶν αὐτοῦ νόμων
  choice: нас, умерших за Его законы
  rationale: Причастие передано результативно, а ὑπέρ — кратким русским «за», выражающим смерть ради верности Божьим законам.
- source_word: ἀναστήσει
  choice: воскресит
  rationale: В контексте смерти и последующего возвращения к жизни глагол ясно обозначает воскресение; русское «воскресит» естественно и точно.
- source_word: εἰς αἰώνιον ἀναβίωσιν ζωῆς
  choice: для вечного возвращения к жизни
  rationale: Редкое ἀναβίωσις обозначает оживание или возвращение к жизни. Формулировка сохраняет отличие этого существительного от обычной терминологии воскресения и передаёт αἰώνιον как «вечное».
theological_decisions:
- issue: Воскресение мучеников после смерти за Божьи законы
  choice: «Царь мира воскресит нас… для вечного возвращения к жизни»
  alternative: «Царь мира поднимет нас… к вечному оживлению жизни» или «к вечному воскресению для жизни»
  rationale: Греческий текст сочетает обычный воскресительный глагол ἀναστήσει с редким выражением ἀναβίωσις ζωῆς. Перевод сохраняет оба элемента и не сводит их к одной позднейшей догматической формуле.
translation_notes:
  register: Современный литературный русский с торжественным библейским оттенком. Синтаксис слегка возвышенный, но доступный; местоимение «Его» написано с прописной буквы по устойчивой русской религиозно-издательской норме.
