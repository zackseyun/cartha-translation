base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/005.yaml
  text: 'And when he had become useless to the others[a], he ordered him to be brought to the fire while still breathing and to be fried in the pan. And when the vapor from the pan had spread considerably, they encouraged one another, together with their mother, to die nobly[b], saying this:'
translation:
  language: ru
  text: 'Когда же он стал уже ни на что не годен для остальных[a], царь приказал поднести его к огню ещё дышащим и жарить на сковороде. Когда сковорода обильно испускала испарения[b], братья вместе с матерью ободряли друг друга мужественно принять смерть, говоря так:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал уже бесполезен для остальных». Греческое выражение передаёт жестокую оценку истерзанного человека как больше не пригодного для дальнейших мучений или устрашения других.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пар» или «дым». Греческое слово может обозначать пар, испарения или дымные пары; выражение указывает на обильное выделение испарений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρηστον ... τοῖς λοιποῖς γενόμενον
  choice: стал уже ни на что не годен для остальных
  rationale: Передаёт результативное состояние и сохраняет жестокий, обезличивающий взгляд мучителя; «для остальных» не устраняет возможную связь с оставшимися братьями.
- source_word: τῇ πυρᾷ προσάγειν
  choice: поднести его к огню
  rationale: Прямо передаёт движение к огню, не привнося значения погребального костра.
- source_word: ἔτινουν
  choice: ещё дышащим
  rationale: Подчёркивает, что мучение продолжали до наступления смерти; более выразительно и конкретно, чем просто «живым».
- source_word: τηγανίζειν
  choice: жарить на сковороде
  rationale: Сохраняет грубую физическую конкретность глагола, образованного от названия сковороды.
- source_word: τῆς ... ἀτμίδος ἐφʼ ἱκανὸν διδούσης τοῦ τηγάνου
  choice: от сковороды уже долго поднимались испарения
  rationale: Конструкция может указывать на значительную продолжительность или степень выделения пара; выбран естественный русский оборот, не превращающий испарения однозначно в дым.
- source_word: ἀλλήλους παρεκάλουν σὺν τῇ μητρὶ
  choice: братья вместе с матерью ободряли друг друга
  rationale: «Ободряли» передаёт взаимное укрепление перед смертью; явное «братья» восстанавливает понятный из контекста субъект.
- source_word: γενναίως τελευτᾷν
  choice: мужественно принять смерть
  rationale: Естественно по-русски передаёт как доблесть и мужество, так и факт смерти, не добавляя позднейших богословских категорий.
theological_decisions:
- issue: Нравственная характеристика смерти братьев
  choice: мужественно принять смерть
  alternative: благородно умереть
  rationale: γενναίως несёт оттенки мужества, доблести и благородства. Выбранный вариант ясно сохраняет положительную нравственную оценку, не определяя смерть через специальную доктринальную терминологию.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Жестокость сцены передана прямо, без эвфемизмов и без излишнего натуралистического усиления. Синтаксис сохраняет последовательность греческого повествования и вводит последующую прямую речь двоеточием.
