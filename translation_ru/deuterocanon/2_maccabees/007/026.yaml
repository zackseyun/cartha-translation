  text: После того как он долго уговаривал её, она согласилась убедить своего сына.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ
  choice: долгих
  rationale: Наречное винительное при παραινέσαντος указывает на продолжительность или настойчивость уговоров; по-русски это естественно передаётся выражением «после долгих уговоров».
- source_word: παραινέσαντος
  choice: уговоров
  rationale: В данном контексте речь идёт о настойчивом побуждении матери повлиять на сына; существительное «уговоры» естественно передаёт смысл греческого причастия в составе генитивной абсолютной конструкции.
- source_word: ἐπεδέξατο
  choice: согласилась
  rationale: Средняя форма означает принятие просьбы или предложения; «согласилась» точно и естественно сочетается с последующим инфинитивом.
- source_word: πεῖσειν
  choice: убедить
  rationale: Будущий инфинитив от πείθω обозначает действие, которое она взялась совершить; «убедить» является прямым современным соответствием.
- source_word: τὸν υἱόν
  choice: сына
  rationale: Определённый артикль отсылает к сыну этой женщины; в русском контексте принадлежность ясна и отдельное местоимение «своего» необязательно.
