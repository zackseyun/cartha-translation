base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/030.yaml
  text: And while she was still finishing[a], the young man said, “What are you waiting for? I do not obey the king’s command, but I obey the command of the law that was given to our fathers through Moses.”
translation:
  language: ru
  text: 'Пока она ещё не закончила говорить, юноша сказал: «Чего вы ждёте? Я не повинуюсь повелению царя, но повинуюсь повелению Закона, данного нашим отцам через Моисея».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι δὲ ταύτης καταληγούσης
  choice: Пока она ещё не закончила говорить
  rationale: 'Родительный абсолют обозначает одновременность: юноша вступает в речь, когда мать ещё завершает сказанное. Добавление «говорить» естественно восполняет подразумеваемый объект глагола καταλήγω.'
- source_word: ὁ νεανίας
  choice: юноша
  rationale: νεανίας обозначает молодого мужчину; «юноша» естественно и уместно для повествования.
- source_word: Τίνα μένετε;
  choice: Чего вы ждёте?
  rationale: Эллиптический греческий вопрос буквально допускает смысл «чего/ради чего вы ждёте?». Русское выражение естественно передаёт обращённый к исполнителям вызов без устранения краткости оригинала.
- source_word: οὐχ ὑπακούω
  choice: Я не повинуюсь
  rationale: Настоящее время выражает принципиальный отказ; «не повинуюсь» сохраняет форму и торжественный регистр.
- source_word: τοῦ προστάγματος τοῦ βασιλέως
  choice: повелению царя
  rationale: πρόσταγμα означает приказ или предписание. «Повеление» подходит к царскому распоряжению и сохраняет параллель с последующим предписанием.
- source_word: τοῦ δὲ προστάγματος ἀκούω τοῦ νόμου
  choice: но повинуюсь предписанию Закона
  rationale: ἀκούω с родительным здесь имеет практический смысл «слушаться, повиноваться». «Предписание Закона» передаёт необычную, но значимую конструкцию оригинала и её контраст с царским повелением.
- source_word: τοῦ δοθέντος τοῖς πατράσιν ἡμῶν
  choice: данного нашим отцам
  rationale: Сохраняется явно мужское πατράσιν и связанный с ним язык преемства отцов.
- source_word: διὰ Μωσῆ
  choice: через Моисея
  rationale: 'διά с родительным обозначает посредничество: Закон был дан отцам через Моисея.'
theological_decisions:
- issue: Соотношение царского повеления и предписания Закона
  choice: 'Сохранён прямой параллельный контраст: «не повинуюсь… но повинуюсь»'
  alternative: «не слушаюсь… но внимаю»
  rationale: Разные греческие глаголы ὑπακούω и ἀκούω могут передаваться разными словами, однако в данном управлении оба относятся к практическому послушанию. Одинаковый русский глагол ясно сохраняет нравственный контраст, не добавляя богословского толкования.
- issue: πατράσιν как обозначение предков
  choice: нашим отцам
  alternative: нашим предкам
  rationale: Буквально мужская форма сохранена как элемент языка наследия и заветной преемственности, без нейтрализации.
translation_notes:
  register: Современный литературный русский с достоинством мученической речи. Синтаксис сделан естественным, но сохранены краткий вызов, настоящее время принципиального отказа и параллелизм двух видов повеления.
