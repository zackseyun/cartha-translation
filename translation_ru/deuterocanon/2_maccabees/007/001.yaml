  yaml_path: translation/deuterocanon/2_maccabees/007/001.yaml
  text: It also happened that seven brothers, along with their mother, having been arrested, were being forced by the king to taste the unlawful flesh of swine, while being tortured with whips and cords.
translation:
  language: ru
  text: Случилось также, что семь братьев вместе с матерью были схвачены. Царь принуждал их вкусить запрещённого законом свиного мяса[a]; при этом их истязали бичами и ремнями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отведать запрещённого законом свиного мяса»; буквально глагол может означать «прикоснуться», но здесь речь идёт о принятии мяса в пищу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «плетями»; соответствующее греческое слово буквально связано с жилами и обозначает ремни или плети, использовавшиеся для истязаний.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνέβη δὲ καὶ
  choice: Случилось также
  rationale: Передаёт повествовательный переход и добавочное значение καὶ естественным современным русским языком.
- source_word: ἑπτὰ ἀδελφοὺς μετὰ τῆς μητρὸς
  choice: семь братьев вместе с матерью
  rationale: ἀδελφοί обозначает здесь семерых братьев; оборот с μετὰ естественно передан как совместное присутствие матери.
- source_word: συλλημφθέντας
  choice: были схвачены
  rationale: Сохраняет насильственный характер задержания, не придавая ему более узкого современного юридического смысла слова «арестованы».
- source_word: ἀναγκάζεσθαι ὑπὸ τοῦ βασιλέως
  choice: Царь принуждал их
  rationale: Активная русская конструкция ясно передаёт названного в греческом агента и продолжающееся принуждение.
- source_word: ἀπὸ τῶν ἀθεμίτων υἱείων κρεῶν
  choice: запрещённого законом свиного мяса
  rationale: ἀθέμιτος означает недозволенное или противозаконное; добавление «законом» передаёт религиозно-правовую силу выражения, не подменяя его словом «нечистое».
- source_word: ἐφάπτεσθαι
  choice: вкусить
  rationale: В пищевом контексте глагол означает прикоснуться с целью отведать или принять в пищу. «Вкусить» сохраняет эту смысловую широту и не утверждает, что они действительно поели.
- source_word: μάστιξιν καὶ νευραῖς
  choice: бичами и ремнями
  rationale: μάστιγες — бичи или плети; νευραί буквально связаны с жилами и могут обозначать сделанные из них ремни либо плети. «Ремни» понятно обозначает орудия истязания.
- source_word: αἰκιζομένους
  choice: подвергая их истязаниям
  rationale: Передаёт тяжёлое насильственное мучение, явно подразумеваемое названными орудиями.
theological_decisions:
- issue: Передача нарушения иудейских пищевых запретов
  choice: запрещённого законом свиного мяса
  alternative: нечистого свиного мяса
  rationale: В оригинале стоит ἀθέμιτος — «недозволенный, противозаконный», а не специальное слово со значением ритуальной нечистоты. Выбранный вариант сохраняет правовой и религиозный смысл без терминологической подмены.
- issue: Степень участия, выраженная ἐφάπτεσθαι
  choice: вкусить
  alternative: есть; приобщиться к
  rationale: Контекст указывает на принятие мяса в пищу, однако сам глагол допускает буквальный оттенок прикосновения. «Вкусить» передаёт пищевой смысл, не преувеличивая предполагаемый объём и не утверждая исполнение требования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Длинная греческая конструкция разделена на два предложения ради ясности; причастная связь в конце передана деепричастным оборотом, сохраняющим одновременность принуждения и истязаний.
