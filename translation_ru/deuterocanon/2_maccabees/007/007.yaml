base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/007.yaml
  text: When the first had died in this way[a], they brought the second to the mockery; and after tearing off the skin of his head with the hair, they asked[b], “Will you eat before your body is punished limb by limb?”
translation:
  language: ru
  text: 'Когда первый умер таким образом, второго вывели на поругание. Содрав кожу с его головы вместе с волосами[a], они спрашивали: «Будешь ли ты есть[b], прежде чем твоё тело будут истязать, член за членом?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кожу головы»; возможный перевод: «скальп».'
    reason: lexical_alternative
  - marker: b
    text: Речь идёт о пище, запрещённой законом предков, как видно из контекста.
    reason: cross_reference
lexical_decisions:
- source_word: Μεταλλάξαντος
  choice: умер
  rationale: В данном контексте глагол обозначает смерть первого брата после истязаний; буквальное «переменился» или нейтральное «ушёл» по-русски не передало бы смысла повествования.
- source_word: τοῦ πρώτου
  choice: первый
  rationale: Сохранена естественная для контекста эллиптическая форма греческого текста без добавления слова «брат».
- source_word: τὸν τρόπον τοῦτον
  choice: таким образом
  rationale: Передаёт отсылку к описанному ранее способу смерти первого брата.
- source_word: ἦγον ἐπὶ τὸν ἐμπαιγμόν
  choice: вывели на поругание
  rationale: ἐμπαιγμός включает насмешку, унижение и жестокое издевательство; «поругание» сохраняет возвышенно-повествовательный регистр и конкретную направленность действия.
- source_word: τὸ τῆς κεφαλῆς δέρμα σὺν ταῖς θριξὶν
  choice: кожу с головы вместе с волосами
  rationale: Формально передаёт «кожу головы» и уточнение, что её сняли вместе с волосами, не сводя выражение к одному слову «скальп».
- source_word: περισύραντες
  choice: содрав
  rationale: Передаёт насильственное снятие кожи посредством сдирания и естественно звучит в современном русском повествовании.
- source_word: ἐπηρώτων
  choice: они спрашивали
  rationale: Несовершенный вид русского глагола естественно отражает имперфект и допускает продолжающееся или повторное действие.
- source_word: Εἰ φάγεσαι
  choice: Будешь есть
  rationale: Сохраняет прямоту вопроса; предмет еды ясен из ближайшего контекста главы и потому не добавлен в основной текст.
- source_word: πρὸ τοῦ τιμωρηθῆναι
  choice: прежде чем … подвергнут мучениям
  rationale: В контексте τιμωρέω означает телесное наказание посредством истязаний; «мучения» передаёт ситуацию яснее, чем отвлечённое «наказание».
- source_word: κατὰ μέλος
  choice: часть за частью
  rationale: Передаёт распределительное значение выражения и телесный смысл μέλος, не создавая в современном русском нежелательной двусмысленности слова «член».
- source_word: τὸ σῶμα
  choice: твоё тело
  rationale: Прямой и естественный эквивалент конкретного физического значения σῶμα.
