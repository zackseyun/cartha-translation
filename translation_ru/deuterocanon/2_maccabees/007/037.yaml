  source_fidelity: 'Основной смысл передан верно: говорящий отдаёт тело и жизнь ради законов предков, молит Бога о скорой милости народу и обращается к царю с требованием признать единого Бога. Однако исходная русская конструкция «призывая Бога …, а тебя — … признать» синтаксически неясна: она может ошибочно представить царя объектом того же действия без ясного второго обращения. Редакция делает параллелизм греческого ἐπικαλούμενοι прозрачным. Множественное число греческого причастия при единственном «я» отмечено сноской, без догматического или текстологического разрешения шероховатости.'
