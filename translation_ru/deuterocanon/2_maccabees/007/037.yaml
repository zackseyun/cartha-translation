base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/037.yaml
  text: But I[a], like my brothers, give up both body and life for the laws of our fathers, calling on God quickly to become merciful to the nation, and for you, through torments and whippings[b], to confess that he alone is God.
translation:
  language: ru
  text: Я же, подобно моим братьям, отдаю и тело, и жизнь[a] за законы наших отцов, взывая[c] к Богу, чтобы Он вскоре смилостивился над народом, а к тебе — чтобы ты через пытки и бичевание признал[b], что только Он — Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово также может означать «участь» или «судьбу»; здесь оно обозначает жизнь, отдаваемую на мученическую смерть.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «открыто признал».'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте причастие «взывая» стоит во множественном числе, хотя говорящий говорит о себе в единственном. Русское деепричастие числа не выражает.
    reason: source_syntax
lexical_decisions:
- source_word: καθάπερ οἱ ἀδελφοί
  choice: подобно моим братьям
  rationale: Сохраняет прямое сравнение говорящего с уже пострадавшими братьями и естественно звучит по-русски.
- source_word: σῶμα καὶ τύχην
  choice: и тело, и жизнь
  rationale: σῶμα передано буквально, а τύχη в контексте добровольной мученической смерти обозначает отдаваемую земную жизнь, хотя буквально может означать участь или судьбу.
- source_word: προδίδωμι
  choice: отдаю
  rationale: Здесь глагол выражает добровольную отдачу тела и жизни, а не предательство.
- source_word: περὶ τῶν πατρίων νόμων
  choice: за отеческие законы
  rationale: Передаёт действие ради унаследованных от отцов законов и сохраняет семейно-традиционную окраску πατρίων.
- source_word: ἐπικαλούμενοι τὸν θεόν
  choice: призывая Бога
  rationale: Обозначает молитвенное обращение к Богу; форма множественного числа в греческом тексте синтаксически затруднительна при единственном ἐγώ, поэтому по-русски согласована с говорящим без попытки догматически устранить текстовую шероховатость.
- source_word: ἵλεων ταχὺ τῷ ἔθνει γενέσθαι
  choice: вскоре явить милость нашему народу
  rationale: Естественно передаёт просьбу, чтобы Бог быстро стал милостив к народу; «нашему» ясно указывает на народ говорящего, не меняя референта.
- source_word: μετὰ ἐτασμῶν καὶ μαστίγων
  choice: под пытками и бичами
  rationale: Передаёт мучительные испытания и телесное бичевание как обстоятельства, посредством которых царь будет приведён к признанию.
- source_word: ἐξομολογήσασθαι
  choice: признать
  rationale: В данном контексте значит открыто признать истинность последующего утверждения; «исповедать» могло бы придать фразе более узкий конфессиональный оттенок.
- source_word: διότι μόνος αὐτὸς θεὸς ἐστίν
  choice: что Он один есть Бог
  rationale: Сохраняет усилительное μόνος αὐτός, отсылку местоимения к ранее названному Богу и торжественную исключительность утверждения.
theological_decisions:
- issue: Исключительность Бога в заключительной фразе
  choice: что Он один есть Бог
  alternative: что Он — единственный Бог
  rationale: 'Выбранная формулировка ближе сохраняет греческое ударение на αὐτός: именно Он, и никто иной, есть Бог, не расширяя утверждение толкованием.'
- issue: Характер обращения мученика к Богу
  choice: призывая Бога вскоре явить милость нашему народу
  alternative: моля Бога вскоре стать милостивым к народу
  rationale: «Призывая» непосредственно отражает ἐπικαλέομαι, а «явить милость» естественно передаёт ἵλεων γενέσθαι, не уточняя способ будущего помилования.
- issue: Отеческий характер законов
  choice: за отеческие законы
  alternative: за законы наших предков
  rationale: «Отеческие» сохраняет выраженную в πατρίων связь с отцами и унаследованной ими традицией, не превращая её лишь в обобщённое культурное наследие.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Конструкция «Он один есть Бог» намеренно несколько возвышенна и сохраняет акцент греческого текста. Все местоимения и дополнения, необходимые русскому синтаксису, добавлены без конфессионального истолкования.
