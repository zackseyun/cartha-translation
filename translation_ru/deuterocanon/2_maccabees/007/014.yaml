base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/014.yaml
  text: 'And when he was about to die[a], he said this: “It is preferable, when dying at the hands of men, to await the hopes given by God—that one will be raised again by him[b]. But for you there will be no resurrection to life.”'
translation:
  language: ru
  text: 'Когда он уже умирал[a], он сказал: «Лучше, умирая от рук людей, надеяться, что Бог вновь воскресит нас. Для тебя же не будет воскресения к жизни[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда он был уже на пороге смерти».'
    reason: lexical_alternative
  - marker: b
    text: Слова «не будет воскресения к жизни» могут означать, что гонитель не разделит воскресения, ведущего к жизни, а не обязательно то, что он вообще никогда не воскреснет.
    reason: alternative_reading
lexical_decisions:
- source_word: γενόμενος πρὸς τῷ τελευτᾷν
  choice: оказавшись при смерти
  rationale: Оборот πρὸς τῷ с инфинитивом указывает на близость смерти; русское выражение естественно передаёт состояние на пороге смерти.
- source_word: οὕτως ἔφη
  choice: он сказал
  rationale: В русском введении прямой речи указательное значение οὕτως естественно выражается последующим двоеточием и не требует буквального «так».
- source_word: Αἱρετόν
  choice: Лучше
  rationale: Кратко и естественно передаёт значение «предпочтительно, достойно выбора» без книжной тяжеловесности.
- source_word: μεταλλάσσοντας ἀπὸ ἀνθρώπων
  choice: умирая от рук людей
  rationale: В данном контексте μεταλλάσσω означает уход из жизни, а ἀπὸ ἀνθρώπων указывает на человеческих виновников смерти.
- source_word: τὰς ὑπὸ τοῦ θεοῦ προσδοκᾷν ἐλπίδας
  choice: ожидать исполнения надежд, дарованных Богом
  rationale: Формулировка сохраняет множественное число ἐλπίδας и источник надежд в Боге; слово «исполнения» делает сочетание «ожидать надежд» естественным по-русски, не добавляя идеи явного обещания.
- source_word: πάλιν ἀναστήσεσθαι ὑπʼ αὐτοῦ
  choice: что Он снова воскресит нас
  rationale: Греческий пассив с указанием действующего лица передан естественной русской активной конструкцией; «нас» раскрывает подразумеваемый общий субъект мучеников.
- source_word: ἀνάστασις εἰς ζωὴν
  choice: воскресение к жизни
  rationale: Формальная передача сохраняет богословски значимое направление εἰς ζωὴν и не превращает высказывание в безусловное отрицание всякого воскресения.
theological_decisions:
- issue: Надежда мученика на воскресение и отказ гонителю в воскресении к жизни
  choice: Бог снова воскресит мучеников, тогда как гонителю не будет воскресения к жизни.
  alternative: Гонитель вообще никогда не воскреснет.
  rationale: Оборот εἰς ζωὴν определяет характер или итог воскресения. Его необходимо сохранить, оставляя открытой возможность, что речь идёт об отказе в блаженном воскресении, а не непременно в любом воскресении.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Прямая речь звучит твёрдо и естественно; сохранены повторное воскресение по Божьему действию и неоднозначность выражения «воскресение к жизни».
