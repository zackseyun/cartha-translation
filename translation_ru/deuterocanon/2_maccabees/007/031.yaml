base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/031.yaml
  text: But you[a], having become the inventor of every evil against the Hebrews, will certainly not escape the hands of God.
translation:
  language: ru
  text: Но ты, став зачинщиком[a] всякого зла против евреев, никак не избежишь рук Божьих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изобретателем»; возможно также: «творцом».'
    reason: Греческое εὑρετής может обозначать того, кто изобретает, замышляет или становится автором чего-либо.
lexical_decisions:
- source_word: σὺ δὲ
  choice: Но ты
  rationale: δέ обозначает контрастный переход к прямому обличительному обращению; «Но ты» естественно передаёт этот поворот.
- source_word: πάσης κακίας
  choice: всякого зла
  rationale: 'κακία имеет широкий смысл: зло, порочность, злодеяние. Формулировка «всякого зла» сохраняет всеохватность обвинения и не сужает его до отдельных преступлений.'
- source_word: εὑρετὴς γενόμενος
  choice: став зачинщиком
  rationale: εὑρετής называет того, кто нечто находит, измышляет или вводит; в данном обвинительном контексте «зачинщик» естественно выражает активное порождение злых замыслов, а «став» непосредственно передаёт γενόμενος.
- source_word: εἰς τοὺς Ἑβραίους
  choice: против евреев
  rationale: В контексте враждебных действий εἰς естественно передаётся предлогом «против»; Ἑβραίους сохраняется как «евреев», без замены другим этническим обозначением.
- source_word: οὐ μὴ διαφύγῃς
  choice: никак не избежишь
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание; «никак не избежишь» передаёт его категоричность на современном русском языке.
- source_word: τὰς χεῖρας τοῦ θεοῦ
  choice: рук Божьих
  rationale: Сохранены множественное число и конкретный библейский образ Божьих рук как выражение неотвратимой власти и суда.
theological_decisions:
- issue: Антропоморфное выражение Божьего суда
  choice: рук Божьих
  alternative: власти Бога; суда Бога
  rationale: Греческий текст использует конкретный образ рук. Его сохранение удерживает библейскую образность и богословскую напряжённость, не заменяя их отвлечённым истолкованием.
- issue: Этническое обозначение Ἑβραίους
  choice: евреев
  alternative: иудеев
  rationale: Источник прямо употребляет Ἑβραίους («евреев»), поэтому это обозначение сохранено, а не заменено близким, но отличным словом «иудеи».
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Прямое обличение и усиленное отрицание переданы естественно; конкретный образ «рук Божьих» сохранён.
