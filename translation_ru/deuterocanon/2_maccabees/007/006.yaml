base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/006.yaml
  text: The Lord God is watching[a], and in truth he is being moved to compassion for us, just as Moses made clear in the song that testifies openly, saying[c][b], “And he will be moved to compassion for his servants.”
translation:
  language: ru
  text: 'Господь Бог видит и поистине проникается состраданием к нам, как ясно показал Моисей в песне, открыто свидетельствующей, сказав: «И над рабами Своими Он сжалится».[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утешается… будет утешен». Греческий глагол может иметь значения утешения, увещания или жалости; здесь контекст и цитата из песни Моисея говорят в пользу сострадания или смягчения.'
    reason: lexical_alternative
  - marker: b
    text: Ср. Второзаконие 32:36, где говорится, что Господь сжалится над Своими рабами.
    reason: cross_reference
  - marker: c
    text: 'Или: «в песне, открыто свидетельствующей против [нас]». Греческий глагол может нести противительный оттенок, но объект свидетельства в данном тексте не назван.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφορᾷ
  choice: видит
  rationale: Передаёт продолжающееся наблюдение Бога без добавления оттенка охраны, которого сам глагол здесь не требует.
- source_word: ταῖς ἀληθείαις
  choice: поистине
  rationale: Естественно передаёт наречную силу необычного дательного множественного числа.
- source_word: παρακαλεῖται
  choice: проникается состраданием
  rationale: Контекст и последующая цитата из Второзакония указывают на жалость или смягчение; русская возвратная форма сохраняет медиально-пассивный оттенок.
- source_word: κατὰ πρόσωπον ἀντιμαρτυρούσης
  choice: открыто свидетельствующей против нас
  rationale: Сохраняет как прямой, открытый характер свидетельства, так и противительный оттенок ἀντιμαρτυρούσης, связанный с песней-свидетелем.
- source_word: διεσάφησεν
  choice: ясно показал
  rationale: Естественно выражает значение разъяснения или явного указания.
- source_word: δούλοις
  choice: рабам
  rationale: Точно передаёт δοῦλοις и в современной русской библейской речи естественно обозначает полную принадлежность Богу; вариант «слугам» возможен, но слабее передаёт исходное слово.
- source_word: παρακληθήσεται
  choice: будет побуждён состраданием
  rationale: Сохраняет будущую пассивную форму и смысловую связь с παρακαλεῖται, не превращая её просто в активное «пожалеет».
theological_decisions:
- issue: Смысл παρακαλεῖται / παρακληθήσεται в цитате о Боге
  choice: проникается состраданием / будет побуждён состраданием
  alternative: утешается / будет утешен; смилостивится
  rationale: Аллюзия на Второзаконие 32:36 поддерживает смысл жалости или смягчения к Божьим рабам. При этом сохранена необычная пассивность греческой формулировки, а не дано полностью истолковывающее активное выражение.
- issue: Сила ἀντιμαρτυρούσης
  choice: свидетельствующей против нас
  alternative: свидетельствующей; прямо свидетельствующей
  rationale: Приставка ἀντι- допускает противительный смысл, соответствующий функции песни Моисея как свидетельства против народа; добавление «нас» раскрывает подразумеваемый объект в данном контексте.
- issue: Передача δούλοις
  choice: рабам
  alternative: слугам
  rationale: «Рабам» сохраняет зависимость и принадлежность, выраженные греческим δοῦλοις, не вводя конфессионально-специфического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка сохраняет повтор одного греческого глагола в настоящем и будущем времени, открытую направленность свидетельства песни против народа и более буквальное «рабы» в цитате.
