translation:
  language: ru
  text: Мать умерла последней, после сыновей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Наконец умерла мать». Греческое выражение кратко указывает на последовательность событий; дословное «последней из сыновей» по-русски могло бы ошибочно представить мать одной из сыновей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσχάτῃ
  choice: последней
  rationale: 'Дательный падеж женского рода здесь употреблён наречно и обозначает последовательность: мать умерла последней. Эта передача сохраняет краткость и формальную близость к греческому тексту.'
- source_word: τῶν υἱῶν
  choice: из всех сыновей
  rationale: υἱῶν означает именно «сыновей». Сочетание с ἐσχάτῃ допускает буквальное соотнесение «последней из сыновей», но добавление «всех» делает русскую фразу естественнее, не меняя смысла последовательности.
- source_word: ἡ μήτηρ
  choice: мать
  rationale: Определённый артикль указывает на уже известную из контекста мать. В русском языке дополнительное притяжательное местоимение не требуется.
- source_word: ἐτελεύτησεν
  choice: умерла
  rationale: Прямой и естественный эквивалент τελευτάω, сохраняющий суровую краткость повествования без эвфемизма.
