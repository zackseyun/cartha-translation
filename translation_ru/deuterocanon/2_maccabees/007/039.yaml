  yaml_path: translation/deuterocanon/2_maccabees/007/039.yaml
  text: But the king became furious and treated this one more cruelly than the others[a], taking the mockery bitterly.
translation:
  language: ru
  text: Но царь пришёл в ярость и обошёлся с ним жесточе, чем с остальными,[a] с горечью восприняв насмешку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обошёлся с ним хуже, чем с остальными, горько негодуя из-за оскорбительной насмешки».'
    reason: 'Лексическая альтернатива: πικρῶς φέρων ἐπὶ τῷ μυκτηρισμῷ допускает более явный акцент на негодовании царя из-за воспринятого оскорбления.'
lexical_decisions:
- source_word: ἐκθύμως … γενόμενος
  choice: пришёл в ярость
  rationale: Передаёт становление состояния и высокую степень гнева естественным современным русским выражением.
- source_word: τούτῳ … χειρίστως ἀπήντησεν
  choice: обошёлся с ним жесточе
  rationale: В данном контексте ἀπαντάω указывает на обращение царя с юношей, а χειρίστως — на крайне жестокий характер этого обращения.
- source_word: παρὰ τοὺς ἄλλους
  choice: чем с остальными
  rationale: 'Явно передаёт сравнительное значение конструкции: этого брата царь подверг более жестокому обращению, чем других.'
- source_word: πικρῶς φέρων
  choice: с горечью восприняв
  rationale: Сохраняет эмоциональную реакцию царя и связь причастия с основным действием, не сводя выражение только к гневу.
- source_word: μυκτηρισμῷ
  choice: насмешку
  rationale: Обозначает презрительное высмеивание; «насмешка» ясно и естественно звучит в современном русском повествовании.
