base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/018.yaml
  text: After him they brought the sixth[a], and as he was about to die he said, “Do not be deceived; for we are suffering these things because of ourselves, having sinned against our own God[b]. Astonishing things have happened.”
translation:
  language: ru
  text: 'После него привели шестого. Когда он был уже на пороге смерти, он сказал: «Не заблуждайся ещё больше[a]. Мы терпим всё это по собственной вине, потому что согрешили против нашего Бога. Случились удивительные вещи[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «Не обманывайся», «Не обольщайся» или «Не заблуждайся больше». Греческое выражение кратко; глагол может обозначать заблуждение или обман, а μάλλον — усиление («ещё больше») либо продолжение действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «случились вещи, достойные удивления». Греческое ἄξια имеет форму среднего рода множественного числа, при глаголе в единственном числе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τοῦτον ἤγον τὸν ἕκτον
  choice: После него привели шестого
  rationale: Μετὰ δὲ τοῦτον указывает на последовательность, а ἤγον — на то, что шестого вели или привели. В контексте по-русски естественно «привели»; слово «брата» не добавлено, поскольку в этой фразе его нет.
- source_word: μέλλον ἀποθνήσκειν
  choice: Когда он был уже на пороге смерти
  rationale: Оборот μέλλω с инфинитивом выражает близость предстоящего действия. Русское выражение передаёт непосредственную близость смерти без утверждения, что он уже умирал.
- source_word: Μὴ πλανῶ μάλλον
  choice: Не обманывайся больше
  rationale: πλανάω может означать заблуждение, обман или введение в заблуждение; форма допускает обращённое к гонителю предостережение. μάλλον здесь естественно передано как «больше», то есть «не продолжай обманываться».
- source_word: ἡμεῖς γὰρ διʼ ἑαυτοὺς ταῦτα πάσχομεν
  choice: Мы терпим всё это по собственной вине
  rationale: διʼ ἑαυτούς обозначает причину, заключённую в самих страдающих. «По собственной вине» ясно и естественно связывает страдание с их ответственностью.
- source_word: ἁμαρτόντες εἰς τὸν ἑαυτῶν θεόν
  choice: потому что согрешили против нашего Бога
  rationale: Причастие ἁμαρτόντες объясняет причину страданий, а εἰς с θεόν обозначает направленность проступка против Бога. Придаточное причины звучит по-русски естественнее буквального деепричастного оборота.
- source_word: ἄξια θαυμασμοῦ γέγονε
  choice: Произошло нечто поразительное
  rationale: Нейтрально-множественное ἄξια с глаголом в единственном числе буквально говорит о случившемся, достойном удивления. «Нечто поразительное» сохраняет оценочную силу выражения и звучит естественно; причинный союз не добавлен, поскольку в греческом его нет.
theological_decisions:
- issue: Причина страданий братьев
  choice: Говорящий прямо связывает их страдания с их собственным грехом против Бога.
  alternative: 'Понимать διʼ ἑαυτούς более нейтрально: «из-за нас самих» или «ради нас самих».'
  rationale: Связь πάσχομεν с ἁμαρτόντες явно указывает на виновность говорящих. Перевод сохраняет утверждение о страдании как следствии их греха, не уточняя далее характер Божьего действия.
- issue: Связь последней фразы с предыдущей
  choice: Последняя фраза оставлена самостоятельным утверждением без добавления «поэтому».
  alternative: Добавить «поэтому», истолковав связь как явно причинно-следственную.
  rationale: Контекст допускает причинную связь, однако перед ἄξια θαυμασμοῦ γέγονε нет выраженного союза. Перевод не должен превращать подразумеваемую связь в однозначно сформулированную.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным повествовательным тоном. Синтаксис слегка разгружен делением на предложения; богословская причинность сохранена без конфессиональных уточнений.
