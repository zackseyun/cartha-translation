  yaml_path: translation/deuterocanon/2_maccabees/007/021.yaml
  text: And she encouraged each one of them in the language of their fathers[a], filled with a noble spirit, and, stirring her womanly reasoning with manly courage, she said to them[b],
translation:
  language: ru
  text: 'Каждого из них она ободряла на языке предков[a]. Исполненная благородной решимости и пробудив в своём женском разумении мужскую отвагу, она сказала им[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «на родном языке» или «на языке отцов». Греческое выражение буквально обозначает речь, унаследованную от отцов или предков.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте намеренно противопоставлены гендерные характеристики: буквально — «пробудив в женском разумении мужскую отвагу (или дух)». Это отражает риторику античного автора.'
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστον ... τῶν ἀνθρώπων
  choice: каждого из них
  rationale: Винительный падеж единственного числа имеет распределительное значение; по контексту речь идёт о каждом из её сыновей.
- source_word: παρεκάλει
  choice: ободряла
  rationale: В сцене мученичества глагол означает укрепляющее увещание и поддержку в стойкости, а не только утешение.
- source_word: τῇ πατρίῳ φωνῇ
  choice: на языке предков
  rationale: πατρίῳ указывает на унаследованную от предков речь; формулировка сохраняет родовой оттенок и естественна по-русски.
- source_word: γενναίῳ πεπληρωμένη φρονήματι
  choice: исполненная благородной решимости
  rationale: φρόνημα здесь обозначает внутренний настрой, дух или решимость; выбранный вариант передаёт и нравственное благородство, и твёрдость.
- source_word: τὸν θῆλυν λογισμόν
  choice: женский разум
  rationale: Сохранено прямое гендерное определение θῆλυν и значение λογισμός как мышления или разумения.
- source_word: ἄρσενι θυμῷ
  choice: мужским мужеством
  rationale: θυμός в данном контексте означает отвагу и силу духа, а ἄρσενι создаёт намеренный контраст с θῆλυν.
- source_word: διεγείρασα
  choice: пробудив
  rationale: Причастие передаёт действие возбуждения или приведения в деятельное состояние и сохраняет зависимость от последующего говорения.
- source_word: λέγουσα πρὸς αὐτούς
  choice: она говорила им
  rationale: Настоящее причастие естественно передано русской личной формой, вводящей следующую далее прямую речь.
theological_decisions:
- issue: Гендерный риторический контраст в характеристике матери
  choice: Сохранить в основном тексте контраст «женский разум — мужское мужество».
  alternative: Сгладить его как «материнские чувства — твёрдая отвага» либо нейтрализовать как «слабость — решимость».
  rationale: Греческий текст намеренно противопоставляет θῆλυν и ἄρσενι. Хотя такая риторика отражает древние культурные представления, её устранение скрыло бы значимую особенность исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Архаизирующее «исполнившись» не использовано; «исполненная» сохраняет возвышенность без чрезмерной устарелости. Гендерный контраст оригинала оставлен явно и пояснён сноской.
