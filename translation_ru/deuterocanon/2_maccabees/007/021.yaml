  source_fidelity: 'Передача общей структуры и ключевых лексем точна: «ободряла», «на языке предков», «благородная решимость» и явный гендерный контраст соответствуют греческому тексту. Однако сочетание «пробудив женский разум мужским мужеством» в русском языке тяжеловесно и семантически неясно: «мужское мужество» тавтологично, а синтаксис недостаточно ясно передаёт, что древний автор противопоставляет женское разумение и мужскую отвагу.'
