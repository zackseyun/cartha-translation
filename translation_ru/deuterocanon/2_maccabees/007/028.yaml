base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/028.yaml
  text: I beg you[a], child, look at heaven and earth and see everything in them, and know that God made them not out of existing things, and that the human race comes to be in the same way.
translation:
  language: ru
  text: 'Прошу тебя, дитя моё: взгляни на небо и землю, посмотри на всё, что в них, и познай, что Бог сотворил их не из того, что уже существовало[a], и что род человеческий возникает таким же образом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более истолковательно: «из ничего». Буквально по-гречески: «не из существующих вещей» или «не из того, что существует».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀξιῶ σε
  choice: Прошу тебя
  rationale: Передаёт настойчивую и сердечную просьбу матери без излишне повышенного или формально-юридического оттенка.
- source_word: τέκνον
  choice: дитя моё
  rationale: Сохраняет родовое значение обращения к ребёнку; добавление «моё» естественно для русского материнского обращения и не меняет референта.
- source_word: ἀναβλέψαντα
  choice: взгляни
  rationale: Естественно передаёт побуждение посмотреть; буквальный оттенок взгляда вверх не распространяется одинаково на парные объекты «небо и землю».
- source_word: οὐρανὸν καὶ τὴν γῆν
  choice: небо и землю
  rationale: Устойчивая и естественная по-русски космологическая пара, соответствующая греческому тексту.
- source_word: τὰ ἐν αὐτοῖς πάντα
  choice: всё, что на них
  rationale: Сохраняет всеохватность πάντα и естественное русское соотнесение с небом и землёй.
- source_word: γνῶναι
  choice: познай
  rationale: Передаёт не просто интеллектуальное понимание, а вывод, к которому должно привести созерцание творения; сохраняет возвышенный, но понятный регистр.
- source_word: οὐκ ἐξ ὄντων
  choice: не из существовавшего
  rationale: Близко передаёт греческое «не из сущего/существующих вещей», не подменяя его позднейшей краткой формулой «из ничего».
- source_word: ἐποίησεν
  choice: сотворил
  rationale: В контексте происхождения неба и земли русское «сотворил» естественно передаёт ἐποίησεν и ясно обозначает творческое действие Бога.
- source_word: τὸ τῶν ἀνθρώπων γένος
  choice: род человеческий
  rationale: Точное и литературное русское обозначение человечества как целого.
- source_word: οὕτω γίγνεται
  choice: возникает таким же образом
  rationale: Сохраняет настоящее время и широкое значение γίγνεται — «возникает, приходит к бытию», не сужая его до рождения.
theological_decisions:
- issue: Следует ли передавать οὐκ ἐξ ὄντων готовой богословской формулой «из ничего»
  choice: не из существовавшего
  alternative: из ничего
  rationale: Греческий текст буквально отрицает происхождение из чего-либо существовавшего. Основной текст сохраняет эту формулировку и её богословскую силу, а более интерпретирующий традиционный эквивалент приводится в сноске.
- issue: Связь οὕτω с происхождением человеческого рода
  choice: таким же образом
  alternative: так возникает и род человеческий
  rationale: Формулировка сохраняет обратную отсылку к Божьему творению без уточнения механизма и не снимает возможного напряжения в смысле фразы.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис сохраняет последовательность побуждений оригинала, но оформлен естественно для русского языка. Богословски значимая формула οὐκ ἐξ ὄντων оставлена близкой к греческому выражению и пояснена сноской.
