  source_fidelity: 'Основной смысл передан точно: обращение матери, призыв увидеть небо, землю и всё в них, отрицание предсуществующего материала и сопоставление с происхождением человеческого рода сохранены. Однако «не из существовавшего» в русском звучит отвлечённо и несколько сужает/размывает греческое множественное ὄντων («существующие вещи, то, что существует»).'
  naturalness: «Дитя моё» и «познай» допустимы в умеренно возвышенном библейском регистре. Замена «что на них» на «что в них» точнее воспроизводит ἐν αὐτοῖς и естественна в литературной фразе. Формула «не из того, что уже существовало» яснее и естественнее современному читателю.
  terminology: «Бог сотворил», «род человеческий» и «таким же образом» уместны. Сноска должна пояснять, что «из ничего» — интерпретирующая богословская формула, а не буквальная подстановка в текст.
