base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/020.yaml
  text: But the mother was especially admirable and worthy of honorable memory[a]; seeing her seven sons perish in a single day[b], she bore it courageously because of her hopes in the Lord.
translation:
  language: ru
  text: 'Но мать была особенно достойна восхищения и доброй памяти[a]: видя, как семеро её сыновей погибают в один день[b], она мужественно переносила это благодаря надеждам, возложенным на Господа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достойна почётной памяти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как их убивают»; греческое слово буквально означает «погибать, подвергаться уничтожению» и здесь употреблено в контексте их казни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπεραγόντως
  choice: особенно
  rationale: Наречие усиливает похвалу матери; «особенно» естественно передаёт эту выделительную и усилительную функцию.
- source_word: ἀγαθὴ
  choice: достойна восхищения
  rationale: В похвальном контексте прилагательное обозначает нравственное достоинство; буквальное «добрая» рядом с «доброй памяти» создало бы неуместный повтор.
- source_word: μνήμης ἀγαθῆς ἀξία
  choice: достойна доброй памяти
  rationale: Сохраняет значение благосклонного, почётного воспоминания и близко следует греческой формулировке.
- source_word: ἀπολλυμένους
  choice: погибают
  rationale: Причастие настоящего времени показывает происходящую на её глазах гибель; слово сохраняет более широкий смысл греческого глагола, не сводя его прямо к «убивают».
- source_word: συνορῶσα
  choice: видя, как
  rationale: Передаёт непосредственное созерцание всей происходящей сцены и естественно вводит придаточную конструкцию в русском языке.
- source_word: μιᾷ τοῦ καιροῦ ἡμέρᾳ
  choice: в один день
  rationale: Передаёт сосредоточенность трагедии в пределах одного дня без тяжеловесного буквального оборота.
- source_word: εὐψύχως
  choice: мужественно
  rationale: Точно выражает стойкость и присутствие духа перед лицом испытания.
- source_word: ἔφερεν
  choice: переносила это
  rationale: Глагол здесь означает терпеливо выносить происходящее; местоимение делает русскую фразу грамматически полной.
- source_word: διὰ τὰς ἐπὶ Κύριον ἐλπίδας
  choice: благодаря надеждам, возложенным на Господа
  rationale: Сохраняет множественное число «надежды» и их направленность на Господа; «благодаря» передаёт основание её мужества.
- source_word: Κύριον
  choice: Господа
  rationale: Традиционное и естественное русское обозначение Бога в данном контексте.
theological_decisions:
- issue: Передача множественного числа ἐλπίδας
  choice: надеждам
  alternative: надежде
  rationale: Множественное число оригинала сохранено, чтобы не сводить возможный круг упований матери к одной обобщённой идее.
- issue: Направленность надежд ἐπὶ Κύριον
  choice: возложенным на Господа
  alternative: на Господа
  rationale: Формулировка ясно передаёт, что надежды опираются на Господа, не уточняя их содержание сверх сказанного в тексте.
- issue: Причинная связь διὰ
  choice: благодаря
  alternative: из-за; по причине
  rationale: В контексте надежды на Бога русское «благодаря» естественно выражает положительное основание её мужественной стойкости.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Порядок слов слегка приподнят, но остаётся ясным; повтор корня «добрая» устранён в первой характеристике матери, а во фразе о памяти сохранён образ оригинала.
