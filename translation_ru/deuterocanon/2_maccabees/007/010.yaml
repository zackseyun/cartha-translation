  text: After him[a], the third was mocked, and when his tongue was demanded, he quickly held it out and courageously stretched out his hands.
translation:
  language: ru
  text: После него над третьим стали издеваться. Когда у него потребовали язык, он тут же высунул его и мужественно протянул руки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τοῦτον
  choice: После него
  rationale: Передаёт последовательность действий и личную отсылку к предыдущему брату естественным русским выражением.
- source_word: ὁ τρίτος
  choice: над третьим
  rationale: Субстантивированное порядковое числительное; слово «брат» ясно из контекста и потому не добавлено.
- source_word: ἐνεπαίζετο
  choice: стали издеваться
  rationale: Глагол обозначает насмешливое, унизительное обращение; форма несовершенного вида передаёт разворачивающееся действие, а не добавляет прямо не названные здесь пытки.
- source_word: τὴν γλῶσσαν αἰτηθεὶς
  choice: Когда у него потребовали язык
  rationale: В контексте αἰτέω имеет оттенок властного требования. Временное придаточное естественно передаёт аористное страдательное причастие, сохраняя неназванным действующее лицо.
- source_word: ταχέως προέβαλλεν
  choice: тут же высунул его
  rationale: Для языка προβάλλω означает выставить или выдвинуть вперёд; «высунул» точно и естественно по-русски, а «тут же» передаёт быстроту и решительность.
- source_word: τὰς χεῖρας εὐθαρσῶς προέτεινεν
  choice: мужественно протянул руки
  rationale: εὐθαρσῶς выражает смелость и уверенность, а προτείνω — движение рук вперёд; формулировка сохраняет сдержанный и достойный тон.
