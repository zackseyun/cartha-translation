    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὗτος οὖν
  choice: Так и он
  rationale: Передаёт связующее οὖν, добавочное καί и указательное выделение οὗτος, не утяжеляя русскую фразу.
- source_word: καθαρῶς
  choice: в чистоте
  rationale: Сохраняет наречное значение образа или состояния при смерти и вероятный нравственно-религиозный оттенок чистоты, не сводя выражение только к мужеству или безупречности.
- source_word: μετήλλαξεν
  choice: умер
  rationale: В контексте глагол служит почтительным обозначением смерти. Прямое русское «умер» естественно и не вносит дополнительных представлений, возможных в выражениях «отошёл» или «перешёл в иной мир».
- source_word: παντελῶς
  choice: всецело
  rationale: Передаёт полноту и безраздельность доверия.
- source_word: ἐπὶ τῷ κυρίῳ
  choice: на Господа
  rationale: При πεποιθώς предлог ἐπί с дательным обозначает того, на ком покоится доверие; русское «положиться на Господа» точно и идиоматично.
- source_word: πεποιθώς
  choice: положившись
  rationale: Совершенный вид передаёт состоявшееся и сохраняющее силу упование, выраженное греческим перфектным причастием.
- source_word: κύριος
  choice: Господь
  rationale: Обычное и контекстуально уместное соответствие κύριος в иудейском религиозном тексте.
theological_decisions:
- issue: Нравственно-религиозный смысл καθαρῶς при описании смерти мученика
  choice: «умер в чистоте» — умер, сохранив нравственную и религиозную неосквернённость
  alternative: 'Понять выражение в более общем смысле: умер безупречно или достойно, без особого оттенка чистоты'
  rationale: Контекст верности Божьему закону поддерживает нравственно-религиозный оттенок, однако перевод не уточняет его как исключительно ритуальную чистоту и сохраняет широту греческого выражения.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественно-сдержанная. Буквально тяжеловесная последовательность связок сглажена, а смысловые оттенки чистоты и полного доверия сохранены.
