  text: And so this one also passed away in purity[b][a], having placed his full confidence in the Lord.
translation:
  language: ru
  text: Так и он умер в чистоте[a], всецело положившись на Господа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умер чистым», то есть неосквернённым. Греческое наречие, вероятно, имеет нравственно-религиозный оттенок.'
    reason: lexical_alternative
