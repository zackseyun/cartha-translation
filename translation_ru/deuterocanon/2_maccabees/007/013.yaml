  text: And when this one also had died[a], they were torturing the fourth in the same way, abusing him.
translation:
  language: ru
  text: Когда умер и этот[a], четвёртого также подвергали пыткам, жестоко обращаясь с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отошёл из жизни». Греческий глагол может служить почтительным эвфемизмом смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταλλάξαντος
  choice: умер
  rationale: В данном контексте глагол в родительном абсолютном обороте служит иносказательным обозначением смерти. «Умер» ясно и естественно передаёт смысл; более мягкий оттенок отмечен в сноске.
- source_word: τοῦτον δὲ
  choice: и этот
  rationale: 'Указательное местоимение отсылает к предыдущему брату, а сочетание καί и δέ продолжает последовательность: «и этот».'
- source_word: τὸν τέταρτον
  choice: четвёртого
  rationale: Греческий текст прямо называет лишь «четвёртого»; подразумеваемое «брата» ясно из контекста и не добавляется в основной текст.
- source_word: ὡσαύτως
  choice: так же
  rationale: Передаёт повторение того же обращения с очередным братом и звучит естественно по-русски.
- source_word: ἐβασάνιζον
  choice: стали пытать
  rationale: В контексте βασανίζω означает подвергать физическим пыткам. Русская конструкция «стали пытать» естественно передаёт начавшееся продолжающееся действие греческого имперфекта в развитии повествования.
- source_word: αἰκιζόμενοι
  choice: жестоко издеваясь над ним
  rationale: Причастие обозначает сопровождающее пытку жестокое, унизительное обращение. «Жестоко издеваясь» сохраняет самостоятельный оттенок насилия и не сводится к простому повтору слова «пытать»; объект восстановлен из контекста.
