  yaml_path: translation/deuterocanon/2_maccabees/007/019.yaml
  text: But as for you[a], do not suppose that you will be innocent, having attempted to fight against God.
translation:
  language: ru
  text: Но ты не думай, что будешь невиновен, попытавшись бороться против Бога[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «противиться Богу». Греческий глагол буквально означает «бороться против Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Но ты
  rationale: Сохраняет противопоставление, выраженное δέ, и подчёркнутое прямое обращение σὺ; по-русски звучит естественно и резко.
- source_word: μὴ νομίσῃς
  choice: не думай
  rationale: Передаёт запрещение считать истинным ошибочное предположение; это естественная современная русская формулировка.
- source_word: ἀθῷος
  choice: невиновным
  rationale: Сохраняет основное значение свободы от вины или ответственности, не подменяя его предполагаемым следствием «безнаказанным».
- source_word: ἔσεσθαι
  choice: останешься
  rationale: Будущий инфинитив в косвенной речи передан русской формой будущего времени; «останешься невиновным» идиоматично выражает ожидаемый статус.
- source_word: θεομαχεῖν
  choice: бороться против Бога
  rationale: Передаёт буквальный и сильный смысл сложного глагола — вести борьбу против Бога, а не просто оказывать сопротивление.
- source_word: ἐπιχειρήσας
  choice: попытавшись
  rationale: Сохраняет значение предпринятой попытки и деепричастную связь аористного причастия с главным предостережением.
theological_decisions:
- issue: Передача θεομαχεῖν
  choice: бороться против Бога
  alternative: противиться Богу
  rationale: Буквальная передача сохраняет обвинение в деятельной борьбе против самого Бога и не ослабляет его до общего несогласия или сопротивления.
translation_notes:
  register: Современный литературный русский язык; краткое, прямое и обличительное обращение. Синтаксис близок к греческому, но остаётся естественным для обычного читателя.
