  source_fidelity: 'Смысл греческого периода в целом передан точно: субъективное предположение Антиоха, оскорбительный характер речи, увещевание с клятвами и условие отступления от отеческих установлений сохранены. Однако «вверить ему ответственные должности» менее точно передаёт χρείας ἐμπιστεύσειν: χρείας — прежде всего порученные дела, обязанности или государственные дела, а не сами должности.'
