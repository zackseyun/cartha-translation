base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/024.yaml
  text: But Antiochus[a], thinking that he was being despised and taking note of the reproachful tone, while the youngest was still alive, not only urged him with words, but also assured him with oaths that he would both make him rich and make him blessed, if he turned away from the traditions of his fathers[c][b], and that he would have him as a friend and entrust him with offices.
translation:
  language: ru
  text: Антиох же, полагая, что им пренебрегают, и заметив укоризненный тон[a], пока младший сын был ещё жив, не только убеждал его словами, но и клятвенно заверял, что сделает его богатым и счастливым, если тот отступит от обычаев предков, будет считать его своим другом[b] и поручит ему важные дела[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «укоряющий голос»; возможны также переводы «оскорбительный голос» или «укоризненная речь».'
    reason: lexical_alternative
  - marker: b
    text: «Друг» могло быть также придворным званием — обозначением приближённого царя или высокопоставленного сановника.
    reason: cultural_note
  - marker: c
    text: 'Или: «вверить ему обязанности», «поручить ему важные дела»; греческое выражение может обозначать порученные царём дела или обязанности, а возможно и служебное положение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰόμενος
  choice: полагая
  rationale: Передаёт субъективное восприятие Антиоха и не утверждает, что к нему действительно относились с презрением.
- source_word: καταφρονεῖσθαι
  choice: что им пренебрегают
  rationale: Естественно передаёт пассивный инфинитив и оттенок презрительного отношения.
- source_word: τὴν ὀνειδίζουσαν ... φωνήν
  choice: укоризненный тон
  rationale: Буквально речь идёт об «укоряющем голосе»; «тон» естественно обозначает характер услышанной речи.
- source_word: ὑφορώμενος
  choice: заметив
  rationale: В контексте означает, что Антиох распознал или принял к сведению укоризненный характер речи, без усиления до подозрительности.
- source_word: ἔτι τοῦ νεωτέρου περιόντος
  choice: пока младший сын был ещё жив
  rationale: В контексте последовательной гибели братьев περιόντος означает, что младший ещё оставался в живых; «сын» ясно указывает на участника повествования.
- source_word: τὴν παράκλησιν ... ἐποιεῖτο
  choice: убеждал его
  rationale: Передаёт настойчивое увещевание в естественной русской форме.
- source_word: διʼ ὅρκων ἐπίστου
  choice: клятвенно заверял
  rationale: Сохраняет и убеждающую, и торжественно-обещательную силу выражения.
- source_word: πλουτιεῖν
  choice: сделает его богатым
  rationale: Прямо и ясно передаёт обещание материального обогащения.
- source_word: μακαριστὸν ποιήσειν
  choice: сделает его ... счастливым
  rationale: Сохраняет значение благополучия и завидной доли в контексте царских посулов, не придавая слову исключительно религиозного смысла.
- source_word: μεταθέμενον ἀπὸ τῶν πατρίων
  choice: если тот отступит от обычаев предков
  rationale: Условная передача причастия естественна по-русски; «обычаи предков» сохраняет религиозно-наследственный смысл, не добавляя отсутствующего существительного.
- source_word: φίλον ἕξειν
  choice: считать его своим другом
  rationale: Сохраняет буквальный образ царского «друга», который также мог обозначать придворный статус.
- source_word: χρείας ἐμπιστεύσειν
  choice: вверить ему ответственные должности
  rationale: Передаёт доверение царём обязанностей или служебных полномочий; примечание сохраняет широту греческого выражения.
theological_decisions:
- issue: Значение πατρίων в контексте принуждения к отступничеству
  choice: обычаи предков
  alternative: отеческие предания
  rationale: Выбранная формулировка охватывает унаследованные иудейские религиозные установления, не сужая их до устного предания и не внося конфессиональной терминологии.
- issue: Значение μακαριστόν в обещании языческого царя
  choice: счастливым
  alternative: блаженным; достойным зависти
  rationale: «Счастливым» сохраняет широкое значение благополучной, привилегированной доли и не навязывает религиозного оттенка, хотя греческое слово допускает более буквальное «блаженным».
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис несколько упрощён по сравнению с длинным греческим периодом, но последовательность действий и обещаний сохранена. Формы «клятвенно заверял», «отступит», «вверить» поддерживают возвышенный, но понятный регистр.
