  yaml_path: translation/deuterocanon/2_maccabees/007/036.yaml
  text: For our brothers[a], having now endured a brief pain, have fallen under God's covenant into everlasting life; but you, by the judgment of God, will justly bear the penalties of your arrogance.
translation:
  language: ru
  text: Ведь наши братья, претерпев недолгое мучение, ныне по Божьему завету обрели вечную жизнь[a]; а ты по Божьему суду понесёшь справедливые наказания за свою надменность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение сжато. Буквально: «пали под Божий завет вечной жизни». Глагол «пали» в данном контексте означает смерть; возможны также понимания: «умерли под Божьим заветом, чтобы обрести вечную жизнь» или «пали под Божий завет, ведущий к вечной жизни».'
    reason: alternative_reading
lexical_decisions:
- source_word: βραχὺν ἐπενέγκαντες πόνον
  choice: претерпев теперь недолгое мучение
  rationale: Передаёт краткость страдания и значение перенесённой муки, не усиливая выражение сверх греческого текста.
- source_word: ἀενάου ζωῆς
  choice: нескончаемой жизни
  rationale: Сохраняет значение непрерывной, не прекращающейся жизни; выражение звучит понятно и достойно в современном русском языке.
- source_word: ὑπὸ διαθήκην θεοῦ
  choice: под Божьим заветом
  rationale: Сохраняет необычную предложную конструкцию греческого текста и явный образ завета, не заменяя его более общим понятием обещания.
- source_word: πεπτώκασιν
  choice: пали
  rationale: Буквально передаёт глагол πίπτω; в контексте мученической смерти слово понятно как указание на гибель, но исходный образ не устраняется.
- source_word: τῇ τοῦ θεοῦ κρίσει
  choice: по Божьему суду
  rationale: Естественно выражает основание и действие Божьего суда, сохраняя судебный смысл κρίσις.
- source_word: δίκαια τὰ πρόστιμα
  choice: справедливое наказание
  rationale: Передаёт заслуженную кару; русское единственное число здесь естественнее буквального множественного и не создаёт ложной ассоциации только с денежными штрафами.
- source_word: ὑπερηφανίας
  choice: надменность
  rationale: Точно обозначает высокомерное, заносчивое самоутверждение царя и соответствует возвышенному, но современному регистру.
theological_decisions:
- issue: Связь мученической смерти, Божьего завета и нескончаемой жизни в ἀενάου ζωῆς ὑπὸ διαθήκην θεοῦ πεπτώκασιν
  choice: 'Сохранить компактное и необычное сочетание: «пали под Божьим заветом нескончаемой жизни».'
  alternative: «Умерли, пребывая под Божьим заветом, чтобы обрести нескончаемую жизнь» или «по Божьему завету обрели нескончаемую жизнь».
  rationale: Греческий синтаксис допускает различное соотнесение родительного ἀενάου ζωῆς с заветом и итогом смерти. Основной текст сохраняет связь всех трёх понятий, а примечание разъясняет возможное понимание, не превращая подразумеваемый смысл в однозначное утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования о мученичестве. Слово «нескончаемая» передаёт длительность ἀέναος без автоматического подведения выражения под позднейшую богословскую терминологию; необычность фразы о завете намеренно сохранена и пояснена сноской.
