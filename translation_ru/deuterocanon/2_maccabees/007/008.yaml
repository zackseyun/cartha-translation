  yaml_path: translation/deuterocanon/2_maccabees/007/008.yaml
  text: But he answered in the language of his fathers and said[a], “No.” Therefore this one also received the next torture, like the first.
translation:
  language: ru
  text: 'Он же ответил на языке своих предков[a]: «Нет». Поэтому и он подвергся следующей пытке, как и первый.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на языке предков»; возможно также: «на родном языке». Буквально греческое выражение означает речь или язык, унаследованный от отцов, то есть предков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: ответил
  rationale: Аористное причастие от ἀποκρίνομαι употреблено депонентно и вводит ответ; русское «ответил» естественно передаёт его функцию вместе с последующим глаголом речи.
- source_word: τῇ πατρίῳ φωνῇ
  choice: на языке своих предков
  rationale: πατρίος указывает на отеческое, унаследованное от предков, а φωνή здесь означает речь или язык. Формулировка сохраняет связь с происхождением героя и не уточняет, какой именно язык имеется в виду.
- source_word: προσεῖπεν
  choice: 'ответил …:'
  rationale: Глагол вводит прямую речь. В русском отдельное «сказал» после «ответил» создало бы ненужную тяжеловесность, поэтому значение естественно выражено конструкцией с двоеточием.
- source_word: Οὐχί
  choice: Нет
  rationale: Краткий и решительный отрицательный ответ; «Нет» сохраняет силу реплики без добавочного усиления.
- source_word: διόπερ
  choice: Поэтому
  rationale: Союз обозначает следствие отказа и ясно передаётся современным русским «поэтому».
- source_word: οὗτος
  choice: он
  rationale: В данном русском контексте местоимение естественнее буквального «этот»; частица «и» сохраняет соотнесение со вторым братом.
- source_word: τὴν ἑξῆς βάσανον
  choice: следующей пытке
  rationale: ἑξῆς обозначает следующую по порядку пытку, а βάσανος в контексте насильственного мучения означает именно пытку.
- source_word: ὡς ὁ πρῶτος
  choice: как и первый
  rationale: Кратко и естественно сохраняет сравнение с первым братом.
theological_decisions:
- issue: Этнический и семейно-наследственный оттенок τῇ πατρίῳ φωνῇ
  choice: на языке своих предков
  alternative: на родном языке; на отеческом языке
  rationale: Выбранный вариант сохраняет связь языка с предками и идентичностью мученика, не определяя конкретный язык и не сводя выражение только к индивидуальному «родному языку».
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. Синтаксическая избыточность греческого сочетания «ответив, сказал» устранена без потери смысла; двоеточие непосредственно вводит решительный ответ.
