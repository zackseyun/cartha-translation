lexical_decisions:
- source_word: Ἐχομένως
  choice: Затем
  rationale: Наречие обозначает следующий эпизод в последовательности; «затем» естественно передаёт движение повествования.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Частица продолжает повествование и в русском естественно передаётся общей связью предложения без отдельного союза.
- source_word: τὸν πέμπτον
  choice: пятого
  rationale: В греческом буквально сказано «пятого», без существительного; из контекста ясно, что речь о пятом брате.
- source_word: προσάγοντες
  choice: подведя
  rationale: Причастие обозначает, что его подвели или вывели вперёд к мучителям; деепричастие сохраняет зависимость действия от основного глагола.
- source_word: ᾐκίζοντο
  choice: стали пытать его
  rationale: Глагол означает жестокое физическое истязание. Форма имперфекта передаёт начавшееся и разворачивающееся действие; «стали пытать» естественно выражает этот аспект по-русски.
