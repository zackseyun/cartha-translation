  text: And he said bravely, “From heaven I received these, and for his laws I disregard them, and from him I hope to receive them back again.”
translation:
  language: ru
  text: 'И он мужественно сказал: «С неба я получил их; ради Его законов я пренебрегаю ими и надеюсь снова получить их от Него».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενναίως
  choice: мужественно
  rationale: Наречие передаёт смелость и благородную стойкость говорящего; «мужественно» естественно и достойно звучит по-русски.
- source_word: Ἐξ οὐρανοῦ
  choice: С неба
  rationale: Сохраняет образное обозначение божественного источника дарованных членов тела без поясняющего добавления.
- source_word: ταῦτα
  choice: их
  rationale: Местоимение относится к ранее упомянутым частям тела; русский винительный «их» естественнее буквального «это» и сохраняет контекстуальную отсылку.
- source_word: ὑπερορῶ
  choice: не дорожу
  rationale: В данном контексте означает считать их не заслуживающими сохранения ценой нарушения Божьих законов; формулировка передаёт добровольное пренебрежение ими, не утверждая ненависти к телу.
- source_word: πάλιν ἐλπίζω κομίσεσθαι
  choice: надеюсь снова получить
  rationale: Передаёт ожидание возвращения утраченного; средний инфинитив естественно выражен русским «получить».
theological_decisions:
- issue: Источник и восстановление частей тела
  choice: «С неба я получил их… надеюсь снова получить их от Него»
  alternative: «Бог дал мне их… верю, что Он воскресит моё тело»
  rationale: Сохранены метонимия «с неба», местоименная ссылка «от Него» и надежда на повторное получение без добавления более определённой формулы воскресения, которой в стихе прямо нет.
- issue: Отношение к телесным членам ради Божьих законов
  choice: «ради Его законов я не дорожу ими»
  alternative: «ради Его законов я отказываюсь от них»
  rationale: Греческое ὑπερορῶ выражает пренебрежение их сохранением ради верности законам, тогда как «отказываюсь» могло бы слишком прямо описывать лишь действие передачи или отсечения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Сохранены лаконизм, трёхчастная структура высказывания и неоднократная местоименная отсылка к отсечённым частям тела.
