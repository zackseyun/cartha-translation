base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/002.yaml
  text: But one of them[a], becoming their spokesman, said, “What do you intend to ask and learn from us? For we are ready to die rather than transgress the ancestral laws.”
translation:
  language: ru
  text: 'Но один из них, выступив от имени остальных, сказал: «Что ты хочешь спросить и узнать от нас? Ведь мы готовы скорее умереть, чем преступить законы предков[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отеческие законы».'
    reason: Лексическая альтернатива для πατρῷα νόμους, сохраняющая буквальную связь с «отцами», но менее естественная в современном русском.
lexical_decisions:
- source_word: εἷς δὲ αὐτῶν
  choice: Но один из них
  rationale: Частичный родительный αὐτῶν прямо означает «один из них»; δέ отмечает переход к ответу и естественно передаётся союзом «но».
- source_word: γενόμενος προήγορος
  choice: выступив от имени остальных
  rationale: προήγορος обозначает того, кто говорит первым или представляет других. Формулировка передаёт представительскую роль без предположения о постоянном руководстве.
- source_word: Μέλλεις ἐρωτᾷν, καὶ μανθάνειν ἡμῶν;
  choice: Что ты намерен выведать у нас своими расспросами?
  rationale: μέλλεις выражает намерение; сочетание ἐρωτᾷν и μανθάνειν передано естественным русским оборотом, сохраняющим вызов, заключённый в риторическом вопросе.
- source_word: ἕτοιμοι γάρ ἀποθνήσκειν ἐσμέν
  choice: Мы готовы скорее умереть
  rationale: Конструкция означает «мы готовы умереть»; «скорее» связано с последующим сравнительным ἢ и ясно выражает предпочтение смерти нарушению закона.
- source_word: τὰ πατρῷα νόμους
  choice: законы предков
  rationale: Несмотря на текстуальную шероховатость согласования, смысл — унаследованные от предков законы. «Законы предков» сохраняет семейно-традиционную окраску и звучит естественно по-русски.
- source_word: παραβαίνειν
  choice: преступить
  rationale: В правовом и нравственном контексте глагол означает нарушить закон; «преступить законы» передаёт серьёзность действия и остаётся понятным современному читателю.
theological_decisions:
- issue: Передача πατρῷα νόμους как обозначения унаследованного иудейского Закона
  choice: законы предков
  alternative: отеческие законы; законы наших отцов; установления предков
  rationale: Выбранный вариант сохраняет общинную преемственность и заветный контекст, не добавляя отсутствующего в греческом притяжательного местоимения и не сводя νόμους к более широкому понятию «обычаи».
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим сцене мученичества. Обращение на «ты» отражает единственное число μέλλεις и прямой вызов царю. Частица γάρ не передана отдельным «ибо», поскольку причинная связь ясно выражена последовательностью реплик; это избегает излишней книжности. Маркер сноски поставлен после относящегося ко всей финальной формулировке предложения.
