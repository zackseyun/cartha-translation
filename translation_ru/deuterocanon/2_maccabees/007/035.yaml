  source_fidelity: Основной текст осознанно передаёт контекстуально необходимое отрицание при ἐκπέφευγας, хотя форма в тексте Swete формально утвердительная. Это существенное отступление надлежащим образом и точно оговорено в сноске, где сохранено буквальное чтение. «Суда Бога» верно передаёт τὴν ... θεοῦ κρίσιν; «всемогущего Наблюдателя» отражает παντοκράτορος ἐπόπτου.
  naturalness: Фраза звучит естественно в современном литературном русском с уместной торжественностью. «Ведь так» сохраняет пояснительную связь γάρ и отсылку οὕτω к предшествующему контексту. Тире удачно оформляет пояснительное приложение к «Бога».
  terminology: «Всемогущий» — устойчивый, понятный эквивалент παντοκράτωρ. «Наблюдатель» несколько необычен как божественное наименование, но намеренно сохраняет образ ἐπόπτης («наблюдающий/надзирающий») без конфессионально окрашенного расширения; прописная буква последовательно отмечает его как наименование Бога.
