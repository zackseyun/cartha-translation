  yaml_path: translation/deuterocanon/2_maccabees/007/035.yaml
  text: For in this way you have not escaped the judgment of God[a], the all-powerful overseer.
translation:
  language: ru
  text: Ведь так ты не избежал суда Бога[a] — всемогущего Наблюдателя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В дошедшем греческом тексте издания Swete буквально: «Ведь так ты избежал суда Бога — всемогущего Наблюдателя». Однако контекст явно требует отрицательного смысла: «не избежал».'
    reason: textual_variant
lexical_decisions:
- source_word: οὕτω
  choice: так
  rationale: Кратко и естественно указывает на описанный ранее образ действий, сохраняя связь с контекстом.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предыдущим высказыванием и естественно звучит в современной русской речи.
- source_word: κρίσιν
  choice: суда
  rationale: Передаёт божественное судебное решение и воздаяние, не сужая значение до формального приговора.
- source_word: ἐκπέφευγας
  choice: не избежал
  rationale: Перфект выражает достигнутое состояние; отрицание следует смыслу непосредственного контекста, хотя в дошедшем греческом тексте его нет. Расхождение отмечено в сноске.
- source_word: παντοκράτορος
  choice: всемогущего
  rationale: Общепонятный и достойный русский эквивалент, выражающий неограниченную власть Бога.
- source_word: ἐπόπτου
  choice: Наблюдателя
  rationale: Сохраняет образ того, кто видит происходящее и надзирает; прописная буква показывает, что слово выступает здесь как наименование Бога.
- source_word: θεοῦ
  choice: Бога
  rationale: Родительный падеж естественно зависит от слова «суда», а последующие определения раскрывают, о каком Боге говорится.
theological_decisions:
- issue: Передача божественных наименований παντοκράτορος ἐπόπτου θεοῦ
  choice: Бога — всемогущего Наблюдателя
  alternative: всемогущего, всевидящего Бога
  rationale: Формулировка сохраняет оба элемента греческого именования и подчёркивает, что Божьего суда нельзя избежать или укрыться от него, не вводя дополнительных конфессиональных формул.
- issue: Передача утвердительной формы ἐκπέφευγας при контекстуально требуемом отрицании
  choice: не избежал
  alternative: избежал
  rationale: В переданном тексте Swete глагол формально означает «ты избежал», однако контекст речи мученика к гонителю требует противоположного смысла. Вероятнее всего, отрицание было утрачено при передаче текста; поэтому контекстуальный смысл дан в основном тексте, а засвидетельствованная форма — в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Порядок слов слегка перестроен ради ясности; тире оформляет приложения к слову «Бога».
