  text: But looking at him[a], he said, “Though you have authority among men, being mortal, you do what you want[b];
translation:
  language: ru
  text: 'Он же, взглянув на него, сказал: «Имея власть среди людей, ты, смертный[a], делаешь, что хочешь;'
