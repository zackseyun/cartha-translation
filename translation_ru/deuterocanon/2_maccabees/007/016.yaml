lexical_decisions:
- source_word: ὁ δὲ πρὸς αὐτὸν ἰδὼν
  choice: Он же, взглянув на него
  rationale: Сохраняет подлежащее, переход δέ и направленный, вызывающий характер взгляда; деепричастие естественно передаёт аористное причастие.
- source_word: Ἐξουσίαν
  choice: власть
  rationale: В контексте обращения к правителю обозначает власть и полномочия, а не отвлечённую силу.
- source_word: ἐν ἀνθρώποις
  choice: среди людей
  rationale: Передаёт ἐν с дательным как сферу осуществления власти и сохраняет общий смысл ἀνθρώποις без ограничения только мужчинами.
- source_word: ἔχων
  choice: имея
  rationale: Формально сохраняет причастную конструкцию оригинала и её контекстуально уступительный оттенок, не добавляя отсутствующего союза «хотя».
- source_word: ὃ θέλεις ποιεῖς
  choice: делаешь, что хочешь
  rationale: Прямой, естественный современный эквивалент, сохраняющий порядок смысловых компонентов.
- source_word: φθαρτὸς ὤν
  choice: ты, смертный
  rationale: В обращении к земному правителю ясно выражает его бренность и ограниченность; конструкция с приложением звучит по-русски естественнее буквального «будучи смертным».
theological_decisions:
- issue: Антропологический оттенок φθαρτὸς ὤν в обличении земного правителя
  choice: ты, смертный
  alternative: будучи тленным / будучи подверженным тлению
  rationale: Контекст противопоставляет человеческую власть человеческой бренности. «Смертный» ясно передаёт риторический и богословский смысл, а примечание сохраняет более буквальные лексические возможности.
