lexical_decisions:
- source_word: ἡμεῖς
  choice: мы
  rationale: Явно выраженное местоимение сохраняет смысловое ударение на самих говорящих.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительную связь с предшествующим контекстом естественным современным русским словом.
- source_word: διὰ
  choice: за
  rationale: С винительным падежом предлог выражает причину; в сочетании «страдать за грехи» русское «за» ясно указывает, за что говорящие несут страдание.
- source_word: τὰς ἑαυτῶν ἁμαρτίας
  choice: свои собственные грехи
  rationale: Сочетание сохраняет усиленное возвратное значение ἑαυτῶν и подчёркивает признание говорящими личной вины.
- source_word: πάσχομεν
  choice: страдаем
  rationale: Настоящее время передаёт продолжающееся в данный момент страдание; несовершенный вид естественно выражает это по-русски.
theological_decisions:
- issue: Причина страданий говорящих
  choice: Страдания прямо связываются с их собственными грехами.
  alternative: «Мы страдаем за наши грехи» — без усиленного возвратного оттенка.
  rationale: Греческий текст недвусмысленно связывает нынешние страдания говорящих с их же грехами; перевод сохраняет это покаянное признание, не смягчая и не расширяя его.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и естественная формулировка. «Ведь» сохраняет пояснительную функцию γὰρ, а «свои собственные» — намеренное усиление исходного возвратного выражения.
