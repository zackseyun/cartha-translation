base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/034.yaml
  text: But you[a], O unholy one, most defiled of all men, do not be vainly puffed up, inflamed with uncertain hopes, having raised your hands against the children of heaven.
translation:
  language: ru
  text: А ты, нечестивец, самый осквернённый из всех людей, не возносись понапрасну, распаляясь неясными надеждами и подняв руки на детей неба[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небесных детей». Греческое выражение можно понимать и как характеристику самих детей — «небесные», и как указание на их принадлежность небу — «дети неба».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόσιε
  choice: нечестивец
  rationale: Форма обращения прямо обличает отсутствие благочестия; «нечестивец» звучит сильно, естественно и сохраняет религиозный смысл.
- source_word: μιαρώτατε
  choice: самый осквернённый
  rationale: Превосходная степень от μιαρός выражает нравственную и культовую нечистоту. «Самый осквернённый» сохраняет образ скверны, не сводя его к общей оценке «мерзкий».
- source_word: μὴ μάτην μετεωρίζου
  choice: не возносись понапрасну
  rationale: Передаёт образ самовозвышения в μετεωρίζου и тщетность, выраженную μάτην; формулировка естественна для торжественного обличения.
- source_word: φρυττόμενος
  choice: распаляясь
  rationale: Причастие связано с образом жара и возбуждения; «распаляясь» сохраняет эту метафору и хорошо сочетается с надеждами.
- source_word: ἀδήλοις ἐλπίσιν
  choice: неясными надеждами
  rationale: ἀδήλοις означает неявные, неопределённые или сомнительные. «Неясными» сохраняет неопределённость, не добавляя утверждения, что надежды непременно ложны.
- source_word: οὐρανίους παῖδας
  choice: детей неба
  rationale: παῖδας передано широким словом «детей», а οὐρανίους — как принадлежность небу. Это сохраняет возвышенную богословскую формулировку без добавления отсутствующего в греческом слова «Бог»; возможное определительное прочтение отмечено в сноске.
- source_word: ἐπαράμενος χεῖρας
  choice: подняв руки на
  rationale: Сочетание с ἐπί и винительным обозначает враждебное действие. Русское «поднять руки на кого-либо» естественно передаёт направленное насилие и сохраняет телесный образ.
theological_decisions:
- issue: Значение οὐρανίους в сочетании οὐρανίους παῖδας
  choice: детей неба
  alternative: небесных детей
  rationale: Греческое прилагательное допускает понимание как характеристики самих детей («небесные»), так и указания на их принадлежность небу. Основной текст следует второму пониманию, а сноска сохраняет первое, не вводя прямо наименование Бога, которого в исходном тексте нет.
translation_notes:
  register: Современный литературный русский язык с достоинством и силой прямого обличения. Синтаксис сохраняет последовательность греческих причастных оборотов, но союз «и» делает фразу естественной по-русски. Образ скверны и намеренная неоднозначность выражения οὐρανίους παῖδας сохранены.
