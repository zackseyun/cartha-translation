base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/022.yaml
  text: I do not know how you appeared in my womb[a], nor was it I who granted you spirit and life, and it was not I who arranged the formation of each of you.
translation:
  language: ru
  text: Я не знаю, как вы появились в моей утробе; не я даровала вам дух[a] и жизнь, и не я устроила состав каждого из вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дыхание». Греческое слово может означать «дух», «дыхание» или «ветер»; здесь оно обозначает оживляющее начало жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἶδʼ ὅπως
  choice: Я не знаю, как
  rationale: Прямая и естественная русская передача признания матери, что ей неведом процесс возникновения её сыновей.
- source_word: εἰς τὴν ἐμὴν ἐφάνητε κοιλίαν
  choice: вы появились в моей утробе
  rationale: «Появились» сохраняет буквальный образ ἐφάνητε и оттенок таинственности происхождения; «в моей утробе» естественно передаёт контекстуальное значение конструкции с εἰς.
- source_word: οὐδὲ ἐγὼ
  choice: не я
  rationale: Вынесенное отрицание естественно по-русски сохраняет эмфатическое отрицание того, что мать была первоисточником жизни.
- source_word: τὸ πνεῦμα καὶ τὴν ζωὴν ὑμῖν ἐχαρισάμην
  choice: не я даровала вам дух и жизнь
  rationale: «Даровала» передаёт значение милостивого наделения в ἐχαρισάμην. «Дух» сохраняет широту πνεῦμα и не сливает его с отдельно названной «жизнью».
- source_word: τὴν ἑκάστου στοιχείωσιν ... διερρύθμισα
  choice: определила строение каждого из вас
  rationale: «Строение» понятно передаёт состав, устройство и формирование, обозначаемые στοιχείωσις; «определила» выражает намеренное упорядочение в διερρύθμισα без неестественной технической буквальности.
theological_decisions:
- issue: Значение πνεῦμα в речи матери о происхождении человека
  choice: дух
  alternative: дыхание
  rationale: Поскольку πνεῦμα стоит рядом с ζωή, перевод «дух» сохраняет различие между двумя связанными понятиями и смысловую широту греческого слова. Возможность значения «дыхание» отмечена в сноске.
- issue: Смысл отрицания материнской причинности
  choice: Мать отрицает, что именно она даровала сыновьям дух и жизнь и определила их строение.
  alternative: Мать полностью отрицает всякую свою роль в их происхождении.
  rationale: Перевод сохраняет подчёркнутое отрицание в тексте, но не добавляет утверждения, будто отрицается обычная материнская роль.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим торжественной речи матери. Синтаксический параллелизм отрицаний сохранён; редкий греческий термин передан понятным словом «строение».
