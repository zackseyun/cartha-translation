  terminology: «Наш народ», «оставил», «потомство» и «подвергнет мучениям» соответствуют контексту и регистру. «Великое могущество» точнее соотносит μεγαλεῖον с κράτος; средний род позволяет сохранить неоднозначное «оно» в основном тексте. Альтернативный личный субъект в примечании сохранён.
