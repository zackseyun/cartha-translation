revisions:
- from: Но не думай, что Бог оставил наш народ. А ты потерпи и увидишь величие Его могущества — как оно подвергнет мучениям тебя и твоё потомство.[a]
  to: Но не думай, что Бог оставил наш народ. А ты потерпи и увидишь Его великое могущество — как оно подвергнет мучениям тебя и твоё потомство.[a]
  rationale: 'Безопасная стилистико-лексическая правка заменяет «величие Его могущества» на более прямое и современное «Его великое могущество». Неоднозначность подразумеваемого субъекта βασανιεῖ не снимается: основной текст соотносит «оно» с ближайшим существительным среднего рода «могущество», а примечание сохраняет возможное понимание Бога как субъекта действия.'
