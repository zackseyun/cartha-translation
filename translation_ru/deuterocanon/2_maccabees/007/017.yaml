base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/017.yaml
  text: But do not think that our nation has been abandoned by God. But as for you[a], endure and see his great power, how it will torture you and your offspring.
translation:
  language: ru
  text: Но не думай, что Бог оставил наш народ. А ты потерпи и увидишь Его великое могущество — как оно подвергнет мучениям тебя и твоё потомство.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как Он подвергнет мучениям тебя и твоё потомство»; в таком прочтении подразумеваемое подлежащее — Сам Бог, а не Его могущество.'
    reason: Альтернативное определение подразумеваемого субъекта глагола βασανιεῖ.
lexical_decisions:
- source_word: μὴ δόκει
  choice: не думай
  rationale: Запрет с μή и формой настоящего времени естественно передаётся прямым современным русским выражением «не думай».
- source_word: τὸ γένος ἡμῶν
  choice: наш народ
  rationale: В контексте мученичества γένος обозначает еврейский народ как общность, а не только семью или род говорящего.
- source_word: ὑπὸ τοῦ θεοῦ καταλελεῖφθαι
  choice: Бог оставил
  rationale: Перфектный инфинитив выражает состояние оставленности; активная русская конструкция естественна и точно сохраняет действующее лицо.
- source_word: σὺ δὲ καρτέρει
  choice: А ты потерпи
  rationale: 'καρτερέω означает стойко держаться, терпеть; обращённый к гонителю императив звучит как вызывающее предупреждение: ему предстоит самому испытать Божью силу.'
- source_word: θεώρει
  choice: увидишь
  rationale: Императив θεωρέω требует смотреть или наблюдать; в сочетании с «потерпи» русский вид будущего времени естественно передаёт смысл «потерпи — и увидишь».
- source_word: τὸ μεγαλεῖον αὐτοῦ κράτος
  choice: величие Его могущества
  rationale: 'Так сохраняются оба элемента выражения: μεγαλεῖον — величие, κράτος — могущество или сила.'
- source_word: ὡς σὲ καὶ τὸ σπέρμα σου βασανιεῖ
  choice: как оно подвергнет мучениям тебя и твоё потомство
  rationale: βασανίζω в данном карательном контексте означает мучить или подвергать мучениям; σπέρμα здесь обозначает потомство. Местоимение «оно» связывает действие с непосредственно предшествующим «могуществом», не устраняя возможного личного понимания субъекта.
theological_decisions:
- issue: Подразумеваемое подлежащее при βασανιεῖ
  choice: 'Ближайшим смысловым субъектом представлено Божье могущество: «как оно подвергнет мучениям».'
  alternative: 'Подразумеваемым субъектом является Сам Бог: «как Он подвергнет мучениям».'
  rationale: Греческий текст допускает связь глагола с предшествующим τὸ μεγαλεῖον αὐτοῦ κράτος, но также позволяет подразумевать Бога как личного деятеля. Основной текст следует ближайшей синтаксической связи, а примечание сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с прямым, торжественно-сдержанным звучанием. «Потерпи» сохраняет вызывающий характер обращения к гонителю; прописное «Его» следует принятой русской библейской типографической традиции.
