  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: речь о том, что Бог не оставил народ, а гонителю предстоит увидеть проявление Божьей силы, которое будет мучить его и его потомство. Однако «величие Его могущества» не является естественной или наиболее прямой передачей τὸ μεγαλεῖον αὐτοῦ κράτος: греческое выражение называет великую/могучую силу, а не «величие» этой силы. Будущее «увидишь» удачно передаёт риторическую связку двух императивов в русском языке.'
