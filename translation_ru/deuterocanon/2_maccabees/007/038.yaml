  text: and in me and my brothers bring to an end the wrath of the Almighty that has justly been kindled against our whole nation[a].
translation:
  language: ru
  text: и пусть на мне и моих братьях прекратится гнев Вседержителя, справедливо воспылавший против всего нашего народа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и пусть мной и моими братьями будет остановлен…» Буквально по-гречески: «во мне и моих братьях», то есть пусть на них гнев достигнет своего предела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στῆσαι
  choice: пусть… прекратится
  rationale: Каузативный аористный инфинитив от ἵστημι в данном контексте выражает прекращение гнева. Русская конструкция естественна и передаёт просьбу о том, чтобы гнев достиг здесь своего предела.
- source_word: παντοκράτορος
  choice: Вседержителя
  rationale: Устоявшийся и достойный русский эквивалент божественного титула παντοκράτωρ.
- source_word: ὀργήν
  choice: гнев
  rationale: Передаёт серьёзный судебный смысл божественной ὀργή, не ослабляя его до простого раздражения.
- source_word: σύμπαν ἡμῶν γένος
  choice: всего нашего народа
  rationale: В контексте γένος обозначает весь еврейский народ; это естественнее современного «род» и точнее, чем биологизирующее «раса».
- source_word: δικαίως
  choice: справедливо
  rationale: 'Сохраняет нравственно-судебную оценку: гнев возгорелся не без основания, а по справедливости.'
- source_word: ἐπημμένην
  choice: воспылавший
  rationale: 'Передаёт метафору разгоревшегося гнева и результирующее значение перфектного причастия: гнев уже воспламенён и продолжает действовать.'
- source_word: ἐν ἐμοὶ δὲ καὶ τοῖς ἀδελφοῖς μου
  choice: на мне и моих братьях
  rationale: Русское «на… прекратится» естественно выражает предел, которого гнев достигает в их страдании, сохраняя образ греческого ἐν без неидиоматичного буквального «во мне».
theological_decisions:
- issue: Мученичество как точка прекращения справедливого Божьего гнева
  choice: Текст передан как просьба, чтобы гнев Вседержителя против народа прекратился на говорящем и его братьях.
  alternative: 'Можно понять более буквально: «остановить… во мне и моих братьях» либо как то, что гнев «останется» на них.'
  rationale: Сочетание στῆσαι с ὀργήν в контексте естественнее всего означает остановить, прекратить гнев. Формулировка сохраняет напряжение текста, не вводя позднейшего технического учения об искуплении.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. «Вседержитель» сохраняет традиционную силу божественного титула; порядок слов остаётся близким к греческому, не становясь неестественным.
