base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/007/029.yaml
  text: Do not fear this executioner[a], but, becoming worthy of your brothers, accept death[c][b], so that in mercy I may receive you back together with your brothers.
translation:
  language: ru
  text: Не бойся этого палача[a], но, став достойным своих братьев, прими смерть, чтобы по милости[c] я могла вновь обрести тебя[b] вместе с твоими братьями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мучителя». Греческое δήμιος точнее означает палача, хотя в более широком контексте речь идёт и о пытках.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «получить тебя обратно» или «принять тебя». Эти слова выражают надежду матери вновь соединиться с сыном и его братьями.'
    reason: lexical_alternative
  - marker: c
    text: Слова «по милости», вероятно, указывают на Божью милость, однако Бог в этой греческой фразе прямо не назван.
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ φοβηθῇς
  choice: Не бойся
  rationale: Естественно и прямо передаёт запретительную конструкцию с μή и сохраняет тон материнского увещания.
- source_word: τὸν δήμιον τοῦτον
  choice: этого палача
  rationale: δήμιος прежде всего обозначает исполнителя казни; «палач» точно и естественно звучит по-русски в данном контексте.
- source_word: τῶν ἀδελφῶν σου ἄξιος γενόμενος
  choice: став достойным своих братьев
  rationale: Причастие γενόμενος буквально выражает становление; формулировка сохраняет сопоставление сына с его родными братьями, уже принявшими мученическую смерть.
- source_word: ἐπίδεξαι τὸν θάνατον
  choice: прими смерть
  rationale: ἐπιδέχομαι здесь означает сознательно принять предстоящую смерть; русский оборот краток и не добавляет идеи, которой нет в греческом.
- source_word: ἐν τῷ ἐλέει
  choice: по милости
  rationale: Передаёт инструментально-сферический смысл выражения естественным русским языком, не называя Бога прямо, поскольку в греческой фразе Он не назван.
- source_word: σὺν τοῖς ἀδελφοῖς σου
  choice: вместе с твоими братьями
  rationale: Точно передаёт сопровождение, выраженное σύν, и подчёркивает надежду на воссоединение.
- source_word: κομίσωμαί σε
  choice: я вновь обрела тебя
  rationale: κομίζω может означать получить или обрести обратно. «Вновь обрела» передаёт надежду матери на возвращение сына и воссоединение, не описывая явно способ воскресения.
theological_decisions:
- issue: Следует ли прямо назвать Бога источником милости в ἐν τῷ ἐλέει
  choice: Сохранить «по милости», не добавляя «Божьей».
  alternative: «по Божьей милости»
  rationale: Контекст подразумевает Божью милость, однако в самой греческой фразе Бог прямо не назван; перевод сохраняет эту имплицитность.
- issue: Оттенок воскресения и возвращения в κομίσωμαί σε
  choice: «я вновь обрела тебя»
  alternative: «я получила тебя» или «я обрела тебя»
  rationale: Выбранная формулировка сохраняет надежду на посмертное воссоединение и значение возвращения, но не делает механизм воскресения более явным, чем оригинал.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным, но понятным увещательным тоном. Синтаксис близок к греческому, при этом естественен для обычного современного читателя; богословская недосказанность оригинала сохранена.
