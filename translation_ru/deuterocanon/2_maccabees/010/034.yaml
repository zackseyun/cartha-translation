  text: 'The Romans also sent them a letter[a], worded as follows: “Quintus Memmius and Titus Manius, elders of the Romans, to the people of the Jews[b], greetings.”'
translation:
  language: ru
  text: 'Римляне также послали им письмо, в котором говорилось: «Квинт Меммий и Тит Маний, старейшины римлян[a], — народу иудеев[b]. Приветствуем вас!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «старейшины», могло здесь обозначать римских посланников или сенаторов, однако само греческое слово имеет более широкое значение.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «иудейскому народу». Буквально по-гречески: «народу иудеев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπέμψαν δὲ καὶ οἱ Ῥωμαῖοι
  choice: Римляне также послали
  rationale: Передаёт аорист Ἐπέμψαν и добавочное значение καί без уточнения, будто речь непременно идёт о римских властях.
- source_word: πρὸς αὐτοὺς ἐπιστολήν
  choice: им письмо
  rationale: Естественная русская конструкция, точно передающая адресата и обычное значение ἐπιστολή.
- source_word: ἔχουσαν οὕτως
  choice: в котором говорилось
  rationale: Естественная формула введения содержания письма; буквальное «содержавшее следующее» было бы тяжелее.
- source_word: Κόιντος Μέμμιος, Τίτος Μάνιος
  choice: Квинт Меммий и Тит Маний
  rationale: Имена переданы в традиционной русской форме, а бессоюзное греческое перечисление для ясности соединено союзом «и».
- source_word: πρεσβυταὶ Ῥωμαίων
  choice: старейшины римлян
  rationale: Сохраняет широкое прямое значение πρεσβυταί и не конкретизирует должность как «сенаторы» или «послы», хотя такие толкования возможны по историческому контексту.
- source_word: τῷ δήμῳ τῶν Ἰουδαίων
  choice: народу иудеев
  rationale: Передаёт δῆμος как народ, понимаемый также в общественно-политическом смысле, и сохраняет структуру греческого выражения.
- source_word: χαίρειν
  choice: Приветствуем вас!
  rationale: Функциональный русский эквивалент стандартной греческой эпистолярной формулы приветствия.
