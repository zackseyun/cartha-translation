    reason: lexical_alternative
lexical_decisions:
- source_word: ἃ δὲ ἔκρινεν
  choice: А относительно того, что решено
  rationale: Греческая конструкция с формой единственного числа ἔκρινεν сжата и допускает неявный субъект. Безличное «решено» сохраняет эту неопределённость и естественно звучит по-русски.
- source_word: προσανενεχθῆναι τῷ Βασιλεῖ
  choice: представить царю
  rationale: Глагол обозначает вынесение вопроса на рассмотрение высшей власти; «представить царю» не уточняет без основания, идёт ли речь об устном докладе или письменном обращении.
- source_word: πέμψατέ τινα παραχρῆμα
  choice: немедленно пришлите кого-нибудь
  rationale: Императив выражает распоряжение, а παραχρῆμα — безотлагательность. В контексте адресату велено направить человека к авторам письма, поэтому «пришлите» естественнее общего «пошлите».
- source_word: ἐπισκεψόμενον περὶ τούτων
  choice: чтобы он рассмотрел эти вопросы
  rationale: 'Причастие будущего времени указывает на цель отправки человека: изучить или обсудить затронутые вопросы. «Рассмотрел» сохраняет официальный оттенок без чрезмерного усиления до «расследовал».'
- source_word: ἵνʼ ἔχωμεν ὡς καθήκει ἡμῖν
  choice: и тогда мы сможем поступить так, как нам подобает
  rationale: Буквальное «чтобы мы имели» по-русски неполно. Передан практический смысл возможности действовать надлежащим образом, при этом местоимение ἡμῖν переведено как «нам».
- source_word: ἡμεῖς γὰρ προσάγομεν πρὸς Ἀντιοχίαν
  choice: Ведь мы направляемся в Антиохию
  rationale: Настоящее время προσάγομεν обозначает продолжающееся или предстоящее движение к городу; «направляемся» соответствует официальному тону письма.
