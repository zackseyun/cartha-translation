base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/007.yaml
  text: But Maccabeus himself was the first to take up arms[a], and he urged the others, by risking danger together with him, to come to the aid of their brothers[b]; and together they also charged out eagerly.
translation:
  language: ru
  text: Сам Маккавей первым взялся за оружие и призвал остальных разделить с ним опасность[a] и прийти на помощь своим братьям[b]. И все они вместе с готовностью выступили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призвал остальных, разделявших с ним опасность, прийти на помощь». Греческое причастие подчёркивает, что они подвергались опасности вместе с Маккавеем.'
    reason: syntactic_ambiguity
  - marker: b
    text: Здесь «братья» может означать соплеменников — других иудеев.
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ πρῶτος ὁ Μακκαβαῖος
  choice: Сам Маккавей первым
  rationale: Предикативное πρῶτος указывает, что Маккавей первым подал пример; αὐτός передано усилительным «сам».
- source_word: ἀναλαβὼν τὰ ὅπλα
  choice: взялся за оружие
  rationale: Устойчивое русское выражение естественно передаёт буквальное «взяв оружие» в значении вооружиться и приступить к борьбе.
- source_word: προετρέψατο
  choice: призвал
  rationale: Глагол обозначает настойчивое побуждение к действию; «призвал» соответствует военному контексту и сохраняет достоинство стиля.
- source_word: ἅμα αὐτῷ διακινδυνεύοντας
  choice: разделить с ним опасность
  rationale: Передаёт совместное принятие риска; конструкция с инфинитивом естественна по-русски, хотя греческий использует причастие.
- source_word: ἐπιβοηθεῖν
  choice: прийти на помощь
  rationale: Сохраняет значение срочной поддержки, выраженное сложным греческим глаголом.
- source_word: τοῖς ἀδελφοῖς αὐτῶν
  choice: своим братьям
  rationale: Сохраняет образное и социально-религиозное обозначение ἀδελφοί; в данном контексте речь может идти о соплеменниках-иудеях.
- source_word: ὁμοῦ δὲ καὶ προθύμως ἐξώρμησαν
  choice: И все они вместе с готовностью выступили
  rationale: ὁμοῦ передано как совместное действие, προθύμως — как готовность и рвение, а ἐξώρμησαν — как энергичное выступление, без добавления не названного прямо объекта атаки.
theological_decisions:
- issue: Значение ἀδελφοῖς в национально-военном контексте
  choice: своим братьям
  alternative: своим соплеменникам / другим иудеям
  rationale: Буквальное «братьям» сохраняет лексику источника и её оттенок общинной солидарности; возможное контекстуальное значение пояснено в сноске, а не подменено в основном тексте.
- issue: Связь причастия διακινδυνεύοντας с призывом Маккавея
  choice: призвал остальных разделить с ним опасность
  alternative: призвал остальных, разделявших с ним опасность, прийти на помощь
  rationale: Основной текст понимает причастие обстоятельственно, как участие остальных в риске вместе с Маккавеем. Синтаксис допускает более описательное прочтение, поэтому напряжение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Военная энергия оригинала сохранена без добавления выражения «в бой», которого в греческом тексте прямо нет. Все маркеры сносок размещены непосредственно после соответствующих выражений.
