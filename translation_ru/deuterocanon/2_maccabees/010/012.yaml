  text: But most of them escaped wounded and naked[a]; and Lysias himself also escaped by fleeing shamefully.
translation:
  language: ru
  text: Большинство из них — раненые и нагие[a] — спаслось; и сам Лисий спасся, с позором обратившись в бегство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишённые одежды», «раздетые»; возможно, они бежали, потеряв в бою снаряжение или верхнюю одежду.'
    reason: γυμνοί буквально означает «нагие», но в военном контексте может подразумевать утрату одежды или снаряжения.
lexical_decisions:
- source_word: οἱ πλείονες
  choice: большинство из них
  rationale: Субстантивированная сравнительная форма обозначает бо́льшую часть группы; это естественная и точная передача количественного смысла.
- source_word: τραυματίαι
  choice: были ранены
  rationale: Слово обозначает раненых людей. Предикативная конструкция по-русски естественно передаёт их состояние при спасении.
- source_word: γυμνοὶ
  choice: обнажены
  rationale: Греческое слово может означать «нагие» или «лишённые одежды/снаряжения». «Обнажены» сохраняет прямой образ и допускает военный контекст утраты одежды или доспехов.
- source_word: διεσώθησαν
  choice: спаслись
  rationale: В военном повествовании глагол означает уцелеть и благополучно выбраться; «спаслись» сохраняет оба оттенка без лишнего уточнения.
- source_word: αὐτὸς δὲ ὁ Λυσίας
  choice: спасся и сам Лисий
  rationale: Частица δέ и усилительное αὐτός переданы естественным русским оборотом с «и сам», который отмечает переход к судьбе Лисия.
- source_word: αἰσχρῶς
  choice: позорно
  rationale: Наречие выражает отрицательную оценку бегства как постыдного или бесславного.
- source_word: φεύγων
  choice: бежав
  rationale: Причастие обозначает сопутствующее обстоятельство или средство спасения. Деепричастие сохраняет сжатую структуру оригинала.
- source_word: διεσώθη
  choice: спасся
  rationale: Повтор того же глагола сохранён в русском тексте, как и в греческом, подчёркивая параллель между войском и Лисием.
