lexical_decisions:
- source_word: λεόντινων
  choice: по-львиному
  rationale: Редкая форма передаёт сравнение с львами и яростный характер нападения; наречие естественно сочетается с последующим причастием.
- source_word: ἐντινάξαντες
  choice: бросившись на
  rationale: Причастие обозначает резкое, стремительное движение против врага; «бросившись на» сохраняет динамику и образ львиного нападения.
- source_word: κατέστρωσαν
  choice: сразили
  rationale: В военном контексте глагол означает повергнуть, уложить противника; «сразили» ясно передаёт смертельный исход, не звуча ни разговорно, ни архаично.
- source_word: χιλίους πρὸς τοῖς μυρίοις
  choice: одиннадцать тысяч
  rationale: Греческая добавочная конструкция буквально выражает тысячу сверх десяти тысяч; итоговое число естественнее для современного русского текста.
- source_word: ἱππεῖς
  choice: всадников
  rationale: Слово обозначает конных воинов; «всадников» точно и понятно, не превращая людей в абстрактный род войск.
- source_word: ἑξακοσίους πρὸς χιλίοις
  choice: тысячу шестьсот
  rationale: Добавочная числовая конструкция означает шестьсот сверх тысячи; в основном тексте дано итоговое число.
- source_word: ἠνάγκασαν φεύγειν
  choice: вынудили бежать
  rationale: 'Сохраняет каузативную силу конструкции: противника заставили обратиться в бегство.'
