  naturalness: Текст в целом современный и литературный. Перестановка «одиннадцать тысяч из них» делает фразу значительно прозрачнее. Союз «а» в заключительной части неоправданно противопоставляет результат предшествующему сообщению; греческое δέ здесь естественнее передать простым «и».
