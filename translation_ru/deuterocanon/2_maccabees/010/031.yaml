  text: that the Jews should make use of their own resources and laws as before[a], and that none of them should in any way be harassed concerning the things done in ignorance.
translation:
  language: ru
  text: чтобы иудеи, как и прежде, пользовались собственными средствами[a] и законами и чтобы никто из них никоим образом не подвергался притеснениям в связи с тем, что было сделано по неведению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собственными расходами»; греческое слово может обозначать расходы либо материальные средства содержания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χρῆσθαι
  choice: пользовались
  rationale: Инфинитив χρῆσθαι выражает содержание постановления и означает «пользоваться, употреблять»; в русском синтаксически естественно передан придаточным с «чтобы».
- source_word: τοῖς ἑαυτῶν δαπανήμασιν
  choice: собственными средствами[a]
  rationale: Редкое δαπάνημα связано с расходами и материальными средствами. «Средствами» естественно обозначает доступное общине материальное обеспечение, а более буквальный вариант отмечен в сноске.
- source_word: νόμοις
  choice: законами
  rationale: νόμος прямо означает «закон»; перевод не подменяет его более широким понятием обычаев.
- source_word: καθὰ καὶ τὸ πρότερον
  choice: как и прежде
  rationale: Кратко и естественно передаёт восстановление прежнего порядка.
- source_word: παρενοχληθήσεται
  choice: не притесняли
  rationale: Глагол означает причинять беспокойство, препятствовать или подвергать притеснению. «Не притесняли» уместно передаёт официальное или общественное вмешательство; форма с «чтобы» согласована с контекстом постановления.
- source_word: περὶ τῶν ἠγνοημένων
  choice: за то, что было сделано по неведению
  rationale: Субстантивированное причастие сохраняет неопределённость относительно конкретных поступков или обстоятельств; «по неведению» передаёт отсутствие знания, не уточняя его причину.
