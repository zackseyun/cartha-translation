lexical_decisions:
- source_word: ἦσαν γὰρ γεγραμμέναι
  choice: Ибо … были написаны
  rationale: Передаёт пояснительное γάρ и перифрастическую пассивную конструкцию с предшествующим результатом, сохраняя естественный русский порядок слов.
- source_word: ἐπιστολαὶ
  choice: письма
  rationale: Обычное современное обозначение официальной письменной корреспонденции.
- source_word: τοῖς Ἰουδαίοις
  choice: иудеям
  rationale: Дательный падеж обозначает адресатов писем.
- source_word: παρὰ μὲν Λυσίου
  choice: от Лисия
  rationale: παρά с родительным указывает на источник или отправителя; частица μέν оставлена без отдельного выражения, поскольку её смысловая пара находится за пределами данного отрывка.
- source_word: περιέχουσαι τὸν τρόπον τοῦτον
  choice: следующего содержания
  rationale: Естественная русская формула введения цитируемого текста документа; сохраняет возможность понимать τρόπος как содержание, формулировку или вид письма.
- source_word: τῷ πλήθει τῶν Ἰουδαίων
  choice: всему сообществу иудеев
  rationale: πλῆθος здесь обозначает совокупность, всё сообщество адресатов; «сообщество» по-русски естественнее буквального «множество» и не превращает выражение в название формального собрания.
- source_word: χαίρειν
  choice: Приветствую вас!
  rationale: Передаёт принятую греческую эпистолярную формулу живым и понятным русским приветствием, а не буквальным «радоваться».
