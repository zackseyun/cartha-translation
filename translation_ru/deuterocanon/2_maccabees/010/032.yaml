lexical_decisions:
- source_word: πέπομφα
  choice: я послал
  rationale: Греческий перфект передаёт совершённую отправку, результат которой актуален в момент письма.
- source_word: δὲ καὶ
  choice: также
  rationale: В данном кратком контексте естественно передаёт добавочное значение сочетания частиц.
- source_word: παρακαλέσοντα
  choice: чтобы он обратился к вам с призывом
  rationale: Причастие будущего времени выражает цель отправки; формулировка сохраняет широкий смысл παρακαλέω — обращаться, призывать, убеждать или ободрять — не уточняя не названное в предложении содержание призыва.
