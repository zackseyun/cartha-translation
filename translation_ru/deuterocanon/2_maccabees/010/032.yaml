review_pass:
  verdict: revise
  source_fidelity: 'πέπομφα δὲ καὶ τὸν Μενέλαον παρακαλέσοντα ὑμᾶς означает: «Я также послал Менелая, чтобы он обратился к вам / поддержал (ободрил) вас». Будущее причастие παρακαλέσοντα выражает цель посылки. Смысловое поле παρακαλέω включает увещевание, настоятельное побуждение и ободрение; конкретный оттенок в изолированной фразе не следует чрезмерно сужать.'
  naturalness: «Обратился к вам с призывом» понятно, но тяжеловесно и несколько менее естественно, чем прямое «послал к вам Менелая, чтобы он поддержал вас». Добавление «к вам» естественно раскрывает направление, подразумеваемое при глаголе «послал», и не меняет смысла.
  terminology: Имя «Менелай» передано нормативно. «Поддержал вас» — современное литературное и достаточно широкое соответствие παρακαλέω; примечание сохраняет альтернативные побудительные оттенки. Английское audit trail («urge you») поддерживает возможность «увещевать/побуждать», но не устраняет греческой многозначности.
  issues:
  - severity: low
    issue: Основной текст передаёт παρακαλέω через громоздкое «обратился к вам с призывом».
    rationale: Формулировка допустима, но звучит канцелярски и акцентирует именно призыв. Более естественное «поддержал вас» сохраняет широкий, неуточнённый контекстом смысл глагола.
  - severity: high
    issue: Ссылка/идентификатор расходится со стандартной нумерацией.
    rationale: Указанная греческая фраза в обычной нумерации 2 Маккавейской относится к 11:32, а не к 10:32. Это не исправляется изменением перевода стиха и требует редакторской проверки метаданных.
  revised_text: Я также послал к вам Менелая, чтобы он поддержал вас.[a]
  revised_footnotes:
  - marker: a
    text: 'Или: «увещевал вас», «побуждал вас» или «ободрил вас».'
    reason: Глагол παρακαλέω может обозначать поддержку или ободрение, а также увещевание либо настоятельное побуждение; данная фраза не уточняет, какой именно оттенок имеется в виду.
  revision_rationale: 'Перевод упрощён до естественной современной русской конструкции и сохранена лексическая многозначность παρακαλέω в примечании. Требуется отдельно сверить идентификатор: исходный греческий текст соответствует 2 Маккавейской 11:32 в стандартной нумерации.'
