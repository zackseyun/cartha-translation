  text: Я также послал Менелая, чтобы он обратился к вам с призывом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы он убедил вас»; возможны также значения «увещевал вас» или «ободрил вас».'
