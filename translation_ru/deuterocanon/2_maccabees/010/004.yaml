  text: not at all taking into account the might of God[a], but puffed up by the tens of thousands of foot soldiers, the thousands of horsemen, and the eighty elephants.
translation:
  language: ru
  text: совершенно не принимая в расчёт могущество Бога[a], но возгордившись десятками тысяч пеших воинов, тысячами всадников и восемьюдесятью слонами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершенно не считаясь с силой Бога».'
    reason: Лексико-синтаксическая альтернатива для ἐπιλογιζόμενος и κράτος.
lexical_decisions:
- source_word: οὐδάμως
  choice: совершенно не
  rationale: Передаёт усиленное полное отрицание естественным современным русским оборотом.
- source_word: ἐπιλογιζόμενος
  choice: принимая в расчёт
  rationale: Причастие выражает обдумывание и расчёт; оборот уместен в военном контексте и сохраняет оттенок неспособности считаться с решающей силой.
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: могущество Бога
  rationale: κράτος здесь означает силу, мощь; «могущество» ясно противопоставлено перечисленным военным ресурсам и не сводит выражение к абстрактному господству.
- source_word: πεφρονηματισμένος
  choice: возгордившись
  rationale: Передаёт состояние надменной самоуверенности. Русское деепричастие естественно связывает гордость с опорой на численность войска.
- source_word: μυριάσιν τῶν πεζῶν
  choice: десятками тысяч пеших воинов
  rationale: Сохраняет возможное числовое значение μυριάς и не превращает его в неопределённое «бесчисленное множество».
- source_word: χιλιάσι τῶν ἱππέων
  choice: тысячами всадников
  rationale: Форма множественного числа указывает на несколько тысяч; «всадники» — прямой и естественный эквивалент.
- source_word: ἐλέφασιν τοῖς ὀγδοήκοντα
  choice: восемьюдесятью слонами
  rationale: Точно передаёт указанное число и согласуется с рядом военных сил в творительном падеже после «возгордившись».
theological_decisions:
- issue: Передача κράτος применительно к Богу
  choice: могущество Бога
  alternative: сила Бога; власть Бога
  rationale: Контекст противопоставляет Божью мощь человеческим военным силам. «Могущество» сохраняет это противопоставление, не навязывая более отвлечённого значения верховной власти.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Начальная строчная буква сохраняет синтаксическую зависимость данного фрагмента от предыдущего контекста; перечисление звучит ясно и без излишней архаизации.
