base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/025.yaml
  text: Therefore[a], since we choose that this nation also should be free from disturbance, we judge that the sanctuary should be restored to them[c][b], and that they should live according to the customs of their ancestors.
translation:
  language: ru
  text: Итак, желая, чтобы и этот народ был свободен от смуты, мы постановляем[a], чтобы ему было возвращено святилище[b] и чтобы он жил[c] по обычаям своих предков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы решаем». Греческое κρίνομεν здесь относится к официальному властному решению.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «храм». Греческое τὸ ἱερὸν может обозначать святилище или храмовый комплекс.'
    reason: lexical_alternative
  - marker: c
    text: Глагол πολιτεύεσθαι может подразумевать не только личный образ жизни, но и устройство общественной жизни.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρούμενοι
  choice: желая
  rationale: Причастие выражает осознанное предпочтение или принятое намерение и вводит основание официального решения. «Желая» естественно передаёт эту связь, не сливая αἱρούμενοι с последующим κρίνομεν.
- source_word: ἔθνος
  choice: народ
  rationale: В данном административном контексте слово обозначает иудеев как отдельную общность. Русское «народ» сохраняет коллективный смысл и звучит естественнее, чем политически более узкое «нация».
- source_word: ἐκτὸς ταραχῆς εἶναι
  choice: быть свободным от смуты
  rationale: Оборот указывает на свободу от общественного волнения или беспорядка; «смута» сохраняет общественно-политический оттенок ταραχή.
- source_word: κρίνομεν
  choice: мы постановляем
  rationale: В официально-административной речи глагол обозначает властное решение. «Постановляем» точнее по регистру, чем буквальное «считаем» или «судим».
- source_word: τὸ ἱερὸν
  choice: святилище
  rationale: Ἱερόν может обозначать священное место или весь храмовый комплекс. «Святилище» сохраняет эту широту, не сводя значение только к зданию храма.
- source_word: ἀποκατασταθῆναι αὐτοῖς
  choice: чтобы ему было возвращено
  rationale: Пассивный инфинитив означает восстановление прежнего положения или возвращение объекта народу; русская безлично-пассивная конструкция сохраняет официальный характер формулировки.
- source_word: πολιτεύεσθαι
  choice: чтобы он жил
  rationale: С глаголом могут быть связаны гражданские и общественные оттенки, однако в сочетании с обычаями предков он охватывает весь уклад жизни. Краткое «жил» естественно по-русски, а более широкий оттенок отмечен в сноске.
- source_word: κατὰ τὰ ἐπὶ τῶν προγόνων αὐτῶν ἔθη
  choice: по обычаям своих предков
  rationale: Фраза указывает на традиционные нормы, существовавшие при предках. Выбранная формулировка ясна, лаконична и сохраняет историческую отнесённость.
