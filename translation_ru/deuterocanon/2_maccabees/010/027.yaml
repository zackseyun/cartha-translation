lexical_decisions:
- source_word: Πρὸς δὲ τὸ ἔθνος
  choice: А народу
  rationale: Πρός с винительным указывает адресата письма; ἔθνος здесь обозначает иудейский народ как единое сообщество. Частица δέ передана связующим «а».
- source_word: ἡ τοῦ βασιλέως ἐπιστολὴ τοιαύδε ἦν
  choice: царское письмо гласило следующее
  rationale: Естественная русская формула введения прямой цитаты сохраняет смысл τοιαύδε и официальный характер ἐπιστολή.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: Царь Антиох
  rationale: Сохраняется вынесенный вперёд царский титул, а имя передаётся в принятой русской библейской форме.
- source_word: τῇ γερουσίᾳ τῶν Ἰουδαίων
  choice: совету старейшин иудеев
  rationale: γερουσία обозначает официальный коллегиальный орган старейшин; «совет старейшин» ясно передаёт институциональный смысл без римской ассоциации слова «сенат».
- source_word: τοῖς ἄλλοις Ἰουδαίοις
  choice: остальным иудеям
  rationale: ἄλλοις отличает весь прочий иудейский народ от уже названного совета; «остальным» естественно выражает эту связь.
- source_word: χαίρειν
  choice: приветствие
  rationale: В начале письма инфинитив χαίρειν служит устойчивой формулой приветствия, а не призывом радоваться.
