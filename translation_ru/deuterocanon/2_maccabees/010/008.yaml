  rationale: Перевод перестроен так, чтобы прямо передать ἐφάνη глаголом «появился» и ясно связать оба последующих причастных описания со всадником. «Золотые доспехи» точнее отражают πανοπλία; примечание сохраняет допустимую альтернативу. Фигура не называется ангелом или иным небесным существом, поскольку греческий текст этого не говорит.
