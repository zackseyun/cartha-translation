  text: And while they were there near Jerusalem[a], a horseman appeared, going before them[b], clothed in white and brandishing golden armor.
translation:
  language: ru
  text: Когда они находились там, близ Иерусалима, появился всадник[a] в белом одеянии, ехавший впереди них и размахивавший золотыми доспехами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст не уточняет, кто этот всадник. Его описание может указывать на небесное или ангельское явление, но прямо этого не утверждает.
    reason: theological_ambiguity
  - marker: b
    text: 'Или: «золотым вооружением». Греческое слово может обозначать полный комплект боевого снаряжения или доспехи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτόθι δὲ πρὸς τοῖς Ἱεροσολύμοις ὄντων
  choice: И когда они находились там, близ Иерусалима
  rationale: Генитивная конструкция передана естественным русским придаточным времени; αὐτόθι сохраняется как «там», а πρός с дательным — как указание на близость к Иерусалиму.
- source_word: ἐφάνη
  choice: явившийся
  rationale: Форма обозначает появление или внезапное обнаружение фигуры; перевод не уточняет, было ли это видением.
- source_word: προηγούμενος αὐτῶν
  choice: перед ними ехал
  rationale: Причастие указывает, что всадник двигался впереди отряда. Формулировка сохраняет пространственный смысл, не утверждая прямо, что он руководил ими.
- source_word: ἔφιππος
  choice: всадник
  rationale: Субстантивированное «всадник» естественно передаёт греческое обозначение находящегося верхом человека.
- source_word: ἐν λευκῇ ἐσθῆτι
  choice: в белом одеянии
  rationale: «Одеяние» сохраняет достоинство повествовательного регистра и не конкретизирует вид одежды.
- source_word: πανοπλίαν χρυσῆν
  choice: золотым вооружением
  rationale: πανοπλία означает полное боевое снаряжение или вооружение. «Вооружение» лучше сочетается с активным жестом, чем буквальные «доспехи», при этом не сводит выражение к одному виду оружия.
- source_word: κραδαίνων
  choice: потрясая
  rationale: Глагол передаёт энергичное размахивание или потрясание предметом и сохраняет яркий воинский образ.
theological_decisions:
- issue: Природа явившегося всадника
  choice: Фигура названа только всадником, как в греческом тексте.
  alternative: «Ангельский всадник» или «небесный всадник».
  rationale: Описание допускает сверхъестественное понимание, однако прямо не называет явившегося ангелом или небесным существом.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Сохранены зрительный воинский образ и неопределённость природы всадника. В предоставленных метаданных имеется существенное расхождение: данный греческий текст в принятой нумерации соответствует 2 Маккавейской 11:8, а не 10:8; перевод выполнен по непосредственно предоставленному греческому источнику.'
