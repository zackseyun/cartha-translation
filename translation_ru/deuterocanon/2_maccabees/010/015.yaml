revisions:
- from: Маккавей согласился на всё, к чему призывал Лисий, заботясь об общем благе. Ведь всё, что Маккавей письменно предложил Лисию относительно иудеев, письмоводитель одобрил.
  to: Маккавей согласился на всё, к чему призывал Лисий, считая это полезным. Ведь всё, что Маккавей изложил Лисию письменно относительно иудеев, секретарь принял.
  rationale: Исправление устраняет добавленное понятие «общего» блага, делает служебный титул современным и естественным и передаёт заключительный глагол как принятие письменных условий. Смысл и неоднозначность исходного текста сохранены.
