  yaml_path: translation/deuterocanon/2_maccabees/010/026.yaml
  text: Therefore you will do well to send to them and give them pledges of good faith[a], so that, knowing our intention[c][b], they may be encouraged and may live gladly with support for their own interests.
translation:
  language: ru
  text: Итак, ты хорошо поступишь, если пошлёшь к ним и дашь им заверения в доброй воле[a], чтобы они, узнав о нашем намерении, ободрились[b] и жили в радости, получая поддержку в своих делах[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дав им правые руки» — греческое выражение, означающее дать заверения в мире или доброй воле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «были в хорошем расположении духа».'
    reason: lexical_alternative
  - marker: c
    text: 'Выражение может также означать: «получая помощь в отношении своего имущества» или «с поддержкой своих интересов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὖ οὖν ποιήσεις
  choice: Итак, ты хорошо поступишь
  rationale: Передаёт идиоматическую форму совета и одобрения, выраженную будущим временем.
- source_word: διαπεμψάμενος πρὸς αὐτούς
  choice: если пошлёшь к ним
  rationale: 'Сохраняет неопределённость греческого выражения: речь может идти о послании или посланниках, но объект прямо не назван.'
- source_word: δοὺς δεξιάς
  choice: дашь им заверения в добрых намерениях
  rationale: Греческая идиома буквально говорит о подаче правых рук и обозначает гарантии мира, верности или благонадёжности; буквальный перевод был бы неясен современному читателю.
- source_word: τὴν ἡμετέραν προαίρεσιν
  choice: о нашем решении
  rationale: προαίρεσις обозначает осознанное намерение, принятое решение или избранный образ действий; «решение» естественно в дипломатическом контексте.
- source_word: εὔθυμοί τε ὦσιν
  choice: ободрились
  rationale: Передаёт состояние бодрости духа и уверенности, возникающее после известия о благоприятном решении.
- source_word: ἡδέως διαγίνωνται
  choice: жили спокойно
  rationale: Сочетание означает приятно или благополучно проводить время, жить без тревоги; «спокойно» естественно сочетается с контекстом предоставленных гарантий.
- source_word: πρὸς τῇ τῶν ἰδίων ἀντιλήψει
  choice: получая поддержку в своих делах
  rationale: ἀντίληψις означает помощь или поддержку, а τὰ ἴδια может относиться как к собственным делам и интересам, так и к имуществу; основной текст не сужает смысл до владений.
