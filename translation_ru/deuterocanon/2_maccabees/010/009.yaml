  yaml_path: translation/deuterocanon/2_maccabees/010/009.yaml
  text: And all together they blessed the merciful God and were strengthened in their souls[b][a], being ready to wound not only men but even the fiercest wild beasts and iron walls.
translation:
  language: ru
  text: И все вместе благословили милосердного Бога и укрепились душой,[a] готовые поражать не только людей, но и самых свирепых зверей и железные стены.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ободрились»; буквально: «укрепились душами».'
    reason: lexical_alternative
  - marker: b
    text: Выражение о готовности поражать железные стены, вероятно, является гиперболой, подчёркивающей их чрезвычайную отвагу в бою.
    reason: cultural_note
lexical_decisions:
- source_word: ὁμοῦ δὲ πάντες
  choice: И все вместе
  rationale: Передаёт совместность и всеобщность действия, выраженные сочетанием ὁμοῦ и πάντες; δέ естественно передано союзом «и».
- source_word: εὐλόγησαν
  choice: благословили
  rationale: Прямое и традиционное библейское соответствие глаголу εὐλογέω, когда действие направлено к Богу.
- source_word: τὸν ἐλεήμονα θεόν
  choice: милосердного Бога
  rationale: Сохраняет атрибутивную конструкцию и библейский смысл ἐλεήμων без конфессионального уточнения.
- source_word: ἐπερρώσθησαν ταῖς ψυχαῖς
  choice: укрепились душой
  rationale: Естественная русская формулировка, сохраняющая образ внутреннего укрепления и слово ψυχή, но не превращающая его в техническое антропологическое понятие.
- source_word: τιτρώσκειν
  choice: поражать
  rationale: «Поражать» применимо и к живым противникам, и метафорически к стенам; оно естественнее русского «ранить стены» и сохраняет воинственный смысл инфинитива.
- source_word: οὐ μόνον ἀνθρώπους θῆρας δὲ τοὺς ἀγριωτάτους καὶ σιδηρᾶ τείχη
  choice: не только людей, но и самых свирепых зверей и железные стены
  rationale: Сохраняет нарастающий ряд объектов и гиперболическую смелость греческой фразы.
- source_word: ὄντες ἕτοιμοι
  choice: готовые
  rationale: Кратко и естественно передаёт обстоятельственный причастный оборот, связывающий внутреннее укрепление с готовностью действовать.
theological_decisions:
- issue: Антропологический оттенок ψυχαῖς
  choice: укрепились душой
  alternative: ободрились; укрепились духом
  rationale: Контекст говорит прежде всего о внутренней решимости, а не формулирует учение о составе человека. «Душой» сохраняет лексику источника и не отождествляет ψυχή без необходимости с «духом».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан естественным для русского чтения; военная гипербола и неоднозначность ψυχαῖς сохранены.
