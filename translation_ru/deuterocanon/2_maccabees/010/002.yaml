lexical_decisions:
- source_word: συναθροίσας
  choice: Собрав
  rationale: 'Аористное причастие обозначает действие, предшествующее основному: сначала он собрал войско, затем выступил.'
- source_word: περὶ τὰς ὀκτὼ μυριάδας
  choice: около восьмидесяти тысяч воинов
  rationale: Одна μυριάς — десять тысяч, поэтому восемь мириад — восемьдесят тысяч; περὶ при числительном передаёт приблизительность. Слово «воинов» добавлено по военному контексту.
- source_word: τὴν ἵππον ἅπασαν
  choice: всю конницу
  rationale: В военном контексте ἵππος обозначает конницу как род войск, а ἅπασαν подчёркивает её полный состав.
- source_word: παρεγένετο ἐπὶ τοὺς Ἰουδαίους
  choice: он выступил против иудеев
  rationale: В сочетании с ἐπί и винительным падежом оборот выражает направленное военное выступление против противника, а не простое прибытие.
- source_word: λογιζόμενος
  choice: рассчитывая
  rationale: Причастие передаёт обдуманное намерение или замысел, не усиливая его до значения окончательного постановления.
- source_word: τὴν μὲν πόλιν
  choice: город
  rationale: Речь идёт об известном из контекста городе, Иерусалиме; частица μέν вводит первую часть противопоставления, продолжающегося далее.
- source_word: Ἕλλησιν
  choice: греков
  rationale: Дательный падеж указывает, для кого город предполагалось устроить как место проживания; «греков» естественно передаёт смысл в русском языке.
- source_word: οἰκητήριον ποιήσειν
  choice: превратить … в место поселения
  rationale: Оборот означает намерение сделать город местом постоянного проживания; выбранная формулировка ясна и сохраняет идею преобразования.
