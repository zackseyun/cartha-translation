lexical_decisions:
- source_word: ἔπεισεν
  choice: убедил
  rationale: Аорист πείθω прямо обозначает убеждение; выбор также сохраняет связь с последующим πείσει («убедит»). Дополнение «его» восстанавливается из контекста, поскольку в данном греческом фрагменте оно не выражено явно.
- source_word: συλλύεσθαι
  choice: прийти к соглашению
  rationale: Редкий и лексически трудный глагол в дипломатическом контексте, вероятнее всего, означает достижение соглашения или примирение. Формулировка не сужает смысл до строго юридической сделки.
- source_word: ἐπὶ πᾶσι τοῖς δικαίοις
  choice: по всем справедливым требованиям
  rationale: Субстантивированное δικαίοις обозначает справедливые или правомерные предметы переговоров. «Требования» естественно передаёт вероятный контекст, а сноска сохраняет более широкие варианты.
- source_word: διότι καὶ τὸν βασιλέα πείσει
  choice: и в том, что убедит также царя
  rationale: διότι допускает содержательное и причинное понимание. Основной текст принимает его как введение содержания заверения, сохраняя будущее значение πείσει.
- source_word: φίλον αὐτοῖς
  choice: их другом
  rationale: Передаёт благоприятное, вероятно политическое, расположение царя к ним; речь не обязательно идёт о личной дружбе.
- source_word: ἀναγκάζων γενέσθαι
  choice: вынудив его стать
  rationale: ἀναγκάζω выражает сильное принуждение. Деепричастная конструкция сохраняет связь причастия с действием убеждения, не ослабляя его силы.
