  text: Поэтому поспешите и пошлите нескольких человек, чтобы и мы узнали, каковы ваши намерения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каков ваш образ мыслей»; также возможно: «каков ваш настрой» или «какова ваша позиция». Греческий оборот может указывать на настрой, решение или намерение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт выводное значение союза и ясно связывает просьбу с предшествующими обстоятельствами.
- source_word: σπεύσατε
  choice: поспешите
  rationale: Аористный императив выражает требование действовать без промедления; «поспешите» естественно и достойно звучит в современном литературном русском.
- source_word: πέμψατέ τινας
  choice: пошлите нескольких человек
  rationale: Неопределённое множественное τινας означает «некоторых, нескольких [лиц]»; контекст допускает посланников или представителей, но исходный текст прямо их так не называет.
- source_word: ὅπως
  choice: чтобы
  rationale: Естественно передаёт целевое значение греческого союза.
- source_word: καὶ ἡμεῖς
  choice: и мы
  rationale: 'Сохраняет включительно-усилительное значение καί при местоимении: «мы также».'
- source_word: ἐπιγνῶμεν
  choice: узнали
  rationale: Аористный конъюнктив ἐπιγινώσκω здесь обозначает получение или выяснение сведений; «узнали» не перегружает значение приставки.
- source_word: ὁποῖοί ἐστε γνώμης
  choice: каковы ваши намерения
  rationale: Греческий оборот буквально спрашивает, «каковы вы по образу мыслей/мнению»; в данном обращении естественный смысл — намерения, настрой или решение адресатов.
