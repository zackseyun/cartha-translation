base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/024.yaml
  text: having heard that the Jews did not approve of their father's change to Greek ways[a], but were choosing their own way of life and requesting that their own laws be permitted to them[b],
translation:
  language: ru
  text: услышав, что иудеи не одобряют перемены, совершённой его отцом и направленной на введение греческих обычаев[a], но предпочитают собственный образ жизни и просят разрешить им соблюдать свои установления[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перемены его отца в сторону греческого образа жизни». Греческое выражение сжато и относится к введению греческих культурных обычаев; в контексте «его отец» — отец упомянутого ранее правителя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «разрешить им соблюдать свои законы»; греческое слово может обозначать как законы, так и установленные обычаи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκηκοότες
  choice: услышав
  rationale: Перфектное причастие употреблено обстоятельственно и обозначает действие, предшествующее дальнейшему повествованию; деепричастие естественно сохраняет синтаксическую связь.
- source_word: μὴ συνεὐδοκοῦντας
  choice: не одобряют
  rationale: Передаёт значение согласия или одобрения без излишнего усиления до открытого противодействия.
- source_word: τῇ τοῦ πατρὸς εἰς τὰ Ἑλληνικὰ μεταθέσει
  choice: перехода их отца к греческим обычаям
  rationale: μετάθεσις обозначает перемену или переход, а τὰ Ἑλληνικά — греческие культурные и бытовые установления, не только язык. Местоимение «их» проясняет подразумеваемое отношение, не устраняя сжатость выражения.
- source_word: τὴν ἑαυτῶν ἀγωγὴν αἱρετίζοντας
  choice: предпочитают собственный образ жизни
  rationale: ἀγωγή здесь означает образ или уклад жизни, а αἱρετίζω — выбирать, предпочитать.
- source_word: ἀξιοῦν
  choice: просят
  rationale: В данном контексте глагол выражает просьбу или требование; нейтральное «просят» не усиливает тон исходного текста.
- source_word: συγχωρηθῆναι αὐτοῖς τὰ νόμιμα
  choice: разрешить им соблюдать установленные обычаи
  rationale: συγχωρέω означает позволить или допустить, а τὰ νόμιμα охватывает установленные законом и традицией нормы. Добавление «соблюдать» естественно выражает подразумеваемое применение этих установлений.
theological_decisions:
- issue: Культурно-религиозный объём выражения τὰ Ἑλληνικά
  choice: греческие обычаи
  alternative: греческий образ жизни; эллинизм
  rationale: «Греческие обычаи» понятно современному читателю и охватывает культурную практику, не сводя выражение к языку и не вводя более технический термин «эллинизм».
- issue: Значение τὰ νόμιμα в иудейском контексте
  choice: установленные обычаи
  alternative: законы; законные обычаи; отеческие установления
  rationale: Выражение включает нормы, освящённые как законом, так и обычаем. Выбранный вариант сохраняет эту широту и не ограничивает смысл только писаным законом.
- issue: Неясная отсылка τοῦ πατρός
  choice: их отца
  alternative: отца; их предка
  rationale: Греческий текст буквально говорит об «отце» и не уточняет его личность или статус; перевод сохраняет эту референциальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, повествовательным регистром. Синтаксис сохраняет незавершённую причастно-деепричастную связь стиха с окружающим предложением; культурные термины переданы понятно, без конфессионального уточнения.
