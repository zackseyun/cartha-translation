lexical_decisions:
- source_word: ἱερὸν
  choice: святилище
  rationale: В контексте 2 Маккавейской обозначает Иерусалимский храмовый комплекс; «святилище» сохраняет сакральный оттенок и не сужает значение до одного здания.
- source_word: ἀργυρολόγητον
  choice: облагаемым данью
  rationale: Редкое прилагательное указывает на денежное обложение или взимание платежей; выражение передаёт финансовое подчинение святилища, не уточняя сверх текста форму сбора.
- source_word: τεμένη
  choice: священным местам
  rationale: Слово обозначает посвящённые божествам участки или святилища. Такой перевод естественен по-русски и сохраняет отличие от ἱερόν.
- source_word: ἐθνῶν
  choice: языческих народов
  rationale: В данном противопоставлении речь идёт о нееврейских народах и их культовых местах; сочетание ясно передаёт контекст, не называя сами народы нравственно нечестивыми.
- source_word: πρατὴν
  choice: продаваемым
  rationale: Прилагательное означает выставленное на продажу или продаваемое; форма сохраняет резкое указание на коммерциализацию должности.
- source_word: ἀρχιερωσύνην
  choice: первосвященство
  rationale: Обозначает сан и должность первосвященника; традиционный русский термин краток и точен.
- source_word: ποιήσειν
  choice: сделать
  rationale: Инфинитив передаёт содержание или цель предполагаемой меры; единый глагол связывает оба дополнения и сохраняет сжатый параллелизм греческого текста.
theological_decisions:
- issue: Различение Иерусалимского святилища и нееврейских культовых мест
  choice: Передать ἱερόν как «святилище», а τεμένη как «священные места»
  alternative: Передать оба слова однокоренными словами «святилище/святилища» либо как «храм/храмы»
  rationale: Греческий текст употребляет разные слова. Перевод сохраняет это различие, не усиливая его до богословского противопоставления, отсутствующего в формулировке.
- issue: Характер денежного обложения святилища
  choice: «облагаемым данью» с примечанием об альтернативе «подлежащим денежному обложению»
  alternative: «облагаемым налогом»
  rationale: ἀργυρολόγητον допускает понимание денежной подати или налогообложения; основной перевод сохраняет исторический оттенок и не устанавливает точный административный механизм.
- issue: Продажа первосвященства
  choice: «первосвященство — ежегодно продаваемым»
  alternative: «ежегодно выставлять первосвященство на продажу»
  rationale: Основной вариант близко сохраняет именную, синтаксически сжатую конструкцию и не смягчает изображённую продажность должности.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. Причастные формы сохраняют параллелизм и сжатость греческого текста; «дань» и «первосвященство» уместны в историческом контексте и понятны современному читателю.
