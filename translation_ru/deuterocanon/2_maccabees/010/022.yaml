lexical_decisions:
- source_word: Ἡ ... τοῦ βασιλέως ἐπιστολή
  choice: Письмо царя
  rationale: «Письмо» — естественный современный эквивалент ἐπιστολή; родительный оборот точно передаёт принадлежность письма царю.
- source_word: περιεῖχεν οὕτως
  choice: гласило так
  rationale: Буквально оборот означает «содержало так», но русское «гласило так» естественно вводит дословно приводимое содержание письма, не меняя смысла.
- source_word: Βασιλεὺς Ἀντίοχος
  choice: Царь Антиох
  rationale: Сохранена титульная формула отправителя без добавления отсутствующего в греческом тексте определённого артикля.
- source_word: τῷ ἀδελφῷ Λυσίᾳ
  choice: брату Лисию
  rationale: Дательный падеж обозначает адресата. Перевод сохраняет слово «брат», не решая, обозначает ли оно родство или придворное обращение.
- source_word: χαίρειν
  choice: привет
  rationale: В начале письма χαίρειν является устойчивой эпистолярной формулой приветствия; буквальное «радоваться» по-русски здесь вводило бы в заблуждение.
