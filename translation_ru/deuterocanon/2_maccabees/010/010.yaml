  source_fidelity: 'В черновике удачно переданы «как и прежде», военный оттенок διασκευή, образ «союзника с неба» и милость Господа. Однако «они выступили» добавляет конкретное действие, которого в данном греческом фрагменте нет: ἐν διασκευῇ описывает их состояние/расположение, а не собственно выступление. Прописная буква в «Союзнике» также придаёт слову характер титула и несколько сильнее персонализирует референта, чем позволяет сжатая греческая формулировка.'
  naturalness: «Они были в боевом строю» — естественная для современного литературного русского передача военного состояния без лишнего смыслового добавления. Союз «ибо» сохраняет сдержанный высокий регистр историко-религиозного повествования и естественно передаёт объяснительный оттенок родительного самостоятельного оборота.
  terminology: «Господь» корректно передаёт κύριος. Строчное «союзника с неба» сохраняет военную метафору σύμμαχος, не превращая нарицательное слово в титул и не отождествляя прямо этого союзника с Господом. «Боевой строй» является приемлемой контекстуальной передачей ἐν διασκευῇ; альтернативное более широкое понимание сохранено в примечании.
