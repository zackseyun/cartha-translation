translation:
  language: ru
  text: Как и прежде[a], они были в боевом строю, имея союзника с неба[b], ибо Господь помиловал их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как прежде, будучи подготовлены» — если ἐν διασκευῇ понимать шире, как готовность или оснащённость, а не именно как боевой строй.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая фраза сжата: «имея союзника с неба» связано с оборотом «Господь помиловал их».'
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πρόηγον
  choice: как и прежде
  rationale: Идиоматическое сочетание указывает на сопоставление с прежним случаем, а не просто на неопределённое прошлое.
- source_word: ἐν διασκευῇ
  choice: в боевом строю
  rationale: Существительное допускает значения приготовления и снаряжения; военный контекст поддерживает значение организованной готовности к бою.
- source_word: σύμμαχον
  choice: Союзника
  rationale: Слово обозначает того, кто сражается на чьей-либо стороне; «Союзник» сохраняет военную образность лучше, чем общее «помощник».
- source_word: τὸν ἀπʼ οὐρανοῦ σύμμαχον
  choice: Союзника с неба
  rationale: Передаёт направление происхождения помощи, не уточняя её носителя сверх сказанного в греческом тексте.
- source_word: ἔχοντες
  choice: имея
  rationale: Прямо передаёт обстоятельственное причастие и связывает готовность к бою с небесной поддержкой.
- source_word: ἐλεήσαντος αὐτοὺς τοῦ κυρίου
  choice: потому что Господь помиловал их
  rationale: Родительный самостоятельный оборот естественно передан причинным придаточным; мотив милости сохранён.
theological_decisions:
- issue: Кто именно назван «Союзником с неба»
  choice: Не уточнять референта и сохранить военную метафору.
  alternative: «имея своим небесным Союзником Господа» или «имея небесного Помощника»
  rationale: Греческий текст связывает небесную поддержку с милостью Господа, однако грамматически не отождествляет их с полной явностью; явное отождествление сняло бы подлинную сжатость и возможную неоднозначность.
- issue: Логическая связь оборота ἐλεήσαντος...
  choice: 'Передать как причину: «потому что Господь помиловал их».'
  alternative: 'Сохранить формально: «Господь помиловал их» или «когда Господь помиловал их».'
  rationale: В данном фрагменте родительный самостоятельный оборот естественно объясняет наличие небесного Союзника, однако примечание отмечает сжатость исходной конструкции.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. Синтаксис сделан естественным по-русски; военная метафора и сжатая богословская связь сохранены. Прописная буква в слове «Союзник» указывает на небесного личного деятеля, не добавляя прямого отождествления, которого греческая фраза явно не формулирует.
