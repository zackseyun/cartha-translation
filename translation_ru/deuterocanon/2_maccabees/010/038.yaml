lexical_decisions:
- source_word: ὑγιαίνετε
  choice: Будьте здоровы
  rationale: Форма повелительного наклонения буквально означает пожелание здоровья, но здесь служит обычной заключительной формулой письма. Русское «Будьте здоровы» сохраняет и буквальный образ, и функцию прощального пожелания.
- source_word: ἔτους
  choice: в … году
  rationale: Родительный падеж входит в греческую формулу датировки; по-русски она естественно передаётся предложной конструкцией «в … году».
- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: сто сорок восьмом
  rationale: Порядковое числительное согласовано со словом «год» и передано обычной русской формой датировки.
- source_word: Ξανθικοῦ
  choice: Ксанфика
  rationale: Название македонского месяца транслитерировано в принятой для русского языка форме; слово «месяца» добавлено для ясности подразумеваемой календарной формулы.
- source_word: πεντεκαιδεκάτῃ
  choice: пятнадцатого дня
  rationale: Дательный падеж обозначает дату внутри месяца; выражение «пятнадцатого дня» естественно воспроизводит эллиптическую греческую формулу.
