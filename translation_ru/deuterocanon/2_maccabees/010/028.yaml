lexical_decisions:
- source_word: ἔρρωσθε
  choice: Будьте здоровы
  rationale: Форма повелительного наклонения множественного числа от ῥώννυμι служит формулой завершения письма. Русское «Будьте здоровы» естественно передаёт и прощальный характер выражения, и заложенный в нём образ здоровья и благополучия.
- source_word: εἴη ἂν
  choice: Пусть будет
  rationale: Оптатив с ἄν здесь выражает пожелание. «Пусть будет» передаёт его прямо и естественно, не превращая пожелание в утверждение.
- source_word: ὡς βούλομεθα
  choice: так, как мы желаем
  rationale: βούλομαι означает «желать, хотеть». Выбор сохраняет волевой оттенок и сдержанный тон письменной формулы.
- source_word: ὑγιαίνομεν
  choice: мы тоже здоровы
  rationale: Глагол буквально указывает на здоровье или благополучие. «Здоровы» сохраняет лексическую связь с ἔρρωσθε, а «тоже» передаёт взаимность, выраженную сочетанием καὶ αὐτοὶ δὲ.
- source_word: καὶ αὐτοὶ δὲ
  choice: и сами мы тоже
  rationale: Сочетание содержит соединительный переход, усилительное местоимение и оттенок взаимности. Формулировка сохраняет эти элементы без неестественной тяжеловесности.
