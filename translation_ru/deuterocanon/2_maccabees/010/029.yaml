  text: Menelaus informed us, wanting you, after coming down, to be restored to your own people.
translation:
  language: ru
  text: Менелай сообщил нам о своём желании, чтобы вы, спустившись, присоединились к своим.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «оказались среди своих» или «были со своими». Греческое выражение сжато и допускает несколько оттенков смысла.'
    reason: lexical_alternative
  - marker: b
    text: Синтаксис дошедшего до нас греческого текста затруднён; перевод передаёт его наиболее вероятный общий смысл, не устраняя полностью неопределённость.
    reason: textual_variant
lexical_decisions:
- source_word: ἐνεφάνισεν
  choice: сообщил
  rationale: Глагол означает «сделал известным, сообщил». Такой перевод естественно передаёт сообщение, обращённое «к нам».
- source_word: βουλόμενος
  choice: о своём желании
  rationale: Причастие выражает желание или намерение Менелая. Именная конструкция позволяет по-русски ясно связать его с подлежащим.
- source_word: κατελθόντας
  choice: спустившись
  rationale: Аористное причастие обозначает действие, предшествующее присоединению; буквальное пространственное значение «спуститься» сохранено ввиду отсутствия достаточных оснований конкретизировать направление.
- source_word: γίνεσθαι πρὸς τοὺς ἰδίους
  choice: присоединились к своим
  rationale: Сжатое греческое выражение буквально означает «оказаться/быть со своими». «Присоединились к своим» естественно передаёт переход или возвращение к собственной группе, не добавляя идеи официального восстановления.
- source_word: τοὺς ἰδίους
  choice: своим
  rationale: Субстантивированное прилагательное обозначает людей своей группы, стороны или народа. Русское «свои» сохраняет присущую оригиналу неопределённость.
