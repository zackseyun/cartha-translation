lexical_decisions:
- source_word: ἔρρωσθε
  choice: Будьте здоровы
  rationale: Форма повелительного наклонения множественного числа буквально выражает пожелание здоровья и в заключительной формуле письма служит прощанием. Русское «Будьте здоровы» сохраняет и буквальный образ, и эпистолярную функцию.
- source_word: ἔτους
  choice: в … году
