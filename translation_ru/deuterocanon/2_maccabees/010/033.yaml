- source_word: ἑκατοστοῦ τεσσερακοστοῦ ὀγδόου
  choice: сто сорок восьмом
  rationale: Передано порядковым числительным без добавления названия эры, которого нет в греческом тексте.
- source_word: Ξανθικοῦ
  choice: Ксантика
  rationale: Название македонского месяца транслитерировано в принятой русской форме и поставлено в родительном падеже после слова «месяца».
- source_word: πεντεκαιδεκάτῃ
  choice: в пятнадцатый день
  rationale: Дательный падеж обозначает дату; добавленное по нормам русского языка слово «день» ясно передаёт смысл формы.
