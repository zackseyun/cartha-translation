lexical_decisions:
- source_word: Ἰωάνης
  choice: Иоанн
  rationale: Использована традиционная русская форма библейского личного имени.
- source_word: Ἀβεσσαλώμ
  choice: Авессалом
  rationale: Использована традиционная русская форма библейского личного имени.
- source_word: οἱ πεμφθέντες παρʼ ὑμῶν
  choice: посланные вами
  rationale: Причастный оборот естественно передаёт определение к двум названным лицам; παρά с родительным указывает на источник действия, что по-русски здесь ясно выражается творительным падежом.
- source_word: ἐπιδόντες
  choice: представили
  rationale: В контексте официального документа глагол передаёт его вручение или предъявление; последовательность действий естественно понятна и без отдельного «после того как».
- source_word: τὸν ὑπογεγραμμένον χρηματισμόν
  choice: приведённое ниже официальное послание
  rationale: ὑπογεγραμμένον указывает на написанное далее или ниже, а χρηματισμός — на официальное сообщение либо распоряжение. «Послание» не сужает значение до обязательного «указа», а определение «официальное» сохраняет административный оттенок.
- source_word: ἠξίουν
  choice: обратились с просьбой
  rationale: Имперфект ἀξιόω в данном построении выражает обращение с просьбой; такая передача сохраняет просительный смысл, не превращая его в простой вопрос.
- source_word: περὶ τῶν διʼ αὐτοῦ σημαινομένων
  choice: относительно того, о чём в нём сообщается
  rationale: Оборот обозначает предметы, сообщаемые или обозначаемые посредством документа; местоимение «в нём» естественно отсылает к посланию и не конкретизирует содержание сверх греческого текста.
