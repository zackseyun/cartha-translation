base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/035.yaml
  text: Concerning the matters that Lysias[a], the king’s kinsman, has granted to you, we also approve.
translation:
  language: ru
  text: Что касается того, что Лисий, родственник царя, разрешил вам[a], то и мы это одобряем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уступил вам».'
    reason: Глагол συγχωρέω может означать как разрешение, так и уступку или согласие на просьбу.
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: Что касается того, что
  rationale: Оборот вводит предмет обсуждения; русская конструкция естественно передаёт это значение, не уточняя сверх текста, идёт ли речь о разрешениях, уступках или иных решениях.
- source_word: Λυσίας
  choice: Лисий
  rationale: Традиционная русская передача греческого личного имени.
- source_word: ὁ συγγενὴς τοῦ βασιλέως
  choice: родственник царя
  rationale: Передаёт прямое значение συγγενής и сохраняет возможный семейно-политический оттенок выражения.
- source_word: συνεχώρησεν ὑμῖν
  choice: разрешил вам
  rationale: В дипломатическом контексте συγχωρέω обозначает предоставление разрешения или уступку. «Разрешил вам» ясно и естественно, а альтернативный оттенок отмечен в сноске.
- source_word: καὶ ἡμεῖς συνευδοκοῦμεν
  choice: то и мы это одобряем
  rationale: Сохраняет значение совместного согласия или одобрения и явно связывает его с решением Лисия.
