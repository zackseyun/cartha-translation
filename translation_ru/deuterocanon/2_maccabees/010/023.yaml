lexical_decisions:
- source_word: ἐπὶ τοῦ πατρὸς ἡμῶν … μεταστάντος
  choice: Поскольку наш отец … отошёл
  rationale: Оборот имеет причинно-временное значение и обосновывает последующее царское решение; «поскольку» естественно передаёт эту связь.
- source_word: εἰς θεοὺς μεταστάντος
  choice: отошёл к богам
  rationale: Сохранён эллинистический придворный эвфемизм смерти и прямо выраженное в греческом тексте множественное число «боги».
- source_word: βουλόμενοι
  choice: мы желаем
  rationale: Причастие передаёт намерение автора царского послания; личная форма обеспечивает ясный и официальный русский синтаксис.
- source_word: τοὺς ἐκ τῆς βασιλείας
  choice: жители царства
  rationale: Выражение обозначает людей, принадлежащих царству или находящихся в нём; «жители царства» не сужает их до чиновников.
- source_word: ἀπερισπάστως ὄντας
  choice: не испытывая беспокойства
  rationale: Наречие указывает на отсутствие помех, отвлечения или тревог; выбранная формулировка подходит общественно-административному контексту.
- source_word: γενέσθαι πρὸς τὴν τῶν Ἰουδαίων ἐπιμέλειαν
  choice: могли заняться делами иудеев
  rationale: ἐπιμέλεια здесь означает внимание, попечение или ведение дел. Русское выражение сохраняет административный смысл, не превращая его однозначно в благотворительную заботу.
