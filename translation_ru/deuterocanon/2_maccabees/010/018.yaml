lexical_decisions:
- source_word: ὅσα μὲν οὖν
  choice: Итак… всё, что
  rationale: Оборот подводит итог и обозначает переход; «итак» естественно передаёт выводно-возобновительную силу οὖν, а соотнесение μέν… δέ отражено конструкцией «всё, что… а… то, что».
- source_word: ἔδει
  choice: надлежало
  rationale: Имперфект безличного δεῖ выражает необходимость в прошлом; «надлежало» сохраняет смысл долженствования и соответствует dignified modern Russian.
- source_word: τῷ βασιλεῖ
  choice: царю
  rationale: Дательный обозначает адресата представления; простой дательный падеж естественен по-русски.
- source_word: προσενεχθῆναι
  choice: представить
  rationale: Пассивный инфинитив προσφέρω здесь относится к вынесению вопросов на рассмотрение правителя; русская неопределённо-личная конструкция передаёт пассив естественно.
- source_word: διεσάφησα
  choice: я ясно изложил
  rationale: Глагол означает разъяснить или отчётливо изложить; перевод сохраняет неожиданное первое лицо и завершённость действия аориста.
- source_word: ἃ δὲ ἦν ἐνδεχόμενα
  choice: то, что было возможно
  rationale: Сохраняется широкое значение осуществимого или допустимого без преждевременного сужения до конкретных просьб.
- source_word: συνεχώρησεν
  choice: он разрешил
  rationale: В данном административном контексте глагол может означать позволить, уступить или удовлетворить; «разрешил» сохраняет объектную неопределённость и не добавляет прямо не названных просьб.
