lexical_decisions:
- source_word: Μετʼ ὀλίγον δὲ παντελῶς χρονίσκον
  choice: Спустя совсем немного времени
  rationale: 'Передаёт совокупную силу выражения: небольшой промежуток дополнительно подчёркнут словами παντελῶς и уменьшительной формой χρονίσκον. Частица δέ здесь служит переходом в повествовании и отдельно не переводится.'
- source_word: ἐπίτροπος τοῦ βασιλέως
  choice: опекун царя
  rationale: ἐπίτροπος обозначает человека, которому вверен надзор или попечение; при несовершеннолетнем царе слово может подразумевать функции регента, но греческий текст не требует именно этого более узкого титула.
- source_word: συγγενὴς
  choice: его родственник
  rationale: Явное местоимение «его» естественно связывает определение с царём. «Родственник» понятно современному читателю и сохраняет основное значение слова, не исключая возможности придворного титула.
- source_word: ἐπὶ τῶν πραγμάτων
  choice: ведавший государственными делами
  rationale: Буквально выражение означает «поставленный над делами». В данном политическом контексте описательный перевод звучит естественно и не навязывает точно не установленного должностного титула.
- source_word: λίαν βαρέως φέρων ἐπὶ τοῖς γεγονόσι
  choice: тяжело переживая случившееся
  rationale: Идиома βαρέως φέρειν выражает сильное огорчение, недовольство или возмущение. Выбранная формулировка сохраняет эмоциональную силу, не уточняя без достаточных оснований конкретный оттенок чувства.
