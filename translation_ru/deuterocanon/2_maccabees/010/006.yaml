base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/010/006.yaml
  text: But when those around Makkabaios[a], while besieging it, gained possession of the strongholds, with lamentations and tears they, together with the crowds[b], pleaded with the Lord to send a good angel for the salvation of Israel.
translation:
  language: ru
  text: Когда же люди Маккавея овладели укреплениями, в то время как он осаждал его[b], они вместе с народом, со скорбными воплями и слезами, молили Господа послать доброго ангела[a] для спасения Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодетельного ангела». Греческое выражение буквально означает «доброго ангела» и может указывать как на его характер, так и на благотворную для Израиля миссию.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте местоимение при глаголе «осаждал» имеет мужской род, но его предшествующее слово здесь не названо. Поэтому неясно, кого именно осаждал Маккавей.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ περὶ τὸν Μακκαβαῖον
  choice: люди Маккавея
  rationale: Греческий оборот буквально обозначает тех, кто окружал Маккавея, то есть его сторонников или спутников. «Люди Маккавея» естественно передаёт этот смысл, не уточняя их звание или численность.
- source_word: μετέλαβον
  choice: овладели
  rationale: В данном военном контексте глагол означает вступить во владение, захватить; «овладели» точно и литературно передаёт результат действия.
- source_word: τὰ ὀχυρώματα
  choice: укреплениями
  rationale: Слово обозначает укреплённые места или оборонительные сооружения; русский военный термин «укрепления» сохраняет широту значения.
- source_word: πολιορκοῦντα αὐτόν
  choice: пока он осаждал это место
  rationale: Причастие мужского рода единственного числа относится к Маккавею, а местоимение имеет невыраженный и синтаксически неясный антецедент. «Это место» передаёт наиболее вероятный пространственный объект осады, а неоднозначность отмечена в сноске.
- source_word: μετὰ ὀδυρμῶν καὶ δακρύων
  choice: со скорбными воплями и слезами
  rationale: ὀδυρμός выражает громкий плач, сетование или скорбный вопль. Выбранная формулировка сохраняет эмоциональную силу выражения.
- source_word: σὺν τοῖς ὄχλοις
  choice: вместе с народом
  rationale: ὄχλοι во множественном числе обозначает множество людей или толпы. В данном контексте «народ» звучит естественнее по-русски и не предполагает беспорядочной толпы.
- source_word: ἱκέτευον
  choice: молили
  rationale: Глагол обозначает настойчивое, смиренное прошение. «Молили Господа» естественно передаёт религиозный контекст и силу просьбы.
- source_word: τὸν κύριον
  choice: Господа
  rationale: В иудейском священном контексте κύριος служит почтительным обозначением Бога и традиционно передаётся как «Господь».
- source_word: ἀγαθὸν ἄγγελον
  choice: доброго ангела
  rationale: Буквальное значение ἀγαθός — «добрый, благой». Перевод не устанавливает личность ангела и не расширяет его функцию сверх сказанного в тексте.
- source_word: ἀποστεῖλαι πρὸς σωτηρίαν τῷ Ἰσραήλ
  choice: послать ... для спасения Израиля
  rationale: Формулировка близко передаёт конструкцию цели и сохраняет широкий богословский смысл σωτηρία — спасение или избавление.
theological_decisions:
- issue: Значение выражения «доброго ангела»
  choice: доброго ангела
  alternative: благодетельного ангела; ангела-помощника
  rationale: Греческий текст характеризует ангела как ἀγαθός, но не называет его и не определяет точнее его природу или служение. Буквальная передача сохраняет эту сдержанность.
- issue: Значение σωτηρία применительно к Израилю
  choice: спасение Израиля
  alternative: избавление Израиля
  rationale: «Спасение» сохраняет семантическую широту греческого слова и не ограничивает его исключительно военной победой, хотя непосредственный контекст допускает избавление от военной угрозы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Традиционные формы «Маккавей», «Господь» и «Израиль» сохранены; архаизмы и конфессионально окрашенные уточнения не вводятся.
