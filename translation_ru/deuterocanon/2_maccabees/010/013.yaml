  source_fidelity: 'Основной смысл передан верно: герой обдумывает понесённую неудачу, признаёт непобедимость евреев вследствие Божьего военного содействия и предпринимает предварительное действие. Однако «всемогущий» утверждает абсолютное всемогущество, тогда как δυναμένου здесь означает «могущий, сильный, могущественный»; такую догматически более сильную формулировку источник прямо не требует. «Сопоставив в уме» точнее передаёт рефлексивно-сопоставительный оттенок πρὸς ἑαυτὸν ἀντιβάλλων, чем просто «обдумав».'
