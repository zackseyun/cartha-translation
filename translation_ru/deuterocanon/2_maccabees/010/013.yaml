lexical_decisions:
- source_word: οὐκ ἀνόους δὲ ὑπάρχων
  choice: Но он был не безрассуден
  rationale: Сохраняет греческую литоту и естественно звучит по-русски; δέ передаётся противительным «но».
- source_word: πρὸς ἑαυτὸν ἀντιβάλλων
  choice: обдумав
  rationale: В контексте оборот обозначает внутреннее сопоставление и размышление; русское «обдумав» передаёт смысл без неестественной буквальности.
- source_word: τὸ γεγονὸς περὶ αὐτὸν ἐλάττωμα
  choice: постигшее его поражение
  rationale: ἐλάττωμα может означать ущерб, неудачу или поражение; в военном контексте «поражение» наиболее ясно, при этом причастный оборот сохраняет значение произошедшего с ним события.
- source_word: συννοήσας
  choice: осознав
  rationale: Передаёт завершённое понимание, выраженное аористным причастием.
- source_word: ἀνικήτους εἶναι τοὺς Ἑβραίους
  choice: что евреи непобедимы
  rationale: «Евреи» прямо соответствует Ἑβραίους, а «непобедимы» сохраняет сильное значение ἀνίκητος.
- source_word: τοῦ δυναμένου θεοῦ
  choice: всемогущий Бог
  rationale: Субстантивированное причастие δυναμένου буквально указывает на Бога, Который силён или способен; «всемогущий Бог» естественно выражает акцент на Его непреодолимой силе, хотя буквальная форма несколько шире.
- source_word: συμμαχοῦντος αὐτοῖς
  choice: с ними сражается
  rationale: Сохраняет активный военный смысл συμμαχέω — выступать союзником и сражаться вместе.
- source_word: προαποστείλας
  choice: он заранее послал
  rationale: Передаёт предварительность действия; многоточие показывает, что синтаксическая мысль продолжается в следующем стихе.
theological_decisions:
- issue: Обозначение Ἑβραίους
  choice: евреи
  alternative: иудеи
  rationale: Греческий текст употребляет именно Ἑβραίους, поэтому перевод не гармонизирует его с более частым Ἰουδαῖοι.
- issue: Характер Божьего содействия
  choice: с ними сражается
  alternative: помогает им как союзник
  rationale: Военный глагол συμμαχέω представляет Бога активным соратником в битве, а не просто источником общей помощи.
- issue: Значение τοῦ δυναμένου θεοῦ
  choice: всемогущий Бог
  alternative: Бог, Который силён
  rationale: Основной текст естественно выражает Божью силу, а сноска сохраняет буквальную смысловую форму и не позволяет скрыть возможную широту выражения.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного стиля. Литота сохранена, тяжёлая цепочка греческих причастий упрощена до естественной русской конструкции. Стих оставлен синтаксически незавершённым, поскольку προαποστείλας вводит действие, продолжение которого следует далее.
