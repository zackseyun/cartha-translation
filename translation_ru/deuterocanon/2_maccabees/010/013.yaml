  yaml_path: translation/deuterocanon/2_maccabees/010/013.yaml
  text: But since he was not foolish[a], but was considering within himself the defeat that had happened to him, and had realized that the Hebrews were unconquerable because the mighty God was fighting alongside them[b], he sent ahead
translation:
  language: ru
  text: 'Но он не был глуп: сопоставив в уме постигшую его неудачу и поняв, что евреи непобедимы, потому что на их стороне сражался могущественный Бог[a], он заранее послал…'
  philosophy: optimal-equivalence
  footnotes:
