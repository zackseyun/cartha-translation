  text: But when he entered Judea and came near Bethsura[a], a fortified place about five schoeni from Jerusalem[b], he was pressing it hard.
translation:
  language: ru
  text: Войдя в Иудею и подойдя к Бет-Цуру — укреплённому месту, находившемуся примерно в пяти схенах от Иерусалима,[a] — он стал теснить его.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Схен — древняя мера расстояния; её величина была неодинаковой, поэтому здесь сохранено греческое название меры без приблизительного пересчёта в современные единицы.
    reason: cultural_note
  - marker: b
    text: 'Или: «осаждал его». Буквально греческий текст говорит, что он «теснил» это место; в данном военном контексте так может описываться осада.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν ... εἰς τὴν Ἰουδαίαν
  choice: Войдя в Иудею
  rationale: Аористное причастие передаёт действие, предшествующее основному; деепричастная конструкция естественна для русского повествования и сохраняет связь действий.
- source_word: συνεγγίσας Βεθσουρῶν
  choice: подойдя к Бет-Цуру
  rationale: συνεγγίζω означает приблизиться, подойти. Форма «Бет-Цур» передаёт узнаваемое семитское название места и естественно склоняется в современном русском языке.
- source_word: ὄντι μὲν ἐρυμνῷ χωρίῳ
  choice: укреплённому месту
  rationale: ἐρυμνός обозначает укреплённость или оборонительную надёжность, а χωρίον здесь — место или поселение. Такой перевод не превращает описание в более специальный термин «крепость».
- source_word: Ἱεροσολύμων δὲ ἀπέχοντι ὡσεὶ σχοίνους πέντε
  choice: находившемуся примерно в пяти схенах от Иерусалима
  rationale: ὡσεὶ выражает приблизительность. Древняя мера σχοῖνος передана транслитерацией, поскольку её величина менялась и точный пересчёт создавал бы ложную точность.
- source_word: τοῦτο ἔθλιβε
  choice: он стал теснить его
  rationale: θλίβω буквально означает давить, теснить, притеснять. В военном контексте речь идёт о сильном натиске на укреплённое место, однако греческое слово само по себе не является однозначным техническим обозначением осады.
