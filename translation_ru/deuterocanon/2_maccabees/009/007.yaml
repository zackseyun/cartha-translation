  terminology: Различие между «надменностью» и «гордостью» обоснованно сохранено. «Иудеи» соответствует Ἰουδαίους. Образ «пылая яростью» приемлемо передаёт πῦρ πνέων τοῖς θυμοῖς без излишней буквальности.
