base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/007.yaml
  text: But he in no way ceased from his arrogance[a]; rather, he was filled even more with pride, breathing fire in his rage against the Jews and ordering the journey to be hastened. Then it happened that he fell from the chariot as it was rushing along, and in the hard fall[b] all the limbs of his body were wrenched out of joint.
translation:
  language: ru
  text: Но он нисколько не умерил своей надменности; напротив, он ещё больше преисполнился гордости, пылая яростью против иудеев и приказывая ускорить путь[a]. И случилось, что он упал с колесницы, мчавшейся во весь опор, и при тяжёлом падении все члены его тела были вывихнуты[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приказывая ускорить продвижение»; греческое слово может обозначать путь, путешествие или поход.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все члены его тела оказались разъяты». Редкий греческий глагол, вероятно, описывает тяжёлое повреждение, при котором части тела были насильственно смещены или разъединены.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδαμῶς ... ἔληγεν
  choice: нисколько не умерил
  rationale: Передаёт усиленное отрицание и продолжение надменного поведения; по-русски естественнее, чем буквальное «не переставал от надменности».
- source_word: ἀγερωχίας
  choice: надменности
  rationale: Обозначает высокомерную, заносчивую самоуверенность и сохраняет отличие от следующего слова со значением гордости.
- source_word: ὑπερηφανίας ἐπεπλήρωτο
  choice: ещё больше преисполнился гордости
  rationale: Сохраняет образ наполнения и усиление, выраженное ἔτι δὲ καί.
- source_word: πῦρ πνέων τοῖς θυμοῖς
  choice: пылая яростью
  rationale: Естественная русская передача яркого образа «дыша огнём» и сильного гнева; метафорическая интенсивность сохраняется без неуклюжей буквальности.
- source_word: κελεύων ἐποξύνειν τὴν πορίαν
  choice: приказывая ускорить путь
  rationale: πορία обозначает путь или продвижение, а ἐποξύνειν — понукать, ускорять; формулировка естественна в контексте спешного движения.
- source_word: ἅρματος φερομένου ῥοίζῳ
  choice: из стремительно несущейся колесницы
  rationale: Передаёт быстрое, порывистое движение; звуковой оттенок ῥοίζῳ оставлен невыраженным ради естественности.
- source_word: δυσχερεῖ πτώματι
  choice: при этом тяжёлом падении
  rationale: δυσχερής здесь описывает тяжесть и травматичность падения.
- source_word: πάντα τὰ μέλη τοῦ σώματος ἀποσφύζειν
  choice: вывихнул все суставы тела
  rationale: Редкий глагол в данном контексте указывает на насильственное смещение или разъединение частей тела; «суставы» по-русски естественно соотносится с вывихом, хотя буквально μέλη означает члены тела.
theological_decisions:
- issue: Нравственная характеристика Антиоха двумя близкими словами
  choice: Сохранить различие между «надменностью» и «гордостью»
  alternative: Передать оба существительных одним словом — «гордость» или «высокомерие»
  rationale: Греческий текст употребляет ἀγερωχία и ὑπερηφανία, создавая нарастание нравственной характеристики; различение не сглаживает авторскую риторику.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранены нравственное нарастание и резкий телесный итог; громоздкие буквальные конструкции заменены естественными русскими оборотами.
