  to: Но он нисколько не умерил своей надменности; напротив, он ещё больше преисполнился гордости, пылая яростью против иудеев и приказывая ускорить путь[a]. И случилось, что он упал с колесницы, мчавшейся во весь опор, и при тяжёлом падении все члены его тела были вывихнуты[b].
