base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/021.yaml
  text: I remembered your honor and goodwill with affection[a]; after returning from the regions of Persia and falling into an illness that has become severe, I considered it necessary to take thought for the common safety of all of you[c][b];
translation:
  language: ru
  text: Я с сердечной теплотой вспоминал о вашем почтении и доброжелательности[a]. Возвратившись из областей Персии и заболев тяжёлой болезнью[b], я счёл необходимым позаботиться об общей безопасности всех вас[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о вашей чести и благосклонности». Греческое εὔνοια может означать как доброжелательность, так и благосклонность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «впав в болезнь, имеющую тяжесть». Оборот описывает серьёзную или трудно переносимую болезнь.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «об общественной безопасности всех вас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: почтение
  rationale: Слово обозначает честь или уважение; в контексте царского письма «ваше почтение» естественно передаёт отношение адресатов к автору, не сужая его до политической верности.
- source_word: εὔνοια
  choice: доброжелательность
  rationale: Передаёт благосклонное расположение и хорошо сочетается с «почтением» в официальном, но личном обращении.
- source_word: ἐμνημόνευον
  choice: вспоминал
  rationale: Несовершенный вид отражает длительный или повторяющийся характер воспоминания, выраженный греческим имперфектом.
- source_word: φιλοστόργως
  choice: с сердечной теплотой
  rationale: Сохраняет оттенок тёплой, почти семейной привязанности, не делая семейный смысл обязательным.
- source_word: ἐπαναγαγών
  choice: возвратившись
  rationale: В данном контексте причастие естественно понимается как указание на возвращение автора из персидских областей.
- source_word: κατὰ τὴν Περσίδα τόπων
  choice: из областей Персии
  rationale: Передаёт широкое географическое значение мест или территорий в Персии естественным русским оборотом.
- source_word: περιπεσών ἀσθενείᾳ
  choice: заболев ... болезнью
  rationale: Оборот означает, что автор впал в состояние физической болезни; русская конструкция ясно и естественно передаёт её наступление.
- source_word: δυσχερίαν ἔχουσῃ
  choice: тяжёлой
  rationale: Передаёт серьёзный, мучительный или трудно переносимый характер болезни без излишне буквальной и неестественной конструкции.
- source_word: ἀναγκαῖον ἡγησάμην
  choice: я счёл необходимым
  rationale: Точно и естественно передаёт формулу обдуманного решения.
- source_word: φροντίσαι
  choice: позаботиться
  rationale: Выражает предусмотрительную заботу о безопасности адресатов и подходит официально-административному контексту.
- source_word: κοινῆς πάντων ὑμῶν ἀσφαλείας
  choice: об общей безопасности всех вас
  rationale: Сохраняет коллективный характер безопасности и прямое обращение ко всем адресатам.
