    text: 'Или: «прекраснейшими дарами, посвящёнными храму». Греческое слово обозначает дары, посвящённые и помещённые в святилище.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всю священную утварь вернуть многократно»; речь идёт о возмещении в многократном размере, а не только о замене похищенного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσκύλευεν
  choice: прежде разграбил
  rationale: Имперфект указывает на предшествующее разорение храма; в зависимом перечислении обещаний естественная русская форма передаёт ретроспективный контраст.
- source_word: ἅγιον ναὸν
  choice: святой храм
  rationale: Сохраняет культовую определённость и святость Иерусалимского храма без неоправданного сужения до одной части храмового комплекса.
- source_word: καλλίστοις ἀναθήμασιν
  choice: великолепнейшими дарами по обету
  rationale: Превосходная степень передаёт καλλίστοις, а «дары по обету» указывает на посвящённые храму предметы, обозначаемые ἀναθήματα.
- source_word: κοσμήσειν
  choice: украсить
  rationale: Точно и естественно передаёт намерение украсить храм посвящёнными дарами.
- source_word: τὰ ἱερὰ σκεύη
  choice: священную утварь
  rationale: Устойчивое современное обозначение предметов, используемых в храмовом служении.
- source_word: πολυπλάσια πάντα ἀποδώσειν
  choice: всю … возместить во много раз
  rationale: Передаёт не простое возвращение, а многократное возмещение, выраженное πολυπλάσια.
- source_word: τὰς ἐπιβαλλούσας πρὸς τὰς θυσίας συντάξεις
  choice: необходимые для жертвоприношений расходы
  rationale: Передаёт финансовые суммы, причитающиеся или требуемые для совершения жертвоприношений.
- source_word: ἐκ τῶν ἰδίων προσόδων
  choice: из собственных доходов
  rationale: Сохраняет финансовый смысл πρόσοδοι и акцент на его собственных поступлениях.
- source_word: χορηγήσειν
  choice: покрывать
  rationale: В сочетании с расходами естественно выражает финансирование за собственный счёт.
theological_decisions:
- issue: Культовая терминология храмовых даров, утвари и жертв
  choice: 'Сохранены прямые культовые обозначения: «святой храм», «дары по обету», «священная утварь», «жертвоприношения».'
  alternative: Обобщённые слова вроде «святилище», «подарки», «религиозные предметы» или «обряды».
  rationale: Греческий текст говорит именно об Иерусалимском храме и его жертвенном служении; конкретная терминология сохраняет историко-религиозный смысл без внесения позднейших конфессиональных толкований.
