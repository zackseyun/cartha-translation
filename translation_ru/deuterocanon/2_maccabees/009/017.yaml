  yaml_path: translation/deuterocanon/2_maccabees/009/017.yaml
  text: And besides these things[a], he would also become a Jew and would visit every inhabited place[b], proclaiming the power of God.
translation:
  language: ru
  text: Кроме того, он обещал стать иудеем[a] и побывать в каждом населённом месте, возвещая могущество Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «быть иудеем». По смыслу речь, вероятно, идёт о принятии иудейской принадлежности, а не об этническом происхождении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «власть Бога»; также возможно: «сила Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  choice: Кроме того
  rationale: 'Кратко и естественно передаёт присоединительное значение оборота: к прежним обещаниям добавляется ещё одно.'
- source_word: Ἰουδαῖος ἔσεσθαι
  choice: стать иудеем
  rationale: Будущий инфинитив с Ἰουδαῖος в данном контексте указывает на обещанное принятие иудейской принадлежности, а не на изменение этнического происхождения.
- source_word: πάντα τόπον οἰκητὴν
  choice: в каждом населённом месте
  rationale: Передаёт распределительное значение πάντα τόπον и наиболее вероятный смысл необычной формы οἰκητὴν — «населённый».
- source_word: ἐπελεύσεσθαι
  choice: побывать
  rationale: В контексте странствия с публичным возвещением глагол выражает посещение разных мест; «побывать» естественно сочетается с «в каждом месте» и не добавляет лишней конкретики.
- source_word: καταγγέλλοντα
  choice: возвещая
  rationale: Передаёт публичный и торжественный характер объявления.
- source_word: τὸ τοῦ θεοῦ κράτος
  choice: могущество Бога
  rationale: κράτος охватывает значения силы, могущества и владычества. «Могущество» ясно выражает признание Божьего превосходства, не исключая оттенка власти, отмеченного в сноске.
theological_decisions:
- issue: Смысл обещания Антиоха Ἰουδαῖος ἔσεσθαι
  choice: Он обещает стать иудеем, то есть принять иудейскую принадлежность
  alternative: Он лишь обещает благоволить иудеям или жить подобно иудею
  rationale: Формулировка сильнее простого благоволения. При этом перевод не вводит позднейшего технического понятия религиозного обращения.
- issue: Смысл κράτος применительно к Богу
  choice: могущество Бога
  alternative: власть Бога; сила Бога
  rationale: Контекст допускает как силу, так и владычество. Основной текст сохраняет акцент на Божьем превосходстве, а сноска отмечает реальную смысловую широту слова.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской интонацией. «Иудей» сохранено как исторически уместное обозначение. Добавленное по смыслу «обещал» делает зависимые греческие инфинитивы понятными в отдельно цитируемом стихе и отражает контекст обещаний Антиоха.
