lexical_decisions:
- source_word: Τοῖς χρηστοῖς
  choice: добрым
  rationale: χρηστός выражает доброту, добропорядочность или достойность. В почтительном обращении «добрым» естественно передаёт одобрительный тон, не сужая значения до одного качества.
- source_word: Ἰουδαίοις
  choice: иудеям
  rationale: В контексте 2 Маккавейской книги слово обозначает иудейский народ в этнорелигиозном смысле, а не только жителей Иудеи.
- source_word: τοῖς πολίταις
  choice: гражданам
  rationale: Прямое значение πολίτης — «гражданин»; здесь это часть официального обращения к адресатам.
- source_word: πολλὰ χαίρειν
  choice: сердечный привет
  rationale: Это устойчивая эпистолярная формула. Наречное πολλά усиливает приветствие; буквальное «много радоваться» в современном русском звучало бы неестественно.
- source_word: ὑγιαίνειν
  choice: здоровья
  rationale: Инфинитив в составе формулы выражает пожелание быть здоровыми; русское существительное естественно сочетается с последующим «благополучия».
- source_word: εὖ πράττειν
  choice: благополучия
  rationale: Выражение означает «преуспевать, благоденствовать, хорошо поживать». «Благополучие» ёмко передаёт пожелание хорошего состояния без сведения смысла только к материальному достатку.
- source_word: βασιλεὺς Ἀντίοχος καὶ στρατηγὸς
  choice: Царь Антиох и военачальник
  rationale: Сохранены оба обозначения исходного текста и необычное соединение союзом καί; имя отправителя вынесено в начало согласно естественному русскому оформлению письма.
