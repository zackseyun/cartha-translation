base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/004.yaml
  text: But in his rage he thought to vent on the Jews the malice of those who had put him to flight. Therefore he ordered the charioteer[a], driving without stopping, to press on with the journey, while the judgment from heaven was accompanying him. For in his arrogance he had said, “When I arrive there, I will make Jerusalem a burial place of Jews.”
translation:
  language: ru
  text: 'Разъярившись, он задумал выместить на иудеях злобу тех, кто обратил его в бегство. Поэтому он велел вознице безостановочно гнать колесницу до конца пути, тогда как суд с небес сопровождал его. Ведь он надменно сказал: «Когда я приду туда, то превращу Иерусалим в место погребения иудеев[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «общее захоронение иудеев». Греческое слово обозначает место погребения множества умерших.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαρθεὶς δὲ τῷ θυμῷ
  choice: Разъярившись
  rationale: Передаёт состояние человека, охваченного и подстёгиваемого гневом, естественным современным русским языком.
- source_word: τῶν πεφυγαδευκότων αὐτὸν κακίαν εἰς τοὺς Ἰουδαίους ἐναπερείσασθαι
  choice: выместить на иудеях злобу, вызванную теми, кто обратил его в бегство
  rationale: «Выместить» передаёт перенос враждебности на иудеев; πεφυγαδευκότων означает, что другие вынудили его бежать. Формулировка не отождествляет этих людей с иудеями.
- source_word: συνέταξεν τὸν ἁρματηλάτην ἀδιαλείπτως ἐλαύνοντα καταλύειν τὴν πορείαν
  choice: велел вознице безостановочно гнать колесницу до конца пути
  rationale: Сохраняет конкретное значение ἁρματηλάτης («возница»), непрерывность движения и контекстуальный смысл доведения пути до конца.
- source_word: τῆς ἐξ οὐρανοῦ τῆς κρίσεως συνοδούσης αὐτῷ
  choice: тогда как суд с небес уже сопровождал его
  rationale: Генитивная абсолютная конструкция передана как одновременное обстоятельство; κρίσις сохраняет судебно-богословский смысл «суда», а συνοδούσης — образ спутника.
- source_word: ὑπερηφάνως
  choice: надменно
  rationale: Кратко и точно выражает высокомерную, дерзкую гордость говорящего.
- source_word: Πολυάνδριον
  choice: место погребения
  rationale: Нейтрально передаёт место, где погребено множество умерших, не сужая значение до конкретного типа захоронения; более сильный вариант дан в сноске.
theological_decisions:
- issue: Божественный источник наказания Антиоха
  choice: суд с небес уже сопровождал его
  alternative: наказание с небес следовало за ним
  rationale: «Суд» сохраняет юридический и богословский объём κρίσις, а «с небес» прямо удерживает указанное текстом происхождение суда. «Сопровождал» точнее передаёт συνοδούσης, чем «следовал».
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. «Иудеи» соответствует историко-библейскому контексту; синтаксис сделан ясным без устранения образа небесного суда, сопровождающего Антиоха.
