    reason: alternative_reading
lexical_decisions:
- source_word: ἐνταῦθα οὖν
  choice: И тогда
  rationale: Передаёт и повествовательный переход, и лёгкий оттенок следствия; естественно звучит в современном русском рассказе.
- source_word: ἤρξατο
  choice: начал
  rationale: Сохраняет начинательное значение глагола и относится к обоим последующим инфинитивным оборотам.
- source_word: τὸ πολὺ τῆς ὑπερηφανίας
  choice: свою безмерную надменность
  rationale: Идиоматически передаёт большую степень надменности. Местоимение «свою» естественно восполняет в русском принадлежность подразумеваемому субъекту.
- source_word: λήγειν
  choice: оставлять
  rationale: В данном сочетании означает прекращать или оставлять прежнюю надменность; форма несовершенного вида согласуется с «начал».
- source_word: τεθραυσμένος
  choice: сломленный
  rationale: Передаёт результирующее состояние, выраженное перфектным страдательным причастием, и допускает как физический, так и внутренний смысл.
- source_word: εἰς ἐπίγνωσιν ἔρχεσθαι
  choice: приходить к осознанию
  rationale: Сохраняет значение узнавания или понимания, не усиливая его до покаяния.
- source_word: θείᾳ μάστιγι
  choice: под ударом божественного бича
  rationale: Сохраняет метафору бича и передаёт дательный падеж как средство или обстоятельство воздействия.
theological_decisions:
- issue: Означает ли εἰς ἐπίγνωσιν ἔρχεσθαι подлинное покаяние или лишь вынужденное осознание под судом
  choice: приходить к осознанию
  alternative: приходить к покаянию
  rationale: Греческое выражение говорит об осознании или понимании, но само по себе не утверждает покаяния; перевод сохраняет эту богословскую напряжённость.
- issue: Как передать θείᾳ μάστιγι, не сводя образ к отвлечённому наказанию
  choice: под ударом божественного бича
  alternative: под Божьим наказанием
  rationale: Образ бича сохранён, а точный характер постигшего героя бедствия не уточняется сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис оставлен незавершённым запятой в соответствии с предоставленным греческим фрагментом; метафора бича и неоднозначность «осознания» сохранены.
