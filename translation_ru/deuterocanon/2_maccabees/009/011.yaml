  naturalness: '«Начал оставлять свою безмерную надменность» звучит не вполне идиоматично: надменность обычно не «оставляют», а «от неё отказываются» либо она «идёт на убыль». Исправленная конструкция естественна и сохраняет незавершённый синтаксис фрагмента.'
