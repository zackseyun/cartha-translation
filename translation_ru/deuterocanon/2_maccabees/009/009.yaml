  terminology: «Нечестивец» уместно сохраняет религиозно-нравственную силу δυσσεβής. «Плоть» оправдана буквальным телесным значением σάρκες. «Смрад» контекстуально точен для ὀσμή, а «гниль» передаёт σαπρία без доктринальных или медицинских уточнений.
