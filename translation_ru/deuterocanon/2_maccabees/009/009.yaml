  yaml_path: translation/deuterocanon/2_maccabees/009/009.yaml
  text: so that worms even swarmed from the body of the ungodly man[a], and while he was still alive, in pains and agonies, his flesh fell away[b], and because of his stench the whole camp was burdened by the rottenness.
translation:
  language: ru
  text: так что из тела нечестивца даже выползали черви[a], и, пока он был ещё жив, среди мук и страданий плоть его отпадала[b], а от его смрада весь лагерь тяготила гниль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из тела нечестивца выкипали черви». Греческий глагол буквально означает «вскипать, бурлить».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его плоть отпадала»; греческая форма изображает происходивший процесс.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δυσσεβοῦς
  choice: нечестивца
  rationale: Передаёт религиозно-нравственный смысл слова — непочтительность и нечестие по отношению к Богу, — не сводя его к общей злонамеренности.
- source_word: σκώληκας ἀναζεῖν
  choice: кишели черви
  rationale: Глагол буквально рисует образ бурления или кипения; в отношении червей «кишели» естественно передаёт их обилие и движение, сохраняя резкость образа.
- source_word: ζῶντος
  choice: пока он был ещё жив
  rationale: Ясно выражает подчёркнутую греческой конструкцией мысль, что разложение происходило до смерти.
- source_word: ἐν ὀδύναις καὶ ἀλγηδόσιν
  choice: в муках и страданиях
  rationale: Сохраняет парное обозначение тяжёлой физической боли в естественном современном русском языке.
- source_word: τὰς σάρκας αὐτοῦ διαπίπτειν
  choice: плоть его распадалась
  rationale: Передаёт буквальное σάρκες и длительный процесс разрушения или отпадения плоти без добавления причины.
- source_word: ὑπὸ δὲ τῆς ὀσμῆς αὐτοῦ
  choice: от исходившего от него смрада
  rationale: Хотя ὀσμή само по себе может означать запах, контекст гниения требует явно отрицательного «смрад»; местоимение относится к человеку, но источник запаха допускает контекстуальное понимание.
- source_word: πᾶν τὸ στρατόπεδον
  choice: весь лагерь
  rationale: Кратко и естественно обозначает военный лагерь.
- source_word: βαρύνεσθαι τὴν σαπρίαν
  choice: изнывал из-за гниения
  rationale: Трудная конструкция описывает лагерь как тяготящийся, мучимый гнилостным состоянием или запахом; «изнывал» сохраняет смысл тяжкого воздействия, а «гниение» — значение σαπρία.
theological_decisions:
- issue: Религиозно-нравственная характеристика Антиоха в δυσσεβοῦς
  choice: нечестивца
  alternative: безбожника; злодея
  rationale: «Нечестивец» сохраняет направленность характеристики на отношение к Богу и священному, не утверждая философского отрицания существования Бога и не заменяя религиозный смысл общей нравственной оценкой.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Графическая телесность оригинала сохранена без эвфемизации; трудная заключительная конструкция передана естественно, без чрезмерной буквальности.
