lexical_decisions:
- source_word: τὴν μὲν ἁγίαν πόλιν
  choice: А святой город
  rationale: ἁγία πόλις — «святой город», то есть Иерусалим; частица μέν отмечает первый пункт в ряду обещаний, поэтому естественно передана союзом «а».
- source_word: σπεύδων παρεγίνετο
  choice: который он спешил
  rationale: Сочетание описывает поспешное движение Антиоха к городу с намерением совершить названное далее; по-русски смысл движения допустимо выразить в составе конструкции «спешил [сделать]».
- source_word: ἰσόπεδον ποιῆσαι
  choice: сравнять с землёй
  rationale: Устойчивое современное выражение точно передаёт намерение полностью разрушить и выровнять город.
- source_word: πολυάνδριον οἰκοδομῆσαι
  choice: превратить в братскую могилу
  rationale: πολυάνδριον обозначает место погребения множества людей; в контексте угрожающей расправы «братская могила» ясно и естественно передаёт этот образ. οἰκοδομῆσαι здесь по смыслу указывает на превращение города в такое место.
- source_word: ἐλευθέραν ἀναδείξει
  choice: он объявит свободным
  rationale: ἀναδείκνυμι может обозначать публичное провозглашение или установление статуса; «объявит свободным» сохраняет эту смысловую широту и форму будущего времени.
theological_decisions:
- issue: Характер обещанной свободы Иерусалима
  choice: объявит свободным
  alternative: сделает свободным; провозгласит автономным
  rationale: Греческий текст говорит о публичном придании или признании статуса, не уточняя его конституционно-политическое содержание; слово «автономным» было бы неоправданным сужением смысла.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Выражения «сравнять с землёй» и «братская могила» естественны для обычного читателя и сохраняют резкость исходного образа.
