base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/015.yaml
  text: But the Jews[a], whom he had determined not even to count worthy of burial, but to cast out with their infants for the birds to devour and for the wild beasts—he would make them all equal to the Athenians.
translation:
  language: ru
  text: Иудеев же[a], которых он решил не удостаивать даже погребения, а выбросить вместе с их младенцами на съедение птицам и диким зверям, — всех их он сделает равными афинянам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть, вероятно, он обещал дать им положение, равное положению афинян, — возможно, такие же гражданские привилегии или правовой статус, а не просто одинаковое общественное уважение.
    reason: Уточнение вероятного историко-политического смысла выражения ἴσους Ἀθηναίοις без внесения этого толкования в основной текст.
lexical_decisions:
- source_word: διέγνωκε
  choice: прежде решил
  rationale: Форма указывает на ранее принятое твёрдое решение Антиоха; «прежде решил» естественно передаёт временную соотнесённость с последующим обещанием.
- source_word: μηδὲ ταφῆς ἀξιῶσαι
  choice: не удостаивать даже погребения
  rationale: 'Сохраняет оценочный оттенок ἀξιόω: речь не просто об отказе в погребении, а о признании людей недостойными его.'
- source_word: οἰωνοβρώτους
  choice: на съедение хищным птицам
  rationale: Сложное прилагательное означает оставленных на пожрание птицам; «хищным птицам» ясно и естественно передаёт образ в данном контексте.
- source_word: σὺν τοῖς νηπίοις
  choice: вместе с их младенцами
  rationale: νήπιοι обозначает совсем малых детей; «младенцами» сохраняет возрастной смысл и жестокость угрозы.
- source_word: ἐκρίψαι
  choice: выбросить
  rationale: Передаёт буквальный и резкий смысл глагола — бросить наружу, оставив без погребения.
- source_word: θηρίοις
  choice: диким зверям
  rationale: Сохраняет литературный регистр и прямое значение существительного; в сочетании «на съедение» дательный отношения выражен естественно по-русски.
- source_word: πάντας αὐτοὺς ἴσους Ἀθηναίοις ποιήσειν
  choice: всех их он сделает равными афинянам
  rationale: Прямо передаёт обещанное уравнение, не уточняя без достаточного основания, шла ли речь о гражданстве, юридическом положении или иных привилегиях.
theological_decisions:
- issue: Политико-культурный смысл выражения «равными афинянам»
  choice: Сохранить буквальное сравнение в основном тексте.
  alternative: «Даст им права, равные правам афинян» или «уравняет их в гражданских правах с афинянами».
  rationale: Греческий текст не называет конкретного юридического механизма. Буквальный перевод сохраняет историческую неоднозначность, а вероятный гражданско-правовой смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Резкость образов сохранена без архаизации; длинная греческая конструкция передана одним связным предложением с тире перед контрастным обещанием.
