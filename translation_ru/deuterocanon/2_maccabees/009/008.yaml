  source_fidelity: 'Основной смысл передан верно: самонадеянное притязание на власть над морскими волнами, образ взвешивания горных высот, последующее унижение и публичное явление Божьей силы. Однако «теперь» не выражено в греческом тексте, а φανεράν относится к «силе» и лучше передавать как то, что сила Бога стала очевидной всем, а не только как наречное определение действия.'
  naturalness: Фраза «в своей надменности, возвышаясь над людьми» тяжеловесна и частично дублирует смысл. Более естественный современный литературный вариант — передать надменность как самовозвышение над людьми. «Так он наглядно являл всем силу Бога» допустимо, но «делая для всех очевидной силу Бога» точнее передаёт синтаксис и звучит естественнее.
  terminology: '«Бог», «сила Бога», «морские волны», «весы» и «носилки» уместны по регистру. Сноска о повторе πίστιν необходима, но не следует уверенно называть его именно «ошибкой»: это вероятное текстологическое объяснение, а не установленный факт.'
