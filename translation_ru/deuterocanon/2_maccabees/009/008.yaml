  yaml_path: translation/deuterocanon/2_maccabees/009/008.yaml
  text: But the one who had thought[a], in his arrogance over men, to command even the waves of the sea, and imagined that he could weigh out the heights of the mountains on a scale, was brought down to the ground and carried in a litter[b], plainly showing to all the power of God.
translation:
  language: ru
  text: А тот, кто из-за своей надменности, с которой он ставил себя выше людей[a], мнил, будто может повелевать даже морскими волнами, и воображал, будто способен взвесить на весах высоты гор, оказался на земле, и его несли на носилках, делая для всех очевидной силу Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-за надменности над людьми». Речь о том, что он в своей гордыне ставил себя выше людей.'
    reason: lexical_alternative
  - marker: b
    text: 'В данном греческом тексте перед словом «силу» стоит необычный повтор: «веру, веру, силу». Возможно, это повтор, возникший при переписывании, или иная текстологическая трудность; перевод передаёт ясный по контексту смысл: «силу Бога».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀντιδοκῶν τοῖς τῆς θαλάσσης κύμασιν
  choice: мнил, будто может повелевать даже морскими волнами
  rationale: Оборот выражает дерзкое притязание Антиоха на власть над морскими волнами. «Мнил» передаёт самонадеянность, а конструкция с «будто» естественна для современного русского повествования.
- source_word: διὰ τὴν ὑπὲρ ἀνθρώπων ὑπερηφανίαν
  choice: в своей надменности, возвышаясь над людьми
  rationale: ὑπερηφανία обозначает высокомерие, а ὑπὲρ ἀνθρώπων — притязание поставить себя выше людей. Развёрнутый оборот сохраняет обе стороны выражения без неестественного буквального «надменность над людьми».
- source_word: πλάστιγγι τῶν ὀρέων οἰόμενος ὕψη στήσειν
  choice: воображал, будто способен взвесить на весах высоты гор
  rationale: Упоминание весов задаёт образ определения меры или веса. «Взвесить на весах» ясно передаёт гиперболическое притязание и сохраняет образ исходного текста.
- source_word: κατὰ γῆν γενόμενος
  choice: теперь оказался на земле
  rationale: Буквально оборот указывает на пребывание внизу, на земле, резко противопоставленное прежним возвышенным притязаниям. «Теперь» делает явным заложенный в противопоставлении временной поворот, не добавляя нового события.
- source_word: ἐν φορίᾳ παρεκομίζετο
  choice: его несли на носилках
  rationale: φορία — переносное приспособление для больного или немощного. «Носилки» — ясное современное слово, подходящее к униженному и беспомощному состоянию героя.
- source_word: φανερὰν τοῦ θεοῦ ... δύναμιν ἐνδεικνύμενος
  choice: так он наглядно являл всем силу Бога
  rationale: 'Причастный оборот описывает публичный результат его унижения: на нём всем стала очевидна Божья сила. Формулировка сохраняет действительный залог греческого причастия и торжественную иронию повествования.'
theological_decisions:
- issue: Смысл ὑπὲρ ἀνθρώπων при описании надменности Антиоха
  choice: возвышаясь над людьми
  alternative: из-за своей надменности перед людьми
  rationale: Предпочтённый вариант сохраняет представление о самовозвышении над человеческим уровнем и не ограничивает выражение отношением лишь к отдельным мужчинам.
- issue: Аномальное чтение τὴν πίστιν τὴν πίστιν τὴν δύναμιν
  choice: В основном тексте передать ясный по контексту смысл как «силу Бога», а повтор отметить в сноске
  alternative: включить в основной текст «веру, веру и силу Бога» либо «верность и силу Бога»
  rationale: Повтор πίστιν синтаксически и смыслово неровен и, вероятно, возник при переписывании. Его буквальное включение создало бы неясное богословское утверждение; сноска честно сохраняет свидетельство данной греческой редакции.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Длинное предложение и параллельные глаголы «мнил / воображал» сохраняют нарастающую риторику оригинала, а тире подчёркивает иронический итог падения Антиоха.
