lexical_decisions:
- source_word: πάνυ δικαίως
  choice: совершенно справедливо
  rationale: πάνυ усиливает δικαίως; перевод сохраняет наречную форму и ясную нравственную оценку воздаяния.
- source_word: σπλάγχνα
  choice: внутренности
  rationale: В данном контексте слово конкретно обозначает внутренние органы, а не чувства или «сердце» в переносном смысле.
- source_word: βασανίσαντα
  choice: подвергал ... мучениям
  rationale: Причастие обозначает жестокое истязание; конструкция естественна по-русски и сохраняет телесную конкретность контекста.
- source_word: πολλαῖς καὶ ξενίζουσαις συμφοραῖς
  choice: многим необычным мучениям
  rationale: πολλαῖς передано количественно, ξενίζουσαις — как «необычным», а συμφοραῖς в контексте намеренно причиняемых страданий — как «мучениям».
- source_word: τὸν ... βασανίσαντα
  choice: того, кто подвергал
  rationale: Субстантивированное причастие в винительном падеже передано русской относительной конструкцией; винительный «того» сохраняет синтаксическую связь с предшествующим контекстом.
theological_decisions:
- issue: Нравственная оценка страданий Антиоха
  choice: «совершенно справедливо» прямо утверждает справедливость воздаяния
  alternative: «вполне заслуженно» или смягчённое «по справедливости»
  rationale: Греческое πάνυ δικαίως недвусмысленно даёт нравственную оценку наказанию; перевод не смягчает и не расширяет её.
translation_notes:
  register: Современный литературный русский язык с достойным, сдержанно торжественным звучанием. Начальный винительный оборот намеренно оставлен связанным с предыдущим контекстом; тире делает фрагмент понятным без добавления отсутствующего в греческом сказуемого.
