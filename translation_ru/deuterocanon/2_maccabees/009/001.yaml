lexical_decisions:
- source_word: Περὶ δὲ τὸν καιρὸν ἐκεῖνον
  choice: Примерно в то время
  rationale: Оборот с περὶ и винительным времени указывает на приблизительный период; δέ выполняет связующую повествовательную функцию, которую по-русски не требуется передавать отдельным словом.
- source_word: ἐτύγχανεν
  choice: возвращался
  rationale: В сочетании с причастием глагол придаёт обстоятельственный оттенок. Буквальное «случилось, что возвращался» в современном русском звучит тяжеловесно, поэтому оттенок передан естественной повествовательной формой.
- source_word: ἀναλελυκὼς
  choice: возвращался
  rationale: В данном контексте причастие означает возвращение или отход из персидских областей.
- source_word: ἀκόσμως
  choice: в беспорядке
  rationale: Выражение сохраняет возможную отсылку как к беспорядочному отступлению, так и к недостойному, позорному характеру возвращения; варианты отмечены в сноске.
- source_word: ἐκ τῶν περὶ τὴν Περσίδα τόπων
  choice: из областей, лежащих близ Персии
  rationale: Передаёт географически широкое и неточное обозначение местностей вокруг или в районе Персии, не отождествляя их однозначно с самой Персией.
- source_word: Ἀντίοχος
  choice: Антиох
  rationale: Устоявшаяся русская библейская форма имени.
