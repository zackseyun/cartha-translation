  text: But while he was at Ecbatana[b][a], news came to him of what had happened to Nicanor and those with Timothy.
translation:
  language: ru
  text: Когда же он находился в окрестностях Экбатаны[a], до него дошла весть о том, что произошло с Никанором и Тимофеем с его людьми[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у Экбатаны»; греческое выражение может указывать как на сам город, так и на прилегающую к нему местность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с Тимофеем и теми, кто был вокруг него»; греческий оборот может обозначать Тимофея вместе с его людьми или его окружение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντι δὲ αὐτῷ
  choice: Когда же он находился
  rationale: Родительный самостоятельный оборот передан временной конструкцией; частица δέ естественно выражена словом «же».
- source_word: κατʼ Ἐκβάτανα
  choice: в окрестностях Экбатаны
  rationale: κατά с названием места допускает значение нахождения у города или в его области; перевод сохраняет эту пространственную неопределённость.
- source_word: προσεπέσε
  choice: до него дошла весть
  rationale: Буквально глагол означает «обрушилось, настигло», однако в сочетании с последующим обозначением событий речь идёт о получении известия; выбран естественный русский оборот.
- source_word: τὰ κατὰ Νικάνορα ... γεγονότα
  choice: о том, что произошло с Никанором
  rationale: Оборот τὰ κατά с причастием γεγονότα обозначает случившееся применительно к Никанору; «произошло с» передаёт это без излишней конкретизации.
- source_word: τοὺς περὶ Τιμόθεον
  choice: людьми Тимофея
  rationale: Конструкция οἱ περὶ + имя обозначает круг спутников или сторонников названного лица и нередко включает его самого; краткий русский эквивалент естественен, а неоднозначность отмечена в сноске.
