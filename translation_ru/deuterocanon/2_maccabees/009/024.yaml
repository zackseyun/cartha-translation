lexical_decisions:
- source_word: ὅπως
  choice: чтобы
  rationale: Передаёт целевое значение союза естественной русской конструкцией.
- source_word: ἐάν τι παράδοξον ἀποβῇ
  choice: если случится что-нибудь неожиданное
  rationale: παράδοξον здесь обозначает непредвиденное событие, а ἀποβῇ естественно передаётся глаголом «случится».
- source_word: προσπέλθῃ τι δυσχερές
  choice: возникнет какое-либо затруднение
  rationale: Сохраняет параллелизм двух условных обстоятельств и передаёт δυσχερές как трудную, неблагоприятную ситуацию.
- source_word: εἰδότες
  choice: зная
  rationale: Сохраняет обстоятельственное причастное значение и связь с подлежащим «жители страны».
- source_word: οἱ κατὰ τὴν χώραν
  choice: жители страны
  rationale: Естественно обозначает людей, находящихся по всей данной территории, без неоправданного сужения до одной провинции.
- source_word: ᾧ καταλέλειπται τὰ πράγματα
  choice: кому вверены дела
  rationale: Передаёт результативное состояние греческого перфекта и вероятный смысл возложенной ответственности; примечание сохраняет более буквальную альтернативу.
- source_word: μὴ ἐπιταράσσωνται
  choice: не пришли в смятение
  rationale: Передаёт усиленное беспокойство и возможную общественную растерянность, оставаясь естественным для литературного русского языка.
