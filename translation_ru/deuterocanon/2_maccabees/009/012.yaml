base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/012.yaml
  text: 'As his pains intensified from moment to moment[a], and he was not even able to endure his own stench, he said this: “It is right to submit to God[c][b], and for one who is mortal not to think proudly.”'
translation:
  language: ru
  text: 'Боль его с каждым мгновением усиливалась[a], и он не мог выносить даже собственного зловония. Тогда он сказал: «Правильно покоряться Богу[b] и, будучи смертным, не мыслить высокомерно[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мгновение за мгновением»; возможно также: «непрерывно».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Справедливо покоряться Богу» или «Подобает покоряться Богу».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и, будучи смертным, не мыслить высокомерно». Эти слова могут относиться к самому говорящему и вместе с тем выражать общий принцип для смертного человека.'
    reason: source_ambiguity
lexical_decisions:
- source_word: κατὰ στιγμὴν
  choice: с каждым мгновением
  rationale: Передаёт последовательное, непрерывное нарастание во времени естественным современным русским выражением.
- source_word: ἐπιτεινόμενος ταῖς ἀλγηδόσιν
  choice: боль его усиливалась
  rationale: По контексту оборот обозначает нарастание телесной боли; единственное число «боль» по-русски звучит естественно и не усиливает значение сверх меры.
- source_word: μηδὲ τῆς ὀσμῆς αὐτοῦ ἀνέχεσθαι δυνάμενος
  choice: он уже не мог выносить даже собственного зловония
  rationale: В контексте болезни нейтральное ὀσμή имеет явно отрицательный смысл; «зловоние» точно передаёт отвратительный запах, а «выносить» — значение ἀνέχεσθαι.
- source_word: ταῦτʼ ἔφη
  choice: Тогда он сказал
  rationale: Естественная вводная формула; «тогда» связывает признание с непосредственно предшествующим страданием, не меняя содержания речи.
- source_word: Δίκαιον
  choice: Правильно
  rationale: Безличное употребление обозначает то, что справедливо, верно или подобает; «правильно» сохраняет широкий нравственно-нормативный смысл.
- source_word: ὑποτάσσεσθαι τῷ θεῷ
  choice: покоряться Богу
  rationale: Передаёт добровольное признание власти Бога и естественно сочетается с дательным падежом.
- source_word: μὴ θνητὸν ὄντα
  choice: будучи смертным
  rationale: Сохраняет причастную конструкцию и отнесённость мысли к говорящему, не исключая её общего нравственного смысла.
- source_word: ὑπερήφανα φρονεῖν
  choice: не мыслить высокомерно
  rationale: Сохраняет когнитивную семантику φρονεῖν и наречный характер ὑπερήφανα; формулировка литературна и понятна.
theological_decisions:
- issue: Общий или личный смысл μὴ θνητὸν ὄντα
  choice: и, будучи смертным, не мыслить высокомерно
  alternative: и смертному не следует мыслить высокомерно
  rationale: Греческий винительный субъект при инфинитиве может в контексте относиться к самому говорящему, одновременно выражая общий принцип. Более формальная конструкция сохраняет эту смысловую напряжённость, не превращая её исключительно в отвлечённое правило.
- issue: Нормативный оттенок Δίκαιον
  choice: Правильно
  alternative: Справедливо / Подобает
  rationale: «Правильно» допускает как нравственную справедливость, так и уместность покорности Богу, не сужая высказывание до одного богословского оттенка.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Синтаксис близок к греческому, но не буквалистичен; архаизмы и конфессионально маркированные формулы не используются.
