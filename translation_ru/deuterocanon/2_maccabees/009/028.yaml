  yaml_path: translation/deuterocanon/2_maccabees/009/028.yaml
  text: So then the murderer and blasphemer[a], after suffering the worst things, just as he had treated others, came to a most pitiable end in a foreign land among the mountains.
translation:
  language: ru
  text: Итак, убийца и богохульник, претерпев самые тяжкие страдания — такие, каким он сам подвергал других, — нашёл самый жалкий конец на чужбине, среди гор.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В предоставленном греческом свидетельстве последняя строка обрывается переносом после κατέ-, однако по контексту и синтаксису слово продолжается в значении «найти конец» или «умереть»; перевод передаёт этот смысл.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνδροφόνος
  choice: убийца
  rationale: Сложное слово обозначает человека, убивающего людей; «убийца» естественно передаёт его осуждающий смысл.
- source_word: βλάσφημος
  choice: богохульник
  rationale: В контексте нечестивых речей Антиоха слово имеет религиозный смысл, поэтому «богохульник» точнее общего «клеветник».
- source_word: τὰ χείριστα παθών
  choice: претерпев самое страшное
  rationale: Сохраняет превосходную степень χείριστα и причастную конструкцию, не уточняя сверх текста характер страданий.
- source_word: ὡς ἑτέρους διέθηκεν
  choice: как он сам поступал с другими
  rationale: Передаёт воздаяние соответственно тому, как он обращался с другими; «сам» естественно подчёркивает сопоставление, не добавляя нового смысла.
- source_word: ἐπὶ ξένης
  choice: на чужбине
  rationale: Краткое и литературное русское выражение передаёт смерть вдали от родной земли.
- source_word: ἐν τοῖς ὄρεσιν
  choice: среди гор
  rationale: Естественно передаёт местонахождение в горной местности.
- source_word: οἰκτίστῳ μόρῳ
  choice: жалким образом окончил жизнь
  rationale: Передаёт усиленное значение οἰκτίστῳ и смертельный исход, заключённый в μόρος, в ясной современной форме.
- source_word: κατέ-
  choice: окончил жизнь
  rationale: В предоставленном свидетельстве слово разорвано переносом; контекст и продолжение синтаксиса указывают на завершение жизни, что отмечено сноской.
theological_decisions:
- issue: Нравственно-воздаятельное изображение смерти Антиоха
  choice: Сохранено прямое сопоставление его страданий с тем, как он поступал с другими.
  alternative: Сообщить лишь о его смерти, ослабив мотив соразмерного воздаяния.
  rationale: Оборот ὡς ἑτέρους διέθηκεν явно выражает соответствие между его действиями и постигшей его участью.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Формулировка ясна обычному читателю; экспрессивность оригинала и мотив воздаяния сохранены без конфессиональных добавлений.
