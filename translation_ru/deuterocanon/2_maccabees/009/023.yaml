lexical_decisions:
- source_word: θεωρῶν
  choice: видя
  rationale: Причастие вводит основание для дальнейшего решения говорящего; «видя» естественно передаёт как восприятие факта, так и его причинный оттенок.
- source_word: ὁ πατήρ
  choice: мой отец
  rationale: Хотя притяжательное местоимение подразумевается контекстом, в русском оно необходимо для ясной и естественной передачи речи царя о собственном отце.
- source_word: καθʼ οὓς καιρούς
  choice: всякий раз, когда
  rationale: Оборот имеет распределительно-повторительное значение и указывает на неоднократные случаи.
- source_word: εἰς τοὺς ἄνω τόπους
  choice: в верхние области
  rationale: Сохраняется буквальный пространственный образ ἄνω без чрезмерно точной географической идентификации; предлог «в» передаёт направленность εἰς.
- source_word: ἐστρατοπέδευσεν
  choice: отправлялся в поход
  rationale: Глагол буквально связан с расположением лагерем, но в данном контексте обозначает военный поход; выбранная формулировка естественна по-русски и сохраняет более широкий военный смысл.
- source_word: ἀνέδειξεν
  choice: назначал
  rationale: В контексте престолонаследия глагол означает официальное определение или провозглашение преемника.
- source_word: τὸν διαδεξάμενον
  choice: того, кто должен был стать его преемником
  rationale: Развёрнутая передача сохраняет глагольную идею последующего вступления в преемство и будущую по отношению к назначению перспективу.
