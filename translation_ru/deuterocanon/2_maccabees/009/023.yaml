    issue: Неоднозначное положение «также»
    rationale: В оригинале καὶ непосредственно характеризует «отца» (καὶ ὁ πατήρ). В русском «Видя также, что мой отец» может быть понято как «также видя». Перенос к «и мой отец» снимает неоднозначность и точнее передаёт оригинал.
