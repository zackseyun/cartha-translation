base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/018.yaml
  text: 'But when his pains had somewhat let up[a], for the just judgment of God had come upon him, and when he recognized his own condition, he wrote to the Jews the letter written below, having the character of a petition[c][b], and reading as follows:'
translation:
  language: ru
  text: 'Когда же его боли стали несколько утихать[a] — ведь его постиг справедливый суд Бога, — он осознал своё положение[b] и написал иудеям приведённое ниже письмо, составленное как прошение[c]. Оно гласило:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его боли начали утихать». Наречие ἰουδαϊσμῶς редко и трудно для истолкования; по контексту речь, вероятно, идёт о некотором ослаблении боли, а не о полном её прекращении.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «осознав то, что касается его самого».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «имевшее форму мольбы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰουδαϊσμῶς ... ληγόντων τῶν πόνων
  choice: его боли стали несколько утихать
  rationale: Редкое и трудное наречие ἰουδαϊσμῶς не позволяет уверенно установить точный оттенок. В сочетании с ληγόντων τῶν πόνων передан осторожный контекстуальный смысл частичного ослабления боли, без утверждения, что она прекратилась.
- source_word: πόνων
  choice: боли
  rationale: В ближайшем контексте речь идёт о телесных мучениях Антиоха; «боли» звучит прямо и естественно, не усиливая лексику без необходимости.
- source_word: δικαία ἡ τοῦ θεοῦ κρίσις
  choice: справедливый суд Бога
  rationale: Сохранены и судебное значение κρίσις, и нравственная оценка δικαία; формулировка ясно связывает бедствие Антиоха с Божьим судом.
- source_word: τὰ κατʼ αὐτὸν ἐπιγνούς
  choice: он осознал своё положение
  rationale: Сжатая греческая фраза буквально означает «осознав то, что касается его самого»; по контексту имеется в виду осознание собственного состояния.
- source_word: τὴν ὑπογεγραμμένην ἐπιστολήν
  choice: приведённое ниже письмо
  rationale: Причастие указывает вперёд на следующий далее текст письма; русский оборот естественно выполняет ту же вводную функцию.
- source_word: ἔχουσαν ἱκετηρίας τάξιν
  choice: составленное как прошение
  rationale: ἱκετηρία обозначает мольбу или прошение, а τάξις — форму или характер; перевод сохраняет просительный характер письма без излишне технического оттенка.
- source_word: περιέχουσαν δὲ οὕτως
  choice: 'Оно гласило:'
  rationale: Естественная современная русская формула перед цитированием содержания письма.
theological_decisions:
- issue: Истолкование страданий Антиоха как Божьего суда
  choice: «его постиг справедливый суд Бога»
  alternative: Нейтральная формулировка, не связывающая его состояние прямо с Божьим судом
  rationale: Греческий текст прямо утверждает, что справедливый Божий суд пришёл на него; перевод не смягчает этой богословской причинности.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Синтаксис упрощён для ясности, но причинная вставка о Божьем суде и переход к тексту письма сохранены. Необычность ἰουδαϊσμῶς отмечена в сноске, а не скрыта уверенным толкованием.
