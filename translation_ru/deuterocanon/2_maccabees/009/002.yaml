  naturalness: Текст литературен и понятен. Исправленная версия делает причинно-временную связь («поэтому, когда») более прозрачной и избегает не обусловленного оригиналом «был вынужден».
  terminology: «Разграбить храм» адекватно передаёт ἱεροσυλεῖν при сохранении пояснения о святотатственном характере. «Взять под контроль город» лучше отражает военно-политическое значение συνέχειν. Имена «Персеполь» и «Антиох» нормативны.
