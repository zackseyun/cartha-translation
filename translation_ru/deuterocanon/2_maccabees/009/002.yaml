base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/002.yaml
  text: For he had entered the so-called Persepolis and attempted to rob the temple and seize control of the city[a]; therefore, when the crowds rushed to arms, they turned him back, and it happened that Antiochus, put to flight by the local inhabitants[b], made a shameful retreat.
translation:
  language: ru
  text: Ведь он уже вошёл в город, называемый Персеполем, и попытался разграбить храм[a] и взять под контроль город. Поэтому, когда толпы устремились вперёд, они прибегли к оружию[b]; Антиох, обращённый в бегство местными жителями, с позором отступил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может также означать «совершить святотатство, разграбив священное место».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «обратились к помощи оружия», то есть перешли к вооружённой защите.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσεληλύθει
  choice: вошёл
  rationale: Плюсквамперфект обозначает действие, предшествовавшее попытке разграбления; в русском последовательность событий ясно передаётся совершенным видом без громоздкой конструкции «уже вошёл».
- source_word: τὴν λεγομένην Περσέπολιν
  choice: город, называемый Персеполем
  rationale: Передаёт λεγομένην, но не привносит современного оттенка сомнения, возможного у выражения «так называемый»; слово «город» добавлено для естественности и проясняется дальнейшим τὴν πόλιν.
- source_word: ἐπεχείρησεν
  choice: попытался
  rationale: Сохраняет значение попытки и не представляет последующие действия как завершившиеся.
- source_word: ἱεροσυλεῖν
  choice: разграбить храм
  rationale: Глагол обозначает святотатственное ограбление священного места; выбранная формулировка естественна по-русски и сохраняет храмовую специфику.
- source_word: συνέχειν
  choice: захватить город
  rationale: В данном военно-политическом контексте передаёт намерение овладеть городом и удерживать его под контролем.
- source_word: τῶν πληθῶν ὁρμησάντων
  choice: толпы устремились вперёд
  rationale: Передаёт резкое, энергичное движение множества людей, выраженное ὁρμάω.
- source_word: ἐπὶ τὴν τῶν ὅπλων βοήθειαν ἐτράπησαν
  choice: прибегли к оружию
  rationale: Идиоматически передаёт буквальное обращение к «помощи оружия», не вводя отсутствующий в греческом прямой объект «его».
- source_word: τροπωθέντα
  choice: обращённый в бегство
  rationale: Сохраняет военное значение поражения и бегства.
- source_word: τῶν ἐγχωρίων
  choice: местными жителями
  rationale: Точно и нейтрально обозначает людей, живших в той местности.
- source_word: αἰσχύμονα τὴν ἀναζυγὴν ποιήσασθαι
  choice: был вынужден с позором отступить
  rationale: Естественно передаёт постыдное отступление после поражения; «был вынужден» выражает результат описанного обращения в бегство, не меняя причинной связи.
