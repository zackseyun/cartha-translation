  verdict: revise
  source_fidelity: Греческое μεμνημένους ... ἕκαστον συντηρεῖν естественнее передать как зависимую от «прошу» конструкцию с «чтобы каждый ... сохранял», а не как самостоятельное «пусть каждый». Кοινῇ κατʼ ἰδίαν точно отражено как благодеяния, оказанные всем вместе и каждому в отдельности. Слово «нынешнее» несколько сужает οὖσαν («существующее, имеющееся») до временного значения.
  naturalness: 'Исходный текст в целом литературен, но сочетание «вас: ... пусть каждый» менее плавно и менее точно передаёт синтаксическую зависимость греческого инфинитива. Предлагаемая конструкция естественна для современного русского официального обращения.'
  terminology: «Благодеяния» и «доброе расположение» уместны по регистру и точно передают εὐεργεσίαι и εὔνοια. «Настоятельно призываю» допустимо, но «призываю и прошу» ближе к порядку и без излишнего усиления передаёт παρακαλῶ ... καὶ ἀξιῶ.
