  yaml_path: translation/deuterocanon/2_maccabees/009/026.yaml
  text: Therefore I urge you and ask you, remembering the benefits shown both publicly and privately, each of you to maintain the goodwill that now exists toward me and my son.
translation:
  language: ru
  text: 'Поэтому призываю и прошу вас: памятуя о благодеяниях, оказанных всем вместе и каждому в отдельности, пусть каждый сохраняет доброе расположение ко мне и моему сыну.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακαλῶ ... καὶ ἀξιῶ
  choice: прошу и настоятельно призываю
  rationale: Передаёт сочетание просьбы и настойчивого обращения, не превращая ἀξιῶ в требование.
- source_word: τῶν εὐεργεσιῶν
  choice: о благодеяниях
  rationale: Точное и естественное в контексте царского письма обозначение оказанных благ.
- source_word: κοινῇ καὶ κατʼ ἰδίαν
  choice: всем вместе и каждому в отдельности
  rationale: Передаёт противопоставление общих и частных благодеяний применительно к адресатам.
- source_word: συντηρεῖν
  choice: сохраняет
  rationale: Выражает продолжение и поддержание уже существующего расположения.
- source_word: τὴν οὖσαν εὔνοιαν
  choice: нынешнее доброе расположение
  rationale: Причастие οὖσαν указывает на расположение, уже существующее в настоящий момент; εὔνοια передана без усиления до верности или преданности.
