base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/013.yaml
  text: 'But the polluted man kept praying to the Master who would no longer have mercy on him[b][a], saying this:'
translation:
  language: ru
  text: 'Но осквернённый[a] продолжал молиться Владыке[b], который уже не помилует его, говоря так:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «запятнанный». Греческое слово имеет сильный оттенок нравственного или культового осквернения.'
    reason: lexical_alternative
  - marker: b
    text: Греч. «Владыка» (δεσπότης), а не более обычное «Господь» (κύριος).
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὔχετο
  choice: продолжал молиться
  rationale: Имперфект передаёт длительное действие; такая формулировка естественно выражает, что молитва продолжалась.
- source_word: ὁ μιερὸς
  choice: осквернённый
  rationale: Субстантивированное прилагательное обозначает человека, запятнанного нравственным или культовым осквернением; перевод сохраняет резкую отрицательную характеристику, не сводя её к общему «несчастный».
- source_word: δεσπότην
  choice: Владыке
  rationale: δεσπότης подчёркивает полную власть и отличается от более обычного κύριος; «Владыка» сохраняет этот оттенок и уместно как обращённый к Богу титул.
- source_word: οὐκέτι
  choice: уже не
  rationale: 'Передаёт временное отрицание: милость более не будет оказана.'
- source_word: ἐλεήσοντα
  choice: который уже не помилует
  rationale: Будущее действительное причастие передано определительным придаточным с будущим временем, сохраняя утверждение повествователя о предстоящем отсутствии милости.
- source_word: οὕτως λέγων
  choice: говоря так
  rationale: Естественно вводит прямую речь, следующую в следующем стихе, и близко следует греческой конструкции.
theological_decisions:
- issue: Передача δεσπότης как титула Бога
  choice: Владыка
  alternative: Господь; Повелитель
  rationale: В источнике стоит δεσπότης, а не κύριος. «Владыка» сохраняет смысл абсолютной власти и позволяет не стирать лексическое различие между этими титулами.
- issue: Определённость отказа в милости
  choice: который уже не помилует его
  alternative: который уже не намеревался миловать его
  rationale: Будущее причастие ἐλεήσοντα в сочетании с οὐκέτι представлено как утверждение повествователя, а не как субъективная догадка молящегося; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Продолжал молиться» ясно передаёт длительность имперфекта; «осквернённый» намеренно сохраняет сильную нравственно-культовую оценку; синтаксис оставляет категоричность слов повествователя без конфессионального истолкования.
