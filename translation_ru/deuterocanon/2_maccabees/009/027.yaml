translation:
  language: ru
  text: Ибо я убеждён, что он, будучи справедливо и человеколюбиво настроенным в согласии с моим намерением[a], будет так же относиться и к вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая причастная конструкция сжата и допускает также понимание: «если он будет справедливо и человеколюбиво руководствоваться моим намерением» или «будучи приведённым в согласие с моим намерением».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: я убеждён
  rationale: Перфект передаёт твёрдую, сложившуюся уверенность говорящего; выражение естественно для современного русского языка.
- source_word: ἐπιεικῶς
  choice: справедливо
  rationale: Передаёт оттенок разумной мягкости, снисходительности и беспристрастности, не сводя значение лишь к кротости.
- source_word: φιλανθρώπως
  choice: человеколюбиво
  rationale: Сохраняет значение доброжелательного, гуманного отношения к людям и соответствует возвышенному эпистолярному регистру.
- source_word: συνσταθέντα
  choice: будучи настроен в согласии
  rationale: Причастие с приставкой συν- здесь, вероятно, обозначает расположенность или приведённость в соответствие; перевод сохраняет сжатость и некоторую неоднозначность греческой конструкции.
- source_word: τῇ ἐμῇ προαιρέσει
  choice: с моим намерением
  rationale: προαίρεσις обозначает обдуманное намерение, выбор или установку; «намерение» естественно и не привносит узкого политического смысла.
- source_word: συνπεριενεχθήσεσθαι
  choice: будет так же относиться и к вам
  rationale: Передаёт будущее поведение по отношению к адресатам и заложенную приставкой συν- идею соответствующего образа действий.
