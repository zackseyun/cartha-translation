lexical_decisions:
- source_word: παρεκομίζετο
  choice: перевозил
  rationale: Имперфект передаёт продолжавшееся действие; «перевозил» естественно сочетается с «телом» и точнее обозначает доставку, чем буквальное «нёс».
- source_word: τὸ σῶμα
  choice: тело
  rationale: В греческом тексте нет выраженного притяжательного местоимения; «тело» сохраняет эту форму и не привносит более резкого оттенка слова «труп».
- source_word: σύντροφος
  choice: спутник
  rationale: Слово может обозначать близкого товарища, в том числе человека, воспитанного вместе с кем-либо. Нейтральное «спутник» не навязывает более узкого придворного или родственного статуса.
- source_word: εὐλαβηθεὶς
  choice: опасаясь
  rationale: Причастие выражает страх или настороженность как причину последующего поступка Филиппа; деепричастие естественно передаёт эту связь по-русски.
- source_word: τὸν υἱὸν Ἀντιόχου
  choice: сына Антиоха
  rationale: Прямая передача греческого родственного обозначения без истолковывающего добавления «наследник».
- source_word: πρὸς Πτολεμαῖον τὸν Φιλομήτορα
  choice: к Птолемею Филометору
  rationale: Предлог πρός в контексте перемещения указывает на направление к Птолемею или под его покровительство; русский предлог «к» сохраняет эту широту.
- source_word: εἰς Αἴγυπτον διεκομίσθη
  choice: перебрался в Египет
  rationale: Хотя διεκομίσθη формально имеет пассивную форму, по смыслу речь идёт о перемещении Филиппа. «Перебрался» звучит естественно и допускает как самостоятельный отъезд, так и организованную переправу; буквальная пассивная возможность отмечена в сноске.
