  yaml_path: translation/deuterocanon/2_maccabees/009/020.yaml
  text: Farewell[a], and your children. And your own affairs—your own affairs—your own affairs will be according to your judgment. Having my hope in heaven,
translation:
  language: ru
  text: Будьте здоровы вы и ваши дети. И ваши дела, и ваши дела, и ваши дела[a] будут по вашему усмотрению. Возлагая надежду на небо,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В использованном греческом свидетельстве слова «ваши дела» повторены трижды. Это можно понимать как намеренное усиление, но возможно и случайное повторение, возникшее при передаче текста.
    reason: textual_variant
lexical_decisions:
- source_word: ἐρρῶσθε
  choice: Будьте здоровы
  rationale: Обычная формула благопожелания в письме. Русское «будьте здоровы» передаёт её естественно и не сводит значение к повелению быть сильными.
- source_word: τὰ τέκνα
  choice: дети ваши
  rationale: В данном сжатом благопожелании артикль допускает естественно подразумеваемую принадлежность; «дети» точнее и шире, чем «сыновья».
- source_word: τὰ ἴδια
  choice: ваши дела
  rationale: Субстантивированное среднее множественное обозначает принадлежащие адресатам дела или обстоятельства. «Ваши дела» понятно и не перегружено.
- source_word: κατὰ γνώμην ὑμῶν
  choice: так, как вы желаете
  rationale: γνώμη может обозначать намерение, волю или суждение. В формуле пожелания благополучия естественнее значение соответствия желаниям адресатов; при этом оно не конкретизируется сверх греческого.
- source_word: ἔσται
  choice: будут идти
  rationale: Будущее время сохранено; «дела будут идти» по-русски естественнее буквального «дела будут».
- source_word: εἰς οὐρανὸν τὴν ἐλπίδα ἔχων
  choice: Возлагая надежду на небо
  rationale: Передана направленность εἰς и сохранена сжатая причастная конструкция без уточнения, на кого или на что именно на небе направлена надежда.
theological_decisions:
- issue: Троекратное повторение τὰ ἴδια в исходном свидетельстве
  choice: Повторение сохранено в основном тексте
  alternative: Оставить одно вхождение как вероятное случайное умножение при передаче текста
  rationale: Предоставленный греческий источник уверенно засвидетельствован и трижды повторяет выражение. Возможную ошибку передачи нельзя молча исправлять; неопределённость отмечена в сноске.
- issue: Объект надежды в выражении εἰς οὐρανόν
  choice: «на небо» без дальнейшего пояснения
  alternative: «на Бога небесного» или «на помощь с неба»
  rationale: Греческий текст называет небо, но прямо не называет Бога или небесную помощь. Перевод сохраняет эту сжатость и не вводит богословского уточнения.
translation_notes:
  register: Современный литературный русский с достоинством эпистолярной формулы. Сжатый синтаксис оригинала сохранён там, где его сглаживание потребовало бы добавления отсутствующего в греческом условия; необычное троекратное повторение оставлено видимым и объяснено сноской.
