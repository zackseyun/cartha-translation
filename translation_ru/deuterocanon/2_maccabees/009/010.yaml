lexical_decisions:
- source_word: τὸν ... δοκοῦντα
  choice: того, кто ... казалось
  rationale: Субстантивированное причастие указывает на Антиоха; оборот «того, кто» естественен по-русски, а «казалось» сохраняет неоднозначность δοκέω между внешним впечатлением и самонадеянным мнением.
- source_word: μικρῷ πρότερον
  choice: ещё недавно
  rationale: Передаёт недавнее прошлое и подчёркивает резкий контраст с нынешним состоянием Антиоха.
- source_word: τῶν οὐρανίων ἄστρων
  choice: небесных звёзд
  rationale: Естественно и возвышенно передаёт греческое выражение, сохраняя космический образ.
- source_word: ἅπτεσθαι
  choice: касался
  rationale: Сохраняет буквальный образ прикосновения и гиперболу возвышения.
- source_word: παρακομίζειν
  choice: нести
  rationale: Ясно передаёт физическое перемещение больного другими людьми без излишней книжности.
- source_word: διὰ τὸ τῆς ὀσμῆς ἀφόρητον βάρος
  choice: из-за невыносимой тяжести зловония
  rationale: Сохраняет метафору βάρος — «тяжесть» — и резкую характеристику запаха, а не сводит выражение к нейтральному «невыносимому запаху».
theological_decisions:
- issue: Гиперболическое описание прежнего возвышения и высокомерия Антиоха
  choice: казалось, касался небесных звёзд
  alternative: думал, что может коснуться небесных звёзд
  rationale: Греческое δοκοῦντα с инфинитивом допускает как значение кажущегося возвышения, так и самонадеянной самооценки. Основной текст не устраняет эту смысловую напряжённость, а примечание сообщает альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены резкий иронический контраст, образ небесных звёзд и метафорическая «тяжесть» зловония; добавленное «теперь» делает подразумеваемое временное противопоставление естественным для русского читателя.
