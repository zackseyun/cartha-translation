lexical_decisions:
- source_word: παντεπόπτης
  choice: всевидящий
  rationale: Точно передаёт значение «видящий всё» и естественно звучит как определение Бога в современном литературном русском.
- source_word: ἐπάταξεν
  choice: поразил
  rationale: Передаёт прямое действие Бога и сохраняет образ удара, выраженный глаголом πατάσσω.
- source_word: ἀνιάτῳ καὶ ἀοράτῳ πληγῇ
  choice: неисцелимым и невидимым ударом
  rationale: Сохраняет оба определения и образ поражения; многозначность πληγή отмечена в сноске.
- source_word: ἄρτι ... καταλήξαντος τὸν λόγον
  choice: едва он закончил говорить
  rationale: Естественно выражает непосредственную временную связь между окончанием речи и началом мучений.
- source_word: ἔλαβεν αὐτὸν
  choice: его схватила
  rationale: Передаёт внезапность и силу боли, овладевшей человеком.
- source_word: ἀνήκεστος
  choice: неутихающая
  rationale: Применительно к боли передаёт отсутствие облегчения и избегает тяжеловесного повтора слова «неисцелимый»; буквальное значение отражено в сноске.
- source_word: τῶν σπλάγχνων ἀλγηδών
  choice: боль во внутренностях
  rationale: Сохраняет телесную конкретность σπλάγχνα, оставаясь понятным и литературным выражением.
- source_word: πικραὶ τῶν ἔνδον βάσανοι
  choice: горькие мучения внутри
  rationale: Передаёт как буквальную силу πικραί, так и внутреннюю локализацию страданий, не отождествляя её полностью с предыдущим выражением.
theological_decisions:
- issue: Прямое участие Бога в поражении Антиоха
  choice: 'Бог представлен непосредственным действующим лицом: «поразил его».'
  alternative: 'Смягчённое истолкование: Бог допустил, чтобы Антиох был поражён.'
  rationale: В греческом тексте подлежащим при ἐπάταξεν прямо назван всевидящий Господь, Бог Израиля; перевод не ослабляет выраженную автором мысль о Божьем суде.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Всевидящий Господь» сохраняет торжественный божественный титул без архаизации. Слова «во внутренностях» и «внутри» удерживают телесную конкретность оригинала; «неутихающая» естественно сочетается с болью, тогда как буквальная семантика ἀνήκεστος документирована в сноске. Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
