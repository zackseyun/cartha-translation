  to: Кроме того, принимая во внимание соседних правителей и тех, кто граничит с царством, выжидающих удобного момента и ожидающих того, что произойдёт, я назначил царём моего сына Антиоха. Когда я неоднократно отправлялся в верхние сатрапии[a], я вверял его большинству из вас и представлял им. Я написал ему следующее.
