  source_fidelity: 'В целом смысл передан верно: политическая угроза со стороны соседей, назначение Антиоха царём, поездки в верхние сатрапии и последующее письмо сохранены. Однако в обороте παρεκατετίθεμην καὶ συνίστων оба глагола относятся к сыну и к «большинству из вас»; в черновике второе действие сформулировано как «рекомендовал вам», без явного объекта и без сохранения «большинству».'
