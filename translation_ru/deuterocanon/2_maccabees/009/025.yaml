base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/009/025.yaml
  text: Moreover[a], considering the rulers nearby and those bordering the kingdom, who are watching for opportunities and awaiting what will happen, I have appointed my son Antiochus as king, whom, when I repeatedly went up to the upper satrapies, I often entrusted and commended to most of you[b]. And I have written to him the things written below.
translation:
  language: ru
  text: Кроме того, принимая во внимание соседних правителей и тех, кто граничит с царством, выжидающих удобного момента и ожидающих того, что произойдёт, я назначил царём моего сына Антиоха. Когда я неоднократно отправлялся в верхние сатрапии[a], я вверял его большинству из вас и представлял им. Я написал ему следующее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Верхние сатрапии» — употреблённый в греческом тексте персидский административный термин; вероятно, речь идёт в широком смысле о внутренних или восточных областях державы.
    reason: cultural_note
lexical_decisions:
- source_word: κατανοῶν
  choice: принимая во внимание
  rationale: Причастие выражает обдуманную оценку политической обстановки, а не просто наблюдение.
- source_word: τοὺς παρακειμένους δυνάστας καὶ γειτνιῶντας τῆς βασιλείας
  choice: соседних правителей и тех, чьи владения граничат с царством
  rationale: Сохраняется накопление двух частично перекрывающихся геополитических характеристик; δυνάστας передано как лица, обладающие политической властью.
- source_word: τοῖς καιροῖς ἐπέχοντας
  choice: которые выжидают удобного момента
  rationale: καιρός здесь указывает на благоприятный случай, а оборот передаёт настороженное политическое ожидание.
- source_word: προσδοκῶντας τὸ ἀποβησόμενον
  choice: и смотрят, что произойдёт
  rationale: Естественная русская формулировка сохраняет открытость ожидаемого исхода.
- source_word: ἀναδέδειχα
  choice: я назначил
  rationale: В контексте престолонаследия глагол обозначает официальное утверждение или провозглашение преемника.
- source_word: ἀνατρέχων εἰς τὰς ἄνω σατραπίας
  choice: когда я неоднократно отправлялся в верхние сатрапии
  rationale: Передана повторяемость действия и сохранён конкретный персидский административный термин.
- source_word: παρεκατετίθεμην καὶ συνίστων
  choice: я вверял его большинству из вас и рекомендовал вам
  rationale: 'Различены два близких действия: поручение чьей-либо заботе и представление с одобрительной рекомендацией.'
- source_word: τὰ ὑπογεγραμμένα
  choice: следующее
  rationale: Краткая естественная документальная формула обозначает написанное далее.
