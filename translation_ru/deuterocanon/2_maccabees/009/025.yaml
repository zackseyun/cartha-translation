  terminology: «Сатрапии» удачно сохраняет историко-административный термин. «Царём» точно передаёт предикативное βασιλέα. Для двух перекрывающихся обозначений окружающих политических субъектов предпочтительны «соседние правители и те, кто граничит с царством», без необоснованного уточнения о владениях.
