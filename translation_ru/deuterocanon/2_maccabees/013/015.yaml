base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/015.yaml
  text: And after giving those around him the battle cry[a], “God’s Victory,” he attacked the royal court by night with the finest armed young men, struck down about two thousand men in the camp[b], and cut down the leading elephant together with its rider.
translation:
  language: ru
  text: Подав своим людям условный боевой клич[a] «Победа Божья!», он ночью с отборными, хорошо снаряжёнными юношами напал на царскую ставку, перебил в лагере около двух тысяч человек и сразил главного из слонов вместе с человеком, находившимся в сооружении, подобном домику[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «условный знак», «пароль». Греческое слово обозначает военный пароль или сигнал; здесь он выражен словами «Победа Божья!».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с находившимся в домике». Вероятно, имеется в виду человек, находившийся в башенке или иной надстройке на боевом слоне.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀναδοὺς δὲ τοῖς περὶ αὐτὸν
  choice: подав своим людям
  rationale: Аористное причастие передаёт действие, предшествующее нападению; τοῖς περὶ αὐτόν — обычное обозначение находившихся при нём людей.
- source_word: σύνθημα
  choice: условный боевой клич
  rationale: Военное σύνθημα может означать пароль, условный знак или лозунг. В данном контексте названо его словесное содержание, поэтому сочетание передаёт и условность, и боевую функцию.
- source_word: Θεοῦ Νίκην
  choice: «Победа Божья!»
  rationale: Краткая именная формула сохраняет родительный Θεοῦ и звучит как провозглашаемый боевой лозунг, не превращая его в более однозначное утверждение «Бог победит».
- source_word: νεανίσκων ἀρίστων κεκοσμημένων
  choice: с отборными, хорошо снаряжёнными юношами
  rationale: ἀρίστων обозначает лучших, отборных, а κεκοσμημένων в военном контексте — должным образом снаряжённых; перевод не ограничивает смысл только оружием.
- source_word: ἐπιβαλὼν νύκτωρ ἐπὶ τὴν βασιλικὴν αὐλήν
  choice: ночью ... напал на царскую ставку
  rationale: ἐπιβάλλω с ἐπί передаёт нападение; αὐλή здесь, в военной обстановке, вероятнее означает ограждённое царское помещение или ставку, а не царский двор как окружение монарха.
- source_word: τὴν παρεμβολὴν ἀνεῖλεν εἰς ἄνδρας δυσχιλίους
  choice: перебил в лагере около двух тысяч человек
  rationale: παρεμβολή — военный лагерь; ἀναιρέω означает убить или уничтожить, а εἰς с числом передаёт приблизительное количество.
- source_word: τὸν πρωτεύοντα τῶν ἐλεφάντων
  choice: главного из слонов
  rationale: πρωτεύοντα может обозначать первого, передового или главного; «главного из слонов» сохраняет возможную идею первенства без уточнения, было ли оно позиционным или статусным.
- source_word: σὺν τῷ κατʼ οἰκίαν ὄντι
  choice: вместе с человеком, находившимся в установленной на нём башенке
  rationale: Буквально речь идёт о находящемся «в домике»; применительно к боевому слону это человек в установленной на животном башенке или сиденье. Развёрнутый перевод точнее общего слова «всадник».
- source_word: συνέθηκεν
  choice: сразил
  rationale: В контексте ночного нападения глагол описывает смертельное поражение слона и человека на нём; нейтральное «сразил» естественно по-русски и согласуется с повествовательным контекстом.
theological_decisions:
- issue: Смысл лозунга Θεοῦ Νίκην
  choice: «Победа Божья!»
  alternative: «Бог победит!» / «Победа от Бога!»
  rationale: Греческая именная конструкция допускает оттенки принадлежности, источника или совершаемой Богом победы. Выбранная формула сохраняет эту сжатость и не делает богословское отношение более определённым, чем в источнике.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Царская ставка» устраняет современное значение выражения «царский двор», а «хорошо снаряжённые» сохраняет более широкий смысл κεκοσμημένων. Синтаксис сделан плавным, при этом последовательность действий греческого текста сохранена.
