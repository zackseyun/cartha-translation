  text: But Rhodocus, from the Jewish ranks, disclosed the secrets to the enemies; he was sought out and caught and imprisoned.
translation:
  language: ru
  text: Но Родок, из иудейских рядов, выдал врагам тайные сведения; его разыскали, схватили и заключили под стражу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ μυστήρια
  choice: тайные сведения
  rationale: В данном военном контексте речь, вероятнее всего, идет о секретной информации или замыслах; буквальное «тайны» по-русски могло бы получить ненужный религиозно-мистический оттенок.
- source_word: ἐκ τῆς Ἰουδαϊκῆς τάξεως
  choice: из иудейских рядов
  rationale: Передает принадлежность Родока к иудейской стороне или отряду, не уточняя его должность, которой греческий текст не называет.
- source_word: ἀνεζητήθη
  choice: разыскали
  rationale: Глагол указывает на предпринятый и успешный розыск; активная неопределенно-личная конструкция естественна в современном русском.
- source_word: κατελήμφθη
  choice: схватили
  rationale: Передает фактическое задержание после розыска; это точнее и естественнее здесь, чем нейтральное «поймали».
- source_word: κατεκλείσθη
  choice: заключили под стражу
  rationale: Передает помещение под охрану или в заключение, не конкретизируя вид места содержания, которого источник не указывает.
