  yaml_path: translation/deuterocanon/2_maccabees/013/005.yaml
  text: In that place there was a tower fifty cubits high[a], full of ashes, and it had all around it a circular contrivance sloping steeply down into the ashes.
translation:
  language: ru
  text: В том месте есть башня высотой в пятьдесят локтей, наполненная пеплом; она имеет круглое приспособление[a], которое со всех сторон круто спускается в пепел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «круговое устройство»; возможно также: «вращающееся приспособление». Греческое слово обозначает приспособление или орудие без уточнения его вида, а прилагательное, вероятнее всего, указывает на круглую форму, хотя может подразумевать и движение по кругу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πύργος
  choice: башня
  rationale: Обычное значение слова — башня или башнеподобное сооружение; «башня» естественно и точно подходит к описываемому месту казни.
- source_word: πεντήκοντα πήχεων
  choice: высотой в пятьдесят локтей
  rationale: πήχυς — древняя мера длины, локоть. Слово «высотой» естественно уточняет, какое измерение башни имеется в виду.
- source_word: πλήρης σποδοῦ
  choice: наполненная пеплом
  rationale: σποδός обозначает пепел; согласование причастия с «башней» прямо передаёт греческую конструкцию.
- source_word: ὄργανον
  choice: приспособление
  rationale: 'Слово имеет широкое значение: орудие, инструмент или устройство. «Приспособление» сохраняет неопределённость в отношении точного устройства и действия сооружения.'
- source_word: περιφερές
  choice: круглое
  rationale: Прилагательное естественнее всего описывает округлую форму. Перевод со значением вращения был бы возможен, но добавлял бы не обозначенную прямо функцию.
- source_word: πάντοθεν
  choice: со всех сторон
  rationale: Наречие указывает на охват со всех сторон.
- source_word: ἀπόκρημνον
  choice: круто обрывающееся
  rationale: Слово выражает крутой, обрывистый спуск; выбранная формулировка сохраняет образ резкого падения вниз.
- source_word: εἰς τὴν σποδόν
  choice: в пепел
  rationale: Предлог εἰς передаёт направленность внутрь или вниз к пеплу; «в пепел» естественно выражает это движение.
