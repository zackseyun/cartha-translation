lexical_decisions:
- source_word: εἰληφὼς πεῖραν
  choice: на опыте узнав
  rationale: Греческая идиома буквально означает «получив опыт»; выбранный оборот естественно передаёт знание, приобретённое в непосредственном столкновении.
- source_word: εὐτολμίας
  choice: отвагу
  rationale: Слово обозначает готовность действовать смело и дерзновенно. «Отвага» сохраняет положительно-нейтральный военный смысл, не усиливая его до неодобрительного «дерзость».
- source_word: κατεῖρασεν
  choice: попытался овладеть
  rationale: Форма и её оттенок в данном контексте трудны для однозначного определения. Перевод передаёт вероятное военное действие, направленное на захват позиций, но не утверждает, что захват состоялся.
- source_word: διὰ μεθόδων
  choice: при помощи военных хитростей
  rationale: В контексте речь идёт не просто о способах действия, а о расчётливых тактических приёмах; уточнение «военных» делает смысл ясным современному читателю.
- source_word: τοὺς τόπους
  choice: укреплёнными местами
  rationale: Буквально — «местами», однако военный контекст указывает на обороняемые позиции. Такой перевод раскрывает контекстуальный смысл, не сужая его до конкретного типа крепостей.
