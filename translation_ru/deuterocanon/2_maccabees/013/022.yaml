lexical_decisions:
- source_word: ἐδευτερολόγησεν
  choice: снова вступил в переговоры
  rationale: Глагол указывает на повторное обращение или повторный раунд обсуждений; в военно-политическом контексте и перед последующим обменом заверениями естественнее передать его как возобновление переговоров, не сводя смысл к простому «сказал во второй раз».
- source_word: τοῖς ἐν Βαθσούροις
  choice: с теми, кто находился в Вефсуре
  rationale: Греческое выражение обозначает находившихся в городе людей, не уточняя прямо ни их пол, ни статус защитников.
- source_word: Βαθσούροις
  choice: Вефсуре
  rationale: Выбрана традиционная русская библейская форма греческого топонима; более близкая к еврейскому названию форма «Бет-Цур» указана в сноске.
- source_word: δεξιὰν ἔδωκεν, ἔλαβεν
  choice: дал им заверение и получил заверение от них
  rationale: Буквально говорится о том, что царь «дал правую руку и принял», то есть обменялся символическими заверениями соглашения или верности. Формулировка сохраняет направленность обоих действий и передаёт значение идиомы современным русским языком.
- source_word: ἀπῇει
  choice: ушёл
  rationale: Простой повествовательный глагол удаления; «ушёл» естественно и точно передаёт действие.
