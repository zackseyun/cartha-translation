  yaml_path: translation/deuterocanon/2_maccabees/013/025.yaml
  text: He came to Ptolemais[a]. The people of Ptolemais were displeased about the terms, for they were exceedingly fearful[b], and they wanted to set aside the arrangements.
translation:
  language: ru
  text: Он пришёл в Птолемаиду. Жители Птолемаиды были недовольны условиями соглашения, ибо они очень боялись. Они хотели отменить согласованные положения[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оговорённые условия». Употреблённое здесь греческое существительное встречается редко и, вероятно, означает конкретные положения достигнутого соглашения.'
    reason: lexical_alternative
  - marker: b
    text: При проверке источника для этого стиха выявлено существенное расхождение. Перевод следует сохранившемуся греческому тексту, однако некоторые лексические детали менее надёжны, чем обычно.
    reason: textual_variant
lexical_decisions:
- source_word: ἐδυσφόρουν
  choice: были недовольны
  rationale: Глагол передаёт тягостную или отрицательную реакцию; этот вариант естественно выражает недовольство условиями соглашения, не усиливая его до ярости.
- source_word: συνθηκῶν
  choice: условиями соглашения
  rationale: В данном политическом контексте множественное число указывает на условия достигнутого соглашения, а не на завет в богословском смысле.
- source_word: ἐδειλίαζον
  choice: были крайне напуганы
  rationale: Форма обозначает сильный страх или робость. Перевод сохраняет причинную связь и не вносит излишне резкой нравственной оценки «трусили».
- source_word: ὑπεράγαν
  choice: крайне
  rationale: Наречие выражает чрезвычайно высокую степень и усиливает обозначение страха.
- source_word: ἀθετεῖν
  choice: отменить
  rationale: Глагол может означать отвергнуть, упразднить или признать недействительным; в контексте договорённости «отменить» ясно передаёт намерение не соблюдать принятые положения.
- source_word: διαστάλσεις
  choice: согласованные положения
  rationale: Редкое существительное, вероятно, обозначает конкретные предписания или оговорённые положения урегулирования. Выбор отличает их от соглашения в целом и остаётся понятным современному читателю.
