lexical_decisions:
- source_word: τοῖς δὲ ἔνδον
  choice: находившимся внутри
  rationale: Субстантивированное наречие ἔνδον обозначает людей, находящихся внутри осаждённого места; формулировка сохраняет пространственный смысл и не добавляет отсутствующего в греческом слова «мужчины».
- source_word: Ἰούδας
  choice: Иуда
  rationale: Традиционная русская передача библейского имени Ἰούδας в данном контексте.
- source_word: τὰ δέοντα
  choice: всё необходимое
  rationale: Выражение обозначает необходимые вещи без уточнения их состава; перевод не сужает смысл до продовольствия или припасов.
- source_word: εἰσεπέμπεν
  choice: посылал
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие в прошлом; русская форма несовершенного вида естественно сохраняет эту аспектуальность.
