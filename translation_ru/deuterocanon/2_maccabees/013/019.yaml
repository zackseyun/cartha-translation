  text: And at Bethsura he attacked a small garrison of the Jews[a], but was turned back, was repulsed[c][b], and was weakened.
translation:
  language: ru
  text: У Вефсуры[a] он предпринимал наступление на небольшой укреплённый пункт иудеев[b], но его обращали вспять, он натолкнулся на отпор[c], и силы его слабели.
