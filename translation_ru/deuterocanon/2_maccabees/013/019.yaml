    text: 'В греческом тексте следует краткая цепь глаголов: он предпринимал наступление на укрепление, затем его обращали вспять, он натолкнулся на сопротивление, и силы его слабели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βαθσούροις
  choice: Ветсуры
  rationale: Передача традиционного семитского названия в форме «Ветсура» естественна для русского библейского текста; греческая форма представляет собой его транслитерацию.
- source_word: φρούριον ὀλίγον
  choice: небольшого укреплённого пункта
  rationale: φρούριον может обозначать крепость, укреплённый пост или размещённый там гарнизон. Нейтральное «укреплённый пункт» сохраняет предметную и военную стороны значения, а ὀλίγον передано как «небольшой».
- source_word: τῶν Ἰουδαίων
  choice: иудеев
  rationale: Родительный падеж указывает, что укреплённый пункт принадлежал иудеям или удерживался ими; краткая форма не устраняет эту допустимую смысловую широту.
- source_word: προσῆγεν
  choice: двинулся против
  rationale: В данном военном контексте глагол описывает наступательное продвижение против цели. Такая передача ближе к образу движения в греческом, чем обобщённое «напал».
- source_word: ἐτροποῦτο
  choice: был обращён вспять
  rationale: Средне-пассивная форма обозначает, что наступавшего заставили отступить; перевод не усиливает смысл до полного разгрома или бегства.
- source_word: προσενέκρουσεν
  choice: встретил отпор
  rationale: Глагол буквально передаёт столкновение с препятствием; в военном контексте «встретил отпор» ясно выражает остановившее его сопротивление.
- source_word: ἡλαττονοῦτο
  choice: силы его убывали
  rationale: Глагол обозначает уменьшение, ослабление или утрату превосходства. Русская формулировка естественно передаёт продолжительный характер формы и не уточняет, шла ли речь только о численности, мощи или положении войска.
