  source_fidelity: 'В целом смысл передан точно: речь о наступлении на небольшой иудейский укреплённый пункт, последующем оттеснении, столкновении с отпором и ослаблении. Однако «двинулся» как однократное совершенное действие несколько сглаживает несовершенный вид προσῆγεν; «предпринимал наступление» лучше передаёт военное продвижение/давление. Для Βαθσούροις предпочтительна более устоявшаяся русская библейская форма «Вефсура», а не «Ветсура».'
