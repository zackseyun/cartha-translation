  text: And in the end they filled the camp with fear and confusion[a], and withdrew prosperously.
translation:
  language: ru
  text: В конце концов они наполнили лагерь страхом и смятением, а сами благополучно отошли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отошли, добившись успеха». Греческое εὐημεροῦντες означает, что они преуспевали или находились в благоприятном положении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τέλος
  choice: в конце концов
  rationale: Передаёт временно-итоговое значение выражения естественно для современного русского повествования.
- source_word: παρεμβολήν
  choice: лагерь
  rationale: В данном военном контексте существительное обозначает неприятельский лагерь; краткое «лагерь» ясно из контекста.
- source_word: δέους
  choice: страхом
  rationale: Сохраняет широкое значение сильного страха, не усиливая его без необходимости до «ужаса».
- source_word: ταραχῆς
  choice: смятением
  rationale: Передаёт внутреннее волнение и возникший беспорядок; хорошо сочетается со «страхом» в военном контексте.
- source_word: ἐπλήρωσαν
  choice: наполнили
  rationale: 'Прямо воспроизводит образ греческого глагола: лагерь оказался наполнен страхом и смятением.'
- source_word: ἐξέλυσαν
  choice: отошли
  rationale: Нейтрально передаёт уход военного отряда после нападения, не создавая нежелательного оттенка поражения, возможного у слова «отступили».
- source_word: εὐημεροῦντες
  choice: благополучно
  rationale: Передаёт то, что участники ушли, находясь в благоприятном положении и успешно завершив действие; неоднозначность причастия отмечена в сноске.
