base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/002.yaml
  text: 'and with him Lysias[a], the guardian and overseer of affairs, each having a Greek force: eleven myriads of infantry, five thousand three hundred cavalry, twenty-two elephants[b], and three hundred scythed chariots.'
translation:
  language: ru
  text: 'и с ним — Лисий, опекун и управляющий государственными делами[a]. У каждого из них было греческое войско: сто десять тысяч[b] пеших воинов, пять тысяч триста всадников, двадцать два слона и триста серпоносных колесниц.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «регент и управляющий государственными делами». Греческие обозначения Лисия выражают как вверенную ему опеку, так и административную власть.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «одиннадцать мириад». Одна мириада — десять тысяч; следовательно, речь идёт о 110 000 пеших воинов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ Λυσίαν
  choice: и с ним — Лисий
  rationale: Оборот передаёт сопровождение, а личное имя транслитерируется в принятой русской библейской форме.
- source_word: τὸν ἐπίτροπον
  choice: опекун
  rationale: ἐπίτροπος обозначает лицо, которому вверены опека и управление; «опекун» сохраняет основной смысл, не сводя должность однозначно к регентству.
- source_word: καὶ ἐπὶ τῶν πραγμάτων
  choice: и распорядитель государственных дел
  rationale: Идиома указывает на административные полномочия. Добавление «государственных» естественно проясняет придворно-политический контекст πράγματα.
- source_word: ἕκαστον ἔχοντα δύναμιν Ἑλληνικὴν
  choice: у каждого из них было греческое войско
  rationale: ἕκαστον относится к обоим названным лицам; «греческое войско» близко передаёт δύναμιν Ἑλληνικήν, сохраняя возможный широкий смысл эллинистических вооружённых сил.
- source_word: πεζῶν μυριάδας ἕνδεκα
  choice: сто десять тысяч пеших воинов
  rationale: Одиннадцать мириад равны 110 000. Число раскрыто в обычной современной русской форме, а исходное выражение отмечено в сноске.
- source_word: ἱππέων πεντακισχιλίους τριακοσίους
  choice: пять тысяч триста всадников
  rationale: Конкретное «всадников» естественно по-русски и точно обозначает численность конных воинов.
- source_word: ἐλέφαντας εἴκοσι δύο
  choice: двадцать два слона
  rationale: Прямой перевод; в военном перечне подразумеваются боевые слоны.
- source_word: ἅρματα δὲ δρεπανηφόρα τριακόσια
  choice: триста серпоносных колесниц
  rationale: «Серпоносные колесницы» — краткое и традиционно понятное обозначение колесниц, снабжённых боевыми серпами.
theological_decisions:
- issue: Статус Лисия, обозначенный словом ἐπίτροπος
  choice: опекун
  alternative: регент
  rationale: Греческое слово допускает оба оттенка. Основной текст сохраняет идею вверенной опеки, а возможный политический смысл регентства указывается в сноске, без излишнего уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Военная численность выражена привычными русскими числительными; технический термин «серпоносные колесницы» сохранён. Разделение на два предложения устраняет тяжеловесность исходной конструкции, не меняя её синтаксических связей.
