  text: Very justly[a]; for because he had committed many sins against the altar, whose fire and ashes were holy[b], he met his death in ashes.
translation:
  language: ru
  text: 'Вполне справедливо[a]: ведь он совершил много грехов против жертвенника, огонь и пепел которого были священны; в пепле он обрёл смерть[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Совершенно справедливо». Начальные греческие слова подчёркивают, что постигшая его участь была заслуженной.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в пепле получил смерть»; это, вероятно, намеренно перекликается с его грехами против жертвенника и его священным пеплом.'
    reason: literal_rendering
lexical_decisions:
- source_word: πάνυ δικαίως
  choice: Вполне справедливо
  rationale: Передаёт усиление πάνυ и значение δικαίως — заслуженность и справедливость постигшей его участи.
- source_word: συνετέλεσεν πολλὰ ... ἁμαρτήματα
  choice: совершил много грехов
  rationale: Естественно передаёт сочетание со значением совершения греховных деяний, сохраняя религиозно-нравственную силу ἁμαρτήματα.
- source_word: περὶ τὸν βωμόν
  choice: против жертвенника
  rationale: В контексте святотатства περί указывает на грехи, направленные против жертвенника, а не просто связанные с ним.
- source_word: ἁγνὸν
  choice: священны
  rationale: В храмовом контексте обозначает культовую чистоту и освящённость огня и пепла; «священны» естественно применимо к обоим существительным.
- source_word: ἐν σποδῷ
  choice: в пепле
  rationale: Сохраняет буквальный образ и намеренную связь с пеплом жертвенника.
- source_word: τὸν θάνατον ἐκομίσατο
  choice: он и принял смерть
  rationale: Близко передаёт буквальное «получил себе смерть» и с помощью частицы «и» подчёркивает соответствие наказания проступку.
theological_decisions:
- issue: Культовое описание огня и пепла жертвенника
  choice: огонь и пепел которого были священны
  alternative: огонь которого был чист и пепел священен
  rationale: Греческое ἁγνόν формально согласовано с ближайшим существительным среднего рода πῦρ, тогда как второе подлежащее σποδός женского рода; по смыслу сказуемое относится к сочетанию «огонь и пепел». В культовом контексте «священны» лучше передаёт посвящённость Богу, не сводя ἁγνός к физической чистоте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены лаконизм, причинная связь и образная перекличка двух упоминаний пепла; избегаются архаизмы и конфессионально окрашенные уточнения.
