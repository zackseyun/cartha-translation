  text: '[they were] about to be deprived of the law and fatherland and holy temple[a], and [he urged them] not to allow the people, who had just now recovered a little[b], to become subject to the reviling nations.'
translation:
  language: ru
  text: '[Им предстояло] лишиться Закона, отечества и святого храма, и [он призывал их] не допустить, чтобы народ, лишь недавно немного оправившийся, оказался во власти злословящих народов[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «богохульных народов». Греческое слово может означать оскорбительную, нечестивую или богохульную речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στερεῖσθαι
  choice: лишиться
  rationale: Передаёт угрозу утраты перечисленных святынь и благ; в данном синтаксическом окружении естественнее современного русского «быть лишёнными».
- source_word: νόμου
  choice: Закона
  rationale: В иудейском контексте обозначает данный Израилю Закон; прописная буква ясно передаёт это референциальное значение без развёрнутого толкования.
- source_word: πατρίδος
  choice: отечества
  rationale: Сохраняет значение родной, отеческой земли и соответствует возвышенному, но современному литературному регистру.
- source_word: ἱεροῦ ἁγίου
  choice: святого храма
  rationale: ἱερόν здесь обозначает храм, а ἅγιος — его святость; сочетание естественно по-русски.
- source_word: ἄρτι βραχέως ἀνεψυγμένα
  choice: лишь недавно немного оправившийся
  rationale: Передаёт одновременно недавность и ограниченность наступившего облегчения; «оправившийся» естественно выражает восстановление после бедствий.
- source_word: λαὸν
  choice: народ
  rationale: Прямо обозначает здесь народ Израиля как общность.
- source_word: δυσφήμοις ἔθνεσιν
  choice: злословящих народов
  rationale: Сохраняет присущее δυσφήμος значение дурной, оскорбительной или нечестивой речи, не сужая его исключительно до хулы на Бога.
- source_word: ὑποχειρίους γενέσθαι
  choice: оказался во власти
  rationale: Идиоматично передаёт переход под чужой контроль, заложенный в образе нахождения «под рукой» другого.
theological_decisions:
- issue: Восполнение подразумеваемых элементов зависимой греческой конструкции
  choice: 'Контекстуально необходимые слова даны в квадратных скобках: «[Им предстояло]» и «[он призывал их]».'
  alternative: Сохранить фрагментарную инфинитивную конструкцию либо полностью перестроить её по контексту предыдущего стиха без графического обозначения добавлений.
  rationale: Сам по себе данный стих синтаксически зависит от предшествующего контекста. Скобки обеспечивают понятность и одновременно показывают, какие элементы не выражены в этом отрывке явно.
- issue: Смысл δυσφήμοις применительно к народам
  choice: «злословящих народов»
  alternative: «богохульных народов» или «народов, поносящих их»
  rationale: Греческое слово допускает значения оскорбительной, дурной, нечестивой или хульной речи. Выбранный вариант сохраняет широту и неоднозначность слова, не добавляя невыраженный объект злословия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксическая зависимость от предыдущего стиха обозначена квадратными скобками; подлинная неоднозначность δυσφήμοις сохранена в тексте и примечании.
