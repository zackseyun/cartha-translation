  yaml_path: translation/deuterocanon/2_maccabees/013/014.yaml
  text: And after entrusting the outcome to the Lord of the world[a], and urging those with him to fight bravely to the death for the laws, the temple, the city, the homeland, and the commonwealth[b], he encamped near Modein.
translation:
  language: ru
  text: Вверив дело Владыке мира[a], он призвал тех, кто был с ним, мужественно сражаться до смерти за законы, храм, город, отечество и общественный строй[b], а затем расположил войско близ Модиина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Владыке вселенной». Греческое κόσμος может означать мир или упорядоченную вселенную.'
    reason: lexical_alternative
  - marker: b
    text: Греческое πολιτεία может также означать «гражданский уклад», «государственное устройство» или «образ жизни».
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς δὲ τὴν ἐπιτροπὴν
  choice: Поручив всё
  rationale: Оборот с ἐπιτροπή означает передачу дела в чьё-либо попечение. «Всё» естественно передаёт подразумеваемое дело или исход, не сводя значение к административному «надзору».
- source_word: τῷ κυρίῳ τοῦ κόσμου
  choice: Владыке мира
  rationale: «Владыка» сохраняет значение κύριος как суверенного Господина; «мира» прямо передаёт κόσμος, при этом возможность значения «вселенная» отмечена в сноске.
- source_word: παρακαλέσας τοὺς σὺν αὐτῷ
  choice: он призвал своих людей
  rationale: В военном контексте так естественно передаётся призыв к находившимся с Иудой, без уточнения их статуса сверх текста.
- source_word: γενναίως ἀγωνίσασθαι μέχρι θανάτου
  choice: мужественно сражаться до смерти
  rationale: Военный контекст требует «сражаться»; μέχρι θανάτου сохранено сильным и намеренно не смягчённым выражением «до смерти».
- source_word: περὶ νόμων, ἱεροῦ, πόλεως, πατρίδος, πολιτείας
  choice: за законы, храм, город, отечество и общественный строй
  rationale: Сохранён ряд защищаемых ценностей и множественное число νόμων. «Общественный строй» передаёт политико-гражданский диапазон πολιτεία, не сужая его до одной конституции.
- source_word: περὶ δὲ Μωδεεὶμ ἐποιήσατο τὴν στρατιάν
  choice: а затем расположил войско близ Модиина
  rationale: Выражение указывает на размещение или построение войска в окрестностях Модиина. «Расположил войско» сохраняет военную активность субъекта и не утверждает однозначно, что речь именно о лагере.
theological_decisions:
- issue: Передача κύριος применительно к Богу как правителю κόσμος
  choice: Владыка
  alternative: Господь
  rationale: В составе титула «Владыка мира» по-русски ясно выражает вселенское владычество Бога. Вариант «Господь мира» может быть ошибочно понят как «Господь покоя».
- issue: Смысл πολιτεία среди предметов национально-религиозной защиты
  choice: общественный строй
  alternative: государство; гражданский уклад; образ жизни
  rationale: Выбранный вариант сохраняет общественно-политическое значение термина, не привнося современного понятия национального государства и не сводя его лишь к частному образу жизни.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён без утраты последовательности греческих причастий; перечисление и напряжённое «до смерти» сохранены.
