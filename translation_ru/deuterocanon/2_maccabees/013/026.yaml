base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/026.yaml
  text: Lysias came forward to the tribunal, made as good a defense as he could, persuaded them, calmed them, made them well-disposed, and marched back to Antioch. Thus the king’s attack and withdrawal proceeded.
translation:
  language: ru
  text: Лисий подошёл к трибуне[a], защищался, насколько позволяли обстоятельства[b], убедил их, успокоил и добился их расположения, а затем отправился в Антиохию. Так обстояло дело с нападением царя и его отходом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к судейскому месту»; слово βῆμα могло обозначать возвышение, помост или место официального суда.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое наречие имеет не вполне ясный оттенок; возможно также: «достаточно убедительно» или «как только мог».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «нападением царя и его отступлением».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσῆλθεν ἐπὶ τὸ βῆμα
  choice: выступил перед трибуналом
  rationale: Оборот описывает выход Лисия к официальному месту публичного разбирательства. «Выступил перед трибуналом» естественно передаёт и движение, и официальный контекст.
- source_word: ἀπελογήσατο
  choice: защитил себя
  rationale: Средний залог указывает на выступление в собственную защиту; краткая русская формулировка сохраняет юридико-публичный оттенок.
- source_word: ἐνδεχομένως
  choice: насколько позволяли обстоятельства
  rationale: Трудное наречие может обозначать приемлемость, возможность или соответствие обстоятельствам. Выбор сохраняет обусловленность ситуации, не утверждая более точного смысла, чем позволяет греческий текст.
- source_word: συνέπεισεν
  choice: убедил их
  rationale: Передаёт результат усиленного глагола убеждения; объект по-гречески подразумевается и естественно восполняется по контексту.
- source_word: κατεπράϋνεν
  choice: успокоил
  rationale: Глагол означает успокоить или умиротворить; «успокоил» понятно современному читателю и не добавляет идеи сделки.
- source_word: εὐμενεῖς ἐποίησεν
  choice: добился их расположения
  rationale: Естественно передаёт буквальное «сделал благосклонными», сохраняя причинный результат действий Лисия.
- source_word: ἀνέζευξεν
  choice: отправился
  rationale: Военный глагол может означать сняться с места, выступить или отойти. «Отправился» не навязывает ни торжественного марша, ни бегства; направление выражено словами «в Антиохию».
- source_word: ἐφόδου
  choice: наступление
  rationale: Существительное обозначает нападение, натиск или враждебное продвижение. «Наступление» уместно в итоговом описании военной кампании.
- source_word: ἀναζυγῆς
  choice: отход
  rationale: Обозначает снятие с места и обратное движение войска. «Отход» сохраняет военный смысл, не представляя событие как паническое бегство.
- source_word: ἐχώρησεν
  choice: завершились
  rationale: В итоговой формуле глагол описывает, как развивались или обернулись события. По контексту конца эпизода «так завершились» звучит естественно, хотя несколько конкретизирует повествовательный итог.
theological_decisions:
- issue: Стих не содержит значимого доктринального спора; неопределённость преимущественно лексическая и историко-повествовательная.
  choice: Передать стих как итог успешного выступления Лисия и последующего прекращения царского наступления.
  alternative: Буквальнее передать βῆμα как «возвышение», ἐφόδου как «нападение», ἀναζυγῆς как «отступление», а ἐχώρησεν как «происходили».
  rationale: Официальный и военный контекст поддерживает выбранные значения, но примечания сохраняют реальные альтернативы и не превращают отход в разгром.
translation_notes:
  register: Современный литературный русский язык, сдержанный историко-повествовательный регистр. Синтаксис упрощён без утраты последовательности греческих действий; повтор местоимения «их» частично снят ради естественности. Все примечания отмечены в основном тексте.
