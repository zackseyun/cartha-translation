base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/003.yaml
  text: Menelaus also joined them and[a], with great insincerity, kept urging Antiochus on—not for the safety of the fatherland[b], but because he thought he would be established in power.
translation:
  language: ru
  text: Менелай тоже присоединился к ним и, с большим притворством, убеждал Антиоха — не ради благополучия отечества, а полагая, что сам будет поставлен у власти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνέμιξεν
  choice: присоединился
  rationale: Глагол обозначает присоединение к группе; это естественная русская передача в данном повествовательном контексте.
- source_word: παρεκάλει
  choice: продолжал убеждать
  rationale: Имперфект передаёт длительное или повторявшееся побуждение; «продолжал убеждать» сохраняет аспект и не уточняет сверх текста, к каким именно действиям он склонял Антиоха.
- source_word: μετὰ πολλῆς εἰρωνίας
  choice: с великим притворством
  rationale: Здесь εἰρωνία означает не современную словесную иронию, а притворство, сокрытие истинного мотива. Формулировка ясно передаёт нравственную оценку и сохраняет возвышенный регистр.
- source_word: σωτηρίᾳ
  choice: спасения
  rationale: В контексте речь идёт о сохранении и благополучии отечества, а не о специально богословском смысле; русское «спасение отечества» естественно допускает политико-национальное значение.
- source_word: πατρίδος
  choice: отечества
  rationale: πατρίς — родная, отеческая земля; «отечество» сохраняет патриотический и родовой оттенок и соответствует достоинству библейского повествования.
- source_word: ἐπὶ τῆς ἀρχῆς κατασταθήσεται
  choice: сам будет поставлен у власти
  rationale: Оборот выражает установление в положении власти. «Поставлен у власти» ближе к κατασταθήσεται и ἀρχή, чем общее «получит должность», при этом не подразумевает царского достоинства.
theological_decisions:
- issue: Нравственная характеристика мотива Менелая в εἰρωνία
  choice: с великим притворством
  alternative: с большой неискренностью; с великой скрытностью
  rationale: Контраст между заявляемой заботой об отечестве и личным стремлением к власти показывает притворный характер его действий. Передача не добавляет конкретной формы обмана и не понимает εἰρωνία в современном смысле словесной иронии.
- issue: Характер ожидаемой ἀρχή
  choice: будет поставлен у власти
  alternative: будет назначен на должность; будет поставлен во главе правления
  rationale: Греческая фраза допускает положение власти или правления, но не уточняет конкретную должность. Выбранная формулировка сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Отечество» и «с великим притворством» сохраняют достоинство исторического повествования; синтаксис остаётся ясным для обычного читателя.
