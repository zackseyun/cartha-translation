base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/004.yaml
  text: But the King of kings stirred up Antiochus’s anger against the wretch, and when Lysias pointed him out as being responsible for the evils and for everything, he ordered them to put him to death, taking him to Beroea, as is the custom in that place.
translation:
  language: ru
  text: Но Царь царей возбудил гнев Антиоха против этого негодяя[a]. Когда же Лисий указал, что тот виновен во всех бедствиях и во всём остальном, царь приказал отвести его в Верею[b] и там предать смерти по местному обычаю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злодея» либо «преступника». Греческое слово выражает резкое нравственное осуждение.'
    reason: lexical_alternative
  - marker: b
    text: Верея здесь названа местом казни, совершавшейся по местному обычаю.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ δὲ βασιλεὺς τῶν βασιλέων
  choice: Но Царь царей
  rationale: Титульное выражение в контексте относится к Богу; прописная буква передаёт это референциальное значение, не добавляя пояснения в сам текст.
- source_word: ἐξήγειρεν τὸν θυμὸν τοῦ Ἀντιόχου
  choice: возбудил гнев Антиоха
  rationale: Сохраняется каузативная сила глагола и прямое указание на гнев; формулировка естественна для литературного повествования.
- source_word: ἐπὶ τὸν ἀλιτήριον
  choice: против этого негодяя
  rationale: Сильное нравственно осуждающее наименование передано современным словом без сужения значения до формально-юридического «преступника».
- source_word: Λυσίου ὑποδείξαντος
  choice: Когда же Лисий указал
  rationale: Генитив абсолютный естественно передан придаточным времени; «указал» сохраняет смысл выявления виновного.
- source_word: τοῦτον αἴτιον τῶν κακῶν εἶναι καὶ πάντων
  choice: что тот виновен во всех бедствиях
  rationale: Сжатая и несколько неровная греческая конструкция передаёт всеохватность вины. Русская формулировка сохраняет эту широту и избегает неестественного «в бедствиях и во всём».
- source_word: προσέταξεν
  choice: царь приказал
  rationale: Явное повторение подлежащего в русском устраняет возможную двусмысленность после упоминания Лисия.
- source_word: προσαπολέσαι
  choice: предать смерти
  rationale: В контексте речь идёт о казни; выражение ясно передаёт результат и соответствует достоинству исторического повествования.
- source_word: ἀγαγόντας εἰς Βέροιαν
  choice: отвести его в Верею
  rationale: Причастие передано инфинитивом в составе приказа, что естественно отражает поручение исполнителям.
- source_word: ὡς ἔθος ἐστὶν ἐν τῷ τόπῳ
  choice: там ... по местному обычаю
  rationale: Передаётся связь казни с обычаем данного места без тяжеловесного буквального оборота.
theological_decisions:
- issue: Кого обозначает титул «Царь царей»
  choice: Бога, владычествующего над земными царями
  alternative: Гиперболический титул земного правителя
  rationale: В повествовательном и богословском контексте книги действие над Антиохом приписывается высшей божественной власти. Прописная буква отмечает референцию, но текст не расширяется дополнительным толкованием.
- issue: Божественное воздействие на гнев Антиоха
  choice: Сохранить прямую каузативную формулировку «возбудил гнев»
  alternative: Ослабить до «допустил, чтобы Антиох разгневался»
  rationale: Греческий ἐξήγειρεν прямо выражает действие субъекта; смягчение внесло бы отсутствующее в источнике богословское уточнение.
translation_notes:
  register: 'Современный литературный русский язык с достоинством историко-библейского повествования. Синтаксис слегка перестроен ради ясности: приказ объединяет доставление в Верею и казнь, а субъект «царь» повторён, чтобы его не спутать с Лисием. Все маркеры сносок присутствуют в основном тексте.'
