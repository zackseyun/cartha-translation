  text: And when day was already beginning to appear[a], this had happened because the Lord’s protection had quickly come to his aid.
translation:
  language: ru
  text: Когда уже брезжил день, всё это уже произошло благодаря защите Господа, поспешившей ему на помощь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Редкое слово ἐπαρήγορασις может означать помощь, поддержку или облегчение; оно также может подчёркивать своевременность или быстроту помощи.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποφαινούσης δὲ ἤδη τῆς ἡμέρας
  choice: Когда уже начинало светать
  rationale: Генитив абсолютный обозначает первые признаки наступающего дня; «начинало светать» естественно передаёт начинательный оттенок ὑποφαίνω.
- source_word: τοῦτο ἐγέγονει
  choice: всё это совершилось
  rationale: Форма ἐγέγονει указывает на завершённость описанных ранее действий к моменту рассвета. «Всё это» ясно отсылает к совокупности событий предыдущего контекста.
- source_word: διὰ
  choice: благодаря
  rationale: Предлог с винительным падежом выражает причину; в данном контексте положительной божественной помощи «благодаря» звучит естественно.
- source_word: ἐπαρήγορασιν αὐτῷ
  choice: пришедшей ему на помощь
  rationale: Редкое существительное обозначает помощь, поддержку или облегчение, оказанные адресату; русская глагольная конструкция естественно передаёт эту связь, не сводя значение к словесному утешению.
- source_word: τοῦ κυρίου σκέπην
  choice: защите Господа
  rationale: σκέπη означает укрытие, покров или защиту; в военном повествовании «защита» передаёт смысл без излишней конкретизации образа.
theological_decisions:
- issue: Передача κύριος в греческом повествовании Второй книги Маккавейской
  choice: Господь
  alternative: Владыка
  rationale: Здесь κύριος обозначает Бога как источник защиты и избавления; традиционное и общепонятное «Господь» сохраняет связь с употреблением этого слова в Септуагинте.
- issue: Причинная связь между успехом Иуды и действием Бога
  choice: благодаря защите Господа
  alternative: посредством защиты Господа
  rationale: Текст прямо связывает совершившееся с Божьей защитой. Перевод сохраняет это утверждение, не уточняя механизм вмешательства сверх сказанного в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Конструкция ясна обычному читателю; сохранены как военный оттенок «защиты», так и некоторая неоднозначность редкого слова ἐπαρήγορασις.
