  yaml_path: translation/deuterocanon/2_maccabees/013/010.yaml
  text: And when Judas learned these things, he ordered the multitude to call upon the Lord day and night, that, as at other times, so now also he might come to their aid,
translation:
  language: ru
  text: Узнав об этом, Иуда велел народу день и ночь взывать к Господу, чтобы Он, как и прежде, пришёл им на помощь и теперь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεταλαβὼν
  choice: узнав
  rationale: В данном контексте причастие обозначает получение сведений; «узнав» естественно передаёт реакцию Иуды на известия.
- source_word: παρήγγειλεν
  choice: велел
  rationale: Передаёт властный характер распоряжения, но звучит естественно в современном русском повествовании.
- source_word: τῷ πλήθει
  choice: народу
  rationale: Речь идёт о собравшихся людях, находящихся под руководством Иуды; «народу» сохраняет собирательный смысл без оттенка случайной толпы.
- source_word: διʼ ἡμέρας καὶ νυκτός
  choice: день и ночь
  rationale: Естественный русский оборот, обозначающий непрестанное действие.
- source_word: ἐπικαλεῖσθαι τὸν κύριον
  choice: взывать к Господу
  rationale: «Взывать» передаёт настойчивую молитвенную просьбу и соответствует возвышенному библейскому регистру.
- source_word: εἴ ποτε καὶ ἄλλοτε, καὶ νῦν
  choice: как и прежде… и теперь
  rationale: Оборот указывает на прежнюю Божью помощь как основание просьбы о помощи сейчас; сравнительная конструкция естественно выражает этот смысл по-русски.
- source_word: ἐπιβοηθεῖν
  choice: пришёл им на помощь
  rationale: Передаёт не просто содействие, а своевременное вмешательство ради оказавшихся в беде.
theological_decisions:
- issue: Передача κύριος в обращённой к Богу молитве
  choice: Господь
  alternative: Владыка
  rationale: «Господь» сохраняет устойчивое библейское обозначение Бога и не привносит светского оттенка отношений господина и слуги.
- issue: Условная форма εἴ ποτε καὶ ἄλλοτε
  choice: как и прежде
  alternative: если когда-либо прежде
  rationale: Здесь условный оборот риторически отсылает к прежней помощи Бога, а не выражает сомнение в ней; при этом перевод не уточняет, когда именно и каким образом эта помощь была оказана.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан плавным и общедоступным; молитвенная настойчивость сохранена в глаголе «взывать».
