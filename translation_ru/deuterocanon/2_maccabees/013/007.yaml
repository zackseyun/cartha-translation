  text: By such a fate the lawless Menelaus happened to die[a], not even obtaining burial in the earth.
translation:
  language: ru
  text: 'Такой была участь беззаконника Менелая: он умер, не удостоившись даже погребения.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не получив даже земли»; то есть Менелай не был погребён.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτῳ μόρῳ
  choice: такой смертью
  rationale: μόρος может означать рок, гибель или смерть; выражение указывает на только что описанный способ казни. «Такой смертью» естественно по-русски связывает стих с контекстом и сохраняет торжественно-мрачный тон.
- source_word: τὸν παράνομον
  choice: беззаконник
  rationale: παράνομος обозначает человека, преступающего закон. Субстантивированное «беззаконник» передаёт одновременно правовую и нравственную оценку, не усиливая её до более общего «злодей».
- source_word: συνέβη θανεῖν
  choice: умер
  rationale: Оборот συμβαίνω с инфинитивом буквально сообщает, что кому-либо выпало или случилось умереть. В данном контексте русское «умер» передаёт итог естественно, тогда как «случилось умереть» могло бы ошибочно звучать как случайность.
- source_word: μηδὲ τῆς γῆς τυγχάνοντα
  choice: не удостоившись даже погребения в земле
  rationale: Буквально выражение значит «не получив даже земли»; по контексту речь идёт об отказе в погребении. «Не удостоившись» сохраняет оттенок лишения последней чести, а добавление «погребения» ясно раскрывает подразумеваемый смысл.
- source_word: Μενέλαον
  choice: Менелай
  rationale: Традиционная русская форма греческого имени Μενέλαος.
theological_decisions:
- issue: Нравственно-правовая характеристика Менелая словом παράνομος
  choice: беззаконник Менелай
  alternative: нечестивец Менелай
  rationale: «Беззаконник» непосредственно сохраняет связь παράνομος с нарушением закона и не подменяет её более широкой религиозной характеристикой «нечестивец».
- issue: Смысл μηδὲ τῆς γῆς τυγχάνοντα
  choice: не удостоившись даже погребения в земле
  alternative: не получив даже земли
  rationale: Контекст говорит о посмертном лишении погребения. Основной текст делает этот смысл явным, а сноска сохраняет буквальную форму и тем самым показывает интерпретационную экспликацию.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. Инверсия «беззаконник Менелай» сохраняет оценочный акцент греческого текста; буквальная неоднозначность последней фразы отмечена в сноске.
