  yaml_path: translation/deuterocanon/2_maccabees/013/013.yaml
  text: But he himself[a], after meeting with the elders, decided, before the king’s army could invade Judea and gain control of the city, to go out and decide the matter with the help of God.
translation:
  language: ru
  text: Он же, посоветовавшись наедине со старейшинами, решил, прежде чем царское войско вторгнется в Иудею и овладеет городом, чтобы они вышли и с Божьей помощью решили это дело.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разобрали обстоятельства» или «разрешили дела». Греческое выражение имеет широкий смысл и может обозначать разрешение возникшего кризиса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθʼ ἑαυτὸν
  choice: наедине
  rationale: Оборот указывает не на одиночное действие, поскольку далее упомянуты старейшины, а на закрытое совещание вне более широкого круга.
- source_word: σὺν τοῖς πρεσβυτέροις γενόμενος
  choice: посоветовавшись со старейшинами
  rationale: Причастный оборот описывает встречу со старейшинами ради обсуждения; русский глагол естественно передаёт совещательный характер контекста.
- source_word: ἐβουλεύσατο
  choice: решил
  rationale: Глагол обозначает обдумывание, приведшее к решению; совещание уже выражено предшествующим оборотом.
- source_word: πρὶν εἰσβαλεῖν τὸ στράτευμα τοῦ βασιλέως ἐπὶ τὴν Ἰουδαίαν
  choice: прежде чем царское войско вторгнется в Иудею
  rationale: В военном контексте εἰσβάλλω означает вражеское вторжение; «царское войско» — естественная передача генитивной конструкции.
- source_word: γενέσθαι τῆς πόλεως ἐγκρατεῖς
  choice: овладеет городом
  rationale: Оборот означает установление власти или контроля над городом; «овладеть городом» уместно в военном повествовании.
- source_word: ἐξελόντας
  choice: выступить им навстречу
  rationale: Глагол означает выйти; в данном военном контексте подразумевается выход против приближающегося войска. Русский инфинитив оставляет точный состав выступающих неуточнённым, тогда как греческое причастие имеет форму множественного числа.
- source_word: κρῖναι τὰ πράγματα
  choice: разрешить сложившееся положение
  rationale: Широкий оборот относится к разрешению кризиса и не обязательно означает формальное судебное решение.
- source_word: τῇ τοῦ θεοῦ βοηθείᾳ
  choice: с Божьей помощью
  rationale: Творительный по смыслу выражает средство и зависимость действий от помощи Бога.
theological_decisions:
- issue: Подразумеваемый субъект при ἐξελόντας κρῖναι
  choice: Формулировка с инфинитивом «выступить» не называет состав группы, но допускает Иуду и его соратников, как подсказывает множественное число ἐξελόντας.
  alternative: 'Явно перевести: «чтобы они выступили»; либо отнести действие только к Иуде.'
  rationale: Множественное число греческого причастия указывает на коллективное действие, однако сжатый синтаксис не определяет точный состав группы. Русская конструкция сохраняет эту неопределённость и не превращает старейшин непременно в участников похода.
- issue: Характер Божьей помощи
  choice: Сохранено прямое «с Божьей помощью» без уточнения способа или гарантированного исхода.
  alternative: Передать как божественное одобрение или обещание победы.
  rationale: Греческий текст говорит о помощи Бога как средстве, но не раскрывает здесь её характер и не формулирует отдельного обещания победы.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Военная лексика ясна и естественна; неоднозначность сжатой греческой конструкции и широкого выражения κρῖναι τὰ πράγματα сохранена.
