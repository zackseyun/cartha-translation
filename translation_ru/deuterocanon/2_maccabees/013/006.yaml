  text: Here everyone pushes on to destruction the man guilty of temple robbery[a], or one who has committed some outstanding excess of other evils.
translation:
  language: ru
  text: Здесь все толкают на погибель виновного в ограблении храма[a] или того, кто совершил нечто особенно тяжкое среди иных злодеяний.
