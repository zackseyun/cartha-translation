    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνταῦθα
  choice: Здесь
  rationale: Сохраняет непосредственное указание на место, описанное в предыдущем контексте, и естественно звучит по-русски.
- source_word: ἱεροσυλίας
  choice: ограблении храма
  rationale: Передаёт конкретное значение нарушения святыни посредством разграбления или расхищения храмового имущества; более широкая альтернатива отмечена в сноске.
- source_word: ἔνοχον
  choice: виновного
  rationale: Соответствует обычному юридическому значению слова при родительном падеже, обозначающем проступок.
- source_word: τινων ἄλλων κακῶν ὑπεροχὴν πεποιημένον
  choice: того, кто превзошёл меру в каких-либо других злодеяниях
  rationale: Передаёт сравнительно-интенсивный смысл ὑπεροχή и сохраняет некоторую необычность греческого выражения, не сводя его без необходимости к одному конкретному преступлению.
- source_word: ἅπαντες
  choice: все
  rationale: Кратко и полно передаёт всеобщность участия.
- source_word: προωθοῦσιν εἰς ὄλεθρον
  choice: сталкивают на погибель
  rationale: Сохраняет физический образ направленного толчка, выраженный глаголом с приставкой προ-, и смертельный исход, обозначенный ὄλεθρος.
theological_decisions:
- issue: Передача ἱεροσυλία
  choice: ограбление храма
  alternative: святотатство
  rationale: Основной текст сохраняет конкретную связь с посягательством на храм и его имущество, тогда как «святотатство» шире и может обозначать иные виды осквернения святыни.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Формулировка «превзошёл меру» намеренно сохраняет напряжённую образность и некоторую неоднозначность греческого ὑπεροχὴν πεποιημένον.
