  - severity: low
    issue: «Сталкивают на погибель»
    rationale: Глагол «сталкивать» чаще предполагает столкновение вниз или с некоторой поверхности. «Толкают на погибель» естественнее и сохраняет направленный физический образ греческого προωθοῦσιν.
