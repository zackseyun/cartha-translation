revisions:
- from: Царь же, отягчённый своими замыслами, выступил в поход, намереваясь обрушить на иудеев худшие из бедствий, случившихся при его отце.[a]
  to: Царь же, отягчённый думами, двигался вперёд, намереваясь обрушить на иудеев худшее из того, что случилось при его отце.[a]
  rationale: Редакция устраняет добавленное значение «замыслов» и не называет прошлые события «бедствиями», сохраняя при этом враждебную направленность намерения царя. Она также точнее передаёт продолженное военное продвижение, выраженное имперфектом. Сноска оставлена на том же месте и согласована с пересмотренным текстом.
