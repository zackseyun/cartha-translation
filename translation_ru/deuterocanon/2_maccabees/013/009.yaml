    rationale: «Замыслы» придаёт слову узкое значение намеренных планов, тогда как греческое слово допускает более широкий смысл мыслей, помыслов или настроя; «своими» не выражено в оригинале.
  - severity: medium
    issue: τῶν ... γεγονότων передано как «из бедствий».
    rationale: Γεγονότων означает произошедшее или события; контекст делает их враждебными для иудеев, но сам текст не называет их «бедствиями».
