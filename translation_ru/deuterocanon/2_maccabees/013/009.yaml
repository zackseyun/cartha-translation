lexical_decisions:
- source_word: φρονήμασιν
  choice: своими замыслами
  rationale: Множественное число обозначает внутренние помыслы, намерения или настрой царя; «замыслами» естественно в данном враждебном контексте и не сводит выражение к эмоции.
- source_word: βεβαρημένος
  choice: отягчённый
  rationale: Сохраняет метафору тяжести и результативное состояние, выраженное перфектным причастием.
- source_word: ἦρχετο
  choice: выступил в поход
  rationale: В контексте военного движения глагол означает, что царь двинулся вперёд; формулировка ясна по-русски и исключает неуместное значение «начал».
- source_word: τὰ χείριστα
  choice: худшие из бедствий
  rationale: Передаёт субстантивированную превосходную степень во множественном числе, не уточняя конкретный характер зол сверх сказанного в тексте.
- source_word: τῶν ἐπὶ τοῦ πατρὸς αὐτοῦ γεγονότων
  choice: случившихся при его отце
  rationale: ἐπὶ с родительным указывает на время или правление отца, а γεγονότων — на произошедшие события.
- source_word: ἐνδεξόμενος
  choice: намереваясь обрушить
  rationale: В сочетании с дательным τοῖς Ἰουδαίοις и враждебным контекстом выражает намерение навлечь бедствия на иудеев; альтернативный оттенок ожидания отмечен в сноске.
