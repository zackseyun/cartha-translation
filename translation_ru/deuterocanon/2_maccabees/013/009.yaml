review_pass:
  verdict: revise
  source_fidelity: «Своими замыслами» чрезмерно сужает φρονήμασιν до сознательных планов и добавляет притяжательное «своими». Существительное обозначает внутренний настрой, помыслы или мысли. «Худшие из бедствий» также истолковывает γεγονότα («происшедшее, события») как именно бедствия. Более нейтральное «худшее из того, что случилось» сохраняет исходную широту. Несовершенный вид ἦρχετο лучше передан формой «двигался вперёд», чем совершенным «выступил в поход», хотя военный контекст остаётся понятен.
  naturalness: 'Предлагаемая редакция остаётся современной литературной и естественной: «отягчённый думами» передаёт образ тяжести без психологизирующего добавления, а «двигался вперёд» соответствует повествовательному контексту.'
  terminology: «Иудеи» соответствует Ἰουδαῖοι. Богословски маркированной терминологии нет. Сноска должна быть согласована с нейтральной передачей «худшее из того, что случилось» и сохранять лексическую неоднозначность ἐνδεξόμενος.
