base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/012.yaml
  text: And when all had done the same together and had implored the merciful Lord with weeping and fasting and prostration for three days without ceasing[a], Judas encouraged them and ordered them to assemble.
translation:
  language: ru
  text: Когда же все вместе сделали то же самое и три дня непрестанно молили милосердного Господа с плачем, постом и земными поклонами, Иуда ободрил их и велел им явиться[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «велел им прийти» или «велел им собраться». Греческий глагол может означать «прийти», «явиться» или «быть налицо»; в данном военном контексте возможен также смысл «велел им быть готовыми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντων ... τὸ αὐτὸ ποιησάντων ὁμοῦ
  choice: когда же все вместе сделали то же самое
  rationale: Родительный самостоятельный оборот задаёт предшествующее обстоятельство; формулировка сохраняет как отсылку к тому же действию, так и совместность, выраженную ὁμοῦ.
- source_word: καταξιωσάντων τὸν ἐλεήμονα κύριον
  choice: молили милосердного Господа
  rationale: В контексте плача, поста и простирания καταξιόω передаёт настойчивое молитвенное обращение. «Молили» естественно по-русски и не затемняет смысл буквальным «сочли достойным».
- source_word: τὸν ἐλεήμονα κύριον
  choice: милосердного Господа
  rationale: ἐλεήμων означает милосердный, сострадательный; κύριος в обращении к Богу передан традиционным и современно понятным словом «Господь».
- source_word: μετὰ κλαυθμοῦ καὶ νηστειῶν καὶ προπτώσεως
  choice: с плачем, постом и земными поклонами
  rationale: Оборот обозначает действия, сопровождавшие моление. Единственное «постом» естественнее в русском при трёхдневной продолжительности, а «земными поклонами» ясно передаёт физическое простирание ниц без тяжеловесной абстрактной лексики.
- source_word: ἐπὶ ἡμέρας τρεῖς ἀδιαλείπτως
  choice: три дня непрестанно
  rationale: ἐπὶ с винительным выражает продолжительность, а ἀδιαλείπτως — непрерывную настойчивость действия.
- source_word: παρακαλέσας αὐτοὺς
  choice: Иуда ободрил их
  rationale: παρακαλέω допускает значения ободрять, увещевать и призывать; после совместной молитвы и перед приказом «ободрил» сохраняет поддерживающий и побуждающий оттенки.
- source_word: ἐκέλευσεν παραγίνεσθαι
  choice: велел им собраться
  rationale: παραγίνομαι буквально обозначает приход или присутствие. В данном контексте «собраться» естественно передаёт приказ явиться вместе, не добавляя прямо отсутствующего в греческом требования «быть готовыми».
theological_decisions:
- issue: Передача κύριον в обращении к Богу
  choice: Господа
  alternative: Владыку
  rationale: «Господь» — прямое, общепринятое и конфессионально нейтральное соответствие κύριος в молитвенном контексте.
- issue: Характер обращения, выраженного καταξιωσάντων
  choice: молили
  alternative: умоляли; сочли достойным
  rationale: Контекст трёхдневного плача, поста и простирания указывает на усердное прошение. Перевод не уточняет содержание молитвы и не вводит дополнительного богословского вывода.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сохранён как одно связное предложение, но тяжёлые отвлечённые существительные заменены естественными русскими выражениями. Место с παραγίνεσθαι оставлено открытым посредством сноски.
