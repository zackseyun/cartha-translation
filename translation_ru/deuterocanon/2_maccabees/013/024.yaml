  text: And he received Maccabaeus favorably[a], and left Hegemonides as commander from Ptolemais as far as the Gerrenians,
translation:
  language: ru
  text: Он благосклонно принял Маккавея, а Гегемонида оставил военачальником на территории от Птолемаиды до Геннеров[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое название Γεννήρων не поддаётся уверенной географической идентификации; возможно также понимание как названия жителей. В переводе сохранена его греческая форма.
    reason: textual_variant
lexical_decisions:
- source_word: ἐπεδέξατο
  choice: благосклонно принял
  rationale: Средняя форма допускает оттенок благоприятного, радушного приёма, а не просто нейтрального согласия принять.
- source_word: κατέλειπεν
  choice: оставил
  rationale: Передаёт основное значение «оставил (на месте)»; должностная роль выражена следующим словом, без замены глагола на более истолковывающее «назначил».
- source_word: στρατηγόν
  choice: военачальником
  rationale: Современное и достаточно широкое обозначение военного начальника, не приписывающее ему более точного ранга или гражданской должности.
- source_word: ἀπὸ Πτολεμαΐδος ἕως τῶν Γεννήρων
  choice: на территории от Птолемаиды до Геннеров
  rationale: Оборот обозначает пределы подведомственной территории. Неясное название Γεννήρων передано консервативной транслитерацией без принудительной географической идентификации.
- source_word: Ἡγεμονίδην
  choice: Гегемонида
  rationale: Греческое личное имя передано принятой русской транслитерацией и поставлено в винительный падеж.
- source_word: Μακκαβαῖον
  choice: Маккавея
  rationale: Личное именование передано традиционной русской библейской формой и поставлено в винительный падеж.
