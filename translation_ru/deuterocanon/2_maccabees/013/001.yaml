lexical_decisions:
- source_word: Ἔτῳ δὲ ἐνάτῳ καὶ τεσσερακοστῷ καὶ ἑκατοστῷ ἔτει
  choice: В сто сорок девятом году
  rationale: Дательный времени обозначает год, в котором произошло событие. Русская формулировка естественно передаёт датировку, не воспроизводя избыточно повторённое в греческом тексте ἔτει.
- source_word: προσέπεσεν τοῖς περὶ τὸν Ἰούδαν
  choice: Иуде и его сторонникам стало известно
  rationale: Оборот указывает на событие или сообщение, достигшее группы Иуды. Такая формулировка естественна по-русски, а неоднозначность между известием и самим происшествием сохранена в сноске.
- source_word: Ἀντίοχον τὸν Εὐπάτορα
  choice: Антиох Евпатор
  rationale: Имя и эпитет переданы в принятой русской форме как единое царское именование.
- source_word: παραγεγόνα
  choice: прибыл
  rationale: Форма выражает состоявшееся прибытие, результат которого важен в описываемый момент.
- source_word: σὺν πλήθεσιν
  choice: с многочисленными войсками
  rationale: Буквально речь идёт о «множествах»; в военном контексте это многочисленные отряды или силы. Выбранное выражение ясно передаёт смысл без сведения их к одному конкретному войску.
- source_word: ἐπὶ τὴν Ἰουδαίαν
  choice: чтобы выступить против Иудеи
  rationale: В контексте военного движения ἐπί с винительным указывает на враждебное выступление против страны.
