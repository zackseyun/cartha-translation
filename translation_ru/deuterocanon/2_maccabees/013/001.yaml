  text: In the one hundred forty-ninth year[a], it happened to those around Judas that Antiochus Eupator had arrived with forces against Judea,
translation:
  language: ru
  text: В сто сорок девятом году Иуде и его сторонникам стало известно[a], что Антиох Евпатор прибыл с войсками в поход против Иудеи.
