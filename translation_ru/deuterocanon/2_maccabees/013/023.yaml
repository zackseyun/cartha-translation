base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/013/023.yaml
  text: He attacked those around Judas[a], but was defeated. Having become desperate, he took action against Philip in Antioch, the one left in charge of affairs; he was thrown into confusion, appealed to the Jews, submitted, and swore to all the just terms. He was reconciled and offered sacrifice, honored the sanctuary and the place[b], and showed kindness.
translation:
  language: ru
  text: Он напал на людей Иуды, но потерпел поражение. В отчаянии он предпринял некие действия в отношении Филиппа[a], оставленного в Антиохии управлять государственными делами. Оказавшись в смятении, он обратился к иудеям, уступил им и поклялся принять все справедливые условия[b]. Он примирился с ними, принёс жертву, почтил святилище и место и проявил милость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая фраза о действиях в отношении Филиппа сжата и неясна; точный характер этих действий установить трудно.
    reason: textual_variant
  - marker: b
    text: 'Или: «поклялся соблюдать всё справедливое». Возможно, речь идёт либо об условиях соглашения, либо вообще о справедливых требованиях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέβαλεν τοῖς περὶ τὸν Ἰούδαν
  choice: напал на людей Иуды
  rationale: Военный контекст требует значения «напал»; греческий оборот обозначает окружение или сторонников Иуды, естественно передаваемых как «люди Иуды».
- source_word: ἥττων ἐγένετο
  choice: потерпел поражение
  rationale: Идиома буквально говорит, что он оказался слабее; в военном повествовании это означает поражение.
- source_word: μετέλαβεν ἀπονοηθεὶς τὸν Φίλιππον
  choice: В отчаянии он предпринял действия против Филиппа
  rationale: Синтаксис с μετέλαβεν сжат и неясен. Формулировка передаёт решительный поворот к Филиппу, но не уточняет характер действий сверх надёжно устанавливаемого смысла; неопределённость отмечена в сноске.
- source_word: τὸν ἀπολελειμμένον ἐπὶ τῶν πραγμάτων
  choice: оставленного ... управлять государственными делами
  rationale: Оборот указывает на порученную Филиппу административную ответственность, а не просто на его физическое пребывание в Антиохии.
- source_word: συνεχύθη
  choice: оказавшись в смятении
  rationale: Глагол описывает состояние растерянности и тревожного замешательства; русский оборот естественно связывает его с последующими дипломатическими действиями.
- source_word: τοὺς Ἰουδαίους παρεκάλεσεν
  choice: обратился к иудеям
  rationale: παρακαλέω здесь означает обращение с просьбой или призывом. Нейтральное «обратился» не переопределяет точную силу просьбы.
- source_word: ὑπετάγη
  choice: уступил им
  rationale: В контексте мирного соглашения глагол передаёт уступку или подчинение; добавленное «им» естественно указывает на иудеев как ближайших участников переговоров.
- source_word: ὤμοσεν ἐπὶ πᾶσι τοῖς δικαίοις
  choice: поклялся принять все справедливые условия
  rationale: Контекст указывает на справедливые условия урегулирования. При этом возможное более общее значение фразы сохранено в сноске.
- source_word: συνελύθη
  choice: примирился с ними
  rationale: После уступки и клятвы глагол обозначает прекращение вражды и достижение примирения.
- source_word: θυσίαν προσήγαγεν
  choice: принёс жертву
  rationale: Это обычное культовое выражение, естественно передаваемое традиционным русским сочетанием.
- source_word: ἐτίμησεν τὸν νεὼ καὶ τὸν τόπον
  choice: почтил святилище и святое место
  rationale: νεώς обозначает храмовое святилище, тогда как τόπος здесь относится к самому священному месту. Различие двух объектов сохранено.
- source_word: ἐφιλανθρώπησεν
  choice: проявил милость
  rationale: В повествовательном контексте глагол означает гуманное, благосклонное обращение; «проявил милость» передаёт это без добавления не названного объекта.
theological_decisions:
- issue: Культовые обозначения θυσία, νεώς и τόπος
  choice: «принёс жертву», «святилище и святое место»
  alternative: «совершил жертвоприношение», «храм и место»
  rationale: Выбранные выражения сохраняют конкретный культово-исторический смысл и различие между храмовым святилищем и священным местом, не вводя позднейшей конфессиональной терминологии.
- issue: Неясная последовательность μετέλαβεν ... τὸν Φίλιππον ... συνεχύθη
  choice: Осторожно передать как действия против Филиппа и последующее смятение, снабдив сноской
  alternative: Уточнить действие как захват Филиппа, обращение к нему или союз с ним
  rationale: Греческая конструкция сжата и допускает несколько объяснений. Перевод не должен превращать одну из гипотез в однозначное содержание текста.
- issue: Смысл ἐπὶ πᾶσι τοῖς δικαίοις
  choice: «все справедливые условия» с указанием более общего варианта в сноске
  alternative: «всё справедливое»
  rationale: Дипломатический контекст поддерживает значение условий соглашения, но греческая фраза может иметь более общий смысл, поэтому неоднозначность отмечена явно.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис разбит на короткие ясные предложения, поскольку греческая последовательность чрезвычайно сжата. Архаизмы и конфессионально окрашенные уточнения не использованы.
