base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/021.yaml
  text: When Apollonius son of Menestheus had been sent to Egypt for the accession festivities of King Philometor[a], Antiochus, learning that he had become estranged from his own affairs, took thought for his own security. Therefore, after arriving at Joppa, he went on to Jerusalem.
translation:
  language: ru
  text: Когда Аполлоний, сын Менесфея, был послан в Египет на торжества по случаю восшествия на престол царя Филометора, Антиох, узнав, что он оказался отстранён от собственных дел,[a] позаботился о собственной безопасности. Поэтому, прибыв в Иоппию, он отправился дальше в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза сжата и трудна для однозначного истолкования. Буквально: «что он был чужд делам, касавшимся его самого». Возможен более широкий смысл: Антиох понял, что его политическое положение неблагоприятно для него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποσταλέντος
  choice: был послан
  rationale: Аористное страдательное причастие в родительном абсолютном обороте передаёт предшествующее обстоятельство; личная форма естественна в русском сложноподчинённом предложении.
- source_word: διὰ τὰ προτοκλήρια
  choice: на торжества по случаю восшествия на престол
  rationale: Редкое существительное обозначает празднества, связанные со вступлением правителя на престол; перевод раскрывает смысл без неясной буквальности.
- source_word: τοῦ φιλομήτορος βασιλέως
  choice: царя Филометора
  rationale: Φιλομήτωρ здесь является известным царским эпитетом, употреблённым как имя, поэтому передаётся транслитерацией.
- source_word: μεταλαβὼν
  choice: узнав
  rationale: В данном контексте причастие выражает получение сведений или осознание положения.
- source_word: ἀλλότριον αὐτὸν τῶν αὐτοῦ γεγονότων πραγμάτων
  choice: что тот стал чужд его интересам
  rationale: Сжатая и неоднозначная греческая конструкция сохраняет оттенок отчуждения или политической враждебности; местоимение «тот» естественно указывает на ранее названного царя Филометора, но неоднозначность отмечена в сноске.
- source_word: τῆς καθʼ αὑτὸν ἀσφαλίας ἐφρόντιζεν
  choice: позаботился о собственной безопасности
  rationale: Передаёт деятельную заботу ἐφρόντιζεν и политический оттенок ἀσφάλεια естественным современным русским языком.
- source_word: παραγενόμενος
  choice: прибыв
  rationale: Аористное причастие обозначает прибытие в Иоппию до последующего движения в Иерусалим.
- source_word: κατήντησεν
  choice: отправился дальше
  rationale: Передаёт продолжение пути и избегает неуклюжего повторения глагола «прибыть».
theological_decisions:
- issue: Исторический эпитет Φιλομήτωρ
  choice: передан как имя-титул «Филометор»
  alternative: буквально «любящий мать»
  rationale: Это закрепившийся эпитет египетского царя; буквальный перевод затемнил бы историческую отсылку.
- issue: Референт местоимений в ἀλλότριον αὐτὸν τῶν αὐτοῦ γεγονότων πραγμάτων
  choice: «тот» относится к Филометору, а «его интересам» — к Антиоху
  alternative: Антиох понял, что сам оказался отчуждён от собственных дел или утратил положение в них
  rationale: Ближайший исторический смысл допускает политическое отчуждение Филометора от интересов Антиоха, однако греческая фраза грамматически сжата и допускает иное соотнесение местоимений; альтернатива сохранена в сноске без догматического разрешения.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис упрощён лишь настолько, чтобы стих был понятен обычному читателю; политическая и местоименная неоднозначность оригинала вынесена в сноску.
