base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/027.yaml
  text: But Menelaus held on to the office[a], yet he made no provision at all for the money he had promised to the king.
translation:
  language: ru
  text: Менелай же удерживал за собой должность, но не предпринимал никаких мер в отношении денег, обещанных царю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ничего не приводил в порядок» в отношении обещанных денег. Возможный более конкретный смысл: «не предпринимал ничего для их выплаты».'
    reason: Греческое οὐδὲν εὐτάκτει обозначает отсутствие устроения или надлежащих действий относительно обещанных сумм; невыплата подразумевается контекстом, но не выражена глаголом однозначно.
lexical_decisions:
- source_word: ἀρχῆς
  choice: должность
  rationale: В контексте речь идёт о занимаемом Менелаем официальном посте, а не об абстрактной власти; слово «должность» естественно передаёт этот смысл.
- source_word: ἐκράτει
  choice: удерживал за собой
  rationale: Имперфект указывает на продолжающееся обладание должностью; выражение также сохраняет оттенок того, что Менелай не выпускал её из рук.
- source_word: ἐπηγγελμένων
  choice: обещанных
  rationale: Причастие относится к ранее обещанным царю денежным суммам; краткая форма естественна по-русски и сохраняет временную соотнесённость из контекста.
- source_word: χρημάτων
  choice: денег
  rationale: Здесь слово обозначает конкретные денежные суммы, подлежавшие передаче царю.
- source_word: οὐδὲν εὐτάκτει
  choice: ничего не выплачивал
  rationale: В сочетании с обещанными царю деньгами εὐτακτέω имеет контекстуальный смысл исполнения денежного обязательства. Перевод ясно передаёт подразумеваемое действие, а более буквальная широта глагола отмечена в сноске.
