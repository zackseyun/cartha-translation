review_pass:
  verdict: revise
  source_fidelity: Перевод правильно передаёт выводную связь οὖν, быстроту ταχέως и смысл ἄδικον ζημίαν ὑπέσχον как понесённого несправедливого наказания. Однако «выступил в защиту» вносит в основной текст направленность действия («в защиту»), которой греческое προηγορήσαντες περὶ само по себе не выражает. Контекст может предполагать ходатайство в их интересах, но буквальный смысл причастия следует сохранить без этого уточнения.
  naturalness: «Итак, вскоре несправедливое наказание понесли...» — естественная литературная русская конструкция. «Прежде говорили о...» также понятно и сохраняет нейтральность исходного выражения.
  terminology: «Священные сосуды» точно передаёт τῶν ἱερῶν σκευῶν. Для δήμων в основном тексте предпочтительно «общины», поскольку греческое слово стоит во множественном числе; сноска поясняет возможные социально-политические оттенки. «Наказание» допустимо для ζημία в контексте, при сохранении альтернатив в сноске.
