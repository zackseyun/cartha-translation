  text: Therefore those who had spoken beforehand concerning the city and the people and the sacred vessels quickly suffered the unjust penalty[a][b][c].
translation:
  language: ru
  text: Итак, вскоре несправедливое наказание понесли те, кто прежде говорил о городе, общинах и священных сосудах.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кто прежде выступал по делу города, общин и священных сосудов». Греческое причастие буквально обозначает тех, кто ранее говорил или выступал; в контексте оно может подразумевать ходатайство или заступничество, но не выражает этого прямо.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово, переведённое как «общины», стоит во множественном числе и может обозначать народные общины, городские округа или группы населения; точный оттенок здесь не вполне ясен.
    reason: lexical_alternative
  - marker: c
    text: Слово, переведённое как «наказание», может также означать «ущерб» или «утрату».
    reason: lexical_alternative
lexical_decisions:
- source_word: ταχέως οὖν
  choice: Итак, вскоре
  rationale: οὖν связывает итог с предшествующим повествованием, а ταχέως указывает на скорое наступление последствия. Такой порядок естественен для современного русского языка.
- source_word: τὴν ἄδικον ζημίαν ὑπέσχον
  choice: несправедливое наказание понесли
  rationale: ζημία может означать ущерб, утрату или наказание; в данном судебном контексте сочетание с ὑπέσχον передаёт незаслуженно понесённую кару. «Понесли наказание» — естественная русская юридическая формула.
- source_word: οἱ ... προηγορήσαντες
  choice: те, кто выступил в защиту
  rationale: Причастие буквально связано с предшествующим выступлением или заявлением; конструкция περὶ и контекст посольства позволяют понимать речь как выступление в защиту перечисленного. Перевод передаёт контекстуальную функцию, а более буквальное значение отмечено в сноске.
- source_word: περὶ πόλεως καὶ δήμων καὶ τῶν ἱερῶν σκευῶν
  choice: города, народа и священных сосудов
  rationale: πόλις передано как «город», ἱερὰ σκεύη — как «священные сосуды» без добавления отсутствующего в тексте слова «храмовые». Множественное δήμων допускает несколько общественно-политических оттенков; в данном контексте естественное собирательное «народ» вынесено в основной текст, а неоднозначность сохранена в сноске.
