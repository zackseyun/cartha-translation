    issue: «В защиту» добавляет невыраженный в греческом тексте смысл.
    rationale: προηγορήσαντες с περὶ означает, в наиболее нейтральном виде, ранее говоривших/выступавших о перечисленных предметах. Контекстуальное понимание как защиты возможно, но не должно вытеснять лексическую неоднозначность в основном тексте.
  - severity: low
