  yaml_path: translation/deuterocanon/2_maccabees/004/013.yaml
  text: And there was such a height of Hellenism and an increase of foreign ways because of the surpassing shamelessness of Jason[a], who was ungodly and not the high priest,
translation:
  language: ru
  text: Так наступил расцвет эллинизма и усилилось проникновение чужеземных обычаев[a] — из-за безмерного бесстыдства Иасона, нечестивца и не первосвященника,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и наступали чужеземные порядки». Редкое греческое слово указывает на распространение чужих, неиудейских обычаев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκμή
  choice: расцвет
  rationale: Слово обозначает высшую степень развития; «расцвет» естественно передаёт образ кульминации эллинизма.
- source_word: Ἑλληνισμός
  choice: эллинизм
  rationale: Исторический термин сохраняет указание на принятие греческой культуры и образа жизни, а не только на греческое происхождение.
- source_word: πρόσβασις
  choice: проникновение
  rationale: В данном контексте слово передаёт наступательное распространение и укоренение чуждых порядков; «проникновение» сохраняет этот оттенок.
- source_word: ἀλλοφυλισμός
  choice: чужеземные обычаи
  rationale: Редкое слово указывает на принятие обычаев чужого, неиудейского народа; конкретная русская формулировка понятнее буквального неологизма.
- source_word: διὰ
  choice: из-за
  rationale: Предлог с винительным падежом выражает причину, причём контекст придаёт ей отрицательную оценку.
- source_word: ἀσεβοῦς
  choice: нечестивца
  rationale: Передаёт религиозно-нравственное осуждение Иасона и естественно сочетается с последующим полемическим противопоставлением.
- source_word: οὐκ ἀρχιερέως
  choice: а не первосвященника
  rationale: Формулировка прямо сохраняет полемическое отрицание законности первосвященнического статуса Иасона, не добавляя слова «истинного».
- source_word: ὑπερβάλλουσαν
  choice: безмерного
  rationale: Передаёт усилительное значение причастия и подчёркивает крайнюю степень бесстыдства.
- source_word: ἀναιδείαν
  choice: бесстыдства
  rationale: Точно выражает дерзкое пренебрежение нравственными и установленными границами.
theological_decisions:
- issue: Смысл οὐκ ἀρχιερέως применительно к Иасону
  choice: Иасон назван «нечестивцем, а не первосвященником», что выражает авторское отрицание законности его статуса.
  alternative: «Иасон, не бывший первосвященником»; «Иасон, не истинный первосвященник»
  rationale: Греческая фраза носит не нейтральный хронологический, а резкий полемический характер. Противопоставление сохраняет эту силу без пояснительной богословской добавки «истинный».
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Эллинизм» сохранён как понятный исторический термин; редкое ἀλλοφυλισμός раскрыто естественным выражением. Конечная запятая сохранена, поскольку греческое предложение продолжается в следующем стихе.
