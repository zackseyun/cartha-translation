base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/009.yaml
  text: In addition to these things[a], he promised to register another fifty talents beyond the one hundred, if he were granted authority to establish for himself a gymnasium and an enrollment of young men[b], and to enroll those in Jerusalem as Antiochenes.
translation:
  language: ru
  text: Кроме того, он обещал записать к уплате ещё пятьдесят талантов сверх ста[a], если ему будет предоставлено полномочие учредить для себя гимнасий и эфебию[b], а жителей Иерусалима записать антиохийцами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ещё пятьдесят сверх ста». Речь идёт о талантах — крупных весовых и денежных единицах, упомянутых в ближайшем контексте.'
    reason: supplied_term
  - marker: b
    text: Гимнасий и эфебия были греческими учреждениями физического и гражданского воспитания. Эфебия объединяла юношей-эфебов, проходивших установленную подготовку; здесь оба учреждения связаны с эллинизацией Иерусалима.
    reason: cultural_note
  - marker: c
    text: 'Или: «записать жителей Иерусалима гражданами Антиохии». Греческое слово буквально означает «антиохийцами» и, вероятно, указывает на гражданскую регистрацию или особый правовой статус, связанный с Антиохией.'
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς δὲ τούτοις
  choice: Кроме того
  rationale: Естественно передаёт присоединительное значение оборота и связь с предыдущим денежным предложением.
- source_word: ὑποσχεῖτο
  choice: он обещал
  rationale: Передаёт данное им обязательство в ясной и современной форме.
- source_word: ἕτερα διαγράψειν πεντήκοντα πρὸς τοῖς ἑκατόν
  choice: записать к уплате ещё пятьдесят талантов сверх ста
  rationale: «Записать к уплате» сохраняет административно-финансовый оттенок διαγράφειν, не сводя его безоговорочно к фактической немедленной выплате; «талантов» восполняется из ближайшего денежного контекста.
- source_word: ἐὰν ἐπιχορηγηθῇ διὰ τῆς ἐξουσίας αὐτοῦ
  choice: если ему будет предоставлено полномочие
  rationale: Передаёт условие получения официальной санкции или делегированного права, не уточняя сверх греческого текста характер этой власти.
- source_word: γυμνάσιον
  choice: гимнасий
  rationale: Исторически точное название греческого учреждения, существенного для описываемой эллинизации.
- source_word: ἐφηβίαν
  choice: эфебию
  rationale: Сохраняет название особого греческого института подготовки и организации юношей; значение поясняется в сноске.
- source_word: αὐτῷ συστήσασθαι
  choice: учредить для себя
  rationale: 'Сохраняет возвратный оттенок: Иасон добивается права создать учреждения под собственным руководством.'
- source_word: τοὺς ἐν Ἱεροσολύμοις Ἀντιοχεῖς ἀναγράψαι
  choice: жителей Иерусалима записать антиохийцами
  rationale: Сохраняет административный смысл ἀναγράψαι и буквальное обозначение Ἀντιοχεῖς, не утверждая однозначно, какой именно юридический статус оно предполагало.
theological_decisions:
- issue: Культурно-политический смысл Ἀντιοχεῖς
  choice: антиохийцами
  alternative: гражданами Антиохии
  rationale: Греческий текст называет их «антиохийцами», но не определяет прямо объём соответствующего гражданского или правового статуса. Основной текст сохраняет эту неоднозначность, а вероятный смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Специальные термины «гимнасий» и «эфебия» сохранены ради культурно-исторической точности и пояснены; административные формулировки переданы ясно, без чрезмерной юридической конкретизации.
