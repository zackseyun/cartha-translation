base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/036.yaml
  text: They were indignant and deeply grieved over the man's unjust murder. But when the king returned from the regions of Cilicia[a], the Jews in the city appealed to him, and the Greeks as well, sharing in their hatred of the wicked deed,
translation:
  language: ru
  text: Они негодовали и глубоко скорбели из-за несправедливого убийства этого человека. Когда же царь возвратился из областей Киликии, жившие в городе иудеи обратились к нему, причём и греки вместе с ними ненавидели это злодеяние,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «причём и греки присоединились к ним в отвращении к этому злодеянию». Редкое греческое причастие συμμισοπονηρούντων сжато выражает совместную ненависть к злому делу и допускает несколько близких переводов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδείναζον
  choice: негодовали
  rationale: Глагол передаёт сильное возмущение и душевную боль; в сочетании со следующим глаголом здесь уместен оттенок нравственного негодования.
- source_word: ἐδυσφόρουν
  choice: глубоко скорбели
  rationale: Глагол означает тяжело переносить случившееся, быть глубоко огорчённым; такой перевод сохраняет эмоциональный оттенок, отличный от негодования.
- source_word: ἐπὶ τῷ τοῦ ἀνδρὸς ἀδίκῳ φόνῳ
  choice: из-за несправедливого убийства этого человека
  rationale: φόνος обозначает убийство, а ἄδικος подчёркивает его неправедность; указательное «этого» естественно отсылает к ранее упомянутому человеку.
- source_word: ἐπανελθόντος
  choice: возвратился
  rationale: Прямо передаёт временное значение причастия в родительном самостоятельном обороте.
- source_word: τῶν κατὰ Κιλικίαν τόπων
  choice: из областей Киликии
  rationale: Передаёт общее обозначение местностей или территорий, относящихся к Киликии.
- source_word: ἐνετύγχανον
  choice: обратились к нему
  rationale: В контексте обращения к царю глагол означает предстать с просьбой или жалобой; местоимение восполняет подразумеваемый объект.
- source_word: οἱ κατὰ πόλιν Ἰουδαῖοι
  choice: жившие в городе иудеи
  rationale: Естественно обозначает иудеев, проживавших в данном городе.
- source_word: συμμισοπονηρούντων καὶ τῶν Ἑλλήνων
  choice: причём и греки вместе с ними ненавидели это злодеяние
  rationale: Редкое сложное причастие выражает совместную ненависть к злому делу. Перевод сохраняет присоединительное обстоятельственное построение и не утверждает однозначно, что греки сами подавали прошение царю.
