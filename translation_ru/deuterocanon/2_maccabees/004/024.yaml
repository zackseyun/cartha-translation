base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/024.yaml
  text: But after being presented to the king and magnifying him by the display of his authority[a], he secured the high priesthood for himself[b], outbidding Jason by three hundred talents of silver.
translation:
  language: ru
  text: Представленный царю[a], он превознёс его, демонстрируя властную внушительность[b], и добился первосвященства для себя, предложив на триста талантов серебра больше, чем Иасон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «после того как его представили царю»; греческое выражение может подразумевать официальное представление или рекомендацию при дворе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «лицом (обликом) власти»; сжатый оборот может обозначать внешнее проявление власти или авторитетности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συσταθεὶς τῷ βασιλεῖ
  choice: представленный царю
  rationale: Страдательное причастие указывает на официальное представление или рекомендацию при дворе. Формулировка сохраняет обе возможности, не уточняя сверх текста, кто и каким образом его представил.
- source_word: δοξάσας αὐτὸν
  choice: превознёс его
  rationale: δοξάζω здесь означает возвеличить или почтить царя. «Превознёс» передаёт усиленную похвалу, но не вводит прямо отрицательную оценку «льстил».
- source_word: τῷ προσώπῳ τῆς ἐξουσίας
  choice: держась с властной внушительностью
  rationale: Буквально сжатое выражение «лицом/обликом власти» описывает впечатляющую, авторитетную манеру держаться. Русская формулировка передаёт идиоматический смысл и сохраняет образ внешнего проявления.
- source_word: εἰς ἑαυτὸν κατήντησεν ἀρχιερωσύνην
  choice: добился первосвященства для себя
  rationale: Конструкция означает, что он обеспечил переход должности к самому себе. «Добился» естественно передаёт целенаправленное и успешное приобретение сана.
- source_word: ὑπερβάλλων τὸν Ἰάσονα
  choice: предложив ... больше, чем Иасон
  rationale: При непосредственно названной сумме глагол означает, что он превысил денежное предложение Иасона. Такая передача ясна без современного разговорного оттенка слова «перебил».
- source_word: τάλαντα ἀργυρίου τριακόσια
  choice: триста талантов серебра
  rationale: Сохранена древняя мера веса и денежной стоимости без предположительного пересчёта в современные единицы.
theological_decisions:
- issue: Нравственная окраска восхваления царя
  choice: «превознёс его» — без прямого обозначения лести
  alternative: «льстил ему» или «почтил его»
  rationale: Политический контекст допускает корыстную лесть, однако сам глагол δοξάζω её не требует. Нейтрально-негативный оттенок «превознёс» оставляет оценку поступка контексту.
- issue: Смысл выражения τῷ προσώπῳ τῆς ἐξουσίας
  choice: властная внушительность как внешняя манера держаться
  alternative: буквально «с лицом власти» или «с властным видом»
  rationale: Греческое выражение семантически сжато и может относиться к авторитетному облику или присутствию. Выбранный вариант понятен по-русски, не превращая образ в утверждение о законно принадлежавшей ему власти.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким повествовательным регистром. Синтаксис сделан плавным, древняя денежная единица сохранена, а необычный греческий образ пояснён в сноске.
