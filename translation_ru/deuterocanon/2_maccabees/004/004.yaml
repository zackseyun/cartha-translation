base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/004.yaml
  text: When Onias saw the severity of the rivalry[a], and that Apollonius son of Menestheus, the governor of Coele-Syria and Phoenicia, was increasing Simon’s wickedness[b],
translation:
  language: ru
  text: Когда Ония увидел всю тяжесть соперничества[a] и что Аполлоний, сын Менесфея, правитель Келесирии и Финикии[b], содействует злодейству Симона,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распри», «духа соперничества».'
    reason: Слово φιλονεικία может обозначать соперничество, распрю или склонность к спорам.
  - marker: b
    text: Греч. στρατηγός может также означать «военачальник» или «командующий»; здесь по контексту имеется в виду областной правитель.
    reason: Сохранена неоднозначность названия должности, имевшего как военный, так и административный смысл.
lexical_decisions:
- source_word: συνορῶν
  choice: Когда Ония увидел
  rationale: Причастие задаёт обстоятельство последующего действия Онии в следующем стихе; такая конструкция естественна по-русски и сохраняет смысл восприятия происходящего.
- source_word: τὸ χαλεπὸν τῆς φιλονεικίας
  choice: насколько ожесточённым стало противостояние
  rationale: Субстантивированное прилагательное передаёт тяжёлый, опасный характер распри; «противостояние» сохраняет политический и личный оттенки φιλονεικία, не сводя её к одной ссоре.
- source_word: Ἀπολλώνιον Μενεσθέως
  choice: Аполлоний, сын Менесфея
  rationale: Родительный падеж имени естественно понимать как патронимический и ясно передать через «сын».
- source_word: στρατηγόν
  choice: правитель
  rationale: В данном контексте слово обозначает должностное лицо, управлявшее территорией; «правитель» передаёт административный смысл, сохраняя в примечании возможное военное значение.
- source_word: τῶν Κοίλης Φοινίκης καὶ Συρίας
  choice: Келесирии и Финикии
  rationale: Греческая формулировка в данном месте допускает текстовую или синтаксическую трудность, тогда как историко-географическое наименование обычно понимается как «Келесирия и Финикия»; это отражено в тексте с примечанием о должностном титуле.
- source_word: συναύξοντα
  choice: содействует умножению
  rationale: Передаёт вклад Аполлония в разрастание зла, не утверждая, что он был его единственным источником.
- source_word: κακίαν τοῦ Σίμωνος
  choice: злодеяний Симона
  rationale: В контексте речь идёт не только о внутренней порочности, но и о вредоносной деятельности Симона; множественное число по-русски естественно выражает совокупность его злых дел.
