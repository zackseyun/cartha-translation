  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Стих представляет собой незавершённое придаточное предложение, продолжающееся в следующем стихе; конечная запятая сохранена. Географическое название передано в принятой русской форме «Келесирия и Финикия».
