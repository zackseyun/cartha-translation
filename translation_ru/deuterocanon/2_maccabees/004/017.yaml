base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/017.yaml
  text: For it is not easy to act wickedly against the divine laws[b][a]; but the time that follows will make these things clear.
translation:
  language: ru
  text: Ведь нечестиво поступать против Божьих законов — дело нелёгкое[a]; однако последующее время всё это покажет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нелегко проявлять нечестие против Божьих законов». Выражение может подчёркивать как трудность, так и серьёзность такого поступка: это не пустяк.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «но последующее время сделает это ясным».'
    reason: literal_rendering
lexical_decisions:
- source_word: ἀσεβεῖν
  choice: поступать нечестиво
  rationale: Инфинитив обозначает проявление нечестия в поступках, а не только внутреннее состояние. Формулировка сохраняет явную религиозно-нравственную окраску греческого глагола.
- source_word: θείους νόμους
  choice: Божьих законов
  rationale: Прилагательное θείους указывает на принадлежность законов Богу; в иудейском контексте «Божьих» звучит естественнее по-русски, чем «божественных». Множественное число νόμους сохранено.
- source_word: οὐ ῥᾴδιον
  choice: дело нелёгкое
  rationale: Передаёт буквальное «не легко» и одновременно допускает идиоматический смысл «не пустяк», не сводя фразу лишь к практической трудности.
- source_word: ὁ ἀκόλουθος καιρός
  choice: дальнейшие события
  rationale: Буквально выражение означает «последующее время». В данном повествовательном контексте речь идёт о том, что обнаружится в ходе последующих событий; русский вариант естественен и не придаёт фразе эсхатологического смысла.
- source_word: δηλώσει
  choice: покажут
  rationale: Глагол означает «показать, сделать ясным». Форма множественного числа обусловлена естественной русской передачей подлежащего как «дальнейшие события».
theological_decisions:
- issue: Смысл утверждения о нечестии против Божьих законов
  choice: 'Высказывание оставлено как весомое предостережение: нечестивое нарушение Божьих законов — не лёгкое и не маловажное дело, что обнаружится впоследствии.'
  alternative: 'Понимать фразу узко: совершать такое нечестие практически трудно; либо прямо назвать последующие события Божьим судом.'
  rationale: Греческое οὐ ῥᾴδιον допускает как буквальный оттенок трудности, так и идиоматическую оценку серьёзности. Продолжение указывает на последующее раскрытие последствий, но прямо не называет их Божьим судом, поэтому перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. «Поступать нечестиво» сохраняет религиозный смысл без архаизма; «дальнейшие события» естественно передаёт повествовательную направленность фразы. Все сноски отмечены в основном тексте.
