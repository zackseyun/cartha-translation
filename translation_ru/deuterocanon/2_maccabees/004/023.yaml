  yaml_path: translation/deuterocanon/2_maccabees/004/023.yaml
  text: But after a period of three years[a], Jason sent Menelaus, the brother of the aforementioned Simon, to carry the money to the king and to deliver memoranda concerning necessary matters.
translation:
  language: ru
  text: Но спустя три года Иасон послал Менелая, брата ранее упомянутого Симона, доставить царю деньги и исполнить поручения по необходимым делам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «довести до завершения письменные записки (или отчёты) по необходимым делам». Греческое слово ὑπομνηματισμούς может означать поручения, памятные или докладные записки, а также письменные отчёты; точный административный смысл и характер действия, выраженного словом τελέσοντα, здесь неясны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τριετῆ χρόνον
  choice: Но спустя три года
  rationale: Передаёт временное значение μετά с винительным падежом и мягкий повествовательный переход δέ; по-русски звучит естественно.
- source_word: ἀπέστειλεν Ἰάσων Μενέλαον
  choice: Иасон послал Менелая
  rationale: Простая повествовательная передача аориста ἀποστέλλω; имена даны в традиционной русской библейской форме.
- source_word: τὸν τοῦ προσηνομένου Σίμωνος ἀδελφόν
  choice: брата упомянутого выше Симона
  rationale: προσηνομένου отсылает к Симону, названному ранее; оборот сохраняет эту связь и остаётся понятным современному читателю.
- source_word: παρακομίζοντα τὰ χρήματα τῷ βασιλεῖ
  choice: доставить царю деньги
  rationale: Причастие обозначает порученную Менелаю задачу, а χρήματα в данном контексте — денежные средства.
- source_word: περὶ πραγμάτων ἀναγκαίων
  choice: по неотложным делам
  rationale: Передаёт административный смысл πραγμάτων и оттенок необходимости или срочности в ἀναγκαίων без уточнения неизвестного содержания дел.
- source_word: ὑπομνηματισμοὺς τελέσοντα
  choice: оформить докладные записки
  rationale: ὑπομνηματισμός может обозначать памятную или докладную записку, письменный отчёт; τελέω указывает на исполнение или доведение административного действия до завершения. «Оформить» естественно передаёт это сочетание по-русски, не сужая его до одной строго определённой процедуры.
