  text: he began to strike with lawless hands[a], with a certain Auranus taking the lead, advanced in age but no less in ignorance.
translation:
  language: ru
  text: Он начал творить насилие беззаконными руками[a], а впереди шёл некий Авран, далеко продвинувшийся в годах, но ничуть не менее — в невежестве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение сжато и эллиптично. Буквально оно говорит о начале действия «беззаконных рук»; по смыслу речь идёт о начале насилия. Последующий оборот называет Аврана тем, кто шёл впереди в этом действии.
    reason: Сохранить для читателя сведения о трудности и эллиптичности исходной конструкции.
lexical_decisions:
- source_word: κατήρξατο
  choice: начал
  rationale: Аорист среднего залога от κατάρχομαι здесь обозначает начало действия; простое «начал» естественно передаёт смысл, не добавляя формального оттенка.
- source_word: χειρῶν ἀδίκων
  choice: творить насилие беззаконными руками
  rationale: Сжатая генитивная конструкция обозначает неправедное насильственное действие. Перевод сохраняет образ рук и ясно выражает подразумеваемое насилие.
- source_word: προηγησαμένου
  choice: во главе стоял
  rationale: Причастие в родительном самостоятельном обороте указывает, что названный человек возглавлял действие; русский оборот звучит естественно и сохраняет эту роль.
- source_word: τινὸς Αὐρανοῦ
  choice: некий Авран
  rationale: τινός при имени передано словом «некий»; Αὐρανός транслитерировано в соответствии с русской передачей греческого αυ как «ав».
- source_word: προβεβηκότος τὴν ἡλικίαν
  choice: преклонный годами
  rationale: Выражение означает человека, далеко продвинувшегося в возрасте; «преклонный годами» сохраняет достоинство библейского регистра.
- source_word: οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν
  choice: но ничуть не меньше и невежеством
  rationale: Сохранено намеренно резкое сопоставление преклонного возраста с столь же значительным невежеством, без сглаживания авторской иронии.
