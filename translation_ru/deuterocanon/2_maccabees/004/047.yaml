  text: So Ptolemy took him and moved the king into a colonnade[b][a], as though to revive him.
translation:
  language: ru
  text: Поэтому Птолемей, забрав его[a], перевёл царя в некую колоннаду, словно желая привести его в чувство[b].
  philosophy: optimal-equivalence
