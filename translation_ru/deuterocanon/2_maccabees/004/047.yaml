lexical_decisions:
- source_word: ὅθεν
  choice: поэтому
  rationale: В данном повествовательном контексте слово выражает следствие и связывает этот поступок с предшествующими событиями; пространственное «оттуда» здесь менее вероятно.
- source_word: ἀπολαβών
  choice: отведя его в сторону
  rationale: Причастие передаёт отделение человека от остальных или удаление с места действия. Прямое дополнение в греческом не выражено и восполнено из контекста.
- source_word: ὁ Πτολεμαῖος
  choice: Птолемей
  rationale: Общепринятая русская форма имени.
- source_word: εἴς τι περίστυλον
  choice: в колоннаду
  rationale: περίστυλον обозначает окружённое колоннами пространство или крытый проход с колоннами. «Колоннада» естественно и без излишней технической конкретизации передаёт архитектурный образ; неопределённость τι по-русски здесь не требует отдельного слова.
- source_word: ὡς ἀναψύχοντα
  choice: будто желая привести его в чувство
  rationale: ὡς при причастии обозначает видимую цель или предлог, а ἀναψύχω может означать освежить, дать облегчение или оживить. В сцене с царём естественно значение восстановления сил или сознания, при этом «будто» сохраняет оттенок мнимой цели.
- source_word: τὸν βασιλέα
  choice: царя
  rationale: Прямое соответствие явно выраженному дополнению при μετέθηκεν.
- source_word: μετέθηκεν
  choice: перевёл
  rationale: Глагол означает перемещение из одного места в другое; «перевёл» естественно описывает перемещение человека.
