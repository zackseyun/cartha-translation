lexical_decisions:
- source_word: Περὶ δὲ τούτων
  choice: По поводу всего этого
  rationale: Предлог περί с родительным падежом обозначает предмет разбирательства, а δέ служит переходной связкой. «Всего этого» естественно отсылает к ранее изложенным обстоятельствам, не добавляя временного значения.
- source_word: ἐνέστη
  choice: было возбуждено
  rationale: В сочетании с юридическим κρίσις глагол указывает на возникновение или начало производства. «Было возбуждено» ясно передаёт начало дела, хотя греческая форма буквально допускает и менее определённое «возникло».
- source_word: κρίσις
  choice: судебное разбирательство
  rationale: Слово может обозначать суд, судебное решение или сам процесс рассмотрения дела. В данном контексте «судебное разбирательство» сохраняет юридический смысл, не уточняя сверх текста форму производства.
- source_word: ἐπὶ τὸν Μενέλαον
  choice: против Менелая
  rationale: В юридическом контексте ἐπί с винительным падежом выражает направленность дела против лица; по-русски это естественно передаётся сочетанием «против Менелая».
