base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/042.yaml
  text: But when they also became aware of the attack by Lysimachus[a], some snatched up stones, others thick pieces of wood, and some, grabbing handfuls of the ashes lying nearby[c][b], hurled them all together at those around Lysimachus.
translation:
  language: ru
  text: Узнав также о нападении Лисимаха, одни схватили камни, другие — толстые куски дерева, а некоторые набрали пригоршни лежавшего рядом пепла и всё вперемешку бросали в людей Лисимаха.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в тех, кто был вокруг Лисимаха»; имеются в виду сопровождавшие его люди или сторонники.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνειδότες
  choice: узнав
  rationale: Аористное причастие в ходе повествования естественно передаёт осознание происходящего, за которым последовала реакция толпы; значение «зная» также возможно, но здесь менее динамично.
- source_word: ἐπίθεσιν
  choice: нападении
  rationale: В контексте насильственного столкновения слово обозначает нападение или атаку.
- source_word: συναρπάσαντες
  choice: схватили
  rationale: Передаёт быстрое и решительное завладение оказавшимися под рукой предметами.
- source_word: ξύλων πάχη
  choice: толстые куски дерева
  rationale: Сохраняет конкретный, но не вполне определённый образ буквально «толщ дерева», не превращая их без основания в дубины или балки.
- source_word: σποδοῦ
  choice: пепла
  rationale: Обычное значение существительного; перевод «угли» необоснованно предполагал бы наличие жара.
- source_word: δραξόμενοι
  choice: набрали пригоршни
  rationale: Глагол указывает на захватывание рукой; русский оборот естественно выражает количество, помещающееся в ладони.
- source_word: φύρδην
  choice: всё вперемешку
  rationale: 'Наречие передаёт смешанное, беспорядочное действие: в противников летели вместе разные подручные предметы.'
- source_word: ἐνετίνασσον
  choice: бросали
  rationale: Имперфект выражает продолжавшееся или повторявшееся метание; «бросали» естественно это передаёт в русском контексте.
- source_word: τοὺς περὶ τὸν Λυσίμαχον
  choice: людей Лисимаха
  rationale: Идиоматично обозначает окружавших его людей или его сторонников, не утверждая точнее, кем именно они были.
