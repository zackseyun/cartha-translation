lexical_decisions:
- source_word: Ἀγομένου
  choice: проходили
  rationale: Причастие от ἄγω в родительном самостоятельном обороте обозначает проведение состязаний; «проходили» естественно передаёт продолжающееся событие и не добавляет отсутствующего в греческом указания «теперь».
- source_word: πενταετηρικοῦ
  choice: четырёхлетние
  rationale: Буквально слово связано с пятью годами, но в греческом календарном употреблении обозначает праздник, повторявшийся через четыре года при включительном счёте; примечание сохраняет буквальную форму исходного выражения.
- source_word: ἀγῶνος
  choice: игры
  rationale: В контексте городского праздника в Тире ἀγών означает публичные состязания; «игры» передаёт это кратко, не вводя не выраженного прямо уточнения «атлетические».
- source_word: ἐν Τύρῳ
  choice: в Тире
  rationale: Прямая передача обозначения места.
- source_word: τοῦ βασιλέως παρόντος
  choice: и царь присутствовал там
  rationale: Второй родительный самостоятельный оборот передан сочинённой частью для естественного современного русского синтаксиса; «там» ясно связывает присутствие царя с играми в Тире.
