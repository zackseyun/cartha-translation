lexical_decisions:
- source_word: ἕνεκα
  choice: ввиду
  rationale: Предлог передаёт причинно-обстоятельственное основание; «ввиду» естественно сочетается со «сложившимися обстоятельствами» и сохраняет краткость греческого оборота.
- source_word: τῶν παρόντων
  choice: сложившихся обстоятельств
  rationale: Субстантивированное причастие среднего рода множественного числа обозначает наличное положение дел без уточнения конкретных нужд; перевод не сужает смысл до одной причины.
- source_word: κατασκευάς
  choice: оснащение
  rationale: В морском контексте слово может означать подготовку и снаряжение судов, а не только их постройку; «оснащение» здесь звучит естественно и достаточно широко.
- source_word: τριηρέων
  choice: триер
  rationale: Сохранено точное историческое название античных гребных военных кораблей, а не более общее «военных кораблей».
