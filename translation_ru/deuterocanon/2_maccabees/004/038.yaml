base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/038.yaml
  text: And[a], inflamed with anger, he immediately stripped off Andronikos's purple robe and tore off his garments, and after leading him around through the whole city to the very place where he had committed his impiety against Onias, there he dispatched the murderer[b], the Lord rendering to him the punishment he deserved.
translation:
  language: ru
  text: И, воспылав гневом, он тотчас сорвал с Андроника пурпурное одеяние и разорвал его одежды. Проведя его по всему городу до того самого места, где тот нечестиво поступил с Онией, там он предал смерти запятнанного кровью убийцу[a],[b] и Господь воздал ему заслуженной карой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово означает не просто убийцу, но убийцу, запятнанного пролитой кровью и несущего кровавую вину.
    reason: lexical_alternative
  - marker: b
    text: 'Глагол, переведённый как «предал смерти», может образно указывать на поражение копьём или подобным оружием; в данном контексте несомненен общий смысл: Андроника казнили на этом месте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πυρωθεὶς τοῖς θυμοῖς
  choice: воспылав гневом
  rationale: Передаёт метафору разгоревшегося огня и силу гнева естественным для литературного русского оборотом.
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Сохраняет стремительность действия и высокий, но современно понятный повествовательный регистр.
- source_word: τὴν τοῦ Ἀνδρονίκου πορφύραν
  choice: пурпурное одеяние Андроника
  rationale: πορφύρα обозначает пурпурную ткань или статусное пурпурное одеяние; перевод сохраняет и предметный, и символический смысл.
- source_word: τοὺς χιτῶνας περιρρήξας
  choice: разодрал на нём одежды
  rationale: Передаёт интенсивность глагола и ясно указывает, что речь об одеждах Андроника, не ограничивая значение буквальными хитонами.
- source_word: περιαγαγὼν καθʼ ὅλην τὴν πόλιν
  choice: проведя его по всему городу
  rationale: Сохраняет публичное ведение преступника через город, не добавляя идеи формально устроенного шествия.
- source_word: οὗπερ τὸν Ὀνίαν ἠσέβησεν
  choice: где тот нечестиво поступил с Онией
  rationale: Передаёт религиозно-нравственную силу ἀσεβέω и естественно выражает направленность злодеяния против Онии.
- source_word: τὸν μιαφόνον
  choice: запятнанного кровью убийцу
  rationale: В отличие от простого «убийца», сохраняет заложенное в μιαφόνος представление о кровавой вине и осквернении.
- source_word: ἀπεκόντισεν
  choice: предал смерти
  rationale: Надёжно передаёт результат действия, не утверждая с полной определённостью способ убийства, хотя глагол может намекать на поражение метательным копьём.
- source_word: τοῦ κυρίου τὴν ἄξιαν αὐτῷ κόλασιν ἀποδόντος
  choice: и Господь воздал ему заслуженным наказанием
  rationale: Явно сохраняет богословское истолкование казни как воздаяния Господа и естественно передаёт смысл причастного оборота.
theological_decisions:
- issue: Передача κύριος в утверждении о божественном суде
  choice: Господь
  alternative: Бог
  rationale: Греческий текст употребляет κύριος; «Господь» сохраняет данный титул без подмены и ясно указывает на Бога.
- issue: Связь человеческой казни с божественным воздаянием
  choice: и Господь воздал ему заслуженным наказанием
  alternative: так Господь воздал ему заслуженное наказание
  rationale: Перевод сохраняет прямое приписывание воздаяния Господу. Сочинительная конструкция естественна по-русски и не усиливает причинно-следственную связь сверх греческого родительного самостоятельного оборота.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Синтаксис разделён на два предложения ради ясности; сохранены эмоциональная интенсивность, публичное унижение Андроника и явное богословское осмысление его смерти как суда Господа. Все маркеры примечаний присутствуют в основном тексте.
