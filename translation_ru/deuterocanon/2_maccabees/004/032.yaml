base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/032.yaml
  text: But Menelaus[a], thinking that he had found a favorable opportunity, embezzled some of the gold vessels of the temple and gave them as a gift to Andronicus[b], and he had managed to sell others in Tyre and the surrounding cities.
translation:
  language: ru
  text: Но Менелай, сочтя, что представился удобный случай, присвоил несколько золотых предметов, принадлежавших храму, и подарил их Андронику; другие же он уже продал в Тире и окрестных городах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομίσας
  choice: решив
  rationale: Аористное причастие передаёт субъективную оценку Менелая; «решив» естественно вводит его вывод о наступившем удобном случае.
- source_word: καιρὸν εὐφυῆ
  choice: удобный случай
  rationale: Сочетание обозначает подходящую, выгодную возможность; этот вариант естественен по-русски и сохраняет смысл обстоятельства и преимущества.
- source_word: χρυσώματά τινα
  choice: несколько золотых предметов
  rationale: χρυσώματα — общее обозначение золотых изделий или предметов. Перевод не сужает значение до сосудов, чего само слово не требует.
- source_word: τῶν τοῦ ἱεροῦ
  choice: из храма
  rationale: Генитив указывает на принадлежность этих предметов храму; в русском контексте «из храма» ясно передаёт и происхождение, и связь с храмовым имуществом.
- source_word: νοσφισάμενος
  choice: присвоил себе
  rationale: Глагол означает неправомерное обращение чужого или вверенного имущества в свою пользу. «Присвоил себе» сохраняет этот смысл без излишне узкого современного юридического термина.
- source_word: ἐχαρίσατο
  choice: подарил
  rationale: Средний залог χαρίζομαι здесь означает дать в дар или в качестве услуги; «подарил» кратко и точно передаёт это значение.
- source_word: ἐτύγχανεν πεπρακὼς
  choice: уже продал
  rationale: Описательная конструкция указывает на состоявшуюся ранее продажу; частица «уже» передаёт результативность, тогда как буквальный оттенок случайности в русском звучал бы неясно.
- source_word: ἕτερα
  choice: другие
  rationale: Слово отсылает к другим золотым предметам; антецедент в русском предложении достаточно ясен.
- source_word: εἴς τε Τύρον καὶ τὰς κύκλῳ πόλεις
  choice: в Тире и окрестных городах
  rationale: Хотя εἰς буквально выражает направление, при глаголе продажи выражение естественно обозначает место или рынок сбыта. Русская формулировка сохраняет географический охват.
theological_decisions:
- issue: Характер проступка Менелая в отношении храмового имущества
  choice: «присвоил себе» — неправомерно обратил храмовые ценности в свою пользу
  alternative: «похитил» или «растратил»
  rationale: Выбранный вариант передаёт нравственную и имущественную тяжесть νοσφίζομαι, но не навязывает более узкую юридическую квалификацию и не добавляет позднейших богословских категорий.
translation_notes:
  register: Современный литературный русский язык, повествовательный и сдержанно-достоинный регистр. Синтаксис слегка формальный, но понятный обычному читателю; точка с запятой разделяет два связанных действия и устраняет тяжеловесное повторение союза.
