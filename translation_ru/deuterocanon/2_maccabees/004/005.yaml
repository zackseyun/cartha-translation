    reason: лексическая альтернатива
lexical_decisions:
- source_word: διεκοσμήθη
  choice: отправился
  rationale: В данном придворном контексте пассивная форма передаёт подготовленное появление или прибытие Они́и к царю. «Отправился» естественно продолжает повествование и не вносит буквального значения «был украшен».
- source_word: οὐ γινόμενος
  choice: не как
  rationale: 'Причастие описывает, в каком качестве он пришёл: он не выступал обвинителем. Такая передача естественна по-русски и сохраняет обстоятельственный смысл.'
- source_word: τῶν πολιτῶν
  choice: своих сограждан
  rationale: πολῖται обозначает членов одной гражданской общины; притяжательное «своих» ясно выражает эту связь.
- source_word: κατήγορος
  choice: обвинитель
  rationale: Сохраняется основное судебно-речевое значение слова без чрезмерно институционального оттенка «прокурор» и без сужения до «доносчик».
- source_word: τὸ δὲ σύμφορον
  choice: о благе
  rationale: Субстантивированное выражение означает полезное, выгодное или благотворное. «Благо» звучит естественно и достойно, не сводя смысл к материальной выгоде.
- source_word: κοινῇ καὶ κατʼ ἰδίαν
  choice: как общем, так и каждого в отдельности
  rationale: Передан контраст между благом общины в целом и благом отдельных людей; это согласуется с дательным παντὶ τῷ πλήθει и сохраняет сжатость греческой конструкции.
- source_word: παντὶ τῷ πλήθει
  choice: всего народа
  rationale: πλῆθος здесь относится ко всей совокупности народа. «Весь народ» современнее и естественнее буквального «всё множество».
theological_decisions:
- issue: Нравственная характеристика обращения Они́и к царю
  choice: Они́я предстаёт не обвинителем сограждан, а человеком, заботящимся о благе народа в целом и каждого отдельно.
  alternative: Заключительные слова можно понимать как заботу о пользе народа и в общественных, и в частных делах.
  rationale: 'Сжатая конструкция κοινῇ καὶ κατʼ ἰδίαν допускает оттенок способа или сферы, однако связь с παντὶ τῷ πλήθει естественно поддерживает распределительное понимание: общее благо и благо каждого.'
translation_notes:
  register: Современный литературный русский язык с умеренно книжным, повествовательным тоном. Избегнуты архаизмы и чрезмерно буквальные обороты; синтаксическая неоднозначность заключительной фразы отмечена в решениях, а неоднозначность διεκοσμήθη вынесена в сноску.
