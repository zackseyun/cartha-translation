  yaml_path: translation/deuterocanon/2_maccabees/004/025.yaml
  text: But after receiving the royal commands[a], he arrived, bringing nothing worthy of the high priesthood[c][b], but having the passions of a cruel tyrant and the rage of a barbarous beast.
translation:
  language: ru
  text: Получив царские повеления[a], он прибыл, не обладая ничем, достойным первосвященства[b], но обладая яростными порывами жестокого тирана и вспышками гнева необузданного зверя[c].
