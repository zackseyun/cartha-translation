  text: And he was received with great splendor by Jason and the city[a], and was welcomed with a torchlight procession and shouts; then in this way he encamped in Phoenicia.
translation:
  language: ru
  text: 'Ясон и жители города приняли его с великой пышностью: его торжественно встретили шествием с факелами и громкими возгласами[a]. Затем он расположился лагерем в Финикии.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с несением факелов и криками». Греческие слова описывают торжественную общественную встречу с факелами и громкими возгласами, не уточняя их содержание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγαλομερῶς
  choice: с великой пышностью
  rationale: Наречие обозначает великолепный, пышный характер официального приёма; выражение естественно для современного литературного русского языка.
- source_word: ὑπὸ τοῦ Ἰάσονος καὶ τῆς πόλεως
  choice: Иасон и жители города
  rationale: Греческое «город» метонимически обозначает городское сообщество; по-русски «жители города» ясно передаёт действующих лиц, не создавая впечатления, будто речь идёт о неодушевлённом месте.
- source_word: ἀποδεχθεὶς
  choice: приняли его
  rationale: В данном контексте глагол описывает официальный приём прибывшего правителя.
- source_word: μετὰ δᾳδουχίας καὶ βοῶν
  choice: шествием с факелами и громкими возгласами
  rationale: Передаёт как церемониальное несение факелов, так и сопровождавшие его громкие крики, не уточняя, были ли они приветственными возгласами.
- source_word: εἰσεδέχθη
  choice: его торжественно встретили
  rationale: Глагол обозначает принятие или встречу при входе; «встретили» естественно передаёт его здесь, а «торжественно» связывает действие с описанной церемонией.
- source_word: εἶθʼ οὕτως
  choice: затем
  rationale: Краткий русский переход ясно передаёт последовательность событий; буквальное «затем таким образом» в этом контексте звучало бы неестественно и двусмысленно.
- source_word: κατεστρατοπέδευσεν
  choice: расположился лагерем
  rationale: Сохраняет прямое военное значение глагола — стать лагерем, не добавляя прямо не названных войск или походных подробностей.
- source_word: Φοινίκην
  choice: Финикии
  rationale: Общепринятое русское название области Финикия в требуемом падеже.
