  text: So the king came quickly to settle the affairs, leaving Andronicus, one of those holding high office, as his successor.
translation:
  language: ru
  text: Поэтому царь поспешно прибыл, чтобы уладить дела, оставив вместо себя Андроника, одного из высокопоставленных сановников.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θᾶττον
  choice: поспешно
  rationale: Сравнительная форма здесь употреблена наречно и по контексту выражает быстроту действий царя.
- source_word: καταστεῖλαι τὰ πράγματα
  choice: уладить дела
  rationale: Оборот означает привести ситуацию в порядок, успокоить или урегулировать возникшие дела; русское выражение сохраняет широту смысла.
- source_word: καταλείπων τὸν διαδεχόμενον Ἀνδρόνικον
  choice: оставив вместо себя Андроника
  rationale: Субстантивированное причастие διαδεχόμενον указывает на того, кто замещает царя при его отсутствии; такая передача естественна по-русски и не предполагает непременно престолонаследие.
- source_word: τῶν ἐν ἀξιώματι κειμένων
  choice: одного из высокопоставленных сановников
  rationale: Греческий оборот буквально обозначает людей, находящихся в почётном или властном положении; «сановников» ясно передаёт официальный высокий статус.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествовательный стиль краткий и dignified. Формулировка «вместо себя» выбрана вместо «своим преемником», поскольку контекст говорит о временном заместительстве, а не обязательно о наследовании власти.
