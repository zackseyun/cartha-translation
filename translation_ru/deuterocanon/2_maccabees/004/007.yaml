lexical_decisions:
- source_word: Μεταλλάξαντος ... τὸν βίον
  choice: ушёл из жизни
  rationale: Греческое выражение буквально говорит о «перемене жизни» и служит эвфемизмом смерти. Русское «ушёл из жизни» сохраняет косвенность оригинала и звучит естественно.
- source_word: παραλαβόντος τὴν βασιλείαν
  choice: царство принял
  rationale: В контексте престолонаследия выражение означает принятие царской власти и владения. Такая формулировка близка к греческой и естественна для литературного русского языка.
- source_word: Ἀντιόχου
  choice: Антиох
  rationale: Традиционная русская форма греческого имени.
- source_word: τοῦ προσαγορευθέντος
  choice: прозванный
  rationale: Причастие указывает на закрепившееся за царём именование; «прозванный» кратко и точно передаёт эту функцию.
- source_word: Ἐπιφανοῦς
  choice: Эпифаном
  rationale: Царский эпитет передан традиционной русской транслитерацией, без истолковывающего перевода.
