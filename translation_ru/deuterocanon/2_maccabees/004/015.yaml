  yaml_path: translation/deuterocanon/2_maccabees/004/015.yaml
  text: and placing no value at all on the honors of their fathers[b][a], but considering the Greek distinctions the finest.
translation:
  language: ru
  text: и ни во что не ставя почести предков[a], а греческие знаки отличия[b] считая наилучшими.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «унаследованные почести»; буквально — «отеческие почести».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово δόξας можно также перевести как «славу» или «почести»; здесь речь идёт о престижных отличиях греческой культуры.
    reason: lexical_alternative
lexical_decisions:
- source_word: πατρῴας τιμὰς
  choice: почести предков
  rationale: Передаёт унаследованные от предков почести и установления, сохраняя семейно-исторический оттенок πατρῴας и не сужая τιμαί до юридических привилегий.
- source_word: ἐν οὐδενὶ τεθειμένοι
  choice: ни во что не ставя
  rationale: Естественная русская идиома, точно выражающая отношение к чему-либо как к не имеющему никакой ценности.
- source_word: Ἑλληνικὰς δόξας
  choice: греческие знаки отличия
  rationale: В данном контексте множественное δόξαι обозначает ценимые проявления престижа греческой культуры; выражение сохраняет социально-культурный смысл, не сводя его только к отвлечённой «славе».
- source_word: καλλίστας
  choice: наилучшими
  rationale: Передаёт превосходную степень καλός как оценочное суждение; буквальное «прекраснейшими» в современном русском могло бы неоправданно подчеркнуть эстетический смысл.
- source_word: ἡγούμενοι
  choice: считая
  rationale: Кратко и естественно передаёт значение оценки и суждения.
theological_decisions:
- issue: Оценочное противопоставление наследия предков и греческого культурного престижа
  choice: Сохранено резкое противопоставление «ни во что не ставя… считая наилучшими» без усиления глаголом «презирая».
  alternative: «презирая почести предков, а греческую славу почитая превыше всего»
  rationale: Греческий текст выражает полное обесценивание наследия предков, но прямо не употребляет глагол «презирать»; выбранная формулировка сохраняет напряжение и не усиливает авторскую характеристику.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет синтаксическую связь с окружающим предложением посредством начального «и» и деепричастных конструкций. Тон сдержанный и повествовательный, без конфессионально окрашенной терминологии.
