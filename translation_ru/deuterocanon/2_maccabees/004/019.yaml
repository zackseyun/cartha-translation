  yaml_path: translation/deuterocanon/2_maccabees/004/019.yaml
  text: Jason the vile man sent Antiochians from Jerusalem as envoys, carrying three hundred silver drachmas for the sacrifice to Heracles; but those who carried them requested that they not be used for sacrifice,
translation:
  language: ru
  text: Нечестивый Ясон послал антиохийцев как посланников от Иерусалима[a], которые несли триста серебряных драхм для жертвы Гераклу. Однако те, кто доставлял деньги, просили не использовать их для жертвоприношения,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как от Иерусалима»; оборот может подчёркивать, что они выступали представителями Иерусалима.'
    reason: Сохраняет неоднозначность ὡς ἀπʼ Ἱεροσολύμων, не добавляя оттенка мнимости, которого греческий текст прямо не выражает.
lexical_decisions:
- source_word: μιερὸς
  choice: нечестивый
  rationale: Сохраняет резкую нравственно-религиозную оценку Ясона, выраженную греческим прилагательным, и при этом естественно звучит в современном литературном русском.
- source_word: θεωρούς
  choice: посланников
  rationale: Передаёт значение официальных представителей, направленных на празднично-культовое мероприятие, без малопонятного специального термина «феоры».
- source_word: ὡς ἀπʼ Ἱεροσολύμων
  choice: как посланников от Иерусалима
  rationale: Сохраняет представительный оттенок ὡς и связь посольства с Иерусалимом; возможная дистанцирующая сила ὡς отмечена в сноске.
- source_word: Ἀντιοχέας
  choice: антиохийцев
  rationale: Прямо передаёт этникон и не заменяет его толкованием о юридическом или гражданском статусе этих людей.
- source_word: παρακομίζοντας
  choice: поручив им доставить
  rationale: 'Естественно передаёт сопутствующее действие причастия: посланники везли предназначенные для жертвы деньги.'
- source_word: ἀργυρίου δραχμὰς τριακοσίους
  choice: триста серебряных драхм
  rationale: Сохраняет сумму, металл и название денежной единицы.
- source_word: εἰς τὴν τοῦ Ἡρακλέους θυσίαν
  choice: для жертвы Гераклу
  rationale: Ясно обозначает предполагаемое культовое назначение денег и адресата жертвы.
- source_word: ἠξίωσαν
  choice: просили
  rationale: Передаёт обращение с просьбой или требованием, не усиливая его до категорического настояния.
- source_word: μὴ χρησθαι εἰς θυσίαν
  choice: не употреблять их на жертвоприношение
  rationale: Сохраняет запрет на использование денег именно для жертвенного обряда; местоимение «их» относится к деньгам.
theological_decisions:
- issue: Авторская нравственно-религиозная оценка Ясона в μιερὸς
  choice: 'Сохранить явное осуждение: «нечестивый»'
  alternative: «осквернённый» или «мерзкий»
  rationale: Осуждение принадлежит самому греческому тексту. «Нечестивый» сохраняет религиозно-нравственную окраску, тогда как «осквернённый» может подразумевать лишь обрядовое состояние, а «мерзкий» преимущественно выражает эмоциональное отвращение.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис прояснён без устранения неоднозначности представительного оборота. Конечная запятая сохранена, поскольку предоставленный греческий отрывок синтаксически продолжается в следующем стихе.
