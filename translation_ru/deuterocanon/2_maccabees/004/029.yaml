lexical_decisions:
- source_word: ἀπέλιπεν
  choice: оставил
  rationale: Передаёт прямое значение глагола «оставил»; роль оставленного лица далее уточняется существительным «преемником». Во второй части глагол естественно опущен вслед за греческим текстом.
- source_word: τῆς ἀρχιερωσύνης διάδοχον
  choice: преемником в первосвященстве
  rationale: Сохраняет значение διάδοχος как «преемник» и прямо называет должность, не превращая выражение в более сильное «назначил первосвященником».
- source_word: τὸν ἑαυτοῦ ἀδελφόν
  choice: своего родного брата
  rationale: Слово «своего» передаёт возвратное ἑαυτοῦ, а «родного» естественно сохраняет его усилительный оттенок в современном русском языке.
- source_word: τὸν ἐπὶ τῶν Κυπρίων
  choice: начальствовавшего над киприотами
  rationale: Передаёт буквальное отношение «поставленный над киприотами», не приписывая Кратету конкретного административного титула, которого греческий текст не называет.
