  text: And Jason[a], who had supplanted his own brother, having himself been supplanted by another, fled and went into the land of the Ammonites.
translation:
  language: ru
  text: Иасон же[a], который вытеснил собственного брата, сам был вытеснен другим и бежал в землю аммонитян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который обошёл собственного брата, сам будучи обойдён другим». В греческом тексте один и тот же глагол употреблён в действительном и страдательном залоге, подчёркивая иронический поворот.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπονοθεύσας
  choice: вытеснил
  rationale: Глагол указывает на вероломное устранение Иасоном своего брата с его места. «Вытеснил» передаёт результат, не уточняя сверх текста способ действия.
- source_word: ὑπονοθευθεὶς
  choice: сам был вытеснен
  rationale: Повтор того же русского глагола в страдательной форме сохраняет греческую риторическую симметрию и подчёркивает иронический поворот.
- source_word: φυγάς
  choice: бежал
  rationale: Передаёт, что Иасон удалился как беглец; по-русски глагольная форма естественнее буквального «став беглецом».
- source_word: ὑπῆλθεν
  choice: в землю
  rationale: В сочетании с «бежал» значение движения к месту назначения естественно выражается предлогом, без избыточного второго глагола движения.
- source_word: τὴν Ἀμμανῖτιν χώραν
  choice: землю аммонитян
  rationale: Ясно и естественно передаёт название территории через относящуюся к ней этническую группу.
- source_word: ὁ τὸν ἴδιον ἀδελφὸν
  choice: собственного брата
  rationale: «Собственного» отражает ἴδιον и усиливает нравственную остроту поступка против родного брата.
