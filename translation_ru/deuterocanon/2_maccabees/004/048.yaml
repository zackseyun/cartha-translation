base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/048.yaml
  text: And he released Menelaus[a], the cause of all the evil, from among the accused; but for those wretched men—who, even if they had pleaded their case before Scythians[c][b], would have been acquitted—for them he decreed death.
translation:
  language: ru
  text: А Менелая, виновника всего зла, он освободил из числа обвиняемых; несчастным же, которые, даже если бы защищались перед скифами[a], были бы отпущены без осуждения, он вынес смертный приговор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «даже если бы говорили перед скифами, были бы отпущены неосуждёнными». Упоминание скифов усиливает иронию: даже народ, считавшийся суровым, признал бы этих людей невиновными.'
    reason: cultural_note
lexical_decisions:
- source_word: τὸν ... αἴτιον
  choice: виновника
  rationale: В данной конструкции αἴτιος обозначает того, кто несёт ответственность и является причиной зла; «виновник» естественно передаёт и причинный, и нравственно-судебный оттенок.
- source_word: τῆς ὅλης κακίας
  choice: всего зла
  rationale: ὅλης указывает на полноту, а κακία — на зло или злодеяние; сочетание «всего зла» сохраняет широкое нравственное обвинение.
- source_word: ἀπέλυσεν τῶν κατηγορημένων
  choice: освободил из числа обвиняемых
  rationale: 'Передаёт буквальный образ: Менелая отпустили, выведя из числа тех, против кого было выдвинуто обвинение, без усиления до явно выраженного формального оправдания.'
- source_word: ταλαιπώροις
  choice: несчастным
  rationale: Слово выражает жалость к людям, терпящим бедствие; «несчастным» звучит естественно и сохраняет авторское сочувствие.
- source_word: οἵτινες εἰ καὶ ἐπὶ Σκυθῶν ἔλεγον
  choice: которые, даже если бы защищались перед скифами
  rationale: ἐπί с родительным имеет здесь судебный смысл «перед», а ἔλεγον эллиптически указывает на выступление в свою защиту. Русское «защищались» ясно передаёт судебный контекст.
- source_word: ἀπελύθησαν ἀκατάγνωστοι
  choice: были бы отпущены без осуждения
  rationale: 'Сохраняются оба элемента греческого выражения: освобождение (ἀπελύθησαν) и отсутствие обвинительного приговора (ἀκατάγνωστοι), без замены их одним словом «оправданы».'
- source_word: θάνατον ἀπέκρινεν
  choice: вынес смертный приговор
  rationale: В судебном контексте ἀποκρίνω обозначает вынесение решения; «вынес смертный приговор» естественно и точно выражает смысл.
