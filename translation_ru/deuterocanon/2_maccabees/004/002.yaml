  text: and he dared to call the benefactor of the city[a], the guardian of his fellow countrymen, and the zealot for the laws, a conspirator against the state.
translation:
  language: ru
  text: И благодетеля города, защитника своих соплеменников и ревнителя законов он осмеливался называть заговорщиком против государства.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человеком, злоумышляющим против общественных дел»; возможно также: «заговорщиком против общего блага». Греческое выражение имеет политический смысл и обозначает не просто личную враждебность.'
    reason: Устраняет неестественную русскую кальку в первом альтернативном варианте, сохраняя смысловой диапазон ἐπίβουλον τῶν πραγμάτων и политическую силу обвинения.
lexical_decisions:
- source_word: εὐεργέτην
  choice: благодетеля
  rationale: Передаёт почётное гражданское наименование человека, оказывающего городу значительные благодеяния.
- source_word: κηδεμόνα
  choice: защитника
  rationale: Естественно выражает заботу и покровительство по отношению к соплеменникам; «опекун» здесь звучало бы слишком узко и юридически.
- source_word: τῶν ὁμοεθνῶν
  choice: своих соплеменников
  rationale: Сохраняет этническую и национальную общность, выраженную греческим словом; местоимение «своих» естественно связывает определение с описываемым лицом.
- source_word: ζηλωτὴν τῶν νόμων
  choice: ревнителя законов
  rationale: Сохраняет существительное со значением горячей преданности и явное множественное число νόμων, не превращая слово в обозначение религиозно-политической партии.
- source_word: ἐπίβουλον τῶν πραγμάτων
  choice: заговорщиком против государства
  rationale: Передаёт обвинение в политическом злоумышлении, а не просто в личной враждебности; τὰ πράγματα в данном контексте относится к общественно-государственной сфере.
- source_word: ἐτόλμα λέγειν
  choice: осмеливался называть
  rationale: Передаёт неодобрительную оценку дерзости говорящего и несовершенный вид греческого глагола; «называть» естественно вводит приписываемое Онию обвинение.
