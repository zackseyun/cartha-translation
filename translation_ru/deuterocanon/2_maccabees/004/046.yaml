base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/046.yaml
  text: But Menelaus[a], already having been won over, promised Ptolemy son of Dorymenes a considerable amount of money to persuade the king.
translation:
  language: ru
  text: Но Менелай, уже добившийся благосклонности[a], пообещал Птолемею, сыну Доримена, значительную сумму денег, чтобы тот убедил царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая форма имеет не вполне ясный смысл. Возможны переводы: «уже снискавший расположение» или «уже склонённый на чью-то сторону». Вероятно, речь идёт о благосклонном отношении, которым Менелай уже заручился; не уточняется, каким образом и чьё именно это было расположение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λελιμμένος
  choice: оказавшись в безвыходном положении
  rationale: Редкая и трудная форма в данном контексте описывает неблагоприятное положение Менелая перед царским разбирательством. Такой перевод естественно передаёт смысл «уступивший, проигрывающий, прижатый обстоятельствами», не приписывая ему неподтверждённого подкупа на этом этапе.
- source_word: ἐπηγγείλατο
  choice: пообещал
  rationale: Средний залог здесь выражает обещание или обязательство дать деньги.
- source_word: χρήματα ἱκανὰ
  choice: значительную сумму денег
  rationale: Сочетание обозначает немалые, существенные денежные средства; русский вариант точен и естествен.
- source_word: τῷ Πτολεμαίῳ Δορυμένους
  choice: Птолемею, сыну Доримена
  rationale: Родительный падеж Δορυμένους наиболее естественно понимать как патронимическое указание.
- source_word: πρὸς τὸ πεῖσαι τὸν βασιλέα
  choice: чтобы тот убедил царя
  rationale: Оборот выражает цель. Местоимение «тот» ясно указывает, что убедить царя должен Птолемей, которому обещаны деньги.
