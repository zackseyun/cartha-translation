base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/034.yaml
  text: Therefore Menelaus took Andronicus aside privately and urged him to strike down Onias by treachery[a]. Andronicus went to Onias, and after winning his confidence by deceit and greeting him with oaths, giving him his right hand, though he was under suspicion, he persuaded him to come out from the place of asylum. Then he immediately shut him away[c][b], showing no regard for justice.
translation:
  language: ru
  text: Поэтому Менелай, отведя Андроника в сторону наедине, убеждал его коварно расправиться с Онией[a]. Андроник пришёл к Онии и, обманом добившись его доверия, заверил его клятвами и подал ему правую руку. Хотя тот был под подозрением, Андроник убедил Онию выйти из убежища[b], а затем тотчас заключил его[c], нисколько не считаясь со справедливостью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Соответствующее греческое выражение текстологически и лексически трудно. По контексту Менелай тайно склонял Андроника устроить убийство Онии.
    reason: textual_variant
  - marker: b
    text: 'Или: «выйти из святилища»; «покинуть неприкосновенное место». Греческое слово обозначает защищённое место убежища.'
    reason: lexical_alternative
  - marker: c
    text: 'По контексту возможно: «убил его» или «предал его смерти». Сам греческий глагол выражает это менее прямо и буквально может означать «закрыл», «запер» или «заключил».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὅθεν
  choice: Поэтому
  rationale: Передаёт причинно-следственный переход от предшествующих событий.
- source_word: λαβὼν ἰδίᾳ τὸν Ἀνδρόνικον
  choice: отведя Андроника в сторону, наедине
  rationale: Выражает тайный, частный характер разговора и сохраняет оттенок заговора.
- source_word: παρεκάλει χειρόγραφον τὸν Ὀνίαν
  choice: убеждал его коварно расправиться с Онией
  rationale: Слово χειρόγραφον в переданном греческом тексте лексически и, вероятно, текстологически трудно; контекст ясно указывает на тайно подготовленную расправу, но точный смысл отмечен в сноске.
- source_word: πεισθεὶς ἐπὶ δόλῳ
  choice: обманом добившись его доверия
  rationale: Естественно передаёт обманное убеждение Онии, не превращая двусмысленную грамматическую форму в излишне буквальную конструкцию.
- source_word: δεξιωθεὶς μεθʼ ὅρκων, δοὺς δεξιάν
  choice: заверил его клятвами и подал ему правую руку
  rationale: Сохраняет и словесное заверение клятвами, и древний жест гарантии доверия.
- source_word: καίπερ ἐν ὑποψίᾳ κείμενος
  choice: Хотя Ония и относился к нему с подозрением
  rationale: В контексте Ония, несмотря на подозрение, поддаётся уговорам. Русская формулировка проясняет референтов, однако не уточняет причину подозрения.
- source_word: ἐκ τοῦ ἀσύλου προελθεῖν
  choice: выйти из убежища
  rationale: Ἄσυλον обозначает неприкосновенное место защиты; «убежище» естественно по-русски и сохраняет защитно-правовой смысл, а возможный культовый оттенок указан в сноске.
- source_word: παρέκλεισεν
  choice: устранил его
  rationale: Глагол буквально связан с закрыванием или исключением, но контекст повествует об убийстве Онии. «Устранил» сохраняет эвфемистическую неявность греческого слова и одновременно остаётся понятным в контексте; более сильное чтение дано в сноске.
- source_word: οὐκ αἰδεσθεὶς τὸ δίκαιον
  choice: нисколько не считаясь со справедливостью
  rationale: Передаёт отсутствие почтения к справедливости естественным современным русским выражением.
theological_decisions:
- issue: Характер ἄσυλον
  choice: убежище
  alternative: святилище; неприкосновенное место
  rationale: Греческое слово подчёркивает защищённость места и может иметь культовый оттенок. Основной текст не сужает значение до храма, а сноска сохраняет альтернативы.
- issue: Сила παρέκλεισεν в повествовательном контексте
  choice: устранил его
  alternative: запер его; убил его; предал его смерти
  rationale: Контекст подразумевает гибель Онии, однако сам глагол менее прям. Выбранная формулировка удерживает напряжение между лексической неявностью и очевидным исходом события.
- issue: Субъект подозрения в καίπερ ἐν ὑποψίᾳ κείμενος
  choice: Ония относился к Андронику с подозрением
  alternative: Андроник находился под подозрением
  rationale: По ходу фразы уступка относится к тому, что Ония вышел, невзирая на подозрения. При этом греческая конструкция допускает более буквальное описание Андроника как находившегося под подозрением.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис упрощён ради ясности, но сохранены последовательность обмана, клятвенный жест, подозрение, нарушение неприкосновенности убежища и нравственная оценка поступка.
