  source_fidelity: 'Основной смысл передан точно: Симон, названный ранее, порочит Онию, приписывая ему подстрекательство Илиодора и ответственность за бедствия. Однако сочетание «доносчик о деньгах и об отечестве» не соответствует русскому управлению и звучит как обозначение несуществующей роли. Перестройка на личную форму «донёсший о…» естественно передаёт ἐνδείκτης γεγονώς, не уточняя характер денег и не снимая необычную широту греческих генитивов.'
