base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/001.yaml
  text: But the previously mentioned Simon[a], who had become an informer against the money and the homeland, kept slandering Onias, as though he were the one who had incited Heliodorus and had become the author of the troubles.
translation:
  language: ru
  text: Но упомянутый прежде Симон, донёсший о деньгах и об отечестве, продолжал клеветать на Онию, будто это он подстрекнул Илиодора и стал виновником бедствий.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стал виновником зла». Греческое выражение может обозначать как зло, так и бедствия или несчастья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προειρημένος
  choice: упомянутый прежде
  rationale: Передаёт отсылку к ранее названному Симону естественно и без архаического оттенка.
- source_word: ἐνδείκτης
  choice: доносчик
  rationale: Сохраняет враждебный, обвинительный смысл человека, сообщающего сведения властям против кого-либо или чего-либо.
- source_word: τῶν χρημάτων
  choice: о деньгах
  rationale: Сохраняет широкое значение «деньги, денежные средства», не уточняя прямо, что речь идёт о храмовой казне.
- source_word: τῆς πατρίδος
  choice: об отечестве
  rationale: «Отечество» передаёт патриотическую окраску πατρίς и соответствует несколько возвышенному повествовательному регистру книги.
- source_word: ἐκακολόγει
  choice: продолжал клеветать
  rationale: Имперфект передаёт продолжающееся или повторявшееся действие, а «клеветать» — порочащий характер речи.
- source_word: ἐπισεσυκώς
  choice: подстрекнул
  rationale: Передаёт обвинение в том, что Ония якобы побудил Илиодора к действию.
- source_word: τῶν κακῶν δημιουργός
  choice: виновник бедствий
  rationale: Естественно выражает приписываемую Онию ответственность за пагубные события, не сводя κακά исключительно к нравственному злу.
- source_word: καθεστηκώς
  choice: стал
  rationale: 'Передаёт результативное значение: Ония якобы оказался или сделался виновником происходящего.'
theological_decisions:
- issue: Значение τῶν κακῶν
  choice: бедствий
  alternative: зла
  rationale: В контексте выражение может обозначать пагубные события и несчастья, а не только нравственное зло; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Продолженный характер обвинений передан словом «продолжал»; необычная связь доносительства с деньгами и отечеством сохранена без добавления отсутствующего в стихе уточнения о храмовой казне.
