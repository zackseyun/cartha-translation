  yaml_path: translation/deuterocanon/2_maccabees/004/028.yaml
  text: But when Sostratus[a], the commander of the citadel, pressed the claim—for the handling of the revenues belonged to him—for this reason the two men were summoned by the king.
translation:
  language: ru
  text: Когда Сострат, начальник крепости, требовал уплаты — ведь сбор доходов был поручен ему[a], — царь вызвал обоих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь распоряжение доходами входило в его полномочия». Греческое выражение может обозначать как сбор или ведение доходов, так и более широкую компетенцию в денежных делах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιουμένου ... τὴν ἀπαίτησιν
  choice: стал требовать уплаты
  rationale: Оборот обозначает активное предъявление требования; в финансовом контексте «требовать уплаты» естественно передаёт смысл, не уточняя сверх текста, о каком именно платеже шла речь.
- source_word: Σωστράτου
  choice: Сострат
  rationale: Традиционная русская передача греческого личного имени.
- source_word: τοῦ τῆς ἀκροπόλεως ἐπάρχου
  choice: начальник крепости
  rationale: Ἔπαρχος обозначает должностного руководителя, а ἀκρόπολις — укреплённую цитадель; «начальник крепости» сохраняет военно-административный характер должности и звучит естественно по-русски.
- source_word: πρὸς τοῦτον γὰρ ἦν ἡ τῶν διαφόρων πρᾶξις
  choice: ведь ведение денежных дел находилось в его ведении
  rationale: Фраза указывает на финансовую компетенцию Сострата. «Денежные дела» сохраняет некоторую широту διάφορα, а «ведение» передаёт административный смысл πρᾶξις.
- source_word: διʼ ἣν αἰτίαν
  choice: поэтому (выражено причинно-следственной связью всей фразы)
  rationale: 'Причинная связь естественно передана русской синтаксической конструкцией: именно из-за предъявленного требования царь вызывает обоих.'
- source_word: οἱ δύο
  choice: обоих
  rationale: Субстантивированное числительное отсылает к двум ранее названным лицам; «обоих» кратко и естественно передаёт эту анафору.
- source_word: ὑπὸ τοῦ βασιλέως προσεκλήθησαν
  choice: царь вызвал обоих
  rationale: Активная русская конструкция естественно передаёт греческий пассив, сохраняя царя как инициатора вызова.
