base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/039.yaml
  text: But when many acts of temple robbery had been committed in the city by Lysimachus[a], with the consent of Menelaus, and the report had spread outside, the crowd gathered against Lysimachus[b], since much gold had already been plundered.
translation:
  language: ru
  text: Когда Лисимах с согласия Менелая совершил в городе множество хищений храмового имущества[a] и весть об этом распространилась за пределы города[b], народ собрался против Лисимаха; к тому времени уже было расхищено много золотых ценностей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «множество святотатственных хищений»; греческое слово означает именно хищение священного или храмового имущества.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «молва об этом распространилась за пределы города». Греческое φήμη может означать «весть», «молва» или «слух».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱεροσυλημάτων
  choice: хищений из храма
  rationale: Слово обозначает не святотатство вообще, а хищение священного, храмового имущества; выражение ясно передаёт конкретный характер преступлений и форму множественного числа.
- source_word: μετὰ τῆς τοῦ Μενελάου γνώμης
  choice: с согласия Менелая
  rationale: γνώμη здесь указывает на одобрение или соучастное согласие Менелая, не приписывая ему непосредственного совершения хищений.
- source_word: διαδοθείσης ἔξω τῆς φήμης
  choice: весть об этом распространилась за его пределы
  rationale: φήμη допускает значения «весть», «молва», «слух»; нейтральное «весть» не ставит достоверность сообщения под сомнение. Местоимение «его» естественно соотносится с городом.
- source_word: ἐπισυνήχθη τὸ πλῆθος
  choice: народ собрался
  rationale: В контексте речь идёт о массовом собрании жителей; «народ» звучит естественно и достойно, передавая коллективное значение τὸ πλῆθος.
- source_word: ἐπὶ τὸν Λυσίμαχον
  choice: против Лисимаха
  rationale: ἐπί с винительным при глаголе собирания обозначает направленность к Лисимаху, а контекст возмущения придаёт ей враждебный характер.
- source_word: χρυσωμάτων
  choice: золотых ценностей
  rationale: Существительное означает золотые предметы или ценности, но не обязательно сосуды; выбранное выражение сохраняет конкретность без неоправданного уточнения.
- source_word: διηρπαγμένων
  choice: было разграблено
  rationale: Перфектное страдательное причастие описывает уже совершившееся разграбление с сохраняющимся результатом; «к тому времени уже» передаёт ἤδη и временную соотнесённость.
theological_decisions:
- issue: Характер преступления, обозначенного ἱεροσυλημάτων
  choice: Конкретные хищения храмового имущества
  alternative: Святотатства в широком смысле
  rationale: Лексическое значение указывает именно на святотатственное ограбление священного имущества. Перевод сохраняет религиозную тяжесть деяния, не расширяя его до любого вида нечестия.
translation_notes:
  register: Современный литературный русский язык; повествовательный стиль достоинственный и понятный. Синтаксис несколько упрощён по сравнению с длинным греческим генитивным оборотом, но причинно-временные связи и смысловая последовательность сохранены.
