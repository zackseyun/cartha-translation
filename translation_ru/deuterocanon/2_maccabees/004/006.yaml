  source_fidelity: 'Смысл в целом передан верно: начальное причастие связано с предшествующим контекстом, βασιλικὴ πρόνοια понята как практическая роль царя, а заключительное выражение передаёт, что Симон не прекратит своего неразумного поведения. Однако «восстановить мир» добавляет отсутствующую в греческом мысль о возвращении ранее существовавшего мира: τυχεῖν εἰρήνης означает «достичь/обрести мира».'
