  text: For he saw that without royal intervention it was impossible for affairs to attain peace[c][b][a], and that Simon would not stop his folly.
translation:
  language: ru
  text: Размышляя об этом, он понимал, что без царской поддержки невозможно достичь мира в делах[a] и что Симон не перестанет безрассудствовать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «без царской πρόνοια». Это слово может означать предвидение, заботу или попечение; здесь, вероятно, имеется в виду деятельная поддержка или участие царской власти.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Симон не получит передышки от своего безрассудства», то есть не перестанет поступать безрассудно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοπῶν. ἐώρα γὰρ
  choice: Размышляя об этом, он видел
  rationale: Сохраняет начальное причастие σκοπῶν и его тесную связь с предыдущим контекстом, а γάρ передаёт пояснительную связь без тяжеловесного отдельного «ибо».
- source_word: βασιλικῆς προνοίας
  choice: вмешательства царя
  rationale: В политическом контексте πρόνοια обозначает не просто предвидение, а деятельную заботу или участие царской власти; «вмешательство царя» естественно выражает этот практический смысл.
- source_word: τυχεῖν εἰρήνης ἐπὶ τὰ πράγματα
  choice: восстановить мир в делах
  rationale: τυγχάνω с родительным передаёт достижение результата, а τὰ πράγματα — сложившееся положение дел. «Восстановить мир» по-русски естественно описывает достижение спокойного состояния.
- source_word: παῦλαν οὐ λημψόμενον
  choice: не оставит
  rationale: Буквально выражение означает «не получит передышки/остановки»; в отношении поведения Симона идиоматическое «не оставит» ясно передаёт, что он не прекратит его.
- source_word: ἀνοίας
  choice: безрассудства
  rationale: ἄνοια означает неразумие, безрассудство или глупость. Выбор сохраняет нравственную оценку, не придавая слову клинического оттенка.
