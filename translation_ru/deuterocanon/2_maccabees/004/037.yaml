lexical_decisions:
- source_word: ψυχικῶς ὑπολυπηθείς
  choice: глубоко опечалившись в душе
  rationale: Передаёт внутренний характер и силу скорби, сохраняя явный корень ψυχ- без неестественной буквальности.
- source_word: τραπεὶς ἐπὶ ἔλεος
  choice: склонившись к состраданию
  rationale: Сохраняет образ перемены расположения — буквально поворота к жалости или милосердию — и естественно звучит по-русски.
- source_word: δακρύσας
  choice: прослезился
  rationale: Лаконично и естественно передаёт аористное причастие со значением пролитых слёз, не усиливая его до продолжительного рыдания.
- source_word: τοῦ μετηλλαχότος
  choice: умершего
  rationale: В данном контексте причастие эвфемистически обозначает человека, ушедшего из жизни; русское «умершего» ясно и сдержанно.
- source_word: σωφροσύνην
  choice: благоразумия
  rationale: Слово охватывает рассудительность, сдержанность и нравственное самообладание; «благоразумие» сохраняет эту широту лучше, чем более узкое «самообладание».
- source_word: πολλὴν εὐταξίαν
  choice: великой благопристойности
  rationale: εὐταξία может обозначать упорядоченность, дисциплину или достойное поведение; «благопристойность» передаёт нравственно-поведенческий оттенок, а «великой» отражает πολλήν.
