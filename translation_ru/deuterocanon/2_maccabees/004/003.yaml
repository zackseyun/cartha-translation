lexical_decisions:
- source_word: ἔχθρας
  choice: вражда
  rationale: Передаёт длительное враждебное противостояние и естественно звучит в контексте его обострения.
- source_word: ἐπὶ τοσοῦτον προβαινούσης
  choice: зашла так далеко
  rationale: Сохраняет образ нарастающего движения к крайней степени и естественна в современном русском языке.
- source_word: διὰ τινος
  choice: через одного
  rationale: Сохраняет неопределённость τινος и допускает посреднический оттенок διά, не сводя выражение однозначно к непосредственному исполнителю.
- source_word: τῶν ὑπὸ τοῦ Σίμωνος δεδοκιμασμένων
  choice: из людей, одобренных Симоном
  rationale: Причастие δεδοκιμασμένων обозначает тех, кто был испытан и признан пригодным; «одобренных» точно передаёт этот смысл без добавления отсутствующего в греческом обозначения должности.
- source_word: φόνους
  choice: убийства
  rationale: Сохраняет множественное число и передаёт φόνος как преступное лишение жизни, а не нейтральную гибель.
- source_word: συντελεῖσθαι
  choice: совершались
  rationale: Естественная русская сочетаемость с «убийства» передаёт осуществление действий и сохраняет пассивную конструкцию.
