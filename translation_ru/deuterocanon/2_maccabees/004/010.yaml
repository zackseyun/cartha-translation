  text: And when the king had given his approval, and he had gained control of the office, he immediately shifted his countrymen over to the Greek way of life.
translation:
  language: ru
  text: Когда царь дал согласие и Иасон получил эту должность, он сразу перевёл своих соплеменников на греческий лад.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к греческому облику» или «к греческому отпечатку»; имеется в виду усвоение греческих культурных норм и обычаев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπινεύσαντος
  choice: дал согласие
  rationale: Генитив абсолютный обозначает предшествующее согласие царя; «дал согласие» естественно передаёт официальное одобрение.
- source_word: ἀρχῆς κρατήσας
  choice: получил эту должность
  rationale: В данном контексте сочетание означает обретение искомого руководящего поста, а не власть вообще; указательное «эту» связывает его с контекстом.
- source_word: εὐθέως
  choice: сразу
  rationale: Передаёт незамедлительность последовавшего действия современным и ясным русским словом.
- source_word: τοὺς ὁμοφύλους
  choice: своих соплеменников
  rationale: Сохраняет этнический смысл — людей одного народа — не добавляя отсутствующее в самом выражении уточнение «иудеев».
- source_word: μετέστησε
  choice: стал приобщать
  rationale: Передаёт активное побуждение соотечественников перейти к иной культурной модели; русское выражение естественно сочетается с «образом жизни».
- source_word: τὸν Ἑλληνικὸν χαρακτῆρα
  choice: греческому образу жизни
  rationale: Буквально «греческий облик/отпечаток»; в контексте речь идёт о греческих культурных нормах и обычаях, а не о психологическом характере.
theological_decisions:
- issue: Передача культурно значимого выражения Ἑλληνικὸν χαρακτῆρα
  choice: греческому образу жизни
  alternative: греческому облику; греческим обычаям
  rationale: Выбранный вариант ясно передаёт программу эллинизации, не сводя её только к отдельным обычаям и не создавая ложного впечатления о душевном складе.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сохраняет последовательность греческого текста, но избегает тяжеловесной буквальности.
