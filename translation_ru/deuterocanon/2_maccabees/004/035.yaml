lexical_decisions:
- source_word: διʼ ἣν αἰτίαν
  choice: По этой причине
  rationale: Естественная современная передача причинной связки, сохраняющая её связь с предшествующим событием.
- source_word: οὐ μόνον ... δὲ καὶ
  choice: не только ... но и
