base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/043.yaml
  text: For this reason they wounded many of them[a], struck down some, and drove them all into flight; and they seized the temple-robber himself beside the treasury.
translation:
  language: ru
  text: По этой причине они многих из них ранили, некоторых повалили, а всех обратили в бегство; самого же грабителя святыни[a] схватили возле сокровищницы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святотатца». Греческое слово может обозначать человека, совершающего святотатство, особенно грабящего храм или святыню.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἣν αἰτίαν
  choice: По этой причине
  rationale: Естественно передаёт причинно-следственную связь с предшествующим повествованием.
- source_word: τραυματίας ἐποίησαν
  choice: ранили
  rationale: Греческое выражение буквально означает «сделали ранеными»; русский глагол точно и естественно передаёт физическое ранение.
- source_word: κατέβαλον
  choice: повалили
  rationale: Сохраняет основное значение «сбить, низвергнуть», не уточняя без достаточных оснований, были ли эти люди убиты.
- source_word: εἰς φυγὴν συνήλασαν
  choice: обратили в бегство
  rationale: Устойчивое русское выражение передаёт принуждение всех противников к бегству.
- source_word: τὸν ἱερόσυλον
  choice: грабителя святыни
  rationale: Передаёт конкретное посягательство на священное имущество и одновременно сохраняет религиозную тяжесть преступления; возможное более общее значение отмечено в сноске.
- source_word: ἐχειρώσαντο
  choice: схватили
  rationale: Средний залог здесь означает завладеть человеком, захватить его; «схватили» естественно и не привносит формально-правового оттенка ареста.
- source_word: παρὰ τὸ γαζοφυλάκιον
  choice: возле сокровищницы
  rationale: Точно передаёт пространственное значение παρά и обычное значение γαζοφυλάκιον без добавления невыраженных архитектурных подробностей.
theological_decisions:
- issue: Передача ἱερόσυλος в контексте посягательства на храмовое имущество
  choice: грабителя святыни
  alternative: святотатца
  rationale: Контекст указывает на конкретное хищение священного имущества, однако слово может шире обозначать человека, совершающего святотатство. Основной текст сохраняет конкретику, а сноска — смысловую широту.
translation_notes:
  register: 'Современный литературный русский язык; повествование краткое и энергичное. Сохранена неопределённость κατέβαλον: перевод не утверждает прямо, что поваленные были убиты. Маркер сноски поставлен непосредственно после выражения, к которому он относится.'
