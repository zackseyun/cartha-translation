  yaml_path: translation/deuterocanon/2_maccabees/004/030.yaml
  text: While these things were underway[a], it happened that the people of Tarsus and Mallus revolted, because they were being given as a gift to Antiochis, the king’s concubine.
translation:
  language: ru
  text: Пока всё это происходило, случилось, что жители Тарса и Малла подняли мятеж, потому что их отдавали в дар Антиохиде, наложнице царя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тарсян и маллотов». Греческий текст называет жителей этническими обозначениями; их пожалование может метонимически подразумевать передачу Антиохиде самих городов, власти над ними или доходов с них.'
    reason: Греческий текст не уточняет, в чём именно состояло пожалование, но грамматически его объектом названы жители городов.
lexical_decisions:
- source_word: δὲ συνεστηκότων
  choice: Пока всё это происходило
  rationale: Генитив абсолютный служит временным переходом от предыдущего повествования; естественная русская формулировка передаёт продолжающийся ход событий, не сводя оборот к буквальному «стояли» или «собрались».
- source_word: συνέβη
  choice: подняли
  rationale: Греческое συνέβη вводит наступившее событие в конструкции с инфинитивом; по-русски отдельное «случилось, что» утяжеляло бы фразу, поэтому событийное значение естественно выражено непосредственно сказуемым.
- source_word: Ταρσεῖς καὶ Μαλλῶτας
  choice: жители Тарса и Малла
  rationale: Греческие названия жителей переданы описательно, поскольку русские этнонимы «тарсяне» и «маллоты» мало знакомы современному читателю.
- source_word: στασιάζειν
  choice: подняли мятеж
  rationale: Глагол обозначает политический мятеж или выступление; выбранная формулировка ясно передаёт активное восстание без добавления идеи полномасштабной войны.
- source_word: διὰ τὸ
  choice: потому что
  rationale: Оборот прямо вводит причину мятежа; это наиболее естественный современный русский эквивалент.
- source_word: Ἀντιοχίδι
  choice: Антиохиде
  rationale: Собственное имя передано транслитерацией и поставлено в требуемом русском дательном падеже.
- source_word: παλλακῇ
  choice: наложнице
  rationale: Слово обозначает женщину, состоявшую с царём в признанной, но не равной браку связи; «наложница» исторически точнее современного «любовница».
- source_word: ἐν δωρεᾷ δίδοσθαι
  choice: их отдавали в дар
  rationale: Сохранены страдательное значение и смысл пожалования. Местоимение «их» удерживает греческую метонимию и не уточняет сверх текста, шла ли речь о городах, общинах или связанных с ними доходах.
