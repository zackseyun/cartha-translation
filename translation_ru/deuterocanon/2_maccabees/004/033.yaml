lexical_decisions:
- source_word: σαφῶς ἐπεγνωκὼς
  choice: ясно поняв
  rationale: Сочетание наречия с причастием передаёт не догадку, а ясное и определённое осознание; по-русски естественно выражается деепричастным оборотом.
- source_word: ἀπήνεγκεν ἀποκεχωρηκὼς
  choice: удалился
  rationale: В контексте оба глагольных элемента описывают уход Онии от опасности. Единый русский глагол сохраняет смысл, не создавая неестественного повторения движения.
- source_word: εἰς ἄσυλον τόπον
  choice: в место, пользовавшееся правом убежища
  rationale: ἄσυλος обозначает неприкосновенное место с правовым и сакральным статусом; выбранная формулировка точнее общего слова «убежище» и понятна современному читателю.
- source_word: ἐπὶ Δάφνης
  choice: в Дафне
  rationale: Оборот имеет здесь локативное значение и указывает, где находилось место убежища.
- source_word: τῆς πρὸς Ἀντιοχίας κειμένης
  choice: расположенной близ Антиохии
  rationale: Причастный оборот уточняет, о какой Дафне идёт речь, указывая её близость к Антиохии.
