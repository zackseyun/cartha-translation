base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/008.yaml
  text: Jason[a], the brother of Onias, undermined the high priesthood, promising the king through a petition three hundred sixty talents of silver[b], and eighty talents from some other revenue.
translation:
  language: ru
  text: 'Ясон, брат Онии, нечестным путём добился первосвященства: обратившись к царю с прошением[a], он пообещал ему триста шестьдесят талантов серебра[b] и ещё восемьдесят талантов из другого источника дохода.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через аудиенцию у царя»; греческое слово может означать как официальное прошение, так и личную аудиенцию.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «шестьдесят талантов сверх трёхсот», то есть всего триста шестьдесят талантов серебра.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπενόθευσεν
  choice: нечестным путём добился
  rationale: Глагол выражает не нейтральное получение должности, а достижение цели путём обмана или злоупотребления. Такой перевод естественен по-русски и сохраняет отрицательную нравственную оценку, не уточняя способ сверх сказанного в тексте.
- source_word: ἀρχιερωσύνην
  choice: первосвященства
  rationale: Слово обозначает сан и должность первосвященника; русский термин «первосвященство» кратко и точно передаёт это значение.
- source_word: ἐπαγγειλάμενος
  choice: пообещал
  rationale: 'Причастие указывает, посредством чего Ясон добился желаемого: он обязался выплатить царю названные суммы.'
- source_word: διʼ ἐντεύξεως
  choice: обратившись к царю с прошением
  rationale: ἔντευξις может обозначать официальное прошение, обращение или личную аудиенцию. В основном тексте выбран естественный для политического контекста вариант, а неоднозначность сохранена в сноске.
- source_word: ἀργυρίου
  choice: серебра
  rationale: Родительный падеж обозначает материал или денежное содержание суммы; «талантов серебра» — ясная и устоявшаяся формулировка.
- source_word: τάλαντα ἑξήκοντα πρὸς τοῖς τριακοσίοις
  choice: триста шестьдесят талантов
  rationale: Греческая конструкция буквально означает «шестьдесят талантов сверх трёхсот». В тексте сумма выражена естественно для современного русского языка, а буквальная структура пояснена в сноске.
- source_word: προσόδου τινὸς ἄλλης
  choice: из другого источника дохода
  rationale: πρόσοδος означает доход или поступление. Формулировка передаёт неопределённый дополнительный источник средств и звучит яснее, чем буквальное «из какого-то другого дохода».
- source_word: τάλαντα ὀγδοήκοντα
  choice: восемьдесят талантов
  rationale: Прямая передача указанной денежной суммы с сохранением древней единицы веса и стоимости.
theological_decisions:
- issue: Нравственная оценка действий Ясона по отношению к первосвященству
  choice: «нечестным путём добился первосвященства»
  alternative: «подорвал первосвященство»; «завладел первосвященством с помощью махинаций»
  rationale: Контекст представляет действия Ясона как корыстное и незаконное приобретение священной должности, а не как нейтральную смену первосвященника. Выбранный вариант сохраняет отрицательную оценку, не привнося конкретного обвинения, которого греческий текст прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным тоном. Двоеточие передаёт пояснительную связь между нечестным приобретением должности и обещанными выплатами; древняя мера «талант» сохранена.
