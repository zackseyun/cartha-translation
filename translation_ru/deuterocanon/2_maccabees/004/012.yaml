base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/012.yaml
  text: For he gladly established a gymnasium under the very citadel[a], and by bringing the noblest of our young men under the Greek cap, he was leading them on.
translation:
  language: ru
  text: Он охотно устроил гимнасий под самой цитаделью и, подчиняя петасу самых знатных среди нас[a], вёл их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Петас — греческая широкополая шляпа; здесь она служит видимым знаком эллинистической культуры.
    reason: Пояснение исторического реалия и его культурной функции.
lexical_decisions:
- source_word: ἡδέως
  choice: охотно
  rationale: Передаёт добровольность и явное рвение, не усиливая эмоциональную окраску до «с удовольствием».
- source_word: ὑπʼ αὐτὴν ἀκρόπολιν
  choice: у самой крепости
  rationale: ὑπό с винительным имеет здесь пространственное значение, а αὐτήν усиливает близость; по-русски «у самой крепости» естественно передаёт расположение непосредственно возле укрепления.
- source_word: γυμνάσιον
  choice: гимнасий
  rationale: Исторический термин обозначает эллинистическое учреждение для физического воспитания и общественной жизни, а не современный спортивный зал.
- source_word: καθίδρυσεν
  choice: устроил
  rationale: Передаёт основание и учреждение гимнасия естественным литературным русским выражением.
- source_word: τοὺς κρατίστους τῶν ἐφʼ ἡμῶν
  choice: самых знатных из нашей среды
  rationale: κρατίστους может означать лучших, наиболее видных или знатных; данная формулировка сохраняет социальный оттенок и не добавляет прямо не выраженного в предоставленном греческом тексте указания на юный возраст.
- source_word: ὑποτάσσων
  choice: подчиняя
  rationale: Сохраняет сильное значение подчинения или постановки под власть, а также образную связь с последующим ὑπό.
- source_word: ὑπὸ πέτασον
  choice: петасу
  rationale: Сохраняет конкретный греческий культурный символ, не заменяя его отвлечённым толкованием вроде «греческим обычаям»; значение поясняется в сноске.
- source_word: ἦγεν
  choice: увлекал их за собой
  rationale: Имперфект передаёт продолжавшееся действие; выражение показывает, что речь идёт не о разовом физическом сопровождении, а о вовлечении в новый уклад, при этом не уточняет конечную цель сверх текста.
theological_decisions:
- issue: Культурная ассимиляция в выражении ὑπὸ πέτασον
  choice: 'Сохранить конкретный образ петаса: «подчиняя… петасу».'
  alternative: «приобщая к греческим обычаям» или «заставляя вести греческий образ жизни»
  rationale: Исходный текст называет видимый культурный знак, а не формулирует отвлечённо весь процесс эллинизации. Буквенный образ сохраняет смысловую напряжённость, а сноска делает его понятным современному читателю.
- issue: Возраст лиц в τοὺς κρατίστους τῶν ἐφʼ ἡμῶν
  choice: Не вводить слово «юноши» в основной текст.
  alternative: «самых знатных из наших юношей»
  rationale: Контекст гимнасия допускает молодых участников, однако предоставленное чтение τῶν ἐφʼ ἡμῶν прямо не содержит существительного «юноши». Перевод сохраняет формальную неоднозначность исходного чтения.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Термин «гимнасий» выбран как исторически точный и отличимый от современного «гимназия» или «спортзал»; редкий термин «петас» пояснён сноской. Синтаксис сохраняет образ подчинения культурному знаку без конфессионального или доктринального истолкования.
