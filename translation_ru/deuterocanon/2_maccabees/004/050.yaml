  yaml_path: translation/deuterocanon/2_maccabees/004/050.yaml
  text: But Menelaus[a], because of the greed of those in power, remained in office, growing in wickedness and having become a great plotter against his fellow citizens.
translation:
  language: ru
  text: Но Менелай из-за алчности тех, кто был у власти[a], оставался на своём посту, всё больше погрязая во зле и став крупным интриганом против своих сограждан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «из-за алчности власть имущих».'
    reason: Лексическая альтернатива сохраняет более сжатую форму греческого выражения.
lexical_decisions:
- source_word: διὰ τὰς τῶν κρατούντων πλεονεξίας
  choice: из-за алчности тех, кто был у власти
  rationale: διά с винительным падежом имеет здесь причинное значение. «Алчность» передаёт πλεονεξία как ненасытное стремление к выгоде, а «те, кто был у власти» естественно выражает политический смысл κρατούντων.
- source_word: ἔμενεν ἐπὶ τῇ ἀρχῇ
  choice: оставался на своём посту
  rationale: ἀρχή в данном контексте означает занимаемую должность или положение у власти; «на своём посту» звучит естественно и не преувеличивает объём власти Менелая.
- source_word: ἐπιφυόμενος τῇ κακίᾳ
  choice: всё больше погрязая во зле
  rationale: Оборот передаёт продолжавшееся усиление нравственного зла. «Всё больше погрязая» сохраняет поступательный характер причастия и естественно звучит по-русски.
- source_word: μέγας τῶν πολιτῶν ἐπίβουλος καθεστώς
  choice: став опасным заговорщиком против своих сограждан
  rationale: ἐπίβουλος обозначает человека, строящего козни или замышляющего зло против других; родительный τῶν πολιτῶν указывает объект этих замыслов. «Сограждан» сохраняет гражданскую связь, μέγας передано контекстуальным усилением «опасным», а καθεστώς — результативным «став».
