base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/040.yaml
  text: But when the crowds were rising up and being filled with anger[a], Lysimachus armed about three thousand men and began unjust violence, with a certain Auranus taking the lead[c][b], a man advanced in age and no less in ignorance.
translation:
  language: ru
  text: Когда же толпы стали подниматься и исполняться гневом, Лисимах вооружил около трёх тысяч человек[a] и положил начало беззаконному насилию[b], причём предводителем был некий Авран — человек преклонных лет и не менее продвинувшийся в невежестве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «примерно три тысячи человек». Греческое выражение указывает на приблизительное число.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «начал неправедные руки» — греческий оборот, означающий начало неправомерных насильственных действий.'
    reason: idiom
  - marker: c
    text: 'В греческом тексте звучит ироническая параллель: Авран был преклонных лет и столь же далеко зашёл в невежестве.'
    reason: rhetorical_clarification
lexical_decisions:
- source_word: ἐπεγειρομένων
  choice: стали подниматься
  rationale: Передаёт начало волнения и переход толпы к действию, не уточняя, было ли оно вызвано извне.
- source_word: ὄχλων
  choice: толпы
  rationale: Нейтральное соответствие существительному; слово «чернь» или «мятежники» внесло бы отсутствующую в самом слове оценку.
- source_word: ταῖς ὀργαῖς διεμπιπλαμένων
  choice: исполняться гневом
  rationale: Сохраняет образ наполнения и сильное эмоциональное состояние; «гнев» уместен в современном литературном и библейском регистре.
- source_word: καθοπλίσας
  choice: вооружил
  rationale: Кратко и точно передаёт снабжение людей оружием.
- source_word: πρὸς τρισχιλίους
  choice: около трёх тысяч человек
  rationale: Предлог πρός при числительном выражает приблизительность; слово «человек» естественно восполняется по-русски.
- source_word: κατήρξατο χειρῶν ἀδίκων
  choice: положил начало беззаконному насилию
  rationale: Греческое выражение буквально говорит о «неправедных руках» и идиоматически обозначает начало насильственных, неправомерных действий.
- source_word: προηγησαμένου
  choice: во главе их встал
  rationale: Передаёт роль Аврана как предводителя вооружённых людей, естественно связывая оборот с предыдущей частью фразы.
- source_word: τινὸς Αὑρανοῦ
  choice: некий Авран
  rationale: «Некий» сохраняет функцию τινός, вводящего ранее не названного человека; имя передано традиционной русской транслитерацией.
- source_word: προβεβηκότος τὴν ἡλικίαν
  choice: преклонный годами
  rationale: Ясно и достойно передаёт преклонный возраст, сохраняя возможность последующей иронической параллели.
- source_word: οὐδὲν δὲ ἧττον καὶ τὴν ἄγνοιαν
  choice: не менее преуспевший в невежестве
  rationale: 'Сохраняет резкую ироническую параллель: Авран далеко продвинулся не только в годах, но и в невежестве.'
