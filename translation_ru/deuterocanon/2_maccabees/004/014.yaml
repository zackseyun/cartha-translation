base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/014.yaml
  text: so that the priests were no longer eager for the services of the altar[a], but, despising the temple and neglecting the sacrifices, they hurried to take part in the unlawful exercise in the wrestling school after the summons to the discus throw[b];
translation:
  language: ru
  text: так что священники уже не стремились исполнять служение при жертвеннике, но, презирая храм и пренебрегая жертвоприношениями, спешили принять участие в противозаконном устроении состязаний на палестре[a] после призыва к метанию диска[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение не вполне ясно; буквально речь идёт о «противозаконной хоре́гии». Слово может означать обеспечение, предоставляемые средства, содержание или покровительство, связанное с атлетическими занятиями. Палестра — место для борьбы и других атлетических упражнений.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «после призыва диска», то есть после сигнала, созывавшего участников на состязание в метании диска.'
    reason: cultural_note
lexical_decisions:
- source_word: λειτουργίας
  choice: служение
  rationale: В данном культовом контексте слово обозначает священническое служение при жертвеннике; этот вариант естественен по-русски и не сужает смысл до отдельного обряда.
- source_word: προθύμους
  choice: стремились
  rationale: Передаёт готовность и рвение священников, которые они перестали проявлять к своим обязанностям.
- source_word: νεὼ
  choice: храм
  rationale: В контексте речь идёт об Иерусалимском храме; это наиболее ясное и обычное русское соответствие.
- source_word: καταφρονοῦντες
  choice: презирая
  rationale: Сохраняет выраженную в греческом тексте мысль об активном презрении, а не просто о равнодушии.
- source_word: ἀμελοῦντες
  choice: пренебрегая
  rationale: Передаёт сознательное небрежение жертвоприношениями и хорошо сочетается с предшествующим «презирая».
- source_word: παλαίστρῃ
  choice: палестре
  rationale: Палестра — специально устроенное место для борьбы и других атлетических упражнений. Термин сохраняет конкретную реалия эллинистической культуры; смысл поясняется контекстом метания диска.
- source_word: παρανόμου χορηγίας
  choice: противозаконным обеспечением
  rationale: Сочетание трудно для точного истолкования. χορηγία может обозначать обеспечение, содержание, предоставляемые средства либо спонсорство; «обеспечение» сохраняет эту неоднозначность, а «противозаконным» передаёт отрицательную оценку παρανόμου без уточнения вида закона.
- source_word: ἔσπευδον μετέχειν
  choice: спешили воспользоваться
  rationale: μετέχειν может означать участие или получение доли; с неоднозначным χορηγία оборот «воспользоваться обеспечением» передаёт приобщение к предоставляемому благу и сохраняет выраженную глаголом ἔσπευδον поспешность.
- source_word: μετὰ τὴν τοῦ δίσκου πρόσκλησιν
  choice: после призыва к метанию диска
  rationale: Сохраняет временное значение μετά, значение πρόσκλησις как призыва и атлетическую реалию δίσκος.
theological_decisions:
- issue: Характер противозаконности παρανόμου в контексте эллинистических состязаний
  choice: противозаконным
  alternative: запрещённым Законом; нечестивым; беззаконным
  rationale: Контекст связывает осуждение с отступлением от отеческого Закона и обязанностей священников, однако само прилагательное шире. Выбранный вариант сохраняет авторскую оценку, не уточняя в основном тексте, идёт ли речь именно о Торе, нравственном запрете или ином нарушении.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. Синтаксис сохраняет нарастающее противопоставление греческой фразы. Термин «палестра» оставлен как точная культурная реалия; окружающий контекст делает его функцию понятной. Маркер [a] помещён при спорном выражении παρανόμου χορηγίας, а [b] — при упоминании призыва к метанию диска.
