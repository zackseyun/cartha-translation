  source_fidelity: 'Основная синтаксическая линия передана верно: следствие, утрата рвения к служению у жертвенника, презрение к храму, небрежение жертвами, поспешность и временное указание после призыва к диску. Однако «спешили воспользоваться ... обеспечением» смещает μετέχειν («принимать участие / иметь долю в») к извлечению практической выгоды и делает неясную χορηγία чрезмерно предметной. Сложное выражение παρανόμου χορηγίας следует передать столь же осторожно, не превращая его в «упражнение» или в конкретную материальную выгоду.'
  naturalness: «Палестра» допустима в современном литературном историческом повествовании, но нуждается в пояснении в сноске. Оборот «воспользоваться противозаконным обеспечением на палестре» по-русски неестественен и неясен по смысловым связям. «Принять участие в противозаконном устроении состязаний на палестре» читается естественнее, при этом «устроение состязаний» является осторожным контекстуальным способом передать χορηγία как обеспечение/организацию атлетической деятельности.
  terminology: «Служение при жертвеннике», «храм», «жертвоприношения», «противозаконный» и «палестра» уместны. «Противозаконный» не уточняет вид нарушаемого закона, как и греческое παρανόμου. Сноску к παρανόμου χορηγίας следует привязать непосредственно к этому выражению и сохранить его лексическую неопределённость.
