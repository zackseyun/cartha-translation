revisions:
- from: так что священники уже не стремились исполнять служение при жертвеннике, но, презирая храм и пренебрегая жертвоприношениями, спешили воспользоваться противозаконным обеспечением на палестре[a] после призыва к метанию диска[b].
  to: так что священники уже не стремились исполнять служение при жертвеннике, но, презирая храм и пренебрегая жертвоприношениями, спешили принять участие в противозаконном устроении состязаний на палестре[a] после призыва к метанию диска[b].
  rationale: Исправлен неестественный и смыслово сужающий оборот «воспользоваться ... обеспечением». Новый вариант сохраняет участие, выраженное μετέχειν, и передаёт χορηγία как не вполне определённое обеспечение или устроение атлетической деятельности; сноска прямо отмечает эту неопределённость. Маркеры сносок сохранены и стоят при соответствующих греческих выражениях.
