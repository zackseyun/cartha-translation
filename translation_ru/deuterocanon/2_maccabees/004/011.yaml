base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/011.yaml
  text: And he set aside the royal provisions laid down for the Jews through John[a], the father of Eupolemus—the one who had carried out the embassy to the Romans concerning friendship and alliance—and, while abolishing the lawful institutions[b], he introduced unlawful customs.
translation:
  language: ru
  text: Он отверг благоприятные для иудеев царские постановления[a], установленные через Иоанна, отца Евполема, который совершил посольство к римлянам ради дружбы и союза, и, упраздняя законные установления[b], вводил противозаконные обычаи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милостивые царские меры»; возможно также: «дарованные царём льготы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «законный общественный порядок» или «законное государственное устройство». Греческое слово может широко обозначать установившийся общественный и гражданско-правовой строй общины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ κείμενα ... φιλάνθρωπα βασιλικὰ
  choice: благоприятные для иудеев царские постановления
  rationale: Передаёт установленные и действовавшие царские меры, благосклонные к иудеям; «постановления» естественно для юридико-политического контекста, а «благоприятные» сохраняет силу φιλάνθρωπα без буквальной неестественности.
- source_word: παρώσας
  choice: отверг
  rationale: Глагол обозначает отстранение или оставление без действия прежних постановлений; «отверг» сохраняет активный смысл, не утверждая непременно формальной отмены.
- source_word: πρεσβείαν
  choice: посольство
  rationale: Речь идёт об официальной дипломатической миссии.
- source_word: φιλίας καὶ συμμαχίας
  choice: дружбы и союза
  rationale: Сохранены обычные дипломатические значения обоих терминов.
- source_word: νομίμους ... πολιτίας
  choice: законные установления
  rationale: В данном контексте πολιτεία указывает на установленный общественно-правовой порядок; широкий русский термин не сужает значение до формы правления или гражданства.
- source_word: καταλύων
  choice: упраздняя
  rationale: Передаёт активное устранение существующего законного порядка.
- source_word: παρανόμους ἔθισμους
  choice: противозаконные обычаи
  rationale: Сохраняет противопоставление законному порядку и обозначает практики, противные закону.
- source_word: ἐκαίνιζεν
  choice: вводил
  rationale: Имперфект передан несовершенным видом; глагол выражает введение новых обычаев.
theological_decisions:
- issue: Значение πολιτεία в иудейском правовом и общественном контексте
  choice: законные установления
  alternative: законный общественный порядок; законное государственное устройство
  rationale: Формулировка сохраняет широкий институциональный смысл и не навязывает более узкое современное понятие формы государственного правления.
- issue: Сила выражения φιλάνθρωπα βασιλικά
  choice: благоприятные для иудеев царские постановления
  alternative: милостивые царские меры; дарованные царём льготы
  rationale: Перевод сохраняет благосклонный характер царских мер, не уточняя без достаточного основания, были ли это именно льготы или привилегии.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-повествовательного стиля. Синтаксис следует греческой связи деепричастных оборотов, но остаётся понятным; несовершенный вид «упраздняя… вводил» сохраняет длительный характер действий.
