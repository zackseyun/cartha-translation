base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/004/016.yaml
  text: 'For this reason a harsh crisis surrounded them: those whose ways they envied and whom they wanted to imitate became their enemies and punishers[a][b].'
translation:
  language: ru
  text: 'По этой причине их охватило тяжёлое бедствие: те, чьему образу жизни они завидовали и кому хотели уподобиться, стали их врагами и карателями[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод начала стиха: «Из-за них их охватило тяжёлое бедствие»; греческий оборот может прямо указывать на только что упомянутых людей как на причину последующей беды.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чьим обычаям» либо «чьим нравам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν καὶ χάριν
  choice: За это
  rationale: Оборот χάριν с родительным выражает причину и здесь отсылает к упомянутым людям и подражанию им. «За это» естественно связывает бедствие с предшествующим поведением, сохраняя оттенок воздаяния; возможна и более персональная связь «из-за них».
- source_word: περιεῖχεν
  choice: постигло
  rationale: Буквально глагол означает «окружало, охватывало». В сочетании с περίστασις по-русски естественнее передать наступившее тяжёлое положение словом «постигло», хотя пространственный образ при этом несколько ослаблен.
- source_word: χαλεπὴ περίστασις
  choice: тяжёлое бедствие
  rationale: περίστασις обозначает стеснённое, бедственное положение, а χαλεπή подчёркивает его тяжесть. Формулировка понятна современному читателю и сохраняет отрицательную силу выражения.
- source_word: ἐζήλουν
  choice: завидовали
  rationale: ζηλόω может означать ревновать, завидовать или стремиться подражать. Контекст осуждаемого увлечения чужим образом жизни допускает отрицательно окрашенное «завидовали».
- source_word: τὰς ἀγωγὰς
  choice: образу жизни
  rationale: ἀγωγή здесь относится к укладу, поведению и обычаям. Единственное собирательное «образу жизни» звучит по-русски естественно и охватывает весь смысловой диапазон.
- source_word: καθʼ ἃ ἤθελον ἐξομοιοῦσθαι
  choice: кому хотели уподобиться
  rationale: ἐξομοιόομαι означает становиться подобным, уподобляться. Русская конструкция прямо и естественно передаёт стремление стать похожими на упомянутых людей.
- source_word: πολεμίους καὶ τιμωρητὰς ἔσχον
  choice: стали их врагами и карателями
  rationale: 'Буквально: «они имели [их] врагами и карающими». «Стали» ясно выражает итоговый поворот отношений, а «каратели» сохраняет значение тех, кто налагает наказание или возмездие.'
theological_decisions:
- issue: Нравственный смысл подражания чужому образу жизни и последующего воздаяния
  choice: 'Сохранена ирония воздаяния: те, кому иудеи стремились уподобиться, стали их врагами и карателями.'
  alternative: 'Нейтрально описать лишь перемену политических отношений: люди, которыми они восхищались, позднее выступили против них.'
  rationale: Слова ἐζήλουν и τιμωρητάς в контексте главы несут отрицательную нравственную оценку и представляют бедствие как следствие прежнего выбора. Перевод не уточняет сверх текста, было ли наказание непосредственно божественным.
translation_notes:
  register: Современный литературный русский язык, сдержанный и повествовательно-достоинственный. «Карателями» выбрано ради точной передачи τιμωρητάς, несмотря на более резкую современную окраску слова; оно сохраняет мотив наказания и воздаяния.
