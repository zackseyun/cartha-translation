  text: But he sent Apollonius[a], the chief polluter, with an army of twenty-two thousand, commanding him to slaughter all those in their prime and to sell the women and the younger ones.
translation:
  language: ru
  text: Но он послал Аполлония, главного осквернителя, с двадцатидвухтысячным войском, приказав ему перебить всех, кто был в расцвете сил, а женщин и тех, кто был моложе, продать[a].
  philosophy: optimal-equivalence
  footnotes:
