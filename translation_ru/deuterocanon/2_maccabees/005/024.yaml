lexical_decisions:
- source_word: ἔπεμψεν
  choice: послал
  rationale: Обычное значение аориста πέμπω; «послал» естественно и точно передаёт действие.
- source_word: μυσάρχην
  choice: главного осквернителя
  rationale: Редкое уничижительное слово связано с нечистотой и осквернением. Перевод сохраняет оскорбительный оттенок и не превращает его в нейтральное название должности.
- source_word: μετὰ στρατεύματος, δισμυρίους δὲ τοῖς δισχιλίοις
  choice: с двадцатидвухтысячным войском
  rationale: στράτευμα обозначает военную силу, а числовое выражение буквально складывает двадцать тысяч и две тысячи. Слитное определение естественно передаёт число без добавления отсутствующего в греческом слова «человек».
- source_word: προστάξας
  choice: приказав ему
  rationale: Причастие выражает приказ, отданный Аполлонию; местоимение ясно указывает исполнителя.
- source_word: τοὺς ἐν ἡλικίᾳ πάντας
  choice: всех, кто был в расцвете сил
  rationale: Оборот указывает на людей зрелого возраста или находящихся в жизненной и физической силе, не сводя значение к юридическому совершеннолетию.
- source_word: κατασφάξαι
  choice: перебить
  rationale: Усиленный глагол обозначает жестокое массовое убийство. «Перебить» передаёт массовость и силу выражения без излишне образного оттенка.
- source_word: τὰς δὲ γυναῖκας
  choice: а женщин
  rationale: В данном противопоставлении γυνή означает женщин как группу, а не только жён; союз «а» передаёт контраст.
- source_word: τοὺς νεωτέρους
  choice: тех, кто был моложе
  rationale: Сохранена сравнительная форма νεώτερος без неоправданного сужения значения до детей или юношей.
- source_word: πωλεῖν
  choice: продать
  rationale: Глагол буквально значит «продавать». Военный контекст подразумевает продажу в рабство, но это уточнение вынесено в сноску.
theological_decisions:
- issue: Следует ли прямо уточнить, что πωλεῖν означает продажу в рабство
  choice: продать
  alternative: продать в рабство
  rationale: Исторический контекст явно предполагает порабощение, однако в самом греческом тексте употреблено лишь «продать». Основной текст сохраняет формулировку источника, а подразумеваемый смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Сохранены уничижительность редкого слова μυσάρχης, жестокая сила κατασφάξαι и возрастная неопределённость сравнительного νεωτέρους; синтаксис сделан естественным для русского читателя.
