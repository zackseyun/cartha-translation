base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/008.yaml
  text: 'So he met the end of a miserable ruin: confined with Aretas[a], the ruler of the Arabs, fleeing from city to city, pursued by all, hated as an apostate from the laws and abhorred as the destroyer of his homeland and fellow citizens[b], he was driven into Egypt.'
translation:
  language: ru
  text: 'Так он и пришёл к плачевному концу: оказавшись в заточении у Ареты[a], правителя арабов, он бежал из города в город; все преследовали его, ненавидели как отступника от законов и гнушались им как губителем своей родины и сограждан; он был выброшен в Египет[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ареты, тирана арабов». Греческое слово может означать «тиран», но здесь, возможно, употреблено более нейтрально — «правитель».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий глагол выражает резкое, насильственное изгнание; буквально: «был выброшен в Египет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέρας οὖν κακῆς καταστροφῆς ἔτυχεν
  choice: Так он и пришёл к плачевному концу
  rationale: Оборот πέρας ... ἔτυχεν передан естественным русским выражением «пришёл к ... концу», а κακῆς καταστροφῆς — словом «плачевному», которое передаёт гибельный и жалкий итог без тяжеловесного буквального сочетания.
- source_word: ἐγκλεισθεὶς πρὸς Ἀρέταν
  choice: оказавшись в заточении у Ареты
  rationale: «В заточении» сохраняет значение заключённости или стеснённости, не уточняя форму заключения; «у Ареты» естественно передаёт неопределённое отношение πρός — в его владениях или власти, а не обязательно прямое действие Ареты.
- source_word: τὸν τῶν Ἀράβων τύραννον
  choice: правителя арабов
  rationale: В эллинистическом употреблении τύραννος мог обозначать властителя без обязательной отрицательной оценки; «правитель» не добавляет осуждения Ареты.
- source_word: πόλιν ἐκ πόλεως φεύγων
  choice: бежал из города в город
  rationale: Передано привычным русским распределительным оборотом, сохраняющим картину непрерывного бегства.
- source_word: διωκόμενος ὑπὸ πάντων
  choice: всеми преследуемый
  rationale: «Преследуемый» передаёт буквальную погоню без более узкого оттенка религиозного гонения.
- source_word: στυγούμενος ὡς τῶν νόμων ἀποστάτης
  choice: ненавидимый как отступник от законов
  rationale: «Отступник» сохраняет сильный религиозно-нравственный смысл ἀποστάτης и звучит естественнее русского заимствования «апостат»; множественное «законов» следует греческому тексту.
- source_word: βδελυσσόμενος ὡς πατρίδος καὶ πολιτῶν δήμιος
  choice: вызывавший отвращение как губитель своей родины и сограждан
  rationale: «Вызывавший отвращение» отражает усиленную эмоциональную окраску βδελυσσόμενος, а «губитель» передаёт расширенное значение δήμιος — не только палач по должности, но и тот, кто несёт гибель.
- source_word: εἰς Αἴγυπτον ἐξεβράσθη
  choice: его выбросило в Египет
  rationale: Безличный оборот естественен по-русски и сохраняет резкий образ ἐκβράζω — словно беглеца силой выбросило туда, — не вводя прямо не названного деятеля.
theological_decisions:
- issue: Нравственная характеристика Ареты в слове τύραννον
  choice: правителя
  alternative: тирана
  rationale: Слово допускает нейтральное обозначение властителя. Основное нравственное осуждение в стихе направлено на беглеца, поэтому перевод не приписывает Арете дополнительной отрицательной характеристики.
- issue: Сила выражения τῶν νόμων ἀποστάτης
  choice: отступник от законов
  alternative: тот, кто отвернулся от законов
  rationale: «Отступник» сохраняет серьёзность отказа от религиозно-правовой верности и не ослабляет обвинение описательным оборотом.
- issue: Образность ἐξεβράσθη
  choice: его выбросило в Египет
  alternative: он был изгнан в Египет
  rationale: Выбранный вариант сохраняет намеренно резкий образ насильственного исторжения, не определяя, был ли субъектом изгнания конкретный человек, группа или ход событий.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Причастные конструкции частично сохранены ради нарастающего перечня унижений, но основа предложения сделана естественной для русского чтения. Все примечания отмечены в основном тексте.
