base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/018.yaml
  text: But if we had not become involved in many sins[a], then, just as Heliodorus, who was sent by King Seleucus to inspect the treasury, was immediately scourged and turned back from his boldness when he came forward, so also would we have been struck down.
translation:
  language: ru
  text: Но если бы мы не были вовлечены во множество грехов[a], то этот человек, подобно Илиодору, которого царь Селевк послал осмотреть сокровищницу, был бы, приступив к этому, тотчас бичеван и лишён своей дерзости.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая форма συνέβην буквально имеет первое лицо единственного числа («я оказался»), тогда как по смыслу контекста речь идёт о согрешившем народе; поэтому в переводе употреблено собирательное «мы». Оборот можно также передать: «если бы не случилось нам погрязнуть во множестве грехов».'
    reason: Грамматическая трудность исходного текста и возможный лексический вариант.
  - marker: b
    text: 'Греческое οὗτος («этот [человек]») указывает на действующее лицо текущего повествования, тогда как Илиодор приведён как пример. Прошедшие формы в греческом сравнении переданы русским условным следствием: если бы народ не был вовлечён во множество грехов, этот человек был бы наказан так же, как Илиодор. Слово προαχθείς допускает оттенки «выступив», «продвинувшись» или «приступив к этому».'
    reason: Синтаксис условного сравнения, референт указательного местоимения и лексическая неоднозначность причастия.
lexical_decisions:
- source_word: συνέβην προενέχεσθαι
  choice: мы не оказались опутаны
  rationale: Сочетание передаёт наступившее состояние глубокой вовлечённости в грех. Русское «оказались опутаны» сохраняет как событийный оттенок συνέβην, так и средне-пассивный образ προενέχεσθαι, не превращая его в простое сознательное «предавались».
- source_word: πολλοῖς ἁμαρτήμασιν
  choice: множеством грехов
  rationale: Творительный падеж естественно сочетается с «опутаны» и передаёт множественность грехов без добавочного богословского истолкования.
- source_word: ἐπὶ τὴν ἐπίσκεψιν τοῦ γαζοφυλακίου
  choice: проверить сокровищницу
  rationale: Оборот выражает официальную цель поручения. «Проверить» звучит современно и передаёт смысл инспекции; «сокровищница» соответствует γαζοφυλάκιον, а храмовая принадлежность ясна из контекста книги.
- source_word: προαχθεὶς
  choice: едва выступив
  rationale: Причастие описывает выдвижение этого человека для осуществления замысла. «Едва» вместе с παραχρῆμα подчёркивает немедленность последовавшего отпора.
- source_word: παραχρῆμα μαστιγωθεὶς
  choice: тотчас был бы бичеван
  rationale: «Тотчас» точно передаёт немедленность, а «бичеван» сохраняет суровый и возвышенный регистр μαστιγόω.
- source_word: ἀνετράπη τοῦ θράσους
  choice: его дерзость была бы пресечена
  rationale: Греческий оборот говорит о сломе или обращении вспять дерзкого натиска. Русская формулировка естественно передаёт результат, не усиливая θράσος до более узкого «кощунства».
- source_word: οὗτος
  choice: этот человек
  rationale: Указательное местоимение мужского рода относится к действующему лицу повествования, а не к согрешившему народу; явное существительное помогает сохранить грамматическую связь в длинном русском предложении.
theological_decisions:
- issue: К кому относится наказание в условном сравнении
  choice: Наказание отнесено к «этому человеку» (οὗτος), то есть к действующему лицу повествования, по аналогии с Илиодором.
  alternative: 'Отнести подразумеваемое наказание к народу: «так и мы были бы поражены».'
  rationale: Мужское единственное οὗτος и согласованные с ним προαχθεὶς и μαστιγωθεὶς грамматически указывают на одного мужчину. Поэтому исходный греческий текст не поддерживает перенесение наказания на «нас», хотя такой вариант представлен в английском консультационном слое.
- issue: Форма условного следствия
  choice: Русское «был бы… была бы» явно выражает противоречащее фактам следствие.
  alternative: 'Формально воспроизвести греческие прошедшие формы без условной частицы: «был бичеван, и дерзость была пресечена».'
  rationale: 'Протасис с εἰ μή и общий смысл сравнения требуют нереального условия: если бы множество грехов не стало причиной попущения, с этим человеком произошло бы то же, что с Илиодором. Русская частица «бы» делает эту связь понятной, не добавляя отдельного события.'
- issue: Связь множества грехов с временным успехом захватчика
  choice: Сохранена причинно-условная связь без объяснения механизма Божьего суда или попущения.
  alternative: Прямо добавить, что Бог допустил нападение как наказание за грехи.
  rationale: Такое богословское понимание соответствует контексту, но в самом стихе субъект Божьего действия не назван. Перевод не должен превращать подразумеваемое в явное утверждение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской тональностью. «Бичеван» сохраняет торжественную суровость повествования, тогда как «проверить сокровищницу» избегает канцелярской тяжеловесности. Длинное сравнительное предложение сохранено, но его условная логика прояснена средствами русского синтаксиса.
