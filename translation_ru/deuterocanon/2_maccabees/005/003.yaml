lexical_decisions:
- source_word: μαχαιρῶν σπασμούς
  choice: выхватывание мечей
  rationale: σπασμός обозначает вытягивание или резкое извлечение; применительно к мечам выражение передаёт их выхватывание, не добавляя отсутствующего в греческом указания на блеск.
- source_word: ἴλας ἵππων διατεταγμένας
  choice: выстроенные конные отряды
  rationale: ἴλη — отряд, особенно конный, а διατεταγμένας указывает на упорядоченное построение. Метонимическое ἵππων естественно передано как «конные».
- source_word: προσβολὰς γινομένας
  choice: атаки
  rationale: В военном контексте προσβολή означает нападение или атаку; причастная конструкция γινομένας в данном перечислении не требует отдельного глагольного выражения по-русски.
- source_word: καταδρομὰς ἑκατέρων
  choice: стремительные набеги обеих сторон
  rationale: καταδρομή может обозначать стремительное нападение, налёт или набег. Этот перевод сохраняет взаимность ἑκατέρων, не уточняя действие как контратаку без однозначного основания.
- source_word: ἀσπίδων κινήσεις
  choice: движение щитов
  rationale: κίνησις имеет широкое значение движения; нейтральный перевод не уточняет его как потрясание или размахивание.
- source_word: καμάτων πλήθη
  choice: множество копий
  rationale: καμάτων — трудное чтение в данном военном перечне; по контексту оно, вероятно, обозначает древковое оружие или сходное боевое снаряжение. Конкретизация отмечена сноской.
- source_word: βελῶν βολάς
  choice: полёт метательных снарядов
  rationale: βέλος охватывает стрелы, дротики и иные метательные снаряды, а βολή — бросок или выстрел. Формулировка сохраняет широту исходного выражения.
- source_word: χρυσέων κόσμων ἐκλάμψεις
  choice: блеск золотых украшений
  rationale: κόσμος может означать украшение или убранство, а ἔκλαμψις — сияние или блеск; сочетание естественно передаётся как «блеск золотых украшений».
- source_word: παντοίους θωρακισμούς
  choice: всевозможные доспехи
  rationale: θωρακισμός обозначает защитное вооружение или облачение в броню, а παντοίους подчёркивает разнообразие.
