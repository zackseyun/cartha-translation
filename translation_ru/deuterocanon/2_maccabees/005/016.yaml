  text: and with his polluted hands taking the sacred vessels[b][a], and with profane hands dragging away the things that had been dedicated by many kings for the increase and glory and honor of the place.
translation:
  language: ru
  text: и осквернёнными руками брал священные сосуды, а скверными руками уволакивал всё, что многие цари воздвигли[a] для возвеличения, славы и чести этого места[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвятили». Греческое слово буквально может означать «поставили», «воздвигли»; здесь, вероятно, имеются в виду царские дары, поставленные и посвящённые в храме.'
    reason: lexical_alternative
  - marker: b
    text: «Это место» — почтительное обозначение храма.
    reason: cultural_note
lexical_decisions:
- source_word: μιαραῖς
  choice: осквернёнными
  rationale: Передаёт ритуальную и нравственную нечистоту рук в контексте поругания святыни.
- source_word: ἱερὰ σκεύη
  choice: священные сосуды
  rationale: Естественное русское обозначение храмовых принадлежностей с сохранением культового смысла.
- source_word: ἀνασταθέντα
  choice: воздвигли
  rationale: Сохраняет более буквальный образ поставленных в храме царских даров; возможный смысл посвящения пояснён в сноске.
- source_word: πρὸς αὔξησιν καὶ δόξαν τοῦ τόπου καὶ τιμήν
  choice: для возвеличения, славы и чести этого места
  rationale: Передаёт цель даров и сохраняет три однородных греческих существительных, не заменяя почтительное «место» прямым словом «храм».
- source_word: βεβήλοις
  choice: нечестивыми
  rationale: В данном контексте выражает противоположность святому и поддерживает контраст со «священными сосудами», не повторяя слово «осквернёнными».
- source_word: συνσύρων
  choice: уволакивал
  rationale: Передаёт насильственное и унизительное удаление даров точнее, чем нейтральное «уносил».
- source_word: τοῦ τόπου
  choice: этого места
  rationale: Сохраняет почтительное иносказательное обозначение храма в греческом тексте; референт пояснён в сноске.
theological_decisions:
- issue: Культовый контраст между святыней и оскверняющими её руками
  choice: 'Сохранить выраженный контраст: «осквернёнными руками», «священные сосуды», «нечестивыми руками»'
  alternative: 'Сгладить культовую лексику: «грязными/нечистыми руками», «храмовые предметы»'
  rationale: Греческий текст намеренно противопоставляет священные предметы ритуально и нравственно недостойным рукам; перевод не сводит святотатство к обычной краже.
- issue: Значение ἀνασταθέντα применительно к царским дарам
  choice: 'Основной текст: «воздвигли», с пояснением возможного смысла посвящения'
  alternative: «посвятили»
  rationale: Более буквальный вариант сохраняет образ поставленных даров и исходную неоднозначность, тогда как контекстуальный вотивный смысл сообщается в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Сохранён синтаксический параллелизм двух оборотов о руках, но греческие причастия переданы личными глаголами для естественности русского текста. Начальная строчная буква и союз «и» отражают продолжение предложения из предыдущего стиха.
