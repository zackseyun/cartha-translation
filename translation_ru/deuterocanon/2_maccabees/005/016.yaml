  source_fidelity: 'Передача синтаксического параллелизма и основных образов в целом точна: μιαραῖς χερσίν — «осквернёнными руками», ἱερὰ σκεύη — «священные сосуды», а συνσύρων — «уволакивал». «Воздвигли» допустимо для ἀνασταθέντα и, благодаря сноске, не скрывает вероятного вотивного смысла. Однако «нечестивыми руками» для βεβήλοις несколько смещает значение к моральной нечестивости, тогда как в данном противопоставлении требуется именно культовое «скверными/профанными».'
