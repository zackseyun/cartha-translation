base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/006.yaml
  text: But Jason kept carrying out merciless slaughter of his own fellow citizens[a], not understanding that prosperity against kinsmen is the greatest calamity[b], and thinking that he was winning trophies over enemies and not over his own countrymen.
translation:
  language: ru
  text: Иасон же без пощады устраивал резню среди своих сограждан[a], не понимая, что успех в противостоянии родичам — величайшее несчастье[b], и полагая, будто воздвигает победные трофеи над врагами, а не над своими соотечественниками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «без пощады совершал избиения своих сограждан».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не понимая, что благополучие против родичей есть величайшее неблагополучие»; то есть кажущийся успех, достигнутый над своими, на деле оборачивается бедствием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σφαγὰς ... ἀφειδῶς
  choice: без пощады истреблял
  rationale: Сочетание передаёт жестокость σφαγαί и наречие ἀφειδῶς («не щадя»), сохраняя сильнее значение, чем нейтральное «убивал», и оставаясь естественным по-русски.
- source_word: τῆς πόλεως τῶν ἰδίων
  choice: своих сограждан
  rationale: Оборот указывает на людей того же города, принадлежавших к числу «своих» Иасона; «сограждан» естественно объединяет гражданскую общность и рефлексивный оттенок.
- source_word: οὐ συννοῶν
  choice: не понимая
  rationale: Причастие выражает неспособность осмыслить или осознать нравственный смысл происходящего.
- source_word: εὐημερίαν ... δυσημερίαν
  choice: успех ... несчастье
  rationale: 'Контраст передан близкими по смыслу, но естественными для военного контекста словами: кажущийся успех на деле является величайшим бедствием для самого победителя и его народа.'
- source_word: συγγενεῖς
  choice: родичами
  rationale: Слово сохраняет семейно-этнический оттенок общей крови и отличается от последующего ὁμοεθνῶν.
- source_word: τρόπαια καταβάλλεσθαι
  choice: воздвигает победные трофеи
  rationale: Передан древний военный образ трофея как памятника победе; формулировка понятна современному читателю и не сводит образ к отвлечённому «побеждает».
- source_word: ὁμοεθνῶν
  choice: своими соотечественниками
  rationale: Термин подчёркивает принадлежность к одному народу, отличаясь от более родственного συγγενεῖς.
theological_decisions:
- issue: Нравственная оценка победы над своими
  choice: 'Сохранить авторский парадокс: успех против родичей является величайшим несчастьем'
  alternative: Передать буквально как «благополучие по отношению к родичам есть величайшее неблагополучие»
  rationale: Греческий текст сам даёт нравственную оценку и противопоставляет кажущийся успех подлинному бедствию; выбранная формулировка раскрывает контекст, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. «Истреблял», «родичи» и «победные трофеи» сохраняют жестокость, этническое родство и военный образ оригинала без архаической тяжеловесности.
