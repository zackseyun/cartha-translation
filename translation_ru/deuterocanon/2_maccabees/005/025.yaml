base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/025.yaml
  text: But when this man arrived in Jerusalem and pretended to be peaceable[a], he held back until the holy day of the Sabbath; and taking the Jews off guard, he ordered those under his command to arm themselves.
translation:
  language: ru
  text: Когда же этот человек прибыл в Иерусалим, он, притворившись миролюбивым, выжидал до святого дня субботы. Застав иудеев за соблюдением субботы[a], он приказал своим подчинённым вооружиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий оборот сжат: буквально, «застав иудеев соблюдающими [субботу]». Глагол может обозначать соблюдение или празднование дня; возможен также оттенок: «застав иудеев врасплох».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: прибыл
  rationale: Причастие обозначает прибытие в Иерусалим; «прибыл» естественно для повествования и точно передаёт движение к месту.
- source_word: τὸν εἰρηνικὸν ὑποκριθεὶς
  choice: притворился миролюбивым
  rationale: ὑποκρίνομαι указывает на разыгрывание роли или притворство, а εἰρηνικός — на мирный, миролюбивый облик; перевод сохраняет намеренную обманчивость поведения.
- source_word: ἐπέσχεν
  choice: выжидал
  rationale: В данном контексте глагол означает, что он намеренно удерживался от действий до удобного времени; «выжидал» передаёт тактическую задержку.
- source_word: ἕως τῆς ἁγίας ἡμέρας τοῦ σαββάτου
  choice: до святого дня субботы
  rationale: Перевод прямо сохраняет определение ἁγίας и название дня σαββάτου, не добавляя конфессионального толкования.
- source_word: λαβὼν ἄγοντας τοὺς Ἰουδαίους
  choice: улучив время, когда иудеи соблюдали субботу
  rationale: 'Оборот с опущенным объектом при ἄγω сжат: по контексту иудеи проводят или соблюдают упомянутый субботний день. Формулировка по-русски естественно передаёт, что их застали именно во время соблюдения субботы, не сводя смысл исключительно к внезапности нападения.'
- source_word: τοῖς ὑφʼ ἑαυτὸν
  choice: своим подчинённым
  rationale: Оборот обозначает людей, находившихся под его властью; в военном контексте «подчинённые» ясно выражает эти отношения.
- source_word: ἐξοπλίαν παρήγγειλεν
  choice: приказал … вооружиться
  rationale: παρήγγειλεν выражает приказ, а ἐξοπλία — вооружение или полное боевое снаряжение; русский оборот краток и естественен.
theological_decisions:
- issue: Характеристика субботы
  choice: святой день субботы
  alternative: святая суббота
  rationale: В греческом тексте день субботы прямо назван святым. Это характеристика самого источника, поэтому она сохранена без расширительного богословского комментария.
- issue: Состояние иудеев в момент приказа
  choice: когда иудеи соблюдали субботу
  alternative: застав иудеев врасплох
  rationale: Сжатый греческий оборот допускает акцент на том, что иудеи были застигнуты во время празднования или соблюдения дня, а контекст может подразумевать их уязвимость. Основной текст сохраняет связь с соблюдением субботы, а возможный оттенок внезапности отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис разделён на два предложения ради ясности; обманчивое миролюбие и тактическое выжидание переданы без усиления мотивов сверх греческого текста.
