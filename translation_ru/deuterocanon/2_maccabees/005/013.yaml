  text: There was a killing of young and old, a destruction of men and women and children, and slaughters of virgins and infants.
translation:
  language: ru
  text: И шло избиение молодых и старых[a], истребление мужчин, женщин и детей, резня девиц[b] и младенцев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «юношей и старейшин», если понимать обозначения возраста более узко; однако контекст скорее указывает на общий контраст между молодыми и старыми.'
    reason: lexical_alternative
  - marker: b
    text: Слово «девицы» здесь обозначает незамужних молодых женщин, сохранявших девственность; возможный, но менее точный перевод — «молодые женщины».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγίνετο
  choice: шло
  rationale: Имперфект передаёт продолжавшееся действие; конструкция «шло избиение» естественно вводит развернувшуюся резню и сохраняет повествовательный характер греческого выражения.
- source_word: νέων
  choice: молодых
  rationale: В паре с πρεσβυτέρων обозначает прежде всего общий возрастной контраст, а не исключительно молодых мужчин.
- source_word: πρεσβυτέρων
  choice: старых
  rationale: Контекст указывает на возраст, а не на должность старейшин; «старых» образует ясную параллель с «молодых».
- source_word: ἀναίρεσις
  choice: избиение
  rationale: Слово обозначает насильственное лишение жизни; «избиение» в данном контексте передаёт массовое убийство и соответствует высокому трагическому регистру.
- source_word: ἀφανισμός
  choice: истребление
  rationale: Передаёт уничтожение людей, а не разрушение вещей, и сохраняет усиленную степень насилия в перечислении.
- source_word: παρθένων
  choice: девиц
  rationale: «Девиц» обозначает незамужних молодых женщин и сохраняет смысловой акцент на девственном статусе, не прибегая к клинически звучащему в этом контексте слову «девственниц».
- source_word: νηπίων
  choice: младенцев
  rationale: Точно передаёт обозначение самых малых детей, особенно ещё не умеющих говорить.
- source_word: σφαγαί
  choice: резня
  rationale: Сильное слово, обозначающее массовое заклание или бойню; оно сохраняет риторическое усиление в заключительной части стиха.
