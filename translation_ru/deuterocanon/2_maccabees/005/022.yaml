  yaml_path: translation/deuterocanon/2_maccabees/005/022.yaml
  text: 'He also left overseers to mistreat the nation: in Jerusalem[a], Philip, a Phrygian by birth, but in character more barbarous than the one who appointed him[b];'
translation:
  language: ru
  text: 'Он также оставил надзирателей, чтобы притеснять народ[a]: в Иерусалиме — Филиппа, фригийца по происхождению, но по нраву более варварского, чем тот, кто его назначил[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы причинять зло народу». Греческий глагол κακοῦν может означать «вредить», «дурно обращаться», «притеснять».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «более варварского, чем тот, кто его поставил». Так автор усиливает нравственное осуждение Филиппа, изображая его ещё более жестоким, чем назначившего его правителя.'
    reason: cultural_note
lexical_decisions:
- source_word: κατέλειπεν
  choice: оставил
  rationale: Глагол означает «оставить» или «оставить на месте». Перевод сохраняет греческий образ и в данном контексте естественно подразумевает, что должностные лица были поставлены на местах.
- source_word: ἐπιστάτας
  choice: надзирателей
  rationale: Слово обозначает людей, поставленных над другими. «Надзиратели» передаёт делегированную власть, не приписывая им более узкой официальной должности.
- source_word: τοῦ κακοῦν
  choice: чтобы притеснять
  rationale: Артиклевый инфинитив выражает цель или назначение. «Притеснять» передаёт длительное злонамеренное обращение, оставляя в сноске более широкие значения «вредить» и «обижать».
- source_word: τὸ γένος
  choice: народ
  rationale: Здесь имеется в виду еврейский народ как единое этническое и общественное целое. «Народ» звучит естественно и не несёт современных биологических ассоциаций слова «раса».
- source_word: τὸ μὲν γένος Φρύγα
  choice: фригийца по происхождению
  rationale: Оборот указывает на этническое или географическое происхождение Филиппа; такая формулировка естественна в современном русском языке.
- source_word: τὸν δὲ τρόπον
  choice: по нраву
  rationale: τρόπος здесь означает нрав, склад характера или образ поведения и противопоставлен происхождению.
- source_word: βαρβαρώτερον ἔχοντα
  choice: более жестокого
  rationale: В контексте сравнительная форма выражает нравственную оценку — бесчеловечность и суровость. «Более жестокого» понятно современному читателю; буквальная риторика отмечена в сноске.
- source_word: τοῦ καταστήσαντος
  choice: чем тот, кто его назначил
  rationale: Причастие указывает на правителя, поставившего Филиппа на эту должность. Формулировка ясно передаёт личное сравнение.
