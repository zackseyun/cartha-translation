base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/017.yaml
  text: And Antiochus became arrogant in mind[a], not perceiving that the Master had been angered for a little while because of the sins of those dwelling in the city[c][b]; therefore there came to be disregard for the place.
translation:
  language: ru
  text: Антиох возгордился в своих помыслах[a], не понимая, что Владыка на короткое время разгневался из-за грехов жителей города; поэтому место было оставлено без внимания[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вознёсся в мыслях»; «стал надменен в своих мыслях». Греческий глагол буквально связан с вознесением ввысь, а здесь обозначает горделивое самовозвышение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поэтому по отношению к месту произошло оставление без внимания». Возможны также: «пренебрежение», «небрежение», «упущение». В контексте это, вероятно, относится к временной незащищённости святилища и допущению его осквернения.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμετεωρίζετο τὴν διάνοιαν
  choice: вознёсся в своих мыслях
  rationale: Греческое выражение буквально связано с вознесением ввысь и здесь передаёт надменное самовозвышение Антиоха; русский оборот сохраняет образ и указание на внутренний настрой.
- source_word: οὐ συνορῶν
  choice: не понимая
  rationale: Причастие означает неспособность увидеть и осмыслить подлинную причину происходящего; «не понимая» естественно передаёт когнитивный смысл.
- source_word: ἀπώργισται βραχέως
  choice: ненадолго разгневался
  rationale: Перфект описывает наступившее состояние гнева, а βραχέως ограничивает его продолжительность. Формулировка ясно сохраняет временный характер гнева.
- source_word: ὁ δεσπότης
  choice: Владыка
  rationale: δεσπότης обозначает властелина, обладающего полной властью, и отличается от κύριος. «Владыка» является естественным и возвышенным русским божественным титулом, не стирающим эту лексическую особенность.
- source_word: τῶν τὴν πόλιν οἰκούντων
  choice: жителей города
  rationale: Компактный и естественный русский эквивалент причастного оборота «тех, кто населяет город».
- source_word: πάρορασις
  choice: осталось без Его попечения
  rationale: Редкое существительное означает оставление без внимания, пренебрежение или неприсмотр. В контексте речь идёт о временной незащищённости священного места; добавленное местоимение делает русскую фразу связной, не утверждая окончательного оставления.
- source_word: περὶ τὸν τόπον
  choice: святое место
  rationale: Буквально «место» в контексте обозначает храм или храмовую территорию. «Святое место» проясняет референт, не сужая его до конкретного здания.
theological_decisions:
- issue: Передача божественного титула δεσπότης
  choice: Владыка
  alternative: Господь; Повелитель
  rationale: «Владыка» сохраняет отличие δεσπότης от κύριος и выражает полновластие без привнесения дополнительной конфессиональной интерпретации.
- issue: Причина временной незащищённости священного места
  choice: святое место осталось без Его попечения
  alternative: возникло пренебрежение к этому месту; место было оставлено без внимания
  rationale: Текст связывает осквернение места с кратковременным Божьим гневом, но не объясняет точного механизма. Перевод сохраняет временное отступление защиты и не представляет его как бессилие или окончательное оставление.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис упрощён без устранения причинно-следственной связи и богословского напряжения. Все сноски отмечены в основном тексте.
