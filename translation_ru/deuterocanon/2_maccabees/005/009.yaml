base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/009.yaml
  text: He who had made many exiles from their homeland perished in a foreign land[b][a], having gone up to the Lacedaemonians as though he would obtain protection because of the kinship.
translation:
  language: ru
  text: А тот, кто многих изгнал из родной земли, погиб на чужбине, будучи приведён к лакедемонянам[a] в надежде получить защиту благодаря родству[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к спартанцам». «Лакедемоняне» — более буквальная передача греческого этнического названия.'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, имеется в виду традиционное представление о родстве иудеев и спартанцев; ср. 1 Маккавейская 12:6–23.
    reason: cross_reference
lexical_decisions:
- source_word: συχνοὺς
  choice: многих
  rationale: Субстантивированное прилагательное обозначает множество людей; в русском «многих» естественно подразумевает лиц без добавления отсутствующего в греческом слова «мужчин».
- source_word: τῆς πατρίδος
  choice: из родной земли
  rationale: πατρίς означает родину, родную страну; сочетание сохраняет эмоциональный контраст с последующей «чужбиной».
- source_word: ἀποξενώσας
  choice: изгнал
  rationale: В сочетании с τῆς πατρίδος глагол выражает причинение отчуждения от родины, то есть изгнание. «Изгнал» ясно и естественно передаёт смысл контекста.
- source_word: ἐπὶ ξένης
  choice: на чужбине
  rationale: Краткое литературное выражение передаёт смерть в чужой земле и сохраняет смысловой контраст с родной землёй.
- source_word: ἀπώλετο
  choice: погиб
  rationale: Средний аорист ἀπόλλυμι здесь означает гибель; «погиб» сохраняет более весомый повествовательный оттенок, чем нейтральное «умер».
- source_word: πρὸς Λακεδαιμονίους
  choice: к лакедемонянам
  rationale: Буквально передаёт греческое этническое название; более знакомое «к спартанцам» дано в сноске.
- source_word: ἀναχθεὶς
  choice: отправившись
  rationale: Причастие допускает значения отправления, движения или отплытия. Контекст не требует идеи насильственного увода, поэтому выбрано нейтральное русское выражение, сохраняющее направленное движение.
- source_word: ὡς ... τευξόμενος σκέπης
  choice: в надежде получить защиту
  rationale: Конструкция передаёт ожидание или предполагаемую цель субъекта. Русская формулировка естественно выражает надежду на убежище или покровительство без утверждения, что защита была получена.
- source_word: διὰ τὴν συγγένειαν
  choice: благодаря родству
  rationale: συγγένεια означает родство или связь общим происхождением. Формулировка сохраняет определённость известного читателям предания, не называя родство мнимым или доказанным.
theological_decisions:
- issue: Исторический намёк в συγγένεια
  choice: «благодаря родству» без поясняющего определения в основном тексте
  alternative: «благодаря их предполагаемому родству»
  rationale: Греческий текст представляет родство как известное, не оценивая достоверность притязания. Уточнение о традиционной связи иудеев со спартанцами вынесено в сноску, чтобы не разрешать историческую неоднозначность в основном тексте.
- issue: Оттенок ὡς при будущем причастии
  choice: «в надежде получить»
  alternative: «будто бы получит»
  rationale: ὡς с будущим причастием может выражать субъективное намерение или ожидание. «В надежде» передаёт перспективу действующего лица и не вводит излишне резкого авторского сомнения.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Контраст «родная земля — чужбина» сохранён; синтаксис сделан естественным для широкого читателя. Все сноски отмечены в основном тексте в месте соответствующих выражений.
