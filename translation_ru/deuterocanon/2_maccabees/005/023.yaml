base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/023.yaml
  text: and in Gerizim[a], Andronicus; and besides these, Menelaus surpassed the others in wickedness toward the citizens[b], having a hateful disposition toward the Jewish citizens.
translation:
  language: ru
  text: а на Гаризиме[a] — Андроника. Вдобавок к ним Менелай превзошёл остальных в злодеяниях против граждан[b], питая враждебный настрой по отношению к гражданам-иудеям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Гаризиме». Предлог при названии места допускает передачу «в» или «на».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «был хуже остальных» или «превосходил остальных в самом дурном».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δὲ Γαριζεὶν
  choice: а на Гаризиме
  rationale: Предлог ἐν при названии горы или местности естественно передаётся по-русски как «на»; оборот продолжает перечень назначенных правителей.
- source_word: Ἀνδρόνικον
  choice: Андроника
  rationale: Имя передано традиционной русской транслитерацией; винительный падеж сохранён, поскольку фраза синтаксически продолжает предыдущее назначение должностных лиц.
- source_word: πρὸς δὲ τούτοις
  choice: Вдобавок к ним
  rationale: Передаёт присоединительное значение оборота и вводит Менелая наряду с уже названными лицами.
- source_word: Μενέλαον
  choice: Менелай
  rationale: Использована традиционная русская форма имени; в новой фразе имя выступает подлежащим ради естественного русского синтаксиса.
- source_word: χείριστα τῶν ἄλλων ὑπερήρτετο
  choice: превзошёл остальных в злодеяниях
  rationale: Сохраняет сравнительную силу глагола и резко отрицательную оценку χείριστα, не сводя выражение просто к характеристике «был хуже».
- source_word: τοῖς πολίταις
  choice: против граждан
  rationale: Дательный обозначает тех, на кого были направлены злодеяния; «граждан» сохраняет общественно-гражданский оттенок πολίταις.
- source_word: ἀπεχθῆ ... διάθεσιν
  choice: питая ненависть
  rationale: Естественный русский оборот передаёт устойчивую внутреннюю враждебность, выраженную сочетанием ἀπεχθῆ διάθεσιν.
- source_word: πρὸς τοὺς πολίτας Ἰουδαίους
  choice: к гражданам-иудеям
  rationale: 'Сохранены оба элемента греческого выражения: гражданский статус и иудейская принадлежность; дефисное сочетание читается естественнее буквального «иудейские граждане».'
theological_decisions:
- issue: Сохранять ли πολίταις / πολίτας как «граждане» или обобщить до «народ», «люди» либо «соотечественники»
  choice: В обоих случаях сохранено «граждане».
  alternative: «народ», «люди», «соотечественники»
  rationale: Повтор πολίτης подчёркивает не только этническую принадлежность, но и принадлежность к гражданскому сообществу; обобщение устранило бы этот общественно-политический оттенок.
- issue: Степень резкости выражения χείριστα τῶν ἄλλων ὑπερήρτετο
  choice: «превзошёл остальных в злодеяниях»
  alternative: «был хуже остальных»; «превзошёл остальных, творя зло»
  rationale: Выбранная формулировка сохраняет одновременно сравнительный смысл ὑπερήρτετο и нравственное осуждение χείριστα, не усиливая текст сверх греческого.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Тире после названия места обозначает пропущенный глагол из предшествующего контекста. Повтор слова «граждане» намеренно сохранён вслед за греческим текстом; «граждане-иудеи» удерживает одновременно гражданскую и этнорелигиозную характеристику.
