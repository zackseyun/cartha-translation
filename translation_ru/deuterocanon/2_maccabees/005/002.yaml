lexical_decisions:
- source_word: συνέβη
  choice: являлись
  rationale: Безличная событийная конструкция передана естественным русским повествованием; значение наступившего явления выражено всей фразой.
- source_word: καθʼ ὅλην τὴν πόλιν σχεδὸν
  choice: почти по всему городу
  rationale: Сохраняет распределительное значение κατά и ограничение σχεδόν.
- source_word: ἐφʼ ἡμέρας τεσσεράκοντα
  choice: в течение сорока дней
  rationale: Естественно передаёт длительность явления.
- source_word: φαίνεσθαι
  choice: являлись
  rationale: Передаёт видимость или появление феномена, не решая, был ли он только видением или объективным присутствием.
- source_word: διὰ τῶν ἀέρων
  choice: по воздуху
  rationale: Естественная русская передача идиоматического греческого множественного числа.
- source_word: τρέχοντας ἱππεῖς
  choice: мчавшиеся всадники
  rationale: «Мчавшиеся» естественно описывает быстрое движение конных всадников и не добавляет значения атаки.
- source_word: διαχρύσους στολὰς ἔχοντας
  choice: в златотканых одеждах
  rationale: διαχρύσους указывает на обильное присутствие золота; «златотканых» сохраняет яркий образ и звучит литературно, не утверждая, что одежда состояла из цельного золота.
- source_word: λόγχας
  choice: копьями
  rationale: λόγχη обозначает копьё или пику; «копьё» понятно современному читателю и уместно в воинском контексте.
- source_word: σπειρηδὸν
  choice: выстроенные в боевые отряды
  rationale: Наречие указывает на организованное расположение по воинским подразделениям; перевод сохраняет строевой смысл, не вводя чрезмерно точного названия подразделения.
- source_word: ἐξωπλισμένους
  choice: вооружённые
  rationale: Кратко и точно передаёт состояние оснащённости оружием.
theological_decisions:
- issue: Статус воздушного явления
  choice: являлись
  alternative: были видны
  rationale: Греческое φαίνεσθαι допускает акцент как на появлении, так и на видимости; выбранный вариант сохраняет эту напряжённость и не объявляет явление ни иллюзией, ни бесспорно материальным событием.
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Причастные обороты сохраняют плотную структуру греческой фразы; архаическое «златотканых» употреблено как понятное поэтическое определение яркого сверхъестественного образа.
