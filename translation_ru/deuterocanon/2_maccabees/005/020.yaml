base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/020.yaml
  text: Therefore even the place itself[a], after sharing in the nation's misfortunes, later also shared in its benefits; and though it had been overtaken in the wrath of the Almighty, it was restored again in the reconciliation of the great Master[b], with all glory.
translation:
  language: ru
  text: Поэтому и само место, разделив с народом его бедствия[a], позднее также приобщилось к благодеяниям; оказавшись под гневом Вседержителя, оно при примирении великого Владыки[b] вновь было восстановлено во всей славе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несчастья». Греческое слово обозначает тяжёлые испытания и беды, пережитые вместе с народом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «великого Повелителя». Греческое δεσπότης подчёркивает абсолютную власть и отличается от κύριος, обычно переводимого как «Господь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διόπερ
  choice: поэтому
  rationale: Передаёт сильную причинно-следственную связь с предшествующим изложением.
- source_word: αὐτὸς ὁ τόπος
  choice: само это место
  rationale: Сохраняет указание на храмовое место и эмфатическое αὐτός, не подменяя исходное существительное более узким словом «храм» или «святилище».
- source_word: συμμετασχὼν
  choice: разделив
  rationale: Естественно передаёт совместное участие места и народа в бедствиях, сохраняя олицетворение места.
- source_word: τοῦ ἔθνους
  choice: народа
  rationale: В данном контексте ἔθνος обозначает еврейский народ как единое целое; русское «народ» звучит естественнее, чем «нация».
- source_word: δυσπετημάτων
  choice: бедствия
  rationale: Обозначает тяжёлые несчастья и образует ясное смысловое противопоставление последующим благодеяниям.
- source_word: εὐεργετημάτων
  choice: благодеяния
  rationale: Передаёт оказанные блага и сохраняет связь с идеей последующего Божьего благоволения, не вводя прямо отсутствующее в тексте слово «благословения».
- source_word: ἐκοινώνησεν
  choice: разделило
  rationale: Повтор глагола «разделить» воспроизводит параллель между совместным участием в бедствиях и в благодеяниях.
- source_word: καταληφθεὶς
  choice: оказавшись под
  rationale: Идиоматично выражает попадание места под действие Божьего гнева без излишне буквального «схваченное».
- source_word: παντοκράτορος
  choice: Вседержителя
  rationale: Традиционный и понятный русский библейский эквивалент титула παντοκράτωρ, выражающего всеобъемлющую власть.
- source_word: ὀργῇ
  choice: гневом
  rationale: Сохраняет торжественный смысл Божьего суда.
- source_word: καταλλαγῇ
  choice: примирении
  rationale: Передаёт переход от гнева к восстановленным отношениям и благоволению, не уточняя сверх греческого текста, кто именно является второй стороной примирения.
- source_word: μεγάλου δεσπότου
  choice: великого Владыки
  rationale: «Владыка» выражает верховную и абсолютную власть δεσπότης и позволяет отличить этот титул от обычной передачи κύριος словом «Господь».
- source_word: μετὰ πάσης δόξης ἐπανωρθώθη
  choice: вновь было восстановлено во всей славе
  rationale: Передаёт полное славное восстановление места и сохраняет пассивную конструкцию исходного текста.
theological_decisions:
- issue: Различение божественных титулов παντοκράτωρ и δεσπότης
  choice: Вседержитель … великий Владыка
  alternative: Всемогущий … великий Господь
  rationale: Греческий текст намеренно употребляет два разных титула. Различная передача сохраняет фактуру оригинала и подчёркивает всеобъемлющую власть, не сводя оба наименования к слову «Господь».
- issue: Неопределённость выражения ἐν τῇ … καταλλαγῇ
  choice: при примирении великого Владыки
  alternative: когда великий Владыка вновь явил благоволение
  rationale: Буквально сохранено понятие примирения и не добавлена прямо не названная в греческом тексте вторая сторона; более разъясняющий вариант сделал бы смысл однозначнее, чем оригинал.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены олицетворение храмового места, параллелизм «разделив … разделило» и различие двух божественных титулов. Формула «при примирении великого Владыки» несколько возвышенна, но намеренно удерживает смысловую неоднозначность оригинала.
