  source_fidelity: Перевод верно передаёт политическое значение ἀρχή («властью») и контекстуальный смысл редкого οὐκ ἐκρίτησεν («не овладел»). «В итоге» корректно выражает результативное τέλος, «заговор» — ἐπιβουλή, а «снова бежал в Амманитиду» передаёт πάλιν, φυγάς и ἀπῆλθεν без неоправданной детализации. Притяжательное «его» обосновано непосредственным контекстом об Иасоне и не создаёт существенной смысловой проблемы.
