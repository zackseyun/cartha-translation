  yaml_path: translation/deuterocanon/2_maccabees/005/007.yaml
  text: He did not gain control of the government[a], but in the end, receiving shame from the plot[b], he again fled away to Ammanitis.
translation:
  language: ru
  text: Он не овладел властью[a], но в итоге его заговор обернулся для него позором, и он снова бежал в Амманитиду[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «не добился правления» или «не сумел захватить власть». Употреблённый здесь греческий глагол редок и допускает разные толкования; по контексту Иасону не удалось получить власть, к которой он стремился.'
    reason: lexical_alternative
  - marker: b
    text: Амманитида — область аммонитян.
    reason: cultural_note
lexical_decisions:
- source_word: ἀρχῆς
  choice: властью
  rationale: В данном контексте ἀρχή означает политическую власть или правление, которое Иасон пытался захватить; творительный падеж естественно сочетается с «овладел».
- source_word: οὐκ ἐκρίτησεν
  choice: не овладел
  rationale: Редкий и не вполне ясный в этом месте глагол по контексту указывает на то, что Иасону не удалось добиться искомой власти. Перевод сохраняет этот вероятный смысл, а примечание отмечает лексическую неоднозначность.
- source_word: τὸ δὲ τέλος
  choice: но в итоге
  rationale: τέλος здесь обозначает конечный исход; русское «в итоге» естественно передаёт результат действия.
- source_word: τῆς ἐπιβουλῆς
  choice: его заговор
  rationale: ἐπιβουλή — враждебный замысел, козни или заговор. Притяжательное местоимение проясняет уже заданную повествованием принадлежность замысла Иасону, не меняя смысла.
- source_word: αἰσχύνην λαβών
  choice: обернулся для него позором
  rationale: Буквально выражение означает «приняв позор». Русская идиома передаёт, что итогом заговора стали посрамление и унижение самого заговорщика.
- source_word: φυγὰς πάλιν ... ἀπῆλθεν
  choice: снова бежал
  rationale: φυγάς характеризует его как беглеца, а ἀπῆλθεν означает уход; вместе оборот естественно передаётся глаголом «бежал», при этом πάλιν отражено словом «снова».
- source_word: Ἀμμανῖτιν
  choice: Амманитиду
  rationale: Передано как географическое название области в форме, соответствующей русской традиции образования античных топонимов; пояснение связывает её с аммонитянами.
