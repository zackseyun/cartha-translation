lexical_decisions:
- source_word: Προεστώτων … τῷ Βασιλεῖ περὶ τῶν γεγονότων
  choice: Когда царю доложили о случившемся
  rationale: Генитив абсолютный описывает доведение до царя сведений о произошедшем. «Доложили» естественно для сообщения правителю и не уточняет названных в тексте лиц.
- source_word: διέλαβεν
  choice: он решил
  rationale: Глагол обозначает вывод или суждение, сделанное на основании полученных сведений; «решил» передаёт это без излишней категоричности.
- source_word: ἀποστατεῖν τὴν Ἰουδαίαν
  choice: что Иудея восстала
  rationale: В данном политико-военном контексте речь идёт о мятеже против царской власти, а не о религиозном отступничестве.
- source_word: ἀναζεύξας ἐξ Αἰγύπτου
  choice: он выступил из Египта
  rationale: Причастие означает сняться с места или выступить в путь, нередко о войске. Русское «выступил» сохраняет и движение, и уместный военный оттенок.
- source_word: θηριωμένος τῇ ψυχῇ
  choice: со звериной яростью в душе
  rationale: Фраза изображает внутреннее состояние царя как звероподобное и свирепое. Формулировка сохраняет метафору и звучит естественно по-русски.
- source_word: ἔλαβεν τὴν μὲν πόλιν δοριαλώτον
  choice: взял город силой оружия
  rationale: δοριαλώτον буквально связано с захватом «копьём» и служит военным обозначением города, взятого вооружённым штурмом. «Силой оружия» ясно передаёт смысл идиомы.
