base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/027.yaml
  text: But Judas[a], who was also called Maccabeus, having become about the tenth and having withdrawn, lived in the mountains like a wild animal with those who were with him, and they continued feeding on vegetation so as not to share in the defilement.
translation:
  language: ru
  text: Иуда же, прозванный Маккавеем, оказавшись одним из примерно десяти человек[a] и удалившись, жил в горах вместе с теми, кто был с ним, подобно диким зверям; они постоянно питались растительной пищей, чтобы не стать причастными осквернению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение сжато и не вполне ясно; буквально: «став примерно десятым». Вероятно, смысл в том, что Иуда оказался среди приблизительно десяти человек.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰούδας ... ὁ καὶ Μακκαβαῖος
  choice: Иуда же, прозванный Маккавеем
  rationale: Оборот ὁ καὶ вводит второе имя или прозвание. «Маккавей» — традиционная и естественная русская передача греческого Μακκαβαῖος.
- source_word: δέκατός που γενηθεὶς
  choice: с группой примерно из десяти человек
  rationale: Сжатый и эллиптический греческий оборот, вероятнее всего, означает, что при Иуде осталось около десяти человек; που выражает приблизительность. Необычность конструкции отмечена в сноске.
- source_word: ἀναχωρήσας
  choice: удалился
  rationale: Передаёт уход из опасного места или из общественной жизни, не уточняя без необходимости, был ли это военный отход.
- source_word: ἐν τοῖς ὄρεσι
  choice: в горы
  rationale: Естественная русская передача направления, подразумеваемого глаголом удаления; последующее «там» выражает пребывание в горах.
- source_word: θηρίων τρόπον διέζη
  choice: жил там, подобно дикому зверю
  rationale: Сохраняет образ жизни, подобной жизни диких животных, и передаёт длительный характер διέζη.
- source_word: σὺν τοῖς μετʼ αὐτοῦ
  choice: Вместе с ними
  rationale: Отсылает к сопровождавшей Иуду группе, не добавляя иных характеристик её членов.
- source_word: τὴν χορτώδη τροφὴν σιτούμενοι διετέλουν
  choice: они питались одной растительностью
  rationale: Передаёт продолжительное питание растительной, травянистой пищей. «Одной» естественно выражает ограниченность их рациона в данном контексте.
- source_word: πρὸς τῷ μὴ μετασχεῖν τοῦ μολυσμοῦ
  choice: чтобы не оскверниться
  rationale: Естественно передаёт цель — не стать причастными осквернению, сохраняя религиозно-нравственную окраску μολυσμός без сведения только к ритуальной нечистоте.
theological_decisions:
- issue: Характер μολυσμός в контексте
  choice: осквернение с религиозным и нравственным оттенком
  alternative: только ритуальная нечистота; общее загрязнение или развращение
  rationale: Контекст гонений при Антиохе предполагает избегание запрещённой пищи, навязанных обрядов и отступничества. «Оскверниться» сохраняет широту и серьёзность понятия, не ограничивая его одной категорией.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Эллиптическая числовая конструкция раскрыта в основном тексте ради понятности, а её буквальная форма и подлинная неясность сохранены в сноске.
