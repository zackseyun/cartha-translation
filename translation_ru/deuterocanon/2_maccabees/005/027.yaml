  source_fidelity: Черновик верно передаёт общий смысл, однако «с группой примерно из десяти человек» чрезмерно сглаживает эллиптическое δέκατός που γενηθείς и перестраивает связь причастий. Лучше сохранить, что Иуда оказался одним из приблизительно десяти, с примечанием о спорной сжатой формулировке. «Подобно диким зверям» точнее передаёт множественное θηρίων.
  naturalness: Исправленный текст сохраняет современный литературный и повествовательно-библейский регистр. Синтаксис делает последовательность действий и связь Иуды с его спутниками ясной без ненужного уточнения.
  terminology: «Маккавей» — естественная русская форма прозвания. «Растительная пища» ясно передаёт χορτώδης τροφή. «Стать причастными осквернению» передаёт участие в μολυσμός, не сводя его только к личному состоянию или ритуальной нечистоте.
  issues:
