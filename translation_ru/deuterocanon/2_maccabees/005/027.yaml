    issue: Числовой оборот передан как определённо существующая «группа примерно из десяти человек».
    rationale: δέκατός που γενηθείς — эллиптическая и не вполне прозрачная конструкция. Вероятнее всего, речь о небольшой группе около десяти, но основной текст не должен представлять реконструкцию структуры группы как несомненную.
  - severity: low
    issue: «Подобно дикому зверю» передаёт θηρίων в единственном числе.
    rationale: Греческое θηρίων стоит во множественном числе; русское «подобно диким зверям» сохраняет образ точнее и звучит естественно.
  - severity: low
