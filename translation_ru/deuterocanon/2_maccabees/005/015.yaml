  text: But not satisfied with these things[a], he even dared to enter the most holy temple in all the earth, with Menelaus as his guide, the one who had become a traitor both to the laws and to his homeland,
translation:
  language: ru
  text: Но, не удовлетворившись этим, он даже дерзнул войти в святейший храм на всей земле[a], с Менелаем в качестве проводника — тем, кто стал предателем как законов, так и родины,
  philosophy: optimal-equivalence
