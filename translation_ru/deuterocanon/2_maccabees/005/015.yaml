lexical_decisions:
- source_word: οὐκ ἀρκεσθεὶς δὲ τούτοις
  choice: Но, не удовлетворившись этим
  rationale: Причастный оборот передаёт неудовлетворённость уже совершёнными злодеяниями и вводит дальнейшее нарастание повествования; единственное «этим» естественно обобщает предшествующие события.
- source_word: κατετόλμησεν
  choice: даже дерзнул
  rationale: «Дерзнул» выражает предосудительную, вызывающую смелость, а «даже» подчёркивает нарастание кощунства.
- source_word: πάσης τῆς γῆς
  choice: на всей земле
  rationale: Сохраняется универсальный размах превосходной характеристики храма; возможное значение γῆ как «страна» отмечено в сноске.
- source_word: ἁγιώτατον ἱερὸν
  choice: святейший храм
  rationale: «Святейший» передаёт превосходную степень ἁγιώτατον, а «храм» ясно и естественно обозначает ἱερόν в данном контексте.
- source_word: ὁδηγὸν ἔχων τὸν Μενέλαον
  choice: взяв себе в проводники Менелая
  rationale: Оборот естественно передаёт участие Менелая как проводника и помощника при входе в храм.
- source_word: τὸν καὶ τῶν νόμων καὶ τῆς πατρίδος προδότην γεγονότα
  choice: ставшего предателем и законов, и родины
  rationale: «Ставшего» отражает результативное значение перфектного причастия; повтор «и … и» сохраняет двойное обвинение, а множественное «законов» следует греческому тексту.
theological_decisions:
- issue: Обозначение храма и масштаб утверждения о его святости
  choice: святейший храм на всей земле
  alternative: святейшее святилище во всей стране
  rationale: Основной текст сохраняет возвышенное универсальное утверждение, не ослабляя превосходную степень; лексическая неоднозначность γῆ и допустимое значение ἱερόν представлены в сноске.
translation_notes:
