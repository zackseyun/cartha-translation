  text: And he ordered the soldiers to cut down without mercy those they encountered[b][a], and to slaughter those who went up into the houses.
translation:
  language: ru
  text: Он приказал воинам без пощады рубить всех, кто попадался им на пути[a], и закалывать тех, кто поднимался в домах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех, на кого они наталкивались». Греческое выражение может обозначать людей, встречавшихся воинам или попадавшихся им на пути; оно не обязательно подразумевает нападение со стороны жертв.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «поднимавшихся в домах»; возможно, имеется в виду подъём по лестницам внутри домов, в их верхние помещения.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: приказал
  rationale: Аорист κελεύω обозначает отданное распоряжение; «приказал» естественно и точно передаёт его силу.
- source_word: τοῖς στρατιώταις
  choice: воинам
  rationale: В повествовании о вооружённом отряде «воины» звучит естественно и сохраняет военный смысл.
- source_word: κόπτειν
  choice: рубить
  rationale: κόπτω буквально значит «бить, рубить»; здесь речь о смертоносном насилии. «Рубить» сохраняет зримую жестокость выражения, не сводя его к нейтральному «убивать».
- source_word: ἀφειδῶς
  choice: без пощады
  rationale: Наречие означает действие без жалости и без намерения щадить; это устойчивое современное русское соответствие.
- source_word: τοὺς ἐμπίπτοντας
  choice: всех, кто попадался им на пути
  rationale: ἐμπίπτω допускает значения «натолкнуться, встретиться, попасться на пути». Формулировка передаёт встреченных воинами людей и не представляет жертв нападавшей стороной.
- source_word: κατασφάζειν
  choice: убивать
  rationale: Усиленный глагол обозначает жестокое заклание или умерщвление. После образного «рубить» русское «убивать» ясно передаёт результат и избегает неестественного повтора; интенсивность сохраняется контекстом массовой расправы.
- source_word: ἀναβαίνοντας
  choice: поднимался в
  rationale: Буквально «идущих вверх, поднимающихся». Выбор сохраняет пространственную направленность, не заменяя её простым «входил».
- source_word: οἰκίαις
  choice: дома
  rationale: οἰκία здесь обозначает физические жилища; форма «в дома» естественна при описании движения внутрь.
