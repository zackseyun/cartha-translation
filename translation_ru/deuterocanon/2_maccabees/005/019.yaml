  text: But the Lord did not choose the nation for the sake of the place, but the place for the sake of the nation.
translation:
  language: ru
  text: Но Господь избрал народ не ради места, а место — ради народа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλʼ
  choice: Но
  rationale: Передаёт сильное противопоставление предшествующей мысли и естественно вводит антитезу в современном русском языке.
- source_word: διὰ
  choice: ради
  rationale: С винительным падежом выражает основание или мотив; краткое «ради» точно сохраняет зеркальное противопоставление двух частей.
- source_word: τόπον
  choice: место
  rationale: Греческий текст употребляет общее слово «место». Контекст указывает на Иерусалим и храм, но перевод не конкретизирует то, чего нет в формулировке стиха.
- source_word: ἔθνος
  choice: народ
  rationale: Здесь обозначает иудейский народ как единое этнорелигиозное сообщество. В современном русском «народ» звучит естественнее «нации» в контексте Божьего избрания и не ослабляет собирательного смысла.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Устоявшаяся и уместная передача божественного титула; русская форма не требует артикля.
- source_word: ἐξελέξατο
  choice: избрал
  rationale: Передаёт аорист среднего залога ἐκλέγομαι и сохраняет богословски значимый язык избрания. Сказуемое естественно подразумевается во второй части русской антитезы.
theological_decisions:
- issue: Соотношение священного места и избранного народа
  choice: Господь избрал место ради народа, а не народ ради места.
  alternative: Место было избрано независимо и затем сообщило народу особый статус.
  rationale: Греческая конструкция прямо и симметрично устанавливает приоритет народа в данном отношении. Перевод сохраняет эту мысль, не уточняя сверх текста ни природу избрания, ни статус места.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и афористичной синтаксической формой. Тире во второй части отмечает естественный пропуск повторного сказуемого и подчёркивает параллелизм.
