base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/005.yaml
  text: But when a false rumor arose that Antiochus had passed from life[a], Jason, taking no fewer than a thousand men, launched a sudden attack against the city. When those on the wall had been driven back, and at last the city was already being taken, Menelaus fled into the citadel.
translation:
  language: ru
  text: Но когда распространился ложный слух, будто Антиох ушёл из жизни[a], Иасон, взяв с собой не менее тысячи человек, внезапно напал на город. Когда стоявшие на стене были отброшены и, наконец, город уже захватывали, Менелай бежал в крепость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «переменил жизнь» — эвфемистическое выражение, означающее, что Антиох умер.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιάς ψευδοῦς
  choice: ложный слух
  rationale: В данном контексте λαλιά означает распространявшееся известие; «ложный слух» естественно передаёт смысл и политическую обстановку.
- source_word: μετηλλαχότος ... τὸν βίον
  choice: ушёл из жизни
  rationale: Греческий эвфемистический оборот буквально говорит о «перемене жизни» и означает смерть; русский эвфемизм сохраняет мягкость выражения.
- source_word: παραλαβὼν
  choice: взяв с собой
  rationale: Причастие указывает, что Иасон привёл с собой вооружённый отряд.
- source_word: οὐκ ἐλάττους τῶν χιλίων
  choice: не менее тысячи человек
  rationale: Передаёт выраженную в греческом тексте нижнюю численную границу без ослабления.
- source_word: ἐφνιδίως ... συνετελέσατο ἐπίθεσιν
  choice: внезапно напал
  rationale: Естественная русская военная формулировка, передающая неожиданность и совершение нападения.
- source_word: τῶν ... ἐπὶ τῷ τείχει
  choice: стоявшие на стене
  rationale: Не добавляет прямо не названного определения «защитники», но ясно обозначает находившихся на стене людей.
- source_word: συνελασθέντων
  choice: были отброшены
  rationale: В контексте штурма пассивная форма указывает на вытеснение людей с их позиции.
- source_word: τέλος ἤδη καταλαμβανομένης τῆς πόλεως
  choice: город уже почти был взят
  rationale: Передаёт незавершённый процесс захвата и значение τέλος в развитии событий; «почти» естественно показывает, что взятие ещё происходило, хотя может несколько конкретизировать греческую формулировку.
- source_word: ἐφυγάδευεν
  choice: бежал
  rationale: Простое «бежал» точно выражает уход спасением бегством и не добавляет явно не названной цели.
- source_word: ἀκρόπολιν
  choice: крепость
  rationale: В историческом контексте это укреплённая верхняя часть города; «крепость» понятно современному читателю и соответствует функции места.
