base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/021.yaml
  text: So Antiochus[a], after carrying off from the temple eighteen hundred talents, quickly departed for Antioch, thinking in his arrogance to make the land navigable and the sea passable on foot[b], because of the exaltation of his heart.
translation:
  language: ru
  text: Итак, Антиох, унеся из храма тысячу восемьсот талантов, поспешно удалился в Антиохию, воображая в своей надменности, что сделает сушу судоходной, а море — проходимым[a], ибо сердце его вознеслось[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Образ намеренно преувеличен: Антиох воображал, будто способен обратить естественный порядок, сделав сушу местом для плавания, а море — пригодным для передвижения.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «из-за вознесённости его сердца». Речь идёт о горделивой самоуверенности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκτακόσια πρὸς τοῖς χιλίοις
  choice: тысячу восемьсот
  rationale: Греческое выражение буквально означает «восемьсот в добавление к тысяче»; современная русская форма точно и естественно передаёт сумму 1800.
- source_word: ἀπενεγκάμενος ἐκ τοῦ ἱεροῦ
  choice: унеся из храма
  rationale: Причастие обозначает унесение или вывоз ценностей; «храм» передаёт ἱερόν без неоправданного сужения до внутреннего святилища.
- source_word: θᾶττον ... ἐχωρίσθη
  choice: поспешно удалился
  rationale: Передаёт как быстроту действия, так и повествовательное значение ухода в направлении Антиохии.
- source_word: ἀπὸ τῆς ὑπερηφανίας
  choice: в своей надменности
  rationale: Передаёт обусловленность его мысли гордыней и сохраняет отрицательную нравственную окраску ὑπερηφανία.
- source_word: τὴν μὲν γῆν πλωτὴν ... καὶ τὸ πέλαγος πορευτὸν θέσθαι
  choice: сделать сушу пригодной для плавания, а море — для хождения
  rationale: Сохранён намеренный парадокс обращения естественного порядка. «Для хождения» не уточняет способ сильнее, чем это делает греческое πορευτόν; подразумеваемое хождение пешком пояснено в сноске.
- source_word: διὰ τὸν μετεωρισμὸν τῆς καρδίας
  choice: настолько вознеслось его сердце
  rationale: Идиоматическая русская формулировка сохраняет образ возвышенного, возгордившегося сердца и выражает причинную связь с невозможными притязаниями Антиоха.
theological_decisions:
- issue: Библейская антропологическая идиома τῆς καρδίας
  choice: его сердце
  alternative: его ум / его внутреннее «я»
  rationale: «Сердце» сохранено как библейское обозначение средоточия намерений и гордыни, без сведения смысла лишь к интеллекту или эмоциям.
- issue: 'Связь двух выражений о гордыне: ἀπὸ τῆς ὑπερηφανίας и διὰ τὸν μετεωρισμὸν τῆς καρδίας'
  choice: сохранить оба выражения, первое как «в своей надменности», второе как образ вознесшегося сердца
  alternative: объединить их в одно упоминание гордости
  rationale: Греческий текст намеренно обрамляет нелепое притязание двумя близкими, но не тождественными характеристиками; перевод сохраняет это риторическое усиление.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис разделён на два предложения ради ясности; парадокс исходного текста и библейский образ сердца сохранены.
