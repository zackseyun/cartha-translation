    issue: В основном тексте πατρῴου νόμου истолковано как «по отеческому закону».
    rationale: Греческое μετέσχεν («был причастен, имел долю») относится как к κηδείας, так и к πατρῴου νόμου. Перевод способа погребения сглаживает синтаксическую и смысловую трудность источника.
  - severity: low
    issue: «Не удостоился никакого погребального обряда» несколько расширяет κηδείας и меняет конструкцию.
    rationale: Более прямое «не был причастен ни к какому погребению» точнее воспроизводит μετέσχεν и усиленное отрицание οὐδ᾽ ἥτινος.
