review_pass:
  verdict: revise
  source_fidelity: 'Начальная часть в целом верно передаёт резкий контраст: ἐκρίψας — «выбросил», ἀτάφων — «непогребённых», ἀπένθητος — «неоплаканным». Однако «не был погребён по отеческому закону» синтаксически превращает πατρῴου νόμου в обстоятельство способа при «погребён», тогда как в предоставленном греческом тексте μετέσχεν непосредственно управляет двумя генитивами: «не был причастен ни к какому погребению, ни к отеческому закону». Необычность второй части следует сохранить с пояснением, а не разрешать в самом тексте.'
  naturalness: 'Предлагаемая правка остаётся современным литературным русским, хотя выражение «быть причастным к отеческому закону» намеренно несколько формально: это необходимо для сохранения трудной конструкции исходного текста. «Множество непогребённых тел» ясно раскрывает подразумеваемый объект.'
  terminology: «Отеческий закон» точно передаёт πατρῷος νόμος и не должен заменяться «родовой гробницей», поскольку это отражало бы иное чтение, представленное в английском аудиторском слое. «Погребение» достаточно передаёт κηδεία; добавлять «обряд» не требуется.
  issues:
