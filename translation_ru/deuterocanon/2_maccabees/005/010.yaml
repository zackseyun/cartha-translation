base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/005/010.yaml
  text: And after casting out a multitude unburied, he himself became unwept, and shared in no burial at all, nor in his ancestral tomb.
translation:
  language: ru
  text: И тот, кто выбросил множество непогребённых тел, сам оказался неоплаканным и не был причастен ни к какому погребению, ни к отеческому закону[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ни к какому погребению, ни к отеческому закону». Смысл сочетания «отеческий закон» в этом контексте не вполне ясен; оно, возможно, подразумевает унаследованный обычай, связанный с погребением. Английское чтение «родовая гробница» отражает иной вариант текста и не принято в основном переводе.'
    reason: Сохраняет трудное чтение νόμου («закона»), отмечает его контекстуальную неопределённость и не смешивает его с вариантом τάφου («гробницы»).
lexical_decisions:
- source_word: πλῆθος ἀτάφων
  choice: множество тел, оставив их без погребения
  rationale: Прилагательное ἀτάφων буквально означает «непогребённых»; добавление «тел» естественно по-русски и ясно передаёт подразумеваемый объект.
- source_word: ἐκρίψας
  choice: выбросил
  rationale: Сохраняет резкость глагола со значением выбрасывания или оставления тел без должного погребения.
- source_word: ἀπένθητος
  choice: остался неоплаканным
  rationale: Передаёт не просто отсутствие похорон, а отсутствие траура и оплакивания, создавая намеренный контраст с его обращением с погибшими.
- source_word: κηδείας οὐδ᾽ ἥτινος
  choice: не удостоился никакого погребального обряда
  rationale: κηδεία здесь обозначает погребение и связанные с ним обряды; формулировка сохраняет усиленное отрицание.
- source_word: πατρῴου νόμου
  choice: по отеческому закону
  rationale: Следует предоставленному греческому тексту, где стоит νόμου («закона, обычая»), а не чтению «гробницы» из английского консультационного слоя.
theological_decisions:
- issue: Возмездие через лишение погребальных почестей
  choice: 'Сохранён прямой контраст: оставлявший других непогребёнными сам оказался неоплаканным и без надлежащего погребения.'
  alternative: Смягчить контраст до общего сообщения о смерти вдали от родины.
  rationale: Контраст явно выражен лексикой и построением греческого предложения и важен для богословско-нравственной логики повествования.
- issue: Значение πατρῴου νόμου
  choice: «по отеческому закону» понимается как погребение согласно унаследованному закону или обычаю.
  alternative: «в родовой гробнице», как в английском POB, вероятно отражающем иное чтение τάφου.
  rationale: Перевод должен исходить прежде всего из предоставленного греческого текста νόμου и не подменять его консультационным английским вариантом.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Синтаксис слегка развернут ради ясности; резкий образ выброшенных непогребённых тел и симметрия возмездия сохранены.
