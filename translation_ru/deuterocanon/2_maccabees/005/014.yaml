    reason: lexical_alternative
lexical_decisions:
- source_word: ὀκτὼ ... μυριάδες
  choice: восемьдесят тысяч
  rationale: Одна μυριάς — десять тысяч; обычное русское числительное естественнее буквального «восемь мириад».
- source_word: ἐν ταῖς πάσαις ἡμέραις τρισίν
  choice: за все три дня
  rationale: Передаёт и временной промежуток, и подчёркнутый охват всех трёх дней.
- source_word: κατεφθάρησαν
  choice: было погублено
  rationale: Глагол обозначает гибель или уничтожение; «погублено» сохраняет широкий смысл и допускает последующее разграничение между убитыми и проданными.
- source_word: τέσσαρες μὲν
  choice: сорок тысяч
  rationale: Существительное «мириады» подразумевается из предыдущей части фразы, поэтому эллипсис раскрыт как «сорок тысяч».
- source_word: ἐν χειρῶν νόμοις
  choice: от рук людей
  rationale: Греческое выражение буквально связано с «законами рук», но остаётся неясным; выбранная формулировка передаёт насильственное человеческое действие, не уточняя способ убийства сверх текста.
- source_word: τῶν ἐσφαγμένων
  choice: чем убито
  rationale: В данном контексте форма от σφάζω обозначает людей, насильственно лишённых жизни; краткая русская конструкция сохраняет сопоставление с проданными.
- source_word: ἐπράθησαν
  choice: продано
  rationale: Греческий глагол прямо означает «были проданы»; вероятное рабство не внесено в основной текст, а отмечено в сноске.
