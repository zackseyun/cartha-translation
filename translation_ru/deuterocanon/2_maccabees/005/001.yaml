translation:
  language: ru
  text: Около того времени Антиох предпринял свой второй поход в Египет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «отправил в Египет вторую военную экспедицию». Греческий глагол буквально может означать «послал» или «снарядил», а ἔφοδος — «нападение», «военный поход» или «экспедиция».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ τὸν καιρὸν τοῦτον
  choice: Около того времени
  rationale: Оборот с περί и винительным падежом обозначает приблизительное время; такой перевод естественно вводит новое событие повествования.
- source_word: τὴν δευτέραν ἔφοδον
  choice: свой второй поход
  rationale: Ἔφοδος может означать нападение, военную кампанию или экспедицию. «Поход» сохраняет военный смысл, не сводя действие к одному нападению; возвратное притяжательное местоимение естественно связывает поход с Антиохом.
- source_word: ὁ Ἀντίοχος
  choice: Антиох
  rationale: Имя передано в принятой русской библейской форме.
- source_word: εἰς Αἴγυπτον
  choice: в Египет
  rationale: Предлог εἰς выражает направленное движение; по-русски направление военного похода естественно передаётся сочетанием «в Египет».
- source_word: ἐστέλατο
  choice: предпринял
  rationale: Средняя форма στέλλω здесь означает снарядить или начать военное предприятие. «Предпринял поход» — естественное современное сочетание, сохраняющее инициативу Антиоха.
