    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρίαν
  choice: зрелища
  rationale: Слово может обозначать публичное зрелище, созерцание или праздничное собрание. «Зрелище» сохраняет конкретность греческого выражения, не сводя его однозначно к празднику.
- source_word: συνεκέκλεισεν
  choice: запер
  rationale: Глагол передаёт принудительное заключение или удержание людей вместе; «запер» естественно и ясно выражает эту силу.
- source_word: εἰσδραμὼν
  choice: ворвавшись
  rationale: Причастие описывает стремительное, силовое проникновение в город; «ворвавшись» передаёт скорость и насильственный характер действия.
- source_word: σὺν τοῖς ὅπλοις
  choice: с оружием
  rationale: Перевод сохраняет прямое упоминание оружия в греческом тексте, а не заменяет его более общим «вооружённый».
- source_word: ἱκανὰ κατέστησεν πλήθη
  choice: погубил множество людей
  rationale: Сжатое греческое выражение в контексте вооружённого нападения указывает на гибель большого числа людей. Русская формулировка передаёт результат естественно, не вводя точного количества.
