  text: And for us[a], who have undertaken the hardship of making the abridgment, the task is not easy, but one of sweat and sleeplessness;
translation:
  language: ru
  text: 'А для нас, взявших на себя тяжкий труд составления сокращённого изложения,[a] это дело нелёгкое: оно требует пота и бессонных ночей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «показавших тяготы сокращённого изложения». Греческий оборот несколько идиоматичен и, вероятно, говорит о том, что составители приняли на себя и перенесли труд, связанный с подготовкой сокращённого изложения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμῖν μὲν τοῖς
  choice: для нас
  rationale: Дательный падеж с артиклем и причастием обозначает авторов как тех, кто несёт описываемый труд; по-русски естественно передаётся оборотом «для нас, взявших…».
- source_word: τὴν κακοπάθειαν ἐπιδεδειγμένοις
  choice: взявших на себя тяжкий труд
  rationale: Буквально выражение связано с проявлением или перенесением тягот. В контексте редакторской работы оно означает, что составители приняли на себя и испытали этот тяжёлый труд; перевод сохраняет смысл, не придавая ему оттенка гонений.
- source_word: τῆς ἐπιτομῆς
  choice: составления сокращённого изложения
  rationale: ἐπιτομή — сокращение, краткое изложение более обширного труда. Отглагольная формулировка ясно связывает тяготы с процессом его составления.
- source_word: οὐ ῥᾴδιον
  choice: нелёгкое
  rationale: Прямо и естественно передаёт отрицание лёгкости или простоты задачи.
- source_word: ἱδρῶτος δὲ καὶ ἀγρυπνίας
  choice: требует пота и бессонных ночей
  rationale: Сохраняется яркий образ пота и бодрствования по ночам; глагол «требует» естественно выражает характеризующие дело родительные падежи.
- source_word: τὸ πρᾶγμα
  choice: это дело
  rationale: πρᾶγμα здесь обозначает предпринятую работу; «дело» звучит естественно и соотносится с составлением сокращённого изложения.
