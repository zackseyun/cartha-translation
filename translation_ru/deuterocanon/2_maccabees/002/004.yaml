  yaml_path: translation/deuterocanon/2_maccabees/002/004.yaml
  text: For when the leader and the force around him[a], which seemed invincible, had arrived, they were cut down in the temple of Nanaia, because the priests attending Nanaia had used deceit.
translation:
  language: ru
  text: 'Когда правитель прибыл вместе с сопровождавшим его войском, которое казалось непобедимым[a], их перебили в храме Нанаии: служившие Нанаии жрецы прибегли к обману.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «казалось неодолимым».'
    reason: 'Необычное греческое выражение допускает близкие по смыслу варианты: войско представлялось таким, которому невозможно противостоять.'
lexical_decisions:
- source_word: γενόμενος
  choice: прибыл
  rationale: В повествовательном контексте причастие от γίνομαι обозначает прибытие; перевод «стал» здесь не соответствует развитию действия.
- source_word: ἡγεμών
  choice: правитель
  rationale: Сохраняет широкое значение лица, облечённого властью, не уточняя без достаточных оснований, был ли это наместник или военачальник.
- source_word: ἡ περὶ αὐτὸν ... δύναμις
  choice: сопровождавшее его войско
  rationale: В военном контексте δύναμις означает вооружённые силы, а περὶ αὐτόν — людей, находившихся при правителе.
- source_word: ἀνυπόστατος δοκοῦσα εἶναι
  choice: казалось непобедимым
  rationale: Необычное выражение в данном военном контексте естественнее всего означает силу, которой, как казалось, невозможно противостоять; неоднозначность отмечена в сноске.
- source_word: κατεκόπησαν
  choice: их перебили
  rationale: Передаёт пассивное значение насильственного уничтожения естественным современным русским языком, сохраняя образную силу глагола.
- source_word: ἐν τῷ τῆς Ναναίας ἱερῷ
  choice: в храме Нанаии
  rationale: ἱερόν обозначает храм или святилище; «храм» ясно и естественно в данном рассказе.
- source_word: παραλογισμῷ χρησαμένων
  choice: прибегли к обману
  rationale: Родительный самостоятельный оборот указывает на обстоятельство или средство расправы; παραλογισμός здесь означает обман, уловку.
- source_word: τῶν περὶ τὴν Ναναίαν ἱερέων
  choice: служившие Нанаии жрецы
  rationale: Оборот обозначает жрецов, связанных со служением богине; «жрецы» уместно отличает служителей языческого культа.
theological_decisions:
- issue: Передача имени Ναναία
  choice: Нанаия
  alternative: Нанея; Наная
  rationale: Имя богини транслитерируется, а не переводится; форма «Нанаия» близко передаёт греческое написание.
translation_notes:
  register: 'Современный литературный русский язык, ясный и достойный, без архаизации. ВАЖНО: предоставленный греческий текст не соответствует указанной ссылке 2 Маккавейская 2:4; он соответствует 2 Маккавейская 1:13 в обычной нумерации. Поэтому этот перевод нельзя публиковать как 2:4 без замены исходного греческого текста или исправления ссылки.'
