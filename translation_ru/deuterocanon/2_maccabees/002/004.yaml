  source_fidelity: 'Основной смысл греческого текста передан точно: предводитель и сопровождавшая его военная сила были перебиты в храме Нанаии вследствие уловки жрецов. «Прибыл» — контекстуально обоснованное значение γενόμενος; «непобедимым» приемлемо для трудного ἀνυπόστατος, а сноска надлежащим образом сохраняет неуверенность. Однако указанная ссылка 2 Маккавейская 2:4 не соответствует предоставленному греческому тексту: этот текст обычно находится в 2 Маккавейской 1:13. Это существенная метадатная проблема, требующая проверки исходника и ссылки до публикации.'
