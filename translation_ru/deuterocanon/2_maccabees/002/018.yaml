base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/018.yaml
  text: Gather our dispersion, free those who are enslaved among the nations, look upon those who are despised and abhorred; and let the nations know that you are our God.
translation:
  language: ru
  text: Собери наш рассеянный народ[a], освободи тех, кто находится в рабстве среди народов; взгляни на тех, кого презирают и кем гнушаются[b]. И пусть народы узнают, что Ты — наш Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наше рассеяние». Греческое абстрактное существительное здесь обозначает рассеянную общину.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обрати внимание на тех, кого презирают и кем гнушаются». Греческий глагол призывает Бога обратить к ним Свой взор; сострадание подразумевается контекстом, но прямо не названо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνάγαγε
  choice: Собери
  rationale: Аористный императив выражает обращённую к Богу просьбу собрать воедино рассеянных; «собери» точно и естественно передаёт это значение.
- source_word: τὴν διασπορὰν ἡμῶν
  choice: наш рассеянный народ
  rationale: Греческое абстрактное существительное «рассеяние» обозначает здесь рассеянную общину. В русском буквальное «наше рассеяние» неестественно и может быть понято как процесс, поэтому коллективный смысл выражен явно, а буквальная форма отмечена в сноске.
- source_word: ἐλευθέρωσον
  choice: освободи
  rationale: Глагол означает сделать свободными, отпустить; «освободи» сохраняет прямой смысл и повелительную форму молитвы.
- source_word: τοὺς δουλεύοντας
  choice: тех, кто находится в рабстве
  rationale: δουλεύω здесь указывает не на добровольное служение, а на подневольное положение среди чужих народов. Развёрнутая формулировка звучит естественно и сохраняет значение рабства.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди других народов
  rationale: В контексте рассеяния ἔθνη — окружающие Израиль народы. Добавление «других» естественно обозначает их отличие от народа молящихся, не придавая выражению конфессионально нагруженного смысла «язычники».
- source_word: τοὺς ἐξουθενημένους καὶ βδελυκτοὺς
  choice: тех, кого презирают и кем гнушаются
  rationale: 'Оба определения переданы как отношение окружающих к угнетённым людям: их считают ничтожными и вызывающими отвращение. Такая конструкция сохраняет параллелизм и не утверждает, будто эти люди отвратительны сами по себе.'
- source_word: ἔφιδε
  choice: взгляни на
  rationale: Императив призывает Бога обратить взор и внимание на униженных. «Взгляни на» сохраняет образ зрения, оставаясь современным и не добавляя прямо значения жалости.
- source_word: γνώτωσαν
  choice: пусть народы узнают
  rationale: Форма третьего лица имеет побудительно-желательное значение; «пусть… узнают» естественно передаёт продолжение молитвенной просьбы.
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν
  choice: что Ты — наш Бог
  rationale: Формулировка сохраняет прямое исповедание принадлежности Богу и эмфатическое местоимение σὺ; тире естественно для русского именного сказуемого.
theological_decisions:
- issue: Значение δουλεύοντας в условиях жизни среди чужих народов
  choice: тех, кто находится в рабстве
  alternative: тех, кто служит
  rationale: Контекст просьбы об освобождении показывает подневольное состояние, а не добровольное служение; перевод сохраняет социальную и политическую остроту текста.
- issue: Передача абстрактного существительного διασπορά
  choice: наш рассеянный народ
  alternative: наше рассеяние
  rationale: Абстрактное существительное употреблено коллективно, обозначая рассеянную общину. Основной текст передаёт этот смысл естественно по-русски, а формальная неоднозначность отражена в сноске.
- issue: Смысл βδελυκτούς применительно к людям
  choice: кем гнушаются
  alternative: отвратительных
  rationale: В сочетании с пассивным причастием «презираемых» контекст указывает на отношение окружающих к этим людям. Перевод не превращает в авторскую оценку то, что описывает их униженное положение.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Избегаются как чрезмерно архаичные «призри» и «воззри», так и конфессионально нагруженное «язычники». Заглавное «Ты» соответствует принятой русской орфографической традиции уважительного обращения к Богу.
