  text: Likewise also Judas gathered together for us all the things that had been scattered because of the war that had occurred[b][a], and they are with us.
translation:
  language: ru
  text: Подобным образом и Иуда собрал для нас всё, что было рассеяно[a] из-за случившейся войны, и всё это находится у нас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст буквально говорит о «рассеянном», не уточняя, что именно было собрано; из контекста можно предположить записи или книги.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и оно у нас». В греческом сказуемое стоит в единственном числе при подлежащем среднего рода во множественном числе, что является обычным грамматическим согласованием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσαύτως δὲ καὶ
  choice: Подобным образом и
  rationale: Передаёт сопоставление с предшествующим сообщением и добавочное значение καί естественным литературным русским оборотом.
- source_word: Ἰούδας
  choice: Иуда
  rationale: Традиционная русская форма имени в данном библейском контексте; речь идёт об Иуде Маккавее.
- source_word: τὰ διεσπεπτωκότα ... πάντα
  choice: всё, что было рассеяно
  rationale: Сохраняет широкий, неуточнённый характер среднего рода множественного числа и подчёркнутую πάντα полноту, не вводя в основной текст предполагаемые книги или записи.
- source_word: διὰ τὸν γεγονότα πόλεμον
  choice: из-за разразившейся войны
  rationale: Передаёт причинное διά и войну как уже наступившее событие; «разразившейся» звучит естественнее по-русски, чем буквальное «произошедшей» применительно к войне.
- source_word: ἡμῖν
  choice: для нас
  rationale: 'Передаёт дательный заинтересованного лица: собрание было совершено для общины, от имени которой говорит автор письма.'
- source_word: ἐπισυνήγαγεν
  choice: собрал
  rationale: В русском «собрал» ясно выражает сведение рассеянного воедино; дополнительное «вместе» было бы избыточным.
- source_word: καὶ ἔστιν παρʼ ἡμῖν
  choice: и всё это находится у нас
  rationale: Передаёт нынешнее наличие или владение без более узкого толкования вроде «хранится в архиве»; «всё это» естественно связывает фразу с ранее названной совокупностью.
