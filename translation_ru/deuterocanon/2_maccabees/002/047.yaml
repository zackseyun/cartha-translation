lexical_decisions:
- source_word: ἔτι τε
  choice: а также
  rationale: Сочетание вводит ещё один пункт продолжающегося перечисления; «а также» естественно передаёт добавочное значение.
- source_word: τοὺς ... πολέμους
  choice: о войнах
  rationale: πολέμους обозначает войны или военные столкновения. Предлог «о» обусловлен русским синтаксисом фрагмента перечисления, тогда как значение самого существительного передано словом «войнах».
- source_word: πρὸς
  choice: против
  rationale: В сочетании с πολέμους предлог выражает направленность военных действий против названных правителей.
- source_word: Ἀντίοχον τὸν Ἐπιφανῆ
  choice: Антиоха Эпифана
  rationale: Царское прозвание передано в принятой русской исторической форме, без смыслового перевода.
- source_word: τὸν τούτου υἱὸν Εὐπάτορα
  choice: его сына Евпатора
  rationale: τούτου отсылает к Антиоху; формулировка ясно и естественно сохраняет указание на родство.
