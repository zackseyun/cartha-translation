base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/012.yaml
  text: As they explained to us that they had found not fire but thick water[a], he ordered them, after drawing some out, to bring it. Then when the things for the sacrifices had been brought forward[c][b], Nehemiah ordered the priests to sprinkle the water on both the wood and what was laid upon it.
translation:
  language: ru
  text: Когда они разъяснили нам, что нашли не огонь, а густую воду[a], он велел им зачерпнуть её[b] и принести. Когда же принесли всё необходимое для жертвоприношений, Неемия велел священникам окропить[c] этой водой дрова и то, что было положено на них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плотную воду» либо «густую жидкость». Греческое выражение необычно и подчёркивает странный характер найденного вещества.'
    reason: lexical_alternative
  - marker: b
    text: Греческое причастие имеет редкую и трудную форму; по смыслу им было велено извлечь некоторое количество жидкости и принести его.
    reason: textual_difficulty
  - marker: c
    text: 'Или: «полить». Греческий глагол может обозначать нанесение или выливание жидкости на что-либо.'
    reason: alternative_reading
lexical_decisions:
- source_word: διεσάφησαν
  choice: разъяснили
  rationale: Глагол обозначает ясное, подробное сообщение; «разъяснили» сохраняет эту выразительность и естественно вводит содержание сообщения.
- source_word: μὴ εὑρηκέναι πῦρ ἀλλὰ ὕδωρ παχύ
  choice: что нашли не огонь, а густую воду
  rationale: Сохранена необычная характеристика ὕδωρ как «густой воды», без поясняющей замены на «жидкость».
- source_word: ἀποβλίψαντας
  choice: зачерпнуть её
  rationale: Редкая и трудная форма по контексту указывает на извлечение некоторого количества найденной жидкости; «зачерпнуть» передаёт действие, не уточняя орудия.
- source_word: φέρειν
  choice: принести
  rationale: Инфинитив после ἐκέλευσεν передаёт приказ; подразумеваемый объект — часть найденной жидкости.
- source_word: ἀνηνέχθη τὰ τῶν θυσιῶν
  choice: принесли всё необходимое для жертвоприношений
  rationale: Субстантивированная эллиптическая конструкция обозначает принадлежности или материалы для жертв; перевод сохраняет широкий смысл, не сводя его только к жертвенным животным или приношениям.
- source_word: ἐπιρᾶναι
  choice: окропить
  rationale: В данном жертвенном контексте глагол описывает нанесение жидкости на дрова и лежащее на них; «окропить» естественно передаёт это действие, а возможность более обильного поливания отмечена в сноске.
- source_word: τά τε ξύλα καὶ τὰ ἐπικείμενα
  choice: дрова и то, что было положено на них
  rationale: Перевод сохраняет широкое обозначение предметов, лежащих на дровах, не уточняя их вопреки греческому тексту.
- source_word: Νεεμίας
  choice: Неемия
  rationale: Использована устоявшаяся русская библейская форма имени.
theological_decisions:
- issue: Способ нанесения найденной жидкости на жертвенные материалы
  choice: окропить этой водой
  alternative: полить этой водой
  rationale: «Окропить» уместно в жертвенном контексте, однако греческий глагол допускает более общее понимание нанесения или выливания жидкости; альтернатива сохранена в сноске без догматического уточнения.
- issue: Необычное выражение «густая вода»
  choice: густая вода
  alternative: густая жидкость
  rationale: Буквально необычное сочетание сохраняет удивительный характер находки и не отождествляет вещество с чем-либо за пределами данного стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Необычность «густой воды» и неопределённость выражения о жертвенных принадлежностях сохранены; синтаксис сделан ясным для широкого читателя.
