lexical_decisions:
- source_word: συνορῶντες
  choice: видя
  rationale: Причастие вводит основание для предпринятого автором сокращения; «видя» сохраняет образность и в сочетании с «ведь» передаёт причинный смысл.
- source_word: τὸ χῦμα τῶν ἀριθμῶν
  choice: поток сведений
  rationale: χῦμα обозначает разлив или массу и создаёт образ подавляющего изобилия. Буквальное «поток чисел» по-русски способно ошибочно навести на мысль о цифровых данных; «сведений» передаёт вероятный контекстуальный смысл ἀριθμῶν, а буквальная возможность отмечена в сноске.
- source_word: τὴν οὖσαν δυσχέρειαν
  choice: трудность
  rationale: Передаёт существующее препятствие без тяжеловесного буквального оборота «имеющуюся трудность».
- source_word: τοῖς θέλουσιν εἰσκυκλεῖσθαι
  choice: для тех, кто хочет вникнуть
  rationale: Редкий глагол указывает на вхождение в повествование или углублённое занятие им; «вникнуть» естественно выражает это по-русски, не уточняя способ работы с текстом.
- source_word: τοῖς τῆς ἱστορίας διηγήμασιν
  choice: в исторические повествования
  rationale: Естественная русская передача рассказов, составляющих историческое изложение.
- source_word: διὰ τὸ πλῆθος τῆς ὕλης
  choice: из-за обилия материала
  rationale: ὕλη здесь означает материал или предмет изложения, а не вещество либо древесину; оборот сохраняет причинную связь.
