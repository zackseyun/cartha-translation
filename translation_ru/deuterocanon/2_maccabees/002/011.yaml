  yaml_path: translation/deuterocanon/2_maccabees/002/011.yaml
  text: And after many years had passed[a], when it pleased God, Nehemiah, having been sent by the king of Persia, sent the descendants of the priests who had hidden it to get the fire.
translation:
  language: ru
  text: Когда же прошло много лет и Богу было угодно[a], Неемия, посланный царём Персии, послал за огнём потомков тех священников, которые его спрятали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог счёл это своевременным»; или: «Бог счёл нужным».'
    reason: Лексическая вариативность оборота ἔδοξεν τῷ θεῷ.
lexical_decisions:
- source_word: διελθόντων δὲ ἐτῶν ἱκανῶν
  choice: Когда же прошло много лет
  rationale: Родительный самостоятельный оборот обозначает истекшее время; ἱκανῶν здесь естественно передаётся как «много», а δέ — повествовательной частицей «же».
- source_word: ὅτε ἔδοξεν τῷ θεῷ
  choice: и Богу было угодно
  rationale: Оборот ἔδοξεν с дательным означает «было угодно» или «представилось правильным». Русская формула сохраняет указание на Божью волю и время действия, не усиливая его дополнительными богословскими выводами.
- source_word: ἀποσταλεὶς Νεεμίας ἀπὸ τοῦ βασιλέως τῆς Περσίδος
  choice: Неемия, посланный царём Персии
  rationale: Аористное страдательное причастие обозначает предшествующее поручение Неемии; ἀπό при лице передаёт источник поручения или действующее лицо.
- source_word: τοὺς ἐκγόνους τῶν ἱερέων τῶν ἀποκρυψάντων
  choice: потомков тех священников, которые его спрятали
  rationale: ἐκγόνους обозначает потомков, не обязательно непосредственных сыновей. Относительное придаточное ясно связывает сокрытие именно со священниками; местоимение «его» по контексту относится к огню.
- source_word: ἔπεμψεν ἐπὶ τὸ πῦρ
  choice: послал за огнём
  rationale: πέμπω с ἐπί и винительным здесь выражает направление или цель отправки — разыскать и принести огонь. «Послал за огнём» кратко и естественно передаёт этот смысл.
theological_decisions:
- issue: Божественное волеизъявление в ὅτε ἔδοξεν τῷ θεῷ
  choice: Богу было угодно
  alternative: Бог счёл это своевременным; Бог счёл нужным
  rationale: Выбранная формула близка греческой идиоме и сохраняет сдержанное указание на Божье решение, не уточняя его основания и не вводя более сильных доктринальных утверждений.
translation_notes:
  register: 'Современный литературный русский язык с умеренно высоким, повествовательным библейским регистром. Порядок слов перестроен ради ясности: оборот «послал за огнём» поставлен перед дополнением, при этом синтаксические связи греческого текста сохранены.'
