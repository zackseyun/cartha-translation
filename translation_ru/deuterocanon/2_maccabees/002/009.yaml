base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/009.yaml
  text: Since we are about to celebrate the purification of the temple on the twenty-fifth of Chislev[a], we thought it necessary to make this clear to you, so that you also may celebrate the festival of booths and of the fire, when Nehemiah, who built the temple and the altar[c][b], offered sacrifices.
translation:
  language: ru
  text: Поскольку мы намерены праздновать очищение храма двадцать пятого кислева, мы сочли необходимым разъяснить вам это, чтобы и вы праздновали праздник Кущей[a] и огня[b], когда Неемия, построивший[c] храм и жертвенник, принёс жертвы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праздник Шалашей»; традиционное название — праздник Кущей.'
    reason: lexical_alternative
  - marker: b
    text: Слова «и огня» в греческом тексте выражены сжато; вероятно, имеется в виду памятное празднование, связанное с жертвоприношением Неемии и рассказом об огне в дальнейшем повествовании.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «построивший». Исторический контекст может подразумевать «восстановивший», но сам греческий текст этого прямо не уточняет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλοντες ἄγειν
  choice: мы намерены праздновать
  rationale: ἄγω с названием праздника означает «праздновать, отмечать», а μέλλοντες передаёт предстоящее намерение.
- source_word: ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι
  choice: двадцать пятого кислева
  rationale: Естественная русская форма даты; Χασελεὺ обозначает месяц кислев.
- source_word: τὸν καθαρισμὸν τοῦ ἱεροῦ
  choice: очищение храма
  rationale: καθαρισμός означает очищение, а ἱερόν в данном контексте — храм.
- source_word: δέον ἡγησάμεθα διασαφῆσαι ὑμῖν
  choice: мы сочли необходимым разъяснить вам это
  rationale: Передаёт как суждение о необходимости, так и значение διασαφέω — ясно объяснить.
- source_word: ἵνα καὶ αὐτοὶ ἄγητε
  choice: чтобы и вы праздновали
  rationale: Сохраняет целевое значение ἵνα, усиление καὶ αὐτοί и праздничное употребление ἄγω.
- source_word: σκηνοπηγίας
  choice: праздник Кущей
  rationale: Смысловое русское название иудейского праздника; оно понятно и сохраняет образ временных жилищ.
- source_word: καὶ τοῦ πυρός
  choice: и огня
  rationale: Краткая эллиптическая формулировка оригинала сохранена без добавления отсутствующего пояснения.
- source_word: ὅτε Νεεμίας
  choice: когда Неемия
  rationale: Буквально сохраняет временную связь, выраженную ὅτε, не разрешая её синтаксическую неоднозначность.
- source_word: ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον
  choice: построивший храм и жертвенник
  rationale: οἰκοδομέω прямо означает «строить»; исторически возможное «восстановивший» не внесено в основной текст.
- source_word: ἀνήνεγκεν θυσίας
  choice: принёс жертвы
  rationale: В жертвенном контексте ἀναφέρω означает приносить жертву; выбранное выражение естественно для современного литературного русского языка.
theological_decisions:
- issue: Передача σκηνοπηγίας
  choice: праздник Кущей
  alternative: праздник Шалашей; праздник Кущей (Суккот)
  rationale: Выбранное название сохраняет буквальный образ греческого слова и укоренено в русском библейском словоупотреблении, не добавляя конфессионального толкования.
- issue: Толкование καὶ τοῦ πυρός
  choice: и огня
  alternative: и праздник Огня; и праздник, связанный с огнём
  rationale: Греческая фраза сжата и допускает эллипсис. Основной текст сохраняет эту неясность, а примечание сообщает вероятную связь с последующим рассказом.
- issue: Значение οἰκοδομήσας
  choice: построивший
  alternative: восстановивший
  rationale: Хотя исторический контекст может предполагать восстановление, в самом греческом глаголе нет приставки или иного явного указания на повторное строительство.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис по возможности естественный, но эллиптичность выражения «и огня» и временная связь «когда Неемия» намеренно не сглажены толковательным пересказом. Все маркеры примечаний размещены непосредственно при соответствующих выражениях.
