base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/040.yaml
  text: The same things were also related in the records and in the memoirs concerning Nehemiah[a], and how, in founding a library, he gathered together the books about the kings and prophets, and the writings of David[b], and letters of kings concerning votive offerings.
translation:
  language: ru
  text: 'О том же рассказывалось и в записях, и в памятных записках, относящихся к Неемии: как он, основывая библиотеку[a], собрал книги о царях и пророках, сочинения Давида и царские письма о посвящённых дарах[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устраивая библиотеку». Греческое причастие может обозначать основание или учреждение библиотеки.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть о дарах, посвящённых Богу; возможны также переводы: «об обетных приношениях» или «о посвящённых предметах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξηγοῦντο
  choice: рассказывалось
  rationale: Безличная форма естественно передаёт неопределённый субъект греческого глагола во множественном числе и сохраняет смысл сообщения, содержащегося в письменных источниках.
- source_word: ἀναγραφαῖς
  choice: записях
  rationale: Широкое обозначение письменных или архивных записей; современное и понятное русское соответствие.
- source_word: ὑπομνηματισμοῖς
  choice: памятных записках
  rationale: Передаёт характер записей, служащих для сохранения памяти, не придавая им более узкого значения формального комментария.
- source_word: τοῖς κατὰ τὸν Νεεμίαν
  choice: относящихся к Неемии
  rationale: Сохраняет широкое значение связи с Неемией и не утверждает однозначно, что именно он был автором этих записок.
- source_word: καταβαλλόμενος
  choice: основывая
  rationale: В сочетании с βιβλιοθήκην причастие обозначает учреждение или устройство библиотеки, а не буквальное закладывание физического основания.
- source_word: βιβλιοθήκην
  choice: библиотеку
  rationale: Прямое и естественное обозначение собрания книг.
- source_word: ἐπισυνήγαγεν
  choice: собрал
  rationale: Передаёт собирание разрозненных материалов в одно целое без ненужной тяжеловесности.
- source_word: τὰ περὶ τῶν βασιλέων καὶ προφητῶν βιβλία
  choice: книги о царях и пророках
  rationale: Предлог περὶ здесь естественно означает «о, касательно»; перевод не приписывает эти книги царям и пророкам как авторам.
- source_word: τὰ τοῦ Δαυείδ
  choice: сочинения Давида
  rationale: Раскрывает греческий эллипсис, не уточняя жанр и не сводя выражение исключительно к псалмам.
- source_word: ἐπιστολὰς βασιλέων
  choice: царские письма
  rationale: Естественно передаёт письма, исходившие от царей, в сжатой литературной форме.
- source_word: περὶ ἀναθεμάτων
  choice: о посвящённых дарах
  rationale: В храмовом контексте ἀναθέματα — предметы или дары, посвящённые Богу; этот перевод избегает вводящего в заблуждение позднейшего значения слова «анафема».
theological_decisions:
- issue: Значение ἀναθεμάτων
  choice: посвящённые дары
  alternative: обетные приношения; посвящённые предметы
  rationale: Контекст говорит о царских письмах, касавшихся даров, посвящённых Богу. Формулировка сохраняет культовый смысл и не привносит позднейшего значения церковного отлучения.
translation_notes:
  register: Современный литературный русский язык с умеренно книжным, историко-повествовательным звучанием. Синтаксис сохраняет последовательность греческого перечисления, но остаётся понятным широкому кругу читателей. Маркеры сносок размещены непосредственно при словах, которые они поясняют.
