translation:
  language: ru
  text: Прими жертву за весь Твой народ, Израиль, и сохрани Твой удел[a], и освяти его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоё наследие». Под «Твоим уделом», вероятно, подразумевается Израиль как принадлежащий Богу народ.'
    reason: alternative_reading
lexical_decisions:
- source_word: πρόσδεξαι
  choice: Прими
  rationale: Аористный императив среднего залога от προσδέχομαι в молитвенном контексте означает благосклонно принять жертвоприношение; «прими» естественно и сохраняет культовый смысл.
- source_word: θυσίαν
  choice: жертву
  rationale: θυσία обозначает жертву или жертвоприношение; «жертву» передаёт культовую конкретность греческого слова.
- source_word: ὑπὲρ παντὸς τοῦ λαοῦ σου Ἰσραήλ
  choice: за весь Твой народ, Израиль
  rationale: ὑπέρ с родительным выражает действие ради или от имени народа; «за весь» кратко и точно передаёт значение пользы или представительства, а приложение «Израиль» оформлено естественно по-русски.
- source_word: διαφύλαξον
  choice: сохрани
  rationale: διαφυλάσσω означает беречь, сохранять, оберегать; «сохрани» соответствует молитвенному регистру.
- source_word: τὴν μερίδα σου
  choice: Твой удел
  rationale: μερίς — доля, часть, удел. «Удел» сохраняет метафору принадлежности Богу и её библейский оттенок, не истолковывая её прямо как «народ» или «наследие».
- source_word: καθαγίασον
  choice: освяти его
  rationale: καθαγιάζω означает освящать, посвящать как святое; местоимение «его» грамматически соотнесено с существительным «удел» и восполняет подразумеваемое дополнение.
theological_decisions:
- issue: Кого или что обозначает «Твой удел»
  choice: Сохранить метафору «Твой удел», вероятнее всего относящуюся к Израилю как принадлежащему Богу народу.
  alternative: «Твоё наследие» или прямое истолкование «Твой народ».
  rationale: Греческий текст сохраняет метафорическое μερίδα и не раскрывает её явно. Перевод «удел» передаёт заветный оттенок, не устраняя смысловую многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Прописные буквы в местоимениях «Твой» отражают традиционный русский религиозный регистр; синтаксис остаётся простым и понятным.
