  text: And it was also made clear that[a], as one having wisdom[b], he offered a sacrifice for the dedication and completion of the sanctuary.
translation:
  language: ru
  text: Разъяснялось также, что он, обладая мудростью, принёс жертву для освящения[a] и завершения святилища[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повторного освящения». Исторический контекст может подразумевать повторное освящение, но греческое слово само по себе означает «освящение» или «посвящение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «окончательного освящения святилища». Греческое слово может иметь культовый смысл доведения чего-либо до полной священной готовности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεσαφείτο
  choice: разъяснялось
  rationale: Имперфект передаёт продолжающееся изложение или разъяснение; безличная форма естественно отражает греческий пассив.
- source_word: ὡς σοφίαν ἔχων
  choice: обладая мудростью
  rationale: Сохраняет обстоятельственную неоднозначность ὡς с причастным оборотом, не сводя её однозначно к причине.
- source_word: ἀνήνεγκεν θυσίαν
  choice: принёс жертву
  rationale: В культовом контексте ἀναφέρω означает принесение жертвы; это устойчивое и ясное русское выражение.
- source_word: ἐγκαινισμοῦ
  choice: освящения
  rationale: Передаёт посвящение святилища для священного употребления; исторически возможно повторное освящение, но приставочное значение «пере-» в самом слове не выражено.
- source_word: τελειώσεως
  choice: завершения
  rationale: Сохраняет основное значение доведения до полноты или завершения, не делая культовый оттенок единственно возможным.
- source_word: τοῦ ἱεροῦ
  choice: святилища
  rationale: ἱερόν обозначает храмовое священное пространство; «святилище» сохраняет сакральный оттенок и не сужает значение до здания.
theological_decisions:
- issue: Культовый оттенок τελειώσεως
  choice: завершения
  alternative: посвящения / окончательного освящения
  rationale: Основной текст сохраняет широкое лексическое значение, а примечание указывает на возможный культовый смысл доведения святилища до полной священной готовности.
- issue: Исторический смысл ἐγκαινισμοῦ
  choice: освящения
  alternative: повторного освящения
  rationale: Маккавейский контекст допускает восстановительное, повторное освящение, однако греческое существительное само по себе прямо не выражает повторности.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный регистр. Синтаксис сохраняет последовательность греческого текста, но избегает неестественной буквальности. Причастный оборот намеренно не получает однозначно причинного толкования.
