  yaml_path: translation/deuterocanon/2_maccabees/002/059.yaml
  text: Therefore let us begin the narrative from this point[a], adding only this much to what has been said before; for it is foolish to be excessive before the history[b], but to abridge the history itself.
translation:
  language: ru
  text: 'Итак, отсюда начнём повествование[a], добавив к сказанному выше лишь это: неразумно быть многословным перед изложением событий[b], а само изложение сокращать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассказ»; греческое διήγησις означает связный рассказ или повествовательное изложение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чрезмерно распространяться перед историей, а саму историю сокращать». Здесь «история» означает основное изложение событий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντεῦθεν οὖν
  choice: Итак, отсюда
  rationale: Сочетание передаёт и выводно-переходную силу οὖν, и указание Ἐντεῦθεν на точку, от которой автор переходит к основной части труда.
- source_word: ἀρξώμεθα
  choice: начнём
  rationale: Форма первого лица множественного числа, сослагательное наклонение с побудительным значением; русское «начнём» естественно передаёт авторское приглашение перейти к рассказу.
- source_word: τῆς διηγήσεως
  choice: повествование
  rationale: διήγησις обозначает связный рассказ или изложение; «повествование» сохраняет литературный регистр и не сужает значение до вымышленной истории.
- source_word: τοῖς προειρημένοις τοσοῦτον ἐπιζεύξαντες
  choice: добавив к сказанному выше лишь это
  rationale: Передаёт присоединение последнего краткого замечания к уже сказанному; «лишь» выявляет ограничительный оттенок τοσοῦτον в данном контексте.
- source_word: εὔηθες
  choice: неразумно
  rationale: В контексте слово осуждает неудачный литературный приём. «Неразумно» звучит достойно и естественно, не придавая фразе излишне резкого или насмешливого тона.
- source_word: τὸ μὲν πρὸ τῆς ἱστορίας πλεονάζειν
  choice: быть многословным перед изложением событий
  rationale: πλεονάζειν здесь означает чрезмерно распространяться во вступлении, а ἱστορία — основное изложение событий. Выбор делает литературный контраст ясным по-русски.
- source_word: τὴν δὲ ἱστορίαν ἐπιτέμνειν
  choice: а само изложение сокращать
  rationale: ἐπιτέμνειν означает сокращать или урезать; повтор «изложение» сохраняет прямой контраст между пространным предисловием и сокращённой основной частью.
