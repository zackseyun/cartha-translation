    rationale: Оборот «Подобно тому как нелегко тому, кто..., всё же...» в современном русском требует соотносительной части («так и мы») либо иной перестройки. Греческое καθάπερ вводит сопоставление с трудом автора; его следует выразить грамматически полноценной русской конструкцией.
  - severity: low
    issue: Ослабление значения κακοπάθεια
    rationale: «Этот труд» допустим по контексту, но не передаёт оттенок тяжёлого, мучительного усилия. «Этот тягостный труд» точнее и не излишне усиливает исходный смысл.
  revised_text: Как тому, кто готовит пир и заботится о пользе других, нелегко, так и мы ради благодарности многих охотно перенесём этот тягостный труд.
