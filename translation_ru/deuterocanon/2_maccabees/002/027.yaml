  text: Just as it is not easy for one who prepares a banquet and seeks the advantage of others[a], yet for the gratitude of the many we will gladly endure the hardship;
translation:
  language: ru
  text: Как тому, кто готовит пир и заботится о пользе других, нелегко, так и мы ради благодарности многих охотно перенесём этот тягостный труд.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ
  choice: Подобно тому как
  rationale: Сохраняет сравнительную связь с предшествующим рассуждением и естественно вводит образ устроителя пира.
- source_word: τῷ παρασκευάζοντι συμπόσιον
  choice: тому, кто готовит пир
  rationale: Дательный обозначает лицо, для которого дело нелегко; «пир» передаёт торжественную совместную трапезу.
- source_word: ζητοῦντι τὴν ἑτέρων λυσιτέλειαν
  choice: и заботится о пользе других
  rationale: ζητέω здесь выражает целенаправленное стремление, а λυσιτέλεια — пользу или благо; «заботится о пользе» звучит по-русски естественно, не добавляя чуждого смысла.
- source_word: οὐκ εὐχερές
  choice: нелегко
  rationale: Кратко и прямо передаёт безличное указание на трудность.
- source_word: ὅμως
  choice: всё же
  rationale: Сохраняет уступительный переход к готовности автора понести труд.
- source_word: διὰ τὴν τῶν πολλῶν εὐχαριστίαν
  choice: ради благодарности многих
  rationale: εὐχαριστία имеет здесь обычное значение благодарности; оборот с «ради» передаёт мотив предпринятого труда.
- source_word: ἡδέως
  choice: охотно
  rationale: Передаёт добровольную и радостную готовность несмотря на трудность.
- source_word: τὴν κακοπάθειαν ὑποίσομεν
  choice: мы охотно перенесём этот труд
  rationale: ὑποίσομεν означает «понесём/перенесём», а κακοπάθεια в контексте литературной работы — тягостный труд; указательное «этот» естественно отсылает к описываемой работе.
theological_decisions:
- issue: Значение εὐχαριστία
  choice: благодарность
  alternative: Евхаристия; благодарение
  rationale: В данном эллинистическом иудейском контексте слово обозначает обычную благодарность многих людей. Литургическое «Евхаристия» было бы анахроничным привнесением более позднего специального значения.
translation_notes:
  register: Современный литературный русский язык с достойным, но общедоступным звучанием. Синтаксис сохраняет образ пира и уступительное напряжение греческой фразы; точка с запятой исходного контекста заменена точкой как завершение отдельного стиха.
