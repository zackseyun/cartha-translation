base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/010.yaml
  text: For when our fathers were being led away into Persia[a], the devout priests secretly took some of the fire from the altar and hid it in the hollow of a dry well, where they secured it so that the place would be unknown to everyone.
translation:
  language: ru
  text: Ибо когда наших отцов уводили в Персию, благочестивые священники тайно взяли с жертвенника огонь и спрятали его в углублении безводного колодца[a], где обеспечили его сохранность, так что это место оставалось неизвестным всем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в полости безводного колодца (ямы)». Греческое описание сжато и несколько необычно: оно соединяет слова, обозначающие углубление или полость, колодец или яму и отсутствие воды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγοντο
  choice: уводили
  rationale: Пассивный имперфект в данном контексте указывает на насильственное переселение; «уводили» передаёт и длительность, и несвободу действия, не добавляя излишней конкретики.
- source_word: εἰς τὴν Περσικὴν
  choice: в Персию
  rationale: Выражение обозначает персидскую землю; по-русски естественно передаётся названием страны.
- source_word: εὐσεβεῖς
  choice: благочестивые
  rationale: Слово сохраняет религиозную характеристику священников и соответствует dignified modern literary register.
- source_word: λαβόντες ἀπὸ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: взяли огонь с жертвенника
  rationale: Конструкция означает, что был взят огонь, находившийся на жертвеннике. Русское выражение не требует добавления «часть», хотя частичный смысл возможен по контексту.
- source_word: λαθραίως
  choice: тайно
  rationale: Передаёт скрытый характер действия без усиления до «крадучись».
- source_word: κατέκρυφαν
  choice: спрятали
  rationale: Прямое и естественное соответствие глаголу сокрытия; «закопали» внесло бы отсутствующую в тексте подробность.
- source_word: ἐν κοιλώματι φρέατος τάξιν ἔχοντος ἀνύδρου
  choice: в полости безводного колодца
  rationale: 'Перевод сохраняет оба основных образа сжатого и несколько неловкого греческого выражения: полость/углубление и колодец либо яму, не содержащую воды.'
- source_word: κατησφαλίσαντο
  choice: надёжно укрыли его
  rationale: Средний залог выражает действие по обеспечению сохранности спрятанного огня; формулировка не уточняет, был ли тайник запечатан, закрыт или защищён иным способом.
- source_word: ὥστε πᾶσιν ἄγνωστον εἶναι τὸν τόπον
  choice: так что это место осталось никому не известным
  rationale: Передаёт результат действия и сохраняет акцент греческого текста на неизвестности самого места для всех.
theological_decisions:
- issue: Значение сохранения огня с жертвенника
  choice: Стих повествует о тайном сохранении священниками жертвеннического огня во время переселения, не формулируя его дальнейшего богословского или обрядового значения.
  alternative: Действие можно понимать как заботу о преемственности богослужения после изгнания либо как благоговейное сохранение святыни.
  rationale: Сам стих сообщает о благочестивом поступке, но не объясняет его доктринальный смысл; перевод не навязывает более позднего литургического истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя, при этом необычность описания тайника не устранена полностью и пояснена в сноске.
