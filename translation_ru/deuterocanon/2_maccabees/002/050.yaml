translation:
  language: ru
  text: Изложенное Иасоном Киренским в пяти книгах мы постараемся сократить до одного сочинения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изложить в сокращённом виде»; греческий глагол означает создание краткой версии более пространного письменного труда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλωθέντα
  choice: изложенное
  rationale: Причастие обозначает материал, представленный Иасоном в письменном труде; «изложенное» естественно передаёт литературный контекст, не сводя смысл только к «разъяснённому».
- source_word: διὰ πέντε βιβλίων
  choice: в пяти книгах
  rationale: διά с родительным здесь указывает на литературную форму или объём труда; по-русски естественно «в пяти книгах».
- source_word: πειρασόμεθα
  choice: мы постараемся
  rationale: Будущее среднего залога выражает намерение-попытку и сохраняет скромный тон автора.
- source_word: διʼ ἑνὸς συντάγματος
  choice: до одного сочинения
  rationale: σύνταγμα означает составленный письменный труд. В сочетании с глаголом сокращения оборот «до одного сочинения» ясно передаёт противопоставление пяти книг единому труду.
- source_word: ἐπιτεμεῖν
  choice: сократить
  rationale: Глагол означает сократить более пространное письменное произведение, создав его сжатую версию; «сократить» понятно современному читателю и точно в данном контексте.
- source_word: ὑπὸ Ἰάσονος τοῦ Κυρηναίου
  choice: Иасоном Киренским
  rationale: Передаёт деятеля при страдательном причастии и географическое наименование в традиционной русской библейской форме.
