base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/058.yaml
  text: But the pursuit of brevity in expression[a], and the refusal of an elaborate treatment of the subject, should be allowed to one who is making an abridgment.
translation:
  language: ru
  text: Но тому, кто составляет сокращённое изложение[a], следует позволить стремиться к краткости слога и отказываться от подробной разработки материала.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто делает перевод», если μετάφρασις понимать в её более обычном значении; однако здесь контекст указывает на сокращённое изложение, или эпитому.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντομον
  choice: краткость
  rationale: Субстантивированное прилагательное обозначает краткость литературного изложения; это естественный и точный русский эквивалент.
- source_word: λέξεως
  choice: слога
  rationale: Здесь λέξις означает способ словесного выражения, а не отдельное слово. «Краткость слога» естественно передаёт литературный контекст.
- source_word: μεταδιώκειν
  choice: стремиться
  rationale: Инфинитив выражает сознательно избранную цель составителя; «стремиться» сохраняет этот смысл без излишнего усиления.
- source_word: ἐξεργαστικὸν τῆς πραγματίας
  choice: подробная разработка материала
  rationale: Выражение относится к обстоятельному раскрытию обрабатываемого материала и противопоставлено краткости.
- source_word: παραιτεῖσθαι
  choice: отказываться
  rationale: Средний залог передаёт намеренное уклонение или отказ от подробной разработки.
- source_word: τῷ τὴν μετάφρασιν ποιουμένῳ
  choice: тому, кто составляет сокращённое изложение
  rationale: Хотя μετάφρασις может означать перевод, контекст предисловия говорит о сокращённом переложении более обширного труда Иасона Киринейского.
- source_word: συγχωρητέον
  choice: следует позволить
  rationale: Отглагольное прилагательное выражает то, что надлежит допустить или признать за составителем.
theological_decisions:
- issue: Значение μετάφρασις в данном контексте
  choice: сокращённое изложение
  alternative: перевод
  rationale: В предисловии автор описывает сокращение более обширного сочинения, поэтому контекст поддерживает значение «сокращённое переложение». Лексическая возможность значения «перевод» сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно книжным достоинством, соответствующим авторскому рассуждению о приёмах изложения. Синтаксис сохраняет противопоставление краткости и подробной разработки.
