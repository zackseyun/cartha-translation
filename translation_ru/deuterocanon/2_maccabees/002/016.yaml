lexical_decisions:
- source_word: ὁ μόνος χορηγός
  choice: единственный Благодетель
  rationale: χορηγός обозначает того, кто предоставляет необходимое и оказывает благодеяния. «Благодетель» естественно звучит как торжественное наименование Бога и передаёт не только снабжение, но и благотворное дарование.
- source_word: ὁ μόνος δίκαιος
  choice: единственный Праведный
  rationale: Субстантивированное прилагательное обозначает Личность; «Праведный» сохраняет нравственный и судебный оттенки δίκαιος, а повтор «единственный» — подчёркнутую исключительность.
- source_word: παντοκράτωρ
  choice: Вседержитель
  rationale: Традиционное и понятное русское божественное наименование, передающее власть и могущество над всем.
- source_word: αἰώνιος
  choice: Вечный
  rationale: Краткое и естественное соответствие в ряду торжественных божественных наименований.
- source_word: ὁ διασώζων
  choice: спасающий
  rationale: διασώζω выражает избавление и сохранение невредимым; «спасающий» сохраняет широкий смысл и хорошо сочетается с «от всякого зла».
- source_word: ἐκ παντὸς κακοῦ
  choice: от всякого зла
  rationale: κακόν может означать зло, беду или вред. «Всякое зло» сохраняет смысловую широту и не ограничивает выражение только бедствиями.
- source_word: ὁ ποιήσας τοὺς πατέρας ἐκλεκτούς
  choice: избравший отцов
  rationale: Буквальная конструкция «сделавший отцов избранными» неестественна по-русски; «избравший» точно и ясно передаёт результат ποιέω с предикативным ἐκλεκτούς.
- source_word: ἡγίασας αὐτούς
  choice: освятивший их
  rationale: «Освятить» передаёт как придание святости, так и посвящение или отделение для Бога, сохраняя богословскую ёмкость глагола.
theological_decisions:
- issue: Последовательность божественных наименований
  choice: 'Сохранён ряд приложений и причастных определений: «единственный Благодетель, единственный Праведный, Вседержитель и Вечный, спасающий…»'
  alternative: «Он один благотворит; Он один праведен, всемогущ и вечен…»
  rationale: В греческом тексте стоят артиклевые наименования и причастия в приложении. Именная структура сохраняет торжественный молитвенный строй и не превращает титулы в самостоятельные утверждения.
- issue: Смысл ποιήσας τοὺς πατέρας ἐκλεκτούς
  choice: «избравший отцов»
  alternative: «сделавший отцов избранными»
  rationale: Выбран естественный русский способ выразить Божье действие избрания без добавления конфессионально обусловленного содержания.
- issue: Значение ἡγίασας
  choice: «освятивший их»
  alternative: «посвятивший их» / «сделавший их святыми»
  rationale: «Освятивший» сохраняет присущую греческому глаголу открытость между приданием святости и посвящением Богу.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Прописные буквы в субстантивированных божественных наименованиях помогают распознать ряд титулов. Синтаксическая незавершённость и конечная точка с запятой сохранены, поскольку стих представляет собой часть продолжающейся молитвенной конструкции.
