lexical_decisions:
- source_word: περιφράξας
  choice: оградив это место
  rationale: 'Аористное причастие передаёт действие, предшествующее основному: царь окружил подразумеваемый объект оградой или иной защитой. «Это место» естественно восполняет невыраженное в греческом дополнение, не уточняя вид сооружения.'
- source_word: ἱερὸν
  choice: святилищем
  rationale: Ἱερόν может обозначать храм, священное место или храмовый участок. «Святилище» сохраняет широкий сакральный смысл и не отождествляет место непременно с Иерусалимским храмом.
- source_word: ἐποίησεν
  choice: сделал
  rationale: Прямой эквивалент широкого по значению ποιέω; не решает без достаточных оснований, идёт ли речь о строительстве, учреждении или посвящении.
- source_word: δοκιμάσας
  choice: проверив
  rationale: Δοκιμάζω означает испытывать, исследовать или удостоверяться посредством проверки. «Проверив» звучит естественно и не утверждает прямо, что результатом было одобрение.
- source_word: τὸ πρᾶγμα
  choice: это дело
  rationale: Πρᾶγμα здесь имеет общее значение дела, обстоятельства или предмета обсуждения. «Это дело» сохраняет контекстуальную широту выражения.
