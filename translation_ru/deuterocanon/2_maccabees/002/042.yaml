  text: Итак[a], если вам это нужно, пошлите людей, которые доставят вам эти книги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте условный союз «если» (ἐὰν) повторён дважды; вероятно, это особенность передачи текста или случайное удвоение. В переводе он дан один раз в соответствии с ясным смыслом фразы.
