lexical_decisions:
- source_word: ἐὰν ... χρείαν ἔχητε
  choice: если вам это нужно
  rationale: Оборот χρείαν ἔχειν означает «нуждаться, иметь потребность». Местоимение «это» естественно отсылает к упомянутым в контексте книгам, не внося их прямо в условную часть.
- source_word: οὖν
  choice: итак
  rationale: Частица выражает переход или вывод; «итак» естественно звучит в современном русском письме и сохраняет связующую функцию.
- source_word: τοὺς ἀποκομιούντας
  choice: людей, которые доставят вам эти книги
  rationale: Субстантивированное причастие обозначает тех, кто перенесёт или доставит подразумеваемый предмет адресатам. «Людей» делает конструкцию естественной по-русски, а «эти книги» эксплицирует контекстуально подразумеваемый объект.
- source_word: ὑμῖν
  choice: вам
  rationale: Дательный падеж обозначает адресатов доставки.
- source_word: ἀποστείλατε
  choice: пошлите
  rationale: Аористный императив передаёт прямое разовое побуждение; «пошлите» соответствует эпистолярному контексту.
- source_word: ἐὰν οὖν ἐὰν
  choice: итак, если
  rationale: Повтор ἐὰν в переданном греческом тексте выглядит текстовой нерегулярностью или ошибочным удвоением. В основном тексте условный союз передан один раз, а особенность источника отмечена в сноске.
