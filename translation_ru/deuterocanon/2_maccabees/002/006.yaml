lexical_decisions:
- source_word: προθεμένων αὐτά
  choice: разложили всё это
  rationale: Глагол передаёт размещение предметов перед кем-либо, а местоимение не называет их прямо. «Всё это» сохраняет отсылку к предшествующему контексту, не уточняя предметы.
- source_word: τῶν ἱερέων τοῦ Ναναίου
  choice: жрецы Нанеи
  rationale: Для служителей языческого культа естественно современное «жрецы»; имя божества передано как «Нанея», согласованно с греческой формой Ναναίου.
- source_word: κἀκεῖνον προσελθόντος μετʼ ὀλίγων
  choice: и он с немногими людьми вошёл
  rationale: Местоимение сохранено без явной замены на имя; подразумеваемые спутники обозначены как люди. В сочетании с εἰς выражение естественно передаёт прибытие внутрь ограды.
- source_word: περίβολον τοῦ τεμένους
  choice: ограду святилища
  rationale: περίβολος обозначает ограждённую территорию или ограду священного участка; формулировка сохраняет отличие от последующего ἱερόν.
- source_word: συγκλείσαντες τὸ ἱερόν
  choice: они заперли храм
  rationale: συγκλείω означает плотно закрыть, заключив вошедших внутри; «заперли» естественно выражает действие, а «храм» отличает ἱερόν от священного участка.
- source_word: ὡς εἰσῆλθεν Ἀντίοχος
  choice: как только Антиох вошёл
  rationale: ὡς с аористом имеет временное значение и здесь подчёркивает непосредственность действия.
