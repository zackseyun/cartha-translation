base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/029.yaml
  text: For just as the architect of a new house must take thought for the whole structure[a], but the one undertaking to decorate it with painted ornament must consider the things suitable for adornment, so also, I think, it is with us.
translation:
  language: ru
  text: Ибо, подобно тому как архитектор нового дома должен заботиться обо всём основании здания, а тот, кто берётся его отделывать и расписывать, должен рассмотреть, что подходит для украшения, так, думаю, обстоит дело и в нашем случае.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθάπερ γάρ
  choice: ведь как
  rationale: Сохраняет причинно-пояснительную связь γάρ и вводимое καθάπερ сравнение, оставаясь естественным по-русски.
- source_word: ἀρχιτέκτονι
  choice: архитектор
  rationale: Передаёт руководителя и устроителя строительного замысла, а не просто рядового строителя.
- source_word: τῆς ὅλης καταβολῆς
  choice: о закладке всего здания
  rationale: Καταβολή обозначает закладку, основание или начало сооружения; предложенная формулировка сохраняет строительный образ и охват всего проекта, не сводя смысл только к материальному фундаменту.
- source_word: φροντιστέον
  choice: должен позаботиться
  rationale: Передаёт выраженную отглагольным прилагательным необходимость и значение тщательной заботы.
- source_word: ἐγκαινίζειν
  choice: отделывать
  rationale: В сочетании с росписью и украшением слово указывает на приведение дома в готовый, оформленный вид; более широкая смысловая возможность отмечена в сноске.
- source_word: ζωγραφεῖν
  choice: расписывать
  rationale: В архитектурном контексте речь идёт о декоративной живописи; «расписывать» конкретно, но не вводит неподтверждённую технику вроде энкаустики.
- source_word: τὰ ἐπιτήδεια πρὸς διακόσμησιν ἐξεταστέον
  choice: должен рассмотреть, что подходит для украшения
  rationale: Сохраняет обязанность внимательно определить пригодное для оформления, не сужая τὰ ἐπιτήδεια исключительно до материалов.
- source_word: οὕτως δοκῶ καὶ ἐπὶ ἡμῶν
  choice: так, думаю, обстоит дело и с нами
  rationale: Естественно завершает аналогию и сохраняет сдержанную авторскую оговорку δοκῶ.
