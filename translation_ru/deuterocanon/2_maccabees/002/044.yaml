    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ θεός
  choice: Но Бог
  rationale: δέ связывает фразу с предшествующим контекстом и допускает лёгкий оттенок противопоставления; «Но Бог» естественно передаёт эту связь.
- source_word: ὁ σώσας τὸν πάντα λαὸν αὐτοῦ
  choice: спасший весь Свой народ
  rationale: Аористное причастие обозначает совершённое спасительное действие, а конструкция с πᾶς охватывает народ как единое целое.
- source_word: ἀποδοὺς
  choice: давший
  rationale: ἀποδίδωμι может означать как «дать», так и «возвратить». Нейтральное «давший» не вводит в основной текст явно не выраженную здесь мысль о прежней утрате; вариант «возвративший» отмечен в сноске.
- source_word: τὴν κληρονομίαν αὐτοῦ πᾶσιν
  choice: давший всем Своё наследие
  rationale: Сохраняются единственное число притяжательного местоимения и краткое распределительное πᾶσιν. Возвратное «Своё» естественно соотносит наследие с Богом как субъектом.
- source_word: τὸ βασίλειον
  choice: царскую власть
  rationale: В ряду со священством и освящением слово уместно понимать как царское правление или достоинство, не сводя его непременно к территории государства.
- source_word: τὸ ἱεράτευμα
  choice: священство
  rationale: Естественный русский термин для священнического служения или установления.
- source_word: τὸν ἁγιασμόν
  choice: освящение
  rationale: Слово сохраняет отвлечённый и богословско-культовый характер ἁγιασμός; возможные оттенки святости и посвящения вынесены в сноску.
theological_decisions:
- issue: К кому относится αὐτοῦ в выражении «Его наследие»
  choice: 'Местоимение соотнесено с Богом: «Своё наследие».'
  alternative: 'По контексту возможно понимать наследие как принадлежащее народу: «их наследие».'
  rationale: Грамматически ближайшим референтом αὐτοῦ является Бог. Основной текст сохраняет эту связь, а контекстуально возможное понимание указано в сноске.
- issue: Значение βασίλειον
  choice: царская власть
  alternative: царство; царское достоинство
  rationale: Абстрактное значение согласуется с перечислением заветных даров и не ограничивает смысл территориальным царством; неоднозначность сохранена в сноске.
- issue: Значение ἁγιασμός
  choice: освящение
  alternative: святость; посвящение
  rationale: «Освящение» сохраняет форму отвлечённого существительного и культово-богословскую насыщенность греческого слова, не устраняя другие возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Причастные конструкции сохраняют связь с греческим синтаксисом, а запятая в конце показывает, что фраза продолжается. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской издательской традиции.
