  yaml_path: translation/deuterocanon/2_maccabees/002/034.yaml
  text: But when Jeremiah learned of it[a], he reproved them and said, “The place will remain unknown until God gathers his people together and shows mercy.”
translation:
  language: ru
  text: 'Но когда Иеремия узнал об этом[a], он упрекнул их и сказал: «Это место останется неизвестным, пока Бог не соберёт народ воедино и не явится милость».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данном греческом издании стоит форма ἔγνων, обычно означающая «я узнал»; при подлежащем «Иеремия» по смыслу и грамматике ожидалась бы форма ἔγνω, «он узнал».
    reason: textual_difficulty
  - marker: b
    text: 'Буквально: «пока Бог не соберёт собрание народа и не возникнет милость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Но когда
  rationale: Передаёт временное значение оборота и одновременно отмечает переход и противопоставление в повествовании.
- source_word: ὁ Ἰερεμίας ἔγνων
  choice: Иеремия узнал об этом
  rationale: По синтаксису Иеремия является действующим лицом, а аорист γιγνώσκω обозначает, что он узнал о только что описанном поступке. Форму ἔγνων в данном издании отмечает сноска как грамматически необычную.
- source_word: μεμψάμενος αὐτοῖς
  choice: он упрекнул их
  rationale: «Упрекнул» естественно передаёт выраженное причастием порицание, не усиливая его до более резкого «осудил».
- source_word: ἄγνωστος ὁ τόπος ἔσται
  choice: Это место останется неизвестным
  rationale: «Неизвестным» прямо передаёт ἄγνωστος, а «останется» естественно выражает продолжающееся состояние в будущем; указательное «это» связывает место с предшествующим контекстом.
- source_word: ἕως ἂν συνάγῃ ὁ θεὸς ἐπισυναγωγὴν τοῦ λαοῦ
  choice: пока Бог не соберёт народ воедино
  rationale: Глагольная русская конструкция естественно передаёт усиленную и несколько тяжеловесную греческую формулу «соберёт собрание народа», не добавляя отсутствующего в тексте притяжательного «Свой».
- source_word: καὶ ἔλεος γένηται
  choice: и не явится милость
  rationale: Сохраняет милость как грамматический субъект и не делает Бога явно названным субъектом действия там, где греческий текст оставляет связь менее определённой.
theological_decisions:
- issue: Кто действует в заключительной фразе о милости
  choice: «и не явится милость»
  alternative: «и не явит милость»
  rationale: В греческом ἔλεος является грамматическим субъектом γένηται. Безлично-событийная русская формулировка сохраняет эту особенность и не устраняет возможную смысловую связь с Божьим милосердным действием.
- issue: Определение народа как принадлежащего Богу
  choice: «народ»
  alternative: «Свой народ»
  rationale: Греческий текст говорит τοῦ λαοῦ, «народа», без притяжательного местоимения. Контекст допускает понимание Божьего народа, но перевод не делает подразумеваемое явным.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён лишь там, где буквальное воспроизведение греческой идиомы было бы неестественным; грамматическая неопределённость последней фразы сохранена.
