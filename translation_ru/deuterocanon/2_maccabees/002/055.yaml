    reason: lexical_alternative
lexical_decisions:
- source_word: διακριβοῦν
  choice: подробно излагать
  rationale: Субстантивированный инфинитив обозначает точную и обстоятельную разработку материала в полном труде; выражение передаёт и подробность, и литературный характер задачи.
- source_word: περὶ ἑκάστων
  choice: каждый вопрос
  rationale: Сохраняет распределительное значение и естественно обозначает отдельные темы исторического повествования.
- source_word: τῷ συγγραφεῖ
  choice: автору
  rationale: Речь идёт о составителе полного труда, в отличие от автора его сокращённого изложения.
- source_word: παραχωρήσαντες
  choice: предоставляя
  rationale: Причастие выражает сознательную передачу или оставление задачи подробного изложения автору исходного труда.
- source_word: ἐπιπορεύεσθαι
  choice: следовать
  rationale: В сочетании с ὑπογραμμοῖς глагол означает продвигаться по заданным направляющим или придерживаться их.
- source_word: ὑπογραμμοῖς
  choice: намеченным линиям
  rationale: Сохраняет образ предварительно очерченных направляющих и литературного контура, не смешивая его с самой ἐπιτομή.
- source_word: ἐπιτομῆς
  choice: сокращённого изложения
  rationale: Передаёт техническое значение литературного сокращения полного произведения современным и понятным русским выражением.
- source_word: σπουδάζοντες
  choice: стараясь
  rationale: Передаёт усердное, тщательное стремление составителей придерживаться рамок сокращённого труда.
