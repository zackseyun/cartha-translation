lexical_decisions:
- source_word: Οἱ δὲ
  choice: А
  rationale: δέ — мягкая повествовательная связка; русское «А» естественно продолжает рассказ, не создавая резкого противопоставления.
- source_word: ἱερεῖς
  choice: священники
  rationale: Определённость группы ясна из контекста; в русском языке множественное число без отдельного артикля передаёт её естественно.
- source_word: ἐπέαλλον
  choice: продолжали петь
  rationale: Имперфект изображает продолжающееся действие; «продолжали петь» явно передаёт длительность, а «петь» естественно обозначает исполнение гимнов.
- source_word: τοὺς ὕμνους
  choice: гимны
  rationale: «Гимны» прямо и уместно в богослужебном контексте передаёт ὕμνους; определённость восстанавливается из контекста.
