lexical_decisions:
- source_word: ἐμβατείνειν
  choice: углубляться в предмет
  rationale: Глагол буквально передаёт вхождение или проникновение внутрь; в данном риторическом контексте означает более глубокое и подробное рассмотрение.
- source_word: περίπατον ποιεῖσθαι λόγῳ
  choice: пускаться в пространные словесные экскурсы
  rationale: Сохранён образ «прогулки в речи», но выражен естественным русским оборотом, обозначающим развёрнутое, отступающее в стороны изложение.
- source_word: πολυπραγμονεῖν
  choice: чрезмерно заниматься
  rationale: Передаёт оттенок излишне усердного, чрезмерно обстоятельного внимания, не привнося неуместного значения вмешательства в чужие дела.
- source_word: ἐν τοῖς κατὰ μέρος
  choice: отдельными подробностями
  rationale: Оборот обозначает частные вопросы или детали, рассматриваемые по отдельности.
- source_word: τῷ τῆς ἱστορίας ἀρχηγενέτῃ
  choice: создателю исторического труда
  rationale: Редкое слово указывает на того, кто первоначально создал историю, в отличие от составителя её сокращённого изложения.
- source_word: καθῆκε
  choice: надлежало
  rationale: Передаёт значение подобающей или возложенной на кого-либо задачи и соответствует достоинству контекста.
