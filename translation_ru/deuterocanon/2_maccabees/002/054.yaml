  yaml_path: translation/deuterocanon/2_maccabees/002/054.yaml
  text: For just as it is not easy for one who prepares a banquet[a], or even seeks the benefit of others, yet for the gratitude of the many we will gladly endure the hardship[b];
translation:
  language: ru
  text: Подобно тому как нелегко тому, кто готовит пир[a] или стремится принести пользу другим, всё же ради благодарности многих[b] мы охотно перенесём эти тяготы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праздничную трапезу»; греческое слово может обозначать пир или совместное застолье.'
    reason: lexical_alternative
  - marker: b
    text: То есть ради благодарности и признательности многих читателей; здесь это не специальный богослужебный термин.
    reason: cultural_note
lexical_decisions:
- source_word: καθάπερ
  choice: Как ... так и
  rationale: Сравнительная конструкция естественно передаёт связь с предыдущим рассуждением и соотносит труд устроителя пира с трудом составителя книги.
- source_word: τῷ παρασκευάζοντι συμπόσιον
  choice: тому, кто готовит пир
  rationale: Дательный причастный оборот зависит от οὐκ εὐχερές; «пир» ясно и литературно передаёт образ совместной праздничной трапезы.
- source_word: ζητοῦντι τὴν ἑτέρων ὠφέλειαν
  choice: стремится принести пользу другим
  rationale: Такая формулировка естественно передаёт целенаправленное стремление к благу других людей.
- source_word: οὐκ εὐχερές
  choice: приходится нелегко
  rationale: Современный русский оборот сохраняет смысл затруднительности, не усиливая его до невозможности.
- source_word: ὅμως
  choice: так и ... охотно
  rationale: В русском предложении уступительно-сопоставительный переход выражен всей конструкцией; решимость автора сохраняется без тяжеловесного буквального «всё же».
- source_word: διὰ τὴν τῶν πολλῶν εὐχαριστίαν
  choice: ради благодарности многих
  rationale: Сохраняет обычное значение благодарности или признательности со стороны многих читателей и не придаёт слову специального литургического смысла.
- source_word: ἡδέως
  choice: охотно
  rationale: Передаёт добровольную и радостную готовность автора принять тяготы труда.
- source_word: τὴν κακοπάθειαν ὑποίσομεν
  choice: перенесём этот труд
  rationale: Глагол означает несение или перенесение тяготы; в контексте речь идёт о нелёгком труде составителя, а не о гонениях или физическом страдании.
theological_decisions:
- issue: Значение εὐχαριστία
  choice: обычная благодарность или признательность многих читателей
  alternative: общее благодарение; специальный евхаристический смысл
  rationale: Контекст литературного предисловия говорит об отклике читателей на труд составителя; оснований для технического сакраментального значения здесь нет.
translation_notes:
  register: Современный литературный русский язык с достоинством авторского предисловия. Сравнение оформлено естественной конструкцией «как ... так и»; образ пира и указание на многих сохранены.
