  text: And Moses said[a], “Because it was not eaten, the sin offering was consumed.”
translation:
  language: ru
  text: 'И сказал Моисей: «Поскольку жертву за грех[a] не съели, она была уничтожена».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, что относится к греху». Это греческое выражение в библейском употреблении обычно обозначает жертву за грех.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν Μωυσῆς
  choice: И сказал Моисей
  rationale: Сохраняется простой повествовательный союз καί и естественный для русского библейского повествования порядок слов.
- source_word: Διὰ τὸ μὴ βεβρῶσθαι
  choice: Поскольку … не съели
  rationale: Конструкция διά с субстантивированным инфинитивом выражает причину; перфектный пассив βεβρῶσθαι передан естественной русской неопределённо-личной конструкцией без указания действующего лица.
- source_word: τὸ περὶ τῆς ἁμαρτίας
  choice: жертву за грех
  rationale: Это устойчивое жертвенное выражение в греческом тексте Писания. Такой перевод ясно передаёт культовый смысл, а буквальная форма приведена в примечании.
- source_word: ἀνηλώθη
  choice: была уничтожена
  rationale: Пассивная форма ἀναλίσκω означает, что предмет был израсходован, поглощён или уничтожен. «Была уничтожена» сохраняет краткость и не уточняет способ уничтожения, которого греческий текст прямо не называет.
theological_decisions:
- issue: Культовое значение выражения τὸ περὶ τῆς ἁμαρτίας
  choice: жертва за грех
  alternative: то, что относится к греху
  rationale: В библейском жертвенном контексте выражение обозначает жертву за грех. Основной текст передаёт референт ясно, а примечание сохраняет буквальную форму и исходную образность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка остаётся краткой и сохраняет причинную связь и неопределённость относительно способа уничтожения жертвы.
