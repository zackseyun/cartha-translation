  text: we have taken care that for those who wish to read there may be enjoyment, for those who are inclined to commit it to memory ease, and for all who encounter it benefit.
translation:
  language: ru
  text: Мы позаботились о том, чтобы желающим читать было приятно, намеренным запомнить — легко, а всем, кто обратится к этому сочинению, — полезно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐχαγωγίαν
  choice: было приятно
  rationale: Слово обозначает приятность, удовольствие или занимательность чтения; естественная русская формулировка передаёт цель автора без излишнего усиления.
- source_word: φιλοφρονοῦσιν
  choice: стремящимся
  rationale: В данном контексте причастие указывает на расположенность и намерение заняться запоминанием; «стремящимся» кратко и естественно передаёт эту направленность.
- source_word: εἰς τὸ διαμνήμης ἀναλαβεῖν
  choice: запомнить
  rationale: Выражение буквально связано с воспринятием и удержанием в памяти; в современном русском его смысл ясно передаётся одним глаголом.
- source_word: ἐντυγχάνουσιν
  choice: кто возьмёт эту книгу в руки
  rationale: Глагол может означать «встречаться, обращаться к чему-либо, читать». Контекст говорит о читателях произведения; идиома сохраняет более широкий оттенок обращения к книге, не сводя его лишь к систематическому чтению.
- source_word: ὠφέλειαν
  choice: полезно
  rationale: Передаёт практическую пользу, которую автор желает всем соприкасающимся с произведением.
