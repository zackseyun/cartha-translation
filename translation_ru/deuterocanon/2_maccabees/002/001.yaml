base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/001.yaml
  text: 'And those in Judea[a], and the council of elders, and Judas, to Aristobulus, teacher of King Ptolemy, who is also of the family of the anointed priests, and to the Jews in Egypt: greetings and good health.'
translation:
  language: ru
  text: 'Жители Иудеи, совет старейшин и Иуда — Аристовулу, наставнику царя Птолемея, происходящему из рода помазанных священников[a], и иудеям в Египте: приветствие и пожелание здоровья.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвящённых священников». Греческое слово χριστῶν здесь означает «помазанных» и не употреблено как титул «Христос».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: жители Иудеи
  rationale: Греческое выражение буквально означает «те, кто в Иудее» и прямо не называет их иудеями. «Жители Иудеи» сохраняет эту широту и естественно звучит по-русски.
- source_word: γερουσία
  choice: совет старейшин
  rationale: Передаёт название совещательного органа старейшин ясно и без вводящей в заблуждение римской ассоциации слова «сенат».
- source_word: διδασκάλῳ
  choice: наставнику
  rationale: В контексте придворной связи с царём слово может обозначать учителя или наставника; «наставник царя» естественно и не уточняет сверх текста характер обучения.
- source_word: ὄντι δὲ ἀπὸ τοῦ τῶν χριστῶν ἱερέων γένους
  choice: происходящему из рода помазанных священников
  rationale: Формулировка сохраняет значение происхождения, выраженное ἀπὸ…γένους. χριστῶν здесь означает священников, помазанных на служение, а не христологический титул.
- source_word: χαίρειν καὶ ὑγιαίνειν
  choice: приветствие и пожелание здоровья
  rationale: Это эпистолярная формула приветствия и благопожелания, а не два буквальных повеления «радоваться и быть здоровыми».
- source_word: Ἰούδας
  choice: Иуда
  rationale: Обычная русская библейская передача личного имени Ἰούδας; контекст указывает на названного отправителя, вероятно Иуду Маккавея.
theological_decisions:
- issue: Значение χριστῶν в τῶν χριστῶν ἱερέων
  choice: помазанных священников
  alternative: посвящённых священников
  rationale: Греческое χριστῶν употреблено в обычном значении «помазанных» и относится к священникам. Такая передача сохраняет конкретный образ помазания и не превращает слово в титул «Христос».
translation_notes:
  register: Современный литературный русский язык с достоинством официального письма. Тире обозначает переход от перечисления отправителей к адресатам; заключительная формула передана естественно для русского письма.
