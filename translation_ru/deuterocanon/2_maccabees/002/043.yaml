lexical_decisions:
- source_word: Μέλλοντες οὖν
  choice: Итак, поскольку мы собираемся
  rationale: Причастие μέλλοντες передаёт предстоящее действие, а οὖν связывает его с предыдущим рассуждением. Причинная конструкция звучит естественно по-русски и сохраняет перспективное значение.
- source_word: ἄγειν
  choice: праздновать / отмечать
  rationale: 'Глагол дважды употреблён в контексте праздничного соблюдения: сначала с «очищением», затем с «днями». В русском языке выбор разных, но близких глаголов обусловлен сочетаемостью слов.'
- source_word: τὸν καθαρισμόν
  choice: очищение
  rationale: Существительное буквально означает «очищение» и в данном контексте указывает на празднование очищения храма. Добавление слова «праздник» в основной текст было бы пояснительным расширением.
- source_word: ἐγράψαμεν
  choice: мы написали вам
  rationale: Аорист передан естественным русским прошедшим временем; в контексте письма эта форма сохраняет непосредственность высказывания.
- source_word: καλῶς οὖν ποιήσετε
  choice: Поэтому вы хорошо сделаете
  rationale: Устойчивая греческая конструкция выражает одобрение и мягкое побуждение; русский оборот сохраняет обе функции.
- source_word: τὰς ἡμέρας
  choice: эти дни
  rationale: Греческий текст буквально говорит «дни» с определённым артиклем. Указательное «эти» естественно отсылает к уже известным праздничным дням, не добавляя слова «праздничные».
