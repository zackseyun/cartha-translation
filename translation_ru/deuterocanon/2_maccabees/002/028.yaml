  source_fidelity: 'Смысл в целом передан верно: противопоставлены подробное, точное изложение, оставленное автору полного труда, и усилия составителя сокращения следовать его основным линиям. Однако «каждое событие» неоправданно сужает περὶ ἑκάστων («о каждом предмете/во всех частностях»), поскольку речь может идти не только о событиях. «Напрягаем силы» передаёт усилие, но звучит несколько тяжеловесно и менее естественно, чем нейтральное «прилагаем усилия».'
