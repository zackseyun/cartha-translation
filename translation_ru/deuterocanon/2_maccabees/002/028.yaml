    reason: lexical_alternative
lexical_decisions:
- source_word: διακριβοῦν περὶ ἑκάστων
  choice: подробно и точно излагать каждое событие
  rationale: διακριβοῦν выражает тщательную, точную разработку отдельных подробностей; в историографическом контексте естественно передать это как подробное и точное изложение. «Каждое событие» обозначает отдельные предметы повествования, не сужая их до отвлечённых вопросов.
- source_word: τῷ συγγραφεῖ παραχωρήσαντες
  choice: предоставив автору
  rationale: παραχωρέω здесь означает оставить некую задачу в ведении другого, а συγγραφεύς — автор более пространного исторического труда.
- source_word: ἐπιπορεύεσθαι τοῖς ὑπογραμμοῖς
  choice: держаться основных линий
  rationale: Образ движения по намеченным линиям передан естественным русским оборотом; ὑπογραμμοί обозначает очертания или направляющие линии, которым следует составитель сокращения.
- source_word: τῆς ἐπιτομῆς
  choice: сокращённого изложения
  rationale: ἐπιτομή — литературное сокращение более обширного произведения; понятный русский эквивалент точнее для широкой аудитории, чем техническое «эпитома».
- source_word: ἀτονοῦντες
  choice: напрягаем силы
  rationale: В данном контексте слово подчёркивает напряжение и трудность работы составителя сокращения. Такой перевод сохраняет оттенок усилия и лучше согласуется с ближайшим контекстом о труде и напряжении.
