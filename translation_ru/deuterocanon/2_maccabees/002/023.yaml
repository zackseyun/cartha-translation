  yaml_path: translation/deuterocanon/2_maccabees/002/023.yaml
  text: And when this happened[a], a flame was kindled; but when the light from the altar shone forth, it was consumed.
translation:
  language: ru
  text: Когда это произошло, вспыхнуло пламя; но когда свет от жертвенника засиял, оно было поглощено[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте не названо, что именно было поглощено или израсходовано. Вероятнее всего, речь идёт о пламени; возможно также, о сгоравшем веществе. Глагол, переданный словом «засиял», может подразумевать ответное или встречное сияние.
    reason: Сохранение синтаксической и лексической неоднозначности оригинала.
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: Когда это произошло
  rationale: Естественно передаёт временной переход и значение наступившего события без архаизма.
- source_word: φλὸξ ἀνήφθη
  choice: вспыхнуло пламя
  rationale: Передаёт возникновение пламени естественным современным оборотом; пассивная форма греческого языка не требует буквального русского пассива.
- source_word: ἀπὸ τοῦ θυσιαστηρίου
  choice: от жертвенника
  rationale: Прямо передаёт источник света и сохраняет культовый термин θυσιαστήριον.
- source_word: ἀντιλάμψαντος φωτός
  choice: когда свет ... засиял в ответ
  rationale: Временная конструкция передаёт генитив абсолютный, а «в ответ» сохраняет возможный ответный или встречный оттенок ἀντιλάμπω, не сводя его лишь к отражению.
- source_word: ἐδαπανήθη
  choice: оно иссякло
  rationale: Глагол обозначает израсходование или полное истощение. «Иссякло» естественно сочетается с ближайшим вероятным референтом — пламенем, не добавляя не названного в тексте деятеля.
theological_decisions:
- issue: Неявное подлежащее при ἐδαπανήθη
  choice: Местоимение «оно» отнесено к ближайшему существительному «пламя».
  alternative: Глагол может относиться к сгоравшему веществу, приношению либо к жидкости из предшествующего контекста.
  rationale: В греческом тексте подлежащее последнего глагола не выражено. Отнесение к φλόξ синтаксически наиболее непосредственно, однако неоднозначность сохранена в примечании и не превращена в догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сжат, как в греческом оригинале; архаические обороты исключены.
