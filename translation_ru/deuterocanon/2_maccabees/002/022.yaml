  terminology: «Неемия» — нормативная традиционная русская библейская форма имени. «Жертвоприношение» уместно для θυσία в данном контексте. Сноска корректно отмечает эллиптичность τὰ τῆς θυσίας и не навязывает спорного уточнения.
