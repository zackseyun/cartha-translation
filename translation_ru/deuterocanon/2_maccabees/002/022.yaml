    text: 'Буквально: «то, что относится к жертве». Греческое выражение эллиптично и не уточняет, что именно было израсходовано.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηλώθη
  choice: было израсходовано
  rationale: Пассивная форма передаёт исчерпание или употребление предназначенного для жертвы, не уточняя сверх греческого текста, было ли оно сожжено или использовано иным образом.
- source_word: τὰ τῆς θυσίας
  choice: всё, что предназначалось для жертвоприношения
  rationale: Субстантивированное сочетание среднего рода с родительным падежом эллиптично; русский вариант остаётся широким по смыслу и при этом звучит естественно.
- source_word: τὸ περιλειπόμενον ὕδωρ
  choice: оставшуюся воду
  rationale: Точно и естественно передаёт причастное сочетание со значением остатка.
- source_word: ὁ Νεεμίας
  choice: Неемия
  rationale: Использована традиционная русская библейская форма имени.
- source_word: ἐκέλευσεν
  choice: велел
  rationale: Передаёт авторитетное распоряжение без ненужного усиления.
- source_word: λίθους μείζονας
  choice: более крупные камни
  rationale: Сохранена сравнительная степень μείζονας; определённый артикль при существительном в греческом отсутствует.
- source_word: καταχεῖν
  choice: вылить ... на
  rationale: Естественно передаёт направленное выливание жидкости на камни.
