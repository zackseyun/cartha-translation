  source_fidelity: 'Русский текст точно передаёт греческую последовательность: после того как τὰ τῆς θυσίας были исчерпаны, Неемия распорядился вылить также оставшуюся воду на сравнительно более крупные камни. «Было израсходовано» удачно сохраняет неопределённость ἀνηλώθη и не утверждает, что предметы непременно были сожжены. Частица «и» передаёт καί как добавление к предшествующему действию. «Более крупные камни» сохраняет сравнительную степень μείζονας; отсутствие «эти/те» оправдано, поскольку в греческом у λίθους нет артикля.'
