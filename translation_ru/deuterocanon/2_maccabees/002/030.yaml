lexical_decisions:
- source_word: ἐμβατεύειν
  choice: вникать в предмет
  rationale: В данном риторическом контексте инфинитив обозначает углублённое рассмотрение предмета, а не буквальное вхождение.
- source_word: περίπατον ποιεῖσθαι λόγῳ
  choice: пространно рассуждать о нём
  rationale: Передаёт метафорический образ широкого движения речи вокруг предмета естественным современным русским языком; образная плотность оригинала отмечена в сноске.
- source_word: πολυπραγμονεῖν
  choice: тщательно разбирать
  rationale: Здесь слово указывает на обстоятельное, возможно чрезмерно подробное исследование, а не на предосудительное вмешательство в чужие дела.
- source_word: ἐν τοῖς κατὰ μέρος
  choice: все подробности
  rationale: Фраза обозначает отдельные детали, рассматриваемые по одной; русское выражение естественно сочетается с глаголом «разбирать».
- source_word: τῷ τῆς ἱστορίας ἀρχηγενέτῃ
  choice: тому, кто первым составил эту историю
  rationale: Редкое ἀρχηγενέτης обозначает создателя первоначального полного труда; описательный перевод сохраняет отличие от составителя краткого изложения.
- source_word: καθήκει
  choice: надлежит
  rationale: Передаёт значение подобающей данному лицу задачи и соответствует достоинству авторской речи.
