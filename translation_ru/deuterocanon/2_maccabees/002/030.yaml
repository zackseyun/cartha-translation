  source_fidelity: 'В целом смысл передан верно: три инфинитива описывают развёрнутую работу полного историка, а καθήκει — то, что ему подобает. Однако «тщательно разбирать» не вполне передаёт оттенок πολυπραγμονεῖν: речь не просто о тщательности, а о чрезмерно/дотошно подробном занятии частностями. «Первым составил эту историю» допустимо, но «первому составителю истории» точнее сохраняет определение ἀρχηγενέτῃ как создателя исходного труда, не добавляя временного акцента «первым».'
