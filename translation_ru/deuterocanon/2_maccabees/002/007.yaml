  text: After opening the secret door in the ceiling[a], they threw stones and struck down the leader, and after cutting them into pieces[c][b], they threw the heads to those outside.
translation:
  language: ru
  text: Открыв потайную дверь в потолке[a], они, бросая камни, сокрушили правителя[b], а затем расчленили его и бросили головы[c] тем, кто находился снаружи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «потолок» (φατίνωμα), встречается редко и может обозначать потолочную конструкцию, вероятно панельную или кессонную.
    reason: lexical_alternative
  - marker: b
    text: 'Употреблённый здесь греческий глагол необычайно выразителен: он рисует сокрушительный удар, подобный удару молнии.'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте стоит множественное число — «головы», хотя непосредственно перед этим упомянут один правитель. Дополнение при слове «расчленили» не выражено и, по контексту, относится к правителю; перевод сохраняет множественное число «головы» и тем самым не сглаживает неровность текста.
    reason: textual_variant
lexical_decisions:
- source_word: ἀνοίξαντες
  choice: открыв
  rationale: Аористное причастие обозначает действие, предшествующее основному; русское деепричастие естественно передаёт эту последовательность.
- source_word: κρυπτὴν θύραν
  choice: потайную дверь
  rationale: κρυπτήν означает скрытую, утаённую; «потайная дверь» — естественное русское обозначение скрытого архитектурного прохода.
- source_word: τοῦ φατινώματος
  choice: в потолке
  rationale: Редкое существительное φάτνωμα связано с потолком, в частности с кессонным или панельным потолочным покрытием. Контекст требует двери или люка в верхней конструкции; краткое «в потолке» передаёт наиболее вероятный смысл без излишней конкретизации.
- source_word: βάλλοντες πέτρους
  choice: бросая камни
  rationale: Причастный оборот указывает на способ нападения и сохранён в русском без превращения в отдельное последовательное действие.
- source_word: συνεκεραύνωσαν
  choice: сокрушили
  rationale: Необычный сильный глагол содержит образ удара, подобного молнии. «Сокрушили» передаёт насильственный и решительный характер действия, а буквальная образность отмечена в сноске.
- source_word: τὸν ἡγεμόνα
  choice: правителя
  rationale: ἡγεμών может означать правителя, начальника или предводителя. В данном повествовательном контексте «правитель» уместно передаёт высокий статус лица, не уточняя не названную в греческом должность.
- source_word: μέλη ποιήσαντες
  choice: расчленили их
  rationale: Буквально оборот означает «сделав [из них] части/члены» и идиоматически описывает расчленение. Дополнение в греческом не выражено; местоимение во множественном числе согласуется с последующим «головы».
- source_word: τὰς κεφαλάς
  choice: головы
  rationale: Перевод сохраняет явно выраженное множественное число, хотя перед этим назван один правитель и из-за этого повествование выглядит неровным.
- source_word: τοῖς ἔξω
  choice: тем, кто находился снаружи
  rationale: Артикль с дательным падежом указывает на людей, находившихся снаружи, а не просто на направление броска.
