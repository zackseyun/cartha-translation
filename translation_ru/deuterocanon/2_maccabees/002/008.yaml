lexical_decisions:
- source_word: κατὰ πάντα
  choice: во всём
  rationale: Передаёт всеохватное усиление славословия естественно и кратко, не сводя выражение только к степени («совершенно»).
- source_word: εὐλογητὸς
  choice: благословен
  rationale: Сохраняет традиционный высокий регистр славословия и значение предикативного прилагательного.
- source_word: ὁ θεός
  choice: Бог
  rationale: Прямое соответствие греческому подлежащему; в русском перед именованием Бога артикль не передаётся.
- source_word: ἔδωκεν
  choice: предавший
  rationale: При личном прямом дополнении глагол означает передачу или отдачу во власть; «предавший» естественно выражает это по-русски, не добавляя неуказанного получателя.
- source_word: τοὺς ἀσεβήσαντας
  choice: тех, кто поступил нечестиво
  rationale: Сохраняет событийное значение аористного причастия от ἀσεβέω и не превращает совершённое нечестие в постоянную характеристику людей.
theological_decisions:
- issue: Целостность исходного текста и контекстуальное несоответствие
  choice: Перевести представленное греческое чтение как краткое славословие, завершающееся упоминанием суда над поступившими нечестиво, и отметить значительное расхождение в сноске.
  alternative: В других изданиях или рукописях за этим стихом может стоять более пространное, контекстуально иное чтение.
  rationale: Предоставленный греческий текст необычно краток и контекстуально резок для 2 Маккавейской 2:8. Перевод следует именно предоставленному свидетельству, не реконструируя более полный текст по вторичным источникам, а неопределённость обозначает явно.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным богослужебным звучанием. «Благословен наш Бог» сохраняет форму славословия; синтаксис остаётся естественным для современного читателя.
