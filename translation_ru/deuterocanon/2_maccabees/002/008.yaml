  text: Blessed in every way is our God[a], who gave over those who acted wickedly.
translation:
  language: ru
  text: Во всём благословен наш Бог[a], предавший тех, кто поступил нечестиво.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленное греческое свидетельство этого стиха необычно кратко и отмечено в исходных данных как имеющее значительное расхождение. Здесь переведён именно сохранившийся в нём текст без реконструкции более полного чтения по другим изданиям.
