base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/037.yaml
  text: Just as Moses prayed to the Lord[a], and fire came down from heaven and consumed the things of the sacrifice, so also Solomon prayed to the Lord[b], and the fire came down and consumed the whole burnt offerings.
translation:
  language: ru
  text: Как Моисей помолился Господу, и с неба сошёл огонь и поглотил всё, что относилось к жертве[a], так и Соломон помолился Господу, и сошедший огонь поглотил всесожжения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, что относится к жертве»; речь может идти о жертвенных приношениях или о том, что было связано с жертвоприношением.'
    reason: lexical_alternative
  - marker: b
    text: Всесожжения — приношения, которые целиком сжигались на жертвеннике.
    reason: lexical_clarification
lexical_decisions:
- source_word: προσηύξατο
  choice: помолился
  rationale: Аорист προσεύχομαι прямо обозначает совершённое действие молитвы; «помолился» естественно и точно передаёт форму без необоснованного усиления.
- source_word: Κύριον
  choice: Господу
  rationale: Греческий текст содержит κύριος, а не непосредственно тетраграмматон; традиционное и точное русское соответствие в отношении Бога Израиля — «Господь».
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: с неба сошёл огонь
  rationale: Сохраняет образ и последовательность греческого текста, оставаясь естественным для возвышенной современной русской прозы.
- source_word: τὰ τῆς θυσίας
  choice: всё приготовленное для жертвы
  rationale: Субстантивированное выражение буквально охватывает «то, что относится к жертве»; выбранный вариант сохраняет широту значения и звучит естественнее буквального «вещи жертвы».
- source_word: ἐδαπάνησεν
  choice: поглотил
  rationale: В контексте огня и жертвоприношения глагол означает полное истребление огнём; «поглотил» передаёт образность и результат.
- source_word: οὕτως ... καὶ
  choice: так и
  rationale: Ясно сохраняет сопоставление Моисея и Соломона.
- source_word: καταβῆναι τὸ πῦρ
  choice: сошедший огонь
  rationale: Передаёт синтаксически сжатую и несколько неровную формулировку принятого греческого текста, не добавляя отсутствующего уточнения «с неба» во второй части.
- source_word: ἀνήλωσεν
  choice: поглотил
  rationale: В жертвенном контексте естественно означает уничтожение огнём; повтор «поглотил» сохраняет параллелизм двух частей.
- source_word: ὁλοκαυτώματα
  choice: всесожжения
  rationale: Устоявшийся русский библейский термин для жертв, целиком сжигаемых на жертвеннике; он точнее общего «жертвы».
theological_decisions:
- issue: Передача κύριος применительно к Богу Израиля
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Источник непосредственно читается Κύριον; написание «ГОСПОДЬ» могло бы создавать впечатление прямого воспроизведения еврейского тетраграмматона, которого в данном греческом свидетельстве нет.
- issue: Культовая специфика ὁλοκαυτώματα
  choice: всесожжения
  alternative: жертвы всесожжения
  rationale: «Всесожжения» — понятный и точный термин, указывающий, что приношения сжигались целиком, без добавления отсутствующего в греческом существительного.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм двух частей сохранён; необычная сжатость второй греческой конструкции передана причастным оборотом без догматического или повествовательного дополнения.
