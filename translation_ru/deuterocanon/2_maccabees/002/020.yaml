lexical_decisions:
- source_word: καταφύτευσον
  choice: Посади
  rationale: Аорист повелительного наклонения от καταφυτεύω означает «посади, насади». «Посади» сохраняет образ укоренения и силу повелительной формы; значение прочного водворения отмечено в сноске.
- source_word: τὸν λαόν σου
  choice: народ Твой
  rationale: λαός обозначает народ как единое сообщество, нередко народ Божий; «народ Твой» естественно передаёт притяжательное отношение в молитвенном обращении.
- source_word: εἰς τὸν τόπον τὸν ἅγιόν σου
  choice: на святом месте Твоём
  rationale: τόπος означает «место», а ἅγιος — «святой». Предлог εἰς при глаголе помещения допускает направительное понимание, но по-русски с «посади» естественнее обозначить место формой «на святом месте», не расширяя τόπος до «земли».
- source_word: καθὼς εἶπεν
  choice: как сказал
  rationale: Прямое и естественное соответствие сравнительному союзу καθώς и аористу λέγω; усиление «точно так, как» греческим текстом не требуется.
- source_word: Μωσῆς
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма имени.
