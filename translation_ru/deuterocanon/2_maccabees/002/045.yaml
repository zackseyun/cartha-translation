  yaml_path: translation/deuterocanon/2_maccabees/002/045.yaml
  text: just as he promised through the law[a]. For we hope in God that he will soon have mercy on us and gather us from under heaven into the holy place[c][b]; for he rescued us from great evils and cleansed the place.
translation:
  language: ru
  text: как Он обещал через Закон. Ведь мы надеемся на Бога, что Он вскоре помилует нас и соберёт нас со всей поднебесной[a] в святое место[b]; ведь Он избавил нас от великих бедствий[c] и очистил это место.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отовсюду под небом», то есть из разных мест рассеяния.'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду священное место в Иерусалиме; в данном контексте — храмовая территория.
    reason: cultural_note
  - marker: c
    text: 'Или: «от великих бед», «от великого зла».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ἐπηγγείλατο διὰ τοῦ νόμου
  choice: как Он обещал через Закон
  rationale: καθώς передаёт соответствие обещанию, а διά с родительным указывает на средство, через которое оно было дано. Прописная буква в слове «Закон» обозначает Моисеев Закон.
- source_word: ἐλπίζομεν γὰρ ἐπὶ τῷ θεῷ
  choice: ведь мы надеемся на Бога
  rationale: Оборот ἐλπίζω ἐπί с дательным выражает возложение надежды на кого-либо; русский оборот сохраняет этот смысл естественно.
- source_word: ταχέως ἡμᾶς ἐλεήσει
  choice: Он вскоре помилует нас
  rationale: ταχέως в ориентированном на будущее высказывании означает «вскоре», а ἐλεέω — «миловать, проявлять милость».
- source_word: ἐπισυνάξει
  choice: соберёт
  rationale: Глагол означает собрать вместе и здесь несёт оттенок возвращения рассеянного народа.
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανόν
  choice: из-под всего неба
  rationale: Греческое выражение эллиптично и указывает на весь поднебесный мир, то есть на различные места рассеяния. Формулировка сохраняет исходный образ и остаётся понятной по-русски.
- source_word: εἰς τὸν ἅγιον τόπον
  choice: в святое место
  rationale: Перевод сохраняет общее существительное τόπος («место»), не подменяя его более конкретными словами «храм» или «святилище».
- source_word: ἐξείλατο γὰρ ἡμᾶς ἐκ μεγάλων κακῶν
  choice: ведь Он избавил нас от великих бедствий
  rationale: Средний залог ἐξαιρέω означает избавление или спасение от опасности; κακά в данном контексте естественно обозначает тяжёлые беды и бедствия, хотя допускает и более буквальное «зло».
- source_word: τὸν τόπον ἐκαθάρισεν
  choice: очистил это место
  rationale: καθαρίζω означает «очищать»; указательное «это» естественно связывает τὸν τόπον с уже названным святым местом, не конкретизируя его сверх греческого текста.
theological_decisions:
- issue: Что обозначают «святое место» и «это место»
  choice: В основном тексте сохранено слово «место».
  alternative: «святилище», «храм», «храмовое место»
  rationale: Контекст указывает на священное место в Иерусалиме, в частности на храмовую территорию, однако греческий текст употребляет более общее τόπος. Конкретизация вынесена в примечание.
- issue: Характер κακά, от которых избавил Бог
  choice: «великие бедствия»
  alternative: «великое зло», «великие беды», «великие несчастья»
  rationale: Слово κακά широко и может обозначать как зло, так и беды или несчастья. В историческом контексте здесь прежде всего имеются в виду перенесённые народом тяжёлые бедствия; примечание сохраняет лексическую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимение «Он» написано с прописной буквы как ясная отсылка к Богу; архаизмы и конфессионально окрашенные уточнения не используются.
