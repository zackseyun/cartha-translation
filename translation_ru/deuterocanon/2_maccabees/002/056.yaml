  yaml_path: translation/deuterocanon/2_maccabees/002/056.yaml
  text: For just as[a], in the case of a new house, the architect must take thought for the whole foundation, but the one undertaking to decorate and paint it must examine the things suitable for adornment, so also, I think, it is with us.
translation:
  language: ru
  text: Ведь как при постройке нового дома архитектор должен позаботиться о закладке всего основания, а тот, кто берётся обустроить[a] и расписать его, должен тщательно рассмотреть всё подходящее для украшения, так, думаю, обстоит дело и с нами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «украсить»; греческий глагол может означать обустройство или подготовку нового дома, а не только его украшение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Ведь как
  rationale: Передаёт пояснительно-сравнительную связь γάρ и καθάπερ естественной русской конструкцией.
- source_word: τῆς καινῆς οἰκίας
  choice: при постройке нового дома
  rationale: Контекст архитектора и закладки основания подразумевает строительство; русская формулировка ясно выражает ситуацию, не меняя образ дома.
- source_word: ἀρχιτέκτονι
  choice: архитектор
  rationale: Сохраняет обозначение главного проектировщика и строителя.
- source_word: τῆς ὅλης καταβολῆς
  choice: о закладке всего основания
  rationale: Καταβολή обозначает закладку или основание; отглагольная конструкция сохраняет и процесс, и фундаментальный характер работы.
- source_word: φροντιστέον
  choice: должен позаботиться
  rationale: Передаёт необходимость и заботливое внимание, выраженные греческим отглагольным прилагательным.
- source_word: ἐγκαινίζειν
  choice: обустроить
  rationale: В данном бытовом контексте означает подготовить или оснастить новый дом; вариант шире простого украшения и отмечен сноской из-за смысловой неоднозначности.
- source_word: ζωγραφεῖν
  choice: расписать
  rationale: В применении к дому естественно обозначает декоративную живопись, а не просто нанесение краски.
- source_word: τὰ ἐπιτήδεια πρὸς διακόσμησιν
  choice: всё подходящее для украшения
  rationale: Не ограничивает τὰ ἐπιτήδεια только материалами и сохраняет цель, выраженную πρὸς διακόσμησιν.
- source_word: ἐξεταστέον
  choice: должен тщательно выбрать
  rationale: Передаёт необходимость внимательного рассмотрения и отбора подходящих средств в естественной русской форме.
- source_word: οὕτως δοκῶ καὶ ἐπὶ ἡμῶν
  choice: так, думаю, обстоит дело и с нами
  rationale: Сохраняет скромную авторскую оговорку δοκῶ и применение сравнения к собственной работе.
