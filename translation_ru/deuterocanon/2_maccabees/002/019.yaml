lexical_decisions:
- source_word: βάσανισον
  choice: Накажи
  rationale: Аористный императив выражает просьбу подвергнуть виновных карающему страданию или суду. «Накажи» естественно передаёт судебно-карательный смысл, не уточняя способ наказания.
- source_word: τοὺς καταδυναστεύοντας
  choice: тех, кто угнетает
  rationale: Причастие обозначает продолжающееся злоупотребление властью и притеснение других; выбранное выражение ясно и естественно для современного русского языка.
- source_word: καὶ ἐξυβρίζοντας
  choice: и … творит бесчинства
  rationale: Глагол означает дерзкое, оскорбительное или насильственное обращение, а не только словесное оскорбление. «Творит бесчинства» сохраняет силу и широту значения.
- source_word: ἐν ὑπερηφανίᾳ
  choice: в своей надменности
  rationale: Оборот передаёт высокомерную установку, с которой совершаются названные действия. «Надменность» сохраняет нравственную окраску греческого слова и звучит достойно и понятно.
