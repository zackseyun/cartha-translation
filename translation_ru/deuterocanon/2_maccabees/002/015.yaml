lexical_decisions:
- source_word: ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον
  choice: Молитва была такой
  rationale: Естественная современная русская формула введения прямой речи, точно передающая греческую идиому «молитва имела такой вид/образ».
- source_word: Κύριε ὁ θεός
  choice: Господи Боже
  rationale: Прямое обращение в звательном значении; традиционная и естественная русская форма сохраняет оба божественных наименования.
- source_word: ὁ πάντων κτίστης
  choice: Творец всего
  rationale: κτίστης означает творца или создателя, а πάντων — всеохватность; краткая формула естественна для молитвенной речи.
- source_word: ὁ φοβερὸς
  choice: грозный
  rationale: Передаёт не испытывающего страх, а внушающего страх и благоговейный трепет; в современном русском яснее, чем двусмысленное «страшный».
- source_word: ὁ ἰσχυρὸς
  choice: могучий
  rationale: Точно выражает силу и сохраняет возвышенный, но понятный молитвенный регистр.
- source_word: δίκαιος
  choice: праведный
  rationale: В перечне свойств Бога передаёт нравственную правоту; возможное значение справедливости отмечено в сноске.
- source_word: ἐλεήμων
  choice: милосердный
  rationale: Прямое и устойчивое обозначение того, кто проявляет милость.
- source_word: ὁ μόνος βασιλεὺς
  choice: единственный Царь
  rationale: Сохраняет исключительность μόνος и царский титул βασιλεύς; прописная буква уместна как божественный титул в прямом обращении.
- source_word: χρηστός
  choice: благой
  rationale: Передаёт доброту и благость Бога и естественно звучит как субстантивированное божественное определение после «Царь».
theological_decisions:
- issue: Передача κύριος в обращении к Богу
  choice: Господь (в звательной форме «Господи»)
  alternative: Владыка
  rationale: «Господь» сохраняет общепринятый божественный титул и не сужает его до значения человеческого господина.
- issue: Передача δίκαιος как свойства Бога
  choice: праведный
  alternative: справедливый
  rationale: «Праведный» охватывает нравственную правоту Бога, тогда как «справедливый» яснее подчёркивает судебную справедливость; греческое слово допускает оба оттенка.
- issue: Синтаксис ряда определений с повторяющимся греческим артиклем
  choice: естественный русский ряд однородных определений
  alternative: Ты, грозный, могучий, праведный и милосердный
  rationale: Русский язык не требует отдельного субстантивирующего элемента при каждом определении; добавление «Ты» усилило бы текст без прямого основания, поэтому грамматическую структуру передано без искусственной тяжеловесности.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным молитвенным звучанием. Сохранена незавершённость фразы исходного отрывка: конечная запятая показывает, что перечень продолжается. Архаичные или вводящие в заблуждение варианты вроде «страшный» не использованы.'
