base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/024.yaml
  text: But when the matter became known[a], and it was reported to the king of the Persians that in the place where the priests who had been taken away had hidden the fire, water appeared, from which also those with Nehemiah purified the sacrifices[c][b],
translation:
  language: ru
  text: Когда же всё это стало известно и царю персов сообщили, что на том месте, где уведённые священники[a] спрятали огонь, появилась вода, этой водой[c] Неемия и его спутники[b] очистили жертвы,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переселённые священники». Греческое причастие обозначает священников, уведённых или перемещённых со своего места, вероятно отправленных в изгнание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «те, кто вокруг Неемии», то есть Неемия и связанные с ним люди.'
    reason: lexical_alternative
  - marker: c
    text: Буквально выражение можно передать как «из которой» или «от которой»; оно может указывать на воду как источник либо, по смыслу, как средство очищения.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερὸν ἐγενήθη τὸ πρᾶγμα
  choice: всё это стало известно
  rationale: Передаёт идиоматический смысл выражения — событие стало достоянием гласности; «всё это» естественно отсылает к описанному ранее.
- source_word: διηγήθη
  choice: сообщили
  rationale: Греческая пассивная форма означает, что царю изложили или передали известие; неопределённо-личная конструкция естественна по-русски.
- source_word: τῷ βασιλεῖ τῶν Περσῶν
  choice: царю персов
  rationale: Формально близкая и естественная передача греческой конструкции без ненужного уточнения личности царя.
- source_word: εἰς τὸν τόπον οὗ
  choice: на том месте, где
  rationale: Хотя εἰς обычно выражает направление, здесь словосочетание при ἐφάνη имеет локативный смысл.
- source_word: τὸ πῦρ ἔκρυψαν
  choice: спрятали огонь
  rationale: Сохраняет прямое значение глагола и временную последовательность, которая в русском ясна из контекста без плюсквамперфекта.
- source_word: οἱ μεταχθέντες ἱερεῖς
  choice: уведённые священники
  rationale: Причастие указывает на перемещение священников с их места, вероятно насильственное, но само по себе не требует более узкого слова «изгнанные» или «переселённые».
- source_word: τὸ ὕδωρ ἐφάνη
  choice: появилась вода
  rationale: Прямая и естественная передача греческого выражения без подмены значения на «была найдена».
- source_word: ἀφʼ οὗ
  choice: этой водой
  rationale: В русском инструментальная передача естественнее буквального «из которой»; возможный оттенок источника отмечен в сноске.
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: Неемия и его спутники
  rationale: Передаёт обычное значение греческой идиомы — Неемия вместе с принадлежавшей к его кругу группой — ясным современным русским языком.
- source_word: ἥγνισαν τὰς θυσίας
  choice: очистили жертвы
  rationale: Сохраняет культовое значение глагола и прямой объект, не заменяя очищение более истолковывающим «освятили».
theological_decisions:
- issue: Культовый смысл очищения жертв
  choice: очистили жертвы
  alternative: освятили жертвы; очистили жертвенные приношения
  rationale: Глагол обозначает ритуальное очищение. Выбранный вариант сохраняет напряжение текста и не определяет точнее, чем греческий, относится ли действие к самим приношениям или шире к жертвенной процедуре.
- issue: Связь воды с очищением
  choice: этой водой
  alternative: из неё; взятой оттуда водой
  rationale: ἀφʼ οὗ буквально может указывать на источник, но в контексте допускает инструментальное понимание. Основной текст дан естественно по-русски, а неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. Синтаксис сохраняет протяжённость греческой фразы, но остаётся понятным; заключительная запятая отражает незавершённость предложения в предоставленном отрывке.
