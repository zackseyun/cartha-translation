lexical_decisions:
- source_word: ἡμῖν ... τοῖς
  choice: для нас, взявших
  rationale: Дательный падеж и конструкция с причастием указывают на самих составителей; русская формулировка естественно передаёт это самообозначение.
- source_word: τὴν κακοπάθειαν
  choice: тяготы
  rationale: Слово обозначает тяжёлые труды, лишения или страдания; множественное «тяготы» хорошо подходит к контексту напряжённой редакторской работы.
- source_word: ἐπιδεδιγμένοις
  choice: взявших на себя
  rationale: Перфектное причастие среднего залога выражает принятое обязательство, последствия которого сохраняются; этот оборот передаёт добровольно предпринятый труд.
- source_word: τῆς ἐπιτομῆς
  choice: составления сокращённого изложения
  rationale: ἐπιτομή здесь означает сокращённую письменную версию более обширного труда. Добавление «составления» ясно показывает, что речь идёт о процессе её подготовки.
- source_word: οὐ ῥᾴδιον
  choice: было нелёгким
  rationale: Прямо и естественно передаёт отрицательную характеристику трудности дела; прошедшее время соответствует рассказу авторов о проделанной работе.
- source_word: ἱδρῶτος ... καὶ ἀγρυπνίας
  choice: потребовало пота и бессонных ночей
  rationale: Сохраняется яркий образ физического напряжения и отсутствия сна; «бессонных ночей» звучит по-русски естественнее отвлечённого «бессонницы» в описании длительного труда.
- source_word: τὸ πρᾶγμα
  choice: это дело
  rationale: πρᾶγμα обозначает обсуждаемое предприятие; «это дело» сохраняет связь с составлением сокращённого изложения.
