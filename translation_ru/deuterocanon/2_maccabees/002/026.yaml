  text: And for us[a], who have undertaken the hardship of making the abridgment, the task is not easy, but a matter of sweat and sleeplessness;
translation:
  language: ru
  text: 'И нам, взявшим на себя тяготы составления сокращённого изложения[a], нелегко: это дело требует пота и бессонных ночей;'
  philosophy: optimal-equivalence
