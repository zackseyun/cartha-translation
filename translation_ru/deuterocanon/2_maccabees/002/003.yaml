lexical_decisions:
- source_word: αὐτὸς
  choice: он сам
  rationale: Самостоятельное и эмфатическое местоимение передаёт подчёркнутое указание на действующее лицо.
- source_word: γὰρ
  choice: ведь
  rationale: Союз вводит поясняющее или обосновывающее утверждение; «ведь» естественно передаёт эту связь по-русски.
- source_word: ἐξέβρασεν
  choice: изгнал
  rationale: Глагол обозначает решительное, насильственное удаление; «изгнал» сохраняет эту силу и соответствует литературному регистру.
- source_word: τοὺς παρατασσομένους
  choice: тех, кто выстроился в боевой порядок
  rationale: Причастие от παρατάσσω имеет военное значение и описывает построение для сражения; выбранная формулировка явно сохраняет этот смысл, не заменяя его общим словом «противники».
- source_word: ἐν τῇ ἁγίᾳ πόλει
  choice: в святом городе
  rationale: Прямой перевод сохраняет описательное наименование; подразумеваемый Иерусалим не назван вместо него.
- source_word: εἰς τὴν Περσίδα
  choice: в Персию
  rationale: εἰς указывает на направление движения; нормативное русское «в Персию» естественно передаёт как направление, так и достижение области.
