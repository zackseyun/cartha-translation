base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/031.yaml
  text: But one should allow the one producing the epitome to aim at brevity of expression and to forgo the elaborate treatment of the subject matter[a].
translation:
  language: ru
  text: Но тому, кто составляет краткое изложение[a], следует позволить стремиться к краткости выражения и отказаться от подробной разработки предмета.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тому, кто составляет сокращение». Греческое слово μετάφρασις в других контекстах может означать «перевод», но здесь речь идёт о кратком изложении более обширного труда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύντομον
  choice: краткость
  rationale: Субстантивированное прилагательное обозначает сжатость; «краткость» естественно передаёт контраст с подробной разработкой.
- source_word: τῆς λέξεως
  choice: выражения
  rationale: Здесь λέξις означает словесное выражение или способ изложения, а не отдельное слово.
- source_word: μεταδιώκειν
  choice: стремиться к
  rationale: Передаёт значение настойчивого поиска или стремления и естественно сочетается с «краткостью».
- source_word: ἐξεργαστικόν
  choice: подробная разработка
  rationale: Слово указывает на тщательную, развёрнутую проработку материала; выбранное выражение сохраняет литературный смысл.
- source_word: τῆς πραγματίας
  choice: предмета
  rationale: πραγματεία здесь относится к рассматриваемому материалу или теме сочинения; «предмет» кратко и широко передаёт это значение.
- source_word: παραιτεῖσθαι
  choice: отказаться от
  rationale: Глагол означает отклонить, устраниться или не брать на себя; в контексте речь об отказе от полной разработки.
- source_word: τῷ τὴν μετάφρασιν ποιουμένῳ
  choice: тому, кто составляет краткое изложение
  rationale: Хотя μετάφρασις может означать «перевод», контекст предисловия говорит о сокращённом изложении пятитомного труда Иасона Киренского.
- source_word: συγχωρητέον
  choice: следует позволить
  rationale: Безличная глагольная форма выражает должное допущение или уступку.
theological_decisions:
- issue: Значение μετάφρασις в данном контексте
  choice: краткое изложение / сокращение
  alternative: перевод
  rationale: В предисловии автор описывает сокращение более объёмного труда, поэтому контекстуальное значение связано с составлением эпитомы, а не с переводом. Необычное словоупотребление отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка выдержана в dignified, но общедоступном стиле. Сохранена безличная нормативная сила συγχωρητέον и контраст между краткостью речи и подробной разработкой материала.
