base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/049.yaml
  text: and to recover the sanctuary renowned throughout the whole inhabited world[a], and to free the city, and to restore the laws that were about to be abolished, since the Lord was showing them mercy with all forbearance[b],
translation:
  language: ru
  text: и вновь обрести святилище, прославленное по всей обитаемой земле[a], освободить город и восстановить законы, которым грозило упразднение, — ведь Господь со всей снисходительностью миловал их[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по всему миру»; буквально: «по всей обитаемой земле».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «со всей кротостью», «со всей мягкостью» или «со всем великодушием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβόητον
  choice: прославленное
  rationale: Передаёт значение «широко известное, знаменитое» и сохраняет возвышенный тон применительно к святилищу.
- source_word: καθʼ ὅλην τὴν οἰκουμένην
  choice: по всей обитаемой земле
  rationale: Сохраняет буквальный образ греческого выражения, которое в эллинистической речи могло обозначать весь известный обитаемый мир.
- source_word: ἱερὸν
  choice: святилище
  rationale: Подчёркивает священный характер Иерусалимского храмового комплекса, не сужая значение до одного храмового здания.
- source_word: ἀνακομίσασθαι
  choice: вновь обрести
  rationale: Средний инфинитив в контексте означает вернуть или отвоевать себе утраченное; «вновь обрести» естественно передаёт восстановление владения святилищем.
- source_word: ἐλευθερῶσαι
  choice: освободить
  rationale: Прямо и естественно передаёт политический смысл освобождения города.
- source_word: τοὺς μέλλοντας καταλύεσθαι νόμους
  choice: законы, которым грозило упразднение
  rationale: Передаёт как близость или реальность угрозы, выраженную μέλλοντας, так и пассивное значение καταλύεσθαι — отмену или упразднение законов.
- source_word: ἐπανορθῶσαι
  choice: восстановить
  rationale: Соответствует значению «снова привести в должное состояние, восстановить» в правовом и общественном контексте.
- source_word: τοῦ κυρίου
  choice: Господь
  rationale: В данном контексте κύριος обозначает Бога, милующего народ; традиционное и ясное русское соответствие — «Господь».
- source_word: μετὰ πάσης ἐπιεικείας
  choice: со всей снисходительностью
  rationale: ἐπιείκεια допускает оттенки кротости, мягкости, милостивой снисходительности и великодушия. Выбранный вариант подходит к контексту Божьего милосердия, не сливая выражение с самим глаголом «миловать».
- source_word: ἐλεημονοῦντος αὐτοῖς
  choice: миловал их
  rationale: Передаёт продолжающееся милостивое действие Господа по отношению к ним; несовершенный вид русского глагола сохраняет длительный оттенок причастия.
theological_decisions:
- issue: Значение κύριος
  choice: Господь
  alternative: господин
  rationale: Контекст говорит о божественной помощи и милости к Израилю, поэтому речь идёт о Боге. Перевод «Господь» сохраняет это богословское указание без добавочного толкования.
- issue: Соотношение Божьей милости и человеческих действий
  choice: Сохранена причинно-пояснительная связь через «ведь», без уточнения механизма содействия
  alternative: «поскольку Господь помог им»
  rationale: Греческий текст говорит именно о милосердном отношении Господа, а не употребляет глагол «помогать». Перевод не должен превращать подразумеваемое содействие в явное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сохраняет характер фрагмента, продолжающего предшествующий перечень инфинитивов; конечная запятая отражает незавершённость предложения в предоставленном исходном тексте.
