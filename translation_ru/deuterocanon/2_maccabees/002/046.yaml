  source_fidelity: В целом перевод точно передаёт предметный перечень в греческом тексте и сохраняет его синтаксическую незавершённость. «О событиях, связанных с...» допустимо передаёт Τὰ ... κατὰ. «Величайшего святилища» сохраняет превосходную степень μεγίστου и культовое значение ἱερόν. Однако «посвящение жертвенника» по-русски менее естественно и может звучать как действие посвящения предмета кому-либо; для ἐγκαινισμός в этом храмовом контексте точнее и идиоматичнее «освящение».
