  text: The matters concerning Judas Maccabeus and his brothers[a], and the purification of the greatest sanctuary, and the dedication of the altar,
translation:
  language: ru
  text: О событиях, связанных с Иудой Маккавеем и его братьями, об очищении величайшего святилища и освящении жертвенника[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повторном освящении жертвенника». Греческое слово означает «посвящение» или «освящение»; исторический контекст связан с восстановлением жертвенника после осквернения.'
    reason: Сноска сохраняет контекстуально возможное значение повторности, которого греческое слово само по себе прямо не выражает, и точно поясняет его лексический диапазон.
lexical_decisions:
- source_word: Τὰ ... κατὰ τὸν Ἰούδαν
  choice: о событиях, связанных с Иудой
  rationale: Оборот с субстантивированным средним множественного числа и κατά обозначает широкий круг событий и обстоятельств, относящихся к Иуде. Такой перевод естественен по-русски и не сужает смысл до одних лишь деяний.
- source_word: Ἰούδαν τὸν Μακκαβαῖον
  choice: Иудой Маккавеем
  rationale: Традиционная и узнаваемая русская передача имени и прозвания; падеж обусловлен русской конструкцией «связанных с».
- source_word: τοὺς τούτου ἀδελφούς
  choice: его братьями
  rationale: Речь идёт о родных братьях Иуды; местоимение точно передаёт τούτου и устраняет ненужную тяжеловесность.
- source_word: τοῦ ἱεροῦ τοῦ μεγίστου
  choice: величайшего святилища
  rationale: ἱερόν обозначает храмовое святилище или храмовый комплекс, а превосходная степень μεγίστου прямо сохранена словом «величайшего» без подмены смыслом «святейшего».
- source_word: καθαρισμόν
  choice: очищении
  rationale: Слово сохраняет ритуальный смысл очищения святилища и естественно звучит в данном историко-культовом контексте.
- source_word: βωμοῦ
  choice: жертвенника
  rationale: В контексте жертвоприношений βωμός точнее передаётся традиционным русским словом «жертвенник», а не более общим «алтарь».
- source_word: ἐγκαινισμόν
  choice: посвящении
  rationale: Греческое существительное означает посвящение или введение в употребление и само по себе не выражает повторности; исторически вероятный смысл повторного освящения вынесен в сноску.
theological_decisions:
- issue: Передача ἱερόν в контексте иудейского богослужения
  choice: святилище
  alternative: храм
  rationale: «Святилище» близко передаёт культовый оттенок ἱερόν и не ограничивает значение одним зданием, хотя «храм» также возможен в контексте Иерусалимского храма.
- issue: Подразумевает ли ἐγκαινισμός повторное освящение
  choice: посвящение
  alternative: повторное освящение
  rationale: Основной текст следует явной лексической форме греческого слова и не добавляет отсутствующего показателя повторности; исторический контекст о восстановлении после осквернения отражён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Сохранена синтаксическая незавершённость исходного фрагмента и заключительная запятая; искусственный вводный связующий элемент не добавлен.
