lexical_decisions:
- source_word: συνοικῶν αὐτῇ
  choice: находясь вместе с ней
  rationale: Буквально причастие может означать «живя вместе с ней», однако в данном повреждённом или несогласованном контексте нейтральное «находясь вместе» сохраняет идею совместного пребывания, не навязывая отношения сожительства.
- source_word: παρῆγεν εἰς τὸν τόπον
  choice: вели [его] к тому месту
  rationale: παράγω означает «вести, приводить». Форма глагола в греческом единственного числа, но при составном подлежащем Ἀντίοχος καὶ οἱ… возможна согласованность с ближайшим именем; объект в тексте не выражен, поэтому его восполнение отмечено квадратными скобками.
- source_word: οἱ σὺν αὐτῷ φίλοι
  choice: его друзья
  rationale: Естественная русская передача выражения о друзьях или приближённых, находившихся с Антиохом.
- source_word: κύριον τὸ λαβεῖν
  choice: получить власть над
  rationale: Сочетание κύριον и инфинитива передаёт обретение господства или права распоряжаться, а не простое физическое получение.
- source_word: τὰ χρήματα πλείονα
  choice: большей суммой денег
  rationale: Сравнительная форма πλείονα естественно указывает на большее количество или сумму; это значение сохранено в основном тексте.
- source_word: εἰς ἐφορῆς λόγον
  choice: под предлогом проверки
  rationale: λόγος здесь обозначает заявленное основание, а ἐφορή — надзор или проверку; в контексте выражение естественно передаётся как предлог для действий.
