  yaml_path: translation/deuterocanon/2_maccabees/002/035.yaml
  text: And then the Lord will reveal these things[a], and the glory of the Lord and the cloud will appear, as it was shown in the case of Moses, and as Solomon also asked[d][c][b], that the place might be greatly sanctified.
translation:
  language: ru
  text: И тогда Господь явит всё это[a], и явятся слава Господа и облако[b], как это было явлено Моисею[c], и как Соломон также просил, чтобы это место было в полной мере освящено[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «откроет всё это», «обнаружит всё это». Греческий глагол может означать раскрыть, явить или вывести на свет.'
    reason: lexical_alternative
  - marker: b
    text: Облако, вероятно, означает известное из повествований о Моисее и святилище облако Божьего присутствия.
    reason: cross_reference
  - marker: c
    text: 'Или: «как это было показано Моисею». Греческий оборот сопоставляет будущее явление с откровением, данным Моисею.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквальнее: «чтобы место было освящено весьма»; также возможно: «чтобы место было торжественно посвящено».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναδείξει
  choice: явит
  rationale: Глагол означает обнаружить, показать, явить или сделать известным; «явит» естественно сочетается с последующим описанием видимого явления и сохраняет библейский регистр.
- source_word: ταῦτα
  choice: всё это
  rationale: Указательное местоимение отсылает к ранее упомянутым сокрытым святыням, не называя их заново; «всё это» сохраняет открытую референцию.
- source_word: ὀφθήσεται
  choice: явятся
  rationale: Пассивная форма ὁράω в контексте теофании идиоматически означает «явиться, стать видимым»; множественное число продиктовано однородными подлежащими «слава» и «облако».
- source_word: δόξα
  choice: слава
  rationale: Традиционное и точное библейское соответствие, сохраняющее связь с языком богоявления.
- source_word: νεφέλη
  choice: облако
  rationale: Артикль указывает на известное из предания облако Божьего присутствия; в русском определённость достаточно передаётся контекстом.
- source_word: ἐπὶ Μωσῇ
  choice: при Моисее
  rationale: Оборот указывает на событие времён Моисея и соответствующий прецедент, а не на физическое положение «на Моисее».
- source_word: ἐδηλοῦτο
  choice: это было явлено
  rationale: Форма передаёт прежнее проявление; нейтральное «это» сохраняет некоторую грамматическую неопределённость того, что именно было явлено.
- source_word: ἠξίωσεν
  choice: просил
  rationale: В данном контексте глагол выражает просьбу Соломона; «просил» точнее держится греческой формы, чем более конкретное «молился».
- source_word: ὁ τόπος
  choice: это место
  rationale: Речь идёт об уже известном из контекста месте святилища; указательное «это» естественно передаёт определённость русского текста без поясняющей вставки.
- source_word: καταγιασθῇ
  choice: было освящено
  rationale: Глагол означает сделать святым, освятить; выбранное соответствие сохраняет сакральный смысл и привычный библейский регистр.
- source_word: μεγάλως
  choice: особо
  rationale: Буквальное «велико освящено» по-русски неестественно; «особо» передаёт усилительную функцию наречия, не привнося идеи великолепия.
theological_decisions:
- issue: Передача κύριος в контексте богоявления
  choice: Господь
  alternative: ГОСПОДЬ; Владыка
  rationale: Греческий источник содержит κύριος; «Господь» является прямым и традиционным соответствием без обратной реконструкции еврейского тетраграмматона.
- issue: Связь будущего явления с Моисеем и Соломоном
  choice: Сохранить историко-теофаническое сопоставление без доктринального расширения
  alternative: Пояснить облако как конкретную форму Божьего присутствия непосредственно в тексте
  rationale: Греческий текст сопоставляет будущее явление с прежним событием при Моисее и просьбой Соломона, но не даёт дальнейшего богословского толкования.
- issue: Смысл просьбы Соломона
  choice: «просил», чтобы место было освящено
  alternative: «молился» или «счёл достойным»
  rationale: Контекст поддерживает значение просьбы, однако перевод не уточняет её как молитву сильнее, чем это делает сам глагол.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет последовательность греческого текста, но согласование сказуемого дано по нормам русского языка. Неестественное буквальное усиление μεγάλως передано словом «особо» и пояснено в примечании.
