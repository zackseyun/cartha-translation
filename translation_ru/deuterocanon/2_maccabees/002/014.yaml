translation:
  language: ru
  text: 'Когда жертва сгорала, священники вознесли молитву — и священники, и все остальные[a]: Ионафан начинал, а остальные отвечали, как у Неемии[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь необычно повторено слово «священники»: буквально — «священники… и священники, и все». Вероятно, этим подчёркнуто участие в молитве всего собрания.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое выражение предельно кратко: буквально «как Неемии». Оно может означать «как делал Неемия», «как в молитве Неемии» или «по примеру Неемии».'
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴν ... ἐποιήσαντο
  choice: вознесли молитву
  rationale: Греческое сочетание буквально означает «совершили/сотворили молитву». «Вознесли молитву» естественно для современного литературного русского и сохраняет значение совместного молитвенного действия.
- source_word: δαπανωμένης τῆς θυσίας
  choice: когда жертва сгорала
  rationale: 'Причастие настоящего времени в родительном самостоятельном обороте указывает на происходящий процесс: жертва расходовалась, истощалась, то есть в данном культовом контексте сгорала. Такой перевод точнее передаёт аспект, чем завершённое «была сожжена».'
- source_word: οἵ τε ἱερεῖς καὶ πάντες
  choice: и священники, и все присутствовавшие
  rationale: Сохранён повтор слова «священники» после уже названного подлежащего; «присутствовавшие» поясняет подразумеваемый круг слова πάντες, не ограничивая его отдельной группой.
- source_word: καταρχομένου Ἰωνάθον
  choice: Ионафан начинал
  rationale: κατάρχομαι здесь обозначает начало или ведение совместного произнесения молитвы. «Начинал» сохраняет открытым вопрос, был ли он запевалой, руководителем или просто первым произносил слова.
- source_word: τῶν τε λοιπῶν ἐπιφωνούντων
  choice: остальные отвечали
  rationale: ἐπιφωνέω обозначает произнесение вслух, возглас или отклик; в контексте коллективной молитвы «отвечали» естественно передаёт вероятное респонсорное действие без излишней конкретизации о пении.
- source_word: ὡς Νεεμίου
  choice: как при Неемии
  rationale: Краткая греческая конструкция эллиптична. «Как при Неемии» остаётся столь же сжатым сравнением и не вставляет в основной текст спорное уточнение «в молитве» или «как делал».
theological_decisions:
- issue: Смысл эллиптического оборота ὡς Νεεμίου
  choice: как при Неемии
  alternative: как делал Неемия; как в молитве Неемии; по примеру Неемии
  rationale: Греческий текст не называет прямо ни молитву Неемии, ни его действие. Сжатая формулировка в основном тексте и пояснение в сноске сохраняют подлинную неоднозначность аллюзии.
- issue: Кто участвовал в молитве
  choice: священники и все присутствовавшие
  alternative: только священники; священники и все остальные
  rationale: Повторная конструкция οἱ ἱερεῖς ... οἵ τε ἱερεῖς καὶ πάντες, вероятно, подчёркивает участие всего собрания. Перевод сохраняет повтор и не исключает священников из значения «все».
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской окраской. Синтаксис сделан ясным, однако намеренный повтор исходного текста и неоднозначность заключительной фразы сохранены; архаизмы и конфессионально маркированная терминология не вводятся.
