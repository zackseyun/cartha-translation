    rationale: Русское «при Неемии» обычно обозначает время правления, эпоху или обстоятельства при данном лице. Греческое ὡς Νεεμίου — эллиптическое сравнение, вероятно «как [у/как у] Неемии», без прямого временного значения. Замена нужна для сохранения неоднозначности источника.
