  verdict: revise
  source_fidelity: «Когда жертва сгорала» удачно передаёт генетив абсолютный с δαπανωμένης как продолжающийся процесс. «Вознесли молитву» является естественной передачей προσευχὴν ἐποιήσαντο. Повтор «священники» и всеобщность συμμετοχής в целом сохранены. Однако «как при Неемии» сдвигает смысл ὡς Νεεμίου в сторону временного значения («во времена/в присутствии Неемии»), которого греческая эллиптическая конструкция не требует. «Как у Неемии» точнее сохраняет краткость и неоднозначную отсылку.
  naturalness: В целом текст литературен и понятен. Конструкция после тире намеренно воспроизводит неровный повтор оригинала, но лучше употребить «все остальные», чтобы яснее передать противопоставительно-добавочное οἵ τε ἱερεῖς καὶ πάντες. «Как у Неемии» естественно в русском при ссылке на образец, текст или практику и не превращает отсылку в указание на исторический период.
  terminology: «Священники», «жертва» и «молитва» точны и соответствуют нейтральному библейскому регистру. Имя «Ионафан» передано нормативно. Не следует вносить в основной текст «молитву Неемии» или «по примеру Неемии», поскольку это истолковывает эллипсис.
  issues:
