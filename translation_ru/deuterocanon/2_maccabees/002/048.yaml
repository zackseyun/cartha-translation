  text: and the appearances from heaven that came to those who fought bravely with zeal for Judaism[a], so that, though they were few, they plundered the whole country and drove off the barbarian hordes[c][b],
translation:
  language: ru
  text: и о явлениях с неба, явившихся тем, кто ревностно и доблестно сражались за иудаизм[a], так что они, хотя были малочисленны, разграбили всю страну и обратили в бегство варварские полчища[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «иудаизм» означает иудейскую веру и образ жизни, которые защищали от чужеземного давления.
    reason: cultural_note
  - marker: b
    text: 'Выражение «варварские полчища» передаёт этнокультурно окрашенное обозначение, употреблённое в греческом тексте; возможно также: «чужеземные толпы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφανείας
  choice: явлениях
  rationale: Слово обозначает видимые явления или проявления; «явления» естественно по-русски и не привносит более позднего специального богословского смысла.
- source_word: τὰς ἐξ οὐρανοῦ γενομένας
  choice: с неба
  rationale: Оборот указывает на небесное происхождение и совершившийся характер явлений; в русском контексте это ёмко передаётся сочетанием «явления с неба».
- source_word: φιλοτίμως ἀνδραγαθήσασιν
  choice: с ревностью доблестно сражался
  rationale: Сочетание сохраняет как усердную преданность делу, выраженную φιλοτίμως, так и воинскую доблесть ἀνδραγαθέω; военный контекст оправдывает глагол «сражался».
- source_word: ὑπὲρ τοῦ Ἰουδαισμοῦ
  choice: за иудаизм
  rationale: Прямой русский эквивалент названия религиозного и культурного уклада, который защищали от чужеземного давления.
- source_word: ὡς
  choice: так что
  rationale: 'Передаёт результирующее значение: небесные явления сопровождались поразительным успехом малочисленных воинов.'
- source_word: τὴν ὅλην χώραν
  choice: всю страну
  rationale: Сохраняет полноту территориального охвата; χώρα в данном военно-политическом контексте естественно передать словом «страна».
- source_word: ὀλίγους ὄντας
  choice: хотя были малочисленны
  rationale: Ясно выражает уступительное значение причастного оборота и подчёркивает неожиданность победы.
- source_word: λεηλατεῖν
  choice: разграбили
  rationale: Прямо передаёт военное значение глагола — брать добычу, подвергать разграблению — без смягчения.
- source_word: τὰ βάρβαρα πλήθη
  choice: варварские полчища
  rationale: Сохраняет этнокультурно окрашенное обозначение самого источника и военный оттенок многочисленных вражеских масс.
- source_word: διώκειν
  choice: обратили в бегство
  rationale: В результирующем военном контексте выражает преследование и вытеснение противника естественнее буквального «преследовали».
theological_decisions:
- issue: Передача Ἰουδαϊσμός в историческом контексте Второй книги Маккавейской
  choice: иудаизм
  alternative: иудейский образ жизни
  rationale: «Иудаизм» прямо называет защищаемую религиозно-культурную идентичность, не заменяя термин истолковывающим описанием.
- issue: Характер небесного вмешательства
  choice: явления с неба
  alternative: небесные проявления
  rationale: 'Перевод сохраняет предметную неоднозначность: текст говорит о явлениях небесного происхождения, не уточняя их вид и не навязывая специального догматического толкования.'
