  choice: словно выстроившись для битвы против царя
  alternative: словно стоя в строю перед царём
  rationale: Сочетание παρατάσσομαι с πρός наиболее естественно описывает боевое построение против противника. Необычное сопоставление сохранено в основном тексте, а менее вероятная пространственная трактовка не внесена в перевод.
