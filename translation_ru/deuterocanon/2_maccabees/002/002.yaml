lexical_decisions:
- source_word: ἐκ μεγάλων κινδύνων
  choice: от великих опасностей
  rationale: Сохраняет значение ἐκ как избавления «от» или «из» опасностей, их множественное число и усиление μεγάλων.
- source_word: ὑπὸ τοῦ θεοῦ
  choice: Богом
  rationale: Творительный падеж естественно передаёт действующее лицо при пассивной конструкции с ὑπό и родительным падежом.
- source_word: σεσωσμένοι
  choice: спасённые
  rationale: 'Краткое причастие в составе начального оборота передаёт перфектное пассивное причастие: спасение уже совершилось, а его результат сохраняется.'
- source_word: μεγάλως εὐχαριστοῦμεν αὐτῷ
  choice: мы горячо благодарим Его
  rationale: «Горячо благодарим» естественно для современного русского языка передаёт усилительное μεγάλως и дательный объект αὐτῷ, не превращая благодарение в тяжеловесную именную конструкцию.
- source_word: ὡς ἂν
  choice: словно
  rationale: Передаёт сравнительно-предположительный оттенок сжатого греческого оборота, не утверждая буквальное участие в сражении.
- source_word: πρὸς βασιλέα
  choice: против царя
  rationale: При παρατάσσομαι предлог πρός естественно имеет противительное значение в военном контексте.
- source_word: παρατασσόμενοι
  choice: выстроившись для битвы
  rationale: Передаёт военный образ построения в боевой порядок; добавление «для битвы» делает образ понятным по-русски, не устраняя его сжатости.
