  text: And some of those who had followed came near to mark the way[a], but they were not able to find it.
translation:
  language: ru
  text: Некоторые из тех, кто шёл следом, подошли, чтобы обозначить дорогу[a], но не смогли её найти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обозначить путь» либо «отметить маршрут». Греческое ὁδός в зависимости от контекста может означать дорогу, путь или маршрут.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθόντες
  choice: подошли
  rationale: Аористное причастие от προσέρχομαι передаёт приближение к подразумеваемому месту; «подошли» естественно выражает это движение по-русски.
- source_word: τινὲς τῶν συνακολουθούντων
  choice: некоторые из тех, кто шёл следом
  rationale: Сохраняет партитивную конструкцию τινὲς τῶν и значение совместного следования, не вводя более узкого понятия «спутники».
- source_word: ὥστε ἐπισημήνασθαι τὴν ὁδόν
  choice: чтобы обозначить дорогу
  rationale: ὥστε с инфинитивом здесь естественно передаёт намерение, а ἐπισημήνασθαι — нанесение или оставление приметы, позволяющей распознать путь. «Дорогу» сохраняет предметную, но контекстуально гибкую семантику ὁδός.
- source_word: οὐκ ἠδυνήθησαν
  choice: не смогли
  rationale: Краткий и естественный современный русский эквивалент выраженного в греческом тексте отсутствия способности или возможности.
- source_word: εὑρεῖν
  choice: её найти
  rationale: Местоимение, согласованное с «дорогой», делает подразумеваемый объект инфинитива явным и сохраняет смысловую связь с предыдущей частью фразы.
