    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐντεῦθεν οὖν
  choice: Итак, с этого места
  rationale: Передаёт как переходную силу οὖν, так и указание Ἐντεῦθεν на начало основной части повествования.
- source_word: ἀρξώμεθα τῆς διηγήσεως
  choice: начнём повествование
  rationale: Форма «начнём» естественно передаёт побудительный конъюнктив первого лица множественного числа, а «повествование» соответствует литературному контексту διήγησις.
- source_word: τοῖς προειρημένοις τοσοῦτον ἐπιζεύξαντες
  choice: добавив к сказанному прежде лишь это
  rationale: Сохраняет образ присоединения краткого заключительного замечания к уже сказанному; «лишь» передаёт ограничительный смысл τοσοῦτον в контексте.
- source_word: εὔηθες
  choice: неразумно
  rationale: Обозначает отсутствие здравого суждения; русское «неразумно» ясно и уместно для авторской оценки литературного приёма.
- source_word: τὸ μὲν πρὸ τῆς ἱστορίας πλεονάζειν
  choice: пространно излагать то, что предшествует историческому рассказу
  rationale: Передаёт πλεονάζειν как превышение должной меры в предварительном материале, не превращая оборот в неестественное русское выражение.
- source_word: τὴν δὲ ἱστορίαν ἐπιτέμνειν
  choice: а сам рассказ сокращать
  rationale: Сохраняет резкое противопоставление предварительного материала основному рассказу и значение ἐπιτέμνειν — урезать, сокращать.
