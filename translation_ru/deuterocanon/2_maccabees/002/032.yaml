  text: So then[a], let us begin the narrative from this point, adding only this much to what has been said before; for it is foolish to be excessive before the history and to abridge the history itself.
translation:
  language: ru
  text: 'Итак, начнём отсюда повествование, добавив к сказанному выше лишь это: ведь неразумно чрезмерно распространяться перед историческим изложением[a], а само историческое изложение сокращать.'
