base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/002/013.yaml
  text: But when it happened that time had passed and the sun shone out[a], though it had been overcast, a great fire was kindled, so that everyone marveled.
translation:
  language: ru
  text: Когда же прошло некоторое время и солнце засияло, хотя и было покрыто облаками[a], был зажжён большой огонь, так что все изумились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будучи покрытым облаками». Греческий оборот ἐπινεφὴς ὤν буквально характеризует солнце как покрытое облаками; его можно понимать как сопутствующее обстоятельство, а не только как уступку («хотя»).'
    reason: Сохранение грамматической связи оборота со словом «солнце» и его синтаксической нюансировки.
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο καὶ χρόνος διῆλθεν
  choice: Когда же прошло некоторое время
  rationale: Естественная русская передача временного перехода; громоздкое буквальное «когда же случилось, что и время прошло» не добавляет смысла.
- source_word: ὅ τε ἥλιος ἀνέλαμψεν
  choice: и солнце засияло
  rationale: ἀναλάμπω означает «засиять, ярко заблестеть»; выбранная формулировка ясно передаёт появление солнечного света.
- source_word: ἐπινεφὴς ὤν
  choice: хотя было облачно
  rationale: Передача понимает оборот уступительно, как указание на облачную погоду, но неоднозначность его связи с предшествующим «солнцем» отмечена в сноске.
- source_word: ἀνήφθη πυρὰ μεγάλη
  choice: разгорелся большой огонь
  rationale: Сохраняется общее значение πυρά — «огонь» — без уточнения его жертвенного назначения; «разгорелся» естественно передаёт пассивное ἀνήφθη.
- source_word: ὥστε θαυμάσαι πάντας
  choice: так что все изумились
  rationale: Оборот ὥστε с инфинитивом выражает результат, а πάντας охватывает всех присутствовавших.
theological_decisions:
- issue: Характер огня (πυρά)
  choice: большой огонь
  alternative: большой жертвенный огонь
  rationale: Хотя контекст может связывать огонь с жертвоприношением, сам греческий текст этого стиха называет его просто огнём; уточнение не внесено.
- issue: Связь облачности с появлением солнца
  choice: уступительное «хотя было облачно»
  alternative: временное «пока было облачно» или буквальное отнесение определения к солнцу
  rationale: Контекстуально уступительное понимание связно, однако греческий оборот допускает иную синтаксическую нюансировку, поэтому она сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Формулировки просты и понятны; контекстуальные уточнения, отсутствующие в греческом тексте, не добавлены. Предоставленный греческий текст, по-видимому, не соответствует указанной ссылке 2 Маккавейская 2:13; перевод выполнен строго по предоставленному исходному тексту.
