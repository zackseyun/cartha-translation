  text: And he testified to everyone about the works of the greatest God that he had seen with his own eyes[a].
translation:
  language: ru
  text: И он свидетельствовал всем о делах величайшего Бога, которые видел собственными глазами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более традиционной передаче: «Всевышнего Бога». Здесь по-гречески стоит слово «величайшего» (μεγίστου), а не обычное слово со значением «Всевышний».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεμαρτύρει
  choice: свидетельствовал
  rationale: Имперфект передаёт продолжающееся или повторявшееся свидетельство; глагол сохраняет оттенок публичного подтверждения увиденного.
- source_word: πᾶσιν
  choice: всем
  rationale: Дательный падеж обозначает адресатов свидетельства и сохраняет всеобщий охват.
- source_word: ἅπερ
  choice: о делах… которые
  rationale: Относительное местоимение связывает содержание свидетельства с увиденным; перестройка фразы естественна по-русски.
- source_word: ὑπʼ ὄψιν
  choice: собственными глазами
  rationale: Идиома подчёркивает непосредственное личное зрительное восприятие.
- source_word: τεθεαμένος
  choice: видел
  rationale: Перфектное причастие указывает на совершившееся личное созерцание, значимое в момент свидетельства; простой русский глагол звучит ясно и естественно.
- source_word: ἔργα
  choice: делах
  rationale: «Дела» точно и привычно обозначает совершённые Богом действия.
- source_word: τοῦ μεγίστου θεοῦ
  choice: величайшего Бога
  rationale: Прилагательное μεγίστου означает «величайшего», тогда как обычное греческое слово для титула «Всевышний» — ὕψιστος.
theological_decisions:
- issue: Передача божественного именования μεγίστου θεοῦ
  choice: величайшего Бога
  alternative: Всевышнего Бога
  rationale: Перевод сохраняет буквальное значение греческого превосходного прилагательного и не подменяет его традиционным титулом, основанным на другом греческом слове; привычный вариант указан в сноске.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и достойное по тону. «Свидетельствовал» сохраняет публичный характер сообщения, а «собственными глазами» естественно передаёт силу греческой идиомы.
