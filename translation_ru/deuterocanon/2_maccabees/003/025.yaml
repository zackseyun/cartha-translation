base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/025.yaml
  text: For a horse appeared to them with a fearsome rider[a], adorned with a most beautiful saddlecloth; and rushing headlong, it struck Heliodorus with its front hoofs[b], while the one seated on it appeared to be wearing golden armor.
translation:
  language: ru
  text: Ибо им явился конь с грозным всадником, украшенный превосходным конским убором[a]. Стремительно ринувшись вперёд, конь ударил Илиодора передними копытами[b], а сидевший на нём, казалось, был облачён в золотые доспехи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «украшенный великолепной сбруей»; греческое слово обозначает нарядное снаряжение, или убор, коня.'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол буквально означает «потряс, сотряс» и здесь может подразумевать сильное биение передними копытами.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: явился
  rationale: Аорист пассивной формы ὁράω здесь обозначает внезапное появление перед наблюдателями; «явился» естественно передаёт это, не определяя, было ли явление физическим или видением.
- source_word: τις ἵππος
  choice: конь
  rationale: Неопределённое τις не требует отдельной передачи в русском; «конь» уместен для повествования о всаднике и сохраняет возвышенный, но понятный регистр.
- source_word: φοβερὸν ἔχων τὸν ἐπιβάτην
  choice: с грозным всадником
  rationale: φοβερός описывает всадника как внушающего страх; «грозный» передаёт это без чрезмерного усиления.
- source_word: καλλίστῃ σαγῇ διακεκοσμημένος
  choice: украшенный великолепнейшей сбруей
  rationale: σαγή обозначает конское снаряжение или декоративный убор; «сбруя» понятно современному читателю, а превосходная степень отражена словом «великолепнейшей».
- source_word: φερόμενος δὲ ῥύδην
  choice: стремительно ринувшись вперёд
  rationale: Передаёт скорость и неудержимую, резкую направленность движения.
- source_word: ἔσεισεν
  choice: ударил
  rationale: Хотя основное значение глагола — «трясти, сотрясать», сочетание с передними копытами в данном контексте описывает сильный удар; неоднозначность отмечена в сноске.
- source_word: τὰς ἐμπροσθίους ὁπλάς
  choice: передними копытами
  rationale: ὁπλή конкретно означает копыто, а ἐμπροσθίους указывает на переднюю пару.
- source_word: ὁ δὲ ἐπικαθήμενος
  choice: сидевший на нём
  rationale: Сохраняет описательную форму греческого субстантивированного причастия и его отсылку к уже названному всаднику.
- source_word: χρυσῆν πανοπλίαν
  choice: золотые доспехи
  rationale: πανοπλία означает полный комплект вооружения; русское множественное «доспехи» естественно передаёт цельный боевой убор.
theological_decisions:
- issue: Природа явления в сцене суда над Илиодором
  choice: Описать коня и всадника как явившихся видимым образом, не уточняя природу события
  alternative: Явно назвать происходящее видением либо символическим образом
  rationale: Греческий текст повествует о явлении и нападении в конкретных выражениях, но сам по себе не требует догматического вывода о физической или визионерской природе события.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной интонацией. Повтор слова «конь» во втором предложении устраняет возможную двусмысленность причастного оборота и ясно показывает, кто наносит удар.
