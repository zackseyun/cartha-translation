  yaml_path: translation/deuterocanon/2_maccabees/003/034.yaml
  text: But you[a], having been scourged from heaven, proclaim to all the majestic power of God. And when they had said these things[b], they became invisible.
translation:
  language: ru
  text: Ты же, подвергшийся бичеванию с небес, возвещай всем великое могущество Бога.[a] Сказав это, они стали невидимыми.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «величественную силу Бога». Греческое выражение соединяет значения величия или величественности и силы или могущества.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «они исчезли»; «они скрылись из виду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεμαστιγωμένος
  choice: после бичевания
  rationale: Перфектное страдательное причастие указывает на уже перенесённое жестокое телесное наказание и его сохраняющийся результат. Существительное «бичевание» передаёт физическую силу образа и сохраняет возвышенный повествовательный регистр.
- source_word: ἐξ οὐρανοῦ
  choice: с небес
  rationale: Сохраняет прямо выраженный в греческом небесный источник наказания, не добавляя явного указания «Богом» и не устраняя возможный оттенок божественного действия.
- source_word: διάγγελλε
  choice: возвещай
  rationale: Повелительная форма требует открыто и широко сообщать о случившемся; «возвещай» естественно передаёт публичный и торжественный характер глагола.
- source_word: πᾶσι
  choice: всем
  rationale: Кратко и точно обозначает всеобщую аудиторию возвещения.
- source_word: τὸ μεγαλεῖον ... κράτος
  choice: величие силы
  rationale: 'Сочетание сохраняет оба смысловых компонента греческого выражения: величие/величественность и проявленную силу/могущество.'
- source_word: ἀφανεῖς ἐγένοντο
  choice: они стали невидимы
  rationale: Буквально передаёт становление незримыми, сохраняя сверхъестественный характер сцены; более свободное «исчезли» возможно, но менее прозрачно отражает греческую форму.
theological_decisions:
- issue: Подразумеваемый деятель небесного наказания Илиодора
  choice: сохранить «с небес» без добавления «Богом»
  alternative: «наказанный Богом с небес» или «наказанный небом»
  rationale: Греческий текст прямо называет небесный источник, тогда как божественный деятель ясен из контекста. Перевод не превращает подразумеваемое в прямо высказанное.
- issue: Сверхъестественное удаление небесных фигур
  choice: «они стали невидимы»
  alternative: «они исчезли» или «скрылись из виду»
  rationale: Выбранная формулировка сохраняет буквальную направленность греческого выражения на незримость, не уточняя, ушли ли фигуры или перестали быть видимыми иным образом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Конструкция «после бичевания с небес» избегает неестественного русского причастного оборота, сохраняя физический характер наказания и небесный источник. Формулировка не добавляет конфессионально обусловленных толкований.
