  text: But a certain Simon[a], of the tribe of Benjamin, having been appointed overseer of the temple, was at odds with the high priest about the administration of the market in the city.
translation:
  language: ru
  text: Но некий Симон из колена Вениамина, назначенный смотрителем храма, имел разногласия с первосвященником по вопросу надзора за рынком в городе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по вопросу надзора за городским рынком» или «регулирования рынка в городе». Греческое слово обозначает гражданский административный надзор, связанный с рынком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προστάτης
  choice: распорядитель
  rationale: Слово обозначает лицо, поставленное во главе дела для надзора и попечения; «распорядитель» естественно передаёт официальную административную функцию при храме, не приписывая Симону священнического сана.
- source_word: τοῦ ἱεροῦ
  choice: храма
  rationale: ἱερόν здесь обозначает храм как комплекс, а не только внутреннее святилище.
- source_word: καθεσταμένος
  choice: назначенный
  rationale: Причастие указывает на официальное поставление Симона на эту должность.
- source_word: διηχθῆναι
  choice: разошёлся ... во мнениях
  rationale: Передаёт возникшее разногласие с первосвященником, не усиливая его до открытой вражды.
- source_word: ἀρχιερεῖ
  choice: первосвященником
  rationale: Обычное и точное русское наименование данной иудейской должности.
- source_word: ἀγορανομίας
  choice: надзора за торговлей
  rationale: Термин относится к административному надзору и регулированию дел, связанных с городским рынком; по-русски «торговля» здесь шире и естественнее буквального «рынок».
- source_word: κατὰ τὴν πόλιν
  choice: в городе
  rationale: Оборот указывает на город как сферу осуществления такого надзора.
theological_decisions:
- issue: Характер должности Симона при храме
  choice: Официально назначенный распорядитель храма, без указания на священнический сан
  alternative: Покровитель или защитник храма в более широком смысле
  rationale: Сочетание προστάτης ... καθεσταμένος подчёркивает установленную надзорно-административную роль; сам стих не называет Симона священником.
