lexical_decisions:
- source_word: ἀδίκησαί
  choice: поступить несправедливо с
  rationale: Передаёт нравственно-правовой смысл глагола — обойтись с кем-либо несправедливо, не сводя его к причинению физического вреда.
- source_word: τοὺς πεπιστευκότας
  choice: с теми, кто доверился
  rationale: Перфектное причастие указывает на уже оказанное и сохраняющееся доверие; русский глагол «доверился» естественно сочетается с последующими дательными формами.
- source_word: ἁγιωσύνῃ
  choice: святости
  rationale: Прямо передаёт священный характер места.
- source_word: σεμνότητι
  choice: величию
  rationale: В контексте храма обозначает внушающее почтение достоинство; «величие» звучит естественно и сохраняет возвышенный регистр.
- source_word: ἀσυλίᾳ
  choice: неприкосновенности
  rationale: Передаёт защищённость храма от посягательств и изъятия, не ограничивая значение только формальным правом убежища; этот оттенок отмечен в сноске.
- source_word: τετιμημένου
  choice: почитаемого
  rationale: Передаёт устойчивое признание и почёт, выраженные перфектным пассивным причастием.
- source_word: κατὰ τὸν σύμπαντα κόσμον
  choice: во всём мире
  rationale: Естественная русская формула, сохраняющая риторически всеобщий масштаб исходного выражения.
- source_word: παντελῶς ἀμήχανον εἶναι
  choice: совершенно невозможно
  rationale: Сохраняет усиление παντελῶς и категоричность ἀμήχανον без лишнего разъяснения.
theological_decisions:
- issue: Следует ли явно передавать ἀσυλίᾳ как право убежища
  choice: неприкосновенности
  alternative: праву убежища / статусу убежища
  rationale: В данном перечислении слово обозначает сакрально-правовую защищённость храма и стоит рядом с отвлечёнными понятиями святости и величия. «Неприкосновенность» сохраняет широкий смысл, а более узкий оттенок права убежища вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим храмовому контексту. Синтаксис сохраняет зависимость от предшествующего контекста посредством начального «и что»; формулировка остаётся понятной без упрощения нравственно-правового смысла.
