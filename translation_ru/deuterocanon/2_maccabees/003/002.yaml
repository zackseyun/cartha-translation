lexical_decisions:
- source_word: εὐσέβειαν
  choice: благочестию
  rationale: Передаёт почтение к Богу, проявляющееся в благочестивой жизни, и естественно звучит в храмовом контексте.
- source_word: μισοπονηρίαν
  choice: ненависти к злу
  rationale: Сохраняет буквальную силу сложного существительного и не сужает значение до какого-либо отдельного вида проступков.
- source_word: συνέβαινεν
  choice: получалось так
  rationale: Передаёт значение возникавшего или устойчиво наблюдавшегося следствия, а также несовершенный вид греческого глагола.
- source_word: τιμᾶν τὸν τόπον
  choice: чтили это место
  rationale: Сохраняет почтительное обозначение храмового места; указательное «это» естественно связывает фразу с ближайшим контекстом.
- source_word: τὸ ἱερὸν
  choice: святилище
  rationale: Передаёт священный храмовый комплекс или участок и сохраняет отличие от предшествующего «места».
- source_word: ἀποστολαῖς
  choice: посылая ему ... дары
  rationale: Контекст указывает на посылаемые царями благодеяния храму; глагольная конструкция по-русски естественно сохраняет идею отправления, заключённую в существительном.
- source_word: ταῖς κρατίσταις
  choice: самые великолепные
  rationale: Передаёт превосходную степень со значением наилучшего или превосходнейшего применительно к дарам.
- source_word: δοξάζειν
  choice: прославляли
  rationale: Сохраняет оттенок придания славы и великолепия и не смешивает этот глагол с уже употреблённым «чтили».
theological_decisions:
- issue: К кому относятся благочестие и ненависть к злу
  choice: Не называть конкретного носителя этих качеств
  alternative: Отнести качества непосредственно к первосвященнику, городскому управлению или храму
  rationale: В данном греческом фрагменте личный носитель качеств прямо не назван. Перевод сохраняет эту открытость и передаёт их как основание последующего царского почтения.
- issue: Характер царских приношений
  choice: Передать ἀποστολαῖς как посылаемые дары
  alternative: Перевести как приношения, пожертвования или посольства
  rationale: Храмовый контекст поддерживает значение материальных благодеяний, но само слово подчёркивает их отправление; примечание сохраняет возможный оттенок приношений.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного историко-религиозного текста. Конструкция «получалось так» сохраняет результативно-повторительный оттенок имперфекта; формулировка не уточняет без достаточного основания носителя благочестия и ненависти к злу.
