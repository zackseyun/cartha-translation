  yaml_path: translation/deuterocanon/2_maccabees/003/020.yaml
  text: And all of them[a], stretching out their hands toward heaven[b], were making supplication.
translation:
  language: ru
  text: Все они[a], простирая руки к небу, возносили мольбу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все женщины»: греческое слово стоит в форме женского рода множественного числа и, вероятно, относится к женщинам, упомянутым выше.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово означает усердное прошение или мольбу, а не обязательно «литанию» в её позднейшем церковном смысле.
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσαι
  choice: все они
  rationale: Форма женского рода множественного числа, вероятно, отсылает к женщинам из предшествующего контекста. Местоименное выражение сохраняет эту контекстуальную связь, не добавляя существительного в основной текст.
- source_word: προτείνουσαι
  choice: простирая
  rationale: Причастие обозначает вытягивание рук вперёд; «простирая руки» естественно и достойно передаёт молитвенный жест.
- source_word: τὰς χεῖρας
  choice: руки
  rationale: В русском языке принадлежность частей тела здесь естественно определяется подлежащим и не требует притяжательного местоимения.
- source_word: εἰς τὸν οὐρανόν
  choice: к небу
  rationale: Предлог передаёт направленность жеста, а «небо» в контексте молитвы указывает на небесную сферу, к которой обращена мольба.
- source_word: ἐποιοῦντο
  choice: возносили
  rationale: Русский глагол несовершенного вида передаёт продолженное действие греческого имперфекта; сочетание «возносили мольбу» звучит естественнее буквального «совершали мольбу».
- source_word: τὴν λιτανείαν
  choice: мольбу
  rationale: Слово обозначает настойчивое, усердное прошение. «Мольба» передаёт смысл без позднейшего специального значения церковной литании.
theological_decisions:
- issue: Значение οὐρανός в молитвенном жесте
  choice: небо
  alternative: небосвод
  rationale: Контекст молитвы показывает, что речь не просто о видимом небосводе, а о небе как направлении обращения к Богу; это следует из сцены и не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной, но общепонятной молитвенной лексикой. Несовершенный вид сохраняет длительность действия; подлинная неоднозначность женской формы отмечена в сноске.
