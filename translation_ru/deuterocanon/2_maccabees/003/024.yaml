base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/024.yaml
  text: But when he had already arrived there with the guards at the treasury[a], the Sovereign of spirits and of all authority made a great manifestation, so that all who had dared to come in, struck with awe at the power of God[c][b], were turned to weakness and fear.
translation:
  language: ru
  text: Но когда он вместе со стражниками[a] уже подошёл к сокровищнице, Властелин духов и всякой власти совершил великое явление[b], так что все, кто осмелился войти[c], поражённые могуществом Бога, впали в бессилие и страх.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «телохранителями»; греческое слово буквально означает «копьеносцы».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «совершил великое явление». Греческое выражение говорит о поразительном божественном проявлении, не уточняя его форму.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «осмелился собраться» или «осмелился прийти вместе с другими»; ближайший контекст говорит в пользу входа в область сокровищницы.'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτόθι ... κατὰ τὸ γαζοφυλάκιον ἤδη παρόντος
  choice: уже подошёл к сокровищнице
  rationale: Оборот указывает на прибытие Гелиодора к месту сокровищницы. «Подошёл» естественно передаёт прибытие к ней, не утверждая, что он уже находился внутри.
- source_word: δορυφόροις
  choice: стражниками
  rationale: Буквально это «копьеносцы», но здесь слово обозначает вооружённую охрану; «стражники» ясно передаёт их функцию.
- source_word: γαζοφυλάκιον
  choice: сокровищнице
  rationale: Обычное обозначение помещения или хранилища, где содержатся ценности.
- source_word: ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης
  choice: Властелин духов и всякой власти
  rationale: «Властелин» передаёт δυνάστης как обозначение верховного правителя, не подменяя его словом κύριος. «Всякой власти» сохраняет широкий смысл πάσης ἐξουσίας.
- source_word: ἐπιφάνειαν μεγάλην ἐποίησεν
  choice: явил Себя во всём величии
  rationale: Естественная русская формулировка передаёт великое и поразительное божественное явление; буквальная конструкция «совершил великое явление» по-русски тяжеловесна.
- source_word: κατατολμήσαντας συνελθεῖν
  choice: кто осмелился войти
  rationale: Глагол выражает дерзновение, а в ближайшем контексте движение к сокровищнице лучше всего понимается как вход, хотя греческая формулировка допускает более общее понимание.
- source_word: καταπλαγέντας τὴν τοῦ θεοῦ δύναμιν
  choice: поражённые могуществом Бога
  rationale: Передаёт ошеломляющее воздействие Божьей силы, включая страх и изумление, без сужения смысла только до одной эмоции.
- source_word: εἰς ἔκλυσιν καὶ δειλίαν τραπῆναι
  choice: впали в бессилие и страх
  rationale: Оборот описывает переход в состояние телесной слабости и боязни; «впали» естественно передаёт наступивший результат.
theological_decisions:
- issue: Передача божественного титула ὁ τῶν πνευμάτων καὶ πάσης ἐξουσίας δυνάστης
  choice: Властелин духов и всякой власти
  alternative: Господь духов и всей силы
  rationale: Избранный вариант сохраняет отличие δυνάστης от обычного титула κύριος и подчёркивает верховенство Бога над духами и любой властью, не определяя дополнительно природу названных духов.
- issue: Характер божественной ἐπιφάνεια
  choice: явил Себя во всём величии
  alternative: совершил великое явление
  rationale: Основной текст ясно говорит о явном божественном вмешательстве, но не уточняет его форму прежде последующего повествования. Сноска сохраняет буквальную образность греческого выражения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным тоном. Божественный титул передан возвышенно и близко к греческой форме; синтаксис упрощён ради ясности без снятия смысловой неоднозначности, которая отмечена в сносках.
