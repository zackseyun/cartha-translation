base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/031.yaml
  text: But quickly some of Heliodorus's companions were urging Onias to call upon the Most High and grant life to the one who was lying at his last breath[a][b].
translation:
  language: ru
  text: Но тут же некоторые из приближённых Илиодора настойчиво просили Онию воззвать к Всевышнему[a] и даровать жизнь тому, кто лежал, уже при последнем издыхании[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взывать к Всевышнему».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тому, кто лежал при последнем дыхании», то есть был при смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταχὺ
  choice: тотчас
  rationale: Передаёт срочность последовавшей просьбы естественным для русского повествования наречием, не усиливая значение до абсолютной немедленности.
- source_word: τινες τῶν τῷ Ἡλιοδώρῳ συνηθῶν
  choice: некоторые из приближённых Илиодора
  rationale: Сочетание обозначает людей из близкого окружения Илиодора; «приближённые» естественно передаёт устойчивую связь с ним.
- source_word: ἠξίουν
  choice: стали просить
  rationale: В контексте глагол выражает настойчивую просьбу; форма с «стали» передаёт развёртывающееся действие имперфекта без чрезмерного усиления до «умоляли».
- source_word: ἐπικαλέσασθαι τὸν ὕψιστον
  choice: воззвать к Всевышнему
  rationale: В религиозном контексте означает молитвенно обратиться, призвать; «воззвать к» ясно и достойно передаёт этот смысл, а «Всевышний» сохраняет божественный титул.
- source_word: τὸ ζῆν χαρίσασθαι
  choice: даровать жизнь
  rationale: Передаёт как жизнь, так и оттенок милостивого дара в χαρίσασθαι; по синтаксису Онию просят и воззвать, и даровать жизнь.
- source_word: τῷ παντελῶς ἐν ἐσχάτῃ πνοῇ κειμένῳ
  choice: тому, кто лежал при последнем издыхании
  rationale: Сохраняет образ лежащего человека на грани смерти; «при последнем издыхании» естественно передаёт ἐν ἐσχάτῃ πνοῇ, а крайность состояния, выраженная παντελῶς, ясна из самой формулировки.
theological_decisions:
- issue: Передача божественного титула τὸν ὕψιστον
  choice: Всевышнему
  alternative: Богу Всевышнему
  rationale: Греческий текст содержит самостоятельный субстантивированный титул без добавленного слова «Бог»; «Всевышний» сохраняет эту форму.
- issue: Кто грамматически должен «даровать жизнь»
  choice: 'Ония: «просить Онию воззвать… и даровать»'
  alternative: 'Всевышний: «чтобы Всевышний даровал жизнь»'
  rationale: Оба инфинитива, ἐπικαλέσασθαι и χαρίσασθαι, синтаксически зависят от просьбы, обращённой к Онию. Это создаёт напряжённую формулировку, но её не следует молча перестраивать так, будто субъект второго действия прямо назван Всевышним.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной библейской лексикой. Имена переданы в принятой русской форме: Илиодор, Ония. Сохранена синтаксическая двусмысленность и богословское напряжение фразы о даровании жизни.'
