  terminology: «Илиодор», «Ония» и «Всевышний» переданы удачно. «Воззвать к Всевышнему» соответствует молитвенному ἐπικαλέσασθαι. Сохранено исходное синтаксическое построение, в котором оба инфинитива относятся к Онии; смысловое напряжение не устраняется доктринальным перефразированием.
