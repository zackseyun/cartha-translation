  yaml_path: translation/deuterocanon/2_maccabees/003/035.yaml
  text: But Heliodorus[a], after offering a sacrifice to God and making very great vows to the one who had preserved his life, and after taking leave of Onias[c][b], returned to the king.
translation:
  language: ru
  text: Илиодор же, принеся жертву Богу и дав величайшие обеты[a] Тому, кто сохранил ему жизнь, поприветствовав Онию[b], двинулся обратно к царю[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вознеся величайшие молитвы». Греческое слово может означать как молитвы, так и обеты; в связи с принесением жертвы здесь предпочтено значение «обеты».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приняв Онию» или «оказав Онии радушный приём». Греческий глагол может обозначать принятие или приветствие; точный оттенок не вполне ясен.'
    reason: lexical_alternative
  - marker: c
    text: Греческий глагол имеет военную окраску и может подразумевать выступление в обратный путь или снятие лагеря.
    reason: cultural_note
lexical_decisions:
- source_word: θυσίαν ἀνενέγκων
  choice: принеся жертву
  rationale: Сочетание ἀναφέρω с θυσία обозначает принесение жертвы; деепричастие естественно передаёт последовательность действий аористного причастия.
- source_word: εὐχὰς μεγίστας εὐξάμενος
  choice: дав величайшие обеты
  rationale: εὐχή может означать и молитву, и обет. Жертвенный контекст благоприятствует значению «обеты», а превосходная степень μεγίστας сохранена словом «величайшие».
- source_word: τῷ τὸ ζῆν περιποιήσαντι
  choice: Тому, кто сохранил ему жизнь
  rationale: Артиклевое причастие относится к Богу; περιποιέω здесь выражает сохранение Илиодору жизни после угрозы смерти.
- source_word: τὸν Ὀνίαν ἀποδεξάμενος
  choice: простился с Онией
  rationale: Хотя ἀποδέχομαι допускает значения «принять» и «приветствовать», контекст отъезда поддерживает значение прощания.
- source_word: ἀνεστρατοπέδευσεν πρὸς τὸν βασιλέα
  choice: двинулся обратно к царю
  rationale: Перевод сохраняет направленность движения и значение возвращения, а глагол «двинулся» слегка отражает военную окраску исходного слова без неестественной буквальности.
theological_decisions:
- issue: К кому относится выражение «Тому, кто сохранил ему жизнь»
  choice: К Богу, которому Илиодор принёс жертву и дал обеты.
  alternative: 'Передать более общо: «Тому, кто даровал ему жизнь».'
  rationale: Грамматическая связь и ближайший рассказ об избавлении Илиодора от смерти указывают именно на сохранение его жизни; дополнительных богословских уточнений текст не требует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксическая последовательность греческих причастий сохранена без тяжеловесной буквальности; неоднозначные места не скрыты и вынесены в примечания.
