    text: 'Или: «прекраснейшие величественным видом». Греческое выражение буквально связывает красоту со славой, великолепием или видимым обликом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι δὲ δύο
  choice: Но явились ему ещё двое
  rationale: ἕτεροι указывает на двух дополнительных лиц, отличных от уже упомянутого всадника; δέ передано мягким повествовательным «но».
- source_word: ἐφάνησαν αὐτῷ νεανίαι
  choice: явились ему ещё двое юношей
  rationale: ἐφάνησαν имеет здесь обычное непереходное значение «явились», αὐτῷ — «ему», а νεανίαι обозначает юношей без прямо выраженного указания на ангельскую природу.
- source_word: τῇ ῥώμῃ μὲν ἐκπρεπεῖς
  choice: выдающиеся силой
  rationale: ῥώμη означает физическую силу или мощь, а ἐκπρεπεῖς — заметное превосходство, исключительность.
- source_word: κάλλιστοι δὲ τὴν δόξαν
  choice: прекраснейшие обликом
  rationale: κάλλιστοι сохранено как превосходная степень; в данном описательном контексте δόξα указывает на видимый облик или величественную наружность, хотя выражение допускает оттенок славы и великолепия.
- source_word: διαπρεπεῖς δὲ τὴν περιβολήν
  choice: великолепные одеждой
  rationale: περιβολή означает одежду или облачение, а διαπρεπεῖς подчёркивает её заметное великолепие.
- source_word: οἵ καὶ παραστάντες ἐξ ἑκατέρου μέρους
  choice: Встав по обе стороны от него
  rationale: Аористное причастие передано естественным русским деепричастным оборотом; «от него» ясно восстанавливается из контекста.
- source_word: ἐμαστίγουν αὐτὸν ἀδιαλείπτως
  choice: они без конца бичевали его
  rationale: Имперфект выражает продолжавшееся действие; μαστιγόω передано более точным «бичевали», а ἀδιαλείπτως — современным и выразительным «без конца».
- source_word: πολλὰς ἐπιρριπτοῦντες αὐτῷ πληγάς
  choice: нанося ему множество ударов
  rationale: 'Оборот естественно передаёт способ действия: πληγαί — удары, а ἐπιρρίπτω в контексте избиения — наносить их.'
theological_decisions:
- issue: Природа явившихся фигур
  choice: «двое юношей» без определения их как ангелов
  alternative: «два ангела» или «два небесных существа»
  rationale: Греческий текст называет их νεανίαι и описывает их силу, красоту и одежду, но в этом стихе прямо не именует ангелами; перевод не уточняет их природу сверх текста.
- issue: Значение δόξα в описании юношей
  choice: «обликом» с примечанием об оттенках славы и величия
  alternative: «славой», «величественным видом» или «осанкой»
  rationale: В сочетании с красотой тела и великолепием одежды слово естественно относится к видимому облику, но его смысловой диапазон нельзя полностью свести к простой внешности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным и плавным; сохранены интенсивность продолжающегося бичевания, превосходная степень κάλλιστοι и неопределённость относительно природы юношей.
