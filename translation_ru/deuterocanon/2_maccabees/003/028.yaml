  source_fidelity: В целом переданы участники и контраст между недавним входом Гелиодора и его беспомощным выносом. Однако «теперь» не имеет соответствия в греческом тексте и создаёт дополнительный временной акцент. «Хранилище» слишком обобщённо для γαζοφυλάκιον в данном храмовом контексте; «сокровищница» точнее. «Верховная сила» звучит по-русски несколько искусственно и добавляет оттенок превосходства; δυναστεία здесь лучше передать как «могущество», не называя его источник прямо.
  naturalness: 'Исправленный вариант сохраняет литературный библейский регистр, но делает лексику более естественной: «сокровищница», «стража», «совершенно обессилевшим», «осознавшим могущество». Синтаксис с «того ... выносили» допустим и хорошо воспроизводит выделение объекта в греческом.'
