  yaml_path: translation/deuterocanon/2_maccabees/003/028.yaml
  text: The man who had just entered the treasury with much rushing about and all his guard[a], they carried out helpless, being completely incapacitated[c][b], having plainly recognized the sovereign power.
translation:
  language: ru
  text: Того, кто только что вошёл в упомянутую сокровищницу с большой суетой[a] и со всей своей стражей, выносили оттуда беспомощным, совершенно обессилевшим[b] и явно осознавшим могущество.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с большой помпой»; греческое выражение может обозначать суетливое, показное движение при его входе.'
    reason: lexical_alternative
  - marker: b
    text: Греческое выражение трудно передать буквально; оно описывает состояние полного поражения и неспособности действовать.
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν ἄρτι ... εἰσελθόντα
  choice: того, кто только что вошёл
  rationale: Субстантивированное причастие обозначает Гелиодора; «только что» передаёт ἄρτι.
- source_word: μετὰ πολλῆς παραδρομῆς
  choice: с большой суетой
  rationale: παραδρομή передаёт торопливое движение и сопровождающую его суматоху; «суета» естественна по-русски и не сводит выражение исключительно к церемониальной пышности.
- source_word: πάσης δορυφορίας
  choice: со всей своей охраной
  rationale: δορυφορία означает вооружённую охрану или эскорт; притяжательное местоимение ясно выражает контекстуальную связь с вошедшим.
- source_word: τὸ προειρημένον ... γαζοφυλάκιον
  choice: упомянутое хранилище
  rationale: Сохранено значение προειρημένον «ранее упомянутое»; γαζοφυλάκιον в храмовом контексте обозначает сокровищницу или помещение для хранения ценностей.
- source_word: ἔφερον
  choice: теперь выносили оттуда
  rationale: Имперфект передан длительным повествовательным видом; «оттуда» естественно обозначает удаление из хранилища, подразумеваемое контекстом. «Теперь» подчёркивает контраст с ἄρτι.
- source_word: ἀβοήθητον
  choice: беспомощным
  rationale: Точно передаёт состояние человека, неспособного помочь себе, и сохраняет контраст с его многочисленной охраной.
- source_word: τοῖς ὅλοις καθεστῶτα
  choice: совершенно обессиленным
  rationale: Трудное идиоматическое выражение описывает итоговое состояние полного поражения и неспособности действовать; перевод сохраняет интенсивность без искусственной буквальности.
- source_word: φανερῶς
  choice: явно
  rationale: Передаёт очевидность признания или осознания для наблюдателей.
- source_word: τὴν δυναστείαν
  choice: верховную силу
  rationale: δυναστεία сочетает оттенки могущества и владычества; абстрактная формулировка оригинала сохранена без прямого добавления слова «Бог».
- source_word: ἐπεγνωκότα
  choice: познавшим
  rationale: Передаёт достигнутое вследствие пережитого полное осознание или признание силы.
theological_decisions:
- issue: Чья «верховная сила» имеется в виду
  choice: Сохранено абстрактное выражение «верховная сила»
  alternative: «сила Бога» или «могущество Владыки храма»
  rationale: Контекст указывает на божественную силу, защищающую храм, однако сам стих прямо не называет Бога; перевод не устраняет эту особенность текста.
