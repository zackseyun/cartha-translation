lexical_decisions:
- source_word: ἐπερωτήσαντος
  choice: спросил
  rationale: Генитив абсолютный задаёт обстоятельство последующего ответа; «спросил» естественно и точно передаёт действие царя.
- source_word: ποῖός τις εἴη
  choice: кого можно было бы
  rationale: В контексте вопрос касается того, кто окажется подходящим для поручения; условно-возможный оттенок εἴη передан сочетанием «можно было бы».
- source_word: ἐπιτήδειος
  choice: '[подходящего по смыслу конструкции «кого можно было бы послать»]'
  rationale: Русская конструкция с «кого можно было бы послать» естественно выражает пригодность кандидата, не добавляя идеи официальной квалификации.
- source_word: ἔτι ἅπαξ
  choice: снова
  rationale: Передаёт повторность отправления; уточнение буквальной формы и оттенка ещё одного раза сохранено в сноске.
- source_word: διαπεμφθῆναι
  choice: послать
  rationale: 'Пассивный инфинитив по-русски естественно передаётся неопределённо-личной конструкцией при «кого»: «кого можно было бы послать».'
- source_word: εἰς Ἱεροσόλυμα
  choice: в Иерусалим
  rationale: Нормальное русское управление при глаголе движения или отправления.
- source_word: ἔφησεν
  choice: тот сказал
  rationale: «Тот» ясно возвращает речь к Илиодору и устраняет возможную двусмысленность местоимения «он», не усиливая значение простого глагола речи.
