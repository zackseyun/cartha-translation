base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/032.yaml
  text: But the high priest[a], becoming suspicious that the king might perhaps suppose that some wrongdoing against Heliodorus had been carried out by the Jews, offered a sacrifice for the man's recovery.
translation:
  language: ru
  text: Но первосвященник, опасаясь, как бы царь не решил, что иудеи совершили какое-то злодеяние против Илиодора, принёс жертву за выздоровление этого человека[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за избавление этого человека» или «за спасение этого человека». Греческое слово σωτηρία может означать спасение, избавление или сохранение, но здесь, вероятнее всего, речь идёт о физическом выздоровлении Илиодора.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕποπτος ... γενόμενος
  choice: опасаясь
  rationale: В данном контексте первосвященник не сам оказывается под подозрением, а начинает тревожиться из-за возможного вывода царя. «Опасаясь» естественно сочетается с последующим «как бы» и передаёт настороженную тревогу.
- source_word: μή ποτε
  choice: как бы ... не
  rationale: Оборот вводит опасение относительно возможного развития событий; русская конструкция «опасаясь, как бы… не» точно и естественно передаёт этот оттенок.
- source_word: διάλημψιν
  choice: не решил
  rationale: Здесь слово обозначает мнение или предположение, которое мог составить царь. «Решил» в данном синтаксисе означает «пришёл к выводу» и не усиливает мысль до прямого обвинения.
- source_word: κακουργίαν τινά
  choice: какое-то злодеяние
  rationale: «Злодеяние» передаёт тяжесть дурного или преступного поступка, а «какое-то» сохраняет неопределённость τινά.
- source_word: περὶ τὸν Ἡλιόδωρον
  choice: против Илиодора
  rationale: В сочетании с κακουργίαν и συντετελέσθαι речь идёт о злодеянии, направленном против Илиодора, а не просто касающемся его.
- source_word: συντετελέσθαι
  choice: совершили
  rationale: Перфектный инфинитив указывает на действие, мыслимое как уже завершённое. Русское «совершили» естественно сочетается со словом «злодеяние»; предшествующее опасение передаёт косвую перспективу греческой конструкции.
- source_word: προσήγαγε θυσίαν
  choice: принёс жертву
  rationale: Устойчивое и понятное русское выражение для представления жертвы, сохраняющее конкретность греческого текста.
- source_word: ὑπὲρ τῆς ... σωτηρίας
  choice: за выздоровление
  rationale: В ближайшем повествовательном контексте σωτηρία относится к восстановлению Илиодора после телесного поражения. «Выздоровление» ясно передаёт основной смысл, а более широкие значения сохранены в сноске.
- source_word: τοῦ ἀνδρός
  choice: этого человека
  rationale: Передаёт явно выраженное существительное и отсылает к уже названному Илиодору, не заменяя его простым местоимением.
theological_decisions:
- issue: Значение σωτηρία в контексте телесного поражения и восстановления
  choice: выздоровление
  alternative: избавление; спасение
  rationale: Непосредственный контекст говорит о физическом состоянии Илиодора, поэтому «выздоровление» наиболее вероятно. Однако σωτηρία имеет более широкий диапазон значений, и эта смысловая широта отмечена в сноске без внесения в основной текст не требуемого контекстом сотериологического оттенка.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Конструкция «опасаясь, как бы… не» естественно передаёт опасение первосвященника; «какое-то злодеяние» сохраняет неопределённость и серьёзность предполагаемого поступка. Аппаратный знак «A» после ἀνδρός не включён в перевод как не относящийся к тексту стиха.
