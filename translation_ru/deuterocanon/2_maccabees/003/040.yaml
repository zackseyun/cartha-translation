  text: And the matter concerning Heliodorus and the safeguarding of the treasury proceeded in this way[a].
translation:
  language: ru
  text: Так развивались события, связанные с Илиодором и с охраной сокровищницы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Так обстояло дело с Илиодором и с охраной сокровищницы».'
    reason: 'Лексическая альтернатива: τὰ ... καθʼ Ἡλιόδωρον может означать «дело с Илиодором» или «события, связанные с Илиодором», а ἐχώρησεν в итоговом обороте — «обстояло/происходило».'
lexical_decisions:
- source_word: τὰ ... καθʼ Ἡλιόδωρον
  choice: дело Илиодора
  rationale: Субстантивированное среднее множественное с κατά обозначает события или дело, связанные с Илиодором; краткая формулировка сохраняет итоговый характер стиха.
- source_word: γαζοφυλακίου
  choice: храмовой сокровищницы
  rationale: В контексте главы речь идёт о сокровищнице Иерусалимского храма; уточнение «храмовой» естественно и устраняет возможную неясность.
- source_word: τήρησιν
  choice: сохранение
  rationale: 'Слово означает хранение, сбережение или охрану. «Сохранение» передаёт итог: сокровищница осталась неприкосновенной, не сводя значение только к действию стражи.'
- source_word: οὕτως
  choice: так
  rationale: Наречие подводит итог предшествующему рассказу и указывает, что дело завершилось описанным образом.
- source_word: ἐχώρησεν
  choice: завершилось
  rationale: В данном заключительном резюме глагол описывает то, как развивалось и чем кончилось дело; «завершилось» естественно передаёт итоговую функцию фразы.
