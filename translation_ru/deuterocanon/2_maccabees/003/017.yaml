  text: For a certain dread and bodily trembling had come over the man[a], by which the pain present in his heart was becoming evident to those who were watching.
translation:
  language: ru
  text: Ибо его охватили страх и телесная дрожь, так что наблюдавшим становилась очевидна боль, терзавшая его сердце.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περικεχύτο
  choice: охватили
  rationale: Плюсквамперфектная по смыслу форма περιχέω описывает состояние, словно обступившее и охватившее человека; по-русски естественно передаётся глаголом «охватили».
- source_word: δέος τι
  choice: страх
  rationale: δέος обозначает сильный, тягостный страх; неопределённое τι здесь естественнее передать без буквального «некий», которое звучало бы искусственно.
- source_word: φρικασμὸς σώματος
  choice: телесная дрожь
  rationale: Сочетание указывает на видимую физическую дрожь или содрогание; «телесная дрожь» прямо сохраняет физический аспект.
- source_word: διʼ ὧν
  choice: по которым
  rationale: Местоимение относится к страху и телесной дрожи как к внешним признакам, позволявшим судить о внутреннем состоянии.
- source_word: πρόδηλον ἐγίνετο
  choice: ясно видели
  rationale: Идиоматическая русская передача того, что внутреннее страдание становилось очевидным наблюдателям; несовершенный вид сохраняет процессуальный характер ἐγίνετο.
- source_word: τοῖς θεωροῦσιν
  choice: наблюдавшие за ним
  rationale: Передаёт людей, которые видели и внимательно наблюдали происходящее; добавление «за ним» естественно в русском контексте.
- source_word: τὸ κατὰ καρδίαν ἐνεστὸς ἄλγος
  choice: мучившую его душевную боль
  rationale: κατὰ καρδίαν указывает на внутреннее переживание, ἐνεστὸς — на наличное, давящее состояние, а ἄλγος — на боль или муку. «Душевная боль» естественно передаёт эмоциональное страдание, не сводя речь к физической боли сердца.
