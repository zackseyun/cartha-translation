revisions:
- from: Ибо этого человека охватили страх и телесная дрожь, по которым наблюдавшие за ним ясно видели мучившую его душевную боль.
  to: Ибо его охватили страх и телесная дрожь, так что наблюдавшим становилась очевидна боль, терзавшая его сердце.
  rationale: Исправление убирает добавленное указательное значение, сохраняет образ сердца и оставляет ἄλγος как «боль» без конфессионального или психологизирующего сужения. «Становилась очевидна» передаёт развёрнутое проявление, выраженное ἐγίνετο; «так что» естественно связывает видимые признаки с открывшейся наблюдателям внутренней болью.
