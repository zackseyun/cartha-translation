  yaml_path: translation/deuterocanon/2_maccabees/003/015.yaml
  text: But the priests[a], having thrown themselves down before the altar in their priestly robes, were calling out to heaven to the one who had given the law concerning deposits[b], that he should keep these things safe for those who had deposited them.
translation:
  language: ru
  text: Священники же, бросившись ниц перед жертвенником в священнических облачениях, взывали к небу[a], к Тому, кто установил закон о переданном на хранение имуществе[b], чтобы Он сохранил всё это в целости для тех, кто передал его на хранение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «К небу» — благоговейный способ сказать о воззвании к Богу.
    reason: cultural_note
  - marker: b
    text: То есть об имуществе, которое было доверено храму для хранения.
    reason: cultural_note
lexical_decisions:
- source_word: ῥίψαντες ἑαυτούς
  choice: бросились ниц
  rationale: Передаёт яркое физическое действие ῥίπτω и одновременно естественно выражает молитвенное падение перед жертвенником, не сводя образ к отвлечённому «простёрлись».
- source_word: ἐπεκαλοῦντο εἰς οὐρανόν
  choice: взывали к небу
  rationale: Несовершенный вид «взывали» отражает продолжительное действие, а «к небу» сохраняет благоговейное иносказательное обозначение Бога в греческом тексте.
- source_word: τὸν περὶ παρακαταθήκης νομοθετήσαντα
  choice: к Тому, кто установил закон о вверенном на хранение имуществе
  rationale: «Установил закон» сохраняет юридическую силу νομοθετέω; описательный перевод παρακαταθήκη понятнее современному читателю, чем двусмысленное «вклад».
- source_word: τοῖς παρακαταθεμένοις
  choice: для тех, кто его доверил
  rationale: Передаёт лиц, отдавших имущество на ответственное хранение, и сохраняет смысловую связь с παρακαταθήκη без тяжеловесного повтора.
- source_word: ταῦτα σῶα διαφυλάξαι
  choice: чтобы Он сохранил всё это в целости
  rationale: Сочетание «сохранил… в целости» передаёт усиленный смысл σῶα διαφυλάξαι — уберечь от ущерба или утраты.
- source_word: ἐν ταῖς ἱερατικαῖς στολαῖς
  choice: в священнических облачениях
  rationale: Естественное для современного литературного русского обозначение церемониальной одежды священников; сохраняет сакральный контекст без архаизации.
theological_decisions:
- issue: Благоговейное иносказание в молитвенном обращении
  choice: к небу[a], к Тому, кто установил закон
  alternative: к Богу / к Господу на небесах
  rationale: Греческий текст прямо говорит «к небу», после чего обозначает Бога описательно как Законодателя. Такой перевод сохраняет иносказание и не делает божественное имя более явным, чем в источнике.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного и молитвенного контекста. «Священнические облачения», «жертвенник» и «взывали» уместны в библейском регистре, но остаются понятными; юридическая формула разъяснена без конфессионально окрашенной терминологии.
