  text: And they were blessing the Lord[a], who was glorifying his own place; and the temple, which a little earlier had been full of fear and turmoil, was filled with joy and gladness when the Almighty Lord appeared.
translation:
  language: ru
  text: Они же благословляли Господа, прославлявшего Своё место; и храм, ещё недавно полный страха и смятения, наполнялся радостью и ликованием, когда явился Господь Вседержитель.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Господь Вседержитель явил Себя». Греческое слово связано с божественным явлением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλόγουν
  choice: благословляли
  rationale: Имперфект передаёт продолжавшееся действие, а «благословляли Господа» точно сохраняет прямое дополнение и естественно звучит в библейском русском.
- source_word: παραδοξάζοντα
  choice: прославлявшего
  rationale: Причастие описывает Господа как являющего славу Своего места. «Прославлявшего» сохраняет смысловую связь со славой и не уточняет сверх текста, каким именно образом это происходило.
- source_word: τὸν ἑαυτοῦ τόπον
  choice: Своё место
  rationale: Буквально передаёт τόπος; контекст и последующее слово «храм» ясно указывают на храм как место Господа.
- source_word: τὸ μικρῷ πρότερον
  choice: ещё недавно
  rationale: Естественно передаёт недавнее предшествующее состояние и подчёркивает резкую перемену.
- source_word: δέους καὶ ταραχῆς γέμον
  choice: полный страха и смятения
  rationale: Сохраняет конструкцию «полный» и различает δέος как страх и ταραχή как смятение, беспокойство.
- source_word: ἱερόν
  choice: храм
  rationale: Здесь слово обозначает храмовый комплекс; «храм» — ясный и обычный русский эквивалент.
- source_word: τοῦ παντοκράτορος ... κυρίου
  choice: Господь Вседержитель
  rationale: Традиционный и понятный русский библейский титул, сохраняющий оба элемента греческого выражения.
- source_word: ἐπιφανέντος
  choice: явился
  rationale: Передаёт событие божественного явления прямо, не ослабляя его до общего действия провидения и не добавляя технической терминологии.
- source_word: χαρᾶς καὶ εὐφροσύνης ἐπληροῦτο
  choice: исполнился радости и ликования
  rationale: 'Сохраняет парность существительных: χαρά как радость и εὐφροσύνη как выраженная, праздничная радость; «исполнился» соответствует пассивной форме.'
theological_decisions:
- issue: Действие Господа по отношению к храму в παραδοξάζοντα τὸν ἑαυτοῦ τόπον
  choice: Господь «прославлял Своё место» Своим вмешательством.
  alternative: Господь делал Своё место дивным или являл его славным.
  rationale: Формулировка сохраняет необычный глагол и богословское утверждение о чести и славе храма, не конкретизируя механизм сверх исходного текста.
- issue: Сила выражения ἐπιφανέντος κυρίου
  choice: «когда явился Господь Вседержитель»
  alternative: «когда Господь Вседержитель явил Себя»
  rationale: «Явился» непосредственно сохраняет повествовательное утверждение о божественном явлении; примечание отмечает допустимую возвратную передачу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксический контраст между прежними страхом и смятением и последующими радостью и ликованием сохранён; архаизмы сведены к понятному титулу «Вседержитель» и стилистически уместному «исполнился».
