  yaml_path: translation/deuterocanon/2_maccabees/003/009.yaml
  text: And when he arrived in Jerusalem and was courteously received by the high priest of the city[a], he reported the manifestation that had taken place, explained for what reason he was present, and inquired whether these things were truly so.
translation:
  language: ru
  text: Прибыв в Иерусалим, он был радушно принят первосвященником города. Он рассказал о сделанном сообщении[a], объяснил, зачем прибыл, и стал выяснять, действительно ли всё обстоит так.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о состоявшемся раскрытии сведений»; греческое слово может означать обнародование, доведение до сведения или проявление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενηθεὶς
  choice: придя
  rationale: Аористное причастие παραγίνομαι обозначает прибытие; деепричастие естественно передаёт предшествующее обстоятельство.
- source_word: φιλοφρόνως
  choice: радушно
  rationale: Наречие выражает благожелательный, учтивый приём; «радушно» сохраняет теплоту без излишнего усиления.
- source_word: ἀποδεχθεὶς
  choice: будучи принят
  rationale: Страдательное причастие означает, что его приняли или приветствовали; выбранная формулировка сохраняет синтаксис и торжественный повествовательный тон.
- source_word: ἀνέθετο
  choice: рассказал
  rationale: В данном контексте глагол означает изложить дело собеседнику; «рассказал» понятно современному читателю и не добавляет официального оттенка, отсутствующего в самом глаголе.
- source_word: περὶ τοῦ γεγονότος ἐμφανισμοῦ
  choice: о поступившем сообщении
  rationale: ἐμφανισμός может обозначать доведение сведений до сведения, раскрытие или сообщение. Контекст предыдущих стихов указывает на донесение о храмовой казне, а не обязательно на сверхъестественное явление; неоднозначность отмечена в сноске.
- source_word: καί τινος ἕνεκεν πάρεστι
  choice: объяснил, зачем прибыл
  rationale: Идиоматически передаёт цель его присутствия, сохраняя связь с прибытием в Иерусалим.
- source_word: διεσάφησεν
  choice: объяснил
  rationale: Глагол означает ясно изложить или разъяснить.
- source_word: ἐπυνθάνετο
  choice: стал выяснять
  rationale: Имперфект среднего залога выражает продолжающееся расспрашивание или выяснение, а не только единичный вопрос.
- source_word: ταῖς ἀληθείαις
  choice: действительно
  rationale: Дательный оборот употреблён наречно и подчёркивает соответствие истине.
- source_word: ταῦτα οὕτως ἔχοντα τυγχάνει
  choice: всё обстоит именно так
  rationale: Естественно передаёт вопрос о том, соответствует ли действительное положение дел полученным сведениям.
theological_decisions:
- issue: Характер ἐμφανισμός
  choice: сообщение
  alternative: явление; раскрытие сведений
  rationale: Ближайший повествовательный контекст говорит о сведениях, сообщённых царской власти относительно храмовой казны. Перевод «явление» мог бы необоснованно внушить мысль о сверхъестественном событии; лексическая широта сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным историко-повествовательным звучанием. Длинная греческая синтаксическая цепочка сохранена как одно ясное предложение; имперфект ἐπυνθάνετο передан начинательным оборотом «стал выяснять».
