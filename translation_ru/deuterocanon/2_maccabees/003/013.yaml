  text: But the other[a], because he had royal orders, kept insisting that these things were to be taken into the royal treasury.
translation:
  language: ru
  text: Но другой, поскольку у него были царские распоряжения, продолжал настаивать, что всё это должно быть передано в царскую казну.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в казну царя». Греческое выражение εἰς τὸ βασιλικόν в данном контексте, вероятно, обозначает царский фиск, или казну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δ᾽ ἕτερος
  choice: Но другой
  rationale: Сохраняет противопоставление предыдущему участнику речи, не добавляя отсутствующего в греческом существительного.
- source_word: δι᾽ ἃς εἶχεν βασιλικὰς ἐντολάς
  choice: поскольку у него были царские распоряжения
  rationale: Передаёт причинное значение оборота и естественно выражает данные царём официальные указания.
- source_word: πάντως ἔλεγεν
  choice: продолжал настаивать
  rationale: Сочетает усилительное значение πάντως с длительным или повторяющимся видом имперфекта ἔλεγεν.
- source_word: εἰς τὸ βασιλικὸν
  choice: в царскую казну
  rationale: В контексте изъятия ценностей субстантивированное βασιλικόν, вероятнее всего, обозначает царский фиск, то есть казну.
- source_word: ἀναλημπτέα
  choice: должно быть передано
  rationale: Передаёт значение необходимости у греческого отглагольного прилагательного; «передано» естественно сочетается с направлением в казну и подразумевает изъятие имущества.
- source_word: ταῦτα
  choice: всё это
  rationale: Естественная русская передача указательного местоимения во множественном числе применительно к упомянутым ценностям.
