  text: so that even Seleucus[a], the king of Asia[b], used to provide from his own revenues all the expenses that fell due for the services of the sacrifices.
translation:
  language: ru
  text: так что даже Селевк, царь Азии[a], покрывал из собственных доходов все расходы, необходимые для служений, связанных с жертвоприношениями.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Азия» здесь означает азиатские владения царя Селевка в эллинистическом словоупотреблении, а не весь современный континент.
    reason: cultural_note
  - marker: b
    text: 'Или: «все расходы, полагавшиеся на служения, связанные с жертвоприношениями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χορηγεῖν
  choice: покрывал
  rationale: В финансовом контексте передаёт регулярное обеспечение расходов за свой счёт; несовершенный вид сохраняет фоновый, продолжительный характер действия.
- source_word: ἐκ τῶν ἰδίων προσόδων
  choice: из собственных доходов
  rationale: Сохраняет фискальное значение πρόσοδοι — доходы или поступления правителя.
- source_word: λειτουργίας τῶν θυσιῶν
  choice: совершения жертвоприношений
  rationale: Естественно передаёт храмовое служение, связанное с жертвами, без привнесения поздней церковной терминологии.
- source_word: ἐπιβάλλοντα δαπανήματα
  choice: все расходы, необходимые
  rationale: Передаёт расходы, которые требовались или подлежали оплате; более естественно по-русски, чем буквальное «падавшие на долю».
- source_word: ὥστε καὶ
  choice: так что даже
  rationale: Сохраняет значение следствия и усиление, выраженное καί.
- source_word: τὸν τῆς Ἀσίας βασιλέα
  choice: царь Азии
  rationale: Сохраняет исторический титул и близко следует греческой конструкции; исторический объём названия разъяснён в сноске.
theological_decisions:
- issue: Культовая терминология в историческом повествовании
  choice: 'Передать храмово-финансовую лексику ясными историческими выражениями: «расходы, необходимые для совершения жертвоприношений»'
  alternative: «издержки на службы жертв» или «расходы на жертвенные служения»
  rationale: Выбранная формулировка ясно описывает содержание стиха, не вводя поздней конфессиональной терминологии и не превращая λειτουργία в специальный церковный термин.
translation_notes:
  register: Современный литературный русский язык; достоинство историко-библейского повествования сохранено без архаизмов. «Покрывал расходы» естественно выражает финансовую поддержку, а «совершение жертвоприношений» делает культовый контекст понятным широкому читателю.
