base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/006.yaml
  text: And he reported that the treasury in Jerusalem was full of immense sums of money[a], so that the quantity of the separate funds was beyond counting, and that they were not connected with the account of the sacrifices[c][b], but that it was possible for these things to fall under the king’s authority.
translation:
  language: ru
  text: Он донёс, что иерусалимское казнохранилище полно несметных денежных сумм и что различным вкладам[a] нет числа; эти средства не относятся к учёту жертвоприношений[b], однако могут оказаться под властью царя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдельным суммам». Греческое выражение может обозначать различные денежные вклады или вверенные на хранение суммы.'
    reason: lexical_alternative
  - marker: b
    text: То есть эти средства не входили в учёт средств или расходов, связанных с жертвоприношениями. Греческое слово также можно понять как «дело» или «расчёт».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «перейти под контроль царя». Эти слова передают заявленную возможность, но сами по себе не утверждают, что такое изъятие было законным.'
    reason: ambiguity
lexical_decisions:
- source_word: προσήγγειλεν
  choice: донёс
  rationale: Глагол обозначает сообщение сведений вышестоящему лицу; «донёс» естественно передаёт это в данном повествовательном контексте, не добавляя явного обвинительного оттенка слова «донос».
- source_word: χρημάτων ἀμυθήτων
  choice: несметных денежных сумм
  rationale: χρήματα здесь означает деньги или имущество, а ἀμύθητος подчёркивает количество, не поддающееся исчислению.
- source_word: γαζοφυλάκιον
  choice: казнохранилище
  rationale: Слово обозначает помещение, где хранят казну и ценности; «казнохранилище» сохраняет предметный смысл точнее, чем учрежденческое «казначейство».
- source_word: τὸ πλῆθος τῶν διαφόρων
  choice: различным вкладам нет числа
  rationale: В финансовом контексте τὰ διάφορα, вероятно, указывает на отдельные суммы или вклады. Формулировка остаётся понятной по-русски и не утверждает точнее, кому именно принадлежали эти средства.
- source_word: μὴ προσήκειν αὐτὰ πρὸς τὸν τῶν θυσιῶν λόγον
  choice: эти средства не относятся к счёту жертвоприношений
  rationale: προσήκειν означает «относиться, принадлежать», а λόγος допускает значения «счёт, статья, дело». Перевод сохраняет финансово-административную окраску и не объявляет средства полностью несвященными.
- source_word: ὑπὸ τὴν τοῦ βασιλέως ἐξουσίαν πεσεῖν
  choice: могут оказаться под властью царя
  rationale: Оборот буквально описывает попадание под чью-либо власть или контроль; выбранная формулировка естественна и не добавляет утверждения о законности изъятия.
theological_decisions:
- issue: Характер средств, не относящихся к жертвоприношениям
  choice: Средства отделены от счёта жертвоприношений, но их общий священный или правовой статус не уточняется.
  alternative: Считать их полностью светскими частными вкладами либо средствами, которые царь вправе изъять.
  rationale: Греческий текст говорит лишь о том, что деньги не относятся к τὸν τῶν θυσιῶν λόγον; он не делает прямого вывода ни об их полной несвященности, ни о законности царского захвата.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Казнохранилище» выбрано вместо современного административного «казначейство»; синтаксис упрощён без устранения смысловой неоднозначности финансовых терминов.
