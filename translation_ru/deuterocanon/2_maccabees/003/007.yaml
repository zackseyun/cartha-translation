base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/007.yaml
  text: After conferring with the king[a], Apollonius informed him about the money that had been reported to him. Then the king appointed Heliodorus, who was over the affairs of state[c][b], and sent him with orders to carry out the removal of the aforementioned money.
translation:
  language: ru
  text: После встречи с царём[a] Аполлоний сообщил ему о деньгах, о которых ему сообщили. Царь же избрал Илиодора, ведавшего государственными делами[b], и послал его, приказав вывезти упомянутые деньги[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «После беседы с царём» или «Посоветовавшись с царём». Греческое причастие может подразумевать официальную встречу или совещание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «того, кто над делами» — административное звание высокопоставленного должностного лица, ведавшего государственными делами.'
    reason: cultural_note
  - marker: c
    text: 'Или: «осуществить вывоз упомянутых денег». Греческое выражение подчёркивает их удаление с места хранения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμμίξας
  choice: После встречи с
  rationale: Причастие передаёт состоявшуюся встречу с царём, вероятно имевшую характер официальной беседы; нейтральная формулировка не сводит значение ни к простому физическому контакту, ни непременно к совещанию.
- source_word: ἐνεφάνισεν
  choice: сообщил
  rationale: Глагол обозначает доведение сведений до царя и естественно звучит в официальном контексте.
- source_word: μηνυθέντων
  choice: о которых ему донесли
  rationale: Пассивное причастие указывает, что сведения о деньгах ранее были переданы Аполлонию; «донесли» сохраняет официальный оттенок, не утверждая непременно обвинительного доноса.
- source_word: χρημάτων
  choice: деньгах
  rationale: В данном контексте речь идёт о конкретных денежных средствах; общеупотребительное «деньги» точно и понятно.
- source_word: προχειρισάμενος
  choice: избрал
  rationale: Царь выбирает Илиодора для исполнения поручения; «избрал» передаёт целенаправленное официальное назначение, не добавляя отдельной должности.
- source_word: τὸν ἐπὶ τῶν πραγμάτων
  choice: ведавшего государственными делами
  rationale: Описательный административный титул передан понятной русской формулой, обозначающей высокопоставленного распорядителя государственных дел.
- source_word: ἐκκομιδὴν ποιήσασθαι
  choice: вывезти
  rationale: Сочетание означает осуществить удаление денег с места хранения; «вывезти» естественно передаёт их перемещение наружу, не уточняя сверх текста правовой характер действия.
- source_word: προειρημένων
  choice: упомянутые
  rationale: Слово отсылает к уже названным деньгам и сохраняет официальный тон без тяжеловесного «вышеупомянутые».
