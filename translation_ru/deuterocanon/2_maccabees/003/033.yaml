base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/033.yaml
  text: And while the high priest was making atonement[a], the same young men appeared again to Heliodorus, clothed in the same garments, and standing there they said, “Give many thanks to Onias the high priest, for because of him the Lord has graciously granted you your life.”
translation:
  language: ru
  text: 'Когда первосвященник совершал искупительный обряд[a], те же юноши вновь явились Илиодору, облачённые в те же одежды, и, стоя, сказали: «Будь глубоко благодарен первосвященнику Онии, ведь благодаря ему Господь милостиво даровал тебе жизнь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершал умилостивление»; также: «совершал очищение».'
    reason: Лексема ἱλασμός обозначает культовое действие, связанное с искуплением, очищением и восстановлением благоволения; контекст не требует выбирать один из этих оттенков как исключительный.
lexical_decisions:
- source_word: ποιουμένου ... τὸν ἱλασμόν
  choice: совершал обряд умилостивления
  rationale: Оборот обозначает совершение культового действия, направленного на устранение вины и восстановление благоволения. «Обряд умилостивления» сохраняет религиозный смысл ἱλασμός, не сводя его к одной богословской теории.
- source_word: οἱ αὐτοὶ νεανίαι
  choice: те же юноши
  rationale: Передаёт и возрастное обозначение νεανίαι, и связь αὐτοὶ с ранее явившимися юношами.
- source_word: ἐν ταῖς αὐταῖς ἐσθήσεσιν ἐστολισμένοι
  choice: облачённые в те же одежды
  rationale: «Облачённые» передаёт торжественно-зрительный оттенок ἐστολισμένοι, а «те же одежды» сохраняет повтор αὐταῖς.
- source_word: στάντες
  choice: встав
  rationale: Кратко и без добавления не указанного в греческом тексте местоположения передаёт предшествующее речи действие.
- source_word: Πολλὰ ... χάριτας ἔχε
  choice: будь глубоко благодарен
  rationale: Естественный русский способ передать усиленную степень благодарности; буквальное «имей многие благодарности» было бы неидиоматично.
- source_word: διὰ γὰρ αὐτὸν
  choice: ведь ради него
  rationale: Сохраняет причинное значение διά с винительным падежом и пояснительную силу γάρ, не конкретизируя способ участия Онии как формальное ходатайство.
- source_word: σοὶ κεχάρισται τὸ ζῆν
  choice: милостиво даровал тебе жизнь
  rationale: «Милостиво даровал» сохраняет оттенок благоволения и незаслуженного дара в κεχάρισται, а «жизнь» естественно передаёт субстантивированный инфинитив τὸ ζῆν.
- source_word: Κύριος
  choice: Господь
  rationale: Устоявшееся русское библейское соответствие κύριος в данном контексте.
theological_decisions:
- issue: Значение культового термина ἱλασμός
  choice: обряд умилостивления
  alternative: обряд очищения; искупительный обряд
  rationale: Основной вариант сохраняет направленность ритуала на устранение вины и восстановление Божьего благоволения, но не навязывает узкую теорию искупления. Альтернативный смысл отмечен в сноске.
- issue: Оттенок благодати в κεχάρισται
  choice: милостиво даровал
  alternative: даровал; позволил жить
  rationale: Глагол выражает не простое разрешение, а благосклонное дарование; наречие «милостиво» сохраняет этот смысл без чрезмерной догматизации.
- issue: Причинная роль Онии в διὰ αὐτόν
  choice: ради него
  alternative: благодаря ему; по его ходатайству
  rationale: «Ради него» сохраняет причинную связь, но не уточняет сверх текста, каким именно образом действия Онии обусловили сохранение жизни Илиодора.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясности, но последовательность греческого повествования и богословски значимые оттенки сохранены. Имена переданы в традиционной русской форме: Илиодор, Ония.'
