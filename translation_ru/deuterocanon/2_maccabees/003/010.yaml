lexical_decisions:
- source_word: τοῦ δὲ ἀρχιερέως
  choice: Когда же первосвященник
  rationale: Генитив абсолютный передан придаточным времени; частица δέ обозначает переход и лёгкое противопоставление, естественно выраженное сочетанием «же».
- source_word: ὑποδείξαντος
  choice: указал
  rationale: Аористное причастие ὑποδείκνυμι здесь означает, что первосвященник сообщил или разъяснил, каков характер этих средств. «Указал» точно и не добавляет лишней юридической окраски.
- source_word: παρακαταθήκας
  choice: вклады
  rationale: Слово обозначает деньги или имущество, переданные на хранение. «Вклады» кратко передаёт этот смысл, не вводя современной категории трастового фонда.
- source_word: εἶναι
  choice: что это
  rationale: Инфинитив в косвенной речи естественно передан по-русски придаточным с «что»; указательное «это» соотносит вклады с ранее упомянутыми средствами.
- source_word: χηρῶν τε καὶ ὀρφανῶν
  choice: вдов и сирот
  rationale: Родительные формы сохранены; вероятнее всего, они выражают принадлежность вкладов, но русская конструкция удерживает присущую греческому тексту компактность и возможную неоднозначность.
