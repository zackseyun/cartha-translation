lexical_decisions:
- source_word: ἐλεεινὴ
  choice: Жалостное зрелище
  rationale: Передаёт предикативное, эмоционально окрашенное прилагательное «жалкий, достойный сострадания» естественной русской безглагольной конструкцией.
- source_word: τοῦ πλήθους
  choice: народ
  rationale: В данной общественной сцене πλῆθος обозначает собравшееся множество людей; «народ» звучит естественно и не предполагает строго всего населения.
- source_word: παμμιγῆ
  choice: весь
  rationale: В контексте слово подчёркивает всеобщность охватившего множество действия; «весь народ» естественно выражает совокупность без буквального и неясного «всесмешанного».
- source_word: πρόπτωσιν
  choice: пал ниц
  rationale: Сохраняет телесный образ падения вперёд или простирания, не сводя его лишь к эмоциональному краху.
- source_word: τοῦ μεγάλως ἀγωνιῶντος ἀρχιερέως
  choice: первосвященник, охваченный тяжкой тревогой
  rationale: Передаёт сильную степень мучительного волнения в μεγάλως ἀγωνιῶντος современным литературным русским языком.
- source_word: προσδο-
  choice: ожидал
  rationale: Видимое начало, вероятно, относится к слову со значением ожидания, однако строка обрывается; личная глагольная конструкция по-русски естественно связывается с первосвященником, а неопределённость отмечена сноской.
