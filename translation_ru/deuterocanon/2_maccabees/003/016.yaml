  text: To see the appearance of the high priest was enough to wound the mind[b][a]; for his face and altered color made visible the agony in his soul.
translation:
  language: ru
  text: 'Облик первосвященника глубоко поражал всякого, кто его видел[a]: его лицо и изменившийся цвет лица ясно показывали муку в его душе[b].'
  philosophy: optimal-equivalence
  footnotes:
