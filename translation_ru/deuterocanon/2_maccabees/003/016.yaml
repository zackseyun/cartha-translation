  - marker: b
    text: 'Буквально: «агонию, относящуюся к душе»; то есть внутреннюю муку его души.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ὁρῶντα
  choice: всякий, кто видел
  rationale: Эллиптическая греческая конструкция передаёт общее воздействие на любого очевидца; русский оборот сохраняет этот смысл и звучит естественно.
- source_word: ἰδέαν
  choice: обликом
  rationale: Здесь слово обозначает видимый облик первосвященника, включая выражение лица и общий вид.
- source_word: τιτρώσκεσθαι τὴν διάνοιαν
  choice: был душевно ранен
  rationale: Сохранена метафора ранения и её направленность на внутренний мир наблюдателя; буквальное «разум был ранен» в современном русском звучало бы неестественно.
- source_word: ὄψις
  choice: лицо
  rationale: В сочетании с изменением цвета кожи слово указывает на видимое состояние лица.
- source_word: χρόας παρηλλαγμένον
  choice: изменившийся цвет его кожи
  rationale: Передаёт телесный цвет или цвет лица и не уточняет, каким именно стало это изменение, поскольку греческий текст этого не говорит.
- source_word: ἐνέφαινεν
  choice: ясно показывали
  rationale: Глагол означает делать явным, обнаруживать; выбран естественный русский эквивалент.
- source_word: τὴν κατὰ ψυχὴν ἀγωνίαν
  choice: муку в его душе
  rationale: Сохраняет как сильное внутреннее страдание, выраженное словом ἀγωνία, так и антропологический образ ψυχή.
theological_decisions:
- issue: Антропологическое значение ψυχή
  choice: душа
  alternative: внутреннее существо; внутренний мир
  rationale: «Душа» непосредственно сохраняет образ исходного текста и его богословскую ёмкость, не превращая стих в техническое утверждение о составе человека.
- issue: Различение διάνοια и ψυχή
  choice: διάνοια передано выражением «душевно ранен», а ψυχή — существительным «душа»
  alternative: передать оба слова как «душа» либо διάνοια как «разум»
  rationale: Так сохраняется различие греческих слов без неестественного русского выражения «ранить разум»; значение первого оборота дополнительно поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Метафора ранения сохранена, но синтаксис сделан естественным; внутренняя мука и её внешние признаки переданы без психологического или конфессионального уточнения.
