lexical_decisions:
- source_word: αἴφνω
  choice: внезапно
  rationale: Передаёт неожиданность и стремительность падения естественным современным русским наречием.
- source_word: πεσόντα πρὸς τὴν γῆν
  choice: упал на землю
  rationale: Идиоматично передаёт движение вниз; личная форма делает греческую причастную конструкцию естественной по-русски.
- source_word: πολλῷ σκότει περιχυθέντα
  choice: его окутала глубокая тьма
  rationale: Сохраняет образ тьмы, словно разлившейся вокруг и покрывшей человека; активная русская конструкция звучит естественно, не меняя смысла греческого страдательного причастия.
- source_word: συναρπάσαντες
  choice: его подняли
  rationale: По контексту люди поднимают упавшего, чтобы перенести его; «схватили» здесь звучало бы неоправданно резко, а «подхватили» могло бы создать впечатление, что падение было предотвращено.
- source_word: φορεῖον
  choice: носилки
  rationale: Ясный современный эквивалент приспособления для переноса человека; не несёт погребального оттенка слова «одр» или «носилки для покойника».
- source_word: ἐνθέντες
  choice: положили
  rationale: Точно и естественно обозначает помещение incapacitated человека на носилки.
