  text: And he[a], because of the divine power, lay speechless and deprived of all hope and salvation;
translation:
  language: ru
  text: Он же от божественного воздействия лежал, не в силах говорить, лишённый всякой надежды и спасения[a].
  philosophy: optimal-equivalence
  footnotes:
