    reason: lexical_alternative
lexical_decisions:
- source_word: θείαν ἐνέργειαν
  choice: действия божественной силы
  rationale: ἐνέργεια обозначает действенную силу или её проявление. Формулировка передаёт как божественный источник, так и реальное воздействие, ставшее причиной его состояния.
- source_word: ἄφωνος
  choice: безмолвный
  rationale: ἄφωνος означает «лишённый голоса, неспособный говорить»; «безмолвный» естественно и достойно передаёт состояние персонажа.
- source_word: πάσης ἐστερημένος ἐλπίδος καὶ σωτηρίας
  choice: лишённый всякой надежды и спасения
  rationale: Перевод сохраняет координацию существительных в греческом тексте и не сводит «надежду» лишь к надежде на спасение. σωτηρία в данном повествовательном контексте может означать также избавление или спасение от смертельной опасности.
- source_word: ἔρριπτο
  choice: лежал
  rationale: Форма описывает продолжительное состояние поверженного человека. Русское «лежал» естественно передаёт результат предшествующего поражения, не добавляя нового действующего лица.
theological_decisions:
- issue: Значение σωτηρία в сцене телесной опасности и божественного суда
  choice: спасение
  alternative: избавление
  rationale: «Спасение» сохраняет широкий смысл греческого слова и серьёзность положения, не исключая конкретного избавления от непосредственной физической опасности; контекстуальная альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Порядок определений сохраняет нарастающее описание беспомощности; подлинная широта значения σωτηρία не сужена без пояснения.
