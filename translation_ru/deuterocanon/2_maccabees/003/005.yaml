base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/005.yaml
  text: And since he was unable to overcome Onias[a], he went to Apollonius son of Thrasaeus[b], who at that time was governor of Coele-Syria and Phoenicia.
translation:
  language: ru
  text: И, не сумев одолеть Онию, он отправился к Аполлонию, сыну Фрасея[a], который в то время был правителем Келесирии и Финикии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Аполлонию Фрасею»; греческая форма родительного падежа может быть понята как указание на отца, поэтому здесь переведено: «сыну Фрасея».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово στρατηγός может означать «военачальник» или «правитель»; здесь выбрано «правитель», поскольку речь идёт об управлении Келесирией и Финикией.
    reason: lexical_alternative
lexical_decisions:
- source_word: νικήσαι
  choice: одолеть
  rationale: Глагол передаёт попытку взять верх над Онией в противостоянии, не придавая выражению исключительно военного смысла.
- source_word: μὴ δυνάμενος
  choice: не сумев
  rationale: Краткий деепричастный оборот естественно передаёт обстоятельственно-причинный смысл греческого причастия.
- source_word: ἦλθεν πρὸς
  choice: отправился к
  rationale: В повествовательном контексте выражение обозначает движение к Аполлонию; «отправился к» звучит естественно и не предполагает точки зрения места прибытия.
- source_word: Ἀπολλώνιον Θρασαίου
  choice: к Аполлонию, сыну Фрасея
  rationale: Родительный падеж Θρασαίου наиболее естественно понимать как патроним; родство выражено явно для современного читателя.
- source_word: τὸν ... στρατηγόν
  choice: который ... был правителем
  rationale: В эллинистическом административном употреблении στρατηγός мог обозначать областного правителя; упоминание подвластных территорий поддерживает это значение, хотя военное значение также возможно.
- source_word: κατʼ ἐκεῖνον τὸν καιρόν
  choice: в то время
  rationale: Прямо и естественно передаёт временную привязку должности Аполлония.
- source_word: Κοίλης Συρίας καὶ Φοινίκης
  choice: Келесирии и Финикии
  rationale: «Келесирия» — принятое русское историко-географическое название области Coele-Syria; «Финикия» является общепринятым названием.
