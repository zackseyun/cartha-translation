  text: While the holy city was inhabited in complete peace[a], and the laws were being observed in the best way because of Onias the high priest,
translation:
  language: ru
  text: Когда благодаря первосвященнику Онии святой город жил в полном мире, а законы соблюдались наилучшим образом[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соблюдались очень хорошо». Греческое наречие κάλλιστα может означать как «наилучшим образом», так и «очень хорошо».'
    reason: Лексическая альтернатива для ὅτι κάλλιστα.
lexical_decisions:
- source_word: Τῆς ἁγίας πόλεως
  choice: святой город
  rationale: Устойчивое и естественное русское соответствие, сохраняющее религиозный смысл ἁγίας.
- source_word: κατοικουμένης
  choice: жил
  rationale: Причастие описывает состояние населённого города; по-русски выражение «город жил в полном мире» естественнее буквального «был населён» и в контексте передаёт мирную жизнь его жителей.
- source_word: μετὰ πάσης εἰρήνης
  choice: в полном мире
  rationale: Передаёт всеохватный характер πάσης и звучит естественно в современном литературном русском.
- source_word: τῶν νόμων
  choice: законы
  rationale: Сохранено множественное число греческого текста, обозначающее совокупность предписаний.
- source_word: ὅτι κάλλιστα
  choice: наилучшим образом
  rationale: Сохраняет превосходную степень наречия κάλλιστα; допустимое усилительное понимание «очень хорошо» вынесено в примечание.
- source_word: συντηρουμένων
  choice: соблюдались
  rationale: В сочетании с законами глагол «соблюдаться» является точным и естественным соответствием значению сохранения и исполнения.
- source_word: διὰ τὴν Ὀνίου τοῦ ἀρχιερέως
  choice: благодаря первосвященнику Онии
  rationale: διά с винительным падежом выражает причину; «благодаря» естественно передаёт положительную причинную оценку служения Онии.
theological_decisions:
- issue: Причинная связь с деятельностью Онии
  choice: Мир в городе и соблюдение законов представлены как следствие служения первосвященника Онии.
  alternative: «при первосвященнике Онии» или «через первосвященника Онию»
  rationale: διά с винительным падежом естественнее всего выражает причину. Расположение оборота в начале русского предложения позволяет отнести его к обеим согласованным частям, не добавляя отдельного богословского утверждения.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Зависимая конструкция с «Когда» и конечная запятая сохранены, поскольку греческий стих представляет собой начало предложения, продолжающегося далее.
