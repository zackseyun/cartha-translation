  yaml_path: translation/deuterocanon/2_maccabees/003/039.yaml
  text: For he himself[a], who has his dwelling in heaven, is the overseer and helper of that place[b], and he strikes and destroys those who come to do harm.
translation:
  language: ru
  text: Ибо Тот, Чьё жилище — на небесах[a], Сам блюдёт то место и помогает ему[b], а тех, кто приходит причинить вред, поражает и уничтожает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имеющий небесное жилище»; возможно также: «обитающий на небесах».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть храм; по-гречески буквально: «то место».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατοικίαν ἐπουράνιον ἔχων
  choice: Чьё жилище на небесах
  rationale: Естественная русская передача причастного оборота, сохраняющая указание на небесное жилище Бога без добавления имени «Бог».
- source_word: ἐπόπτης
  choice: наблюдает за
  rationale: Передаёт роль того, кто надзирает и бдительно смотрит за данным местом; глагольная конструкция звучит по-русски естественнее буквального существительного «надзиратель».
- source_word: βοηθός
  choice: помогает ему
  rationale: Сохраняет основное значение помощи и отличие от ἐπόπτης, не усиливая слово до более толковательного «защищает».
- source_word: ἐκείνου τοῦ τόπου
  choice: за тем местом ... ему
  rationale: Сохраняет общее слово τόπος — «место»; из контекста ясно, что имеется в виду храм.
- source_word: τοὺς παραγινομένους ἐπὶ κακώσει
  choice: тех, кто приходит причинить вред
  rationale: Передаёт движение к месту и целевое значение ἐπὶ с существительным κακώσει.
- source_word: τύπτων ἀπόλλυσι
  choice: поражает и уничтожает
  rationale: Передаёт суровое карательное действие обоих греческих глаголов современным, но достойным языком.
theological_decisions:
- issue: К кому относится αὐτός
  choice: 'Референт оставлен не названным прямо: «Сам Тот»; в контексте это Бог, обитающий на небесах и охраняющий храм.'
  alternative: 'Прямо назвать субъект: «Сам Бог».'
  rationale: Греческий текст подчёркивает субъект местоимением αὐτός, но не добавляет здесь существительного θεός; перевод сохраняет контекстуальную определённость без поясняющей вставки.
- issue: Характер отношения Бога к храму
  choice: «наблюдает за тем местом и помогает ему»
  alternative: «хранитель и защитник того места»
  rationale: Выбранная формулировка сохраняет различие между ἐπόπτης и βοηθός и не вводит более узкую богословскую характеристику, чем позволяет текст.
translation_notes:
  register: Современный литературный русский язык с торжественной, но не архаичной интонацией. Заглавные буквы в «Сам Тот, Чьё» указывают на Бога в соответствии с русской издательской традицией, не добавляя Его имени в основной текст.
