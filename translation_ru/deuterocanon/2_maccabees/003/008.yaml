lexical_decisions:
- source_word: εὐθέως
  choice: немедленно
  rationale: Точно передаёт незамедлительность действия и естественно звучит в современном литературном русском.
- source_word: ἐποιεῖτο τὴν πορίαν
  choice: отправился в путь
  rationale: Естественно передаёт идиому движения и её контекстуальный начинательный оттенок.
- source_word: τῇ μὲν ἐμφάσει
  choice: с виду
  rationale: Сохраняет прямое противопоставление видимости и действительности, не усиливая без необходимости мотив обмана.
- source_word: ὡς ... ἐφοδεῦσαι
  choice: для того, чтобы объехать
  rationale: ὡς с инфинитивом выражает заявленную или видимую цель; ἐφοδεύω здесь обозначает обход или объезд подведомственных мест и не обязательно требует более узкого значения «инспектировать».
- source_word: τὰς κατὰ Κοίλην Συρίαν καὶ Φοινίκην πόλεις
  choice: города Келесирии и Финикии
  rationale: Передаёт исторические географические названия в принятой русской форме; κατὰ обозначает расположение городов в этих областях.
- source_word: τῷ πράγματι δέ
  choice: а на деле
  rationale: Кратко и естественно воспроизводит противопоставление внешней видимости реальной цели.
- source_word: τὴν ... πρόθεσιν ἐπιτελεῖν
  choice: исполнить замысел
  rationale: «Замысел» передаёт πρόθεσις как намерение или план, а «исполнить» точно отражает ἐπιτελεῖν и сохраняет достойный повествовательный стиль.
- source_word: τοῦ A βασιλέως
  choice: царя
  rationale: Буква A в представленном тексте аномальна и, по всей вероятности, является артефактом издания или транскрипции; контекстуально ясное βασιλέως передано как «царя», а проблема отмечена в сноске.
