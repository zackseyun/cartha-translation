  text: So Heliodorus immediately set out on the journey[a], outwardly as though to inspect the cities of Coele-Syria and Phoenicia, but in reality to carry out the king’s purpose.
translation:
  language: ru
  text: Илиодор немедленно отправился в путь — с виду для того, чтобы объехать города Келесирии и Финикии, а на деле — чтобы исполнить замысел царя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В представленном греческом тексте перед словом «царя» (βασιλέως) стоит аномальная буква A, вероятно возникшая как артефакт издания или транскрипции и не являющаяся частью смысла. Перевод следует ясному контекстуальному чтению: «замысел царя».'
