  yaml_path: translation/deuterocanon/2_maccabees/003/018.yaml
  text: And those from the houses were rushing out in groups for a public supplication[a], because the place was about to come into contempt.
translation:
  language: ru
  text: Люди толпами выбегали из домов, чтобы всем народом вознести моление, потому что этому месту[a] грозило поругание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть храму и его территории; в греческом тексте сказано просто «место».
    reason: Уточнение контекстуального референта при сохранении в основном тексте общего греческого слова τόπος.
lexical_decisions:
- source_word: οἱ δὲ ἐκ τῶν οἰκιῶν
  choice: Люди … выбегали из домов
  rationale: Оборот собирательно обозначает жителей, выходивших из домов. «Люди» естественно восполняет подразумеваемое существительное, не добавляя отсутствующего в греческом притяжательного местоимения.
- source_word: ἀγεληδόν
  choice: толпами
  rationale: Наречие буквально описывает движение стаями или группами. «Толпами» передаёт массовость движения и не звучит неуместно зооморфно.
- source_word: ἐξεπήδων
  choice: выбегали
  rationale: Имперфект выражает продолжавшееся массовое действие, а глагол — стремительное движение наружу. «Выбегали» сохраняет живость и срочность.
- source_word: ἐπὶ πανδήμῳ ἱκετείᾳ
  choice: чтобы всем народом вознести моление
  rationale: πανδήμῳ указывает на участие всего народа, а ἱκετεία — на настойчивую, торжественную мольбу. Конструкция с целью естественна по-русски и передаёт направленность движения.
- source_word: διὰ τὸ μὴ μέλλειν … ἔρχεσθαι
  choice: потому что … грозило
  rationale: Контекст и идиоматический смысл конструкции указывают на близкую опасность. «Грозило» кратко и естественно выражает нависшую угрозу, не представляя поругание как уже совершившееся.
- source_word: εἰς καταφρόνησιν ἔρχεσθαι
  choice: грозило поругание
  rationale: Оборот означает оказаться в презрении, подвергнуться бесчестью. «Поругание» уместно для угрозы храму и передаёт не только внутреннее презрение, но и унизительное обращение.
- source_word: τὸν τόπον
  choice: этому месту
  rationale: Греческий текст говорит просто «место». Указательное «этому» связывает его с храмом в ближайшем контексте, не заменяя исходное общее обозначение словом «храм» или «святилище».
theological_decisions:
- issue: Референт τὸν τόπον
  choice: этому месту, с пояснением о храме в сноске
  alternative: храму; святилищу; святому месту
  rationale: По контексту речь идёт об Иерусалимском храме, однако греческий текст сохраняет более общее слово τόπος. Основной текст не устраняет эту особенность, а сноска уточняет референт.
- issue: Характер угрозы месту
  choice: месту грозило поругание
  alternative: место должно было подвергнуться презрению; чтобы место не подверглось поруганию
  rationale: Формулировка сохраняет напряжение близкой опасности и не утверждает, что осквернение уже произошло. Она также не конкретизирует способ поругания сверх сказанного в стихе.
translation_notes:
  register: Современный литературный русский язык с повествовательной ясностью и умеренно торжественной библейской окраской. «Вознести моление» передаёт общенародный религиозный характер действия, а «толпами выбегали» сохраняет живость сцены.
