lexical_decisions:
- source_word: ὁ δὲ
  choice: Но
  rationale: Частица δέ обозначает здесь мягкое противопоставление предшествующему контексту; «но» естественно передаёт этот поворот.
- source_word: Ἡλιόδωρος
  choice: Илиодор
  rationale: Традиционная русская передача греческого личного имени.
- source_word: τὸ διεγνωσμένον
  choice: принятое решение
  rationale: Субстантивированное причастие перфекта в пассиве указывает на уже решённое или определённое; формулировка сохраняет результат предшествующего решения и звучит естественно по-русски.
- source_word: ἐπετέλει
  choice: продолжал исполнять
  rationale: Имперфект обозначает продолжавшееся в прошлом действие, а глагол передаёт осуществление намеченного.
