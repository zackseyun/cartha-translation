base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/003/038.yaml
  text: If you have any enemy or one plotting against your affairs[a], send him there[b], and you will receive him back flogged—if indeed he even survives—because there truly is some power of God about the place.
translation:
  language: ru
  text: Если у тебя есть враг или тот, кто злоумышляет против твоих дел[a], пошли его туда, и ты примешь его обратно высеченным — если он вообще останется жив[b], — потому что в этом месте воистину присутствует некая сила Божья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот, кто строит козни против твоих интересов».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «если только он вообще спасётся». Эти слова подчёркивают опасность столкновения с Божьей силой, связанной с этим местом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολέμιον
  choice: враг
  rationale: Прямой и естественный современный эквивалент личного противника.
- source_word: πραγμάτων ἐπίβουλον
  choice: тот, кто злоумышляет против твоих дел
  rationale: Сохраняет значение коварного замысла в ἐπίβουλος и широту πραγμάτων — дела, обстоятельства или интересы человека.
- source_word: πέμψον αὐτὸν ἐκεῖ
  choice: пошли его туда
  rationale: Точно и естественно передаёт повелительное наклонение без лишнего усиления.
- source_word: μεμαστιγωμένον
  choice: высеченным
  rationale: Передаёт совершившееся телесное наказание и строгость μαστιγόω; по-русски звучит естественнее буквального «избитым бичами».
- source_word: προσδέξῃ
  choice: ты примешь его обратно
  rationale: Передаёт принятие посланного человека по его возвращении; «обратно» делает подразумеваемое возвращение ясным.
- source_word: ἐάνπερ καὶ διασωθῇ
  choice: если он вообще останется жив
  rationale: 'Передаёт усиленное условие и мрачную иронию частиц ἐάνπερ καί: само выживание ставится под сомнение.'
- source_word: διὰ τὸ ... εἶναί τινα θεοῦ δύναμιν
  choice: потому что ... присутствует некая сила Божья
  rationale: Сохраняет причинную связь, реальность силы и неопределённость τινα, не превращая выражение в исчерпывающее учение о Божьем присутствии.
- source_word: περὶ τὸν τόπον
  choice: в этом месте
  rationale: Передаёт пространственную связь силы с храмовым местом естественным современным русским выражением.
- source_word: ἀληθῶς
  choice: воистину
  rationale: Сохраняет торжественное утверждение подлинности этой силы и соответствует достоинству повествовательного регистра.
theological_decisions:
- issue: Передача θεοῦ δύναμιν в высказывании о храме
  choice: некая сила Божья
  alternative: Божья сила; некая божественная сила
  rationale: Неопределённое местоимение τινα указывает на реальное, но не исчерпывающе определённое проявление Божьей силы. Формулировка сохраняет сдержанность и богословское напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет резкую и мрачно-ироническую последовательность греческой реплики; неопределённость выражения «некая сила Божья» намеренно не устранена.
