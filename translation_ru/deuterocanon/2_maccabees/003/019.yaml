  text: And the women[a], with sackcloth bound under their breasts, were crowding the streets; and the virgins who were shut in, some were running together to the gates, others to the walls[c][b], and some were peering out through the windows.
translation:
  language: ru
  text: Женщины, обвязавшиеся мешковиной под грудью[a], во множестве заполняли улицы[b]. А девы, находившиеся взаперти, одни сбегались к воротам, другие — к стенам, а некоторые выглядывали из окон.
  philosophy: optimal-equivalence
  footnotes:
