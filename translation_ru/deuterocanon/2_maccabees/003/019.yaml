    text: То есть женщины обвязались ниже груди грубой тканью, которую надевали в знак скорби.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «умножались по улицам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπεζωσμέναι ... σάκκους ὑπὸ τοὺς μαστούς
  choice: подпоясавшись рубищем под грудью
  rationale: Передаёт ношение грубой траурной ткани, закреплённой ниже груди. «Рубище» естественнее в русском библейском регистре, чем буквальное «мешковина», и сохраняет значение траурного одеяния.
- source_word: κατὰ τὰς ὁδοὺς ἐπλήθυνον
  choice: во множестве заполняли улицы
  rationale: Глагол буквально указывает на умножение или многочисленность; русский оборот передаёт множество женщин на улицах, не создавая впечатления буквального размножения.
- source_word: κατάκλειστοι τῶν παρθένων
  choice: из дев, живших в затворе
  rationale: Сохраняет конкретное значение παρθένοι («девы») и состояние уединённости, выраженное κατάκλειστοι, без представления о тюремном заключении.
- source_word: συνέτρεχον
  choice: сбегались
  rationale: Русский глагол передаёт и поспешное движение, и схождение нескольких людей в одном месте.
- source_word: πυλῶνας
  choice: воротам
  rationale: Естественное обозначение городских ворот или проездов.
- source_word: διὰ τῶν θυρίδων διεκύπτον
  choice: выглядывали из окон
  rationale: Передаёт продолженное выглядывание наружу через оконные проёмы; несовершенный вид соответствует греческому имперфекту.
