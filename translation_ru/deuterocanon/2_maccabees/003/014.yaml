  text: After setting a day[a], he went in to arrange the examination concerning these matters; and there was no small anxiety throughout the whole city.
translation:
  language: ru
  text: Назначив день, он вошёл, чтобы распорядиться проведением проверки по этим вопросам; и по всему городу царила немалая тревога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тревога была не малая» — оборот, подчёркивающий сильное беспокойство жителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταξάμενος ἡμέραν
  choice: Назначив день
  rationale: Аористное причастие τάσσω передаёт назначение определённого времени; безартиклевое ἡμέραν естественно переводится как «день», не предполагая ранее названной даты.
- source_word: εἰσῄει
  choice: он вошёл
  rationale: Имперфект обозначает действие в ходе повествования; по-русски простое прошедшее «вошёл» естественно передаёт движение внутрь без излишнего акцента на длительности.
- source_word: τὴν περὶ τούτων ἐπίσκεψιν
  choice: проверки по этим вопросам
  rationale: ἐπίσκεψις в данном административном контексте означает официальную проверку или обследование; περὶ τούτων сохранено во множественном числе как «по этим вопросам».
- source_word: οἰκονομήσων
  choice: чтобы распорядиться проведением
  rationale: Будущее причастие выражает цель, а οἰκονομέω — организацию или управление делом; формулировка сохраняет административный оттенок и не сводит действие лишь к личному проведению проверки.
- source_word: οὐ μικρὰ
  choice: немалая
  rationale: 'Сохранена греческая литота: тревога названа не просто «сильной», а «немалой».'
- source_word: καθʼ ὅλην τὴν πόλιν
  choice: по всему городу
  rationale: κατά с винительным выражает распространение по всей территории города, а ὅλην усиливает всеохватность.
- source_word: ἀγωνία
  choice: тревога
  rationale: В контексте слово обозначает напряжённое общественное беспокойство и ожидание, а не физические мучения.
