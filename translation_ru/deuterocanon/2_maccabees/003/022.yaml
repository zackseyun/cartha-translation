  text: So then they were calling on the all-powerful Lord to keep what had been entrusted to those who had made the deposit safe with all security[a].
translation:
  language: ru
  text: Итак, они взывали ко всесильному Господу, чтобы Он сохранил в полной безопасности вверенное имущество для тех, кто отдал его на хранение[a].
