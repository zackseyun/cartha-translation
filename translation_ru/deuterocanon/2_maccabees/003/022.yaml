  footnotes:
  - marker: a
    text: 'Буквально: «вверенное — для вверивших»; речь идёт о людях, передавших своё имущество на хранение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεκαλοῦντο
  choice: взывали
  rationale: Имперфект передаёт продолжавшееся молитвенное обращение; «взывали» естественно для возвышенного повествования и сохраняет религиозный смысл.
- source_word: παγκρατῆ
  choice: всесильному
  rationale: Передаёт власть и силу над всем, не утяжеляя современный русский текст составным определением «всевластному» или «всемогущему».
- source_word: κύριον
  choice: Господу
  rationale: Здесь κύριος — благоговейный титул Бога; традиционное русское соответствие «Господь» ясно и уместно.
- source_word: τὰ πεπιστευμένα
  choice: вверенное имущество
  rationale: Субстантивированное причастие обозначает имущество, переданное на ответственное хранение; существительное «имущество» делает референт ясным из контекста.
- source_word: τοῖς πεπιστευκόσιν
  choice: для тех, кто отдал его на хранение
  rationale: Активное причастие указывает на владельцев, вверивших имущество; формулировка сохраняет значение дательного падежа как указание на тех, в чьих интересах имущество должно быть сохранено.
- source_word: σῶα διαφυλάσσειν μετὰ πάσης ἀσφαλείας
  choice: в полной безопасности сохранил
  rationale: Передаёт как сохранность имущества, так и усилительное обстоятельство полной надёжности, избегая неестественного русского повтора «сохранить в сохранности».
theological_decisions:
- issue: Передача божественного титула κύριον
  choice: Господу
  alternative: Владыке
  rationale: Контекст прямо относится к Богу; «Господь» сохраняет обычный библейский титул без добавления конфессиональной трактовки.
- issue: Степень силы в παγκρατῆ
  choice: всесильному
  alternative: всемогущему
  rationale: «Всесильный» прозрачно выражает греческое значение обладания всей силой; «Всемогущий» также возможен, но сильнее воспринимается как закреплённый богословский титул.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис упрощён ради ясности, но усиление греческой фразы о полной сохранности и связь имущества с передавшими его людьми сохранены.
