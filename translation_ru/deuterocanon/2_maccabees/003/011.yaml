  text: and some also belonging to Hyrcanus son of Tobias[a], a man of very high position. The ungodly Simon was not slandering to that extent. Altogether there were four hundred talents of silver and two hundred of gold.
translation:
  language: ru
  text: А часть принадлежала Гиркану, сыну Товии, человеку, занимавшему весьма высокое положение. Нечестивый Симон клеветал не до такой степени. Всего же было четыреста талантов серебра и двести талантов золота.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте буквально: «а золота — двести»; слово «талантов» подразумевается из предыдущей части фразы.'
    reason: В основном тексте восполнен эллипсис ради ясности.
lexical_decisions:
- source_word: τινὰ δὲ καὶ Ὑρκανοῦ τοῦ Τωβίου
  choice: а часть — Гиркану, сыну Товии
  rationale: 'τινά обозначает некоторую, неуточнённую часть ранее упомянутых средств; притяжательный генитив передан естественной русской конструкцией. τοῦ Τωβίου истолковано как патроним: «сыну Товии».'
- source_word: σφόδρα ἀνδρὸς ἐν ὑπεροχῇ κειμένου
  choice: человеку, занимавшему весьма высокое положение
  rationale: Оборот характеризует общественное положение Гиркана; «занимавшему ... положение» естественно передаёт κειμένου ἐν ὑπεροχῇ, а «весьма» сохраняет усилительное σφόδρα.
- source_word: οὐχ οὕτως διαβάλλων
  choice: не во всём клеветал
  rationale: 'διαβάλλω сохраняет обвинительный оттенок «клеветать», а οὐχ οὕτως указывает, что ложность слов Симона не была полной: наличие частных вкладов подтверждалось.'
- source_word: ὁ δυσσεβὴς Σίμων
  choice: нечестивый Симон
  rationale: «Нечестивый» сохраняет религиозно-нравственную оценку δυσσεβής и соответствует достоинству библейского повествования.
- source_word: τὰ δὲ πάντα
  choice: Всего же
  rationale: Краткая и естественная формула для введения общей суммы.
- source_word: ἀργυρίου τετρακόσια τάλαντα
  choice: четыреста талантов серебра
  rationale: Точно передаёт число, единицу веса и материал.
- source_word: χρυσίου δὲ διακόσια
  choice: двести талантов золота
  rationale: Для ясности восстановлено подразумеваемое из предыдущей части существительное τάλαντα; греческий эллипсис отмечен в сноске.
theological_decisions:
- issue: Нравственно-религиозная характеристика Симона (δυσσεβής)
  choice: нечестивый Симон
  alternative: безбожный Симон; порочный Симон
  rationale: «Нечестивый» передаёт отсутствие благочестия и авторскую нравственную оценку, не усиливая её до утверждения об атеизме и не сводя к общей порочности.
- issue: Степень истинности сообщения Симона (οὐχ οὕτως διαβάλλων)
  choice: не во всём клеветал
  alternative: клеветал не до такой степени; не настолько искажал дело
  rationale: 'Фраза сохраняет напряжение: Симон назван клеветником, однако сведения о наличии некоторых частных средств были не полностью ложными. Перевод не оправдывает его и не утверждает точнее, в чём именно состояла клевета.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан ясным, при этом сохранены авторская оценка Симона и неоднозначность выражения οὐχ οὕτως. Маркер сноски помещён непосредственно после относящейся к ней суммы.
