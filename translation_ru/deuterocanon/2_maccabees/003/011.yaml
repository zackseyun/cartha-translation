    issue: Неточно передано οὐχ οὕτως διαβάλλων.
    rationale: «Не во всём клеветал» меняет сравнительную характеристику степени на распределение истинности по пунктам. Греческое οὐχ οὕτως означает «не так/не до такой степени».
  - severity: low
    issue: Недостаточно явно выражена принадлежность средств Гиркану.
    rationale: «А часть — Гиркану» может быть понято как неполное предложение о передаче денег. «Часть принадлежала Гиркану» прямо передаёт подразумеваемое «из средств, принадлежавших Гиркану».
