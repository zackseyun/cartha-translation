base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/007.yaml
  text: In the reign of Demetrius[a], in the one hundred sixty-ninth year, we Jews wrote to you in the distress and in the crisis that came upon us in those years[c][b], after Jason and those with him departed from the holy land and the kingdom.
translation:
  language: ru
  text: В царствование Димитрия, в сто шестьдесят девятом году, мы, иудеи, писали вам[a] в скорби и в самый разгар бедствия[b], постигшего нас в те годы, после того как Иасон и те, кто был с ним, отступили[c] от святой земли и царства.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «написали вам»; греческий перфект может пониматься как эпистолярный.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в острый» или «в предельный момент бедствия»; греческое слово обозначает высшую, наиболее напряжённую точку.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «отпали», «отделились»; греческий глагол может иметь как политический, так и религиозный оттенок.'
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεύοντος Δημητρίου
  choice: При царствовании Димитрия
  rationale: Родительный самостоятельный оборот служит формулой датировки; русское выражение естественно передаёт время правления.
- source_word: ἔτους ἑκατοστοῦ ἑξηκοστοῦ ἐνάτου
  choice: в сто шестьдесят девятом году
  rationale: Сохраняет формальную хронологическую датировку греческого текста.
- source_word: ἡμεῖς οἱ Ἰουδαῖοι
  choice: мы, иудеи
  rationale: Передаёт местоимение с приложением и уместное здесь этнорелигиозное самоназвание.
- source_word: γεγράφαμεν
  choice: писали вам
  rationale: Греческий перфект может иметь эпистолярное употребление; прошедшее время естественно в ретроспективной датировке, при сохранении альтернативы в примечании.
- source_word: ἐν τῇ θλίψει καὶ ἐν τῇ ἀκμῇ
  choice: в скорби и в самый разгар бедствия
  rationale: θλίψις передано как тяжёлое страдание, а ἀκμή — как острая, высшая точка бедствия; дополнение «бедствия» делает русскую фразу ясной без снятия смыслового напряжения.
- source_word: τῇ ἐπελθούσῃ ἡμῖν
  choice: постигшего нас
  rationale: Естественно передаёт бедствие как пришедшее извне и обрушившееся на общину.
- source_word: ἐν τοῖς ἔτεσιν τούτοις
  choice: в те годы
  rationale: В ретроспективном русском повествовании указательное «те» звучит естественнее буквального «эти».
- source_word: ἀφʼ οὗ
  choice: после того как
  rationale: Передаёт временную исходную точку последовавших бедствий.
- source_word: ἀπέστη
  choice: отпали
  rationale: Глагол может обозначать отход, отступничество или мятеж; «отпали» сохраняет политико-религиозную многозначность лучше, чем нейтральное «ушли» или узкое «восстали».
- source_word: Ἰάσων καὶ οἱ μετʼ αὐτοῦ
  choice: Иасон и его сторонники
  rationale: Естественная русская передача группы, связанной с Иасоном, без уточнения её формального статуса.
- source_word: ἀπὸ τῆς ἁγίας γῆς καὶ τῆς βασιλείας
  choice: от святой земли и царства
  rationale: Сохраняет оба объекта отступления и сакральное определение земли.
theological_decisions:
- issue: Значение ἀπέστη применительно к Иасону
  choice: отпали
  alternative: отступили; отделились; восстали; ушли
  rationale: Форма допускает как политический разрыв, так и религиозное отступничество. «Отпали» сохраняет тяжесть и двойную направленность поступка, не сводя его исключительно к одной сфере.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет форму датировки и структуру длинного греческого предложения, но остаётся понятным обычному читателю. Неоднозначность ἀπέστη вынесена в формулировку и примечание.
