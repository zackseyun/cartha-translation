    rationale: οἱ μετʼ αὐτοῦ буквально и нейтрально обозначает людей, бывших с Иасоном; они могли быть его сторонниками, но текст прямо не определяет характер их связи.
  - severity: medium
    issue: «отпали от святой земли и царства»
    rationale: Передача возможна, но в современном русском сильнее вызывает представление о религиозном отпадении и не вполне естественно сочетается с «землёй» и «царством». «Отступили от» сохраняет широту греческого глагола.
  - severity: low
    issue: Формулировка примечания b
    rationale: Утверждение «на её вершине» представляет «вершину» как принадлежащую скорби, чего греческая формулировка буквально не выражает; ἀκμή самостоятельно обозначает острый или предельный момент.
