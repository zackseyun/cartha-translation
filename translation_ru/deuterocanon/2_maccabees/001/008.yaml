base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/008.yaml
  text: And they set the gateway on fire and poured out innocent blood; but we prayed to the Lord and were heard. We offered sacrifice and fine flour[a], lit the lamps, and set out the loaves.
translation:
  language: ru
  text: Они подожгли ворота и пролили невинную кровь. Но мы помолились Господу, и Он услышал нас. Мы принесли жертву и тонкую пшеничную муку, вынесли светильники[a] и разложили хлебы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вывели» или «вынесли светильники». В храмовом контексте это может означать их подготовку для служения; значение «зажгли» возможно как толкование, но прямо глаголом не выражено.'
    reason: Сохраняет лексическую неоднозначность ἐξηγάγομεν и отделяет контекстуальное толкование от значения основного текста.
lexical_decisions:
- source_word: ἐνέπυραν
  choice: подожгли
  rationale: 'Передаёт каузативный смысл глагола: ворота намеренно предали огню.'
- source_word: τὸν πυλῶνα
  choice: ворота
  rationale: πυλών обозначает ворота или сооружение при входе; «ворота» естественно по-русски и не вносит неподтверждённой архитектурной конкретизации.
- source_word: ἐξέχεαν αἷμα ἀθῷον
  choice: пролили невинную кровь
  rationale: Устойчивое и выразительное русское соответствие буквальному образу излияния невинной крови.
- source_word: ἐδεήθημεν τοῦ κυρίου
  choice: мы помолились Господу
  rationale: Ясно передаёт обращённую к Господу настойчивую молитву, не усиливая значение до отдельного указания на мольбу или заклинание.
- source_word: εἰσηκούσθημεν
  choice: Он услышал нас
  rationale: Естественная русская активная конструкция раскрывает подразумеваемого деятеля — Господа — и сохраняет смысл принятой молитвы, не добавляя прямого утверждения о конкретном ответе.
- source_word: προσηνέγκαμεν θυσίαν καὶ σεμίδαλιν
  choice: мы принесли жертву и тонкую пшеничную муку
  rationale: Передаёт храмовое приношение; σεμίδαλις — тонкая мука, обычно пшеничная, употреблявшаяся в жертвенном служении.
- source_word: ἐξηγάγομεν τοὺς λύχνους
  choice: зажгли светильники
  rationale: В последовательности восстановленных храмовых действий речь, вероятно, идёт о приведении светильников в действие. Поскольку буквально глагол означает «вынесли», эта неоднозначность сохранена в сноске.
- source_word: προεθήκαμεν τοὺς ἄρτους
  choice: разложили хлебы
  rationale: Передаёт размещение храмовых хлебов перед святыней, не добавляя отсутствующего в греческом тексте дополнения.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: В данном иудейском контексте κύριος обозначает Бога Израиля; «Господь» — естественное и традиционное русское соответствие без специального типографического обозначения тетраграмматона.
- issue: Божественный деятель в εἰσηκούσθημεν
  choice: Он услышал нас
  alternative: мы были услышаны
  rationale: Активная русская конструкция естественнее и по ближайшему контексту однозначно относит действие к Господу; при этом она не уточняет способ ответа на молитву.
- issue: Последовательность храмовых действий
  choice: жертвоприношение, приношение муки, зажигание светильников и раскладывание хлебов
  alternative: буквальное «вынесли светильники»
  rationale: Контекст перечисляет действия возобновлённого храмового служения. Вероятный функциональный смысл передан в основном тексте, а буквальная возможность отмечена, чтобы не скрывать лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Ритуальные термины переданы понятно для широкого читателя; синтаксис короткий и ясный. Сноска поставлена непосредственно после спорной фразы о светильниках.
