  text: And from those men the king received many different gifts[a], and distributed them.
translation:
  language: ru
  text: И от них царь получал много разных даров[a] и раздавал их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «много разного». В греческом тексте предмет прямо не назван; слово «дары» добавлено по смыслу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: от них
  rationale: Местоимение отсылает к ранее названным людям; при ἐλάμβανεν отношение источника естественно передаётся по-русски сочетанием «от них».
- source_word: πολλὰ διάφορα
  choice: много разных даров
  rationale: Буквально выражение означает «много разного»; существительное «дары» восполнено из контекста, чтобы фраза звучала естественно, а невыраженный в греческом объект отмечен сноской.
- source_word: ἐλάμβανεν
  choice: получал
  rationale: Глагол означает «брать, получать»; «получал» естественно соответствует контексту и передаёт длительный либо повторяющийся оттенок имперфекта.
- source_word: μετεδίδου
  choice: раздавал их
  rationale: Глагол обозначает передачу другим доли или части; «раздавал» передаёт это значение, а местоимение «их» естественно указывает на полученные дары и отражает повторяющийся оттенок имперфекта.
