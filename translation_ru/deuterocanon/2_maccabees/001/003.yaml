  text: and may he give you a faithful heart to worship him and to do his will with a great heart and a willing soul;[a]
translation:
  language: ru
  text: И да даст Он вам верное сердце, чтобы чтить Его и исполнять Его волю с великим сердцем и готовой душой;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сердце веры» или «верующее сердце». Греческое выражение καρδίαν πίστιν может подчёркивать как веру, так и верность; в данном контексте почитания Бога и исполнения Его воли основной текст передаёт его как «верное сердце».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δοίη
  choice: да даст Он
  rationale: Оптатив выражает молитвенное пожелание; конструкция «да даст» естественно передаёт это значение, не называя подразумеваемого Бога прямо.
- source_word: καρδίαν πίστιν
  choice: верное сердце
  rationale: В контексте почитания Бога и исполнения Его воли πίστιν указывает прежде всего на верность и стойкую преданность; возможные оттенки веры сохранены в примечании.
- source_word: σέβεσθαι
  choice: чтить
  rationale: Глагол обозначает благоговейное религиозное почитание. «Чтить» сохраняет это значение и не сужает его до одного лишь культового действия.
- source_word: τὰ θελήματα
  choice: Его волю
  rationale: Хотя в греческом стоит множественное число, по-русски совокупность Божьих велений естественно передаётся устойчивым выражением в единственном числе.
- source_word: καρδίᾳ μεγάλῃ
  choice: с великим сердцем
  rationale: Близкая к форме оригинала передача сохраняет необычный образ широты, благородства и полноты внутренней готовности, не подменяя его иным библейским оборотом.
- source_word: ψυχῇ βουλομένῃ
  choice: желающей душой
  rationale: Причастие βουλομένῃ буквально выражает воление и внутреннее желание; такая передача сохраняет отличие от более истолковывающего «охотно» или «с готовностью».
theological_decisions:
- issue: Значение слова πίστις в выражении καρδίαν πίστιν
  choice: верное сердце
  alternative: сердце веры; верующее сердце
  rationale: Связь с почитанием Бога и исполнением Его воли поддерживает смысл верности и преданности, однако возможный акцент на вере не исключается и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного пожелания. Сохранены антропологические образы «сердца» и «души», а также намеренно необычное выражение «с великим сердцем».
