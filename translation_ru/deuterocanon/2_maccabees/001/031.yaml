lexical_decisions:
- source_word: ἀνηλώθη
  choice: было поглощено
  rationale: Аорист пассивного залога передаёт полное израсходование или уничтожение предметов жертвоприношения. «Было поглощено» сохраняет результат действия и не вводит в основной текст прямо не названное здесь слово «огнём».
- source_word: τὰ τῆς θυσίας
  choice: всё приготовленное для жертвоприношения
  rationale: Субстантивированное среднее множественное с родительным обозначает не только жертву как единое целое, но совокупность относящихся к ней предметов или материалов. Выбранная формулировка передаёт эту широту естественным русским языком.
- source_word: τὸ περιλειπόμενον ὕδωρ
  choice: оставшуюся воду
  rationale: Причастная конструкция прямо указывает на воду, оставшуюся после предшествующего действия.
- source_word: ἐκέλευσεν
  choice: велел
  rationale: Глагол обозначает властное распоряжение; «велел» естественно звучит в русском повествовании и не ослабляет его силы.
- source_word: λίθους μείζονας
  choice: более крупные камни
  rationale: Сравнительная степень μείζονας передана явно и относится к размеру камней.
- source_word: καταχεῖν
  choice: вылить … на
  rationale: Инфинитив означает лить вниз или на что-либо. Русская конструкция с «велел» естественно требует активного инфинитива, а объект выражен винительным падежом.
