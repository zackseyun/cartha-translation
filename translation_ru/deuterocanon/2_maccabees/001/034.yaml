  text: Then the king enclosed it and made it sacred[a], after testing the matter.
translation:
  language: ru
  text: Тогда царь оградил это место и сделал его священным[a], удостоверившись в случившемся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устроил там святилище». Греческое слово можно понять и как сказуемое («сделал его священным»), и как существительное («сделал его святилищем»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιφράξας
  choice: оградил
  rationale: Аористное причастие обозначает конкретное действие — царь обнёс место оградой или иным образом отгородил его; «оградил» естественно по-русски и не уточняет вид сооружения.
- source_word: ἱερὸν
  choice: священным
  rationale: 'Безартиклевое ἱερόν естественно понимать как именную часть сказуемого при ἐποίησεν: царь сделал подразумеваемое место священным. При этом субстантивное понимание остаётся возможным и отмечено в сноске.'
- source_word: ἐποίησεν
  choice: сделал
  rationale: Передаёт обычное значение глагола ποιέω и естественно сочетается с предикативным «священным».
- source_word: δοκιμάσας
  choice: удостоверившись
  rationale: Причастие указывает на предшествующую проверку и подтверждение; в данном контексте «удостоверившись» звучит естественнее буквального «испытав».
- source_word: τὸ πρᾶγμα
  choice: в случившемся
  rationale: Выражение относится к проверяемому событию или явлению; «в случившемся» сохраняет широкое значение и естественно сочетается с «удостоверившись».
theological_decisions:
- issue: Значение ἱερὸν применительно к месту
  choice: 'Предикативное прилагательное: царь сделал место священным.'
  alternative: 'Субстантивированное существительное: царь устроил там святилище.'
  rationale: Отсутствие артикля и конструкция с ἐποίησεν допускают предикативное прочтение, не подразумевающее непременно строительство храмового здания. Подлинная синтаксическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; изложение краткое и dignified. Местоименное дополнение раскрыто как «это место», поскольку русское «оградил его» без явно выраженного антецедента в отдельном стихе было бы менее ясным. Временная последовательность аористных причастий передана конструкцией с деепричастием совершенного вида.
