  text: and open your heart in his law and in the commandments[a], and bring about peace;
translation:
  language: ru
  text: и да откроет ваши сердца для его закона и заповедей[a], и да утвердит мир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческие инфинитивы продолжают молитвенное пожелание предыдущего стиха. Буквально: «и открыть ваше сердце в его законе и в заповедях, и сотворить мир»; значение предлога «в» в первом обороте допускает различные способы передачи.'
    reason: Уточняет синтаксическую зависимость инфинитивов и отмечает, что русское «для» является идиоматической передачей неоднозначного греческого ἐν, а не устранением этой неоднозначности.
lexical_decisions:
- source_word: διανοίξαι
  choice: да откроет
  rationale: Передаёт основной образ «открыть», а частица «да» показывает, что инфинитив продолжает молитвенное пожелание предыдущего стиха.
- source_word: καρδίαν ὑμῶν
  choice: ваше сердце
  rationale: Сохраняет единственное число греческого «сердце» при множественном адресате и библейское обозначение внутреннего человека — его воли и разумения.
- source_word: ἐν τῷ νόμῳ αὐτοῦ
  choice: в его законе
  rationale: Прямо сохраняет ἐν как указание на сферу, не сводя выражение к более истолковывающему «к его закону».
- source_word: ἐν τοῖς προστάγμασιν
  choice: в заповедях
  rationale: «Заповеди» — понятное и уместное в религиозном контексте обозначение предписанного Богом; повтор предлога сохраняет строение греческого текста.
- source_word: εἰρήνην
  choice: мир
  rationale: Сохраняет широкий общинный и заветный смысл εἰρήνη, не ограничивая его внутренним спокойствием.
- source_word: ποιῆσαι
  choice: да установит
  rationale: Естественно передаёт причинное значение «сделать, осуществить» применительно к миру и сохраняет подразумеваемое действие Бога.
theological_decisions:
- issue: Подразумеваемое подлежащее и молитвенная модальность, продолженные из предыдущего стиха
  choice: Подлежащее не названо, но молитвенное пожелание выражено конструкциями «да откроет» и «да установит».
  alternative: 'Оставить буквальные инфинитивы: «и открыть... и сотворить мир».'
  rationale: Греческие инфинитивы синтаксически зависят от молитвенного пожелания предыдущего стиха. Русская конструкция с «да» ясно передаёт эту зависимость, не добавляя имени подлежащего.
- issue: Значение ἐν при открытии сердца
  choice: Сохранено «в его законе и в заповедях» как указание на сферу.
  alternative: «к его закону и заповедям» как указание на направленность или восприимчивость.
  rationale: Более буквальная передача сохраняет подлинную неоднозначность греческого оборота и не подменяет образ его толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Структура молитвенного пожелания ясна обычному читателю; метафора сердца и повтор предлога сохранены ради близости к греческому тексту.
