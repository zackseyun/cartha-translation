  terminology: «Закон», «заповеди», «сердца» и «мир» уместны и сохраняют библейский регистр. «Утвердит мир» не сужает εἰρήνη до личного спокойствия и не вызывает нежелательной разговорной ассоциации «сделать мир» как примириться после конфликта.
