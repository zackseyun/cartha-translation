  text: and may God do good to you[a], and remember his covenant with Abraham, Isaac, and Jacob, his faithful servants.
translation:
  language: ru
  text: И да сделает Бог вам добро, и да вспомнит Он Свой завет с Авраамом, Исааком и Иаковом — Своими верными рабами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своими верными служителями». Греческое слово буквально означает «рабами» и подчёркивает их принадлежность Богу.'
    reason: Сохраняет более мягкий традиционный вариант передачи δοῦλοι и поясняет смысл выбранного слова.
lexical_decisions:
- source_word: ἀγαθοποιῆσαι
  choice: сделает добро
  rationale: Передаёт благопожелание о благом действии Бога по отношению к адресатам, не уточняя его форму сверх греческого текста.
- source_word: μνησθῆναι
  choice: вспомнит
  rationale: Сохраняет обычный библейский язык завета; в данном контексте речь не только о мысленном воспоминании, но и о верном внимании к завету, ведущем к действию.
- source_word: διαθήκης
  choice: завет
  rationale: Упоминание Авраама, Исаака и Иакова ясно указывает на библейский завет, а не на обычное соглашение или завещание.
- source_word: δούλων
  choice: рабами
  rationale: Русское библейское «рабы» сохраняет выраженную словом δοῦλοι принадлежность Богу; более мягкий вариант «служители» указан в сноске.
- source_word: πιστῶν
  choice: верными
  rationale: Характеризует праотцов как сохраняющих верность Богу; это естественный и богословски нейтральный русский эквивалент.
theological_decisions:
- issue: Передача δοῦλος применительно к праотцам
  choice: рабы
  alternative: служители
  rationale: «Рабы» точнее сохраняет смысл принадлежности Богу, присутствующий в греческом δοῦλοι, и имеет устойчивое библейское звучание в русском языке. Вариант «служители» более мягок и естественен для части современных читателей, поэтому сохранён в сноске.
- issue: Заветное значение μνησθῆναι
  choice: вспомнит
  alternative: помянет; не забудет
  rationale: «Вспомнит» сохраняет образный язык оригинала и его заветное напряжение, не разворачивая подразумеваемое последующее действие Бога прямо в основном тексте.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской интонацией. Конструкция «да сделает… и да вспомнит» сохраняет форму молитвенного благопожелания. Тире ясно связывает определение «Своими верными рабами» со всеми тремя праотцами.
