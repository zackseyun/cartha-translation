lexical_decisions:
- source_word: διελθόντων δὲ ἐτῶν ἱκανῶν
  choice: Но когда прошло много лет
  rationale: Родительный самостоятельный оборот задаёт временной фон; ἱκανῶν здесь означает значительное число лет. Русская конструкция естественно передаёт это значение.
- source_word: ὅτε ἔδοξεν τῷ θεῷ
  choice: и Богу было угодно
  rationale: Безличный оборот сохраняет значение божественного решения или благоволения, не сводя его к эмоциональному удовольствию.
- source_word: ἀποσταλεὶς Νεεμίας ἀπὸ τοῦ βασιλέως τῆς Περσίδος
  choice: Неемия, посланный царём Персии
  rationale: Страдательное причастие относится к Неемии, а ἀπό обозначает лицо, от которого исходило поручение; в современном русском это естественно передаётся творительным падежом.
- source_word: τοὺς ἐκγόνους τῶν ἱερέων
  choice: потомков священников
  rationale: ἐκγόνους обозначает потомков без необходимости сужать смысл до сыновей мужского пола.
- source_word: τῶν ἀποκρυψάντων
  choice: спрятавших огонь
  rationale: Причастие относится к священникам. Объект, опущенный в греческом, восстановлен из ближайшего контекста как «огонь» для ясности русского текста.
- source_word: ἔπεμψεν ἐπὶ τὸ πῦρ
  choice: отправил ... за ним
  rationale: Греческое выражение с ἐπί и винительным падежом сжато и допускает буквальное «к огню/за огнём». Контекст указывает на отправку потомков для получения скрытого огня; местоимение избегает тяжёлого повтора.
theological_decisions:
- issue: Божественная воля в выражении ὅτε ἔδοξεν τῷ θεῷ
  choice: Богу было угодно
  alternative: Бог счёл это своевременным; Богу это показалось правильным
  rationale: Выбранная формулировка естественна для литературного русского и передаёт решение или одобрение Бога, не добавляя частного богословского толкования.
