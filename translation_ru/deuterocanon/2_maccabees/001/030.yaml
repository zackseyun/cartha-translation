lexical_decisions:
- source_word: Οἱ δὲ
  choice: А
  rationale: Частица δέ мягко продолжает повествование; русское «А» естественно связывает предложение с предыдущим контекстом, не создавая резкого противопоставления.
- source_word: ἱερεῖς
  choice: священники
  rationale: Определённость греческого артикля в русском языке естественно передаётся контекстом; речь идёт о конкретных священниках, участвующих в обряде.
- source_word: ἐπέψαλλον
  choice: пели
  rationale: Глагол ψάλλω обозначает исполнение хвалебных песнопений. Форма имперфекта представляет действие как продолжавшееся, однако в русском повествовании несовершенный вид «пели» естественно сохраняет эту длительность без вспомогательной конструкции.
- source_word: τοὺς ὕμνους
  choice: гимны
  rationale: ὕμνοι — хвалебные, вероятно богослужебные песнопения; «гимны» точно и кратко сохраняет предметное значение и определённость выражения.
