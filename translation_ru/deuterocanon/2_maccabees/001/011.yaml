  yaml_path: translation/deuterocanon/2_maccabees/001/011.yaml
  text: Having been saved by God from great dangers[a], we give him great thanks, as those about to array ourselves against a king.
translation:
  language: ru
  text: Спасённые Богом от великих опасностей, мы горячо благодарим Его, как те, кто готовится выступить против царя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как те, кто выстраивается против царя»; возможно также: «словно выстроившиеся против царя». Греческий оборот сжат, допускает модальный оттенок и сохраняет военный образ.'
    reason: Лексическая и синтаксическая неоднозначность ὡς ἂν … παρατασσόμενοι.
lexical_decisions:
- source_word: ἐκ μεγάλων κινδύνων
  choice: от великих опасностей
  rationale: Сохраняет множественное число, усиление μεγάλων и обычное значение κίνδυνος — «опасность».
- source_word: ὑπὸ τοῦ θεοῦ σεσωσμένοι
  choice: спасённые Богом
  rationale: Перфектное страдательное причастие передаёт совершившееся спасение с сохраняющимся результатом, а ὑπό с родительным прямо указывает на Бога как действующее лицо.
- source_word: μεγάλως εὐχαριστοῦμεν αὐτῷ
  choice: мы горячо благодарим Его
  rationale: Наречие μεγάλως усиливает благодарность; «горячо благодарим» естественно звучит по-русски и сохраняет обращённость благодарности к Богу.
- source_word: ὡς ἂν
  choice: как те, кто
  rationale: Передаёт сравнительно-модальный оборот, не сводя его однозначно к нереальному «словно»; сжатость и неоднозначность греческого выражения пояснены в сноске.
- source_word: πρὸς βασιλέα
  choice: против царя
  rationale: В сочетании с военным παρατάσσω предлог πρός имеет противительное значение — выступление против противника.
- source_word: παρατασσόμενοι
  choice: выступает
  rationale: В контексте противостояния царю глагол сохраняет военный образ построения или выхода на бой, но русское «выступает против» звучит естественно и не добавляет прямо не выраженного слова «битва».
theological_decisions:
- issue: Бог как совершающий спасение
  choice: Бог прямо назван Тем, кто спас авторов письма
  alternative: Безличное или расплывчатое указание на избавление
  rationale: Конструкция ὑπὸ τοῦ θεοῦ σεσωσμένοι грамматически недвусмысленно обозначает Бога как действующее лицо.
- issue: Связь благодарности с образом противостояния царю
  choice: Сохранено сжатое сравнение без богословского истолкования его точной логики
  alternative: «как подобает победившим царя» либо «поскольку мы сражались против царя»
  rationale: Греческий текст не говорит прямо ни о победе, ни о нормативной уместности благодарности; такие уточнения устранили бы реальную неоднозначность оборота.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярно-библейской речи. Причастный зачин сохраняет структуру греческой фразы; «горячо благодарим» избегает тяжеловесного буквального «велико благодарим», а заключительный военный образ оставлен намеренно сжатым.
