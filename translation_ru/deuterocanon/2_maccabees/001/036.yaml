  text: And the men around Nehemiah called this Nephthar[a], which is translated “Purification”; but by most people it is called Nephi.
translation:
  language: ru
  text: Спутники Неемии назвали это Нефтаром — в переводе «Очищение», — но большинство людей называет его Нефти.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых переводах это имя передаётся как «Нефи»; буквальная транслитерация греческого Νεφθί — «Нефти».
    reason: lexical_alternative
lexical_decisions:
- source_word: προσηγόρευσαν
  choice: назвали
  rationale: Глагол обозначает присвоение названия; «назвали» естественно и точно передаёт смысл в данном контексте.
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: спутники Неемии
  rationale: Греческий оборот обозначает людей, находившихся при Неемии, то есть его окружение или спутников; выбран краткий и естественный русский эквивалент.
- source_word: τοῦτο
  choice: это
  rationale: Указательное местоимение отсылает к упомянутому ранее веществу и сохраняет лаконичность оригинала.
- source_word: Νεφθάρ
  choice: Нефтар
  rationale: Название передано транслитерацией греческой формы с учётом русской традиции передачи φ как «ф» и θ как «т».
- source_word: διερμηνεύεται
  choice: в переводе
  rationale: Оборот ясно вводит греческое объяснение значения чужого названия и естественно звучит по-русски.
- source_word: Καθαρισμός
  choice: Очищение
  rationale: Существительное означает очищение и может иметь обрядовый оттенок; «Очищение» сохраняет форму и смысл исходного слова.
- source_word: καλεῖται
  choice: называет
  rationale: Настоящее время и пассивная идея именования естественно переданы русской активной конструкцией с субъектом «большинство людей».
- source_word: παρὰ τοῖς πολλοῖς
  choice: большинство людей
  rationale: Оборот указывает на распространённое среди большинства употребление названия.
- source_word: Νεφθί
  choice: Нефти
  rationale: Прямая русская транслитерация греческой формы Νεφθί сохраняет согласный θ как «т» и конечный долгий ι как «и».
