translation:
  language: ru
  text: Насади народ Твой на святом месте Твоём[a], как сказал Моисей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прочно посели народ Твой на святом месте Твоём». Греческий глагол буквально означает «насади» и создаёт образ прочного укоренения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καταφύτευσον
  choice: Насади
  rationale: Аористное повелительное наклонение от καταφυτεύω буквально передаёт образ насаждения и одновременно подразумевает прочное поселение. Русское «насади» сохраняет метафору и уместно в возвышенной молитвенной речи.
- source_word: τὸν λαόν σου
  choice: народ Твой
  rationale: λαός обозначает народ как единое сообщество; «народ Твой» естественно передаёт принадлежность Богу в контексте молитвы.
- source_word: εἰς τὸν τόπον τὸν ἅγιόν σου
  choice: на святом месте Твоём
  rationale: εἰς после глагола помещения допускает русскую передачу местом пребывания; τόπος означает «место», а ἅγιος — «святой». Формулировка не уточняет, идёт ли речь о земле, святилище или храме.
- source_word: καθὼς εἶπεν Μωσῆς
  choice: как сказал Моисей
  rationale: καθώς выражает соответствие сказанному ранее, а εἶπεν — простое «сказал»; краткая русская формулировка точно и естественно передаёт греческий текст.
theological_decisions:
- issue: К чему относится выражение «святое место Твоё»
  choice: Сохранено общее выражение «на святом месте Твоём».
  alternative: «на святой земле Твоей» или «во святилище Твоём»
  rationale: Греческое τόπος означает «место» и в данном стихе прямо не уточняет землю, храм или святилище. Более конкретный перевод необоснованно разрешил бы неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Метафора насаждения сохранена; порядок «народ Твой» и «месте Твоём» придаёт фразе умеренно возвышенное звучание без излишней архаизации.
