  source_fidelity: 'Нужно исправить согласование: παρεγένετο стоит в единственном числе и относится прежде всего к Антиоху; сопровождающие «друзья» присоединены к нему. «Огромную сумму» чрезмерно усиливает πλείονα, передающее большую/значительную сумму. Целевой оборот χάριν τοῦ λαβεῖν лучше прямо передать через «чтобы получить».'
