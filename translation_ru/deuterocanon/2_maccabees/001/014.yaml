  yaml_path: translation/deuterocanon/2_maccabees/001/014.yaml
  text: For when Antiochus and his friends with him arrived at the place as though to marry her[a], in order to get the money in large amount as a dowry payment,
translation:
  language: ru
  text: Ведь Антиох вместе со своими друзьями прибыл туда, будто намереваясь вступить с ней в брак[a], чтобы получить значительную сумму денег в качестве приданого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы жить с ней» / «чтобы жениться на ней». Греческое слово может означать как совместную жизнь, так и вступление в брак; здесь, вероятно, речь идёт о предлоге брака с богиней, чтобы завладеть храмовыми средствами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνοικῶν αὐτῇ
  choice: будто бы для того, чтобы вступить с ней в брак
  rationale: συνοικέω может означать совместную жизнь или вступление в брак. В контексте речь идёт о мнимом браке; оборот «будто бы» передаёт притворный характер намерения, подразумеваемый повествованием.
- source_word: παρεγένετο εἰς τὸν τόπον
  choice: прибыли туда
  rationale: Естественно передаёт прибытие Антиоха и сопровождавших его лиц в указанное место; сказуемое согласовано по смыслу с составным подлежащим.
- source_word: ὅ τε Ἀντίοχος καὶ οἱ σὺν αὐτῷ φίλοι
  choice: Антиох и его друзья
  rationale: φίλοι буквально означает «друзья», хотя при эллинистическом дворе могло обозначать приближённых. Контекст не требует вводить более специальный титул.
- source_word: χάριν τοῦ λαβεῖν
  choice: намереваясь получить
  rationale: Передаёт целевое значение конструкции и одновременно естественно связывает прибытие с замыслом завладеть деньгами.
- source_word: τὰ χρήματα πλείονα
  choice: огромную сумму денег
  rationale: πλείονα выражает большую величину или количество. В данном контексте речь идёт о значительной сумме; русский оборот естественнее буквального «деньги в большем количестве».
- source_word: εἰς φερνῆς λόγον
  choice: в качестве приданого
  rationale: φερνή означает «приданое», а сочетание с εἰς ... λόγον указывает, в каком качестве или по какому счёту предполагалось получить деньги.
theological_decisions:
- issue: Отнесение местоимения αὐτῇ к богине и характер предполагаемого союза
  choice: Сохранено местоимение «с ней» и брачная формулировка без добавления слова «богиня» в основной текст.
  alternative: «жениться на богине» или «жить с ней»
  rationale: Греческий стих употребляет только местоимение и многозначное συνοικέω. Контекст проясняет референта, однако основной текст не должен добавлять отсутствующее существительное; лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с повествовательной ясностью и умеренно торжественным библейским регистром. Сохранена незавершённость синтаксической фразы, поскольку стих продолжается далее.
