translation:
  language: ru
  text: И да услышит ваши моления[a], да примирится с вами[b] и не оставит вас в злое время[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «да внемлет вашим мольбам».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «да вновь будет к вам благосклонен» или «да смилостивится над вами».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «в бедственное время».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακούσαι
  choice: да услышит
  rationale: В контексте молитвы глагол означает не просто восприятие звука, а благосклонное внимание к просьбе; «да услышит» естественно передаёт молитвенное пожелание, не усиливая смысл до «ответит».
- source_word: τῶν δεήσεων
  choice: ваши моления
  rationale: δέησις обозначает настоятельную просьбу, мольбу. «Моления» точнее сохраняет оттенок усердной просьбы, чем более широкое «молитвы», и остаётся понятным в современном литературном русском.
- source_word: καταλλαγείη
  choice: да примирится с вами
  rationale: Форма от καταλλάσσω выражает восстановление нарушенных отношений или благоволения. «Примирится с вами» сохраняет личностный и взаимный оттенок, не сводя смысл к эмоциональному умилостивлению.
- source_word: ἐγκαταλίποι
  choice: не оставит вас
  rationale: ἐγκαταλείπω означает оставлять, покидать, бросать. «Не оставит вас» естественно и точно в контексте обращения к Богу; более сильное «не покинет» также возможно.
- source_word: ἐν καιρῷ πονηρῷ
  choice: в злое время
  rationale: 'Буквальное сочетание сохраняет присущую πονηρός двусмысленность: время может быть злым по своему характеру или тяжким и бедственным для людей.'
theological_decisions:
- issue: Передаёт ли καταλλαγείη умилостивление Бога или восстановление отношений с ним
  choice: да примирится с вами
  alternative: да вновь будет к вам благосклонен; да умилостивится к вам
  rationale: Греческий допускает представление о восстановлении благоволения после отчуждения. Выбранная формулировка сохраняет богословское напряжение и не уточняет ни причину отчуждения, ни способ примирения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной молитвенной формой «да…». Лексика понятна широкому читателю; «моления» и «злое время» сохраняют смысловые оттенки греческого текста без архаизации.
