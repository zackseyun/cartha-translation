  text: 'To the Jewish brothers in Egypt: the Jewish brothers in Jerusalem and those in the land of Judea[a], greetings and good peace.'
translation:
  language: ru
  text: 'Братьям-иудеям в Египте — братья-иудеи в Иерусалиме и те, кто в земле Иудее: приветствие и добрый мир.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Радуйтесь и доброго мира». Греческое χαίρειν — обычная формула приветствия в начале письма; буквально оно означает «радуйтесь». За ним следует пожелание «доброго мира».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς ἀδελφοῖς τοῖς κατʼ Αἴγυπτον Ἰουδαίοις
  choice: Братьям-иудеям, живущим в Египте
  rationale: Дательный падеж обозначает адресатов письма; ἀδελφοῖς передано прямо как «братьям», а Ἰουδαίοις — как приложение «иудеям». Оборот κατʼ Αἴγυπτον естественно выражен как место проживания.
- source_word: οἱ ἀδελφοὶ οἱ ἐν Ἱεροσολύμοις Ἰουδαῖοι
  choice: братья-иудеи, живущие в Иерусалиме
  rationale: Сохранены повтор слова «братья», этническое обозначение и место нахождения отправителей; русская конструкция остаётся ясной и естественной.
- source_word: καὶ οἱ ἐν τῇ χώρᾳ τῆς Ἰουδαίας
  choice: и те, кто живёт в земле Иудейской
  rationale: χώρα передано как «земля», что сохраняет региональный смысл и несколько торжественный регистр исходного письма.
- source_word: χαίρειν
  choice: радуйтесь
  rationale: Форма является обычной греческой эпистолярной формулой приветствия, но буквально связана с призывом радоваться. «Радуйтесь» сохраняет форму и смысл исходного слова, не добавляя отсутствующего в греческом глагола «посылают».
- source_word: εἰρήνην ἀγαθήν
  choice: доброго вам мира
  rationale: Переданы оба компонента необычного сочетания — «добрый» и «мир»; добавление «вам» требуется русской формуле пожелания и не расширяет её смысл до благополучия или процветания.
theological_decisions:
- issue: Передача ἀδελφοῖς / ἀδελφοὶ в обращении общин
  choice: братьям / братья
  alternative: братьям и сёстрам; единоверцам
  rationale: Греческий текст дважды употребляет мужской родственный термин. Его прямая передача сохраняет семейную солидарность общин и не вносит гендерного уточнения, которого сам текст явно не выражает.
- issue: Соотношение χαίρειν и εἰρήνην ἀγαθήν
  choice: радуйтесь и доброго вам мира
  alternative: привет и доброго мира; приветствуют и желают доброго мира
  rationale: Выбранная формулировка сохраняет как буквальный оттенок χαίρειν, так и отдельное пожелание мира, не сливая их и не вводя в основной текст отсутствующие глаголы «приветствуют» или «желают».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным эпистолярным звучанием. Повтор «братья-иудеи» намеренно сохраняет структуру и семейную лексику греческого текста; необычное пожелание «доброго мира» не сглажено до «благополучия».
