  text: А теперь празднуйте дни Праздника шалашей в месяце Кислеве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кислев — месяц еврейского календаря, приблизительно приходящийся на ноябрь—декабрь по григорианскому календарю. Традиционное название Праздника шалашей — Праздник кущей.
    reason: Культурное пояснение и традиционный лексический вариант.
lexical_decisions:
- source_word: ἄγητε
  choice: празднуйте
  rationale: В сочетании с обозначением праздничных дней глагол ἄγω означает проводить, соблюдать или праздновать их; «празднуйте» естественно передаёт повелительный смысл и праздничный контекст.
- source_word: τὰς ἡμέρας
  choice: дни
  rationale: Прямой перевод сохраняет временной акцент греческого выражения и естественно сочетается с глаголом «празднуйте».
- source_word: τῆς σκηνοπηγίας
  choice: Праздника шалашей
  rationale: Существительное обозначает иудейский праздник кущей, то есть временных жилищ-шалашей. Такой перевод прозрачен современному читателю, а традиционное название отмечено в сноске.
- source_word: τοῦ Χασελεὺ μηνός
  choice: в месяце кислеве
  rationale: Греческую родительную конструкцию естественно передать русским предложным оборотом. «Кислев» — принятое русское название еврейского месяца.
theological_decisions:
- issue: Передача названия праздника σκηνοπηγία
  choice: Праздник шалашей
  alternative: Праздник Кущей
  rationale: Основной вариант раскрывает буквальный образ временных жилищ и остаётся понятным современному читателю; традиционное библейское название сохраняется в сноске, без изменения идентичности праздника.
translation_notes:
  register: Современный литературный русский язык; ясный, достойный повелительный оборот. Порядок слов слегка адаптирован к русской норме, смысл и структура греческого текста сохранены.
