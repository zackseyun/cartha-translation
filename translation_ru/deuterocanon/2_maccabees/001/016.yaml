base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/016.yaml
  text: After opening the hidden door of the smoke chamber[a], they threw stones and struck down the leader, and after cutting him into pieces[b], they threw the heads to those outside.
translation:
  language: ru
  text: Открыв потайную дверь в потолке[a], они, бросая камни, сокрушительно поразили предводителя[b], а затем, расчленив его, бросили головы тем, кто был снаружи[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Редкое греческое слово; оно, вероятно, обозначает потолок либо кессонную (панельную) потолочную конструкцию, но точное значение неясно.
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол вызывает образ удара грома или молнии и может обозначать сокрушительное поражение; стих не требует понимать его как буквальный удар молнии.
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте «головы» стоит во множественном числе, хотя ранее назван один предводитель. Причина этого числа в самом стихе не поясняется.
    reason: textual_narrative_ambiguity
lexical_decisions:
- source_word: ἀνοίξαντες τὴν ... κρυπτὴν θύραν
  choice: Открыв потайную дверь
  rationale: Аористное причастие передаёт действие, предшествующее основным событиям; «потайная дверь» естественно выражает скрытый, тайный проход.
- source_word: τοῦ φατινώματος
  choice: в потолке
  rationale: Редкое существительное связано с панельной или кессонной конструкцией, здесь, вероятнее всего, потолком; перевод согласуется с тем, что через скрытый проём сверху бросают камни, но неопределённость отмечена в сноске.
- source_word: βάλλοντες πέτρους
  choice: они стали бросать камни
  rationale: Причастие обозначает сопутствующее действие или способ нападения; русская конструкция ясно и естественно передаёт развитие сцены.
- source_word: συνεκεραύνωσαν
  choice: насмерть поразили
  rationale: Глагол содержит образ громового удара и обозначает сокрушительное поражение; выбранное выражение не утверждает, что с неба буквально ударила молния, а образная окраска сохранена в сноске.
- source_word: τὸν ἡγεμόνα
  choice: правителя
  rationale: ἡγεμών может означать правителя, начальника или предводителя; в данном повествовании «правитель» уместно и не уточняет должность сверх греческого текста.
- source_word: μέλη ποιήσαντες
  choice: разрубили тела на части
  rationale: Идиома буквально означает «сделав частями/членами», то есть расчленив; множественное «тела» учитывает последующее множественное «головы» и присутствие спутников правителя в контексте.
- source_word: τὰς κεφαλὰς
  choice: головы
  rationale: Множественное число греческого текста сохранено, хотя непосредственно перед этим правитель назван в единственном числе.
- source_word: τοῖς ἔξω παρρίψαντες
  choice: выбросили головы тем, кто находился снаружи
  rationale: Дательный оборот естественно понимается как обозначение людей снаружи, а не только направления или места.
theological_decisions:
- issue: Следует ли понимать συνεκεραύνωσαν как буквальный удар молнии или как образ сокрушительного нападения
  choice: Передано как «насмерть поразили» с пояснением образа громового удара в сноске.
  alternative: «поразили молнией» или «сокрушили»
  rationale: Непосредственными действующими лицами являются нападающие, бросающие камни. Поэтому буквальное небесное чудо не утверждается, но необычная образность греческого глагола не скрывается.
- issue: К кому относятся расчленение и множественное «головы»
  choice: В основном тексте употреблено множественное «тела», а несогласованность числа пояснена в сноске.
  alternative: «расчленив его» при последующем буквальном «головы»
  rationale: В ближайшей фразе назван один правитель, однако контекст упоминает вошедших с ним людей, а греческое «головы» стоит во множественном числе. Перевод сохраняет эту смысловую связь, не исправляя множественное число на единственное.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Жестокость сцены передана прямо, без архаизмов и без усиления сверх исходного текста. Необычные лексические и числовые особенности вынесены в краткие сноски.
