base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/024.yaml
  text: 'And the prayer was in this form: “Lord God[a], creator of all things, the awesome and mighty and righteous and merciful one[b], the only king and good one,”'
translation:
  language: ru
  text: 'А молитва была такой: «Господи Боже, Творец всего, внушающий трепет[a], могущественный, праведный и милосердный, единственный Царь и благой[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грозный»; греческое слово обозначает того, кто внушает страх или благоговейный трепет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «добрый» или «благожелательный»; греческое слово может обозначать благость, доброту и благожелательность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ ἡ προσευχὴ τὸν τρόπον ἔχουσα τοῦτον
  choice: А молитва была такой
  rationale: Естественно передаёт греческую формулу, буквально указывающую на вид или форму последующей молитвы.
- source_word: Κύριε ὁ θεός
  choice: Господи Боже
  rationale: Греческое обращение передано русскими звательными формами, привычными для молитвенной речи и не архаичными.
- source_word: ὁ πάντων κτίστης
  choice: Творец всего
  rationale: Кратко и точно передаёт κτίστης и универсальный охват πάντων.
- source_word: ὁ φοβερὸς
  choice: внушающий трепет
  rationale: Передаёт активное значение φοβερός — тот, кто вызывает страх и благоговейный трепет, — не создавая современного ложного смысла слова «боязливый».
- source_word: ὁ ἰσχυρὸς
  choice: могущественный
  rationale: Естественное в контексте хвалы обозначение силы и могущества Бога.
- source_word: δίκαιος
  choice: праведный
  rationale: Сохраняет характеристику нравственной правоты Бога; возможное «справедливый» было бы несколько уже.
- source_word: ἐλεήμων
  choice: милосердный
  rationale: Прямой и устойчивый русский эквивалент в молитвенной речи.
- source_word: ὁ μόνος βασιλεὺς
  choice: единственный Царь
  rationale: Сохраняет исключительность μόνος и исповедание Божьего царствования.
- source_word: χρηστός
  choice: благой
  rationale: Передаёт широкий спектр значения — доброту, благость и благожелательность — и соответствует достоинству молитвенного регистра.
theological_decisions:
- issue: Значение κύριος в обращении иудейской молитвы
  choice: 'Господь (в звательной форме: «Господи»)'
  alternative: Владыка
  rationale: «Господи Боже» естественно передаёт обращение Κύριε ὁ θεός и сохраняет традиционное, общеупотребительное обозначение Бога без конфессионального расширения.
- issue: Исключительность в μόνος βασιλεὺς
  choice: единственный Царь
  alternative: единый Царь
  rationale: «Единственный» ясно сохраняет прямое утверждение исключительности Божьего царствования.
- issue: Смысл φοβερός как Божьего свойства
  choice: внушающий трепет
  alternative: грозный
  rationale: Выбранный вариант удерживает одновременно страх и благоговение, не сводя значение только к угрозе или суровости.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Сохранён ряд божественных определений и незавершённость фразы, продолжающейся в следующем стихе. Прописные буквы в «Творец» и «Царь» употреблены как обозначения Бога.
