base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/025.yaml
  text: the only provider[a], the only righteous one, almighty and eternal, the one who rescues Israel from every evil, who made the fathers chosen and sanctified them[c][b];
translation:
  language: ru
  text: единственный Податель[a], единственный Праведный, всемогущий и вечный, спасающий Израиль от всякого зла, сделавший отцов избранными[b] и освятивший их[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «единственный Благодетель» либо «единственный Снабдитель». Греческое слово подчёркивает, что Бог даёт всё необходимое.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избравший отцов». Буквально: «сделавший отцов избранными».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «сделавший их святыми» либо «посвятивший их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μόνος
  choice: единственный
  rationale: Повторение сохраняет подчёркнутую исключительность Бога в молитвенном обращении.
- source_word: χορηγός
  choice: Податель
  rationale: Слово обозначает того, кто снабжает необходимым; «Податель» кратко и достойно передаёт этот смысл в молитвенном контексте.
- source_word: δίκαιος
  choice: Праведный
  rationale: Прилагательное употреблено субстантивированно как наименование Бога; форма сохраняет личный и нравственный смысл.
- source_word: παντοκράτωρ
  choice: всемогущий
  rationale: Естественное современное соответствие божественному титулу со значением всеобъемлющей силы и власти.
- source_word: αἰώνιος
  choice: вечный
  rationale: В ряду божественных свойств ясно передаёт неограниченность временем.
- source_word: διασώζων
  choice: спасающий
  rationale: Причастие выражает продолжающееся деятельное избавление от опасности.
- source_word: ἐκ παντὸς κακοῦ
  choice: от всякого зла
  rationale: Сохраняет широту κακόν, охватывающего зло, беду и вред, не сужая значение.
- source_word: ποιήσας ... ἐκλεκτούς
  choice: сделавший ... избранными
  rationale: Сохраняет каузативную конструкцию оригинала, не заменяя её более толковательным «избравший».
- source_word: τοὺς πατέρας
  choice: отцов
  rationale: Передаёт традиционное обозначение праотцов Израиля, не добавляя отсутствующее в греческом местоимение «наших».
- source_word: ἡγίασας
  choice: освятивший
  rationale: Сохраняет богословский и молитвенный регистр, а также значение посвящения Богу и наделения святостью.
theological_decisions:
- issue: Обозначение праотцов завета в τοὺς πατέρας
  choice: отцов
  alternative: предков; наших отцов
  rationale: «Отцов» сохраняет библейско-исторический оттенок, тогда как «наших» отсутствует в исходном тексте, а «предков» нейтрализует заветное звучание.
- issue: Каузативный смысл ποιήσας ... ἐκλεκτούς
  choice: сделавший отцов избранными
  alternative: избравший отцов
  rationale: Выбранный вариант сохраняет необычную, но осмысленную формулировку оригинала и не устраняет возможное различие между избранием как действием и состоянием избранности.
- issue: Значение ἡγίασας в молитвенной речи
  choice: освятивший
  alternative: сделавший святыми; посвятивший
  rationale: «Освятивший» удерживает вместе значения святости и посвящения, не ограничивая глагол только одним из них.
translation_notes:
  register: Современный литературный русский язык с возвышенным молитвенным звучанием. Синтаксический ряд причастий отражает греческую последовательность титулов и деяний. Заглавные буквы в словах «Податель» и «Праведный» отмечают их субстантивированное употребление как божественных наименований; определения «всемогущий» и «вечный» оставлены со строчной буквы внутри единого ряда.
