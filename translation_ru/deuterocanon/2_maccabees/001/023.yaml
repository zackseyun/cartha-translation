  text: And when the sacrifice had been consumed[a], the priests and all the others offered prayer, with Jonathan leading and the rest responding, as in Nehemiah's time.
translation:
  language: ru
  text: 'Когда жертва сгорала, священники и все остальные молились: Ионафан начинал, а прочие отвечали ему — как при Неемии.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как это делал Неемия». Конец греческой фразы сжат, поэтому сравнение с Неемией можно понимать по-разному.'
    reason: alternative_reading
lexical_decisions:
- source_word: προσευχὴν … ἐποιήσαντο
  choice: молились
  rationale: Греческое сочетание буквально означает «совершили молитву»; современное русское «молились» естественно передаёт молитвенное действие и сохраняет торжественный контекст.
- source_word: δαπανωμένης τῆς θυσίας
  choice: когда жертва сгорала
  rationale: Причастие настоящего времени указывает на продолжающееся исчерпание или сгорание жертвы одновременно с молитвой, а не обязательно на действие после её полного сожжения.
- source_word: οἵ τε ἱερεῖς καὶ πάντες
  choice: священники и все остальные
  rationale: Передаёт участие как священников, так и всех прочих присутствующих, не уточняя их состав сверх греческого текста.
- source_word: καταρχομένου Ἰωνάθον
  choice: Ионафан начинал
  rationale: κατάρχομαι здесь обозначает начало или ведение совместного литургического произнесения; «начинал» сохраняет эту семантику без излишней конкретизации.
- source_word: τῶν τε λοιπῶν ἐπιφωνούντων
  choice: прочие отвечали ему
  rationale: ἐπιφωνέω указывает на возглас вслед за начавшим или в ответ ему; русский вариант ясно передаёт характер попеременного произнесения.
- source_word: ὡς Νεεμίου
  choice: как при Неемии
  rationale: Сжатое греческое выражение допускает отнесение сравнения к порядку молитвы, известному со времени Неемии. Формулировка остаётся краткой, а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Значение сжатого сравнения ὡς Νεεμίου
  choice: как при Неемии
  alternative: как это делал Неемия
  rationale: Греческий оборот не уточняет, относится ли сравнение ко времени и установленному порядку при Неемии или непосредственно к его действию. Основной текст выбирает естественное историко-литургическое понимание, а альтернативу сохраняет сноска.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательно-литургическим звучанием. Синтаксис упрощён ради ясности, но одновременность сгорания жертвы и молитвы, попеременное произнесение и неоднозначность упоминания Неемии сохранены.
