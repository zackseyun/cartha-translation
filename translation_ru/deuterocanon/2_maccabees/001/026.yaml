  text: Accept the sacrifice for all your people Israel[a], and preserve your portion and sanctify it.
translation:
  language: ru
  text: Прими жертву за весь твой народ — Израиль, сохрани твой удел[a] и освяти его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «твоим уделом», вероятнее всего, подразумевается Израиль как принадлежащий Богу народ; возможна также более широкая отсылка к земле или святилищу.
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόσδεξαι
  choice: прими
  rationale: Аористный императив προσδέχομαι в молитве выражает просьбу благосклонно принять принесённое; «прими» естественно и точно передаёт эту просьбу.
- source_word: τὴν θυσίαν
  choice: жертву
  rationale: В данном культовом контексте θυσία обозначает именно жертву, а не приношение в более широком смысле.
- source_word: ὑπὲρ παντὸς τοῦ λαοῦ σου Ἰσραήλ
  choice: за весь твой народ — Израиль
  rationale: ὑπέρ передаёт действие ради или от имени всего народа; тире ясно показывает, что «Израиль» является наименованием народа, не меняя смысла греческого текста.
- source_word: διαφύλαξον
  choice: сохрани
  rationale: Глагол означает беречь, охранять и сохранять невредимым; «сохрани» естественно звучит в современной русской молитвенной речи.
- source_word: τὴν μερίδα σου
  choice: твой удел
  rationale: μερίς означает долю или удел. «Твой удел» сохраняет библейскую метафору принадлежности Богу, не подменяя её более истолковывающим словом «наследие».
- source_word: καθαγίασον
  choice: освяти его
  rationale: Глагол означает сделать святым или посвятить как святыню. Местоимение «его» естественно отсылает к стоящему в единственном числе слову «удел».
theological_decisions:
- issue: К чему относится выражение «твой удел»
  choice: В основном тексте референт не уточняется; по ближайшему контексту вероятнее всего имеется в виду народ Израиля как Божий удел.
  alternative: Возможна более широкая отсылка к земле или святилищу.
  rationale: Непосредственно перед этим назван народ Израиля, а образ народа как Божьего удела укоренён в библейской речи. Однако греческий текст прямо не называет референт, поэтому перевод сохраняет метафору и отмечает неоднозначность в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис сделан ясным без архаизмов; ключевые культовые и библейские образы («жертва», «удел», «освяти») сохранены.
