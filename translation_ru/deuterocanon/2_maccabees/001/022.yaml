  yaml_path: translation/deuterocanon/2_maccabees/001/022.yaml
  text: And when this happened and some time had passed[a], and the sun shone out though it was clouded over, a great fire was kindled, so that everyone marveled.
translation:
  language: ru
  text: Когда же это произошло и прошло некоторое время, солнце засияло, хотя небо было затянуто облаками[a]. Тогда разгорелся большой огонь, так что все изумились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда было облачно». Греческое причастное сочетание ἐπινεφὴς ὤν указывает на облачную погоду; в основном тексте оно понято в уступительном смысле: солнце засияло несмотря на облака.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο
  choice: Когда же это произошло
  rationale: Естественная для современного русского повествовательная формула, передающая временной переход без архаического оборота «и было, когда».
- source_word: χρόνος διῆλθεν
  choice: прошло некоторое время
  rationale: Передаёт неопределённый промежуток времени, не уточняя его длительности.
- source_word: ὅ τε ἥλιος ἀνέλαμψεν
  choice: солнце засияло
  rationale: Глагол ἀναλάμπω обозначает внезапное или заметное сияние; «засияло» звучит естественно и сохраняет этот оттенок.
- source_word: ἐπινεφὴς ὤν
  choice: хотя небо было затянуто облаками
  rationale: Греческое причастное сочетание описывает облачность; уступительное прочтение хорошо соответствует контрасту с засиявшим солнцем. Слово «небо» введено ради естественности русского выражения.
- source_word: ἀνήφθη
  choice: разгорелся
  rationale: Пассивный глагол означает, что огонь был зажжён или вспыхнул. «Разгорелся» естественно передаёт возникновение сильного огня, не называя действующего лица.
- source_word: πυρὰ μεγάλη
  choice: большой огонь
  rationale: Прямо передаёт величину πυρά, не сужая значение до погребального костра.
- source_word: ὥστε θαυμάσαι πάντας
  choice: так что все изумились
  rationale: Сохраняет результативную конструкцию и полный охват πάντας; «изумились» уместно для необычайного события.
