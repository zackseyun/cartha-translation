base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/018.yaml
  text: Since we are about to celebrate the purification of the temple on the twenty-fifth of Chasleu[a], we thought it necessary to make this clear to you also, so that you too may celebrate the festival of booths and of the fire, when Nehemiah, after building both the temple and the altar, offered sacrifices.
translation:
  language: ru
  text: Поскольку мы собираемся праздновать очищение храма в двадцать пятый день месяца Хаслев, мы сочли необходимым разъяснить это и вам, чтобы и вы праздновали праздник Кущей и огня[a] — когда Неемия, построив и храм, и жертвенник, принёс жертвы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более истолковательно: «праздник Кущей и праздник огня». В греческом тексте буквально сказано: «Кущей и огня»; вероятно, это указание на памятное событие, рассказ о котором следует далее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μέλλοντες ἄγειν
  choice: Поскольку мы собираемся праздновать
  rationale: Конструкция μέλλω с инфинитивом выражает предстоящее намерение, а ἄγειν в контексте праздника означает «праздновать, отмечать».
- source_word: ἐν τῷ Χασελεὺ πέμπτῃ καὶ εἰκάδι
  choice: в двадцать пятый день месяца Хаслев
  rationale: Передаёт дату естественным русским оборотом; Χασελεύ транслитерировано по греческой форме как «Хаслев».
- source_word: τὸν καθαρισμὸν τοῦ ἱεροῦ
  choice: очищение храма
  rationale: καθαρισμός означает очищение, а ἱερόν здесь обозначает храм; перевод не подменяет очищение толковательным «освящением».
- source_word: δέον ἡγησάμεθα διασαφῆσαι ὑμῖν
  choice: мы сочли необходимым разъяснить это и вам
  rationale: Сохраняются как осознанное суждение ἡγησάμεθα, так и значение необходимости δέον; διασαφῆσαι передано глаголом «разъяснить».
- source_word: ἵνα καὶ αὐτοὶ ἄγητε
  choice: чтобы и вы праздновали
  rationale: 'καὶ αὐτοί выражает включение адресатов: «и вы»; повторное ἄγητε имеет празднично-обрядовое значение.'
- source_word: σκηνοπηγίας
  choice: праздник Кущей
  rationale: Устоявшееся и понятное русское название иудейского праздника сохраняет образ кущ, заложенный в σκηνοπηγία.
- source_word: καὶ τοῦ πυρός
  choice: и огня
  rationale: Буквально сохраняет краткую и неоднозначную генитивную конструкцию греческого текста, не превращая её безоговорочно в отдельный «праздник огня».
- source_word: ὅτε Νεεμίας
  choice: в память о том времени, когда Неемия
  rationale: ὅτε вводит вспоминаемое историческое событие; «в память» делает связь с празднованием естественной по-русски, хотя это контекстуальное уточнение.
- source_word: ὁ οἰκοδομήσας τό τε ἱερὸν καὶ τὸ θυσιαστήριον
  choice: построив храм и жертвенник
  rationale: Аористное причастие естественно передаётся русским деепричастием и обозначает действие, предшествующее принесению жертв.
- source_word: ἀνήνεγκεν θυσίας
  choice: принёс жертвы
  rationale: ἀναφέρω в жертвенном контексте означает приносить жертву; русский оборот идиоматичен и точно передаёт культовое действие.
theological_decisions:
- issue: Передача σκηνοπηγίας
  choice: праздник Кущей
  alternative: праздник шалашей
  rationale: Устоявшееся русское название остаётся доступным современному читателю и сохраняет иудейскую праздничную образность без конфессионального истолкования.
- issue: Передача καὶ τοῦ πυρός
  choice: и огня
  alternative: и праздник огня
  rationale: Греческая формулировка сжата и допускает разные синтаксические понимания. Основной текст сохраняет её неоднозначность, а примечание сообщает более истолковательный вариант.
- issue: Связь ὅτε Νεεμίας с предшествующим упоминанием праздника
  choice: в память о том времени, когда Неемия
  alternative: когда Неемия
  rationale: Добавление показывает естественную смысловую связь исторического эпизода с памятным празднованием, не утверждая дополнительного богословского положения; буквальная связь остаётся отражена в примечании к неоднозначному «огню».
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. Синтаксис слегка упрощён ради ясности; традиционное «Кущей» сохранено как общеупотребительное название праздника. Маркер [a] поставлен непосредственно после неоднозначного выражения.
