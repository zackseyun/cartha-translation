  yaml_path: translation/deuterocanon/2_maccabees/001/032.yaml
  text: And when this happened[a], a flame was kindled; and when the light from the altar shone forth[b], it was consumed.
translation:
  language: ru
  text: Когда это произошло, вспыхнуло пламя; и когда от жертвенника вспыхнул свет[a], оно было поглощено[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «засиял в ответ» или «заблистал». Греческий глагол может обозначать ответное или отражённое сияние.'
    reason: lexical_alternative
  - marker: b
    text: В греческом глагол «было поглощено» употреблён без названного подлежащего. Его можно отнести к пламени; возможно также, что имеются в виду горючее, жертва или, с учётом более широкого контекста, вылитая жидкость.
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς δὲ τοῦτο ἐγενήθη
  choice: Когда это произошло
  rationale: ὡς с аористом вводит придаточное времени. Формулировка естественно передаёт последовательность событий, не добавляя идеи немедленности.
- source_word: φλὸξ ἀνήφθη
  choice: вспыхнуло пламя
  rationale: φλόξ означает «пламя», а пассивный аорист ἀνήφθη — «было зажжено, возгорелось». Русское «вспыхнуло пламя» кратко и естественно передаёт возникновение огня.
- source_word: ἀπὸ τοῦ θυσιαστηρίου
  choice: от жертвенника
  rationale: Предлог ἀπό обозначает исходную точку, а θυσιαστήριον — жертвенник; перевод сохраняет образ света, исходящего от жертвенника.
- source_word: ἀντιλάμψαντος φωτός
  choice: когда свет … засиял в ответ
  rationale: Родительный самостоятельный оборот передан придаточным времени. ἀντιλάμπω может означать ответное или отражённое сияние; «засиял в ответ» сохраняет оттенок приставки ἀντι-, не уточняя природу этого ответа.
- source_word: ἐδαπανήθη
  choice: оно иссякло
  rationale: Пассив δαπανάω означает «было израсходовано, истощилось, иссякло». Местоимение соотнесено с ближайшим существительным «пламя», однако отсутствие названного подлежащего в греческом отмечено в сноске.
theological_decisions:
- issue: К чему относится ἐδαπανήθη («иссякло/было поглощено»)
  choice: В основном тексте подразумевается ранее названное пламя.
  alternative: Подразумеваются горючее или жертва либо, с учётом более широкого контекста, вылитая жидкость.
  rationale: В греческом у ἐδαπανήθη нет явно названного подлежащего. Ближайший возможный референт — φλόξ («пламя»), но синтаксис не исключает иных контекстуальных толкований, поэтому неоднозначность указана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Жертвенник» сохраняет традиционный сакральный термин, оставаясь понятным; остальная лексика проста и современна. Союз «и» передаёт продолжение повествования без навязывания резкого противопоставления.
