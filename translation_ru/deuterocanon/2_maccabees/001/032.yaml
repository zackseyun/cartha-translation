  naturalness: «Свет от жертвенника засиял в ответ» понятно, но в русском звучит несколько искусственно, поскольку не названо, кому или чему свет отвечает. «От жертвенника вспыхнул свет» естественнее для повествовательного контекста; оттенок ἀντι- можно оставить в примечании как вариант.
  terminology: «Жертвенник» — точный и уместный традиционный термин. «Пламя» также точно. Формулировку о возможных референтах ἐδαπανήθη следует не представлять как установленное отнесение к пламени, поскольку греческий текст не называет подлежащего, а контекст допускает и иное понимание.
