base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/019.yaml
  text: For when our fathers were being led away into Persia[a], the devout priests took some of the fire from the altar and secretly hid it in the hollow of a dry well, where they secured it so that the place would be unknown to everyone.
translation:
  language: ru
  text: Ибо когда наших отцов уводили в Персию[a], благочестивые священники, взяв немного огня с жертвенника, тайно спрятали его в полости безводного колодца и тщательно обезопасили это место, так что оно осталось неизвестным всем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переселяли в Персию». Греческий глагол может означать, что людей уводили или насильственно отправляли в изгнание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγοντο
  choice: уводили
  rationale: Имперфект пассива от ἄγω в данном контексте обозначает насильственное переселение предков в изгнание; «уводили» сохраняет образ движения и не вводит более узкого административного термина.
- source_word: Περσικὴν
  choice: в Персию
  rationale: Субстантивированное прилагательное обозначает персидскую землю; название страны естественно передаёт географическую отсылку по-русски.
- source_word: εὐσεβεῖς
  choice: благочестивые
  rationale: Слово выражает религиозную преданность и верность; «благочестивые» уместно в достоинном библейском регистре и понятно современному читателю.
- source_word: λαβόντες ἀπὸ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: взяв немного огня с жертвенника
  rationale: 'Конструкция указывает на источник. Добавление «немного» естественно выражает партитивный смысл: священники взяли часть жертвеннического огня.'
- source_word: λαθραίως
  choice: тайно
  rationale: Наречие обозначает действие, совершённое скрытно; «тайно» передаёт это кратко и естественно.
- source_word: κοιλώματι φρέατος τάξιν ἔχοντος ἀνύδρου
  choice: в полости безводного колодца
  rationale: κοιλώματι означает углубление или полость, а определительный оборот описывает колодец как лишённый воды. «Безводного» точнее сохраняет явное значение ἀνύδρου, чем просто «сухого».
- source_word: κατησφαλίσαντο
  choice: надёжно укрыли там
  rationale: Средняя форма выражает принятие мер к тому, чтобы спрятанное оставалось в безопасности. В контексте сокрытия огня «надёжно укрыли» звучит естественнее буквального «обезопасили».
- source_word: ὥστε πᾶσιν ἄγνωστον εἶναι τὸν τόπον
  choice: так что это место осталось никому не известным
  rationale: Оборот ὥστε допускает оттенок результата; перевод сохраняет формальную неизвестность места для всех и естественен по-русски.
theological_decisions:
- issue: Историческое обозначение изгнания
  choice: когда наших отцов уводили в Персию
  alternative: когда наших отцов переселяли в Персию
  rationale: «Уводили» сохраняет пассивность и принудительный характер происходящего, не превращая контекстуальный смысл изгнания в технический термин, которого в греческом тексте нет.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис слегка сглажен ради ясности, но последовательность действий и неоднозначность оборота ὥστε сохранены; конфессионально маркированная терминология не вводилась.
