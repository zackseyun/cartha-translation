  yaml_path: translation/deuterocanon/2_maccabees/001/013.yaml
  text: For when the leader and the force around him that seemed to be invincible had entered[a], they were cut down in the temple of Nanaia[b], because the priests of Nanaia had used deceit.
translation:
  language: ru
  text: Ибо, когда предводитель и находившееся при нём войско, казавшееся непобедимым, вошли[a] в храм Нанаии, их изрубили с помощью обмана, к которому прибегли жрецы Нанаии.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «когда предводитель оказался там вместе с находившимся при нём войском». Вхождение в храм следует из контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их изрубили в храме Нанаии вследствие обмана, к которому прибегли жрецы Нанаии». Греческий оборот допускает оттенок средства или причины.'
    reason: source_ambiguity
lexical_decisions:
- source_word: γενόμενος
  choice: когда … вошли
  rationale: Буквальное «став/оказавшись» здесь неестественно; контекст указывает на прибытие и вход в храм. Множественное «вошли» согласует предводителя с сопровождавшим его войском.
- source_word: ὁ ἡγεμών
  choice: предводитель
  rationale: Передаёт широкое значение ἡγεμών и не приписывает лицу более конкретную административную должность.
- source_word: ἡ περὶ αὐτὸν … δύναμις
  choice: находившееся при нём войско
  rationale: δύναμις имеет военное значение, а περὶ αὐτόν обозначает сопровождавших предводителя людей; «войско» естественно по-русски и сохраняет коллективный смысл.
- source_word: ἀνυπόστατος δοκοῦσα εἶναι
  choice: казавшееся непобедимым
  rationale: Сохраняет δοκοῦσα — лишь видимость непобедимости — и передаёт ἀνυπόστατος как силу, которой, по впечатлению, невозможно противостоять.
- source_word: κατεκόπησαν
  choice: их изрубили
  rationale: Передаёт резкое и насильственное значение κατακόπτω точнее, чем нейтральное «убили», не расширяя образ до буквального расчленения.
- source_word: ἐν τῷ τῆς Ναναίας ἱερῷ
  choice: в храме Нанаии
  rationale: ἱερόν здесь естественно означает храм; имя богини передано транслитерацией и склоняется по нормам русского языка.
- source_word: παραλογισμῷ χρησαμένων
  choice: прибегли к обману
  rationale: Генитив абсолютный выражает сопутствующее обстоятельство, средство или причину; формулировка естественно передаёт применение обмана, не уточняя его форму.
- source_word: τῶν περὶ τὴν Ναναίαν ἱερέων
  choice: жрецы Нанаии
  rationale: В контексте языческого культа «жрецы» точнее русского «священники»; оборот περὶ τὴν Ναναίαν обозначает служителей, связанных с культом Нанаии.
