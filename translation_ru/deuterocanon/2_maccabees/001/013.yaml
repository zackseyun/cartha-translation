  source_fidelity: 'Смысл в целом передан точно: предводитель и сопровождавшее его войско, считавшееся непобедимым, были жестоко убиты в храме Нанаии; обман жрецов является обстоятельством, объясняющим расправу. Однако тире в черновике соединяет две самостоятельные части слишком рыхло и не выражает достаточно ясно причинно-инструментальную связь греческого генитива абсолютного. Перенос указания на храм к глаголу «вошли» делает подразумеваемый контекстом вход ясным, сохраняя сноску о том, что это не буквальная форма глагола γενόμενος.'
