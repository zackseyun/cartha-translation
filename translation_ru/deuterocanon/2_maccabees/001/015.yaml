  yaml_path: translation/deuterocanon/2_maccabees/001/015.yaml
  text: And when the priests of Nanea had set these things out[a], and he had come with a few men into the enclosure of the temple precinct, they shut the temple as soon as Antiochus entered.
translation:
  language: ru
  text: Когда жрецы Нанеи[a] выставили всё это и он с немногими людьми вошёл в ограждённое пространство священного участка, они заперли храм, как только Антиох вошёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое имя в форме Ναναίου также передают как «Наная»; в основном тексте сохранена форма «Нанея», близкая к данному греческому свидетельству.
    reason: lexical_alternative
lexical_decisions:
- source_word: προθεμένων
  choice: выставили
  rationale: Передаёт конкретное действие — предметы были положены на виду или представлены, — не уточняя сверх текста, что именно это были за предметы.
- source_word: αὐτά
  choice: всё это
  rationale: Сохраняет неопределённую отсылку местоимения к предметам, упомянутым в контексте, не вводя отсутствующего в стихе существительного.
- source_word: τῶν ἱερέων τοῦ Ναναίου
  choice: жрецы Нанеи
  rationale: Для служителей языческого божества естественно современное русское «жрецы»; имя передано близко к форме греческого свидетельства Ναναίου.
- source_word: προσελθόντος
  choice: вошёл
  rationale: В данном пространственном контексте причастие описывает прибытие внутрь ограды; «вошёл» ясно передаёт последовательность и не создаёт впечатления, будто он лишь приблизился.
- source_word: μετʼ ὀλίγων
  choice: с немногими людьми
  rationale: «Людьми» умеренно восполняет подразумеваемых спутников, а «немногими» сохраняет количественную сдержанность греческого выражения.
- source_word: περίβολον τοῦ τεμένους
  choice: ограду священного участка
  rationale: 'Сохраняет два пространственных понятия: περίβολος как ограждённое пространство или ограда и τέμενος как посвящённый божеству участок; не смешивает их с последующим ἱερόν.'
- source_word: συγκλείσαντες τὸ ἱερόν
  choice: они заперли храм
  rationale: «Заперли» естественно передаёт закрытие с целью удержать вошедшего внутри; «храм» здесь отличён от окружающего священного участка.
- source_word: ὡς εἰσῆλθεν
  choice: как только ... вошёл
  rationale: Передаёт временное значение ὡς с аористом и непосредственность действия.
- source_word: Ἀντίοχος
  choice: Антиох
  rationale: Традиционная и общеупотребительная русская форма имени.
