    text: 'Или: «очистили приношения». Греческое слово обозначает жертвы или жертвенные приношения, а глагол — их ритуальное очищение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερὸν ἐγενήθη τὸ πρᾶγμα
  choice: это дело стало известно
  rationale: Передаёт переход события в гласность; «дело» сохраняет широкий смысл πρᾶγμα.
- source_word: διηγήθη τῷ βασιλεῖ τῶν Περσῶν
  choice: царю персов донесли
  rationale: Естественная русская передача безличного пассива в контексте официального сообщения царю.
- source_word: οἱ μεταχθέντες ἱερεῖς
  choice: уведённые в плен священники
  rationale: Причастие означает священников, насильно переселённых со своей земли; контекст указывает на плен, но не требует более специального термина «депортированные».
- source_word: τὸ πῦρ ἔκρυψαν ... τὸ ὕδωρ ἐφάνη
  choice: спрятали огонь, появилась вода
  rationale: Сохраняется резкое повествовательное противопоставление спрятанного огня и появившейся воды.
- source_word: ἀφ' οὗ
  choice: которой
  rationale: Ближайший антецедент — вода; творительный падеж естественно выражает средство очищения.
- source_word: οἱ περὶ τὸν Νεεμίαν
  choice: Неемия и бывшие с ним
  rationale: Естественно передаёт греческую идиому, обозначающую Неемию вместе с его окружением.
- source_word: ἥγνισαν τὰς θυσίας
  choice: очистили жертвы
  rationale: Сохраняет культовый смысл очищения, не заменяя его более узким понятием освящения.
theological_decisions:
- issue: Культовый смысл ἥγνισαν τὰς θυσίας
  choice: очистили жертвы
  alternative: освятили жертвы
  rationale: «Очистили» непосредственно передаёт значение ритуального очищения и не вносит дополнительной богословской конкретизации.
- issue: Референт ἀφ' οὗ
  choice: 'местоимение отнесено к воде: «которой»'
  alternative: 'понимать оборот темпорально: «после чего»'
  rationale: Ближайший грамматический антецедент — τὸ ὕδωρ; контекст также указывает на использование воды при очищении жертв.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Безличный греческий пассив передан естественным оборотом «донесли». Конечная запятая сохранена, поскольку греческое предложение продолжается в следующем стихе.
