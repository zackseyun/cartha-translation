base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/021.yaml
  text: When they reported to us that they had found no fire[a], but thick water, he ordered them to draw some out and bring it. Then, when the things for the sacrifices had been brought forward[b], Nehemiah ordered the priests to sprinkle the water on both the wood and what was laid on it.
translation:
  language: ru
  text: Когда они сообщили нам, что нашли не огонь, а густую воду[a], он велел им зачерпнуть её и принести. Когда же были принесены предметы для жертвоприношений[b], Неемия велел священникам окропить этой водой дрова и то, что было на них положено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плотную воду», «густую жидкость». Греческое выражение необычно; оно передано близко к буквальному смыслу, поскольку необычные свойства найденного вещества важны для рассказа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «то, что относится к жертвам» — эллиптическое обозначение предметов, связанных с жертвоприношениями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διεσάφησαν
  choice: сообщили
  rationale: Глагол означает «ясно изложили, сообщили». В русском повествовании «сообщили» естественно вводит содержание доклада, не добавляя отсутствующего в тексте оттенка.
- source_word: μὴ εὑρηκέναι πῦρ ἀλλὰ ὕδωρ παχύ
  choice: нашли не огонь, а густую воду
  rationale: Сохранены противопоставление и необычное буквальное описание ὕδωρ παχύ, существенное для дальнейшего рассказа.
- source_word: ἀποβλίψαντας
  choice: зачерпнуть её
  rationale: Причастие обозначает извлечение части жидкости из углубления или хранилища; «зачерпнуть» ясно и естественно передаёт действие.
- source_word: ἀνηνέχθη τὰ τῶν θυσιῶν
  choice: всё необходимое для жертвоприношений было принесено
  rationale: Греческое выражение эллиптично — буквально «то, что относится к жертвам». Перевод передаёт принадлежность предметов к приготовлению жертв, не утверждая, что жертвоприношение уже совершилось.
- source_word: ἐπιρᾶναι
  choice: окропить
  rationale: В данном обрядовом контексте глагол означает нанесение жидкости на дрова и лежащую на них жертву; «окропить» уместно по регистру и не требует уточнения количества.
- source_word: τά τε ξύλα καὶ τὰ ἐπικείμενα
  choice: и дрова, и то, что было на них положено
  rationale: Передана намеренная обобщённость τὰ ἐπικείμενα без добавления прямо не названных жертвенных частей.
theological_decisions:
- issue: Передача имени Νεεμίας
  choice: Неемия
  alternative: Неемия́ / Нехемия
  rationale: Использована традиционная и узнаваемая русская библейская форма имени; решение не устраняет и не добавляет богословской идентификации персонажа.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис сделан естественным для широкого читателя; необычность «густой воды» и неопределённость выражений о жертвенных предметах сохранены.
