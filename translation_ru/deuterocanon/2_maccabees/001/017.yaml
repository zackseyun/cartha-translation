  text: Blessed in every way is our God[a], who gave up those who acted wickedly.
translation:
  language: ru
  text: Во всём благословен наш Бог, который предал тех, кто поступил нечестиво.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или более буквально: «дал тех, кто поступил нечестиво». Кому именно они были отданы, в греческом тексте не сказано.'
    reason: Лексическая альтернатива и сохранение невыраженного получателя при ἔδωκεν.
lexical_decisions:
- source_word: κατὰ πάντα
  choice: во всём
  rationale: Наречное выражение усиливает εὐλογητός и передаёт всеохватность похвалы, сохраняя краткость и торжественность греческой фразы.
- source_word: εὐλογητὸς
  choice: благословен
  rationale: Традиционное и понятное обозначение Бога как достойного благословения и хвалы; сохраняет молитвенно-литургический регистр.
- source_word: ἡμῶν ὁ θεός
  choice: наш Бог
  rationale: Естественная русская передача греческой притяжательной конструкции без утраты выраженного ею отношения общины к Богу.
- source_word: ἔδωκεν
  choice: предал
  rationale: В данном контексте глагол, вероятнее всего, означает передачу врагов во власть других, на поражение или суд. «Предал» выражает это значение, не добавляя в основной текст не названного по-гречески получателя.
- source_word: τοὺς ἀσεβήσαντας
  choice: тех, кто поступил нечестиво
  rationale: Аористное причастие указывает на совершённый нечестивый поступок, а не обязательно на постоянное качество людей; такая передача сохраняет событийный оттенок и религиозно-нравственный смысл.
theological_decisions:
- issue: Смысл Божьего действия в ἔδωκεν при личном дополнении
  choice: Бог предал поступивших нечестиво на суд или поражение, причём получатель не назван.
  alternative: Бог буквально «дал» этих людей кому-либо, подразумеваемому из контекста.
  rationale: Контекст благодарения за избавление поддерживает значение передачи противников во власть или на поражение, однако греческий текст оставляет получателя невыраженным. Поэтому он не добавлен в перевод, а буквальная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным молитвенным звучанием. Синтаксис остаётся ясным для широкого читателя; буквальная недосказанность греческого глагола пояснена в сноске.
