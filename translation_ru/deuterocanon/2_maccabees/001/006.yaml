lexical_decisions:
- source_word: Καὶ νῦν
  choice: И теперь
  rationale: Передаёт соединительное καί и временное νῦν естественным современным русским оборотом.
- source_word: ὧδε ἐσμεν
  choice: мы здесь
  rationale: ὧδε понято как наречие места «здесь», а простая связка ἐσμεν не получает дополнительного смыслового расширения.
- source_word: προσευχόμενοι
  choice: и молимся
  rationale: Причастие настоящего времени обозначает продолжающееся действие, сопутствующее состоянию «мы здесь»; личная форма с союзом звучит по-русски естественнее буквального «молящиеся».
- source_word: περὶ ὑμῶν
  choice: о вас
  rationale: При глаголе молитвы περί с родительным естественно передаётся по-русски как «молиться о ком-либо».
