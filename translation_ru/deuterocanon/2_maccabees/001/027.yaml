base_translation:
  language: en
  yaml_path: translation/deuterocanon/2_maccabees/001/027.yaml
  text: Gather our dispersed people[a], free those enslaved among the nations, look upon those who are despised and abhorred; and let the nations know that you are our God.
translation:
  language: ru
  text: Собери наш рассеянный народ[a], освободи тех, кто в рабстве среди народов, обрати взор на тех, кого презирают и кем гнушаются; и пусть народы узнают, что Ты — Бог наш.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наше рассеяние». Здесь имеются в виду люди рассеянной общины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισυνάγαγε
  choice: Собери
  rationale: Повелительная форма выражает просьбу к Богу собрать воедино рассеянных; приставочное значение естественно передаётся самим контекстом и дополнением.
- source_word: τὴν διασπορὰν ἡμῶν
  choice: рассеянный народ наш
  rationale: 'Буквально: «наше рассеяние». Здесь существительное метонимически обозначает рассеянную общину, которую можно собрать; явное «народ» делает смысл естественным по-русски.'
- source_word: ἐλευθέρωσον
  choice: освободи
  rationale: Точно передаёт просьбу даровать свободу и сохраняет конкретный смысл избавления от неволи.
- source_word: τοὺς δουλεύοντας
  choice: тех, кто в рабстве
  rationale: Глагол δουλεύω здесь указывает на подневольное состояние, а не просто на служение; формулировка сохраняет силу образа рабства.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди народов
  rationale: ἔθνη обозначает окружающие народы; этот вариант нейтрален и не вносит более узкого конфессионально окрашенного «язычники».
- source_word: τοὺς ἐξουθενημένους
  choice: тех, кого презирают
  rationale: Пассивное причастие обозначает людей, с которыми обращаются как с ничтожными; русская конструкция ясно сохраняет пассивный смысл.
- source_word: καὶ βδελυκτοὺς
  choice: и кем гнушаются
  rationale: Передаёт сильное отвращение, выраженное βδελυκτός, и синтаксически относится к тем же людям.
- source_word: ἔφιδε
  choice: призри
  rationale: Молитвенное «призри» точно передаёт «обрати взор, воззри на» и сохраняет достоинство регистра; оно не добавляет прямо не выраженного значения «окажи милость».
- source_word: γνώτωσαν
  choice: пусть народы узнают
  rationale: Передаёт повелительно-желательное значение аориста как молитвенную просьбу о том, чтобы народы пришли к знанию.
- source_word: ὅτι σὺ ὁ θεὸς ἡμῶν
  choice: что Ты — Бог наш
  rationale: Сохраняет прямое именное сказуемое и акцент на местоимении σύ; традиционно уместное написание «Ты» поддерживает молитвенное обращение без изменения смысла.
theological_decisions:
- issue: Значение выражения «наше рассеяние»
  choice: 'Понято метонимически как сам рассеянный народ: «рассеянный народ наш».'
  alternative: «наше рассеяние» / «нашу диаспору»
  rationale: Глагол «собери» предполагает людей как объект действия. При этом сноска сохраняет буквальную форму греческого текста и не скрывает метонимию.
- issue: Смысл δουλεύοντας
  choice: 'Сохранено значение рабства: «тех, кто в рабстве».'
  alternative: «тех, кто служит» / «находящихся в подчинении»
  rationale: В контексте рассеяния и угнетения речь идёт о несвободном, подневольном состоянии; смягчение до общего «служат» ослабило бы исходный смысл.
- issue: Сила глагола ἔφιδε
  choice: «призри» — просьба обратить взор на униженных.
  alternative: «окажи милость» / «благоволи»
  rationale: Исходный глагол прямо означает взгляд или внимание; более явное обещание благоволения было бы истолкованием сверх текста.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Слово «призри» сохранено как понятное в библейско-молитвенном регистре; остальная синтаксика современна и прозрачна. Пунктуация удерживает последовательность трёх прошений и заключительное пожелание.
