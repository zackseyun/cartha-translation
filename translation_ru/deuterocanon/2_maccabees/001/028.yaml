  source_fidelity: «Подвергни мучению» точно передаёт сильный императив βάσανισον, не сводя его к конкретной форме пытки. «Тех, кто угнетает нас» естественно выражает καταδυναστεύοντας; «надменно издевается над нами» передаёт оскорбительно-дерзкий характер ἐξυβρίζοντας. Неявный в греческом объект «нас» оправдан ближайшим контекстом общей молитвы и согласуется с английским аудиторским решением. Наречие «надменно» удачно выражает ἐν ὑπερηφανίᾳ без лишнего притяжательного местоимения.
  naturalness: Текст грамматически корректен, ясен и выдержан в современном литературном молитвенно-торжественном регистре. Формулировка «Подвергни мучению» несколько книжна, но в данном жанре естественна и уместна; менять её на более разговорное «мучи» не требуется.
  terminology: Термины «угнетает», «издевается» и «надменно» семантически согласованы с греческим текстом. Сноска привязана корректно и добросовестно указывает допустимые более мягкие варианты для βασανίζω, не выдавая их за основной текст.
