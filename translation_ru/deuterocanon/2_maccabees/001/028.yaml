  text: Подвергни мучению тех, кто угнетает нас и надменно издевается над нами;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Порази» или «накажи тех, кто угнетает нас и с высокомерием надругается над нами».'
    reason: Лексические варианты для βάσανισον, ἐξυβρίζοντας и ἐν ὑπερηφανίᾳ.
lexical_decisions:
- source_word: βάσανισον
  choice: Подвергни мучению
  rationale: Аористный императив βασανίζω выражает просьбу к Богу причинить жестокое страдание как кару. Такой перевод сохраняет силу греческого глагола, но не сужает его значения до конкретного способа пытки.
- source_word: τοὺς καταδυναστεύοντας
  choice: тех, кто угнетает нас
  rationale: Причастие обозначает злоупотребление властью и притеснение. «Угнетает» естественно передаёт это значение; объект «нас» восстановлен из контекста общей молитвы.
- source_word: ἐξυβρίζοντας
  choice: надменно издевается над нами
  rationale: Глагол выражает оскорбительное, дерзкое и унизительное обращение. «Издевается над нами» передаёт направленное на людей надругательство, а «надменно» отражает вызывающий характер действия.
- source_word: ἐν ὑπερηφανίᾳ
  choice: надменно
  rationale: Оборот описывает гордыню и высокомерие как образ действия. Наречие делает русский текст естественным и не вводит отсутствующего в греческом притяжательного местоимения.
theological_decisions:
- issue: Неявный объект обоих причастий
  choice: Восстановить «нас» при обоих действиях
  alternative: Оставить объект невыраженным или добавить его только при втором глаголе
  rationale: Контекст общей молитвы указывает на молящуюся общину как объект притеснения и надругательства. В русском языке явное «нас» обеспечивает ясность и не добавляет нового богословского утверждения.
- issue: Характер просьбы βάσανισον
  choice: Сохранить сильную просьбу о мучительной каре
  alternative: Смягчить до «накажи» или «порази»
  rationale: Смягчение устранило бы напряжённость исходной молитвы. Перевод сохраняет суровость формулировки, не уточняя способ исполнения кары.
translation_notes:
  register: Современный литературный русский язык с молитвенно-торжественным, но понятным строем. Синтаксис сделан естественным для русского; сила суровой просьбы оригинала сохранена.
