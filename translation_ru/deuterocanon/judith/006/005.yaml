  text: But you[a], Achior, hireling of Ammon, who spoke these words in the day of your injustice[b], shall no longer see my face from this day until I take vengeance
translation:
  language: ru
  text: А ты, Ахиор, наёмник[a] Аммона, произнёсший эти слова в день твоей несправедливости[b], с этого дня больше не увидишь моего лица, пока я не отомщу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «работник за плату»; в данном военном контексте возможно также: «наёмный воин».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «в день твоей несправедливости» можно также понять как «в день твоего неправого поступка» или «во время твоей вины».
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτέ
  choice: наёмник
  rationale: Слово обозначает человека, служащего за плату. «Наёмник» сохраняет уничижительную силу обращения и подходит к военному контексту, не уточняя сверх греческого текста характер его службы.
- source_word: τοῦ Ἀμμών
  choice: Аммона
  rationale: Родительный падеж передан прямо как принадлежность или связь с Аммоном, без преобразования в этноним «аммонитянин».
- source_word: ἐλάλησας τοὺς λόγους τούτους
  choice: произнёсший эти слова
  rationale: Передаёт явную отсылку к предшествующей речи Ахиора и естественно звучит в торжественном обвинительном обращении.
- source_word: ἐν ἡμέρᾳ ἀδικίας σου
  choice: в день твоей неправды
  rationale: 'Сохраняет необычную временную конструкцию и смысловую широту ἀδικία: несправедливость, неправота или дурной поступок.'
- source_word: οὐκ ὄψῃ ἔτι τὸ πρόσωπόν μου
  choice: больше не увидишь моего лица
  rationale: Сохранён исходный образ видения лица, естественный и понятный по-русски.
- source_word: ἀπὸ τῆς ἡμέρας ταύτης
  choice: с этого дня
  rationale: Прямой и естественный перевод временного оборота.
- source_word: ἕως οὗ ἐκδικήσω
  choice: пока я не отомщу
  rationale: Кратко и точно передаёт действие возмездия, не добавляя отсутствующий в данном фрагменте объект мести.
theological_decisions:
- issue: Значение ἀδικία в обвинении правителя
  choice: неправда
  alternative: несправедливость; беззаконие; дурной поступок
  rationale: «Неправда» сохраняет морально-правовую неоднозначность греческого слова и не усиливает его до более богословски окрашенного «беззакония».
- issue: Временной оборот ἕως οὗ ἐκδικήσω
  choice: пока я не отомщу
  alternative: до тех пор, пока я не совершу возмездие
  rationale: 'Сохранено буквальное временное отношение, включая возможное смысловое напряжение: текст не разъясняет, что произойдёт после возмездия.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, обвинительным тоном прямой речи. Порядок слов слегка возвышенный, но понятный; необычность выражения «в день твоей неправды» сохранена намеренно.
