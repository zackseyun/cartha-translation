lexical_decisions:
- source_word: παρέλαβεν
  choice: взял
  rationale: Глагол здесь означает, что Озия взял человека с собой и повёл из одного места в другое.
- source_word: ἐκ τῆς ἐκκλησίας
  choice: из собрания
  rationale: В данном повествовательном контексте ἐκκλησία — собравшаяся община, а не «церковь» в позднейшем христианском смысле.
- source_word: εἰς οἶκον ἑαυτοῦ
  choice: к себе в дом
  rationale: Естественно передаёт направление движения и значение собственного жилища Озии.
- source_word: ἐποίησεν πότον
  choice: устроил пир
  rationale: Буквально выражение связано с питьём, но идиоматически обозначает устроенное угощение или пир; русский вариант сохраняет смысл без неестественного буквализма.
- source_word: τοῖς πρεσβυτέροις
  choice: для старейшин
  rationale: Речь идёт о признанных руководителях общины, а не просто о пожилых мужчинах.
- source_word: ἐπεκαλέσαντο
  choice: призывали
  rationale: Средняя форма обозначает молитвенное обращение к Богу; «призывали Бога… на помощь» естественно передаёт этот смысл.
- source_word: τὸν θεὸν Ἰσραήλ
  choice: Бога Израиля
  rationale: Прямое и традиционное обозначение Бога, принадлежащего Израилю и почитаемого им.
- source_word: εἰς βοήθειαν
  choice: на помощь
  rationale: Передаёт цель молитвенного призывания — просьбу о Божьей помощи.
- source_word: ὅλην τὴν νύκτα ἐκείνην
  choice: всю ту ночь
  rationale: Точно и естественно выражает продолжительность действия на протяжении всей ночи.
