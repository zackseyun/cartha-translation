  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεσόντες
  choice: пал ниц
  rationale: Аористное причастие передаёт предшествующее физическое действие; выражение «пал ниц» естественно обозначает принятую в благоговении позу, не сливая его с последующим глаголом поклонения.
- source_word: ὁ λαός
  choice: народ
  rationale: Обычное соответствие коллективному существительному λαός; единственное число сохранено в первой части фразы.
- source_word: προσεκύνησαν
  choice: поклонился
  rationale: При указании на Бога глагол означает религиозное поклонение; русское «поклонился Богу» передаёт это прямо и естественно.
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный падеж передаёт объект поклонения; определённый артикль отдельно по-русски не выражается.
- source_word: ἐβόησαν
  choice: громко воззвали
  rationale: Глагол обозначает сильный, слышимый крик или призыв. «Громко воззвали» сохраняет интенсивность и торжественный контекст молитвенного обращения.
- source_word: λέγοντες
  choice: двоеточие
  rationale: Причастие вводит содержание возгласа, следующее в следующем стихе; в современном русском это естественно и без потери смысла передаётся двоеточием.
