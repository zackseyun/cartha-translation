  terminology: «Пал ниц», «поклонился Богу» и «громко воззвал» точно передают благоговейную позу, религиозное поклонение и интенсивность ἐβόησαν. Конечное двоеточие уместно, поскольку λέγοντες вводит прямую речь следующего стиха.
