lexical_decisions:
- source_word: ὑποδύσαντες ὑποκάτω τοῦ ὄρους
  choice: спустившись к месту под горой
  rationale: Передаёт движение вниз и положение ниже горы, не создавая ошибочного впечатления, будто они оказались внутри или непосредственно под горой.
- source_word: ἔδησαν
  choice: связали
  rationale: Обычное и точное соответствие δέω в значении физически связать человека.
- source_word: ἀφῆκαν ἐρριμμένον
  choice: оставили его лежать
  rationale: Естественно передаёт конструкцию со значением оставления Ахиора в данном состоянии; более сильный оттенок предшествующего броска сохранён в сноске.
- source_word: ὑπὸ τὴν ῥίζαν τοῦ ὄρους
  choice: у подножия горы
  rationale: ῥίζα буквально означает «корень», но в топографическом употреблении обозначает основание, или подножие, горы.
- source_word: ἀπῴχοντο
  choice: ушли
  rationale: Кратко и естественно передаёт удаление действующих лиц.
- source_word: πρὸς τὸν κύριον αὐτῶν
  choice: к своему господину
  rationale: κύριος здесь обозначает человеческого повелителя; «господин» сохраняет смысл подчинённости без божественной капитализации.
- source_word: τὸν Ἀχιὼρ
  choice: Ахиора
  rationale: Традиционная русская передача личного имени с требуемым по синтаксису винительным падежом.
theological_decisions:
- issue: κύριος как обозначение человеческого начальника, а не Бога
  choice: своему господину
  alternative: своему повелителю
  rationale: Контекст однозначно указывает на человеческого начальника. Строчная буква и притяжательное местоимение ясно отличают это употребление от божественного титула.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Союз «а сами» естественно подчёркивает смену действия и субъекта; топографические выражения переданы идиоматично, без буквального «корня горы».
