  source_fidelity: 'В целом смысл передан точно: Ахиора связывают, оставляют у основания горы, а затем уходят к своему человеческому господину. Однако «к месту под горой» добавляет не выраженное в греческом «место» и звучит искусственно. «Спустившись под гору» естественнее и ближе к ὑποδύσαντες ὑποκάτω τοῦ ὄρους. Причастие ἐρριμμένον в основном тексте несколько ослаблено словом «лежать», но существенный оттенок оставления после броска корректно отмечен в сноске.'
