  text: Then the sons of Israel came down from their city and confronted him[a]; and after untying him, they brought him to Bethyloua and brought him before the rulers of their city[c][b],
translation:
  language: ru
  text: Тогда сыны Израиля спустились из своего города, подошли к нему и, развязав его, отвели в Ветилую и поставили перед правителями своего города.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταβάντες
  choice: спустились
  rationale: Передаёт направленное движение вниз от города; греческое причастие естественно преобразовано в личную глагольную форму.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Сохраняет традиционное библейское обозначение и мужскую родственную формулировку греческого текста; выражение понятно в современном литературном русском.
- source_word: ἐπέστησαν αὐτῷ
  choice: подошли к нему
  rationale: В данном контексте глагол обозначает приближение к связанному Ахиору. Нейтральное «подошли» сохраняет смысл, не добавляя враждебного оттенка, обязательного для «противостали» или «вступили в противоборство».
- source_word: λύσαντες αὐτόν
  choice: развязав его
  rationale: Передаёт конкретное освобождение от пут, подразумеваемое контекстом, без отвлечённого значения «освободив».
- source_word: ἀπήγαγον
  choice: отвели
  rationale: Глагол выражает сопровождаемое перемещение человека к названному месту; «отвели» естественно передаёт это по-русски.
- source_word: εἰς τὴν Βετυλουά
  choice: в Ветилую
  rationale: Использована традиционная для русского библейского именования транслитерация топонима и естественное обозначение движения внутрь города.
- source_word: κατέστησαν αὐτὸν ἐπὶ τοὺς ἄρχοντας
  choice: поставили перед правителями
  rationale: Контекстуально означает привести человека к городским властям и поставить перед ними, а не назначить его над ними.
- source_word: οἱ ἄρχοντες
  choice: правители
  rationale: Широко и точно обозначает лиц, облечённых властью, не навязывая более узкого устройства городского управления.
