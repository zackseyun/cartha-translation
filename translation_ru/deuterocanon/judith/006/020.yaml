lexical_decisions:
- source_word: παρεκάλεσαν
  choice: ободрили
  rationale: Глагол παρακαλέω может означать «ободрять», «утешать», «увещевать» или «призывать». В данном повествовательном контексте речь, вероятнее всего, идёт о поддержке Ахиора, поэтому выбрано естественное русское «ободрили», а широта значения отмечена в сноске.
- source_word: Ἀχιὼρ
  choice: Ахиора
  rationale: Имя передано традиционной русской библейской транслитерацией и поставлено в винительный падеж по синтаксису фразы.
- source_word: ἐπήνεσαν
  choice: хвалили
  rationale: Глагол означает «хвалить», «одобрять», «выказывать похвалу». Простое «хвалили» точно передаёт значение и естественно сочетается с усилительным наречием.
- source_word: σφόδρα
  choice: очень
  rationale: Наречие выражает высокую степень. «Очень» ясно и естественно передаёт усиление, не придавая тексту архаического оттенка.
