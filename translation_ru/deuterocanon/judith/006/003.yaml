lexical_decisions:
- source_word: δοῦλοι
  choice: рабы
  rationale: Слово обозначает людей, полностью подчинённых своему господину; в военной похвальбе «рабы» сохраняет выраженную в греческом принадлежность и зависимость.
- source_word: πατάξομεν
  choice: поразим
  rationale: Глагол передаёт нанесение удара, часто в насильственном или военном контексте; «поразим» естественно и ёмко выражает эту угрозу.
- source_word: ὡς ἄνθρωπον ἕνα
  choice: как одного человека
  rationale: Буквально сохраняет неоднозначный греческий оборот, который может подчёркивать либо единое действие против всего противника, либо лёгкость победы над ним, словно над одним человеком.
- source_word: ὑποστήσονται
  choice: не устоят перед
  rationale: В данном военном контексте глагол означает способность выдержать натиск или оказать сопротивление; русский оборот естественно сочетается с последующим обозначением силы.
- source_word: κράτος
  choice: мощью
  rationale: Здесь имеется в виду проявленная, подавляющая сила в бою; «мощь» сохраняет интенсивность слова.
- source_word: ἵππων
  choice: коней
  rationale: Греческий текст прямо называет лошадей, а не всадников или конницу; «кони» уместны в dignified военном повествовании.
theological_decisions:
- issue: Передача δοῦλοι
  choice: рабы
  alternative: слуги
  rationale: Выбрано более прямое обозначение полной принадлежности господину; более мягкое «слуги» могло бы ослабить выраженную греческим словом зависимость.
translation_notes:
  register: Современный литературный русский язык с торжественным военным оттенком; синтаксис краткий и прямой. Неоднозначность оборота ὡς ἄνθρωπον ἕνα сохранена в основном тексте и пояснена в сноске.
