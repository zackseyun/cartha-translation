  text: And his servants seized him and led him outside the camp into the plain, and they went up from the midst of the plain into the hill country, and they came to the springs that were below Bethulia.
translation:
  language: ru
  text: И его рабы схватили его и вывели из лагеря на равнину; затем они поднялись из середины равнины в горную местность и подошли к источникам, находившимся ниже Ветилуи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλοι
  choice: рабы
  rationale: Основное значение слова — люди, находящиеся во власти господина. «Рабы» прямо передаёт их зависимое положение, тогда как «слуги» могло бы его затушевать.
- source_word: συνέλαβον
  choice: схватили
  rationale: Глагол обозначает решительное физическое овладение человеком; «схватили» передаёт силу действия, не добавляя юридического смысла ареста.
- source_word: παρεμβολῆς
  choice: лагеря
  rationale: В военном повествовании слово обозначает лагерь; это точный и естественный русский эквивалент.
- source_word: πεδίον
  choice: равнину
  rationale: Контекст противопоставляет ровную низменную местность горной; «равнина» ясно передаёт этот топографический контраст.
- source_word: ἀπῆραν
  choice: поднялись
  rationale: Форма непереходная и описывает дальнейшее движение самих рабов. Направление из равнины в горную местность позволяет естественно выразить его как подъём, не повторяя объекта «его».
- source_word: ἐκ μέσου τῆς πεδινῆς
  choice: с середины равнины
  rationale: 'Передан пространственный смысл исходного выражения: движение из внутренней части равнинной области.'
- source_word: ὀρεινήν
  choice: горную местность
  rationale: Субстантивированное прилагательное обозначает гористую область; выбранный вариант естественен по-русски и сохраняет противопоставление равнине.
- source_word: παρεγένοντο
  choice: подошли
  rationale: Глагол указывает на прибытие к месту. «Подошли» естественно сочетается с источниками как пунктом назначения.
- source_word: πηγάς
  choice: источникам
  rationale: Речь идёт о природных источниках воды; русский эквивалент точен и стилистически нейтрален.
- source_word: ὑποκάτω
  choice: ниже
  rationale: Передаёт более низкое географическое положение источников относительно города.
- source_word: Βετυλουά
  choice: Ветилуи
  rationale: Использована укоренившаяся русская форма топонима «Ветилуя» в родительном падеже после «ниже».
