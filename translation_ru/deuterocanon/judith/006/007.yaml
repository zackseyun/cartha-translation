lexical_decisions:
- source_word: ἀνταποστήσουσίν σε
  choice: отведут тебя обратно
  rationale: Передаёт будущее время, физическое перемещение Ахіора и возвратное направление, выраженное сложным глаголом ἀνταποστέλλω.
- source_word: οἱ δοῦλοί μου
  choice: мои слуги
  rationale: В данном военно-придворном контексте речь идёт о подчинённых, исполняющих приказ. «Слуги» звучит естественно и сохраняет их зависимое положение, не утверждая сверх контекста именно рабский правовой статус.
- source_word: εἰς τὴν ὀρεινήν
  choice: в горную страну
  rationale: ὀρεινή обозначает гористую область или нагорье; «горная страна» ясно и достойно передаёт географический смысл.
- source_word: θήσουσίν σε
  choice: оставят
  rationale: Буквально глагол означает «поместят, поставят», но при доставлении пленника в указанное место русское «оставят» естественно выражает конкретное действие без изменения смысла.
- source_word: ἐν μιᾷ τῶν πόλεων
  choice: в одном из городов
  rationale: Прямо передаёт конструкцию и обычное значение πόλις; масштаб поселения в тексте не уточняется.
- source_word: τῶν ἀναβάσεων
  choice: у горных перевалов
  rationale: Буквально ἀνάβασις означает «подъём, восхождение»; в топографическом контексте это пути подъёма или проходы в горную область. Основной текст передаёт вероятный географический смысл, а буквальная неоднозначность сохранена в сноске.
