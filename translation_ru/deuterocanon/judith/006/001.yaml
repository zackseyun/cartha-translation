base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/001.yaml
  text: 'And when the uproar of the men around the council had ceased[a], Holofernes, commander-in-chief of the army of Asshur, said to Achior in the presence of all the assembly of foreigners:'
translation:
  language: ru
  text: 'Когда утих шум мужчин, стоявших вокруг совета, Олоферн, главнокомандующий войском Ассура[a], сказал Ахиору в присутствии всего собрания чужеземцев:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ассирии». Греческое имя «Ассур» может передаваться и как название страны — «Ассирия».'
    reason: Лексическая неоднозначность собственного имени Ἀσσοὺρ.
lexical_decisions:
- source_word: κατέπαυσεν
  choice: утих
  rationale: В сочетании с θροῦβος естественно передаёт прекращение шума до начала речи Олоферна.
- source_word: θροῦβος
  choice: шум
  rationale: Слово обозначает громкое волнение или суматоху; «шум» здесь звучит естественно и не преувеличивает степень беспорядка.
- source_word: τῶν κύκλῳ τῆς συνεδρίας
  choice: людей, окружавших совет
  rationale: Сохраняет пространственный образ κύκλῳ и передаёт συνεδρία как совещательный орган или собрание без добавления отсутствующего в тексте помещения.
- source_word: ἀρχιστράτηγος
  choice: главнокомандующий
  rationale: Точно передаёт высший военный чин, выраженный сложным греческим титулом.
- source_word: δυνάμεως
  choice: войском
  rationale: В данном военном контексте δύναμις означает вооружённые силы; «войско» соответствует историческому повествовательному регистру.
- source_word: Ἀσσοὺρ
  choice: Ассура
  rationale: Передаёт греческую форму как собственное имя, не разрешая однозначно возможное указание на страну.
- source_word: ἐναντίον
  choice: перед
  rationale: Здесь обозначает публичное высказывание в присутствии всего собрания; русское «перед» кратко и естественно выражает этот смысл.
- source_word: δήμου
  choice: собранием
  rationale: В контексте публичной речи означает собравшуюся группу людей, а не народ как политическую общность.
- source_word: ἀλλοφύλων
  choice: чужеземцев
  rationale: Передаёт людей иного племени или народа без ошибочного отождествления с филистимлянами.
theological_decisions:
- issue: Передача имени Ἀσσοὺρ
  choice: Ассур
  alternative: Ассирия
  rationale: Основной текст сохраняет собственное имя в форме «Ассур», тогда как географическое понимание «Ассирия» отмечено в сноске; тем самым не устраняется присущая форме смысловая возможность.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Военные титулы переданы ясно, а синтаксис сохранён как вводная временная конструкция, завершающаяся двоеточием перед последующей прямой речью.
