lexical_decisions:
- source_word: οἳ ἦσαν ἐν ταῖς ἡμέραις ἐκείναις
  choice: которые были в те дни
  rationale: Сохраняет простую и несколько неопределённую формулировку греческого текста, не добавляя прямо не названной должности; возможный служебный смысл пояснён в сноске.
- source_word: Ὀζείας
  choice: Озия
  rationale: Устоявшаяся русская библейская форма имени, соответствующая греческому Ὀζείας.
- source_word: ὁ τοῦ Μειχὰ
  choice: сын Михи
  rationale: Конструкция с артиклем и родительным падежом обозначает происхождение по отцу; по-русски естественно передаётся словом «сын».
- source_word: ἐκ τῆς φυλῆς Συμεὼν
  choice: из колена Симеона
  rationale: Предлог «из» непосредственно передаёт ἐκ, а «колено» является естественным русским библейским обозначением племенного подразделения Израиля.
- source_word: Χαβρεὶς
  choice: Хаврис
  rationale: 'Передача греческой формы имени русской транслитерацией: χ — «х», β — «в», конечное -εις — «-ис».'
- source_word: ὁ τοῦ Γοθονιὴλ
  choice: сын Гофониила
  rationale: Явно передаёт греческую формулу сыновства; имя транслитерировано с передачей θ через «ф».
- source_word: Χαρμεὶς
  choice: Хармис
  rationale: Прямая и последовательная русская передача греческой формы собственного имени.
- source_word: ὁ τοῦ Μελχειήλ
  choice: сын Мелхиила
  rationale: Конструкция выражает сыновство; форма «Мелхиил» близко передаёт греческое Μελχειήλ и естественно склоняется по-русски.
