  text: And Holofernes ordered his servants[a], who were standing by in his tent[b], to seize Achior and take him back to Bethyloua and hand him over into the hands of the sons of Israel.
translation:
  language: ru
  text: И Олоферн приказал своим рабам, стоявшим в его шатре, схватить Ахиора, отвести его обратно в Ветилую[a] и предать в руки сынов Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ветилуя — традиционная русская форма греческого названия Βετυλουά.
    reason: lexical_alternative
  - marker: b
    text: «Сыны Израиля» — буквальная передача греческого выражения; здесь имеются в виду израильтяне как народ.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  choice: приказал
  rationale: Передаёт властный характер распоряжения и естественно звучит в современном русском повествовании.
- source_word: τοῖς δούλοις αὐτοῦ
  choice: своим слугам
  rationale: В данном контексте речь идёт о состоящих при военачальнике людях; «слуги» сохраняет социальную зависимость, не утверждая с большей определённостью, чем позволяет контекст, юридический статус рабов.
- source_word: παρεστηκότες
  choice: стоявшим при нём
  rationale: Передаёт как буквальное положение, так и значение присутствия в готовности исполнить приказ.
- source_word: σκηνῇ
  choice: шатре
  rationale: В военном контексте σκηνή — шатёр; это естественный и стилистически достойный русский эквивалент.
- source_word: συλλαβεῖν
  choice: схватить
  rationale: Сохраняет оттенок насильственного задержания без привнесения формальной юридической процедуры.
- source_word: ἀποκαταστῆσαι
  choice: отвести его обратно
  rationale: В контексте обозначает возвращение Ахиора в Ветилую под конвоем.
- source_word: Βετυλουὰ
  choice: Ветилуя
  rationale: Транслитерация греческой формы названия с русским падежным оформлением; традиционная форма «Ветилуя» понятна русскому читателю.
- source_word: παραδοῦναι εἰς χεῖρας
  choice: предать в руки
  rationale: Сохраняет образную библейскую идиому передачи человека под чужую власть.
- source_word: υἱῶν Ἰσραήλ
  choice: сынов Израиля
  rationale: Формально соответствует греческому выражению и сохраняет его библейское звучание; здесь оно обозначает народ Израиля в совокупности.
theological_decisions:
- issue: Статус обозначенных словом δοῦλοι людей
  choice: слуги
  alternative: рабы
  rationale: Само слово допускает значение рабов, однако ближайший контекст подчёркивает их функцию как состоящих при Олоферне исполнителей. «Слуги» сохраняет неоднозначность статуса и не смягчает властное отношение, выраженное приказом.
- issue: Коллективное выражение υἱῶν Ἰσραήλ
  choice: сыны Израиля
  alternative: израильтяне
  rationale: В основном тексте сохранена буквальная родственная формула «сынов Израиля», тогда как сноска поясняет её коллективный смысл, не нейтрализуя форму оригинала.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис остаётся ясным; выражение «предать в руки» и формула «сыны Израиля» сохраняют образность и регистр источника.
