  - severity: low
    issue: Добавлено «при нём»
    rationale: παρεστηκότες допускает смысл присутствия при ком-либо, но греческий текст прямо указывает лишь, что эти люди стояли в шатре Олоферна. Более прямой вариант избегает необязательной экспликации.
