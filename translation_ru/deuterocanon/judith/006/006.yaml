lexical_decisions:
- source_word: διελεύσεται
  choice: пронзят
  rationale: Глагол буквально означает «пройдут сквозь»; в сочетании с «железом» и прямым дополнением «твои бока» естественное русское «пронзят» передаёт движение оружия сквозь тело, не ослабляя военной угрозы.
- source_word: ὁ σίδηρος τῆς στρατείας μου
  choice: железо моего войска
  rationale: 'Сохранена яркая метонимия оригинала: «железо» обозначает железное оружие, однако текст не сводится к одному определённому его виду.'
- source_word: ὁ λαὸς τῶν θεραπόντων μου
  choice: люди моих слуг
  rationale: λαός передано как «люди», а θεράποντες — как «слуги»; это сохраняет необычную структуру греческой фразы и не сужает её до специально военного термина.
- source_word: τὰς πλευράς σου
  choice: твои бока
  rationale: πλευράς может означать бока, рёбра или фланги. «Бока» сохраняет телесную образность обращения и не исключает его возможного собирательного смысла.
- source_word: πεσῇ
  choice: ты падёшь
  rationale: Сохраняется прямой и торжественный военный образ падения, который может подразумевать поражение или смерть, не уточняя этого сверх текста.
- source_word: ἐν τοῖς τραυματίαις αὐτῶν
  choice: среди раненных ими
  rationale: Греческое αὐτῶν синтаксически сжато и допускает буквальное «среди их раненых», но по контексту вероятнее обозначает людей, раненных войском Олоферна. В основном тексте выбран ясный русский вариант, а неоднозначность отмечена в сноске.
- source_word: ὅταν ἐπιστρέψωσιν
  choice: когда они возвратятся
  rationale: Будущее временное значение ὅταν с сослагательным наклонением естественно передаётся союзом «когда»; «возвратятся» соответствует возвышенному повествовательному регистру.
