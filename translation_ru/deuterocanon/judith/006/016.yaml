  text: And he called together all the elders of the city, and all their young men and women ran together into the assembly, and they set Achior in the midst of all their people, and Uzziah asked him what had happened.
translation:
  language: ru
  text: Он созвал всех старейшин города; сбежались на собрание все их юноши и женщины. Они поставили Ахиора посреди всего народа, и Озия спросил его, что произошло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεκάλεσεν
  choice: созвал
  rationale: Передаёт каузативное значение совместного созыва кратко и естественно.
- source_word: πρεσβυτέρους
  choice: старейшин
  rationale: В городском контексте речь идёт о признанных руководителях общины, а не просто о пожилых мужчинах.
- source_word: συνέδραμον
  choice: сбежались
  rationale: Сохраняет присущую глаголу динамику быстрого движения и срочность, в отличие от нейтрального «собрались».
- source_word: πᾶς νεανίσκος αὐτῶν καὶ αἱ γυναῖκες
  choice: все их юноши и женщины
  rationale: Единственное число νεανίσκος имеет собирательный смысл; русское множественное число естественно передаёт две группы жителей.
- source_word: ἐκκλησίαν
  choice: собрание
  rationale: Здесь обозначает собрание городской общины, без более поздней церковной коннотации слова «церковь».
- source_word: ἔστησαν
  choice: поставили
  rationale: Переходная конструкция означает, что Ахиора поставили в определённом месте.
- source_word: ἐν μέσῳ παντὸς τοῦ λαοῦ αὐτῶν
  choice: посреди всего народа
  rationale: Близко передаёт пространственный образ греческого выражения и одновременно указывает на присутствие всей общины.
- source_word: ἐπηρώτησεν
  choice: спросил
  rationale: Прямой и естественный русский эквивалент повествовательного глагола.
- source_word: τὸ συμβεβηκός
  choice: что произошло
  rationale: Идиоматично передаёт субстантивированное причастие перфекта, относящееся к уже случившемуся событию.
