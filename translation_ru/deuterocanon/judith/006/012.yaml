    rationale: «Жители города» может включать всех жителей, тогда как источник прямо называет мужчин города. Следует перевести «мужчины города».
  - severity: low
    issue: «Стали бросать» излишне акцентирует начало действия.
    rationale: Имперфект ἔβαλλον прежде всего обозначает продолжавшееся/повторявшееся метание камней; «бросали» передаёт это без дополнительного оттенка.
