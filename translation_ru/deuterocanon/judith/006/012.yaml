review_pass:
  verdict: revise
  source_fidelity: «Жители города» необоснованно снимает явно выраженное в греческом οἱ ἄνδρες («мужчины»). В военном контексте это не делает русскую фразу неясной, но исходную гендерно маркированную формулировку следует сохранить. «Преградили им подъём» точно передаёт удерживание/воспрепятствование восхождению; «все пращники» приемлемо передаёт πᾶς ἀνὴρ σφενδονήτης.
  naturalness: Исправленный текст остаётся современным литературным русским. «Мужчины города» несколько более формально, чем «жители», но естественно для исторического повествования и точно. Простое «бросали» лучше передаёт имперфект ἔβαλλον как продолжающееся действие, не добавляя специально значения начала действия, которое есть в «стали бросать».
  terminology: «Оружие», «пращники» и «вершина горы» точны и стилистически уместны. Сноска правильно раскрывает буквальную структуру греческого выражения, хотя основной текст уже адекватно передаёт его собирательным обозначением.
