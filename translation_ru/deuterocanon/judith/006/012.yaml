lexical_decisions:
- source_word: καὶ ὡς εἶδαν
  choice: Когда ... увидели
  rationale: ὡς с аористом имеет здесь временное значение; начальное καί естественно не воспроизводить отдельным «и» в современном русском повествовании.
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: жители города
  rationale: Буквально «мужчины города»; в данном контексте речь идёт о способных вооружиться горожанах. «Жители города» звучит естественно, а дальнейшее описание ясно указывает на воинов-мужчин.
- source_word: ἐπὶ τὴν κορυφὴν τοῦ ὄρους
  choice: на вершине горы / на вершину горы
  rationale: Одинаковая греческая предложная конструкция после глагола восприятия передана местно, а после глагола движения — направительно, согласно нормам русского языка.
- source_word: ἀνέλαβον τὰ ὅπλα αὐτῶν
  choice: они взяли оружие
  rationale: ἀναλαμβάνω с ὅπλα означает взять оружие, чтобы действовать; «взяли оружие» естественно и сохраняет военный смысл.
- source_word: ἐπῆλθον ἔξω τῆς πόλεως ἐπὶ τὴν κορυφὴν τοῦ ὄρους
  choice: вышли из города и поднялись на вершину горы
  rationale: Передаёт как выход из города, так и направленное движение к вершине; «поднялись» естественно в горном контексте, хотя в греческом подъём подразумевается сочетанием глагола движения и цели.
- source_word: πᾶς ἀνὴρ σφενδονήτης
  choice: все пращники
  rationale: Греческое выражение буквально означает «каждый мужчина-пращник». Русское «все пращники» кратко и естественно обозначает всю группу воинов этой специальности.
- source_word: διεκράτησαν τὴν ἀνάβασιν αὐτῶν
  choice: преградили им подъём
  rationale: Сочетание обозначает удерживание противника и воспрепятствование его продвижению вверх. Русская формулировка сохраняет и военный, и топографический смысл.
- source_word: ἔβαλλον ἐν λίθοις ἐπʼ αὐτούς
  choice: стали бросать в них камни
  rationale: Имперфект передаёт продолжавшееся действие; «стали бросать» естественно обозначает начавшийся и продолжающийся обстрел камнями.
