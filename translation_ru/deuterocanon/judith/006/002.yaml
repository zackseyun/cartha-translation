base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/006/002.yaml
  text: And who are you[a], Achior, and the hirelings of Ephraim among all the sons of Moab, that you have prophesied among us as you did today, and said that one should not make war against the house of Israel because their God will defend them? And who is God except Nebuchadnezzar? He himself will send his force and destroy them from the face of the earth[c][b], and their God will not rescue them.
translation:
  language: ru
  text: «Кто ты такой, Ахиор, и кто вы, наёмники Ефрема среди всех сынов Моава,[a] что ты сегодня пророчествовал среди нас и сказал, что не следует воевать с родом Израиля,[b] потому что их Бог защитит их? И кто бог, кроме Навуходоносора?[c] Он направит против них свою силу и истребит их с лица земли, и их Бог не избавит их».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое построение в начале стиха необычно и допускает иное членение; буквально упомянуты «все сыновья Моава» и «наёмники Ефрема».
    reason: textual_ambiguity
  - marker: b
    text: 'Буквально: «с родом Израиля»; греческое слово подчёркивает общность происхождения и может также означать народ Израиля.'
    reason: lexical_alternative
  - marker: c
    text: Слова о Навуходоносоре — хвастливое и кощунственное утверждение персонажа, а не суждение повествователя.
    reason: cultural_note
lexical_decisions:
- source_word: μισθωτοὶ
  choice: наёмники
  rationale: Слово обозначает людей, служащих за плату; «наёмники» естественно для военного контекста и сохраняет презрительный оттенок речи.
- source_word: ἐπροφήτευσας
  choice: пророчествовал
  rationale: Сохранена явная пророческая лексика греческого текста, хотя в устах говорящего она звучит насмешливо и враждебно.
- source_word: τὸ γένος Ἰσραήλ
  choice: род Израиля
  rationale: «Род» передаёт значение происхождения и родственной общности в γένος, не сводя выражение просто к политическому народу.
- source_word: μὴ πολεμῆσαι
  choice: не следует воевать с
  rationale: Инфинитив после εἶπας передан естественной русской конструкцией с модальным запретительно-рекомендательным смыслом.
- source_word: ὑπερασπιεῖ
  choice: защитит
  rationale: Передаёт значение выступить в защиту и оградить в непосредственном военном контексте.
- source_word: θεὸς
  choice: бог
  rationale: В вопросе о Навуходоносоре строчная буква показывает предикативное употребление и хвастливое притязание говорящего, не представляя его утверждением повествователя.
- source_word: τὸ κράτος αὐτοῦ
  choice: свою мощь
  rationale: κράτος означает силу или могущество; «мощь» сохраняет некоторую абстрактность и не сужает значение до войска.
- source_word: ἐξολεθρεύσει
  choice: истребит
  rationale: Сильный глагол выражает полное уничтожение; «истребит» точнее передаёт эту интенсивность, чем нейтральное «уничтожит».
- source_word: ἀπὸ προσώπου τῆς γῆς
  choice: с лица земли
  rationale: Сохранён привычный и торжественный библейский оборот.
- source_word: ῥύσεται
  choice: избавит
  rationale: Обозначает избавление или спасение от угрожающей опасности; здесь речь идёт о военном поражении.
theological_decisions:
- issue: Притязание Навуходоносора на божественный статус
  choice: «И кто бог, кроме Навуходоносора?»
  alternative: «И кто Бог, кроме Навуходоносора?»
  rationale: Греческое письмо не различает здесь прописную и строчную буквы. Строчное «бог» позволяет сохранить кощунственную похвальбу персонажа, не создавая впечатления, будто повествователь признаёт Навуходоносора истинным Богом.
- issue: Обозначение Бога Израиля в словах враждебного говорящего
  choice: «их Бог»
  alternative: «их бог»
  rationale: Оба упоминания относятся к конкретному Богу, Которого чтит Израиль; прописная буква ясно обозначает референта, не превращая отрицание персонажа в позицию повествователя.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Прямая речь сохраняет презрительный, угрожающий тон; необычное синтаксическое соединение единственного и множественного адресатов сглажено лишь настолько, чтобы фраза оставалась понятной, а неоднозначность отмечена в сноске.
