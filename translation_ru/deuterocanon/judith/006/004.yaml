  yaml_path: translation/deuterocanon/judith/006/004.yaml
  text: For we will burn them up where they are[a], and their borders will be drenched with their blood, and their plains will be filled with their dead. The trace of their feet will not stand before us, but they will utterly perish, says King Nebuchadnezzar, lord of all the earth. For he said[b], ‘The words of his mouth will not prove empty.’
translation:
  language: ru
  text: 'Ибо мы сожжём их там, где они находятся; их пределы напьются их крови, и их равнины наполнятся их мертвецами. Не устоит перед нами и след их ног[a], но они погибнут безвозвратно, — говорит царь Навуходоносор, владыка всей земли. Ибо он сказал: «Его слова не окажутся тщетными».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Необычный образ может означать, что перед наступающими не устоит никто и от врагов не останется даже следа.
    reason: ambiguity
lexical_decisions:
- source_word: κατακαύσομεν γὰρ αὐτοῖς ἐν αὐτοῖς
  choice: Ибо мы сожжём их там, где они находятся
  rationale: κατακαίω обозначает полное сожжение, а повтор местоимения в греческом синтаксически неясен. Перевод сохраняет наиболее вероятный местный смысл, не добавляя конкретного места.
- source_word: τὰ ὅρια αὐτῶν
  choice: их пределы
  rationale: ὅρια может обозначать границы, пограничные области или территориальные пределы. «Пределы» сохраняет географический образ и высокий, но понятный регистр.
- source_word: μεθυσθήσεται ἐν τῷ αἵματι αὐτῶν
  choice: опьянеют от их крови
  rationale: Сохранена яркая исходная метафора опьянения, поскольку она понятна по-русски и передаёт поэтическую жестокость угрозы.
- source_word: τὰ πεδία αὐτῶν
  choice: их равнины
  rationale: πεδία означает равнины или открытые пространства; «равнины» естественно соответствует военно-географическому контексту.
- source_word: πληρωθήσεται νεκρῶν αὐτῶν
  choice: наполнятся их мертвецами
  rationale: νεκροί здесь указывает на тела убитых. «Мертвецы» передаёт предметный и мрачный смысл яснее, чем отвлечённое «мёртвые».
- source_word: οὐκ ἀντιστήσεται τὸ ἴχνος τῶν ποδῶν αὐτῶν κατὰ πρόσωπον ἡμῶν
  choice: След их ног не устоит перед нами
  rationale: Сохранён необычный исходный образ следа, который не сможет устоять перед наступающими. Неясность между сопротивлением и полным исчезновением не устранена из основного текста.
- source_word: ἀλλʼ ἀπωλείᾳ ἀπολοῦνται
  choice: но они погибнут безвозвратно
  rationale: Однокоренная конструкция существительного и глагола выражает усиление. «Погибнут безвозвратно» естественно передаёт окончательность гибели.
- source_word: κύριος πάσης τῆς γῆς
  choice: владыка всей земли
  rationale: κύριος здесь является имперским притязанием человеческого царя. Строчная буква отличает этот титул от божественного именования, а «владыка» сохраняет царственный оттенок.
- source_word: οὐ ματαιωθήσεται τὰ ῥήματα τῶν λόγων αὐτοῦ
  choice: Слова речей его не окажутся тщетными
  rationale: Сохранена необычная плеонастическая формулировка греческого текста и значение ματαιόω — оказаться тщетным или напрасным. Не добавлено отсутствующее в греческом слово «уста».
theological_decisions:
- issue: Титул κύριος, отнесённый к Навуходоносору
  choice: владыка всей земли
  alternative: господин всей земли
  rationale: Контекст представляет хвастливое имперское заявление, а не признание божественного статуса. Строчная буква и слово «владыка» передают политическое притязание без смешения с титулом Бога.
- issue: Необычная третьеличная ссылка на слова царя
  choice: «Слова речей его не окажутся тщетными»
  alternative: «Мои слова не окажутся тщетными»
  rationale: Греческий текст сохраняет местоимение третьего лица αὐτοῦ после формулы «он сказал». Переход к первому лицу сделал бы речь естественнее, но устранил бы реальную особенность источника.
translation_notes:
  register: Современный литературный русский язык с торжественным военно-царским оттенком. Сохранены яркие метафоры и намеренная резкость угрозы; архаизмы сведены к минимуму. Пунктуация делает длинное греческое высказывание читаемым, не разбивая его смысловую последовательность.
