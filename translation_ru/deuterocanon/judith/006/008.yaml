translation:
  language: ru
  text: и он не погибнет, пока ты не будешь истреблён вместе с ними.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и он не будет уничтожен, пока ты не будешь полностью уничтожен вместе с ними».'
    reason: Лексическая альтернатива для ἀπολῇ и передача усилительного значения ἐξολεθρευθῇς.
lexical_decisions:
- source_word: ἀπολῇ
  choice: не погибнет
  rationale: Медиально-интранзитивное употребление ἀπόλλυμι передаёт гибель или окончательную утрату; «не погибнет» естественно по-русски и сохраняет непереходный смысл.
- source_word: ἕως οὗ
  choice: пока не
  rationale: В сочетании с отрицанием естественная русская временная конструкция «не… пока не» точно передаёт предел, обозначенный греческим ἕως οὗ.
- source_word: ἐξολεθρευθῇς
  choice: не будешь истреблён
  rationale: Страдательная форма глагола ἐξολεθρεύω выражает полное уничтожение; «истреблён» сохраняет усиленный оттенок лучше, чем нейтральное «уничтожен».
- source_word: μετʼ αὐτῶν
  choice: вместе с ними
  rationale: Передаёт значение совместности ясно и естественно.
- source_word: καὶ
  choice: и
  rationale: Сохраняет простую сочинительную связь без внесения противительного оттенка.
