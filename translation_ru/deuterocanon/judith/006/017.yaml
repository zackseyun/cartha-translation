  yaml_path: translation/deuterocanon/judith/006/017.yaml
  text: And in answer he reported to them the words of Holofernes’ council[a], and all the words that he had spoken in the midst of the rulers of the sons of Asshur[b], and whatever boastful things Holofernes had spoken against the house of Israel.
translation:
  language: ru
  text: В ответ он передал им слова, сказанные на совете Олоферна[a], и все слова, которые Олоферн произнёс среди правителей сынов Ассура[b], и всё, что Олоферн хвастливо говорил против дома Израиля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слова собрания Олоферна».'
    reason: Греческое слово может обозначать совет как совещательный орган, собрание или заседание.
  - marker: b
    text: 'То есть ассирийцев; буквально: «сынов Ассура».'
    reason: Поясняет буквальное стилизованное этническое обозначение греческого текста.
  - marker: c
    text: 'Или: «как Олоферн хвастался»; греческий глагол означает гордую, заносчивую речь.'
    reason: Сохраняет оттенки редкого глагола и указывает естественный русский вариант.
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: В ответ
  rationale: Передаёт ответный характер действия и естественно вводит рассказ в современном русском языке.
- source_word: ἀπήγγειλεν
  choice: пересказал
  rationale: Глагол обозначает сообщение или передачу услышанного; «пересказал» хорошо соответствует последовательному изложению произошедшего.
- source_word: τὰ ῥήματα τῆς συνεδρείας Ὀλοφέρνου
  choice: всё сказанное на совете Олоферна
  rationale: Естественно передаёт слова, прозвучавшие во время совещания Олоферна, не превращая их в «совет» как рекомендацию.
- source_word: ἐν μέσῳ τῶν ἀρχόντων
  choice: среди правителей
  rationale: Сохраняет пространственно-социальный образ греческого выражения и остаётся естественным по-русски.
- source_word: υἱῶν Ἀσσούρ
  choice: сынов Ассура
  rationale: Сохраняет буквальную, стилизованную этническую формулу греческого текста, не нормализуя её без пояснения как «ассирийцев».
- source_word: ἐμεγαλορρημόνησεν
  choice: хвастливые речи … произнёс
  rationale: Редкий греческий глагол обозначает гордую, заносчивую или хвастливую речь; выбранная формулировка сохраняет мотив неоднократно упоминаемых «слов».
- source_word: εἰς τὸν οἶκον Ἰσραήλ
  choice: против дома Израиля
  rationale: В данном враждебном контексте «против» естественно передаёт направленность заносчивых речей Олоферна.
theological_decisions:
- issue: Этническое обозначение υἱῶν Ἀσσούρ
  choice: сынов Ассура
  alternative: ассирийцев
  rationale: Буквальный вариант сохраняет стилизованное обозначение народа в греческом тексте; понятный современному читателю эквивалент дан в сноске.
- issue: Направленность речи в εἰς τὸν οἶκον Ἰσραήλ
  choice: против дома Израиля
  alternative: о доме Израиля
  rationale: Предлог сам по себе допускает более широкую направленность, однако ближайший контекст хвастливой враждебной речи поддерживает значение «против».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор греческого слова «речи/слова» частично сглажен ради естественности, но трёхчастное перечисление и риторический акцент сохранены.
