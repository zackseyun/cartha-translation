    text: 'Или: «освящённых для Тебя»; возможно также: «Твоих святых». Буквально по-гречески: «освящённых Тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма κύριος в обращении к Богу; традиционный и естественный русский молитвенный эквивалент.
- source_word: ὁ θεὸς τοῦ οὐρανοῦ
  choice: Боже небес
  rationale: Сохраняет библейский титул и родительную конструкцию; множественное «небес» естественно для современного русского библейского регистра.
- source_word: κάτιδε
  choice: воззри
  rationale: Передаёт повелительное молитвенное прошение о внимательном взгляде Бога; слово возвышенное, но понятное и уместное в молитве.
- source_word: τὰς ὑπερηφανίας αὐτῶν
  choice: их надменность
  rationale: Множественное число может обозначать проявления высокомерия; собирательное единственное «надменность» звучит естественно и сохраняет нравственный смысл.
- source_word: ἐλέησον
  choice: помилуй
  rationale: Устойчивый русский эквивалент ἐλεέω в молитвенном обращении.
- source_word: τὴν ταπείνωσιν
  choice: унижение
  rationale: В контексте вражеского угнетения обозначает униженное, попранное состояние народа, а не добродетель смирения.
- source_word: τοῦ γένους ἡμῶν
  choice: нашего народа
  rationale: Здесь γένος означает общность Израиля; «народ» естественнее и не несёт современных биологических коннотаций слова «раса».
- source_word: ἐπίβλεψον
  choice: обрати взор
  rationale: Передаёт просьбу направить благосклонное внимание, при этом избегая тяжеловесного дословного повтора русского «воззри».
- source_word: ἐπὶ τὸ πρόσωπον
  choice: на лица
  rationale: Конкретный образ πρόσωπον сохранён; по-русски при множестве людей естественно согласовать «лица» во множественном числе.
- source_word: τῶν ἡγιασμένων σοι
  choice: посвящённых Тебе
  rationale: Перфектное страдательное причастие от ἁγιάζω указывает на людей, отделённых для Бога. «Посвящённых» естественно передаёт это состояние, не сужая смысл до особой группы «святых».
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: в этот день
  rationale: Сохраняет торжественную указательность исходного выражения и естественно звучит по-русски.
theological_decisions:
- issue: Передача τῶν ἡγιασμένων σοι
  choice: посвящённых Тебе
  alternative: освящённых для Тебя; Твоих святых
  rationale: Причастие может обозначать как освящение, так и отделение или посвящение Богу. Основной текст использует естественное «посвящённых Тебе», а примечание сохраняет более буквальную связь с корнем святости и возможность субстантивного понимания.
translation_notes:
  register: Современный литературный русский с возвышенным молитвенным ритмом. Формы «Господи», «Боже», «воззри», «помилуй» сохраняют достоинство библейской молитвы, оставаясь понятными; местоимение «Тебе» написано с прописной буквы согласно распространённой русской религиозной издательской практике.
