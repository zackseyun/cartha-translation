  text: Lord[a], God of heaven, look upon their arrogance, and have mercy on the humiliation of our people, and look upon the face of those sanctified to you on this day.
translation:
  language: ru
  text: Господи, Боже небес, воззри на их надменность, помилуй унижение нашего народа и обрати взор на лицо тех, кто посвящён Тебе[a] в этот день.
  philosophy: optimal-equivalence
  footnotes:
