  yaml_path: translation/deuterocanon/judith/006/009.yaml
  text: And if you hope in your heart that they will not be taken[a], do not let your face fall. I have spoken[b], and none of my words will fail.
translation:
  language: ru
  text: И если ты в сердце надеешься, что их не захватят[a], не падай духом[b]. Я сказал, и ни одно из моих слов не останется неисполненным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не возьмут в плен». Греческая пассивная форма в этом контексте допускает военное значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пусть не опустится твоё лицо» — образное выражение уныния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπερ
  choice: И если
  rationale: Передаёт связь с предшествующей речью и лёгкое усиление условия, не перегружая современную русскую фразу.
- source_word: ἐλπίζεις τῇ καρδίᾳ σου
  choice: ты в сердце надеешься
  rationale: Сохраняет образ сердца как средоточия внутренней надежды и естественно звучит по-русски.
- source_word: οὐ λημφθήσονται
  choice: их не захватят
  rationale: В данном военном контексте пассивная форма λαμβάνω естественно означает пленение или захват; русская неопределённо-личная конструкция идиоматично передаёт греческий пассив.
- source_word: μὴ συμπεσέτω σου τὸ πρόσωπον
  choice: не падай духом
  rationale: Передаёт смысл греческой телесной идиомы — не предаваться унынию; буквальная калька «пусть не опустится твоё лицо» для современного русского неестественна.
- source_word: ἐλάλησα
  choice: Я сказал
  rationale: Простой прошедший вид точно передаёт аорист и сохраняет властный, завершённый тон заявления.
- source_word: οὐδὲν διαπεσεῖται τῶν ῥημάτων μου
  choice: ни одно из моих слов не останется неисполненным
  rationale: Передаёт не просто сохранность слов, а то, что ничто из сказанного не потерпит неудачи и непременно сбудется.
theological_decisions:
- issue: Образное выражение уныния
  choice: не падай духом
  alternative: пусть не опустится твоё лицо
  rationale: Смысл идиомы передан ясно и естественно без привнесения богословского толкования; буквальный телесный образ отмечен в сноске.
- issue: Исполнение произнесённых слов
  choice: ни одно из моих слов не останется неисполненным
  alternative: ничто из моих слов не пропадёт
  rationale: Формулировка сохраняет утверждение говорящего о неизбежном осуществлении сказанного, не определяя сверх текста природу его авторитета.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис ясен обычному читателю; военная конкретика контекста сохранена, а непривычная греческая идиома передана естественным русским соответствием и пояснена в сноске.
