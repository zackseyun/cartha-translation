revisions:
- from: Порази раба устами моей лжи против правителя и правителя — против его слуги; сокруши их высокомерие рукой женщины.[a]
  to: Порази раба, обратив его против правителя, и правителя — против его слуги — обманом моих уст; сокруши их высокомерие рукой женщины.[a]
  rationale: Исправлена только русская синтаксическая неясность. Оборот «обратив его против правителя» передаёт направленность ἐπʼ ἄρχοντι при πάταξον, а вынесенный в конец первой части оборот «обманом моих уст» естественно охватывает обе параллельные просьбы. Сохранены социальное различие «раб / слуга», женская агентность и осторожное примечание к спорному ἀνάστεμα.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:10:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Бог призывается поразить подчинённого в противостоянии с правителем и правителя — в противостоянии с его слугой; орудием служит обман Юдифи, а их ἀνάστεμα должно быть сокрушено рукой женщины. Однако «Порази раба устами моей лжи против правителя» в русском синтаксически двусмысленно и неестественно: создаётся впечатление, будто «уста» непосредственно поражают раба, а связь «раба против правителя» остаётся неоформленной.'
  naturalness: Предлагаемая редакция ясно выражает направленное друг против друга действие и сохраняет возвышенный, но современный молитвенный регистр. «Обратив его против» — необходимая русская синтаксическая экспликация эллиптической греческой конструкции с ἐπί; она не меняет смысла.
  terminology: «Раб» для δοῦλος и «слуга» для θεράπων удачно сохраняют различие терминов. «Высокомерие» допустимо для редкого ἀνάστεμα при сохранении лексических альтернатив в примечании. «Рукой женщины» точно передаёт ἐν χειρὶ θηλείας.
