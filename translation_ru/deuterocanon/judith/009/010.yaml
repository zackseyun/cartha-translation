lexical_decisions:
- source_word: πάταξον
  choice: Порази
  rationale: Сильный прямой императив, не обязательно уточняющий смертельный исход.
- source_word: δοῦλον
  choice: раба
  rationale: Передаёт зависимое положение и сохраняет социальный контраст с правителем.
- source_word: ἐκ χειλέων ἀπάτης μου
  choice: устами моей лжи
  rationale: Естественно передаёт инструментальное значение ἐκ и сохраняет прямое признание Юдифью собственного обмана, не добавляя отсутствующего в греческом слова «слова».
- source_word: ἐπʼ ἄρχοντι
  choice: против правителя
  rationale: В сочетании с πάταξον предлог выражает направленность одного лица против другого.
- source_word: ἄρχοντα
  choice: правителя
  rationale: Широкое обозначение человека, наделённого властью, без излишне монархического оттенка.
- source_word: θεράποντι
  choice: слуги
  rationale: Обозначает личного служителя или приближённого и отличает его от δοῦλος — «раб».
- source_word: θραῦσον
  choice: сокруши
  rationale: Передаёт интенсивность призыва к решительному разрушению.
- source_word: τὸ ἀνάστεμα
  choice: их высокомерие
  rationale: Контекстуально передаёт гордое превозношение врагов; редкость существительного требует сохранить альтернативу в примечании.
- source_word: ἐν χειρὶ θηλείας
  choice: рукой женщины
  rationale: Передаёт библейский оборот об орудии действия и явно выраженную женскую принадлежность действующего лица.
theological_decisions:
- issue: Женщина как орудие Божьего низвержения сильных
  choice: рукой женщины
  alternative: женской рукой
  rationale: Греческий текст явно подчёркивает женский пол действующего лица; это значимо для повествования, и нейтрализовать выражение нельзя.
- issue: Нравственно напряжённое признание обмана
  choice: устами моей лжи
  alternative: моими лживыми устами
  rationale: Перевод сохраняет прямую связь обмана с самой молящейся и не пытается богословски смягчить её просьбу.
