  yaml_path: translation/deuterocanon/judith/009/001.yaml
  text: But Judith fell on her face[a], and put ashes on her head, and uncovered the sackcloth she had been wearing. And at that very time the evening incense was being offered in Jerusalem in the house of God, and Judith cried out with a loud voice to the Lord[b],
translation:
  language: ru
  text: 'Иудифь же пала лицом на землю, посыпала голову пеплом и обнажила вретище, которое носила.[a] Как раз в это время в Иерусалиме, в доме Божьем, возносили вечерний фимиам.[b] И Иудифь громким голосом воззвала к Господу:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть сделала видимым вретище, которое носила; греческий текст не обязательно означает, что она его сняла.
    reason: lexical_alternative
  - marker: b
    text: Речь идёт об установленном вечернем воскурении благовоний в Иерусалимском святилище.
    reason: cultural_note
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: пала лицом на землю
  rationale: Греческий оборот буквально описывает падение на лицо как выражение смирения и моления. Добавление «на землю» делает образ естественным и однозначным по-русски, не заменяя его толкованием «простёрлась ниц».
- source_word: ἐπέθετο σποδὸν ἐπὶ τὴν κεφαλὴν αὐτῆς
  choice: посыпала голову пеплом
  rationale: Так естественно передаётся известный жест скорби и покаяния; русское выражение не требует буквального сохранения единственного числа σποδόν.
- source_word: ἐγύμνωσεν ὃν ἐνεδεδύκει σάκκον
  choice: открыла вретище, в которое была одета
  rationale: ἐγύμνωσεν означает «обнажила, открыла», а не обязательно «сняла». Перевод сохраняет мысль, что Иудифь уже носила вретище и теперь сделала его видимым.
- source_word: ἦν ἄρτι προσφερόμενον
  choice: как раз в это время … возносили
  rationale: ἄρτι подчёркивает совпадение по времени, а описательная пассивная конструкция передана естественной русской неопределённо-личной формой.
- source_word: εἰς τὸν οἶκον τοῦ θεοῦ
  choice: в доме Божьем
  rationale: В культовом контексте εἰς при προσφέρω указывает на место принесения. «Дом Божий» сохраняет греческий образ, не подменяя его пояснительным словом «храм».
- source_word: τὸ θυμίαμα τῆς ἑσπέρας ἐκείνης
  choice: вечерний фимиам
  rationale: θυμίαμα обозначает именно благовонное курение. «Фимиам» кратко и точно передаёт культовый предмет, а пояснение раскрывает его значение современному читателю.
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  choice: громким голосом воззвала
  rationale: Сочетание передаёт настойчивое, слышимое обращение в молитве и сохраняет возвышенность повествования без тяжеловесного буквализма.
- source_word: πρὸς Κύριον
  choice: к Господу
  rationale: Предлог обозначает направленность молитвенного обращения, а Κύριος в данном контексте относится к Богу.
theological_decisions:
- issue: Передача Κύριος
  choice: Господь
  alternative: Владыка
  rationale: В молитвенном контексте это обычное библейское обозначение Бога; «Господь» сохраняет богословскую узнаваемость, не вводя дополнительного оттенка господства.
- issue: Культовое значение οἶκος τοῦ θεοῦ
  choice: дом Божий
  alternative: храм Божий
  rationale: Речь идёт об Иерусалимском святилище, однако буквальный образ «дом Божий» прозрачен по контексту и сохраняет лексику исходного текста.
- issue: Характер вечернего θυμίαμα
  choice: вечерний фимиам
  alternative: вечернее каждение
  rationale: Исходный текст называет благовоние, приносимое Богу, а не только обряд как действие. Основной текст сохраняет предметное значение; примечание проясняет установленный храмовый обряд.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Слова «вретище», «фимиам» и «воззвала» сохранены как точные и укоренённые в библейском регистре; потенциально неочевидные культовые детали пояснены в сносках. Двоеточие в конце вводит следующую за стихом молитву.
