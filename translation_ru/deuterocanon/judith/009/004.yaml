base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/004.yaml
  text: And you gave their wives as plunder[a], and their daughters into captivity, and all their spoils for division among the sons beloved by you, who also were zealous with your zeal and abhorred the defilement of their blood and called on you for help. O God, my God, hear me[b], the widow.
translation:
  language: ru
  text: И Ты отдал их жён в добычу, их дочерей — в плен, а всю добычу — для раздела между сыновьями, возлюбленными Тобою[a], которые ревновали Твоей ревностью, гнушались осквернением их крови[b] и призвали Тебя на помощь. Боже, Боже мой, услышь меня, вдову.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновьями, возлюбленными Тобою»; возможно также: «Твоими возлюбленными сыновьями».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «осквернение их крови» может также означать «скверну, связанную с их кровью»; греческий оборот сохраняет неоднозначность родительного отношения.
    reason: lexical_alternative
lexical_decisions:
- source_word: προνομὴν
  choice: в добычу
  rationale: Существительное обозначает военную добычу. Оборот «отдать в добычу» естественен по-русски и сохраняет результативное значение конструкции εἰς.
- source_word: αἰχμαλωσίαν
  choice: в плен
  rationale: Устойчиво и точно передаёт εἰς αἰχμαλωσίαν, не добавляя идеи изгнания.
- source_word: σκῦλα
  choice: всё награбленное
  rationale: Военный термин обозначает захваченное имущество. В данном контексте «награбленное» ясно отличается от людей, ранее отданных в добычу и плен.
- source_word: διαίρεσιν
  choice: на раздел
  rationale: Сохраняет значение распределения захваченного имущества и близко следует именной конструкции греческого текста.
- source_word: υἱῶν ἠγαπημένων ὑπὸ σοῦ
  choice: сыновьям, возлюбленным Тобою
  rationale: Сохраняет явно мужское «сыновья» и пассивную форму причастия, подчёркивающую Божью любовь к ним.
- source_word: ἐζήλωσαν τὸν ζῆλόν σου
  choice: ревновали Твоей ревностью
  rationale: Сохраняет выразительный однокоренной оборот оригинала и связь их ревности с Божьей ревностью, не сводя смысл просто к усердию.
- source_word: ἐβδελύξαντο
  choice: гнушались
  rationale: Передаёт сильное нравственное и ритуальное отвращение и уместно звучит в возвышенной молитвенной речи.
- source_word: μίασμα αἵματος αὐτῶν
  choice: осквернением их крови
  rationale: 'Сохраняет культово-нравственную силу μίασμα и неоднозначность родительного оборота: речь может идти об осквернении крови, кровном бесчестии или нечистоте, связанной с кровью.'
- source_word: ἐπεκαλέσαντό σε εἰς βοήθειαν
  choice: призвали Тебя на помощь
  rationale: Естественный русский молитвенный оборот, сохраняющий смысл обращения к Богу за помощью.
- source_word: εἰσάκουσον ἐμοῦ
  choice: услышь меня
  rationale: Традиционный и понятный русский эквивалент настойчивой молитвенной просьбы.
- source_word: τῆς χήρας
  choice: меня, вдову
  rationale: Русская аппозиция естественно передаёт самообозначение Иудифи как вдовы и сохраняет его риторический вес.
theological_decisions:
- issue: Мужское родственное обозначение в υἱῶν ἠγαπημένων ὑπὸ σοῦ
  choice: сыновьям, возлюбленным Тобою
  alternative: Твоим возлюбленным детям / народу
  rationale: Оригинал прямо говорит о «сыновьях»; нейтрализация до «детей» или «народа» устранила бы выраженную в тексте образность.
- issue: Однокоренной оборот ἐζήλωσαν τὸν ζῆλόν σου
  choice: ревновали Твоей ревностью
  alternative: пылали ревностью о Тебе
  rationale: Выбранный вариант сохраняет напряжённую формулировку о соотнесённости их ревности с Божьей, не истолковывая её заранее лишь как преданность Богу.
- issue: Неоднозначность μίασμα αἵματος αὐτῶν
  choice: осквернением их крови
  alternative: кровавой скверной / осквернением их рода
  rationale: Буквально близкий вариант не решает без достаточных оснований, обозначает ли кровь телесную кровь, кровное родство, родовую честь или источник ритуальной нечистоты.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Божественные местоимения написаны с прописной буквы. Синтаксический параллелизм трёх дарований сохранён, а тяжёлые для русского языка конструкции умеренно сглажены без устранения смысловой неоднозначности.
