  yaml_path: translation/deuterocanon/judith/009/005.yaml
  text: For you made those things before them, and those things and the things afterward and the things now and the things to come you planned[a][b], and what you planned came to be.
translation:
  language: ru
  text: Ведь Ты совершил то, что было прежде них; а их — и то, что было после, и то, что есть теперь, и то, что грядёт, — Ты задумал[a][b], и то, что Ты задумал, осуществилось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обдумал», «намеревался»; греческий глагол может обозначать размышление, намерение или замысел.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте последовательно перечислено то, что было прежде, то, о чём идёт речь, то, что было после, настоящее и грядущее; этим подчёркивается Божья власть над всеми временами.
    reason: literary_note
lexical_decisions:
- source_word: σὺ γὰρ
  choice: Ведь Ты
  rationale: Сохраняет причинно-пояснительную силу γάρ и эмфатическое σὺ; по-русски естественно связывает стих с молитвенным обращением.
- source_word: ἐποίησας
  choice: совершил
  rationale: Передаёт широкое значение ποιέω — осуществить, произвести, сделать — без неоправданного сужения до технического «сотворил».
- source_word: τὰ πρότερα ἐκείνων
  choice: то, что было прежде них
  rationale: Сохраняет сравнительное значение родительного ἐκείνων и не устраняет неясность его референта.
- source_word: καὶ ἐκεῖνα
  choice: и их самих
  rationale: Естественно передаёт указательное ἐκεῖνα, отсылающее к упомянутым событиям или делам, при этом не уточняя их сверх текста.
- source_word: τὰ μετέπειτα
  choice: то, что было после
  rationale: Передаёт временное значение μετέπειτα и поддерживает последовательность прошлого, настоящего и будущего.
- source_word: τὰ νῦν
  choice: то, что есть теперь
  rationale: Ясно выражает настоящее время и сохраняет предметную форму греческого среднего множественного числа.
- source_word: τὰ ἐπερχόμενα
  choice: то, что грядёт
  rationale: «Грядёт» — современное, но возвышенное слово, уместное в молитвенной речи и точно обозначающее наступающее будущее.
- source_word: διενοήθης
  choice: Ты замыслил
  rationale: Передаёт обдуманное намерение и целеполагание, сохраняя возможность оттенка «помыслить/предначертать», не вводя систематической терминологии.
- source_word: ἐγενήθησαν ἃ ἐνενοήθης
  choice: задуманное Тобой исполнилось
  rationale: Естественно передаёт осуществление того, что Бог задумал; «исполнилось» отражает результативность ἐγενήθησαν без сведения смысла к простому случаю или событию.
theological_decisions:
- issue: Божественное знание, намерение и владычество над всеми временами
  choice: Передать διανοέομαι как «замыслить», а осуществление замысла — как «исполнилось», не добавляя философских терминов.
  alternative: Перевести как «обдумал/помышлял» либо усилить до «предопределил».
  rationale: Контекст связывает божественную мысль с последующим осуществлением; «замыслил» сохраняет целенаправленность, но не вводит отсутствующее в греческом тексте доктринальное уточнение о механизме предопределения.
- issue: Характер действия ἐποίησας
  choice: «совершил»
  alternative: «сотворил» или «сделал»
  rationale: «Совершил» достаточно широко охватывает произведение и осуществление событий; «сотворил» могло бы необоснованно превратить фразу в специальное утверждение о творении, а «сделал» снижает молитвенный регистр.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Заглавное «Ты» поддерживает традиционный русский способ обращения к Богу. Синтаксическое накопление временных выражений сохранено, однако оформлено естественными русскими конструкциями; неясный референт ἐκείνων намеренно не конкретизирован.
