  yaml_path: translation/deuterocanon/judith/009/012.yaml
  text: Yes[a], yes, O God of my father and God of Israel’s inheritance, Master of the heavens and of the earth, Creator of the waters[b], King of all your creation, you—hear my prayer.
translation:
  language: ru
  text: Да, да, Боже отца моего и Боже наследия Израиля[a], Владыка[b] небес и земли, Создатель вод, Царь всего Твоего творения — Ты услышь мою мольбу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение можно также понять как «Бог наследства Израиля» или «Бог, являющийся наследием Израиля».
    reason: lexical_alternative
  - marker: b
    text: Греческое δέσποτα обозначает владыку, обладающего полной властью, и имеет более сильный оттенок, чем κύριος («Господь»).
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὶ ναὶ
  choice: Да, да
  rationale: Двойное утвердительное восклицание передано буквально, с сохранением молитвенной настойчивости и без привнесения формулы «истинно, истинно».
- source_word: ὁ θεὸς τοῦ πατρὸς μου
  choice: Боже отца моего
  rationale: Молитвенный контекст придаёт форме значение прямого обращения; единственное число «отца» сохранено.
- source_word: θεὸς κληρονομίας Ἰσραήλ
  choice: Боже наследия Израиля
  rationale: κληρονομία прямо означает «наследие, наследство»; родительная конструкция сохранена, поскольку её точное отношение к Израилю допускает разные оттенки понимания.
- source_word: δέσποτα
  choice: Владыка
  rationale: «Владыка» естественно для торжественного русского обращения к Богу и передаёт более сильный оттенок власти и господства, чем обычное «Господь» для κύριος.
- source_word: τῶν οὐρανῶν καὶ τῆς γῆς
  choice: небес и земли
  rationale: Множественное число «небес» сохранено в естественной для русского возвышенного стиля форме.
- source_word: κτίστα τῶν ὑδάτων
  choice: Создатель вод
  rationale: Переданы значение созидания и явное множественное число «вод».
- source_word: βασιλεῦ πάσης κτίσεώς σου
  choice: Царь всего Твоего творения
  rationale: В космическом контексте κτίσις понимается собирательно как всё сотворённое; местоимение σου сохранено.
- source_word: σὺ εἰσάκουσον
  choice: Ты услышь
  rationale: Отдельное σὺ имеет усилительное значение; порядок слов и тире подчёркивают его. «Услышь» в молитве подразумевает не только восприятие, но и благосклонный ответ.
- source_word: τῆς δεήσεώς μου
  choice: мою мольбу
  rationale: «Мольба» передаёт значение настоятельной просьбы в δέησις точнее, чем более общее «молитва», оставаясь понятным современному читателю.
theological_decisions:
- issue: Передача δέσποτα в обращении к Богу
  choice: Владыка
  alternative: Господь; Повелитель
  rationale: Выбор отличает δέσποτα от κύριος и сохраняет оттенок полной, верховной власти, не вводя конфессионально специфической терминологии.
- issue: Неоднозначность θεὸς κληρονομίας Ἰσραήλ
  choice: Боже наследия Израиля
  alternative: Боже наследства Израиля; Боже, наследие Израиля
  rationale: Родительная связь в греческом допускает оттенки «Бог наследия, принадлежащего Израилю» и «Бог, составляющий наследие Израиля». Основной текст не устраняет эту напряжённость, а примечание обозначает возможные прочтения.
translation_notes:
  register: Современный литературный русский язык с торжественным молитвенным звучанием. Синтаксис близок к греческой последовательности обращений, но остаётся естественным по-русски. Заглавные формы «Твоего» и «Ты» поддерживают традиционную почтительность; тире выделяет усилительное местоимение σὺ.
