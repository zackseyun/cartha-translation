base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/008.yaml
  text: Lord is your name[a]; you, shatter their strength in your power, and break their might in your wrath; for they planned to profane your holy things, to defile the tabernacle, the resting place of your glorious name[b], and to cast down with the sword the horn of your altar.
translation:
  language: ru
  text: Господь — Твоё имя; сокруши их силу Твоей мощью и сломи их могущество в Твоём гневе, ибо они замыслили осквернить Твои святыни[a], осквернить скинию — место покоя Твоего славного имени — и низвергнуть железом[b] рог Твоего жертвенника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Святыни» может означать как священные предметы, так и святые места; греческий текст не ограничивает значение одним зданием святилища.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «железом»; вероятно, имеется в виду железное оружие, но его вид не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος ὄνομά σοι
  choice: Господь — имя Твоё
  rationale: Сохраняет прямое именование и семитизированную греческую конструкцию «имя Тебе», не превращая κύριος лишь в обращение.
- source_word: ῥάξον αὐτῶν τὴν ἰσχὺν
  choice: сокруши их силу
  rationale: ῥάξον выражает резкое, насильственное разрушение; «сокруши» естественно для возвышенной молитвенной речи.
- source_word: ἐν δυνάμει σου
  choice: Своей мощью
  rationale: Передаёт инструментальный смысл ἐν и отличает Божью δύναμις от человеческой ἰσχύς.
- source_word: κατάξον τὸ κράτος αὐτῶν
  choice: сломи их могущество
  rationale: «Сломи» передаёт низвержение и разрушение, а «могущество» сохраняет параллелизм, не сводя κράτος только к политической власти.
- source_word: ἐν τῷ θυμῷ σου
  choice: в Своём гневе
  rationale: «Гнев» точно и естественно передаёт θυμός в контексте молитвы о Божьем суде.
- source_word: βεβηλῶσαι τὰ ἅγιά σου
  choice: осквернить Твои святыни
  rationale: Множественное τὰ ἅγια может охватывать священные предметы и места; «святыни» сохраняет эту широту.
- source_word: μιᾶναι τὸ σκήνωμα
  choice: запятнать скинию
  rationale: «Запятнать» передаёт культовое осквернение μιᾶναι и позволяет избежать монотонного повтора «осквернить».
- source_word: τῆς καταπαύσεως τοῦ ὀνόματος τῆς δόξης σου
  choice: место покоя имени славы Твоей
  rationale: Сохраняет цепочку родительных падежей и богословски значимый образ имени Божьей славы, не устраняя возможную неоднозначность связи определений.
- source_word: καταβαλεῖν σιδήρῳ
  choice: низвергнуть железом
  rationale: «Низвергнуть» передаёт направленность καταβάλλω вниз, а буквальное «железом» сохраняет метонимическую неопределённость орудия.
- source_word: κέρας θυσιαστηρίου σου
  choice: рог Твоего жертвенника
  rationale: Сохраняет конкретную культовую деталь и единственное число оригинала.
theological_decisions:
- issue: Значение конструкции Κύριος ὄνομά σοι
  choice: «Господь — имя Твоё» как утверждение о Божьем имени
  alternative: «Господи» как простое обращение
  rationale: Именная конструкция явно включает ὄνομα; её следует сохранить, не сводя к звательному обращению.
- issue: Объём значения τὰ ἅγιά σου
  choice: «Твои святыни» — собирательно о священных предметах и местах
  alternative: «Твоё святилище» — только здание или территория
  rationale: Форма множественного числа допускает широкое культовое значение, которое не следует преждевременно сужать.
- issue: Образ покоя Божьего имени
  choice: Сохранить «место покоя имени славы Твоей»
  alternative: Сгладить до «скиния, где покоится Твоё славное имя»
  rationale: Более формальная передача сохраняет богословскую напряжённость между Божьим именем, славой и местом Его покоя.
- issue: Орудие разрушения жертвенника
  choice: «железом» в основном тексте
  alternative: «мечом»
  rationale: σίδηρος буквально означает железо и может метонимически обозначать железное оружие; конкретизация как меч не обязательна.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Использованы традиционно понятные культовые термины «скиния», «жертвенник» и «рог жертвенника»; местоимения, относящиеся к Богу, даны с прописной буквы по русской библейской издательской традиции. Пунктуация подчёркивает приложение «место покоя имени славы Твоей».
