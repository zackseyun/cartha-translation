  text: And what I planned stood ready[a], and they said, ‘Behold, we are here; for all your ways are prepared, and your judgment is in foreknowledge.’
translation:
  language: ru
  text: 'И замысленные Тобою дела предстали и сказали: «Вот мы! Ведь все пути Твои готовы, и суд Твой — в предведении[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суд Твой — согласно предведению»; возможно также: «суд Твой — в Твоём предведении». Греческое выражение кратко и не уточняет однозначно, каким именно образом Божий суд связан с Его знанием наперёд.'
    reason: alternative_reading
lexical_decisions:
- source_word: παρέστησαν
  choice: предстали
  rationale: 'Аорист παρίστημι передаёт появление и готовность замысленного к исполнению. «Предстали» сохраняет образ олицетворённых дел, которые затем говорят: «Вот мы».'
- source_word: ἃ ἐβουλεύσω
  choice: замысленные Тобою дела
  rationale: 'Форма ἐβουλεύσω — второе лицо единственного числа: «Ты замыслил», а не «я замыслил». Существительное «дела» естественно раскрывает субстантивированное относительное местоимение среднего рода множественного числа ἃ и позволяет сохранить множественное число последующих глаголов.'
- source_word: πάρεσμεν
  choice: вот мы
  rationale: Фраза выражает одновременно присутствие и готовность. «Вот мы» кратко и естественно передаёт прямую речь олицетворённых дел.
- source_word: ὁδοί
  choice: пути
  rationale: «Пути» — широкий и устойчивый русский эквивалент для образного обозначения Божьих действий и установлений.
- source_word: ἕτοιμοι
  choice: готовы
  rationale: Предикативное прилагательное обозначает уже существующую готовность; прямой эквивалент «готовы» здесь естественнее, чем более тяжёлое «приготовлены».
- source_word: κρίσις
  choice: суд
  rationale: Слово может обозначать судебное решение или акт суда. «Суд» сохраняет юридическую и богословскую ёмкость греческого термина, не сводя его к отвлечённой справедливости.
- source_word: πρόγνωσις
  choice: предведение
  rationale: «Предведение» точно передаёт знание наперёд и в данном возвышенном молитвенном контексте сохраняет компактность греческого выражения. Возможные смысловые отношения, выраженные предлогом ἐν, пояснены в сноске.
theological_decisions:
- issue: Связь Божьего суда с πρόγνωσις
  choice: суд Твой — в предведении
  alternative: суд Твой — согласно предведению; суд Твой — в Твоём предведении
  rationale: 'Греческое ἐν προγνώσει предельно кратко и допускает несколько оттенков: нахождение в сфере предведения, соответствие предведению или обусловленность им. Основной текст сохраняет эту сжатость и не уточняет связь сверх сказанного в источнике.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Синтаксис сохраняет олицетворение замысленных Богом дел и богословскую неоднозначность заключительной фразы; архаизмы сведены к уместному в данном контексте термину «предведение».
