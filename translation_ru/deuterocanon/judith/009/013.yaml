base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/013.yaml
  text: And make my words and deceit become their wound and bruise[b][a], they who have devised harsh things against your covenant and your sanctified house and the summit of Zion and the house possessed by your sons.
translation:
  language: ru
  text: И сделай так, чтобы моё слово и обман стали для них раной и ушибом[a] — для тех, кто замыслил жестокое против Твоего завета, Твоего освящённого дома, вершины Сиона и дома, составляющего владение Твоих сынов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дай моему слову и обману стать для них раной и ушибом». Греческая конструкция сжата и может подчёркивать как средство, которым воспользуется Иудифь, так и причинённый врагам результат.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая конструкция трудна: буквально речь идёт о «доме владения Твоих сынов». Возможно также: «доме, принадлежащем Твоим сыновьям», «наследии Твоих сынов». Вероятно, имеется в виду земля либо святилище, принадлежащее Божьему народу.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς … εἰς
  choice: сделай так, чтобы … стали
  rationale: В сочетании с εἰς императив δὸς выражает просьбу привести к определённому результату; такая конструкция естественна по-русски и сохраняет направленность действия.
- source_word: λόγον μου
  choice: моё слово
  rationale: «Слово» сохраняет широту λόγος — речь, высказывание или замысел — и не сводит его заранее только к речам Иудифи.
- source_word: ἀπάτην
  choice: обман
  rationale: Прямо передаёт нравственно напряжённое значение греческого слова, не смягчая просьбу Иудифи.
- source_word: εἰς τραῦμα καὶ μώλωπα αὐτῶν
  choice: стали для них раной и ушибом
  rationale: Передаёт результат или цель, выраженные εἰς, и сохраняет парный образ телесного повреждения.
- source_word: ἐβουλεύσαντο σκληρά
  choice: замыслил жестокое
  rationale: Естественно передаёт планирование злых, суровых действий, сохраняя обобщённость субстантивированного σκληρά.
- source_word: διαθήκης σου
  choice: Твоего завета
  rationale: «Завет» сохраняет устойчивое библейско-богословское значение διαθήκη.
- source_word: οἴκου ἡγιασμένου σου
  choice: Твоего освящённого дома
  rationale: Причастная форма «освящённого» передаёт дом как сделанный святым, а не только обладающий качеством святости.
- source_word: κορυφῆς Σιὼν
  choice: вершины Сиона
  rationale: Прямо и естественно сохраняет пространственный образ κορυφή.
- source_word: οἴκου κατασχέσεως υἱῶν σου
  choice: обители, которой владеют Твои сыны
  rationale: Передаёт трудную конструкцию через значение κατάσχεσις как владения или обладания, не отождествляя однозначно обитель ни с землёй, ни со святилищем.
theological_decisions:
- issue: Просьба Иудифи использовать её обман
  choice: Сохранить прямое слово «обман» в основном тексте
  alternative: хитрость; уловка
  rationale: ἀπάτη прямо обозначает обман; перевод не должен устранять нравственно-богословское напряжение текста.
- issue: Значение διαθήκη
  choice: завет
  alternative: союз; договор
  rationale: «Завет» передаёт характерную для библейского контекста связь Бога с Его народом, не превращая её в обычное соглашение.
- issue: Референт οἴκου κατασχέσεως υἱῶν σου
  choice: Оставить неоднозначным как обитель, которой владеют Божьи сыны
  alternative: наследие Твоих сынов; святилище Твоих сынов
  rationale: Греческая фраза трудна и может относиться к жилищу, владению, земле или святилищу народа; конкретизацию следует вынести в примечание.
translation_notes:
  register: Современный литературный русский язык с торжественным молитвенным звучанием. Синтаксис упрощён ровно настолько, чтобы длинный ряд дополнений оставался понятным; прописные местоимения в обращении к Богу используются как издательская норма данного проекта. Оба маркера примечаний помещены непосредственно при относящихся к ним выражениях.
