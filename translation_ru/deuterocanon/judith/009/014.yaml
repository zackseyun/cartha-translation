base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/014.yaml
  text: And bring about[a], upon all your nation and every tribe, recognition, so that they may know that you are the God of all power and might[b], and there is no other who defends the people of Israel except you.
translation:
  language: ru
  text: И сделай так, чтобы весь Твой народ и каждое племя пришли к познанию[a], дабы знали, что Ты — Бог всякой силы и могущества[b] и что нет другого защитника народа Израиля, кроме Тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «признали»; буквально: «обрели полное знание».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Бог всякой силы и могущества».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίησον ... ἐπίγνωσιν
  choice: сделай так, чтобы ... познали
  rationale: Глагол ποιέω управляет существительным ἐπίγνωσις и выражает причинение знания или признания. Русская конструкция с придаточным естественно передаёт этот каузативный смысл.
- source_word: ἐπὶ πᾶν τὸ ἔθνος σου καὶ πάσης φυλῆς
  choice: весь Твой народ и каждое племя
  rationale: ἔθνος здесь обозначает народ как целое, а единственное число πάσης φυλῆς имеет распределительное значение — «каждое племя». Предлог ἐπί передан через русскую синтаксическую конструкцию объекта познания, без неестественной кальки «на».
- source_word: ἐπίγνωσιν, τοῦ εἰδῆσαι
  choice: познали ... что
  rationale: ἐπίγνωσις может означать знание, узнавание или признание; следующий инфинитив раскрывает содержание познания. Глагол «познали» сохраняет смысл осознанного узнавания Бога, а не только получения сведений.
- source_word: ὁ θεὸς πάσης δυνάμεως καὶ κράτους
  choice: Бог всякой силы и могущества
  rationale: δύναμις и κράτος образуют усилительную пару близких понятий. «Сила и могущество» сохраняет оба элемента, не навязывая им чрезмерно узкого различия.
- source_word: ὑπερασπίζων
  choice: защищал
  rationale: Причастие обозначает того, кто выступает в защиту или ограждает; «защищал бы» естественно включается в русскую конструкцию отрицания существования такого лица.
- source_word: τοῦ γένους Ἰσραήλ
  choice: род Израиля
  rationale: γένος означает род, народ, происхождение или племя. «Род Израиля» сохраняет родо-этнический оттенок греческого выражения и звучит уместно в возвышенной молитве.
- source_word: εἰ μὴ σύ
  choice: кроме Тебя
  rationale: 'Передаёт исключительность: никакого иного защитника Израиля нет.'
theological_decisions:
- issue: Исключительность Бога как защитника Израиля
  choice: нет никого другого, кто защищал бы род Израиля, кроме Тебя
  alternative: нет другого защитника народа Израиля, кроме Тебя одного
  rationale: Перевод сохраняет прямое исключительное утверждение греческого текста, не расширяя его до более общего догматического тезиса.
- issue: Бог как обладатель всей силы и могущества
  choice: Бог всякой силы и могущества
  alternative: Бог над всякой силой и властью
  rationale: Родительный падеж в греческом допускает оттенки обладания или сферы, но буквальная конструкция «Бог всякой силы и могущества» сохраняет исходную неоднозначность и не превращает её однозначно в утверждение о власти над иными силами.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Обращение к Богу оформлено традиционными прописными местоимениями. Синтаксис сделан естественным для русского языка, при этом сохранены парность «силы и могущества», распределительное «каждое племя» и исключительность последнего утверждения.
