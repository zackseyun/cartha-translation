base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/011.yaml
  text: For your power is not in a multitude[a], nor is your dominion among the strong; rather, you are God of the lowly, helper of the lesser, supporter of the weak, shelter of the forsaken[b], savior of those without hope.
translation:
  language: ru
  text: Ибо не во множестве сила Твоя, и не в сильных — владычество Твоё; но Ты — Бог униженных, помощник малых, опора немощных, покров тех, кого сочли безнадёжными[a], спаситель утративших надежду[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отчаявшихся». Греческое слово может обозначать как тех, кого сочли погибшими или безнадёжными, так и людей, впавших в отчаяние.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избавитель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήθει
  choice: во множестве
  rationale: Сохраняет конкретное значение множества или многочисленности, не сужая его до военной численности.
- source_word: κράτος
  choice: сила
  rationale: Передаёт действенную мощь; естественно образует первую часть параллельной конструкции.
- source_word: δυναστεία
  choice: владычество
  rationale: Отражает власть и господство, отличая это слово от κράτος — «сила».
- source_word: ἐν ἰσχύουσιν
  choice: в сильных
  rationale: Буквально и сжато передаёт субстантивированное причастие «те, кто силён/могуществен» и греческую конструкцию с ἐν.
- source_word: ταπεινῶν
  choice: униженных
  rationale: В данном ряду обозначает людей низкого, притеснённого положения, а не только внутренне смиренных.
- source_word: ἐλαττόνων
  choice: малых
  rationale: Естественное русское обозначение людей меньшего положения или значения; сохраняет смысл сравнительной формы без тяжеловесного «меньших».
- source_word: βοηθός
  choice: помощник
  rationale: Прямо передаёт предикативное существительное и сохраняет цепь божественных наименований.
- source_word: ἀντιλήμπτωρ
  choice: опора
  rationale: Передаёт образ того, кто поддерживает и удерживает слабого, не смешивая его со следующим образом покрова.
- source_word: ἀσθενούντων
  choice: немощных
  rationale: Охватывает слабость, бессилие и неспособность, не ограничивая значение физической болезнью.
- source_word: ἀπεγνωσμένων
  choice: тех, кого оставили на погибель
  rationale: 'Передаёт пассивный оттенок совершенного причастия: людей, которых сочли безнадёжными и оставили как погибших; отличает их от следующей группы утративших надежду.'
- source_word: σκεπαστής
  choice: покров
  rationale: Сохраняет метафору укрытия и защиты в компактной именной форме.
- source_word: ἀπηλπισμένων
  choice: утративших надежду
  rationale: Точно выражает состояние тех, кто лишился надежды, и сохраняет отличие от ἀπεγνωσμένων.
- source_word: σωτήρ
  choice: спаситель
  rationale: Основное значение слова; уместно в возвышенной молитвенной речи и не добавляет содержания сверх оригинала.
theological_decisions:
- issue: Форма последовательности божественных предикатов
  choice: 'Сохранена компактная именная цепь: «Бог… помощник… опора… покров… спаситель».'
  alternative: 'Развернуть её в глагольную парафразу: «Ты помогаешь… поддерживаешь… защищаешь… спасаешь».'
  rationale: Греческий текст складывает литанийный ряд наименований Бога; именная структура сохраняет риторику и не превращает утверждения о том, кто Он есть, лишь в описание действий.
- issue: Различение ἀπεγνωσμένων и ἀπηλπισμένων
  choice: Первое понято преимущественно пассивно — «те, кого оставили на погибель», второе — как утратившие надежду.
  alternative: Оба выражения передать как «отчаявшиеся».
  rationale: Различение сохраняет намеренный ряд близких, но не тождественных обозначений уязвимых людей и не устраняет лексическую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Инверсия «сила Твоя», «владычество Твоё» поддерживает возвышенный ритм, оставаясь понятной. Тире во второй параллельной части и после «Ты» проясняют компактные именные конструкции. Все сноски поставлены при словах, к которым они относятся; их расположение исправляет несоответствие маркеров в консультационном английском слое.
