base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/007.yaml
  text: For behold[a], the Assyrians have multiplied in their strength; they have been exalted on horse and rider; they have boasted in the arm of foot soldiers; they have hoped in shield and spear and bow and sling, and they have not known that you are the Lord[b], the one who shatters wars.
translation:
  language: ru
  text: Ибо вот, ассирийцы умножились в своей силе; они превознеслись благодаря коням и всадникам, кичились мощью пеших воинов, уповали[a] на щит, копьё, лук и пращу — и не познали, что Ты — Господь[b], сокрушающий войны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доверились щиту, копью, луку и праще». Греческий глагол может означать как надежду, так и доверие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или по смыслу: «прекращающий войны». Буквально: «сокрушающий войны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Ибо вот
  rationale: Передаёт и причинно-пояснительное γάρ, и призыв обратить внимание в ἰδού, сохраняя возвышенный тон молитвы.
- source_word: ἐπληθύνθησαν ἐν δυνάμει αὐτῶν
  choice: умножили свои силы
  rationale: Естественная русская передача увеличения ассирийской военной мощи; буквальное «умножились в своей силе» звучало бы неясно и искусственно.
- source_word: ὑψώθησαν ἐφʼ ἵππῳ καὶ ἀναβάτῃ
  choice: возгордились конями и всадниками
  rationale: ὑψώθησαν здесь описывает надменное возвышение благодаря коннице. Собирательные единственные числа переданы естественными для русского языка множественными.
- source_word: ἐγαυρίασαν ἐν βραχίονι πεζῶν
  choice: кичились мощью пеших воинов
  rationale: Глагол выражает горделивое хвастовство, а «рука» служит образом силы. «Мощь пеших воинов» сохраняет смысл метафоры и остаётся понятной современному читателю.
- source_word: ἤλπισαν
  choice: уповали
  rationale: Глагол допускает значения надежды и доверия. «Уповали на» естественно сочетается с перечислением оружия и сохраняет религиозно-нравственный контраст с упованием на Бога.
- source_word: γαίσῳ
  choice: копьё
  rationale: Общее и понятное обозначение древкового колющего или метательного оружия без неоправданного уточнения его типа.
- source_word: σφενδόνῃ
  choice: пращу
  rationale: Точное традиционное русское название древнего метательного оружия, понятное в библейском контексте.
- source_word: οὐκ ἔγνωσαν
  choice: не познали
  rationale: Сохраняет смысл не просто отсутствия сведений, но непризнания того, кто есть Бог; возвышенная форма уместна в молитве.
- source_word: συντρίβων πολέμους
  choice: сокрушающий войны
  rationale: Сохраняет конкретный и сильный образ греческого причастия, не сводя его без пояснения к более абстрактному «прекращающий».
theological_decisions:
- issue: Передача κύριος в молитвенном обращении к Богу Израиля
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — прямой и естественный эквивалент κύριος в данном исповедальном высказывании; он не подменяет греческое слово реконструкцией тетраграмматона.
- issue: Понимание συντρίβων πολέμους
  choice: сокрушающий войны
  alternative: прекращающий войны
  rationale: 'Основной текст сохраняет намеренно резкую метафору источника: Бог разбивает войны и военную мощь. Более гладкое функциональное толкование вынесено в примечание.'
translation_notes:
  register: Современный литературный русский язык с возвышенным молитвенным ритмом. Военная лексика остаётся конкретной и доступной; архаизмы ограничены общеупотребительными библейскими словами «уповали», «праща» и «познали». Параллельные части греческой фразы сохранены посредством точки с запятой и перечисления.
