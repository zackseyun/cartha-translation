  source_fidelity: '«Умножили свои силы» меняет греческую непереходную форму ἐπληθύνθησαν: в оригинале ассирийцы сами стали многочисленнее/возросли в силе, а не произвели действие над «силами». Остальные основные соответствия верны: конница, сила пехоты, вооружение, упование на оружие и образ Бога, «сокрушающего войны», переданы без существенных смысловых потерь.'
