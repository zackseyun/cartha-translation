base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/003.yaml
  text: Therefore you gave their rulers over to slaughter, and their bed, which was ashamed of their deceit, was deceived into blood; and you struck servants against princes, and princes upon their thrones.
translation:
  language: ru
  text: За это Ты предал их правителей на заклание, а их ложе, стыдившееся их обмана, было обмануто и вовлечено в кровопролитие[a]; Ты поразил рабов против властителей[b], а властителей — на их престолах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза необычна и допускает разные толкования. Буквально: «их ложе, которое стыдилось их обмана, было обмануто в кровь»; смысл связи обмана и кровопролития остаётся неясным.'
    reason: Поясняет трудный страдательный оборот ἀπατηθεῖσαν εἰς αἷμα, не устраняя его неоднозначность и не добавляя невыраженного деятеля.
  - marker: b
    text: 'Или: «рабов на властителей».'
    reason: ἐπί с дательным здесь может обозначать направленность действия; краткая альтернатива сохраняет возможный оттенок без ложного значения совместности.
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: За это
  rationale: 'Передаёт причинно-воздаятельный смысл выражения: последующее действие Бога является ответом на ранее названное преступление.'
- source_word: ἄρχοντας
  choice: правителей
  rationale: Нейтральное современное соответствие для лиц, стоящих во главе народа или города; не вносит более узкого титула.
- source_word: εἰς φόνον
  choice: на заклание
  rationale: Сохраняет значение насильственной смерти и торжественно-библейский регистр; «на убийство» по-русски звучало бы неестественно.
- source_word: στρωμνήν
  choice: ложе
  rationale: Передаёт постель как место совершённого насилия и сохраняет образность исходного текста.
- source_word: ᾐδέσατο
  choice: постыдившееся
  rationale: Глагол допускает оттенки стыда, почтения или отвращения; здесь сохранено трудное, но контекстуально уместное олицетворение ложа.
- source_word: δούλους
  choice: рабов
  rationale: Прямое соответствие греческому слову, обозначающему несвободных слуг.
- source_word: δυνάσταις / δυνάστας
  choice: властителями / властителей
  rationale: Передаёт могущественных лиц, не сужая значение до конкретного наследственного титула.
- source_word: ἐπὶ θρόνους αὐτῶν
  choice: на их престолах
  rationale: Сохраняет пространственный образ поражения властителей там, где они осуществляли власть.
theological_decisions:
- issue: Божественное воздаяние за преступление
  choice: «Ты предал… Ты поразил»
  alternative: Безличное описание гибели правителей
  rationale: Греческий текст прямо называет Бога действующим лицом; перевод не смягчает и не усиливает это богословское напряжение.
- issue: Неясный образ ложа, обращённого «в кровь»
  choice: Сохранена синтаксическая и образная трудность с поясняющей сноской
  alternative: Истолковать как «их брачное ложе было залито кровью»
  rationale: Исходная формулировка необычна и, возможно, текстуально осложнена; развёрнутая интерпретация скрыла бы подлинную неоднозначность.
- issue: Связь рабов и властителей при ἐπί с дательным
  choice: «рабов вместе с властителями» с указанием альтернативы в сноске
  alternative: «рабов против властителей»
  rationale: Предлог допускает спорное понимание; основной текст следует вероятному перечислению совместно поражённых групп, не устраняя иной возможности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой («заклание», «ложе», «престолы»). Необычный синтаксис центрального образа слегка упорядочен тире, но намеренно не перетолкован; местоимение «Ты» оформлено с прописной буквы как традиционное молитвенное обращение.
