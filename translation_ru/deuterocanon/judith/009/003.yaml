  source_fidelity: 'Начальное «За это Ты предал их правителей на заклание» точно передаёт ἀνθʼ ὧν ἔδωκας ἄρχοντας αὐτῶν εἰς φόνον. В центральной части исходник намеренно труден: στρωμνήν является объектом, ἣ ᾐδέσατο τὴν ἀπάτην αὐτῶν — относительным определением, а ἀπατηθεῖσαν εἰς αἷμα — страдательным причастием с результативным оборотом. В черновике конструкция «— обманутое — в кровь» не образует грамматически и семантически приемлемого русского высказывания. Для ἐπὶ δυνάσταις предпочтительно значение направленности «против», что также согласуется с английской POB-аудиторией; «вместе с» недостаточно обосновано.'
  naturalness: 'Текст нуждается в исправлении центральной фразы: согласованное определение «обманутое» без сказуемого и оборот «в кровь» звучат как буквальный подстрочник. «Ложе, ... было обмануто и вовлечено в кровопролитие» сохраняет олицетворение и неясность, но является современным литературным русским. «На заклание», «ложе» и «престолах» уместны в умеренно возвышенном библейском регистре.'
  terminology: «Правители» для ἄρχοντες, «рабы» для δοῦλοι и «властители» для δυνάσται сохраняют различие терминов и не навязывают титулатуру. Прописное «Ты» допустимо в русской молитвенной речи. Сноска должна пояснять сложность центрального греческого оборота, не предлагая грамматически неподтверждённого варианта «обманом предал крови».
