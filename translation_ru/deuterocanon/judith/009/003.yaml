revisions:
- from: За это Ты предал их правителей на заклание, а их ложе, постыдившееся их обмана, — обманутое — в кровь[a]; Ты поразил рабов вместе с властителями[b], а властителей — на их престолах.
  to: За это Ты предал их правителей на заклание, а их ложе, стыдившееся их обмана, было обмануто и вовлечено в кровопролитие[a]; Ты поразил рабов против властителей[b], а властителей — на их престолах.
  rationale: Исправлена неестественная и грамматически незавершённая передача центрального образа. Новый текст сохраняет олицетворённое «ложе», его стыд и пассивное «было обмануто», передавая εἰς αἷμα как вовлечение в кровопролитие; сноска даёт буквальную форму и отмечает неясность. «Против властителей» точнее передаёт наиболее вероятное значение ἐπὶ с дательным и согласуется с английским POB audit trail. Смысл воздаяния, терминологические различия и финальное «на их престолах» сохранены.
