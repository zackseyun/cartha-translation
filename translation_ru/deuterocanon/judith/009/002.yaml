base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/009/002.yaml
  text: And she said[a], “O Lord, God of my father Simeon, to whom you gave a sword in his hand for vengeance against foreigners, who loosed a virgin’s womb for defilement and bared the thigh for shame and profaned the womb for disgrace—though you said, ‘It shall not be so’[c][b]; but they did it.”
translation:
  language: ru
  text: 'И сказала она: «Господи, Боже отца моего Симеона! Ты дал ему в руку меч, чтобы отомстить чужеземцам, которые нарушили лоно девы для осквернения[a], обнажили бедро на позор[b] и осквернили лоно на поругание. Ибо Ты сказал: „Да не будет так“, — но они сделали это[c]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «развязали лоно девы для осквернения». Это эвфемистическое, но ясное в данном контексте указание на сексуальное насилие.'
    reason: lexical_alternative
  - marker: b
    text: «Обнажить бедро» — образ сексуального унижения и насилия; ср. рассказ о Дине и Симеоне в Быт. 34.
    reason: cultural_note
  - marker: c
    text: 'Возможен также перевод: «Этого не случится». В контексте фраза, вероятно, выражает Божье установление: «Да не будет так».'
    reason: ambiguity
lexical_decisions:
- source_word: Κύριε
  choice: Господи
  rationale: Естественная русская форма прямого молитвенного обращения к Богу; не вводит особого соответствия тетраграмматону.
- source_word: ὁ θεὸς τοῦ πατρὸς μου Συμεών
  choice: Боже отца моего Симеона
  rationale: Сохраняет синтаксическую связь имени Симеона со словом «отца» и торжественный молитвенный строй.
- source_word: ᾧ ἔδωκας ἐν χειρὶ ῥομφαίαν
  choice: Ты дал ему в руку меч
  rationale: Передаёт конкретный греческий образ ἐν χειρί, не заменяя его истолковывающим «вооружил».
- source_word: εἰς ἐκδίκησιν ἀλλογενῶν
  choice: чтобы отомстить иноплеменникам
  rationale: Передаёт значение возмездия и обозначает этнически чужих людей без позднейшего технического оттенка слова «язычники».
- source_word: οἳ ἔλυσαν μήτραν παρθένου
  choice: которые растлили девственное лоно
  rationale: Греческое выражение одновременно эвфемистично и явно указывает на сексуальное насилие. Буквальное «развязали лоно девы» по-русски не передаёт смысла естественно; «растлили» сохраняет оттенки нарушения целости и осквернения.
- source_word: εἰς μίασμα
  choice: растлили
  rationale: Значение μίασμα — осквернение, нечистота — включено в глагольное выражение, чтобы избежать неестественного «для осквернения».
- source_word: ἐγύμνωσαν μηρὸν εἰς αἰσχύνην
  choice: обнажили бедро на позор
  rationale: Сохраняет телесный образ и его функцию унижения, не раскрывая эвфемизм прямо в основном тексте.
- source_word: ἐβεβήλωσαν μήτραν εἰς ὄνειδος
  choice: осквернили лоно на поругание
  rationale: «Осквернили» передаёт профанирующую силу βεβηλόω, а «на поругание» — публичный стыд и бесчестье ὄνειδος.
- source_word: εἶπας γὰρ Οὐχ οὕτως ἔσται
  choice: 'Ведь Ты сказал: «Да не будет так»'
  rationale: «Ведь» сохраняет γάρ, а формула «Да не будет так» естественно выражает запрещающе-нормативный смысл, не сводя фразу к простому предсказанию.
- source_word: καὶ ἐποίησαν
  choice: но они сделали это
  rationale: Контекстуальное «но» выявляет резкое противопоставление Божьей воле; «это» естественно восполняет подразумеваемый объект.
theological_decisions:
- issue: Степень явности описания сексуального насилия
  choice: Сохранить последовательность трёх образов — растление девственного лона, обнажение бедра и осквернение лона — не заменяя её одним словом «изнасиловали».
  alternative: 'Передать прямо: «изнасиловали деву», либо смягчить до «обесчестили её».'
  rationale: Три исходных выражения различают нарушение телесной целости, позор и осквернение. Их сжатие в один термин утратило бы риторическую и нравственно-богословскую насыщенность стиха.
- issue: Смысл фразы Οὐχ οὕτως ἔσται
  choice: «Да не будет так» как выражение Божьей воли или запрета.
  alternative: «Этого не случится» как предсказание.
  rationale: Контраст с «но они сделали это» указывает не только на событие вопреки предсказанию, но прежде всего на поступок вопреки Божьему установлению; неоднозначность отмечена тем, что фраза остаётся краткой.
- issue: Характер мести Симеона
  choice: Передать ἐκδίκησις нейтрально как «отомстить», не добавляя прямого одобрения или осуждения.
  alternative: «покарать» или «совершить правосудие», что яснее легитимировало бы насилие; либо «учинить месть», что сильнее осудило бы его.
  rationale: Молитва Юдифи истолковывает действие Симеона как возмездие, но перевод не должен разрешать более широкое нравственное напряжение рассказа от себя.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Формы «Господи», «Боже», «лоно», «поругание» поддерживают торжественный регистр, оставаясь понятными; синтаксис несколько упрощён по сравнению с греческой длинной цепью, но её нарастание сохранено.
