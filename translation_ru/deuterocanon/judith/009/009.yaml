lexical_decisions:
- source_word: βλέψον
  choice: Взгляни
  rationale: Повелительная форма выражает молитвенный призыв к Богу обратить внимание; «взгляни» сохраняет возвышенность без архаичности.
- source_word: ὑπερηφανίαν
  choice: высокомерие
  rationale: Передаёт надменную, вызывающую гордость и естественно звучит в современном русском языке.
- source_word: ἀπόστειλον τὴν ὀργήν σου
  choice: пошли Свой гнев
  rationale: Близко передаёт повелительное ἀπόστειλον и карающий смысл ὀργή в контексте Божьего суда.
- source_word: εἰς κεφαλὰς αὐτῶν
  choice: на их головы
  rationale: Сохраняет конкретный греческий образ кары, нисходящей на виновных.
- source_word: δὸς ... κράτος
  choice: дай силу
  rationale: Кратко и прямо передаёт просьбу наделить задуманное действенной силой; κράτος допускает значения «сила», «мощь», «власть».
- source_word: ὃ διενοήθην
  choice: тому, что я задумала
  rationale: Женский род определяется говорящей Юдифью; «задумала» передаёт намерение, не добавляя отсутствующего в тексте оттенка обмана.
- source_word: ἐν χειρί μου τῆς χήρας
  choice: рукой моей — вдовы
  rationale: Сохраняет образ руки, возможное инструментальное значение ἐν и подчёркнутое самообозначение Юдифи как вдовы, при этом оставаясь приемлемым по-русски.
theological_decisions:
- issue: Синтаксическая связь κράτος, ἐν χειρί μου τῆς χήρας и ὃ διενοήθην
  choice: Просьба придать силу задуманному Юдифью и осуществить это её рукой — рукой вдовы
  alternative: «Дай в руку мне, вдове, силу для того, что я задумала»
  rationale: Греческая заключительная фраза синтаксически сжата. Основной текст сохраняет одновременно Божье наделение силой, образ руки как орудия действия и упоминание вдовства, а примечание показывает близкое альтернативное членение, не устраняя подлинной неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис первых двух прошений параллелен; заключительная фраза намеренно сохраняет некоторую необычность и неоднозначность греческого оригинала.
