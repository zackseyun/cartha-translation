base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/021.yaml
  text: After these days[a], each one returned to his own inheritance, and Judith went away to Bethulia and remained on her own property[c][b], and in her time she became renowned throughout all the land.
translation:
  language: ru
  text: По прошествии этих дней каждый возвратился в свой удел[a], а Иудифь отправилась в Ветилую и осталась в своём имении[b]; при жизни она стала широко почитаемой по всей стране[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своё наследственное владение». Греческое слово может обозначать наследие, удел или доставшуюся в надел землю.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в своём владении»; речь идёт о принадлежавшем Иудифи земельном владении или имуществе.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «стала прославленной по всей стране». Греческое слово означает, что её высоко чтили и широко признавали.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: После этих дней
  rationale: Передаёт временной переход буквально и естественно, не заменяя ἡμέρας более общим «события».
- source_word: ἀνέζευξεν
  choice: возвратился
  rationale: Хотя глагол может означать снятие с места или выступление в путь, направление к своему уделу указывает здесь на возвращение.
- source_word: εἰς τὴν κληρονομίαν αὐτοῦ
  choice: в свой удел
  rationale: «Удел» сохраняет смысл наследственной или распределённой земли и библейскую окраску κληρονομία, оставаясь естественным по-русски.
- source_word: ἀπῆλθεν εἰς Βαιτυλουὰ
  choice: отправилась в Ветилую
  rationale: «Отправилась» передаёт оттенок ухода, выраженный ἀπῆλθεν; топоним дан в принятой русской библейской форме.
- source_word: κατέμεινεν ἐπὶ τῆς ὑπάρξεως αὐτῆς
  choice: осталась в своём владении
  rationale: Фраза обозначает продолжение жизни в принадлежавшем Иудифи владении; перевод не придаёт ему непременно аристократического смысла.
- source_word: κατὰ τὸν καιρὸν αὐτῆς
  choice: При жизни
  rationale: В данном контексте естественно обозначает период её жизни, избегая неясного русского оборота «в своё время».
- source_word: ἔνδοξος ἐν πάσῃ τῇ γῇ
  choice: пользовалась почётом по всей стране
  rationale: Передаёт общественное признание и почёт, заключённые в ἔνδοξος, а γῆ понимается как страна, не вся земля или мир.
theological_decisions:
- issue: Передача κληρονομία в контексте возвращения на землю
  choice: удел
  alternative: наследие; наследственное владение
  rationale: «Удел» сохраняет связь с распределённой или родовой землёй и не сводит выражение к обычной недвижимости.
- issue: Характер славы Иудифи в слове ἔνδοξος
  choice: пользовалась почётом
  alternative: была прославлена; была знаменита
  rationale: Выражение подчёркивает её почётное положение и признание среди людей, не привнося специального богословского смысла славы.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским повествовательным оттенком. «Удел» сохраняет библейскую земельную образность; более архаичные «достояние» и «восхвалена» не используются. Маркер [c] поставлен после относящегося к нему утверждения, а не у слова о владении, как ошибочно следует из порядка маркеров в консультационном английском слое.
