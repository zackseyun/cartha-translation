- source_word: Πέρσαι
  choice: персы
  rationale: Субстантивированное название народа естественно передаётся русским множественным числом.
- source_word: τὴν τόλμαν αὐτῆς
  choice: от её отваги
  rationale: τόλμα обозначает смелость и решимость; «отвага» уместна в контексте поступка Иудифи, а предлог «от» ясно выражает причину реакции.
- source_word: Μῆδοι
  choice: мидяне
  rationale: Общепринятое русское название народа.
- source_word: τὸ θράσος αὐτῆς
  choice: её дерзостью
  rationale: «Дерзость» сохраняет смысл смелого, рискованного действия и возможный оттенок вызывающей audacity, отличая θράσος от близкого τόλμα.
- source_word: ἐρράχθησαν
  choice: были потрясены
  rationale: Пассивная форма передаёт состояние сильного потрясения или смятения; перевод сохраняет параллель с «содрогнулись».
