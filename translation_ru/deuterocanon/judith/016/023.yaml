  yaml_path: translation/deuterocanon/judith/016/023.yaml
  text: And she continued to prosper greatly[a], and she grew old in her husband's house for one hundred five years, and she set her maidservant free. Then she died in Bethulia[b], and they buried her in the cave of her husband Manasseh.
translation:
  language: ru
  text: И она весьма преуспевала[a] и дожила в доме своего мужа до ста пяти лет. Свою служанку[b] она отпустила на свободу. Затем она умерла в Ветилуе, и её похоронили в пещере её мужа Манассии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «она стала весьма великой»; греческое выражение буквально передаёт мысль о продвижении или возрастании, усиленную словом «весьма».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово обозначает служанку или прислужницу; слова «отпустила на свободу» показывают, что она находилась в несвободном, зависимом положении.
    reason: lexical_and_social_status_clarification
lexical_decisions:
- source_word: προβαίνουσα μεγάλη σφόδρα
  choice: всё более преуспевала
  rationale: Описательная конструкция буквально выражает движение вперёд или возрастание, причём μεγάλη σφόδρα сильно усиливает смысл. Русское «всё более преуспевала» естественно передаёт развитие и благополучие, а буквальная неоднозначность отмечена в сноске.
- source_word: ἐγήρασεν ... ἔτη ἑκατὸν πέντε
  choice: дожила ... до ста пяти лет
  rationale: По контексту число обозначает достигнутый Иудифью возраст. Такая формулировка по-русски яснее, чем двусмысленное «состарилась ... сто пять лет».
- source_word: ἐν τῷ οἴκῳ τοῦ ἀνδρὸς αὐτῆς
  choice: в доме своего мужа
  rationale: Прямая и естественная передача местного оборота без излишнего расширения до значения «домочадцы» или «род».
- source_word: ἀφῆκεν τὴν ἅβραν αὐτῆς ἐλευθέραν
  choice: свою служанку она отпустила на свободу
  rationale: Глагол и предикативное прилагательное вместе ясно обозначают освобождение. Существительное называет личную служанку или прислужницу; действие освобождения указывает на её несвободный статус.
- source_word: εἰς Βαιτυλουὰ
  choice: в Ветилуе
  rationale: При глаголе смерти εἰς в позднем греческом может обозначать место. «В Ветилуе» — естественная русская передача.
- source_word: ἐν τῷ σπηλαίῳ τοῦ ἀνδρὸς αὐτῆς Μανασσῆ
  choice: в пещере, где был погребён её муж Манассия
  rationale: Буквальное «в пещере её мужа» по-русски может звучать как указание на собственность. Контекст погребения показывает, что имеется в виду семейная погребальная пещера, где покоился Манассия.
theological_decisions:
- issue: Социальное положение женщины, которую Иудифь освободила
  choice: служанка, с явным указанием «отпустила на свободу»
  alternative: рабыня; прислужница
  rationale: ἅβρα обозначает женскую прислугу, а не использует обычный общий термин для раба; однако освобождение показывает юридически зависимое, несвободное положение. Основной текст сохраняет бытовую роль, а сноска поясняет статус.
- issue: Характер возвышения Иудифи
  choice: всё более преуспевала
  alternative: становилась всё более великой; всё более возвышалась
  rationale: Греческое выражение допускает оттенки благополучия, роста влияния и почёта. Нейтральное «преуспевала» не сводит его исключительно к богатству или общественной славе, а сноска сохраняет буквальные варианты.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис разделён на три ясные фразы; повтор союзов греческого оригинала сокращён там, где он был бы тяжеловесен по-русски. Топоним передан как «Ветилуя», имя — «Манассия» в формах, привычных русской библейской традиции.
