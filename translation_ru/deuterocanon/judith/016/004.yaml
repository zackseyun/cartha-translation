  source_fidelity: 'Перечень угроз и его параллельная структура в целом переданы точно: ἐμπρήσειν — «предаст огню», ἀνελεῖν ῥομφαίᾳ — «убьёт мечом», а θήσει εἰς ἔδαφος допустимо передано как «бросит наземь» в контексте насилия. Однако «отдаст на разграбление» менее точно отражает δώσει εἰς προνομὴν: младенцы названы добычей, а не объектом разграбления. «Лишит всего» без прямого дополнения несколько ослабляет и размывает σκυλεῦσαι, где девы являются прямым объектом обирания/лишения.'
