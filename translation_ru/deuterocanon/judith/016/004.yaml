  text: He said he would set my mountains on fire[a], and kill my young men with the sword, and throw my nursing children to the ground, and give my infants as plunder, and despoil my virgins.
translation:
  language: ru
  text: Он сказал, что предаст огню мои горы, моих юношей убьёт мечом, моих грудных детей бросит наземь, моих младенцев отдаст как добычу, а моих дев лишит всего[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обесчестит моих дев». Греческий глагол буквально означает «обобрать», «раздеть», «лишить всего», но в контексте военного насилия может подразумевать и сексуальное поругание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν ... ἐμπρήσειν ... ἀνελεῖν ... σκυλεῦσαι
  choice: Он сказал, что предаст ... убьёт ... лишит
  rationale: Инфинитивная последовательность после εἶπεν естественно передана по-русски придаточным изъяснительным; будущие формы выражают заявленное намерение врага.
- source_word: ἐμπρήσειν τὰ ὅρη μου
  choice: предаст огню мои горы
  rationale: ἐμπρήσειν означает сжечь или поджечь; выражение «предаст огню» сохраняет яркость поэтической угрозы и буквальный образ гор.
- source_word: τοὺς νεανίσκους μου ἀνελεῖν ῥομφαίᾳ
  choice: моих юношей убьёт мечом
  rationale: νεανίσκους — молодые мужчины, без обязательного военного оттенка; ἀνελεῖν в данном контексте прямо означает убить, а ῥομφαίᾳ обозначает орудие убийства — меч.
- source_word: τὰ θηλάζοντά μου θήσει εἰς ἔδαφος
  choice: моих грудных детей бросит наземь
  rationale: θηλάζοντα — дети у груди. Буквальное θήσει — «положит», но в ряду военных зверств конструкция εἰς ἔδαφος подразумевает насильственное бросание; «бросит наземь» передаёт контекст, не усиливая его до «разобьёт».
- source_word: τὰ νήπιά μου δώσει εἰς προνομὴν
  choice: моих младенцев отдаст на разграбление
  rationale: νήπια — совсем малые дети; προνομή означает добычу, грабёж или расхищение. «Отдаст на разграбление» естественно показывает, что младенцев обрекут стать добычей.
- source_word: τὰς παρθένους
  choice: моих дев
  rationale: παρθένοι обозначает незамужних девушек и может подчёркивать девственность. «Девы» — традиционное, но понятное современному читателю обозначение, сохраняющее этот смысл без тяжеловесного «девственниц».
- source_word: σκυλεῦσαι
  choice: лишит всего
  rationale: Глагол означает обобрать, снять одежду, лишить имущества или сделать добычей. Русское «лишит всего» сохраняет широту значения и не делает сексуальное насилие явным там, где греческий глагол сам по себе его прямо не называет.
theological_decisions:
- issue: Следует ли прямо обозначить сексуальное насилие над девами
  choice: лишит всего
  alternative: обесчестит / подвергнет насилию
  rationale: σκυλεῦσαι прежде всего значит «обобрать, раздеть, лишить добычи». Контекст военных зверств допускает сексуальный подтекст, однако не требует однозначно вводить его в основной текст; неоднозначность сохранена с пояснением в сноске.
translation_notes:
  register: Современный литературный русский с приподнятым поэтическим строем, соответствующим песне Иудифи. Синтаксический параллелизм перечня сохранён. Архаизмы сведены к минимуму; «дев» употреблено как краткое и достоинственное соответствие παρθένους.
