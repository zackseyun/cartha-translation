base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/001.yaml
  text: Begin the song to my God with tambourines[a]; sing to the Lord with cymbals; fit to him a psalm and praise[b]; exalt and call upon his name.
translation:
  language: ru
  text: Начните песнь Богу моему под звуки бубнов[a], пойте Господу под звуки кимвалов; стройно сложите для Него псалом и хвалу[b], превозносите Его и призывайте имя Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Запевайте Богу моему под звуки бубнов». Греческий глагол может означать начать песнь или запеть её первым.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «согласуйте для Него псалом и хвалу» либо «пойте Ему в лад псалом и хвалу». Глагол передаёт образ приведения псалма и хвалы в музыкальный строй или лад.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξάρχετε
  choice: Начните песнь
  rationale: Императив множественного числа от ἐξάρχω в музыкальном контексте означает начинать или запевать; дополнение «песнь» подразумевается контекстом и делает русскую фразу естественной.
- source_word: τῷ θεῷ μου
  choice: Богу моему
  rationale: Дательный падеж передаёт адресата пения; постпозиция местоимения сохраняет возвышенный, но понятный регистр.
- source_word: ἐν τυμπάνοις
  choice: под звуки бубнов
  rationale: τύμπανον обозначает ручной барабан или бубен; оборот естественно выражает инструментальное сопровождение.
- source_word: ᾄσατε τῷ κυρίῳ ἐν κυμβάλοις
  choice: пойте Господу под звуки кимвалов
  rationale: Сохраняются простой императив, адресат в дательном падеже и музыкальное сопровождение; «кимвалы» — устоявшееся библейское название инструмента.
- source_word: ἐναρμόσασθε
  choice: стройно сложите
  rationale: Глагол выражает приведение в лад, согласование или музыкальное устройство; перевод сохраняет образ составления произведения и звучит естественнее буквального «приладьте».
- source_word: αὐτῷ ψαλμὸν καὶ αἶνον
  choice: для Него псалом и хвалу
  rationale: «Псалом» сохраняет литургическое значение ψαλμός, а «хвала» прямо передаёт αἶνος; «для Него» естественно выражает дательный αὐτῷ.
- source_word: ὑψοῦτε
  choice: превозносите
  rationale: В контексте поклонения означает возвеличивать и прославлять; «превозносите» сохраняет библейскую образность без архаической формы.
- source_word: ἐπικαλεῖσθε τὸ ὄνομα αὐτοῦ
  choice: призывайте имя Его
  rationale: Устойчивое библейское выражение передаёт молитвенно-богослужебный смысл ἐπικαλέομαι и сохраняет упоминание имени.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — общепринятая передача κύριος в обращённом к Богу гимническом контексте, не добавляющая конфессионально специфического толкования.
- issue: Связь ὑψοῦτε с последующим «имя Его»
  choice: «превозносите» употреблено без добавленного прямого дополнения; «имя Его» грамматически относится к «призывайте»
  alternative: «превозносите и призывайте имя Его», где имя понимается общим дополнением обоих глаголов
  rationale: В греческом τὸ ὄνομα αὐτοῦ непосредственно следует за ἐπικαλεῖσθε; сохранена возможная синтаксическая напряжённость без добавления «Его» после первого глагола.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным гимническим звучанием. «Кимвалы», «псалом», «превозносите» и постпозиция в «имя Его» сохраняют библейский регистр; синтаксис остаётся доступным современному читателю.
