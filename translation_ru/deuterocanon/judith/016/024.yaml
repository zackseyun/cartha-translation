    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπένθησεν
  choice: оплакивал
  rationale: Глагол обозначает траур по умершей; «оплакивал» естественно передаёт погребальный контекст.
- source_word: οἶκος Ἰσραήλ
  choice: дом Израиля
  rationale: Сохраняет библейский коллективный образ и форму греческого выражения.
- source_word: ἡμέρας ἑπτά
  choice: семь дней
  rationale: Естественное обозначение продолжительности действия в русском языке.
- source_word: διεῖλεν
  choice: разделила
  rationale: Близко передаёт значение распределения имущества между родственниками.
- source_word: τὰ ὑπάρχοντα αὐτῆς
  choice: своё имущество
  rationale: Выражение охватывает принадлежавшую ей собственность и уместно в контексте наследования.
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτήν
  choice: перед смертью
  rationale: Идиоматично передаёт временное предшествование, выраженное конструкцией с πρό.
- source_word: πᾶσι τοῖς ἔγγιστα
  choice: между всеми ближайшими родственниками
  rationale: Субстантивированное наречие указывает на наиболее близких людей; контекст распределения имущества уточняет родство.
- source_word: Μανασσῆ τοῦ ἀνδρὸς αὐτῆς
  choice: своего мужа Манассии
  rationale: Генитивное приложение определяет Манассию как её мужа; русская форма естественна и ясна.
- source_word: τοῦ γένους αὐτῆς
  choice: из своего рода
  rationale: «Род» сохраняет значение родственной линии или группы, присущее γένος, и отличает её родню от родни мужа.
