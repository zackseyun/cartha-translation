lexical_decisions:
- source_word: Κύριος
  choice: Господь
  rationale: Устоявшаяся передача κύριος как божественного титула; здесь слово относится к Богу.
- source_word: Παντοκράτωρ
  choice: Вседержитель
  rationale: Традиционный и понятный русский эквивалент божественного титула, выражающий всеобъемлющую власть Бога.
- source_word: ἠθέτησεν
  choice: сокрушил
  rationale: 'В контексте победы передаёт результат действия ἀθετέω: Господь лишил врагов силы и свёл их замысел на нет; по-русски звучит естественнее буквального «упразднил их».'
- source_word: αὐτούς
  choice: их
  rationale: Прямое местоименное дополнение, относящееся к ранее названным врагам.
- source_word: ἐν χειρὶ
  choice: рукой
  rationale: Сохраняет библейский образ руки и одновременно естественно выражает орудие или посредничество действия.
- source_word: θηλείας
  choice: женщины
  rationale: В данном повествовательном контексте субстантивированное θηλεία естественно означает женщину, а не просто особь женского пола.
theological_decisions:
- issue: Передача составного божественного титула Κύριος Παντοκράτωρ
  choice: Господь Вседержитель
  alternative: Всемогущий Господь
  rationale: Сохраняются оба элемента греческого выражения и привычный для русской библейской речи титул «Вседержитель», подчёркивающий всеобщую власть Бога.
- issue: Посредничество в выражении ἐν χειρὶ θηλείας
  choice: рукой женщины
  alternative: через женщину
  rationale: 'Образ руки сохранён без устранения богословского напряжения: победу совершает Господь, действуя посредством неожиданного человеческого орудия.'
- issue: Смысл ἠθέτησεν в контексте победы
  choice: сокрушил
  alternative: обратил в ничто
  rationale: Выбрана естественная русская формулировка, обозначающая устранение силы врагов, но не уточняющая сверх сказанного способ или степень их поражения.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Фраза краткая и песенная; образ «рукой женщины» сохранён, а не заменён пояснительным пересказом.
