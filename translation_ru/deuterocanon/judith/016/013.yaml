  yaml_path: translation/deuterocanon/judith/016/013.yaml
  text: I will sing to my God a new hymn[a]. Lord, you are great and glorious, marvelous in strength[b], unsurpassable.
translation:
  language: ru
  text: Воспою Богу моему новую хвалебную песнь[a]. Господи, Ты велик и славен, дивен могуществом и непревзойдён[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «новый гимн». Греческое ὕμνον καινόν означает новую песнь хвалы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «непобедим», «несравнен». Греческое ἀνυπέρβλητος означает того, кого невозможно превзойти или одолеть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμνήσω
  choice: воспою
  rationale: Будущее время от ὑμνέω означает петь хвалу. «Воспою» естественно для русского поэтического славословия и сохраняет значение будущего времени.
- source_word: τῷ θεῷ μου
  choice: Богу моему
  rationale: Дательный падеж обозначает Того, Кому обращена хвалебная песнь. Порядок слов сохраняет торжественный, но понятный регистр.
- source_word: ὕμνον καινόν
  choice: новую хвалебную песнь
  rationale: ὕμνος — именно песнь хвалы; «хвалебная песнь» передаёт это точнее, чем широкое «песня», а «гимн» в современном русском может прежде всего ассоциироваться с официальным государственным или корпоративным гимном.
- source_word: Κύριε
  choice: Господи
  rationale: Форма звательного обращения к κύριος естественно передаётся традиционной и общеупотребительной русской формой «Господи».
- source_word: μέγας
  choice: велик
  rationale: Прямое и естественное соответствие при обращении к Богу.
- source_word: ἔνδοξος
  choice: славен
  rationale: В контексте хвалы слово обозначает славу и величие; краткая форма хорошо согласуется с рядом именных сказуемых.
- source_word: θαυμαστὸς ἐν ἰσχύι
  choice: дивен могуществом
  rationale: θαυμαστός указывает на вызывающее изумление и восхищение, а ἰσχύς — на силу или могущество. Творительный падеж естественно передаёт греческое ἐν в данном сочетании.
- source_word: ἀνυπέρβλητος
  choice: непревзойдён
  rationale: Слово выражает невозможность превзойти или одолеть. «Непревзойдён» сохраняет широкий смысл, не сужая его исключительно до военной непобедимости.
theological_decisions:
- issue: Передача κύριος при прямом обращении к Богу
  choice: Господи
  alternative: Владыка
  rationale: κύριος здесь является прямым обращением к Богу. «Господи» — точная и естественная русская звательная форма, тогда как «Владыка» добавляет более узкий оттенок господства.
- issue: Смысл ἀνυπέρβλητος применительно к Богу
  choice: непревзойдён
  alternative: непобедим
  rationale: Греческое слово допускает оттенок невозможности одолеть, особенно рядом с упоминанием могущества, но его значение шире военной непобедимости. Перевод сохраняет эту широту, а альтернативный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский с возвышенным песенным звучанием. Формы «воспою», «Господи», «дивен» уместны в славословии и остаются понятными широкому читателю. Местоимение «Ты» написано с прописной буквы как знак прямого почтительного обращения к Богу.
