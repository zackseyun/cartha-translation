  source_fidelity: '«Ассур» в современном русском прежде всего воспринимается как личное имя (в частности имя ассирийского божества), тогда как Ἀσσούρ здесь обозначает Ассирию/ассирийскую державу, поэтически олицетворённую. «Ассирия» точно передаёт референт, хотя вынужденно согласуется в русском женском роде. Остальные основные образы переданы верно: мириады сил, перекрытые сезонные водотоки и покрывающая холмы конница.'
