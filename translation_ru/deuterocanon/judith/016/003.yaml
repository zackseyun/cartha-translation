  - marker: b
    text: 'Буквально: «их конь покрыл холмы»; слово «конь» здесь, вероятно, употреблено собирательно в значении конницы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσσούρ
  choice: Ассур
  rationale: Форма «Ассур» сохраняет поэтическое олицетворение ассирийской державы и позволяет передать мужской образ исходного текста, не сводя его однозначно к стране или отдельному человеку.
- source_word: ἐξ ὀρέων ἀπὸ βορρᾶ
  choice: с гор, с севера
  rationale: Повтор предлога «с» передаёт обе исходные конструкции и сохраняет сочетание горного происхождения с направлением с севера.
- source_word: ἐν μυριάσι δυνάμεων αὐτοῦ
  choice: с мириадами своего войска
  rationale: «Мириады» сохраняют числовой образ и возвышенный строй песни; единственное собирательное «войско» естественно по-русски передаёт множественное δυνάμεων.
- source_word: ἐνέφραξεν χειμάρρους
  choice: запрудило потоки
  rationale: Глагол «запрудило» передаёт преграждение водотоков огромной массой войска, а «потоки» остаются ясным и поэтичным обозначением сезонных русел.
- source_word: ἡ ἵππος αὐτῶν
  choice: конница их
  rationale: Единственное ἵππος употреблено собирательно; «конница» естественно передаёт массу коней как часть войска, не превращая образ в одного коня.
- source_word: βουνούς
  choice: холмы
  rationale: «Холмы» сохраняют отличие βουνοί от ὄρη — «гор» в первой строке.
theological_decisions:
- issue: Олицетворённая ассирийская держава и смена числа в описании войска
  choice: Передать Ἀσσούρ как «Ассур» с глаголом в единственном числе, а затем сохранить множественное «их» применительно к воинам и коннице.
  alternative: Передать как «Ассирия» и последовательно согласовать всё в женском единственном числе либо как «ассирийцы» во множественном числе.
  rationale: Исходный текст соединяет единичный олицетворённый субъект с множеством составляющих его сил. Сохранение этой смены не сглаживает поэтическое напряжение и не придаёт ему дополнительного вероучительного смысла.
translation_notes:
  register: Современный литературный русский с возвышенным песенным ритмом. «Ассур» и «мириады» сохраняют библейско-поэтический колорит, тогда как синтаксис и остальная лексика остаются понятными современному читателю.
