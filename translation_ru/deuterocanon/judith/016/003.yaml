  text: Assyria came from the mountains out of the north[a]; he came with myriads of his forces, whose multitude blocked up the wadis[b], and their horses covered the hills.
translation:
  language: ru
  text: Ассирия пришла с гор, с севера; пришла с мириадами своих войск. Их множество запрудило потоки[a], и их конница покрыла холмы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зимние потоки»; речь идёт о сезонных водотоках и их руслах.'
