base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/014.yaml
  text: Let all your creation serve you; for you spoke[a], and they came to be; you sent out your Spirit, and it formed them; and there is no one who will resist your voice.
translation:
  language: ru
  text: Да служит Тебе всё Твоё творение, ибо Ты сказал — и оно возникло; Ты послал Твой Дух[a] — и Он устроил его; и нет никого, кто воспротивится Твоему голосу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоё дыхание» или «Твой ветер». Греческое слово может иметь все три значения, особенно в контексте творения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δουλευσάτω
  choice: да служит
  rationale: Форма повелительного наклонения выражает призыв к служению и подчинению; «да служит» естественно передаёт возвышенный поэтический тон без излишне узкого образа рабства.
- source_word: πᾶσα ἡ κτίσις σου
  choice: всё Твоё творение
  rationale: 'Единственное число с πᾶσα допускает собирательное понимание: совокупность всего сотворённого Богом.'
- source_word: εἶπας
  choice: Ты сказал
  rationale: Прямо передаёт аорист λέγω и сохраняет мотив творящего Божьего слова.
- source_word: ἐγενήθησαν
  choice: оно возникло
  rationale: Греческое множественное число относится к подразумеваемым составляющим творения, но по-русски собирательное «творение» требует единственного числа; «возникло» передаёт вступление в бытие без добавления отсутствующей в форме глагола конкретизации.
- source_word: ἀπέστειλας
  choice: Ты послал
  rationale: «Послал» естественно передаёт действие ἀποστέλλω; дополнительное «вовне» в русском контексте не требуется.
- source_word: τὸ πνεῦμά σου
  choice: Свой Дух
  rationale: 'В контексте божественного созидания «Дух» является значимым чтением, тогда как сноска сохраняет присущую πνεῦμα многозначность: дух, дыхание или ветер.'
- source_word: ᾠκοδόμησεν
  choice: устроил его
  rationale: Буквально глагол связан со строительством; в контексте всего творения «устроил» сохраняет идею созидания и упорядочения и звучит по-русски естественнее, чем «построил его».
- source_word: ἀντιστήσεται
  choice: воспротивится
  rationale: Передаёт будущее значение и идею сознательного противостояния; соответствует возвышенному регистру стиха.
- source_word: τῇ φωνῇ σου
  choice: Твоему голосу
  rationale: Сохраняет конкретный образ голоса и связь с предшествующим Божьим речением, не заменяя его толковательным «велением».
theological_decisions:
- issue: Значение πνεῦμα в контексте творения
  choice: Свой Дух
  alternative: Своё дыхание; Свой ветер
  rationale: Греческое πνεῦμα допускает все три значения. Основной текст использует теологически и контекстуально значимое «Дух», а сноска сохраняет подлинную лексическую неоднозначность.
- issue: Соотнесение подлежащего при ᾠκοδόμησεν
  choice: «Он» с прописной буквы относится к Духу
  alternative: «оно» как безлично понятое дыхание или дуновение
  rationale: При основном чтении πνεῦμα как личного Божьего Духа естественно русское «Он». Альтернативные значения самого πνεῦμα отмечены в сноске, не устраняя напряжения исходного текста.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Местоимения, относящиеся к Богу, даны с прописной буквы. Точки с запятой и тире сохраняют параллелизм и ритм греческого текста.
