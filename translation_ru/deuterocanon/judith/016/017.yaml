base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/017.yaml
  text: Woe to the nations rising up against my people[a]; the Lord Almighty will take vengeance on them in the day of judgment, to put fire and worms in their flesh[b], and they will weep in pain forever.
translation:
  language: ru
  text: Горе народам, восстающим против моего народа[a]! Господь Вседержитель воздаст им в день суда, вложив огонь и червей в их плоть; и они будут плакать в муках[b] вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против моего рода» либо «против моего племени»; греч. γένος обозначает народ или родовую общность, к которой принадлежит Иудифь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в ощущении» или «с ощущением»; греч. αἴσθησις может означать ощущение или восприятие. В контексте телесного наказания «в муках» передаёт смысл контекстуально.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ
  choice: Горе
  rationale: Сохраняет одновременно пророческое предостережение и судебно-обличительную силу междометия.
- source_word: ἔθνεσιν
  choice: народам
  rationale: В контексте речь идёт об иноземных народах, враждебных Израилю; вариант не привносит более позднюю терминологию «язычники».
- source_word: ἐπανισταμένοις
  choice: восстающим против
  rationale: Передаёт образ враждебного выступления, не уточняя сверх текста конкретный вид нападения.
- source_word: τῷ γένει μου
  choice: моего народа
  rationale: γένος обозначает род, племя или этническую общность; «народ» естественно выражает здесь принадлежность Иудифи к своему народу, а варианты сохранены в сноске.
- source_word: Κύριος Παντοκράτωρ
  choice: Господь Вседержитель
  rationale: Устойчиво и точно передаёт божественный титул и его смысл верховной власти.
- source_word: ἐκδικήσει αὐτοὺς
  choice: воздаст им
  rationale: Передаёт судебно-карательный смысл глагола без стилистически тяжёлого «совершит над ними отмщение».
- source_word: ἐν ἡμέρᾳ κρίσεως
  choice: в день суда
  rationale: Естественная русская форма узнаваемого судебно-эсхатологического выражения.
- source_word: δοῦναι πῦρ καὶ σκώληκας εἰς σάρκας αὐτῶν
  choice: предаст их плоть огню и червям
  rationale: Естественно передаёт значение конструкции с δοῦναι и εἰς, сохраняя резкие образы огня, червей и плоти.
- source_word: κλαύσονται
  choice: будут плакать
  rationale: Прямо и ясно передаёт плач и страдание.
- source_word: ἐν αἰσθήσει
  choice: ощущая муки
  rationale: αἴσθησις буквально относится к ощущению или восприятию; контекст указывает на мучительное телесное переживание, при этом сноска сохраняет буквальную неоднозначность.
- source_word: ἕως αἰῶνος
  choice: вовеки
  rationale: Передаёт силу выражения о неограниченной длительности в торжественном, но понятном русском регистре.
theological_decisions:
- issue: Образ наказания и его длительность
  choice: «они будут плакать, ощущая муки, вовеки»
  alternative: «они будут плакать, сохраняя ощущение, до века»
  rationale: 'Текст не смягчает образ божественного воздаяния. Вместе с тем перевод не превращает αἴσθησις в специальный догматический термин: буквальный смысл «ощущение/восприятие» отмечен в сноске, а ἕως αἰῶνος передан обычным для данного контекста «вовеки».'
translation_notes:
  register: Современный литературный русский с достоинством поэтического пророчества. Восклицание после первой части подчёркивает самостоятельную силу οὐαί; дальнейшее двоеточие раскрывает содержание воздаяния. Избегнуты как архаизмы вроде «червие», так и разговорные формулировки.
