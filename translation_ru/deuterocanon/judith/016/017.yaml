  source_fidelity: 'Основной смысл передан точно: οὐαί, враждебное восстание народов против народа Иудифи, титул «Господь Вседержитель», день суда и продолжительность наказания сохранены. Однако «предаст их плоть огню и червям» меняет синтаксическое направление греческого δοῦναι πῦρ καὶ σκώληκας εἰς σάρκας αὐτῶν: в оригинале огонь и черви помещаются в их плоть, а не их плоть отдаётся огню и червям. Это следует исправить.'
