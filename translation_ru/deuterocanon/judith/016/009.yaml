lexical_decisions:
- source_word: σανδάλιον
  choice: сандал
  rationale: Конкретное обозначение сандалии сохранено вместо обобщённого «обувь»; форма «сандал» естественна в современном русском.
- source_word: ἥρπασε
  choice: захватил
  rationale: Передаёт силу глагола «схватить, завладеть» и сохраняет образ захвата, оставаясь понятным в сочетании со «взглядом».
- source_word: ὀφθαλμόν
  choice: взгляд
  rationale: Греческое единственное число буквально означает «глаз», но в данном обороте обозначает зрительное внимание; «взгляд» естественно передаёт этот смысл без изменения образа.
- source_word: κάλλος
  choice: красота
  rationale: Прямое и стилистически уместное соответствие, обозначающее красоту Иудифи.
- source_word: ᾐχμαλώτισεν
  choice: взяла в плен
  rationale: Сохраняет военную метафору пленения, существенную для поэтической песни победы.
- source_word: ψυχήν
  choice: душу
  rationale: Сохраняет возвышенный поэтический регистр и представление о внутреннем существе человека, не подменяя его словом «сердце».
- source_word: ἀκινάκης
  choice: кинжал
  rationale: Слово обозначает короткий меч или кинжал восточного типа; «кинжал» точно и естественно передаёт предмет в основном тексте.
- source_word: διῆλθεν
  choice: прошёл сквозь
  rationale: Близко передаёт буквальное значение глагола и сохраняет резкость исходного образа без пояснительного перефразирования.
- source_word: τράχηλον
  choice: шею
  rationale: Прямое обычное соответствие греческому слову; вариант «горло» был бы более контекстуально истолковывающим.
theological_decisions:
- issue: Метафорика захвата и пленения в поэтической песне победы
  choice: 'Сохранить оба образа: «захватил его взгляд» и «взяла в плен его душу»'
  alternative: Сгладить до «привлёк его внимание» и «покорила его сердце»
  rationale: Греческий текст намеренно описывает покорённость Олоферна языком насильственного захвата и военного плена. Сохранение этой напряжённой образности поддерживает связь между обольщением и последующей гибелью, не романтизируя сцену.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но ясным поэтическим строем. Параллелизм двух первых частей и резкий переход к последней сохранены. Маркер сноски поставлен непосредственно после слова «кинжал», к которому относится примечание.
