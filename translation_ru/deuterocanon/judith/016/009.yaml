  text: Her sandal captured his eye[a], and her beauty took his soul captive; the sword passed through his neck.
translation:
  language: ru
  text: Её сандалия завладела его взором, и её красота взяла в плен его душу; кинжал[a] прошёл через его шею.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «короткий меч»; греческое слово ἀκινάκης обозначает короткий меч или кинжал восточного типа.'
