  text: And the people were rejoicing in Jerusalem before the sanctuary for three months[a], and Judith remained with them.
translation:
  language: ru
  text: И народ три месяца радовался в Иерусалиме перед святилищем[a], а Иудифь осталась с ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед святынями»; возможно также: «в присутствии святых». Буквально: «перед святыми»; подразумеваться могут священные предметы или святые существа.'
    reason: 'Лексическая неоднозначность субстантивированного τῶν ἁγίων: в данном контексте наиболее вероятно значение храмового святилища или святынь, но форма может относиться и к святым лицам либо небесным существам.'
lexical_decisions:
- source_word: εὐφραινόμενος
  choice: радовался
  rationale: Причастная конструкция описывает продолжительное общее ликование; русское «радовался» естественно передаёт состояние народа на протяжении указанного срока.
- source_word: κατὰ πρόσωπον τῶν ἁγίων
  choice: перед святилищем
  rationale: В контексте Иерусалима и богослужебного празднования родительный τῶν ἁγίων, вероятнее всего, обозначает священное место или храмовую святыню, а κατὰ πρόσωπον сохраняет пространственный смысл «перед».
- source_word: ἐπὶ μῆνας τρεῖς
  choice: три месяца
  rationale: Естественная русская передача длительности; постановка перед сказуемым ясно связывает весь срок с народным ликованием.
- source_word: κατέμεινεν
  choice: оставалась
  rationale: Передаёт пребывание Иудифи вместе с народом в течение описываемого периода и согласуется с длительным характером контекста.
- source_word: λαός
  choice: народ
  rationale: Обычная и контекстуально точная коллективная передача без ненужного уточнения этнического или политического значения.
theological_decisions:
- issue: Референт τῶν ἁγίων в иерусалимском культовом контексте
  choice: святилище
  alternative: святыни; святые
  rationale: Пространственное выражение «перед» и упоминание Иерусалима делают храмовое святилище наиболее вероятным референтом. Поскольку греческая форма допускает также значение священных предметов или святых существ/людей, эта неоднозначность отмечена в сноске.
