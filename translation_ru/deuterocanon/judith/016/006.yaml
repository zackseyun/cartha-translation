  yaml_path: translation/deuterocanon/judith/016/006.yaml
  text: For their mighty one did not fall by the hands of young men[a], nor did sons of Titans strike him, nor did tall giants set upon him; but Judith daughter of Merari disabled him with the beauty of her face.
translation:
  language: ru
  text: Ведь их силач пал не от рук юношей; не сыны Титанов поразили его и не высокие исполины напали на него. Но Иудифь, дочь Мерари, красотой своего лица лишила его сил[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «парализовала его». Греческий глагол может означать, что кто-либо был лишён силы или способности действовать, буквально либо образно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δυνατὸς αὐτῶν
  choice: их могучий воин
  rationale: Прилагательное употреблено как существительное и обозначает их могучего человека или богатыря. «Воин» естественно в данном контексте, хотя воинская должность в греческом не уточняется.
- source_word: νεανίσκων
  choice: юношей
  rationale: Слово обозначает молодых мужчин; «юношей» сохраняет поэтический регистр и контраст с мифическими противниками.
- source_word: υἱοὶ Τιτάνων
  choice: сыны Титанов
  rationale: Прямой перевод сохраняет мифический образ и возвышенную риторику оригинала.
- source_word: ἐπάταξαν
  choice: поразили
  rationale: Глагол означает нанести удар, поразить; перевод не добавляет прямо не выраженного результата «сразили насмерть».
- source_word: ὑψηλοὶ γίγαντες
  choice: высокие исполины
  rationale: «Высокие» передаёт физический образ ὑψηλοί, а «исполины» сохраняет возвышенное и мифическое звучание γίγαντες.
- source_word: ἐπέθεντο αὐτῷ
  choice: напали на него
  rationale: Естественно передаёт греческую идиому со значением нападения или выступления против кого-либо.
- source_word: παρέλυσεν
  choice: лишила его сил
  rationale: Передаёт приведение человека в бессильное, обездвиженное состояние без утверждения о буквальном медицинском параличе.
- source_word: ἐν κάλλει προσώπου αὐτῆς
  choice: красотой своего лица
  rationale: Сохраняет конкретный образ лица, явно выраженный словом πρόσωπον, и инструментальное значение оборота.
- source_word: θυγάτηρ Μεραρεί
  choice: дочь Мерари
  rationale: Прямое и прозрачное воспроизведение родословного обозначения.
theological_decisions:
- issue: Мифическая образность в υἱοὶ Τιτάνων и γίγαντες
  choice: Сохранить прямые наименования «сыны Титанов» и «высокие исполины».
  alternative: Обобщить как «могучие люди» или «богатыри».
  rationale: Оригинал намеренно усиливает контраст, называя сверхчеловеческих противников; обобщение ослабило бы риторику песни.
- issue: Смысл παρέλυσεν
  choice: Перевести «лишила его сил».
  alternative: «Парализовала его» или «погубила его».
  rationale: Контекст допускает образное лишение силы и способности сопротивляться. Выбранный вариант не навязывает ни буквального медицинского паралича, ни более широкого результата «погубила».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской, уместной для победной песни. Союз «ведь» передаёт γάρ, а «нет» подчёркивает противопоставление ἀλλά. Маркер сноски помещён при выражении, к которому относится лексическая альтернатива.
