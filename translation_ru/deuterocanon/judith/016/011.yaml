  text: Тогда мои униженные громко вскричали[a], а мои слабые испугались и пришли в смятение; они возвысили свой голос и были повержены[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «издали боевой клич»; греческий глагол может обозначать громкий возглас с воинственным оттенком.'
