    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάλαξαν
  choice: издали громкий крик
  rationale: Глагол обозначает громкий возглас и в военном контексте может подразумевать боевой клич. Формулировка передаёт силу действия, не делая военный оттенок обязательным.
- source_word: οἱ ταπεινοί μου
  choice: мои униженные
  rationale: ταπεινοί может обозначать людей низкого положения, униженных или смиренных. «Униженные» сохраняет социальную и ситуационную окраску и не сводит смысл к нравственной добродетели смирения.
- source_word: οἱ ἀσθενοῦντές μου
  choice: мои слабые
  rationale: Субстантивированное причастие обозначает тех, кто слаб или немощен. «Мои слабые» понятно современному читателю и не привносит исключительно медицинского смысла.
- source_word: ἐφοβήθησαν
  choice: испугались
  rationale: Естественно передаёт аорист со значением возникновения страха.
- source_word: ἐπτοήθησαν
  choice: пришли в смятение
  rationale: Глагол выражает сильную тревогу, испуг или потрясение. Эта передача сохраняет усиление после «испугались», не сужая смысл до современного психологического термина «паника».
- source_word: ὕψωσαν τὴν φωνὴν αὐτῶν
  choice: они возвысили свой голос
  rationale: Близко передаёт греческую идиому и сохраняет собирательное единственное число «голос».
- source_word: ἀνετράπησαν
  choice: были ниспровергнуты
  rationale: Сохраняет страдательную форму и допускает как буквальное низвержение, так и более широкое поражение или крушение.
theological_decisions:
- issue: К кому относится заключительное ἀνετράπησαν
  choice: В основном тексте субъект прямо не уточняется; сохранено местоимение «они», соответствующее сжатой греческой последовательности.
  alternative: Понять глагол как относящийся либо к «моим униженным / слабым», либо к подразумеваемым противникам.
  rationale: Греческая формулировка допускает продолжение прежнего субъекта, однако в контексте может подразумеваться смена референта на противников. Добавление «их враги» устранило бы подлинную неоднозначность источника.
translation_notes:
  register: Современный литературный русский язык с достоинством песнопения. Слова «униженные», «возвысили голос» и «ниспровергнуты» слегка приподняты, но понятны; синтаксическая неоднозначность заключительной части намеренно сохранена.
