base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/016/015.yaml
  text: For mountains will be shaken from their foundations with the waters[a], and rocks will melt like wax before your face; yet to those who fear you, you are gracious.
translation:
  language: ru
  text: Ибо горы поколеблются от самых оснований вместе с водами, и скалы, словно воск, растают от лица Твоего[a]; но к боящимся Тебя Ты милостив.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от присутствия Твоего». Буквально по-гречески: «от лица Твоего».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄρη
  choice: горы
  rationale: Обычное значение существительного; сохраняет образ космического потрясения.
- source_word: ἐκ θεμελίων
  choice: от самых оснований
  rationale: Передаёт движение, начинающееся у основания; «самых» естественно подчёркивает полноту потрясения, заложенную в обороте.
- source_word: σὺν ὕδασιν
  choice: вместе с водами
  rationale: Сохраняет значение сопровождения у σύν и поэтический образ стихийных вод.
- source_word: σαλευθήσεται
  choice: поколеблются
  rationale: Передаёт будущее пассивное значение сильного движения или сотрясения; множественное число требуется русским согласованием с «горы».
- source_word: πέτραι
  choice: скалы
  rationale: В параллели с горами речь идёт о крупных каменных массах, а не об отдельных небольших камнях.
- source_word: ἀπὸ προσώπου σου
  choice: от лица Твоего
  rationale: Сохраняет буквальный, антропоморфный образ греческого текста; значение божественного присутствия указано в сноске.
- source_word: ὡς κηρὸς
  choice: словно воск
  rationale: Естественно передаёт ясное поэтическое сравнение.
- source_word: τακήσονται
  choice: растают
  rationale: Точно и естественно передаёт образ плавления скал.
- source_word: ἔτι δὲ
  choice: но
  rationale: Обозначает контраст между потрясением творения и милостью к боящимся Бога.
- source_word: τοῖς φοβουμένοις σε
  choice: к боящимся Тебя
  rationale: Сохраняет библейский язык страха Божьего, включающий благоговение и трепет, не сводя его только к почтению.
- source_word: εὐιλατεύεις αὐτοῖς
  choice: Ты милостив
  rationale: Редкий глагол выражает благосклонное, милостивое отношение; дательный αὐτοῖς естественно представлен ранее оборотом «к боящимся Тебя».
theological_decisions:
- issue: Передача τοῖς φοβουμένοις σε
  choice: к боящимся Тебя
  alternative: к почитающим Тебя
  rationale: «Боящимся» сохраняет напряжение библейского понятия страха Божьего — благоговение, трепет и признание Божьего величия — и не ослабляет его до одного лишь почтения.
- issue: Передача ἀπὸ προσώπου σου
  choice: от лица Твоего
  alternative: от присутствия Твоего
  rationale: Основной текст сохраняет конкретный антропоморфный образ оригинала, а смысл присутствия поясняется в сноске.
- issue: Передача εὐιλατεύεις
  choice: Ты милостив
  alternative: Ты являешь им милость
  rationale: Формулировка передаёт устойчивую благосклонность и милость, не сужая редкий глагол до отдельного действия и не вводя специальной конфессиональной терминологии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Библейские образы «от лица Твоего» и «боящимся Тебя» сохранены; устаревшая и узкоспециальная лексика избегается. Маркер сноски поставлен непосредственно после выражения, к которому относится пояснение.
