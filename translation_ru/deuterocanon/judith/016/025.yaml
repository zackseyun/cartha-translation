  text: And there was no longer anyone to terrify the sons of Israel in the days of Judith, and for many days after she died. Amen.
translation:
  language: ru
  text: И во дни Иудифи уже не было никого, кто устрашал бы сынов Израиля, и ещё много дней после того, как она умерла. Аминь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἐκφοβῶν
  choice: никого, кто устрашал бы
  rationale: Передаёт субстантивированное причастие и значение сильного запугивания или наведения страха, сохраняя естественный русский синтаксис.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: сынов Израиля
  rationale: Сохранена традиционная библейская формула, понятная современному читателю.
- source_word: ἡμέρας πολλάς
  choice: много дней
  rationale: Прямо сохраняет временную меру исходного текста, не заменяя её более расплывчатым «долгое время».
- source_word: μετὰ τὸ ἀποθανεῖν αὐτήν
  choice: после того, как она умерла
  rationale: Естественно и точно передаёт греческую конструкцию с артикльным инфинитивом и явно выраженным субъектом.
theological_decisions:
- issue: Характер отсутствия угрозы Израилю
  choice: не было никого, кто устрашал бы
  alternative: никто не нападал
  rationale: Греческий текст говорит именно об устрашении, а не обязательно о военном нападении; более узкое толкование не внесено.
- issue: Заключительное ἀμήν
  choice: Аминь
  alternative: Истинно
  rationale: Сохранена традиционная литургическая и библейская транслитерация заключительной формулы.
