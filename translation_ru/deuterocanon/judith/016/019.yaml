  naturalness: Сочетание «полог, взятый ею себе» грамматически возможно, но для современного литературного русского звучит тяжеловесно и неестественно. Личное придаточное «который она взяла себе» ясно передаёт ἔλαβεν ἑαυτῇ и легче читается. «Принадлежности» в данном контексте естественнее и несколько точнее широкого разговорного «вещи».
  terminology: «Посвятила» и «посвящённый дар» хорошо сохраняют связь ἀνέθηκεν—ἀνάθημα, не подменяя посвящение жертвоприношением. «Полог» допустим для κωνώπιον; сноска корректно сохраняет варианты «сетка от комаров» и «занавесь над ложем». Имена Иудифь и Олоферн нормативны для русского библейского употребления.
