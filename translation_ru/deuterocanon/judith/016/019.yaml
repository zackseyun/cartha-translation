  text: And Judith dedicated to God all the equipment of Holofernes that the people had given her[b][a], and she gave to God as a dedicated offering the canopy that she had taken for herself from his bedchamber.
translation:
  language: ru
  text: И Иудифь посвятила все принадлежности Олоферна, которые народ отдал ей, а полог[a], который она взяла себе из его спальни, отдала Богу как посвящённый дар[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сетку от комаров», «занавесь над ложем» (греч. κωνώπιον).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обетный дар», то есть вещь, посвящённую Богу (греч. ἀνάθημα).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέθηκεν
  choice: посвятила
  rationale: Глагол обозначает передачу вещи божеству в качестве посвящения. «Посвятила» сохраняет культовый смысл, не представляя действие как жертвоприношение.
- source_word: σκεύη
  choice: все вещи
  rationale: В данном контексте слово охватывает принадлежности или имущество Олоферна. «Вещи» естественно звучит по-русски и не сужает значение до сосудов либо военного снаряжения.
- source_word: κωνώπιον
  choice: полог
  rationale: Слово обозначает защитную сетку или занавесь над ложем. «Полог» передаёт предмет обстановки спальни, а более конкретные варианты сохранены в сноске.
- source_word: κοιτῶνος
  choice: из его спальни
  rationale: κοιτών — помещение для сна. Современное «спальня» здесь точнее и естественнее архаичного «опочивальня».
- source_word: εἰς ἀνάθημα
  choice: как посвящённый дар
  rationale: Выражение называет предмет, отданный Богу в посвящение. Этот вариант сохраняет связь с ἀνέθηκεν и культовый характер действия, оставаясь понятным современному читателю.
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный падеж указывает, кому отдан полог; прямой русский эквивалент — «Богу».
theological_decisions:
- issue: Культовый смысл посвящения вещей Богу
  choice: Передать ἀνέθηκεν как «посвятила», а ἀνάθημα как «посвящённый дар»
  alternative: «Принесла в дар» или более специальное «обетный дар»
  rationale: Греческий текст говорит о посвящении предметов Богу, но не называет их жертвой и не уточняет храмовую процедуру. Перевод сохраняет религиозный характер действия без привнесения более поздних категорий.
- issue: Получатель в первой части стиха
  choice: Не добавлять «Богу» после «посвятила»
  alternative: «Посвятила Богу все вещи Олоферна»
  rationale: В первой части греческого предложения получатель прямо не назван, хотя культовый смысл глагола его подразумевает; τῷ θεῷ выражено лишь во второй части. Перевод сохраняет эту структуру и не вводит отсутствующее дополнение.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Союз «а» естественно связывает два параллельных действия; причастный оборот позволяет избежать тяжёлого повторения «который». Имена переданы в традиционной русской форме: Иудифь, Олоферн.'
