  - severity: low
    issue: «Все вещи» несколько расплывчато для σκεύη.
    rationale: В контексте имущества/снаряжения Олоферна «все принадлежности» лучше передаёт совокупность предметов, оставаясь достаточно широким и не ограничивая значение сосудами или только военным снаряжением.
