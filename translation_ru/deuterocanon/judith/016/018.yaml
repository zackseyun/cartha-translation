  text: And when they came to Jerusalem, they worshiped God; and when the people had been purified, they offered up their burnt offerings and their freewill offerings and their gifts.
translation:
  language: ru
  text: Когда же они пришли в Иерусалим, то поклонились Богу; а когда народ был очищен, они принесли свои всесожжения, свои добровольные приношения и дары.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἦλθον
  choice: Когда же они пришли
  rationale: Передаёт временную связь и повествовательный переход, не приписывая δέ сильного противопоставления.
- source_word: προσεκύνησαν
  choice: поклонились
  rationale: В сочетании с дательным τῷ θεῷ обозначает поклонение Богу; русский глагол сохраняет одновременно культовый смысл и образ преклонения.
- source_word: ἡνίκα
  choice: когда
  rationale: Естественный современный эквивалент временного союза.
- source_word: ἐκαθαρίσθη
  choice: был очищен
  rationale: Сохраняет страдательный залог и в контексте жертвоприношений указывает прежде всего на обрядовое очищение, не исключая более широких смысловых ассоциаций.
- source_word: ὁ λαός
  choice: народ
  rationale: Обычный и точный эквивалент для собравшегося народа как общины.
- source_word: ἀνήνεγκαν
  choice: принесли
  rationale: В жертвенном контексте глагол означает принесение жертв; вариант естественен по-русски и не превращает подразумеваемое возложение или вознесение на жертвенник в отдельное утверждение.
- source_word: ὁλοκαυτώματα
  choice: всесожжения
  rationale: Устоявшийся русский термин для жертв, целиком сжигаемых на жертвеннике.
- source_word: ἑκούσια
  choice: добровольные приношения
  rationale: Передаёт добровольный характер этих приношений и сохраняет их отличие от всесожжений и более общих даров.
- source_word: δόματα
  choice: дары
  rationale: Сохраняет более широкое значение слова и различие между тремя названными видами приношений.
theological_decisions:
- issue: Характер очищения народа в ἐκαθαρίσθη ὁ λαός
  choice: Обрядовое очищение, выраженное без уточнения исполнителя
  alternative: Общее нравственное очищение народа
  rationale: Непосредственный контекст поклонения в Иерусалиме и последующего принесения жертв указывает на ритуальное очищение. Страдательная конструкция сохранена, чтобы не добавлять отсутствующее в греческом тексте указание на того, кто совершил очищение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Термины «всесожжения», «приношения» и «дары» различены; синтаксис остаётся ясным для широкого читателя.
