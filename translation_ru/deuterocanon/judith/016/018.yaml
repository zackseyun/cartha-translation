  source_fidelity: Перевод в целом точно передаёт последовательность действий, поклонение Богу, страдательную форму «народ был очищен» и три раздельные категории приношений. Однако местоимение «свои» в исходной русской координации естественно относится также к «дарам», тогда как греческое αὐτῶν относится к всесожжениям и добровольным приношениям, но не повторяется при δόματα.
