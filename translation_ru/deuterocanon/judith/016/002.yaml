  text: For the Lord is a God who shatters wars; for in his camp, in the midst of the people, he rescued me from the hand of those pursuing me.
translation:
  language: ru
  text: Ибо Господь — Бог, сокрушающий войны; ибо во Своих станах, посреди народа, Он избавил меня из руки преследовавших меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συντρίβων πολέμους
  choice: сокрушающий войны
  rationale: 'Сохраняет сильный и необычный образ греческого текста: Бог не просто прекращает войны, а разбивает, сокрушает их.'
- source_word: παρεμβολὰς αὐτοῦ
  choice: в Своём стане
  rationale: παρεμβολή во множественном числе может обозначать лагеря или расположение войска; в данном контексте естественное русское собирательное «стан» передаёт военный образ без излишней конкретизации.
- source_word: ἐξείλατό με
  choice: Он избавил меня
  rationale: Глагол ἐξαιρέω здесь означает вырвать из опасности, спасти, избавить; «избавил» естественно сочетается с последующим «от руки».
- source_word: ἐκ χειρὸς καταδιωκόντων με
  choice: от руки преследовавших меня
  rationale: Сохранена семитизированная метафора власти и угрозы «от руки», а причастие передано буквально как «преследовавших».
theological_decisions:
- issue: Божественное действие по отношению к войнам
  choice: Бог, сокрушающий войны
  alternative: Бог, прекращающий войны
  rationale: Выбран вариант, сохраняющий прямой образ συντρίβων и не сглаживающий его до общего утверждения о прекращении конфликтов.
- issue: Связь титулов θεὸς и Κύριος
  choice: Господь — Бог, сокрушающий войны
  alternative: Бог, сокрушающий войны, — Господь
  rationale: Греческий порядок допускает предикативное прочтение; выбранная русская конструкция соответствует контексту гимна и консультационному английскому тексту, не добавляя отдельного богословского утверждения.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной гимнической интонацией. Сохранены повтор «ибо», военный образ «стан» и напряжённая метафора «сокрушающий войны».
