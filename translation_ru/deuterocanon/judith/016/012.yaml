  yaml_path: translation/deuterocanon/judith/016/012.yaml
  text: The sons of maidens pierced them through[a], and wounded them like the children of deserters[b]; they perished before the battle line of my Lord.
translation:
  language: ru
  text: Сыновья девушек пронзили их и ранили, словно детей перебежчиков[a]; они погибли от боевого строя моего Господа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно детей дезертиров» или «словно детей беглецов». Греческое αὐτομολούντων обычно относится к перебежчикам или дезертирам; точный смысл этого трудного образа неясен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед боевым строем моего Господа»; возможно также: «из боевого строя моего Господа». Сочетание ἐκ παρατάξεως трудно: оно может указывать на исходную либо причинную связь, а в переводе также допускает пространственное понимание.'
    reason: alternative_reading
lexical_decisions:
- source_word: υἱοὶ κορασίων
  choice: сыновья девушек
  rationale: Близко передаёт необычный греческий образ и явно сохраняет отношение сыновства; «девушки» — современный эквивалент κοράσια без архаизации.
- source_word: κατεκέντησαν
  choice: пронзили
  rationale: Передаёт усиленное значение глагола — нанесение проникающего, смертельного удара.
- source_word: ὡς παῖδας αὐτομολούντων
  choice: словно детей перебежчиков
  rationale: παῖδας понято как винительный падеж объекта сравнения, а αὐτομολούντων — как родительный множественного числа со значением перебежчиков или дезертиров. Трудность образа не устраняется пересказом.
- source_word: ἐτίτρωσκον
  choice: ранили
  rationale: Естественно передаёт повторное или продолженное действие имперфекта в одном ряду с «пронзили».
- source_word: ἀπώλοντο
  choice: они погибли
  rationale: Сохраняет результирующее значение глагола, не уточняя сверх текста непосредственного деятеля гибели.
- source_word: ἐκ παρατάξεως
  choice: от боевого строя
  rationale: Формально сохраняет ἐκ и военное значение παράταξις; пространственно-причинная связь остаётся несколько неоднозначной, как и в греческом.
- source_word: κυρίου μου
  choice: моего Господа
  rationale: Сохраняет явное притяжательное местоимение и в контексте гимна передаёт κύριος как божественный титул.
theological_decisions:
- issue: Передача κύριος
  choice: мой Господь
  alternative: мой владыка
  rationale: В контексте гимна речь идёт о Боге; «Господь» сохраняет богословский вес титула, не добавляя отсутствующего в стихе слова «Бог».
