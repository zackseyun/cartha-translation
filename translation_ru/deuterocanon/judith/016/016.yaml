  yaml_path: translation/deuterocanon/judith/016/016.yaml
  text: For every sacrifice for a pleasing aroma is a small thing[a], and all fat for your whole burnt offering is very little; but the one who fears the Lord is great forever.
translation:
  language: ru
  text: Ведь всякая жертва, приносимая в приятное благоухание, мала, и весь тук, приносимый Тебе во всесожжение, ничтожно мал; а боящийся Господа велик вовеки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всегда»; греческое выражение может обозначать как непрерывную длительность, так и непреходящее постоянство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μικρὸν
  choice: мала
  rationale: Предикативное прилагательное оценивает относительную значимость жертвы; краткое «мала» сохраняет прямой контраст с «велик».
- source_word: θυσία
  choice: жертва
  rationale: Обычный культовый термин, естественный и точный в русском библейском контексте.
- source_word: εἰς ὀσμὴν εὐωδίας
  choice: для благоухания
  rationale: Сохраняет культовый образ приятного благоухания без тяжеловесного буквального повтора «запах благоухания».
- source_word: ἐλάχιστον
  choice: ничтожно мал
  rationale: Передаёт усилительную превосходную степень и поддерживает риторический параллелизм с «мала».
- source_word: πᾶν στέαρ
  choice: весь тук
  rationale: «Тук» — точное и узнаваемое обозначение жертвенного жира; единственное число сохраняет собирательное употребление греческого текста.
- source_word: εἰς ὁλοκαύτωμά σοι
  choice: приносимый Тебе во всесожжение
  rationale: Естественно передаёт назначение тука и дательный адресата; «всесожжение» сохраняет значение жертвы, полностью сжигаемой на огне.
- source_word: ὁ δὲ φοβούμενος τὸν κύριον
  choice: а боящийся Господа
  rationale: Субстантивированное причастие выражает общее положение; формулировка точна, кратка и сохраняет библейскую категорию страха Господня.
- source_word: μέγας
  choice: велик
  rationale: Прямо сохраняет риторическое противопоставление малости жертв и величия боящегося Господа.
- source_word: διὰ παντός
  choice: вовеки
  rationale: Передаёт идею непреходящей длительности и соответствует возвышенному регистру; возможное значение «всегда» отмечено в сноске.
theological_decisions:
- issue: Относительная ценность жертв и страха Господня
  choice: Жертвы названы малыми в сопоставлении с величием человека, боящегося Господа.
  alternative: Можно понимать высказывание как указание на недостаточность жертв без благоговения, а не на их малую ценность саму по себе.
  rationale: Греческий текст прямо строит антитезу между малостью жертвенных даров и величием боящегося Господа; перевод не развивает её в общее отрицание жертвоприношений.
- issue: Передача κύριον
  choice: Господа
  alternative: Владыки
  rationale: В данном контексте κύριος служит почтительным наименованием Бога; «Господь» — стандартная и естественная русская передача.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Слова «тук», «всесожжение» и «вовеки» сохранены как точные культовые и поэтические термины; синтаксис сделан ясным за счёт параллельных именных сказуемых и пояснительного причастного оборота.
