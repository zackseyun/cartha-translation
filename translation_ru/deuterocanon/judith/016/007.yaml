lexical_decisions:
- source_word: ἐξεδύσατο
  choice: сняла с себя
  rationale: Средняя форма глагола обозначает снятие одежды с самой себя; русское выражение естественно и точно передаёт действие.
- source_word: στολὴν χηρεύσεως
  choice: вдовье одеяние
  rationale: Сочетание обозначает одежду, соответствующую состоянию вдовства. «Одеяние» сохраняет достоинство поэтической речи, а прилагательное «вдовье» звучит естественно по-русски.
- source_word: εἰς ὕψος
  choice: чтобы поднять
  rationale: Сжатый греческий оборот буквально связан с высотой или возвышением. Целевая конструкция передаёт направленность действия и сохраняет образ поднятия, не уточняя, идёт ли речь прежде всего об избавлении, ободрении или возвышении.
- source_word: τῶν πονούντων
  choice: страдавших
  rationale: В данном повествовательном контексте причастие указывает на людей, терпевших бедствие и страдание, а не просто трудившихся.
- source_word: ἐν Ἰσραήλ
  choice: в Израиле
  rationale: Прямо передаёт местное или общинное значение греческого оборота.
