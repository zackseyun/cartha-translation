  text: Ибо она сняла с себя вдовье одеяние ради возвышения страдавших в Израиле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы поднять страдавших в Израиле». Греческое выражение εἰς ὕψος буквально связано с высотой и здесь употреблено сжато; оно может передавать мысль о возвышении или о поднятии страдавших.'
