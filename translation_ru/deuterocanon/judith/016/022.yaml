  text: And many desired her[a], but no man knew her all the days of her life[b], from the day when Manasseh her husband died and was added to his people.
translation:
  language: ru
  text: Многие желали её, но с того дня, как умер её муж Манассия и был присоединён к своему народу[b], ни один мужчина не познал её[a] до конца её жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть ни один мужчина не вступал с ней в половую близость. В греческом тексте буквально: «не познал её» — это эвфемизм.'
    reason: lexical_alternative
