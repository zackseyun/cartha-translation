lexical_decisions:
- source_word: ἐπεθύμησαν
  choice: желали
  rationale: Глагол обозначает сильное желание; в данном контексте оно может подразумевать брачный или сексуальный интерес. «Желали» сохраняет широту греческого выражения, не сводя его к грубой похоти.
- source_word: οὐκ ἔγνω ἀνὴρ αὐτήν
  choice: ни один мужчина не познал её
  rationale: Греческий текст использует традиционный эвфемизм для половой близости. «Не познал её» сохраняет литературный и библейский характер выражения; пояснение дано в сноске.
- source_word: ἀνήρ
  choice: мужчина
  rationale: 'Здесь неопределённое единственное число имеет обобщающий смысл: речь идёт о любом мужчине после смерти мужа Иудифи, поэтому перевод «муж» был бы неоправданно узким.'
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς αὐτῆς
  choice: во все дни её жизни
  rationale: Близкий перевод устойчивого библейского оборота, сохраняющий торжественный ритм исходного текста.
- source_word: ἀφʼ ἧς ἡμέρας
  choice: с того дня, когда
  rationale: Выражение указывает на начало вдовства Иудифи и передано близко к греческой конструкции.
- source_word: προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: был присоединён к своему народу
  rationale: Сохранён пассивный залог и погребальный библейский оборот исходного текста без уточнения представлений о посмертной участи.
- source_word: Μανασσῆς
  choice: Манассия
  rationale: Традиционная русская библейская форма имени.
theological_decisions:
- issue: Сексуальный эвфемизм οὐκ ἔγνω ἀνὴρ αὐτήν
  choice: Сохранить в основном тексте выражение «ни один мужчина не познал её».
  alternative: «Ни один мужчина не вступал с ней в близость» или «ни один мужчина не имел с ней отношений».
  rationale: Греческий текст намеренно использует эвфемизм, а не прямое обозначение полового акта. Его сохранение передаёт регистр источника, тогда как сноска делает смысл однозначным для современного читателя.
- issue: Погребальный оборот προσετέθη πρὸς τὸν λαὸν αὐτοῦ
  choice: «Был присоединён к своему народу».
  alternative: «Был собран со своим народом».
  rationale: Близкий перевод сохраняет образность и богословскую недосказанность греческого оборота, не добавляя утверждений о загробной жизни.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским ритмом. Эвфемизм «познал её» и погребальный оборот сохранены ради образности и богословской недосказанности источника; их смысл пояснён в сносках. Маркеры сносок исправлены по смыслу: [a] относится к сексуальному эвфемизму, [b] — к погребальному обороту.'
