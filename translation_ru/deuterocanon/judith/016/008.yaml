translation:
  language: ru
  text: И она подвязала волосы головной повязкой и взяла льняное одеяние, чтобы обмануть его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «для его обмана». Греческий оборот может обозначать цель или результат; в данном контексте речь идёт о намерении обмануть его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδήσατο
  choice: подвязала
  rationale: Средняя форма глагола δέω здесь обозначает, что она закрепила или уложила собственные волосы; «подвязала» естественно передаёт это действие по-русски.
- source_word: τὰς τρίχας αὐτῆς
  choice: волосы
  rationale: Греческое множественное число естественно передаётся русским собирательным обозначением «волосы»; притяжательность ясна из подлежащего и возвратного смысла действия.
- source_word: ἐν μίτρᾳ
  choice: головной повязкой
  rationale: μίτρα здесь означает повязку или обвязку для волос. «Головная повязка» понятно современному читателю и не вызывает неуместных ассоциаций со словом «митра».
- source_word: ἔλαβεν
  choice: взяла
  rationale: Сохранено прямое значение глагола «взяла». Контекст может подразумевать последующее облачение, но сам глагол не требует перевода «надела».
- source_word: στολὴν λινῆν
  choice: льняное одеяние
  rationale: στολή обозначает одеяние или одежду, не уточняя фасон; λινῆν указывает на лён. «Одеяние» сохраняет достоинство стиля и широту значения.
- source_word: εἰς ἀπάτην αὐτοῦ
  choice: чтобы обмануть его
  rationale: Оборот εἰς с ἀπάτη выражает направленность или цель, а местоимение αὐτοῦ указывает на мужчину как объект обмана. Русская целевая конструкция естественно передаёт смысл, не добавляя нравственной оценки.
theological_decisions:
- issue: Нравственная характеристика поступка Иудифи
  choice: 'Прямо назвать целью действия обман: «чтобы обмануть его»'
  alternative: «для его обмана» / «чтобы ввести его в заблуждение»
  rationale: Греческий текст открыто употребляет слово ἀπάτη. Перевод не смягчает это описание и не добавляет ни одобрения, ни осуждения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Избегнуты архаизмы «власы» и «митра», а также более конкретное «надела», которого прямо нет в греческом глаголе.
