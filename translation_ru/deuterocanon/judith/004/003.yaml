  source_fidelity: 'Начальная часть точно передаёт два подчёркнутых указания на недавность, плен и собрание всего народа Иудеи. «Вернулись из плена» является допустимой контекстуальной передачей ἀναβεβηκότες, хотя не воспроизводит буквально пространственный оттенок «поднялись». В заключительной части «после осквернения» передаёт последовательность событий, но сглаживает связь, выраженную ἐκ: священные предметы и храм были выведены из состояния осквернения и освящены. Предлагаемая формулировка передаёт это прямо и естественно, не утверждая конкретного ритуального процесса.'
