  terminology: '«Плен», «сосуды», «жертвенник» и «освящены» уместны и согласованы с храмовым контекстом. «Очищены от осквернения» не подменяет освящение очищением: оба действия выражены раздельно, а очищение служит естественным русским способом передать исходное состояние, обозначенное ἐκ τῆς βεβηλώσεως.'
