  text: for they had only recently come up from the captivity[a], and all the people of Judea had only recently been gathered together[c][b], and the vessels and the altar and the house had been consecrated from the defilement.
translation:
  language: ru
  text: потому что они лишь недавно вернулись из плена[a], и весь народ Иудеи только недавно был собран воедино, а сосуды, жертвенник и дом[c] были очищены от осквернения и освящены[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из изгнания».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «были освящены от осквернения»; греческое выражение связывает освящение с выходом из прежнего состояния осквернения.'
    reason: lexical_alternative
  - marker: c
    text: Под «домом» здесь подразумевается храм.
    reason: cultural_note
lexical_decisions:
- source_word: προσφάτως
  choice: лишь недавно
  rationale: Передаёт подчёркнутую близость события во времени естественным современным русским выражением.
- source_word: ἀναβεβηκότες
  choice: вернулись
  rationale: В контексте возвращения народа из плена это естественнее по-русски, чем буквальное «поднялись», хотя пространственный оттенок греческого глагола при этом не выражен отдельно.
- source_word: αἰχμαλωσίας
  choice: из плена
  rationale: Передаёт конкретный исторический плен; возможное контекстуальное значение «из изгнания» вынесено в сноску.
- source_word: νεωστὶ
  choice: только недавно
  rationale: Сохраняет повторный акцент греческого текста на недавности восстановления.
- source_word: συνελέλεκτο
  choice: был собран воедино
  rationale: Передаёт плюсквамперфектное пассивное значение и мысль о восстановлении народа как сообщества.
- source_word: σκεύη
  choice: сосуды
  rationale: Обычное краткое обозначение храмовых принадлежностей; их священное назначение ясно из контекста.
- source_word: θυσιαστήριον
  choice: жертвенник
  rationale: Стандартное русское соответствие для алтаря, на котором приносятся жертвы.
- source_word: ὁ οἶκος
  choice: дом
  rationale: Сохраняет буквальное и благоговейное обозначение храма в исходном тексте; референт пояснён в сноске.
- source_word: βεβηλώσεως
  choice: осквернения
  rationale: Передаёт профанацию святыни и естественно образует смысловой контраст с последующим освящением.
- source_word: ἡγιασμένα
  choice: были освящены
  rationale: Передаёт завершённое пассивное действие и наступившее состояние посвящённости святыне.
theological_decisions:
- issue: Передача восстановления святынь после их профанации
  choice: были освящены после осквернения
  alternative: были освящены от осквернения
  rationale: 'Русское «после осквернения» ясно передаёт последовательность профанации и восстановления, тогда как буквальное воспроизведение ἐκ через «от» неестественно. Сноска сохраняет более прямую пространственно-разделительную связь: святыни были выведены из состояния осквернения.'
- issue: Передача ὁ οἶκος в храмовом контексте
  choice: дом
  alternative: храм
  rationale: Слово «дом» сохраняет образность и благоговейную идиому оригинала, а сноска устраняет возможную неясность без подмены исходного выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис остаётся ясным для широкого читателя; повтор указаний на недавность сохранён ради акцента оригинала.
