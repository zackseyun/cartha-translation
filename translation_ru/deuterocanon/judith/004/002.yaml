lexical_decisions:
- source_word: ἐφοβήθησαν σφόδρα σφόδρα
  choice: очень, очень испугались
  rationale: Сохраняет необычное эмфатическое повторение σφόδρα σφόδρα и естественно передаёт сильный страх по-русски.
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: его
  rationale: В данном контексте греческое выражение указывает на причину или источник страха; краткое русское «испугались его» передаёт смысл без неестественного буквализма «от лица его».
- source_word: περὶ Ἰερουσαλὴμ καὶ τοῦ ναοῦ
  choice: за Иерусалим и храм
  rationale: После «встревожились» предлог «за» естественно выражает тревогу о судьбе города и храма.
- source_word: Κυρίου θεοῦ αὐτῶν
  choice: Господа, их Бога
  rationale: Сохраняет оба греческих наименования и их связь с народом; запятая ясно показывает приложение.
theological_decisions:
- issue: Передача титула Κυρίου
  choice: Господа
  alternative: Владыки
  rationale: «Господь» — прямой, общепринятый и конфессионально нейтральный эквивалент Κυρίου в выражении «храм Господа, их Бога».
