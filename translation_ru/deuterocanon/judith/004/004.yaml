translation_notes:
  register: Современный литературный русский язык с кратким повествовательным синтаксисом. Известные библейские топонимы даны в привычной русской форме, а неуверенно идентифицируемые — посредством осторожной транслитерации. Сохраняется неопределённость греческих ὅριον и αὐλών через сноски.
