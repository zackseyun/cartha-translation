  yaml_path: translation/deuterocanon/judith/004/004.yaml
  text: And they sent word into all the territory of Samaria[a], and to Kona, and Beth-horon, and Belmaim, and Jericho, and to Choba, and Aisora, and the valley of Salem[c][b],
translation:
  language: ru
  text: И они разослали весть по всей области Самарии[a], в Кону, Бет-Хорон, Белмаим, Иерихон, Хову, Айсору и в долину Салима[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по всем округам Самарии»; греческое слово может означать границу, округ или территорию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «равнину Салима»; греческое αὐλών может обозначать долину, лощину или похожее на равнину углубление.'
    reason: lexical_alternative
  - marker: c
    text: Некоторые топонимы в этом стихе переданы транслитерацией, поскольку по их греческой форме невозможно уверенно установить, какие именно места имеются в виду.
    reason: cultural_note
lexical_decisions:
- source_word: ἀπέστειλαν
  choice: разослали весть
  rationale: Глагол означает «послали»; прямое дополнение в греческом тексте не выражено. В данном контексте естественное русское выражение «разослали весть» передаёт подразумеваемое сообщение, не уточняя его содержания и не вводя конкретных посланников.
- source_word: εἰς πᾶν ὅριον Σαμαρίας
  choice: по всей области Самарии
  rationale: ὅριον может обозначать границу, округ или территорию. Сочетание с πᾶν и последующим перечнем мест лучше понимать территориально; предлог «по» естественно передаёт распространение вести по всей области.
- source_word: Κωνὰ
  choice: Кона
  rationale: Близкая к греческой форме транслитерация топонима без предположительной географической идентификации.
- source_word: Βαιθωρὼν
  choice: Бет-Хорон
  rationale: Устоявшаяся русская библейская передача известного составного топонима.
- source_word: Βαιλμὰιν
  choice: Белмаим
  rationale: Транслитерация не вполне уверенно идентифицируемого греческого топонима.
- source_word: Ἰερειχὼ
  choice: Иерихон
  rationale: Устоявшаяся русская форма названия города.
- source_word: Χωβὰ
  choice: Хова
  rationale: Близкая русская передача греческого Χωβά; буква «х» отражает χ, а «в» — β в поздней греческой традиции и привычной русской библейской транслитерации.
- source_word: Αἰσωρὰ
  choice: Айсора
  rationale: Топоним передан близкой транслитерацией, поскольку его точная идентификация по одной греческой форме неясна.
- source_word: τὸν αὐλῶνα Σαλήμ
  choice: долину Салима
  rationale: αὐλών обозначает долину, лощину или вытянутое равнинное углубление. «Долина» — наиболее ясный и естественный русский эквивалент; Σαλήμ передано традиционной формой «Салим».
