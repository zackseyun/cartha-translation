base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/001.yaml
  text: And the sons of Israel who lived in Judea heard all that Holofernes[a], the commander-in-chief of King Nebuchadnezzar of the Assyrians, had done to the nations[b], and how he had plundered all their sanctuaries and given them over to destruction.
translation:
  language: ru
  text: Сыны Израиля[a], жившие в Иудее, услышали обо всём, что Олоферн, верховный военачальник Навуходоносора, царя ассирийцев, сделал с народами, и о том, как он разграбил все их святилища[b] и предал их уничтожению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «израильтяне» или «дети Израиля»; буквально по-гречески — «сыны Израиля».
    reason: lexical_alternative
  - marker: b
    text: Или «святыни»; греческое слово может обозначать как священные места, так и священные предметы.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Сохраняет буквальный греческий оборот и его этническое и заветное звучание; в современном русском это торжественное, но понятное библейское выражение.
- source_word: οἱ κατοικοῦντες ἐν τῇ Ἰουδαίᾳ
  choice: жившие в Иудее
  rationale: Естественно передаёт причастие со значением постоянного проживания.
- source_word: πάντα ὅσα ἐποίησεν
  choice: обо всём, что ... сделал
  rationale: Передаёт полноту греческого выражения и естественно сочетается с глаголом «услышали».
- source_word: ὁ ἀρχιστράτηγος
  choice: верховный военачальник
  rationale: Отражает положение главного военного начальника точнее, чем общее «военачальник» или «полководец».
- source_word: τοῖς ἔθνεσιν
  choice: с народами
  rationale: В повествовательном контексте речь идёт о покорённых народах, а не о богословской категории «язычников»; предлог «с» естественен при русском «сделал».
- source_word: ἐσκύλευσεν
  choice: разграбил
  rationale: Точно и ясно передаёт военное ограбление и разорение.
- source_word: τὰ ἱερὰ αὐτῶν
  choice: все их святилища
  rationale: Контекст указывает на культовые места покорённых народов; примечание сохраняет более широкую возможность значения «святыни».
- source_word: ἔδωκεν αὐτὰ εἰς ἀφανισμόν
  choice: предал их уничтожению
  rationale: Сохраняет образ передачи на уничтожение, не сводя оборот к простому «уничтожил» и не вводя специальной терминологии заклятия.
theological_decisions:
- issue: Передача этнического обозначения οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбранный вариант сохраняет мужскую форму и заветно-родовое звучание источника, оставаясь понятным в литературном русском языке.
- issue: Объём значения τὰ ἱερὰ αὐτῶν
  choice: их святилища
  alternative: их святыни; их храмы; их священные предметы
  rationale: «Святилища» хорошо соответствует контексту разорения культовых мест, однако примечание не скрывает того, что греческое слово может обозначать шире священные места или предметы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён для ясности, но порядок содержания и смысловые связи греческого текста сохранены.
