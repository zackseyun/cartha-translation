lexical_decisions:
- source_word: ἔγραψεν
  choice: написал
  rationale: Прямо передаёт аорист γράφω; дополнение «письмо» в греческом тексте отсутствует.
- source_word: ἱερεὺς ὁ μέγας
  choice: великий священник
  rationale: Сохраняет выраженную в греческой формулировке конструкцию «священник, великий»; более привычный титул указан в примечании.
- source_word: ὃς ἦν ἐν ταῖς ἡμέραις ἐν Ἰερουσαλήμ
  choice: находившийся в те дни в Иерусалиме
  rationale: Естественно передаёт как местонахождение Иоакима, так и временное выражение «в те дни».
- source_word: τοῖς κατοικοῦσι
  choice: жителям
  rationale: Краткий и естественный русский эквивалент субстантивированного причастия со значением постоянного проживания.
- source_word: Βαιτουλουὰ
  choice: Ветилуи
  rationale: Форма топонима согласована с утвердившейся русской библейской традицией и поставлена в дательном падеже после «жителям».
- source_word: Βαιτομεσθαίμ
  choice: Ветомесфема
  rationale: Транслитерация греческого топонима с русским падежным оформлением.
- source_word: ἀπέναντι
  choice: напротив
  rationale: Точно и естественно передаёт пространственное противопоставление.
- source_word: κατὰ πρόσωπον
  choice: перед
  rationale: Сохраняет пространственное значение оборота без искусственного повторения идеи «напротив».
- source_word: τοῦ πεδίου
  choice: равниной
  rationale: В данном топографическом контексте πεδίον означает равнину или ровную открытую местность.
- source_word: τοῦ πλησίον Δωθάειμ
  choice: близ Дофаима
  rationale: Передаёт значение близости; «близ» соответствует достоинству библейского повествовательного регистра и остаётся понятным.
theological_decisions:
- issue: Передача ἱερεὺς ὁ μέγας
  choice: великий священник
  alternative: первосвященник
  rationale: Основной текст прозрачно сохраняет необычную форму исходного выражения и его институциональный оттенок, не устраняя разницу между буквальной формой и общепринятым названием должности; идиоматический вариант дан в примечании.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранена синтаксическая незавершённость стиха, поскольку греческий текст заканчивается запятой и предложение продолжается далее. Относительное местоимение «который» отнесено к ближайшему топониму Ветомесфем, как допускает греческое согласование ἥ.
