  text: And Joakim the high priest[a], who was in Jerusalem in those days, wrote to those living in Bethulia and Betomesthaim, which is opposite Esdraelon, facing the plain near Dothaim,
translation:
  language: ru
  text: Иоаким, первосвященник[a], находившийся в те дни в Иерусалиме, написал жителям Ветилуи и Ветомесфема; Ветилуя расположена напротив Ездрилона, обращённая к равнине близ Дофаима,
  philosophy: optimal-equivalence
