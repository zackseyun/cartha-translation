  - severity: medium
    issue: «великий священник» неудачно передаёт титул ἱερεὺς ὁ μέγας.
    rationale: В русском это прежде всего характеризующее определение, тогда как в контексте речь идёт о верховном священническом сане. «Первосвященник» — устойчивый функциональный эквивалент; дословная греческая конструкция остаётся в примечании.
  - severity: low
    issue: «перед равниной» в исходном варианте семантически возможно, но географически тяжеловесно.
    rationale: «Обращённой к равнине» естественнее передаёт κατὰ πρόσωπον в сочетании с описанием местоположения.
