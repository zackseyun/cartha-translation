  text: And every man of Israel[a], and the women and the children, those dwelling in Jerusalem, fell on their faces before the temple, and put ashes on their heads, and spread out their sackcloth before the Lord,
translation:
  language: ru
  text: И все мужчины Израиля, женщины и дети, жившие в Иерусалиме, пали ниц перед храмом, посыпали головы пеплом и расстелили перед Господом свои одежды из мешковины[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёрли свои одежды из мешковины». Греческое выражение необычно: оно может означать, что они расстелили одежды из мешковины, либо что они простёрлись перед Господом, будучи одеты в мешковину, в знак скорби и мольбы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ἀνὴρ Ἰσραὴλ καὶ γυνὴ καὶ παιδία
  choice: все мужчины Израиля, женщины и дети
  rationale: Сохраняет явное перечисление мужчин, женщин и детей; ἀνήρ имеет здесь мужское, а не обобщённое значение. Русское согласование передаёт собирательный охват без неестественного буквального «каждый мужчина… и женщина».
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: жившие в Иерусалиме
  rationale: Естественно передаёт причастный оборот, относящийся ко всей перечисленной группе.
- source_word: ἔπεσον κατὰ πρόσωπον τοῦ ναοῦ
  choice: пали ниц перед храмом
  rationale: «Пали ниц» точно и идиоматично выражает телесную позу молитвенного уничижения, а «перед храмом» передаёт пространственную направленность оборота.
- source_word: ἐσποδώσαντο τὰς κεφαλὰς αὐτῶν
  choice: посыпали головы пеплом
  rationale: Передаёт обычай скорби и мольбы ясным современным русским выражением.
- source_word: ἐξέτειναν τοὺς σάκκους αὐτῶν
  choice: распростёрли свои вретища
  rationale: Сохраняет конкретный глагол «простирать» и необычность греческого выражения, не определяя чрезмерно точно физическое действие; возможная неоднозначность отмечена в сноске.
- source_word: κατὰ πρόσωπον Κυρίου
  choice: пред Господом
  rationale: Естественный для возвышенного библейского регистра русский эквивалент идиомы пребывания перед лицом Бога.
- source_word: Κυρίου
  choice: Господом
  rationale: Передаёт κύριος традиционным и общепонятным обозначением Бога Израиля.
theological_decisions:
- issue: Гендерно конкретное перечисление молящихся
  choice: Сохранено перечисление «мужчины Израиля, женщины и дети».
  alternative: «Все израильтяне»
  rationale: Греческий текст намеренно называет мужчин, женщин и детей по отдельности; обобщение устранило бы эту риторическую деталь.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка; Бог
  rationale: «Господь» — прямой, традиционный и не привносящий дополнительного толкования эквивалент κύριος в данном иудейском контексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Пали ниц», «вретища» и «пред Господом» сохраняют достоинство и ритуальный колорит сцены, оставаясь понятными по контексту. Маркер сноски помещён при спорном выражении о вретищах, а не после упоминания Израиля.
