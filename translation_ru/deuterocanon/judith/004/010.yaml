  source_fidelity: В целом перевод точно передаёт обращённый к Богу громкий вопль, двукратно повторённую характеристику ἐν ἐκτενείᾳ μεγάλῃ и буквальное ψυχή-выражение. Однако сочетание распределительного подлежащего в единственном числе «каждый из мужчин» с последующим «они» по-русски заметно сбивает синтаксис. Уточнение «из мужчин» также менее точно и естественно, чем прямое «каждый мужчина».
