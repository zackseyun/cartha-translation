lexical_decisions:
- source_word: ἀνεβόησαν
  choice: громко воззвал
  rationale: Глагол обозначает громкий, настойчивый вопль или призыв; «воззвал» естественно передаёт обращённую к Богу молитву, а «громко» сохраняет выраженную глаголом силу голоса.
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  choice: каждый из мужчин Израиля
  rationale: Сохранены распределительное единственное число πᾶς ἀνήρ и явно мужское обозначение, но использована естественная для современного русского языка конструкция.
- source_word: πρὸς τὸν θεόν
  choice: к Богу
  rationale: В контексте молитвенного обращения πρὸς с винительным естественно передаётся как «к Богу».
- source_word: ἐν ἐκτενείᾳ μεγάλῃ
  choice: с великим усердием
  rationale: Выражение указывает на напряжённую, неослабевающую ревность. Повтор сочетания в обеих частях стиха сохранён для передачи авторского акцента.
- source_word: ἐταπείνουσαν
  choice: смиряли
  rationale: Имперфект передан формой несовершенного вида, отражающей продолжавшееся действие; «смиряли» прямо соответствует значению ταπεινόω, не уточняя, совершалось ли это посредством поста или иного самоумаления.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: свои души
  rationale: Сохранено явное ψυχή-языковое выражение источника. Смысл может быть идиоматическим — «самих себя», что отмечено в сноске.
theological_decisions:
- issue: Мужское обозначение в πᾶς ἀνὴρ Ἰσραήλ
  choice: каждый из мужчин Израиля
  alternative: каждый из израильтян; все мужчины Израиля
  rationale: ἀνήρ прямо обозначает мужчину, а πᾶς с единственным числом имеет распределительный характер; перевод сохраняет обе особенности без гендерного обобщения.
- issue: Антропологическая формулировка τὰς ψυχὰς αὐτῶν
  choice: смиряли свои души
  alternative: смиряли себя
  rationale: Буквальная формулировка сохраняет упоминание «душ», не превращая его в утверждение о строгом разделении души и тела; возможное идиоматическое понимание вынесено в сноску.
- issue: Характер смирения
  choice: смиряли
  alternative: изнуряли; унижали
  rationale: Контекст допускает покаянное самоумаление, возможно связанное с постом, однако сам глагол не требует конкретизировать способ; поэтому более узкое толкование не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой («воззвал», «смиряли»). Синтаксический переход от распределительного единственного числа («каждый… воззвал») к множественному («они… смиряли») сохраняет заметное согласование греческого текста, оставаясь понятным по-русски.
