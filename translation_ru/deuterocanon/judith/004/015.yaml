lexical_decisions:
- source_word: Ἰωακεὶμ
  choice: Иоаким
  rationale: Устоявшаяся русская передача греческой формы имени, естественная для библейского текста.
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: первосвященник
  rationale: Стандартное русское название должности, которую обозначает греческое выражение «великий священник».
- source_word: οἱ παρεστηκότες ἐνώπιον Κυρίου
  choice: стоявшие перед Господом
  rationale: Сохраняет конкретный образ предстояния и его храмовый, благоговейный оттенок.
- source_word: οἱ λειτουργοῦντες Κυρίῳ
  choice: служившие Господу
  rationale: В контексте обозначает совершавших храмовое служение; краткая русская формулировка сохраняет культовый смысл без искусственной терминологии.
- source_word: σάκκους περιεζωσμένοι τὰς ὀσφύας αὐτῶν
  choice: обвязав бёдра мешковиной
  rationale: Передаёт конкретное покаянное одеяние современным и понятным языком; «бёдра» здесь естественнее архаичного «чресла».
- source_word: προσέφερον
  choice: приносили
  rationale: Несовершенный вид передаёт длительное или повторявшееся действие греческого имперфекта.
- source_word: τὴν ὁλοκαύτωσιν τοῦ ἐνδελεχισμοῦ
  choice: постоянное всесожжение
  rationale: «Всесожжение» точно передаёт полностью сжигаемую жертву, а «постоянное» — регулярный или непрерывный характер, выраженный ἐνδελεχισμός.
- source_word: τὰς εὐχὰς
  choice: молитвы
  rationale: Основное значение уместно при перечислении того, что возносили Господу; возможный культовый смысл «обеты» сохранён в примечании.
- source_word: τὰ ἑκούσια δόματα
  choice: добровольные дары
  rationale: Прямо и естественно передаёт добровольность даров народа.
theological_decisions:
- issue: Передача Κυρίου в греческом девтероканоническом тексте
  choice: Господом / Господу
  alternative: Яхве; Владыкой
  rationale: Источник употребляет κύριος как божественный титул, поэтому «Господь» точно передаёт текст, не подставляя в него отсутствующее здесь написание тетраграмматона.
- issue: Значение εὐχαί в жертвенном перечислении
  choice: молитвы
  alternative: обеты; обетные приношения
  rationale: Форма может означать как молитвы, так и обеты. Перевод «молитвы» сохраняет естественный смысл выражения «приносить/возносить молитвы», а культовая альтернатива отмечена, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис сохраняет перечисление и храмовый характер сцены, но избегает архаизмов «чресла» и «вретище». Маркеры примечаний поставлены непосредственно после тех выражений, к которым относятся.
