  source_fidelity: 'Текст точно передаёт греческий оригинал: σποδός передан собирательным «пепел», κιδάρεις — «тюрбаны», а ἐβόων сохранено как напряжённое молитвенное взывание. Оборот «чтобы Он благосклонно призрел» адекватно выражает εἰς ἀγαθὸν ἐπισκέψασθαι — просьбу о благом, благоприятном Божьем обращении к Израилю.'
