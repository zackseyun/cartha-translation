  yaml_path: translation/deuterocanon/judith/004/016.yaml
  text: And there was ashes on their turbans, and they were crying out to the Lord with all their strength, that he might look with favor on the whole house of Israel.
translation:
  language: ru
  text: На их тюрбанах был пепел, и они изо всех сил взывали к Господу, чтобы Он благосклонно призрел на весь дом Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σποδός
  choice: пепел
  rationale: Греческое слово обозначает пепел; единственное число передано как собирательное существительное, что естественно по-русски.
- source_word: κιδάρεις
  choice: тюрбанах
  rationale: κίδαρις — головной убор типа тюрбана; конкретный образ сохранён без замены общим словом «головные уборы».
- source_word: ἐβόων
  choice: взывали
  rationale: Имперфект передаёт продолжительное громкое обращение; «взывали» сохраняет молитвенную торжественность и остаётся понятным современному читателю.
- source_word: ἐκ πάσης δυνάμεως
  choice: изо всех сил
  rationale: Естественный русский эквивалент выражения «со всей силой», передающий напряжённость мольбы.
- source_word: εἰς ἀγαθὸν ἐπισκέψασθαι
  choice: благосклонно призрел
  rationale: ἐπισκέπτομαι здесь означает обратить внимание и вмешаться, а εἰς ἀγαθόν задаёт благой, благоприятный характер этого обращения.
- source_word: πᾶν οἶκον Ἰσραήλ
  choice: весь дом Израиля
  rationale: Сохранена традиционная библейская метафора народа как «дома Израиля».
theological_decisions:
- issue: Характер просимого Божьего обращения к Израилю
  choice: чтобы Он благосклонно призрел
  alternative: чтобы Он посетил во благо
  rationale: Выбранная формулировка передаёт благоприятное Божье внимание и помощь, не сводя смысл ни к простому наблюдению, ни к физическому посещению.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис прост и ясен; традиционные выражения «взывали», «призрел» и «дом Израиля» сохранены там, где они точно передают молитвенный и общеизраильский контекст.
