lexical_decisions:
- source_word: διακατασχεῖν
  choice: занять
  rationale: Инфинитив обозначает установление и удержание контроля над стратегическими путями; «занять» естественно звучит в русском военном контексте и не добавляет непременно смысла штурмового захвата.
- source_word: τὰς ἀναβάσεις τῆς ὀρεινῆς
  choice: подъёмы в горной местности
  rationale: Передаёт буквальный топографический смысл «подъёмов горной области», не сводя выражение безоговорочно к перевалам.
- source_word: ἡ εἴσοδος εἰς τὴν Ἰουδαίαν
  choice: вход в Иудею
  rationale: Прямое соответствие греческой именной конструкции с конкретным смыслом пути доступа.
- source_word: εὐχερῶς διακωλῦσαι
  choice: было легко задержать
  rationale: Передаёт лёгкость воспрепятствования движению противника; «задержать» уместно в военно-топографическом контексте.
- source_word: προσβαίνοντας
  choice: наступающих
  rationale: Причастие описывает приближающихся или продвигающихся к позиции людей; «наступающих» естественно в данном военном контексте, хотя топографический оттенок движения вверх раскрывается предшествующим словом «подъёмы».
- source_word: στενῆς τῆς προσβάσεως οὔσης
  choice: так как подход был узок
  rationale: Сохраняет причинную функцию генитивной абсолютной конструкции и различает сам подход от ранее названных подъёмов.
- source_word: ἐπʼ ἄνδρας τοὺς πάντας δύο
  choice: позволял всем воинам идти лишь по двое
  rationale: 'Контекстуально передаёт наиболее вероятный смысл сжатой и трудной греческой фразы: ограниченная ширина пути допускала движение только по двое.'
