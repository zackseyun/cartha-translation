  yaml_path: translation/deuterocanon/judith/004/006.yaml
  text: And they fortified the villages among them[a], and they stored up food supplies in preparation for war, because their fields had been newly harvested.
translation:
  language: ru
  text: Они укрепили селения среди них[a] и запасли продовольствие, готовясь к войне, потому что их поля были недавно убраны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «селения посреди них». Греческое выражение не позволяет с уверенностью определить более точный географический смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτείχισαντο
  choice: укрепили
  rationale: Средняя форма от τειχίζω означает сделать место защищённым, в том числе обнести стеной; «укрепили» естественно передаёт смысл, не уточняя вид сооружений.
- source_word: τὰς ἐν αὐτοῖς κώμας
  choice: селения среди них
  rationale: κώμας означает небольшие поселения, а пространственно сжатое ἐν αὐτοῖς допускает значение «среди них»; формулировка сохраняет неоднозначность соотнесения местоимения.
- source_word: παρέθεντο εἰς ἐπισιτισμὸν
  choice: запасли продовольствие
  rationale: В данном контексте сочетание обозначает заготовку пищи впрок; русский оборот краток, ясен и естественен.
- source_word: εἰς παρασκευὴν πολέμου
  choice: готовясь к войне
  rationale: Передаёт целевое значение выражения и звучит естественно по-русски; παρασκευή здесь означает подготовку.
- source_word: προσφάτως
  choice: недавно
  rationale: Наречие указывает на недавнее совершение действия.
- source_word: τεθερισμένα
  choice: были убраны
  rationale: Перфектное страдательное причастие от θερίζω указывает, что урожай на полях уже собрали; «поля были убраны» — современный русский сельскохозяйственный оборот.
