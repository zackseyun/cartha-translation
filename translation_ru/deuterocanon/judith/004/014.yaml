base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/014.yaml
  text: And the Lord heard their voice and looked upon their affliction[b][a], and the people were fasting for many days throughout all Judea and Jerusalem before the holy things of the Lord Almighty.
translation:
  language: ru
  text: И услышал Господь их голос[a], и воззрел на их бедствие; и народ постился много дней по всей Иудее и в Иерусалиме пред святынями Господа Вседержителя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их вопль». По-гречески буквально: «их голос»; в контексте молитвы и бедствия это выражение может означать мольбу о помощи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пред святилищем»; «пред святыми местами». В греческом тексте стоит множественное число — буквально «пред святынями», — которое может указывать на священные предметы или храмовые места Господа Вседержителя.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσήκουσεν
  choice: услышал
  rationale: Передаёт как прямое значение глагола, так и возможный контекстуальный оттенок благосклонного внимания к молитве, не превращая его в явное обещание вмешательства.
- source_word: τῆς φωνῆς αὐτῶν
  choice: их голос
  rationale: Сохраняет буквальный образ греческого φωνή; в контексте молитвы выражение может подразумевать вопль или мольбу, что отмечено в сноске.
- source_word: ἐπεῖδεν
  choice: воззрел
  rationale: Выражает внимательный взгляд и принятие бедствия во внимание; возвышенная, но понятная форма соответствует библейскому повествованию.
- source_word: τὴν θλίψιν αὐτῶν
  choice: их бедствие
  rationale: Обозначает тяжёлое положение и страдание народа; «бедствие» естественно в данном контексте общей угрозы.
- source_word: ἦν ὁ λαὸς νηστεύων
  choice: народ постился
  rationale: Русский несовершенный вид естественно передаёт продолженное действие перифрастической греческой конструкции.
- source_word: ἡμέρας πλείους
  choice: много дней
  rationale: Передаёт длительность поста без неестественного буквального сравнительного оборота.
- source_word: ἐν πάσῃ τῇ Ἰουδαίᾳ καὶ Ἰερουσαλήμ
  choice: по всей Иудее и в Иерусалиме
  rationale: Естественно передаёт распространённость поста по всей области и в городе, сохраняя усиление πάσῃ.
- source_word: κατὰ πρόσωπον
  choice: пред
  rationale: Краткий и уместный в культовом контексте эквивалент выражения «перед лицом, в присутствии».
- source_word: τῶν ἁγίων
  choice: святынями
  rationale: Сохраняет субстантивированное множественное число и не сводит неоднозначное выражение к единственному числу «святилище».
- source_word: Κυρίου Παντοκράτορος
  choice: Господа Вседержителя
  rationale: Традиционный и точный русский эквивалент божественного титула, естественный для литературного библейского регистра.
theological_decisions:
- issue: Передача κύριος как божественного титула
  choice: Господь
  alternative: Владыка
  rationale: «Господь» прямо и традиционно передаёт κύριος в отношении Бога, не ослабляя его до общего обозначения властителя.
- issue: Значение τῶν ἁγίων в культовом контексте
  choice: святыни
  alternative: святилище / святые места
  rationale: Множественное число сохранено, чтобы не разрешать искусственно, относится ли выражение к священным предметам, местам или храмовой святыне в собирательном смысле.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формы «воззрел» и «пред» поддерживают достоинство текста, оставаясь понятными; синтаксис упрощён до естественного русского повествования без устранения неоднозначности культового выражения.
