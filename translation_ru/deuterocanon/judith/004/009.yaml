base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/009.yaml
  text: And the sons of Israel did as Joakim the high priest and the council of the whole people of Israel[a], who sat in Jerusalem[c][b], instructed them.
translation:
  language: ru
  text: И сыны Израиля[a] поступили так, как предписали им первосвященник Иоаким и совет всего народа Израиля — те, кто заседал в Иерусалиме.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне»; буквально: «сыновья Израиля».'
    reason: lexical_alternative
  - marker: b
    text: Греческий оборот буквально означает «те, кто сидел в Иерусалиме»; он может относиться к первосвященнику и совету вместе либо прежде всего к совету.
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Формально близкая передача сохраняет библейское корпоративное наименование народа; более гладкий вариант «израильтяне» указан в примечании.
- source_word: ἐποίησαν ... καθὰ
  choice: поступили так, как
  rationale: Естественная русская конструкция точно выражает действие в соответствии с данным распоряжением.
- source_word: συνέταξεν
  choice: предписали
  rationale: Глагол обозначает авторитетное распоряжение. Множественное число в русском согласовано с составным субъектом — Иоакимом и советом, тогда как единственное число греческого глагола объяснимо согласованием с ближайшим предшествующим именем.
- source_word: Ἰωακεὶμ
  choice: Иоаким
  rationale: Традиционная и узнаваемая русская передача греческой формы имени.
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: первосвященник
  rationale: Устоявшееся русское обозначение данной иудейской должности.
- source_word: ἡ γερουσία
  choice: совет
  rationale: Передаёт собрание старейшин понятным современным словом без неуместных ассоциаций слова «сенат».
- source_word: παντὸς δήμου Ἰσραήλ
  choice: всего народа Израиля
  rationale: δῆμος здесь обозначает народ как целое; перевод не создаёт лишнего впечатления о конкретно созванном собрании.
- source_word: οἱ ἐκάθηντο ἐν Ἰερουσαλήμ
  choice: те, кто заседал в Иерусалиме
  rationale: Формулировка сохраняет множественное число греческого относительного оборота и допускает его отнесение к названным руководителям совместно; «заседал» естественно передаёт официальное пребывание совета, не превращая его без основания в постоянное жительство.
theological_decisions:
- issue: Корпоративное наименование Израиля
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Более буквальная форма сохраняет библейскую образность и коллективную идентичность, не добавляя конфессионального толкования.
- issue: К кому относится заключительный оборот
  choice: к названным руководителям как группе
  alternative: только к совету
  rationale: Мужской род множественного числа οἱ ἐκάθηντο естественно позволяет охватить Иоакима и совет вместе, хотя по смыслу оборот может характеризовать прежде всего совет. Перевод и примечание сохраняют эту синтаксическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Сыны Израиля» намеренно сохраняет исходную идиому; остальной синтаксис сделан естественным для современного читателя. Тире помогает ясно присоединить неоднозначный заключительный оборот.
