base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/004/013.yaml
  text: And they covered the altar with sackcloth, and they cried out to the God of Israel together with fervor, that he might not give their little children over to plunder, and their women to spoil, and the cities of their inheritance to destruction, and the holy things to defilement and reproach, as something the nations would gloat over.
translation:
  language: ru
  text: И жертвенник они облекли во вретище и все вместе горячо воззвали к Богу Израиля, чтобы Он не отдал их малых детей на разграбление, их женщин — в добычу[a], города их наследия — на уничтожение, а святыни — на осквернение и поругание, на радость народам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их женщин — как военную добычу».'
    reason: lexical_alternative
  - marker: b
    text: То есть предметом торжества или злорадства народов.
    reason: lexical_clarification
lexical_decisions:
- source_word: τὸ θυσιαστήριον
  choice: жертвенник
  rationale: Обозначает место принесения жертв; «жертвенник» точно передаёт храмовый контекст.
- source_word: σάκκῳ περιέβαλλον
  choice: облекли во вретище
  rationale: Передаёт буквальный образ окружения или облачения жертвенника грубой покаянной тканью; достоинство библейского регистра здесь уместно.
- source_word: ἐβόησαν ... ὁμοθυμαδὸν ἐκτενῶς
  choice: все вместе горячо воззвали
  rationale: Сохраняет громкий, совместный и напряжённо-усердный характер обращения.
- source_word: τοῦ μὴ δοῦναι
  choice: чтобы Он не отдал
  rationale: Передаёт содержание мольбы и подразумеваемого субъекта — Бога Израиля.
- source_word: τὰ νήπια ... εἰς διαρπαγὴν
  choice: их малых детей на разграбление
  rationale: νήπια не обязательно ограничивается младенцами, а διαρπαγή обозначает насильственный захват и разграбление.
- source_word: τὰς γυναῖκας εἰς προνομὴν
  choice: их женщин — в добычу
  rationale: γυναῖκες здесь естественно понимать как коллективное «женщины», а προνομή — как военную добычу.
- source_word: τὰς πόλεις τῆς κληρονομίας αὐτῶν
  choice: города их наследия
  rationale: Сохраняет значение полученного удела и возможный заветный оттенок κληρονομία, не раскрывая его сверх текста.
- source_word: εἰς ἀφανισμὸν
  choice: на уничтожение
  rationale: Передаёт сильное значение разрушения или исчезновения.
- source_word: τὰ ἅγια
  choice: святыни
  rationale: 'Русское множественное число сохраняет широкий референт греческого: священные предметы, места или всё освящённое, без сведения к одному зданию.'
- source_word: εἰς βεβήλωσιν καὶ ὀνειδισμόν
  choice: на осквернение и поругание
  rationale: Передаёт как культовую профанацию, так и бесчестье или оскорбление.
- source_word: ἐπίχαρμα τοῖς ἔθνεσιν
  choice: на радость народам
  rationale: Кратко и формально близко передаёт предмет или повод для радости; в контексте речь идёт о враждебном торжестве, что пояснено в сноске.
theological_decisions:
- issue: Заветный оттенок κληρονομία
  choice: наследие
  alternative: достояние; удел
  rationale: «Наследие» сохраняет религиозно-национальную значимость слова, не добавляя невыраженного толкования.
- issue: Неопределённый референт τὰ ἅγια
  choice: святыни
  alternative: священные предметы; святилище
  rationale: Множественное «святыни» не сужает греческое выражение до одного святилища и сохраняет исходную неоднозначность.
- issue: Характер радости народов в ἐπίχαρμα
  choice: на радость народам
  alternative: предмет злорадства для народов
  rationale: Основной текст сохраняет лаконичную формулировку оригинала, а подразумеваемый оттенок враждебного торжества указывается в примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Вретище», «жертвенник» и «воззвали» сохраняют культовую и молитвенную окраску, оставаясь понятными в контексте. Параллельный ряд с тире воспроизводит риторическое нарастание греческого текста.
