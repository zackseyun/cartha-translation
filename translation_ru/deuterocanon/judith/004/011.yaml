  yaml_path: translation/deuterocanon/judith/004/011.yaml
  text: They themselves and their wives and their little children and their livestock—and every resident alien or hired worker or purchased servant among them—put sackcloth on their waists[a][b][c].
translation:
  language: ru
  text: Они сами, их жёны, их малые дети и их скот, а также каждый чужеземец, живущий среди них[a], наёмный работник или купленный ими раб[b] — все надели вретище на пояс[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «переселенец» — чужеземец, живущий среди местного населения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «купленный за серебро», то есть приобретённый раб.'
    reason: lexical_alternative
  - marker: c
    text: Вретище — грубая ткань; его надевали в знак скорби, смирения или мольбы.
    reason: cultural_note
lexical_decisions:
- source_word: νήπια
  choice: малые дети
  rationale: Передаёт значение очень маленьких детей, не сужая его исключительно до младенцев, и естественно звучит по-русски.
- source_word: κτήνη
  choice: скот
  rationale: Обозначает домашних хозяйственных животных как совокупность; это краткий и общепонятный русский эквивалент.
- source_word: πάροικος
  choice: живший среди них чужеземец
  rationale: Передаёт одновременно ненативное происхождение и проживание среди данного народа; примечание сохраняет более буквальную социальную категорию переселенца.
- source_word: μισθωτός
  choice: наёмный работник
  rationale: Ясно обозначает человека, работающего за плату, без устаревшего или пренебрежительного оттенка слова «наёмник».
- source_word: ἀργυρώνητος
  choice: купленный ими раб
  rationale: Слово буквально означает приобретённого за серебро человека; «раб» не скрывает выраженный в греческом тексте статус собственности.
- source_word: ἐπέθεντο σάκκους
  choice: надели вретище
  rationale: Естественно передаёт действие облачения в грубую ткань; единственное собирательное «вретище» соответствует устойчивому русскому библейскому употреблению.
- source_word: ἐπὶ τὰς ὀσφύας αὐτῶν
  choice: на бёдра
  rationale: Сохраняет указанную область тела без архаичного русского «чресла».
theological_decisions:
- issue: Передача подневольного статуса в ἀργυρώνητος
  choice: купленный ими раб
  alternative: купленный слуга; купленный за серебро человек
  rationale: Греческое слово прямо указывает на приобретение человека как собственности. Перевод не смягчает реалию рабства, а буквальный образ серебра поясняется в сноске.
- issue: Соотношение категорий πάροικος, μισθωτός и ἀργυρώνητος
  choice: чужеземец, наёмный работник или купленный ими раб
  alternative: чужеземец — наёмный работник и купленный ими раб
  rationale: Сохраняется разделительное ἢ перед μισθωτός и естественно оформляется перечень социальных категорий; конструкция не утверждает, что всякий чужеземец непременно принадлежал к одной из двух последующих групп.
translation_notes:
  register: Современный литературный русский с умеренно библейским словом «вретище», которое пояснено в сноске. Синтаксис торжественный, но понятный; архаизмы вроде «чресла» и двусмысленное «наёмник» не используются.
