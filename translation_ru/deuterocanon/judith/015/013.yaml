  text: And they gave Judith the tent of Holofernes[a], and all the silver vessels, and the couches, and the utensils, and all his furnishings. And she took them and placed them on her mule, and harnessed her wagons[b], and piled them on them.
translation:
  language: ru
  text: И отдали Иудифи шатёр Олоферна, всю серебряную утварь, ложа, принадлежности[a] и всё его снаряжение. Она взяла всё это, положила на своего мула, запрягла свои повозки и навалила всё это на них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «принадлежности» (ὅλκια), встречается редко, и его точное значение неясно; возможно, имеются в виду завесы, покрывала или другие принадлежности шатра.
    reason: lexical_alternative
  - marker: b
    text: По всей видимости, Иудифь навалила вещи на повозки, хотя местоимения в греческом тексте употреблены сжато и допускают некоторую неясность.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνήν
  choice: шатёр
  rationale: Обычное обозначение походного или военного шатра; в контексте речь идёт о полевом жилище Олоферна.
- source_word: ἀργυρώματα
  choice: серебряная утварь
  rationale: Слово обозначает изделия из серебра без ограничения столовыми приборами; «утварь» естественно передаёт собирательный смысл.
- source_word: κλίνας
  choice: ложа
  rationale: κλίνη может означать кровать или ложе для возлежания; «ложа» сохраняет эту смысловую широту и соответствует торжественному повествовательному регистру.
- source_word: ὅλκια
  choice: принадлежности
  rationale: Редкое и не вполне ясное слово, вероятно обозначающее предметы обстановки или принадлежности шатра; широкое соответствие не навязывает узкой идентификации.
- source_word: σκευάσματα
  choice: снаряжение
  rationale: Широкое обозначение вещей, оснащения или имущества; в обстановке военного лагеря «снаряжение» уместно и не дублирует предыдущий элемент списка.
- source_word: ἡμίονον
  choice: мулица
  rationale: Греческая форма указывает на мула женского пола; русское «мулица» точно и понятно передаёт это значение.
- source_word: ἔζευξεν
  choice: запрягла
  rationale: В сочетании с повозками глагол естественно передаётся русским «запрягла».
- source_word: ἁμάξας
  choice: повозки
  rationale: Нейтральное обозначение колёсных грузовых средств, пригодных для перевозки добычи.
- source_word: ἐσώρευσεν
  choice: сложила
  rationale: Глагол буквально передаёт складывание или нагромождение; «сложила всё» звучит естественно применительно к погрузке вещей на повозки.
