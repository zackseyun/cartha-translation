  text: But the sons of Israel[a], returning from the slaughter, took possession of the rest, and the villages and hamlets in the hill country and in the plain took much plunder[c][b], for there was a very great quantity.
translation:
  language: ru
  text: А сыны Израиля[a], возвратившись с побоища, овладели теми, кто ещё оставался. И селения и усадьбы[b] в горной области и на равнине захватили много добычи[c], потому что её было чрезвычайно много.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально по-гречески: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «селения и сельские дворы». Слово, переведённое как «усадьбы», может обозначать сельские жилища или небольшие сельские поселения.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «много трофеев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Формально близко передаёт греческое выражение и сохраняет возвышенный библейский регистр; более естественный вариант «израильтяне» отмечен в сноске.
- source_word: ἀναστρέψαντες ἀπὸ τῆς κοπῆς
  choice: возвратившись после побоища
  rationale: Причастие выражает возвращение после боевого преследования, а κοπή в военном контексте означает массовое поражение или избиение. «После» естественнее по-русски, чем буквальное «от».
- source_word: ἐκυρίευσαν τῶν λοιπῶν
  choice: овладели теми, кто ещё оставался
  rationale: Передаёт управление родительным падежом при κυριεύω и сохраняет неопределённость οἱ λοιποί как оставшихся людей, не уточняя сверх текста, были ли они пленены или убиты.
- source_word: αἱ κῶμαι καὶ ἐπαύλεις
  choice: селения и усадьбы
  rationale: κῶμαι обозначает селения, а ἐπαύλεις — сельские жилища, дворы или усадьбы; сочетание различает два типа поселений без излишней конкретизации.
- source_word: ἐν τῇ ὀρεινῇ καὶ πεδινῇ
  choice: в горной области и на равнине
  rationale: Ясно и естественно передаёт стандартные географические обозначения горной местности и равнины.
- source_word: ἐκράτησαν πολλῶν λαφύρων
  choice: захватили множество добычи
  rationale: κρατέω здесь означает завладеть или захватить, а λάφυρα — военную добычу. Формулировка сохраняет военный контекст и количественный акцент.
- source_word: ἦν γὰρ πλῆθος πολὺ σφόδρα
  choice: потому что её было чрезвычайно много
  rationale: Сохраняет причинную связь и усиление πλῆθος πολὺ σφόδρα, избегая неестественного русского «было чрезвычайно великое количество».
