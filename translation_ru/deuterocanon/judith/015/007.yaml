translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис разделён на два предложения ради ясности: в греческом тексте сначала действуют сыны Израиля, затем жители окрестных селений и усадеб. Подлежащее второй части сохранено буквально, несмотря на возможную метонимию «селения» — «жители селений».'
