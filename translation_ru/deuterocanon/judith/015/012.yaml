lexical_decisions:
- source_word: ἐλαφύρευσεν
  choice: разграблял
  rationale: Глагол означает захват добычи у побеждённого врага. Несовершенный вид естественно сочетается с указанием длительности «тридцать дней» и передаёт продолжавшееся действие.
- source_word: πᾶς ὁ λαός
  choice: весь народ
  rationale: Сочетание обозначает весь народ или всё собравшееся сообщество; перевод «войско» неоправданно сужал бы значение.
- source_word: τὴν παρεμβολήν
  choice: лагерь
  rationale: В данном военном контексте речь идёт о неприятельском лагере. «Лагерь» — ясный и естественный современный эквивалент.
- source_word: ἐφʼ ἡμέρας τριάκοντα
  choice: тридцать дней
  rationale: Оборот указывает на длительность действия; предложная конструкция «в течение тридцати дней» по-русски возможна, но здесь избыточна.
