base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/010.yaml
  text: You have done all these things by your hand[a]; you have done good things for Israel, and God has been pleased with them[b]. May you be blessed by the Almighty Lord forever.
translation:
  language: ru
  text: Ты совершила всё это своей рукой; ты сделала добрые дела для Израиля[a], и Бог был ими доволен[b]. Да будешь ты благословенна Господом Вседержителем навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «ты сделала добрые дела с Израилем»; здесь сочетание, вероятнее всего, означает добрые дела, сделанные для Израиля, то есть ему на благо.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и Бог был доволен ими», то есть израильтянами. Греческое местоимение может относиться либо к добрым делам, либо, менее вероятно, к народу Израиля.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐποίησας πάντα ταῦτα ἐν χειρί σου
  choice: Ты совершила всё это своей рукой
  rationale: Аорист передаёт завершённое деяние Иудифи; женский род требуется контекстом. Оборот «своей рукой» сохраняет образное инструментальное выражение греческого текста.
- source_word: ἐποίησας τὰ ἀγαθὰ μετὰ Ἰσραήλ
  choice: ты сделала добро для Израиля
  rationale: Субстантивированное τὰ ἀγαθὰ естественно передаётся собирательным «добро». Хотя μετά буквально обычно означает «с», здесь сочетание с «сделала добро» вероятнее выражает действие на благо Израиля.
- source_word: εὐδόκησεν ἐπʼ αὐτοῖς ὁ θεός
  choice: и Бог благоволил к нему
  rationale: Глагол εὐδοκέω выражает благоволение или одобрение. Местоимение αὐτοῖς, вероятнее всего, относится к сделанному добру; русское собирательное «добро» требует формы единственного числа «к нему».
- source_word: εὐλογημένη γίνου
  choice: Да будешь ты благословенна
  rationale: Императив в составе формулы благословения имеет пожелательный характер; конструкция с «да» естественно передаёт этот оттенок и сохраняет женский род.
- source_word: παρὰ τῷ παντοκράτορι κυρίῳ
  choice: Господом Вседержителем
  rationale: В формуле благословения παρά с дательным допускает понимание источника или деятеля. Творительный падеж даёт ясную и естественную русскую формулу, а κύριος и παντοκράτωρ переданы традиционными божественными титулами.
- source_word: εἰς τὸν αἰῶνα χρόνον
  choice: навеки
  rationale: Идиоматически передаёт неограниченную длительность без буквального и неестественного «на век времени».
theological_decisions:
- issue: Референт ἐπʼ αὐτοῖς
  choice: к сделанному добру
  alternative: к израильтянам / Израилю
  rationale: Ближайший грамматический антецедент — τὰ ἀγαθὰ, однако форма мужского множественного числа может указывать и на подразумеваемых людей Израиля. Неоднозначность отмечена в сноске.
- issue: Смысл εὐλογημένη γίνου
  choice: 'пожелание-благословение: «Да будешь ты благословенна»'
  alternative: 'повеление: «Будь благословенна»'
  rationale: В данном торжественном контексте императив действует как благословительная формула, а не как обычное распоряжение.
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: В контексте обращения к Богу «Господь» является естественным и общепринятым соответствием, не вводящим конфессионально узкого толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Сохранены параллелизм двух форм ἐποίησας, образ «своей рукой» и благословительная формула; архаизм «навеки» уместен и общепонятен.
