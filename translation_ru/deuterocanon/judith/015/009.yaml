base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/009.yaml
  text: And when they entered to her[a], they all with one accord blessed her and said to her, “You are the exaltation of Jerusalem, you are the great boast of Israel[b], you are the great glory of our people.”
translation:
  language: ru
  text: 'Когда они вошли к ней, все единодушно благословили её и сказали ей: «Ты — возвышение Иерусалима[a], ты — великая гордость Израиля, ты — великая слава нашего народа[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «высота Иерусалима»; греческое слово передаёт образ высоты или возвышенного положения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «великий предмет похвалы нашего народа»; греческое существительное также может означать то, чем хвалятся или гордятся.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: вошли к ней
  rationale: Передаёт как глагол вхождения, так и направленность πρός; по-русски выражение звучит естественно и указывает на вхождение в присутствие Иудифи.
- source_word: εὐλόγησαν
  choice: благословили
  rationale: Сохраняет обычное значение глагола и торжественный характер последующего публичного прославления.
- source_word: πάντες ὁμοθυμαδόν
  choice: все единодушно
  rationale: Передаёт и всеобщность πάντες, и согласие, выраженное ὁμοθυμαδόν.
- source_word: ὕψωμα
  choice: возвышение
  rationale: Сохраняет образ высоты и вознесения, не сводя его без пояснения к более общим словам «слава» или «гордость».
- source_word: γαυρίαμα μέγα
  choice: великая гордость
  rationale: Обозначает то, чем Израиль вправе гордиться; в русском это естественная форма торжественного обращения.
- source_word: καύχημα μέγα
  choice: великая слава
  rationale: Передаёт почётный смысл существительного и сохраняет риторическое различие между близкими γαυρίαμα и καύχημα.
- source_word: τοῦ γένους ἡμῶν
  choice: нашего народа
  rationale: Естественно передаёт коллективно-этнический смысл γένος без современных двусмысленностей слова «раса».
theological_decisions:
- issue: Торжественное прославление Иудифи общественно-национальными титулами
  choice: Сохранить три прямых параллельных именования без ослабления их силы
  alternative: Передать их как менее торжественные комплименты, например «ты — гордость Иерусалима»
  rationale: Греческий текст представляет публичное единодушное благословение; прямые именные формулы сохраняют его возвышенную риторику и не вводят дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Трёхчастный параллелизм сохранён; близкие по значению греческие существительные переданы различно, чтобы не сгладить риторическое развитие фразы.
