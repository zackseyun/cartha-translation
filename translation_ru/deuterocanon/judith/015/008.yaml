base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/008.yaml
  text: And Joakim the high priest and the council of the sons of Israel[a], who dwelt in Jerusalem, came to see the good things that the Lord had done for Israel[b], and to see Judith and speak peaceably with her.
translation:
  language: ru
  text: И первосвященник Иоаким, и совет сынов Израиля[a], живших в Иерусалиме, пришли увидеть те благодеяния, которые Господь совершил для Израиля, а также увидеть Иудифь и приветствовать её с миром[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян». Буквально: «сынов Израиля» — традиционное обозначение народа Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «говорить с нею мир»; то есть мирно обратиться к ней, приветствуя или поздравляя её.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰωακειὶμ
  choice: Иоаким
  rationale: Традиционная русская передача греческой формы личного имени.
- source_word: ὁ ἱερεὺς ὁ μέγας
  choice: первосвященник
  rationale: Устоявшееся и естественное русское обозначение главы священства.
- source_word: ἡ γερουσία
  choice: совет
  rationale: Передаёт собрание старейшин или руководящий орган без неуместных римских ассоциаций слова «сенат».
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: сынов Израиля
  rationale: Сохраняет традиционное заветное наименование народа, прямо выраженное в греческом тексте.
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: живших в Иерусалиме
  rationale: Причастный оборот естественно относится к ближайшему существительному — членам совета.
- source_word: τὰ ἀγαθὰ
  choice: те благодеяния
  rationale: В контексте речь идёт о благих деяниях и дарованных Израилю благах; «благодеяния» передаёт эту широту естественнее буквального «добрые вещи».
- source_word: Κύριος
  choice: Господь
  rationale: Устоявшаяся русская библейская передача κύριος в отношении Бога.
- source_word: λαλῆσαι μετʼ αὐτῆς εἰρήνην
  choice: приветствовать её с миром
  rationale: Передаёт семитизированное выражение «говорить с нею мир» как мирное, благожелательное обращение, сохраняя ключевой образ мира.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — традиционная и контекстуально точная передача наименования Бога Израиля.
- issue: Традиционное этническое обозначение τῶν υἱῶν Ἰσραήλ
  choice: сынов Израиля
  alternative: израильтян
  rationale: Сохранена семейно-заветная формула оригинала; сноска поясняет её собирательный смысл.
- issue: Идиома λαλῆσαι μετʼ αὐτῆς εἰρήνην
  choice: приветствовать её с миром
  alternative: мирно поговорить с ней
  rationale: Выбор сохраняет слово «мир» и возможный оттенок приветствия или поздравления, не сводя выражение лишь к спокойной манере речи.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис оригинала сохранён настолько, насколько это не препятствует ясности; буквальные семитизированные обороты разъяснены в сносках.
