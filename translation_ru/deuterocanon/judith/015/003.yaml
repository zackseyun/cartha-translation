  yaml_path: translation/deuterocanon/judith/015/003.yaml
  text: And those encamped in the hill country around Bethulia turned to flight[a]; then the sons of Israel, every man a warrior[c][b], poured out against them.
translation:
  language: ru
  text: А стоявшие лагерем в горной местности вокруг Ветилуи обратились в бегство[a]. Тогда сыны Израиля — все воины до единого — устремились на них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пустились в бегство»; буквально: «обратились в бегство».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «хлынули на них»; буквально: «излились на них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρεμβεβληκότες
  choice: стоявшие лагерем
  rationale: Субстантивированное причастие перфекта обозначает тех, кто расположился и находился в лагере; выражение сохраняет военный контекст и естественно звучит по-русски.
- source_word: ἐν τῇ ὀρεινῇ
  choice: в горной местности
  rationale: Существительное обозначает гористую область или нагорье, а не одну конкретную гору.
- source_word: κύκλῳ Βαιτυλουὰ
  choice: вокруг Ветилуи
  rationale: κύκλῳ передаёт пространственное расположение вокруг города; форма «Ветилуи» соответствует косвенному падежу русского названия.
- source_word: ἐτράπησαν εἰς φυγήν
  choice: обратились в бегство
  rationale: Устойчивое русское военное выражение близко передаёт образную греческую конструкцию и её результативный смысл.
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Сохраняет традиционную и явно мужскую этническую формулу источника; «израильтяне» остаётся допустимым более идиоматическим вариантом.
- source_word: πᾶς ἀνὴρ πολεμιστής
  choice: все воины до единого
  rationale: Передаёт дистрибутивную силу πᾶς ἀνήρ и явно мужское значение πολεμιστής, избегая неестественного буквального оборота «каждый муж — воин».
- source_word: ἐξέχυθησαν ἐπʼ αὐτούς
  choice: устремились на них
  rationale: Естественно передаёт метафору стремительно хлынувшего войска; буквальный пассив «были излиты» по-русски затемнил бы смысл.
theological_decisions:
- issue: Гендерно маркированное этническое и военное обозначение
  choice: сыны Израиля — все воины до единого
  alternative: израильтяне — все способные сражаться
  rationale: В греческом тексте употреблены явно мужские υἱοί и ἀνήρ; перевод сохраняет мужскую отнесённость, не превращая её в гендерно нейтральную формулировку.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской формулой «сыны Израиля». Синтаксис остаётся ясным; тире раскрывает дистрибутивное приложение πᾶς ἀνὴρ πολεμιστής. Все маркеры сносок присутствуют в основном тексте.
