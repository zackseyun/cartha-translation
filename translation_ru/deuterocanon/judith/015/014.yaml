lexical_decisions:
- source_word: συνέδραμεν
  choice: сбежались
  rationale: Передаёт быстрое схождение множества людей к одному месту и сохраняет живость греческого глагола.
- source_word: πᾶσα γυνὴ Ἰσραήλ
  choice: все женщины Израиля
  rationale: Естественное русское выражение коллективного значения греческого единственного числа; буквальная конструкция «всякая женщина Израиля» здесь звучала бы неестественно.
- source_word: τοῦ ἰδεῖν αὐτήν
  choice: чтобы увидеть её
  rationale: Ясно передаёт значение цели, выраженное артиклевым инфинитивом.
- source_word: εὐλόγησαν αὐτήν
  choice: благословляли её
  rationale: Сохраняет основное религиозно-почётное значение εὐλογέω, не сужая его до простой похвалы; несовершенный вид естественно описывает общее праздничное действие.
- source_word: ἐποίησαν αὐτῇ χορὸν ἐξ αὐτῶν
  choice: устроили в её честь хоровод
  rationale: χορὸς здесь естественно понимать как праздничный групповой танец; «хоровод» передаёт организованный круговой или совместный танец, а участницами по контексту были сами женщины.
- source_word: θύρσους
  choice: тирсы
  rationale: Транслитерация сохраняет культурную специфику предмета, для которого нет точного краткого русского соответствия; значение поясняется в сноске.
- source_word: ἔδωκεν ταῖς γυναιξὶν ταῖς μετʼ αὐτῆς
  choice: раздала их женщинам, которые были с ней
  rationale: Множественное дополнение естественно передано глаголом «раздала»; относительная конструкция ясно обозначает сопровождавших Иудифь женщин.
