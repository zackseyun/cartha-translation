  text: But the rest[a], those living in Bethulia, fell upon the camp of Assyria[c][b], and they pursued them and plundered it greatly.
translation:
  language: ru
  text: А остальные жители Ветилуи напали на ассирийский лагерь[a], преследовали их[b] и захватили много добычи[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лагерь Ассура» или «лагерь Ассирии».'
    reason: lexical_alternative
  - marker: b
    text: Буквально греческое выражение означает «шли за ними»; в военном контексте — «преследовали их».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «и основательно разграбили его». В греческом тексте объект глагола прямо не назван; по смыслу речь идёт о лагере и находившейся там добыче.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ λοιποὶ οἱ κατοικοῦντες Βαιτυλουὰ
  choice: А оставшиеся жители Ветилуи
  rationale: Сочетание οἱ λοιποί обозначает оставшихся, а причастный оборот естественно передаётся существительным «жители». δέ здесь продолжает повествование и передано союзом «а». Название Βαιτυλουά передано в принятой русской форме «Ветилуя».
- source_word: ἐπέπεσαν
  choice: напали
  rationale: В данном военном контексте глагол обозначает внезапное враждебное нападение. «Напали» ясно и естественно передаёт смысл без архаической образности.
- source_word: τῇ παρεμβολῇ Ἀσσούρ
  choice: на ассирийский лагерь
  rationale: παρεμβολή здесь означает военный лагерь. Буквальная конструкция «лагерь Ассура/Ассирии» в современном русском менее ясна; определение «ассирийский» естественно выражает принадлежность лагеря, а формальная особенность греческого отмечена в сноске.
- source_word: ἐπορεύοντο αὐτούς
  choice: преследовали их
  rationale: Хотя πορεύομαι обычно значит «идти», сочетание с личным дополнением αὐτούς в контексте бегства неприятеля означает движение вслед за ним, то есть преследование.
- source_word: ἐλούτησαν σφόδρα
  choice: захватили богатую добычу
  rationale: Глагол означает грабить или брать добычу, а σφόδρα усиливает выражение. Русская формулировка естественно передаёт большой объём добычи; отсутствие явно названного дополнения и более буквальный вариант отражены в сноске.
