  source_fidelity: Первая фраза в черновике неверно распределяет синтаксические роли. В греческом αὐτὴ καὶ αἱ μετʼ αὐτῆς — именительная группа («она и те, кто был с нею»), связанная с глаголом среднего залога ἐστεφανώσαντο; речь идёт о том, что Иудифь и женщины с нею увенчали себя оливой/оливковыми венками, а не о том, что неуказанные лица возложили венок на них. Последующая процессия, вооружённые мужчины, венки и гимны переданы по смыслу точно.
  naturalness: «Увенчали себя оливковыми венками» — естественная современная литературная формулировка и сохраняет торжественный регистр. «В хороводе» несколько уже, чем χορεία; «в танцевальном шествии» передаёт возможный процессуальный оттенок, не исключая танца. «С гимнами на устах» звучит естественно.
  terminology: «Оливковые венки», «вооружённые», «венки», «гимны» соответствуют контексту и не вносят конфессиональной интерпретации. Сноска к χορεία должна стоять при самом слове, а не при «вооружённые».
