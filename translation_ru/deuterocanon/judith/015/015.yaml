translation:
  language: ru
  text: Иудифь и женщины, бывшие с нею, увенчали себя оливковыми венками[a]. Она шла впереди всего народа в танцевальном шествии[b], возглавляя всех женщин, а следом шли все мужчины Израиля — вооружённые, в венках и с гимнами на устах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увенчали себя оливой». Вероятно, имеются в виду праздничные или победные венки из оливковых ветвей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в танце», «в хороводе». Греческое слово может обозначать как танец, так и организованный хоровод или танцевальное шествие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐστεφανώσαντο τὴν ἐλαίαν
  choice: возложили на неё венок из оливковых ветвей
  rationale: 'Греческое выражение буквально необычно: «увенчали оливу на ней». В контексте победного празднества речь, вероятнее всего, идёт об оливковом венке; выбранная формулировка естественна по-русски и сохраняет образ.'
- source_word: αὐτὴ καὶ αἱ μετʼ αὐτῆς
  choice: на неё и на женщин, бывших с ней
  rationale: Форма женского рода указывает, что вместе с Иудифью были увенчаны сопровождавшие её женщины.
- source_word: προῆλθεν παντὸς τοῦ λαοῦ
  choice: шла впереди всего народа
  rationale: Передаёт движение Иудифи во главе шествия, не создавая лишнего значения выхода из какого-либо места.
- source_word: ἐν χορείᾳ
  choice: в праздничном танце
  rationale: χορεία может обозначать танец, хоровод либо организованное танцевальное шествие. Определение «праздничном» ясно передаёт контекст, не задавая конкретной хореографии.
- source_word: ἡγουμένη πασῶν τῶν γυναικῶν
  choice: возглавляя всех женщин
  rationale: Прямо передаёт руководящую роль Иудифи в женской части шествия.
- source_word: ἐνωπλισμένοι
  choice: вооружённые
  rationale: Точное и краткое соответствие греческому причастию со значением «снабжённые оружием».
- source_word: μετὰ στεφάνων
  choice: в венках
  rationale: В контексте торжества στέφανοι — праздничные или победные венки, а не царские короны.
- source_word: ὕμνων ἐν τῷ στόματι αὐτῶν
  choice: с гимнами на устах
  rationale: Сохраняет конкретный образ оригинала, звуча при этом естественно и торжественно по-русски.
