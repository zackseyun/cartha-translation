base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/015/005.yaml
  text: But when the sons of Israel heard[a], they all together fell upon them and kept striking them down as far as Choba. Likewise, those from Jerusalem and from all the hill country also arrived, for the things that had happened in the camp of their enemies had been reported to them; and those in Gilead and those in Galilee outflanked them with a great slaughter[c][b], until they had passed Damascus and its borders.
translation:
  language: ru
  text: Но когда сыны Израиля услышали об этом[a], они все как один напали на врагов и поражали их вплоть до Ховы. Также подошли жители Иерусалима и всей горной области, потому что им сообщили о том, что произошло в стане их врагов. А жители Галаада и Галилеи обошли их[b] и нанесли им тяжёлое поражение[c], пока не миновали Дамаск и его пределы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально по-гречески: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: Греческий военный глагол может означать, что они зашли дальше неприятеля, обошли его с фланга или отрезали ему путь.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «великим ударом». В контексте битвы выражение означает тяжёлое поражение или большое избиение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Сохраняет буквальный родственный образ греческого выражения и при этом звучит уместно в современном литературном библейском повествовании.
- source_word: ὁμοθυμαδόν
  choice: все как один
  rationale: Передаёт единодушное совместное действие естественным и выразительным русским оборотом.
- source_word: ἐπέπεσον ἐπʼ αὐτούς
  choice: напали на врагов
  rationale: Ясно передаёт стремительное военное нападение; местоимение раскрыто как «врагов» во избежание неясной русской референции.
- source_word: ἔκοπτον αὐτούς
  choice: поражали их
  rationale: Несовершенный вид сохраняет длительный, повторяющийся характер действия, не уточняя вид оружия.
- source_word: ἕως Χωβά
  choice: вплоть до Ховы
  rationale: Передаёт пространственный предел преследования и транслитерирует топоним по греческой форме.
- source_word: οἱ ἐξ Ἰερουσαλὴμ ... καὶ ἐκ πάσης τῆς ὀρεινῆς
  choice: жители Иерусалима и всей горной области
  rationale: Естественно обозначает людей по месту происхождения; «горная область» соответствует субстантивированному географическому выражению.
- source_word: παρεγενήθησαν
  choice: подошли
  rationale: В контексте означает прибытие людей к месту военных действий.
- source_word: τὰ γεγονότα τῇ παρεμβολῇ τῶν ἐχθρῶν αὐτῶν
  choice: то, что произошло в стане их врагов
  rationale: Сохраняет содержание греческой конструкции и военное значение παρεμβολή.
- source_word: ὑπερεκέρασαν αὐτούς
  choice: обошли их
  rationale: Сохраняет военный образ выхода дальше или сбоку от противника, не фиксируя чрезмерно узкое тактическое толкование.
- source_word: πληγῇ μεγάλῃ
  choice: нанесли им тяжёлое поражение
  rationale: Контекстуально и естественно передаёт сильный разгром в бою; буквальный образ удара отмечен в сноске.
- source_word: ἕως οὗ παρῆλθον Δαμασκὸν καὶ τὰ ὅρια αὐτῆς
  choice: преследуя их, пока не миновали Дамаск и его пределы
  rationale: Передаёт пространственное продвижение за Дамаск и прилегающую к нему территорию; деепричастие делает связь с погоней ясной по-русски.
