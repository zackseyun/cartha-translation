  text: And Judith kept bringing forth this confession in all Israel[a], and all the people echoed this praise; and Judith said[b],
translation:
  language: ru
  text: 'И Юдифь запевала это благодарение[a] среди всего Израиля, а весь народ вторил этой хвале[b]. И сказала Юдифь:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это исповедание» или «эту хвалу». Греческое слово ἐξομολόγησις в библейской речи может означать публичное признание, благодарение или хвалу.'
    reason: lexical_alternative
  - marker: b
    text: То есть отвечал ей этой хвалой; греческий глагол может подразумевать ответное, возможно антифонное пение.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆρχεν
  choice: запевала
  rationale: Форма естественно понимается как имперфект от ἐξάρχω в значении «начинать, запевать, вести песнь». «Запевала» передаёт как песенный контекст, так и незавершённый или повторяющийся характер имперфекта.
- source_word: ἐξομολόγησιν
  choice: благодарение
  rationale: В библейском греческом слово может обозначать публичное исповедание, благодарение или хвалу. В контексте вводимой песни «благодарение» звучит естественно и не создаёт ошибочного впечатления, будто речь идёт в первую очередь в признании греха.
- source_word: ἐν παντὶ Ἰσραήλ
  choice: среди всего Израиля
  rationale: Формулировка сохраняет возможный собирательный смысл «Израиля» как народа, не сводя выражение исключительно к территории.
- source_word: ὑπεφώνει
  choice: вторил
  rationale: Глагол обозначает ответное звучание или отклик; «вторил» кратко и естественно передаёт антифонный характер ответа народа.
- source_word: πᾶς ὁ λαὸς
  choice: весь народ
  rationale: Прямой и естественный эквивалент в повествовательном и богослужебно-песенном контексте.
- source_word: αἴνεσιν
  choice: хвале
  rationale: Сохраняет отличие от ἐξομολόγησις и прямо передаёт значение хвалы.
- source_word: εἶπεν
  choice: сказала
  rationale: Обычный повествовательный глагол, вводящий последующую речь или песнь.
theological_decisions:
- issue: Соотношение ἐξομολόγησις и αἴνεσις
  choice: 'Передать различными словами: «благодарение» и «хвала»'
  alternative: Передать оба слова как «хвала» либо выбрать для первого «исповедание»
  rationale: Греческий текст употребляет рядом два разных существительных. Различение сохраняет риторику оригинала; при этом «благодарение» в песенном контексте передаёт публичное признание Божьих дел без современного русского оттенка признания в грехе, который часто возникает у слова «исповедание».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным песенно-библейским оттенком. «Юдифь» выбрано как близкая к греческой форме и понятная русскому читателю передача имени; синтаксис упрощён без устранения различия между благодарением и хвалой.
