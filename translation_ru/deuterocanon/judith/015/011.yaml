  text: 'И весь народ сказал: «Да будет так».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть так и будет»; по смыслу: «Аминь».'
    reason: Поясняет пожелательное значение Γένοιτο и его функциональную близость к привычной литургической формуле, не смешивая их в основном тексте.
lexical_decisions:
- source_word: Γένοιτο
  choice: Да будет так
  rationale: 'Греческая форма пожелания от γίνομαι буквально выражает согласие-пожелание: «пусть это будет / да будет так». Такой перевод передаёт исходный греческий текст точнее, чем заимствованное «аминь», которого в данном чтении нет.'
theological_decisions:
- issue: Передача общей утвердительной реплики народа
  choice: «Да будет так»
  alternative: «Аминь»
  rationale: Выбран прямой перевод Γένοιτο, сохраняющий значение пожелания и не подменяющий греческое слово семитским литургическим выражением, хотя функционально реплика близка к «аминь».
translation_notes:
  register: Краткая, торжественная и естественная для современного литературного русского коллективная реплика. Порядок слов слегка адаптирован к русской норме; πᾶς ὁ λαός передано как «весь народ».
