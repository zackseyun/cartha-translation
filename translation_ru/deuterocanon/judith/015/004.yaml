revisions:
- from: Озия послал в Ветомасфаим, Ховаи и Холу и по всей земле Израиля вестников, чтобы сообщить о случившемся и призвать всех устремиться[a] на врагов и уничтожить их.
  to: Озия послал вестников в Ветомасфаим, Ховаи и Холу и по всей земле Израиля, чтобы сообщить о случившемся и чтобы все устремились[a] на врагов, чтобы уничтожить их.
  rationale: Исправление сохраняет все элементы исходного текста, но не превращает выраженную ἵνα цель рассылки в прямо названное действие «призыва». Переставлено дополнение «вестников» для более ясного русского синтаксиса. Сноска остаётся привязанной к «устремились» и точно поясняет буквальный образ.
