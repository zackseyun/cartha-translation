  yaml_path: translation/deuterocanon/judith/015/004.yaml
  text: And Uzziah sent men to Bethomesthaim and Choba and Chola, and to all the territory of Israel, to report what had happened, and that all should rush out against the enemies for their destruction.
translation:
  language: ru
  text: Озия послал вестников в Ветомасфаим, Ховаи и Холу и по всей земле Израиля, чтобы сообщить о случившемся и чтобы все устремились[a] на врагов, чтобы уничтожить их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «излиться на врагов» — образ массового выступления людей против неприятеля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Обычный повествовательный глагол со значением отправления людей с поручением.
- source_word: Ὀζίας
  choice: Озия
  rationale: Традиционная и естественная русская передача греческого личного имени.
- source_word: Βαιτομασθαΐμ
  choice: Ветомасфаим
  rationale: Близкая к греческой форме транслитерация топонима, для которого нет однозначно закрепившейся современной русской формы.
- source_word: Χωβὰι
  choice: Ховаи
  rationale: Форма передана непосредственно по чтению греческого текста без исправления по иным текстовым традициям.
- source_word: Χωλὰ
  choice: Холу
  rationale: Топоним «Хола» поставлен в винительный падеж после глагола движения.
- source_word: πᾶν ὅριον Ἰσραήλ
  choice: по всей земле Израиля
  rationale: В данном контексте ὅριον обозначает всю территорию, а не только пограничную черту; предлог «по» естественно выражает рассылку в разные места.
- source_word: τοὺς ἀπαγγέλλοντας
  choice: вестников, чтобы сообщить
  rationale: Субстантивированное причастие обозначает посланных людей и их задачу; «вестники» точнее, чем добавленное из контекста «люди».
- source_word: ὑπὲρ τῶν συντετελεσμένων
  choice: о случившемся
  rationale: Передаёт завершённость уже происшедших событий естественным современным русским языком.
- source_word: ἵνα πάντες ἐκχυθῶσιν
  choice: призвать всех устремиться
  rationale: Буквальный образ «излиться» здесь описывает массовое стремительное выступление; добавление «призвать» ясно выражает цель послания, заданную ἵνα.
- source_word: τοῖς πολεμίοις
  choice: на врагов
  rationale: Дательный падеж при глаголе направленного движения выражает враждебное движение против неприятеля.
- source_word: εἰς τὴν ἀναίρεσιν αὐτῶν
  choice: и уничтожить их
  rationale: В военном контексте ἀναίρεσις означает насильственное уничтожение; инфинитив естественно передаёт цель движения.
theological_decisions:
- issue: Язык насилия в военном повествовании
  choice: уничтожить их
  alternative: истребить их; предать их смерти
  rationale: Греческий текст прямо говорит об уничтожении врагов. Выбранная формулировка сохраняет суровость исходника, не смягчая её и не усиливая до более конкретного описания резни.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Синтаксис слегка перестроен ради ясности: два сообщения, выраженные греческой конструкцией цели, переданы как задачи вестников — сообщить и призвать. Неустоявшиеся топонимы транслитерированы непосредственно с греческого.'
