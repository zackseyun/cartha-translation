lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Обычный повествовательный союз, сохраняющий простую связь с предыдущим контекстом без добавления особого временного оттенка.
- source_word: ὡς
  choice: когда
  rationale: С аористом ἤκουσαν вводит временное придаточное; «когда» естественно по-русски и не усиливает значение до «как только».
- source_word: ἤκουσαν
  choice: услышали об этом
  rationale: Передаёт основное значение глагола и естественно подразумеваемое в контексте известие; добавление «об этом» не уточняет содержание сверх греческого контекста.
- source_word: οἱ ἐν τοῖς σκηνώμασιν ὄντες
  choice: находившиеся в шатрах
  rationale: Сохраняет субстантивированную причастную конструкцию и не вводит отсутствующего в греческом тексте указания на пол.
- source_word: σκηνώμασιν
  choice: шатрах
  rationale: В военном лагерном контексте это естественное современное обозначение временных жилищ; «скиниях» звучало бы архаично и могло бы вызвать культовые ассоциации.
- source_word: ἐξέστησαν
  choice: пришли в смятение
  rationale: Глагол выражает сильную потрясённость, выход из обычного состояния; контекст военной катастрофы допускает не только изумление, но и растерянность, поэтому «пришли в смятение» сохраняет эту широту.
- source_word: ἐπὶ τὸ γεγονός
  choice: от случившегося
  rationale: Естественно передаёт основание реакции и результативный оттенок перфектного причастия γεγονός — уже происшедшее событие.
