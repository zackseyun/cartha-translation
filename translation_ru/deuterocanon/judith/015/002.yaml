  yaml_path: translation/deuterocanon/judith/015/002.yaml
  text: And terror and fear fell upon them[a], and no man remained standing before his neighbor any longer; but, scattering in all directions[b], they fled along every road of the plain and of the hill country.
translation:
  language: ru
  text: И объяли их трепет и страх, и никто уже не стоял лицом к лицу со своим ближним; но, рассеявшись все разом[a], они бежали по всем дорогам равнины и горной области.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «единодушно» или «все вместе». Здесь греческое слово, вероятно, указывает на то, что они одновременно обратились в бегство, а не на согласие между ними.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν ἐπʼ αὐτοὺς
  choice: объяли их
  rationale: Передаёт внезапное наступление состояния, выраженное ἐπιπίπτω, и естественно сочетается в русском с подлежащими «трепет и страх».
- source_word: τρόμος καὶ φόβος
  choice: трепет и страх
  rationale: Сохраняет два однородных греческих существительных, не сводя их к одному понятию; «трепет» отражает τρόμος, а «страх» — широкое значение φόβος.
- source_word: οὐκ ἦν ἄνθρωπος μένων
  choice: никто уже не оставался
  rationale: Естественно передаёт отрицательную конструкцию и продолженное пребывание, выраженное причастием μένων, без неуместного гендерного ограничения в русском.
- source_word: κατὰ πρόσωπον τοῦ πλησίον
  choice: рядом со своим ближним
  rationale: 'Контекст описывает распад строя: никто больше не удерживался возле другого. «Ближний» сохраняет значение πλησίον, а «рядом» естественно передаёт пространственное отношение идиомы.'
- source_word: ἐκχυθέντες
  choice: рассеявшись
  rationale: Передаёт образ людей, словно разлившихся и разбежавшихся из строя, без излишне буквального русского «излившись».
- source_word: ὁμοθυμαδόν
  choice: все разом
  rationale: В данном контексте обозначает одновременное коллективное бегство, а не согласие в положительном смысле; сохраняет оттенок совместности и внезапности.
- source_word: ἔφευγον
  choice: они бежали
  rationale: Несовершенный вид естественно отражает греческий имперфект и изображает продолжающееся бегство.
- source_word: ἐπὶ πᾶσαν ὁδὸν
  choice: по всем дорогам
  rationale: Идиоматично выражает движение по каждому доступному пути и согласуется с множественностью направлений бегства.
- source_word: τοῦ πεδίου καὶ τῆς ὀρεινῆς
  choice: равнины и горной области
  rationale: Различает открытую равнинную местность и гористую местность; «горная область» точно и естественно передаёт субстантивированное ὀρεινή.
