lexical_decisions:
- source_word: ὁ λαὸς οὗτός
  choice: Этот народ
  rationale: λαός обозначает народ как общность, а οὗτός прямо указывает на него. «Этот народ» естественно и точно передаёт греческую именную группу.
- source_word: εἰσιν
  choice: —
  rationale: В настоящем времени русская именная связка обычно опускается; тире ясно оформляет составное именное сказуемое. Греческое множественное число согласовано с ἀπόγονοι, тогда как по-русски подлежащее «народ» грамматически единственного числа.
- source_word: ἀπόγονοι
  choice: потомки
  rationale: Слово означает людей, происходящих от предков. «Потомки» — современный и точный вариант без оттенка непосредственного потомства.
- source_word: Χαλδαίων
  choice: халдеев
  rationale: Родительный падеж множественного числа передаёт происхождение от этнической группы; традиционное русское название — «халдеи».
