  text: And they cried out to their God[a], and he struck the land of Egypt with plagues for which there was no healing; and the Egyptians drove them out from before them.
translation:
  language: ru
  text: И они воззвали к своему Богу, и Он поразил землю Египта язвами, от которых не было исцеления; и египтяне изгнали их от себя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от их лица». Это семитский оборот со значением «из их присутствия»; вероятнее всего, речь идёт о присутствии египтян, то есть «прочь от себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεβόησαν
  choice: воззвали
  rationale: Глагол обозначает громкий крик или настойчивое обращение. «Воззвали» естественно передаёт обращённую к Богу мольбу и сохраняет возвышенный, но понятный регистр.
- source_word: ἐπάταξεν
  choice: поразил
  rationale: Передаёт сильное и целенаправленное действие πατάσσω без архаизма; подразумеваемый субъект — Бог, к Которому они воззвали.
- source_word: γῆν Αἴγυπτον
  choice: землю Египта
  rationale: Сохраняет конкретное географическое значение γῆ при названии страны.
- source_word: πληγαῖς
  choice: язвами
  rationale: Слово может означать удары, поражения или бедствия; «язвами» сохраняет библейскую связь с египетскими поражениями и согласуется с последующим образом исцеления.
- source_word: ἐν αἷς οὐκ ἦν ἴασις
  choice: от которых не было исцеления
  rationale: Сохраняет образ исцеления, выраженный существительным ἴασις, и естественно связывает относительное предложение с язвами.
- source_word: ἐξέβαλον
  choice: изгнали
  rationale: Точно и современно передаёт значение насильственного удаления или высылки.
- source_word: ἀπὸ προσώπου αὐτῶν
  choice: от себя
  rationale: Естественно передаёт семитизированное греческое выражение «от их лица», то есть из присутствия египтян, не загромождая основной текст буквальной калькой.
theological_decisions:
- issue: К кому относится αὐτῶν в выражении ἀπὸ προσώπου αὐτῶν
  choice: 'Местоимение относится к египтянам: они изгнали израильтян от себя.'
  alternative: Вне контекста грамматически возможно соотнести местоимение с израильтянами.
  rationale: Ближайший субъект — «египтяне», а семитский оборот обычно обозначает удаление кого-либо из присутствия действующего лица. Необычная буквальная форма оборота отмечена в сноске.
- issue: Подразумеваемый субъект ἐπάταξεν
  choice: Бог поразил землю Египта.
  alternative: Формально в греческом предложении подлежащее при глаголе не повторено.
  rationale: Естественным субъектом является непосредственно предшествующее «их Бог»; русское местоимение «Он» делает синтаксическую связь ясной, не добавляя нового действующего лица.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Воззвали» и «язвами» сохраняют достоинство и межтекстовую связь с исходом из Египта, оставаясь понятными современному читателю.
