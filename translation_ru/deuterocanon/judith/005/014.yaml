    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν
  choice: вывел
  rationale: Аорист ἄγω означает «вести, приводить». В контексте исхода и последующего пути «вывел» естественно передаёт направляющее действие Бога и связь с выходом народа.
- source_word: εἰς ὁδὸν τοῦ Σεινὰ καὶ Καδής Βαρνή
  choice: на путь к Синаю и Кадес-Варни
  rationale: Сочетание εἰς ὁδὸν передаёт вступление на путь, а родительный τοῦ Σεινὰ может обозначать путь, связанный с Синаем или ведущий к нему. Русское «на путь к» естественно и сохраняет маршрутный смысл; неоднозначность пояснена в сноске.
- source_word: Καδής Βαρνή
  choice: Кадес-Варни
  rationale: Употреблена традиционная русская библейская форма географического названия.
- source_word: ἐξέβαλον
  choice: изгнали
  rationale: ἐκβάλλω обозначает насильственное удаление или вытеснение. «Изгнали» точно и естественно звучит в территориальном контексте.
- source_word: πάντας τοὺς κατοικοῦντας
  choice: всех, кто жил
  rationale: Так сохраняются и всеохватное значение πάντας, и глагольный характер причастия κατοικοῦντας, без тяжеловесной буквальности.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: ἔρημος здесь обозначает пустынную, малонаселённую местность; «пустыня» — понятное и укоренённое в русской библейской речи соответствие.
theological_decisions:
- issue: Смена подлежащего между ἤγαγεν и ἐξέβαλον
  choice: «Он вывел… они изгнали»
  alternative: Сгладить смену подлежащего и приписать оба действия одному деятелю
  rationale: 'Греческий текст явно переходит от единственного числа к множественному: Бог ведёт народ, а народ изгоняет жителей. Эта смысловая и богословская грань сохранена.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Он» написано с прописной буквы, поскольку в непосредственном контексте обозначает Бога. Пунктуация и конечная запятая отражают незавершённость предложения в данном стихе.
