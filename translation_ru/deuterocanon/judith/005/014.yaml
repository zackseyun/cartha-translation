  text: И Он повёл их на путь к Синаю и Кадес-Варни[a]; и они изгнали всех, кто жил в пустыне[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по пути через Синай и Кадес-Варни». Греческое выражение буквально означает «путь Синая и Кадес-Варни» и может указывать на путь, связанный с этими местами или ведущий к ним.'
