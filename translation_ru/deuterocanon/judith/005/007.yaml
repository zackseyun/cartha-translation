base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/007.yaml
  text: And formerly they lived as sojourners in Mesopotamia[a], because they were not willing to follow the gods of their fathers[b], who were in the land of the Chaldeans.
translation:
  language: ru
  text: И прежде они жили как чужеземцы в Месопотамии[a], потому что не пожелали следовать богам своих отцов, которые находились в земле халдеев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жили в Месопотамии как временные поселенцы». Греческий глагол указывает на проживание не на своей земле, в положении чужеземцев.'
    reason: lexical_alternative
  - marker: b
    text: 'Относительное местоимение «которые» грамматически может относиться как к богам, так и к отцам. Греческий глагол может также передавать оттенок: «которые оказались в земле халдеев»; в контексте естественно и значение «находились».'
    reason: alternative_reading
lexical_decisions:
- source_word: παρῴκησαν
  choice: жили как чужеземцы
  rationale: Передаёт и проживание, и положение чужаков; это естественнее для современного русского языка, чем архаичное «жили как пришельцы».
- source_word: τὸ πρότερον
  choice: прежде
  rationale: Кратко и естественно обозначает более раннее время относительно повествования.
- source_word: ἐν τῇ Μεσοποταμίᾳ
  choice: в Месопотамии
  rationale: Употреблено общепринятое русское географическое название.
- source_word: οὐκ ἐβουλήθησαν
  choice: не пожелали
  rationale: Сохраняет выраженный в βούλομαι волевой оттенок, не усиливая его до открытого бунта или категорического отказа.
- source_word: ἀκολουθῆσαι
  choice: следовать
  rationale: Точно передаёт образ следования как религиозной приверженности, не подменяя исходный глагол словом «поклоняться».
- source_word: τοῖς θεοῖς τῶν πατέρων αὐτῶν
  choice: богам своих отцов
  rationale: Сохраняет конкретное указание на отцов и наследуемую от них религию, не обобщая выражение до «предков».
- source_word: οἳ ἐγένοντο ἐν γῇ Χαλδαίων
  choice: которые появились в земле халдеев
  rationale: «Появились» сохраняет динамический оттенок ἐγένοντο лучше, чем простое «были», а относительное местоимение позволяет не скрывать грамматическую неоднозначность его отнесения.
theological_decisions:
- issue: Описание отказа от религии отцов
  choice: не пожелали следовать богам своих отцов
  alternative: отказались поклоняться богам своих предков
  rationale: Греческий текст говорит о нежелании «следовать», а не употребляет глагол поклонения; перевод не усиливает полемический смысл.
- issue: К чему относится οἳ в заключительной относительной части
  choice: 'сохранена формальная неоднозначность: «которые появились в земле халдеев»'
  alternative: «богам своих отцов, возникшим в земле халдеев»
  rationale: Форма οἳ может грамматически относиться и к «богам», и к «отцам», поскольку оба существительных мужского рода во множественном числе. Контекст может склонять к богам, но текст не требует молча устранять неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Избегнуты как архаичное «пришельцы», так и более разговорное «не захотели». Все примечания отмечены в основном тексте.
