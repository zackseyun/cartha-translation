base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/011.yaml
  text: And the king of Egypt rose up against them[a], and they dealt shrewdly with them in toil and brickmaking; they humbled them and made them servants.
translation:
  language: ru
  text: И восстал против них царь Египта, и с ними поступили коварно[a], обременив их тяжёлым трудом и изготовлением кирпичей; их унизили и сделали рабами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с ними поступили хитро»; возможно также: «их перехитрили». Греческий глагол подчёркивает расчётливое, коварное обращение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπανέστη
  choice: восстал против
  rationale: Передаёт враждебное выступление или противодействие, выраженное приставочным глаголом, а не простое появление нового царя.
- source_word: κατεσοφίσαντο
  choice: поступили коварно
  rationale: Сохраняет значение расчётливого, хитрого обращения, направленного против людей, не сводя глагол только к угнетению.
- source_word: ἐν πόνῳ καὶ πλίνθῳ
  choice: изнуряя тяжёлым трудом и изготовлением кирпичей
  rationale: πόνος обозначает тяжкий, изнурительный труд, а πλίνθος — кирпич; в данном контексте естественный русский требует назвать работу по изготовлению кирпичей. Деепричастная конструкция показывает способ коварного обращения.
- source_word: ἐταπείνωσαν
  choice: унизили
  rationale: Сохраняет основное значение «унижать, низводить», тогда как конкретное порабощение выражено следующей фразой.
- source_word: δούλους
  choice: рабами
  rationale: Контекст принудительного труда и национального порабощения делает зависимый статус центральным; «слугами» было бы чрезмерно мягко.
theological_decisions:
- issue: Передача δοῦλος в рассказе о египетском порабощении
  choice: рабами
  alternative: слугами
  rationale: Речь идёт о насильственном подчинении и принудительном труде, поэтому «рабами» точно передаёт исторический и богословский контекст, не смягчая его.
- issue: Смена грамматического числа после упоминания царя
  choice: 'сохранён неопределённо-личный множественный субъект: «поступили… унизили… сделали»'
  alternative: назвать египтян или сделать царя субъектом всех действий
  rationale: В греческом после единственного ὁ βασιλεὺς следуют глаголы во множественном числе. Русская неопределённо-личная конструкция сохраняет эту особенность и не добавляет явно не названного субъекта.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной речи. Синтаксис сохраняет последовательность греческого текста, а неопределённо-личные формы передают переход от царя в единственном числе к действиям неназванного множественного субъекта.
