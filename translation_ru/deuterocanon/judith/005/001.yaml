base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/001.yaml
  text: And it was reported to Holofernes[a], the commander-in-chief of the forces of Assyria, that the sons of Israel had prepared for war, and had blocked the roads of the hill country and fortified every summit of every high mountain[b], and had set up obstacles in the plains.
translation:
  language: ru
  text: И донесли Олоферну, главнокомандующему ассирийскими войсками, что сыны Израиля[a] приготовились к войне, перекрыли дороги в горной местности, укрепили каждую вершину высокой горы и расставили на равнинах препятствия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть израильтяне, народ Израиля. Греч. буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «ловушки» или «заграждения»; греческое слово обозначает то, что заставляет споткнуться или становится помехой, но точный вид препятствий здесь не указан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνηγγέλη
  choice: донесли
  rationale: Аорист пассивного залога передаёт сообщение, дошедшее до Олоферна, без указания вестника; русская неопределённо-личная конструкция естественна.
- source_word: ἀρχιστρατήγῳ
  choice: главнокомандующему
  rationale: Сложное воинское звание обозначает верховного командующего, а не просто военачальника.
- source_word: δυνάμεως Ἀσσούρ
  choice: ассирийскими войсками
  rationale: В военном контексте δύναμις означает вооружённые силы; конструкция естественно передана управлением при «главнокомандующем».
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Сохраняет форму традиционного этнического наименования в греческом тексте, не ограничивая его значение только мужчинами.
- source_word: παρεσκευάσθησαν εἰς πόλεμον
  choice: приготовились к войне
  rationale: Точно передаёт достигнутую военную готовность и естественно звучит по-русски.
- source_word: τὰς ὁδοὺς τῆς ὀρεινῆς συνέκλεισαν
  choice: перекрыли дороги в горной местности
  rationale: ὀρεινή обозначает горную область, а συνέκλεισαν в данном оборонительном контексте — перекрытие путей.
- source_word: ἐτείχισαν πᾶσαν κορυφὴν ὄρους ὑψηλοῦ
  choice: укрепили каждую вершину высокой горы
  rationale: Сохраняет формально единственное число и распределительное значение πᾶσαν, не добавляя второго «каждую», отсутствующего в греческом.
- source_word: ἔθηκαν ἐν τοῖς πεδίοις σκάνδαλα
  choice: расставили на равнинах препятствия
  rationale: σκάνδαλα здесь обозначает физические помехи военного характера; нейтральное «препятствия» не уточняет их неясный вид.
theological_decisions:
- issue: Этническое обозначение οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  alternative: израильтяне / дети Израиля
  rationale: Фраза является устойчивым обозначением народа. Буквальная форма сохраняет образ исходного текста, а сноска предотвращает ошибочное понимание как обозначения исключительно мужчин.
- issue: Военное значение σκάνδαλα
  choice: препятствия
  alternative: ловушки / заграждения
  rationale: Контекст описывает оборонительные приготовления. Общее физическое значение сохраняет лексическую неопределённость и не привносит позднейшего богословского смысла «соблазнов».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён до естественной русской последовательности однородных действий; военная терминология ясна неспециалисту. Архаизирующая форма «сыны» сохранена только в устойчивом этническом наименовании и пояснена сноской.
