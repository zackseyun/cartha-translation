base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/019.yaml
  text: And now[a], having turned back to their God, they came up from the dispersion where they had been scattered there, took possession of Jerusalem, where their sanctuary was, and settled in the hill country[b], because it had been deserted.
translation:
  language: ru
  text: А теперь[a], обратившись вновь к своему Богу, они поднялись из рассеяния, где были рассеяны, овладели Иерусалимом, где находилось их святилище, и поселились в горной области, потому что она была необитаема[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте выражение о месте рассеяния имеет усилительный или избыточный оборот, буквально: «из рассеяния, где они были рассеяны там».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что она была опустошена»; греческое слово может также означать «пустынна» или «безлюдна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστρέψαντες ἐπὶ τὸν θεὸν αὐτῶν
  choice: обратившись вновь к своему Богу
  rationale: Передаёт возвращение к верности своему Богу и сохраняет образ перемены направления, не превращая выражение в специальный термин «обращение в веру».
- source_word: ἀνέβησαν
  choice: поднялись
  rationale: Сохраняет буквальное значение восхождения, уместное в библейской географии.
- source_word: ἐκ τῆς διασπορᾶς οὗ διεσπάρησαν ἐκεῖ
  choice: из рассеяния, где были рассеяны
  rationale: Сохраняет существительное διασπορά и повтор корня, но опускает избыточное для естественного русского отдельное «там»; эта особенность отмечена в сноске.
- source_word: κατέσχον
  choice: овладели
  rationale: Передаёт установление владения и контроля над Иерусалимом, не уточняя сверх текста, было ли это военным занятием.
- source_word: τὸ ἁγίασμα
  choice: святилище
  rationale: Естественно передаёт святыню или освящённое место, не сужая значение до конкретной части храмового комплекса.
- source_word: κατῳκίσθησαν
  choice: поселились
  rationale: Идиоматично передаёт установление постоянного проживания; пассивная греческая форма допускает такое непереходное понимание.
- source_word: ἐν τῇ ὀρεινῇ
  choice: в горной области
  rationale: Передаёт устойчивое географическое обозначение нагорья или гористой местности.
- source_word: ὅτι ἦν ἔρημος
  choice: потому что она была необитаема
  rationale: В контексте заселения ἔρημος естественно означает отсутствие жителей; возможное значение «опустошена» сохранено в сноске.
theological_decisions:
- issue: Характер возвращения к Богу в выражении ἐπιστρέψαντες ἐπὶ τὸν θεὸν αὐτῶν
  choice: обратившись вновь к своему Богу
  alternative: вернувшись к своему Богу
  rationale: Речь идёт о восстановлении верности собственному Богу Израиля, а не о принятии нового божества. Формулировка сохраняет оттенок покаяния и возвращения, не вводя более поздней конфессиональной терминологии.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис сохраняет последовательность греческого текста, но устранена неестественная для русского буквальная плеонастичность; она вынесена в сноску. Местоимение «она» соотносится с «горной областью».
