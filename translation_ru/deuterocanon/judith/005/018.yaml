base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/018.yaml
  text: But when they turned away from the path that he had appointed for them[a], they were utterly destroyed in many wars, to a very great extent[b], and they were taken captive into a land not their own, and the temple of their God was laid level with the ground, and their cities were seized by their adversaries.
translation:
  language: ru
  text: Но когда они уклонились от пути, который Он предназначил им[a], они были жестоко истреблены во многих войнах[b], уведены в плен в чужую землю, храм их Бога был сравнён с землёй, а их города были захвачены противниками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от образа жизни, который Он установил для них». Греческое слово может обозначать как дорогу, так и, как здесь, предписанный Богом образ жизни.'
    reason: lexical_alternative
  - marker: b
    text: Греческое выражение особо подчёркивает крайнюю тяжесть и масштаб их гибели.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστησαν ἀπὸ τῆς ὁδοῦ
  choice: уклонились от пути
  rationale: Передаёт отступление от предписанного образа жизни, не сужая значение до формального вероотступничества.
- source_word: ἧς διέθετο αὐτοῖς
  choice: который Он предназначил им
  rationale: Сохраняет мысль о пути, установленном для них Богом; прописная буква проясняет подразумеваемого деятеля из контекста.
- source_word: ἐξωλεθρεύθησαν ... ἐπὶ πολὺ σφόδρα
  choice: подверглись чрезвычайно великому разорению
  rationale: Интенсивный глагол вместе с усилительной фразой указывает на крайне тяжёлое опустошение; «разорение» не создаёт ложного впечатления, будто народ был истреблён полностью, поскольку далее говорится о пленении.
- source_word: ἐν πολλοῖς πολέμοις
  choice: во многих войнах
  rationale: Прямо сохраняет множественное число и широкое значение πολέμοις.
- source_word: ᾐχμαλωτεύθησαν εἰς γῆν οὐκ ἰδίαν
  choice: были уведены в плен в чужую землю
  rationale: Передаёт принудительный плен и естественно выражает значение земли, им не принадлежавшей.
- source_word: ὁ ναὸς τοῦ θεοῦ αὐτῶν ἐγενήθη εἰς ἔδαφος
  choice: храм их Бога был сравнён с землёй
  rationale: Естественная русская идиома передаёт разрушение храма до основания.
- source_word: αἱ πόλεις αὐτῶν ἐκρατήθησαν ὑπὸ τῶν ὑπεναντίων
  choice: их города захватили противники
  rationale: Активная русская конструкция естественно передаёт греческий пассив и прямо называет указанного в тексте деятеля.
theological_decisions:
- issue: Божественное участие в суде
  choice: Бедствия связаны с уклонением народа от предназначенного Богом пути, но Бог не назван прямым деятелем разрушения, пленения и захвата.
  alternative: Можно было бы истолковательно представить Бога непосредственным деятелем всех бедствий.
  rationale: Греческий текст устанавливает причинно-богословскую связь, однако пассивные формы не требуют добавлять Бога как грамматического деятеля каждого бедствия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным, при этом сохранены последовательность бедствий, усиление ἐπὶ πολὺ σφόδρα и неопределённость относительно непосредственного деятеля суда.
