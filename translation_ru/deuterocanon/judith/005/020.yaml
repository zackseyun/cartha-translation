  text: And now[a], master lord, if indeed there is an offense in this people and they are sinning against their God, and if we ascertain that this stumbling block is among them, then we will go up and make war against them;
translation:
  language: ru
  text: И теперь, господин и повелитель, если в этом народе действительно есть проступок[a] и они грешат против своего Бога, и мы удостоверимся, что у них есть этот камень преткновения, то поднимемся и пойдём на них войной;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ошибка»; возможно также: «невольный грех». Греческое ἀγνόημα может указывать на проступок, совершённый по неведению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα κύριε
  choice: господин повелитель
  rationale: Два существительных сохраняют усиленное обращение к Олоферну и не создают впечатления, будто речь идёт о божественном титуле. Такая форма торжественна, но понятна по-русски.
- source_word: ἀγνόημα
  choice: проступок
  rationale: Слово обозначает ошибочное или виновное деяние, иногда совершённое по неведению. «Проступок» передаёт виновность, не утверждая однозначно, был ли грех намеренным.
- source_word: ἁμαρτάνουσιν εἰς τὸν θεὸν αὐτῶν
  choice: они грешат против своего Бога
  rationale: Настоящее время передаёт продолжающееся действие, а сочетание с εἰς указывает на того, против кого направлен грех.
- source_word: ἐπισκεψόμεθα
  choice: мы удостоверимся
  rationale: Будущая форма ἐπισκέπτομαι здесь означает исследовать положение и установить факт; «удостоверимся» естественно передаёт это в условном рассуждении.
- source_word: σκάνδαλον
  choice: камень преткновения
  rationale: Устойчивое русское выражение сохраняет образ препятствия, ведущего к падению, а не сводит его к отвлечённому «нарушению».
- source_word: ἀναβησόμεθα
  choice: поднимемся
  rationale: Сохраняется буквальный пространственный образ, который одновременно может обозначать военное выступление.
- source_word: ἐκπολεμήσομεν
  choice: пойдём на них войной
  rationale: Передаёт организованное военное действие, выраженное усиленным глаголом, и звучит естественно в современном русском повествовании.
theological_decisions:
- issue: Передача двойного обращения δέσποτα κύριε
  choice: господин повелитель
  alternative: владыка; господин; верховный господин
  rationale: Адресат — Олоферн, а не Бог Израиля. Поэтому перевод сохраняет два элемента почтительного обращения, но избегает формы «Господь», которая могла бы ошибочно восприниматься как имя или божественный титул.
- issue: Связь проступка народа с возможностью военного поражения
  choice: сохранена условная логика без богословского пояснения
  alternative: пояснить камень преткновения как причину Божьего оставления и поражения
  rationale: Греческий текст связывает грех против Бога с наличием σκάνδαλον, но не раскрывает механизм прямо. Перевод сохраняет эту напряжённость и не добавляет толкование.
translation_notes:
  register: Современный литературный русский с торжественной военной речью. Сохранены длинная условная конструкция, повтор союза «и» и завершающая точка с запятой, поскольку стих продолжается далее. Маркер сноски поставлен непосредственно после слова, к которому относится примечание.
