  yaml_path: translation/deuterocanon/judith/005/015.yaml
  text: And they lived in the land of the Amorites[a], and by their strength they destroyed all the Heshbonites; and after crossing the Jordan[b], they took possession of all the hill country.
translation:
  language: ru
  text: И поселились они в земле аморреев, и своей силой[a] истребили всех есевонитян; а перейдя Иордан, овладели всей горной областью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «в своей силе» или «благодаря своей мощи».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально возможно: «унаследовали всю горную область». Греческий глагол может означать получение наследственного владения, но здесь речь идёт об овладении землёй после перехода через Иордан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾤκησαν
  choice: поселились
  rationale: Аорист οἰκέω в данном повествовательном контексте обозначает обоснование и проживание на земле; «поселились» естественно передаёт начало пребывания.
- source_word: γῇ Ἀμορραίων
  choice: в земле аморреев
  rationale: Прямо передаёт родительную конструкцию со значением территории, принадлежавшей аморреям.
- source_word: ἐξωλόθρευσαν
  choice: истребили
  rationale: Глагол выражает полное уничтожение; «истребили» сохраняет его силу, а πάντας подчёркивает всеобщность действия.
- source_word: πάντας τοὺς Ἐσεβωνείτας
  choice: всех есевонитян
  rationale: Греческое этническое наименование обозначает жителей Есевона; форма «есевонитяне» соответствует принятой русской библейской передаче.
- source_word: ἐν τῇ ἰσχύι αὐτῶν
  choice: своей силой
  rationale: Предложная конструкция здесь естественно понимается как указание на средство или мощь, посредством которой совершено действие.
- source_word: διαβάντες τὸν Ἰορδάνην
  choice: перейдя Иордан
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу, и кратко сохраняется русским деепричастием.
- source_word: ἐκληρονόμησαν
  choice: овладели
  rationale: κληρονομέω может означать наследование или получение во владение; в повествовании о территории после перехода через Иордан «овладели» ясно передаёт контекст, не устраняя буквальный оттенок, отмеченный в сноске.
- source_word: πᾶσαν τὴν ὀρεινήν
  choice: всей горной областью
  rationale: Субстантивированное ὀρεινή обозначает гористую местность или нагорье; «горная область» понятно современному читателю и сохраняет географический смысл.
