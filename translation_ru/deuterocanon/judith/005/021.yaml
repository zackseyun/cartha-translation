base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/021.yaml
  text: But if there is no lawlessness in their nation[a], let my lord pass by, lest perhaps their Lord and their God defend them, and we become a reproach before all the earth.
translation:
  language: ru
  text: Но если в их народе нет беззакония, пусть тогда мой господин пройдёт мимо[a], как бы их Господь и их Бог не вступился за них и мы не стали посмешищем перед всей землёй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «пусть господин пройдёт мимо». Притяжательного местоимения нет; по контексту это, вероятнее всего, почтительное обращение к Олоферну, а не упоминание Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνομία
  choice: беззаконие
  rationale: Слово обозначает нарушение закона и нравственную порочность; «беззаконие» сохраняет одновременно правовой и нравственный оттенок.
- source_word: ἔθνος
  choice: народ
  rationale: Здесь имеется в виду Израиль как единая этническая и общественная общность; по-русски «народ» звучит естественнее и не привносит современного политико-государственного смысла слова «нация».
- source_word: παρελθέτω δὴ
  choice: пусть тогда … пройдёт мимо
  rationale: Императив передаёт требование пройти мимо или миновать; частица δὴ в контексте выражена словом «тогда».
- source_word: μή ποτε
  choice: как бы … не
  rationale: Эта русская конструкция естественно передаёт предостережение о возможном нежелательном исходе и сохраняет оттенок вероятности.
- source_word: ὑπερασπίσῃ
  choice: не вступился
  rationale: Глагол означает выступить в защиту кого-либо; «вступиться за» ясно передаёт личную и военную защиту в данном контексте.
- source_word: ὀνειδισμός
  choice: посмешище
  rationale: Существительное указывает на публичное поношение и положение объекта насмешек; «стать посмешищем» естественно выражает этот смысл по-русски.
- source_word: πάσης τῆς γῆς
  choice: перед всей землёй
  rationale: Сохранён широкий риторический охват греческого выражения, не суженный до отдельной страны или территории.
- source_word: κύριος
  choice: господин / Господь
  rationale: Первое употребление по контексту является почтительным обращением к Олоферну и передано как «мой господин»; второе, соединённое с «их Бог», относится к Богу Израиля и передано как «Господь».
theological_decisions:
- issue: Различение двух употреблений κύριος в одном предложении
  choice: Первое передано как «мой господин» применительно к Олоферну, второе — как «их Господь» применительно к Богу.
  alternative: Передать оба употребления одинаково словом «господин/Господь», оставив референцию первого формально неоднозначной.
  rationale: Само греческое выражение при первом употреблении не содержит притяжательного местоимения, однако непосредственный контекст речи к Олоферну убедительно указывает на почтительное обращение. Второе употребление однозначно относится к Богу, поскольку стоит в сочетании «их Господь и их Бог». Примечание сохраняет сведения о буквальной форме первого выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Различие между человеческим титулом и божественным именованием отмечено строчной и прописной буквами; синтаксис предостережения сделан естественным для русского языка.
