  yaml_path: translation/deuterocanon/judith/005/009.yaml
  text: And their God told them to go out from their sojourning and to go into the land of Canaan[a]; and they settled there[b], and became very wealthy in gold and silver and in very many livestock.
translation:
  language: ru
  text: Их Бог велел им покинуть место, где они жили как пришельцы,[a] и пойти в землю Ханаан. Там они поселились и стали чрезвычайно богаты золотом, серебром и очень многочисленным скотом.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из их пребывания в качестве пришельцев». Греческое слово обозначает проживание в чужой земле в положении пришельцев.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «и чрезвычайно умножились золотом, серебром и весьма многочисленным скотом». Греческая конструкция подчёркивает значительный рост имущества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν ... ἐξελθεῖν ... πορευθῆναι
  choice: велел им выйти ... и отправиться
  rationale: Конструкция с εἶπεν и зависимыми инфинитивами передаёт направляющую речь. «Велел» естественно выражает её директивный характер, не усиливая его до формального приказа.
- source_word: παροικίας
  choice: земли, где они жили как чужеземцы
  rationale: παροικία обозначает проживание вне родной земли, в положении пришельцев или чужеземцев. Развёрнутый перевод яснее для современного читателя, чем книжное «странствование».
- source_word: γῆν Χανάαν
  choice: землю Ханаанскую
  rationale: Передаёт как γῆν, так и традиционное русское библейское наименование Ханаана, сохраняя возвышенный, но понятный регистр.
- source_word: κατῴκησαν
  choice: поселились
  rationale: Глагол означает обосноваться или жить в определённом месте; «поселились» естественно передаёт начало постоянного проживания.
- source_word: ἐπληθύνθησαν χρυσίῳ καὶ ἀργυρίῳ καὶ ἐν κτήνεσιν
  choice: чрезвычайно умножили своё золото, серебро и многочисленный скот
  rationale: Буквальная конструкция указывает на большое увеличение имущества. Активная русская формулировка сохраняет образ умножения и звучит естественнее, чем «умножились золотом».
- source_word: κτήνεσιν πολλοῖς σφόδρα
  choice: многочисленный скот
  rationale: κτήνη — общее обозначение домашнего скота, без сужения до крупного рогатого; σφόδρα усиливает указание на количество и в переводе соотнесено со всем перечнем посредством «чрезвычайно».
theological_decisions:
- issue: Характер речи Бога в εἶπεν с инфинитивами
  choice: Бог велел им выйти и отправиться в Ханаан
  alternative: Бог сказал им выйти; Бог повелел им выйти
  rationale: «Велел» передаёт директивную силу конструкции, но не вводит более торжественную и сильную формулу «повелел», которой в греческом тексте прямо нет.
- issue: Смысл ἐπληθύνθησαν применительно к имуществу
  choice: имущество чрезвычайно умножилось по количеству
  alternative: они стали очень богаты
  rationale: Перевод сохраняет конкретный образ увеличения золота, серебра и скота, не сводя его к более общему понятию богатства.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён ради ясности, но сохранены мотив чужеземного проживания и буквальный образ умножения имущества.
