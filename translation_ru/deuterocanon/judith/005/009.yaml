revisions:
- from: Их Бог велел им выйти из земли, где они жили как чужеземцы,[a] и отправиться в землю Ханаанскую. Они поселились там и чрезвычайно умножили своё золото, серебро и многочисленный скот.[b]
  to: Их Бог велел им покинуть место, где они жили как пришельцы,[a] и пойти в землю Ханаан. Там они поселились и стали чрезвычайно богаты золотом, серебром и очень многочисленным скотом.[b]
  rationale: «Покинуть место, где они жили как пришельцы» передаёт παροικία без добавления слова «земля». «Стали чрезвычайно богаты...» естественно по-русски выражает пассивный результат ἐπληθύνθησαν применительно к золоту, серебру и скоту, не приписывая им активного умножения имущества. Сохранены оба якоря сноски и их соответствие тексту.
