lexical_decisions:
- source_word: ὠργίσθη
  choice: разгневался
  rationale: Аорист ὀργίζω выражает наступление состояния гнева; совершенный вид естественно передаёт это по-русски.
- source_word: θυμῷ σφόδρα
  choice: сильно
  rationale: Сочетание дательного θυμῷ с σφόδρα усиливает выражение гнева; «сильно разгневался» звучит естественно и сохраняет эмфатическую силу.
- source_word: ἐκάλεσεν
  choice: созвал
  rationale: В контексте властителя, собирающего должностных лиц, «созвал» передаёт властный и коллективный характер призыва.
- source_word: ἄρχοντας
  choice: правителей
  rationale: Слово обозначает лиц, обладающих властью; «правители» — ясный современный эквивалент в политическом контексте.
- source_word: στρατηγοὺς
  choice: военачальников
  rationale: Передаёт военное руководство, не навязывая более узкое современное звание «генерал».
- source_word: σατράπας
  choice: сатрапов
  rationale: Исторический термин сохраняет политико-административный колорит исходного текста точнее, чем общее «наместники».
- source_word: τῆς παραλίας
  choice: приморья
  rationale: παραλία обозначает прибрежную область; «приморье» кратко и естественно передаёт географический смысл.
- source_word: Μωὰβ
  choice: Моава
  rationale: Традиционная русская форма библейского географического имени в требуемом падеже.
- source_word: Ἀμμὼν
  choice: Аммона
  rationale: Традиционная русская форма библейского имени в сочетании «военачальники Аммона».
