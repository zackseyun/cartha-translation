  yaml_path: translation/deuterocanon/judith/005/016.yaml
  text: And they drove out from before them the Canaanite[a], the Perizzite, the Jebusite, the Shechemite, and all the Girgashites, and they lived in it for many days.
translation:
  language: ru
  text: И они изгнали от себя ханаанеев, ферезеев, иевусеев, сихемлян[a] и всех гергесеев и жили в ней много дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте буквально: «Сихем»; здесь это слово может обозначать Сихем или жителей Сихема.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέβαλον
  choice: изгнали
  rationale: Глагол обозначает насильственное удаление; «изгнали» естественно и точно передаёт его силу в контексте завоевания.
- source_word: ἐκ προσώπου αὐτῶν
  choice: от себя
  rationale: Семитизированное выражение буквально означает удаление «от их лица», то есть из их присутствия; по-русски это естественно передаётся словами «от себя».
- source_word: τὸν Χαναναῖον καὶ τὸν Φερεζαῖον καὶ τὸν Ἰεβουσαῖον
  choice: ханаанеев, ферезеев, иевусеев
  rationale: Греческие формы единственного числа имеют собирательное значение и называют народы; русское множественное число ясно и естественно передаёт этот смысл.
- source_word: τὸν Συχέμ
  choice: сихемлян[a]
  rationale: Форма Συχέμ необычна среди названий народов и буквально совпадает с именем Сихем. По положению в перечне она, вероятно, обозначает жителей Сихема; сноска сохраняет формальную неоднозначность.
- source_word: πάντας τοὺς Γεργεσαίους
  choice: всех гергесеев
  rationale: Прямое соответствие греческому множественному числу с πάντας «всех».
- source_word: κατῴκησαν
  choice: жили
  rationale: Глагол означает проживать или обитать; «жили» — современная и точная передача продолжительного пребывания.
- source_word: ἐν αὐτῇ
  choice: в ней
  rationale: Женское местоимение отсылает к земле, упомянутой в контексте; сохранение местоимения не добавляет отсутствующего в стихе существительного.
- source_word: ἡμέρας πολλάς
  choice: много дней
  rationale: Аккузатив продолжительности буквально и понятно передаётся выражением «много дней», без замены на более толковательное «долгое время».
theological_decisions:
- issue: Передача изгнания прежних жителей без смягчения
  choice: «изгнали … и жили в ней много дней»
  alternative: «вытеснили … и поселились там надолго»
  rationale: Перевод прямо сохраняет утверждение об изгнании прежних жителей и последующем проживании израильтян, не смягчая рассказ и не добавляя богословской оценки.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Названия народов переданы привычными русскими формами множественного числа; необычное Συχέμ разъяснено в сноске.
