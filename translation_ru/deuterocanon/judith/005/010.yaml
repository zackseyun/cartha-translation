  yaml_path: translation/deuterocanon/judith/005/010.yaml
  text: And they went down into Egypt[a], for a famine covered the face of the land of Canaan, and they lived there as sojourners until they were sustained; and there they became a very great multitude, and there was no number to their family line.
translation:
  language: ru
  text: И они спустились в Египет, потому что голод покрыл всю землю Ханаанскую. Там они жили как чужеземцы, пока не были обеспечены пищей; там они стали весьма многочисленны, и роду их не было числа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их племени» или «их народу»; греческое γένος может означать род, племя или народ, происходящий от общего предка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβησαν
  choice: спустились
  rationale: Сохраняет обычное для библейского повествования направление движения «вниз» в Египет и естественно звучит по-русски.
- source_word: ἐκάλυψεν ... τὸ πρόσωπον τῆς γῆς Χανααν
  choice: покрыл всю землю Ханаанскую
  rationale: Глагол передан прямо, а идиома «лицо земли» естественно раскрыта как охват всей земли, без утраты образа распространяющегося голода.
- source_word: παρῴκησαν
  choice: жили как переселенцы
  rationale: Передаёт проживание в чужой стране без утверждения о постоянном поселении; современнее и понятнее, чем «пришельствовали».
- source_word: μέχρις οὗ διετράφησαν
  choice: пока не получили пропитание
  rationale: Отражает пассивное значение обеспечения пищей и звучит естественно в данном повествовательном контексте.
- source_word: ἐγένοντο ... εἰς πλῆθος πολύ
  choice: стали весьма многочисленны
  rationale: Естественно передаёт результативность оборота и количественное усиление.
- source_word: οὐκ ἦν ἀριθμὸς τοῦ γένους αὐτῶν
  choice: роду их не было числа
  rationale: Сохраняет формальную библейскую идиому неисчислимости и широкое родственно-генеалогическое значение γένος.
theological_decisions:
- issue: Значение родственно-этнического термина γένος
  choice: роду их
  alternative: их народу / их племени
  rationale: «Род» сохраняет связь с общим происхождением, не вводя современного биологического понятия расы и не сужая значение до непосредственного потомства.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис упрощён до естественного русского повествования; подлинная широта значения γένος отмечена в сноске.
