  source_fidelity: '«Переселенцы» не вполне точно передаёт παρῴκησαν: это слово обозначает проживание в качестве чужеземцев/пришельцев, не обязательно переселение как таковое. Остальные основные соответствия сохранены: «спустились», «голод покрыл», количественный рост и неисчислимость рода переданы адекватно. «Всю землю» — допустимое раскрытие идиомы «лицо земли», хотя образ несколько ослаблен.'
  naturalness: Текст в целом понятен и литературен. «Жили там как чужеземцы» естественно для современного русского и точнее, чем «как переселенцы». «Были обеспечены пищей» передаёт пассивную семантику διετράφησαν без неестественного оборота «получили пропитание».
  terminology: «Роду их не было числа» удачно сохраняет генеалогически-коллективную широту γένος и умеренно библейский регистр. Сноска уместно отмечает вариант «народу»; добавление «племени» точнее отражает возможный диапазон, не навязывая современную этническую категорию.
