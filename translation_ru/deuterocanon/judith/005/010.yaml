    rationale: «Переселенцы» называет людей, сменивших место жительства, тогда как греческий глагол акцентирует статус проживания среди другого народа как чужеземцев. Следует передать именно этот оттенок.
  - severity: low
    issue: «Пока не получили пропитание» для μέχρις οὗ διετράφησαν
    rationale: Оборот допускает понимание единичного получения пищи и менее явно выражает пассивное «были вскормлены/обеспечены». Более точен и естественен вариант «пока не были обеспечены пищей».
