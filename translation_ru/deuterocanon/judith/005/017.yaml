lexical_decisions:
- source_word: καὶ ἕως
  choice: И пока
  rationale: Передаёт продолжающееся условие естественным современным русским языком; буквальное «и до тех пор, пока» здесь было бы тяжелее.
- source_word: οὐχ ἥμαρτον
  choice: они не грешили
  rationale: Несовершенный вид в русском языке естественно выражает длительную ситуацию внутри оборота с «пока», не добавляя мысли о единственном проступке.
- source_word: ἐνώπιον τοῦ θεοῦ αὐτῶν
  choice: перед своим Богом
  rationale: «Перед» сохраняет пространственно-оценочный оттенок ἐνώπιον, а возвратное «своим» естественно соотносит Бога с подлежащим.
- source_word: ἦν μετʼ αὐτῶν τὰ ἀγαθά
  choice: блага были с ними
  rationale: Сохраняет образную конструкцию греческого текста и множественное τὰ ἀγαθά, не сужая смысл до материального процветания.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно обозначает основание названного благополучия.
- source_word: θεὸς μισῶν ἀδικίαν
  choice: Бог, ненавидящий несправедливость
  rationale: Русский язык не выражает отсутствие артикля неопределённым артиклем; причастный оборот сохраняет характеристику Бога. «Несправедливость» передаёт морально-правовой оттенок ἀδικία.
- source_word: μετʼ αὐτῶν ἐστίν
  choice: с ними Бог
  rationale: Настоящее время сохраняется в именной русской конструкции с нулевой связкой, отражая переход греческого текста от прошедшего ἦν к настоящему ἐστίν.
theological_decisions:
- issue: Переход от прошедшего ἦν к настоящему ἐστίν
  choice: 'Сохранить: «блага были с ними… с ними Бог»'
  alternative: 'Согласовать в прошедшем времени: «Бог… был с ними»'
  rationale: Смена времени в греческом тексте может подчёркивать неизменную характеристику Бога и Его присутствие; её не следует молча сглаживать.
- issue: Значение ἀδικία
  choice: несправедливость
  alternative: неправда; беззаконие; неправедность
  rationale: Выбор сохраняет широкий морально-правовой смысл и не вводит более узкий конфессионально или богословски нагруженный термин.
- issue: Неопределённость θεός без артикля
  choice: Бог
  alternative: некий бог; Бог как Тот, Кто
  rationale: В русском языке категория артикля отсутствует, а контекст говорит об их Боге; форма «некий бог» ошибочно внесла бы неопределённость или политеистический оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Оборот «блага были с ними» намеренно сохраняет образность и широту оригинала; порядок слов в заключительной части позволяет без искусственной связки передать настоящее время греческого текста.
