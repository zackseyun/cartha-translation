base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/003.yaml
  text: And he said to them, “Tell me, then, sons of Canaan, who is this people that dwells in the hill country, and which cities they inhabit, and the size of their military force, and in what their power and their strength consist, and who has risen over them as king, leading their army.”
translation:
  language: ru
  text: 'И он сказал им: «Расскажите же мне, сыны Ханаана[a], что это за народ, живущий в горной области[b], какие города он населяет, как велика его военная сила[c], в чём заключаются его мощь и крепость и кто стал над ним царём, возглавляющим его войско».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хананеи». Буквально по-гречески: «сыны Ханаана».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обитающий в гористой местности». Буквально: «сидящий в горной области»; здесь это выражение означает постоянное проживание.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «какова численность его войска» или «насколько велики его вооружённые силы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναγγείλατέ δή μοι
  choice: Расскажите же мне
  rationale: Повелительная форма требует сообщить сведения; частица δή передана через «же», выражающее настойчивость и связность речи без оттенка вежливой просьбы.
- source_word: υἱοὶ Χαναάν
  choice: сыны Ханаана
  rationale: Сохранено буквальное обращение «сыновья/сыны Ханаана», а не заменено этнонимом. «Сыны» уместно в возвышенном повествовательном регистре и понятно современному читателю.
- source_word: ὁ λαὸς οὗτος ὁ καθήμενος ἐν τῇ ὀρεινῇ
  choice: что это за народ, живущий в горной области
  rationale: Оборот «что это за народ» естественно передаёт вопрос о народе; καθήμενος здесь идиоматически означает постоянное проживание, а ὀρεινή — горную местность или область.
- source_word: τίνες αἱ κατοικοῦσιν πόλεις
  choice: какие города он населяет
  rationale: Греческий оборот спрашивает, в каких городах живёт этот народ. Единственное число «он» согласуется с собирательным существительным «народ».
- source_word: τὸ πλῆθος τῆς δυνάμεως αὐτῶν
  choice: как велика его военная сила
  rationale: В контексте военной разведки δύναμις означает вооружённую силу, а πλῆθος — её численность или величину. Формулировка сохраняет некоторую широту выражения.
- source_word: ἐν τίνι τὸ κράτος αὐτῶν καὶ ἡ ἰσχὺς αὐτῶν
  choice: в чём заключаются его мощь и крепость
  rationale: Сохранены два близких, но не тождественных обозначения силы. «В чём заключаются» естественно передаёт ἐν τίνι, то есть основание или источник силы.
- source_word: ἀνέστηκεν ἐπʼ αὐτῶν βασιλεὺς
  choice: кто стал над ним царём
  rationale: Передано буквальное пространственно-властное значение «встал/стал над ними» без уточнения способа воцарения, которого греческий текст не сообщает.
- source_word: ἡγούμενος στρατιᾶς αὐτῶν
  choice: возглавляющим его войско
  rationale: Причастный оборот характеризует царя как предводителя войска; «войско» естественно передаёт στρατιά в данном контексте.
