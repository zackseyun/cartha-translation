base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/024.yaml
  text: Therefore we will indeed go up[a], and they will become food for all your army, master Holofernes.
translation:
  language: ru
  text: Поэтому мы непременно поднимемся, и они станут пищей[a] для всего твоего войска, повелитель Олоферн.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добычей»; буквально по-гречески: «тем, что будет пожрано».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ δὴ
  choice: Поэтому ... непременно
  rationale: διό вводит вывод («поэтому»), а δή подчёркивает уверенность говорящего; «непременно» естественно передаёт усилительный оттенок в русском контексте.
- source_word: ἀναβησόμεθα
  choice: мы ... поднимемся
  rationale: Будущее среднего залога от ἀναβαίνω означает «подняться, пойти вверх»; перевод сохраняет пространственный смысл греческого глагола, не исключая военного выступления.
- source_word: ἔσονται εἰς κατάβρωμα
  choice: они станут пищей
  rationale: Конструкция εἰμί с εἰς и винительным имеет результативный смысл, а κατάβρωμα обозначает то, что поедают или пожирают. Образ «станут пищей» краток и близок к греческому.
- source_word: πάσης τῆς στρατειᾶς σου
  choice: для всего твоего войска
  rationale: πάσης охватывает войско целиком, а στρατειά обозначает войско или военную силу.
- source_word: δέσποτα
  choice: повелитель
  rationale: Форма обращения δέσποτα выражает власть и господство. «Повелитель» сохраняет иерархический оттенок и отличает это слово от обычной передачи κύριος как «Господь» или «господин».
- source_word: Ὀλοφέρνη
  choice: Олоферн
  rationale: Имя передано в закрепившейся русской библейской форме.
theological_decisions:
- issue: Передача δέσποτα при обращении к Олоферну
  choice: повелитель
  alternative: господин; владыка
  rationale: Здесь употреблено не κύριος, а δέσποτα — обращение с сильным оттенком власти. «Повелитель» не придаёт обращению к военачальнику ненужного богословского звучания и при этом сохраняет силу титула.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Сохранены выводное усиление, образ пожирания и прямое обращение; имя дано в традиционной русской форме.
