lexical_decisions:
- source_word: βοηθησόμεθα ἀπὸ υἱῶν Ἰσραήλ
  choice: сыны Израиля не помогут нам
  rationale: Будущая пассивная форма естественно передана по-русски активной конструкцией без изменения участников действия; «сыны Израиля» сохраняет библейскую форму обозначения народа.
- source_word: ἰδού
  choice: посмотрите
  rationale: Передаёт призыв обратить внимание в современной литературной речи, не прибегая к архаичному «вот» в значении междометия.
- source_word: δύναμις οὐδὲ κράτος
  choice: ни силы, ни мощи
  rationale: 'Сохраняется парное усиление: δύναμις обозначает силу или способность, κράτος — действенную мощь, превосходство.'
- source_word: εἰς παράταξιν ἰσχυράν
  choice: чтобы выстроиться в сильный боевой строй
  rationale: παράταξις здесь имеет военное значение построения для битвы; предложная конструкция выражает пригодность или способность к такому построению.
