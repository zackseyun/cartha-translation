base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/008.yaml
  text: They departed from the way of their fathers and worshiped the God of heaven[a], the God whom they had come to know. And they were driven out from before their gods, and fled to Mesopotamia[b], and lived there as foreigners for many days.
translation:
  language: ru
  text: Они оставили путь своих предков и поклонились Богу неба — Богу, которого познали.[a] За это их изгнали от лица их богов,[b] и они бежали в Месопотамию, где много дней жили как чужеземцы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которого признали». Греческий глагол может обозначать как обретение знания, так и решительное признание.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая фраза синтаксически сжата: буквально — «их изгнали от лица их богов». Кто именно изгнал их, здесь прямо не назван; изгнание связано с оставленным ими почитанием прежних богов.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξέβησαν ἐξ ὁδοῦ τῶν γονέων αὐτῶν
  choice: оставили путь своих предков
  rationale: Сохраняет образ пути и ясно передаёт отказ от унаследованного религиозного уклада; «предки» в современном русском естественнее родительного «отцов» в данном контексте.
- source_word: προσεκύνησαν
  choice: поклонились
  rationale: В контексте Бога обозначает религиозное поклонение и одновременно сохраняет конкретный оттенок греческого глагола.
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: Богу неба
  rationale: Прямая и узнаваемая передача библейского титула без превращения его в прилагательное «небесному».
- source_word: θεῷ ᾧ ἐπέγνωσαν
  choice: Богу, которого познали
  rationale: «Познали» допускает как приобретение знания, так и решительное признание; завершённый вид соответствует аористу.
- source_word: ἐξέβαλον αὐτοὺς ἀπὸ προσώπου τῶν θεῶν αὐτῶν
  choice: их изгнали от лица их богов
  rationale: Русская неопределённо-личная конструкция передаёт активное множественное ἐξέβαλον, не назначая явно не названного деятеля. «От лица» сохраняет необычный греческий образ, а примечание отмечает синтаксическую сжатость.
- source_word: ἔφυγον εἰς Μεσοποταμίαν
  choice: они бежали в Месопотамию
  rationale: Передаёт вынужденное бегство после изгнания и явно обозначает субъект в естественном русском синтаксисе.
- source_word: παρῴκησαν ἐκεῖ ἡμέρας πολλάς
  choice: где много дней жили как чужеземцы
  rationale: Сохраняет социальный оттенок παροικέω — проживание не на своей земле — и буквальное временное выражение.
theological_decisions:
- issue: Переход от веры предков к поклонению Богу неба
  choice: Оставили путь своих предков и поклонились Богу неба
  alternative: Отказались от религии своих предков и обратились к истинному Богу
  rationale: Выбранная формулировка сохраняет собственные образы текста и не добавляет отсутствующих в нём понятий «религии», «обращения» или прямой квалификации «истинный».
- issue: Значение ἐπέγνωσαν
  choice: которого познали
  alternative: которого признали
  rationale: Основной текст не ограничивает смысл только интеллектуальным узнаванием или только исповедальным признанием; примечание сохраняет оба возможных оттенка.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Образы «путь», «Бог неба» и «от лица» сохранены там, где они несут смысл оригинала; синтаксис сделан понятным без устранения подлинной неоднозначности греческого текста.
