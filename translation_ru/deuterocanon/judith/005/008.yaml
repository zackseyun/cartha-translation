review_pass:
  verdict: revise
  source_fidelity: 'Нужна правка. В греческом стоит активная форма ἐξέβαλον («они изгнали»), а не пассивное/неопределённо-личное «их изгнали». Субъект и объект в этой сжатой фразе остаются неясными; перевод не должен устранять активную форму или добавлять причинную связь «За это», которой в оригинале нет. Остальные основные соответствия точны: «оставили путь», «Бог неба», «познали», «бежали», «жили как чужеземцы».'
  naturalness: Текст в целом литературен. «Они изгнали их от лица своих богов» намеренно сохраняет трудную, несколько шероховатую синтаксическую форму греческого текста; поясняющее примечание необходимо. «Там ... много дней» естественнее и ближе к ἐκεῖ ἡμέρας πολλάς, чем придаточное с «где».
  terminology: «Бог неба» — удачная библейская передача. «Поклонились» приемлемо для προσεκύνησαν в культовом контексте. «Познали» корректно оставляет открытым оттенок ἐπέγνωσαν; вариант «признали» следует сохранить в примечании.
