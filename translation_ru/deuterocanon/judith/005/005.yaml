base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/005/005.yaml
  text: And Achior[a], the leader of all the sons of Ammon, said to him, “Let my lord now hear a word from the mouth of your servant, and I will tell you the truth about the people who dwell in this hill country near you[b], and no falsehood will come from the mouth of your servant.”
translation:
  language: ru
  text: 'И сказал ему Ахиор, предводитель всех сынов Аммона[a]: «Пусть мой господин выслушает слово из уст твоего слуги, и я сообщу тебе правду о народе, который живёт в этой горной стране рядом с тобой, и никакая ложь не выйдет из уст твоего слуги».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех аммонитян». Буквально по-гречески: «всех сынов Аммона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀχιὼρ
  choice: Ахиор
  rationale: Имя передано традиционной русской транслитерацией.
- source_word: ὁ ἡγούμενος
  choice: предводитель
  rationale: Слово обозначает руководителя или правителя; «предводитель» естественно звучит в данном военно-политическом контексте, не приписывая Ахиору более конкретной должности.
- source_word: πάντων υἱῶν Ἀμμών
  choice: всех сынов Аммона
  rationale: Сохранён буквальный филиальный этноним и колорит исходного текста; идиоматический смысл «всех аммонитян» указан в сноске.
- source_word: Ἀκουσάτω δὴ λόγον
  choice: пусть … выслушает слово
  rationale: Третье лицо повелительного наклонения передаёт почтительную просьбу; «выслушает» естественно выражает просьбу принять речь слуги.
- source_word: ὁ κύριός μου
  choice: мой господин
  rationale: В обращении к человеку κύριος является почтительным титулом вышестоящего лица, а не обозначением Бога.
- source_word: ἐκ στόματος τοῦ δούλου σου
  choice: из уст своего слуги
  rationale: Сохранён образ речи, исходящей из уст; δοῦλος здесь входит в придворную формулу самоуничижения, поэтому «слуга» уместнее социально более определённого «раб».
- source_word: ἀναγγελῶ σοι τὴν ἀλήθειαν
  choice: я сообщу тебе правду
  rationale: Передаёт значение торжественного правдивого сообщения без ненужной архаизации.
- source_word: ὃς κατοικεῖ τὴν ὀρεινὴν ταύτην πλησίον σοῦ οἰκούντος
  choice: который живёт в этой горной стране близ тебя
  rationale: Греческая конструкция говорит о народе, населяющем горную область и живущем поблизости; по-русски смысл естественно передан одной цельной формулировкой без тяжёлого повтора «населяет… живя».
- source_word: οὐκ ἐξελεύσεται ψεῦδος
  choice: никакая ложь не выйдет
  rationale: Сохранены метафора исходящей из уст речи и категорическое заверение в правдивости.
theological_decisions:
- issue: Значение κύριος при обращении к человеку
  choice: мой господин
  alternative: мой повелитель
  rationale: Контекст однозначно указывает на человеческого начальника. Выбран почтительный придворный титул без богословской капитализации.
- issue: Передача δοῦλος в почтительной формуле самоназвания
  choice: твой слуга
  alternative: твой раб
  rationale: Здесь слово выполняет функцию учтивого самоуничижения перед начальником; текст не подчёркивает юридический статус рабства, поэтому «слуга» точнее передаёт прагматику реплики.
translation_notes:
  register: Современный литературный русский с умеренно торжественным придворным оттенком. Синтаксис прямой речи сохранён протяжённым, как в греческом тексте, но географическая конструкция сглажена ради естественности. Формы «господин», «слуга» и «из уст» поддерживают достоинство речи без избыточной архаики.
