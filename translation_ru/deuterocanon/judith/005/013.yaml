  text: И Бог осушил перед ними Красное море.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых переводах, следующих еврейской традиции исхода, — «Тростниковое море». В греческом тексте здесь: «Красное море».'
    reason: alternative_reading
lexical_decisions:
- source_word: κατεξήρανεν
  choice: осушил
  rationale: Глагол означает, что Бог сделал море сухим; «осушил» естественно и кратко передаёт каузативный смысл и подразумеваемую возможность пройти по сухому месту.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Прямое соответствие греческому подлежащему; в русском языке в данном употреблении артикль отдельно не передаётся.
- source_word: τὴν ἐρυθρὰν θάλασσαν
  choice: Красное море
  rationale: Греческий текст прямо называет Ἐρυθρὰ θάλασσα — Красное море. Вариант «Тростниковое море», связанный с еврейской традицией Исхода, отмечен в сноске, но не подменяет чтение данного греческого источника.
- source_word: ἔμπροσθεν αὐτῶν
  choice: перед ними
  rationale: Естественно передаёт пространственное значение выражения и сохраняет порядок смысловых компонентов исходного текста.
theological_decisions:
- issue: Название моря в аллюзии на исход
  choice: Красное море
  alternative: Тростниковое море
  rationale: Поскольку перевод выполняется непосредственно с греческого текста, основное чтение следует ἐρυθρὰν θάλασσαν. Еврейская исходная традиция допускает передачу «Тростниковое море», поэтому этот вариант сохранён в сноске для прозрачности.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и торжественно-нейтральная. Союз «И» сохранён как часть повествовательной связи стиха.
