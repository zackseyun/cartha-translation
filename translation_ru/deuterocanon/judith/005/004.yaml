lexical_decisions:
- source_word: διὰ τί
  choice: почему
  rationale: Естественно передаёт прямой вопрос о причине последующего действия.
- source_word: κατενωτίσαντο
  choice: отказались
  rationale: В сочетании с τοῦ μὴ ἐλθεῖν глагол, этимологически связанный со слушанием, означает, что они не вняли требованию и не пришли; «отказались» ясно передаёт смысл в современном русском.
- source_word: τοῦ μὴ ἐλθεῖν
  choice: выйти
  rationale: Артикулярный инфинитив с μή раскрывает содержание отказа — не прийти. В контексте встречи с приближающимся военачальником русское «выйти навстречу» естественно выражает ситуацию, не меняя направления действия.
- source_word: εἰς ἀπάντησίν μοι
  choice: мне навстречу
  rationale: Оборот означает выход или приход для встречи с говорящим; «выйти мне навстречу» — естественное русское соответствие.
- source_word: παρὰ πάντας
  choice: в отличие от всех
  rationale: παρά с винительным здесь выражает сопоставительный контраст между их поведением и поведением остальных.
- source_word: τοὺς κατοικοῦντας ἐν δυσμαῖς
  choice: всех живущих на западе
  rationale: Сохраняет географическое значение причастного оборота и звучит естественно в современном литературном русском.
