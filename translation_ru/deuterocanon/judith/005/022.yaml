  text: And it happened[a], when Achior had stopped speaking these words, that all the people around the tent and standing about began to grumble, and the nobles of Holofernes and all who lived by the seacoast and in Moab said to strike him down.
translation:
  language: ru
  text: Когда Ахиор закончил говорить эти слова, весь народ, окружавший шатёр и стоявший вокруг, стал роптать. Вельможи Олоферна и все жители побережья и Моава сказали, что его следует сразить[a].
  philosophy: optimal-equivalence
  footnotes:
