    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: Когда
  rationale: Обычный греческий повествовательный переход; в современном русском его естественно передаёт придаточное времени без тяжеловесного «И случилось, когда».
- source_word: ἐπαύσατο ... λαλῶν τοὺς λόγους τούτους
  choice: закончил говорить эти слова
  rationale: Передаёт прекращение речи и сохраняет указательное τούτους; по-русски звучит естественнее буквального «перестал говорить».
- source_word: ἐγόγγυσεν
  choice: стал роптать
  rationale: Глагол обозначает недовольное ворчание или ропот; конструкция со «стал» уместно передаёт начало реакции толпы.
- source_word: πᾶς ὁ λαὸς
  choice: весь народ
  rationale: Сохраняет собирательное значение и полноту πᾶς, не вводя лишней этнической конкретизации.
- source_word: ὁ κυκλῶν τὴν σκηνὴν καὶ περιστὼς
  choice: окружавший шатёр и стоявший вокруг
  rationale: Сохраняет оба греческих причастных описания положения собравшихся, несмотря на намеренную близость их значений.
- source_word: οἱ μεγιστᾶνες Ὀλοφέρνου
  choice: вельможи Олоферна
  rationale: «Вельможи» естественно и достойно передаёт высокопоставленных приближённых или знатных людей.
- source_word: οἱ κατοικοῦντες τὴν παραλίαν καὶ τὴν Μωὰβ
  choice: все жители побережья и Моава
  rationale: Передаёт обе географические области и общий артикль с причастием; «жители» позволяет избежать громоздкого повтора.
- source_word: συγκόψαι αὐτόν
  choice: расправиться с ним
  rationale: Контекстуально передаёт требование насильственно погубить Ахиора, сохраняя некоторую неопределённость точного способа действия в συγκόψαι.
