base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/013.yaml
  text: And they came to Holofernes’s tent[a], and said to the one over all his affairs, “Wake our lord at once, because the servants have dared to come down against us for battle, so that they may be utterly destroyed.”
translation:
  language: ru
  text: 'И они пришли к шатру Олоферна и сказали тому, кто ведал всем, что принадлежало ему[a]: «Немедленно разбуди нашего господина, потому что эти рабы осмелились спуститься на нас с войной, чтобы их окончательно уничтожили».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тому, кто был поставлен над всем, что ему принадлежало», то есть главному управляющему или приближённому Олоферна.'
    reason: Греческая фраза имеет несколько тяжеловесную форму и описывает функцию этого человека, не называя точной должности.
lexical_decisions:
- source_word: παρεγένοντο
  choice: пришли
  rationale: Передаёт прибытие к шатру естественным для русского повествования глаголом.
- source_word: σκηνή
  choice: шатёр
  rationale: В военном контексте речь о шатре военачальника; слово не вызывает культовых ассоциаций.
- source_word: τῷ οὔτι ἐπὶ πάντων τῶν αὐτοῦ
  choice: тому, кто заведовал всем его имуществом
  rationale: Передаёт функцию человека, поставленного над всем принадлежавшим Олоферну, не вводя отсутствующего в греческом тексте официального титула.
- source_word: Ἔγειρον δὴ
  choice: Немедленно разбуди
  rationale: Императив и частица δὴ выражают настоятельное, срочное требование.
- source_word: κύριον
  choice: господина
  rationale: Здесь κύριος обозначает человеческого начальника, а не божественный титул.
- source_word: δοῦλοι
  choice: рабы
  rationale: Сохраняет уничижительную силу обозначения врагов как людей подчинённого, несвободного положения.
- source_word: καταβαίνειν ἐφʼ ἡμᾶς
  choice: спуститься против нас
  rationale: Сохраняет пространственный образ движения вниз и враждебную направленность.
- source_word: εἰς πόλεμον
  choice: на битву
  rationale: Естественно передаёт цель военного движения.
- source_word: ἵνα ἐξολοθρευθῶσιν εἰς τέλος
  choice: чтобы быть истреблёнными до конца
  rationale: Сохраняет как пассивную конструкцию, так и усиление полноты уничтожения выражением εἰς τέλος.
theological_decisions:
- issue: Передача δοῦλοι как уничижительного обозначения противника
  choice: рабы
  alternative: слуги
  rationale: В устах ассирийцев это презрительное обозначение тех, кого они считают низшими и подвластными; «рабы» лучше сохраняет резкость греческого слова, не смягчая её до «слуг».
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Шатёр» соответствует военной обстановке; обращение «наш господин» ясно относится к Олоферну. Синтаксис сохраняет намеренно жестокую причинно-целевую логику речи воинов.
