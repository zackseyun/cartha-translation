  text: And they called Achior out of the house of Ozias. But when he came and saw the head of Holofernes in the hand of one man in the assembly of the people[a], he fell on his face, and his spirit failed.
translation:
  language: ru
  text: И позвали Ахиора из дома Озии. Когда же он пришёл и увидел голову Олоферна в руке одного человека в собрании народа, то пал ниц, и дух его иссяк[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дыхание покинуло его»; возможно также: «он лишился чувств». Буквально по-гречески: «дух его иссяк» — выражение, которое может описывать физическое изнеможение или обморок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάλεσαν
  choice: позвали
  rationale: Нейтрально и естественно передаёт повествовательный аорист; «призвали» или «вызвали» звучало бы сильнее, чем требует контекст.
- source_word: τὸν Ἀχιὼρ
  choice: Ахиора
  rationale: Традиционная русская передача личного имени с необходимым падежным окончанием.
- source_word: ἐκ τοῦ οἴκου Ὀζεία
  choice: из дома Озии
  rationale: Сохраняет наиболее непосредственный здесь физический смысл οἶκος и естественно звучит по-русски.
- source_word: ὡς δὲ ἦλθεν
  choice: Когда же он пришёл
  rationale: «Когда» передаёт временное отношение ὡς, а частица «же» отмечает переход δέ без излишне сильного противопоставления.
- source_word: ἴδεν τὴν κεφαλὴν Ὀλοφέρνου
  choice: увидел голову Олоферна
  rationale: Прямой перевод греческой конструкции с традиционной русской формой имени.
- source_word: ἐν χειρὶ ἀνδρὸς ἑνὸς
  choice: в руке одного из мужчин
  rationale: Сохраняет явное значение ἑνός («одного») и позволяет естественно понять мужчину как одного из присутствовавших, не делая его определённым персонажем.
- source_word: ἐν τῇ ἐκκλησίᾳ τοῦ λαοῦ
  choice: среди собрания народа
  rationale: В дохристианском контексте ἐκκλησία означает собравшийся народ, а не «церковь»; «среди» естественно описывает положение человека в собрании.
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: пал ниц
  rationale: Устойчивое, краткое и достойное русское соответствие телесному падению лицом вниз.
- source_word: ἐξελύθη τὸ πνεῦμα αὐτοῦ
  choice: дух оставил его
  rationale: Сохраняет образность и неоднозначность πνεῦμα, не сводя выражение однозначно к обмороку или прекращению дыхания.
theological_decisions:
- issue: Значение πνεῦμα в описании телесного потрясения
  choice: дух оставил его
  alternative: он лишился чувств / дыхание покинуло его
  rationale: Греческая фраза допускает понимание как физического обморока или крайнего изнеможения, но буквальный образ не определяет точный физиологический результат. Основной текст сохраняет эту напряжённость, а примечание поясняет вероятный смысл.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским тоном. «Пал ниц» сохраняет достоинство и выразительность повествования; синтаксис остаётся ясным для современного читателя. Термин ἐκκλησία не передан как «церковь», поскольку здесь речь идёт о народном собрании.
