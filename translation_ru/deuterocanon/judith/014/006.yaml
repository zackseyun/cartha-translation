- from: И позвали Ахиора из дома Озии. Когда же он пришёл и увидел голову Олоферна в руке одного из мужчин среди собрания народа, то пал ниц, и дух оставил его.[a]
  to: И позвали Ахиора из дома Озии. Когда же он пришёл и увидел голову Олоферна в руке одного человека в собрании народа, то пал ниц, и дух его иссяк[a].
