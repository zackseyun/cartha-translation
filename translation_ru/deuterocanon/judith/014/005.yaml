base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/005.yaml
  text: But before you do these things[a], call Achior the Ammonite to me[c][b], so that he may see and recognize the one who has treated the house of Israel with contempt and has sent him to us as if to death.
translation:
  language: ru
  text: Но прежде чем вы сделаете всё это, позовите ко мне аммонитянина Ахиора, чтобы он увидел и узнал[a] того, кто выказал презрение к дому Израиля и отослал его[b] к нам словно на смерть[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы он увидел и вполне распознал». В греческом тексте последовательно употреблены два глагола — «увидеть» и «узнать (распознать)», — что усиливает мысль.'
    reason: lexical_alternative
  - marker: b
    text: 'Местоимение «его», вероятнее всего, относится к Ахиору: презревший дом Израиля отослал Ахиора к израильтянам, словно обрекая его на смерть.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «как бы на смерть», «будто на верную смерть». Греческое выражение буквально означает «словно на смерть» и может подразумевать, что Ахиора отдали им как уже обречённого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ δὲ τοῦ ποιῆσαι ταῦτα
  choice: Но прежде чем вы сделаете всё это
  rationale: Конструкция πρό с артиклевым инфинитивом обозначает предшествование во времени; δέ передано мягким переходным «но». Множественное ταῦτα естественно передаётся как «всё это».
- source_word: καλέσατέ μοι
  choice: позовите ко мне
  rationale: Императив множественного числа сохранён; дательный μοι передан оборотом «ко мне».
- source_word: Ἀχιὼρ τὸν Ἀμμανείτην
  choice: аммонитянина Ахиора
  rationale: Имя транслитерировано в традиционной русской форме, этноним передан обычным русским соответствием.
- source_word: ἵνα ἴδῃ ἐπιγνοῖ
  choice: чтобы он увидел и узнал
  rationale: Два последовательных конъюнктива выражают цель и смысловое нарастание от видения к узнаванию; оба глагола сохранены.
- source_word: τὸν ἐκφαυλίσαντα
  choice: того, кто выказал презрение
  rationale: ἐκφαυλίζω означает считать ничтожным, презирать или уничижать; выбран естественный современный оборот без ослабления смысла.
- source_word: τὸν οἶκον τοῦ Ἰσραήλ
  choice: дом Израиля
  rationale: Сохранено устойчивое библейское обозначение народа Израиля.
- source_word: καὶ αὐτὸν
  choice: и отослал его
  rationale: Местоимение сохранено, чтобы не устранять формальную неоднозначность греческого текста; по контексту оно, вероятнее всего, относится к Ахиору.
- source_word: ὡς εἰς θάνατον
  choice: словно на смерть
  rationale: «Словно» отражает квалифицирующее ὡς, а «на смерть» сохраняет направительное εἰς θάνατον, не превращая сравнение в прямое утверждение.
- source_word: ἀποστείλαντα εἰς ἡμᾶς
  choice: отослал ... к нам
  rationale: Причастие относится к тому же лицу, что и предыдущее; «отослал» передаёт совершённое отправление Ахиора к израильтянам.
