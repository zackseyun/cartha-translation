base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/007.yaml
  text: And when they had taken him up[a], he fell at Judith’s feet and bowed before her, and he said, “Blessed are you in every dwelling of Judah and among every nation[b]; those who hear your name will be thrown into confusion.”
translation:
  language: ru
  text: 'Когда его подняли[a], он пал к ногам Иудифи, поклонился ей и сказал: «Благословенна ты в каждом жилище Иуды[b] и среди всех народов; услышавшие твоё имя придут в смятение[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда его приняли»; в данном контексте греческое слово, вероятнее всего, означает, что его подняли или помогли ему встать.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в каждом шатре Иуды». Греческое слово может означать как шатёр, так и жилище вообще.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «будут встревожены», «будут потрясены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέλαβον αὐτόν
  choice: его подняли
  rationale: 'В контексте ἀναλαμβάνω естественно передаёт физическое действие: его подняли или помогли ему встать. Краткая русская формулировка не уточняет сверх текста, кто именно и каким образом это сделал.'
- source_word: προσέπεσεν τοῖς ποσὶν Ἰουδεὶθ
  choice: пал к ногам Иудифи
  rationale: Сохраняет телесный образ и оттенок почтения или мольбы, звуча при этом естественно и достойно по-русски.
- source_word: προσεκύνησεν τῷ προσώπῳ αὐτῆς
  choice: поклонился ей
  rationale: В обращённом к человеку действии προσκυνέω обозначает поклон или выражение почтения. Формулировка не превращает его в религиозное поклонение и не добавляет отсутствующего в тексте указания «лицом до земли».
- source_word: Εὐλογημένη σὺ
  choice: Благословенна ты
  rationale: Сохраняет прямую форму традиционного благословения и возвышенный библейский регистр.
- source_word: ἐν παντὶ σκηνώματι Ἰούδα
  choice: в каждом жилище Иуды
  rationale: σκηνώμα допускает значения «шатёр» и более общее «жилище». Основной текст использует понятное широкое значение, а конкретный образ шатра сохраняется в примечании.
- source_word: ἐν παντὶ ἔθνει
  choice: среди всех народов
  rationale: Естественная русская передача смысла распространения славы Иудифи за пределы Иуды; множественное «всех народов» идиоматично выражает обобщающее греческое единственное число с πᾶς.
- source_word: ταραχθήσονται
  choice: придут в смятение
  rationale: Передаёт вызванное извне сильное внутреннее потрясение, не сужая значение только до страха или ужаса.
theological_decisions:
- issue: Значение προσκυνέω в действии, обращённом к Иудифи
  choice: поклонился ей
  alternative: поклонился перед ней; простёрся перед ней; поклонился ей как божеству
  rationale: Контекст описывает выражение почтения человеку. «Поклонился ей» сохраняет диапазон жеста, но не приписывает ему без основания значение богопоклонения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет последовательность греческого повествования, но не перегружен буквальными оборотами. Имена и географическое обозначение переданы в традиционной русской форме.
