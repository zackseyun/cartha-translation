base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/002.yaml
  text: And it shall be[a], when dawn breaks and the sun rises upon the earth, each of you shall take up your weapons of war, and every mighty man shall go out beyond the city. You shall appoint a leader over them, as though going down to the plain against the advance guard of the sons of Asshur[b]; but you shall not go down.
translation:
  language: ru
  text: 'И будет так: когда забрезжит рассвет и солнце взойдёт над землёй, каждый из вас возьмёт своё боевое оружие, и каждый сильный мужчина выйдет за город. Вы поставите над ними предводителя, словно спускаясь на равнину, к передовому отряду[a] сынов Ассура[b], но не спускайтесь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к передовому посту ассирийцев». Греческое προφυλακή может означать передовой отряд, аванпост, передовой пост или стражу.'
    reason: lexical_alternative
  - marker: b
    text: «Сыны Ассура» — буквальная передача греческого выражения, обозначающего ассирийцев.
    reason: cultural_note
lexical_decisions:
- source_word: διαφαύσῃ ὁ ὄρθρος
  choice: забрезжит рассвет
  rationale: Естественное русское выражение для появления первого утреннего света, сохраняющее образ греческого текста.
- source_word: ἐξέλθῃ ὁ ἥλιος ἐπὶ τὴν γῆν
  choice: солнце взойдёт над землёй
  rationale: Передаёт движение восходящего солнца и образ его появления над землёй без неестественной буквальности.
- source_word: ἀναλήμψεσθε ἕκαστος τὰ σκεύη τὰ πολεμικὰ ὑμῶν
  choice: каждый из вас возьмёт своё боевое оружие
  rationale: В военном контексте σκεύη обозначает снаряжение или оружие; единственное собирательное «оружие» звучит по-русски естественно.
- source_word: πᾶς ἀνὴρ ἰσχύων
  choice: каждый сильный мужчина
  rationale: Сохраняет явно мужское обозначение ἀνήρ и значение силы или военной дееспособности.
- source_word: δώσετε ἀρχηγὸν εἰς αὐτούς
  choice: вы назначите им предводителя
  rationale: Передаёт контекстуальный смысл поставления руководителя над вышедшими мужчинами.
- source_word: ὡς καταβαίνοντες ἐπὶ τὸ πεδίον
  choice: сделаете вид, будто спускаетесь на равнину
  rationale: ὡς здесь указывает на видимость или притворное намерение; явное «сделаете вид» делает тактический смысл понятным.
- source_word: εἰς τὴν προφυλακὴν υἱῶν Ἀσσούρ
  choice: к передовому отряду сынов Ассура
  rationale: προφυλακή допускает значения передового отряда, аванпоста или передовой стражи; основной текст выбирает военный «передовой отряд», а примечание сохраняет альтернативу.
- source_word: οὐ καταβήσεσθε
  choice: но не спускайтесь
  rationale: Будущее время имеет предписывающую силу; русский императив ясно передаёт запрет в наставлении.
theological_decisions:
- issue: Гендерно маркированное военное обозначение πᾶς ἀνὴρ ἰσχύων
  choice: каждый сильный мужчина
  alternative: каждый способный сражаться; каждый воин
  rationale: Греческое ἀνήρ прямо обозначает мужчину, поэтому перевод не заменяет его гендерно нейтральным выражением.
- issue: Этнонимное выражение υἱῶν Ἀσσούρ
  choice: сынов Ассура
  alternative: ассирийцев
  rationale: Буквальная семитизированная форма сохраняет образ исходного текста, а примечание разъясняет этническое значение.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Будущие формы сохранены там, где они естественны; заключительное будущее передано повелительной формой как прямой запрет. Необычное «сыны Ассура» сохранено ради образности источника и пояснено в примечании.
