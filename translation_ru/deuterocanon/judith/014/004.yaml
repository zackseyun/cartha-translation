lexical_decisions:
- source_word: ἐπακολουθήσαντες
  choice: последуйте за ними
  rationale: Аористное причастие обозначает действие, сопровождающее и предваряющее главное повеление. В русском переводе оно передано однородным повелительным глаголом ради естественного синтаксиса; выражение сохраняет возможность понимать действие и как следование, и как преследование.
- source_word: πάντες οἱ κατοικοῦντες πᾶν ὅριον Ἰσραήλ
  choice: все жители всей земли Израиля
  rationale: Κατοικοῦντες обозначает постоянно живущих в данной местности, а ὅριον здесь — всю область или территорию, а не только пограничную черту. «Земля Израиля» естественно и понятно передаёт территориальный смысл.
- source_word: καταστρώσατε
  choice: сразите
  rationale: В военном контексте глагол означает повергнуть, уложить наземь или уничтожить противника. «Сразите» передаёт силу повеления без добавления лишних подробностей о способе убийства.
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: на дорогах
  rationale: Буквально — «на их дорогах/путях»; речь идёт о маршрутах отступающего войска. По-русски притяжательное местоимение можно естественно опустить, поскольку принадлежность дорог здесь понятна из контекста.
