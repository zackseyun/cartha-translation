  terminology: «Земля Израиля» допустимо передаёт ὅριον в данном контексте. «Сразите» уместно для καταστρώσατε в военном контексте. «Последовав за ними» сохраняет непредрешённость между простым следованием и преследованием; лексическая возможность преследования отмечена сноской.
