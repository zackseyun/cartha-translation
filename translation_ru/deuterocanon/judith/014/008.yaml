  yaml_path: translation/deuterocanon/judith/014/008.yaml
  text: And now tell me what you have done in these days[a]. And Judith reported to him, in the midst of the people, all that she had done[b], from the day when she went out until the time when she was speaking to them.
translation:
  language: ru
  text: И теперь расскажи мне всё, что ты сделала за эти дни. И Юдифь среди народа[a] поведала ему обо всём, что она сделала, с того дня, как вышла, и до того времени, когда говорила с ними[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед народом». Греческое выражение может указывать как на место среди собравшихся, так и на публичную речь перед ними.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока не поговорила с ними». В греческом здесь стоит форма прошедшего времени несовершенного вида, которая может подчёркивать продолжавшуюся речь или употребляться как обычная повествовательная форма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγγειλόν μοι
  choice: расскажи мне
  rationale: Повелительная форма требует непосредственно поведать о событиях; «расскажи мне» естественно передаёт личное обращение и отчётный характер речи.
- source_word: ὅσα ἐποίησας
  choice: всё, что ты сделала
  rationale: ὅσα охватывает совокупность совершённых действий; женский род определяется обращением к Юдифи.
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: за эти дни
  rationale: Современный русский оборот естественно обозначает действия, совершённые в течение только что прошедшего периода, без уточнения его длительности.
- source_word: ἀπήγγειλεν
  choice: поведала
  rationale: Глагол передаёт последовательный рассказ обо всём происшедшем и сохраняет достоинство повествовательного регистра.
- source_word: ἐν μέσῳ τοῦ λαοῦ
  choice: среди народа
  rationale: Перевод сохраняет пространственный образ нахождения посреди собравшихся, не исключая публичного характера речи.
- source_word: πάντα ὅσα ἦν πεποιηκυῖα
  choice: обо всём, что она сделала
  rationale: Русская конструкция естественно выражает завершённые действия, предшествовавшие рассказу.
- source_word: ἀφʼ ἧς ἡμέρας ἐξῆλθεν
  choice: с того дня, как вышла
  rationale: Сохраняется буквальное значение «вышла» без добавления не названного в стихе места отправления.
- source_word: ἕως οὗ ἐλάλει αὐτοῖς
  choice: до того времени, когда говорила с ними
  rationale: Несовершенный вид «говорила» отражает имперфект ἐλάλει и не сводит его однозначно к завершённому разовому действию.
