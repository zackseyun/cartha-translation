  yaml_path: translation/deuterocanon/judith/014/010.yaml
  text: And when Achior saw all that the God of Israel had done[a], he believed in God greatly, and he circumcised the flesh of his foreskin[b], and was joined to the house of Israel to this day.
translation:
  language: ru
  text: Увидев всё, что совершил Бог Израиля, Ахиор твёрдо уверовал в Бога[a], обрезал свою крайнюю плоть и был присоединён к дому Израиля[b] до нынешнего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всем сердцем доверился Богу». Греческий глагол может обозначать как веру, так и доверие; «твёрдо» передаёт усилительное «весьма».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «был добавлен к дому Израиля». Речь идёт о включении Ахиора в народ Израиля.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: увидев
  rationale: Аористное причастие естественно передаёт обстоятельство, предшествующее главным действиям; русское деепричастие сохраняет краткость и временно-причинную связь.
- source_word: πάντα ὅσα ἐποίησεν ὁ θεὸς τοῦ Ἰσραήλ
  choice: всё, что совершил Бог Израиля
  rationale: Передаёт совокупность только что описанных деяний Бога; «совершил» соответствует возвышенному повествовательному регистру без лишнего уточнения.
- source_word: ἐπίστευσεν τῷ θεῷ σφόδρα
  choice: глубоко уверовал в Бога
  rationale: «Уверовал в Бога» естественно для русского языка выражает возникшую веру и доверие в контексте обращения, а «глубоко» передаёт усилительное σφόδρα без неестественного «весьма уверовал».
- source_word: περιέτεμετο τὴν σάρκα τῆς ἀκροβυστίας αὐτοῦ
  choice: обрезал свою крайнюю плоть
  rationale: Естественно и прямо передаёт совершённое над собственной крайней плотью обрезание. Средний залог допускает такое возвратное по смыслу активное выражение; буквальное «плоть своей крайней плоти» по-русски избыточно и неестественно.
- source_word: προσετέθη πρὸς τὸν οἶκον Ἰσραήλ
  choice: был причислен к дому Израиля
  rationale: Сохраняет пассивную форму и идею включения Ахиора в народ Израиля, не вводя отсутствующей в тексте поздней специальной терминологии.
- source_word: ἕως τῆς ἡμέρας ταύτης
  choice: до сего дня
  rationale: Устойчивый русский библейский оборот, сохраняющий точку зрения повествователя.
theological_decisions:
- issue: Значение πιστεύω в контексте обращения
  choice: глубоко уверовал в Бога
  alternative: всем сердцем доверился Богу
  rationale: Греческое выражение охватывает веру и доверие. Основной текст сохраняет явную связь с лексикой веры, а примечание указывает на оттенок доверия, не сводя смысл лишь к интеллектуальному признанию.
- issue: Включение Ахиора в Израиль
  choice: был причислен к дому Израиля
  alternative: был присоединён к дому Израиля
  rationale: Обе передачи выражают включение в общину. «Был причислен» близко к буквальному значению προστίθημι и не уточняет сверх текста юридический или конфессиональный статус.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены традиционные выражения «Бог Израиля», «дом Израиля» и «до сего дня»; синтаксис упрощён до естественного русского предложения без потери последовательности действий.
