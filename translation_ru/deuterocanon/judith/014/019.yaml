  yaml_path: translation/deuterocanon/judith/014/019.yaml
  text: But when the commanders of the army of Assyria heard the words[a], they tore their tunics, and their souls were greatly troubled[b], and there arose a very great cry and outcry in the midst of the camp.
translation:
  language: ru
  text: Но когда военачальники ассирийского войска услышали эти слова, они разорвали на себе хитоны[a]. Души их пришли в великое смятение[b], и посреди лагеря поднялись крик и чрезвычайно громкий вопль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Разрывание одежды было принятым выражением скорби, потрясения или отчаяния.
    reason: cultural_note
  - marker: b
    text: 'Или: «душа их была сильно встревожена». В греческом тексте употреблено собирательное единственное число.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: Но когда… услышали
  rationale: ὡς с аористом вводит временное придаточное; δέ отмечает поворот повествования и естественно передаётся союзом «но».
- source_word: τὰ ῥήματα
  choice: эти слова
  rationale: ῥήματα обозначает произнесённые слова; указательное «эти» естественно отсылает к только что переданному сообщению.
- source_word: οἱ ἄρχοντες τῆς δυνάμεως Ἀσσούρ
  choice: военачальники ассирийского войска
  rationale: В военном контексте ἄρχοντες — командующие, а δύναμις — войско; «ассирийского» естественно передаёт относящееся к Ассирии Ἀσσούρ.
- source_word: τοὺς χιτῶνας αὐτῶν διέρρηξαν
  choice: они разорвали на себе хитоны
  rationale: χιτών — конкретно хитон, а не одежда вообще. Оборот «на себе» ясно выражает принадлежность одежды и естественен в русском описании ритуального разрывания.
- source_word: ἐταράχθη αὐτῶν ἡ ψυχὴ σφόδρα
  choice: Души их пришли в великое смятение
  rationale: Сохраняется антропологический термин ψυχή, но греческое собирательное единственное число передано естественным русским множественным числом при группе лиц; σφόδρα выражено как «в великое».
- source_word: ἐγένετο αὐτῶν κραυγὴ καὶ βοὴ μεγάλη σφόδρα
  choice: поднялись чрезвычайно громкие крик и вопль
  rationale: «Поднялись» идиоматично передаёт ἐγένετο. Оба близких по значению существительных κραυγή и βοή сохранены; общая форма определения отражает μεγάλη σφόδρα.
- source_word: ἐν μέσῳ τῆς παρεμβολῆς
  choice: посреди лагеря
  rationale: Точная и естественная передача пространственного выражения; παρεμβολή здесь означает военный лагерь.
theological_decisions:
- issue: ψυχή в описании общего смятения военачальников
  choice: Души их пришли в великое смятение
  alternative: Они пришли в великое смятение / дух их пришёл в великое смятение
  rationale: Слово «души» сохраняет явное ψυχή и не подменяет его «духом», тогда как множественное число обеспечивает естественное согласование по-русски. Примечание сообщает о собирательном единственном числе оригинала.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Конкретное «хитоны» сохраняет исторический образ; парные «крик и вопль» воспроизводят риторическое усиление оригинала без архаизации синтаксиса.
