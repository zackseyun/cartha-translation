lexical_decisions:
- source_word: Ἀκούσατε δή μου
  choice: Послушайте меня
  rationale: Императив Ἀκούσατε передан естественным русским повелением; частица δή усиливает настоятельность призыва, что выражено общей интонацией фразы без искусственного отдельного эквивалента.
- source_word: ἀδελφοί
  choice: братья
  rationale: Форма мужского рода во множественном числе служит прямым обращением к мужчинам Ветилуи; буквальное «братья» сохраняет форму и тон обращения.
- source_word: λαβόντες
  choice: Возьмите
  rationale: 'Предшествующее основному императиву аористное причастие естественно передаётся в русском как первый из двух последовательных императивов: «возьмите… и повесьте».'
- source_word: τὴν κεφαλὴν ταύτην
  choice: эту голову
  rationale: Передаёт указательное местоимение и существительное без добавления подразумеваемого из контекста слова «отрубленную».
- source_word: κρεμάσατε αὐτήν
  choice: повесьте её
  rationale: Сохраняет конкретное физическое действие и местоименное возобновление объекта.
- source_word: ἐπὶ τῆς ἐπάλξεως
  choice: на зубцах
  rationale: Греческое ἔπαλξις обозначает верхнюю оборонительную часть стены — зубцы или парапет. Русское множественное «на зубцах» идиоматично для стены, хотя греческая форма стоит в единственном числе и может пониматься собирательно.
- source_word: τοῦ τείχους ὑμῶν
  choice: вашей стены
  rationale: Близко передаёт оборонительную стену, принадлежность которой выражена местоимением; городской и крепостной характер ясен из контекста.
