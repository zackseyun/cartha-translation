  terminology: κοιτών удачно передано словом «спальня». Для χελωνίς безопаснее выбрать «на покрывале ложа» с примечанием о вероятных вариантах («балдахин», «сетка/завеса»), не выдавая спорный предмет за «возвышение». Буквальную конструкцию об отнятой голове следует сохранить в основном тексте; объяснение обезглавливания уместно в сноске.
