  source_fidelity: 'В целом переданы отсутствие ответа, раздвигание занавеса, вход в спальню и смерть Олоферна. Однако «лежит мёртвый» сглаживает ἐρριμμένον («брошенный/поверженный»), а «голова его отделена от тела» заменяет буквальное и намеренно резкое «голова его была отнята от него» иной, более объяснительной формулировкой. Имя Олоферна допустимо: ближайший контекст однозначно определяет местоимение αὐτόν.'
