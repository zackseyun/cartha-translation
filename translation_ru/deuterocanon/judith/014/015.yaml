lexical_decisions:
- source_word: ὡς δʼ οὐθεὶς ἐπήκουσεν
  choice: Но когда никто не отозвался
  rationale: В данном повествовательном контексте ἐπακούω означает отклик на зов, а не просто слышание.
- source_word: διαστείλας
  choice: раздвинул занавес
  rationale: Причастие передаёт действие раздвигания или разделения; подразумеваемый предмет в контексте спальни естественно обозначить как занавес.
- source_word: κοιτῶνα
  choice: спальню
  rationale: Современное и точное обозначение помещения для сна; избегает архаичного «опочивальня».
- source_word: ἐπὶ τῆς χελώνιδος
  choice: на возвышении у ложа[a]
  rationale: 'Название предмета обстановки χελωνίς здесь не вполне однозначно: оно может указывать на часть ложа, его покрытие, навес, сетку либо подставку. Нейтральная формулировка сохраняет пространственный смысл, а варианты вынесены в сноску.'
- source_word: ἐρριμμένον νεκρόν
  choice: лежит мёртвый
  rationale: Естественная русская передача результата выраженного перфектным причастием состояния; образ брошенного тела несколько сглажен ради ясности, но состояние смерти передано прямо.
- source_word: ἡ κεφαλὴ αὐτοῦ ἀφῄρητο ἀπʼ αὐτοῦ
  choice: голова его отделена от тела[b]
  rationale: Фраза ясно передаёт обезглавливание, сохраняя отдельное упоминание головы и не заменяя его глагольным резюме «его обезглавили».
