  text: But when no one answered[a], he drew aside the curtain and went into the bedroom, and found him lying dead on the canopy[b], and his head had been taken from him.
translation:
  language: ru
  text: Но когда никто не отозвался, он раздвинул занавес, вошёл в спальню и увидел Олоферна, брошенного и мёртвого, на покрывале ложа[a]; голова его была отнята от него[b].
