  yaml_path: translation/deuterocanon/judith/014/014.yaml
  text: And Bagoas went in and knocked on the curtain of the tent[b][a], for he assumed that he was sleeping with Judith.
translation:
  language: ru
  text: И вошёл Багоас и постучал по занавесу шатра[a], полагая, что Олоферн спит вместе с Иудифью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ударил по завесе шатра». Греческие слова могут быть переданы более буквально как «ударил» и «завеса»; основной текст передаёт действие естественным русским выражением «постучал по занавесу».'
    reason: lexical_alternative
  - marker: b
    text: Багоас лишь предполагал, что Олоферн спит вместе с Иудифью; греческий текст сообщает о его догадке, а не утверждает, что это было на самом деле. Выражение не уточняет характер предполагаемой близости.
    reason: cultural_note
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: вошёл
  rationale: Естественно и точно передаёт аорист εἰσέρχομαι и движение внутрь шатра.
- source_word: ἔκρουσε
  choice: постучал по
  rationale: Глагол означает «ударить, постучать»; в данной сцене речь, вероятнее всего, о поданном у входа знаке, а не о сильном ударе.
- source_word: αὐλαίαν
  choice: занавесу
  rationale: В обстановке шатра это тканевая завеса у входа; «занавес» звучит ясно и современно, не внося культовых ассоциаций.
- source_word: σκηνῆς
  choice: шатра
  rationale: Контекст указывает на шатёр Олоферна; «шатёр» соответствует повествовательной и военной обстановке.
- source_word: ὑπενόειτο
  choice: полагая
  rationale: Передаёт предположение или вывод Багоаса. Русская деепричастная конструкция естественно связывает мотив с его действием.
- source_word: καθεύδειν
  choice: спит
  rationale: Прямо передаёт значение инфинитива «спать», не усиливая возможный интимный подтекст.
- source_word: μετὰ Ἰουδείθ
  choice: с Иудифью
  rationale: Сохраняет простое значение μετά с родительным — «с» — и оставляет контекстуальный оттенок без дополнительного истолкования.
- source_word: Βαγώας
  choice: Багоас
  rationale: Транслитерация греческой формы личного имени.
theological_decisions:
- issue: Не названный в греческом тексте субъект καθεύδειν
  choice: Олоферн
  alternative: он
  rationale: Греческое αὐτόν прямо означает «его», а из ближайшего контекста ясно, что речь об Олоферне. Имя устраняет возможную русскую двусмысленность, не меняя смысла.
- issue: Возможный интимный смысл выражения καθεύδειν μετὰ Ἰουδείθ
  choice: спит с Иудифью
  alternative: спит рядом с Иудифью
  rationale: Буквальное «спит с Иудифью» сохраняет присущую греческому выражению смысловую открытость и не уточняет характер предполагаемой близости.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. «Шатёр» выбран вместо более нейтральной «палатки», чтобы сохранить достоинство исторического повествования; конструкция «спит с Иудифью» намеренно сохраняет неоднозначность оригинала.
