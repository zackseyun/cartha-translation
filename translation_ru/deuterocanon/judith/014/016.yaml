lexical_decisions:
- source_word: ἐβόησεν φωνῇ μεγάλῃ
  choice: громко закричал
  rationale: Передаёт идиому о громком возгласе естественным современным русским языком, не уточняя без основания, были ли это членораздельные слова или вопль.
- source_word: μετὰ κλαυθμοῦ
  choice: с плачем
  rationale: κλαυθμός обозначает плач или скорбное рыдание; «с плачем» близко к форме и смыслу греческого выражения.
- source_word: στεναγμοῦ
  choice: стонами
  rationale: στεναγμός может обозначать стон или тяжёлый вздох; в напряжённом контексте скорби «стоны» лучше сохраняют силу выражения.
- source_word: βοῆς ἰσχυρᾶς
  choice: могучим воплем
  rationale: «Вопль» отличает это выражение от предшествующего глагола, а «могучим» сохраняет усилительное значение ἰσχυρᾶς.
- source_word: διέρρηξεν
  choice: разорвал
  rationale: Глагол обозначает разрывание одежды как действие скорби; современное «разорвал» ясно передаёт смысл без архаизма.
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: на себе одежды
  rationale: «Одежды» сохраняет собирательно-множественный характер ἱμάτια и торжественный регистр; «на себе» естественно выражает принадлежность и сам акт разрывания собственной одежды.
