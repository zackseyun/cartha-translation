lexical_decisions:
- source_word: οἱ ... υἱοὶ Ἀσσοὺρ
  choice: сыны Ассура
  rationale: 'Сохранено буквальное этническое обозначение «сыны Ассура»: оно естественно звучит в литературном русском и передаёт форму греческого текста, не заменяя её толкованием «ассирийцы».'
- source_word: ὡς εἶδον αὐτούς
  choice: когда ... увидели их
  rationale: ὡς с аористом передаёт временную последовательность; «когда» сохраняет смысл, не усиливая его до «как только».
- source_word: διεπέμψαν
  choice: послали весть
  rationale: Глагол обозначает отправку сообщения или посланных; поскольку прямой объект не назван, «послали весть» естественно передаёт действие без добавления явных «гонцов».
- source_word: ἐπὶ τοὺς ἡγουμένους αὐτῶν
  choice: своим предводителям
  rationale: ἡγούμενοι — стоящие во главе, руководители. «Предводители» ясно соответствует военно-административному контексту и помогает отличить их от последующего более общего ἄρχων.
- source_word: οἱ δὲ ἦλθον
  choice: те же пошли
  rationale: Местоименное «те» указывает на ближайшую названную группу — предводителей; частица δέ передана как «же», сохраняя переход к их последующему действию.
- source_word: στρατηγοὺς
  choice: военачальникам
  rationale: В военном контексте στρατηγοί — высшие командиры; «военачальники» естественно и без анахроничного оттенка передаёт должность.
- source_word: χιλιάρχους
  choice: тысяченачальникам
  rationale: Термин буквально обозначает начальников над тысячей. Традиционное и понятное библейское «тысяченачальники» сохраняет числовую составляющую, не вводя римское звание «трибун».
- source_word: ἐπὶ πάντα ἄρχοντα αὐτῶν
  choice: ко всякому своему начальнику
  rationale: Единственное число с πᾶς имеет распределительное значение. «Ко всякому» сохраняет его точнее, чем собирательное «ко всем»; возвратное «своему» естественно передаёт αὐτῶν при субъекте во множественном числе.
