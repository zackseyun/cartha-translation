  rationale: Уточнён русский глагол и синтаксис, чтобы однозначно передать публичное подвешивание головы от стены, не добавляя деталей. Формула о мужчинах Израиля и последующее множественное действие сделаны одновременно точнее и естественнее. Неопределённость ἀναβάσεις сохранена в основном тексте и пояснена в сноске.
