  text: When dawn came up, they hung the head of Holofernes from the wall, and every man of Israel took up his weapons and went out in companies to the mountain passes.
translation:
  language: ru
  text: Когда взошла заря, они подвесили голову Олоферна на стене[a]. Каждый из мужчин Израиля взял оружие, и все они вышли отрядами к подъёмам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со стены». Буквально по-гречески: «со стены»; это указывает на стену как на место или точку, с которой голову подвесили для публичного показа.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к подъёмам»; вероятно, имеются в виду ведущие вверх подходы или горные проходы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡνίκα
  choice: когда
  rationale: Естественно вводит придаточное времени и не добавляет отсутствующего в греческом тексте дискурсивного «теперь».
- source_word: ὁ ὄρθρος ἀνέβη
  choice: взошла заря
  rationale: Передаёт образ восходящей зари и при этом звучит естественно и литературно по-русски.
- source_word: ἐκρέμασαν τὴν κεφαλὴν Ὀλοφέρνου ἐκ τοῦ τείχους
  choice: они вывесили голову Олоферна со стены
  rationale: «Вывесили» ясно указывает на публичное выставление посредством подвешивания, а «со стены» сохраняет значение ἐκ как исходной точки подвеса.
- source_word: πᾶς ἀνὴρ Ἰσραήλ
  choice: каждый мужчина в Израиле
  rationale: Сохраняет распределительное «каждый» и явно мужское обозначение ἀνήρ без архаичного выражения «муж Израиля».
- source_word: ἀνέλαβεν τὰ ὅπλα αὐτοῦ
  choice: взял своё оружие
  rationale: Передаёт обычный военный смысл «взять оружие»; собирательное русское «оружие» естественнее множественного числа в данном контексте.
- source_word: κατὰ σπείρας
  choice: отрядами
  rationale: Передаёт организованное движение группами, не навязывая строго определённой численности или технического военного подразделения.
- source_word: ἐπὶ τὰς ἀναβάσεις
  choice: к подъёмам
  rationale: Сохраняет буквальную пространственную неопределённость греческого выражения — это могут быть подъёмы, ведущие вверх дороги или горные проходы — и не добавляет прямо не названные «горы».
