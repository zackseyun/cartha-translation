base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/014/018.yaml
  text: The servants have failed; one woman of the Hebrews has brought shame on the house of King Nebuchadnezzar. For look—Holofernes is lying on the ground[a], and his head is not on him.
translation:
  language: ru
  text: 'Рабы[a] пренебрегли своим долгом; одна женщина из евреев навлекла позор на дом царя Навуходоносора. Ибо вот: Олоферн лежит на земле, и головы на нём нет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуги». Греческое слово δοῦλοι может обозначать как рабов, так и слуг; здесь, вероятно, имеются в виду зависимые домашние служители.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠθέτησαν
  choice: пренебрегли своим долгом
  rationale: Глагол ἀθετέω может означать «отвергнуть», «нарушить верность», «не исполнить обязанности». В данном возгласе речь идёт о катастрофическом неисполнении обязанностей подчинёнными; дополнение «своим долгом» естественно передаёт подразумеваемый объект, не придавая выражению специально заветного или юридического смысла.
- source_word: οἱ δοῦλοι
  choice: рабы
  rationale: В царском и военном хозяйстве δοῦλοι обозначает зависимых людей под властью господина; «рабы» сохраняет указание на их несвободный статус, тогда как «слуги» может его сгладить.
- source_word: ἐποίησεν αἰσχύνην
  choice: навлекла позор
  rationale: Греческий оборот буквально говорит, что женщина «сделала позор» дому; русское «навлекла позор на дом» естественно выражает причинённое публичное бесчестье.
- source_word: μία γυνὴ τῶν Ἑβραίων
  choice: одна женщина из евреев
  rationale: Сохраняется акцент на том, что это совершила одна-единственная женщина, принадлежащая к еврейскому народу.
- source_word: εἰς τὸν οἶκον
  choice: на дом
  rationale: 'При слове «позор» предлог εἰς передаёт направленность и результат: бесчестье пало на царский дом.'
- source_word: χαμαί
  choice: лежит на земле
  rationale: χαμαί означает «на земле, наземь»; глагол «лежит» естественно восполняется по-русски из безглагольной греческой фразы.
- source_word: ἡ κεφαλὴ οὐκ ἔστιν ἐπʼ αὐτῷ
  choice: головы на нём нет
  rationale: Сохранён нарочито конкретный и потрясающий образ оригинала, а не более гладкое толкование «он обезглавлен».
theological_decisions:
- issue: Передача δοῦλοι в повествовании о царском военном стане
  choice: рабы
  alternative: слуги
  rationale: «Рабы» сохраняет вероятный несвободный статус домашних подчинённых. Вариант «слуги» возможен по контексту выполняемой ими службы, поэтому отмечен в сноске без догматизации социального положения.
translation_notes:
  register: Современный литературный русский язык с достоинством и резкостью, соответствующей тревожному возгласу. Порядок «одна женщина из евреев» намеренно сохраняет уничижительно-потрясённый акцент оригинала; заключительная фраза оставлена конкретной и почти буквальной.
