- source_word: λαόν
  choice: к народу
  rationale: Сохраняет широкое значение существительного и не сужает референт до воинов или толпы.
- source_word: κράζων
  choice: закричал
  rationale: Естественно передаёт громкий возглас; личная форма в русском языке плавно продолжает цепь повествовательных действий.
