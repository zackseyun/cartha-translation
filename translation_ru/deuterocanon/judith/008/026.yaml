base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/026.yaml
  text: Remember what he did with Abraham[a], and how he tested Isaac, and what happened to Jacob in Mesopotamia of Syria while he was shepherding the sheep of Laban[b], his mother's brother.
translation:
  language: ru
  text: Вспомните, что Он сделал с Авраамом, как испытал Исаака[a] и что произошло с Иаковом в Месопотамии Сирийской[b], когда тот пас овец Лавана, брата своей матери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может означать «испытывать», «проверять», а в некоторых контекстах — «искушать»; здесь речь идёт об испытании, а не о склонении ко злу.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в Месопотамии Сирии»; возможно также: «в Сирийской Месопотамии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητε
  choice: Вспомните
  rationale: Аорист повелительного наклонения во множественном числе выражает прямой призыв обратиться памятью к прежним Божьим деяниям.
- source_word: ὅσα ἐποίησεν μετʼ Ἀβραάμ
  choice: что Он сделал с Авраамом
  rationale: Предлог μετά с родительным передан нейтральным «с», чтобы не уточнять без основания, было ли действие совершено для Авраама или над ним. Подразумеваемый субъект обозначен местоимением для естественности русского синтаксиса.
- source_word: ἐπείρασεν
  choice: испытал
  rationale: Глагол πειράζω здесь означает проверку, выявляющую верность, а не побуждение ко злу.
- source_word: ὅσα ἐγένετο τῷ Ἰακώβ
  choice: что произошло с Иаковом
  rationale: Передаёт широкий смысл событий, случившихся с Иаковом, не конкретизируя их характер.
- source_word: ἐν Μεσοποταμίᾳ τῆς Συρίας
  choice: в Месопотамии Сирийской
  rationale: Сохранено греческое географическое наименование; такой порядок слов звучит по-русски естественнее буквального «Месопотамия Сирии».
- source_word: ποιμαίνοντι τὰ πρόβατα
  choice: когда тот пас овец
  rationale: Причастный оборот обозначает продолжающееся сопутствующее действие; «пас овец» естественно и сохраняет конкретный образ исходного текста.
- source_word: Λαβὰν τοῦ ἀδελφοῦ τῆς μητρὸς αὐτοῦ
  choice: Лавана, брата своей матери
  rationale: Формулировка близка к греческой и ясно указывает на родство Лавана с Иаковом, не заменяя его толковательным словом «дядя».
theological_decisions:
- issue: Подразумеваемый субъект действий по отношению к Аврааму и Исааку
  choice: В первой части использовано местоимение «Он», далее субъект подразумевается.
  alternative: Прямо назвать Бога или перестроить фразу так, чтобы нигде не выражать субъект.
  rationale: В греческом субъект не назван, но понятен из контекста. Местоимение обеспечивает ясный русский синтаксис, не добавляя имени «Бог» в основной текст.
- issue: Значение ἐπείρασεν применительно к Божьему действию
  choice: испытал
  alternative: искушал; подверг испытанию
  rationale: «Испытал» сохраняет смысл проверки и не создаёт ошибочного впечатления, будто речь идёт о склонении ко злу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка ясна обычному читателю; сохранены нейтральность оборота о Божьем действии с Авраамом и историческое географическое название.
