  yaml_path: translation/deuterocanon/judith/008/021.yaml
  text: For if we are captured like this[a], all Judea will be brought low, and our holy things will be plundered[d][c][b], and he will require their profanation from our blood.
translation:
  language: ru
  text: Ведь если нас захватят в таком положении[a], вся Иудея окажется поверженной[b], наши святыни будут разграблены, и он взыщет за осквернение их нашей кровью[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «когда нас захватят вот так». Греческое начало синтаксически неровно; по смыслу речь идёт о захвате при нынешних обстоятельствах.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «вся Иудея сядет». Здесь этот образ, вероятно, означает, что она будет унижена, сломлена или останется беспомощной.'
    reason: lexical_alternative
  - marker: c
    text: 'Подлежащее при слове «взыщет» в греческом тексте не названо; по контексту, вероятнее всего, подразумевается Бог. Буквально конец фразы звучит: «взыщет их осквернение от нашей крови». Оборот «нашей кровью» передаёт трудную связь взыскания с кровью говорящих, не уточняя её однозначно.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ' ἐν τῷ λημφθῆναι ἡμᾶς οὕτως
  choice: если нас захватят в таком положении
  rationale: Повреждённое или синтаксически неровное начало передаёт захват общины при нынешних обстоятельствах. Условная конструкция естественна в контексте следствия, а «в таком положении» сохраняет значение οὕτως, не уточняя его сверх текста.
- source_word: καθήσεται
  choice: окажется поверженной
  rationale: Буквально глагол означает «сядет», но здесь образно указывает на унижение, бессилие или крушение всей Иудеи. Русское «окажется поверженной» передаёт этот смысл и сохраняет образ падения.
- source_word: πᾶσα ἡ Ἰουδαία
  choice: вся Иудея
  rationale: Ἰουδαία обозначает землю или область, а не народ; перевод сохраняет географическую отсылку.
- source_word: προνομευθήσεται
  choice: будут разграблены
  rationale: Будущее страдательного залога описывает разграбление врагами и естественно сочетается со «святынями».
- source_word: τὰ ἅγια ἡμῶν
  choice: наши святыни
  rationale: Субстантивированное множественное число охватывает священные предметы и места. «Святыни» по-русски естественно сохраняет эту широту.
- source_word: ζητήσει
  choice: он взыщет
  rationale: Единственное число оставляет субъект невыраженным. «Он взыщет» сохраняет это грамматическое свойство и судебно-возмездный оттенок, не вставляя прямо имя Бога.
- source_word: τὴν βεβήλωσιν αὐτῶν
  choice: за их осквернение
  rationale: βεβήλωσις означает профанацию или осквернение священного. «Осквернение» понятно современному читателю и соответствует сакральному контексту.
- source_word: ἐκ τοῦ αἵματος ἡμῶν
  choice: с нас кровью
  rationale: Трудное выражение связывает взыскание с кровью говорящих. Формулировка сохраняет суровый образ цены и ответственности, не разворачивая его в однозначное толкование.
theological_decisions:
- issue: Неуказанный субъект ζητήσει
  choice: Сохранено местоимение «он» без прямого называния субъекта.
  alternative: «Бог взыщет» либо безличное «будет взыскано».
  rationale: Контекст позволяет подразумевать Бога, однако греческий текст его прямо не называет; местоимение сохраняет исходную недосказанность и богословское напряжение.
- issue: Связь осквернения святынь с кровью общины
  choice: «он взыщет с нас кровью за их осквернение»
  alternative: «он потребует их осквернение от нашей крови» или «за их осквернение мы ответим своей кровью».
  rationale: Выбранный вариант передаёт ответственность, оплачиваемую кровью, но не превращает трудную греческую конструкцию в полностью разъяснённое догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для обычного читателя, при этом сохранены неуказанный субъект ζητήσει, множественный и широкий смысл «святынь» и смысловая трудность заключительного оборота.
