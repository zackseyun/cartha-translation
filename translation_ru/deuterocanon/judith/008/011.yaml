base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/011.yaml
  text: And they came to her[a], and she said to them, “Listen to me, rulers of those who dwell in Bethulia, for your word that you spoke against the people on this day is not right, and you have set up the oath that you spoke between God and yourselves, and said that you would hand over the city to our enemies if within these days the Lord does not turn back to help you.”
translation:
  language: ru
  text: 'И они пришли к ней, и она сказала им: «Послушайте же меня, начальники жителей Ветилуи! Неправильно то, что вы сегодня сказали народу[a]: вы установили клятву, которую произнесли между Богом и вами, и заявили, что отдадите город нашим врагам, если в эти дни Господь не придёт вам на помощь[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сказали против народа»; греческое выражение может означать как речь перед народом, так и решение, направленное против него.'
    reason: Сохранение смысловой неоднозначности ἐναντίον τοῦ λαοῦ.
  - marker: b
    text: 'Буквально: «если в них Господь не обратит (или: не возвратит) вам помощь». Местоимение «в них», вероятно, относится к ранее установленным дням.'
    reason: Разъяснение неявного указания на дни и сжатой конструкции ἐπιστρέψῃ … βοήθειαν.
lexical_decisions:
- source_word: ἄρχοντες
  choice: начальники
  rationale: Передаёт лиц, облечённых властью в городе, без монархического или аристократического оттенка слова «князья».
- source_word: τῶν κατοικούντων ἐν Βαιτυλουά
  choice: жителей Ветилуи
  rationale: Естественно передаёт субстантивированное причастие κατοικούντων; буквальное «живущих в Ветилуе» по-русски здесь тяжеловесно.
- source_word: οὐκ εὐθὺς ὁ λόγος ὑμῶν
  choice: неправильно то, что вы … сказали
  rationale: εὐθύς имеет здесь оценочное значение «правильный, должный», а λόγος обозначает высказанное решение или заявление.
- source_word: ἐναντίον τοῦ λαοῦ
  choice: народу
  rationale: Дательный при глаголе речи естественно сохраняет возможный смысл «перед народом / народу»; в сноске отмечена допустимая враждебная трактовка «против народа».
- source_word: ἐστήσατε τὸν ὅρκον
  choice: утвердили клятву
  rationale: Сохраняет значение установления или закрепления клятвы и звучит естественнее буквального «поставили клятву».
- source_word: ἀνὰ μέσον τοῦ θεοῦ καὶ ὑμῶν
  choice: между Богом и вами
  rationale: Прямо передаёт взаимное соотнесение сторон клятвы; русское «вами» достаточно выражает рефлексивный смысл.
- source_word: ἐκδώσειν τὴν πόλιν
  choice: отдадите город
  rationale: Передаёт сдачу города врагам ясным современным языком.
- source_word: ἐὰν μὴ ἐν αὐταῖς
  choice: если в эти дни … не
  rationale: Женское местоимение множественного числа отсылает к ранее оговорённым дням, хотя существительное в самом стихе не повторено.
- source_word: ἐπιστρέψῃ ὁ κύριος βοήθειαν ὑμῖν
  choice: Господь не придёт вам на помощь
  rationale: Сжатая греческая конструкция буквально связана с возвращением или обращением помощи; русская идиома ясно выражает ожидаемое Божье вмешательство, а сноска сохраняет необычность оригинала.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: В иудейском библейском контексте слово обозначает Бога; «Господь» сохраняет традиционный религиозный вес без добавления конфессиональной интерпретации.
- issue: Смысл ἐναντίον τοῦ λαοῦ
  choice: сказали народу
  alternative: сказали против народа
  rationale: ἐναντίον допускает как пространственный смысл «перед, в присутствии», так и враждебный «против». Контекст публичного объявления делает нейтральное «народу» уместным, но неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной синтаксической формой. Длинное греческое предложение сохранено как единая реплика, а двоеточие делает ход упрёка прозрачным. Имя Βαιτυλουά передано традиционной русской формой «Ветилуя» в родительном падеже.
