  yaml_path: translation/deuterocanon/judith/008/006.yaml
  text: And she fasted all the days of her widowhood[a], except the days before Sabbaths and Sabbaths and the days before new moons and festivals and celebrations of the house of Israel.
translation:
  language: ru
  text: Она постилась во все дни своего вдовства, кроме дней перед субботами и самих суббот, дней перед новомесячиями[a], праздников и дней радости дома Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческие сложные слова буквально обозначают дни, предшествующие субботам и новомесячиям.
    reason: Пояснение строения редких календарных терминов и основания описательного перевода.
lexical_decisions:
- source_word: ἐνήστευε
  choice: она постилась
  rationale: Имперфект обозначает продолжавшуюся или обычную практику в прошлом; русская форма несовершенного вида естественно передаёт эту длительность и повторяемость.
- source_word: πάσας τὰς ἡμέρας τῆς χηρεύσεως αὐτῆς
  choice: во все дни своего вдовства
  rationale: Фраза охватывает весь период её жизни как вдовы и при этом сохраняет образную структуру греческого выражения.
- source_word: χωρὶς
  choice: кроме
  rationale: В данном перечислении предлог ясно указывает на дни, исключённые из обычного поста.
- source_word: προσαββάτων
  choice: дней перед субботами
  rationale: Сложное существительное обозначает дни, предшествующие субботам; описательный перевод понятен современному читателю и не вводит более поздний специальный термин.
- source_word: σαββάτων
  choice: самих суббот
  rationale: Греческое слово стоит во множественном числе и обозначает регулярно повторяющиеся субботы; «самих» ясно отличает их от предшествующих дней.
- source_word: προνουμηνιῶν
  choice: дней перед новомесячиями
  rationale: Перевод сохраняет параллель с προσαββάτων и прямо выражает значение сложного греческого слова.
- source_word: ἑορτῶν
  choice: праздников
  rationale: Современное и естественное обозначение религиозных праздничных дней.
- source_word: χαρμοσυνῶν
  choice: дней радости
  rationale: Существительное обозначает радостные, торжественные случаи; добавление «дней» естественно связывает его с календарным перечнем, не сводя значение только к формально установленным праздникам.
- source_word: οἴκου Ἰσραήλ
  choice: дома Израиля
  rationale: Сохранён библейский образ всего народа Израиля, а не упрощённое «Израиля».
theological_decisions:
- issue: Характер исключений из поста Иудифи
  choice: Иудифь обычно постилась во время своего вдовства, но не постилась в перечисленные священные и радостные дни.
  alternative: Считать перечисленные дни особыми днями её поста.
  rationale: χωρὶς в этом контексте естественно выражает исключение, а праздничный характер перечисленных дней подтверждает, что пост в них прекращался.
- issue: Передача календарных терминов Израиля
  choice: Описательно перевести как «дни перед субботами» и «дни перед новомесячиями».
  alternative: Использовать специальные литургические термины вроде «дни приготовления» или «кануны».
  rationale: Описательный перевод непосредственно отражает строение греческих слов и не придаёт им более узкого позднего значения.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского выражения «дом Израиля». Синтаксис сделан ясным и плавным, а календарные реалии переданы описательно, без поздней конфессиональной терминологии.
