  yaml_path: translation/deuterocanon/judith/008/003.yaml
  text: For he happened to be binding the sheaf in the field[a], and the hot wind came upon his head, and he fell onto his bed and died in Bethulia, his city. And they buried him with his fathers in the field between Dothaim and Balamon.
translation:
  language: ru
  text: Ведь он как раз связывал сноп в поле, когда знойный ветер обрушился ему на голову[a]. Он упал на постель и умер в Ветилуе, своём городе. Его похоронили с его предками на поле между Дотаимом и Валамоном.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «палящий зной обрушился ему на голову». Греческое слово καύσων может означать как сильный зной, так и обжигающий горячий ветер.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτύγγανε
  choice: как раз связывал
  rationale: 'Передаёт обстоятельственный оттенок глагола: событие застало его за этой работой; по-русски естественнее, чем буквальное «случилось ему связывать».'
- source_word: δεσμεύοντος τὸ δράγμα
  choice: связывал сноп
  rationale: Единственное число τὸ δράγμα обозначает связку сжатых стеблей, то есть сноп; русский перевод сохраняет число и сельскохозяйственный контекст.
- source_word: ὁ καύσων
  choice: знойный ветер
  rationale: καύσων может означать как палящий зной, так и обжигающий горячий ветер. В основном тексте выбран конкретный метеорологический смысл, а подлинная неоднозначность отмечена в сноске.
- source_word: ἦλθεν ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: обрушился ему на голову
  rationale: Естественно передаёт направленность выражения и внезапность воздействия, не уточняя медицинскую причину последующего состояния.
- source_word: ἔπεσεν ἐπὶ τὴν κλίνην
  choice: он слёг
  rationale: В данном повествовательном контексте русское «слёг» естественно обозначает, что человек оказался прикован к постели, не добавляя конкретного диагноза; буквальное «упал на постель» по-русски может ошибочно подразумевать мгновенное физическое падение непосредственно с поля.
- source_word: ἐτελεύτησεν
  choice: умер
  rationale: Прямой и современный русский эквивалент без эвфемизма.
- source_word: Βαιτυλουὰ
  choice: Ветилуя
  rationale: Устоявшаяся русская библейская форма названия города в книге Иудифи.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: с его предками
  rationale: Передаёт семейно-погребальный смысл оборота современным и понятным русским языком; буквальное «с отцами» могло бы неоправданно сузить значение.
- source_word: ἐν τῷ ἀγρῷ τῷ ἀνὰ μέσον Δωθαεὶμ καὶ Βαλαμών
  choice: на поле между Дотаимом и Валамоном
  rationale: Ясно и близко к греческому передаёт место погребения; топонимы транслитерированы в привычной русской форме.
