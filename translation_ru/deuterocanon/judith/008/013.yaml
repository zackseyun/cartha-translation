  text: And now you are testing the Lord Almighty[b][a], and you will never understand anything.
translation:
  language: ru
  text: И теперь вы испытываете Господа Вседержителя[a], и ничего не постигнете вовеки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исследуете»; греческий глагол может означать тщательное исследование или испытание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «до века»; в этом контексте: «никогда» или «во все времена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξετάζετε
  choice: испытываете
  rationale: Глагол означает исследовать, подвергать проверке, испытывать. В контексте упрёка «испытываете» естественно передаёт дерзновенную попытку проверить или постичь Бога, не сводя значение лишь к отвлечённому изучению.
- source_word: κύριον Παντοκράτορα
  choice: Господа Вседержителя
  rationale: «Господь» обычно и уместно передаёт κύριος как божественный титул, а традиционное и понятное «Вседержитель» сохраняет смысл Παντοκράτωρ — обладающий всей властью.
- source_word: οὐθὲν
  choice: ничего
  rationale: Прямой и естественный русский эквивалент отрицательного местоимения.
- source_word: ἐπιγνώσεσθε
  choice: не постигнете
  rationale: ἐπιγινώσκω здесь обозначает достижение подлинного, полного понимания. «Постигнете» естественно сочетается с попыткой исследовать Бога и сохраняет усиленный познавательный оттенок глагола.
- source_word: ἕως τοῦ αἰῶνος
  choice: вовеки
  rationale: Греческая идиома буквально указывает на длительность «до века» и в данном отрицательном высказывании означает «никогда, вовеки». «Вовеки» сохраняет образ и торжественный регистр.
theological_decisions:
- issue: Характер человеческой попытки исследовать Бога в ἐξετάζετε
  choice: испытываете Господа Вседержителя
  alternative: исследуете Господа Вседержителя
  rationale: «Испытываете» удерживает неоднозначность между проверкой и тщательным исследованием и соответствует обличительному контексту, не вводя специально мотив искушения Бога.
- issue: Степень невозможности познания в οὐθὲν ἐπιγνώσεσθε ἕως τοῦ αἰῶνος
  choice: ничего не постигнете вовеки
  alternative: никогда ничего не поймёте
  rationale: Выбранная формулировка сохраняет и абсолютное οὐθὲν, и временную идиому ἕως τοῦ αἰῶνος, не превращая утверждение в более широкую систематическую формулу о всяком богопознании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Вседержитель», «постигнете» и «вовеки» традиционны, но остаются понятными; синтаксис краток и естественен.
