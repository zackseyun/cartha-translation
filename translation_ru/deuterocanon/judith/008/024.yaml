  yaml_path: translation/deuterocanon/judith/008/024.yaml
  text: Now[a], brothers, let us show our brothers that their life hangs on us[b], and that the holy things and the house and the altar rest on us.
translation:
  language: ru
  text: Теперь, братья[a], покажем нашим братьям, что от нас зависит их жизнь[b] и что на нас держатся святыни, храм и жертвенник.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры», если обращение имеет включительный смысл, а не относится только к мужчинам.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их душа»; здесь, вероятнее всего, имеется в виду их жизнь или выживание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужское множественное число и язык родства; возможное включительное понимание отмечено в сноске.
- source_word: ἐπιδειξώμεθα
  choice: покажем
  rationale: Естественно передаёт побудительное сослагательное наклонение и призыв подтвердить сказанное делом.
- source_word: ἐξ ἡμῶν κρέμαται
  choice: от нас зависит
  rationale: Русский оборот «висит на нас» здесь звучал бы неестественно; «зависит от нас» ясно передаёт образ решающей зависимости.
- source_word: ἡ ψυχὴ αὐτῶν
  choice: их жизнь
  rationale: В контексте угрозы общине ψυχή означает жизнь или выживание, а не обязательно нематериальную душу.
- source_word: τὰ ἅγια
  choice: святыни
  rationale: Передаёт субстантивированное множественное число, не сливая его с отдельно названными храмом и жертвенником.
- source_word: ὁ οἶκος
  choice: храм
  rationale: В культовом контексте «дом» обозначает храм; буквальное «дом» по-русски было бы неясно без добавления «Божий».
- source_word: τὸ θυσιαστήριον
  choice: жертвенник
  rationale: Точный и традиционно понятный русский эквивалент культового термина.
- source_word: ἐπεστήρισται ἐφʼ ἡμῖν
  choice: на нас держатся
  rationale: Передаёт состояние опоры и зависимости, выраженное перфектом, и сохраняет конкретную метафору греческого текста.
theological_decisions:
- issue: Гендерно маркированное обращение ἀδελφοί
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет мужскую грамматическую форму источника, а возможное включительное значение не исключается и вынесено в сноску.
- issue: Значение ψυχή
  choice: их жизнь
  alternative: их душа
  rationale: Речь идёт о сохранении жизни общины под угрозой; перевод «душа» мог бы привнести не требуемое контекстом антропологическое утверждение.
- issue: Соотношение τὰ ἅγια и ὁ οἶκος
  choice: святыни, храм
  alternative: святилище и дом
  rationale: Раздельная передача сохраняет перечисление и не отождествляет святыни с отдельно названным храмом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохраняет трёхчастное перечисление; «святыни» естественно передаёт множественное τὰ ἅγια, а «на нас держатся» поддерживает образ опоры.
