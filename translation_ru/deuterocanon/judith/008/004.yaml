lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Сохранена повествовательная связь стиха с предшествующим контекстом.
- source_word: ἦν
  choice: жила
  rationale: В сочетании с обстоятельством места и причастием длительного состояния естественное русское «жила» передаёт продолжительное пребывание, не вводя значения «оставалась», которого сам глагол прямо не выражает.
- source_word: Ἰουδεὶθ
  choice: Иудифь
  rationale: Традиционная и узнаваемая русская форма имени.
- source_word: ἐν τῷ οἴκῳ αὐτῆς
  choice: в своём доме
  rationale: Возвратное «своём» естественно по-русски соотносит дом с подлежащим; «доме» прямо передаёт οἴκῳ.
- source_word: χηρεύουσα
  choice: вдовой
  rationale: Творительный предикативный естественно выражает продолжающееся состояние вдовства; событие утраты мужа не выдвигается на первый план.
- source_word: ἔτη τρία καὶ μῆνας τέσσορες
  choice: три года и четыре месяца
  rationale: В русском языке длительность после «жила» естественно выражается винительным времени без дополнительного предлога.
