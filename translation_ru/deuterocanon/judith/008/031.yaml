  yaml_path: translation/deuterocanon/judith/008/031.yaml
  text: And now pray for us[a], because you are a devout woman, and the Lord will send rain to fill our cisterns, and we will not perish any longer.
translation:
  language: ru
  text: 'А теперь помолись за нас: ведь ты благочестивая женщина, и Господь пошлёт дождь, чтобы наполнить наши цистерны, и мы больше ни в чём не будем нуждаться.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и мы больше не погибнем». Буквально: «и мы больше не иссякнем (не придём к концу)».'
    reason: Глагол ἐκλείπω может обозначать иссякание, прекращение, недостаток или гибель; в контексте нехватки воды основной текст передаёт смысл прекращения нужды, а примечание сохраняет возможный более сильный оттенок.
lexical_decisions:
- source_word: δεήθητι περὶ ἡμῶν
  choice: помолись о нас
  rationale: Императив δεήθητι выражает просьбу обратиться к Богу с молитвой, а περί с родительным указывает, за кого молятся. Такая формулировка естественна по-русски и сохраняет смысл заступнической молитвы.
- source_word: γυνὴ εὐσεβὴς
  choice: благочестивая женщина
  rationale: εὐσεβής обозначает почтительную преданность Богу. «Благочестивая» — понятное и достойное слово современного литературного русского языка.
- source_word: ἀποστελεῖ Κύριος τὸν ὑετόν
  choice: Господь пошлёт дождь
  rationale: Передаёт будущее время ἀποστελεῖ и обычный библейский смысл Κύριος, не подставляя в греческий текст тетраграмматон.
- source_word: εἰς πλήρωσιν
  choice: чтобы наполнить
  rationale: Инфинитивная целевая конструкция по-русски естественно передаёт значение цели или ожидаемого результата греческого оборота.
- source_word: τῶν λάκκων ἡμῶν
  choice: наши водохранилища
  rationale: В контексте засухи λάκκοι — углублённые ёмкости для сбора и хранения дождевой воды. «Водохранилища» понятно современному читателю и не создаёт характерной для слова «цистерны» ассоциации прежде всего с металлическими резервуарами.
- source_word: οὐκ ἐκλείψομεν ἔτι
  choice: мы больше не будем изнемогать
  rationale: ἐκλείπω может означать иссякать, слабеть, терпеть недостаток или погибать. «Не будем изнемогать» сохраняет образ истощения общины из-за нехватки воды, не сводя неоднозначный глагол исключительно к физической смерти.
theological_decisions:
- issue: Передача Κύριος
  choice: Господь
  alternative: Господь Бог / Яхве
  rationale: «Господь» прямо соответствует греческому Κύριος и сохраняет иудейский библейский способ именования Бога без внесения отсутствующего в тексте имени.
- issue: Степень уверенности в обещании дождя
  choice: Господь пошлёт дождь
  alternative: пусть Господь пошлёт дождь
  rationale: Форма ἀποστελεῖ — будущее изъявительное наклонение, поэтому сохранено уверенное утверждение, а не пожелание или условная надежда.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохранён близким к греческому, но сделан естественным для устной речи. Неоднозначность заключительного глагола вынесена в примечание.
