revisions:
- from: А теперь помолись о нас, ведь ты благочестивая женщина, и Господь пошлёт дождь, чтобы наполнить наши водохранилища, и мы больше не будем изнемогать.[a]
  to: 'А теперь помолись за нас: ведь ты благочестивая женщина, и Господь пошлёт дождь, чтобы наполнить наши цистерны, и мы больше ни в чём не будем нуждаться.[a]'
  rationale: Исправлены неточная передача ἐκλείψομεν, чрезмерно широкий термин для λάκκοι и менее естественная русская конструкция при просьбе о заступнической молитве. В примечании сохранена семантическая неопределённость греческого заключения.
