  text: And her husband Manasseh was from her own tribe and her own family line[a]; and he died in the days of the barley harvest.
translation:
  language: ru
  text: Муж её, Манассия, был из того же колена и рода, что и она[a]. Он умер во время жатвы ячменя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из того же колена и отчего дома, что и она». Греческий текст различает φυλή («колено») и πατριά — более узкую родственную группу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ αὐτῆς
  choice: муж её
  rationale: С притяжательным местоимением ἀνήρ имеет здесь естественное значение супруга, а не просто мужчины.
- source_word: Μανασσης
  choice: Манассия
  rationale: Имя передано в традиционной русской библейской форме.
- source_word: φυλή
  choice: колено
  rationale: В иудейском родословном контексте слово обозначает одно из племенных подразделений Израиля; «колено» — привычный и точный русский библейский термин.
- source_word: πατριά
  choice: род
  rationale: Слово обозначает более узкую родственную группу внутри колена; «род» ясно и естественно передаёт это различие по-русски.
- source_word: τῆς φυλῆς αὐτῆς καὶ τῆς πατριᾶς αὐτῆς
  choice: из того же колена и рода, что и она
  rationale: Такая формулировка естественно выражает принадлежность Манассии к колену и роду Иудифи, не создавая впечатления, будто эти группы принадлежали ей лично.
- source_word: ἐν ἡμέραις θερισμοῦ κριθῶν
  choice: во время жатвы ячменя
  rationale: Передаёт временное значение оборота и сельскохозяйственную реалии естественным современным русским языком.
