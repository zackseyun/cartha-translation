base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/032.yaml
  text: And Judith said to them[a], “Listen to me[c][b], and I will do a deed that will reach to generation after generation among the sons of our people.”
translation:
  language: ru
  text: 'И сказала им Иудифь: «Выслушайте меня[a], и я совершу дело, которое дойдёт до сынов нашего народа из поколения в поколение[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Услышьте меня».'
    reason: Лексическая альтернатива для Ἀκούσατέ μου.
  - marker: b
    text: 'Буквально: «в поколения поколений»; выражение указывает на продолжающееся воздействие во многих последующих поколениях. Слово «сынов» может здесь иметь собирательный смысл: «потомков».'
    reason: Пояснение греческой идиомы εἰς γενεὰς γενεῶν и возможного коллективного значения υἱοῖς.
lexical_decisions:
- source_word: Ἀκούσατέ μου
  choice: Выслушайте меня
  rationale: Повелительная форма ἀκούω здесь призывает не просто услышать слова, а внимательно выслушать говорящую; такой перевод естественен для современной русской прямой речи.
- source_word: ποιήσω πρᾶγμα
  choice: я совершу дело
  rationale: Сочетание ποιέω и πρᾶγμα обозначает намеренное действие. «Совершу дело» сохраняет весомый, несколько торжественный тон, не уточняя характер поступка сверх текста.
- source_word: ἀφίξεται
  choice: дойдёт
  rationale: Глагол буквально означает «достигнет, дойдёт». Русское «дойдёт» сохраняет образ распространения во времени и не вводит прямо отсутствующего в греческом тексте понятия памяти или славы.
- source_word: εἰς γενεὰς γενεῶν
  choice: из поколения в поколение
  rationale: Это естественный русский эквивалент повторительной формулы «в поколения поколений», передающий продолжительное влияние на череду поколений.
- source_word: υἱοῖς τοῦ γένους ἡμῶν
  choice: до сынов нашего народа
  rationale: «Сынов» сохраняет явно мужскую форму υἱοῖς, а «нашего народа» естественно передаёт γένος как общность происхождения, избегая современных двусмысленностей слова «раса».
theological_decisions:
- issue: Коллективное значение мужского множественного υἱοῖς
  choice: сынов нашего народа
  alternative: потомков нашего народа / детей нашего народа
  rationale: Основной текст сохраняет грамматически мужское «сынов», не исключая возможного коллективного значения. Более широкое понимание отмечено в сноске, чтобы не устранять смысловую неоднозначность оригинала.
- issue: Характер непреходящего действия
  choice: дело, которое дойдёт… из поколения в поколение
  alternative: дело, о котором будут помнить из поколения в поколение
  rationale: Оригинал говорит, что дело «достигнет» последующих поколений, но прямо не называет память или известность; перевод сохраняет эту образность и не сужает возможный смысл.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной и прямой речи. Синтаксис близок к греческому, но не буквалистичен; образ «дойдёт… из поколения в поколение» намеренно сохраняет открытость исходной формулировки.
