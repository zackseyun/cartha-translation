  yaml_path: translation/deuterocanon/judith/008/007.yaml
  text: And she was very beautiful in appearance and lovely to behold[a]; and Manasseh her husband had left her gold and silver and male servants and female servants and livestock and fields[b], and she remained over them.
translation:
  language: ru
  text: Она была красива собой и необычайно прекрасна на вид. Её муж Манассия оставил ей золото и серебро, слуг и служанок[a], скот и поля, и она продолжала распоряжаться всем этим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабов и рабынь». Греческие слова в таком перечне имущества могут обозначать домашних рабов или слуг.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое выражение может также означать: «всё это оставалось за ней» или «она оставалась владелицей всего этого»; оно допускает оттенок как владения, так и управления.'
    reason: alternative_reading
lexical_decisions:
- source_word: καλὴ τῷ εἴδει
  choice: красива собой
  rationale: Сочетание описывает внешнюю красоту; русский оборот естественно передаёт εἶδος как наружность или облик.
- source_word: ὡραία τῇ ὄψει σφόδρα
  choice: необычайно прекрасна на вид
  rationale: Передаёт зрительное впечатление, выраженное ὄψις, и сильное усиление σφόδρα, сохраняя параллелизм с первой характеристикой.
- source_word: ὑπελείπετο αὐτῇ
  choice: оставил ей
  rationale: Контекст указывает на имущество, оставленное умершим мужем; формулировка не уточняет, было ли оно завещано официально.
- source_word: παῖδας καὶ παιδίσκας
  choice: слуг и служанок
  rationale: В перечне имущества слова обозначают зависимых работников домашнего хозяйства; перевод сохраняет выраженное в греческом различие по полу, а возможное значение рабского статуса отмечено в сноске.
- source_word: κτήνη
  choice: скот
  rationale: Обозначает домашних хозяйственных животных; «скот» — точный и естественный русский собирательный термин.
- source_word: ἀγρούς
  choice: поля
  rationale: Прямо передаёт участки сельскохозяйственной земли.
- source_word: ἔμενεν ἐπʼ αὐτῶν
  choice: она продолжала распоряжаться всем этим
  rationale: Естественно передаёт продолжавшееся владение или управление перечисленным имуществом; точный оттенок греческого оборота сохраняется в сноске как неоднозначный.
theological_decisions:
- issue: Общественное положение παῖδας и παιδίσκας в перечне имущества
  choice: слуг и служанок
  alternative: рабов и рабынь
  rationale: Контекст ясно относит этих людей к хозяйству, но сами термины допускают как более общее обозначение прислуги, так и указание на рабский статус. Основной текст не усиливает значение без необходимости, а более жёсткий социальный смысл сохранён в сноске.
- issue: Смысл выражения ἔμενεν ἐπʼ αὐτῶν
  choice: она продолжала распоряжаться всем этим
  alternative: всё это оставалось за ней; она оставалась владелицей всего этого
  rationale: Оборот может подчёркивать управление, владение либо и то и другое. Основной перевод звучит естественно, а сноска сохраняет подлинную смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Сохранён параллелизм двойного описания красоты, но устранена неестественная для русского буквальность. Термины хозяйственного перечня переданы ясно и без архаизмов; значимые лексические альтернативы вынесены в сноски.
