  - marker: b
    text: 'Или: «не пренебрежёт нами»; «не обойдёт нас вниманием».'
    reason: lexical_alternative
  - marker: c
    text: 'Греч. «из нашего γένος»: γένος означает род, потомство или общность людей одного происхождения; возможно также: «из нашего рода».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωμεν
  choice: не признали
  rationale: Аорист ἐπιγινώσκω может означать «узнать», «познать» или «признать». В контексте исключительной верности Богу «не признали» передаёт исповедальный смысл, не подменяя глагол словом «поклонялись».
- source_word: ἕτερον θεὸν ... πλὴν αὐτοῦ
  choice: иного бога, кроме Него
  rationale: 'Сочетание ἕτερον с отрицанием и πλὴν выражает исключение: никакого иного бога, кроме Него.'
- source_word: ὅθεν
  choice: поэтому
  rationale: ὅθεν вводит логический вывод из предшествующего исповедания.
- source_word: ἐλπίζομεν
  choice: надеемся
  rationale: Сохраняет значение надежды и уверенного ожидания, не превращая его в категорическое утверждение.
- source_word: οὐχ ὑπερόψεται
  choice: не оставит без внимания
  rationale: ὑπεροράω здесь может означать «не замечать», «пренебрегать», «оставлять без внимания». Выбранный оборот естественен по-русски и сохраняет широту значения.
- source_word: ἀπὸ τοῦ γένους ἡμῶν
  choice: ни наш род
  rationale: γένος обозначает род, происхождение или общность, связанную происхождением. «Наш род» сохраняет родовой оттенок, не внося современных расовых или политических категорий.
theological_decisions:
- issue: Исключительное признание одного Бога
  choice: «не признали иного бога, кроме Него»
  alternative: «не поклонялись иному богу, кроме Него»
  rationale: В греческом тексте говорится о познании или признании, а не прямо о поклонении; перевод сохраняет богословскую силу исключительной верности без смыслового расширения.
- issue: Отношение Божьего внимания к общине
  choice: «не оставит без внимания»
  alternative: «не пренебрежёт»
  rationale: Формулировка не определяет точнее, идёт ли речь о невнимании, оставлении или презрении, и тем самым сохраняет семантическую широту ὑπεροράω.
- issue: Значение γένος
  choice: «наш род»
  alternative: «наш народ»
  rationale: «Род» сохраняет компонент общего происхождения; «народ» естественнее в национальном контексте, но несколько ослабляет родовой оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Него/Он» применительно к Богу написано с прописной буквы по традиции русского религиозного письма. Парная конструкция «ни нас, ни наш род» естественно передаёт οὐδέ и область действия отрицания.
