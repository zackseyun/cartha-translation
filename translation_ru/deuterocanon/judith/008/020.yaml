translation:
  language: ru
  text: Но мы не признали иного бога, кроме Него[a]; поэтому надеемся, что Он не оставит без внимания ни нас[b], ни кого-либо из нашего народа[c].
  philosophy: optimal-equivalence
  footnotes:
