revisions:
- from: Потому что в наших поколениях не восставало и по сей день нет среди нас ни колена, ни рода, ни народа, ни города, которые поклонялись бы богам, сделанным руками[a], как бывало в прежние дни.
  to: Ибо в наших поколениях не возникло — и по сей день нет среди нас — ни колена, ни рода, ни народа, ни города, поклоняющихся богам, сделанным руками[a], как бывало в прежние дни.
  rationale: Заменены «не восставало» на «не возникло» и условное «поклонялись бы» на настоящее причастие «поклоняющихся». Это точнее передаёт ἀνέστη и οἱ προσκυνοῦσι, не внося толковательных или конфессиональных уточнений. Примечание и его якорь сохранены.
