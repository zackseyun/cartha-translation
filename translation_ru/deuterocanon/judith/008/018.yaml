  source_fidelity: Черновик верно передаёт перечень общественных единиц, принадлежность «из/среди нас», полемическую формулу «богам, сделанным руками» и контраст с прежними днями. Однако «не восставало» для ἀνέστη в современном русском прежде всего вызывает значение мятежа, а сослагательное «поклонялись бы» не передаёт изъявительное настоящее οἱ προσκυνοῦσι («которые поклоняются»).
  naturalness: Предлагаемая редакция сохраняет умеренно торжественный библейский регистр, но устраняет неестественное «не восставало» и двусмысленную условную конструкцию. Вставное тире ясно передаёт греческое сочетание отрицания прошлого с отдельным усилением «и по сей день нет».
  terminology: «Колено», «род», «народ», «город» приемлемо передают φυλή, πατριά, δῆμος, πόλις. «Боги, сделанные руками» сохраняет буквальную и полемическую формулу θεοῖς χειροποιήτοις; толковательный вариант «идолы» уместно оставлен в примечании.
