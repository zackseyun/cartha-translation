base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/018.yaml
  text: For in our generations no tribe or clan or people or city has arisen from among us that worships gods made by hands[a], as happened in former days; nor is there any even to this day.
translation:
  language: ru
  text: Ибо в наших поколениях не возникло — и по сей день нет среди нас — ни колена, ни рода, ни народа, ни города, поклоняющихся богам, сделанным руками[a], как бывало в прежние дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идолам, сделанным человеческими руками». Буквально по-гречески: «богам, сделанным руками» — полемическое обозначение идолов.'
    reason: Лексическая альтернатива поясняет буквальный оборот χειροποιήτοις, не устраняя его из основного текста.
lexical_decisions:
- source_word: ἀνέστη
  choice: не восставало
  rationale: Метафорическое употребление ἀνίστημι обозначает появление или возникновение такой группы; «не восставало» сохраняет образ исходного текста и звучит уместно в торжественном повествовании.
- source_word: ἐν ταῖς γενεαῖς ἡμῶν
  choice: в наших поколениях
  rationale: Передаёт множественное γενεαῖς как последовательные поколения народа, противопоставленные прежним временам.
- source_word: φυλὴ οὔτε πατριὰ οὔτε δῆμος οὔτε πόλις
  choice: ни колена, ни рода, ни народа, ни города
  rationale: 'Сохраняет четырёхчленный перечень общественных единиц: φυλή — «колено», πατριά — родовая группа, δῆμος — народ или население, πόλις — город.'
- source_word: ἐξ ἡμῶν
  choice: среди нас
  rationale: Естественно по-русски выражает происхождение изнутри сообщества говорящей.
- source_word: οἱ προσκυνοῦσι
  choice: которые поклонялись бы
  rationale: При богах глагол имеет религиозное значение «поклоняться»; множественное относительное местоимение согласует определение со всем перечислением.
- source_word: θεοῖς χειροποιήτοις
  choice: богам, сделанным руками
  rationale: Сохраняет буквальную полемическую формулу греческого текста, не подменяя слово «боги» толковательным «идолы».
- source_word: οὐδὲ ἔστιν ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: и по сей день нет
  rationale: Передаёт отдельное усиление настоящего времени и естественно соединяется с предшествующим отрицанием.
- source_word: καθάπερ ἐγένετο ἐν ταῖς πρότερον ἡμέραις
  choice: как бывало в прежние дни
  rationale: Имперфективное русское «бывало» естественно отсылает к известным случаям идолопоклонства в прежние времена.
theological_decisions:
- issue: Передача полемического выражения θεοῖς χειροποιήτοις
  choice: богам, сделанным руками
  alternative: идолам, сделанным человеческими руками
  rationale: 'Основной текст сохраняет буквальную формулировку и её богословскую иронию: предметы, изготовленные людьми, названы богами. Толковательный эквивалент дан в примечании.'
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранены перечень общественных единиц, временной контраст и буквальная анти-идольская формула; синтаксис слегка упорядочен ради ясности.
