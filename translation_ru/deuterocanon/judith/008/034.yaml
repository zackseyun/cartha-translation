  text: But you must not investigate my action, for I will not tell you until what I am doing has been completed.
translation:
  language: ru
  text: Но вы не пытайтесь разузнать о моём деле, потому что я не скажу вам, пока не завершится то, что я делаю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξερευνήσετε
  choice: не пытайтесь разузнать
  rationale: Глагол обозначает тщательное разыскивание или выведывание. Сочетание передаёт настойчивый характер расспросов и естественно звучит по-русски.
- source_word: τὴν πρᾶξίν μου
  choice: о моём деле
  rationale: πρᾶξις здесь означает предпринимаемое действие или дело. «О моём деле» сохраняет существительное и не уточняет преждевременно, идёт ли речь об отдельном поступке, образе действий или замысле.
- source_word: οὐ γὰρ ἐρῶ ὑμῖν
  choice: потому что я не скажу вам
  rationale: Будущая форма ἐρῶ в контексте означает отказ сообщить собеседникам подробности; буквальное и естественное соответствие — «не скажу вам».
- source_word: ἕως τοῦ τελεσθῆναι
  choice: пока не завершится
  rationale: Оборот указывает предел времени и сохраняет значение завершения, выраженное пассивным инфинитивом.
- source_word: ἃ ἐγὼ ποιῶ
  choice: то, что я делаю
  rationale: Относительный оборот относится к продолжающимся действиям Иудифи. Настоящее время передано без превращения действия в заранее сформулированный план.
