base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/025.yaml
  text: Besides all this[a], let us give thanks to the Lord our God[b], who tests us just as he also tested our fathers.
translation:
  language: ru
  text: Несмотря на всё это, будем благодарить Господа, Бога нашего, который испытывает нас[a], как испытывал и наших отцов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол может также означать «проверяет», а в некоторых контекстах — «искушает»; здесь речь идёт о том, что Бог подвергает Свой народ испытанию.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наших предков». Буквально: «наших отцов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὰ ταῦτα πάντα
  choice: Несмотря на всё это
  rationale: 'В данном контексте оборот имеет уступительный смысл: испытания не отменяют благодарности. Такой перевод естественен по-русски и не превращает фразу в простое добавление.'
- source_word: εὐχαριστήσωμεν
  choice: будем благодарить
  rationale: Увещательный конъюнктив первого лица множественного числа передан совместным призывом; формулировка современна и сохраняет продолжительный характер благодарения.
- source_word: Κυρίῳ τῷ θεῷ ἡμῶν
  choice: Господа, Бога нашего
  rationale: Сохранены божественный титул, приложение и общинно-заветное определение «нашего».
- source_word: πειράζει
  choice: испытывает
  rationale: Глагол допускает значения «испытывать», «проверять» и в иных контекстах «искушать». Здесь сопоставление с предками указывает на проверку верности в бедствии; настоящее время сохранено.
- source_word: καθὰ καὶ
  choice: как … и
  rationale: Переданы и сопоставление, и добавочная частица καί.
- source_word: τοὺς πατέρας ἡμῶν
  choice: наших отцов
  rationale: Буквально сохранён мужской род исходного родственного обозначения; в контексте речь идёт о прежних поколениях Израиля.
theological_decisions:
- issue: Значение πειράζει при Боге как субъекте
  choice: испытывает
  alternative: искушает; подвергает проверке
  rationale: «Испытывает» сохраняет напряжение мысли о Божьем испытании народа, но не приписывает Богу побуждение ко злу.
- issue: Временная форма подразумеваемого глагола при «отцах»
  choice: как испытывал и наших отцов
  alternative: как и наших отцов
  rationale: В греческом во второй части сравнения глагол подразумевается. В русском его повтор с прошедшим временем делает историческое сопоставление ясным, не меняя смысла.
- issue: Объём значения τοὺς πατέρας ἡμῶν
  choice: наших отцов
  alternative: наших предков
  rationale: Основной текст сохраняет конкретную образность греческого выражения, а более широкое референтное значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок «Господа, Бога нашего» сохраняет достоинство и близость к греческой конструкции без архаизации.
