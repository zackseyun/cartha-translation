lexical_decisions:
- source_word: ἀγαθῇ καρδίᾳ
  choice: от доброго сердца
  rationale: Сохраняет греческий образ сердца и передаёт нравственную чистоту и искренность намерения; по-русски звучит естественнее буквального «с добрым сердцем» при глаголе речи.
- source_word: ἐλάλησας
  choice: ты говорила
  rationale: Позволяет отличить этот глагол от предшествующего εἶπας («ты сказала») и характеризует всю её речь как произнесённую с добрым расположением сердца.
- source_word: ἀντιστήσεται
  choice: не воспротивится
  rationale: Передаёт значение противодействия или выступления против сказанного, сохраняя несколько возвышенный, но понятный библейский регистр.
- source_word: τοῖς λόγοις σου
  choice: твоим словам
  rationale: Сохраняет множественное число и прямую связь с высказанным Иудифью наставлением.
- source_word: Πάντα ὅσα εἶπας
  choice: Всё, что ты сказала
  rationale: Естественно и полно передаёт всеохватное значение греческого выражения.
- source_word: Ὀζείας
  choice: Озия
  rationale: Имя передано по греческой форме, принятой в русской библейской традиции для данного персонажа.
