  text: But the people became very thirsty[a], and they compelled us to do as we had said to them, and to bring upon ourselves an oath that we will not break.
translation:
  language: ru
  text: Но народ страдал от сильной жажды, и люди вынудили нас поступить так, как мы им сказали, и связать себя клятвой[a], которую мы не нарушим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возложить на себя клятву».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίψησεν σφόδρα
  choice: страдал от сильной жажды
  rationale: Передаёт крайнюю степень жажды, выраженную сочетанием глагола с σφόδρα, естественным современным русским языком.
- source_word: ἠνάγκασαν
  choice: вынудили
  rationale: Глагол обозначает сильное давление или принуждение; «вынудили» сохраняет эту силу без излишне резкой окраски.
- source_word: ποιῆσαι ἡμᾶς καθὰ ἐλάλησαν αὐτοῖς
  choice: поступить так, как мы им сказали
  rationale: Передаёт значение καθὰ («так, как»). Хотя в данном греческом свидетельстве форма ἐλάλησαν грамматически затруднительна, контекст указывает на ранее сказанное старейшинами народу; перевод следует этому контекстуальному смыслу, не добавляя содержания обещания.
- source_word: ἐπαγαγεῖν ἐφʼ ἡμᾶς ὅρκον
  choice: связать себя клятвой
  rationale: Естественно передаёт греческую идиому о возложении клятвы на самих себя; буквальный образ сохранён в примечании.
- source_word: ὃν οὐ παραβησόμεθα
  choice: которую мы не нарушим
  rationale: С глаголом παραβαίνω клятва мыслится как обязательство, которое нарушают; русский эквивалент точен и идиоматичен.
