lexical_decisions:
- source_word: ἀποστείλασα
  choice: она послала
  rationale: Аористное причастие обозначает действие, предшествующее основному; сочинительная передача естественна по-русски и сохраняет последовательность.
- source_word: ἅβραν
  choice: служанку
  rationale: Слово обозначает женщину-прислужницу или личную помощницу; «служанка» ясно и естественно в современном русском языке.
- source_word: τὴν ἐφεστῶσαν πᾶσιν τοῖς ὑπάρχουσιν αὐτῆς
  choice: распоряжавшуюся всем её имуществом
  rationale: ἐφεστῶσαν передаёт руководство или надзор, а τοῖς ὑπάρχουσιν — принадлежащее ей имущество; формулировка сохраняет управленческий смысл.
- source_word: ἐκάλεσεν
  choice: позвала
  rationale: В контексте Юдифь через служанку вызывает к себе городских старейшин; «позвала» передаёт целенаправленное приглашение без излишне властного оттенка слова «вызвала».
- source_word: Χαβρεὶν καὶ Χαρμεῖν
  choice: Хаврина и Хармина
  rationale: Имена транслитерированы с греческого с падежным оформлением, требуемым русским синтаксисом.
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως αὐτῆς
  choice: старейшин своего города
  rationale: πρεσβύτεροι здесь означает городских старейшин как общественных руководителей, а не просто пожилых мужчин; возвратное «своего» естественно передаёт αὐτῆς.
