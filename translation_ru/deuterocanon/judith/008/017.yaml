base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/017.yaml
  text: Therefore[a], while we wait for the salvation that comes from him, let us call on him to help us, and he will hear our voice[b], if it is pleasing to him.
translation:
  language: ru
  text: Поэтому, ожидая спасения[a] от Него, призовём Его на помощь, и Он услышит наш голос[b], если Ему будет угодно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавления».'
    reason: 'Лексическая альтернатива: в данном контексте σωτηρία может обозначать избавление от непосредственной опасности.'
  - marker: b
    text: В выражении «услышит наш голос» может подразумеваться, что Он благосклонно выслушает и ответит.
    reason: Глагол εἰσακούομαι в молитвенном контексте способен включать оттенок благосклонного отклика, однако основной текст сохраняет буквальный образ голоса.
lexical_decisions:
- source_word: διόπερ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения естественным современным русским союзным наречием.
- source_word: ἀναμένοντες
  choice: ожидая
  rationale: Сохраняет значение продолжающегося, исполненного надежды ожидания и форму обстоятельственного причастного оборота.
- source_word: σωτηρίαν
  choice: спасения
  rationale: Сохраняет богословскую весомость греческого слова и обозначает Божье спасительное вмешательство; в данном повествовательном контексте возможно также «избавление».
- source_word: τὴν παρ' αὐτοῦ
  choice: от Него
  rationale: Кратко и прямо передаёт источник спасения, выраженный παρά с родительным падежом.
- source_word: ἐπικαλεσώμεθα
  choice: призовём Его
  rationale: Передаёт побудительный конъюнктив первого лица множественного числа и молитвенное обращение к Богу.
- source_word: εἰς βοήθειαν ἡμῶν
  choice: на помощь
  rationale: Естественный русский оборот, близкий к буквальному «для нашей помощи» и ясно выражающий просьбу о содействии.
- source_word: εἰσακούσεται
  choice: услышит
  rationale: Сохраняет библейскую лексику и не делает полностью явным подразумеваемый оттенок благосклонного ответа.
- source_word: τῆς φωνῆς ἡμῶν
  choice: наш голос
  rationale: Формально передаёт существительное φωνή, не усиливая его до «вопля» и не сужая до «молитвы».
- source_word: ἐὰν ἦν αὐτῷ ἀρεστόν
  choice: если Ему будет угодно
  rationale: Естественно по-русски сохраняет условность и подчинение Божьей воле, не объясняя, что именно Богу угодно.
theological_decisions:
- issue: Значение σωτηρία в повествовании о непосредственной военной угрозе
  choice: спасение
  alternative: избавление
  rationale: «Спасение» сохраняет более широкий богословский вес Божьего спасающего действия, тогда как «избавление» точнее подчёркивает непосредственное освобождение от опасности; альтернативу вынесено в примечание.
- issue: Условность Божьего ответа в ἐὰν ἦν αὐτῷ ἀρεστόν
  choice: если Ему будет угодно
  alternative: если это будет Ему угодно
  rationale: Краткая формулировка сохраняет зависимость услышания от Божьего благоволения и оставляет открытым референт безличного ἀρεστόν.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Призовём Его на помощь» звучит естественно и сохраняет совместное побуждение. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской издательской традиции.
