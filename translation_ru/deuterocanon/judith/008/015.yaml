base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/015.yaml
  text: For if he is not willing to help us within these five days[a], he himself has the authority, in whatever days he wishes, to shelter us[b], or even to destroy us before our enemies.
translation:
  language: ru
  text: Ведь если Он не пожелает помочь нам в эти пять дней, то Он Сам властен укрыть нас[a] тогда, когда пожелает, или даже погубить нас на глазах у наших врагов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «защитить нас». Греческий глагол буквально связан с покрытием и здесь обозначает защитное укрытие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «перед лицом наших врагов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ βούληται
  choice: если Он не пожелает
  rationale: Передаёт условность и волевой оттенок βούλομαι, не превращая его в простое отсутствие действия.
- source_word: ἐν ταῖς πέντε ἡμέραις
  choice: в эти пять дней
  rationale: Контекст указывает на уже названный пятидневный срок; указательное «эти» естественно передаёт эту связь.
- source_word: βοηθῆσαι ἡμῖν
  choice: помочь нам
  rationale: Нейтрально и точно передаёт значение помощи, не сужая его до избавления или спасения.
- source_word: αὐτὸς ἔχει τὴν ἐξουσίαν
  choice: Он Сам властен
  rationale: Сохраняет усилительное αὐτός и выражает принадлежащую Богу свободу и власть действовать, избегая тяжеловесного буквального оборота «имеет власть».
- source_word: ἐν αἷς θέλει ... ἡμέραις
  choice: тогда, когда пожелает
  rationale: Естественно по-русски передаёт не ограниченную людьми свободу выбора времени; буквальное «в какие пожелает дни» звучало бы неестественно.
- source_word: σκεπάσαι
  choice: укрыть нас
  rationale: Сохраняет образ покрывающего, защитного укрытия, заложенный в σκεπάζω, и не сводит его к отвлечённому «защитить».
- source_word: ὀλεθρεῦσαι
  choice: погубить нас
  rationale: Передаёт тяжёлое значение уничтожения или причинения гибели и хорошо соответствует возвышенному повествовательному регистру.
- source_word: πρὸ προσώπου τῶν ἐχθρῶν ἡμῶν
  choice: на глазах у наших врагов
  rationale: Передаёт публичность и открытость действия перед врагами, не добавляя отсутствующей в греческом прямой мысли «руками врагов».
theological_decisions:
- issue: Божья власть над временем и исходом событий
  choice: Бог властен как укрыть народ в избранное Им время, так и погубить его.
  alternative: Смягчить вторую возможность, представив Бога лишь допускающим гибель от рук врагов.
  rationale: Оба инфинитива — σκεπάσαι и ὀλεθρεῦσαι — грамматически зависят от утверждения о Божьей власти. Перевод сохраняет напряжение текста и не заменяет прямое «погубить» идеей одного лишь попущения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис сделан естественным для русского языка, при этом сохранены волевой оттенок, образ укрытия и суровое противопоставление возможных исходов.
