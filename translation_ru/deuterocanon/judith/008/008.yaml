translation:
  language: ru
  text: И не было никого, кто сказал бы против неё дурного слова, потому что она очень боялась Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπήνεγκεν αὐτῇ ῥῆμα πονηρόν
  choice: не мог сказать о ней ничего дурного
  rationale: Идиоматическая русская передача буквального «не навёл/не принёс против неё дурного слова»; в контексте выражение означает, что никто не мог выступить с дурным словом или обвинением против неё.
- source_word: ἐφοβεῖτο τὸν θεὸν
  choice: чтила Бога
  rationale: В данном контексте φόβος перед Богом обозначает благоговейное почитание, а не просто испуг; «чтила» естественно передаёт нравственно-религиозный смысл.
- source_word: σφόδρα
  choice: глубоко
  rationale: Передаёт высокую степень благоговейного почитания естественным современным русским сочетанием.
theological_decisions:
- issue: Значение выражения «бояться Бога»
  choice: глубоко чтила Бога
  alternative: сильно боялась Бога
  rationale: Выбранная формулировка сохраняет религиозный смысл благоговения и верности Богу, не создавая ложного впечатления, будто речь лишь об эмоциональном страхе.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, достойная и понятная. Греческая конструкция передана естественно, без конфессионально окрашенных добавлений.
