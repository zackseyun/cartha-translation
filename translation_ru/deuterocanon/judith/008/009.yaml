base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/009.yaml
  text: And she heard the evil words of the people against the ruler[a], because they had lost heart over the shortage of water; and she heard all the words that Ozias had spoken to them, that he had sworn to hand over the city to the Assyrians after five days.
translation:
  language: ru
  text: И она услышала злые слова народа против правителя, потому что они пали духом из-за нехватки воды; Иудифь услышала и все слова, которые Озия сказал им, поклявшись передать город ассирийцам через пять дней[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сдать город ассирийцам». Греческое παραδιδόναι буквально означает «передавать, отдавать».'
    reason: Лексическая альтернатива для παραδώσειν в военном контексте.
lexical_decisions:
- source_word: ῥήματα τοῦ λαοῦ τὰ πονηρά
  choice: злые слова народа
  rationale: Сохраняет конкретное указание на произнесённые слова и их резко отрицательную нравственную оценку, не заменяя их более узким «ропотом».
- source_word: ἐπὶ τὸν ἄρχοντα
  choice: против правителя
  rationale: Передаёт направленность враждебной речи и сохраняет общий характер титула ἄρχων, не уточняя должность сверх греческого текста.
- source_word: ὠλιγοψύχησαν
  choice: пали духом
  rationale: Естественное русское выражение для утраты мужества и надежды.
- source_word: ἐπὶ τῇ σπάνει τῶν ὑδάτων
  choice: из-за нехватки воды
  rationale: Передаёт причинное значение оборота и дефицит воды; множественное число греческого ὑδάτων по-русски естественно выражается собирательным единственным.
- source_word: πάντας τοὺς λόγους
  choice: все слова
  rationale: Сохраняет акцент исходного текста на сказанном, не сглаживая его до «всё».
- source_word: ὤμοσεν
  choice: поклявшийся
  rationale: Явно сохраняет значение клятвы и естественно связывает определение с Озией.
- source_word: παραδώσειν
  choice: передать
  rationale: Близко передаёт широкое значение «отдать, передать в чужую власть», не сужая его без необходимости до военно-технического «сдать».
- source_word: μετὰ ἡμέρας πέντε
  choice: через пять дней
  rationale: 'Естественно по-русски передаёт временное значение μετά с винительным: по истечении пяти дней.'
theological_decisions:
- issue: Явное называние Иудифи во второй части стиха
  choice: «услышала Иудифь и все слова»
  alternative: «и услышала она все слова»
  rationale: В греческом тексте во второй части прямо стоит имя Ἰουδεὶθ. Его сохранение воспроизводит исходный акцент, несмотря на стилистически заметный повтор.
- issue: Характер обещанного действия в отношении города
  choice: «передать город ассирийцам»
  alternative: «сдать город ассирийцам»
  rationale: «Передать» сохраняет более широкий смысл παραδίδωμι и не делает военное значение единственно возможным, хотя контекст допускает перевод «сдать».
translation_notes:
  register: Современный литературный русский язык с повествовательной торжественностью. Синтаксический повтор «услышала… услышала Иудифь» сохранён ради структуры и явного имени в греческом тексте; устаревшие формы и конфессионально окрашенная терминология не используются.
