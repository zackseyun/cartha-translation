lexical_decisions:
- source_word: σκηνήν
  choice: шатёр
  rationale: Прямое и естественное соответствие временному укрытию или обособленному помещению; не уточняет конструкцию сверх греческого текста.
- source_word: ἐπὶ τοῦ δώματος
  choice: на плоской крыше
  rationale: В данном бытовом контексте δῶμα обозначает используемую плоскую кровлю дома; уточнение помогает современному читателю представить место действия.
- source_word: σάκκον
  choice: вретище
  rationale: Устоявшийся библейский термин для грубой ткани, которую носили в знак скорби, уничижения или покаяния; культурное значение пояснено в сноске.
- source_word: ἐπὶ τὴν ὀσφὺν αὐτῆς
  choice: на бёдра
  rationale: ὀσφύς обозначает область поясницы, талии или бёдер; сочетание «возложила на бёдра» сохраняет пространственный образ исходного текста и звучит литературно.
- source_word: τὰ ἱμάτια τῆς χηρεύσεως αὐτῆς
  choice: одежда её вдовства
  rationale: Формально передаёт одежду, связанную с её состоянием и образом жизни вдовы, не сужая смысл до одной лишь траурной одежды.
- source_word: ἦν ἐπʼ αὐτῆς
  choice: была на ней
  rationale: Сохраняет статичную конструкцию греческого текста и его формальный тон, не заменяя её более свободным «она носила».
