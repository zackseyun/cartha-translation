  source_fidelity: В целом перевод точно передаёт три действия и сохраняет намеренно неуточнённый характер σκηνή («шатёр»). Однако «на бёдра» неточно для ὀσφύς, обозначающего поясницу/талию (чресла), а не бёдра. Кроме того, τὰ ἱμάτια — множественное число, поэтому «одежды ... были» точнее, чем единственное «одежда ... была».
  naturalness: «Возложила на бёдра вретище» звучит по-русски неестественно и создаёт неверный образ. «Повязала вокруг талии вретище» — современно-литературная и ясная передача. Остальной параллельный синтаксис уместен.
  terminology: «Шатёр» и «вретище» допустимы; последнее корректно пояснено сноской. «Одежды её вдовства» сохраняет статусно-траурный смысл греческого выражения, не сводя его только к трауру.
