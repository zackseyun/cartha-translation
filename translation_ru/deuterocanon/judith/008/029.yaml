  text: For your wisdom did not become evident only today; rather[a], from the beginning of your days all the people have known your understanding, because the disposition of your heart is good.
translation:
  language: ru
  text: Ведь не только сегодня стала явной твоя мудрость; ещё с первых дней твоих весь народ знает твою рассудительность, потому что добра направленность твоего сердца[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что внутреннее устроение твоего сердца добро». Греческое πλάσμα буквально указывает на нечто сформированное или созданное и здесь, вероятно, означает внутренний склад, направленность сердца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐν τῇ σήμερον ἡ σοφία σου πρόδηλός ἐστιν
  choice: не сегодня стала явной твоя мудрость
  rationale: Оборот передаёт противопоставление нынешнего дня давно сложившейся известности мудрости. «Стала явной» естественно выражает подразумеваемый временной оттенок πρόδηλος, не утверждая, будто мудрость прежде отсутствовала.
- source_word: ἀλλʼ ἀπʼ ἀρχῆς ἡμερῶν σου
  choice: ещё с первых дней твоих
  rationale: «Ещё» естественно передаёт усиленное противопоставление ἀλλά, а «с первых дней твоих» сохраняет библейский образ исходного выражения без тяжеловесной буквальности.
- source_word: ἔγνω πᾶς ὁ λαὸς
  choice: весь народ знает
  rationale: Настоящее время по-русски ясно выражает устойчивую известность, начавшуюся прежде и сохраняющуюся теперь; πᾶς ὁ λαός передано собирательным оборотом «весь народ».
- source_word: τὴν σύνεσίν σου
  choice: твою рассудительность
  rationale: σύνεσις обозначает понимание, проницательность и здравое суждение. «Рассудительность» естественно отличает это качество от уже названной σοφία — «мудрости».
- source_word: καθότι
  choice: потому что
  rationale: Союз вводит причину, по которой народ знает её рассудительность; прямой русский эквивалент сохраняет логическую связь.
- source_word: ἀγαθόν ἐστιν τὸ πλάσμα τῆς καρδίας σου
  choice: добр склад твоего сердца
  rationale: πλάσμα буквально связано с формированием или созданным обликом, а здесь характеризует внутреннее устроение. «Склад сердца» сохраняет образ внутренней сформированности и звучит естественно; ἀγαθόν передано широким нравственным определением «добр».
theological_decisions:
- issue: Библейское антропологическое выражение «сердце»
  choice: сохранено слово «сердце» в выражении «склад твоего сердца»
  alternative: «твой внутренний склад» или «твой характер»
  rationale: В библейской речи сердце является средоточием мысли, воли и нравственной направленности. Его сохранение не сужает выражение до чувств и не заменяет исходный образ отвлечённым понятием характера.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сделан плавным и понятным, при этом сохранены противопоставление настоящего дня давней репутации и образ сердца как внутреннего средоточия личности.
