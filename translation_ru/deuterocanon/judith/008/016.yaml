  source_fidelity: 'Требуется исправление направления залоговой метафоры. ἐνεχυράζετε с прямым дополнением τὰς βουλὰς означает «не закладывайте / не отдавайте в залог замыслы», а не «не берите замыслы в залог»: последний вариант меняет субъектно-направленное значение. Во второй паре διαπεισθῆναι означает «быть убеждённым, склонённым», но «переубедить» добавляет отсутствующее в греческом указание на изменение уже занятой позиции.'
