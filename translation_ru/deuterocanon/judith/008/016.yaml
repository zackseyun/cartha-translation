base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/016.yaml
  text: But do not hold the plans of the Lord our God as security[a], for God is not like a man, to be threatened, nor like a son of man[b], to be persuaded.
translation:
  language: ru
  text: Но не закладывайте замыслы Господа, Бога нашего, в залог[a], ибо Бог — не человек, чтобы Ему угрожали, и не сын человеческий[b], чтобы Его убеждали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не отдавайте замыслы Господа, Бога нашего, в залог (как обеспечение)». В греческом тексте использован образ залога.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «сын человеческий» — выражение в семитском стиле, означающее человека; это не мессианский титул.
    reason: cultural_note
lexical_decisions:
- source_word: ἐνεχυράζετε
  choice: не берите ... в залог
  rationale: Глагол использует образ залога или обеспечения. Такой перевод сохраняет конкретную метафору греческого текста, не заменяя её толкованием вроде «не испытывайте» или «не ставьте условий».
- source_word: βουλάς
  choice: замыслы
  rationale: βουλή может обозначать совет, намерение, замысел или план. «Замыслы» естественно сочетается с речью о Боге и сохраняет оттенок целенаправленного намерения.
- source_word: κυρίου τοῦ θεοῦ ἡμῶν
  choice: Господа, Бога нашего
  rationale: Передаёт оба наименования и греческую пояснительную конструкцию ясным современным русским языком.
- source_word: ἀπειληθῆναι
  choice: чтобы Ему можно было угрожать
  rationale: Пассивный инфинитив буквально относится к тому, кому угрожают. Русская модальная конструкция естественно выражает невозможность воздействовать на Бога угрозами.
- source_word: διαπεισθῆναι
  choice: чтобы Его можно было переубедить
  rationale: Глагол означает склонить убеждением или воздействием. «Переубедить» передаёт попытку заставить изменить решение и сохраняет параллель с предыдущей конструкцией.
- source_word: υἱὸς ἀνθρώπου
  choice: сын человеческий
  rationale: Буквальный перевод сохраняет семитизированный параллелизм «человек — сын человеческий»; примечание предотвращает ошибочное понимание как мессианского титула.
theological_decisions:
- issue: Противопоставление Бога человеку
  choice: Сохранить прямое отрицание возможности воздействовать на Бога угрозами или убеждением, как на человека.
  alternative: 'Передать свободнее: «Бог не человек, чтобы Его можно было запугать или заставить изменить решение».'
  rationale: Греческий текст прямо сопоставляет Бога с человеком и сыном человеческим посредством двух пассивных инфинитивов. Формулировка не расширяет утверждение до отвлечённой доктрины и сохраняет его риторическое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Залоговая метафора намеренно сохранена, хотя она необычна; её смысл пояснён в сноске. Параллелизм второй половины стиха воспроизведён симметричными конструкциями.
