base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/023.yaml
  text: For our slavery will not be turned to favor[a], but the Lord our God will make it a dishonor.
translation:
  language: ru
  text: Ведь наше рабство не приведёт к благосклонности[a], но Господь, Бог наш, обратит его в бесчестье.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наше рабство не обернётся благосклонностью».'
    reason: Глагол κατευθυνθήσεται допускает передачу как направленности к итогу («не приведёт к»), так и самого исхода («не обернётся»).
lexical_decisions:
- source_word: κατευθυνθήσεται
  choice: не приведёт
  rationale: Будущее страдательного залога от κατευθύνω в сочетании с εἰς указывает здесь на направленность или итог. Русское «не приведёт к» естественно передаёт движение к результату, не усиливая значение до «будет успешным».
- source_word: δουλεία
  choice: рабство
  rationale: δουλεία обозначает состояние несвободы и подчинения; «рабство» сохраняет силу греческого слова лучше, чем более мягкое «служение».
- source_word: εἰς χάριν
  choice: к благосклонности
  rationale: В данном общественно-политическом контексте χάρις означает благосклонность или расположение, а не богословски нагруженную «благодать».
- source_word: ἀτιμίαν
  choice: в бесчестье
  rationale: ἀτιμία означает утрату чести, бесчестье или позор. «Бесчестье» сохраняет смысл общественного унижения и контрастирует с благосклонностью.
- source_word: θήσει αὐτὴν
  choice: обратит его
  rationale: τίθημι здесь выражает приведение к определённому состоянию. «Обратит его в» естественно передаёт результат; местоимение «его» относится к русскому слову «рабство».
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: Господь, Бог наш
  rationale: Такой порядок слов сохраняет полноту греческого выражения и звучит в современном литературном русском торжественно, но понятно.
theological_decisions:
- issue: Значение δουλεία применительно к порабощению народа
  choice: рабство
  alternative: неволя; порабощение
  rationale: Контекст говорит о реальном униженном и зависимом положении, поэтому сильное обозначение «рабство» уместно и не смягчает исходный текст.
- issue: Значение χάρις вне сотериологического контекста
  choice: благосклонность
  alternative: милость; благодать
  rationale: Противопоставление ἀτιμία относится к положению и обращению с порабощёнными людьми. «Благосклонность» не привносит в стих специального учения о спасительной благодати.
- issue: Причинение бесчестья Господом
  choice: Господь… обратит его в бесчестье
  alternative: Господь… сделает его позором
  rationale: Сохранено прямое утверждение греческого текста о действии Бога; богословское напряжение не смягчено объяснением или перестройкой причинности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; инверсия «Бог наш» сохраняет достоинство стиля без архаизации.
