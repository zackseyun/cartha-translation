base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/035.yaml
  text: Then Uzziah and the rulers said to her[a], “Go in peace, and may the Lord God go before you for vengeance on our enemies.”
translation:
  language: ru
  text: 'Озия и начальники сказали ей: «Иди с миром, и пусть Господь Бог идёт перед тобой, чтобы совершить возмездие над нашими врагами[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы отомстить нашим врагам». Греческое слово может обозначать возмездие, восстановление справедливости или оправдание; однако военный контекст здесь скорее указывает на карающее воздаяние.'
    reason: Лексическая неоднозначность выражения εἰς ἐκδίκησιν τῶν ἐχθρῶν ἡμῶν.
lexical_decisions:
- source_word: εἶπεν
  choice: сказали
  rationale: 'В греческом сказуемое стоит в единственном числе при составном подлежащем, однако по-русски нормативно согласование во множественном числе: Озия и начальники сказали.'
- source_word: Ὀζίας
  choice: Озия
  rationale: Традиционная русская библейская форма имени, соответствующая греческому Ὀζίας.
- source_word: οἱ ἄρχοντες
  choice: начальники
  rationale: Передаёт лиц, облечённых властью, не уточняя отсутствующую в тексте конкретную должность.
- source_word: Πορεύου εἰς εἰρήνην
  choice: Иди с миром
  rationale: Естественная русская формула напутствия, сохраняющая образ греческого выражения.
- source_word: Κύριος ὁ θεὸς
  choice: Господь Бог
  rationale: Прямое и традиционное соответствие греческому титулу без добавления отсутствующего притяжательного местоимения.
- source_word: ἔμπροσθέν σου
  choice: впереди тебя
  rationale: Сохраняет буквальную пространственную формулировку и допускает подразумеваемые значения предводительства и защиты, не добавляя в греческий текст второго глагола движения.
- source_word: εἰς ἐκδίκησιν τῶν ἐχθρῶν ἡμῶν
  choice: чтобы отомстить нашим врагам
  rationale: В военном контексте ἐκδίκησις обозначает карающее воздаяние; глагольная конструкция естественна по-русски и ясно передаёт направленность действия против врагов.
theological_decisions:
- issue: Передача κύριος в греческом ветхозаветном тексте
  choice: Господь
  alternative: Владыка; ГОСПОДЬ
  rationale: Источник содержит κύριος, а не еврейский тетраграмматон непосредственно; «Господь» точно передаёт титул и не вносит дополнительного типографического толкования.
- issue: Смысл ἐκδίκησις
  choice: отомстить
  alternative: совершить возмездие; восстановить справедливость; защитить правоту
  rationale: Контекст вооружённого противостояния поддерживает значение карающего воздаяния. Примечание сохраняет более широкий диапазон слова и не сводит его исключительно к эмоциональной мести.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прямая речь звучит естественно; синтаксис остаётся близким к греческому. Маркер сноски поставлен после всей реплики, к которой относится лексическое пояснение.
