    issue: Наклонение στήσεσθε передано императивом.
    rationale: Греческая форма является будущим изъявительным; в данном контексте она выражает распоряжение, но не требует русского повелительного наклонения.
  - severity: medium
    issue: Временная конструкция передана как «до истечения срока».
    rationale: Смысл понятен, но исходник говорит о днях, по окончании которых собеседники намерены сдать город; более прямое выражение сохраняет синтаксическую и временную соотнесённость без добавления абстрактного «срока».
  revised_text: Вы будете стоять у ворот этой ночью, а я выйду со своей служанкой. И в те дни, по истечении которых, как вы сказали, вы отдадите город нашим врагам, Господь посетит Израиль моей рукой.
