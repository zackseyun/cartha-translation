  yaml_path: translation/deuterocanon/judith/008/033.yaml
  text: You stand at the gate tonight, and I will go out with my maidservant; and within the days after which you said you would hand over the city to our enemies, the Lord will visit Israel by my hand.
translation:
  language: ru
  text: Вы будете стоять у ворот этой ночью, а я выйду со своей служанкой. И в те дни, по истечении которых, как вы сказали, вы отдадите город нашим врагам, Господь посетит Израиль моей рукой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στήσεσθε
  choice: стойте
  rationale: Форма передаёт повеление в контексте распоряжения Юдифи; естественный русский императив сохраняет прямоту греческого выражения.
- source_word: ἅβρα
  choice: служанка
  rationale: Слово обозначает личную служанку или рабыню; «служанка» точно и естественно в современном литературном русском.
- source_word: ἐν ταῖς ἡμέραις μεθʼ ἃς
  choice: до истечения срока, после которого
  rationale: Буквальная конструкция «в те дни, после которых» тяжеловесна; выбранная формулировка ясно передаёт установленный ранее предел дней, не уточняя сверх текста его продолжительность.
- source_word: ἐπισκέψεται
  choice: посетит
  rationale: Сохранён библейский смысл действенного Божьего обращения к народу — не просто осмотра, а вмешательства и попечения.
- source_word: ἐν χειρί μου
  choice: через мою руку
  rationale: Сохранён образ руки как орудия Божьего действия; «через» естественно выражает инструментальный смысл ἐν.
theological_decisions:
- issue: Характер выражения «Господь посетит Израиль»
  choice: Сохранить «посетит», не конкретизируя результат
  alternative: «Господь спасёт Израиль» или «поможет Израилю»
  rationale: Греческое ἐπισκέψεται допускает более широкий смысл Божьего действенного посещения; конкретизация как спасения преждевременно снимает смысловую напряжённость.
- issue: Посредничество Юдифи в Божьем действии
  choice: «через мою руку»
  alternative: «моей рукой»
  rationale: Обе передачи возможны, но «через мою руку» яснее удерживает различие между Господом как действующим лицом и Юдифью как орудием, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис слегка сглажен для ясности, при этом сохранены повелительный тон, образ Божьего посещения и метафора руки.
