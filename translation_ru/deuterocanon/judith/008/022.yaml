base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/022.yaml
  text: and the slaughter of our brothers[a], and the captivity of the land, and the desolation of our inheritance, will return upon our own heads among the nations where we will serve as servants there[b]; and we will become a stumbling block and a reproach before those who possess us.
translation:
  language: ru
  text: И убийство наших братьев, и пленение страны, и опустошение нашего наследия он[a] обратит на наши головы среди народов, где мы будем служить как рабы[b]; и мы станем камнем преткновения и предметом поношения перед теми, кто владеет нами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это обратится на наши головы». Греческий глагол стоит в единственном числе, однако подлежащее в этой части предложения прямо не названо.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «будем служить». Глагол может означать просто служение, но в контексте плена, вероятно, подразумевает подневольный труд или рабство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φόνον
  choice: убийство
  rationale: Передаёт насильственную гибель людей, не сужая значение до юридической квалификации «преднамеренное убийство»; в данном военном контексте возможно также «истребление».
- source_word: ἀδελφῶν
  choice: братьев
  rationale: Сохраняет грамматически мужской род греческого множественного числа; по контексту слово может шире обозначать соплеменников.
- source_word: αἰχμαλωσίαν τῆς γῆς
  choice: пленение страны
  rationale: αἰχμαλωσία обозначает взятие в плен или состояние плена, а γῆ здесь — земля народа, страна; формулировка сохраняет необычную олицетворённость оригинала.
- source_word: ἐρήμωσιν τῆς κληρονομίας ἡμῶν
  choice: опустошение нашего наследия
  rationale: «Опустошение» передаёт разорение и запустение, а «наследие» сохраняет возможный заветный оттенок κληρονομία.
- source_word: ἐπιστρέψει εἰς κεφαλὴν ἡμῶν
  choice: он обратит на наши головы
  rationale: Сохраняет единственное число глагола и образ воздаяния, падающего на человека. Местоимение не называет подразумеваемого деятеля и не устраняет неоднозначность исходной конструкции.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди народов
  rationale: Нейтрально передаёт ἔθνη в обстановке иноземного плена, не навязывая более конфессионально окрашенное «язычники».
- source_word: δουλεύσωμεν
  choice: будем рабами
  rationale: В контексте плена глагол δουλεύω указывает не просто на служение, а на подневольное, рабское положение.
- source_word: πρόσκομμα
  choice: камень преткновения
  rationale: Сохраняет предметный образ того, обо что спотыкаются, в понятной русской библейской формулировке.
- source_word: ὄνειδος
  choice: предмет поношения
  rationale: Передаёт положение тех, кто стал объектом позора, презрения и насмешек со стороны других.
- source_word: τῶν κτωμένων ἡμᾶς
  choice: теми, кто владеет нами
  rationale: Причастие κτωμένων выражает приобретение или обладание; настоящее «владеет» близко греческой форме и поддерживает образ рабства без добавления слова «хозяева».
theological_decisions:
- issue: Подразумеваемое подлежащее при ἐπιστρέψει
  choice: Употреблено неназванное «он», без отождествления с Богом.
  alternative: «Это обратится на наши головы» либо явно «Бог обратит на наши головы».
  rationale: В греческом стоит глагол единственного числа, но подлежащее в самой фразе не выражено; «он» сохраняет грамматическую форму и возможное действие Бога по контексту, не добавляя Его имени в текст.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Повтор союза «и» сохраняет накопительную риторику греческого текста; идиомы «на наши головы» и «камень преткновения» оставлены как понятные и значимые образы.
