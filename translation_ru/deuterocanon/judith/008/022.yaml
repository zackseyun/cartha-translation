review_pass:
  verdict: revise
  source_fidelity: Основная конструкция с неназванным «он» допустимо передаёт единственное число ἐπιστρέψει и не отождествляет деятеля. Перечень бедствий, «на наши головы», «среди народов», «камень преткновения», «поношение» и «те, кто владеет нами» в целом верны. Однако «у которых мы будем рабами» сдвигает значение относительного оборота от места/среды («среди народов, где/у которых мы будем служить») к отношению принадлежности и недостаточно прямо передаёт δουλεύσωμεν как действие служения в рабском положении.
  naturalness: «Пленение страны» сохраняет образ оригинала и возможно в торжественном регистре. «Среди народов, где мы будем служить как рабы» звучит естественнее и точнее, чем «у которых мы будем рабами», не создавая преждевременного повтора с заключительным «теми, кто владеет нами».
  terminology: «Убийство», «наследие», «камень преткновения» и «предмет поношения» уместны. «Служить как рабы» ясно выражает подневольность δουλεύω в контексте плена, не заменяя глагольное значение простым состоянием «быть рабами».
  issues:
  - severity: medium
    issue: Относительный оборот «у которых мы будем рабами»
    rationale: Греческое ἐν τοῖς ἔθνεσιν οὗ ἐὰν δουλεύσωμεν ἐκεῖ означает «среди народов, где/у которых мы будем служить там». Оборот «у которых» в русском преимущественно представляет народы как непосредственных владельцев и переводит δουλεύω состоянием, а не служением. Это также ослабляет различение с τῶν κτωμένων ἡμᾶς («тех, кто владеет нами») в следующей части.
  revised_text: И убийство наших братьев, и пленение страны, и опустошение нашего наследия он[a] обратит на наши головы среди народов, где мы будем служить как рабы[b]; и мы станем камнем преткновения и предметом поношения перед теми, кто владеет нами.
