  text: And in those days Judith heard[a], the daughter of Merari son of Ox son of Joseph son of Oziel son of Elkiah son of Eliou son of Chelkias son of Eliab son of Nathanael son of Salamiel son of Sarasadai son of Israel.
translation:
  language: ru
  text: И в те дни услышала Иудифь, дочь Мерари, сына Окса, сына Иосифа, сына Озиила, сына Елкии, сына Елиуя, сына Хелкии, сына Елеава, сына Нафанаила, сына Саламиила, сына Сарасадая, сына Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Некоторые имена в родословии Иудифи даны здесь в греческой форме. В еврейской традиции им могут соответствовать более привычные варианты, например Озиил — Уззиил, а Сарасадай — Цуришаддай. Основной текст следует греческому свидетельству и не восстанавливает предполагаемые еврейские формы.
