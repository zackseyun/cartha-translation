  rationale: Отвлечённое существительное сохраняет параллелизм греческих конструкций с εἰς и обозначает подвергание грабежу.
- source_word: οἱ πατέρες ἡμῶν
  choice: отцы наши
  rationale: Сохраняет явно мужскую форму и историко-родовой язык оригинала; порядок слов придаёт фразе достоинство без архаической непонятности.
- source_word: ἔπεσον
  choice: пали
  rationale: Естественный русский оборот о гибели в бою, сохраняющий образ греческого глагола.
- source_word: πτῶμα μέγα
  choice: став множеством убитых
  rationale: Передаёт необычную предикативную конструкцию буквально ближе, чем оборот «при великом побоище», но выражает подразумеваемое большое число павших; буквальная образность отмечена в сноске.
- source_word: ἐνώπιον τῶν ἐχθρῶν ἡμῶν
  choice: перед нашими врагами
  rationale: Прямой, естественный и стилистически уместный эквивалент пространственно-реляционного выражения.
