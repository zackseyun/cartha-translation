lexical_decisions:
- source_word: ὧν χάριν
  choice: За это
  rationale: Кратко и естественно передаёт причинное значение выражения, связывая бедствие с ранее названной причиной.
- source_word: ἐδόθησαν
  choice: были преданы
  rationale: Сохраняет пассивную форму и значение отдачи во власть враждебной силы или погибели.
- source_word: εἰς ῥομφαίαν
  choice: мечу
  rationale: Русский библейский оборот «преданы мечу» естественно передаёт гибель от оружия.
- source_word: εἰς διαρπαγήν
