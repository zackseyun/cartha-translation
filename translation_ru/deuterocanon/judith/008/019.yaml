  rationale: Оригинал употребляет мужское πατέρες в традиционном повествовании об истории Израиля; нейтрализация не требуется.
- issue: Толкование πτῶμα μέγα
  choice: стали множеством убитых
  alternative: пали при великом побоище; пали, словно огромное тело
  rationale: Греческая фраза буквально говорит о «великом падшем теле/трупе» и сжато изображает большое число погибших. Перевод передаёт массовую гибель, не превращая неясный образ в отдельное богословское утверждение.
