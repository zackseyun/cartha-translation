  yaml_path: translation/deuterocanon/judith/008/027.yaml
  text: For he did not test us by fire, as he did them, to examine their hearts; nor has he taken vengeance on us. Rather, the Lord scourges those who draw near to him for admonition.
translation:
  language: ru
  text: Ведь Он не подверг нас испытанию огнём[a], как их, чтобы исследовать их сердца, и не подверг нас возмездию. Напротив, Господь бичует тех, кто приближается к Нему, для вразумления[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не опалил нас, как их, испытывая их сердца». Греческий текст сохраняет образ огня, употребляя его в смысле испытания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подвергает наказанию». Греческий глагол буквально означает «бичует», сохраняя суровость образа исправительного наказания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπύρωσεν
  choice: подверг … испытанию огнём
  rationale: Глагол буквально связан с горением, но в сочетании с εἰς ἔτασμόν обозначает испытание посредством огненного бедствия. Перевод сохраняет и образ огня, и смысл проверки.
- source_word: εἰς ἔτασμόν
  choice: чтобы исследовать
  rationale: Оборот выражает цель испытания. «Чтобы исследовать их сердца» естественно звучит по-русски и передаёт проверку внутреннего состояния.
- source_word: καρδίας
  choice: сердца
  rationale: Традиционное библейское обозначение внутреннего человека; оно не сводит смысл лишь к разуму или чувствам.
- source_word: ἐξεδίκησεν
  choice: совершил … возмездие
  rationale: Глагол означает осуществление кары или возмездия. Такая передача сохраняет противопоставление между возмездием и исправительным наказанием в следующей части стиха.
- source_word: νουθέτησιν
  choice: для вразумления
  rationale: Существительное обозначает исправляющее наставление или предостережение. «Вразумление» сохраняет нравственно-исправительную цель и не дублирует значение μαστιγοῖ.
- source_word: μαστιγοῖ
  choice: бичует
  rationale: Глагол буквально означает бичевать. Конкретный и суровый образ сохранён, а не смягчён общим «наказывает» или «воспитывает».
- source_word: Κύριος
  choice: Господь
  rationale: Обычная библейская передача κύριος в данном богословском высказывании.
- source_word: τοὺς ἐγγίζοντας αὐτῷ
  choice: тех, кто приближается к Нему
  rationale: Передаёт продолжающееся приближение к Богу и сохраняет религиозный оттенок исходного выражения.
theological_decisions:
- issue: Смягчать ли образ Божьего исправительного наказания
  choice: 'Сохранить конкретный образ: «Господь бичует»'
  alternative: «Господь наказывает / наставляет»
  rationale: μαστιγοῖ сильнее общего слова о наказании. Текст противопоставляет губительное возмездие болезненному, но исправительному воздействию; смягчение устранило бы это напряжение.
- issue: Как выразить соотношение возмездия и исправительной цели
  choice: «не совершил над нами возмездия. Напротив, для вразумления…»
  alternative: «не наказал нас, но наставляет…»
  rationale: Так сохраняется явное различие между воздаянием и исправляющим наказанием, не вводя в стих более широких богословских выводов.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксическое различие между «нас» и «их сердца» сохранено по греческому тексту, несмотря на его смысловую напряжённость.
