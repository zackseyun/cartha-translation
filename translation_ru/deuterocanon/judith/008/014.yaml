base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/014.yaml
  text: For you will not find the depths of a man's heart[a], nor will you discern the words of his mind. So how will you search out God, who made all these things, and know his mind, and understand his thought? By no means, brothers[b], provoke the Lord our God.
translation:
  language: ru
  text: Ведь вы не найдёте глубин человеческого сердца[a] и не распознаете рассуждений его разума. Как же вы исследуете Бога, сотворившего всё это, познаете Его разум и поймёте Его мысль? Ни в коем случае не вызывайте, братья[b], гнева Господа, Бога нашего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глубины сердца человека». Греческое слово «человек» стоит в мужском роде и единственном числе, но употреблено обобщённо — о людях вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «братья и сёстры». В греческом тексте стоит «братья»; мужская форма могла употребляться как обращение ко всей общине.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάθος καρδίας ἀνθρώπου
  choice: глубины человеческого сердца
  rationale: Передаёт образ недоступной внутренней глубины; родительный ἀνθρώπου имеет обобщающее значение. Русское «человеческого» естественно выражает эту представительность, не сводя высказывание к одному мужчине.
- source_word: εὑρήσετε
  choice: не постигнете
  rationale: Буквально глагол означает «найдёте», но применительно к глубине сердца русское «постигнете» естественно передаёт невозможность проникнуть во внутреннюю сущность человека.
- source_word: λόγους τῆς διανοίας αὐτοῦ
  choice: рассуждений его разума
  rationale: λόγους здесь может обозначать внутренние рассуждения, а διάνοια — разум или мыслительную способность. Перевод сохраняет оба элемента и не сводит выражение просто к «мыслям».
- source_word: διαλήμψεσθε
  choice: не распознаете
  rationale: Глагол выражает ясное различение или постижение. «Распознаете» сохраняет оттенок проникновения в содержание внутренних рассуждений.
- source_word: ἐρευνήσετε
  choice: исследуете
  rationale: Передаёт тщательное разыскание или исследование и естественно звучит в риторическом вопросе.
- source_word: ὃς ἐποίησεν τὰ πάντα ταῦτα
  choice: сотворившего всё это
  rationale: «Сотворившего» уместно для Божьего созидательного действия, а «всё это» сохраняет πάντα и ταῦτα.
- source_word: νοῦν αὐτοῦ
  choice: Его разум
  rationale: νοῦς обозначает ум, разум или способность понимания; «разум» сохраняет широкий смысл, не подменяя его отдельным намерением.
- source_word: λογισμὸν αὐτοῦ
  choice: Его мысль
  rationale: λογισμός допускает значения мысли, рассуждения, расчёта или замысла. «Мысль» сохраняет широту и не уточняет её как заранее определённый план.
- source_word: κατανοήσετε
  choice: поймёте
  rationale: Прямо и естественно передаёт глубокое понимание, предполагаемое греческим глаголом.
- source_word: μηδαμῶς
  choice: ни в коем случае
  rationale: Сохраняет категорическую силу наречия и подготавливает последующий запрет.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужскую форму обращения; в контексте она может быть обращена ко всей общине.
- source_word: μὴ παροργίζετε
  choice: не прогневляйте
  rationale: Передаёт каузативный смысл «не вызывайте гнева» в краткой, торжественной и понятной форме.
theological_decisions:
- issue: Непостижимость Божьего разума и мысли
  choice: 'Сохранить три последовательных действия: исследовать Бога, познать Его разум и понять Его мысль.'
  alternative: Обобщить как «постичь Божьи замыслы».
  rationale: Греческий текст намеренно накапливает различные глаголы и понятия, подчёркивая пределы человеческого познания; их не следует сводить к одной богословской формуле.
- issue: Обобщающее ἀνθρώπου и обращение ἀδελφοί
  choice: Передать первое как «человеческого», а обращение — как «братья», снабдив оба места примечаниями.
  alternative: «сердца мужчины» и «братья и сёстры».
  rationale: В первом случае современный русский обобщающий эпитет точно выражает представительное значение, тогда как во втором сохранена явная мужская форма греческого обращения без исключения возможного инклюзивного употребления.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис риторического вопроса сохранён, но сделан естественным для русского языка. Заглавные местоимения о Боге использованы последовательно в рамках принятого русского издательского регистра.
