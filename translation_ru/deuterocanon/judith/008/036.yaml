    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστρέψαντες
  choice: отойдя
  rationale: Аористное причастие обозначает действие, предшествующее основному глаголу. В данном контексте «отойдя» естественно передаёт удаление от шатра, не придавая ему излишне сильного значения возвращения.
- source_word: σκηνῆς
  choice: шатра
  rationale: σκηνή здесь обозначает обычный шатёр в повествовательной обстановке, а не культовую скинию.
- source_word: ἐπορεύθησαν
  choice: отправились
  rationale: Обычный повествовательный глагол движения; «отправились» звучит естественно и достойно в современном русском тексте.
- source_word: διατάξεις
  choice: назначенное место
  rationale: διάταξις может означать установленный порядок, расположение или отведённую позицию. В сочетании с ἐπὶ и по контексту речь идёт о возвращении каждого к отведённому ему месту.
- source_word: αὐτῶν
  choice: каждый на своё
  rationale: Русская распределительная конструкция естественно передаёт принадлежность соответствующих мест нескольким действующим лицам, не добавляя смыслового акцента сверх греческого текста.
