base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/008/012.yaml
  text: And now[a], who are you, that you have put God to the test this day[b], and have set yourselves above God among the sons of men?
translation:
  language: ru
  text: И теперь кто вы такие, что сегодня подвергли Бога испытанию и выступили вместо Бога[a] среди сынов человеческих[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выступили за Бога» или «говорили от имени Бога». Греческая конструкция сжата; предлог может указывать как на действие вместо Бога, так и на действие за Него или от Его имени.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «среди сынов людей» — семитское выражение, обозначающее смертных людей, человечество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειράσατε
  choice: испытываете
  rationale: Глагол πειράζω здесь означает не склонение Бога ко злу, а самонадеянную попытку подвергнуть Его испытанию. Русское «испытываете Бога» ясно передаёт этот смысл и сохраняет библейскую идиоматику.
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: сегодня
  rationale: Удвоенное греческое обозначение времени подчёркивает настоящий день. В современном русском «сегодня» естественно передаёт временной смысл; риторический нажим поддерживается всей конструкцией вопроса.
- source_word: ὑπεῖρ τοῦ θεοῦ
  choice: выступаете вместо Бога
  rationale: Сжатая и трудная греческая конструкция с ὑπέρ допускает значения «за Бога», «от имени Бога» и, по контексту упрёка, «вместо Бога». Формулировка «выступаете вместо Бога» передаёт присвоение Божьей прерогативы, не усиливая его до утверждения, будто собеседники поставили себя выше Бога.
- source_word: ἐν μέσῳ υἱῶν ἀνθρώπων
  choice: среди сынов человеческих
  rationale: Буквальное выражение «сыны человеческие» сохраняет семитскую образность и противопоставление Бога смертным людям; его идиоматический смысл пояснён в сноске.
- source_word: τίνες ἐστὲ ὑμεῖς
  choice: кто вы такие
  rationale: Это резкий риторический вопрос. «Кто вы такие» естественно и точно передаёт упрёк, не добавляя более толковательного «кем вы себя считаете».
theological_decisions:
- issue: Характер упрёка и отношение людей к Божьим прерогативам
  choice: Собеседники самонадеянно выступают вместо Бога, присваивая право устанавливать Ему условия.
  alternative: Они говорят за Бога или от Его имени; возможен и более резкий смысл — ставят себя выше Бога.
  rationale: Греческое ὑπέρ многозначно, а сама конструкция сжата. Контекст поддерживает мысль о присвоении Божьей роли, однако альтернативный смысл «от имени Бога» остаётся подлинно возможным и поэтому отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Резкость риторического вопроса сохранена оборотом «кто вы такие»; архаизирующее выражение «сыны человеческие» удержано ради образности источника и снабжено пояснением.
