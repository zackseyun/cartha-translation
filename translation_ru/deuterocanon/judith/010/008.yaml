  yaml_path: translation/deuterocanon/judith/010/008.yaml
  text: And they said to her, “May the God of our fathers grant you favor, and bring your undertakings to completion for the boasting of the sons of Israel and the exaltation of Jerusalem.” And she bowed down to God.
translation:
  language: ru
  text: 'И сказали ей: «Бог наших отцов да дарует тебе благоволение[a] и да доведёт до конца твои замыслы[b] — во славу сынов Израиля и к возвышению Иерусалима[c]». И она поклонилась Богу[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «да даст тебе в благоволение»; возможно также: «да дарует тебе милость» или «да обеспечит тебе благосклонный приём».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «твои начинания», «твои намерения».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «чтобы сыны Израиля могли хвалиться и чтобы Иерусалим был возвеличен».'
    reason: alternative_reading
  - marker: d
    text: 'Или: «пала ниц перед Богом». Греческий глагол обозначает благоговейный поклон или простирание перед кем-либо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δῴη ... εἰς χάριν
  choice: да дарует тебе благоволение
  rationale: Оптатив передаёт молитвенное пожелание; «дарует благоволение» естественно выражает идиому о благосклонном принятии и успехе.
- source_word: τελειῶσαι
  choice: да доведёт до конца
  rationale: Передаёт значение успешного завершения задуманного и сохраняет параллельную форму благословения.
- source_word: τὰ ἐπιτηδεύματά σου
  choice: твои замыслы
  rationale: В контексте речь идёт о задуманном Иудифью образе действий; «замыслы» звучит естественно, не сужая выражение до отдельных поступков.
- source_word: εἰς καύχημα υἱῶν Ἰσραήλ
  choice: во славу сынов Израиля
  rationale: καύχημα может обозначать предмет похвалы, гордости или торжества. В благословении «во славу» естественно передаёт публично-почётный смысл, а «сынов Израиля» сохраняет форму исходного текста.
- source_word: εἰς ... ὕψωμα Ἰερουσαλήμ
  choice: к возвышению Иерусалима
  rationale: Сохраняет метафору высоты и прославления, заложенную в ὕψωμα.
- source_word: προσεκύνησεν τῷ θεῷ
  choice: поклонилась Богу
  rationale: Передаёт телесный жест почтения, не заменяя его более отвлечённым «поклонилась Богу» в значении исключительно богослужебного акта.
theological_decisions:
- issue: Цель благословения в оборотах εἰς καύχημα и ὕψωμα
  choice: во славу сынов Израиля и к возвышению Иерусалима
  alternative: чтобы сыны Израиля могли хвалиться и чтобы Иерусалим был возвеличен
  rationale: Выбранный вариант сохраняет общественный аспект чести и метафору возвышения, но не придаёт слову καύχημα обязательно отрицательного оттенка хвастовства.
- issue: Значение προσκυνέω
  choice: она поклонилась Богу
  alternative: она пала ниц перед Богом / она поклонилась Богу как акт поклонения
  rationale: Текст ясно указывает на благоговейный жест, но не уточняет точную позу; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формы «да дарует» и «да доведёт» сохраняют молитвенно-благословительный характер фразы; синтаксис упрощён лишь настолько, чтобы оставаться ясным обычному читателю.
