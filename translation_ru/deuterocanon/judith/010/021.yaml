lexical_decisions:
- source_word: ἀναπαυόμενος
  choice: возлежал
  rationale: Причастие обозначает пребывание в покое, лёжа или полулёжа; «возлежал» естественно передаёт позу в торжественно описанной обстановке, не уточняя её сверх греческого текста.
- source_word: κλίνης
  choice: постели
  rationale: κλίνη может означать ложе, кровать или кушетку; в контексте личных покоев и покрывала «постель» звучит ясно и естественно.
- source_word: κωνωπίῳ
  choice: пологом
  rationale: Слово обозначает сетчатое либо тканевое покрытие над ложем, первоначально также защищавшее от комаров. «Полог» сохраняет предметную неопределённость и соответствует роскошному оформлению; более узкие варианты даны в сноске.
- source_word: πορφύρας
  choice: пурпура
  rationale: Существительное указывает на дорогой пурпурный материал или ткань; «пурпур» сохраняет вещественное и статусное значение.
- source_word: χρυσίου
  choice: золота
  rationale: Это прямое обозначение золота; уточнение «золотые нити» возможно по контексту ткачества, но отсутствует в самом тексте.
- source_word: σμαράγδου
  choice: с изумрудами
  rationale: Обычное значение — изумруд или изумрудный материал. Предлог «с» по-русски позволяет естественно описать включённые в ткань камни, не создавая неуклюжего представления, будто полог целиком выткан из камней.
- source_word: λίθων πολυτελῶν
  choice: драгоценными камнями
  rationale: πολυτελής подчёркивает высокую стоимость и роскошь; устойчивое русское сочетание «драгоценные камни» точно и понятно передаёт смысл.
- source_word: καθυφασμένων
  choice: вытканным
  rationale: Причастие описывает включение перечисленных дорогих материалов в тканую отделку. «Вытканным» ближе к греческому, чем более специальное «вышитым».
