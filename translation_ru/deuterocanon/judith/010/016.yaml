review_pass:
  verdict: revise
  source_fidelity: Начальное ἐὰν δέ — условное «но если», а не временно-ожидаемое «но когда». В κατὰ τὰ ῥήματά σου речь идёт о сообщении в соответствии с её словами; «всё так, как задумала» добавляет отсутствующие в греческом «всё» и «задумала».
  naturalness: «Предстанешь перед ним», «не бойся в сердце своём» и «он хорошо с тобой обойдётся» понятны и уместны в современном литературном библейском регистре. «Сообщи так, как говорила» звучит естественно и не вводит замысел, которого в тексте нет.
  terminology: Специальных богословских терминов и имён нет. «Сообщи» хорошо передаёт ἀνάγγειλον в данном контексте.
  issues:
  - severity: medium
    issue: «Когда» вместо «если»
    rationale: ἐὰν образует условное придаточное. Хотя встреча ожидается контекстом, исходная условность должна быть сохранена.
  - severity: medium
    issue: «Всё так, как задумала»
    rationale: Формулировка добавляет к τὰ ῥήματά σου понятия полноты и заранее задуманной речи. Греческий текст говорит о её словах, не о её намерении.
  revised_text: Но если предстанешь перед ним, не бойся в сердце своём, а сообщи так, как говорила, и он хорошо с тобой обойдётся.
