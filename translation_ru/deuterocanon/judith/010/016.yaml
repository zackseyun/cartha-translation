translation:
  language: ru
  text: Но если предстанешь перед ним, не бойся в сердце своём, а сообщи так, как говорила, и он хорошо с тобой обойдётся.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν δὲ στῇς ἐναντίον αὐτοῦ
  choice: Но когда предстанешь перед ним
  rationale: Греческое условное выражение буквально означает «если же встанешь перед ним». В данном напутствии естественное русское «когда предстанешь» передаёт ожидаемую встречу, не меняя сути условия.
- source_word: μὴ φοβηθῇς τῇ καρδίᾳ σου
  choice: не бойся в сердце своём
  rationale: Сохранён образ сердца как внутреннего средоточия страха; формулировка звучит понятно и достойно в современном литературном русском.
- source_word: ἀνάγγειλον
  choice: передай
  rationale: Глагол означает «сообщи, возвести, доложи». «Передай» естественно в контексте словесного сообщения и не добавляет официальности, которой греческий текст прямо не требует.
- source_word: κατὰ τὰ ῥήματά σου
  choice: всё так, как задумала
  rationale: 'Буквально: «согласно твоим словам». В контексте это указание изложить намеченную ею речь; выбранная формулировка передаёт смысл, избегая неестественного русского оборота «согласно твоим словам».'
- source_word: εὖ σε ποιήσει
  choice: он хорошо с тобой обойдётся
  rationale: Идиома буквально значит «сделает тебе хорошо»; русский эквивалент ясно передаёт благосклонное обращение.
