lexical_decisions:
- source_word: ἐξῆλθον
  choice: вышли
  rationale: Аорист ἐξέρχομαι прямо обозначает движение наружу; «вышли» естественно передаёт это действие в русском повествовании.
- source_word: οἱ παρακαθεύδοντες Ὀλοφέρνῃ
  choice: те, кто находился при Олоферне
  rationale: Причастие παρακαθεύδοντες буквально может обозначать спавших или лежавших рядом, однако в военно-дворцовом контексте, вероятно, указывает на людей, постоянно находившихся поблизости и прислуживавших Олоферну. Нейтральное «находился при» передаёт близость и функцию, не создавая у современного читателя необоснованного впечатления интимности; буквальная возможность сохранена в сноске.
- source_word: θεράποντες
  choice: слуги
  rationale: θεράπων обозначает слугу или прислужника. «Слуги» — ясное и естественное соответствие в данном контексте.
- source_word: εἰσήγαγον
  choice: ввели
  rationale: εἰσάγω значит «вводить, приводить внутрь». «Ввели» точно передаёт направленное движение в шатёр и конструкцию с прямым дополнением.
- source_word: σκηνήν
  choice: шатёр
  rationale: σκηνή означает палатку или шатёр. В военном лагере «шатёр» естественно обозначает жилище военачальника и сохраняет прямой предметный смысл слова.
