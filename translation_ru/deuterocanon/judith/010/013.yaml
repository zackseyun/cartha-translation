review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: Иудифь идёт к Олоферну, намерена сообщить ему истинные сведения и обещает указать путь завоевания горной области без потерь. Однако заключительный русский оборот «не будет недоставать ни одного тела» семантически и стилистически неудачен: он буквально калькирует трудную греческую формулу, но не создаёт ясного русского высказывания. Смысловой перевод в основном тексте с примечанием лучше сохраняет и смысл, и необычную образность оригинала.'
  naturalness: Требуется правка. «Главнокомандующему вашим войском» допускает прочтение творительного как управления войском; родительный «главнокомандующему вашего войска» яснее передаёт генитив оригинала. «Нагорная страна» возможно, но «горная страна» естественнее в современном литературном русском. Заключительная фраза должна быть перестроена.
  terminology: «Олоферн» — устоявшаяся русская передача имени. «Главнокомандующий», «войско», «слова истины» и «горная страна» соответствуют военному и возвышенному регистру. В примечании следует говорить об образном телесном обороте без неподтверждённого утверждения, что он одновременно «буквальный и образный».
  issues:
  - severity: medium
    issue: Неестественная и смыслово неясная конструкция в заключительной части
    rationale: Фраза «среди его людей не будет недоставать ни одного тела, ни одного дыхания жизни» не является нормативно ясным современным русским способом сказать об отсутствии потерь. Греческое σὰρξ μία οὐδὲ πνεῦμα ζωῆς — намеренно яркий телесный оборот; его общий смысл можно передать в тексте, сохранив буквальную образность в сноске.
  - severity: low
    issue: Неоднозначное управление при «главнокомандующему вашим войском»
    rationale: Родительный «главнокомандующему вашего войска» точнее отражает ἀρχιστρατήγου δυνάμεως ὑμῶν и исключает побочное прочтение творительного как средства управления.
  - severity: low
