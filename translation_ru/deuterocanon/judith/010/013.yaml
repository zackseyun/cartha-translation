base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/013.yaml
  text: And I am coming into the presence of Holofernes[a], the commander-in-chief of your forces, to announce words of truth, and I will show before him the way by which he will go and gain mastery over all the hill country, and not one flesh of his men, nor a breath of life, will be lacking.
translation:
  language: ru
  text: А я иду к Олоферну, главнокомандующему вашего войска, чтобы возвестить слова истины. Я покажу ему путь, которым он пойдёт и овладеет всей горной страной, и ни один из его людей не погибнет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ни одна плоть и ни одно дыхание жизни не будут отсутствовать». Это яркий телесный оборот, выражающий отсутствие потерь среди его людей.'
    reason: Основной текст естественно передаёт общий смысл трудной греческой формулы, а примечание сохраняет её телесную образность и не выдаёт частный способ толкования за буквальный русский синтаксис.
lexical_decisions:
- source_word: κἀγὼ ἔρχομαι εἰς τὸ πρόσωπον Ὀλοφέρνου
  choice: А я иду к Олоферну
  rationale: Настоящее время передаёт непосредственность речи. Греческий оборот εἰς τὸ πρόσωπον обозначает прибытие к кому-либо, в его присутствие; по-русски естественно сказать «иду к Олоферну».
- source_word: ἀρχιστρατήγου δυνάμεως ὑμῶν
  choice: главнокомандующему вашим войском
  rationale: ἀρχιστράτηγος обозначает верховного военачальника, а δύναμις в данном военном контексте — войско.
- source_word: τοῦ ἀναγγεῖλαι ῥήματα ἀληθείας
  choice: чтобы сообщить слова истины
  rationale: Инфинитив выражает цель. Формулировка «слова истины» сохраняет торжественный генитивный оборот оригинала, не сводя его просто к «правдивым словам».
- source_word: δείξω πρὸ προσώπου αὐτοῦ ὁδὸν
  choice: Я укажу ему путь
  rationale: Буквальное «покажу перед его лицом путь» в современном русском неестественно; дательный «ему» ясно передаёт адресата действия и сохраняет образ пути.
- source_word: καθʼ ἣν πορεύσεται καὶ κυριεύσει
  choice: по которому он пойдёт и овладеет
  rationale: Сохранены последовательность движения по пути и последующее установление власти в военном контексте.
- source_word: πάσης τῆς ὀρινῆς
  choice: всей нагорной страной
  rationale: Субстантивированное ὀρινή обозначает гористую, возвышенную область; «нагорная страна» соответствует географическому и библейскому контексту.
- source_word: οὐ διαφωνήσει
  choice: не будет недоставать
  rationale: 'Хотя основной спектр διαφωνέω включает расхождение и несогласие, здесь сочетание с частями живого человека выражает отсутствие утраты: никто и ничто жизненное не окажется недостающим.'
- source_word: σὰρξ μία οὐδὲ πνεῦμα ζωῆς
  choice: ни одного тела, ни одного дыхания жизни
  rationale: «Тело» естественно передаёт буквальное σάρξ в счётном обороте, а «дыхание жизни» сохраняет конкретный жизненный образ πνεῦμα ζωῆς. Необычный параллелизм оригинала намеренно не сведён к простому «никто не погибнет».
theological_decisions:
- issue: Значение σάρξ в буквальном, не павловском военном контексте
  choice: тело
  alternative: плоть
  rationale: Речь идёт не о богословском противопоставлении плоти и духа, а о телесной сохранности воинов. В русском «ни одного тела» передаёт предметный смысл и счётную конструкцию естественнее, чем «ни одной плоти».
- issue: Соотношение σάρξ и πνεῦμα ζωῆς в заключительной фразе
  choice: сохранить оба телесно-жизненных образа
  alternative: обобщить как «ни один из его людей не погибнет»
  rationale: Обобщение яснее, но устраняет выразительное и несколько загадочное напряжение греческой формулировки. Основной текст сохраняет оба элемента, а сноска поясняет общий смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис разделён на два предложения ради ясности; военная терминология понятна обычному читателю. Необычная заключительная образность греческого текста сохранена и пояснена сноской.
