lexical_decisions:
- source_word: ὡς δὲ ἤκουσαν
  choice: Когда ... услышали
  rationale: ὡς с аористом вводит временное придаточное; русское «когда» естественно передаёт последовательность, не подчёркивая немедленности.
- source_word: οἱ ἄνδρες
  choice: мужчины
  rationale: ἄνδρες буквально означает мужчин; контекст позволяет понимать их как стражников, но в самом стихе это не уточняется.
- source_word: τὰ ῥήματα αὐτῆς
  choice: её слова
  rationale: ῥήματα обозначает произнесённые слова; прямой русский эквивалент звучит естественно.
- source_word: κατενόησαν
  choice: внимательно всмотрелись
  rationale: κατανοέω выражает пристальное, внимательное наблюдение; при объекте «лицо» глагол «всмотреться» передаёт это точнее, чем нейтральное «увидеть».
- source_word: τὸ πρόσωπον αὐτῆς
  choice: её лицо
  rationale: πρόσωπον здесь естественно и конкретно передаётся словом «лицо», без расширения до общего облика.
- source_word: ἦν ἐναντίον αὐτῶν
  choice: показалась им
  rationale: Буквальное «была перед ними» в сочетании с оценкой красоты неестественно по-русски; «показалась им» сохраняет значение восприятия в их присутствии и с их точки зрения.
- source_word: θαυμάσιον τῷ κάλλει σφόδρα
  choice: необычайно прекрасной
  rationale: Оборот буквально характеризует её как чрезвычайно удивительную по красоте. Сжатая русская формулировка естественно передаёт сильное восхищение, а подробная форма отражена в примечании.
