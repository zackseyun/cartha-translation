lexical_decisions:
- source_word: Καὶ ἐγένετο ὡς
  choice: И когда
  rationale: Греческая повествовательная формула вводит следующее действие и вместе с ὡς задаёт временное придаточное. В современном русском буквальное «и случилось, когда» здесь тяжеловесно; «И когда» естественно сохраняет связь с последующим главным предложением.
- source_word: ἐπαύσατο βοῶσα
  choice: перестала взывать
  rationale: ἐπαύσατο обозначает прекращение действия, а βοῶσα — настойчивое, громкое обращение. «Перестала взывать» передаёт напряжённость молитвы и звучит естественно в литературном русском.
- source_word: πρὸς τὸν θεὸν Ἰσραὴλ
  choice: к Богу Израиля
  rationale: Сохраняется традиционный библейский титул и направленность обращения, выраженная πρός.
- source_word: συνετέλεσεν
  choice: окончила
  rationale: Глагол означает довести до конца, завершить. «Окончила» хорошо сочетается с «слова» и не повторяет «перестала».
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: все эти слова
  rationale: Формальная передача сохраняет явную связь с предшествующей молитвой и соответствует библейской речевой формуле.
theological_decisions:
- issue: Передача θεὸν Ἰσραὴλ
  choice: Богу Израиля
  alternative: Богу израильтян
  rationale: «Бог Израиля» сохраняет форму титула, его библейское и заветное звучание, не сводя «Израиль» только к обозначению группы людей.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Стих оставлен синтаксически незавершённым запятой, поскольку в греческом это временное придаточное, главное действие которого следует далее.
