revisions:
- from: 'И они сказали ей: «Ты спасла свою жизнь, поспешив спуститься и предстать перед нашим господином. Теперь подойди к его шатру, и люди из нашего отряда проводят тебя, пока не передадут в его руки[a]».'
  to: 'И они сказали ей: «Ты спасла свою жизнь, поспешив спуститься и предстать перед нашим господином. Теперь подойди к его шатру, и некоторые из нас будут сопровождать тебя, пока не передадут в его руки[a]».'
  rationale: Убрано не имеющее опоры в греческом уточнение «из нашего отряда». «Некоторые из нас будут сопровождать тебя» передаёт множественное число προπέμψουσιν, выражение ἀφʼ ἡμῶν и значение «проводить, сопровождать». Остальные решения сохраняются как точные и стилистически уместные.
