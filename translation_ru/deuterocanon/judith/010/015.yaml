base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/015.yaml
  text: And they said to her[a], “You have saved your life by hurrying down into the presence of our lord. And now come to his tent[b], and some from among us will escort you until they hand you over into his hands.”
translation:
  language: ru
  text: 'И они сказали ей: «Ты спасла свою жизнь, поспешив спуститься и предстать перед нашим господином. Теперь подойди к его шатру, и некоторые из нас будут сопровождать тебя, пока не передадут в его руки[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «В его руки» — то есть в его распоряжение или под его власть.
    reason: lexical_alternative
lexical_decisions:
- source_word: Σέσωκας τὴν ψυχήν σου
  choice: Ты спасла свою жизнь
  rationale: Перфект σῴζω с ψυχή здесь означает сохранение жизни. Русское «спасла свою жизнь» прямо передаёт смысл и сохраняет результативность действия.
- source_word: σπεύσασα καταβῆναι
  choice: поспешив спуститься
  rationale: Аористное причастие выражает сопутствующее обстоятельство или средство; такая конструкция естественна по-русски и сохраняет направление движения вниз.
- source_word: εἰς πρόσωπον τοῦ κυρίου ἡμῶν
  choice: предстать перед нашим господином
  rationale: Греческий оборот означает явиться в присутствие лица. «Предстать перед» естественно передаёт официальный оттенок, а «господином» ясно указывает на человеческого начальника.
- source_word: πρόσελθε ἐπὶ τὴν σκηνὴν αὐτοῦ
  choice: подойди к его шатру
  rationale: В военном контексте σκηνή — шатёр; πρόσελθε с ἐπί здесь обозначает приближение к нему.
- source_word: ἀφʼ ἡμῶν προπέμψουσίν σε
  choice: люди из нашего отряда проводят тебя
  rationale: Форма третьего лица множественного числа вместе с ἀφʼ ἡμῶν подразумевает людей из числа говорящих. «Проводят» передаёт значение сопровождения у προπέμπω, не создавая впечатления, будто пойдут все.
- source_word: ἕως παραδῶσίν σε εἰς χεῖρας αὐτοῦ
  choice: пока не передадут в его руки
  rationale: Сохранён конкретный греческий образ передачи во власть или под попечение другого лица; в русском этот оборот также понятен идиоматически.
theological_decisions:
- issue: Передача κύριος применительно к человеческому военачальнику
  choice: наш господин
  alternative: наш повелитель
  rationale: Контекст указывает на человеческого начальника, а не на Бога. Строчная буква и слово «господин» сохраняют социальный титул без божественных коннотаций.
- issue: Смысл выражения «передать в его руки»
  choice: сохранить образ без уточнения характера власти
  alternative: передать под его власть
  rationale: Греческий оборот может подразумевать власть, распоряжение или охрану. Буквально понятный русский образ сохраняет эту смысловую широту и напряжённость сцены.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. «Шатёр» соответствует военной обстановке; синтаксис реплики остаётся ясным для современного читателя.
