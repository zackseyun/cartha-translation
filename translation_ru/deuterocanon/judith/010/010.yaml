  yaml_path: translation/deuterocanon/judith/010/010.yaml
  text: And they did so. Then Judith went out[a], she and her maid with her; and the men of the city kept watching her until she went down the mountain, until she passed through the valley, and they could no longer see her.
translation:
  language: ru
  text: Они так и сделали. Юдифь вышла вместе со своей служанкой. Мужчины города провожали её взглядом, пока она не спустилась с горы, пока не прошла через долину[a], и больше не видели её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ущелье» или «горный проход» (греч. αὐλών).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησαν οὕτως
  choice: они так и сделали
  rationale: Естественно передаёт повествовательное подтверждение совершённого действия, сохраняя смысл греческого оборота.
- source_word: ἐξῆλθεν
  choice: вышла
  rationale: Прямой и естественный глагол движения в данном контексте.
- source_word: παιδίσκη
  choice: служанка
  rationale: Обозначает личную прислужницу Юдифи; современное слово ясно передаёт её зависимое положение без ненужной архаики.
- source_word: ἀπεσκόπευον
  choice: провожали её взглядом
  rationale: Передаёт продолженное наблюдение, выраженное имперфектом, и естественно сочетается с последующим исчезновением Юдифи из виду.
- source_word: οἱ ἄνδρες τῆς πόλεως
  choice: мужчины из города
  rationale: Сохраняет указание на мужчин, не заменяя его более общим словом «жители».
- source_word: ἕως οὗ κατέβη τὸ ὄρος
  choice: пока она не спустилась с горы
  rationale: Естественно передаёт движение вниз и первый пространственный рубеж наблюдения.
- source_word: αὐλών
  choice: долина
  rationale: Широкий и контекстуально уместный эквивалент; возможные более узкие топографические значения сохранены в примечании.
- source_word: οὐκ ἔτι ἐθεώρουν αὐτήν
  choice: после этого они уже не могли её видеть
  rationale: Ясно передаёт прекращение зрительного восприятия; «не могли» естественно выражает исчезновение из поля зрения, не предполагая намеренного прекращения наблюдения.
