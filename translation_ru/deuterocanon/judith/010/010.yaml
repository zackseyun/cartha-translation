revisions:
- from: Они так и сделали. Юдифь вышла — сама, и с нею её служанка. Мужчины из города провожали её взглядом, пока она не спустилась с горы и не прошла через долину[a]; после этого они уже не могли её видеть.
  to: Они так и сделали. Юдифь вышла вместе со своей служанкой. Мужчины города провожали её взглядом, пока она не спустилась с горы, пока не прошла через долину[a], и больше не видели её.
  rationale: Правка устраняет неестественный синтаксис, воспроизводит повтор двух пространственно-временных пределов в греческом повествовании и передаёт прекращение зрительного восприятия без лишней модальности. Топографическая неоднозначность αὐλών сохранена в сноске.
