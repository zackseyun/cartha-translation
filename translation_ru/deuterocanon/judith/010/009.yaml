review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно передаёт распоряжение открыть городские ворота, намерение Иудифи выйти, последующее распоряжение юношам и грамматическое множественное число в καθὼς ἐλάλησαν. Однако «довести до исполнения слова, о которых вы говорили» не вполне естественно по-русски и несколько механически воспроизводит греческое λόγοι. «Довести до конца то, о чём вы говорили со мной» сохраняет значение εἰς τελείωσιν и разговорный референт λόγοι без неоправданной конкретизации.
  naturalness: «Как и говорили» в конце возможно, но без явно выраженного субъекта звучит обрывочно и допускает неудачное прочтение. «Как они и говорили» естественно в современном литературном русском и сохраняет множественное число греческого глагола. Также замена «слова, о которых вы говорили» на «то, о чём вы говорили» делает фразу идиоматичной.
  terminology: Имя Иудифь в сноске, «юноши», «городские ворота» и глаголы распоряжения выбраны уместно. Специальная богословская терминология в стихе отсутствует.
