    rationale: В русском «довести до исполнения» обычно относится к замыслу, решению или намерению, а не к «словам»; относительное «о которых говорили» также создаёт тяжеловесную тавтологию. Греческие λόγοι в данном контексте допускают естественную передачу как «то, о чём вы говорили».
  - severity: low
    issue: 'В заключении не назван субъект глагола: «как и говорили».'
    rationale: Греческое ἐλάλησαν стоит во множественном числе. Добавление «они» делает русский текст яснее, не устраняя намеренно сохранённую в сноске смысловую неопределённость отсылки.
