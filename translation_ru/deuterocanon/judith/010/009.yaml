  text: And she said to them[a], “Order the gate of the city to be opened for me, and I will go out for the fulfillment of the words that you spoke with me.” So they instructed the young men to open it for her, just as she had said.
translation:
  language: ru
  text: 'И она сказала им: «Прикажите открыть мне городские ворота, и я выйду, чтобы довести до конца то, о чём вы говорили со мной». Тогда они велели юношам открыть ей ворота, как они и говорили[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как они говорили». Эта фраза может относиться либо к только что высказанной просьбе Иудифи, либо к тому, что они ранее обсуждали с ней.'
    reason: В греческом тексте глагол стоит во множественном числе, а смысловая отсылка фразы остаётся неоднозначной.
lexical_decisions:
- source_word: Ἐπιτάξατε
  choice: Прикажите
  rationale: Аористный императив передаёт властное распоряжение руководителей; «прикажите» естественно и сохраняет силу греческого глагола.
- source_word: ἀνοῖξαί μοι τὴν πύλην τῆς πόλεως
  choice: открыть мне городские ворота
  rationale: Естественная русская конструкция после «прикажите»; «городские ворота» точно и идиоматично передаёт πύλη τῆς πόλεως.
- source_word: ἐξελεύσομαι
  choice: я выйду
  rationale: Прямо передаёт будущее действие — выход из города.
- source_word: εἰς τελείωσιν τῶν λόγων
  choice: чтобы довести до исполнения слова
  rationale: Сохраняет значение завершения или исполнения и лексическую связь с λόγοι, не сводя выражение лишь к абстрактному «плану».
- source_word: ὧν ἐλαλήσατε μετʼ ἐμοῦ
  choice: о которых вы говорили со мной
  rationale: Предлог μετά указывает на разговор с Иудифью; формулировка сохраняет взаимный характер обсуждения.
- source_word: συνέταξαν
  choice: велели
  rationale: Передаёт распоряжение подчинённым и избегает тяжеловесного повторения «приказали».
- source_word: τοῖς νεανίσκοις
  choice: юношам
  rationale: Точное и уместное в повествовательном регистре обозначение молодых мужчин.
- source_word: ἀνοῖξαι αὐτῇ
  choice: открыть ей ворота
  rationale: В русском повтор существительного устраняет неясность местоимения и естественно передаёт дательный αὐτῇ.
- source_word: καθὼς ἐλάλησαν
  choice: как и говорили
  rationale: Сохраняет множественное число греческого глагола и не вводит отсутствующее в тексте прямое указание на Иудифь; возможная соотнесённость выражения пояснена в сноске.
