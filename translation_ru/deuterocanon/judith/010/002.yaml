lexical_decisions:
- source_word: ἀνέστη ἀπὸ τῆς πτώσεως
  choice: поднялась, перестав лежать ниц
  rationale: πτῶσις буквально может обозначать падение, но контекст молитвы указывает на положение распростёртого ниц человека. Такой перевод естественно передаёт и движение, и молитвенную позу, не изображая случайного падения.
- source_word: ἐκάλεσεν
  choice: позвала
  rationale: Обычное повествовательное значение глагола; «призвала» или «приказала явиться» было бы излишне торжественно или сильно.
- source_word: τὴν Ἄβραν αὐτῆς
  choice: свою служанку
  rationale: ἅβρα — редкое обозначение молодой служанки или личной прислужницы. Несмотря на прописную букву в издании Swete и возможность понять форму как имя Авра, конструкция естественно означает служанку Иудифи; добавлять одновременно должность и предполагаемое имя текст не требует.
- source_word: κατέβη εἰς τὸν οἶκον
  choice: спустилась в дом
  rationale: Сохраняются направленное движение вниз и вход внутрь дома.
- source_word: ἐν ᾧ διέτριβεν
  choice: где проводила время
  rationale: Имперфект διατρίβω указывает на привычное пребывание; выражение не обязательно означает постоянное проживание.
- source_word: ἐν ταῖς ἡμέραις τῶν σαββάτων
  choice: по субботам
  rationale: Естественная русская передача греческого множественного оборота, обозначающего повторяющееся соблюдение суббот.
- source_word: ἐν ταῖς ἑορταῖς αὐτῆς
  choice: в праздничные дни
  rationale: Передаёт дни религиозных праздников; местоимение указывает на праздники, соблюдавшиеся Иудифью, а не обязательно на лично принадлежавшие ей торжества.
theological_decisions:
- issue: Характер положения Иудифи в выражении ἀπὸ τῆς πτώσεως
  choice: перестав лежать ниц
  alternative: после своего падения / с земли
  rationale: В ближайшем контексте Иудифь молилась, пав ниц, поэтому вероятнее намеренная молитвенная поза, а не случайное падение. Сноска сохраняет более буквальную лексическую возможность.
- issue: «Её праздники» как личные или соблюдаемые ею дни
  choice: праздничные дни
  alternative: дни её праздников
  rationale: Речь идёт о религиозном календаре, которого она придерживалась. Буквальное «её праздники» на современном русском могло бы ошибочно означать её личные торжества.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранены пространственное движение вниз, привычный характер пребывания и религиозный контекст; буквальные греческие обороты пояснены в сносках без ненужной архаизации.
