    reason: lexical_alternative
lexical_decisions:
- source_word: ἅβρᾳ
  choice: служанке
  rationale: Слово обозначает женскую прислугу или личную сопровождающую Иудифи; «служанка» естественно для повествования и не уточняет правовой статус сверх текста.
- source_word: ἀσκοπυτίνην οἶνον
  choice: бурдюк вина
  rationale: Сложное существительное указывает на переносной кожаный сосуд; «бурдюк вина» кратко и ясно передаёт и ёмкость, и её содержимое.
- source_word: καψάκην ἐλαίου
  choice: сосуд с маслом
  rationale: Редкое существительное обозначает небольшую переносную ёмкость. Нейтральное «сосуд» не вводит неподтверждённую форму тары.
- source_word: πῆραν
  choice: суму
  rationale: Это дорожная сумка для припасов; «сума» сохраняет исторический колорит, оставаясь понятным литературным словом.
- source_word: ἀλφίτων
  choice: ячменной мукой
  rationale: Множественное число ἄλφιτα обозначает ячменную крупу или муку, обычно из обжаренного зерна. В перечне припасов «ячменная мука» звучит естественно и передаёт основной предметный смысл.
- source_word: παλάθης
  choice: лепёшками из прессованного инжира
  rationale: Слово обозначает спрессованные массы или лепёшки из инжира; перевод делает состав и способ приготовления понятными.
- source_word: ἄρτων καθαρῶν
  choice: чистыми хлебами
  rationale: Буквальное определение «чистые» сохраняет возможный оттенок ритуальной или пищевой чистоты, не сводя его только к обрядовому значению.
- source_word: περιεδίπλωσε
  choice: завернула
  rationale: Глагол выражает складывание или обёртывание вокруг; «завернула» близко к образу исходного текста и естественно в контексте сборов.
- source_word: τὰ ἄγγη αὐτῆς
  choice: все свои сосуды
  rationale: ἄγγη — широкое обозначение сосудов и ёмкостей; «сосуды» сохраняет эту обобщённость.
- source_word: ἐπέθηκε αὐτῇ
  choice: возложила всё это на неё
  rationale: Местоимение естественно относится к служанке. Перевод не добавляет отсутствующих в греческом тексте указаний на плечи или спину.
theological_decisions:
- issue: Оттенок чистоты в ἄρτων καθαρῶν
  choice: чистыми хлебами
  alternative: ритуально чистым хлебом; чистым хлебом
  rationale: καθαρός может указывать как на чистоту вообще, так и на пригодность пищи согласно требованиям чистоты. Основной текст сохраняет более широкую формулировку, а примечание сообщает вероятный ритуальный оттенок без его догматического закрепления.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской повествовательной интонацией. «Сума» и «возложила» поддерживают достоинство регистра, не делая синтаксис архаичным; редкие названия ёмкостей переданы понятными родовыми словами там, где исходный текст не позволяет уверенно установить их точную форму.
