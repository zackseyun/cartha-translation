  text: And she gave her maid a skin of wine and a flask of oil[a], and she filled a bag with barley meal and cakes of pressed figs and clean loaves; then she wrapped up all her vessels and placed them on her.
translation:
  language: ru
  text: И дала она своей служанке бурдюк вина и сосуд с маслом, наполнила суму ячменной мукой, лепёшками из прессованного инжира и чистыми хлебами[a], затем завернула все свои сосуды и возложила их на неё.
