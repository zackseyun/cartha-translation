base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/003.yaml
  text: And she took off the sackcloth that she had been wearing[a], and removed the garments of her widowhood. She washed her body with water and anointed herself with rich perfume, arranged the hair of her head, put a headband on it, and put on her festive garments, with which she used to adorn herself during the days of her husband Manasseh’s life[c][b];
translation:
  language: ru
  text: Она сняла с себя вретище, которое носила, и сняла одежды своего вдовства. Затем она омыла тело водой, умастилась густой благовонной мазью[a], уложила волосы, надела на голову повязку[b] и облачилась в свои праздничные одежды, которыми украшала себя при жизни своего мужа Манассии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «насыщенной благовонной мазью». Греческое прилагательное буквально означает «густой», но в данном выражении может также передавать представление о насыщенности или роскоши ароматической мази.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «головной убор»; греческое слово может обозначать повязку, тюрбан или иной головной убор.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιείλατο τὸν σάκκον ὃν ἐνεδύκει
  choice: сняла с себя вретище, в которое была одета
  rationale: Средний залог указывает на снятие с себя; «вретище» сохраняет библейское и культурное значение одежды скорби, а конструкция передаёт предшествующее состояние.
- source_word: ἐξεδύσατο τὰ ἱμάτια τῆς χηρεύσεως αὐτῆς
  choice: сняла одежды своего вдовства
  rationale: Формулировка сохраняет явный генитивный образ и подчёркивает переход от внешних знаков вдовства к праздничному убранству.
- source_word: περιεκλύσατο τὸ σῶμα ὕδατι
  choice: омыла тело водой
  rationale: «Омыла» естественно и достаточно точно передаёт телесное омовение, не уточняя способ сверх греческого текста.
- source_word: ἔχρισατο μύρῳ παχεῖ
  choice: умастилась благовонной мазью
  rationale: Глагол передаёт нанесение умащения, μύρον — ароматическое масло или мазь; значение παχεῖ как густого или насыщенного вещества отражено в сноске, чтобы не создавать неестественное основное выражение.
- source_word: διέταξε τὰς τρίχας τῆς κεφαλῆς αὐτῆς
  choice: уложила волосы
  rationale: Передаёт приведение волос в порядок без добавления не названного в тексте способа, например расчёсывания.
- source_word: ἐπέθετο μίτραν ἐπʼ αὐτῆς
  choice: надела на голову повязку
  rationale: μίτρα обозначает головную повязку или убор; «повязка» сохраняет осторожность и не навязывает конкретную форму тюрбана.
- source_word: τὰ ἱμάτια τῆς εὐφροσύνης αὐτῆς
  choice: свои праздничные одежды
  rationale: В контексте εὐφροσύνη обозначает радость и празднество; выражение естественно противопоставлено одеждам вдовства.
- source_word: ἐν αἷς ἐστολίζετο
  choice: которыми украшала себя
  rationale: Сохраняет значение украшения и обычное повторявшееся действие в прошлом.
- source_word: ἐν ταῖς ἡμέραις τῆς ζωῆς τοῦ ἀνδρὸς αὐτῆς Μανασσή
  choice: при жизни своего мужа Манассии
  rationale: Идиоматический русский эквивалент буквального «в дни жизни её мужа Манассии», полностью сохраняющий временной смысл.
theological_decisions:
- issue: Образы вдовства и скорби
  choice: Сохранены отдельные упоминания вретища и одежд вдовства.
  alternative: Обобщить как «траурные одежды».
  rationale: Греческий текст последовательно называет два элемента и тем самым подчёркивает переход Иудифи от состояния скорби к намеренному праздничному убранству; обобщение ослабило бы эту повествовательную деталь.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейской лексикой: «вретище», «омыла», «умастилась», «облачилась». Синтаксис сделан плавным и доступным, при этом сохранены повтор снятия одежды и контраст между вдовством и праздником.'
