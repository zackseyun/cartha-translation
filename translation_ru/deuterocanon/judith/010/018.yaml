  source_fidelity: В черновике верно переданы военный стан, распространение вести по шатрам, прибытие/появление женщины и её окружение. Однако «по всему стану» расширяет греч. ἐν τῇ παρεμβολῇ, а «ждала, когда ему доложат» добавляет действие и переносит временной предел с действий людей на ожидание Иудифи. В оригинале именно пришедшие окружали её до тех пор, пока не сообщили Олоферну о ней.
  naturalness: «Сбежались люди по всему стану» звучит как описание перемещения людей по лагерю, а не как возникшее в лагере скопление. Исправленная фраза сохраняет плавный современный литературный русский и ясные соотнесённые действия.
  terminology: «Стан», «шатры», «Олоферн» и «обступили» уместны. «Вне шатра» точно передаёт ἔξω и избегает более узкого оттенка «перед шатром» (у входа). Сноска об альтернативе παρουσία и голосовом распространении вести сохранена.
