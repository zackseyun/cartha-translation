revisions:
- from: И сбежались люди по всему стану, потому что в шатрах разнеслась весть о её прибытии[a]. Они пришли и обступили её, пока она стояла перед шатром Олоферна и ждала, когда ему доложат о ней.
  to: В стане поднялось движение, потому что по шатрам разнеслась весть о её прибытии[a]. Придя, они обступили её, когда она стояла вне шатра Олоферна, пока не сообщили ему о ней.
  rationale: Перевод исправлен для устранения невыраженного в оригинале ожидания Иудифи и для сохранения синтаксической связи временного оборота с действиями пришедших. «Поднялось движение» передаёт возникновение συνδρομή в стане без добавления направления «по всему стану» и без навязывания паники. Альтернатива «присутствие» и голосовой оттенок διεβοήθη сохранены в сноске.
  reviewer_model: gpt-5.6-terra
