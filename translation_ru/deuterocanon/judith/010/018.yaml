  text: And there was a rush in the camp[a], for her arrival was reported through the tents; and they came and gathered around her as she stood outside the tent of Holofernes, until they announced her to him.
translation:
  language: ru
  text: В стане поднялось движение, потому что по шатрам разнеслась весть о её прибытии[a]. Придя, они обступили её, когда она стояла вне шатра Олоферна, пока не сообщили ему о ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что по шатрам громко возвестили о её присутствии». Греческий глагол указывает на устное распространение вести, а παρουσία может означать как «присутствие», так и, в данном контексте, «прибытие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο συνδρομὴ
  choice: сбежались люди
  rationale: Передаёт буквальный образ совместного стремительного движения и возникшего скопления людей, не добавляя оттенка паники.
- source_word: παρεμβολή
  choice: стан
  rationale: В военном повествовании слово обозначает лагерь; «стан» сохраняет достоинство библейского повествования и остаётся понятным современному читателю.
- source_word: διεβοήθη
  choice: разнеслась весть
  rationale: Передаёт распространение известия по лагерю и подразумеваемое греческим глаголом устное оповещение естественным русским оборотом.
- source_word: τὰ σκηνώματα
  choice: шатры
  rationale: Обозначает шатровые жилища военного стана; «шатры» уместны для исторической обстановки.
- source_word: ἡ παρουσία αὐτῆς
  choice: о её прибытии
  rationale: В контексте речь идёт о появлении Иудифи в стане; при этом сноска сохраняет возможное буквальное значение «её присутствие».
- source_word: ἐκύκλουν αὐτὴν
  choice: обступили её
  rationale: Передаёт окружение собравшимися людьми без необязательного оттенка враждебности.
- source_word: ὡς ἱστήκει
  choice: пока она стояла
  rationale: Естественно передаёт продолженное состояние, на фоне которого совершаются остальные действия.
- source_word: ἔξω τῆς σκηνῆς Ὀλοφέρνου
  choice: перед шатром Олоферна
  rationale: «Перед шатром» естественно обозначает положение снаружи у входа; конструкция не утверждает, что Иудифь находилась внутри.
- source_word: ἕως προσήγγειλαν αὐτῷ περὶ αὐτῆς
  choice: и ждала, когда ему доложат о ней
  rationale: Передаёт временной предел ожидания и смысл сообщения начальнику о прибывшей женщине, хотя субъект ожидания в русском выражен яснее, чем в греческом.
