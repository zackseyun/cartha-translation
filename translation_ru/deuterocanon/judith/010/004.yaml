base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/004.yaml
  text: And she put sandals on her feet[a], and put on her anklets and bracelets and rings and earrings and all her jewelry; and she made herself very beautiful[b], to deceive the eyes of any men who might see her.
translation:
  language: ru
  text: Она надела на ноги сандалии, надела ножные браслеты, браслеты, кольца, серьги и всё своё убранство[a]; она всячески приукрасила себя, чтобы обмануть взоры мужчин, которые могли её увидеть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все свои украшения» или «весь свой наряд». Греческое κόσμος здесь означает убранство, украшения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «взоры всякого мужчины, который мог её увидеть». Греческое выражение имеет неопределённый, обобщающий смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλαβεν σανδάλια εἰς τοὺς πόδας αὐτῆς
  choice: обула ноги в сандалии
  rationale: Хотя ἔλαβεν буквально значит «взяла», в контексте надевания предметов одежды естественный русский эквивалент — «обула»; упоминание ног сохранено.
- source_word: περιέθετο
  choice: надела
  rationale: Средний залог обозначает, что Юдифь сама надевает на себя перечисленные украшения.
- source_word: χλιδῶνας
  choice: ножные браслеты
  rationale: В перечне конкретных украшений слово, вероятнее всего, обозначает украшения на щиколотках; «ножные браслеты» понятно современному читателю.
- source_word: ψέλια
  choice: запястья
  rationale: Здесь слово обозначает браслеты или украшения для рук. «Запястья» — традиционное и достаточно ясное название такого украшения, позволяющее отличить его от ножных браслетов.
- source_word: δακτυλίους
  choice: кольца
  rationale: Прямой и общеупотребительный эквивалент греческого названия колец.
- source_word: ἐνώτια
  choice: серьги
  rationale: Естественное современное обозначение ушных украшений.
- source_word: πάντα τὸν κόσμον αὐτῆς
  choice: все свои украшения
  rationale: κόσμος здесь означает убранство или украшения, а не «мир»; конкретное «украшения» соответствует ближайшему контексту.
- source_word: ἐκαλλωπίσατο σφόδρα
  choice: навела на себя необычайную красоту
  rationale: Передаёт намеренное самоубранство и усилительное σφόδρα, сохраняя возвышенный повествовательный регистр.
- source_word: εἰς ἀπάτησιν
  choice: чтобы обмануть
  rationale: Греческое существительное выражает цель и прямо обозначает обман; перевод не смягчает нравственную напряжённость повествования.
- source_word: ὀφθαλμῶν ἀνδρῶν
  choice: взоры ... мужчин
  rationale: «Взоры» естественно сохраняет образ глаз, не сводя выражение просто к привлечению внимания.
- source_word: ὅσοι ἂν ἴδωσιν αὐτήν
  choice: всех мужчин, которые её увидят
  rationale: 'ὅσοι ἄν с сослагательным наклонением имеет обобщённо-неопределённый смысл: речь обо всех, кому случится её увидеть.'
theological_decisions:
- issue: Нравственная цель украшения Юдифи
  choice: Прямо сказано, что она украсилась, чтобы обмануть мужские взоры.
  alternative: Можно было бы смягчить выражение как «привлечь» или «пленить взгляды».
  rationale: ἀπάτησις означает обман. Сохранение этого значения передаёт стратегическую цель Юдифи и не снимает заложенную в тексте нравственную напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Конкретный перечень украшений сохранён; синтаксис сделан плавным, а прямое указание на обман не смягчено.
