  terminology: «Приближённые» приемлемо для θεράποντες в данном придворно-военном контексте. «Поклонилась ему» верно передаёт προσκυνέω как жест почтения к человеку, не навязывая значения религиозного поклонения. Примечание уместно и привязано к нужному слову.
