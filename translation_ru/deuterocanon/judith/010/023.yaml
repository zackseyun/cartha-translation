  yaml_path: translation/deuterocanon/judith/010/023.yaml
  text: When Judith came before him and his attendants[a], they all marveled at the beauty of her face; and falling on her face, she bowed down to him, and they raised her up.
translation:
  language: ru
  text: Когда Иудифь вошла к нему и его приближённым, все они изумились красоте её лица. Она пала ниц и поклонилась ему[a], а они подняли её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оказала ему почтение». Греческий глагол может также означать «поклоняться», но здесь речь идёт о почтении, оказываемом человеческому правителю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ πρόσωπον αὐτοῦ
  choice: предстала перед ним
  rationale: Оборот означает прибытие в чьё-либо присутствие; «предстала перед ним» естественно передаёт придворную обстановку, не сводя выражение к буквальному положению лицом к лицу.
- source_word: θεραπόντων
  choice: приближёнными
  rationale: В контексте ставки военачальника слово обозначает состоящих при нём людей, слуг или сопровождающих. «Приближённые» сохраняет придворный оттенок и не привносит значения рабского статуса.
- source_word: ἐθαύμασαν
  choice: изумились
  rationale: Глагол выражает сильное удивление, здесь вызванное восхищением красотой Иудифи.
- source_word: κάλλει τοῦ προσώπου
  choice: красоте её лица
  rationale: Прямо передаёт как κάλλος («красота»), так и конкретное πρόσωπον («лицо»), не расширяя его до общего облика.
- source_word: πεσοῦσα ἐπὶ πρόσωπον
  choice: пала ниц
  rationale: Устойчивое современное выражение ясно и достойно передаёт буквальный жест падения лицом вниз.
- source_word: προσεκύνησεν αὐτῷ
  choice: поклонилась ему
  rationale: В обращении к человеческому правителю προσκυνέω обозначает почтительное преклонение, а не обязательно религиозное поклонение. Формулировка сохраняет жест и не навязывает богословского вывода.
- source_word: ἤγειραν αὐτὴν
  choice: её подняли
  rationale: Безлично-неопределённая конструкция естественно передаёт не названный прямо множественный субъект греческого глагола.
theological_decisions:
- issue: Значение προσκυνέω по отношению к человеческому правителю
  choice: поклонилась ему
  alternative: поклонилась ему как божеству; воздала ему почести
  rationale: Контекст встречи с военачальником указывает на придворное почтение. При этом примечание сохраняет более широкий лексический диапазон глагола, включая возможность значения «поклоняться» в иных контекстах.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. «Пала ниц» уместно передаёт торжественный придворный жест; порядок фраз остаётся ясным для широкого читателя. Маркер примечания поставлен непосредственно после спорного глагола, к которому относится пояснение.
