lexical_decisions:
- source_word: ὡς δὲ εἶδον αὐτήν
  choice: Когда же они увидели её
  rationale: ὡς с аористом вводит временное придаточное, а δέ служит лёгким повествовательным переходом; «когда же» естественно передаёт обе функции.
- source_word: ἦν ἠλλοιωμένον τὸ πρόσωπον αὐτῆς
  choice: её лицо преобразилось
  rationale: Сохранено конкретное значение πρόσωπον — «лицо». «Преобразилось» передаёт заметную перемену и звучит по-русски естественнее буквального пассивного оборота «было изменено».
- source_word: τὴν στολὴν μεταβεβληκυῖαν
  choice: одежда была переменена
  rationale: στολή здесь означает одежду или наряд; нейтральное «одежда» не сужает смысл до одной ризы. Пассивная формулировка передаёт результат предшествующей смены одежды.
- source_word: ἐθαύμασαν
  choice: изумились
  rationale: Глагол выражает сильное удивление, вызванное её красотой; «изумились» сохраняет силу реакции, не сводя её к простому восхищению.
- source_word: ἐπὶ τῷ κάλλει αὐτῆς
  choice: её красоте
  rationale: После глагола удивления ἐπί с дательным указывает на основание реакции; русский дательный при «изумились» передаёт это естественно.
- source_word: ἐπὶ πολὺ σφόδρα
  choice: чрезвычайно
  rationale: Сочетание содержит усиление высокой степени. «Чрезвычайно» передаёт его выразительно и без неестественного для русского нагромождения наречий.
