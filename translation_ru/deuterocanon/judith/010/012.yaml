base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/012.yaml
  text: And they seized her and asked her[a], “Who are you, and where are you coming from, and where are you going?” And she said, “I am a daughter of the Hebrews, and I am fleeing from before them[c][b], because they are about to be given over to you for consumption.”
translation:
  language: ru
  text: 'Они схватили её и спросили: «Кто ты[a], откуда идёшь и куда направляешься?» Она ответила: «Я — дочь евреев[b] и бегу от них, потому что вскоре они будут отданы вам на съедение[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Чьих ты?» — то есть к какому народу или к какой стороне ты принадлежишь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я — еврейка». Греческий текст буквально говорит: «Я — дочь евреев».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «на пожрание»; также возможно: «в пищу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνέλαβον
  choice: схватили
  rationale: Передаёт физическое задержание Иудифи и резкость действия в военной обстановке.
- source_word: Τίνων εἶ
  choice: Кто ты
  rationale: В контексте вопрос касается принадлежности к народу или стороне. Естественная русская формулировка вынесена в текст, а буквальная притяжательная конструкция сохранена в примечании.
- source_word: πόθεν ἔρχῃ
  choice: откуда идёшь
  rationale: Естественно передаёт исходную точку движения, выраженную πόθεν.
- source_word: ποῦ πορεύῃ
  choice: куда направляешься
  rationale: Передаёт направление пути и сохраняет нейтрально-достоинственный регистр.
- source_word: Θυγάτηρ εἰμὶ τῶν Ἑβραίων
  choice: Я — дочь евреев
  rationale: Сохраняет буквальный семейно-этнический образ θυγάτηρ вместо сведения выражения к простому «еврейка».
- source_word: ἀποδιδράσκω ἀπὸ προσώπου αὐτῶν
  choice: бегу от них
  rationale: Глагол означает бегство или побег; буквальное «от лица их» в современном русском неестественно и не добавляет здесь самостоятельного смысла.
- source_word: μέλλουσιν δόσθαι
  choice: вскоре они будут отданы
  rationale: Сохраняет пассивную конструкцию и передаёт близость предстоящего события без указания не названного в тексте деятеля.
- source_word: εἰς κατάβρωμα
  choice: на съедение
  rationale: Это естественное и вместе с тем яркое русское выражение сохраняет образ добычи, предназначенной для пожирания.
theological_decisions:
- issue: Этническое самоопределение Иудифи
  choice: Я — дочь евреев
  alternative: Я — еврейка
  rationale: Греческий текст использует θυγάτηρ с родительным обозначением народа. Буквальный образ подчёркивает принадлежность к народу и не должен без необходимости сглаживаться.
- issue: Неуказанный деятель в пассивной конструкции
  choice: они будут отданы вам
  alternative: их отдадут вам
  rationale: Пассив δόσθαι сохранён, чтобы не вводить в текст того, кто совершит передачу, и не разрешать возможную богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Прямая речь звучит естественно, а семитизированный образ «дочь евреев» намеренно сохранён как значимая особенность исходного текста.
