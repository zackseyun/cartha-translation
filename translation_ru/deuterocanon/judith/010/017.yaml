lexical_decisions:
- source_word: ἀπέλεξαν ἐξ αὐτῶν ἄνδρας ἑκατόν
  choice: выбрали из них сто человек
  rationale: Передаёт намеренный выбор ста мужчин из более многочисленной группы и сохраняет порядок смысловых компонентов греческой фразы.
- source_word: παρέζευξαν
  choice: чтобы сопровождать
  rationale: В данном контексте глагол обозначает приставление людей к Иудифи и её служанке в качестве официального сопровождения; целевая конструкция естественно выражает эту функцию по-русски.
- source_word: τῇ ἄβρᾳ αὐτῆς
  choice: её служанку
  rationale: ἄβρα здесь обозначает сопровождающую Иудифь домашнюю рабыню или служанку; «служанка» понятно современному читателю и не вносит лишней конкретизации правового статуса.
- source_word: ἤγαγον αὐτὰς
  choice: привели их
  rationale: Женский род греческого местоимения указывает на Иудифь и служанку; русское «их» сохраняет эту отсылку в естественной форме.
- source_word: ἐπὶ τὴν σκηνὴν Ὀλοφέρνου
  choice: к шатру Олоферна
  rationale: σκηνή — походное жилище военачальника; «шатёр» уместен в военном повествовании и звучит естественнее, чем более бытовое «палатка».
