revisions:
- from: 'И они дивились её красоте и из-за неё дивились сынам Израиля[a]. Каждый говорил своему ближнему: «Кто станет презирать этот народ, у которого есть такие женщины? Ведь нехорошо оставлять из них в живых хотя бы одного мужчину: те, кого оставят, сумеют перехитрить всю землю[b]».'
  to: 'И они дивились её красоте и, видя её, дивились сынам Израиля[a]. Каждый говорил своему ближнему: «Кто станет презирать этот народ, среди которого есть такие женщины? Ведь нехорошо оставлять в живых хотя бы одного из них: оставшиеся сумеют обхитрить весь мир[b]».'
