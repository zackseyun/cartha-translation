  source_fidelity: 'В целом смысл греческого текста передан точно: повтор ἐθαύμαζον сохранён, причинная связь ἀπ’ αὐτῆς отражена, риторический вопрос и жестокая военная логика не смягчены. Однако «из-за неё» в современном русском обычно несёт неблагоприятный оттенок, которого в греческом нет; «видя её» естественно передаёт причинно-побудительную связь без лишней оценки. «Всю землю» после «перехитрить» звучит неестественно по-русски; «весь мир» передаёт масштаб πᾶσαν τὴν γῆν в данном обороте, а буквальный вариант следует отметить в сноске.'
