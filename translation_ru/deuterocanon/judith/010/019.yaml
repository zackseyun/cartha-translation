  terminology: «Сыны Израиля» оправданно сохраняет традиционный и формально мужской оборот υἱοὺς Ἰσραήλ; сноска с «израильтянами» уместна. «Мужчину» верно передаёт ἄνδρα. «Нехорошо» сохраняет намеренно широкий смысл οὐ καλόν ἐστιν. Для κατασοφίσασθαι «обхитрить» хорошо передаёт одоление хитростью.
