base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/010/019.yaml
  text: And they marveled at her beauty[a], and because of her they marveled at the sons of Israel; and each said to his neighbor, “Who would despise this people, who have such women among them? For it is not good to leave even one man from among them[b], because those who are left would be able to outwit the whole earth.”
translation:
  language: ru
  text: 'И они дивились её красоте и, видя её, дивились сынам Израиля[a]. Каждый говорил своему ближнему: «Кто станет презирать этот народ, среди которого есть такие женщины? Ведь нехорошо оставлять в живых хотя бы одного из них: оставшиеся сумеют обхитрить весь мир[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтянам». Буквально: «сынам Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всю землю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: дивились
  rationale: Повтор глагола сохранён; «дивились» передаёт и изумление, и восхищение, оставаясь уместным для литературного библейского повествования.
- source_word: κάλλει
  choice: красоте
  rationale: Прямое и естественное соответствие в контексте внешней красоты Иудифи.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: сынам Израиля
  rationale: Сохраняет формально мужское и традиционное греческое обозначение израильского народа; более нейтральное «израильтянам» указано в сноске.
- source_word: ἀπʼ αὐτῆς
  choice: из-за неё
  rationale: 'Передаёт причинное значение: Иудифь стала причиной их изумления сынами Израиля. Более положительное «благодаря ей» чрезмерно уточняло бы оценочный оттенок.'
- source_word: καταφρονήσει
  choice: станет презирать
  rationale: Будущее время в риторическом вопросе передано естественной русской конструкцией; «презирать» сохраняет значение высокомерного пренебрежения.
- source_word: γυναῖκας τοιαύτας
  choice: такие женщины
  rationale: Краткое и естественное выражение, сохраняющее оценочную силу τοιαύτας.
- source_word: οὐ καλόν ἐστιν
  choice: нехорошо
  rationale: Сохраняет широкую оценку греческого выражения, не сводя её исключительно к моральной или стратегической целесообразности.
- source_word: ὑπολειπέσθαι ἐξ αὐτῶν ἄνδρα ἕνα
  choice: оставлять из них в живых хотя бы одного мужчину
  rationale: Военный контекст раскрывает подразумеваемое значение выживания; «хотя бы одного» передаёт эмфатическую силу ἕνα, а «мужчину» сохраняет явно мужское обозначение ἄνδρα.
- source_word: οἱ ἀφεθέντες
  choice: те, кого оставят
  rationale: Сохраняет словесную связь с предшествующим «оставлять» и не уточняет без необходимости, были ли они намеренно пощажены.
- source_word: δυνήσονται κατασοφίσασθαι
  choice: сумеют перехитрить
  rationale: Передаёт способность одолеть хитростью или превосходством ума, не усиливая значение до прямого обмана.
- source_word: πᾶσαν τὴν γῆν
  choice: всю землю
  rationale: Сохраняет конкретную лексику греческого текста и его масштабный образ; возможное значение «весь мир» отмечено в сноске.
theological_decisions:
- issue: Мужское собирательное обозначение Израиля
  choice: сынам Израиля
  alternative: израильтянам
  rationale: Формально мужской греческий оборот сохранён, хотя в данном месте он обозначает израильский народ как целое; естественная коллективная альтернатива дана в сноске.
- issue: Пол выжившего в военном высказывании
  choice: хотя бы одного мужчину
  alternative: хотя бы одного человека
  rationale: Греческое ἄνδρα прямо обозначает мужчину, и военный контекст поддерживает это прочтение; обобщение до «человека» устранило бы присутствующую в источнике гендерную конкретность.
- issue: Оценочный смысл οὐ καλόν ἐστιν
  choice: нехорошо
  alternative: не следует
  rationale: Выбрана широкая формулировка, сохраняющая напряжение между моральной оценкой и прагматическим военным советом, не разрешая его в пользу одного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис риторической речи сохранён ясным и естественным; повтор «дивились» отражает повтор греческого глагола. Военная жестокость высказывания не смягчена, но и не усилена сверх источника.
