translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире перед именами ясно показывает, что Хаврин и Хармин являются старейшинами города; единственное число «стоявшего» сохраняет грамматическую связь причастия только с Озией.
