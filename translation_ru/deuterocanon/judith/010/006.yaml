  text: And they went out to the gate of the city of Bethulia[a], and found Uzziah standing there, and Chabris and Charmis, the elders of the city.
translation:
  language: ru
  text: И они вышли к воротам города Ветилуи и нашли Озию, стоявшего там[a], и старейшин города — Хаврина и Хармина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «стоявшего при них» или «у них», то есть у ворот.'
    reason: Уточняет отсылку местоимения к воротам и более буквальное пространственное выражение оригинала.
lexical_decisions:
- source_word: ἐξῆλθον
  choice: вышли
  rationale: Аорист ἐξέρχομαι обозначает движение наружу; «вышли» естественно и точно передаёт действие во множественном числе.
- source_word: ἐπὶ τὴν πύλην
  choice: к воротам
  rationale: После глагола движения ἐπί с винительным указывает направление. Русское «к воротам» идиоматично; πύλη в значении городских ворот естественно передаётся формой множественного числа.
- source_word: τῆς πόλεως Βαιτυλουά
  choice: города Ветилуи
  rationale: πόλις передано как «город», а Βαιτυλουά — традиционной русской библейской формой «Ветилуя», в родительном падеже «Ветилуи».
- source_word: εὗρον
  choice: нашли
  rationale: Сохранено основное значение εὑρίσκω; в данном повествовательном контексте русское «нашли» звучит естественно.
- source_word: ἐφεστῶτα ἐπʼ αὐτῇ
  choice: стоявшего там
  rationale: Причастие единственного числа относится только к Озии. «Там» естественно передаёт ссылку местоимения на ранее упомянутые ворота, не создавая неуместного образа стояния «на» них.
- source_word: Ὀζίαν
  choice: Озию
  rationale: Использована узнаваемая русская библейская форма имени «Озия» в винительном падеже.
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως
  choice: старейшин города
  rationale: πρεσβύτεροι здесь обозначает городских старейшин или руководителей; буквальная и понятная русская передача сохраняет общественную роль.
- source_word: Χάβρειν καὶ Χάρμειν
  choice: Хаврина и Хармина
  rationale: Имена переданы традиционными русскими библейскими формами и поставлены в винительном падеже в соответствии с синтаксисом.
