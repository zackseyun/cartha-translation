lexical_decisions:
- source_word: ἀνήγγειλαν
  choice: доложили
  rationale: В придворно-военном контексте глагол обозначает сообщение начальнику; «доложили» естественно передаёт официальный оттенок.
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Передаёт движение из внутреннего пространства шатра наружу без добавления точки зрения, не выраженной в греческом тексте.
- source_word: προσκἠνιον
  choice: ко входу в шатёр
  rationale: Слово обозначает пространство перед шатром или его переднюю часть; контекстуальный перевод понятнее буквального и сохраняет локальную привязку.
- source_word: λαμπάδες
  choice: светильники
  rationale: Греческое слово допускает значения «факелы» и «светильники»; упоминание серебра благоприятствует образу церемониальных светильников.
- source_word: ἀργυραῖ
  choice: серебряные
  rationale: Прямо передаёт значение прилагательного — сделанные из серебра или серебряные.
- source_word: προάγον
  choice: перед ним несли
  rationale: Неодушевлённые светильники представлены как двигавшиеся впереди него; по-русски естественно обозначить подразумеваемых носильщиков, не меняя картины процессии.
