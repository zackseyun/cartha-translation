  text: И они шли прямо по долине, и передовой отряд ассирийцев встретил её.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — «встретил её» в единственном числе, хотя перед этим сказано «они шли». Так повествование сосредоточивает внимание именно на Иудифи.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: они шли
  rationale: Имперфект от πορεύομαι передаёт продолжавшееся движение; русское «шли» естественно сохраняет этот видовой оттенок.
- source_word: ἐν τῷ αὐλῶνι
  choice: через двор
  rationale: αὐλών обозначает двор или огороженное дворовое пространство; при глаголе движения «через двор» естественно выражает движение в его пределах.
- source_word: εἰς εὐθεῖαν
  choice: прямо
  rationale: Наречное выражение указывает на движение по прямому направлению, без отклонения.
- source_word: συνήντησεν
  choice: встретил
  rationale: Аорист συναντάω означает «встретить, повстречать»; простой прошедший вид уместен для наступившего события.
- source_word: αὐτῇ
  choice: её
  rationale: Дательный падеж единственного числа относится именно к Иудифи, хотя в предыдущей части подлежащее стоит во множественном числе.
- source_word: προφυλακὴ
  choice: передовой отряд
  rationale: προφυλακή может обозначать передовую стражу или выдвинутый вперёд караульный отряд; «передовой отряд» ясно передаёт группу воинов, а не сооружение или пост.
- source_word: τῶν Ἀσσυρίων
  choice: ассирийцев
  rationale: Родительный падеж естественно передаёт принадлежность отряда ассирийскому войску.
