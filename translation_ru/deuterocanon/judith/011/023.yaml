base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/023.yaml
  text: And now you are beautiful in your appearance and good in your words. For if you do as you have spoken[a], your God will be my God, and you will dwell in the house of King Nabuchodonosor, and you will be renowned throughout all the earth.
translation:
  language: ru
  text: И теперь ты прекрасна видом, и слова твои хороши. Ведь если ты сделаешь так, как сказала, твой бог будет моим богом[a], и ты поселишься в доме царя Навуходоносора и прославишься по всей земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твой Бог будет моим Богом». Греческое написание не позволяет решить вопрос о прописной букве; написание со строчной буквы передаёт непосредственную языческую перспективу говорящего.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστεία
  choice: прекрасна
  rationale: В сочетании с ἐν τῷ εἴδει σου прилагательное характеризует внешность Иудифи; «прекрасна видом» естественно передаёт похвалу её наружности в современном литературном русском.
- source_word: εἶδος
  choice: вид
  rationale: Обозначает внешность, видимый облик; сочетание «прекрасна видом» сохраняет структуру и возвышенный тон греческого текста.
- source_word: ἀγαθὴ ἐν τοῖς λόγοις σου
  choice: хороши твои слова
  rationale: Сохраняет похвалу речи Иудифи и параллелизм с характеристикой её внешности, не добавляя отсутствующей в тексте оценки истинности слов.
- source_word: ἐὰν ποιήσῃς καθὰ ἐλάλησας
  choice: если ты сделаешь так, как сказала
  rationale: 'Точно и естественно передаёт условие: действия Иудифи должны соответствовать её предшествующим словам.'
- source_word: ὁ θεός σου ἔσται μού θεός
  choice: твой бог будет моим богом
  rationale: Строчные буквы отражают непосредственную языческую перспективу Олоферна; греческая графика сама по себе вопрос капитализации не решает.
- source_word: καθιῇ
  choice: поселишься
  rationale: Хотя основное значение связано с сидением, при ἐν οἴκῳ здесь подразумевается пребывание или занятие места в царском доме; «поселишься» ясно передаёт контекстуальный смысл.
- source_word: οἶκος
  choice: дом
  rationale: Сохраняет прямое значение слова и вместе с тем допускает подразумеваемый царский двор или домочадство.
- source_word: ὀνομαστή
  choice: прославишься
  rationale: Передаёт значение известности и славы естественным русским глагольным оборотом.
- source_word: παρὰ πᾶσαν τὴν γῆν
  choice: по всей земле
  rationale: Сохраняет широкий, риторически универсальный охват исходного выражения.
theological_decisions:
- issue: Написание θεός в словах Олоферна с прописной или строчной буквы
  choice: «твой бог будет моим богом»
  alternative: «твой Бог будет моим Богом»
  rationale: Греческий текст не кодирует современное различие прописной и строчной букв. Строчное написание передаёт языческую перспективу говорящего, не отрицая того, что речь идёт о Боге Иудифи; альтернативное написание отмечено в сноске, чтобы сохранить богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис близок к греческому, но остаётся естественным; имя Ναβουχοδονόσορ передано в принятой русской форме «Навуходоносор».
