  source_fidelity: В целом переданы придворная формула ζῇ ... καὶ ζῇ, политическое значение κράτος, причинное διὰ σέ и инструментальное διὰ τῆς ἰσχύος σου. Однако «чтобы привести к благополучию всякую живую душу» звучит как не вполне оправданная причинная переработка εἰς κατόρθωσιν πάσης ψυχῆς и в русском неестественно. Более нейтральное «ради благополучия всякого живого существа» сохраняет целевое εἰς и не навязывает позднего значения «души».
  naturalness: Торжественный строй уместен. Формула «царь Навуходоносор, царь всей земли» понятна, но повтор «царь» тяжеловесен; «царь Навуходоносор всей земли» может ошибочно восприниматься как обычный титул. Поэтому сохранена ясная аппозиция. Перестановка обстоятельства «благодаря твоей силе» делает заключительную фразу естественнее и избегает повторного соседства «благодаря».
