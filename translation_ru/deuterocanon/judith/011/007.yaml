base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/007.yaml
  text: For King Nebuchadnezzar[a], of all the earth, lives, and his dominion lives—he who sent you for the success of every living soul. For not only will men serve him because of you[c][b], but also the wild animals and the cattle and the birds of the sky will live under your strength for Nebuchadnezzar and all his house.
translation:
  language: ru
  text: Ибо жив царь Навуходоносор, царь всей земли, и жива его власть! Он послал тебя ради благополучия всякого живого существа.[a] Ведь благодаря тебе ему будут служить не только люди, но и дикие звери, домашний скот и небесные птицы будут жить благодаря твоей силе — для Навуходоносора и всего его дома.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради успешного устроения всякой души». Здесь «душа» означает жизнь или живое существо, а не обязательно нематериальную часть человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная часть фразы в греческом тексте синтаксически сжата. Оборот «благодаря твоей силе» может относиться непосредственно к «будут жить» или ко всему утверждению; возможна также передача: «будут жить под твоей властью ради Навуходоносора и всего его дома».'
    reason: alternative_reading
lexical_decisions:
- source_word: ζῇ ... καὶ ζῇ
  choice: жив ... и жива
  rationale: Сохранена повторная торжественная формула, звучащая как придворное заверение или клятвенное провозглашение.
- source_word: βασιλεὺς Ναβουχοδονόσορ πάσης τῆς γῆς
  choice: царь Навуходоносор, царь всей земли
  rationale: Повтор слова «царь» делает зависимость родительного оборота ясной по-русски, не ослабляя гиперболический характер речи.
- source_word: κράτος
  choice: власть
  rationale: В царском контексте слово обозначает действенное могущество и господство; «власть» естественно передаёт оба оттенка.
- source_word: εἰς κατόρθωσιν πάσης ψυχῆς
  choice: чтобы привести к благополучию всякую живую душу
  rationale: Переданы целевая конструкция и образное ψυχή без сведения его к богословскому понятию бесплотной души; κατόρθωσις здесь указывает на успешное, благоприятное устроение.
- source_word: διὰ σὲ
  choice: благодаря тебе
  rationale: 'διά с винительным выражает причину: люди станут служить царю вследствие действий Олоферна.'
- source_word: δουλεύσουσιν
  choice: будут служить
  rationale: В контексте имперского подчинения «служить» сохраняет политический смысл, не сужая его до конкретной формы рабства.
- source_word: θηρία τοῦ ἀγροῦ
  choice: дикие звери
  rationale: Современное и точное обозначение неприручённых наземных животных.
- source_word: κτήνη
  choice: домашний скот
  rationale: Обозначает одомашненных стадных животных и ясно противопоставляется диким зверям.
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: небесные птицы
  rationale: Сохраняет традиционный библейский образ и остаётся понятным современному читателю.
- source_word: διὰ τῆς ἰσχύος σου
  choice: благодаря твоей силе
  rationale: διά с родительным передаёт средство или действующую причину; русский оборот сохраняет зависимость жизни животных от силы Олоферна.
- source_word: πάντα τὸν οἶκον αὐτοῦ
  choice: всего его дома
  rationale: '«Дом» сохраняет смысловую широту: домашнее окружение, царский дом или династия.'
theological_decisions:
- issue: Гиперболическое провозглашение всемирной власти Навуходоносора
  choice: Сохранена торжественная формула «жив царь… и жива его власть» и титул «царь всей земли».
  alternative: Смягчить речь до обычной придворной похвалы или заменить титул описанием политического влияния.
  rationale: Это стратегическая речь Иудифи внутри повествования. Перевод передаёт её намеренно преувеличенную придворную риторику, не превращая слова персонажа в богословское утверждение повествователя.
- issue: Значение ψυχή
  choice: «живая душа» понимается как живое существо или жизнь.
  alternative: Истолковать ψυχή исключительно как нематериальную душу человека.
  rationale: Контекст и греческое словоупотребление не требуют позднейшего узкого богословского значения; подлинная широта выражения сохранена.
- issue: Сжатая заключительная конструкция
  choice: 'Основной текст следует порядку смысловых связей: животные будут жить для Навуходоносора и его дома благодаря силе Олоферна.'
  alternative: Понимать оборот как «будут жить под твоей властью ради Навуходоносора» либо теснее связывать «благодаря твоей силе» с именами царя и его дома.
  rationale: Греческая фраза синтаксически сжата и допускает более одного способа членения; альтернативность отмечена, а не устранена догматически.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной придворной интонацией. Сохранены повтор «жив… жива», библейская образность и риторическая гипербола; архаизмы и конфессионально окрашенные уточнения не вводились.
