base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/006.yaml
  text: And if you follow the words of your servant girl[a], God will fully accomplish the matter with you[b], and my lord will not depart from his purposes.
translation:
  language: ru
  text: И если ты последуешь словам твоей служанки[a], Бог доведёт это дело с тобой до конца[b], и мой господин не отступит от своих замыслов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «послушаешься слов твоей служанки».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Бог полностью совершит это дело вместе с тобой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακολουθήσῃς
  choice: последуешь
  rationale: Глагол означает следовать за кем-либо или поступать согласно сказанному; «последуешь словам» сохраняет образ и остаётся понятным по-русски.
- source_word: λόγοις
  choice: словам
  rationale: Буквальное и естественное соответствие, не сужающее смысл до совета или указания.
- source_word: παιδίσκης
  choice: служанки
  rationale: Передаёт женский род и подчинённое положение без излишнего акцента на возрасте или рабском статусе.
- source_word: τελείως
  choice: до конца
  rationale: В сочетании с ποιήσει естественно выражает полное завершение дела.
- source_word: πρᾶγμα
  choice: это дело
  rationale: Общее обозначение дела или предприятия; указательное «это» естественно связывает выражение с обсуждаемым замыслом.
- source_word: ποιήσει μετὰ σοῦ
  choice: доведёт это дело с тобой до конца
  rationale: Сохраняет отношение совместности, выраженное μετά, не уточняя его как «через тебя» или «для тебя».
- source_word: ὁ θεός
  choice: Бог
  rationale: Стандартное русское соответствие θεός.
- source_word: οὐκ ἀποστεῖται
  choice: не отступит
  rationale: Передаёт идею отказа, отхода или уклонения; конструкция с родительным после ἀπό отражена русским «от».
- source_word: ὁ κύριός μου
  choice: мой господин
  rationale: Здесь κύριος обозначает человеческого начальника; строчная буква исключает отнесение титула к Богу.
- source_word: ἐπιτηδευμάτων
  choice: замыслов
  rationale: В данном военно-политическом контексте слово обозначает намерения, предприятия или цели; «замыслы» сохраняет широту и звучит естественно.
theological_decisions:
- issue: Кого обозначает ὁ κύριός μου
  choice: мой господин
  alternative: мой повелитель
  rationale: В повествовательном контексте Юдифь почтительно обращается к Олоферну; речь идёт о человеке, поэтому используется строчная буква.
- issue: Роль Бога в выражении ποιήσει μετὰ σοῦ
  choice: Бог доведёт это дело с тобой до конца
  alternative: Бог совершит это дело через тебя
  rationale: Формулировка сохраняет неоднозначное μετά («с тобой») и не утверждает более определённо, что Олоферн является лишь орудием действия.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Самоуничижительное обращение «твоя служанка» передано естественно; синтаксис сохраняет условную конструкцию и смысловую напряжённость греческого текста.
