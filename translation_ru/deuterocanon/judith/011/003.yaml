  text: And now tell me why you fled from them and came to us[a]; for you have come for deliverance.
translation:
  language: ru
  text: А теперь скажи мне, почему ты бежала от них и пришла к нам. Ведь ты пришла за спасением[a].
  philosophy: optimal-equivalence
  footnotes:
