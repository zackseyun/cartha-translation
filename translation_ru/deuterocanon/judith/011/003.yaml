lexical_decisions:
- source_word: νῦν
  choice: теперь
  rationale: Наречие отмечает непосредственный переход к вопросу; «теперь» естественно звучит в современной русской речи.
- source_word: λέγε μοι
  choice: скажи мне
  rationale: Обычная русская передача повелительной формы с косвенным дополнением, без буквального и тяжеловесного «говори мне».
- source_word: τίνος ἕνεκεν
  choice: почему
  rationale: Оборот выражает вопрос о причине; «почему» точно и естественно передаёт его смысл.
- source_word: ἀπέδρας ἀπʼ αὐτῶν
  choice: ты бежала от них
  rationale: Глагол обозначает бегство или тайный уход. Женский род необходим в русском по отношению к Иудифи и не добавляет нового смысла.
- source_word: ἦλθες πρὸς ἡμᾶς
  choice: пришла к нам
  rationale: Прямая передача глагола движения и направления; женский род обусловлен личностью Иудифи.
- source_word: ἥκεις
  choice: ты пришла
  rationale: Глагол указывает на состоявшееся прибытие с сохраняющимся результатом; в русском контексте это естественно выражается прошедшим временем.
- source_word: εἰς σωτηρίαν
  choice: к спасению
  rationale: Сохраняет образ направленного движения в εἰς и широкий смысл σωτηρία — спасение, избавление или безопасность — не сводя его исключительно к физической безопасности либо к богословскому термину.
theological_decisions:
- issue: Значение σωτηρία в повествовательной реплике Олоферна
  choice: к спасению
  alternative: ради избавления; в безопасное место
  rationale: В контексте речь прежде всего о предполагаемом избавлении Иудифи от опасности, однако слово σωτηρία допускает более широкое звучание. «Спасение» сохраняет эту смысловую напряжённость, а примечание поясняет возможные контекстуальные оттенки.
translation_notes:
  register: Современный литературный русский язык с прямой, достойной повествовательной интонацией. Два греческих предложения разделены точкой, чтобы избежать перегруженности; «ведь» сохраняет пояснительную силу γάρ.
