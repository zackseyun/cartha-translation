base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/011.yaml
  text: And now[a], so that my lord may not become an outcast and ineffective, death will fall upon them, and sin has overtaken them[c][b], by which they provoke their God whenever they commit an offense.
translation:
  language: ru
  text: И теперь, чтобы господин мой не оказался изгнанным и безуспешным[a], смерть обрушится на них[b], и грех уже настиг их — грех, которым они вызывают гнев своего Бога всякий раз, когда совершают неподобающее дело[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не оказался изгнанным и без результата». Греческие слова могут подчёркивать как изгнание, так и безуспешность или неспособность чего-либо добиться.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «смерть падёт на их лицо». Здесь этот греческий оборот передан по-русски идиоматически.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «совершают предосудительный поступок». Греческое слово может обозначать неуместное, нелепое или нравственно возмутительное действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκβολος
  choice: изгнанным
  rationale: Слово обозначает того, кто выброшен, изгнан или удалён. «Изгнанным» сохраняет прямой образ и уместно в военно-политическом контексте.
- source_word: ἄπρακτος
  choice: не добившимся цели
  rationale: Прилагательное может означать неспособность что-либо осуществить или отсутствие результата. Выражение передаёт опасение, что Олоферн уйдёт, ничего не достигнув, не преувеличивая его беспомощность.
- source_word: ἐπιπεσεῖται θάνατος ἐπὶ πρόσωπον αὐτῶν
  choice: смерть обрушится на них
  rationale: Идиоматический перевод сохраняет внезапность и силу греческого оборота, буквально говорящего о падении смерти «на их лицо».
- source_word: κατέλαβε
  choice: уже настиг
  rationale: Аорист изображает грех как уже настигший и охвативший их; «уже настиг» естественно передаёт достигнутый к настоящему моменту результат.
- source_word: ἁμάρτημα
  choice: грех
  rationale: «Грех» сохраняет нравственно-религиозный смысл, особенно явный в последующем упоминании их Бога.
- source_word: παροργιοῦσιν
  choice: вызывают гнев
  rationale: Глагол означает раздражать или побуждать к гневу. Такая передача естественна в современном русском языке и явно выражает подразумеваемый гнев.
- source_word: ἀτοπίαν
  choice: неподобающее дело
  rationale: Существительное охватывает непристойность, неуместность, нелепость или нравственно возмутительный поступок. Выбранный вариант сохраняет широту значения и не усиливает его без достаточных оснований.
- source_word: ὁ κύριός μου
  choice: господин мой
  rationale: Это почтительное обращение Иудифи к Олоферну, а не божественный титул. Порядок слов поддерживает достоинство и слегка торжественный характер речи.
theological_decisions:
- issue: Нравственно-религиозная весомость ἁμάρτημα
  choice: грех
  alternative: проступок
  rationale: Упоминание того, что этим действием они вызывают гнев своего Бога, требует сохранить богословскую и нравственную силу слова, не сводя его к обычной ошибке.
- issue: Статус κύριος в обращении к человеку
  choice: господин мой
  alternative: мой повелитель
  rationale: Контекст однозначно указывает на Олоферна. Перевод передаёт социальное почтение и не придаёт обращению божественного смысла.
- issue: Связь ἐν ᾧ с ἁμάρτημα
  choice: грех, которым они вызывают гнев своего Бога
  alternative: грех, пребывая в котором они вызывают гнев своего Бога
  rationale: Относительное выражение допускает оттенок средства или состояния. Краткое «которым» сохраняет грамматическую связь с грехом, не уточняя сверх текста механизм провокации.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Обращение «господин мой» сохраняет придворную почтительность без чрезмерной архаизации. Буквально непривычный образ смерти разъяснён в сноске, а в основном тексте передан естественно.
