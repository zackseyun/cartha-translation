  source_fidelity: Перевод точно передаёт греческий текст. «Прими» соответствует Δέξαι; «слова» — τὰ ῥήματα; два различных самоназвания сохранены как «раба» (δούλη) и «служанка» (παιδίσκη). Конструкция «пусть ... говорит пред тобой» адекватно передаёт λαλησάτω ... κατὰ πρόσωπόν σου. «Этой ночью я не скажу господину моему лжи» сохраняет будущую форму, объект ψεῦδος, человеческий смысл κυρίῳ μου и временное уточнение ἐν τῇ νυκτὶ ταύτῃ.
