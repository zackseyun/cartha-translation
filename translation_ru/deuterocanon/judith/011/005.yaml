base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/005.yaml
  text: And Judith said to him[a], “Receive the words of your servant, and let your maidservant speak before you[b], and I will not tell a lie to my lord this night.”
translation:
  language: ru
  text: 'И сказала ему Юдифь: «Прими слова твоей рабы[a], и пусть твоя служанка говорит пред тобой; этой ночью я не скажу господину моему[b] лжи».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоей служанки». Греч. δοῦλη может означать как рабыню, так и служанку; «раба» сохраняет более сильное выражение самоуничижения Юдифи.'
    reason: lexical_alternative
  - marker: b
    text: То есть человеческому господину — Олоферну, а не Господу Богу.
    reason: referent_clarification
lexical_decisions:
- source_word: Δέξαι
  choice: Прими
  rationale: Аористный императив от δέχομαι выражает прямую просьбу принять и выслушать её слова; «прими» сохраняет образ и возвышенный тон.
- source_word: τὰ ῥήματα
  choice: слова
  rationale: ῥήματα обозначает произнесённые слова или речи; буквальное соответствие естественно по-русски.
- source_word: τῆς δούλης σου
  choice: твоей рабы
  rationale: Женская форма δούλη может обозначать рабыню или служанку. «Раба» сохраняет сильное статусное самоуничижение и при этом уместно в dignified biblical Russian.
- source_word: λαλησάτω
  choice: пусть ... говорит
  rationale: Императив третьего лица от λαλέω передан естественной русской разрешительно-просительной конструкцией.
- source_word: ἡ παιδίσκη σου
  choice: твоя служанка
  rationale: παιδίσκη обозначает девушку-служанку или рабыню; «служанка» сохраняет женский и смиренный оттенок, а также отличает термин от δούλη.
- source_word: κατὰ πρόσωπόν σου
  choice: пред тобой
  rationale: Устойчивое выражение означает «перед лицом твоим», то есть в твоём присутствии; «пред тобой» сохраняет возвышенный, но понятный регистр.
- source_word: οὐκ ἀναγγελῶ ψεῦδος
  choice: я не скажу ... лжи
  rationale: ἀναγγέλλω значит сообщать или возвещать, а ψεῦδος — ложь; конструкция «не скажу лжи» естественна и сохраняет объектную структуру без разговорного оборота «не солгу».
- source_word: τῷ κυρίῳ μου
  choice: господину моему
  rationale: κύριος здесь относится к человеческому властителю, поэтому строчное «господину» передаёт почтительное обращение без божественного титула.
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: этой ночью
  rationale: Прямо и естественно передаёт временную определённость греческой фразы.
theological_decisions:
- issue: Различение δοῦλη и παιδίσκη в самоназваниях Юдифи
  choice: «раба» и «служанка»
  alternative: «служанка» и «служанка» либо «рабыня» и «девушка-рабыня»
  rationale: Два разных греческих слова образуют риторическую пару смиренных самоназваний. Разные русские соответствия сохраняют эту вариативность и сильный статусный смысл δοῦλη, не утверждая сверх того юридических подробностей её положения.
- issue: κύριος как обозначение человеческого начальника
  choice: «господину моему» со строчной буквы
  alternative: «моему владыке» или «моему хозяину»
  rationale: Речь идёт об Олоферне, а не о Боге. «Господин» естественно выражает придворную почтительность и не вносит божественного значения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. Формы «раба», «пред тобой» и постпозиция в «господину моему» поддерживают придворно-почтительную речь, оставаясь понятными современному читателю.
