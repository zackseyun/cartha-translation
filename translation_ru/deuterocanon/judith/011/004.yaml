base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/004.yaml
  text: Take courage; you will live through this night and beyond. For there is no one who will wrong you; rather[a], he will treat you well, as is done for the servants of my lord King Nebuchadnezzar.
translation:
  language: ru
  text: 'Ободрись: этой ночью и впредь ты останешься в живых. Никто не поступит с тобой несправедливо; напротив, с тобой будут обращаться хорошо, как обращаются со слугами[a] моего господина, царя Навуходоносора.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабами». Греческое слово может означать и слуг, и рабов — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θάρσει
  choice: Ободрись
  rationale: Повелительная форма выражает заверение и призыв не падать духом. «Ободрись» естественно звучит по-русски и сохраняет поддерживающий тон.
- source_word: ἐν τῇ νυκτὶ ταύτῃ ζήσῃ καὶ εἰς τὸ λοιπόν
  choice: этой ночью и впредь ты останешься в живых
  rationale: Оборот охватывает как ближайшую ночь, так и последующее время. «Останешься в живых» передаёт обещание сохранения жизни, а «впредь» — значение εἰς τὸ λοιπόν.
- source_word: ἀδικήσει
  choice: поступит с тобой несправедливо
  rationale: Глагол ἀδικέω обозначает неправое, несправедливое обращение и не обязательно сводится к физическому вреду.
- source_word: ἀλλʼ εὖ σε ποιήσει
  choice: напротив, с тобой будут обращаться хорошо
  rationale: Безлично-обобщённая русская конструкция естественно передаёт неопределённого деятеля и смысл доброго обращения.
- source_word: καθὰ γίνεται
  choice: как обращаются
  rationale: Передаёт общий, обычный порядок обращения, подразумеваемый греческой конструкцией.
- source_word: τοῖς δούλοις
  choice: со слугами
  rationale: В контексте царского двора слово обозначает людей на службе у царя; при этом возможное значение «рабы» сохраняется в сноске.
- source_word: τοῦ κυρίου μου βασιλέως Ναβουχοδονόσορ
  choice: моего господина, царя Навуходоносора
  rationale: κύριος здесь является почтительным обращением к земному властителю, а не божественным титулом. Приложение с запятой естественно для современного русского языка.
theological_decisions:
- issue: Передача δοῦλοι в контексте царского двора
  choice: слуги
  alternative: рабы
  rationale: Непосредственный контекст подчёркивает принадлежность к царской службе и принятое при дворе обращение, а не правовой статус несвободы. Сноска сохраняет лексическую альтернативу.
translation_notes:
  register: Современный литературный русский язык; тон ободряющий и почтительно-придворный. Синтаксис сделан естественным для обычного читателя без устранения смысловой широты ἀδικέω и δοῦλος.
