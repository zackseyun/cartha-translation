    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ ἔστιν τοιαύτη γυνὴ
  choice: Нет такой женщины
  rationale: Естественная русская передача отрицательной конструкции существования с сохранением качественно-указательного смысла τοιαύτη — «такая».
- source_word: ἀπʼ ἄκρου ἕως ἄκρου τῆς γῆς
  choice: от края до края земли
  rationale: Сохраняет образный меризм греческого текста и его всеохватную, гиперболическую силу; «земля» также позволяет не устранять лексическую неоднозначность γῆ.
- source_word: ἐν καλῷ προσώπῳ
  choice: равной ей красотой лица
  rationale: Русская сравнительная конструкция ясно выражает, в каком отношении нет другой такой женщины; «красота лица» близко передаёт καλῷ προσώπῳ.
- source_word: συνέσει λόγων
  choice: разумностью речей
  rationale: Передаёт σύνεσις как рассудительность и понимание, проявляющиеся в словах, не усиливая значение до более широкого понятия «мудрость».
