- from: Нет такой женщины от края до края земли[a], равной ей красотой лица и разумностью речей[b].
  to: От края до края земли[a] нет женщины, равной ей красотой лица и рассудительностью в речах[b].
  rationale: Исправление ограничено русской идиоматичностью и более точным выражением связи «разумения» со сферой речи. Смысл гиперболической похвалы, сравнительная направленность τοιαύτη и неоднозначность γῆ сохранены; сноски и их якоря сохранены и приведены в соответствие с исправленным текстом.
