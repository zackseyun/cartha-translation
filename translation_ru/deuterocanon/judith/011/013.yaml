base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/013.yaml
  text: And the firstfruits of the grain and the tithes of the wine and of the oil[a], which they had set aside, having consecrated them for the priests who stand in Jerusalem before the face of our God—they have decided to consume[b], though it is not permitted for any of the people even to touch them with their hands.
translation:
  language: ru
  text: И начатки зерна, и десятины вина и масла, которые они отложили, освятив для священников, стоящих в Иерусалиме перед лицом нашего Бога, — всё это они решили употребить, хотя никому из народа не дозволено даже прикасаться к ним руками.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не подобает» или «не положено никому из народа даже прикасаться к ним руками».'
    reason: Греческое καθῆκεν может выражать как дозволенность, так и то, что считается должным или подобающим.
lexical_decisions:
- source_word: ἀπαρχὰς τοῦ σίτου
  choice: начатки зерна
  rationale: «Начатки» передаёт культовое значение ἀπαρχή — первую долю урожая, посвящённую Богу; «зерно» сохраняет широкий смысл σῖτος, не сужая его до пшеницы.
- source_word: δεκάτας τοῦ οἴνου καὶ τοῦ ἐλαίου
  choice: десятины вина и масла
  rationale: «Десятина» — естественный русский культовый термин для δεκάτη; родительный оборот точно воспроизводит перечисление продуктов.
- source_word: ἐφυλάξαν
  choice: сберегли
  rationale: Глагол обозначает сохранение и удержание предназначенного для священного употребления; «сберегли» естественно сочетает значения сохранения и резервирования.
- source_word: ἁγιάσαντες τοῖς ἱερεῦσιν
  choice: освятив для священников
  rationale: Передаёт формальное отделение для священного, священнического употребления, не сводя действие к простому хранению.
- source_word: τοῖς παρεστηκόσιν
  choice: предстоящих
  rationale: Сохраняет буквальный образ стояния перед Богом и одновременно естественно обозначает храмовое служение.
- source_word: ἀπέναντι τοῦ προσώπου τοῦ θεοῦ ἡμῶν
  choice: пред лицом нашего Бога
  rationale: Сохраняет выразительный семитизированный оборот греческого текста и остаётся понятным в русском библейском регистре.
- source_word: κεκρίκασιν ἐξαναλῶσαι
  choice: решили употребить
  rationale: κεκρίκασιν выражает принятое решение, а ἐξαναλῶσαι — расходование или полное употребление запасов. «Употребить» сохраняет более широкий смысл, чем исключительно «съесть».
- source_word: οὐδὲ ταῖς χερσὶν καθῆκεν ἅψασθαι
  choice: не дозволено даже прикасаться к этому руками
  rationale: Передаёт нормативную силу καθῆκεν и сохраняет греческое усиление «руками».
- source_word: οὐδένα τῶν ἐκ τοῦ λαοῦ
  choice: никому из народа
  rationale: Кратко и точно передаёт противопоставление обычных членов народа священникам без добавления социального оттенка «простонародья».
theological_decisions:
- issue: Священный статус запасов, предназначенных священникам
  choice: Продукты уже освящены для священников, поэтому остальному народу не дозволено даже прикасаться к ним.
  alternative: Можно было бы понимать их лишь как отложенные запасы без формального посвящения.
  rationale: Сочетание ἐφυλάξαν, ἁγιάσαντες, указания на священников и запрета прикасаться ясно указывает на культовое посвящение, однако перевод не добавляет сверх текста объяснений о конкретной правовой норме.
- issue: Значение ἐξαναλῶσαι
  choice: употребить
  alternative: съесть; израсходовать полностью
  rationale: Контекст допускает употребление продуктов в пищу, но сам глагол шире и может означать полное расходование. «Употребить» сохраняет эту смысловую широту.
- issue: Сила καθῆκεν
  choice: не дозволено
  alternative: не подобает; не положено; незаконно
  rationale: В контексте священного запрета выражение имеет нормативную силу, однако греческое слово само по себе может обозначать также уместность или должное. Эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Формы «начатки», «предстоящих» и «пред лицом» сохранены как понятные культовые выражения; синтаксис упрощён ровно настолько, чтобы длинное греческое предложение оставалось читаемым. Маркер сноски поставлен непосредственно после предложения, к которому относится лексическая альтернатива.
