  terminology: «Начатки», «десятины», «освятив», «священники» и «перед лицом нашего Бога» удачны и сохраняют культовую терминологию без конфессионального истолкования. «Употребить» обоснованно не сужает ἐξαναλῶσαι до вкушения.
