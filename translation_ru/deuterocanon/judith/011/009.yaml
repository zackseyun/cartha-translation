  text: And now[a], concerning the matter that Achior spoke in your council, we have heard his words, because the men of Bethulia spared him[b], and he reported to them everything that he had spoken from you.
translation:
  language: ru
  text: 'А теперь мы услышали о том, что говорил Ахиор в твоём совете: ведь мужчины Ветилуи пощадили его[a], и он сообщил им всё, что говорил при тебе[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасли его», «сохранили ему жизнь».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «всё, что он высказал при тебе»; то есть в твоём присутствии или перед тобой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: о том
  rationale: В данном обороте слово обозначает содержание сказанного Ахиором, а не отдельное «слово»; русская конструкция «слова… о том» естественно передаёт этот смысл.
- source_word: συνεδρείᾳ
  choice: совете
  rationale: Термин обозначает совещательное собрание; «совет» сохраняет официальный характер сцены.
- source_word: ἠκούσαμεν τὰ ῥήματα αὐτοῦ
  choice: мы услышали слова Ахиора
  rationale: Передаёт глагол слышания и множественное ῥήματα без добавления значения официального сообщения.
- source_word: περιεποίησαντο
  choice: пощадили
  rationale: В контексте жители Ветилуи сохранили Ахиору жизнь; «пощадили» кратко выражает это, хотя глагол допускает смысл «спасли» или «сохранили в безопасности».
- source_word: οἱ ἄνδρες Βαιτυλουά
  choice: жители Ветилуи
  rationale: Фраза буквально говорит о мужчинах Ветилуи, но по-русски «жители» естественно обозначает городскую общину, принявшую Ахиора, без изменения референта.
- source_word: ἀπήγγειλεν
  choice: пересказал
  rationale: Глагол означает передачу полученных сведений; здесь Ахиор сообщил жителям содержание своей прежней речи.
- source_word: παρὰ σοί
  choice: при тебе
  rationale: Сочетание παρά с дательным указывает на нахождение рядом или в присутствии адресата; «при тебе» естественно сохраняет эту пространственно-речевую связь.
