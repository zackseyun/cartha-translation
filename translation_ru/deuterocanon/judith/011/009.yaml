translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Греческий порядок слов перестроен ради ясности; причинная связь ὅτι передана словом «ведь». Имя Βαιτυλουά передано в принятой русской библейской форме «Ветилуя».
