base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/022.yaml
  text: Holofernes said to her[a], “God has done well to send you ahead of the people, so that power might be in our hands[b]; but destruction is for those who have treated my lord with contempt.”
translation:
  language: ru
  text: 'Олоферн сказал ей: «Хорошо сделал Бог, послав тебя впереди народа, чтобы власть оказалась в наших руках; а тем, кто презрел моего господина, — гибель».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «а у презревших моего господина — гибель». В греческом слово «гибель» стоит в конце фразы, что придаёт ему особое ударение.'
    reason: Синтаксическая альтернатива и сохранение эмфазы греческого порядка слов.
lexical_decisions:
- source_word: Εὖ ἐποίησεν
  choice: Хорошо сделал
  rationale: Естественно передаёт оценочную формулу греческого текста, сохраняя её совершенный вид и прямоту.
- source_word: ἀποστεῖλας
  choice: послав
  rationale: Деепричастие близко воспроизводит греческую аористную причастную конструкцию и естественно сочетается с «хорошо сделал».
- source_word: ἔμπροσθεν τοῦ λαοῦ
  choice: впереди твоего народа
  rationale: Выражает движение прежде народа, то есть то, что Иудифь была послана вперёд. Притяжательное «твоего» проясняет подразумеваемую связь без изменения референта.
- source_word: τοῦ γενήθηναι
  choice: чтобы ... оказалась
  rationale: Передаёт целевое или результативное значение артиклевого инфинитива, не устраняя присущую конструкции смысловую близость цели и результата.
- source_word: ἐν χερσὶν ἡμῶν
  choice: в наших руках
  rationale: Сохраняет греческую метафору обладания и контроля и является естественным русским выражением.
- source_word: κράτος
  choice: власть
  rationale: В контексте речи Олоферна обозначает господство или военное превосходство; «власть» естественно сочетается с оборотом «в наших руках».
- source_word: φαυλίσασι
  choice: презрел
  rationale: Передаёт активное пренебрежение и уничижительное отношение, не перегружая фразу описательным оборотом.
- source_word: τὸν κύριόν μου
  choice: моего господина
  rationale: Здесь κύριος относится к человеческому владыке Олоферна; «господин» сохраняет титульно-подчинённое значение без божественного оттенка.
- source_word: ἀπώλεια
  choice: гибель
  rationale: Краткое и современное соответствие угрозе уничтожения или погибели, без привнесения специального догматического смысла.
theological_decisions:
- issue: Значение κύριος применительно к повелителю Олоферна
  choice: моего господина
  alternative: моего владыку
  rationale: Контекст указывает на человеческого правителя, а не на Бога Израиля. «Господин» ясно выражает отношение подчинения и не создаёт ненужной сакральной двусмысленности.
- issue: Связь Бога с ожидаемой властью захватчиков
  choice: сохранена прямая формулировка речи Олоферна
  alternative: смягчить утверждение как субъективное ожидание Олоферна
  rationale: Текст передаёт слова персонажа и приписываемую им Богу цель; перевод не должен ни подтверждать эту оценку от лица повествователя, ни богословски исправлять её.
translation_notes:
  register: Современный литературный русский язык с достойной, но не архаичной интонацией. Синтаксис сохраняет торжественную прямоту речи Олоферна; тире во второй части подчёркивает вынесенный приговор. Маркер сноски помещён в основном тексте.
