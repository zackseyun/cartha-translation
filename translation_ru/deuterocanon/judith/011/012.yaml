base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/012.yaml
  text: For when their food had run out and all water had become scarce[a], they decided to use their livestock, and they determined to consume everything that God had commanded them by his laws not to eat.
translation:
  language: ru
  text: Поскольку запасы пищи у них иссякли и воды повсюду стало мало, они решили пустить на пищу свой скот[a] и вознамерились съесть всё, что Бог запретил им есть в Своих законах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наброситься на свой скот»; возможно также: «обратиться к своему скоту». То есть в отчаянии использовать домашних животных как пищу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέλειπεν αὐτοὺς τὰ βρώματα
  choice: запасы пищи у них иссякли
  rationale: Передаёт истощение съестных припасов; имперфект описывает наступившее и продолжавшееся отсутствие запасов.
- source_word: ἐσπανίσθη πᾶν ὕδωρ
  choice: воды повсюду стало мало
  rationale: ἐσπανίσθη указывает на острую нехватку, но не обязательно на полное исчезновение воды; πᾶν получает естественное собирательное выражение.
- source_word: ἐβουλεύσαντο
  choice: они решили
  rationale: Глагол обозначает обдумывание, завершившееся решением.
- source_word: ἐπιβαλεῖν τοῖς κτήνεσιν αὐτῶν
  choice: пустить на пищу свой скот
  rationale: Идиома буквально означает «наброситься/посягнуть на свой скот», а в контексте — обратиться к домашним животным как к пище. Основной текст ясно передаёт смысл, а образность отмечена в сноске.
- source_word: πάντα ὅσα
  choice: всё, что
  rationale: Сохраняет всеохватность греческого выражения.
- source_word: διεστείλατο αὐτοῖς ὁ θεὸς τοῖς νόμοις αὐτοῦ μὴ φαγεῖν
  choice: Бог запретил им есть в Своих законах
  rationale: Отрицательный инфинитив при глаголе предписания естественно передаётся по-русски глаголом «запретил»; множественное νόμοις сохранено как «законах» без привязки к конкретному постановлению.
- source_word: διέγνωσαν δαπανῆσαι
  choice: вознамерились съесть
  rationale: διέγνωσαν выражает твёрдое намерение, а δαπανῆσαι — израсходовать или употребить; при запрещённой пище контекстуально речь идёт о съедении.
theological_decisions:
- issue: Упоминание установленных Богом пищевых запретов
  choice: всё, что Бог запретил им есть в Своих законах
  alternative: всё, чего Бог повелел им по Своим законам не есть
  rationale: Выбранное выражение естественно для современного русского языка и точно сохраняет мысль о запрете, установленном Богом в законах, не уточняя его содержание и не привнося конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. «Запасы пищи» и «пустить на пищу» понятны широкому читателю; неоднозначная греческая идиома сохранена в сноске. Местоимение «Своих» оформлено с прописной буквы по традиционной русской практике в отношении Бога.
