base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/017.yaml
  text: for your servant is God-fearing[a], and serves the God of heaven night and day. And now I will remain with you, my lord, and your servant will go out by night into the valley, and I will pray to God[b], and he will tell me when they have committed their sin.
translation:
  language: ru
  text: Ибо твоя служанка[a] богобоязненна и служит Богу небес ночь и день. Теперь я останусь при тебе, господин мой, а твоя служанка выйдет ночью в ущелье[b]. Я буду молиться Богу, и Он скажет мне, когда они совершат свой грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабыня». Греческое δούλη может обозначать рабыню, но здесь служит также почтительным самоименованием.'
    reason: lexical_alternative
  - marker: b
    text: 'Также: «овраг» или «долина». Греческое φάραγξ может обозначать ущелье, овраг или долину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλη
  choice: служанка
  rationale: Слово обозначает женщину-служанку или рабыню; здесь это почтительное самоименование Иудифи в обращении к Олоферну, поэтому «служанка» естественно передаёт речевую функцию, а значение «рабыня» отмечено в сноске.
- source_word: θεοσεβής
  choice: богобоязненна
  rationale: Передаёт прямое указание на благоговение перед Богом и сохраняет явный компонент θεο-.
- source_word: θεραπεύουσα
  choice: служит
  rationale: Причастие может означать служение, почитание или заботливое исполнение обязанностей; в религиозном контексте «служит» сохраняет широту значения и не сужает его до богослужебного поклонения.
- source_word: νυκτὸς καὶ ἡμέρας
  choice: ночь и день
  rationale: Естественное русское выражение, сохраняющее временной меризм исходного текста.
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: Богу небесному
  rationale: Естественная для русского библейского стиля передача титула «Бог неба», без превращения его в указание лишь на местонахождение Бога.
- source_word: μενῶ παρὰ σοί
  choice: я останусь у тебя
  rationale: Передаёт пребывание рядом с адресатом или в его расположении и звучит естественно по-русски.
- source_word: κύριε μου
  choice: господин мой
  rationale: Почтительное обращение к Олоферну, а не божественный титул; сохраняет возвышенный придворный регистр.
- source_word: ἐξελεύσεται
  choice: будет выходить
  rationale: Передаёт выход из стана; несовершенный вид естественно сочетается с предполагаемым повторением действия ночью в данном контексте.
- source_word: κατὰ νύκτα
  choice: ночью
  rationale: Краткая и естественная передача временного оборота «в ночное время».
- source_word: φάραγγα
  choice: ущелье
  rationale: Слово обозначает долину, овраг или ущелье; «ущелье» передаёт более выраженную топографическую узость, при сохранении альтернатив в сноске.
- source_word: προσεύξομαι πρὸς τὸν θεόν
  choice: я буду молиться Богу
  rationale: Ясная и идиоматичная передача молитвы, направленной к Богу.
- source_word: ἐρεῖ μοι
  choice: Он скажет мне
  rationale: Сохраняет личный характер ожидаемого сообщения от Бога и простоту греческого выражения.
- source_word: πότε ἐποίησαν τὸ ἁμάρτημα αὐτῶν
  choice: когда они совершат свой грех
  rationale: Будущее русской придаточной части естественно выражает действие, которое к моменту Божьего сообщения будет совершено; «свой грех» сохраняет определённость и принадлежность исходного выражения.
theological_decisions:
- issue: Передача δούλη в почтительном самоименовании Иудифи
  choice: служанка
  alternative: рабыня
  rationale: Хотя δούλη может прямо обозначать рабыню, в непосредственном контексте на первом плане стоит формула почтительного самоумаления перед Олоферном. Выбор не отрицает социального значения слова, которое сохранено в сноске.
- issue: Характер служения в θεραπεύουσα τὸν θεόν
  choice: служит Богу
  alternative: поклоняется Богу
  rationale: «Служит» сохраняет как религиозное почитание, так и постоянную преданность, не ограничивая смысл культовым поклонением.
- issue: Время совершения греха в πότε ἐποίησαν
  choice: когда они совершат свой грех
  alternative: когда они совершили свой грех
  rationale: Греческий аорист представляет действие как совершившееся относительно будущего откровения, тогда как в повествовательной перспективе оно ещё ожидается; русское будущее сохраняет эту временную соотнесённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Почтительное «господин мой» сохраняет придворный контекст, а синтаксис остаётся ясным для обычного современного читателя. Прописное «Он» употреблено для прозрачного отнесения местоимения к Богу.
