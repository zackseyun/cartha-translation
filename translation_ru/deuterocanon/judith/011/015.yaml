  yaml_path: translation/deuterocanon/judith/011/015.yaml
  text: And it will be that[a], when he reports it to them and they act, they will be given over to you for destruction on that day.
translation:
  language: ru
  text: 'И будет так: когда он сообщит им и они сделают это, в тот день они будут отданы тебе на погибель.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «И как только он сообщит им и они это сделают, в тот день они будут отданы тебе на погибель». Греческое ὡς ἂν с сослагательным наклонением может выражать неопределённое будущее условие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: будет так
  rationale: Будущее время εἰμί вводит предстоящее обстоятельство; «будет так» естественно передаёт греческую конструкцию.
- source_word: ὡς ἂν
  choice: когда
  rationale: В сочетании с аористными сослагательными формами выражает неопределённое будущее условие; «когда» сохраняет ожидаемость события без излишнего уточнения.
- source_word: ἀναγγείλῃ
  choice: он сообщит
  rationale: Глагол означает сообщить или объявить; подразумеваемое содержание сообщения сохраняется невыраженным, как в греческом.
- source_word: ποιήσωσιν
  choice: они сделают это
  rationale: Широкое значение ποιέω передано буквально и естественно; «это» указывает на подразумеваемое из контекста действие, не конкретизируя его.
- source_word: δοθήσονταί σοι
  choice: они будут отданы тебе
  rationale: Сохранены будущее время, страдательный залог и простой дательный σοι без добавления отсутствующего в тексте образа «в руки».
- source_word: εἰς ὄλεθρον
  choice: на погибель
  rationale: ὄλεθρος обозначает гибель, уничтожение или разорение; устойчивое русское сочетание «отданы на погибель» естественно выражает результат.
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: в тот день
  rationale: Обычное русское соответствие греческому временному выражению.
