  naturalness: 'После правки текст остаётся современным литературным русским: «господин, владыка» уместно как торжественное обращение в повествовании, а «сохрани это в своём сердце» сохраняет образ оригинала и звучит естественно.'
  terminology: «Народ» удачно передаёт γένος. «Подвергается каре» обоснованно передаёт ἐκδικάται в данном контексте, не устраняя его лексическую трудность; примечание следует сохранить, но сформулировать точнее. «Господин, владыка» представляет оба титула без добавления «мой».
