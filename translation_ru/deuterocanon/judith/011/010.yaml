    rationale: Форма ἐκδικάται действительно допускает смысл, связанный с отмщением/воздаянием, но такая русская конструкция не является буквальным эквивалентом и звучит двусмысленно. Лучше прямо отметить лексическую возможность «не подвергается отмщению/наказанию» и контекстуальное решение.
