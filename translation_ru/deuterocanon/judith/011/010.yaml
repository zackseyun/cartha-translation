base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/010.yaml
  text: Therefore[a], master lord, do not disregard his word, but lay it up in your heart, because it is true; for our people are not avenged, nor does the sword prevail against them[c][b], unless they sin against their God.
translation:
  language: ru
  text: Итак, господин, владыка, не пренебреги его словом, но сохрани это в своём сердце, потому что оно истинно. Ведь наш народ не подвергается каре, и меч не одолевает его, если только они не согрешат против своего Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое ἐκδικάται связано с отмщением или карательным воздаянием и допускает иное понимание; однако параллель с мечом, который не одолевает народ, поддерживает перевод «не подвергается каре».
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: Итак
  rationale: Передаёт вывод из предшествующих слов естественным для современного русского языка союзом.
- source_word: δέσποτα κύριε
  choice: господин мой, повелитель
  rationale: Сохраняет двойное обращение и различие двух титулов, не превращая обращение к Олоферну в божественный титул.
- source_word: μὴ παρέλθῃς τὸν λόγον αὐτοῦ
  choice: не пренебреги его словами
  rationale: Передаёт идиоматический смысл παρέρχομαι — не оставить без внимания, не проигнорировать; русский множественный «словами» естественно обозначает сказанное им.
- source_word: κατάθου αὐτὸν ἐν τῇ καρδίᾳ σου
  choice: сохрани их в своём сердце
  rationale: Сохраняет сердечную метафору внутреннего принятия и удержания сказанного, избегая неестественного буквального оборота.
- source_word: ὅτι ἔστιν ἀληθής
  choice: потому что они истинны
  rationale: Прямо передаёт утверждение об истинности λόγος; согласование во множественном числе обусловлено естественным русским «слова».
- source_word: οὐ γὰρ ἐκδικάται τὸ γένος ἡμῶν
  choice: Ведь наш народ не подвергается каре
  rationale: В контексте ἐκδικάται обозначает карательное воздаяние, постигающее народ; «народ» естественно передаёт γένος без современных расовых коннотаций.
- source_word: οὐ κατισχύει ῥομφαία ἐπʼ αὐτούς
  choice: и меч не одолевает его
  rationale: Сохраняет конкретный военный образ меча и значение κατισχύω — одолевать, брать верх.
- source_word: ἐὰν μὴ ἁμάρτωσιν εἰς τὸν θεὸν αὐτῶν
  choice: если только он не согрешит против своего Бога
  rationale: Естественно выражает исключительное условие поражения и сохраняет богословское утверждение исходного текста.
theological_decisions:
- issue: Двойное обращение δέσποτα κύριε
  choice: господин мой, повелитель
  alternative: владыка господин
  rationale: Оба титула представлены раздельно, однако формулировка не придаёт Олоферну специфически божественного наименования.
- issue: Условие кары и военного поражения народа
  choice: если только он не согрешит против своего Бога
  alternative: если он не согрешит против своего Бога
  rationale: 'Оборот сохраняет условную конструкцию и её напряжённое богословское утверждение: кара и превосходство меча связываются здесь с грехом народа против Бога.'
- issue: Значение ἐκδικάται
  choice: не подвергается каре
  alternative: за него не совершается отмщение
  rationale: Средне-пассивная форма допускает трудность толкования, но контекстуальный параллелизм с победой меча указывает на карательное действие против народа; примечание отмечает неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Двойное обращение сохранено, сердечная метафора удержана, а синтаксис сделан естественным для обычного современного читателя.
