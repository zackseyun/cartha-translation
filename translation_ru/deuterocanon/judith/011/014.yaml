  text: And he sent word to Jerusalem that those living there also had done these things[a], granting to those who had settled among them the release from the council of elders.
translation:
  language: ru
  text: И он послал в Иерусалим весть, что и живущие там поступили так же, предоставив переселившимся к ним освобождение, дарованное советом старейшин.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прощение» либо «отпущение». Греческое слово ἄφεσις может иметь как общественно-правовой, так и нравственно-религиозный смысл; упоминание совета старейшин здесь скорее указывает на административное решение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεστάλακεν
  choice: послал весть
  rationale: Глагол обозначает отправление; по контексту подразумевается передача сообщения. Совершенная форма передана естественным для русского повествования прошедшим временем.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалим
  rationale: Обычное обозначение направления при названии города.
- source_word: κατοικοῦντες
  choice: живущие там
  rationale: Причастие обозначает постоянных жителей; современная и ясная русская формулировка.
- source_word: ἐποίησαν ταῦτα
  choice: поступили так же
  rationale: Передаёт отсылочное ταῦτα без необоснованного уточнения действий; «так же» естественно выражает связь с καί.
- source_word: τοὺς μετοικίσαντας αὐτοῖς
  choice: переселившимся к ним
  rationale: Сохраняет значение перемены места жительства и направление, выраженное дательным αὐτοῖς, не вводя специальной юридической категории.
- source_word: τὴν ἄφεσιν
  choice: освобождение
  rationale: ἄφεσις допускает значения освобождения, отпущения и прощения; в связи с советом старейшин вероятен общественно-административный смысл.
- source_word: παρὰ τῆς γερουσίας
  choice: от совета старейшин
  rationale: Передаёт γερουσία как коллегиальный орган старейшин и сохраняет неоднозначную синтаксическую связь с «освобождением».
theological_decisions:
- issue: Значение ἄφεσις в общественно-административном контексте
  choice: освобождение
  alternative: прощение; отпущение
  rationale: Упоминание совета старейшин склоняет к административному смыслу, но нравственно-религиозный оттенок слова не исключён и отмечен в сноске.
- issue: Синтаксическая роль оборота τοὺς μετοικίσαντας αὐτοῖς τὴν ἄφεσιν
  choice: предоставив переселившимся к ним освобождение
  alternative: переселившиеся к ним [получили] освобождение
  rationale: Греческая фраза с винительными падежами синтаксически трудна. Выбранная конструкция следует наиболее вероятному пониманию консультационного текста, не уточняя неназванного субъекта предоставления.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены отсылочный характер «так же» и неоднозначность выражения «освобождение от совета старейшин»; не введены отсутствующие в греческом тексте подробности.
