lexical_decisions:
- source_word: ἤρεσαν
  choice: понравились
  rationale: Передаёт благосклонное восприятие слов Иудифи естественным современным русским языком.
- source_word: οἱ λόγοι αὐτῆς
  choice: её слова
  rationale: Близко к греческому выражению и при этом естественно по-русски.
- source_word: ἐναντίον Ὀλοφέρνου καὶ ἐναντίον πάντων τῶν θεραπόντων αὐτοῦ
  choice: Олоферну и всем его приближённым
  rationale: При глаголе «понравились» греческое ἐναντίον естественно передаётся русским дательным; повтор предлога не воспроизводится механически.
- source_word: θεραπόντων
  choice: приближённым
  rationale: В данном военно-придворном контексте слово обозначает людей из окружения Олоферна; «приближённые» точнее контекстуально, чем общее «слуги».
- source_word: ἐθαύμασαν
  choice: восхитились
  rationale: Передаёт положительное изумление и высокую оценку мудрости Иудифи.
- source_word: ἐπὶ τῇ σοφίᾳ αὐτῆς
  choice: её мудростью
  rationale: Русский творительный после «восхитились» естественно выражает основание восхищения.
- source_word: καὶ εἶπαν
  choice: 'и сказали:'
  rationale: Двоеточие указывает на прямую речь, которая следует в следующем стихе.
