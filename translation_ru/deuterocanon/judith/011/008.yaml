base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/008.yaml
  text: For we have heard of your wisdom and the cunning of your soul[a], and it has been reported throughout all the earth that you alone are good in all the kingdom, mighty in knowledge[c][b], and marvelous in the armies of war.
translation:
  language: ru
  text: Ведь мы слышали о твоей мудрости и о хитроумных замыслах твоей души[a], и по всей земле[b] стало известно, что во всём царстве[c] лишь ты один благ, силён в знании и удивителен в военных походах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хитроумных замыслах твоего ума». Греческое ψυχή может означать душу, жизнь или внутреннее «я»; здесь речь, вероятно, идёт о способности мыслить и замышлять.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по всей стране». Греческое γῆ может означать как землю вообще, так и отдельную страну.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «во всём царстве»; единственное число, вероятно, указывает на всё его царство, а не на каждое царство в мире.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσαμεν
  choice: мы слышали
  rationale: Аорист естественно передаётся русским прошедшим временем; в данной речи услышанное сохраняет актуальность без необходимости добавлять «мы наслышаны».
- source_word: τὴν σοφίαν σου
  choice: о твоей мудрости
  rationale: «Мудрость» прямо и естественно передаёт σοφία в хвалебной речи.
- source_word: τὰ πανουργεύματα τῆς ψυχῆς σου
  choice: хитроумии твоей души
  rationale: «Хитроумие» сохраняет двусмысленность πανουργεύματα между изобретательностью и лукавой хитростью, а «души» формально отражает ψυχή, не сводя её однозначно к уму.
- source_word: ἀνηγγέλη
  choice: стало известно
  rationale: Безличная пассивная конструкция передаёт распространение вести и звучит естественно по-русски.
- source_word: πάσῃ τῇ γῇ
  choice: по всей земле
  rationale: Сохраняет широкий, гиперболический охват γῆ; возможное значение «страна» отмечено в сноске.
- source_word: σὺ μόνος ἀγαθὸς
  choice: лишь ты один благ
  rationale: «Лишь ты один» сохраняет эмфатическую исключительность μόνος, а «благ» соответствует возвышенному придворному регистру ἀγαθός.
- source_word: ἐν πάσῃ βασιλείᾳ
  choice: во всём царстве
  rationale: Единственное число βασιλείᾳ вероятнее обозначает всё его царство, а не все царства вообще.
- source_word: δυνατὸς ἐν ἐπιστήμῃ
  choice: силён в знании
  rationale: Сохраняет необычное сочетание силы и знания в греческой похвале, не конкретизируя ἐπιστήμη как военную опытность.
- source_word: θαυμαστὸς ἐν στρατεύμασιν πολέμου
  choice: удивителен в военных силах
  rationale: Передаёт хвалебное θαυμαστός и военный смысл στρατεύματα, избегая неестественного буквального оборота «в войсках войны».
theological_decisions:
- issue: Антропологическое значение ψυχή
  choice: душа
  alternative: ум; внутреннее существо
  rationale: Оставлено более формальное и широкое «душа», поскольку контекст указывает на внутренний источник замыслов, но не требует доктринально узкого различения души и ума.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной интонацией придворной похвалы. Сохранены гипербола, лесть и лексическая напряжённость выражений о хитроумии, благости и знании; тяжеловесные греческие обороты слегка сглажены ради естественности.
