  source_fidelity: 'Основной смысл передан верно: сохранены аористическое «мы слышали», широкое значение γῆ, исключительность μόνος и хвалебные характеристики правителя. Однако πανουργεύματα — множественное число и обозначает прежде всего хитроумные замыслы/уловки, а не абстрактное «хитроумие». «Военные силы» в сочетании «удивителен в военных силах» неясно передаёт ἐν στρατεύμασιν πολέμου и звучит как характеристика сил, а не действий правителя; «в военных походах» сохраняет военный и множественный смысл.'
