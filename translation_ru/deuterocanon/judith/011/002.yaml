base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/002.yaml
  text: And now[a], if your people who live in the hill country had not treated me with contempt, I would not have raised my spear against them; but they themselves have brought these things on themselves.
translation:
  language: ru
  text: И теперь народ твой, живущий в нагорье, — если бы они не отнеслись ко мне с презрением[a], я не поднял бы против них своего копья; но они сами навлекли всё это на себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пренебрегли мной», «не оскорбили меня». Греческий глагол означает относиться к кому-либо как к незначительному, недостойному внимания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαός σου
  choice: народ твой
  rationale: λαός обозначает народ как единое целое; порядок слов сохраняет возвышенную прямую речь и при этом остаётся естественным по-русски.
- source_word: ὁ κατοικῶν τὴν ὀρεινήν
  choice: живущий в нагорье
  rationale: Субстантивированное ἡ ὀρεινή означает горную, возвышенную область; «нагорье» кратко и естественно передаёт географический смысл.
- source_word: εἰ μὴ ἐφαύλισάν με
  choice: если бы они не отнеслись ко мне с презрением
  rationale: ἐφαυλίζω означает считать маловажным, пренебрегать, выказывать презрение. Такая формулировка передаёт отношение к говорящему и сохраняет условие, противоречащее факту.
- source_word: οὐκ ἂν ἦρα
  choice: я не поднял бы
  rationale: Сочетание аориста с ἄν выражает нереальное следствие; αἴρω с оружием естественно передаётся глаголом «поднять».
- source_word: τὸ δόρυ μου
  choice: своего копья
  rationale: δόρυ в военном контексте — «копьё»; возвратное «своего» естественно соотносит оружие с подлежащим первого лица.
- source_word: ἐπʼ αὐτούς
  choice: против них
  rationale: ἐπί с винительным при враждебном действии означает направленность против кого-либо.
- source_word: ἀλλὰ αὐτοὶ ἑαυτοῖς ἐποίησαν ταῦτα
  choice: но они сами навлекли это на себя
  rationale: Фраза подчёркивает собственную ответственность и самообусловленное последствие. Единственное «это» идиоматично обобщает ταῦτα без добавления причины или характера бедствия.
theological_decisions:
- issue: Степень явности в утверждении о виновности в заключительной части
  choice: они сами навлекли это на себя
  alternative: они сами сделали это себе
  rationale: Перевод ясно сохраняет мысль о последствиях, вызванных их собственными действиями, но не добавляет отсутствующих в тексте указаний на Божий суд, судьбу или иной механизм воздаяния.
