base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/001.yaml
  text: And Holofernes said to her[a], “Take courage, woman; do not be afraid in your heart[c][b], for I have harmed no man who has chosen to serve King Nebuchadnezzar of all the earth.”
translation:
  language: ru
  text: 'И Олоферн сказал ей: «Ободрись, женщина, и не бойся в сердце своём, потому что я не причинял зла никому, кто решил служить Навуходоносору, царю всей земли[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «царь всей земли» выражают имперское притязание говорящего; греческое слово, переведённое как «земля», в других контекстах может также означать «страна».
    reason: cultural_note
lexical_decisions:
- source_word: Θάρσησον
  choice: Ободрись
  rationale: Повелительная форма передаёт призыв обрести уверенность и мужество; «ободрись» естественно звучит по-русски и сохраняет побудительную силу греческого слова.
- source_word: γύναι
  choice: женщина
  rationale: Прямое обращение без добавочной почтительности или смягчения; соответствует простому звательному употреблению греческого слова.
- source_word: μὴ φοβηθῇς τῇ καρδίᾳ σου
  choice: не бойся в сердце своём
  rationale: Сохранён явно выраженный внутренний характер страха и семитизированный оборот греческого текста, при этом фраза остаётся понятной современному читателю.
- source_word: ἐκάκωσα
  choice: не причинял зла
  rationale: Глагол κακόω имеет широкое значение причинения вреда или дурного обращения; такой перевод не ограничивает смысл только телесным насилием.
- source_word: ἄνθρωπον
  choice: никому
  rationale: В данном отрицательном обобщении естественное русское «никому» точно передаёт родовое значение единственного числа ἄνθρωπον и не сужает его до лиц мужского пола.
- source_word: ὅστις ἡρέτικεν
  choice: кто решил
  rationale: Форма от αἱρέω указывает на сделанный выбор; «решил» ясно и естественно передаёт результат принятого решения.
- source_word: δουλεύειν
  choice: служить
  rationale: В контексте политического подчинения царю «служить» передаёт смысл без неоправданного усиления до буквального рабства.
- source_word: βασιλεῖ Ναβουχοδονόσορ πάσης τῆς γῆς
  choice: Навуходоносору, царю всей земли
  rationale: Русский порядок слов естественно оформляет царский титул и сохраняет универсальный размах имперского притязания.
theological_decisions:
- issue: Имперское притязание в титуле Навуходоносора
  choice: царю всей земли
  alternative: царю всей страны
  rationale: γῆ допускает значения «земля» и «страна», но в данном царском титуле универсальная формулировка лучше передаёт гиперболическую имперскую риторику говорящего, не утверждая её истинность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Внутренний оборот «не бойся в сердце своём» намеренно сохранён как заметная особенность исходной фразы; синтаксис царского титула приспособлен к естественной русской речи.
