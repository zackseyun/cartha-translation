base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/016.yaml
  text: Therefore I[a], your servant, having learned all these things, fled from before them, and God sent me to do with you things at which the whole earth will be astonished[c][b], whenever they hear of them.
translation:
  language: ru
  text: Поэтому я, твоя служанка, узнав обо всём этом, бежала от них[a]. И Бог послал меня совершить вместе с тобой дела[b], от которых вся земля[c] придёт в изумление, когда люди услышат о них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «бежала от лица их»; то есть из их присутствия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сделать вместе с тобой нечто». Греческое выражение широко и не уточняет, какую именно роль предстоит сыграть Олоферну.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможные значения: «весь мир» или, в более узком смысле, «вся страна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅθεν
  choice: поэтому
  rationale: Передаёт причинно-следственный вывод из предшествующих слов естественным современным русским союзным наречием.
- source_word: ἡ δούλη σου
  choice: твоя служанка
  rationale: В устах Иудифи это почтительное обращение к Олоферну; «служанка» сохраняет уничижительную форму самоназвания, не навязывая буквального значения рабского статуса.
- source_word: ἐπιγνοῦσα ταῦτα πάντα
  choice: узнав обо всём этом
  rationale: Причастие обозначает знание, приобретённое до бегства; русский деепричастный оборот ясно сохраняет временную связь.
- source_word: ἀπέδρων ἀπὸ προσώπου αὐτῶν
  choice: бежала от них
  rationale: Передаёт решительное бегство; семитизированное буквальное «от лица их» в современном русском здесь было бы неестественно, а образ присутствия отмечен в сноске.
- source_word: ἀπέστειλέν με ὁ θεός
  choice: Бог послал меня
  rationale: Прямая передача заявления Иудифи о Божьем поручении без подтверждающего или скептического истолкования со стороны переводчика.
- source_word: ποιῆσαι μετὰ σοῦ πράγματα
  choice: совершить вместе с тобой дела
  rationale: Сохраняет широкое значение πράγματα и совместную конструкцию μετὰ σοῦ, не уточняя, выступает ли Олоферн соучастником, средством или иной стороной происходящего.
- source_word: ἐκστήσεται
  choice: придёт в изумление
  rationale: Выражает сильное потрясение и удивление, заложенное в глаголе, в естественной и достойной русской форме.
- source_word: πᾶσα ἡ γῆ
  choice: вся земля
  rationale: Сохраняет библейскую широту выражения и его возможную многозначность между землёй, миром и населённой страной.
- source_word: ὅσο ἐὰν ἀκούσωσιν αὐτά
  choice: когда о них услышат
  rationale: Безлично-личная форма множественного числа естественно подразумевает людей, которые услышат о делах, и соответствует числу греческого ἀκούσωσιν.
theological_decisions:
- issue: Заявление Иудифи о Божьем посланничестве
  choice: 'Передать прямо: «Бог послал меня»'
  alternative: Ослабить заявление словами «по её словам» или «как она считала»
  rationale: Текст прямо приводит речь Иудифи; перевод не должен ни удостоверять её заявление отдельно от повествования, ни ставить его под сомнение.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной речи. Обращение «твоя служанка» сохраняет придворную почтительность. Синтаксис несколько возвышенный, но понятный; неоднозначность роли Олоферна и объёма выражения «вся земля» сохранена и пояснена сносками.
