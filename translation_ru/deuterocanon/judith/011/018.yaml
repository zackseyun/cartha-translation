  text: And when I come[a], I will open the way before you, and you will go out with all your force, and there is none among them who will stand against you.
translation:
  language: ru
  text: И когда я приду[a], я заранее открою тебе путь; и ты выступишь со всеми своими силами, и никто из них не устоит перед тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И придя, я заранее открою тебе». В греческом глагол означает «открыть заранее», а слово «путь» прямо не названо и восполнено из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθοῦσα
  choice: когда я приду
  rationale: Аористное причастие женского рода относится к Иудифи и обозначает действие, предшествующее следующему; временное придаточное естественно передаёт это по-русски.
- source_word: προανοίσω
  choice: заранее открою тебе путь
  rationale: Будущее время от προανοίγω выражает открытие заранее. Прямое дополнение в греческом не названо; «путь» добавлено по контексту и отмечено сноской.
- source_word: ἐξελεύσῃ
  choice: ты выступишь
  rationale: В военном контексте «выступишь» естественно передаёт выход во главе сил, не уточняя способ передвижения.
- source_word: σὺν πάσῃ τῇ δυνάμει σου
  choice: со всем своим войском
  rationale: δύναμις может означать силу или военную силу; здесь обращение к военачальнику и предстоящий поход поддерживают собирательное «войско».
- source_word: οὐκ ἔστιν ὃς ἀντιστήσεταί σοι
  choice: никто ... не устоит перед тобой
  rationale: Сохраняется конкретный образ ἀνθίστημι — стоять против, сопротивляться; русское выражение естественно в военном контексте.
- source_word: ἐξ αὐτῶν
  choice: из них
  rationale: 'Передаёт партитивный смысл: ни один человек из противостоящей группы.'
