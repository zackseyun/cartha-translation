base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/011/019.yaml
  text: And I will lead you through the midst of Judea until you come opposite Jerusalem[a], and I will set your chariot in her midst, and you will drive them like sheep that have no shepherd, and not even a dog will growl with its tongue against you; for these things were spoken to me according to my foreknowledge, and they were reported to me[c][b], and I was sent to tell you.
translation:
  language: ru
  text: И я проведу тебя через Иудею, пока ты не придёшь к месту напротив Иерусалима[a]; и поставлю твою колесницу посреди Иерусалима, и ты поведёшь их, как овец без пастуха. Ни одна собака не зарычит на тебя[b], ибо всё это было сказано мне согласно тому, что я знала заранее[c], и сообщено мне; я была послана возвестить тебе об этом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Иерусалимом», «лицом к Иерусалиму».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ни одна собака не зарычит своим языком против тебя»; этот образ выражает полное отсутствие сопротивления.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «согласно моему предварительному знанию»; здесь не обязательно подразумевается специальное богословское понятие предведения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄξω
  choice: проведу
  rationale: Будущее время от ἄγω выражает личное сопровождение; «проведу» естественно сочетается с маршрутом через Иудею.
- source_word: διὰ μέσου τῆς Ἰουδαίας
  choice: через всю Иудею
  rationale: Передаёт движение через внутреннюю часть страны на современном русском без тяжеловесного «через середину Иудеи».
- source_word: ἕως τοῦ ἐλθεῖν ἀπέναντι Ἰερουσαλήμ
  choice: пока ты не окажешься перед Иерусалимом
  rationale: ἀπέναντι обозначает положение напротив или перед городом и не утверждает, что Олоферн уже войдёт в него.
- source_word: θήσω τὸν δίφρον σου
  choice: поставлю твою колесницу
  rationale: δίφρος может обозначать колесницу либо сиденье; военный контекст поддерживает «колесницу», при сохранении конкретного образа исходного текста.
- source_word: ἐν μέσῳ αὐτῆς
  choice: посреди города
  rationale: Местоимение относится к Иерусалиму; явное «города» устраняет неестественную для русского двусмысленность рода, не меняя референта.
- source_word: ἄξεις αὐτούς
  choice: поведёшь его жителей
  rationale: Местоимение «их» контекстуально указывает на жителей Иерусалима. «Поведёшь» сохраняет связь с образом стада и не усиливает насилие сверх греческого текста.
- source_word: ὡς πρόβατα οἷς οὐκ ἔστιν ποιμήν
  choice: словно овец без пастуха
  rationale: Краткая и узнаваемая библейская формула естественно передаёт образ беззащитного народа без руководителя.
- source_word: οὐ γρύξει κύων τῇ γλώσσῃ αὐτοῦ ἀπέναντι σου
  choice: ни одна собака не зарычит на тебя
  rationale: γρύζω означает рычать или ворчать. Основной текст передаёт образ естественно по-русски, а буквальное упоминание языка и смысл полного отсутствия сопротивления отмечены в сноске.
- source_word: κατὰ πρόγνωσίν μου
  choice: согласно моему знанию наперёд
  rationale: Так сохраняется значение предварительного знания без русского богословского термина «предведение», который мог бы неоправданно придать словам Иудифи специальный доктринальный смысл.
- source_word: ἀπηγγέλη μοι
  choice: возвещено мне
  rationale: Страдательная форма сохраняет неопределённость относительно того, кем именно сведения были сообщены Иудифи.
- source_word: ἀπεστάλην ἀναγγεῖλαί σοι
  choice: я была послана сообщить это тебе
  rationale: Передаёт как поручение, выраженное ἀπεστάλην, так и цель сообщения, не уточняя отправителя.
theological_decisions:
- issue: Значение πρόγνωσις в речи Иудифи
  choice: «знание наперёд» — предварительное знание без технического богословского оттенка
  alternative: «предведение», «предчувствие» или особое откровение
  rationale: Контекст допускает притязание на заранее полученное знание, но сам термин не требует понимать его как специальное учение о божественном предведении или как предчувствие.
- issue: Источник сообщённого Иудифи знания
  choice: 'Сохранена страдательная и неопределённая формулировка: «было сказано… возвещено… была послана»'
  alternative: Прямо назвать Бога источником откровения и отправителем
  rationale: Греческий стих не называет действующего лица; его уточнение устранило бы намеренную или контекстуальную неопределённость речи Иудифи.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной речи. Синтаксис слегка упрощён ради ясности, но сохранены военный образ колесницы, пастушеское сравнение, пассивные формулы получения вести и неопределённость её источника.
