  text: But against those who disobey, your eye shall not spare; you shall give them over to slaughter and plunder throughout all your land.
translation:
  language: ru
  text: 'А тех, кто не повинуется, пусть не щадит твой глаз: предай их на избиение и разграбление по всей твоей земле.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀπειθοῦντας
  choice: тех, кто не повинуется
  rationale: Передаёт причастие настоящего времени ἀπειθέω как продолжающееся неповиновение, не сужая значение до неверия.
- source_word: οὐ φείσεται ὁ ὀφθαλμός σου
  choice: пусть не щадит твой глаз
  rationale: Сохраняет семитизированный образ глаза как выражение жалости и пощады; в контексте распоряжения форма «пусть не щадит» естественно передаёт предписывающую силу будущего времени.
- source_word: δοῦναι αὐτοὺς
  choice: предай их
  rationale: Инфинитив зависит от предшествующего распоряжения и выражает требуемое действие; русский императив делает синтаксическую связь ясной.
- source_word: εἰς φόνον καὶ ἁρπαγήν
  choice: на избиение и разграбление
  rationale: φόνος здесь обозначает насильственное умерщвление, а ἁρπαγή — захват и расхищение имущества; формулировка сохраняет суровость исходного текста.
- source_word: ἐν πάσῃ τῇ γῇ σου
  choice: по всей твоей земле
  rationale: «По всей» естественно передаёт пространственную распределённость действия по территории, выраженную ἐν πάσῃ.
theological_decisions:
- issue: Образ «глаз не щадит»
  choice: 'сохранить буквально: «пусть не щадит твой глаз»'
  alternative: «не щади их»
  rationale: Исходный текст намеренно использует образ глаза; его сохранение не привносит толкования и поддерживает библейскую образность.
- issue: Модальность οὐ φείσεται
  choice: передать как повеление в контексте царского приказа
  alternative: «твой глаз не пощадит»
  rationale: Греческая форма является будущим временем, но в последовательности предписаний имеет волитивную силу. Русское буквальное будущее могло бы ошибочно прозвучать как простое предсказание.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно библейской образностью. Синтаксис ясен для широкого читателя; архаизмы и конфессионально окрашенная терминология не используются.
