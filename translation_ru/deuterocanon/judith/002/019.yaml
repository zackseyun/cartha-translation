    text: Греческое γῆ может означать и землю, территорию, и Землю; в данном военном контексте предпочтительно значение территории, по которой продвигается войско.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν … εἰς πορείαν
  choice: выступили в поход
  rationale: Сочетание глагола движения с εἰς πορείαν в военном контексте обозначает отправление в поход; русский оборот передаёт это естественно и без лишней конкретизации.
- source_word: πᾶσα ἡ δύναμις αὐτοῦ
  choice: всё его войско
  rationale: δύναμις может означать силу или военные силы; перечисление колесниц, всадников и пеших воинов ясно указывает здесь на войско.
- source_word: τοῦ προελθεῖν
  choice: чтобы идти впереди
  rationale: 'Передано значение цели и сохранена возможная смысловая широта προέρχομαι: идти перед кем-либо или опережать его, без уточнения характера этого предшествования.'
- source_word: καλύψαι πᾶν τὸ πρόσωπον τῆς γῆς
  choice: покрыть всю поверхность земли
  rationale: Сохранён пространственный образ полного заполнения территории; «покрыть» менее толковательно, чем «захватить» или «наводнить».
- source_word: πρὸς δυσμαῖς
  choice: на западе
  rationale: Кратко и естественно передаёт западное направление или расположение описываемой территории.
- source_word: ἅρμασι καὶ ἱππεῦσι καὶ πεζοῖς ἐπιλέκτοις αὐτοῦ
  choice: колесницами, всадниками и своими отборными пешими воинами
  rationale: Военные обозначения переданы прозрачно; ἐπιλέκτοις означает специально отобранных воинов, а не обязательно подразделение в современном смысле слова «элита».
