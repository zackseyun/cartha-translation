  text: And he himself and all his force set out on the march to go before King Nebuchadnezzar and to cover the whole face of the land toward the west with his chariots and horsemen and his chosen foot soldiers[a].
translation:
  language: ru
  text: Он сам и всё его войско выступили в поход к западу, чтобы идти впереди царя Навуходоносора и покрыть всю поверхность земли[a] колесницами, всадниками и своими отборными пешими воинами.
  philosophy: optimal-equivalence
  footnotes:
