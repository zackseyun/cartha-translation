base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/005.yaml
  text: 'Thus says the great king[a], the lord of all the earth: Behold, you shall go out from my presence, and you shall take with yourself men confident in their strength, one hundred twenty thousand foot soldiers, and a multitude of horses with riders, one hundred twenty thousand.'
translation:
  language: ru
  text: 'Так говорит великий царь, владыка всей земли: «Вот, ты выйдешь от меня и возьмёшь с собой людей, полагающихся на свою силу: сто двадцать тысяч пеших воинов и множество коней со всадниками — сто двадцать тысяч[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «двенадцать мириад»; одна мириада равна десяти тысячам.'
    reason: Сноска сохраняет форму греческого числового выражения, тогда как в основном тексте дано его современное числовое значение.
lexical_decisions:
- source_word: Τάδε λέγει
  choice: Так говорит
  rationale: Устойчивая формула торжественного провозглашения, естественная для русского библейского повествования и близкая к греческому тексту.
- source_word: ὁ βασιλεὺς ὁ μέγας
  choice: великий царь
  rationale: Прямо передаёт царский титул и сохраняет возвышенный придворный стиль.
- source_word: ὁ κύριος πάσης τῆς γῆς
  choice: владыка всей земли
  rationale: «Владыка» передаёт κύριος как титул верховной власти; строчная буква показывает, что это притязание земного царя, а не имя Бога. Всеобщий оборот πάσης τῆς γῆς передан как «всей земли».
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Современное и при этом торжественное средство привлечения внимания, сохраняющее указательную силу греческого слова.
- source_word: ἐξελεύσῃ ἐκ τοῦ προσώπου μου
  choice: ты выйдешь от меня
  rationale: Естественно передаёт царское повеление отправиться из присутствия говорящего, не воспроизводя буквально неестественное по-русски «от моего лица».
- source_word: λήμψῃ μετὰ σεαυτοῦ
  choice: возьмёшь с собой
  rationale: Точно и идиоматично передаёт значение сопровождения.
- source_word: ἄνδρας πεποιθότας ἐν ἰσχύι αὐτῶν
  choice: людей, полагающихся на свою силу
  rationale: Причастие πεποιθότας обозначает уверенность или опору на собственную силу, а не просто физическую крепость.
- source_word: πεζῶν εἰς χιλιάδας ἑκατὸν εἴκοσι
  choice: сто двадцать тысяч пеших воинов
  rationale: Передаёт военное значение πεζῶν и естественно оформляет греческое числительное.
- source_word: πλῆθος ἵππων σὺν ἀναβάταις
  choice: множество коней со всадниками
  rationale: Сохраняет конкретный греческий образ коней и находящихся на них всадников, не сводя выражение к абстрактному слову «конница».
- source_word: μυριάδας δέκα δύο
  choice: сто двадцать тысяч
  rationale: Двенадцать греческих мириад равны 120 000; числовое значение передано понятным современному читателю способом, а исходная форма отмечена в сноске.
theological_decisions:
- issue: Передача κύριος применительно к земному царю
  choice: владыка
  alternative: господин
  rationale: «Владыка» сохраняет силу царского титула и притязание на всеобщую власть, тогда как строчная буква и контекст не позволяют принять его за божественный титул.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном царского указа. Кавычки обозначают прямую речь. Синтаксис сохраняет нарастание перечня войск, но избегает буквализмов вроде «от моего лица» и малопонятного без пояснения слова «мириада».
