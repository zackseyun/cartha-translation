  text: of the strongholds of upper Cilicia. And he took all his forces[a], the foot soldiers and the horsemen and his chariots, and went away into the hill country.
translation:
  language: ru
  text: укреплений Верхней Киликии[a]. И он взял всё своё войско — пеших воинов, всадников и свои колесницы — и отправился в горную область.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальные слова «укреплений Верхней Киликии» в сохранившемся здесь греческом тексте представляют собой фрагмент предложения и, по-видимому, завершают мысль предыдущего стиха.
    reason: textual_variant
lexical_decisions:
- source_word: στερᾶς
  choice: укреплений
  rationale: В данном военном и географическом контексте форма обозначает укреплённые места или опорные пункты. Родительный падеж сохраняет синтаксическую связь фрагмента с предыдущим стихом.
- source_word: ἄνω Κιλικίας
  choice: Верхней Киликии
  rationale: ἄνω имеет географическое значение «верхняя»; «Верхняя Киликия» — естественное русское обозначение области.
- source_word: πᾶσαν τὴν δύναμιν αὐτοῦ
  choice: всё своё войско
  rationale: В военном контексте δύναμις означает совокупность вооружённых сил, далее перечисленных как пешие воины, всадники и колесницы. «Войско» звучит естественно и не передаёт здесь отвлечённого значения «сила».
- source_word: τοὺς πεζοὺς
  choice: пеших воинов
  rationale: Передаёт воинов, сражающихся пешими, ясно и без излишне специального термина.
- source_word: τοὺς ἱππεῖς
  choice: всадников
  rationale: Сохраняет конкретный образ конных воинов и соответствует обычному значению греческого слова.
- source_word: τὰ ἅρματα αὐτοῦ
  choice: свои колесницы
  rationale: ἅρματα в данном военном контексте означает колесницы; уточнение «боевые» не добавлено, поскольку его нет в тексте.
- source_word: ἀπῆλθεν
  choice: отправился
  rationale: Передаёт уход из прежнего места и последующее движение к названной области естественным современным русским глаголом.
- source_word: εἰς τὴν ὀρεινήν
  choice: в горную область
  rationale: Субстантивированное прилагательное обозначает гористую местность или область; перевод сохраняет географический смысл без чрезмерной конкретизации.
