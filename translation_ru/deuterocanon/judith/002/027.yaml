  text: And he went down into the plain of Damascus in the days of the wheat harvest[a], and he set all their fields on fire; their flocks and herds he gave over to destruction, and he plundered their cities and stripped bare their plains, and struck down all their young men with the edge of the sword.
translation:
  language: ru
  text: И он спустился на Дамасскую равнину во время жатвы пшеницы и поджёг все их поля; их мелкий и крупный скот обрёк на уничтожение, их города разграбил, опустошил их равнины дочиста и всех их юношей поразил остриём меча[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «устами меча» — оборот, означающий гибель от меча.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη
  choice: спустился
  rationale: Сохраняет выраженное глаголом направление движения и естественно звучит по-русски.
- source_word: πεδίον Δαμασκοῦ
  choice: Дамасская равнина
  rationale: πεδίον обозначает равнинную открытую местность, а родительный падеж Δαμασκοῦ задаёт её географическую принадлежность.
- source_word: ἐν ἡμέραις θερισμοῦ πυρῶν
  choice: во время жатвы пшеницы
  rationale: Передаёт сезонное значение оборота и сохраняет конкретное указание πυρῶν на пшеницу.
- source_word: ἐνέπρησεν πάντας τοὺς ἀγροὺς
  choice: поджёг все их поля
  rationale: «Поджёг» передаёт каузативный смысл предания огню, а «поля» соответствует сельскохозяйственному контексту ἀγρούς.
- source_word: τὰ ποίμνια καὶ τὰ βουκόλια
  choice: мелкий и крупный скот
  rationale: Естественная русская парная формула сохраняет различие между стадами овец или коз и стадами крупного рогатого скота.
- source_word: ἔδωκεν εἰς ἀφανισμόν
  choice: обрёк на уничтожение
  rationale: Передаёт конструкцию «отдал на уничтожение» естественным русским выражением и сохраняет предельную суровость действия.
- source_word: ἐσκύλευσεν
  choice: разграбил
  rationale: Точно передаёт захват добычи и уместно сочетается с городами.
- source_word: τὰ πεδία αὐτῶν ἐξελίκμησεν
  choice: их равнины опустошил дочиста
  rationale: Сохраняет отличие πεδία от ранее упомянутых ἀγρούς и передаёт образ полного очищения или разорения, заложенный в ἐξελίκμησεν.
- source_word: νεανίσκους
  choice: молодых мужчин
  rationale: Прямо передаёт возрастное и половое значение слова, не добавляя отсутствующего в тексте указания на воинов.
- source_word: ἐν στόματι ῥομφαίας
  choice: остриём меча
  rationale: Естественный русский эквивалент греческой военной идиомы; буквальный образ пояснён в сноске.
