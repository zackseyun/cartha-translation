  yaml_path: translation/deuterocanon/judith/002/015.yaml
  text: 'And he counted chosen men for battle formation[a], just as his lord had commanded him: one hundred twenty thousand, and twelve thousand mounted archers,'
translation:
  language: ru
  text: 'И сосчитал он отборных воинов для боевого строя, как повелел ему его господин: сто двадцать тысяч[a], а также двенадцать тысяч конных лучников.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом: «двенадцать мириад» и «двенадцать тысяч»; одна мириада — десять тысяч.'
    reason: Сноска сохраняет форму обоих греческих числовых выражений, тогда как основной текст передаёт их современными числовыми итогами.
lexical_decisions:
- source_word: ἠρίθμησεν
  choice: отобрал
  rationale: Буквально глагол означает «сосчитал, перечислил»; в данном военном контексте речь идёт о выделении установленного числа людей. «Отобрал» естественно сочетается с «избранными воинами», хотя конкретное количество сохраняется далее.
- source_word: ἐκλεκτοὺς ἄνδρας
  choice: избранных воинов
  rationale: Прилагательное обозначает отборных, избранных людей, а контекст боевого построения позволяет естественно передать ἄνδρας как «воинов», не меняя мужского множественного значения.
- source_word: εἰς παράταξιν
  choice: для боевого строя
  rationale: παράταξις означает построение или боевой порядок; выбранная формулировка ясна современному читателю и сохраняет военный смысл.
- source_word: καθότι
  choice: как
  rationale: Кратко и естественно передаёт соответствие действия полученному приказу.
- source_word: ὁ κύριος αὐτοῦ
  choice: его господин
  rationale: Здесь κύριος обозначает человеческого повелителя Олоферна, а не Бога; строчная буква сохраняет это различие.
- source_word: εἰς μυριάδας δέκα δύο
  choice: сто двадцать тысяч
  rationale: Греческое выражение буквально означает «двенадцать мириад», то есть 120 000; итоговое число понятнее современному русскому читателю.
- source_word: ἱππεῖς τοξότας
  choice: конных лучников
  rationale: Передаёт сочетание всадников и лучников естественным русским военным термином.
- source_word: μυρίους δισχιλίους
  choice: двенадцать тысяч
  rationale: Сочетание «десять тысяч и две тысячи» даёт итоговое число 12 000, которое естественно выражено одним числительным.
theological_decisions:
- issue: Значение κύριος в недивинном контексте военной иерархии
  choice: его господин
  alternative: его повелитель
  rationale: Референтом является земной правитель, отдавший приказ Олоферну. «Господин» сохраняет значение власти и подчинения, а строчная буква исключает ошибочное указание на Бога.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Военная терминология передана ясно и без архаизации; человеческий титул «господин» написан со строчной буквы.
