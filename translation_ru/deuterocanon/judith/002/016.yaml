  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И он приказал им построиться так, как выстраивается к войне множество воинов». Глагол διέταξεν может означать как «расположил, выстроил», так и «приказал»; συντάσσεται — военный термин, обозначающий построение в боевой порядок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέταξεν
  choice: выстроил
  rationale: В данном военном контексте глагол обозначает организацию и построение людей; «выстроил» естественно передаёт это действие, сохраняя возможность оттенка распоряжения в примечании.
- source_word: αὐτούς
  choice: их
  rationale: Прямое дополнение, относящееся к ранее упомянутым силам; местоимение сохраняет связность контекста.
- source_word: ὃν τρόπον
  choice: так, как
  rationale: Идиома вводит сравнение по образу действия; «так, как» естественно звучит по-русски.
- source_word: πολέμου
  choice: для войны
  rationale: Генитив указывает на военное назначение построения; «для войны» сохраняет более широкое значение, чем «для битвы».
- source_word: πλῆθος
  choice: множество воинов
  rationale: Буквально существительное означает «множество». Добавление «воинов» ясно выражает подразумеваемый военным контекстом референт, не заменяя его более конкретным словом «войско».
- source_word: συντάσσεται
  choice: выстраивают
  rationale: В военном употреблении глагол означает построение или размещение в боевом порядке; неопределённо-личная форма естественно передаёт греческий пассив.
