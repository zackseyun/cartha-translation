lexical_decisions:
- source_word: κατελάβετο
  choice: захватил
  rationale: Средняя форма καταλαμβάνω в данном военном контексте означает овладение территорией; «захватил» передаёт и установление контроля, и применение силы.
- source_word: τὰ ὅρια τῆς Κιλικίας
  choice: земли Киликии
  rationale: Хотя ὅρια буквально означает «границы, пределы», здесь слово метонимически обозначает территорию Киликии; «земли» естественно передаёт этот смысл по-русски.
- source_word: κατέκοψε
  choice: перебил
  rationale: Глагол обозначает насильственное истребление, буквально — «изрубил»; «перебил» сохраняет военную резкость образа без неестественной буквальности.
- source_word: πάντας τοὺς ἀντιστάντας αὐτῷ
  choice: всех, кто ему сопротивлялся
  rationale: Причастие ἀντιστάντας указывает на активное сопротивление; выбранная формулировка ясна и точно сохраняет этот смысл.
- source_word: ἦλθεν ἕως ὁρίων
  choice: дошёл до границ
  rationale: Во втором употреблении ὅρια указывает именно на предел продвижения, поэтому буквальное «границы» уместно.
- source_word: Ἰάφεθ
  choice: Иафета
  rationale: Сохранено засвидетельствованное греческим текстом имя Ἰάφεθ в принятой русской библейской форме без исправления на более известный топоним.
- source_word: τὰ πρὸς νότον
  choice: что к югу
  rationale: Оборот обозначает южное положение или направление; формулировка сохраняет краткость исходного географического уточнения и не конкретизирует его сверх текста.
- source_word: κατὰ πρόσωπον τῆς Ἀραβίας
  choice: напротив Аравии
  rationale: Устойчивый географический оборот κατὰ πρόσωπον означает «напротив, лицом к»; «напротив Аравии» естественно звучит по-русски.
