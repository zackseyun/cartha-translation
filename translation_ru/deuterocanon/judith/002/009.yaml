lexical_decisions:
- source_word: ἄξω
  choice: уведу
  rationale: Будущее время от ἄγω означает «вести, уводить, приводить». В контексте плена «уведу» естественно передаёт насильственное перемещение пленников, не добавляя не выраженных в греческом подробностей.
- source_word: αἰχμαλωσίαν
  choice: пленников
  rationale: Существительное может обозначать как состояние плена, так и совокупность пленённых. С глаголом движения и местоимением αὐτῶν конкретное значение «их пленников» наиболее естественно, но абстрактное значение сохранено в сноске.
- source_word: ἐπὶ τὰ ἄκρα
  choice: на край
  rationale: Выражение обозначает удалённые пределы. Русское «на край всей земли» сохраняет пространственный образ и звучит естественнее буквального «к оконечностям».
- source_word: πάσης τῆς γῆς
  choice: всей земли
  rationale: γῆ допускает значения «земля» и «страна». В сочетании с образом края и в контексте всеохватного притязания выбрано «всей земли», при этом локальная возможность отмечена в сноске.
