lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: И они тоже
  rationale: 'Передаёт соединительную, усилительную и добавочную силу оборота: они также присоединились к этому решению.'
- source_word: ἔκριναν
  choice: решили
  rationale: В данном повествовательном контексте глагол обозначает принятое решение; «решили» естественно по-русски и не превращает его без необходимости в формальный приговор или указ.
- source_word: ὀλεθρεῦσαι
  choice: истребить
  rationale: Передаёт намерение погубить или уничтожить; «истребить» сохраняет суровую силу греческого глагола и подходит к объекту «всякую плоть».
- source_word: πᾶσαν σάρκα
  choice: всякую плоть
  rationale: Сохраняет библейский идиоматический оборот и его всеохватность, не сужая значение до одного из возможных толкований.
- source_word: οἳ οὐκ ἠκολούθησαν
  choice: которая не последовала
  rationale: Сохраняет основной образ глагола ἀκολουθέω — следование; в сочетании со «словом» контекстуально подразумевается повиновение.
- source_word: τῷ λόγῳ
  choice: слову
  rationale: Не снимает многозначность λόγος между словом, повелением и приказом; смысл приказа становится понятен из контекста.
- source_word: τοῦ στόματος αὐτοῦ
  choice: его уст
  rationale: Близко передаёт греческий родительный оборот и сохраняет библейскую образность произнесённого властного слова.
theological_decisions:
- issue: Передача σάρξ в непавловском библейском идиоматическом обороте
  choice: всякую плоть
  alternative: всех людей; всех
  rationale: Здесь σάρξ не означает «греховную природу», а входит в собирательный оборот о живых существах или людях. Буквальная формулировка сохраняет широту и напряжённость исходного выражения.
- issue: Смысл λόγος как слова или приказа
  choice: слову
  alternative: повелению; приказу
  rationale: Греческое слово допускает оба оттенка. Основной текст сохраняет лексическую открытость, а возможный властный смысл указан в сноске.
translation_notes:
  register: Современный литературный русский с сохранением dignified библейской образности. Обороты «всякую плоть» и «слову его уст» намеренно несколько возвышенны, но понятны в контексте; сноски поясняют естественные смысловые альтернативы.
