  yaml_path: translation/deuterocanon/judith/002/028.yaml
  text: And fear and dread of him fell upon those living along the coast—those in Sidon and Tyre[a], those living in Assur and Ocina, and all those living in Jamnia[b]; and those living in Azotus and Ascalon were very greatly afraid of him.
translation:
  language: ru
  text: И страх и трепет перед ним охватили жителей побережья — тех, кто жил в Сидоне и Тире, жителей Ассура и Окины и всех жителей Иамнии; жители Азота и Аскалона[a] чрезвычайно испугались его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Азот — греческое название Ашдода, а Аскалон — греческое название Ашкелона.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέπεσεν
  choice: охватили
  rationale: Греческое ἐπιπίπτω буквально передаёт идею того, что нечто «обрушилось» или «напало»; с подлежащими «страх и трепет» русское «охватили» естественно и сохраняет внезапность и силу переживания.
- source_word: φόβος καὶ τρόμος αὐτοῦ
  choice: страх перед ним и трепет
  rationale: Пара φόβος καὶ τρόμος обозначает сильный ужас. Генитив αὐτοῦ указывает на того, кто внушает страх; «перед ним» ясно передаёт эту связь, не превращая её в отдельное причинное утверждение.
- source_word: τοὺς κατοικοῦντας τὴν παραλίαν
  choice: жителей побережья
  rationale: παραλία означает побережье или прибрежную область; краткое русское выражение точно и естественно передаёт оборот с κατοικέω.
- source_word: τοὺς ὄντας ἐν Σιδῶνι καὶ Τύρῳ
  choice: тех, кто был в Сидоне и Тире
  rationale: Причастие εἰμί обозначает нахождение в указанных городах. Такая формулировка сохраняет отличие этого оборота от повторяющегося κατοικοῦντας.
- source_word: Ἀσσούρ
  choice: Ассур
  rationale: Название передано транслитерацией греческой формы, без отождествления с более широкой областью Ассирии.
- source_word: Ὀκεινὰ
  choice: Окина
  rationale: Редкое и не вполне определённое географическое название передано близкой русской транслитерацией греческой формы.
- source_word: Ἰεμνάν
  choice: Иамния
  rationale: Использована укоренившаяся русская античная форма названия города, соответствующая греческому топониму.
- source_word: Ἀζώτῳ
  choice: Азот
  rationale: Сохранена эллинизированная форма топонима в соответствии с греческим источником; современное библейское соответствие указано в примечании.
- source_word: Ἀσκάλωνι
  choice: Аскалон
  rationale: Сохранена греческая форма названия; более знакомое соответствие указано в примечании.
- source_word: ἐφοβήθησαν αὐτὸν σφόδρα
  choice: чрезвычайно испугались его
  rationale: Глагол с прямым дополнением означает страх перед данным лицом, а σφόδρα выражает высокую степень; «чрезвычайно» передаёт усиление без тяжеловесного повтора.
