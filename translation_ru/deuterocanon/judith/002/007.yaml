  text: and to prepare earth and water[a], because I will go out against them in my wrath, and I will cover the whole face of the earth with the feet of my army, and I will give them over to plunder by them.
translation:
  language: ru
  text: и велеть приготовить землю и воду[a], потому что я выступлю против них в моей ярости и покрою всё лицо земли ногами моего войска, и отдам их им на разграбление.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Земля и вода», вероятно, означают знаки покорности, которых царь-завоеватель требовал от подвластных народов.
    reason: cultural_note
lexical_decisions:
- source_word: ἑτοιμάζειν
  choice: велеть приготовить
  rationale: Инфинитив продолжает ранее начатую последовательность распоряжений; по-русски добавление «велеть» естественно передаёт его зависимость от глагола приказания в контексте.
- source_word: γῆν καὶ ὕδωρ
  choice: землю и воду
  rationale: Сохранены конкретные существительные греческого текста и вероятная культурная аллюзия; её смысл поясняется в сноске.
- source_word: ἐξελεύσομαι
  choice: выступлю
  rationale: В военном контексте «выступлю» естественно передаёт буквальное «выйду», не добавляя указания на конкретный способ передвижения.
- source_word: ἐν θυμῷ μου
  choice: в ярости Моей
  rationale: θυμός обозначает сильный гнев; «ярость» соответствует напряжённой царской угрозе и возвышенному регистру.
- source_word: καλύψω πᾶν τὸ πρόσωπον τῆς γῆς
  choice: покрою всё лицо земли
  rationale: Сохранён библейский образ «лица земли» и гиперболический размах высказывания.
- source_word: τοῖς ποσὶν τῆς δυνάμεώς μου
  choice: ногами Моего войска
  rationale: δύναμις здесь означает военную силу, а «войско» ясно и естественно передаёт это значение; образ ног сохранён буквально.
- source_word: δώσω αὐτοὺς εἰς διαρπαγὴν αὐτοῖς
  choice: отдам их ему на разграбление
  rationale: Первое αὐτούς относится к покоряемым народам, а второе местоимение по смыслу — к собирательному «войску»; русский перевод сохраняет оба участника и передаёт цель конструкции εἰς διαρπαγήν естественным оборотом.
theological_decisions:
- issue: Идиоматический смысл выражения «земля и вода»
  choice: Оставить буквальное выражение в основном тексте и пояснить вероятный смысл в сноске.
  alternative: Перевести как «знаки покорности».
  rationale: Греческий текст называет конкретно землю и воду. Вероятную культурную коннотацию не следует превращать в однозначную парафразу, поэтому она вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения и притяжательные формы, относящиеся к говорящему царю, написаны с прописной буквы как элемент прямой царской речи, без придания говорящему божественного статуса.
