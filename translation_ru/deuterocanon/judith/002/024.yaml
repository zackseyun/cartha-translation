  yaml_path: translation/deuterocanon/judith/002/024.yaml
  text: And he crossed the Euphrates and passed through Mesopotamia[a], and he tore down all the high cities along the torrent Abrona[b], until he came to the sea.
translation:
  language: ru
  text: И он переправился через Евфрат, прошёл через Месопотамию и разрушил[a] все высоко расположенные города вдоль потока Аврона[b], пока не достиг моря.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проломил». Греческий глагол буквально означает «прокопал насквозь» и здесь, вероятно, описывает взятие или разрушение городов во время военного похода.'
    reason: lexical_alternative
  - marker: b
    text: «Поток Аврона» — переданное по звучанию греческое географическое название; его точное местоположение неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: παρῆλθεν
  choice: переправился через
  rationale: При прямом дополнении «Евфрат» в повествовании о передвижении глагол естественно обозначает пересечение реки.
- source_word: διῆλθεν
  choice: прошёл через
  rationale: Сочетание с названием области передаёт движение через Месопотамию.
- source_word: διέσκαψε
  choice: разрушил
  rationale: Буквально глагол значит «прокопал насквозь», но применительно к городам в военном походе указывает на проламывание укреплений и разрушение; буквальный образ отмечен в сноске.
- source_word: πόλεις τὰς ὑψηλάς
  choice: все высоко расположенные города
  rationale: Сохраняет буквальное значение ὑψηλάς — «высокие», не добавляя отсутствующего в тексте определения «укреплённые», и при этом звучит естественно по-русски.
- source_word: χειμάρρου
  choice: потока
  rationale: Слово обозначает бурный, часто сезонный водоток; «поток» понятно современному читателю и не навязывает более точной географической классификации.
- source_word: Ἀβρωνᾶ
  choice: Аврона
  rationale: Передаёт греческое географическое название транслитерацией, не отождествляя его с конкретным современным объектом.
- source_word: ἕως τοῦ ἐλθεῖν ἐπὶ θάλασσαν
  choice: пока не достиг моря
  rationale: Передаёт конечный пункт движения, выраженный конструкцией с ἕως и субстантивированным инфинитивом.
