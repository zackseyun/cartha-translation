lexical_decisions:
- source_word: ἔλαβεν
  choice: взял он
  rationale: 'Обычное повествовательное значение λαμβάνω: он взял животных с собой для похода; акцент на насильственном захвате отсутствует.'
- source_word: καμήλους καὶ ὄνους καὶ ἡμιόνους
  choice: верблюдов, ослов и мулов
  rationale: Прямые современные названия вьючных и перевозочных животных.
- source_word: εἰς τὴν ἀπαρτίαν αὐτῶν
  choice: для перевозки их снаряжения
  rationale: ἀπαρτία обозначает оснащение или полный комплект необходимого; упоминание верблюдов, ослов и мулов указывает на транспортировку походного снаряжения.
- source_word: πλῆθος πολὺ σφόδρα
  choice: великое множество
  rationale: Передаёт усиленное указание на чрезвычайно большое количество, оставаясь естественным для литературного русского языка.
- source_word: πρόβατα καὶ βόας καὶ αἶγας
  choice: овец, крупный рогатый скот и коз
  rationale: βόας в перечне животных, предназначенных для продовольственного обеспечения, лучше понимать широко как крупный рогатый скот, а не только как волов.
- source_word: εἰς τὴν παρασκευὴν αὐτῶν
  choice: для их продовольствия
  rationale: Хотя παρασκευή может означать приготовление или припасы вообще, в данном перечне пищевого скота речь, вероятнее всего, идёт о продовольственном обеспечении.
- source_word: ὧν οὐκ ἦν ἀριθμός
  choice: без числа
  rationale: Кратко сохраняет библейскую идиому, означающую неисчислимое количество.
