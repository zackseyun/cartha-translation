  text: And he summoned all his attendants and all his nobles[a], and he set before them the secret of his plan[b], and from his own mouth he declared all the evil of the land.
translation:
  language: ru
  text: И созвал он всех своих придворных и всех своих вельмож, и открыл им тайный замысел свой, и своими устами изложил всё зло земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение буквально: «всё зло земли». В данном контексте оно может означать зло, задуманное против земли, а не то, что сама земля была зла.'
    reason: alternative_reading
lexical_decisions:
- source_word: συνεκάλεσεν
  choice: созвал
  rationale: Передаёт значение совместного созыва и властный оттенок действия царя.
- source_word: θεράποντας
  choice: придворных
  rationale: В царском контексте речь идёт о людях, состоящих при правителе; это точнее и естественнее, чем более широкое «слуги».
- source_word: μεγιστᾶνας
  choice: вельмож
  rationale: Обозначает высокопоставленных лиц при дворе или в государстве; «вельможи» сохраняет возвышенный исторический регистр и понятно современному читателю.
- source_word: ἔθετο μετʼ αὐτῶν τὸ μυστήριον τῆς βουλῆς αὐτοῦ
  choice: открыл им тайный замысел свой
  rationale: Оборот означает сообщить или доверить нечто присутствующим; μυστήριον здесь — не богословская «тайна», а конфиденциальный замысел, а βουλή — план или намерение.
- source_word: συνετέλεσεν
  choice: изложил
  rationale: В сочетании с «своими устами» глагол, буквально связанный с доведением до полноты или завершения, указывает на полное словесное изложение.
- source_word: πᾶσαν τὴν κακίαν τῆς γῆς
  choice: всё зло, уготованное земле
  rationale: Контекст военного замысла позволяет понимать родительный оборот как зло, направленное против земли; добавление «уготованное» делает этот смысл естественным по-русски, а примечание сохраняет формальную неоднозначность.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: своими устами
  rationale: Естественная русская формула, сохраняющая акцент на личном и непосредственном высказывании правителя.
theological_decisions:
- issue: Смысл выражения πᾶσαν τὴν κακίαν τῆς γῆς
  choice: зло, уготованное земле
  alternative: всё зло земли
  rationale: Греческий родительный допускает формально более буквальное прочтение, но военно-политический контекст склоняет к злу, задуманному против земли. Неоднозначность отмечена в сноске, а не устранена без оговорки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным регистром. «Придворные» и «вельможи» передают царский контекст без излишней архаизации; инверсия «замысел свой» поддерживает библейскую торжественность, оставаясь понятной.
