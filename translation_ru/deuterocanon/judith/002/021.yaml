- source_word: ἐπῆλθον
  choice: прошли
  rationale: В контексте передвижения войска глагол обозначает продвижение по пути; «прошли» естественно сочетается с указанием расстояния и не усиливает военную окраску сверх греческого текста.
- source_word: ὁδὸν τριῶν ἡμερῶν
  choice: путь в три дня
  rationale: Идиома выражает расстояние, измеряемое временем в пути; русский оборот сохраняет этот смысл.
- source_word: ἐπὶ πρόσωπον τοῦ πεδίου
  choice: до места перед равниной
  rationale: Передаёт пространственное значение «перед, напротив лицевой стороны» без неестественной буквальности оборота «к лицу равнины».
- source_word: πεδίου
  choice: равниной
  rationale: В топографическом контексте πεδίον естественно означает равнину.
- source_word: Βαικτειλαίθ / Βαικτειλαὶθ
  choice: Баиктеилаиф
  rationale: Название транслитерировано с греческой формы и единообразно передано в обоих случаях; конечная θ передана как «ф» согласно укоренённой русской практике передачи греческих библейских имён.
- source_word: ἐπεστρατοπέδευσαν
  choice: расположились лагерем
  rationale: Глагол прямо обозначает устройство лагеря, нередко военного; выбран современный и ясный русский оборот.
- source_word: ἀπὸ Βαικτειλαὶθ
  choice: начиная от Баиктеилаифа
  rationale: Сохранено обычное исходное значение ἀπό («от»); добавление «начиная» делает синтаксис понятным, не устраняя топографической неясности.
- source_word: πλησίον τοῦ ὄρους
  choice: близ горы
  rationale: Точно и естественно передаёт пространственное значение «рядом с горой» в достойном повествовательном регистре.
- source_word: τοῦ ἐπʼ ἀριστερὰς
  choice: что слева от
  rationale: Предполагаемое продолжение оборота передано буквально как относительное положение, без замены на интерпретирующее «к западу».
- source_word: τῆς ἄνω Κιλικίας
  choice: Верхней Киликии
  rationale: Передаёт региональное обозначение и сохраняет синтаксическую связь с положением горы.
