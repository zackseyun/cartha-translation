  text: And you also must not transgress a single one of your lord’s words, but you shall surely carry out exactly as I have commanded you, and you shall not delay to do them.
translation:
  language: ru
  text: И ты не нарушь ни одного из слов своего господина, но непременно исполни всё в точности, как я повелел тебе, и не медли с их исполнением.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ παραβήσῃ
  choice: не нарушь
  rationale: παραβαίνω означает переступить, нарушить установленное требование. «Не нарушь» естественно передаёт запрет в современном русском языке и сохраняет образ обязательного слова.
- source_word: ἓν τι τῶν ῥημάτων
  choice: ни одного слова
  rationale: Сочетание подчёркивает, что нельзя нарушить даже отдельный пункт сказанного. «Ни одного слова» передаёт эту распределительную и усилительную силу.
- source_word: τοῦ κυρίου σου
  choice: своего господина
  rationale: κύριος здесь обозначает человеческого начальника в военной иерархии, а не Бога. Строчная буква и слово «господин» ясно передают этот смысл; возвратное «своего» естественно по-русски при подлежащем «ты».
- source_word: ἐπιτελῶν ἐπιτελέσεις
  choice: непременно исполни всё
  rationale: Повтор однокоренных форм усиливает требование полного и несомненного исполнения. Наречие «непременно» сохраняет эмфазу без неестественного русского повтора.
- source_word: καθότι προστέταχά σοι
  choice: в точности, как я повелел тебе
  rationale: καθότι выражает точное соответствие, а προστάσσω — властное повеление. Формулировка сохраняет военный характер речи.
- source_word: οὐ μακρυνεῖς
  choice: не медли
  rationale: В данном контексте μακρύνω означает затягивать или откладывать действие. «Не медли» кратко и естественно передаёт настоятельность приказа.
- source_word: τοῦ ποιῆσαι αὐτά
  choice: с их исполнением
  rationale: Оборот обозначает действия, которые нельзя откладывать; местоимение во множественном числе соотносится со всеми предписанными словами. Номинализация даёт естественное русское управление после «медлить».
theological_decisions:
- issue: Значение κύριος как обозначения человеческого начальника
  choice: господин
  alternative: владыка; начальник
  rationale: Контекст указывает на человеческого повелителя в военной иерархии. Поэтому слово дано со строчной буквы и не оформлено как божественный титул; «господин» при этом ближе всего сохраняет лексическое значение κύριος.
translation_notes:
  register: Современный литературный русский язык с достоинством приказной речи. Будущие формы греческого текста поняты как категорические предписания; усилительный повтор передан наречием «непременно».
