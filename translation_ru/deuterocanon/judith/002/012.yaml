  text: 'Ибо, как жив я, и могуществом моего царства клянусь[a]: я сказал — и всё это сделаю своей рукой[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза эллиптична; буквально: «жив я, и могущество моего царства». Добавленное «клянусь» раскрывает её клятвенную функцию. Слово κράτος может означать силу, могущество или властную мощь.'
