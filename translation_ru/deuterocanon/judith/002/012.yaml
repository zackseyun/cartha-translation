lexical_decisions:
- source_word: ὅτι
  choice: Ибо
  rationale: Союз вводит торжественное основание предшествующего заявления; «ибо» передаёт эту пояснительную силу.
- source_word: ζῶν ἐγώ
  choice: как жив я
  rationale: Это клятвенная формула; такой оборот сохраняет её торжественный характер и остаётся понятным по-русски.
- source_word: τὸ κράτος τῆς βασιλείας μου
  choice: могуществом моего царства
  rationale: κράτος обозначает силу, могущество или властную мощь; творительный падеж естественно выражает то, чем говорящий клянётся, а «царства» сохраняет прямое значение βασιλεία.
- source_word: λελάληκα
  choice: я сказал
  rationale: Перфект указывает на уже произнесённое слово, сохраняющее силу; в русском контексте это естественно передаётся совершенным видом.
- source_word: ποιήσω ταῦτα
  choice: сделаю это
  rationale: Передаёт широкое значение ποιέω и указание на ранее объявленные действия; русское единственное «это» естественно охватывает их совокупность.
- source_word: ἐν χειρί μου
  choice: своей рукой
  rationale: Сохраняет образ руки и выражает непосредственное личное действие говорящего без избыточного усиления.
theological_decisions:
- issue: Передача эллиптического царского самоудостоверения, имеющего характер клятвы
  choice: как жив я, и могуществом моего царства клянусь
  alternative: жив я и могущество моего царства
  rationale: В греческом после второго элемента нет явного сказуемого, поэтому конструкция допускает более буквальное, но по-русски неясное прочтение. Добавленное «клянусь» раскрывает клятвенную функцию фразы, не превращая могущество царства в отдельное живое существо; примечание сохраняет исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, царским тоном. Клятвенная эллиптическая конструкция раскрыта минимально ради ясности, а буквальная форма отмечена в сноске.
