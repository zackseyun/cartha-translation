translation:
  language: ru
  text: И продовольствие для каждого мужчины в изобилии, а также весьма много золота и серебра из дома царя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из царской казны» или «из царского дома»; буквально: «из дома царя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπισιτισμὸν
  choice: продовольствие
  rationale: Существительное обозначает снабжение, прежде всего запасами пищи; «продовольствие» естественно передаёт этот смысл, не сужая его до индивидуального пайка.
- source_word: παντὶ ἀνδρὶ
  choice: для каждого
  rationale: Греческое выражение имеет распределительное значение — «для каждого мужчины/человека». В военном контексте подразумеваются люди из войска, однако слово «воина» было бы более узким, чем оригинал.
- source_word: εἰς πλῆθος
  choice: в изобилии
  rationale: Оборот указывает на большое, достаточное количество и естественно передаётся устойчивым русским выражением «в изобилии».
- source_word: χρυσίον καὶ ἀργύριον
  choice: золото и серебро
  rationale: Прямое обозначение драгоценных металлов сохранено без добавления значения «деньги», которого греческий текст прямо не выражает.
- source_word: ἐξ οἴκου βασιλέως
  choice: из дома царя
  rationale: Сохранено буквальное и семантически открытое выражение «из дома царя»; контекст может подразумевать царскую казну или дворец, но оригинал этого не уточняет.
- source_word: σφόδρα
  choice: очень много
  rationale: Наречие усиливает количественное значение применительно к золоту и серебру; по-русски это естественно выражается сочетанием «очень много».
