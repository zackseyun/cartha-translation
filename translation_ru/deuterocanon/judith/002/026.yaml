  text: And he encircled all the sons of Midian[a], and burned their encampments[b], and plundered their sheepfolds.
translation:
  language: ru
  text: Он окружил всех сынов Мадиама[a], сжёг их становища и разграбил их загоны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех мадианитян». Буквально по-гречески: «всех сынов Мадиама».'
    reason: lexical_alternative
  - marker: b
