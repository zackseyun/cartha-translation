lexical_decisions:
- source_word: ἐκύκλωσεν
  choice: окружил
  rationale: Глагол κυκλόω обозначает окружение со всех сторон; «окружил» естественно передаёт здесь военное действие.
- source_word: πάντας τοὺς υἱοὺς Μαδιάμ
  choice: всех сынов Мадиама
  rationale: Сохранён буквальный библейский оборот «сыны Мадиама»; по смыслу речь идёт обо всех мадианитянах.
- source_word: ἐνέπρησεν
  choice: сжёг
  rationale: Кратко и точно передаёт действие поджога или сожжения, не добавляя прямо не выраженной идеи полного уничтожения.
- source_word: τὰ σκηνώματα
  choice: становища
  rationale: Слово указывает на шатровые жилища или места стоянки; «становища» сохраняет собирательный смысл и кочевой контекст.
- source_word: ἐπρονόμευσεν
  choice: разграбил
  rationale: Глагол означает захватить как добычу, разграбить; выбранное слово ясно передаёт военный контекст.
- source_word: τὰς μάνδρας
  choice: загоны
  rationale: μάνδρα — огороженное место для содержания животных; «загоны» не сужает значение только до овец.
