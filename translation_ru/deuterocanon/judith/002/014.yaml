  text: And Holofernes went out from the presence of his lord, and he called all the nobles and the generals and overseers of the Assyrian army,
translation:
  language: ru
  text: И Олоферн вышел от своего господина и созвал всех вельмож, военачальников и начальников ассирийского войска,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Прямо передаёт повествовательный аорист ἐξέρχομαι и сохраняет конкретное значение движения.
- source_word: ἀπὸ προσώπου τοῦ κυρίου αὐτοῦ
  choice: от своего господина
  rationale: 'Естественная русская передача семитизированного оборота «от лица своего господина»: Олоферн покинул присутствие своего правителя. Буквальное «от лица» в современном русском здесь могло бы быть неверно понято.'
- source_word: ἐκάλεσεν
  choice: созвал
  rationale: В данном контексте речь идёт о вызове группы должностных лиц для совместного сбора; «созвал» естественно и не добавляет излишней торжественности.
- source_word: δυνάστας
  choice: вельмож
  rationale: Обозначает влиятельных высокопоставленных людей; «вельможи» уместны в царском окружении и не сводят их роль к строго определённой должности.
- source_word: στρατηγοὺς
  choice: военачальников
  rationale: Передаёт военное руководство без навязывания современного формального звания «генерал».
- source_word: ἐπιστάτας
  choice: начальников
  rationale: Обозначает поставленных над другими руководителей или надзирателей; при войске «начальники» звучит естественно и сохраняет широту значения.
- source_word: τῆς δυνάμεως Ἀσσούρ
  choice: ассирийского войска
  rationale: δύναμις в военном повествовании означает войско, а Ἀσσούρ указывает на его принадлежность Ассирии; предложенная форма естественна по-русски.
theological_decisions:
- issue: Передача κύριος применительно к человеку
  choice: своего господина
  alternative: своего повелителя
  rationale: Здесь κύριος — титул человеческого владыки Олоферна, а не обозначение Бога. «Господин» сохраняет иерархический смысл, при этом контекст исключает божественное прочтение.
translation_notes:
  register: Современный литературный русский с умеренно торжественным историко-повествовательным оттенком. Синтаксис сохраняет последовательность греческого текста, но семитизированный оборот ἀπὸ προσώπου передан естественно. Конечная запятая сохранена, поскольку стих синтаксически продолжается.
