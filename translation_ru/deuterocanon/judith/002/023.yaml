lexical_decisions:
- source_word: διέκοψεν
  choice: сокрушил
  rationale: Глагол буквально передаёт рассечение или разрубание, а в военном контексте — нанесение сокрушительного поражения. «Сокрушил» сохраняет силу образа, не уточняя сверх текста, были ли народы полностью уничтожены.
- source_word: τὸ Φοὺδ καὶ Λούδ
  choice: Фуда и Луда
  rationale: Названия переданы транслитерацией греческих форм с русскими падежными окончаниями; это также соответствует привычной русской библейской форме этих имён.
- source_word: ἐπρονόμευσεν
  choice: разграбил
  rationale: Глагол обозначает захват военной добычи. «Разграбил» естественно передаёт военный и имущественный смысл.
- source_word: υἱοὺς πάντας Ῥασσεῖς
  choice: всех сынов Рассея
  rationale: Сохранена генеалогическая формула «сыны», а не введено предположительное название народа. Неясное собственное имя передано транслитерацией.
- source_word: υἱοὺς Ἰσμαὴλ
  choice: сынов Измаила
  rationale: Буквально сохранена генеалогически-этническая формулировка греческого текста; более краткое «измаильтян» дано в примечании как допустимый вариант.
- source_word: τοὺς κατὰ πρόσωπον τῆς ἐρήμου
  choice: находившихся напротив пустыни
  rationale: κατὰ πρόσωπον выражает положение напротив или перед чем-либо. Причастие «находившихся» делает греческую атрибутивную конструкцию естественной по-русски, не добавляя нового действия.
- source_word: πρὸς νότον τῆς Χαλδαίων
  choice: к югу от халдеев
  rationale: Передано направительно-пространственное значение πρὸς νότον при сохранении сжатости и некоторой географической неопределённости исходной фразы.
