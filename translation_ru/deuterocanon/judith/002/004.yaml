lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: И случилось так
  rationale: Передаёт обычную греческую повествовательную формулу без архаичного оборота «и было» и естественно вводит последующее событие.
- source_word: ὡς συνετέλεσεν
  choice: завершив
  rationale: Деепричастный оборот ясно передаёт завершённость предшествующего действия и сохраняет естественный порядок событий по-русски.
- source_word: τὴν βουλὴν αὐτοῦ
  choice: свой замысел
  rationale: «Замысел» естественно выражает намерение и план в военно-политическом контексте, не исключая более широких значений βουλή, отмеченных в сноске.
- source_word: ἐκάλεσεν
  choice: призвал
  rationale: Передаёт властный вызов царём своего военачальника и звучит естественно в данном повествовательном контексте.
- source_word: Ναβουχοδονοσὸρ βασιλεὺς Ἀσσυρίων
  choice: Навуходоносор, царь ассирийцев
  rationale: Сохраняет греческую аппозицию и прямо воспроизводит этническое обозначение.
- source_word: τὸν Ὀλοφέρνην
  choice: Олоферна
  rationale: Использована традиционная русская форма имени «Олоферн» в требуемом винительном падеже.
- source_word: ἀρχιστράτηγον
  choice: главнокомандующего
  rationale: Точно передаёт высшую военную должность, обозначенную составным греческим термином.
- source_word: τῆς δυνάμεως αὐτοῦ
  choice: своим войском
  rationale: В сочетании с военной должностью δύναμις обозначает вооружённые силы; «войско» ясно и естественно для современного русского текста.
- source_word: δεύτερον ὄντα μετʼ αὐτόν
  choice: занимавшего второе место после него
  rationale: Близко передаёт греческую конструкцию и ясно указывает на положение Олоферна непосредственно ниже царя.
- source_word: καὶ εἶπεν πρὸς αὐτόν
  choice: и сказал ему
  rationale: Прямой и естественный перевод обычной формулы, вводящей речь; двоеточие подготавливает следующий стих.
