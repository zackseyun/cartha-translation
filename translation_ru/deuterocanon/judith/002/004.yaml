  - marker: b
    text: 'Или: «военачальника»; греческое слово ἀρχιστράτηγος указывает на высшую военную должность.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «бывшего вторым после него», то есть стоявшего по положению сразу после царя.'
