  - severity: low
    issue: Начальный деепричастный оборот и формула «И случилось так» звучат тяжеловесно.
    rationale: Греческая временная конструкция ὡς συνετέλεσεν ясно называет действие царя; в русском лучше назвать Навуходоносора субъектом до глагола «завершил». Это также более плавно передаёт повествовательную формулу καὶ ἐγένετο.
