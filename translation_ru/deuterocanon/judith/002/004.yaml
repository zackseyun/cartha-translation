  text: And it happened[a], when he had finished his plan, that Nebuchadnezzar king of the Assyrians called Holofernes, the commander-in-chief of his forces, who was second after him, and said to him[c][b],
translation:
  language: ru
  text: 'И вот, когда Навуходоносор, царь ассирийцев, завершил свой замысел[a], он призвал Олоферна, главнокомандующего его войском[b], который был вторым после него[c], и сказал ему:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своё решение» или «свой план» (τὴν βουλὴν αὐτοῦ).'
