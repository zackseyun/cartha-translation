  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: многочисленное смешанное множество, его совместное движение с войском, оба образа неисчислимости («саранча» и «песок земной») и причинное объяснение невозможности счёта вследствие множества людей. «Им не было счёта» корректно выражает οὐκ ἦν ἀριθμός при сохранении причинного оттенка ἀπό.'
