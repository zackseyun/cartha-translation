base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/002/020.yaml
  text: And a great mixed multitude went out with them[a], like locusts and like the sand of the earth, for there was no number because of their multitude.
translation:
  language: ru
  text: И вместе с ними вышло великое смешанное множество — словно саранча и словно песок земной, — потому что от их многочисленности им не было счёта.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что их было так много, что сосчитать их было невозможно». Греческий оборот буквально говорит, что из-за их многочисленности им «не было числа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολὺς ὁ ἐπίμικτος
  choice: великое смешанное множество
  rationale: Сочетание обозначает многочисленную разнородную массу людей, сопровождавшую войско. «Множество» сохраняет собирательность, а «смешанное» — разнородный состав; «великое» передаёт πολὺς при собирательном существительном.
- source_word: συνεξῆλθον αὐτοῖς
  choice: вместе с ними вышло
  rationale: Передаёт совместное движение без добавления отсутствующей в самом глаголе военной конкретики вроде «выступило в поход».
- source_word: ὡς ἀκρίς
  choice: словно саранча
  rationale: В греческом стоит собирательный образ саранчи; русское единственное число естественно передаёт несметную массу насекомых.
- source_word: ὡς ἡ ἄμμος τῆς γῆς
  choice: словно песок земной
  rationale: Сохраняет библейский образ неисчислимого множества и буквально отражает родительное γῆς, не сужая его до берега или определённой местности.
- source_word: οὐ γὰρ ἦν ἀριθμὸς ἀπὸ πλήθους αὐτῶν
  choice: потому что от их многочисленности им не было счёта
  rationale: Естественный русский оборот сохраняет причинное значение ἀπό и смысл отсутствия возможности сосчитать множество.
