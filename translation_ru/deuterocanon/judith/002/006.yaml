lexical_decisions:
- source_word: ἐξελεύσῃ
  choice: выступишь
  rationale: Будущая форма ἐξέρχομαι в прямом приказании; «выступишь» естественно передаёт выход в поход, не добавляя более узкого значения вроде «нападёшь».
- source_word: εἰς συνάντησιν
  choice: навстречу
  rationale: Сохраняет обычное значение оборота «выйти навстречу»; в военном контексте подразумевается враждебное столкновение, но оно не внесено в текст явно.
- source_word: πάσῃ τῇ γῇ
  choice: всей земле
  rationale: Единственное число с πᾶς обозначает землю как территориальное целое; русский дательный также естественно сочетается с «навстречу».
- source_word: ἐπὶ δυσμᾶς
  choice: на западе
  rationale: Оборот может обозначать западную область или направление; в основном тексте выбрано естественное географическое прочтение, а направительное сохранено в примечании.
- source_word: ἠπείθησαν
  choice: не послушались
  rationale: Передаёт аорист ἀπειθέω как состоявшийся отказ повиноваться и естественно сочетается со «словом».
- source_word: τῷ ῥήματι τοῦ στόματός μου
  choice: слова моих уст
  rationale: Сохранён образный генитивный оборот, подчёркивающий устно высказанное повеление, без сведения его к нейтральному «приказу».
