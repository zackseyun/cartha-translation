revisions:
- from: И в восемнадцатый год, в двадцать второй день первого месяца, в доме Навуходоносора, царя ассирийцев, было принято решение[a] отомстить всей земле[b], как он и говорил.
  to: И в восемнадцатый год, в двадцать второй день первого месяца, в доме[a] Навуходоносора, царя ассирийцев, возникло решение[b] совершить возмездие над всей землёй[c], как он сказал.
  rationale: Перевод уточнён для более бережной передачи неопределённости ἐγένετο λόγος и для естественности русского синтаксиса. «Возникло решение» оставляет открытым вопрос, было ли это придворным обсуждением, решением или указом; сноска фиксирует альтернативы. Разделены примечания к οἶκος, ἐγένετο λόγος и γῆ, чтобы каждый якорь однозначно относился к поясняемому слову. «Совершить возмездие над всей землёй» передаёт направленность ἐκδικῆσαι без невыраженного возвратного местоимения и без сужения γῆ до одной страны.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:09:07Z'
