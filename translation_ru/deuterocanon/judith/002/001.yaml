  yaml_path: translation/deuterocanon/judith/002/001.yaml
  text: And in the eighteenth year[a], on the twenty-second day of the first month, a word came in the house of Nebuchodonosor king of the Assyrians, to take vengeance on all the land[c][b], just as he had spoken.
translation:
  language: ru
  text: И в восемнадцатый год, в двадцать второй день первого месяца, в доме[a] Навуходоносора, царя ассирийцев, возникло решение[b] совершить возмездие над всей землёй[c], как он сказал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во дворце» или «при царском дворе». Греческое слово οἶκος буквально означает «дом», но в данном контексте может обозначать царскую резиденцию или двор.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «возникло слово». Возможны также переводы: «было принято решение» или «был издан указ». Греческое выражение не уточняет характер этого слова или решения.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «над всей страной». Греческое γῆ может означать «землю» вообще, а также страну или территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἔτει τῷ ὀκτωκαιδεκάτῳ
  choice: в восемнадцатый год
  rationale: Сохраняет формальную датировочную конструкцию греческого текста и естественно звучит в русском библейском повествовании.
- source_word: δευτέρᾳ καὶ εἰκάδι τοῦ πρώτου μηνός
  choice: в двадцать второй день первого месяца
  rationale: Ясно передаёт греческое обозначение двадцать второго дня месяца.
- source_word: ἐγένετο λόγος
  choice: было принято решение
  rationale: В контексте царского дома выражение обозначает возникшее или принятое слово-решение. Буквальное «возникло слово» по-русски неясно; перевод сохраняет характер решения, не усиливая его до формального указа.
- source_word: ἐν οἴκῳ Ναβουχοδονοσὸρ
  choice: в доме Навуходоносора
  rationale: Прямо передаёт οἶκος и сохраняет возможность понимать его как царский дом, двор или дворец.
- source_word: βασιλέως Ἀσσυρίων
  choice: царя ассирийцев
  rationale: Следует форме греческого титула и естественен в современном русском языке.
- source_word: ἐκδικῆσαι
  choice: отомстить
  rationale: Передаёт значение возмездия без добавления отсутствующего в греческом тексте возвратного местоимения.
- source_word: πᾶσαν τὴν γῆν
  choice: всей земле
  rationale: Сохраняет неоднозначность γῆ между территорией и землёй в более широком смысле; контекст допускает территориальное понимание.
- source_word: καθὼς ἐλάλησεν
  choice: как он и говорил
  rationale: Естественно передаёт отсылку к прежним словам Навуходоносора, не уточняя сверх текста форму его заявления.
theological_decisions:
- issue: Характер выражения ἐγένετο λόγος в царском доме
  choice: было принято решение
  alternative: возникло слово; был издан указ
  rationale: «Решение» делает придворный контекст понятным, но не придаёт фразе более узкого значения официального указа; альтернативы отмечены в сноске.
- issue: Объём значения γῆ
  choice: всей земле
  alternative: всей стране; всей суше/всему миру
  rationale: Русское «земле» сохраняет лексическую широту оригинала и не навязывает ни строго локального, ни глобального толкования.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным строем. Начальное «И» сохранено как связка с предыдущим рассказом. Имена и титул переданы в традиционной русской библейской форме; синтаксис упрощён лишь настолько, чтобы стих оставался понятным обычному читателю.
