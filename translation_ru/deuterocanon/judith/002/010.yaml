  text: But you[a], after going out, shall seize all their territory in advance for me, and they will surrender themselves to you; and you shall keep them for me until the day of their punishment.
translation:
  language: ru
  text: Ты же, выступив, заранее захватишь для меня всю их территорию. Они сдадутся тебе, а ты сохранишь их для меня до дня их наказания[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до дня их обличения» либо «до дня их взыскания». Греческое слово ἐλεγμός может означать обличение, порицание или исправительное наказание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν
  choice: выступив
  rationale: Аористное причастие обозначает действие, предшествующее основному. В военном контексте «выступив» естественно передаёт выход в поход, не добавляя отдельного повеления.
- source_word: προκαταλήμψῃ
  choice: заранее захватишь
  rationale: Глагол выражает овладение чем-либо прежде или заблаговременно; перевод сохраняет как значение приставки προ-, так и силовой военный оттенок.
- source_word: πᾶν ὅριον αὐτῶν
  choice: всю их территорию
  rationale: ὅριον может обозначать границу, область или территорию. Здесь речь идёт о захвате подвластной им земли, а не только пограничной линии.
- source_word: ἐκδώσουσίν σοι ἑαυτούς
  choice: они сдадутся тебе
  rationale: Возвратная конструкция буквально означает, что они выдадут или предадут себя; «сдадутся» кратко и естественно передаёт добровольное подчинение в военном контексте.
- source_word: διατηρήσεις
  choice: сохранишь
  rationale: Глагол означает беречь, сохранять или удерживать. «Сохранишь» оставляет открытым, идёт ли речь о сохранении жизни или об удержании покорённых людей до назначенного срока.
- source_word: εἰς ἡμέραν ἐλεγμοῦ αὐτῶν
  choice: до дня их наказания
  rationale: В контексте военной угрозы ἐλεγμός вероятнее всего указывает на карательное взыскание. Предлог εἰς с обозначением дня естественно передан как «до дня».
theological_decisions:
- issue: Значение ἐλεγμός в военно-судебном контексте
  choice: наказание
  alternative: обличение; взыскание; вразумление
  rationale: «Наказание» ясно передаёт угрожающий карательный смысл данного контекста, не привнося специально эсхатологического значения. Более широкий диапазон слова сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Военная лексика ясна обычному читателю; синтаксис сохранён близким к греческой последовательности, но разделён на два предложения ради естественности.
