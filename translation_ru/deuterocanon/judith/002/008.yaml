  text: And their wounded will fill their ravines and the wadis, and a river overflowing will be filled with their dead;
translation:
  language: ru
  text: И раненые их наполнят их ущелья и русла сезонных потоков[a], и разливающаяся река наполнится их мертвецами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сезонные потоки» или «вади». Греческое слово может обозначать бурный поток, возникающий в дождливое время, либо русло такого потока.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τραυματίαι
  choice: раненые
  rationale: Существительное обозначает раненых людей; краткое субстантивированное прилагательное естественно по-русски и не расширяет значение до всех потерь.
- source_word: πληρώσουσιν
  choice: наполнят
  rationale: Прямо передаёт будущее время глагола πληρόω и сохраняет зримый образ множества павших.
- source_word: φάραγγας
  choice: ущелья
  rationale: φάραγξ обозначает ущелье или горную теснину; «ущелья» точно и понятно современному читателю.
- source_word: χειμάρρους
  choice: русла сезонных потоков
  rationale: χείμαρρος может обозначать сезонный бурный поток либо его русло. В данном контексте русла, которые могут наполниться ранеными, передают образ яснее, чем заимствованное «вади».
- source_word: ποταμὸς ἐπικλύζων
  choice: разливающаяся река
  rationale: Причастие ἐπικλύζων выражает разлив или затопление; настоящее причастие сохраняет незавершённый, разворачивающийся образ греческого текста.
- source_word: τοῖς νεκροῖς
  choice: их мертвецами
  rationale: νεκροί здесь означает мёртвых людей или трупы. «Мертвецами» сохраняет прямой и суровый образ, не заменяя его более широким понятием погибших.
