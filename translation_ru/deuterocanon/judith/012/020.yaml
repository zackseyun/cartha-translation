lexical_decisions:
- source_word: ἠυφράνθη
  choice: пришёл в восторг
  rationale: Форма передаёт возникшее у Олоферна состояние сильной радости или удовольствия; выражение естественно по-русски и уместно в контексте пира.
- source_word: ἀπʼ αὐτῆς
  choice: от неё
  rationale: 'Предлог ἀπό обозначает источник или причину: удовольствие Олоферна исходило от Иудифи или было вызвано ею. Русское «от неё» сохраняет эту смысловую открытость.'
- source_word: ἔπιεν οἶνον πολὺν σφόδρα
  choice: выпил чрезвычайно много вина
  rationale: Сочетание πολὺν σφόδρα усиленно подчёркивает чрезмерное количество выпитого; выбранная формулировка точно и естественно передаёт эту интенсивность.
- source_word: ὅσον οὐκ ἔπιεν πώποτε
  choice: столько, сколько ещё никогда не выпивал
  rationale: Сохраняется выраженное в греческом тексте сопоставление количества с любым прежним случаем.
- source_word: ἐν ἡμέρᾳ μιᾷ
  choice: за один день
  rationale: Естественная русская формулировка для количества, выпитого в пределах одного дня, с сохранением акцента на единичном дне.
- source_word: ἀφʼ οὗ ἐγεννήθη
  choice: с самого своего рождения
  rationale: Передаёт весь период жизни Олоферна от рождения до описываемого события и сохраняет усилительный смысл контекста.
