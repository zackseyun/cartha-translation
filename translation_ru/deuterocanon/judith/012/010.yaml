  text: And on the fourth day[a], Holofernes gave a banquet for his servants alone[b], and he did not invite any of those in attendance.
translation:
  language: ru
  text: На четвёртый день Олоферн устроил пир только для своих рабов[a] и не пригласил на него никого из тех, кто состоял при нём на службе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуг». Греческое слово δοῦλος может обозначать как раба, так и слугу; здесь основной перевод сохраняет выраженное этим словом зависимое положение.'
    reason: lexical_alternative
  - marker: b
    text: Греческий оборот не вполне однозначен; вероятно, речь идёт о людях, состоявших при Олоферне для обслуживания или иных необходимых дел.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῇ ἡμέρᾳ τῇ τετάρτῃ
  choice: На четвёртый день
  rationale: Обычный повествовательный оборот передан естественным русским указанием времени без буквального «и случилось».
- source_word: ἐποίησεν ... πότον
  choice: устроил пир
  rationale: πότος обозначает пиршество, в особенности сопровождаемое питьём; «устроил пир» естественно передаёт и событие, и роль Олоферна как устроителя.
- source_word: τοῖς δούλοις αὐτοῦ μόνοις
  choice: только для своих рабов[a]
  rationale: μόνοις ограничивает круг приглашённых, а δοῦλοι сохраняет указание на зависимое положение людей; возможное контекстуальное значение «слуги» отмечено в сноске.
- source_word: οὐκ ἐκάλεσεν εἰς τὴν χρῆσιν
  choice: не пригласил на него
  rationale: В контексте пира καλέω означает приглашение, а местоимение «на него» естественно соотносит не вполне ясное εἰς τὴν χρῆσιν с названным пиром.
- source_word: οὐδένα τῶν πρὸς ταῖς χρείαις
  choice: никого из тех, кто исполнял служебные обязанности[b]
  rationale: Выражение указывает на людей, занятых необходимыми делами или состоящих при службе, не уточняя их должности; перевод сохраняет эту общность.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование краткое и ясное. Слово «пир» сохраняет торжественно-исторический оттенок, не звуча архаично. Неясность заключительного греческого оборота не сведена к конкретной придворной должности.
