lexical_decisions:
- source_word: Πίε δὴ
  choice: Выпей же
  rationale: Аористный императив Πίε выражает прямое приглашение выпить, а частица δὴ придаёт ему настойчиво-побудительный оттенок, естественно передаваемый русским «же».
- source_word: γενήθητι μεθʼ ἡμῶν εἰς εὐφροσύνην
  choice: повеселись вместе с нами
  rationale: Буквально оборот говорит о том, чтобы быть или оказаться вместе с говорящими в веселье. Выбранная формулировка естественно передаёт приглашение участвовать в общем праздничном веселье, не добавляя отсутствующих в тексте деталей.
- source_word: Ὀλοφέρνης
  choice: Олоферн
  rationale: Имя передано в принятой русской библейской форме.
