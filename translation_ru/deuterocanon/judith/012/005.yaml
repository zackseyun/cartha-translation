lexical_decisions:
- source_word: θεράποντες
  choice: слуги
  rationale: Слово обозначает людей, состоящих при Олоферне и прислуживающих ему; «слуги» естественно звучит по-русски и само по себе не утверждает их рабского положения.
- source_word: σκηνήν
  choice: шатёр
  rationale: В контексте военного лагеря речь идёт о шатре; это точное и стилистически уместное обозначение.
- source_word: ὕπνωσεν
  choice: спала
  rationale: Аорист прямо сообщает о сне; простая форма «спала» естественно передаёт повествование.
- source_word: μέχρι μεσούσης τῆς νυκτός
  choice: до середины ночи
  rationale: Перевод сохраняет образное греческое выражение и не сводит его без необходимости к точному часовому обозначению «до полуночи».
- source_word: ἀνέστη
  choice: встала
  rationale: В данном контексте глагол означает, что Юдифь поднялась после сна; «встала» ясно и естественно.
- source_word: πρὸς τὴν ἑωθινὴν φυλακήν
  choice: к утренней страже
  rationale: Предлог πρός имеет здесь временное значение приближения к периоду утренней стражи; оборот сохраняет древнее деление ночи и некоторую широту временного указания.
