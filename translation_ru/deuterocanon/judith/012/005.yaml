  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: θεράποντες («слуги»), εἰς τὴν σκηνήν («в шатёр»), ὕπνωσεν μέχρι μεσούσης τῆς νυκτός («спала до середины ночи») и ἀνέστη πρὸς τὴν ἑωθινὴν φυλακήν («к утренней страже ... встала»). Оборот «к утренней страже» удачно сохраняет временную направленность πρός, не превращая её в чрезмерно точное «на рассвете».'
