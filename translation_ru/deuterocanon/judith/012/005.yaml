  text: And Holofernes’s attendants brought her into the tent[a], and she slept until the middle of the night; then she rose at the morning watch[b],
translation:
  language: ru
  text: И слуги Олоферна привели её в шатёр, и она спала до середины ночи; к утренней страже[a] она встала,
  philosophy: optimal-equivalence
