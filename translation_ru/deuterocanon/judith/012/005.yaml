  terminology: «Слуги» корректно передаёт θεράποντες в данном контексте, не добавляя утверждения о рабском статусе. «Шатёр» соответствует военному лагерному контексту. «Утренняя стража» — устоявшееся и понятное обозначение древнего ночного деления.
