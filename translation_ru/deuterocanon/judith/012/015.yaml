base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/015.yaml
  text: And after disrobing[a], she adorned herself with her garments and with all her feminine adornment; and her female servant came and spread out for her on the ground opposite Holofernes the fleeces that she had received from Bagoas for her daily use[c][b], so that she might recline on them while eating.
translation:
  language: ru
  text: Раздевшись[a], она нарядилась в свои одежды и надела все женские украшения. Её рабыня[b] подошла и расстелила для неё на земле напротив Олоферна овечьи шкуры, которые Иудифь получила от Вагоя для повседневного употребления, чтобы она возлежала на них во время еды[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «переодевшись»; более буквально: «отделившись». Греческое причастие необычно, а контекст, вероятно, указывает на снятие прежнего одеяния перед тем, как она нарядилась.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «служанка». Греческое слово — форма женского рода от δοῦλος и буквально обозначает рабыню.'
    reason: lexical_alternative
  - marker: c
    text: В древности во время трапезы было принято не сидеть, а возлежать.
    reason: cultural_note
lexical_decisions:
- source_word: διαστασᾶσα
  choice: раздевшись
  rationale: Редкое причастие буквально связано с отделением или разъединением; в данном контексте последовательность действий, по-видимому, подразумевает снятие прежней одежды перед облачением и украшением. Необычность слова отмечена в сноске.
- source_word: ἐκοσμήθη τῷ ἱματισμῷ
  choice: нарядилась в свои одежды
  rationale: Передаёт не просто одевание, а намеренное приведение себя в нарядный вид; притяжательное «свои» естественно выражает относящуюся к ней одежду без добавления нового содержания.
- source_word: παντὶ τῷ κόσμῳ τῷ γυναικείῳ
  choice: надела все женские украшения
  rationale: κόσμος здесь означает совокупность предметов убранства; русское «украшения» сохраняет широкий смысл и не ограничивает его только драгоценностями.
- source_word: δούλη
  choice: рабыня
  rationale: Форма женского рода от δοῦλος указывает на несвободный статус женщины; «служанка» было бы более мягким, но менее точным обозначением.
- source_word: ἔστρωσεν ... χαμαὶ τὰ κώδια
  choice: расстелила ... на земле ... овечьи шкуры
  rationale: Передаёт действие подготовки места для возлежания. κώδια обозначает руна или шкуры с шерстью; «овечьи шкуры» понятно современному читателю и соответствует предмету.
- source_word: παρὰ Βαγώου
  choice: от Вагоя
  rationale: παρά с родительным падежом обозначает источник; «Вагой» — устоявшаяся русская форма имени Bagoas в данном повествовании.
- source_word: εἰς τὴν καθημερινὴν δίαιταν αὐτῆς
  choice: для повседневного употребления
  rationale: δίαιτα может означать образ жизни, распорядок или обиход. В контексте ежедневно используемого места для трапезы нейтральное «повседневное употребление» сохраняет широту выражения.
- source_word: κατακλινομένην ἐπʼ αὐτῶν
  choice: чтобы она возлежала на них
  rationale: Глагол описывает принятую в древности позу во время трапезы; «возлежала» точнее, чем современное «сидела», и сохраняет культурную деталь.
