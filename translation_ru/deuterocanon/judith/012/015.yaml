  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Синтаксис разделён на два предложения ради ясности; сохранены последовательность действий, положение напротив Олоферна и древний обычай возлежания за едой. Формулировка «полученные ею» сохраняет местоименную соотнесённость греческого текста, не вводя имени там, где источник его не повторяет.
