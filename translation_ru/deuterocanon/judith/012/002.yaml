  yaml_path: translation/deuterocanon/judith/012/002.yaml
  text: And Judith said[a], “I will not eat from them, lest it become a stumbling block; instead, provision will be made for me from the things that have accompanied me.”
translation:
  language: ru
  text: 'И сказала Иудифь: «Я не стану есть ничего из этого, чтобы это не послужило соблазном[a]; напротив, мне будут давать из того, что было со мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «камнем преткновения», «причиной падения». Греческое σκάνδαλον может означать препятствие, из-за которого человек спотыкается или падает, а переносно — соблазн либо повод к проступку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ φάγομαι ἐξ αὐτῶν
  choice: Я не стану есть ничего из этого
  rationale: Будущее φάγομαι передаёт твёрдый отказ; отрицательное «ничего из этого» естественно по-русски выражает партитивное ἐξ αὐτῶν и соотносится с предложенной пищей.
- source_word: ἵνα μὴ γένηται σκάνδαλον
  choice: чтобы это не стало камнем преткновения
  rationale: Передаёт цель — избежать нежелательного последствия — и сохраняет метафорическую нравственно-религиозную силу σκάνδαλον, не сводя её к общественному скандалу.
- source_word: ἀλλʼ
  choice: вместо этого
  rationale: Ясно выражает противопоставление между отказом от предложенной пищи и использованием принесённых с собой припасов.
- source_word: ἐκ τῶν ἠκολουθηκότων μοι
  choice: из того, что было принесено со мной
  rationale: Контекстуально передаёт субстантивированное совершенное причастие «то, что последовало со мной», то есть взятые Иудифью припасы, без неестественного буквального оборота.
- source_word: χορηγηθήσεται
  choice: мне дадут необходимое
  rationale: Будущее страдательное обозначает снабжение или предоставление пропитания; оборот естественен в современном русском, а «необходимое» не конкретизирует содержимое припасов.
theological_decisions:
- issue: Значение σκάνδαλον в отказе Иудифи
  choice: камень преткновения
  alternative: соблазн; причина падения; повод к согрешению
  rationale: Выбранный вариант сохраняет образ препятствия, ведущего к падению, и нравственно-религиозное напряжение текста, не уточняя сверх греческого, идёт ли речь о ритуальном осквернении, нравственном проступке или иной пагубе.
translation_notes:
  register: Современный литературный русский с достоинством прямой речи. Формулировка сохраняет метафору греческого текста; синтаксис последней части слегка перестроен ради естественности, без уточнения вида припасов.
