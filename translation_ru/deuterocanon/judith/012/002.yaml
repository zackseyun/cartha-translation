revisions:
- from: 'И сказала Иудифь: «Я не стану есть ничего из этого, чтобы это не стало камнем преткновения[a]; вместо этого мне дадут необходимое из того, что было принесено со мной».'
  to: 'И сказала Иудифь: «Я не стану есть ничего из этого, чтобы это не послужило соблазном[a]; напротив, мне будут давать из того, что было со мной».'
  rationale: Убрано не имеющее прямой опоры в оригинале «необходимое». Заключительная часть передана естественным русским неопределённо-личным оборотом, который воспроизводит смысл будущего страдательного χορηγηθήσεται и сохраняет указание на источник припасов. Основной вариант для σκάνδαλον изменён на «соблазн» ради естественности синтаксиса; образ «камня преткновения» сохранён в сноске как равно возможный вариант.
