  text: And taking it[a], she ate and drank before him what her maidslave had prepared.
translation:
  language: ru
  text: Взяв это, она ела и пила перед ним то, что приготовила её рабыня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служанка». Греческое слово δούλη буквально обозначает женщину-рабыню.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβοῦσα
  choice: взяв это
  rationale: Аористное причастие обозначает действие, предшествующее основным глаголам. Дополнение в греческом подразумевается; «это» естественно отсылает к принесённой пище и питью.
- source_word: ἔφαγεν καὶ ἔπιεν
  choice: она ела и пила
  rationale: Два однородных аориста переданы естественной русской парой глаголов; контекст указывает, что речь идёт о трапезе.
- source_word: κατέναντι αὐτοῦ
  choice: перед ним
  rationale: 'Кратко и точно передаёт пространственное значение: в его присутствии, напротив него.'
- source_word: ἃ
  choice: то, что
  rationale: Передаёт собирательное значение среднего рода множественного числа без неестественного «те вещи, которые».
- source_word: ἡτοίμασεν
  choice: приготовила
  rationale: Русский вид глагола и контекст достаточно ясно показывают, что приготовление предшествовало еде; отдельная форма давнопрошедшего времени не требуется.
- source_word: ἡ δούλη αὐτῆς
  choice: её рабыня
  rationale: «Рабыня» прямо и естественно передаёт женскую форму δούλη и не смягчает обозначенный исходным словом зависимый статус.
theological_decisions:
- issue: Передача δούλη и обозначенного этим словом социального статуса
  choice: рабыня
  alternative: служанка
  rationale: Выбрано прямое лексическое соответствие, сохраняющее указание на несвободный статус; более мягкое «служанка» может скрыть эту сторону значения.
translation_notes:
  register: Современный литературный русский язык с простой, повествовательной синтаксической конструкцией. Причастный оборот сохранён в естественной форме; лексема «рабыня» точна и понятна широкому читателю.
