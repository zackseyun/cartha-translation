  text: And Judith said to him[a], “And who am I to speak back to my lord? Whatever is pleasing in his eyes, I will quickly do, and this will be my joy until the day of my death.”
translation:
  language: ru
  text: 'И Юдифь сказала ему: «Кто я такая, чтобы перечить моему господину?[a] Всё, что будет угодно ему, я поспешу исполнить, и это будет мне радостью до дня моей смерти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возражать моему господину»; возможен также смысл: «противиться моему господину».'
    reason: 'Лексическая неоднозначность ἀντειποῦσα: слово может обозначать ответное возражение, противоречие или противодействие.'
lexical_decisions:
- source_word: ἀντειποῦσα
  choice: перечить
  rationale: Глагол передаёт ответное возражение или противоречие. «Перечить» естественно звучит в контексте подчеркнутой почтительности Юдифи и не усиливает смысл до открытого сопротивления.
- source_word: τῷ κυρίῳ μου
  choice: моему господину
  rationale: Здесь κύριος — почтительное обозначение Олоферна, а не божественный титул; строчная буква исключает такое отождествление.
- source_word: πᾶν ὃ ἔσται ἐν τοῖς ὀφθαλμοῖς αὐτοῦ ἀρεστόν
  choice: всё, что будет угодно ему
  rationale: Естественный русский эквивалент греческого выражения о том, что приятно и заслуживает одобрения в его глазах. Буквальное «угодно в его глазах» по-русски звучало бы тяжеловесно.
- source_word: σπεύσασα
  choice: поспешу исполнить
  rationale: Передаёт поспешность и готовность, выраженные причастием, сохраняя достоинство и плавность фразы.
- source_word: ἀγαλλίαμα
  choice: радостью
  rationale: Слово обозначает сильную радость или ликование; «радость» естественно в данном контексте и не придаёт реплике неуместно возвышенного оттенка.
- source_word: ἕως ἡμέρας θανάτου μου
  choice: до дня моей смерти
  rationale: Прямо и торжественно передаёт временное выражение оригинала.
theological_decisions:
- issue: Передача κύριος при обращении к человеку
  choice: господин
  alternative: владыка
  rationale: В данном месте слово служит социальным почтительным обозначением Олоферна, а не именованием Бога. «Господин» ясно передаёт человеческий статус адресата без богословского переосмысления.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим придворно-почтительной речи. Синтаксис сохранён близким к греческому, но идиома «в его глазах» передана естественным русским выражением. Местоимение «ему» сохраняет переход оригинала от обращения во втором лице к речи о собеседнике в третьем лице.
