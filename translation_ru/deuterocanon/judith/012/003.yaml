  text: And Holofernes said to her[a], “But if the things you have with you run out, from where shall we get for you provisions like them? For there is no one with us from your nation.”
translation:
  language: ru
  text: 'И Олоферн сказал ей: «А если то, что у тебя с собой, закончится, откуда мы достанем для тебя такую же пищу?[a] Ведь среди нас нет никого из твоего народа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «такие же припасы» либо «то, что поддержит твои силы». Греческое δύναμις обычно означает «сила» или «мощь», но здесь, судя по контексту, речь идёт о пище или припасах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκλίπῃ
  choice: закончится
  rationale: Глагол означает «иссякнуть, кончиться, выйти»; применительно к взятым с собой припасам современное русское «закончится» естественно передаёт смысл.
- source_word: τὰ μετὰ σοῦ ὄντα
  choice: то, что у тебя с собой
  rationale: Сохранена широта буквального выражения «то, что находится при тебе»; контекст и последующее слово «пища» уточняют, что речь идёт о взятых Юдифью припасах.
- source_word: ἐξοίσομεν σοι
  choice: мы достанем для тебя
  rationale: Будущее от ἐκφέρω буквально связано с вынесением или доставлением, но здесь вопрос касается получения необходимой для Юдифи пищи; «достанем для тебя» звучит естественно и сохраняет практический смысл.
- source_word: δύναμιν
  choice: пищу
  rationale: Обычное значение существительного — «сила, мощь», однако в данном контексте выражение обозначает то, что поддерживает силы, то есть пищу или съестные припасы. Необычность употребления отмечена в сноске.
- source_word: ὁμοίαν αὐτοῖς
  choice: такую же
  rationale: Передаёт сравнение с тем, что Юдифь принесла с собой, без излишнего повторения слова «припасы».
- source_word: ἐκ τοῦ ἔθνους σου
  choice: из твоего народа
  rationale: ἔθνος обозначает этническую общность Юдифи. В современном русском «народ» здесь естественнее слова «нация» и точно передаёт принадлежность к её народу.
