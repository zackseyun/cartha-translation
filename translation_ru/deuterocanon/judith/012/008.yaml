lexical_decisions:
- source_word: ἀνέβη
  choice: поднявшись
  rationale: Аорист ἀναβαίνω обозначает движение вверх; деепричастие естественно передаёт временную связь с последующей молитвой.
- source_word: ἐδέετο
  choice: молилась
  rationale: В обращении к Богу δέομαι означает «молиться, умолять»; несовершенный вид русского глагола передаёт длительность греческого имперфекта.
- source_word: κυρίου θεοῦ Ἰσραήλ
  choice: Господу, Богу Израиля
  rationale: Приложение с запятой ясно и естественно передаёт традиционный титул, не отождествляя κύριος с какой-либо специально обозначенной формой Божьего имени.
- source_word: κατευθῦναι τὴν ὁδὸν αὐτῆς
  choice: чтобы Он направил её путь
  rationale: 'Формулировка сохраняет образ пути и его возможный двойной смысл: буквальное передвижение и ход задуманного дела.'
- source_word: εἰς ἀνάστημα
  choice: ради возвышения
  rationale: Редкое существительное обозначает поднятие или возвышение; выбранный вариант сохраняет идею изменения положения или состояния, не сводя её исключительно к физическому движению.
- source_word: τῶν υἱῶν τοῦ λαοῦ αὐτοῦ
  choice: сынов Его народа
  rationale: Сохранено прямо выраженное υἱῶν «сынов» и естественная для русского языка родительная конструкция.
theological_decisions:
- issue: Передача κύριος в иудейской молитвенной формуле
  choice: Господь
  alternative: Владыка; ГОСПОДЬ
  rationale: «Господь, Бог Израиля» — прозрачная и общепонятная передача греческого титула без внесения в текст отсутствующей в нём особой графической маркировки Божьего имени.
- issue: Смысл редкого ἀνάστημα в контексте миссии Иудифи
  choice: возвышение
  alternative: поднятие; восстановление; избавление
  rationale: Контекст допускает возвышение, восстановление положения или избавление народа. Основной текст оставляет смысл широким, а примечание фиксирует подлинную лексическую неоднозначность.
- issue: Гендерно маркированное υἱῶν
  choice: сынов
  alternative: детей; народа
  rationale: Греческий текст прямо содержит существительное «сынов»; его сохранение не требует конфессионального истолкования и наиболее точно отражает форму источника.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис остаётся доступным; образ «направить путь» сохранён ради буквального и переносного смысла. Местоимение «Он» добавлено для естественности придаточного предложения, а прописная буква соответствует почтительному религиозному регистру.
