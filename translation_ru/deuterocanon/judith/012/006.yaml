base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/006.yaml
  text: And she arose toward the morning watch[a], and sent to Holofernes, saying, “Let my lord now give orders to allow your servant to go out for prayer.”
translation:
  language: ru
  text: 'И к утренней страже она встала и послала сказать Олоферну: «Пусть же мой господин прикажет позволить своей служанке[a] выйти для молитвы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабыне». Греческое слово δούλη может означать как служанку, так и рабыню — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέστη
  choice: встала
  rationale: Аорист ἀνίστημι обозначает, что Иудифь встала в указанное время; «встала» естественно и точно для повествовательного контекста.
- source_word: πρὸς τὴν ἑωθινὴν φυλακήν
  choice: к утренней страже
  rationale: φυλακή здесь означает ночную стражу как период времени, а ἑωθινή уточняет, что речь идёт о предрассветной, утренней страже. Предлог «к» сохраняет направительно-временной оттенок πρὸς и не сводит его однозначно к «во время».
- source_word: ἀπέστειλεν πρὸς Ὁλοφέρνην λέγουσα
  choice: послала сказать Олоферну
  rationale: По-русски сочетание глагола со значением посылания и причастия «говоря» естественно передаётся идиомой «послала сказать», подразумевающей вестника и сохраняющей содержание действия.
- source_word: Ἐπιταξάτω
  choice: пусть же … прикажет
  rationale: Аористный императив выражает просьбу издать распоряжение; «прикажет» сохраняет властный характер действия, а «же» передаёт усилительную частицу δή.
- source_word: ὁ κύριός μου
  choice: мой господин
  rationale: κύριος относится к Олоферну и служит почтительным обращением к человеку; «мой господин» передаёт социальную иерархию без божественного смысла.
- source_word: ἐᾶσαι
  choice: позволить
  rationale: Инфинитив обозначает содержание требуемого распоряжения. «Позволить» точно и естественно передаёт разрешение.
- source_word: τὴν δούλην σου
  choice: своей служанке
  rationale: Женская форма δούλη может означать служанку или рабыню. Здесь Иудифь употребляет её как почтительное самоуничижительное обозначение в разговоре с правителем; «служанка» естественно в данном контексте, а более буквальная альтернатива отмечена в сноске. Возвратное «своей» по нормам русского языка соотносится с подлежащим «мой господин» и передаёт греческое σου.
- source_word: ἐπὶ προσευχὴν
  choice: для молитвы
  rationale: Оборот выражает цель выхода. «Для молитвы» близок греческой именной конструкции и сохраняет её религиозную направленность.
- source_word: ἐξελθεῖν
  choice: выйти
  rationale: Прямое и естественное соответствие инфинитиву движения со значением выхода наружу.
theological_decisions:
- issue: Передача κύριος применительно к человеку
  choice: мой господин
  alternative: мой господин / мой повелитель
  rationale: Референтом является Олоферн, поэтому слово передаёт почтительный социальный титул, а не божественное именование. Строчная буква исключает ненужный богословский оттенок.
- issue: Передача δούλη в самоназвании Иудифи
  choice: служанка
  alternative: рабыня
  rationale: В этой придворной речи слово функционирует как формула почтительного самоуничижения. «Служанка» передаёт прагматику контекста, тогда как возможное значение подневольного статуса сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным и придворно-почтительным регистром. Порядок первой части слегка формален, чтобы сохранить временной акцент греческого πρὸς τὴν ἑωθινὴν φυλακήν. Маркер сноски помещён непосредственно после слова «служанке», к которому относится пояснение.
