lexical_decisions:
- source_word: εἰσπορευομένη
  choice: войдя
  rationale: Греческое причастие передано деепричастием, естественно выражающим сопутствующее предшествующее действие.
- source_word: καθαρά
  choice: чистой
  rationale: Предикативное прилагательное обозначает состояние Юдифи при возвращении; русский вариант сохраняет как общее значение чистоты, так и возможный обрядовый оттенок.
- source_word: παρέμενεν
  choice: оставалась
  rationale: Имперфект указывает на продолжавшееся состояние или действие; «оставалась» естественно передаёт эту длительность.
- source_word: τῇ σκηνῇ
  choice: в шатре
  rationale: σκηνή в данном повествовательном контексте означает шатёр; дательный передан русской предложной конструкцией места.
- source_word: μέχρι οὗ
  choice: пока не
  rationale: Так естественно по-русски выражается временной предел действия при последующем глаголе совершенного вида в греческом.
- source_word: προσηνέγκατο
  choice: принимала
  rationale: Средняя форма προσφέρω с объектом «пища» в данном контексте понимается как принятие пищи. Буквальное «приносила» по-русски могло бы ошибочно означать перенос еды в шатёр.
- source_word: τὴν τροφὴν αὐτῆς
  choice: свою пищу
  rationale: τροφή означает пищу или пропитание; возвратное «свою» ясно соотносит αὐτῆς с подлежащим.
- source_word: πρὸς ἑσπέραν
  choice: под вечер
  rationale: Оборот указывает на приближение вечера; «под вечер» точно и естественно передаёт временной оттенок.
theological_decisions:
- issue: Следует ли явно обозначить καθαρά как обрядовую чистоту
  choice: Передать общим словом «чистой» и пояснить возможный обрядовый смысл в сноске
  alternative: «обрядово чистой»
  rationale: Контекст омовения допускает обрядовый смысл, однако само прилагательное не вынуждает делать его явным; перевод сохраняет смысловую открытость.
- issue: Значение среднего προσηνέγκατο применительно к пище
  choice: «принимала свою пищу»
  alternative: «приносила свою пищу»
  rationale: В контексте еды средняя форма допускает значение принятия пищи. Это избегает не подтверждённой текстом пространственной конкретизации, будто Юдифь сама вносила еду в шатёр.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан плавным и доступным; неоднозначность понятия чистоты сохранена, а идиома принятия пищи передана естественно.
