  yaml_path: translation/deuterocanon/judith/012/004.yaml
  text: And Judith said to him[a], “As your life lives, my lord[c][b], your servant will not use up what is with me until he has accomplished by my hand what he has planned.”
translation:
  language: ru
  text: 'И сказала ему Иудифь: «Жива душа твоя, господин мой![a] Раба твоя не израсходует того, что у меня с собой,[b] пока не совершит моей рукой то, что замыслил».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно по-русски: «Клянусь твоей жизнью, господин мой!» Буквально по-гречески: «Жива душа твоя».'
    reason: lexical_alternative
  - marker: b
    text: Под «тем, что у меня с собой», вероятнее всего, подразумеваются собственные припасы Иудифи.
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте субъект глаголов «совершит» и «замыслил» прямо не назван; по контексту наиболее вероятно, что речь идёт о Боге, действующем через Иудифь.
    reason: alternative_reading
lexical_decisions:
- source_word: Ζῇ ἡ ψυχή σου
  choice: Жива душа твоя
  rationale: Сохранена буквальная форма греческой клятвенной формулы; по-русски она звучит возвышенно и понятно, а идиоматический смысл пояснён в сноске.
- source_word: κύριέ μου
  choice: господин мой
  rationale: Это почтительное обращение к Олоферну, а не божественный титул; выбор сохраняет придворный и социальный регистр.
- source_word: ἡ δούλη σου
  choice: раба твоя
  rationale: Женская форма от δοῦλος выражает подчёркнуто подчинённое самоназвание; «раба» точнее сохраняет силу исходного слова, чем более мягкое «служанка».
- source_word: οὐ δαπανήσει
  choice: не израсходует
  rationale: Глагол означает истратить или исчерпать запас; «израсходует» естественно сочетается с подразумеваемыми припасами.
- source_word: τὰ ὄντα μετʼ ἐμοῦ
  choice: того, что у меня с собой
  rationale: Передаёт неопределённость буквального «того, что со мной», не вставляя в основной текст прямо не названные припасы.
- source_word: ἐν χειρί μου
  choice: моей рукой
  rationale: Сохранён библейский образ руки как орудия действия, при этом русская конструкция ясно выражает посредничество Иудифи.
- source_word: ἃ ἐβουλεύσατο
  choice: то, что замыслил
  rationale: Глагол обозначает обдуманное намерение или решение; «замыслил» естественно передаёт целенаправленный замысел.
theological_decisions:
- issue: Неявный субъект ποιήσῃ и ἐβουλεύσατο
  choice: Передан местоимением «Он» без прямого именования; наиболее естественный контекстуальный референт — Бог.
  alternative: 'Безличное: «пока моей рукой не совершится задуманное».'
  rationale: Греческие глаголы стоят в третьем лице единственного числа, но подлежащее прямо не названо. Местоимение сохраняет грамматику и контекстуальную отсылку, не добавляя в основной текст имени Бога.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. Инверсия «господин мой» и формула «Жива душа твоя» сохраняют торжественную вежливость речи, а остальной синтаксис остаётся доступным современному читателю.
