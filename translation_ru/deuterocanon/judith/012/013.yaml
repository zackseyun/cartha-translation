base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/013.yaml
  text: And Bagoas went out from the presence of Holofernes and went in to her and said[a], “Let this beautiful young woman not hesitate to come to my lord, to be honored before him, and to drink wine with us in gladness[b], and to become on this day like one of the daughters of the Assyrians who stand in the house of Nebuchadnezzar.”
translation:
  language: ru
  text: 'И Вагой вышел от Олоферна, вошёл к ней и сказал: «Пусть же эта прекрасная девушка[a] не медлит прийти к моему господину, чтобы удостоиться чести в его присутствии, пить с нами вино в радости и стать в этот день как одна из дочерей ассирийцев, находящихся при доме Навуходоносора[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служанка». Греческое παιδίσκη может означать девушку, служанку или рабыню; здесь это слово употреблено как льстивое обращение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «которые стоят в доме Навуходоносора»; выражение может обозначать женщин, находящихся при доме или служащих в нём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἀπὸ προσώπου Ὀλοφέρνου
  choice: вышел от Олоферна
  rationale: Греческий оборот обозначает уход из чьего-либо присутствия; краткое русское выражение естественно передаёт последовательность действий, не добавляя отсутствующего в тексте места.
- source_word: εἰσῆλθεν πρὸς αὐτήν
  choice: вошёл к ней
  rationale: Сохраняет буквальное направление движения и повествовательную связь, не придавая обороту постороннего смысла.
- source_word: Μὴ ὀκνήσῃς
  choice: не постесняется
  rationale: ὀκνέω здесь выражает нерешительность или нежелание принять приглашение; русское слово уместно в льстивой придворной речи.
- source_word: ἡ παιδίσκη ἡ καλὴ
  choice: эта прекрасная молодая женщина
  rationale: В данном обращении παιδίσκη имеет льстивый оттенок; основной текст не утверждает служебного или рабского положения Юдифи, а возможная социальная окраска отмечена в сноске.
- source_word: δόξασθῆναι κατὰ πρόσωπον αὐτοῦ
  choice: удостоиться чести перед ним
  rationale: Пассив δοξάζω в человеческом придворном контексте означает получение почести, а не богословское прославление.
- source_word: πίεσαι μεθʼ ἡμῶν εἰς εὐφροσύνην οἴνου
  choice: пить с нами вино и веселиться
  rationale: Передаёт как питьё вина, так и праздничную радость, выраженную сочетанием εὐφροσύνη οἴνου, естественным современным русским языком.
- source_word: γενηθήναι ... ὡς θυγάτηρ μία τῶν υἱῶν Ἀσσούρ
  choice: стать ... как одна из дочерей ассирийцев
  rationale: «Стать» сохраняет вступление в новый статус, а «дочерей ассирийцев» естественно передаёт семитизированное греческое выражение «дочерей сынов Ассура».
- source_word: αἱ παρεστηκυῖαι ἐν οἴκῳ Ναβουχοδονόσορ
  choice: которые состоят при доме Навуходоносора
  rationale: Формулировка сохраняет придворный смысл присутствия и принадлежности к дому, не определяя точнее, были ли эти женщины служанками, прислужницами или придворными.
theological_decisions:
- issue: Передача κύριος применительно к Олоферну
  choice: мой господин
  alternative: мой господин / мой хозяин
  rationale: Здесь κύριος — человеческий титул в иерархической придворной речи, а не именование Бога. «Господин» сохраняет почтительность без богословской двусмысленности.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественной повествовательной интонацией. Необычное обращение к собеседнице в третьем лице сохранено как черта льстивой придворной речи. Имена переданы в традиционной русской библейской форме: Вагой, Олоферн, Навуходоносор.'
