  to: 'И Вагой вышел от Олоферна, вошёл к ней и сказал: «Пусть же эта прекрасная девушка[a] не медлит прийти к моему господину, чтобы удостоиться чести в его присутствии, пить с нами вино в радости и стать в этот день как одна из дочерей ассирийцев, находящихся при доме Навуходоносора[b]».'
  rationale: 'Заменены два выражения для более точной передачи греческого смысла и естественности русского текста: «не постесняется» — на «не медлит», а координация «пить вино и веселиться» — на «пить вино в радости». «Находящихся при доме» сохраняет придворно-служебную неоднозначность παρεστηκυῖαι, не конкретизируя статус этих женщин.'
