  text: And he ordered that she be brought in where his silverware was kept[b][a], and he directed that food be prepared for her from his own dishes and that she drink from his wine.
translation:
  language: ru
  text: И он велел ввести её туда, где хранилась его серебряная утварь[a], и распорядился подать ей его приготовленные кушанья[b] и чтобы она пила его вино.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его серебряные сосуды». Греческое слово может обозначать различные изделия из серебра.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «разложить перед ней из его приготовленных кушаний»; возможно также: «накрыть для неё стол его кушаньями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκέλευσεν
  choice: велел
  rationale: Передаёт властное распоряжение естественным для современного русского языка глаголом без излишней торжественности.
- source_word: εἰσαγαγεῖν αὐτήν
  choice: ввести её
  rationale: Инфинитив зависит от ἐκέλευσεν; форма не называет исполнителей, но подразумевает, что её должны ввести слуги.
- source_word: οὗ ἔτιθετο
  choice: туда, где хранилась
  rationale: Имперфект передаёт устойчивое местонахождение предметов; «хранилась» яснее буквального «была положена».
- source_word: τὰ ἀργυρώματα αὐτοῦ
  choice: его серебряная утварь
  rationale: Существительное обозначает изделия или предметы из серебра; «утварь» не сужает значение до столовых приборов и подходит контексту.
- source_word: συνέταξεν
  choice: распорядился
  rationale: Сохраняет властный характер указания и позволяет избежать повтора «велел».
- source_word: καταστρῶσαι αὐτῇ
  choice: подать ей
  rationale: В сочетании с обозначением приготовленных кушаний глагол описывает их раскладывание или выставление перед Юдифью; «подать» естественно выражает это действие по-русски.
- source_word: ἀπὸ τῶν ὀψοποιημάτων αὐτοῦ
  choice: его приготовленные кушанья
  rationale: ὀψοποιήματα — приготовленные блюда или кушанья; перевод сохраняет как кулинарный смысл, так и принадлежность Олоферну.
- source_word: τοῦ οἴνου αὐτοῦ πινεῖν
  choice: дать ей пить его вино
  rationale: Продолжает содержание распоряжения и ясно передаёт, что ей предлагалось вино из его запасов.
