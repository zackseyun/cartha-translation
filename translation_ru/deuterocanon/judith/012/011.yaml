  yaml_path: translation/deuterocanon/judith/012/011.yaml
  text: And he said to Bagoas the eunuch[a], who was in charge of all that belonged to him[b], “Go now and persuade the Hebrew woman who is with you to come to us and eat and drink with us.”
translation:
  language: ru
  text: 'И сказал он евнуху[a] Вагою, который распоряжался всем, что ему принадлежало: «Пойди же и уговори[b] еврейскую женщину, которая находится у тебя, прийти к нам, есть и пить вместе с нами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «евнух» иногда могло употребляться и в более широком смысле — о высокопоставленном придворном; здесь греческое слово переведено буквально.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «убеди» или «склони». Речь идёт о том, чтобы побудить её прийти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βαγώᾳ
  choice: Вагою
  rationale: Имя передано традиционной русской транслитерацией и поставлено в дательном падеже по греческому тексту.
- source_word: εὐνούχῳ
  choice: евнуху
  rationale: Сохранено прямое значение греческого слова; возможное более широкое придворное употребление отмечено в сноске.
- source_word: ἐφεστηκὼς ἐπὶ πάντων τῶν αὐτοῦ
  choice: который распоряжался всем, что ему принадлежало
  rationale: Формулировка естественно передаёт возложенный на Вагоя надзор над имуществом и делами Олоферна, не сужая πάντων до одних вещей.
- source_word: Πεισὸν
  choice: уговори
  rationale: Русское «уговори» передаёт побуждение женщины согласиться и прийти, не предполагая принуждения.
- source_word: τὴν γυναῖκα τὴν Ἑβραίαν
  choice: еврейскую женщину
  rationale: γυνή здесь означает женщину, а не жену; этническое обозначение Ἑβραίαν сохранено непосредственно.
- source_word: ἣ ἔστιν παρὰ σοὶ
  choice: которая находится у тебя
  rationale: Передаёт пространственную близость или пребывание при Вагое, не добавляя прямо не выраженной идеи опеки.
- source_word: τοῦ ἐλθεῖν πρὸς ἡμᾶς
  choice: прийти к нам
  rationale: Инфинитив выражает то, к чему следует склонить женщину.
- source_word: φαγεῖν καὶ πιεῖν μεθʼ ἡμῶν
  choice: есть и пить вместе с нами
  rationale: Прямо сохраняет два греческих инфинитива и совместный характер трапезы.
