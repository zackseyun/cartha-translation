translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Частица «же» передаёт усиление в δὴ; порядок слов слегка адаптирован к естественной русской речи. Все смысловые участники и повтор «к нам / вместе с нами» сохранены.
