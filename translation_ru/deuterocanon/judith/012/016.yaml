base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/016.yaml
  text: And when she entered[a], Judith reclined, and the heart of Holofernes was beside itself over her; his soul was shaken. He was very eager to have relations with her[b], and he was watching for an opportunity to deceive her from the day he saw her.
translation:
  language: ru
  text: Войдя, Иудифь возлегла за столом[a]. Сердце Олоферна обезумело от неё, и душа его пришла в смятение. Он страстно желал сойтись с ней и с того самого дня, как увидел её, выжидал удобного случая, чтобы обмануть её[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть заняла место за пиршественным столом полулёжа, по принятому тогда обычаю.
    reason: cultural_note
  - marker: b
    text: 'Или: «обольстить её», «перехитрить её». Греческое слово означает «обмануть» и в данном контексте может быть связано с его сексуальным намерением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: войдя
  rationale: Аористное причастие передаёт предшествующее обстоятельство кратким и естественным для русского языка деепричастием.
- source_word: ἀνέπεσεν
  choice: возлегла за столом
  rationale: В контексте пира речь идёт об античном обычае принимать пищу полулёжа; добавление «за столом» устраняет возможное ошибочное понимание как обычного лежания.
- source_word: ἐξέστη ἡ καρδία Ὀλοφέρνου ἐπʼ αὐτῇ
  choice: сердце Олоферна обезумело от неё
  rationale: Сохранены образ сердца и сильное значение ἐξίστημι — утрата обычного самообладания; «от неё» указывает на Иудифь как причину этого состояния.
- source_word: ἐσαλεύθη ἡ ψυχὴ αὐτοῦ
  choice: душа его пришла в смятение
  rationale: «Душа» сохраняет антропологическую лексику ψυχή, а «пришла в смятение» естественно передаёт внутреннее потрясение, выраженное σαλεύω.
- source_word: κατενθύμως σφόδρα
  choice: страстно желал
  rationale: Сочетание выражает чрезвычайно сильное внутреннее желание или намерение; русский вариант передаёт интенсивность без архаической тяжеловесности.
- source_word: τοῦ συγγενέσθαι μετʼ αὐτῆς
  choice: сойтись с ней
  rationale: В данном контексте выражение служит сдержанным эвфемизмом половой близости. «Сойтись с ней» сохраняет эвфемистичность и остаётся понятным современному читателю.
- source_word: ἐτήρει καιρόν
  choice: выжидал удобного случая
  rationale: Имперфект обозначает продолжительное выжидание, а καιρός — подходящий момент или случай.
- source_word: τοῦ ἀπατῆσαι αὐτήν
  choice: чтобы обмануть её
  rationale: Основное значение ἀπατάω — «обманывать, вводить в заблуждение». Контекст допускает оттенок обольщения или сексуальной манипуляции, но основной текст не сужает более широкое значение глагола.
- source_word: ἀφʼ ἧς ἡμέρας εἶδεν αὐτήν
  choice: с того самого дня, как увидел её
  rationale: Естественная русская временная конструкция, точно сохраняющая отсчёт от дня первой встречи.
theological_decisions:
- issue: Эвфемистическое обозначение половой близости
  choice: сойтись с ней
  alternative: лечь с ней; вступить с ней в связь; быть с ней
  rationale: Греческий текст выражает сексуальное намерение эвфемистически. Выбранный вариант понятен, но не делает речь грубее или прямее оригинала.
- issue: Антропологические образы сердца и души
  choice: сердце Олоферна обезумело… душа его пришла в смятение
  alternative: Олоферн потерял голову… он был глубоко взволнован
  rationale: Сохранение отдельных образов καρδία и ψυχή не сводит их к одной психологической реакции и передаёт параллельную, напряжённую образность источника.
- issue: Характер намерения Олоферна
  choice: обмануть её
  alternative: обольстить её; соблазнить её; перехитрить её
  rationale: Перевод сохраняет широкое значение ἀπατάω и не утверждает однозначно, каким именно способом он собирался добиться своего; сексуальный оттенок пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Сохранены образы сердца и души, а также сдержанный сексуальный эвфемизм. Сноски поставлены непосредственно при словах, которые они поясняют.
