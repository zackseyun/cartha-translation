base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/012/007.yaml
  text: And Holofernes ordered the bodyguards not to hinder her[a]. So she remained in the camp for three days, and went out at night into the valley of Bethulia[b], and washed herself at the spring of water by the camp.
translation:
  language: ru
  text: И Олоферн приказал телохранителям не препятствовать ей. Она оставалась в лагере три дня и каждую ночь выходила в ущелье Ветилуи[a] и омывалась[b] у источника воды в лагере.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в овраг» или «в долину Ветилуи».'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол может означать погружение в воду или омовение; от того же корня образован глагол со значением «крестить». Здесь не имеется в виду христианское крещение.
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέταξεν
  choice: приказал
  rationale: Передаёт властный характер распоряжения естественным для современного русского повествования глаголом.
- source_word: σωματοφύλαξι
  choice: телохранителям
  rationale: Точное и современное соответствие обозначению личной охраны.
- source_word: μὴ διακωλύειν αὐτήν
  choice: не препятствовать ей
  rationale: Сохраняет значение запрета мешать её передвижениям, не добавляя не выраженных в тексте подробностей.
- source_word: παρέμεινεν ἐν τῇ παρεμβολῇ
  choice: оставалась в лагере
  rationale: В военном контексте παρεμβολή означает лагерь; «оставалась» соответствует повествовательному регистру.
- source_word: ἐξεπορεύετο κατὰ νύκτα
  choice: каждую ночь выходила
  rationale: Имперфект в сочетании с пребыванием в течение трёх дней естественно передаёт повторявшееся действие; «каждую ночь» ясно выражает эту аспектуальную силу.
- source_word: φάραγγα
  choice: ущелье
  rationale: Слово обозначает долину с крутыми склонами, овраг или ущелье; «ущелье» сохраняет более конкретный топографический оттенок греческого слова.
- source_word: Βαιτυλοῦα
  choice: Ветилуи
  rationale: Использована форма родительного падежа от традиционного русского названия «Ветилуя».
- source_word: ἐβαπτίζετο
  choice: омывалась
  rationale: Передаёт погружение или омовение в данном контексте, не привнося позднейшего специального значения христианского крещения.
- source_word: ἐπὶ τῆς πηγῆς τοῦ ὕδατος
  choice: у источника воды
  rationale: Близко передаёт указание на место действия и сохраняет явно выраженное упоминание воды.
theological_decisions:
- issue: Характер действия, обозначенного ἐβαπτίζετο
  choice: омывалась
  alternative: погружалась в воду; совершала омовение
  rationale: Глагол допускает значения погружения и омовения. Основной текст не называет действие крещением и не уточняет его обрядовый статус; примечание сохраняет лексическую широту и возможный оттенок очищения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повторность греческого имперфекта выражена словами «каждую ночь». Порядок последней фразы слегка сглажен, но трудное указание греческого текста на источник «в лагере» сохранено без исправления по догадке.
