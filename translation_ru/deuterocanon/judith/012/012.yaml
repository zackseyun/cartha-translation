  yaml_path: translation/deuterocanon/judith/012/012.yaml
  text: For look[a], it would be shameful for us if we let such a woman go without speaking with her; for if we do not draw her in, she will laugh at us.
translation:
  language: ru
  text: «Ведь для нас будет позором, если мы отпустим такую женщину, не поговорив с ней. Если мы не привлечём её к себе[a], она будет смеяться над нами».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не заманим её»; возможно также: «не расположим её к себе». Греческий глагол означает привлечение человека к себе и здесь, вероятно, подразумевает попытку обольщения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: Ведь
  rationale: Сочетание вводит подчёркнутое объяснение. В русском контексте «ведь» естественно передаёт причинно-пояснительную силу γάρ; отдельное «вот» сделало бы фразу тяжеловесной.
- source_word: αἰσχρὸν τῷ προσώπῳ ἡμῶν
  choice: для нас будет позором
  rationale: Буквально выражение связано с «нашим лицом», но в контексте означает ущерб чести и общественное унижение. Русское «для нас будет позором» естественно передаёт этот смысл.
- source_word: παρήσομεν
  choice: мы отпустим
  rationale: Здесь παρίημι означает позволить пройти или уйти. «Отпустим» ясно и естественно описывает ситуацию.
- source_word: οὐχ ὁμιλήσαντες αὐτῇ
  choice: даже не поговорив с ней
  rationale: ὁμιλέω прежде всего обозначает общение или беседу; частица «даже» передаёт возмущённый тон высказывания, не превращая возможный подтекст в явное утверждение.
- source_word: ἐπισπάσωμεθα
  choice: не привлечём её к себе
  rationale: Глагол означает потянуть или привлечь кого-либо к себе и в данном контексте может подразумевать обольщение. Основной текст сохраняет образ притягивания, а примечание отмечает возможные оттенки.
- source_word: καταγελάσεται ἡμῶν
  choice: она станет над нами смеяться
  rationale: Передаёт прямое значение глагола — смеяться над кем-либо, высмеивать — и сохраняет тему задетой чести.
