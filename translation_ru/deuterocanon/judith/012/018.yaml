  text: And Judith said[a], “I will drink now, my lord, because my life has been magnified within me today beyond all the days since my birth.”
translation:
  language: ru
  text: 'Иудифь сказала: «Я сейчас выпью, мой господин, потому что сегодня жизнь моя возвеличилась во мне больше, чем во все дни с самого моего рождения[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сегодня жизнь моя стала во мне великой».'
    reason: Сохраняется возможный более буквальный способ передачи пассивной формы ἐμεγαλύνθη и необычного сочетания с «жизнью».
lexical_decisions:
- source_word: Πίομαι
  choice: я выпью
  rationale: Форма будущего времени от πίνω передаёт прямой и добровольный ответ Иудифи на предложение выпить; русское «я выпью» естественно сохраняет этот смысл.
- source_word: δή
  choice: теперь
  rationale: Частица придаёт реплике оттенок непосредственности и лёгкого усиления; «теперь» уместно в данном контексте.
- source_word: κύριε
  choice: господин мой
  rationale: Уважительное обращение к Олоферну. Такой порядок слов звучит возвышенно и передаёт почтительность, не превращая обращение в божественный титул.
- source_word: ἐμεγαλύνθη
  choice: возвеличилась
  rationale: Аорист пассива от μεγαλύνω буквально означает «была сделана великой, возвеличена». Русская возвратная форма естественнее тяжеловесного «была возвеличена» и сохраняет возвышенную метафору.
- source_word: τὸ ζῆν μου
  choice: жизнь моя
  rationale: Субстантивированный инфинитив буквально обозначает «мою жизнь, моё бытие»; «жизнь моя» ясно и идиоматично по-русски.
- source_word: ἐν ἐμοὶ
  choice: во мне
  rationale: Предложное выражение сохранено, поскольку оно подчёркивает внутренний, личный характер сказанного и не должно быть молча опущено.
- source_word: σήμερον
  choice: сегодня
  rationale: Прямой современный эквивалент временного наречия.
- source_word: παρὰ πάσας τὰς ἡμέρας
  choice: больше, чем во все дни
  rationale: παρά с винительным падежом выражает сравнение. Формулировка сохраняет сравнительный смысл, не сводя его к свободному пересказу «как никогда прежде».
- source_word: τῆς γενέσεώς μου
  choice: от рождения моего
  rationale: γένεσις здесь означает рождение или начало жизни; выражение передаёт временной охват исходной фразы и поддерживает её возвышенный строй.
theological_decisions:
- issue: Смысл слов о том, что жизнь Иудифи «возвеличилась»
  choice: Сохранить возвышенное и несколько необычное выражение «жизнь моя возвеличилась во мне».
  alternative: «Сегодня я чувствую себя живой как никогда» или «сегодня моя жизнь стала благополучнее, чем когда-либо».
  rationale: Греческий текст соединяет μεγαλύνω с τὸ ζῆν μου и не уточняет, идёт ли речь лишь о радости, полноте жизни, благополучии или возвышении. Перевод сохраняет образность и смысловую напряжённость, не подменяя её толкованием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским строем. Необычность центральной метафоры намеренно сохранена; устаревшие формы и конфессионально окрашенная терминология не вводятся.
