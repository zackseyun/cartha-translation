  rationale: Исправлена сравнительная конструкция, чтобы она по-русски ясно обозначала сопоставление сегодняшнего состояния со всеми днями жизни с рождения. Порядок слов слегка нормализован для современного литературного регистра. Образная и синтаксически напряжённая формулировка «жизнь моя возвеличилась во мне» сохранена, поскольку греческий текст не объясняет её как благополучие, радость или иной конкретный опыт.
