  verdict: revise
  source_fidelity: Вторая группа в греческом тексте состоит из «всех живущих» у названных рек и «на равнине Ариоха, царя элимеев». В черновике Ариох ошибочно сделан отдельным субъектом при «примкнули», тогда как он определяет равнину. Заключительное εἰς παράταξιν υἱῶν Χελεούλ синтаксически допускает более одного отношения к «сынам Хелеула»; основной текст не должен утверждать, что народы вошли именно в их строй.
  naturalness: «Жители нагорья» и «жившие вдоль Евфрата, Тигра и Гидаспа» естественны для современного литературного русского. Конструкция «на равнине — Ариох» не только неясна, но и меняет синтаксические роли. «Собрались, чтобы встать в боевой строй сынов Хелеула» стилистически возможна, однако неоправданно конкретизирует отношение к этой группе.
  terminology: Передача имён «Ариох», «элимеи» и «Хелеул» приемлема; «боевой строй» удачно передаёт παράταξις. Во избежание ложной определённости в последней части следует сохранить буквальную связь «боевой строй сынов Хелеула» и пояснить её в сноске.
