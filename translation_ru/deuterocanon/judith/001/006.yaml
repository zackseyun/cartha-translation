revisions:
- from: К нему примкнули[a] все жители нагорья, все жившие вдоль Евфрата, Тигра и Гидаспа, а на равнине — Ариох, царь элимеев.[b] И многие народы собрались, чтобы встать в боевой строй сынов Хелеула.[c]
  to: К нему примкнули[a] все жители нагорья, все жившие вдоль Евфрата, Тигра и Гидаспа и на равнине Ариоха, царя элимеев.[b] И многие народы собрались для боевого строя сынов Хелеула.[c]
  rationale: Исправлена синтаксическая связь «равнины Ариоха, царя элимеев» с группой её жителей. Заключительная фраза переведена так, чтобы передать военный термин παράταξις, но не предрешать спорное отношение многих народов к сынам Хелеула; соответствующее пояснение дано в сноске.
