  text: And all who lived in the hill country joined him[a], and all who lived along the Euphrates and the Tigris and the Hydaspes, and in the plain of Ariok king of the Elymaeans[c][b]. And many nations assembled for battle with the sons of Cheleoul.
translation:
  language: ru
  text: К нему примкнули[a] все жители нагорья, все жившие вдоль Евфрата, Тигра и Гидаспа и на равнине Ариоха, царя элимеев.[b] И многие народы собрались для боевого строя сынов Хелеула.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол буквально означает «встретились с ним» или «вышли ему навстречу»; здесь, вероятно, имеется в виду, что они примкнули к нему.
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст подразумевает: «все жившие ... на равнине Ариоха, царя элимеев».'
    reason: syntactic_ambiguity
  - marker: c
    text: Греческое выражение буквально говорит о «боевом строе сынов Хелеула». Оно может означать как построение вместе с ними, так и сбор для битвы против них.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: συνήντησαν πρὸς αὐτόν
  choice: к нему примкнули
  rationale: Глагол буквально означает «встретились с ним» или «вышли ему навстречу», но военном и политическом контексте речь, вероятнее всего, идёт о присоединении к его стороне. «Примкнули» естественно передаёт этот оттенок, а буквальное значение отмечено в сноске.
- source_word: οἱ κατοικοῦντες τὴν ὀρεινήν
  choice: все жители нагорья
  rationale: Субстантивированное прилагательное обозначает гористую область. «Нагорье» кратко и естественно передаёт географический смысл.
- source_word: οἱ κατοικοῦντες τὸν Εὐφράτην καὶ τὸν Τίγριν καὶ τὸν Ὑδάσπην
  choice: все жившие вдоль Евфрата, Тигра и Гидаспа
  rationale: При названиях рек русский оборот «жить вдоль» идиоматически передаёт греческую конструкцию, не создавая буквального и неестественного смысла «населять реку».
- source_word: πεδίῳ Ἀριὼχ ὁ βασιλεὺς Ἐλυμαίων
  choice: а на равнине — Ариох, царь элимеев
  rationale: Эллиптическая русская конструкция сохраняет необычный греческий синтаксис и связывает Ариоха с общей глагольной формой «примкнули», не превращая его имя в название равнины.
- source_word: Ἐλυμαίων
  choice: элимеев
  rationale: Передаёт греческое название народа Элимаиды и не отождествляет его безоговорочно с более широким библейским этнонимом «эламиты».
- source_word: συνῆλθον εἰς παράταξιν
  choice: собрались, чтобы встать в боевой строй
  rationale: Передаёт как значение совместного сбора, так и военный смысл παράταξις — построение или боевой порядок.
- source_word: υἱῶν Χελεούλ
  choice: сынов Хелеула
  rationale: Сохраняет прозрачное буквальное обозначение группы через «сынов» и транслитерирует собственное имя, не подменяя его предположительным этнонимом.
