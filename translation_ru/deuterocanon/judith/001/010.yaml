lexical_decisions:
- source_word: ἕως τοῦ ἐλθεῖν
  choice: вплоть до
  rationale: Конструкция ἕως τοῦ с инфинитивом здесь обозначает пространственный предел. «Вплоть до» естественно передаёт этот смысл по-русски; повтор сохранён для соответствия структуре греческого текста.
- source_word: ἐπάνω
  choice: до
  rationale: При географических названиях слово указывает на движение или протяжённость до названного места; русское «до» передаёт это идиоматично.
- source_word: Τάνεως
  choice: Таниса
  rationale: Использована принятая русская форма древнеегипетского топонима Танис в родительном падеже после «до».
- source_word: Μέμφεως
  choice: Мемфиса
  rationale: Использована стандартная русская форма топонима Мемфис в требуемом падеже.
- source_word: πάντας τοὺς κατοικοῦντας
  choice: всех жителей
  rationale: Субстантивированное причастие буквально означает «всех живущих/обитающих»; «всех жителей» звучит естественно и сохраняет всеохватность πάντας.
- source_word: τὴν Αἴγυπτον
  choice: Египта
  rationale: При существительном «жители» объект проживания естественно выражается по-русски родительным падежом.
- source_word: ἐπὶ τὰ ὅρια
  choice: до границ
  rationale: ὅρια обозначает территориальные рубежи; множественное число передано словом «границы».
- source_word: Αἰθιοπίας
  choice: Эфиопии
  rationale: Передана непосредственно греческая форма географического названия стандартным русским эквивалентом, без замены на «Куш».
