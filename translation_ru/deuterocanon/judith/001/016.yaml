lexical_decisions:
- source_word: ἀνέστρεψεν
  choice: возвратился
  rationale: В повествовательном контексте аорист ἀναστρέφω обозначает возвращение; «возвратился» естественно и точно передаёт направленное движение назад.
- source_word: μετʼ αὐτῶν
  choice: вместе с ними
  rationale: μετά с родительным падежом выражает совместность; этот оборот ясно передаёт сопровождение.
- source_word: αὐτὸς
  choice: он сам
  rationale: Явно выраженное местоимение имеет усилительное значение и подчёркивает личное участие предводителя.
- source_word: ἡ δύναμις αὐτοῦ
  choice: его войско
  rationale: δύναμις в данном военном повествовании означает вооружённые силы; «войско» в современном русском языке звучит естественнее, чем отвлечённая «сила», и не требует понимать здесь строго организованную армию.
- source_word: ἐφʼ ἡμέρας ἑκατὸν εἴκοσι
  choice: спустя сто двадцать дней
  rationale: ἐπί с винительным падежом при обозначении времени может указывать на протяжённость периода. В контексте возвращения оборот естественно понимается как срок, по истечении которого состоялось возвращение; возможное понимание как длительности самого возвращения отмечено в сноске.
