lexical_decisions:
- source_word: πάντας τοὺς ἐν Σαμαρείᾳ
  choice: всех, кто находился в Самарии
  rationale: Эллиптическое выражение обозначает людей; добавление «кто находился» естественно передаёт подразумеваемый смысл, не уточняя их статус.
- source_word: ταῖς πόλεσιν αὐτῆς
  choice: её городах
  rationale: Местоимение относится к Самарии; форма «её» естественна в русском языке при названии женского рода.
- source_word: πέραν τοῦ Ἰορδάνου
  choice: за Иорданом
  rationale: Кратко и естественно передаёт географическое значение πέραν — «по ту сторону, за».
- source_word: ἕως Ἰερουσαλήμ
  choice: вплоть до Иерусалима
  rationale: Передаёт обозначенную ἕως пространственную протяжённость.
- source_word: Βαττανὴ
  choice: Ваттаны
  rationale: Сохранена греческая форма топонима без отождествления с Васаном; падеж согласован с управлением подразумеваемого охвата.
- source_word: Χελούς
  choice: Хелуса
  rationale: Консервативная транслитерация неуверенно идентифицируемого греческого топонима.
- source_word: Κάδης
  choice: Кадеса
  rationale: Форма следует греческому Κάδης и не подменяет её иной традиционной формой топонима.
- source_word: τοῦ ποταμοῦ Αἰγύπτου
  choice: реки Египетской
  rationale: Греческое ποταμός прямо означает «река»; традиционный русский порядок слов подходит для географического названия.
- source_word: Τάφνας
  choice: Тафны
  rationale: Сохранена непосредственно засвидетельствованная греческая форма; более известное библейское название дано в примечании.
- source_word: Ραμεσσὴ
  choice: Рамессы
  rationale: Транслитерация греческой формы с русским падежным оформлением.
- source_word: πᾶσαν γῆν Γέσεμ
  choice: всей земли Гесем
  rationale: πᾶσαν передано как «всей», а Γέσεμ сохранено в форме, непосредственно отражающей греческий текст и принятой в русской библейской топонимии.
