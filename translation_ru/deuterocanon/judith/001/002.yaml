lexical_decisions:
- source_word: ᾠκοδόμησεν
  choice: построил
  rationale: Обычное и естественное соответствие аористу οἰκοδομέω в контексте возведения городских укреплений.
- source_word: ἐπʼ Ἐκβατάνων καὶ κύκλῳ τείχη
  choice: построил … вокруг Экбатан стены
  rationale: κύκλῳ ясно передаёт окружное расположение укреплений; предложная конструкция ἐπʼ Ἐκβατάνων сжата, поэтому её точный оттенок отмечен в сноске.
- source_word: λίθων λελαξευμένων
  choice: из тёсаных камней
  rationale: Причастие от λαξεύω обозначает камни, обработанные тесанием; «тёсаные камни» — точное и привычное русское выражение.
- source_word: εἰς πλάτος πηχῶν τριῶν καὶ εἰς μῆκος πηχῶν ἕξ
  choice: по три локтя в ширину и по шесть в длину
  rationale: Размеры, вероятнее всего, относятся к обработанным камням; частица «по» естественно передаёт размер отдельных строительных блоков, не устраняя некоторую синтаксическую неоднозначность.
- source_word: ἐποίησεν τὸ ὕψος τοῦ τείχους πηχῶν ἑβδομήκοντα
  choice: высоту стены он сделал в семьдесят локтей
  rationale: Сохраняется конструкция исходного текста и ясно выражается заданная высота стены.
- source_word: καὶ τὸ
  choice: а её…
  rationale: Предоставленный греческий текст обрывается на артикле среднего рода после καί; местоимение со многоточием честно передаёт незавершённость фразы, не восстанавливая отсутствующие слова по иной редакции.
