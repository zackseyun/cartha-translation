lexical_decisions:
- source_word: τοὺς ἐν τοῖς ἔθνεσι
  choice: тех, кто среди народов
  rationale: Сохраняет личное значение артикля с прилагательным оборотом и широкое значение ἔθνη — «народы», не вводя конфессионально нагруженное «язычники». Эллиптичность исходного перечисления также сохраняется.
- source_word: Καρμήλου
  choice: Кармила
  rationale: Использована традиционная русская библейская форма топонима без добавления слова «гора», которого нет в греческом тексте.
- source_word: Γαλαὰδ
  choice: Галаада
  rationale: Традиционная русская библейская форма названия; падеж согласован с конструкцией «народов Кармила и Галаада».
- source_word: τὴν ἄνω Γαλιλαίαν
  choice: Верхнюю Галилею
  rationale: ἄνω имеет географическое значение «верхняя»; сочетание передано как принятое название области.
- source_word: τὸ μέγα πεδίον
  choice: великую равнину
  rationale: πεδίον обозначает равнинную, ровную местность, а μέγα прямо передано словом «великую».
- source_word: Ἐσδρήμ
  choice: Эсдрима
  rationale: Передана непосредственно засвидетельствованная греческая форма названия; более привычные отождествления с Ездрилонской или Изреельской равниной вынесены в примечание, чтобы не подменять форму оригинала.
