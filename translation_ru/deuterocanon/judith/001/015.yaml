    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβε
  choice: захватил
  rationale: В военном контексте глагол означает взятие противника силой; «захватил» ясно и естественно передаёт это значение.
- source_word: ἐν τοῖς ὄρεσι
  choice: в горах
  rationale: Естественная русская передача множественного числа ὄρη и места военных действий.
- source_word: Ῥαγαῦ
  choice: Рагау
  rationale: Транслитерация формы греческого текста Ῥαγαῦ без замены традиционной формой из иной текстовой традиции.
- source_word: κατηνάγκισεν
  choice: одолел
  rationale: В данном боевом контексте глагол выражает силовое подавление; «одолел» сохраняет военный смысл и звучит естественно.
- source_word: ἐν ταῖς σιβύναις αὐτοῦ
  choice: своими дротиками
  rationale: σίβυνη обозначает лёгкое копьё или метательное оружие; «дротики» сохраняет конкретный образ и инструментальное значение конструкции.
- source_word: ἐξωλέθρευσεν
  choice: истребил
  rationale: Глагол обозначает полное уничтожение и сильнее простого «убил»; «истребил» передаёт эту интенсивность без добавочного наречия.
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: до того самого дня
  rationale: Формулировка сохраняет указательное значение ἐκείνης и временную перспективу рассказчика, не заменяя её интерпретирующим «до сего дня».
