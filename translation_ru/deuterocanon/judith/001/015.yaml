  text: And he captured Arphaxad in the mountains of Ragau[a], and overpowered him with his javelins, and destroyed him to this day.
translation:
  language: ru
  text: И он захватил Арфаксада в горах Рагау[a], одолел его своими дротиками и истребил его до того самого дня.
  philosophy: optimal-equivalence
