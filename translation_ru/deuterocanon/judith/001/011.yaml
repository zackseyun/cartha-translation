revisions:
- from: И все жители всей земли с презрением отнеслись к слову Навуходоносора, царя ассирийцев,[a] и не присоединились к нему для войны, потому что не боялись его. В их глазах он был всего лишь равным им человеком.[b] Они отослали его посланников назад ни с чем и с позором — прочь от него.[c]
  to: И все жители всей земли с презрением отнеслись к слову Навуходоносора, царя ассирийцев,[a] и не выступили вместе с ним на войну, потому что не боялись его. В их глазах он был всего лишь равным им человеком.[b] Они отослали его посланников обратно к нему ни с чем и с позором.[c]
  rationale: Исправлен только заключительный пространственный оборот, который в черновике неверно передавал πρό как удаление «прочь от». Основной текст теперь ясно выражает возвращение посланников к царю, а сноска сохраняет буквальную и несколько неоднозначную форму греческого выражения «перед лицом его». Также слегка улучшена естественность передачи военного присоединения.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:09:07Z'
