    rationale: 'В греческом тексте стоит πρὸ προσώπου αὐτοῦ, буквально «перед лицом его», а не выражение с предлогом «от». «Прочь от него» меняет направленность и создаёт неясность: посланников отсылают назад к Навуходоносору, а не прочь от него. Нужны «обратно к нему» в основном тексте и точная буквальная передача в сноске.'
