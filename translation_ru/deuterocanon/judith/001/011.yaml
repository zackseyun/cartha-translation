base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/011.yaml
  text: And all who inhabited the whole land treated the word of Nebuchodonosor king of the Assyrians with contempt, and they did not join him for the war, because they did not fear him, but he was before them like an ordinary man, and they sent his messengers back empty, in dishonor, from before him.
translation:
  language: ru
  text: И все жители всей земли с презрением отнеслись к слову Навуходоносора, царя ассирийцев,[a] и не выступили вместе с ним на войну, потому что не боялись его. В их глазах он был всего лишь равным им человеком.[b] Они отослали его посланников обратно к нему ни с чем и с позором.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пренебрегли посланием (повелением) Навуходоносора». Греческое τὸ ῥῆμα может означать «слово», «послание» или «повеление», а ἐφαύλισαν — считать это незначительным, относиться с пренебрежением.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «он был перед ними как равный человек». То есть они считали его всего лишь человеком одного с ними уровня, которого не следует бояться.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «они повернули его посланников назад пустыми, в бесчестии, перед лицом его». Иначе: «отослали его посланников назад с пустыми руками и с позором, обратно к нему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφαύλισαν
  choice: с презрением отнеслись
  rationale: Глагол означает счесть нечто маловажным, низким или недостойным внимания. Выбранная формулировка передаёт сознательное пренебрежение, не сводя его лишь к эмоциональной ненависти.
- source_word: οἱ κατοικοῦντες πᾶσαν τὴν γῆν
  choice: все жители всей земли
  rationale: Сохранены оба показателя всеобщности — πάντες и πᾶσαν; по-русски именная конструкция звучит естественнее буквального причастного оборота.
- source_word: τὸ ῥῆμα
  choice: слово
  rationale: Слово ῥῆμα допускает значения «слово», «весть» и «повеление». «Слово» сохраняет широту греческого выражения, тогда как контекст указывает на переданное царское требование.
- source_word: οὐ συνῆλθον αὐτῷ εἰς τὸν πόλεμον
  choice: не присоединились к нему для войны
  rationale: Фраза обозначает отказ собраться с царём или примкнуть к нему ради военных действий; формулировка сохраняет целевое значение εἰς τὸν πόλεμον.
- source_word: ἦν ἐναντίον αὐτῶν ὡς ἀνὴρ ἴσος
  choice: в их глазах он был всего лишь равным им человеком
  rationale: Передан смысл человека одного с ними уровня, которого они не считали превосходящим их и потому не боялись. «В их глазах» естественно выражает оценочную перспективу оборота ἐναντίον αὐτῶν.
- source_word: ἀνέστρεψαν τοὺς ἀγγέλους αὐτοῦ κενούς
  choice: отослали его посланников назад ни с чем
  rationale: ἀναστρέφω здесь означает отправить или повернуть назад, а κενούς — без достигнутого результата, «с пустыми руками».
- source_word: ἐν ἀτιμίᾳ
  choice: с позором
  rationale: Естественно передаёт бесчестное, унизительное обращение, выраженное существительным ἀτιμία.
- source_word: πρὸ προσώπου αὐτοῦ
  choice: прочь от него
  rationale: Формулировка передаёт пространственный образ «от лица/присутствия его», не используя неестественное русское «от лица его»; буквальная форма отмечена в сноске.
