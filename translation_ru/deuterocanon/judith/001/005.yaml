    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησεν πόλεμον
  choice: начал войну
  rationale: Греческая идиома буквально означает «сделал войну», но по-русски естественно передаётся как «начал войну»; выражение сохраняет инициативу Навуходоносора, не добавляя подробностей о ходе военных действий.
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: в те дни
  rationale: Прямое и естественное соответствие обычному временному обороту.
- source_word: βασιλεὺς Ναβουχοδονοσόρ
  choice: царь Навуходоносор
  rationale: Титул βασιλεύς передан словом «царь», а имя — в закрепившейся русской библейской форме.
- source_word: πρὸς βασιλέα Ἀρφαξάδ
  choice: против царя Арфаксада
  rationale: В контексте войны πρός обозначает направленность враждебного действия; «против» ясно и естественно передаёт этот смысл.
- source_word: ἐν τῷ πεδίῳ τῷ μεγάλῳ
  choice: на великой равнине
  rationale: πεδίον обозначает равнину или ровную открытую местность; русский предлог «на» здесь идиоматичнее буквального «в».
- source_word: τοῦτʼ ἔστιν
  choice: то есть
  rationale: Сохраняет пояснительную функцию греческого оборота.
- source_word: τοῖς ὁρίοις Ῥαγαῦ
  choice: в пределах Рагава
  rationale: ὅρια может обозначать границы, пределы либо охватываемую ими территорию. «В пределах» сохраняет географический смысл и близость к формулировке источника; «Рагава» — традиционная русская форма топонима.
