  text: And in those days King Nebuchadnezzar made war against King Arphaxad in the great plain[a], that is, in the territory of Ragae.
translation:
  language: ru
  text: И в те дни царь Навуходоносор вёл войну против царя Арфаксада на великой равнине, то есть в пределах Рагава[a].
