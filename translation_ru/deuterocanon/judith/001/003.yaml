translation:
  language: ru
  text: Ширина его составляла пятьдесят локтей. У её ворот он воздвиг башни высотой в сто локтей, а основание её заложил шириной в шестьдесят локтей[a].
  philosophy: optimal-equivalence
  footnotes:
