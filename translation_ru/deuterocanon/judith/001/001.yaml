  text: In the twelfth year of the reign of Nebuchadnezzar[a], who reigned over the Assyrians in Nineveh, the great city, in the days of Arphaxad, who reigned over the Medes in Ecbatana,
translation:
  language: ru
  text: В двенадцатый год царствования Навуходоносора, который царствовал над ассирийцами в Ниневии, великом городе, во дни Арфаксада, царствовавшего над мидянами в Экбатанах,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте стих оканчивается союзом «и», поскольку предложение непосредственно продолжается в следующем стихе; в переводе незавершённость предложения передана запятой.
    reason: textual_variant
lexical_decisions:
- source_word: ἜΤΟΥΣ δωδεκάτου τῆς βασιλείας
  choice: В двенадцатый год царствования
  rationale: Естественная русская формула датировки, точно передающая указание на двенадцатый год правления.
- source_word: Ναβουχοδονοσόρ
  choice: Навуходоносора
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: ὃς ἐβασίλευσεν Ἀσσυρίων
  choice: который царствовал над ассирийцами
  rationale: Передаёт глагол ἐβασίλευσεν и родительный Ἀσσυρίων как обозначение народа, над которым он правил.
- source_word: ἐν Νινευῇ τῇ πόλει τῇ μεγάλῃ
  choice: в Ниневии, великом городе
  rationale: Сохраняет локатив и приложение с возвышенным эпитетом, оставаясь естественным по-русски.
- source_word: ἐν ταῖς ἡμέραις Ἀρφαξάδ
  choice: во дни Арфаксада
  rationale: Литературная русская формула, близко передающая стандартное греческое выражение времени.
- source_word: ὃς ἐβασίλευσεν Μήδων
  choice: царствовавшего над мидянами
  rationale: Причастная конструкция избегает тяжёлого повторения «который» и сохраняет смысл греческого относительного предложения.
- source_word: ἐν Ἐκβατάνοις
  choice: в Экбатанах
  rationale: Употреблена традиционная русская форма названия города во множественном числе.
- source_word: καὶ
  choice: ','
  rationale: Конечное καὶ связывает текст со следующим стихом; запятая естественно показывает незавершённость предложения в русском тексте.
