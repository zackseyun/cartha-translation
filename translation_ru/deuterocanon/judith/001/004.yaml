- source_word: ἐθεμελίωσεν
  choice: заложил её основание
  rationale: Передаёт строительное значение глагола и естественно звучит по-русски.
- source_word: εἰς πήχεις ἑξήκοντα
  choice: на шестьдесят локтей
  rationale: Греческий оборот обозначает меру основания, но явно не называет измерение; русский перевод сохраняет эту неоднозначность, не добавляя «в глубину» в основной текст.
- source_word: πύλας διεγειρμένας
  choice: ворота, вознесённые
  rationale: Причастие буквально передаёт образ ворот, поднятых или возведённых вверх; «вознесённые» сохраняет возвышенный повествовательный регистр.
- source_word: εἰς ὕψος πηχῶν ἑβδομήκοντα
  choice: на высоту семидесяти локтей
  rationale: Прямо и ясно передаёт указанное вертикальное измерение.
- source_word: τὸ πλάτος αὐτῆς πήχεις τεσσεράκοντα
  choice: шириной в сорок локтей
  rationale: Естественная русская форма размерного описания; местоимение соотнесено с воротами по ближайшему смысловому контексту.
- source_word: εἰς ἐξόδους
  choice: для выхода
  rationale: Сохраняет основное значение «выход, выступление» и допускает военный смысл движения или вылазки.
- source_word: δυνάμεως δυνατῶν αὐτοῦ
  choice: войска его могучих воинов
  rationale: Сохраняет раздельно военное значение δυνάμεως и характеристику людей через δυνατῶν, не сливая оба слова в выражение «могучие силы».
- source_word: διατάξεις
  choice: построений
  rationale: В военном контексте обозначает упорядоченное расположение, строй или боевые построения.
- source_word: τῶν πεζῶν αὐτοῦ
  choice: его пехотинцев
  rationale: Краткий и современный русский эквивалент обозначения пеших воинов.
