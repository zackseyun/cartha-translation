  text: Он заложил её основание на шестьдесят локтей[a] и сделал её ворота — ворота, высоко воздвигнутые на семьдесят локтей и шириной в сорок локтей, — для выступлений его войска, состоявшего из могучих воинов, и для построений его пехотинцев.
