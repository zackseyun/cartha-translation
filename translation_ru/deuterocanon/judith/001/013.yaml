  text: And in the seventeenth year he drew up his forces for battle against King Arphaxad, and he prevailed in his war, and routed all the force of Arphaxad, all his cavalry, and all his chariots,
translation:
  language: ru
  text: В семнадцатый год он выстроил свои войска для битвы против царя Арфаксада, одержал верх в этой войне и обратил в бегство всё войско Арфаксада, всю его конницу и все его колесницы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρετάξατο ἐν τῇ δυνάμει αὐτοῦ
  choice: выстроил свои войска для битвы
  rationale: Средняя форма παρατάσσω в военном контексте означает построить или развернуть войска; δύναμις здесь обозначает военные силы, а не отвлечённую мощь.
- source_word: πρὸς Ἀρφαξὰδ βασιλέα
  choice: против царя Арфаксада
  rationale: Предлог πρὸς в контексте боевого построения выражает направленность против противника; имя передано в родительном падеже по нормам русского языка.
- source_word: ἐκραταιώθη ἐν τῷ πολέμῳ αὐτοῦ
  choice: одержал верх в войне с ним
  rationale: Формально глагол означает «укрепился, стал сильнее», но в данном военном сообщении выражает достижение превосходства. Местоимение αὐτοῦ допускает неоднозначность; русский оборот естественно связывает войну с Арфаксадом, не добавляя лишней конкретизации.
- source_word: ἀνέστρεψεν
  choice: обратил в бегство
  rationale: В военном контексте глагол означает повернуть неприятеля вспять, разгромить; выбранный оборот ясно передаёт бегство побеждённых войск.
- source_word: πᾶσαν τὴν δύναμιν Ἀρφαξὰδ
  choice: всё войско Арфаксада
  rationale: δύναμις здесь обозначает совокупность вооружённых сил. «Войско» естественно по-русски и сохраняет собирательное значение.
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: всю его конницу
  rationale: Собирательное ἵππος в перечне родов войск обозначает конницу, а не отдельных лошадей.
- source_word: πάντα τὰ ἅρματα αὐτοῦ
  choice: все его колесницы
  rationale: ἅρματα прямо обозначает боевые колесницы; буквальный русский эквивалент ясен в данном военном перечне.
