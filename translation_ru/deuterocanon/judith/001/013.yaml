  source_fidelity: 'В целом перевод точно передаёт военный смысл: παρετάξατο ἐν τῇ δυνάμει αὐτοῦ — построение собственных войск, ἐκραταιώθη — достижение перевеса в войне, а ἀνέστρεψεν — обращение неприятельских сил в бегство. Однако «в войне с ним» интерпретирует αὐτοῦ как отсылку к Арфаксаду, тогда как греческое притяжательное местоимение при «войне» естественнее относится к субъекту и может обозначать его военную кампанию. Эту конкретизацию лучше не вносить.'
