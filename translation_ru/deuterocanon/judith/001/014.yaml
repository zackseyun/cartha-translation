    rationale: В греческом αὐτῆς стоит в единственном числе и последовательно относится к Экбатанам как к городу. В русском «их» формально согласуется с названием «Экбатаны», но также может быть отнесено к «его городами» в начале предложения. Явное «города» устраняет это без изменения смысла.
  - severity: low
    issue: «Разграбил их площади» менее естественно в современном русском, чем «разграбил улицы города».
    rationale: πλατεῖαι может обозначать широкие улицы или общественные площади. Выбор «улицы» соответствует основному контекстуальному значению и сочетаемости с глаголом «разграбить»; альтернативное значение сохранено в сноске.
