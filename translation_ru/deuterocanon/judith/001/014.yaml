lexical_decisions:
- source_word: ἐκυρίευσεν τῶν πόλεων αὐτοῦ
  choice: овладел его городами
  rationale: Κυριεύω с родительным падежом обозначает установление господства или контроля. «Овладел» естественно передаёт военный захват, не предполагая длительного управления; местоимение «его» сохраняет αὐτοῦ.
- source_word: ἀφίκετο ἕως Ἐκβατάνων
  choice: дошёл до Экбатан
  rationale: Ἀφικνέομαι означает достижение места, а ἕως указывает предел продвижения. Русская форма «Экбатаны» традиционно употребляется во множественном числе, отсюда «до Экбатан».
- source_word: ἐκράτησεν τῶν πύργων
  choice: захватил их башни
  rationale: Κρατέω с родительным падежом здесь означает силой взять под контроль. «Их» по-русски естественно соотносится с Экбатанами и передаёт принадлежность башен городу.
- source_word: ἐπρονόμευσε τὰς πλατείας αὐτῆς
  choice: разграбил их площади
  rationale: Προνομεύω означает брать добычу, грабить. Πλατεῖαι могут быть площадями либо широкими городскими улицами; «площади» хорошо передаёт общественные открытые пространства, а неоднозначность отмечена в сноске.
- source_word: τὸν κόσμον αὐτῆς
  choice: их великолепие
  rationale: Κόσμος здесь означает украшение, красоту или великолепие города, а не «мир». «Великолепие» передаёт видимое богатство Экбатан.
- source_word: ἔθηκεν εἰς ὄνειδος
  choice: превратил в позор
  rationale: Оборот буквально описывает превращение в предмет поношения или позора. Русское «превратил в позор» сохраняет резкое противопоставление великолепия и унижения.
