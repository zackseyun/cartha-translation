  text: And Nebuchadnezzar king of the Assyrians sent to all who lived in Persia and to all who lived toward the west—to those living in Cilicia and Damascus[a], Lebanon and Anti-Lebanon, and to all who lived along the seacoast—
translation:
  language: ru
  text: И Навуходоносор, царь ассирийцев, послал ко всем живущим в Персии и ко всем живущим к западу[a] — ко всем, кто жил в Киликии и Дамаске, в Ливане и Антиливане, и ко всем живущим вдоль морского побережья, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в западных областях». Буквально: «к западу».'
    reason: Греческое выражение πρὸς δυσμαῖς допускает как направительное понимание, так и более общее обозначение западных областей.
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: послал
  rationale: Греческий глагол оставляет подразумеваемое дополнение — вестников или обращение — неназванным; русский глагол «послал» сохраняет эту сжатость.
- source_word: ἐπὶ πάντας τοὺς κατοικοῦντας
  choice: ко всем живущим
  rationale: В сочетании с ἀπέστειλεν предлог обозначает направленность к адресатам, а не враждебное движение против них.
- source_word: τὴν Περσίδα
  choice: в Персии
  rationale: «Персия» — общепринятое русское название данной области.
- source_word: πρὸς δυσμαῖς
  choice: к западу
  rationale: Передаёт пространственную направленность греческого выражения, не превращая его без необходимости в официальное название региона.
- source_word: τοὺς κατοικοῦντας τὴν Κιλικίαν καὶ Δαμασκόν
  choice: ко всем, кто населял Киликию и Дамаск
  rationale: Глагол «населял» естественно передаёт κατοικέω с прямым дополнением и сохраняет перечисление территорий и города.
- source_word: τὸν Λίβανον καὶ Ἀντιλίβανον
  choice: Ливан и Антиливан
  rationale: Сохранены традиционные русские названия двух горных областей.
- source_word: κατὰ πρόσωπον παραλίας
  choice: вдоль морского побережья
  rationale: Так естественно по-русски передаётся обозначение прибрежной полосы; буквальное «перед лицом побережья» было бы неясным.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Повтор «ко всем живущим» частично сохранён ради ритма и структуры исходного перечисления. Конечное тире и запятая показывают, что длинный перечень продолжается в следующем стихе.
