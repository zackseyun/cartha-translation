base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/001/012.yaml
  text: And Nebuchadnezzar became very angry with all this land[a], and he swore by his throne and his kingdom that he would surely avenge himself on all the territories of Cilicia and Damascus and Syria, and put them to the sword—along with all who lived in Moab and the Ammonites and all Idumea and all those in Egypt[b]—until one came to the borders of the two seas.
translation:
  language: ru
  text: И Навуходоносор сильно разгневался на всю эту землю и поклялся своим престолом и царством[a], что непременно отомстит всем землям Киликии, Дамаска и Сирии, предав мечу их жителей, а также всех живущих в Моаве, аммонитян, всю Идумею и всех, кто в Египте, — вплоть до пределов двух морей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее формулу клятвы можно передать: «если не отомстит». В греческом здесь выражена не обычная отрицательная условность, а твёрдая клятвенная решимость.'
    reason: lexical_alternative
  - marker: b
    text: «Два моря», вероятно, обозначают моря, ограничивающие с двух сторон всю названную здесь область.
    reason: cultural_note
lexical_decisions:
- source_word: ἐθυμώθη ... σφόδρα
  choice: сильно разгневался
  rationale: Передаёт наступление состояния гнева и усиление σφόδρα естественным современным русским выражением.
- source_word: ἐπὶ πᾶσαν τὴν γῆν ταύτην
  choice: на всю эту землю
  rationale: Предлог «на» при глаголе «разгневаться» естественно выражает направленность гнева, а γῆ здесь обозначает всю упомянутую область.
- source_word: κατὰ τοῦ θρόνου καὶ τῆς βασιλείας αὐτοῦ
  choice: своим престолом и царством
  rationale: В контексте клятвы κατά вводит то, чем клянутся; буквальное «против» исказило бы смысл.
- source_word: εἰ μὴ ἐκδικήσει
  choice: что непременно отомстит
  rationale: После ὤμοσεν оборот εἰ μή имеет усилительное значение формулы клятвы, а не выражает обычное отрицательное условие.
- source_word: πάντα τὰ ὅρια
  choice: всем землям
  rationale: ὅρια буквально означает «границы, пределы», но здесь метонимически указывает на ограниченные ими территории; «земли» звучит естественно в геополитическом перечне.
- source_word: ἀνελεῖν τῇ ῥομφαίᾳ αὐτούς
  choice: предав мечу их жителей
  rationale: Сохраняет военный образ уничтожения мечом. Мужское αὐτούς не может грамматически относиться к среднему τὰ ὅρια, поэтому в русском явно названы подразумеваемые жители этих земель.
- source_word: τοὺς υἱοὺς Ἀμμών
  choice: аммонитян
  rationale: Естественный русский этноним передаёт семитский оборот «сыновья Аммона» без ненужной буквальности.
- source_word: πᾶσαν τὴν Ἰδουμαίαν
  choice: всю Идумею
  rationale: Сохраняется греческое географическое наименование Ἰδουμαία, а не заменяется формой «Эдом».
- source_word: ἕως τοῦ ἐλθεῖν ἐπὶ τὰ ὅρια τῶν δύο θαλασσῶν
  choice: вплоть до пределов двух морей
  rationale: Передаёт пространственный предел похода, не вводя в основной текст прямо не названного в греческом подлежащего инфинитива ἐλθεῖν.
theological_decisions:
- issue: Формула клятвы ὤμοσεν ... εἰ μή
  choice: что непременно отомстит
  alternative: если не отомстит / разве только не отомстит
  rationale: В данном обороте отрицательное условие служит формулой усиленной клятвы. Идиоматический перевод передаёт твёрдую решимость, не превращая её в неясное условие.
- issue: Неявное подлежащее в ἕως τοῦ ἐλθεῖν
  choice: вплоть до пределов двух морей
  alternative: пока он не дойдёт до пределов двух морей
  rationale: Безличное выражение пространственного предела сохраняет отсутствие явно названного подлежащего и не решает скрытую синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным повествовательным тоном. Военная жестокость исходного текста сохранена без смягчения; синтаксис длинного перечня упорядочен средствами русской пунктуации.
