  text: Καὶ ἐθυμώθη Ναβουχοδονοσὸρ ἐπὶ πᾶσαν τὴν γῆν ταύτην σφόδρα, καὶ ὤμοσεν κατὰ τοῦ θρόνου καὶ τῆς βασιλείας αὐτοῦ, εἰ μὴ ἐκδικήσει πάντα τὰ ὅρια τῆς Κιλικίας καὶ Δαμασκηνῆς καὶ Συρίας, ἀνελεῖν τῇ ῥομφαίᾳ αὐτοὺς καὶ πάντας τοὺς κατοικοῦντας ἐν τῇ Μωὰβ καὶ τοὺς υἱοὺς Ἀμμὼν καὶ πᾶσαν τὴν Ἰδουμαίαν καὶ πάντας τοὺς ἐν Αἰγύπτῳ ἕως τοῦ ἐλθεῖν ἐπὶ τὰ ὅρια τῶν δύο θαλασσῶν.
