lexical_decisions:
- source_word: κεκοπωμένοι
  choice: изнемогли
  rationale: Перфектное причастие обозначает наступившее состояние сильной усталости. «Изнемогли» естественно передаёт интенсивность и результат, не добавляя причины сверх названной далее.
- source_word: διὰ τὸ ... γεγονέναι
  choice: потому что ... затянулось
  rationale: Субстантивированный инфинитив с διά выражает причину. Русская причинная конструкция передаёт связь ясно и естественно.
- source_word: ἐπὶ πλεῖον
  choice: слишком затянулось
  rationale: Выражение указывает на чрезмерную продолжительность или степень. В сочетании с πότος глагол «затянулось» хорошо передаёт прежде всего длительность, а «слишком» сохраняет значение избыточности.
- source_word: τὸν πότον
  choice: питьё
  rationale: πότος означает питьё, особенно совместное или продолжительное употребление вина. «Питьё» сохраняет предметную неопределённость греческого слова; «пир» необоснованно добавлял бы еду, а «попойка» была бы слишком разговорной.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит объяснение предшествующего положения. «Ведь» естественно сохраняет пояснительную связь в современном русском языке.
