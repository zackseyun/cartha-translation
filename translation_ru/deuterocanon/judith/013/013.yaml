  yaml_path: translation/deuterocanon/judith/013/013.yaml
  text: And they all ran together[a], from the least to the greatest among them, because it seemed astonishing to them that she had come; and they opened the gate and welcomed them. After lighting a fire for light, they gathered around them.
translation:
  language: ru
  text: И сбежались все, от мала до велика, потому что им казалось удивительным, что она пришла. Они открыли ворота и приняли их[a]. Зажегши огонь, чтобы было светло, они обступили их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Иудифь и сопровождавшую её служанку.
    reason: Местоимение женского рода во множественном числе в греческом тексте указывает на обеих женщин.
lexical_decisions:
- source_word: συνέδραμον
  choice: сбежались
  rationale: Глагол передаёт поспешное движение людей, сходящихся к одному месту; «сбежались» естественно сохраняет и быстроту, и собирательный смысл.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: от мала до велика
  rationale: Устойчивый русский оборот передаёт меризм, охватывающий всё сообщество, и не сужает значение только до возраста.
- source_word: παράδοξον
  choice: удивительным
  rationale: Слово обозначает нечто неожиданное, вызывающее изумление; этот вариант не придаёт событию отрицательного оттенка.
- source_word: τοῦ ἐλθεῖν αὐτήν
  choice: что она пришла
  rationale: Артиклевый инфинитив выражает содержание того, что показалось удивительным; личная конструкция естественна по-русски и не добавляет отсутствующего в греческом глагола «вернулась».
- source_word: ἀπεδέξαντο
  choice: приняли
  rationale: Глагол означает благожелательно принять прибывших; «приняли» сохраняет этот смысл без излишнего усиления.
- source_word: ἅψαντες πῦρ
  choice: зажегши огонь
  rationale: Деепричастная конструкция передаёт действие, предшествующее тому, как люди обступили женщин.
- source_word: εἰς φάσιν
  choice: чтобы было светло
  rationale: Оборот ясно выражает цель разведения огня — освещение, не истолковывая его как сигнальный огонь.
- source_word: περιεκύκλωσαν
  choice: обступили
  rationale: «Обступили» сохраняет пространственный образ окружения людьми, не создавая неуместного оттенка враждебности.
- source_word: αὐτάς
  choice: их
  rationale: Форма женского рода во множественном числе относится к Иудифи и сопровождавшей её женщине; русское местоимение естественно передаёт её без пояснительной вставки в основной текст.
