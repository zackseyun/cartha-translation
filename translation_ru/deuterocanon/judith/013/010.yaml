  text: And she struck his neck twice with all her strength[a], and removed his head, and rolled his body off the bed[b], and took the canopy down from the posts.
translation:
  language: ru
  text: И она дважды ударила его по шее с силой и отсекла ему голову. Затем она скатила его тело с постели и сняла полог[a] со столбиков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «противомоскитную сетку». Греческое слово может обозначать как сетку от комаров, так и полог над постелью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπάταξεν εἰς τὸν τράχηλον αὐτοῦ
  choice: ударила его по шее
  rationale: Глагол πατάσσω обозначает сильный удар, а конструкция с εἰς после глагола удара естественно передаётся по-русски как «ударила по шее».
- source_word: δὶς ἐν τῇ ἰσχύϊ αὐτῆς
  choice: дважды … изо всей силы
  rationale: δὶς прямо означает «дважды»; идиоматическое «изо всей силы» естественно выражает способ и напряжённость действия.
- source_word: ἀφεῖλεν τὴν κεφαλὴν αὐτοῦ
  choice: отсекла ему голову
  rationale: Хотя ἀφαιρέω буквально значит «удалить, отнять», в данном контексте речь недвусмысленно идёт об отсечении головы. Буквальное «сняла/удалила голову» по-русски звучало бы неестественно и могло бы затемнить действие.
- source_word: ἀπεκύλισεν τὸ σῶμα αὐτοῦ ἀπὸ τῆς στρωμνῆς
  choice: скатила его тело с постели
  rationale: ἀποκυλίω передаёт движение посредством перекатывания, а στρωμνή здесь естественно понимается как постель или ложе. «Тело» сохраняет нейтральное σῶμα без замены на «труп».
- source_word: κωνώπιον
  choice: полог
  rationale: κωνώπιον может обозначать противомоскитную сетку либо полог над ложем. Русское «полог» естественно для обстановки спальни и не устраняет предметную неоднозначность полностью.
- source_word: ἀπὸ τῶν στύλων
  choice: со столбиков
  rationale: στῦλοι — опорные столбики, на которых был укреплён полог; уменьшительная русская форма уместна для деталей кровати и не подразумевает архитектурных колонн.
theological_decisions:
- issue: Степень явности обезглавливания в повествовании
  choice: отсекла ему голову
  alternative: сняла у него голову / отделила его голову
  rationale: Греческий глагол сам по себе шире специального обозначения обезглавливания, однако непосредственный контекст точно определяет действие. Ясный современный русский перевод здесь лучше передаёт смысл, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис остаётся ясным и динамичным; архаизмы устранены. Союз καί в начале сохранён как «И», последующие действия связаны естественными русскими средствами.
