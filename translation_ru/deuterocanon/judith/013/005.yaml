  source_fidelity: 'Перевод точно передаёт структуру и смысл греческого текста: πάντες — «все», ἀπῆλθοσαν — «удалились», οὐδεὶς κατελείφθη — «не осталось никого», ἐν τῷ κοιτῶνι — «в спальне». Формула «от малого до великого» удачно сохраняет меризм ἀπὸ μικροῦ ἕως μεγάλου, не сужая его до возрастного значения. «От него» контекстуально верно передаёт ἐκ προσώπου при том, что в самой греческой фразе лицо не названо явно.'
