  yaml_path: translation/deuterocanon/judith/013/005.yaml
  text: And they all went away from his presence[a], and no one was left in the bedroom, from the least to the greatest.
translation:
  language: ru
  text: И все удалились от него[a], и в спальне не осталось никого — от малого до великого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лица»; в греческом тексте здесь не названо, чьё именно присутствие имеется в виду.'
    reason: Сохраняет особенность и некоторую недосказанность греческого выражения ἐκ προσώπου, тогда как основной текст передаёт его естественным русским оборотом.
lexical_decisions:
- source_word: ἀπῆλθοσαν
  choice: удалились
  rationale: Аорист ἀπέρχομαι обозначает уход. «Удалились» естественно сочетается с указанием на оставление чьего-либо присутствия и сохраняет достоинство повествования.
- source_word: ἐκ προσώπου
  choice: от него
  rationale: Греческое выражение буквально означает «от лица» и передаёт уход из чьего-либо присутствия. В современном русском «от него» звучит естественно; подразумеваемое лицо определяется контекстом, хотя притяжательное местоимение в данной греческой формулировке отсутствует.
- source_word: οὐδεὶς κατελείφθη
  choice: не осталось никого
  rationale: Пассивная форма καταλείπω здесь указывает, что в помещении никого не оставили и никто там не остался. Русская безличная конструкция точна и естественна.
- source_word: ἐν τῷ κοιτῶνι
  choice: в спальне
  rationale: κοιτών обозначает помещение для сна, личную спальню. «Спальня» — современное и понятное соответствие без архаического оттенка.
- source_word: ἀπὸ μικροῦ ἕως μεγάλου
  choice: от малого до великого
  rationale: Устойчивый меризм охватывает всех без исключения, вероятнее всего независимо от положения или ранга. Традиционная русская формула сохраняет широту выражения и не сводит его к возрасту.
