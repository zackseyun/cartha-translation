base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/006.yaml
  text: And Judith stood beside his bed and said in her heart[a], “Lord, God of all power, look upon the works of my hands at this hour[b], for the exaltation of Jerusalem.”
translation:
  language: ru
  text: 'Иудифь, встав у его постели, сказала в своём сердце[a]: «Господи, Боже всякой силы! Воззри в этот час на дела моих рук ради возвышения Иерусалима[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сказала про себя». Буквально по-гречески: «сказала в своём сердце» — библейское выражение, обозначающее внутреннюю речь или молитву.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы Иерусалим был возвышен». Греческое выражение говорит о поднятии или возвышении Иерусалима.'
    reason: alternative_reading
lexical_decisions:
- source_word: στᾶσα
  choice: встав
  rationale: Аористное причастие обозначает действие, предшествующее внутренней молитве Иудифи; деепричастие естественно передаёт последовательность.
- source_word: παρὰ τὴν κλίνην αὐτοῦ
  choice: у его постели
  rationale: παρά с винительным указывает на положение рядом; «постель» уместно в контексте и сохраняет достойный повествовательный регистр.
- source_word: εἶπεν ἐν τῇ καρδίᾳ ἑαυτῆς
  choice: сказала в своём сердце
  rationale: Сохранён библейский образ внутренней речи и молитвы; более истолковательное «сказала про себя» дано в примечании.
- source_word: Κύριε ὁ θεὸς πάσης δυνάμεως
  choice: Господи, Боже всякой силы
  rationale: Обращение передано звательными формами; «всякой силы» близко к πάσης δυνάμεως и сохраняет возможный широкий смысл выражения.
- source_word: ἐπίβλεψον
  choice: воззри
  rationale: Глагол означает направить взор и благосклонное внимание. «Воззри» сохраняет молитвенную торжественность и остаётся понятным в современном библейском регистре.
- source_word: ἐν τῇ ὥρᾳ ταύτῃ
  choice: в этот час
  rationale: Формально и естественно передаёт временное выражение, сохраняя его торжественное звучание.
- source_word: ἐπὶ τὰ ἔργα τῶν χειρῶν μου
  choice: на дела моих рук
  rationale: Сохранён буквальный библейский образ, обозначающий предпринимаемые Иудифью действия.
- source_word: εἰς ὕψωμα Ἰερουσαλήμ
  choice: ради возвышения Иерусалима
  rationale: ὕψωμα передаёт высоту или возвышение; перевод сохраняет метафору и не подменяет её более конкретным «избавлением».
theological_decisions:
- issue: Формула внутренней молитвы Иудифи
  choice: сказала в своём сердце
  alternative: сказала про себя
  rationale: Буквальная образность показывает внутреннюю речь, обращённую к Богу, и не сводит её к простому размышлению.
- issue: Смысл εἰς ὕψωμα Ἰερουσαλήμ
  choice: ради возвышения Иерусалима
  alternative: ради избавления Иерусалима
  rationale: Греческий текст прямо говорит о возвышении, а не называет избавление; метафорическая открытость сохранена.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены исходные образы «в сердце», «дела рук» и «возвышение Иерусалима»; архаизация ограничена молитвенным глаголом «воззри».
