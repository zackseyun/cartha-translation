  text: And when the men of her city heard her voice, they hurried down to the gate of their city and called together the elders of the city.
translation:
  language: ru
  text: Когда мужчины её города услышали её голос, они поспешили спуститься к воротам своего города и созвали городских старейшин.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο ὡς
  choice: Когда
  rationale: Нарративная формула вводит следующее событие; русское «когда» естественно передаёт временную связь без буквального и тяжеловесного «и случилось, когда».
- source_word: οἱ ἄνδρες τῆς πόλεως αὐτῆς
  choice: мужчины её города
  rationale: ἄνδρες имеет здесь явно мужское значение, а αὐτῆς относится к Иудифи; формулировка сохраняет обе особенности исходного текста.
- source_word: τὴν φωνὴν αὐτῆς
  choice: её голос
  rationale: Прямое соответствие φωνή в данном контексте, где жители узнают голос Иудифи.
- source_word: ἐσπούδασαν τοῦ καταβῆναι
  choice: поспешили спуститься
  rationale: Передаёт как срочность действия, выраженную ἐσπούδασαν, так и направленное вниз движение καταβῆναι.
- source_word: ἐπὶ τὴν πύλην τῆς πόλεως αὐτῶν
  choice: к воротам своего города
  rationale: Возвратное «своего» естественно по-русски соотносит город с подлежащим; множественное «ворота» является обычным русским обозначением городских ворот.
- source_word: συνεκάλεσαν
  choice: созвали
  rationale: Кратко и естественно передаёт значение совместного призыва или сбора людей.
- source_word: τοὺς πρεσβυτέρους τῆς πόλεως
  choice: городских старейшин
  rationale: Передаёт πρεσβύτεροι как признанных руководителей городской общины и сохраняет связь с городом без стилистически тяжёлого повтора.
theological_decisions:
- issue: Гендерная точность при передаче ἄνδρες
  choice: мужчины её города
  alternative: жители её города / люди её города
  rationale: Греческое ἄνδρες обозначает мужчин, поэтому обобщение до всех жителей неоправданно устранило бы присутствующую в источнике гендерную конкретность.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Синтаксис сглажен для естественности, при этом последовательность действий и референция местоимений сохранены. Сноски не требуются.
