  text: And all the people were greatly astonished[a], and bowing down they worshiped God and said with one accord, “Blessed are you, our God, who today have brought the enemies of your people to nothing.”
translation:
  language: ru
  text: 'И все были чрезвычайно изумлены и, склонившись, поклонились Богу и единодушно сказали: «Благословен Ты, Боже наш, сегодня обративший в ничто врагов Твоего народа».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «унизивший врагов Твоего народа» или «сделавший их ничтожными». Греческий глагол может означать как считать кого-либо ничтожным, так и низвести его до ничтожества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστη … σφόδρα
  choice: пришёл в великое изумление
  rationale: Сочетание передаёт сильное потрясение и удивление всего народа; «великое» сохраняет усилительное значение σφόδρα и звучит естественно в торжественном повествовании.
- source_word: κύψαντες
  choice: склонившись
  rationale: Причастие обозначает физическое преклонение; выбранная форма естественно соединяется с последующим поклонением Богу.
- source_word: προσεκύνησαν τῷ θεῷ
  choice: поклонились Богу
  rationale: При Боге как объекте глагол обозначает религиозное поклонение. Русское «поклонились» сохраняет и телесный, и культовый оттенок.
- source_word: ὁμοθυμαδόν
  choice: единодушно
  rationale: Наречие выражает согласие и общность устремления, а не только одновременность речи.
- source_word: Εὐλογητὸς εἶ ὁ θεὸς ἡμῶν
  choice: Благословен Ты, Бог наш
  rationale: Сохранено прямое славословие, обращённое к Богу во втором лице, а не утверждение о Нём в третьем лице.
- source_word: ἐξουδενώσας
  choice: обративший в ничто
  rationale: В контексте победы выражение передаёт действенное посрамление и устранение силы врагов, сохраняя образ «ничто» и не сводя значение лишь к физическому уничтожению.
- source_word: ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: сегодня
  rationale: Кратко и естественно передаёт усиленное греческое указание на нынешний день.
- source_word: τοὺς ἐχθροὺς τοῦ λαοῦ σου
  choice: врагов Твоего народа
  rationale: Прямо сохраняет определённую группу противников и библейское обозначение народа, принадлежащего Богу.
theological_decisions:
- issue: Форма общего славословия после победы Иудифи
  choice: 'Прямое обращение к Богу: «Благословен Ты, Бог наш»'
  alternative: 'Утверждение в третьем лице: «Благословен наш Бог»'
  rationale: Греческое εἶ является формой второго лица и указывает на непосредственное обращение к Богу.
- issue: Характер Божьего действия над врагами
  choice: «обративший в ничто»
  alternative: «пренебрегший» или «уничтоживший»
  rationale: Греческий глагол допускает оттенки признания ничтожным, уничижения и фактического низведения до ничтожества. Основной текст передаёт результат победы, а примечание сохраняет лексическую широту, не утверждая непременно физическое истребление.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Заглавные буквы в местоимениях «Ты» и «Твоего» поддерживают традиционный русский регистр прямого обращения к Богу; синтаксис разделён на два предложения для ясности, без устранения последовательности греческих действий.
