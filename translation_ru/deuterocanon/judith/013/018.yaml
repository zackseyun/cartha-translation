  text: And Uzziah said to her[a], “Blessed are you, daughter, by the Most High God above all the women on the earth,”
translation:
  language: ru
  text: 'И сказал ей Озия: «Благословенна ты, дочь, Богом Всевышним более всех женщин на земле[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Благословенна ты, дочь, пред Богом Всевышним более всех женщин на земле». Греческий дательный после слова «благословенна» допускает разные оттенки понимания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὴ
  choice: Благословенна ты
  rationale: Предикативное прилагательное в прямом обращении; формула сохраняет торжественную силу благословения и естественно звучит по-русски.
- source_word: θυγάτηρ
  choice: дочь
  rationale: Сохранено обращение без добавления отсутствующего в греческом притяжательного местоимения «моя».
- source_word: τῷ θεῷ τῷ ὑψίστῳ
  choice: Богом Всевышним
  rationale: Творительный передаёт наиболее вероятное понимание греческого дательного как указания на того, от кого исходит или в отношении кого утверждается благословение; неоднозначность отмечена в сноске.
- source_word: παρὰ πάσας τὰς γυναῖκας
  choice: более всех женщин
  rationale: παρά с винительным имеет сравнительную силу; «более всех» точно передаёт превосходство, не подменяя его значением «среди».
- source_word: τὰς ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Передан широкий смысл женщин, живущих на земле, а не только в определённой стране.
- source_word: Ὀζίας
  choice: Озия
  rationale: Традиционная русская библейская форма имени, соответствующая греческому Ὀζίας.
theological_decisions:
- issue: Значение дательного τῷ θεῷ τῷ ὑψίστῳ при Εὐλογητὴ
  choice: Юдифь названа благословенной Богом Всевышним.
  alternative: Юдифь названа благословенной пред Богом Всевышним.
  rationale: Синтаксис и последующее сравнение поддерживают утверждение о благословенном положении Юдифи, а не понимание, будто она благословляет Бога. При этом точный оттенок дательного остаётся неоднозначным и вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной библейской интонацией; порядок слов сохраняет выразительность прямой речи без архаизмов.
