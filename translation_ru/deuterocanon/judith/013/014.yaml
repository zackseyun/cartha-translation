  text: And she said to them with a loud voice, “Praise God, praise him; praise God, who has not withdrawn his mercy from the house of Israel, but has shattered our enemies by my hand in this night.”
translation:
  language: ru
  text: 'Она сказала им громким голосом: «Прославляйте Бога, прославляйте! Прославляйте Бога, который не отнял своей милости от дома Израиля, но этой ночью сокрушил наших врагов моей рукой».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αἰνεῖτε
  choice: Прославляйте
  rationale: Передаёт призыв публично воздать Богу хвалу; повтор сохранён как риторическое усиление.
- source_word: οὐκ ἀπέστησεν τὸ ἔλεος αὐτοῦ
  choice: не отнял Своей милости
  rationale: Естественно по-русски передаёт каузативную конструкцию со значением «не удалил, не отвёл» милость.
- source_word: ἔθραυσε
  choice: сокрушил
  rationale: Сохраняет сильный образ решительного разгрома врагов.
- source_word: διὰ χειρός μου
  choice: моей рукой
  rationale: Сохраняет библейский образ орудия действия, не подменяя его более пояснительным «через меня».
- source_word: ἐν τῇ νυκτὶ ταύτῃ
  choice: этой ночью
  rationale: Точно и естественно передаёт указание на ночь, в которую произошло событие.
theological_decisions:
- issue: Соотношение Божьего действия и участия Иудифи
  choice: «сокрушил наших врагов моей рукой»
  alternative: «через меня сокрушил наших врагов»
  rationale: 'Формулировка сохраняет исходное утверждение: действующим лицом является Бог, а рука Иудифи — орудием, без устранения напряжения между божественным и человеческим действием.'
- issue: Объект Божьей милости
  choice: «от дома Израиля»
  alternative: «от народа Израиля»
  rationale: Сохранён буквальный и богословски значимый библейский образ «дома Израиля».
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Повторы оригинала сохранены; инверсия «Она же» передаёт греческую связность повествования, а порядок последней части слегка адаптирован ради естественного русского звучания.
