  text: And she went up to the bed, seized the hair of his head, and said, “Strengthen me, O God of Israel, on this day.”
translation:
  language: ru
  text: 'Подойдя к постели, она схватила его за волосы и сказала: «Укрепи меня, Боже Израиля, в этот день».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσασα
  choice: Подойдя
  rationale: Причастие от ἐγγίζω обозначает приближение; «подойдя» естественно передаёт движение к постели без лишнего уточнения.
- source_word: τῆς κλίνης
  choice: к постели
  rationale: κλίνη в данном повествовательном контексте естественно означает постель; родительный после ἐγγίζω передан обычной русской конструкцией с «к».
- source_word: ἐδράξατο
  choice: схватила
  rationale: Средняя форма δράσσομαι выражает решительное, крепкое хватание; «схватила» сохраняет силу действия.
- source_word: τῆς κόμης τῆς κεφαλῆς αὐτοῦ
  choice: его за волосы
  rationale: Русская конструкция «схватить за волосы» точно и естественно передаёт смысл греческого выражения; буквальное «за волосы его головы» было бы ненужной и неестественной избыточностью.
- source_word: Κραταίωσόν με
  choice: Укрепи меня
  rationale: Аористный императив означает просьбу сделать говорящую сильной; «укрепи меня» кратко, торжественно и уместно для молитвы.
- source_word: ὁ θεὸς Ἰσραήλ
  choice: Боже Израиля
  rationale: Именительный в функции обращения передан нормативной русской звательной формой «Боже», сохраняя прямое и торжественное обращение.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: в этот день
  rationale: Передаёт временную конкретность греческой фразы и сохраняет её торжественный библейский оттенок, не заменяя выражение более разговорным «сегодня».
theological_decisions:
- issue: Молитвенное обращение Иудифи к Богу в момент насильственного избавления
  choice: 'Передать прямо и без поясняющего смягчения: «Укрепи меня, Боже Израиля, в этот день».'
  alternative: «Дай мне силу, Боже Израиля, сегодня».
  rationale: Греческий текст содержит краткую просьбу о силе и не даёт нравственного или богословского комментария к предстоящему действию. Перевод сохраняет эту напряжённость, ничего не добавляя и не смягчая.
translation_notes:
  register: Современный литературный русский язык с достоинством и лёгкой молитвенной торжественностью. Синтаксис естественный, без архаизмов; сохранены краткость, напряжение и последовательность действий оригинала.
