  text: And Judith told her female servant to stand outside her sleeping chamber and watch for her going out[a], as on previous days, for she said that she would go out for her prayer[b]; and she spoke to Bagoas according to these words.
translation:
  language: ru
  text: Иудифь велела своей рабыне[a] стоять снаружи её спальни[b] и стеречь её выход, как обычно[c], потому что сказала, что выйдет для своей молитвы. И с Вагоем она говорила теми же словами.
  philosophy: optimal-equivalence
  footnotes:
