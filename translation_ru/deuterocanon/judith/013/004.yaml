  - marker: b
    text: 'Или: «спального покоя».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «как изо дня в день»; то есть как было у неё обычно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δούλῃ
  choice: служанке
  rationale: Слово обозначает женщину-рабыню или служанку. В повествовательном контексте «служанка» звучит естественно по-русски, а указание на возможный несвободный статус сохранено в примечании.
- source_word: στῆναι
  choice: стоять
  rationale: Сохранено прямое значение инфинитива ἵστημι; по контексту служанке велено оставаться на посту у спальни.
- source_word: κοιτῶνος
  choice: спальни
  rationale: κοίτων — помещение для сна, спальня или опочивальня. «Спальня» — ясное современное соответствие без архаизации.
- source_word: ἐπιτηρεῖν τὴν ἔξοδον αὐτῆς
  choice: следить за тем, когда она выйдет
  rationale: Передаёт внимательное наблюдение и ожидаемый выход Иудифи естественной русской конструкцией; буквальное «следить за её выходом» могло бы звучать двусмысленно.
- source_word: καθάπερ καθʼ ἡμέρας
  choice: как и в прежние дни
  rationale: В контексте речь об уже установившемся ежедневном порядке. Перевод раскрывает этот смысл, а более буквальная формулировка отмечена в сноске.
- source_word: ἐξελεύσεσθαι ... ἐπὶ τὴν προσευχὴν αὐτῆς
  choice: выйдет помолиться
  rationale: Будущий инфинитив после ἔφη передан формой будущего времени в косвенной речи; цель выхода выражена естественным русским инфинитивом.
- source_word: καὶ τῷ Βαγώᾳ ἐλάλησεν κατὰ τὰ ῥήματα ταῦτα
  choice: То же самое она сказала и Вагою
  rationale: Идиоматично передаёт смысл «сказала Вагою согласно этим словам», то есть сообщила ему то же распоряжение или объяснение.
