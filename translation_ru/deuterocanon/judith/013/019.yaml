lexical_decisions:
- source_word: εὐλογημένος
  choice: благословен
  rationale: Сохраняет форму и возвышенную силу благословения в славословной формуле.
- source_word: Κύριος ὁ θεὸς
  choice: Господь Бог
  rationale: Естественно передаёт сочетание титула Κύριος и обозначения ὁ θεός.
- source_word: ἔκτισεν
  choice: сотворивший
  rationale: В сочетании с небесами и землёй глагол означает Божье творение; причастие естественно связывает определительное предложение с предшествующим именованием Бога.
- source_word: τοὺς οὐρανοὺς καὶ τὴν γῆν
  choice: небеса и землю
  rationale: Сохраняет множественное число οὐρανούς и привычную русскую формулу.
- source_word: κατεύθυνέν
  choice: направивший
  rationale: Передаёт Божье руководство действием Иудифи, не усиливая его до прямого принуждения.
- source_word: εἰς τραῦμα κεφαλῆς
  choice: поразить в голову
  rationale: Идиоматично передаёт целевую конструкцию, буквально связанную с нанесением раны голове, и не уточняет способ поражения сверх греческого текста.
- source_word: ἄρχοντος
  choice: правителя
  rationale: Широко и ясно передаёт лицо, обладающее властью или предводительствующее, без внесения позднейших специальных значений.
- source_word: ἐχθρῶν ἡμῶν
  choice: наших врагов
  rationale: Естественная передача греческого родительного оборота.
theological_decisions:
- issue: Божье участие в поступке Иудифи
  choice: направивший тебя поразить в голову правителя наших врагов
  alternative: направивший тебя к нанесению раны голове правителя наших врагов
  rationale: Основной текст сохраняет явное Божье руководство и естественно звучит по-русски, не превращая руководство в принуждение; примечание удерживает буквальную и несколько необычную образность греческой конструкции.
