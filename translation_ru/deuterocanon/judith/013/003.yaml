translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Порядок слов «Иудифь же» передаёт греческое δέ и смену фокуса; «шатёр» сохраняет лагерный контекст. Неясные греческие образы не устранены молча, а отмечены в сносках.
