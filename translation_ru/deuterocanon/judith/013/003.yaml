  text: But Judith was left alone in the tent[a], and Holofernes had collapsed on his bed[b], for the wine had overwhelmed him.
translation:
  language: ru
  text: Иудифь же осталась в шатре одна, а Олоферн лежал, повалившись на свою постель[a], потому что вино одолело его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «упав вперёд на свою постель». Греческое причастие обозначает падение вперёд или вниз и состояние после него; контекст указывает на падение от опьянения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «потому что вино было разлито вокруг него» или «на нём». Здесь это образное выражение означает, что вино овладело им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπελείφθη
  choice: осталась
  rationale: Аорист страдательного залога здесь описывает Иудифь как единственную оставшуюся после ухода остальных. В русском «осталась» естественно передаёт итоговую ситуацию, не вводя не названного в тексте деятеля.
- source_word: μόνη
  choice: одна
  rationale: Сохраняет подчёркнутое указание на то, что Иудифь находилась в шатре без других людей.
- source_word: σκηνῇ
  choice: в шатре
  rationale: В обстановке военного лагеря σκηνή обозначает шатёр; это современное и стилистически уместное русское соответствие.
- source_word: προπεπτωκώς
  choice: лежал, повалившись
  rationale: Перфектное причастие описывает падение и сохраняющееся после него состояние. Формулировка передаёт и предшествующее падение, и то, что Олоферн теперь лежал на постели, не сводя значение только к направлению падения.
- source_word: κλίνην
  choice: постель
  rationale: κλίνη может обозначать ложе, кровать или постель. «Постель» ясно и естественно звучит в данной сцене.
- source_word: περικεχυμένος
  choice: одолело
  rationale: Буквальный образ чего-то разлитого вокруг или поверх человека по-русски здесь был бы неясен. В сочетании с οἶνος выражение описывает действие выпитого вина; «одолело» сохраняет вино как грамматический субъект и передаёт опьянение без излишнего толкования.
- source_word: οἶνος
  choice: вино
  rationale: Сохранено как субъект заключительной причинной части, как и в греческом тексте.
