  text: And when she came near to the bed, she seized the hair of his head and said, “Strengthen me, O God of Israel, on this day.”
translation:
  language: ru
  text: 'Подойдя к постели, она схватила его за волосы и сказала: «Укрепи меня, Боже Израиля, в этот день».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσασα
  choice: Подойдя
  rationale: Аористное причастие передаёт действие, предшествующее основному или сопровождающее его; деепричастие естественно выражает последовательность действий по-русски.
- source_word: κλίνη
  choice: постели
  rationale: В данном повествовательном контексте κλίνη обозначает постель или ложе; «постель» ясно и естественно в современном русском.
- source_word: ἐδράξατο
  choice: схватила
  rationale: Глагол передаёт решительное, силовое хватательное действие; «схватила» сохраняет его резкость.
- source_word: τῆς κόμης τῆς κεφαλῆς αὐτοῦ
  choice: его за волосы
  rationale: Естественная русская конструкция с глаголом «схватить»; слово «волосы» уже обозначает волосы на голове, поэтому буквальное «за волосы его головы» было бы тяжеловесно.
- source_word: Κραταίωσόν με
  choice: Укрепи меня
  rationale: Императив κραταιόω выражает просьбу даровать силу; «укрепи меня» непосредственно и уместно для молитвенной речи.
- source_word: ὁ θεὸς Ἰσραήλ
  choice: Боже Израиля
  rationale: Форма «Боже» естественно передаёт прямое молитвенное обращение, а родительный «Израиля» сохраняет греческий титул.
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: в этот день
  rationale: Идиоматическое русское обозначение времени, сохраняющее непосредственность просьбы.
theological_decisions:
- issue: Молитвенное обращение к Богу Израиля
  choice: Боже Израиля
  alternative: Бог Израиля
  rationale: Хотя греческая форма θεός внешне совпадает с именительным падежом, синтаксис прямой речи придаёт ей звательную функцию. Русское «Боже» ясно передаёт обращение, не добавляя богословского содержания.
translation_notes:
  register: Современный литературный русский язык с краткой, напряжённой повествовательной фразой и торжественным, но понятным молитвенным обращением. Синтаксис слегка сглажен ради естественности без утраты содержания оригинала.
