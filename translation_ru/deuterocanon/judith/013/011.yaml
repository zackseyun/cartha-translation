revisions:
- from: 'И сказала Юдифь издали стоявшим на страже у ворот[a]: «Откройте, откройте же ворота! С нами Бог, наш Бог, чтобы и впредь являть силу в Израиле и могущество против наших врагов, как Он сделал и сегодня».'
  to: 'И Юдифь издали сказала тем, кто охранял ворота: «Откройте, откройте же ворота! С нами Бог, наш Бог[a], чтобы и впредь являть силу в Израиле и могущество против наших врагов, как и сегодня совершил».


    [a] Буквально по-гречески: «Бог, Бог наш» — выразительное повторение со значением «Бог, наш Бог».'
  rationale: Убрано невыраженное в оригинале «стоявшим», якорь сноски перенесён к повтору божественного имени, а заключительный оборот сделан естественнее по-русски без изменения сравнительного и завершённого значения греческого текста. Целевой оттенок инфинитива ποιῆσαι сохранён в конструкции «чтобы ... являть».
