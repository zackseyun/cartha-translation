base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/011.yaml
  text: And Judith said from a distance to those guarding the gates[a], “Open up, open up the gate, for God, our God, is with us, still to show strength in Israel and power against our enemies, just as he has done today.”
translation:
  language: ru
  text: 'И Юдифь издали сказала тем, кто охранял ворота: «Откройте, откройте же ворота! С нами Бог, наш Бог[a], чтобы и впредь являть силу в Израиле и могущество против наших врагов, как и сегодня совершил».


    [a] Буквально по-гречески: «Бог, Бог наш» — выразительное повторение со значением «Бог, наш Бог».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «Бог, Бог наш» — выразительное повторение со значением «Бог, наш Бог».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακρόθεν
  choice: издали
  rationale: Передаёт пространственное значение наречия кратко, естественно и без архаизации.
- source_word: τοῖς φυλάσσουσιν ἐπὶ τῶν πυλῶν
  choice: стоявшим на страже у ворот
  rationale: Причастная конструкция обозначает людей, охраняющих ворота; русский оборот естественно передаёт действие и место.
- source_word: Ἀνοίξατε, ἀνοίξατε δὴ τὴν πύλην
  choice: Откройте, откройте же ворота
  rationale: Повтор сохраняет настойчивость, а «же» передаёт усилительное δὴ. Хотя прямое дополнение в греческом стоит в единственном числе, русское «ворота» нормативно имеет форму множественного числа.
- source_word: μεθʼ ἡμῶν
  choice: С нами
  rationale: Кратко и естественно передаёт именную конструкцию с подразумеваемой связкой.
- source_word: ὁ θεὸς ὁ θεὸς ἡμῶν
  choice: Бог, наш Бог
  rationale: Сохраняет эмфатическое повторение θεός и исповедальный акцент исходного текста.
- source_word: ποιῆσαι ἔτι ἰσχὺν
  choice: чтобы и впредь являть силу
  rationale: Инфинитив передан как цель, что соответствует одному из естественных синтаксических пониманий; ἔτι выражает продолжение, а сочетание «являть силу» естественно передаёт греческую идиому.
- source_word: ἰσχὺν
  choice: силу
  rationale: Основное значение — сила, мощь; выбор позволяет отличить слово от следующего κράτος.
- source_word: κράτος
  choice: могущество
  rationale: Передаёт проявленную, одерживающую верх мощь и сохраняет смысловое различие с ἰσχύς.
- source_word: κατὰ τῶν ἐχθρῶν ἡμῶν
  choice: против наших врагов
  rationale: Κατά с родительным падежом здесь имеет направленное противодействующее значение.
- source_word: καθὰ καὶ σήμερον ἐποίησεν
  choice: как Он сделал и сегодня
  rationale: Сохраняет сравнительное значение καθά, усилительное καί и завершённость аориста в контексте только что совершённого избавления.
theological_decisions:
- issue: Эмфатическое выражение ὁ θεὸς ὁ θεὸς ἡμῶν
  choice: Бог, наш Бог
  alternative: наш Бог
  rationale: Повтор слова «Бог» сохраняет риторическое и исповедальное ударение греческого текста, не превращая выражение в отдельный титул.
- issue: Синтаксическая связь ποιῆσαι с утверждением «С нами Бог»
  choice: чтобы и впредь являть силу
  alternative: и Он ещё явит силу
  rationale: Целевое прочтение близко передаёт греческий инфинитив и не делает подразумеваемую модальность более определённой, чем в источнике.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной речью. Повтор повеления и повтор слова «Бог» сохранены; местоимение «Он» написано с прописной буквы по принятой русской библейской издательской традиции.
