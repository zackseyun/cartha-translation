base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/001.yaml
  text: When evening came[a], his servants hurried to depart; and Bagoas shut the tent from outside and excluded those in attendance from the presence of his lord, and they went away to their beds.
translation:
  language: ru
  text: Когда настал вечер, его рабы[a] поспешили удалиться. Багой закрыл шатёр снаружи и не допустил к своему господину тех, кто находился при его господине; и они разошлись по своим постелям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «слуги». Греческое слово δοῦλοι буквально означает «рабы»; здесь так названы зависимые члены его домашней свиты, служившие ему.
    reason: Сноска сохраняет социально точное основное значение и одновременно указывает на служебную функцию этих людей в данном контексте.
lexical_decisions:
- source_word: ὀψία
  choice: вечер
  rationale: В обороте ὀψία ἐγένετο обозначает наступление вечера; перевод не усиливает значение до «ночи».
- source_word: ἐσπούδασαν
  choice: поспешили
  rationale: Передаёт заложенные в глаголе поспешность и усердие естественным современным русским словом.
- source_word: οἱ δοῦλοι αὐτοῦ
  choice: его рабы
  rationale: Сохраняет прямое социальное значение δοῦλοι и не смягчает его до общего «слуги», хотя в данном контексте речь идёт о членах домашней свиты.
- source_word: ἀναλύειν
  choice: удалиться
  rationale: В контексте вечернего прекращения службы глагол означает разойтись или отойти от места присутствия; «удалиться» естественно передаёт это движение без добавления цели.
- source_word: συνέκλεισεν τὴν σκηνὴν ἔξωθεν
  choice: закрыл шатёр снаружи
  rationale: Точно передаёт внешнее закрытие шатра, не уточняя отсутствующий в тексте способ запирания.
- source_word: ἀπέκλεισεν
  choice: не допустил
  rationale: Передаёт активное воспрепятствование доступу и естественно сочетается по-русски с последующим обозначением присутствия господина.
- source_word: τοὺς παρεστῶτας
  choice: тех, кто находился при нём
  rationale: 'Сохраняет причастную неопределённость: это присутствовавшие при господине люди, вероятно его обслуживающая свита, но текст не даёт отдельного существительного «слуги».'
- source_word: ἐκ προσώπου τοῦ κυρίου αὐτοῦ
  choice: к своему господину
  rationale: В сочетании с отрицательным «не допустил» естественно передаёт удаление или недопущение в присутствие господина; κύριος здесь обозначает социального господина, а не Бога.
- source_word: ἀπῴχοντο εἰς τὰς κοίτας αὐτῶν
  choice: они разошлись по своим постелям
  rationale: Сохраняет множественное число, движение прочь и значение мест для сна, оставаясь естественным для русского повествования.
- source_word: Βαγώας
  choice: Багой
  rationale: Русская транслитерация греческой формы личного имени.
theological_decisions:
- issue: Передача δοῦλοι в повествовании о домашней и военной свите
  choice: рабы
  alternative: слуги
  rationale: «Рабы» сохраняет обозначенный греческим словом зависимый социальный статус. Контекст допускает служебную функцию этих людей, что поясняется в сноске, но не оправдывает устранения социальной реалии из основного текста.
- issue: Значение κύριος применительно к Олоферну
  choice: господин
  alternative: Господь
  rationale: Речь идёт об отношении Багоя к его человеческому хозяину и начальнику; божественный титул здесь контекстуально исключён.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования, без архаических оборотов. Синтаксис слегка формальный, но доступный; сохранены последовательность действий и неоднозначность обозначения присутствовавших при господине людей.
