    reason: lexical_alternative
lexical_decisions:
- source_word: ζῇ Κύριος
  choice: жив Господь
  rationale: Сохраняет библейскую формулу торжественной клятвы и естественно звучит по-русски.
- source_word: διεφύλαξέν με
  choice: сохранивший меня
  rationale: Передаёт усиленное значение защиты и сохранения во время опасного пути.
- source_word: ἐν τῇ ὁδῷ μου ᾗ ἐπορεύθην
  choice: на том пути, которым я шла
  rationale: Сохраняет конкретный образ пути и относительную конструкцию; женская форма соответствует речи Иудифи.
- source_word: ἠπάτησεν αὐτὸν τὸ πρόσωπόν μου
  choice: моё лицо обмануло его
  rationale: Буквально сохраняет необычный субъект «лицо», не сводя выражение только к красоте или внешности; контекст пояснён в сноске.
- source_word: εἰς ἀπώλειαν αὐτοῦ
  choice: ему же на погибель
  rationale: 'Естественно передаёт направленность и результат εἰς: обман обернулся погибелью самого Олоферна.'
- source_word: οὐκ ἐποίησεν ἁμάρτημα μετʼ ἐμοῦ
  choice: он не совершил со мной греха
  rationale: Сохраняет явное существительное «грех» и сдержанность греческой формулировки, не конкретизируя сексуальное действие сверх текста.
- source_word: εἰς μίασμα καὶ αἰσχύνην
  choice: который привёл бы к осквернению и позору
  rationale: Передаёт результативную силу εἰς естественной русской конструкцией; условная форма уместна, поскольку названный грех не был совершён.
theological_decisions:
- issue: Передача κύριος в формуле клятвы
  choice: Господь
  alternative: Владыка
  rationale: В данном контексте κύριος является божественным титулом; «Господь» соответствует русской библейской норме.
- issue: Следует ли прямо назвать сексуальный характер греха
  choice: сохранить общее выражение «не совершил со мной греха»
  alternative: «не осквернил меня» или «не вступил со мной в греховную связь»
  rationale: Греческий текст выражается шире, хотя контекст указывает на сексуальное насилие или связь; перевод сохраняет исходную сдержанность и богословское напряжение.
- issue: Связь μίασμα καὶ αἰσχύνην с несовершённым грехом
  choice: 'передать как возможный результат: «который привёл бы»'
  alternative: буквальное, но неестественное «для осквернения и позора»
  rationale: Так сохраняется результативный смысл εἰς без утверждения, будто осквернение и позор действительно наступили.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским оттенком. Формула «жив Господь» сохранена как устойчивая клятва; в остальном синтаксис сделан понятным для современного читателя без снятия образности и смысловой сдержанности оригинала.
