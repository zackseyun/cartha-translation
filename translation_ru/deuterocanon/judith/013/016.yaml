  text: And as the Lord lives, who guarded me on the way by which I went, my face deceived him to his destruction, and he did not commit sin with me, resulting in defilement and shame.
translation:
  language: ru
  text: 'И жив Господь, сохранивший меня на пути, по которому я шла: моё лицо[a] обмануло его на погибель ему, и он не совершил со мной греха, который привёл бы к осквернению и позору.'
