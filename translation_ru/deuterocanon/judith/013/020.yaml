revisions:
- from: 'И да обратит Бог это для тебя в вечную славу[a], чтобы посетить тебя благами, за то, что ты не пощадила своей жизни из-за унижения нашего народа, но выступила против нашего падения, идя прямым путём пред нашим Богом. И весь народ сказал: «Да будет, да будет».[b]'
  to: 'И да обратит Бог всё это тебе во вечную славу[a], чтобы посетить тебя с благами, за то, что ты не пощадила своей жизни из-за унижения нашего народа, но выступила против нашего падения, идя прямым путём пред нашим Богом. И весь народ сказал: «Да будет так, да будет так».[b]'
  rationale: Правка ограничена естественностью русского синтаксиса и ясностью. «Всё это» отражает αὐτά, «с благами» передаёт ἐν ἀγαθοῖς без неестественного инструментального употребления, а «Да будет так» сохраняет модальность Γένοιτο и его повтор. Неоднозначное «выступила против нашего падения» оставлено без догматического или чрезмерно конкретного истолкования.
