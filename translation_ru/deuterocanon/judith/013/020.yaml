base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/013/020.yaml
  text: And may God make these things for you into everlasting exaltation[a], to visit you with good things, because you did not spare your life on account of the humiliation of our people, but went out against our fallen condition, having walked straight before our God. And all the people said, “Amen, amen.”
translation:
  language: ru
  text: 'И да обратит Бог всё это тебе во вечную славу[a], чтобы посетить тебя с благами, за то, что ты не пощадила своей жизни из-за унижения нашего народа, но выступила против нашего падения, идя прямым путём пред нашим Богом. И весь народ сказал: «Да будет так, да будет так».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в вечное возвышение» или «на вечную высоту».'
    reason: Сохраняет пространственный образ греческого ὕψος, который в контексте обозначает непреходящую честь и славу.
  - marker: b
    text: 'Буквально: «Да будет, да будет». Или: «Аминь, аминь». Греческое Γένοιτο, γένοιτο — удвоенное пожелание согласия.'
    reason: Показывает буквальное значение ответа, сохраняя возможный литургический эквивалент.
lexical_decisions:
- source_word: ποιήσαι σοι αὐτὰ ὁ θεὸς εἰς ὕψος αἰώνιον
  choice: да обратит Бог это для тебя в вечную славу
  rationale: Форма передаёт пожелание или молитву. Буквальный образ «вечной высоты/возвышения» в данном контексте означает непреходящую честь; «обратит… в вечную славу» естественно звучит по-русски, не превращая пожелание в утверждение.
- source_word: τοῦ ἐπισκέψασθαί σε ἐν ἀγαθοῖς
  choice: чтобы посетить тебя благами
  rationale: Сохранены целевая конструкция инфинитива, образ Божьего посещения и широкое значение ἀγαθά — благие дары, добро, благословения.
- source_word: οὐκ ἐφείσω τῆς ψυχῆς σου
  choice: ты не пощадила своей жизни
  rationale: В контексте смертельного риска ψυχή обозначает жизнь; такой перевод точен и естественен для современного русского языка.
- source_word: διὰ τὴν ταπείνωσιν τοῦ γένους ἡμῶν
  choice: из-за унижения нашего народа
  rationale: ταπείνωσις допускает оттенки унижения, бедствия и униженного состояния; «унижение» сохраняет публичное бесчестье народа, а γένος здесь передано собирательным «народ».
- source_word: ἐπεξῆλθες πτώματι ἡμῶν
  choice: выступила против нашего падения
  rationale: ἐπεξέρχομαι с дательным может означать выступление против чего-либо, тогда как πτῶμα — падение, крах или гибель. Формулировка сохраняет необычный и неоднозначный образ греческого текста, не уточняя его как конкретного врага или лишь угрозу.
- source_word: ἐπʼ εὐθεῖαν πορευθεῖσα
  choice: идя прямым путём
  rationale: Сохранён конкретный образ прямого пути, одновременно несущий нравственный оттенок правоты поступка.
- source_word: Γένοιτο, γένοιτο
  choice: Да будет, да будет
  rationale: Буквальное пожелание γένοιτο передаёт согласие народа с благословением. Повтор сохранён; литургическое «Аминь» указано как возможный функциональный эквивалент в сноске.
theological_decisions:
- issue: Характер обращения к Богу в ποιήσαι
  choice: пожелание «да обратит Бог»
  alternative: утверждение или обещание «Бог обратит»
  rationale: Греческая форма в контексте благословения выражает молитвенное пожелание, а не безусловное предсказание.
- issue: Ответ народа Γένοιτο, γένοιτο
  choice: «Да будет, да будет»
  alternative: «Аминь, аминь»
  rationale: Основной текст сохраняет собственное значение греческого пожелания и его удвоение; сноска сообщает традиционный литургический эквивалент, не подменяя им исходную формулировку.
- issue: Смысл ἐπεξῆλθες πτώματι ἡμῶν
  choice: «выступила против нашего падения»
  alternative: «выступила из-за нашей гибели» / «пришла на помощь в нашем падении»
  rationale: Сочетание допускает разные способы понимания отношения действия Иудифи к бедствию народа. Выбранный вариант сохраняет направленность против падения, не вводя отсутствующего в тексте предмета нападения.
translation_notes:
  register: Современный литературный русский с достоинством библейского благословения. Сохранены молитвенное «да», образ Божьего посещения, метафоры падения и прямого пути; синтаксис слегка упорядочен ради ясности без устранения трудного места ἐπεξῆλθες πτώματι ἡμῶν.
