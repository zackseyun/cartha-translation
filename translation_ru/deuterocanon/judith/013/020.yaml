  terminology: «Вечная слава» уместно передаёт смысл εἰς ὕψος αἰώνιον, а сноска сохраняет образ высоты. «Унижение нашего народа», «не пощадила своей жизни» и «выступила против нашего падения» соответствуют контексту и не снимают неоднозначность трудной дательной конструкции.
