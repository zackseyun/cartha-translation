  yaml_path: translation/deuterocanon/judith/013/015.yaml
  text: And coming forward, she showed them the head from the bag and said to them, “Look, the head of Holofernes, the commander-in-chief of the army of Asshur; and look, the canopy under which he was lying in his drunkenness. And the Lord struck him down by the hand of a woman.”
translation:
  language: ru
  text: 'Выйдя вперёд, она вынула из сумки голову и показала её им, сказав: «Вот голова Олоферна, главнокомандующего войском Ассура; и вот полог, под которым он лежал, когда был пьян. Господь поразил его рукой женщины».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προελθοῦσα
  choice: Выйдя вперёд
  rationale: Передаёт движение Юдифи вперёд к собравшимся естественным современным русским выражением.
- source_word: πήρα
  choice: мешок
  rationale: Обозначает дорожную суму или мешок; «мешок» здесь ясен и соответствует предмету, в котором находилась голова.
- source_word: Ἰδοὺ
  choice: вот
  rationale: Сохраняет указательно-предъявительную силу повторённого греческого возгласа.
- source_word: ἀρχιστράτηγος δυνάμεως Ἀσσούρ
  choice: главнокомандующий войском Ассура
  rationale: Точно передаёт высокий военный чин и сохраняет форму «Ассур» как обозначение ассирийской державы в тексте.
- source_word: κωνώπιον
  choice: полог
  rationale: Речь о навесе или пологе над ложем; «полог» естественнее в данном повествовательном контексте.
- source_word: ἐν ταῖς μέθαις αὐτοῦ
  choice: в пьяном угаре
  rationale: Передаёт множественную форму со значением состояния опьянения, не сводя её лишь к факту употребления вина.
- source_word: ἐπάταξεν
  choice: поразил
  rationale: Сохраняет библейскую формулу решительного действия Господа, допускающую смертельный исход в контексте.
- source_word: ἐν χειρὶ θηλείας
  choice: рукой женщины
  rationale: Буквально и естественно передаёт орудийный смысл оборота; сохраняет акцент на женском поле.
theological_decisions:
- issue: Соотношение Божьего действия и действия Юдифи
  choice: «Господь поразил его рукой женщины»
  alternative: «женщина поразила его с помощью Господа»
  rationale: 'Сохранена исходная богословская формулировка: Господь назван действующим субъектом, а рука женщины — средством; причинность не перестроена.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «вот... и вот...» сохранён ради риторической структуры оригинала; синтаксис слегка упорядочен для ясности.
