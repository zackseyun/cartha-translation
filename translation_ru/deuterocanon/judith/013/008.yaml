lexical_decisions:
- source_word: προσελθοῦσα
  choice: подойдя
  rationale: Аористное причастие передаёт действие, предшествующее основному; русское деепричастие естественно сохраняет последовательность без излишнего уточнения.
- source_word: κανόνι τῆς κλίνης
  choice: к стойке кровати
  rationale: κανών здесь обозначает конструктивную часть кровати, расположенную у изголовья и служившую местом для оружия. «Стойка кровати» конкретна и не сужает значение до современного столбика определённой формы.
- source_word: πρὸς κεφαλῆς Ὀλοφέρνου
  choice: у изголовья Олоферна
  rationale: Фраза пространственно соотносит стойку с местом, где находилась голова Олоферна; «у изголовья» звучит естественно и ясно по-русски.
- source_word: καθεῖλε
  choice: сняла
  rationale: Глагол указывает на снятие предмета с места, где он висел или был закреплён; дополнение «с неё» передаёт ἀπ’ αὐτοῦ.
- source_word: ἀκινάκην
  choice: короткий меч
  rationale: ἀκινάκης — короткий меч восточного типа, иногда описываемый как кинжал. «Короткий меч» сохраняет род оружия и его отличительную особенность без малопонятного заимствования.
