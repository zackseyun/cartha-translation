lexical_decisions:
- source_word: πᾶσα παρεμβολὴ Ἀσσούρ
  choice: всё ассирийское войско
  rationale: παρεμβολή в военном контексте может обозначать лагерь или расположившееся войско; здесь последующее перечисление воинских подразделений естественно уточняет именно войско.
- source_word: ἔμεινεν κύκλῳ αὐτῶν
  choice: оставалось вокруг них
  rationale: Передаёт длительность осады и пространственное значение κύκλῳ без добавления отсутствующего в тексте глагола «осаждать».
- source_word: οἱ πεζοὶ
  choice: пешие воины
  rationale: Современное и ясное обозначение пехоты с сохранением формы перечисления.
- source_word: ἅρματα
  choice: колесницы
  rationale: Обычное военное значение слова в данном перечне.
- source_word: οἱ ἱππεῖς αὐτῶν
  choice: всадники
  rationale: Передаёт военное значение ἱππεῖς; притяжательное αὐτῶν по-русски избыточно после «ассирийское войско».
- source_word: ἐξέλιπεν ... πάντα τὰ ἀγγεῖα αὐτῶν τῶν ὑδάτων
  choice: иссякла вся вода в сосудах
  rationale: 'Греческая конструкция шероховата и буквально связывает ἐξέλιπεν с сосудами воды; русский перевод естественно выражает подразумеваемый смысл: запасы воды в сосудах закончились.'
- source_word: Βαιτυλουά
  choice: Ветилуи
  rationale: Традиционная русская форма топонима Ветилуя в родительном падеже.
