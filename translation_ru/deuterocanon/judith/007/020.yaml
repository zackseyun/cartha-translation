  source_fidelity: 'Первая часть в целом точно передаёт καὶ ἔμεινεν κύκλῳ αὐτῶν ... ἡμέρας τριάκοντα τέσσαρες: речь о длительном пребывании ассирийского войска вокруг жителей города, без добавления глагола «осаждать». Однако πάντα τὰ ἀγγεῖα ... τῶν ὑδάτων — это «все сосуды/ёмкости для воды», а не сама «вся вода»; следует сохранить образ опустевших сосудов.'
