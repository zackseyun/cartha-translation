  yaml_path: translation/deuterocanon/judith/007/029.yaml
  text: And there was great weeping in the midst of the whole assembly[a], all together, and they cried out to the Lord God with a loud voice.
translation:
  language: ru
  text: И поднялся великий плач среди всего собрания[a]; все как один громко воззвали к Господу Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «общины».'
    reason: Лексическая альтернатива для ἐκκλησία, обозначающего собравшееся сообщество.
lexical_decisions:
- source_word: ἐγένετο
  choice: поднялся
  rationale: Естественно передаёт повествовательную формулу возникновения события и хорошо сочетается со словом «плач».
- source_word: κλαυθμὸς μέγας
  choice: великий плач
  rationale: «Плач» прямо передаёт κλαυθμός, а «великий» сохраняет μέγας и поддерживает достоинство библейского повествования.
- source_word: ἐν μέσῳ τῆς ἐκκλησίας πάντων
  choice: среди всего собрания
  rationale: Передаёт нахождение внутри собравшегося сообщества; πάντων естественно выражено определением «всего».
- source_word: ὁμοθυμαδόν
  choice: все как один
  rationale: Современное и выразительное соответствие совместному, единодушному действию без предположения формального единогласия.
- source_word: ἐβόησαν πρὸς
  choice: воззвали к
  rationale: Передаёт громкий, настойчивый призыв, обращённый к Богу, и сохраняет молитвенно-повествовательный регистр.
- source_word: Κύριον τὸν θεὸν
  choice: Господу Богу
  rationale: Естественно передаёт сочетание титула κύριος с обозначением Бога, не превращая его в более позднюю конфессиональную формулу.
- source_word: φωνῇ μεγάλῃ
  choice: громко
  rationale: Идиоматично передаёт инструментальный дательный и силу голоса; буквальное «великим голосом» по-русски неестественно.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: В обращении к Богу традиционное и современно понятное «Господь» точно передаёт титул, не сужая его до значения человеческого господина.
- issue: Передача ἐκκλησία
  choice: собрание
  alternative: община
  rationale: В повествовательном контексте книги Иудифи речь идёт о собравшемся народе, а не о христианской Церкви; «собрание» избегает анахронизма.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Конструкция «все как один» ясно и естественно сохраняет единство действия; точка с запятой разграничивает общий плач и последующее совместное воззвание.
