base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/028.yaml
  text: We call heaven and earth and our God and Lord of our fathers to witness against you[a], who avenges us according to our sins and according to the sins of our fathers[b], that he may not act according to these words today.
translation:
  language: ru
  text: Призываем против вас в свидетели небо и землю, нашего Бога и Господа наших отцов[a], Который воздаёт нам по нашим грехам и по прегрешениям наших отцов[b], чтобы Он сегодня не поступил согласно этим словам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «свидетельствуем вам». По смыслу здесь торжественно призываются небо, земля и Бог как свидетели против предлагаемого слушателями решения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Который карает нас за наши грехи и за прегрешения наших отцов». Греческий глагол обозначает воздаяние или взыскание по справедливости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρόμεθα ὑμῖν
  choice: призываем против вас в свидетели
  rationale: Форма μαρτυρόμεθα с дательным ὑμῖν и перечислением свидетелей имеет здесь характер торжественного призыва свидетелей; «против вас» передаёт направленность свидетельства в данном контексте, тогда как буквально дательный допускает «вам».
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: небо и землю
  rationale: Сохранена традиционная и естественная для русского языка формула, обозначающая всеобъемлющее космическое свидетельство.
- source_word: τὸν θεὸν ἡμῶν καὶ κύριον τῶν πατέρων ἡμῶν
  choice: нашего Бога и Господа наших отцов
  rationale: Сохранены оба согласованных наименования Бога; κύριος как божественный титул передан словом «Господь».
- source_word: ἐκδικεῖ ἡμᾶς
  choice: воздаёт нам
  rationale: ἐκδικέω здесь выражает карательное воздаяние за грехи. «Воздаёт нам» сохраняет идею справедливого возмездия и не создаёт ошибочного впечатления, будто Бог мстит кому-то за причинённое нам зло.
- source_word: κατὰ τὰς ἁμαρτίας ἡμῶν καὶ κατὰ τὰ ἁμαρτήματα τῶν πατέρων ἡμῶν
  choice: по нашим грехам и по прегрешениям наших отцов
  rationale: Предлог κατά передаёт соответствие или меру воздаяния. Различение «грехов» и «прегрешений» отражает смену близких греческих существительных ἁμαρτίαι и ἁμαρτήματα без искусственного усиления различия между ними.
- source_word: ἵνα μὴ ποιήσῃ
  choice: чтобы Он ... не поступил
  rationale: Сохранена отрицательная целевая конструкция греческого текста; «поступил» естественно сочетается с последующим «согласно этим словам».
- source_word: κατὰ τὰ ῥήματα ταῦτα ἐν τῇ ἡμέρᾳ τῇ σήμερον
  choice: сегодня ... согласно этим словам
  rationale: ῥήματα относится к только что произнесённым словам, а эмфатическая временная формула естественно передаётся наречием «сегодня».
theological_decisions:
- issue: Значение κύριος как божественного титула
  choice: Господь
  alternative: Владыка
  rationale: В сочетании с «Богом» и «нашими отцами» слово обозначает Бога и сохраняет библейское заветное звучание; перевод не вводит конфессионально специфического толкования.
- issue: Характер Божьего действия в ἐκδικεῖ ... κατὰ τὰς ἁμαρτίας
  choice: Который воздаёт нам по нашим грехам
  alternative: Который карает нас за наши грехи
  rationale: Текст говорит о Божьем карательном воздаянии в соответствии с грехами. «Воздаёт» сохраняет как судебный оттенок глагола, так и формальную связь κατά с мерой воздаяния.
- issue: Связь относительного местоимения ὃς
  choice: Который — относится к Богу и Господу наших отцов
  alternative: 'понимать как отдельное пояснение: «Он воздаёт нам...»'
  rationale: Мужской род единственного числа грамматически связывает придаточное с ближайшим божественным титулом, при этом «Бог и Господь» понимается как наименование одного лица.
- issue: Отрицательная цель в ἵνα μὴ ποιήσῃ
  choice: чтобы Он сегодня не поступил согласно этим словам
  alternative: да не поступит Он сегодня согласно этим словам
  rationale: Выбранный вариант сохраняет грамматическую зависимость целевой конструкции, не превращая её в самостоятельное пожелание, хотя в контексте она имеет близкий к молитвенному оттенок.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным судебно-клятвенным звучанием. Синтаксис оригинала сохранён настолько, чтобы не устранять связь Бога одновременно с призывом свидетелей, воздаянием за грехи и последующей отрицательной целью. Местоимение «Который» и «Он» написаны с прописной буквы по устойчивой русской библейской издательской традиции.
