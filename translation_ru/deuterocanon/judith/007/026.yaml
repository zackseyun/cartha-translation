  text: And now call them, and hand over the whole city as plunder to the people of Holofernes and to all his force.
translation:
  language: ru
  text: А теперь позовите их и отдайте весь город на разграбление людям Олоферна и всему его войску.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπικαλέσασθε αὐτοὺς
  choice: позовите их
  rationale: В контексте глагол означает призвать или позвать упомянутых людей; это естественная современная передача без добавления идеи официального созыва.
- source_word: ἔκδοθε
  choice: отдайте
  rationale: Императив передаёт требование выдать или предать город в руки противника; «отдайте» ясно и естественно выражает смысл.
- source_word: εἰς προνομήν
  choice: на разграбление
  rationale: Оборот обозначает передачу города как добычи для грабежа; выбранная формулировка сохраняет целевое значение.
- source_word: τῷ λαῷ Ὁλοφέρνου
  choice: людям Олоферна
  rationale: Здесь λαός естественно относится к людям, находящимся под началом Олоферна, а не обязательно к отдельному этносу.
- source_word: πάσῃ τῇ δυνάμει αὐτοῦ
  choice: всему его войску
  rationale: В военном контексте δύναμις означает вооружённую силу или войско; единственное число греческого текста сохранено собирательным русским существительным.
