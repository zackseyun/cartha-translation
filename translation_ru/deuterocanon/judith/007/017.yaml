translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Этнические формулы «сыны Аммона», «сыны Ассура» и «сыны Израиля» сохранены ради структуры оригинала; возможные идиоматические соответствия вынесены в сноски. Синтаксис разделён на два предложения для ясности без изменения последовательности событий.
