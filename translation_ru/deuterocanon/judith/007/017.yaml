base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/017.yaml
  text: And the camp of the sons of Ammon moved on[a], and with them five thousand sons of Asshur[c][b], and they encamped in the valley and seized the waters and the springs of water of the sons of Israel.
translation:
  language: ru
  text: И двинулся стан сынов Аммона[a], а с ними — пять тысяч сынов Ассура[b]. Они расположились станом в долине[c] и захватили[d] воды и водные источники сынов Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «аммонитян». Буквально в греческом тексте: «сынов Аммона».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть ассирийцев; буквально: «сынов Ассура».'
    reason: lexical_alternative
  - marker: c
    text: Греческое слово может также обозначать лощину, ущелье или замкнутую низменность — в зависимости от рельефа местности.
    reason: lexical_alternative
  - marker: d
    text: 'Или: «заняли», «заблаговременно взяли под контроль». Глагол подразумевает стратегическое овладение источниками воды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆρεν ἡ παρεμβολή
  choice: двинулся стан
  rationale: Глагол обозначает снятие с места и дальнейшее движение, а παρεμβολή — военный стан или расположившееся войско. Выражение «двинулся стан» естественно для военного повествования и не уточняет без достаточных оснований, было ли это отступлением или наступлением.
- source_word: υἱῶν Ἀμμών
  choice: сынов Аммона
  rationale: Сохранена буквальная этническая формула греческого текста; она также перекликается с выражением «сынов Израиля» в конце стиха.
- source_word: χιλιάδες πέντε υἱῶν Ἀσσούρ
  choice: пять тысяч сынов Ассура
  rationale: Числительное передано по нормам русского языка, а форма этнонима сохранена близко к греческому тексту, не отождествляя её молча с какой-либо более поздней политической или географической категорией.
- source_word: παρενέβαλον
  choice: расположились станом
  rationale: Стандартное военное значение глагола — разбить или расположить лагерь; выбран dignified и понятный современный оборот.
- source_word: ἐν τῷ αὐλῶνι
  choice: в долине
  rationale: В данном географическом контексте αὐλών означает долину, лощину или замкнутую низменность, а не архитектурный двор.
- source_word: προκατελάβοντο
  choice: захватили
  rationale: Сложный глагол указывает на заблаговременное занятие или установление контроля. «Захватили» передаёт враждебное военное действие, а стратегический оттенок поясняется в сноске.
- source_word: τὰ ὕδατα καὶ τὰς πηγὰς τῶν ὑδάτων
  choice: воды и водные источники
  rationale: Сохранены множественное число и двойное упоминание воды и её источников без неестественного для русского языка выражения «источники вод».
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: сынов Израиля
  rationale: Сохранена формула оригинала и её параллель с «сынами Аммона».
