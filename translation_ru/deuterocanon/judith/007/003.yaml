base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/003.yaml
  text: And they encamped in the valley near Bethulia[a], by the spring, and they extended in breadth toward Dothaim as far as Belbaim, and in length from Bethulia as far as Cyamon, which is opposite Esdraelon.
translation:
  language: ru
  text: И расположились они в долине близ Ветилуи[a], у источника; их стан простирался в ширину по направлению к Дофаиму до Велваима, а в длину — от Ветилуи до Киамона, расположенного напротив Ездрилона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое αὐλών в некоторых контекстах может означать «двор», однако здесь географическая обстановка и упоминание источника указывают на долину или ущелье.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρενέβαλον
  choice: расположились
  rationale: В военном контексте глагол означает разбить или расположить лагерь; по-русски «расположились» естественно передаёт постановку войска лагерем.
- source_word: ἐν τῷ αὐλῶνι
  choice: в долине
  rationale: В данном географическом окружении αὐλών обозначает долину или ущелье, а не двор; выбран наиболее ясный общий топографический термин.
- source_word: πλησίον Βαιτυλουὰ
  choice: близ Ветилуи
  rationale: Передаёт пространственное значение πλησίον и сохраняет достоинство библейского повествовательного регистра.
- source_word: ἐπὶ τῆς πηγῆς
  choice: у источника
  rationale: πηγή — природный источник; предлог «у» естественно выражает местонахождение рядом с ним.
- source_word: παρέτειναν
  choice: их стан простирался
  rationale: Греческий глагол описывает протяжённость лагеря; явное «стан» устраняет неестественное русское «они простирались», не меняя референта.
- source_word: εἰς εὖρος
  choice: в ширину
  rationale: Сохраняет размерное противопоставление последующему εἰς μῆκος.
- source_word: ἐπὶ Δοθαειμ ἕως Βελβαΐμ
  choice: по направлению к Дофаиму до Велваима
  rationale: ἐπί здесь имеет направительное значение; перевод не уточняет географическую линию сверх греческого текста.
- source_word: εἰς μῆκος
  choice: в длину
  rationale: Естественная русская пара к «в ширину».
- source_word: ἕως Βαιτυλουὰ ἕως Κυαμῶνος
  choice: от Ветилуи до Киамона
  rationale: Повтор ἕως обозначает границы протяжённости; русская конструкция «от… до…» ясно передаёт предполагаемый диапазон, хотя «от» в греческом выражено неявно.
- source_word: ἀπέναντι Ἐσδρηλών
  choice: напротив Ездрилона
  rationale: ἀπέναντι обозначает положение напротив или лицом к указанному месту; «напротив» кратко сохраняет географический смысл.
