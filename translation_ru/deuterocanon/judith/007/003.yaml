  source_fidelity: Перевод точно передаёт военное расположение войска, местность у Ветилуи и источника, а также два измерения протяжённости стана. «В долине» обоснованно отражает αὐλών в данном топографическом контексте. Формула «по направлению к Дофаиму до Велваима» сохраняет направительный оттенок ἐπί, не навязывая более точной географической реконструкции. «От Ветилуи до Киамона» является естественной русской передачей подразумеваемого диапазона при повторе ἕως.
