  text: And you will repay them with an evil recompense[b][a], because they rebelled and did not meet you in peace.
translation:
  language: ru
  text: И Ты воздашь им злым воздаянием[a] за то, что они восстали и не вышли встретить Тебя с миром[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «воздашь им злое воздаяние»; однокоренное сочетание усиливает мысль об ответном возмездии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не встретили Тебя с миром». Греческий глагол может подразумевать выход навстречу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνταποδώσεις
  choice: воздашь
  rationale: Будущая форма глагола ответного воздаяния; «воздашь» естественно в молитвенной речи и сохраняет направленность действия к Богу.
- source_word: ἀνταπόδομα πονηρόν
  choice: злым воздаянием
  rationale: Сочетание сохраняет суровый смысл πονηρόν и, вместе с однокоренным глаголом «воздашь», передаёт усилительную фигуру оригинала.
- source_word: ἀνθʼ ὧν
  choice: за то, что
  rationale: Выражает как основание, так и ответный характер воздаяния, не сводя оборот только к отвлечённой причинности.
- source_word: ἐστασίασαν
  choice: восстали
  rationale: Глагол обозначает мятежное, бунтарское противостояние; «восстали» уместно в данном контексте и не требует уточнения, отсутствующего в тексте.
- source_word: οὐκ ἀπήντησαν
  choice: не вышли встретить
  rationale: Передаёт обычный оттенок ἀπαντάω — выйти навстречу прибывающему, полнее, чем простое «не встретили».
- source_word: τῷ προσώπῳ σου
  choice: Тебя
  rationale: Буквально «лицу Твоему»; здесь оборот обозначает самого адресата и естественно передаётся личным местоимением.
- source_word: ἐν εἰρήνῃ
  choice: с миром
  rationale: 'Сохраняет широту греческого выражения: мирный выход навстречу, мирные намерения или мирное принятие.'
theological_decisions:
- issue: Характер ожидаемого Божьего суда
  choice: Прямое обращение к Богу с уверенным утверждением или просьбой о воздаянии за мятеж и немирную встречу
  alternative: Общее безличное высказывание о Божьей справедливости
  rationale: Будущее время в контексте прямого обращения допускает оттенок уверенности и молитвенного призыва. Перевод сохраняет эту напряжённость и не добавляет пояснений о природе суда.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Заглавные местоимения при обращении к Богу отражают принятую русскую библейскую типографическую традицию. Однокоренная фигура «воздашь… воздаянием» намеренно сохранена и пояснена сноской.
