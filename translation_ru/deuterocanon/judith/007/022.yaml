  yaml_path: translation/deuterocanon/judith/007/022.yaml
  text: And their little children lost heart[a], and the women and the young men were failing from thirst, and they were falling in the squares of the city and in the passages of the gates[b], and there was no strength left in them.
translation:
  language: ru
  text: И малые дети их пали духом[a], а женщины и юноши изнемогали от жажды и падали на площадях города и в проходах ворот[b]; не осталось в них больше сил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приуныли»; возможно также: «ослабели духом». Греческое τὰ νήπια может обозначать совсем маленьких детей, включая младенцев, а ἠθύμησεν — уныние, упадок духа или внутреннее изнеможение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на широких улицах города и в проходах у ворот».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθύμησεν
  choice: пали духом
  rationale: Передаёт утрату мужества и внутренний упадок, не сводя значение исключительно к физическому изнеможению и не усиливая его до полного отчаяния.
- source_word: τὰ νήπια
  choice: малые дети
  rationale: Выражение охватывает маленьких детей, в том числе младенцев, и естественно звучит в современном русском контексте.
- source_word: ἐξέλιπον
  choice: изнемогали
  rationale: Имперфект описывает продолжавшееся истощение; «изнемогали» ясно передаёт постепенную утрату сил из-за жажды.
- source_word: ἀπὸ τῆς δίψης
  choice: от жажды
  rationale: Прямое и естественное выражение причины.
- source_word: ἔπιπτον
  choice: падали
  rationale: Имперфект сохраняет значение продолжающегося или повторявшегося действия без уточнения, что речь обязательно идёт об окончательной потере сознания.
- source_word: πλατείαις
  choice: площадях
  rationale: Слово обозначает широкие открытые общественные пространства города; «площади» здесь понятно и естественно.
- source_word: διόδοις τῶν πυλῶν
  choice: проходах ворот
  rationale: Близко передаёт проходы или проезды, связанные с городскими воротами, не подменяя их подходами к воротам.
- source_word: κραταίωσις
  choice: сил
  rationale: В контексте обезвоживания и падения означает силу или способность держаться; множественное «сил» идиоматично по-русски.
- source_word: οὐκ ἦν ... ἔτι ἐν αὐτοῖς
  choice: не осталось в них больше сил
  rationale: Естественно сохраняет значение ἔτι — «больше, уже» — и образ отсутствия силы внутри них.
