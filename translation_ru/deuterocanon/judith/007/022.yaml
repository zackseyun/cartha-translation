  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Имперфекты переданы формами несовершенного вида («изнемогали», «падали»), чтобы сохранить длительность и повторяемость происходящего; неоднозначность душевного и физического упадка в первой части отмечена сноской.
