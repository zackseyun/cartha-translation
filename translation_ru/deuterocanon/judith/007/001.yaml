base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/001.yaml
  text: On the next day Holofernes ordered all his army and all his people who had come for his alliance to break camp for Bethulia[a], to seize the passes of the hill country in advance[b], and to make war against the sons of Israel.
translation:
  language: ru
  text: На следующий день Олоферн приказал всему своему войску и всему своему народу, прибывшему для союза с ним[a], выступить к Ветилуе, заранее занять подступы к горной местности[b] и вести войну против сынов Израиля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прибывшему к нему как союзники». Буквально: «прибывшему к его союзу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подъёмы в горную местность»; имеются в виду ведущие вверх пути или проходы.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «израильтян». В греческом тексте буквально: «сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: На следующий день
  rationale: Естественно передаёт обычное повествовательное указание на день, следующий за описанными событиями.
- source_word: παρήγγειλεν
  choice: приказал
  rationale: Глагол обозначает властное распоряжение и уместен в военном контексте.
- source_word: πάσῃ τῇ στρατείᾳ αὐτοῦ
  choice: всему своему войску
  rationale: στρατεία здесь означает собранное войско, а не военный поход.
- source_word: παντὶ τῷ λαῷ αὐτοῦ
  choice: всему своему народу
  rationale: Сохраняет более широкое значение λαός и не сводит названную группу исключительно к воинам.
- source_word: οἳ παρεγένοντο ἐπὶ τὴν συμμαχίαν αὐτοῦ
  choice: пришедшему вступить с ним в союз
  rationale: Передаёт как прибытие, выраженное παρεγένοντο, так и союзнический смысл συμμαχία, не превращая союзников без достаточного основания просто в его собственные войска.
- source_word: ἀναζευγνύειν ἐπὶ Βαιτυλουὰ
  choice: выступить к Ветилуе
  rationale: Военный глагол ἀναζευγνύειν подразумевает снятие лагеря и выступление, а ἐπί при движении указывает направление к городу.
- source_word: τὰς ἀναβάσεις τῆς ὀρεινῆς
  choice: подступы к горной местности
  rationale: В данном военном контексте речь идёт о ведущих вверх путях или подходах, обеспечивающих доступ в нагорье.
- source_word: προκαταλαμβάνεσθαι
  choice: заранее занять
  rationale: Сохраняет значение упреждающего овладения стратегическими позициями.
- source_word: ποιεῖν πόλεμον πρὸς
  choice: начать войну против
  rationale: Естественный русский оборот для вступления в военные действия; значение направленности против противника сохранено.
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: сынов Израиля
  rationale: Сохраняет традиционное родовое обозначение и формальный образ греческого выражения.
theological_decisions:
- issue: Передача этнического и заветного обозначения τοὺς υἱοὺς Ἰσραήλ
  choice: сынов Израиля
  alternative: израильтян
  rationale: Буквальное родовое обозначение сохранено как традиционная библейская формула; оно относится к народу Израиля и не должно пониматься как указание только на непосредственных сыновей одного человека.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Военная терминология ясна для широкого читателя; традиционная формула «сыны Израиля» сохранена без архаизации остального стиха.
