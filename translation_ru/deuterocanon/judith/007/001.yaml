    issue: «Начать войну против»
    rationale: Греческое ποιεῖν πόλεμον πρὸς обозначает ведение войны против кого-либо и само по себе не маркирует момент её начала. «Вести войну против» сохраняет смысл без добавления.
  - severity: low
    issue: «пришедшему вступить с ним в союз»
    rationale: Передача понятна, но инфинитив «вступить» может несколько сильнее представлять союз как ещё не состоявшийся. «Прибывшему для союза с ним» ближе к цели/союзническому назначению, выраженному ἐπὶ τὴν συμμαχίαν αὐτοῦ.
