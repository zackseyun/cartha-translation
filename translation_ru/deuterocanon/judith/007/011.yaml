    text: 'Или: «не сражайся с ними в открытом бою». Греческое выражение обозначает обычное сражение войск в боевом построении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δέσποτα
  choice: господин
  rationale: Форма прямого обращения обозначает хозяина или властителя. В данном контексте обращение направлено к человеку; «господин» звучит естественно и не смешивает этот титул с обычной передачей κύριος как «Господь».
- source_word: μὴ πολέμει
  choice: не сражайся
  rationale: Настоящее повелительное наклонение с μή выражает запрет. «Не сражайся» прямо передаёт военный смысл πολεμέω и естественно звучит по-русски.
- source_word: καθὼς γίνεται πόλεμος παρατάξεως
  choice: в открытом бою
  rationale: παράταξις указывает на построение войск и правильное, фронтальное сражение. «В открытом бою» естественно передаёт противопоставление обычного строевого сражения предлагаемой далее иной тактике; образ боевого построения уточнён в сноске.
- source_word: οὐ πεσεῖται
  choice: не падёт
  rationale: В военном контексте πίπτω означает пасть в бою, обычно с подразумеваемой гибелью. «Не падёт» сохраняет метафору и не делает подразумеваемое значение более явным, чем в греческом.
- source_word: ἀνὴρ εἷς
  choice: ни один человек
  rationale: Сочетание существительного мужского рода с числительным подчёркивает, что не падёт даже один человек. Русская формула «ни один человек» сохраняет это усиление и подходит для военного контекста.
- source_word: λαοῦ σου
  choice: твоего народа
  rationale: λαός означает «народ»; хотя речь идёт о войске, греческий текст не употребляет специального обозначения воинов или отрядов.
theological_decisions:
- issue: Передача обращения δέσποτα в отличие от κύριος
  choice: господин
  alternative: владыка
  rationale: Адресат здесь — человек, облечённый властью. «Господин» сохраняет уважительное обращение и не придаёт ему преимущественно религиозного оттенка, возможного у слова «владыка».
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного исторического текста. Обращение дано в единственном числе; военная метафора «падёт» сохранена.
