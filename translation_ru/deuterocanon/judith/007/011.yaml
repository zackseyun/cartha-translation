  text: And now[a], master, do not fight against them as in a pitched battle, and not one man from your people will fall.
translation:
  language: ru
  text: А теперь, господин, не сражайся с ними так, как ведут обычное сражение в боевом строю[a], и ни один человек из твоего народа не падёт.
  philosophy: optimal-equivalence
  footnotes:
