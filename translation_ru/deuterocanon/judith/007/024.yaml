base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/024.yaml
  text: May God judge between you and us[a], because you have done us great injustice by not speaking peaceably with the sons of Asshur.
translation:
  language: ru
  text: Да рассудит Бог между вами и нами[a], потому что вы поступили с нами крайне несправедливо, не обратившись к сынам Ассура с мирным предложением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с ассирийцами». Буквально по-гречески: «с сынами Ассура».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κρῖναι
  choice: Да рассудит
  rationale: Аорист оптатива выражает пожелание или призыв; русская конструкция «да рассудит» естественно сохраняет эту волитивную силу и торжественность обращения.
- source_word: ἀνὰ μέσον ὑμῶν καὶ ἡμῶν
  choice: между вами и нами
  rationale: Устойчивое выражение о вынесении решения в споре между двумя сторонами; порядок участников сохранён по греческому тексту.
- source_word: ἐποιήσατε ἐν ἡμῖν ἀδικίαν μεγάλην
  choice: вы поступили с нами крайне несправедливо
  rationale: Передаёт направленность несправедливого действия против говорящих и усиление прилагательным μεγάλην естественным современным русским языком.
- source_word: οὐ λαλήσαντες εἰρηνικὰ
  choice: не поговорив о мире
  rationale: Причастный оборот указывает, в чём состояла несправедливость. Наречное εἰρηνικά может обозначать мирные слова или условия; перевод сохраняет речевое действие и его мирную направленность.
- source_word: μετὰ υἱῶν Ἀσσούρ
  choice: с сынами Ассура
  rationale: Сохранён буквальный образ греческого текста «сыны Ассура», не сводящий выражение без пояснения к этнониму «ассирийцы».
theological_decisions:
- issue: Формула обращения к Божьему суду
  choice: Да рассудит Бог между вами и нами
  alternative: Пусть Бог рассудит между вами и нами
  rationale: Фраза представляет собой обращение к Богу как к судье в споре, без дополнительного догматического истолкования; «да рассудит» сохраняет пожелательную силу и возвышенный, но понятный регистр.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной формулой «да рассудит». Основная фраза ясна обычному читателю; буквальный древний этноним сохранён в тексте, а его значение пояснено в сноске.
