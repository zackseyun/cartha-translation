lexical_decisions:
- source_word: ἐπισυνήχθησαν
  choice: собрался
  rationale: Глагол употреблён непереходно и обозначает совместное собрание людей; единственное число согласовано с собирательным «народ».
- source_word: πᾶς ὁ λαός
  choice: весь народ
  rationale: Естественно передаёт общность жителей как единое целое и сохраняет значение πᾶς.
- source_word: ἐπὶ Ὀζίαν
  choice: против Озии
  rationale: ἐπί с винительным допускает направительное и враждебное значение; последующая громкая жалоба и выступление перед властями поддерживают здесь значение противостояния.
- source_word: τοὺς ἄρχοντας τῆς πόλεως
  choice: начальников города
  rationale: ἄρχοντες обозначает лиц, наделённых городской властью; «начальники» звучит естественно и не приписывает им более узкой должности.
- source_word: οἱ νεανίσκοι
  choice: юноши
  rationale: Передаёт мужской род греческого существительного и отличает эту группу от детей.
- source_word: τὰ παιδία
  choice: дети
  rationale: Ясный современный эквивалент общего обозначения детей.
- source_word: ἀνεβόησαν φωνῇ μεγάλῃ
  choice: громко закричали
  rationale: Естественная русская конструкция передаёт как сам крик, так и его силу, не калькируя оборот «великим голосом».
- source_word: εἶπαν ἐναντίον τῶν πρεσβυτέρων
  choice: выступили против старейшин
  rationale: В контексте общественного протеста «выступили против» естественно передаёт речевое действие и вероятный противительный смысл ἐναντίον; неоднозначность отмечена в сноске.
