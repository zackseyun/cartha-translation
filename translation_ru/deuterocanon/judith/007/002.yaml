base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/002.yaml
  text: And on that day every one of their mighty men broke camp[a]; and their fighting force of warrior men was one hundred seventy thousand foot soldiers and twelve thousand horsemen, besides the baggage train of the men who were on foot among them[b], a very great multitude.
translation:
  language: ru
  text: И в тот день все их могучие мужи снялись с лагеря[a]. Их военная сила — воины — насчитывала сто семьдесят тысяч пеших воинов и двенадцать тысяч всадников, не считая обоза людей, шедших среди них пешком[b]; их было великое множество.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выступили в путь»; греческий глагол может означать как снятие лагеря, так и отправление в поход.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое выражение здесь синтаксически трудно. Возможно также: «не считая обоза и пеших людей среди них». Речь, вероятно, идёт о весьма многочисленных людях, связанных с обозом и не включённых в указанное число воинов.'
    reason: textual_difficulty
lexical_decisions:
- source_word: ἀνέζευξεν
  choice: снялись с лагеря
  rationale: Глагол обозначает снятие лагеря и выступление в путь. Русское выражение естественно для военного повествования и сохраняет образ лагеря.
- source_word: πᾶς ἀνὴρ δυνατὸς αὐτῶν
  choice: все их сильные воины
  rationale: Дословное «каждый их сильный мужчина» звучало бы неестественно. «Сильные воины» передаёт мужской и военный смысл δυνατός в данном контексте.
- source_word: ἡ δύναμις αὐτῶν ἀνδρῶν πολεμιστῶν
  choice: их боевая сила
  rationale: δύναμις здесь означает военную силу, а последующее ἀνδρῶν πολεμιστῶν уточняет её как силу бойцов. Формулировка избегает тяжеловесного повтора «сила воинов-воителей».
- source_word: πεζῶν
  choice: пеших воинов
  rationale: Передаёт военное значение и противопоставление всадникам, не используя более техническое «пехотинцев».
- source_word: ἵππων
  choice: всадников
  rationale: Хотя форма буквально связана с «конями», параллель с пешими воинами указывает на конные войска.
- source_word: χωρὶς τῆς ἀποσκευῆς
  choice: не считая обоза
  rationale: ἀποσκευή обозначает багаж, снаряжение или сопровождающий войско обоз; в военном контексте «обоз» краток и точен.
- source_word: τῶν ἀνδρῶν οἳ ἦσαν πεζοὶ ἐν αὐτοῖς
  choice: людей, которые шли среди них пешком
  rationale: Перевод близко следует трудному греческому синтаксису и не отождествляет этих людей безусловно с уже подсчитанными пешими воинами.
- source_word: πλῆθος πολὺ σφόδρα
  choice: великого множества
  rationale: Сохраняет усиленное указание на чрезвычайно большое число сопровождавших войско людей и соответствует достоинству повествовательного стиля.
