lexical_decisions:
- source_word: ἐσκόρπισεν
  choice: распустил
  rationale: В данном контексте речь идёт о том, что собравшийся народ разошёлся по назначенным местам; «распустил» естественно передаёт каузативный смысл, не предполагая панического бегства.
- source_word: λαόν
  choice: народ
  rationale: Слово обозначает собравшихся жителей в целом, а не исключительно воинов.
- source_word: παρεμβολήν
  choice: стан
  rationale: Краткое и уместное в военной обстановке обозначение лагеря; местоимение ἑαυτοῦ учтено в сочетании «по стану», без тяжеловесного «по своему собственному стану».
- source_word: ἀπῆλθεν
  choice: он отправился
  rationale: Сохранено формальное единственное число глагола в тексте Swete, а не внесено контекстуальное исправление на множественное; возможная синтаксическая трудность отмечена в сноске.
- source_word: τείχη
  choice: стены
  rationale: Прямое и естественное обозначение городских оборонительных стен.
- source_word: πύργους
  choice: башни
  rationale: Основное значение слова; уточнение «сторожевые» оригиналом не требуется.
- source_word: ἀπέστειλεν
  choice: отослал
  rationale: Передаёт направление женщин и детей обратно по домам и естественно звучит в повествовании.
- source_word: ταπεινώσει πολλῇ
  choice: в великом бедствии
  rationale: В контексте осады выражение обозначает тяжёлое, униженное и угнетённое состояние; «бедствие» понятно современному читателю, а оттенок унижения сохранён в сноске.
