lexical_decisions:
- source_word: ἐὰν δὲ διέλθωσιν αὗται
  choice: Но если эти дни пройдут
  rationale: Указательное αὗται относится к подразумеваемым дням из ближайшего контекста; по-русски существительное необходимо выразить явно.
- source_word: μὴ ἔλθῃ ἐφʼ ἡμᾶς βοήθεια
  choice: а помощь к нам не придёт
  rationale: Естественно передаёт образ прибытия помощи; ἐπί с винительным здесь обозначает направленность к людям, не требуя буквального «на нас».
- source_word: ποιήσω κατὰ τὰ ῥήματα ὑμῶν
  choice: я сделаю по вашим словам
  rationale: Сохраняет формальную связь с ῥήματα и передаёт обещание поступить согласно сказанному собеседниками.
