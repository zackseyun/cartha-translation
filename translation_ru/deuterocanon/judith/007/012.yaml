  text: Remain by your camp, securing every man from your force, and let your servants gain control of the spring of water that comes out from the foot of the mountain,
translation:
  language: ru
  text: Оставайся при своём лагере, охраняя каждого человека из твоего войска, а твои слуги[a] пусть возьмут под контроль источник воды, бьющий из основания горы[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твои люди»; греческое слово может означать слуг, прислужников или подчинённых.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из корня горы», то есть из её основания, или у подножия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάμεινον
  choice: Оставайся
  rationale: Повелительная форма означает оставаться на месте; «оставайся» естественно передаёт военное распоряжение без излишнего оттенка ожидания.
- source_word: ἐπὶ τῆς παρεμβολῆς σου
  choice: при своём лагере
  rationale: παρεμβολή в данном военном контексте — лагерь; предлог ἐπί допускает пространственное значение нахождения при лагере.
- source_word: ἀσφαλίζων
  choice: обеспечивая безопасность
  rationale: Причастие обозначает действие по охране или приведению в безопасное состояние; выбранная формулировка сохраняет его связь с повелением.
- source_word: πάντα ἄνδρα ἐκ τῆς δυνάμεώς σου
  choice: каждого воина из твоего войска
  rationale: Дистрибутивное единственное число передано как «каждого»; в военном контексте ἀνήρ означает воина, а δύναμις — вооружённое войско.
- source_word: ἐπικρατησάτωσαν
  choice: пусть возьмут под контроль
  rationale: Глагол означает овладеть или установить власть над чем-либо; выражение точно передаёт тактическое распоряжение относительно источника.
- source_word: οἱ παῖδές σου
  choice: твои слуги
  rationale: παῖδες может обозначать слуг, прислужников или подчинённых; основной текст сохраняет прямое значение, а военная альтернатива отмечена в сноске.
- source_word: πηγῆς τοῦ ὕδατος
  choice: источник воды
  rationale: Естественная русская передача конкретного водного источника без обобщения до системы водоснабжения.
- source_word: ἡ ἐκπορεύεται
  choice: который выходит
  rationale: Форма означает выходить или исходить; буквальный образ сохранён, хотя применительно к воде возможно «вытекает».
- source_word: ἐκ τῆς ῥίζης τοῦ ὄρους
  choice: у подножия горы
  rationale: Буквально «из корня горы»; это топографическое выражение обозначает основание, или подножие, горы.
