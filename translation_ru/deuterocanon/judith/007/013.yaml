lexical_decisions:
- source_word: διότι
  choice: ведь
  rationale: Союз вводит обоснование предложенного ранее плана; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: ἐκεῖθεν ὑδρεύονται
  choice: оттуда берут воду
  rationale: Передаёт как исходную точку, так и конкретное значение глагола — снабжаться водой; в современном русском это естественнее, чем более узкое «черпают воду».
- source_word: πάντες οἱ κατοικοῦντες Βαιτυλουά
  choice: все жители Ветилуи
  rationale: Сохраняет всеобщий охват и кратко, естественно передаёт субстантивированное причастие.
- source_word: Βαιτυλουά
  choice: Ветилуя
  rationale: Русская транслитерация отражает греческую форму Βαιτυλουά и склоняется как географическое название женского рода; традиционная форма отмечена в сноске.
- source_word: ἀνελεῖ αὐτοὺς ἡ δίψα
  choice: Жажда погубит их
  rationale: Сохраняет персонифицированную жажду как подлежащее и смертельную силу ἀναιρέω, не ослабляя её до «измучит».
- source_word: ἐκδώσουσι τὴν πόλιν αὐτῶν
  choice: они сдадут свой город
  rationale: В военном контексте ἐκδίδωμι означает отдать неприятелю, капитулировать; «сдадут» ясно и естественно выражает это значение.
- source_word: καὶ ἡμεῖς καὶ ὁ λαὸς ἡμῶν
  choice: мы и наш народ
  rationale: Сохраняет явное разграничение говорящих и их народа, не пытаясь устранить возможную стилистическую необычность.
- source_word: ἀναβησόμεθα ἐπὶ τὰς πλησίον κορυφὰς τῶν ὀρέων
  choice: поднимемся на ближайшие горные вершины
  rationale: Передаёт восходящее движение, направленность ἐπί и топографический смысл κορυφαί; «горные вершины» звучит естественно по-русски.
