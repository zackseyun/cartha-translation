  verdict: revise
  source_fidelity: 'Нужно убрать «Тогда»: греческое καί означает «и» и не вводит явно временной переход. «Ближайшие» может значить именно самые близкие, тогда как πλησίον — «близлежащие, находящиеся поблизости». Передача Βαιτυλουά как «Ветилуя» не вполне следует греческой форме: окончательное -ά передаётся как -а, а не -я; более прямой вариант — «Ветилуа».'
  naturalness: «Ведь оттуда берут воду все жители…» и «Жажда погубит их» естественны для современного литературного русского. Одно предложение с точкой с запятой лучше сохраняет синтаксическое развёртывание исходника и не добавляет смысловой границы.
  terminology: Военные «сдадут свой город» и «поднимемся» точны. Топоним следует унифицировать в тексте и сноске как «Ветилуа»; традиционный русский вариант можно отметить как «Ветилуя».
  issues:
  - severity: medium
    issue: Добавлено «Тогда» перед «мы и наш народ поднимемся».
    rationale: В оригинале после точки с запятой стоит καί, простое соединительное «и». «Тогда» делает последовательность действий более явно временной, чем в греческом тексте.
  - severity: medium
    issue: Форма топонима «Ветилуя» и пояснение, что она следует Βαιτυλουά.
    rationale: Греческое Βαιτυλουά оканчивается на -ά; для более прямой русской передачи уместно «Ветилуа». Сноска должна отличать эту форму от традиционной «Ветилуя».
  - severity: low
    issue: «Ближайшие» для πλησίον.
    rationale: Слово может подразумевать сравнительное значение «самые близкие», тогда как πλησίον обозначает близость без такого уточнения. «Близлежащие» точнее.
