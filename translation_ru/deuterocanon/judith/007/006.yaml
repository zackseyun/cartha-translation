lexical_decisions:
- source_word: τῇ ... ἡμέρᾳ τῇ δευτέρᾳ
  choice: На второй день
  rationale: Дательный падеж употреблён в значении времени; перевод прямо и естественно сохраняет последовательность событий.
- source_word: ἐξήγαγεν
  choice: вывел
  rationale: Глагол означает «вывести» или «повести наружу»; «вывел» точно передаёт военное перемещение, не добавляя отсутствующего в тексте указания на марш.
- source_word: πᾶσαν τὴν ἵππον αὐτοῦ
  choice: всю свою конницу
  rationale: В военном контексте ἵππος собирательно обозначает конницу; возвратное «свою» естественно соотносит её с подлежащим Олоферном.
- source_word: κατὰ πρόσωπον
  choice: перед
  rationale: Оборот обозначает расположение перед кем-либо или напротив него; «перед» сохраняет пространственный смысл без излишней конкретизации.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: сынами Израиля
  rationale: Сохранено традиционное и буквальное этническое обозначение греческого текста; возможный смысл — «израильтянами» — указан в примечании.
- source_word: οἳ ἦσαν ἐν Βετυλουά
  choice: находившимися в Ветилуе
  rationale: Причастный оборот естественно передаёт определительное придаточное и сохраняет указание на пребывание внутри города.
