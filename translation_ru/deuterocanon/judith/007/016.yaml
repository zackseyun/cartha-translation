translation:
  language: ru
  text: И слова их понравились Олоферну и всем его приближённым, и он приказал сделать так, как они сказали.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρεσαν
  choice: понравились
  rationale: Аорист ἀρέσκω выражает благосклонное восприятие предложенного совета; «понравились» естественно передаёт эту реакцию и сохраняет личную конструкцию.
- source_word: οἱ λόγοι αὐτῶν
  choice: слова их
  rationale: Буквально λόγοι означает «слова», а в контексте — содержание совета. Такой перевод близок к греческому и ясен по-русски.
- source_word: θεραπόντων
  choice: приближённым
  rationale: θεράπων здесь обозначает людей, состоящих при военачальнике, а не просто домашних слуг; «приближённые» естественно для военно-придворного окружения Олоферна.
- source_word: συνέταξε
  choice: приказал
  rationale: В данном контексте συντάσσω означает распорядиться или повелеть; «приказал» кратко и ясно передаёт властный характер действия.
- source_word: ποιεῖν καθὰ ἐλάλησαν
  choice: сделать так, как они сказали
  rationale: Инфинитив ποιεῖν с καθά передаёт содержание приказа; формулировка сохраняет последовательность греческого текста и звучит естественно.
