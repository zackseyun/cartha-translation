  text: And the cisterns were being emptied, and they did not have enough water to drink for even one day, because it was given to them to drink by measure.
translation:
  language: ru
  text: И водоёмы пустели, и у них не было вдоволь воды на один день, потому что воду им выдавали мерой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отмеренными порциями», «понемногу»; буквально по-гречески — «мерой», то есть воду выдавали по норме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λάκκοι
  choice: водоёмы
  rationale: В контексте осады речь идёт о выкопанных местах для хранения воды. «Водоёмы» понятно современному читателю и не создаёт характерной для слова «колодцы» мысли о постоянном подземном источнике.
- source_word: ἐξεκενοῦντο
  choice: пустели
  rationale: Имперфект передаёт продолжавшееся истощение запасов; «пустели» естественно выражает этот процесс, не уточняя способ расходования воды.
- source_word: οὐκ εἶχον πεῖν εἰς πλησμονὴν ὕδωρ
  choice: у них не было вдоволь воды
  rationale: Оборот εἰς πλησμονήν буквально указывает на полноту или насыщение, поэтому речь не о полном отсутствии воды, а о невозможности пить вдоволь.
- source_word: ἡμέραν μίαν
  choice: даже на один день
  rationale: «Даже» естественно передаёт риторический акцент на минимальном сроке, хотя отдельной соответствующей частицы в греческом нет.
- source_word: ἐν μέτρῳ
  choice: мерой
  rationale: Сохранён конкретный греческий образ дозированной выдачи; смысл нормирования пояснён в сноске.
- source_word: ἐδίδοσαν αὐτοῖς πεῖν
  choice: воду им выдавали
  rationale: Неопределённо-личная русская конструкция естественно передаёт греческое множественное число без названного деятеля и сохраняет смысл распределения воды.
