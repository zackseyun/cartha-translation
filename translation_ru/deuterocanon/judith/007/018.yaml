base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/018.yaml
  text: And the sons of Esau and the sons of Ammon went up and camped in the hill country opposite Dothaim[a], and they sent some of their men toward the south and east, opposite Egrebel, which is near Chous, which is on the wadi Mochmour. And the rest of the Assyrian army camped on the plain and covered the whole face of the land, and their tents and their baggage were encamped in a very great multitude[b], and they were exceedingly numerous.
translation:
  language: ru
  text: И поднялись сыновья Исава и сыновья Аммона и расположились в горной местности напротив Дотаима. Они послали часть своих людей к югу и востоку[a], напротив Егребела, который находится близ Хуса, что у потока Мохмур[b]. Остальное ассирийское войско расположилось на равнине и покрыло всю поверхность земли. Их шатры и обоз стояли огромной массой, и было их чрезвычайно много.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к югу и к восходу»; греческое обозначение востока связано с восходом солнца.'
    reason: lexical_alternative
  - marker: b
    text: 'Здесь имеется в виду поток или русло, которое может наполняться водой лишь в сезон дождей; возможно также: «у вади Мохмур».'
    reason: cultural_note
lexical_decisions:
- source_word: ἀνέβησαν
  choice: поднялись
  rationale: Сохраняет пространственное значение греческого глагола, уместное перед упоминанием горной местности, не превращая его в специальный военный термин.
- source_word: οἱ υἱοὶ Ἡσαῦ καὶ οἱ υἱοὶ Ἀμμών
  choice: сыновья Исава и сыновья Аммона
  rationale: Формально передаёт обозначения народов через родоначальников и сохраняет библейский образ выражения.
- source_word: παρενέβαλον
  choice: расположились
  rationale: В военном контексте означает разбить лагерь; русский глагол естественно описывает размещение войска, а далее существительное «станом» передаёт образ лагеря.
- source_word: ἐν τῷ ὄρει
  choice: в горной местности
  rationale: Единственное число может обозначать гористую область, а не обязательно одну конкретную гору.
- source_word: ἀπέναντι Δωθαείμ
  choice: напротив Дотаима
  rationale: Точно сохраняет пространственное значение ἀπέναντι и транслитерирует греческую форму топонима.
- source_word: ἀπέστειλαν ἐξ αὐτῶν
  choice: послали часть своих людей
  rationale: Ясно и естественно выражает буквальное «послали из своей среды» в военном контексте.
- source_word: πρὸς νότον καὶ ἀπηλιώτην
  choice: к югу и востоку
  rationale: Передаёт направления современными географическими терминами; буквальный образ восхода отмечен в сноске.
- source_word: χειμάρρου
  choice: потока
  rationale: Нейтрально передаёт русло или водоток, который может быть сезонным, не вводя менее привычное заимствование «вади» непосредственно в текст.
- source_word: ἡ λοιπὴ στρατεία τῶν Ἀσσυρίων
  choice: остальное ассирийское войско
  rationale: Естественно передаёт оставшуюся часть военной силы ассирийцев.
- source_word: ἐκάλυψαν πᾶν τὸ πρόσωπον τῆς γῆς
  choice: покрыло всю поверхность земли
  rationale: Сохраняет наглядную гиперболическую картину греческого текста без ненужного сглаживания.
- source_word: αἱ σκηναὶ καὶ αἱ ἀποσκευαὶ αὐτῶν
  choice: их шатры и обоз
  rationale: ἀποσκευαί обозначает багаж и имущество войска; «обоз» кратко и естественно передаёт это в военном повествовании.
- source_word: κατεστρατοπέδευσαν ἐν ὄχλῳ πολλῷ
  choice: стояли огромным станом
  rationale: Передаёт массовое размещение шатров и обоза; избегает неестественного буквального утверждения, будто неодушевлённый обоз «разбил лагерь».
