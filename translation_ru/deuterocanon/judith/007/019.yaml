  text: And the sons of Israel cried out to the Lord their God[a], because their spirit had grown faint[b], because all their enemies had surrounded them and there was no escape from among them.
translation:
  language: ru
  text: 'И сыны Израиля воззвали к Господу, своему Богу[a], потому что пали духом[b]: все их враги окружили их, и не было возможности вырваться из их окружения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально по-гречески: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: То есть лишились мужества, изнемогли духом.
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  rationale: Сохраняет родственный образ и библейское звучание греческого выражения; более гладкий вариант «израильтяне» отмечен в сноске.
- source_word: ἀνεβόησαν
  choice: воззвали
  rationale: Передаёт громкий, настойчивый призыв к Богу в бедствии, а не просто крик.
- source_word: Κύριον θεὸν αὐτῶν
  choice: к Господу, своему Богу
  rationale: Сохраняет κύριος как божественный титул и естественно передаёт принадлежность, выраженную αὐτῶν.
- source_word: ὠλιγοψύχησεν τὸ πνεῦμα αὐτῶν
  choice: пали духом
  rationale: Естественная русская идиома точно передаёт ослабление духа и утрату мужества; буквальный образ остаётся различимым.
- source_word: ἐκύκλωσαν πάντες οἱ ἐχθροὶ αὐτῶν
  choice: все их враги окружили их
  rationale: Прямо передаёт завершённое окружение; русское прошедшее время естественно выражает предшествующую причину вопля.
- source_word: οὐκ ἦν διαφυγεῖν ἐκ μέσου αὐτῶν
  choice: не было возможности вырваться из их среды
  rationale: Передаёт безличную конструкцию и невозможность бегства из окружения, сохраняя образ нахождения среди врагов.
theological_decisions:
- issue: Передача κύριος как божественного титула
  choice: Господь
  alternative: Владыка
  rationale: В обращении к Богу «Господь» — традиционная и точная передача титула без ослабления его богословского значения.
- issue: Коллективное выражение οἱ υἱοὶ Ἰσραήλ
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет мужской родственный образ греческого оригинала и его библейский резонанс; смысловой коллективный вариант дан в сноске.
- issue: Значение πνεῦμα в выражении об утрате мужества
  choice: дух
  alternative: мужество
  rationale: Фразеологизм «пали духом» сохраняет образ πνεῦμα и не сводит его заранее только к психологическому мужеству.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Воззвали» и «сыны Израиля» сохраняют достоинство и резонанс исходного текста; причинная цепочка передана двоеточием для ясности без устранения смысловой связи.
