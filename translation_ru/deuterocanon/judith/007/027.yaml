base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/007/027.yaml
  text: For it is better for us to become plunder for them[a]; for we will become servants, and our lives will be spared, and we will not see with our own eyes the death of our little children[d][c][b], and our wives and our children breathing out their lives.
translation:
  language: ru
  text: 'Ведь лучше нам стать их добычей[a]: мы станем рабами, и жизнь наша сохранится[b]. Мы не увидим собственными глазами[c] смерти наших маленьких детей и того, как угасает жизнь наших жён и детей[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добычей для разграбления»; возможны также «трофеем» или «награбленным добром».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «наша душа будет жить», то есть мы останемся в живых.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «перед нашими глазами».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «наших жён и наших детей, испускающих свои жизни». Греческая конструкция в этой части несколько неровна, но описывает их смерть на глазах говорящих.'
    reason: source_ambiguity
lexical_decisions:
- source_word: κρεῖσσον
  choice: лучше
  rationale: Сравнительная форма выражает предпочтительность одного исхода перед другим; «лучше» — прямой и естественный русский эквивалент.
- source_word: γενηθῆναι αὐτοῖς εἰς διαρπαγήν
  choice: стать их добычей
  rationale: Оборот означает оказаться отданными врагу на захват и разграбление. «Стать их добычей» сохраняет резкость образа и естественно звучит по-русски.
- source_word: δούλους
  choice: рабами
  rationale: В контексте капитуляции и принудительного подчинения речь идёт именно о рабском положении, а не о добровольной службе.
- source_word: ζήσεται ἡ ψυχὴ ἡμῶν
  choice: жизнь наша сохранится
  rationale: Буквально «наша душа будет жить»; здесь ψυχή обозначает жизнь человека, а весь оборот говорит о сохранении жизни.
- source_word: τὸν θάνατον τῶν νηπίων ἡμῶν
  choice: смерти наших малых детей
  rationale: νήπια — младенцы или совсем маленькие дети. «Малые дети» передаёт возраст и эмоциональную силу, не сужая значение исключительно до грудных младенцев.
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: собственными глазами
  rationale: Идиоматический оборот подчёркивает непосредственное созерцание происходящего; русский эквивалент естественен и сохраняет усиление.
- source_word: ἐκλειπούσας τὰς ψυχὰς αὐτῶν
  choice: как угасает жизнь наших жён и детей
  rationale: ἐκλείπω описывает иссякание, прекращение жизни. Передача через «угасает жизнь» сохраняет образ постепенной смерти и избегает неестественного буквального синтаксиса.
theological_decisions:
- issue: Значение δούλους в условиях завоевания
  choice: рабами
  alternative: слугами
  rationale: Предполагается насильственное порабощение после сдачи врагу; «слугами» могло бы ошибочно смягчить принудительный характер положения.
- issue: Значение ψυχή в выражении ζήσεται ἡ ψυχὴ ἡμῶν
  choice: жизнь наша сохранится
  alternative: душа наша будет жить
  rationale: В данном противопоставлении смерти ψυχή означает земную жизнь людей. Буквальный вариант мог бы необоснованно придать фразе учение о посмертном существовании души.
translation_notes:
  register: Современный литературный русский язык с достоинством и эмоциональной сдержанностью. Синтаксис слегка расчленён для ясности, при этом сохранены тяжесть выбора между порабощением и смертью и образ угасающей жизни. Добавлен связующий элемент «Тогда», явно выражающий логическое следствие, уже заложенное в последовательности греческих фраз.
