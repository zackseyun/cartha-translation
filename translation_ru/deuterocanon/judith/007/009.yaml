  text: Let our lord hear a word[b][a], so that there may not be a breach in your force.
translation:
  language: ru
  text: Пусть же наш господин выслушает слово, чтобы в твоём войске не произошёл надлом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы в твоей силе не произошло сокрушения (разлома)». Слово «сила» здесь, вероятно, означает войско.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουσάτω δὴ
  choice: Пусть же … выслушает
  rationale: Форма третьего лица передаёт почтительную просьбу, обращённую к вышестоящему; частица δὴ отражена словом «же», придающим просьбе настойчивость без резкости.
- source_word: λόγον
  choice: слово
  rationale: Сохраняется краткая греческая идиома со значением «то, что мы хотим сказать»; в данном торжественном обращении она понятна по-русски.
- source_word: ὁ δεσπότης ἡμῶν
  choice: господин наш
  rationale: δεσπότης обозначает человека, облечённого властью. В обращении к военачальнику «господин наш» передаёт почтение и не привносит значения Бога.
- source_word: θραῦσμα
  choice: потерпело разгром
  rationale: Буквально слово связано с разбиванием или сокрушением. В военном контексте естественное русское выражение «потерпеть разгром» передаёт угрозу тяжёлого поражения.
- source_word: ἐν τῇ δυνάμει σου
  choice: твоё войско
  rationale: δύναμις может означать силу, мощь или военную силу; ближайший контекст указывает на войско. Перестройка фразы делает русский текст естественным.
