  yaml_path: translation/deuterocanon/judith/007/010.yaml
  text: For this people[a], the sons of Israel, do not rely on their spears, but on the heights of their mountains, in which they themselves dwell[b]; for it is not easy to approach the summits of their mountains.
translation:
  language: ru
  text: Ибо этот народ — сыны Израиля[a] — полагается не на свои копья, а на высоты своих гор, где они сами живут; ведь подняться к вершинам их гор нелегко[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети Израиля» или «израильтяне». Буквально по-гречески: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приблизиться к вершинам их гор». Греческий глагол может обозначать приближение, в том числе движение вверх к возвышенности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαὸς
  choice: народ
  rationale: Естественное собирательное обозначение этнической общности в данной военной речи.
- source_word: υἱῶν Ἰσραήλ
  choice: сыны Израиля
  rationale: Передаёт явное греческое υἱῶν и сохраняет библейски узнаваемую, но понятную современному читателю формулу.
- source_word: οὐ πέποιθαν ἐπὶ τοῖς δόρασιν αὐτῶν
  choice: полагается не на свои копья
  rationale: πέποιθαν выражает устойчивую уверенность или опору, а δόρασιν конкретно означает копья, а не оружие вообще.
- source_word: ἀλλʼ ἐπὶ τοῖς ὕψεσι τῶν ὀρέων αὐτῶν
  choice: а на высоты своих гор
  rationale: Сохраняет топографический смысл ὕψεσι и параллелизм конструкции «не на... а на...».
- source_word: ἐν οἷς αὐτοὶ ἐνοικοῦσιν ἐν αὐτοῖς
  choice: где они сами живут
  rationale: Естественно передаёт место проживания и эмфатическое αὐτοὶ, не воспроизводя тяжеловесно греческое повторение.
- source_word: οὐ γὰρ ἔστιν εὐχερὲς
  choice: ведь ... нелегко
  rationale: Прямо и естественно передаёт отрицательную оценку трудности.
- source_word: προσβῆναι
  choice: взойти на
  rationale: В сочетании с вершинами гор глагол естественно указывает на движение вверх; возможный более общий смысл отмечен в сноске.
- source_word: ταῖς κορυφαῖς τῶν ὀρέων αὐτῶν
  choice: на вершины их гор
  rationale: Точно передаёт κορυφαῖς как вершины и сохраняет стратегическое значение горного рельефа.
