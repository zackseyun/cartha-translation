  yaml_path: translation/deuterocanon/judith/007/004.yaml
  text: But the sons of Israel[a], when they saw their great number, were greatly troubled, and each said to his neighbor, “Now these men will lick up the whole face of the land[b], and neither the high mountains nor the ravines nor the hills will bear their weight.”
translation:
  language: ru
  text: 'Сыны же Израиля, увидев, как их много, сильно встревожились, и каждый сказал своему ближнему: «Теперь они слижут всё лицо земли[a], и ни высокие горы, ни ущелья, ни холмы не выдержат их тяжести».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Слижут всё лицо земли» — буквальный образ; смысл: опустошат или поглотят всё на своём пути по всей земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ υἱοὶ Ἰσραήλ
  choice: Сыны же Израиля
  rationale: Формально близкая передача сохраняет библейский образ и союз δέ; «сыны» здесь уместнее современно нейтрального, но менее образного «израильтяне».
- source_word: ὡς ἴδον αὐτῶν τὸ πλῆθος
  choice: увидев, как их много
  rationale: Естественная русская передача τὸ πλῆθος, подчёркивающая огромную численность войска без тяжеловесного «множество».
- source_word: ἐταράχθησαν σφόδρα
  choice: сильно встревожились
  rationale: Передаёт сильное смятение или тревогу, не усиливая значение до однозначного ужаса.
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: стали говорить друг другу
  rationale: Естественно выражает распределительное ἕκαστος и обращение каждого к находившемуся рядом человеку.
- source_word: Νῦν ἐκλείξουσιν οὗτοι
  choice: Теперь они слижут
  rationale: Сохраняет яркую метафору глагола ἐκλείχω — «слизывать, слизывать дочиста», не сглаживая её до «поглотят».
- source_word: τὸ πρόσωπον τῆς γῆς πάσης
  choice: всё лицо земли
  rationale: Сохраняет семитизированный образ поверхности или пространства всей земли; порядок слов сделан естественным для русского.
- source_word: οὔτε τὰ ὄρη τὰ ὑψηλὰ οὔτε αἱ φάραγγες οὔτε οἱ βουνοί
  choice: ни высокие горы, ни ущелья, ни холмы
  rationale: Различает все три обозначения рельефа; φάραγγες точнее передано как «ущелья», а не широкие «долины».
- source_word: ὑποστήσονται τὸ βάρος αὐτῶν
  choice: не выдержат их тяжести
  rationale: Передаёт способность устоять под физическим весом огромного войска и сохраняет гиперболический образ.
