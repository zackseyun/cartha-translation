  yaml_path: translation/deuterocanon/judith/007/030.yaml
  text: And Uzziah said to them[a], “Take courage, brothers; let us hold out for five more days, within which the Lord our God will turn his mercy toward us, for he will not abandon us forever.”
translation:
  language: ru
  text: 'И сказал им Озия: «Мужайтесь, братья! Продержимся ещё пять дней, в течение которых Господь, Бог наш, обратит к нам Свою милость, ведь Он не оставит нас навсегда[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не оставит нас окончательно». Греческое выражение, буквально означающее «до конца», может указывать как на вечную, так и на полную оставленность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαρσεῖτε
  choice: Мужайтесь
  rationale: Повелительное наклонение во множественном числе передаёт прямой призыв обрести мужество; форма естественна для современного литературного русского языка.
- source_word: ἀδελφοί
  choice: братья
  rationale: Сохраняет грамматически мужское обращение исходного текста и естественно звучит в речи к общине.
- source_word: διακαρτερήσωμεν
  choice: продержимся
  rationale: Увещательное сослагательное выражает совместное продолжительное сопротивление в условиях осады; «продержимся» точно и естественно передаёт этот контекст.
- source_word: ἔτι πέντε ἡμέρας
  choice: ещё пять дней
  rationale: ἔτι обозначает добавочный период времени; русский оборот прямо передаёт это значение.
- source_word: ἐν αἷς
  choice: за это время
  rationale: Относительное выражение указывает на период, в пределах которого ожидается действие Бога; русский оборот естественнее буквального «в которые».
- source_word: ἐπιστρέψει
  choice: вновь обратит
  rationale: Переходное употребление с τὸ ἔλεος αὐτοῦ и ἐφʼ ἡμᾶς означает направление милости к людям. «Вновь» передаёт возвратный оттенок глагола, не превращая его в отдельное утверждение о прежнем отнятии милости.
- source_word: Κύριος ὁ θεὸς ἡμῶν
  choice: Господь, Бог наш
  rationale: Дигнифицированная и естественная русская передача греческого титула с приложением; сохраняет κύριος как «Господь».
- source_word: τὸ ἔλεος αὐτοῦ
  choice: Свою милость
  rationale: «Милость» является точным и богословски ненагруженным сверх текста соответствием ἔλεος; возвратное «Свою» естественно соотносит её с подлежащим.
- source_word: ἐφʼ ἡμᾶς
  choice: к нам
  rationale: Передаёт направленность милости на говорящих и естественно сочетается с русским глаголом «обратит».
- source_word: οὐ γὰρ ἐγκαταλείψει ἡμᾶς εἰς τέλος
  choice: ведь Он не оставит нас навсегда
  rationale: ἐγκαταλείπω означает «оставлять, покидать», а εἰς τέλος допускает идиоматическое временное понимание «навсегда»; альтернативное значение полной оставленности отмечено в сноске.
theological_decisions:
- issue: Передача κύριος применительно к Богу Израиля в греческой девтероканонической книге
  choice: Господь
  alternative: ГОСПОДЬ; Владыка
  rationale: Перевод следует непосредственно греческому κύριος и не вводит типографическое обозначение тетраграмматона, которого в данном греческом источнике нет.
- issue: Грамматически мужское обращение ἀδελφοί
  choice: братья
  alternative: братья и сёстры; соплеменники
  rationale: Исходный текст имеет форму мужского рода; контекст не требует расширять обращение вопреки его грамматической форме.
- issue: Неоднозначность εἰς τέλος
  choice: навсегда
  alternative: до конца; окончательно
  rationale: Основной текст использует естественное идиоматическое временное прочтение, тогда как возможный смысл полного или окончательного оставления сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. «Продержимся» учитывает обстановку осады, а пунктуация делает увещание ясным без архаизации. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятому русскому библейскому регистру.
