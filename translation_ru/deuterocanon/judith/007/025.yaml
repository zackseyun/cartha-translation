lexical_decisions:
- source_word: βοηθὸς ἡμῶν
  choice: нет у нас помощника
  rationale: Сохраняет личное значение существительного с притяжательным оборотом и естественно звучит по-русски.
- source_word: πέπρακεν ἡμᾶς
  choice: продал нас
  rationale: Глагол πράσκω буквально означает «продавать»; сильная метафора передачи во власть врагов сохранена, а не смягчена до «предал».
- source_word: εἰς τὰς χεῖρας αὐτῶν
  choice: в их руки
  rationale: Сохраняет понятную библейскую идиому передачи под чужую власть.
- source_word: τοῦ καταστρωθῆναι
  choice: чтобы мы пали
  rationale: Передаёт результат или цель — быть поверженными, — не навязывая более узкого образа попрания или убийства.
- source_word: ἐναντίον αὐτῶν
  choice: перед ними
  rationale: В данном контексте обозначает падение на виду у врагов и унижение перед ними.
- source_word: ἐν δίψει
  choice: от жажды
  rationale: ἐν допускает значение средства или обстоятельства; русский оборот «пасть от жажды» естественно передаёт вероятное средство гибели.
- source_word: ἀπωλείᾳ μεγάλῃ
  choice: великой погибели
  rationale: Передаёт ἀπώλεια как гибель или уничтожение без позднейшего специального оттенка слова «погибель» вне данного контекста.
theological_decisions:
- issue: Прямое приписывание бедствия действию Бога
  choice: Бог продал нас в их руки
  alternative: Бог предал нас в их руки
  rationale: Греческий текст прямо приписывает Богу действие и использует резкую метафору продажи. Перевод сохраняет эту богословскую напряжённость, не смягчая её.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис близок к греческому, но естественен; резкая метафора «продал нас» намеренно сохранена.
