    issue: Связка «от жажды и великой погибели»
    rationale: Греческое ἐν δίψει καὶ ἀπωλείᾳ μεγάλῃ допускает обстоятельственное или инструментальное понимание. Русское «от» делает оба члена непосредственными причинами, причём «пасть от погибели» стилистически и семантически неуклюже. Нейтральное «среди» лучше сохраняет исходную широту.
