  yaml_path: translation/deuterocanon/judith/007/014.yaml
  text: And we will encamp against them as a guard[a], so that not one man may go out from the city. And they, and their wives, and their children, will waste away in the famine, and before the sword comes upon them, they will be laid low in the streets of their dwellings.
translation:
  language: ru
  text: И мы расположимся возле них лагерем, чтобы никто не вышел из города. И они сами, и их жёны, и дети будут изнемогать от голода и, прежде чем меч обрушится на них, полягут на улицах своего поселения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут лежать поверженными на площадях своего поселения». Греческое слово πλατεῖαι может означать широкие улицы или городские площади, а καταστρωθήσονται — быть поверженными или распростёртыми на земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεμβαλοῦμεν ἐπʼ αὐταῖς
  choice: мы расположимся возле них лагерем
  rationale: Глагол обозначает военную стоянку, а местоимение женского рода во множественном числе, по контексту, указывает на ранее названные источники воды. «Возле них» естественно передаёт пространственное значение и не превращает сами источники в противника.
- source_word: εἰς προφυλακὴν τοῦ μὴ ἐξελθεῖν
  choice: чтобы стеречь и не дать… выйти
  rationale: Передаёт цель военной стражи и предупредительный смысл конструкции с τοῦ μή, не утяжеляя русскую фразу буквальным «для стражи».
- source_word: ἄνδρα ἕνα
  choice: ни одному человеку
  rationale: В данном запрете ἀνήρ может обозначать отдельного человека из числа жителей. Русская формулировка сохраняет усиление «ни одному», не создавая ненужного впечатления, будто выйти запрещается только взрослым мужчинам.
- source_word: τακήσονται ἐν τῷ λιμῷ
  choice: будут изнемогать от голода
  rationale: Метафорическое значение глагола — чахнуть, истощаться, угасать. «Изнемогать от голода» ясно и естественно передаёт результат осады.
- source_word: ῥομφαία
  choice: меч
  rationale: Обычное и уместное в военном контексте соответствие; более узкое указание на вид большого клинка здесь не требуется.
- source_word: καταστρωθήσονται
  choice: полягут
  rationale: Глагол рисует людей поверженными или распростёртыми на земле. «Полягут» сохраняет образ гибели, не добавляя прямого упоминания трупов.
- source_word: ἐν ταῖς πλατείαις τῆς οἰκήσεως αὐτῶν
  choice: на улицах своего селения
  rationale: πλατεῖαι допускает значения широких улиц и площадей, а οἴκησις — места обитания или поселения. Основной текст использует естественную русскую формулировку, а неоднозначность отмечена в сноске.
