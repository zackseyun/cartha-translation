  text: And he inspected the approaches to their city[a], and he took control of the springs of water and seized them, and he stationed camps of fighting men by them[c][b]; and he himself returned to his people.
translation:
  language: ru
  text: Он осмотрел пути подъёма к их городу[a], обследовал источники воды[c] и овладел ими; он разместил у них лагеря воинов, а сам возвратился к своему народу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подъёмы к их городу» или «пути, ведущие вверх к их городу». Греческое слово подчёркивает, что к городу нужно было подниматься.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «снялся с места и направился к своему народу». Греческий глагол может подразумевать снятие лагеря перед уходом.'
    reason: lexical_alternative
  - marker: c
    text: 'Значение редкого греческого глагола не вполне ясно; возможно также: «обошёл», «осмотрел» или «взял под охрану» источники.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεσκέψατο
  choice: осмотрел
  rationale: В военном контексте глагол обозначает целенаправленное обследование местности, а не просто посещение.
- source_word: ἀναβάσεις
  choice: подъёмы к их городу
  rationale: Передаёт буквальную топографическую направленность вверх и одновременно указывает на пути доступа к городу.
- source_word: πηγὰς τῶν ὑδάτων
  choice: источники воды
  rationale: Естественное русское выражение, сохраняющее конкретный объект военной операции.
- source_word: ἐφώδευεν
  choice: обошёл
  rationale: Редкий глагол связан с обходом или патрулированием; такая передача сохраняет последовательность действий и не приписывает тексту прямо не названного укрепления источников.
- source_word: προκατέλαβε
  choice: заранее овладел
  rationale: Приставка προ- указывает на заблаговременный захват стратегически важных мест.
- source_word: ἐπέστησεν
  choice: поставив
  rationale: В сочетании с лагерями обозначает размещение военной силы у источников.
- source_word: παρεμβολὰς ἀνδρῶν πολεμιστῶν
  choice: лагеря воинов
  rationale: Сохраняет конкретный образ военных лагерей; родительный оборот естественно передаёт их состав.
- source_word: ἀνέζευξεν
  choice: возвратился
  rationale: По контексту обозначает отход к своему войску или народу; возможный оттенок снятия лагеря вынесен в примечание.
