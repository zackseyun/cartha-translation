lexical_decisions:
- source_word: προσελθόντες
  choice: подошли к нему
  rationale: Аористное причастие выражает предшествующее главному глаголу движение к лицу; русская конструкция с однородными сказуемыми естественно передаёт связь с εἶπαν.
- source_word: ἄρχοντες
  choice: правители
  rationale: Передаёт властный статус и сохраняет отличие от последующего ἡγούμενοι.
- source_word: υἱῶν Ἠσαῦ
  choice: сынов Исава
  rationale: Сохраняет буквальное этническое наименование греческого текста, не подменяя его толкованием «эдомитян».
- source_word: ἡγούμενοι
  choice: вожди
  rationale: Обозначает руководителей народа и позволяет отличить их от ἄρχοντες; слово уместно в повествовании о племенных и народных властях.
- source_word: λαοῦ Μωὰβ
  choice: народа Моава
  rationale: Прямо и ясно воспроизводит родительную конструкцию греческого текста.
- source_word: στρατηγοὶ
  choice: военачальники
  rationale: Естественное современное русское обозначение высших военных руководителей без привязки к позднейшему воинскому званию.
- source_word: παραλίας
  choice: приморья
  rationale: Передаёт не только береговую линию, но и прибрежную область, что соответствует географическому значению παραλία.
- source_word: εἶπαν
  choice: сказали
  rationale: Обычная повествовательная передача глагола речи; двоеточие указывает на продолжение прямой речи в следующем стихе.
