  text: And each of them took up his weapons of war, and after kindling fires on their towers, they remained on guard through that whole night.
translation:
  language: ru
  text: Каждый из них взял своё боевое снаряжение. Затем они разожгли костры на своих башнях и всю ту ночь оставались на страже.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλαβόντες
  choice: взял
  rationale: Аористное причастие передаёт действие, совершённое перед несением стражи; «взял» естественно выражает подготовку к военному дежурству.
- source_word: ἕκαστος
  choice: каждый
  rationale: Сохранено явное распределительное значение без добавления отсутствующего в греческом слова «мужчина».
- source_word: τὰ σκεύη τὰ πολεμικὰ αὐτῶν
  choice: своё боевое снаряжение
  rationale: σκεύη может обозначать принадлежности или снаряжение; определение πολεμικά уточняет военный характер. «Своё» естественно соотносит снаряжение с каждым из действующих лиц.
- source_word: ἀνακαύσαντες πυράς
  choice: разожгли костры
  rationale: Передаёт конкретный образ огней и предшествование этого действия основной длительной страже.
- source_word: ἐπὶ τοὺς πύργους αὐτῶν
  choice: на своих башнях
  rationale: ἐπί с винительным здесь указывает на место; «на башнях» естественно для оборонительной обстановки. Возвратное «своих» ясно соотносит башни с подлежащим.
- source_word: ἔμενον φυλάσσοντες
  choice: несли стражу
  rationale: Сочетание передаёт продолжительное пребывание в охране. Русское «нести стражу» естественно выражает длительное военное дежурство, хотя отдельное значение «оставались» передано не буквально.
- source_word: ὅλην τὴν νύκτα ἐκείνην
  choice: всю ту ночь
  rationale: Сохранены полнота продолжительности и указательное значение ἐκείνην.
