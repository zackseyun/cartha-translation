  yaml_path: translation/deuterocanon/judith/003/003.yaml
  text: Look[a], our homesteads and every field of wheat and the flocks and the herds and all the enclosures of our tents lie before you[b]; use them as pleases you.
translation:
  language: ru
  text: Вот наши усадьбы[a], все пшеничные поля, мелкий и крупный скот и все ограды при наших шатрах[b] — всё это перед тобой; распоряжайся этим, как тебе угодно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хозяйства». Греческое слово обозначает сельские владения или обжитые места в земледельческой местности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «все ограды наших шатров». Вероятно, имеются в виду огороженные участки при стоянках или загоны для скота.'
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Естественное современное указательное слово, сохраняющее функцию привлечения внимания без архаического оттенка.
- source_word: ἐπαύλεις
  choice: усадьбы
  rationale: Передаёт сельские владения или обжитые хозяйства в аграрном контексте; значение шире, чем просто «дома».
- source_word: πᾶν πεδίον πυρῶν
  choice: все пшеничные поля
  rationale: Естественно передаёт всю совокупность земель, засеянных пшеницей; русское множественное число здесь идиоматичнее буквального «всякое поле пшеницы».
- source_word: τὰ ποίμνια καὶ τὰ βουκόλια
  choice: мелкий и крупный скот
  rationale: Контекстуально различает стада овец или коз и стада крупного рогатого скота, избегая неестественного повтора слова «стада».
- source_word: πᾶσαι αἱ μάνδραι τῶν σκηνῶν ἡμῶν
  choice: все ограды при наших шатрах
  rationale: Сохраняет общее значение огороженных мест и связь с шатрами, не уточняя без достаточных оснований, были ли это загоны для скота или границы стоянки.
- source_word: παράκεινται πρὸ προσώπου σου
  choice: всё это перед тобой
  rationale: Передаёт пространственный образ и подразумеваемую доступность перечисленного адресату; «всё это» естественно согласует разнородный перечень в русском предложении.
- source_word: χρῆσαι καθʼ ὃ ἂν ἀρέσκῃ σοι
  choice: распоряжайся этим, как тебе угодно
  rationale: В данном контексте речь не только о буквальном использовании, но о предоставлении имущества в распоряжение; заключительная формула сохраняет свободу решения адресата.
