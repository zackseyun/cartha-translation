  text: And he and his force went down to the coast[a], and he garrisoned the high cities, and they took chosen men from them into alliance.
translation:
  language: ru
  text: И он вместе со своим войском спустился на побережье и поставил гарнизоны в городах, расположенных на возвышенностях; а из их жителей они взяли отборных мужчин в союзники.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте сказано «они взяли», хотя перед этим стоят глаголы в единственном числе: «он спустился» и «поставил гарнизоны». Множественное число, вероятно, относится к войску, действовавшему под его командованием; в некоторых переводах здесь стоит «он взял».'
    reason: alternative_reading
lexical_decisions:
- source_word: κατέβη
  choice: спустился
  rationale: Сохраняет направительное значение καταβαίνω без добавления невыраженного военного оттенка.
- source_word: παραλίαν
  choice: к побережью
  rationale: παραλία обозначает морское побережье или прибрежную область; «побережье» естественно в современном русском.
- source_word: δύναμις
  choice: войско
  rationale: В данном военном контексте δύναμις означает вооружённые силы; «войско» ясно и естественно.
- source_word: ἐφρούρησε
  choice: поставил гарнизоны
  rationale: При городах в качестве объекта глагол передаёт установление военной охраны и контроля; это точнее контекстуального простого «охранял».
- source_word: πόλεις τὰς ὑψηλάς
  choice: города, расположенные на возвышенностях
  rationale: Передаёт буквальный топографический смысл ὑψηλάς и не подменяет его понятием укреплённости.
- source_word: ἔλαβον
  choice: они взяли
  rationale: Сохраняет множественное число греческой формы, несмотря на предшествующие глаголы в единственном числе.
- source_word: ἄνδρας ἐπιλέκτους
  choice: отборных мужчин
  rationale: Передаёт как значение отбора у ἐπιλέκτους, так и мужскую референцию ἄνδρας.
- source_word: ἐξ αὐτῶν
  choice: из их жителей
  rationale: В русском буквальное «из них» могло бы ошибочно указывать на города как предметы; контекстуальная экспликация сохраняет смысл выбора людей из этих городов.
- source_word: εἰς συμμαχίαν
  choice: в союзники
  rationale: Идиоматически передаёт включение выбранных мужчин в союзную военную поддержку, не устраняя направительный смысл εἰς.
