  yaml_path: translation/deuterocanon/judith/003/010.yaml
  text: And they encamped between Gaibai and the city of the Scythians[a], and he was there for a full month[c][b], to gather all the full complement of his forces.
translation:
  language: ru
  text: И они расположились лагерем между Гайбаем и городом скифов[a]. Он пробыл там месяц[b], чтобы собрать всё необходимое для полного укомплектования своего войска[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Скифополем»; буквально по-гречески: «городом скифов».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально по-гречески: «месяц дней» — идиоматическое выражение со значением «месяц».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «весь полный состав» или «всё снаряжение» своего войска; греческое слово может обозначать полноту состава, полную военную оснащённость или готовность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεστρατοπέδευσαν
  choice: расположились лагерем
  rationale: Глагол обозначает устройство военного лагеря; этот оборот естественен по-русски и сохраняет военный смысл.
- source_word: ἀνὰ μέσον
  choice: между
  rationale: Перед двумя географическими названиями это естественная передача пространственного значения.
- source_word: Γαιβαὶ
  choice: Гайбаем
  rationale: Название передано транслитерацией греческой формы без отождествления с иным топонимом.
- source_word: Σκυθῶν πόλεως
  choice: городом скифов
  rationale: Сохраняет прозрачное значение греческого сочетания; традиционное название «Скифополь» дано в примечании.
- source_word: ἦν ἐκεῖ
  choice: Он пробыл там
  rationale: Единственное число указывает на военачальника, тогда как предыдущее действие выражено во множественном числе. «Пробыл» естественно передаёт длительность пребывания.
- source_word: μῆνα ἡμερῶν
  choice: месяц
  rationale: Буквально «месяц дней» — семитизированный идиоматический оборот, который в современном русском естественно передаётся словом «месяц»; буквальная форма отмечена в сноске.
- source_word: συλλέξαι
  choice: собрать
  rationale: Инфинитив выражает цель и в военном контексте означает сосредоточение войск и ресурсов.
- source_word: ἀπαρτίαν
  choice: все силы
  rationale: В контексте слово обозначает полноту состава или полную боевую готовность; краткая русская формулировка сохраняет широту значения, а варианты уточнены в сноске.
- source_word: δυνάμεως αὐτοῦ
  choice: своего войска
  rationale: Здесь δύναμις имеет конкретное военное значение, а не означает отвлечённую силу или могущество.
