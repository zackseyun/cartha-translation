base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/004.yaml
  text: Look[a], our cities also, and those who live in them, are your servants; come and deal with them as is good in your eyes.
translation:
  language: ru
  text: 'Вот: и наши города, и их жители — твои рабы[a]. Приди и поступи с ними, как тебе угодно.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуги». Здесь греческое слово, вероятно, подчёркивает полное подчинение завоевателю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: Вот
  rationale: Передаёт указательно-эмфатическую функцию греческого слова естественным для современного русского языка способом.
- source_word: πόλεις
  choice: города
  rationale: Прямое соответствие обычному значению существительного; в данном контексте речь идёт о городских поселениях.
- source_word: οἱ κατοικοῦντες ἐν αὐταῖς
  choice: их жители
  rationale: Кратко и естественно передаёт субстантивированное причастие со значением людей, живущих в этих городах.
- source_word: δοῦλοί
  choice: рабы
  rationale: В контексте безоговорочной сдачи завоевателю слово обозначает полное подчинение; «слуги» могло бы неоправданно смягчить смысл.
- source_word: ἐλθὼν
  choice: приди
  rationale: Аористное причастие вместе с последующим повелительным глаголом естественно передаётся в русском как первое из двух согласованных побуждений.
- source_word: ἀπάντησον
  choice: поступи с ними
  rationale: Буквальное «встреть» здесь не вполне ясно по-русски. В контексте добровольной сдачи выражение означает прийти к городам и распорядиться их участью, не уточняя характера действий.
- source_word: ὡς ἔστιν ἀγαθὸν ἐν ὀφθαλμοῖς σου
  choice: так, как сочтёшь нужным
  rationale: Естественно передаёт семитизированную греческую идиому «как хорошо в твоих глазах», то есть согласно собственному решению адресата.
theological_decisions:
- issue: Значение δοῦλοι в контексте политического подчинения
  choice: рабы
  alternative: слуги
  rationale: Жители предлагают полную покорность завоевателю. «Рабы» сохраняет жёсткость и принудительно-правовой оттенок положения, тогда как «слуги» может звучать как добровольная служба.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Начальное «Вот» сохраняет эмфатическое предъявление; греческая идиома о том, что хорошо «в твоих глазах», передана естественным русским оборотом без изменения смысла.
