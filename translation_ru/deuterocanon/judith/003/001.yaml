- source_word: ἀπέστειλαν
  choice: послали
  rationale: Аорист действительного залога от ἀποστέλλω прямо обозначает отправление; «послали» естественно для современного русского повествования.
- source_word: ἀγγέλους
  choice: вестников
  rationale: В данном повествовательном контексте речь идёт о людях-посланцах, а не о небесных существах. «Вестники» сохраняет широкое значение слова, не сужая его до официальных дипломатов.
- source_word: πρὸς αὐτόν
  choice: к нему
  rationale: При глаголе отправления πρὸς с винительным падежом указывает адресата или направление; по-русски естественно «к нему».
- source_word: λόγοις εἰρηνικοῖς
  choice: с мирными словами
  rationale: Передаёт как существительное λόγοις («словами»), так и определение εἰρηνικοῖς («мирными»), сохраняя возможный смысл примирительной речи или мирного предложения.
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие вводит содержание последующей речи; деепричастие «говоря» формально и ясно воспроизводит эту связь.
