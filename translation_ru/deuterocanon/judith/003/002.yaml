lexical_decisions:
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Современное русское «вот» естественно передаёт указательно-привлекающую внимание силу греческой частицы без архаического оттенка слова «се».
- source_word: παῖδες
  choice: слуги
  rationale: В придворном обращении слово обозначает подчинённых царя и выражает почтительность; «слуги» передаёт этот смысл, не вводя значения возраста («дети, юноши») и не утверждая прямо рабский статус.
- source_word: Ναβουχοδονοσὸρ
  choice: Набуходоносора
  rationale: Использована укоренившаяся в русской библейской традиции форма имени, соответствующая данному греческому имени и легко узнаваемая современным читателем.
- source_word: βασιλέως μεγάλου
  choice: великого царя
  rationale: Сохранён почётный титульный характер определения μεγάλου; русский порядок слов звучит естественно.
- source_word: παρακείμεθα
  choice: лежим перед тобой
  rationale: Передаётся конкретный образ положения перед военачальником и полной покорности, заложенный в глаголе; возможный переносный смысл разъяснён в примечании.
- source_word: χρῆσαι ἡμῖν
  choice: поступи с нами
  rationale: В этом контексте оборот означает просьбу распорядиться ими по своей воле. «Поступи с нами» естественнее по-русски, чем буквальное «используй нас», и не сужает смысл.
- source_word: καθὼς ἀρεστόν ἐστιν τῷ προσώπῳ σου
  choice: как тебе угодно
  rationale: Это естественная русская передача греческого идиоматического выражения, буквально говорящего о том, что приятно «твоему лицу» или «перед твоим лицом».
