lexical_decisions:
- source_word: κατὰ πρόσωπον
  choice: к Ездрелону
  rationale: При глаголе движения оборот обозначает прибытие к месту, буквально к его «лицу» или передней стороне. В основном тексте выбран естественный русский пространственный оборот, а неоднозначность отражена в сноске.
- source_word: Ἐσδρηλών
  choice: Ездрелон
  rationale: Передаёт греческую форму топонима транслитерацией, не заменяя её гармонизированным названием Изреель.
- source_word: πλησίον
  choice: близ
  rationale: Кратко и естественно передаёт пространственную близость, сохраняя достоинство повествовательного регистра.
- source_word: Δοταίας
  choice: Дотаия
  rationale: Транслитерация греческой формы топонима без отождествления её в основном тексте с более известным Дофаном.
- source_word: ἀπέναντι
  choice: напротив
  rationale: 'Прямо передаёт взаимное расположение объектов: один находится перед или напротив другого.'
- source_word: πρίονος
  choice: хребта
  rationale: Буквально слово означает «пила», но в топографическом контексте, вероятно, метафорически обозначает зубчатый горный хребет; буквальный образ сохранён в сноске.
- source_word: τῆς Ἰουδαίας
  choice: Иудеи
  rationale: Общепринятая русская форма географического названия Ἰουδαία.
