lexical_decisions:
- source_word: παρεγένοντο
  choice: пришли
  rationale: Глагол обозначает прибытие или появление; в данном повествовательном контексте естественное «пришли» точно передаёт движение к Олоферну.
- source_word: οἱ ἄνδρες
  choice: эти мужчины
  rationale: Определённая форма указывает на уже упомянутых мужчин, посланных городом; «эти мужчины» ясно сохраняет отсылку и явно мужское значение.
- source_word: ἀπήγγειλαν
  choice: передали
  rationale: Глагол означает сообщить или передать весть. «Передали» естественно звучит в контексте посланников и допускает точное воспроизведение порученной речи.
- source_word: κατὰ τὰ ῥήματα ταῦτα
  choice: всё слово в слово
  rationale: Оборот буквально означает «согласно этим словам» и указывает на соответствие только что приведённой речи; русское «всё слово в слово» естественно передаёт эту связь, не ослабляя словесного соответствия.
