  source_fidelity: 'Первое предложение в черновике существенно отходит от греческого текста: τὰ ὅρια означает «границы, рубежи; межевые знаки», а не «святилища». Культовая интерпретация не имеет достаточного основания, чтобы заменять ею основной текст. Остальные части в целом передают оригинал; «называли его богом» точнее передаёт ἐπικαλέσωνται αὐτὸν εἰς θεόν, чем «призывали его как бога».'
  naturalness: Исправленный вариант сохраняет современный литературный, повествовательный регистр. «Рубежи» в сочетании с «разрушил» несколько образно, но естественно в военном контексте; сноска даёт буквальный и альтернативный конкретный смысл.
  terminology: «Священные рощи» точно передаёт ἄλση. «Богов земли» сохраняет присущую γῆ широту («земли/страны») без неоправданного уточнения «этой». «Ему было поручено» уместно передаёт безличный пассив ἦν δεδομένον αὐτῷ, не называя субъекта. Имя «Навуходоносор» передано в принятой русской форме.
