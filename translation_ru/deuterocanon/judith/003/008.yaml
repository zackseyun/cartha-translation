base_translation:
  language: en
  yaml_path: translation/deuterocanon/judith/003/008.yaml
  text: And he tore down all their borders and cut down their sacred groves; and it had been granted to him to destroy all the gods of the land, so that all the nations might worship him alone—Nebuchadnezzar—and that all their tongues and all their tribes might call on him as god.
translation:
  language: ru
  text: И он разрушил все их рубежи[a] и вырубил их священные рощи. Ему было поручено истребить всех богов земли, чтобы все народы поклонялись ему одному — Навуходоносору, — и чтобы все языки и все их племена называли его богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все их границы»; возможно, «все их межевые знаки». Значение слова в данном контексте обсуждается, но оно не означает прямо «святилища».'
    reason: Сноска отмечает диапазон значений ὅρια, сохраняя в основном тексте его обычный смысл и не навязывая спорную культовую интерпретацию.
lexical_decisions:
- source_word: ὅρια
  choice: святилища
  rationale: В данном контексте уничтожения местных культов слово, буквально означающее «границы, межевые знаки», вероятно, обозначает культовые сооружения или объекты; «святилища» естественно передаёт контекстуальный смысл, не сводя действие к изменению государственных границ.
- source_word: ἄλση
  choice: священные рощи
  rationale: Ἄλσος обозначает рощу, связанную с языческим культом; уточнение «священные» необходимо для современного читателя и соответствует контексту.
- source_word: ἦν δεδομένον αὐτῷ
  choice: ему было поручено
  rationale: Греческая безлично-пассивная конструкция буквально означает «ему было дано»; в контексте приказа Навуходоносора Олоферну естественный русский эквивалент — «было поручено».
- source_word: θεοὺς τῆς γῆς
  choice: богов этой земли
  rationale: Γῆ здесь естественно относится к покоряемой стране или территории; «этой земли» сохраняет локальный смысл.
- source_word: γλῶσσαι
  choice: языки
  rationale: Сохранён буквальный образ речи и языковых общностей, хотя в сочетании с племенами возможно понимание как «народы разных языков».
- source_word: ἐπικαλέσωνται αὐτὸν εἰς θεόν
  choice: призывали его как бога
  rationale: Передаёт культовое признание и обращение к Навуходоносору в качестве божества, не усиливая выражение до формального провозглашения.
theological_decisions:
- issue: Кому должны поклоняться народы
  choice: одному лишь Навуходоносору
  alternative: лишь ему — Навуходоносору
  rationale: Греческое αὐτῷ μόνῳ τῷ Ναβουχοδονοσόρ недвусмысленно отождествляет местоимение с Навуходоносором; русский порядок слов устраняет случайную двусмысленность, не меняя содержания.
- issue: Источник поручения
  choice: пассивная формулировка без названного субъекта
  alternative: Навуходоносор поручил ему
  rationale: Текст не называет действующего субъекта конструкции δεδομένον; пассив сохраняет формальную открытость, хотя ближайший контекст позволяет подразумевать царя.
- issue: Статус Навуходоносора как бога
  choice: как бога
  alternative: богом
  rationale: Оборот сохраняет представление о требуемом культовом признании, не утверждая действительной божественности Навуходоносора.
