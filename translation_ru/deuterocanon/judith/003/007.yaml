lexical_decisions:
- source_word: ἐδέξαντο
  choice: встретили
  rationale: В данном контексте δέχομαι обозначает торжественный приём; «встретили» естественно передаёт смысл приветственного приёма по-русски.
- source_word: αὐτὸν
  choice: его
  rationale: Прямое дополнение, в контексте относящееся к Олоферну.
- source_word: αὐτοὶ
  choice: они сами
  rationale: Сохраняет выраженное самостоятельным местоимением смысловое ударение.
- source_word: πᾶσα ἡ περίχωρος αὐτῶν
  choice: вся их округа
  rationale: Передаёт всю прилегающую местность как совокупность её жителей и сохраняет притяжательное αὐτῶν; такая метонимия естественна в современном русском языке.
- source_word: μετὰ στεφάνων
  choice: с венками
  rationale: В праздничной сцене στέφανοι — скорее торжественные венки, а не царские короны.
- source_word: χορῶν
  choice: плясками
  rationale: χорοί здесь обозначает праздничные танцы или хороводы; «пляски» естественно сочетаются с венками и бубнами и сохраняют публично-праздничный колорит.
- source_word: τυμπάνων
  choice: бубнами
  rationale: τύμπανα — ручные ударные инструменты, близкие к бубнам; это традиционное и понятное русское обозначение в библейском контексте.
