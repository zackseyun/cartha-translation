lexical_decisions:
- source_word: ἐπικρατεῖ
  choice: берёт верх над
  rationale: Глагол означает одерживать верх, получать превосходство или власть над чем-либо. Русское выражение естественно передаёт сильную мысль контекста о господстве разума, не превращая её в безусловное подавление чувства.
- source_word: τῆς πρὸς γαμετὴν φιλίας
  choice: над привязанностью к жене
  rationale: γαμετή обозначает жену, а φιλία — любовь, дружеское расположение или сердечную привязанность. «Привязанность к жене» сохраняет оттенок близкого супружеского чувства без навязывания современного романтического смысла.
- source_word: διὰ παρανομίαν
  choice: за беззаконие
  rationale: παρανομία — нарушение закона, противозаконный поступок, беззаконие. При глаголе обличения русское «за беззаконие» естественно выражает причину порицания и сохраняет нравственно-правовую силу слова.
- source_word: ἀπελέγχων
  choice: обличая
  rationale: Причастие обозначает изобличение или порицание проступка. «Обличая» сохраняет нравственную серьёзность и связь с выявлением вины.
- source_word: αὐτήν
  choice: её
  rationale: Местоимение женского рода естественно относится к ранее названной жене; буквальная местоименная связь сохранена.
theological_decisions:
- issue: Господство разума над супружеской привязанностью
  choice: Разум берёт верх даже над привязанностью к жене, когда требуется обличить её беззаконие.
  alternative: Разум лишь сдерживает супружеское чувство или управляет им.
  rationale: ἐπικρατεῖ выражает достижение превосходства, а общий ход рассуждения книги подчёркивает власть разума над чувствами. При этом перевод не предполагает отказа от супружеской любви, а говорит о её неподчинении беззаконию.
- issue: Отнесение αὐτήν
  choice: Местоимение «её» относится к жене.
  alternative: Теоретически форму можно было бы связать с φιλία («привязанность»), но смысл «обличая привязанность за беззаконие» синтаксически и содержательно менее вероятен.
  rationale: Ближайшее семантически подходящее лицо — γαμετήν, жена, которую обличают из-за нарушения закона. Перевод сохраняет наиболее естественную референцию, не добавляя имени субъекта.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим философско-нравственному рассуждению. Сохранены продолжение синтаксической цепи посредством начального «и» и точка с запятой исходного фрагмента. Субъект не добавлен, поскольку в данном стихе он выражен контекстом.
