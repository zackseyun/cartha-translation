  yaml_path: translation/deuterocanon/4_maccabees/002/008.yaml
  text: Therefore[a], even if someone is money-loving, by living under the law he compels his own way of life, lending to those in need without interest, and when the seventh year arrives[b], canceling the debt.
translation:
  language: ru
  text: 'Итак, живущий по закону, даже если он сребролюбив, заставляет себя поступать вопреки собственному нраву: даёт нуждающимся взаймы без процентов, а с наступлением седьмого года[a] прощает долг[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда наступают седмины (семёрки)»; это отсылка к установленному законом семилетнему циклу освобождения от долгов.'
    reason: cross_reference
  - marker: b
    text: 'Или: «терпит убыток по ссуде». Греческое слово может подчёркивать финансовую потерю, которую заимодавец принимает, прощая долг.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτίκα γοῦν
  choice: Так
  rationale: Сочетание вводит непосредственный вывод или наглядный пример из предшествующего рассуждения; краткое «Так» естественно передаёт эту связь по-русски.
- source_word: τῷ νόμῳ πολιτευόμενος
  choice: живущий по закону
  rationale: πολιτεύομαι обозначает образ жизни и поведения, а дательный τῷ νόμῳ — норму, которой человек руководствуется.
- source_word: φιλάργυρός
  choice: сребролюбив
  rationale: Слово прямо обозначает любовь к деньгам; «сребролюбив» сохраняет этот образ и остаётся понятным в библейском литературном регистре.
- source_word: βιάζεται τὸν ἑαυτοῦ τρόπον
  choice: заставляет себя поступать вопреки собственному нраву
  rationale: Буквально речь о принуждении собственного нрава или привычного образа действий. Русская формулировка естественно выражает внутреннее самоограничение, не ослабляя силы βιάζεται.
- source_word: τοῖς δεομένοις
  choice: нуждающимся
  rationale: В контексте беспроцентного займа причастие обозначает людей, испытывающих нужду.
- source_word: δανείζων χωρὶς τόκων
  choice: даёт ... взаймы без процентов
  rationale: Передаёт обычный смысл τόκος как процентов по займу без архаичного и более узкого термина «лихва».
- source_word: τῶν ἑβδομάδων ἐνστασῶν
  choice: с наступлением семилетия
  rationale: Буквально множественное «семёрки» или «седмины» отсылает в данном законодательном контексте к семилетнему циклу освобождения от долгов; сноска сохраняет формальную особенность греческого выражения.
- source_word: τὸ δάνειον ... χρεοκοπούμενος
  choice: прощает долг
  rationale: В контексте закона об освобождении от долгов выражение означает отказ от взыскания выданной ссуды. Возможный акцент на понесённом заимодавцем убытке отмечен в сноске.
theological_decisions:
- issue: Отсылка к закону об освобождении от долгов по завершении семилетнего цикла
  choice: Основной текст прямо говорит о наступлении семилетия и прощении долга.
  alternative: 'Более буквально: «когда наступают седмины, терпит убыток по ссуде».'
  rationale: Греческое выражение сжато и допускает акцент либо на юридическом прощении долга, либо на финансовой потере заимодавца. Контекст беспроцентного займа и семилетнего цикла поддерживает основную передачу, а сноски сохраняют неоднозначность формы и смыслового оттенка.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. «Сребролюбив» сохраняет прозрачную лексику религиозно-нравственного рассуждения; остальная фраза построена естественно и доступно. Двоеточие раскрывает, каким образом человек идёт против собственного нрава.
