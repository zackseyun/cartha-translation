  yaml_path: translation/deuterocanon/4_maccabees/002/007.yaml
  text: For how is a man who is by habit eating only one kind of food[a], and is a glutton and a drunkard, retrained, if it is not clear that reason is master of the passions?
translation:
  language: ru
  text: Ведь как переучивается человек, по своему складу питающийся лишь одним видом пищи[a], обжора и пьяница, если не очевидно, что разум господствует над страстями?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Редкое греческое слово можно также понять как «человек, привередливый в еде» или «тот, кто предпочитает особые блюда».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: Ведь
  rationale: Вводит поясняющий риторический вопрос и естественно связывает его с предыдущим рассуждением.
- source_word: τίνα τρόπον
  choice: каким образом
  rationale: Точно передаёт вопрос о способе изменения поведения.
- source_word: μονοφάγος
  choice: питающийся лишь одним видом пищи
  rationale: Сохраняет наиболее прямой составной смысл редкого слова, не устраняя его лексическую неоднозначность; возможное значение привередливости пояснено в сноске.
- source_word: τὸ ἦθος
  choice: по своему нраву
  rationale: Передаёт устойчивую черту характера или привычный уклад, а не разовое действие.
- source_word: γαστρίμαργος
  choice: обжора
  rationale: Современное и ясное обозначение человека, предающегося чрезмерному насыщению.
- source_word: μέθυσος
  choice: пьяница
  rationale: Обозначает устойчивую склонность к пьянству, а не временное опьянение.
- source_word: μεταπαιδεύεται
  choice: приучается к иному
  rationale: Передаёт идею переобучения и изменения сложившегося поведения без чрезмерно морализирующего оттенка.
- source_word: δῆλον
  choice: очевидно
  rationale: Естественно выражает явность вывода в риторическом вопросе.
- source_word: κύριός
  choice: властвует
  rationale: В данном философском контексте означает господство и контроль, а не божественный титул.
- source_word: παθῶν
  choice: страстями
  rationale: Сохраняет философско-нравственный смысл внутренних влечений и аффектов.
- source_word: ὁ λογισμός
  choice: разум
  rationale: Передаёт ключевое для книги понятие разумной способности, управляющей страстями.
theological_decisions:
- issue: Значение κύριος в небожественном философском контексте
  choice: властвует
  alternative: является господином / повелителем
  rationale: Здесь говорится о власти разума над страстями, а не употребляется титул Бога; глагольная передача естественна по-русски и сохраняет отношение господства.
- issue: Родовая форма τις ὢν
  choice: человек
  alternative: мужчина
  rationale: Греческий пример имеет грамматически мужскую форму, но не акцентирует пол; русское «человек» сохраняет единственное число и обобщающий характер без добавления невыраженного смыслового акцента.
translation_notes:
  register: Современный литературный русский язык с достоинством философского рассуждения. Риторический вопрос и противопоставление разума страстям сохранены; редкость и неоднозначность μονοφάγος не скрыты.
