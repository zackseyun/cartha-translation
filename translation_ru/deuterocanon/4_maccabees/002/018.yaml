  terminology: «Разум», «страсти», «одержать верх», «направить в иное русло» и «лишить силы» уместно передают философскую лексику и не привносят конфессионального толкования. «Лишить силы» хорошо передаёт ἀκυρῶσαι как сделать недейственным, а не уничтожить.
