  yaml_path: translation/deuterocanon/4_maccabees/002/018.yaml
  text: For, as I said, prudent reason is able to triumph over the passions, and to redirect some of them, and even to nullify others.
translation:
  language: ru
  text: 'Ведь, как я уже говорил, рассудительный разум способен одержать верх над страстями: одни из них он может направить в иное русло, а другие — даже лишить силы.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σώφρων
  choice: благоразумный
  rationale: Передаёт здравое, дисциплинированное нравственное суждение; в сочетании с νοῦς звучит естественнее, чем узкое «воздержанный».
- source_word: νοῦς
  choice: разум
  rationale: В контексте 4 Маккавейской это разумная способность, управляющая страстями, а не просто нейтральный «ум».
- source_word: κατὰ τῶν παθῶν
  choice: над страстями
  rationale: Показывает превосходство и власть разума; πάθη здесь означает страсти и побуждения, а не страдания.
- source_word: ἀριστεῦσαι
  choice: одержать верх
  rationale: Естественно выражает значение превосходства или победы в сочетании с κατὰ τῶν παθῶν, не усиливая образ до полного уничтожения страстей.
- source_word: μεταθεῖναι
  choice: направить в иное русло
  rationale: Сохраняет идею изменения направления или состояния некоторых страстей и ясно противопоставляется более решительному ἀκυρῶσαι.
- source_word: ἀκυρῶσαι
  choice: лишить силы
  rationale: Передаёт значение «сделать недействующим, бессильным» без юридического оттенка русского «аннулировать» и без чрезмерного «уничтожить».
- source_word: τὰ μὲν αὐτῶν ... τὰ δὲ καί
  choice: одни из них ... а другие — даже
  rationale: Сохраняет соотносительную конструкцию и усиление καί во второй части.
theological_decisions:
- issue: Антропологическое соотношение νοῦς и πάθη
  choice: Передать мысль как способность благоразумного разума властвовать над страстями, изменяя одни и лишая силы другие.
  alternative: Перевести νοῦς как «ум», а πάθη как «эмоции».
  rationale: Так сохраняется эллинистическо-иудейская философская рамка текста без привнесения позднейших конфессиональных схем и без сведения πάθη ко всем эмоциям вообще.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Конструкция «благоразумный разум» намеренно сохраняет различие между качеством σώφρων и способностью νοῦς, хотя допускает лёгкую корневую близость; «направить в иное русло» и «лишить силы» образуют понятный смысловой контраст.
