  rationale: Выражает отношение к указанной сфере, не приписывая предлогу излишне конкретной направленности.
- source_word: τοῦ κάλλους
  choice: красоте
  rationale: Прямо сохраняет абстрактное значение κάλλος и не сужает его до нравственного благородства.
- source_word: μετουσίαν
  choice: причастности
  rationale: Передаёт участие или приобщённость и сохраняет возвышенный философский регистр исходной фразы.
