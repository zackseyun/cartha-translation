  text: How then, someone might say, if reason rules over the passions, does it not also rule over forgetfulness and ignorance?
translation:
  language: ru
  text: «Как же тогда, — мог бы сказать кто-нибудь, — если разум господствует над страстями, не господствует он над забывчивостью и неведением?»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πῶς οὖν
  choice: Как же тогда
  rationale: Передаёт переход к риторическому возражению и сохраняет естественный ход русской аргументативной речи.
- source_word: εἴποι τις ἄν
  choice: мог бы кто-нибудь сказать
  rationale: Потенциальный оптатив с ἄν обозначает слова предполагаемого собеседника; условная формулировка сохраняет гипотетический характер.
- source_word: τῶν παθῶν
  choice: над страстями
  rationale: В философско-нравственном рассуждении 4 Маккавейской πάθη — влечения и аффекты, подлежащие власти разума; «страсти» сохраняет ключевую терминологию книги.
- source_word: ὁ λογισμὸς
  choice: разум
  rationale: Здесь λογισμός обозначает способность рационального суждения; «разум» кратко и естественно передаёт это понятие по-русски.
- source_word: κρατεῖ
  choice: господствует над
  rationale: Глагол выражает власть и контроль; повтор одного русского соответствия сохраняет риторическую структуру греческой фразы.
- source_word: λήθης
  choice: забывчивостью
  rationale: λήθη означает забвение или забывание; в данном перечислении «забывчивость» естественно обозначает неспособность удерживать в памяти.
- source_word: ἀγνοίας
  choice: неведением
  rationale: ἀγνοία означает незнание; «неведение» поддерживает достойный философский регистр и хорошо сочетается с «забывчивостью».
theological_decisions:
- issue: Антропологический и философский смысл πάθη и λογισμός
  choice: Передать πάθη как «страсти», а λογισμός как «разум»
  alternative: «чувства» / «разумное суждение»
  rationale: Выбранные слова сохраняют центральное для 4 Маккавейской противопоставление разума и страстей, не сводя πάθη ко всем чувствам и не перегружая λογισμός технической формулировкой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным философским регистром. Вводное возражение выделено парными тире; повтор «господствует» воспроизводит лексическую и логическую симметрию оригинала.
