lexical_decisions:
- source_word: τηνικαῦτα
  choice: тогда
  rationale: Кратко и естественно передаёт временное указание и последовательность рассуждения.
- source_word: περὶ πάντων
  choice: над всем
  rationale: В сочетании с образом возведения на престол выражает власть и руководство, а не просто отношение ко всему.
- source_word: τὸν ἱερὸν ἡγεμόνα νοῦν
  choice: священный разум-владыку
  rationale: «Разум» передаёт νοῦς как нравственно-рациональную способность, а «владыка» сохраняет значение ἡγεμών и согласуется с царским образом престола. «Священный» удерживает возвышенный религиозно-нравственный оттенок ἱερός.
- source_word: διὰ τῶν αἰσθητηρίων
  choice: посредством органов чувств
  rationale: Передаёт инструментальное значение διά и конкретный смысл αἰσθητήρια как органов или способностей чувственного восприятия.
- source_word: ἐνεθρόνισεν
  choice: возвёл на престол
  rationale: Сохраняет яркую метафору установления разумной способности во властном положении и звучит естественнее буквального «воцарил» с прямым дополнением.
theological_decisions:
- issue: Значение νοῦς как нравственно-рациональной управляющей способности
  choice: разум
  alternative: ум
  rationale: В контексте 4 Маккавейской книги речь идёт не только об интеллекте, но о способности разумно управлять страстями. «Разум» лучше сохраняет этот философско-нравственный смысл, не устраняя антропологической напряжённости текста.
- issue: Неявный субъект ἐνεθρόνισεν
  choice: он
  alternative: Он
  rationale: Греческий глагол содержит невыраженный субъект. Строчная буква не вносит в сам стих дополнительного толкования относительно его референта и позволяет контексту определить его.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной царской метафоры оригинала. Необычное, но ясное сочетание «разум-владыка» намеренно передаёт образ управляющей разумной способности.
