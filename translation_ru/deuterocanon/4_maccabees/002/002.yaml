lexical_decisions:
- source_word: ταύτῃ γοῦν
  choice: Поэтому
  rationale: Сочетание имеет выводное значение и связывает пример Иосифа с предшествующим рассуждением.
- source_word: ὁ σώφρων
  choice: благоразумный
  rationale: Слово обозначает рассудительность и владение собой; «благоразумный» естественно для литературного русского и не сводит значение только к воздержанию.
- source_word: Ἰωσὴφ
  choice: Иосиф
  rationale: Традиционная русская форма библейского имени.
- source_word: ἐπαινεῖται
  choice: удостаивается похвалы
  rationale: Передаёт настоящее страдательного залога естественным и достойным русским выражением.
- source_word: τῷ λογισμῷ διανοίᾳ
  choice: разумом — силой мысли
  rationale: В данном свидетеле сочетание синтаксически неровное. Перевод сохраняет оба близких понятия, не устраняя текстовую шероховатость молча.
- source_word: περιεκράτησεν
  choice: одолел
  rationale: Глагол выражает достижение господства или превосходства над чем-либо; «одолел» хорошо передаёт активное нравственное преодоление.
- source_word: τῆς ἡδυπαθείας
  choice: страсть к наслаждению
  rationale: ἡδυπάθεια означает влечение к удовольствию или преданность наслаждениям; выбранный вариант сохраняет нравственно-психологический оттенок и естественен по-русски.
theological_decisions:
- issue: Разумное господство над страстью в этической аргументации 4 Маккавейской
  choice: 'Сохранить лексику разума и преодоления страсти: «разумом — силой мысли… одолел».'
  alternative: «рассуждением овладел стремлением к удовольствию»
  rationale: Формулировка передаёт центральное для книги напряжение между разумной способностью и страстью, не привнося позднейших конфессиональных категорий.
