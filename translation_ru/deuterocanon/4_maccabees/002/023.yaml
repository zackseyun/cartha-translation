  yaml_path: translation/deuterocanon/4_maccabees/002/023.yaml
  text: And to him he gave a law[a], according to which, by conducting himself as a citizen[b], he would rule a kingdom that was self-controlled and just and good and courageous.
translation:
  language: ru
  text: И дал ему закон, согласно которому тот, живя гражданской жизнью[a], мог бы править царством[b], отличающимся самообладанием, справедливостью, добротой и мужеством.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живя как гражданин». Греческое причастие сохраняет общественно-политический смысл жизни гражданина.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «царской властью» или «правлением»; греческое слово может обозначать как царство, так и само осуществление царской власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτῳ
  choice: ему
  rationale: Дательный падеж указывает на ранее названного получателя закона; русское «ему» естественно сочетается с «дал».
- source_word: νόμον
  choice: закон
  rationale: Передаёт данное правителю обязательное установление или руководящее правило без неоправданного уточнения.
- source_word: καθʼ ὃν
  choice: сообразуясь с которым
  rationale: Сохраняет связь между законом и образом жизни, выраженную относительной конструкцией.
- source_word: πολιτευόμενος
  choice: в своей гражданской жизни
  rationale: Передаёт общественно-политический смысл πολιτεύομαι — жить и вести себя как член гражданского сообщества; не сводит значение лишь к управлению государством.
- source_word: βασιλεύσειε
  choice: мог бы править
  rationale: Оптатив выражает предполагаемый или намеченный результат после глагола прошедшего времени; «мог бы» сохраняет модальность.
- source_word: βασιλείαν
  choice: царством
  rationale: В контексте управления это естественный прямой объект глагола «править», хотя греческое слово допускает также значение царской власти или правления.
- source_word: σώφρονά
  choice: владеющим собой
  rationale: Передаёт этическую идею самообладания и умеренности, центральную для 4 Маккавеев, сохраняя олицетворённую характеристику царства.
- source_word: δικαίαν
  choice: справедливым
  rationale: В общественно-политическом контексте речь идёт прежде всего о справедливом характере царства или правления.
- source_word: ἀγαθήν
  choice: добрым
  rationale: Прямо передаёт широкое положительное значение прилагательного, не сужая его до благотворительности или знатности.
- source_word: ἀνδρείαν
  choice: мужественным
  rationale: Сохраняет значение нравственной доблести и стойкой отваги без излишнего акцента на буквальной гендерной окраске.
theological_decisions:
- issue: Гражданский смысл πολιτευόμενος в связи с царской властью
  choice: 'Сохранить гражданско-общественный оттенок: «в своей гражданской жизни»'
  alternative: «живя по закону»; «управляя собой»; «управляя государством»
  rationale: Текст представляет правителя как подчинённого закону и сохраняет напряжение между положением царя и его жизнью как участника гражданского сообщества.
- issue: Значение δικαίαν в перечне политических добродетелей
  choice: «справедливым»
  alternative: «праведным»
  rationale: Здесь прилагательное характеризует царство или царское правление, поэтому общественно-правовой оттенок «справедливым» контекстуально точнее.
- issue: Неоднозначность βασιλείαν
  choice: В основном тексте «царством», с указанием альтернативы в сноске
  alternative: «царской властью»; «правлением»
  rationale: Греческое слово может обозначать как подвластную область, так и само царствование; перевод не должен скрывать эту смысловую возможность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой. Необычные характеристики царства сохранены как намеренное олицетворение четырёх добродетелей; местоимение «тот» помогает различить дающего закон и его получателя.
