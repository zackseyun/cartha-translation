revisions:
- from: И ему он дал закон, сообразуясь с которым в своей гражданской жизни[a], тот мог бы править царством[b] — владеющим собой, справедливым, добрым и мужественным.
  to: И дал ему закон, согласно которому тот, живя гражданской жизнью[a], мог бы править царством[b], отличающимся самообладанием, справедливостью, добротой и мужеством.
  rationale: Исправлен синтаксис, чтобы «согласно которому» однозначно относилось к «закону», а «живя гражданской жизнью» — к получателю закона. Ряд греческих прилагательных передан отвлечёнными существительными после «отличающимся», что естественно для современного русского и не меняет того, что качества приписаны царству (или, по сноске, царской власти/правлению).
