base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/019.yaml
  text: For why does our all-wise father Jacob blame those around Simeon and Levi for slaughtering the Shechemites en masse[a], not with reason, saying[b], “Cursed be their anger”?
translation:
  language: ru
  text: Ибо почему наш премудрый отец Иаков порицает Симеона и Левия с их людьми за то, что они, не руководствуясь разумом,[a] массово перебили сихемлян, и говорит:[b] «Проклят их гнев»?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. μὴ λογισμῷ («не по разуму») можно отнести либо к убийству: они действовали неразумно, либо к порицанию: Иаков порицает их не без основания. Синтаксис фразы сжат и допускает оба понимания.'
    reason: lexical_alternative
  - marker: b
    text: Ср. Бытие 49:7.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπεὶ διὰ τί
  choice: Ибо почему
  rationale: Сохраняет связь с предшествующим рассуждением и форму риторического вопроса.
- source_word: ὁ πάνσοφος ἡμῶν πατὴρ Ἰακώβ
  choice: наш премудрый отец Иаков
  rationale: «Премудрый» передаёт возвышенный эпитет πάνσοφος и соответствует достоинству риторического стиля, оставаясь понятным современному читателю.
- source_word: τοὺς περὶ Συμεὼν καὶ Λευεὶν
  choice: Симеона и Левия с их людьми
  rationale: Оборот οἱ περὶ с именами может обозначать названных лиц вместе с принадлежащей к ним группой; перевод не исключает самих Симеона и Левия.
- source_word: αἰτιᾶται
  choice: порицает
  rationale: Передаёт не формальное обвинение, а неодобрение и осуждение поступка.
- source_word: μὴ λογισμῷ
  choice: не руководствуясь разумом
  rationale: Естественно передаёт отсутствие разумного руководства действием; ближайшее положение оборота к участникам и причастию поддерживает его связь с истреблением, при сохранении синтаксической неоднозначности в сноске.
- source_word: τοὺς Σικιμίτας
  choice: сихемлян
  rationale: Обычное русское обозначение жителей Сихема.
- source_word: ἐθνηδόν
  choice: как целый народ
  rationale: 'Передаёт собирательный смысл наречия: сихемлян истребили как единую этническую общность, а не просто во множестве.'
- source_word: ἀποσφάξαντας
  choice: истребили
  rationale: Сильный глагол передаёт массовое насильственное убийство; в сочетании с «как целый народ» звучит естественнее, чем буквальное «закололи».
- source_word: Ἐπικατάρατος ὁ θυμὸς αὐτῶν
  choice: Проклят их гнев
  rationale: Сохраняет краткость, силу и формулировку отсылки к Быт 49:7.
theological_decisions:
- issue: Синтаксическая связь μὴ λογισμῷ
  choice: 'Оборот относится к истреблению сихемлян: Симеон, Левий и их люди действовали не под руководством разума.'
  alternative: 'Оборот относится к порицанию: Иаков порицает их не без основания, то есть обоснованно.'
  rationale: Порядок слов и аргумент ближайшего контекста о господстве разума над страстями поддерживают связь с насильственным действием, вызванным гневом. Однако сжатый греческий синтаксис допускает и второе понимание, поэтому оно отмечено в сноске, а не устранено.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Премудрый» и краткая цитатная формула сохраняют торжественную риторику оригинала; остальной синтаксис сделан ясным и естественным.
