  text: И не считайте удивительным[a], что разум способен одолевать даже вражду ради закона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не считайте противоречащим ожиданиям». Греческое слово может означать нечто неожиданное или удивительное.'
