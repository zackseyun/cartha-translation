    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νομίσητε
  choice: не считайте
  rationale: Глагол νομίζω здесь обозначает оценочное суждение; «не считайте» естественно вводит именную часть «удивительным» и сохраняет запрет.
- source_word: παράδοξον
  choice: удивительным
  rationale: Прилагательное означает нечто неожиданное, противоречащее ожиданиям. «Удивительным» звучит естественно и не придаёт слову излишне технического смысла современного «парадокса».
- source_word: ὅπου
  choice: что
  rationale: Буквальное «где» в сжатой греческой конструкции по-русски было бы неясным. Союз «что» естественно вводит содержание того, что не следует считать удивительным; буквальная форма отмечена в сноске.
- source_word: καὶ ἔχθραν
  choice: даже вражду
  rationale: καί перед дополнением имеет усилительное значение «даже», а ἔχθρα обозначает вражду или враждебность. «Вражду» сохраняет как межличностный, так и более широкий смысл.
- source_word: ὁ λογισμός
  choice: разум
  rationale: В 4 Маккавейской книге λογισμός — ключевое обозначение разумной способности или рассудочного суждения. «Разум» кратко и последовательно передаёт этот философский термин.
- source_word: ἐπικρατεῖν δύναται
  choice: способен одолевать
  rationale: δύναται выражает способность, а ἐπικρατέω — достижение превосходства или власти над чем-либо. «Способен одолевать» передаёт оба компонента без чрезмерно жёсткого «подавлять».
- source_word: διὰ τὸν νόμον
  choice: ради закона
  rationale: διά с винительным падежом может обозначать причину или мотив. «Ради закона» передаёт побуждение, связанное с верностью закону, не превращая закон в механическое орудие действия.
- source_word: νόμον
  choice: закона
  rationale: Строчная буква сохраняет форму греческого текста и не навязывает титульного оформления, хотя по контексту речь идёт об иудейском законе, Торе.
theological_decisions:
- issue: Философско-богословский смысл λογισμός
  choice: разум
  alternative: рассуждение; разумное суждение
  rationale: Перевод сохраняет центральное для книги утверждение о власти благочестивого разума над страстями, не вводя более поздней специальной терминологии.
- issue: Смысл διὰ τὸν νόμον
  choice: ради закона
  alternative: из-за закона; благодаря закону
  rationale: Основной текст передаёт мотив и преданность закону, сохраняя связь нравственной победы с законом. Причинное прочтение остаётся возможным и указано в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством философского увещания. Ключевой термин λογισμός передан общеупотребительным словом «разум»; синтаксис слегка распрямлён ради ясности, а неоднозначность ὅπου и διά вынесена в сноску.
