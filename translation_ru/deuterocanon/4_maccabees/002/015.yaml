  source_fidelity: 'Текст точно передаёт греческое высказывание: ὁ λογισμός передан как «разум», φαίνεται — как «видно, что», а κρατεῖν в сочетании с διὰ τῶν βιαιοτέρων παθῶν — естественным русским оборотом «одерживает верх даже над более неистовыми страстями». Сравнительная степень βιαιοτέρων сохранена словом «более». Перечень пороков полностью отражён и не содержит смысловых добавлений.'
