base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/015.yaml
  text: 'And reason is seen to prevail even over the more violent passions: love of power[a], empty glory, boastfulness, arrogance[b], and envy.'
translation:
  language: ru
  text: 'И видно, что разум одерживает верх даже над более неистовыми страстями: властолюбием, тщеславием[a], хвастливостью, высокомерием и завистью[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пустой славой».'
    reason: lexical_alternative
  - marker: b
    text: Это слово может также означать злобную недоброжелательность или «дурной глаз».
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῶν βιαιοτέρων ... παθῶν
  choice: даже над более неистовыми страстями
  rationale: При κρατεῖν сочетание передаёт область, над которой разум одерживает верх. πάθη здесь означает страсти или сильные душевные побуждения, а сравнительная форма βιαιοτέρων подчёркивает их особую силу и необузданность.
- source_word: κρατεῖν
  choice: одерживает верх
  rationale: Выражение естественно передаёт превосходство и господство разума, не сводя смысл только к подавлению или контролю.
- source_word: ὁ λογισμός
  choice: разум
  rationale: Ключевой термин книги обозначает способность к рассудочному суждению; «разум» краток, понятен и сохраняет философский регистр.
- source_word: φαίνεται
  choice: видно
  rationale: Передаёт смысл очевидности или наблюдаемой доказанности и естественно звучит в современном русском языке.
- source_word: φιλαρχίας
  choice: властолюбие
  rationale: Слово обозначает стремление к власти или первенству; «властолюбие» точно и лаконично выражает этот порок.
- source_word: κενοδοξίας
  choice: тщеславие
  rationale: Греческое слово буквально связано с «пустой славой». «Тщеславие» — естественный современный русский эквивалент; буквальный образ сохранён в примечании.
- source_word: ἀλαζονίας
  choice: хвастливость
  rationale: Термин выражает кичливое самовосхваление и самоуверенную претенциозность; выбранный вариант отличает его от следующего слова о высокомерии.
- source_word: μεγαλαυχίας
  choice: высокомерие
  rationale: Передаёт горделивое самовозвышение и сохраняет смысловое отличие от более явно словесной «хвастливости».
- source_word: βασκανίας
  choice: зависть
  rationale: В перечне пороков это наиболее ясный центральный смысл, хотя слово может также подразумевать злобную недоброжелательность или «дурной глаз»; оттенок отмечен в сноске.
theological_decisions:
- issue: Передача ключевого философского термина ὁ λογισμός
  choice: разум
  alternative: рассудок; разумное суждение
  rationale: «Разум» сохраняет центральную для книги мысль о господстве рассудочной способности над страстями, не вводя более поздней конфессиональной терминологии.
- issue: Различение близких по смыслу пороков в перечне
  choice: κενοδοξία — «тщеславие»; ἀλαζονία — «хвастливость»; μεγαλαυχία — «высокомерие»
  alternative: пустая слава; кичливость; гордыня
  rationale: Разные русские слова сохраняют риторическое накопление родственных, но не тождественных пороков и не сводят весь ряд к одному понятию гордости.
translation_notes:
  register: Современный литературный русский язык с достоинством философско-нравственного рассуждения. Перечень оформлен краткими отвлечёнными существительными; близкие пороки намеренно разграничены. Маркеры сносок поставлены при тех словах, к которым относятся примечания.
