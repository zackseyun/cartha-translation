translation:
  language: ru
  text: И господствует над любовью к детям[a], наказывая их за их порочность; и властвует над привязанностью к друзьям, обличая их за зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «любовью детей» и «близостью (общением) друзей»; по смыслу речь идёт о любви и привязанности к своим детям и друзьям.'
    reason: Греческие родительные конструкции допускают более буквальную форму, но в контексте обозначают направленность привязанности.
lexical_decisions:
- source_word: κυριεύει
  choice: господствует над
  rationale: Передаёт сильное значение власти и господства, сохраняя параллелизм с δεσπόζει.
- source_word: τῆς τέκνων φιλίας
  choice: над любовью к детям
  rationale: Родительный τέκνων здесь естественно понимать как направленность любви на детей; формулировка сохраняет как близость к греческому, так и естественность русского языка.
- source_word: διὰ κακίαν αὐτῶν
  choice: за порочность
  rationale: διά с винительным указывает на основание наказания; «порочность» сохраняет нравственную весомость κακία.
- source_word: κολάζων
  choice: наказывая
  rationale: Передаёт прямой дисциплинарно-карательный смысл причастия без неоправданного смягчения.
- source_word: τῆς φίλων συνηθείας
  choice: над привязанностью к друзьям
  rationale: συνήθεια может обозначать близость и устойчивую связь, возникшую из общения; «привязанность» естественно выражает здесь силу дружеских отношений.
- source_word: δεσπόζει
  choice: властвует над
  rationale: Сохраняет мотив господства и параллель с κυριεύει, не сводя оба глагола к одному русскому слову.
- source_word: διὰ πονηρίας
  choice: за зло
  rationale: Передаёт нравственное значение πονηρία и причинно-обвинительный оттенок конструкции; отсутствие местоимения соответствует греческому тексту.
- source_word: ἐξελέγχων
  choice: обличая
  rationale: Глагол означает выявлять неправоту и подвергать порицанию; «обличая» подходит к личному дополнению αὐτούς и не ограничивает действие лишь публичным разоблачением.
theological_decisions:
- issue: Не названный в стихе субъект глаголов
  choice: Сохранить подразумеваемый субъект без добавления слова «разум» или «самообладание»
  alternative: 'Явно назвать субъект по контексту: «разумное самообладание»'
  rationale: В данном греческом предложении подлежащее не выражено. Начальное «и» связывает стих с контекстом, поэтому перевод не должен молча вносить отсутствующее здесь существительное и тем самым устранять формальную зависимость от предыдущего рассуждения.
- issue: Направленность наказания и обличения
  choice: Местоимение «их» относить соответственно к детям и друзьям
  alternative: Понимать местоимения как относящиеся к порокам или к неопределённым лицам
  rationale: 'Формы αὐτῶν и αὐτούς естественно отсылают к τέκνων и φίλων: природная привязанность не препятствует наказанию детей и обличению друзей за нравственное зло.'
translation_notes:
  register: Современный литературный русский с достоинством философско-нравственного рассуждения. Пара «господствует / властвует» сохраняет риторический параллелизм; «порочность» и «зло» различают κακία и πονηρία, не преувеличивая различие между близкими нравственными понятиями.
