lexical_decisions:
- source_word: λέγει γοῦν ὁ νόμος
  choice: Итак, закон говорит
  rationale: Настоящее время λέγει передано настоящим временем; γοῦν выражает вывод или подтверждение и естественно передаётся словом «итак». «Закон» обозначает Моисеев закон, вводящий цитату из заповеди.
- source_word: Οὐκ ἐπιθυμήσεις
  choice: Не желай
  rationale: ἐπιθυμέω означает желать, устремлять желание к чему-либо. «Не желай» сохраняет связь с темой желаний и страстей в контексте 4 Маккавейской и звучит естественно по-русски.
- source_word: τὴν γυναῖκα τοῦ πλησίον σου
  choice: жены ближнего твоего
  rationale: γυνή здесь имеет значение «жена», что ясно из отношения принадлежности и традиции Декалога. Порядок слов сохраняет узнаваемую библейскую формулу без излишней архаизации.
- source_word: οὐδὲ ὅσα τῷ πλησίον σού ἐστιν
  choice: и ничего из того, что принадлежит ближнему твоему
  rationale: οὐδέ после отрицания естественно передаётся как «и ... ничего», а дательная конструкция с ἐστιν выражает принадлежность. Формулировка сохраняет всеохватность ὅσα.
theological_decisions:
- issue: Передача глагола ἐπιθυμέω в цитате из Декалога
  choice: Не желай
  alternative: Не пожелай; не возжелай
  rationale: «Не желай» непосредственно передаёт значение греческого глагола и сохраняет его смысловую связь с рассуждением автора о желаниях. «Не пожелай» более привычно в русской библейской традиции, а «не возжелай» стилистически архаично; ни один вариант не должен сужать запрет только до совершённого действия.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Формула «ближнего твоего» сохранена ради узнаваемости цитаты; остальной синтаксис сделан прозрачным для современного читателя.
