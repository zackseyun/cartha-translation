  text: For the law says[a], then, “You shall not desire your neighbor’s wife, nor anything that belongs to your neighbor.”
translation:
  language: ru
  text: 'Ведь закон говорит: «Не желай[a] жены своего ближнего и ничего из того, что принадлежит твоему ближнему».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не возжелай жены своего ближнего и ничего из того, что принадлежит твоему ближнему».'
