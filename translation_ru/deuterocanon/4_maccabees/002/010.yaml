  source_fidelity: 'В черновике верно переданы основные элементы стиха: Закон, его превосходство над чувством к родителям, добродетель и мотив, связанный с родителями. Однако «не позволяя предать» заменяет греческое причастие μὴ καταπροδιδοὺς («не предавая») каузативной конструкцией и вводит человека как подразумеваемого деятеля. Это допустимое толкование, но не необходимое для русского и менее точно сохраняет синтаксис оригинала.'
