lexical_decisions:
- source_word: ὁ νόμος
  choice: закон
  rationale: 'Определённость греческого выражения передана контекстуально: речь идёт о Законе как нравственном авторитете; в русском отсутствие артикля не требует добавления пояснения «этот» или «Закон Моисея».'
- source_word: εὐνοίας
  choice: любовью
  rationale: В сочетании с πρὸς γονεῖς слово обозначает благожелательное, тёплое расположение к родителям. «Любовь» естественно по-русски передаёт семейное чувство, не сводя его к послушанию; возможные более буквальные оттенки отмечены в сноске.
- source_word: κρατεῖ
  choice: господствует над
  rationale: Глагол выражает превосходство и власть. Формулировка сохраняет этическую иерархию исходного текста, не утверждая, что любовь к родителям сама по себе порочна.
- source_word: μὴ καταπροδιδοὺς
  choice: не позволяя предать
  rationale: Причастие грамматически соотнесено с «законом», но дословное «не предавая» по-русски могло бы ошибочно представить закон непосредственным нравственным деятелем. Каузативная формулировка естественно выражает его регулирующее действие, сохраняя усиленный смысл предательства или полной сдачи.
- source_word: ἀρετήν
  choice: добродетель
  rationale: Устойчивый русский философско-нравственный эквивалент ἀρετή, сохраняющий ключевую терминологию книги.
- source_word: δι᾽ αὐτούς
  choice: ради них
  rationale: διά с винительным выражает причину или мотив; «ради них» кратко и естественно передаёт возможное побуждение поступиться добродетелью из-за родителей или в их интересах.
theological_decisions:
- issue: Соотношение Закона и любви к родителям
  choice: Закон имеет преимущество даже перед любовью к родителям, если ради них пришлось бы предать добродетель.
  alternative: Закон лишь управляет или дисциплинирует любовь к родителям, без указания на столкновение обязанностей.
  rationale: κρατεῖ указывает на власть или превосходство, а отрицательное причастие поясняет предел родительского влияния. Перевод сохраняет приоритет Закона, не превращая стих в общее отрицание сыновней любви.
- issue: Субъект отрицательного причастия
  choice: Закон не позволяет человеку предать добродетель.
  alternative: Сам закон «не предаёт добродетель».
  rationale: Грамматически причастие относится к νόμος, однако по смыслу Закон осуществляет власть над человеческой привязанностью. Русская формулировка раскрывает эту подразумеваемую каузативность без добавления отдельного богословского тезиса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным философско-нравственным регистром. Союз «ведь» передаёт γάρ, «даже» — усилительное καί. Точка с запятой исходной консультационной версии заменена точкой как завершение стиха.
