lexical_decisions:
- source_word: μηδὲ
  choice: не
  rationale: Продолжает предшествующий ряд отрицательных характеристик; в русском деепричастном обороте простое «не» звучит естественнее, чем буквальное «и не».
- source_word: δενδροτομῶν
  choice: вырубая
  rationale: Передаёт рубку деревьев и древесных насаждений, не сужая значение до заготовки леса.
- source_word: τὰ ἥμερα ... φυτά
  choice: культурных насаждений
  rationale: ἥμερα обозначает возделанные, не дикие растения, а φυτά — посаженную растительность в широком смысле; «насаждения» также согласуется с глаголом «вырубать».
- source_word: τῶν πολεμίων
  choice: неприятелей
  rationale: Прямо передаёт принадлежность насаждений противной стороне и позволяет сохранить различие с последующим ἐχθρῶν.
- source_word: τὰ δὲ τῶν ἐχθρῶν
  choice: но ... насаждения врагов
  rationale: δέ выражает противопоставление; подразумеваемое существительное φυτά восстановлено ради ясности русского текста.
- source_word: τοῖς ἀπολέσασιν
  choice: для тех, кто их лишился
  rationale: Активное причастие аориста от ἀπόλλυμι может означать тех, кто потерял нечто; дополнение остаётся подразумеваемым и соотносится с насаждениями. Не принято морфологически менее прямое толкование «погибшим».
- source_word: διασώζων
  choice: сберегая
  rationale: Передаёт сохранение в целости и защиту от уничтожения.
- source_word: τὰ πεπτωκότα
  choice: упавшее
  rationale: Субстантивированное причастие оставлено столь же широким и образным, как в греческом.
- source_word: συνεγείρων
  choice: поднимая
  rationale: Сохраняет конкретный образ поднятия или восстановления павшего, не устраняя его возможного переносного смысла.
theological_decisions:
- issue: Нравственный смысл отношения к имуществу врагов
  choice: Текст изображает воздержание от уничтожения насаждений врага, их сохранение для лишившихся их и восстановление упавшего.
  alternative: Понимать τοῖς ἀπολέσασιν как «для погибших» или «для погубивших их».
  rationale: Форма активного залога естественнее допускает значение утраты, чем значение гибели; при этом сноска сохраняет реальную лексико-синтаксическую неоднозначность и не вводит владельцев, прямо не названных в тексте.
