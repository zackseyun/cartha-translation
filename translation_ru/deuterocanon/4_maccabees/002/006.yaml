base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/006.yaml
  text: And yet, when the law tells us not to desire, I could much more persuade you that reason is able to master desires, just as it also masters the passions that hinder righteousness.
translation:
  language: ru
  text: И всё же, когда закон велит нам не желать[a], я тем более мог бы убедить вас, что разум способен господствовать над желаниями, как и над страстями, мешающими праведности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не вожделеть». Возможно, имеется в виду заповедь «не желай» (Исх. 20:17; Втор. 5:21).'
    reason: Глагол ἐπιθυμεῖν может обозначать желание вообще или вожделение; вероятная отсылка к Десяти заповедям не выражена в самом стихе прямо.
lexical_decisions:
- source_word: καίτοι
  choice: И всё же
  rationale: Передаёт уступительно-противительный переход, не сглаживая ход рассуждения.
- source_word: ὅτε μὴ ἐπιθυμεῖν εἴρηκεν ἡμᾶς ὁ νόμος
  choice: раз закон велит нам не желать
  rationale: Настоящее «велит» естественно передаёт сохраняющую силу сказанного законом; «раз» выражает аргументативную связь, заключённую в контексте.
- source_word: πολὺ πλέον πείσαιμ᾽ ἂν ὑμᾶς
  choice: я тем более мог бы убедить вас
  rationale: Сохраняет потенциальность оптатива с ἄν и усиление πολὺ πλέον.
- source_word: ὁ λογισμός
  choice: разум
  rationale: В контексте трактата обозначает рассудочную способность управлять страстями; «разум» — естественный и достаточно широкий русский эквивалент.
- source_word: τῶν ἐπιθυμιῶν κρατεῖν
  choice: господствовать над желаниями
  rationale: Передаёт идею власти и самообладания в κρατεῖν, а не простого подавления.
- source_word: τῶν κωλυτικῶν τῆς δικαιοσύνης παθῶν
  choice: над страстями, мешающими праведности
  rationale: Сохраняет характеристику страстей как препятствующих δικαιοσύνη и употребляет уместное для этико-религиозного контекста «праведность».
theological_decisions:
- issue: Смысл δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: В контексте исполнения закона и нравственного поведения «праведность» лучше сохраняет религиозно-этическую широту слова, хотя значение «справедливость» также возможно.
- issue: Объём запрета μὴ ἐπιθυμεῖν
  choice: не желать
  alternative: не вожделеть / не желать чужого
  rationale: Основной текст сохраняет общую формулировку греческого оригинала и не ограничивает её безусловно заповедью о чужом имуществе; возможная библейская аллюзия отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной этико-философской лексикой. Синтаксис сделан естественным для русского языка, при этом сохранены потенциальность утверждения и напряжение между запретом закона и способностью разума управлять желаниями.
