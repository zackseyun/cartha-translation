lexical_decisions:
- source_word: ὁπηνίκα
  choice: когда
  rationale: Вводит однократное обстоятельство времени при аористе; простое «когда» естественно передаёт греческую конструкцию.
- source_word: κατεσκεύασεν
  choice: создавал
  rationale: Глагол обозначает намеренное устроение или формирование. «Создавал» звучит естественно по-русски и передаёт процесс формирования, не используя более конфессионально окрашенное «сотворил».
- source_word: τὸν ἄνθρωπον
  choice: человека
  rationale: Единственное число имеет обобщённое значение и представляет человеческий род через человека как такового.
- source_word: τὰ πάθη
  choice: страсти
  rationale: В философско-нравственном контексте книги речь идёт о внутренних аффектах и влечениях, которыми должен управлять разум, а не о внешних страданиях.
- source_word: τὰ ἤθη
  choice: свойства характера
  rationale: Передаёт устойчивые черты и склонности характера яснее для современного читателя, чем неоднозначные «нравы» или более узкие «привычки».
- source_word: περιεφύτευσεν
  choice: вложил в него
  rationale: Естественно передаёт образ помещения внутренних свойств в человека; буквальное «насадил» в данном сочетании по-русски звучало бы неестественно.
theological_decisions:
- issue: Страсти и свойства характера как вложенные Богом при создании человека
  choice: Прямо утверждается, что Бог вложил в человека и страсти, и свойства характера.
  alternative: Смягчить высказывание, назвав их лишь нейтральными способностями или возможностями.
  rationale: Греческий текст прямо называет τὰ πάθη и τὰ ἤθη; перевод сохраняет антропологическое и богословское напряжение и не подменяет эти понятия доктринальным истолкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством философско-назидательной прозы. Парная конструкция «и страсти, и свойства характера» сохраняет καί…καί и подчёркивает обе стороны утверждения.
