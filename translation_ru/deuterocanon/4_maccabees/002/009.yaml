base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/009.yaml
  text: 'And even if someone is stingy[a], he is restrained by the law through reason, neither gleaning the unharvested crops nor going over the vineyards again. And in other matters as well it is possible to recognize this: that reason is the master over the passions.'
translation:
  language: ru
  text: 'И даже если человек скуп, закон посредством разума удерживает его: он не собирает урожай с неубранных участков[a] и не проходит по виноградникам вторично, собирая оставшиеся гроздья[b]. И на других примерах можно понять, что разум господствует над страстями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нежатые» или «неубранные [посевы, участки поля]». Вероятно, имеется в виду часть урожая, которую закон предписывает оставить несобранной.'
    reason: lexical_ambiguity
  - marker: b
    text: 'Буквально: «не собирая [оставшееся] в виноградниках вторично». Речь о повторном проходе по винограднику ради оставшихся гроздьев.'
    reason: cultural_clarification
lexical_decisions:
- source_word: φειδωλός
  choice: скуп
  rationale: В данном контексте слово обозначает не похвальную бережливость, а склонность присваивать и удерживать для себя то, что закон велит оставить другим. «Скуп» передаёт отрицательную нравственную окраску без чрезмерного усиления.
- source_word: κρατεῖται
  choice: закон … удерживает его
  rationale: Пассивная греческая форма выражает подчинение или сдерживание. Активная русская конструкция с сохранением деятеля — закона — звучит естественно и ясно.
- source_word: διὰ τὸν λογισμόν
  choice: посредством разума
  rationale: 'λογισμός — ключевое понятие книги: разумное суждение, управляющее побуждениями. Краткое «разум» сохраняет философскую линию от данного выражения к заключительной формуле стиха.'
- source_word: ἐπικαρπούμενος τοὺς ἀμήτους
  choice: подбирает остатки после жатвы
  rationale: Выражение связано с предписанием оставлять часть урожая и не собирать оставшееся после жатвы. Перевод передаёт сельскохозяйственное действие и его правовой смысл; неоднозначность редкого оборота отмечена в сноске.
- source_word: ἐπιρρωγολογούμενος τοὺς ἀμπελῶνας
  choice: обирает виноградники повторно
  rationale: Редкий глагол обозначает повторный проход по винограднику ради оставшихся ягод. «Обирает … повторно» ясно передаёт повторность и собирательное действие.
- source_word: ἐπὶ τῶν ἑτέρων
  choice: на других примерах
  rationale: Оборот распространяет вывод с приведённого случая на прочие случаи. Такая формулировка естественна по-русски и не сужает неопределённое греческое выражение до конкретной области.
- source_word: τῶν παθῶν … ὁ λογισμὸς κρατῶν
  choice: разум господствует над страстями
  rationale: Причастие κρατῶν обозначает осуществление власти или контроля. «Господствует» сохраняет сильную управляющую метафору, а «страсти» передаёт философско-нравственный смысл πάθη.
theological_decisions:
- issue: Философско-антропологическое значение λογισμός
  choice: разум
  alternative: разумное суждение
  rationale: «Разум» сохраняет ключевой повтор внутри стиха и основную тему книги, не привнося более поздней конфессиональной терминологии. При этом слово понимается как деятельная способность рассуждать, а не просто как интеллект.
- issue: Нравственно-философское значение πάθη
  choice: страсти
  alternative: побуждения
  rationale: Речь идёт о внутренних влечениях, которые должны находиться под властью разума, а не об эмоциях как таковых. «Страсти» сохраняет традиционный философский смысл и напряжение исходного текста.
- issue: Соотношение закона и разума в удержании скупого человека
  choice: закон посредством разума удерживает его
  alternative: разум, направляемый законом, удерживает его
  rationale: Греческая грамматика прямо называет закон действующим началом и добавляет διὰ τὸν λογισμόν. Выбранная формулировка сохраняет эту структуру, не уточняя сверх текста, каким именно образом соотносятся закон и разум.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным философским регистром. Синтаксис упрощён ради ясности, но логическое движение от конкретного предписания закона к общему тезису сохранено. Маркеры сносок поставлены при соответствующих сельскохозяйственных выражениях; ошибочная привязка английского маркера к слову «stingy» не воспроизводится.
