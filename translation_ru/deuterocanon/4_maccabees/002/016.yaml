  text: For prudent reason drives away all these vicious passions[a], just as it also drives away anger; for it is master even over this.
translation:
  language: ru
  text: Ибо благоразумный ум отгоняет все эти порочные страсти, подобно тому как отгоняет и гнев, — ведь и над ним он властен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακόηθη πάθη
  choice: порочные страсти
  rationale: В философско-нравственном контексте πάθη обозначает не страдания вообще, а неупорядоченные душевные побуждения; κακόηθη подчёркивает их нравственно дурной, пагубный характер.
- source_word: ὁ σώφρων νοῦς
  choice: благоразумный ум
  rationale: «Ум» естественно передаёт νοῦς как мыслящую и управляющую способность, а «благоразумный» выражает свойственные σώφρων рассудительность, умеренность и самообладание без тяжеловесного разъяснения в основном тексте.
- source_word: ἀπωθεῖται
  choice: отгоняет
  rationale: Глагол передаёт активное отстранение или отражение страстей; «отгоняет» сохраняет образ действенного противостояния и звучит естественно по-русски.
- source_word: θυμόν
  choice: гнев
  rationale: Здесь θυμός назван аффектом, над которым ум осуществляет власть; контекстуально ясное соответствие — «гнев».
- source_word: δεσπόζει
  choice: властен
  rationale: Оборот «и над ним он властен» сохраняет сильное значение господства и управления, а также усилительное καί.
theological_decisions:
- issue: Антропологически-философское значение ὁ σώφρων νοῦς
  choice: благоразумный ум
  alternative: ум, владеющий собой; здравый разум
  rationale: Выбранное выражение сохраняет одновременно мыслительную способность νοῦς и нравственную дисциплинированность σώφρων. Вариант «здравый разум» звучит естественнее, но слабее передаёт самообладание; «ум, владеющий собой» точнее раскрывает оттенок, однако является пояснительным и менее естественным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным философско-нравственным звучанием. Повтор «ведь» отражает два греческих γάρ; тире помогает естественно оформить второе обоснование. Местоимение «ним» однозначно относится к гневу.
