base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/002/004.yaml
  text: And reason is seen to prevail not only over the frenzy that drives pleasure[a], but also over every desire.
translation:
  language: ru
  text: И видно, что разум господствует не только над неистовым влечением к наслаждениям[a], но и над всяким желанием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «над подстрекательством страсти к наслаждениям» или «над исступлённым порывом к чувственным удовольствиям». Греческое выражение необычно сжато и метафорично: оно рисует влечение, словно жалящее или подгоняющее человека до исступления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λογισμός
  choice: разум
  rationale: В 4 Маккавейской это ключевое понятие, обозначающее способность к нравственно направленному рациональному суждению; «разум» естественно и ёмко передаёт его философский смысл.
- source_word: φαίνεται
  choice: видно
  rationale: Передаёт значение явности и наблюдаемости, не превращая утверждение в формально доказанный вывод и не ослабляя его до простой видимости.
- source_word: ἐπικρατεῖν
  choice: господствует над
  rationale: Выражает превосходство и действенную власть над страстями; управление родительным падежом соответствует греческой конструкции.
- source_word: τὴν τῆς ἡδυπαθείας οἰστρηλασίαν
  choice: неистовое влечение к наслаждениям
  rationale: Сохраняет одновременно побуждающую силу и оттенок исступления в редком οἰστρηλασία, а ἡδυπάθεια передаётся как стремление к чувственным удовольствиям, а не как нейтральное удовольствие.
- source_word: πάσης ἐπιθυμίας
  choice: всяким желанием
  rationale: Естественно передаёт широкий смысл ἐπιθυμία и всеобщность πάσης, не сужая значение до отдельных пагубных страстей.
theological_decisions:
- issue: Утверждение о власти разума над страстями
  choice: разум представлен как действительно господствующий над влечением к наслаждениям и над всяким желанием
  alternative: разум лишь кажется господствующим либо властвует только над некоторыми желаниями
  rationale: φαίνεται сохраняется как «видно», то есть как указание на явность утверждения, тогда как ἐπικρατεῖν выражает реальное превосходство; универсальность πάσης не ограничена добавочными уточнениями.
translation_notes:
  register: Современный литературный русский язык с умеренно философским и достойным регистром. Начальное «И» передаёт δέ в связном рассуждении. Формулировка избегает архаизмов и конфессионально окрашенных толкований.
