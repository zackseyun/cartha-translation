lexical_decisions:
- source_word: νέος
  choice: молодым
  rationale: Передаёт возрастную характеристику прямо и естественно, без ненужного уточнения пола.
- source_word: ἀκμάζων
  choice: в расцвете сил
  rationale: Выражает достигнутую полноту жизненных и телесных сил, соответствующую контексту.
- source_word: πρὸς συνουσιασμόν
  choice: для любовной близости
  rationale: В данном контексте συνουσιασμός обозначает половое соединение. Выбранная формулировка ясна, современна и сохраняет достойный регистр.
- source_word: ἠκύρωσεν
  choice: лишил силы
  rationale: Глагол означает сделать недействительным или бессильным; перевод сохраняет решительность действия и звучит естественнее буквального «аннулировал».
- source_word: τῷ λογισμῷ
  choice: разумом
  rationale: λόγισμος — ключевое понятие книги, обозначающее разумное суждение, властвующее над страстями. «Разумом» кратко и последовательно передаёт эту тему.
- source_word: οἶστρον
  choice: жало
  rationale: Сохраняет образ острого, побуждающего воздействия; возможные значения «стрекало» и «неистовство» отмечены в сноске.
- source_word: τῶν παθῶν
  choice: страстей
  rationale: В нравственно-философском контексте книги πάθη — влечения и аффекты, которыми должен управлять разум; традиционное русское «страсти» сохраняет широту понятия.
