  choice: разум
  alternative: разумное суждение; способность рассуждать
  rationale: «Разум» ясно сохраняет основную тему книги — власть благочестивого разума над страстями — и не вносит более поздних конфессиональных или философских уточнений.
- issue: Характер победы над страстями в ἠκύρωσεν
  choice: лишил силы
  alternative: обуздал; упразднил
  rationale: Перевод не утверждает исчезновения самих страстей, а передаёт то, что их побуждающее действие было сделано бессильным.
