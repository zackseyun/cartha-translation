  yaml_path: translation/deuterocanon/4_maccabees/002/017.yaml
  text: For although Moses was angered against Dathan and Abiron, he did nothing against them in anger, but with reason he restrained anger.
translation:
  language: ru
  text: Хотя Моисей и разгневался на Дафана и Авейрона[a], он ничего не сделал против них в гневе, но разумом обуздал свой гнев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. Ἀβειρών — Авейрон; традиционная форма имени — «Авирам».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «посредством разумного суждения управлял своим гневом». Здесь подчёркнута власть разума над страстью — одна из центральных тем 4 Маккавейской книги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμούμενος
  choice: разгневался
  rationale: Передаёт действительное переживание Моисеем гнева, не подразумевая, что именно гнев определил его поступки.
- source_word: γέ τοι
  choice: хотя … и
  rationale: 'В контексте сочетание частиц имеет уступительно-усилительную функцию: Моисей разгневался, однако не действовал под властью гнева.'
- source_word: κατὰ Δαθὰν καὶ Ἀβειρών
  choice: на Дафана и Авейрона
  rationale: κατά указывает на направленность гнева против названных лиц; «разгневался на» естественно по-русски. Имена переданы по греческой форме.
- source_word: οὐ θυμῷ τι κατ᾽ αὐτῶν ἐποίησεν
  choice: он ничего не сделал против них в гневе
  rationale: Сохраняет отрицание любого поступка, продиктованного гневом, и словесную связь с повторяющимся θυμός.
- source_word: λογισμῷ
  choice: разумом
  rationale: Кратко и естественно передаёт ключевое для 4 Маккавейской книги понятие разумного суждения, властвующего над страстями.
- source_word: τὸν θυμὸν διήτησεν
  choice: обуздал свой гнев
  rationale: Передаёт управление и сдерживание гнева разумом. Местоимение «свой» естественно уточняет, что речь идёт о гневе Моисея, не устраняя исходного повтора.
theological_decisions:
- issue: Передача λογισμός как ключевого философско-богословского понятия книги
  choice: разумом
  alternative: посредством разумного суждения
  rationale: «Разумом» понятно современному читателю и сохраняет противопоставление разума страсти; более технический вариант приведён в примечании.
- issue: Степень власти разума над гневом в διήτησεν
  choice: обуздал свой гнев
  alternative: управлял своим гневом
  rationale: Основной вариант ясно выражает контроль над страстью, но не утверждает, будто Моисей вовсе не испытывал гнева. Альтернатива сохраняет возможный оттенок руководства или управления.
- issue: Форма имени Ἀβειρών
  choice: Авейрон
  alternative: Авирам
  rationale: Основной текст следует форме имени в греческом источнике, а традиционная форма указана в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор слова «гнев» сохранён ради риторического контраста греческого текста; синтаксис сделан естественным для обычного современного читателя.
