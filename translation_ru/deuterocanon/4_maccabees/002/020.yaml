lexical_decisions:
- source_word: εἰ μὴ γὰρ
  choice: Ведь если бы … не
  rationale: Передаёт пояснительную силу γάρ и контрфактическое условие εἰ μή естественной русской конструкцией.
- source_word: ἐδύνατο
  choice: мог
  rationale: Имперфект δύναμαι обозначает способность; в сочетании с условием и ἄν формирует нереальную ситуацию.
- source_word: τῶν θυμῶν
  choice: над страстями
  rationale: Хотя θυμός может означать гнев или порыв, во философском контексте книги множественное число охватывает сильные аффективные побуждения, которыми управляет разум.
- source_word: ὁ λογισμός
  choice: разум
  rationale: Ключевой для 4 Маккавейской книги термин обозначает разумную способность или рассудочное суждение; «разум» сохраняет его концептуальную весомость без излишней техничности.
- source_word: κρατεῖν
  choice: господствовать
  rationale: κρατέω выражает власть и превосходство над чем-либо; «господствовать над» сохраняет сильный смысл управления и естественно сочетается со «страстями».
- source_word: οὐκ ἂν εἶπεν
  choice: он не сказал бы
  rationale: ἄν с аористом передаёт контрфактическое следствие; русская форма условного наклонения точно воспроизводит его.
- source_word: οὕτως
  choice: так
  rationale: Кратко и естественно отсылает к сказанному ранее, сохраняя указание на образ или содержание высказывания.
theological_decisions:
- issue: Философско-антропологический смысл λογισμός
  choice: разум
  alternative: рассудок; разумное суждение
  rationale: «Разум» сохраняет центральное для книги противопоставление разумной способности и страстей, не сужая термин до отдельного акта рассуждения.
- issue: Объём значения θυμοί
  choice: страсти
  alternative: порывы; проявления гнева
  rationale: Контекст рассуждения о власти разума над аффективными движениями требует более широкого значения, чем один лишь гнев; при этом «страсти» сохраняют философскую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, аргументативная и достойная по тону. Синтаксис сохраняет пояснительное «ведь», контрфактическое условие и сильную идею власти разума над страстями.
