  text: By bringing against yourself a great avenger as well[a], you innovator of tortures and enemy of those who are truly reverent.
translation:
  language: ru
  text: И ты навлекаешь на себя великого мстителя[a], изобретатель новых пыток и враг тех, кто истинно благочестив.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великого духа-мстителя»; греческое слово может обозначать личного мстителя либо карающую силу возмездия.'
    reason: Лексическая неоднозначность ἀλάστωρ.
lexical_decisions:
- source_word: μέγαν
  choice: великого
  rationale: Передаёт усилительное значение при ἀλάστορα и сохраняет торжественный тон обличения.
- source_word: σοι προσβαλλὼν
  choice: навлекаешь на себя
  rationale: Естественно по-русски выражает действие, вследствие которого говорящий сам вызывает направленное против него возмездие; причастный оборот передан личной формой для ясности.
- source_word: καὶ αὐτός
  choice: и ты
  rationale: Сохраняет добавочное значение καί и усиление субъекта αὐτός; в русском контексте естественно подчёркивает, что и мучитель навлекает последствие на себя.
- source_word: ἀλάστορα
  choice: мстителя
  rationale: Сохраняет личностный образ носителя возмездия, не уточняя без достаточных оснований, является ли он человеком, духом или олицетворённой карающей силой.
- source_word: καινοτόμε τῶν βασάνων
  choice: изобретатель новых пыток
  rationale: Передаёт обращение к тому, кто вводит небывалые способы мучения; добавление «новых» естественно раскрывает заложенную в καινοτόμος идею новшества.
- source_word: πολέμιε
  choice: враг
  rationale: Прямое и современное соответствие личному враждебному обозначению в звательном употреблении.
- source_word: τῶν ἀληθῶς εὐσεβούντων
  choice: тех, кто истинно чтит Бога
  rationale: Передаёт подлинное благочестие как направленное к Богу почитание; «истинно» сохраняет эмфазу ἀληθῶς, а глагольная конструкция звучит естественнее отвлечённого «благочестивых».
theological_decisions:
- issue: Значение ἀλάστωρ как носителя возмездия
  choice: мститель
  alternative: дух-мститель; карающая сила
  rationale: Основной текст сохраняет личностную форму греческого существительного, но не отождествляет мстителя прямо с Богом или определённым духовным существом; смысловая широта отмечена в сноске.
- issue: Религиозный смысл εὐσεβούντων
  choice: тех, кто истинно чтит Бога
  alternative: истинно благочестивых; тех, кто проявляет истинное благочестие
  rationale: В контексте мученичества речь идёт о подлинной обращённости к Богу. Формулировка ясна современному читателю и не вносит конфессионально-технического оттенка.
translation_notes:
  register: Современный литературный русский язык с достоинством и резкостью прямого обличения. Греческий фрагмент синтаксически зависит от предшествующего контекста; перевод сохраняет его характер как продолжение речи, но превращает причастный оборот в естественное русское предложение.
