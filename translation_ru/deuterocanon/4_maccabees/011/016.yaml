theological_decisions:
- issue: Следует ли выражать подразумеваемый предмет еды в μὴ μεμοφαγοῦντας
  choice: Уточнить как «тех, кто не ест оскверняющей пищи»
  alternative: «тех, кто не вкусил осквернения» или «тех, кто не ел»
  rationale: Контекст требует указания на запрещённую, оскверняющую пищу; уточнение делает фразу понятной по-русски, не вводя дополнительного богословского утверждения.
- issue: Следует ли добавлять объект при заключительном βασάνιζε
  choice: Передать как «пытай нас»
  alternative: «пытай»
  rationale: В русском языке объект естественно восстанавливается из ситуации речи; «нас» ясно обозначает говорящего и его братьев, не снимая смыслового напряжения.
translation_notes:
  register: Современный литературный русский язык; тон решительный и достойный. Синтаксический повтор «пытать — пытай» сохранён ради риторического напора оригинала.
