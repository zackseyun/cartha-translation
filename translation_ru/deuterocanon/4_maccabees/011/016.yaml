- source_word: εἰ σοὶ δοκεῖ
  choice: если тебе угодно
  rationale: Сохраняет значение личного решения или усмотрения адресата и звучит естественно в обращении к правителю.
- source_word: βασανίζειν / βασάνιζε
  choice: пытать / пытай
  rationale: В контексте мученичества речь идёт о физической пытке; повтор одного глагола сохраняет риторическую силу греческого текста.
- source_word: μὴ μεμοφαγοῦντας
  choice: тех, кто не ест оскверняющей пищи
