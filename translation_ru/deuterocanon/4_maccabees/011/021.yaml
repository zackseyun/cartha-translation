    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνίκητος
  choice: непобедимо
  rationale: Передаёт значение «то, что невозможно победить или одолеть» и сохраняет предикативную силу греческого прилагательного.
- source_word: γὰρ
  choice: ибо
  rationale: Союз вводит обоснование предшествующей мысли; «ибо» естественно для краткого торжественного высказывания.
- source_word: ὦ τύραννε
  choice: тиран
  rationale: Греческая частица ὦ отмечает обращение; в современном русском отдельное «о» здесь не требуется, а звательная функция выражена пунктуацией.
- source_word: ἡ εὐσεβὴς ἐπιστήμη
  choice: благочестивое разумение
  rationale: «Разумение» охватывает знание, понимание и рассудочную способность, а «благочестивое» указывает на направленность, определяемую почитанием Бога.
theological_decisions:
- issue: Передача программного выражения εὐσεβὴς ἐπιστήμη в 4 Маккавейской книге
  choice: благочестивое разумение
  alternative: благочестивый разум; благочестивое знание
  rationale: Выбранный вариант сохраняет сочетание интеллектуального и религиозно-нравственного смыслов, не сводя ἐπιστήμη ни к отвлечённому знанию, ни только к способности рассуждать. Альтернативы отмечены из-за реальной широты греческого выражения.
