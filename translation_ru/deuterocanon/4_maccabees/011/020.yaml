  terminology: «Благочестие» уместно для εὐσέβεια в 4 Маккавейской книге. «Состязание в страданиях» лучше сохраняет спортивно-испытательную образность γυμνασία πόνων, чем инфинитив «упражняться в страданиях», и не исключает смысла подготовки/испытания. Необычное ἱεροπρεποῦς αἰῶνος остаётся в основном тексте осторожно истолкованным, а варианты вынесены в сноску.
