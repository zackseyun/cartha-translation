  yaml_path: translation/deuterocanon/4_maccabees/011/020.yaml
  text: But while he was being tortured[a], as one belonging to a holy age, he said, “For the sake of godliness, when so many brothers were called into training in sufferings, we were not conquered.”
translation:
  language: ru
  text: 'А он, подвергаясь пыткам, будучи человеком священного образа жизни[a], говорил: «Ради чего[b] ради благочестия, когда столь многие братья были призваны к состязанию в страданиях, нас не одолели».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «принадлежа к священному веку» или «как человек священной жизни». Греческое выражение необычно: слово αἰών может означать век, срок жизни или образ жизни.'
    reason: Сохранить смысловую неоднозначность необычного греческого оборота ἱεροπρεποῦς αἰῶνος.
  - marker: b
    text: 'Греческий оборот в начале прямой речи синтаксически неясен. Его также понимают в смысле: «Для этого ради благочестия…» или связывают с предшествующим контекстом.'
    reason: Отметить неоднозначную связь ἐφ’ ὃν непосредственно у его перевода, не навязывая один синтаксический разбор.
lexical_decisions:
- source_word: βασανιζόμενος
  choice: подвергаясь пыткам
  rationale: Причастие настоящего времени передаёт продолжающееся физическое истязание в контексте мученичества.
- source_word: ἱεροπρεποῦς αἰῶνος
  choice: как человек священной жизни
  rationale: Необычный родительный оборот, вероятно, характеризует посвящённый Богу образ или течение жизни. Формулировка остаётся естественной по-русски, а неоднозначность αἰών отмечена в сноске.
- source_word: εὐσέβειαν
  choice: благочестия
  rationale: В 4 Маккавейской книге слово обозначает верность и почтение к Богу, проявляемые в соблюдении Божьего закона; «благочестие» сохраняет эту направленность.
- source_word: γυμνασίαν πόνων
  choice: упражняться в страданиях
  rationale: Сохранён образ упражнения или подготовки, заложенный в γυμνασία, и конкретный смысл тягот и страданий у πόνοι.
- source_word: ἀδελφοὶ
  choice: братьев
  rationale: Речь идёт о родных братьях мученика, поэтому мужское обозначение соответствует повествовательному контексту.
- source_word: κληθέντες
  choice: были призваны
  rationale: Пассивная форма сохраняет смысл призвания или вызова на предстоящее испытание, не уточняя явно действующего лица.
- source_word: οὐκ ἐνικήθημεν
  choice: нас не одолели
  rationale: 'Передаёт страдательный смысл и образ победы и поражения: мучители не смогли взять верх над братьями.'
theological_decisions:
- issue: Значение ἱεροπρεποῦς αἰῶνος
  choice: 'Характеристика посвящённой Богу жизни говорящего: «как человек священной жизни».'
  alternative: «принадлежа к священному веку»; «как человек священного образа жизни»
  rationale: У αἰών возможны значения века, срока жизни и течения или уклада жизни. Основной текст избегает малопонятной буквальности, но сноска сохраняет временное прочтение и не превращает выражение в конфессиональное утверждение.
- issue: Образ γυμνασίαν πόνων
  choice: «были призваны упражняться в страданиях»
  alternative: «были призваны на состязание в страданиях»
  rationale: γυμνασία непосредственно обозначает упражнение или подготовку; перевод не усиливает метафору до формального состязания, хотя общий атлетический образ книги сохраняется.
- issue: Синтаксис ἐφ’ ὃν
  choice: Передан связным обстоятельственным оборотом «когда… были призваны».
  alternative: Отдельно передать как «для этого» или связать с подразумеваемым состязанием
  rationale: Оборот в данной форме синтаксически сжат и допускает разные связи. Основной текст следует наиболее связному прочтению контекста, а сноска уведомляет читателя о неясности.
translation_notes:
  register: Современный литературный русский язык с достоинством мученического повествования. Синтаксис сделан ясным для обычного читателя; ключевые образы призвания, упражнения в страданиях и неодолимости сохранены. Необычные места греческого текста не догматизированы и вынесены в краткие сноски.
