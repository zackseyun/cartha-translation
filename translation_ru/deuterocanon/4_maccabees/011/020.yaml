  source_fidelity: 'Основные смысловые соответствия верны: βασανιζόμενος передано как продолжающееся претерпевание пыток; εὐσέβεια — «благочестие»; ἀδελφοί — «братья»; οὐκ ἐνικήθημεν — страдательным «нас не одолели». Однако «упражняться в страданиях» представляет призванных как добровольно практикующих страдание и несколько ослабляет метафору γυμνασία как назначенного испытания/атлетического состязания. Связь ἐφ’ ὃν остаётся неясной и должна быть отмечена непосредственно у соответствующего оборота.'
