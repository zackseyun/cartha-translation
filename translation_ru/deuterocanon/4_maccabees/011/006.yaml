  footnotes:
  - marker: a
    text: 'Или, ближе к буквальному: «Но это ваше не достойно пыток». Связь родительного ὑμῶν («вас») с «этим» не вполне определённа; перевод «то, что исходит от вас» передаёт вероятный в контексте смысл.'
