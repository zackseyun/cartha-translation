lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление предыдущей мысли кратким и естественным русским союзом.
- source_word: ταῦτα
  choice: всё это
  rationale: Естественно передаёт указательное местоимение среднего рода во множественном числе, не конкретизируя его референт.
- source_word: ὑμῶν
  choice: с вашей стороны
  rationale: 'Родительный падеж, вероятнее всего, указывает на источник или отношение: речь идёт о том, что исходит от собеседников. Формулировка сохраняет этот смысл без неестественного буквального оборота «ваше».'
- source_word: βασάνων
  choice: пыток
  rationale: В контексте мученичества слово обозначает физические истязания; родительный множественного числа сохранён.
- source_word: ἄξια
  choice: не заслуживает
  rationale: Конструкция ἄξιος с родительным выражает соответствие или заслуженность. Русское «не заслуживает пыток» естественно передаёт смысл οὐ … ἄξια.
