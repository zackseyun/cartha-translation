lexical_decisions:
- source_word: κατὰ τοῦτον τὸν τρόπον καί
  choice: так же и он
  rationale: Передаёт сравнительно-продолжительную связь оборота и καί естественным русским выражением; местоимение «он» восстанавливает подразумеваемого участника из контекста.
- source_word: πνεῦμα
  choice: дух
  rationale: Сохраняет антропологическую весомость слова и его противопоставление телу, не сводя значение только к дыханию или психике.
- source_word: στενοχωρούμενος
  choice: был стеснён
  rationale: Передаёт образ сжатия, тесноты и внутреннего мучения, не устраняя многозначность причастия.
- source_word: σῶμα
  choice: тело
  rationale: Прямой и естественный русский эквивалент телесного обозначения.
- source_word: ἀγχόμενος
  choice: задыхалось
  rationale: Естественно по-русски выражает продолжающееся удушье или сдавливание дыхания, не уточняя без достаточных оснований способ причинения.
theological_decisions:
- issue: Различение πνεῦμα и σῶμα
  choice: Сохранить пару «дух» и «тело»
  alternative: Передать πνεῦμα как «дыхание» или «сознание»
  rationale: Греческий текст сополагает внутреннюю и телесную стороны страдания. Такая передача сохраняет напряжение текста, не превращая его в разработанное учение о составе человека.
