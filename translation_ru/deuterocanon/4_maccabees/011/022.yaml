lexical_decisions:
- source_word: καλοκαγαθίᾳ
  choice: нравственным благородством
  rationale: Дательный падеж обозначает качество или средство, которым вооружён говорящий. Слово выражает благородство нравственного характера, а не просто общественную утончённость.
- source_word: καθωπλισμένος
  choice: вооружённый
  rationale: Причастие сохраняет воинскую метафору греческого καθοπλίζω — «вооружать, снаряжать».
- source_word: τεθήσομαι
  choice: буду положен
  rationale: Будущее страдательного залога от τίθημι передано формально и без полного устранения многозначности; в контексте мученической смерти выражение, вероятно, означает, что говорящий будет положен рядом с братьями после смерти.
- source_word: κἀγώ
  choice: И я
  rationale: Передаёт включённость и подчёркнутое присоединение говорящего к участи братьев; по-русски этот смысл естественно выражается сочетанием «И я».
- source_word: μετὰ τῶν ἀδελφῶν μου
  choice: вместе с моими братьями
  rationale: μετά с родительным падежом обозначает совместность; речь идёт именно о братьях говорящего.
theological_decisions:
- issue: Значение страдательной формы τεθήσομαι в контексте мученичества
  choice: «буду положен вместе с моими братьями» с подразумеваемой смертью или погребением
  alternative: «буду помещён вместе с моими братьями»
  rationale: Контекст указывает на готовность разделить смерть братьев, однако буквальная страдательная форма τίθημι шире погребального значения. Основной текст сохраняет эту сдержанность, а примечание поясняет вероятный смысл.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным звучанием. Сохранены воинская метафора, страдательный залог и контекстуальная неоднозначность глагола τεθήσομαι.
