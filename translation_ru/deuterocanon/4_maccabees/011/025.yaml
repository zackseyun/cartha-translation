  yaml_path: translation/deuterocanon/4_maccabees/011/025.yaml
  text: For your not being able to persuade our reason[a], nor to compel us to eat defiled food—is that not your defeat?
translation:
  language: ru
  text: Ведь ты не смог ни склонить наш разум, ни силой заставить нас есть запретное мясо[a] — разве это не твоё поражение?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «принудить к мясоедению»; в данном эпизоде имеется в виду мясо, запрещённое иудейским Законом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δυνηθῆναί σε
  choice: ты не смог
  rationale: Передаёт подчёркнутую греческой субстантивированной конструкцией неспособность адресата, оставаясь естественным для современного русского языка.
- source_word: μεταπεῖσαι
  choice: переубедить
  rationale: Глагол означает убедить изменить мнение; «переубедить» точно выражает направленность попытки на изменение нравственно-разумного суждения.
- source_word: τὸν λογισμὸν ἡμῶν
  choice: наш разум
  rationale: Сохраняет ключевой для 4 Маккавейской книги философский термин λογισμός — разумное нравственное суждение, противостоящее страстям.
- source_word: βιάσασθαι
  choice: силой заставить нас
  rationale: Явно передаёт применение принуждения и восстанавливает подразумеваемый объект «нас», необходимый для естественной русской фразы.
- source_word: πρὸς τὴν μεμοφαγίαν
  choice: есть запретное мясо[a]
  rationale: Редкое существительное буквально обозначает мясоедение, однако в данном эпизоде речь идёт именно о мясе, запрещённом иудейским Законом. Контекстуальный смысл вынесен в основной текст, а буквальное значение отмечено в сноске.
- source_word: οὐ κατάλυσίς ἐστιν σου;
  choice: разве это не твоё поражение?
  rationale: Сохраняет насмешливый риторический вопрос; «поражение» естественно передаёт здесь значение краха или ниспровержения адресата.
theological_decisions:
- issue: Передача философски значимого λογισμός
  choice: наш разум
  alternative: наше разумное суждение; наша решимость
  rationale: «Разум» сохраняет центральную для книги тему господства благочестивого разума над страстями, не сводя термин только к решимости и не вводя пояснение в основной текст.
- issue: Степень контекстуализации μεμοφαγία
  choice: есть запретное мясо
  alternative: предаться мясоедению; есть осквернённую пищу
  rationale: Греческое слово называет употребление мяса, а повествовательный контекст уточняет, что мясо запрещено Законом. Такой перевод не расширяет значение до любой пищи и не создаёт ложного впечатления, будто осуждается мясоедение вообще.
translation_notes:
  register: Современный литературный русский язык с достойной, но не архаичной риторикой. Парная конструкция «ни… ни…» передаёт сопоставление неудавшегося убеждения и неудавшегося насилия; заключительный вопрос сохраняет вызывающий тон оригинала.
