base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/003.yaml
  text: But I came forward of my own accord[a], so that, after killing me also[b], you might incur punishment from heavenly justice for still more acts of wrongdoing.
translation:
  language: ru
  text: Но я сам вышел вперёд по собственной воле[a], чтобы, убив и меня, ты навлёк на себя наказание от небесной справедливости[b] за ещё большее число злодеяний.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я сам выступил по собственной инициативе».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наказание от небесного правосудия»; возможно также: «наказание от небесного суда».'
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτὸς δʼ ἀπʼ ἐμαυτοῦ
  choice: Но я сам… по собственной воле
  rationale: Сочетание подчёркивает личную инициативу и добровольность говорящего; естественная русская формулировка сохраняет оба оттенка.
- source_word: παρῆλθον
  choice: вышел вперёд
  rationale: В данном контексте глагол обозначает добровольное выступление перед мучителем, а не просто прибытие.
- source_word: ὅπως
  choice: чтобы
  rationale: Передаёт целевое значение союза.
- source_word: κἀμέ
  choice: и меня
  rationale: 'Сохраняет добавочное значение: говорящий присоединяет себя к уже убитым.'
- source_word: κατακτείνας
  choice: убив
  rationale: Деепричастие естественно передаёт действие, предшествующее тому, которое выражено личной формой ὀφλήσῃς.
- source_word: περὶ πλειόνων ἀδικημάτων
  choice: за ещё большее число злодеяний
  rationale: Передаёт ответственность за дополнительные неправедные поступки и сохраняет сравнительное значение πλειόνων.
- source_word: ὀφλήσῃς
  choice: навлёк на себя
  rationale: Идиоматично выражает возникновение вины и подлежащей наказанию ответственности, заложенное в образе долга.
- source_word: τῇ οὐρανίᾳ δίκῃ
  choice: небесной справедливости
  rationale: Сохраняет образ трансцендентной карающей справедливости, не отождествляя её однозначно ни с судом, ни с персонифицированным действующим лицом.
- source_word: τιμωρίαν
  choice: наказание
  rationale: Ясно передаёт смысл карательного воздаяния без излишнего усиления до «мести».
theological_decisions:
- issue: Значение τῇ οὐρανίᾳ δίκῃ
  choice: наказание небесной справедливости
  alternative: наказание от небесного суда
  rationale: Выбранный вариант сохраняет возможную персонификацию и идею божественного нравственного воздаяния, не устраняя смысловую широту слова δίκη.
