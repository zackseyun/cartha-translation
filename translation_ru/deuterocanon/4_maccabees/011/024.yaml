  text: Шестеро юношей сокрушили твою тиранию.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἓξ
  choice: Шестеро
  rationale: Собирательное числительное естественно употребляется по-русски при обозначении группы лиц мужского пола и вводит подлежащее.
- source_word: μειράκια
  choice: юношей
  rationale: Слово обозначает молодых мужчин или юношей, возможно с оттенком уменьшительности. «Юношей» сохраняет указание на молодость, не принижая их нравственной зрелости; «мальчиков» здесь звучало бы чрезмерно по-детски.
- source_word: κατελύσαμέν
  choice: сокрушили
  rationale: Аорист καταλύω выражает совершённое, решительное ниспровержение или уничтожение силы. «Сокрушили» естественно сочетается с «тиранией» и передаёт торжествующую риторическую силу высказывания.
- source_word: σου
  choice: твою
  rationale: Местоимение второго лица единственного числа передаёт прямое обращение к тирану.
- source_word: τὴν τυραννίδα
  choice: тиранию
  rationale: Прямой и современный эквивалент для обозначения деспотической, угнетательской власти.
theological_decisions:
- issue: Смысл аориста в торжествующем обращении к гонителю
  choice: 'Совершенный вид прошедшего времени: «сокрушили»'
  alternative: «ниспровергли»; «положили конец»
  rationale: Греческий аорист представляет действие как совершившееся. В контексте это риторическое утверждение о нравственном поражении тирании благодаря стойкости юношей, а не обязательное заявление о буквальном прекращении политической власти. Перевод сохраняет эту напряжённость, не разъясняя её внутри стиха.
translation_notes:
  register: Краткая, торжественная и вызывающая реплика. Современный литературный русский без архаизмов; «сокрушили» сохраняет возвышенную риторическую силу оригинала.
