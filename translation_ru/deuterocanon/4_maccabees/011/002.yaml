lexical_decisions:
- source_word: Οὐ μέλλω
  choice: Я не намерен
  rationale: Сочетание μέλλω с инфинитивом выражает намерение и твёрдую решимость; русский оборот естественно передаёт это значение, не сводя его к простому будущему времени.
- source_word: τύραννε
  choice: тиран
  rationale: Звательная форма содержит прямое и резко обличительное обращение к правителю; «тиран» сохраняет его нравственно отрицательную и конфронтационную окраску.
- source_word: πρὸς τὸν ... βασανισμόν
  choice: от пытки
  rationale: В сочетании с παραιτεῖσθαι оборот обозначает то, от чего говорящий отказывается уклониться; «пытка» точно соответствует контексту мученичества.
- source_word: ὑπὲρ τῆς ἀρετῆς
  choice: ради добродетели
  rationale: Предлог ὑπέρ здесь указывает, ради чего принимается страдание, а ἀρετή обозначает нравственную доблесть и добродетель — одну из ключевых тем книги.
- source_word: παραιτεῖσθαι
  choice: уклоняться
  rationale: Глагол может означать отказ или уклонение; в данном контексте «уклоняться» передаёт нежелание отступить перед предстоящим страданием, не исключая буквального значения отказа.
theological_decisions:
