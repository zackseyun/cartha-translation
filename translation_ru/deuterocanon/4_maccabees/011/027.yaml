  yaml_path: translation/deuterocanon/4_maccabees/011/027.yaml
  text: For our guards stand over us not for a tyrant[a], but for divine law; for this reason we have undefeated reason.
translation:
  language: ru
  text: Ведь над нами стоят стражи — не тирана, а Божьего закона[a]; поэтому мы обладаем непобедимым разумом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наши стражи стоят над нами не на службе у тирана, а на службе у Божьего закона». Греческая конструкция с родительными формами допускает оттенки принадлежности, служения или действия от чьего-либо имени.'
    reason: Сохраняет синтаксическую неоднозначность родительных форм τυράννου и θείου νόμου, не сводя её к цели, выраженной оборотом «ради».
  - marker: b
    text: 'Или: «разум наш непобедим». Греческое λογισμός — одно из ключевых слов 4 Маккавейской книги, обозначающее разумную способность или рассудочное суждение.'
    reason: Передаёт возможную русскую перестройку заключительной фразы и поясняет ключевой философский термин.
lexical_decisions:
- source_word: τυράννου
  choice: тирана
  rationale: Сохраняет отрицательную нравственную окраску греческого τύραννος и прямое противопоставление Божьему закону.
- source_word: θείου νόμου
  choice: Божьего закона
  rationale: Естественная современная русская передача выражения «божественный закон»; ясно обозначает принадлежность закона Богу без добавления конфессиональной трактовки.
- source_word: προεστήκασιν
  choice: стоят над нами
  rationale: Передаёт образ нахождения над кем-либо в положении надзора; перфект выражает установившееся положение.
- source_word: οἱ δορυφόροι
  choice: наши стражи
  rationale: Буквально слово связано с копьеносцами, но здесь обозначает вооружённых стражей или приближённых; «стражи» естественно передаёт их роль, не уточняя оружие.
- source_word: ἀνίκητον
  choice: непобедим
  rationale: Точно передаёт значение «непобеждённый, непреодолимый» и естественно сочетается в русском языке со словом «разум».
- source_word: λογισμόν
  choice: разум
  rationale: В 4 Маккавейской это ключевое обозначение разумной способности или рассудочного суждения, властвующего над страстями; «разум» сохраняет философский акцент.
- source_word: διὰ τοῦτο
  choice: поэтому
  rationale: Кратко и естественно передаёт вывод, следующий из предыдущего утверждения.
theological_decisions:
- issue: Противопоставление власти тирана и Божьего закона
  choice: не ради тирана, а ради Божьего закона
  alternative: не у тирана, а у Божьего закона; не на стороне тирана, а на стороне Божьего закона
  rationale: Греческие родительные формы допускают оттенки принадлежности, служения или представительства. «Ради» сохраняет противопоставление направленности служения, не превращая его в более широкое догматическое утверждение.
- issue: Статус разума в заключительной фразе
  choice: разум наш непобедим
  alternative: мы обладаем непобедимым разумом
  rationale: Греческий текст буквально говорит «имеем разум непобедимым/непобедимый». Именная русская конструкция звучит естественно, сохраняет риторическую силу и не снимает напряжение между обладанием разумом и утверждением о его непобедимости.
translation_notes:
  register: Современный литературный русский язык с достоинством и риторической краткостью оригинала. Порядок «разум наш непобедим» слегка возвышен, но естественен для торжественной речи мученика; архаизмы и конфессионально маркированная терминология исключены.
