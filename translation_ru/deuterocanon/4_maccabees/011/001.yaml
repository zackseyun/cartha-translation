lexical_decisions:
- source_word: Ὡς δὲ καὶ οὗτος
  choice: Когда и он
  rationale: Передаёт временное значение ὡς, переход δέ и последовательное «и он» для καὶ οὗτος без тяжеловесного буквального «этот также».
- source_word: ταῖς βασάνοις καταικισθεὶς
  choice: жестоко истерзанный пытками
  rationale: Сохраняет как значение βάσανοι («пытки»), так и смысл καταικίζω — жестоко мучить, подвергать поруганию; в отличие от английского слоя, не сливает причастие с глаголом смерти.
- source_word: ἐναπέθανεν
  choice: умер
  rationale: Передаёт завершённое действие аориста; предшествование следующему событию в русском ясно из придаточного с «когда» и не требует отдельной плюсквамперфектной формы.
- source_word: ὁ πέμπτος
  choice: пятый
  rationale: Субстантивированное порядковое числительное сохранено без добавления слова «брат», которое понятно из контекста, но отсутствует в стихе.
- source_word: παρεσήμαινεν
  choice: подал знак
  rationale: Формально передаёт значение «дать знак, обозначить» и не уточняет не названные в греческом ни содержание знака, ни его адресата.
- source_word: λέγων
  choice: и сказал
  rationale: Естественная русская передача обстоятельственного причастия перед последующей прямой речью.
