  text: I am younger than my brothers in age, but in understanding I am their equal.
translation:
  language: ru
  text: Я младше своих братьев по возрасту, но в понимании я им равен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλικίᾳ
  choice: по возрасту
  rationale: В сопоставлении братьев слово обозначает хронологический возраст; этот перевод естественно образует параллель с «по разуму».
- source_word: νεώτερος
  choice: младше
  rationale: Сравнительная форма указывает, что говорящий моложе своих братьев.
- source_word: διανοίᾳ
  choice: по разуму
  rationale: Здесь слово обозначает способность понимать и рассуждать; «разум» кратко и естественно передаёт противопоставление возрасту.
- source_word: ἡλικιώτης
  choice: им ровня
  rationale: В данном риторическом противопоставлении слово выражает равенство с братьями в отношении разума, а не буквальное совпадение возраста.
- source_word: ἀδελφῶν
  choice: братьев
  rationale: Мужской род множественного числа и повествовательный контекст указывают именно на братьев.
theological_decisions:
- issue: Значение ἡλικιώτης в противопоставлении с νεώτερος
  choice: равенство с братьями по разуму
  alternative: ровесник по зрелости; равный в суждении
  rationale: Первая часть прямо утверждает, что говорящий младше по возрасту, поэтому во второй части ἡλικιώτης не может без противоречия означать буквальное равенство лет. Синтаксический параллелизм относит равенство к сфере διανοία.
translation_notes:
  register: Современный литературный русский язык, краткий и достойный регистр. Конструкция «по возрасту… по разуму» сохраняет греческий параллелизм, а разговорно-литературное «им ровня» ясно передаёт смысл без тяжеловесности.
