  text: As he was saying such things[a], the bodyguards bound him and dragged him to the wheel.
translation:
  language: ru
  text: Пока он говорил это, телохранители связали его и потащили к пыточному колесу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к пыточному орудию». Греческое слово буквально может означать «катапульта», но здесь оно обозначает приспособление для пытки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαῦτα
  choice: это
  rationale: Указательное местоимение во множественном числе обобщённо отсылает к содержанию предшествующей речи; по-русски естественнее сказать «говорил это», чем буквально «говорил такие вещи».
- source_word: λέγοντα
  choice: пока он говорил
  rationale: Причастие настоящего времени обозначает действие, продолжавшееся одновременно с тем, как его схватили; конструкция «пока он говорил» ясно передаёт эту одновременность.
- source_word: δορυφόροι
  choice: телохранители
  rationale: Буквально слово означает «копьеносцы», но в эллинистическом употреблении обычно называет царскую стражу или телохранителей.
- source_word: δήσαντες
  choice: связали
  rationale: Аористное причастие указывает, что сначала его связали, после чего потащили к орудию пытки.
- source_word: εἵλκον
  choice: потащили
  rationale: Глагол передаёт насильственное перемещение; русское «потащили» естественно выражает и начало, и грубую силу действия в повествовании.
- source_word: καταπέλτην
  choice: пыточному колесу
  rationale: Обычно слово обозначает катапульту, однако в данном контексте мучений речь идёт о пыточном устройстве, традиционно понимаемом как колесо. Добавление «пыточному» предотвращает неверное понимание.
theological_decisions:
- issue: Значение καταπέλτην в контексте пытки
  choice: пыточному колесу
  alternative: пыточному орудию; катапульте
  rationale: Название конкретного устройства в этом месте не вполне однозначно. Основной текст передаёт наиболее вероятный контекстуальный смысл, а примечание сохраняет лексическую неопределённость и буквальное значение греческого слова.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и энергичная, соответствующая насильственному развитию действия. Термин «телохранители» передаёт служебный статус δορυφόροι без неуместной буквальности.
