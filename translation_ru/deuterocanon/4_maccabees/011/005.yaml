base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/005.yaml
  text: Or does it not seem evil that we worship the Creator of all things and live according to his virtuous law?[a][b]
translation:
  language: ru
  text: Или разве не кажется злом[a] то, что мы почитаем Творца всего и живём по Его добродетельному закону?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дурным», «предосудительным». Греческое κακόν обозначает нравственно плохое или заслуживающее порицания.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «Его добродетельному закону» можно также перевести: «Его благородному закону» или «Его превосходному закону».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κακὸν
  choice: злом
  rationale: Передаёт нравственную предосудительность, выраженную греческим словом, и сохраняет силу риторического вопроса.
- source_word: οὐ δοκεῖ
  choice: разве не кажется
  rationale: Сохраняет значение кажущегося или воспринимаемого и естественно оформляет риторический вопрос по-русски, не добавляя отсутствующего в греческом адресата.
- source_word: τὸν πάντων κτίστην
  choice: Творца всего
  rationale: Точно и лаконично передаёт универсальность πάντων и возвышенное богословское наименование κτίστης.
- source_word: εὐσεβοῦμεν
  choice: почитаем
  rationale: В отношении Бога глагол обозначает благоговейное религиозное почитание. «Почитаем» сохраняет этот смысл, не сужая его исключительно до обрядового поклонения.
- source_word: κατὰ
  choice: по
  rationale: В сочетании «жить по закону» естественно передаёт соответствие норме или правилу.
- source_word: τὸν ἔναρετον αὐτοῦ νόμον
  choice: Его добродетельному закону
  rationale: Сохраняет этическую характеристику ἔναρετος и притяжательное местоимение, не заменяя её более общим «хорошему».
- source_word: ζῶμεν
  choice: живём
  rationale: Передаёт образ и уклад жизни, определяемый последующей конструкцией с законом.
theological_decisions:
- issue: Значение εὐσεβοῦμεν по отношению к Творцу
  choice: почитаем
  alternative: поклоняемся; благоговеем перед
  rationale: «Почитаем» ясно выражает религиозную направленность действия и одновременно сохраняет широту понятия εὐσεβεῖν — проявлять благочестие и благоговение.
- issue: Риторическая сила ἢ ... οὐ δοκεῖ
  choice: Или разве не кажется злом...
  alternative: Или разве это не зло...; Или разве это считается злом...
  rationale: Начальное «Или» сохраняет связь с предшествующим доводом, а «не кажется» передаёт δοκεῖ и не превращает вопрос в прямое авторское утверждение.
- issue: Нравственное качество закона в ἔναρετον νόμον
  choice: добродетельному закону
  alternative: благородному закону; превосходному закону
  rationale: Выбранный вариант сохраняет нравственную, а не только общую положительную оценку закона, не привнося конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством риторической речи. Формулировка сохраняет несколько необычное сочетание нравственной характеристики с «законом», а с прописной буквы написаны «Творец» и относящееся к Нему местоимение «Его».
