lexical_decisions:
- source_word: νῦν ἰδὲ
  choice: А теперь взгляни
  rationale: Передаёт сочетание указания на настоящий момент и прямого, обличительного призыва обратить внимание; «воззри» звучало бы архаично.
- source_word: ἀλλότριος ὢν θεοῦ
  choice: чуждый Богу
  rationale: Сохраняет смысл отчуждённости и отсутствия принадлежности Богу, не превращая выражение в специальный богословский термин.
- source_word: πολεμεῖς
  choice: ты ведёшь войну
  rationale: Передаёт активную враждебность и военную силу греческого глагола точнее, чем более общее «борешься».
- source_word: τοὺς εὐσεβοῦντας εἰς τὸν θεόν
  choice: тех, кто благоговеет перед Богом
  rationale: Естественно передаёт продолжающееся благочестивое отношение к Богу и направленность, выраженную εἰς.
theological_decisions:
- issue: Смысл ἀλλότριος θεοῦ
  choice: чуждый Богу
  alternative: отчуждённый от Бога; не принадлежащий Богу
  rationale: В контексте выражение характеризует отношение гонителя к Богу — его нравственную и религиозную отчуждённость, а не этническую чужеземность; формулировка сохраняет эту остроту без догматического расширения.
translation_notes:
  register: Современный литературный русский язык с достоинством и прямой обличительной силой. Повтор слова «Бог» сохранён вслед за греческим текстом; архаизмы исключены.
