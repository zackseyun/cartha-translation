  text: if indeed you had any human awareness of desires, and had hope from God for deliverance.
translation:
  language: ru
  text: если бы ты и в самом деле испытывал человеческие желания и возлагал на Бога надежду на спасение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴπερ
  choice: если бы ты и в самом деле
  rationale: Передаёт усиленное условие «если действительно / если и в самом деле» и согласуется с контекстом нереального условия.
- source_word: ἠσθάνου
  choice: понимал
  rationale: Глагол означает «ощущать, сознавать, понимать»; здесь естественнее всего передать способность осознавать человеческие желания.
- source_word: ἀνθρώπους πόθων
  choice: человеческие желания
  rationale: Несмотря на необычную форму сочетания в представленном греческом тексте, контекст и синтаксическая связь с ἠσθάνου указывают на человеческие желания как объект осознания; перевод не пытается конкретизировать их содержание.
- source_word: παρὰ θεῷ σωτηρίου
  choice: на спасение от Бога
  rationale: Передаёт надежду на спасение или избавление, источник которого — Бог, сохраняя религиозную и ситуативную широту σωτήριον.
theological_decisions:
- issue: 'Значение σωτήριον: окончательное спасение или избавление'
  choice: спасение
  alternative: избавление
  rationale: «Спасение» сохраняет более широкий богословский и контекстуальный диапазон греческого слова, не ограничивая смысл лишь избавлением от непосредственной опасности.
translation_notes:
  register: Современный литературный русский язык; реплика звучит резко и достойно. Усиление «хоть сколько-нибудь» передаёт подразумеваемое отрицание способности адресата понимать человеческие желания.
