  yaml_path: translation/deuterocanon/4_maccabees/011/013.yaml
  text: And after this one had died, the sixth youth was brought forward. When the tyrant asked whether he wanted to be released if he ate, he said,
translation:
  language: ru
  text: 'Когда и этот умер, привели шестого юношу. Тиран спросил его, хочет ли он быть отпущенным, если поест. Он ответил:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τελευτήσαντος δὲ καὶ τούτου
  choice: Когда и этот умер
  rationale: Оборот с аористным причастием указывает на смерть предыдущего брата; «умер» передаёт смысл прямо, без добавления отсутствующего в тексте слова «мученически».
- source_word: ὁ ἕκτος ... μειρακίσκος
  choice: шестого юношу
  rationale: Субстантивированное порядковое числительное соединено с существительным μειρακίσκος; «юноша» естественно передаёт возрастной оттенок и не добавляет слова «брат».
- source_word: ἤγετο
  choice: привели
  rationale: Имперфект страдательного значения от ἄγω описывает, как юношу вели к тирану; в данном повествовательном контексте русское «привели» звучит естественно и передаёт представление перед правителем.
- source_word: πυνθανομένου τοῦ τυράννου
  choice: Тиран спросил его
  rationale: Причастная конструкция естественно разворачивается в отдельное русское предложение; «тиран» сохраняет отрицательно-оценочное наименование правителя.
- source_word: εἰ βούλοιτο
  choice: хочет ли он
  rationale: Передаёт волю или желание, выраженное βούλομαι, без усиления оттенка согласия.
- source_word: φαγὼν ἀπολύεσθαι
  choice: поесть и получить свободу
  rationale: 'Аористное причастие обозначает условие освобождения: освобождение последует после принятия пищи. Такая формулировка естественна по-русски и не уточняет, какая именно пища имеется в виду, поскольку объект в стихе не назван.'
- source_word: ὁ δὲ ἔφη
  choice: 'Он ответил:'
  rationale: Формула вводит прямую речь следующего стиха; «ответил» яснее передаёт реплику на вопрос, а двоеточие сохраняет незавершённость высказывания.
theological_decisions:
- issue: Нравственная характеристика правителя в слове τύραννος
  choice: тиран
  alternative: царь; правитель
  rationale: Греческий автор употребляет оценочное слово τύραννος. Его не следует смягчать нейтральными обозначениями власти.
- issue: Следует ли прямо назвать пищу запретной
  choice: поесть
  alternative: поесть запретной пищи; поесть жертвенного мяса
  rationale: В этом стихе объект глагола «есть» не выражен. Контекст объясняет, о какой пище идёт речь, но перевод не должен вносить это уточнение непосредственно в данный стих.
- issue: Связь еды и освобождения
  choice: поесть и получить свободу
  alternative: быть освобождённым, если он поест; освободиться посредством еды
  rationale: Причастие φαγών выражает условие, предложенное тираном. Русская координация естественно передаёт последовательность предложения, не давая ей дополнительного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис слегка разгружен делением на короткие предложения; оценочное «тиран» сохранено, а не заменено нейтральным титулом.
