lexical_decisions:
- source_word: ἐφ' οὗ
  choice: На нём
  rationale: Местоименное сочетание отсылает к упомянутому ранее орудию или поверхности пытки; русский перевод сохраняет эту анафорическую связь.
- source_word: κατατεινόμενος
  choice: его растягивали
  rationale: Причастие обозначает натягивание или растягивание тела на орудии пытки; личная пассивная конструкция по-русски естественнее передана неопределённо-личной формой.
- source_word: εὐμελῶς
  choice: размеренно
  rationale: Наречие передаёт упорядоченность и намеренно регулируемый характер действий; «размеренно» сохраняет зловещую методичность, не приписывая мучителям положительной «умелости».
- source_word: ἐκσφονδυλιζόμενος
  choice: выворачивали суставы
  rationale: Глагол обозначает насильственное повреждение и смещение суставов или позвонков; конкретная русская формулировка понятна и не усиливает смысл до расчленения.
- source_word: ὑπεκαίετο
  choice: снизу жгли
  rationale: Имперфект выражает продолжающееся действие, а приставка ὑπο- указывает на огонь или обжигание снизу; формулировка сохраняет оба оттенка.
