  text: After he said these things[a], they led him to the wheel.
translation:
  language: ru
  text: После этих слов[a] его повели к колесу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имеется в виду колесо, служившее орудием пытки в этом рассказе о мученичестве.
    reason: cultural_note
lexical_decisions:
- source_word: ταῦτα αὐτὸν εἰπόντα
  choice: После этих слов
  rationale: Оборот с аористным причастием указывает на действие, предшествующее основному. Естественная русская формулировка сохраняет отсылку ταῦτα к только что произнесённым словам.
- source_word: παρῆγον
  choice: его повели
  rationale: Имперфект παράγω описывает, как его вели к орудию пытки; «повели» естественно передаёт начало и направленность принудительного движения, не добавляя отсутствующих в тексте подробностей.
- source_word: ἐπὶ τὸν τροχόν
  choice: к колесу
  rationale: ἐπί с винительным выражает движение к предмету и может значить «к» или «на». «К колесу» осторожно сохраняет неоднозначность и не утверждает, что его уже положили на орудие.
