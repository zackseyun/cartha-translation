  source_fidelity: μισάρετε — не просто «ненавистный», а составное обращение со значением «ненавидящий добродетель / ненавистник добродетели» (μισέω + ἀρετή). В черновике этот смысл утрачен. πορθεῖς передано приемлемо как разрушительное причинение вреда, но наречие «жестоко» прямо не выражено в греческом и излишне уточняет текст.
  naturalness: «О ненавистный человеконенавистник» звучит тяжеловесно и семантически неточно. «О, ненавистник добродетели и человеконенавистник» сохраняет два резких параллельных обращения и остается литературно естественным. «Что мы сделали, что ты так губишь нас?» — естественная русская передача вопроса τί δράσαντες.
  terminology: «Ненавистник добродетели» точно передает μισάρετε без доктринального истолкования. «Человеконенавистник» точно передает μισάνθρωπε. Сноска уместно отмечает диапазон πορθεῖς, не превращая образ разрушения в однозначно военный термин.
