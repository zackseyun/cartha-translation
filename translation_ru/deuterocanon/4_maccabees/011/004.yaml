lexical_decisions:
- source_word: ὦ
  choice: О
  rationale: Сохранено как междометие при прямом обращении, передающее резкий, обличительный тон.
- source_word: μισάρετε
  choice: ненавистный
  rationale: Сильное бранное определение; «ненавистный» естественно по-русски передаёт неприязнь и осуждение, не уточняя не названный в форме слова объект ненависти.
- source_word: μισάνθρωπε
  choice: человеконенавистник
  rationale: Сложное слово буквально обозначает ненавидящего людей; русский эквивалент точен, понятен и сохраняет резкость обращения.
- source_word: τί δράσαντες
  choice: что мы сделали
  rationale: Идиоматическая передача причастной конструкции, выражающей вопрос о поступке, которым якобы могло быть вызвано такое обращение.
- source_word: πορθεῖς
  choice: жестоко губишь
  rationale: Глагол обозначает разорение, опустошение или уничтожение; в контексте мучений эта формулировка передаёт насильственное разрушительное воздействие без неуместно военного оттенка.
- source_word: τοῦτον ... τὸν τρόπον
  choice: так
  rationale: 'Естественная современная русская передача указания на образ действия: «таким образом».'
