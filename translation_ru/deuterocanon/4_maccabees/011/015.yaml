  yaml_path: translation/deuterocanon/4_maccabees/011/015.yaml
  text: For since we were both born and brought up for the same things[a], we likewise ought to die for the same things.
translation:
  language: ru
  text: Ведь мы родились и были воспитаны для одного и того же[a] и так же должны умереть за одно и то же.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради одной и той же цели», «ради одних и тех же принципов». В греческом тексте в обеих частях стиха повторяется широкое выражение, буквально — «одно и то же».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ αὐτά
  choice: для одного и того же
  rationale: Предлог εἰς здесь указывает на направленность или цель. Формулировка сохраняет широкое значение греческого выражения и не уточняет подразумеваемый предмет без основания в самом стихе.
- source_word: γενηθέντες
  choice: родились
  rationale: В контексте обращения к братьям естественное значение причастия — «родившись»; личная форма делает русскую фразу ясной и современной.
- source_word: τραφέντες
  choice: были воспитаны
  rationale: Глагол обозначает не только питание, но и взращивание, воспитание; выбранный вариант передаёт формирование человека с детства.
- source_word: ὑπὲρ τῶν αὐτῶν
  choice: за одно и то же
  rationale: Предлог ὑπέρ выражает действие ради чего-либо или в защиту чего-либо. Русское «умереть за» точно передаёт эту направленность и сохраняет повтор широкого выражения «одно и то же».
- source_word: ἀποθνήσκειν
  choice: умереть
  rationale: Глагол прямо означает «умереть» и сам по себе не уточняет, кем или каким образом будет причинена смерть.
- source_word: ὀφείλομεν
  choice: должны
  rationale: Передаёт нравственную обязанность естественным современным русским языком.
- source_word: ὁμοίως
  choice: так же
  rationale: Подчёркивает соответствие общей жизни и общей готовности умереть, не добавляя лишнего уточнения.
theological_decisions:
- issue: Следует ли конкретизировать τὰ αὐτά / τῶν αὐτῶν как «принципы», «дело» или «закон»
  choice: Сохранить широкое повторяющееся выражение «одно и то же»
  alternative: «одни и те же принципы», «одно и то же дело» или «один и тот же закон»
  rationale: Греческий текст не называет подразумеваемый предмет, хотя контекст связывает его с общей верностью закону. Конкретизация устранила бы намеренную широту выражения и внесла бы толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. Различие предлогов «для» и «за» отражает различие греческих εἰς и ὑπέρ, а повтор «одно и то же» сохраняет смысловую параллель оригинала.
