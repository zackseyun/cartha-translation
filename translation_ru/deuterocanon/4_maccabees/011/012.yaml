base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/011/012.yaml
  text: “Good,” said the tyrant[a], though unwillingly, “he grants us favors—good indeed—by giving us the opportunity, through nobler sufferings[b], to display our endurance for our law.”
translation:
  language: ru
  text: «Хорошо, — говорил он, — тиран, сам того не желая, оказывает нам благодеяния; хорошо поступает, давая нам возможность через более благородные страдания показать нашу стойкость в верности нашему Закону».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слова о «благодеяниях» ироничны: истязания, которым тиран подвергает мучеников, дают им возможность проявить стойкость в верности Закону.'
    reason: literary_note
lexical_decisions:
- source_word: Καλῶς … καλῶς
  choice: «Хорошо … да, хорошо»
  rationale: Сохраняется emphатический повтор одобрительного наречия; частица «да» делает повтор естественным в современной русской речи.
- source_word: ἔλεγεν
  choice: «говорил он»
  rationale: Имперфект передан формой несовершенного вида, уместной для продолжающейся речи в повествовании.
- source_word: ἄκων, ὁ τύραννος
  choice: «тиран против своей воли»
  rationale: 'ἄκων синтаксически естественно относится к тирану как субъекту χαρίζῃ: преследователь невольно приносит мученикам пользу.'
- source_word: χάριτας ἡμῖν χαρίζῃ
  choice: «оказывает нам благодеяния»
  rationale: 'Передаёт однокоренную конструкцию и её иронический смысл: мучения оборачиваются благом для мучеников.'
- source_word: διὰ γενναιοτέρων πόνων
  choice: «более благородными страданиями»
  rationale: Сохраняются сравнительная степень γενναιοτέρων и инструментальное значение διά; πόνοι в контексте означает мучительные испытания.
- source_word: ἐπιδείξασθαι παρέχων
  choice: «даёт нам возможность показать»
  rationale: Естественно передаёт предоставление возможности совершить действие, выраженное инфинитивом.
- source_word: τὴν εἰς τὸν νόμον ἡμῶν καρτερίαν
  choice: «нашу стойкость в верности Закону»
  rationale: καρτερία обозначает стойкость под страданием, а εἰς τὸν νόμον — направленность и преданность Закону; русский оборот избегает неясного буквального «стойкость к Закону».
theological_decisions:
- issue: Значение νόμος в контексте иудейского мученичества
  choice: «Закон»
  alternative: «закон»
  rationale: Речь идёт не о законе вообще, а о данном Богом и хранимом мучениками Законе; прописная буква ясно обозначает этот конкретный религиозный референт без добавления конфессионального толкования.
- issue: К кому относится ἄκων
  choice: К тирану, который невольно оказывает благодеяния
  alternative: 'К говорящему: «сказал тиран, хотя и неохотно»'
  rationale: 'Положение ἄκων рядом с ὁ τύραννος и грамматическая связь ὁ τύραννος с χαρίζῃ поддерживают смысл: тиран против своей воли приносит мученикам пользу. Такое прочтение также сохраняет внутреннюю логику иронического высказывания.'
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим мученической речи. Пунктуация ясно отделяет авторское «говорил он» от прямой речи и не превращает тирана в говорящего; повтор Καλῶς сохранён без тяжеловесной буквальности.
