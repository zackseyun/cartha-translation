  source_fidelity: 'Основной смысл передан точно: сначала раскалили заострённые вертела, затем прикладывали их к спине; после прокалывания боков продолжали обжигать внутренние органы. Однако сочетание «выжигали из него внутренности» в русском языке может подразумевать извлечение внутренностей и потому неточно передаёт греческое τὰ σπλάγχνα διέκαιον ἀπʼ αὐτοῦ. Более нейтральное «выжигали у него внутренности» сохраняет связь с ἀπʼ αὐτοῦ без такого добавочного смысла.'
  naturalness: «Раскалив острые вертела» и «прикладывали их к его спине» звучат естественно в современном литературном русском. «Выжигали у него внутренности» существенно естественнее, чем «выжигали из него внутренности».
  terminology: «Вертела», «бока» и «внутренности» подходят контексту и не требуют замены. «Выжигали» удачно передаёт длительное действие имперфекта διέκαιον.
