lexical_decisions:
- source_word: ὀβελίσκους ὀξεῖς
  choice: острые вертела
  rationale: ὀβελίσκος обозначает небольшой заострённый металлический вертел; сочетание «острые вертела» передаёт и вид орудия, и его колющее назначение.
- source_word: πυρώσαντες
  choice: раскалив
  rationale: Глагол означает сильное нагревание огнём; деепричастие сохраняет предшествование этого действия последующей пытке.
- source_word: τοῖς νώτοις προσέφερον
  choice: прикладывали их к его спине
  rationale: προσφέρω здесь означает подносить или прикладывать к телу. «Прикладывали» естественно для русского языка и не добавляет прямо не выраженного нажима.
- source_word: τὰ πλευρὰ διαπείραντες
  choice: пронзив ему бока
  rationale: διαπείρω указывает на проникновение насквозь, а πλευρά — на бока или боковые части тела. Дательный «ему» естественно выражает принадлежность частей тела по-русски.
- source_word: τὰ σπλάγχνα
  choice: внутренности
  rationale: В данном физическом контексте слово означает внутренние органы, а не чувства или средоточие эмоций.
- source_word: διέκαιον
  choice: выжигали
  rationale: Имперфект описывает продолжавшееся действие. «Выжигали» передаёт интенсивное воздействие огня и естественно сочетается с конструкцией «из него внутренности».
- source_word: ἀπʼ αὐτοῦ
  choice: из него
  rationale: Это формально близкая передача неоднозначного выражения «от/из него (или этого)», не заменяющая его более определённым толкованием «изнутри».
