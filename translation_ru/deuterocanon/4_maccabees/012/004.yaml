base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/004.yaml
  text: You see the outcome of your brothers’ madness[a]; for because of disobedience they have been tortured and have died. But you, if you do not obey, will yourself also die before your time[c][b], after being miserably tortured.
translation:
  language: ru
  text: 'Ты видишь, чем кончилось безумие твоих братьев[a]: за неповиновение их подвергли пыткам[b], и они умерли. А если ты не подчинишься[c], то и сам после жестоких мучений умрёшь безвременно.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конец» или «итог безумия твоих братьев».'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол может конкретнее обозначать растягивание и истязание на дыбе.
    reason: cultural_note
  - marker: c
    text: 'Или: «не дашь себя убедить»; здесь убеждение подразумевает практическое подчинение приказу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπονοίας
  choice: безумие
  rationale: Передаёт враждебную оценку братьев говорящим как людей, утративших здравое суждение; более мягкое «неразумие» ослабило бы резкость прямой речи.
- source_word: τὸ τέλος
  choice: чем кончилось
  rationale: Естественно по-русски выражает итог и последствия поведения братьев, сохраняя связь с буквальным значением «конец».
- source_word: ἀπείθειαν
  choice: неповиновение
  rationale: В контексте речь идёт об отказе исполнить требование царя; слово сохраняет прямое значение непослушания власти.
- source_word: στρεβλωθέντες
  choice: подвергли пыткам
  rationale: Глагол обозначает истязание и может конкретно указывать на растягивание на дыбе; основной текст не уточняет орудие пытки без достаточной необходимости.
- source_word: τεθήκασιν
  choice: погибли
  rationale: В контексте форма идиоматически указывает на наступившую смерть; «погибли» естественно завершает описание участи братьев.
- source_word: πεισθείης
  choice: не подчинишься
  rationale: Буквально форма может означать «не будешь убеждён», но в ситуации угрозы её практический смысл — отказ уступить и исполнить приказ.
- source_word: ταλαί βασανισθεὶς
  choice: после жестоких мучений
  rationale: Передаёт тяжесть и жалостно-презрительную эмоциональную окраску выражения, связывая мучение со смертью как предшествующее ей действие.
- source_word: πρὸ ὥρας
  choice: безвременно
  rationale: Кратко и естественно передаёт идиому о смерти раньше надлежащего срока.
theological_decisions:
- issue: Оценочное описание позиции братьев
  choice: «безумие» сохранено как формулировка тирана в прямой речи
  alternative: «неразумие» или «безрассудство»
  rationale: Перевод воспроизводит осуждающую риторику говорящего, не выдавая её за оценку повествователя и не смягчая напряжение сцены.
- issue: Значение πεισθείης в условиях принуждения
  choice: «не подчинишься»
  alternative: «не дашь себя убедить»
  rationale: Контекст требует практического повиновения приказу, однако возможное более буквальное значение отмечено в сноске, чтобы не скрывать семантическую широту греческого глагола.
translation_notes:
  register: Современный литературный русский язык; угрожающая и презрительная интонация прямой речи сохранена без архаизации. Синтаксис сделан ясным для обычного читателя, а неоднозначность ключевых греческих слов вынесена в сноски.
