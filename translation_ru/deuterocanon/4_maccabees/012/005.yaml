  text: But if you are persuaded[a], you will be a friend, and you will have charge of the affairs of the kingdom.
translation:
  language: ru
  text: Если же ты позволишь себя убедить[a], станешь другом и получишь в управление царские дела.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «послушаешься».'
    reason: Греческое причастие означает «быть убеждённым», но в данном контексте может подразумевать согласие последовать убеждению.
  - marker: b
    text: 'Или: «будешь руководить делами царства».'
    reason: Греческое выражение допускает передачу как управления царскими делами, так и руководства делами царства.
lexical_decisions:
- source_word: πεισθεὶς
  choice: если же послушаешься
  rationale: Аористное пассивное причастие от πείθω в данном увещевательном контексте имеет условный оттенок и может обозначать согласие подчиниться убеждению. Такая передача естественна по-русски и не усиливает смысл до безоговорочной покорности.
- source_word: φίλος
  choice: другом
  rationale: Сохранено основное значение слова. В придворном контексте оно может также подразумевать приближённого или союзника, однако добавлять «царя» или передавать словом «фаворит» было бы излишним уточнением.
- source_word: ἔσῃ
  choice: станешь
  rationale: Будущая форма εἰμί в сочетании с именной частью сказуемого естественно передаётся по-русски глаголом «станешь».
- source_word: τῶν ἐπὶ τῆς βασιλείας πραγμάτων
  choice: царские дела
  rationale: Выражение указывает на дела, относящиеся к царской власти или царству. «Царские дела» кратко и естественно передаёт административно-придворный контекст, не вынуждая выбирать между значениями «царство» и «царская власть».
- source_word: ἀφήγησιν
  choice: получишь в управление
  rationale: Здесь существительное обозначает руководство, ведение или управление, а не повествование. Глагольная конструкция восполняет подразумеваемое сказуемое и ясно выражает обещание административной ответственности.
