base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/002.yaml
  text: Whom the tyrant pitied[a], even though he had been cruelly mistreated by his brothers, seeing that he was already wearing the chains,
translation:
  language: ru
  text: Тиран пожалел его, хотя собственные братья тирана жестоко с ним обошлись, видя, что тот уже закован в цепи[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уже с цепями на нём». Буквально греческий оборот описывает его как уже имеющего цепи вокруг себя.'
    reason: 'Лексическая альтернатива: основной текст естественно передаёт образ узника в цепях, а сноска сохраняет более буквальное значение περικείμενον.'
lexical_decisions:
- source_word: κατοικτειρήσας
  choice: пожалел
  rationale: Причастие выражает жалость или сострадание; «пожалел» естественно и точно передаёт эмоциональную реакцию тирана.
- source_word: ὁ τύραννος
  choice: тиран
  rationale: Слово имеет оценочную окраску и характеризует преследующего правителя, поэтому нейтральные «царь» или «правитель» были бы неоправданным смягчением.
- source_word: καίπερ
  choice: хотя
  rationale: Передаёт уступительное значение частицы и сохраняет связь с причастной конструкцией.
- source_word: δεινῶς … κακισθείς
  choice: жестоко поносили
  rationale: Пассивное причастие относится к тирану, а братья выступают действующими лицами. В данном повествовательном контексте речь естественно понимать как суровые оскорбления или поношение со стороны уже пострадавших братьев; перевод не вводит конкретного вида физического насилия.
- source_word: ὑπὸ τῶν ἀδελφῶν αὐτοῦ
  choice: братья юноши
  rationale: ἀδελφῶν обозначает братьев-мужчин, а αὐτοῦ по смыслу относится к юноше, которого тиран видит в цепях. Повтор существительного устраняет вводящую в заблуждение возможность понять их как братьев тирана.
- source_word: ὁρῶν
  choice: он увидел
  rationale: Личная форма естественнее для современного русского повествования и ясно сохраняет тирана как субъект видения.
- source_word: ἤδη
  choice: уже
  rationale: Прямо передаёт состояние, наступившее к этому моменту.
- source_word: τὰ δεσμὰ περικείμενον
  choice: юноша уже скован цепями
  rationale: Передаёт зрительный образ цепей, находящихся вокруг пленника, естественным русским выражением без буквального и неидиоматичного «носил цепи».
theological_decisions:
- issue: Родственное обозначение ἀδελφῶν
  choice: братья
  alternative: братья и сёстры; родственники
  rationale: В повествовании имеются в виду братья-мужчины; нейтрализация рода была бы неточной.
- issue: Оценочный титул τύραννος
  choice: тиран
  alternative: царь; правитель
  rationale: Сохранена нравственно и риторически нагруженная характеристика правителя, данная самим текстом.
- issue: Отнесение αὐτοῦ и синтаксис κακισθείς
  choice: братья принадлежат юноше, а объектом их поношения является тиран
  alternative: тиран был жестоко обижен собственными братьями
  rationale: Номинатив κακισθείς согласуется с ὁ τύραννος, тогда как αὐτοῦ естественно отсылает к антецеденту ὃν, то есть к юноше. Русская формулировка раскрывает эти разные синтаксические связи, не приписывая тирану братьев, отсутствующих в повествовании.
translation_notes:
  register: Современный литературный русский, сдержанный и повествовательно связный. Поскольку стих является продолжением предыдущего предложения и в источнике оканчивается запятой, перевод также дан как синтаксически незавершённый фрагмент. Повтор слов «тиран» и «юноша» выбран ради ясности референции в сложной греческой причастной конструкции.
