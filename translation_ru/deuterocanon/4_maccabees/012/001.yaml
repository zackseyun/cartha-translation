  text: And as he too died blessedly, after being thrown into the cauldron, the seventh came forward, the youngest of all.
translation:
  language: ru
  text: Когда же и он блаженно умер, после того как его бросили в котёл, вышел вперёд седьмой, самый младший из всех.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακαρίως
  choice: блаженно
  rationale: Наречие характеризует саму смерть как достойную блаженной участи; «блаженно» сохраняет оценочный и мученический оттенок, не сводя его к эмоциональному «счастливо».
- source_word: ἐναπέθανεν
  choice: умер
  rationale: В данном контексте естественное русское «умер» передаёт основной смысл сложного глагола, тогда как обстоятельство смерти выражено следующим причастным оборотом.
- source_word: καταβληθείς
  choice: будучи брошен
  rationale: Страдательная конструкция сохраняет насильственный характер действия; причастный оборот не требует однозначно устанавливать более точное временное соотношение, чем дано в греческом.
- source_word: λέβητα
  choice: котёл
  rationale: «Котёл» — современное и точное обозначение большого металлического сосуда в контексте казни или пытки.
- source_word: παρεγίνετο
  choice: вперёд вышел
  rationale: В повествовательном контексте выражение передаёт появление следующего брата и его выступление для предстоящего испытания.
- source_word: ὁ πάντων νεώτερος
  choice: самый младший из всех
  rationale: Фраза естественно и точно передаёт превосходную степень и положение седьмого брата среди всей группы.
theological_decisions:
- issue: Передача μακαρίως в контексте мученической смерти
  choice: блаженно умер
  alternative: счастливо умер; умер блаженной смертью
  rationale: «Блаженно» сохраняет духовно-нравственную оценку смерти в греческом тексте и не превращает её в указание на субъективное чувство счастья; вместе с тем формулировка не добавляет конкретного учения о посмертной участи.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-мученического повествования. Порядок фразы слегка адаптирован для естественного русского звучания; тире ясно присоединяет пояснение о возрасте седьмого брата.
