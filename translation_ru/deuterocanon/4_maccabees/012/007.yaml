lexical_decisions:
- source_word: δὲ
  choice: а
  rationale: Частица обозначает мягкий переход в повествовании; союз «а» естественно связывает эту часть с предыдущим контекстом, не создавая резкого противопоставления.
- source_word: τῆς μητρὸς ... προτρεψαμένης αὐτόν
  choice: мать ободрила его
  rationale: Причастие προτρεψαμένης передаёт побуждение и ободрение. «Ободрила» звучит естественно и сохраняет активный характер материнского обращения.
- source_word: τῇ Ἑβραΐδι φωνῇ
  choice: на еврейском языке
  rationale: В данном контексте φωνή означает язык или речь, а не просто голос или звук. Формулировка ясно указывает, на каком языке мать говорила с сыном.
- source_word: ὡς ἐροῦμεν
  choice: как мы расскажем
  rationale: Будущее время выражает авторское замечание о последующем изложении; «расскажем» естественно для повествовательного контекста.
- source_word: μετὰ μικρὸν ὕστερον
  choice: немного позже
  rationale: Выражение отсылает к близкому последующему месту повествования; перевод краток и точно сохраняет временное значение.
