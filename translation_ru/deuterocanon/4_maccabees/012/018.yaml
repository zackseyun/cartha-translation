  yaml_path: translation/deuterocanon/4_maccabees/012/018.yaml
  text: But I call upon the God of my fathers[b][a], that he may be merciful to my nation.
translation:
  language: ru
  text: Я же взываю к Богу моих отцов[a], чтобы Он был милостив к моему народу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Богу моих предков»; греческое выражение может также передаваться как «к Богу предков».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к моему роду» или «к моим соплеменникам». Греческое слово может обозначать род, происхождение или народ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλοῦμαι
  choice: взываю
  rationale: Передаёт обращённую к Богу настоятельную молитвенную просьбу; звучит естественно и сохраняет более точный смысл, чем простое «молюсь».
- source_word: πατρῷον θεόν
  choice: к Богу моих отцов
  rationale: Сохраняет принадлежность Бога предкам говорящего и библейский историко-заветный оттенок выражения, не превращая его в отвлечённое «родовое божество».
- source_word: ὅπως
  choice: чтобы
  rationale: Естественно вводит содержание и цель обращения.
- source_word: ἐλέως γένηται
  choice: Он был милостив
  rationale: Предикативное сочетание передаёт просьбу о проявлении милости и не подразумевает, будто Божий характер должен измениться.
- source_word: τῷ γένει μου
  choice: к моему народу
  rationale: В контексте мученичества γένος, вероятнее всего, обозначает более широкую общность — иудейский народ, а не только ближайших родственников; «народ» не несёт современных биологических коннотаций слова «раса».
theological_decisions:
- issue: Объём значения τῷ γένει μου
  choice: к моему народу
  alternative: к моему роду; к моим соплеменникам
  rationale: Контекст поддерживает ходатайство за весь народ, однако греческое γένος допускает также родовую или этническую общность; эта неоднозначность отмечена в сноске.
- issue: Значение πατρῷον θεόν
  choice: к Богу моих отцов
  alternative: к Богу моих предков; к Богу предков
  rationale: Основной вариант сохраняет традиционную библейскую формулу и её историческую глубину, а сноска показывает более прямую современную передачу прилагательного πατρῷος.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. «Я же» естественно передаёт δέ, а прописное «Он» соответствует распространённой русской библейской издательской норме. Все смысловые альтернативы, существенные для πατρῷος и γένος, вынесены в сноски.
