  text: I will not renounce the testimony of my brothers[a].
translation:
  language: ru
  text: Я не отрекусь от свидетельства моих братьев[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетельствования моих братьев»; в данном контексте это слово также связано с мученичеством.'
    reason: Лексическая альтернатива и важный контекстуальный оттенок μαρτυρίας.
lexical_decisions:
- source_word: Οὐκ
  choice: не
  rationale: Прямое отрицание, относящееся к глаголу.
- source_word: ἀπαντυμολοῶ
  choice: отрекусь
  rationale: Глагол выражает отказ признать или отречение под давлением. Будущее совершенного вида естественно передаёт твёрдое решение говорящего не отступиться.
- source_word: μαρτυρίας
  choice: свидетельства
  rationale: Слово означает «свидетельство» или «свидетельствование» и в контексте книги приобретает оттенок мученичества. Основной перевод сохраняет прямое значение, не делая этот оттенок явным вопреки форме оригинала.
- source_word: τῶν ἀδελφῶν μου
  choice: моих братьев
  rationale: Речь идёт о родных братьях говорящего, поэтому мужской род передан прямо и без расширения значения.
theological_decisions:
- issue: Следует ли явно передать μαρτυρίας словом «мученичество»
  choice: свидетельство
  alternative: мученичество; свидетельствование
  rationale: Хотя контекст 4 Маккавейской книги связывает свидетельство с мученической смертью, греческое существительное сохраняет обычное значение. Перевод «мученичество» устранил бы намеренную смысловую напряжённость и внёс бы толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык; краткая и твёрдая реплика передана естественно и торжественно, без архаизма «братьев моих».
