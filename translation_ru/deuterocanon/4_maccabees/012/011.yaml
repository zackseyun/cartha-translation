base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/011.yaml
  text: “You unholy man,” she said[a], “most ungodly tyrant of all wicked men, were you not ashamed, after receiving good things and kingship from God[b], to kill his servants and torture the practitioners of godliness?”
translation:
  language: ru
  text: «Нечестивец, — говорит она, — безбожнейший тиран из всех злодеев[a]! Неужели тебе не было стыдно, получив от Бога блага и царскую власть, убивать Его слуг и подвергать пыткам тех, кто упражняется в благочестии[b]?»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «самый нечестивый тиран среди всех злых людей». В греческом обличительные слова и превосходная степень нагромождены ради риторического усиления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «подвижников благочестия» или «упражняющихся в благочестии». Слово ἀσκητής обозначает человека, который деятельно упражняется в определённом образе жизни; позднейшее специальное значение «аскет» здесь не обязательно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνόσιε
  choice: Нечестивец
  rationale: Звательная форма передаёт религиозно-нравственное осуждение. Существительное «нечестивец» естественно звучит как прямое обличительное обращение и не требует добавлять слово «человек».
- source_word: πάντων τῶν πονηρῶν ἀσεβέστατε τύραννε
  choice: безбожнейший тиран из всех злодеев
  rationale: Сохранены превосходная степень ἀσεβέστατε, бранное «тиран» и отнесение адресата к совокупности πονηροί. «Злодеи» здесь естественнее буквального «злые» и поддерживает риторическую силу греческого выражения.
- source_word: οὐκ ᾐδέσθης
  choice: Неужели тебе не было стыдно
  rationale: Риторический вопрос передан естественным современным оборотом, сохраняющим обвинение в отсутствии стыда и нравственного удержания.
- source_word: παρὰ τοῦ θεοῦ λαβὼν τὰ ἀγαθὰ
  choice: получив от Бога блага
  rationale: Деепричастие сохраняет предшествующее обстоятельство, а «блага» передаёт широкое и неспецифичное τὰ ἀγαθὰ без добавления смысла «благословений».
- source_word: τὴν βασιλείαν
  choice: царскую власть
  rationale: В данном контексте βασιλεία означает полученное правление или царское достоинство, а не территорию царства.
- source_word: τοὺς θεράποντας αὐτοῦ
  choice: Его слуг
  rationale: «Слуги» передаёт принадлежность Богу и служение Ему, не вводя особой культовой или церковной должности.
- source_word: κατακτείνειν
  choice: убивать
  rationale: Прямой и ясный эквивалент; более экспрессивное «истреблять» могло бы чрезмерно усилить значение.
- source_word: τοὺς τῆς εὐσεβείας ἀσκητάς
  choice: тех, кто упражняется в благочестии
  rationale: Передаёт деятельный и дисциплинированный оттенок ἀσκητής, не навязывая позднейшего технического значения слова «аскет».
- source_word: στρεβλοῦν
  choice: подвергать пыткам
  rationale: Глагол обозначает истязание, возможно растягивание на орудии пытки; общий перевод сохраняет смысл, не уточняя не названное в стихе орудие.
theological_decisions:
- issue: Передача εὐσέβεια в контексте иудейского мученичества
  choice: благочестие
  alternative: набожность
  rationale: «Благочестие» сохраняет этико-религиозный смысл ключевого для 4 Маккавейской книги понятия и не сводит его к внешней религиозности.
- issue: Передача θεράποντες как обозначения принадлежащих Богу людей
  choice: слуги
  alternative: служители
  rationale: Греческое слово указывает на служение Богу, но не на установленную должность; «слуги» сохраняет отношение принадлежности без конфессионального уточнения.
- issue: Смысл βασιλεία как Божьего дара правителю
  choice: царская власть
  alternative: царство
  rationale: Контекст говорит о власти, полученной самим тираном от Бога. Перевод не развивает богословских выводов сверх утверждения текста.
translation_notes:
  register: Современный литературный русский язык с возвышенной, резко обличительной интонацией. Историческое настоящее φησίν передано как «говорит она». Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской издательской практике; это не меняет смысла оригинала.
