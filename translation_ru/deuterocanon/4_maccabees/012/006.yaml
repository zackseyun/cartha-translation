  text: And while urging these things[a], he sent for the boy’s mother, so that, having pity on her after she had been deprived of so many sons, he might persuade her to make the one remaining compliant for his deliverance.
translation:
  language: ru
  text: И, продолжая увещевать, он послал за матерью юноши, чтобы, сжалившись над ней, лишившейся стольких сыновей, побудить её склонить оставшегося сына к покорности ради его спасения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть, вероятно, ради избавления от смерти; греческое слово «спасение» может иметь и более широкий смысл.
    reason: Сноска поясняет наиболее вероятный физический смысл σωτηρίαν в данном контексте, сохраняя его возможную смысловую широту.
lexical_decisions:
- source_word: παρακαλῶν
  choice: убеждая
  rationale: В данном контексте причастие обозначает настойчивую попытку воздействовать словами; «убеждая» естественно передаёт эту направленность и не придаёт речи положительного оттенка ободрения.
- source_word: μετεπέμψατο
  choice: велел позвать
  rationale: Средняя форма глагола означает «послать за кем-либо, вызвать»; «велел позвать» естественно звучит по-русски и соответствует властному положению действующего лица.
- source_word: ἐλεήσας
  choice: сжалившись
  rationale: Передаёт заявленный мотив — жалость к матери — без излишне богословского оттенка слова «помиловав».
- source_word: στερηθεῖσαν
  choice: лишившейся
  rationale: Сохраняет смысл утраты стольких сыновей и естественно согласуется с определяемым словом «ней».
- source_word: παρορμήσειεν
  choice: побудить
  rationale: Глагол выражает намерение подтолкнуть мать к воздействию на сына; «побудить» сохраняет причинительный оттенок, не усиливая его до «принудить».
- source_word: σωτηρίαν
  choice: спасения
  rationale: Русское «спасение» сохраняет широту греческого слова, тогда как ближайший контекст указывает прежде всего на избавление от казни.
- source_word: εὐπειθῆ ποιῆσαι
  choice: склонить ... к покорности
  rationale: Оборот означает сделать человека уступчивым, готовым подчиниться; выбранная формулировка естественна по-русски и не представляет такое повиновение как нравственно похвальное.
- source_word: τὸν περιλειπόμενον
  choice: оставшегося сына
  rationale: Причастие указывает на единственного сына, который ещё остался; существительное «сына» восстановлено из непосредственного контекста для ясности.
theological_decisions:
- issue: Значение σωτηρία в повествовании о мученичестве
  choice: «спасение» с пояснением о вероятном избавлении от смерти
  alternative: «избавление» или «сохранение жизни» без сохранения более широкого смысла
  rationale: Непосредственно речь идёт о попытке сохранить юноше жизнь ценой покорности, однако более широкая семантика греческого слова не должна быть полностью устранена из перевода.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Сложная причинительная конструкция греческого текста сохранена, но выстроена естественно для русского синтаксиса.
