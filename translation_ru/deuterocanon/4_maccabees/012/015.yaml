  yaml_path: translation/deuterocanon/4_maccabees/012/015.yaml
  text: But you will wail miserably for putting to death, without cause, the champions of virtue[a][b].
translation:
  language: ru
  text: Но ты горько возрыдаешь о том, что без всякого основания умертвил поборников добродетели[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «борцов за добродетель», «подвижников добродетели». Греческое слово обозначает участников борьбы или состязания и здесь служит почётным наименованием.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «без вины», «несправедливо». Греческое слово может указывать как на невиновность жертв, так и на отсутствие оправдания их казни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ δὲ
  choice: Но ты
  rationale: Передаёт противопоставление и прямое обращение к тирану естественным русским оборотом.
- source_word: κακῶς οἰμώξεις
  choice: горько возрыдаешь
  rationale: Глагол обозначает громкий скорбный плач, а наречие усиливает его; сочетание сохраняет резкий пророчески-обличительный тон и звучит по-русски естественно.
- source_word: τοὺς τῆς ἀρετῆς ἀγωνιστάς
  choice: поборников добродетели
  rationale: ἀγωνιστής называет участника борьбы или состязания и здесь употреблено почётно; «поборники» передаёт идею деятельной борьбы, не создавая исключительно спортивной ассоциации.
- source_word: τῆς ἀρετῆς
  choice: добродетели
  rationale: В нравственно-философском контексте 4 Маккавейской ἀρετή означает прежде всего нравственную добродетель.
- source_word: ἀναίτιως
  choice: без вины
  rationale: Сохраняет смысл отсутствия вины или законного основания, не сводя многозначность наречия только к оценке действия как несправедливого.
- source_word: ἀποκτεῖναι
  choice: о том, что ... умертвил
  rationale: Инфинитив поясняет причину будущего плача; придаточная конструкция ясно выражает эту связь, а «умертвил» соответствует торжественно-трагическому регистру.
theological_decisions:
- issue: Нравственно-философский смысл ἀρετή в контексте мученичества
  choice: добродетель
  alternative: нравственное совершенство
  rationale: «Добродетель» сохраняет понятийный мир эллинистической иудейской нравственной мысли и не привносит позднейшей конфессиональной терминологии.
- issue: Основание осуждения в ἀναίτιως
  choice: без вины
  alternative: несправедливо
  rationale: Выбранный вариант оставляет открытыми взаимосвязанные оттенки отсутствия вины у жертв и отсутствия правого основания для казни.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным обличительным звучанием. «Возрыдаешь» и «умертвил» поддерживают достоинство мученического контекста, а синтаксис остаётся прозрачным для обычного читателя.
