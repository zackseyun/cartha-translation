lexical_decisions:
- source_word: πλησιέστερον
  choice: подойти ближе
  rationale: Сравнительное наречие указывает на сокращение расстояния; по-русски сочетание с «велел» естественно передаёт подразумеваемое движение к говорящему.
- source_word: αὐτὸν
  choice: ему
  rationale: Местоимение мужского рода единственного числа относится к сыну; дательный падеж обусловлен русской конструкцией «велел ему подойти».
- source_word: μετεπέμψατο
  choice: велел ... подойти
  rationale: Средний залог μεταπέμπω означает «послать за кем-либо, вызвать». В данном контексте выбранная конструкция звучит естественно и сохраняет значение побуждения приблизиться.
- source_word: παρηγορεῖν
  choice: ободрить
  rationale: Глагол допускает значения «ободрять, утешать». В контексте попытки склонить юношу к определённому действию «ободрить» передаёт увещательный оттенок, не исключая альтернативы «утешить».
- source_word: ἐπειρᾶτο
  choice: пытался
  rationale: Имперфект среднего залога выражает продолжавшуюся попытку; несовершенный вид русского глагола сохраняет этот аспект.
- source_word: λέγων
  choice: говоря
  rationale: Причастие настоящего времени вводит последующую прямую речь и сохраняет зависимость от глагола «пытался».
