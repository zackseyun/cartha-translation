  text: But even in the present life[a], and after you die, he will punish you.
translation:
  language: ru
  text: Но он накажет тебя и в нынешней жизни, и после того, как ты умрёшь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но он накажет тебя и в нынешней жизни, и после смерти».'
    reason: Более краткая передача временного значения аористного причастия θανόντα; основной текст яснее сохраняет его отнесённость к адресату.
lexical_decisions:
- source_word: σὲ
  choice: тебя
  rationale: Винительный падеж местоимения второго лица единственного числа; это прямое дополнение при глаголе «накажет».
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает противопоставление или переход; в данном контексте естественно передаётся противительным союзом «но».
- source_word: καὶ … καὶ
  choice: и … и
  rationale: Парная конструкция охватывает обе временные сферы наказания — нынешнюю жизнь и состояние после смерти — без усилительного толкования, не обязательного в греческом тексте.
- source_word: ἐν τῷ νῦν βίῳ
  choice: в нынешней жизни
  rationale: Идиоматично передаёт буквальное «в нынешней жизни» и сохраняет противопоставление наказанию после смерти.
- source_word: θανόντα
  choice: после смерти
  rationale: 'Аористное причастие, согласованное с «тебя», имеет временной смысл: наказание постигнет адресата также после того, как он умрёт.'
- source_word: τιμωρήσεται
  choice: он накажет
  rationale: Форма третьего лица единственного числа будущего времени с подразумеваемым из контекста субъектом; активная русская конструкция сохраняет указанную в греческом тексте субъектность и общий карательный смысл.
theological_decisions:
- issue: Подразумеваемый субъект глагола
  choice: он накажет тебя
  alternative: ты будешь наказан
  rationale: Греческий глагол стоит в третьем лице единственного числа и не является пассивом. Местоимение «он» передаёт подразумеваемого из контекста деятеля, не называя и не уточняя его в самом стихе.
- issue: Временные пределы наказания
  choice: и в нынешней жизни, и после смерти
  alternative: и теперь, при жизни, и когда умрёшь
  rationale: Текст прямо охватывает как земную жизнь, так и время после смерти; перевод сохраняет оба измерения, не смягчая посмертного смысла.
translation_notes:
  register: Современный литературный русский язык; тон краткий, строгий и достойный. Порядок слов «тебя он накажет» сохраняет вынесенное вперёд греческое σὲ и подчёркивает адресата угрозы.
