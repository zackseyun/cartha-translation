  text: But those who died nobly fulfilled their godliness toward God;[a]
translation:
  language: ru
  text: Но те, кто умер достойно, в полной мере проявили своё благочестие перед Богом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «довели до полноты своё благочестие по отношению к Богу».'
    reason: Сноска сохраняет образ πλήρωσαν («довели до полноты») и уточняет направленность εἰς τὸν θεόν.
lexical_decisions:
- source_word: ἀλλ᾽
  choice: Но
  rationale: Передаёт противопоставление предыдущему контексту кратким и естественным русским союзом.
- source_word: οἱ μὲν
  choice: те, кто
  rationale: Обозначает одну сторону сопоставления; частица μέν отдельно не выражена, поскольку без явного парного оборота её перевод утяжелил бы фразу.
- source_word: εὐγενῶς
  choice: достойно
  rationale: В контексте мученической смерти обозначает благородный, достойный образ действия; «достойно» звучит естественнее современного русского «благородно умер».
- source_word: ἀποθανόντες
  choice: кто умер
  rationale: Относительное придаточное естественно передаёт завершённое действие аористного причастия, не усиливая значение до «погибли».
- source_word: ἐπλήρωσαν
  choice: до конца исполнили
  rationale: Сохраняет значение доведения до полноты или завершения, заложенное в πληρόω.
- source_word: τὴν ... εὐσέβειαν
  choice: свой долг благочестия
  rationale: «Благочестие» передаёт почтительную верность Богу в поступках; слово «долг» позволяет естественно по-русски сочетать его с «исполнили», не сводя смысл лишь к внутреннему чувству.
- source_word: εἰς τὸν θεόν
  choice: перед Богом
  rationale: Передаёт направленность благочестия к Богу; в русском сочетание «благочестие перед Богом» естественнее буквального «к Богу».
theological_decisions:
- issue: Передача εὐσέβεια в контексте мученичества
  choice: благочестие
  alternative: верность Богу; почитание Бога
  rationale: «Благочестие» охватывает и почтение к Богу, и выраженную в поведении верность, не превращая слово в позднейший узкий богословский термин.
- issue: Значение ἐπλήρωσαν применительно к благочестию
  choice: до конца исполнили свой долг благочестия
  alternative: явили благочестие во всей полноте
  rationale: Основной вариант сохраняет образ исполнения и завершения, не утверждая, что смерть сама по себе заслуживает награду или является отдельным религиозным обрядом.
translation_notes:
  register: Современный литературный русский, сдержанный и торжественный. Синтаксис простой и общедоступный; мученический контекст передан без архаизации и без конфессионально окрашенных добавлений.
