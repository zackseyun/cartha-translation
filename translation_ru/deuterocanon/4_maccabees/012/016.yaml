lexical_decisions:
- source_word: ὅθεν
  choice: Поэтому
  rationale: Передаёт вывод или следствие из предшествующего контекста естественным современным русским союзным наречием.
- source_word: καὶ
  choice: и он сам
  rationale: Сохраняет добавочное или усилительное значение καί в сочетании с эмфатическим αὐτός, не делая русскую фразу неестественной.
- source_word: αὐτὸς
  choice: он сам
  rationale: Передаёт подчёркнутое указание на самого упомянутого человека.
- source_word: ἀποθνήσκειν
  choice: к смерти
  rationale: В сочетании с μέλλων естественно выражает предстоящее наступление смерти; буквальное «собирался умереть» здесь могло бы ошибочно намекать на намерение.
- source_word: μέλλων
  choice: был уже близок
  rationale: Выражает непосредственную близость события без оттенка предопределённости или личного намерения.
- source_word: ἔφη
  choice: сказал
  rationale: Нейтральный и точный русский эквивалент обычного повествовательного глагола речи.
