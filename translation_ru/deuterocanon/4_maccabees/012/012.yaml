base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/012.yaml
  text: For these things, divine justice is storing up for you a denser and eternal fire and torments, which through the whole age will not release you.
translation:
  language: ru
  text: За это божественное правосудие готовит тебе более густой и вечный огонь и мучения, которые не отпустят тебя в течение всего века.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνθ᾽ ὧν
  choice: За это
  rationale: 'Передаёт значение воздаяния: наказание следует в ответ на совершённое.'
- source_word: ταμιεύεταί σε
  choice: готовит тебе
  rationale: Глагол выражает мысль о том, что наказание припасено или приготовлено для адресата; по-русски конструкция звучит естественно и сохраняет направленность на «тебя».
- source_word: πυκνοτέρῳ
  choice: более яростный
  rationale: Буквальное «более плотный» применительно к огню в современном русском неясно; в данном контексте сравнительная форма указывает на усиленный, более жестокий огонь.
- source_word: αἰωνίῳ
  choice: вечный
  rationale: Прямой и традиционно понятный эквивалент прилагательного, относящегося в греческом к «огню».
- source_word: βασάνοις
  choice: мучения
  rationale: Передаёт наказания, причиняющие тяжёлое страдание, без неоправданного сужения до конкретного способа пытки.
- source_word: εἰς ὅλον τὸν αἰῶνα
  choice: на протяжении всего века
  rationale: Сохраняет образ αἰών как целого века или эпохи и не стирает различие между этой фразой и предшествующим αἰωνίῳ.
theological_decisions:
- issue: Соотношение «вечного огня» и мучений «на протяжении всего века»
  choice: Сохранены обе разные временные формулировки греческого текста
  alternative: Унифицировать обе как «вечные» или «во веки веков»
  rationale: Исходный текст использует αἰώνιος при «огне», но отдельное выражение εἰς ὅλον τὸν αἰῶνα при мучениях; перевод не должен заранее устранять возможное смысловое напряжение.
- issue: К чему относится относительное предложение αἱ ... οὐκ ἀνήσουσί σε
  choice: «которые» грамматически относится к «мучениям»
  alternative: Отнести его совместно к огню и мучениям
  rationale: Женский род множественного числа αἱ и ἀνήσουσι согласуется с βασάνοις, тогда как совокупность существительных разного рода ожидала бы форму среднего рода.
translation_notes:
  register: Современный литературный русский, прямое обращение на «ты», высокий, но понятный регистр. Необычная сила πυκνοτέρῳ передана контекстуально словом «яростный», а различие временных выражений и грамматическая отнесённость придаточного сохранены.
