  source_fidelity: 'Основная мысль и синтаксическое движение переданы верно: риторический упрёк, контраст человеческого и звероподобного, отсечение языков, общий материальный состав и переход к одному человеку сохранены. Однако «подобных тебе в страданиях» чрезмерно конкретизирует ὁμοιοπαθεῖς как одинаковое фактическое страдание с мучителем; слово шире и допускает общность человеческого состояния/переживаний. «Ведь ты человек» также ослабляет уступительно-иронический оттенок ἄνθρωπος ὢν.'
