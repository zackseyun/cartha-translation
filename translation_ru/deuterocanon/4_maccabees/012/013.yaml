  terminology: «Стихии» удачно сохраняет στοιχεῖα как древний философский термин; пояснение следует оставить. «Пытать его» точнее и естественнее, чем «подвергать его пыткам» при греческом инфинитиве βασανίσαι. Уточнение «одного из них» в тексте оправдано, поскольку греческое τοῦτον стоит в единственном числе; сноска должна отмечать это как особенность текста, а не выдавать вероятностное объяснение за установленное.
