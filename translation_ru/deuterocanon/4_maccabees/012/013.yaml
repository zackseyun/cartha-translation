base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/012/013.yaml
  text: Were you not ashamed[a], though you are a man, most beastly one, to cut out the tongues of those who share the same sufferings and have come from the same elements, and after mutilating him in this way[b], to torture him?
translation:
  language: ru
  text: Неужели ты, человек, о самый зверский из людей, не постыдился вырезать языки у людей, подобных тебе[a] и происшедших из тех же стихий[b], а затем, так изувечив одного из них[c], пытать его?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «людей той же природы», «людей, подверженных тем же переживаниям (или страстям)». Греческое ὁμοιοπαθεῖς обозначает сходство состояния, переживаний или человеческой природы; оно не обязательно подразумевает одинаковые конкретные страдания.'
    reason: lexical_alternative
  - marker: b
    text: «Стихии» — традиционное обозначение основных элементов, из которых, согласно древним представлениям, состоит материальный мир и человеческое тело.
    reason: cultural_note
  - marker: c
    text: 'В греческом тексте здесь единственное число: «его». После множественного числа речь сосредоточивается на одном из упомянутых мучеников.'
    reason: textual_clarity
lexical_decisions:
- source_word: οὐκ ᾐδέσθης
  choice: Неужели тебе не стало стыдно
  rationale: Риторический вопрос с нравственным укором; формулировка передаёт силу аориста αἰδέομαι и естественно звучит по-русски.
- source_word: ἄνθρωπος ὢν
  choice: ведь ты человек
  rationale: В контексте оборот имеет уступительно-укоризненную силу и подчёркивает противопоставление человека зверю.
- source_word: θηριωδέστατε
  choice: о звероподобнейший
  rationale: Превосходная степень и звательный характер сохранены; «звероподобнейший» удерживает образ θηρίον, хотя намеренно звучит резко и необычно.
- source_word: τοὺς ὁμοιοπαθεῖς
  choice: людей, подобных тебе в страданиях
  rationale: Передаёт общность человеческой подверженности страданию, не сводя многозначное ὁμοιοπαθεῖς к узкому техническому смыслу.
- source_word: καὶ ἐκ τῶν αὐτῶν γεγονότας στοιχείων
  choice: и происшедших из тех же стихий
  rationale: Сохраняет философско-антропологический термин στοιχεῖα и мысль об общем материальном составе людей.
- source_word: γλωττοτομῆσαι
  choice: вырезать языки
  rationale: Ясно и непосредственно передаёт конкретное увечье, обозначенное сложным глаголом.
- source_word: καὶ τοῦτον καταικίσας τὸν τρόπον
  choice: а затем, так изувечив одного из них
  rationale: καταικίζω передано как физическое увечье; τοῦτον истолковано как переход от названной группы к одному подвергаемому пытке человеку, а не как указательное определение к τρόπον.
- source_word: βασανίσαι
  choice: подвергать его пыткам
  rationale: Передаёт тяжёлую физическую пытку и синтаксически согласуется с предшествующим инфинитивом.
theological_decisions:
- issue: Антропологическое противопоставление ἄνθρωπος ὢν ... θηριωδέστατε
  choice: 'Явно сохранить контраст: «ведь ты человек, о звероподобнейший»'
  alternative: «будучи человеком, о жесточайший»
  rationale: Обличительная ирония основана на том, что человек ведёт себя по-звериному; нейтральное «жесточайший» утратило бы исходный образ.
- issue: Значение στοιχεῖα применительно к составу человека
  choice: «стихии» в основном тексте с пояснением
  alternative: «составные части» или «одинаковая телесная природа»
  rationale: «Стихии» сохраняют философскую лексику источника и не навязывают конкретной поздней антропологической схемы.
- issue: Референт единственного числа τοῦτον при множественном τοὺς ὁμοιοπαθεῖς
  choice: Передать как «одного из них» и отметить текстовый переход
  alternative: «таким образом изувечив его» без уточнения перехода
  rationale: Единственное число, вероятно, возвращает внимание к конкретному мученику, однако внезапная смена числа остаётся заметной и не должна быть скрыта.
translation_notes:
  register: Современный литературный русский с достоинством и высокой обличительной риторикой. Синтаксис слегка приподнят, но понятен; необычное «звероподобнейший» сознательно сохраняет превосходную степень и звериный образ греческого обращения.
