  text: Release me[a], he says, so that I may tell the king and all his friends who are with him.
translation:
  language: ru
  text: «Отпусти меня, — говорит он, — чтобы я мог обратиться к царю и ко всем друзьям, которые с ним»[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ко всем находящимся с ним приближённым». Греческое φίλοι может означать как личных друзей, так и царских приближённых или придворных; в основном тексте сохранено наиболее прямое значение — «друзья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπόλυσόν με
  choice: Отпусти меня
  rationale: Аористный императив ἀπολύω выражает прямую просьбу освободить или отпустить говорящего; «отпусти меня» естественно по-русски и не добавляет юридического оттенка.
- source_word: φησίν
  choice: говорит он
  rationale: Сохранено историческое настоящее греческого повествования, придающее сцене живость.
- source_word: εἴπω
  choice: чтобы я мог обратиться
  rationale: Аористный конъюнктив после повелительной формы передаёт цель. При дательном лице «обратиться к» естественно выражает речевое действие, не предполагая конкретного содержания сообщения.
- source_word: τῷ βασιλεῖ
  choice: к царю
  rationale: Дательный обозначает адресата речи и естественно передаётся конструкцией с «к» после глагола «обратиться».
- source_word: τοῖς σὺν αὐτῷ φίλοις πᾶσιν
  choice: ко всем его друзьям, которые с ним
  rationale: «Всем» передаёт πᾶσιν, «друзьям» сохраняет прямое значение φίλοι, а относительное предложение явно воспроизводит σὺν αὐτῷ. Притяжательное «его» естественно указывает на связь с царём, хотя греческое выражение буквально говорит о друзьях, находящихся с ним.
