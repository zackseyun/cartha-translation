  text: И, особенно обрадовавшись обещанию юноши, они быстро развязали его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιχαρέντες
  choice: обрадовавшись
  rationale: Аористное причастие передаёт радость, вызванную обещанием, и естественно связывает её с последующим действием.
- source_word: μάλιστα
  choice: особенно
  rationale: Сохраняет усилительный акцент на обещании как главной причине их радости.
- source_word: ἐπαγγελίᾳ
  choice: обещанию
  rationale: Прямое и контекстуально уместное соответствие существительному со значением обещания или заверения.
- source_word: τοῦ παιδός
  choice: юноши
  rationale: παῖς допускает значения «ребёнок», «отрок», «юноша» или «слуга»; в контексте одного из братьев «юноша» звучит естественно и не создаёт впечатления, что речь идёт о маленьком ребёнке.
- source_word: ταχέως
  choice: быстро
  rationale: Передаёт быстроту последовавшего действия без добавления значения немедленности, которого наречие само по себе не обязательно требует.
- source_word: ἔλυσαν
  choice: развязали
  rationale: Конкретно передаёт λύω в контексте освобождения связанного человека; более общее «освободили» могло бы выйти за пределы непосредственного действия.
