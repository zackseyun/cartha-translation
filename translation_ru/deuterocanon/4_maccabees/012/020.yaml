translation:
  language: ru
  text: Произнеся эту молитву, он бросился на сковороды и так он умер.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отдал»; подразумевается: отдал жизнь.'
    reason: 'Лексическая альтернатива: греческий текст оставляет объект глагола ἀπέδωκεν невыраженным.'
lexical_decisions:
- source_word: καὶ ταῦτα κατευξάμενος
  choice: Произнеся эту молитву
  rationale: Аористное причастие указывает на действие, предшествующее основному; ταῦτα отсылает к содержанию только что произнесённых слов. Такая передача естественна по-русски и сохраняет смысловую связь с предшествующей молитвой.
- source_word: ἑαυτὸν ἔρριψεν
  choice: он бросился
  rationale: Возвратная конструкция передаёт намеренное действие; русский глагол «бросился» выражает его кратко, естественно и достаточно сильно.
- source_word: κατὰ τῶν τηγάνων
  choice: на сковороды
  rationale: κατά с родительным здесь передаёт движение на орудия мучения; τηγάνων обозначает сковороды или жаровни. В основной текст не добавлено отсутствующее в этой фразе определение «раскалённые».
- source_word: ἀπέδωκεν
  choice: умер
  rationale: В данном повествовательном контексте непереходное употребление означает, что мученик отдал жизнь, то есть умер. Ясная русская передача сохраняет эллиптичность греческого оборота в сноске.
theological_decisions:
- issue: Эллиптический смысл ἀπέδωκεν в рассказе о мученичестве
  choice: умер
  alternative: отдал [жизнь] / испустил дух
  rationale: Дополнение «жизнь» или «дух» в греческом тексте прямо не названо. «Умер» точно передаёт результат, не уточняя объект глагола и не привнося дополнительного богословского содержания; буквальная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и торжественное, без архаизмов. Выражение «эту молитву» естественно обобщает ταῦτα и κατευξάμενος, а «и так умер» сохраняет лаконичный итог греческой фразы.
