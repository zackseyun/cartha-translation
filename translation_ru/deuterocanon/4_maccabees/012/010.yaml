lexical_decisions:
- source_word: δραμὼν
  choice: подбежав
  rationale: Аористное причастие от τρέχω обозначает быстрое движение, предшествующее главному глаголу; деепричастие естественно сохраняет последовательность и живость повествования.
- source_word: ἐπὶ πλησίον
  choice: вплотную к
  rationale: Сочетание передаёт движение в непосредственную близость; «вплотную к» выражает и направленность, и близость без тяжеловесности.
- source_word: τῶν τηγάνων
  choice: раскалённым сковородам
  rationale: τήγανον — сковорода или плоская жаровня. В данном контексте это нагретые орудия пытки; «раскалённым» делает контекст понятным, не заменяя предмет толкованием.
- source_word: ἔφη
  choice: он сказал
  rationale: Обычная повествовательная формула введения прямой речи; это наиболее естественный русский эквивалент.
