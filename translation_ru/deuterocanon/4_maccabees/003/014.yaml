lexical_decisions:
- source_word: ἀνευράμενοι
  choice: отыскав
  rationale: Аористное причастие указывает на действие, предшествующее основному; деепричастие «отыскав» естественно передаёт и последовательность, и оттенок успешного поиска.
- source_word: θαρραλέως
  choice: смело
  rationale: Наречие выражает смелость и решительность; «смело» звучит естественно и достойно в современном русском повествовании.
- source_word: τὴν πηγὴν
  choice: источник
  rationale: В данном повествовательном контексте πηγή обозначает природный источник воды.
- source_word: ἐξ αὐτῆς
  choice: из него
  rationale: Местоимение относится к источнику; русский мужской род согласован со словом «источник».
- source_word: ἐγέμισαν
  choice: набрали
  rationale: Буквальное «наполнили» требует по-русски указания сосуда, которого в греческом тексте нет. «Набрали … питья» естественно передаёт действие наполнения водой, не добавляя конкретного сосуда.
- source_word: τῷ βασιλεῖ
  choice: для царя
  rationale: Дательный падеж выражает получателя или того, для кого предназначено питьё; конструкция «для царя» ясна и естественна.
- source_word: τὸ ποτόν
  choice: питья
  rationale: Слово означает питьё, то, что пьют. Родительный после «набрали» представляет естественную русскую конструкцию и не подменяет исходное слово прямо не названной «водой».
