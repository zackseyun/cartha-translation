translation:
  language: ru
  text: Никто не может вырезать гнев из ваших душ, но гневу можно помочь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможное истолкование: «гневом можно воспользоваться» или «гнев можно направить во благо». Буквально по-гречески: «гневу можно помочь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμόν / τῷ θυμῷ
  choice: гнев / гневу
  rationale: Существительное θυμός повторено в греческом тексте и здесь естественно обозначает гнев, страстный порыв. Повтор сохранён, чтобы не скрывать связь между двумя частями высказывания.
- source_word: ἐκκόψαι
  choice: вырезать
  rationale: Глагол буквально означает «вырезать, отсечь». «Вырезать гнев из души» сохраняет яркую метафору удаления, тогда как «устранить» или «искоренить» были бы более сглаженными.
- source_word: ὑμῶν τῆς ψυχῆς
  choice: из вашей души
  rationale: ψυχή в данном нравственно-психологическом контексте передано словом «душа». Местоимение ὑμῶν имеет форму множественного числа, а существительное стоит в единственном; русское «вашей души» допускает обращение к группе как к совокупности и сохраняет число существительного.
- source_word: δυνατὸν βοηθῆσαι
  choice: можно помочь
  rationale: Оборот передаёт возможность оказать помощь. Краткая русская конструкция сохраняет параллель с предшествующим «не может» и не уточняет, в чём именно состоит помощь.
- source_word: τῷ θυμῷ
  choice: гневу
  rationale: Дательный падеж в греческом буквально представляет гнев как того или то, чему оказывается помощь. Необычная формулировка сохранена, а возможные смысловые толкования вынесены в примечание.
theological_decisions:
- issue: Смысл заключительных слов τῷ θυμῷ δυνατὸν βοηθῆσαι
  choice: Сохранить буквальное и парадоксальное «гневу можно помочь».
  alternative: «с гневом можно справиться»; «гнев можно направить на добро»; «гневом можно воспользоваться»
  rationale: Греческая фраза буквально говорит о помощи гневу, но не объясняет её характера. Более гладкая передача заранее разрешила бы напряжение и внесла бы толкование, не выраженное непосредственно в стихе.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и нравственно-философской выразительности оригинала. Необычность последней фразы намеренно не сглажена; пояснение дано в сноске.
