lexical_decisions:
- source_word: ὅθεν
  choice: Поэтому
  rationale: Передаёт следственную связь с предшествующим рассказом, не вводя пространственного значения.
- source_word: ὑπερασπιστῶν
  choice: защитники
  rationale: Широкое военное обозначение защищающих; не уточняет без достаточных оснований, были ли это телохранители или особый отряд.
- source_word: σχετλιάζόντων
  choice: негодовали
  rationale: Передаёт сильное возмущение и недовольство в естественной современной русской форме.
- source_word: ἐπιθυμίᾳ
  choice: желание
  rationale: Нейтрально сохраняет диапазон значения — желание, стремление, жажда — и не усиливает его до «прихоти» или «страсти».
- source_word: δύο νεανίσκοι στρατιῶται καρτεροί
  choice: двое молодых воинов, людей стойких
  rationale: Сохраняет тесную связь «юноши — воины» и отдельно выражает характеристику καρτεροί как стойкость и решимость.
- source_word: καταιδεσθέντες
  choice: устыдившись
  rationale: Отражает реакцию стыда или смущения; объект и точный оттенок этой сжатой конструкции оставлены без дополнительного истолкования.
- source_word: τὰς πανοπλίας καθωπλίσαντο
  choice: облачились во всеоружие
  rationale: Передаёт средний залог («снарядили себя») и значение полного воинского вооружения; оборот соответствует достоинству повествовательного регистра.
- source_word: κάλπιν
  choice: кувшин
  rationale: Кальпис — сосуд или кувшин, обычно для воды; контекст воды понятен из окружающего рассказа, но в самом стихе не назван.
- source_word: ὑπερέβησαν τοὺς τῶν πολεμίων χάρακας
  choice: перешли через укрепления врагов
  rationale: ὑπερέβησαν обозначает преодоление или переход за преграду, а χάρακες — полевые заграждения, частокол либо укрепления; общее «укрепления» сохраняет неопределённость вида сооружения.
