  - severity: low
    issue: Тяжеловесная аппозиция «воинов, людей стойких».
    rationale: Она формально возможна, но неестественна в современном литературном повествовании. Более плавное «молодых, стойких воинов» передаёт те же компоненты, а сноска сохраняет возможную иную группировку.
  - severity: low
    issue: «Укрепления» слишком широко передаёт χάρακες.
    rationale: Слово может относиться к частоколам и полевым заграждениям; «заграждения» не задаёт конкретного типа сооружения и лучше сочетается с «перебрались через».
