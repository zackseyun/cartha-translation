  terminology: «Неразумное» удачно сохраняет противопоставление разуму, существенное для контекста книги, без внесения конфессионального толкования. «Желание», «напрягая», «расслабляя», «иссушало» и «сжигало» сохраняют как предметный, так и образный строй греческого текста. Сноска a корректно маркирована и не превращает возможное значение «во вражеском лагере» в основной текст; сноска b уместно поясняет трудный образ.
