base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/011.yaml
  text: But some irrational desire for the water among the enemies[a], tightening itself upon him, shriveled him, and while loosening him[b], burned him up.
translation:
  language: ru
  text: Но некое неразумное желание воды, находившейся у врагов[a], напрягая его, иссушало и, расслабляя[b], сжигало.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воды во вражеском лагере». Греческое выражение буквально указывает на воду, находившуюся «у врагов».'
    reason: lexical_alternative
  - marker: b
    text: 'Образ намеренно сжат и парадоксален: желание олицетворено как сила, которая одновременно напрягает и расслабляет человека, иссушая и сжигая его изнутри.'
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление предшествующему изложению просто и естественно.
- source_word: τις
  choice: некое
  rationale: Сохраняет неопределённость греческого местоимения и согласуется с существительным среднего рода «желание».
- source_word: ἀλόγιστος
  choice: неразумное
  rationale: Сохраняет важное для 4 Маккавейской книги противопоставление разума и неподвластного разуму влечения; «безрассудное» было бы несколько более оценочным.
- source_word: ἐπιθυμία
  choice: желание
  rationale: Передаёт сильное влечение и сохраняет философскую лексику страстей; «жажда» естественнее в данном контексте, но уже и менее точно.
- source_word: τοῦ παρὰ τοῖς πολεμίοις ὕδατος
  choice: воды, находившейся у врагов
  rationale: Родительный обозначает предмет желания, а παρά с дательным — нахождение воды у врагов; формулировка не уточняет сверх текста, была ли она именно в их лагере.
- source_word: ἐπιτείνουσα
  choice: напрягая его
  rationale: Сохраняет активный телесный образ растягивания или напряжения и явную связь с αὐτόν, не сводя причастие лишь к усилению самого желания.
- source_word: συνέφρυγε
  choice: иссушало
  rationale: Передаёт действие высушивания и изнуряющее телесное воздействие жажды; буквальное «сморщивало» в русском здесь звучало бы неестественно.
- source_word: λύουσα
  choice: расслабляя
  rationale: Передаёт противоположный напряжению образ ослабления, не устраняя намеренно сжатый парадокс греческой фразы.
- source_word: κατέφλεγεν
  choice: сжигало
  rationale: Сохраняет интенсивный образ внутреннего жара и продолжающееся действие имперфекта.
theological_decisions:
- issue: Терминология противопоставления разума и страсти
  choice: ἀλόγιστος передано как «неразумное»
  alternative: «безрассудное» или «неподвластное разуму»
  rationale: «Неразумное» прямо удерживает связь с центральной для книги темой господства разума над страстями, не добавляя нравственной оценки, которой греческое слово само по себе не требует.
- issue: Сжатый парадокс телесного воздействия желания
  choice: Сохранены противоположные действия «напрягая» и «расслабляя»
  alternative: Сгладить образы как «всё сильнее мучая и обессиливая»
  rationale: Греческий текст намеренно соединяет напряжение, ослабление, иссушение и жжение; разъясняющий пересказ устранил бы его подлинную образную напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным синтаксисом. Сохранены философская лексика и телесная образность оригинала; неоднозначное местонахождение воды и парадокс причастий не сглажены.
