  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: противительное ἀλλά, неопределённость τις, концептуально значимое ἀλόγιστος, предмет желания в родительном падеже и παρά с дательным («у врагов»), а также намеренно парадоксальную пару ἐπιτείνουσα / λύουσα. Несовершенные формы «иссушало» и «сжигало» уместно передают образ действия как процесса. Местоположение воды не сужено до лагеря.'
