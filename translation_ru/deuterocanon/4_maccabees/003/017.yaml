base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/017.yaml
  text: For the self-controlled mind is able to conquer the compulsions of the passions[b][a], and to extinguish the burnings of desires.
translation:
  language: ru
  text: Ибо владеющий собой разум[a] способен одолеть принуждающую силу страстей и угасить жар неистовых порывов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «ум»: греческое νοῦς может обозначать разум, мыслительную способность или понимание.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово может обозначать неистовые влечения, исступлённые импульсы или словно жалящие побуждения; его смысл не обязательно ограничен половым желанием.
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατὸς
  choice: способен
  rationale: Предикативное прилагательное выражает способность; современное русское «способен» точно и естественно передаёт эту мысль.
- source_word: σώφρων
  choice: владеющий собой
  rationale: В контексте господства над страстями слово обозначает рассудительную сдержанность и самообладание; оборот сохраняет этический смысл и не звучит архаично.
- source_word: νοῦς
  choice: разум
  rationale: Здесь имеется в виду мыслительная, управляющая способность человека. «Разум» передаёт это точнее, чем более широкое «ум», при сохранении возможной широты значения в сноске.
- source_word: νικῆσαι
  choice: одолеть
  rationale: Глагол несёт образ победы и решительного преодоления; «одолеть» естественно сохраняет эту силу.
- source_word: ἀνάγκας
  choice: принуждающую силу
  rationale: Множественное число обозначает давление или принуждение, исходящее от страстей. По-русски собирательное выражение «принуждающую силу» яснее буквальных «необходимостей».
- source_word: τῶν παθῶν
  choice: страстей
  rationale: В эллинистическом этическом контексте речь идёт о сильных аффектах, подчиняющих человека; традиционное «страсти» сохраняет этот диапазон.
- source_word: σβέσαι
  choice: угасить
  rationale: Глагол употреблён в огненном образе; «угасить» сохраняет метафору и сочетается со словом «жар».
- source_word: τῶν οἴστρων
  choice: неистовых порывов
  rationale: οἶστρος может означать болезненно жалящий импульс, исступление или неистовое влечение. «Неистовые порывы» не сужает смысл исключительно до половой похоти.
- source_word: φλεγμονάς
  choice: жар
  rationale: Слово обозначает воспаление, пылание или жгучий жар. Собирательное «жар» естественно по-русски и сохраняет образ огня.
theological_decisions:
- issue: Антропологический смысл νοῦς
  choice: «разум» как управляющая мыслительная способность
  alternative: «ум» или «понимание»
  rationale: Контекст утверждает способность рассудочной стороны человека противостоять страстям, но не требует добавлять учение о её полной автономии или безусловной достаточности.
- issue: Характер утверждаемой способности
  choice: сохранено простое «способен», без уточнения источника или пределов способности
  alternative: добавить указание на нравственную, природную либо дарованную Богом силу
  rationale: Греческий текст утверждает способность владеющего собой разума, но в этом стихе не объясняет её происхождения и не формулирует более широкого учения о человеческой воле.
translation_notes:
  register: Современный литературный русский язык с достоинством нравственно-философского рассуждения. Причинное «ибо» сохраняет связь с предшествующим доводом; параллель «одолеть… и угасить…» воспроизводит риторическую структуру оригинала. Огненный образ сохранён без неестественной буквальности.
