  text: and to wrestle down the pains of the body[a], though they are extreme, and by the nobility and goodness of reason to spurn all the dominion of the passions.
translation:
  language: ru
  text: и побороть телесные боли, сколь бы сильны они ни были, и благодаря благородству и добродетели разума с презрением отвергнуть[a] все проявления господства страстей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «выплюнуть» или «отплюнуть»; здесь глагол образно выражает презрительное отвержение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλγηδόνας
  choice: боли
  rationale: Слово обозначает боль или мучительное телесное страдание; в сочетании с τῶν σωμάτων естественно перевести как «телесные боли».
- source_word: καθʼ ὑπερβολὴν οὔσας
  choice: сколь бы сильны они ни были
  rationale: Оборот указывает на чрезвычайную силу болей; уступительная конструкция звучит естественно и сохраняет усилительный смысл.
- source_word: καταπαλαῖσαι
  choice: побороть
  rationale: Глагол содержит образ победы в борьбе; «побороть» передаёт его лучше, чем нейтральное «преодолеть».
- source_word: καλοκἀγαθίας
  choice: благородство
  rationale: καλοκἀγαθία обозначает соединение нравственного достоинства, доблести и благородства. «Благородство» сохраняет ёмкость выражения и не сводит его к одной отвлечённой «добродетели».
- source_word: λογισμοῦ
  choice: разума
  rationale: В 4 Маккавейской книге λογισμός — ключевое обозначение рассудочной способности, соотносимой со страстями; «разум» ясно и последовательно передаёт этот термин.
- source_word: ἀποπτύσαι
  choice: с презрением отвергли
  rationale: Буквально глагол означает «выплюнуть», а переносно — презрительно отвергнуть. В основном тексте выбран естественный для современного литературного русского переносный эквивалент, а яркий буквальный образ отмечен в сноске.
- source_word: πάσας τὰς τῶν παθῶν ἐπικρατείας
  choice: все проявления власти страстей
  rationale: ἐπικρατεία обозначает господство или преобладающую власть. Множественное число передано словом «проявления», чтобы сохранить множественность греческого выражения без неестественного русского «все господства».
theological_decisions:
- issue: Синтаксическая роль πάσας τὰς τῶν παθῶν ἐπικρατείας при ἀποπτύσαι
  choice: '«все проявления власти страстей» поняты как винительный субъект инфинитива: они отвергают благородство разума'
  alternative: 'Понять их как объект и перевести: «благородством разума отвергнуть всякую власть страстей»'
  rationale: При ἀποπτύσαι родительный τῆς καλοκἀγαθίας естественно обозначает то, что презрительно отвергают, тогда как винительная группа πάσας τὰς… ἐπικρατείας естественно выступает субъектом конструкции accusativus cum infinitivo. Это сохраняет трудную, напряжённую формулировку греческого текста и не следует синтаксическому переосмыслению английского консультационного слоя.
- issue: Передача λογισμός
  choice: разум
  alternative: рассудочное суждение
  rationale: «Разум» сохраняет центральный философско-нравственный термин книги и не перегружает текст специальной терминологией.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранён образ борьбы в καταπαλαῖσαι, а буквальная резкость ἀποπτύσαι вынесена в сноску. Перевод сознательно отражает греческий синтаксис, несмотря на существенное расхождение с английским консультационным текстом.
