  text: And even while burning with thirst[b][a], he reasoned that it would be an utterly dreadful danger to the soul if the drink were regarded as equivalent to blood.
translation:
  language: ru
  text: Но даже сгорая от жажды, он рассудил, что, если счесть этот напиток равным крови, это было бы для души чудовищной опасностью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть он полагал, что выпить этот напиток значило бы поступить так, словно он пьёт кровь.
    reason: Поясняет сжатую греческую конструкцию и вероятную связь с запретом употреблять кровь, не внося толкование в основной текст.
lexical_decisions:
- source_word: διαπυρούμενος περὶ τὴν δίψαν
  choice: сгорая от жажды
  rationale: Передаёт образ сильного жара в причастии διαπυρούμενος и естественно звучит по-русски применительно к мучительной жажде.
- source_word: ἐλογίσατο
  choice: он рассудил
  rationale: Сохраняет важный для 4 Маккавейской книги мотив разумного нравственного суждения, выраженный глаголом λογίζομαι.
- source_word: πάνδεινον κίνδυνον
  choice: ужаснейшей опасностью
  rationale: Превосходная степень естественно передаёт усилительное значение πάνδεινον, не прибегая к неестественной кальке.
- source_word: τῇ ψυχῇ
  choice: для души
  rationale: В нравственно-философском контексте речь идёт о вреде внутреннему нравственному существу человека, хотя ψυχή само по себе допускает также значение «жизнь».
- source_word: λογισθὲν ἰσοδύναμον
  choice: счесть … равным
  rationale: Передаёт пассивное причастие и идею равной силы или значения без добавочного истолкования.
- source_word: τὸ ποτὸν αἵματι
  choice: этот напиток равным крови
  rationale: Указательное «этот» естественно обозначает конкретное питьё, известное из контекста; буквальное сопоставление с кровью сохранено.
theological_decisions:
- issue: Значение ψυχή в нравственном увещании
  choice: душа
  alternative: жизнь
  rationale: «Душа» сохраняет нравственно-богословский регистр контекста, не навязывая более узкой позднейшей антропологии.
- issue: Смысл сопоставления напитка с кровью
  choice: счесть этот напиток равным крови
  alternative: счесть употребление напитка равносильным употреблению крови
  rationale: Греческая фраза сжата и буквально сопоставляет напиток с кровью. Основной текст сохраняет эту формулировку, а примечание поясняет подразумеваемое действие, не делая его частью перевода.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной риторической выразительностью. Оборот «сгорая от жажды» сохраняет яркий образ оригинала; «ужаснейшая опасность» передаёт усиление πάνδεινον естественно, без архаизма.
