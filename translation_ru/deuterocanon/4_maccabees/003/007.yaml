lexical_decisions:
- source_word: ἐπεὶ γὰρ
  choice: Ибо когда
  rationale: Сочетание сохраняет как пояснительную силу γάρ, так и временное значение ἐπεί; придаточная конструкция остается незавершенной, как и в греческом тексте стиха.
- source_word: διʼ ὅλης ἡμέρας
  choice: весь день
  rationale: Естественно и точно передает продолжительность действия на протяжении целого дня.
- source_word: προσβάλλων
  choice: нападая
  rationale: Причастная форма и военный смысл исходного глагола переданы без излишнего уточнения характера боя.
- source_word: τοῖς ἀλλοφύλοις
  choice: на иноплеменников
  rationale: Сохраняет буквальное значение обозначения людей иного народа, не заменяя его более узким этнонимом «филистимляне».
- source_word: ὁ Δαυείδ
  choice: Давид
  rationale: Традиционная русская форма имени.
- source_word: πολλοὺς αὐτῶν ἀπέκτεινεν
  choice: убил многих из них
  rationale: Прямо и естественно передает значение ἀποκτείνω и местоименную связь.
- source_word: μετὰ τῶν τοῦ ἔθνους στρατιωτῶν
  choice: вместе с воинами народа
  rationale: Передает сопровождение, выраженное μετά с родительным падежом, и сохраняет буквальное «народа», не добавляя отсутствующего в греческом притяжательного местоимения.
