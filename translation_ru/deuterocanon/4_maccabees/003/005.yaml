lexical_decisions:
- source_word: λογισμός
  choice: разум
  rationale: В 4 Маккавейской это ключевое обозначение способности к рациональному суждению и нравственному самообладанию; «разум» кратко и естественно передаёт философский смысл.
- source_word: ἐκριζωτής
  choice: не искореняет
  rationale: Греческое существительное буквально обозначает того, кто вырывает с корнем. Глагольная конструкция звучит по-русски естественно и сохраняет образ полного искоренения.
- source_word: τῶν παθῶν
  choice: страсти
  rationale: В данном нравственно-философском контексте πάθη — это сильные чувства и влечения, противостоящие разумному управлению; традиционное слово «страсти» сохраняет этот широкий смысл.
- source_word: ἀνταγωνιστής
  choice: противоборствует им
  rationale: Слово обозначает противника, вступающего в борьбу. Глагольная передача ясно выражает продолжающееся противостояние страстям, а не их уничтожение.
theological_decisions:
- issue: Отношение разума к страстям
  choice: Разум не устраняет страсти полностью, а ведёт борьбу с ними.
  alternative: Разум — не искоренитель страстей, а их противник.
  rationale: Перевод сохраняет утверждаемое автором различие между искоренением страстей и противоборством им, не приписывая тексту учение о полном бесстрастии.
translation_notes:
  register: Современный литературный русский язык; краткая афористичная фраза. Глагольный параллелизм выбран вместо тяжеловесных существительных «искоренитель» и «противник», при этом образ искоренения и смысл противоборства сохранены.
