base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/008.yaml
  text: Then[a], when evening had come, sweating and very exhausted, he came to the royal tent[b], around which the whole army of his forefathers had encamped.
translation:
  language: ru
  text: И вот, когда наступил вечер, он, весь в поту и крайне изнурённый, пришёл к царскому шатру[a], вокруг которого расположилось лагерем всё войско его предков[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к шатру царя». Греческое прилагательное означает «царский» и в данном военном контексте может обозначать шатёр правителя.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое выражение сжато; возможно также: «всё войско его праотцов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε δὴ
  choice: И вот
  rationale: Сочетание вводит следующий момент повествования с лёгким усилением; «и вот» естественно передаёт переход и выразительность частицы δὴ, не перегружая фразу.
- source_word: γενομένης ἑσπέρας
  choice: когда наступил вечер
  rationale: Родительный самостоятельный оборот обозначает временное обстоятельство; перевод сохраняет наступление вечера как предшествующий фон действия.
- source_word: ἱδρῶν
  choice: весь в поту
  rationale: Причастие описывает состояние героя при прибытии. Русское выражение звучит естественно и сохраняет наглядность греческого текста.
- source_word: σφόδρα κεκμηκώς
  choice: крайне изнурённый
  rationale: Наречие σφόδρα усиливает перфектное причастие, обозначающее наступившее и сохраняющееся состояние сильной усталости.
- source_word: ἐπὶ τὴν βασίλειον σκηνήν
  choice: к царскому шатру
  rationale: βασίλειος значит «царский, царственный», а σκηνή в военном контексте — «шатёр». Формулировка сохраняет возможность понимать его как шатёр царя.
- source_word: περὶ ἣν
  choice: вокруг которого
  rationale: Предлог περί здесь выражает пространственное расположение вокруг шатра.
- source_word: ὁ πᾶς τῶν προγόνων στρατός
  choice: всё войско его предков
  rationale: Перевод сохраняет сжатую родительную конструкцию и родовое значение προγόνων, не уточняя, о каких именно предках идёт речь. Местоимение «его» необходимо по-русски для ясности связи.
- source_word: ἐστρατοπέδευκεν
  choice: расположилось лагерем
  rationale: Перфект передаёт завершённое размещение войска и его наличное состояние к моменту прибытия; русская форма естественно выражает эту последовательность.
theological_decisions:
- issue: Кого обозначают «его предки» в историческом повествовании
  choice: Сохранить общее родовое обозначение без имён и дополнительных исторических отождествлений.
  alternative: Уточнить, что речь идёт о конкретных предках героя или о войске Израиля прежних времён.
  rationale: Греческое τῶν προγόνων не называет конкретных лиц или эпоху; уточнение внесло бы в перевод сведения, отсутствующие в стихе.
translation_notes:
  register: Современный литературный русский язык с повествовательной торжественностью без архаизации. «Шатёр» соответствует военному лагерному контексту; «предки» понятнее современному читателю, чем более архаичное «праотцы».
