  source_fidelity: 'Смысл лексики в целом передан точно: εὐνομία сохранена в широком значении законопослушания, ἱερουργία не сужена до исключительно священнической службы, а πολιτεία удачно передана как «гражданское устройство». Однако в основном тексте следует явно выразить результативный союз ὥστε («так что»): без него переход от благополучия предков к действиям Селевка в русском предложении синтаксически и логически недостаточно оформлен.'
