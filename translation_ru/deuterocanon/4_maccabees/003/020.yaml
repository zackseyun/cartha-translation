base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/020.yaml
  text: For since our fathers had deep peace because of their law-abidingness[a], and prospered, so that even Seleucus Nicanor, the king of Asia, set apart money for them for the sacred service and approved their polity[b],
translation:
  language: ru
  text: Ведь наши отцы благодаря законопослушанию[a] жили в прочном мире и благоденствовали, так что даже Селевк Никанор, царь Азии, выделил им средства на священное служение и одобрил их гражданское устройство[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодаря доброму порядку»; возможно также: «благодаря соблюдению Закона». Греческое слово обозначает упорядоченную жизнь по закону и в данном контексте может подразумевать верность иудейскому Закону.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их общественный уклад» или «их установления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βαθεῖαν εἰρήνην
  choice: жили в глубоком мире
  rationale: Сохранён образ «глубокого мира», но русская конструкция с глаголом «жили» звучит естественнее буквального «имели глубокий мир».
- source_word: διὰ τὴν εὐνομίαν
  choice: благодаря законопослушанию
  rationale: εὐνομία обозначает надлежащую жизнь по закону и общественный порядок; «законопослушание» передаёт правовой оттенок, не сводя значение исключительно к соблюдению Торы.
- source_word: ἔπραττον καλῶς
  choice: благоденствовали
  rationale: Идиома означает, что они жили хорошо, преуспевали; «благоденствовали» естественно связывает мир и процветание.
- source_word: ἀφορίσαι
  choice: выделил
  rationale: Глагол выражает назначение или отделение средств для определённой цели; «выделил» является ясным современным эквивалентом.
- source_word: χρήματα εἰς τὴν ἱερουργίαν
  choice: средства на священное служение
  rationale: Формулировка сохраняет широту ἱερουργία и не ограничивает его исключительно священническими обязанностями, хотя храмовый контекст подразумевается.
- source_word: τὴν πολιτίαν αὐτῶν
  choice: их гражданское устройство
  rationale: πολιτεία здесь относится к общественно-правовому укладу общины; «гражданское устройство» сохраняет политико-общественный смысл без утверждения полной государственности.
- source_word: ἀποδέχεσθαι
  choice: одобрил
  rationale: Глагол обозначает благосклонное принятие или признание; в контексте царского отношения уместно «одобрил».
- source_word: Σέλευκον τὸν Νικάνορα
  choice: Селевк Никанор
  rationale: Передана форма имени и прозвания, засвидетельствованная непосредственно в данном греческом тексте, без исторической гармонизации.
theological_decisions:
- issue: Связь εὐνομία с верностью иудейскому Закону
  choice: законопослушание
  alternative: добрый порядок; соблюдение Закона
  rationale: В иудейском контексте соблюдение Закона, вероятно, подразумевается, однако само греческое слово шире и может означать упорядоченную жизнь под властью закона. Основной текст сохраняет эту широту, а примечание указывает варианты.
- issue: Объём значения πολιτεία
  choice: гражданское устройство
  alternative: государственное устройство; общественный уклад; установления общины
  rationale: Перевод сохраняет общественно-политическое значение слова, не приписывая иудейской общине независимой государственности и не сводя термин лишь к частному образу жизни.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным историческим регистром. Синтаксическая незавершённость в конце сохранена запятой, поскольку греческий стих образует придаточную часть продолжающегося периода. Имя «Селевк Никанор» передано по данной греческой форме без исправления по внешним историческим данным.
