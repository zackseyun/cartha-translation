  text: And now the time also calls us to the demonstration of the history of rational self-control.
translation:
  language: ru
  text: Теперь само время призывает нас перейти к доказательству, которое даёт повествование о самообладанном разуме.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к доказательству повествования о самообладанном разуме». Родительная конструкция допускает также передачу: «к доказательству посредством повествования»; далее автор приводит повествовательные примеры в подтверждение своего тезиса.'
    reason: Сохраняет заметность синтаксической неоднозначности ἀπόδειξιν τῆς ἱστορίας и поясняет избранную естественную русскую передачу, не закрепляя спорное отношение как единственно возможное.
lexical_decisions:
- source_word: καιρός
  choice: время
  rationale: Передаёт наступивший подходящий момент для перехода от рассуждения к историческому повествованию; «само» естественно выражает риторическую силу оборота.
- source_word: ἀπόδειξις
  choice: доказательство
  rationale: 'Сохраняет аргументативный смысл: последующее повествование должно подтвердить ранее сформулированный тезис.'
- source_word: ἱστορία
  choice: повествование
  rationale: В данном контексте речь идёт не об истории как научной дисциплине, а о следующем далее рассказе, служащем подтверждением тезиса.
- source_word: σώφρων λογισμός
  choice: благоразумный разум
  rationale: Сохраняет сочетание нравственной рассудительности и разумного суждения, не сводя выражение только к самоконтролю.
theological_decisions:
- issue: Связь ἀπόδειξις и ἱστορία
  choice: доказательство посредством повествования
  alternative: доказательство повествования / доказательство истории
  rationale: Греческая родительная конструкция допускает формально более буквальное чтение, но ход сочинения показывает, что исторический рассказ выступает средством доказательства тезиса о разуме. Неясность конструкции отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством философского пролога. Формулировка остаётся понятной широкому читателю, сохраняя ключевую лексику доказательства, повествования и благоразумного разума.
