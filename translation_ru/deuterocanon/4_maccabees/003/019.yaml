  source_fidelity: Греч. ἐπὶ τὴν ἀπόδειξιν τῆς ἱστορίας τοῦ σώφρονος λογισμοῦ связывает «доказательство» с «повествованием/историей» в родительной конструкции. В черновике оборот «доказательству посредством повествования» делает одно из возможных контекстуальных истолкований частью основного текста и тем самым несколько сглаживает исходную связь. σώφρων относится к нравственной умеренности, самообладанию, а не просто к благоразумию.
  naturalness: «Благоразумный разум» для современного литературного русского звучит тяжеловесно и семантически тавтологично. «Рассудительный разум» естественнее, но само по себе не вполне передаёт этический оттенок σώφρων; его следует сохранить в определении «самообладанный».
  terminology: ἱστορία передано как «повествование», что уместно в данном риторическом переходе. «Самообладанный разум» сохраняет ключевую связку σώφρων λογισμός без конфессионального или психологизирующего переосмысления. Английское audit-rendering «history of rational self-control» подтверждает необходимость сохранить одновременно повествовательный и этический аспекты, но не требует кальки «история».
