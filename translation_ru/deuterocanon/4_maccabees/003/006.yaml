lexical_decisions:
- source_word: ἔστιν γοῦν
  choice: Итак, ... можно
  rationale: Частица γοῦν подводит к подтверждающему примеру и имеет выводно-переходную силу; «итак» естественно передаёт её в данном контексте. Безличное «можно» соответствует конструкции ἔστιν с инфинитивом.
- source_word: τοῦτο
  choice: это
  rationale: Местоимение отсылает к предшествующему рассуждению, не уточняя его сверх греческого текста.
- source_word: διὰ τῆς ... δίψης
  choice: на примере жажды
  rationale: διά с родительным указывает здесь на средство, через которое мысль становится яснее; в русском контексте доказательного примера оборот «на примере» звучит естественно и сохраняет функцию выражения.
- source_word: Δαυεὶδ τοῦ βασιλέως
  choice: царя Давида
  rationale: Таков естественный современный русский эквивалент греческого приложения «Давида, царя».
- source_word: δίψης
  choice: жажды
  rationale: Прямой эквивалент существительного; усиление в оригинале отсутствует.
- source_word: σαφέστερον
  choice: яснее
  rationale: Сравнительная степень наречия точно передаётся русским «яснее».
- source_word: ἐπιλογίσασθαι
  choice: понять
  rationale: В контексте рассуждения глагол обозначает постижение посредством обдумывания. «Понять» даёт естественный русский текст, а более буквальные оттенки размышления сохранены в примечании.
