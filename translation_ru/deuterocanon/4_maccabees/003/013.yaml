  text: And after escaping the notice of the gate guards[a], they kept going through, having made their way through the whole camp of the enemy.
translation:
  language: ru
  text: И, оставшись незамеченными стражами у ворот, они продолжали идти через весь вражеский лагерь, найдя путь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Конец греческой фразы выражен сжато: при причастии «найдя» дополнение не названо. По контексту подразумевается, что они нашли путь или проход через лагерь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαθόντες
  choice: оставшись незамеченными
  rationale: Аористное причастие λανθάνω с винительным дополнением означает, что действующие лица избежали чьего-либо внимания; русская формулировка естественно передаёт это обстоятельство.
- source_word: τοὺς τῶν πυλῶν ἀκροφύλακας
  choice: стражами у ворот
  rationale: ἀκροφύλακες обозначает стражей или дозорных, а родительный оборот указывает место их службы — ворота.
- source_word: διεξῄεσαν
  choice: они продолжали продвигаться
  rationale: Имперфект передаёт длительное движение, а сложный глагол — продвижение через пространство; оборот сохраняет процессуальный оттенок без неестественного буквального повторения.
- source_word: εὑράμενοι
  choice: найдя путь
  rationale: Буквально причастие означает «найдя»; подразумеваемое дополнение восстановлено минимально, поскольку без него русская фраза была бы неполной. Сжатость греческой конструкции отмечена в сноске.
- source_word: κατὰ πᾶν τὸ τῶν πολεμίων στρατόπεδον
  choice: через весь вражеский лагерь
  rationale: κατά с винительным здесь имеет пространственный смысл, πᾶν охватывает лагерь целиком, а τῶν πολεμίων естественно передаётся русским определением «вражеский».
