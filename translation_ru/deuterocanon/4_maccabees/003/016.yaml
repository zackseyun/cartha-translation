lexical_decisions:
- source_word: ὅθεν
  choice: Поэтому
  rationale: Слово вводит вывод из предшествующего рассуждения; «поэтому» ясно и естественно передаёт логическую связь.
- source_word: ἀντιθεὶς
  choice: противопоставив
  rationale: 'Аористное причастие обозначает сознательное действие: герой поставил разум в противовес желанию.'
- source_word: τῇ ἐπιθυμίᾳ
  choice: желанию
  rationale: «Желание» сохраняет широкий смысл ἐπιθυμία и не сужает его до телесного аппетита или эмоциональной страсти.
- source_word: τὸν λογισμόν
  choice: разум
  rationale: В 4 Маккавейской книге λογισμός — ключевое понятие разумной способности или рассудочного суждения, противостоящего желаниям; краткое «разум» естественно передаёт этот контраст.
- source_word: ἔσπεισεν
  choice: возлил
  rationale: Глагол σπένδω обозначает культовое возлияние; русский глагол «возлить» сохраняет жертвенный оттенок без избыточного пояснения в основном тексте.
- source_word: τὸ πόμα
  choice: этот напиток
  rationale: Буквально существительное означает «напиток»; указательное «этот» естественно отсылает к напитку, названному в контексте, а культовый смысл выражен глаголом.
- source_word: τῷ θεῷ
  choice: Богу
  rationale: Дательный падеж обозначает адресата культового действия; форма «Богу» непосредственно и естественно передаёт греческую конструкцию.
theological_decisions:
- issue: Культовый оттенок σπένδω при τὸ πόμα
  choice: Передать глаголом «возлил», указывающим на жертвенное возлияние Богу.
  alternative: «вылил напиток Богу» или развёрнуто «принёс напиток Богу как возлияние»
  rationale: Культовый смысл содержится в самом греческом глаголе. «Возлил» сохраняет его в тексте, не превращая перевод в пояснительный пересказ.
translation_notes:
