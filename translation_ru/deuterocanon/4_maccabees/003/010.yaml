  rationale: καίπερ имеет уступительное значение, ἀφθόνους указывает на изобилие, а πηγάς сохраняется в конкретном значении «источники».
- source_word: οὐκ ἠδύνατο διʼ αὐτῶν
  choice: не мог ... ими
  rationale: 'Сохраняется невозможность и инструментальное значение διʼ αὐτῶν: источники не смогли послужить средством избавления от жажды.'
- source_word: ἰάσασθαι τὴν δίψαν
  choice: утолить ... жажду
  rationale: «Утолить жажду» — естественное современное русское выражение; медицинская метафора глагола ἰάομαι («исцелять») отмечена в сноске.
