- source_word: ἐπὶ τὸ δεῖπνον
  choice: на ужине
  rationale: δεῖπνον обозначает основную вечернюю трапезу, а конструкция с ἐπί и винительным падежом здесь указывает на присутствие за этой трапезой. «На ужине» сохраняет конкретную обстановку и не уточняет сверх текста, ели ли они уже.
- source_word: ἦσαν
  choice: были
  rationale: Простая форма прошедшего времени глагола εἰμί передана без добавления подразумеваемых значений вроде «собрались» или «присутствовали».
