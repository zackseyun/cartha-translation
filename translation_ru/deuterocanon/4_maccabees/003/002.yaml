  text: For example[a], reason cannot cut off any one of your desires, but reason can make it possible not to be enslaved to desire.
translation:
  language: ru
  text: Например, никто из вас не может искоренить желание, но разум может дать человеку возможность не быть порабощённым желанием.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἷον
  choice: Например
  rationale: Передаёт ввод иллюстративного примера и естественно связывает стих с предшествующим рассуждением.
- source_word: ἐπιθυμίαν / τῇ ἐπιθυμίᾳ
  choice: желание / у желания
  rationale: Сохраняет нейтральное основное значение слова и лексическую связь между обоими употреблениями, не усиливая его до «страсти» или «похоти».
- source_word: τις ὑμῶν
  choice: никто из вас
  rationale: При отрицании сочетание естественно означает «никто из вас». В греческом это подлежащее первой части; подлежащее «разум» появляется лишь во второй части.
- source_word: ἐκκόψαι
  choice: искоренить
  rationale: Греческий глагол буквально связан с отсечением. Русское «искоренить желание» сохраняет образ полного устранения и звучит естественнее, чем «отсечь желание».
- source_word: δουλωθῆναι
  choice: оказался в рабстве
  rationale: Сохраняет явную метафору рабства и пассивную направленность действия, не смягчая её до простого «подчинения».
- source_word: ὁ λογισμός
  choice: разум
  rationale: Кратко и последовательно передаёт ключевое для 4 Маккавейской книги понятие разумной способности или рассудочного суждения.
- source_word: παρασχέσθαι
  choice: может сделать так
  rationale: Естественно передаёт способность разума обеспечить или сделать возможным последующее положение дел, не приписывая ему устранение самого желания.
theological_decisions:
- issue: Соотношение разума и желания
  choice: Желание нельзя искоренить, но разум способен не допустить порабощения человека желанием.
  alternative: Разум сам не может отсечь ни одного желания, но может обеспечить неподчинение желанию.
  rationale: Греческое τις ὑμῶν является подлежащим первой части («никто из вас»), тогда как ὁ λογισμός — выраженное подлежащее второй. Перевод сохраняет нравственно-философское различие между устранением желания и свободой от его власти, не разрешая напряжение в пользу подавления желаний.
translation_notes:
  register: Современный литературный русский язык с умеренно философским и dignified регистром. Формулировка понятна широкому читателю; метафора рабства сохранена. В отличие от английского консультационного текста, подлежащим первой части признано τις ὑμῶν, а не ὁ λογισμός, согласно греческому синтаксису.
