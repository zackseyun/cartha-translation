  yaml_path: translation/deuterocanon/4_maccabees/003/021.yaml
  text: Then indeed some[a], having stirred up revolt against the common harmony[b], made use of calamities in many ways.
translation:
  language: ru
  text: Тогда-то некоторые, восстав против общего согласия[a], самыми разными способами воспользовались бедствиями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «затеяв переворот против общего единодушия». Глагол νεωτερίζω может иметь более выраженный политический смысл — поднимать мятеж или совершать переворот.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «использовали бедствия»; возможно также: «эксплуатировали несчастья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε δὴ
  choice: Тогда-то
  rationale: Частица δή придаёт временному указанию подчёркнутый характер; форма «тогда-то» естественно передаёт и время, и акцент.
- source_word: τινες
  choice: некоторые
  rationale: Сохраняет неопределённость греческого местоимения без уточнения личности или группы.
- source_word: πρὸς τὴν κοινὴν ὁμόνοιαν
  choice: против общего согласия
  rationale: При νεωτερίσαντες предлог πρός имеет направленно-враждебный смысл, а ὁμόνοια обозначает согласие и единодушие в сообществе.
- source_word: νεωτερίσαντες
  choice: восстав
  rationale: Глагол здесь, вероятно, имеет политический оттенок мятежа или переворота; «восстав» передаёт его ёмко, не уточняя масштаб выступления.
- source_word: πολυτρόπως
  choice: самыми разными способами
  rationale: Передаёт множественность способов действия естественным современным русским выражением.
- source_word: ἐχρήσαντο συμφοραῖς
  choice: воспользовались бедствиями
  rationale: χράομαι с дательным означает «пользоваться, использовать», а συμφοραί — бедствия или несчастья; выбранная формулировка сохраняет подразумеваемое извлечение выгоды, не добавляя цели.
