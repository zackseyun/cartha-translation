base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/003/004.yaml
  text: Reason cannot cut off any one of your evil tendencies[c][b][a], but it is able to join in helping you not to bend to that evil tendency.
translation:
  language: ru
  text: Никто из вас не может искоренить[a] порочность[b], но разум способен помочь вам не поддаться ей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вырубить» или «отсечь», то есть полностью устранить.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «злонравие», «злобу» или «дурной нрав». Греческое слово обозначает порочную нравственную установку, а не просто отдельный злой поступок.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не быть согнутыми ею»; по смыслу — не уступить ей, не оказаться под её властью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κακοήθειάν / τῇ κακοηθείᾳ
  choice: порочность / ей
  rationale: Существительное обозначает дурной нрав, злонравие или порочную внутреннюю установку, а не отдельный злой поступок. «Порочность» естественно передаёт нравственную характеристику и позволяет сохранить единство референта во второй части местоимением «ей».
- source_word: τις ὑμῶν
  choice: никто из вас
  rationale: 'τις — подлежащее, а ὑμῶν — партитивный родительный: буквально «кто-либо из вас». В сочетании с οὐ смысл по-русски естественно выражается как «никто из вас». Это исправляет синтаксически невозможное отнесение τις к винительному κακοήθειάν.'
- source_word: οὐ δύναται ἐκκόψαι
  choice: не может искоренить
  rationale: ἐκκόπτω буквально значит «вырубить, отсечь», а переносно — устранить полностью. «Искоренить» сохраняет образ полного удаления и звучит естественно применительно к порочности.
- source_word: τὸ μὴ καμφθῆναι
  choice: не поддаться
  rationale: Буквально оборот означает «не быть согнутым»; в нравственном контексте речь о том, чтобы не уступить воздействию порочности. «Не поддаться» ясно передаёт смысл, а исходный образ отмечен в сноске.
- source_word: δυνατὸν ὁ λογισμὸς συμμαχῆσαι
  choice: разум способен помочь
  rationale: λογισμός здесь — ключевое для книги понятие рассудочного нравственного суждения; современное русское «разум» передаёт его без ненужной персонификации. συμμαχέω буквально описывает помощь союзника, но «способен помочь» естественно выражает функцию разума в данном контексте.
theological_decisions:
- issue: Возможности разума в отношении порочности
  choice: Разум не искореняет саму порочность, но способен помочь человеку не поддаться ей.
  alternative: 'Можно было бы передать вторую часть более буквально: «разум способен выступить союзником в том, чтобы не склониться перед порочностью».'
  rationale: Перевод сохраняет противопоставление между невозможностью полностью устранить дурную нравственную установку и реальной способностью разума содействовать сопротивлению ей, не привнося учения ни о полной автономии разума, ни о его полном бессилии.
translation_notes:
  register: 'Современный литературный русский, ясный и достойный по тону. Синтаксис приведён в соответствие с греческим оригиналом: τις ὑμῶν понято как подлежащее «никто из вас», а не как определение к κακοήθειαν. Строчная форма «разум» избегает превращения отвлечённого понятия в имя собственное; союзнический оттенок συμμαχῆσαι передан естественным глаголом «помочь».'
