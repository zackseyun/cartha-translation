  yaml_path: translation/deuterocanon/4_maccabees/003/001.yaml
  text: But this line of reasoning is utterly ridiculous[a], for reason evidently does not prevail over its own passions[b], but over bodily ones.
translation:
  language: ru
  text: 'Но такое рассуждение совершенно нелепо[a]: ведь разум, по-видимому, не господствует над собственными страстями, а над телесными[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «такой довод». Греческое λογισμός может означать рассуждение, разумную способность или выдвигаемый довод.'
    reason: lexical_alternative
  - marker: b
    text: То есть над телесными страстями или влечениями; в греческом тексте прилагательное «телесные» употреблено как существительное.
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιδῇ γελοῖος
  choice: совершенно нелепо
  rationale: Наречие κομιδῇ усиливает γελοῖος; сочетание передаёт резкую оценку естественным современным русским языком.
- source_word: λογισμός (первое употребление)
  choice: рассуждение
  rationale: В первой части речь идёт о разбираемом ходе мысли; «рассуждение» сохраняет аргументативный смысл и не смешивает его с разумом как способностью.
- source_word: λογισμός (второе употребление)
  choice: разум
  rationale: Во второй части λογισμός обозначает разумную способность, которой приписывается власть над страстями.
- source_word: τῶν ἑαυτοῦ παθῶν
  choice: над собственными страстями
  rationale: πάθη в философском контексте означает страсти или аффекты, а ἑαυτοῦ подчёркивает их принадлежность самому разуму.
- source_word: ἐπικρατεῖν
  choice: властвует над
  rationale: Глагол обозначает преобладание и господство; «властвует над» сохраняет философский регистр и управление контрастными дополнениями.
- source_word: φαίνεται
  choice: очевидно
  rationale: Передаёт значение явности или видимости вывода, не превращая его в утверждение о способности.
- source_word: τῶν σωματικῶν
  choice: над телесными
  rationale: Субстантивированное прилагательное оставлено кратким, как в греческом; из контекста подразумеваются телесные страсти или влечения.
theological_decisions:
- issue: Различение рассуждения и разума при повторе λογισμός
  choice: Первое λογισμός переведено как «рассуждение», второе — как «разум».
  alternative: Единообразно переводить оба употребления как «разум» или «рассуждение».
  rationale: Контекст допускает риторический переход от критикуемого тезиса к разуму как способности. Различение делает ход мысли понятным, не устраняя философского напряжения.
- issue: Сфера власти разума над страстями
  choice: Сохранено буквальное противопоставление «не над собственными страстями, а над телесными».
  alternative: Пояснить в основном тексте, что речь идёт о телесных страстях или влечениях.
  rationale: Греческий текст выражен сжато и несколько парадоксально; пояснение вынесено в сноску, чтобы не разрешать неоднозначность внутри перевода.
translation_notes:
  register: Современный литературный русский язык с умеренно философским, достоинственным регистром. Двоеточие естественно вводит обоснование, выраженное γάρ; повтор «над» делает противопоставление ясным. Все маркеры сносок присутствуют в основном тексте.
