  text: And the one who had been saved unexpectedly went away, to report to the king the things that had happened to him.
translation:
  language: ru
  text: А тот, неожиданно спасшись, отправился сообщить царю о том, что с ним произошло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδόξως
  choice: неожиданно
  rationale: Наречие указывает на удивительный, противный ожиданиям характер спасения. «Неожиданно» естественно звучит по-русски и не добавляет прямо не выраженного указания на чудо.
- source_word: διασωθεὶς
  choice: спасшись
  rationale: Аористное страдательное причастие обозначает благополучное избавление от опасности; возвратная форма «спасшись» в данном контексте передаёт результат, не уточняя, кем или каким образом он был спасён.
- source_word: ᾤχετο
  choice: отправился
  rationale: Форма глагола передаёт удаление или уход; «отправился» естественно сочетается с последующим причастием цели и сохраняет повествовательный регистр.
- source_word: δηλώσων
  choice: сообщить
  rationale: 'Будущее причастие выражает цель ухода: он отправился, чтобы довести случившееся до сведения царя. Русский инфинитив естественно передаёт эту конструкцию.'
- source_word: τὰ συμβάντα αὐτῷ
  choice: о том, что с ним произошло
  rationale: Субстантивированное причастие с дательным обозначает пережитые им события; выбранная формулировка точна, ясна и современна.
