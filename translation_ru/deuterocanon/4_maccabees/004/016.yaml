base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/016.yaml
  text: He deposed Onias from the high priesthood and appointed Jason[a], his brother, as high priest, after he promised to give, if he would grant him the office, three thousand six hundred sixty talents per year.
translation:
  language: ru
  text: Он лишил Онию первосвященства и поставил первосвященником Иасона, брата Онии, обещавшего давать[a] по три тысячи шестьсот шестьдесят талантов в год, если ему доверят эту должность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обещавшего платить». В греческом тексте буквально: «обещавшего давать»; порочный характер этой выплаты подразумевается контекстом.'
    reason: 'Лексическая альтернатива: буквальное δώσειν не уточняет само по себе, является ли передача денег платой или взяткой.'
lexical_decisions:
- source_word: καταλύσας τὸν Ὀνίαν τῆς ἀρχιερωσύνης
  choice: лишил Онию первосвященства
  rationale: В данном контексте καταλύω означает прекратить пребывание Онии в должности, а конструкция с родительным падежом указывает на лишение первосвященства. Русская формулировка точно и естественно передаёт официальное отстранение.
- source_word: Ἰάσονα τὸν ἀδελφὸν αὐτοῦ
  choice: его брата Иасона
  rationale: 'Местоимение αὐτοῦ естественнее всего относится к Онии: Иасон назван его братом. Порядок слов выбран в соответствии с нормами современного русского языка.'
- source_word: κατέστησεν ἀρχιερέα
  choice: поставил первосвященником
  rationale: Глагол καθίστημι здесь обозначает официальное назначение на должность. «Поставил первосвященником» сохраняет библейское достоинство стиля и остаётся понятным современному читателю.
- source_word: ὑποσχόμενον δώσειν
  choice: обещавшего давать
  rationale: Причастие относится к Иасону, а инфинитив δώσειν буквально означает «дать». Несовершенный вид «давать» уместен по-русски из-за оговорённой ежегодной выплаты и не вводит прямо отсутствующего в греческом тексте понятия взятки.
- source_word: εἰ ἐπιτρέψειεν αὐτῷ τὴν ἀρχήν
  choice: если ему доверят эту должность
  rationale: ἡ ἀρχή здесь означает власть или должность, о которой идёт речь, то есть первосвященство. Безличная русская конструкция не перегружает фразу повторными местоимениями и сохраняет условный характер обещания.
- source_word: κατʼ ἐνιαυτὸν τρισχίλια ἑξακόσια ἑξήκοντα τάλαντα
  choice: по три тысячи шестьсот шестьдесят талантов в год
  rationale: Точно сохранены сумма, ежегодная периодичность и древняя денежно-весовая единица. Конструкция с «по» естественно выражает регулярную ежегодную выплату.
theological_decisions:
- issue: Нравственная характеристика обещанной выплаты
  choice: Описать обещание нейтрально как «обещавшего давать», не называя его взяткой.
  alternative: «обещавшего платить» или «подкупившего его»
  rationale: Греческий текст сообщает об обещании ежегодно давать определённую сумму в обмен на должность, но не употребляет отдельного слова «взятка». Коррумпированный характер сделки следует из контекста и не должен усиливаться в основном тексте переводческим толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, достойным библейского повествования регистром. Синтаксис упрощён настолько, чтобы длинная греческая конструкция оставалась ясной, но отношения между участниками и условие назначения сохранены.
