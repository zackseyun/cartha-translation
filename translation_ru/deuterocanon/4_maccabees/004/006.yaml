lexical_decisions:
- source_word: καταράτου
  choice: проклятым
  rationale: 'Передаёт сильную осуждающую характеристику: Симон представлен как находящийся под проклятием или достойный проклятия.'
- source_word: βαρυτάτου στρατοῦ
  choice: весьма грозным войском
  rationale: Буквальное «тяжелейшим войском» по-русски неестественно; «весьма грозным» сохраняет метафорический смысл тяжести как подавляющей, внушительной военной силы, не сводя выражение только к численности.
- source_word: προσελθών
  choice: Подойдя
  rationale: Причастие обозначает предшествующее основной речи приближение; краткая форма естественно передаёт последовательность действий.
- source_word: ταῖς τοῦ βασιλέως ἐντολαῖς
  choice: по повелениям царя
  rationale: Дательный падеж указывает на основание или полномочие для прибытия; множественное число исходного текста сохранено.
- source_word: ἥκειν
  choice: прибыл
  rationale: ἥκω выражает прибытие с результирующим присутствием; форма согласована с косвенной речью после «сказал».
- source_word: ὅπως
  choice: чтобы
  rationale: Естественно и точно вводит цель прибытия.
- source_word: τὰ ἰδιωτικὰ … χρήματα
  choice: частные средства
  rationale: Выражение противопоставляет частные или личные деньги общественным либо священным средствам; «средства» соответствует финансовому контексту.
- source_word: τοῦ γαζοφυλακίου
  choice: из сокровищницы
  rationale: Γαζοφυλάκιον означает сокровищницу или помещение для хранения ценностей. Предлог «из» естественно выражает изъятие находившихся там средств, не добавляя отсутствующего в данной фразе слова «храмовая».
- source_word: λάβοι
  choice: забрать
  rationale: Передаёт намеченное получение или изъятие денег, не усиливая глагол до однозначного «захватить».
theological_decisions:
- issue: Следует ли прямо назвать сокровищницу храмовой
  choice: из сокровищницы
  alternative: из храмовой сокровищницы
  rationale: Контекст указывает на Иерусалимский храм, однако в самой фразе γαζοφυλάκιον не содержит определения «храмовая». Основной текст не добавляет это уточнение.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Начальная строчная буква сохранена, поскольку стих начинается продолжением предложения из предыдущего контекста. «Весьма грозным войском» передаёт необычный образ βαρύς без неестественной русской кальки.
