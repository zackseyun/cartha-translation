base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/003.yaml
  text: Simon[a], being hostile to the king’s interests, reported that many tens of thousands of private funds had been stored in the treasuries of Jerusalem, not connected with the temple[c][b], but that these belonged to King Seleucus.
translation:
  language: ru
  text: Симон, враждебно настроенный к интересам царя[a], донёс, что в иерусалимских сокровищницах хранится множество десятков тысяч частных средств[b], не принадлежащих храму[c], а царю Селевку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение с оборотом о «делах царя» необычно и сжато; возможны также переводы: «по отношению к делам царя» или «к делу царя».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «многие мириады частных денег»; мириада — десять тысяч.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не бывших общими с храмом»; возможно также: «не связанных с храмом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σίμων ὢν τοῖς τοῦ βασιλέως πράγμασιν ἥκω
  choice: Симон, враждебно настроенный к интересам царя
  rationale: Греческое выражение с ἥκω синтаксически сжато и в данной форме необычно. По контексту доноса оно характеризует позицию Симона по отношению к царским интересам; перевод передаёт враждебную направленность, не воспроизводя неясную конструкцию буквально.
- source_word: μηνύων
  choice: донёс
  rationale: Глагол означает сообщение сведений, нередко в обвинительном контексте. «Донёс» естественно передаёт здесь характер сообщения Симона.
- source_word: πολλὰς ἰδιωτικῶν χρημάτων μυριάδας
  choice: множество десятков тысяч частных средств
  rationale: μυριάδες сохраняет числовое значение единиц по десять тысяч, а ἰδιωτικῶν χρημάτων указывает на деньги или средства частных лиц.
- source_word: ἐν τοῖς Ἱεροσολύμων γαζοφυλακίοις
  choice: в иерусалимских сокровищницах
  rationale: γαζοφυλάκια — помещения или хранилища казны; «сокровищницы» соответствует храмово-финансовому контексту и звучит естественно по-русски.
- source_word: τεθησαυρίσθαι
  choice: хранится
  rationale: Перфектный инфинитив обозначает средства, уже помещённые на хранение; в русском косвенном сообщении настоящее «хранится» естественно передаёт сохраняющийся результат.
- source_word: τῷ ἱερῷ μὴ ἐπικοινωνούσας
  choice: не принадлежащих храму
  rationale: Оборот указывает, что частные средства не составляли общего имущества храма и не относились к нему. Выбор ясно передаёт противопоставление храмовой собственности частным вкладам.
- source_word: προσήκειν ταῦτα Σελεύκῳ τῷ βασιλεῖ
  choice: а царю Селевку
  rationale: 'προσήκειν выражает принадлежность или законное притязание. Русская эллиптическая конструкция после «не принадлежащих храму» естественно передаёт: «а принадлежащих царю Селевку».'
theological_decisions:
- issue: Статус средств в иерусалимских сокровищницах
  choice: Средства представлены как частные вклады, не принадлежавшие храму.
  alternative: Средства лишь не были доступны храму или не использовались совместно с ним.
  rationale: ἰδιωτικῶν χρημάτων прямо определяет средства как частные, а μὴ ἐπικοινωνούσας τῷ ἱερῷ отделяет их от храмового имущества. При этом сноска сохраняет более буквальные варианты оборота.
- issue: Характер притязания царя
  choice: Текст передаёт утверждение Симона, что частные средства принадлежат царю Селевку.
  alternative: Средства причитаются царю или подпадают под его законное право.
  rationale: προσήκειν допускает оттенки принадлежности, причитаемости и законного отношения. Основной текст использует наиболее естественное «принадлежат», не утверждая истинность доноса от лица повествователя.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Донёс» передаёт обвинительный контекст без избыточного пояснения; «частные средства» понятно современному читателю и сохраняет юридико-финансовое различие между вкладами частных лиц и имуществом храма.
