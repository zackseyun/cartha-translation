  - marker: a
    text: 'Возможные варианты: «презираемое место» или «место, которым пренебрегали». Греческое выражение указывает на священное место, к которому относились с презрением.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δὲ ἱερέων
  choice: когда же священники
  rationale: Родительный абсолют передаёт фоновое одновременное действие; «когда же» естественно связывает этот фрагмент с контекстом. ἱερεῖς в иудейском храмовом контексте — «священники».
- source_word: μετὰ γυναικῶν καὶ παιδίων
  choice: вместе с женщинами и детьми
  rationale: В греческом тексте женщины не названы жёнами священников, поэтому притяжательное уточнение не добавляется.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν обычно обозначает храм или храмовый комплекс, а не исключительно внутреннее святилище.
- source_word: ἱκετευόντων
  choice: умоляли
  rationale: Глагол выражает настойчивую, смиренную просьбу; «умоляли» ясно и естественно передаёт её напряжённость.
- source_word: ὑπερασπίσαι
  choice: защитить
  rationale: Инфинитив означает выступить в защиту или оградить от угрозы; «защитить» точно подходит к контексту опасности для храма.
- source_word: τοῦ καταφρονουμένου τόπου
  choice: место, к которому относились с презрением
  rationale: 'Описательный перевод сохраняет пассивный смысл причастия: священное место подвергается презрительному обращению. «Место» не сужает значение заранее до внутреннего святилища.'
theological_decisions:
- issue: К чему относится «место» (τόπος)
  choice: Сохранено общее слово «место», по контексту указывающее на храмовое место, которому угрожает осквернение.
  alternative: «храм», «святилище» или, шире, «город»
  rationale: Непосредственное упоминание молитвы в храме делает храмовый участок наиболее вероятным референтом, однако буквальное «место» не устраняет возможную широту выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис «когда же» сохраняет незавершённый, зависимый характер греческого фрагмента; конечная запятая показывает продолжение предложения.
