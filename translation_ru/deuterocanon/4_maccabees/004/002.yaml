lexical_decisions:
- source_word: ὅθεν
  choice: Поэтому
  rationale: Передаёт вывод или следствие из предшествующего повествования.
- source_word: ἥκων
  choice: пришёл
  rationale: Причастие настоящего времени от ἥκω в повествовательном контексте естественно передаётся личной формой прошедшего времени.
- source_word: στρατηγόν
  choice: правителю
  rationale: В данном административном контексте обозначает высокопоставленного областного начальника; «правитель» понятно современному читателю и не навязывает более узкий военный титул.
- source_word: ἔλεγεν
  choice: сказал
  rationale: Имперфект вводит последующую прямую речь; по-русски перед двоеточием естественна формула «и сказал», без обязательного подчёркивания длительности.
