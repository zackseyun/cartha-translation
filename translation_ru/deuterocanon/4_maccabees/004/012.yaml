  text: For he said that he had sinned, so that he was worthy even to die, and that, if he were saved, he would sing the blessedness of the holy place to all people.
translation:
  language: ru
  text: Ведь он говорил, что согрешил и потому заслуживает даже смерти, а если будет спасён, то перед всеми людьми воспоёт[a] блаженство святого места.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прославит». Греческий глагол может обозначать гимническую хвалу вообще, а не только буквальное пение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект передаёт речь в прошлом; русское «говорил» естественно сохраняет её длительный или повторный оттенок, не подчёркивая его чрезмерно.
- source_word: ἡμαρτηκώς
  choice: согрешил
  rationale: Перфектное причастие обозначает совершённый проступок, последствия которого сохраняют значение; в косвенной речи это естественно передаётся личной формой.
- source_word: ὥστε καὶ ἀποθανεῖν ἄξιος ὑπάρχειν
  choice: и потому заслуживает даже смерти
  rationale: Оборот с ἄξιος и инфинитивом выражает заслуженность смерти как следствие признанного греха. «Заслуживает смерти» по-русски естественнее буквального «достоин умереть», а «даже» передаёт усилительное καί.
- source_word: πᾶσίν τε ἀνθρώποις
  choice: перед всеми людьми
  rationale: Дательный обозначает аудиторию прославления; «перед всеми людьми» ясно и естественно выражает публичность действия.
- source_word: ὑμνήσειεν
  choice: воспоёт
  rationale: Оптатив в зависимой речи передаёт предполагаемое будущее действие. «Воспоёт» сохраняет оттенок торжественной, гимнической хвалы, не требуя понимания как буквального пения.
- source_word: σωθεὶς
  choice: если будет спасён
  rationale: Аористное страдательное причастие здесь имеет условный смысл. Формулировка сохраняет пассивную конструкцию и не сужает значение до специально доктринального спасения.
- source_word: τὴν τοῦ ἱεροῦ τόπου μακαριότητα
  choice: блаженство святого места
  rationale: Передаёт отвлечённое μακαριότης и сохраняет образное обозначение ἱερὸς τόπος без замены его более узким словом «святилище».
theological_decisions:
- issue: Значение σωθεὶς в данном контексте
  choice: «если будет спасён» — прежде всего в смысле избавления от грозящей смерти
  alternative: понимание как духовного спасения в широком богословском смысле
  rationale: Повествовательный контекст говорит о сохранении жизни и последующей публичной хвале святому месту. Русская формулировка сохраняет широту слова, не привнося более позднюю доктринальную терминологию.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис косвенной речи сделан естественным для русского; «воспоёт» сохраняет возвышенный оттенок исходного глагола, а сноска поясняет его смысловой диапазон.
