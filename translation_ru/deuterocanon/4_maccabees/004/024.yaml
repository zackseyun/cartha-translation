lexical_decisions:
- source_word: ὥστε
  choice: так что
  rationale: Передаёт следствие предшествующих обстоятельств, не превращая оборот в простой логический вывод.
- source_word: περιέτεμον τὰ παιδία
  choice: совершали обрезание над своими детьми
  rationale: Несовершенный вид передаёт повторявшееся действие, а прямое упоминание обрезания сохраняет историко-религиозный смысл текста.
- source_word: μετὰ τῶν βρεφῶν
  choice: вместе с младенцами
  rationale: βρέφη обозначает младенцев или совсем маленьких детей; формулировка сохраняет краткость и трагическую выразительность оригинала.
- source_word: κατακρημνίζεσθαι
  choice: сбрасывали с высоты
  rationale: Глагол обозначает насильственное низвержение вниз, обычно с возвышенного места; перевод передаёт направление и насилие, не уточняя место как обрыв.
- source_word: προειδυίας ὅτι τοῦτο πείσονται
  choice: хотя они заранее знали, что им предстоит это претерпеть
  rationale: Причастие выражает предварительное знание женщин и в контексте имеет уступительный оттенок; πείσονται означает испытать или претерпеть происходящее.
theological_decisions:
- issue: Обрезание как причина преследования
  choice: Прямо сохранить упоминание обрезания
  alternative: помечали детей знаком завета; совершали над детьми установленный обряд
  rationale: Оригинал прямо называет иудейскую практику причиной наказания. Буквенное обозначение обряда сохраняет историческую и богословскую напряжённость без внесения поздней конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования. Оборот «совершали обрезание» естественнее буквального «обрезывали» и одновременно сохраняет повторительный оттенок греческого имперфекта.
