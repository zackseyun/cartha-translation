lexical_decisions:
- source_word: οἷόν τε ἦν
  choice: насколько могли
  rationale: Греческая идиома выражает предел возможности или способности; по-русски естественно передаётся оборотом «насколько могли».
- source_word: ἐκώλυον
  choice: мешали ему
  rationale: Имперфект обозначает продолжавшееся противодействие, не утверждая, что им удалось полностью остановить Аполлония. Местоимение «ему» восполняет подразумеваемый по контексту объект.
- source_word: μετὰ ἀπειλῆς
  choice: угрожая им
  rationale: Оборот обозначает сопутствующий образ действия. Деепричастная конструкция естественно передаёт, что Аполлоний продвигался к храму с угрозами; «им» обозначает подразумеваемых адресатов угроз.
- source_word: ἀπῄει
  choice: направлялся
  rationale: Имперфект передаёт движение в процессе; «направлялся» сохраняет длительный вид и согласуется с указанием цели движения.
- source_word: εἰς τὸ ἱερόν
  choice: к храму
  rationale: ἱερόν может обозначать храм в широком смысле, включая весь храмовый комплекс; «храм» — естественный и достаточно широкий русский эквивалент.
- source_word: ὁ Ἀπολλώνιος
  choice: Аполлоний
  rationale: Имя передано в традиционной русской форме.
