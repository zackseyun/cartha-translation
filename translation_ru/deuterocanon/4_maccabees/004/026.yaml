  yaml_path: translation/deuterocanon/4_maccabees/004/026.yaml
  text: Therefore[a], since his decrees were being despised by the people, he himself was compelling each and every one of the nation, by tortures, after tasting defiling foods[b], to renounce Judaism.
translation:
  language: ru
  text: Итак, поскольку народ с презрением отвергал его указы, он сам пытками принуждал каждого из этого народа, после того как тот отведает оскверняющей пищи[a], отречься от иудаизма[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечистой пищи» или «осквернённой пищи». Греческое слово подчёркивает ритуальное осквернение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «клятвенно отречься от иудаизма». Греческий глагол может обозначать отречение, подтверждённое клятвой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δόγματα
  choice: указы
  rationale: В данном контексте слово обозначает властные распоряжения правителя; «указы» естественно передаёт их официальный и обязательный характер.
- source_word: κατεφρονεῖτο ὑπὸ τοῦ λαοῦ
  choice: народ с презрением отвергал
  rationale: Активная конструкция звучит естественнее по-русски, сохраняя длительность имперфекта и сильный оттенок презрения, а не простого неповиновения.
- source_word: αὐτός
  choice: он лично
  rationale: 'Передаёт усилительное значение местоимения: правитель сам непосредственно осуществлял принуждение.'
- source_word: διὰ βασάνων
  choice: пытками
  rationale: 'Творительный падеж кратко и точно передаёт орудийное значение διά: принуждение совершалось посредством пыток.'
- source_word: ἕνα ἕκαστον τοῦ ἔθνους
  choice: каждого без исключения из этого народа
  rationale: «Каждого без исключения» сохраняет подчёркнутую дистрибутивность ἕνα ἕκαστον, а «из этого народа» передаёт этнонациональный смысл ἔθνος без ненужного уточнения.
- source_word: μιερῶν ... τροφῶν
  choice: оскверняющей пищи
  rationale: 'Так передаётся ритуально-религиозный оттенок μιερός: речь не просто о запрещённой еде, а о пище, вкушение которой оскверняет.'
- source_word: ἀπογευομένους
  choice: вкусив
  rationale: Деепричастие сохраняет предшествование вкушения последующему отречению и лаконичность греческого причастия.
- source_word: ἐξόμνυσθαι
  choice: отречься
  rationale: Современное и ясное соответствие формальному отказу; возможный оттенок клятвенного отречения отмечен в сноске.
- source_word: τὸν Ἰουδαϊσμόν
  choice: иудаизма
  rationale: Прямое соответствие, не сужающее понятие до одной лишь религии или этнической принадлежности.
theological_decisions:
- issue: Объём понятия τὸν Ἰουδαϊσμόν
  choice: иудаизма
  alternative: иудейской веры; иудейского образа жизни
  rationale: «Иудаизм» сохраняет широту греческого понятия, охватывающего веру, установления, образ жизни и общинную принадлежность, не сводя его лишь к одному аспекту.
- issue: Характер μιερῶν τροφῶν
  choice: оскверняющей пищи
  alternative: нечистой пищи; осквернённой пищи
  rationale: 'Выбор сохраняет оценочную и ритуальную силу выражения: пища представлена как причиняющая осквернение, а не просто как физически грязная.'
- issue: Принудительная последовательность действий
  choice: вкусив ... отречься
  alternative: чтобы они вкусили ... и отреклись
  rationale: Греческое причастие грамматически представляет вкушение пищи как предшествующее отречению; перевод сохраняет эту последовательность, не добавляя иных мотивов или условий.
translation_notes:
  register: 'Современный литературный русский язык с достоинством историко-религиозного повествования. Синтаксис слегка упрощён по сравнению с греческим: пассивная конструкция передана естественной русской активной, при этом сохранены длительность действия, усиление «он лично» и подчёркнутое «каждого без исключения».'
