lexical_decisions:
- source_word: ἐπεὶ
  choice: поскольку
  rationale: Передаёт причинно-обстоятельственную связь с последующим продолжением мысли; стих представляет собой незавершённую придаточную конструкцию.
- source_word: κατὰ μηδένα τρόπον
  choice: никак
  rationale: Естественно и выразительно передаёт усиленное отрицание «никоим образом».
- source_word: ἴσχυεν καταλῦσαι
  choice: не мог... сломить
  rationale: ἴσχυεν с инфинитивом обозначает способность, а «сломить» естественно сочетается с внутренним расположением или настроем людей.
- source_word: διὰ τῶν δογμάτων
  choice: своими постановлениями
  rationale: δόγματα в данном контексте — официальные властные постановления или указы; притяжательное «своими» естественно подразумевается контекстом действующего правителя.
- source_word: τὴν τοῦ ἔθνους εὔνοιαν
  choice: расположение народа
  rationale: Сохраняет широкий смысл εὔνοια — благожелательное расположение, добрую волю или лояльность — не сводя его однозначно к политической верности.
- source_word: πάσας τὰς ἑαυτοῦ ἀπειλὰς καὶ τιμωρίας
  choice: все его угрозы и наказания
  rationale: Прямой и современный перевод двух средств принуждения.
- source_word: ἑώρα καταλυομένας
  choice: видел, что... сами теряют силу
  rationale: 'Передаёт результативно-пассивный смысл причастия: угрозы и наказания сводятся на нет и оказываются недейственными. «Сами» подчёркивает риторический переворот, заложенный в повторе корня καταλύω.'
