base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/010.yaml
  text: And when Apollonius came up with an armed force to seize the money[a], horse-mounted angels appeared beforehand from heaven[b], flashing around with their weapons and putting great fear and terror into them.
translation:
  language: ru
  text: Когда Аполлоний с вооружённым войском выступил, чтобы захватить деньги, с неба явились ангелы-всадники[a], сверкая оружием и вселяя в них великий страх и ужас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ангелы на конях». Греческое слово прямо изображает ангелов верхом.'
    reason: Лексический вариант передачи ἔφιπποι ἄγγελοι.
lexical_decisions:
- source_word: ἀνιόντος
  choice: двинулся
  rationale: В составе родительного самостоятельного оборота глагол обозначает движение Аполлония к месту действия; «двинулся» естественно передаёт продвижение, не навязывая буквального движения вверх.
- source_word: καθωπλισμένης στρατιᾶς
  choice: с вооружённым войском
  rationale: Передаёт и военную силу, и подчёркнутую греческим причастием вооружённость.
- source_word: πρὸς τὴν τῶν χρημάτων ἁρπαγήν
  choice: захватить деньги
  rationale: ἁρπαγή означает насильственный захват или разграбление; инфинитивная конструкция ясно выражает цель.
- source_word: οὐρανόθεν
  choice: с неба
  rationale: В повествовании о явлении ангелов выражение указывает на небесное происхождение и сохраняет сверхъестественный характер сцены.
- source_word: προυφάνησαν
  choice: перед ними явились
  rationale: Передаёт явление небесных фигур перед войском; это естественнее по-русски, чем неопределённое «явились заранее», и учитывает значение приставки προ-.
- source_word: ἔφιπποι ἄγγελοι
  choice: ангелы на конях
  rationale: Прямо и понятно передаёт, что ангелы изображены всадниками, не превращая их в неопределённых «небесных конников».
- source_word: περιαστράπτοντες τοῖς ὅπλοις
  choice: их оружие сверкало вокруг
  rationale: Сохраняет образ окружающего их молниеподобного блеска оружия и звучит естественно в современном русском языке.
- source_word: ἐνιόντες
  choice: вселяли в них
  rationale: Глагол означает вводить или внушать внутреннее состояние; «вселяли» хорошо сочетается со страхом и ужасом.
- source_word: φόβον τε καὶ τρόμον
  choice: великий страх и ужас
  rationale: Сохраняет усилительный двойной ряд и значение πολύν, не сводя τρόμος только к физической дрожи.
theological_decisions:
- issue: Небесный характер явления (οὐρανόθεν)
  choice: с неба
  alternative: с небосвода
  rationale: Контекст прямо описывает ангелов и сверхъестественное вмешательство; «с неба» передаёт это без дополнительных догматических уточнений.
- issue: Образ ἔφιπποι ἄγγελοι
  choice: ангелы на конях
  alternative: ангелы-всадники
  rationale: Формулировка сохраняет конкретный образ ангелов верхом и не переосмысливает природу явившихся существ.
- issue: Адресаты страха в αὐτοῖς
  choice: в них
  alternative: в воинах Аполлония
  rationale: Местоименная форма сохраняет структуру и небольшую референциальную неоднозначность греческого текста, хотя ближайший контекст указывает на Аполлония и его войско.
translation_notes:
  register: 'Современный литературный русский язык с возвышенным, но доступным повествовательным тоном. Синтаксис сохраняет последовательность греческой сцены: выступление войска, небесное явление, блеск оружия и охвативший нападавших ужас.'
