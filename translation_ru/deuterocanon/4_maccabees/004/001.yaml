base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/001.yaml
  text: For a certain Simon[a], opposing Onias, who had once held the high priesthood for life, a noble and good man, when he was unable, though slandering him in every way, to harm him on behalf of the nation, went away as an exile[b], intending to betray his homeland.
translation:
  language: ru
  text: Ведь некий Симон противостоял Онии — благородному и доброму человеку, который некогда пожизненно занимал должность первосвященника; поскольку Симон, всячески клевеща на него, не мог причинить ему вреда в вопросах, касавшихся народа[a], он удалился как изгнанник[b], намереваясь предать родину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение ὑπὲρ τοῦ ἔθνους допускает разные оттенки: «в том, что касалось народа», «по отношению к народу» или, менее вероятно в данном контексте, «ради народа».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «удалился как беглец»; греческое φυγάς может означать как изгнанника, так и человека, спасающегося бегством.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιπολιτευόμενος
  choice: противодействовал
  rationale: Передаёт деятельное противостояние, включая возможный политический оттенок, но не превращает его в узкий технический термин.
- source_word: τὸν ποτε τὴν ἀρχιερωσύνην ἔχοντα διὰ βίου
  choice: который некогда пожизненно занимал должность первосвященника
  rationale: Сохраняет указание ποτε на прежнее положение и связывает διὰ βίου со сроком первосвященнического служения.
- source_word: καλὸν καὶ ἀγαθὸν ἄνδρα
  choice: благородному и доброму человеку
  rationale: Естественно передаёт возвышенную нравственную характеристику Онии, не сглаживая парное выражение.
- source_word: διαβάλων
  choice: всячески клевеща на него
  rationale: Глагол обозначает злонамеренные обвинения или очернение; «клевеща» ясно выражает эту враждебную силу.
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: в делах, касавшихся народа
  rationale: Осторожно обозначает общественно-национальную сферу причиняемого вреда, не устраняя неоднозначность предлога ὑπέρ.
- source_word: οὐκ ἴσχυεν κακῶσαι
  choice: не смог причинить ему вред
  rationale: Естественно передаёт неспособность осуществить задуманное зло.
- source_word: φυγὰς ᾤχετο
  choice: удалился как изгнанник
  rationale: Сохраняет движение прочь и основное значение φυγάς как изгнанника, а возможное значение «беглец» отмечено в сноске.
- source_word: τὴν πατρίδα προδώσων
  choice: намереваясь предать свою родину
  rationale: Будущее причастие передаёт цель или намерение, а «родина» сохраняет патриотический оттенок πατρίς.
