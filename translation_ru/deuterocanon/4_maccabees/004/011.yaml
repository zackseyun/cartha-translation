base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/011.yaml
  text: So Apollonius[a], having fallen half-dead upon the lifeless court of the sanctuary, stretched out his hands to heaven and with tears begged the Hebrews to pray for him[c][b], so that they might appease the heavenly host.
translation:
  language: ru
  text: Аполлоний, упав полумёртвым на безжизненный двор святилища[a], простёр руки к небу и со слезами умолял евреев помолиться о нём[b], чтобы они снискали благосклонность небесного воинства[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на безжизненное ограждённое пространство святилища». Греческое слово может обозначать ограду, окружённый ею двор или всю священную территорию.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «молясь о нём» или «касательно него»; по смыслу речь идёт о ходатайственной молитве.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «небесное войско». Греческий текст не уточняет, подразумеваются ли небесные существа или это косвенное обозначение небесной силы.'
    reason: alternative_reading
lexical_decisions:
- source_word: καταπεσὼν
  choice: рухнул
  rationale: Аористное причастие обозначает действие, предшествующее просьбе; «рухнул» естественно передаёт внезапное падение обессилевшего человека.
- source_word: ἡμιθανὴς
  choice: полумёртвый
  rationale: Сохраняет буквальный и выразительный смысл греческого сложного слова, не ослабляя его до общего «едва живой».
- source_word: ἄψυχον
  choice: безжизненный
  rationale: Передаёт буквальное «лишённый жизни» и сохраняет намеренный контраст между полумёртвым человеком и неодушевлённым местом.
- source_word: τοῦ ἱεροῦ περίβολον
  choice: двор святилища
  rationale: περίβολος обозначает ограждённое священное пространство или двор; этот вариант естественен по-русски и не сужает ἱερόν до одного здания.
- source_word: τὰς χεῖρας ἐκτείνων εἰς τὸν οὐρανὸν
  choice: простёр руки к небу
  rationale: Передаёт обычный жест мольбы и сохраняет возвышенный, но понятный современному читателю строй фразы.
- source_word: παρεκάλει
  choice: умолял
  rationale: Контекст слёз и смертельной опасности требует более сильного значения, чем нейтральное «просил».
- source_word: ὅπως περὶ αὐτοῦ εὐξόμενοι
  choice: помолиться о нём
  rationale: Русское «молиться о ком-либо» естественно передаёт περὶ αὐτοῦ и здесь имеет очевидный ходатайственный смысл.
- source_word: ἐξευμενίσωνται
  choice: умилостивили
  rationale: Глагол означает сделать благосклонным, умиротворить; «умилостивили» сохраняет религиозный оттенок, не вводя специальной догматической терминологии.
- source_word: τὸν ἐπουράνιον στρατόν
  choice: небесное воинство
  rationale: Сохраняет коллективный образ στρατός и традиционно-понятное религиозное звучание, не определяя точнее, кто имеется в виду.
theological_decisions:
- issue: Кого обозначает «небесное воинство»
  choice: Референт оставлен неопределённым, как в греческом тексте.
  alternative: Ангельское войско либо благоговейное косвенное обозначение Бога.
  rationale: Греческое выражение прямо не называет ни ангелов, ни Бога; перевод не должен устранять эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Простёр» и «умилостивили» поддерживают достоинство религиозного повествования, оставаясь понятными; синтаксис сделан плавным и не перегружен архаизмами.
