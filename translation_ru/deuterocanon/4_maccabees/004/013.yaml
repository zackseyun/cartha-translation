base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/004/013.yaml
  text: Distressed by these words[a], Onias the high priest, although otherwise being careful lest King Seleucus might ever think that Apollonius had been done away with by human plotting and not by divine justice[b], offered some prayer concerning him.
translation:
  language: ru
  text: Удручённый этими словами, первосвященник Ония, хотя и без того опасался, как бы царь Селевк не подумал, что Аполлоний был погублен человеческими кознями, а не по божественному правосудию, вознёс некую молитву о нём.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «помолился нечто о нём». Греческое выражение не уточняет, молился ли Ония за Аполлония или о связанном с ним деле.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαχθεὶς τοῖς λόγοις
  choice: Тяготясь этими словами
  rationale: Причастие передаёт состояние человека, удручённого или обременённого услышанным; творительный падеж естественно выражает причину.
- source_word: καίπερ ἄλλως εὐλαβηθεὶς
  choice: который и прежде опасался
  rationale: ἄλλως здесь указывает на уже имевшуюся, отдельную от нынешней причины осторожную тревогу; придаточное предложение звучит естественнее по-русски и сохраняет уступительный фон контекста.
- source_word: μὴ ποτε νομίσειεν
  choice: как бы ... не подумал
  rationale: Обычная современная русская конструкция опасения, сохраняющая возможность будущего ошибочного вывода.
- source_word: ἐξ ἀνθρωπίνης ἐπιβουλῆς
  choice: из-за человеческого заговора
  rationale: ἐπιβουλή обозначает злой умысел, интригу или заговор; «заговор» ясно передаёт намеренное человеческое покушение.
- source_word: θείας δίκης
  choice: по божественному правосудию
  rationale: Сохраняет абстрактное θείας и значение δίκη как правосудия или справедливого воздаяния, не подставляя прямо слово «Бог».
- source_word: ἀνηρῆσθαι
  choice: погиб
  rationale: В данном контексте глагол означает, что Аполлоний был устранён и умер; «погиб» естественно по-русски, хотя менее явно обозначает действующего виновника, что соответствует противопоставлению возможных причин.
- source_word: ηὔξατό τι περὶ αὐτοῦ
  choice: вознёс о нём некую молитву
  rationale: «Некую» сохраняет неопределённость τι, а «о нём» не решает однозначно, была ли молитва за Аполлония или касалась связанного с ним дела.
theological_decisions:
- issue: Значение θείας δίκης
  choice: божественное правосудие
  alternative: Божий суд
  rationale: Выбранный вариант близок к форме греческого выражения и сохраняет представление о справедливом действии свыше, не конкретизируя его сильнее оригинала.
- issue: Отнесённость περὶ αὐτοῦ при ηὔξατό τι
  choice: вознёс о нём некую молитву
  alternative: помолился за него / помолился об этом деле
  rationale: Греческий текст оставляет открытым, была ли молитва ходатайством за Аполлония или молитвой по поводу случившегося; основной текст сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. Синтаксис сглажен для ясности, но неопределённость заключительной фразы сохранена. Маркер сноски помещён непосредственно после соответствующей фразы.
