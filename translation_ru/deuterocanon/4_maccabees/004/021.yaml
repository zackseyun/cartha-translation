  yaml_path: translation/deuterocanon/4_maccabees/004/021.yaml
  text: For while he was waging war against Ptolemy in Egypt[a], he also heard that, when a report had spread that he was dead, the people of Jerusalem were rejoicing as much as possible; so he quickly marched up against them.
translation:
  language: ru
  text: Ибо, воюя в Египте против Птолемея, он услышал также, что, когда распространилась весть о его смерти[a], жители Иерусалима чрезвычайно радовались; поэтому он быстро выступил против них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распространился слух, что он умер». Греческое φήμη может означать весть, слух или молву; в основном тексте выбрано более нейтральное слово «весть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ γὰρ
  choice: Ибо, когда
  rationale: «Ибо» передаёт пояснительную силу γάρ, а «когда» вводит временной фон повествования, выраженный ἐπειδή.
- source_word: πολεμῶν ἦν
  choice: вёл войну
  rationale: Перифрастическая конструкция обозначает продолжавшееся военное действие; русский оборот естественно сохраняет этот аспект.
- source_word: κατʼ Αἴγυπτον Πτολεμαίῳ
  choice: с Птолемеем в Египте
  rationale: Птолемей представлен как противник, а Египет — как место военных действий; такой порядок слов устраняет возможное ошибочное понимание Египта как второго противника.
- source_word: ἠκούσέν τε
  choice: он также услышал
  rationale: «Также» передаёт присоединительный оттенок τε, не перегружая повествование.
- source_word: φήμης διαδοθείσης
  choice: после того, как распространилась весть
  rationale: Генитив абсолютный передан придаточным предшествующего обстоятельства. «Весть» сохраняет нейтральность φήμη, которое может означать как сообщение, так и слух.
- source_word: περὶ τοῦ τεθνάναι αὐτόν
  choice: о его смерти
  rationale: Естественная русская номинальная конструкция точно передаёт содержание распространившейся вести.
- source_word: ὡς ἔνι μάλιστα
  choice: как нельзя больше
  rationale: Современный русский идиоматический оборот сохраняет предельную степень, выраженную греческим сочетанием.
- source_word: χαίροιεν
  choice: радовались
  rationale: Передаёт продолжительное состояние радости в косвенной речи без добавления более конкретного значения «праздновали».
- source_word: οἱ Ἱεροσολυμεῖται
  choice: жители Иерусалима
  rationale: Ясное и естественное обозначение жителей города в современном литературном русском языке.
- source_word: ταχέως ἐπʼ αὐτοὺς ἀνέζευξεν
  choice: тогда он быстро выступил против них
  rationale: «Выступил против» сохраняет военный характер и направленность движения; «быстро» непосредственно передаёт ταχέως, а «тогда» естественно обозначает следствие в русском повествовании.
