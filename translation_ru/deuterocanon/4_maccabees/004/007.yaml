lexical_decisions:
- source_word: τοῦ ἔθνους
  choice: народ
  rationale: В данном контексте слово обозначает иудейский народ как единое сообщество; по-русски «народ» звучит естественнее, чем «нация», и не создаёт современного национально-государственного оттенка.
- source_word: πρὸς τὸν λόγον
  choice: этим предложением
  rationale: λόγος здесь относится к объявленному намерению распорядиться средствами; «предложение» передаёт практический смысл, не превращая его определённо в приказ или уже принятое решение.
- source_word: σχετλιάζοντος ἀντιλέγοντός τε
  choice: возмущённый… выступил против него
  rationale: Сочетание сохраняет как сильную эмоциональную реакцию, так и выраженное словесное противодействие. Русское деепричастное нагромождение устранено ради естественности.
- source_word: πάνδεινον
  choice: чудовищным
  rationale: Слово выражает предельно сильную отрицательную оценку; «чудовищным» естественно передаёт усилительное значение в современном литературном русском.
- source_word: νομίσαντες
  choice: они сочли
  rationale: Передаёт суждение неназванного в данном фрагменте множественного субъекта, не уточняя его вопреки греческому тексту.
- source_word: οἱ τὰς παρακαταθήκας πιστεύσαντες
  choice: те, кто доверил свои вклады
  rationale: παρακαταθήκαι — ценности или средства, переданные на хранение; глагол πιστεύω подчёркивает доверительное вручение. «Вклады» уместны в финансово-хранительном контексте.
- source_word: τῷ ἱερῷ θησαυρῷ
  choice: священной сокровищнице
  rationale: Сохраняется прямое значение ἱερός и образ θησαυρός; связь с храмом поясняется в примечании, а не вносится в основной текст.
- source_word: στερηθήσονται
  choice: лишатся их
  rationale: Кратко и естественно передаёт будущую пассивную идею утраты доверенных вкладов.
- source_word: ὡς
  choice: поскольку
  rationale: Союз вводит основание, изложение которого продолжается в следующем стихе; многоточие показывает синтаксическую незавершённость данного стиха.
theological_decisions:
- issue: Передача языка, связанного с храмовой святыней, без внесения позднейших богословских оттенков
  choice: священная сокровищница
  alternative: храмовая сокровищница
  rationale: «Священная» непосредственно передаёт ἱερός, тогда как «храмовая» ясно выражает контекст, но делает подразумеваемую связь частью основного текста. Контекстуальное уточнение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис слегка упрощён по сравнению с греческим периодом, но сохранены интенсивность народного возмущения, неопределённый субъект «они» и незавершённость фразы в конце стиха.
