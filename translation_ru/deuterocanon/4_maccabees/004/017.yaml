  naturalness: Предложение краткое и литературное. «Исполнять обязанности первосвященника» естественно для современного русского и точнее отражает глагольный характер греческого инфинитива. Сноска в исходнике понятна, но формулировку о «руководстве в качестве главы» следует сделать более естественной.
  terminology: «Первосвященник» — устоявшийся и точный термин. «Народ» уместно передаёт τοῦ ἔθνους в данном контексте. Альтернатива «управлять народом» обоснованно отмечает более политический оттенок ἀφηγεῖσθαι, не выдавая его за единственное значение.
