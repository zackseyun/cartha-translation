translation:
  language: ru
  text: Он же позволил ему исполнять обязанности первосвященника и возглавлять народ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «управлять народом». Греческий глагол может также иметь значение «управлять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέτρεψεν
  choice: позволил
  rationale: Глагол обозначает разрешение или предоставление права действовать; «позволил» сохраняет этот смысл, не превращая его в явную формулу официального назначения.
- source_word: ἀρχιερασθαι
  choice: быть первосвященником
  rationale: Инфинитив означает исполнять обязанности или занимать положение первосвященника. В современном русском это выражено естественно и без излишней канцелярской окраски.
- source_word: τοῦ ἔθνους
  choice: народ
  rationale: В данном иудейском контексте слово обозначает народ как национально-политическое сообщество; русское «народ» звучит естественнее, чем «нация», и не сужает смысл до этнической категории.
- source_word: ἀφηγεῖσθαι
  choice: возглавлять
  rationale: Глагол с родительным падежом может означать стоять во главе или руководить. «Возглавлять» передаёт положение руководителя, не усиливая его до безусловного владычества.
theological_decisions:
- issue: Объём предоставленной ему власти
  choice: Разрешение относится и к первосвященству, и к руководству народом.
  alternative: 'Второй инфинитив можно передать более политически: «управлять народом».'
  rationale: Два инфинитива однородно зависят от глагола разрешения. Перевод сохраняет одновременно религиозную и общественно-политическую стороны полномочий, не уточняя сверх текста характер правления.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Частица «же» передаёт греческое δέ и связь с предшествующим контекстом.
