  yaml_path: translation/deuterocanon/4_maccabees/004/020.yaml
  text: Because of these things[a], divine justice, having become indignant, made war against Antiochus himself.
translation:
  language: ru
  text: За это божественное правосудие[a], вознегодовав, пошло войной на самого Антиоха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «божественная кара» или «божественный суд»; греческое δίκη может означать справедливость в действии, судебное наказание или воздаяние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφʼ οἷς
  choice: За это
  rationale: Оборот имеет причинное значение и отсылает к предшествующим поступкам Антиоха; краткое «за это» естественно передаёт и причину, и обратную отсылку.
- source_word: ἀγανακτήσασα
  choice: вознегодовав
  rationale: Причастие выражает сильное негодование; деепричастие сохраняет его подчинённое отношение к основному действию и поддерживает возвышенный регистр.
- source_word: ἡ θεία δίκη
  choice: божественное правосудие
  rationale: δίκη может означать справедливость, судебное воздаяние или кару. «Божественное правосудие» сохраняет юридико-воздающий оттенок и олицетворение, не подменяя выражение прямым именованием Бога.
- source_word: αὐτόν τοι τὸν Ἀντίοχον
  choice: самого Антиоха
  rationale: Сочетание подчёркнуто выделяет лично Антиоха; частица τοι передана общей усилительной конструкцией.
- source_word: ἐπολέμησεν
  choice: пошло войной на
  rationale: Выражение сохраняет военную образность и активную враждебность олицетворённого правосудия, оставаясь естественным по-русски.
theological_decisions:
- issue: Олицетворение δίκη
  choice: 'Божественное правосудие действует как личная сила: негодует и идёт войной'
  alternative: Передать конкретнее как «божественная кара» либо прямо как «правосудие Бога»
  rationale: Греческий текст олицетворяет δίκη. Выбранная передача сохраняет литературное и богословское напряжение, не сводя образ к безличному наказанию и не отождествляя его безоговорочно с прямым действием названного Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией. «Вознегодовав» и «пошло войной» сохраняют торжественную персонификацию оригинала, не делая фразу архаичной или конфессионально окрашенной.
