  text: Он также разыскал этот народ и вовлёк его во всякое беззаконие[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повёл его ко всякому беззаконию». Греческий глагол может указывать на то, что народу насаждали определённый образ жизни и общественного поведения, а не только побуждали к отдельным беззаконным поступкам.'
