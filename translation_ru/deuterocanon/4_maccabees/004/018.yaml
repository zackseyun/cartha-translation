lexical_decisions:
- source_word: ἐξεζήτησεν
  choice: стал преследовать
  rationale: В данном враждебном контексте усиленный глагол означает не нейтральные поиски, а целенаправленное разыскивание и притеснение народа. «Стал преследовать» естественно передаёт эту направленность по-русски.
- source_word: τὸ ἔθνος
  choice: этот народ
  rationale: Существительное обозначает единый этнический народ. Указательное «этот» естественно связывает его с уже известным из контекста народом, не добавляя отсутствующего в греческом тексте названия.
- source_word: ἐξεπολίτευσεν
  choice: приучать его
  rationale: Глагол, образованный от πολιτεύω, здесь указывает на формирование общественного поведения или образа жизни. «Приучать» передаёт длительное воздействие, не сводя смысл ни к отдельным поступкам, ни исключительно к физическому принуждению.
- source_word: ἐπὶ πᾶσαν παρανομίαν
  choice: ко всякому беззаконию
  rationale: παρανομία означает нарушение закона, а πᾶσαν подчёркивает полноту и разнообразие такого поведения. Русское сочетание сохраняет связь с законом и широту выражения.
theological_decisions:
- issue: Нравственно-законнический смысл παρανομία в контексте иудейского Закона
  choice: беззаконие
  alternative: нечестие; преступление Закона
  rationale: «Беззаконие» прямо сохраняет идею жизни вопреки закону и допускает подразумеваемую связь с отеческим Законом, не уточняя её сверх сказанного в стихе.
- issue: Степень принуждения в ἐξεπολίτευσεν
  choice: приучать
  alternative: принуждать жить; вовлекать
  rationale: Редкий глагол может описывать насаждение определённого образа общественной жизни. Основной текст не усиливает его до однозначного физического принуждения, а примечание сохраняет более сильную возможность.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Этот народ» обеспечивает естественную контекстную связность; парные инфинитивы после «стал» представляют действия как развёрнутую политику правителя.
