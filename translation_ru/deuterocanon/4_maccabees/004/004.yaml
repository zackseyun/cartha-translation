lexical_decisions:
- source_word: τούτων ἕκαστα
  choice: обо всём этом в подробностях
  rationale: 'Передаёт распределительное значение ἕκαστα: Аполлоний узнал все относящиеся к делу сведения, а не лишь получил общее представление.'
- source_word: γνούς
  choice: узнав
  rationale: Деепричастие естественно передаёт предшествующее обстоятельство, выраженное аористным причастием γνούς.
- source_word: κηδεμονίας
  choice: заботу
  rationale: Слово обозначает попечение или заботливое участие. «Забота о царе» сохраняет смысл, не усиливая его до однозначной «преданности».
- source_word: ἐπαινεί
  choice: похвалил
  rationale: Историческое настоящее по-русски естественно передано прошедшим временем в повествовании.
- source_word: ἀναβὰς
  choice: отправился
  rationale: В контексте поездки к правителю буквальное «поднялся» звучало бы неестественно без ясной географической привязки; выбранный глагол сохраняет движение к Селевку.
- source_word: κατήμηνυε
  choice: сообщил ему
  rationale: Глагол допускает значения сообщения, донесения и раскрытия сведений. Нейтральное «сообщил» не навязывает обвинительного оттенка, которого объект-фраза сама по себе не требует.
- source_word: τὸν τῶν χρημάτων θησαυρόν
  choice: о хранилище денег
  rationale: θησαυρός здесь обозначает место или запас хранения, а χρήματα — деньги или денежные средства. Формулировка понятна современному читателю и сохраняет конкретный финансовый смысл.
- source_word: ὁ Ἀπολλώνιος
  choice: Аполлоний
  rationale: Принятая русская передача греческого личного имени.
- source_word: Σίμωνι
  choice: Симона
  rationale: Принятая русская передача личного имени с необходимым по синтаксису падежом.
- source_word: Σέλευκον
  choice: Селевку
  rationale: Принятая русская передача греческого личного имени с необходимым по синтаксису падежом.
