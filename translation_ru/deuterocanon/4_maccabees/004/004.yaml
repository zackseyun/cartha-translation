  text: When Apollonius learned each of these things[a], he praised Simon for his loyalty to the king, but went up to Seleucus and reported the treasury of funds;
translation:
  language: ru
  text: Узнав обо всём этом по отдельности, Аполлоний похвалил Симона за его заботу о царе, а затем поднялся к Селевку и сообщил ему о денежной казне[a].
