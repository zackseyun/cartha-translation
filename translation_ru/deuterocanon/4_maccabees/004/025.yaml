  yaml_path: translation/deuterocanon/4_maccabees/004/025.yaml
  text: Therefore[a], since his decrees were being despised by the people, he himself was forcing each one of the nation, by tortures, after tasting defiling foods, to renounce Judaism.
translation:
  language: ru
  text: Поэтому, поскольку народ с презрением отвергал его указы, он сам пытками принуждал каждого из этого народа, вкусив оскверняющей пищи, отречься от иудаизма[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под клятвой отречься от иудаизма». Глагол может подразумевать клятвенное отречение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δόγματα
  choice: указы
  rationale: В политическом контексте речь идёт о властных предписаниях правителя; «указы» естественно передаёт их официальный и обязательный характер.
- source_word: κατεφρονεῖτο
  choice: с презрением отвергал
  rationale: Передаёт не только неповиновение, но и сильный оттенок презрения в καταφρονέω; русская активная конструкция с «народ» звучит естественнее буквальной пассивной.
- source_word: διὰ βασάνων
  choice: пытками
  rationale: Кратко и точно выражает принуждение посредством физических мучений; творительный падеж естественно передаёт греческую конструкцию средства.
- source_word: ἕνα ἕκαστον τοῦ ἔθνους
  choice: каждого из народа
  rationale: Сохраняет распределительное ударение на каждом отдельном человеке и обозначение иудейского народа как целого.
- source_word: μιερῶν ... τροφῶν
  choice: оскверняющей пищи
  rationale: 'Передаёт культово-нравственный оттенок μιερός: такая пища оскверняет вкушающего. «Нечистая пища» была бы более привычной, но несколько сглаживала бы сильную лексику оригинала.'
- source_word: ἀπογευομένους
  choice: вкусив
  rationale: Деепричастие сохраняет значение вкушения и естественно указывает на действие, предшествующее требуемому отречению.
- source_word: ἐξόμνυσθαι
  choice: отречься
  rationale: Ясно и современно передаёт отказ от прежней принадлежности; возможный оттенок клятвенного отречения отмечен в сноске.
- source_word: τὸν Ἰουδαϊσμόν
  choice: от иудаизма
  rationale: Прямой русский эквивалент сохраняет широту понятия, включающего веру, идентичность и образ жизни, не сводя его лишь к одному аспекту.
theological_decisions:
- issue: Объём значения τὸν Ἰουδαϊσμόν
  choice: иудаизм
  alternative: иудейский образ жизни
  rationale: «Иудаизм» формально соответствует существительному оригинала и не сужает насильственное отречение только до религиозных убеждений либо только до этнической принадлежности.
- issue: Клятвенный оттенок ἐξόμνυσθαι
  choice: отречься
  alternative: под клятвой отречься
  rationale: Контекст ясно говорит о насильственном отступничестве, тогда как наличие формальной клятвы возможно, но не бесспорно; поэтому этот оттенок сохранён в сноске, а не внесён в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сохраняет причинную связь, личную инициативу гонителя и последовательность принуждения, вкушения оскверняющей пищи и отречения; тяжеловесные кальки с греческого устранены.
