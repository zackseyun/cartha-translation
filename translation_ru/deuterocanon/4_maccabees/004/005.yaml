lexical_decisions:
- source_word: λαβὼν
  choice: получив
  rationale: Аористное причастие от λαμβάνω обозначает действие, предшествующее подразумеваемому движению; деепричастие «получив» естественно передаёт эту последовательность.
- source_word: τὴν περὶ αὐτῶν ἐξουσίαν
  choice: власть над ними
  rationale: ἐξουσία означает власть, полномочие или право; сочетание с περὶ αὐτῶν здесь естественно передаётся как практическая власть над ранее упомянутыми людьми.
- source_word: ταχὺ
  choice: быстро
  rationale: Наречие указывает на быстроту действия, не обязательно подразумевая немедленность, которую могло бы привнести «тотчас».
- source_word: εἰς τὴν πατρίδα ἡμῶν
  choice: на нашу родину
  rationale: πατρίς обозначает родную землю или отечество; «на нашу родину» звучит естественно в современном русском и сохраняет национально-патриотический оттенок.
