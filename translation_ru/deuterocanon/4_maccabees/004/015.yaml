  text: When Seleucus the king had died[a], his son Antiochus Epiphanes succeeded to the rule, a proud and formidable man;
translation:
  language: ru
  text: После смерти царя Селевка власть унаследовал его сын Антиох Эпифан — человек надменный и грозный.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страшный». Греческое слово может означать «грозный», «страшный» или «ужасный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τελευτήσαντος δὲ Σελεύκου τοῦ βασιλέως
  choice: После смерти царя Селевка
  rationale: Генитив абсолютный обозначает предшествующее событие; конструкция «после смерти» естественно и точно передаёт временное отношение. Частица δέ здесь имеет связующую повествовательную функцию и не требует отдельного перевода.
- source_word: διάδεχεται τὴν ἀρχὴν
  choice: власть унаследовал
  rationale: Глагол обозначает преемство, а ἀρχή — правление или властные полномочия. Сочетание передаёт династическое наследование власти, не сужая значение до территории или царства.
- source_word: Ἀντίοχος Ἐπιφανής
  choice: Антиох Эпифан
  rationale: Сохранена устоявшаяся русская форма имени и исторического эпитета правителя; эпитет не переводится описательно.
- source_word: ἀνὴρ ὑπερήφανος
  choice: человек надменный
  rationale: ἀνήρ здесь вводит характеристику мужчины, а ὑπερήφανος имеет отрицательный оттенок высокомерия; «надменный» яснее передаёт его, чем нейтрально-положительное современное «гордый».
- source_word: δεινός
  choice: грозный
  rationale: Многозначное слово может обозначать того, кто внушает страх, ужасен или исключительно силён. В данной отрицательной характеристике «грозный» сохраняет оттенки опасности и внушаемого страха без чрезмерного уточнения.
