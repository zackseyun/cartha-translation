lexical_decisions:
- source_word: ἐπόρθησεν
  choice: разорив
  rationale: Глагол обозначает опустошение или разорение при военном захвате. «Разорив» сохраняет более сильный и конкретный смысл греческого слова, не сводя его лишь к подчинению.
- source_word: δόγμα ἔθετο
  choice: издал указ
  rationale: Устойчивое и естественное по-русски выражение для официального установления властного предписания.
- source_word: φαίνοιεν
  choice: окажется
  rationale: В условной административно-правовой формулировке передаёт выявление того, что человек следует запрещённому образу жизни, сохраняя оттенок греческого «являться, обнаруживаться».
- source_word: τῷ πατρίῳ ... νόμῳ
  choice: по закону предков
  rationale: Передаёт унаследованный от предков закон и не вводит более поздней конфессиональной терминологии.
- source_word: πολιτευόμενοι
  choice: живёт по
  rationale: Передаёт не единичное соблюдение, а образ жизни и поведение, устроенные согласно закону.
- source_word: θάνοιεν
  choice: должен быть предан смерти
  rationale: В контексте карательного указа греческое «умереть» имеет смысл предписанной казни; русский пассив ясно выражает наложенное властью наказание.
theological_decisions:
- issue: Передача выражения πατρίῳ νόμῳ как признака иудейской идентичности
  choice: закон предков
  alternative: отеческий закон
  rationale: «Закон предков» ясно выражает преемственность унаследованного иудейского закона и звучит естественно для современного читателя, не привнося дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык; повествование выдержано в dignified историческом регистре. Юридическая формула указа передана ясно, а военная семантика ἐπόρθησεν сохранена без излишнего уточнения характера разрушений.
