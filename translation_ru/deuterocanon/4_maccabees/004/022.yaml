  source_fidelity: 'В целом смысл передан точно: ἐπόρθησεν отражено как военное разорение, δόγμα ἔθετο — как официальный указ, а смертная санкция выражена ясно. Однако в исходном условном придаточном сказуемое θάνοιεν относится к «кто-либо» (εἴ τις), тогда как «тот должен быть предан смерти» в русском допустимо, но несколько тяжеловесно и менее близко воспроизводит простую формулу источника.'
