  text: And when he had subdued them[a], he issued a decree that if any of them were found living according to the ancestral law, they should be put to death.
translation:
  language: ru
  text: 'И, разорив их[a], он издал указ: если кто-либо из них будет уличён в том, что живёт по закону предков, его следует предать смерти.'
