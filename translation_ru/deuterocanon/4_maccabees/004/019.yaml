    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: так что
  rationale: Передаёт следствие предшествующих действий, не превращая оборот в простой логический вывод.
- source_word: μὴ μόνον ... ἀλλὰ καὶ
  choice: не только ... но и
  rationale: Естественно сохраняет греческую парную конструкцию и её риторическое равновесие.
- source_word: ἐπʼ αὐτῇ τῇ ἄκρᾳ
  choice: в самой крепости
  rationale: ἄκρα обозначает крепость или укреплённую высоту; «самой» передаёт усиление αὐτῇ. Предлог «в» естественен по-русски применительно к возведению учреждения на территории крепости.
- source_word: τῆς πατρίδος ἡμῶν
  choice: нашей родины
  rationale: Современное и выразительное соответствие понятию родной, отеческой земли.
- source_word: γυμνάσιον
  choice: гимнасий
  rationale: Сохраняет обозначение специфического эллинистического учреждения для физического воспитания и образования, не сводя его к современному спортивному залу.
- source_word: κατασκευάσαι
  choice: построил
  rationale: Кратко и естественно передаёт создание или сооружение гимнасия в данном контексте.
- source_word: καταλῦσαι
  choice: упразднил
  rationale: При отвлечённом объекте означает прекращение или отмену установленного порядка, а не физическое разрушение.
- source_word: κηδεμονίαν
  choice: попечение
  rationale: Передаёт совокупность заботы, опеки и ответственного ведения дел, не сужая смысл исключительно до охраны или управления.
- source_word: τοῦ ἱεροῦ
  choice: о храме
  rationale: В контексте ἱερόν обозначает храм и связанный с ним священный комплекс; «храм» является ясным и традиционно понятным соответствием.
theological_decisions:
- issue: Историко-культовый оттенок ἄκρα применительно к Иерусалиму
  choice: Описательное «крепость»
  alternative: Имя собственное «Акра»
  rationale: Само греческое слово может обозначать крепость или укреплённую высоту; описательный перевод понятен читателю и сохраняет вероятную историческую отсылку, а возможное чтение как топонима отмечено в сноске.
- issue: Смысл κηδεμονία τοῦ ἱεροῦ
  choice: «попечение о храме» как установленная опека и ответственное ведение его дел
  alternative: «надзор за храмом» или «управление храмом»
  rationale: Фраза относится к опеке, заботе или административному ведению храма, а не к разрушению самого здания; перевод не навязывает более узкую институциональную реконструкцию.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-религиозного повествования. Термин «гимнасий» сохранён ради эллинистической культурной специфики; синтаксис остаётся ясным и риторически сбалансированным.
