base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/035.yaml
  text: Nor will I disgrace you[a], O philosophical reason, nor will I renounce you[b], honored priesthood and knowledge of the law.
translation:
  language: ru
  text: Не опозорю и тебя, философский разум, и не отрекусь от тебя, почитаемое священство и знание Закона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом стоит местоимение единственного числа: «от тебя», хотя далее названы «священство и знание Закона». Это может быть собирательным обращением. «Знание Закона» также можно перевести как «знание законоположения».'
    reason: Сохранение грамматической особенности и лексической альтернативы оригинала.
lexical_decisions:
- source_word: καταισχυνῶ
  choice: не опозорю
  rationale: Будущее время καταισχύνω выражает причинение позора; русский глагол сохраняет смысл чести и бесчестия и естественен в личном обещании.
- source_word: φιλόσοφε λόγε
  choice: философский разум
  rationale: Прямое обращение, где λόγος — «разум», а φιλόσοφος характеризует его как философский; сохранены олицетворение и стилизованная компактность греческого выражения.
- source_word: ἑξαρνήσομαί
  choice: не отрекусь
  rationale: ἐξαρνέομαι обозначает решительный отказ или отречение; «отрекусь» передаёт более сильный смысл, чем простое «откажусь».
- source_word: ἱεροσύνη τιμία
  choice: почитаемое священство
  rationale: ἱεροσύνη означает священство или священническое служение, а τιμία — то, что пользуется честью и почтением.
- source_word: νομοθεσίας ἐπιστήμη
  choice: знание Закона
  rationale: ἐπιστήμη — знание или глубокое понимание, νομοθεσία — законоположение; в иудейском контексте «Закон» естественно указывает на данный Богом Закон, не сводя выражение к отвлечённому законодательству.
theological_decisions:
- issue: Олицетворённые реалии в прямом обращении
  choice: Философский разум, священство и знание Закона переданы как непосредственно призываемые идеалы, которым говорящий обещает остаться верным.
  alternative: Понять «священство и знание Закона» как пояснение к «философскому разуму» либо сгладить всё высказывание до общего отказа оставить философию и иудейское предание.
  rationale: Формы звательного падежа и местоимение второго лица поддерживают риторическое олицетворение. Тире обозначает переход к следующим обращениям, не навязывая окончательного решения их точной синтаксической связи.
- issue: Число подразумеваемого адресата при ἑξαρνήσομαί σε
  choice: Русское «отрекусь от вас» согласовано по смыслу с двумя следующими существительными, при сохранении их как единого риторического блока.
  alternative: 'Буквально сохранить единственное число: «не отрекусь от тебя, почитаемое священство и знание Закона».'
  rationale: В греческом стоит единственное σε, хотя далее следуют два существительных; буквальное русское согласование звучало бы резко и могло бы ложно представить их одним понятием. Разночтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский, торжественный, но понятный. Сохранены прямая речь, олицетворение и риторический параллелизм. «Закон» написан с прописной буквы как обозначение иудейского Закона в данном контексте.
