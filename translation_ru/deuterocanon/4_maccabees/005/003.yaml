  yaml_path: translation/deuterocanon/4_maccabees/005/003.yaml
  text: But if any should be unwilling to eat defiling food[b][a], let them be broken on the wheel and put to death.
translation:
  language: ru
  text: Если же некоторые не пожелают есть оскверняющую пищу[a], их подвергнуть пытке на колесе[b] и предать смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «есть нечистую пищу»; греческий глагол сам по себе означает вкушение того, что ритуально оскверняет, а отдельное слово «пища» в этой фразе отсутствует.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подвергнуть колесованию» или «ломать на колесе». Греческое слово обозначает пытку либо казнь с применением колеса, но не уточняет здесь все подробности способа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ τινες
  choice: Если же некоторые
  rationale: Передаёт условную конструкцию и неопределённое множественное число τινες, сохраняя связь с последующим τούτους («их»).
- source_word: μὴ θέλοιεν
  choice: не пожелают
  rationale: Сохраняет значение желания и воли в θέλω, не усиливая его до прямого «откажутся».
- source_word: μιεροφαγῆσαι
  choice: есть оскверняющую пищу
  rationale: Сложный глагол обозначает вкушение того, что ритуально оскверняет; слово «пищу» добавлено по смыслу, поскольку отдельного дополнения в греческом нет.
- source_word: τούτους
  choice: их
  rationale: Естественно отсылает к неопределённой группе, обозначенной словом τινες.
- source_word: τροχισθέντας
  choice: подвергнуть пытке на колесе
  rationale: Передаёт наказание или пытку с применением колеса, не фиксируя более узкий способ как несомненный.
- source_word: ἀναιρεθῆναι
  choice: предать смерти
  rationale: Соответствует значению убийства или умерщвления и сохраняет официальный тон распоряжения.
