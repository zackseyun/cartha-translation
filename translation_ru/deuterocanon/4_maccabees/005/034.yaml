translation:
  language: ru
  text: Не солгу тебе[a], о Закон-наставник, и не пощажу тебя[b], возлюбленное самообладание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не окажусь неверным тебе» или «не предам тебя». Греческий глагол может означать как «лгать», так и быть неверным тому, к кому обращаются.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не пощажу тебя». Греческий текст непосредственно обращается к олицетворённым Закону-наставнику и самообладанию; необычность этого выражения сохранена в переводе.'
    reason: cultural_note
lexical_decisions:
- source_word: ψεύσομαί
  choice: не окажусь неверным тебе
  rationale: Будущее ψεύδομαι с личным дополнением может означать не только ложь, но и неверность тому, к кому обращаются. Русское выражение сохраняет образ верности и не сужает смысл до словесной лжи.
- source_word: παιδευτὰ νόμε
  choice: о Закон, воспитывающий меня
  rationale: 'Обе формы стоят в звательном обращении: νόμος персонифицирован как воспитатель. Такая передача естественна по-русски и сохраняет педагогическое значение παιδευτής; «меня» эксплицирует подразумеваемый объект воспитания из речи героя.'
- source_word: φείσομαί
  choice: не отступлю от тебя
  rationale: φείδομαι буквально означает «щадить, удерживаться». В контексте верности добродетели буквальное «не пощажу тебя» по-русски создало бы ложное впечатление враждебности; «не отступлю» передаёт решимость не удерживаться от самообладания под пыткой.
- source_word: φίλη
  choice: возлюбленное
  rationale: Сохраняет возвышенное и личностное обращение к персонифицированной добродетели.
- source_word: ἐγκράτεια
  choice: самообладание
  rationale: Обозначает власть над желаниями и побуждениями. «Самообладание» естественно в современном русском и несколько лучше, чем «самоконтроль», соответствует возвышенному регистру.
theological_decisions:
- issue: Олицетворение Закона и нравственной добродетели
  choice: Сохранены прямые обращения к Закону-воспитателю и возлюбленному самообладанию.
  alternative: Передать содержание отвлечённо, без прямых обращений.
  rationale: Греческий текст использует звательные формы и риторическую апострофу; их сохранение передаёт литературный и нравственно-философский строй отрывка без добавления конфессионального толкования.
- issue: Неоднозначность φείσομαί с обращением к ἐγκράτεια
  choice: Передано контекстуально как «не отступлю от тебя», а буквальное значение вынесено в примечание.
  alternative: «Не пощажу тебя» или «не стану тебя беречь».
  rationale: Буквальная русская формулировка легко понимается как намерение причинить вред самообладанию, тогда как контекст выражает непоколебимую приверженность ему. Примечание сохраняет исходную метафорическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с возвышенной риторической интонацией. Сохранены параллелизм двух отрицательных обещаний и олицетворение Закона и самообладания; архаический звательный оттенок передан частицей «о».
