  yaml_path: translation/deuterocanon/4_maccabees/005/024.yaml
  text: And it trains in righteousness[a], so that one may be fair in all matters of conduct, and it teaches piety[b], so that one may worship only the God who truly exists with due majesty.
translation:
  language: ru
  text: И она воспитывает в праведности[a], чтобы во всех сферах поведения поступать справедливо, и учит благочестию[b], чтобы с подобающим величием поклоняться лишь Богу, Который действительно есть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливости». Греческое слово может обозначать как праведность, так и справедливость.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «Богу, Который действительно есть» подчёркивает, что Он — действительный Бог, в отличие от ложных богов; возможный перевод: «истинному Богу».'
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνην
  choice: праведности
  rationale: Слово обозначает нравственную правоту, но в данном этическом контексте сохраняет также оттенок справедливости; этот оттенок отмечен в сноске.
- source_word: παιδεύει
  choice: воспитывает
  rationale: Глагол говорит не только о передаче знаний, но и о нравственном формировании человека.
- source_word: διὰ πάντων τῶν ἠθῶν
  choice: во всём
  rationale: Оборот охватывает все стороны нрава и поведения; краткое русское выражение естественно передаёт всеобъемлющий смысл в связи с глаголом «поступал».
- source_word: ἰσονομεῖν
  choice: поступал беспристрастно
  rationale: Глагол связан с равенством и равным отношением; «поступал беспристрастно» передаёт его практический этический смысл без неестественной буквальности.
- source_word: εὐσεβείαν
  choice: благочестию
  rationale: Термин обозначает почтительную преданность Богу; «благочестие» — естественный и устойчивый русский эквивалент.
- source_word: σέβειν
  choice: поклонялся
  rationale: При Боге как прямом объекте глагол выражает религиозное почитание и поклонение.
- source_word: μόνον τὸν ὄντα θεὸν
  choice: лишь Богу, Который поистине существует
  rationale: Так сохраняется акцент причастия ὄντα на действительном бытии Бога в противопоставлении ложным богам, не сводя выражение просто к эпитету «истинный».
- source_word: μεγαλοπρεπῶς
  choice: с подобающим величием
  rationale: Наречие указывает на величественный образ почитания, соответствующий величию Бога; выбранная формулировка звучит по-русски достойно и естественно.
theological_decisions:
- issue: Значение δικαιοσύνη в этическом контексте
  choice: праведность
  alternative: справедливость
  rationale: Основной текст сохраняет широкое значение нравственной правоты, а юридико-этический оттенок справедливости указан в сноске.
- issue: Смысл μόνον τὸν ὄντα θεὸν
  choice: лишь Богу, Который поистине существует
  alternative: только истинному Богу
  rationale: Развёрнутый перевод сохраняет онтологический акцент греческого выражения и его противопоставление мнимым богам, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и достойный. Женское местоимение «она» сохраняет связь с подразумеваемой в контексте Мудростью или Законом, не называя референт сверх исходного текста. Термины «праведность» и «благочестие» сохранены как понятные библейские слова, а более трудные смысловые оттенки вынесены в сноски.
