  text: When the tyrant was urging him in this way toward the lawless eating of flesh, Eleazar asked to speak.
translation:
  language: ru
  text: Когда тиран таким образом принуждал его к противозаконному вкушению мяса, Елеазар попросил слова.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκθεσμον σαρκοφαγίαν
  choice: противозаконному вкушению мяса
  rationale: ἔκθεσμος означает «противный закону, беззаконный»; здесь речь о вкушении мяса вопреки Закону. «Вкушение мяса» естественно и достойно передаёт σαρκοφαγίαν без чрезмерно буквального оттенка «плотоядности».
- source_word: ἐποτρύνοντος
  choice: принуждал
  rationale: Глагол обозначает настойчивое побуждение или понуждение; в контексте действий тирана «принуждал» передаёт силу давления.
- source_word: λόγον ᾔτησεν
  choice: попросил слова
  rationale: Устойчивое русское выражение точно передаёт просьбу предоставить возможность выступить или ответить.
- source_word: Τοῦτον τὸν τρόπον
  choice: таким образом
  rationale: Прямое и естественное соответствие, связывающее стих с описанным ранее способом давления.
theological_decisions:
- issue: Характер запрета на вкушение мяса
  choice: противозаконному
  alternative: беззаконному
  rationale: Выбор сохраняет явную отсылку к нарушению Закона и не вводит конфессионального толкования; «беззаконному» также возможно, но в современном русском чаще воспринимается как общая нравственная характеристика.
