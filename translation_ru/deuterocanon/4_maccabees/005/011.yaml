translation:
  language: ru
  text: и развеешь вздор своих рассуждений[a], и, обретя разум, подобающий твоему возрасту, станешь философствовать об истине того, что полезно[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разгони нелепость своих мыслей»; возможно также: «отбрось вздор своих доводов».'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол буквально означает «философствовать», то есть заниматься философским осмыслением; здесь намеренно употреблена философская, а не просто общая лексика размышления.
    reason: cultural_note
lexical_decisions:
- source_word: ἀποσκεδάσεις
  choice: рассеешь
  rationale: Будущее время глагола передаёт образ рассеивания или разгоняния; «рассеешь» сохраняет метафору и естественно сочетается с отвлечённым дополнением.
- source_word: λῆρον τῶν λογισμῶν
  choice: вздор своих рассуждений
  rationale: λῆρος обозначает вздор, нелепость или пустословие, а λογισμοί — рассуждения, мысли либо доводы. Формулировка сохраняет интеллектуальный оттенок и не сводит выражение только к устной речи.
- source_word: ἄξιον τῆς ἡλικίας
  choice: достойный твоего возраста
  rationale: Перевод близко передаёт идею образа мыслей, подобающего возрасту, не подменяя прямое указание на возраст толкованием о зрелости.
- source_word: ἀναλαβὼν νοῦν
  choice: обретя разум
  rationale: Греческое выражение буквально говорит о принятии или обретении ума. «Обретя разум» звучит по-русски естественно и сохраняет образ перехода к надлежащему образу мышления.
- source_word: φιλοσοφήσεις
  choice: станешь философствовать
  rationale: Сохранён явный философский термин, существенный для языка и замысла 4 Маккавейской книги; более общее «размышлять» сгладило бы авторскую лексику.
- source_word: τὴν τοῦ συμφέροντος ἀλήθειαν
  choice: об истине того, что полезно
  rationale: συμφέρον обозначает полезное, выгодное или благотворное. Перевод сохраняет содержательную открытость выражения и не сужает его до материальной выгоды.
theological_decisions:
- issue: Философская терминология 4 Маккавейской книги
  choice: Сохранить слова «рассуждения», «разум» и «философствовать»
  alternative: 'Передать всё обобщённой нравственной лексикой: «мысли», «здравый смысл», «размышлять»'
  rationale: Автор намеренно описывает иудейское благочестие в философских категориях. Сохранение этой терминологии передаёт концептуальный мир текста и не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством философского увещания. Синтаксис слегка приподнят, но понятен; явная философская терминология оригинала сохранена. Конечная запятая отражает продолжение предложения в следующем стихе.
