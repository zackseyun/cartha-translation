  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβὼν
  choice: получив
  rationale: Аористное причастие обозначает обстоятельство, предшествующее основному действию. В сочетании с ἐξουσίαν по-русски естественно «получив право», а не буквальное «взяв право».
- source_word: τοῦ λέγειν
  choice: говорить
  rationale: Субстантивированный инфинитив определяет содержание ἐξουσίαν; русское сочетание «право говорить» передаёт эту связь ясно и естественно.
- source_word: ἐξουσίαν
  choice: право
  rationale: Слово допускает значения «власть», «право», «свобода» или «позволение». Здесь речь идёт о предоставленной возможности выступить, поэтому «право» сохраняет смысл, не приписывая говорящему должностной власти.
- source_word: ἤρξατο
  choice: начал
  rationale: Сохранено прямое начинательное значение глагола ἄρχομαι.
- source_word: δημηγορεῖν
  choice: свою речь перед собравшимися
  rationale: Глагол означает публично выступать перед народом или собранием. Формулировка передаёт публичный характер речи и звучит естественно на современном русском.
- source_word: οὕτως
  choice: так
  rationale: Наречие вводит последующее содержание прямой речи; перед двоеточием русское «так» является кратким и естественным соответствием.
