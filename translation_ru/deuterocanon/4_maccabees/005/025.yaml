base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/025.yaml
  text: Therefore we do not eat defiling food[a]; for because we believe that the law has been established by God, we know that the Creator of the world, in giving the law[b], also sympathizes with our nature.
translation:
  language: ru
  text: 'Поэтому мы не едим осквернённой пищи[a]. Ведь, веря, что Бог установил Закон, мы знаем: Творец мира, давая Закон, считается с нашей природой[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «не едим осквернённого».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст можно также понять так: «Творец мира, законодательствуя, сочувствует нам сообразно природе».'
    reason: alternative_reading
lexical_decisions:
- source_word: μιεροφαγοῦμεν
  choice: не едим оскверняющей пищи
  rationale: Сложный глагол означает употреблять в пищу осквернённое или нечистое. Такой перевод естественен по-русски, передаёт подразумеваемый объект и не вводит более узкой обрядовой категории, чем позволяет греческий текст.
- source_word: πιστεύοντες
  choice: мы верим
  rationale: Причастие имеет причинный оттенок и объясняет отказ от такой пищи. Личная форма делает длинное греческое предложение ясным и естественным по-русски.
- source_word: καθέστασθαι
  choice: установлен
  rationale: Перфектный инфинитив указывает на учреждение Закона и его сохраняющуюся силу.
- source_word: τὸν νόμον
  choice: Закон
  rationale: Артикль указывает на конкретный Божий Закон; прописная буква помогает передать это устойчивое референтное значение в русском библейском контексте.
- source_word: κατὰ φύσιν
  choice: с нашей природой
  rationale: В сочетании с ἡμῖν συμπαθεῖ выражение указывает на согласованность законодательства с человеческой природой. Формулировка сохраняет связь с природой, не навязывая тексту законченную философскую систему.
- source_word: συμπαθεῖ
  choice: считается
  rationale: Глагол обозначает сочувствие, участие или внимательное отношение. Русское «считается с нашей природой» естественно передаёт заботливое внимание Законодателя и избегает неидиоматичного «сочувствует природе».
- source_word: νομοθετῶν
  choice: давая Закон
  rationale: Причастие описывает Творца в действии Законодателя. Перевод сохраняет явную связь с ранее названным Законом.
- source_word: ὁ τοῦ κόσμου κτίστης
  choice: Творец мира
  rationale: Прямой и достоинственный перевод титульного выражения, сохраняющий его вселенский масштаб.
theological_decisions:
- issue: Смысл отказа от пищи
  choice: Речь идёт об отказе употреблять пищу, которая оскверняет или считается осквернённой согласно Божьему Закону.
  alternative: «Мы не едим осквернённого» или «мы не оскверняем себя пищей».
  rationale: Сам сложный глагол содержит идею оскверняющего принятия пищи, а контекст связан с запрещённой пищей. Перевод раскрывает подразумеваемый объект, не добавляя конфессиональной трактовки.
- issue: Отношение Творца к человеческой природе при установлении Закона
  choice: Устанавливая Закон, Творец принимает во внимание человеческую природу.
  alternative: Творец, законодательствуя согласно природе, проявляет сочувствие к людям.
  rationale: Дательный ἡμῖν при συμπαθεῖ указывает на участие по отношению к людям, тогда как κατὰ φύσιν допускает разные синтаксические оттенки. Основной текст передаёт наиболее естественный общий смысл, а примечание сохраняет альтернативное прочтение.
translation_notes:
  register: Современный литературный русский язык с достоинственным библейским звучанием. Синтаксис исходного длинного предложения слегка расчленён для ясности; причинная связь и логическое развитие мысли сохранены. Формулировка о природе намеренно не превращена в утверждение определённой философской или конфессиональной системы.
