  text: and by bowing down to my humane persuasion[a], you will have pity on your own old age.
translation:
  language: ru
  text: и, склонившись перед моим человеколюбивым увещанием[a], ты пожалеешь собственную старость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «почтив моё человеколюбивое увещание»; в более широком контексте принуждения к отступничеству возможно: «поклонившись».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνήσας
  choice: склонившись перед
  rationale: Аористное причастие передаёт действие, посредством которого, по словам царя, старец пощадит себя. Выражение сохраняет телесный образ поклона и смысл подчинения, не сводя глагол исключительно к религиозному поклонению.
- source_word: μου
  choice: моим
  rationale: Притяжательное местоимение относится к παρηγορίαν и указывает на увещание говорящего.
- source_word: τὴν φιλάνθρωπον παρηγορίαν
  choice: человеколюбивым увещанием
  rationale: παρηγορία здесь означает убеждающее увещание или призыв, а φιλάνθρωπος — человеколюбивый, благожелательный. Формулировка сохраняет самооценку царя, не подтверждая, что его принуждение действительно милосердно.
- source_word: οἰκτειρήσεις
  choice: ты пожалеешь
  rationale: Будущее время οἰκτείρω означает «пожалеть, проявить сострадание»; по-русски эта форма естественно сочетается с объектом «собственную старость».
- source_word: τὸ σεαυτοῦ γῆρας
  choice: собственную старость
  rationale: γῆρας означает старость, а усиленное возвратное σεαυτοῦ подчёркивает обращённый к самосохранению довод.
theological_decisions:
- issue: Смысл προσκυνέω в контексте царского требования
  choice: склонившись перед
  alternative: поклонившись; почтив
  rationale: Глагол может обозначать земной поклон, выражение почтения или поклонение. Основной текст сохраняет образ поклона и подчинения, а примечание указывает на более сильный культовый оттенок, возможный в контексте принуждения к отступничеству.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Человеколюбивым» намеренно сохраняет риторическую самооценку царя, а «склонившись перед» — неоднозначность между поклоном, почтением и подчинением.
