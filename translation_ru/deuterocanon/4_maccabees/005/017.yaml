lexical_decisions:
- source_word: διὸ
  choice: Поэтому
  rationale: Передаёт выводное значение союза, связывающего утверждение с предшествующим рассуждением.
- source_word: δὴ
  choice: и
  rationale: В сочетании «мы и считаем» естественно передаёт усилительный оттенок частицы, не утяжеляя русскую фразу.
- source_word: κατʼ οὐδένα τρόπον
  choice: каким бы то ни было образом
  rationale: Сохраняет категоричность отрицания и охватывает любой способ нарушения.
- source_word: παρανομεῖν
  choice: нарушать закон
  rationale: Точно и понятно передаёт действие вопреки закону, сохраняя юридико-нравственный смысл.
- source_word: ἀξιοῦμεν
  choice: считаем недопустимым
  rationale: Передаёт обдуманное суждение о неприемлемости действия; отрицание при этом естественно выражено по-русски вместе со сказуемым.
theological_decisions:
- issue: Характер закона в данном стихе
  choice: «закон» со строчной буквы, без уточнения
  alternative: «Закон» или «Моисеев закон»
  rationale: В греческом стихе нет уточняющего определения. Контекст указывает на отеческий иудейский закон, однако добавлять это прямо в текст стиха означало бы устранять сохранённую оригиналом обобщённость.
translation_notes:
  register: Современный литературный русский язык; фраза звучит достойно и естественно. Усиление δὴ передано конструкцией «мы и считаем», а абсолютное отрицание — оборотом «каким бы то ни было образом».
