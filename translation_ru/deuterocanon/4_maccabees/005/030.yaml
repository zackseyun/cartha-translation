  text: You will not even gouge out my eyes and melt my inward parts[a].
translation:
  language: ru
  text: Ты даже не вырвешь мне глаза и не расплавишь мои внутренности[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мои внутренние органы». Греческое слово обозначает внутренности, внутренние органы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδʼ ἂν
  choice: Ты даже не
  rationale: Сочетание усиливает отрицание. Передача «даже не» естественно выражает его эмфатическую силу, не превращая фразу в явно условную конструкцию.
- source_word: ἐκκόψεις
  choice: вырвешь
  rationale: Глагол буквально означает «вырезать, отсечь». В сочетании с глазами русское «вырвешь» звучит естественно и сохраняет жестокий телесный образ.
- source_word: τὰ ὄμματα
  choice: мне глаза
  rationale: Существительное во множественном числе прямо обозначает глаза. Дательный «мне» естественно передаёт греческое притяжательное местоимение в русском языке.
- source_word: τὰ σπλάγχνα
  choice: мои внутренности
  rationale: Слово обозначает внутренние органы, внутренности. Этот вариант сохраняет телесный смысл и остаётся понятным современному читателю.
- source_word: τήξεις
  choice: расплавишь
  rationale: Глагол означает «плавить, заставлять таять». Буквальная передача сохраняет необычный и сильный образ исходного текста, не заменяя его толкованием вроде «истребишь».
