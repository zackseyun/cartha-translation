  text: So do not suppose this to be a small sin[a], if we were to eat polluted food.
translation:
  language: ru
  text: Итак, не считай малым грехом, если мы станем есть осквернённую пищу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если мы станем есть нечистое». Греческий глагол одним словом выражает вкушение пищи, считающейся осквернённой или ставшей непозволительной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... νομίσῃς
  choice: не считай
  rationale: Глагол νομίζω вводит оценочное суждение; «не считай» естественно передаёт запрет преуменьшать серьёзность поступка.
- source_word: μικρὰν ... ταύτην ... ἁμαρτίαν
  choice: малым грехом
  rationale: Прилагательное μικράν прямо определяет ἁμαρτίαν; русский творительный после «считать» ясно передаёт смысл, а указательное ταύτην по-русски естественно остаётся подразумеваемым, поскольку поступок раскрывается далее.
- source_word: εἰ
  choice: если мы станем
  rationale: Передаёт условный и предполагаемый характер действия без излишне архаичной формы.
- source_word: μιεροφαγήσαμεν
  choice: есть осквернённую пищу
  rationale: Сложный глагол обозначает вкушение того, что осквернено или профанировано; добавление «пищу» делает подразумеваемый объект явным и сохраняет религиозный оттенок.
theological_decisions:
- issue: Степень явности понятия ритуального осквернения в μιεροφαγήσαμεν
  choice: есть осквернённую пищу
  alternative: есть нечистое
  rationale: «Осквернённую» сохраняет культово-нравственный смысл, а не сводит речь к физической загрязнённости; примечание фиксирует допустимую более сжатую передачу.
translation_notes:
  register: Современный литературный русский язык; речь краткая, серьёзная и увещательная. Сохранены условность действия и акцент на недопустимости считать такой грех малым.
