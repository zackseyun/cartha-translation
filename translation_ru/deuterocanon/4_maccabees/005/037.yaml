  text: My fathers will welcome me as a champion[a], since I did not fear your constraints, even unto death.
translation:
  language: ru
  text: Праотцы примут меня как борца[a], потому что я не устрашился твоих принуждений вплоть до смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен более буквальный перевод: «Праотцы примут меня как участника борьбы (или состязания)». Греческое слово создаёт образ атлетической или боевой борьбы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγών᾽
  choice: как борца
  rationale: Форма передаёт образ состязания или борьбы. Русское «борца» естественно выражает предикативный смысл и сохраняет атлетико-боевую образность, не уточняя, о каком именно виде борьбы идёт речь.
- source_word: οἱ πατέρες
  choice: праотцы
  rationale: В контексте ожидаемой встречи с почившими предками речь идёт не о непосредственных родителях, а о предках веры; «праотцы» сохраняет мужской род и возвышенный, но понятный библейский оттенок.
- source_word: προσδέξονται
  choice: примут
  rationale: Глагол обозначает благосклонный приём. «Примут» звучит естественно и не добавляет эмоциональной теплоты сверх явно сказанного.
- source_word: μὴ φοβηθέντα
  choice: потому что я не устрашился
  rationale: Причастие характеризует говорящего и допускает причинное прочтение. Личная конструкция естественна по-русски и сохраняет торжественный регистр.
- source_word: σου
  choice: твоих
  rationale: Притяжательное местоимение относится к принуждениям, исходящим от тирана.
- source_word: τὰς μέχρι θανάτου ἀνάγκας
  choice: твои принуждения, даже ведущие к смерти
  rationale: ἀνάγκαι здесь означает меры принуждения или насильственное давление, а μέχρι θανάτου — их предельную, смертельную степень. Формулировка сохраняет множественное число и естественно передаёт направленность принуждения вплоть до смерти.
theological_decisions:
- issue: Кого обозначают «отцы» и подразумевается ли посмертная встреча
  choice: «Праотцы» — предки, которые примут говорящего после его верной стойкости
  alternative: Почитаемые предки вообще, без явного указания на посмертную встречу
  rationale: Контекст предстоящей мученической смерти поддерживает ожидание приёма у праотцов. Перевод сохраняет само утверждение текста, но не развивает его в подробное учение о загробной жизни.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Праотцы» и «устрашился» поддерживают достоинство речи, тогда как синтаксис остаётся ясным для современного читателя.
