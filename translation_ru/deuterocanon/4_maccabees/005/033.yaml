  text: I will not pity my own old age so much that I would, by my own act, abolish the ancestral law.
translation:
  language: ru
  text: Я не стану жалеть собственную старость настолько, чтобы самому упразднить отеческий закон.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχ οὕτως ... ὥστε
  choice: не ... настолько, чтобы
  rationale: Греческая конструкция выражает степень и предполагаемый результат; русское сочетание естественно передаёт эту логическую связь.
- source_word: οἰκτειρήσω
  choice: стану жалеть
  rationale: Глагол обозначает жалость или сострадание. «Жалеть» сохраняет эмоциональный смысл и естественно сочетается с «собственную старость».
- source_word: τὸ ἐμαυτοῦ γῆρας
  choice: собственную старость
  rationale: γῆρας означает старость, а ἐμαυτοῦ подчёркивает личную отнесённость; «собственную» передаёт это усиление без тяжеловесности.
- source_word: με διʼ ἐμαυτοῦ
  choice: самому
  rationale: Оборот подчёркивает личное участие говорящего как непосредственного виновника действия. Русское «самому» кратко и ясно передаёт рефлексивный акцент.
- source_word: τὸν πάτριον νόμον
  choice: отеческий закон
  rationale: πάτριος указывает на закон, полученный от отцов и предков. «Отеческий закон» сохраняет историко-религиозную связь с наследием предков и звучит достойно.
- source_word: καταλῦσαι
  choice: упразднить
  rationale: Глагол означает разрушить, отменить или лишить силы. Здесь речь не о буквальном уничтожении, а о подрыве действенности закона собственным поступком; «упразднить» сохраняет эту силу выражения.
theological_decisions:
- issue: Передача πάτριον νόμον в контексте иудейского мученичества
  choice: отеческий закон
  alternative: закон предков
  rationale: Выражение обозначает унаследованный от отцов иудейский закон. «Отеческий закон» сохраняет религиозно-исторический оттенок, не вводя более поздней конфессиональной терминологии.
- issue: Смысл καταλῦσαι применительно к закону
  choice: упразднить
  alternative: нарушить
  rationale: 'Греческий глагол сильнее простого «нарушить»: поступок говорящего представлен как действие, подрывающее или отменяющее авторитет закона в его собственном случае. Поэтому сохранена намеренная риторическая сила оригинала.'
translation_notes:
  register: Современный литературный русский язык с достойным, прямым звучанием. Синтаксис сохраняет выраженную в греческом связь степени и результата, а повторный рефлексивный акцент передан сочетанием «собственную» и «самому».
