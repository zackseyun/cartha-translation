  text: Nor will you defile my mouth, made venerable by old age, nor the years of a law-abiding life.
translation:
  language: ru
  text: И ты не осквернишь моих уст, почтенных старостью, ни лет жизни по Закону.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μιαινεῖς
  choice: осквернишь
  rationale: Передаёт религиозно-нравственный оттенок глагола «осквернять, делать нечистым» и сохраняет достоинство контекста.
- source_word: τὸ σεμνὸν γήρως στόμα
  choice: моих уст, почтенных старостью
  rationale: 'Сохраняет синтаксическую связь: именно старость придаёт устам почтенность; множественное «уста» естественно для возвышенного русского регистра.'
- source_word: νομίμου βίου
  choice: жизни по Закону
  rationale: В данном иудейском контексте νόμιμος относится к жизни, согласной с Законом, а не просто к гражданской законопослушности.
- source_word: ἡλικίαν
  choice: лет
  rationale: В сочетании с βίος слово обозначает прожитый срок, возраст; «лет жизни» звучит по-русски естественно и соответствует смыслу.
theological_decisions:
- issue: Значение νόμιμος
  choice: по Закону
  alternative: законопослушной
  rationale: Заглавная буква и формулировка указывают на иудейский Закон как норму всей жизни, не вводя более узкого конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной, соответствующей речи старца лексикой. Параллелизм двух дополнений сохранён; подлинная сжатость второй греческой фразы передана без поясняющих добавлений.
