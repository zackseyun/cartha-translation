  text: He ordered the guards to drag away each one of the Hebrews and force them to taste pork and meat sacrificed to idols[b][a];
translation:
  language: ru
  text: Он приказал стражникам[a] оттаскивать в сторону каждого из евреев и принуждать его отведать свинины и мяса, принесённого в жертву идолам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «телохранителям»; букв.: «копьеносцам».'
    reason: лексическая альтернатива для δορυφόροι
  - marker: b
    text: 'Или: «пищи, принесённой в жертву идолам».'
    reason: лексическая альтернатива для εἰδωλόθυτα
lexical_decisions:
- source_word: παρεκέλευεν
  choice: Он приказал
  rationale: Передаёт властный характер распоряжения; имперфект допускает продолжающееся исполнение приказа, что отражено зависимыми несовершенными инфинитивами «оттаскивать» и «принуждать».
- source_word: τοῖς δορυφόροις
  choice: стражникам
  rationale: Буквально слово обозначает «копьеносцев», а по функции — телохранителей или стражу. «Стражникам» естественно передаёт их роль в данной сцене без излишней конкретизации вооружения.
- source_word: ἕνα ἕκαστον τῶν Ἐβραίων
  choice: каждого из евреев
  rationale: 'Сохраняет усиленное дистрибутивное значение: насилию подвергали каждого по отдельности. «Евреев» прямо соответствует Ἐβραίων.'
- source_word: περισπᾶσθαι
  choice: оттаскивать в сторону
  rationale: Передаёт буквальный образ насильственного оттягивания или увода человека в сторону точнее, чем более общее «схватывать».
- source_word: κρεῶν ὑείων
  choice: свинины
  rationale: Современный и точный русский эквивалент выражения «свиное мясо».
- source_word: εἰδωλοθύτων
  choice: мяса, принесённого в жертву идолам
  rationale: В сочетании с κρεῶν ὑείων субстантивированное слово естественно понимается как жертвенное мясо; формулировка ясно передаёт культовый контекст.
- source_word: ἀναγκάζειν
  choice: принуждать
  rationale: Точно выражает насильственное понуждение и соответствует достоинству повествовательного регистра.
- source_word: ἀπογεύεσθαι
  choice: отведать
  rationale: Сохраняет значение «попробовать, вкусить», не усиливая его до полноценного принятия пищи.
theological_decisions:
- issue: Передача Ἐβραίων
  choice: евреев
  alternative: иудеев
  rationale: Греческий текст прямо употребляет «евреев»; замена на «иудеев» неоправданно сгладила бы этническую и историческую окраску.
- issue: Степень участия в запретной пище, выраженная ἀπογεύεσθαι
  choice: отведать
  alternative: есть
  rationale: 'Исходный глагол может обозначать даже пробу пищи. Такая передача сохраняет напряжение текста: принуждение к нарушению предполагается уже в самом вкушении, без утверждения о полном употреблении пищи.'
- issue: Значение εἰδωλοθύτων
  choice: мяса, принесённого в жертву идолам
  alternative: пищи, принесённой в жертву идолам
  rationale: Контекст координации со свининой поддерживает значение жертвенного мяса, однако более широкое лексическое значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-д dignified повествовательный тон. Несовершенные инфинитивы передают последовательное или повторяющееся исполнение приказа. Маркеры сносок поставлены непосредственно после соответствующего выражения.
