lexical_decisions:
- source_word: οἰκειωθησόμενα
  choice: то, что сродно
  rationale: Причастие передаёт соответствие или близость душе. «Сродно» сохраняет оттенок внутреннего, нравственного соответствия и не сводит мысль к одной лишь полезности.
- source_word: ψυχαῖς
  choice: душам
  rationale: В контексте слово имеет нравственно-психологический вес; «душам» сохраняет антропологическую и этическую силу высказывания.
- source_word: ἐπέτρεψεν
  choice: разрешил
  rationale: Естественно передаёт позволение в контексте данного Богом пищевого закона.
- source_word: ἐναντιωθησόμενα
  choice: противную
  rationale: Передаёт значение противоположности и несоответствия душам, сохраняя нравственный оттенок греческого слова.
- source_word: ἐκώλυσεν
  choice: запретил
  rationale: В параллели с «разрешил» глагол выражает именно запрет, а не физическое воспрепятствование.
- source_word: σαρκοφαγεῖν
  choice: вкушать плоть
  rationale: Сохраняет буквальный компонент «плоть» и достаточно естественно звучит в возвышенном рассуждении о пищевом законе.
theological_decisions:
- issue: Антропологический смысл ψυχαῖς в связи с пищевым законом
  choice: 'Сохранено «душам» и выражение нравственного соответствия: «сродно… противную»'
  alternative: Передать ψυχαῖς как «жизни» или «нам самим», а οἰκειωθησόμενα — как «полезно» или «подходит»
  rationale: Стих связывает предписания закона с внутренней нравственной жизнью, а не только с телесным здоровьем. Формулировка сохраняет это утверждение, не привнося позднейших доктринальных определений души.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, достойным контекста звучанием. Инверсия во второй части поддерживает параллелизм «разрешил… запретил»; «вкушать плоть» передаёт σαρκοφαγεῖν без разговорного оттенка.
