review_pass:
  verdict: revise
  source_fidelity: 'Смысл греческого текста в целом передан верно: σωφροσύνη — «самообладание», κρατεῖν — господство над удовольствиями и желаниями, ἀνδρεία — мужество, а ἑκουσίως ὑπομένειν — добровольное перенесение страдания. Однако в русском тексте второй целевой оборот завершается инфинитивом «переносить», тогда как подлежащее «мы» уже введено; это нарушает параллелизм и несколько ослабляет ясность связи.'
  naturalness: «Властвовать над» понятно, но в этическом контексте «господствовать над» несколько естественнее и точнее передаёт активное κρατεῖν. Замена финального инфинитива личной формой делает фразу грамматически цельной и сохраняет два параллельных оборота с «чтобы».
  terminology: Ключевые этические термины «самообладание» и «мужество» удачны и не требуют замены. «Удовольствия», «желания» и «всякое страдание» сохраняют широкий объём греческих слов, не навязывая более узкого толкования.
  issues:
  - severity: medium
    issue: Непоследовательная грамматическая форма во втором целевом обороте
    rationale: 'В конструкции «чтобы мы ... упражнялись в мужестве, чтобы добровольно переносить» последний инфинитив не согласован с уже выраженным подлежащим. Греческий второй оборот ὥστε ... ὑπομένειν следует естественно передать личной формой: «чтобы мы добровольно переносили».'
  - severity: low
    issue: «Властвовали над» звучит менее естественно в русском этическом регистре
    rationale: «Господствовали над» лучше сочетается с обозначениями страстей, удовольствий и желаний, сохраняя значение κρατεῖν — быть сильнее, иметь власть над.
  revised_text: Ведь он учит нас самообладанию, чтобы мы господствовали над всеми удовольствиями и желаниями, а также упражнялись в мужестве, чтобы добровольно переносили всякое страдание.
