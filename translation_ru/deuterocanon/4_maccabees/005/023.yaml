  text: For it teaches us self-control, so that we may master all pleasures and desires, and to practice courage, so that we may willingly endure every pain;
translation:
  language: ru
  text: Ведь он учит нас самообладанию, чтобы мы господствовали над всеми удовольствиями и желаниями, а также упражнялись в мужестве, чтобы добровольно переносили всякое страдание.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνην
  choice: самообладанию
  rationale: В данном этическом контексте слово обозначает дисциплинированную власть над собой; последующая фраза о господстве над удовольствиями и желаниями раскрывает именно этот смысл.
- source_word: ἐκδιδάσκει
  choice: учит
  rationale: Глагол может подразумевать основательное наставление, однако нейтральное «учит» точно и естественно передаёт его здесь.
- source_word: κρατεῖν
  choice: властвовали над
  rationale: Глагол выражает превосходство и власть над чем-либо; этот вариант сохраняет более сильный смысл, чем простое «контролировали».
- source_word: ἡδονῶν
  choice: удовольствиями
  rationale: Передан общий смысл слова без неоправданного сужения до чувственных или телесных удовольствий.
- source_word: ἐπιθυμιῶν
  choice: желаниями
  rationale: Нейтральное широкое обозначение желаний сохраняет объём греческого слова и не сужает его до похоти.
- source_word: ἀνδρείαν
  choice: мужестве
  rationale: В эллинистической этической лексике это название добродетели мужества и стойкости, а не указание на мужской пол.
- source_word: ἐξασκεῖν
  choice: упражнялись
  rationale: Глагол обозначает деятельное упражнение и развитие добродетели; «упражнялись» сохраняет этот процессуальный оттенок.
- source_word: πόνον
  choice: страдание
  rationale: В контексте мученичества слово охватывает переносимую боль и тяготу; «страдание» естественно передаёт этот широкий смысл.
- source_word: ἑκουσίως
  choice: добровольно
  rationale: Наречие подчёркивает сознательное и свободное принятие страдания.
- source_word: ὑπομένειν
  choice: переносить
  rationale: Глагол означает стойко оставаться под бременем испытания и выдерживать его; по-русски сочетание «переносить страдание» звучит естественно.
theological_decisions:
- issue: Передача греческих названий этических добродетелей в философско-мученическом контексте
  choice: «самообладание» и «мужество»
  alternative: «благоразумие/умеренность» и «доблесть/стойкость»
  rationale: Выбранные общеупотребительные названия добродетелей понятны современному читателю, соответствуют поясняющим оборотам самого стиха и не вносят гендерного или конфессионального оттенка.
- issue: Синтаксическая связь καὶ ἀνδρείαν ἐξασκεῖν с ἐκδιδάσκει
  choice: 'Передать как второй предмет наставления: «а также [учит, чтобы мы] упражнялись в мужестве»'
  alternative: 'Формально воспроизвести разнородную конструкцию: «и упражнять мужество»'
  rationale: Греческая конструкция с инфинитивом допускает смысл продолжения того, чему учит подразумеваемый субъект. Русская формулировка делает эту связь понятной, не добавляя нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык; возвышенный, но доступный этический регистр. Параллелизм двух конструкций с «чтобы» сохранён, при этом синтаксис сделан естественным для русского текста.
