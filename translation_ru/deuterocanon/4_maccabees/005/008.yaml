  yaml_path: translation/deuterocanon/4_maccabees/005/008.yaml
  text: For it is foolish not to enjoy the pleasant things that are without reproach[a], and unjust to turn away from the gifts of nature.
translation:
  language: ru
  text: Ведь неразумно не наслаждаться приятными вещами, не заслуживающими упрёка[a], и несправедливо отворачиваться от даров природы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безупречными удовольствиями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόητον
  choice: неразумно
  rationale: Передаёт отсутствие здравого смысла или рассудительности; в данном рассуждении звучит естественнее, чем более резкое «глупо».
- source_word: ἀπολαύειν
  choice: наслаждаться
  rationale: В контексте обозначает получение удовольствия от приятного; это прямой и естественный русский эквивалент.
- source_word: τῶν χωρὶς ὀνείδους ἡδέων
  choice: тем, что приятно и не вызывает нареканий
  rationale: Сохраняет субстантивированное значение ἡδέων и явно передаёт нравственное ограничение χωρὶς ὀνείδους, не превращая фразу в безусловное одобрение удовольствий.
- source_word: ἄδικον
  choice: несправедливо
  rationale: Сохраняет этическую силу слова и параллель с «неразумно».
- source_word: ἀποστρέφεσθαι
  choice: отворачиваться от
  rationale: 'Передаёт образ возвратной формы: человек сам обращается прочь, а не просто отвергает нечто.'
- source_word: τὰς τῆς φύσεως χάριτας
  choice: дары природы
  rationale: Естественно передаёт χάριτας как блага или дары, происходящие от природы, без внесения позднейших богословских оттенков слова «благодать».
theological_decisions:
- issue: Нравственная оценка естественных удовольствий
  choice: Стих утверждает допустимость приятного, не вызывающего нареканий, сохраняя явное нравственное ограничение.
  alternative: «безупречными удовольствиями»
  rationale: Греческое χωρὶς ὀνείδους прямо ограничивает область приятного; развёрнутая формулировка сохраняет и удовольствие, и критерий отсутствия укоризны, не снимая напряжения между природным влечением и нравственной оценкой.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет риторическую параллель «неразумно… и несправедливо…» и достойный нравственно-философский регистр оригинала.
