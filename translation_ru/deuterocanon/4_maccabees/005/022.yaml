  terminology: '«Философия» правильно сохраняет самоназвание автора и не подменяет его конфессионально окрашенным толкованием. Сноска уместно фиксирует вариант «не благоразумно» и редкость εὐλογιστία. Английская аудиторская трактовка слова как «blessedness» не должна определять русский перевод: она хуже согласуется с образованием слова и данным синтаксическим употреблением.'
