  text: But you mock our philosophy[a], as though we did not live in it with blessedness.
translation:
  language: ru
  text: Но ты высмеиваешь нашу философию, словно мы живём по ней без здравого рассуждения[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не благоразумно». Редкое греческое слово означает здравое, разумное рассуждение; всё выражение буквально: «не с разумностью живём в ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χλευάζεις
  choice: высмеиваешь
  rationale: Глагол обозначает насмешку и презрительное осмеяние; «высмеиваешь» естественно передаёт прямой упрёк.
- source_word: φιλοσοφίαν
  choice: философию
  rationale: Сохранено авторское обозначение иудейского разумно-нравственного образа жизни; замена на «учение» или «образ жизни» сузила бы риторический смысл.
- source_word: ὥσπερ
  choice: словно
  rationale: Вводит приписываемое оппоненту, но отвергаемое говорящим предположение.
- source_word: εὐλογιστίας
  choice: здравого рассуждения
  rationale: Редкое существительное связано с разумным, верным расчётом или рассуждением. В сочетании οὐ μετὰ εὐλογιστίας оно естественно передаётся как «без здравого рассуждения», а не как «без блаженства».
- source_word: ἐν αὐτῇ βιούντων
  choice: живём по ней
  rationale: Буквально — «живущих в ней»; по-русски «жить по ней» ясно выражает устроение жизни согласно этой философии.
theological_decisions:
- issue: Смысл φιλοσοφία в 4 Маккавейской
  choice: Сохранить «философию»
  alternative: «образ жизни» или «учение»
  rationale: Автор сознательно представляет иудейское благочестие и разумно устроенную жизнь как философию; нейтральное сохранение термина не навязывает конфессионального толкования.
- issue: Смысл εὐλογιστίας
  choice: «здравого рассуждения»
  alternative: «благоразумия»; по иной этимологической интерпретации — «благополучия/блаженства»
  rationale: Непосредственное образование и синтаксис указывают на разумность или здравое рассуждение. Такой перевод сохраняет спор о рациональности исповедуемого образа жизни и не вносит отсутствующую в контексте идею субъективного счастья.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. «Философия» сохранена как значимый авторский термин, а буквальное «живём в ней» передано естественным русским «живём по ней».
