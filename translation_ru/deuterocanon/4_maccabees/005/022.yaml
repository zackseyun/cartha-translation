  source_fidelity: 'Перевод верно передаёт χλευάζεις («высмеиваешь»), φιλοσοφίαν («философию») и полемическое ὥσπερ («словно»). εὐλογιστίας здесь естественно и лексически обоснованно понимается как «здравое рассуждение/благоразумие», а не как «блаженство»: отрицательное μετὰ εὐλογιστίας характеризует разумность образа жизни. «Живём по ней» является удачной русской идиоматической передачей ἐν αὐτῇ βιούντων, буквально «живя в ней».'
