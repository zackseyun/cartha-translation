lexical_decisions:
- source_word: γέρων
  choice: стар
  rationale: Передаёт преклонный возраст и естественно сочетается в русском с конструкцией «не настолько… чтобы».
- source_word: ἀνδρῶδης
  choice: мужественен
  rationale: Сохраняет выраженную в греческом тексте мужскую и риторическую окраску; здесь речь о зрелой мужской твёрдости, а не просто о возрасте.
- source_word: εὐσέβειαν
  choice: благочестие
  rationale: Обозначает почтительную преданность Богу и верность Его установлениям; это естественный и содержательно ёмкий русский эквивалент.
- source_word: νεάζειν
  choice: оставался юным
  rationale: Сохраняет метафорический контраст со старостью; «оставался» уместно передаёт продолжающуюся молодость разума, не превращая образ в утверждение об омоложении.
- source_word: λογισμόν
  choice: разум
  rationale: Передаёт центральное для 4 Маккавейской книги понятие рассудочной способности, управляющей страстями.
- source_word: ὥστε μοι ... μὴ νεάζειν τὸν λογισμόν
  choice: чтобы ... мой разум не оставался юным
  rationale: Сохраняет отрицание и результативную конструкцию ὥστε с инфинитивом, не устраняя намеренно парадоксальную риторику высказывания.
theological_decisions:
- issue: Передача εὐσέβεια в контексте иудейского мученичества
  choice: благочестие
  alternative: почитание Бога; набожность
  rationale: «Благочестие» сохраняет направленность преданности к Богу и религиозно-нравственный смысл слова, не сужая его до внешней обрядности.
- issue: Гендерная окраска ἀνδρῶδης
  choice: мужественен
  alternative: зрел; крепок
  rationale: Греческое слово имеет явную мужскую окраску; перевод сохраняет её и одновременно выражает стойкость взрослого мужчины.
translation_notes:
  register: Современный литературный русский язык с достоинством и с сохранением философской терминологии книги. Парадоксальное сопоставление старости, мужской зрелости и юности разума сохранено; синтаксис слегка упорядочен для естественного русского звучания.
