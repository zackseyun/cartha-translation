  source_fidelity: 'Греческая конструкция οὐχ οὕτως ... ὥστε ... μὴ νεάζειν сохранена как намеренно парадоксальное отрицательное следствие: возраст и мужская зрелость не таковы, чтобы разум вследствие благочестия не молодел. В черновике «оставался юным» вносит значение сохранения уже имеющейся юности, которого νεάζειν прямо не выражает; глагол естественнее передать как «молодеть». Διὰ τὴν εὐσέβειαν имеет причинный оттенок («благодаря/вследствие благочестия»), а не преимущественно целевой «ради».'
