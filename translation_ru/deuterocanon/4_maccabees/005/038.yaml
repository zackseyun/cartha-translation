  yaml_path: translation/deuterocanon/4_maccabees/005/038.yaml
  text: For you may indeed tyrannize over the ungodly[a], but over my reasonings concerning godliness you will rule neither by words nor by deeds.
translation:
  language: ru
  text: Ибо над нечестивыми ты, конечно, можешь тиранствовать, но над моими рассуждениями[a] о благочестии не сможешь господствовать ни словами, ни делами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над моими разумными суждениями о благочестии». Греческое λογισμός — ключевое понятие 4 Маккавейской книги, обозначающее разумное нравственное рассуждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσεβῶν
  choice: над нечестивыми
  rationale: Родительный множественного числа при τυραννήσεις обозначает тех, над кем осуществляется тираническая власть; «нечестивые» сохраняет религиозно-нравственный контраст с εὐσέβεια.
- source_word: τυραννήσεις
  choice: ты можешь тиранствовать
  rationale: Глагол означает именно деспотическое господство, а не нейтральное правление. Модальная передача в сочетании с «ведь» и последующим «но» естественно выражает уступительное противопоставление μὲν…δέ.
- source_word: τῶν δὲ ἐμῶν ... λογισμῶν
  choice: над моими рассуждениями
  rationale: λογισμός — ключевое для 4 Маккавейской понятие разумного нравственного обдумывания; «рассуждения» сохраняет его интеллектуальный характер и множественное число.
- source_word: περὶ τῆς εὐσεβείας
  choice: о благочестии
  rationale: «Благочестие» естественно обозначает преданность Богу и верность Его закону и сохраняет контраст с «нечестивыми».
- source_word: δεσπόσεις
  choice: ты не будешь властен
  rationale: Передаёт невозможность стать господином над внутренними убеждениями говорящего и естественно сочетается с инструментальными оборотами «словами» и «делами».
- source_word: οὔτε λόγοις ... οὔτε δι᾽ ἔργων
  choice: ни словами, ни делами
  rationale: Сохраняет симметричное отрицание и намеренно не уточняет, означают ли слова доводы либо угрозы, а дела — поступки либо насилие.
theological_decisions:
- issue: Передача противопоставления ἀσεβῶν и εὐσεβείας
  choice: нечестивыми / благочестии
  alternative: безбожными / почитании Бога; нечестивыми / набожности
  rationale: Выбранная пара ясно и традиционно для литературного русского языка передаёт религиозно-нравственный контраст, не сужая εὐσέβεια до одного чувства или обряда.
- issue: Смысл λογισμῶν в контексте богопочитания
  choice: рассуждениями о благочестии
  alternative: разумными суждениями о благочестии; убеждениями в благочестии
  rationale: Сохранён интеллектуальный мотив книги — разумное нравственное обдумывание, — но не добавлено отсутствующее в греческом тексте прилагательное «разумные» и не сведено значение к уже сложившимся убеждениям.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи мученика. «Тиранствовать» сохраняет сильную окраску греческого глагола; параллелизм «ни словами, ни делами» воспроизводит риторический строй оригинала. Маркер сноски поставлен после смысловой группы, к которой относится лексическая альтернатива.
