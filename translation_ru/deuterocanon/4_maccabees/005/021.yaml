translation:
  language: ru
  text: Ведь через каждого из двоих Закон с равной гордостью заявляет о себе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διʼ ἑκατέρου
  choice: через каждого из них
  rationale: ἑκάτερος обозначает каждого из двух упомянутых ранее лиц или предметов. Русское «через каждого из них» ясно сохраняет распределительное значение и отсылку именно к двум.
- source_word: γὰρ
  choice: ведь
  rationale: γάρ вводит обоснование предшествующей мысли; «ведь» естественно передаёт эту пояснительную связь в современном русском языке.
- source_word: ὡς ὁμοίως
  choice: одинаково
  rationale: Сочетание выражает равенство или сходство применительно к обоим; наречие «одинаково» передаёт его кратко и естественно.
- source_word: ὁ νόμος
  choice: Закон
  rationale: В контексте имеется в виду иудейский Закон, Тора; написание с прописной буквы помогает обозначить этот конкретный референт.
- source_word: ὑπερηφανεῖται
  choice: являет своё величие
  rationale: Средняя форма глагола может выражать гордость, превознесение или величавость. «Являет своё величие» сохраняет олицетворение Закона, но избегает неестественного по-русски представления, будто Закон испытывает личное самодовольство.
theological_decisions:
- issue: Олицетворение Закона
  choice: Сохранить олицетворение в выражении «Закон… являет своё величие».
  alternative: «через обоих Закон одинаково прославляется» или «Закон одинаково гордится каждым из них»
  rationale: Греческий текст грамматически представляет Закон действующим субъектом. Выбранная формулировка сохраняет эту риторику, не превращая её ни в пассивное утверждение о почитании Закона, ни в психологически чрезмерное «гордится».
translation_notes:
  register: Краткая, литературная и понятная формулировка. «Закон» дан с прописной буквы как обозначение Торы. Синтаксис сохраняет пояснительную функцию γάρ и уравнивает двух ранее названных участников, не уточняя их вопреки отсутствию непосредственного контекста в предоставленном стихе.
