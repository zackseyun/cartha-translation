  source_fidelity: 'В черновике верно переданы вопросительная форма, связующая частица γάρ («же»), сильное отвращение βδελύττεις и конкретная отсылка к мясу данного животного. Однако «природа благосклонно даровала его как превосходнейшее» не отражает синтаксической связи: καλλίστην характеризует σαρκοφαγίαν, то есть употребление в пищу мяса, а не животное; местоимение «его» делает русский текст семантически неясным.'
