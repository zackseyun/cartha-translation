  yaml_path: translation/deuterocanon/4_maccabees/005/007.yaml
  text: For why do you loathe the eating of the flesh of this animal[a], though nature has graciously made it most excellent?
translation:
  language: ru
  text: Почему же ты гнушаешься употреблением в пищу мяса этого животного[a], хотя природа благосклонно сделала такое употребление пищи превосходнейшим?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «мясоедение этого животного».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί γὰρ
  choice: Почему же
  rationale: «Почему» передаёт прямой вопрос, а частица «же» сохраняет аргументативно-связующую силу γάρ без неестественного русского «ибо почему».
- source_word: τῆς φύσεως
  choice: природа
  rationale: Сохраняет олицетворённую «природу» как источник дара или благоприятного устроения.
- source_word: κεχαρισμένης
  choice: благосклонно даровала
  rationale: Перфектное причастие χαρίζομαι выражает благосклонное дарование с сохраняющимся результатом; сочетание передаёт этот оттенок, не вводя специально богословского значения «благодати».
- source_word: καλλίστην
  choice: как превосходнейшее
  rationale: Превосходная степень καλός здесь обозначает наивысшее качество или привлекательность; возвышенная форма соответствует риторике речи.
- source_word: τὴν τοῦδε τοῦ ζῴου σαρκοφαγίαν
  choice: употребления в пищу мяса этого животного
  rationale: Передаёт существительное σαρκοφαγία как акт употребления плоти в пищу и ясно связывает мясо с указанным животным.
- source_word: βδελύττεις
  choice: гнушаешься
  rationale: Глагол обозначает сильное отвращение; «гнушаться» естественно сочетается с родительным падежом и сохраняет возвышенный тон.
