lexical_decisions:
- source_word: σὺ δέ
  choice: Но ты
  rationale: δέ здесь выражает противопоставление или переход; «Но ты» естественно передаёт противительный оттенок и сохраняет явное обращение.
- source_word: μοι
  choice: как мне кажется
  rationale: Дательный при δοκεῖς обозначает личную оценку говорящего; эта формулировка ясно и естественно передаёт его точку зрения.
- source_word: ἀνοητότερον
  choice: ещё неразумнее
  rationale: Сравнительная форма указывает на действие, в котором ещё меньше здравого смысла; «неразумнее» звучит достойно и не имеет излишне резкой окраски слова «глупее».
- source_word: ποιήσειν
  choice: поступишь
  rationale: Будущий инфинитив сохраняет отнесённость действия к будущему; в данном оценочном контексте «поступишь» естественнее буквального «сделаешь».
- source_word: δοκεῖς
  choice: как мне кажется
  rationale: В конструкции с инфинитивом глагол означает «кажешься», а не «думаешь»; русская вводная конструкция естественно передаёт это значение.
