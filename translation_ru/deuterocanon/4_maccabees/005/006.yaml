  yaml_path: translation/deuterocanon/4_maccabees/005/006.yaml
  text: Before I begin the tortures against you[a], old man, I would advise you of this, so that by tasting the pork you might save yourself. For I respect your age and your gray hair, though after having had it for so long a time[b], you do not seem to me to philosophize by practicing the religion of the Jews.
translation:
  language: ru
  text: '«Прежде чем начать пытать тебя, старик, я хотел бы дать тебе такой совет: отведай свинины, чтобы сохранить себе жизнь.[a] Я ведь уважаю твой возраст и седину; хотя ты уже столько времени седой, ты, на мой взгляд, не философствуешь, придерживаясь иудейской религии.[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отведай свиного мяса, чтобы спасти свою жизнь». Речь идёт о спасении от пыток и смерти.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не философствуешь». Это выражение сохраняет характерный для книги язык философии и разума; по смыслу возможно: «не поступаешь как философ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν ἄρξασθαι τῶν κατὰ σοῦ βασάνων
  choice: Прежде чем начать пытать тебя
  rationale: В контексте βάσανοι обозначает предстоящие пытки, а κατὰ σοῦ — их направленность против собеседника. Глагольная русская конструкция естественнее буквального «приступить к пыткам против тебя» и сохраняет первое лицо.
- source_word: ὦ πρεσβῦτα
  choice: старик
  rationale: Обращение указывает на преклонный возраст, а не на должность старейшины; прямое «старик» передаёт несколько покровительственный тон говорящего.
- source_word: συμβουλεύσαιμʼ ἂν σοι ταῦτα
  choice: я хотел бы дать тебе вот какой совет
  rationale: Оптатив с ἄν выражает смягчённое, внешне учтивое предложение; эта форма по-русски естественно передаётся через «хотел бы».
- source_word: ὅπως ἀπογευσάμενος τῶν ὑείων σώζοιο
  choice: отведай свинины, чтобы сохранить себе жизнь
  rationale: ὑεῖα означает свиное мясо, а σώζοιο в данном контексте — избежать пыток и смерти, то есть сохранить физическую жизнь, без богословского оттенка спасения.
- source_word: αἰδοῦμαι γάρ σου τὴν ἡλικίαν καὶ τὴν πολιάν
  choice: Я ведь уважаю твой возраст и твои седины
  rationale: αἰδέομαι здесь выражает почтение к преклонному возрасту; πολιὰ естественно передаётся традиционным русским образом «седины».
- source_word: ἣν μετὰ τοσοῦτον ἔχων χρόνον
  choice: хотя ты носишь их уже столько лет
  rationale: Относительное местоимение относится прежде всего к седине. В русском множественное «седины» требует «их»; «столько лет» передаёт временное значение χρόνον.
- source_word: οὔ μοι δοκεῖς φιλοσοφεῖν
  choice: ты, как мне кажется, не философствуешь
  rationale: Сохранён явный корень «философ-», важный для сквозной темы разума и философии в 4 Маккавейской; перевод не сводит выражение просто к «поступаешь неразумно».
- source_word: τῇ Ἰουδαίων χρωμένῃ θρησκείᾳ
  choice: придерживаясь иудейской религии
  rationale: По контексту оборот связывает отрицательную оценку философствования с исповеданием или соблюдением иудейской религии. Формулировка сохраняет заявленное говорящим противопоставление, не принимая его оценку за голос автора.
theological_decisions:
- issue: Значение σώζοιο
  choice: сохранить себе жизнь
  alternative: спастись
  rationale: Царь предлагает избежать непосредственно предстоящих пыток и смерти. Контекст требует физического сохранения жизни, а не утверждения о духовном спасении.
- issue: Передача φιλοσοφεῖν
  choice: не философствуешь
  alternative: не поступаешь как философ / не проявляешь мудрости
  rationale: Прямое философское словоупотребление является тематически значимым для книги. Его следует сохранить, несмотря на некоторую непривычность фразы по-русски.
- issue: Связь иудейской религии с философией в реплике
  choice: не философствуешь, придерживаясь иудейской религии
  alternative: не являешься философом, поскольку исповедуешь иудейскую религию
  rationale: Греческая конструкция допускает смысловую связь между оценкой «не философствуешь» и религиозной практикой, но не требует превращать её в явно причинное «поскольку». Перевод сохраняет напряжение без усиления логической связи.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Реплика звучит внешне учтиво, но сохраняет угрозу и покровительственное обращение. Ключевая философская лексика оставлена заметной; конфессиональные толкования не добавлены.
