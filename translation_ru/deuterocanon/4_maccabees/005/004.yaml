    issue: «Ему стали раскрывать рот»
    rationale: Греческое выражение ἠνῴχετο τὸ στόμιον αὐτοῦ — идиоматическое начало речи. Пассивная форма не требует вводить внешнего деятеля и физическое принуждение; такая интерпретация изменяет смысл.
  - severity: medium
    issue: «первым из стада оказался один еврей»
    rationale: Сочетание с «оказался один» неудачно передаёт выделение Елеазара как первого из группы и звучит громоздко. Перестановка позволяет сохранить метафору без добавления действий, отсутствующих в источнике.
