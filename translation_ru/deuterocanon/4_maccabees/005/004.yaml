  text: But when many had been seized, one man, first from the flock, a Hebrew named Eleazar, a priest by birth, trained in the law in knowledge, advanced in age, and known to many around the tyrant because of his age, opened his mouth.
translation:
  language: ru
  text: Когда многих схватили, первым из стада[a] был еврей по имени Елеазар — священник по происхождению, знаток Закона[b], человек преклонного возраста, известный многим из окружения тирана благодаря своим годам. Он открыл уста.
