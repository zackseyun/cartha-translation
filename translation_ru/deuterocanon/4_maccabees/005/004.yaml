    reason: lexical_alternative
  - marker: b
    text: 'Или: «сведущий в Законе». Речь идёт о глубоком знании Закона, а не о профессии юриста в современном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συναρπασθέντων
  choice: схватили
  rationale: Причастие передаёт насильственное задержание; «схватили» естественно и сохраняет оттенок принуждения, не уточняя способ.
- source_word: ἐκ τῆς ἀγέλης
  choice: из стада
  rationale: Сохранена буквальная метафора греческого текста, обозначающая собранную группу евреев; возможное неметафорическое понимание вынесено в примечание.
- source_word: Ἑβραῖος
  choice: еврей
  rationale: Прямое соответствие греческому Ἑβραῖος в современном русском языке.
- source_word: τὸ γένος ἱερεύς
  choice: священник по происхождению
  rationale: Оборот характеризует происхождение Елеазара и его принадлежность к священническому роду, не сводя смысл лишь к исполняемой должности.
- source_word: τὴν ἐπιστήμην νομικός
  choice: знаток Закона
  rationale: Передаёт учёность и компетентность в Законе без современного профессионального значения слова «юрист».
- source_word: τὴν ἡλικίαν προήκων
  choice: человек преклонного возраста
  rationale: Естественное и уважительное русское выражение для человека, далеко продвинувшегося в годах.
- source_word: πολλοῖς τῶν περὶ τὸν τύραννον
  choice: многие из окружения тирана
  rationale: Оборот обозначает людей, находившихся при тиране, то есть его окружение.
- source_word: ἠνῴχετο τὸ στόμιον αὐτοῦ
  choice: Ему стали раскрывать рот
  rationale: Греческая пассивная конструкция буквально сообщает, что рот Елеазара раскрывали; перевод сохраняет внешнее принуждение и не превращает действие в добровольное начало речи.
