revisions:
- from: Когда же многих схватили, первым из стада[a] оказался один еврей по имени Елеазар — священник по происхождению, знаток Закона[b], человек преклонного возраста, которого из-за его лет знали многие из окружения тирана. Ему стали раскрывать рот.
  to: Когда многих схватили, первым из стада[a] был еврей по имени Елеазар — священник по происхождению, знаток Закона[b], человек преклонного возраста, известный многим из окружения тирана благодаря своим годам. Он открыл уста.
  rationale: Исправлено заключительное предложение, чтобы не приписывать тексту принудительное раскрывание рта и передать обычный смысл формулы о начале речи. Начало перестроено для естественного русского синтаксиса при сохранении образа «стадо», порядка характеристик и всех смысловых элементов оригинала. Примечания сохранены и их якоря остаются при соответствующих словах.
