base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/016.yaml
  text: But we[a], Antiochus, being persuaded by a divine law, order our lives by it, and we consider no compulsion to be stronger than obedience to our law.
translation:
  language: ru
  text: Мы же, Антиох, убеждённые божественным законом, живём по нему и считаем, что нет принуждения сильнее, чем послушание нашему закону.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убеждённые божественным законом, мы сообразуем с ним свою жизнь».'
    reason: Лексическая альтернатива для πεπεισμένοι и πολιτευόμεθα, сохраняющая возможный оттенок воздействия закона и сознательно устроенного образа жизни.
lexical_decisions:
- source_word: θείῳ νόμῳ
  choice: божественным законом
  rationale: Передаёт качественную характеристику или божественное происхождение закона, не уточняя сверх греческого текста; отсутствие артикля в русском не требует неопределённой конструкции.
- source_word: πεπεισμένοι
  choice: убеждённые
  rationale: Перфектное страдательное причастие обозначает достигнутое и сохраняющееся состояние убеждённости; русская краткая по смыслу форма естественна и не сводит выражение к субъективному мнению.
- source_word: πολιτευόμεθα
  choice: живём по нему
  rationale: В данном контексте глагол означает вести или устраивать жизнь в соответствии с законом; перевод естественно выражает и образ жизни, и его норму.
- source_word: οὐδεμίαν ἀνάγκην
  choice: нет принуждения
  rationale: Здесь ἀνάγκη означает внешнее давление и насилие со стороны правителя, а не отвлечённую необходимость.
- source_word: βιαιοτέραν
  choice: сильнее
  rationale: Сравнительная форма указывает на превосходящую принудительную силу; «сильнее» естественно сочетается с «принуждением», не устраняя заложенной в βίαιος идеи насилия.
- source_word: τῆς πρὸς τὸν νόμον ἡμῶν εὐπειθείας
  choice: чем послушание нашему закону
  rationale: εὐπείθεια обозначает готовность повиноваться; «послушание» ясно и достойно передаёт верность общинному закону.
theological_decisions:
- issue: Характеристика Моисеева закона
  choice: божественным законом
  alternative: законом, данным Богом
  rationale: Прилагательное θείῳ допускает оттенок божественного качества или происхождения. Выбранная формулировка сохраняет эту смысловую широту и не делает происхождение единственным явно выраженным значением.
translation_notes:
  register: Современный литературный русский язык с достойным, прямым тоном речи перед царём. Обращение «Антиох» дано в нормативном русском звательном употреблении; конструкция сохраняет парадоксальное сопоставление внешнего принуждения и внутренне обязательного послушания закону.
