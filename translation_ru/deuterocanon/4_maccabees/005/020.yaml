  text: Ведь нарушать закон в малом и в великом — равнозначно[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преступать закон в малом и в великом — одно и то же».'
    reason: Лексическая альтернатива для παρανομεῖν и ἰσοδύναμον.
lexical_decisions:
- source_word: παρανομεῖν
  choice: нарушить закон
  rationale: Глагол означает поступать вопреки закону. Выражение «нарушить закон» ясно передаёт правовой смысл и естественно звучит по-русски.
- source_word: ἐν μικροῖς καὶ ἐν μεγάλοις
  choice: в малом или в великом
  rationale: Субстантивированные формы среднего рода противопоставляют малые и великие предметы или случаи. Русская парная формула сохраняет краткость и обобщённость греческого выражения; «или» естественно обозначает оба сопоставляемых случая, не меняя смысла.
- source_word: ἰσοδύναμόν
  choice: равнозначно
  rationale: Прилагательное указывает на равную силу или значимость. «Равнозначно» сохраняет сильное утверждение текста, не уточняя сверх сказанного равенство наказания или всех последствий.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит обоснование предыдущей мысли; «ведь» естественно передаёт эту пояснительную связь в современном русском языке.
theological_decisions:
- issue: Нравственная равнозначность меньших и больших нарушений
  choice: Нарушение закона в малом и в великом названо равнозначным.
  alternative: Любое нарушение считается нарушением закона, но это не обязательно означает одинаковую тяжесть во всех отношениях.
  rationale: Греческое ἰσοδύναμόν ἐστιν выражает сильное равенство, однако перевод не должен самовольно распространять его на меру наказания или на все последствия. «Равнозначно» сохраняет напряжение и точный объём утверждения.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и достойная формулировка. Сохранена пояснительная связь с контекстом и не устранена неоднозначность относительно точного объёма равнозначности.
