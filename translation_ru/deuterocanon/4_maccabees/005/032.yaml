  footnotes:
  - marker: a
    text: 'Или: «раздуй огонь ещё жарче». Греческий глагол передаёт образ дуновения на огонь, чтобы он разгорелся сильнее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: В ответ на это
  rationale: Естественно передаёт переход к приказу как реакцию на только что сказанное, не воспроизводя буквально греческое множественное число среднего рода.
- source_word: τροχοὺς
  choice: колёса
  rationale: Сохраняет конкретное название орудий в греческом тексте; перевод «пыточные колёса» был бы допустимым пояснением контекста, но добавлял бы отсутствующее определение.
- source_word: εὐτρέπιζε
  choice: приготовь
  rationale: Точно и естественно передаёт повеление привести орудия в готовность.
- source_word: τὸ πῦρ
  choice: огонь
  rationale: Прямое соответствие существительному πῦρ; определённость в русском языке ясно следует из контекста.
- source_word: ἔκφυσα
  choice: раздуй
  rationale: Русский глагол естественно передаёт образ дутья на огонь с целью усилить горение.
- source_word: σφοδρότερον
  choice: ещё сильнее
  rationale: Передаёт сравнительную степень и нарастание интенсивности без неестественного для русского сочетания «свирепее раздуй».
