lexical_decisions:
- source_word: οὔτε ... οὐ
  choice: и не
  rationale: В контексте продолжается ряд отрицаний. Русское «и не» естественно передаёт присоединительное отрицание, не воспроизводя буквально избыточное для современного русского сочетание двух отрицательных частиц.
- source_word: ἱερούς
  choice: священными
  rationale: Определение относится к клятвам и подчёркивает их религиозную значимость и нерушимость.
- source_word: τῶν προγόνων
  choice: предков
  rationale: Родительный падеж обозначает предшествующие поколения, которым принадлежат эти клятвы. «Предков» точно и естественно по-русски, тогда как «отцов» могло бы быть ошибочно понято как указание лишь на непосредственных родителей.
- source_word: περὶ τοῦ φυλάξαι τὸν νόμον
  choice: соблюдать закон
  rationale: Оборот с субстантивированным инфинитивом выражает содержание клятв. «Соблюдать» передаёт φυλάσσω в контексте верности предписаниям закона лучше, чем буквальное «хранить».
- source_word: ὅρκους
  choice: клятвами
  rationale: ὅρκος означает торжественную клятву, а не более общее обещание или обет.
- source_word: παρήσω
  choice: пренебрегу
  rationale: Будущая форма παρίημι здесь означает оставить без внимания, не исполнить или отвергнуть обязательную силу клятв. «Пренебрегу» естественно сочетается с «клятвами» и не усиливает смысл до полного отступничества.
theological_decisions:
- issue: Кому принадлежат клятвы в выражении τῶν προγόνων
  choice: клятвами предков
  alternative: клятвами праотцов; заветами предков
  rationale: Греческий текст говорит именно о предках, но не добавляет местоимения «наших». «Предков» сохраняет родовую и традиционную связь, не внося отсутствующего в оригинале уточнения; «заветы» было бы менее точно, поскольку ὅρκους означает клятвы.
- issue: Значение τὸν νόμον
  choice: закон
  alternative: Закон; отеческий закон
  rationale: В данном иудейском контексте подразумевается Закон, то есть Тора, однако греческая форма сама по себе не обозначает прописную букву и не содержит определения «отеческий». Основной текст оставляет исходную краткость, а референт поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным звучанием. Начальное «и» и заключительная запятая сохранены, поскольку стих продолжает синтаксический ряд соседнего контекста. Формулировка избегает архаичного «хранить закон», предпочитая обычное для религиозно-правового контекста «соблюдать закон».
