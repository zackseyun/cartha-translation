  yaml_path: translation/deuterocanon/4_maccabees/005/001.yaml
  text: So then[a], when the tyrant Antiochus had taken his seat with his council on a certain high place, and their fully armed troops were standing around on every side,
translation:
  language: ru
  text: Итак, тиран Антиох занял место вместе с членами своего совета на некотором возвышении[a], а их войска в полном вооружении стояли вокруг со всех сторон,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на каком-то высоком месте». Греческое выражение означает возвышенное место, не обязательно культовую высоту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προκαθίσας
  choice: занял место
  rationale: Причастие изображает Антиоха сидящим на отведённом ему месте власти перед последующим действием. «Занял место» естественно передаёт сцену, не усиливая значение до формального председательствования.
- source_word: γέ τοι
  choice: итак
  rationale: Сочетание частиц служит эмфатическим переходом к новой сцене; «итак» передаёт дискурсивную функцию без добавления предметного смысла.
- source_word: μετὰ τῶν συνέδρων
  choice: вместе с членами своего совета
  rationale: Существительное обозначает лиц, заседавших с Антиохом в совете. Такой перевод ясен современному читателю и сохраняет официальный характер окружения.
- source_word: ὁ τύραννος
  choice: тиран
  rationale: Греческий текст даёт отрицательно окрашенную характеристику Антиоха; нейтральное «правитель» ослабило бы авторскую оценку.
- source_word: ἐπὶ τινος ὑψηλοῦ τόπου
  choice: на некотором возвышении
  rationale: Фраза указывает на неопределённое возвышенное место. «Возвышение» естественно по-русски и не вызывает ненужной ассоциации с культовым «высоким местом».
- source_word: τῶν στρατευμάτων αὐτῶν
  choice: их войска
  rationale: Форма множественного числа обозначает воинские подразделения или силы; «войска» сохраняет коллективный смысл и местоименную отсылку оригинала.
- source_word: παρεστηκότων
  choice: стояли
  rationale: Причастие рисует войска стоящими рядом и в готовности; буквальный зрительный образ уместен в этой сцене.
- source_word: κυκλόθεν
  choice: вокруг со всех сторон
  rationale: Передаёт подчёркнутое греческим наречием полное окружение.
- source_word: εὐόπλων
  choice: в полном вооружении
  rationale: Выражение ясно передаёт, что войска были полностью и надлежащим образом вооружены, сохраняя угрожающую атмосферу сцены.
theological_decisions:
- issue: Авторская оценка Антиоха в слове τύραννος
  choice: Сохранить в основном тексте отрицательно окрашенное слово «тиран»
  alternative: правитель; царь
  rationale: Источник употребляет оценочное, а не нейтральное обозначение. Его сохранение не привносит внешнего толкования, а передаёт риторику автора.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Синтаксис сохраняет незавершённость греческого стиха и конечную запятую, поскольку предложение продолжается в следующем стихе. Маркер примечания поставлен непосредственно при выражении, к которому относится.
