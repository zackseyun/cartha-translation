  yaml_path: translation/deuterocanon/4_maccabees/005/013.yaml
  text: 'For consider this also: even if there is some overseeing power of this religion[b][a], it would pardon you for the lawlessness done under compulsion in all these things.'
translation:
  language: ru
  text: 'И подумай также: даже если существует некая надзирающая сила этой религии[a], она простила бы тебе любое нарушение закона, совершённое по принуждению[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «некая наблюдающая (или надзирающая) сила, связанная с этой религией». Греческий текст не уточняет, кого или что означает эта сила.'
    reason: lexical_alternative
  - marker: b
    text: 'Более буквально: «простила бы тебе во всём за нарушение закона, совершаемое по необходимости». Выражение «по необходимости» в данном контексте может обозначать внешнее принуждение.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνθυμήθητι
  choice: подумай
  rationale: Повелительная форма призывает обдумать довод; «подумай» естественно передаёт это в современной русской речи.
- source_word: θρησκείας
  choice: религии
  rationale: В устах гонителя слово обозначает иудейскую религию как внешне описываемый уклад веры и почитания; нейтральное «религия» сохраняет такой ракурс.
- source_word: ἐποπτικὴ δύναμις
  choice: надзирающая сила
  rationale: Передаёт представление о силе, которая наблюдает или надзирает, но не отождествляет её прямо с Богом.
- source_word: συγγνωμονήσειέν
  choice: простила бы
  rationale: Потенциальный оптатив в условной конструкции выражает предполагаемое снисхождение или прощение; условное наклонение это сохраняет.
- source_word: παρανομίᾳ
  choice: нарушение закона
  rationale: Ясно передаёт действие вопреки закону и подходит к конкретному требованию нарушить иудейский закон.
- source_word: διʼ ἀνάγκην
  choice: по принуждению
  rationale: В данном контексте ἀνάγκη означает внешнее понуждение, а не отвлечённую необходимость.
- source_word: ἐπὶ πᾶσιν
  choice: любое
  rationale: Передаёт всеохватность выражения применительно ко всем навязываемым нарушениям; буквальная конструкция по-русски была бы неестественной.
theological_decisions:
- issue: Кого обозначает «надзирающая сила»
  choice: Оставить безличное и намеренно неопределённое обозначение
  alternative: Прямо назвать Бога или Божий промысел
  rationale: Греческий текст не называет Бога и вкладывает в уста говорящего гипотетическое упоминание некой силы, связанной с этой религией; конкретизация устранила бы исходную богословскую напряжённость.
- issue: Прощение вынужденного нарушения закона
  choice: Передать как утверждение говорящего о предполагаемом прощении
  alternative: Ослабить до простого оправдания или отсутствия вины
  rationale: συγγνωμονήσειέν допускает оттенки прощения, снисхождения и извинения; «простила бы» сохраняет нравственную серьёзность нарушения и не превращает слова гонителя в авторское богословское заключение.
translation_notes:
  register: Современный литературный русский язык с достойным, но не архаичным звучанием. Реплика сохраняет характер увещевания гонителя и не выдаёт его довод за авторское утверждение. Оба примечания отмечены в основном тексте.
