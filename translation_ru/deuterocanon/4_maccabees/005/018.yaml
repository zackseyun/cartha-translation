  yaml_path: translation/deuterocanon/4_maccabees/005/018.yaml
  text: And yet[a], even if our law were not truly divine, as you suppose, though we think it to be divine, even so you would have no right to nullify our honor in matters of piety.
translation:
  language: ru
  text: И всё же, даже если бы наш Закон в действительности не был божественным, как ты полагаешь, хотя мы и считаем его божественным, нам всё равно не следовало бы лишать силы наше доброе имя за благочестие.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нашу славу за благочестие». Греческое выражение может обозначать почётное положение или добрую репутацию, приобретённую благодаря благочестию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καίτοι
  choice: И всё же
  rationale: Передаёт уступительно-противительный переход и риторическую силу выражения.
- source_word: κατὰ ἀλήθειαν
  choice: в действительности
  rationale: Естественно передаёт наречное значение «на самом деле, истинно».
- source_word: ὁ νόμος ἡμῶν
  choice: наш Закон
  rationale: Речь идёт о конкретном Законе Израиля; прописная буква помогает обозначить этот референт без добавления слова «Тора».
- source_word: θεῖος
  choice: божественный
  rationale: Сохраняет точный уровень утверждения греческого прилагательного, не разворачивая его в более определённое «данный Богом».
- source_word: ὡς σὺ ὑπολαμβάνεις
  choice: как ты полагаешь
  rationale: Передаёт суждение собеседника и сохраняет прямое обращение в сдержанно-полемическом тоне.
- source_word: ἄλλως δὲ νομίζομεν αὐτὸν εἶναι θεῖον
  choice: мы-то, напротив, считаем его божественным
  rationale: 'ἄλλως δέ выражает противопоставление мнению собеседника: говорящие придерживаются иного убеждения.'
- source_word: οὐδὲ οὕτως
  choice: даже тогда
  rationale: Естественно возвращает читателя к допущенному вопреки убеждению говорящего условию.
- source_word: ἡμῖν ἦν ... ἀκυρῶσαι
  choice: нам не следовало бы сводить на нет
  rationale: 'Дательный ἡμῖν указывает на самих говорящих: даже при таком допущении им не подобало бы обесценивать приобретённое ими доброе имя. Это следует греческому тексту, тогда как английский консультационный слой передаёт субъект как «you».'
- source_word: τὴν ἐπὶ τῇ εὐσεβείᾳ δόξαν
  choice: наше доброе имя, основанное на благочестии
  rationale: δόξα здесь обозначает почётную репутацию или доброе имя, а ἐπὶ τῇ εὐσεβείᾳ указывает на благочестие как его основание.
theological_decisions:
- issue: Статус Закона как θεῖος
  choice: божественный
  alternative: данный Богом
  rationale: Перевод сохраняет формулировку и риторическое допущение оригинала, не превращая прилагательное в более развёрнутое богословское утверждение.
- issue: Значение εὐσέβεια
  choice: благочестие
  alternative: набожность; почитание Бога
  rationale: «Благочестие» сохраняет ключевое для 4 Маккавейской книги нравственно-религиозное понятие, связанное с почитанием Бога и верностью Закону.
- issue: Кто не должен упразднять доброе имя
  choice: нам не следовало бы
  alternative: тебе не следовало бы
  rationale: Форма ἡμῖν — дательный первого лица множественного числа — поддерживает чтение «нам». Поэтому субъект английского консультационного текста не перенесён вопреки греческому свидетельству.
translation_notes:
  register: Современный литературный русский язык с достоинством риторической речи. Тире отделяют вставное противопоставление убеждения говорящих от условного допущения. Форма «мы-то» подчёркивает явный контраст с мнением адресата, не делая речь разговорной.
