  text: Но ты не посмеёшься надо мной этим смехом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты не станешь надо мной насмехаться». В греческом тексте употреблены однокоренные слова — буквально: «не посмеёшься надо мной этим смехом»; вероятно, имеется в виду презрительный смех.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ
  choice: Но
  rationale: Передаёт сильное противопоставление предыдущей угрозе или насмешке естественным русским союзом.
- source_word: οὐ
  choice: не
  rationale: Сохраняет простое отрицание греческого текста без неоправданного усиления.
- source_word: γελάσεις
  choice: посмеёшься
  rationale: Будущее время γελάω передано глаголом «посмеяться»; в сочетании с «надо мной» он естественно выражает направленный на человека насмешливый смех.
- source_word: κατʼ ἐμοῦ
  choice: надо мной
  rationale: При глаголе смеха κατά с родительным обозначает враждебную или презрительную направленность; по-русски естественно «смеяться над кем-либо».
- source_word: τοῦτον τὸν γέλωτα
  choice: таким смехом
  rationale: Русское «таким смехом» сохраняет указательность и внутреннее повторение корня вместе с «посмеёшься», но звучит естественнее буквального «этот смех» после глагола.
