  naturalness: Фраза «насмеяться над нами из-за этого ненавистнейшего осквернения пищей» тяжеловесна, а «из-за» может неясно выражать причинную, а не инструментальную связь. Предлагаемая редакция сохраняет торжественно-обличительный регистр и звучит более естественно по-русски.
  terminology: «Закон» оставлен без добавления «Божий». Редкий термин μιεροφαγία передан как «оскверняющее вкушение», а сноска объясняет его составной смысл и предлагает допустимый вариант.
