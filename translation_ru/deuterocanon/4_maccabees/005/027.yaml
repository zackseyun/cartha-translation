  yaml_path: translation/deuterocanon/4_maccabees/005/027.yaml
  text: But tyrannically you are not only compelling us to break the law[a], but also to eat, so that you may further mock us with this most hateful defilement by food.
translation:
  language: ru
  text: Но ты по-тирански принуждаешь нас не только нарушать закон, но и есть, чтобы ещё насмехаться над нами этим ненавистным нам оскверняющим вкушением.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этим ненавистным нам осквернением через пищу» или «этим ненавистным нам осквернённым вкушением». Редкое греческое слово соединяет значения вкушения пищи и ритуального или нравственного осквернения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τυραννικὸν
  choice: по-тирански
  rationale: Прилагательное употреблено в наречном значении и характеризует принуждение как деспотическое; «по-тирански» прямо и естественно передаёт обвинительный тон.
- source_word: ἀναγκάζεις
  choice: принуждаешь
  rationale: Настоящее время и значение насильственного понуждения переданы без ослабления.
- source_word: παρανομεῖν
  choice: нарушить закон
  rationale: Глагол означает действовать вопреки закону. В контексте имеется в виду иудейский Закон, однако слово «Божий» не добавлено, поскольку его нет в греческом тексте.
- source_word: ἐσθίειν
  choice: есть
  rationale: Прямое и естественное соответствие простому инфинитиву.
- source_word: ὅπως
  choice: чтобы
  rationale: Передаёт цель, которую преследует тиран.
- source_word: ἐχθίστῃ
  choice: ненавистнейшего
  rationale: Сохранена превосходная степень и выраженное говорящим крайнее отвращение.
- source_word: μιεροφαγίᾳ
  choice: осквернения пищей
  rationale: Редкое сложное слово объединяет представления о вкушении и ритуально-нравственном осквернении; выбранный вариант передаёт оба компонента, не сводя смысл лишь к запрещённой пище.
- source_word: ἔτι
  choice: затем
  rationale: В данном построении обозначает последующее, добавочное издевательство как дальнейшую цель принуждения.
- source_word: ἐγγελάσῃς
  choice: насмеяться над нами
  rationale: Передаёт значение злорадно смеяться над кем-либо, глумиться или издеваться.
theological_decisions:
- issue: Смысл «закона» в παρανομεῖν в контексте мученичества Маккавеев
  choice: «нарушить закон» без поясняющего определения
  alternative: «нарушить Божий закон» или «нарушить закон предков»
  rationale: Контекст указывает на Тору и верность завету, но греческий текст не содержит определения; нейтральная формулировка сохраняет исходную краткость и не вносит толкование в основной текст.
- issue: Характер осквернения в μιεροφαγίᾳ
  choice: сохранить связь и с едой, и с осквернением
  alternative: «есть нечистую пищу»
  rationale: Альтернатива чрезмерно конкретизирует объект еды и ослабляет смысл самого оскверняющего вкушения, заключённый в редком сложном слове.
translation_notes:
  register: Современный литературный русский язык с достоинством мученической речи. Синтаксис сохраняет противопоставление «не только… но и…» и целевое придаточное; редкий греческий термин передан понятно, а его неоднозначность отмечена в сноске.
