base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/005/010.yaml
  text: If[a], while vainly boasting about the truth, you still despise even me at the cost of your own punishment[b], will you not wake up from your foolish philosophy?
translation:
  language: ru
  text: Если ты, тщетно похваляясь истиной, и дальше будешь презирать даже меня — себе же в наказание[a], — то не очнёшься ли ты от вашей пустословной философии[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к собственному наказанию»; возможен смысл: «навлекая наказание на самого себя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вздорной философии». Греческое слово может обозначать пустую, нелепую или болтливую речь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κενοδοξῶν
  choice: тщетно похваляясь
  rationale: Причастие выражает пустое, необоснованное самовосхваление. Сочетание сохраняет и глагольную форму, и осуждающий оттенок.
- source_word: περὶ τὸ ἀληθές
  choice: истиной
  rationale: В данном сочетании передаёт предмет похвальбы — «истину». Творительный падеж естественен по-русски и не добавляет толкования о том, действительно ли притязание говорящего на истину обоснованно.
- source_word: κἀμοῦ
  choice: даже меня
  rationale: Красис καὶ ἐμοῦ содержит усилительное «и/даже»; «даже меня» передаёт подчёркнутое личное достоинство говорящего и риторическую резкость.
- source_word: καταφρονήσεις
  choice: будешь презирать
  rationale: Глагол означает относиться с пренебрежением или презрением. Будущее время сохранено внутри условной конструкции.
- source_word: ἐπὶ τῇ ἰδίᾳ τιμωρίᾳ
  choice: себе же в наказание
  rationale: Фраза указывает, что презрение обернётся наказанием для самого адресата. Формулировка естественна по-русски, а частица «же» подчёркивает возвратный, иронический смысл.
- source_word: οὐκ ἐξυπνώσεις
  choice: не очнёшься ли ты
  rationale: Сохраняет метафору пробуждения и форму риторического вопроса, ожидающего утвердительного ответа.
- source_word: φλυάρου φιλοσοφίας
  choice: пустословной философии
  rationale: φλύαρος обозначает пустую, вздорную или болтливую речь. «Пустословная» сохраняет речевой образ точнее, чем общее «глупая», и звучит достаточно естественно в полемическом контексте.
- source_word: ὑμῶν
  choice: вашей
  rationale: 'Сохранено множественное число местоимения: упрёк обращён к одному человеку, но его философия названа общей для его группы. Переход от «ты» к «вашей» намеренно отражает греческий текст.'
theological_decisions:
- issue: Риторическая направленность упрёка
  choice: Передать стих как резкий нравственный вызов, сохранив образ пробуждения и философскую лексику.
  alternative: 'Истолковательно передать: «не образумишься ли ты и не оставишь вашу нелепую философию?»'
  rationale: Греческий текст полемичен, но не употребляет глагола «оставить» и сохраняет метафору пробуждения «от» философии. Выбранный вариант не вводит более поздних философских или конфессиональных категорий.
- issue: Смена числа во втором лице
  choice: Сохранить единственное число адресата («ты») и множественное число принадлежности («вашей»).
  alternative: 'Согласовать всё в единственном числе: «твоей философии».'
  rationale: 'Смена числа содержится в греческом: καταφρονήσεις и ἐξυπνώσεις стоят во втором лице единственного числа, тогда как ὑμῶν — множественного. Она может расширять упрёк с адресата на его единомышленников, поэтому её не следует сглаживать.'
translation_notes:
  register: Современный литературный русский язык с достоинством и резкой полемической интонацией. «Очнёшься» сохраняет метафору пробуждения без разговорного «проснёшься», а «пустословная философия» передаёт насмешливую оценку φλύαρος. Тире обособляют фразу о наказании и помогают ясно прочитать длинную условную конструкцию.
