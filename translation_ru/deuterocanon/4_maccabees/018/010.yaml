lexical_decisions:
- source_word: ὃς
  choice: который
  rationale: Относительное местоимение продолжает мысль предыдущего контекста; «который» естественно сохраняет греческую синтаксическую связь.
- source_word: ἐδίδασκεν
  choice: учил
  rationale: Форма имперфекта обозначает действие в прошлом, которое могло быть продолжительным или обычным. Русское «учил» естественно в данном контексте и не вынуждает выбирать между этими оттенками.
- source_word: ὑμᾶς
  choice: вас
  rationale: Винительный падеж местоимения второго лица множественного числа передан прямым дополнением «вас».
- source_word: ἔτι ὢν σὺν ἡμῖν
  choice: ещё будучи с нами
  rationale: Причастный оборот передан близко к форме оригинала и сохраняет как временно-обстоятельственный смысл, так и значение ἔτι — «ещё».
- source_word: τὸν νόμον
  choice: закону
  rationale: При русском глаголе «учить» предмет обучения естественно ставится в дательном падеже; здесь имеется в виду Закон, то есть Тора.
- source_word: καὶ τοὺς προφήτας
  choice: и пророкам
  rationale: Сохранено традиционное библейское сочетание с «законом»; по смыслу речь идёт о пророческих писаниях или авторитетном свидетельстве пророков.
theological_decisions:
- issue: Следует ли писать «Закон и Пророки» с прописных букв как название разделов Писания
  choice: закону и пророкам
  alternative: Закону и Пророкам
  rationale: Греческий текст ясно указывает на священные Писания Израиля, однако прописные буквы были бы редакционным истолкованием, отсутствующим в оригинале. Строчные буквы сохраняют смысл, а примечание поясняет устойчивое выражение.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Причастный оборот «ещё будучи с нами» сохраняет компактность и структуру греческого текста; «учил» звучит естественно и оставляет открытым аспектуальный оттенок имперфекта.
