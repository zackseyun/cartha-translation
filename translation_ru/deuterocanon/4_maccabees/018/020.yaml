  source_fidelity: Перевод точно передаёт риторический парадокс πικρᾶς … οὐ πικρᾶς, генитивное «тиран греков», образ кипящей ярости, семь юношей и намеренно незавершённый синтаксис греческого фрагмента. «Под ... котлами» является естественным русским развёртыванием сцены разжигания огня и не меняет смысла. «Жестокий» для πικρός в характеристике тирана передаёт контекстуальный смысл, хотя буквальный повтор корня, сохранённый в первых двух случаях, в русском здесь нельзя воспроизвести без неестественного и семантически неточного «горький тиран».
