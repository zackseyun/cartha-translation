base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/020.yaml
  text: How bitter was that day—and yet not bitter—when the bitter Greek tyrant[a], after kindling fire in the cruel cauldrons and, in boiling rage, bringing the seven boys to the catapult and again to his tortures[b],
translation:
  language: ru
  text: Как горек был тот день — и всё же не горек, — когда жестокий тиран греков, разжёгши огонь под беспощадными котлами и кипя яростью, повёл семерых юношей к катапульте[a], а затем снова на свои пытки…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к дыбе», «к орудию пытки». Греческое слово обычно означает катапульту или подобную метательную машину, но здесь, вероятно, обозначает приспособление для пытки.'
    reason: lexical_alternative
  - marker: b
    text: В предоставленном греческом тексте предложение на этом не заканчивается, а продолжается в следующем стихе.
    reason: textual_syntax
lexical_decisions:
- source_word: πικρᾶς … οὐ πικρᾶς … πικρὸς
  choice: горек … не горек … жестокий
  rationale: Повтор «горек — не горек» сохраняет парадокс и словесный рисунок; применительно к тирану естественное русское «жестокий» точнее передаёт смысл, чем неидиоматичное «горький».
- source_word: Ἑλλήνων τύραννος
  choice: тиран греков
  rationale: Сохраняет формально неоднозначный родительный Ἑλλήνων и не сводит его без необходимости к прилагательному «греческий».
- source_word: πῦρ φλέξας λέβησι ὠμοῖς
  choice: разжёгши огонь под беспощадными котлами
  rationale: λέβης передано как «котёл»; ὠμός имеет переносный смысл «жестокий, беспощадный». Предлог «под» естественно описывает разжигание огня для нагревания котлов.
- source_word: ζέουσιν θυμοῖς
  choice: кипя яростью
  rationale: Сохраняется образ кипения, перекликающийся с котлами; множественное θυμοῖς по-русски естественно выражается единственным числом.
- source_word: ἀγαγὼν
  choice: повёл
  rationale: Аористное причастие передано личной формой для ясного и естественного русского синтаксиса.
- source_word: ἐπὶ τὸν καταπέλτην
  choice: к катапульте
  rationale: Сохранено обычное лексическое значение καταπέλτης; вероятное контекстуальное значение орудия пытки разъяснено в сноске.
- source_word: τὰς βασάνους αὐτοῦ
  choice: на свои пытки
  rationale: Передаёт множественное число и притяжательное αὐτοῦ, относящее пытки к тирану; «на пытки» идиоматично после «повёл».
- source_word: τοὺς ἑπτὰ παῖδας
  choice: семерых юношей
  rationale: παῖδες допускает значения «дети, мальчики, юноши»; «юноши» сохраняет возрастной оттенок, не вводя здесь прямо не названное «сыновья».
theological_decisions:
- issue: Парадокс καὶ οὐ πικρᾶς
  choice: и всё же не горек
  alternative: и не горек
  rationale: «Всё же» ясно удерживает намеренное противопоставление скорби дня и его иного, не разъяснённого автором измерения, не превращая его в богословский комментарий.
- issue: Значение καταπέλτης в контексте мучений
  choice: катапульта
  alternative: дыба / орудие пытки
  rationale: В основном тексте сохранено обычное значение слова, а контекстуальная вероятность специального орудия мучения отмечена в сноске без чрезмерной уверенности.
- issue: Незавершённость греческого предложения
  choice: многоточие и сноска
  alternative: искусственно завершить фразу
  rationale: Предоставленный греческий текст стиха оканчивается на винительной группе и синтаксически продолжается далее; перевод не должен добавлять отсутствующее сказуемое или итог действия.
translation_notes:
  register: Современный литературный русский язык с возвышенной риторической интонацией. Сохранён парадокс «горек — не горек», образ кипящей ярости и синтаксическая незавершённость исходного фрагмента; архаизмы и конфессиональная терминология не вводились.
