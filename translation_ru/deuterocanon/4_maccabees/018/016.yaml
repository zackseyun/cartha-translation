  text: He held up Solomon before us as a proverb, the one who says, “It is a tree of life for all who do his will.”
translation:
  language: ru
  text: 'Он приводил нам в пример Соломона, который говорит: «Это — древо жизни для всех, кто исполняет его волю».[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое местоимение может относиться к Богу; возможны также отнесения к «древу» или к подразумеваемой мудрости. Контекст скорее указывает на Бога.
    reason: alternative_reading
  - marker: b
    text: Это изречение представляет собой изменённый отголосок Притчей 3:18.
    reason: cross_reference
lexical_decisions:
- source_word: ἐπαροιμίαζεν
  choice: приводил нам в пример
  rationale: Глагол обозначает обращение к кому-либо или чему-либо как к пословичному изречению. В сочетании с прямым дополнением «Соломона» естественный русский оборот передаёт риторическое цитирование авторитетного мудреца, не превращая самого Соломона буквально в пословицу.
- source_word: τὸν Σαλομῶντα
  choice: Соломона
  rationale: Личное имя передано в традиционной русской библейской форме; винительный падеж зависит от ἐπαροιμίαζεν.
- source_word: ἡμῖν
  choice: нам
  rationale: Дательный падеж обозначает адресатов, перед которыми приводилось изречение.
- source_word: τὸν λέγοντα
  choice: который говорит
  rationale: Артиклированное причастие настоящего времени представляет Соломона как произносящего цитируемое изречение; настоящее время сохранено.
- source_word: Ξύλον ζωῆς
  choice: древо жизни
  rationale: Сохранён устойчивый библейский образ и связь с Притчами 3:18; «древо» здесь уместно как закреплённое литературно-библейское обозначение.
- source_word: πᾶσιν τοῖς ποιοῦσιν
  choice: для всех, кто исполняет
  rationale: «Для всех» естественно передаёт дательный отношения, а «исполняет» идиоматично сочетается в русском с «волей».
- source_word: αὐτοῦ τὸ θέλημα
  choice: Его волю
  rationale: Контекст верности Богу делает Бога наиболее вероятным референтом местоимения. Заглавная буква помогает обозначить это чтение, тогда как грамматическая неоднозначность греческого сохранена в примечании.
theological_decisions:
- issue: Референт αὐτοῦ в цитате
  choice: Его волю — волю Бога
  alternative: его/её волю — с отнесением местоимения к древу жизни или подразумеваемой мудрости
  rationale: В ближайшем контексте речь идёт о верности Богу, поэтому личный божественный референт наиболее связен. Однако греческая форма сама по себе не устраняет иной возможности, и она отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Выражение «древо жизни» сохранено как узнаваемый образ; синтаксис сделан ясным для обычного читателя. Все сноски отмечены в основном тексте.
