  text: He bore witness to Ezekiel[a], who says[b], “Will these dry bones live?”
translation:
  language: ru
  text: 'Он призывал в свидетели Иезекииля[a][b], который говорит: «Оживут ли эти сухие кости?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Отсылка к Иезекиилю 37:3 — вопросу пророка в видении долины сухих костей.
    reason: cross_reference
  - marker: b
    text: 'Или: «ссылался на свидетельство Иезекииля»; возможно также: «подтверждал слова Иезекииля». Греческий глагол имеет свидетельственный оттенок и не вполне однозначен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστοποιεῖτο
  choice: призывал в свидетели
  rationale: 'Глагол имеет свидетельственный оттенок: говорящий обращается к пророческому свидетельству Иезекииля. Такой перевод сохраняет образ свидетельства и не сводит выражение однозначно к «подтверждал».'
- source_word: τὸν Ἰεζεκιὴλ
  choice: Иезекииля
  rationale: Употреблена общепринятая русская форма имени библейского пророка.
- source_word: τὸν λέγοντα
  choice: который говорит
  rationale: Причастие настоящего времени вводит цитату; настоящее время естественно для ссылки на сохраняющий силу текст Писания.
- source_word: Εἰ ζήσεται
  choice: Оживут ли
  rationale: εἰ здесь вводит общий вопрос, как и в контексте Иезекииля 37:3; русская частица «ли» естественно передаёт вопросительное значение. «Оживут» точнее по контексту сухих костей, чем буквальное «будут жить».
- source_word: τὰ ὀστᾶ τὰ ξηρὰ ταῦτα
  choice: эти сухие кости
  rationale: Естественный русский порядок слов сохраняет указательное местоимение и подчёркнутый признак сухости костей.
theological_decisions:
- issue: Формула обращения к Иезекиилю и образ оживления сухих костей
  choice: 'Передать фразу как призывание Иезекииля в свидетели и сохранить вопрос: «Оживут ли эти сухие кости?»'
  alternative: «Он подтверждал слова Иезекииля» или «Он ссылался на свидетельство Иезекииля»
  rationale: Текст привлекает видение Иезекииля как свидетельство надежды перед лицом смерти, но сам стих выражен вопросом. Перевод не превращает этот намёк в более развёрнутое учение и сохраняет его риторическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формула «призывал в свидетели» несколько возвышенна, но понятна и сохраняет юридико-свидетельственный оттенок греческого глагола; вопрос сформулирован просто и естественно.
