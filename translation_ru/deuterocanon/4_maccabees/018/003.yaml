base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/003.yaml
  text: For this reason[a], because of their godliness, when those men gave up their bodies to those sufferings, they were not only admired by men, but were also counted worthy of a divine share.
translation:
  language: ru
  text: За это[a] они, из благоговения перед Богом предавшие свои тела тем страданиям, не только вызывали восхищение у людей, но и были признаны достойными божественной доли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доли от Бога»; или: «причастности божественному». Краткое греческое выражение может означать как долю, дарованную Богом, так и участие в божественном.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνθʼ ὧν
  choice: За это
  rationale: Оборот указывает на следствие или воздаяние за описанный поступок; «за это» естественно связывает стих с предшествующим контекстом и хорошо сочетается с последующим признанием достоинства.
- source_word: διὰ τὴν εὐσέβειαν
  choice: из благоговения пред Богом
  rationale: εὐσέβεια обозначает религиозное благочестие и почтительное служение Богу; такая формулировка ясно передаёт религиозную направленность и звучит современнее отвлечённого «из благочестия».
- source_word: προεμενοι τὰ σώματα
  choice: отдав свои тела
  rationale: Причастие от προΐημι передаёт добровольную отдачу или предание; «отдав» сохраняет этот смысл, не вводя сверх текста явно жертвенной терминологии.
- source_word: τοῖς πόνοις ἐκείνοι
  choice: на те страдания
  rationale: πόνοι здесь означает перенесённые мучения или страдания, а ἐκείνοι отсылает к уже описанным испытаниям; «те страдания» сохраняет эту связь.
- source_word: ὑπὸ τῶν ἀνθρώπων ἐθαυμάσθησαν
  choice: удостоились восхищения людей
  rationale: Передаёт пассивное ἐθαυμάσθησαν естественным русским оборотом и сохраняет противопоставление человеческого восхищения божественному признанию.
- source_word: θείας μερίδος
  choice: божественной доли
  rationale: Сжатое греческое выражение допускает понимание как доли, даруемой Богом, так и причастности божественному; буквенно-естественное «божественная доля» сохраняет эту неоднозначность.
- source_word: κατηξιώθησαν
  choice: были признаны достойными
  rationale: Глагол выражает оценку или признание кого-либо достойным; выбранный оборот точен, ясен и выдержан в возвышенном регистре.
theological_decisions:
- issue: Значение θείας μερίδος
  choice: божественной доли
  alternative: доли от Бога; причастности божественному
  rationale: Греческая фраза не уточняет, идёт ли речь о дарованной Богом награде или об участии в божественной доле. Основной текст намеренно не снимает эту богословскую напряжённость, а примечание обозначает обе возможности.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим повествованию о мучениках. Синтаксис сохранён как единое причинно-следственное предложение; архаизмы и конфессионально окрашенные уточнения не вводятся.
