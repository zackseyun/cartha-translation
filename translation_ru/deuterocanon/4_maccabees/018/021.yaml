lexical_decisions:
- source_word: τὰς τῶν ὀμμάτων κόρας
  choice: зрачки их глаз
  rationale: κόραι в анатомическом контексте означает зрачки. Перевод сохраняет конкретную деталь греческого текста, не заменяя её более общим словом «глаза».
- source_word: ἐπήρωσεν
  choice: изувечил
  rationale: Глагол означает сделать увечным, повредить или лишить способности. «Изувечил» передаёт насильственное повреждение, не уточняя сверх текста, были ли зрачки именно выколоты и наступила ли полная слепота.
- source_word: γλώσσας ἐξέτεμεν
  choice: вырезал им языки
  rationale: ἐκτέμνω означает вырезать, иссекать. Русское выражение прямо и естественно передаёт физическое насилие; местоимение «им» восстанавливает подразумеваемых пострадавших из контекста.
- source_word: βασάνοις ποικίλαις
  choice: различными пытками
  rationale: Творительный падеж передаёт инструментальное значение дательного; βάσανοι здесь — пытки или мучения, а ποικίλαις — различные.
- source_word: ἀπέκτεινεν
  choice: умертвил их
  rationale: Глагол прямо означает «убил». «Умертвил» соответствует достоинству повествовательного регистра и хорошо сочетается с указанием на пытки как средство; «их» естественно восполняется по контексту.
