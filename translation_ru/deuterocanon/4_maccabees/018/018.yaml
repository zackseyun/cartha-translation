lexical_decisions:
- source_word: ᾠδήν
  choice: песнь
  rationale: Передаёт обычное значение слова и сохраняет возвышенный библейский регистр; «ода» звучала бы излишне литературоведчески.
- source_word: ἐδίδαξεν
  choice: которой научил
  rationale: Естественная русская конструкция с глаголом «научить» сохраняет образовательный смысл и показывает, что Моисей передал эту песнь другим.
- source_word: οὐκ ἐπελάθετο
  choice: не забыла
  rationale: Прямо передаёт значение глагола и сохраняет мотив памяти.
- source_word: τὴν διδάσκουσαν
  choice: песнь, которая учит
  rationale: Повтор существительного устраняет тяжеловесность буквального «ту, которая учит» и сохраняет лёгкую персонификацию песни как наставляющей.
- source_word: Ἐγὼ ἀποκτενῶ, καὶ ζῆν ποιήσω
  choice: Я умерщвлю и оживлю
  rationale: Будущее время соответствует формам греческого текста; «оживлю» естественно и ёмко передаёт каузативное ζῆν ποιήσω.
- source_word: γάρ
  choice: Ведь
  rationale: Естественно вводит пояснение к предшествующей мысли, сохраняя связующую силу частицы.
theological_decisions:
- issue: Передача божественного самоизречения из Песни Моисея
  choice: Я умерщвлю и оживлю
  alternative: Я умерщвляю и оживляю
  rationale: Непосредственный греческий текст 4 Маккавейской использует формы будущего времени; перевод не гармонизирует их с формулировками Второзакония, где в отдельных текстовых традициях или переводах встречается настоящее время.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Песнь» выбрана вместо разговорного «песня» с учётом жанра и контекста цитаты; синтаксис сделан ясным без устранения образа песни, которая учит.
