  source_fidelity: 'Смысл в целом передан верно: γάρ отражено как «ведь», отрицание и мотив памяти сохранены, а будущие формы ἀποκτενῶ и ποιήσω точно переданы будущим временем. Однако «которой научил Моисей» синтаксически двусмысленно и обычно означает, что Моисей научил саму песнь; греческое ἣν ἐδίδαξεν означает песнь, которой Моисей научил людей/которую Моисей преподал.'
