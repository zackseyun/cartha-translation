  text: O children[a], descendants of the seed of Abraham, Israelites, obey this law[b], and be godly in every way.
translation:
  language: ru
  text: О дети, потомки семени Авраама, израильтяне! Повинуйтесь этому Закону[a] и во всём живите благочестиво[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Закону, данному Израилю, — Торе.
    reason: referential_clarification
  - marker: b
    text: 'Или: «во всём поступайте благочестиво». Греческий глагол означает благоговейное, угодное Богу поведение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: О
  rationale: Сохраняет торжественное звательное восклицание и возвышенный риторический тон.
- source_word: τῶν Ἀβραμιαίων σπερμάτων ἀπόγονοι
  choice: потомки Авраамова рода
  rationale: Передаёт усиленное указание на происхождение от Авраама, не воспроизводя буквально громоздкое сочетание «потомки семян».
- source_word: παῖδες
  choice: дети
  rationale: Прямое обращение с оттенком принадлежности к роду; не ограничивает адресатов только мужчинами.
- source_word: Ἰσραηλεῖται
  choice: израильтяне
  rationale: Общепринятое русское обозначение народа Израиля.
- source_word: πείθεσθε
  choice: повинуйтесь
  rationale: При дательном τῷ νόμῳ глагол обозначает практическое послушание Закону, а не только убеждённость.
- source_word: τῷ νόμῳ τούτῳ
  choice: этому Закону
  rationale: Контекст обращения к израильтянам указывает на Закон как Тору; прописная буква ясно передаёт это значение в русском употреблении.
- source_word: πάντα τρόπον
  choice: во всём
  rationale: Естественно и кратко передаёт всеохватность требуемого образа жизни.
- source_word: εὐσεβεῖτε
  choice: живите благочестиво
  rationale: Передаёт деятельное, постоянное почитание Бога и звучит естественнее, чем буквальное «благочествуйте».
theological_decisions:
- issue: Значение «этого Закона»
  choice: Закон Израиля, то есть Тора
  alternative: закон в общем нравственном смысле
  rationale: Обращение к израильтянам и контекст 4 Маккавейской книги указывают на данный Израилю Закон, однако слово «Тора» в основной текст не добавлено.
- issue: Смысл εὐσεβεῖτε
  choice: благочестивый, почитающий Бога образ жизни
  alternative: общая почтительность или нравственность
  rationale: В контексте глагол имеет религиозно-нравственный смысл, но перевод не уточняет его конфессионально.
translation_notes:
  register: Современный литературный русский с торжественным обращением. Риторическая многослойность греческого обозначения происхождения передана сочетанием «дети, потомки Авраамова рода», а повелительные формы сохранены.
