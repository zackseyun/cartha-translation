base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/023.yaml
  text: But the children of Abraham[a], together with their victory-bearing mother, are gathered to the place of their fathers[b], having received pure and immortal souls from God.
translation:
  language: ru
  text: А сыны Авраама вместе с матерью-победительницей[a] собираются[b] в обитель отцов, получив от Бога чистые и бессмертные души.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «матерью, несущей награду за состязание»; греческое слово изображает её как победительницу в состязании.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «присоединяются к обществу отцов»; греческий глагол может подчёркивать не только собирание, но и совместное пребывание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀβραμιαῖοι ... παῖδες
  choice: сыны Авраама
  rationale: Прилагательное Ἀβραμιαῖοι указывает на принадлежность к Аврааму, а παῖδες в данном контексте обозначает братьев-мучеников. «Сыны» сохраняет мужской род непосредственных участников и библейскую торжественность, оставаясь понятным современному читателю.
- source_word: σὺν τῇ ἀθλοφόρῳ μητρὶ
  choice: вместе со своей матерью-победительницей
  rationale: ἀθλοφόρος связано с победой и наградой в состязании. «Мать-победительница» естественно звучит по-русски и сохраняет образ мученического подвига как победного состязания; более буквальный оттенок пояснён в сноске.
- source_word: εἰς πατέρων χῶρον
  choice: в обители отцов
  rationale: χῶρος означает место, пространство или область. «Обитель отцов» передаёт посмертное место пребывания предков, не отождествляя его прямо с небом, раем или лоном Авраама.
- source_word: συναγελιᾶζονται
  choice: собираются
  rationale: Глагол выражает соединение с другими и пребывание в их обществе. «Собираются» сохраняет образ присоединения к отцам, а возможный акцент на совместном пребывании отмечен в сноске.
- source_word: ψυχὰς
  choice: души
  rationale: В сочетании с определениями «чистые и бессмертные» и в контексте посмертной награды ψυχαί естественнее всего означает души, а не земные жизни.
- source_word: ἁγνὰς καὶ ἀθανάτους
  choice: чистые и бессмертные
  rationale: Прямо передаёт два греческих определения, не усиливая ἁγνάς до более узкого богословского термина «святые».
- source_word: ἀπειληφότες
  choice: получив
  rationale: Причастие от ἀπολαμβάνω обозначает получение или обретение; «получив» ясно передаёт результативное действие.
- source_word: παρὰ τοῦ θεοῦ
  choice: от Бога
  rationale: παρά с родительным падежом указывает на источник; перевод не добавляет отсутствующего в греческом образа Божьей руки.
theological_decisions:
- issue: Посмертный образ в εἰς πατέρων χῶρον
  choice: в обители отцов
  alternative: в краю отцов; там, где пребывают отцы
  rationale: Греческий текст указывает на место предков и присоединение к ним, но не называет его небом, раем или лоном Авраама. Перевод сохраняет эту сдержанность.
- issue: Антропологический смысл ψυχὰς ἁγνὰς καὶ ἀθανάτους
  choice: чистые и бессмертные души
  alternative: чистые и бессмертные жизни
  rationale: В контексте мученической смерти речь идёт о полученном от Бога посмертном даре. «Души» сохраняет утверждение текста, не сводя его к продолжению земной жизни.
- issue: Характер материнской победы в ἀθλοφόρῳ
  choice: матерь-победительница
  alternative: победоносная мать; мать, удостоенная награды
  rationale: Выбранный вариант сохраняет атлетическую метафору мученического подвига, но не вводит отсутствующих в тексте подробностей о венце или конкретной награде.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формы «сыны» и «обитель» поддерживают достоинство заключительной похвалы мученикам, не делая фразу архаичной в целом. Сноски поставлены непосредственно после выражений, к которым относятся.
