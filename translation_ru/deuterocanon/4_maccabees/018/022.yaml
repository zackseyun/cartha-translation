  verdict: approve
  source_fidelity: «За это» адекватно передаёт причинное ὑπὲρ ὧν с отсылкой к предшествующим деяниям. «Божественное правосудие» удачно сохраняет олицетворённый и одновременно судебно-карательный смысл ἡ θεία δίκη. Повтор «преследовало и будет преследовать» отражает повтор μετῆλθεν καὶ μετελεύσεται; русское прошедшее несовершенного вида несколько менее явно выражает завершённость греческого аориста, но в данном образе продолжающегося воздаяния это не искажает смысла. «Проклятого» — допустимая передача редкого ἀλιόστωρ, а сноска честно сохраняет лексическую неопределённость.
  naturalness: Фраза краткая, литературная и естественная для торжественного контекста. Субстантивированное «проклятого» звучит по-русски уместно и не требует добавления имени, которого в самом стихе нет.
  terminology: «Божественное правосудие» не навязывает толкования как исключительно мести или исключительно наказания. Лексическая сноска поставлена после слова, к которому относится, и её формулировка соответствует степени уверенности в значении редкого греческого слова.
