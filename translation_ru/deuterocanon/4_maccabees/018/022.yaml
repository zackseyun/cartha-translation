  text: За это божественное правосудие преследовало и будет преследовать проклятого[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осквернённого», «мерзкого». Греческое слово встречается редко и выражает резкое нравственно-религиозное осуждение.'
    reason: Лексическое значение редкого слова ἀλιόστωρ не вполне определённо.
lexical_decisions:
- source_word: ὑπὲρ ὧν
  choice: за это
  rationale: Сочетание ὑπέρ с относительным местоимением указывает на основание воздаяния. Русское «за это» естественно передаёт причинный смысл и отсылает к предшествующим поступкам.
- source_word: ἡ θεία δίκη
  choice: божественное правосудие
  rationale: δίκη может обозначать правосудие, кару или возмездие. «Божественное правосудие» сохраняет как судебный, так и карательный оттенок, не сводя выражение только к наказанию или мести.
- source_word: μετῆλθεν καὶ μετελεύσεται
  choice: преследовало и будет преследовать
  rationale: Обе формы одного глагола переданы одинаково, чтобы сохранить риторический повтор и образ неотступного божественного воздаяния. Прошедшее и будущее время отражены непосредственно.
- source_word: τὸν ἀλιόστορα
  choice: проклятого
  rationale: Редкое резко порицательное слово, вероятно связанное с проклятием, осквернением или мерзостью. «Проклятого» ясно и кратко передаёт сильное нравственно-религиозное осуждение, а неопределённость оттенка отмечена в сноске.
theological_decisions:
- issue: Передача δίκη в контексте божественного воздаяния
  choice: божественное правосудие
  alternative: божественная кара; божественное возмездие
  rationale: Выбранный вариант сохраняет напряжение между правосудием как принципом и его карательным действием, не утверждая более узкого толкования.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная. Олицетворение божественного правосудия и повтор глагола сохранены.
