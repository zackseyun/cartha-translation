base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/004.yaml
  text: And because of them the nation was at peace[a], and, having renewed good order in the homeland[b], it has besieged the enemies completely.
translation:
  language: ru
  text: Благодаря им народ обрёл мир[a] и, восстановив в отечестве законный порядок[c], подверг врагов полной осаде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через них»; греческое выражение может указывать как на причину, так и на посредничество.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий глагол образован от слова «осаждать» и имеет усилительное, результативное значение; возможно также: «полностью осадил врагов» или «изгнал врагов посредством осады».'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте причастие «восстановив» стоит в мужском роде и формально не согласуется со словом «народ», которое имеет средний род; поэтому субъект этого и последующего действия нельзя определить с полной уверенностью.
    reason: source_ambiguity
lexical_decisions:
- source_word: διʼ αὐτοὺς
  choice: благодаря им
  rationale: Передаёт наиболее естественное здесь причинное значение διά с винительным, не исключая оттенка посредничества.
- source_word: εἰρήνευσεν τὸ ἔθνος
  choice: народ обрёл мир
  rationale: Глагол обозначает пребывание или жизнь в мире; «обрёл мир» естественно выражает наступившее состояние и не подразумевает непременно заключения мирного договора.
- source_word: εὐνομίαν
  choice: добрый законный порядок
  rationale: Слово охватывает как общественный порядок, так и жизнь по надлежащему закону; сочетание сохраняет обе стороны значения.
- source_word: τὴν ἐπὶ τῆς πατρίδος
  choice: в отечестве
  rationale: Передаёт связь с родной, отеческой землёй в современном литературном русском языке.
- source_word: ἀνανεωσάμενος
  choice: восстановив
  rationale: В контексте речь идёт о возобновлении прежде существовавшего порядка; деепричастие сохраняет связь этого действия с последующим военным исходом.
- source_word: ἐκπεπολιόρκηκε
  choice: окончательно одолел … осадой
  rationale: Передаёт интенсивный и результативный характер перфекта глагола, образованного от «осаждать», сохраняя образ осады без искусственной русской конструкции.
- source_word: τοὺς πολεμίους
  choice: врагов
  rationale: Прямое и естественное обозначение противника в военном контексте.
theological_decisions:
- issue: Причинная роль мучеников в обретении народом мира
  choice: «Благодаря им» прямо сохраняет утверждаемую стихом причинную связь.
  alternative: «Через них» — более инструментальное понимание.
  rationale: Греческое выражение допускает причинный и инструментальный оттенки. Перевод не ослабляет их роль, но и не привносит в этот стих развёрнутого учения о жертве или искуплении.
- issue: Субъект восстановления порядка и победы над врагами
  choice: В основном тексте эти действия отнесены к народу как коллективному деятелю.
  alternative: Субъект можно понимать как подразумеваемого деятеля, не названного в данном предложении.
  rationale: Форма причастия мужского рода формально не согласуется с существительным среднего рода τὸ ἔθνος, поэтому грамматическую неровность следует отметить, а не превращать в богословски определённое указание на Бога или иного деятеля.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. «Отечество» сохраняет патриотический оттенок πατρίς, а «добрый законный порядок» остаётся понятным без конфессионального сужения смысла.
