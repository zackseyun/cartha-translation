base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/008.yaml
  text: No destroyer in the desolate wilderness ruined me in the open field[a], nor did the serpent, destroyer through deceit, violate the purity of my virginity; but I remained with my husband through the time of my prime.
translation:
  language: ru
  text: Не погубил меня разоритель пустыни, губитель в поле[a]; и змей-обманщик, разоритель, не осквернил чистоты моего девства. В пору расцвета сил я оставалась с мужем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза намеренно сгущает близкие слова со значением разрушения: «разоритель пустыни, губитель в поле». Синтаксическая связь этих образов остаётся сжатой и допускает разные оттенки понимания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διέφθειρέν
  choice: погубил
  rationale: Глагол может означать уничтожение или нравственное растление; «погубил» сохраняет широкий смысл и поддерживает ряд слов со значением разорения.
- source_word: λυμεὼν … φθορεὺς
  choice: разоритель … губитель
  rationale: Два близких по смыслу существительных переданы разными русскими словами, чтобы сохранить намеренное нагнетание разрушительной образности без неестественного повтора.
- source_word: τῆς ἐρημίας … ἐν πεδίῳ
  choice: пустыни … в открытом поле
  rationale: Сохранены пространственные образы греческого текста и контраст между пустынной местностью и открытым полем; неясная связь определений не была искусственно устранена.
- source_word: ἐλυμήνατό
  choice: осквернил
  rationale: В сочетании с чистотой девства глагол обозначает посягательство с нравственно-сексуальным оттенком; «осквернил» естественно передаёт этот смысл, не добавляя подробностей.
- source_word: τὰ ἁγνὰ τῆς παρθενίας
  choice: чистоты моего девства
  rationale: Русская конструкция сохраняет как множественно-собирательный оттенок τὰ ἁγνά, так и прямое упоминание девства.
- source_word: λυμεὼν ἀπάτης ὄφις
  choice: змей, разоряющий обманом
  rationale: Переданы образ змея, повтор лексики разорения и возможное значение родительного ἀπάτης как способа действия.
- source_word: χρόνον ἀκμῆς
  choice: всю пору расцвета сил
  rationale: ἀκμή обозначает расцвет, высшую пору зрелости; формулировка литературна, понятна и не сужает смысл только до юности.
- source_word: σὺν ἀνδρί
  choice: с мужем
  rationale: В контексте рассказа о девстве и последующей совместной жизни ἀνήρ естественно означает супруга, хотя само слово также может значить «мужчина».
theological_decisions:
- issue: Возможная аллюзия на змея-обманщика и утверждение о сохранённой чистоте
  choice: Сохранить в основном тексте слова «змей» и «обманом», не раскрывая аллюзию дополнительно.
  alternative: Передать ὄφις нейтральнее как «змея» и ослабить аллюзивное звучание.
  rationale: Сочетание ὄφις и ἀπάτη само вызывает ассоциацию с обманом змея, но текст не формулирует её прямо; перевод сохраняет резонанс, не превращая его в толкование.
- issue: Неоднозначность σὺν ἀνδρί
  choice: Передать как «с мужем».
  alternative: 'Передать буквально и шире: «с мужчиной».'
  rationale: Супружеское значение наиболее естественно в автобиографическом контексте, однако перевод не делает из этой детали дополнительных богословских выводов.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно возвышенной образностью. Повтор разрушительной лексики сохранён как риторическая особенность оригинала; архаизмы и конфессионально окрашенные добавления исключены.
