  - severity: medium
    issue: «Также» неясно передаёт καὶ ταῦτα.
    rationale: В греческом добавочное καί относится к «этим вещам»; «также следующее» сохраняет и добавочность, и отсылку к содержанию предстоящей речи.
  - severity: low
    issue: «Юношей» добавляет возрастной оттенок и менее явно выражает сыновнее родство.
    rationale: παῖδες в данном контексте обозначает семерых мужских детей матери; «сыновей» точнее и естественнее, тогда как последующее τέκνα можно сохранить как «детей».
