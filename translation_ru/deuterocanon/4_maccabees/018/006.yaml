  text: 'Then indeed, having set out from Jerusalem, he encamped against the Persians. And the mother of the seven boys was saying these things also to each one of her children:'
translation:
  language: ru
  text: 'Тогда же, выйдя из Иерусалима, он расположился лагерем против персов. А мать семерых сыновей говорила каждому из своих детей также следующее:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τότε δὴ
  choice: Тогда
  rationale: Передаёт последовательность повествования; отдельное усилительное слово для δὴ по-русски сделало бы фразу тяжеловесной, тогда как контекстуальное выделение сохраняется естественным порядком слов.
- source_word: ὑπάρας ἀπὸ τῶν Ἱεροσολύμων
  choice: выйдя из Иерусалима
  rationale: Аористное причастие обозначает действие, предшествующее главному; «выйдя» естественно передаёт отправление из названного места без лишнего уточнения способа движения.
- source_word: ἐστρατοπέδευσεν ἐπὶ Πέρσας
  choice: расположился лагерем против персов
  rationale: Сохраняет военный смысл глагола и враждебную направленность ἐπί с винительным падежом.
- source_word: ἡ μήτηρ τῶν ἑπτὰ παίδων
  choice: мать семерых юношей
  rationale: παῖδες обозначает здесь семерых потомков мужского пола. «Юношей» естественно в данном повествовании и сохраняет отличие от последующего τέκνοις.
- source_word: Ἔλεγεν
  choice: говорила
  rationale: Несовершенный вид русского глагола передаёт длительный или повторяющийся характер имперфекта.
- source_word: καὶ ταῦτα
  choice: также
  rationale: Добавочное καί передано словом «также»; указательное ταῦτα содержательно раскрывается последующим двоеточием, поэтому буквальное «это также» по-русски менее естественно.
- source_word: ἑνὶ ἑκάστῳ τοῖς τέκνοις
  choice: каждому из своих детей
  rationale: Передаёт явную распределительность ἑνὶ ἑκάστῳ и родственное значение τέκνοις; притяжательное «своих» естественно выражает очевидное отношение к матери.
theological_decisions:
- issue: Различие семейных обозначений παῖδες и τέκνα
  choice: «юношей» для παῖδες и «детей» для τέκνοις
  alternative: «сыновей» в обоих случаях или «детей» в обоих случаях
  rationale: Разные русские слова сохраняют лексическое варьирование греческого текста. «Юноши» указывает на мужской пол упомянутых семерых, а «дети» передаёт более широкое и родственное τέκνα без конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык; повествовательный стиль с умеренной торжественностью. Имперфект передан несовершенным видом, а военная обстановка — ясным выражением «расположился лагерем против».
