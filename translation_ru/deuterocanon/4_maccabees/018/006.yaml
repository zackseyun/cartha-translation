  source_fidelity: Нужна небольшая правка. «Тогда» не передаёт усилительно-связочную частицу δή; «Тогда же» сохраняет её без тяжеловесного «действительно». В исходном варианте «также» неясно относится к demonstrativum ταῦτα и может читаться как характеристика действия «говорила». Формула «также следующее» ясно передаёт καὶ ταῦτα перед двоеточием.
  naturalness: «Расположился лагерем против персов» естественно и точно для военного контекста. «Мать семерых сыновей» в современном русском естественнее и точнее обозначает семейную связь, чем «мать семерых юношей», не приписывая при этом возрастной оттенок слова «юноши».
  terminology: Иерусалим и персы переданы нормативно. «Сыновья» для παίδων и «дети» для τέκνοις сохраняют различие греческих слов и соответствуют мужскому полу семерых в контексте, не стирая более общего родственного значения τέκνα.
