  yaml_path: translation/deuterocanon/4_maccabees/018/011.yaml
  text: And he recounted to us Abel[a], who was slain by Cain, and Isaac being offered up as a whole burnt offering, and Joseph in prison.
translation:
  language: ru
  text: Он читал нам об Авеле, убитом Каином, об Исааке, приносимом во всесожжение[a], и об Иосифе, находившемся в темнице.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «приносимом как всесожжение». Греческое слово использует жертвенный язык, отсылающий к Быт 22; Исаак, однако, не был в действительности принесён в жертву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεγίνωσκεν
  choice: читал нам
  rationale: Основное значение ἀναγινώσκω — «читать», в данном контексте, вероятно, читать вслух повествования Писания. Имперфект передан формой «читал», допускающей повторяющееся или продолжительное действие.
- source_word: τὸν ἀναιρεθέντα
  choice: убитом
  rationale: Причастие ἀναιρέω обозначает лишение жизни; «убитом» точно и естественно передаёт насильственную смерть Авеля без архаизации.
- source_word: ὁλοκαυτούμενον
  choice: приносимом во всесожжение
  rationale: Глагольная форма содержит специальную жертвенную лексику и вызывает в памяти Бытие 22. Такой перевод сохраняет образ всесожжения, но не утверждает, что Исаак действительно был сожжён.
- source_word: ἐν φυλακῇ
  choice: в темнице
  rationale: Оборот указывает на заключение Иосифа. «В темнице» — ясное и достойное литературное выражение, привычное для библейского повествования.
- source_word: Ἄβελ / Κάϊν / Ἰσαάκ / Ἰωσήφ
  choice: Авель / Каин / Исаак / Иосиф
  rationale: Использованы общепринятые русские библейские формы имён.
theological_decisions:
- issue: Жертвенная формулировка применительно к Исааку
  choice: приносимом во всесожжение
  alternative: приносимом в жертву; сжигаемом как всесожжение
  rationale: Выбранная формулировка сохраняет конкретную жертвенную семантику ὁλοκαυτούμενον и связь с Быт 22, не создавая ложного впечатления, будто Исаак был фактически заклан и сожжён.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. «Читал нам» следует наиболее прямому значению греческого глагола; «темница» сохраняет библейский регистр, оставаясь понятной современному читателю. Однородные обороты с «об» делают греческую конструкцию естественной по-русски.
