    reason: lexical_alternative
  - marker: b
    text: Греческий текст различает внутренние πάθη («страсти») и внешние πόνοι («боли», «страдания»).
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: зная
  rationale: Деепричастие сохраняет причастную связь с предшествующим контекстом и не устраняет возможный причинный оттенок.
- source_word: τῶν παθῶν
  choice: над страстями
  rationale: «Страсти» передают философско-этический смысл πάθη как внутренних побуждений и состояний, подвластных разуму, и отличают их от πόνων.
- source_word: δεσπότης ἐστίν
  choice: властвует
  rationale: Глагольная передача естественна по-русски и выражает господство и управляющую власть без неуместного титульного оттенка слова «Господь».
- source_word: ὁ εὐσεβὴς λογισμός
  choice: благочестивый разум
  rationale: 'Формулировка сохраняет оба компонента ключевого выражения книги: разум и его направленность благоговением перед Богом.'
- source_word: τῶν ἔνδοθεν
  choice: над внутренними
  rationale: 'Субстантивированное прилагательное оставлено несколько эллиптическим, как в греческом тексте: подразумеваются внутренние страсти или переживания.'
- source_word: τῶν ἔξωθεν πόνων
  choice: над страданиями, причиняемыми извне
  rationale: Передаёт внешний источник болезненных испытаний и сохраняет противопоставление внутреннего и внешнего.
theological_decisions:
- issue: Передача программного выражения ὁ εὐσεβὴς λογισμός
  choice: благочестивый разум
  alternative: богобоязненный разум; разум, исполненный благоговения перед Богом
  rationale: «Благочестивый разум» кратко и достойно передаёт религиозно-философское понятие, не сводя его ни к отвлечённому рационализму, ни к конфессионально специфической доктрине.
- issue: Характер власти разума над страстями и страданиями
  choice: властвует над
  alternative: господствует над; является господином
  rationale: Выражение сохраняет сильное утверждение δεσπότης о власти, но не уточняет сверх текста, означает ли она полное устранение чувств или способность не подчиняться им.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Эллипсис «над внутренними» сохранён ради близости к греческой антитезе, но внешний член раскрыт естественной русской конструкцией.
