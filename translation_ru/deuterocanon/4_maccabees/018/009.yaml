  yaml_path: translation/deuterocanon/4_maccabees/018/009.yaml
  text: But when these sons had reached adulthood[a], their father died. Blessed was that man, for after experiencing the life of having good children[b], he did not suffer the season of childlessness.
translation:
  language: ru
  text: 'Но когда они достигли совершеннолетия, их отец умер. Блажен был этот человек: ибо, познав счастье быть отцом достойных детей[a], он не испытал поры бездетности[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое εὐτεκνία означает благую участь человека, имеющего хороших детей; иногда оно также подчёркивает многочисленность потомства.
    reason: lexical_alternative
  - marker: b
    text: То есть отец умер прежде, чем ему пришлось пережить гибель сыновей и остаться без детей.
    reason: cross_reference
lexical_decisions:
- source_word: ἐνηλίκων γενομένων
  choice: когда они достигли совершеннолетия
  rationale: Генитивная абсолютная конструкция обозначает завершившийся переход к взрослому возрасту; по-русски естественно передать её придаточным времени.
- source_word: ἐτελεύτησεν
  choice: умер
  rationale: Глагол обозначает окончание жизни; прямое «умер» ясно и соответствует современному литературному русскому языку.
- source_word: μακάριος
  choice: блажен был
  rationale: «Блажен» сохраняет возвышенную нравственно-религиозную окраску и смысл завидной, благой участи.
- source_word: τὸν τῆς εὐτεκνίας βίον ἐπιστήσας
  choice: завершив жизнь, радуясь достойным детям
  rationale: Оборот связывает завершение отцовской жизни с благим состоянием человека, имеющего хороших детей. Такая передача учитывает прямое дополнение βίον при ἐπιστήσας и положительную оценку в εὐτεκνία, избегая неестественного буквального выражения «жизнь хорошедетности».
- source_word: οὐκ ὠδυνήθη
  choice: не испытал мук
  rationale: Глагол выражает не просто наличие неблагоприятного состояния, а переживание боли или страдания.
- source_word: τὸν τῆς ἀτεκνίας ... καιρόν
  choice: поры бездетности
  rationale: καιρός означает особую пору или период, а ἀτεκνία — состояние без детей; «пора» сохраняет качественный, а не только хронологический оттенок.
theological_decisions:
- issue: Причина блаженной участи отца в связи с последующей гибелью сыновей
  choice: Отец назван блаженным потому, что умер, ещё радуясь достойным детям, и не дожил до их гибели, после которой остался бы бездетным.
  alternative: Стих лишь противопоставляет жизнь человека, имеющего детей, бездетности вообще, не подразумевая последующей гибели сыновей.
  rationale: Контекст мученической смерти сыновей делает первое прочтение наиболее вероятным. В основном тексте сохранена краткость оригинала, а контекстуальный смысл пояснён в сноске без превращения его в явное дополнение к переводу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией. «Блажен был он» передаёт торжественный тон, тогда как остальная фраза остаётся понятной обычному читателю. Синтаксис слегка перестроен ради естественности русского языка, но временная последовательность и смысловое напряжение оригинала сохранены.
