lexical_decisions:
- source_word: τὸν ὑμνογράφον
  choice: создатель песнопений
  rationale: Слово буквально обозначает сочинителя священных песнопений. Такой перевод сохраняет образ греческого текста и ясно указывает на Давида; традиционное «псалмопевец» возможно, но несколько сильнее привязывает выражение к жанровому названию псалмов.
- source_word: ἐμελῴδει
  choice: пел
  rationale: Глагол обозначает пение или мелодическое исполнение; «пел» естественно и точно передаёт его в данном контексте.
- source_word: ἡμῖν
  choice: нам
  rationale: Дательный падеж обозначает слушателей, которым было обращено пение.
- source_word: Δαυεὶδ
  choice: Давид
  rationale: Общепринятая русская форма имени.
- source_word: Πολλαὶ αἱ θλίψεις
  choice: Много скорбей
  rationale: Естественная русская конструкция, сохраняющая множественность и возвышенный библейский регистр.
- source_word: τῶν δικαίων
  choice: у праведников
  rationale: Родительный множественного числа относится к праведным людям. Конструкция «скорби у праведников» естественно передаёт принадлежность или переживание, не превращая греческое множественное число в единственное.
theological_decisions:
- issue: Соотношение определения ὑμνογράφος и имени Давида
  choice: 'Определение отнесено к Давиду: «Давид, создатель песнопений»'
  alternative: «Псалмопевец Давид»
  rationale: Несмотря на сжатый и несколько неровный греческий синтаксис, по смыслу именно Давид назван сочинителем песнопений. Перевод не представляет «создателя песнопений» отдельным лицом и не делает его предметом песни.
- issue: Число в выражении τῶν δικαίων
  choice: 'Сохранено множественное число: «у праведников»'
  alternative: «у праведного» по традиционной русской форме Пс 33:20
  rationale: В данном тексте стоит форма множественного числа. Сохранение её не устраняет возможную вариативность цитирования и не подменяет исходный текст знакомой формой русского Псалтиря.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Создатель песнопений» понятно широкому читателю и сохраняет буквальный образ ὑμνογράφος; цитата передана лаконично, с сохранением множественного числа греческого текста.
