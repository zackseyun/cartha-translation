base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/005.yaml
  text: And the tyrant Antiochus has been punished also on earth[a], and is punished with eternal things; for he was utterly unable to compel the people of Jerusalem to adopt foreign ways and to abandon the customs of their fathers' nation,
translation:
  language: ru
  text: И тиран Антиох был наказан и на земле[a], и карается вечно; ибо он оказался совершенно бессилен заставить жителей Иерусалима перенять чужеземный образ жизни и отойти от образа жизни своего отеческого народа,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «карается вечными [наказаниями]». Буквально греческий текст имеет «карается вечными…»: прилагательное стоит без явно названного существительного. Возможен и перевод «карается вечно».'
    reason: Сохранение эллиптического выражения и его смысловой неоднозначности.
lexical_decisions:
- source_word: τύραννος
  choice: тиран
  rationale: Сохраняет нравственно отрицательную оценку правителя, выраженную греческим словом.
- source_word: τετιμώρηται
  choice: уже понёс наказание
  rationale: Передаёт результативность перфекта и сохраняет противопоставление земной кары продолжающемуся воздаянию.
- source_word: ἀϊδίων κολάζεται
  choice: карается вечными [муками]
  rationale: Прилагательное «вечными» в греческом тексте употреблено без явно названного существительного. Квадратные скобки показывают, что слово «муками» добавлено для связности русского текста, а примечание сохраняет неоднозначность эллипсиса.
- source_word: οὐδὲν οὐδαμῶς ἴσχυσεν
  choice: оказался совершенно бессилен
  rationale: Передаёт усиленное отрицание и полную неспособность Антиоха достичь своей цели.
- source_word: ἀναγκάσαι
  choice: заставить
  rationale: Естественно и точно выражает принуждение.
- source_word: τοὺς Ἱεροσολυμείτας
  choice: жителей Иерусалима
  rationale: Современное и ясное обозначение людей Иерусалима без стилистически тяжёлого «иерусалимлян».
- source_word: ἀλλοφυλῆσαι
  choice: перенять чужеземный образ жизни
  rationale: Передаёт культурно-религиозное уподобление иноплеменникам, а не физическое переселение или буквальную смену происхождения.
- source_word: τῶν πατρίων ἐθνῶν ἐκδιαιτηθῆναι
  choice: отречься от уклада своего отеческого народа
  rationale: «Уклад» передаёт относящееся к образу жизни значение ἐκδιαιτηθῆναι, а «отеческого народа» сохраняет необычную сжатость переданного чтения πατρίων ἐθνῶν, не сводя его только к отдельным обычаям.
theological_decisions:
- issue: Характер посмертного наказания Антиоха в выражении ἀϊδίων κολάζεται
  choice: Продолжающееся вечное воздаяние утверждается, но подразумеваемое существительное отмечено как добавленное.
  alternative: «карается вечно»; «подвергается вечным наказаниям»
  rationale: Греческий текст противопоставляет уже совершившееся земное наказание продолжающейся вечной каре, однако оставляет прилагательное ἀϊδίων без выраженного существительного. Перевод не определяет точный вид или механизм этой кары.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, повествовательно-богословским регистром. Сохранена завершающая запятая, поскольку стих представляет собой часть продолжающегося греческого предложения. Квадратные скобки в основном тексте явно отмечают добавленное ради русской грамматики слово; маркер [a] присутствует непосредственно после спорного выражения.
