  rationale: Убрано не имеющее прямой опоры «уже»; более точно передан отход от отеческого образа жизни вместо усиленного «отречься». Эллипсис ἀϊδίων передан естественным русским наречным вариантом, а альтернативное понимание с подразумеваемыми «наказаниями» сохранено в сноске. Запятая в конце сохранена, поскольку греческое предложение продолжается.
