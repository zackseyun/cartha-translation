    rationale: ἐκδιαιτηθῆναι обозначает отход или отстранение от образа жизни; «отречься» добавляет оттенок формального или сознательного отказа.
  - severity: low
    issue: Квадратные скобки вокруг «муками» перегружают основной текст.
    rationale: Добавленное существительное и эллипсис лучше разъяснить в сноске; нормативный русский основной текст должен оставаться плавным.
