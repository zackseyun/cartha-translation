  source_fidelity: 'Наречие «уже» не выражено в греческом тексте: перфект τετιμώρηται говорит о совершившемся наказании с сохраняющимся результатом, но не обязательно о «уже». Слово «отречься» чрезмерно усиливает ἐκδιαιτηθῆναι; нейтральнее передать отход от образа жизни. Эллипсис при ἀϊδίων следует отметить в примечании, не выдавая добавленное существительное за часть основного текста посредством квадратных скобок.'
  naturalness: «Карается вечными [муками]» с редакторскими квадратными скобками выглядит в современном литературном русском как техническая реконструкция, а не как связный перевод. «Карается вечно» естественно в основном тексте, а примечание честно сообщает, что греческая конструкция допускает также подразумеваемое существительное.
  terminology: «Тиран», «Антиох», «жители Иерусалима» и «чужеземный образ жизни» удачны. «Образ жизни своего отеческого народа» сохраняет этнически-национальную составляющую τῶν πατρίων ἐθνῶν и смысл ἐκδιαιτηθῆναι без более сильного, конфессионально окрашенного «отречься».
