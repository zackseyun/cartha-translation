  text: Ему слава во веки веков. Аминь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾧ
  choice: Ему
  rationale: Дательный падеж относительного местоимения вводит славословие и отсылает к ранее названному лицу. В русском краткая формула «Ему слава» естественнее буквального «которому слава» и сохраняет референцию.
- source_word: ἡ δόξα
  choice: слава
  rationale: Обычный русский богослужебный и библейский эквивалент δόξα; «честь» здесь слабее и менее соответствует формуле славословия.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устоявшийся, понятный современному читателю русский эквивалент греческой усилительной формулы неограниченной длительности; сохраняет образ «веков веков».
- source_word: ἀμήν
  choice: Аминь
  rationale: Традиционная литургическая транслитерация точно передаёт торжественную заключительную формулу.
theological_decisions:
- issue: Безглагольная формула славословия
  choice: Ему слава
  alternative: Ему да будет слава
  rationale: В греческом глагол отсутствует. Русская именная конструкция сохраняет эту лаконичность и не уточняет без необходимости, является ли формула пожеланием или утверждением принадлежности славы.
translation_notes:
  register: Краткая, торжественная и естественная для современного литературного русского языка доксологическая формула; традиционная библейская фразеология сохранена без архаизации.
