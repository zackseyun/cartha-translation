    rationale: Греческое ἐδίδασκεν с двумя аккузативными формами допускает по-русски восполнение «учил ... на примере», но слово «наставлял» плюс «примером» заметнее переводит фразу в нравоучительную формулу. «Учил вас на примере» сохраняет обычную русскую конструкцию и более близкую лексику.
  - severity: low
    issue: Пояснение «тех, кто был в огне» после имён тяжеловесно в основном тексте.
    rationale: 'Определение τοὺς ἐν πυρί в греческом стоит перед именами. Русский предлог «на примере тех, кто был в огне: Анании...» естественно отражает эту структуру; историческое уточнение о печи остаётся в сноске.'
