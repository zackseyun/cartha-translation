  text: And Phinehas the zealot was speaking to us[b][a], and Hananiah and Azariah and Mishael in the fire were teaching you.
translation:
  language: ru
  text: 'Он рассказывал нам о ревнителе Финеесе[a] и учил вас на примере тех, кто был в огне: Анании, Азарии и Мисаила[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о ревностном Финеесе». Греческое слово подчёркивает его выдающуюся ревность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тех, кто в огне, — Ананию, Азарию и Мисаила». Речь о трёх юношах, прошедших испытание в огненной печи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν ... ἡμῖν τὸν ζηλωτὴν Φινεές
  choice: Он рассказывал нам о ревнителе Финеесе
  rationale: Финеес стоит в винительном падеже и является содержанием рассказа, а не подлежащим глагола. Имперфект передан как продолжительное или повторявшееся «рассказывал»; подразумеваемое подлежащее «он» восстанавливается из контекста.
- source_word: ζηλωτὴν
  choice: ревнителе
  rationale: Существительное обозначает человека, отличающегося ревностью; «ревнитель» сохраняет библейскую окраску и не связывает Финееса с более поздней партией зелотов.
- source_word: Φινεές
  choice: Финеесе
  rationale: Использована традиционная русская библейская форма имени.
- source_word: ἐδίδασκεν ... ὑμᾶς
  choice: вас наставлял
  rationale: Имперфект сохраняет значение продолжавшегося или повторявшегося наставления; «наставлял» естественно звучит в нравственно-поучительном контексте.
- source_word: τοὺς ἐν πυρὶ Ἀνανίαν καὶ Ἀζαρίαν καὶ Μισαήλ
  choice: примером Анании, Азарии и Мисаила — тех, кто был в огне
  rationale: Имена в винительном падеже обозначают содержание наставления. Оборот «примером» естественно передает мысль о наставлении посредством рассказа об этих людях, а пояснение сохраняет греческое определение «тех, кто был в огне».
theological_decisions:
- issue: Риторическая роль Финееса и трех юношей
  choice: Отец наставлял слушателей, обращаясь к примерам Финееса и трех юношей.
  alternative: Можно понять имперфекты лишь как повествование о неоднократных речах в прошлом, без особого акцента на непреходящей силе примера.
  rationale: Перевод сохраняет названных героев как содержание отцовского наставления, не превращая их грамматически в говорящих или учащих субъектов и не добавляя отдельного учения об их посмертном действии.
translation_notes:
  register: Современный литературный русский язык с умеренной библейской торжественностью. Синтаксис проясняет, что Финеес и три юноши являются содержанием рассказа и наставления; союз «а» передает повторенное греческое δέ без излишне резкого противопоставления.
