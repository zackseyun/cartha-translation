  rationale: Исправление сохраняет правильное понимание греческих аккузативов как содержания рассказа и обучения, передаёт несовершенный вид глаголов русскими формами прошедшего времени и делает обе части фразы синтаксически параллельными. Добавление «на примере» — необходимое для естественного русского восполнение эллиптической конструкции, но без утверждения, что сами герои буквально говорят или учат адресатов.
