    reason: cross_reference
lexical_decisions:
- source_word: ὑπεμίμνησκεν
  choice: не раз напоминал
  rationale: Имперфект передаёт повторявшееся или продолжавшееся действие; выражение «не раз напоминал» естественно сохраняет эту силу по-русски.
- source_word: τὴν Ἡσαΐου γραφὴν
  choice: слова Писания у Исаии
  rationale: γραφή здесь обозначает священное Писание, а родительный Ἡσαΐου связывает цитату с Исаией. Формулировка звучит естественно и не добавляет отсутствующего в греческом тексте титула.
- source_word: τὴν λέγουσαν
  choice: где сказано
  rationale: Передаёт причастный оборот, вводящий цитату, ясной современной русской формулой.
- source_word: Κἂν
  choice: Даже если
  rationale: Слияние καὶ ἐάν в данном контексте имеет уступительно-условный оттенок, который точно передаётся словами «даже если».
- source_word: διὰ πυρὸς διέλθῃς
  choice: пройдёшь сквозь огонь
  rationale: Сохраняет образ прохождения через огонь и условный характер аориста сослагательного наклонения.
- source_word: φλὸξ
  choice: пламя
  rationale: Сохраняет отдельный от «огня» образ; в русском языке слово естественно употребляется здесь без неопределённого артикля.
- source_word: οὐ κατακαύσει σε
  choice: не сожжёт тебя
  rationale: κατακαίω означает сжигать или сжигать полностью; «не сожжёт тебя» ясно передаёт обещание защиты, не ослабляя глагол до простого прикосновения жара.
theological_decisions:
- issue: Передача цитаты из Исаии по сравнению с привычной формулировкой Ис 43:2
  choice: Перевести греческую цитату именно в той форме, в какой она дана в 4 Маккавейской книге.
  alternative: 'Согласовать её с традиционным русским текстом Ис 43:2, например: «пламя не опалит тебя».'
  rationale: Приоритет принадлежит греческому тексту 4 Маккавейской книги. Авторская форма цитаты не должна незаметно заменяться привычной формулировкой другого библейского текста.
- issue: Видовое значение ὑπεμίμνησκεν
  choice: Передать повторяемость словами «не раз напоминал».
  alternative: Употребить простое прошедшее «напоминал» без явного указания на повторяемость.
  rationale: Так сохраняется повествовательный акцент имперфекта на неоднократном или продолжительном напоминании без добавления нового содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка ясна широкому читателю; архаизмы и конфессионально закреплённые обороты не используются.
