  text: And he also glorified Daniel in the lions’ pit[a], whom he also called blessed.
translation:
  language: ru
  text: Он также прославлял Даниила, который находился во рву со львами[a], и также называл его блаженным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в львином рву». Буквально: «во рву львов».'
    reason: 'Лексическая альтернатива: «львиный ров» — традиционная библейская формулировка; греческое λάκκος буквально означает «ров», «яму» или «цистерну».'
lexical_decisions:
- source_word: ἐδόξαζεν
  choice: прославлял
  rationale: Несовершенный вид передаёт длительное или повторяющееся действие имперфекта. «Прославлял» сохраняет возвышенную силу δοξάζω применительно к Даниилу, не подменяя её более слабым «почитал».
- source_word: ἐν λάκκῳ λεόντων
  choice: во рву со львами
  rationale: λάκκος означает ров, яму или цистерну. Формулировка близка к буквальному «во рву львов», но яснее и естественнее по-русски; традиционный вариант «в львином рву» дан в сноске.
- source_word: ἐμακάριζεν
  choice: называл его блаженным
  rationale: μακαρίζω значит называть или считать кого-либо блаженным. Такой перевод сохраняет глагольную силу и не придаёт выражению специально-литургического смысла.
- source_word: καὶ ... καί
  choice: также ... и
  rationale: Первое καί передано словом «также», связывающим фразу с перечнем прежде названных праведников; второе естественно выражено союзом «и», без тяжеловесного повтора «также».
- source_word: ὃν
  choice: его
  rationale: Относительное местоимение относится к Даниилу. В русском сочинительная конструкция с «его» звучит естественнее буквального придаточного «которого…», сохраняя референцию.
theological_decisions:
- issue: Возвышенная похвала Даниилу
  choice: Сохранено «прославлял» как прямое и сильное обозначение почитания Даниила.
  alternative: «Почитал» или «восхвалял».
  rationale: Греческое δοξάζω допускает значения «прославлять», «воздавать честь», «хвалить». Хотя в религиозной речи «прославлять» часто относится к Богу, здесь человеческий объект назван прямо; ослаблять выражение лишь ради устранения возможного напряжения не следует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Необычное сочетание «прославлял Даниила» намеренно сохраняет риторическую силу оригинала; синтаксис сделан естественным для современного читателя.
