base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/018/007.yaml
  text: For I remained a pure virgin[a], and I did not go beyond my father's house; rather[b], I guarded the rib that had been built.
translation:
  language: ru
  text: Ибо я была непорочной девой и не выходила за пределы отцовского дома[a], но хранила созданное ребро[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не преступала границ отцовского дома». Греческое выражение может подразумевать как буквальное пребывание в доме отца, так и нравственное соблюдение установленных границ.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «созданный бок». По-видимому, эти слова отсылают к рассказу о создании женщины из бока (ребра) Адама в книге Бытие; здесь этот образ, вероятно, говорит о сохраненном целомудрии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενήθην
  choice: я была
  rationale: Буквально глагол может означать «стала» или «оказалась», однако здесь речь идет о состоянии, сохранявшемся до брака. Русское «была» естественно передает смысл, не создавая ложного впечатления, будто девственность была приобретена позднее.
- source_word: παρθένος ἁγνή
  choice: непорочной девой
  rationale: παρθένος означает деву, а ἁγνή в данном контексте — нравственную и половую чистоту. «Непорочная дева» передает оба компонента и сохраняет возвышенный, но понятный регистр.
- source_word: οὐχ ὑπερέβην πατρικὸν οἶκον
  choice: не выходила за пределы отцовского дома
  rationale: ὑπερέβην буквально выражает переход за некоторую границу. Формулировка сохраняет как пространственный образ пребывания в отцовском доме, так и возможный нравственный смысл — не преступать установленных в нем границ.
- source_word: ἐφύλασσον
  choice: хранила
  rationale: Имперфект указывает на продолжительное действие. «Хранила» естественно сочетается с образом соблюденной чистоты и не делает метафору излишне воинственной.
- source_word: τὴν ᾠκοδομημένην πλευράν
  choice: созданное ребро
  rationale: πλευρά может означать «бок» или «ребро», а ᾠκοδομημένην — буквально «построенное, устроенное». Выбор «ребро» удерживает вероятную отсылку к созданию женщины в Бытии; «созданное» передает ее по-русски без чрезмерно буквального и неестественного «построенного ребра».
theological_decisions:
- issue: Отсылка к созданию женщины в выражении «созданное ребро»
  choice: Сохранить образ в основном тексте, не заменяя его прямым пояснением о целомудрии.
  alternative: Передать как «хранила свое целомудрие» или выбрать значение «созданный бок».
  rationale: Греческий текст намеренно использует необычный образ с лексикой Бытия. Его сохранение уважает литературную многозначность и не превращает вероятный намек в однозначную богословскую или сексуальную формулировку.
- issue: Смысл слов о непреступлении отцовского дома
  choice: Передать выражение через «не выходила за пределы», сохранив пространственный образ и нравственный оттенок.
  alternative: Однозначно перевести либо «не покидала отцовского дома», либо «не нарушала правил отцовского дома».
  rationale: Греческая формулировка допускает и буквальное пребывание в доме отца, и образ нравственного самоограничения; перевод не должен устранять эту напряженную двусмысленность.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим речи матери-мученицы. Необычная метафора оригинала сохранена, а ее вероятный смысл разъяснен только в сноске.
