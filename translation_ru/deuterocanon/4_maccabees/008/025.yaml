lexical_decisions:
- source_word: οὐδὲ
  choice: Даже … не
  rationale: Передаёт усилительное отрицание «и даже не / даже не» естественной русской конструкцией.
- source_word: αὐτὸς
  choice: сам
  rationale: Сохраняет усилительное значение при существительном «закон».
- source_word: ὁ νόμος
  choice: закон
  rationale: Прямое соответствие греческому слову; строчная буква оправдана тем, что предоставленный фрагмент сам по себе не требует титульного написания.
- source_word: ἑκουσίως
  choice: добровольно
  rationale: Передаёт значение «по доброй воле, добровольно»; из-за неполноты синтаксиса точная связь наречия остаётся неясной.
- source_word: ἡμᾶς
  choice: нас
  rationale: Прямое соответствие винительному падежу местоимения первого лица множественного числа.
