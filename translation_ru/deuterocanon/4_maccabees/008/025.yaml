  choice: Сохранить засвидетельствованные элементы, а подразумеваемый глагол дать в квадратных скобках
  alternative: «Даже сам закон добровольно нас…» без восполнения либо реконструкция «Даже сам закон не принуждает нас против воли»
  rationale: Греческая последовательность οὐδὲ αὐτὸς ὁ νόμος ἑκουσίως ἡμᾶς не образует законченного предложения. Скобки честно обозначают редакционное восполнение, не выдавая реконструкцию за засвидетельствованный текст; необычная связь слова «добровольно» сохранена, а не истолкована молча.
