  yaml_path: translation/deuterocanon/4_maccabees/008/002.yaml
  text: Then[a], becoming deeply agitated, he ordered that others from among the Hebrews of that age be brought in; and if they would eat meat from the thigh, to release those who were brought in, but if they objected[c][b], to torture them more severely.
translation:
  language: ru
  text: Тогда, придя в сильное волнение, он велел привести других евреев того же возраста[a] и, если они станут есть мясо с бедра[b], отпустить приведённых[c], а если будут возражать — подвергнуть их ещё более жестоким пыткам[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «других из возрастной группы евреев»; вероятно, имеются в виду другие евреи того же возраста.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово буквально означает «есть бедро» или «есть мясо с бедра». По контексту его иногда понимают как указание на свинину.
    reason: lexical_alternative
  - marker: c
    text: Греческая форма буквально означает «ведущих» и в данном месте синтаксически затруднительна; по смыслу, вероятно, имеются в виду те, кого привели.
    reason: textual_difficulty
  - marker: d
    text: 'Буквально: «истязать ещё горше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σφόδρα περιπαθὼς
  choice: придя в сильное волнение
  rationale: Оборот передаёт сильную эмоциональную взволнованность, не сужая значение до гнева или скорби.
- source_word: ἄλλους ἐκ τῆς ἡλικίας τῶν Ἑβραίων
  choice: других евреев того же возраста
  rationale: ἡλικία прямо указывает на возраст или возрастную группу; по контексту речь идёт о сверстниках прежде упомянутых юношей.
- source_word: μηροφαγοῖεν
  choice: станут есть мясо с бедра
  rationale: Передано значение сложного слова, образованного от μηρός («бедро») и корня со значением «есть», без контекстуальной подмены конкретным видом мяса.
- source_word: ἀπολύειν ἀγώντας
  choice: отпустить приведённых
  rationale: Форма ἀγώντας буквально активна и синтаксически затруднительна, однако повествовательный ход указывает на доставленных к царю людей; неоднозначность отмечена в сноске.
- source_word: ἀντιλέγοιεν
  choice: будут возражать
  rationale: Глагол означает «говорить против, возражать»; отказ подразумевается, но не подставляется вместо буквального оттенка.
- source_word: πικρότερον βασανίζειν
  choice: подвергнуть их ещё более жестоким пыткам
  rationale: В контексте пыток сравнительное наречие πικρότερον («горше») естественно выражает усиление жестокости, а βασανίζειν обозначает физическое истязание.
theological_decisions:
- issue: Характер эмоционального состояния правителя
  choice: сильное волнение без уточнения конкретной эмоции
  alternative: ярость или глубокая скорбь
  rationale: περιπαθών указывает на сильную охваченность чувством, но само по себе не требует понимать это чувство исключительно как гнев.
- issue: Предмет запрещённой пищи
  choice: мясо с бедра
  alternative: свинина
  rationale: Контекст может наводить на мысль о свинине, однако форма μηροφαγοῖεν непосредственно содержит указание на бедро; перевод сохраняет свидетельство данного греческого текста.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом и сдержанно высоким регистром. Необычные и неоднозначные элементы греческого текста не сглажены молча, а отражены в переводе и сносках.
