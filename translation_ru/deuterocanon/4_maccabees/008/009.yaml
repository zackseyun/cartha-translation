base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/009.yaml
  text: And after changing your way of life[a], enjoy your youth. But if by your disobedience you provoke me to anger, you will force me, through dreadful punishments, to destroy each one of you by tortures.
translation:
  language: ru
  text: И, изменив образ жизни, наслаждайтесь своей молодостью. Ведь если своим неповиновением вы приведёте меня в ярость[a], то вынудите меня погубить каждого из вас страшными карами и пытками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее возможно: «если своим неповиновением вы будете обращаться со мной гневно». Греческий оборот труден; в основном тексте передан наиболее вероятный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταδιαιτηθέντες
  choice: изменив образ жизни
  rationale: Причастие от μεταδιαιτάω обозначает переход к иному образу жизни или режиму. Русская формулировка передаёт требование изменить поведение, не добавляя отсутствующего в греческом понятия покаяния.
- source_word: ἐντρυφήσατε
  choice: наслаждайтесь
  rationale: Императив выражает призыв получать удовольствие, наслаждаться; в сочетании с молодостью это естественно передаётся без добавочного нравственного оттенка распущенности.
- source_word: ταῖς νεότησιν ὑμῶν
  choice: своей молодостью
  rationale: Греческое множественное число естественно обозначает пору молодых лет; единственное число в русском является идиоматическим.
- source_word: ἐπεὶ
  choice: ведь
  rationale: Союз вводит основание для предшествующего призыва и здесь лучше передаётся причинно-пояснительным «ведь», а не противительным «но».
- source_word: ὀργίλως με διαθῆσθε
  choice: вы приведёте меня в ярость
  rationale: Сочетание буквально трудно и допускает понимание того, что неповиновение сделает говорящего гневно настроенным. Выбранная формулировка естественно передаёт вероятный каузативный смысл.
- source_word: ἀπειθείας
  choice: неповиновением
  rationale: ἀπείθεια означает непослушание или отказ повиноваться; «неповиновение» прямо подходит к угрозе правителя.
- source_word: δειναῖς κολάσεσιν
  choice: страшными карами
  rationale: κολάσεις — наказания или кары, а δειναῖς подчёркивает их ужас и суровость.
- source_word: βασάνων
  choice: пытками
  rationale: В контексте судебного принуждения и казни βάσανος обозначает пытку или мучение; «пытками» сохраняет конкретную жестокость угрозы.
- source_word: ἀπολέσαι
  choice: погубить
  rationale: ἀπόλλυμι может означать уничтожить или предать смерти. «Погубить» сохраняет оттенок уничтожения и ясно подразумевает смерть в данном контексте.
- source_word: ἕνα ἕκαστον ὑμῶν
  choice: каждого из вас
  rationale: Формула подчёркивает, что угроза относится к каждому по отдельности; русское «каждого из вас» передаёт это распределительное значение.
theological_decisions:
- issue: Толкование трудного оборота ἐὰν ὀργίλως με διαθῆσθε
  choice: если своим неповиновением вы приведёте меня в ярость
  alternative: если из-за своего неповиновения вы будете обращаться со мной гневно
  rationale: Последующая угроза о вынужденном наказании поддерживает смысл, при котором неповиновение юношей вызывает ярость правителя. Однако грамматически возможное более буквальное понимание сохранено в примечании, чтобы не устранять подлинную неоднозначность.
- issue: Связь ἐπεὶ с предшествующим призывом
  choice: ведь
  alternative: но
  rationale: Обычное причинное значение ἐπεὶ объясняет призыв изменить образ жизни угрозой последствий неповиновения. Противительное значение контекстуально возможно как смысловой переход, но не выражено союзом столь прямо.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим речи правителя-тирана. Формулировки ясны широкому читателю; угроза передана резко, но без архаизмов. Маркер примечания поставлен непосредственно после спорного греческого оборота, к которому оно относится.
