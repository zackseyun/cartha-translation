review_pass:
  verdict: revise
  source_fidelity: В целом переданы и увещевание, и обещание властных должностей, и условие отказа от отеческого установления. Однако «послушайтесь» без дополнения звучит по-русски несколько обрывочно и сильнее сводит πιστεύσατε к повелению подчиниться. В данном контексте естественнее «согласитесь», при сноске, сохраняющей значение доверия/веры. «Установление вашего образа жизни» точнее и менее пояснительно, чем оборот с «определяющего».
  naturalness: Исправленный текст сохраняет торжественно-публичный регистр, но устраняет синтаксическую шероховатость абсолютного «послушайтесь» и перегруженность определения к «установлению».
  terminology: «Руководящие должности» адекватно передаёт ἀρχὰς ... ἡγεμονικάς без навязывания конкретного титула. «Унаследованное от предков установление вашего образа жизни» передаёт πάτριον ... τῆς πολιτείας θεσμόν, не сужая πολιτεία до исключительно государственного строя или исключительно религиозного закона.
  issues:
  - severity: low
    issue: «Послушайтесь» в качестве абсолютного императива
    rationale: πιστεύσατε допускает «поверьте/доверьтесь», а контекстуально — согласие с требованием. Русское «послушайтесь» обычно требует указания, кого или чего следует слушаться; «согласитесь» естественнее и сохраняет контекстуальный смысл без чрезмерного сужения.
  - severity: low
    issue: Избыточное пояснение «определяющего ваш образ жизни»
    rationale: Греческий генитив τῆς πολιτείας относится к θεσμόν. Формулировка «установление вашего образа жизни» передаёт эту связь непосредственно, тогда как «определяющего» добавляет интерпретирующее объяснение.
  revised_text: Итак, согласитесь[a], и вы получите руководящие должности в управлении моими делами, отрёкшись от унаследованного от предков установления вашего образа жизни.
