  yaml_path: translation/deuterocanon/4_maccabees/008/007.yaml
  text: So comply, and you will receive ruling offices over my affairs, if you renounce the ancestral ordinance of your way of life.
translation:
  language: ru
  text: Итак, согласитесь[a], и вы получите руководящие должности в управлении моими делами, отрёкшись от унаследованного от предков установления вашего образа жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поверьте мне», «доверьтесь мне»; греческий глагол может обозначать веру или доверие, а в данном контексте — согласие с требованием говорящего.'
    reason: Сохраняет лексическую неоднозначность πιστεύσατε, тогда как контекстуальный перевод «согласитесь» передаёт его прагматическую функцию в речи правителя.
lexical_decisions:
- source_word: πιστεύσατε
  choice: послушайтесь
  rationale: В данном увещевании глагол означает не отвлечённую веру, а принятие предложения говорящего и согласие поступить по его требованию. Буквальное значение отмечено в сноске, чтобы сохранить смысловой оттенок доверия.
- source_word: ἀρχὰς … ἡγεμονικὰς
  choice: руководящие должности
  rationale: Сочетание обозначает властные, начальственные посты; этот перевод естественен по-русски и не сужает смысл до конкретного государственного титула.
- source_word: ἐπὶ τῶν ἐμῶν πραγμάτων
  choice: в управлении моими делами
  rationale: 'Передаёт сферу, над которой обещается власть: дела и владения говорящего, а не просто личные обстоятельства.'
- source_word: τὸν πάτριον ὑμῶν τῆς πολιτείας θεσμόν
  choice: унаследованное вами от предков установление, определяющее ваш образ жизни
  rationale: πάτριος указывает на предков, θεσμός — на установленный обычай или норму, а πολιτεία здесь охватывает уклад и образ жизни общины.
