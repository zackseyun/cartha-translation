base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/026.yaml
  text: Why has such contentiousness been instilled in us[a], and why does deadly endurance please us, when it is possible to live in tranquility by obeying the king, after becoming afraid of the tortures that lead to death?
translation:
  language: ru
  text: Он предаёт смерти тех, кто боится пыток. Откуда в нас укоренилась такая тяга к спору и почему нам по душе гибельная стойкость, когда можно жить спокойно, подчинившись царю?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόθεν
  choice: Откуда
  rationale: Сохраняет образ вопроса об источнике или причине внутреннего настроя и естественно вводит риторический вопрос.
- source_word: ἡ τοσαύτη ἐντέτηκεν φιλονεικία
  choice: в нас взялось такое упрямство
  rationale: φιλονεικία в речи царя отрицательно характеризует непреклонность братьев как склонность упорствовать и противиться; ἐντέτηκεν указывает на глубоко проникшее внутреннее свойство. Русское выражение передаёт смысл естественно, не превращая его в положительную добродетель.
- source_word: ἡ θανατηφόρος ... καρτερία
  choice: гибельная стойкость
  rationale: καρτερία означает стойкость или выносливость, а θανατηφόρος — несущая смерть, губительная. «Гибельная стойкость» сохраняет враждебную оценку говорящего и неоднозначность между стойкостью, ведущей к смерти, и смертоносной стойкостью.
- source_word: ἀρέσκει
  choice: нам по душе
  rationale: Передаёт значение «нравится, привлекает» в естественной современной русской речи, сохраняя личную направленность высказывания.
- source_word: παρὸν
  choice: если можно
  rationale: Выражает доступную возможность и ясно передаёт подразумеваемое условное противопоставление.
- source_word: μετὰ ἀταραξίας ζῆν
  choice: жить спокойно
  rationale: ἀταραξία обозначает невозмутимость и отсутствие тревог или беспокойства; «жить спокойно» понятно современному читателю и не сужает смысл до политического мира.
- source_word: τῷ βασιλεῖ πεισθέντας
  choice: покорившись царю
  rationale: πεισθέντας при обозначении правителя допускает смысл послушания или уступки его воле. «Покорившись» соответствует принуждающему контексту и сохраняет оттенок капитуляции перед царским требованием.
- source_word: θανατοῖ φοβηθέντας τὰ βασανιστήρια
  choice: из страха перед пытками, ведущими к смерти
  rationale: 'Греческая фраза в данном свидетельстве синтаксически затруднительна. Перевод осторожно передаёт общий смысл: спокойная жизнь доступна тем, кто из страха перед связанными со смертью пытками уступит царю.'
theological_decisions:
- issue: Оценка стойкости братьев в речи царя
  choice: 'Сохранить отрицательную риторику: «упрямство», «гибельная стойкость».'
  alternative: 'Передать положительно: «ревность», «мужество» или «стойкость до смерти».'
  rationale: Здесь говорит царь, пытающийся пристыдить братьев и склонить их к повиновению. Перевод не должен подменять его враждебную оценку более широкой авторской похвалой мученической стойкости.
translation_notes:
  register: Современный литературный русский язык; речь звучит достойно и понятно, но сохраняет язвительную, увещевающую интонацию царя. Синтаксическая трудность греческого начала не скрыта, а отмечена сноской.
