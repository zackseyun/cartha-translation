revisions:
- from: Откуда в нас взялось такое упрямство и почему нам по душе гибельная стойкость, если можно жить спокойно, покорившись царю из страха перед пытками, ведущими к смерти?[a]
  to: Он предаёт смерти тех, кто боится пыток. Откуда в нас укоренилась такая тяга к спору и почему нам по душе гибельная стойкость, когда можно жить спокойно, подчинившись царю?
  rationale: 'Полностью восстановлено начальное предложение источника. Основной вопрос переведён с сохранением отрицательной, полемической оценки в устах царя: «тяга к спору» для φιλονεικία и «гибельная стойкость» для θανατηφόρος καρτερία. «Когда можно» передаёт доступную возможность, выраженную παρόν, а деепричастие «подчинившись» — зависимое πεισθέντας. Сноска удалена, поскольку после восстановления пропущенной фразы не остаётся такой текстовой проблемы, которую необходимо специально оговаривать.'
