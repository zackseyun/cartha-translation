  text: So when the tyrant stopped urging them to eat defiling food[a], they all together, with one voice, as if from the same soul, said[b],
translation:
  language: ru
  text: 'И как только тиран перестал уговаривать их есть пищу, от которой они осквернятся[a], все они разом, в один голос, словно из одной души, сказали[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «есть нечистую пищу» или «есть оскверняющую пищу». Греческий глагол означает есть пищу, употребление которой влечёт религиозное осквернение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «словно из той же самой души» — образ полного единства их воли и решимости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: И
  rationale: Связывает наступившее действие с предшествующей сценой как её результат; в русском повествовании союз «и» естественно передаёт этот переход, не утяжеляя фразу.
- source_word: ἅμα τῷ παύσασθαι
  choice: как только … перестал
  rationale: Конструкция обозначает непосредственную временную связь; «как только» передаёт её естественно и ясно.
- source_word: τὸν τύραννον
  choice: тиран
  rationale: Сохраняет явно отрицательную нравственно-политическую окраску греческого слова, в отличие от нейтрального «правитель».
- source_word: συμβουλεύοντα αὐτοῖς
  choice: уговаривать их
  rationale: В данном контексте речь идёт не о нейтральном совете, а о настойчивом склонении к поступку; «уговаривать» передаёт это без чрезмерного усиления до прямого принуждения.
- source_word: μιεροφαγῆσαι
  choice: есть пищу, которая оскверняет
  rationale: Редкий глагол указывает на вкушение пищи, влекущее религиозное осквернение. Описательный перевод ясен современному читателю и не сужает значение до какого-либо одного вида запрещённой пищи.
- source_word: πάντες … ὁμοῦ
  choice: все они разом
  rationale: Передаёт полноту группы и одновременность их ответа.
- source_word: διὰ μιᾶς φωνῆς
  choice: в один голос
  rationale: Естественный русский эквивалент образного выражения о единодушной речи.
- source_word: ὥσπερ ἀπὸ τῆς αὐτῆς ψυχῆς
  choice: словно из одной души
  rationale: Сохраняет необычный образ единого внутреннего источника их общей решимости и не сводит ψυχή только к разуму или мнению.
- source_word: εἶπον
  choice: сказали
  rationale: Простой глагол речи, вводящий прямую речь следующего стиха.
theological_decisions:
- issue: Культовое значение μιεροφαγῆσαι
  choice: есть пищу, которая оскверняет
  alternative: есть нечистую пищу; есть осквернённую пищу
  rationale: Выбранный вариант ясно показывает последствие вкушения — религиозное осквернение, — не утверждая сверх текста, что пища названа «нечистой» как формальная категория или уже была осквернена.
- issue: Антропологический образ ψυχή
  choice: словно из одной души
  alternative: словно у них была одна душа; словно единым духом
  rationale: Буквальный образ сохранён как указание на глубокое единство внутренней решимости; перевод не подменяет «душу» более узким понятием «мысль».
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. «Тиран» сохраняет резкую оценочность оригинала; «разом, в один голос» передаёт одновременно и совместность ответа, и единство речи. Двоеточие уместно, поскольку глагол вводит прямую речь следующего стиха.
