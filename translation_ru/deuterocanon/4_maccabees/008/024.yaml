lexical_decisions:
- source_word: γλυκέος κόσμου
  choice: сладостного мира
  rationale: Родительный падеж сохранён, поскольку начало стиха продолжает предыдущее предложение. «Сладостного» передаёт образ привлекательности нынешнего мира, не сводя его к одной лишь приятности или привязанности.
- source_word: μὴ βιαζώμεθα τὴν ἀνάγκην
  choice: не станем торопить неизбежное
  rationale: Сжатое греческое выражение буквально говорит о насильственном воздействии на «необходимость». В данном контексте естественное русское выражение передаёт мысль о том, чтобы не приближать неизбежное испытание, а сноска сохраняет другие возможные понимания.
- source_word: μηδὲ κενοδοξήσωμεν
  choice: и тщеславиться
  rationale: Глагол обозначает пустую славу или тщеславное превозношение; «тщеславиться» сохраняет отрицательную оценку, содержащуюся в самом греческом слове.
- source_word: ἐπὶ τῇ ἑαυτῶν στρέβλῃ
  choice: собственной дыбой
  rationale: στρέβλη обозначает орудие пытки, в частности дыбу. «Собственной» сохраняет возвратное ἑαυτῶν, а связь с глаголом естественно передана русским творительным падежом.
theological_decisions:
- issue: Смысл призыва μὴ βιαζώμεθα τὴν ἀνάγκην
  choice: Не приближать по собственной воле неизбежное испытание
  alternative: Не противиться необходимости; не нарушать того, чего требует необходимость
  rationale: Фраза намеренно сжата и допускает несколько оттенков. Контекст мученичества и последующее предостережение против тщеславия поддерживают смысл «не торопить неизбежное», однако альтернативы приведены в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной лексикой. Начальный родительный оборот намеренно оставлен синтаксически зависимым от предыдущего стиха. «Дыба» конкретна и исторически узнаваема; «тщеславиться» передаёт компонент пустой славы без конфессиональной окраски.
