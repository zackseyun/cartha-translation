base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/017.yaml
  text: Alas for us! How miserable and utterly foolish we are! When the king urges us and calls us to receive a benefit[a], should we not be persuaded by him?
translation:
  language: ru
  text: Горе нам! Как мы несчастны и до крайности безрассудны! Царь убеждает нас и призывает нас, обещая благодеяние, — неужели мы не позволим ему убедить нас[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неужели нам не послушаться его?» Греческое πεισθείημεν может означать «быть убеждёнными», а также, в расширенном смысле, «уступить» или «послушаться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ τάλανες ἡμεῖς
  choice: Горе нам! Как же мы несчастны
  rationale: Оборот выражает эмоциональное сетование о собственном жалком положении. Такая передача сохраняет восклицательную силу греческого выражения и естественно звучит по-русски.
- source_word: λίαν ἀνόητοι
  choice: до крайности неразумны
  rationale: λίαν усиливает ἀνόητοι; выражение «до крайности» передаёт высокую степень, а «неразумны» сохраняет смысл недостатка рассудительности без разговорной окраски.
- source_word: βασιλέως
  choice: царь
  rationale: Речь идёт о конкретном царе, известном из контекста. В русском языке определённость не требует отдельного артикля.
- source_word: παρακαλοῦντος
  choice: убеждает нас
  rationale: В данном контексте παρακαλέω обозначает настойчивое увещевание, цель которого — склонить адресатов к согласию.
- source_word: ἐπὶ εὐεργεσίᾳ φωνοῦντος
  choice: зовёт получить благодеяние
  rationale: Фраза указывает на призыв, связанный с предлагаемым благодеянием или выгодой. Перевод передаёт это подразумеваемое предложение без внесения конфессиональной терминологии.
- source_word: μὴ πεισθείημεν αὐτῷ;
  choice: неужели мы не дадим ему убедить нас?
  rationale: Формулировка сохраняет первичный смысл пассивной формы πείθομαι — «быть убеждённым», а риторическое «неужели» передаёт ожидаемый положительный ответ. Возможное значение уступки или повиновения отмечено в сноске.
theological_decisions:
- issue: 'Смысл πεισθείημεν: убеждение или повиновение'
  choice: В основном тексте сохранён смысл «дать себя убедить».
  alternative: «Неужели нам не послушаться его?»
  rationale: Контекст прямо описывает попытку царя убедить посредством обещанного благодеяния, поэтому значение убеждения первично; однако глагол может также подразумевать уступку и повиновение, что отражено в сноске.
translation_notes:
  register: Современный литературный русский язык с выраженной риторической эмоциональностью. Сохранены сетование, усиленная самооценка и вопросительная форма исходного текста; архаичные и узкоконфессиональные обороты не используются.
