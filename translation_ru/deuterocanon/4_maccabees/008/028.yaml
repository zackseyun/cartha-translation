  text: For they were contemptuous of sufferings[b][a], and masters of pains.
translation:
  language: ru
  text: Ибо они презирали страдания[a] и властвовали над болью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смотрели на страдания свысока». Греческое слово выражает презрительное отношение, а не просто способность терпеть.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «были властителями боли»; то есть держали боль под своей властью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περίφρονες
  choice: презирали
  rationale: 'Передаёт сильный смысл: они смотрели на страдания свысока, а не просто оставались к ним равнодушны.'
- source_word: τῶν παθῶν
  choice: страдания
  rationale: В контексте мученичества речь идёт о переносимых страданиях, а не о внутренних страстях.
- source_word: αὐτοκράτορες
  choice: властвовали над
  rationale: Сохраняет заложенную в слове идею власти над чем-либо и самообладания, оставаясь естественным для современного русского языка.
- source_word: τῶν ἀλγηδόνων
  choice: болью
  rationale: Обозначает прежде всего телесную боль; единственное число естественно выражает собирательное значение греческого множественного.
theological_decisions:
- issue: Отношение мучеников к телесному страданию
  choice: Стих утверждает, что они презирали страдания и властвовали над болью.
  alternative: Истолковать строку как прямое учение о бесстрастии или как развёрнутое утверждение о победе разума над страстями.
  rationale: Греческий текст краток и описателен; перевод не добавляет философской или конфессиональной системы, которой эта строка прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем. Параллелизм двух частей сохранён; «властвовали над болью» передаёт образ господства без излишне буквального и неестественного «были самодержцами болей».
