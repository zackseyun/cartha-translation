  source_fidelity: '«Ибо они презирали страдания[a] и властвовали над болью[b]» точно передаёт оба параллельных греческих определения: περίφρονες τῶν παθῶν — презрительное отношение к страданиям, и αὐτοκράτορες τῶν ἀλγηδόνων — господство/самообладание по отношению к боли. Собирательное единственное число «болью» в русском естественно и не ослабляет значения греческого множественного.'
  naturalness: Фраза краткая, ясная и соответствует современному литературному русскому, сохраняя торжественный параллелизм оригинала. «Властвовали над болью» несколько образно, но уместно и понятно в данном контексте.
