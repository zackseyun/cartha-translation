  yaml_path: translation/deuterocanon/4_maccabees/008/014.yaml
  text: But the tyrant interrupted and said[a], “Young men, be afraid, and the justice you revere will be merciful to you if, under compulsion, you break the law.”
translation:
  language: ru
  text: 'Но тиран перебил их и сказал: «Юноши, побойтесь! И правосудие[a], которое вы чтите, будет благосклонно к вам, если вы нарушите закон по принуждению».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суд» или «кара». Греческое δίκη может означать правосудие, суд или кару.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπολαβών
  choice: перебив их
  rationale: В повествовательном диалоге слово может означать, что говорящий подхватывает речь или вмешивается в неё. «Перебив их» естественно передаёт вмешательство тирана после слов братьев.
- source_word: τύραννος
  choice: тиран
  rationale: Сохраняет отрицательную нравственную оценку греческого обозначения правителя.
- source_word: Μειράκια
  choice: юноши
  rationale: Передаёт обращение к молодым людям без чрезмерно детского оттенка слова «мальчики».
- source_word: φοβήθητε
  choice: побойтесь
  rationale: Прямой повелительный призыв; в данном обращении по-русски звучит естественнее, чем буквальное «бойтесь» без объекта.
- source_word: δίκην
  choice: правосудие
  rationale: В сочетании с «которое вы чтите» вероятнее обозначает почитаемый нравственный или божественный порядок суда и справедливости, а не только наказание. Слово сохраняет также судебный оттенок δίκη.
- source_word: σέβεσθε
  choice: вы чтите
  rationale: Передаёт благоговейное уважение, не усиливая значение до формального поклонения.
- source_word: ἵλεως
  choice: милостиво
  rationale: Передаёт благосклонное, снисходительное отношение; наречная конструкция с «будет» естественна в русском.
- source_word: διʼ ἀνάγκην
  choice: по принуждению
  rationale: Ясно выражает внешнее давление как предполагаемое смягчающее обстоятельство.
- source_word: παρανομήσασιν
  choice: если вы нарушите закон
  rationale: Условная личная конструкция естественно передаёт обстоятельственное причастие и сохраняет правовой и нравственный смысл.
theological_decisions:
- issue: Значение δίκη в нравственно-религиозном доводе тирана
  choice: правосудие, которое вы чтите
  alternative: кара/суд, которых вы страшитесь
  rationale: Глагол σέβεσθε указывает скорее на почитание, чем на страх перед наказанием. При этом «правосудие» сохраняет связь как со справедливостью, так и с судом, не определяя точнее, является ли оно отвлечённым нравственным порядком или Божьим судом.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Реплика тирана звучит настойчиво и естественно; неоднозначность δίκη отмечена в сноске.
