  yaml_path: translation/deuterocanon/4_maccabees/008/012.yaml
  text: And as he said these things[a], he ordered the instruments of torture to be brought forward, so that even through fear he might persuade them to eat defiled food.
translation:
  language: ru
  text: Говоря это, он велел выставить перед ними орудия пыток, чтобы даже страхом склонить их есть осквернённую пищу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «есть нечистую пищу». Греческий глагол означает есть то, что оскверняет или считается ритуально нечистым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα δὲ λέγων
  choice: Говоря это
  rationale: Деепричастный оборот естественно передаёт одновременность причастного оборота с основным действием.
- source_word: ἐκέλευσεν
  choice: он велел
  rationale: Передаёт распоряжение властного лица ясно, современно и без излишней архаичности.
- source_word: εἰς τὸ ἔμπροσθεν προτεθῆναι
  choice: выставить перед ними
  rationale: Сочетание передаёт как размещение впереди, так и намеренный показ орудий узникам; «ними» восполняет очевидный из контекста объект показа.
- source_word: τὰ βασανιστήρια
  choice: орудия пыток
  rationale: Существительное здесь уместно понимать как материальные средства пытки, которые можно вынести и выставить.
- source_word: καὶ διὰ τοῦ φόβου
  choice: даже страхом
  rationale: «Даже» передаёт усилительное значение καί и показывает переход от словесного убеждения к устрашению.
- source_word: πείσειεν
  choice: склонить
  rationale: Сохраняет значение попытки добиться согласия, не подменяя греческое слово более сильным «принудить».
- source_word: μιεροφαγῆσαι
  choice: есть осквернённую пищу
  rationale: Передаёт употребление пищи, связанной с осквернением и нарушением требований Закона, не сужая значение до строго терминологической формулы.
theological_decisions:
- issue: Передача μιεροφαγῆσαι в контексте отказа мучеников от запрещённой пищи
  choice: есть осквернённую пищу
  alternative: есть нечистую пищу
  rationale: Основной вариант сохраняет идею осквернения, выраженную сложным греческим глаголом. Альтернатива яснее связывает выражение с пищевыми предписаниями Закона, но может звучать как более узкий установленный термин; она приведена в сноске.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет достоинство повествования, угрозу сцены и различие между убеждением и прямым принуждением.
