lexical_decisions:
- source_word: τί
  choice: Зачем
  rationale: В риторическом вопросе τί выражает укоризненное «зачем/почему»; «зачем» естественно передаёт вопрос о безрассудном намерении.
- source_word: βουλήμασιν κενοῖς
  choice: пустыми замыслами
  rationale: βουλήματα обозначает замыслы или намерения, а κενοῖς характеризует их как лишённые содержания и пользы; сочетание сохраняет образ исходного текста.
- source_word: ἑαυτοὺς εὐφραινόμεν
  choice: нам тешить себя
  rationale: Передаёт рефлексивное «радовать самих себя» и нравственную иронию удовольствия от пустых замыслов.
- source_word: θανατηφόρον
  choice: несущее смерть
  rationale: Прозрачно сохраняет составное значение «приносящее смерть», не сводя его лишь к общему «гибельное».
- source_word: ἀπειθίαν
  choice: непослушание
  rationale: Прямо передаёт отказ повиноваться, не усиливая выражение до более нагруженного «мятежа».
- source_word: τολμῶμεν
  choice: дерзать на
  rationale: Передаёт безрассудную смелость, заключённую в τολμῶμεν, и естественно сочетается в русском с существительным «непослушание».
theological_decisions:
- issue: Нравственная характеристика ἀπειθία
  choice: непослушание
  alternative: непокорность; мятеж
  rationale: Греческое слово обозначает отказ повиноваться, но само по себе не требует усиленного или конфессионально нагруженного толкования; нейтрально-прямой вариант сохраняет предостережение текста.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной интонацией нравственного увещания. Синтаксис сохраняет единый риторический вопрос и коллективное первое лицо греческого текста.
