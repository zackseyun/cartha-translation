  yaml_path: translation/deuterocanon/4_maccabees/008/022.yaml
  text: But divine justice will also pardon us if[a], under compulsion, we become afraid of the king.
translation:
  language: ru
  text: Но и божественное правосудие[a] простит нас за то, что мы под принуждением испугались царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «божественный суд также простит нас»; возможно также: «божественная кара пощадит нас». Греческое δίκη может означать правосудие, суд или кару.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγγνώσεται
  choice: простит
  rationale: Будущая форма συγγιγνώσκω здесь означает даровать прощение или принять во внимание смягчающие обстоятельства. «Простит» естественно сочетается с личным дополнением «нас» и сохраняет нравственно-судебный смысл.
- source_word: ἡ θεία δίκη
  choice: божественное правосудие
  rationale: δίκη может означать справедливость, суд или кару. «Божественное правосудие» сохраняет широкий судебно-нравственный смысл и олицетворение, поскольку именно оно выступает субъектом глагола «простит».
- source_word: διʼ ἀνάγκην
  choice: под принуждением
  rationale: Оборот указывает на вынужденные обстоятельства, служащие основанием для ожидаемого прощения. «Под принуждением» передаёт это кратко и естественно, не превращая необходимость в отдельное действие.
- source_word: τὸν βασιλέα
  choice: царя
  rationale: βασιλεύς прямо обозначает царя; контекст не требует более общего слова «правитель».
- source_word: φοβηθεῖσιν
  choice: испугались
  rationale: Аористное причастие в дательном падеже относится к «нам» и описывает пережитый страх перед царём. Русская придаточная конструкция «за то, что мы… испугались» естественно передаёт обстоятельственно-причинную связь без добавления условного «если», которого в греческом тексте нет.
theological_decisions:
- issue: Передавать ли δίκη узко как кара или шире как правосудие в высказывании о божественном прощении
  choice: божественное правосудие
  alternative: божественный суд; божественная кара
  rationale: Широкое «правосудие» сохраняет напряжение между Божьей справедливостью и снисхождением к поступившим под принуждением, не сводя δίκη исключительно к наказанию.
- issue: Понимать ли причастный оборот как условие или как основание ожидаемого прощения
  choice: за то, что мы под принуждением испугались царя
  alternative: если мы под принуждением испугаемся царя
  rationale: В греческом тексте нет явного условного показателя; аористное причастие естественнее описывает вынужденный поступок как основание для снисхождения. Поэтому сохранена причинно-объяснительная связь, а не внесено однозначное условие.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Порядок слов сохраняет усилительное «и» при подлежащем; придаточная конструкция делает греческий причастный оборот понятным без утраты его причинного смысла.
