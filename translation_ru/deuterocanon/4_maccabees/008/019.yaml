base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/019.yaml
  text: Shall we not fear the tortures[a], brothers, and reckon with the threats of the torments, and flee this empty glory and deadly arrogance?
translation:
  language: ru
  text: Неужели мы не устрашимся пыток, братья, не примем в расчёт угрозы мучений и не убежим от этой пустой славы[a] и гибельного высокомерия?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этого тщеславия и губительного хвастовства».'
    reason: Слова κενοδοξία и ἀλαζονία допускают соответственно более традиционный перевод «тщеславие» и оттенок хвастливой самонадеянности.
lexical_decisions:
- source_word: οὐ φοβησόμεθα
  choice: неужели мы не устрашимся
  rationale: Будущее время в риторическом вопросе передано без превращения фразы в утверждение или прямое увещание; «неужели» сохраняет напряжённую вопросительную интонацию.
- source_word: ἄνδρες ἀδελφοί
  choice: братья
  rationale: Обращение относится к мужчинам-братьям; по-русски «братья» естественно передаёт и родственную связь, и торжественность обращения без буквального, но неестественного «мужи-братья».
- source_word: τὰ βασανιστήρια
  choice: пыток
  rationale: В данном контексте существительное обозначает пытки; перевод не конкретизирует его как орудия пыток, поскольку это не обязательно следует из формы слова.
- source_word: λογιούμεθα
  choice: примем в расчёт
  rationale: Глагол выражает обдумывание и признание чего-либо значимым; выражение передаёт этот расчётливый учёт угроз.
- source_word: τὰς τῶν βασάνων ἀπειλάς
  choice: угрозы мучений
  rationale: Сохранена родительная связь между угрозами и мучениями, а также лексическое различие с предшествующим словом, переведённым как «пытки».
- source_word: φεύξομεν
  choice: убежим от
  rationale: Сохранён яркий образ бегства, а не ослабленное отвлечённое «избежим» или «отвергнем».
- source_word: τὴν κενοδοξίαν ταύτην
  choice: этой пустой славы
  rationale: Переданы оба смысловых компонента слова — пустота и слава; традиционное «тщеславие» возможно, но менее явно сохраняет образ.
- source_word: ὀλεθροφόρον ἀλαζονίαν
  choice: гибельного высокомерия
  rationale: «Гибельное» передаёт несущую погибель силу определения, а «высокомерие» — самонадеянность и заносчивость ἀλαζονία.
theological_decisions:
- issue: Риторический вопрос с тремя однородными сказуемыми
  choice: Сохранить всю фразу как единый риторический вопрос и распространить отрицательную вопросительную конструкцию на три действия
  alternative: 'Передать как утверждение: «Мы не устрашимся… но убежим…»'
  rationale: Греческая пунктуация и последовательность будущих форм поддерживают вопросительное прочтение. Преобразование в утверждение сняло бы риторическое и нравственное напряжение; повторение «не» требуется нормальным русским синтаксисом и не превращает вопрос в декларацию.
- issue: Мужское обращение ἄνδρες ἀδελφοί
  choice: братья
  alternative: братья и сёстры; мужи-братья
  rationale: В повествовательной ситуации обращение направлено к братьям-мужчинам. Инклюзивное расширение изменило бы референцию, а буквальное «мужи-братья» звучало бы искусственно и архаично.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно торжественной риторикой. Вопросительная форма и трёхчастная последовательность сохранены; лексика понятна обычному читателю без церковнославянизмов.
