  source_fidelity: Русский текст точно сохраняет риторический вопрос, будущее значение форм φοβησόμεθα / λογιούμεθα / φεύξομεν и отрицательную сферу, охватывающую ряд однородных действий. «Пытки» для βασανιστήρια, «угрозы мучений» для τὰς τῶν βασάνων ἀπειλάς и «убежим от» для φεύξομεν передают исходный смысл без излишней конкретизации. Обращение «братья» адекватно передаёт ἄνδρες ἀδελφοί в естественном русском виде.
  naturalness: Фраза звучит как современная литературная русская риторическая речь. Повторение «не» в русском необходимо для ясного распространения отрицания на все три сказуемых и не воспринимается как тяжеловесное. «Примем в расчёт» несколько книжное, но уместно в торжественно-рассудительном контексте и точно передаёт λογιούμεθα.
  terminology: «Пустая слава» сохраняет образ κενοδοξία, хотя «тщеславие» было бы более обычным русским эквивалентом; это обоснованно вынесено в сноску. «Гибельное высокомерие» удачно передаёт разрушительную силу ὀλεθροφόρος и смысл ἀλαζονία. Сноска привязана к обоим словам и предлагает допустимый лексический вариант без доктринального истолкования.
