base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/003.yaml
  text: When the tyrant had given these orders[a], seven brothers were brought in with their aged mother[b], handsome and modest and noble and gracious in every way.
translation:
  language: ru
  text: После того как тиран отдал эти распоряжения, привели[a] семерых братьев вместе с их престарелой матерью. Братья были красивы, скромны, благородны и приятны во всех отношениях[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прибыли, будучи ведомы»; греческое выражение соединяет их появление с тем, что их вели.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во всём обаятельны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα διαταξαμένου
  choice: после того как … отдал эти распоряжения
  rationale: Родительный самостоятельный оборот обозначает предшествующее действие; «отдал распоряжения» естественно передаёт властный смысл διατάσσω.
- source_word: τοῦ τυράννου
  choice: тиран
  rationale: Сохраняет явно оценочное и отрицательно окрашенное обозначение правителя, употреблённое автором.
- source_word: παρῆσαν ἀγόμενοι
  choice: привели
  rationale: Передаёт прибытие братьев в результате того, что их вели, и сохраняет их несамостоятельное положение без тяжеловесного буквализма.
- source_word: μετὰ γεραιᾶς μητρός
  choice: вместе с их престарелой матерью
  rationale: «Престарелой» dignifiedly передаёт преклонный возраст, выраженный γεραιᾶς; притяжательное «их» ясно из упоминания семерых братьев.
- source_word: ἑπτὰ ἀδελφοί
  choice: семерых братьев
  rationale: Мужской род греческого существительного указывает именно на братьев, а не на детей обоих полов.
- source_word: καλοί
  choice: красивы
  rationale: В перечне личных качеств слово естественно описывает привлекательную внешность; русское «красивы» уместно и для мужчин.
- source_word: αἰδήμονες
  choice: скромны
  rationale: Передаёт присущие слову αἰδήμων сдержанность, чувство приличия и нравственную скромность.
- source_word: γενναῖοι
  choice: благородны
  rationale: Сохраняет широкий смысл нравственного благородства, который в контексте может также предполагать мужество, не сужая значение только до храбрости.
- source_word: ἐν παντὶ χαρίεντες
  choice: приятны во всех отношениях
  rationale: Передаёт обаяние и приятность манер, выраженные χαρίεντες, а также всеохватность оборота ἐν παντί.
theological_decisions:
- issue: Оценочная характеристика Антиоха словом τύραννος
  choice: тиран
  alternative: царь; правитель
  rationale: Перевод сохраняет нравственно окрашенную авторскую характеристику и не заменяет её нейтральным титулом.
translation_notes:
  register: 'Современный литературный русский язык с торжественной, но доступной интонацией. Второе предложение введено ради ясности: греческие прилагательные относятся к семерым братьям, а не к их матери. Маркеры сносок поставлены непосредственно при соответствующих выражениях.'
