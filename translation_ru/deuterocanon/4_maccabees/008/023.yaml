lexical_decisions:
- source_word: τί
  choice: Зачем
  rationale: В риторическом вопросе τί имеет значение причины или цели — «зачем?», а не предметное «что?».
- source_word: ἐξάγομεν ἑαυτοὺς
  choice: нам уходить
  rationale: Буквально сочетание означает «выводим самих себя»; естественное русское «уходить» сохраняет смысл добровольного удаления из некоторого состояния или образа жизни.
- source_word: τοῦ ἡδίστου βίου
  choice: из самой приятной жизни
  rationale: Превосходная степень ἡδίστου передана прямо как «самой приятной»; βίος здесь обозначает жизнь как переживаемое состояние или образ существования.
- source_word: καὶ
  choice: и
  rationale: Сохранена простая сочинительная связь между двумя глагольными выражениями.
- source_word: ἀποστεροῦμεν ἑαυτοὺς
  choice: лишать себя
  rationale: ἀποστερέω означает «лишать»; возвратное местоимение сохранено. Объект лишения в дошедшем греческом тексте отсутствует.
