base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/006.yaml
  text: I urge you, by agreeing with me, to enjoy my friendship[a]; for just as I have power to punish those who disobey my commands[b], so also to do good to those who obey me well.
translation:
  language: ru
  text: Я призываю вас, уступив мне[a], воспользоваться моей дружбой[b]. Ведь у меня есть власть как карать тех, кто не повинуется моим приказам, так и благодетельствовать тем, кто охотно мне повинуется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «согласившись со мной» или «подчинившись мне». Греческое причастие допускает разные оттенки, но в любом случае подразумевает, что слушатели должны пойти навстречу требованию говорящего.'
    reason: lexical_alternative
  - marker: b
    text: В речи царя «моя дружба» может означать также его благоволение и покровительство.
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶ
  choice: я призываю
  rationale: Глагол выражает настойчивое побуждение; «призываю» передаёт силу обращения и сохраняет достойный литературный регистр.
- source_word: συνείξαντάς μοι
  choice: уступив мне
  rationale: Причастие, вероятно, обозначает уступку или согласие с требованием говорящего. Причастная конструкция сохраняет связь уступки с последующим получением царской дружбы.
- source_word: τῆς ἐμῆς ἀπολαῦσαι φιλίας
  choice: воспользоваться моей дружбой
  rationale: ἀπολαύω означает пользоваться чем-либо, вкушать или получать от этого благо; φιλία сохраняется как «дружба», хотя в царском контексте включает оттенок благоволения покровителя.
- source_word: δύναμιν
  choice: у меня есть власть
  rationale: В контексте царской речи речь идёт не только о способности, но и о властном полномочии наказывать и оказывать благодеяния.
- source_word: κολάζειν
  choice: карать
  rationale: Глагол обозначает наказание за неповиновение; «карать» уместно в речи правителя и звучит естественно в литературном русском.
- source_word: τοὺς ἀπειθοῦντάς μου τοῖς ἐπιτάγμασιν
  choice: тех, кто не повинуется моим приказам
  rationale: Передаёт отказ повиноваться распоряжениям правителя без усиления до более специального юридического значения «указов».
- source_word: εὐεργετεῖν
  choice: благодетельствовать
  rationale: Глагол означает оказывать благо или предоставлять выгоды. «Благодетельствовать» сохраняет положительный и патрональный оттенок царского действия.
- source_word: τοὺς εὐπειθοῦντάς μου
  choice: тем, кто охотно мне повинуется
  rationale: «Охотно повинуется» передаёт усиленный смысл εὐπειθέω — готовое, благосклонное послушание, а не просто факт повиновения.
theological_decisions:
- issue: Характер предлагаемой правителем φιλία
  choice: дружба
  alternative: благоволение, милость
  rationale: «Дружба» сохраняет прямое лексическое значение и личный характер предложения, тогда как примечание отмечает царско-покровительственный оттенок, не подменяя им основной текст.
- issue: Связь уступки с обещанным благом
  choice: причастное «уступив мне»
  alternative: «согласитесь со мной и воспользуйтесь»
  rationale: 'Причастная форма сохраняет возможный оттенок средства или условия: доступ к дружбе правителя предлагается через уступку ему, однако логическая связь не делается более однозначной, чем в греческом.'
translation_notes:
  register: Современный литературный русский с достоинством царской речи. Симметрия «как… так и…» сохраняет риторическое противопоставление наказания и благодеяния; архаизация ограничена уместными словами «карать» и «благодетельствовать».
