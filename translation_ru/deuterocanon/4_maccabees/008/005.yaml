base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/005.yaml
  text: Young men[a], I warmly admire the beauty of each one of you, and, valuing so highly the number of so many brothers, I not only urge you not to go mad with the same madness as the old man who has already been tortured, but also—
translation:
  language: ru
  text: «Юноши, я с теплотой восхищаюсь красотой каждого из вас и, высоко ценя то, что вас, братьев, столь много, не только советую вам не впадать в то же безумие, что и старец, которого уже подвергли пыткам, но и…»[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предложение продолжается в следующем стихе; здесь греческий текст оканчивается словами «но и».
    reason: Сноска поясняет намеренно сохранённую незавершённость фразы на границе стихов.
lexical_decisions:
- source_word: Ὦ νεανίαι
  choice: Юноши
  rationale: Прямое обращение к молодым мужчинам; «юноши» естественно и точно сохраняет мужской род и возрастную характеристику.
- source_word: φιλοφρόνως
  choice: с теплотой
  rationale: Передаёт доброжелательный, располагающий тон наречия без излишнего расширения смысла.
- source_word: καθʼ ἑνὸς ἑκάστου ὑμῶν
  choice: каждого из вас
  rationale: 'Сохраняет усиленное распределительное значение: речь идёт о каждом в отдельности.'
- source_word: θαυμάζω τὸ κάλλος
  choice: восхищаюсь красотой
  rationale: Передаёт как значение удивлённого восхищения в θαυμάζω, так и прямое значение κάλλος — «красота».
- source_word: τὸ πλῆθος τοσούτων ἀδελφῶν ὑπερτιμῶν
  choice: высоко ценю то, что вас, братьев, так много
  rationale: Естественно по-русски выражает высокую оценку многочисленности группы братьев, не превращая πλῆθος в отвлечённое «множество».
- source_word: οὐ μόνον συμβουλεύω
  choice: Я не только советую вам
  rationale: συμβουλεύω прежде всего означает «советовать, убеждать»; добавленное по-русски «вам» ясно обозначает адресатов, уже выраженных контекстом.
- source_word: μὴ μανῆναι ... μανίαν
  choice: не впадать в то же безумие
  rationale: Передаёт становление безумным и повтор ключевого понятия, избегая неестественного русского оборота «безумствовать безумием».
- source_word: τῷ προβασανισθέντι γέροντι
  choice: что и старец, которого уже подвергли пыткам
  rationale: Аористное пассивное причастие указывает на предшествующую пытку; «старец» сохраняет значение γέρων и возвышенный исторический регистр.
- source_word: ἀλλὰ καὶ
  choice: но и…
  rationale: Многоточие сохраняет незавершённость конструкции, которая продолжается в следующем стихе.
theological_decisions:
- issue: Передача ἀδελφῶν в контексте семи сыновей
  choice: братьев
  alternative: братьев и сестёр / детей одной семьи
  rationale: Здесь имеются в виду именно братья-мужчины, поэтому родово-нейтральное расширение было бы неточным.
- issue: Незавершённая конструкция в конце стиха
  choice: сохранить «но и…»
  alternative: завершить мысль содержанием следующего стиха
  rationale: Греческий текст данного стиха оканчивается на ἀλλὰ καὶ; перевод не должен заранее вводить продолжение или устранять риторический обрыв.
translation_notes:
  register: Современный литературный русский язык с dignified историко-риторическим оттенком. Лесть и издевательское обозначение стойкости мученика как «безумия» сохранены как речь персонажа, без богословского сглаживания.
