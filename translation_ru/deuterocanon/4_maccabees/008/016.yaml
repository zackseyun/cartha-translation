base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/016.yaml
  text: 'And through their blessed courage they brought down his tyranny. Yet let us consider this: if some among them had been fainthearted and unmanly, what words would they have used? Would it not have been these?'
translation:
  language: ru
  text: 'И своим благородством[a] они сокрушили его тиранию. Однако задумаемся: если бы среди них были малодушные и немужественные[b], какими словами они воспользовались бы? Разве не такими словами?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Редкое греческое слово можно также передать как «благословенность», «похвальное качество» или «доблесть». Вероятно, здесь имеется в виду достойное похвалы качество, а не произнесённое благословение.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально — «немужественные»; греческое слово выражено в гендерно окрашенных категориях добродетели. По смыслу возможно: «лишённые мужества» или «трусливые».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τῆς εὐλογιστίας
  choice: своей доблестью
  rationale: Редкое εὐλογιστία здесь обозначает похвальное нравственное качество, благодаря которому мученики одолевают тиранию. «Доблесть» естественно передаёт превосходство и мужественную стойкость, не сводя слово к произнесённому благословению; неоднозначность отмечена в сноске.
- source_word: τὴν τυραννίδα αὐτοῦ κατέλυσαν
  choice: они сокрушили его тиранию
  rationale: καταλύω обозначает низложение или уничтожение власти; «сокрушили» сохраняет силу образа и относится здесь именно к тирании, а не обязательно к физическому устранению тирана.
- source_word: καίτοι λογισώμεθα
  choice: Однако задумаемся
  rationale: Уступительное καίτοι и побудительное сослагательное λογισώμεθα вводят риторический мысленный опыт; краткая русская формула сохраняет и переход, и приглашение рассуждать вместе.
- source_word: δειλόψυχοι
  choice: малодушные
  rationale: Сложное слово буквально указывает на слабость или робость духа; «малодушные» точно и естественно передаёт его нравственно-психологический смысл.
- source_word: ἄνανδροι
  choice: немужественные
  rationale: Сохранена гендерно окрашенная риторика греческого текста и отличие от предшествующего δειλόψυχοι. Возможный нейтральный смысл указан в сноске.
- source_word: ποίοις ἂν ἐχρήσαντο λόγοις
  choice: какие слова они употребили бы
  rationale: Конструкция с ἄν выражает нереальное предположение, а χράομαι с λόγοις — то, какими словами они воспользовались бы.
- source_word: οὐχὶ τούτοις;
  choice: Не такие ли?
  rationale: Краткий риторический вопрос указывает вперёд, на последующую речь; «такие» естественно соотносится со словами предыдущего вопроса.
theological_decisions:
- issue: Гендерно окрашенный язык добродетели в ἄνανδροι
  choice: немужественные
  alternative: лишённые мужества; трусливые
  rationale: Формулировка сохраняет характерное для книги противопоставление мужества и постыдной слабости, не превращая второе определение в простой повтор слова «малодушные».
- issue: Смысл редкого εὐλογιστία
  choice: доблесть
  alternative: благословенность; похвальность; благородство
  rationale: Контекст связывает это качество со стойкостью, сокрушающей тиранию, однако сам редкий термин допускает несколько оттенков. Основной текст передаёт нравственное превосходство, а сноска сохраняет лексическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством риторико-философской прозы. Синтаксис сделан ясным для широкого читателя; два последовательных вопроса и указание вперёд сохранены. «Доблесть» несколько интерпретирует редкий термин, поэтому реальные альтернативы вынесены в сноску.
