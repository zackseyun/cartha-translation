lexical_decisions:
- source_word: Ἐπειδὴ γὰρ
  choice: Ибо после того, как
  rationale: Передаёт объяснительное γάρ и временно-причинное ἐπειδή, сохраняя связь с последующим продолжением предложения.
- source_word: κατὰ τὴν πρώτην πεῖραν
  choice: в первом испытании
  rationale: πεῖρα допускает значения попытки и испытания; в контексте принуждения мученика «испытание» естественно сохраняет оба оттенка.
- source_word: ἐνικήθη
  choice: потерпел поражение
  rationale: Точно и естественно передаёт пассивную форму νικάω применительно к неудаче тирана.
- source_word: περιφανὴς
  choice: всем известный
  rationale: Сохраняет основное значение заметности и широкой известности, не навязывая отрицательной оценки, которая уже выражена словом «тиран».
- source_word: ὁ τύραννος
  choice: тиран
  rationale: Передаёт политическую и нравственную окраску τύραννος без смягчения до «правителя».
- source_word: μὴ δυνηθεὶς
  choice: не сумев
  rationale: Естественно передаёт обстоятельственный аористный причастный оборот и поясняет, в чём состояло поражение.
- source_word: ἀναγκάσαι
  choice: заставить
  rationale: Современное и ясное русское соответствие со значением принуждения.
- source_word: γέροντα
  choice: старца
  rationale: Контекстуально речь идёт об уже известном пожилом человеке; «старец» соответствует достоинству повествовательного регистра, не обозначая церковной должности.
- source_word: μαιροφαγῆσαι
  choice: вкусить оскверняющую пищу
  rationale: Редкий глагол указывает на употребление пищи, считающейся оскверняющей; перевод сохраняет акцент на осквернении и не сужает значение исключительно до мяса.
theological_decisions:
- issue: Характер пищи в μαιροφαγῆσαι
  choice: вкусить оскверняющую пищу
  alternative: есть осквернённое мясо; вкусить запрещённую пищу
  rationale: Выбранная формулировка сохраняет связь с осквернением по иудейскому Закону, но не уточняет сверх греческого текста ни вид пищи, ни точное основание запрета.
