  text: Therefore have pity on yourselves[a], on whom even I, your enemy, have pity because of your age.
translation:
  language: ru
  text: 'Итак, пожалейте самих себя: даже я, ваш враг, жалею вас из-за вашего возраста[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за вашей юности». Греческое слово может обозначать не только возраст вообще, но и определённую пору жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατελεήσατε
  choice: пожалейте
  rationale: Аористный императив выражает призыв проявить жалость; «пожалейте» естественно передаёт эту эмоциональную просьбу по-русски.
- source_word: ἑαυτούς
  choice: самих себя
  rationale: Возвратное местоимение подчёркивает, что юноши должны проявить жалость к самим себе.
- source_word: οὓς
  choice: вас
  rationale: Относительное местоимение возвращает к адресатам; в русском повтор «вас» делает связь с глаголом «жалею» ясной и естественной.
- source_word: ὁ πολέμιος
  choice: ваш враг
  rationale: Буквально «враг»; притяжательное «ваш» естественно выражает подразумеваемое в контексте отношение говорящего к адресатам.
- source_word: ἔγωγε
  choice: даже я
  rationale: 'Эмфатическая форма местоимения создаёт риторический контраст: их жалеет даже тот, кто является их врагом.'
- source_word: τῆς ἡλικίας
  choice: из-за вашего возраста
  rationale: ἡλικία обозначает возраст или пору жизни. Нейтральное «возраст» сохраняет широту греческого слова, а более конкретное «юность» вынесено в сноску.
theological_decisions:
- issue: Смысловой оттенок ἡλικία
  choice: из-за вашего возраста
  alternative: из-за вашей юности
  rationale: Греческое слово может обозначать возраст вообще или определённую пору жизни; контекст допускает юность, но приведённый текст не требует однозначно сужать значение.
translation_notes:
  register: Современный литературный русский язык; речь звучит как настойчивое, высокомерно-снисходительное обращение врага, но остаётся понятной без архаизмов.
