base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/013.yaml
  text: Then[a], when the bodyguards set out wheels, joint-rackers, stretching-machines, clawing hooks, catapults, cauldrons[b], frying pans, thumbscrews, iron hands, wedges, and the live coals of the fire, the tyrant took up the matter and said,
translation:
  language: ru
  text: 'Когда телохранители выставили колёса, суставоломы, орудия для растягивания, крюки, катапульты, котлы, сковороды, тиски для пальцев, железные руки, клинья и раскалённые угли[a], тиран, взяв слово, сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Названия нескольких орудий в этом стихе редки и технически неясны, поэтому их перевод приблизителен. «Суставоломы» могут означать орудия для выворачивания или раздробления суставов либо конечностей; «крюки» — крюкообразные орудия пытки. Греческий текст буквально называет также «катапульты» — необычный предмет в таком перечне.
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχούς
  choice: колёса
  rationale: Сохранено основное конкретное значение слова; в данном перечне подразумеваются орудия пытки, однако греческий текст не уточняет их устройство.
- source_word: ἀρθρενβόλους
  choice: суставоломы
  rationale: Редкое сложное слово обозначает приспособления, воздействующие на суставы или конечности; краткий русский эквивалент передаёт вероятную функцию, не отождествляя их с каким-либо строго определённым механизмом.
- source_word: στρεβλωτήριά
  choice: орудия для растягивания
  rationale: Слово обозначает орудия пытки, которыми тело скручивали или растягивали; описательный перевод понятен современному читателю и сохраняет неопределённость конструкции.
- source_word: τροχαντῆρας
  choice: крюки
  rationale: Редкий технический термин, вероятно обозначающий крюкообразные орудия пытки; нейтральное «крюки» избегает чрезмерной конкретизации.
- source_word: καταπέλτας
  choice: катапульты
  rationale: Сохранено обычное значение греческого слова, хотя этот предмет необычен в перечне орудий пытки; текст не исправляется по догадке.
- source_word: λέβητας
  choice: котлы
  rationale: Естественный русский эквивалент для больших металлических сосудов, вероятно предназначенных для нагревания.
- source_word: τήγανά
  choice: сковороды
  rationale: Передаёт обычное значение нагреваемых плоских сосудов и ясно звучит по-русски.
- source_word: δακτυλήθρας
  choice: тиски для пальцев
  rationale: Связанное с пальцами редкое название орудия передано функционально; «тиски для пальцев» точнее греческой форме, чем специфические «тиски для больших пальцев».
- source_word: χεῖρας σιδηρᾶς
  choice: железные руки
  rationale: Сохранён буквальный и выразительный образ; вероятно, речь идёт о хватательных орудиях, но источник не даёт более точного названия.
- source_word: σφῆνας
  choice: клинья
  rationale: Передано нормальное лексическое значение без добавления неуказанного способа применения.
- source_word: τὰ ζώπυρα τοῦ πυρός
  choice: пылающие угли
  rationale: Естественно передаёт горящие или тлеющие угли; избыточное «угли огня» по-русски не требуется.
- source_word: οἱ δορυφόροι
  choice: телохранители
  rationale: В придворном контексте слово, буквально означающее копьеносцев, обозначает личную стражу правителя.
- source_word: ὑπολαβὼν ... ἔφη
  choice: заговорил и сказал
  rationale: Передаёт вступление тирана в речь; сочетание сохраняет формульную развёрнутость греческой конструкции, не навязывая значение «возразил» без явного собеседника.
theological_decisions:
- issue: Оценочное обозначение правителя словом τύραννος
  choice: тиран
  alternative: правитель; царь
  rationale: Греческое слово несёт отрицательную нравственно-политическую оценку; нейтрализация как «правитель» или «царь» ослабила бы авторскую риторику.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Перечень сохранён резким и предметным; редкие термины переданы понятными названиями либо прозрачными описаниями. Единственная сноска отмечает совокупную техническую неопределённость и необычное чтение «катапульты».
