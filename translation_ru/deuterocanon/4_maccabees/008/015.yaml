base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/008/015.yaml
  text: But when they heard the inducements and saw the tortures[a], they not only were not afraid, but even reasoned philosophically with the tyrant[c][b],
translation:
  language: ru
  text: Услышав уговоры[a] и увидев ужасные истязания[b], они не только не испугались, но даже вступили с тираном в философский спор[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «увещевания», «попытки склонить их». Греческое слово обозначает средства, которыми стараются привлечь человека или убедить его.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ужасное» или «страшные вещи»; в данном контексте речь идёт об истязаниях, которые им показывали.'
    reason: lexical_alternative
  - marker: c
    text: Греческий глагол можно передать буквально как «философствовали в ответ тирану»; он подчёркивает разумное философское сопротивление.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγωγὰς
  choice: уговоры
  rationale: Слово обозначает попытки склонить или привлечь кого-либо; «уговоры» естественно передаёт предпринимаемое властителем убеждение, не сводя его ни к простой просьбе, ни к обещанию награды.
- source_word: δεινά
  choice: ужасные истязания
  rationale: Субстантивированное прилагательное буквально означает «ужасное, страшное»; контекст мученичества указывает на истязания. Определение «ужасные» сохраняет широту и эмоциональную силу греческого слова.
- source_word: οὐ μόνον οὐκ ἐφοβήθησαν
  choice: они не только не испугались
  rationale: Сохранена усилительная конструкция «не только не», а аорист передан естественным русским совершенным видом.
- source_word: ἀντεφιλοσόφησαν
  choice: вступили … в философский спор
  rationale: Редкий глагол выражает ответное, направленное против оппонента философствование. Такой перевод сохраняет философскую лексику книги и одновременно звучит естественно по-русски.
- source_word: τῷ τυράννῳ
  choice: с тираном
  rationale: «Тиран» сохраняет данную автором нравственную характеристику правителя; творительный с «с» обусловлен русской конструкцией «вступить в спор с кем-либо».
theological_decisions:
- issue: Передача лексики с корнем φιλοσοφ- в 4 Маккавейской
  choice: Сохранить в основном тексте прямое указание на философский характер спора
  alternative: «возразили тирану» или «стали рассуждать с тираном»
  rationale: Автор намеренно описывает стойкость мучеников языком разума и философии. Обобщённый перевод стёр бы важную для аргументации книги смысловую линию.
- issue: Направленность ἀντεφιλοσόφησαν по отношению к тирану
  choice: 'Передать как состязательное противостояние: «вступили с тираном в … спор»'
  alternative: Нейтральное «философски рассуждали с тираном»
  rationale: Приставка ἀντ- придаёт ответный или противительный оттенок, который следует сохранить, не превращая сцену в спокойную совместную беседу.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. «Уговоры» доступно широкому читателю; «вступили в философский спор» сохраняет маркированную философскую лексику оригинала без неестественного русского глагола «философствовали против».
