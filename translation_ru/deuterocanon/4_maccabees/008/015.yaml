  source_fidelity: Текст точно передаёт временную последовательность греческих причастий («услышав… и увидев…»), усиленную конструкцию «не только не… но даже…» и противительный, ответный оттенок ἀντεφιλοσόφησαν. «Уговоры» является естественным контекстуальным соответствием ἐπαγωγάς; «ужасные истязания» оправдано ближайшим контекстом, хотя δεινά само по себе шире. «Вступили с тираном в философский спор» сохраняет как философскую лексику, так и полемическую направленность глагола.
