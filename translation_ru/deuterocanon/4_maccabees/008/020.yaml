  source_fidelity: 'Основной смысл передан верно: оба глагола являются увещательными формами 1-го лица множественного числа, а «старость» правомерно дана как контекстуально вероятное восполнение эллиптического τὸ τῆς μητρὸς. Однако греческое множественное число τὰς ... ἡλικίας относится к возрасту/молодым годам каждого из говорящих; русское «нашу собственную молодость» несколько сильнее коллективизирует этот смысл. Сноска нуждается в более точной формулировке эллипсиса.'
