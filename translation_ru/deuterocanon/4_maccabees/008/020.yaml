lexical_decisions:
- source_word: ἐλεήσωμεν
  choice: пожалеем
  rationale: Увещательное сослагательное наклонение первого лица множественного числа. «Пожалеем» естественно передаёт призыв проявить милость к собственной молодой жизни, не усиливая значение до прямого «сбережём».
- source_word: τὰς ἑαυτῶν ἡλικίας
  choice: нашу собственную молодость
  rationale: ἡλικία может обозначать возраст, пору жизни или молодые годы. В контексте речь идёт о молодых братьях; собирательное единственное число по-русски естественно выражает их общую пору жизни, тогда как «собственную» сохраняет усиление ἑαυτῶν.
- source_word: κατοικτειρήσωμεν
  choice: сжалимся
  rationale: Ещё одно увещательное сослагательное наклонение, выражающее сострадательную жалость. «Сжалимся» кратко, достойно и естественно продолжает призыв.
- source_word: τὸ τῆς μητρὸς
  choice: над старостью нашей матери
  rationale: 'В данном греческом свидетельстве оборот эллиптичен: определяемое существительное не выражено. «Старость» восполнена по контексту как наиболее вероятный смысл, а неопределённость отмечена в сноске.'
