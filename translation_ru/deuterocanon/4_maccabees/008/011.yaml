lexical_decisions:
- source_word: εὐμορφίας
  choice: красоты
  rationale: Существительное обозначает физическую привлекательность; «красота» естественно передаёт манипулятивную ссылку говорящего на привлекательную внешность юношей.
- source_word: οἰκτείρομαι
  choice: мне жаль
  rationale: Передаёт выражение жалости или сострадания кратко и естественно, сохраняя манипулятивный тон речи.
- source_word: διαλογιεῖσθε
  choice: неужели вы не понимаете
  rationale: В риторическом вопросе глагол призывает обдумать и осознать последствия; этот вариант звучит естественно по-русски, не устраняя оттенка рассуждения.
- source_word: ἀπειθήσασιν
  choice: если не покоритесь
  rationale: Условная конструкция естественно передаёт обстоятельственный смысл причастия. Объект неповиновения в греческом не назван, поэтому «мне» не добавлено.
- source_word: ἀπόκειται
  choice: вас не ждёт
  rationale: В контексте угрозы глагол означает уготованный или ожидающий исход; «вас не ждёт ничего» идиоматично передаёт эту мысль.
- source_word: στρεβλῶν
  choice: пыток
  rationale: Множественное число обозначает мучения, исторически связанные со скручиванием или дыбой; общее «пытки» ясно и не вводит неоправданной конкретизации.
- source_word: ἀποθανεῖν
  choice: смерти
  rationale: Номинализация в конструкции «кроме смерти» естественно передаёт инфинитив «умереть» и сохраняет смысл исходного высказывания.
