  text: And I pity your beauty. Will you not consider this—that nothing lies before you[a], if you disobey, except to die amid tortures?
translation:
  language: ru
  text: И мне жаль вашей красоты. Неужели вы не задумаетесь о том, что, если не покоритесь, вас не ждёт ничего, кроме смерти среди пыток?[a]
  philosophy: optimal-equivalence
