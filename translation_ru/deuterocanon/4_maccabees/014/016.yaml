  text: But in the peaks of mountains and the clefts of ravines and the hollows of trees and their tops[a], making nests, it gives birth and keeps away the one who approaches.
translation:
  language: ru
  text: А на горных вершинах, в расселинах ущелий, в дуплах деревьев и на высоких или крайних частях этих мест[a] оно свивает гнёзда, производит на свет потомство и не подпускает того, кто приближается.
  philosophy: optimal-equivalence
  footnotes:
