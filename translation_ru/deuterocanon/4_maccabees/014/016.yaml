    text: 'Буквально: «и на их верхних (или крайних) частях». Местоимение может относиться ко всем перечисленным местам, а не только к деревьям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ δὲ κατὰ τὰς κορυφὰς ὀρέων
  choice: А на горных вершинах
  rationale: κατά с винительным падежом передаёт здесь местное или распределительное значение; «на горных вершинах» естественно и сохраняет образ высот.
- source_word: φαράγγων ἀπορρῶγας
  choice: в расселинах ущелий
  rationale: ἀπορρώξ обозначает трещину, расселину или обломистый утёс; «расселины ущелий» передаёт суровый рельеф без излишнего уточнения.
- source_word: δένδρων ὀπὰς
  choice: в дуплах деревьев
  rationale: ὀπή значит отверстие или полость; в контексте гнездования естественное русское соответствие — «дупла».
- source_word: τὰς τούτων ἄκρας
  choice: на их верхушках
  rationale: Сохранено буквальное пространственное значение ἄκρας — «верхушки, крайние части» — и местоименная неоднозначность τούτων; возможный более широкий охват пояснён в сноске.
- source_word: νοσσοποιούμενα
  choice: свивает гнёзда
  rationale: Причастие означает устройство гнезда или гнездование. «Свивает гнёзда» — современное и наглядное выражение, не добавляющее отдельного значения размножения.
- source_word: ἀποτίκτει
  choice: производит на свет потомство
  rationale: Глагол означает рождать или приносить потомство. Формулировка подходит к обобщённому животному субъекту и не ограничивает способ появления детёнышей.
- source_word: τὸν προσιόντα κωλύει
  choice: не подпускает того, кто приближается
  rationale: Единственное число причастия сохранено через «того, кто»; κωλύει в контексте охраны гнезда естественно передаётся как «не подпускает».
