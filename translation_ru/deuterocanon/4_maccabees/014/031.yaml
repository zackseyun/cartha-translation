    reason: lexical_alternative
  - marker: b
    text: 'Или: «ради почитания Бога». Здесь под благочестием понимаются благоговейное почитание Бога и верная преданность Ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Но
  rationale: Передаёт лёгкое противопоставление и продолжение мысли без избыточного «но также».
- source_word: καθʼ ἕνα παῖδα
  choice: каждого сына по отдельности
  rationale: Оборот καθʼ ἕνα имеет распределительное значение «по одному»; παῖδα в контексте семи братьев естественно обозначает сына.
- source_word: ὁμοῦ πάντας
  choice: всех вместе
  rationale: Сохраняет противопоставление индивидуального обращения к каждому и обращения ко всем как к группе.
- source_word: ἐπὶ τὸν ... θάνατον προέτρεπεν
  choice: побуждала идти на смерть
  rationale: Передаёт настойчивое увещание и направленность действия; по-русски «идти на смерть» звучит естественнее буквального «побуждала к смерти».
- source_word: τῆς εὐσεβείας
  choice: ради благочестия
  rationale: «Благочестие» сохраняет религиозный смысл почитания Бога и преданности Ему, а «ради» естественно выражает здесь смысл основания или цели.
theological_decisions:
- issue: Значение εὐσέβεια в контексте мученичества
  choice: ради благочестия
  alternative: ради почитания Бога; за верность Богу
  rationale: Выбранный вариант сохраняет ёмкость греческого понятия — благоговение, почитание Бога и верную преданность Ему — не сводя его только к одному аспекту.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования. Парная конструкция «и каждого… и всех…» подчёркивает заложенное в греческом тексте сочетание индивидуального и коллективного увещания.
