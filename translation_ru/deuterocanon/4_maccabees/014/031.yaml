  text: But the mother urged each son individually[a], and all of them together[b], toward death for the sake of godliness.
translation:
  language: ru
  text: Но мать побуждала каждого сына по отдельности[a] и всех вместе идти на смерть ради благочестия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
