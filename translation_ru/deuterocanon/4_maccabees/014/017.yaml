revisions:
- from: Но даже если они не могли предотвратить беду[a], то, облетая своих детёнышей со всех сторон, терзаясь родительской любовью и подзывая их своим голосом, помогали им как только могли.
  to: Но даже если они и не могли воспрепятствовать этому[a], они, облетая их со всех сторон, страдая от родительской любви и подзывая их своим голосом, помогали своим детям чем могли.
  rationale: Исправлены необоснованная конкретизация объекта, буквальное «детёныши» в основном тексте и двусмысленный оборот «как только могли». Птичья образность сохранена в глаголе «облетая» и пояснена сноской, тогда как основной текст остаётся применимым к родителям и их детям, как в греческой риторике.
  reviewer_model: gpt-5.6-terra
