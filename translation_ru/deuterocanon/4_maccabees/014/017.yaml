lexical_decisions:
- source_word: κωλύειν
  choice: предотвратить беду
  rationale: Инфинитив означает воспрепятствовать угрожающему несчастью; слово «беду» проясняет подразумеваемый объект, не уточняя характера угрозы.
- source_word: περιιπτάμενα κυκλόθεν αὐτῶν
  choice: облетая своих детёнышей со всех сторон
  rationale: Сохраняет явный образ птиц, летающих вокруг птенцов; «со всех сторон» передаёт усилительное κυκλόθεν.
- source_word: ἀλγοῦντα τῇ στοργῇ
  choice: терзаясь родительской любовью
  rationale: Передаёт боль ἀλγοῦντα и естественную привязанность στοργή. «Родительской» соответствует контексту, не сужая выражение до материнства как лексически выраженного значения.
- source_word: ἀνακαλούμενα τῇ ἰδίᾳ φωνῇ
  choice: подзывая их своим голосом
  rationale: «Подзывая» сохраняет возможный оттенок зова к себе, а «своим голосом» прямо передаёт τῇ ἰδίᾳ φωνῇ.
- source_word: καθʼ ὃν δύναται τρόπον
  choice: как только могли
  rationale: Естественный русский оборот, выражающий помощь всеми доступными средствами при ограниченных возможностях.
- source_word: βοηθεῖ τοῖς τέκνοις
  choice: помогали им
  rationale: Прямо передаёт оказание помощи потомству; местоимение устраняет тяжёлый повтор после «своих детёнышей».
theological_decisions:
- issue: Образ птиц-родителей применительно к человеческим матерям в окружающем рассуждении
  choice: 'Сохранить образ явно: «облетая своих детёнышей»'
  alternative: Обобщить как «окружая своих детей»
  rationale: Греческое περιιπτάμενα непосредственно обозначает полёт; устранение этого образа ослабило бы риторическое сравнение.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Образ птиц сохранён; согласование во множественном числе отражает подразумеваемых матерей/родительских существ из контекста.
