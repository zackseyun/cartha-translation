  text: For the more mothers are weak in spirit and more prolific[a], the more they love their children.
translation:
  language: ru
  text: Ведь чем слабее духом матери и чем больше у них детей, тем сильнее они любят своих детей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅσῳ ... τοσούτῳ
  choice: чем ... тем
  rationale: Русская соотносительная конструкция естественно и точно передаёт пропорциональное сопоставление греческого текста.
- source_word: ἀσθενέψυχοι
  choice: слабее духом
  rationale: Передаёт буквальный образ «слабости души/духа», не сужая значение до трусости, как могло бы сделать слово «малодушнее».
- source_word: πολυγονώτεραι
  choice: чем больше у них детей
  rationale: Естественно выражает сравнительный смысл «рождающие больше детей, более многодетные» и избегает неуклюжего сравнительного «многодетнее».
- source_word: ὑπάρχουσιν
  choice: опущено как связка
  rationale: В русском настоящем времени именная связка обычно не выражается; её смысл передан конструкцией предложения.
- source_word: αἱ μητέρες
  choice: матери
  rationale: Прямое и однозначное соответствие греческому существительному.
- source_word: μᾶλλον ... φιλοτεκνότεραι
  choice: тем сильнее они любят своих детей
  rationale: Естественно передаёт сравнительное «более чадолюбивы», сохраняя как степень любви, так и направленность на собственных детей.
