  source_fidelity: 'Русский текст верно передаёт соотносительную сравнительную конструкцию ὅσῳ ... τοσούτῳ: «чем ... тем». «Слабее духом» сохраняет образ ἀσθενέψυχοι, не навязывая значения трусости; «чем больше у них детей» естественно раскрывает сравнительное πολυγονώτεραι. «Тем сильнее они любят своих детей» адекватно передаёт μᾶλλον ... φιλοτεκνότεραι без утраты сравнительной силы.'
