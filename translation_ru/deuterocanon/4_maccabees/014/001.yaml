lexical_decisions:
- source_word: προσέτι καί
  choice: Более того
  rationale: Передаёт присоединение и риторическое усиление следующего довода.
- source_word: ἐπὶ τὸν αἰκισμὸν ἐποτρύνοντες
  choice: побуждая их идти на пытки
  rationale: αἰκισμός обозначает жестокое физическое истязание, а ἐποτρύνω — настойчивое побуждение; добавленное «их» естественно выражает подразумеваемый объект побуждения.
- source_word: ὡς μὴ μόνον ... ἀλλὰ καί
  choice: стремились к тому, чтобы те не только ... но и
  rationale: Конструкция с ὡς и инфинитивами выражает направленность или цель побуждения. «Стремились к тому» делает эту связь ясной по-русски, не превращая её в гарантированный результат.
- source_word: τῶν ἀλγηδόνων
  choice: боль
  rationale: Собирательное единственное число естественно по-русски передаёт физические боли, причиняемые пытками.
- source_word: περιφρονῆσαι
  choice: презрели
  rationale: Сохраняет сильный смысл отношения к боли как к чему-то ничтожному, а не просто терпения или игнорирования.
- source_word: τῆς τῶν ἀδελφῶν φιλαδελφίας
  choice: братской любви к своим братьям
  rationale: Сохраняет явный семейный акцент греческого сочетания φιλαδελφία с уточняющим τῶν ἀδελφῶν, несмотря на намеренную смысловую близость слов.
- source_word: παθῶν
  choice: чувства
  rationale: В контексте 4 Маккавейской речь идёт об эмоциональных побуждениях, которыми следует овладеть; «чувства» понятно современному читателю и не устраняет философский оттенок полностью.
- source_word: κρατῆσαι
  choice: обуздали
  rationale: Передаёт овладение внутренними побуждениями и соответствует теме господства разумного решения над сильными чувствами.
theological_decisions:
- issue: Значение πάθη в нравственно-философской аргументации 4 Маккавейской
  choice: чувства
  alternative: страсти
  rationale: «Чувства» естественно описывает сильную семейную привязанность, тогда как «страсти» точнее передаёт философское значение управляемых πάθη, но в современном русском может ошибочно вызвать представление о греховных или чувственных страстях. Альтернатива сохранена в примечании.
- issue: Отношение к братской любви под пыткой
  choice: обуздать чувства братской любви
  alternative: отвергнуть братскую любовь
  rationale: κρατέω говорит об овладении чувствами, а не об отрицании ценности братской любви; перевод сохраняет напряжение между подлинной привязанностью и необходимостью не поддаться ей под пыткой.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис слегка развёрнут ради ясного различения тех, кто побуждает, и тех, кого побуждают; повтор «братской любви к своим братьям» сохранён как значимый семейный акцент оригинала.
