  yaml_path: translation/deuterocanon/4_maccabees/014/023.yaml
  text: He loved piety more[b][a], the piety that saves unto eternal life according to God.
translation:
  language: ru
  text: Он больше возлюбил благочестие[a] — благочестие, ведущее к вечной жизни по Богу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «богопочитание»; греч. εὐσέβεια означает почтительную преданность Богу, проявляемую в образе жизни.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «по Богу» может также означать «по Божьей воле», «согласно Божьему установлению» или «в Божьих глазах».
    reason: alternative_reading
lexical_decisions:
- source_word: εὐσέβειαν
  choice: благочестие
  rationale: В эллинистическом иудейском контексте слово обозначает почтительную преданность Богу, выраженную в верной жизни. «Благочестие» сохраняет как религиозный, так и нравственный смысл.
- source_word: μᾶλλον
  choice: больше
  rationale: Наречие выражает сравнительное предпочтение; «больше» передаёт его прямо, не подменяя значение глагола.
- source_word: ἠγάπησεν
  choice: возлюбил
  rationale: Аорист ἀγαπάω означает «любить». «Возлюбил» звучит достойно в библейском повествовании, а сравнительный оттенок уже выражен словом «больше».
- source_word: τὴν σώζουσαν
  choice: благочестие, спасающее
  rationale: Артикль с причастием атрибутивно относится к εὐσέβειαν. Повтор существительного проясняет связь и сохраняет прямое значение σώζω.
- source_word: εἰς αἰώνιον ζωὴν
  choice: для вечной жизни
  rationale: Предлог εἰς указывает на цель или результат. Русское «для вечной жизни» передаёт эту направленность без архаичного оборота.
- source_word: κατὰ θεόν
  choice: по Богу
  rationale: 'Краткий оборот сохраняет сжатость и неоднозначность греческого выражения: оно может указывать на Божью волю, меру или суждение и может соотноситься со спасением либо с вечной жизнью.'
theological_decisions:
- issue: Смысл и синтаксическая связь κατὰ θεόν
  choice: Передать кратко как «по Богу», сохранив неоднозначность.
  alternative: «по Божьей воле», «согласно Божьему определению» или «в Божьих глазах»
  rationale: Греческий оборот не уточняет однозначно, идёт ли речь о соответствии Божьей воле, Божьей оценке или установленному Богом порядку. Более развёрнутый перевод преждевременно закрепил бы одно толкование.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Повтор «благочестие» сохраняет греческую атрибутивную конструкцию и делает длинное определение понятным; необычный, но ёмкий оборот «по Богу» оставлен ради смысловой открытости оригинала.
