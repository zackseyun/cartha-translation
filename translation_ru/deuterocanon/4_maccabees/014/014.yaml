  yaml_path: translation/deuterocanon/4_maccabees/014/014.yaml
  text: For even the irrational animals have toward the offspring born from them a sympathy and affection like that of human beings[a][b].
translation:
  language: ru
  text: Ведь даже неразумные животные испытывают к своему потомству[a] сочувствие и привязанность, подобные тем, что свойственны людям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к рождаемым от них», то есть к собственному потомству.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подобные человеческим». Греческий текст сравнивает сочувствие и привязанность животных с соответствующими чувствами людей.'
    reason: translation_clarity
lexical_decisions:
- source_word: ὅπου γε καὶ
  choice: Ведь даже
  rationale: В контексте оборот вводит подтверждающее основание и имеет усилительно-причинный, а не буквальный пространственный смысл.
- source_word: τὰ ἄλογα ζῷα
  choice: неразумные животные
  rationale: Передаёт противопоставление существ, не обладающих разумом, людям, сохраняя философский оттенок греческого выражения и естественность русского языка.
- source_word: τὴν πρὸς τὰ ἐξ αὐτῶν γεννώμενα
  choice: к рождённым от них
  rationale: Близко следует форме оригинала; по смыслу речь идёт о собственном потомстве животных, что пояснено в сноске.
- source_word: συνπίθειαν
  choice: сочувствие
  rationale: Передаёт значение сопереживания и внутренней сопричастности; более тёплый семейный оттенок выражен парным словом στοργή.
- source_word: στοργὴν
  choice: родительскую любовь
  rationale: В данном контексте στοργή означает естественную семейную привязанность родителей к потомству; такой перевод точнее простого «привязанность».
- source_word: ὁμοίαν ... τοῖς ἀνθρώποις
  choice: подобные человеческим
  rationale: Естественно передаёт сравнение чувств животных с соответствующими чувствами людей, не добавляя идеи полного тождества.
