    rationale: Греческое τὰ ἐξ αὐτῶν γεννώμενα буквально описывает рождающееся от животных, но по смыслу означает их потомство. Русская субстантивация «рождённым» требует пояснения и уступает естественному «своему потомству».
  - severity: low
    issue: «Родительскую любовь» несколько сужает и эксплицирует στοργή.
    rationale: В контексте естественная семейная привязанность несомненна, но στοργή не требует переводить именно словом «родительская любовь». «Привязанность» сохраняет значение без дополнительной спецификации.
