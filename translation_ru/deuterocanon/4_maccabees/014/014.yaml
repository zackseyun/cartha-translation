  verdict: revise
  source_fidelity: 'Основной смысл передан верно: ὅπου γε καὶ выражено как подтверждающее «Ведь даже»; τὰ ἄλογα ζῷα — «неразумные животные»; предмет чувства — их собственное потомство; сравнение относится к человеческим чувствам. Однако «рождённым от них» в основном тексте звучит неестественно и не вполне ясно без сноски.'
  naturalness: «К рождённым от них» — тяжёлая субстантивированная конструкция для современного литературного русского. «К своему потомству» естественно и точно передаёт смысл. Оборот «подобные человеческим» допустим, но «подобные тем, что свойственны людям» снимает эллипсис и делает объект сравнения ясным.
  terminology: '«Неразумные животные» уместно сохраняет философское противопоставление ἄλογα и людей. Для пары συνπάθειαν и στοργή предпочтительны «сочувствие и привязанность»: это не добавляет явно выраженной в русском «родительской» характеристики к одному лишь второму существительному и сохраняет различение двух чувств.'
