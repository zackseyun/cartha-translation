lexical_decisions:
- source_word: οὐδεὶς ἐκ τῶν ἑπτὰ μειρακίων
  choice: ни один из семи юношей
  rationale: Отрицательное местоимение с конструкцией ἐκ передано естественным русским оборотом «ни один из». μειράκιον обозначает юношу или молодого мужчину; «юношей» точно передаёт возраст и мужской род без детского оттенка слова «мальчики».
- source_word: ἐδειλίασεν
  choice: не струсил
  rationale: Глагол δειλιάω означает проявить трусость, утратить мужество. «Не струсил» сохраняет нравственный оттенок трусости и звучит естественно в современном русском.
- source_word: οὐδὲ
  choice: и не
  rationale: При общем отрицательном обороте «ни один» русское «и не» естественно связывает два однородных сказуемых и сохраняет нарастающее отрицание.
- source_word: πρὸς τὸν θάνατον
  choice: перед смертью
  rationale: В сочетании с ὀκνέω предлог πρὸς выражает отношение к предстоящей смерти. «Перед смертью» передаёт смысл столкновения с её угрозой без неестественного буквализма.
- source_word: ὤκνησεν
  choice: не отступил
  rationale: ὀκνέω может означать медлить, колебаться, робеть или отступать. В контексте мученической смерти «не отступил» ясно передаёт отсутствие уклонения и сохраняет отличие от предшествующего «не струсил».
theological_decisions:
- issue: Распределительное единственное число при упоминании семерых
  choice: 'Сохранено единственное число: «ни один… не струсил и не отступил»'
  alternative: 'Множественное число: «никто из семи юношей не струсил, и они не отступили»'
  rationale: В греческом οὐδεὶς и оба глагола стоят в единственном числе, распределяя утверждение на каждого из семерых. Русская конструкция с «ни один» точно и естественно сохраняет эту особенность, не превращая её в коллективное утверждение.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, торжественная и понятная. Синтаксическое единственное число оригинала сохранено непосредственно в основном тексте, поэтому примечание не требуется.
