lexical_decisions:
- source_word: πασῶν δὲ τῶν μητέρων
  choice: Но из всех матерей
  rationale: 'Родительный падеж имеет разделительное значение: «из всех матерей». Частица δέ обозначает лёгкий переход или противопоставление; «но» сохраняет этот оттенок.'
- source_word: ἐγένετο
  choice: стала
  rationale: Передаёт значение становления, выраженное ἐγένετο, а не заменяет его простой связкой «была».
- source_word: ἡ τῶν ἑπτὰ μήτηρ
  choice: мать семерых
  rationale: Греческий текст буквально говорит «мать семерых», не повторяя здесь слово «сыновей».
- source_word: φιλοτεκνοτέρα
  choice: самой преданной своим детям
  rationale: Сравнительная степень в сочетании с «из всех матерей» естественно получает превосходное значение. «Преданной своим детям» передаёт исключительную родительскую любовь без излишней сентиментальности.
- source_word: ἥτις
  choice: та, в которой
  rationale: Сохраняет пояснительно-качественную функцию местоимения и вводит основание сказанного о матери.
- source_word: ἑπτὰ κυοφορίας
  choice: за семь беременностей
  rationale: Винительный выражает протяжённость или охват семи беременностей; формулировка сохраняет телесный материнский образ и звучит естественно по-русски.
- source_word: τὴν πρὸς αὐτοὺς ... φιλοστοργίαν
  choice: привязанность к ним
  rationale: φιλοστοργία обозначает тёплую естественную семейную привязанность; материнский характер уже ясен из контекста и не требует добавления отдельного определения.
- source_word: ἐπιφυτευομένην
  choice: глубоко укоренилась
  rationale: Передаёт метафору насаждения и последующего укоренения чувства; возвратная конструкция по-русски естественнее буквального пассива «была насаждена».
