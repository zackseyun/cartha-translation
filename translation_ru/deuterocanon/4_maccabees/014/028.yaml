base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/028.yaml
  text: But not only that[a]; rather, because of the noble goodness of her sons and their obedience to the law[b], her motherly affection for them was even greater.
translation:
  language: ru
  text: Но её материнская любовь к ним была ещё сильнее не только поэтому, но и благодаря благородству и добродетели её сыновей[a] и их послушанию Закону[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может также передаваться как «нравственное совершенство»; оно соединяет добродетель с благородством характера.
    reason: lexical_alternative
  - marker: b
    text: То есть иудейскому Закону предков.
    reason: cultural_note
lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καὶ
  choice: 'Но не только это: благодаря'
  rationale: Оборот вводит дополнительное, усиливающее основание. Русская конструкция сохраняет риторический переход и естественно связывает его с последующим διά.
- source_word: καλοκἀγαθίαν
  choice: благородству и добродетели
  rationale: Греческое слово соединяет представления о нравственной добродетели и благородстве характера; парное выражение передаёт оба оттенка без архаичности.
- source_word: τῶν υἱῶν
  choice: своих сыновей
  rationale: Контекст однозначно указывает на сыновей этой матери; возвратное местоимение естественно для русского языка, а мужской род исходного слова сохранён.
- source_word: εὐπείθειαν
  choice: послушанию
  rationale: Слово обозначает готовность повиноваться; «послушание» ясно и естественно выражает это отношение к закону.
- source_word: τὸν νόμον
  choice: закону
  rationale: В контексте имеется в виду иудейский отеческий закон, однако строчная буква в основном тексте не устраняет эту контекстуальную определённость.
- source_word: μείζω
  choice: ещё более глубокую
  rationale: Сравнительная степень требует усиления относительно уже названной любви; в сочетании с «любовью» глубина звучит по-русски естественнее буквального «большую».
- source_word: φιλοστοργίαν
  choice: материнскую любовь
  rationale: Слово означает глубокую природную семейную привязанность; применительно к матери идиоматическое русское выражение передаёт и родственную, и эмоциональную сторону.
- source_word: ἐν αὐτοῖς ἔσχεν
  choice: она питала к ним
  rationale: Идиома выражает обладание чувством, направленным на сыновей; «питала к ним» сохраняет смысл и соответствует достойному литературному регистру.
theological_decisions:
- issue: К чему относится «закон»
  choice: Иудейский отеческий закон, Тора
  alternative: Закон вообще как нравственный принцип
  rationale: Во всём контексте 4 Маккавейской верность мучеников связана с соблюдением отеческого закона; примечание уточняет культурно-религиозный референт, не перегружая основной текст.
- issue: Родственное обозначение
  choice: сыновья
  alternative: дети
  rationale: Греческое υἱῶν имеет мужской род, а контекст говорит о матери и её семи сыновьях; нейтрализация здесь устранила бы конкретную деталь текста.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис сохраняет усилительный переход оригинала; парное «благородство и добродетель» раскрывает ёмкое греческое понятие, а «материнская любовь» естественно передаёт семейную привязанность в данном контексте.
