base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/024.yaml
  text: How can I describe the affection of parents for their children—the fervor that stamps into the small form of a child the marvelous likeness of soul and appearance[a], This is especially so because fathers make mothers more sympathetic toward those who have been born?
translation:
  language: ru
  text: Как мне описать жар любви родителей к детям, запечатлевающий в малом детском облике дивительное сходство души и внешности?[a] Особенно потому, что отцы делают матерей более сочувственными к своим детям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза необычайно сжата и использует образ печати: любовь родителей словно запечатлевает в ребёнке дивительное сходство души и внешности. Редкое слово, переданное как «детский облик», может также означать «детский отпечаток».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα τρόπον ἠθολογήσῃμι
  choice: Как мне описать
  rationale: Риторический вопрос передаёт затруднение говорящего; редкий глагол ἠθολογέω здесь означает изображать или описывать.
- source_word: φιλοτέκνα γονέων αἴθη
  choice: родительский жар любви к детям
  rationale: Сохраняет значение любви родителей к детям и образ эмоционального жара в αἴθη.
- source_word: ψυχῆς τε καὶ μορφῆς ὁμοιότητα
  choice: сходство души и внешности
  rationale: Передаёт внутреннюю и внешнюю стороны сходства, не сводя ψυχή лишь к характеру, а μορφή — к отвлечённой форме.
- source_word: εἰς μικρὸν παιδοχαρακτῆρα
  choice: в малом облике ребёнка
  rationale: Редкое сложное слово обозначает детский образ или отпечаток; выбран естественный русский оборот, совместимый с метафорой печати.
- source_word: θαυμάσιον ἐναποσφραγίζοντα
  choice: дивным образом запечатлевает
  rationale: Сохраняет образ печати или оттиска; синтаксически не вполне прозрачное θαυμάσιον передано наречным оборотом без искусственного согласования.
- source_word: συμπαθεστέρας
  choice: более способными сострадать
  rationale: Передаёт сравнительную степень и основную идею совместного переживания; возможны также значения большей отзывчивости или привязанности.
- source_word: τοῖς γεννηθεῖσιν
  choice: своим детям
  rationale: Буквально «рождённым»; в данном контексте речь идёт о потомстве, то есть детях этих родителей.
