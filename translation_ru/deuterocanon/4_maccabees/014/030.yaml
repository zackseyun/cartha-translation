base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/030.yaml
  text: But even so[a], although so many impulses of motherly love were drawing the mother toward sympathy[b], the all-varied tortures were not able by any one of them to turn aside her reason.
translation:
  language: ru
  text: Но всё же, хотя столь многие побуждения, связанные с любовью к детям[a], влекли мать к состраданию, никакая из всевозможных пыток не смогла отклонить её разум[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столь многое, связанное с любовью к детям». Греческое выражение говорит о сильном влечении, порождённом любовью к детям.'
    reason: lexical_alternative
  - marker: b
    text: «Разум» можно также передать как «решимость» или «разумное суждение». В этой книге данное слово обычно обозначает разум, властвующий над чувствами и страстями.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: Но всё же
  rationale: Передаёт усиленное противопоставление и уступительный поворот греческой фразы естественным современным русским оборотом.
- source_word: καίπερ
  choice: хотя
  rationale: Кратко и точно передаёт уступительное значение причастной конструкции.
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  choice: столь многое, связанное с любовью к детям
  rationale: Сохраняет неопределённую множественность подразумеваемых побуждений и не сужает φιλοτεκνία до отвлечённого чувства без указания на детей.
- source_word: φιλοτεκνίαν
  choice: любовью к детям
  rationale: Прямо передаёт любовь родителя к своим детям; в данном контексте речь идёт о матери, однако греческое слово само по себе не означает исключительно материнскую любовь.
- source_word: εἰς συμπάθειαν ἑλκόντων
  choice: влекло ... к состраданию
  rationale: Сохраняет образ эмоционального влечения и передаёт συμπάθεια как сочувственное сострадание к страданиям детей.
- source_word: τὴν μητέρα
  choice: мать
  rationale: Следует греческому определённому обозначению действующего лица без добавления притяжательного местоимения.
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  choice: ни в одном из этих случаев
  rationale: Передаёт отрицательную дистрибутивность оборота и сохраняет некоторую неопределённость местоименной отсылки, не утверждая категорически, относится ли она к побуждениям или к отдельным случаям страдания детей.
- source_word: αἱ παντοίκιλοι βάσανοι
  choice: всевозможные пытки
  rationale: Естественно по-русски передаёт разнообразие пыток, выраженное усилительным παντοίκιλοι, и конкретную жестокость βάσανοι.
- source_word: ἴσχυσαν μετατρέψαι
  choice: не смогли отклонить
  rationale: Передаёт как безуспешность воздействия, так и пространственную метафору изменения направления.
- source_word: τὸν λογισμὸν αὐτῆς
  choice: её разум
  rationale: Сохраняет ключевую для 4 Маккавейской книги философскую лексику господства разума над страстями, не подменяя её более узким понятием решимости.
theological_decisions:
- issue: Философски значимое значение λογισμός
  choice: её разум
  alternative: её решимость; её разумное суждение
  rationale: «Разум» поддерживает сквозную тему книги — власть разумного начала над чувствами и страстями. «Решимость» чрезмерно сужает смысл до волевой стойкости, тогда как «разумное суждение» возможно, но менее естественно в данном предложении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сохраняет длинную уступительно-противительную структуру оригинала, но остаётся понятным обычному читателю; философский термин «разум» сохранён последовательно.
