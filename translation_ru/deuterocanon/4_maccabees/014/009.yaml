lexical_decisions:
- source_word: θλῖψιν
  choice: муках
  rationale: В данном контексте слово обозначает тяжкие мучения юношей. «Муки» естественно связываются с описываемыми пытками и передают как телесное, так и душевное страдание.
- source_word: νεανιῶν
  choice: юношей
  rationale: Сохраняет мужской род и указание на молодой возраст мучимых братьев.
- source_word: φρίττομεν
  choice: содрогаемся
  rationale: Передаёт сильную, почти телесную реакцию ужаса, выраженную греческим глаголом.
- source_word: ὁρῶντες
  choice: видя это
  rationale: Сохраняет причастную форму и контраст между зрительным восприятием, слухом и непосредственным испытанием мук.
- source_word: παραχρῆμα
  choice: произнесённое тут же
  rationale: 'Передаёт временную непосредственность: угроза прозвучала на месте, в самый момент испытания.'
- source_word: ἀπειλῆς λόγον
  choice: угрожающее слово
  rationale: Сохраняет единственное число λόγον и риторическую конкретность выражения, не сводя его просто к абстрактной «угрозе».
- source_word: πάσχοντες
  choice: сами претерпевая эти муки
  rationale: 'Передаёт кульминацию: юноши не только видели и слышали происходящее, но лично испытывали мучения. «Сами» естественно подчёркивает непосредственность опыта.'
