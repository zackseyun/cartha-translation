  terminology: «Праведны», «мужественны», «великодушны» и «любили братьев» уместны. «Благоразумны» допустимо для σώφρονες, хотя несколько слабее подчёркивает самообладание; безопасной правки не требует. Для τὰ νόμιμα предпочтительно «предписания Закона» с примечанием об альтернативе «отеческие законы».
