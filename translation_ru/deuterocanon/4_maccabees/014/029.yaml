base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/029.yaml
  text: For they were righteous and self-controlled[a], brave and noble-minded and loving toward their brothers, and so devoted to their mother that, even to the point of death, they obeyed her by keeping the law.
translation:
  language: ru
  text: Ведь они были праведны и благоразумны, мужественны и великодушны, любили братьев и были так преданы своей матери, что даже до смерти слушались её, соблюдая предписания Закона[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отеческие законы»; греческое выражение стоит во множественном числе и может обозначать предписания Закона и унаследованные религиозные обычаи.'
    reason: Лексическая неоднозначность τὰ νόμιμα и его религиозно-исторический контекст.
lexical_decisions:
- source_word: δίκαιοί
  choice: праведны
  rationale: Передаёт нравственно-религиозную правоту в перечне добродетелей, не сужая смысл до одной лишь беспристрастности.
- source_word: σώφρονες
  choice: благоразумны
  rationale: В контексте 4 Маккавейской книги обозначает разумную сдержанность и владение собой; «благоразумны» естественно звучит рядом с другими качествами.
- source_word: ἀνδρεῖοι
  choice: мужественны
  rationale: Обозначает стойкую храбрость; современное русское слово сохраняет возвышенный регистр и не требует буквального акцента на мужском поле.
- source_word: μεγαλόψυχοι
  choice: великодушны
  rationale: Прямой и естественный эквивалент идеи «величия души», уместный в перечне нравственных достоинств.
- source_word: φιλάδελφοι
  choice: любили братьев
  rationale: 'Сохраняет конкретную братскую привязанность: речь идёт о братьях-мучениках, поэтому ссылка не нейтрализована.'
- source_word: φιλόμητρος
  choice: были так преданы матери
  rationale: Передаёт любовь и верность матери; число согласовано с составным подлежащим, хотя греческая форма неожиданно стоит в единственном числе.
- source_word: οὕτως, ὥστε
  choice: так ... что
  rationale: Естественно передаёт греческое соотношение степени и результата.
- source_word: μέχρι θανάτου
  choice: даже до смерти
  rationale: Подчёркивает предельную степень верности, сохраняя при этом краткость исходной фразы.
- source_word: τὰ νόμιμα
  choice: установления
  rationale: Сохраняет множественное число и охватывает предписания Закона и унаследованные религиозные нормы, не превращая выражение в абстрактное единственное число.
- source_word: φυλάσσοντας
  choice: соблюдая
  rationale: Обычное русское сочетание для исполнения религиозно-правовых предписаний.
- source_word: πείθεσθαι αὐτῇ
  choice: слушались её
  rationale: При личном дательном πείθομαι может означать послушание; русский оборот естественно выражает сыновнее повиновение матери.
theological_decisions:
- issue: Передача τὰ νόμιμα в контексте иудейского мученичества
  choice: установления
  alternative: Закон; отеческие законы; предписания
  rationale: Выбор сохраняет грамматическое множественное число греческого текста и религиозно-правовой смысл, не решая без необходимости, идёт ли речь исключительно о Торе как целом или о конкретных унаследованных нормах.
- issue: Конкретность φιλάδελφοι
  choice: любили братьев
  alternative: любили друг друга; любили своих близких
  rationale: Повествование говорит о братьях, а греческое слово прямо обозначает братскую любовь; конкретная родственная связь сохранена.
- issue: Связь послушания матери с соблюдением установлений
  choice: слушались её, соблюдая установления
  alternative: по её убеждению соблюдали установления; повиновались ей в соблюдении установлений
  rationale: Причастие φυλάσσοντας синтаксически относится к подразумеваемому субъекту πείθεσθαι. Формулировка сохраняет то, что послушание матери проявлялось в соблюдении установлений, не приписывая ей авторство самих норм.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим перечню добродетелей. Синтаксис остаётся ясным для широкого читателя; возвышенные слова «праведны», «мужественны», «великодушны» оправданы характером отрывка. Маркер [a] помещён непосредственно после слова, к которому относится примечание.
