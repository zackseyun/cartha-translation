  text: Ведь даже среди птиц[a] некоторые, устраивая гнёзда на крышах домов, защищают своих птенцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ручные [птицы], устраивающие гнёзда на крышах домов, защищают птенцов».'
    reason: Сохраняет прямое значение ἥμερα («ручные, приручённые»), которое в основном тексте передано обобщающим «некоторые».
lexical_decisions:
- source_word: πετεινῶν
  choice: птиц
  rationale: Родительный множественного числа обозначает птиц в широком смысле; «птиц» — естественный и точный русский эквивалент.
- source_word: τὰ μὲν ἥμερα
  choice: некоторые
  rationale: ἥμερα буквально означает «ручные, приручённые, кроткие». В данном сопоставлении выражение выделяет часть птиц; в основном тексте естественное «некоторые» сохраняет структуру мысли, а буквальный оттенок отмечен в сноске.
- source_word: κατὰ τὰς οἰκίας
  choice: на домах
  rationale: Предлог κατά с винительным указывает на расположение по домам или в их пределах. «На домах» сохраняет пространственную неопределённость выражения и не уточняет без достаточных оснований «под карнизами».
- source_word: ὀροφοποιοῦντα
  choice: устраивая гнёзда
  rationale: В контексте птиц сложный глагол описывает устройство гнезда в области кровли; русское «устраивая гнёзда» ясно передаёт действие без неестественного буквального «делая крыши».
- source_word: προασπίζει
  choice: защищают
  rationale: Глагол означает выступать в защиту, прикрывать; «защищают» передаёт активную родительскую охрану и естественно сочетается с множественным подлежащим.
- source_word: νεοττῶν
  choice: своих птенцов
  rationale: Слово обозначает молодых птиц, особенно птенцов. Возвратное «своих» естественно выражает подразумеваемую принадлежность потомства родителям.
