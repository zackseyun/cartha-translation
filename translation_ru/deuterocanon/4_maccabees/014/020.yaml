translation:
  language: ru
  text: Но материнская любовь к детям не поколебала мать юношей, разделявшую дух Авраама.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мать юношей, единодушную с Авраамом».'
    reason: Уточняет необычное греческое определение ὁμόψυχον, обозначающее общность внутреннего настроя с Авраамом; не вводит неточную альтернативу «подобная Аврааму».
lexical_decisions:
- source_word: μετεκίνησεν
  choice: не поколебала
  rationale: Глагол означает сдвинуть с места или изменить состояние; в данном контексте речь о попытке поколебать твёрдую решимость.
- source_word: συμπάθεια τέκνων
  choice: материнская любовь к детям
  rationale: Существительное передаёт сочувствие, сердечную привязанность и нежное чувство; контекст матери и детей позволяет естественно выразить это как материнскую любовь, не сводя смысл лишь к жалости.
- source_word: τέκνων
  choice: к детям
  rationale: Родительный падеж обозначает объект привязанности; принадлежность детей матери ясна из контекста и не требует добавления местоимения.
- source_word: ὁμόψυχον
  choice: единодушную с
  rationale: Прилагательное указывает на общность души, духа или внутреннего настроя. «Единодушную с Авраамом» кратко и естественно передаёт нравственную и духовную солидарность.
- source_word: τῶν νεανιῶν μητέρα
  choice: мать юношей
  rationale: νεανίαι обозначает юношей или молодых мужчин; «мать юношей» сохраняет лаконичную структуру греческого текста.
theological_decisions:
- issue: Характер сопоставления матери с Авраамом
  choice: Она названа единодушной с Авраамом, то есть разделяющей его внутренний настрой и стойкость.
  alternative: «Подобная Аврааму мать» либо указание на принадлежность к роду Авраама.
  rationale: ὁμόψυχον выражает общность души или расположения, а не прямо генеалогическую связь. Формулировка сохраняет сильное духовно-нравственное сопоставление, не уточняя его сверх сказанного.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный повествовательный регистр. Метафора внутреннего смещения передана глаголом «поколебала», а необычное сопоставление с Авраамом сохранено в основном тексте и пояснено в сноске.
