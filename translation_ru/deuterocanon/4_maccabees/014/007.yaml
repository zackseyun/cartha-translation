lexical_decisions:
- source_word: πανάγιε
  choice: всесвятая
  rationale: Форма звательного обращения с усилительным значением; «всесвятая» сохраняет возвышенный характер и согласуется с «седмица».
- source_word: συμφώνων
  choice: единодушных
  rationale: Передаёт согласие и единство братьев естественным современным русским словом.
- source_word: ἀδελφῶν
  choice: братьев
  rationale: Греческое слово стоит в мужском роде и относится к семи братьям повествования.
- source_word: ἑβδομάς
  choice: седмица
  rationale: Существительное обозначает совокупность семи; «седмица» сохраняет ораторскую возвышенность и позволяет передать персонифицированное обращение.
- source_word: κοσμοποιία
  choice: сотворение мира
  rationale: Ясно и естественно передаёт создание космоса.
- source_word: ἡμέραι
  choice: дни
  rationale: Прямое соответствие греческому слову.
- source_word: περὶ τὴν εὐσέβειαν
  choice: связаны с благочестием
  rationale: Передаёт сжатую греческую конструкцию без преждевременного уточнения характера связи; «благочестие» отражает религиозно-нравственный смысл εὐσέβεια.
theological_decisions:
- issue: Передача εὐσέβεια
  choice: благочестие
  alternative: набожность
  rationale: «Благочестие» — понятный и устойчивый русский богословско-нравственный термин, охватывающий почитание Бога и соответствующий образ жизни; «набожность» может звучать уже и обозначать преимущественно религиозное чувство.
- issue: Незавершённое сравнение
  choice: сохранить синтаксическую незавершённость стиха
  alternative: дополнить смысл из следующего стиха
  rationale: Греческий текст вводит сравнение посредством καθάπερ γάρ, которое продолжается далее; дополнение в этом стихе устранило бы намеренный перенос и могло бы навязать толкование.
translation_notes:
  register: Современный литературный русский с возвышенной ораторской интонацией. Редкое слово «седмица» сохранено ради образа единой группы из семи и грамматики торжественного обращения; многоточие показывает, что мысль продолжается в следующем стихе.
