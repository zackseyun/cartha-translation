  text: What could be more painful than these things? For the power of fire[a], being sharp and brief, quickly destroyed the bodies.
translation:
  language: ru
  text: Что могло быть мучительнее всего этого? Ведь острая и кратковременная сила огня быстро разрушила тела.[a]
