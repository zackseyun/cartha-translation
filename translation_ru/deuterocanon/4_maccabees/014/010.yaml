lexical_decisions:
- source_word: ὧν τί γένοιτο ἐπαλγέστερον;
  choice: Что могло быть мучительнее этого?
  rationale: Риторический вопрос передан естественно по-русски; сравнительная форма ἐπαλγέστερον выражает бо́льшую мучительность или болезненность пережитого.
- source_word: ὀξεῖα
  choice: острая
  rationale: Сохраняет образное значение «острая, пронзительная» применительно к действию огня, не сводя его лишь к интенсивности.
- source_word: σύντομος
  choice: кратковременная
  rationale: Передаёт основное значение «краткая, недолгая» и сохраняет различие с последующим ταχέως «быстро».
- source_word: ἡ τοῦ πυρὸς οὖσα δύναμις
  choice: сила огня
  rationale: Близко следует греческой конструкции и естественно звучит в современном литературном русском.
- source_word: ταχέως διέλυσε τὰ σώματα
  choice: быстро разрушила их тела
  rationale: διέλυσε буквально указывает на разложение, распад или разрушение; «разрушила» сохраняет широту значения и не добавляет более узкого образа полного сожжения. Местоимение «их» естественно обозначает тела упомянутых мучеников.
