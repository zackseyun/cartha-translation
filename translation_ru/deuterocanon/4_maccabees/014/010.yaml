  terminology: 'Специальных богословских терминов и имён нет. «Разрушила тела» сохраняет достаточно широкий смысл διέλυσε и не конкретизирует способ уничтожения как полное сожжение. Сноску следует исправить: «разложила» в современном русском прежде всего вызывает представление о разложении трупа и здесь неудачна.'
