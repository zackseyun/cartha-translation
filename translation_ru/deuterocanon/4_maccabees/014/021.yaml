  yaml_path: translation/deuterocanon/4_maccabees/014/021.yaml
  text: O reason[b][a], tyrant over the passions of children! And godliness is to a mother more longed for than children.
translation:
  language: ru
  text: О разум, тиран над страстями детей![a] И благочестие для матери желаннее, чем дети.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «О разум, тиран над детскими страстями!» Греческое сочетание допускает несколько способов связать слова «детей» и «страстей», но общий смысл остаётся тем же: разум господствует над страстями.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также восклицательное прочтение: «И о благочестие, для матери более желанное, чем дети!» В греческом тексте связка не выражена.'
    reason: alternative_reading
lexical_decisions:
- source_word: λογισμέ
  choice: разум
  rationale: В 4 Маккавейской книге λογισμός обозначает разумное суждение, господствующее над страстями; «разум» кратко и естественно передаёт эту ключевую тему.
- source_word: τέκνων
  choice: детей
  rationale: τέκνα означает детей или потомство без уточнения пола; «детей» сохраняет эту широту в обоих случаях.
- source_word: παθῶν
  choice: страстями
  rationale: В философско-нравственном контексте книги πάθη — это подвластные разуму сильные чувства и влечения, а не просто страдания.
- source_word: τύραννε
  choice: тиран над
  rationale: Слово передаёт образ безраздельного, властного господства. «Тиран над» сохраняет намеренную резкость греческой метафоры.
- source_word: εὐσέβεια
  choice: благочестие
  rationale: Здесь имеется в виду преданная почтительность к Богу. «Благочестие» передаёт религиозную направленность слова, не сводя его к общему нравственному качеству.
- source_word: μητρί
  choice: для матери
  rationale: 'Дательный падеж выражает отношение: благочестие является желаннее с точки зрения матери. Русское «для матери» естественно передаёт эту связь.'
- source_word: ποθεινοτέρα
  choice: желаннее
  rationale: Сравнительная форма выражает более сильное желание или стремление; «желаннее» сохраняет эмоциональную силу и сравнительную конструкцию.
theological_decisions:
- issue: Значение εὐσέβεια в рассказе о мученичестве
  choice: благочестие
  alternative: преданность Богу
  rationale: «Благочестие» сохраняет содержательную ёмкость греческого термина и указывает на ориентированную на Бога верность, не добавляя конфессионально специфического толкования.
- issue: Синтаксическая связь τέκνων в первой части
  choice: '«страстями детей»: τέκνων связано с παθῶν'
  alternative: Понимать τέκνων шире в связи со всем образом господства разума
  rationale: Ближайшая и наиболее прозрачная связь — «страсти детей», однако плотная цепочка родительных в греческом допускает некоторую синтаксическую неоднозначность; она отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного риторического обращения. Резкая метафора «тиран» оставлена намеренно; вторая часть сформулирована как естественное русское сравнительное утверждение, а возможное продолжение восклицательного обращения вынесено в сноску.
