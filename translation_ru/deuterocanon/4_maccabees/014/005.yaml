base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/005.yaml
  text: But all of them[a], as though running on a road to immortality, were hurrying toward death through tortures[b],
translation:
  language: ru
  text: Но все они, словно бегущие по дороге к бессмертию, спешили к смерти через пытки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через мучения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление предшествующему контексту естественным современным русским союзом.
- source_word: πάντες
  choice: все они
  rationale: Явно сохраняет собирательное указание на всю ранее названную группу.
- source_word: ὥσπερ
  choice: словно
  rationale: Вводит сравнение и не превращает образ в буквальное утверждение.
- source_word: ἐπʼ ἀθανασίας ὁδὸν
  choice: по дороге к бессмертию
  rationale: Сохраняет метафору пути и направление к бессмертию, избегая тяжеловесной буквальности.
- source_word: τρέχοντες
  choice: бегущие
  rationale: Прямо передаёт образ бега и согласуется с метафорой дороги.
- source_word: ἐπὶ τὸν ... θάνατον
  choice: к смерти
  rationale: Передаёт направление движения к конечному исходу и сохраняет связь с образом пути.
- source_word: διὰ τῶν βασάνων
  choice: через пытки
  rationale: Сохраняет как переживаемый путь к смерти, так и значение жестоких телесных истязаний; менее определённое «через мучения» отмечено в сноске.
- source_word: ἔσπευδον
  choice: спешили
  rationale: Передаёт продолжительное и устремлённое движение без неестественной для русского языка громоздкости.
theological_decisions:
- issue: Значение ἀθανασία в контексте мученичества
  choice: бессмертие
  alternative: вечная жизнь
  rationale: Существительное прямо означает бессмертие, то есть неподверженность смерти. Перевод сохраняет исходный богословски значимый термин, не подменяя его толкованием «вечная жизнь».
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным повествовательным звучанием. Сохранены параллельные образы бега, дороги и поспешного движения к смерти.
