  yaml_path: translation/deuterocanon/4_maccabees/014/027.yaml
  text: and[a], though she was compelled to feel sympathy for them because of the many pains each one of them suffered[b], because of fear toward God she overlooked the temporary preservation of her children.
translation:
  language: ru
  text: И хотя множество мук[a], выпавших на долю каждого из них, невольно заставляло её сострадать им, из страха перед Богом[b] она пренебрегала временным спасением[c] своих детей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может также означать «тяжкие боли», «мучительные страдания» или, буквально, «родовые муки».
    reason: lexical_alternative
  - marker: b
    text: 'То есть также: «из благоговейного трепета перед Богом».'
    reason: lexical_alternative
  - marker: c
    text: Здесь, по контексту, речь прежде всего о временном избавлении от смерти, то есть о сохранении земной жизни.
    reason: clarification
lexical_decisions:
- source_word: ὠδῖνας
  choice: мук
  rationale: Слово обозначает сильные боли или мучительные страдания; в контексте казни «муки» естественно передаёт тяжесть страданий каждого сына, не закрепляя образ родовых схваток.
- source_word: συμπάθειαν
  choice: сострадать
  rationale: Греческое существительное выражает сопричастность чужому страданию; русское «сострадать» естественно передаёт материнское сочувствие и совместное переживание боли.
- source_word: ἠναγκασμένην ... ἔχειν
  choice: невольно заставляло её сострадать
  rationale: Конструкция указывает на неизбежность материнского сострадания под воздействием увиденных мук. «Невольно» не означает сопротивления состраданию, а подчёркивает его непреодолимость.
- source_word: καθʼ ἕκαστον αὐτῶν
  choice: выпавших на долю каждого из них
  rationale: 'Сохранено распределительное значение: страдания каждого сына рассматриваются отдельно.'
- source_word: φόβον
  choice: страха
  rationale: Прямое значение φόβος сохранено, а сочетание «страх перед Богом» в современном русском допускает также смысл благоговения, не устраняя напряжения текста.
- source_word: ὑπερείδειν
  choice: пренебрегала
  rationale: Глагол означает не принять во внимание, поставить ниже высшего обязательства. Выбор сохраняет резкость текста, но не утверждает отсутствия материнской любви, поскольку её сострадание уже прямо названо.
- source_word: πρόσκαιρον σωτηρίαν
  choice: временным спасением
  rationale: «Спасение» сохраняет широкую семантику σωτηρία, а определение «временным» направляет читателя прежде всего к избавлению от непосредственной смерти, не устраняя полностью возможной многозначности.
theological_decisions:
- issue: Значение σωτηρία в контексте мученичества
  choice: временное спасение, прежде всего сохранение земной жизни
  alternative: временное избавление; сохранение жизни
  rationale: Контекст говорит о возможности избежать пыток и смерти. Вместе с тем буквальное «спасение» сохраняет лексическую широту греческого слова; сноска предотвращает его автоматическое понимание исключительно как духовного спасения.
- issue: Смысл φόβος по отношению к Богу
  choice: страх перед Богом
  alternative: благоговение перед Богом; трепет перед Богом
  rationale: Греческий текст прямо говорит о φόβος. Русское выражение сохраняет как страх, так и возможный оттенок благоговейного трепета, не сглаживая противопоставления материнского сострадания и верности Богу.
- issue: Нравственная сила ὑπερείδειν
  choice: пренебрегала
  alternative: не принимала во внимание; ставила ниже
  rationale: 'Сохранена провокационная сила утверждения: мать не предпочла кратковременное спасение детей верности Богу. Перевод не смягчает этого напряжения, но контекст сострадания исключает вывод о безразличии.'
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис перестроен в уступительную конструкцию для естественности по-русски, при этом сохранены индивидуализация страданий сыновей, неизбежность материнского сострадания и резкое богословско-нравственное напряжение заключительной части.
