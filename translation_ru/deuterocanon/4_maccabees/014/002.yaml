lexical_decisions:
- source_word: βασιλέως
  choice: царя
  rationale: Родительный падеж единственного числа передаёт принадлежность; определённое «царя» соответствует ближайшему контексту.
- source_word: λογισμοὶ
  choice: помыслы
  rationale: Слово обозначает мысли, рассуждения или внутренние решения. «Помыслы» сохраняет смысл внутреннего размышления и соответствует возвышенному, но понятному регистру.
- source_word: βασιλικώτεροι
  choice: более царственными
  rationale: Сравнительная степень сохранена, как и риторическая связь между «царём» и «царственными».
- source_word: ἐλευθερώτεροι
  choice: более свободными
  rationale: Сравнительная степень передана прямо; формулировка сохраняет параллелизм двух сравнительных прилагательных и не сужает свободу до одной лишь независимости.
