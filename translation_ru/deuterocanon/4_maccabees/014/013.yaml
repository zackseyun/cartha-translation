lexical_decisions:
- source_word: θεωρεῖτε
  choice: Посмотрите
  rationale: Форма повелительного наклонения во множественном числе призывает слушателей внимательно вглядеться в приводимый пример; «посмотрите» сохраняет и побудительную силу, и естественность современной русской речи.
- source_word: πολυπλόκος
  choice: многогранна
  rationale: Слово обозначает нечто сложно переплетённое, многосоставное. «Многогранна» естественно передаёт множественность проявлений, не внося отрицательного оттенка слова «сложна».
- source_word: ἡ τῆς φιλοτεκνίας στοργή
  choice: родительская привязанность
  rationale: φιλοτεκνία означает любовь к собственным детям, а στοργή — естественную семейную нежность и привязанность. Сочетание передано кратко и по-русски естественно, без необоснованного сужения значения до одной лишь материнской любви.
- source_word: ἕλκουσα
  choice: влечёт
  rationale: Сохраняет образ внутренней притягивающей силы привязанности и соответствует причастному значению, переданному отдельной частью предложения.
- source_word: πάντα
  choice: всё
  rationale: Сохраняет всеохватное и несколько неопределённое значение среднего рода множественного числа, не заменяя его более узким «всех».
- source_word: τὴν τῶν σπλάγχνων συμπάθειαν
  choice: к состраданию, идущему из глубины сердца
  rationale: σπλάγχνα буквально обозначает внутренности, но в эмоциональном употреблении — глубинный источник сильного чувства; συμπάθεια — сочувствие или сострадание. Перевод сохраняет глубину внутреннего переживания без неестественного анатомического буквализма.
theological_decisions:
- issue: Объём значения φιλοτεκνία в повествовании о матери семерых братьев
  choice: родительская привязанность
  alternative: материнская любовь
  rationale: Непосредственный контекст говорит о матери, однако само греческое слово шире и означает любовь родителей к своим детям. Основной текст сохраняет эту широту, а контекстуальный вариант отмечен в сноске.
- issue: Образность σπλάγχνα
  choice: из глубины сердца
  alternative: из внутренностей / всем нутром
  rationale: Греческий телесный образ указывает на глубочайшее внутреннее чувство. Русская формулировка передаёт его эмоциональную силу и достоинство, не превращая текст в грубый анатомический образ.
