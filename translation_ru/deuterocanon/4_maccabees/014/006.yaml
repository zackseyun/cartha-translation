base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/006.yaml
  text: For just as hands and feet move in harmony with the directions of the soul[a], so those holy youths also, as if by the immortal soul of godliness[b], were in harmony with death for its sake.
translation:
  language: ru
  text: Ведь подобно тому как руки и ноги движутся в согласии с велениями души, так и те святые юноши, словно движимые бессмертной душой благочестия[a], согласились на смерть ради него[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «богопочитания». Греч. εὐσέβεια означает благочестие, почитание Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом здесь повторяется корень со значением согласия: руки и ноги движутся «в согласии» с велениями души, а юноши «согласились» на смерть.'
    reason: wordplay
lexical_decisions:
- source_word: καθάπερ ... οὕτως
  choice: как… так и
  rationale: Сохраняет явную структуру сравнения и естественно звучит по-русски.
- source_word: συμφώνως τοῖς τῆς ψυχῆς ἀφηγήμασιν
  choice: согласно указаниям души
  rationale: «Указания» передаёт направляющую роль души, а «согласно» сохраняет корень согласия, повторённый далее в συνεφώνησαν.
- source_word: οἱ ἱεροὶ μειρᾶκες ἐκεῖνοι
  choice: те святые юноши
  rationale: «Юноши» точно передаёт возрастное обозначение μειρᾶκες, а «святые» — их священный, посвящённый характер.
- source_word: ὡς ὑπὸ ψυχῆς ἀθανάτου τῆς εὐσεβείας
  choice: словно под водительством бессмертной души благочестия
  rationale: «Словно» сохраняет сравнительный, а не догматически буквальный характер образа; «под водительством» естественно передаёт ὑπό и продолжает образ души, направляющей тело.
- source_word: πρὸς τὸν ὑπὲρ αὐτῆς ... θάνατον συνεφώνησαν
  choice: согласились принять смерть ради него
  rationale: Передаёт добровольное согласие на смерть ради благочестия; местоимение «него» грамматически соотнесено с русским словом «благочестие».
theological_decisions:
- issue: Олицетворение благочестия как бессмертной души
  choice: Сохранён образ «бессмертной души благочестия» с вводным «словно».
  alternative: «движимые бессмертным духом благочестия»
  rationale: Греческий текст создаёт риторическое сравнение с душой, управляющей членами тела. Перевод не превращает его в утверждение о самостоятельной сущности и не заменяет ψυχή словом «дух».
- issue: Отнесение αὐτῆς
  choice: «ради него» — ради благочестия
  alternative: «ради неё» — с сохранением грамматического рода греческого εὐσέβεια
  rationale: В русском местоимение согласуется со средним родом слова «благочестие», сохраняя при этом референт греческого αὐτῆς.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Синтаксис сохраняет развёрнутое сравнение оригинала; повтор «согласно — согласились» передаёт греческую игру однокоренных συμφώνως и συνεφώνησαν.
