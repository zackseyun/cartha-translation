lexical_decisions:
- source_word: οὕτως
  choice: Так
  rationale: Кратко и естественно вводит образ действия, связанный с предшествующим описанием.
- source_word: περὶ τὴν ἑβδομάδα
  choice: вокруг семерых
  rationale: В данном контексте ἑβδομάς обозначает семерых братьев как единое целое, а не календарную неделю.
- source_word: χορεύοντες
  choice: ведя хоровод
  rationale: Передаёт образ группового, кругового танца и сохраняет отличие причастия от следующего глагола движения по кругу.
- source_word: οἱ μεῖρακες
  choice: юноши
  rationale: Современное литературное и достойное обозначение молодых мужчин, подходящее к контексту братьев-мучеников.
- source_word: ἐκύκλουν
  choice: кружили
  rationale: Передаёт длительное или повторяющееся движение по кругу, выраженное имперфектом.
- source_word: τὸν βασάνων φόβον
  choice: страх перед пытками
  rationale: По-русски естественно передаёт страх, вызываемый предстоящими или совершаемыми пытками.
- source_word: καταλύοντες
  choice: прогоняя
  rationale: В контексте страха естественно выражает его устранение или преодоление, не превращая образ в отвлечённую формулу.
theological_decisions:
- issue: Значение ἑβδομάδα
  choice: семеро братьев как единая группа
  alternative: неделя
  rationale: Контекст повествования о мученичестве указывает на семерых братьев; календарное значение здесь не соответствует сцене.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным повествовательным тоном. «Ведя хоровод… кружили» намеренно сохраняет два однокоренных по смыслу элемента греческого образа — χορεύοντες и ἐκύκλουν — без тяжеловесного буквального повтора.
