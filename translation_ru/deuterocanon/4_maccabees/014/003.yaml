lexical_decisions:
- source_word: ἱερὰς
  choice: священные
  rationale: Передаёт связь с божественным и сохраняет возвышенный характер выражения; форма множественного числа соответствует греческому тексту.
- source_word: ἐναρμόστους
  choice: стройные
  rationale: Передаёт значение согласованности и гармонической соразмерности, естественно сочетаясь по-русски с метафорическим «созвучия».
- source_word: περὶ τῆς εὐσεβείας
  choice: в благочестии
  rationale: εὐσέβεια обозначает почтительную верность Богу, проявляющуюся в жизни; краткое «в благочестии» сохраняет богословскую ёмкость и выражает область согласия братьев.
- source_word: τῶν ἑπτὰ ἀδελφῶν
  choice: семи братьев
  rationale: Речь идёт о семи родных братьях-мужчинах; современная русская форма точна и естественна.
- source_word: συμφωνίας
  choice: созвучия
  rationale: Слово передаёт согласие, единство и заложенный в συμφωνία образ совместного звучания. Множественное число сохраняет морфологию греческого оригинала, хотя по-русски оно звучит поэтически.
theological_decisions:
- issue: Передача εὐσέβεια в контексте мученичества
  choice: благочестие
  alternative: богопочитание
  rationale: «Благочестие» охватывает и почитание Бога, и верность, выраженную в поступках, не сводя понятие только к обряду или внутреннему чувству.
- issue: Число и образность συμφωνίας
  choice: множественное число «созвучия»
  alternative: единственное число «единодушие»
  rationale: Греческие определения и существительное стоят во множественном числе; выбранная формулировка сохраняет это необычное риторическое выражение, не сглаживая его до привычного абстрактного единственного числа.
translation_notes:
  register: Возвышенный, но современный литературный регистр. Необычное множественное «созвучия» сознательно сохраняет поэтическую образность и число греческого текста; точка перед знаком сноски обусловлена тем, что предоставленный фрагмент завершает предложение.
