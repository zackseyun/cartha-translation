    rationale: Греческое ἐν ταῖς βασάνοις характеризует ситуацию, в которой эти мужчины подвергались мучениям. Русское «среди мучений» звучит неидиоматично и создаёт неясную связь с «одержал верх». Замена на «во время мучений» исправляет это без смыслового расширения.
  revised_text: И не считайте удивительным, что разум одержал верх над теми мужчинами во время мучений[a], ведь даже разум женщины пренебрёг более разнообразными страданиями[b].
