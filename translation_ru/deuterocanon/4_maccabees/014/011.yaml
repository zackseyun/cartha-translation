base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/014/011.yaml
  text: And do not consider it remarkable if reason gained the mastery over those men in their torments[b][a], since even a woman's mind looked down on more severe pains.
translation:
  language: ru
  text: И не считайте удивительным, что разум одержал верх над теми мужчинами во время мучений[a], ведь даже разум женщины пренебрёг более разнообразными страданиями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под пытками».'
    reason: лексическая альтернатива для βασάνοις
  - marker: b
    text: 'Или: «более многообразными муками»; возможное контекстуальное понимание: «более тяжкими страданиями».'
    reason: сохранение смыслового диапазона πολυτροπωτέρων ἀλγηδόνων
lexical_decisions:
- source_word: θαυμαστόν ... ἡγεῖσθε
  choice: не считайте удивительным
  rationale: Передаёт конструкцию со значением «не признавайте удивительным» естественным современным русским языком.
- source_word: λογισμός
  choice: разум
  rationale: Сохраняет ключевое для 4 Маккавейской книги понятие разумного начала, господствующего над страстями.
- source_word: περιεκράτησεν
  choice: одержал верх над
  rationale: Выражает решительное превосходство и господство, не утяжеляя фразу философским разъяснением.
- source_word: τῶν ἀνδρῶν ἐκείνων
  choice: над теми мужчинами
  rationale: Сохраняет явное противопоставление мужчин и женщины в греческом тексте.
- source_word: ἐν ταῖς βασάνοις
  choice: среди мучений
  rationale: Передаёт обстановку причиняемых мучений; возможность более конкретного «под пытками» отмечена в сноске.
- source_word: ὅπου γε καί
  choice: ведь даже
  rationale: Естественно передаёт усилительное обоснование, вводимое греческим оборотом.
- source_word: γυναικὸς νοῦς
  choice: разум женщины
  rationale: Сохраняет конкретное указание на женщину и параллель с λογισμός, при этом νοῦς передан тем же общеупотребительным словом ввиду близости понятий в данном контексте.
- source_word: πολυτροπωτέρων
  choice: ещё более разнообразными
  rationale: Сравнительная форма прежде всего указывает на большую многообразность или многовидность страданий, а не однозначно на их большую силу.
- source_word: ὑπερεφρόνησεν
  choice: пренебрёг
  rationale: Передаёт отношение к страданиям как к чему-то, над чем разум возвысился и что счёл недостойным внимания.
- source_word: ἀλγηδόνων
  choice: страданиями
  rationale: Естественное русское обозначение болезненных переживаний, допускающее как телесную боль, так и более широкое мучение.
theological_decisions:
- issue: Философское значение λογισμός в контексте мученичества
  choice: разум
  alternative: разумное суждение; разумное убеждение
  rationale: Краткий перевод сохраняет сквозную мысль книги о власти разума над страстями и не вводит более поздней богословской терминологии.
- issue: Гендерно маркированное противопоставление ἀνδρῶν и γυναικός
  choice: теми мужчинами ... разум женщины
  alternative: теми людьми ... женский разум
  rationale: Греческий текст намеренно сопоставляет мужчин с одной женщиной; нейтрализация устранила бы риторическую напряжённость стиха.
- issue: Характер сравнительной степени πολυτροπωτέρων
  choice: более разнообразными
  alternative: более тяжкими
  rationale: Лексема подчёркивает многообразие и многовидность. Контекст может подразумевать усиление страданий, но это не следует делать единственным смыслом основного текста.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным повествовательным строем. Сохранены риторическое сопоставление мужчин и женщины, философская лексика и неоднозначность характеристики страданий.
