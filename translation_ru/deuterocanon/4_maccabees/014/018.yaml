  yaml_path: translation/deuterocanon/4_maccabees/014/018.yaml
  text: And why is it necessary to point out[a], by means of the irrational animals[b], the affection for their children?
translation:
  language: ru
  text: И зачем показывать на примере неразумных животных[a] их привязанность к детёнышам[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посредством неразумных животных»; то есть животных, не обладающих разумом, в отличие от человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их родительскую любовь к потомству».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δεῖ
  choice: и зачем
  rationale: Оборот вводит риторический вопрос о ненужности дальнейшего доказательства; «зачем» естественно передаёт эту силу по-русски.
- source_word: διὰ τῶν ἀλόγων ζῴων
  choice: на примере неразумных животных
  rationale: Предлог διά указывает на средство или пример, а ἄλογος буквально обозначает отсутствие разума и сохраняет подразумеваемое противопоставление разумному человеку.
- source_word: ἐπιδεικνύναι
  choice: показывать
  rationale: Глагол означает показывать или доказывать наглядным примером; в сочетании «показывать на примере» это ясно и естественно.
- source_word: συμπάθειαν
  choice: привязанность
  rationale: Здесь слово обозначает родительское чувство и сердечную близость, а не современное узкое значение «сочувствие».
- source_word: πρὸς τὰ τέκνα
  choice: к детёнышам
  rationale: В отношении животных τέκνα естественно передаётся словом «детёныши»; притяжательное отношение следует из контекста.
