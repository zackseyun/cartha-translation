  yaml_path: translation/deuterocanon/4_maccabees/014/019.yaml
  text: For even bees[a], around the time of making honeycomb, defend themselves against those who approach, and, as with iron, strike with their stinger those who come near their brood[c][b], and defend them to the death.
translation:
  language: ru
  text: Ведь даже пчёлы[a] во время строительства сот защищаются от приближающихся и, словно железом, поражают жалом[b] тех, кто подходит к их расплоду[c], и защищаются до смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в пору производства воска»; греческое слово обозначает именно создание воска или сот, а не производство мёда вообще.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово может означать «остриё», «стрекало» или «жало»; применительно к пчёлам естественен перевод «жало».
    reason: lexical_alternative
  - marker: c
    text: Греческое слово означает «расплод», «выводок» и создаёт образ защиты потомства; сравнение носит риторический, а не строго зоологический характер.
    reason: cultural_note
lexical_decisions:
- source_word: ὅπου γε καὶ
  choice: Ведь даже
  rationale: Передаёт усилительное введение примера и его связь с предшествующим рассуждением естественным современным русским оборотом.
- source_word: μέλισσαι
  choice: пчёлы
  rationale: Прямое и однозначное соответствие греческому обозначению пчёл.
- source_word: περὶ τὸν τῆς κηρογονίας καιρὸν
  choice: во время строительства сот
  rationale: κηρογονία буквально связано с производством воска или созданием сот; выбранная формулировка естественна по-русски и не сводит смысл к производству мёда.
- source_word: ἐπαμύνονται
  choice: защищаются / защищая
  rationale: Глагол обозначает оборонительное сопротивление. При первом употреблении дополнение не выражено, а в заключении по контексту подразумевается защита расплода.
- source_word: τοὺς προσιόντας
  choice: приближающихся / тех, кто подходит
  rationale: Нейтрально передаёт субстантивированное причастие настоящего времени, не называя приближающихся нападающими без прямого основания в тексте.
- source_word: καθάπερ σιδήρῳ
  choice: словно железом
  rationale: Сохраняет выразительное сравнение греческого текста, не уточняя сверх текста, относится ли оно к твёрдости или силе удара.
- source_word: τῷ κέντρῳ
  choice: жалом
  rationale: В контексте пчёл κέντρον естественно означает орган, которым они жалят.
- source_word: πλήσσουσι
  choice: поражают
  rationale: Передаёт энергичное значение удара и подходит к возвышенному риторическому регистру отрывка.
- source_word: τῇ νοσσίᾳ αὐτῶν
  choice: к их расплоду
  rationale: νοσσιά обозначает выводок или потомство; «расплод» сохраняет образ защиты потомства и применимо к пчёлам.
- source_word: ἐπαμύνονται ἕως θανάτου
  choice: защищая его до смерти
  rationale: Сохраняет предельную меру защиты, выраженную ἕως θανάτου, и естественно связывает повторный глагол с ближайшим объектом — расплодом.
