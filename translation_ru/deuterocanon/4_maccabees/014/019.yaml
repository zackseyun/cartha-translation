translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной риторической образности оригинала. Повтор греческого ἐπαμύνονται передан не буквальным повторением одной формы, а синтаксически естественным «защищаются… защищая», при этом повторная идея защиты сохранена. Местоимение «его» указывает на расплод; греческий глагол во втором случае не имеет явно выраженного дополнения, поэтому смысловая связь отмечена как контекстуальная.
