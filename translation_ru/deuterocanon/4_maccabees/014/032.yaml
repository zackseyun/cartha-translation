  yaml_path: translation/deuterocanon/4_maccabees/014/032.yaml
  text: O sacred nature[a], and parents’ affections, and filial love toward parents, and nurture[b], and mothers’ unconquerable passions.
translation:
  language: ru
  text: О священная природа, родительская нежность[a], любовь детей к родителям, воспитание и неукротимые материнские чувства[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «родительские чары»; греческое слово φίλτρα могло обозначать любовные чары, но здесь естественнее понимать его как нежную привязанность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «неукротимые материнские переживания»; возможно также, хотя в данном контексте менее вероятно: «неодолимые страдания матерей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: φύσις ἱερά
  choice: священная природа
  rationale: «Природа» сохраняет широкий смысл φύσις — природный порядок и естественные родственные узы, — а «священная» передаёт возвышенное ἱερά без излишнего уточнения.
- source_word: φίλτρα γονέων
  choice: родительская нежность
  rationale: φίλτρα буквально могло обозначать любовные чары, но здесь естественно указывает на нежную родительскую привязанность; буквальное «чары» ввело бы читателя в заблуждение.
- source_word: γονεύσιν φιλοστόργε
  choice: любовь детей к родителям
  rationale: Дательный γονεύσιν обозначает направленность чувства к родителям, а φιλοστόργος выражает тёплую естественную любовь внутри семьи. Номинализация делает риторический ряд естественным по-русски.
- source_word: τροφεῖα
  choice: забота, с которой их растят
  rationale: Передаёт связанную с τροφή совокупность кормления, ухода и воспитания, не сужая значение до одного лишь питания.
- source_word: μητέρων ἀδάμαστα πάθη
  choice: неодолимые материнские чувства
  rationale: πάθη здесь вероятнее обозначает сильные переживания и привязанность, а ἀδάμαστα — то, что невозможно одолеть или укротить. «Чувства» в современном русском не несёт отрицательного оттенка слова «страсти».
theological_decisions:
- issue: Передача эмоционально насыщенных слов о семье без привнесения позднейшей доктринальной терминологии
  choice: Риторическое восклицание о естественных семейных узах и силе материнских чувств
  alternative: Понимать πάθη прежде всего как «страдания»
  rationale: Контекст подчёркивает непреодолимую силу родственной и материнской привязанности. При этом сноска сохраняет возможное значение «страдания», не превращая стих в однозначное догматическое утверждение.
translation_notes:
  register: Возвышенное риторическое восклицание передано современным литературным русским языком. Повторяющийся греческий καί воспроизведён перечислением с заключительным «и», чтобы сохранить накопительный эмоциональный эффект без тяжеловесности.
