  yaml_path: translation/deuterocanon/4_maccabees/014/022.yaml
  text: a mother[a], with two things set before her—godliness, and the temporary safety of her seven sons according to the tyrant’s promise[b];
translation:
  language: ru
  text: 'мать, перед которой стояли две возможности: благочестие[a] и временное сохранение жизни её семерых сыновей — согласно обещанию тирана[b];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть почтение к Богу и верность Ему; греческое εὐσέβεια можно также перевести как «набожность» или «преданность Богу».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «временное спасение» или «временное избавление». Речь идёт об обещанном тираном кратковременном сохранении земной жизни, а не обязательно о спасении в более полном богословском смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: мать
  rationale: Существительное без артикля продолжает синтаксический ход более широкого предложения; русский язык здесь не требует ни указательного слова, ни искусственно добавленной определённости.
- source_word: δυεῖν προκειμένων
  choice: перед которой стояли две возможности
  rationale: Оборот передаёт обстоятельство выбора между двумя предстоящими матери вариантами и сохраняет пространственную метафору πρόκειμαι, оставаясь естественным по-русски.
- source_word: εὐσεβείας
  choice: благочестие
  rationale: В 4 Маккавейской εὐσέβεια обозначает верность и почтение к Богу; «благочестие» сохраняет ёмкость исходного термина, а сноска поясняет его направленность.
- source_word: σωτηρίας προσκαίρου
  choice: временное сохранение жизни
  rationale: В данном контексте речь идёт о кратковременном избавлении от немедленной смерти, а не о спасении в более полном богословском смысле. Перевод ясно передаёт конкретный смысл сочетания.
- source_word: τῆς ἑπτὰ υἱῶν
  choice: её семерых сыновей
  rationale: Притяжательное «её» естественно выражает очевидное из контекста отношение сыновей к матери, хотя отдельного местоимения в греческом нет.
- source_word: κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  choice: согласно обещанию тирана
  rationale: κατά с винительным падежом означает соответствие или основание; ὑπόσχεσις — обещание тирана сохранить сыновьям жизнь при условии повиновения.
theological_decisions:
- issue: Передача εὐσέβεια в повествовании о мученичестве
  choice: благочестие
  alternative: почтение к Богу; преданность Богу
  rationale: «Благочестие» сохраняет нравственно-богословскую насыщенность термина и не сводит его лишь к внутреннему чувству; сноска раскрывает его направленность к Богу.
- issue: Передача σωτηρία в непосредственном контексте угрозы смерти
  choice: временное сохранение жизни
  alternative: временное спасение; временное избавление
  rationale: Такой перевод не приписывает слову эсхатологический смысл, которого контекст не требует, но сохраняет идею избавления, обещанного тираном.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования. Синтаксис сохраняет фрагментарную связь стиха с окружающим предложением; двоеточие ясно обозначает две стоявшие перед матерью возможности, а тире присоединяет уточнение об обещании тирана.
