lexical_decisions:
- source_word: ἡ μήτηρ
  choice: мать
  rationale: Прямой и естественный перевод, сохраняющий важную для контекста материнскую связь.
- source_word: τῶν ἐπτὰ νεανίσκων
  choice: семерых юношей
  rationale: Передаёт возрастную и мужскую характеристику νεανίσκων, не подменяя её словом «сыновей», поскольку родственная связь далее выражена словом τέκνων.
- source_word: ὑπήνεγκεν
  choice: стойко перенесла
  rationale: Глагол обозначает перенесение тяжёлого страдания; добавление «стойко» естественно выражает оттенок выдержки, присутствующий в контексте.
- source_word: στρέβλας
  choice: мучения
  rationale: Слово может обозначать как пытки вообще, так и более конкретно истязание на дыбе; основной текст сохраняет более широкое значение, а конкретная возможность отмечена в сноске.
- source_word: τὰς ἐφʼ ἑνὶ ἑκάστῳ τῶν τέκνων
  choice: мучения каждого из своих детей
  rationale: Сохраняет распределительное значение ἑνὶ ἑκάστῳ — страдания каждого ребёнка по отдельности — и материнскую перспективу слова τέκνων.
