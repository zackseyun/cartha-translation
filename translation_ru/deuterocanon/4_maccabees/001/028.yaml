lexical_decisions:
- source_word: καθάπερ οὖν
  choice: Итак, подобно тому как
  rationale: «Итак» передаёт выводный оттенок οὖν и связь с предыдущим рассуждением, а «подобно тому как» сохраняет сравнительную функцию καθάπερ.
- source_word: δυοῖν
  choice: два
  rationale: Двойственное число прямо указывает на два предмета — удовольствие и боль.
- source_word: τοῦ σώματος καὶ τῆς ψυχῆς
  choice: тела и души
  rationale: Родительные формы относятся к образу побегов и сохраняют антропологическую пару «тело и душа» без дополнительного истолкования.
- source_word: φυτῶν
  choice: побега
  rationale: Слово буквально связано с растениями и произрастанием. «Побега» естественно начинает ботанический образ, который далее продолжен словом παραφυάδες.
- source_word: ἡδονῆς τε καὶ πόνου
  choice: удовольствие и боль
  rationale: Это прямая и философски ясная передача двух основных переживаний, названных в греческом тексте.
- source_word: τῶν παθῶν
  choice: страсти
  rationale: В контексте рассуждения о власти разума πάθη обозначает страсти, то есть эмоциональные влечения и порывы, а не только страдания.
- source_word: παραφυάδες
  choice: ответвлениями
  rationale: «Ответвления» сохраняет ботаническую метафору боковых отростков и показывает зависимость многих страстей от удовольствия и боли.
theological_decisions:
- issue: Антропологическое значение ψυχή в сочетании σώματος καὶ ψυχῆς
  choice: тело и душа
  alternative: тело и жизнь; телесная и внутренняя жизнь
  rationale: В данном философском контексте ψυχή естественно означает «душа» и образует традиционную смысловую пару с телом. Перевод сохраняет понятийную структуру автора, не придавая ей более поздней догматической определённости.
translation_notes:
  register: Современный литературный русский язык с краткой философской формулировкой. Ботаническая метафора последовательно сохранена словами «побега» и «ответвлениями»; синтаксис сделан естественным для русского текста, при этом выводная и сравнительная связь оригинала не утрачена.
