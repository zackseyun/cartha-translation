  yaml_path: translation/deuterocanon/4_maccabees/001/032.yaml
  text: Among desires, some are of the soul and others of the body; and over both of these, reason is evidently master.
translation:
  language: ru
  text: Среди желаний одни относятся к душе, другие — к телу; и над теми и другими, как видно, властвует разум.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разум, как видно, одерживает верх и над теми и над другими».'
    reason: Лексическая альтернатива для ἐπικρατεῖ φαίνεται, сохраняющая значение преобладания или победы.
lexical_decisions:
- source_word: ἐπιθυμιῶν
  choice: желаний
  rationale: «Желания» передаёт широкое значение ἐπιθυμία и не придаёт слову исключительно отрицательного оттенка, что уместно в данном философском делении.
- source_word: ψυχικαί
  choice: относятся к душе
  rationale: Так сохраняется противопоставление душе и телу без сведения ψυχικαί лишь к интеллектуальному или психическому.
- source_word: σωματικαί
  choice: к телу
  rationale: Естественная и ясная пара к выражению «относятся к душе», сохраняющая антропологические категории исходного текста.
- source_word: λογισμός
  choice: разум
  rationale: В 4 Маккавейской λογισμός обозначает разумную способность или рассудочное суждение; «разум» кратко и естественно передаёт ключевой философский термин книги.
- source_word: ἐπικρατεῖ
  choice: властвует
  rationale: Глагол выражает превосходство, господство или способность одолевать. «Властвует» передаёт управляющую силу разума, не добавляя чуждой исходному тексту терминологии.
- source_word: φαίνεται
  choice: как видно
  rationale: Оборот передаёт значение явности или очевидности, сохраняя при этом возможный оттенок «оказывается / представляется».
theological_decisions:
- issue: Антропологическое различие между ψυχικαί и σωματικαί
  choice: одни желания относятся к душе, другие — к телу
  alternative: одни — душевные, другие — телесные
  rationale: Развёрнутая формулировка яснее для современного читателя и сохраняет категории исходного текста, не превращая их в более разработанный доктринальный дуализм.
- issue: Смысл λογισμός ἐπικρατεῖ
  choice: над теми и другими властвует разум
  alternative: разум одолевает и те и другие
  rationale: Основной текст передаёт господствующее положение разума; примечание сохраняет динамический оттенок глагола — «одерживает верх».
translation_notes:
  register: Современный литературный русский язык; философский тон сохранён без архаизации. Тире подчёркивает симметричное противопоставление души и тела, а «как видно» естественно передаёт φαίνεται.
