base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/010.yaml
  text: Therefore[a], it is incumbent on me to praise the men who, at this time, died with their mother for the sake of nobility and goodness; and, as for honors[b], to pronounce them blessed.
translation:
  language: ru
  text: Итак, мне надлежит восхвалить мужей, которые в то время вместе со своей матерью умерли ради благородства и добродетели[a]; а что до почестей — назвать их блаженными[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради добродетели». Греческое слово καλοκἀγαθία соединяет представления о благородстве, добре и нравственном совершенстве.'
    reason: lexical_alternative
  - marker: b
    text: Заключительная греческая фраза предельно сжата и допускает разные синтаксические истолкования. По смыслу, помимо похвалы мужам за их добродетель, говорящий воздаёт им честь, называя их блаженными.
    reason: alternative_reading
lexical_decisions:
- source_word: τῶν μὲν οὖν ἀρετῶν ... ἐπαινεῖν
  choice: Итак, мне надлежит восхвалить добродетели
  rationale: Сохраняет противопоставление «добродетелей» и «почестей» и передаёт ἐπεστί μοι как возложенную на говорящего обязанность.
- source_word: τοὺς ... ἀποθανόντας ... ἄνδρας
  choice: мужей, которые ... умерли
  rationale: Передаёт мужской референт ἄνδρας и естественно разворачивает греческое причастие в придаточное предложение.
- source_word: κατὰ τοῦτον τὸν καιρόν
  choice: в то время
  rationale: Естественно указывает на обсуждаемый исторический период.
- source_word: ὑπὲρ τῆς καλοκἀγαθίας
  choice: ради благородства и добра
  rationale: Передаёт соединённые в καλοκἀγαθία идеи нравственного благородства и доброты, не сводя выражение к одному более общему понятию добродетели.
- source_word: μετὰ τῆς μητρός
  choice: вместе со своей матерью
  rationale: Точно передаёт совместность их смерти с матерью; «своей» естественно соотносит мать с названными мужами.
- source_word: τῶν δὲ τιμῶν μακαρισμῷ ὤν
  choice: а воздавая им почести — назвать их блаженными
  rationale: Греческая концовка сжата и синтаксически трудна; перевод сохраняет переход от похвалы добродетелям к почести, выраженной провозглашением их блаженными.
theological_decisions:
- issue: Значение καλοκἀγαθία в контексте мученичества
  choice: благородство и добро
  alternative: добродетель; нравственное совершенство
  rationale: Выбранная формулировка сохраняет двойной этико-почётный оттенок греческого слова и не вводит позднейшей специальной богословской терминологии.
- issue: Смысл μακαρισμός
  choice: назвать их блаженными
  alternative: почтить их благословением; считать их счастливыми
  rationale: «Назвать блаженными» передаёт акт торжественного признания их блаженными, не смешивая его с благословением, даруемым говорящим.
- issue: Мужской референт ἄνδρας
  choice: мужей
  alternative: людей; сыновей
  rationale: «Мужей» сохраняет прямое мужское обозначение оригинала; «сыновей» было бы контекстуально понятно, но эксплицировало бы не названное здесь существительное.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным риторическим строем. «Надлежит», «мужей» и «блаженными» поддерживают достоинство пролога; синтаксис слегка развёрнут ради ясности сжатого греческого оригинала.
