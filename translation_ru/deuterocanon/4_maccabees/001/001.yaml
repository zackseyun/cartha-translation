base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/001.yaml
  text: Since I am about to demonstrate a most philosophical argument—whether devout reason is master of the passions—I would rightly advise you to give eager attention to philosophy[a].
translation:
  language: ru
  text: Намереваясь изложить в высшей степени философское рассуждение о том, властен ли благочестивый разум над страстями, я вполне обоснованно посоветовал бы вам с усердием уделить внимание философии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обладает ли благочестивый разум полной властью над страстями».'
    reason: 'Передаёт усиленный оттенок αὐτόδεσποτος: самостоятельное и полное господство.'
lexical_decisions:
- source_word: ΦΙΛΟΣΟΦΩΤΑΤΟΝ λόγον
  choice: в высшей степени философское рассуждение
  rationale: «Рассуждение» передаёт λόγος как развёрнутое доказательное изложение, а оборот «в высшей степени философское» сохраняет превосходную степень φιλοσοφώτατον без неестественного русского «самое философское».
- source_word: ἐπιδείκνυσθαι μέλλων
  choice: намереваясь представить
  rationale: Причастная конструкция выражает намерение приступить к публичному изложению и обоснованию тезиса. «Представить» сохраняет широту ἐπιδείκνυσθαι и не усиливает его до однозначного «доказать».
- source_word: εἰ
  choice: ли
  rationale: Вводит косвенный вопрос, а не условие.
- source_word: αὐτόδεσποτός
  choice: властен
  rationale: В контексте управления страстями слово обозначает самостоятельную господствующую власть. Краткое «властен» естественно по-русски; оттенок полноты власти сохранён в примечании.
- source_word: τῶν παθῶν
  choice: над страстями
  rationale: В эллинистической философской речи πάθη — страсти и эмоциональные влечения; управление ими естественно выражается по-русски сочетанием «властен над страстями».
- source_word: ὁ εὐσεβὴς λογισμός
  choice: благочестивый разум
  rationale: «Разум» передаёт рациональную способность, центральную для аргумента книги, а «благочестивый» сохраняет религиозную направленность εὐσεβής.
- source_word: συμβουλεύσαιμʼ ἂν ὑμῖν ὀρθῶς
  choice: я по праву посоветовал бы вам
  rationale: Условно-потенциальная форма передана вежливым «посоветовал бы», а ὀρθῶς — выражением «по праву», сохраняющим оценочный оттенок.
- source_word: ὅπως προθύμως προσέχητε
  choice: с усердием внимать
  rationale: «Внимать» передаёт сосредоточенное внимание, а «с усердием» — готовность и рвение, выраженные προθύμως.
- source_word: τῇ φιλοσοφίᾳ
  choice: философии
  rationale: Сохранено общее обозначение философии без добавления отсутствующего в греческом уточнения «этой».
theological_decisions:
- issue: Сочетание религиозного и философского смыслов в εὐσεβὴς λογισμός
  choice: благочестивый разум
  alternative: благочестивое рассуждение
  rationale: 'Основной вариант сохраняет разум как внутреннюю способность, но не превращает его в светскую рациональность: определение «благочестивый» указывает на его отношение к Богу.'
- issue: Степень власти разума над страстями в αὐτόδεσποτος
  choice: властен ли… над страстями
  alternative: обладает ли… полной властью над страстями
  rationale: Основной текст не разрешает заранее поставленный автором вопрос и не перегружает редкий греческий композит; более сильный оттенок независимой, полной власти дан как допустимая альтернатива в примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, философским звучанием. Синтаксис сохраняет риторическую протяжённость греческого предложения, но остаётся понятным обычному читателю.
