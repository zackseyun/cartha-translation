  yaml_path: translation/deuterocanon/4_maccabees/001/018.yaml
  text: And the forms of wisdom are prudence and justice and courage and self-control[a].
translation:
  language: ru
  text: Виды же мудрости — благоразумие, справедливость[a], мужество и самообладание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведность». Здесь δικαιοσύνη входит в перечень добродетелей, поэтому в основном тексте выбрано слово «справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴδεα
  choice: виды
  rationale: Слово обозначает формы или разновидности, в которых проявляется мудрость. «Виды» близко передаёт греческое выражение и естественно звучит по-русски.
- source_word: καθεστᾶσιν
  choice: —
  rationale: В этой конструкции глагол имеет связочное значение «являются»; в естественном русском перечислении оно передано именным сказуемым с тире.
- source_word: φρόνησις
  choice: благоразумие
  rationale: В перечне добродетелей речь идёт о рассудительности и здравом практическом суждении; «благоразумие» сохраняет философско-этический оттенок.
- source_word: δικαιοσύνη
  choice: справедливость
  rationale: В контексте классического перечня добродетелей слово обозначает прежде всего справедливость как этическое качество, а не специально богословское понятие праведности.
- source_word: ἀνδρία
  choice: мужество
  rationale: Это устоявшееся русское обозначение добродетели храбрости и стойкости; оно не требует буквального переноса этимологической связи с мужским полом.
- source_word: σωφροσύνη
  choice: самообладание
  rationale: Слово обозначает дисциплинированную сдержанность и власть над собой. «Самообладание» понятно современному читателю и уместно в данном перечне.
theological_decisions:
- issue: Передача δικαιοσύνη в философском перечне добродетелей
  choice: справедливость
  alternative: праведность
  rationale: Непосредственный контекст представляет классический перечень основных добродетелей, поэтому «справедливость» точнее передаёт этико-философское значение. Вариант «праведность», существенный в других библейских контекстах, сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством философского афоризма. Краткая именная конструкция сохраняет чеканный характер греческого перечня; повторяющиеся союзы переданы естественным русским перечислением.
