  yaml_path: translation/deuterocanon/4_maccabees/001/012.yaml
  text: But even about this it will now be possible to speak at once[a], beginning with the subject, as I am accustomed to do, and thus I will turn to the discourse about them[b], giving glory to the all-wise God.
translation:
  language: ru
  text: 'Но и об этом можно будет сказать сейчас же[a]: начав с изложения темы, как я обычно и делаю, я затем перейду к рассуждению о них[b], воздавая славу всемудрому Богу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сейчас же будет позволено сказать об этом»; греческое ἐξέσται может обозначать как возможность, так и дозволенность.'
    reason: lexical_alternative
  - marker: b
    text: Местоимение «них» может относиться к людям, о которых далее пойдёт речь; по ближайшему контексту возможно также понимание «об этих предметах».
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Но и
  rationale: Сохраняет переход и лёгкое усиление, не утяжеляя русскую фразу.
- source_word: περὶ τούτου
  choice: об этом
  rationale: Естественно передаёт широкую отсылку греческого выражения, не уточняя её преждевременно.
- source_word: νῦν αὐτίκα δή
  choice: сейчас же
  rationale: Передаёт усиленное значение непосредственности компактным и естественным русским оборотом.
- source_word: λέγειν ἐξέσται
  choice: можно будет сказать
  rationale: Сохраняет будущее время и основное значение возможности; оттенок дозволенности отмечен в сноске.
- source_word: ἀρξαμένων τῆς ὑποθέσεως
  choice: начав с самой темы
  rationale: Передаёт сжатую причастную конструкцию как указание на начало изложения темы, не воспроизводя неестественную для русского синтаксическую форму.
- source_word: ὅπερ εἴωθα ποιεῖν
  choice: как я обычно и делаю
  rationale: Естественно сохраняет авторское замечание о привычном способе изложения.
- source_word: εἰς τὸν περὶ αὐτῶν τρέψομαι λόγον
  choice: я затем перейду к рассуждению о них
  rationale: Передаёт риторический образ перехода к дальнейшему рассуждению и формальный оттенок λόγος.
- source_word: αὐτῶν
  choice: них
  rationale: Сохраняет неоднозначность местоименной отсылки; возможные референты пояснены в сноске.
- source_word: δόξαν διδοὺς
  choice: воздавая славу
  rationale: Устойчиво и точно передаёт доксологическое выражение.
- source_word: τῷ πανσόφῳ θεῷ
  choice: всепремудрому Богу
  rationale: Сохраняет возвышенный эпитет πανσόφῳ в понятной русской библейско-литературной форме.
theological_decisions:
- issue: Передача эпитета πανσόφῳ при θεῷ в доксологической формуле
  choice: всепремудрому Богу
  alternative: всемудрому Богу; премудрейшему Богу
  rationale: «Всепремудрый» передаёт всеохватность Божьей мудрости и поддерживает торжественный тон без внесения конфессионально специфического толкования.
