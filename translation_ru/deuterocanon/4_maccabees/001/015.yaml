  choice: слову мудрости
  alternative: учению мудрости; рассуждению мудрости; принципу мудрости
  rationale: Контекст допускает несколько оттенков λόγος. Основной текст сохраняет широту выражения, а примечание сообщает читателю о возможных значениях, не навязывая позднейшего технического или конфессионального понимания.
