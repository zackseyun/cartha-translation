    issue: Оборот «при праведной жизни» неточно передаёт μετὰ ὀρθοῦ βίου.
    rationale: Предлог μετά выражает сопутствие, а не условие. «Праведной» также уже и сильнее, чем нейтрально-этическое ὀρθός; «правильный образ жизни» сохраняет широкий нравственный смысл βίος.
  - severity: low
