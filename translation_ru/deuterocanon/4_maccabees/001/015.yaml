lexical_decisions:
- source_word: λογισμός
  choice: разум
  rationale: В данном философском определении слово обозначает способность к рациональному суждению и обдуманному выбору; «разум» передаёт это кратко и естественно.
- source_word: νοῦς
  choice: ум
  rationale: Обозначает мыслительную способность как таковую. «Ум» сохраняет различие между определяемым «разумом» и лежащей в его основе способностью.
- source_word: μετὰ ὀρθοῦ βίου
  choice: при праведной жизни
  rationale: Оборот связывает разум с нравственно правильным образом жизни. «При» естественно передаёт сопутствующее обстоятельство, а «праведная жизнь» — этический смысл ὀρθός и жизненный уклад βίος.
- source_word: προτιμῶν
  choice: отдаёт предпочтение
  rationale: Причастие выражает сознательное предпочтение одного другому; эта формулировка сохраняет сравнительную направленность глагола.
- source_word: τὸν σοφίας λόγον
  choice: слову мудрости
  rationale: Буквальная и достаточно открытая передача сохраняет многозначность λόγος, которое здесь может означать слово, учение, рассуждение или принцип.
