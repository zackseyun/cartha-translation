base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/034.yaml
  text: Therefore[a], though we desire creatures from the water, birds[b], and four-footed animals—all kinds of food forbidden to us by the law—we abstain because of the mastery of reason.
translation:
  language: ru
  text: Итак, хотя нам и хочется водных животных, птиц и четвероногих — всевозможной пищи, запрещённой нам законом, — мы воздерживаемся от неё благодаря господству разума.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «благодаря преобладанию (или господству) разума». Речь идёт о разуме, воспитанном законом и управляющем телесными желаниями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιγαροῦν
  choice: Итак
  rationale: Выводная частица связывает утверждение с предшествующим рассуждением; «итак» естественно передаёт логический вывод.
- source_word: ἐνύδρων
  choice: водных животных
  rationale: Слово обозначает обитающих в воде животных и не ограничивает смысл только рыбой.
- source_word: ἐπιθυμοῦντες
  choice: хотя нам и хочется
  rationale: 'Причастие выражает реальное желание, а в данном контексте имеет уступительный смысл: несмотря на желание, говорящие воздерживаются.'
- source_word: ὀρνέων
  choice: птиц
  rationale: Прямой и современный русский эквивалент общего названия птиц.
- source_word: τετραπόδων
  choice: четвероногих
  rationale: Сохраняет буквальный образ греческого слова и естественно употребляется как субстантивированное обозначение животных.
- source_word: παντοίων βρωμάτων
  choice: всевозможной пищи
  rationale: Передаёт собирательность βρωμάτων и широкий охват παντοίων без тяжеловесного буквального оборота.
- source_word: τῶν ἀπηγορευμένων ἡμῖν κατὰ τὸν νόμον
  choice: запрещённой нам законом
  rationale: Кратко и точно передаёт установленный законом запрет на такую пищу.
- source_word: ἀπέχομεθα
  choice: мы воздерживаемся от неё
  rationale: Глагол обозначает сознательный отказ; местоименное дополнение делает связь с перечисленной пищей ясной по-русски.
- source_word: διὰ τὴν τοῦ λογισμοῦ ἐπικράτειαν
  choice: благодаря господству разума
  rationale: Передаёт причинное значение διά и центральную для книги мысль о преобладающей, управляющей силе разума.
theological_decisions:
- issue: Значение λογισμός в философско-богословском рассуждении 4 Маккавейской
  choice: разум
  alternative: разумное суждение
  rationale: «Разум» кратко и последовательно передаёт ключевое понятие книги. Контекст подразумевает не отвлечённую способность, а дисциплинированный законом разум, управляющий желаниями; это пояснено в сноске без внесения конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; синтаксис сохраняет уступительное противопоставление между желанием запрещённой пищи и воздержанием. Тире отделяют пояснительное обобщение перечисления. Единственный маркер сноски [a] помещён непосредственно после относящегося к нему выражения.
