base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/006.yaml
  text: For reason does not rule over one's own passions[a], but over those things opposed to justice and courage and self-control and prudence; and over these, not so as to destroy them, but so as not to yield to them.
translation:
  language: ru
  text: Ведь разум властвует не над собственными страстями, а над теми, что противны справедливости[a], мужеству, самообладанию и благоразумию; и над ними он властвует не для того, чтобы уничтожить их, а для того, чтобы им не уступать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведности».'
    reason: Лексическая альтернатива для δικαιοσύνη; в данном перечне добродетелей основным вариантом выбрана «справедливость».
lexical_decisions:
- source_word: λογισμός
  choice: разум
  rationale: Ключевой философский термин обозначает способность рассуждать и выносить разумное суждение; «разум» кратко и естественно передаёт эту функцию.
- source_word: κρατεῖ
  choice: властвует
  rationale: Глагол выражает господство или власть над чем-либо; «властвует» сохраняет метафору управления и подходит к философскому рассуждению.
- source_word: παθῶν
  choice: страстями
  rationale: В данном этико-философском контексте πάθη — страсти и внутренние побуждения, а не страдания.
- source_word: δικαιοσύνης
  choice: справедливости
  rationale: Слово входит в традиционный перечень четырёх добродетелей, поэтому здесь естественнее «справедливость», а не «праведность».
- source_word: ἀνδρείας
  choice: мужеству
  rationale: Обозначает нравственную добродетель мужества или стойкости; выбран современный и общеупотребительный эквивалент.
- source_word: σωφροσύνης
  choice: самообладанию
  rationale: Передаёт дисциплинированное владение собой в этическом смысле, оставаясь понятным современному читателю.
- source_word: φρονήσεως
  choice: благоразумию
  rationale: φρόνησις здесь означает практическую мудрость, рассудительность; «благоразумие» сохраняет характер названия добродетели.
- source_word: καταλῦσαι
  choice: уничтожить
  rationale: Инфинитив означает устранить или упразднить; «уничтожить» ясно передаёт сильный контраст с отказом уступать страстям.
- source_word: μὴ εἴξαι
  choice: им не уступать
  rationale: εἴκω означает уступать, поддаваться или давать дорогу; формулировка естественно выражает постоянное сопротивление.
theological_decisions:
- issue: Передача δικαιοσύνη в эллинистическом перечне добродетелей
  choice: справедливость
  alternative: праведность
  rationale: Непосредственный контекст представляет четыре классические добродетели в философском рассуждении о разуме и страстях. «Справедливость» лучше отражает этот контекст, а допустимая альтернатива сохранена в сноске.
- issue: Связь ἑαυτοῦ с λογισμός
  choice: «собственными страстями» с сохранением грамматической отсылки к разуму
  alternative: «страстями человека»
  rationale: Греческий текст буквально говорит о собственных страстях разума. Хотя выражение создаёт философское напряжение, его не следует сглаживать добавлением отсутствующего в тексте субъекта «человек».
translation_notes:
  register: Современный литературный русский язык с достойным философским регистром. Повтор «властвует» во второй части делает синтаксическую связь прозрачной и не снимает напряжения исходного утверждения о том, что разум не уничтожает страсти, а не уступает им.
