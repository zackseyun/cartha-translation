  text: And within pleasure there is also a malicious disposition[a], being the most versatile of all the passions.
translation:
  language: ru
  text: А в удовольствии есть и порочная склонность, самая многоликая из всех страстей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принимающая больше всего различных форм среди всех страстей».'
    reason: Передаёт возможный акцент πολυτροπωτάτη на разнообразии форм и проявлений.
lexical_decisions:
- source_word: ἐν ... τῇ ἡδονῇ
  choice: в удовольствии заключена
  rationale: Передаёт включение данной склонности в рассматриваемую категорию удовольствия; добавление «заключена» делает эту связь естественной по-русски.
- source_word: κακοήθης διάθεσις
  choice: порочная склонность
  rationale: διάθεσις обозначает расположение или устойчивую склонность, а κακοήθης придаёт ей нравственно отрицательный, порочный характер.
- source_word: πολυτροπωτάτη
  choice: самая многоликая
  rationale: Сохраняет значение множества форм, проявлений или уловок у превосходной степени πολύτροπος, не привнося положительного оттенка слова «разносторонняя».
- source_word: πάντων τῶν παθῶν
  choice: из всех страстей
  rationale: В этико-философском контексте πάθη — это страсти и побуждения, которыми должен управлять разум.
- source_word: οὖσα
  choice: приложение «самая многоликая»
  rationale: Русская именная конструкция естественно передаёт описательную связь причастия с «порочной склонностью», не усиливая её до причинной.
theological_decisions:
- issue: Передача πάθη в эллинистическом иудейском философском контексте
  choice: страсти
  alternative: чувства; эмоции; аффекты
  rationale: «Страсти» сохраняет этико-философскую тему книги — власть разума над внутренними побуждениями — и не сводит речь к нейтральным эмоциям.
translation_notes:
  register: Современный литературный русский язык с умеренно философским регистром. Синтаксис сжат и достоин; «многоликая» сохраняет образность и неоднозначность греческого слова.
