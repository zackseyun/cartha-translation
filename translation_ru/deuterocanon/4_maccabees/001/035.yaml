base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/035.yaml
  text: For the passions of desires are held in check[a], being turned back by the self-controlled mind; and all the body's impulses are governed by reason.
translation:
  language: ru
  text: Ибо страсти, порождаемые желаниями, сдерживаются, будучи обращаемы вспять благоразумным умом; а все движения тела разум побуждает ревностно стремиться к чести[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а все телесные побуждения направляются разумом». Греческий глагол здесь необычен и обычно означает ревностно стремиться к чести или почёту; «движения тела» в данном контексте могут подразумевать и внутренние телесные побуждения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντέχεται
  choice: встречают сопротивление
  rationale: Передаёт значение противодействия и удерживания, не предполагая полного уничтожения страстей; форма греческого текста необычна, поэтому сохранена некоторая синтаксическая напряжённость.
- source_word: τὰ τῶν ὀρέξεων πάθη
  choice: страсти, порождённые желаниями
  rationale: Естественно по-русски передаёт сочетание πάθη и ὀρέξεις, сохраняя различие между страстными состояниями и желаниями как их источником.
- source_word: σώφρονος νοὸς
  choice: благоразумным умом
  rationale: «Благоразумный» объединяет оттенки здравомыслия, умеренности и самообладания, присущие σώφρων, и звучит естественнее, чем буквальное «самообузданный ум».
- source_word: ἀνακαμπτόμενα
  choice: обращаются вспять
  rationale: Сохраняет образ поворота назад или отведения, заложенный в причастии.
- source_word: φιλοτιμοῦνται
  choice: направляет к достойному
  rationale: Необычное употребление глагола связано со стремлением к чести и достойному; перевод сохраняет этот смысл, не сводя его просто к управлению.
- source_word: κινήματα
  choice: телесные побуждения
  rationale: В контексте нравственной психологии речь идёт не только о физических движениях, но и о внутренних телесных импульсах.
- source_word: λογισμοῦ
  choice: разум
  rationale: Ключевой философский термин книги, обозначающий рассудочную способность и разумное суждение.
theological_decisions:
- issue: Антропологический язык нравственной психологии
  choice: Разум противостоит страстям и направляет телесные побуждения к достойному.
  alternative: 'Можно перевести более обобщённо: «все телесные побуждения управляются разумом».'
  rationale: Выбранный текст сохраняет эллинистическо-иудейские категории разума, страстей и телесных движений, не вводя позднейших понятий вроде «греховной природы».
- issue: Необычное значение φιλοτιμοῦνται
  choice: Сохранена связь с честью и достойной целью.
  alternative: Истолковать глагол контекстуально как «обуздываются» или «управляются».
  rationale: Греческий глагол обычно выражает честолюбивое стремление или усердное стремление к чести; редкое употребление не следует полностью сглаживать.
translation_notes:
  register: Современный литературный русский язык с достоинством философско-нравственного рассуждения. Термины понятны обычному читателю; необычность второй части греческого текста сохранена в основном тексте и пояснена сноской.
