lexical_decisions:
- source_word: παλαιαὶ
  choice: древние
  rationale: Передаёт давний, издавна существующий характер этих последовательностей, не сводя смысл к нейтральному «старые».
- source_word: περὶ τὴν ἡδονὴν καὶ τὸν πόνον
  choice: связанные с наслаждением и страданием
  rationale: περί с винительным указывает на область или предмет; этот оборот естественно выражает отношение, не уточняя его сверх греческого текста.
- source_word: παθῶν
  choice: страстей
  rationale: В философском контексте книги речь идёт о владеющих человеком аффектах и побуждениях, над которыми господствует разум; «страсти» сохраняет этот оттенок лучше, чем широкое «эмоции».
- source_word: ἀκολουθίαι
  choice: последовательности
  rationale: Слово обозначает то, что следует одно за другим, то есть последовательности или ряды; выбранный вариант сохраняет идею упорядоченного следования, не привнося причинности.
theological_decisions:
- issue: Философско-антропологический смысл πάθη в 4 Маккавейской книге
  choice: страсти
  alternative: эмоции; аффекты
  rationale: «Страсти» сохраняет философский смысл неразумных внутренних побуждений, подвластных разуму, и не отождествляет их со всеми эмоциями вообще.
translation_notes:
  register: Современный литературный русский язык с умеренно философским регистром. Синтаксис сохраняет краткость и абстрактность греческого высказывания; подлинная неопределённость отношения, выраженного περί, не снимается.
