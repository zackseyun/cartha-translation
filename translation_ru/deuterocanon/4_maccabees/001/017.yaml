  text: This[a], then, is the instruction of the law[b], by which we learn divine matters reverently and human matters profitably.
translation:
  language: ru
  text: Итак, это и есть воспитание Закона[a], благодаря которому мы с благоговением познаём божественное, а человеческое — с пользой[b].
