  text: but it also is shown to rule over the passions that hinder righteousness[a], such as malice, and over the passions that hinder courage—anger, pain, and fear.
translation:
  language: ru
  text: но он, как видно, господствует и над страстями, препятствующими праведности[a], например над злобой, а также над страстями, препятствующими мужеству, — гневом, болью и страхом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κυριεύειν
  choice: господствует над
  rationale: Передаёт осуществление власти и контроля; формулировка сохраняет философский тезис оригинала без лишнего истолкования.
- source_word: ἀναφαίνεται
  choice: как видно
  rationale: Передаёт значение явленности или очевидности и естественно звучит в русском рассуждении.
- source_word: ἐμποδιστικῶν
  choice: препятствующими
  rationale: Точно выражает способность названных страстей мешать соответствующей добродетели.
- source_word: παθῶν
  choice: страстями
  rationale: В данном нравственно-философском контексте речь идёт об аффектах и внутренних побуждениях, а не о внешних страданиях.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: Сохраняет основной проектный эквивалент δικαιοσύνη; возможное значение «справедливость» отмечено в сноске.
- source_word: κακοηθείας
  choice: злобой
  rationale: Естественно и кратко передаёт дурной нрав, злонамеренность или недоброжелательность.
- source_word: ἀνδρείας
  choice: мужеству
  rationale: Обычный русский термин для классической добродетели стойкой храбрости; здесь он не ограничен мужским полом.
- source_word: θυμοῦ
  choice: гневом
  rationale: В перечне мешающих страстей уместно отрицательно окрашенное значение слова θυμός.
- source_word: πόνου
  choice: болью
  rationale: В контексте испытания мужества наиболее прямо передаёт физическую или душевную боль; значение «труд» здесь менее вероятно.
- source_word: φόβου
  choice: страхом
  rationale: Точно передаёт основное значение слова без неоправданного усиления до «ужаса».
theological_decisions:
- issue: Передача δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: В нравственно-философском перечне добродетелей возможны оба значения. Основной текст сохраняет «праведность», а сноска — реальную лексическую альтернативу, не сводя понятие только к судебной справедливости.
translation_notes:
  register: Современный литературный русский язык с достоинством философско-нравственного рассуждения. Повтор «над страстями, препятствующими...» сохранён ради ясной параллельной структуры греческого текста.
