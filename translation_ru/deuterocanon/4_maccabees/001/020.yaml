  text: The two most comprehensive kinds of passions are pleasure and pain[a]; and each of these is by nature also connected with the soul.
translation:
  language: ru
  text: Два самых общих вида страстей — удовольствие и боль[a]; и каждое из них по природе также связано с душой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Двумя наиболее всеобъемлющими природами страстей являются удовольствие и боль». Греческая фраза сжата; слово, переведённое как «виды», буквально означает «природы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παθῶν
  choice: страстей
  rationale: В философско-нравственном контексте πάθη — это страсти, то есть аффективные влечения и состояния, а не только страдания или эмоции.
- source_word: φύσεις
  choice: вида
  rationale: Буквально «природы»; здесь слово служит классификации страстей, поэтому «виды» естественно передаёт смысл, а буквальный вариант отмечен в сноске.
- source_word: περιεκτικώταται
  choice: наиболее всеобъемлющих
  rationale: Превосходная степень указывает на самые широкие категории, охватывающие остальные страсти.
- source_word: ἡδονή τε καὶ πόνος
  choice: удовольствие и боль
  rationale: Эта устойчивая смысловая пара точно передаёт противопоставление в античном этико-философском рассуждении.
- source_word: ἑκάτερον
  choice: каждое из них
  rationale: Форма распределительно относится к двум только что названным видам.
- source_word: περὶ τὴν ψυχὴν πέφυκεν
  choice: по природе связано также с душой
  rationale: πέφυκεν выражает природное, неотъемлемое свойство, а περί с винительным здесь обозначает отношение к душе; перевод сохраняет несколько общую формулировку греческого текста.
theological_decisions:
- issue: Антропологический термин ψυχή
  choice: душа
  alternative: жизнь; внутреннее «я»
  rationale: В данном философско-антропологическом рассуждении речь идёт о внутренней стороне человека, а не просто о биологической жизни; «душа» сохраняет терминологическую связь без дополнительной догматической конкретизации.
translation_notes:
  register: Современный литературный русский язык с достоинством философского рассуждения. Сохранены исходная двухчастная структура и смысловой акцент на природной связи с душой; не добавлен отсутствующий в греческом временной или связующий маркер.
