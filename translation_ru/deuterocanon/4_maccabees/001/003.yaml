lexical_decisions:
- source_word: εἰ ἄρα
  choice: итак, если
  rationale: «Если» сохраняет условное значение εἰ, а «итак» передаёт выводный оттенок ἄρα и связь с ходом рассуждения.
- source_word: τῶν σωφρονούντων
  choice: мешающими самообладанию
  rationale: Греческое выражение синтаксически сжато и допускает более буквальное отнесение к людям, проявляющим самообладание. В контексте оно естественно понимается как указание на страсти, препятствующие самообладанию; неоднозначность отмечена в сноске.
- source_word: κωλυτικῶν παθῶν
  choice: над страстями, мешающими
  rationale: κωλυτικός означает «мешающий, препятствующий», а πάθη здесь — внутренние страсти или влечения.
- source_word: ὁ λογισμός
  choice: разум
  rationale: В философской аргументации 4 Маккавейской λογισμός обозначает разумное суждение или руководящую способность разума; краткое «разум» естественно и сохраняет понятийную значимость термина.
- source_word: φαίνεται ἐπικρατεῖν
  choice: как видно, одерживает верх над
  rationale: φαίνεται передаёт явленность или очевидность утверждения, а ἐπικρατεῖν — превосходство и победу над чем-либо. Формулировка сохраняет доказательный тон автора.
- source_word: γαστριμαργίας
  choice: чревоугодием
  rationale: Слово обозначает неумеренность в еде; «чревоугодие» — точный и узнаваемый русский эквивалент.
- source_word: ἐπιθυμίας
  choice: желанием
  rationale: ἐπιθυμία имеет широкое значение желания или влечения. «Желание» не сужает смысл до половой страсти без достаточного контекстуального основания.
theological_decisions:
- issue: Философско-антропологический смысл λογισμός
  choice: разум
  alternative: разумное суждение; разумная способность
  rationale: Текст утверждает превосходство дисциплинированного разума над страстями. «Разум» сохраняет этот тезис, не привнося позднейшей специальной терминологии.
- issue: Смысл τῶν σωφρονούντων в сжатой греческой конструкции
  choice: функционально отнесено к самообладанию, которому мешают страсти
  alternative: «над страстями, препятствующими тем, кто проявляет самообладание»
  rationale: Основной вариант ясно выражает вероятный смысл в контексте рассуждения, а сноска сохраняет формально возможное прочтение, не устраняя подлинную синтаксическую неоднозначность.
