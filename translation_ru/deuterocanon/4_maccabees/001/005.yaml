  source_fidelity: 'Основной смысл передан верно: λογισμός — «разум», πάθη — «страсти», λήθη и ἀγνοία — «забывчивость» и «неведение». Однако в русском вопросе утрачено смысловое «также» (подразумеваемое противопоставление: если разум господствует над страстями, почему он не господствует и над этими состояниями), а «он не властен» звучит как утверждение автора, тогда как греческое οὐ δεσπόζει — вопросительное возражение: «разве он не господствует?»'
  naturalness: «Как же тогда» избыточно сочетает два близких связующих элемента; «Как же» естественнее. «Возможно, скажут некоторые» допустимо, но «кто-нибудь мог бы спросить» лучше передаёт потенциальный характер ἴσως + optativus + ἄν и оформляет реплику как возражение. Финальное «они говорят нелепость» несколько тяжеловесно и менее близко к конструкции; «смешны, пытаясь так говорить» естественно и сохраняет связь оценки с возражающими.
  terminology: «Разум», «страсти» и «неведение» удачны для философской лексики 4 Маккавейской книги. «Забывчивость» приемлема для λήθη. Следует сохранить сноску об альтернативном безличном прочтении γελοῖον ἐπιχειροῦντες λέγειν.
