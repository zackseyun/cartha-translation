base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/005.yaml
  text: How then[a], perhaps some might say, if reason rules over the passions, does it not also master forgetfulness and ignorance? In attempting to say this, they are being ridiculous.
translation:
  language: ru
  text: «Как же, — возможно, спросит кто-нибудь, — если разум господствует над страстями, разве он не господствует также над забывчивостью и неведением?» Смешны они, пытаясь так говорить.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нелепо пытаться так говорить». Греческое выражение γελοῖον ἐπιχειροῦντες λέγειν можно понять либо безлично, либо как оценку самих возражающих.'
    reason: alternative_reading
lexical_decisions:
- source_word: πῶς οὖν
  choice: Как же тогда
  rationale: Передаёт переход к возможному возражению и сохраняет форму риторического вопроса.
- source_word: ἴσως εἴποιεν ἄν τινες
  choice: возможно, скажут некоторые
  rationale: Сочетание ἴσως с оптативом и ἄν выражает предположительное высказывание неопределённых оппонентов; по-русски это естественно передаётся вводным словом «возможно».
- source_word: τῶν παθῶν
  choice: над страстями
  rationale: В философско-этической аргументации книги πάθη — внутренние страсти и влечения, которыми должен управлять разум, а не внешние страдания.
- source_word: ὁ λογισμὸς
  choice: разум
  rationale: Здесь λογισμός обозначает способность рассуждать и выносить разумные суждения; «разум» кратко и естественно сохраняет философский смысл.
- source_word: κρατεῖ
  choice: властвует
  rationale: Глагол обозначает обладание властью и превосходство над страстями; «властвует» сохраняет образ господства.
- source_word: λήθης καὶ ἀγνοίας
  choice: над забывчивостью и неведением
  rationale: «Забывчивость» передаёт λήθη как неспособность удержать в памяти, а «неведение» — ἀγνοία как отсутствие знания, не смешивая его с намеренным игнорированием.
- source_word: οὐ δεσπόζει
  choice: не властен
  rationale: δεσπόζω выражает господство или полную власть. Формулировка естественна по-русски и сохраняет смысловую связь с «властвует».
- source_word: γελοῖον ἐπιχειροῦντες λέγειν
  choice: пытаясь это утверждать, они говорят нелепость
  rationale: Основной текст относит полемическую оценку к предполагаемым оппонентам, но неоднозначность конструкции отмечена в сноске.
theological_decisions:
- issue: Философско-антропологические термины λογισμός и πάθη
  choice: «разум» и «страсти»
  alternative: «рассудок» или «разумное суждение»; «чувства», «влечения» или «эмоции»
  rationale: Выбранная пара сохраняет центральное для 4 Маккавейской книги противопоставление разумной способности и подлежащих управлению страстей, не привнося позднейшей конфессиональной терминологии.
- issue: Синтаксическая отнесённость γελοῖον ἐπιχειροῦντες λέγειν
  choice: 'Оценка отнесена к неназванным оппонентам: «они говорят нелепость»'
  alternative: 'Безличное понимание: «нелепо пытаться это утверждать»'
  rationale: Причастие множественного числа естественно соотносится с ранее упомянутыми «некоторыми», однако греческая конструкция допускает и безличную передачу; эта подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно философским, полемическим звучанием. Термины «разум», «страсти», «неведение» поддерживают достоинство и понятийную последовательность текста, оставаясь понятными широкому читателю.
