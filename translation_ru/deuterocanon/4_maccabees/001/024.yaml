translation_notes:
  register: Современный литературный русский язык с сохранением философского термина «страсть». Частица «же» отражает δέ и связь стиха с предшествующим рассуждением. Формулировка оставляет несколько необычное утверждение об общей связи гнева с удовольствием и болью без истолковывающего сглаживания.
