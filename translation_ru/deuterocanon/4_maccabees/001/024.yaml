translation:
  language: ru
  text: Гнев же — это страсть, общая для удовольствия и боли, если кто-нибудь задумается о том, когда гнев охватил его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμός
  choice: гнев
  rationale: В данном перечне страстей слово обозначает гнев; это прямой и естественный русский эквивалент.
- source_word: κοινὸν πάθος
  choice: страсть, общая для
  rationale: Сохраняет философскую терминологию πάθος и мысль о том, что гнев связан как с удовольствием, так и с болью, не уточняя характер этой связи сверх греческого текста.
- source_word: ἡδονῆς καὶ πόνου
  choice: удовольствия и боли
  rationale: Передаёт оба родительных падежа буквально и сохраняет их параллелизм.
- source_word: ἐὰν ἐννοηθῇ τις
  choice: если задуматься
  rationale: 'Естественно передаёт безлично-пассивную по форме условную конструкцию: «если кто-либо поразмыслит».'
- source_word: ὅτε αὐτῷ περιέπεσεν
  choice: о том, когда он овладел человеком
  rationale: Передаёт момент, когда гнев постиг человека; «овладел» идиоматично для русской речи о гневе, а «человеком» сохраняет обобщённость греческого τις/αὐτῷ.
