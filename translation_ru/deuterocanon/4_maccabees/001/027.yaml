translation:
  language: ru
  text: а в отношении тела — неразборчивость в пище, чревоугодие и еда в одиночку[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «употребление лишь одного вида пищи», «однообразное питание». Греческое слово μονοφαγία допускает такое буквальное понимание по составу слова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ σῶμα
  choice: а в отношении тела
  rationale: Κατά с винительным обозначает сферу, к которой относятся перечисленные пороки; формулировка сохраняет конкретное «тело» и связь с предшествующим контекстом.
- source_word: παντοφαγία
  choice: неразборчивость в пище
  rationale: Слово буквально указывает на употребление всякой пищи. «Неразборчивость в пище» естественно передаёт отрицательную оценку в перечне пороков, не смешивая это понятие с последующим чревоугодием.
- source_word: λαμαργία
  choice: чревоугодие
  rationale: Устоявшееся и понятное обозначение чрезмерной, жадной склонности к еде; соответствует нравственному регистру перечня.
- source_word: μονοφαγία
  choice: еда в одиночку
  rationale: В контексте перечня пороков вероятнее всего имеется в виду привычка есть отдельно от других. Перевод остаётся ясным и современным, а возможный морфологически буквальный смысл вынесен в сноску.
theological_decisions:
- issue: Значение μονοφαγία
  choice: еда в одиночку
  alternative: употребление лишь одного вида пищи
  rationale: Это прежде всего лексико-контекстуальная, а не доктринальная развилка. Основной вариант лучше согласуется с перечнем телесных пороков и возможным осуждением необщительности, но строение греческого слова допускает значение однообразного питания; неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным нравственно-философским регистром. «Неразборчивость в пище» предпочтена биологически окрашенной «всеядности»; структура краткого перечня сохранена.
