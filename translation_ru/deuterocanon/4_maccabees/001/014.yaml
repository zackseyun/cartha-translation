base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/014.yaml
  text: But let us determine what reason is[a], and what passion is, and how many kinds of passions there are[c][b], and whether reason rules over all these.
translation:
  language: ru
  text: Но разберём, что такое разум[a], что такое страсть[b], сколько существует видов страстей и властвует ли разум над всеми ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассудок», «рациональное суждение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сильное чувство», «влечение». Здесь греческое слово употреблено как философское обозначение движущих человеком аффективных побуждений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρίνωμεν
  choice: разберём
  rationale: Увещательное сослагательное наклонение приглашает к совместному исследованию и разграничению понятий; «разберём» естественно передаёт оба оттенка в современном русском языке.
- source_word: λογισμός
  choice: разум
  rationale: В 4 Маккавейской это способность к рациональному суждению, составляющая центр рассуждения автора; «разум» кратко и ясно сохраняет философский смысл.
- source_word: πάθος
  choice: страсть
  rationale: В данном философско-этическом контексте слово обозначает аффективное влечение или страсть, а не страдание; этот выбор сохраняет противопоставление разуму.
- source_word: πόσα παθῶν εἰδέα
  choice: сколько существует видов страстей
  rationale: εἰδέα здесь обозначает виды или формы; «виды» понятно современному читателю и сохраняет классификационный характер выражения.
- source_word: ἐπικρατεῖ
  choice: властвует ... над
  rationale: Глагол выражает господство или превосходящую силу; «властвует над» сохраняет метафору господства и не сводит смысл к механическому контролю.
- source_word: τούτων
  choice: всеми ними
  rationale: Местоимение отсылает ко всем только что названным видам страстей; русское выражение естественно и точно передаёт эту связь.
theological_decisions:
- issue: Передача философского противопоставления λογισμός и πάθος
  choice: разум ... страсть
  alternative: рассудок ... чувство; рациональное суждение ... влечение
  rationale: Выбранная пара сохраняет программное для книги напряжение между рациональной способностью и страстями, не подменяя античные этические категории современной психологической терминологией.
translation_notes:
  register: Современный литературный русский язык с умеренно философским, но общедоступным регистром. Синтаксис сохраняет последовательность вопросов греческого текста; «разберём» звучит естественнее буквального «различим» и передаёт приглашение к совместному исследованию.
