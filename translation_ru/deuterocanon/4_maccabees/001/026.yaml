  text: Against the soul are arrogance and love of money and love of honor and contentiousness and envy;[a]
translation:
  language: ru
  text: Против души направлены высокомерие, сребролюбие, честолюбие, склонность к раздорам и зависть.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дурной глаз»; слово βασκανία может обозначать завистливую или злобную недоброжелательность, которой приписывают пагубное действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ μὲν ψυχῆς
  choice: Против души направлены
  rationale: κατά с родительным здесь выражает направленность против души; добавленное «направлены» естественно передаёт эллиптическую конструкцию перечня по-русски.
- source_word: ἀλαζονία
  choice: высокомерие
  rationale: Передаёт хвастливую гордость и самонадеянность термина современным литературным русским словом.
- source_word: φιλαργυρία
  choice: сребролюбие
  rationale: Устоявшееся и понятное в библейском регистре обозначение любви к деньгам, сохраняющее нравственную окраску греческого сложного слова.
- source_word: φιλοδοξία
  choice: честолюбие
  rationale: Передаёт чрезмерную любовь к почёту и славе; в данном перечне пороков слово имеет однозначно отрицательную окраску.
- source_word: φιλονεικία
  choice: склонность к раздорам
  rationale: Естественно выражает устойчивую тягу к спорам, соперничеству и распрям, не сужая значение до отдельной ссоры.
- source_word: βασκανία
  choice: зависть
  rationale: В перечне пороков это наиболее ясное основное соответствие; возможный культурный оттенок «дурного глаза» сохранён в примечании.
