  text: But prudence is the most sovereign of all, and from it reason indeed gains mastery over the passions.
translation:
  language: ru
  text: 'Но главная из всех — рассудительность: именно благодаря ей разум господствует над страстями.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυριωτάτη
  choice: главная
  rationale: Превосходная степень передаёт первенство рассудительности среди названных добродетелей; буквальные варианты вроде «самая властная» звучали бы по-русски неестественно.
- source_word: φρόνησις
  choice: рассудительность
  rationale: Здесь слово обозначает практическую способность здраво судить и направлять поведение; «рассудительность» яснее передаёт этот смысл, чем более широкое «мудрость».
- source_word: ἐξ ἧς δὴ
  choice: именно благодаря ей
  rationale: Передана причинно-инструментальная связь ἐξ ἧς и усилительное значение δὴ.
- source_word: λογισμός
  choice: разум
  rationale: В контексте трактата это разумная способность, противостоящая власти страстей.
- source_word: ἐπικρατεῖ
  choice: господствует над
  rationale: Сохраняет образ превосходящей власти и управления, не усиливая его до полного уничтожения страстей.
- source_word: πάθη
  choice: страсти
  rationale: Традиционный и понятный русский эквивалент для сильных влечений и аффектов в этико-философском контексте.
theological_decisions:
- issue: Характер власти разума над страстями
  choice: «господствует над страстями»
  alternative: «подавляет страсти»
  rationale: Греческое ἐπικρατεῖ выражает преобладание и власть, но не утверждает уничтожение или безусловное подавление страстей.
translation_notes:
  register: Современный литературный русский язык с достоинством философско-назидательной прозы. Двоеточие естественно выражает пояснительно-причинную связь между двумя частями греческого предложения.
