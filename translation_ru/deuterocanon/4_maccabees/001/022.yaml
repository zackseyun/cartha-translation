- source_word: πρὸ μὲν οὖν τῆς ἡδονῆς ἐστιν ἐπιθυμία
  choice: Итак, наслаждению предшествует желание
  rationale: πρό с родительным обозначает предшествование; естественный русский порядок слов сохраняет логическую последовательность оригинала.
