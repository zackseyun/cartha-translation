  yaml_path: translation/deuterocanon/4_maccabees/001/013.yaml
  text: So then[a], let us examine whether reason is master over the passions.
translation:
  language: ru
  text: Итак, исследуем, властен ли разум над страстями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обладает ли разум полной властью над страстями».'
    reason: Лексическая альтернатива для αὐτοκράτωρ, подчёркивающая полноту и самостоятельность власти.
lexical_decisions:
- source_word: Ζητοῦμεν
  choice: исследуем
  rationale: Форма первого лица множественного числа настоящего времени буквально означает «исследуем / выясняем» и в данном рассуждении приглашает вместе рассмотреть поставленный вопрос.
- source_word: δὴ τοίνυν
  choice: итак
  rationale: Сочетание частиц обозначает переход к выводу и дальнейшему рассмотрению; русское «итак» естественно передаёт обе функции.
- source_word: αὐτοκράτωρ
  choice: властен
  rationale: Слово обозначает обладание самостоятельной, полной властью. Предикативное «властен над» сохраняет смысл господства и не придаёт выражению излишне политического оттенка.
- source_word: τῶν παθῶν
  choice: над страстями
  rationale: В эллинистическом нравственно-философском контексте πάθη — это страсти и сильные внутренние влечения, а не просто нейтральные эмоции.
- source_word: ὁ λογισμός
  choice: разум
  rationale: Здесь λογισμός означает способность к рациональному суждению и рассуждению, составляющую центральную тему книги; «разум» передаёт это кратко и естественно.
theological_decisions:
- issue: Философско-антропологическое значение λογισμός по отношению к πάθη
  choice: разум властен над страстями
  alternative: разумное суждение господствует над страстями
  rationale: Формулировка сохраняет ключевой для книги вопрос о власти разума над страстями, не сводя πάθη к нейтральным чувствам и не привнося более поздние богословские категории.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная философская формулировка. Вопросительная конструкция передана косвенным вопросом после «исследуем».
