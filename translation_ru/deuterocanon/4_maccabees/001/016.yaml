lexical_decisions:
- source_word: σοφία
  choice: мудрость
  rationale: Прямое соответствие абстрактному существительному; сохраняет характер философского определения без намёка на олицетворение.
- source_word: δὴ τοίνυν
  choice: итак
  rationale: Естественно передаёт итоговый, логически выводящий переход, выраженный сочетанием частиц.
- source_word: γνῶσις
  choice: знание
  rationale: Наиболее прямой эквивалент в философском определении; «понимание» внесло бы дополнительный оттенок.
- source_word: θείων καὶ ἀνθρωπίνων πραγμάτων
  choice: о божественном и человеческом
  rationale: Субстантивированные прилагательные с подразумеваемым πραγμάτων естественно передаются по-русски как две области знания; это позволяет избежать тяжеловесного «о божественных и человеческих предметах».
- source_word: τῶν τούτων αἰτίων
  choice: о причинах того и другого
  rationale: αἰτίων сохраняет философское значение «причины», а τούτων отсылает к обеим только что названным областям — божественному и человеческому.
