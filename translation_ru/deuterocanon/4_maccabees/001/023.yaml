translation:
  language: ru
  text: Перед страданием — страх, а после страдания — скорбь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸ
  choice: перед
  rationale: Временной предлог указывает на то, что предшествует страданию; «перед» естественно передаёт эту последовательность.
- source_word: πόνου / τὸν πόνον
  choice: страданием / страдания
  rationale: πόνος может означать труд, боль или страдание. Здесь речь идёт о переживании, которому предшествует страх и за которым следует скорбь; «страдание» сохраняет широту греческого слова лучше, чем более узкое «боль».
- source_word: φόβος
  choice: страх
  rationale: Прямое и нейтральное соответствие φόβος; нет необходимости усиливать значение до «ужаса».
- source_word: μετὰ
  choice: после
  rationale: Предлог с винительным падежом имеет временное значение и обозначает последующее состояние.
- source_word: λύπη
  choice: скорбь
  rationale: λύπη обозначает печаль, скорбь или душевную боль; «скорбь» уместна в кратком афористическом высказывании и естественно сочетается со «страданием».
