base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/011.yaml
  text: For those men became even more admirable[a], not only to all people for their courage and endurance, but also to those who tortured them; they became the cause of the overthrow of the tyranny against the nation, having conquered the tyrant by endurance[b], so that through them the fatherland was purified.
translation:
  language: ru
  text: 'Ибо те мужи стали ещё более достойны восхищения в глазах всех людей за своё мужество и стойкость — и даже в глазах тех, кто их истязал. Они стали причиной свержения тирании, направленной против народа: своей стойкостью победили тирана, так что через них отечество было очищено.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Очищено» может подразумевать освобождение от тирании, а также нравственное или ритуальное очищение; греческий текст не ограничивает смысл одним из этих оттенков.
    reason: alternative_reading
lexical_decisions:
- source_word: θαυμαστότεροι
  choice: ещё более достойны восхищения
  rationale: Передаёт сравнительную степень и нравственное восхищение героями, не сводя слово к более широкому значению «удивительны».
- source_word: ἀνδρίᾳ
  choice: мужество
  rationale: В данном контексте слово обозначает доблесть и храбрость; «мужество» естественно звучит по-русски и соответствует возвышенному регистру.
- source_word: ὑπομονῇ
  choice: стойкость
  rationale: В обоих случаях обозначает непреклонное терпение в страданиях. Единый перевод сохраняет словесный повтор оригинала.
- source_word: αἰκισαμένων
  choice: тех, кто подвергал их мучениям
  rationale: Причастие обозначает людей, жестоко истязавших мучеников; формулировка ясно выражает насилие и сохраняет глагольный характер греческого оборота.
- source_word: αἴτιοι κατέστησαν
  choice: стали причиной
  rationale: Прямо передаёт становление причиной последующего свержения тирании.
- source_word: καταλυθῆναι
  choice: свержения
  rationale: В сочетании с тиранией глагол означает её устранение или ниспровержение; политически окрашенное «свержение» здесь естественно.
- source_word: τὴν κατὰ τοῦ ἔθνους τυραννίδα
  choice: тирании, направленной против народа
  rationale: Сохраняет враждебную направленность κατὰ и передаёт ἔθνος как конкретный народ, не вводя отсутствующего в стихе уточнения «иудейский».
- source_word: νικήσαντες τὸν τύραννον
  choice: они победили тирана
  rationale: Сохраняет ярко выраженный мотив победы; связь со средством победы передана оборотом «своей стойкостью».
- source_word: ὥστε καθαρσθῆναι
  choice: и ... было очищено
  rationale: ὥστε с инфинитивом выражает результат. «Очищено» сохраняет возможные политические, нравственные и ритуальные оттенки, не выбирая один из них.
- source_word: πατρίδα
  choice: отечество
  rationale: «Отечество» обозначает родную землю и сохраняет возвышенный риторический тон греческого πατρίς.
theological_decisions:
- issue: Смысл очищения отечества через мучеников
  choice: Сохранено утверждение, что через стойкость страдальцев отечество было очищено, без уточнения механизма этого очищения.
  alternative: Понимать это исключительно как политическое освобождение, исключительно как нравственное или ритуальное очищение либо как сформулированное учение об искупительной силе мученичества.
  rationale: καθαρσθῆναι допускает несколько взаимосвязанных оттенков. Контекст связывает очищение со свержением тирании, но само слово шире политического освобождения, поэтому перевод сохраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной риторикой. Синтаксис разделён на два предложения для ясности, при этом причинно-результативное движение греческого периода сохранено. Повтор «стойкость» намеренно воспроизводит повтор ὑπομονῇ.
