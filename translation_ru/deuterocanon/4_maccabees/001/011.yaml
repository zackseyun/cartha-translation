review_pass:
  verdict: revise
  source_fidelity: 'Смысловые элементы греческого текста переданы верно: сравнительное «ещё более», доблесть и стойкость, признание даже со стороны истязателей, причинная роль в падении тирании против народа, победа над тираном стойкостью и результативное очищение отечества. Однако «не только для всех людей ... но и для тех» неестественно по-русски и недостаточно ясно передаёт оценку, выраженную пассивной конструкцией с ὑπό. Следует также явнее отметить результативную связь ὥστε.'
  naturalness: 'Фраза «стали ещё более достойны восхищения — не только для всех людей» стилистически шероховата: в современном литературном русском естественнее «в глазах всех людей» или «у всех людей». «В глазах» ясно показывает, что речь идёт о восхищении ими, а не об их полезности «для» людей.'
  terminology: «Мужество», «стойкость», «истязали», «тирания», «тиран» и «отечество» уместны и выдерживают возвышенный регистр. Повтор «стойкостью» обоснованно сохраняет повтор ὑπομονῇ. «Очищено» сохраняет семантическую и богословскую неоднозначность καθαρσθῆναι.
  issues:
  - severity: medium
    issue: Неестественное управление в конструкции «достойны восхищения — не только для всех людей ... но и для тех».
    rationale: Греческое ὑπὸ πάντων ἀνθρώπων ... ἀλλὰ καὶ ὑπὸ τῶν αἰκισαμένων обозначает, кем они были признаны достойными восхищения. Русское «для» здесь звучит неидиоматично; «в глазах» передаёт оценочный ракурс ясно и литературно.
  - severity: low
    issue: Результативный союз ὥστε передан лишь сочинительным «и».
    rationale: «Так что» или «так что через них...» точнее сохраняет выраженный в оригинале результат, не меняя смысла.
