revisions:
- from: 'Ибо те мужи стали ещё более достойны восхищения — не только для всех людей за своё мужество и стойкость, но и для тех, кто подвергал их мучениям. Они стали причиной свержения тирании, направленной против народа: своей стойкостью они победили тирана, и через них отечество было очищено.[a]'
  to: 'Ибо те мужи стали ещё более достойны восхищения в глазах всех людей за своё мужество и стойкость — и даже в глазах тех, кто их истязал. Они стали причиной свержения тирании, направленной против народа: своей стойкостью победили тирана, так что через них отечество было очищено.[a]'
  rationale: Исправлена неестественная конструкция с «для всех людей» на литературное «в глазах всех людей»; добавлено «даже», соответствующее усилительному контексту противопоставления, и «так что» для явной передачи ὥστε. Сохранены все ключевые лексические решения и неоднозначность очищения.
