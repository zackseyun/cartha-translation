revisions:
- from: Каждую из них всеобъемлюще действующий разум[a], тщательно очищая, обрезая, переплетая, поднимая и всячески преобразуя[b], укрощает — как материал, из которого складываются нравы и страсти.
  to: В каждом из них вседейственный разум, тщательно очищая, подрезая, переплетая, орошая и всячески преобразуя, укрощает материю нравов и страстей.[a][b]
  rationale: Исправлены значение ἐπάρδων и синтаксическая связь заключительной метафоры. «Подрезая» сохраняет образ удаления лишнего в ἀποκνίζων; «переплетая» передаёт περιπλέκων. Начальное «В каждом из них» — минимально интерпретирующее русское решение для трудной эллиптической конструкции ὧν ἕκαστος, позволяющее сохранить её распределительную отсылку и не приписывать тексту отсутствующую причинную связь.
