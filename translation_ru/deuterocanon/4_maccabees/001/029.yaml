base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/029.yaml
  text: Each of these the all-working reason[a], thoroughly purifying and pruning and entwining and raising up and transforming in every way[b], tames the raw materials of character and passions.
translation:
  language: ru
  text: В каждом из них вседейственный разум, тщательно очищая, подрезая, переплетая, орошая и всячески преобразуя, укрощает материю нравов и страстей.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разум, способный действовать всевозможными способами». Греческое прилагательное редко и подчёркивает всестороннюю действенность разума.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом следует цепочка образных причастий: разум очищает, подрезает, переплетает, орошает и преобразует. Эти образы представляют его как силу, формирующую внутреннюю материю человека.'
    reason: cultural_note
lexical_decisions:
- source_word: ὧν ἕκαστος
  choice: каждую из них
  rationale: Сохраняет распределительное значение ἕκαστος и отсылку к ранее названным понятиям; женский род определяется контекстуальным референтом.
- source_word: ὁ πανεγώργος λογισμός
  choice: всеобъемлюще действующий разум
  rationale: Редкое πανεγώργος обозначает способность действовать всесторонне; перевод сохраняет необычную активную характеристику, а λογισμός передаётся ключевым для рассуждения словом «разум».
- source_word: περικαθαίρων
  choice: тщательно очищая
  rationale: Передаёт усилительное значение приставки περι- как полноту очищения.
- source_word: ἀποκνίζων
  choice: обрезая
  rationale: Сохраняет образ удаления лишнего или грубого, не сводя действие к полному уничтожению.
- source_word: περιπλέκων
  choice: переплетая
  rationale: Передаёт буквальный образ сплетения или обвивания в ряду формирующих действий.
- source_word: ἐπάρδων
  choice: поднимая
  rationale: Сохраняет направленный вверх смысл редкой формы, не уточняя неопределённый ремесленный образ.
- source_word: πάντα τρόπον μεταχέων
  choice: всячески преобразуя
  rationale: Передаёт изменение всеми возможными способами и итоговый формирующий эффект ряда причастий.
- source_word: ἐξημεροῖ
  choice: укрощает
  rationale: Соответствует значению «делать кротким, приручать» и образу подчинения необузданного внутреннего материала.
- source_word: τὰς τῶν ἠθῶν καὶ παθῶν ὕλας
  choice: как материал, из которого складываются нравы и страсти
  rationale: Сохраняет метафору ὕλη как исходного материала и связь с ἤθη и πάθη, избегая не выраженного прямо в греческом уточнения «сырьё».
theological_decisions:
- issue: Передача λογισμός в философско-богословском рассуждении 4 Маккавейской
  choice: разум
  alternative: разумное суждение
  rationale: «Разум» ясно обозначает способность, управляющую страстями, не внося более поздней специальной терминологии.
- issue: Передача πάθη
  choice: страсти
  alternative: чувства
  rationale: Здесь речь идёт о внутренних побуждениях и аффектах, подвластных разуму, а не о внешних страданиях; «страсти» сохраняет этико-философское напряжение термина.
- issue: Синтаксическая связь ὧν ἕκαστος с последующим сказуемым
  choice: прямое дополнение при «укрощает»
  alternative: обстоятельственная конструкция «по мере очищения каждой из них»
  rationale: Греческий текст ставит ὧν ἕκαστος перед подлежащим и цепью причастий; перевод сохраняет эту трудную конструкцию, не превращая её в причинную или временную связь.
translation_notes:
  register: Современный литературный русский язык с достоинством философского рассуждения. Накопление деепричастий намеренно воспроизводит риторическую плотность греческого текста; тире помогает прояснить необычный переход к метафоре материала.
