lexical_decisions:
- source_word: σωφροσύνη
  choice: самообладание
  rationale: В данном определении речь идёт о нравственной способности управлять желаниями. «Самообладание» ясно и естественно передаёт практический смысл слова; «умеренность» звучит уже по значению, а «благоразумие» смещает акцент к рассудительности.
- source_word: δὴ τοίνυν
  choice: итак
  rationale: Сочетание частиц обозначает подчёркнутый вывод или переход к определению. Русское «итак» естественно передаёт эту функцию без стилистической тяжеловесности.
- source_word: ἐπικράτεια
  choice: власть
  rationale: Существительное означает господство, преобладание или власть над чем-либо. «Власть над желаниями» сохраняет активный образ управления и звучит естественно в кратком нравственном определении.
- source_word: τῶν ἐπιθυμιῶν
  choice: над желаниями
  rationale: Здесь ἐπιθυμίαι употреблено в широком этическом смысле. «Желания» не сужает значение до похоти или чрезмерных влечений, а предлог «над» естественно выражает отношение к слову «власть».
