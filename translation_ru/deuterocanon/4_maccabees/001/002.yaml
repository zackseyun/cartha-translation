base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/002.yaml
  text: For the discourse is indeed necessary for understanding[b][a], and it contains praise of the greatest virtue—I mean prudence.
translation:
  language: ru
  text: Ведь это рассуждение необходимо для понимания[a] и содержит похвалу величайшей добродетели — я имею в виду благоразумие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для познания». Греческое εἰς ἐπιστήμην допускает оба варианта.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «практическую мудрость». Греческое φρόνησις означает благоразумное нравственное суждение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖος
  choice: необходимо
  rationale: Передаёт именно необходимость, а не просто полезность рассуждения.
- source_word: εἰς ἐπιστήμην
  choice: для понимания
  rationale: Естественно по-русски выражает направленность к осмысленному знанию; вариант «для познания» отмечен в сноске.
- source_word: λόγος
  choice: рассуждение
  rationale: Здесь речь идёт о развёрнутом разумном изложении, а не об отдельном слове.
- source_word: τῆς μεγίστης ἀρετῆς
  choice: величайшей добродетели
  rationale: Сохраняет нравственно-философский смысл ἀρετή и превосходную степень определения.
- source_word: φρονήσεως
  choice: благоразумие
  rationale: Обозначает нравственно направленную способность здраво судить и действовать; «практическая мудрость» дано как допустимое уточнение.
- source_word: περιέχει ἔπαινον
  choice: содержит похвалу
  rationale: Прямо и естественно передаёт мысль о похвальном изложении названной добродетели.
theological_decisions:
- issue: Передача философских терминов добродетели без привнесения позднейших конфессиональных категорий
  choice: «добродетель» и «благоразумие» в нравственно-философском смысле
  alternative: «совершенство» и «практическая мудрость»
  rationale: Такая передача сохраняет философский регистр вступления и не добавляет отсутствующего в тексте специального вероучительного содержания.
- issue: Синтаксическая связь ἄξιος, τῆς μεγίστης ἀρετῆς и περιέχει ἔπαινον
  choice: Передать общий смысл как «содержит похвалу величайшей добродетели»
  alternative: Буквально сохранить отдельное «достойно величайшей добродетели»
  rationale: Греческая конструкция с гипербатоном сжата и по-русски при буквальной передаче неясна; выбранный вариант сохраняет заявленную похвалу φρόνησις, не вводя дополнительного толкования.
translation_notes:
  register: 'Современный литературный русский язык; ясный, достойный философско-риторический регистр. Порядок сносок исправлен по смыслу: [a] относится к ἐπιστήμη, [b] — к φρόνησις.'
