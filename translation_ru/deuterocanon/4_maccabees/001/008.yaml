  text: But I could prove this far more from the courage of Eleazar, the seven brothers, and their mother, who died for the sake of virtue.
translation:
  language: ru
  text: Но гораздо убедительнее я мог бы доказать это мужеством Елеазара, семи братьев и их матери, умерших за добродетель.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολὺ δὲ πλέον
  choice: Но ещё гораздо убедительнее
  rationale: 'Передаёт усиленное сравнение: следующий пример доказывает тезис в значительно большей мере; «убедительнее» естественно выражает силу доказательства по-русски.'
- source_word: ἀποδείξαιμι
  choice: я мог бы доказать
  rationale: Сохраняет потенциальное значение греческого оптатива и авторское первое лицо.
- source_word: ἀνδραγαθείας
  choice: мужеством
  rationale: В контексте добровольной смерти за добродетель слово обозначает доблесть и мужественную стойкость; «мужество» понятно современному читателю и не ограничено полом действующих лиц.
- source_word: τῶν ὑπὲρ ἀρετῆς ἀποθανόντων
  choice: тех, кто умер за добродетель
  rationale: Сохраняет связь смерти с защитой или верностью добродетели, не уточняя сверх текста характер этой причинно-целевой связи.
- source_word: Ἐλεαζάρου τε καὶ ἑπτὰ ἀδελφῶν καὶ τῆς τούτων μητρός
  choice: Елеазара, семи братьев и их матери
  rationale: Естественно передаёт перечисление и точно сохраняет указание, что женщина была матерью семи братьев.
theological_decisions:
- issue: Значение ἀρετή
  choice: добродетель
  alternative: благочестие
  rationale: Греческий текст использует широкое этико-философское понятие «добродетель»; замена на «благочестие» внесла бы более узкое религиозное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством риторико-философского рассуждения. Двоеточие делает приложение прозрачным, сохраняя всех трёх названных свидетелей как тех, кто умер за добродетель.
