  yaml_path: translation/deuterocanon/4_maccabees/001/007.yaml
  text: So then[b][a], from many angles and in many ways I could show you that devout reason is master of the passions.
translation:
  language: ru
  text: Итак, я мог бы с разных сторон и разными способами показать вам, что благочестивый разум властвует над страстями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обладает полной властью над страстями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλαχόθεν μὲν οὖν καὶ ἀλλαχόθεν
  choice: Итак, … с разных сторон и на разных основаниях
  rationale: Парные наречия указывают на множество подходов и различных отправных точек доказательства. Русская формулировка сохраняет их накопительный риторический эффект, не сводя оба выражения к одному значению.
- source_word: ἔχοιμʼ ἂν
  choice: я мог бы
  rationale: Оптатив с ἄν выражает возможность; условная форма «мог бы» естественно передаёт эту потенциальность.
- source_word: ἐπιδεῖξαι
  choice: показать
  rationale: Глагол означает «показать, продемонстрировать»; «показать» ясно и не усиливает значение до строгого формального доказательства.
- source_word: αὐτοκράτωρ
  choice: властвует
  rationale: Предикативное существительное обозначает обладание полной властью. Глагольная конструкция естественна по-русски и сохраняет образ господства разума над страстями.
- source_word: τῶν παθῶν
  choice: над страстями
  rationale: В контексте книги πάθη — аффективные влечения и страсти, которыми управляет разум; «страсти» сохраняет философско-нравственный смысл термина.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: благочестивый разум
  rationale: Ключевое выражение книги соединяет разумное суждение с почтением к Богу. «Благочестивый разум» передаёт обе стороны понятия и естественно звучит в современном литературном русском.
theological_decisions:
- issue: Передача программного выражения ὁ εὐσεβὴς λογισμός
  choice: благочестивый разум
  alternative: богобоязненный разум; разум, исполненный почтения к Богу
  rationale: Выбранный вариант сохраняет религиозное содержание εὐσεβής и рациональное содержание λογισμός, не превращая выражение в позднейший богословский термин и не уточняя сверх того, что сказано в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством философско-нравственной речи. Синтаксис остаётся ясным для широкого читателя; парность греческих наречий сохранена, а ключевой термин передан последовательно и без конфессионального уточнения.
