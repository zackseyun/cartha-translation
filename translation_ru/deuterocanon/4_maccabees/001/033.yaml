base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/033.yaml
  text: For why is it that[a], when we are moved toward the forbidden foods, we turn away from the pleasures that come from them? Is it not because reason is able to prevail over desires? I think so.
translation:
  language: ru
  text: Ведь почему, испытывая влечение к запретной пище, мы отказываемся от удовольствий, которые она доставляет? Не потому ли, что разум способен одолевать желания[a]? Я полагаю, что так.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «влечения». Здесь греческое слово может особо указывать на телесный аппетит, поскольку речь идёт о пище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: ведь почему
  rationale: Сохраняет и связь с предшествующим рассуждением, и форму поясняющего риторического вопроса.
- source_word: κινούμενοι πρὸς
  choice: испытывая влечение к
  rationale: Передаёт внутреннее побуждение или движение к предмету без излишне буквального и неестественного оборота.
- source_word: τὰς ἀπειρημένας τροφάς
  choice: запретной пище
  rationale: В данном контексте речь идёт о пище, употребление которой запрещено; единственное собирательное число естественно для русского языка.
- source_word: ἀποτρεπόμεθα
  choice: мы отказываемся от
  rationale: Передаёт сознательное отвращение себя от удовольствий; по-русски здесь естественнее, чем буквальное «отворачиваемся».
- source_word: τὰς ἐξ αὐτῶν ἡδονάς
  choice: удовольствий, которые она доставляет
  rationale: Ясно выражает происхождение удовольствий от названной пищи, не добавляя нового смысла.
- source_word: ὁ λογισμός
  choice: разум
  rationale: Передаёт ключевое для 4 Маккавейской понятие рассудочной способности, управляющей влечениями, без позднейших догматических уточнений.
- source_word: τῶν ὀρέξεων ἐπικρατεῖν
  choice: одолевать желания
  rationale: ἐπικρατεῖν обозначает превосходство и власть над чем-либо, а ὀρέξεις — желания или телесные влечения; выбранный оборот сохраняет динамику борьбы.
- source_word: ἐγὼ μὲν οἶμαι
  choice: Я полагаю, что так
  rationale: Сохраняет личное, умеренно утверждающее заключение автора и звучит достойно и естественно.
theological_decisions:
- issue: Философско-антропологическое значение λογισμός
  choice: разум
  alternative: рассудок; разумное суждение
  rationale: «Разум» достаточно точно обозначает рациональную способность, которая, согласно аргументу книги, может господствовать над желаниями, не привнося специальной конфессиональной антропологии.
- issue: Степень власти разума над ὀρέξεις
  choice: способен одолевать желания
  alternative: может господствовать над влечениями
  rationale: Формулировка сохраняет утверждаемую возможность превосходства разума, но не превращает её в абсолютное или автоматическое подавление желаний.
translation_notes:
  register: Современный литературный русский язык; риторическая структура и философская аргументация оригинала сохранены, при этом избегнуты тяжеловесный буквализм и узкоконфессиональная терминология.
