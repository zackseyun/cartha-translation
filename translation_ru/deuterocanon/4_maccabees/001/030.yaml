revisions:
- from: Ведь разум руководит добродетелями и властвует над страстями. Итак, прежде всего я покажу на примере поступков, препятствующих воздержанности,[a] что разум сам властен над страстями.
  to: Ибо разум направляет добродетели и повелевает страстями. Поэтому я прежде всего покажу посредством сдерживающих действий самообладания, что разум обладает самостоятельной властью над страстями.
  rationale: 'Перевод исправлен в одном ключевом синтаксико-семантическом месте: сдерживающими являются действия самообладания, а не действия, направленные против него. Ненужная и вводящая в заблуждение сноска удалена. Остальная терминология слегка уточнена для различения αὐτοκράτωρ и αὐτοδέσποτος при сохранении смысла оригинала.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T01:40:17Z'
review_pass:
  verdict: revise
  source_fidelity: 'В исходном греческом κωλυτικῶν τῆς σωφροσύνης ἔργων естественно означает «сдерживающие действия/проявления самообладания», а не действия, препятствующие самообладанию. Исправление восстанавливает направление смысла, согласующееся с непосредственной задачей автора: показать власть разума над страстями посредством самообладания. αὐτοδέσποτος передано как самостоятельная, собственная власть разума, без утверждения об уничтожении страстей.'
  naturalness: Исправленный текст сохраняет современный литературный и философский регистр. «Самостоятельная власть» передаёт αὐτοδέσποτος яснее и естественнее, чем несколько неуклюжее «сам властен».
  terminology: «Разум», «добродетели», «страсти» и «самообладание» точно соответствуют философской лексике контекста. «Повелитель» для αὐτοκράτωρ сохраняет более сильный оттенок господства, тогда как «самостоятельная власть» различает αὐτοδέσποτος.
