base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/001/030.yaml
  text: For reason is the guide of the virtues and the master of the passions. Therefore, I will first demonstrate through the restraining works of self-control that reason is self-governing over the passions.
translation:
  language: ru
  text: Ибо разум направляет добродетели и повелевает страстями. Поэтому я прежде всего покажу посредством сдерживающих действий самообладания, что разум обладает самостоятельной властью над страстями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογισμός
  choice: разум
  rationale: В контексте философского рассуждения обозначает разумную способность рассуждать и управлять страстями; «разум» естественно и точно передаёт термин.
- source_word: ἡγεμών
  choice: руководит
  rationale: Передаёт функцию ведущего и направляющего начала по отношению к добродетелям, не придавая слову политического оттенка.
- source_word: αὐτοκράτωρ
  choice: властвует
  rationale: Выражает господство разума над страстями; отличается от последующего αὐτοδέσποτος без искусственного утяжеления русского текста.
- source_word: κωλυτικῶν τῆς σωφροσύνης ἔργων
  choice: поступков, препятствующих воздержанности
  rationale: 'Генитив τῆς σωφροσύνης при κωλυτικῶν естественнее понимать как объект препятствия: речь далее идёт о действиях, противостоящих самообладанию.'
- source_word: σωφροσύνη
  choice: воздержанность
  rationale: В данном этическом контексте речь о самообладании и умеренности перед лицом желаний; «воздержанность» доступна современному читателю.
- source_word: αὐτοδέσποτος
  choice: сам властен
  rationale: Сохраняет идею собственной, внутренней власти разума, не смешивая её просто с общим «господством» и не вводя неестественное «самоуправляем».
- source_word: πάθη
  choice: страсти
  rationale: Традиционный и точный философско-этический эквивалент для аффектов и влечений, которыми должен управлять разум.
theological_decisions:
- issue: Степень власти разума над страстями
  choice: «властвует» / «сам властен над страстями»
  alternative: «полностью подавляет страсти»
  rationale: Греческий текст утверждает господство или самостоятельную власть разума, но не говорит об уничтожении либо полном подавлении страстей; напряжение между разумом и страстями сохранено.
translation_notes:
  register: Современный литературный русский язык с философской строгостью и без излишней архаизации. Синтаксис разделён на два предложения для ясности; парные утверждения о власти разума сохранены.
