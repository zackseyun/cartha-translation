  yaml_path: translation/deuterocanon/4_maccabees/001/009.yaml
  text: For all these[a], having disregarded the pain even unto death[b], demonstrated that reason rules over the passions.
translation:
  language: ru
  text: Ведь все они, презрев страдание вплоть до смерти[a], показали, что разум господствует над страстями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пренебрегая страданием даже до смерти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рассудительное суждение одерживает верх над страстями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅπαντες … οὗτοι
  choice: все они
  rationale: Передаёт совокупное значение ἅπαντες и указательную отсылку οὗτοι к ранее названным людям, не добавляя отсутствующего в греческом существительного.
- source_word: πόνον
  choice: страданием
  rationale: В контексте мучений πόνος обозначает переносимое страдание; это значение точнее контекстуально, чем обычные «труд» или «усилие».
- source_word: ἕως θανάτου
  choice: вплоть до смерти
  rationale: Сохраняет выраженную в греческом предельную степень страдания и не вводит прямо понятие мученичества, которое следует из контекста.
- source_word: ὑπεριδόντες
  choice: пренебрегая
  rationale: Передаёт отношение к страданию как к тому, чему не позволяют определять своё поведение; русский оборот естественнее буквального «смотря свысока».
- source_word: ἐπεδείξαντο
  choice: показали
  rationale: Глагол представляет их стойкость как наглядное доказательство тезиса; «показали» звучит ясно и естественно.
- source_word: περικρατεῖ
  choice: господствует над
  rationale: Выражает превосходящую власть и способность держать страсти под контролем, сохраняя силу греческого глагола.
- source_word: τῶν παθῶν
  choice: страстями
  rationale: Сохраняет философско-этическое значение πάθη как сильных влечений и аффектов, а не просто эмоций или перенесённых страданий.
- source_word: ὁ λογισμός
  choice: разум
  rationale: Кратко и естественно передаёт центральное для книги понятие рассудочной способности, не привнося более поздних богословских категорий.
theological_decisions:
- issue: Передача философского термина ὁ λογισμός без привнесения позднейших богословских категорий
  choice: разум
  alternative: рассудительное суждение
  rationale: «Разум» сохраняет основной философский тезис книги, тогда как вариант в сноске раскрывает активный аспект обдуманного суждения.
- issue: Следует ли прямо называть мученичество при переводе ἕως θανάτου πόνον
  choice: страданием вплоть до смерти
  alternative: смертными муками
  rationale: Греческий текст указывает предел страдания, но не называет мученичество в этой фразе; выбранный вариант оставляет это контексту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, философским звучанием. Синтаксис следует аргументативному строю греческой фразы, но остаётся понятным широкому читателю.
