  text: The tyrant kept struggling[a], but the world and the life of mankind were watching.
translation:
  language: ru
  text: Тиран продолжал бороться[a], а мир и жизнь человечества наблюдали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Тиран противоборствовал». С кем именно он боролся, в греческом здесь не сказано; из контекста ясно, что имеются в виду мученики.'
    reason: Уточнение буквального значения и сохранённого в переводе невыраженного объекта.
lexical_decisions:
- source_word: ὁ τύραννος
  choice: тиран
  rationale: «Тиран» точно передаёт обозначение жестокого, деспотичного правителя и сохраняет отрицательную оценку контекста.
- source_word: ἀντηγωνίζετο
  choice: продолжал бороться
  rationale: Имперфект выражает продолженное действие, а глагол — противоборство или состязание с кем-либо. Русское «продолжал бороться» естественно передаёт длительность, не вводя в основной текст отсутствующее в греческом дополнение.
- source_word: ὁ δὲ κόσμος
  choice: а мир
  rationale: «Мир» сохраняет широкий смысл κόσμος и его олицетворение; союз «а» передаёт переход и лёгкое противопоставление, выраженное δέ.
- source_word: ὁ τῶν ἀνθρώπων βίος
  choice: жизнь человечества
  rationale: 'Выражение сохраняет возвышенный собирательный смысл: человеческая жизнь в целом представлена как свидетель происходящего.'
- source_word: ἐθεώρει
  choice: наблюдали
  rationale: Имперфект указывает на продолжающееся созерцание. Множественное число требуется естественным русским согласованием с двумя однородными подлежащими, хотя в греческом стоит форма единственного числа.
theological_decisions:
- issue: Олицетворение мира и жизни человечества как свидетелей
  choice: Сохранить олицетворение в основном тексте.
  alternative: 'Передать отвлечённо: «мир человеческой жизни наблюдал».'
  rationale: Греческий текст изображает мученичество как зрелище вселенского и общечеловеческого масштаба; сохранение образа не добавляет к нему богословского истолкования.
- issue: Не выраженный прямо объект глагола ἀντηγωνίζετο
  choice: Не добавлять «с ними» в основной текст, а пояснить подразумеваемый объект в сноске.
  alternative: «Тиран продолжал бороться с ними».
  rationale: Контекст позволяет понять, что речь идёт о противоборстве мученикам, однако в самом греческом предложении объект не назван. Такой перевод сохраняет подлинную синтаксическую недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным звучанием. Олицетворённые «мир» и «жизнь человечества» сохранены, а синтаксис сделан естественным для русского читателя.
