- source_word: οἳ καὶ
  choice: Они также
  rationale: Передаёт продолжение речи и добавочное значение καί естественной русской конструкцией; самостоятельное «они» яснее в изолированном стихе, чем относительное «которые».
- source_word: ἐξεδίκησαν
  choice: отстояли правоту
  rationale: Глагол допускает судебное и воздаятельное значения. В контексте ненасильственного мученичества эта формулировка передаёт восстановление справедливости и чести, не создавая ложного впечатления о насильственной мести.
- source_word: τὸ ἔθνος
  choice: народа
  rationale: Здесь ἔθνος обозначает иудейский народ как единое сообщество; русское «народ» естественно сохраняет этот собирательный смысл.
- source_word: εἰς θεὸν ἀφορῶντες
  choice: взирая на Бога
  rationale: Сохраняет образ направленного к Богу взгляда, внимания и упования, не делая подразумеваемое богословское значение излишне явным.
- source_word: μέχρι θανάτου
  choice: до самой смерти
  rationale: Передаёт предельную степень стойкости и усилительный оттенок выражения.
- source_word: τὰς βασάνους
  choice: пытки
  rationale: В контексте мученичества речь идёт о намеренно причиняемых физических истязаниях, а не о страданиях вообще.
- source_word: ὑπομείναντες
  choice: претерпев
  rationale: Передаёт стойкое перенесение испытаний и сохраняет обстоятельственную причастную конструкцию греческого текста.
theological_decisions:
- issue: Значение ἐξεδίκησαν в контексте мученичества
  choice: Их верность до смерти отстояла правоту народа.
  alternative: Они отомстили за народ; они добились справедливости для народа.
  rationale: Греческий глагол действительно может обозначать месть или осуществление правосудия, однако ближайший контекст говорит не о насильственном возмездии со стороны мучеников, а об их стойкости перед Богом. Основной перевод отражает это, а примечание сохраняет реальную лексическую неоднозначность.
