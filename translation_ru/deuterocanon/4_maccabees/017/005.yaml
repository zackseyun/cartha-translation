base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/005.yaml
  text: Not so does the moon stand in majesty in heaven with the stars[a], as you, having guided your seven sons, equal to the stars, toward godliness[b], have come to stand honored before God and have been established in heaven with them.
translation:
  language: ru
  text: Не столь величественно стоит на небе луна среди звёзд, сколь ты, направив семерых своих сыновей, равных звёздам, к благочестию[a], стала почтена Богом и вместе с ними утвердилась на небесах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое слово можно передать также: «озарив» или «приведя к свету»; оно сохраняет образ ведения сыновей к благочестию посредством света.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «утвердилась на небе вместе с ними». В данном контексте речь, вероятно, идёт о небесной чести матери вместе с её сыновьями.'
    reason: alternative_reading
lexical_decisions:
- source_word: σελήνη
  choice: луна
  rationale: Обычное обозначение луны; определённость естественно передаётся по-русски без артикля.
- source_word: σεμνὴ
  choice: величественно
  rationale: Передаёт достоинство и торжественное великолепие в возвышенном сравнении.
- source_word: καθεστήκεν / καθεστήκας
  choice: стоит / стала
  rationale: Разные русские формы сохраняют риторическую параллель, но учитывают состояние луны и достигнутое матерью почётное положение.
- source_word: ἰσαστέρους
  choice: равных звёздам
  rationale: Прозрачно передаёт составное прилагательное со значением равенства звёздам, не сводя его лишь к внешнему сходству.
- source_word: παῖδας
  choice: сыновей
  rationale: В контексте речь идёт о семерых сыновьях матери-мученицы.
- source_word: φωταγωγήσασα
  choice: направив
  rationale: В контексте причастие описывает, как мать вела сыновей к благочестию; световой оттенок слова сохранён в примечании, поскольку буквальная передача в основном тексте была бы тяжеловесной.
- source_word: πρὸς τὴν εὐσέβειαν
  choice: к благочестию
  rationale: Передаёт почтительное отношение к Богу, выраженное верностью и послушанием.
- source_word: ἔντιμος ... θεῷ
  choice: почитаема Богом
  rationale: Естественно передаёт почётное положение матери по отношению к Богу, не добавляя идеи человеческого почитания.
- source_word: ἐστήρισαι
  choice: утвердилась
  rationale: Сохраняет образ прочного, устойчивого положения и результативный характер формы.
- source_word: ἐν οὐρανῷ σὺν αὐτοῖς
  choice: вместе с ними утвердилась на небесах
  rationale: В контексте посмертного прославления «небеса» естественно обозначают небесное пребывание, а не только видимый небосвод.
theological_decisions:
- issue: 'Значение οὐρανός в заключительной части: видимое небо или небесная сфера пребывания у Бога'
  choice: на небесах
  alternative: на небе
  rationale: Контекст прославления мучеников допускает небесное пребывание, однако буквальная пространственная образность остаётся возможной и отмечена в сноске.
- issue: Характер Божьего отношения в ἔντιμος ... θεῷ
  choice: почитаема Богом
  alternative: в чести перед Богом
  rationale: Выбрана естественная русская формулировка, не уточняющая сверх текста ни основания, ни формы этой чести.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным синтаксисом. Повтор местоимения «ты» после сравнительного оборота помогает ясно провести длинную греческую конструкцию; образы луны, звёзд и утверждения на небесах сохранены.
