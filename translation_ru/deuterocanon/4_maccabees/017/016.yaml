  text: Who did not marvel at the athletes of the law of truth? Who was not astonished?[a]
translation:
  language: ru
  text: Кто не восхитился атлетами закона истины?[a] Кто не изумился?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истинного закона». Греческое выражение можно понимать и как сочетание с родительным падежом («закон истины»), и как характеристику закона как истинного.'
    reason: Сохранить грамматическую и смысловую неоднозначность греческого выражения τῆς ἀληθείας νομοθεσίας.
lexical_decisions:
- source_word: ἐθαύμασαν
  choice: восхитился
  rationale: Глагол выражает не только удивление, но и восхищение; совершенный вид естественно передаёт греческий аорист и сохраняет риторическую силу вопроса.
- source_word: ἀθλητάς
  choice: атлетами
  rationale: Слово буквально обозначает участников состязания. «Атлетами» сохраняет характерную для 4 Маккавейской книги метафору духовного состязания, не заменяя её толкованием вроде «защитники» или «борцы».
- source_word: νομοθεσίας
  choice: закона
  rationale: В данном сочетании речь идёт о данном Богом законном установлении; «закон» звучит естественнее, чем канцелярское «законодательство», и не сводит значение к самому акту дарования закона.
- source_word: ἀληθείας
  choice: истины
  rationale: Родительный падеж сохраняет смысловую весомость существительного и не устраняет возможную неоднозначность связи между «истиной» и «законом».
- source_word: τῆς ἀληθείας νομοθεσίας
  choice: закона истины
  rationale: Такой перевод сохраняет греческую генитивную конструкцию и её торжественный характер; возможное атрибутивное понимание отмечено в сноске.
- source_word: ἐξεπλάγησαν
  choice: изумился
  rationale: Глагол передаёт сильное потрясённое удивление. «Изумился» отличает вторую реакцию от предшествующего «восхитился» и сохраняет параллелизм вопросов.
- source_word: τίνες
  choice: кто
  rationale: В повторяющихся риторических вопросах русское «кто» естественно передаёт обобщающий смысл греческой формы множественного числа.
theological_decisions:
- issue: Метафорическое наименование мучеников словом ἀθλητάς
  choice: Сохранить состязательную метафору в слове «атлетами».
  alternative: 'Передать толковательно: «борцами», «поборниками» или «защитниками».'
  rationale: Автор представляет верных закону как участников состязания. Прямое сохранение образа не подменяет его военной или отвлечённо-почётной характеристикой.
- issue: Понимание сочетания τῆς ἀληθείας νομοθεσίας
  choice: 'Основной текст: «закона истины».'
  alternative: «истинного закона».
  rationale: Греческое сочетание допускает как генитивное прочтение («закон истины»), так и атрибутивное («истинный закон»). Основной перевод сохраняет форму и богословскую напряжённость оригинала, а альтернатива указана в сноске.
translation_notes:
  register: Современный литературный русский язык с приподнятой риторической интонацией. Два кратких параллельных вопроса сохранены. Необычное, но понятное слово «атлеты» намеренно удерживает авторскую метафору состязания.
