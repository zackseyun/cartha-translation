base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/007.yaml
  text: But if it were possible for us[a], as for a painter, to depict the godliness of your story, would not those who looked on shudder at a mother of seven children enduring varied tortures, because of godliness, all the way to death?
translation:
  language: ru
  text: Но если бы нам было возможно, подобно художнику, изобразить благочестие[a], явленное в твоей истории, разве не содрогнулись бы зрители, увидев мать семерых детей, которая ради благочестия претерпевает разнообразные истязания вплоть до смерти?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «набожность»; то же слово употреблено ниже во фразе «ради благочестия».'
    reason: Лексическая альтернатива для обоих случаев εὐσέβεια.
lexical_decisions:
- source_word: Εἰ δὲ ἔξον ἡμῖν ἦν
  choice: Но если бы нам было возможно
  rationale: Передаёт гипотетическую конструкцию и допускаемое ἔξον значение возможности, не сводя его без необходимости к разрешению.
- source_word: ὥσπερ τινός, ζωγραφῆσαι
  choice: подобно художнику, изобразить
  rationale: Сохраняет изобразительную метафору ζωγραφέω и естественно восполняет эллиптическое τινός указанием на художника.
- source_word: τὴν τῆς ἱστορίας σου εὐσέβειαν
  choice: благочестие, явленное в твоей истории
  rationale: «Благочестие» передаёт обращённую к Богу верность εὐσέβεια; «явленное в твоей истории» естественно раскрывает греческую родительную конструкцию, не превращая ἱστορία в научную «историю».
- source_word: οὐκ ἂν ἔφριττον οἱ θεωροῦντες
  choice: разве не содрогнулись бы зрители, увидев
  rationale: Сохраняет риторический вопрос, телесно-эмоциональную силу ἔφριττον и зрительный смысл θεωροῦντες.
- source_word: μητέρα ἑπτὰ τέκνων
  choice: мать семерых детей
  rationale: Точно сохраняет общее значение τέκνα, хотя из контекста книги известно, что речь идёт о сыновьях.
- source_word: διʼ εὐσέβειαν
  choice: ради благочестия
  rationale: Передаёт мотив или основание, выраженное διά с винительным, и повторяет ключевой термин автора.
- source_word: ποικίλας βασάνους
  choice: разнообразные истязания
  rationale: «Разнообразные» сохраняет указание ποικίλας на разные виды мучений, а «истязания» соответствует контексту пыток.
- source_word: μέχρι θανάτου ὑπομενούσαν
  choice: претерпевает … вплоть до смерти
  rationale: «Претерпевает» выражает стойкое перенесение страданий, а «вплоть до смерти» сохраняет предельную направленность μέχρι.
theological_decisions:
- issue: Передача εὐσέβεια в контексте мученичества
  choice: благочестие
  alternative: набожность; почтение к Богу
  rationale: «Благочестие» — понятный и достойный русский термин для почтительной верности Богу; его повторение сохраняет тематический акцент греческого текста, не добавляя конфессиональной конкретизации.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной интонацией. Обращение «твоей» сохранено как прямое обращение к матери; риторический вопрос и живописная метафора удержаны.
