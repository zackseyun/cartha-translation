  terminology: «Божье провидение», «благочестивые» и «выкуп» уместны. «Умилостивительную смерть» допустимо сохранять как передачу ἱλαστηρίου, но термин нуждается в сноске с вариантом «искупительная». Альтернативу к προκακωθέντα следует привязать непосредственно к «прежде претерпевший бедствия».
