  source_fidelity: 'Смысл в целом передан верно: ὥσπερ сохранено («словно»), ἀντίψυχον — как «выкуп», διὰ ... αἵματος καὶ ... θανάτου — как средство сохранения Израиля, а προκακωθέντα — как предшествующее перенесение бедствий. Однако исходное «словно став» оставляет в русском тексте грамматически невыраженный субъект, а сноска [b] поставлена после всего предложения, хотя по своему содержанию она относится к последнему причастию и не отражает спорный термин ἱλαστηρίου.'
