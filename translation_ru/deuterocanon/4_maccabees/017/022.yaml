  yaml_path: translation/deuterocanon/4_maccabees/017/022.yaml
  text: as though they had become a ransom for the sin of the nation[a], and through the blood of those devout ones and their propitiatory death, divine providence preserved Israel[b], though it had been mistreated before.
translation:
  language: ru
  text: Словно они стали выкупом за грех народа[a], через кровь тех благочестивых людей и их умилостивительную[b] смерть Божье провидение сохранило Израиль, прежде претерпевший бедствия[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно они стали жизнью, отданной взамен за грех народа»; возможен также перевод: «словно они стали заместительной жизнью за грех народа».'
    reason: Слово ἀντίψυχον обозначает то, что отдается взамен жизни, и может передаваться как «выкуп» либо «жизнь взамен».
  - marker: b
    text: 'Или: «искупительную» или «примирительную». Греческое ἱλαστηρίου связано с умилостивлением и искуплением; буквальное «крышка ковчега» в этом контексте не подходит.'
    reason: Лексическая альтернатива для ἱλαστηρίου.
  - marker: c
    text: 'Или: «прежде подвергавшийся жестокому обращению».'
    reason: Причастие προκακωθέντα может обозначать как ранее перенесенные бедствия вообще, так и жестокое обращение.
lexical_decisions:
- source_word: ἀντίψυχον
  choice: выкупом
  rationale: Слово обозначает то, что отдается взамен жизни; «выкуп» естественно передает обменный и заместительный оттенок, не уточняя механизм искупления сверх греческого текста.
- source_word: ἁμαρτίας
  choice: за грех
  rationale: Предлог «за» в сочетании с «выкупом» ясно передает отношение к греху народа и сохраняет нравственно-религиозный смысл ἁμαρτία.
- source_word: εὐσεβῶν
  choice: благочестивых
  rationale: «Благочестивые» передает почтение к Богу и соответствует возвышенному, но понятному регистру книги.
- source_word: ἱλαστηρίου
  choice: умилостивительную
  rationale: Прилагательное согласуется со «смертью» и передает жертвенно-искупительный смысл ἱλαστήριος, сохраняя присущую термину связь с умилостивлением.
- source_word: θεία πρόνοια
  choice: Божье провидение
  rationale: Естественное современное выражение, обозначающее промыслительную заботу Бога; оно менее отвлеченно, чем «божественное провидение», при этом не добавляет нового субъекта.
- source_word: προκακωθέντα
  choice: прежде претерпевший бедствия
  rationale: Передает как предшествование, выраженное προ-, так и пассивное переживание зла или страданий, не ограничивая смысл только преследованием со стороны людей.
- source_word: διέσωσεν
  choice: сохранило
  rationale: Глагол указывает на избавление и сохранение среди опасности; «сохранило» хорошо подходит к национальному избавлению Израиля.
theological_decisions:
- issue: Жертвенно-искупительный смысл ἱλαστηρίου применительно к смерти мучеников
  choice: их умилостивительную смерть
  alternative: их искупительную смерть; их смерть как средство умилостивления
  rationale: Греческое слово здесь является определением к «смерти», а не названием буквальной крышки ковчега. «Умилостивительную» сохраняет богословское напряжение термина и не сводит его только к очищению или только к заместительному наказанию.
- issue: Степень заместительного смысла в ἀντίψυχον γεγονότας
  choice: словно став выкупом за грех народа
  alternative: словно отдав жизнь взамен за грех народа; словно став заместительной жертвой за грех народа
  rationale: «Выкуп» передает идею обмена жизнью, а «словно» сохраняет сравнительный характер ὥσπερ и не превращает образное утверждение в более жесткую догматическую формулу.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим религиозно-философскому повествованию. Синтаксис сохраняет связь с предшествующей фразой, поскольку греческий текст стиха начинается продолжением предложения. Термины не перегружены конфессионально-специальной лексикой; подлинная неоднозначность ἀντίψυχον и προκακωθέντα отражена в сносках.
