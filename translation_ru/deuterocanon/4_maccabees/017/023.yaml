lexical_decisions:
- source_word: ἀνδρίαν
  choice: мужество
  rationale: Слово естественно обозначает храбрость и стойкость, сохраняя в русском языке этимологически и стилистически заметный мужской оттенок греческого термина.
- source_word: ἀρετὴν
  choice: доблесть
  rationale: В данном контексте это нравственное достоинство и благородная доблесть; такой выбор естественнее в сочетании с «мужеством», чем более отвлечённая «добродетель».
- source_word: βασάνοις
  choice: под пытками
  rationale: В повествовании о мучениках речь идёт о физически причиняемых пытках, а не просто об испытаниях.
- source_word: ὑπομονὴν
  choice: стойкость
  rationale: Передаёт твёрдое терпение и несгибаемость в страдании; одно и то же слово сохранено в обоих случаях.
- source_word: ἀφιδὼν
  choice: увидев
  rationale: Прямо и естественно передаёт обстоятельственное причастие со значением наблюдения.
- source_word: ἀνεκήρυξεν
  choice: провозгласил
  rationale: Сохраняет публичный и официальный оттенок глагола.
- source_word: ὑπόδειγμα
  choice: примером
  rationale: Обозначает образец, предложенный другим для подражания.
- source_word: στρατιώτας
  choice: воинов
  rationale: Точно обозначает людей на военной службе у Антиоха и соответствует возвышенному историческому регистру.
theological_decisions:
- issue: Гендерная окраска этического термина ἀνδρία
  choice: мужество
  alternative: храбрость; отвага; мужественность
  rationale: «Мужество» звучит естественно по-русски как название доблести и при этом не полностью устраняет мужскую окраску греческого слова. «Мужественность» передала бы её буквальнее, но в современном русском могла бы быть понята прежде всего как совокупность мужских качеств или внешних черт.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным историческим регистром. Синтаксис следует греческой причинно-временной конструкции, но остаётся естественным; повтор слова «стойкость» сохранён как значимый повтор оригинала.
