  yaml_path: translation/deuterocanon/4_maccabees/017/003.yaml
  text: For just as you[a], like a roof firmly established upon the pillar of the children, bravely bore the earthquake through tortures without wavering,
translation:
  language: ru
  text: Ибо, подобно кровле, прочно утверждённой на столпе детей[a], ты мужественно и непоколебимо выдержала землетрясение, вызванное пытками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сыновей». Греческое слово παῖδες может означать детей, сыновей или юношей; в данном повествовании речь идёт о сыновьях этой женщины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Ибо, подобно
  rationale: Передаёт и пояснительную связь γὰρ, и вводимое καθάπερ сравнение; по-русски сравнение естественно оформляется оборотом с «подобно».
- source_word: στέγη
  choice: кровле
  rationale: Сохраняет буквальный архитектурный образ крыши или кровли; «кровля» соответствует приподнятому, но современному регистру.
- source_word: ἐπὶ τοῦ στύλου
  choice: на столпе
  rationale: Сохраняет архитектурную метафору несущей опоры. «Столп» здесь уместнее технического «колонна» и согласуется с образным стилем.
- source_word: τῶν παίδων
  choice: детей
  rationale: παῖδες допускает значения «дети», «сыновья» и «юноши». В повествовании речь идёт о сыновьях женщины, однако более широкое «детей» сохраняет лексическую неоднозначность.
- source_word: γενναίως ἱδρυμένη
  choice: прочно утверждённой
  rationale: ἱδρυμένη обозначает твёрдую установленность, а γενναίως усиливает образ стойкости. Буквальное «мужественно утверждённой» по-русски неестественно, поэтому физическая устойчивость выражена словом «прочно», тогда как нравственное мужество передано далее при сказуемом.
- source_word: ἀκλινῶς
  choice: непоколебимо
  rationale: Передаёт отсутствие уклонения или колебания и одновременно поддерживает образ сооружения, не пошатнувшегося при землетрясении.
- source_word: ὑπήνεγκας
  choice: выдержала
  rationale: Глагол означает вынести или выдержать тяжесть испытания; «выдержала» естественно сочетается и с пытками, и с метафорическим землетрясением.
- source_word: τὸν διὰ τῶν βασάνων σεισμόν
  choice: землетрясение, вызванное пытками
  rationale: 'Сохраняет буквальный образ σεισμός и ясно передаёт διὰ с родительным как причину или средство: потрясение произошло посредством пыток.'
theological_decisions:
- issue: Архитектурное изображение матери, её детей и пыток
  choice: Сохранить образы кровли, столпа и землетрясения
  alternative: Развернуть метафору как прямое утверждение, что мать защищала детей и стойко переносила их страдания
  rationale: Греческий текст намеренно соединяет архитектурные образы. Их истолковывающий пересказ снял бы риторическое напряжение и навязал бы более однозначное понимание отношений между матерью и детьми.
- issue: Значение τῶν παίδων
  choice: «детей» с примечанием об альтернативе «сыновей»
  alternative: «сыновей» без примечания
  rationale: Контекст указывает на сыновей, но само греческое слово шире; основной текст сохраняет эту неоднозначность, а примечание сообщает контекстуально вероятное уточнение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной образностью. Архитектурная метафора сохранена; синтаксис несколько упрощён ради ясности. Наречие γενναίως семантически отражено словом «мужественно» при основном действии, чтобы избежать неестественного русского сочетания «мужественно утверждённая кровля».
