base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/024.yaml
  text: And it made them noble and courageous in infantry combat and siege warfare[a], and after sacking them[c][b], he conquered all the enemies.
translation:
  language: ru
  text: И это сделало их благородными и мужественными в пешем бою и при осаде[a]; а разорив их[b][c], он победил всех врагов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для пешего сражения»; греческое слово буквально обозначает бой пеших воинов.'
    reason: lexical_alternative
  - marker: b
    text: 'Причастие можно также перевести: «опустошив» или «разграбив»; этот глагол часто употребляется о городах и укреплениях.'
    reason: lexical_alternative
  - marker: c
    text: В греческом объект при слове «разорив» не назван. Подлежащее начального глагола также не выражено, тогда как последующее причастие и глагол имеют мужской род; перевод сохраняет эту сжатость, не называя референтов из более широкого контекста.
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσχεν
  choice: сделало
  rationale: 'В конструкции с αὐτούς и двумя предикативными прилагательными глагол имеет результативно-каузативный смысл: «сделало их…». Местоимение «это» естественно передаёт невыраженное подлежащее среднего рода, не называя его референт.'
- source_word: γενναίους
  choice: благородными
  rationale: Передаёт нравственное достоинство γενναῖος и не сливает его по смыслу со следующим ἀνδρείους.
- source_word: ἀνδρείους
  choice: мужественными
  rationale: Сохраняет значение воинской отваги и образует естественную для литературного русского языка пару с «благородными».
- source_word: εἰς πεζομαχίαν
  choice: в пешем бою
  rationale: πεζομαχία буквально обозначает сражение пеших воинов; перевод точнее, чем «рукопашный бой», который сужал бы значение.
- source_word: πολιορκίαν
  choice: при осаде
  rationale: Передаёт военную деятельность, связанную с осадой, и естественно сочетается с «в пешем бою».
- source_word: ἐκπορθήσας
  choice: подвергнув их разорению
  rationale: Причастие означает разорение, опустошение или взятие и разграбление. Русская конструкция требует дополнения; «их» восстанавливается лишь грамматически, а его невыраженность в греческом отмечена сноской.
- source_word: ἐνίκησεν
  choice: победил
  rationale: Прямо передаёт военное значение νικάω без излишнего усиления.
- source_word: πάντας τοὺς πολεμίους
  choice: всех врагов
  rationale: Сохраняет всеобщность πάντας и не добавляет отсутствующего в греческом притяжательного местоимения «своих».
theological_decisions:
- issue: Референт невыраженного подлежащего при ἔσχεν и переход к мужскому роду в ἐκπορθήσας / ἐνίκησεν
  choice: Передать начало как «это сделало», а заключение как «он победил», сохранив смену грамматического субъекта и не называя референты.
  alternative: Назвать подлежащим «разум», «мать» либо иное лицо или понятие из более широкого контекста и унифицировать субъект всего предложения.
  rationale: 'Греческий текст риторически сжат: подлежащее ἔσχεν не названо, тогда как причастие и личный глагол далее стоят в мужском роде и единственном числе. Эксплицитное отождествление устранило бы присутствующую в источнике напряжённость.'
- issue: Неуказанный объект ἐκπορθήσας
  choice: Употребить грамматически необходимое «их», но отметить в сноске, что объект в греческом не выражен.
  alternative: Добавить «города» или «укрепления» по обычному военному употреблению глагола.
  rationale: Так не вводится конкретный объект, которого нет в исходном тексте, хотя по обычному словоупотреблению могли подразумеваться города или укрепления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной военной лексикой. Синтаксическая резкость перехода от «это» к «он» сохранена намеренно; точка с запятой помогает читателю воспринять её без ложного сглаживания.
