  yaml_path: translation/deuterocanon/4_maccabees/017/009.yaml
  text: Here lie buried an aged priest[a], and an aged woman, and seven children, because of a tyrant’s violence, who wanted to abolish the commonwealth of the Hebrews.
translation:
  language: ru
  text: Здесь погребены престарелый священник, женщина преклонных лет и семеро сыновей — из-за насилия тирана, желавшего уничтожить общественный уклад евреев[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «образ жизни евреев», или «государственное устройство евреев». Греческое слово обозначает упорядоченную общественную жизнь народа, а не только личные верования.
    reason: Сохраняет широкий диапазон значения πολιτεία и не позволяет ошибочно свести его лишь к частной религии.
lexical_decisions:
- source_word: Ἐντάφθα
  choice: Здесь
  rationale: Передаёт указание на место и сохраняет краткое, напоминающее эпитафию начало.
- source_word: γέρων ἱερεύς
  choice: престарелый священник
  rationale: Передаёт преклонный возраст и священническое служение в dignified memorial register.
- source_word: γυνὴ γεραιά
  choice: женщина преклонных лет
  rationale: Естественно и уважительно передаёт указание на преклонный возраст, сохраняя параллель с престарелым священником.
- source_word: ἑπτὰ παῖδες
  choice: семеро детей
  rationale: παῖδες само по себе допускает значения «дети», «мальчики» или «сыновья»; более широкое «дети» не сужает выражение за пределы данной формы, хотя из контекста книги известно, что речь идёт о сыновьях женщины.
- source_word: ἐγκεκήδευνται
  choice: погребены
  rationale: Греческий перфект обозначает сохраняющееся состояние после погребения; русская краткая страдательная форма естественно передаёт этот результат.
- source_word: διὰ τυράννου βίαν
  choice: из-за насилия тирана
  rationale: διά с винительным выражает причину, а βία прямо обозначает насилие или принуждение.
- source_word: τὴν Ἑβραίων πολιτίαν
  choice: общественный уклад евреев
  rationale: πολιτεία охватывает устроенную совместную жизнь народа, его общественный порядок и установления; «общественный уклад» сохраняет эту широту и не сводит смысл к частной религиозности.
- source_word: καταλῦσαι
  choice: уничтожить
  rationale: Передаёт намерение положить конец существующему укладу; русский глагол сочетается как с общественным порядком, так и с образом жизни.
- source_word: θέλοντος
  choice: желавшего
  rationale: Причастие в родительном падеже относится к тирану и выражает его намерение; русское причастие сохраняет структуру и однозначную связь.
theological_decisions:
- issue: Значение πολιτεία в контексте иудейского мученичества
  choice: общественный уклад евреев
  alternative: образ жизни евреев; государственное устройство евреев
  rationale: Термин обозначает не только веру отдельных людей, но и упорядоченную, определяемую законом общую жизнь народа. Основной вариант сохраняет общественное измерение, а сноска отмечает действительный диапазон значения.
translation_notes:
  register: Современный литературный русский язык с торжественным, памятным звучанием. Лексика понятна широкому читателю; структура близка к греческой, но тире облегчает восприятие причинного оборота. Сноска поставлена непосредственно после выражения, к которому относится.
