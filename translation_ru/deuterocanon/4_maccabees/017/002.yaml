base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/017/002.yaml
  text: O mother[a], who with your seven children brought down the tyrant’s violence, and nullified his evil schemes, and displayed the nobility of faith.
translation:
  language: ru
  text: О мать, вместе с семью детьми сокрушившая насилие тирана, расстроившая его злые замыслы и явившая благородство веры[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мужество веры»; возможно также понимание: «верность». Греческое выражение может подчёркивать как благородство, явленное верой, так и мужественную стойкость в преданности.'
    reason: Лексическая неоднозначность γενναιότης и смысловая широта πίστις.
lexical_decisions:
- source_word: Ὦ μήτηρ
  choice: О мать
  rationale: Сохраняет прямое обращение и возвышенный восклицательный тон греческого текста, не придавая русской речи излишней архаичности.
- source_word: σὺν ἑπτὰ παισίν
  choice: вместе с семью детьми
  rationale: παῖς может означать ребёнка или сына. В контексте речь идёт о её сыновьях, однако «детьми» точно передаёт форму исходного выражения и естественно связано с обращением «мать».
- source_word: καταλύσασα
  choice: сокрушившая
  rationale: Причастие выражает разрушение или ниспровержение; «сокрушившая» передаёт решительную победу над тираническим насилием и соответствует торжественной риторике стиха.
- source_word: τὴν τοῦ τυράννου βίαν
  choice: насилие тирана
  rationale: βία обозначает силу или насилие. В контексте гонения «насилие» яснее передаёт жестокое принуждение тирана, сохраняя при этом смысл его подавляющей силы.
- source_word: ἀκυρώσασα
  choice: расстроившая
  rationale: Глагол означает сделать недействительным или безуспешным. По-русски «расстроить замыслы» естественно выражает то, что планы тирана были лишены результата.
- source_word: τὰς κακὰς ἐπινοίας αὐτοῦ
  choice: его злые замыслы
  rationale: ἐπινοία означает замысел, план или ухищрение; «злые замыслы» прямо передаёт κακάς и естественно звучит в данном контексте.
- source_word: ἐπιδείξασα
  choice: явившая
  rationale: Передаёт публичное обнаружение и наглядное проявление качества, сохраняя возвышенный характер похвалы.
- source_word: τὴν τῆς πίστεως γενναιότητα
  choice: благородство веры
  rationale: γενναιότης может обозначать благородство, величие духа или мужество. «Благородство веры» сохраняет структуру и нравственную возвышенность греческого выражения, не устраняя его смысловую широту.
theological_decisions:
- issue: Передача πίστις
  choice: вера
  alternative: верность
  rationale: В данном контексте слово относится к стойкой религиозной преданности во время гонения. «Вера» наиболее естественна в основном тексте, однако возможный оттенок верности отмечен в сноске.
- issue: Смысл γενναιότης в сочетании с πίστις
  choice: благородство веры
  alternative: мужество веры
  rationale: Греческое слово охватывает как нравственное благородство, так и мужественную стойкость. Основной текст сохраняет более широкое значение, а более конкретное прочтение указано в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенной, хвалебной интонацией оригинала. Цепочка причастий сохранена как единое риторическое обращение; восклицательный знак передаёт силу начального Ὦ.
