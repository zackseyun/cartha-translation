  source_fidelity: 'Основной текст следует исправить. В греческом τὸ ἔθνος ἡμῶν стоит перед τοὺς πολεμίους и естественно читается как субъект инфинитива: «наш народ не одержал верх над врагами». Однако из-за двух форм винительного падежа и контекстуального напряжения возможно и отражённое в английском аудите понимание: «враги не одолели наш народ». Черновик без оговорки выбирает второе прочтение и потому не сохраняет существенную неоднозначность. διὰ θεοῦ в русском естественно передать как «Богом»; «через Бога» возможно, но в данном контексте заметно неестественно.'
  naturalness: «Итак, и они» и особенно «освящённые через Бога» звучат тяжеловесно для современного литературного русского. «И они также» и «освящённые Богом» естественнее. Связка «удостоены не только этой чести, но и того, что…» хорошо передаёт повтор τιμάω/τιμή и субстантивированную конструкцию τῷ ….
  terminology: «Освящённые» уместно для ἁγιασθέντες и сохраняет страдательный характер. «Удостоены … чести» точно и литературно передаёт τετίμηνται / τιμή. «Народ» — удачный эквивалент ἔθνος в данном историко-религиозном контексте.
