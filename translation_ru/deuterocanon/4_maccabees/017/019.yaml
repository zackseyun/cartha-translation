  yaml_path: translation/deuterocanon/4_maccabees/017/019.yaml
  text: And so these men also[a], having been made holy through God, have been honored not only with this honor, but also because through them our nation did not let the enemies prevail,
translation:
  language: ru
  text: Итак, и они, освящённые через Бога[a], почтены не только этой честью, но и тем, что благодаря им враги не одолели наш народ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Богом»; греческий предлог διά с родительным падежом может обозначать действующее лицо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὗτοι οὖν
  choice: Итак, и они
  rationale: Передаёт выводное οὖν и добавочное καί, сохраняя связь этих людей с ранее названными участниками событий.
- source_word: ἁγιασθέντες
  choice: освящённые
  rationale: Аористное страдательное причастие от ἁγιάζω обозначает тех, кому сообщена святость. «Освящённые» сохраняет пассивный смысл и не сужает его до культового посвящения.
- source_word: διὰ θεοῦ
  choice: через Бога
  rationale: διά с родительным падежом может обозначать посредство или действующее лицо. Буквальное «через Бога» сохраняет форму и некоторую открытость греческого выражения; более обычное по-русски «Богом» дано в сноске.
- source_word: τετίμηνται
  choice: почтены
  rationale: Перфект страдательного залога выражает оказанную честь и сохраняющийся результат. Краткая форма «почтены» естественна в современном литературном русском.
- source_word: ταύτῃ τῇ τιμῇ
  choice: этой честью
  rationale: Творительный падеж естественно передаёт дательный средства или отношения и сохраняет корневую связь τιμάω с τιμή через русские «почтены» и «честью».
- source_word: τῷ διʼ αὐτοὺς
  choice: тем, что благодаря им
  rationale: Субстантивированная конструкция вводит дополнительное основание оказанной чести. «Тем, что» сохраняет её связь с «почтены», а «благодаря им» передаёт причинно-посредническое значение διά.
- source_word: τὸ ἔθνος ἡμῶν
  choice: наш народ
  rationale: В контексте имеется в виду иудейская общность. «Народ» звучит естественнее русского «нация» в повествовании об историко-религиозной общине.
- source_word: τοὺς πολεμίους
  choice: враги
  rationale: Обозначает определённую, понятную из контекста группу противников; русский язык не требует отдельного определённого артикля.
- source_word: μὴ ἐπικρατῆσαι
  choice: не одолели
  rationale: ἐπικρατέω выражает преобладание, победу или обретение власти. Русское «одолели» ясно передаёт, что враги не взяли верх над народом, без добавления отсутствующего в греческом глагола «позволить».
theological_decisions:
- issue: Значение ἁγιασθέντες в контексте мученичества
  choice: Мученики названы освящёнными, то есть получившими святость.
  alternative: «Посвящённые» в более узком культовом смысле.
  rationale: Контекст связывает их верность с честью и избавлением народа, но сам глагол не требует понимать их статус как особое культовое назначение.
- issue: Роль Бога в выражении διὰ θεοῦ
  choice: «через Бога», с указанием варианта «Богом» в сноске
  alternative: 'Только прямое обозначение действующего лица: «Богом».'
  rationale: Оба понимания допустимы для διά с родительным падежом. Основной текст сохраняет греческий предлог и не устраняет оттенок посредства, а сноска сообщает естественное агентное прочтение.
- issue: Синтаксис заключительной инфинитивной конструкции
  choice: Враги не одолели наш народ.
  alternative: Наш народ не дал врагам одержать верх.
  rationale: Греческая аккузативно-инфинитивная конструкция с двумя формами винительного падежа формально сжата, но смысл контекста — избавление народа от победы врагов. Выбранная формулировка не вводит дополнительной идеи сознательного «позволения» со стороны народа.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного и богословского контекста. Сохранены повтор понятий «почтены — честью», страдательный смысл освящения и причинная связь мучеников с избавлением народа; тяжёлая греческая финальная конструкция умеренно перестроена ради ясности.
