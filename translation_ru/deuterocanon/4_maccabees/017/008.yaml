lexical_decisions:
- source_word: καὶ γὰρ
  choice: Ведь и в самом деле
  rationale: Передаёт одновременно пояснительное γάρ и усилительное καί естественным русским оборотом.
- source_word: ἄξιον ἦν
  choice: уместно было бы
  rationale: Безличное выражение обозначает подобающее, достойное действие; условная форма сохраняет риторический оттенок нереализованной уместности.
- source_word: ἐπὶ αὐτοῦ τοῦ ἐπιταφίου
  choice: на самом надгробии[a]
  rationale: αὐτοῦ τοῦ усиливает существительное («на самом…»), не выражая принадлежности. «Надгробие» естественно сочетается с глаголом «начертать», при этом сноска сохраняет значение «эпитафия».
- source_word: ἀναγράψαι
  choice: начертать
  rationale: В погребальном контексте передаёт публичную, долговечную надпись и звучит достойно, но понятно современному читателю.
- source_word: καὶ ταῦτα
  choice: и эти слова
  rationale: Указание относится к следующим далее словам; добавление «слова» делает связь ясной, не меняя содержания.
- source_word: τοῖς ἀπὸ τοῦ ἔθνους
  choice: к людям этого народа
  rationale: Передаёт адресатов высказывания и национально-коллективный смысл ἔθνος, не добавляя отсутствующего в греческом «нашего».
- source_word: εἰς μνείαν
  choice: чтобы они помнили
  rationale: Естественно выражает цель — сохранение в памяти — и избегает двусмысленного русского сочетания «в память людям».
- source_word: λεγόμενα
  choice: обращённые
  rationale: Причастие относится к «этим словам» и вместе с дательным обозначает слова, сказанные людям; «обращённые» естественно передаёт эту связь по-русски.
