lexical_decisions:
- source_word: θεοσέβεια
  choice: благочестие
  rationale: Слово обозначает почитание Бога и преданность Ему. «Благочестие» естественно для литературного русского языка и допускает олицетворение; явно выраженный богонаправленный смысл отмечен в сноске.
- source_word: ἐνίκα
  choice: одерживало победу
  rationale: Имперфект передаёт разворачивающуюся или описываемую в повествовании победу. Выражение сохраняет образ состязания и не сводит его к единичному завершённому действию.
- source_word: τοὺς ἑαυτῆς
  choice: своих
  rationale: Возвратное притяжательное местоимение прямо связывает атлетов с олицетворённым благочестием и естественно звучит по-русски.
- source_word: ἀθλητάς
  choice: атлетов
  rationale: Сохраняется прямой образ участников атлетического состязания. «Борцов» могло бы неоправданно сузить вид состязания, а «поборников» ослабило бы спортивную метафору.
- source_word: στεφανοῦσα
  choice: венчая
  rationale: Причастие обозначает награждение победным венком. «Венчая» кратко сохраняет одновременно действие и состязательную образность.
theological_decisions:
- issue: Олицетворение θεοσέβεια
  choice: Сохранить благочестие как действующее лицо, которое побеждает и венчает своих атлетов.
  alternative: 'Передать без олицетворения: «благочестивые одерживали победу и получали венцы».'
  rationale: Греческий текст прямо приписывает благочестию действия победителя и устроителя награждения. Замена его людьми устранила бы авторское олицетворение и изменила субъект высказывания.
translation_notes:
  register: Современный литературный, торжественный, но понятный регистр. Союз «же» сохраняет противопоставительный оттенок δέ. Сочетание «одерживало победу — атлетов — венчая» последовательно удерживает образ состязания.
