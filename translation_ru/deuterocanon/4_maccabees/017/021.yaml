  text: и чтобы тиран был наказан и родина очищена.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τύραννον
  choice: тиран
  rationale: Прямой и естественный эквивалент, сохраняющий нравственно-политическую характеристику жестокого правителя-преследователя.
- source_word: τιμωρηθῆναι
  choice: был наказан
  rationale: Передаёт аористный страдательный инфинитив и не вводит более узкого значения мести.
- source_word: πατρίδα
  choice: родина
  rationale: Современное и понятное обозначение родной, отеческой земли; естественнее для широкой аудитории, чем «отечество».
- source_word: καθαρισθῆναι
  choice: очищена
  rationale: Сохраняет страдательное значение и допускает ритуальный, нравственный и общественный оттенки очищения, не ограничивая смысл одним из них.
- source_word: καὶ ... καὶ
  choice: и ... а
  rationale: Первое καὶ связывает фрагмент с предшествующим контекстом; «а» естественно координирует два параллельных результата без смыслового противопоставления.
theological_decisions:
- issue: Характер очищения родины
  choice: «родина очищена» — широкая формулировка, допускающая ритуальное, нравственное и общественное очищение
  alternative: «страна избавлена от скверны» — более явно подчёркивает устранение осквернения
  rationale: Греческий текст не уточняет, идёт ли речь исключительно о ритуальном, нравственном либо политико-общественном очищении; широкое выражение сохраняет эту многозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным звучанием. Союз «чтобы» передаёт зависимый характер двух греческих инфинитивов; фрагментарная связь с предшествующим предложением сохранена начальным «и».
