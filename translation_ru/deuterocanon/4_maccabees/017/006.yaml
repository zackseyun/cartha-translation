translation:
  language: ru
  text: Ведь твоё чадородие происходило от Авраама, служителя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Авраама, ребёнка». Греческое слово может означать как ребёнка, так и слугу или служителя; здесь по контексту вероятнее значение «служитель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦ γὰρ
  choice: Ведь … восходило
  rationale: γάρ вводит пояснение, естественно передаваемое словом «ведь»; имперфект ἦ выражает существовавшее в прошлом положение, а с указанием происхождения по-русски естественно употребить «восходило».
- source_word: ἡ παιδοποιία σου
  choice: рождение тобою детей
  rationale: Передаёт конкретное значение рождения детей и обращение к матери, не заменяя его более широким понятием «материнство».
- source_word: ἀπὸ Ἀβραὰμ
  choice: к Аврааму
  rationale: В сочетании с русским «восходило» предлог ἀπό, обозначающий источник или происхождение, естественно передаётся конструкцией «восходило к».
- source_word: τοῦ παιδός
  choice: служителю
  rationale: παῖς может означать как ребёнка, так и слугу; применительно к Аврааму здесь вероятнее почётное обозначение служителя, без усиления до социально окрашенного «раба».
theological_decisions:
- issue: Значение παῖς применительно к Аврааму
  choice: служитель
  alternative: ребёнок; слуга; раб
  rationale: Контекст вероятнее указывает на почётное именование Авраама как служителя Бога. Слово «служитель» сохраняет уважительный оттенок, а лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апокрифической повествовательной прозы. Необычная исходная метафора происхождения деторождения сохранена, но выражена естественной русской конструкцией «восходило к».
