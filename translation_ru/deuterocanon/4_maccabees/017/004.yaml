  text: Therefore take courage[a], O mother of a holy soul, holding fast the hope of endurance with noble courage toward God.
translation:
  language: ru
  text: Итак, мужайся, о мать со святой душой[a], доблестно храня обращённую к Богу надежду стойкости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святая душой мать». Греческое ἱερόψυχε — составное слово, указывающее на святой, посвящённый Богу внутренний склад человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «надежду стойкости». Сочетание может означать надежду, сохраняемую в стойком терпении, рождаемую им или направленную на дальнейшую стойкость.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: θάρρει
  choice: мужайся
  rationale: Повелительная форма θαρρέω призывает обрести и сохранять мужество; «мужайся» естественно и кратко передаёт силу прямого увещания.
- source_word: τοιγαροῦν
  choice: итак
  rationale: Частица вводит вывод из предшествующего рассуждения; «итак» сохраняет логическую связь и подходит современному литературному регистру.
- source_word: μῆτηρ ἱερόψυχε
  choice: о мать со святой душой
  rationale: Прилагательное ἱερόψυχος — составное обращение, характеризующее священный или святой внутренний склад матери. Описательный оборот звучит по-русски естественнее буквального «святая душой».
- source_word: ἐλπίδα τῆς ὑπομονῆς
  choice: надежду стойкости
  rationale: Сжатое сочетание сохраняет формальную связь родительного падежа и не сводит её однозначно к «надежде на стойкость»; в контексте мученичества ὑπομονή обозначает стойкое терпение и выдержку.
- source_word: γενναίως
  choice: доблестно
  rationale: Наречие сочетает значения благородства и мужества. «Доблестно» передаёт оба оттенка и избегает простого повтора слова «мужайся».
- source_word: ἔχουσα
  choice: храня
  rationale: Причастие ἔχουσα буквально означает «имея, держа». «Храня» естественно описывает продолжающееся сохранение надежды без усиления вроде «твёрдо держась».
- source_word: πρὸς θεόν
  choice: обращённую к Богу
  rationale: Предлог πρός с винительным выражает направленность. Такая формулировка сохраняет ориентацию надежды к Богу, не заменяя её более определённым богословским выражением «на Бога» или «в Боге».
theological_decisions:
- issue: Характеристика матери словом ἱερόψυχε
  choice: мать со святой душой
  alternative: святая душой мать; священнодушная мать
  rationale: Выбранный вариант сохраняет явный сакральный компонент ἱερο- и относит характеристику к внутреннему человеку, не превращая её в утверждение о каноническом статусе матери.
- issue: Направленность выражения πρὸς θεόν
  choice: обращённую к Богу
  alternative: на Бога; перед Богом; по отношению к Богу
  rationale: Греческий оборот обозначает направленность, но сам по себе не уточняет её как упование «на Бога» или положение «перед Богом»; перевод сохраняет эту открытость.
- issue: Связь родительного τῆς ὑπομονῆς с ἐλπίδα
  choice: надежду стойкости
  alternative: надежду на стойкость; надежду, рождаемую стойкостью; надежду в стойкости
  rationale: Родительный допускает более одной смысловой связи. Сжатая конструкция сохраняет исходную неоднозначность, а примечание сообщает основные возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для похвального обращения к матери мучеников. Архаизирующее «о» сохранено как естественный знак прямого возвышенного обращения; остальная лексика остаётся понятной современному читателю.
