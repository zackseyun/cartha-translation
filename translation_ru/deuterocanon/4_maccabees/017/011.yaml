  text: Ибо поистине борьба, совершившаяся при их посредстве, была божественной[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «божественная борьба, совершённая ими». Греческое выражение может подчёркивать как то, что борьба совершилась при их посредстве, так и то, что она осуществилась в их судьбе.'
