    rationale: Хотя оно возможно, сочетание «совершиться через кого-либо» в русском менее прозрачно, чем «совершиться при чьём-либо посредстве», и «совершившаяся» может восприниматься как результат действия самих лиц. Уточнение сохраняет посредническое значение διʼ αὐτῶν.
