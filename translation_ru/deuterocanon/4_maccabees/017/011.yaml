  verdict: revise
  source_fidelity: Греч. Ἀληθῶς γὰρ ἦν ἀγὼν θεῖος ὁ διʼ αὐτῶν γεγενημένος буквально утверждает, что «борьба/состязание, происшедшее при их посредстве», была божественной. Предложенный порядок и характеристика «божественной» верны. Однако «совершившаяся через них» в современном русском несколько неуклюже и может звучать так, будто они именно завершили или совершили борьбу; «при их посредстве» яснее передаёт инструментальное διά с родительным, не приписывая им окончательного авторства.
  naturalness: «Поистине», «борьба» и «божественной» соответствуют современному литературному, слегка торжественному регистру. Замена «через них» на «при их посредстве» делает фразу более естественной и точной в данном контексте.
  terminology: «Борьба» удачно передаёт широкий образ ἀγών, не сужая его до спортивного состязания или вооружённого конфликта. «Божественная» — прямой и богословски нейтральный эквивалент θεῖος. Сноска сохраняет допустимую неоднозначность роли мучеников, отмеченную английским аудиторским следом.
  issues:
