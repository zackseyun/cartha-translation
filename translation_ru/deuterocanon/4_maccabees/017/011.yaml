lexical_decisions:
- source_word: Ἀληθῶς
  choice: поистине
  rationale: Передаёт торжественное и выразительное подтверждение, сохраняя возвышенный, но понятный современному читателю тон.
- source_word: ἀγών
  choice: борьба
  rationale: В контексте мученической стойкости слово обозначает напряжённое испытание или состязание; «борьба» естественно звучит по-русски и сохраняет широту греческого образа.
- source_word: θεῖος
  choice: божественной
  rationale: Прямо передаёт характеристику борьбы как относящейся к божественной сфере или отмеченной божественным характером, не уточняя сверх текста, в каком именно смысле.
- source_word: ὁ διʼ αὐτῶν γεγενημένος
  choice: совершившаяся через них
  rationale: Причастие γεγενημένος представляет борьбу как состоявшееся событие, а διά с родительным сохраняется посредством «через них», не превращая мучеников в безусловный источник её божественного характера.
theological_decisions:
- issue: Роль мучеников в выражении διʼ αὐτῶν
  choice: борьба совершилась через них
  alternative: борьба была совершена ими; борьба осуществилась в их случае
  rationale: Формулировка «через них» сохраняет значение посредничества или участия и не снимает напряжения между божественным характером борьбы и человеческим свидетельством мучеников.
translation_notes:
  register: Современный литературный русский язык с торжественной риторической окраской. Синтаксис сохраняет акцент оригинала на божественном характере мученической борьбы, оставаясь понятным без специальной богословской подготовки.
