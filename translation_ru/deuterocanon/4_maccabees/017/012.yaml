  text: For virtue was then presiding over the contest for those being tested through endurance; the victory was in incorruptibility[a], in long-lasting life.
translation:
  language: ru
  text: Ибо тогда добродетель выступала распорядительницей состязания для тех, кто проходил испытание, проявляя стойкость; победа заключалась в нетлении, в долгой жизни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в бессмертии, в вечной жизни». Буквально греческий текст говорит о «нетлении» и «долгой жизни»; сочетание этих выражений может подразумевать вечную жизнь.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀθλοθέτει
  choice: распоряжалась состязанием
  rationale: Редкий глагол использует атлетический образ и обозначает деятельность устроителя или распорядителя состязания; перевод сохраняет олицетворение добродетели и не сводит смысл лишь к вручению награды.
- source_word: ἀρετή
  choice: добродетель
  rationale: В 4 Маккавейской книге это ключевое нравственное понятие; здесь оно олицетворено.
- source_word: διʼ ὑπομονῆς
  choice: через стойкость
  rationale: Сохраняет инструментальный оттенок διά и передаёт ὑπομονή как твёрдое перенесение испытаний.
- source_word: δοκιμάζουσι
  choice: для испытываемых
  rationale: Форма допускает отнесение к тем, кто проходит испытание; контекст мучений поддерживает пассивный смысл, хотя морфологически форма может быть понята и как активная.
- source_word: τὸ νῖκος
  choice: победа
  rationale: Прямой эквивалент, продолжающий образ состязания.
- source_word: ἐν ἀφθαρσίᾳ
  choice: в нетлении
  rationale: Близко передаёт ἀφθαρσία как неподверженность тлению, не подменяя её более узким словом «бессмертие».
- source_word: ἐν ζωῇ πολυχρονίῳ
  choice: в долгой жизни
  rationale: Передаёт буквальный смысл жизни большой продолжительности, не усиливая выражение до однозначного «вечная жизнь».
theological_decisions:
- issue: Следует ли понимать ζωῇ πολυχρονίῳ как прямое обозначение вечной жизни
  choice: в долгой жизни
  alternative: в вечной жизни
  rationale: πολυχρόνιος буквально означает «долговременный, продолжительный», а не использует обычное слово «вечный». Вместе с тем соседнее «в нетлении» допускает эсхатологическое понимание, поэтому оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и сохранением атлетической метафоры. Синтаксическая плотность оригинала сохранена настолько, насколько это допускает естественная русская речь.
