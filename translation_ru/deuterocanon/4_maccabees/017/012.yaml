revisions:
- from: Ибо тогда добродетель распоряжалась состязанием для испытываемых через стойкость; победа состояла в нетлении[a], в долгой жизни.
  to: Ибо тогда добродетель выступала распорядительницей состязания для тех, кто проходил испытание, проявляя стойкость; победа заключалась в нетлении, в долгой жизни[a].
  rationale: Правка делает русский текст естественным и ясным, уточняя состязательный образ ἀθλοθετεῖ без сведения его к одному лишь вручению награды. Формулировка об испытании и стойкости передаёт контекстуально вероятное пассивное понимание δοκιμάζουσι и инструментально-обстоятельственную роль διʼ ὑπομονῆς, не вводя конфессионального толкования. «Долгая жизнь» сохранена в основном тексте; возможность эсхатологически более сильного прочтения оставлена в сноске.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:15:57Z'
