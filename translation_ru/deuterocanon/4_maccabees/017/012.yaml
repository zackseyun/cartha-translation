  - severity: medium
    issue: «для испытываемых через стойкость»
    rationale: 'Конструкция грамматически и семантически неясна: «через стойкость» может относиться и к «испытываемым», и к «распоряжалась». Более явная конструкция сохраняет связь испытания со стойкостью.'
