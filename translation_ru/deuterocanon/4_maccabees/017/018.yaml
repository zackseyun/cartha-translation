lexical_decisions:
- source_word: φησιν
  choice: говорит
  rationale: Настоящее время в формуле цитирования естественно передаётся русским литературным настоящим.
- source_word: οἱ ἡγιασμένοι
  choice: освящённые
  rationale: Перфектное страдательное причастие от ἁγιάζω обозначает тех, кто был освящён или отделён для Бога; субстантивированное «освящённые» сохраняет пассивно-результативный оттенок.
- source_word: ὑπὸ τὰς χεῖράς σου
  choice: под Твоими руками
  rationale: Сохранены предлог, множественное число и конкретный образ греческого текста без сведения его к одному толкованию — власти, попечению или защите.
- source_word: καὶ γάρ
  choice: ведь
  rationale: В данном контексте сочетание вводит подтверждение предшествующей мысли; «ведь» естественно выражает обосновывающую связь, тогда как начальное καί не требует отдельного русского эквивалента.
theological_decisions:
- issue: Образ «под Твоими руками»
  choice: Сохранить образ дословно, не уточняя его значение.
  alternative: «в Твоей власти» или «под Твоей защитой»
  rationale: Фраза допускает оттенки власти, попечения и защиты; конкретизация устранила бы подлинную неоднозначность.
- issue: Статус οἱ ἡγιασμένοι
  choice: «освящённые»
  alternative: «святые» или «посвящённые»
  rationale: Выбранный вариант сохраняет указание на совершённое над людьми освящение или отделение, не превращая его лишь в характеристику их нравственного состояния.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой цитаты. Заглавная буква в местоимении «Твоими» указывает на обращение к Богу. Маркеры сносок поставлены непосредственно после относящихся к ним выражений.
