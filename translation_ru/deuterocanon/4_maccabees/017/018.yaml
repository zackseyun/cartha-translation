translation:
  language: ru
  text: 'Ведь Моисей говорит: «И все освящённые[a] — под Твоими руками[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвящённые»; также возможно: «святые». Греческое причастие обозначает тех, кто был освящён или отделён.'
