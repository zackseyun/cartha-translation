lexical_decisions:
- source_word: τύραννον
  choice: тиран
  rationale: Сохраняет полемическую и нравственно отрицательную характеристику властителя, выраженную греческим τύραννος.
- source_word: τιμωρηθῆναι
  choice: был наказан
  rationale: Передаёт аористный пассивный инфинитив и его судебно-возмездный смысл, не сужая значение до личной мести.
- source_word: πατρίδα
  choice: родная земля
  rationale: Передаёт πατρίς как землю предков и отечество; выражение естественно для современного русского языка и сохраняет эмоциональную связь с родиной.
- source_word: καθαρισθῆναι
  choice: очищена
  rationale: Сохраняет многозначность греческого глагола, допускающего ритуальное, нравственное и общенациональное очищение.
theological_decisions:
- issue: Смысл очищения родной земли
  choice: «родная земля очищена» — без уточнения вида нечистоты
  alternative: «родная земля избавлена от осквернения»
  rationale: Греческое καθαρισθῆναι допускает одновременно ритуальный, нравственный и национально-политический смысл; уточнение неоправданно устранило бы эту смысловую напряжённость.
