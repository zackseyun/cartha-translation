  text: Eleazar was taking the lead in the contest[a]; the mother of the seven sons was competing like an athlete; and the brothers were contending.
translation:
  language: ru
  text: Елеазар выступал впереди в состязании[a]; мать семерых сыновей состязалась, а братья боролись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте последовательно употреблены три глагола из языка состязаний: Елеазар «выступал впереди в состязании», мать «состязалась» (глагол имеет атлетический оттенок), а братья «боролись». Перевод сохраняет общий образ борьбы, варьируя русские выражения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προηγωνίζετο
  choice: шёл впереди в состязании
  rationale: Имперфект среднего залога передаёт продолжающееся действие, а приставка προ- — то, что Елеазар выступал впереди остальных и предшествовал им в общей борьбе. Формулировка сохраняет образ состязания, не сводя его к буквальному бою.
- source_word: ἐνήθλει
  choice: состязалась как атлет
  rationale: Глагол ἀθλέω прямо связан с атлетическим состязанием. Такое выражение сохраняет намеренный спортивный образ и при этом понятно современному читателю.
- source_word: ἠγωνίζοντο
  choice: продолжали борьбу
  rationale: Глагол ἀγωνίζομαι может обозначать состязание, борьбу или напряжённое противостояние. «Продолжали борьбу» естественно передаёт имперфект и широкий характер образа, не утверждая, что речь идёт о буквальном вооружённом бое.
- source_word: μήτηρ τῶν ἑπτὰ παίδων
  choice: мать семерых сыновей
  rationale: Хотя παῖδες может означать «дети», в данном повествовании речь идёт о семи сыновьях; контекстуально точное обозначение предпочтительнее общего.
- source_word: ἀδελφοὶ
  choice: братья
  rationale: Форма мужского рода во множественном числе относится к семи братьям, поэтому «братья» точно передаёт греческий текст.
theological_decisions:
- issue: Сохранение образа состязания и борьбы
  choice: Сохранить состязательную лексику во всех трёх частях стиха
  alternative: Передать происходящее общими словами о терпении, страдании или мужестве
  rationale: Три разных, но тематически связанных греческих глагола изображают мученичество как благородное состязание. Сглаживание этой цепочки ослабило бы риторическую связь между Елеазаром, матерью и братьями.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим повествованию о мучениках. Синтаксический параллелизм трёх частей сохранён; спортивно-состязательный образ передан ясно, без архаизма «подвизаться», который в современном русском мог бы восприниматься преимущественно как церковный термин.
