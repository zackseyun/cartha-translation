  yaml_path: translation/deuterocanon/4_maccabees/017/001.yaml
  text: Some of the king’s guards also said that when she too was about to be seized for death[b][a], she threw herself onto the pyre so that they might not touch any part of her body.
translation:
  language: ru
  text: Некоторые из царских стражников[a] также рассказывали[b], что, когда и её собирались схватить, чтобы предать смерти, она бросилась на костёр, чтобы они не коснулись ни одной части её тела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «телохранителей»; буквально: «копьеносцев». Греческое слово часто обозначает царскую стражу.'
    reason: lexical_alternative
  - marker: b
    text: Стих передаёт это как рассказ некоторых стражников, а не как безоговорочное утверждение повествователя.
    reason: reported_claim
lexical_decisions:
- source_word: δορυφόρων
  choice: царских стражников
  rationale: Буквально слово обозначает «копьеносцев», но часто употребляется о телохранителях или дворцовой страже. «Царских» проясняет их роль по контексту, не превращая должностное обозначение в буквальное описание оружия.
- source_word: συλλαμβάνεσθαι
  choice: схватить
  rationale: Пассивный инфинитив передаёт насильственное взятие под стражу; «схватить» естественно звучит в данном контексте и не вносит современного формально-юридического оттенка слова «арестовать».
- source_word: πρὸς θάνατον
  choice: чтобы предать смерти
  rationale: Оборот указывает на смерть как цель захвата. Такая передача ясна по-русски и сохраняет связь захвата с предстоящей казнью, не уточняя её способ сверх текста.
- source_word: ψαύσειέν τι τοῦ σώματος αὐτῆς
  choice: не коснулись ни одной части её тела
  rationale: Частичная конструкция подчёркивает стремление не допустить никакого телесного прикосновения; русский оборот передаёт это естественно и точно.
- source_word: ἑαυτὴν ἔρριψεν
  choice: она бросилась
  rationale: Возвратное действие выражено по-русски глаголом «бросилась», который сохраняет намеренность и силу поступка без тяжеловесного «бросила себя».
- source_word: κατὰ τῆς πυρᾶς
  choice: на костёр
  rationale: πυρά обозначает сложенный костёр, в данном случае предназначенный для казни. Предлог «на» естественно передаёт направленное движение к нему.
theological_decisions:
- issue: Статус сообщения о последнем поступке матери
  choice: Представить событие как рассказ некоторых стражников, а не как безоговорочное утверждение повествователя.
  alternative: Передать поступок непосредственно от лица повествователя либо ослабить его как неопределённое позднейшее предание.
  rationale: 'Формула ἔλεγον … τινές прямо отмечает ограниченный источник сообщения: «некоторые рассказывали». Перевод сохраняет эту повествовательную дистанцию, не смягчая и не оправдывая сам поступок.'
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Глагол «рассказывали» естественно передаёт продолженное ἔλεγον и подчёркивает характер свидетельства; насилие и повествовательная неоднозначность не смягчены.
