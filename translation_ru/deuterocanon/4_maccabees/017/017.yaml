  yaml_path: translation/deuterocanon/4_maccabees/017/017.yaml
  text: Indeed, the tyrant himself and all their council marveled at their endurance, because of which they now stand beside the divine throne and live the blessed age.
translation:
  language: ru
  text: Даже сам тиран и весь совет тирана изумились их стойкости, благодаря которой они теперь предстоят божественному престолу[a] и живут в блаженном веке[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стоят у божественного престола». Греческое выражение может означать присутствие перед престолом или положение рядом с ним.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «живут блаженный век»; вероятно, имеется в виду вечное блаженное состояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτός γέ τοι
  choice: Даже сам
  rationale: 'Сочетание местоимения и усилительных частиц подчёркивает неожиданность: стойкости мучеников изумился сам тиран.'
- source_word: ὁ τύραννος
  choice: тиран
  rationale: Передаёт враждебную характеристику Антиоха, а не нейтральный титул правителя.
- source_word: συνέδριον
  choice: совет
  rationale: Обозначает собранный при тиране совещательный или судебный орган, не уточняя его устройство сверх текста.
- source_word: ἐξεθαύμασαν
  choice: изумились
  rationale: Форма с приставкой выражает сильное удивление; русское «изумились» естественно сочетается с дательным объектом.
- source_word: ὑπομονήν
  choice: стойкость
  rationale: В контексте мучений означает твёрдое терпение и верность под страданием; «стойкость» сохраняет нравственный оттенок.
- source_word: διʼ ἣν
  choice: благодаря которой
  rationale: Сохраняет причинную связь между стойкостью мучеников и их нынешним положением, не превращая её в строго разработанное учение о заслуге.
- source_word: τῷ θείῳ ... θρόνῳ
  choice: божественному престолу
  rationale: Буквально передаёт прилагательное θείῳ и сохраняет возвышенный регистр, не заменяя его более явным «престолу Бога».
- source_word: παρεστήκασιν
  choice: предстоят
  rationale: Русское «предстоят» естественно передаёт совершенное настоящее состояние служебного или почётного присутствия у престола; пространственная точность поясняется в сноске.
- source_word: τὸν μακάριον ... αἰῶνα
  choice: в блаженном веке
  rationale: Сохраняет образ αἰών как «век», а русская конструкция с предлогом делает необычное греческое выражение понятным.
- source_word: βιοῦσιν
  choice: живут
  rationale: Прямо передаёт глагол настоящего времени и сохраняет утверждение о нынешнем блаженном состоянии.
theological_decisions:
- issue: Посмертная награда мучеников
  choice: Они уже теперь предстоят божественному престолу и живут в блаженном веке.
  alternative: Они стоят рядом с божественным престолом и наслаждаются блаженной вечностью.
  rationale: Сохранены настоящее время и образность греческого текста без сведения их к более поздней догматической системе; «блаженный век» не заменён истолковывающим словом «вечность».
- issue: Положение относительно престола
  choice: предстоят божественному престолу
  alternative: стоят рядом с божественным престолом
  rationale: παρίστημι с дательным допускает присутствие перед престолом или при нём. «Предстоят» сохраняет служебно-почётную сцену, а сноска отмечает пространственную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Предстоят» и «престол» соответствуют торжественной сцене, но синтаксис остаётся доступным; необычность выражения «блаженный век» намеренно сохранена и пояснена сноской.
