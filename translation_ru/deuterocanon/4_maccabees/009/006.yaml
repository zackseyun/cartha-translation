base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/006.yaml
  text: But if the old men of the Hebrews died after enduring tortures because of godliness, how much more rightly should we, the young men, die, having disregarded the tortures of your compulsion, which the aged instructor also conquered.
translation:
  language: ru
  text: Но если пожилые евреи умерли за благочестие, претерпев пытки, то нам, молодым, тем более справедливо было бы умереть, презрев пытки, которыми ты принуждаешь нас, — пытки, которые одолел и престарелый наставник.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ γέροντες τῶν Ἑβραίων
  choice: пожилые мужи из евреев
  rationale: Передаёт возрастное значение γέροντες без возможного церковно-должностного оттенка слова «старейшины»; родительный τῶν Ἑβραίων понимается как принадлежность к народу.
- source_word: διὰ τὴν εὐσέβειαν
  choice: за благочестие
  rationale: 'Кратко и естественно передаёт причину их смерти: верность благочестию.'
- source_word: ἀποθάνοιμεν ἂν δικαιότερον
  choice: тем более подобает умереть нам
  rationale: Передаёт потенциально-нормативный оттенок оптатива с ἄν и сравнительное δικαιότερον естественной русской формулой, не превращая слова в категорический приказ.
- source_word: τὰς βασάνους τῶν σῶν ἀναγκῶν
  choice: пытки, которыми ты принуждаешь нас
  rationale: Раскрывает тяжеловесную родительную конструкцию как пытки, служащие средством принуждения; объект «нас» ясно подразумевается контекстом речи юношей.
- source_word: ὑπεριδόντες
  choice: презрев
  rationale: Сохраняет активный оттенок сознательного пренебрежения угрозой пыток, а не просто их пассивного перенесения.
- source_word: ὁ παιδευτὴς γέρων
  choice: престарелый наставник
  rationale: παιδευτής обозначает наставника или воспитателя, а γέρων подчёркивает его преклонный возраст.
- source_word: ἐνίκησεν
  choice: одолел
  rationale: Сохраняет образ победы над пытками, присутствующий в греческом глаголе.
theological_decisions:
- issue: Основание смерти мучеников
  choice: «умерли за благочестие»
  alternative: «умерли из-за благочестия»
  rationale: Предлог διά с винительным выражает причину; «за благочестие» в данном контексте естественно указывает на смерть вследствие верности благочестию, не добавляя конфессиональной трактовки.
- issue: Сила высказывания ἀποθάνοιμεν ἂν
  choice: «подобает умереть нам»
  alternative: «нам следовало бы умереть»
  rationale: Выбрана форма, передающая нравственную уместность и потенциальность без ослабляющего для живой речи прошедшего условного оттенка.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной речью. «Пожилые мужи» избегает неоднозначности должностного «старейшины», а «престарелый наставник» сохраняет возрастной контраст и роль παιδευτής. Синтаксис слегка распрямлён ради ясности, при этом образ победы над пытками и нравственное сопоставление поколений сохранены.
