lexical_decisions:
- source_word: διὰ πασῶν ... τῶν βασάνων
  choice: всеми этими пытками
  rationale: Предлог διά с родительным здесь естественно передаёт средство, а множественное πασῶν ... τῶν βασάνων — всю совокупность пыток. Указательное «этими» по-русски естественно передаёт определённость греческого артикля в данном контексте.
- source_word: πείσω
  choice: я докажу
  rationale: Будущее πείθω может означать «убежу»; в контексте стойкости перед пытками русское «докажу» естественно выражает убеждение посредством наглядного свидетельства, не добавляя завершения мысли.
- source_word: ὑμᾶς
  choice: вам
  rationale: Местоимение второго лица множественного числа является дополнением при πείσω; дательный падеж требуется русским глаголом «докажу».
- source_word: μόνοι
  choice: только
  rationale: Передаёт исключительное значение μόνοι и естественно относится к следующей именной группе.
- source_word: οἱ παῖδες Ἑβραίων
  choice: сыны евреев
  rationale: παῖδες допускает значения «дети», «юноши» и «сыновья». Контекст говорит о братьях мужского пола; «сыны евреев» сохраняет мужской и родовой оттенок, а также конструкцию с родительным падежом.
theological_decisions:
- issue: Родовая конкретность παῖδες
  choice: сыны
  alternative: дети; юноши
  rationale: Контекст относится к конкретным братьям мужского пола, поэтому мужская форма оправданна. Более нейтральное «дети» ослабило бы контекстуальную конкретность.
- issue: Незавершённость сохранившейся фразы
  choice: не восполнять подразумеваемое продолжение
  alternative: добавить смысловое сказуемое или завершение из следующего стиха
  rationale: Греческая формулировка синтаксически не завершена в изоляции и, вероятно, продолжается в следующем стихе. Перевод сохраняет это напряжение, не вводя отсутствующего материала.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. «Сыны» выбрано как контекстуально точное и стилистически уместное обозначение братьев; незавершённость исходной фразы намеренно сохранена.
