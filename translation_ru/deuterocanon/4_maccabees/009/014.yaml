  source_fidelity: 'Смысл в целом передан верно: κλώμενος описывает физическое ломание тела, κατὰ πᾶν μέλος — распределённость по членам тела, а имперфект κατηγόρει — продолжающееся действие. Однако порядок слов в «ему ломали один за другим все члены тела» несколько затрудняет чтение; «обличать» допустимо контекстуально, но менее точно передаёт обычное значение κατηγορέω — «обвинять».'
