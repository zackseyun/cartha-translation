lexical_decisions:
- source_word: κατὰ πᾶν μέλος
  choice: один за другим все члены тела
  rationale: Оборот имеет распределительное значение — «по каждому члену». Такая передача сохраняет телесный и последовательный характер истязания, оставаясь понятной по-русски.
- source_word: κλώμενος
  choice: когда ему ломали
  rationale: Страдательное причастие обозначает физическое ломание тела под пыткой. Личная конструкция естественнее для современного русского и не усиливает смысл до «дробили» или «терзали».
- source_word: κατηγόρει
  choice: он продолжал обличать их
  rationale: Имперфект передаёт продолженное действие. В данном контексте глагол означает обвиняющее осуждение мучителей; «обличать» звучит естественнее, чем формально-юридическое «обвинять», не сводя речь лишь к упрёку.
- source_word: λέγων
  choice: говоря
  rationale: Причастие стандартно вводит прямую речь следующего стиха и сохраняет незавершённую синтаксическую связь.
