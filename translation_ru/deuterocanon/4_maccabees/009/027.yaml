lexical_decisions:
- source_word: ὡς δʼ εἰ ... πυνθανόμενοι
  choice: Когда же его спросили
  rationale: Оборот вводит следующее обстоятельство повествования; временная конструкция естественна по-русски. Страдательная форма передаёт неопределённый субъект спрашивающих, подразумеваемый контекстом.
- source_word: φαγεῖν
  choice: поесть
  rationale: Инфинитив означает «есть»; совершенный вид с приставкой естественно обозначает принятие пищи в данной ситуации.
- source_word: βούλοιτο
  choice: хочет ли он
  rationale: Оптатив в косвенном вопросе передаёт желание; русская конструкция с «ли» сохраняет вопросительный и волевой оттенки.
- source_word: πρὶν βασανίζεσθαι
  choice: перед пыткой
  rationale: В контексте мученичества βασανίζεσθαι означает подвергнуться пытке. Существительное даёт краткую и естественную русскую формулировку, не ослабляя смысла.
- source_word: τὴν εὐγενῆ γνώμην
  choice: о его благородной решимости
  rationale: γνώμη здесь обозначает твёрдое намерение или внутреннюю установку, а εὐγενής — нравственное благородство. Предлог «о» делает сочетание с «услышали» естественным, не добавляя содержания ответа.
- source_word: ἤκουσαν
  choice: они услышали
  rationale: Прямо передаёт простой аорист глагола «слышать» и сохраняет субъект оригинала.
theological_decisions:
- issue: Значение γνώμη в рассказе о мученичестве
  choice: решимость
  alternative: намерение; образ мыслей; мнение
  rationale: «Решимость» сохраняет нравственно-волевой смысл стойкости героя, не вводя позднейшей богословской терминологии. Смысловая широта греческого слова отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Конечная запятая сохранена, поскольку стих синтаксически продолжается далее.
