translation_notes:
  register: 'Современный литературный русский язык; изложение ясное и сдержанное, без архаизмов. Сохранены последовательность действий и подразумеваемая безуспешность бичевания. Английские сноски были сверены с греческим текстом: примечание о значении ἐπί не поставлено после слова «плетьми», поскольку в оригинале предлог относится к колесу; культурное пояснение привязано к слову «колесо».'
