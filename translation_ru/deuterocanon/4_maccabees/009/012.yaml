  text: But when they grew weary from striking him with whips[a], accomplishing nothing[b], they put him on the wheel.
translation:
  language: ru
  text: Когда же они устали бить его плетьми, ничего не добившись, то положили его на колесо[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Речь идёт о колесе, использовавшемся как орудие пытки.
    reason: cultural_note
lexical_decisions:
- source_word: τύπτοντες
  choice: бить его
  rationale: Причастие передаёт повторяющиеся удары; «бить» естественно звучит по-русски и не усиливает значение греческого слова.
- source_word: ταῖς μάστιξιν
  choice: плетьми
  rationale: μάστιξ обозначает плеть или бич для телесного наказания; «плетьми» понятно современному читателю и уместно в данном контексте.
- source_word: ἐκοπίασαν
  choice: устали
  rationale: Глагол означает утомиться от труда или действия; простое «устали» точно и естественно передаёт повествовательный аорист.
- source_word: μηδὲν ἀνύοντες
  choice: ничего не добившись
  rationale: Оборот указывает, что мучителям не удалось достичь желаемого результата; деепричастная конструкция сохраняет обстоятельственное отношение к основному действию.
- source_word: ἀνέβαλον
  choice: положили
  rationale: В данном контексте глагол означает поместить человека на орудие пытки; «положили» конкретнее общего «поместили» и соответствует направлению движения, выраженному ἐπί с винительным падежом.
- source_word: ἐπὶ τὸν τροχόν
  choice: на колесо
  rationale: Предлог ἐπί с винительным падежом передаёт помещение на орудие; τροχός здесь обозначает колесо, служившее для пытки.
