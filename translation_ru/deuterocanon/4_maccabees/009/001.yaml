  yaml_path: translation/deuterocanon/4_maccabees/009/001.yaml
  text: What are you waiting for[b][a], O tyrant? For we are ready to die rather than transgress the commandments of our fathers.
translation:
  language: ru
  text: — Чего ты медлишь, тиран? Ведь мы готовы скорее умереть, чем преступить заповеди наших отцов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «унаследованные нами заповеди»; буквально: «отеческие наши заповеди». Речь идёт о заповедях, полученных от предков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί μέλλεις
  choice: Чего ты медлишь
  rationale: Оборот передаёт упрёк в промедлении или колебании; такая формулировка естественно звучит как риторический вызов и сохраняет неоднозначность между ожиданием и нерешительностью.
- source_word: ὦ τύραννε
  choice: тиран
  rationale: Сохраняет прямое обращение и явно отрицательную оценку угнетающего правителя; русская звательная интонация передаётся обращением с запятой.
- source_word: ἑτοῖμοι γάρ ἐσμεν
  choice: Ведь мы готовы
  rationale: γάρ обосновывает вызов в первом вопросе; «ведь» естественно передаёт эту пояснительно-причинную связь.
- source_word: ἀποθνήσκειν
  choice: умереть
  rationale: Греческий инфинитив означает «умереть» и сам по себе не уточняет пассивное причинение смерти, хотя контекст предполагает казнь.
- source_word: ἢ παραβαίνειν
  choice: скорее умереть, чем преступить
  rationale: В данном сопоставлении ἢ вводит отвергаемую альтернативу; русская конструкция «скорее... чем...» ясно и идиоматично выражает предпочтение смерти.
- source_word: τὰς πατρίους ἡμῶν ἐντολάς
  choice: заповеди наших отцов
  rationale: Сохраняет значение унаследованных от предков установлений и выраженное в греческом тексте указание на отцов, не сводя речь только к частным семейным правилам.
theological_decisions:
- issue: Передача πατρίους ἡμῶν как гендерно маркированного обозначения предков
  choice: наших отцов
  alternative: наших предков; отеческие заповеди
  rationale: Греческая фраза использует язык отцов и указывает на унаследованные заповеди иудейской традиции. «Наших отцов» сохраняет эту образность, тогда как «предков» нейтрализует её, а «отеческие» менее ясно для современного читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством мученической речи. «Преступить заповеди» сохраняет возвышенный религиозно-нравственный регистр, оставаясь понятным; частица «ведь» естественно передаёт γάρ. Начальное тире оформляет прямую речь.
