  yaml_path: translation/deuterocanon/4_maccabees/009/015.yaml
  text: Most defiled tyrant[a], enemy of heavenly justice, and savage-minded man, you are not torturing me in this way because I have committed murder, nor because I have acted impiously, but because I am defending the divine law.
translation:
  language: ru
  text: «О, гнуснейший тиран, враг небесного правосудия[a], жестокий сердцем! Ты так истязаешь меня не за то, что я совершил убийство, и не за то, что поступил нечестиво, а за то, что я защищаю Божий закон».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небесного суда»; греческое слово может означать как правосудие в широком смысле, так и суд или судебное воздаяние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιερώτατε
  choice: нечестивейший
  rationale: Превосходная степень в обращении выражает крайнюю нравственно-религиозную осквернённость. «Нечестивейший» естественно и веско передаёт это как прямое обличение, не сводя смысл к общей порочности.
- source_word: τῆς οὐρανίου δίκης
  choice: небесного правосудия
  rationale: δίκη охватывает справедливость, судебное воздаяние и наказание. «Небесное правосудие» сохраняет нравственно-судебный диапазон и сочетание с определением οὐρανίου.
- source_word: ὠμόφρον
  choice: жестокий сердцем
  rationale: Сложное слово характеризует жестокий, свирепый внутренний склад. Русское «жестокий сердцем» звучит естественно и сохраняет направленность характеристики на внутреннее расположение.
- source_word: καταικίζεις
  choice: истязаешь
  rationale: В контексте физических мучений глагол обозначает жестокое надругательство и мучение; «истязаешь» точно и выразительно передаёт действие.
- source_word: ἀνδροφονήσαντά
  choice: совершил убийство
  rationale: Причастие означает убийство человека и подразумевает кровную вину. Формулировка «совершил убийство» сохраняет уголовно-нравственный смысл и высокий регистр.
- source_word: ἀσεβήσαντα
  choice: поступил нечестиво
  rationale: Глагол обозначает нечестивое действие против Бога или священных обязанностей. Перевод сохраняет религиозную составляющую.
- source_word: θείου νόμου
  choice: Божий закон
  rationale: θείου буквально означает «божественного». В современном русском «Божий закон» ясно и естественно обозначает закон, исходящий от Бога, не меняя референта.
- source_word: προασπίζοντα
  choice: защищаю
  rationale: Глагол означает выступать на защиту, прикрывать как защитник. «Защищаю» непосредственно передаёт противопоставление мнимой вине и действительной причине мучений.
theological_decisions:
- issue: Смысл δίκη в выражении τῆς οὐρανίου δίκης
  choice: небесное правосудие
  alternative: небесный суд; небесное воздаяние
  rationale: «Правосудие» удерживает широкий нравственно-судебный смысл и не ограничивает выражение только судебным приговором, эсхатологическим судом или наказанием.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной обличительной риторикой. Восклицательное обращение оформлено отдельной интонационной группой; дальнейшая фраза сохраняет трёхчастное противопоставление оригинала.
