lexical_decisions:
- source_word: δορυφόρων
  choice: телохранители
  rationale: В данном повествовательном контексте слово обозначает вооружённых приближённых или стражников при правителе; «телохранители» точно и естественно передаёт эту роль.
- source_word: Ὁμολόγησον φαγεῖν
  choice: Согласись поесть
  rationale: ὁμολογέω с инфинитивом здесь выражает согласие совершить действие, а не исповедание веры или простое словесное признание. Русское «согласись поесть» сохраняет побуждение принять пищу.
- source_word: ἀπαλλαγῇς
  choice: тебя отпустили
  rationale: Пассивная форма в контексте удержания и истязания означает освобождение. Личная конструкция по-русски звучит естественнее буквального «ты был освобождён».
