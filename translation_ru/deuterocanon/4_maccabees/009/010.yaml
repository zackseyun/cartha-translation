  yaml_path: translation/deuterocanon/4_maccabees/009/010.yaml
  text: When they said these things[a], the tyrant was angered not only as against men who were disobedient, but was also enraged as against the ungrateful.
translation:
  language: ru
  text: Когда они сказали это, тиран не только негодовал на них как на непокорных[a], но и разгневался на них как на неблагодарных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как против непокорных». Греческое слово стоит во множественном числе мужского рода без выраженного существительного; слова «на них» добавлены по смыслу и указывают на братьев.'
    reason: Сохранить грамматическую особенность оригинала и пояснить добавленное для ясности местоимение.
lexical_decisions:
- source_word: Ταῦτα αὐτῶν εἰπόντων
  choice: Когда они сказали это
  rationale: Генитив абсолютный передан естественным временным придаточным; «это» отсылает к предшествующим словам братьев и в русском языке естественно передаёт греческое нейтральное множественное Ταῦτα.
- source_word: ὁ τύραννος
  choice: тиран
  rationale: Сохраняет явную отрицательную оценку автора; варианты «царь» или «правитель» неоправданно смягчили бы текст.
- source_word: οὐ μόνον ... ἀλλʼ ... καὶ
  choice: не только ... но и
  rationale: Стандартно и естественно передаёт греческую соотносительную конструкцию.
- source_word: ὡς κατὰ ἀπειθούντων
  choice: на них как на непокорных
  rationale: 'Предлог «на» передаёт враждебную направленность κατὰ с родительным, а «как» сохраняет значение ὡς: речь идёт о том, кем тиран их считал, а не об объективном авторском утверждении.'
- source_word: ἐχαλέπαινεν
  choice: негодовал
  rationale: Несовершенный вид отражает имперфект и сохраняет оттенок продолжающегося возмущения, отличая этот глагол от последующего ὠργίσθη.
- source_word: ὡς καὶ κατὰ ἀχαρίστων
  choice: но и ... на них как на неблагодарных
  rationale: «Как» сохраняет перспективу тирана, а «неблагодарных» передаёт его нравственное обвинение, не принимая его за голос повествователя.
- source_word: ὠργίσθη
  choice: разгневался
  rationale: Совершенный вид соответствует аористу и передаёт вспышку или наступление гнева, сохраняя отличие от имперфекта ἐχαλέπαινεν.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного регистра. Пара «негодовал — разгневался» сохраняет различие вида и оттенков двух греческих глаголов; повтор «на них» выбран ради ясности параллельных обвинений.
