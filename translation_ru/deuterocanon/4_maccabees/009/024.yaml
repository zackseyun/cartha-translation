  text: through which our righteous and ancestral providence[a], having become gracious to the nation[b], might punish the accursed tyrant.
translation:
  language: ru
  text: чтобы через неё наше праведное и унаследованное от предков Провидение, став благосклонным к народу[a], покарало проклятого[b] тирана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «став милостивым к народу»; греческое слово означает благоприятное, милостивое расположение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «губительного» либо «связанного с мщением»; греческое слово может обозначать проклятого, несущего погибель или мстящего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ἧς
  choice: через неё
  rationale: διά с родительным передаёт средство; женский род местоимения сохраняет связь с предшествующим антецедентом, не называя его заново.
- source_word: ἵλεως … τῷ ἔθνει γενηθεῖσα
  choice: став благосклонным к народу
  rationale: ἵλεως обозначает благоприятное, милостивое расположение, а аористное причастие γενηθεῖσα сохраняется оборотом «став».
- source_word: ἡ δικαία καὶ πάτριος ἡμῶν πρόνοια
  choice: наше праведное и отеческое Провидение
  rationale: «Провидение» сохраняет возвышенный богословский регистр πρόνοια без явного добавления слова «Божье»; «отеческое» передаёт πάτριος как связанное с отцами и предками, а не просто заботливое.
- source_word: τιμωρήσειεν
  choice: покарало
  rationale: Форма с «чтобы» и прошедшим временем передаёт греческий оптатив в целевом или желательном оттенке; «покарало» выражает правосудное наказание без обязательного акцента на личной мести.
- source_word: τὸν ἀλάστορα τύραννον
  choice: проклятого тирана
  rationale: В данном обличительном контексте ἀλάστωρ естественно характеризует тирана как проклятого или навлекающего погибель, хотя слово допускает и связь с мщением.
theological_decisions:
- issue: Кого или что обозначает «наше праведное и отеческое Провидение»
  choice: Сохранена почтительная, богословски насыщенная формулировка «Провидение» без прямого уточнения «Божье».
  alternative: Понимать πρόνοια как безличное провидение или прямо развернуть выражение как «Божье попечение».
  rationale: Контекст допускает отнесение к Божьей заботе об Израиле, но греческий текст не называет Бога прямо; перевод не устраняет эту напряжённость.
- issue: Значение оптатива τιμωρήσειεν
  choice: Передан конструкцией «чтобы … покарало», допускающей цель и желаемый результат.
  alternative: «Да покарает» как более явное пожелание или «могло бы покарать» как возможность.
  rationale: Синтаксис фрагмента связан с предшествующим контекстом, поэтому русская целевая конструкция сохраняет зависимость и не делает высказывание излишне категоричным.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным синтаксисом. Начальная зависимая конструкция сохранена, поскольку стих продолжает предшествующую мысль. «Провидение» написано с прописной буквы как почтительное обозначение божественного попечения, но слово «Божье» не добавлено.
