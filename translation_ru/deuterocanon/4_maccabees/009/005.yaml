  yaml_path: translation/deuterocanon/4_maccabees/009/005.yaml
  text: But you are trying to frighten us by threatening us with death through tortures[a], as though you had not learned from Eleazar a little while ago.
translation:
  language: ru
  text: Но ты пытаешься запугать нас, угрожая нам смертью посредством пыток, словно совсем недавно ты не научился у Елеазара.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как будто недавний пример Елеазара ничему тебя не научил». Это риторический, саркастический упрёк, а не буквальное отрицание того, что пример Елеазара уже должен был послужить тебе уроком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκφοβεῖς
  choice: пытаешься запугать
  rationale: Настоящее время передаёт действие правителя; формулировка естественно выражает попытку вызвать страх, не усиливая значение до «ужаснуть».
- source_word: ἀπειλῶν
  choice: угрожая
  rationale: Причастие указывает, каким способом правитель пытается запугать братьев.
- source_word: τὸν διὰ τῶν βασάνων ἡμῖν θάνατον
  choice: нам смертью под пытками
  rationale: Оборот с διά и родительным обозначает средство или обстоятельство причинения смерти; «смерть под пытками» ясно и естественно передаёт смерть, наступающую вследствие истязаний.
- source_word: πρὸ βραχέως
  choice: совсем недавно
  rationale: Передаёт краткий промежуток времени до описываемой речи.
- source_word: παρὰ Ἐλεαζάρου μαθών
  choice: получил урока от Елеазара
  rationale: παρά с родительным при μανθάνω обозначает источник усвоенного урока; выражение сохраняет отсылку к недавнему примеру Елеазара и звучит естественно по-русски.
theological_decisions:
- issue: Риторическая сила оборота ὥσπερ οὐχί
  choice: словно совсем недавно ты не получил урока от Елеазара
  alternative: хотя совсем недавно пример Елеазара должен был тебя научить
  rationale: Основной текст сохраняет отрицательную сравнительную конструкцию и саркастический упрёк оригинала, не превращая её в прямое утверждение о том, что правитель действительно чему-либо научился.
translation_notes:
  register: Современный литературный русский язык с достойным, прямым тоном мученической речи. «Получил урок» передаёт подразумеваемую силу примера Елеазара без конфессионального толкования; местоимение «ты» соответствует прямому обращению.
