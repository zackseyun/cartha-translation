    issue: Оборот «смертью под пытками»
    rationale: διὰ τῶν βασάνων означает «посредством/через пытки»; вариант «под пытками» допускает более слабое значение обстоятельства, а не средства.
  - severity: low
    issue: «Получил урока от Елеазара»
    rationale: Это естественная русская идиома, но μαθών точнее передаётся глаголом «научился»; «урок» может подразумевать намеренное наставление, которого греческий текст прямо не говорит.
  - severity: low
    issue: Фраза примечания «правитель видел случившееся с Елеазаром»
    rationale: Она является контекстуальным пояснением, но не выражена в самом стихе; лучше говорить о примере Елеазара, не конкретизируя способ, которым правитель о нём узнал.
