  source_fidelity: Греческое πεῖραζε — настоящее повелительное без выраженного дополнения; «Так испытай же нас» добавляет объект «нас» и несколько сужает вызов. Частица «даже» в оригинале отсутствует. τὰς ἡμῶν ψυχὰς ... θανατώσεις в данном контексте означает лишение жизни; «лишишь нас жизни» передаёт это естественно и не утверждает уничтожение души. βλάπτειν βασανίζων точнее передать деепричастным оборотом «подвергая нас пыткам».
  naturalness: Предлагаемая редакция сохраняет современный литературный русский и энергичный, вызывающий тон обращения. «Что ж, попробуй, тиран» естественно передаёт риторический императив без искусственного добавления объекта.
  terminology: «Благочестие» — приемлемая точная передача εὐσέβεια в этом контексте. «Тиран» соответствует τύραννε и регистру текста. Сноски не требуются.
