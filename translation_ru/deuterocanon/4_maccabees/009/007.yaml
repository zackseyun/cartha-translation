  yaml_path: translation/deuterocanon/4_maccabees/009/007.yaml
  text: Go on, then, tyrant; and if you kill our lives because of godliness, do not suppose that by torturing us you are harming us.
translation:
  language: ru
  text: Что ж, попробуй, тиран! И если ты лишишь нас жизни за благочестие, не думай, что, подвергая нас пыткам, причиняешь нам вред.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεῖραζε
  choice: испыта́й нас
  rationale: 'Императив передаёт вызов тирану: пусть подвергнет братьев испытанию пытками. Дополнение «нас» естественно следует из контекста и делает русскую фразу ясной.'
- source_word: τὰς ἡμῶν ψυχὰς ... θανατώσεις
  choice: умертвишь нас
  rationale: Буквально необычное сочетание «умертвишь наши души/жизни» означает лишение жизни. Русское «умертвишь нас» сохраняет смысл физического убийства, не создавая лишнего утверждения об уничтожимости души.
- source_word: διὰ τὴν εὐσέβειαν
  choice: за благочестие
  rationale: εὐσέβεια здесь означает верность Богу, выраженную благочестивым соблюдением Закона; «за благочестие» кратко и точно передаёт причину казни.
- source_word: βλάπτειν βασανίζων
  choice: своими пытками причиняешь нам вред
  rationale: Передаёт обстоятельственный причастный оборот и сохраняет парадоксальное заявление, что пытки не наносят подлинного вреда верным.
theological_decisions:
- issue: Значение ψυχάς в выражении о смерти
  choice: Передать всё выражение как «умертвишь нас»
  alternative: «умертвишь наши души» или «лишишь нас жизни»
  rationale: «Наши души» в современном русском может ошибочно подразумевать уничтожение нематериальной души. Контекст говорит об убийстве людей; при этом перевод не уточняет посмертную участь и не снимает богословское напряжение следующего утверждения о невозможности причинить им подлинный вред.
translation_notes:
  register: Современный литературный русский язык с торжественным, вызывающим тирана тоном. Обращение «тиран» и восклицание сохраняют риторическую силу оригинала; синтаксис упрощён без утраты логики высказывания.
