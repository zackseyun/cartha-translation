  yaml_path: translation/deuterocanon/4_maccabees/009/003.yaml
  text: Counselor of lawlessness[a], tyrant, do not hate us; rather, have mercy on us more than on them.
translation:
  language: ru
  text: Советник беззакония[a], тиран, не ненавидь нас; помилуй нас больше, чем их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь сжат и синтаксически неоднозначен. Буквально: «Советник, тиран беззакония, не ненавидя нас больше них, помилуй нас». Начальное обращение можно понять и как «Советник, тиран беззакония». Не вполне ясна также связь выражения «больше них»: его можно отнести к просьбе о милости («помилуй нас больше, чем их») либо понимать как «из-за них».'
    reason: Сохранение синтаксической и смысловой неоднозначности греческого текста.
lexical_decisions:
- source_word: σύμβουλε
  choice: советник
  rationale: Звательная форма единственного числа от σύμβουλος; «советник» прямо передаёт обращение и не добавляет отсутствующей в тексте идеи заговора.
- source_word: τύραννε
  choice: тиран
  rationale: Звательная форма обозначает правителя-преследователя и сохраняет резко отрицательную нравственно-политическую окраску греческого слова.
- source_word: παρανομίας
  choice: беззакония
  rationale: Родительный падеж сохранён, чтобы передать характеристику через связь с нарушением закона и не устранять синтаксическую сжатость греческого выражения.
- source_word: μὴ … μισῶν
  choice: не ненавидь
  rationale: Причастная конструкция с μή в данном обращении имеет запретительный смысл; личная форма естественна по-русски.
- source_word: ὑπὲρ αὐτούς
  choice: больше, чем их
  rationale: ὑπέρ с винительным падежом допускает сравнительное значение «больше, чем»; эта передача оставляет сравнение явным.
- source_word: ἐλέα
  choice: помилуй
  rationale: Повелительная форма от ἐλεέω выражает просьбу проявить милость; «помилуй» кратко и весомо передаёт этот смысл.
theological_decisions:
- issue: Связь повторённого ἡμᾶς с оборотом ὑπὲρ αὐτούς
  choice: Просьба помиловать «нас» больше, чем «их»
  alternative: Не ненавидеть нас из-за них и помиловать нас
  rationale: Греческий текст синтаксически сжат, однако ὑπέρ с винительным часто выражает сравнение. Основной текст следует этому чтению, а причинное понимание отмечено в сноске, чтобы не скрывать подлинную неоднозначность.
- issue: Синтаксическая связь παρανομίας в начальном обращении
  choice: «Советник беззакония, тиран»
  alternative: «Советник, тиран беззакония»
  rationale: Положение родительного παρανομίας допускает некоторую синтаксическую сжатость. Выбранное чтение соответствует непосредственному сочетанию «советник беззакония», но альтернативная связь отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи мученика. Резкие обращения «советник беззакония» и «тиран» сохранены; громоздкая греческая конструкция умеренно сглажена, а её неоднозначность вынесена в сноску.
