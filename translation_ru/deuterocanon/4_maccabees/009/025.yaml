lexical_decisions:
- source_word: καὶ
  choice: Сказав это
  rationale: Связка καί включена в естественную русскую последовательную конструкцию с деепричастием; отдельное «и» здесь было бы необязательным и стилистически тяжеловесным.
- source_word: ταῦτα εἰπών
  choice: Сказав это
  rationale: Аористное причастие передаёт действие, предшествующее основному; краткая русская конструкция естественно сохраняет последовательность.
- source_word: ὁ ἱεροπρεπὴς
  choice: благочестивый
  rationale: ἱεροπρεπής характеризует человека как подобающего святыне, почтительного к священному; «благочестивый» естественно передаёт религиозно-нравственную характеристику, не приписывая юноше священнического сана.
- source_word: νεανίας
  choice: юноша
  rationale: Обычное литературное русское обозначение молодого мужчины, соответствующее греческому слову.
- source_word: ἀπέρρηξεν τὴν ψυχήν
  choice: испустил дух
  rationale: Греческое выражение буквально говорит об отделении или исторжении души, но в контексте является идиомой смерти. Русское «испустил дух» естественно и достойно передаёт смерть, сохраняя образность выражения.
theological_decisions:
- issue: Передача τὴν ψυχήν в идиоматическом обозначении смерти
  choice: испустил дух
  alternative: отдал душу / умер
  rationale: Контекст описывает наступление смерти, не формулируя подробного учения о природе души. Выбранная русская идиома сохраняет образность и богословскую ненавязчивость; буквальная альтернатива приведена в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным звучанием. «Благочестивый» уместен в религиозном контексте и не подразумевает священнического служения; «испустил дух» сохраняет достоинство и образность оригинала.
