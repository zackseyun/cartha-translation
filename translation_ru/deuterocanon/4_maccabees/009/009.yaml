  yaml_path: translation/deuterocanon/4_maccabees/009/009.yaml
  text: But because of our sacred murder[a], you will, by divine justice[b], endure a sufficient eternal torment by fire.
translation:
  language: ru
  text: А ты за святотатственное убийство нас[a] по божественному правосудию[b] сполна претерпишь вечную муку огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за убийство нас, святых»; возможен также смысл: «за нечестивое кровопролитие».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по Божьему воздаянию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μιεροφονίαν
  choice: святотатственное убийство
  rationale: Редкое сложное слово соединяет идею убийства с осквернением святыни; в контексте это убийство людей, посвящённых Богу. Русское «святотатственное убийство» естественно передаёт этот свято-профанный оттенок, не превращая выражение в неясное «священное убийство».
- source_word: αὐτάρκη καρτερήσεις
  choice: сполна претерпишь
  rationale: αὐτάρκη усиливает καρτερήσεις и указывает, что адресат вынесет назначенную муку во всей полноте. «Сполна претерпишь» явно передаёт оба элемента и звучит по-русски естественно.
- source_word: θείας δίκης
  choice: по божественному правосудию
  rationale: δίκη может означать правосудие, воздаяние или кару. «По божественному правосудию» сохраняет судебно-нравственную широту выражения и не сужает его до одного лишь приговора.
- source_word: αἰώνιον βάσανον
  choice: вечную муку
  rationale: βάσανος обозначает тяжёлое мучение; «мука» сохраняет силу образа, а αἰώνιον прямо передано словом «вечную», без дополнительной догматической конкретизации.
- source_word: διὰ πυρός
  choice: огнём
  rationale: 'διά с родительным падежом выражает средство: мучение совершается посредством огня. Русский творительный «огнём» кратко и точно передаёт инструментальное значение.'
theological_decisions:
- issue: Характер и продолжительность наказания
  choice: вечную муку огнём
  alternative: вечное наказание в огне
  rationale: Перевод сохраняет сильную лексику αἰώνιον βάσανον и инструментальное διὰ πυρός, не подменяя «муку» более отвлечённым «наказанием» и не вводя дальнейших систематико-богословских уточнений.
- issue: Значение θείας δίκης
  choice: по божественному правосудию
  alternative: по Божьему воздаянию
  rationale: Выбранный вариант удерживает возможную смысловую напряжённость между правосудием и карательным воздаянием, не сводя δίκη исключительно к каре.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной судебной лексикой. Необычность греческого μιεροφονία передана ясным словосочетанием и отмечена сноской; порядок слов подчёркивает противопоставление «А ты».
