  yaml_path: translation/deuterocanon/4_maccabees/009/032.yaml
  text: But you[a], by the threats of your ungodliness, are being tortured; and you will not escape, most defiled tyrant, the punishments of divine wrath.
translation:
  language: ru
  text: А ты мучишься под угрозами нечестия[a]; но тебе не избежать, о самый осквернённый тиран, кар божественного гнева.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение сжато. Возможны также переводы: «среди угроз нечестия» или, с учётом обращения к тирану, «под угрозами твоего нечестия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: βασανίζῃ
  choice: мучишься
  rationale: Форма глагола — настоящее время, 2-е лицо единственного числа; средне-пассивное «мучишься» сохраняет прямую обращённость и не превращает настоящее время в предсказание без необходимости.
- source_word: ἐν ταῖς τῆς ἀσεβείας ἀπειλαῖς
  choice: среди угроз, порождённых твоим нечестием
  rationale: ἀπειλαί прямо означает «угрозы», а родительный τῆς ἀσεβείας выражает их связь с нечестием. Добавленное «порождённых» естественно передаёт эту сжатую связь, не отождествляя угрозы с мучениями.
- source_word: ἀσεβείας
  choice: твоим нечестием
  rationale: «Нечестие» сохраняет религиозно-нравственный смысл ἀσέβεια; притяжательное «твоим» следует из прямого обращения к тирану и контекста.
- source_word: μιερώτατε
  choice: осквернённейший
  rationale: Передаёт превосходную степень и оттенок нравственно-ритуальной осквернённости, а не только общую отвратительность.
- source_word: τύραννε
  choice: тиран
  rationale: Прямой и естественный эквивалент, сохраняющий осуждающий политико-нравственный смысл обращения.
- source_word: τὰς ... δίκας
  choice: кар
  rationale: Во множественном числе δίκαι здесь обозначает справедливые наказания; «кары» естественно сочетаются с гневом и сохраняют судебный оттенок.
- source_word: θείας ὀργῆς
  choice: божественного гнева
  rationale: Сохраняет прилагательное θεῖος, не заменяя его более конкретным «Божьего», хотя указание на Бога очевидно.
theological_decisions:
- issue: Кто является источником θείας ὀργῆς
  choice: божественного гнева
  alternative: Божьего гнева
  rationale: В греческом тексте стоит прилагательное «божественный», а не существительное «Бог»; перевод сохраняет степень эксплицитности оригинала.
- issue: Временная перспектива βασανίζῃ
  choice: настоящее «мучишься»
  alternative: будущее «будешь мучиться»
  rationale: Греческая форма грамматически является настоящим временем. Будущее возможно как контекстуальное истолкование угрозы, но оно снимало бы напряжение между нынешним мучением тирана и грядущей карой, выраженной следующим οὐκ ἐκφεύξῃ.
translation_notes:
  register: Современный литературный русский с торжественной, обличительной интонацией. Сохранены прямое обращение, превосходная степень оскорбительного эпитета и неоднозначность сжатого греческого оборота; избегнуто превращение «угроз» в прямо не названные оригиналом «мучения».
