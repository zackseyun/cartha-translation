lexical_decisions:
- source_word: ὅθεν
  choice: Поэтому
  rationale: Передаёт следственный переход к очередному действию повествования; в данном контексте естественнее буквального пространственного значения.
- source_word: τὸν πρεσβύτατον αὐτῶν
  choice: старшего из братьев
  rationale: Сохраняет превосходную степень и партитивный смысл; «из братьев» естественно уточняет референта по контексту.
- source_word: κελευσθέντες
  choice: получив приказ
  rationale: Передаёт аористное пассивное причастие как предшествующее обстоятельство, не добавляя невыраженного субъекта приказа.
- source_word: οἱ μιστισταί
  choice: истязатели
  rationale: Контекст указывает на людей царя, осуществляющих пытку; слово не сужает их роль до палачей, совершающих казнь.
- source_word: παρήγαγον
  choice: вывели вперёд
  rationale: Передаёт выведение человека вперёд, к месту публичного истязания.
- source_word: διαρρήξαντες τὸν χιτῶνα
  choice: разорвав на нём хитон
  rationale: χίτων обозначает хитон, нижнюю одежду; оборот ясно показывает насильственное действие над одеждой брата.
- source_word: διέδησαν
  choice: привязали
  rationale: В сочетании с ремнями и расположением по обеим сторонам глагол естественно означает крепкое привязывание, а не просто связывание конечностей вместе.
- source_word: τὰς χεῖρας αὐτοῦ καὶ τοὺς βραχίονας
  choice: его кисти и руки
  rationale: Различает χεῖρας и βραχίονας без чрезмерно узкого определения того, какую именно часть руки обозначает βραχίων.
- source_word: ἱμᾶσιν
  choice: ремнями
  rationale: Передаёт полосы или ремни, вероятно кожаные, естественным современным русским словом.
- source_word: ἑκατέρωθεν
  choice: с обеих сторон
  rationale: Сохраняет двустороннее расположение креплений, не конкретизируя не названное в тексте устройство.
