  text: But he said, “Your device is not so strong, you limbs of a demon, as to lead my reason away. Cut off my limbs, and burn my flesh, and wrench my joints.”
translation:
  language: ru
  text: 'Но он сказал: «Ваш способ не настолько силён, о члены демона, чтобы увести мой разум[a]. Отсекайте мне конечности, жгите мою плоть и выворачивайте суставы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отвратить мой разум»; буквально — «увести мой разум».'
    reason: Греческое выражение сохраняет образ уведения и не уточняет, идёт ли речь о совращении, подавлении или лишении здравого рассуждения.
lexical_decisions:
- source_word: ὁ τρόπος
  choice: способ
  rationale: Передаёт широкий смысл греческого слова — образ действия, метод или средство — не сужая его до «уловки» либо конкретного орудия пытки.
- source_word: ὦ μεροὶ δαῖμον
  choice: о члены демона
  rationale: Сохраняет резкое метафорическое обращение и образ людей как частей демона; «члены» здесь естественнее книжного «части» и не превращает выражение в менее буквальное ругательство.
- source_word: τὸν λογισμόν
  choice: мой разум
  rationale: В контексте 4 Маккавейской книги обозначает рассуждающий, разумный дух; «разум» сохраняет ключевую терминологическую линию книги.
- source_word: τέμνετέ μου μέλη
  choice: отсекайте мне конечности
  rationale: Передаёт μέλη как телесные конечности и сохраняет повелительную форму продолженного вызова мучителям.
- source_word: στρεβλοῦτε τὰ ἄρθρα
  choice: выворачивайте суставы
  rationale: Естественно по-русски передаёт насильственное скручивание или вывихивание суставов.
theological_decisions:
- issue: Сила мучений против разума
  choice: чтобы увести мой разум
  alternative: чтобы сломить мой разум
  rationale: Более буквально сохраняет образ ἄγω («вести, уводить») и не разрешает заранее, означает ли выражение нравственное совращение, утрату рассудительности или подчинение воли.
- issue: Обращение к мучителям
  choice: члены демона
  alternative: демонские отродья
  rationale: Сохраняет исходную метафору участия или принадлежности, не усиливая её до идеи происхождения от демона.
translation_notes:
  register: Современный литературный русский язык с достоинством мученической речи. Повелительные формы переданы прямо и энергично; необычный образ «члены демона» сохранён, а не заменён привычным ругательством.
