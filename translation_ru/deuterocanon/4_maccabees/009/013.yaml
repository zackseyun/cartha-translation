- source_word: περὶ ὃν
  choice: на нём
  rationale: Относительное местоимение отсылает к ранее названному орудию пытки; в сочетании с κατατεινόμενος оборот имеет пространственный смысл. По-русски «растягивали на нём» естественно передаёт положение юноши на орудии.
- source_word: κατατεινόμενος
  choice: растягивали
  rationale: Страдательное причастие обозначает продолжающееся растягивание тела под натяжением; неопределённо-личная конструкция сохраняет пассивный смысл и звучит естественно по-русски.
- source_word: εὐγενὴς
  choice: благородного
  rationale: Слово допускает смысл как знатного происхождения, так и нравственного достоинства; «благородный» сохраняет эту широту.
- source_word: νεανίας
  choice: юношу
  rationale: «Юноша» точно и литературно передаёт возрастное обозначение, оставаясь понятным современному читателю.
- source_word: ἔξαρθρος ἐγίνετο
  choice: его суставы выворачивались
  rationale: ἔξαρθρος значит «вышедший из сустава, вывихнутый», а имперфект ἐγίνετο указывает на продолжающийся процесс. Русская формулировка ясно передаёт телесное действие пытки, не усиливая его до расчленения.
