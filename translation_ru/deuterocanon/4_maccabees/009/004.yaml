  text: For we consider your pity for our unlawful deliverance to be harsher than death itself[a].
translation:
  language: ru
  text: Ведь твою жалость, проявленную ради нашего противозаконного спасения, мы считаем тяжелее самой смерти[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милость ради сохранения нашей жизни вопреки Закону»; или: «сострадание, направленное на то, чтобы спасти нас противозаконным путём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαλεπώτερον
  choice: тяжелее
  rationale: Сравнительная степень передаёт не физическую жестокость как таковую, а то, что говорящие считают более тяжким и мучительным, чем смерть.
- source_word: αὐτοῦ τοῦ θανάτου
  choice: самой смерти
  rationale: Усилительное αὐτοῦ естественно передаётся словом «самой»; генитив выражает второй член сравнения.
- source_word: νομίζομεν
  choice: мы считаем
  rationale: Глагол обозначает обдуманное суждение или оценку; «считаем» ясно и естественно звучит по-русски.
- source_word: ἔλεον
  choice: жалость
  rationale: В данном контексте речь о снисхождении тирана, намеренного сохранить им жизнь на неприемлемых условиях. «Жалость» передаёт этот оттенок и не вносит лишних богословских ассоциаций слова «милость».
- source_word: παρανόμῳ
  choice: противозаконного
  rationale: Слово означает «противный закону». Здесь спасение предполагает нарушение Закона; выбранный вариант сохраняет правовой и нравственный смысл.
- source_word: σωτηρίᾳ
  choice: спасения
  rationale: Здесь имеется в виду сохранение жизни, а не доктринальное спасение. В сочетании «противозаконное спасение» и с пояснением в сноске русский термин сохраняет широту исходного слова.
- source_word: ἐπὶ τῇ παρανόμῳ σωτηρίᾳ ἡμῶν
  choice: проявленную ради нашего противозаконного спасения
  rationale: Оборот связывает жалость с намерением сохранить говорящим жизнь посредством нарушения Закона. Добавленное причастие делает эту связь естественной по-русски, не устраняя возможных смысловых оттенков предлога ἐπί.
theological_decisions:
- issue: Следует ли понимать σωτηρία как богословское спасение
  choice: Физическое спасение, то есть сохранение жизни
  alternative: Спасение в доктринальном смысле
  rationale: Контекст говорит о попытке избежать смерти ценой нарушения Закона. Поэтому перевод не должен приписывать слову специальный сотериологический смысл.
- issue: Как передать незаконный характер спасения
  choice: «противозаконное спасение» с сохранением прямой связи прилагательного и существительного
  alternative: «спасение ценой беззакония» или «спасти нас вопреки Закону»
  rationale: 'Выбранный вариант ближе к греческой конструкции и сохраняет некоторую неоднозначность: незаконным названо само предлагаемое спасение, хотя контекст подразумевает нарушение Закона как его условие.'
