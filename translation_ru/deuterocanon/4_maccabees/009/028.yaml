  register: Современный литературный русский язык с торжественным, но понятным повествовательным регистром. Жестокость сцены передана прямо, без эвфемизмов и без добавления деталей, которых нет в греческом тексте. Синтаксис разбит на два предложения ради ясности; заключительное двоеточие сохраняет функцию стиха как введения к последующей речи.
