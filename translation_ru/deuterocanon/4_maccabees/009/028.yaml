base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/028.yaml
  text: Dragging him by the tendons with their iron hands[a], the leopard-like beasts stripped away all his flesh, even to his beard, and the skin of his head; but as he endured this grievous pain steadfastly, he said[d][c][b],
translation:
  language: ru
  text: 'Потащив его за сухожилия своими железными руками[a][b], звери, подобные леопардам[c], содрали с него всю плоть, до самой бороды, и кожу с головы[d]. Но он стойко переносил эту мучительную боль и говорил:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начав с сухожилий». Греческое выражение допускает понимание сухожилий как того, за что его тащили, либо как исходной точки сдирания.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «железными руками». Возможно, имеются в виду металлические орудия; однако греческий текст сохраняет образ рук.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Возможно также: «леопардовые звери» или просто «леопарды». В греческом тексте слово «леопардовые» служит определением к слову «звери».'
    reason: lexical_alternative
  - marker: d
    text: 'То есть кожу, покрывавшую голову; по смыслу возможно: «скальп».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν τενόντων … ἐπισπασάμενοι
  choice: ухватив его за сухожилия
  rationale: τένων обозначает сухожилие, а сочетание ἀπό с глаголом натягивания или увлечения указывает на то, за что его тянули, либо откуда начиналось сдирание. Основной текст передаёт первый, синтаксически естественный смысл; альтернативная трактовка отмечена в сноске.
- source_word: ταῖς σιδηραῖς χερσὶν
  choice: своими железными руками
  rationale: Сохранён буквальный и яркий образ «железных рук». Местоимение «своими» естественно связывает оборот с действующими лицами, не определяя, подразумеваются ли орудия, звериные лапы или метафорическая жестокость.
- source_word: οἱ παρδάλιοι θῆρες
  choice: звери, подобные леопардам
  rationale: παρδάλιος является определением к θῆρες и означает «леопардовый, подобный леопарду»; перевод сохраняет сравнение и не превращает зверей прямо в леопардов.
- source_word: ἀπέσυραν
  choice: содрали
  rationale: В контексте удаления плоти и кожи глагол «содрали» естественно передаёт ἀποσύρω — «стянуть, сорвать, содрать» — и сохраняет жестокую конкретность сцены.
- source_word: μέχρι γε τῶν γενείων
  choice: вплоть до подбородка
  rationale: γενεῖον обозначает подбородок или область бороды, а μέχρι с усилительным γε подчёркивает предел; «вплоть до» передаёт это усиление.
- source_word: τὴν σάρκα πᾶσαν
  choice: всю плоть
  rationale: σάρξ употреблено здесь в буквальном телесном смысле; «плоть» сохраняет и конкретность, и достоинство библейского регистра.
- source_word: τὴν τῆς κεφαλῆς δορὰν
  choice: кожу с головы
  rationale: δορά буквально означает кожу или шкуру. Такой перевод ближе к греческой формулировке, чем более узкое «скальп».
- source_word: βαρέως τὴν ἀλγηδόνα καρτερῶν
  choice: стойко переносил эту мучительную боль
  rationale: καρτερέω выражает стойкое терпение; βαρέως характеризует тяжесть переживаемой боли. Формулировка сохраняет и тяжесть мучения, и стойкость мученика, не сводя βαρέως к оценочному «храбро».
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект вводит последующую речь. Двоеточие естественно обозначает её продолжение в следующем стихе.
