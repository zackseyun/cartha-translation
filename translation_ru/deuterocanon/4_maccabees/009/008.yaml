- source_word: ὑπομονῆς
  choice: стойкости
  rationale: «Стойкость» выражает твёрдое терпение перед лицом страданий и звучит естественно в современном литературном русском.
- source_word: τὰ τῆς ἀρετῆς ἆθλα
  choice: награды за добродетель
  rationale: ἆθλα — награды победителю в состязании, а ἀρετή обозначает нравственную добродетель; основной текст сохраняет понятность, а примечание раскрывает образ состязания.
- source_word: οἴσομεν
  choice: завоюем
  rationale: В сочетании с ἆθλα будущее от φέρω идиоматически означает унести или получить награду как победитель; «завоюем» сохраняет активный состязательный оттенок.
