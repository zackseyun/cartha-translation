  source_fidelity: 'Текст точно передаёт три греческие имперфектные картины: колесо осквернялось/загрязнялось кровью со всех сторон, груда углей гасла от капель ихора, а плоть текла вокруг осей устройства. Описательное «жидкость, сочившаяся из ран» адекватно передаёт ἰχώρ как жидкость, истекающую из повреждённой плоти; это не меняет смысла.'
  naturalness: Русский текст естественен для современного литературного регистра. «Осквернялось кровью» намеренно более сильно, чем простое «покрывалось кровью», и оправдано семантикой μολύνω. Синтаксическая трёхчастность читается ясно, а несовершенные формы удачно сохраняют процессуальность оригинала.
  terminology: «Груда углей», «оси», «плоть» и «орудие пытки» точны в данном контексте. Уточнение «пытки» у ὄργανον контекстуально обосновано и не является доктринальной интерпретацией. Примечания корректно поясняют варианты и не создают ложной текстовой определённости.
