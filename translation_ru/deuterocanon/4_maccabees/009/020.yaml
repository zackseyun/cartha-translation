  text: And the wheel was defiled all around with blood[a], and the heap of coals was being quenched by the drops of bodily fluids[c][b], and the flesh was flowing around the axles of the machine.
translation:
  language: ru
  text: Колесо со всех сторон осквернялось кровью[a], груда углей гасла от капель жидкости, сочившейся из ран[b], а плоть растекалась вокруг осей орудия пытки[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покрывалось пятнами крови». Греческий глагол может означать как пачкание, так и осквернение или загрязнение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от капель ихора»; здесь речь о жидкости, вытекающей из ран.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «орудия» или «устройства»; имеется в виду орудие пытки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμολύνετο
  choice: осквернялось
  rationale: Глагол может означать как пачкание, так и осквернение или загрязнение. В основном тексте сохранён его более сильный смысл; длительный вид передаёт имперфект.
- source_word: πάντοθεν αἵματι ὁ τροχός
  choice: колесо со всех сторон осквернялось кровью
  rationale: Передаёт пространственное значение πάντοθεν и дательный αἵματι естественной русской конструкцией.
- source_word: ὁ σωρὸς τῆς ἀνθρακιᾶς
  choice: груда углей
  rationale: Краткое и конкретное обозначение скопления углей; не добавляется отсутствующее в тексте уточнение о материале или степени горения.
- source_word: τοῖς τῶν ἰχώρων ... σταλαγμοῖς
  choice: от капель жидкости, сочившейся из ран
  rationale: ἰχώρ здесь обозначает выделения из ран. Описательный перевод понятен современному читателю и избегает мифологических ассоциаций русского слова «ихор».
- source_word: ἐσβέννυτο
  choice: гасла
  rationale: Имперфект передаёт продолжающийся процесс; русское «гасла» естественно сочетается с углями.
- source_word: περὶ τοὺς ἄξονας
  choice: вокруг осей
  rationale: Прямо сохраняет пространственное описание и множественное число ἄξονας.
- source_word: τοῦ ὀργάνου
  choice: орудия пытки
  rationale: ὄργανον означает орудие или устройство; контекстуальное уточнение «пытки» ясно называет назначение предмета, не навязывая современного образа машины.
- source_word: περιέρεον αἱ σάρκες
  choice: плоть растекалась
  rationale: Собирательное «плоть» естественно передаёт греческое множественное число, а несовершенный вид сохраняет длительность περιέρεον.
