- from: «Подражайте мне, братья, — говорил он на дыбе[a]. — Я не оставил борьбы; не покидайте же строя и вы, оставляя её, и не отрекайтесь из-за меня от братства мужественных. Ведите священную и благородную борьбу за преданность Богу[b]».
  to: «Подражайте мне, братья, — говорил он на дыбе. — Раз я не оставил борьбы, не дезертируйте и вы; и не отрекайтесь из-за меня от братства мужества. Ведите священную и благородную борьбу за преданность Богу[b]».[a]
  rationale: Исправлено ошибочное грамматическое соотнесение причастного оборота и устранена неясная тавтология. «Не дезертируйте» передаёт военный оттенок λειποτακτέω; «братство мужества» точнее сохраняет абстрактный характер εὐψυχία. Сноска a перенесена к завершению реплики, поскольку «на дыбе» относится к обстоятельствам произнесения всей речи; оба маркера сохранены и согласованы с текстом.
