  yaml_path: translation/deuterocanon/4_maccabees/009/023.yaml
  text: Imitate me[a], brothers, he said, on the rack; do not desert by abandoning the struggle when I have not left it, nor through me renounce the brotherhood of courage. Wage the holy and noble campaign for godliness[c][b],
translation:
  language: ru
  text: «Подражайте мне, братья, — говорил он на дыбе. — Раз я не оставил борьбы, не дезертируйте и вы; и не отрекайтесь из-за меня от братства мужества. Ведите священную и благородную борьбу за преданность Богу[b]».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под пыткой». Греческое выражение трудно, но, вероятно, вызывает конкретный образ дыбы — орудия, на котором тело растягивали при истязании.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «за благочестие». Здесь речь о верной, деятельной преданности Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στρεβλὰς
  choice: на дыбе
  rationale: Форма текста трудна, однако в данном контексте указывает на истязание, конкретно вызывая образ орудия растяжения; «на дыбе» сохраняет этот образ.
- source_word: Μιμήσασθέ με
  choice: Подражайте мне
  rationale: Прямой призыв последовать примеру говорящего, выраженный аористным императивом.
- source_word: ἀδελφοί
  choice: братья
  rationale: В повествовании обращение направлено к родным братьям, поэтому мужской род сохраняется.
- source_word: μὴ λειπὼν τὸν ἀγῶνα λειποτακτήσητε
  choice: Я не оставил борьбы; не покидайте же строя и вы, оставляя её
  rationale: Передаёт игру однокоренных λειπ- и военный оттенок λειποτακτέω, не сглаживая связь между стойкостью говорящего и призывом к братьям.
- source_word: ἐξομόσησθέ
  choice: не отрекайтесь
  rationale: Глагол означает отказ или отречение, возможно с оттенком клятвенного отрицания; русское «отрекаться» сохраняет вес выражения без излишней конкретизации.
- source_word: τὴν τῆς εὐψυχίας ἀδελφότητα
  choice: от братства мужественных
  rationale: Родительный τῆς εὐψυχίας допускает абстрактное «братство мужества», но по-русски естественнее передать объединение братьев, проявляющих мужество.
- source_word: ἱερὰν καὶ εὐγενῆ στρατείαν στρατεύσασθε
  choice: Ведите священную и благородную борьбу
  rationale: Сохраняет военный образ служения и кампании, хотя греческое этимологическое повторение существительного и глагола по-русски воспроизводится лишь частично.
- source_word: περὶ τῆς εὐσεβείας
  choice: за преданность Богу
  rationale: В 4 Маккавейской εὐσέβεια обозначает деятельную верность и благоговейную преданность Богу; этот вариант понятнее современному читателю, чем потенциально узкое «благочестие».
theological_decisions:
- issue: Смысл εὐσέβεια в контексте мученичества
  choice: преданность Богу
  alternative: благочестие
  rationale: Выражение охватывает не только внутреннюю набожность, но и стойкую верность Богу под преследованием; перевод не привязывает термин к частной конфессиональной трактовке.
- issue: Адресаты ἀδελφοί
  choice: братья
  alternative: братья и сёстры
  rationale: Здесь речь идёт о буквальных братьях героя, а не о смешанной религиозной общине.
- issue: Связь δι’ ἐμοῦ в выражении μηδὲ ἐξομόσησθέ μου
  choice: не отрекайтесь из-за меня
  alternative: не отрекайтесь вместе со мной
  rationale: Греческая конструкция допускает трудность в определении отношения говорящего к отречению. «Из-за меня» следует наиболее прямому пониманию, не приписывая говорящему собственного отречения.
translation_notes:
  register: Современный литературный русский с достоинством мученической речи. Военная образность сохранена в словах «покидайте строй» и «ведите… борьбу», но синтаксис слегка прояснён ради естественного русского звучания. Все сноски отмечены в основном тексте.
