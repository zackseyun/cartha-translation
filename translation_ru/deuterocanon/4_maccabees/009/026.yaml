base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/026.yaml
  text: And when all had marveled at his steadfast courage[a], the guards led in the second after the first in age, and after fitting iron claws onto his hands[c][b], they bound him to the instruments and the catapult.
translation:
  language: ru
  text: Когда все изумились его стойкости духа, стражники вывели следующего за первым по возрасту брата[a]. Приладив железные «руки» с острыми когтями[b], они привязали его к орудиям пытки и катапульте[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть брата, который по возрасту шёл сразу после первого.
    reason: Уточнение сжатого греческого обозначения порядка братьев по возрасту.
  - marker: b
    text: 'Буквально: «железные руки с острыми когтями» — вероятно, металлические пыточные приспособления с острыми крючьями. Греческий текст прямо не уточняет, к кому или к чему их приладили.'
    reason: Культурно-лексическое пояснение необычного орудия с сохранением синтаксической неопределённости оригинала.
  - marker: c
    text: Греческое слово обычно означает метательную машину — «катапульту», но здесь, возможно, имеется в виду дыба или иное механическое орудие пытки.
    reason: Пояснение необычного контекстуального употребления термина.
lexical_decisions:
- source_word: θαυμασάντων
  choice: когда все изумились
  rationale: Генитив абсолютный с аористным причастием обозначает предшествующую реакцию присутствующих; «изумились» естественно передаёт сильное удивление.
- source_word: καρτεροψυχίαν
  choice: стойкости духа
  rationale: Сложное слово выражает внутреннюю твёрдость и способность мужественно переносить страдания; русский оборот сохраняет оба оттенка.
- source_word: δορυφόροι
  choice: стражники
  rationale: Буквально «копьеносцы», но в данном повествовании это охрана и исполнители приказа; функциональный перевод звучит естественно.
- source_word: τὸν καθʼ ἡλικίαν τοῦ προτέρου δεύτερον
  choice: следующего за первым по возрасту брата
  rationale: Оборот указывает на место мученика среди братьев по возрасту. Слово «брата» восполняется из непосредственного контекста книги для ясности.
- source_word: σιδηρᾶς ... χεῖρας
  choice: железные «руки»
  rationale: Буквально «железные руки»; кавычки показывают, что речь идёт не о телесных руках, а, вероятно, о металлических приспособлениях.
- source_word: ὀξέσι τοῖς ὄνυξιν
  choice: с острыми когтями
  rationale: ὄνυξ может означать ноготь, коготь или заострённый выступ; в контексте пыточного устройства «когти» передают образ яснее всего.
- source_word: ἐναρμοσάμενοι
  choice: приладив
  rationale: Глагол означает подогнать, присоединить или установить. В греческом не названо прямо, кому или к чему приспособления прикрепили, поэтому перевод не добавляет объекта.
- source_word: ὀργάνοις
  choice: орудиям пытки
  rationale: ὄργανα — общее обозначение инструментов или устройств; контекст позволяет явно назвать их пыточное назначение.
- source_word: καταπέλτῃ
  choice: катапульте
  rationale: Это прямое значение греческого слова. Необычность предмета в сцене пытки сохраняется в основном тексте и поясняется в сноске.
- source_word: προσεδήσαν
  choice: привязали его
  rationale: Глагол обозначает привязывание или прикрепление к чему-либо; выбран прямой и естественный русский эквивалент.
