translation:
  language: ru
  text: Ибо я облегчаю боль сладостными удовольствиями, обретаемыми благодаря добродетели.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδέσι … ἡδοναῖς
  choice: радостями
  rationale: Согласованные формы передают приятные переживания как средство облегчения боли. «Радостями» естественно по-русски и сохраняет парадокс радости среди страдания.
- source_word: διὰ τὴν ἀρετήν
  choice: которые приходят через добродетель
  rationale: διά с винительным может указывать на причину или посредство. Такая формулировка сохраняет связь радостей с добродетелью, не сводя её однозначно только к причине или цели.
- source_word: τὸν πόνον
  choice: боль
  rationale: В контексте мучений πόνος прежде всего обозначает испытываемую телесную боль, хотя слово также может означать тяготу или страдание.
- source_word: ἐπικουφίζομαι
  choice: облегчаю
  rationale: Глагол означает делать легче, смягчать или облегчать; русский выбор сохраняет образ уменьшения тяжести боли.
theological_decisions:
- issue: Нравственно-философский смысл ἀρετή
  choice: добродетель
  alternative: нравственное совершенство
  rationale: В 4 Маккавейской ἀρετή имеет выраженный этико-философский смысл, связанный с благочестием и стойкостью; «добродетель» сохраняет этот понятийный фон без конфессионального уточнения.
translation_notes:
  register: 'Современный литературный русский язык; краткая, достойная речь мученика. Сохранён парадокс: добродетель приносит радость, облегчающую физическую боль.'
