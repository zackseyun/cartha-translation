  terminology: «Добродетель» — точный и устойчивый эквивалент ἀρετή в нравственно-философском контексте 4 Маккавейской. «Сладостные удовольствия» передаёт намеренно усиленное сочетание ἡδέσι ... ἡδοναῖς и сохраняет парадокс удовольствия среди боли.
