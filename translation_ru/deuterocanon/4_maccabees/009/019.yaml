base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/019.yaml
  text: They are unconquerable on behalf of virtue[a]. While he was still saying these things, they spread fire beneath him, and, by intensifying the wheel[c][b], they tightened it further.
translation:
  language: ru
  text: «Ради добродетели они непобедимы»[a]. Пока он ещё говорил это, они разложили под ним огонь и, усиливая воздействие колеса[b], ещё сильнее растягивали его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «за добродетель». Греческое выражение может обозначать действие или страдание ради добродетели.'
    reason: lexical_alternative
  - marker: b
    text: То есть колесо, служившее орудием пытки.
    reason: cultural_note
  - marker: c
    text: Греческое выражение сжато и трудно для точной передачи; оно означает дальнейшее усиление натяжения или растягивания на колесе.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ ἀρετῆς
  choice: ради добродетели
  rationale: Ὑπέρ с родительным падежом указывает на то, ради чего действуют или страдают. «Ради добродетели» естественно по-русски передаёт эту направленность и сохраняет философски значимое ἀρετή как «добродетель».
- source_word: ἀνίκητοι
  choice: непобедимы
  rationale: Прилагательное означает «неодолимые, не поддающиеся победе»; краткая форма «непобедимы» точно и естественно передаёт утверждение.
- source_word: ταῦτα λέγων ἔτι
  choice: пока он ещё говорил это
  rationale: Причастная конструкция с ἔτι обозначает продолжающуюся речь, на фоне которой совершается следующее действие; русская придаточная конструкция ясно сохраняет эту одновременность.
- source_word: πῦρ ἐπέστρωσαν
  choice: разложили под ним огонь
  rationale: Глагол обозначает расстилание или раскладывание; указание «под ним» восстановлено из сцены пытки и делает пространственный смысл понятным, не добавляя нового действия.
- source_word: διερεθίζοντες τὸν τροχόν
  choice: усиливая действие колеса
  rationale: Διερεθίζω выражает возбуждение, усиление или приведение в более напряжённое действие, но не означает буквально «вращать». Формулировка сохраняет интенсивный смысл и не вводит неподтверждённую механику движения.
- source_word: προσεπικατέτεινον
  choice: натягивали его ещё сильнее
  rationale: Сложный интенсивный глагол указывает на дальнейшее натягивание или увеличение напряжения. Местоимение «его» по контексту относится к мученику, однако сама греческая конструкция сжата и допускает описание усиления натяжения устройства в целом.
theological_decisions:
- issue: Передача ἀρετή в философски окрашенном рассказе о мученичестве
  choice: добродетель
  alternative: нравственное совершенство
  rationale: «Добродетель» сохраняет устойчивое нравственно-философское значение ἀρετή в 4 Маккавейской и не подменяет его более узким конфессиональным термином.
- issue: Степень явного обозначения τροχός как орудия пытки
  choice: колесо
  alternative: пыточное колесо
  rationale: В греческом тексте стоит просто «колесо». Основной текст сохраняет эту форму, а назначение предмета поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным повествовательным тоном. Философский термин «добродетель» сохранён; технические подробности пытки переданы без натуралистического расширения и без неподтверждённого значения «вращать».
