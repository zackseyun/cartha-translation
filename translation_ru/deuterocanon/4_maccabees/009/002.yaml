  yaml_path: translation/deuterocanon/4_maccabees/009/002.yaml
  text: For we would rightly bring shame on our ancestors if we did not make use of obedience to the law as our counselor and judgment[a].
translation:
  language: ru
  text: Ведь мы по праву опозорили бы наших предков, если бы не воспользовались послушанием Закону, находя в нём совет и разумение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь нам по праву было бы стыдно перед нашими предками, если бы мы не обращались к послушанию Закону за советом и рассудительностью».'
    reason: Греческое αἰσχυνόμεθα может означать как причинение позора, так и переживание стыда; конструкция συμβούλῳ καὶ γνώσει допускает менее олицетворённую передачу.
lexical_decisions:
- source_word: αἰσχυνόμεθα
  choice: мы … опозорили бы
  rationale: Форма допускает значение причинения позора; винительный τοὺς προγόνους естественно понимается как обозначение тех, кого постыдило бы такое поведение. Условное «бы» передаёт смысл нереального или предполагаемого случая.
- source_word: τοὺς προγόνους
  choice: наших предков
  rationale: Современное и естественное обозначение прежних поколений, сохраняющее семейно-исторический смысл.
- source_word: εἰκότως
  choice: по праву
  rationale: Передаёт мысль о справедливом, заслуженном нравственном последствии.
- source_word: τῇ τοῦ νόμου εὐπειθείᾳ
  choice: послушанием Закону
  rationale: εὐπείθεια означает готовность повиноваться; формулировка сохраняет этический акцент на верности Закону.
- source_word: συμβούλῳ
  choice: как своим советником
  rationale: Сохраняет предикативную роль при χρησαίμεθα и олицетворение послушания как того, что направляет человека.
- source_word: γνώσει
  choice: разумением
  rationale: В данном нравственно-практическом контексте γνῶσις означает не просто наличие сведений, а способность понимать и верно оценивать; «разумение» сохраняет широту слова без чрезмерного уточнения.
- source_word: χρησαίμεθα
  choice: пользовались бы
  rationale: Естественно передаёт значение «прибегать к чему-либо, пользоваться чем-либо» и согласуется с условной конструкцией.
theological_decisions:
- issue: Отношение к предкам в αἰσχυνόμεθα … τοὺς προγόνους
  choice: Отказ от послушания Закону опозорил бы предков.
  alternative: Говорящие сами испытали бы стыд перед предками.
  rationale: Винительный падеж τοὺς προγόνους лучше поддерживает понимание предков как затронутых позором, однако средняя форма αἰσχυνόμεθα допускает и значение испытываемого стыда; альтернативу поэтому следует сохранить в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим речи мучеников. «Закон» написан с прописной буквы как обозначение иудейской Торы. Несколько необычное сочетание «советником и разумением» удерживает напряжение и образность греческой конструкции, не сводя γνῶσις однозначно к «суждению» или «знанию».
