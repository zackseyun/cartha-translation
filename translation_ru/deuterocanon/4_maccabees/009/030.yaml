  to: Неужели ты не думаешь, о жесточайший из всех тиранов, что теперь мучаешься сильнее, чем я, видя, как надменный замысел твоей тирании[a] побеждён нашей стойкостью ради нашего благочестия[b]?
  rationale: Исправление восстанавливает явно выраженное в греческом «нашего» при «благочестии» и уточняет сноску, не приписывая греческой конструкции не имеющейся у неё грамматической двусмысленности. «Сильнее» делает сравнение муки более естественным в современном русском, сохраняя иронический переворот βασανίζεσθαι.
