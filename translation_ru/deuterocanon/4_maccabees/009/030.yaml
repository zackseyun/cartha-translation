base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/009/030.yaml
  text: Do you not think[a], O most savage tyrant of all, that you are now being tortured more than I am[b], seeing the proud reasoning of your tyranny being conquered by our endurance for the sake of godliness?
translation:
  language: ru
  text: Неужели ты не думаешь, о жесточайший из всех тиранов, что теперь мучаешься сильнее, чем я, видя, как надменный замысел твоей тирании[a] побеждён нашей стойкостью ради нашего благочестия[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надменный расчёт (образ мыслей) твоей тирании». Греческое λογισμός может означать рассуждение, расчёт, замысел или направляющий образ мыслей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «благодаря нашей стойкости, вызванной нашим благочестием». Буквально: «ради (или по причине) нашего благочестия»; выражение указывает на благочестие как на основание и побуждение стойкости.'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: Οὐ δοκεῖς
  choice: Неужели ты не думаешь
  rationale: Риторический вопрос передан естественной современной конструкцией, сохраняющей прямой и вызывающий тон.
- source_word: ὦ πάντων ὠμότατε τύραννε
  choice: о жесточайший из всех тиранов
  rationale: Превосходная степень ὠμότατε выражает крайнюю жестокость; πάντων передано сравнением со всеми тиранами.
- source_word: πλεῖον ἐμοῦ σε νῦν βασανίζεσθαι
  choice: что теперь мучаешься больше, чем я
  rationale: 'Глагол βασανίζεσθαι сохраняет язык мучений и подчёркивает иронический переворот: мучитель сам испытывает более сильную муку.'
- source_word: ὁρῶν
  choice: видя
  rationale: Причастная форма непосредственно отражает греческую конструкцию, оставаясь естественной по-русски.
- source_word: τὸν τῆς τυραννίδος ὑπερήφανον λογισμὸν
  choice: надменный замысел твоей тирании
  rationale: «Замысел» естественно обозначает здесь направляющий расчёт или образ мысли тирана; сноска сохраняет более буквальные смысловые возможности λογισμός.
- source_word: σου νικώμενον
  choice: побеждён
  rationale: Страдательное значение и образ противоборства сохранены; местоимение σου естественно передано в сочетании «твоей тирании».
- source_word: ὑπὸ τῆς ... ὑπομονῆς
  choice: нашей стойкостью
  rationale: ὑπομονή обозначает стойкое перенесение страданий; «стойкость» звучит естественно и уместно в контексте мученичества.
- source_word: διὰ τὴν εὐσέβειαν ἡμῶν
  choice: ради благочестия
  rationale: εὐσέβεια означает благоговейную верность Богу; конструкция допускает оттенок причины или побуждения, что отмечено в сноске.
theological_decisions:
- issue: Передача εὐσέβεια в контексте мученичества
  choice: благочестие
  alternative: почитание Бога; верность Богу
  rationale: «Благочестие» сохраняет религиозную весомость слова и охватывает преданность Богу, выраженную в стойкости, не сводя понятие только к обряду.
- issue: Передача λογισμός в книге, где разум и рассуждение являются важной темой
  choice: замысел
  alternative: расчёт; образ мыслей; рассуждение
  rationale: В данном контексте речь идёт о надменном направляющем замысле тирании. Сноска сохраняет связь слова с рассуждением и разумным расчётом, не навязывая единственного оттенка.
- issue: Связь ἡμῶν и смысл διὰ τὴν εὐσέβειαν
  choice: нашей стойкостью ради благочестия
  alternative: стойкостью, вызванной нашим благочестием
  rationale: Основной текст следует естественному пониманию стойкости, мотивированной благочестием, но сноска сохраняет возможную связь местоимения с «благочестием».
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным обращением. Сохранены резкость риторического вопроса, мученическая ирония и образ победы стойкости над тираническим замыслом.
