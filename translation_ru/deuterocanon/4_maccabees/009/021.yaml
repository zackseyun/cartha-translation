lexical_decisions:
- source_word: περιτετηγμένον
  choice: опалён со всех сторон
  rationale: Перфектное причастие передаёт уже наступившее состояние вследствие сильного жара, охватившего тело со всех сторон. «Опалён» естественно звучит по-русски и сохраняет образ воздействия огня, тогда как буквальное «расплавлен» применительно к костям намеренно вынесено в примечание как возможная передача яркой греческой метафоры.
- source_word: πῆγμα
  choice: остов
  rationale: Существительное обозначает нечто скреплённое, составленное или образующее структуру. В сочетании «костей» слово «остов» конкретно и естественно передаёт костную основу тела.
- source_word: μεγαλόφρων
  choice: благородный
  rationale: Слово характеризует возвышенный дух, мужество и достоинство. «Благородный» в данном контексте передаёт нравственную, а не сословную характеристику и остаётся понятным современному читателю.
- source_word: Ἀβραμιαῖος
  choice: подобный Аврааму
  rationale: Прилагательное указывает на сходство с Авраамом по духу и верности. Развёрнутая русская конструкция яснее, чем неоднозначное «авраамов» или технически звучащее «авраамический».
- source_word: νεανίας
  choice: юноша
  rationale: Обычное обозначение молодого мужчины; «юноша» соответствует достоинству повествовательного регистра.
- source_word: οὐκ ἐστέναξεν
  choice: не застонал
  rationale: Глагол обозначает стон или тяжёлый вздох от страдания; в сцене пытки «не застонал» наиболее точно передаёт отсутствие слышимого выражения боли.
theological_decisions:
- issue: Смысл прилагательного Ἀβραμιαῖος
  choice: подобный Аврааму
  alternative: происходящий от Авраама / авраамов
  rationale: В контексте восхваляется стойкость мученика через уподобление Аврааму. Перевод выражает характеристику его веры и духа, не сводя её к этническому происхождению и не вводя позднейшей технической терминологии.
