lexical_decisions:
- source_word: Ὡς ἡδὺς
  choice: Как сладок
  rationale: 'Сохраняет восклицательную силу Ὡς и яркий парадокс прилагательного ἡδύς: мученик называет смерть «сладкой».'
- source_word: πᾶς τρόπος θανάτου
  choice: всякий вид смерти
  rationale: 'Естественно по-русски передаёт всеохватное значение выражения: любой способ или род смерти.'
- source_word: διὰ τὴν πάτριον ἡμῶν εὐσέβειαν
  choice: за благочестие, завещанное нам предками
  rationale: Предлог «за» выражает причину мученической смерти, а развёрнутая конструкция передаёт как религиозный смысл εὐσέβεια, так и унаследованный от предков характер πάτριον.
- source_word: ἔφη τε πρὸς τὸν τύραννον
  choice: — сказал он тирану
  rationale: ἔφη естественно передаётся глаголом речи «сказал», πρὸς с винительным — адресатом, а «тиран» сохраняет отрицательную оценку τύραννος.
theological_decisions:
- issue: Передача εὐσέβεια в контексте мученичества
  choice: благочестие
  alternative: набожность; верность вере
  rationale: «Благочестие» обозначает почтительное религиозное служение и верность Богу, не сводя понятие ни к внешней обрядности, ни только к культурной традиции.
- issue: Причинное значение διὰ и связь смерти с благочестием
  choice: за благочестие
  alternative: из-за благочестия; ради благочестия
  rationale: «За» естественно для русского описания принятия смерти за веру и сохраняет возможный оттенок основания или мотива, не вынуждая выбирать исключительно между причиной и целью.
translation_notes:
  register: Современный литературный русский с dignified мученическим звучанием. Инверсия «Как сладок…» и слово «сладок» намеренно сохраняют риторический парадокс оригинала; «завещанное нам предками» раскрывает πάτριον без архаичного оборота «отеческое благочестие».
