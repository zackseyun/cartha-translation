translation:
  language: ru
  text: она больше возлюбила благочестие, которое спасает для вечной жизни по Богу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в согласии с Богом»; выражение «по Богу» может указывать на соответствие Божьей воле или Божьему мерилу.'
    reason: Сохранена смысловая неоднозначность κατὰ θεόν.
lexical_decisions:
- source_word: εὐσέβειαν
  choice: благочестие
  rationale: «Благочестие» передаёт почтительную преданность Богу, выраженную в верности и поступках, и сохраняет ключевое для книги нравственно-религиозное понятие.
- source_word: μᾶλλον
  choice: больше
  rationale: Сравнительное наречие обозначает предпочтение перед подразумеваемой из контекста естественной привязанностью, не называя объект сравнения прямо.
- source_word: ἠγάπησεν
  choice: возлюбила
  rationale: Глагол означает «полюбила/возлюбила»; сравнительный смысл уже выражен словом μᾶλλον, поэтому перевод «предпочла» был бы менее точным.
- source_word: τὴν σώζουσαν
  choice: которое спасает
  rationale: Причастие настоящего времени относится к «благочестию» и характеризует его как спасающее; придаточное определительное звучит по-русски естественно и прямо.
- source_word: εἰς αἰώνιον ζωὴν
  choice: для вечной жизни
  rationale: Предлог εἰς указывает на цель или итог спасения. Формулировка «для вечной жизни» сохраняет эту направленность без неестественного буквального оборота.
- source_word: κατὰ θεόν
  choice: по Богу
  rationale: 'Краткий оборот сохраняет сжатость и неоднозначность греческого выражения: речь может идти о согласии с Божьей волей, порядком или мерилом.'
theological_decisions:
- issue: Значение κατὰ θεόν и его связь со спасением и благочестием
  choice: Сохранить сжатое выражение «по Богу», не уточняя его доктринально.
  alternative: «в согласии с Божьей волей» или «по Божьему мерилу»
  rationale: Греческий оборот допускает несколько близких оттенков и не является здесь однозначной догматической формулой; более развёрнутый перевод преждевременно устранил бы эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Возлюбила» и «по Богу» поддерживают достоинство стиля, а конструкция «которое спасает» остаётся ясной для современного читателя.
