  source_fidelity: 'Смысловой ряд добродетелей передан точно: δικαίοι, σώφρονες, ἀνδρεῖοι, μεγαλόψυχοι и φιλάδελφοι адекватно отражены как «праведны», «владели собой», «мужественны», «великодушны» и «любили своих братьев». «Преданы матери» уместно передаёт φιλόμητρος в контексте сыновней любви и верности. Однако в исходной пунктуационно-синтаксической форме «даже до смерти соблюдая предписания Закона» наречный оборот может быть по-русски присоединён к «повиновались ей», тогда как μέχρι θανάτου непосредственно относится к соблюдению τὰ νόμιμα. Безопасная перестройка устраняет это нежелательное смещение.'
