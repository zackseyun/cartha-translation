base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/010.yaml
  text: For they were righteous and self-controlled[a], brave and noble-minded and loving their brothers, and so devoted to their mother that, even while keeping the law's requirements to the point of death[b], they obeyed her.
translation:
  language: ru
  text: Ведь они были праведны и владели собой, были мужественны, великодушны, любили своих братьев и были так преданы матери, что повиновались ей, соблюдая предписания Закона вплоть до смерти[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «установления» или «обычаи, предписанные Законом».'
    reason: Лексическое значение τὰ νόμιμα допускает передачу как установлений, законных предписаний или предписанных обычаев.
lexical_decisions:
- source_word: δίκαιοι
  choice: праведны
  rationale: Передаёт нравственно-религиозную правоту в контексте верности Закону, не сужая смысл до юридической справедливости.
- source_word: σώφρονες
  choice: владели собой
  rationale: Естественно выражает здравую сдержанность и способность управлять своими желаниями; не сводит слово только к целомудрию.
- source_word: ἀνδρεῖοι
  choice: мужественны
  rationale: Обозначает стойкую храбрость; это обычное литературное русское слово для данной добродетели.
- source_word: μεγαλόψυχοι
  choice: великодушны
  rationale: Передаёт буквальную идею величия души и благородства характера естественным современным словом.
- source_word: φιλάδελφοι
  choice: любили своих братьев
  rationale: В ближайшем контексте речь идёт о семи родных братьях, поэтому конкретное семейное значение сохранено.
- source_word: φιλόμητρος
  choice: были так преданы матери
  rationale: Несмотря на единственное число греческого прилагательного, по смыслу оно продолжает характеристику братьев; «преданы» передаёт и любовь, и сыновнюю верность.
- source_word: μέχρι θανάτου
  choice: даже до смерти
  rationale: Выражает крайнюю степень их верности установлениям перед лицом смерти.
- source_word: τὰ νόμιμα
  choice: предписания Закона
  rationale: В маккавейском контексте имеются в виду установления отеческого Закона; формулировка ясна, но не ограничивает их только обрядами.
- source_word: φυλάσσοντας
  choice: соблюдая
  rationale: В сочетании с предписаниями означает исполнять и хранить их верностью на практике.
- source_word: πείθεσθαι αὐτῇ
  choice: повиновались ей
  rationale: πείθομαι с дательным лицом здесь естественно означает послушание матери и следование её наставлению.
theological_decisions:
- issue: Нравственно-религиозный оттенок δίκαιοι
  choice: праведны
  alternative: справедливы
  rationale: «Праведны» лучше сохраняет связь нравственной добродетели с верностью Божьему Закону, не вводя дополнительного конфессионального толкования.
- issue: Смысл τὰ νόμιμα в рассказе о мучениках
  choice: предписания Закона
  alternative: законные установления; установленные обычаи
  rationale: Контекст указывает на предписания отеческого Закона, однако перевод не уточняет сверх текста, были ли они исключительно обрядовыми или иного рода.
- issue: Отнесение μέχρι θανάτου
  choice: к соблюдению предписаний
  alternative: к повиновению матери
  rationale: Положение оборота внутри сочетания μέχρι θανάτου τὰ νόμιμα φυλάσσοντας наиболее естественно связывает «до смерти» с соблюдением установлений, хотя вся конструкция также подчёркивает крайнюю меру сыновнего послушания.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим перечню добродетелей. Повтор «были» слегка организует длинный греческий ряд и делает его естественным по-русски. Заглавная буква в слове «Закон» указывает на Моисеев Закон в данном контексте.
