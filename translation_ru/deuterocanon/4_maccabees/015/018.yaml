  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «О женщина, одна лишь родившая…»; возможно также: «О неповторимая женщина…». Греческое слово подчёркивает её исключительность среди женщин в таком проявлении преданности Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «почитание Бога». Греческое εὐσέβεια — ключевое для 4 Маккавейской понятие, обозначающее благоговейную верность Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: О
  rationale: Передаёт звательное восклицание и сохраняет возвышенный риторический тон.
- source_word: μόνη γύναι
  choice: единственная женщина
  rationale: Передаёт мысль о её исключительности среди женщин; возможные оттенки «одна лишь» и «неповторимая» отмечены в сноске.
- source_word: τὴν εὐσέβειαν
  choice: благочестие
  rationale: В 4 Маккавейской εὐσέβεια обозначает благоговейную верность Богу; «благочестие» естественно и сохраняет религиозную направленность термина.
- source_word: ὁλόκληρον
  choice: во всей его полноте
  rationale: Идиоматично выражает целостность и полноту благочестия, не сводя слово к нравственной безупречности.
- source_word: ἀποκυήσασα
  choice: родившая
  rationale: Сохраняет прямой образ деторождения, важный для риторики отрывка и образа матери.
theological_decisions:
- issue: Метафорическое применение языка деторождения к εὐσέβεια
  choice: 'Сохранить метафору буквально: «родившая благочестие»'
  alternative: «явившая благочестие во всей полноте»
  rationale: Греческий текст прямо использует глагол деторождения; буквальный образ сохраняет связь с материнством героини и не сглаживает напряжённость метафоры.
translation_notes:
  register: Современный литературный русский язык с возвышенной риторической интонацией. Восклицание и необычная метафора деторождения намеренно сохранены; формулировка остаётся понятной без архаизации.
