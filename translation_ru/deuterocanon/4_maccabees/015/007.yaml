lexical_decisions:
- source_word: ὠδῖνας
  choice: родовых мук
  rationale: Слово обозначает прежде всего муки, или схватки, при родах; в контексте матери речь естественнее всего идёт о пережитых ею родовых муках, а не о страданиях сыновей.
- source_word: καθʼ ἕκαστον αὐτῶν
  choice: ради каждого из них
  rationale: Оборот относится к отдельным родам каждого сына. «Ради» естественно передаёт связь материнских родовых мук с каждым из детей, не приписывая эти муки самим сыновьям.
- source_word: συμπάθειαν
  choice: сострадать
  rationale: В сочетании ἔχειν συμπάθειαν слово выражает сочувствие и участие в чужом страдании; русский глагол «сострадать» кратко и точно передаёт смысл.
- source_word: ἠναγκασμένην
  choice: вынужденную
  rationale: Сохранена форма причастия женского рода в винительном падеже, поскольку данный стих синтаксически продолжает описание матери из окружающего предложения.
