lexical_decisions:
- source_word: δύο ψήφους
  choice: два голоса
  rationale: ψῆφος — первоначально камешек для голосования, затем голос или решение. «Два голоса» сохраняет образ решающего выбора и естественно звучит по-русски.
- source_word: κρατοῦσα
  choice: державшая в руках
  rationale: Передаёт конкретный образ обладания двумя ψῆφοι, а также согласуется с продолженным повествовательным фрагментом.
- source_word: μήτηρ
  choice: мать
  rationale: Прямое и естественное соответствие греческому существительному без добавления неопределённости, отсутствующей в русском артиклевом строе.
- source_word: θανατηφόρον
  choice: несущий смерть
  rationale: Сохраняет буквальную семантику «смертоносный, приносящий смерть» и ясно противопоставляется спасению.
- source_word: σωτήριον
  choice: спасение
  rationale: В эллиптической конструкции подразумевается второй голос; «несущий… спасение» передаёт значение спасения или сохранения, не уточняя его механизм.
- source_word: ὑπὲρ τέκνων
  choice: о судьбе своих детей
  rationale: В данном образе голосования ὑπέρ относится к решению, принимаемому ради детей и касающемуся их; по-русски «о судьбе» естественно выражает ставки выбора, хотя это контекстуальное уточнение.
theological_decisions:
- issue: Значение σωτήριον в контексте мученичества
  choice: спасение
  alternative: избавление; сохранение
  rationale: «Спасение» сохраняет широкий смысл σωτήριον и намеренное напряжение между физической смертью и спасительным исходом, не сводя его заранее ни к земному избавлению, ни к позднейшему догматическому термину.
translation_notes:
  register: Современный литературный русский язык с сохранением метафоры голосования. Двоеточие и тире делают эллиптическое противопоставление прозрачным. Стих представляет собой синтаксически незавершённый фрагмент, поэтому сохранена конечная запятая.
