  yaml_path: translation/deuterocanon/4_maccabees/015/005.yaml
  text: For the more mothers are weak in spirit and have more children[b][a], the more they are devoted to their children.
translation:
  language: ru
  text: Ведь чем слабее духом матери и чем больше у них детей[a], тем сильнее они любят своих детей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и чем они многодетнее». Греческое слово πολυγονώτεραι стоит в сравнительной степени и указывает на большее число детей.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тем более они чадолюбивы» (φιλοτεκνώτεραι), то есть тем сильнее любят своих детей и привязаны к ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσῳ ... τοσούτῳ
  choice: чем ... тем
  rationale: Естественно передаёт по-русски греческую соотносительную сравнительную конструкцию и сохраняет значение пропорциональности.
- source_word: ἀσθενόψυχοι
  choice: слабее духом
  rationale: Сохраняет образ слабости души или духа, не сводя значение однозначно к трусости; сравнительная форма обусловлена конструкцией ὅσῳ ... τοσούτῳ.
- source_word: πολυγονώτεραι
  choice: чем больше у них детей
  rationale: Передаёт сравнительную степень прилагательного и значение многочисленного потомства естественным современным русским выражением.
- source_word: ὑπάρχουσιν
  choice: опущено как связка
  rationale: В русском настоящего времени связка «быть» обычно не выражается; её функция передана строением предложения.
- source_word: αἱ μητέρες
  choice: матери
  rationale: Прямое соответствие греческому существительному с сохранением общего высказывания.
- source_word: φιλοτεκνώτεραι
  choice: тем сильнее они любят своих детей
  rationale: Ясно и естественно выражает усиленную любовь и привязанность к детям, сохраняя сравнительную силу формы.
