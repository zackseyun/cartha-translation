    rationale: Хотя σωτηρία лексически может значить «спасение», здесь речь о кратковременном сохранении сыновей в живых по обещанию тирана. Русское «спасение» без пояснения создаёт нежелательную богословскую двусмысленность; заявленного в обосновании примечания к этому слову в наборе сносок нет.
  - severity: low
