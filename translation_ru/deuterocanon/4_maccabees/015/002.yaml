lexical_decisions:
- source_word: μήτηρ
  choice: мать
  rationale: Существительное без артикля продолжает синтаксическое течение более широкого предложения; в русском языке форма «мать» естественна и не требует неопределённого артикля.
- source_word: δυεῖν προκειμένων
  choice: перед которой стоял выбор между двумя
  rationale: Оборот обозначает два предмета выбора, стоявших перед матерью. Такая передача естественна по-русски и сохраняет ситуацию нравственного выбора.
- source_word: εὐσεβείας
  choice: благочестием
  rationale: В 4 Маккавейской εὐσέβεια означает верность и почтение к Богу. «Благочестие» кратко передаёт религиозный смысл, не сводя его лишь к чувству почтения.
- source_word: σωτηρίας προσκαίρου
  choice: временным спасением
  rationale: σωτηρία допускает значения спасения, избавления и сохранения жизни, а πρόσκαιρος подчёркивает временный характер. Слово «спасение» сохраняет лексическую широту оригинала; примечание уточняет контекст.
- source_word: τῆς ἑπτὰ υἱῶν
  choice: её семерых сыновей
  rationale: Притяжательное «её» естественно раскрывает очевидное отношение сыновей к названной матери.
- source_word: κατὰ τὴν τοῦ τυράννου ὑπόσχεσιν
  choice: обещанным тираном
  rationale: Компактная русская конструкция передаёт, что возможность временного спасения основывалась на обещании тирана.
theological_decisions:
- issue: Передача εὐσέβεια в контексте мученичества
  choice: благочестие
  alternative: почтение к Богу
  rationale: «Благочестие» сохраняет ёмкость греческого понятия, включающего почтение к Богу и верность Ему, без внесения конфессионально узкого толкования.
- issue: Передача σωτηρία применительно к обещанию тирана
  choice: временное спасение
  alternative: временное сохранение жизни
  rationale: Буквально более широкое «спасение» сохраняет выражение оригинала, тогда как определение «временное» и примечание не позволяют принять его здесь за эсхатологическое спасение.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим философско-мученическому повествованию. Тире в конце сохранено, поскольку стих представляет собой незавершённый фрагмент более широкого предложения.
