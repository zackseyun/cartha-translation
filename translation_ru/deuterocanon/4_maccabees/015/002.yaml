  text: a mother[a], with two things set before her—piety[b], and the temporary safety of her seven sons according to the tyrant’s promise—
translation:
  language: ru
  text: 'мать, перед которой были поставлены две возможности: благочестие[a] и временное сохранение жизни её семерых сыновей согласно обещанию тирана, —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «почтение к Богу», «верность Богу».'
