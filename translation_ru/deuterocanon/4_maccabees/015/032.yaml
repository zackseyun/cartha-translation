base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/032.yaml
  text: So you also[a], guardian of the law, though surrounded on every side by the flood of passions and pressed by the fierce winds of your sons’ torments[b], bravely endured the storms of godliness.
translation:
  language: ru
  text: Так и ты, хранительница Закона, со всех сторон окружённая потопом страстей[a] и теснимая свирепыми ветрами — мучениями твоих сыновей, — мужественно выдержала бури благочестия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потопом чувств»; возможно также: «потопом страданий». Греческое πάθη — один из ключевых терминов книги для страстей и чувств, которыми должен управлять разум.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «бури, перенесённые ради благочестия».'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: νομοφύλαξ
  choice: хранительница Закона
  rationale: Сложное слово обозначает ту, которая хранит и соблюдает Закон; женская форма соответствует обращению к матери, а прописная буква указывает на Закон Моисея.
- source_word: πανταχόθεν
  choice: со всех сторон
  rationale: В сочетании с περικυκλουμένῃ передаёт пространственный образ полного окружения.
- source_word: κατακλυσμῷ
  choice: потопом
  rationale: Сохраняет сильный образ наводнения или потопа и согласуется с последующей метафорой ветров и бурь.
- source_word: παθῶν
  choice: страстей
  rationale: В 4 Маккавейской это важный термин для сильных чувств и влечений, которыми должен управлять разум; «страсти» сохраняет философскую окраску и возможную широту значения.
- source_word: καρτεροῖς ἀνέμοις
  choice: свирепыми ветрами
  rationale: καρτερός здесь выражает силу и суровость; выбранное сочетание естественно продолжает образ бури.
- source_word: ταῖς τῶν υἱῶν βασάνοις
  choice: мучениями твоих сыновей
  rationale: βάσανοι — мучения или пытки; оборот относится к мучениям, которым подвергались её сыновья. Тире ясно показывает, что эти мучения уподоблены ветрам.
- source_word: συνεχομένη
  choice: теснимая
  rationale: Передаёт состояние человека, которого сжимают и одолевают со всех сторон, не разрушая образ напора ветров.
- source_word: γενναίως ὑπέμεινας
  choice: мужественно выдержала
  rationale: Сочетает доблесть и стойкое перенесение испытаний; по-русски звучит ясно и достойно.
- source_word: τοὺς τῆς εὐσεβείας χειμῶνας
  choice: бури благочестия
  rationale: χειμών во множественном числе метафорически означает бури; буквальная конструкция с родительным εὐσεβείας сохраняет сжатость и неоднозначность греческого выражения.
theological_decisions:
- issue: Значение πάθη в философско-мученическом контексте
  choice: страсти
  alternative: чувства; страдания
  rationale: Центральная тема книги — власть благочестивого разума над πάθη. «Страсти» сохраняет эту терминологическую связь, тогда как «страдания» могло бы неоправданно свести слово только к внешним мучениям.
- issue: Связь εὐσέβεια с метафорой бурь
  choice: бури благочестия
  alternative: бури, перенесённые ради благочестия
  rationale: 'Родительный падеж в греческом допускает сжатую связь без полного уточнения: это могут быть испытания, связанные с благочестием или переносимые ради него. Основной текст не разрешает эту неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Последовательная морская метафора — потоп, ветры, бури — сохранена; обращение к матери передано формами женского рода.
