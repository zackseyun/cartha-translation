translation:
  language: ru
  text: О, в стойкости ты благороднее мужчин, а в терпении — мужественнее мужей![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отважнее мужчин в терпении». Греческое слово, переданное как «мужественнее», может означать «отважнее»; однако сочетание «мужественнее мужей» сохраняет намеренную игру слов и образ добродетели, традиционно связываемой с мужчинами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρρένων
  choice: мужчин
  rationale: Слово обозначает лиц мужского пола; «мужчин» естественно по-русски и позволяет отличить его от последующего ἀνδρῶν, переданного как «мужей».
- source_word: πρὸς καρτερίαν
  choice: в стойкости
  rationale: καρτερία обозначает твёрдость, стойкость и мужество перед испытаниями; «в стойкости» точно и естественно выражает область сравнения.
- source_word: γενναιοτέρα
  choice: благороднее
  rationale: Сравнительная форма может указывать как на благородство духа, так и на доблесть; «благороднее» сохраняет нравственную возвышенность похвалы, не дублируя последующее «мужественнее».
- source_word: ἀνδρῶν
  choice: мужей
  rationale: ἀνήρ означает взрослого мужчину и здесь участвует в игре слов с ἀνδρειοτέρα. Возвышенное «мужей» уместно в риторическом восклицании и отличает это слово от ἀρρένων — «мужчин».
- source_word: πρὸς ὑπομονὴν
  choice: в терпении
  rationale: ὑπομονή — терпеливая стойкость и выдержка под испытанием. «В терпении» сохраняет традиционно понятный смысл и конструкцию сравнения.
- source_word: ἀνδρειοτέρα
  choice: мужественнее
  rationale: Прилагательное связано с ἀνήρ («муж») и означает мужественную отвагу. «Мужественнее» сохраняет намеренную игру слов в сочетании «мужественнее мужей».
theological_decisions:
- issue: Гендерно маркированное сравнение в похвале матери
  choice: Сохранено прямое сопоставление женщины с мужчинами и игра слов «мужественнее мужей».
  alternative: «Отважнее мужчин» или иная нейтрализованная передача без игры слов.
  rationale: Греческий текст намеренно изображает женщину превосходящей мужчин в добродетелях, культурно связывавшихся с мужественностью. Нейтрализация ослабила бы риторический переворот и смысл похвалы.
translation_notes:
  register: Современный литературный русский язык с возвышенной риторической интонацией. Местоимение «ты» добавлено для естественности русского обращения и ясно выражает подразумеваемого адресата; «мужей» сохраняет торжественный тон и греческую игру слов.
