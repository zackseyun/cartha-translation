  text: Because of her fear toward God[a], she disregarded the temporary safety of her children.
translation:
  language: ru
  text: Из страха перед Богом она пренебрегла временным спасением своих детей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «временным избавлением своих детей». Здесь греческое слово σωτηρία означает кратковременное спасение или сохранение земной жизни, а не вечное спасение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸν πρὸς τὸν θεὸν φόβον
  choice: Из страха перед Богом
  rationale: Предлог διά с винительным выражает причину. Сочетание «страх перед Богом» естественно для современного русского языка и сохраняет сильное значение φόβος, не сводя его лишь к почтению или благоговению.
- source_word: ὑπερεῖδεν
  choice: пренебрегла
  rationale: Глагол означает оставить без внимания, предпочтя нечто более важное. «Пренебрегла» передаёт сознательный отказ поставить кратковременное спасение детей выше верности Богу.
- source_word: τὴν τῶν τέκνων πρόσκαιρον σωτηρίαν
  choice: временным спасением своих детей
  rationale: σωτηρία сохраняется как «спасение», а πρόσκαιρον ясно ограничивает его временным, земным избавлением от смерти. «Своих» естественно выражает очевидную из контекста принадлежность детей матери.
theological_decisions:
- issue: Значение φόβος по отношению к Богу
  choice: страх перед Богом
  alternative: благоговение перед Богом
  rationale: «Страх» сохраняет вес и напряжение исходного понятия, тогда как «благоговение» могло бы чрезмерно смягчить его. Оборот «перед Богом» указывает на религиозную направленность этого страха.
- issue: Значение σωτηρία в данном контексте
  choice: временное спасение
  alternative: временное избавление; временное сохранение жизни
  rationale: Прилагательное πρόσκαιρον указывает на кратковременное физическое избавление детей от мучений и смерти, а не на вечное спасение. Вместе с тем слово «спасение» сохраняет лексическую широту греческого σωτηρία; контекст и примечание уточняют смысл.
translation_notes:
  register: Современный литературный русский язык, сдержанный и торжественный. Причинная конструкция и богословски весомое слово «страх» сохранены; смысл σωτηρία уточнён без устранения его исходной многозначности.
