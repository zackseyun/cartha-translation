lexical_decisions:
- source_word: καθʼ ἓν
  choice: каждого из них
  rationale: 'Оборот имеет распределительное значение: сыновья предстают по отдельности. Русское «каждого из них» передаёт это естественно и без лишнего уточнения.'
- source_word: στρεβλούμενον
  choice: пытают
  rationale: Глагол обозначает подвергание мучительной пытке и может конкретно подразумевать растягивание на орудии пытки. Общее «пытают» ясно для современного читателя, а более узкое значение отмечено в сноске.
- source_word: φλεγόμενον
  choice: сжигают
  rationale: Причастие описывает воздействие огня — горение или сожжение. В паре с «пытают» форма «сжигают» естественно передаёт продолжающееся насилие.
- source_word: ὁρῶσα
  choice: Видя, как
  rationale: Обстоятельственное причастие выражает одновременность и личное зрительное свидетельство матери; конструкция «видя, как» естественна в современном русском.
- source_word: μήτηρ
  choice: мать
  rationale: В греческом тексте сказано просто «мать» с артиклем; контекст определяет её как мать мучимых сыновей.
- source_word: οὐ μετεβάλετο
  choice: не изменила решения
  rationale: Глагол означает изменение или перемену. Поскольку по-русски безобъектное «не изменилась» здесь звучит неясно, добавлено подразумеваемое «решения», передающее стойкость матери без уточнения содержания решения.
- source_word: διὰ τὴν εὐσέβειαν
  choice: благодаря своему благочестию
  rationale: Предлог с винительным выражает причину. «Благочестие» сохраняет ключевую для 4 Маккавейской книги лексику благоговейной верности Богу; притяжательное местоимение требуется для естественного русского выражения.
theological_decisions:
- issue: Передача εὐσέβεια в контексте иудейского мученичества эллинистической эпохи
  choice: благочестие
  alternative: богопочитание; преданность Богу
  rationale: «Благочестие» передаёт нравственно-религиозную добродетель, включающую почитание Бога, верность ему и послушание Закону, не сводя её лишь к чувству или внешней религиозности.
- issue: Причинная связь διὰ τὴν εὐσέβειαν
  choice: мать не изменила решения благодаря своему благочестию
  alternative: мать не отступила от благочестия
  rationale: Греческий текст представляет благочестие причиной стойкости матери, а не непосредственным дополнением к глаголу. Выбранный вариант сохраняет эту причинную связь и не подменяет её утверждением, будто она не изменила самого благочестия.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим повествованию о мученичестве. Синтаксис сделан ясным и естественным; ключевой богословский термин «благочестие» сохранён последовательно.
