translation:
  language: ru
  text: Но дочь вспомнила о стойкости богобоязненного Авраама[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Авраама, чтившего Бога»; также возможно: «благочестивого Авраама».'
    reason: Лексические варианты передачи θεοσεβοῦς.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт противопоставление предшествующему контексту кратким и естественным русским союзом.
- source_word: θεοσεβοῦς
  choice: богобоязненного
  rationale: Сохраняет явное указание на Бога и атрибутивную связь определения с именем Авраама.
- source_word: Ἀβραὰμ
  choice: Авраама
  rationale: Общепринятая русская библейская форма имени в родительном падеже, обусловленном словом «стойкости».
- source_word: καρτερίας
  choice: стойкости
  rationale: Передаёт выдержку, твёрдость и постоянство под давлением; в данном нравственно-показательном контексте звучит естественно и ёмко.
- source_word: θυγάτηρ
  choice: дочь
  rationale: Сохраняет определённое существительное без добавления отсутствующего в греческом тексте притяжательного местоимения.
- source_word: ἐμνήσθη
  choice: вспомнила о
  rationale: Естественно передаёт аорист глагола «вспомнить, припомнить» и требует в русском предложного управления перед существительным.
theological_decisions:
- issue: Передача θεοσεβοῦς с явным упоминанием Бога
  choice: богобоязненного Авраама
  alternative: Авраама, чтившего Бога; благочестивого Авраама
  rationale: Сложное греческое прилагательное прямо содержит компонент θεο- («Бог»). Выбранное русское определение сохраняет эту связь и атрибутивное построение оригинала, не сводя характеристику Авраама к общей нравственной добродетели.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным библейским звучанием. Порядок слов близок к греческому, а неоднозначное «дочь» не снабжено поясняющим притяжательным местоимением.
