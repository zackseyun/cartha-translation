  yaml_path: translation/deuterocanon/4_maccabees/015/031.yaml
  text: For just as Noah’s ark[a], being borne along in the world-filling flood, steadfastly endured the waves,
translation:
  language: ru
  text: Ведь как Ноев ковчег[a], несомый среди вод всемирного потопа, стойко выдержал волны,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несомый потопом, наполнившим весь мир».'
    reason: Передаёт возможное более прямое соотнесение пассивного движения ковчега с потопом и явнее отражает масштаб κοσμοπληθεῖ, не устраняя неоднозначность редкого κοσμοφορουμένη.
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Ведь как
  rationale: Сохраняет причинно-связующую частицу γὰρ и естественно вводит сравнение, продолжающее предыдущую мысль.
- source_word: ἡ Νῶε κιβωτός
  choice: Ноев ковчег
  rationale: Общепринятое современное русское обозначение ковчега Ноя; притяжательная конструкция естественнее буквального «ковчег Ноя» в данном предложении.
- source_word: κοσμοπληθεῖ κατακλυσμῷ
  choice: всемирного потопа
  rationale: Передаёт охватывающий весь мир масштаб составного определения κοσμοπληθεῖ и сохраняет узнаваемую библейскую формулировку.
- source_word: κοσμοφορουμένη
  choice: носимый по водам
  rationale: Сохраняет пассивное движение ковчега под действием вод, не навязывая спорного буквального разбора редкого сложного слова.
- source_word: καρτερῶς
  choice: стойко
  rationale: Передаёт твёрдость и выдержку, важные для темы стойкости в 4 Маккавейской, естественным русским наречием.
- source_word: ὑπήνεγκεν
  choice: выдержал
  rationale: Выражает способность вынести натиск и хорошо сочетается с образом волн.
- source_word: τοὺς κλύδωνας
  choice: волны
  rationale: Ясно передаёт бурные водяные валы без излишней архаизации.
theological_decisions:
- issue: Образ Ноева ковчега как сравнение
  choice: Сравнение сохранено без богословского расширения
  alternative: Усилить образ, прямо связав его с мученичеством или спасением
  rationale: В самой фразе ковчег служит образом стойкого перенесения натиска; более подробная типологическая трактовка выходила бы за пределы текста.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования; синтаксис оставлен незавершённым запятой, поскольку стих представляет первую часть продолжающегося сравнения.
