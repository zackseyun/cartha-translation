  text: О мать, испытавшая ныне страдания, более горькие, чем муки, когда ты рожала их!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πικροτέρων
  choice: более горькими
  rationale: Сохраняет сравнительную степень и метафору горечи, передающую особую тяжесть нынешних страданий.
- source_word: μήτηρ
  choice: мать
  rationale: Прямое обращение к матери семерых сыновей; простой и точный русский эквивалент.
- source_word: πόνων
  choice: страданиями
  rationale: В данном контексте слово обозначает мучительные переживания; «страдания» естественно отличает их от родовых мук, не устраняя смысловую связь между ними.
- source_word: πειρασθεῖσα
  choice: испытанная
  rationale: Передаёт как пережитый опыт, так и характер испытания, не сводя причастие лишь к значению «испытавшая».
- source_word: ἤπερ
  choice: чем
  rationale: Естественно вводит по-русски сравнение нынешних страданий с прежними родовыми муками.
- source_word: τῶν ἐπʼ αὐτοῖς ὠδίνων
  choice: родовые муки при их рождении
  rationale: ὠδῖνες означает родовые муки, а ἐπʼ αὐτοῖς связывает их с сыновьями. Формулировка ясно передаёт смысл, тогда как буквальное «над ними» или «из-за них» по-русски было бы неестественно.
