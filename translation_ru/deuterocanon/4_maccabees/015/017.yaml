review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан: мать сопоставляется с нынешними страданиями, более горькими, чем родовые муки, связанные с рождением сыновей. Однако «испытанная страданиями» несколько смещает греческое πειρασθεῖσα: здесь естественнее подчеркнуть пережитое («испытавшая»), не добавляя оттенок внешнего испытания. Указательное αὐτοῖς относится к сыновьям, но русский притяжательный оборот позволяет выразить это без искусственного «при их рождении».'
  naturalness: «О мать» уместно в высоком риторическом обращении. Оборот «ныне испытанная страданиями, более горькими» грамматически возможен, но тяжеловесен и двусмысленно сближает «испытанная» с моральным испытанием. «О мать, испытавшая ныне страдания, более горькие, чем муки, когда ты рожала их!» звучит современно-литературно и сохраняет эмоциональность.
  terminology: «Страдания» для πόνων и «родовые муки» для ὠδίνων точны. «Муки, когда ты рожала их» ясно передаёт ἐπʼ αὐτοῖς без чрезмерного толкования и сохраняет связь с сыновьями.
  issues:
  - severity: medium
    issue: «испытанная» для πειρασθεῖσα
    rationale: Слово допустимо, но в русском обычно акцентирует то, что кто-то или что-то подвергло человека испытанию. Греческое причастие здесь прежде всего обозначает пережитые страдания; «испытавшая» ближе и не добавляет оттенка.
  - severity: low
    issue: «при их рождении»
    rationale: Смысл верен, однако формула звучит несколько канцелярски и скрывает материнское действие. «Когда ты рожала их» естественнее и точнее связывает родовые муки с матерью.
  - severity: low
    issue: Сноска излишне догматично фиксирует истолкование
    rationale: Фраза «то есть ... когда она рожала сыновей» хорошо отражает контекст, но лучше обозначить её как контекстуальный смысл, сохранив буквальную связь мук «с ними».
  revised_text: О мать, испытавшая ныне страдания, более горькие, чем муки, когда ты рожала их!
  revised_footnotes:
