lexical_decisions:
- source_word: ἀλλʼ ὅμως
  choice: И всё же
  rationale: Передаёт усиленный уступительно-противительный переход естественным современным русским выражением.
- source_word: τοσούτων ὄντων τῶν περὶ φιλοτεκνίαν
  choice: хотя столь многое в материнской любви
  rationale: φιλοτεκνία обозначает любовь и привязанность к детям; в данном контексте естественно уточняется как материнская любовь, без сведения выражения лишь к отдельным чувствам или порывам.
- source_word: εἰς συμπάθειαν ἑλκόντων τὴν μητέρα
  choice: влекло мать к состраданию
  rationale: Сохраняет направленность и образ глагола ἕλκω, а συμπάθεια передаётся как сострадательное сопереживание.
- source_word: ἐπʼ οὐδενὸς αὐτῶν
  choice: ни в одном случае
  rationale: Греческое выражение буквально отсылает к «ни одному из них», однако его референт в самом стихе не назван однозначно; нейтральная формулировка сохраняет контекстуальную открытость.
- source_word: αἱ παντοίκιλοι βάσανοι
  choice: всевозможные пытки
  rationale: Передаёт как большое разнообразие, выраженное παντοίκιλοι, так и конкретную жестокость βασάνοι в повествовании о мученичестве.
- source_word: τὸν λογισμὸν αὐτῆς
  choice: её разумного суждения
  rationale: λογισμός — ключевое для 4 Маккавейской понятие разумной способности и основанного на разуме суждения; этот вариант сохраняет философский смысл и не сводит его только к волевой решимости.
- source_word: ἴσχυσαν μετατρέψαι
  choice: не смогли изменить
  rationale: Передаёт отсутствие силы или способности, выраженное ἰσχύω с инфинитивом, и изменение направления, обозначенное μετατρέπω, без лишнего образного дополнения.
theological_decisions:
- issue: Философски значимое значение λογισμός
  choice: разумное суждение
  alternative: разум; решение; решимость
  rationale: В 4 Маккавейской λογισμός связан с господством разума над страстями. «Разумное суждение» удерживает и способность рассуждать, и конкретную внутреннюю позицию матери, тогда как «решимость» чрезмерно усилила бы волевой аспект.
- issue: Референт местоимения в ἐπʼ οὐδενὸς αὐτῶν
  choice: ни в одном случае
  alternative: ни при одном из сыновей; ни под одним из этих воздействий
  rationale: Форма αὐτῶν допускает контекстуальную отсылку, но непосредственно названный референт синтаксически не вполне ясен. Перевод не закрепляет спорное толкование как единственно возможное.
translation_notes:
  register: Современный литературный русский язык с достойной риторической интонацией. Сохранены уступительная структура оригинала, образ внутреннего влечения к состраданию и философский акцент на разумном суждении; громоздкие буквальные конструкции сглажены без устранения смысловой неоднозначности.
