base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/001.yaml
  text: O reasoning[a], tyrant over the passions of children! And godliness is to a mother more longed-for than children.
translation:
  language: ru
  text: О разум[a], тиран над страстями детей! И благочестие для матери желаннее детей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза предельно сжата и риторически резка. Первую часть можно понять и так: «О разум, тиран над страстями!»; слова «детей» допускают иную синтаксическую связь.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «благочестие для матери дороже детей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισμέ
  choice: разум
  rationale: Форма звательного падежа обращена к разуму как к силе, господствующей над страстями; «разум» естественен по-русски и соответствует ключевой философской теме книги.
- source_word: τέκνων παθῶν
  choice: над страстями детей
  rationale: Оба родительных падежа сохранены в их наиболее непосредственной связи с τύραννε. При этом сжатый греческий синтаксис допускает и иное понимание, отмеченное в сноске.
- source_word: τύραννε
  choice: тиран над
  rationale: 'Сохранена намеренно резкая метафора τύραννος: разум не просто управляет страстями, а властно их подчиняет.'
- source_word: εὐσέβεια
  choice: благочестие
  rationale: В контексте книги слово обозначает верность Богу и Его закону; «благочестие» передаёт религиозную направленность без конфессионального уточнения.
- source_word: μητρί
  choice: для матери
  rationale: Дательный падеж выражает того, для кого благочестие оказывается более желанным.
- source_word: ποθεινοτέρα
  choice: желаннее
  rationale: Сравнительная степень передаёт превосходящую силу желания; «желаннее» звучит естественно и сохраняет эмоциональную напряжённость.
theological_decisions:
- issue: Значение εὐσέβεια в иудейском повествовании о мучениках
  choice: благочестие
  alternative: набожность; почитание Бога
  rationale: Выбор выражает преданность Богу и Его закону, не привнося позднейшей богословской терминологии.
- issue: Синтаксическая связь τέκνων в первой части стиха
  choice: «над страстями детей» с сохранением тесной связи двух родительных падежей
  alternative: «тиран над страстями»; либо «над чувствами к детям»
  rationale: Греческая фраза риторически сжата и допускает разные способы синтаксического членения; основной текст не сглаживает её образность, а сноска сохраняет подлинную неоднозначность.
- issue: Образ τύραννος применительно к разуму
  choice: сохранить слово «тиран»
  alternative: властитель; повелитель
  rationale: Парадоксально положительный образ подчёркивает безраздельную власть разума над страстями; смягчение ослабило бы риторику оригинала.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного восклицания и резкой метафоры оригинала. Синтаксис оставлен несколько отрывистым, поскольку такая риторическая сжатость присуща греческому тексту.
