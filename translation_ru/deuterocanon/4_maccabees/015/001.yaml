  source_fidelity: 'Текст точно передаёт греческую риторическую конструкцию: λογισμέ передано как обращение «О разум», τύραννε сохранено в намеренно резком образе «тиран», πάθη — как «страсти», а εὐσέβεια — как «благочестие». «Над страстями детей» является возможным буквальным разбором первого генитивного сочетания; сноска корректно предупреждает, что сжатый синтаксис не позволяет безоговорочно закрепить именно эту связь. Во второй части «благочестие для матери желаннее детей» адекватно выражает сравнительную конструкцию μητρὶ τέκνων ποθεινοτέρα.'
