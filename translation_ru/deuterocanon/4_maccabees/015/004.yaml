base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/004.yaml
  text: Oh[a], how can I describe the child-loving affections of parents, who imprint the likeness of soul and form in the small, marvelous character of a child[c][b], especially since mothers make fathers more sympathetic toward their children who have been born.
translation:
  language: ru
  text: О, как мне изобразить исполненные любви к детям чувства родителей, запечатлевающие сходство души и облика в дивном маленьком детском образе[a], — особенно если учесть, что матери более отзывчивы к рождённым ими детям, чем отцы[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально здесь употреблён образ маленького «детского отпечатка»: родительское сходство словно запечатлено в ребёнке.'
    reason: lexical_alternative
  - marker: b
    text: Греческое выражение буквально означает «к рождённым»; в контексте речь идёт о детях, рождённых матерями.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠθολογήσαιμι
  choice: как мне изобразить
  rationale: Редкий риторически возвышенный глагол означает выразительно описать или представить характер явления; «изобразить» сохраняет образность и уместно в восклицательном вопросе.
- source_word: φιλότεκνα γονέων πάθη
  choice: глубокую любовь родителей к детям — чувства
  rationale: Греческое сочетание буквально говорит о родительских чувствах, исполненных любви к детям. Такая передача естественна по-русски, сохраняет эмоциональную силу πάθη и позволяет следующим причастным оборотом соотнести действие именно с чувствами.
- source_word: ψυχῆς τε καὶ μορφῆς ὁμοιότητα
  choice: сходство души и облика
  rationale: 'Сохранены обе стороны уподобления: внутренняя, обозначенная словом ψυχή, и внешняя, обозначенная μορφή. «Облик» в данном контексте естественнее русского «форма».'
- source_word: παιδοχαρακτῆρα
  choice: образе ребёнка
  rationale: Сложное слово называет запечатлённый образ или отпечаток ребёнка. «Образ ребёнка» в сочетании с глаголом «запечатлевают» сохраняет метафору оттиска без неестественного буквального выражения.
- source_word: ἐναποσφραγίζοντα
  choice: запечатлевают
  rationale: Глагол передаёт нанесение печати или оттиска; русское «запечатлевают» сохраняет эту метафору и возвышенный строй фразы.
- source_word: συμπαθεστέρας
  choice: сильнее … сопереживают
  rationale: Сравнительная форма выражает большую эмоциональную отзывчивость и сопричастность. Глагольная конструкция звучит естественно и яснее передаёт направленность чувства к детям.
- source_word: τοῖς γεννηθεῖσιν
  choice: рождённым ими детям
  rationale: Причастие буквально означает «рождённым» и в контексте относится к потомству. Добавление «ими детям» делает референт ясным по-русски, не меняя смысла.
- source_word: τῶν πατέρων
  choice: сильнее отцов
  rationale: 'Родительный падеж при сравнительной степени συμπαθεστέρας естественно читается как родительный сравнения: матери более отзывчивы к детям, чем отцы.'
theological_decisions:
- issue: Антропологический оттенок выражения «сходство души и облика»
  choice: Сохранить прямое упоминание души и внешнего облика
  alternative: 'Передать динамически: «сходство внутреннего склада и внешности»'
  rationale: Текст не обязательно формулирует учение о происхождении души, но явно сопоставляет ψυχή и μορφή. Прямой перевод сохраняет антропологическую напряжённость и не навязывает её истолкования.
- issue: Синтаксис заключительного сравнения
  choice: Матери сильнее отцов сопереживают детям
  alternative: Матери делают отцов более отзывчивыми к детям
  rationale: В исходном греческом τὰς μητέρας является подлежащим аккузативно-инфинитивной конструкции, а τῶν πατέρων — родительным сравнения при συμπαθεστέρας. Поэтому английский консультационный вариант с матерями как причиной большей отзывчивости отцов не принят.
translation_notes:
  register: Современный литературный русский с сохранением высокого риторического восклицания и метафоры печати. Сложный греческий период слегка расчленён тире для ясности, но логические связи и напряжение между внутренним и внешним сходством сохранены.
