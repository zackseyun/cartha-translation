lexical_decisions:
- source_word: φιλοτεκνωτέρα
  choice: самой любящей своих детей
  rationale: Сравнительная степень в сочетании с «среди всех матерей» естественно передаётся по-русски превосходной степенью и выражает исключительную любовь к собственным детям.
- source_word: ἡ τῶν ἑπτὰ μήτηρ
  choice: мать семерых
  rationale: Греческий текст буквально говорит «мать семерых», не добавляя существительного; из контекста ясно, что речь идёт о её семи сыновьях.
- source_word: ἑπτὰ κυοφορίαις
  choice: за семь беременностей
  rationale: κυοφορία обозначает беременность, вынашивание. Перевод сохраняет конкретный телесный материнский опыт, подчёркнутый в оригинале.
- source_word: ἐπιφυτευομένην
  choice: глубоко укоренилась
  rationale: Передаёт метафору насаждения или укоренения чувства внутри матери; причастная конструкция преобразована в личную ради естественного русского синтаксиса.
- source_word: φιλοστοργίαν
  choice: привязанность
  rationale: Слово обозначает нежную естественную, прежде всего семейную, любовь. В данном контексте «привязанность» звучит естественно и не добавляет отсутствующего в греческом определения «материнская».
- source_word: πρὸς αὐτούς
  choice: к ним
  rationale: Сохраняет направленность чувства на семерых детей и буквальную местоименную отсылку.
