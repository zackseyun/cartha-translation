  yaml_path: translation/deuterocanon/4_maccabees/015/023.yaml
  text: But devout reason[a], strengthening her inward affections even in those very sufferings[b], strained to disregard her temporary love for her children.
translation:
  language: ru
  text: Но благочестивый разум[a], укрепив её сердце среди самих этих страданий, напрягал его, побуждая оставить без внимания преходящую любовь к детям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоговейный разум». Это ключевое выражение 4 Маккавейской книги, обозначающее разум, направляемый почтением к Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «преходящую любовь к детям»; или: «временную материнскую привязанность». Здесь естественная материнская любовь противопоставлена стойкой верности во время страданий, но сама по себе не осуждается.'
    reason: lexical_clarification
lexical_decisions:
- source_word: σπλάγχνα
  choice: сердце
  rationale: Буквально слово обозначает внутренности, но в данном контексте — глубочайшие чувства и душевные привязанности. «Сердце» естественно передаёт эту телесную метафору в современном русском языке.
- source_word: εὐσεβὴς λογισμός
  choice: благочестивый разум
  rationale: 'Ключевое выражение 4 Маккавейской книги: разум, направляемый почтением к Богу. Перевод сохраняет как рациональную, так и религиозную составляющую.'
- source_word: ἐν αὐτοῖς τοῖς πάθεσιν
  choice: среди самих этих страданий
  rationale: В контексте πάθη означает страдания или мучения, а усилительная конструкция αὐτοῖς τοῖς передана словами «самих этих».
- source_word: ἀνδρειώσας
  choice: укрепив
  rationale: Причастие означает «сделав мужественным, придав отвагу». «Укрепив» естественно сочетается со словом «сердце» и передаёт придание стойкости.
- source_word: ἐτέτεινεν
  choice: напрягал
  rationale: Глагол выражает напряжённое, продолжительное усилие; несовершенный вид русского глагола отражает имперфект греческого текста.
- source_word: τὴν πρόσκαιρον φιλοτεκνίαν
  choice: преходящую любовь к детям
  rationale: φιλοτεκνία — родительская любовь к детям, а πρόσκαιρος подчёркивает её ограниченность нынешним временем, не объявляя такую любовь порочной.
- source_word: παροδεῖν
  choice: превозмочь
  rationale: Буквально — «пройти мимо, оставить без внимания». В контексте внутренней борьбы «превозмочь» ясно передаёт сознательное преодоление естественной материнской привязанности.
theological_decisions:
- issue: Передача программного выражения εὐσεβὴς λογισμός
  choice: благочестивый разум
  alternative: богобоязненный разум; благочестивое рассуждение
  rationale: Выбор сохраняет соединение разумности и почтения к Богу, не привнося позднейших философских или конфессиональных категорий.
- issue: Смысл πρόσκαιρον φιλοτεκνίαν
  choice: преходящая любовь к детям
  alternative: временная материнская привязанность
  rationale: Определение указывает на временной предел естественной привязанности в противопоставлении стойкой верности, а не осуждает материнскую любовь как таковую.
- issue: Образ действия благочестивого разума над чувствами матери
  choice: разум укрепляет и напрягает её сердце
  alternative: разум сам старается оставить любовь без внимания
  rationale: Греческий синтаксис представляет εὐσεβὴς λογισμός субъектом, а τὰ σπλάγχνα — объектом действий ἀνδρειώσας и ἐτέτεινεν. Перевод сохраняет эту структуру и внутреннее напряжение образа.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Телесная метафора σπλάγχνα передана привычным русским образом сердца; синтаксис сохраняет благочестивый разум как действующее лицо и не сглаживает напряжение между материнской любовью и верностью.
