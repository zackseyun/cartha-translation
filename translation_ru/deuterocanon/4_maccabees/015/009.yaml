  text: And not only that, but because of the nobility of her sons and their obedience to the law, she had an even greater motherly affection for them.
translation:
  language: ru
  text: 'Но не только поэтому: благодаря благородству своих сыновей и их послушанию закону она питала к ним ещё большую материнскую любовь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴν δέ, ἀλλὰ καί
  choice: И не только это
  rationale: Сочетание вводит дополнительную, усиливающую мысль, а не простое противопоставление; такой оборот естественно передаёт накопительный смысл по-русски.
- source_word: καλοκἀγαθίαν
  choice: благородство
  rationale: Слово обозначает нравственное достоинство и добродетельный, благородный характер; «благородство» сохраняет возвышенный этический оттенок.
- source_word: εὐπείθειαν
  choice: послушание
  rationale: В сочетании с πρὸς τὸν νόμον речь идёт о готовности повиноваться закону; «послушание» ясно и естественно передаёт этот смысл.
- source_word: νόμον
  choice: закону
  rationale: Контекст указывает на отеческий иудейский закон, однако строчная буква не навязывает позднейшую типографскую интерпретацию там, где греческий текст её не выражает.
- source_word: μείζω
  choice: ещё более сильную
  rationale: Сравнительная степень усиливает уже существующую любовь; эта формулировка естественно связывается в русском языке со словом «любовь».
- source_word: φιλοστοργίαν
  choice: материнскую любовь
  rationale: Существительное означает естественную семейную привязанность; поскольку субъект — мать, контекстуально явный материнский оттенок можно выразить непосредственно.
theological_decisions:
- issue: Следует ли явно передавать материнский оттенок φιλοστοργίαν
  choice: «материнскую любовь»
  alternative: «семейную привязанность» или «родственную любовь»
  rationale: Само слово имеет более общий смысл семейной привязанности, но здесь оно обозначает любовь матери к сыновьям. Уточнение следует из контекста и не добавляет отдельного богословского утверждения.
- issue: Написание слова νόμος со строчной или прописной буквы
  choice: «закону» со строчной буквы
  alternative: «Закону»
  rationale: Речь конкретно идёт об иудейском законе, но греческий текст не кодирует различие прописной и строчной букв в современном смысловом употреблении; строчная буква сохраняет формальную неоднозначность без умаления контекстуального значения.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и достойный. Синтаксис сделан плавным для обычного читателя, при этом сохранены причинная связь, сравнительное усиление и семейно-материнский характер любви.
