  yaml_path: translation/deuterocanon/4_maccabees/015/024.yaml
  text: Even while seeing the destruction of her seven children and the intricate variety of the tortures[a], the noble mother, after embracing them all[b], let them go because of her faith toward God.
translation:
  language: ru
  text: Хотя она видела гибель семерых своих детей и сложное многообразие пыток, благородная мать, обняв всех их[a], отпустила их[b] по причине своей веры в Бога[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «поприветствовав всех их» или «простившись со всеми ими».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «освободила их»; по смыслу также возможно: «позволила им уйти».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «по причине своего доверия Богу»; возможно также: «по причине своей верности Богу».'
    reason: theological_ambiguity
lexical_decisions:
- source_word: καίπερ
  choice: Хотя
  rationale: Передаёт уступительное значение частицы и естественно вводит контраст между увиденными страданиями и поступком матери.
- source_word: ἑπτὰ τέκνων
  choice: семерых своих детей
  rationale: τέκνα лексически шире слова «сыновья»; притяжательное «своих» естественно в русском контексте и не меняет смысла.
- source_word: ἀπώλειαν
  choice: гибель
  rationale: В данном рассказе ἀπώλεια обозначает смертельную утрату детей; «гибель» точнее и естественнее русского «разрушение» применительно к людям.
- source_word: τὴν τῶν στρεβλῶν πολύπλοκον ποικιλίαν
  choice: всё сложное многообразие пыток
  rationale: Передаёт одновременно многочисленность и сложность мучений; στρεβλά понято в контексте как пытки или орудия пыток.
- source_word: ἀπάσασα
  choice: обняв каждого из них
  rationale: Передаёт возможный телесно-ласковый оттенок глагола приветствия или прощания; неоднозначность сохранена в сноске.
- source_word: ἡ γενναία μήτηρ
  choice: благородная мать
  rationale: γενναία выражает нравственное благородство и мужество; «благородная» сохраняет оба оттенка в возвышенном, но современном регистре.
- source_word: ἐξελυσεν
  choice: отпустила их
  rationale: Сохраняет образ развязывания или освобождения и в контексте означает, что мать не удержала детей от мученической смерти; возможный смысл пояснён в сноске.
- source_word: διὰ τὴν πρὸς θεὸν πίστιν
  choice: благодаря своей вере, обращённой к Богу
  rationale: διὰ с винительным передаёт причину, πίστις — веру, а πρὸς θεόν — её направленность к Богу; формулировка сохраняет необычную реляционную конструкцию оригинала.
theological_decisions:
- issue: Значение πίστις
  choice: вера
  alternative: доверие; верность
  rationale: «Вера» остаётся основным и наиболее широким соответствием, не исключая оттенков доверия Богу и верности Ему; эти возможности отмечены в сноске.
- issue: Характер поступка матери в ἐξελυσεν
  choice: отпустила их
  alternative: освободила их; позволила им уйти
  rationale: 'Формулировка не утверждает, будто мать желала смерти детей, а сохраняет напряжение образа: из-за веры она не стала удерживать их от мученичества.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сохраняет уступительную структуру греческого текста, но избегает неестественных кальк. Все существенные лексические и богословские неоднозначности вынесены в сноски.
