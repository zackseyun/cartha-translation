  text: I did not recognize the salvation that was saving seven sons for a little while[a].
translation:
  language: ru
  text: Я не распознала того спасения, которое ненадолго спасало семерых сыновей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я не узнала спасения, которое на короткое время сохраняло семерых сыновей».'
    reason: «Узнала» и «распознала» — возможные передачи ἐπέγνων; «сохраняло» передаёт σώζουσαν, сохраняя временной характер действия.
lexical_decisions:
- source_word: οὐκ ἐπέγνων
  choice: Я не признала
  rationale: Глагол ἐπιγινώσκω допускает значения «узнать», «распознать», «признать». В контексте речи матери «не признала спасением» естественно передаёт её отказ считать временное сохранение сыновей подлинным спасением, не сводя смысл к простому непониманию.
- source_word: τὴν σώζουσαν … σωτηρίαν
  choice: спасением то, что сохраняло
  rationale: Конструкция сохраняет смысловую связь σώζουσαν и σωτηρίαν, но избегает неестественного русского сочетания «спасение, спасавшее». «Сохраняло» подчёркивает временное сохранение жизни, тогда как «спасением» удерживает более широкий богословский диапазон σωτηρία.
- source_word: ἑπτὰ υἱοὺς
  choice: семерых сыновей
  rationale: υἱούς обозначает именно сыновей; форма «семерых» нормативна и естественна при обозначении лиц мужского пола.
- source_word: πρὸς ὀλίγον χρόνον
  choice: лишь на короткое время
  rationale: Передаёт ограниченную продолжительность. Частица «лишь» естественно выявляет контраст между временным сохранением жизни и спасением в более полном смысле.
theological_decisions:
- issue: Значение σωτηρία в контексте мученичества
  choice: Сохранено слово «спасение», а причастие передано как временное сохранение жизни
  alternative: «избавление» или «сохранение» без более широкого значения
  rationale: Контекст и πρὸς ὀλίγον χρόνον выдвигают на первый план кратковременное избавление от смерти, однако σωτηρία может иметь более широкий смысл. Перевод сохраняет это напряжение и не ограничивает термин только физическим избавлением.
translation_notes:
  register: Современный литературный русский, сдержанный и достойный. Синтаксис сделан естественным для прямой речи матери; исходная игра однокоренных σώζουσαν/σωτηρίαν передана сочетанием «спасением… сохраняло», поскольку буквальное «спасение, спасавшее» по-русски тяжеловесно.
