  yaml_path: translation/deuterocanon/4_maccabees/015/029.yaml
  text: O mother of the nation[a], avenger of the law, defender of godliness[b], and prizewinner in the struggle through motherly affections.
translation:
  language: ru
  text: О мать народа[a], мстительница за Закон, защитница благочестия и победительница в борьбе, проходившей через материнские чувства[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мать племени»; греческое ἔθνος может обозначать народ, племя или этническую общность.'
    reason: lexical_alternative
  - marker: b
    text: Буквально — «победительница в состязании через глубокие чувства». Греческий образ соединяет атлетическую победу с испытанием, затронувшим естественную материнскую любовь и сострадание.
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ ἔθνους
  choice: мать народа
  rationale: Сохраняет прямое торжественное обращение и общественное, представительное значение образа; «народ» естественнее по-русски и не сужает ἔθνος до этнической принадлежности.
- source_word: ἔκδικε τοῦ νόμου
  choice: поборница закона
  rationale: «Поборница» передаёт деятельную защиту и отстаивание правого дела закона, не создавая в русском тексте чрезмерно узкого впечатления личной мести.
- source_word: ὑπερασπίστεια τῆς εὐσεβείας
  choice: защитница благочестия
  rationale: Передаёт образ активной защиты; «благочестие» охватывает почтение к Богу и верность, проявляемую в поведении.
- source_word: διὰ σπλάγχνων ἀγῶνος
  choice: в борьбе материнского сердца
  rationale: 'Сжатое образное выражение сохраняет внутреннее напряжение греческой фразы: σπλάγχνα обозначает внутренности, а переносно — глубокие чувства и сострадание; в контексте это материнская привязанность.'
- source_word: ἀθλοφόρε
  choice: победительница
  rationale: Естественно передаёт участницу состязания, завоевавшую награду; атлетический оттенок дополнительно отмечен в сноске.
theological_decisions:
- issue: Значение εὐσέβεια в повествовании о мученичестве
  choice: благочестие
  alternative: набожность; почтение к Богу
  rationale: «Благочестие» сохраняет соединение почитания Бога с верностью в поступках и не вводит более позднего узкоконфессионального смысла.
- issue: Направленность выражения διὰ σπλάγχνων ἀγῶνος
  choice: борьба материнского сердца
  alternative: борьба с материнскими чувствами; борьба, пройденная благодаря материнской любви
  rationale: Греческая конструкция риторически сжата и допускает разные оттенки связи между борьбой и глубокими материнскими чувствами. Перевод не уточняет без достаточного основания, были ли эти чувства препятствием или средством стойкости.
translation_notes:
  register: Торжественное риторическое обращение передано современной литературной русской речью. Цепочка почётных наименований и финальный атлетический образ сохранены без добавления глагольной связки.
