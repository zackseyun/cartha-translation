lexical_decisions:
- source_word: σάρκας
  choice: плоть их
  rationale: Множественное число от σάρξ в контексте мучений обозначает конкретно истерзанную плоть. Русское собирательное «плоть» естественнее буквального множественного числа и сохраняет наглядную, тяжёлую образность.
- source_word: ὥσπερ
  choice: словно
  rationale: Передаёт сравнительное значение и естественно вводит необычный образ.
- source_word: προσωπεῖα
  choice: маски
  rationale: Слово обычно обозначает маски, в том числе театральные, а не просто лица; «маски» сохраняет шокирующее сравнение греческого текста.
- source_word: προκειμένας
  choice: разложенная перед ними
  rationale: Причастие от πρόκειμαι означает «лежать перед, быть выставленным/положенным перед». «Разложенная перед ними» сохраняет пространственный образ и допускает оттенок намеренного выставления на виду.
