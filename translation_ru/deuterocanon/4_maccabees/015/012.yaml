  text: But the mother urged each son individually[a], and all of them together[b], toward death for the sake of godliness.
translation:
  language: ru
  text: Но мать побуждала каждого сына по отдельности[a] и всех вместе к смерти ради благочестия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по одному… всех вместе». Греческий текст противопоставляет обращение матери к каждому сыну отдельно её обращению ко всем сыновьям как к одной группе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к смерти благочестия»; то есть к смерти, принимаемой ради благочестия или почитания Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: Но ... и
  rationale: Передаёт лёгкое противопоставление и усилительно-присоединительное значение сочетания, сохраняя связь с предыдущим контекстом.
- source_word: καθʼ ἕνα παῖδα
  choice: каждого сына по отдельности
  rationale: καθʼ ἕνα имеет распределительное значение «по одному», а παῖδα в данном контексте обозначает одного из сыновей матери.
- source_word: ὁμοῦ πάντας
  choice: всех вместе
  rationale: Сохраняет и значение совместности ὁμοῦ, и полноту охвата πάντας.
- source_word: ἡ μήτηρ
  choice: мать
  rationale: Естественное русское обозначение уже известной из контекста матери; определённость передаётся контекстом.
- source_word: ἐπὶ ... προέτρεπεν
  choice: побуждала к
  rationale: Передаёт настойчивое увещание и направленность к цели, выраженную ἐπὶ с винительным падежом.
- source_word: τὸν τῆς εὐσεβείας ... θάνατον
  choice: к смерти ради благочестия
  rationale: Сохраняет прямое слово «смерть», не подменяя его словом «мученичество», и естественно выражает смысловую связь родительного τῆς εὐσεβείας со смертью.
theological_decisions:
- issue: Передача εὐσέβεια в контексте смерти за верность Богу
  choice: благочестие
  alternative: почитание Бога; набожность
  rationale: «Благочестие» — понятный и устойчивый русский религиозно-нравственный термин, сохраняющий связь с верностью Богу и Его закону без внесения узкоконфессионального смысла.
- issue: Смысл родительного τῆς εὐσεβείας при θάνατον
  choice: смерть ради благочестия
  alternative: смерть благочестия; благочестивая смерть
  rationale: Контекст поддерживает целевую или причинную связь — смерть, принимаемую ради благочестия. Однако формальная неоднозначность греческого родительного отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но доступным библейским регистром. Порядок слов перестроен ради естественности русского предложения; парная конструкция «и каждого… и всех…» сохраняет греческое противопоставление индивидуального и совместного увещания.
