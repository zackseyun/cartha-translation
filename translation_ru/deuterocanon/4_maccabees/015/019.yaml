base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/015/019.yaml
  text: Nor[a], as a third son was breathing his last, did you weep when you saw the eyes of each one, bull-like, looking upon the tortures and the same torment[c][b], and their nostrils foretelling death.
translation:
  language: ru
  text: Ты не плакала ни когда третий сын испускал дух,[a] ни когда видела глаза каждого из них, по-бычьи устремлённые на пытки и на то же истязание,[b] и их ноздри, предвещавшие смерть.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда третий испускал дух». В греческом тексте существительное «сын» подразумевается из контекста, а начало фразы построено эллиптично.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «глядящие по-бычьи». Вероятно, этот образ передаёт напряжённый и непреклонный взгляд сыновей перед лицом пыток.'
    reason: cultural_note
  - marker: c
    text: Необычный греческий образ, возможно, указывает на дыхание умирающих, по которому было видно приближение смерти.
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ τρίτος ἀποψύχων
  choice: И когда третий сын испускал дух
  rationale: Греческое начало эллиптично и продолжает предшествующий рассказ о сыновьях. Слово «сын» восполнено из ближайшего контекста, а «испускал дух» передаёт буквальный образ ἀποψύχων — угасания жизни, последнего дыхания.
- source_word: θεωροῦσα
  choice: когда видела
  rationale: Причастие обозначает непосредственное созерцание матерью происходящего; придаточное времени естественно связывает его с οὐκ ἔκλαυσας.
- source_word: ταυρηδόν
  choice: по-бычьи устремлённые
  rationale: Сохранён необычный образ быка и его ближайшая синтаксическая связь со взглядом сыновей; русский оборот передаёт напряжённость и непреклонность взгляда, не заменяя образ истолкованием.
- source_word: ἐπὶ τῶν βασάνων ὁρῶντας
  choice: устремлённые на пытки
  rationale: βάσανοι здесь может обозначать пытки, мучения или их орудия. «На пытки» сохраняет более широкое значение и направление взгляда.
- source_word: τὸν αὐτὸν αἰκισμόν
  choice: на то же истязание
  rationale: αἰκισμός означает жестокое обращение, надругательство или истязание. «То же истязание» сохраняет повторность общей участи сыновей и не устраняет напряжённое соседство с βασάνοι.
- source_word: τοὺς μυκτῆρας προσημειουμένους αὐτῶν τὸν θάνατον
  choice: их ноздри, предвещавшие смерть
  rationale: 'Передан намеренно резкий телесный образ: ноздри или дыхание служат предварительным признаком близкой смерти. «Предвещавшие» отражает значение προσημειουμένους — заранее указывать, подавать знак.'
- source_word: οὐκ ἔκλαυσας
  choice: ты не плакала
  rationale: Прямое риторическое обращение и обычное значение κλαίω переданы ясной современной формой.
theological_decisions:
- issue: Восполнение подразумеваемого существительного в эллиптичном начале
  choice: 'Добавлено «сын»: «когда третий сын испускал дух»'
  alternative: 'Оставить буквально и эллиптично: «когда третий испускал дух»'
  rationale: Контекст однозначно говорит о сыновьях матери; восполнение делает русский текст понятным, не добавляя нового богословского содержания. Эллиптичность отмечена в сноске.
- issue: Отнесение образа ταυρηδόν
  choice: 'Образ отнесён непосредственно к взгляду: «глаза… по-бычьи устремлённые»'
  alternative: Отнести образ в целом к поведению сыновей при пытках или истолковать как «с непреклонным мужеством»
  rationale: Положение наречия рядом с описанием глаз и зрения поддерживает связь со взглядом. Сохранение самого образа не навязывает читателю единственного психологического толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного риторического обращения. Необычные телесные образы оригинала не сглажены; эллипсис начала прояснён минимальным контекстуальным восполнением, а возможные альтернативы вынесены в сноски.
