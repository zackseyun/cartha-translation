  yaml_path: translation/deuterocanon/4_maccabees/015/022.yaml
  text: How greatly and how many times, then, was the mother tortured with torments while her sons were being tortured with wheels and cauteries?
translation:
  language: ru
  text: Каким же великим и сколь многим мучениям подвергалась тогда мать, когда её сыновей пытали колёсами и раскалёнными орудиями?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «какими великими и сколь многими мучениями мучилась». В греческом тексте повторяются однокоренные слова ради риторического усиления. «Раскалённые орудия» — орудия для прижигания или клеймения; возможный перевод: «раскалённые железные орудия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πηλίκοις καὶ πόσαις
  choice: каким великим и сколь многим
  rationale: Сохраняет парную риторическую конструкцию, передающую одновременно тяжесть и множественность мучений, без сведения πόσαις исключительно к числу отдельных случаев.
- source_word: τότε
  choice: тогда
  rationale: Передаёт указание на повествовательный момент и риторический переход.
- source_word: ἡ μήτηρ
  choice: мать
  rationale: Греческий текст не содержит притяжательного местоимения; связь с сыновьями ясна из контекста.
- source_word: τῶν υἱῶν βασανιζομένων
  choice: когда её сыновей пытали
  rationale: Родительный абсолют естественно передан временным придаточным; «её» необходимо для ясной современной русской связи субъектов, хотя в греческом оно подразумевается.
- source_word: τροχοῖς
  choice: колёсами
  rationale: Прямо сохраняет множественное число и название орудия пытки, не подменяя его толкованием «дыбы».
- source_word: καυτηρίοις
  choice: раскалёнными орудиями
  rationale: Передаёт орудия прижигания или клеймения понятным современным языком, не сужая значение до конкретного вида железа.
- source_word: ἐβασανίζετο βασάνοις
  choice: мучениям подвергалась
  rationale: Естественная русская конструкция сохраняет сильный смысл и отчасти корневой повтор; не утверждает, что к матери физически применяли названные орудия.
theological_decisions:
- issue: Характер страдания матери
  choice: Мать претерпевает подлинные и тяжкие мучения, пока её сыновей физически пытают.
  alternative: Мать сама подвергалась тем же физическим пыткам; либо речь идёт лишь об эмоциональной скорби без оттенка мучения.
  rationale: Орудия синтаксически относятся к пыткам сыновей, тогда как повтор корня βασαν- подчёркивает действительность и силу страдания матери, не уточняя его физический механизм.
translation_notes:
  register: Современный литературный русский язык с торжественной риторикой вопроса. Конструкция «каким… и сколь многим мучениям» несколько возвышенна, но понятна и сохраняет форму и напряжённость греческого текста.
