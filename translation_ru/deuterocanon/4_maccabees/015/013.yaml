lexical_decisions:
- source_word: φύσις ἱερά
  choice: священная природа
  rationale: Прямо передаёт возвышенное обращение к природе как к естественному порядку семейных связей; «священная» сохраняет оценочный смысл ἱερά, не придавая выражению узко культового значения.
- source_word: φίλτρα γονέων
  choice: родительская любовь
  rationale: φίλτρα может обозначать любовь, привязанность и то, что вызывает любовь. В семейном контексте буквальное значение «приворотные средства» было бы ошибочным; русский оборот передаёт эмоциональную связь и сохраняет возможную соотнесённость как с любовью родителей, так и с любовью, связанной с родителями.
- source_word: γονεύσιν φιλοστόργε
  choice: нежная привязанность к родителям
  rationale: φιλοστόργος обозначает естественную нежную любовь, особенно семейную, а дательный γονεύσιν указывает на её направленность к родителям. Субстантивированная передача делает риторическое перечисление естественным по-русски.
- source_word: τροφεῖα
  choice: воспитание
  rationale: Слово относится к вскармливанию и взращиванию ребёнка, а также может обозначать должное воздаяние за это. «Воспитание» кратко передаёт основную семейную сферу значения, тогда как примечание сохраняет более широкий диапазон.
- source_word: μητέρων ἀδάμαστα πάθη
  choice: неодолимые материнские чувства
  rationale: ἀδάμαστα означает «неукротимые, непокорённые, неодолимые», а πάθη здесь — сильные переживания и привязанности. «Чувства» избегает современного отрицательного оттенка слова «страсти», сохраняя интенсивность посредством определения «неодолимые».
theological_decisions:
- issue: Является ли стих догматическим утверждением об освящённом семейном порядке или риторическим воззванием к силе естественных семейных уз?
  choice: Возвышенное риторическое восклицание, прославляющее священный характер и силу естественных семейных привязанностей.
  alternative: Плач, лишь призывающий в свидетели силу родительских и материнских чувств без положительной оценки «священная».
  rationale: Частица Ὦ и цепочка именных выражений образуют торжественную апострофу. Перевод ἱερά как «священная» сохраняет авторскую оценку, но не превращает её в отдельное догматическое положение.
translation_notes:
  register: Современный литературный русский язык с возвышенной риторической интонацией. Повторяющийся греческий союз καί передан плавным русским перечислением; финальный восклицательный знак отражает апострофу с Ὦ. Лексика понятна широкому читателю и не привносит конфессиональной терминологии.
