  text: Not in this way do siren songs or swanlike voices with feminine sound draw those who hear[a], as the voices of children calling to their mother amid tortures.
translation:
  language: ru
  text: Ни песни сирен, ни лебединые голоса с их женственным очарованием не привлекают тех, кто их слышит[a], так, как голоса детей, зовущих мать под пытками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни песни, подобные пению сирен, ни голоса лебедей». В греческом использованы античные поэтические образы неотразимо притягательного звучания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σειρήνιοι μελῳδίαι
  choice: песни сирен
  rationale: Передаёт прямую отсылку к мифическим сиренам и естественно звучит по-русски.
- source_word: κύκνιοι ... φωναί
  choice: лебединые голоса
  rationale: Сохраняет поэтический образ и допускаемое греческим прилагательным значение «голоса лебедей / подобные лебединым».
- source_word: πρὸς θηλυκίαν
  choice: с женственным звучанием
  rationale: Передаёт женственную окраску голосов, не усиливая выражение до «обольстительности» или «очарования», которых греческий текст прямо не называет.
- source_word: ἐφέλκονται
  choice: влекут
  rationale: Глагол обозначает притягивание к себе; «влекут» сохраняет образную силу и возвышенный поэтический регистр.
- source_word: τέκνων φωναί
  choice: голоса детей
  rationale: Прямо и естественно передаёт родительную конструкцию.
- source_word: μετὰ βασάνων
  choice: под пытками
  rationale: Ясно выражает обстоятельство, при котором дети зовут мать, и сохраняет тяжесть βασάνοι.
- source_word: μητέρα φωνούντων
  choice: зовущих мать
  rationale: Форма передаёт громкий призыв детей к матери; принадлежность «их» понятна из контекста и не нуждается в добавлении.
theological_decisions:
- issue: Риторическое сравнение с античными поэтическими образами
  choice: Сохранить в основном тексте сирен и лебединые голоса
  alternative: Обобщить как «чарующие песни» и «прекрасные голоса»
  rationale: Конкретные классические образы присутствуют в греческом тексте и создают намеренный контраст с криками истязаемых детей; их сохранение не вносит конфессионального толкования.
- issue: Сила сравнительной конструкции οὐχ οὕτως ... ὡς
  choice: «не ... так, как»
  alternative: «не столько ... сколько»
  rationale: Выбранная формулировка сохраняет греческую форму сравнения и не утверждает, будто песни сирен вовсе не обладают притягательной силой.
