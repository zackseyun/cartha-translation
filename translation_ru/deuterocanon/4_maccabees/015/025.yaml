lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Ибо, словно
  rationale: «Ибо» передаёт пояснительное γὰρ, а «словно» — сравнительную силу καθάπερ; незавершённость сравнения сохраняется, поскольку стих синтаксически продолжается.
- source_word: ἐν βουλευτηρίῳ τῇ ἑαυτῆς ψυχῇ
  choice: в совещательной палате собственной души
  rationale: Сохраняет образ души как места внутреннего совета; «совещательная палата» понятно и поддерживает метафору советников.
- source_word: δεινοὺς ... συμβούλους
  choice: грозных советников
  rationale: «Грозных» передаёт устрашающую и могущественную силу δεινούς, а «советников» сохраняет образ внутреннего совещания.
- source_word: ὁρῶσα
  choice: она видела
  rationale: Причастие естественно передано личной формой в русском синтаксисе без изменения субъекта.
- source_word: φύσιν
  choice: природу
  rationale: Сохраняет широкое значение природного начала или естественного побуждения, не сужая его до инстинкта.
- source_word: γένεσιν
  choice: рождение
  rationale: Передаёт связь, возникшую вследствие рождения детей, и сохраняет лаконичность греческого перечисления.
- source_word: φιλοτεκνίαν
  choice: любовь к детям
  rationale: Прямо передаёт родительскую любовь к детям, не добавляя к слову отсутствующего в нём определения «материнская».
- source_word: τέκνων στρέβλαν
  choice: истязание детей
  rationale: στρέβλα буквально может обозначать орудие истязания, особенно дыбу, но здесь естественно понимается метонимически как само истязание; буквальный образ отмечен в сноске.
