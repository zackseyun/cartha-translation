  text: And when this one had died in a manner worthy of his brothers[a], they dragged forward the fourth, saying,
translation:
  language: ru
  text: 'Когда и этот умер, как подобает брату[a], они вытащили вперёд четвёртого и сказали:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «умер по-братски»; то есть так, как подобало одному из этих братьев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: и этот
  rationale: Указательное местоимение отсылает к только что упомянутому брату; «и этот» сохраняет дейктическую силу и естественно связывает повествование.
- source_word: θανόντος
  choice: когда ... умер
  rationale: Аористное причастие в родительном абсолютном передаёт предшествующее обстоятельство; придаточное времени ясно выражает последовательность событий.
- source_word: ἀδελφοπρεπῶς
  choice: как подобает брату
  rationale: Редкое наречие буквально означает «по-братски достойно», то есть так, как достойно одного из братьев; формулировка сохраняет и семейный, и оценочный оттенки.
- source_word: τὸν τέταρτον
  choice: четвёртого
  rationale: Существительное «брата» остаётся подразумеваемым, как и в греческом тексте; контекст перечисления делает смысл ясным.
- source_word: ἐπεσπῶντο
  choice: вытащили вперёд
  rationale: Глагол обозначает принудительное вытягивание или волочение к месту действия; «вытащили» передаёт физическое принуждение.
- source_word: λέγοντες
  choice: и сказали
  rationale: Русская сочинительная конструкция естественно передаёт сопутствующее действие причастия и вводит прямую речь следующего стиха.
