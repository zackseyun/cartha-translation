lexical_decisions:
- source_word: κατὰ μηδένα τρόπον
  choice: никак
  rationale: 'Кратко и естественно передаёт усиленное отрицание: мучителям это совершенно не удавалось.'
- source_word: ἰσχύοντες
  choice: им … не удавалось
  rationale: В сочетании с инфинитивом причастие выражает способность или возможность совершить действие, а не просто физическую силу.
- source_word: ἄγξαι
  choice: задушить
  rationale: Глагол обозначает сдавливание горла; «задушить» ясно и уместно в контексте пытки.
- source_word: περισύραντες
  choice: стянули с него
  rationale: Передаёт насильственное стягивание или сдирание кожи и сохраняет последовательность действий.
- source_word: τὸ δέρμα
  choice: кожу
  rationale: Прямое и естественное обозначение кожи человеческого тела.
- source_word: σὺν ἄκραις ταῖς τῶν δακτύλων κορυφαῖς
  choice: вместе с самыми кончиками пальцев
  rationale: Буквально сохраняет σύν («вместе с»), усиленную идею крайних частей пальцев и графичность греческой фразы, не заменяя σύν значением «от».
- source_word: ἀπεσκύθισον
  choice: освежевали его
  rationale: Глагол может обозначать снятие кожи или скальпа; «освежевали» передаёт более общее значение снятия кожи, не сужая его без необходимости до скальпирования.
- source_word: εὐθέως
  choice: тотчас
  rationale: Передаёт немедленную последовательность событий в современном, но dignified повествовательном регистре.
- source_word: ἦγον ἐπὶ τὸν τροχόν
  choice: повели к колесу
  rationale: Прямо передаёт движение к колесу как следующему орудию пытки.
