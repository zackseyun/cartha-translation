lexical_decisions:
- source_word: ὁ δὲ αὐτοῖς ἔφη
  choice: Но он сказал им
  rationale: δέ вводит ответ с лёгким противопоставлением; «но» естественно передаёт этот поворот речи.
- source_word: ἔχετε ... κατʼ ἐμοῦ τὸ πῦρ
  choice: огонь, который вы направили против меня
  rationale: Передаёт буквальный огонь пытки и враждебную направленность κατʼ ἐμοῦ; глагол «направили» делает русскую фразу естественной, не устраняя образ.
- source_word: καυστικώτερον
  choice: настолько жгуч
  rationale: В конструкции οὐχ οὕτω ... ὥστε сравнительная форма выражает степень; по-русски это естественно передаётся оборотом «не настолько жгуч, чтобы».
- source_word: δειλανδρῆσαι
  choice: сделать меня трусом
  rationale: Передаёт каузативный смысл редкого глагола — лишить мужества, сделать трусливым — и естественно звучит в современной литературной русской речи.
- source_word: οὐχ οὕτω ... ὥστε
  choice: не настолько ... чтобы
  rationale: Стандартно и точно передаёт греческую конструкцию степени и следствия.
theological_decisions:
- issue: Этимологически гендерный оттенок δειλανδρῆσαι наряду со значением утраты мужества
  choice: сделать меня трусом
  alternative: лишить меня мужества; заставить меня поступить малодушно; сделать меня немужественным
  rationale: В контексте мучения речь прежде всего о нравственной стойкости. Основной текст передаёт это ясно, а примечание сохраняет возможные оттенки, не превращая их в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством мученической речи. Образ огня сохранён буквально; синтаксис слегка перестроен ради естественности. Маркер примечания помещён непосредственно после спорного выражения.
