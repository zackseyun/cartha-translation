  text: But he said to them[a], “The fire you have against me is not so scorching as to make me a coward.”
translation:
  language: ru
  text: 'Но он сказал им: «Огонь, который вы обращаете против меня, не настолько жгуч, чтобы сделать меня трусом[a]».'
