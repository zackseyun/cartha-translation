  yaml_path: translation/deuterocanon/4_maccabees/010/010.yaml
  text: But we[a], O most defiled tyrant, suffer these things for the sake of the discipline and virtue of God.
translation:
  language: ru
  text: Мы же, о сквернейший тиран, терпим всё это из-за Божьего воспитания и Божьей добродетели[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради Божьего воспитания и Божьей добродетели». Греческое θεοῦ («Бога», «Божий») относится к обоим словам; характер этой связи прямо не уточнён и может пониматься как принадлежность Богу, происхождение от Бога или отношение к Богу.'
    reason: Передаёт возможный целевой оттенок διά и сохраняет неоднозначность родительного θεοῦ, относящегося к двум однородным существительным.
lexical_decisions:
- source_word: Ἡμεῖς μέν
  choice: Мы же
  rationale: Местоимение подчёркнуто, а μέν вводит контраст с подразумеваемой противоположной стороной; русское «же» естественно передаёт это сопоставление.
- source_word: ὦ μιαρώτατε τύραννε
  choice: о сквернейший тиран
  rationale: μιαρώτατε — превосходная степень слова со значением осквернения, нечистоты и нравственной мерзости. «Сквернейший» сохраняет как оскорбительную силу, так и оттенок нечистоты; τύραννε передано прямо как «тиран».
- source_word: διὰ παιδείαν
  choice: ради воспитания
  rationale: С винительным падежом διά может обозначать причину или основание, а в данном контексте также допускает целевую окраску. παιδεία означает воспитание, обучение и нравственную дисциплину; «воспитание» здесь охватывает формирование в вере и Законе, не сводя смысл к школьному образованию.
- source_word: καὶ ἀρετὴν
  choice: и добродетели
  rationale: ἀρετή в этическом рассуждении означает добродетель, нравственное совершенство; «добродетель» — точный и естественный русский эквивалент.
- source_word: θεοῦ
  choice: Божьих
  rationale: Поставленный после двух однородных существительных родительный θεοῦ может относиться к обоим. Постпозитивное «Божьих» формально сохраняет эту связь и не заменяет её более узким толкованием вроде «угодных Богу» или «данных Богом».
- source_word: ταῦτα πάσχομεν
  choice: терпим всё это
  rationale: πάσχομεν означает «страдаем, претерпеваем»; «терпим всё это» естественно отсылает к уже описанным мучениям и сохраняет конкретность ταῦτα.
theological_decisions:
- issue: Связь θεοῦ с παιδείαν καὶ ἀρετήν
  choice: '«воспитания и добродетели Божьих»: θεοῦ отнесено к обоим существительным без уточнения характера этой связи'
  alternative: «воспитания и добродетели, данных Богом» или «воспитания и добродетели, угодных Богу»
  rationale: Греческий родительный падеж обозначает отношение к Богу, но сам по себе не решает, следует ли понимать эти качества как принадлежащие Богу, исходящие от Него или определяемые отношением к Нему. Перевод сохраняет эту богословскую неоднозначность, а сноска поясняет возможные прочтения.
- issue: Значение διά с винительным падежом
  choice: «ради»
  alternative: «из-за» / «вследствие»
  rationale: «Ради» хорошо соответствует стойкости мучеников, принимающих страдания за верность Божьему воспитанию и добродетели, однако причинное прочтение остаётся грамматически возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством мученической речи. Обращение «о сквернейший тиран» намеренно возвышенное и резкое, но понятное; постпозитивное «Божьих» слегка книжное и выбрано ради сохранения синтаксической и богословской неоднозначности оригинала.
