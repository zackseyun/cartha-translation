  text: Но то, что исходит от вас, и пытками-то не назовёшь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Но это ваше недостойно пыток». Сжатый оборот ὑμῶν допускает также передачи: «то, что с вашей стороны» или «ваше».'
    reason: Сноска сохраняет синтаксическую и смысловую неоднозначность генитива ὑμῶν и указывает на более буквальную форму греческого выражения.
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт резкое противопоставление предшествующей мысли естественным русским союзом.
- source_word: ταῦτα
  choice: то
  rationale: В сочетании с придаточным «что исходит от вас» естественно передаёт собирательное значение греческого указательного местоимения среднего рода множественного числа.
- source_word: ὑμῶν
  choice: что исходит от вас
  rationale: Передаёт сжатый и неоднозначный генитив как указание на источник — «от вас», не сводя его к принадлежности.
- source_word: βασάνων
  choice: пытками
  rationale: В контексте мученичества обозначает именно пытки, а не страдания вообще; множественное число сохранено.
- source_word: ἄξια
  choice: не заслуживает даже называться
  rationale: 'Греческое «не достойно пыток» по-русски без уточнения двусмысленно и может ошибочно означать, что некто не заслуживает подвергнуться пыткам. Формулировка передаёт риторический смысл: действия мучителей не достигают уровня настоящих пыток. «Даже» отражает усиление, принятое в консультационном английском тексте, хотя прямо в греческом отдельной частиицей не выражено.'
