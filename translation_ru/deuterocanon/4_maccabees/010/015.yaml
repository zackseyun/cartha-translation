base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/015.yaml
  text: By the blessed death of my brothers[a], and by the tyrant’s eternal destruction, and by the everlasting life of the godly[b], I will not renounce my noble brotherhood.
translation:
  language: ru
  text: 'Клянусь блаженной смертью моих братьев, вечной гибелью тирана и непреходящей жизнью благочестивых[a]: я не отрекусь от своего благородного братства.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте употреблены два близких по значению слова: αἰώνιος о гибели тирана и ἀΐδιος о жизни благочестивых. Здесь они переданы соответственно как «вечная» и «непреходящая».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὰ
  choice: Клянусь
  rationale: Частица μὰ с винительным падежом вводит торжественную клятву; русское «клянусь» естественно передаёт эту формулу.
- source_word: μακάριον ... θάνατον
  choice: блаженной смертью
  rationale: μακάριος выражает не просто счастье или удачу, а почитаемую, религиозно осмысленную блаженность смерти братьев.
- source_word: τῶν ἀδελφῶν μου
  choice: моих братьев
  rationale: Форма мужского рода и контекст указывают на родных братьев говорящего.
- source_word: αἰώνιον ... ὄλεθρον
  choice: вечной гибелью
  rationale: ὄλεθρος означает гибель, уничтожение или погибель; «гибель» ясно передаёт итоговую участь тирана, а «вечной» — длительность αἰώνιος.
- source_word: ἀΐδιον ... βίον
  choice: непреходящей жизнью
  rationale: ἀΐδιος обозначает неизменное, непрекращающееся существование. «Непреходящей» сохраняет смысл и позволяет отразить отличие слова от αἰώνιος, не превращая их в резко различные понятия.
- source_word: τῶν εὐσεβῶν
  choice: благочестивых
  rationale: εὐσεβής называет людей, почитающих Бога и живущих благочестиво; это традиционное и понятное русское соответствие.
- source_word: οὐκ ἀρνήσομαι
  choice: я не отрекусь
  rationale: ἀρνέομαι здесь означает отказ признать или сохранить связь; «не отрекусь» передаёт решительный отказ говорящего отвергнуть братское единство.
- source_word: τὴν εὐγένῃ ἀδελφότητα
  choice: от своего благородного братства
  rationale: ἀδελφότης означает братство или братскую связь, а εὐγενής — благородство происхождения или характера. Местоимение «своего» естественно выражает подразумеваемую контекстом принадлежность, не меняя предмет высказывания.
theological_decisions:
- issue: Противопоставление участи тирана и благочестивых
  choice: Сохранено прямое противопоставление вечной гибели тирана и непреходящей жизни благочестивых.
  alternative: Понять слова лишь как общее нравственное противопоставление либо развернуть их в подробное учение о посмертном воздаянии.
  rationale: Греческий текст утверждает контраст между αἰώνιος ὄλεθρος и ἀΐδιος βίος, но не поясняет его посредством более поздней догматической системы; перевод не смягчает и не расширяет утверждение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным построением клятвы. Двоеточие отделяет формулу клятвы от решительного заявления говорящего; архаизмы и конфессионально нагруженные уточнения не добавлены.
