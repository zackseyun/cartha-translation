translation_notes:
  register: 'Современный литературный русский язык с резким, но достойным риторическим обращением. Повтор близких по смыслу слов «ненавистный человеконенавистник» сохранён, поскольку он отражает намеренное нагнетание двух греческих эпитетов. Вопрос согласован с грамматикой греческого текста: δρῶντες — форма множественного числа, относящаяся к говорящим («мы»).'
