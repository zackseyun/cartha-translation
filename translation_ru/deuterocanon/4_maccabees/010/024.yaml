  yaml_path: translation/deuterocanon/4_maccabees/010/024.yaml
  text: O hateful and misanthropic man[a], what are you doing by exposing us in this way?
translation:
  language: ru
  text: О ненавистный человеконенавистник! Что мы такого делаем, что ты так выставил нас напоказ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что ты так выставил нас перед всеми?» Греческий глагол может означать «выставить», «представить» или «отдать на всеобщее обозрение»; здесь речь, вероятно, о публичном выставлении на поругание и мучения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισάρετε
  choice: ненавистный
  rationale: Звательная форма бранного прилагательного со значением «ненавистный, отвратительный». Выбрано прямое соответствие, сохраняющее резкость обращения без усиления до превосходной степени.
- source_word: μισάνθρωπε
  choice: человеконенавистник
  rationale: Сложное слово буквально обозначает того, кто ненавидит людей. Русское «человеконенавистник» точно передаёт смысл и естественно употребляется как обращение.
- source_word: τί δρῶντες
  choice: что мы такого делаем
  rationale: Причастие δρῶντες стоит во множественном числе и относится к подразумеваемому «мы», а не к единственному адресату. Оборот буквально означает «делая что?»; частица «такого» естественно передаёт подразумеваемый вопрос о проступке, не меняя настоящего времени.
- source_word: ἡμᾶς
  choice: нас
  rationale: Прямое дополнение первого лица множественного числа.
- source_word: προθεῖς
  choice: выставил нас напоказ
  rationale: Аористное причастие от προτίθημι означает «выставить, поместить перед другими, представить». В контексте публичного истязания выражение «выставил напоказ» передаёт как публичность, так и унизительный характер действия, не добавляя конкретного вида наказания.
- source_word: τοῦτον … τὸν τρόπον
  choice: так
  rationale: Идиоматическое обозначение образа действия; краткое русское «так» естественно соответствует греческому «таким образом».
