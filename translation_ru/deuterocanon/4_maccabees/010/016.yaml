  yaml_path: translation/deuterocanon/4_maccabees/010/016.yaml
  text: Go on[a], tyrant, with your tortures, so that even through these you may learn that I am a brother of those who have been tortured before.
translation:
  language: ru
  text: «Приступай, тиран, к пыткам, чтобы даже через них ты узнал, что я брат тех, кого пытали прежде[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто ранее подвергся пыткам». Приставка προ- указывает, что их пытали раньше говорящего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπιθι
  choice: Приступай
  rationale: Повелительная форма выражает дерзкий вызов продолжать действие. «Приступай» естественно сочетается с дательным βασάνοις и сохраняет решительный тон речи.
- source_word: τύραννε
  choice: тиран
  rationale: Звательная форма прямого обращения; «тиран» передаёт как властный статус адресата, так и осуждающий оттенок греческого слова.
- source_word: βασάνοις
  choice: к пыткам
  rationale: Дательный падеж множественного числа обозначает пытки как действие или средство, к которому вызывают приступить; русское управление «приступай к пыткам» звучит естественно и не ослабляет жестокости сцены.
- source_word: ἵνα καὶ διὰ τούτων μάθῃς
  choice: чтобы даже через них ты узнал
  rationale: ἵνα передаёт цель, καί здесь усиливает мысль («даже»), а διὰ τούτων указывает на пытки как средство, посредством которого тиран должен убедиться в сказанном.
- source_word: ἀδελφός
  choice: брат
  rationale: Форма мужского рода единственного числа прямо называет родственную связь говорящего с ранее подвергнутыми пыткам мужчинами; русская именная часть сказуемого не требует неопределённого артикля.
- source_word: τῶν προβασανισθέντων
  choice: тех, кого пытали прежде
  rationale: Субстантивированное страдательное причастие с приставкой προ- указывает, что пытки над этими людьми произошли раньше пыток говорящего. Развёрнутая конструкция ясна и естественна по-русски.
theological_decisions:
- issue: Родственное обозначение ἀδελφός в повествовании о мученичестве братьев
  choice: брат
  alternative: один из детей одной семьи
  rationale: Греческое слово имеет мужской род и единственное число, а контекст представляет говорящего братом уже подвергнутых пыткам мужчин. Передача «брат» сохраняет конкретность текста и семейную солидарность, не нейтрализуя род.
translation_notes:
  register: Современный литературный русский язык с достоинством и прямотой мученической речи. Порядок слов сохраняет вызывающее обращение к тирану, но избегает архаизмов; «даже через них» удерживает смысловую напряжённость καί и инструментальное значение διὰ τούτων.
