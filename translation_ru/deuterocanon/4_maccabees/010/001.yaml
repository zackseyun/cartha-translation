base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/001.yaml
  text: And after he had endured this death[a], worthy to be sung of, the third was led in[b], being urged much by many to save himself by tasting it.
translation:
  language: ru
  text: И после того как он стойко претерпел смерть, достойную воспевания[a], повели третьего. Многие настойчиво уговаривали его отведать запретной пищи и тем спастись[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «прославленную смерть» или «славную смерть». Греческое прилагательное буквально связано с тем, что воспевают или с похвалой сохраняют в памяти.'
    reason: lexical_alternative
  - marker: b
    text: То есть отведать запрещённой законом пищи и благодаря этому сохранить себе жизнь. В греческом тексте предмет, который предлагали отведать, здесь прямо не назван.
    reason: cultural_note
lexical_decisions:
- source_word: ἀοίδιμον
  choice: достойную воспевания
  rationale: Прилагательное связано с воспеванием и прославлением в песне. Такой перевод сохраняет возвышенную риторику греческого текста и не сводит смысл к более общему «знаменитую».
- source_word: θάνατον
  choice: смерть
  rationale: Существительное прямо обозначает смерть и сосредоточивает внимание на мученической кончине, а не только на процессе умирания.
- source_word: καρτερήσαντος
  choice: стойко претерпел
  rationale: Причастие выражает твёрдость и упорство перед лицом страдания; сочетание передаёт как само перенесённое испытание, так и проявленную стойкость.
- source_word: ὁ τρίτος ἤγετο
  choice: повели третьего
  rationale: Пассивная форма указывает, что третьего брата подвели или повели к испытанию. Русский перевод сохраняет направленное движение, не уточняя место, которого греческий текст не называет.
- source_word: παρακαλούμενος πολλὰ ὑπὸ πολλῶν
  choice: многие настойчиво уговаривали его
  rationale: 'Формулировка естественно передаёт оба усиления: настойчивость уговоров (πολλὰ) и множество уговаривавших (ὑπὸ πολλῶν).'
- source_word: ὅπως ἀπογευσάμενος σώζοιτο
  choice: отведать запретной пищи и тем спастись
  rationale: Деепричастное по смыслу действие выражено как средство спасения. Подразумеваемый объект уточнён из непосредственного контекста как запретная пища, а «спастись» сохраняет форму и некоторую смысловую открытость σώζοιτο.
theological_decisions:
- issue: Возвышенная оценка мученической смерти в ἀοίδιμον θάνατον
  choice: смерть, достойную воспевания
  alternative: прославленную смерть; славную смерть
  rationale: Выбранная формулировка сохраняет образ воспевания, заложенный в греческом прилагательном, и передаёт хвалебный тон, не вводя более поздней специальной богословской терминологии.
- issue: Смысл σώζοιτο в контексте принуждения к запретной пище
  choice: спастись
  alternative: сохранить себе жизнь
  rationale: «Спастись» близко к форме греческого глагола и не устраняет его возможную смысловую широту; сноска поясняет, что в данной сцене непосредственно имеется в виду сохранение земной жизни.
- issue: Подразумеваемый объект ἀπογευσάμενος
  choice: уточнить как «запретную пищу»
  alternative: 'оставить объект невыраженным: «отведать и тем спастись»'
  rationale: В русском языке уточнение делает фразу ясной и естественной; оно основано на непосредственном повествовательном контексте и отмечено сноской, чтобы показать, что сам объект в этом стихе по-гречески не назван.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном, соответствующим мученической риторике отрывка. Синтаксис разделён на два предложения для ясности; повтор греческих πολλὰ / πολλῶν передан естественным сочетанием «многие настойчиво».
