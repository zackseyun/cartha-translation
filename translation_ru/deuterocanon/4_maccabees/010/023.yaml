  yaml_path: translation/deuterocanon/4_maccabees/010/023.yaml
  text: But I myself came forward of my own accord[a], so that by killing me also, you may incur punishment from heavenly justice for still more acts of wrongdoing.
translation:
  language: ru
  text: Но я сам вышел вперёд по собственной воле, чтобы ты, убив и меня, навлёк на себя от небесной справедливости наказание за ещё большее число злодеяний.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «небесного правосудия»; возможно также: «небесного суда». В греческом тексте Бог прямо не назван: речь идёт о высшей справедливости, связанной с небом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρῆλθον
  choice: вышел вперёд
  rationale: В данном контексте глагол обозначает намеренное выступление перед тираном и палачами; этот перевод естественно передаёт добровольное предъявление себя им.
- source_word: ἀπʼ ἐμαυτοῦ
  choice: по собственной воле
  rationale: Оборот подчёркивает, что говорящий действует добровольно и по своей инициативе.
- source_word: κατακτείνας
  choice: убив
  rationale: Деепричастие сохраняет связь действия с главным глаголом, не уточняя излишне, является ли оттенок временным или инструментальным.
- source_word: ὀφλήσῃς
  choice: навлёк на себя
  rationale: В судебно-нравственном контексте глагол выражает возникновение ответственности и подлежащего наказанию долга; русское выражение естественно сочетается с «наказанием».
- source_word: τῇ οὐρανίᾳ δίκῃ
  choice: небесной справедливости
  rationale: Сохраняет образ трансцендентной справедливости, связанной с небом, но не вводит прямо имя Бога, отсутствующее в греческом тексте.
- source_word: τιμωρίαν
  choice: наказание
  rationale: Ясно передаёт карательное последствие, не усиливая смысл до личной мести.
- source_word: περὶ πλειόνων ἀδικημάτων
  choice: за ещё большее число злодеяний
  rationale: Передаёт накопительный сравнительный смысл πλειόνων и нравственно-правовой характер отдельных неправедных поступков.
theological_decisions:
- issue: Передача τῇ οὐρανίᾳ δίκῃ в контексте высшего нравственного суда
  choice: небесной справедливости
  alternative: небесного суда; Божьей справедливости
  rationale: Выбранный вариант сохраняет абстрактно-персонифицированный смысл δίκη и связь с небом, не называя Бога прямо и не сводя понятие справедливости к судебному акту.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным нравственно-судебным звучанием. Порядок слов сделан естественным для русской речи; сохранены добровольность поступка говорящего и сдержанная формулировка о небесной справедливости.
