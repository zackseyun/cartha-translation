  yaml_path: translation/deuterocanon/4_maccabees/010/013.yaml
  text: Do not be as insane as your brothers with the same madness, but be persuaded by the king and save yourself.
translation:
  language: ru
  text: Не впадай и ты в то же безумие, что и твои братья, но послушайся царя и спаси себя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ μανῇς … τὴν αὐτὴν μανίαν
  choice: Не впадай … в то же безумие
  rationale: Греческий текст сочетает однокоренные слова со значением «обезуметь / безумие». По-русски буквальное воспроизведение было бы тяжеловесным, поэтому выбран естественный оборот, сохраняющий смысл и выразительность.
- source_word: καὶ σὺ τοῖς ἀδελφοῖς σου
  choice: и ты … что и твои братья
  rationale: Передаёт присоединительное καὶ σὺ («и ты») и сопоставление с братьями, выраженное дательным оборотом.
- source_word: πεισθεὶς τῷ βασιλεῖ
  choice: послушайся царя
  rationale: В данном контексте πείθομαι с дательным означает подчиниться убеждению или требованию царя; «послушайся» естественно передаёт этот призыв, не добавляя мотивов.
- source_word: σῶζε σεαυτόν
  choice: спаси себя
  rationale: Сохраняет прямой повелительный смысл и возвратное местоимение греческого текста.
theological_decisions:
- issue: Смысл глагола σῴζω в обращении мучителя
  choice: спаси себя
  alternative: сохрани себе жизнь
  rationale: Оставлена более широкая и формально близкая формулировка. Контекст допускает понимание физического спасения от смерти, но сам стих не уточняет это выражением «жизнь».
translation_notes:
  register: Современный литературный русский язык; реплика звучит резко и убедительно, как обращение гонителя, при этом сохранены повторная идея безумия и прямой призыв подчиниться царю.
