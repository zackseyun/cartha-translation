  text: But he cried out and said[a], “Do you not know that the same father sowed me among those who die, and the same mother gave birth to me, and I was brought up in the same principles?”
translation:
  language: ru
  text: 'А он громко воскликнул: «Разве вы не знаете, что тот же отец посеял меня вместе с теми, кто умер[a], та же мать родила меня и я был воспитан в тех же убеждениях?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посеял меня вместе с умершими». Греческий текст сохраняет земледельческий образ человеческого порождения; в данном контексте речь, вероятно, идёт об уже умерших братьях.'
    reason: Поясняет намеренно необычную метафору и точно отражает аористную форму греческого причастия без внесения неподтверждённой альтернативы.
lexical_decisions:
- source_word: ἀναβοήσας
  choice: громко воскликнул
  rationale: Передаёт сильный, громкий возглас и естественно объединяет греческое причастие с глаголом речи ἔφη.
- source_word: ἀγνοεῖτε
  choice: разве вы не знаете
  rationale: Сохраняет риторический вопрос и укор, не прибегая к неестественному для современного русского выражению «неужели вы не ведаете».
- source_word: ἔσπειρεν
  choice: посеял меня
  rationale: Сохраняет намеренную земледельческую метафору зачатия, присутствующую в греческом тексте.
- source_word: τοῖς ἀποθανοῦσιν
  choice: вместе с теми, кто уже умер
  rationale: Аористное причастие естественно указывает на уже умерших братьев; дательный падеж при ἔσπειρεν передан как совместность.
- source_word: αὐτός ... πατήρ / ἡ αὐτὴ μήτηρ
  choice: тот же отец / та же мать
  rationale: Подчёркивает общее происхождение говорящего и его братьев.
- source_word: ἐγέννησεν
  choice: родила меня
  rationale: Прямой и естественный современный эквивалент, сохраняющий материнский оттенок действия.
- source_word: ἀνετράφην
  choice: я был воспитан
  rationale: Передаёт пассивную форму и смысл общего воспитания.
- source_word: δόγμασιν
  choice: убеждениях
  rationale: В контексте речь идёт о сформировавших братьев нравственно-религиозных принципах; «убеждения» звучит естественно и не сужает смысл до официальных постановлений.
theological_decisions:
- issue: Образ зачатия в ἔσπειρεν
  choice: 'Сохранить метафору: «посеял меня».'
  alternative: «зачал меня» или «породил меня»
  rationale: Буквальный образ общего отцовского происхождения значим для риторики стиха; его устранение неоправданно сгладило бы греческий текст.
- issue: Кого обозначает τοῖς ἀποθανοῦσιν
  choice: 'Уже умерших братьев: «теми, кто уже умер».'
  alternative: «теми, кому суждено умереть» или «смертными»
  rationale: Аористное причастие в ближайшем повествовательном контексте лучше всего относится к братьям, уже принявшим смерть. В сноске отмечена возможная более общая трактовка без внесения догматического вывода.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной речью. Риторическая напряжённость сохранена без архаизмов; необычная метафора оригинала оставлена в основном тексте и пояснена в сноске.
