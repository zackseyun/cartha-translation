  yaml_path: translation/deuterocanon/4_maccabees/010/004.yaml
  text: In response to this[a], if you have any instrument of punishment, bring it against my body; for my soul, even if you wish it[b], you will not touch.
translation:
  language: ru
  text: 'В ответ на это: если у вас есть какое-нибудь орудие наказания[a], примените его к моему телу; ведь моей души[b] вы не коснётесь, даже если захотите.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «средство наказания» или «орудие пытки»; греческое слово обозначает орудие или средство, применяемое для наказания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «жизни»; греческое слово ψυχή может означать как «душу», так и «жизнь», но здесь «душа» яснее противопоставлена телу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: В ответ на это
  rationale: Естественно передаёт оборот, вводящий ответ говорящего на предшествующие слова или действия.
- source_word: εἴ τι ἔχετε κολαστήριον
  choice: если у вас есть какое-нибудь орудие пытки
  rationale: κολαστήριον обозначает конкретное средство или орудие наказания; в контексте мученичества «орудие пытки» звучит ясно и не уточняет вид приспособления сверх греческого текста.
- source_word: προσαγάγετε τῷ σώματί μου
  choice: примените его к моему телу
  rationale: Императив требует пустить орудие в ход против тела; «примените» по-русски естественнее буквального «подведите» и сохраняет направленность действия.
- source_word: τῆς γὰρ ψυχῆς μου
  choice: ведь моей души
  rationale: «Душа» сохраняет явное противопоставление σώμα и ψυχή, хотя ψυχή может также означать жизнь.
- source_word: οὐδʼ ἂν θέλητε, ἅψεσθε
  choice: вы не коснётесь, даже если захотите
  rationale: 'Передаёт отрицание и уступительный оттенок: желание мучителей не позволит им достичь души.'
theological_decisions:
- issue: Значение ψυχή в противопоставлении σώμα
  choice: душа
  alternative: жизнь
  rationale: Контраст с телом указывает на антропологическое противопоставление «тело — душа». Сноска сохраняет допустимое лексическое значение «жизнь», не снимая напряжения текста.
