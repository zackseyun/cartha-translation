lexical_decisions:
- source_word: νῦν
  choice: теперь
  rationale: Передаёт временной и дискурсивный переход к непосредственному, обличительному выводу.
- source_word: ἰδὲ
  choice: взгляни
  rationale: Императив, призывающий обратить внимание; «взгляни» естественно звучит в современном литературном русском и сохраняет прямоту обращения.
- source_word: ἀλλότριος ὢν θεοῦ
  choice: будучи чуждым Богу
  rationale: Сохраняет причастную конструкцию и значение отчуждённости, непринадлежности Богу, не сводя его к этнической или метафизической характеристике.
- source_word: πολεμεῖς
  choice: ты воюешь
  rationale: Передаёт яркий образ активной вражды и настоящее время греческого глагола.
- source_word: τοὺς εὐσεβοῦντας
  choice: с теми, кто благоговейно чтит
  rationale: Глагольная передача причастия сохраняет значение деятельного благочестия и избегает отвлечённого ярлыка «благочестивые».
- source_word: εἰς τὸν θεόν
  choice: Бога
  rationale: В русском языке направление благоговения естественно выражается прямым дополнением при глаголе «чтить».
theological_decisions:
- issue: Смысл ἀλλότριος θεοῦ
  choice: будучи чуждым Богу
  alternative: будучи отчуждённым от Бога
  rationale: «Чуждым Богу» ближе к греческому значению непринадлежности и сохраняет богословскую напряжённость, не утверждая сверх текста причину или способ отчуждения.
- issue: Характер εὐσεβοῦντας εἰς τὸν θεόν
  choice: те, кто благоговейно чтит Бога
  alternative: благочестивые перед Богом
  rationale: Выбранная формулировка сохраняет направленное к Богу благоговейное действие, не сужая значение до конкретного обряда поклонения.
translation_notes:
  register: Современный литературный русский с торжественной, но не архаичной интонацией. Прямое обращение и образ войны сохранены; двоеточие подчёркивает обличительный вывод. Формулировка «благоговейно чтит Бога» понятна широкому читателю и отражает деятельный характер греческого причастия.
