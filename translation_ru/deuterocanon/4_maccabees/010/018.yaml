lexical_decisions:
- source_word: Κἂν ἀφέλῃς
  choice: Даже если ты отнимешь
  rationale: Κἂν (καὶ ἐάν) вводит уступительное условие, а ἀφέλῃς означает лишение или отнятие; эта формулировка естественна по-русски и сохраняет силу греческого выражения.
- source_word: τὸ τῆς φωνῆς ὄργανον
  choice: орудие голоса
  rationale: ὄργανον буквально означает «орудие, инструмент», а родительный τῆς φωνῆς — «голоса». Буквальный образ сохранён, но конкретный телесный орган намеренно не назван.
- source_word: σιωπώντων
  choice: молчащих
  rationale: Субстантивированное причастие настоящего времени передаёт людей, которые молчат; «молчащих» кратко и естественно сохраняет это значение.
- source_word: ἀκούει
  choice: слышит и молчащих
  rationale: 'Глагол ἀκούει управляет здесь родительным падежом. Частица «и» передаёт καί и подчёркивает парадокс: Бог слышит также тех, кто не говорит вслух.'
- source_word: ὁ θεός
  choice: Бог
  rationale: Стандартная русская передача подлежащего без добавления отсутствующих в греческом уточнений.
theological_decisions:
- issue: Говорится ли о том, что Бог слышит молчащих людей, или непосредственно о неслышной молитве
  choice: Бог слышит и молчащих
  alternative: Бог слышит и безмолвные молитвы
  rationale: В греческом тексте названы «молчащие» (σιωπώντων), а не молитвы. Перевод не превращает подразумеваемую мысль о неслышной молитве в прямое утверждение текста.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим речи мученика. Метафора «орудие голоса» сохранена ради образности и точности; её вероятный телесный смысл пояснён в сноске.
