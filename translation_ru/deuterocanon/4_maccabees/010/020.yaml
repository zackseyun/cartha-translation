  text: For the sake of God[a], we gladly have the limbs of our body mutilated.
translation:
  language: ru
  text: Ради Бога[a] мы охотно подвергаемся отсечению частей нашего тела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «За Бога мы охотно подвергаемся отсечению частей тела».'
    reason: Лексико-синтаксический вариант передачи ὑπὲρ τοῦ θεοῦ и греческой пассивной конструкции.
lexical_decisions:
- source_word: ἡδέως
  choice: охотно
  rationale: Наречие выражает добровольную, решительную готовность. «Охотно» естественно по-русски и, в отличие от «с радостью» или «с удовольствием», не придаёт мучению неуместного оттенка наслаждения.
- source_word: ὑπὲρ τοῦ θεοῦ
  choice: ради Бога
  rationale: Ὑπέρ с родительным здесь указывает на основание и цель страдания — верность Богу. «Ради Бога» сохраняет эту направленность и не предполагает заместительного действия от имени Бога.
- source_word: τὰ τοῦ σώματος μέλη
  choice: частей нашего тела
  rationale: Μέλη обозначает члены или части тела. В данном контексте «части тела» звучит современно и охватывает конечности и иные телесные части, не сужая значение до одних рук и ног.
- source_word: ἀκρωτηριαζόμεθα
  choice: терпим отсечение
  rationale: Пассивная форма обозначает совершаемое над говорящими увечье или отсечение частей тела. Конструкция «терпим отсечение» сохраняет пассивный смысл и добровольное принятие страдания, не утверждая, будто они сами себя калечат.
theological_decisions:
- issue: Страдание мучеников ради Бога
  choice: ради Бога
  alternative: за Бога; во имя Бога
  rationale: Формулировка передаёт страдание из верности Богу, не вводя идею заместительной жертвы или действия как представителя Бога.
- issue: Добровольность и положительное отношение к мучению
  choice: охотно терпим
  alternative: с радостью подвергаемся; с удовольствием терпим
  rationale: Греческое ἡδέως выражает положительную готовность, однако русский вариант не должен создавать впечатление наслаждения телесной пыткой. «Охотно терпим» сохраняет напряжение между добровольностью и страданием.
translation_notes:
  register: Современный литературный русский язык с достоинством мученической речи. Формулировка ясна обычному читателю, сохраняет телесную конкретность оригинала и не смягчает жестокость происходящего.
