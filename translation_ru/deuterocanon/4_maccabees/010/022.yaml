  text: I am not about to refuse[a], tyrant, the torture for the sake of virtue.
translation:
  language: ru
  text: «Я не собираюсь, тиран, отказываться[a] от пытки ради добродетели».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я не стану, тиран, уклоняться от пытки ради добродетели».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ μέλλω
  choice: Я не намерен
  rationale: Сочетание μέλλω с инфинитивом может обозначать намерение или ближайшее действие; здесь отрицательная форма передаёт твёрдое решение говорящего не отступать.
- source_word: τύραννε
  choice: тиран
  rationale: Звательная форма прямо и с осуждением обращена к правителю-преследователю; «тиран» — точный и естественный русский эквивалент.
- source_word: πρὸς τὸν ... βασανισμόν
  choice: от пытки
  rationale: βασανισμός обозначает пытку или мучение, а конструкция с πρὸς при глаголе отказа естественно передаётся по-русски сочетанием «уклоняться от пытки».
- source_word: ὑπὲρ τῆς ἀρετῆς
  choice: ради добродетели
  rationale: ὑπέρ указывает на основание или цель страдания, а ἀρετή — на нравственную добродетель; «ради добродетели» сохраняет сжатость и смысл оригинала.
- source_word: παραιτεῖσθαι
  choice: уклоняться
  rationale: Средний инфинитив допускает значения «отказываться», «уклоняться». В контексте предстоящей пытки «уклоняться» естественно выражает нежелание избежать назначенного испытания, не подразумевая, что пытка была добровольно предложена.
