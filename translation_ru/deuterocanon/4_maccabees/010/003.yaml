  text: Я не отрекусь от благородных уз братства[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я не отрекусь от благородных братских уз».'
    reason: Лексико-смысловая альтернатива для сочетания συγγένεια τῆς ἀδελφότητος; «братские узы» яснее выражает семейно-братский характер связи.
lexical_decisions:
- source_word: οὐκ ἐξόμνυμαι
  choice: я не отрекусь
  rationale: Передаёт решительный отказ отречься или отказаться от родственной связи; русское «отрекусь» естественно сохраняет оттенок открытого repudiation, не навязывая буквальную формулу клятвы.
- source_word: τὴν ... συγγένειαν
  choice: узы
  rationale: В сочетании с родительным «братства» слово «узы» естественно выражает родственную связь; буквальное «родство братства» по-русски тяжеловесно и тавтологично.
- source_word: εὐγενῆ
  choice: благородных
  rationale: Сохраняет возможные оттенки достоинства и благородного происхождения, присущие εὐγενής.
- source_word: τῆς ἀδελφότητος
  choice: братства
  rationale: В данном семейном контексте обозначает общность и связь братьев, а не отвлечённое товарищество; родительный падеж сохраняет структуру греческого выражения в естественной русской форме.
theological_decisions:
- issue: Родовое и семейное значение ἀδελφότης
  choice: братства
  alternative: братских уз / общности братьев и сестёр
  rationale: Сохранён мужской семейный термин исходного текста без искусственной нейтрализации. При этом сноска отмечает возможное более широкое понимание связи между детьми одной семьи.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формулировкой. «Отрекусь» соответствует ситуации мученического исповедания; «благородные узы» сохраняют достоинство и родственный смысл оригинала.
