  yaml_path: translation/deuterocanon/4_maccabees/010/021.yaml
  text: But God will swiftly pursue you[a], for you are cutting out the tongue that sings the melodies of divine hymns.
translation:
  language: ru
  text: Но Бог скоро настигнет тебя[a], ведь ты вырезаешь язык, воспевающий священные гимны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог быстро придёт за тобой»; по смыслу также: «Бог скоро накажет тебя». Греческий глагол означает «идти следом, преследовать»; здесь это образ Божьего суда.'
    reason: alternative_reading
lexical_decisions:
- source_word: ταχέως
  choice: скоро
  rationale: Наречие передаёт быстроту Божьего действия; в данном контексте возможно также значение «вскоре», однако «скоро» естественно сохраняет обе стороны оттенка.
- source_word: μετελεύσεται
  choice: настигнет
  rationale: Средняя форма μετέρχομαι означает «идти следом, преследовать». «Настигнет» сохраняет образ направленного против гонителя Божьего действия и подразумеваемого суда, не сводя его прямо к слову «накажет».
- source_word: ὁ θεός
  choice: Бог
  rationale: Прямое соответствие греческому обозначению субъекта.
- source_word: τὴν ... γλῶτταν
  choice: язык
  rationale: Сохраняется конкретное обозначение физического органа, существенное для сцены мучения.
- source_word: τῶν θείων ὕμνων
  choice: священные гимны
  rationale: θείων здесь характеризует гимны как относящиеся к Богу и святыне; «священные» звучит естественно и возвышенно в современном русском языке.
- source_word: μελῳδόν
  choice: воспевающий
  rationale: Слово характеризует язык как производящий мелодическое пение. Причастие передаёт этот смысл естественно, хотя музыкальный оттенок выражен менее буквально.
- source_word: ἐκτέμνεις
  choice: вырезаешь
  rationale: Настоящее время и конкретный глагол сохраняют непосредственность и жестокость происходящего.
theological_decisions:
- issue: Характер Божьего воздаяния в μετελεύσεται ὁ θεός
  choice: Бог скоро настигнет гонителя
  alternative: Бог скоро накажет тебя / Бог скоро придёт за тобой
  rationale: Контекст подразумевает Божий суд, но греческий глагол рисует Бога идущим вслед за гонителем. «Настигнет» удерживает этот образ и не заменяет его абстрактным указанием на наказание.
translation_notes:
  register: Современный литературный русский язык с достоинством и непосредственностью мученической речи. Синтаксис краткий и угрожающе торжественный; телесная конкретность оригинала сохранена.
