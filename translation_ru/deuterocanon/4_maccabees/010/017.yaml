  text: When bloodthirsty and murderous and most savage Antiochus heard these things[a], he ordered his tongue to be cut out.
translation:
  language: ru
  text: Услышав это, кровожадный, склонный к убийству и свирепейший Антиох[a] приказал вырезать ему язык.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Редкое греческое прилагательное в превосходной степени можно также перевести: «жесточайший» или «самый свирепый».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: это
  rationale: Форма среднего рода множественного числа отсылает к сказанному ранее; в современном русском собирательное «это» естественно сохраняет широкий референс.
- source_word: ἀκούσας
  choice: услышав
  rationale: Деепричастие передаёт предшествующее действие аористного причастия и сохраняет компактность греческой фразы.
- source_word: αἱμοβόρος
  choice: кровожадный
  rationale: Естественный современный эквивалент яркого сложного прилагательного, характеризующего тягу к кровопролитию.
- source_word: φονώδης
  choice: склонный к убийству
  rationale: Передаёт характеристику убийственного нрава и не сливается по смыслу с соседним «кровожадный».
- source_word: πανμμερώτατος
  choice: свирепейший
  rationale: Сохраняет форму превосходной степени редкого усилительного прилагательного и кульминацию ряда обличительных эпитетов.
- source_word: ἐκέλευσεν
  choice: приказал
  rationale: Прямой и естественный эквивалент глагола распоряжения в повествовательном контексте.
- source_word: τὴν γλῶτταν αὐτοῦ
  choice: ему язык
  rationale: Русская конструкция с дательным лицом естественно и недвусмысленно указывает, что речь идёт о языке жертвы, а не Антиоха.
- source_word: ἐκτεμεῖν
  choice: вырезать
  rationale: Передаёт значение удаления посредством отсечения; неопределённо-личный исполнитель подразумевается после глагола «приказал».
