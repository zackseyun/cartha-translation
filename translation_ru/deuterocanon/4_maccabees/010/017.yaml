  source_fidelity: 'Текст точно передаёт последовательность греческого оригинала: χρονологическое причастие ἀκούσας («Услышав»), три нарастающих уничижительных эпитета, распоряжение ἐκέλευσεν и отсечение языка. «Это» уместно сохраняет широкий отсылочный характер ταῦτα. Конструкция «приказал вырезать ему язык» естественно передаёт подразумеваемое исполнение приказа над говорившим ранее человеком; она также избегает ложного впечатления, будто Антиох велел отсечь язык самому себе.'
