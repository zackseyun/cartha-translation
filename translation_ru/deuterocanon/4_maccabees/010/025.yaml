  yaml_path: translation/deuterocanon/4_maccabees/010/025.yaml
  text: Or does it not seem evil to you that we worship the Creator of all and live according to his virtuous law?[a]
translation:
  language: ru
  text: Или вам не кажется злом то, что мы почитаем Творца всего и живём по Его добродетельному закону?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Или не кажется злом то, что…?» В греческом тексте слово «вам» прямо не выражено; риторический вопрос оспаривает нравственную оценку противников.'
    reason: Сохранение синтаксической неоднозначности и риторической силы греческого текста.
lexical_decisions:
- source_word: κακὸν
  choice: злом
  rationale: Передаёт нравственно отрицательную оценку и сохраняет силу риторического вопроса.
- source_word: οὐ δοκεῖ
  choice: не кажется
  rationale: Сохраняет значение суждения или восприятия, не превращая вопрос в прямое утверждение.
- source_word: τὸν πάντων κτίστην
  choice: Творца всего
  rationale: Кратко и точно передаёт κτίστης и родительный πάντων; прописная буква естественна при обозначении Бога.
- source_word: εὐσεβοῦμεν
  choice: почитаем
  rationale: Передаёт благоговейное религиозное отношение к Богу; в данном контексте звучит естественнее буквального «благочестивы по отношению к».
- source_word: κατὰ
  choice: по
  rationale: Естественно выражает соответствие норме или образцу в сочетании «жить по закону».
- source_word: τὸν ἔναρετον αὐτοῦ νόμον
  choice: Его добродетельному закону
  rationale: Сохраняет явно выраженную нравственную характеристику закона в прилагательном ἔναρετος.
- source_word: ζῶμεν
  choice: живём
  rationale: Передаёт образ жизни, определяемый законом, без ненужного расширения.
theological_decisions:
- issue: Адресат и смысл риторического вопроса
  choice: 'В основном тексте подразумеваемый адресат выражен словом «вам»: говорящий спрашивает, считается ли злом почитание Творца и жизнь по Его закону.'
  alternative: 'Оставить адресата невыраженным: «Или не кажется злом то, что…?»'
  rationale: В греческом нет явного местоимения второго лица, однако контекст полемического вопроса подразумевает оценку противников. Слово «вам» делает русский вопрос естественным, а сноска сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Формулировка ясна обычному читателю; риторическая напряжённость оригинала сохранена. Местоимение «Его» написано с прописной буквы в соответствии с традиционной русской религиозной орфографией.
