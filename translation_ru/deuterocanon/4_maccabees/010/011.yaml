lexical_decisions:
- source_word: ἀσέβειαν
  choice: нечестие
  rationale: Передаёт религиозно-нравственный смысл непочтительности и противления Богу; в данном торжественном контексте естественнее и точнее, чем более отвлечённое «безбожие».
- source_word: μιαιφονίαν
  choice: осквернение кровопролитием
  rationale: 'Сохраняет обе составляющие греческого слова: пролитие крови и вызванное им нравственное или религиозное осквернение. Одно слово «убийство» не передало бы оттенка скверны.'
- source_word: ἀκαταλύτους
  choice: нескончаемые
  rationale: Передаёт значение того, что не прекращается и не приходит к концу, не смещая акцент исключительно на силу мучений.
- source_word: καρτερήσεις
  choice: будешь терпеть
  rationale: Сохраняет будущее время и основное значение стойкого перенесения страдания; по-русски сочетание с «муки» звучит естественно.
- source_word: βασάνους
  choice: муки
  rationale: Выражает тяжёлые мучительные страдания, не сужая смысл до конкретной процедуры физической пытки.
theological_decisions:
- issue: Религиозно-нравственный характер обвинения правителю
  choice: «нечестие и осквернение кровопролитием»
  alternative: «безбожие и убийства»; «нечестие и кровожадность»
  rationale: Так сохраняются и направленное против Бога нечестие, и оскверняющий характер пролития крови, заложенный в греческом тексте, без сведения обвинения только к уголовному насилию.
- issue: Продолжительность мучений
  choice: «нескончаемые муки»
  alternative: «непрестанные муки»; «неослабевающие муки»
  rationale: Греческое ἀκαταλύτους допускает смысл того, что не прекращается или не может быть положено конец. «Нескончаемые» ясно передаёт продолжительность, не добавляя догматического объяснения природы наказания.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной лексикой. Начальное «А ты» передаёт подчёркнутое σὺ и противопоставление в контексте; порядок слов сохраняет прямое обвинительное обращение.
