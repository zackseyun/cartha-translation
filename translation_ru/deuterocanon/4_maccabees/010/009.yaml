lexical_decisions:
- source_word: μέλλων
  choice: умирая
  rationale: В сочетании с инфинитивом обозначает приближение смерти; русская деепричастная конструкция естественно передаёт обстоятельственный характер греческого причастия.
- source_word: ἀποθνήσκειν
  choice: умирая
  rationale: Глагол означает «умирать». Хотя контекст говорит о мученической казни, сама фраза не называет действующее лицо, поэтому перевод не уточняет «когда его предавали смерти».
- source_word: ἔφη
  choice: он сказал
  rationale: Обычная формула введения прямой речи; нейтральный и естественный русский эквивалент.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Частица слегка продвигает повествование и не обозначает сильного противопоставления; в краткой русской вводной формуле отдельный союз звучал бы тяжеловесно.
