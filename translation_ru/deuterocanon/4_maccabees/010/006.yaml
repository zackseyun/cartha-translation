lexical_decisions:
- source_word: περίειλκον
  choice: отрывали
  rationale: Имперфект передаёт продолжающееся или последовательное насильственное действие; «отрывали» естественно выражает принудительное отделение частей тела в сцене пытки, не уточняя способ сверх сказанного в греческом.
- source_word: δακτύλους
  choice: пальцы
  rationale: Обычное анатомическое значение; контекст не требует уточнять, пальцы рук или ног.
- source_word: βραχίονας
  choice: руки
  rationale: Греческое слово обозначает руку или её часть; общеупотребительное «руки» сохраняет естественность и не вводит излишней анатомической точности.
- source_word: σκέλη
  choice: ноги
  rationale: Прямой и естественный русский эквивалент в данном контексте.
- source_word: ἀγκῶνας
  choice: локти
  rationale: Основное значение — локти, то есть сгибы или суставы рук; сохранён прямой анатомический образ греческого текста.
