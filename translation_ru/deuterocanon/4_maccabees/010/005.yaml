  text: But bitterly resenting the man's boldness[a], they dislocated his hands and feet with joint-wrenching instruments, and prying them out of their sockets[b], they dismembered him.
translation:
  language: ru
  text: Они же, озлобившись на смелость этого человека[a], орудиями для выворачивания суставов вывихивали ему руки и ноги и, выламывая их из суставов[b], расчленяли его.
