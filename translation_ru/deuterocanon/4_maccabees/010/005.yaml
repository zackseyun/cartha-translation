lexical_decisions:
- source_word: πικρῶς ἐνέγκαντες
  choice: озлобившись из-за
  rationale: Сочетание буквально говорит о том, что мучители «с горечью перенесли» смелость мученика; в контексте оно выражает их ожесточённую, враждебную реакцию. Русское «озлобившись из-за» передаёт эту реакцию естественно, а буквальный образ сохраняется в примечании.
- source_word: παρρησίαν τοῦ ἀνδρός
  choice: смелых речей этого человека
  rationale: παρρησία обозначает смелую, открытую речь и бесстрашие говорящего. Выражение «смелые речи» сохраняет речевой оттенок, который могло бы утратить общее слово «смелость».
- source_word: ἀρθρεμβόλοις ὀργάνοις
  choice: орудиями для выворачивания суставов
  rationale: Редкое сложное слово описывает орудия, воздействующие на суставы. Описательный перевод понятен современному читателю и сохраняет жестокую конкретность греческого текста.
- source_word: ἐξήρθρουν
  choice: вывихивали
  rationale: Глагол означает выводить из сустава, вывихивать. Несовершенный вид передаёт греческий имперфект и длительный характер истязания.
- source_word: τὰς χεῖρας αὐτοῦ καὶ τοὺς πόδας
  choice: ему руки и ноги
  rationale: Обычные русские названия частей тела естественнее буквального «кисти и ступни»; дательный оборот «ему» ясно передаёт принадлежность.
- source_word: ἐξ ἁρμῶν ἀναμοχλεύοντες
  choice: выламывая их из суставов
  rationale: ἀναμοχλεύω передаёт действие рычагом — силой поддевать или выворачивать, а ἁρμοί здесь означает суставные соединения. «Выламывая» сохраняет механическую жестокость образа без добавления нового орудия.
- source_word: ἐξέμελιζον
  choice: расчленяли его
  rationale: Редкий глагол буквально связан с вырыванием от основания и в данном контексте означает разрывание тела, отделение конечностей. «Расчленяли его» естественно и передаёт результат действия, не ограничивая значение только одной конкретной анатомической процедурой.
theological_decisions:
- issue: Степень конкретности изображения мучения
  choice: Сохранить прямое упоминание вывихивания, выламывания из суставов и расчленения
  alternative: Смягчить описание общими словами «истязали» или «увечили»
  rationale: Греческий текст намеренно и подробно изображает телесное насилие. Смягчение устранило бы существенную часть повествовательного и богословского изображения стойкости мученика.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим повествованию о мученичестве. Синтаксис сохраняет последовательность греческих причастных конструкций, но не становится тяжеловесным. Насилие передано прямо, без эвфемизмов и без усиления сверх исходного текста.
