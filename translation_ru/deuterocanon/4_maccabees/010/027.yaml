translation:
  language: ru
  text: Если бы ты и вправду испытывал человеческие чувства[a] и надеялся на избавление[b] от Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человеческие стремления»; «человеческие привязанности». Греческое выражение сжато и указывает на обычные человеческие чувства и привязанности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «спасение». Греческое слово может обозначать как избавление в непосредственной опасности, так и спасение в более широком смысле.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἴπερ
  choice: если бы… и вправду
  rationale: Передаёт усиленное условие и его риторическую силу, не превращая условие в утверждение причины.
- source_word: ἠσθάνου
  choice: понимал
  rationale: В сочетании с обозначением человеческих привязанностей глагол говорит не просто о чувственном восприятии, а о понимании и признании естественных человеческих чувств.
- source_word: ἀνθρώπους πόθων
  choice: человеческие привязанности
  rationale: Греческое выражение сжато и необычно; перевод передаёт обращение к обычной человеческой эмоциональной привязанности, не сужая πόθων до одного лишь желания.
- source_word: ἐλπίδα εἶχες
  choice: надеялся
  rationale: Естественная русская глагольная передача буквального «имел надежду», сохраняющая значение ожидания.
- source_word: παρὰ θεῷ
  choice: получить от Бога
  rationale: В данном контексте надежда направлена на помощь, исходящую от Бога; такая формулировка естественно передаёт отношение, выраженное παρά с дательным.
- source_word: σωτηρίου
  choice: избавление
  rationale: Слово допускает как непосредственное избавление, так и более широкое спасение; ближайший контекст страдания поддерживает «избавление».
theological_decisions:
- issue: Значение σωτηρίου в повествовании о мученичестве
  choice: избавление
  alternative: спасение
  rationale: «Избавление» лучше соответствует непосредственной угрозе страданий и смерти, однако примечание сохраняет более широкую возможность «спасение».
translation_notes:
  register: Современный литературный русский язык с достоинством риторического обращения. Условная конструкция сохранена; буквальное «имел надежду» естественно передано глаголом «надеялся».
