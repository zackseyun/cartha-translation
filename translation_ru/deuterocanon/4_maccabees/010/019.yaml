base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/010/019.yaml
  text: Look[a], my tongue has been broken; cut it off[b]. For not even by this will you cut out our reasoned judgment.
translation:
  language: ru
  text: Вот, мой язык уже сломан; отсеки его. Ведь и этим ты не отсечёшь наше разумное суждение[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наше». Множественное число сохраняет греческое ἡμῶν; оно может выражать единство говорящего с его братьями, хотя непосредственно говорит один человек.'
    reason: alternative_reading
  - marker: b
    text: 'Греческий глагол буквально связан с отсечением языка. Здесь этот образ перенесён на «разумное суждение»: телесное увечье не может уничтожить его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: вот
  rationale: Естественное современное указательное восклицание, прямо привлекающее внимание к языку говорящего.
- source_word: κέχλασται
  choice: уже свисает
  rationale: Форма описывает язык как ослабевший, повисший или выдавшийся наружу; такое значение лучше согласуется с редкой греческой формой, чем предложенное в английском слое «сломлен».
- source_word: ἡ γλῶσσα
  choice: мой язык
  rationale: В греческом стоит определённый артикль без притяжательного местоимения, но по-русски принадлежность говорящему в данном контексте естественно выражается словом «мой».
- source_word: τέμνε
  choice: отсеки его
  rationale: Повеление обращено к мучителю; подразумеваемый объект — только что названный язык. «Отсеки» передаёт завершённое насильственное действие.
- source_word: οὐ γὰρ παρὰ τοῦτο
  choice: но и этим ты не
  rationale: Оборот указывает, что даже такое действие не достигнет цели. Русское «но и этим» естественно передаёт противопоставление и усиление.
- source_word: τὸν λογισμὸν
  choice: разумную решимость
  rationale: В 4 Маккавейской книге λογισμός обозначает не только способность мыслить, но и основанную на разуме нравственную стойкость. Сочетание сохраняет обе стороны смысла.
- source_word: ἡμῶν
  choice: нашу
  rationale: 'Сохранено чтение первого лица множественного числа: мученик говорит о разделяемой с братьями разумной решимости.'
- source_word: γλωσσοτομήσεις
  choice: не отсечёшь
  rationale: Составной глагол буквально связан с отсечением языка и здесь переносно относится к λογισμός. Повтор «отсеки — не отсечёшь» удерживает телесный образ и риторическую остроту.
theological_decisions:
- issue: Смысл λογισμός в философско-богословском строе 4 Маккавейской книги
  choice: разумная решимость
  alternative: разум; рассудок; разумное суждение
  rationale: Перевод не сводит слово ни к отвлечённому интеллекту, ни к одной лишь силе воли, а сохраняет характерную для книги связь разумного суждения с нравственной стойкостью.
- issue: Множественное число ἡμῶν при речи одного мученика
  choice: нашу
  alternative: мою
  rationale: Перевод следует засвидетельствованному греческому тексту и сохраняет возможную солидарность говорящего с братьями, не исправляя множественное число по ближайшему контексту.
- issue: Телесная метафора γλωσσοτομήσεις
  choice: не отсечёшь нашу разумную решимость
  alternative: не заставишь умолкнуть нашу разумную решимость
  rationale: 'Более буквальный образ намеренно сохранён: увечье языка не может уничтожить внутреннюю разумную стойкость. Вариант «не заставишь умолкнуть» был бы понятнее, но ослабил бы словесную связь с отсечением языка.'
translation_notes:
  register: Современный литературный русский язык с краткой, вызывающей интонацией мученика. Повтор «отсеки — не отсечёшь» сохраняет риторическую игру греческого текста; необычность метафоры оставлена намеренно и пояснена в сноске.
