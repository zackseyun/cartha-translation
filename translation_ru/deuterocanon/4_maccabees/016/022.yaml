  text: So you also[a], having the same faith toward God[b], do not be distressed.
translation:
  language: ru
  text: Итак, и вы, имея такую же веру в Бога[a], не огорчайтесь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «такое же доверие к Богу». Греческое слово πίστις в зависимости от контекста может также означать доверие или верность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не озлобляйтесь»; «не раздражайтесь». Глагол может обозначать огорчение, раздражение или гнев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς οὖν
  choice: Итак, и вы
  rationale: Передаёт выводное οὖν, связующее καί и подчёркнутое ὑμεῖς естественным русским оборотом.
- source_word: τὴν αὐτὴν πίστιν
  choice: такую же веру
  rationale: Сохраняет указание на ту же веру, которую проявили упомянутые ранее мученики; «веру» здесь можно также понимать как доверие или верность.
- source_word: πρὸς τὸν θεόν
  choice: в Бога
  rationale: Греческое πρός обозначает направленность или отношение к Богу. Русское «вера в Бога» естественно выражает эту мысль, тогда как буквальное «вера к Богу» звучит ненормативно.
- source_word: ἔχοντες
  choice: имея
  rationale: Сохраняет обстоятельное причастие настоящего времени и связь между обладанием той же верой и последующим призывом.
- source_word: μὴ χαλεπαίνητε
  choice: не огорчайтесь
  rationale: χαλεπαίνω может описывать болезненную, раздражённую или ожесточённую реакцию. «Не огорчайтесь» подходит утешительно-наставительному контексту, не сводя значение только к гневу.
theological_decisions:
- issue: Значение πίστις
  choice: вера
  alternative: доверие; верность
  rationale: В контексте речь идёт об общей стойкой обращённости к Богу. «Вера» сохраняет широту и богословскую преемственность термина, а возможные оттенки доверия и верности отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык; наставительный и утешительный тон. Синтаксис по возможности сохраняет греческую причастную конструкцию, оставаясь естественным для широкого круга читателей.
