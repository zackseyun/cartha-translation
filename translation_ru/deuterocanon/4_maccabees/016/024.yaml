  text: By these words the mother of seven[a], encouraging each one of her sons, persuaded them rather to die than to transgress the commandment of God[b];
translation:
  language: ru
  text: Этими словами[a] мать семерых[b], ободряя каждого из своих сыновей, убедила их скорее умереть, чем преступить заповедь Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посредством этих слов». Греческое выражение указывает на средство или способ действия.'
