  - marker: b
    text: 'Буквально: «семиматерь», то есть женщина, ставшая матерью семерых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τούτων τῶν λόγων
  choice: Этими словами
  rationale: διά с родительным выражает средство; творительный падеж естественно передаёт инструментальное значение по-русски.
- source_word: ἡ ἑπτάμητωρ
  choice: мать семерых
  rationale: Редкое сложное слово обозначает женщину — мать семерых. Краткая передача сохраняет риторическую выразительность, а далее прямо упомянуты её сыновья.
- source_word: ἕνα ἕκαστον τῶν υἱῶν
  choice: каждого из своих сыновей
  rationale: Сочетание ἕνα ἕκαστον подчёркивает каждого сына в отдельности; «своих» естественно указывает на отношение к матери.
- source_word: παρακαλοῦσα
  choice: ободряя
  rationale: В контексте мать не только призывает сыновей, но и укрепляет их перед смертью; «ободряя» сохраняет этот смысл без излишнего уточнения.
- source_word: ἔπεισε
  choice: убедила их
  rationale: πείθω означает «убеждать»; местоимение «их» естественно восполняет подразумеваемое множественное дополнение.
- source_word: μᾶλλον ἀποθανεῖν, ἢ παραβῆναι
  choice: скорее умереть, чем преступить
  rationale: Сравнительная конструкция выражает предпочтение смерти нарушению заповеди; «преступить» сохраняет нравственно-правовую весомость исходного выражения.
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: заповедь Бога
  rationale: ἐντολή здесь естественно передаётся словом «заповедь», уместным в библейском контексте и не добавляющим конфессионального толкования.
theological_decisions:
- issue: Следует ли раскрывать ἑπτάμητωρ как «мать семерых сыновей»
  choice: мать семерых
  alternative: мать семерых сыновей
  rationale: Само сложное слово не содержит отдельного слова «сыновья»; оно появляется далее. Краткая формулировка сохраняет структуру и риторическую сжатость греческого текста.
- issue: Передача παραβῆναι τὴν ἐντολὴν τοῦ θεοῦ
  choice: преступить заповедь Бога
  alternative: нарушить Божью заповедь
  rationale: «Преступить» сохраняет торжественный нравственно-правовой оттенок, не внося дополнительного богословского содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис остаётся ясным для широкого читателя; слова «заповедь» и «преступить» сохраняют серьёзность контекста.
