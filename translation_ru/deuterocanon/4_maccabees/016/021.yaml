  yaml_path: translation/deuterocanon/4_maccabees/016/021.yaml
  text: And Daniel the righteous man was thrown to the lions[a]; and Hananiah and Azariah and Mishael were hurled into a furnace of fire[b], and they endured because of God.
translation:
  language: ru
  text: И праведный Даниил был брошен ко львам; и Анания, Азария и Мисаил[a] были ввергнуты в огненную печь[b] и выстояли ради Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Это еврейские имена трёх юношей, также известных под вавилонскими именами Седрах, Мисах и Авденаго.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «в печь огня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δίκαιος
  choice: праведный
  rationale: Субстантивированное определение служит эпитетом Даниила; «праведный» естественно передаёт нравственно-религиозный смысл δίκαιος.
- source_word: εἰς λέοντας
  choice: ко львам
  rationale: В сочетании с пассивной формой βάλλω речь идёт о том, что Даниила бросили львам. Русское «ко львам» звучит естественно и не добавляет отсутствующего в греческом тексте слова «ров».
- source_word: ἐβλήθη
  choice: был брошен
  rationale: Прямо и ясно передаёт аорист пассива от βάλλω.
- source_word: ἀπεσφενδονήθησαν
  choice: были швырнуты
  rationale: Глагол выражает более резкое и сильное движение, чем простое βάλλω; «швырнуты» сохраняет яркость и насильственный характер действия.
- source_word: εἰς κάμινον πυρὸς
  choice: в огненную печь
  rationale: Идиоматическое русское выражение передаёт оба элемента греческого словосочетания — печь и огонь; более буквальное «в печь огня» по-русски неестественно.
- source_word: ὑπέμειναν
  choice: выстояли
  rationale: Передаёт стойкое перенесение испытания и сохранение твёрдости, заложенные в ὑπομένω.
- source_word: διὰ τὸν θεόν
  choice: ради Бога
  rationale: 'Передаёт значение причины или побуждения: они выстояли из-за своей обращённости к Богу, ради Него. Формулировка сохраняет краткость и некоторую смысловую открытость греческого оборота.'
theological_decisions:
- issue: Имена трёх юношей
  choice: Анания, Азария и Мисаил
  alternative: Седрах, Мисах и Авденаго
  rationale: Греческий текст называет их еврейскими именами; перевод следует источнику, не подменяя их более известными в традиции вавилонскими именами.
- issue: Нравственно-религиозная характеристика Даниила словом δίκαιος
  choice: праведный
  alternative: справедливый
  rationale: В данном повествовательном контексте слово характеризует верность и угодность Богу, а не только беспристрастность в отношениях с людьми.
- issue: Причинно-мотивирующий оборот διὰ τὸν θεόν
  choice: ради Бога
  alternative: из-за Бога
  rationale: «Ради Бога» естественно выражает побуждение и преданность, не уточняя сверх текста, каким именно образом Бог был основанием их стойкости.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Сохранены параллельные конструкции и контраст между нейтральным «был брошен» и более сильным «были швырнуты».
