base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/014.yaml
  text: O mother, soldier of devotion to God, though old and a woman, by endurance you conquered even a tyrant, and in deeds and words you were found stronger than a man.
translation:
  language: ru
  text: О мать, воин, преданный Богу[a], хотя и старая, и женщина, ты стойкостью победила даже тирана и оказалась сильнее мужчины — и в делах, и в словах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воин благочестия»; греческое εὐσέβεια может означать благочестие, почитание или религиозную преданность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσέβειαν θεοῦ
  choice: благочестия пред Богом
  rationale: εὐσέβεια обозначает благочестие, почтение и преданность в религиозном отношении; сочетание с θεοῦ естественно передаётся как направленное к Богу благочестие. Предлог «пред» сохраняет достоинство стиля и не превращает выражение в обозначение свойства самого Бога.
- source_word: στρατιῶτι
  choice: воин
  rationale: Метафорическое обращение представляет мать участницей духовной борьбы. «Воин» естественнее для возвышенной русской прозы и сохраняет воинский образ.
- source_word: πρεσβῦτι καὶ γυνή
  choice: хотя ты была стара и была женщиной
  rationale: 'Дательный при приложении передан уступительно в соответствии с риторическим смыслом: победа одержана вопреки возрасту и воспринимаемой слабости пола. Повтор «была» делает координацию признаков ясной.'
- source_word: διὰ καρτερίαν
  choice: стойкостью
  rationale: καρτερία выражает твёрдую выдержку и стойкость в страдании; творительный падеж сохраняет инструментальное значение διά.
- source_word: καὶ τύραννον ἐνίκησας
  choice: ты победила даже тирана
  rationale: ἐνίκησας прямо означает победу; «даже» передаёт риторическое усиление καί перед объектом.
- source_word: ἔργοις δυνατωτέρα καὶ λόγοις
  choice: сильнее ... и в делах, и в словах
  rationale: Сохраняется параллелизм между делами и словами, а также сравнительное значение δυνατωτέρα.
- source_word: εὑρέθης ἂν ἀνδρός
  choice: оказалась сильнее мужчины
  rationale: «Оказалась» естественно передаёт εὑρέθης в значении выявленного на деле качества. Родительный ἀνδρός сохраняется как прямое сравнение с мужчиной; частица ἄν в данном контексте не требует отдельного русского соответствия.
theological_decisions:
- issue: Смысл εὐσέβεια и его направленность
  choice: «благочестие пред Богом»
  alternative: «преданность Богу»; «почитание Бога»
  rationale: «Благочестие» сохраняет широкий религиозно-нравственный объём слова, а «пред Богом» указывает его направленность, не сводя понятие лишь к внутреннему чувству или верности.
- issue: Гендерное сопоставление в конце стиха
  choice: Сохранить явное противопоставление женщины и мужчины
  alternative: Нейтрализовать как «сильнее любого человека»
  rationale: Греческий текст намеренно сопоставляет γυνή и ἀνήρ и строит на этом риторический парадокс; нейтрализация устранила бы существенную черту исходного высказывания.
- issue: Образ духовной борьбы
  choice: Сохранить метафору «воин»
  alternative: 'Передать описательно: «боровшаяся за благочестие»'
  rationale: Исходный текст прямо использует воинское наименование, поэтому образ не следует истолковывать или ослаблять.
translation_notes:
  register: Современный литературный русский с торжественной риторической интонацией. Обращение и воинская метафора сохранены; синтаксис слегка распрямлён ради ясности, без устранения гендерного контраста и смысловой широты εὐσέβεια.
