  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: мать метафорически названа воином благочестия, отмечены её возраст и женский пол, стойкость, победа над тираном и превосходство в делах и словах. Однако «пред Богом» не является естественной передачей генитива θεοῦ при εὐσέβεια и может означать «в Божьем присутствии», а не направленность благочестия к Богу.'
  naturalness: Фраза «воин благочестия пред Богом» тяжеловесна и семантически двусмысленна. «Хотя ты была стара и была женщиной» избыточно повторяет связку и звучит менее литературно. Более естественны «воин, преданный Богу» и «хотя и старая, и женщина».
  terminology: εὐσέβεια здесь следует передать как «преданность Богу» либо «благочестие перед Богом»; первый вариант в прямом обращении естественнее и яснее. «Тиран», «стойкостью», «дела и слова», а также явное сопоставление с мужчиной уместны и сохраняют риторику оригинала.
  issues:
  - severity: medium
    issue: Неудачное выражение «благочестия пред Богом»
    rationale: Греческое εὐσέβειαν θεοῦ означает благочестие/преданность, относящиеся к Богу. Русское «пред Богом» прежде всего локативно или судебно («перед Богом») и неясно выражает эту связь. Кроме того, после «воин благочестия» конструкция звучит неестественно.
  - severity: low
    issue: Повтор «была» в уступительной характеристике
    rationale: Повтор не требуется русским синтаксисом и ослабляет торжественную, но современную литературную речь. Сжатая конструкция сохраняет оба признака и уступительный смысл.
  revised_text: О мать, воин, преданный Богу[a], хотя и старая, и женщина, ты стойкостью победила даже тирана и оказалась сильнее мужчины — и в делах, и в словах.
