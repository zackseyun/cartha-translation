  verdict: revise
  source_fidelity: 'Основной синтаксический разбор в черновике верен: ἀλόγιστον относится к инфинитивному обороту μὴ ἀνθίστασθαι τοῖς πόνοις, а εἰδότας εὐσεβεῖν характеризует тех, о ком говорится. Однако «знает, что значит быть благочестивым» несколько расширяет εἰδότας εὐσεβεῖν; «знает, как жить благочестиво» передаёт сочетание точнее и естественнее. Альтернативное толкование в сноске («благочестие не лишено разума... они не отступали») не следует непосредственно из данной греческой конструкции и меняет синтаксические отношения.'
  naturalness: «Было бы неразумно тем, кто знает, как жить благочестиво, не противостоять страданиям» — современная литературная и ясная русская фраза. «Противостоять страданиям» здесь сохраняет образ ἀνθίστασθαι и по-русски означает стойко переносить их, а не уклоняться от них.
  terminology: «Жить благочестиво» точно передаёт εὐσεβεῖν без ненужного уточнения объекта благоговения. «Страдания» — уместная, не чрезмерно усиленная передача τοῖς πόνοις. «Неразумно» адекватно передаёт ἀλόγιστον.
