lexical_decisions:
- source_word: ἀλόγιστον
  choice: неразумно
  rationale: Передаёт значение «не согласующееся с разумом, безрассудно» и сохраняет характерную для 4 Маккавейской книги связь благочестия с разумом.
- source_word: εἰδότας εὐσεβεῖν
  choice: тем, кто знает, что значит быть благочестивым
  rationale: 'Причастие εἰδότας и инфинитив εὐσεβεῖν естественно понимать вместе: «знающих, как/что значит быть благочестивыми». Русская формулировка передаёт этот сжатый греческий оборот без добавления прямо не названного объекта благоговения.'
- source_word: μὴ ἀνθίστασθαι
  choice: не противостоять
  rationale: Сохраняет прямое значение ἀνθίσταμαι — «противостоять, сопротивляться» — и не подменяет его более толковательным «отступать перед».
- source_word: τοῖς πόνοις
  choice: страданиям
  rationale: В контексте мученичества πόνοι обозначает переносимые боль и мучения; «страдания» естественнее по-русски и не усиливает смысл до «пыток».
theological_decisions:
- issue: Синтаксическая связь ἀλόγιστον и μή ἀνθίστασθαι
  choice: Неразумным названо «не противостоять страданиям» со стороны тех, кто знает, что значит быть благочестивым.
  alternative: «Зная, что благочестие не лишено разума, они не отступали перед страданиями».
  rationale: 'В греческом отрицание μή непосредственно стоит при ἀνθίστασθαι, тогда как ἀλόγιστον само по себе не отрицается. Поэтому наиболее прямой разбор: ἀλόγιστον ... μὴ ἀνθίστασθαι — «неразумно не противостоять». Альтернативное прочтение отвечает общей теме книги, но требует перенести смысл отрицания к ἀλόγιστον и свободнее перестроить синтаксис.'
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. «Благочестивым» сохраняет религиозный смысл εὐσεβεῖν; «противостоять страданиям» намеренно следует прямой образности греческого текста. Сноска отмечена в основном тексте как [a].
