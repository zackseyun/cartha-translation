  text: 'For consider this also: if the woman had been fainthearted, though she was a mother, she would have wailed over them; and perhaps she would have spoken like this:'
translation:
  language: ru
  text: 'Подумайте и вот о чём: если бы эта женщина была малодушной, то, хотя она и была матерью, она бы оплакивала их и, возможно, сказала бы так:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιλογίσασθαι
  choice: следует принять во внимание
  rationale: Инфинитив вводит дополнительное соображение, которое предлагается обдумать. Такая формулировка естественна по-русски и сохраняет побудительный оттенок греческого выражения.
- source_word: δειλόψυχος
  choice: малодушна
  rationale: Сложное прилагательное обозначает недостаток мужества и душевной стойкости. «Малодушна» передаёт нравственно-психологический смысл без излишне резкого обвинения в трусости.
- source_word: ἡ γυνή
  choice: эта женщина
  rationale: Существительное означает здесь женщину, уже известную из контекста. Перевод «мать» устранит отдельный риторический акцент последующего μήτηρ οὖσα.
- source_word: καίπερ μήτηρ οὖσα
  choice: хотя она и была матерью
  rationale: Καίπερ придаёт обороту уступительное значение. Перевод сохраняет формальную риторическую напряжённость греческого текста, не объясняя её дополнительно.
- source_word: ὠλοφύρετο
  choice: оплакивала бы
  rationale: Глагол обозначает скорбный плач и сетование. «Оплакивала бы» естественно сочетается с указанием на сыновей и подходит возвышенному повествовательному регистру.
- source_word: ἐπʼ αὐτοῖς
  choice: их
  rationale: При глаголе «оплакивать» русский прямой объект естественно передаёт направленность скорби на сыновей, выраженную греческим предложным оборотом.
- source_word: ἴσως
  choice: возможно
  rationale: Наречие сохраняет предположительный характер вводимой далее воображаемой речи.
- source_word: ταῦτα οὕτως εἶπεν
  choice: сказала бы так
  rationale: Краткая современная формула естественно вводит последующую прямую речь и передаёт указательное значение οὕτως.
theological_decisions:
- issue: Материнское чувство и душевная стойкость
  choice: 'Сохранить прямое гипотетическое противопоставление: если бы женщина была малодушна, она, хотя и была матерью, оплакивала бы сыновей.'
  alternative: Развернуть смысл и пояснить, что естественная материнская любовь обычно побуждает к плачу.
  rationale: Греческая уступительная конструкция формально напряжённа. Перевод сохраняет эту напряжённость и не добавляет нравственного или богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим риторической прозе книги. Союз «ведь» передаёт γάρ, а выражение «и вот что» — добавочный характер τοῦτο при καί. Контрфактическое условие передано формами с «бы»; двоеточие сохранено как ввод в следующую воображаемую речь.
