  yaml_path: translation/deuterocanon/4_maccabees/016/002.yaml
  text: So I have shown that not only did men master the passions[a], but even a woman despised the greatest tortures.
translation:
  language: ru
  text: Итак, я показал, что не только мужчины одержали верх над страстями, но даже женщина презрела[a] тягчайшие пытки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сочла тягчайшие пытки чем-то незначительным».'
    reason: Глагол ὑπερεφρόνησεν может передавать не только презрение, но и отношение к чему-либо как к незначительному, не заслуживающему внимания.
lexical_decisions:
- source_word: ἀπέδειξα
  choice: я показал
  rationale: Аорист ἀποδείκνυμι подводит итог предшествующему рассуждению; «показал» естественно передаёт значение «доказал, продемонстрировал», не усиливая оттенок формального доказательства.
- source_word: οὖν
  choice: итак
  rationale: Частица вводит вывод из предшествующего рассуждения; «итак» ясно передаёт итоговый характер фразы.
- source_word: τῶν παθῶν
  choice: над страстями
  rationale: В контексте 4 Маккавейской πάθη — внутренние страсти и побуждения, которыми управляет разум, а не внешние страдания.
- source_word: ἄνδρες
  choice: мужчины
  rationale: Сохраняет намеренное противопоставление мужчин и женщины в греческом тексте.
- source_word: ἐπεκράτησαν
  choice: одержали верх
  rationale: Глагол выражает господство и победу над страстями; русский оборот естественен и сохраняет образ противоборства.
- source_word: γυνή
  choice: женщина
  rationale: В данном контексте существительное означает женщину, а не жену; отсутствие артикля не требует в русском отдельного показателя неопределённости.
- source_word: τῶν μεγίστων βασάνων
  choice: самые жестокие пытки
  rationale: βάσανοι обозначает пытки, а превосходная степень μεγίστων указывает на их крайнюю тяжесть; «самые жестокие» звучит по-русски естественнее буквального «величайшие».
- source_word: ὑπερεφρόνησεν
  choice: презрела
  rationale: Глагол означает смотреть свысока, считать не заслуживающим внимания; «презрела» кратко и достойно передаёт вызывающее пренебрежение пытками.
theological_decisions:
- issue: Значение πάθη в антропологии 4 Маккавейской
  choice: страсти
  alternative: чувства; страдания
  rationale: Главная тема книги — власть благочестивого разума над внутренними страстями; значение «страдания» здесь нарушило бы противопоставление страстей и пыток.
- issue: Гендерное противопоставление ἄνδρες и γυνή
  choice: мужчины… женщина
  alternative: люди… женщина
  rationale: Греческий текст намеренно сопоставляет мужчин-мучеников с матерью; нейтрализация слова ἄνδρες ослабила бы риторический акцент.
translation_notes:
  register: Современный литературный русский язык с ясным риторическим итогом. Сохранены философский термин «страсти» и гендерное противопоставление исходного текста; синтаксис сделан естественным для чтения вслух.
