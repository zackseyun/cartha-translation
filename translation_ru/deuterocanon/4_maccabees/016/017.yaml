lexical_decisions:
- source_word: προθύμως
  choice: с готовностью
  rationale: Передаёт добровольную готовность действовать, не усиливая значение до эмоциональной пылкости.
- source_word: ὑπὲρ τοῦ πατρίου νόμου
  choice: ради отеческого закона
  rationale: ὑπέρ с родительным указывает, ради чего совершается действие или переносится страдание; πατρίος обозначает закон, унаследованный от отцов и предков.
- source_word: αἰσχρόν
  choice: позорно
  rationale: Сохраняет нравственно-риторическую силу греческого слова и естественно звучит в увещевании.
- source_word: γέροντα τοῦτον
  choice: этот старец
  rationale: Прямо передаёт указательное местоимение и подчёркивает возрастной контраст с сыновьями.
- source_word: ὑπομεῖναι
  choice: вытерпит
  rationale: Передаёт стойкое перенесение страданий; конструкция с «если» делает зависимый инфинитив естественным по-русски без устранения незавершённого противопоставления.
- source_word: τὰς ... ἀλγηδόνας
  choice: страдания
  rationale: В данном контексте естественно охватывает причиняемую мучениями боль, не усиливая её до более узкого «пытки».
- source_word: διὰ τὴν εὐσέβειαν
  choice: за благочестие
  rationale: Передаёт причину страданий и сохраняет ёмкое значение εὐσέβεια — благоговейную преданность и почитание Бога.
theological_decisions:
- issue: Передача εὐσέβεια в контексте мученичества
  choice: благочестие
  alternative: верность Богу; почитание Бога
  rationale: «Благочестие» сохраняет традиционный и достаточно широкий смысл почтительной преданности Богу, не сводя слово только к соблюдению закона; более явная направленность на Бога отмечена в сноске.
- issue: Незавершённое противопоставление μὲν ... δὲ
  choice: 'сохранить обрыв: «а вы…»'
  alternative: дополнить подразумеваемое продолжение из следующего стиха
  rationale: Греческий текст данного стиха заканчивается на ὑμᾶς δὲ, поэтому восполнение здесь устранило бы намеренно сохранённую границу и синтаксическое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством увещевательной речи. Начальная строчная буква сохраняет зависимость фрагмента от предыдущего стиха; тире помогает обозначить эту связь. Многоточие перед сноской передаёт незавершённость греческой фразы.
