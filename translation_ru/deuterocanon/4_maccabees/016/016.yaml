lexical_decisions:
- source_word: ἔλεγες
  choice: ты говорила
  rationale: Имперфект передаёт речь в процессе или повторявшееся обращение; русская форма прошедшего времени сохраняет основу высказывания, а аспектуальная возможность отмечена в сноске.
- source_word: τοῖς παισὶν / Ὦ παῖδες
  choice: сыновьям / о сыновья
  rationale: В данном контексте мать обращается к своим сыновьям; это передаёт и родственную связь, и мужской референт греческого текста.
- source_word: ἐν τῇ Ἑβραΐδι φωνῇ
  choice: по-еврейски
  rationale: Естественное современное русское выражение, точно обозначающее язык речи.
- source_word: γενναῖος ὁ ἀγών
  choice: благородна борьба
  rationale: «Благородна» сохраняет нравственно-героическую оценку γενναῖος, а «борьба» естественно передаёт образ ἀγών в контексте мученического испытания.
- source_word: ἐφʼ ὃν κληθέντες
  choice: к которой вы призваны
  rationale: Передаёт направленность призвания к названной борьбе без утяжеляющей русскую фразу причастной конструкции.
- source_word: ὑπὲρ τῆς διαμαρτυρίας τοῦ ἔθνους
  choice: ради свидетельства народа
  rationale: Сохраняет значение цели или защиты в ὑπέρ, многозначность «свидетельства» и родительный оборот τοῦ ἔθνους, не добавляя отсутствующего в греческом «нашего».
- source_word: ἐναγωνίσασθε
  choice: боритесь в ней изо всех сил
  rationale: Императив передан прямым побуждением; выражение обозначает напряжённое участие в борьбе и поддерживает смысловую связь с ἀγών.
theological_decisions:
- issue: Значение διαμαρτυρία в контексте верности народа
  choice: свидетельство
  alternative: свидетельствование; торжественное исповедание
  rationale: «Свидетельство» сохраняет публичный и вероисповедный оттенок, не вводя специально христианскую мученическую терминологию.
- issue: Отнесение родительного τοῦ ἔθνους
  choice: народа
  alternative: которое даёт народ; о народе
  rationale: Греческий родительный допускает более одного смыслового отношения; буквальный русский оборот сохраняет эту неоднозначность.
- issue: Передача παισίν / παῖδες
  choice: сыновьям / сыновья
  alternative: детям / дети
  rationale: Контекст ясно указывает на сыновей матери, поэтому родственная и гендерная конкретность сохранена без добавления слова «мои».
translation_notes:
  register: Современный литературный русский с торжественной, но понятной интонацией. Обращение «о сыновья» сохраняет риторическую возвышенность оригинала; прямой императив избегает добавочного модального «должны».
