  yaml_path: translation/deuterocanon/4_maccabees/016/008.yaml
  text: In vain[a], O children, did I endure many birth pains for you, and the more grievous anxieties of raising you.
translation:
  language: ru
  text: Напрасно, о дети, я перенесла ради вас столько родовых мук[a] и ещё более тяжкие заботы о вашем воспитании.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «множество мук рождения».'
    reason: Лексическая альтернатива для πολλὰς ὠδῖνας; греческое выражение буквально говорит о многочисленных родовых муках.
lexical_decisions:
- source_word: μάτην
  choice: Напрасно
  rationale: Кратко и естественно передаёт наречие со значением тщетности и сохраняет скорбный риторический акцент в начале фразы.
- source_word: ἐφʼ ὑμῖν
  choice: ради вас
  rationale: В сочетании с глаголом страдания выражает тех, ради кого или из-за кого страдания были перенесены; «ради вас» естественно в материнском обращении.
- source_word: ὦ παῖδες
  choice: о дети
  rationale: Сохраняет прямое торжественно-скорбное обращение; «дети» не уточняет пол сверх самого слова, хотя в контексте речь идёт о сыновьях.
- source_word: πολλὰς ... ὠδῖνας
  choice: столько родовых мук
  rationale: Передаёт множественность и конкретный образ родовых страданий; «столько» по-русски звучит естественнее буквального «многие» в эмоциональной речи.
- source_word: ὑπέμεινα
  choice: я перенесла
  rationale: Передаёт совершившееся стойкое претерпевание; женский род обусловлен говорящей матерью.
- source_word: χαλεπωτέρας
  choice: ещё более тяжкие
  rationale: 'Сохраняет сравнительную степень: заботы воспитания представлены как более тяжкие, чем родовые муки.'
- source_word: φροντίδας ἀνατροφῆς
  choice: заботы о вашем воспитании
  rationale: Естественно передаёт заботы и тяготы, связанные с выращиванием и воспитанием детей, не сводя φροντίδας только к внутренней тревоге.
