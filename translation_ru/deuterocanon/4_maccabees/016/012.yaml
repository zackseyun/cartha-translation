  yaml_path: translation/deuterocanon/4_maccabees/016/012.yaml
  text: Nor did she try to turn any of them away so that they might not die, nor did she grieve as they were dying.
translation:
  language: ru
  text: И она не пыталась удержать никого из них от смерти и не скорбела, когда они умирали.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέτρεπεν
  choice: не пыталась отговорить
  rationale: Глагол означает отвратить или удержать от избранного пути; имперфект допускает длительное или повторяющееся действие. Формулировка передаёт отсутствие попыток разубедить сыновей, не утверждая, будто речь идёт только об успешном предотвращении.
- source_word: αὐτῶν τινα
  choice: кого-либо из них
  rationale: Партитивное сочетание имеет распределительное значение «кого-нибудь одного из них»; выбранный вариант естественен для современного русского языка.
- source_word: ἵνα μὴ ἀποθάνωσιν
  choice: чтобы они не умерли
  rationale: Сохраняет целевое значение конструкции ἵνα μή и не заменяет его более толковательным выражением вроде «спасти их от смерти».
- source_word: ἐλυπήθη
  choice: не скорбела
  rationale: Передаёт сильную печаль или душевную боль, не сужая значение до посмертного оплакивания.
- source_word: ὡς ἀποθνῃσκόντων
  choice: когда они умирали
  rationale: Передаёт обстоятельственную одновременность и длительный вид причастия; формулировка естественна по-русски.
theological_decisions:
- issue: Подразумеваемое подлежащее
  choice: Подлежащее выражено местоимением «она», относящимся к матери из ближайшего контекста.
  alternative: Оставить подлежащее формально невыраженным.
  rationale: В греческом подлежащее подразумевается, однако русский текст для ясности естественно называет его местоимением; ближайший контекст однозначно указывает на мать.
- issue: Характер отсутствия скорби
  choice: Сохранено прямое утверждение «не скорбела» без психологического пояснения.
  alternative: Пояснить, что она преодолела или не показывала скорби.
  rationale: Греческий текст не уточняет, отсутствовало ли само чувство, было ли оно подавлено или не проявлялось внешне; перевод сохраняет эту напряжённость и не вводит толкование.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и сдержанно возвышенный. Повтор отрицательной конструкции сохранён, но громоздкое буквальное «не отвращала» заменено естественным «не пыталась отговорить».
