  yaml_path: translation/deuterocanon/4_maccabees/016/020.yaml
  text: for whose sake even our father Abraham hurried to slaughter Isaac[a], his son, the ancestor of the nation, and, seeing the ancestral hand bearing the sword descending upon him[b], did not shrink back.
translation:
  language: ru
  text: Ради которого даже отец наш Авраам спешил заколоть своего сына Исаака, праотца народа[a]; Исаак же, видя опускавшуюся на него руку своего отца с мечом, не дрогнул[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своего сына Исаака, которому предстояло стать родоначальником народа». Греческое сложное слово ἐθνοπάτωρ означает предка или родоначальника народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не отпрянул»; «не съёжился от страха».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διʼ ὃν
  choice: ради которого
  rationale: Сохраняет мужской род относительного местоимения и его зависимость от предшествующего контекста, не подставляя явно названный антецедент.
- source_word: ἔσπευδεν
  choice: спешил
  rationale: Передаёт как быстроту, так и готовность к действию, сохраняя выразительность греческого глагола.
- source_word: σφαγιάσαι
  choice: заколоть
  rationale: Передаёт резкое, предметное значение глагола и его жертвенный оттенок, не заменяя его более истолковывающим «принести в жертву».
- source_word: τὸν ἐθνοπάτορα υἱὸν … Ἰσαάκ
  choice: своего сына Исаака, праотца народа
  rationale: 'Естественно по-русски выражает приложение: Исаак одновременно назван сыном Авраама и родоначальником народа.'
- source_word: πατρῴαν χεῖρα
  choice: отцовская рука
  rationale: В непосредственной сцене речь идёт о руке отца Исаака — Авраама. «Отцовская» естественно передаёт это отношение, сохраняя возвышенную образность.
- source_word: ξιφηφόρον
  choice: рука с мечом
  rationale: Передаёт буквальный образ «меченосной» руки ясным современным русским выражением.
- source_word: καταφερομένην ἐπʼ αὐτόν
  choice: на него опускается
  rationale: Сохраняет направленное вниз движение руки к Исааку и живую, разворачивающуюся перед глазами сцену.
- source_word: οὐκ ἔπτηξεν
  choice: не дрогнул
  rationale: Кратко и идиоматично передаёт отсутствие испуганного отступления или содрогания.
theological_decisions:
- issue: Как передать аллюзию на Авраама и Исаака, не привнося привычную терминологию рассказа Бытия сверх греческого текста
  choice: «спешил заколоть … Исаака»
  alternative: «спешил принести Исаака в жертву» / «готовился принести Исаака»
  rationale: Греческий текст намеренно использует сильный и наглядный глагол. Более мягкая или явно культовая формулировка ослабила бы риторический эффект либо внесла бы дополнительное толкование.
- issue: Референт διʼ ὃν
  choice: «ради которого» без явного называния антецедента
  alternative: «по этой причине» / указание конкретного референта
  rationale: Относительное местоимение отсылает к предыдущему контексту. Явное называние референта неоправданно устранило бы сохранённую в греческом тексте контекстуальную зависимость.
- issue: Смена подразумеваемого субъекта во второй части стиха
  choice: добавлено «а тот» для ясного указания на Исаака
  alternative: оставить субъект невыраженным, как в греческом
  rationale: В греческом субъект причастия и сказуемого устанавливается из смысла, тогда как без указателя русская фраза могла бы ошибочно отнести видение и бесстрашие к Аврааму. «А тот» проясняет синтаксис, не добавляя богословского содержания.
translation_notes:
  register: Современный литературный русский с достоинством и риторической энергией оригинала. Синтаксис слегка распрямлён ради ясности смены субъекта; образность и жестокая конкретность сцены сохранены.
