- from: ради которого и отец наш Авраам спешил заколоть своего сына Исаака, праотца народа[a], а тот, видя, как на него опускается отцовская рука с мечом, не дрогнул[b].
  to: Ради которого даже отец наш Авраам спешил заколоть своего сына Исаака, праотца народа[a]; Исаак же, видя опускавшуюся на него руку своего отца с мечом, не дрогнул[b].
  rationale: 'Правка минимальна: «даже» передаёт усилительное καί; повторное «Исаак же» ясно отмечает смену субъекта без разговорного оттенка; «руку своего отца» делает образ понятным по-русски. Формулировка «заколоть» и приложение «праотца народа» сохранены, как соответствующие греческой лексике и риторике.'
