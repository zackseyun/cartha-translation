  yaml_path: translation/deuterocanon/4_maccabees/016/006.yaml
  text: Alas for me indeed[a], thrice-wretched many times over[b]! Though I bore seven children[c], I have become the mother of none.
translation:
  language: ru
  text: О, несчастная я[a], многажды трижды несчастная[b]! Родив семерых детей[c], я теперь никому не мать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «О, несчастная я!» Греческий возглас — самооплакивание; усилительное местоимение подчёркивает говорящую.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «многажды трижды несчастная»; это намеренно усиленное выражение скорби.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «семерых сыновей». Греческое слово может означать как детей вообще, так и сыновей; из контекста ясно, что речь идёт о сыновьях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ μελέα ἔγωγε
  choice: О я, несчастная
  rationale: Передаёт возглас самооплакивания; ἔγωγε подчёркивает говорящую, а форма «несчастная» сохраняет женский род греческого прилагательного.
- source_word: πολλάκις τρισαθλία
  choice: многократно трижды бедная
  rationale: 'Сохраняет необычное накопительное усиление скорби: πολλάκις означает «многократно», а τρισαθλία — буквально «трижды бедная», то есть крайне несчастная.'
- source_word: ἥτις
  choice: Родив
  rationale: Русская деепричастная конструкция естественно связывает основание плача с последующим парадоксальным утверждением, не утяжеляя речь буквальным «я, которая».
- source_word: ἑπτὰ παῖδας
  choice: семерых детей
  rationale: παῖδας допускает значения «детей» и «сыновей»; «детей» сохраняет лексическую широту, тогда как мужской род числительного отражает пол детей в контексте.
- source_word: τεκοῦσα
  choice: родив
  rationale: Точно и кратко передаёт завершённое рождение детей, выраженное аористным причастием от τίκτω.
- source_word: οὐδενὸς μήτηρ γεγένημαι
  choice: я не осталась матерью ни одного
  rationale: 'Передаёт результирующее состояние перфекта и парадокс утраты: родив семерых, женщина теперь лишена всех. «Не осталась» звучит по-русски естественнее буквального «стала матерью ни одного».'
theological_decisions:
- issue: Смысл материнского плача после смерти семерых детей
  choice: 'Высказывание передано как парадокс утраты: родив семерых, женщина не осталась матерью ни одного.'
  alternative: «Я теперь ничья мать» или буквальное «я стала матерью ни одного».
  rationale: Греческий перфект γεγένημαι указывает на нынешнее состояние как итог случившегося. Формулировка сохраняет напряжение между фактом рождения и полной утратой, не добавляя доктринального истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и высокой эмоциональностью плача. Необычное «многократно трижды бедная» намеренно сохраняет яркую греческую гиперболу; остальной синтаксис сделан естественным для русской речи.
