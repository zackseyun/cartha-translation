  yaml_path: translation/deuterocanon/4_maccabees/016/001.yaml
  text: If[a], then, even a woman—an old woman and a mother of children—endured the tortures up to death while seeing the sufferings of her children, godly reason is master of the passions.
translation:
  language: ru
  text: Итак, если даже женщина — пожилая женщина и мать — перенесла пытки до самой смерти, видя, как её дети громко кричали[a], то благочестивый разум имеет власть над страстями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «видя своих детей, громко вопивших (или рыдавших)». Греческая конструкция сжата и синтаксически трудна; она может особенно подчёркивать, что мать была свидетельницей громких криков детей во время пыток.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ τοίνυν
  choice: Итак, если … то
  rationale: Передаёт условно-выводную связь и подчёркнутый переход к заключению; добавление «то» естественно оформляет эту конструкцию по-русски.
- source_word: καὶ γυνὴ καὶ γεραιὰ καὶ ἐπὶ παιδῶν μήτηρ
  choice: даже женщина — пожилая и к тому же мать
  rationale: Сохраняет накопительное ударение греческих καί, преклонный возраст женщины и её положение матери, не сужая значение до «мать сыновей».
- source_word: ὑπέμεινεν τὰς μέχρι θανάτου βασάνους
  choice: перенесла пытки вплоть до смерти
  rationale: ὑπομένω обозначает стойкое перенесение испытания, а βάσανοι здесь — именно пытки; μέχρι θανάτου указывает на их предельную протяжённость — до смерти.
- source_word: ὁρῶσα τῶν τέκνων· ὁλολυγμένων
  choice: видя мучения своих детей
  rationale: Передаёт смысл сжатой и синтаксически трудной греческой фразы в контексте пыток детей. Буквальный образ их громких криков сохранён в примечании.
- source_word: αὐτοκράτωρ … τῶν παθῶν
  choice: имеет полную власть над страстями
  rationale: Передаёт самостоятельную, верховную власть, выраженную αὐτοκράτωρ, естественной современной русской конструкцией; πάθη сохранено как программный философский термин «страсти».
- source_word: ὁ εὐσεβὴς λογισμός
  choice: благочестивый разум
  rationale: Сочетание передаёт как разумное начало, так и его направленность почтением к Богу, не вводя конфессионально специфического толкования.
theological_decisions:
- issue: Программное философско-богословское выражение ὁ εὐσεβὴς λογισμός
  choice: благочестивый разум
  alternative: богобоязненный разум; разум, исполненный благочестия
  rationale: «Благочестивый разум» кратко сохраняет напряжение между рациональным и религиозно-нравственным аспектами выражения и подходит для повторяющегося тезиса книги.
- issue: Характер власти разума над страстями
  choice: имеет полную власть над страстями
  alternative: владычествует над страстями; господин страстей
  rationale: 'Так сохраняется усиленное значение αὐτοκράτωρ без утверждения, что страсти уничтожены: речь идёт о власти над ними.'
translation_notes:
  register: Современный литературный русский язык с dignified повествовательно-философским тоном. Лексика «пытки», «благочестивый разум», «страсти» сохраняет точность ключевых понятий, а условная конструкция «если … то» делает ход рассуждения ясным.
