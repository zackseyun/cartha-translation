  source_fidelity: 'Основная проблема — «видя мучения своих детей»: в тексте Swete выражено не слово «мучения», а образ детей, громко вопиющих/рыдающих (ὁλολυγμένων). Контекст пыток объясняет крики, но не оправдывает замену их на «мучения» в основном тексте. Исправленный текст передаёт этот образ прямо. Условно-выводная конструкция и смысл αὐτοκράτωρ как власти над страстями сохранены.'
