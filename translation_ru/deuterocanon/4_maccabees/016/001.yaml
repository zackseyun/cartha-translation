  terminology: «Благочестивый разум» и «страсти» уместно сохраняют программные термины εὐσεβὴς λογισμός и πάθη. «Имеет власть над» адекватно передаёт αὐτοκράτωρ, не добавляя конфессионального или психологического толкования.
