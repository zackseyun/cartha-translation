  text: Do not let the younger men be terrified by the tortures. Remember that for the sake of the God of the world you have partaken of this[a], and have enjoyed life;
translation:
  language: ru
  text: 'Не позволяйте младшим устрашиться пыток.[a] Помните: ради Бога, Владыки мира,[b] вы получили свою долю[c] и насладились жизнью;'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный греческий фрагмент буквально начинается словами «чтобы младшие устрашились пыток» и не содержит выраженного здесь отрицания или управляющего глагола. «Не позволяйте» восстанавливает смысл незавершённой конструкции по контексту; вероятно, начало фразы оказалось за пределами данного фрагмента.
    reason: source_fragment_mismatch
  - marker: b
    text: 'Буквально: «ради Бога мира». Здесь, вероятнее всего, имеется в виду Бог как Владыка всего мира.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вы приобщились», «вы приняли участие». В греческом тексте не сказано прямо, о чём именно идёт речь.'
    reason: implicit_object
lexical_decisions:
- source_word: τοὺς νεωτέρους
  choice: младшим
  rationale: Субстантивированная сравнительная форма обозначает младших членов мужской группы; в контексте это младшие братья, однако слово «братья» в самом выражении отсутствует.
- source_word: καταπλαγῆναι τὰς βασάνους
  choice: устрашиться пыток
  rationale: Аористный пассивный инфинитив передаёт сильный испуг или потрясение; «пытки» прямо соответствует контексту мучений.
- source_word: ἀναμνήσθητε
  choice: Помните
  rationale: Кратко и естественно передаёт аористный императив, призывающий сознательно вспомнить.
- source_word: διὰ τὸν θεὸν τοῦ κόσμου
  choice: ради Бога, Владыки мира
  rationale: διά с винительным передано целевым «ради», а родительный τοῦ κόσμου — аппозицией, выражающей Божье владычество над миром и не создающей впечатления, будто речь идёт об одном из ограниченных божеств.
- source_word: μετελάβετε
  choice: вы приняли свою долю
  rationale: Глагол означает получить долю, приобщиться или принять участие. Поскольку прямой объект в данном греческом фрагменте не выражен, перевод не уточняет без достаточного основания, долю чего именно они приняли.
- source_word: τοῦ βίου ἀπελαύσατε
  choice: насладились жизнью
  rationale: ἀπολαύω с родительным означает пользоваться благом чего-либо или наслаждаться им; формулировка сохраняет прямой смысл и звучит естественно по-русски.
theological_decisions:
- issue: Значение θεὸν τοῦ κόσμου
  choice: Бога, Владыки мира
  alternative: Бога мира
  rationale: Формально возможное «Бога мира» в современном русском двусмысленно и может быть понято как «Бога мира/покоя». Аппозиция передаёт наиболее вероятный смысл — Бога как Владыку мироздания — при сохранении буквального варианта в сноске.
- issue: Неуказанный объект μετελάβετε
  choice: приняли свою долю
  alternative: приняли участие в этом
  rationale: Греческий текст не называет объект участия. Выбранный вариант сохраняет эту недосказанность и не определяет её как пытки, страдания либо какое-то духовное приобщение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Краткие повелительные формулы сохраняют напряжённость материнского увещания; богословски нагруженные места не конкретизированы сверх греческого текста.
