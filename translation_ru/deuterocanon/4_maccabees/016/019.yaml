  language: ru
  text: И потому вы должны стойко переносить всякое страдание ради Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: и потому
  rationale: Передаёт вывод из предшествующего рассуждения и естественно связывает стих с контекстом.
- source_word: ὀφίλετε
  choice: вы должны
  rationale: Выражает нравственную обязанность и увещательный характер обращения; по-русски «должны» здесь естественнее и яснее, чем буквальное «обязаны».
- source_word: πάντα πόνον
  choice: любые страдания
  rationale: В контексте мученичества πόνος обозначает боль и тяготы; множественное «любые страдания» естественно передаёт распределительное πάντα, не ограничивая смысл одной разновидностью боли.
- source_word: ὑπομένειν
  choice: стойко переносить
  rationale: Передаёт не просто пассивное терпение, а выдержку под тяжестью страдания.
- source_word: διὰ τὸν θεόν
  choice: ради Бога
  rationale: Передаёт мотив верности Богу и в современном русском звучит яснее, чем причинное «из-за Бога».
theological_decisions:
- issue: Сила нравственной обязанности в ὀφίλετε
  choice: «вы должны» как увещательная обязанность
  alternative: «вам следует» или более категоричное «вы обязаны»
  rationale: Греческий глагол обозначает реальную обязанность. «Должны» сохраняет её силу, не превращая наставление ни в мягкий совет, ни в юридически окрашенное требование.
translation_notes:
  register: Современный литературный русский; речь ясная, сдержанная и достойная. Сочетание «стойко переносить» сохраняет риторическую силу увещания, а «любые страдания» соответствует мученическому контексту.
