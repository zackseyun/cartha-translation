  - severity: low
    issue: Метафора ἀδάμαντινον τὸν νοῦν передана слишком отвлечённо.
    rationale: «Адамантовая твёрдость ума» понятна, но оригинал непосредственно характеризует ум как адамантовый; «ум, твёрдый как адамант» ближе к образу.
  - severity: medium
