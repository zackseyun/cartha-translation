  to: Но она, обладая умом, твёрдым как адамант, и обращая число своих сыновей к бессмертию[a], тем настойчивее умоляла их и побуждала ради благочестия идти на смерть.
  rationale: Устранено не имеющее опоры в греческом «словно», а образ адамантового ума передан ближе к синтаксису и метафоре оригинала. Осторожное «обращая ... к бессмертию» сохранено как читаемая передача трудного ἀντικτυποῦσα без догматического разъяснения; сноска теперь отмечает неопределённость образа, не выдавая неестественную русскую фразу за ясный буквальный эквивалент.
