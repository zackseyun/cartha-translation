base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/016/013.yaml
  text: But[a], having a mind like adamant, and sending the number of her sons on to immortality, she was all the more urging them toward death for the sake of godliness, pleading with them.
translation:
  language: ru
  text: Но она, обладая умом, твёрдым как адамант, и обращая число своих сыновей к бессмертию[a], тем настойчивее умоляла их и побуждала ради благочестия идти на смерть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое причастие необычно и метафорично; оно связано с образом ответного удара или отзвука. Поэтому точный смысл оборота неясен; возможна более буквальная, но тяжеловесная передача: «как бы ответно отзываясь числом своих сыновей в сторону бессмертия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδάμαντινον
  choice: адамантовой твёрдостью
  rationale: Образ адаманта передаёт исключительную твёрдость и несокрушимость; добавление «твёрдостью» делает метафору понятной по-русски, не сводя её к отвлечённой «решимости».
- source_word: νοῦν
  choice: ума
  rationale: Сохранено прямое значение «ум, разум»; перевод «решимость» был бы контекстуальным истолкованием.
- source_word: ἀντικτυποῦσα
  choice: направляя
  rationale: Редкое метафорическое причастие буквально связано с ответным ударом или отзвуком. В основном тексте выбран направительный смысл, позволяющий связать образ с εἰς ἀθανασίαν; необычность и возможный более буквальный образ отмечены в сноске.
- source_word: εἰς ἀθανασίαν
  choice: к бессмертию
  rationale: Предлог εἰς обозначает направление или цель; «к бессмертию» сохраняет эту динамику, не разъясняя механизм его достижения.
- source_word: τὸν τῶν υἱῶν ἀριθμόν
  choice: число своих сыновей
  rationale: Сохранена необычная количественная формулировка оригинала; «своих» естественно уточняет принадлежность по контексту.
- source_word: μᾶλλον
  choice: тем настойчивее
  rationale: Передаёт усиление действия в противопоставлении, заданном ἀλλά, и естественно сочетается с побуждением и мольбой.
- source_word: εὐσεβείας
  choice: благочестия
  rationale: В 4 Маккавейской это верность и почтение к Богу, проявляемые в соблюдении Закона; «благочестие» сохраняет направленность к Богу без конфессионального уточнения.
- source_word: προετρέπετο
  choice: побуждала идти
  rationale: Глагол обозначает настойчивое увещевание или побуждение; конструкция с «идти на смерть» звучит естественно и сохраняет направленность ἐπὶ τὸν θάνατον.
- source_word: ἱκετεύουσα
  choice: умоляла
  rationale: Передаёт эмоциональную силу причастия и его значение настойчивой мольбы.
theological_decisions:
- issue: Значение εὐσέβεια в контексте мученичества
  choice: благочестие
  alternative: почитание Бога; верность Богу
  rationale: «Благочестие» охватывает верность Богу и Его Закону, не превращая перевод в пояснительный пересказ.
- issue: Толкование καὶ εἰς ἀθανασίαν ἀντικτυποῦσα τὸν τῶν υἱῶν ἀριθμόν
  choice: направляя число своих сыновей к бессмертию
  alternative: отражая число своих сыновей в бессмертие; отдавая своих сыновей бессмертию
  rationale: Греческая фраза намеренно плотная и метафорическая. Перевод сохраняет «число сыновей» и бессмертие как направление, не превращая образ в однозначное учение о посмертной награде; более буквальная образность вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим повествованию о мученичестве. Синтаксис слегка сглажен ради ясности, но необычный образ «числа сыновей», направляемого к бессмертию, сохранён; термин «адамант» оставлен как возвышенный, но понятный образ несокрушимой твёрдости.
