  source_fidelity: 'Основная проблема — «словно обладая»: греческое ἔχουσα является обычным причастием «имея/обладая», а не сравнительным оборотом. Кроме того, «адамантовая твёрдость ума» несколько отдаляет метафору оригинала, где именно ум назван адамантовым. «Направляя» допустимо как осторожная передача крайне редкого и образного ἀντικτυποῦσα, но сноска должна точнее обозначать, что образ ответного удара/отзвука неясен, а не предлагать неестественное «отражая ... в бессмертие».'
  naturalness: Исправленный текст сохраняет современный литературный строй. «Ум, твёрдый как адамант» естественнее и прозрачнее, чем «адамантовая твёрдость ума»; устранено неуместное «словно».
  terminology: «Благочестие» — точная и стилистически уместная передача εὐσέβεια в данном контексте. «Адамант» сохраняет возвышенный образ оригинала. «Число своих сыновей» намеренно оставлено, поскольку это особенность греческой формулировки.
