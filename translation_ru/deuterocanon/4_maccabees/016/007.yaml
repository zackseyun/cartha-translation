  yaml_path: translation/deuterocanon/4_maccabees/016/007.yaml
  text: O seven futile pregnancies[a], and seven useless ten-month terms, and fruitless nursing[b], and miserable suckling.
translation:
  language: ru
  text: О, семь напрасных беременностей, и семь бесполезных десятимесячных сроков беременности[a], и безрезультатное кормление грудью, и горестное вскармливание молоком![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Десятимесячные сроки беременности» отражают древний способ исчисления обычной продолжительности беременности.
    reason: cultural_note
  - marker: b
    text: В греческом тексте это цепочка кратких восклицательных именных фраз без глаголов; перевод сохраняет сжатую форму плача.
    reason: literary_note
lexical_decisions:
- source_word: μάταιοι
  choice: напрасных
  rationale: В этом материнском плаче слово передаёт мысль о надеждах и трудах, которые, как кажется матери, оказались тщетными; «напрасных» естественно сочетается с «беременностей».
- source_word: κυοφορίαι
  choice: беременностей
  rationale: Существительное обозначает ношение ребёнка во чреве; современное русское «беременность» ясно и точно передаёт смысл.
- source_word: ἀνόνητοι
  choice: бесполезных
  rationale: Прилагательное означает «не принёсших пользы, тщетных». Такой перевод сохраняет суровую оценку, выраженную в плаче, не усиливая её до буквального отрицания ценности сыновей.
- source_word: δεκάμηνοι
  choice: десятимесячных сроков
  rationale: Субстантивированное обозначение десятимесячных периодов беременности передано с сохранением древнего способа исчисления; пояснение дано в сноске.
- source_word: ἄκαρποι
  choice: бесплодное
  rationale: Метафора отсутствия плода или результата сохраняется. Здесь речь не о физическом бесплодии матери, а о её скорбном восприятии исхода воспитания.
- source_word: τιθηνίαι
  choice: кормление грудью
  rationale: Слово относится к вскармливанию младенцев; этот вариант понятен современному читателю и отличает выражение от следующего сложного слова о питании молоком.
- source_word: ταλαίπωροι
  choice: горестное
  rationale: Передаёт страдание и несчастье в контексте плача; «жалкое» могло бы ошибочно звучать как пренебрежительная оценка самого материнского ухода.
- source_word: γαλακτοτροφίαι
  choice: вскармливание молоком
  rationale: Сложное слово буквально обозначает питание или выращивание молоком. Перевод сохраняет молочную образность и частичный риторический параллелизм с предыдущей фразой.
theological_decisions:
- issue: Передача цепочки безглагольных восклицаний
  choice: Сохранена единая сжатая цепочка именных фраз с начальным «О» и заключительным восклицательным знаком.
  alternative: 'Развернуть каждую фразу в предложение: «О, как напрасны были мои семь беременностей…»'
  rationale: 'В греческом тексте нет личных глаголов: риторическая сжатость является важной частью материнского плача. Добавление «были» и притяжательного «мои» сделало бы подразумеваемое явным без необходимости.'
- issue: Древнее обозначение срока беременности δεκάμηνοι
  choice: Сохранено буквальное «десятимесячных сроков» со сноской.
  alternative: Передать как «доношенных беременностей» или «полных сроков».
  rationale: Буквальный образ культурно специфичен, но понятен при кратком пояснении; его устранение сгладило бы форму исходного текста.
- issue: Напряжение между верностью сыновей и словами матери о тщетности материнства
  choice: Оценочные слова переданы как непосредственный язык плача без богословского смягчения.
  alternative: Переформулировать их так, чтобы подчеркнуть духовную плодотворность мученичества сыновей.
  rationale: Стих выражает острую материнскую скорбь в данный момент повествования. Перевод не должен заранее разрешать её напряжение с более широким богословским смыслом рассказа.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной интонацией плача. Повтор союза «и» сохраняет греческое нагнетание; избегнуты как архаизмы, так и клиническая терминология.
