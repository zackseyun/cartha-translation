    rationale: ἄκαρποι означает «не давшее плода/результата» в скорбном переносном смысле, а русское «бесплодное» рядом с беременностями и грудным кормлением может ошибочно обозначать физиологическую неспособность.
  - severity: low
    issue: «Десятимесячных сроков» не уточняет, что это сроки беременности.
    rationale: Вне контекста «сроки» слишком неопределённы; добавление «беременности» эксплицирует подразумеваемый предмет без изменения смысла.
  - severity: low
