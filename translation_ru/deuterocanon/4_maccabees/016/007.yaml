  verdict: revise
  source_fidelity: В целом переданы последовательность четырёх восклицательных групп, древнее «десятимесячное» исчисление и скорбная оценочность. Однако «десятимесячных сроков» без указания беременности в русском звучит неопределённо, а «бесплодное кормление грудью» может быть понято как отсутствие молока или невозможность кормить, чего греческое ἄκαρποι не утверждает. «Безрезультатное» точнее передаёт метафору отсутствия ожидаемого результата.
  naturalness: Начальное «О» требует запятой в современной русской пунктуации. «Десятимесячных сроков беременности» ясно и естественно. Сжатая безглагольная цепочка сохранена; отвлечённые существительные в единственном числе в последних двух группах допустимо передают русское собирательное осмысление повторявшегося материнского ухода.
  terminology: «Беременности», «кормление грудью» и «вскармливание молоком» точны и сохраняют различение τιθηνίαι и γαλακτοτροφίαι. «Безрезультатное» предпочтительнее «бесплодное», поскольку не создаёт ложной ассоциации с физическим бесплодием или нехваткой молока. Культурная сноска к δεκάμηνοι поставлена у надлежащего выражения.
