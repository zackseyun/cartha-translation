  yaml_path: translation/deuterocanon/4_maccabees/016/009.yaml
  text: O my children—some unmarried[a], and others married but childless—I will not see your children, nor will I be counted blessed when I am called grandmother.
translation:
  language: ru
  text: О дети мои! Одни из вас не состоят в браке, а другие, вступив в брак, бездетны[a]. Я не увижу ваших детей и, когда меня назовут бабушкой, не сочтут меня счастливой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Редкое греческое слово ἄνοιντοι, вероятно, означает «бездетные» или «не имеющие потомства»: даже вступившие в брак дети не оставят ей внуков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ τῶν ἐμῶν παίδων
  choice: О дети мои!
  rationale: παῖδες допускает значения «дети» и «сыновья»; нейтральное «дети» сохраняет семейный характер материнского плача и не сужает смысл без необходимости.
- source_word: ἄγαμοι
  choice: не вступили в брак
  rationale: Передаёт состояние не состоящих в браке естественным современным русским языком.
- source_word: γαμήσαντες
  choice: вступив в брак
  rationale: 'Сохраняет значение аористного причастия: речь о тех, кто уже заключил брак.'
- source_word: ἄνοιντοι
  choice: остались бездетными[a]
  rationale: Редкое слово по контексту, вероятнее всего, означает отсутствие потомства у вступивших в брак; «бездетными» не приписывает причину или бесплодие конкретному супругу.
- source_word: οὐκ ὄψομαι ὑμῶν τέκνα
  choice: Не увижу я ваших детей
  rationale: Прямо сохраняет образ следующего поколения и повтор семейной лексики.
- source_word: μάμμη
  choice: бабушкой
  rationale: Естественный современный эквивалент родственного наименования μάμμη.
- source_word: κληθεῖσα μακαρισθήσομαι
  choice: не назовут меня счастливой бабушкой
  rationale: 'Сжатая русская конструкция сохраняет оба пассивных оттенка: её не назовут бабушкой и не будут считать счастливой в этом качестве.'
