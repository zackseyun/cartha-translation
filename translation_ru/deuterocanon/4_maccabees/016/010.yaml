lexical_decisions:
- source_word: ὦ
  choice: Ах
  rationale: В данном восклицании частица вводит плач; русское «ах» естественно передаёт скорбную, а не нейтрально-звательную силу греческого ὦ.
- source_word: πολύπαις
  choice: мать многих детей
  rationale: Сложное прилагательное означает женщину, имеющую много детей. Описательный перевод естественнее буквального «многодетная» в сочетании со следующим καλλίπαις.
- source_word: καλλίπαις
  choice: прекрасных детей
  rationale: καλός в составе слова может указывать как на красоту, так и на превосходные качества; «прекрасных» сохраняет в русском оба оттенка лучше, чем однозначно нравственное «благородных».
- source_word: γυνή
  choice: мать
  rationale: Хотя буквально это «женщина», материнский смысл уже задан прилагательными πολύπαις и καλλίπαις; цельное выражение «мать многих прекрасных детей» передаёт конструкцию естественно, не добавляя нового участника.
- source_word: χήρα
  choice: вдова
  rationale: Прямое и естественное обозначение семейного положения говорящей.
- source_word: μόνη
  choice: одинокая
  rationale: Передаёт подчёркнутую оставленность женщины; это не просто физическое пребывание одной, но трагическое одиночество после утраты близких.
- source_word: πολύθρηνος
  choice: безутешно скорбящая
  rationale: Передаёт обилие и напряжённость плача, выраженные первой частью сложного слова, и хорошо соответствует контексту материнского сетования.
