  text: Ах, я — мать многих прекрасных[a] детей, вдова, одинокая, глубоко скорбящая[b] женщина!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благородных». Греческое καλλίπαις может говорить как о красоте детей, так и об их превосходных качествах.'
