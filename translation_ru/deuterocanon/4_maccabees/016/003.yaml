    text: 'Или: «горела ещё сильнее». Редкий греческий глагол использует образ огня для описания внутренних мук матери.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ περὶ Δανιὴλ λέοντες
  choice: львы вокруг Даниила
  rationale: Оборот οἱ περὶ с именем указывает на тех, кто находился вокруг или был связан с названным лицом; здесь имеются в виду львы из повествования о Данииле.
- source_word: ἄγριοι
  choice: свирепы
  rationale: Передаёт опасную жестокость львов и естественно звучит в данном сравнении.
- source_word: Μισαὴλ
  choice: Мисаил
  rationale: Использована традиционная русская форма библейского имени одного из трёх юношей.
- source_word: ἐκφλεγομένη κάμινος
  choice: пылающая печь
  rationale: Сохраняет причастный образ активно горящей, раскалённой печи.
- source_word: λαβροτάτῳ πυρί
  choice: с её неистовым огнём
  rationale: Прилагательное в превосходной степени подчёркивает крайнюю силу и ярость огня; по-русски это естественно передано словом «неистовый».
- source_word: φιλοτεκνίας
  choice: любовью к детям
  rationale: Существительное обозначает глубокую привязанность к собственным детям; перевод сохраняет ясность и непосредственность.
- source_word: πειράλειεν
  choice: пылала
  rationale: Редкий глагол содержит образ огня и метафорически описывает внутреннее состояние матери; «пылала» сохраняет этот образ без сведения смысла лишь к душевному страданию.
- source_word: ἐκείνη φύσις
  choice: сама природа той матери
  rationale: Указательное местоимение отсылает к матери семерых сыновей, а φύσις обозначает её природное материнское естество. Формулировка делает референт ясным, не устраняя олицетворение природы.
- source_word: ὁρῶσα
  choice: когда она видела
  rationale: Причастие передано временным придаточным, ясно выражающим обстоятельство её внутреннего переживания.
- source_word: βασανιζομένους
  choice: как пытают
  rationale: В контексте мученичества речь идёт именно о физических пытках, а не просто о страдании или испытании.
theological_decisions:
- issue: Метафорический образ огня во внутреннем состоянии матери
  choice: 'Сохранить образ горения: «пылала любовью к детям».'
  alternative: «терзалась из-за любви к детям» или «была глубоко потрясена»
  rationale: Стих риторически сопоставляет львов, огненную печь и внутреннее переживание матери. Сохранение огненной метафоры поддерживает это сопоставление и не сглаживает напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской риторикой. Параллель между свирепостью львов, яростью печи и внутренним горением матери сохранена; порядок слов слегка приспособлен к естественному русскому синтаксису.
