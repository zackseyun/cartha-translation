  yaml_path: translation/deuterocanon/4_maccabees/016/003.yaml
  text: And the lions around Daniel were not so savage[a], nor the blazing furnace with its fiercest fire against Mishael, as that mother's own nature was inflamed by love for her children when she saw her seven sons being tortured.
translation:
  language: ru
  text: Ни львы, окружавшие Даниила, не были так свирепы, ни пылающая печь с её неистовым огнём, обращённая против Мисаила, не была так яростна, как пылала[a] от любви к детям материнская природа той женщины, когда она видела, как пытают её семерых сыновей.
  philosophy: optimal-equivalence
  footnotes:
