lexical_decisions:
- source_word: ἔτι δὲ καὶ
  choice: А кроме того
  rationale: Естественно передаёт добавочное и усилительное значение оборота в современном русском языке.
- source_word: ταῦτα ἰδόντες ὅτι
  choice: видя и то, что
  rationale: Сохраняет причастную конструкцию и передаёт указательное ταῦτα как совокупное «то», раскрываемое последующим ὅτι.
- source_word: διὰ τὸν θεόν
  choice: ради Бога
  rationale: В контексте мученической смерти выражает мотив и верность Богу, не сводя оборот лишь к нейтральной причинности.
- source_word: ἀποθανόντες
  choice: умершие
  rationale: Русское субстантивированное причастие естественно выражает предшествующую смерти жизнь и служит подлежащим при «живут».
- source_word: ζῶσιν τῷ θεῷ
  choice: живут для Бога
  rationale: Передаёт направленность или отношение, выраженное дательным падежом τῷ θεῷ, и не добавляет отсутствующего в тексте «с Богом».
- source_word: ὥσπερ
  choice: как
  rationale: Ясно и естественно вводит сравнение с праотцами.
- source_word: οἱ πατριάρχαι
  choice: все патриархи
  rationale: «Патриархи» — устоявшееся обозначение названных родоначальников и других праотцев.
theological_decisions:
- issue: Посмертная жизнь умерших за Бога в их отношении к Богу
  choice: живут для Бога
  alternative: живут Богу; живут с Богом
  rationale: Формулировка сохраняет утверждение о продолжающейся жизни и неоднозначность греческого дательного падежа. Вариант «с Богом» чрезмерно уточнял бы образ этой жизни, а буквальное «живут Богу» в основном тексте звучит по-русски непривычно.
translation_notes:
  register: Современный литературный русский с достоинством библейской прозы. Конечное тире сохраняет незавершённость синтаксической конструкции, продолжающей предыдущий контекст.
