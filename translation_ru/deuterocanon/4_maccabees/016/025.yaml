  text: And even more, by seeing this—that after dying for God they live to God, just as Abraham and Isaac and Jacob, and all the patriarchs do—
translation:
  language: ru
  text: А кроме того, видя также, что те, кто умер ради Бога, живут для Бога[a], как Авраам, Исаак, Иаков и все патриархи, —
  philosophy: optimal-equivalence
  footnotes:
