  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνελήμφθης
  choice: тебя схватили
  rationale: Пассивная форма аориста от συλλαμβάνω здесь обозначает насильственное задержание; «схватили» естественно передаёт ситуацию без излишне современного юридического оттенка слова «арестовали».
- source_word: μετὰ τῶν παίδων
  choice: вместе с сыновьями
  rationale: В данном повествовательном контексте παῖδες — дети этой матери, причём речь идёт о её сыновьях; выбор сохраняет конкретность контекста.
- source_word: εἱστήκεις
  choice: ты стояла
  rationale: Плюсквамперфект ἵστημι употреблён со статальным значением продолжающегося положения; русский имперфектив естественно передаёт эту длительность.
- source_word: ὁρῶσα βασανιζόμενον
  choice: и смотрела, как истязают
  rationale: Причастная конструкция буквально описывает её как видящую Елеазара в процессе мучений; придаточная конструкция звучит естественно и сохраняет процессуальность настоящего пассивного причастия.
- source_word: καὶ
  choice: и…
  rationale: Стих обрывается на союзе и синтаксически продолжается в следующем стихе; многоточие обозначает незавершённость фразы, не устраняя связи.
