  yaml_path: translation/deuterocanon/4_maccabees/016/004.yaml
  text: But by the reasoning of godliness the mother extinguished passions so many and so great[a][b].
translation:
  language: ru
  text: Но благочестивым рассуждением мать погасила столь многочисленные и столь сильные страсти.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «столь многие и столь великие страсти».'
    reason: lexical_alternative
  - marker: b
    text: «Благочестивое рассуждение» — рассуждение, проникнутое благоговением и преданностью Богу, а не рассудочность сама по себе.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: Но
  rationale: Передаёт сильное противопоставление предшествующему контексту естественным русским союзом.
- source_word: τῷ λογισμῷ τῆς εὐσεβείας
  choice: благочестивым рассуждением
  rationale: Сохраняет инструментальное значение дательного падежа, философскую идею разумного суждения и её направленность на почитание Бога.
- source_word: κατέσβεσε
  choice: погасила
  rationale: Сохраняет яркую метафору гашения огня применительно к страстям.
- source_word: τοσαῦτα καὶ τηλικαῦτα
  choice: столь многочисленные и столь сильные
  rationale: Передаёт двойное усиление — множество и значительность; «сильные» естественно характеризует страсти по-русски, не снимая идеи их величины.
- source_word: πάθη
  choice: страсти
  rationale: Соответствует философской лексике книги, где речь идёт о внутренних побуждениях и переживаниях, которыми управляет разум.
- source_word: ἡ μήτηρ
  choice: мать
  rationale: Следует простому греческому определению лица, не добавляя отсутствующего в тексте притяжательного местоимения.
theological_decisions:
- issue: Передача выражения λογισμῷ τῆς εὐσεβείας
  choice: благочестивым рассуждением
  alternative: рассуждением благочестия
  rationale: Выбранный вариант естественнее в современном русском и удерживает вместе разумное рассуждение и благоговейную преданность Богу, не сводя выражение ни к отвлечённой рациональности, ни только к религиозному чувству.
- issue: Значение πάθη
  choice: страсти
  alternative: страдания
  rationale: В философской аргументации 4 Маккавейской книги слово обозначает прежде всего внутренние страсти и аффекты, подвластные благочестивому разуму; «страдания» неоправданно сместило бы акцент на внешние мучения.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Порядок слов сделан естественным для русского; метафора «погасила страсти» и ключевое сочетание разума с благочестием сохранены.
