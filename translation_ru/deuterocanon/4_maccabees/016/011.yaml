  text: who[a], even if I were not to die, would bury some one of my sons. But with this lament the holy and God-fearing mother bewailed none of them,
translation:
  language: ru
  text: «…которая — даже если я умру — не буду иметь ни одного из сыновей, чтобы похоронить меня».[a] Но святая и богобоязненная мать никого из них не оплакивала таким плачем,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст обрывочно продолжает относительное предложение («которая»), но затем резко переходит к первому лицу: буквально, «которая — даже если я умру — не буду иметь кого-либо из сыновей, чтобы похоронить [меня]». Такое несогласование сохранено в переводе.'
    reason: Объясняет сохранённые относительное местоимение, синтаксический разрыв и подразумеваемое дополнение при «похоронить».
lexical_decisions:
- source_word: οὐδʼ ἂν ἀποθάνω
  choice: даже если я умру, … не будет
  rationale: 'Сочетание οὐδέ с ἄν и сослагательным наклонением передаёт усиленную отрицательную гипотезу: «даже если я умру, не…». Первое лицо ἀποθάνω сохранено как голос матери.'
- source_word: θάπτοντα τῶν υἱῶν ἕξω τινά
  choice: у меня не будет ни одного сына, который похоронил бы меня
  rationale: ἕξω здесь — будущее время от ἔχω («буду иметь»), а не числительное «шесть»; τινά τῶν υἱῶν — «кого-либо/одного из сыновей», а θάπτοντα обозначает сына в роли того, кто совершит погребение. Объект «меня» подразумевается контекстом смерти матери и необходим для естественного русского выражения.
- source_word: τούτῳ τῷ θρήνῳ
  choice: такими словами
  rationale: Буквально «этим плачем». Поскольку непосредственно приведено содержание предполагаемого плача, «такими словами» естественно связывает цитату с авторским сообщением, не ослабляя скорбного смысла.
- source_word: οὐδένα ὀλοφύρετο
  choice: никого из них не оплакивала
  rationale: Глагол означает скорбно оплакивать; дополнение «из них» ясно отсылает к сыновьям и естественно по-русски.
- source_word: ἡ ἱερὰ καὶ θεοσεβὴς μήτηρ
  choice: святая и богобоязненная мать
  rationale: ἱερά передаёт религиозно-нравственную святость, а θεοσεβής — явное благоговение перед Богом; традиционное «богобоязненная» сохраняет теоцентрический смысл.
theological_decisions:
- issue: Значение θεοσεβής
  choice: богобоязненная
  alternative: благочестивая
  rationale: Выбранный вариант прямо сохраняет направленность почитания к Богу, тогда как «благочестивая» может звучать более обобщённо.
- issue: Первое лицо в предполагаемом плаче
  choice: если я умру, у меня не будет
  alternative: если она умрёт, у неё не будет
  rationale: Формы ἀποθάνω и ἕξω имеют первое лицо единственного числа. Несмотря на резкий переход к голосу матери, текстовая перспектива сохранена, а не сглажена до третьего лица.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Кавычки показывают, что начальная фраза представляет содержание плача, который мать, согласно следующему сообщению, не произнесла. Конечная запятая сохранена, поскольку стих синтаксически продолжается далее.
