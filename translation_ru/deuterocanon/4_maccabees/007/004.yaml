  yaml_path: translation/deuterocanon/4_maccabees/007/004.yaml
  text: No city under siege ever held out against many and varied siege engines as that most holy man[a], while his sacred soul was being burned by tortures and the wheel[b], stirred up those besieging him through the reason that defends godliness.
translation:
  language: ru
  text: Ни один город, когда-либо находившийся в осаде, не выдержал столь многих и разнообразных осадных орудий, как тот святейший человек поколебал осаждавших его, когда истязания и орудия пытки[a] жгли его священную душу, — благодаря разуму, стоящему на защите благочестия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово может обозначать приспособления для выкручивания тела — например, дыбы — или другие орудия пытки; точный вид устройства неизвестен.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «посредством разума, защищающего благочестие». В греческом подчёркнут разум как сила, благодаря которой мученик противостоит страданиям.'
    reason: preserve_ambiguity
lexical_decisions:
- source_word: πόλις
  choice: город
  rationale: Сохраняет прямой образ осаждённого города.
- source_word: πολλοῖς καὶ ποικίλοις μηχανήμασιν
  choice: множества разнообразных осадных орудий
  rationale: Контекст осады позволяет естественно конкретизировать μηχανήματα как осадные орудия.
- source_word: ἀντέσχεν
  choice: выдерживал натиск
  rationale: Передаёт стойкое сопротивление нападению и поддерживает военную метафору.
- source_word: πανάγιος ἐκεῖνος
  choice: тот всесвятой муж
  rationale: Передаёт усиленное значение πανάγιος; слово «муж» добавлено для естественной русской субстантивации мужского прилагательного без идентификации персонажа по имени.
- source_word: τὴν ἱερὰν ψυχὴν
  choice: его священную душу
  rationale: Сохраняет возвышенную сакральную характеристику души.
- source_word: αἰκισμοῖς
  choice: истязаниями
  rationale: Обозначает жестокое мучение и естественно звучит в контексте мученичества.
- source_word: στρέβλαις
  choice: орудиями пытки
  rationale: Точный вид приспособлений неясен; обобщённый перевод не создаёт ложной конкретности.
- source_word: πυρπολούμενος
  choice: жгли
  rationale: Сохраняет яркий образ обжигания или сожжения, синтаксически относя его к душе, как в греческом тексте.
- source_word: ἐκίνησεν
  choice: поколебал
  rationale: Передаёт воздействие мученика на мучителей и удачно продолжает образ осады, не уточняя сверх текста характер их реакции.
- source_word: τοὺς πολιορκοῦντας
  choice: осаждавших его
  rationale: Сохраняет последовательную метафору, в которой мучители представлены как осаждающие.
- source_word: λογισμόν
  choice: разум
  rationale: Это ключевое понятие 4 Маккавейской книги — разумная способность, противостоящая страстям.
- source_word: ὑπερασπίζοντα τῆς εὐσεβείας
  choice: стоящему на защите благочестия
  rationale: Передаёт активную защиту благочестия и настоящее значение причастия без конфессионального уточнения.
theological_decisions:
- issue: Передача εὐσέβεια
  choice: благочестие
  alternative: богопочитание
  rationale: «Благочестие» в современном литературном русском обозначает почтительную верность Богу и соответствующую жизнь, сохраняя широту греческого понятия.
- issue: Передача λογισμός
  choice: разум
  alternative: разумная решимость
  rationale: «Разум» сохраняет центральную для книги тему власти разумной способности над страстями; вариант «разумная решимость» сильнее толкует понятие.
- issue: Функция διὰ τὸν ... λογισμόν
  choice: благодаря разуму
  alternative: через разум
  rationale: διὰ с винительным здесь допускает причинно-инструментальный оттенок. «Благодаря» естественно по-русски, но не исключает представления о разуме как действующей силе.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной риторикой. Сохранена развёрнутая метафора осады и намеренно не конкретизировано неясное название орудий пытки.
