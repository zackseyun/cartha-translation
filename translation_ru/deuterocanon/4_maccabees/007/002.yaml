lexical_decisions:
- source_word: κατακλυζόμενος
  choice: затопляемый
  rationale: Причастие буквально передаёт образ потопа или наводнения. «Затопляемый» сохраняет водную метафору и её связь с последующим образом бурных волн.
- source_word: ἀπειλαῖς
  choice: угрозами
  rationale: Прямое и естественное обозначение словесных угроз в современном русском языке.
- source_word: καταντλούμενος
  choice: захлёстываемый
  rationale: Редкий глагол продолжает образ воды, обрушивающейся на человека. В сочетании с «бурными волнами» слово «захлёстываемый» звучит естественно и передаёт насильственное погружение.
- source_word: βασάνων
  choice: мучений
  rationale: В контексте мученичества речь идёт о тяжёлых страданиях, причиняемых извне. «Мучений» сохраняет интенсивность, не сужая значение до конкретной техники пытки.
- source_word: τρικυμίαις
  choice: бурными волнами
  rationale: Существительное обозначает сильное волнение моря, бурю или штормовой вал. «Бурными волнами» ясно продолжает морскую метафору и остаётся понятным современному читателю.
- source_word: τοῦ τυράννου
  choice: тирана
  rationale: Родительный падеж естественно передаёт принадлежность угроз; «тиран» сохраняет нравственную характеристику правителя в исходном тексте.
