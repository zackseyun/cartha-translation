base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/006.yaml
  text: O priest[a], worthy of the priesthood, you did not defile your sacred teeth, nor did you make your stomach—which had room for godliness and purity—a partner in defiling food.
translation:
  language: ru
  text: О священник, достойный священства! Ты не осквернил своих священных зубов и не приобщил чрево, в котором нашли место благочестие и чистота, к оскверняющему вкушению.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не сделал чрево участником вкушения оскверняющей пищи». Греческое слово обозначает участие во вкушении, приносящем ритуальное или нравственное осквернение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ ἄξιε τῆς ἱερωσύνης ἱερεῦ
  choice: О священник, достойный священства!
  rationale: Сохраняются и звательное обращение, и риторически усиленная похвала, выраженная повторением однокоренных понятий «священник» и «священство».
- source_word: ἐμίανας
  choice: осквернил
  rationale: Глагол передаёт культовое и нравственное осквернение и поддерживает лексику чистоты во всём предложении.
- source_word: τοὺς ἱεροὺς ὀδόντας
  choice: священных зубов
  rationale: Сохранён намеренно яркий и конкретный телесный образ; «священных» передаёт культовый оттенок ἱερούς.
- source_word: θεοσέβειαν
  choice: благочестие
  rationale: Слово естественно выражает почтительное отношение и преданность Богу, не сужая смысл до одного чувства страха или почтения.
- source_word: καθαρισμόν
  choice: чистоту
  rationale: В контексте пищевой верности существительное обозначает состояние культовой и нравственной чистоты; русский вариант естественно сочетается с «благочестием».
- source_word: χωρήσασαν γαστέρα
  choice: чрево, вместившее
  rationale: Причастная конструкция и образ вместилища сохранены. «Чрево» соответствует возвышенному риторическому регистру лучше, чем бытовое «желудок».
- source_word: ἐκοινώνησας
  choice: не приобщил ... к
  rationale: 'Передана каузативно-ассоциативная мысль: священник не сделал своё чрево участником оскверняющего вкушения.'
- source_word: μιεροφαγίᾳ
  choice: оскверняющей пище
  rationale: Редкое сложное слово связано с вкушением того, что оскверняет. Основной текст даёт естественную метонимическую передачу, а сноска сохраняет возможный акцент на самом вкушении.
theological_decisions:
- issue: Культовая чистота образно относится к зубам, чреву и пище
  choice: Сохранить конкретные образы «священных зубов» и чрева, вместившего благочестие и чистоту
  alternative: Обобщить как отказ от нечистой пищи
  rationale: Греческий текст намеренно телесен и риторически выразителен. Сохранение образов передаёт верность священника требованиям святости, не превращая высказывание в отвлечённое резюме.
- issue: Значение μιεροφαγίᾳ
  choice: В основном тексте — «к оскверняющей пище»
  alternative: «к оскверняющему вкушению» или «не участвовал в оскверняющем вкушении»
  rationale: Сложное существительное допускает акцент как на оскверняющей пище, так и на акте её вкушения. Неопределённость отмечена в сноске, без догматического разрешения.
translation_notes:
  register: Современный литературный русский с возвышенной риторической окраской. «Чрево» выбрано вместо более бытового «желудок», чтобы согласовать телесный образ с торжественным обращением; синтаксис остаётся ясным для современного читателя.
