- source_word: κατʼ οὐδένα τρόπον
  choice: ни в чём не
  rationale: Передаёт усиленное отрицание естественным современным русским оборотом.
- source_word: μετέτρεψεν
  choice: не отклонил
  rationale: Глагол означает поворачивать или отклонять; выбранный вариант сохраняет образ изменения курса.
- source_word: τοὺς τῆς εὐσεβείας οἴακας
  choice: рули благочестия
  rationale: Сохранены множественное число и конкретная морская метафора; εὐσέβεια здесь обозначает верность Богу, выраженную благочестивой жизнью.
- source_word: ἕως οὗ ἔπλευσεν
  choice: пока не приплыл
  rationale: Естественно передаёт временной предел и сохраняет морской образ греческого глагола.
- source_word: ἐπὶ τὸν ... λιμένα
  choice: в гавань
  rationale: В контексте плавания обозначает прибытие к месту назначения; «гавань» поддерживает возвышенный метафорический регистр.
- source_word: τὸν τῆς θανάτου νίκης λιμένα
  choice: гавань победы над смертью
  rationale: Контекст мученической стойкости благоприятствует пониманию как победы над смертью, хотя сжатая последовательность родительных падежей допускает другую формальную связь.
