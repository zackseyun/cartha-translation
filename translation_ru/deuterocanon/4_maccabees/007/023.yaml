lexical_decisions:
- source_word: μόνος
  choice: лишь
  rationale: 'Передаёт исключительный и эмфатический смысл: это утверждение относится только к описанному человеку.'
- source_word: σοφὸς
  choice: мудрый
  rationale: В этико-философском контексте слово обозначает нравственную и разумную мудрость.
- source_word: σώφρων
  choice: владеющий собой
  rationale: Выражает самообладание и обуздание побуждений; контекст господства над страстями поддерживает именно этот оттенок.
- source_word: ἀνδρεῖός
  choice: мужественен
  rationale: Передаёт добродетель стойкости и отваги; в данном философском контексте естественнее, чем более ситуативное «храбр».
- source_word: κύριος
  choice: господин
  rationale: Здесь это не божественный титул, а обозначение господства и власти над страстями.
- source_word: τῶν παθῶν
  choice: страстей
  rationale: В 4 Маккавейской πάθη — страсти и сильные побуждения, которые должны подчиняться разуму, а не просто нейтральные эмоции или внешние страдания.
theological_decisions:
- issue: Родовое употребление формы мужского рода в нравственном изречении
  choice: человек
  alternative: мудрый и владеющий собой
  rationale: Существительное «человек» естественно оформляет субстантивированные греческие прилагательные и сохраняет родовой смысл; примечание сообщает, что греческая форма грамматически мужского рода.
- issue: Значение κύριος вне божественного титула
  choice: господин страстей
  alternative: властен над страстями
  rationale: Именное сказуемое сохраняет образ господства и компактную риторическую структуру оригинала, не представляя κύριος как божественный титул.
translation_notes:
  register: Современный литературный русский язык с достоинством философского изречения. Тире делает естественной для русского языка бессоюзную последовательность двух сказуемых и сохраняет выразительную сжатость греческого текста.
