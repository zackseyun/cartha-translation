  text: by the spirit of reason[a], and by Isaac-like reason he nullified the many-headed wheel.
translation:
  language: ru
  text: духом разума и разумом, подобным Исаакову, он лишил силы многоглавое пыточное колесо[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многоглавое орудие пытки». Греческое στρέβλα обозначает орудие пытки; его точное устройство здесь не вполне ясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματι
  choice: духом
  rationale: Сохраняет образ внутренней движущей силы и не превращает выражение в прямое указание на Святого Духа.
- source_word: λογισμοῦ / λογισμῷ
  choice: разума / разумом
  rationale: Повтор одного корня передаёт центральное для 4 Маккавейской книги понятие разумного начала, властвующего над страстями.
- source_word: Ἰσακείῳ
  choice: подобным Исаакову
  rationale: Прилагательное выражает сходство с Исааком, а не простую принадлежность; такая формулировка естественна по-русски и сохраняет аллюзию.
- source_word: πολυκέφαλον
  choice: многоглавое
  rationale: Буквально передаёт яркий образ сложного прилагательного.
- source_word: στρέβλαν
  choice: пыточное колесо
  rationale: Передаёт конкретный образ орудия пытки, не скрывая при этом в сноске некоторую неопределённость относительно его точного устройства.
- source_word: ἠκύρωσεν
  choice: лишил силы
  rationale: Выражает значение «сделал недействующим, бессильным» естественнее для современного русского языка, чем буквальное «аннулировал».
theological_decisions:
- issue: Смысл слова «дух» в выражении τῷ πνεύματι τοῦ λογισμοῦ
  choice: внутренняя движущая сила разумной стойкости
  alternative: Святой Дух или просто умственная способность
  rationale: Контекст прославляет господство разума над страданиями и страстями; непосредственных оснований видеть здесь указание на Святого Духа нет.
- issue: Характер отсылки к Исааку
  choice: 'сравнение с Исааком: «разумом, подобным Исаакову»'
  alternative: «разумом Исаака» или развёрнутое пояснение о подражании Исааку
  rationale: Форма прилагательного указывает на подобие; перевод сохраняет аллюзию, не дополняя её толкованием.
