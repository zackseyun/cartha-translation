  yaml_path: translation/deuterocanon/4_maccabees/007/011.yaml
  text: For just as the father Aaron[a], armed with the censer, running through the midst of the multitude, overcame the fire-bearing angel,
translation:
  language: ru
  text: Ибо, подобно тому как праотец Аарон, вооружённый кадильницей, пробежал через толпу народа и одолел огненосного ангела[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные передачи: «ангел огня»; в интерпретационном смысле — «ангел-губитель». Вероятна отсылка к тому, как Аарон остановил мор среди народа (Чис. 16:46–48).'
    reason: Греческое ἐμπυριστής обозначает ангела, связанного с огнём, но не уточняет характер этой связи. Сноска сохраняет лексическую неоднозначность и осторожно поясняет вероятную отсылку.
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Ведь подобно тому как
  rationale: «Ведь» передаёт пояснительное γάρ, а «подобно тому как» сохраняет сравнительную силу ὥσπερ и естественно вводит продолжающееся сравнение.
- source_word: ὁ πατὴρ Ἀαρὼν
  choice: праотец Аарон
  rationale: πατήρ употреблено как почётное обозначение предка народа; «праотец» естественно передаёт этот смысл по-русски, не превращая его в указание на непосредственное отцовство.
- source_word: τῷ θυμιατηρίῳ καθωπλισμένος
  choice: вооружённый кадильницей
  rationale: Творительный падеж передаёт инструментальное значение дательного, «кадильница» сохраняет культовый образ, а «вооружённый» — намеренную воинскую метафору καθωπλισμένος.
- source_word: διὰ τοῦ ἔθνοπλήθους ἐπιτρέχων
  choice: пробежал сквозь многолюдную толпу
  rationale: Редкое сложное ἔθνοπλῆθος обозначает многочисленное скопление народа; «сквозь многолюдную толпу» передаёт движение через неё, а личная форма «пробежал» делает греческий причастный оборот естественным по-русски.
- source_word: τὸν ἐμπυριστὴν ἄγγελον
  choice: огненосного ангела
  rationale: «Огненосный» близко передаёт связь ἐμπυριστής с огнём, но не уточняет сверх греческого текста, был ли это ангел огня, возжигатель кары или ангел-губитель.
- source_word: ἐνίκησεν
  choice: одолел
  rationale: «Одолел» сохраняет язык победы νικάω, звучит достойно и естественно в данном повествовательном контексте.
theological_decisions:
- issue: Кем является ангел, которого одолел Аарон
  choice: огненосный ангел
  alternative: ангел огня; ангел-губитель; ангел, насылающий огонь
  rationale: Греческое выражение связывает ангела с огнём, но прямо не называет его губителем. Вероятная отсылка к заступничеству Аарона во время поражения народа в Числах 16 пояснена в сноске, а не внесена как однозначное толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены воинский и культовый образы. Конечная запятая оставлена, поскольку стих представляет собой первую часть сравнения, продолжающегося далее.
