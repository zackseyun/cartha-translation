  text: Therefore[a], nothing is opposed by the fact that some appear to be ruled by passions because of weak reason.
translation:
  language: ru
  text: Итак, то, что некоторые, по-видимому, находятся во власти страстей из-за слабости разума, нисколько этому не противоречит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Итак, то, что некоторые, как кажется, находятся во власти страстей вследствие слабого рассуждения, нисколько этому не противоречит».'
    reason: «Как кажется» — более близкий порядок слов для φαίνεσθαι; «слабое рассуждение» передаёт λογισμός как процесс или способность рассуждать.
lexical_decisions:
- source_word: οὐδὲν οὖν ἐναντιοῦται
  choice: Итак, тому не противоречит
  rationale: οὖν вводит вывод, а ἐναντιοῦται обозначает противоречие ранее высказанному положению. Русская безличная конструкция естественно передаёт смысл греческого οὐδὲν без неясного буквального «ничто не противоречит».
- source_word: τὸ φαίνεσθαί τινας
  choice: то, что некоторые, как кажется
  rationale: Субстантивированный инфинитив передан придаточной конструкцией, а вводное «как кажется» сохраняет различие между видимостью и действительностью.
- source_word: παθοκρατεῖσθαι
  choice: оказываются во власти страстей
  rationale: Передаёт залог и образ господства страстей над человеком, сохраняя философскую лексику книги и звуча естественно по-русски.
- source_word: διὰ τὸν ἀσθενῆ λογισμόν
  choice: из-за слабости разума
  rationale: διά с винительным выражает причину. Отвлечённая конструкция «слабость разума» естественнее, чем «слабый разум», и сохраняет λογισμός как способность разумного суждения.
theological_decisions:
- issue: Философско-антропологическое противопоставление разума и страстей
  choice: «во власти страстей» и «слабость разума»
  alternative: «побеждены чувствами» и «слабость рассуждения»
  rationale: Выбранная формулировка сохраняет центральную для 4 Маккавейской книги тему господства разума над страстями и не привносит более поздних конфессиональных категорий.
- issue: Статус кажущегося контрпримера
  choice: «как кажется»
  alternative: Опустить оттенок видимости и перевести как установленный факт
  rationale: φαίνεσθαι выражает именно видимость; перевод не должен превращать кажущееся господство страстей в безусловно утверждаемый факт.
translation_notes:
  register: Современный литературный русский язык с умеренно философским, но общедоступным регистром. Формулировка сохраняет логическую связь с предшествующим рассуждением и терминологическое противопоставление разума и страстей.
