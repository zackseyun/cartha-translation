base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/008.yaml
  text: Such men must be those who establish the law with their own blood[a], and defend it with noble sweat through sufferings unto death.
translation:
  language: ru
  text: Именно такими должны быть те, кто собственной кровью утверждает закон[a] и доблестным потом защищает его, претерпевая страдания вплоть до смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поддерживает закон»; греческий глагол может означать «создавать», «производить» или «осуществлять», но здесь, вероятно, речь об утверждении закона верными поступками, а не о его законодательном установлении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιούτους
  choice: именно такими
  rationale: Передаёт указание на людей такого рода и естественно сочетается по-русски с конструкцией «должны быть те, кто».
- source_word: δεῖ εἶναι
  choice: должны быть
  rationale: Сохраняет выраженную в греческом необходимость без излишне тяжеловесной безличной конструкции.
- source_word: τοὺς δημιουργοῦντας τὸν νόμον
  choice: те, кто… утверждает закон
  rationale: Здесь δημιουργέω едва ли означает законодательное создание закона; в контексте верности до смерти речь идёт о том, чтобы своей жизнью утверждать и подтверждать его силу.
- source_word: ἰδίῳ αἵματι
  choice: собственной кровью
  rationale: Сохраняет инструментальное значение дательного падежа и сильный телесный образ оригинала.
- source_word: γενναίῳ ἱδρῶτι
  choice: доблестным потом
  rationale: Сохраняет конкретный параллельный образ крови и пота; «доблестным» передаёт мужество и благородство, выраженные γενναῖος.
- source_word: τοῖς μέχρι θανάτου πάθεσιν
  choice: претерпевая страдания вплоть до смерти
  rationale: Естественно выражает переносимые мучения и сохраняет смерть как предельную черту, не уточняя сверх текста, наступила ли она уже.
- source_word: ὑπερασπίζοντας
  choice: защищает его
  rationale: Передаёт значение защиты и борьбы в защиту; местоимение прямо отсылает к ранее названному закону.
theological_decisions:
- issue: Смысл δημιουργοῦντας τὸν νόμον
  choice: утверждает закон
  alternative: поддерживает закон; осуществляет закон; создаёт закон
  rationale: Контекст мученической верности указывает не на принятие нового законодательства, а на утверждение действенности закона собственной жизнью. При этом сноска сохраняет более широкий смысловой диапазон глагола.
- issue: Отсылка к лицам мужского пола
  choice: те, кто
  alternative: такие мужи
  rationale: Русская конструкция грамматически естественна и не вводит явно универсализирующего толкования; указательный смысл τοιούτους сохраняется словом «такими».
- issue: Написание νόμον
  choice: закон со строчной буквы
  alternative: Закон с прописной буквы
  rationale: Строчная буква соответствует нейтральному обозначению в греческом тексте и не навязывает позднейшую типографскую богословскую маркировку.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Конкретная риторическая пара «кровью… потом» сохранена, хотя сочетание «доблестным потом» намеренно остаётся ярким и несколько необычным, как и в греческом оригинале.
