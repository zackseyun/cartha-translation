  text: But all who care for godliness with their whole heart[b][a], these alone are able to master the passions of the flesh.
translation:
  language: ru
  text: Но все, кто всем сердцем заботится о благочестии, — только они способны господствовать над страстями плоти.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над телесными страстями».'
    reason: Лексическая альтернатива для τῶν τῆς σαρκὸς παθῶν; она яснее выражает связь с телесными влечениями, но менее буквально передаёт σάρξ.
lexical_decisions:
- source_word: ἀλλʼ
  choice: Но
  rationale: Передаёт противопоставление предшествующему рассуждению естественным русским союзом.
- source_word: ὅσοι
  choice: те, кто
  rationale: Естественно обозначает весь класс людей, о которых говорится в греческом тексте.
- source_word: τῆς εὐσεβείας
  choice: о благочестии
  rationale: «Благочестие» передаёт преданность Богу и верность Его закону, оставаясь понятным и не привнося конфессионально узкого смысла.
- source_word: προνοοῦσιν
  choice: заботится
  rationale: Глагол выражает деятельную заботу, внимание и осознанную устремлённость; сочетание «заботиться о благочестии» сохраняет эту направленность.
- source_word: ἐξ ὅλης καρδίας
  choice: всем сердцем
  rationale: Естественная русская формула, точно выражающая цельность и искренность внутренней преданности.
- source_word: οὗτοι μόνοι
  choice: только те
  rationale: 'Сохраняет подчёркнутое ограничение: такая способность принадлежит именно этой группе.'
- source_word: δύνανται κρατεῖν
  choice: способны господствовать над
  rationale: Передаёт не просто сдерживание, а сильное значение обладания властью и контроля над страстями.
- source_word: τῶν τῆς σαρκὸς παθῶν
  choice: над страстями плоти
  rationale: «Страсти» соответствует нравственно-философскому значению πάθη, а «плоть» сохраняет антропологический термин σάρξ без истолкования его как «греховной природы».
theological_decisions:
- issue: Передача σάρξ в этико-антропологическом контексте
  choice: плоть
  alternative: тело / телесные
  rationale: Греческий текст связывает страсти с человеческой плотью, но не отождествляет σάρξ напрямую с «греховной природой». Буквальное «плоть» сохраняет термин и богословскую открытость текста; более естественный вариант «телесные» указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством нравственно-философского рассуждения. Синтаксис прост и понятен; «господствовать над» сохраняет сильный смысл κρατεῖν, а «страсти плоти» — терминологическую напряжённость оригинала.
