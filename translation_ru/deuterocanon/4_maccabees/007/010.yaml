translation:
  language: ru
  text: О Елеазар, старец, сильнее пыток[a], старец, сильнее огня[b], и царь, превыше страданий![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мучений». В этом контексте греческое слово может обозначать именно истязания, пытки.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово может также означать «крепче», «могущественнее», «энергичнее» или «напряжённее».
    reason: lexical_ambiguity
  - marker: c
    text: Слова «старец» и «царь» здесь — возвышенные почётные обращения к Елеазару; «царь» не означает, что он занимал царскую должность.
    reason: cultural_note
lexical_decisions:
- source_word: βασάνων
  choice: пыток
  rationale: В контексте мученичества слово обозначает именно истязания, а не отвлечённые испытания; «пыток» передаёт это прямо и естественно.
- source_word: βιαιότερε
  choice: сильнее
  rationale: Буквально сравнительная форма связана с насилием или силой. Здесь она прославляет нравственную силу Елеазара, превосходящую насилие пыток; буквальное «неистовее» по-русски исказило бы смысл.
- source_word: γέρων
  choice: старец
  rationale: Сохраняет уважительный оттенок обращения к пожилому человеку и соответствует возвышенному строю фразы.
- source_word: πυρός
  choice: огня
  rationale: Прямое соответствие греческому слову; в повествовательном контексте речь связана с мучением огнём.
- source_word: εὐτονώτερε
  choice: стойче
  rationale: Слово может выражать напряжённость, крепость, энергичность или непреклонность. «Стойче» естественно передаёт восхваляемую здесь внутреннюю твёрдость, не устраняя лексической неоднозначности, отмеченной в сноске.
- source_word: πρεσβῦτα
  choice: старец
  rationale: Второе близкое по смыслу уважительное обращение к пожилому человеку. Повтор сохраняет параллелизм оригинала и не вводит отсутствующего должностного значения.
- source_word: παθῶν
  choice: страданий
  rationale: В данном ряду с пытками и огнём речь идёт о переносимых страданиях, а не о внутренних страстях.
- source_word: μέγιστε
  choice: превыше
  rationale: Превосходная степень с родительным сравнения выражает превосходство над страданиями; «превыше» сохраняет возвышенность и параллельную сравнительную структуру.
- source_word: βασιλεῦ
  choice: царь
  rationale: Сохранена буквальная метафора почётного обращения, обозначающая превосходство Елеазара над страданиями, а не политическую власть.
- source_word: Ἐλεαζάρ
  choice: Елеазар
  rationale: Традиционная русская форма имени.
theological_decisions:
- issue: Метафорические почётные обращения к Елеазару
  choice: Сохранить ряд «старец… старец… царь» как возвышенные обращения.
  alternative: 'Передать всё описательно: «ты сильнее пыток, стойче огня и выше страданий».'
  rationale: Греческий текст построен как цепь обращений и кульминационно называет Елеазара «царём». Сохранение этой риторики не приписывает ему политического или богословского статуса сверх сказанного в тексте.
- issue: Смысл εὐτονώτερε в сравнении с огнём
  choice: «стойче огня»
  alternative: «сильнее огня» или «пылче огня»
  rationale: «Стойче» соответствует контексту мученической непреклонности, тогда как «пылче» могло бы необоснованно перенести образ на эмоциональный пыл. Возможная семантика силы и напряжённости указана в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной, восклицательной риторики оригинала. Имя вынесено в начало ради естественного русского обращения; тире вводит последующую цепь почётных наименований. Повтор «старец» намеренно сохраняет параллельные греческие обращения γέρων и πρεσβύτης.
