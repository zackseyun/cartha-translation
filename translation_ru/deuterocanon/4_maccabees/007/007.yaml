    reason: lexical_alternative
lexical_decisions:
- source_word: ὦ
  choice: О ты
  rationale: Передаёт частицу обращения и сохраняет возвышенный риторический тон; местоимение делает обращение естественным по-русски.
- source_word: σύμφωνε
  choice: созвучный
  rationale: Сохраняет заложенный в σύμφωνος образ согласия, созвучия и вместе с тем естественно сочетается с дательным «закону».
- source_word: νόμου
  choice: закону
  rationale: Родительный при σύμφωνε передаётся нормативным русским управлением «созвучный чему». Строчная буква не превращает слово в формальный титул, хотя в контексте имеется в виду иудейский закон.
- source_word: καὶ
  choice: и
  rationale: Прямо передаёт соединительный союз между двумя обращениями-характеристиками.
- source_word: φιλόσοφε
  choice: философ
  rationale: Сохраняет явную философскую лексику 4 Маккавейской и не заменяет её толкованием вроде «мудрец».
- source_word: θείου
  choice: божественной
  rationale: Формально передаёт θεῖος и сохраняет возможность понимать определение как относящееся к Богу или как характеризующее благочестивую жизнь.
- source_word: βίου
  choice: жизни
  rationale: Передаёт βίος в его компактной форме; возможное значение «образ жизни» указано в сноске, чтобы не устранять смысловую ёмкость греческого выражения.
theological_decisions:
- issue: Передача θείου βίου
  choice: божественной жизни
  alternative: благочестивого образа жизни; жизни, посвящённой Богу
  rationale: Компактная формулировка сохраняет возвышенность и неоднозначность греческого словосочетания, не уточняя без необходимости, означает ли оно «божественную жизнь» или жизнь, отличающуюся преданностью Богу.
- issue: Оформление νόμου как названия
  choice: закону
  alternative: Закону
  rationale: В греческом письме нет смыслового различения прописной и строчной буквы, а контекстуальная отсылка к иудейскому Закону понятна и без введения типографского титула.
translation_notes:
  register: Возвышенное риторическое обращение передано современной литературной речью. Синтаксическая краткость исходного греческого сохранена; «созвучный» удерживает метафору гармонии, а «философ» — характерную для книги философскую терминологию.
