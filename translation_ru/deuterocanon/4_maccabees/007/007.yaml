  text: О ты, созвучный закону[a] и философ божественного образа жизни[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласный с законом», «живущий в согласии с законом». Греческое слово связано с образом созвучия и согласованности.'
