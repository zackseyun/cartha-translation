lexical_decisions:
- source_word: ἐπεὶ
  choice: ведь
  rationale: Союз вводит обоснование предшествующей мысли; «ведь» естественно сохраняет пояснительно-аргументативную связь.
- source_word: τίς
  choice: кто
  rationale: Вопросительное местоимение начинает риторический вопрос.
- source_word: πρὸς ὅλον τὸν τῆς φιλοσοφίας κανόνα
  choice: в согласии со всем правилом философии
  rationale: πρός при κανών выражает соответствие норме; «всё правило» сохраняет значение полноты у ὅλον и нормативный смысл κανών.
- source_word: εὐσεβῶς φιλοσοφῶν
  choice: благочестиво живя как философ
  rationale: В данном нравственно-философском контексте φιλοσοφεῖν означает не только рассуждать, но и вести философский образ жизни. Такой перевод избегает бытового оттенка русского «философствовать» и сохраняет религиозную характеристику εὐσεβῶς.
- source_word: πεπιστευκὼς θεῷ
  choice: доверившись Богу
  rationale: Перфектное причастие указывает на состоявшееся и сохраняющее силу упование. Русский дательный после «довериться» прямо соответствует θεῷ и передаёт личное доверие.
theological_decisions:
- issue: Значение πιστεύω в контексте философского мученичества
  choice: доверившись Богу
  alternative: поверив Богу
  rationale: Контекст предполагает устойчивую опору на Бога, а не только признание истинности Его слов; при этом перевод не добавляет конфессионально обусловленного содержания.
translation_notes:
