base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/016.yaml
  text: If[a], then, an old man despised tortures even to the point of death because of piety, then surely pious reason is ruler over the passions.
translation:
  language: ru
  text: Итак, если старец ради благочестия[a] презрел пытки вплоть до смерти, то, бесспорно, благочестивый разум властвует над страстями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодаря благочестию». Греческое выражение может указывать как на цель, так и на причину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γέρων
  choice: старец
  rationale: Существительное обозначает пожилого мужчину. «Старец» сохраняет единственное число, мужской род и достойный литературный тон контекста, не вводя значения церковной должности.
- source_word: τῶν μέχρι θανάτου βασάνων
  choice: пытки вплоть до смерти
  rationale: βάσανοι здесь означает жестокие телесные мучения, то есть пытки; μέχρι θανάτου указывает на их предельную тяжесть и продолжение вплоть до смерти.
- source_word: περιεφρόνησεν
  choice: презрел
  rationale: Глагол выражает сознательное пренебрежение и отношение к пыткам как к чему-то, не способному поколебать верность. «Презрел» сохраняет сильную риторическую окраску оригинала.
- source_word: διʼ εὐσέβειαν
  choice: ради благочестия
  rationale: εὐσέβεια обозначает благоговейную преданность Богу. Оборот «ради благочестия» естественен по-русски и передаёт целевую либо мотивирующую сторону выражения; причинный оттенок отмечен в сноске.
- source_word: ὁμολογουμένως
  choice: бесспорно
  rationale: Наречие представляет вывод как общепризнанный и не вызывающий возражений. «Бесспорно» естественно передаёт эту риторическую силу.
- source_word: ἡγεμὼν ἐστιν
  choice: властвует
  rationale: В философском контексте выражение обозначает руководящую власть и господство над внутренними побуждениями. Глагольная передача «властвует» звучит естественно по-русски и сохраняет идею управления.
- source_word: τῶν παθῶν
  choice: над страстями
  rationale: πάθη — ключевой философский термин книги, обозначающий страсти и сильные внутренние влечения, а не страдания вообще. «Страсти» сохраняет терминологическую связь с аргументом произведения.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: благочестивый разум
  rationale: Выражение называет разум, направляемый благоговейной преданностью Богу. Перевод сохраняет структуру прилагательное—существительное и не привносит позднейших доктринальных категорий.
theological_decisions:
- issue: Передача ключевого философско-богословского выражения ὁ εὐσεβὴς λογισμός
  choice: благочестивый разум
  alternative: разум, направляемый благочестием
  rationale: Выбранный вариант краток, последовательно воспроизводит программную формулу книги и сохраняет одновременно рациональную и религиозную стороны понятия.
- issue: Смысл διʼ εὐσέβειαν
  choice: ради благочестия
  alternative: благодаря благочестию; из-за благочестия
  rationale: Греческий оборот допускает целевой и причинный оттенки. Основной текст естественно выражает мотив и цель стойкости старца, а сноска сохраняет причинное прочтение, не устраняя подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим мученическому и философскому контексту. Слова «презрел», «благочестивый разум» и «страсти» сохраняют риторическую и терминологическую плотность оригинала; синтаксис условного вывода передан ясно и без лишнего повторения.
