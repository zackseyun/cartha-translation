lexical_decisions:
- source_word: οὕτως
  choice: Так
  rationale: Кратко и естественно связывает этот итог с предшествующим рассказом, сохраняя риторическую функцию греческого слова.
- source_word: ὁ Ἀαρωνίδης
  choice: потомок Аарона
  rationale: Передаёт принадлежность Елеазара к роду Аарона понятным современным выражением; буквальная форма поясняется в сноске.
- source_word: Ἐλεάζαρος
  choice: Елеазар
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: διὰ τοῦ πυρός
  choice: от огня
  rationale: В сочетании с причастием естественно передаёт огонь как средство мучения и причину физического разрушения.
- source_word: ὑπερτηκόμενος
  choice: плавился
  rationale: Сохраняет яркий образ таяния или разрушения от сильного жара, заложенный в греческом глаголе, не ослабляя его до общего «страдал».
- source_word: οὐ μετετράπη
  choice: не изменил
  rationale: Передаёт отказ Елеазара изменить внутреннюю установку под действием мучений.
- source_word: τὸν λογισμόν
  choice: своего разумного решения
  rationale: Сочетание сохраняет как интеллектуальный оттенок λογισμός, важный для 4 Маккавейской книги, так и смысл твёрдого волевого решения в данном контексте.
theological_decisions:
- issue: Передача λογισμός в книге, где разум и его власть над страстями являются центральной темой
  choice: своего разумного решения
  alternative: своего рассуждения; своего намерения; своей решимости
  rationale: «Разумное решение» не сводит слово ни только к отвлечённому разуму, ни только к волевой стойкости, а удерживает обе стороны выражения. Сноска сохраняет допустимые смысловые варианты.
translation_notes:
  register: Современный литературный русский язык с достоинством и риторической краткостью оригинала. Образ «плавился от огня» намеренно сохранён как необычный, но понятный и соответствующий сильной образности греческого причастия.
