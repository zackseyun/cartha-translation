  yaml_path: translation/deuterocanon/4_maccabees/007/017.yaml
  text: But perhaps some might say[a], “Not all gain mastery over their passions[b], because not all have prudent reason.”
translation:
  language: ru
  text: 'Но, пожалуй, кто-нибудь мог бы сказать: «Не все одерживают верх над страстями[a], потому что не у всех здравый рассудок[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «берут страсти под контроль»; «побеждают страсти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не все обладают благоразумным рассудком»; «не у всех здравое суждение». Греческое слово λογισμός обозначает ключевое для рассуждения 4 Маккавейской понятие разума, направляющего страсти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴσως δʼ ἂν εἴποιέν τινες
  choice: Но, возможно, кто-нибудь скажет
  rationale: ἴσως и оптатив с ἄν вводят предполагаемое возражение. Русская формула сохраняет его вероятностный и риторический характер; δέ передано как «но».
- source_word: τῶν παθῶν
  choice: над страстями
  rationale: В контексте 4 Маккавейской πάθη — внутренние страсти, влечения и эмоциональные побуждения, которыми должен управлять разум, а не внешние страдания.
- source_word: οὐ πάντες περικρατοῦσιν
  choice: не все одерживают верх
  rationale: περικρατέω обозначает достижение господства или превосходства над чем-либо. «Одерживают верх» естественно сочетается с «над страстями» и сохраняет образ борьбы за власть.
- source_word: φρόνιμον
  choice: здравый
  rationale: Предикативное прилагательное характеризует рассудок как благоразумный, рассудительный и способный к верному практическому суждению. «Здравый» передаёт это без неестественного сочетания «благоразумный разум».
- source_word: τὸν λογισμόν
  choice: рассудок
  rationale: λογισμός — ключевое для книги понятие разумного суждения. «Рассудок» здесь обозначает действующую способность рационально оценивать и направлять поведение.
- source_word: φρόνιμον ἔχουσιν τὸν λογισμόν
  choice: не у всех здравый рассудок
  rationale: Оборот естественен по-русски и описывает качество рассудка, не утверждая, будто некоторые люди вообще лишены способности мыслить.
theological_decisions:
- issue: Связь нравственного самообладания с разумом
  choice: Неспособность одерживать верх над страстями в предполагаемом возражении связывается с тем, что рассудок не у всех здрав.
  alternative: Понимать слова лишь как утверждение, что не все пользуются рассудком благоразумно, либо как отрицание самой способности некоторых людей рассуждать.
  rationale: Конструкция ἔχουσιν с предикативным φρόνιμον прежде всего характеризует качество λογισμός. Перевод сохраняет антропологическое напряжение, но не усиливает фразу до отрицания человеческой разумности как таковой.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким философско-риторическим регистром. Формула «одерживают верх над страстями» передаёт борьбу за господство, а «здравый рассудок» избегает тяжеловесного и тавтологичного сочетания, сохраняя практико-нравственный оттенок φρόνιμος.
