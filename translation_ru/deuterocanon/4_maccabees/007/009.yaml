base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/009.yaml
  text: You[a], father, confirmed our law-abiding way by our endurance unto glory, and, speaking honorably of holiness, you did not abolish it, and by your deeds you certified the words of philosophy[b].
translation:
  language: ru
  text: Ты, отец, стойкостью утвердил нашу верность закону во славу[a]; величая святость, ты не упразднил её и своими делами подтвердил слова философии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для славы». Выражение εἰς δόξαν может указывать как на цель, так и на результат.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «доводы философии» или «учения философии». Греческое λόγοι может означать слова, рассуждения, доводы или учения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐνομίαν ἡμῶν
  choice: нашу верность закону
  rationale: εὐνομία обозначает правильную жизнь в согласии с законом и установленным им порядком. «Верность закону» естественно передаёт здесь не отвлечённую законность, а практическое соблюдение закона.
- source_word: διὰ τῶν ὑπομονῶν
  choice: стойкостью
  rationale: διά с родительным указывает на средство, а множественное ὑπομονῶν — на стойкое перенесение испытаний. В греческом нет притяжательного местоимения, поэтому перевод не уточняет, чья именно это стойкость.
- source_word: εἰς δόξαν
  choice: во славу
  rationale: Сохраняет направленность εἰς и допускает понимание славы как цели либо результата; эта неоднозначность пояснена в сноске.
- source_word: ἐκύρωσας
  choice: утвердил
  rationale: Глагол означает сделать действительным, прочным или авторитетным; «утвердил» подходит и к нравственному примеру, подтверждающему верность закону.
- source_word: ἁγιαστίαν
  choice: святость
  rationale: Редкое существительное обозначает святость или освящённость; «святость» ясно и уместно в религиозно-нравственном контексте.
- source_word: σεμνολογήσας
  choice: величая
  rationale: Причастие выражает возвышенную, почтительную речь о чём-либо. «Величая» передаёт как речевой оттенок, так и достойное почитание, не превращая выражение в отвлечённое «уважая».
- source_word: οὐ κατέλυσας
  choice: не упразднил
  rationale: καταλύω может означать разрушить, отменить или лишить силы. Здесь речь о том, что поступки отца не опровергли и не отменили исповедуемую им святость.
- source_word: διὰ τῶν ἔργων ἐπιστοποίησας
  choice: своими делами подтвердил
  rationale: Оборот подчёркивает подтверждение или удостоверение на основании дел. Притяжательное «своими» естественно соотносит дела с подлежащим «ты» и не меняет смысла.
- source_word: τοὺς τῆς φιλοσοφίας λόγους
  choice: слова философии
  rationale: λόγοι может обозначать слова, рассуждения, доводы или учения. Буквально прозрачный вариант сохраняет эту смысловую широту, а возможные значения указаны в сноске.
theological_decisions:
- issue: Значение φιλοσοφία в 4 Маккавейской книге
  choice: философия
  alternative: мудрость; разумное учение
  rationale: Книга намеренно пользуется эллинистической философской лексикой. «Философия» сохраняет её понятийный мир и не сводит термин к общей мудрости.
- issue: Чья стойкость подразумевается в διὰ τῶν ὑπομονῶν
  choice: не уточнять притяжательность
  alternative: твоей стойкостью; нашей стойкостью
  rationale: В греческом обороте нет притяжательного местоимения. Хотя обращение к отцу позволяет понимать стойкость как его собственную, грамматически это прямо не выражено, поэтому перевод сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном, соответствующим обращению к почитаемому отцу. Синтаксис слегка уплотнён за счёт точки с запятой, но остаётся понятным. Притяжательность при «стойкости» намеренно не добавлена, поскольку её нет в исходном тексте.
