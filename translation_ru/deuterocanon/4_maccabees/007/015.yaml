  yaml_path: translation/deuterocanon/4_maccabees/007/015.yaml
  text: O blessed old age[a], and venerable gray hair, and a law-abiding life, which a faithful seal of death brought to completion.
translation:
  language: ru
  text: О блаженная старость, почтенные седины и жизнь по Закону, которую верная печать смерти завершила![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которую истинная (или надёжная) печать смерти довела до конца». Греческое выражение сжато и может также означать, что смерть стала надёжным подтверждением такой жизни.'
    reason: Сохраняет лексическую неоднозначность πιστή («верная», «истинная», «надёжная») и метафорическую многозначность выражения σφραγὶς θανάτου … ἐτελείωσεν, не приписывая глаголу более узкий смысл «совершенства».
lexical_decisions:
- source_word: μακαρίου γήρως
  choice: блаженная старость
  rationale: «Блаженная» передаёт не просто счастливое состояние, а возвышенную похвалу достойной и завидной участи; «старость» прямо соответствует γῆρας.
- source_word: σεμνῆς πολιᾶς
  choice: почтенные седины
  rationale: Устойчивое и достойное русское выражение сохраняет метонимию греческого текста и оттенок почтения, заключённый в σεμνός.
- source_word: βίου νομίμου
  choice: жизнь по Закону
  rationale: В контексте 4 Маккавейской книги νόμιμος указывает прежде всего на верность иудейскому Закону, а не на современную гражданскую законопослушность. Прописная буква делает эту контекстуальную отсылку ясной без расширения текста.
- source_word: πιστὴ ... σφραγὶς
  choice: верная печать
  rationale: Сохранена сжатая и несколько необычная метафора оригинала; πιστός здесь допускает значения «верный», «надёжный», «истинный».
- source_word: θανάτου
  choice: смерти
  rationale: Родительный падеж сохраняет конструкцию и образ «печати смерти», не превращая её однозначно в инструментальное «смертью».
- source_word: ἐτελείωσεν
  choice: довела до совершенства
  rationale: Форма передаёт активный субъект σφραγίς и широкий смысл τελειόω — завершить, исполнить, довести до совершенства, — сохраняя его возвышенную силу.
theological_decisions:
- issue: Значение βίου νομίμου в контексте иудейского мученичества
  choice: жизнь по Закону
  alternative: законопослушная жизнь
  rationale: Контекст книги связан с верностью Торе; «по Закону» точнее передаёт религиозно-нравственную направленность выражения, не добавляя конфессиональной интерпретации.
- issue: Смысл τελειόω применительно к смерти мученицы
  choice: довела до совершенства
  alternative: завершила
  rationale: Выбранный вариант сохраняет возможное значение совершенствования или исполнения, но примечание удерживает также более нейтральное понимание завершения и подтверждения жизни.
- issue: Связь πιστή с образом печати смерти
  choice: верная печать смерти
  alternative: надёжное подтверждение, данное смертью
  rationale: Буквальная метафора сохранена, поскольку греческий текст допускает как мысль о завершении жизни смертью, так и о её достоверном удостоверении.
translation_notes:
  register: Возвышенное риторическое восклицание передано современным литературным русским языком. Параллельный ряд «старость — седины — жизнь» и метафора печати сохранены; архаизмы и конфессионально маркированная терминология не вводятся.
