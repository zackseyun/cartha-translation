translation:
  language: ru
  text: те, кто верит, что в глазах Бога они не умирают, но, подобно нашим патриархам Аврааму, Исааку и Иакову, живут перед Ним.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Богом»; греческий дательный падеж может обозначать отношение («для Бога», «в Божьих глазах»), а не цель или направление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πιστεύοντες
  choice: те, кто верит
  rationale: Субстантивированное причастие настоящего времени обозначает людей, продолжающих верить; эта формулировка естественнее по-русски, чем отвлечённое «верующие».
- source_word: θεῷ / τῷ θεῷ
  choice: для Бога
  rationale: Дательный падеж выражает отношение к Богу, а не обязательно направление или цель. Повтор «для Бога» сохраняет словесную симметрию греческого текста и не разворачивает смысл в толкование.
- source_word: οὐκ ἀποθνήσκουσιν
  choice: не умирают
  rationale: Передаёт обычное значение настоящего времени глагола ἀποθνῄσκω без ослабления до «не погибают».
- source_word: ὥσπερ γὰρ
  choice: подобно
  rationale: Передаёт вводимое оборотом сопоставление с патриархами; частица γάρ не переводится отдельно, поскольку в данной греческой конструкции её пояснительная функция по-русски естественно выражена самим сравнением.
- source_word: οἱ πατριάρχαι ἡμῶν
  choice: нашим патриархам
  rationale: Сохраняет конкретное историко-родовое обозначение Авраама, Исаака и Иакова, не заменяя его более общим словом «отцы».
- source_word: ἀλλὰ ζῶσιν
  choice: но живут
  rationale: Сохраняет краткую и явную антитезу между смертью и жизнью.
theological_decisions:
- issue: Значение дательного θεῷ / τῷ θεῷ в высказывании о смерти и жизни
  choice: для Бога
  alternative: перед Богом; в Божьих глазах; по отношению к Богу
  rationale: 'Формулировка сохраняет реляционный характер дательного и богословское напряжение утверждения: речь не сводится ни к физическому бессмертию, ни к одной только памяти Бога. Возможные оттенки отмечены в сноске.'
- issue: Связь сравнения с патриархами
  choice: сравнение отнесено ко всему противопоставлению «не умирают, но живут»
  alternative: считать патриархов лишь примером тех, кто верит
  rationale: Такой порядок естественен для русского языка и согласуется с содержанием греческой фразы, не делая патриархов грамматическим субъектом глагола «верит».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены лаконичная антитеза «не умирают, но живут» и повтор «для Бога»; имена патриархов поставлены в требуемый сравнительным оборотом дательный падеж.
