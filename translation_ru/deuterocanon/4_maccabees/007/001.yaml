base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/001.yaml
  text: For just as the reasoning of our father Eleazar[a], like an excellent helmsman, was steering the ship of godliness on the sea of the passions[b],
translation:
  language: ru
  text: Ибо разум нашего отца Елеазара, словно искусный кормчий, вёл корабль благочестия[a] по морю страстей[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «корабль почитания Бога». Греческое εὐσέβεια означает благоговейную преданность Богу, проявляющуюся в верной жизни.'
    reason: lexical_alternative
  - marker: b
    text: Греческое πάθη здесь, вероятнее всего, означает «страсти» — сильные или неупорядоченные чувства, что является одной из главных тем 4 Маккавейской, — а не просто «страдания».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥσπερ γὰρ
  choice: Ибо … словно
  rationale: Передаёт объяснительное γὰρ и вводимое ὥσπερ сравнение; разнесение элементов в русском предложении делает образ естественным и ясным.
- source_word: ἄριστος κυβερνήτης
  choice: искусный кормчий
  rationale: «Кормчий» сохраняет морской образ, а «искусный» выражает качественное превосходство ἄριστος без излишне абсолютного «лучший».
- source_word: ὁ … λογισμός
  choice: разум
  rationale: В 4 Маккавейской λογισμός обозначает разумное нравственное суждение, управляющее страстями. «Разум» краток, естественен и сохраняет ключевое философское противопоставление книги.
- source_word: τοῦ πατρὸς ἡμῶν Ἐλεαζάρου
  choice: нашего отца Елеазара
  rationale: Сохраняет почтительное именование Елеазара и принадлежность разума ему.
- source_word: πηδαλιουχῶν
  choice: вёл
  rationale: Передаёт продолжающееся управление судном; ближайшее слово «кормчий» уже ясно указывает на управление рулём, поэтому буквальное «рулил» было бы стилистически грубее.
- source_word: τὴν τῆς εὐσεβείας ναῦν
  choice: корабль благочестия
  rationale: Сохраняет метафору и религиозно-нравственный смысл εὐσέβεια как почтительной преданности Богу, выраженной в верности.
- source_word: ἐν τῷ τῶν παθῶν πελάγει
  choice: по морю страстей
  rationale: Сохраняет морскую метафору; πάθη в контексте книги обозначает прежде всего страсти и сильные, способные выйти из-под контроля чувства, а не только страдания.
theological_decisions:
- issue: Передача философски значимого λογισμός
  choice: разум
  alternative: рассуждение; разумное суждение
  rationale: «Разум» естественно обозначает управляющее нравственное начало и не превращает его ни в отвлечённый процесс рассуждения, ни в позднейший специальный философский термин.
- issue: Передача εὐσέβεια
  choice: благочестие
  alternative: набожность; почитание Бога
  rationale: «Благочестие» сохраняет ёмкое сочетание почтения к Богу и верного поведения, не сужая значение до одного лишь внутреннего чувства.
- issue: Передача πάθη
  choice: страсти
  alternative: страдания; чувства
  rationale: Контекст 4 Маккавейской строится на власти разума над страстями. Выбор сохраняет это нравственно-психологическое напряжение, тогда как «страдания» необоснованно переносило бы акцент на внешние мучения.
translation_notes:
  register: Современный литературный русский язык с достоинством философско-риторической прозы. Морская метафора сохранена целиком. Завершающая запятая отражает синтаксическую незавершённость исходного стиха, продолжающегося в следующем стихе. Маркеры сносок поставлены при словах, к которым фактически относятся примечания; в английском консультационном слое маркер [a] после имени Елеазара, по-видимому, расположен ошибочно.
