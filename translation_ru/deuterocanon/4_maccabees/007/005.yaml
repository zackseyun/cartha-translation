  text: For[a], like a sheer cliff, father Eleazar, stretching out his own mind[b], broke around himself the surging waves of the passions that were raging.
translation:
  language: ru
  text: Ведь отец Елеазар, выставив свой разум, подобно отвесному утёсу[a], разбил вокруг себя бушующие волны страстей[b].
  philosophy: optimal-equivalence
