    text: Под «страстями» здесь понимаются неупорядоченные влечения и побуждения; тема господства разума над ними занимает важное место в 4 Маккавейской книге.
    reason: cultural_note
lexical_decisions:
- source_word: πρόκρημνον ἄκραν
  choice: отвесный утёс
  rationale: Сочетание рисует крутой, выступающий скалистый мыс или утёс; перевод сохраняет морской образ и передаёт его естественно по-русски.
- source_word: διάνοιαν
  choice: разум
  rationale: В контексте 4 Маккавейской речь идёт о разумной способности и внутренней решимости Елеазара. «Разум» ясно сохраняет противопоставление страстям.
- source_word: ἐκτείνας
  choice: простерев
  rationale: Причастие передано глаголом с конкретным пространственным значением, чтобы сохранить образ разума, выставленного навстречу волнам подобно утёсу.
- source_word: περιέκλασεν
  choice: сокрушил вокруг себя
  rationale: «Сокрушил» передаёт силу разбивающихся волн, а «вокруг себя» сохраняет пространственное значение приставки περι- без добавления отсутствующего в тексте объяснения.
- source_word: μαινομένους
  choice: бушующие
  rationale: Слово характеризует волны как неистовые; «бушующие» естественно сочетается с морским образом.
- source_word: παθῶν
  choice: страстей
  rationale: «Страсти» сохраняет ключевой для книги нравственно-философский термин, обозначающий неупорядоченные влечения и побуждения, а не чувства вообще.
- source_word: κλύδωνας
  choice: волны
  rationale: Существительное обозначает сильные, вздымающиеся волны; вместе с «бушующие» перевод передаёт их движение и мощь без стилистической перегрузки.
theological_decisions:
- issue: 'Философская антропология 4 Маккавейской: разум и страсти'
  choice: διάνοια передано как «разум», а πάθη — как «страсти»
  alternative: «ум» и «чувства» либо более истолковательное «разумное начало» и «неупорядоченные влечения»
  rationale: Выбранные слова сохраняют нравственно-психологическое напряжение исходного текста и не превращают метафору в позднейшую техническую или конфессиональную формулу.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; морская метафора сохранена цельной. «Простерев» выбрано как умеренно возвышенное, но понятное слово, соответствующее риторическому стилю книги.
