base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/007/022.yaml
  text: And knowing that it is blessed to endure every pain for the sake of virtue[a], would he not prevail over the passions for the sake of godliness?
translation:
  language: ru
  text: И, зная, что блаженно переносить всякую боль ради добродетели, разве не смог бы он одолеть страсти ради благочестия[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради почитания Бога». Греческое слово означает благоговейную преданность Богу.'
    reason: Лексическая альтернатива поясняет религиозную направленность εὐσέβεια; маркер поставлен после соответствующего слова, а не после «добродетели».
lexical_decisions:
- source_word: εἰδὼς
  choice: зная
  rationale: Деепричастие сохраняет компактную форму греческого причастия и его смысл основания для последующего риторического вопроса.
- source_word: διὰ τὴν ἀρετήν
  choice: ради добродетели
  rationale: ἀρετή обозначает здесь нравственное достоинство, или добродетель; предлог «ради» передаёт направленность добровольного терпения на эту цель.
- source_word: πάντα πόνον
  choice: всякую боль
  rationale: πόνος может означать боль, тяготу или мучение. «Всякую боль» близко к форме оригинала и уместно в контексте телесных страданий.
- source_word: ὑπομένειν
  choice: переносить
  rationale: Глагол выражает стойкое претерпевание боли; «переносить» естественно звучит по-русски и не добавляет отсутствующей в тексте мысли.
- source_word: μακάριόν ἐστιν
  choice: блаженно
  rationale: Передаёт положительную нравственно-религиозную оценку μακάριον, не сводя её к удаче или практической пользе.
- source_word: περικρατήσειεν
  choice: одолеет
  rationale: Глагол означает взять верх, обрести власть над чем-либо. «Одолеет» сохраняет образ победы и естественно сочетается со «страстями».
- source_word: τῶν παθῶν
  choice: страсти
  rationale: В 4 Маккавейской πάθη — значимый философско-этический термин для влечений и аффектов, которыми должен управлять разум; «страсти» сохраняет этот терминологический оттенок.
- source_word: διὰ τὴν εὐσέβειαν
  choice: ради благочестия
  rationale: εὐσέβεια обозначает благоговейную преданность Богу. «Благочестие» сохраняет религиозную направленность слова и традиционно, но понятно современному читателю.
theological_decisions:
- issue: Соотношение добродетели, страстей и благочестия в этико-религиозной аргументации
  choice: Сохранены термины «добродетель», «страсти» и «благочестие».
  alternative: Передать их как «нравственное совершенство», «порывы» и «почитание Бога».
  rationale: Выбранные соответствия удерживают соединение эллинистической этической лексики с иудейской преданностью Богу, не подменяя его поздней конфессиональной терминологией.
translation_notes:
  register: Современный литературный русский язык с dignified этико-философским звучанием. Риторическая форма вопроса и исходная смысловая напряжённость между перенесением внешней боли и господством над внутренними страстями сохранены.
