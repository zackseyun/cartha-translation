lexical_decisions:
- source_word: πίπτων εἰς τὸ ἔδαφος
  choice: падая на землю
  rationale: Причастие настоящего времени передаёт действие, одновременное с главным; «на землю» естественно обозначает поверхность, на которую он падает.
- source_word: ἀπὸ τοῦ μὴ φέρειν
  choice: потому что ... не могло вынести
  rationale: Оборот выражает причину падения; причинная конструкция естественна в современном русском языке.
- source_word: τὸ σῶμα
  choice: тело его
  rationale: Определённый артикль в контексте указывает на тело самого мученика; постпозиция местоимения поддерживает достойный повествовательный регистр.
- source_word: τὰς ἀλγηδόνας
  choice: мучений
  rationale: Слово обозначает сильные телесные боли; «мучения» уместно в сцене пытки и сохраняет интенсивность выражения.
- source_word: ὀρθὸν εἶχεν
  choice: сохранял ... прямым
  rationale: Передаёт поддержание в прямом, стойком состоянии и сохраняет телесную метафору, противопоставленную физическому падению.
- source_word: ἀκλινῆ
  choice: непреклонным
  rationale: Передаёт буквальную идею того, что не склоняется, и метафорически — внутреннюю несгибаемость.
- source_word: τὸν λογισμόν
  choice: свой разум
  rationale: В 4 Маккавейской это ключевое понятие разумной способности и нравственного суждения, управляющего страстями; «разум» сохраняет философскую ёмкость термина.
theological_decisions:
- issue: Передача философски значимого термина λογισμός
  choice: разум
  alternative: разумное суждение
  rationale: «Разум» кратко и естественно сохраняет центральную для книги тему господства благочестивого разума над страданиями, не сужая термин до отдельного решения или акта суждения.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования. Сочетание «падая» — «прямым и непреклонным» сохраняет намеренный контраст между телесным падением и стойкостью разума.
