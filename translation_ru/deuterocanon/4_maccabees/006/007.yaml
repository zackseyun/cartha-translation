  text: And falling to the ground because his body could not bear the pains[a], he kept his reason upright and unbending.
translation:
  language: ru
  text: И, падая на землю, потому что его тело не могло вынести мучений, он сохранял разум[a] твёрдым и непреклонным.
  philosophy: optimal-equivalence
