  text: But you[a], the tyrant’s bodyguards, why do you delay?
translation:
  language: ru
  text: А вы, телохранители[a] тирана, что медлите?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «копьеносцы», то есть вооружённые стражники или телохранители тирана.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... δορυφόροι
  choice: телохранители
  rationale: Буквально δορυφόροι — «копьеносцы», но здесь слово обозначает вооружённую личную охрану тирана; «телохранители» естественно передаёт эту функцию.
- source_word: τοῦ τυράννου
  choice: тирана
  rationale: Родительный падеж естественно передаёт принадлежность, а «тиран» сохраняет отрицательную политико-нравственную окраску τύραννος.
- source_word: τί μέλλετε;
  choice: чего медлите?
  rationale: При абсолютном употреблении μέλλω выражает промедление перед ожидаемым действием. Эта формулировка передаёт прямой и нетерпеливый вызов.
- source_word: οἱ δὲ
  choice: А вы
  rationale: Хотя формально оборот имеет третье лицо, последующий вопрос обращён непосредственно к стражникам; «А вы» естественно передаёт и обращение, и противопоставительный оттенок δέ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, прямая и вызывающая реплика. Разговорное вопросительное «чего медлите?» здесь сохраняет достоинство речи и лучше передаёт резкость обращения, чем более отвлечённое «почему вы медлите?».
