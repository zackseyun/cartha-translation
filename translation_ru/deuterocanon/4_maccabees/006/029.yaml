  source_fidelity: Перевод точно передаёт оба повелительных глагола (ποίησον, λάβε), буквальное «кровь» (αἷμα), культово-очистительный смысл καθαρσόν и заместительно-обменное значение ἀντίψυχον. «Мою жизнь» уместно передаёт ψυχήν в контексте добровольной мученической смерти. Формула «взамен их жизней» эксплицирует подразумеваемое в греческом множественное соотнесение жизни говорящего с жизнью тех, за кого он просит, не добавляя доктринального толкования.
