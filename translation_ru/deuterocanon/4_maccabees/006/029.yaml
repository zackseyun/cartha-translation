  text: Make my blood their purification[b][a], and take my life in exchange for theirs.
translation:
  language: ru
  text: Сделай мою кровь очищением для них[a] и возьми мою жизнь взамен их жизней[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «средством их очищения». Греческое слово может обозначать очищение в культовом, жертвенном смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «возьми мою жизнь как замену их жизням». Возможен перевод «как выкуп за них», но он сильнее подчёркивает смысл выкупа.'
    reason: alternative_reading
lexical_decisions:
- source_word: καθαρσόν
  choice: очищением
  rationale: Передаёт культовый оттенок очищения, не вводя более узкого богословского термина «искупление» и сохраняя предикативную конструкцию «сделай мою кровь очищением».
- source_word: αἷμα
  choice: кровь
  rationale: Прямой эквивалент греческого слова; в контексте мученической смерти сохраняет жертвенный образ.
- source_word: ἀντίψυχον
  choice: взамен
  rationale: Передаёт идею замены одной жизни другими без усиления коммерческого оттенка, который могло бы внести слово «выкуп».
- source_word: ψυχήν
  choice: жизнь
  rationale: В контексте добровольно принимаемой смерти речь идёт о жизни, а не прежде всего о нематериальной душе.
- source_word: λάβε
  choice: возьми
  rationale: Естественно и прямо передаёт повелительное наклонение глагола в молитвенном обращении.
theological_decisions:
- issue: Жертвенный и заместительный смысл молитвы мученика
  choice: Сохранить прямые образы очищения кровью и отдачи жизни взамен других жизней
  alternative: «Пусть моя кровь искупит их, а мою душу прими как выкуп за них»
  rationale: Греческий текст содержит культовую и заместительную образность, но не требует переводить её позднейшими техническими терминами «искупление» или «выкуп». Выбранная формулировка сохраняет напряжение и не систематизирует его.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис близок к греческому, но понятен обычному читателю; архаизмы и конфессионально нагруженная терминология не используются.
