  text: Therefore, it is agreed that godly reason is master of the passions.
translation:
  language: ru
  text: Итак, по общему признанию, благочестивый разум — повелитель страстей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: по общему признанию
  rationale: Наречие указывает на признанный, неоспоримый вывод; эта формулировка естественна в современном русском и сохраняет оттенок общего признания.
- source_word: οὖν
  choice: итак
  rationale: Передаёт итоговый, выводный характер высказывания в данном контексте.
- source_word: δεσπότης
  choice: владыка
  rationale: Обозначает того, кто обладает господствующей властью. «Владыка» сохраняет силу образа управления, тогда как «Господь» могло бы привнести здесь ненужную прямую отсылку к божественному титулу.
- source_word: τῶν παθῶν
  choice: страстей
  rationale: В философско-нравственном рассуждении 4 Маккавейской πάθη — это страсти и внутренние побуждения, которыми управляет разум; «страсти» является точным и устоявшимся русским соответствием.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: благочестивый разум
  rationale: Выражение обозначает разум, направляемый почтением к Богу. «Благочестивый разум» сохраняет одновременно рациональный и религиозный аспекты греческой фразы.
theological_decisions:
- issue: Передача εὐσεβής в философско-богословском выражении
  choice: благочестивый
  alternative: богобоязненный; почитающий Бога
  rationale: «Благочестивый» показывает, что речь идёт не об автономном разуме, а о разуме, сформированном почтением к Богу, при этом не сужает значение до одного лишь чувства страха.
- issue: Характер власти разума над страстями
  choice: владыка страстей
  alternative: властвует над страстями
  rationale: Именная конструкция сохраняет метафору греческого δεσπότης и категоричность вывода, не уточняя сверх текста, является ли это господство абсолютным или практическим.
translation_notes:
  register: Современный литературный русский язык с достоинством философско-нравственного афоризма. Синтаксис краткий и итоговый; тире естественно оформляет именную часть сказуемого. Архаизмы и конфессионально маркированные формулы не используются.
