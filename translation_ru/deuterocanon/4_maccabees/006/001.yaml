lexical_decisions:
- source_word: Τοῦτον τὸν τρόπον
  choice: так
  rationale: Кратко и естественно передаёт обстоятельственный оборот со значением «таким образом».
- source_word: ἀντιρρητορεύσαντα
  choice: возразил
  rationale: Передаёт противительный характер речи Елеазара, не придавая ей излишне формального оттенка диспута.
- source_word: παρηγορίαις
  choice: уговоры
  rationale: В данном контексте речь не об утешении, а о попытках тирана склонить Елеазара к повиновению.
- source_word: δορυφόροι
  choice: телохранители
  rationale: Буквально «копьеносцы»; при правителе слово обозначает вооружённых приближённых, исполняющих функции охраны.
- source_word: παραστάντες
  choice: подошли
  rationale: Передаёт вступление стражей в действие и естественно связывает последовательность событий.
- source_word: πικρῶς
  choice: жестоко
  rationale: В сочетании с насильственным волочением наречие выражает суровый, мучительный характер обращения.
- source_word: ἔσυραν
  choice: поволокли
  rationale: Глагол обозначает насильственное тащение; совершенный вид соответствует повествовательному аористу.
- source_word: ἐπὶ τὰ βασανιστήρια
  choice: к орудиям пытки
  rationale: Множественное βασανιστήρια может обозначать средства или приспособления для пытки; этот перевод конкретен и не вводит отсутствующее в тексте понятие отдельной камеры.
- source_word: τὸν Ἐλεάζαρον
  choice: Елеазар / его
  rationale: Имя названо в начале русской фразы ради ясности при преобразовании греческой причастной конструкции; затем употреблено местоимение, чтобы избежать тяжеловесного повтора.
