  yaml_path: translation/deuterocanon/4_maccabees/006/032.yaml
  text: For if the passions had gained mastery over reason[b][a], I would have given them testimony to my self-control.
translation:
  language: ru
  text: Ведь если бы страсти одержали верх над разумом, я засвидетельствовал бы их господство.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «воздал бы им свидетельство господства»; также возможно: «предоставил бы им доказательство превосходства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάθη
  choice: страсти
  rationale: В нравственно-философском контексте речь идёт о внутренних страстях и порывах, противопоставленных разуму, а не о внешних страданиях.
- source_word: λογισμοῦ
  choice: разумом
  rationale: λογισμός обозначает способность рассуждать и выносить разумное суждение; «разум» естественно и кратко сохраняет ключевое противопоставление страстям.
- source_word: κεκράτηκει
  choice: одержали верх над
  rationale: κρατέω с родительным падежом передаёт господство или превосходство над чем-либо; русское выражение сохраняет значение результата, заложенное в плюсквамперфекте.
- source_word: ἀπεδόμην
  choice: я засвидетельствовал бы
  rationale: В сочетании с μαρτυρίαν глагол означает «воздал бы, предоставил бы свидетельство». Слитное русское выражение передаёт смысл естественно, не устраняя образ свидетельства.
- source_word: ἐπικρατίας
  choice: господство
  rationale: Слово обозначает преобладание, превосходство или господство. В данном условном высказывании речь о гипотетическом господстве страстей над разумом, а не о самообладании говорящего.
- source_word: μαρτυρίαν
  choice: засвидетельствовал бы
  rationale: 'Сохраняется судебно-доказательный оттенок μαρτυρία: поведение говорящего стало бы свидетельством в пользу господства страстей.'
theological_decisions:
- issue: Нравственно-философское противопоставление разума и страстей
  choice: Сохранить исходные категории «разум» и «страсти», не заменяя их позднейшими богословскими понятиями.
  alternative: 'Передать динамически: «если бы желания пересилили моё здравое суждение».'
  rationale: Прямая передача философской лексики сохраняет аргумент книги и не привносит представление о «греховной природе» или иную конфессиональную антропологию.
- issue: Чьё господство удостоверяется
  choice: 'Отнести «господство» к страстям: если бы они победили разум, говорящий признал бы их господство.'
  alternative: Понять ἐπικρατία как самообладание говорящего.
  rationale: Дательное τούτοις относится к страстям, а условная логика фразы указывает, что уступка страстям стала бы свидетельством именно их превосходства. При этом примечание сохраняет буквальную структуру выражения.
translation_notes:
  register: Современный литературный русский язык с достойным философско-нравственным звучанием. Формулировка «одержали верх» понятна широкому читателю, а «засвидетельствовал бы их господство» сохраняет формальный образ свидетельства и смысл гипотетического признания превосходства страстей.
