  source_fidelity: Текст точно передаёт последовательное καὶ πρῶτον μὲν («И прежде всего»), буквальное действие περιέδυσαν («раздели») и почтительно-возвышенное τὸν γεραιόν («старца»). Оборот «украшенного достоинством благочестия» сохраняет метафорическое ἐκκεκοσμημένον и не привносит толкования, будто раздевание отняло у него это нравственное качество. Хотя греческое περὶ τὴν εὐσέβειαν несколько точнее выражает связь достоинства с благочестием, русская генитивная связь здесь допустима и не искажает смысла.
