  text: And first they stripped the old man[a], adorned with the dignity of godliness.
translation:
  language: ru
  text: И прежде всего они раздели старца, украшенного достоинством благочестия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «украшенного благородной статью, свойственной благочестию».'
    reason: Греческое εὐσχημοσύνη может обозначать достоинство, благопристойность или благородную стать; конструкция с περὶ выражает связь этого качества с благочестием.
lexical_decisions:
- source_word: καὶ πρῶτον μὲν
  choice: И прежде всего
  rationale: Передаёт соединительное καί и начало последовательности издевательств; частица μέν подготавливает продолжение рассказа и не требует отдельного русского соответствия.
- source_word: περιέδυσαν
  choice: раздели
  rationale: Глагол обозначает снятие с человека одежды; краткое русское «раздели» естественно передаёт действие и его унизительный характер.
- source_word: τὸν γεραιὸν
  choice: старца
  rationale: «Старец» здесь обозначает пожилого почтенного мужчину и сохраняет возвышенный повествовательный тон, не внося значения монашеского звания.
- source_word: ἐκκεκοσμημένον
  choice: украшенного
  rationale: 'Сохраняет метафору: внешне раздетый человек представлен как украшенный нравственным достоинством.'
- source_word: τὴν περὶ τὴν εὐσέβειαν εὐσχημοσύνην
  choice: достоинством благочестия
  rationale: Сжатая греческая конструкция связывает εὐσχημοσύνη — достоинство, благородную стать или благопристойность — с εὐσέβεια. Русская формулировка сохраняет возвышенную метафору без избыточного разъяснения.
- source_word: εὐσέβειαν
  choice: благочестия
  rationale: В 4 Маккавейской εὐσέβεια обозначает верность и почтение к Богу, проявляемые в жизни; «благочестие» является естественным и содержательно ёмким русским эквивалентом.
theological_decisions:
- issue: Передача εὐσέβεια как ключевого понятия 4 Маккавейской
  choice: благочестие
  alternative: почитание Бога
  rationale: «Благочестие» охватывает как преданность Богу, так и соответствующий образ жизни, не сводя понятие только к внутреннему чувству или обрядности.
- issue: Связь нравственного достоинства с раздеванием старца
  choice: сохранена метафора «украшенного достоинством»
  alternative: пояснительное прочтение, будто снятие одежды лишило его внешнего выражения благочестия
  rationale: Греческий текст называет старца украшенным достоинством благочестия, но прямо не утверждает, что мучители смогли отнять это достоинство. Перевод не разрешает эту напряжённость добавочным толкованием.
translation_notes:
  register: Современный литературный русский с кратким, возвышенным повествовательным строем. Слово «старец» употреблено в общем значении почтенного пожилого мужчины, а не как специальный монашеский термин.
