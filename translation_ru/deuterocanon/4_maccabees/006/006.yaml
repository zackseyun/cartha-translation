lexical_decisions:
- source_word: ἀλλὰ ἀλλὰ ἀλλὰ
  choice: Но нет, нет, нет!
  rationale: Тройное повторение передано как резкое и эмоциональное отрицание, сохраняющее обрывистость и усиление греческого текста.
- source_word: ὑψηλοὺς ἀντείνας ... τοὺς ὀφθαλμούς
  choice: возведя глаза
  rationale: Оборот обозначает направленное вверх движение взгляда; «возведя глаза к небу» естественно и достойно звучит по-русски.
- source_word: εἰς τὸν οὐρανόν
  choice: к небу
  rationale: Предлог выражает направленность взгляда; «небо» сохраняет религиозный оттенок контекста, не уточняя его сверх текста.
- source_word: ἀπέφαινετο ταῖς μάστιξιν τὰς σάρκας
  choice: подставлял свою плоть под удары бичей
  rationale: Так передано продолжающееся действие, при котором плоть старца открыта воздействию бичей. Русский оборот ясен, но не скрывает телесной конкретности оригинала.
- source_word: τὰς σάρκας
  choice: свою плоть
  rationale: В контексте пытки слово имеет буквальный телесный смысл; «плоть» сохраняет конкретность греческого выражения.
- source_word: ὁ γέρων
  choice: старец
  rationale: Слово указывает на преклонный возраст героя. «Старец» в данном возвышенном повествовании естественно и не обязательно обозначает особый религиозный чин.
- source_word: κατερρεῖτο τῷ αἵματι
  choice: истекал кровью
  rationale: Устойчивое русское выражение точно передаёт продолжительное обильное кровотечение.
- source_word: τὰ πλευρὰ
  choice: его бока
  rationale: πλευρά обозначает боковую область тела и может включать рёбра; «бока» не сужает значение только до костей.
- source_word: κατετιτρώσκετο
  choice: пронзали
  rationale: Несовершенный вид и пассивная форма передают продолжающееся или повторяющееся нанесение глубоких ран; русская неопределённо-личная конструкция звучит естественно.
theological_decisions:
- issue: Буквальное или переносное значение σάρκας
  choice: буквальное «плоть»
  alternative: «тело» или «кожа»
  rationale: Речь идёт о физической пытке, поэтому слово не имеет здесь отвлечённого богословского значения. Выбор «плоть» сохраняет лексику оригинала.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной повествовательной интонацией. Резкое тройное начало сохранено; последующие несовершенные формы передают длительность истязания.
