  text: But no—no—no! Lifting his eyes high toward heaven[a], the old man was exposing his flesh to the whips, and was streaming with blood[c][b], and his sides were being pierced.
translation:
  language: ru
  text: Но нет, нет, нет! Высоко возведя глаза к небу, старец подставлял свою плоть под удары бичей[a], истекал кровью, и его бока пронзали[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обнажал свою плоть под бичами». Греческий глагол может описывать плоть как выставленную напоказ или ставшую видимой при бичевании.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его рёбра пронзали». Греческое слово может обозначать как бока, так и область рёбер.'
