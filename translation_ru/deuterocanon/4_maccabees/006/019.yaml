  text: and we ourselves would become a pattern of ungodliness for the young[a], so that we might become an example of eating what is defiled.
translation:
  language: ru
  text: И сами мы стали бы для молодых образцом нечестия, чтобы самим стать примером вкушения осквернённой пищи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «примером вкушения нечистого»; возможно также: «примером употребления нечистой пищи».'
    reason: Лексическая альтернатива для редкого слова μιαροφαγία, допускающего как более буквальную, так и более естественную передачу.
lexical_decisions:
- source_word: τύπος
  choice: образец
  rationale: Передаёт значение образца или модели и позволяет отличить это слово от следующего παράδειγμα.
- source_word: ἀσεβείας
  choice: нечестие
  rationale: Сохраняет религиозно-нравственный смысл непочтительности к Богу и естественно звучит в современном литературном русском.
- source_word: τοῖς νέοις
  choice: для молодых
  rationale: Греческое выражение может обозначать молодых людей вообще или молодых мужчин; широкий русский вариант не уточняет пол без необходимости.
- source_word: παράδειγμα
  choice: пример
  rationale: Обычное соответствие, сохраняющее отличие от ранее употреблённого τύπος — «образец».
- source_word: μιαροφαγίας
  choice: употребление осквернённой пищи
  rationale: Естественно передаёт сложное существительное со значением вкушения осквернённого или нечистого, не превращая его в более узкий технический термин.
- source_word: γενοίμεθα / γενώμεθα
  choice: стали бы / чтобы сделаться
  rationale: Условная форма и придаточное цели передают соответственно потенциальный характер первого аористного конъюнктива и целевую силу ἵνα со вторым.
theological_decisions:
- issue: Религиозный смысл ἀσεβείας
  choice: нечестие
  alternative: безбожие
  rationale: «Нечестие» выражает поступок, противный почитанию Бога, не утверждая непременно полного отрицания Бога, которое может подразумевать «безбожие».
- issue: Степень конкретизации μιαροφαγίας
  choice: употребление осквернённой пищи
  alternative: употребление нечистой пищи
  rationale: Контекст связан с запрещённой пищей, однако выбранный вариант сохраняет более общий образ осквернения в самом греческом слове и не сужает его до строго ритуального термина.
translation_notes:
  register: Современный литературный русский язык с достоинством речи мученика. Синтаксический параллелизм «образцом… примером» сохранён, как и различие между τύπος и παράδειγμα.
