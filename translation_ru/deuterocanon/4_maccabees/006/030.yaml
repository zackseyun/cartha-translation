  yaml_path: translation/deuterocanon/4_maccabees/006/030.yaml
  text: And after saying these things[a], the holy man nobly gave himself over to the tortures, and he stood firm by reason for the law, even to the tortures of death.
translation:
  language: ru
  text: Сказав это, святой муж благородно отдал себя на мучения[a] и силою разума противостоял им ради Закона вплоть до смертных мук.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол здесь редок и труден для точного истолкования; он может также подразумевать, что святой муж встретил смерть или прямо вступил в противоборство с мучениями.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ταῦτα εἰπὼν
  choice: Сказав это
  rationale: Естественная русская передача обстоятельственного причастного оборота, ясно сохраняющая последовательность действий.
- source_word: ὁ ἱερὸς ἀνὴρ
  choice: святой муж
  rationale: «Святой» передаёт нравственно-сакральную характеристику ἱερός, а «муж» сохраняет мужской род и возвышенный тон повествования.
- source_word: εὐγενῶς
  choice: благородно
  rationale: Передаёт высокое достоинство и нравственную доблесть, выраженные наречием, не сводя смысл лишь к храбрости.
- source_word: ἐναντεθάνει ταῖς βασάνοις
  choice: пошёл навстречу мучениям
  rationale: Редкий и трудный глагол выражает добровольное и прямое принятие противоборства со страданиями; выбранная формулировка сохраняет образ встречи с испытанием, не утверждая спорную узкую трактовку.
- source_word: ἀντέστη
  choice: оставался непреклонен
  rationale: Передаёт стойкое сопротивление и непоколебимость; подразумеваемым противником остаются мучения.
- source_word: τῷ λογισμῷ
  choice: руководствуясь разумом
  rationale: Инструментальная формулировка отражает ключевое для книги понятие разумного суждения и владычества разума, оставаясь естественной по-русски.
- source_word: διὰ τὸν νόμον
  choice: ради Закона
  rationale: Передаёт мотив верности Закону и возможный оттенок действия ради него; прописная буква обозначает конкретный Закон в иудейском контексте.
- source_word: μέχρι τῶν θανάτου βασάνων
  choice: вплоть до смертных мук
  rationale: Сохраняет предельную степень испытания и торжественную силу греческой фразы без неестественного буквального оборота «муки смерти».
theological_decisions:
- issue: Философски значимое значение λογισμός
  choice: руководствуясь разумом
  alternative: силой рассудка; посредством разумного суждения
  rationale: Формулировка сохраняет разум как действующее начало стойкости, характерное для 4 Маккавейской книги, но не вводит более поздней технической терминологии.
- issue: Причинно-целевой оттенок διὰ τὸν νόμον
  choice: ради Закона
  alternative: из-за Закона; вследствие Закона
  rationale: «Ради» естественно выражает его верность Закону как побуждение, не добавляя конфессионального толкования.
- issue: Неоднозначность редкого ἐναντεθάνει
  choice: пошёл навстречу мучениям с пояснением в сноске
  alternative: предал себя мучениям; встретил смерть, противостоя мучениям
  rationale: Основной текст передаёт добровольную и мужественную встречу с испытанием, а сноска сохраняет реальную лексическую неопределённость относительно смерти и прямого противостояния.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, мученическим регистром. «Святой муж», «Закон» и «вплоть до смертных мук» поддерживают достоинство исходной риторики; синтаксис остаётся понятным обычному современному читателю.
