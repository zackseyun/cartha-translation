revisions:
- from: Сказав это, святой муж благородно пошёл навстречу мучениям[a] и, руководствуясь разумом ради Закона, оставался непреклонен вплоть до смертных мук.
  to: Сказав это, святой муж благородно отдал себя на мучения[a] и силою разума противостоял им ради Закона вплоть до смертных мук.
  rationale: Правка точнее выражает направленное противостояние в ἀντέστη и проясняет отношения между разумом, Законом и мучениями. Передача редкого ἐναντεθάνει как самоотдачи остаётся осторожной, а его возможный оттенок встречи смерти или прямого противоборства сохранён в сноске.
