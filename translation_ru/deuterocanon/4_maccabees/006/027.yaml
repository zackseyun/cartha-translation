lexical_decisions:
- source_word: Σὺ οἶσθα
  choice: Ты знаешь
  rationale: Эмфатическое местоимение и обычный глагол знания переданы прямо; формулировка естественна для личного молитвенного обращения.
- source_word: θεέ
  choice: Боже
  rationale: Русская звательная форма уместно передаёт греческий вокатив в прямом обращении к Богу.
- source_word: παρὸν μοι σῴζεσθαι
  choice: хотя я мог бы спастись
  rationale: Оборот указывает, что возможность избежать гибели остаётся открытой. Сослагательная форма естественно выражает доступную, но отвергнутую возможность, а «хотя» передаёт подразумеваемое контекстом уступительное противопоставление.
- source_word: σῴζεσθαι
  choice: спастись
  rationale: В данном контексте речь прежде всего о физическом избавлении от пыток и смерти; «спастись» сохраняет широту греческого глагола, не закрепляя за ним исключительно богословский смысл.
- source_word: βασάνοις καυστικαῖς
  choice: в жгучих мучениях
  rationale: βασάνοι обозначает мучения или пытки, а καυστικαῖς — их обжигающий характер. Русское выражение передаёт и телесную боль, и образ огня без лишнего уточнения способа казни.
- source_word: ἀποθνῄσκω
  choice: я умираю
  rationale: Настоящее время сохранено, чтобы передать непосредственность и продолжающийся характер мученической смерти.
- source_word: διὰ τὸν νόμον
  choice: из-за закона
  rationale: Предлог διά с винительным падежом выражает причину. Формально близкий русский оборот сохраняет некоторую смысловую напряжённость; контекст и сноска поясняют, что имеется в виду верность Закону.
theological_decisions:
- issue: Смысл σῴζεσθαι в контексте мученичества
  choice: Первичен смысл физического спасения от пыток и смерти; переведено «спастись».
  alternative: «избежать гибели»; «получить избавление»
  rationale: Непосредственное противопоставление — между доступной возможностью остаться в живых и фактической смертью под пытками. Перевод не навязывает глаголу позднейший узкодогматический смысл.
- issue: Смысл διὰ τὸν νόμον
  choice: Причина смерти, связанная с верностью иудейскому Закону; переведено «из-за закона».
  alternative: «ради закона»
  rationale: Формулировка близка греческой причинной конструкции и не добавляет слов о верности, которых нет в тексте, тогда как сноска делает контекст понятным.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Обращение «Боже» сохраняет возвышенность без архаизации; синтаксис прост и понятен широкому читателю.
