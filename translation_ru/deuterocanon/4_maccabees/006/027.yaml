  source_fidelity: 'Греч. παρὸν μοι σῴζεσθαι означает, что спасение/избавление остаётся для говорящего доступной возможностью; «хотя я мог бы спастись» в русском может звучать как нереализованная условная возможность, но в целом передаёт смысл. Более прямо и естественно это выражает «хотя у меня есть возможность спастись». Дательный βασάνοις естественнее передать как средство или обстоятельство смерти: «от жгучих пыток».'
