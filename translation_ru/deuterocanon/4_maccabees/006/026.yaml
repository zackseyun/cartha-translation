lexical_decisions:
- source_word: μέχρι ὀστέων ἤδη κατακεκαυμένος
  choice: уже обожжённый до самых костей
  rationale: Передаёт результативный перфект κατακεκαυμένος и предел μέχρι ὀστέων естественным, но сильным русским выражением.
- source_word: μέλλων λιποθυμεῖν
  choice: готовый лишиться чувств
  rationale: μέλλων указывает на близость состояния, а λιποθυμεῖν — на потерю сознания или сил; этот вариант естественно передаёт надвигающийся обморок.
- source_word: ἀνέτεινεν τὰ ὄμματα πρὸς τὸν θεόν
  choice: поднял глаза к Богу
  rationale: Сохраняет направление жеста к Богу и соответствует нормальному современному русскому словоупотреблению.
- source_word: καὶ εἶπεν
  choice: 'и сказал:'
  rationale: Двоеточие показывает, что далее следует прямая речь, не добавляя отсутствующего в греческом содержания.
