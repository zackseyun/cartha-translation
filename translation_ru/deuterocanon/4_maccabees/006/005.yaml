  text: But the noble-minded and truly well-born Eleazar[a], as though being tortured in a dream, was not turned aside in any way.
translation:
  language: ru
  text: Но Елеазар, высокий духом и поистине благородного происхождения, словно во сне подвергавшийся пыткам[a], никоим образом не отступал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно в сновидении». В греческом тексте это сравнение, а не утверждение, что Елеазар действительно спал или видел сон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγαλόφρων
  choice: высокий духом
  rationale: Передаёт величие духа и нравственную стойкость, не смешивая это качество с указанием на происхождение в следующем прилагательном.
- source_word: εὐγενής
  choice: благородного происхождения
  rationale: Сохраняет значение знатного или благородного рождения и не дублирует характеристику внутреннего достоинства Елеазара.
- source_word: ὡς ἀληθῶς
  choice: поистине
  rationale: Естественно и с должной выразительностью передаёт усилительный смысл греческого оборота.
- source_word: ὥσπερ ἐν ὀνείρῳ
  choice: словно ... во сне
  rationale: Сохраняет сравнительный образ и не утверждает, будто Елеазар буквально спал или видел сон.
- source_word: βασανιζόμενος
  choice: подвергаясь пыткам
  rationale: В контексте мученичества речь идёт о реальных физических пытках, а не только о страдании или испытании.
- source_word: κατ᾽ οὐδὲν τρόπον
  choice: никоим образом
  rationale: Передаёт полное отрицание и соответствует достоинству повествовательного регистра.
- source_word: μετετρέπετο
  choice: не отступал
  rationale: Естественно передаёт смысл непреклонности и отказа свернуть с избранного пути, хотя грамматическая пассивность греческой формы в русском выражена менее явно.
theological_decisions:
- issue: Характер стойкости Елеазара под пытками
  choice: Оборот передан как сравнение, подчёркивающее его отрешённость от мучений и непреклонность.
  alternative: Понять образ преимущественно как указание на кажущуюся нереальность происходящего.
  rationale: ὥσπερ вводит явное сравнение; текст не утверждает буквального сна и не требует более определённого философского объяснения состояния Елеазара.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим повествованию о мученичестве. Различены внутреннее величие духа и благородное происхождение; сохранён образ сна и напряжение между переживаемыми пытками и непреклонностью героя.
