lexical_decisions:
- source_word: ἱδρῶν … τὸ πρόσωπον
  choice: лицо его … покрылось потом
  rationale: Греческий оборот буквально описывает лицо как потеющее; по-русски естественнее передать продолжающееся физическое состояние выражением «лицо покрылось потом».
- source_word: γέ τοι
  choice: и в самом деле
  rationale: Сочетание частиц придаёт высказыванию подчёркивающую, утвердительную силу.
- source_word: ἐπασθμαίνων σφοδρῶς
  choice: тяжело дышал
  rationale: Глагол обозначает затруднённое, учащённое дыхание, а наречие усиливает его; русский оборот точен и естественен, не усиливая образ до удушья.
- source_word: ὑπʼ αὐτῶν τῶν βασανιζόντων
  choice: даже сами мучители
  rationale: '«Сами» и «даже» передают эмфатическую конструкцию αὐτῶν τῶν: его стойкость поражала именно тех, кто подвергал его мучениям.'
- source_word: ἐθαυμάζετο
  choice: дивились
  rationale: Пассивная форма выражает изумление перед ним; русская личная конструкция с названными деятелями звучит естественнее и сохраняет положительный оттенок восхищения.
- source_word: ἐπὶ τῇ εὐψυχίᾳ
  choice: его мужеству
  rationale: εὐψυχία здесь означает мужество и стойкость духа под пыткой; «мужество» ясно передаёт смысл без добавления конфессиональной интерпретации.
