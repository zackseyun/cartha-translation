revisions:
- from: Лицо его и в самом деле покрылось потом, и он тяжело дышал[a], однако даже сами мучители дивились его мужеству[b].
  to: Лицо его и в самом деле было в поту, и он тяжело дышал, и даже сами мучители дивились его мужеству[a].
  rationale: «Было в поту» передаёт продолжающееся физическое состояние, выраженное греческим настоящим причастием, без искусственного буквального «лицо потело». Устранён невыраженный в оригинале противительный союз. Повторение «и» воспроизводит простую цепочку καί, а «даже сами мучители» сохраняет эмфазу αὐτῶν τῶν βασανιζόντων.
  reviewer_model: gpt-5.6-terra
