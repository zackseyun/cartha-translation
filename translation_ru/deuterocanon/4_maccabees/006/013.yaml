lexical_decisions:
- source_word: ἐν συμπαθείᾳ
  choice: сочувствуя ему
  rationale: Передаёт эмоциональное состояние и образ действия естественным современным русским языком; местоимение «ему» определяется контекстом.
- source_word: τῆς συνηθείας
  choice: из-за давнего знакомства
  rationale: Существительное может обозначать привычное общение, знакомство или длительную связь. Выбор передаёт продолжительность отношений, не усиливая значение до близкой дружбы.
- source_word: ἐν θαυμαστῷ τῆς καρτερίας
  choice: восхищаясь его стойкостью
  rationale: Передаёт положительное изумление перед καρτερία — стойкостью и выдержкой в испытании — в естественной русской форме.
- source_word: προσίοντες αὐτῷ
  choice: подходя к нему
  rationale: Сохраняет значение физического приближения и причастную связь с основным глаголом.
- source_word: τινες τῶν τοῦ βασιλέως
  choice: некоторые из тех, кто служил царю
  rationale: Оборот обозначает людей, принадлежавших к царскому окружению или службе; формулировка не приписывает им неопределённого в тексте официального звания.
- source_word: ἔλεγον
  choice: говорили
  rationale: Несовершенный вид естественно передаёт имперфект — продолжавшуюся или разворачивавшуюся речь — и вводит слова следующего стиха.
