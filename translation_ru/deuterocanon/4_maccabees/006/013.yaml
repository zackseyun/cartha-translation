  source_fidelity: 'Основной смысл передан верно: речь идёт о некоторых людях из царского окружения; одни испытывают сочувствие вследствие давнего знакомства с ним, другие подходят к нему, восхищаясь его стойкостью; имперфект «говорили» уместно вводит следующую реплику. Однако в основном тексте лучше явно сохранить подразумеваемое, но контекстуально определённое «с ним» при «давнем знакомстве».'
  naturalness: Фраза построена естественно для современного литературного русского; парное «одни… а другие…» и двоеточие хорошо работают в контексте продолжающейся речи. Добавление «с ним» делает связь яснее без утяжеления.
