lexical_decisions:
- source_word: ἔπειτα
  choice: Затем
  rationale: Последовательное наречие обозначает следующий этап истязания; «затем» естественно и точно передаёт ход повествования.
- source_word: περιαγκωνίσαντες
  choice: заломив ему руки
  rationale: Редкий глагол, образованный от ἀγκών («локоть; рука»), вероятно, описывает удерживание или выворачивание рук в области локтей. «Заломив ему руки» ясно передаёт насильственное отведение и удержание рук, не утверждая определённого способа связывания.
- source_word: ἑκατέρωθεν
  choice: с обеих сторон
  rationale: Наречие указывает, что действие совершалось с двух сторон; перевод сохраняет эту пространственную деталь.
- source_word: μάστιξιν
  choice: бичами
  rationale: Творительный по функции дательный множественного числа называет орудия истязания. «Бичи» — понятное и достойное литературное обозначение орудий бичевания.
- source_word: κατήκιζον
  choice: они истязали его
  rationale: Имперфект передаёт продолжительное жестокое обращение. В сочетании с «бичами» глагол «истязали» сохраняет и длительность, и тяжесть действия.
