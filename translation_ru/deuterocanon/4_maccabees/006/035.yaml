  yaml_path: translation/deuterocanon/4_maccabees/006/035.yaml
  text: Even if it is ridiculous, I demonstrate not only that reason has gained mastery over pains, but also that it rules over pleasures and does not yield to them.
translation:
  language: ru
  text: Пусть это и смешно, я показываю не только, что разум одержал верх над болью, но и что он властвует над удовольствиями и не уступает им.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ καὶ γελοῖον
  choice: Пусть это и смешно
  rationale: Сохраняет уступительный смысл и эллиптичность греческой фразы; «смешно» естественно передаёт γελοῖον без добавления отсутствующего в тексте пояснения.
- source_word: ἀλγηδόνων
  choice: над болью
  rationale: Передаёт основное значение слова как физической боли. Собирательное единственное число по-русски звучит естественнее, чем буквальное «над болями», и не усиливает выражение до «мук».
- source_word: ἐπιδείκνυμι
  choice: я показываю
  rationale: Глагол обозначает явное, наглядное обнаружение или доказательство; «показываю» сохраняет этот смысл и не придаёт высказыванию излишне формально-логического оттенка.
- source_word: κεκρατηκέναι τὸν λογισμόν
  choice: разум одержал верх
  rationale: «Одержал верх» передаёт достигнутое и сохраняющееся превосходство, выраженное перфектным инфинитивом κεκρατηκέναι.
- source_word: τὸν λογισμόν
  choice: разум
  rationale: В 4 Маккавейской книге это ключевое обозначение разумного начала, управляющего страстями; «разум» краток, понятен и не привносит более узкой поздней терминологии.
- source_word: τῶν ἡδονῶν κρατεῖν
  choice: он властвует над удовольствиями
  rationale: Передаёт продолжающуюся власть разума над удовольствиями и сохраняет повтор корня κρατέω по смыслу, не создавая тяжеловесного дословного повтора.
- source_word: μηδὲ αὐταῖς ὑπείκειν
  choice: и не уступает им
  rationale: Естественно передаёт значение ὑπείκω — «уступать, поддаваться», сохраняя образ стойкого сопротивления удовольствиям.
theological_decisions:
- issue: Передача λογισμός в философски насыщенном контексте мученичества
  choice: разум
  alternative: разумное суждение; разумное начало
  rationale: «Разум» сохраняет центральное для книги противопоставление разума страстям, оставаясь понятным современному читателю и не навязывая поздней философской системы.
- issue: Следует ли усиливать ἀλγηδόνων ввиду контекста пыток
  choice: боль
  alternative: страдания; муки
  rationale: Хотя контекст связан с тяжёлыми мучениями, само слово прежде всего обозначает боль. Перевод не добавляет степени интенсивности, которой нет в лексеме.
translation_notes:
  register: Современный литературный русский язык с достойным риторическим звучанием. Синтаксический параллелизм «не только... но и...» сохранён; эллиптическое начало не разъясняется сверх оригинала.
