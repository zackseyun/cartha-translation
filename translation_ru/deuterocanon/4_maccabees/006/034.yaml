base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/006/034.yaml
  text: And it is right for us to acknowledge that reason is sovereign[b][a], since it even prevails over outward pains.
translation:
  language: ru
  text: И справедливо нам признать, что власть принадлежит разуму[a], поскольку он одолевает даже страдания, приходящие извне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разум обладает господством» или «разуму принадлежит сила». Греческое выражение подчёркивает господствующую силу разума.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «внешние страдания». Имеются в виду страдания, приходящие извне, вероятно включая телесную боль.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιόν
  choice: справедливо
  rationale: 'Безличное выражение δίκαιόν ἐστιν передаёт нравственную оценку: «справедливо», «правильно». «Справедливо» сохраняет связь с δίκαιος и естественно звучит в рассуждении.'
- source_word: ὁμολογεῖν
  choice: признать
  rationale: В данном аргументативном контексте глагол означает открыто признать или подтвердить вывод, а не исповедать грех.
- source_word: τὸ κράτος εἶναι τοῦ λογισμοῦ
  choice: власть принадлежит разуму
  rationale: Конструкция буквально утверждает принадлежность κράτος разуму. Такая передача сохраняет значение силы и господства, не превращая абстрактный разум в монарха и не сглаживая философский тезис.
- source_word: λογισμοῦ
  choice: разуму
  rationale: В 4 Маккавейской λογισμός обозначает разумную способность или рассудочное суждение. «Разум» краток, понятен и сохраняет философскую весомость термина.
- source_word: ὅπου γε καὶ
  choice: поскольку ... даже
  rationale: В контексте сочетание вводит подчёркнутое основание для предыдущего утверждения; «поскольку» передаёт логическую связь, а «даже» — усиление.
- source_word: τῶν ἔξωθεν ἀλγηδόνων
  choice: страдания, приходящие извне
  rationale: Передача сохраняет буквальную внешнюю направленность ἔξωθεν и не сужает выражение до одних телесных болей, хотя они, вероятно, прежде всего имеются в виду.
- source_word: ἐπικρατεῖ
  choice: одолевает
  rationale: Глагол означает брать верх, господствовать или одерживать верх над чем-либо. «Одолевает» ясно выражает превосходство разума над страданиями и естественно сочетается с ними.
theological_decisions:
- issue: Философско-антропологический смысл λογισμός и κράτος
  choice: власть принадлежит разуму
  alternative: разум владычествует; разум обладает господством
  rationale: Выбранная формулировка прямо сохраняет утверждение греческого текста о господствующей силе разума, не привнося позднейших богословских категорий и не устраняя напряжение между разумом и страданием.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным философским регистром. Синтаксис следует ходу греческого рассуждения, но остаётся естественным для обычного читателя.
