lexical_decisions:
- source_word: ὁ Ἐλεάζαρος
  choice: Елеазар
  rationale: Традиционная русская форма библейского имени, соответствующая греческому Ἐλεάζαρος.
- source_word: ὥσπερ
  choice: словно
  rationale: Передаёт вводимое греческим словом образное сопоставление, не превращая его в прямое утверждение.
- source_word: πικρότερον
  choice: ещё более жестокой
  rationale: Сравнительная степень сохраняется; метафорическое значение «горше» естественно передано применительно к пытке как «ещё более жестокой».
- source_word: διὰ τῆς συμβουλίας
  choice: этот совет подверг его
  rationale: Передаёт совет как средство или причину усиленных мучений; указательное «этот» естественно отсылает к совету из ближайшего контекста.
- source_word: αἰκισθείς
  choice: подверг его … пытке
  rationale: Пассивное причастие αἰκισθείς обозначает жестокое истязание; русская конструкция с активным подлежащим делает фразу естественной, сохраняя смысл.
- source_word: ἀνεβόησεν
  choice: громко воскликнул
  rationale: Передаёт как громкость, заложенную в глаголе, так и торжественно-повествовательный регистр.
