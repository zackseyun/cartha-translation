lexical_decisions:
- source_word: ἵλεως γενοῦ
  choice: Будь милостив
  rationale: Греческое сочетание представляет собой молитвенную просьбу о благосклонной милости. «Будь милостив» естественно и точно передаёт идиоматическую силу выражения, не вводя технической богословской терминологии.
- source_word: τῷ ἔθνει σου
  choice: к народу Твоему
  rationale: Здесь ἔθνος обозначает народ как единое сообщество. Русское «народ» звучит естественнее, чем политически окрашенное «нация», и сохраняет собирательный смысл.
- source_word: ἀρκεσθεὶς
  choice: удовлетворившись
  rationale: Причастие передаёт просьбу признать последующее наказание достаточным. «Удовлетворившись» сохраняет смысл достаточности и зависимость от основного повеления.
- source_word: τῇ ἡμετέρᾳ ... δίκῃ
  choice: нашим наказанием
  rationale: В контексте мученичества δίκη означает понесённую кару или наказание. Этот вариант понятен современному читателю и не сводит слово к абстрактной «справедливости».
- source_word: περὶ αὐτῶν
  choice: за них
  rationale: 'В данном ходатайственном контексте περί с родительным падежом имеет представительственный оттенок: страдание говорящих предлагается за других. Краткое «за них» сохраняет этот смысл, не определяя его через более позднюю теорию искупления.'
theological_decisions:
- issue: Представительный смысл страдания мучеников в выражении περὶ αὐτῶν
  choice: «за них» — наказание мучеников представлено как понесённое ради народа и от его имени, без уточнения механизма искупления
  alternative: «о них» или «в связи с ними» в более общем, нерепрезентативном смысле
  rationale: Непосредственный контекст молитвы и просьба признать страдание достаточным поддерживают представительственный смысл. При этом перевод не вводит разработанную позднейшую модель заместительного искупления.
translation_notes:
  register: Современный литературный русский язык с молитвенно-торжественным, но понятным строем. Инверсия «народу Твоему» сохраняет достоинство библейской речи без архаизации. Множественное «за них» следует греческому αὐτῶν и осмысляет собирательное «народ» как множество его членов.
