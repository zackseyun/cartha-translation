  text: В ответ на это, дети Авраама, вы благородно умираете ради благочестия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради почитания Бога». Греческое εὐσέβεια означает благоговейную преданность Богу, проявляющуюся в верной жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ταῦτα
  choice: В ответ на это
  rationale: Оборот указывает на отклик на только что сказанное; такой перевод естественно передаёт его функцию в контексте.
- source_word: ὑμεῖς μέν
  choice: вы же
  rationale: Местоимение имеет эмфатический характер, а μέν отмечает тему или лёгкое противопоставление; русское «вы же» сохраняет оба оттенка без излишнего усиления.
- source_word: ὦ Ἀβραὰμ παῖδες
  choice: о дети Авраама
  rationale: «Дети» сохраняет семейный и заветный смысл παῖδες, не сужая его до буквальных сыновей; «о» передаёт возвышенное риторическое обращение.
- source_word: εὐγενῶς
  choice: благородно
  rationale: Наречие выражает нравственно достойный, возвышенный образ действия; «благородно» точно и лаконично передаёт похвалу.
- source_word: ὑπὲρ τῆς εὐσεβείας
  choice: ради благочестия
  rationale: ὑπέρ в контексте мученической смерти выражает основание, ради которого принимают смерть. «Благочестие» охватывает почтительное отношение к Богу и соответствующую верность в поступках.
- source_word: τελευτᾶτε
  choice: умираете
  rationale: В данном контексте глагол означает завершение жизни, смерть; настоящее время оригинала сохранено, а достоинство смерти уже выражено словом «благородно».
theological_decisions:
- issue: Передача εὐσέβεια в контексте мученичества
  choice: благочестие
  alternative: почитание Бога
  rationale: «Благочестие» сохраняет единство религиозной преданности и верного поведения, не превращая слово в более узкий богословский термин. Вариант «почитание Бога» яснее раскрывает направленность понятия, но несколько ослабляет его этическую сторону.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного риторического обращения. Синтаксис остаётся близким к греческому, но звучит естественно; настоящее время «умираете» сохраняет форму оригинала.
