  text: We will set out some roasted foods[a], but you, by pretending to taste pork, save yourself.
translation:
  language: ru
  text: Мы поставим перед тобой приготовленные кушанья, а ты притворись, будто попробовал свинины, и спасайся.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡψημένων βρωμάτων
  choice: кое-что из приготовленной пищи
  rationale: 'Родительный падеж имеет партитивное значение: предлагается часть приготовленной пищи. «Приготовленной» точнее сохраняет широкий кулинарный смысл, не уточняя без достаточных оснований способ приготовления как жарение или варку.'
- source_word: παραθήσομεν
  choice: поставим перед тобой
  rationale: В контексте трапезы παρατίθημι означает поставить или подать пищу кому-либо; дополнение «перед тобой» естественно передаёт подразумеваемого адресата.
- source_word: ὑποκρινόμενος
  choice: сделай вид
  rationale: Причастие выражает притворство; русская конструкция с повелительным «сделай вид» ясно передаёт предлагаемый способ обмана.
- source_word: τῶν ὑείων
  choice: свинины
  rationale: Субстантивированное выражение обозначает пищу из свиньи. «Свинина» — точное и современное русское обозначение, сохраняющее связь с запретом на такую пищу.
- source_word: ἀπογεύσασθαι
  choice: отведал
  rationale: Глагол означает попробовать или вкусить. «Отведал» естественно сочетается с пищей и не предполагает полноценной еды.
- source_word: σώθητι
  choice: спаси себе жизнь
  rationale: Пассивный императив σῴζω здесь относится к немедленному физическому спасению. Русское выражение прямо передаёт призыв избежать смерти и не вносит лишних сотериологических оттенков.
theological_decisions:
- issue: Запрещённая пища в контексте иудейского мученичества
  choice: свинины
  alternative: свиного мяса; пищи из свиньи
  rationale: Перевод прямо называет предмет запрета, не смягчая нравственного давления сцены и не добавляя конфессионального толкования.
- issue: Смысл σώθητι
  choice: спаси себе жизнь
  alternative: спасись; будь спасён
  rationale: Контекст требует понимания как сохранения земной жизни. Выбранная формулировка устраняет неуместную здесь двусмысленность с духовным спасением.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified прямой речью. «Кое-что из приготовленной пищи» сохраняет партитивность греческой конструкции, а «сделай вид, будто…» естественно передаёт причастную конструкцию средства.
