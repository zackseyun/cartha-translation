lexical_decisions:
- source_word: Τί
  choice: Зачем
  rationale: В вопросе-упрёке τί спрашивает о причине или цели поступка; русское «зачем» естественно передаёт эту прагматическую силу.
- source_word: τοῖς κακοῖς τούτοις
  choice: этими бедствиями
  rationale: Дательный падеж допускает значение средства или сопутствующих обстоятельств. «Бедствия» сохраняет широкое значение κακά и не сужает его до прямо не названных в этой фразе пыток.
- source_word: σεαυτὸν
  choice: себя
  rationale: Возвратное местоимение является прямым дополнением при ἀπόλλυες.
- source_word: ἀλογίστως
  choice: безрассудно
  rationale: Слово обозначает действие вопреки разуму или без разумного расчёта. «Безрассудно» звучит естественно по-русски и сохраняет важную для книги тему разума.
- source_word: ἀπόλλυες
  choice: губишь
  rationale: В прямой речи настоящее время по-русски естественно передаёт изображаемое как продолжающееся саморазрушение; греческий имперфект подчёркивает протяжённость действия.
- source_word: Ἐλεάζαρ
  choice: Елеазар
  rationale: Использована традиционная русская библейская форма имени.
theological_decisions:
- issue: Значение κακοῖς в контексте мученичества Елеазара
  choice: Сохранено широкое «бедствиями».
  alternative: «страданиями», «муками», «пытками»
  rationale: Греческое κακά шире технического обозначения пыток. Более конкретный перевод сделал бы подразумеваемый контекст частью явного текста.
- issue: Связь дательного τοῖς κακοῖς τούτοις с действием
  choice: Форма «этими бедствиями» сохраняет возможное значение средства.
  alternative: «из-за этих бедствий» или «среди этих бедствий»
  rationale: Греческий дательный допускает как инструментальное, так и обстоятельственное понимание; неоднозначность отмечена в сноске, а не устранена догматически.
translation_notes:
  register: Современный литературный русский язык; краткий вопрос-упрёк. «Безрассудно» сохраняет связь с темой разума, не звуча излишне академично. Порядок обращения в конце следует греческому тексту.
