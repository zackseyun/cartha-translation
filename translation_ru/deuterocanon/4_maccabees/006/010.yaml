  text: And like a noble athlete[a], though being beaten, the old man was defeating those who were torturing him.
translation:
  language: ru
  text: И, словно доблестный атлет[a], старец, хотя его били, одолевал своих мучителей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобно отважному участнику состязания».'
    reason: 'Лексическая альтернатива: γενναῖος может означать «отважный», а ἀθλητής — «участник состязания».'
lexical_decisions:
- source_word: καθάπερ
  choice: словно
  rationale: Естественно вводит сравнение и сохраняет образный характер греческого оборота.
- source_word: γενναῖος
  choice: доблестный
  rationale: Передаёт мужество и нравственное благородство, сохраняя возвышенный риторический тон.
- source_word: ἀθλητής
  choice: атлет
  rationale: Прямо сохраняет метафору состязания, не заменяя её толкованием.
- source_word: τυπτόμενος
  choice: хотя его били
  rationale: Передаёт продолжающиеся удары и уместный в контексте уступительный оттенок причастия.
- source_word: ἐνίκα
  choice: одолевал
  rationale: Несовершенный вид отражает длительность или повторяемость победы и поддерживает образ состязания.
- source_word: τοὺς βασανίζοντας
  choice: своих мучителей
  rationale: В контексте мученичества обозначает тех, кто подвергал старца пыткам; краткая русская формулировка сохраняет личную отнесённость.
- source_word: ὁ γέρων
  choice: старец
  rationale: Обозначает пожилого мужчину и в литературном русском сохраняет достоинство повествования, не подразумевая церковной должности.
theological_decisions:
- issue: Метафорическое изображение мученичества как победы в состязании
  choice: Прямо сохранить образы атлета и одоления
  alternative: 'Передать смысл толковательно: «мужественно терпел и превозмогал мучителей»'
  rationale: Греческий текст явно представляет стойкость старца как победу атлета; сохранение метафоры удерживает нравственно-философское и риторическое напряжение текста без конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, достойным контекста звучанием. «Старец» употреблено в общеязыковом значении пожилого мужчины, а не как обозначение духовного звания.
