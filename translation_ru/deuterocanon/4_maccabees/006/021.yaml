  text: and shall we be despised by the tyrant as unmanly[a], yet not defend our divine law even to death?
translation:
  language: ru
  text: И неужели тиран будет презирать нас как трусов[a], а мы не защитим наш божественный Закон до самой смерти?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не-мужами»; то есть лишёнными мужества, трусами. Греческое выражение гендерно окрашено.'
    reason: Лексическая альтернатива и пояснение гендерно окрашенного греческого выражения.
lexical_decisions:
- source_word: καταφρονηθῶμεν
  choice: станет презирать нас
  rationale: Пассивная форма буквально означает «будем презираемы», но в русском риторическом вопросе активная конструкция звучит естественнее и сохраняет смысл отношения с презрением.
- source_word: τύραννος
  choice: тиран
  rationale: Слово обозначает деспотичного правителя и содержит отрицательную нравственную оценку, которую сохраняет русское «тиран».
- source_word: ἄνανδροι
  choice: немужи
  rationale: Редкое, но понятное в контексте слово сохраняет буквальную гендерно окрашенную риторику греческого выражения «не-мужи», то есть люди, лишённые мужества; смысл поясняется в сноске.
- source_word: θεῖον
  choice: божественный
  rationale: Прилагательное указывает на принадлежность Закона Богу или его божественное происхождение, не уточняя эту связь сверх сказанного в греческом.
- source_word: νόμον
  choice: Закон
  rationale: В иудейском контексте речь идёт о данном Богом Законе; прописная буква помогает обозначить это специальное употребление.
- source_word: μέχρι θανάτου
  choice: до самой смерти
  rationale: Передаёт предельную готовность защищать Закон вплоть до смерти и естественно звучит по-русски.
- source_word: προασπίσαιμεν
  choice: защитим
  rationale: Глагол буквально связан с выставлением щита перед кем-либо или чем-либо и в переносном смысле означает «защищать».
theological_decisions:
- issue: Передача гендерно окрашенного упрёка ἄνανδροι
  choice: немужи
  alternative: трусы; лишённые мужества
  rationale: Основной текст сохраняет образ исходного слова — отрицание мужского мужества, — не сводя его молча к нейтральной трусости. Сноска раскрывает обычный смысл для современного читателя.
- issue: Значение выражения θεῖον ἡμῶν νόμον
  choice: наш божественный Закон
  alternative: наш Закон, данный Богом
  rationale: 'Буквальная формулировка сохраняет возможную широту значения θεῖος: Закон принадлежит Богу, исходит от Него или обладает божественным статусом; развёрнутый вариант сузил бы эту неоднозначность.'
translation_notes:
  register: Современный литературный русский с достоинством риторической речи. Частица «неужели» естественно оформляет вопрос, выраженный греческими сослагательными формами. Необычное «немужи» намеренно сохраняет резкость и гендерный образ оригинала; сноска обеспечивает ясность.
