  text: «Повинуйся повелениям царя!» — кричал с другой стороны глашатай.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Повинуйся повелениям царя!» — крикнул другой глашатай. Буквально: «когда (или при том, что) с другой стороны кричал глашатай». Греческое слово может указывать на другое место или сторону; в контексте оно также может подразумевать другого глашатая.'
