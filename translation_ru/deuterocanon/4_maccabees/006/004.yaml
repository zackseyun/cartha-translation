lexical_decisions:
- source_word: Πείσθητι
  choice: Повинуйся
  rationale: Аористный пассивный императив от πείθω буквально допускает значение «будь убеждён», но при царских предписаниях естественно выражает требование подчиниться; «повинуйся» сохраняет властный тон и литературный регистр.
- source_word: ταῖς τοῦ βασιλέως ἐντολαῖς
  choice: повелениям царя
  rationale: ἐντολαί обозначает обязательные предписания. «Повеления» передаёт царскую власть и звучит естественно в данном историко-литературном контексте.
- source_word: ἑτέρωθεν
  choice: с другой стороны
  rationale: Наречие имеет пространственное значение «из другого места/с другой стороны». Оно сохранено явно, без сведения смысла только к указанию на другого глашатая.
- source_word: κῆρυκος
  choice: глашатая
  rationale: κῆρυξ — официальный публичный вестник; «глашатай» точнее, чем общее «посланник».
- source_word: ἐπιβοῶντος
  choice: раздался ... возглас
  rationale: Причастие указывает на громкий призыв. Русская конструкция естественно передаёт сопутствующий громкий возглас и согласуется с родительным абсолютным оборотом греческого текста.
