  text: For it would indeed be irrational, if, after living our whole life up to old age in truth and lawfully preserving the reputation founded on it, we should now change course,
translation:
  language: ru
  text: Ведь было бы неразумно, если бы мы, прожив в истине всю жизнь до самой старости и по закону сохранив основанную на этом добрую славу, теперь изменили свой путь,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλογιστον
  choice: неразумно
  rationale: Передаёт отсутствие разумного основания естественным современным русским словом.
- source_word: πρὸς ἀλήθειαν ζήσαντες
  choice: прожив в истине
  rationale: Сохраняет связь жизни с истиной, не уточняя сверх греческого текста, идёт ли речь прежде всего об истинности, верности или праведности.
- source_word: τὸν μέχρι γήρως βίον
  choice: всю жизнь до самой старости
  rationale: Явно передаёт длительность жизненного пути вплоть до старости.
- source_word: τὴν ἐπ’ αὐτῶν δόξαν
  choice: основанную на этом добрую славу
  rationale: δόξα здесь обозначает сложившуюся добрую репутацию; местоименное выражение передано без чрезмерно узкой конкретизации.
- source_word: νομίμως φυλάσσοντες
  choice: по закону сохранив
  rationale: Сохраняет возможную отсылку к соблюдению закона, а не сводит наречие лишь к общему значению «достойно» или «правомерно».
- source_word: μεταβαλοίμεθα
  choice: изменили свой путь
  rationale: Передаёт перемену прежнего образа действий; буквальное «изменились» в русском здесь менее ясно.
theological_decisions:
- issue: Смысл νομίμως
  choice: по закону
  alternative: законно / должным образом
  rationale: В контексте 4 Маккавейской книги вероятна связь с верностью Закону; формулировка сохраняет эту связь без конфессионального уточнения.
- issue: Соотнесение ἐπ’ αὐτῶν
  choice: основанную на этом
  alternative: основанную на них
  rationale: Русское единственное число естественно отсылает ко всему предшествующему образу жизни в истине, сохраняя некоторую референциальную открытость оригинала.
