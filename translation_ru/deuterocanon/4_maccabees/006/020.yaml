review_pass:
  verdict: revise
  source_fidelity: 'Греческое ἐπιβιώσομεν означает «проживём/будем жить дальше», то есть продолжим жить ещё некоторое время; вариант «продлили себе жизнь» добавляет оттенок намеренного продления собственной жизни, которого в тексте нет. Остальные смысловые компоненты переданы верно: позор, краткость времени, всеобщее осмеяние и его причина — трусость.'
  naturalness: Исходная фраза в целом понятна, но сочетание «продлили себе жизнь» несколько неестественно и смыслово уже, чем оригинал. Перестановка «всё это время все насмехались бы над нами» делает соотнесённость с «этим временем» яснее и сохраняет плавный современный литературный стиль.
  terminology: «Позорно» адекватно αἰσχρόν; «трусость» точно передаёт δειλία. Специальных богословских терминов и имён нет.
  issues:
