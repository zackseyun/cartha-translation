  text: For it would be shameful if we should live on for a little while, and that while being mocked by everyone for cowardice.
translation:
  language: ru
  text: Ведь было бы позорно, если бы мы прожили ещё недолгое время, и всё это время все насмехались бы над нами за нашу трусость.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰσχρὸν
  choice: позорно
  rationale: Передаёт нравственный позор и утрату чести; естественно звучит в современной литературной русской речи.
- source_word: ἐπιβιώσομεν
  choice: мы продлили себе жизнь
  rationale: Передаёт продолжение жизни после нынешней угрозы; в данном контексте речь идёт о кратком сохранении жизни ценой уступки.
- source_word: ὀλίγον χρόνον
  choice: лишь ненадолго
  rationale: Естественно передаёт винительный длительности и подчёркивает краткость выигранного времени.
- source_word: καταγελώμενοι
  choice: насмехались бы над нами
  rationale: Передаёт продолжающееся публичное осмеяние, выраженное причастием настоящего времени в пассивном значении.
- source_word: πρὸς ἀπάντων
  choice: все
  rationale: Сохраняет всеобщий характер общественного осуждения без ненужного расширения смысла.
- source_word: ἐπὶ δειλίᾳ
  choice: за нашу трусость
  rationale: Передаёт основание насмешек; «трусость» сохраняет сильную нравственную оценку δειλία. Притяжательное местоимение естественно по-русски и соотносит обвинение с подлежащим «мы».
