lexical_decisions:
- source_word: νυνὶ δέ
  choice: Но теперь
  rationale: Передаёт переход к выводу с лёгким оттенком противопоставления.
- source_word: λογισμοῦ
  choice: разум
  rationale: Ключевое для 4 Маккавейской книги понятие разумной нравственной способности, управляющей страстями; краткий и естественный русский эквивалент.
- source_word: τὰ πάθη
  choice: страсти
  rationale: В данном этико-философском контексте речь идёт о страстях и неразумных побуждениях, а не о физических страданиях.
- source_word: νικήσαντος
  choice: победил
  rationale: Передаёт завершённость действия аористного причастия и сохраняет образ победы.
- source_word: προσηκόντως
  choice: по праву
  rationale: Выражает уместность и обоснованность признания за разумом руководящей власти.
- source_word: τὴν τῆς ἡγεμονίας ... ἐξουσίαν
  choice: власть управлять
  rationale: Естественно по-русски передаёт сочетание ἐξουσία — «власть, полномочие» и ἡγεμονία — «руководство, правление».
- source_word: προσνέμομεν
  choice: предоставляем
  rationale: Передаёт значение наделения или закрепления за кем-либо надлежащего права либо полномочия.
theological_decisions:
- issue: Этико-философское противопоставление λογισμός и πάθη
  choice: «разум» и «страсти»
  alternative: «разумное суждение» и «чувства/страдания»
  rationale: Выбранные слова сохраняют центральное для книги утверждение о господстве дисциплинированного разума над неразумными побуждениями, не привнося позднейших богословских систем.
- issue: Характер власти разума
  choice: «предоставляем ему власть управлять»
  alternative: «признаём за ним право властвовать»
  rationale: 'Формулировка сохраняет активное значение προσνέμομεν и оба смысловых компонента выражения: полномочие и руководство.'
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет философскую строгость оригинала, но остаётся понятной неспециалисту. Местоимение «ему» согласовано с русским существительным «разум».
