  yaml_path: translation/deuterocanon/4_maccabees/006/025.yaml
  text: There[a], while burning him with instruments devised for torture[c][b], they flung themselves upon him and poured foul-smelling broths into his nostrils.
translation:
  language: ru
  text: Там, обжигая его искусно, но злонамеренно изготовленными орудиями пытки[a], они набрасывались на него[b] и вливали ему в ноздри зловонные жидкости[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «коварно изобретёнными орудиями». Греческое выражение подчёркивает, что эти приспособления были искусно изготовлены для причинения вреда.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «устремлялись на него». Глагол передаёт резкое движение — прыжок или нападение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «зловонные отвары». Греческое слово может обозначать сок, отвар или другую жидкую смесь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔνθα
  choice: Там
  rationale: Наречие указывает на уже описанное место действия и сохраняет наглядность повествования; временное «тогда» здесь менее точно.
- source_word: διὰ κακοτέχνων ὀργάνων
  choice: искусно придуманными орудиями пытки
  rationale: κακότεχνος сочетает идею искусного изготовления со злонамеренным назначением, а ὄργανα обозначает орудия или приспособления. Упоминание пытки естественно передаёт их назначение в данном контексте.
- source_word: καταφλέγοντες
  choice: обжигая
  rationale: Глагол обозначает сильное воздействие огнём. «Обжигая» естественно описывает продолжаемую пытку и не требует понимать действие как полное сожжение.
- source_word: ὑπερίπτοσαν
  choice: набрасывались на него
  rationale: Передаёт резкое, направленное на человека движение и нападение, не сводя неоднозначный образ глагола к буквальному пространственному «перепрыгивали».
- source_word: δυσώδεις χυλούς
  choice: зловонные жидкости
  rationale: δυσώδης означает дурно пахнущий, а χυλός может обозначать сок, отвар или иную жидкую смесь. Обобщающее «жидкости» лучше всего подходит к действию вливания в ноздри, не добавляя неподтверждённой густоты или пищевого характера.
- source_word: μυκτῆρας
  choice: ноздри
  rationale: Форма множественного числа конкретно обозначает ноздри, а не нос вообще.
- source_word: κατέχεον
  choice: вливали
  rationale: Имперфект описывает продолжавшееся или повторявшееся действие; русское несовершенное «вливали» сохраняет этот видовой оттенок.
