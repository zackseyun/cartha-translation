  text: Let us not think so badly, we who are Abraham’s children, as to become fainthearted and act out a disgraceful scene unworthy of us.
translation:
  language: ru
  text: Не будем же мы, дети Авраама, мыслить столь низко, чтобы, проявив малодушие, разыграть недостойное нас представление.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ οὕτως κακῶς φρονήσαιμεν
  choice: Не станем же… мыслить столь низко
  rationale: Пожелательно-увещательная форма передана естественным русским призывом; κακῶς φρονεῖν здесь означает недостойный, низкий образ мыслей, а не просто ошибочное мнение.
- source_word: οἱ Ἀβραὰμ παῖδες
  choice: мы, дети Авраама
  rationale: Сохраняется образ родства и коллективная самоидентификация говорящего; παῖδες в данном контексте естественно передаётся как «дети».
- source_word: μαλακοψυχήσαντας
  choice: проявив малодушие
  rationale: Передаёт ослабление духом, робость и утрату стойкости без излишней конкретизации.
- source_word: ἀπρεπὲς ἡμῖν δρᾶμα ὑποκρίνασθαι
  choice: разыгрывать недостойное нас постыдное действо
  rationale: ὑποκρίνασθαι сохраняет оттенок исполнения роли или притворного разыгрывания, δρᾶμα — поступка/действия с возможным театральным оттенком, а ἀπρεπές — того, что не подобает говорящим.
theological_decisions:
- issue: Значение самообозначения «дети Авраама»
  choice: Сохранить буквальный родственный образ
  alternative: «потомки Авраама»
  rationale: Греческое выражение подчёркивает не только происхождение, но и идентичность и нравственное обязательство; перевод не должен сужать его до одной генеалогии.
translation_notes:
  register: Современный литературный русский с достоинством увещательной речи. Синтаксис слегка приподнят, но понятен; театральный оттенок сочетания δρᾶμα ὑποκρίνασθαι сохранён словами «разыгрывать… действо».
