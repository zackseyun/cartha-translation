  yaml_path: translation/deuterocanon/4_maccabees/006/008.yaml
  text: Then indeed one of the cruel guards[a], leaping at his sides, kept striking him so that, when he fell[b], he might rise again.
translation:
  language: ru
  text: И вот один из жестоких телохранителей[a] налетал на него и бил его ногами по бокам, чтобы тот, падая, снова поднимался.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «копьеносцев» — так могли называть вооружённых телохранителей правителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λάξ
  choice: пинал
  rationale: Наречие λάξ означает удар ногой или пяткой и относится к ἔτυπτεν; поэтому конкретное «пинал» точнее, чем отвлечённая повествовательная частица.
- source_word: γέ τοι
  choice: и вот
  rationale: Сочетание придаёт рассказу подчёркнутый переход; «и вот» естественно передаёт этот оттенок по-русски.
- source_word: τῶν πικρῶν
  choice: из жестоких
  rationale: При описании людей πικρός означает суровость и жестокость; контекст истязания поддерживает выбор «жестоких».
- source_word: δορυφόρων
  choice: телохранителей
  rationale: Буквально слово обозначает копьеносцев, но также служит обычным наименованием вооружённых телохранителей правителя.
- source_word: εἰς τοὺς κενεῶνας
  choice: по бокам
  rationale: κενεών обозначает бок или мягкую впадину между рёбрами и бедром; «по бокам» ясно и естественно передаёт место ударов.
- source_word: ἐναλλόμενος
  choice: наскакивая на него
  rationale: Причастие передаёт резкое движение на жертву или против неё; «наскакивая» сохраняет динамику сцены.
- source_word: ἔτυπτεν
  choice: пинал
  rationale: Имперфект указывает на продолжавшиеся или повторные удары; русская форма несовершенного вида сохраняет эту длительность.
- source_word: ὅπως ἐξανίσταιτο πίπτων
  choice: чтобы тот, падая, снова поднимался
  rationale: 'Конструкция выражает цель: ударами его вынуждали вновь подниматься, когда он падал. Настоящее причастие πίπτων передано одновременным деепричастием.'
theological_decisions:
- issue: Возможность понять ἐξανίσταιτο как указание на воскресение
  choice: физически снова поднимался после падения
  alternative: воскресал
  rationale: Контекст истязания и причастие πίπτων показывают, что речь идёт о том, как мученика ударами заставляли вновь подняться, а не о воскресении.
translation_notes:
  register: Современный литературный русский язык с сохранением резкой телесности греческого описания. Форма «пинал» передаёт λάξ вместе с повторностью имперфекта; синтаксис целевой части оставлен достаточно близким к оригиналу.
