  text: When they saw that he was so noble-minded in the face of these compulsions, and that he was not even changing toward pity for them, they led him to the fire.
translation:
  language: ru
  text: Увидев, что перед лицом этих принуждений он столь великодушен и не смягчается даже от их сострадания, они повели его к огню.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρὸς τὰς ἀνάγκας
  choice: под таким принуждением
  rationale: Предлог πρός здесь описывает отношение Елеазара к оказываемому на него давлению, а ἀνάγκαι — внешнее принуждение, а не обычную необходимость. Русское выражение передаёт ситуацию давления без сужения значения до одних лишь пыток.
- source_word: οὕτως μεγαλοφρονοῦντα
  choice: он сохраняет величие духа
  rationale: Μεγαλοφρονέω обозначает величие и благородство духа. Такая формулировка естественна по-русски и сохраняет нравственно-волевой оттенок, не сводя его только к храбрости.
- source_word: ἰδόντες
  choice: увидев
  rationale: Аористное причастие естественно передано русским деепричастием, выражающим действие, предшествующее основному.
- source_word: μηδὲ πρὸς τὸν οἰκτιρμὸν αὐτῶν μεταβαλλόμενον
  choice: и даже не склоняется к жалости к ним
  rationale: 'Μηδέ передано усилительным «даже не», а μεταβάλλομαι с πρός — как перемена внутреннего расположения в сторону жалости. Местоимение αὐτῶν понято объектно: жалость к мучителям.'
- source_word: ἐπὶ τὸ πῦρ αὐτὸν ἦγον
  choice: они повели его к огню
  rationale: Ἄγω означает «вести», а ἐπὶ с винительным указывает движение к огню; перевод не уточняет сверх текста, был ли он в этот момент брошен непосредственно в огонь.
