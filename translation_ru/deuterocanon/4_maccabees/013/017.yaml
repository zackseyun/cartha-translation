lexical_decisions:
- source_word: οὕτως
  choice: так
  rationale: Кратко передаёт наречие образа действия или следствия, не уточняя искусственно его связь с утраченным либо несогласованным контекстом.
- source_word: παθόντας
  choice: после того как мы пострадаем
  rationale: Аористное причастие от πάσχω обозначает перенесённое страдание; личная придаточная конструкция естественна по-русски и сохраняет соотнесённость с ἡμᾶς. Будущее время обусловлено синтаксической незавершённостью фрагмента и не устраняет его неоднозначность.
- source_word: ἡμᾶς
  choice: мы
  rationale: Греческое винительное местоимение входит в причастную конструкцию; в естественной русской передаче преобразовано в подлежащее придаточного предложения.
- source_word: Ἀβραὰμ
  choice: Авраам
  rationale: Общепринятая русская форма имени патриарха.
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз.
- source_word: Ἰσαὰκ
  choice: Исаак
  rationale: Общепринятая русская форма имени патриарха.
theological_decisions:
- issue: Фрагментарный или несогласованный исходный текст
  choice: Перевести сохранившийся греческий фрагмент как незавершённую конструкцию и обозначить обрыв тире.
  alternative: Восстановить полное предложение по другим изданиям или контексту.
  rationale: Предоставленный греческий текст отмечен как существенно несогласованный и сам по себе синтаксически незавершён. Реконструкция внесла бы сведения, отсутствующие в данном исходном свидетельстве.
- issue: Временная отнесённость παθόντας
  choice: «после того как мы пострадаем»
  alternative: «после того как мы пострадали» или «нам, претерпевшим это»
  rationale: Аористное причастие выражает предшествование по отношению к не сохранившемуся главному действию, но сам фрагмент не фиксирует абсолютного времени. Будущая форма делает русский фрагмент связным, сохраняя незавершённость; примечание предупреждает о повреждении свидетельства.
translation_notes:
  register: Современный литературный русский язык; сдержанный библейский регистр. Синтаксический обрыв исходного свидетельства сохранён с помощью тире, а примечание прозрачно сообщает о текстологической проблеме.
