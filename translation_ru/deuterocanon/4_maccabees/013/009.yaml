  yaml_path: translation/deuterocanon/4_maccabees/013/009.yaml
  text: Let us die as brothers[a], brothers, for the sake of the law; let us imitate the three young men in Syria[b], who despised the furnace of equal torment.
translation:
  language: ru
  text: Умрём же по-братски, братья, ради Закона; будем подражать трём юношам в Сирии[a], которые презрели печь, столь же грозную, как их испытание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имеются в виду три иудейских юноши из Дан 3. Здесь греческий текст говорит «в Сирии», а не использует более привычное по книге Даниила указание на Вавилон.
    reason: cross_reference
  - marker: b
    text: Греческое прилагательное ἰσοπαίδος очень редкое и трудное для истолкования. Вероятно, оно сопоставляет эту печь или связанное с ней испытание с печью, которой не устрашились три юноши; возможен также смысл «столь же страшной (жаркой)».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφικῶς
  choice: по-братски
  rationale: Наречие обозначает образ действия и вместе с повторным обращением «братья» подчёркивает братскую солидарность.
- source_word: ἀποθάνωμεν
  choice: умрём же
  rationale: Аорист конъюнктива имеет побудительное значение; частица «же» естественно передаёт призыв в современном русском.
- source_word: ἀδελφοί
  choice: братья
  rationale: Речь обращена к родным братьям мужского пола, поэтому родовое или гендерно-нейтральное обозначение здесь неуместно.
- source_word: περὶ τοῦ νόμου
  choice: ради Закона
  rationale: Предлог с родительным выражает основание и цель готовности умереть; прописная буква указывает на Моисеев Закон в данном контексте.
- source_word: μιμησώμεθα
  choice: будем подражать
  rationale: Побудительный конъюнктив передан прямым совместным призывом, без ослабления до простого воспоминания о примере.
- source_word: τοὺς τρεῖς τοὺς ἐπὶ τῆς Συρίας νεανίσκους
  choice: трём юношам в Сирии
  rationale: Перевод сохраняет явное географическое обозначение греческого текста и не заменяет его более привычным «в Вавилоне».
- source_word: τῆς ἰσοπαίδος καμίνου
  choice: к печи, равной по суровости их испытанию
  rationale: Редкое и трудное определение ἰσοπαίδος передано осторожно как сравнение печи с испытанием трёх юношей; примечание сохраняет лексическую неопределённость.
- source_word: κατεφρόνησαν
  choice: с презрением отнеслись
  rationale: Передаёт значение сознательного пренебрежения опасностью и звучит естественнее буквального «презрели печь».
theological_decisions:
- issue: Аллюзия на Дан 3 и географическое обозначение
  choice: три юноши в Сирии
  alternative: три юноши в Вавилоне
  rationale: Греческий источник прямо говорит ἐπὶ τῆς Συρίας; перевод не гармонизирует эту формулировку с привычным местом действия рассказа в книге Даниила.
- issue: Передача обращения ἀδελφοί
  choice: братья
  alternative: братья и сёстры / родные
  rationale: В повествовательной ситуации говорящий обращается к своим родным братьям, поэтому мужская форма является смысловой, а не обобщающей.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным побудительным строем. Сохранены риторический повтор «по-братски, братья», единый период исходного стиха и неустранённая через примечание неоднозначность редкого слова ἰσοπαίδος.
