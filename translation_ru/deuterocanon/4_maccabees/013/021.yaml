  rationale: Естественно передаёт пассивное значение рождения и поддерживает материнский образ контекста.
- source_word: γαλακτοποτοῦντες
  choice: пившие молоко
  rationale: Прямо передаёт значение сложного глагола и в сочетании с «источниками» сохраняет образность греческого текста.
- source_word: τῶν αὐτῶν ... πηγῶν
  choice: из одних и тех же источников
  rationale: «Источники» сохраняют явную метафору πηγαί, не подменяя её более конкретным упоминанием материнской груди.
- source_word: ἀφʼ οὗ συντρέφονται
  choice: от которых они вместе вскормлены
  rationale: Основной текст связывает оборот с предшествующим образом источников и передаёт приставку συν- словом «вместе»; необычное число относительного местоимения и возможное временное понимание отмечены в сноске.
