base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/013.yaml
  text: Because of godliness Isaac endured[a]. And each one, while looking at the others, all together cheerful and very courageous, said[c][b], “Let us dedicate ourselves to God with our whole heart—to the one who gave us our lives—and let us use our bodies to keep watch over the law.”
translation:
  language: ru
  text: 'Ради благочестия[a] Исаак выстоял. Все они, глядя друг на друга, — каждый в отдельности и все вместе, радостные и весьма мужественные, — говорили: «Посвятим себя Богу всем сердцем — Тому, Кто даровал нам жизнь[b], — и употребим свои тела для охраны Закона[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради почитания Бога». Греческое εὐσέβεια означает благочестие, почтение и преданность Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Тому, Кто дал души». Греческое ψυχή может означать как «душу», так и «жизнь»; здесь, вероятно, имеется в виду жизнь, дарованная Богом.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чтобы хранить Закон». Греческое выражение сохраняет образ бдительной охраны, а не просто означает «исполнять Закон».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν εὐσέβειαν
  choice: ради благочестия
  rationale: «Благочестие» передаёт направленную к Богу почтительность и верность, являющуюся одной из ключевых добродетелей книги; оборот «ради» естественно выражает причинно-мотивирующее значение διά с винительным падежом.
- source_word: ὑπέμεινεν
  choice: выстоял
  rationale: Глагол обозначает стойкое перенесение испытания. «Выстоял» ясно передаёт не просто пассивное страдание, а сохранение твёрдости.
- source_word: ἐφορῶντες ἀλλήλους
  choice: смотрел на остальных
  rationale: Греческое выражение описывает взаимный взгляд братьев. Синтаксис перестроен с учётом начального «каждый из них», чтобы фраза звучала естественно по-русски.
- source_word: φαιδροὶ καὶ μάλα θαρραλέοι
  choice: радостные и исполненные мужества
  rationale: «Радостные» передаёт светлое, бодрое расположение, выраженное φαιδροί, а «исполненные мужества» сохраняет усиленное μάλα качество θαρραλέοι без тяжеловесного буквального наречия.
- source_word: ἀφιερώσωμεν ἑαυτούς
  choice: посвятим себя
  rationale: Передаёт добровольную полную отдачу себя Богу и сохраняет торжественный, но понятный современному читателю регистр.
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: всем сердцем
  rationale: Естественный русский эквивалент, сохраняющий значение всецелой внутренней преданности.
- source_word: τῷ δόντι τὰς ψυχάς
  choice: Тому, Кто даровал нам жизнь
  rationale: ψυχή допускает значения «душа» и «жизнь»; в контексте мученической смерти речь естественно понимать о жизни, полученной от Бога. «Даровал» соответствует возвышенному контексту и не добавляет специальной антропологии.
- source_word: χρήσωμεν ... τὰ σώματα
  choice: употребим свои тела
  rationale: Сохраняется намеренно предметный образ использования тел как орудия верности, хотя по-русски выражение остаётся несколько необычным, как и греческая конструкция.
- source_word: τῇ περὶ τὸν νόμον φυλακῇ
  choice: на то, чтобы хранить Закон
  rationale: Глагол «хранить» сохраняет образ бдительной охраны, заложенный в φυλακή, и не сводит его лишь к абстрактному «соблюдению».
theological_decisions:
- issue: Смысл εὐσέβεια как центральной добродетели книги
  choice: благочестие
  alternative: почитание Бога
  rationale: «Благочестие» достаточно широко обозначает почтение к Богу, проявляющееся в верности, и не ограничивает смысл обрядовой набожностью.
- issue: Значение ψυχαί в выражении τῷ δόντι τὰς ψυχάς
  choice: жизнь
  alternative: души
  rationale: Контекст готовности к мученичеству подчёркивает жизнь как Божий дар. Вариант «души» формально возможен, поэтому сохранён в примечании, но мог бы неоправданно внушать более узкое метафизическое толкование.
- issue: Образ φυλακή применительно к Закону
  choice: хранить Закон
  alternative: соблюдать Закон
  rationale: Выбранный вариант сохраняет метафору охраны и бдительной верности, не заменяя её более общим понятием послушания.
translation_notes:
  register: 'Современный литературный русский язык с торжественностью, соответствующей речи мучеников. Синтаксис греческой фразы с сочетанием «каждый» и форм множественного числа умеренно перестроен: сначала отмечен взгляд каждого на остальных, затем дана общая речь всей группы. Слова «благочестие», «даровал» и «хранить Закон» dignified but remain broadly understandable; «употребим свои тела» намеренно сохраняет необычный и сильный образ оригинала.'
