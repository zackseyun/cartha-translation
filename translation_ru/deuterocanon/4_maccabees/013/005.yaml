base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/005.yaml
  text: How then can one fail to acknowledge in these men the mastery over suffering that comes from blessedness[a], since they were not turned aside even by the pains of fire?
translation:
  language: ru
  text: Как же не признать в них власть здравого разума над страстями[a], если даже страдания, причинённые огнём, не заставили их отступить?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «господство над страстями, свойственное благоразумию». Греческое выражение редкое; его компонент, переданный словом «страсти», может включать также страдания и боль. Здесь речь идёт о самообладании братьев перед лицом мучений.'
    reason: Редкое философское выражение допускает несколько близких толкований, которые невозможно полностью отразить в основном тексте.
lexical_decisions:
- source_word: πῶς οὖν οὐκ ἔστιν ... ὁμολογεῖν
  choice: Как же не признать
  rationale: Риторический оборот выражает неизбежность признания; по-русски это естественно передаётся кратким вопросом «Как же не признать…?».
- source_word: τούτοις
  choice: в них
  rationale: Дательный падеж указывает на качество, обнаруживаемое в этих людях; «в них» сохраняет этот смысл без тяжеловесного уточнения.
- source_word: τὴν τῆς εὐλογιστίας παθοκρατίαν
  choice: власть здравого разума над страстями
  rationale: Редкое εὐλογιστία по составу и в философском контексте книги указывает на здравое, правильное рассуждение, а παθοκρατία — на владычество над πάθη, то есть страстями, включая телесную боль. Перевод сохраняет отношение между разумом и страстями, не сводя выражение только к перенесению страданий.
- source_word: οἱ ... οὐκ ἐπεστράφησαν
  choice: не заставили их отступить
  rationale: Греческая пассивная форма описывает безуспешную попытку отвратить мучеников от избранного пути; русская каузативная конструкция естественно передаёт тот же смысл.
- source_word: τῶν μὲν διὰ πυρὸς ἀλγηδόνων
  choice: даже муки огнём
  rationale: ἀλγηδόνες означает сильные боли или мучения, а διὰ πυρός обозначает орудие их причинения. Частица «даже» передаёт усилительный оттенок контекста.
theological_decisions:
- issue: Смысл редкого выражения τῆς εὐλογιστίας παθοκρατίαν
  choice: власть здравого разума над страстями
  alternative: власть благочестия над страданиями; господство над страстями, свойственное благоразумию
  rationale: 'Основная тема 4 Маккавейской — господство добродетельного рассудка над страстями. Однако редкость εὐλογιστία и широта πάθη не позволяют чрезмерно сужать выражение: примыкающее упоминание огненных мук показывает, что сюда входит и телесная боль. Сноска сохраняет эту неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с достоинством риторического вопроса. Формулировка остаётся понятной широкому читателю, а философская точность редкого греческого сочетания поясняется в сноске.
