  yaml_path: translation/deuterocanon/4_maccabees/013/018.yaml
  text: And Jacob will welcome you[a], and all the fathers will praise you. And as each one of their brothers was being taken away, those who remained were saying, “Do not disgrace us, brother[b], nor prove false to those who died before us.”
translation:
  language: ru
  text: 'И Иаков примет вас[a], и все отцы восхвалят вас. Когда каждого из их братьев уводили, остававшиеся говорили: «Не посрами нас, брат, и не обмани тех, кто умер прежде нас[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встретит вас», «радушно примет вас».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «не солги тем, кто умер прежде нас» или «не сделай ложными слова тех, кто умер прежде нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδέξονται
  choice: примет вас
  rationale: Глагол ὑποδέχομαι означает «принимать», нередко радушно. «Примет вас» сохраняет широту значения и уместно передаёт почётный приём; множественное число греческой формы, вероятно, связано с составным подлежащим в предшествующем контексте, тогда как в данном фрагменте явно назван Иаков.
- source_word: οἱ πατέρες
  choice: все отцы
  rationale: Буквальный перевод сохраняет почётное обозначение праотцов и не заменяет его более толковательным словом «предки».
- source_word: ἐπαινέσουσιν
  choice: восхвалят
  rationale: Передаёт прямое значение похвалы и поддерживает возвышенный, но понятный регистр.
- source_word: ἐνὶ ἑκάστῳ τῶν ἀποσπωμένων αὐτῶν ἀδελφῶν
  choice: когда каждого из их братьев уводили прочь
  rationale: «Когда» естественно выражает повторявшееся обстоятельство, «каждого» сохраняет распределительное значение, а «уводили прочь» передаёт отделение от остальных без чрезмерного усиления насилия.
- source_word: οἱ περιλειπόμενοι
  choice: остававшиеся
  rationale: Обозначает тех братьев, которые в тот момент ещё оставались, не утверждая, что они в итоге выжили.
- source_word: Μὴ καταισχύνῃς ἡμᾶς
  choice: Не посрами нас
  rationale: «Посрамить» точно передаёт публичный позор и соответствует серьёзному увещевательному тону.
- source_word: μηδὲ ψεύσῃ τοὺς προαποθανόντας
  choice: и не окажись неверным тем, кто умер прежде нас
  rationale: Фраза допускает значения «обмануть», «предать», «сделать ложными». Выбранный вариант сохраняет нравственно-свидетельский оттенок, не утверждая буквально, будто умершие становятся лжецами.
theological_decisions:
- issue: Кого обозначает Иаков в сцене посмертного принятия мучеников
  choice: Сохранено личное имя патриарха Иакова без пояснения в основном тексте.
  alternative: Понимать Иакова собирательно как Израиль.
  rationale: Соседнее упоминание «всех отцов» естественнее указывает на Иакова как на одного из почитаемых праотцов, однако перевод не разворачивает это понимание в толкование.
- issue: Смысл верности ранее умершим братьям
  choice: «Не окажись неверным» передаёт призыв не изменить их примеру и свидетельству.
  alternative: «Не обмани» или «не сделай ложными» умерших прежде.
  rationale: Греческая конструкция напряжённа и неоднозначна; основной текст остаётся естественным по-русски, а буквальные возможности отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. Формы «восхвалят» и «не посрами» сохраняют достоинство мученической речи, оставаясь понятными современному читателю. Все сносочные маркеры помещены непосредственно в основной текст.
