  text: It is impossible to overlook the rule of reason[a], for they prevailed over both passion and pains.
translation:
  language: ru
  text: 'Нельзя не признать господство разума[a]: ведь они возобладали и над страстью, и над муками.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ума». Греческое слово может означать ум, мышление или понимание; здесь подчёркнута способность разумно судить и управлять страстями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔστιν παριδεῖν
  choice: Нельзя не признать
  rationale: Отрицательная безличная конструкция с инфинитивом выражает невозможность пройти мимо очевидного свидетельства. Русское «нельзя не признать» естественно передаёт смысл, не сводя παριδεῖν к простому зрительному восприятию.
- source_word: ἡγεμονίαν
  choice: господство
  rationale: Слово обозначает руководство, власть или главенство; здесь речь идёт о господствующей силе разума над внутренними побуждениями и телесной болью.
- source_word: τῆς διανοίας
  choice: разума
  rationale: В философско-этическом рассуждении 4 Маккавейской διάνοια обозначает мыслящую и рассуждающую способность человека. «Разум» точнее передаёт её управляющую роль, чем более широкое «ум».
- source_word: ἐπεκράτησαν
  choice: возобладали над
  rationale: Глагол означает оказаться сильнее, одержать верх или получить превосходство; «возобладали над» сохраняет управление родительным падежом по смыслу и возвышенный, но современный регистр.
- source_word: πάθους
  choice: страстью
  rationale: В контексте книги πάθος — внутреннее аффективное побуждение, над которым господствует разум. Единственное число греческого текста сохранено.
- source_word: πόνων
  choice: муками
  rationale: Во множественном числе слово указывает на телесные боли и мучения, которые претерпели герои; «муки» естественнее русского «боли» в контексте испытаний и пыток.
- source_word: καὶ πάθους καὶ πόνων
  choice: и над страстью, и над муками
  rationale: 'Повтор «и… и…» сохраняет греческую соотносительную конструкцию и подчёркивает две области победы: внутреннюю страсть и внешние мучения.'
theological_decisions:
- issue: Передача философско-антропологического термина διάνοια и тезиса о её власти
  choice: господство разума
  alternative: власть ума / господство рассудка
  rationale: «Разум» ясно выражает способность к нравственному суждению, управляющую страстями, не привнося более поздних конфессиональных антропологических схем. «Ум» шире, а «рассудок» в современном русском может звучать слишком узко.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным философским регистром. Пара «страсть — муки» сохраняет различие между внутренним аффектом и телесными страданиями; пунктуация передаёт пояснительное значение γάρ.
