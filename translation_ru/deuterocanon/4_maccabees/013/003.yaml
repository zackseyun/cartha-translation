  yaml_path: translation/deuterocanon/4_maccabees/013/003.yaml
  text: But now it is not so; rather[a], by the reasoning that is praised by God, they overcame the passions.
translation:
  language: ru
  text: 'Но теперь не так: напротив, благодаря одобряемому Богом разумному суждению[a] они одержали верх над страстями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодаря одобряемому Богом разуму»; греческое слово может означать «разум», «рассуждение» или «разумное суждение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Но теперь
  rationale: Кратко и естественно передаёт противопоставление предшествующей ситуации или ожиданию.
- source_word: οὐχ οὕτως
  choice: не так
  rationale: Сохраняет эллиптичность греческого выражения, не уточняя подразумеваемое сравнение.
- source_word: ἀλλὰ
  choice: напротив
  rationale: Ясно выражает исправительное противопоставление после отрицания.
- source_word: τῷ ἐπαινουμένῳ λογισμῷ
  choice: благодаря одобряемому Богом разумному суждению
  rationale: Творительный по смыслу дательный передан как средство победы; «разумное суждение» отражает деятельный нравственно-интеллектуальный смысл ключевого для книги термина λογισμός.
- source_word: παρὰ θεῷ
  choice: Богом
  rationale: В сочетании с ἐπαινουμένῳ наиболее естественно указывает на Бога как на того, кто одобряет такое суждение.
- source_word: περιεγένοντο
  choice: одержали верх над
  rationale: Передаёт победу и превосходство над противостоящей силой, оставаясь естественным для современного русского языка.
- source_word: τῶν παθῶν
  choice: страстями
  rationale: В философской аргументации 4 Маккавейской речь идёт о внутренних влечениях и аффектах, которыми управляет разум, а не только о внешних страданиях.
theological_decisions:
- issue: Передача программного термина λόγισμός в 4 Маккавейской
  choice: разумное суждение
  alternative: разум; рассуждение
  rationale: Выражение сохраняет идею деятельной нравственной оценки и самоуправления, не сводя термин ни к отвлечённой способности, ни к формальному процессу рассуждения.
- issue: Значение παρὰ θεῷ при ἐπαινουμένῳ
  choice: одобряемому Богом
  alternative: одобряемому пред Богом; одобряемому в глазах Бога
  rationale: Конструкция естественнее всего обозначает Бога как источник одобрения, при этом не добавляя к тексту дальнейших богословских выводов.
translation_notes:
  register: Современный литературный русский язык с достоинством философско-мученического контекста. Ключевой термин передан понятно для широкого читателя, а его смысловой диапазон сохранён в сноске.
