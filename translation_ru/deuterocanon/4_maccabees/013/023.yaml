  naturalness: «В нашем упражнении по Закону Божьему» звучит по-русски тяжеловесно и неестественно. Кроме того, деепричастный оборот «разделяя общие чувства» грамматически относится к «братской любви» и создаёт неудачную, семантически размытую конструкцию. Более естественно выразить συμπαθούσης определением «проникнутая взаимным сочувствием».
