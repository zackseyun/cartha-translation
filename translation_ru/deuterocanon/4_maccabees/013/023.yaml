lexical_decisions:
- source_word: ἀσκήσεως
  choice: упражнении
  rationale: Слово обозначает целенаправленную практику, тренировку и самодисциплину. «Упражнение» сохраняет этот смысл и не придаёт выражению более позднего узкотехнического значения аскезы.
- source_word: ἐν νόμῳ θεοῦ
  choice: по Закону Божьему
  rationale: Оборот указывает на Божий Закон как на среду и норму этой дисциплинированной практики; «по Закону Божьему» естественно передаёт нормативный оттенок.
- source_word: φιλαδελφίας
  choice: братская любовь
  rationale: Греческое слово обозначает любовь и привязанность между братьями; в данном рассказе речь идёт именно о семерых братьях.
- source_word: συμπαθούσης
  choice: разделяя общие чувства
  rationale: Причастие выражает сочувствие и совместное переживание. Такая передача сохраняет идею взаимной эмоциональной сопричастности, не сводя её только к жалости.
- source_word: καθεστηκυίας
  choice: утвердилась
  rationale: Перфектное причастие описывает достигнутое и сохраняющееся состояние; «утвердилась» передаёт эту устойчивость без лишнего усиления.
- source_word: οἱ ἑπτὰ ἀδελφοὶ
  choice: семеро братьев
  rationale: Греческий текст прямо говорит о семи братьях мужского пола; собирательное числительное звучит естественно по-русски.
- source_word: συνπα-
  choice: объединились—
  rationale: Предоставленный текст обрывается внутри слова. Предварительная передача опирается на видимую приставочную часть со значением совместности и на контекст братской солидарности, а тире и сноска открыто отмечают неполноту свидетельства.
theological_decisions:
- issue: Гендерно маркированное обозначение родства
  choice: семеро братьев
  alternative: семеро детей одной семьи
  rationale: Источник употребляет существительное мужского рода и в повествовании имеет в виду семерых братьев, поэтому гендерная конкретность сохранена.
- issue: Неполное слово в конце предоставленного греческого текста
  choice: Осторожная предварительная передача с тире и сноской
  alternative: Оставить συνπα- без перевода или восстановить полную форму по другому изданию
  rationale: Предоставленное свидетельство заканчивается на συνπα-. Перевод не скрывает повреждение и не выдаёт реконструкцию по иному тексту за достоверное чтение данного источника.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим мученическому повествованию. Начальное «и» сохранено, поскольку стих продолжает предыдущую синтаксическую мысль. Оборот «упражнение по Закону Божьему» намеренно сохраняет оттенок дисциплинированной практики, не вводя поздней специальной аскетической терминологии.
