  text: Ведь вместе с благочестием она делала братскую любовь более желанной для них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σὺν
  choice: вместе с
  rationale: Передаёт значение совместности, не превращая связь между двумя добродетелями в причинную.
- source_word: εὐσεβείᾳ
  choice: благочестием
  rationale: В контексте 4 Маккавейской книги слово обозначает преданность Богу и согласованную с ней жизнь; «благочестие» сохраняет религиозную направленность термина.
- source_word: ποθεινοτέραν
  choice: всё более желанной
  rationale: Сравнительная степень выражает возрастание привлекательности и ценности братской любви; «всё» также естественно сочетается с длительным значением имперфекта.
- source_word: αὐτοῖς
  choice: для них
  rationale: Дательный указывает, в чьём восприятии братская любовь становилась желаннее.
- source_word: κατεσκεύαζεν
  choice: делала
  rationale: В сочетании с предикативным прилагательным глагол означает «делала, приводила в такое состояние»; имперфект передан выражением продолжающегося изменения «всё более».
- source_word: φιλαδελφίαν
  choice: братскую любовь
  rationale: В ближайшем контексте речь идёт о любви между родными братьями, поэтому сохранена семейная конкретность слова.
theological_decisions:
- issue: Передача εὐσέβεια как богословски значимой добродетели
  choice: благочестие
  alternative: почтение к Богу
  rationale: «Благочестие» — устоявшееся и понятное обозначение богобоязненной преданности и соответствующего образа жизни; оно не сужает смысл до одного лишь чувства почтения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Синтаксис сохраняет тесное соположение благочестия и братской любви, а имперфект и сравнительная степень естественно выражены сочетанием «делала… всё более желанной».
