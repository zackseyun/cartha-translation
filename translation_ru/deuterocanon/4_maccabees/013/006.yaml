lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: Ибо как
  rationale: Сохраняет и пояснительную связь γὰρ с предшествующим рассуждением, и вводимое καθάπερ сравнение; незавершённость фразы соответствует продолжению предложения в следующем стихе.
- source_word: προβλῆτες λιμένων πύργοι
  choice: башни на портовых молах
  rationale: Передаёт конкретный образ выдвинутых к морю портовых сооружений с башнями; «мол» — понятный современный термин для сооружения, защищающего гавань от волн.
- source_word: τὰς κυμάτων ἀπειλάς
  choice: угрозы волн
  rationale: Буквально сохраняет олицетворяющий образ ἀπειλάς, не сводя его лишь к физическим ударам волн.
- source_word: ἀνακόπτοντες
  choice: отражая
  rationale: Передаёт активное сдерживание и отбрасывание наступающей силы волн; естественно сочетается с существительным «угрозы».
- source_word: γαληνὸν παρέχουσιν
  choice: дают… спокойное
  rationale: Прилагательное γαληνόν относится к τὸν ὅρμον и характеризует защищённое место как спокойное; русский порядок слов сохраняет эту связь естественно.
- source_word: τοῖς εἰσπλέουσιν
  choice: тем, кто входит в гавань
  rationale: Передаёт субстантивированное причастие настоящего времени и морское движение внутрь гавани, не уточняя без необходимости, идёт ли речь о мореходах или судах.
- source_word: τὸν ὅρμον
  choice: пристанище
  rationale: ὅρμος допускает значения гавани, якорной стоянки или защищённого пристанища. «Пристанище» сохраняет образ безопасного места и избегает тяжёлого повтора слова «гавань» в той же части фразы.
