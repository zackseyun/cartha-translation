  text: But he kept saying[a], “Remember from whom you come, and by what father's hand you are to be slaughtered.”
translation:
  language: ru
  text: 'Но он повторял: «Помните, от кого вы происходите[a], и рукою какого отца вам предстоит быть закланными[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помните, откуда вы». Греческое выражение может указывать на место происхождения, но здесь, вероятно, имеется в виду род.'
    reason: lexical_alternative
  - marker: b
    text: В представленном греческом тексте буквально стоит «или», а конструкция с неопределённой формой «быть закланными» синтаксически сжата. Перевод передаёт вероятный смысл связного увещания, не добавляя имени, отсутствующего в данном фрагменте.
    reason: source_syntax
lexical_decisions:
- source_word: ὁ δὲ ἔλεγεν
  choice: Но он повторял
  rationale: Имперфект ἔλεγεν передаёт продолжающуюся или повторявшуюся речь; «повторял» естественно выражает этот вид. δέ отмечает переход или противопоставление и передано как «но».
- source_word: Μνήσθητε
  choice: Помните
  rationale: Аористный императив призывает решительно удержать в памяти своё происхождение; краткое «помните» звучит прямо и естественно.
- source_word: πόθεν ἐστέ
  choice: от кого вы происходите
  rationale: Буквально πόθεν может обозначать «откуда», однако в сочетании с последующим упоминанием отца контекст указывает прежде всего на род и происхождение. Сноска сохраняет пространственную возможность.
- source_word: ἢ
  choice: и
  rationale: В представленном греческом тексте стоит ἢ («или»), но в данном увещании две части образуют совокупное напоминание, а английский консультационный слой также отражает связку. Расхождение открыто отмечено в сноске, а не скрыто.
- source_word: τίνος πατρὸς χειρὶ
  choice: рукою какого отца
  rationale: Творительный χειρί выражает средство или действующее лицо и сохраняется в ярком образе «рукою». τίνος πατρός передано без уточнения личности, чтобы не вносить отсутствующее в данном фрагменте имя.
- source_word: σφαγιασθῆναι
  choice: быть закланными
  rationale: Глагол обозначает насильственное заклание и может иметь жертвенный оттенок. «Быть закланными» сохраняет эту силу, не утверждая дополнительно, что смерть непременно является культовой жертвой.
theological_decisions:
- issue: 'Смысл πόθεν ἐστέ: место или род'
  choice: «от кого вы происходите» — акцент на родовом происхождении
  alternative: «откуда вы» — буквальное указание на место или источник происхождения
  rationale: Упоминание отца в следующей части делает родовой смысл вероятным, но греческое πόθεν само по себе допускает более широкое понимание; поэтому альтернатива вынесена в сноску.
- issue: Степень жертвенного смысла σφαγιασθῆναι
  choice: «быть закланными»
  alternative: «быть убитыми» или «быть зарезанными»
  rationale: Выбранное слово передаёт жестокую и потенциально жертвенную окраску глагола, но перевод не добавляет отдельного богословского утверждения о характере смерти.
- issue: Связка ἢ между двумя призывами
  choice: В основном тексте «и», при явном указании буквального «или» в сноске
  alternative: «или»
  rationale: Буквальное «или» делает русскую фразу и логику увещания неясными; «и» передаёт вероятную функцию перечисления, тогда как сноска сохраняет засвидетельствованную форму источника и подлинную текстово-синтаксическую трудность.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной лексикой. «Закланными» намеренно сохраняет библейскую возвышенность и силу греческого глагола; остальной синтаксис сделан естественным для современного читателя. Подлинная неоднозначность происхождения и трудность связки ἢ обозначены сносками.
