translation:
  language: ru
  text: Не станем малодушничать, проявляя наше благочестие[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не будем трусливы в доказательстве нашего благочестия».'
    reason: 'Лексическая альтернатива: δειλανδρέω может передаваться как «быть трусливым», а ἀπόδειξις — как «доказательство» или «подтверждение».'
lexical_decisions:
- source_word: μὴ δειλανδρήσωμεν
  choice: Не станем малодушничать
  rationale: Отрицание с увещательным сослагательным наклонением передано естественным русским призывом от первого лица множественного числа. «Малодушничать» сохраняет нравственно сильное значение глагола — проявлять трусость, терять мужество.
- source_word: πρὸς τὴν ... ἀπόδειξιν
  choice: свидетельствуя
  rationale: Оборот обозначает отношение к проявлению или доказательству благочестия. Деепричастие естественно связывает призыв с конкретным действием, а «свидетельствовать» передаёт публичное подтверждение верности жизнью и стойкостью, не сводя смысл к отвлечённому логическому доказательству.
- source_word: τῆς εὐσεβίας
  choice: о нашей преданности Богу
  rationale: В контексте 4 Маккавейской εὐσέβεια означает почтительную и деятельную верность Богу. «Преданность Богу» ясно выражает направленность понятия и звучит современнее, чем неоднозначное «благочестие». Притяжательное «нашей» естественно вытекает из речи от первого лица, хотя в греческом отдельно не выражено.
theological_decisions:
- issue: Смысл εὐσέβεια в увещании к мученической стойкости
  choice: преданность Богу
  alternative: благочестие; почитание Бога
  rationale: Выбранный вариант охватывает внутреннюю верность и её деятельное проявление, не вводя конфессионального или позднейшего технического смысла.
- issue: Характер ἀπόδειξις
  choice: свидетельствование преданности
  alternative: доказательство; проявление преданности
  rationale: Контекст допускает как доказательство, так и наглядное проявление. Основной текст передаёт практическое и публичное свидетельство, а примечание сохраняет более буквальную альтернативу.
translation_notes:
  register: Современный литературный русский язык с краткой, энергичной увещательной формой. Тон достоин обстановки испытания; архаизмы и узкоконфессиональная терминология не используются.
