translation:
  language: ru
  text: 'И один говорил[a]: «Мужайся, брат», а другой: «Терпи достойно».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «один говорил… а другой…»; имеются в виду поочерёдно говорившие братья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Θάρρει
  choice: Мужайся
  rationale: Повелительная форма выражает призыв обрести мужество; «мужайся» естественно и кратко передаёт ободрение в возвышенном, но современном русском регистре.
- source_word: ἀδελφέ
  choice: брат
  rationale: Форма звательного обращения мужского рода единственного числа; контекст прямо указывает на родного брата.
- source_word: Εὐγενῶς
  choice: стойко
  rationale: В данном контексте наречие характеризует достойное, благородное перенесение страданий. «Стойко» естественно сочетается с «терпи» и сохраняет нравственно-похвальный оттенок, хотя прямое значение благородства раскрывается менее явно.
- source_word: καρτέρησον
  choice: терпи
  rationale: Аористный императив призывает выдержать страдание и не отступить; «терпи» кратко передаёт эту силу, а наречие «стойко» уточняет характер терпения.
- source_word: ὁ μέν ... ὁ δέ
  choice: один ... другой
  rationale: Соотносительная конструкция различает двух последовательно выступающих говорящих, не называя существительное прямо.
- source_word: ἔλεγεν
  choice: говорил
  rationale: Имперфект допускает длительное или повторяющееся действие; «говорил» сохраняет этот аспект лучше, чем точечное «сказал», не делая повторность обязательной.
