  text: Let us not fear the one who seems to kill[a].
translation:
  language: ru
  text: Не будем бояться того, кто, как кажется, может убить[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «того, кто, по видимости, убивает»; возможно также: «того, кого считают способным убить». Греческое выражение подчёркивает кажущийся характер его власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ φοβηθῶμεν
  choice: Не будем бояться
  rationale: Отрицательный увещательный конъюнктив первого лица множественного числа естественно передаётся призывом «Не будем бояться».
- source_word: τὸν δοκοῦντα
  choice: того, кто, как кажется
  rationale: Передаёт основное значение δοκέω — «казаться, представляться» — и сохраняет оттенок лишь видимой власти.
- source_word: ἀποκτενεῖν
  choice: может убить
  rationale: В сочетании с δοκοῦντα инфинитив указывает на приписываемую этому человеку способность убить; добавление «может» делает синтаксическую связь ясной по-русски, не утверждая реальности такой власти.
theological_decisions:
- issue: Оттенок кажущейся и действительной власти в τὸν δοκοῦντα ἀποκτενεῖν
  choice: Гонитель лишь кажется способным убить
  alternative: тот, кто намеревается убить; тот, кого считают способным убить
  rationale: Обычное значение δοκοῦντα — «кажущийся, представляющийся». Перевод сохраняет заложенное в контексте противопоставление видимой телесной власти и её действительной ограниченности, не развивая его сверх текста.
translation_notes:
  register: Современный литературный русский язык; краткий, достойный и естественный увещательный оборот. Частица «как кажется» сохраняет смысловую напряжённость оригинала.
