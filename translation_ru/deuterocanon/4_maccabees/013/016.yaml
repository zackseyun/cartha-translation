  text: Therefore, let us arm ourselves with the mastery over passions that comes from godly reason.
translation:
  language: ru
  text: Итак, вооружимся господством божественного разума над страстями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «властью над страстями, которую даёт божественный разум».'
    reason: Родительный оборот τοῦ θείου λογισμοῦ может характеризовать господство как осуществляемое божественным разумом или указывать на него как на его источник.
lexical_decisions:
- source_word: καθοπλισώμεθα
  choice: вооружимся
  rationale: Увещательное сослагательное наклонение первого лица множественного числа передано естественной русской формой совместного призыва; сохранена метафора вооружения для нравственной борьбы.
- source_word: τοιγαροῦν
  choice: итак
  rationale: Частица вводит вывод из предшествующего рассуждения; «итак» звучит естественно, кратко и весомо.
- source_word: τῇ ... παθοκρατίᾳ
  choice: властью над страстями
  rationale: Дательный падеж обозначает средство, которым следует вооружиться. Словосочетание передаёт идею господства над страстями, не сводя её к их подавлению.
- source_word: τοῦ θείου λογισμοῦ
  choice: которую даёт божественный разум
  rationale: Родительный оборот может обозначать источник или принадлежность. В основном тексте он раскрыт как источник власти над страстями, а более формальное прочтение сохранено в сноске.
- source_word: θείου
  choice: божественный
  rationale: Передаёт связь с Богом и сохраняет более широкий смысл греческого θεῖος, не отождествляя его без необходимости с отдельным термином «благочестивый».
- source_word: λογισμοῦ
  choice: разум
  rationale: В 4 Маккавейской книге это ключевое понятие разумного нравственного суждения, управляющего страстями; «разум» — ясный и ёмкий русский эквивалент.
theological_decisions:
- issue: Смысл выражения θεῖος λογισμός в иудейском нравственно-философском контексте
  choice: божественный разум
  alternative: благочестивый разум; разум, угодный Богу
  rationale: «Божественный разум» ближе к явному значению θεῖος и сохраняет присущую греческому выражению широту. Контекст указывает на разум, связанный с Богом и нравственной верностью, но перевод не уточняет без достаточного основания, идёт ли речь о дарованном Богом разуме, разуме, согласном с Божьей волей, или о его божественном качестве.
- issue: Отношение родительного τοῦ θείου λογισμοῦ к παθοκρατίᾳ
  choice: власть над страстями, которую даёт божественный разум
  alternative: власть божественного разума над страстями
  rationale: Основной вариант естественно выражает возможное значение источника, не утверждая, что сам разум является божественной сущностью. Альтернативная конструкция, в которой разум непосредственно осуществляет власть, вынесена в сноску для сохранения грамматической неоднозначности.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным увещательным звучанием. Сохранены военная метафора и ключевая для книги идея господства разума над страстями; тяжеловесные философские неологизмы избегаются.
