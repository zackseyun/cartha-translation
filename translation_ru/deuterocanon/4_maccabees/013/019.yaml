lexical_decisions:
- source_word: Οὐκ ἀγνοεῖτε
  choice: Вы ведь знаете
  rationale: Естественная русская передача греческой литоты сохраняет риторическое напоминание, не создавая тяжеловесного оборота «вам небезызвестны».
- source_word: τὰ τῆς ἀνθρωπότητος φίλτρα
  choice: свойственные человеческой природе узы привязанности
  rationale: φίλτρα здесь означает сильные естественные эмоциональные связи, а не магические любовные средства; оборот сохраняет связь с ἀνθρωπότης как человеческой природой.
- source_word: ἡ θεία καὶ πάνσοφος πρόνοια
  choice: божественное и всепремудрое провидение
  rationale: «Провидение» сохраняет философско-богословский смысл πρόνοια, а «всепремудрое» точно передаёт πάνσοφος без добавления отсутствующего в греческом слова «Божье».
- source_word: ἔμερισεν
  choice: уделило
  rationale: Глагол передаёт распределение или назначение доли согласно мудрому устроению.
- source_word: τοῖς γεννωμένοις
  choice: рождающимся
  rationale: Сохраняется субстантивированное причастие и его пассивно-процессуальный оттенок.
- source_word: διὰ τῶν πατέρων
  choice: через отцов
  rationale: Близкая к исходнику передача сохраняет отдельное упоминание отцов в описании рождения.
- source_word: φυτεύσασα
  choice: насадив
  rationale: Сохраняется метафора насаждения, употреблённая автором для возникновения этих уз.
- source_word: διὰ τῆς μητρῴας γαστρός
  choice: посредством материнского чрева
  rationale: Оборот сохраняет значение διά и отдельное упоминание материнского чрева, оставаясь грамматически естественным по-русски.
theological_decisions:
- issue: Передача πρόνοια в эллинистическом иудейском контексте
  choice: провидение
  alternative: предусмотрительность
  rationale: «Провидение» выражает мудрое божественное устроение, не вводя более поздних конфессиональных уточнений.
- issue: Отдельное обозначение отцов и материнского чрева
  choice: сохранить оба образа
  alternative: обобщить как «через родителей»
  rationale: Греческий текст явно различает отцов и материнское чрево; их объединение сделало бы перевод менее прозрачным.
- issue: Явное именование Бога
  choice: не добавлять слово «Бог»
  alternative: «Божье провидение»
  rationale: В исходном тексте стоит прилагательное θεία, но нет явного существительного или генитива «Бога»; перевод сохраняет эту форму выражения.
