  text: And you are not ignorant of the affections of human nature[a], which the divine and all-wise providence apportioned to those who are born through the fathers, having planted them through the mother's womb;
translation:
  language: ru
  text: Вы ведь знаете свойственные человеческой природе узы привязанности[a], которые божественное и всепремудрое провидение уделило рождённым от отцов, насадив их в материнском чреве.
  philosophy: optimal-equivalence
  footnotes:
