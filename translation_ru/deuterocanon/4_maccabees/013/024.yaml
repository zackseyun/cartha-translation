revisions:
- from: Они ещё крепче держались единодушия друг с другом[a], потому что были воспитаны одним и тем же Законом, упражнялись в одних и тех же добродетелях и возрастали в праведном образе жизни; всё это ещё теснее сближало их[b].
  to: Их согласие друг с другом было ещё прочнее[a], потому что они были воспитаны одним и тем же Законом, упражнялись в одних и тех же добродетелях и воспитывались в праведном образе жизни; всё это ещё теснее сближало их[b].
  rationale: Исправлены два неестественных русских сочетания без изменения смысла. Формулировка «их согласие ... было ещё прочнее» естественно передаёт сравнительный характер θέστερον и конструкцию с ὁμόνοιαν. Повтор «были воспитаны / воспитывались» отражает два различных, но близких греческих глагола формирования и сохраняет параллелизм исходного текста. Сноска сохраняет указание на сжатость и синтаксическую неоднозначность заключительной конструкции.
