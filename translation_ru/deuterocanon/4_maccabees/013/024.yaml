base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/024.yaml
  text: For they had a firmer harmony with one another[a]; for, having been trained by the same law, having practiced the same virtues, and having been brought up in a righteous way of life[b], they were drawn more closely together.
translation:
  language: ru
  text: Их согласие друг с другом было ещё прочнее[a], потому что они были воспитаны одним и тем же Законом, упражнялись в одних и тех же добродетелях и воспитывались в праведном образе жизни; всё это ещё теснее сближало их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они сохраняли ещё большее единодушие друг с другом».'
    reason: lexical_alternative
  - marker: b
    text: Заключительная фраза в греческом тексте выражена сжато; по смыслу общее воспитание в Законе, упражнение в добродетелях и праведный образ жизни ещё теснее сближали их друг с другом.
    reason: alternative_reading
lexical_decisions:
- source_word: θέστερον ἔσχον
  choice: ещё крепче держались
  rationale: Сравнительная форма перед ἔσχον выражает большую прочность или устойчивость. Русское сочетание сохраняет сравнительный смысл и естественно связывается с «единодушием».
- source_word: ὁμόνοιαν
  choice: единодушия
  rationale: Ὁμόνοια обозначает согласие и единство мыслей. «Единодушие» точно передаёт этот смысл в контексте близких отношений между братьями.
- source_word: νόμῳ τῷ αὐτῷ
  choice: одним и тем же Законом
  rationale: В контексте 4 Маккавейской книги νόμος указывает на общий для братьев иудейский Закон. Прописная буква помогает обозначить этот конкретный референт, не добавляя его в сам текст.
- source_word: παιδευθέντες
  choice: были воспитаны
  rationale: Причастие охватывает обучение, нравственное формирование и дисциплину; «воспитаны» естественно передаёт это сочетание значений.
- source_word: ἐξασκήσαντες
  choice: упражнялись
  rationale: Глагол означает деятельное, последовательное упражнение или развитие качеств; выбранное слово сохраняет образ нравственной практики.
- source_word: ἀρετάς
  choice: добродетелях
  rationale: В эллинистическом нравственном контексте ἀρεταί — добродетели или нравственные совершенства; «добродетели» является ясным и привычным соответствием.
- source_word: τῷ δικαίῳ ... βίῳ
  choice: в праведном образе жизни
  rationale: Выражение описывает нравственную среду и уклад воспитания. «Праведный образ жизни» передаёт не только качество жизни, но и устойчивую жизненную практику.
- source_word: συντραφέντες
  choice: возрастали
  rationale: Глагол означает быть вскормленным или воспитанным, а приставка συν- может также намекать на совместное взросление. «Возрастали» избегает тяжёлого повтора слова «воспитаны», тогда как общий характер их формирования уже выражен всем перечислением.
- source_word: μᾶλλον ἐφʼ αὐτοὺς ἤγαγον
  choice: всё это ещё теснее сближало их
  rationale: Греческая заключительная конструкция сжата и формально допускает более буквальное «ещё более направляли к самим себе». Контекст указывает на усиление взаимной близости благодаря общему воспитанию; безличное обобщение «всё это» ясно передаёт связь с предшествующими причастными оборотами.
theological_decisions:
- issue: Значение слова νόμος в иудейском повествовании о мучениках
  choice: «Закон» как общий для братьев иудейский Закон
  alternative: общий нравственный закон или наставление
  rationale: В 4 Маккавейской книге νόμος обычно обозначает отеческий иудейский Закон, сформировавший жизнь мучеников. Перевод «Закон» сохраняет краткость оригинала и не вводит конфессионального уточнения.
- issue: Причина единодушия братьев
  choice: Общее воспитание в Законе, добродетелях и праведной жизни сближало их
  alternative: Предшествующие обороты могут быть поняты лишь как описание самих братьев без явно названной причинной силы
  rationale: Частица γάρ и заключительное μᾶλλον указывают на причинное объяснение их усилившегося единодушия, однако сжатость греческого синтаксиса отмечена в примечании, а не скрыта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан ясным для обычного читателя, при этом повтор «одним и тем же / одних и тех же» сохраняет акцент оригинала на общем формировании братьев. Необычная сжатость последней греческой конструкции не замалчивается, а поясняется сноской.
