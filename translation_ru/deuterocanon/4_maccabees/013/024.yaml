    issue: Неестественное сочетание «держались единодушия».
    rationale: Греческое ἔσχον с ὁμόνοιαν означает, что у них было или сохранялось согласие; русское «держаться единодушия» не является естественным способом выразить это значение.
  - severity: low
    issue: «Возрастали в праведном образе жизни» ослабляет значение συντραφέντες.
    rationale: Причастие обозначает воспитание, взращивание; «воспитывались в праведном образе жизни» передаёт его точнее и естественнее.
