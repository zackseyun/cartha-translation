  rationale: Передаёт культовую окраску ἱερός и естественно сочетается с образом хора.
- source_word: εὐσεβείας
  choice: благочестия
  rationale: В 4 Маккавейской εὐσέβεια обозначает верность и почтение к Богу; «благочестие» сохраняет религиозно-нравственный смысл ключевого термина.
- source_word: στήσαντες
  choice: образовав
  rationale: В сочетании с χορόν причастие означает создание или составление хора, а не буквальное установление.
- source_word: χορὸν
  choice: хор
  rationale: Сохраняет греческий риторический и культовый образ, не уточняя необоснованно, шла ли речь именно о пении или танце.
- source_word: παρεθάρσυνον
  choice: продолжали ободрять
  rationale: Имперфект выражает длительное или повторявшееся взаимное ободрение.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Естественная современная передача взаимного местоимения.
- source_word: λέγοντες
  choice: говоря
  rationale: Сохраняет причастную связь с последующей прямой речью.
theological_decisions:
- issue: Передача εὐσέβεια в повествовании о мученичестве
  choice: благочестие
  alternative: набожность; почитание Бога
  rationale: «Благочестие» достаточно естественно для возвышенного библейского регистра и сохраняет богословско-нравственную весомость термина, не сводя его лишь к внутреннему чувству почтения.
