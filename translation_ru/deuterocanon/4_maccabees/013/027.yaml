  - severity: medium
    issue: «Привычное общение» чрезмерно сужает συνηθεία.
    rationale: Слово может обозначать привычку, обычай или сложившуюся близость; «общение» вводит конкретный способ близости, не выраженный прямо.
  - severity: low
