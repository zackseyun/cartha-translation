  text: ἀλλʼ ὁμοίως καίπερ τῆς φύσεως καὶ τῆς συνηθείας καὶ τῶν τῆς ἀρετῆς ἠθῶν τὰ τῆς ἀδελφότητος αὐτοῖς φίλτρα συναξόντων, ἀνέσχοντο διὰ τὴν εὐσέβειαν τοὺς ἀδελφοὺς οἱ ὑπολελειμμένοι τοὺς κατοικτιζομένους ὁρῶντες μέχρι θανάτου βασανιζομένους.
