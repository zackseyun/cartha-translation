base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/027.yaml
  text: But likewise[a], although nature and custom and the dispositions of virtue were drawing together for them the affections of brotherhood, those who were left behind endured, because of piety, as they watched their brothers, being tortured to death, objects of pity[b].
translation:
  language: ru
  text: Но и они, хотя природа, привычка и нравственные свойства добродетели соединяли их узами братской любви[a], ради благочестия выдержали, видя, как их братьев — вызывавших жалость[b] — истязают до смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братскими привязанностями»; буквально: «привязанности братства» или «узы братства».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «которых жалели» или «над которыми сжаливались». Греческая фраза сжато соединяет несколько причастных оборотов: оставшиеся выдержали, видя братьев, которых истязали до смерти и которые вызывали жалость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλτρα
  choice: узы братской любви
  rationale: Здесь слово обозначает не буквальные «чары», а сильную взаимную привязанность братьев; выражение передаёт и чувство, и связывающую силу.
- source_word: συναξόντων
  choice: ещё теснее связывали
  rationale: Причастие описывает объединяющее действие природы, привычного общения и характера. Такое выражение естественно по-русски и сохраняет усиление братской привязанности.
- source_word: συνηθείας
  choice: привычное общение
  rationale: В данном семейном контексте речь может идти не просто об абстрактном «обычае», а о близости, сложившейся благодаря постоянной совместной жизни и общению.
- source_word: τῶν τῆς ἀρετῆς ἠθῶν
  choice: добродетельный склад характера
  rationale: Передаёт нравственные свойства и устойчивые черты, порождённые добродетелью, без неестественного буквального оборота «нравы добродетели».
- source_word: ἀνέσχοντο
  choice: выдержали это
  rationale: Глагол выражает стойкое перенесение тяжёлого душевного испытания; местоимение «это» естественно отсылает к увиденным мучениям.
- source_word: εὐσέβειαν
  choice: благочестие
  rationale: Ключевое для 4 Маккавейской книги понятие благоговейной верности Богу и Его закону; традиционное русское слово сохраняет богословскую ёмкость термина.
- source_word: οἱ ὑπολελειμμένοι
  choice: оставшиеся
  rationale: Речь о братьях, которые в тот момент ещё не были казнены; перевод не создаёт впечатления, будто они окончательно уцелели.
- source_word: κατοικτιζομένους
  choice: достойных жалости
  rationale: Пассивное причастие характеризует мучимых братьев как вызывающих сострадание; русский оборот сохраняет эту характеристику и не перегружает предложение.
- source_word: μέχρι θανάτου βασανιζομένους
  choice: истязают до смерти
  rationale: Передаёт продолжавшиеся вплоть до смерти мучения кратко и естественно.
theological_decisions:
- issue: Значение εὐσέβεια в рассказе о мучениках
  choice: благочестие
  alternative: набожность; почтение к Богу
  rationale: «Благочестие» охватывает и почитание Бога, и верность Его закону, не сужая термин до чувства или внешней религиозности.
- issue: Сила выражения о братстве
  choice: братья; узы братской любви
  alternative: родные; братская привязанность
  rationale: Перевод сохраняет прямую лексику ἀδελφότητος и ἀδελφούς и одновременно ясно передаёт эмоциональную силу φίλτρα.
- issue: Причина стойкости
  choice: ради благочестия выдержали
  alternative: благодаря благочестию выдержали
  rationale: Предлог διά с винительным может обозначать основание или мотив. «Ради» подчёркивает верность благочестию как мотив, не исключая того, что оно было источником стойкости.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим повествованию о мучениках. Сложный греческий синтаксис умеренно расправлен ради ясности, но причинная связь с благочестием, братская привязанность и неоднозначность κατοικτιζομένους сохранены; все сноски отмечены в основном тексте.
