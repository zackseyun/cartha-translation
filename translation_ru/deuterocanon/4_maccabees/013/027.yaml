revisions:
- from: Но подобным же образом, хотя природа, привычное общение и добродетельный склад характера ещё теснее связывали их узами братской любви[a], оставшиеся ради благочестия выдержали это, видя, как их братьев — достойных жалости[b] — истязают до смерти.
  to: Но и они, хотя природа, привычка и нравственные свойства добродетели соединяли их узами братской любви[a], ради благочестия выдержали, видя, как их братьев — вызывавших жалость[b] — истязают до смерти.
  rationale: Убрано невыраженное в оригинале усиление «ещё», συνηθεία передана без чрезмерной конкретизации, а сноска к φίλτρα исправлена так, чтобы отражать его реальный лексический диапазон. Сохранены современный литературный регистр, ключевой термин «благочестие» и синтаксическая характеристика братьев как вызывающих жалость.
