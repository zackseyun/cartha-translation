base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/001.yaml
  text: Therefore[a], since the seven brothers looked down on pains even to death[c][b], it is acknowledged from every side that godly reason is sovereign over the passions.
translation:
  language: ru
  text: Итак, поскольку семь братьев пренебрегли страданиями вплоть до самой смерти[a], всеми признаётся, что благочестивый разум[b] властвует над страстями[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сочли ничтожными страдания, доходящие до смерти». Греческий глагол выражает пренебрежение тем, что считают недостойным внимания.'
    reason: lexical_alternative
  - marker: b
    text: '«Благочестивый разум» — ключевое понятие 4 Маккавейской книги: разум, сформированный почтением к Богу и верностью Ему.'
    reason: lexical_alternative
  - marker: c
    text: Под «страстями» здесь понимаются влечения и порывы, которые в нравственно-философском рассуждении книги рассматриваются как подлежащие управлению, а не просто любые чувства.
    reason: cultural_note
lexical_decisions:
- source_word: δὲ τοίνυν
  choice: Итак
  rationale: Сочетание вводит вывод из предшествующего рассуждения; «итак» естественно передаёт его заключительную силу.
- source_word: τῶν μέχρι θανάτου πόνων
  choice: страданиями вплоть до самой смерти
  rationale: πόνοι обозначает боли и страдания, а μέχρι θανάτου — их крайнюю меру, достигающую смерти; частица «самой» естественно усиливает выражение по-русски.
- source_word: ὑπερεφρόνησαν
  choice: пренебрегли
  rationale: Глагол означает счесть не заслуживающим внимания, поставить ниже себя; «пренебрегли» передаёт презрение к мучениям без разговорности выражения «смотрели свысока».
- source_word: οἱ ἑπτὰ ἀδελφοί
  choice: семь братьев
  rationale: В повествовании речь именно о семи братьях-мужчинах; буквальное и естественное соответствие.
- source_word: συνομολογεῖται ἀπανταχόθεν
  choice: всеми признаётся
  rationale: Пассивная форма выражает общее признание, а ἀπανταχόθεν — согласие со всех сторон. Русское «всеми признаётся» кратко сохраняет оба компонента.
- source_word: αὐτόδεσπότος
  choice: обладает полновластной властью
  rationale: Редкое прилагательное выражает власть, принадлежащую субъекту в силу его самого. Формулировка подчёркивает полноту господства разума, не сводя смысл просто к способности влиять.
- source_word: τῶν παθῶν
  choice: над страстями
  rationale: В нравственно-философском рассуждении книги πάθη — влечения и порывы, подлежащие управлению, а не просто чувства или внешние страдания.
- source_word: ὁ εὐσεβὴς λογισμός
  choice: благочестивый разум
  rationale: Ключевое выражение книги обозначает рассудок, сформированный почтением к Богу; перевод сохраняет и рациональную, и религиозную стороны понятия.
theological_decisions:
- issue: Передача программного выражения εὐσεβὴς λογισμός
  choice: благочестивый разум
  alternative: разум, исполненный благочестия; богобоязненный разум
  rationale: «Благочестивый разум» сохраняет компактность термина и показывает, что речь не о нейтральной рациональности, а о разуме, направляемом почтением к Богу.
- issue: Этический смысл πάθη
  choice: страсти
  alternative: влечения; порывы; чувства
  rationale: '«Страсти» сохраняет философскую напряжённость текста: это движущие человеком побуждения, над которыми разум осуществляет власть, а не эмоциональная жизнь вообще.'
- issue: Сила утверждения αὐτόδεσπότος
  choice: обладает полновластной властью над
  alternative: самовластен над; господствует над; является господином
  rationale: Выбранная формулировка передаёт сильное утверждение о собственной и полной власти благочестивого разума, не добавляя конфессионального истолкования природы этой власти.
translation_notes:
  register: Современный литературный русский язык с достоинством философско-нравственного рассуждения. Избегаются архаизмы вроде «даже до смерти» в церковнославянском звучании и разговорные обороты; ключевые термины сохранены компактными и пригодными для последовательного употребления в книге.
