base_translation:
  language: en
  yaml_path: translation/deuterocanon/4_maccabees/013/007.yaml
  text: Thus the seven-towered blessedness of the young men[a], having fortified the harbor of godliness, conquered the licentiousness of the passions.
translation:
  language: ru
  text: Так семибашенное благоразумие юношей[a], укрепив гавань благочестия, победило необузданность страстей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семибашенное благоразумие юношей». Вероятно, семь башен образно указывают на семерых братьев. Возможный смысловой перевод: «благое решение семерых юношей».'
    reason: Необычное греческое выражение допускает как буквальное, фортификационное прочтение, так и более истолковывающую передачу.
lexical_decisions:
- source_word: ἑπτάπυργος
  choice: семибашенное
  rationale: 'Сложное прилагательное буквально означает «имеющее семь башен». Необычный образ сохранён: он, вероятно, представляет семерых братьев как единое укрепление.'
- source_word: εὐλογιστία
  choice: благоразумие
  rationale: Редкое существительное обозначает доброе, достойное рассуждение или разумный нравственный настрой. «Благоразумие» сохраняет связь с разумом и возвышенный характер похвалы, не превращая качество юношей в отвлечённое «блаженство».
- source_word: νεανίσκων
  choice: юношей
  rationale: Мужской род и множественное число относятся к молодым братьям; «юношей» естественно и уместно для возвышенного повествования.
- source_word: ὀχυρώσασα
  choice: укрепив
  rationale: Причастие несёт военно-фортификационный образ и согласуется с «семибашенным» сооружением и защищённой гаванью.
- source_word: λιμένα
  choice: гавань
  rationale: Слово означает порт или безопасное пристанище. «Гавань» сохраняет конкретный поэтический образ и одновременно допускает переносный смысл.
- source_word: εὐσεβείας
  choice: благочестия
  rationale: 'В 4 Маккавейской книге это ключевое понятие: почтительное отношение к Богу, выраженное верностью Ему и Его закону. «Благочестие» — точный и укоренённый русский эквивалент.'
- source_word: παθῶν
  choice: страстей
  rationale: В нравственно-философском контексте речь идёт об аффектах и влечениях, которыми должен управлять разум, а не о физических страданиях.
- source_word: ἀκολασίαν
  choice: необузданность
  rationale: Слово обозначает отсутствие самообладания, невоздержность и чрезмерность. «Необузданность» передаёт широкий смысл и не сужает его до сексуальной распущенности.
- source_word: ἐνίκησεν
  choice: победило
  rationale: Глагол выражает решительную победу и поддерживает воинственно-фортификационную образность стиха.
theological_decisions:
- issue: Передача образного выражения ἡ ἑπτάπυργος τῶν νεανίσκων εὐλογιστία
  choice: семибашенное благоразумие юношей
  alternative: благое решение семерых юношей; благоразумие юношей, подобное крепости с семью башнями
  rationale: Греческий текст персонифицирует нравственно-разумное качество братьев и изображает его как укрепление с семью башнями. Основной текст сохраняет намеренно необычную метафору, а сноска поясняет вероятную связь семи башен с семью братьями.
- issue: Передача εὐσεβεία
  choice: благочестие
  alternative: почитание Бога; верность Богу
  rationale: Термин включает почтение к Богу и верность Его закону. «Благочестие» сохраняет ёмкость понятия и не добавляет конфессионально специфического толкования.
- issue: Соотношение разума и страстей
  choice: благоразумие… победило необузданность страстей
  alternative: доброе рассуждение… одолело невоздержность влечений
  rationale: 'Перевод сохраняет философско-нравственное напряжение текста: страсти не названы злом сами по себе; побеждена именно их необузданность.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным риторическим звучанием. Необычная фортификационная метафора оригинала сохранена намеренно; синтаксис сделан ясным и компактным.
