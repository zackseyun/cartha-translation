  rationale: Контекст противопоставляет господство и поражение, поэтому важно сохранить явный образ рабской зависимости.
- issue: Референт τούτοις
  choice: ими
  alternative: этим
  rationale: Форма допускает отсылку к ближайшему смысловому комплексу; «ими» наиболее естественно соотносится со страстями, но не добавляет нового толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством философско-риторической прозы. «Вкушали изысканные яства» намеренно слегка возвышенно, чтобы передать редкость и стилистическую окраску ἡμεροφάγησαν. Парное тире выделяет пояснительную вставку. Конечная запятая и открытая сравнительная конструкция сохранены, поскольку мысль продолжается в следующем стихе.
