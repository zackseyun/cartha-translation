lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: Ведь подобно тому как
  rationale: Передаёт одновременно пояснительную силу γάρ и сравнительное значение ὥσπερ; незавершённость конструкции сохранена, поскольку стих синтаксически продолжается далее.
- source_word: τοῖς πάθεσιν δουλωθέντες
  choice: порабощённые страстями
  rationale: Сохраняет сильный образ рабства в δουλωθέντες; πάθη в нравственно-философском контексте обозначает страсти, а не внешние страдания.
- source_word: ἡμεροφάγησαν
  choice: вкушали изысканные яства
  rationale: Редкий глагол указывает на утончённое, роскошное питание. Формулировка сохраняет пищевой смысл и оттенок изнеженного потребления.
- source_word: ἐλέγομεν γὰρ
  choice: ибо мы говорили
  rationale: Имперфект передан естественным русским прошедшим временем с оттенком предшествующего изложения; γάρ сохраняет пояснительную функцию.
- source_word: τούτοις νενικῆσθαι
  choice: они побеждены ими
  rationale: Перфектный инфинитив передаёт состояние, возникшее вследствие поражения; местоимение «ими» естественно отсылает к страстям, не устраняя грамматическую неоднозначность τούτοις.
