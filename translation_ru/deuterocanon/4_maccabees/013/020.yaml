    text: 'Сохранившийся здесь греческий текст стиха обрывается на полуслове («и через одну и ту же…»), поэтому перевод также оставлен незавершённым: отсутствующие в приведённом источнике слова не восполняются.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐν ᾗ
  choice: в которой
  rationale: Дательный падеж относительного местоимения женского рода отсылает к предшествующему существительному женского рода; поскольку в данном фрагменте этот антецедент отсутствует, перевод не уточняет его.
- source_word: ἀδελφοὶ
  choice: братья
  rationale: Форма мужского рода во множественном числе в данном контексте обозначает родных братьев.
- source_word: τὸν ἴσον ... χρόνον
  choice: одинаковый срок
  rationale: Оборот выражает равную продолжительность времени; «одинаковый срок» естественно передаёт эту мысль по-русски.
- source_word: κατοικήσαντες
  choice: прожившие
  rationale: Причастие означает пребывание или жизнь в течение указанного времени; «прожившие» естественно сочетается со словом «срок».
- source_word: ἐν τῷ αὐτῷ χρόνῳ
  choice: в одно и то же время
  rationale: Передаёт одновременность формирования и сохраняет повтор греческого αὐτός.
- source_word: πλασθέντες
  choice: сформированные
  rationale: Страдательное причастие обозначает, что братья были образованы или сформированы, вероятно во чреве; выбран нейтральный и понятный эквивалент.
- source_word: ἀπὸ τοῦ αὐτοῦ αἵματος
  choice: из одной и той же крови
  rationale: Сохраняется конкретный образ общей крови и биологического родства без замены его толкованием.
- source_word: αὐξηθέντες
  choice: выросшие
  rationale: Причастие передаёт рост и развитие; «выросшие» естественно в семейном контексте.
- source_word: καὶ διὰ τῆς αὐτῆς
  choice: и через одну и ту же…
  rationale: Перевод сохраняет предлог, род и незавершённость оборота, не восполняя отсутствующее существительное.
