  text: in which brothers[a], having lived the same span of time, and having been formed at the same time, and having grown from the same blood, and through the same
translation:
  language: ru
  text: в которой братья, прожившие одинаковый срок, сформированные в одно и то же время, выросшие из одной и той же крови и через одну и ту же…[a]
  philosophy: optimal-equivalence
  footnotes:
