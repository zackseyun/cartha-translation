  text: For great is the struggle of the soul and the danger laid up in eternal torment for those who transgress the commandment of God.
translation:
  language: ru
  text: Ибо велика борьба души и велика опасность, ожидающая в вечной муке тех, кто преступает заповедь Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγὼν
  choice: борьба
  rationale: Передаёт напряжённое нравственное противоборство; в данном контексте естественнее современного русского «состязание».
- source_word: ψυχῆς
  choice: души
  rationale: Сохраняет родительный падеж и антропологическую открытость греческого выражения, не сводя его к одному лишь разуму или внутреннему миру.
- source_word: κίνδυνος
  choice: опасность
  rationale: Прямо передаёт значение реальной угрозы, не превращая её заранее в приговор или наказание.
- source_word: ἐν αἰωνίῳ βασάνῳ κείμενος
  choice: заключённая в вечной муке
  rationale: Сохраняет связь причастия κείμενος с «опасностью» и не усиливает его до идеи заранее назначенного наказания; βασάνος здесь передано как «мука».
- source_word: παραβαίνουσι
  choice: преступает
  rationale: Обычное и точное обозначение нарушения заповеди; форма единственного числа естественно согласуется в русском с конструкцией «для тех, кто».
- source_word: τὴν ἐντολὴν τοῦ θεοῦ
  choice: заповедь Бога
  rationale: Формально сохраняет единственное число и родительный оборот исходного текста.
theological_decisions:
- issue: Характер связи опасности с вечной мукой
  choice: «опасность, заключённая в вечной муке»
  alternative: «опасность вечной муки, уготованной…»
  rationale: Греческое κείμενος грамматически относится к κίνδυνος и буквально обозначает нахождение или заключённость в чём-либо. Выбранная формулировка сохраняет эту связь и не добавляет отсутствующую в тексте явную идею предопределённого воздаяния.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизмов. Повтор «велика» необходим для естественного согласования двух существительных разного рода и подчёркивает параллелизм высказывания.
