  source_fidelity: Греческое κείμενος относится к κίνδυνος и в сочетании с ἐν αἰωνίῳ βασάνῳ передаёт опасность, пребывающую/ожидающую в сфере вечного мучения; τοῖς παραβαίνουσι ясно обозначает тех, кому она предназначена. Черновое «заключённая в вечной муке» формально пытается сохранить конструкцию, но по-русски создаёт неточный образ опасности, буквально запертой внутри муки.
