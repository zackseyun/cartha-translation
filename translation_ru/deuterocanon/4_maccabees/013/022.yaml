    reason: lexical_alternative
  - marker: b
    text: 'Или: «благодаря товариществу» либо «благодаря тому, что они росли вместе».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «остальному обучению» либо «прочей подготовке».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισμάτων
  choice: в объятиях
  rationale: Сохраняет конкретный образ заключения в объятия. Греческое выражение с родительным падежом сжато и не содержит явной глагольной связки, поэтому русский текст неизбежно требует небольшого синтаксического развёртывания.
- source_word: φιλάδελφοι ψυχαί
  choice: души братьев исполнены любви
  rationale: Передаёт буквальную семейную любовь между братьями и сохраняет возвышенное ψυχαί как «души». Мужской род уместен в контексте семи братьев.
- source_word: αὔξονται σφοδρότερον
  choice: эта любовь становится ещё крепче
  rationale: Сравнительное наречие выражает нарастание силы или напряжённости. Явное «эта любовь» естественно связывает мысль по-русски, не придавая душам физического роста.
- source_word: διὰ συντροφίας
  choice: благодаря совместной жизни
  rationale: συντροφία может обозначать товарищество, совместную жизнь или совместное воспитание; здесь выбран широкий смысл общей жизни братьев.
- source_word: τῆς καθʼ ἡμέραν συνηθείας
  choice: повседневной близости
  rationale: Передаёт привычное ежедневное общение и тесную связь без устаревшего или двусмысленного русского выражения.
- source_word: τῆς ἄλλης παιδίας
  choice: всему остальному воспитанию
  rationale: παιδία здесь допускает значения воспитания, образования и обучения. В семейном контексте «воспитание» лучше охватывает весь формирующий опыт.
theological_decisions:
- issue: Родовое обозначение семьи в контексте буквальных братьев
  choice: братьев
  alternative: братьев и сестёр / родных
  rationale: Речь идёт именно о семи братьях, поэтому мужское обозначение исторически и контекстуально точно.
- issue: Отнесение αὔξονται к братской любви
  choice: эта любовь становится ещё крепче
  alternative: души становятся ещё крепче
  rationale: Греческое подлежащее формально допускает связь с «душами», однако контекст перечисляет условия усиления братской привязанности. Перевод делает смысловую связь явной, а формальную возможность отмечать отдельно не требуется, поскольку богословского вывода она не меняет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным словом «души». Синтаксис развёрнут лишь настолько, насколько необходимо для естественной передачи сжатой и безглагольной начальной греческой фразы; неоднозначность вынесена в примечания.
