  text: The souls of brothers are affectionate in embraces[c][b][a], and they grow much stronger through living together and through daily familiarity and the rest of their upbringing.
translation:
  language: ru
  text: Братолюбивые души нежны в объятиях[a] и ещё более укрепляются благодаря совместной жизни[b], ежедневному общению и остальному воспитанию[c].
  philosophy: optimal-equivalence
  footnotes:
