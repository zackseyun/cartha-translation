base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalm_151/001/004.yaml
  text: He himself sent out his messenger[a], and took me from my father's sheep, and anointed me with the oil of his anointing.
translation:
  language: ru
  text: Он сам послал своего вестника[a], взял меня от овец моего отца и помазал меня маслом своего помазания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своего ангела». Греческое слово может означать как человеческого посланника, так и ангела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Он сам
  rationale: 'Самостоятельное и эмфатическое местоимение передаёт подчёркнутое указание на действующего: «Он сам».'
- source_word: ἐξαπέστειλεν
  choice: послал
  rationale: В русском языке простое «послал» естественно выражает действие сложного греческого глагола; варианты «выслал» и «отправил» здесь могли бы внести нежелательные оттенки.
- source_word: τὸν ἄγγελον αὐτοῦ
  choice: своего вестника
  rationale: ἄγγελος обозначает посланца и может относиться как к человеку, так и к небесному существу. В контексте помазания Давида «вестник» естественно согласуется с ролью посланного Богом Самуила, не устраняя иной лексической возможности, указанной в примечании.
- source_word: ἦρέν με
  choice: взял меня
  rationale: Глагол означает «взял, поднял, увёл»; в данном контексте «взял меня от овец» кратко и естественно передаёт избрание Давида из пастушеской жизни.
- source_word: ἐκ τῶν προβάτων τοῦ πατρός μου
  choice: от овец моего отца
  rationale: Перевод сохраняет конкретное значение πρόβατα — «овцы» — и близко следует греческой конструкции.
- source_word: ἔχρισέν με
  choice: помазал меня
  rationale: «Помазал» является точным и общепонятным соответствием χρίω и сохраняет смысл посвящения и поставления на царство.
- source_word: ἐν τῷ ἐλαίῳ τῆς χρίσεως αὐτοῦ
  choice: маслом своего помазания
  rationale: Творительный падеж естественно передаёт орудийное значение ἐν, а «масло» является современным соответствием ἔλαιον. Формулировка сохраняет генитивную связь с «его помазанием», не перетолковывая её как простое «масло для помазания».
theological_decisions:
- issue: Значение ἄγγελος в рассказе о Божьем посланнике
  choice: вестник
  alternative: ангел
  rationale: Греческое слово само по себе допускает оба значения. Контекст помазания Давида указывает на человеческого посланника, Самуила, поэтому в основном тексте выбрано «вестник»; возможность значения «ангел» сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны со строчной буквы в соответствии с нейтральной современной издательской практикой. Избегнуты архаичные «елей» и «помазанник» там, где точный смысл можно передать общеупотребительными словами.
