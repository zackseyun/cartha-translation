lexical_decisions:
- source_word: ἐξῆλθον
  choice: я вышел
  rationale: Аорист ἐξέρχομαι обозначает выход или отправление; в данном повествовательном контексте естественно и точно передаётся как «я вышел».
- source_word: εἰς συνάντησιν
  choice: навстречу
  rationale: Устойчивое сочетание выражает движение с целью встречи; русское «вышел навстречу» кратко и естественно передаёт греческую конструкцию.
- source_word: τῷ ἀλλοφύλῳ
  choice: иноплеменнику
  rationale: ἀλλόφυλος буквально обозначает человека из другого народа или племени. «Иноплеменник» сохраняет более широкую формулировку греческого текста, не подменяя её контекстуально вероятным «филистимлянин».
- source_word: ἐπικατηράσατό με
  choice: он проклял меня
  rationale: Глагол означает призвать проклятие на кого-либо; «проклял меня» точно и без ненужного усиления передаёт смысл.
- source_word: ἐν τοῖς εἰδώλοις αὐτοῦ
  choice: своими идолами
  rationale: 'Предлог ἐν допускает инструментальный оттенок: противник проклинает, прибегая к своим идолам. Формулировка сохраняет образ и некоторую неоднозначность способа обращения к ним.'
theological_decisions:
- issue: Значение ἀλλόφυλος в контексте Давида и Голиафа
  choice: иноплеменнику
  alternative: филистимлянину
  rationale: Хотя контекст указывает на филистимлянина Голиафа, греческий текст употребляет более общее обозначение человека из другого народа. Основной текст сохраняет эту широту, а конкретное контекстуальное понимание отмечено в сноске.
- issue: Смысл ἐν τοῖς εἰδώλοις αὐτοῦ
  choice: своими идолами
  alternative: именем своих идолов
  rationale: Греческая конструкция может указывать на средство или сферу проклятия и, вероятно, подразумевает призывание идолов. Основной перевод не вводит отсутствующее в тексте слово «имя», а вероятный смысл указан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Иноплеменник» несколько книжное, но понятное слово, уместное для поэтического текста и точно сохраняющее широкое значение греческого обозначения.
