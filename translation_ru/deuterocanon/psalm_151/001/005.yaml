translation:
  language: ru
  text: Мои братья были красивы и рослы, но Господь не был ими доволен[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не благоволил к ним»; или: «не был к ним благосклонен».'
    reason: Лексические варианты для οὐκ εὐδόκησεν ἐν αὐτοῖς, передающие отсутствие благоволения или одобрения без привнесения мысли об избрании.
lexical_decisions:
- source_word: ἀδελφοί
  choice: братья
  rationale: Форма мужского рода во множественном числе и контекст указывают на братьев Давида.
- source_word: καλοί
  choice: красивы
  rationale: В сочетании с обозначением роста или телосложения слово естественно описывает привлекательную внешность, а не нравственную доброту.
- source_word: μεγάλοι
  choice: рослы
  rationale: Буквально слово означает «большие, великие»; при описании внешности здесь подразумевается внушительный рост или телосложение. «Рослы» передаёт это естественно и не сужает значение исключительно до высоты.
- source_word: οὐκ εὐδόκησεν
  choice: не благоволил
  rationale: Глагол выражает отсутствие одобрения, довольства или благосклонности. Перевод сохраняет оценочный смысл, не подменяя его прямым утверждением, что Господь их не избрал.
- source_word: Κύριος
  choice: Господь
  rationale: В данном контексте это обозначение Бога Израиля; традиционное русское соответствие — «Господь».
theological_decisions:
- issue: Характер оценки братьев Давида Господом
  choice: Господь не благоволил к ним
  alternative: Господь не избрал их
  rationale: В греческом тексте говорится об отсутствии благоволения или довольства, а не употребляется глагол «избирать». Поэтому перевод не привносит более определённую формулировку из 1 Царств 16.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «Рослы» звучит естественно при описании внешности, а «не благоволил» сохраняет библейский регистр без прямого утверждения о неизбрании.
