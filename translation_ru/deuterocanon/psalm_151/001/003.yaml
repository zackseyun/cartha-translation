  text: And who will report[a] to my Lord? The Lord himself[b], he himself hears.
translation:
  language: ru
  text: И кто сообщит[a] моему Господу? Сам Господь — Он Сам слышит[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвестит» или «расскажет». Глагол может означать «сообщать», «возвещать» или «рассказывать».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте местоимение повторено для усиления: «Сам Господь — Он Сам слышит». Глагол «слышит» может также подразумевать, что Господь внимает или благосклонно выслушивает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς
  choice: кто
  rationale: Вопросительное местоимение вводит риторический вопрос; «кто» — прямой и естественный русский эквивалент.
- source_word: ἀναγγελεῖ
  choice: сообщит
  rationale: Будущая форма ἀναγγέλλω означает сделать известным, сообщить или возвестить. «Сообщит» естественно передаёт мысль о доведении чего-либо до сведения Господа, не устраняя более торжественного значения «возвестит», отмеченного в сноске.
- source_word: τῷ κυρίῳ μου
  choice: моему Господу
  rationale: Дательный падеж передан русским дательным; κύριος в данном контексте сохранён как титул «Господь», а притяжательное местоимение — как «моему».
- source_word: αὐτὸς Κύριος
  choice: Сам Господь
  rationale: Начальное αὐτός имеет усилительное значение; конструкция «Сам Господь» точно и естественно сохраняет это ударение.
- source_word: αὐτὸς
  choice: Он Сам
  rationale: Повтор αὐτός в греческом тексте эмфатичен. Русское «Он Сам» сохраняет повтор и его смысловое ударение.
- source_word: εἰσακούει
  choice: слышит
  rationale: Настоящее время и широкий смысл глагола переданы словом «слышит»; оно не уточняет без необходимости, подразумевается ли также благосклонный ответ.
theological_decisions:
- issue: Передача κύριος в обоих случаях
  choice: Господь
  alternative: господин / владыка
  rationale: Повтор одного титула и контекст обращения к Богу поддерживают «Господь». Вариант «господин» лексически возможен, но здесь ослабил бы титульный и богословский смысл.
- issue: Смысл εἰσακούει
  choice: слышит
  alternative: внимает / выслушивает
  rationale: «Слышит» сохраняет базовое утверждение и не решает однозначно, включает ли глагол благосклонное внимание или ответ.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Тире помогает естественно передать греческую эмфатическую конструкцию и сохранить повтор «Сам» без искусственной тяжеловесности.
