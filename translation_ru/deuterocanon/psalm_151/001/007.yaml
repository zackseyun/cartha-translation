base_translation:
  language: en
  yaml_path: translation/deuterocanon/psalm_151/001/007.yaml
  text: But I drew his own sword and cut off his head[b][a], and I removed disgrace from the sons of Israel.
translation:
  language: ru
  text: А я выхватил у него меч, отсёк ему голову[a] и снял позор с сынов Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обезглавил его».'
    reason: lexical_alternative
  - marker: b
    text: «Сыны Израиля» — традиционное собирательное обозначение Израиля.
    reason: cultural_note
lexical_decisions:
- source_word: σπασάμενος
  choice: выхватил
  rationale: Аористное причастие от σπάω в контексте оружия означает извлечение меча. «Выхватил» естественно передаёт быстрое, решительное действие.
- source_word: τὴν παρ' αὐτοῦ μάχαιραν
  choice: у него меч
  rationale: μάχαιρα обозначает меч или клинок, а παρ' αὐτοῦ указывает, что Давид взял оружие у поверженного противника. Такая формулировка сохраняет смысл греческого оборота без тяжеловесной буквальности.
- source_word: ἀπεκεφάλισα
  choice: отсёк ему голову
  rationale: Глагол прямо означает обезглавить. Выбранное выражение ясно, наглядно и естественно для повествовательного контекста.
- source_word: ἦρα
  choice: снял
  rationale: αἴρω с ὄνειδος употреблено переносно в значении устранения или удаления позора. Русское сочетание «снять позор с кого-либо» точно и идиоматично.
- source_word: ὄνειδος
  choice: позор
  rationale: ὄνειδος означает поношение, бесчестье или позор. «Позор» естественно передаёт общественное унижение Израиля.
- source_word: ἐξ υἱῶν Ἰσραήλ
  choice: с сынов Израиля
  rationale: Сохраняется явное мужское множественное υἱῶν и традиционное библейское выражение, при этом предлог «с» соответствует русскому управлению в сочетании «снять позор».
theological_decisions:
- issue: Гендерно маркированное собирательное выражение
  choice: с сынов Израиля
  alternative: с народа Израиля
  rationale: Греческий текст прямо говорит υἱῶν Ἰσραήλ, «сынов Израиля». Перевод сохраняет форму источника и не заменяет её нейтральным собирательным обозначением.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным повествовательным ритмом. Формулировки понятны широкому читателю, сохраняют образность и традиционное выражение «сыны Израиля», не привнося конфессиональных толкований.
