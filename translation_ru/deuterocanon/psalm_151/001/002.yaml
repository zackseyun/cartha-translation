lexical_decisions:
- source_word: αἱ χεῖρές μου
  choice: Мои руки
  rationale: Прямо передаёт притяжательную конструкцию без добавления отсутствующего в греческом усиления.
- source_word: ἐποίησαν
  choice: сделали
  rationale: Обычное значение ποιέω в контексте изготовления предмета; сохраняет простой параллелизм стиха.
- source_word: ὄργανον
  choice: музыкальный инструмент
  rationale: Само слово может обозначать орудие или инструмент вообще, но параллель с ψαλτήριον ясно указывает на музыкальный смысл; уточнение естественно и устраняет современную двусмысленность русского слова «инструмент».
- source_word: οἱ δάκτυλοί μου
  choice: мои пальцы
  rationale: Прямой и естественный русский эквивалент.
- source_word: ἥρμοσαν
  choice: собрали
  rationale: ἁρμόζω означает соединять или прилаживать части; в контексте изготовления инструмента «собрали» передаёт именно конструктивное действие, не сводя его к настройке.
- source_word: ψαλτήριον
  choice: псалтирь
  rationale: Традиционное русское название древнего щипкового струнного инструмента; вид инструмента нельзя определить точнее без снятия присущей термину неопределённости.
