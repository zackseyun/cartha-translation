  text: A worker in this will not become rich, and one who despises small things will be ruined.
translation:
  language: ru
  text: Кто занимается этим, не разбогатеет, а кто пренебрегает малым, придёт в упадок.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пошатнётся» или «разорится». Редкий еврейский глагол может обозначать утрату устойчивости, упадок или разорение; греческий текст добавляет: «мало-помалу».'
    reason: Примечание сохраняет возможный экономический смысл и сообщает о постепенности, выраженной в греческом параллельном тексте, не приписывая её еврейскому основному тексту.
lexical_decisions:
- source_word: פּוֹעֵל זֹאת
  choice: кто занимается этим
  rationale: Буквально сочетание означает «делающий/работающий это». Указательное «этим» сохраняет связь с предшествующим контекстом; по-русски личная конструкция звучит естественнее, чем «работник в этом».
- source_word: לֹא יַעֲשִׁיר
  choice: не разбогатеет
  rationale: Глагол в данной форме означает «не станет богатым, не разбогатеет».
- source_word: וְבוֹזֶה מְעוּטִים
  choice: а кто пренебрегает малым
  rationale: מְעוּטִים буквально указывает на «малое, немногие/малые вещи». Обобщённое единственное «малым» естественно передаёт нравственную максиму.
- source_word: יִתְעַרְעָר
  choice: постепенно разорится
  rationale: Редкий глагол передаёт расстройство устойчивости, упадок или разорение. «Разорится» соответствует экономическому контексту, а постепенность подтверждается греческим κατὰ μικρόν.
theological_decisions:
- issue: Неуточнённый предмет занятия в первой строке
  choice: сохранить «этим» без пояснения
  alternative: 'уточнить по контексту: «пьянством» или «расточительством»'
  rationale: Еврейский текст данного стиха содержит лишь указательное זֹאת; внесение конкретного порока внутрь текста устранило бы его анафорическую неоднозначность.
- issue: Характер последствий пренебрежения малым
  choice: «постепенно разорится»
  alternative: «пошатнётся» или «придёт в упадок»
  rationale: Контекст богатства поддерживает материальное разорение, но примечание сохраняет более широкий диапазон редкого еврейского глагола.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма сохранена. Синтаксис сделан естественным для обычного читателя, без конфессиональных уточнений.
