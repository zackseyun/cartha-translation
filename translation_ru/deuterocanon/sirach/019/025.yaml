  text: A man is recognized by his appearance[a], and a man of understanding is recognized by the expression of his face.
translation:
  language: ru
  text: По виду узнаётся человек, и разумный распознаётся при встрече по его лицу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от встречи лица»; греческий оборот может указывать на то, что открывается в лице человека при встрече.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἀπὸ ὁράσεως
  choice: по виду
  rationale: Оборот указывает на видимое основание, по которому узнают человека; «по виду» естественно передаёт это в современном русском языке.
- source_word: ἐπιγνωσθήσεται
  choice: узнаётся / распознаётся
  rationale: Будущее страдательного залога здесь выражает общее наблюдение, поэтому русское настоящее время передаёт гномический смысл; вариация глаголов избегает тяжеловесного повтора без смыслового сдвига.
- source_word: ἀνήρ
  choice: человек
  rationale: Хотя существительное мужского рода может означать «мужчина», в данном общем изречении «человек» естественно выражает родовое значение.
- source_word: ἀπὸ ἀπαντήσεως προσώπου
  choice: при встрече по его лицу
  rationale: 'Перевод сохраняет оба элемента неоднозначного греческого оборота: встречу (ἀπάντησις) и лицо (πρόσωπον), не сводя его безоговорочно к одному лишь выражению лица.'
- source_word: νοήμων
  choice: разумный
  rationale: Слово обозначает человека, обладающего пониманием и рассудительностью; «разумный» кратко и естественно сохраняет этот смысл.
