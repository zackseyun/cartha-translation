  text: Do not tell it to friend or foe[a], and if it is not a sin for you, do not reveal it.
translation:
  language: ru
  text: Не рассказывай об этом ни другу, ни врагу[a] и, если это не грех для тебя, не раскрывай этого[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при друге и при враге не рассказывай».'
    reason: Буквальный вариант показывает необычную греческую предложную конструкцию, тогда как основной текст естественно обозначает адресатов рассказа.
  - marker: b
    text: 'Греческая фраза сжата и допускает также смысл: «не раскрывай, разве только молчание было бы для тебя грехом».'
    reason: Сноска сохраняет возможное исключительное прочтение, не подменяя им буквальную условную форму в основном тексте.
lexical_decisions:
- source_word: ἐν φίλῳ καὶ ἐν ἐχθρῷ
  choice: ни другу, ни врагу
  rationale: В данном запрете предложная конструкция обозначает тех, кому можно было бы рассказать известное. Русская парная конструкция «ни другу, ни врагу» естественно и выразительно сохраняет противопоставление.
- source_word: μὴ διηγοῦ
  choice: не рассказывай об этом
  rationale: Глагол означает «рассказывать, подробно излагать». Дополнение в греческом подразумевается из контекста; «об этом» делает русскую фразу естественной, не уточняя содержание дела.
- source_word: καὶ εἰ μή ἐστίν σοι ἁμαρτία
  choice: и, если это не грех для тебя
  rationale: Перевод близко передаёт формально условную и смыслово сжатую греческую конструкцию, не превращая её безоговорочно в истолкованное исключение.
- source_word: μὴ ἀποκάλυπτε
  choice: не раскрывай этого
  rationale: Глагол обозначает раскрытие прежде скрытого или неизвестного. «Не раскрывай» сохраняет усиление по сравнению с «не рассказывай».
theological_decisions:
- issue: Смысл καὶ εἰ μή ἐστίν σοι ἁμαρτία
  choice: 'Сохранить прямую условную форму: «если это не грех для тебя, не раскрывай этого».'
  alternative: 'Передать как исключение: «не раскрывай, разве только молчание было бы для тебя грехом».'
  rationale: Греческая фраза лаконична и допускает понимание εἰ μή как «если не» либо в контексте как «разве только». Основной текст не должен молча разрешать эту напряжённость; возможное исключительное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; краткий наставительный тон и параллелизм исходной сентенции сохранены. Лексика общепонятна и лишена конфессионально окрашенных уточнений.
