translation:
  language: ru
  text: И если недостаток сил помешает ему согрешить, то, найдя удобный случай, он совершит зло[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «причинит вред»; греческий глагол может означать как совершение зла вообще, так и, в более узком смысле, причинение вреда другим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλάττωμα ἰσχύος
  choice: недостаток сил
  rationale: 'Передаёт причинную конструкцию ὑπὸ ἐλαττώματος ἰσχύος: человека удерживает от греха не добродетель, а нехватка способности или силы совершить задуманное.'
- source_word: κωλυθῇ
  choice: помешает
  rationale: Естественно передаёт пассивное значение внешнего или обусловленного обстоятельствами препятствия, не подразумевая внутреннего нравственного самоограничения.
- source_word: ἁμαρτεῖν
  choice: согрешить
  rationale: Сохраняет выраженную в греческом тексте нравственную категорию греха и естественно сочетается с глаголом «помешает».
- source_word: καιρόν
  choice: удобный случай
  rationale: καιρός обозначает здесь не просто время, а благоприятную возможность для действия.
- source_word: κακοποιήσει
  choice: сделает зло
  rationale: Сохраняет широкое нравственное значение глагола, не ограничивая его только причинением вреда другому человеку.
theological_decisions:
- issue: Нравственный смысл стиха
  choice: 'Неспособность совершить грех не приравнивается к праведности: при удобном случае человек сделает зло.'
  alternative: Понимать κακοποιήσει уже — как указание именно на причинение вреда другим людям.
  rationale: Сочетание ἁμαρτεῖν и κακοποιήσει даёт общую нравственную оценку. Перевод сохраняет её широту и не уточняет мотивы или вид злого поступка сверх сказанного в греческом тексте.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и ясная синтаксическая форма. Слово «сил» оставлено во множественном числе как наиболее естественное русское выражение нехватки способности действовать.
