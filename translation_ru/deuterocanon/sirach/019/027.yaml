lexical_decisions:
- source_word: συγκύφων
  choice: склоняет
  rationale: Причастие обозначает согбенную, наклонённую позу. В сочетании с «лицо» глагол «склоняет» естественно передаёт видимый жест.
- source_word: πρόσωπον
  choice: лицо
  rationale: Основное и стилистически нейтральное значение слова; оно уместно в современном литературном русском языке.
- source_word: ἑτεροκωφῶν
  choice: притворяется, будто не слышит
  rationale: Редкое причастие описывает человека, который изображает глухоту или намеренно не откликается. Выбранная формулировка ясно передаёт притворство, не перегружая текст буквальной необычностью.
- source_word: ὅπου
  choice: там, где
  rationale: Сохранено прежде всего пространственное значение греческого наречия и связь с последующим условием.
- source_word: οὐκ ἐπεγνώσθη
  choice: его не распознали
  rationale: Пассивная форма допускает значения «не узнали» и «не распознали». «Не распознали» лучше согласуется с описанной маскировкой поведения, при этом не уточняет её цель.
- source_word: προφθάσει σε
  choice: опередит тебя
  rationale: Глагол означает прийти раньше, предварить или обогнать. «Опередит тебя» сохраняет основной образ первенства и не вводит прямо не выраженную идею победы либо обмана.
