translation:
  language: ru
  text: Наряд мужчины, смех зубов и шаги человека возвещают то, что о нём.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «смех зубов». Вероятно, речь идёт об улыбке или о том, как человек показывает зубы; греческое выражение необычно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στολισμὸς ἀνδρὸς
  choice: одежда мужчины
  rationale: στολισμός обозначает внешний наряд или убранство; «одежда» естественно передаёт видимую сторону облика без лишнего оттенка роскоши. Мужской род ἀνδρός сохранён.
- source_word: γέλως ὀδόντων
  choice: улыбка, открывающая его зубы
  rationale: Буквально выражение означает «смех зубов», но по смыслу, вероятно, указывает на улыбку или показывание зубов. Выбран понятный русский оборот, а необычный буквальный образ отмечен в сноске.
- source_word: βήματα ἀνθρώπου
  choice: походка человека
  rationale: βήματα буквально означает «шаги», но здесь, в ряду внешних признаков, естественно обозначает манеру ходить; «походка» передаёт этот смысл. Более широкое ἀνθρώπου отражено словом «человека».
- source_word: ἀναγγέλλει
  choice: рассказывают
  rationale: Глагол означает сообщать, возвещать, давать знать. Русское «рассказывают» естественно выражает образ внешних признаков, по которым узнают человека; множественное число согласовано с составным подлежащим.
- source_word: τὰ περὶ αὐτοῦ
  choice: о нём
  rationale: Широкое греческое выражение буквально значит «то, что о нём» или «касающееся его». Краткое «о нём» сохраняет неопределённость и не вводит толкование «каков он».
