lexical_decisions:
- source_word: ὁ εὐφραινόμενος
  choice: кто радуется
  rationale: Причастие настоящего времени употреблено обобщённо. Такая передача сохраняет характер изречения и не уточняет без основания, идёт ли речь о веселье, удовольствии или радости.
- source_word: καρδίᾳ
  choice: в сердце
  rationale: Дательный падеж обозначает внутреннюю сферу или расположение; буквальная и понятная формулировка сохраняет необычность греческого выражения.
- source_word: καταγνωσθήσεται
  choice: будет осуждён
  rationale: Будущая страдательная форма передаёт вынесение неблагоприятного суждения или приговора. «Будет осуждён» сохраняет судебно-оценочный оттенок, не добавляя субъекта суда.
- source_word: λαλιὰν
  choice: разговоры
  rationale: Слово может обозначать речь, разговоры, болтовню или манеру говорить. Нейтральное «разговоры» не вносит в основной текст отрицательной оценки, которая прямо не выражена самим существительным.
- source_word: ἐλαττονοῦται
  choice: умаляется
  rationale: Глагол означает становиться меньше, терпеть уменьшение или ущерб. «Умаляется» сохраняет страдательно-возвратную форму и намеренно не конкретизирует, в чём именно состоит уменьшение.
- source_word: κακίᾳ
  choice: злом
  rationale: Дательный падеж допускает инструментальное понимание («злом», «посредством зла»), но краткая греческая конструкция неоднозначна. Выбранная форма сохраняет её сжатость.
theological_decisions:
- issue: Необычная связь сердечной радости с осуждением
  choice: Сохранить прямое утверждение без поясняющего морального дополнения
  alternative: Уточнить радость как злорадство, распущенное веселье или удовольствие от греха
  rationale: В предоставленном греческом тексте нет слова, которое прямо ограничивало бы радость злорадством или греховным весельем; такое уточнение устранило бы реальную напряжённость текста.
- issue: Неясный смысл второй части
  choice: Сохранить формулировку «умаляется злом» и пояснить варианты в сноске
  alternative: Истолковать как «меньше грешит», «избегает зла» или «терпит ущерб от злых людей»
  rationale: Формы ἐλαττονοῦται и κακίᾳ не позволяют уверенно выбрать одно из этих истолкований; богословски или нравственно сглаживать фразу без текстового основания не следует.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим синтаксисом. Необычность и смысловая напряжённость обеих частей сохранены; архаизирующее «умаляется» выбрано как наиболее компактное средство передать образ уменьшения, а его неоднозначность раскрыта в сноске.
