translation:
  language: ru
  text: По внешнему виду узнают человека, а по выражению лица — разумного.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по облику лица».'
    reason: Греческое выражение ἀπὸ ἀπαντήσεως προσώπου необычно и может указывать на внешний облик или выражение лица.
lexical_decisions:
- source_word: ὁράσεως
  choice: внешнему виду
  rationale: В обороте ἀπὸ ὁράσεως речь идёт о видимом облике человека, а не о самом акте зрения; «внешний вид» ясно и естественно передаёт этот смысл.
- source_word: ἐπιγνωσθήσεται
  choice: узнают
  rationale: Будущее страдательное обозначает распознавание человека другими по видимым признакам. В русском обобщённо-личная форма естественно звучит в пословичном изречении; настоящее время передаёт общую закономерность.
- source_word: ἀνήρ
  choice: человека
  rationale: Хотя греческое слово имеет мужской род, здесь оно употреблено в общем афористическом смысле. «Человек» сохраняет предмет высказывания и не привносит значения «муж».
- source_word: ἀπαντήσεως προσώπου
  choice: по выражению лица
  rationale: Необычный оборот обозначает явленный при встрече облик или выражение лица. Выбранный вариант понятен современному читателю, а возможная буквальная неоднозначность отмечена в сноске.
- source_word: νοήμων
  choice: разумного
  rationale: Слово обозначает человека, обладающего разумением и проницательностью. Субстантивированное «разумного» кратко и уместно для жанра изречения мудрости.
