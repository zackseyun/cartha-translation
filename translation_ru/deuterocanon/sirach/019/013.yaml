  text: Reprove a friend[a], lest perhaps he did not say it; and if he did say it, so that he may not repeat it.
translation:
  language: ru
  text: 'Расспроси друга[a]: возможно, он этого не говорил; а если говорил — чтобы он не повторял этого.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Обличи друга». Греческий глагол может означать как расспросить или проверить, так и обличить; последующие слова прежде всего побуждают выяснить, действительно ли друг это сказал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγξον
  choice: Потребуй объяснений
  rationale: Глагол ἐλέγχω может обозначать как проверку и выяснение дела, так и обличение. В данном контексте сначала необходимо установить, говорил ли друг это вообще; выбранное выражение передаёт серьёзное выяснение обстоятельств, не предполагая заранее его виновности.
- source_word: τὸν φίλον
  choice: у друга
  rationale: Определённый артикль в изречении имеет обобщающее значение; по-русски естественно говорить просто «у друга», не добавляя притяжательного местоимения.
- source_word: μή ποτε οὐκ εἶπεν
  choice: возможно, он этого не говорил
  rationale: Сочетание μή ποτε вводит предостерегающую возможность, а подразумеваемое содержание речи естественно передано местоимением «этого».
- source_word: εἰ εἴρηκεν
  choice: если говорил
  rationale: Греческий перфект здесь по-русски естественно передаётся прошедшим временем; повтор местоимения не требуется благодаря ясному контексту.
- source_word: ἵνα μὴ δευτερώσῃ
  choice: чтобы он больше этого не повторял
  rationale: δευτερόω означает сделать или сказать во второй раз. Контекст речи требует смысла «повторять сказанное»; «больше» ясно выражает запрет повторения.
