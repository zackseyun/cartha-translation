  text: Have you heard a word? Let it die with you[a]; take courage[b], it will not burst you open.
translation:
  language: ru
  text: 'Услышал слово[a]? Пусть оно умрёт вместе с тобой. Мужайся: оно тебя не разорвёт[b].'
  philosophy: optimal-equivalence
  footnotes:
