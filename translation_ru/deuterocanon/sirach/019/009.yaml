lexical_decisions:
- source_word: ἀκήκοας
  choice: Услышал
  rationale: Перфект ἀκούω обозначает уже состоявшееся услышанное, сохраняющее значение в настоящем; краткий риторический вопрос естественно передаёт греческую форму.
- source_word: λόγον
  choice: слово
  rationale: λόγος здесь может означать слово, дело или сообщение. «Слово» сохраняет лаконичность притчи и не устраняет смысловую широту.
- source_word: συναποθανέτω σοι
  choice: Пусть оно умрёт вместе с тобой
  rationale: Метафорический императив требует, чтобы услышанное не передавалось дальше; русский оборот сохраняет яркий образ оригинала.
- source_word: θάρσει
  choice: Мужайся
  rationale: Повелительная форма θαρσέω выражает ободрение. «Мужайся» сохраняет призывный и несколько возвышенный тон без пояснительного перефразирования.
- source_word: οὐ μή
  choice: не
  rationale: Сочетание οὐ μή выражает усиленное отрицание. В русском уверенность достаточно ясно передаётся будущим временем с отрицанием; добавление «ни за что» сделало бы строку тяжелее.
- source_word: ῥήξει
  choice: разорвёт
  rationale: Будущее время от ῥήγνυμι буквально передаёт образ разрыва или лопнувшей оболочки. «Разорвёт» сохраняет телесную гиперболу, не заменяя её отвлечённым «не повредит».
