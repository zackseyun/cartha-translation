  text: A man's attire[a], and the laughter of his teeth, and a person's steps proclaim what is about him.
translation:
  language: ru
  text: Одежда мужчины, улыбка, обнажающая зубы, и походка человека говорят о нём.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «смех зубов»; вероятно, имеется в виду улыбка или выражение лица, заметное по зубам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στολισμὸς
  choice: одежда
  rationale: Слово обозначает наряд, убранство или внешнее оформление; «одежда» естественно передаёт наблюдаемый внешний облик, не сужая смысл до украшений.
- source_word: ἀνδρὸς
  choice: мужчины
  rationale: Сохраняет мужской род и единственное число греческого текста.
- source_word: γέλως ὀδόντων
  choice: улыбка, открывающая его зубы
  rationale: Буквально — «смех зубов»; по-русски буквальная калька неясна, поэтому передан естественный смысл видимого по зубам выражения лица, а исходный образ отмечен в сноске.
- source_word: βήματα ἀνθρώπου
  choice: походка человека
  rationale: βήματα может обозначать шаги, но в перечне внешних признаков речь естественно понимается как манера ходить; ἀνθρώπου передано более общим «человека», в отличие от предшествующего ἀνδρός.
- source_word: ἀναγγέλλει
  choice: говорят
  rationale: Глагол означает сообщать, давать знать. Русское множественное число согласовано с составным рядом подлежащих; «говорят о нём» естественно передаёт образ без излишне торжественного «провозглашают».
- source_word: τὰ περὶ αὐτοῦ
  choice: о нём
  rationale: Широкая формула «то, что касается его» здесь идиоматично передаётся как «говорят о нём», без сужения смысла только до характера или репутации.
