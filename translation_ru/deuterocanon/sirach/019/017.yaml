translation:
  language: ru
  text: Вся мудрость — страх Господень[a], и во всякой мудрости — исполнение закона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благоговение перед Господом». Греческое выражение охватывает страх, трепет и исполненное почтения благоговение; в основном тексте сохранена его более сильная форма.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «соблюдение закона». Буквально греческое выражение означает «делание закона».'
    reason: alternative_reading
lexical_decisions:
- source_word: Πᾶσα σοφία
  choice: Вся мудрость
  rationale: Передаёт всеохватность греческого выражения и естественно звучит по-русски как общее утверждение о подлинной мудрости.
- source_word: φόβος Κυρίου
  choice: страх Господень
  rationale: Сохраняет сильное и традиционное выражение греческого текста, включающее не только боязнь, но также благоговение и трепет перед Господом.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: во всякой мудрости
  rationale: Сохраняет повтор πάσῃ и параллелизм двух частей стиха, не конкретизируя неоднозначную связь сверх того, что выражено в греческом.
- source_word: ποίησις νόμου
  choice: исполнение закона
  rationale: Ποίησις обозначает делание, осуществление на деле; в сочетании с νόμου естественное русское соответствие — «исполнение закона».
theological_decisions:
- issue: Передача Κυρίου
  choice: Господень
  alternative: Господа
  rationale: Форма «страх Господень» естественна для русского библейского языка и точно передаёт конструкцию φόβος Κυρίου, не подменяя греческое Κυρίου формой имени YHWH.
- issue: Смысл φόβος в богословии мудрости
  choice: страх
  alternative: благоговение
  rationale: Основной текст сохраняет смысловое напряжение между страхом, трепетом и благоговением, не сводя исходное слово только к более мягкому понятию почтения.
- issue: Характер ποίησις νόμου
  choice: исполнение закона
  alternative: соблюдение закона
  rationale: «Исполнение» удерживает деятельный смысл ποίησις; «соблюдение» также возможно, но несколько сильнее подчёркивает нормативную обязанность.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской формулой «страх Господень». Краткий параллелизм и именные конструкции исходного текста сохранены; архаические синтаксические формы не используются.
