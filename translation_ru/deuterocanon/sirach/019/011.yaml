  text: Стрела, застрявшая в плоти бедра, — таково слово во чреве глупца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в бедре плоти». Греческое сочетание с родительным падежом сжато; «в плоти бедра» передаёт его телесный образ без уточнения, которое отсутствует в оригинале.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βέλος
  choice: стрела
  rationale: Передаёт конкретный метательный снаряд и сохраняет яркий образ притчи.
- source_word: πεπηγὸς
  choice: застрявшая
  rationale: Перфектное причастие от πήγνυμι обозначает стрелу, которая вонзилась и остаётся внутри; «застрявшая» естественно выражает это состояние.
- source_word: ἐν μηρῷ σαρκός
  choice: в плоти бедра
  rationale: Сохраняет буквальные значения μηρός («бедро») и σάρξ («плоть»), а также сжатую и несколько необычную греческую конструкцию.
- source_word: λόγος
  choice: слово
  rationale: Прямое и достаточно широкое обозначение сказанного слова или сообщения, которое глупец удерживает в себе.
- source_word: ἐν κοιλίᾳ
  choice: во чреве
  rationale: Сохраняет телесную метафору и параллель с застрявшей в плоти стрелой; «чрево» здесь звучит достойно и по-прежнему понятно.
- source_word: μωροῦ
  choice: глупца
  rationale: Кратко передаёт типичного для литературы мудрости нравственно и рассудочно неразумного человека.
theological_decisions:
- issue: Значение σάρξ
  choice: буквальное «плоть»
  alternative: «тело»
  rationale: Здесь речь идёт о физической плоти в телесном сравнении, а не о богословском понятии греховной природы.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским словом «чрево». Необычность сочетания «в плоти бедра» сохранена ради неоднозначной сжатой конструкции оригинала и пояснена в сноске.
