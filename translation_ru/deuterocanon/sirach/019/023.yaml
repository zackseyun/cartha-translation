  text: He stoops his face and pretends to be deaf[a]; where he is not recognized[b], he will outwit you.
translation:
  language: ru
  text: Он опускает лицо и притворяется глухим; там, где его не узнают, он опередит тебя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предупредит тебя действием»; греческий глагол может означать, что он первым предпримет действие и тем самым получит преимущество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγκύφων
  choice: склоняет
  rationale: Причастие обозначает согбенную, наклонённую позу; в сочетании с «лицо» естественно передаётся глаголом «склоняет».
- source_word: πρόσωπον
  choice: лицо
  rationale: Прямое и обычное значение слова, уместное в современном русском языке.
- source_word: ἑτεροκωφῶν
  choice: притворяется глухим
  rationale: Редкий глагол описывает человека, который ведёт себя как глухой; перевод сохраняет оттенок намеренного притворства.
- source_word: ὅπου
  choice: там, где
  rationale: Сохраняет пространственно-обстоятельственное значение греческого наречия и естественно связывает части фразы.
- source_word: οὐκ ἐπεγνώσθη
  choice: его не распознали
  rationale: Пассивная форма ἐπιγινώσκω означает, что человека не узнали или не распознали; вариант не уточняет сверх текста, не заметили ли его или не разгадали его намерения.
- source_word: προφθάσει
  choice: опередит
  rationale: Глагол означает прийти прежде, предупредить действием или получить преимущество, действуя первым. «Опередит» сохраняет эту широту лучше, чем более толковательное «перехитрит».
- source_word: σε
  choice: тебя
  rationale: Прямое дополнение второго лица единственного числа.
