translation:
  language: ru
  text: 'Обличи друга[a]: может быть, он этого не сделал; а если он всё же что-то сделал, то чтобы он не повторил этого.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Расспроси друга… чтобы он не повторил этого». Глагол может означать как обличить или упрекнуть, так и обратиться к человеку, чтобы выяснить дело; здесь последующий оборот «может быть, он этого не сделал» не позволяет заранее считать друга виновным. Буквально в заключении: «чтобы он не прибавил к этому»; речь может идти о продолжении или повторении поступка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγξον
  choice: Обличи
  rationale: Глагол ἐλέγχω может означать «обличать», «изобличать», «проверять» или «допрашивать». «Обличи» сохраняет прямой призыв поставить друга перед вопросом о его поступке, не предполагая заранее его виновности.
- source_word: φίλον
  choice: друга
  rationale: Неопределённое, обобщённое употребление существительного естественно передаётся по-русски без местоимения «своего».
- source_word: μή ποτε
  choice: может быть
  rationale: 'Здесь сочетание выражает осторожное предположение: прежде чем осуждать друга, следует допустить, что он мог не совершать приписываемого ему поступка.'
- source_word: οὐκ ἐποίησεν
  choice: он этого не делал
  rationale: Объект действия подразумевается контекстом; местоимение «этого» естественно обозначает предполагаемый поступок.
- source_word: καὶ εἴ τι ἐποίησεν
  choice: а если что и сделал
  rationale: 'Оборот передаёт уступительное противопоставление предыдущей возможности: даже если друг всё же совершил нечто.'
- source_word: προσθῇ
  choice: больше к этому не прибавляет
  rationale: Сохранён буквальный образ глагола προστίθημι — «прибавлять»; в данном нравственном контексте он допускает смысл дальнейшего продолжения или повторения поступка.
