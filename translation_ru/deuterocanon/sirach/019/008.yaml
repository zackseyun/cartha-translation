  text: For he has heard you and has guarded himself against you[a], and in time he will hate you.
translation:
  language: ru
  text: Ведь он услышал тебя и стал остерегаться тебя[a], а когда придёт время, возненавидит тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сберёг тебя»; «наблюдал за тобой». Греческий глагол может означать «стеречь», «хранить» или «наблюдать»; средняя форма здесь также допускает смысл «стал остерегаться тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκήκοεν
  choice: услышал
  rationale: Перфект ἀκούω обозначает состоявшееся слышание с сохраняющимся результатом; в русском контексте это естественно передаётся совершенным видом без обязательного добавления «уже».
- source_word: γάρ
  choice: ведь
  rationale: Частица вводит объяснение предшествующего наставления; «ведь» естественно выражает эту связь в современном русском языке.
- source_word: ἐφυλάξατό σε
  choice: стал остерегаться тебя
  rationale: 'Средняя форма допускает смысл самозащиты: человек принял услышанное к сведению и теперь держится настороже по отношению к собеседнику. Перевод учитывает контекст будущей неприязни, но неоднозначность глагола отмечена в сноске.'
- source_word: ἐν καιρῷ
  choice: когда придёт время
  rationale: Оборот указывает на последующий или подходящий момент; идиоматический русский перевод сохраняет временную неопределённость.
- source_word: μισήσει σε
  choice: возненавидит тебя
  rationale: Будущее время μισέω передано прямо, без смягчения значения враждебности.
