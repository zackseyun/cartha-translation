  text: Wine and women lead the heart astray[a], and a bold soul destroys its owner.
translation:
  language: ru
  text: Вино и женщины лишают сердце рассудительности, а дерзкая душа погубит своих владельцев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Вино и женщины отвратят разумных, а тот, кто прилепляется к блудницам, станет ещё безрассуднее». Вторая строка сохранившегося еврейского текста существенно отличается.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַיִן
  choice: вино
  rationale: Прямое соответствие еврейскому существительному; сохраняет первый элемент пары предостережений.
- source_word: נָשִׁים
  choice: женщины
  rationale: Обычное значение формы множественного числа. Еврейский текст не ограничивает смысл жёнами или блудницами.
- source_word: יַפְחִיזוּ
  choice: делают … безрассудным
  rationale: Глагол передаёт приведение к опрометчивости, неустойчивости или безрассудству. Такая конструкция естественно сочетается со словом «сердце» и не сводит образ к одному лишь нравственному уклонению.
- source_word: לֵב
  choice: сердце
  rationale: Сохраняет еврейский образ внутреннего средоточия мысли, воли и желаний.
- source_word: נֶפֶשׁ
  choice: душа
  rationale: Передаёт человека как живое внутреннее «я», сохраняя весомость еврейского выражения без превращения его в узкий технический термин.
- source_word: עָזָה
  choice: дерзкая
  rationale: В данном нравственном контексте обозначает чрезмерную смелость, своеволие или наглую решительность; «дерзкая» сохраняет отрицательный оттенок, не привнося сексуального смысла.
- source_word: תַשְׁחִית
  choice: погубит
  rationale: Передаёт сильное значение разрушения или доведения до гибели и естественно звучит применительно к человеку.
- source_word: בְעָלֶיהָ
  choice: того, кому она принадлежит
  rationale: Буквально речь идёт о её владельце или обладателе. Описательная конструкция сохраняет метафору принадлежности души человеку и звучит по-русски естественнее, чем «её владелец».
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и греческой параллели
  choice: Основной текст непосредственно следует сохранившемуся еврейскому свидетельству; греческое чтение приводится в сноске.
  alternative: 'Перевод по греческому тексту: «Вино и женщины отвратят разумных, а тот, кто прилепляется к блудницам, станет ещё безрассуднее».'
  rationale: Вторая часть греческой версии существенно отличается от еврейской. Сведение вариантов воедино скрыло бы реальное текстовое расхождение и внесло бы в основной текст упоминание блудниц, отсутствующее в еврейском свидетельстве.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Сохранены традиционные библейские образы «сердца» и «души», но буквальное «владелец души» передано более естественной конструкцией.
