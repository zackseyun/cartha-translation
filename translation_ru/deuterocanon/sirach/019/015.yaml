translation:
  language: ru
  text: Бывает, что человек оступается не намеренно[a]; и кто не грешил языком?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не от души»; то есть: «не намеренно».'
    reason: Передаёт буквальную форму οὐκ ἀπὸ ψυχῆς и поясняет её контекстуальный смысл без привнесения идеи внешнего принуждения.
lexical_decisions:
- source_word: ἔστιν ὀλισθάνων
  choice: Бывает, что человек оступается
  rationale: Экзистенциальная конструкция с обобщённым причастием естественно передана как указание на реально встречающийся случай. «Оступается» сохраняет образ промаха и допускает как нравственный, так и речевой срыв.
- source_word: οὐκ ἀπὸ ψυχῆς
  choice: не по своей воле
  rationale: Буквально выражение означает «не от души». В данном противопоставлении оно указывает на непреднамеренность; русский оборот «не по своей воле» передаёт этот смысл, не приписывая человеку конкретного мотива.
- source_word: τίς οὐχ ἥμαρτεν
  choice: кто не грешил
  rationale: Риторический вопрос подразумевает, что такое случалось со всеми. Глагол «грешил» сохраняет нравственную силу ἁμαρτάνω.
- source_word: ἐν τῇ γλώσσῃ αὐτοῦ
  choice: языком
  rationale: Творительный падеж естественно передаёт греческое орудийное значение и сохраняет телесный образ языка как средства речи.
theological_decisions:
- issue: Нравственный или лишь речевой оттенок ἥμαρτεν
  choice: грешил
  alternative: ошибался; провинился
  rationale: Контекст представляет проступок в речи как нравственно значимый, поэтому «грешил» точнее сохраняет смысл, не вводя дополнительных доктринальных уточнений.
- issue: Степень намеренности в οὐκ ἀπὸ ψυχῆς
  choice: не по своей воле
  alternative: не намеренно; не от души
  rationale: Основной текст ясно передаёт отсутствие намерения, а буквальная образность сохранена в примечании; тем самым не утверждается ни полная невиновность, ни отсутствие последствий.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Союз «и» сохранён между двумя частями греческого изречения; обобщённый субъект передан словом «человек» без излишней гендерной конкретизации.
