  text: Обличи своего ближнего, прежде чем угрожать, и дай место закону Всевышнего[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предоставь закону Всевышнего действовать»; возможно также: «уступи место закону Всевышнего». Греческое выражение может призывать подчинить свою реакцию Божьему закону, не переходя сразу к угрозам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξον
  choice: обличи
  rationale: Повелительное наклонение требует прямо указать ближнему на его проступок. «Обличи» передаёт нравственную серьёзность глагола, не сводя его смысл ни к простому совету, ни к наказанию.
- source_word: τὸν πλησίον σου
  choice: своего ближнего
  rationale: В этическом наставлении πλησίον обозначает ближнего, другого человека, с которым говорящий связан отношениями и обязанностями.
- source_word: πρὶν ἢ ἀπειλῆσαι
  choice: прежде чем угрожать
  rationale: 'Оборот выражает временную последовательность: сначала следует прямо обличить человека, а не сразу переходить к угрозам. Инфинитив передан естественной русской конструкцией.'
- source_word: δὸς τόπον
  choice: дай место
  rationale: Сохранён образ исходного выражения — буквально «дай место». Он допускает оттенки уступки, предоставления возможности действовать и подчинения своей реакции иному порядку.
- source_word: νόμῳ Ὑψίστου
  choice: закону Всевышнего
  rationale: νόμος здесь естественно понимать как Божий закон или установление, а Ὕψιστος — как традиционный почтительный титул Бога «Всевышний».
theological_decisions:
- issue: Смысл выражения δὸς τόπον νόμῳ Ὑψίστου
  choice: сохранить образный призыв «дать место» закону Всевышнего
  alternative: «предоставь закону Всевышнего действовать» или «уступи закону Всевышнего»
  rationale: Греческое выражение не уточняет, означает ли оно позволить закону действовать, подчинить ему собственную реакцию или отказаться от личной расправы. Буквальный образ в основном тексте сохраняет эту смысловую открытость, а примечание разъясняет возможные оттенки без догматического сужения.
translation_notes:
  register: Современный литературный русский с достоинством, свойственным наставлению премудрости. «Обличи» сохраняет нравственную серьёзность, а несколько формальное «дай место» намеренно удерживает метафору и неоднозначность греческого текста; её смысл пояснён в сноске.
