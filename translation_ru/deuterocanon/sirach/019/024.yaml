  yaml_path: translation/deuterocanon/sirach/019/024.yaml
  text: And if he is prevented from sinning by lack of strength[b][a], when he finds an opportunity he will do evil.
translation:
  language: ru
  text: И если недостаток сил не даст ему согрешить, то, найдя удобный случай, он сделает зло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Простой соединительный союз продолжает мысль предыдущего стиха, не вводя не выраженного в греческом тексте противопоставления.
- source_word: ἐὰν
  choice: если / то
  rationale: Оба употребления образуют условную конструкцию; во второй части по-русски естественно передать условную связь оборотом «то, найдя».
- source_word: ὑπὸ ἐλαττώματος ἰσχύος
  choice: недостаток сил
  rationale: Сочетание обозначает недостаточность силы или способности; формулировка сохраняет причинный смысл и не уточняет без основания, физическая это слабость или более общая неспособность.
- source_word: κωλυθῇ ἁμαρτεῖν
  choice: не даст ему согрешить
  rationale: Пассивная форма κωλυθῇ выражает препятствие; персонифицированная русская конструкция с «недостатком сил» ясно показывает, что от греха удерживают обстоятельства, а не нравственное исправление.
- source_word: εὕρῃ καιρόν
  choice: найдя удобный случай
  rationale: καιρός здесь означает подходящий момент или возможность, а не просто хронологическое время.
- source_word: κακοποιήσει
  choice: он сделает зло
  rationale: Будущая форма κακοποιέω имеет широкий смысл совершения зла или дурного поступка; перевод сохраняет смысловую связь с «согрешить».
theological_decisions:
- issue: Характер удержания человека от греха
  choice: Человек не грешит из-за недостатка сил или возможности, а не вследствие явно названной праведности.
  alternative: Понимать слабость преимущественно как нравственную либо физическую.
  rationale: Греческое ἐλάττωμα ἰσχύος указывает на недостаточность силы в общем смысле, а заключительная часть показывает, что при удобном случае человек всё же совершит зло. Перевод не сужает вид этой неспособности.
translation_notes:
  register: Современный литературный русский язык; краткая, назидательная формулировка с сохранением условной структуры и нравственного напряжения оригинала. Архаизмы и конфессионально окрашенные уточнения не использованы.
