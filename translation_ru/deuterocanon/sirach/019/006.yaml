translation:
  language: ru
  text: Никогда не повторяй сказанного[a][b] — и ничего у тебя не убавится.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Никогда не повторяй слова»; греческое λόγον может означать «слово», «высказывание», «сообщение» или «дело».'
    reason: lexical_alternative
  - marker: b
    text: Для этого места отмечено существенное расхождение при проверке источника. Перевод следует приведённому тексту издания Суета.
    reason: textual_variant
lexical_decisions:
- source_word: μηδέποτε
  choice: Никогда не
  rationale: Передаёт временную и усиленную силу запрета естественным современным русским выражением.
- source_word: δευτερώσῃς
  choice: повторяй
  rationale: Глагол δευτερόω буквально означает «делать второй раз»; при λόγον естественно означает повторять или пересказывать сказанное.
- source_word: λόγον
  choice: сказанного
  rationale: λόγος допускает значения «слово», «высказывание», «сообщение» и «дело». Субстантивированное «сказанное» сохраняет широту смысла и звучит естественнее, чем буквальное «не повторяй слово».
- source_word: οὐθέν σοι οὐ μὴ ἐλαττονωθῇ
  choice: ничего у тебя не убавится
  rationale: Сохраняет образ уменьшения в ἐλαττονόω, дательный σοι и усиленное заверение οὐ μή, не сводя смысл исключительно к материальной потере.
