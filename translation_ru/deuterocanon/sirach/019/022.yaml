    issue: «творящий зло» недостаточно передаёт оттенок намеренного коварного замысла в πονηρευόμενος.
    rationale: В английском контрольном переводе выбран вариант «plots evil», а греческое причастие в контексте внутреннего δόλος характеризует не просто совершение злых дел, а злонамеренную, коварную направленность. «Замышляющий зло» передаёт это точнее.
  - severity: low
    issue: Сноска не отражает вариант «тёмный внешний вид» столь же прямо, как это делает английская audit trail.
    rationale: Формулировка «мрачное состояние» и «тёмный внешний вид» в сноске может быть сохранена, но следует также оставить возможность «черноты/мрака» без сведения к эмоциональному состоянию.
  revised_text: Есть человек, замышляющий зло, — сгорбленный и мрачный[a], а внутри он полон обмана.
