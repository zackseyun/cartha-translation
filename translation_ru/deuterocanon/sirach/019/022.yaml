lexical_decisions:
- source_word: ἔστιν
  choice: Есть человек
  rationale: Греческая бытийная конструкция вводит обобщённый образ человека; такой оборот естественен и ясен по-русски.
- source_word: πονηρευόμενος
  choice: творящий зло
  rationale: Причастие обозначает деятельное злое поведение. Перевод не сужает смысл до одного лишь тайного замысла, поскольку греческое слово может охватывать злые поступки вообще.
- source_word: συγκεκυφώς
  choice: сгорбленный
  rationale: Совершенное причастие передаёт устойчиво согнутую, поникшую позу; «сгорбленный» сохраняет как буквальное, так и образное прочтение.
- source_word: μελανίᾳ
  choice: мрачный
  rationale: Слово связано с чернотой или мрачностью и может указывать на тёмный внешний вид либо угрюмое состояние. Прилагательное создаёт естественную русскую фразу, а неоднозначность отмечена в сноске.
- source_word: τὰ ἐντὸς αὐτοῦ
  choice: внутри он
  rationale: Выражение указывает на внутреннее состояние человека и противопоставляет его внешнему облику; буквальное «то, что внутри него» по-русски было бы тяжеловесно.
- source_word: πλήρης δόλου
  choice: полон обмана
  rationale: δόλος означает обман, коварство или хитрость. «Полон обмана» ясно передаёт нравственную характеристику и сохраняет образ наполненности.
theological_decisions:
- issue: Соотношение внешнего облика и внутреннего состояния
  choice: Сохранено противопоставление сгорбленного, мрачного облика внутренней исполненности обманом.
  alternative: Понимать поникшую позу исключительно как притворство или, напротив, как подлинную подавленность.
  rationale: Греческий текст сопоставляет внешнюю позу и мрачность с внутренним обманом, но прямо не говорит, притворен ли внешний вид. Перевод не разрешает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной синтаксической формой. Слова «сгорбленный и мрачный» сохраняют зрительный образ и намеренно не уточняют, является ли такое состояние искренним или притворным.
