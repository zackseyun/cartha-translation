  source_fidelity: 'Первая часть передана точно: «изощрённое коварство» хорошо отражает отрицательно окрашенное πανουργία ἀκριβής, а «несправедливо» — ἄδικος. Однако «справедливое решение» неоправданно сужает и положительно истолковывает κρίμα: греческое слово допускает «суд», «судебное решение», «приговор» или «суждение», но само по себе не означает именно справедливого решения. Подразумеваемый объект при διαστρέφων можно передать естественным русским обобщением «искажает всё», не утверждая, что речь специально о судебном деле.'
