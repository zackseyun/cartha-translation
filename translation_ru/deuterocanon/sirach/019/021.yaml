base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/019/021.yaml
  text: There is a meticulous cunning[a], and this too is unjust[b]; and there is one who twists things in order to bring a judgment to light.
translation:
  language: ru
  text: Бывает изощрённое коварство, и оно несправедливо; а бывает, что человек искажает всё, чтобы стало явным решение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы сделать явным суд (судебное решение, приговор)». Греческое κρίμα может означать суд, судебное решение, приговор или справедливость.'
    reason: alternative_reading
lexical_decisions:
- source_word: πανουργία ἀκριβὴς
  choice: изощрённое коварство
  rationale: πανουργία здесь имеет отрицательную нравственную окраску, а ἀκριβής указывает на тщательно рассчитанный, искусный характер коварства. «Изощрённое» естественно передаёт это сочетание по-русски.
- source_word: ἄδικος
  choice: несправедливо
  rationale: Слово обозначает то, что противно правде и справедливости; наречная форма при русском местоимении «оно» звучит естественнее, сохраняя нравственную оценку.
- source_word: διαστρέφων
  choice: искажает дело
  rationale: Причастие означает искривлять, извращать или отклонять. Добавленное «дело» естественно выражает подразумеваемый объект и согласуется с судебно-этическим оттенком κρίμα.
- source_word: χάριν τοῦ
  choice: чтобы
  rationale: Конструкция выражает цель; краткое «чтобы» ясно и естественно передаёт её в современном русском языке.
- source_word: ἐκφᾶναι
  choice: выявить
  rationale: Глагол означает сделать явным, обнаружить, вывести на свет. «Выявить» сохраняет смысл без лишнего образного расширения.
- source_word: κρίμα
  choice: справедливое решение
  rationale: κρίμα может означать суд, судебное решение или приговор. В данном парадоксальном контексте сочетание с целью искажения допускает положительный оттенок — выявить верное или справедливое решение, — однако неоднозначность отмечена в сноске.
theological_decisions:
- issue: Нравственная оценка искусной находчивости
  choice: Первая часть прямо осуждает тщательно рассчитанное коварство как несправедливое.
  alternative: 'Можно было бы начать нейтральнее: «Бывает точная расчётливость», оставив отрицательную оценку следующей части.'
  rationale: αὕτη ἄδικος недвусмысленно даёт предшествующей πανουργία отрицательную нравственную оценку.
- issue: Парадокс искажения ради κρίμα
  choice: Сохранена возможность того, что человек прибегает к искажению ради выявления справедливого решения.
  alternative: «Искажает дело, чтобы обнародовать приговор» или «чтобы выявить суд».
  rationale: 'Фраза намеренно напряжённая: средство описано глаголом διαστρέφω, тогда как цель может быть судебным решением или справедливостью. Перевод не должен устранять этот парадокс.'
translation_notes:
  register: Современный литературный русский, сдержанный и афористичный. Параллелизм двух частей сохранён; лексика понятна широкому читателю, а юридико-нравственная неоднозначность последней фразы вынесена в сноску.
