  to: Бывает изощрённое коварство, и оно несправедливо; а бывает, что человек искажает всё, чтобы стало явным решение.[a]
  rationale: Убрано не выраженное в оригинале определение «справедливое» при κρίμα. Сохранены цель действия, парадоксальность высказывания и широкая семантика κρίμα; сноска даёт основные допустимые оттенки. Обобщённый объект «всё» позволяет по-русски естественно передать абсолютное употребление διαστρέφων, не добавляя конкретной ситуации.
