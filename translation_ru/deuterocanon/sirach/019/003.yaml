translation:
  language: ru
  text: Тлен и черви унаследуют его, и дерзкая[a] душа будет унесена.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «безрассудно смелая».'
    reason: Указывает на диапазон значений τολμηρά, включая возможный отрицательный оттенок, не устраняя неоднозначности оригинала.
lexical_decisions:
- source_word: σήπη
  choice: тлен
  rationale: Передаёт гниение и разложение тела кратким, литературным и уместным в данном контексте словом.
- source_word: κληρονομήσουσιν
  choice: унаследуют
  rationale: 'Сохраняет буквальный и выразительный образ: тлен и черви становятся наследниками человека.'
- source_word: ψυχὴ τολμηρά
  choice: дерзкая душа
  rationale: Сохраняет слово «душа» и неоднозначность τολμηρά, которое может обозначать смелость, дерзость или безрассудную отвагу; контекст придаёт выражению отрицательный оттенок.
- source_word: ἐξαρθήσεται
  choice: будет исторгнута
  rationale: Передаёт будущее страдательное значение «будет удалена/унесена» и сохраняет суровый, несколько открытый образ оригинала.
theological_decisions:
- issue: Значение ψυχή в выражении ψυχὴ τολμηρά
  choice: Сохранить «душа», не заменяя её однозначно словами «человек» или «жизнь».
  alternative: «Дерзкий человек будет истреблён» или «его дерзкая жизнь будет отнята».
  rationale: Греческое ψυχή допускает значения «душа», «жизнь» и «человек»; буквальное «душа» сохраняет богословскую и антропологическую неоднозначность текста.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. Метафора наследования и намеренная суровость греческого текста сохранены.
