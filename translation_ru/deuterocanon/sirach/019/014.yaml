  source_fidelity: 'Начальное «Обличи друга» точно передаёт Ἔλεγξον φίλον, а заключительное «не верь всякому слову» верно отражает μὴ παντὶ λόγῳ πίστευε. Однако оборот «часто дело бывает в клевете» не соответствует γὰρ ... γίνεται διαβολή: в греческом сказано, что клевета часто случается/возникает, а не что «дело» заключается в клевете.'
