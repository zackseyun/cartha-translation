translation_notes:
  register: 'Современный литературный русский язык с краткой, достойной афористичностью. Двоеточие делает явной пояснительную функцию γὰρ, а «ведь» сохраняет её в самом предложении. Перевод не добавляет, что обличать следует лишь после доказательства обвинения, но соседство с предупреждением о клевете сохраняет исходное напряжение: друга нужно призвать к ответу, не проявляя при этом доверчивости к любому сообщению.'
