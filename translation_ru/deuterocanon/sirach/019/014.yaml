  text: 'Обличи друга: ведь часто бывает клевета; не верь всякому слову.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγξον
  choice: Обличи
  rationale: Повелительная форма ἐλέγχω означает указать человеку на вину, уличить или призвать к ответу. «Обличи» сохраняет нравственную и межличностную силу выражения, не сводя его ни к мягкому совету, ни к враждебному нападению.
- source_word: φίλον
  choice: друга
  rationale: Неопределённое единственное число имеет обобщающий, характерный для изречения смысл; русское «друга» естественно передаёт его без добавления отсутствующего в греческом притяжательного местоимения.
- source_word: πολλάκις
  choice: часто
  rationale: Прямое и естественное соответствие наречию со значением многократности или частой повторяемости.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит основание для повеления. «Ведь» естественно сохраняет пояснительно-причинную связь в русском изречении.
- source_word: γίνεται
  choice: дело бывает
  rationale: Глагол буквально означает «случается», «возникает», «бывает». В сочетании с διαβολή оборот «дело бывает в клевете» ясно передаёт мысль, что причиной услышанного может оказаться клевета.
- source_word: διαβολή
  choice: клевете
  rationale: διαβολή обозначает клевету, злонамеренное обвинение или очернение. «Клевета» — точный и понятный современному читателю эквивалент.
- source_word: μὴ παντὶ λόγῳ πίστευε
  choice: не верь всякому слову
  rationale: Буквально λόγος — «слово», а по контексту также «высказывание» или «сообщение». Формулировка сохраняет образ и естественно выражает предостережение не принимать без проверки всё услышанное.
