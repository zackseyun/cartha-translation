base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/019/020.yaml
  text: Better is one who is lacking[a], with understanding and fear, than one who abounds in prudence and transgresses the law.
translation:
  language: ru
  text: Лучше тот, кому недостаёт разумения, но кто исполнен страха[a], чем тот, кто изобилует рассудительностью и преступает закон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «благоговеет» или «богобоязнен»; в греческом тексте не сказано, кого или чего он боится.'
    reason: Сохранена смысловая широта ἔμφοβος и не добавлен прямо не названный объект страха.
lexical_decisions:
- source_word: κρείττων
  choice: Лучше тот
  rationale: Сравнительная форма открывает краткое изречение; такая конструкция естественна для русского языка и сохраняет форму сопоставления.
- source_word: ἡττώμενος ἐν συνέσει
  choice: кому недостаёт разумения
  rationale: Причастие ἡττώμενος с ἐν συνέσει указывает на недостаток или меньшую меру именно разумения. Это чтение следует греческому синтаксису и не превращает недостаток в материальную бедность или общественную неполноценность.
- source_word: ἔμφοβος
  choice: исполнен страха
  rationale: Прилагательное означает «охваченный страхом, боящийся». Формулировка сохраняет не названный в греческом объект страха и допускает как обычный страх, так и благоговейный.
- source_word: περισσεύων ἐν φρονήσει
  choice: изобилует рассудительностью
  rationale: περισσεύων выражает избыток, а φρόνησις — практическую рассудительность или благоразумие. Выбор сохраняет противопоставление недостатку разумения и различает σύνεσις и φρόνησις.
- source_word: παραβαίνων νόμον
  choice: преступает закон
  rationale: Оборот означает нарушение закона; «преступает закон» соответствует возвышенному, но понятному регистру книги Премудрости.
theological_decisions:
- issue: Следует ли уточнять ἔμφοβος как «боящийся Господа»
  choice: исполнен страха
  alternative: богобоязнен / боится Господа
  rationale: Объект страха в греческом тексте не указан. Контекст Сираха допускает благоговейный страх перед Богом, однако прямое добавление «Господа» устранило бы сохранённую источником неоднозначность.
- issue: Связь ἡττώμενος с ἐν συνέσει
  choice: кому недостаёт разумения
  alternative: нуждающийся, но обладающий разумением
  rationale: Предложная группа ἐν συνέσει естественно указывает сферу, в которой человек оказывается слабее или испытывает недостаток. Такое понимание сохраняет параллель с περισσεύων ἐν φρονήσει и исправляет смысловое расхождение консультационного английского текста с греческим источником.
translation_notes:
  register: Современный литературный русский язык с краткой афористической структурой. «Разумение» и «рассудительность» выбраны для передачи различия между σύνεσις и φρόνησις; «преступает закон» поддерживает достоинство премудростного регистра. Союз «но» перед характеристикой страха делает смысловое противопоставление естественным по-русски, не меняя состава утверждений.
