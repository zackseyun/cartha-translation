base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/019/004.yaml
  text: He who trusts too quickly is light of heart[a], and he who sins against his own soul will go astray.
translation:
  language: ru
  text: Кто слишком поспешно доверяет, тот легкомыслен, а кто грешит против собственной души[a], тот поступит неправильно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против самого себя» или «себе во вред»; буквально по-гречески: «против собственной души».'
    reason: Сноска сохраняет смысловой диапазон ψυχή и конструкции с εἰς, не устраняя неоднозначность основного текста.
lexical_decisions:
- source_word: ταχὺ
  choice: слишком поспешно
  rationale: Наречие относится к ἐμπιστεύων. Сочетание передаёт не просто быстроту, а порицаемую опрометчивость, подразумеваемую сентенцией.
- source_word: ἐμπιστεύων
  choice: доверяет
  rationale: Глагол означает оказывать доверие, полагаться; «доверяет» естественно звучит в контексте предостережения от доверчивости.
- source_word: κοῦφος καρδίᾳ
  choice: легкомыслен
  rationale: Буквально выражение говорит о человеке, «лёгком сердцем»; русское «легкомыслен» сохраняет образ лёгкости и естественно обозначает внутреннюю несерьёзность или неосмотрительность.
- source_word: ἁμαρτάνων
  choice: грешит
  rationale: Передаёт обычное нравственно-религиозное значение глагола ἁμαρτάνω без его ослабления до общего «ошибается».
- source_word: εἰς ψυχὴν αὐτοῦ
  choice: против собственной души
  rationale: Сохраняет направленность действия и ключевое слово ψυχή, не сводя его безоговорочно к значениям «сам» или «жизнь».
- source_word: πλημμελήσει
  choice: совершит проступок
  rationale: Будущее время πλημμελέω обозначает неверный или предосудительный поступок. Формулировка сохраняет нравственный смысл и не добавляет образа пути, которого нет в греческом выражении.
theological_decisions:
- issue: Значение антропологического термина ψυχή
  choice: душа
  alternative: сам человек; жизнь
  rationale: В литературе Премудрости ψυχή может обозначать душу, жизнь или самого человека. В основном тексте сохранён более формальный вариант «душа», а возможный смысл саморазрушительного действия отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. «Легкомыслен» естественно передаёт греческую метафору лёгкости сердца, а параллельные обороты «кто… тот…» сохраняют форму наставительной сентенции.
