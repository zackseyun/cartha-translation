    issue: «Тот совершит проступок» неудачно передаёт πλημμελήσει в данном русском контексте.
    rationale: После «кто грешит» эта формула практически повторяет тот же смысл и звучит тавтологично. «Поступит неправильно» сохраняет общий смысл πλημμελέω — допустить нравственно неверный поступок — и лучше различает два греческих глагола.
