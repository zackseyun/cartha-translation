  text: A fool will suffer pangs at the sight of a word[a], like a woman in labor at the sight of a baby.
translation:
  language: ru
  text: Из-за слова[a] глупец будет мучиться, словно роженица — из-за младенца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лица (или присутствия) слова… как от лица (или присутствия) младенца». Здесь этот греческий оборот, вероятно, указывает на причину или повод. Слово λόγος может также означать «речь», «сообщение» или «дело».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ προσώπου
  choice: из-за
  rationale: Буквально оборот означает «от лица/присутствия», однако здесь указывает на причину или повод. Русское «из-за» естественно передаёт эту связь и одинаково применимо в обеих частях сравнения.
- source_word: λόγου
  choice: одного слова
  rationale: λόγος может означать «слово», «речь», «сообщение» или «дело». «Одного слова» сохраняет краткость изречения и подчёркивает несоразмерность мучений глупца, не исключая более широкого смысла.
- source_word: ὠδινήσει
  choice: будет мучиться
  rationale: Глагол обозначает страдание, особенно родовые муки. «Будет мучиться» сохраняет форму будущего времени и передаёт боль, а явный образ родов раскрывается во второй части стиха.
- source_word: μωρός
  choice: глупец
  rationale: Традиционный и естественный термин литературы мудрости для человека, лишённого практической и нравственной рассудительности.
- source_word: βρέφους
  choice: младенца
  rationale: βρέφος обозначает младенца или новорождённого; в контексте родов «младенец» точен и стилистически достоин.
- source_word: ἡ τίκτουσα
  choice: роженица
  rationale: Субстантивированное причастие буквально означает «рождающая». «Роженица» кратко и естественно обозначает женщину, испытывающую родовые муки.
