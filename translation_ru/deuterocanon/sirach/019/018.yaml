  text: And the knowledge of evil is not wisdom[a], and where the counsel of sinners is, there is no understanding.
translation:
  language: ru
  text: И знание зла — не мудрость[a], и там, где совет грешников, нет благоразумия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в искусности во зле нет мудрости». В греческом тексте различаются σοφία («мудрость»), ἐπιστήμη («знание, искусность») и φρόνησις («благоразумие, рассудительность»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: мудрость
  rationale: Обычное соответствие в литературе мудрости; сохраняет нравственно-интеллектуальный смысл.
- source_word: πονηρίας
  choice: зла
  rationale: Широкое и естественное обозначение нравственного зла; родительный падеж зависит от ἐπιστήμη.
- source_word: ἐπιστήμη
  choice: знание
  rationale: Сохраняет различие между знанием, мудростью и практическим благоразумием.
- source_word: βουλή
  choice: совет
  rationale: Передаёт замысел или совместное рассуждение грешников и сохраняет афористичность фразы.
- source_word: ἁμαρτωλῶν
  choice: грешников
  rationale: Прямое и общепринятое библейское соответствие родительному падежу.
- source_word: φρόνησις
  choice: благоразумие
  rationale: Обозначает практическую нравственную рассудительность и отличается от σοφία и ἐπιστήμη.
- source_word: οὐκ ἔστιν ὅπου
  choice: там, где …, нет
  rationale: Естественно передаёт греческую локативную конструкцию, не ослабляя отрицания.
theological_decisions:
- issue: Имеет ли искусность во зле положительный статус мудрости
  choice: Стих прямо отказывает знанию зла в статусе мудрости, а совету грешников — в благоразумии.
  alternative: Можно понять первую фразу лишь как различение знания зла и мудрости, без полного нравственного отрицания такого знания.
  rationale: Двойное οὐκ ἔστιν выражает решительное отрицание; перевод сохраняет нравственное напряжение текста без привнесения позднейших доктринальных категорий.
translation_notes:
  register: Современный литературный русский язык с краткой афористической структурой. Союз «и» в начале и между частями сохранён по греческому тексту; тире делает первую часть естественной по-русски.
