  yaml_path: translation/deuterocanon/sirach/008/011.yaml
  text: Do not despise even his ordinary conversation[a], for from him you will learn instruction for standing before rulers.
translation:
  language: ru
  text: 'Не пренебрегай даже его обычными разговорами[a]: у него ты научишься, как держаться перед правителями.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции: «Не уходи от дерзкого человека, чтобы он не устроил засады против уст твоих». Здесь греческий текст существенно отличается от сохранившегося еврейского.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂיחוֹת חוֹל
  choice: обычные разговоры
  rationale: Слово שִׂיחוֹת означает разговоры или беседы, а חוֹל здесь указывает на повседневное, неофициальное содержание, не подразумевая чего-либо нечистого или предосудительного.
- source_word: תִבְזֶה
  choice: не пренебрегай
  rationale: Глагол выражает презрительное или пренебрежительное отношение. «Не пренебрегай» естественно звучит по-русски применительно к разговорам и сохраняет наставительный тон.
- source_word: לְהִתְיַצֵּב לִפְנֵי שָׂרִים
  choice: как держаться перед правителями
  rationale: Инфинитивная конструкция описывает практическое умение вести себя в присутствии высокопоставленных лиц. Такой перевод передаёт смысл естественно, не ограничивая שָׂרִים титулом «князья».
- source_word: לֶקַח
  choice: научишься
  rationale: Существительное обозначает усвоенное наставление или знание. В сочетании с תִּלְמַד русская глагольная передача «научишься» избегает тяжеловесного «усвоишь наставление» и сохраняет дидактический смысл.
- source_word: מִמֶּנּוּ
  choice: у него
  rationale: Местоимение мужского рода единственного числа передано прямо; русское «у него научишься» идиоматично выражает получение знания от человека.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающейся греческой традицией
  choice: Основной текст переведён по еврейскому свидетельству; греческое чтение приведено в сноске.
  alternative: «Не вставай перед дерзким человеком, чтобы он не устроил засаду против уст твоих».
  rationale: В Книге Премудрости Иисуса, сына Сирахова, сохранившийся еврейский текст имеет первенство. Поскольку греческая версия здесь передаёт совершенно иное содержание, её нельзя незаметно согласовать с еврейской; она сохранена как значимое альтернативное чтение.
translation_notes:
  register: Современный литературный русский язык; наставительный, сдержанный и доступный регистр. Выражение «обычные разговоры» не несёт ошибочного оттенка «нечестивой» или «скверной» речи. Формулировка «как держаться перед правителями» раскрывает практический смысл еврейской инфинитивной конструкции без излишней официальности.
