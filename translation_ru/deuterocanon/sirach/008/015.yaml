translation:
  language: ru
  text: Не отступай перед насмешником[a], чтобы он не усадил его перед тобой, как подстерегающего в засаде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Вторая часть еврейского текста синтаксически трудна. Буквально: «чтобы усадить его перед тобой, как подстерегающего в засаде». Греческий текст этого стиха отличается: в нём говорится об опасности идти в путь с дерзким, своевольным человеком.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תָּזוּחַ
  choice: Не отступай
  rationale: Глагол передаёт удаление или уступку позиции. «Не отступай» сохраняет пространственный образ и естественно звучит как предостережение.
- source_word: מִפְּנֵי
  choice: перед
  rationale: Предлог буквально указывает на положение «перед лицом» кого-либо; здесь он выражает отступление перед человеком.
- source_word: לֵץ
  choice: насмешник
  rationale: В литературе мудрости это презрительный, склонный к глумлению человек, а не просто шутник. «Насмешник» — понятный современный эквивалент с нужной нравственной окраской.
- source_word: לְהוֹשִׁיבוֹ
  choice: чтобы не усадить его
  rationale: Каузативная форма с местоименным суффиксом буквально означает «посадить/усадить его». Отрицательная цель выводится из запрета первой части; буквальная конструкция сохранена, а её смысловая трудность отмечена в сноске.
- source_word: כְּאוֹרֵב
  choice: словно засевшего в засаде
  rationale: Слово обозначает человека, который скрытно подстерегает жертву. Такая передача сохраняет образ засады и звучит естественно по-русски.
- source_word: לְפָנֶיךָ
  choice: перед собой
  rationale: Буквально «перед тобой». При сохранении второго лица русского повеления возвратная форма «перед собой» яснее связывает выражение с подразумеваемым действующим лицом.
theological_decisions:
- issue: Трудная синтаксическая связь второй части еврейского текста
  choice: Сохранить каузативное значение «усадить его» и образ человека в засаде, не уточняя, кого именно представляет этот образ.
  alternative: Сгладить фразу как «чтобы он не устроил перед тобой засаду» или заменить её греческим предостережением о пути с дерзким человеком.
  rationale: Сохранившийся еврейский текст является первичным свидетельством, хотя его вторая часть синтаксически трудна. Греческий параллельный текст подтверждает общую тему враждебной опасности, но содержит существенно иную формулировку и потому не должен подменять еврейское чтение.
translation_notes:
  register: Современный литературный русский язык с краткой формой наставления, характерной для литературы мудрости. Слово «насмешник» сохраняет нравственную серьёзность контекста; необычный образ второй части намеренно не сглажен полностью.
