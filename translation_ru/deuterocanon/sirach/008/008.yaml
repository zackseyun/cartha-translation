  text: Do not shame an old man[a]; remember that you too will be numbered among the elders.
translation:
  language: ru
  text: Не позорь старика[a]; помни, что и ты будешь причислен к числу стариков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции вместо этого сказано: «Не пренебрегай изречением мудрых и размышляй над их притчами, ибо от них ты научишься наставлению и тому, как служить знатным людям». Еврейское свидетельство здесь сохраняет другое увещание — о почтительном отношении к престарелым.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּבַיֵּשׁ
  choice: Не позорь
  rationale: 'Порода пиэль глагола בוש имеет здесь каузативный смысл: заставлять другого испытывать стыд, бесчестить его. «Не позорь» кратко, естественно и сохраняет нравственную силу запрета.'
- source_word: אֱנוֹשׁ יָשִׁישׁ
  choice: старика
  rationale: Сочетание существительного «человек» с прилагательным, обозначающим преклонный возраст, естественно передаётся по-русски словом «старик». Оно сохраняет мужской род и единственное число еврейского текста.
- source_word: זְכֹר
  choice: помни
  rationale: Прямое соответствие повелительной форме глагола זכר; сохраняет связь запрета с напоминанием о будущем самого адресата.
- source_word: תִמָּנֶה
  choice: будешь причислен
  rationale: Форма нифаль от מנה выражает пассивное значение «быть сочтённым, причисленным». Выбор сохраняет пассив и идею вхождения в определённый круг.
- source_word: מִזְּקֵנִים
  choice: к старейшинам
  rationale: Слово זקנים может обозначать как пожилых людей, так и старейшин. «К старейшинам» сохраняет общественный оттенок и соответствует образу причисления к группе, не сводя смысл лишь к биологическому старению.
theological_decisions:
- issue: Мужской род и единственное число объекта увещания
  choice: «старика»
  alternative: «пожилого человека»
  rationale: Еврейский текст употребляет конкретную форму мужского рода в единственном числе. Перевод сохраняет её, не отрицая общей применимости наставления.
- issue: Расхождение между еврейской и греческой традициями
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; греческий вариант вынесен в сноску.
  alternative: Следовать греческому тексту о речах мудрых и их притчах.
  rationale: При наличии надёжного еврейского текста он служит первичным источником. Греческая версия здесь содержит существенно иное наставление, поэтому смешивать её формулировки с еврейским основным текстом нельзя.
- issue: Значение זקנים
  choice: «старейшинам»
  alternative: «пожилым»
  rationale: Еврейское слово допускает как возрастное, так и общественно-почётное значение. Контекст уважения к старику и оборот «быть причисленным к» позволяют сохранить более ёмкое «старейшинам», не превращая фразу в простое утверждение о старении.
translation_notes:
  register: Современный литературный русский язык; краткая, прямая и достойная форма наставления. Слово «старик» употреблено нейтрально, без разговорно-пренебрежительного оттенка; «старейшины» сохраняет возможный почётный и общественный смысл еврейского זקנים.
