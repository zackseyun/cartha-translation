  text: Do not lend to a man stronger than you; and if you do lend[a], regard it as lost.
translation:
  language: ru
  text: Не давай взаймы человеку, который сильнее тебя; а если всё-таки дал взаймы[a], считай это потерянным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь содержится другое предостережение: «Не вступай в борьбу со вспыльчивым человеком и не проходи с ним через пустыню… где не будет помощи, он повергнет тебя». Сохранившийся еврейский текст вместо этого предостерегает не давать взаймы тому, кто сильнее тебя.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּלְוֶה
  choice: Не давай взаймы
  rationale: Отрицательный императив с глаголом לוה в породе хифиль выражает запрет давать ссуду; современное русское «давать взаймы» ясно и естественно передаёт финансовый смысл.
- source_word: אִישׁ חָזָק מִמְּךָ
  choice: человеку, который сильнее тебя
  rationale: אִישׁ обозначает отдельного человека, а חָזָק מִמְּךָ — того, кто сильнее или влиятельнее адресата. «Человек» сохраняет единственное число, не сужая смысл до физической силы и не создавая в русском ненужного гендерного акцента.
- source_word: וְאִם הִלְוִיתָ
  choice: а если дал
  rationale: Перфект во второй части описывает возможный уже совершённый поступок вопреки предостережению. Противительный оттенок естественно передан союзом «а»; подразумеваемое «взаймы» восстанавливается из первой части.
- source_word: כִּמְאַבֵּד
  choice: считай эти деньги потерянными
  rationale: Краткое еврейское выражение эллиптично и буквально связано с представлением об утрате. В русском явно назван подразумеваемый предмет займа — деньги, чтобы сохранить смысл практического наставления.
theological_decisions:
- issue: Мужской род слова אִישׁ в общем наставлении
  choice: человеку, который сильнее тебя
  alternative: мужчине, который сильнее тебя
  rationale: В данном изречении אִישׁ указывает на лицо, которому дают взаймы, а не противопоставляет мужчину женщине. Русское «человек» естественно сохраняет личное и единственное значение без добавления несущественного гендерного ограничения.
- issue: Расхождение между сохранившимся еврейским текстом и греческим свидетелем
  choice: Основной текст переводит еврейское предостережение о займе
  alternative: Перевести греческое предостережение о вспыльчивом человеке либо объединить оба чтения
  rationale: Доступный еврейский текст имеет высокую уверенность и должен определять основной перевод. Существенно иное греческое чтение нельзя молча смешивать с ним; оно отмечено в сноске как текстовый вариант.
translation_notes:
  register: Современный литературный русский язык с краткой формой наставления. Тон прямой и достойный. Выражение «давать взаймы» общеупотребительно; «считай эти деньги потерянными» естественно раскрывает эллипсис оригинала, не устраняя практической резкости изречения.
