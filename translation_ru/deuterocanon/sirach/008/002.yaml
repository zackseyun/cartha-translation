translation:
  language: ru
  text: Не вступай в спор с тем, кто сильнее тебя, чтобы не попасть в его руки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой версии стих значительно отличается: «Не спорь с богатым человеком, чтобы он не противопоставил тебе свой вес (силу); ведь золото погубило многих и склонило сердца царей».'
    reason: Сохраняется существенное древнее текстовое расхождение между засвидетельствованным еврейским текстом и греческой традицией; «вес (силу)» точнее передаёт греческое ὁλκή.
lexical_decisions:
- source_word: קָשֶׁה מִמְּךָ
  choice: с тем, кто сильнее тебя
  rationale: Кָשֶׁה буквально означает «твёрдый, суровый, сильный». В данном контексте речь идёт о человеке, способном одолеть спорящего; «сильнее тебя» естественно передаёт смысл, не уточняя, в чём именно состоит его превосходство.
- source_word: תָּרִיב
  choice: вступай в спор
  rationale: Глагол ריב охватывает спор, ссору и тяжбу. Формулировка «вступать в спор» сохраняет широту значения и звучит естественно по-русски.
- source_word: תִּפּוֹל בְּיָדוֹ
  choice: попасть в его руки
  rationale: 'Буквально: «пасть в его руку». Русская идиома во множественном числе точно передаёт образ оказаться во власти противника.'
theological_decisions:
- issue: Характер превосходства противника
  choice: 'Оставить его общим: «сильнее тебя»'
  alternative: «суровее тебя», «влиятельнее тебя» или, по греческому тексту, «богатым человеком»
  rationale: Еврейское קָשֶׁה допускает оттенки твёрдости, суровости и силы, но не называет богатство. Перевод не сужает смысл до физической силы, общественного влияния или имущественного положения.
translation_notes:
  register: Современный литературный русский язык; краткая наставительная формулировка сохраняет афористичность еврейского оригинала. «Попасть в его руки» употреблено как естественный русский эквивалент древнееврейского образа власти и поражения.
