  language: ru
  text: Ведь от него ты обретёшь разумение[a], когда понадобится ответить на высказывание.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь существенно иное чтение: «Не поручайся сверх своих сил, а если поручишься, заботься об этом так, словно тебе предстоит заплатить». В основном тексте переведён сохранившийся еврейский текст Каирской генизы, однако это расхождение значительно.'
    reason: textual_variant
lexical_decisions:
- source_word: מִמֶּנּוּ
  choice: от него
  rationale: 'Предлог מִן с местоименным суффиксом естественно обозначает источник: «от него». Мужской род указывает на человека из ближайшего контекста.'
- source_word: תִּקַּח
  choice: обретёшь
  rationale: Буквально глагол означает «возьмёшь», но при שֶׂכֶל передаёт приобретение разумения; «обретёшь» естественно и сохраняет этот смысл.
- source_word: שֶׂכֶל
  choice: разумение
  rationale: Слово обозначает понимание и практическую рассудительность. «Разумение» уместно для литературного текста Премудрости и не сужает значение до одной лишь житейской сметливости.
- source_word: בְּעֵת צֹרֶךְ
  choice: в нужный час
  rationale: Сохраняется временное значение בְּעֵת и идея возникшей необходимости; выражение звучит естественно и достойно по-русски.
- source_word: לְהַשִׁיב
  choice: ответить
  rationale: В сочетании с פִּתְגָּם инфинитив означает дать ответ или отклик.
- source_word: פִּתְגָּם
  choice: изречение
  rationale: Слово может обозначать высказывание, сентенцию или речённое слово. «Изречение» сохраняет связь с литературой мудрости, не делая значение столь узким, как «пословица».
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной интонацией, подходящей книге Премудрости. Синтаксис сделан естественным для русского: целевой оборот «чтобы…» передаёт функцию еврейского לְ, а не устраняет смысловую открытость выражения.'
