    reason: textual_variant
lexical_decisions:
- source_word: אַל תּשָּׁפֵט
  choice: Не судись
  rationale: В сочетании с עִם שׁוֹפֵט глагол от корня שפט обозначает не вынесение суда, а вступление в судебную тяжбу; возвратное «судиться» естественно и кратко передаёт этот смысл по-русски.
- source_word: עִם שׁוֹפֵט
  choice: с судьёй
  rationale: עִם буквально значит «с»; состязательный смысл выражен русским глаголом «судиться», поэтому конструкция остаётся близкой к еврейской и звучит естественно.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание предостережения; «потому что» ясно передаёт причинную связь в современном русском языке.
- source_word: כִּרְצוֹנוֹ
  choice: по своей воле
  rationale: רָצוֹן здесь означает личную волю или усмотрение судьи. Формулировка сохраняет настораживающее указание на его собственную волю, не усиливая его до прямого обвинения в произволе.
- source_word: יִשְׁפֹּט
  choice: рассудит
  rationale: Слово сохраняет судебную рамку и связь с корнем שפט, а в русском контексте естественно обозначает решение дела судьёй.
