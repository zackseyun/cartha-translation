lexical_decisions:
- source_word: אַל תְּרַגִּיל
  choice: Не водись
  rationale: Запрет с формой от רגל предостерегает от привычного, близкого общения. Русское «не водись» естественно и точно передаёт эту мысль, не подразумевая простого знакомства.
- source_word: אִישׁ אֱוִיל
  choice: с глупцом
  rationale: Сочетание буквально означает «с глупым человеком»; «глупец» сохраняет характерную для литературы мудрости нравственную категорию и звучит по-русски естественно.
- source_word: פֶּן
  choice: иначе
  rationale: Передаёт предупреждение о возможном нежелательном последствии в современной и ясной форме.
- source_word: יָבוּז
  choice: он станет презирать
  rationale: Глагол בוז выражает презрение; местоимение сохраняет единственное мужское число, а «станет» естественно связывает последствие с предшествующим общением.
- source_word: לִנְדִיבִים
  choice: знатных
  rationale: נדיבים может обозначать знатных или благородных людей, хотя также связано со щедростью. В данном социальном контексте «знатных» сохраняет вероятный оттенок положения и статуса.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческой параллели
  choice: Основной текст переведён по еврейскому свидетелю; греческое чтение приведено в сноске.
  alternative: «Не бесчести человека в старости его, ведь и некоторые из нас стареют».
  rationale: При наличии еврейского текста Сираха он служит основным источником. Поскольку греческий текст здесь передаёт совершенно иное наставление, различие нельзя сглаживать или скрывать.
translation_notes:
  register: Современный литературный русский язык с краткой формой наставления, свойственной мудростной литературе. Разговорно окрашенное, но не просторечное «не водись» ясно выражает предостережение против постоянного общения.
