translation:
  language: ru
  text: Не вступай в спор с острым на язык человеком и не подкладывай дров в его огонь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст можно приблизительно перевести так: «Не замышляй против человека без достатка, иначе он оценит, сколько ты стоишь, и ты погибнешь». Греческий текст гласит: «Не вступай в спор с острым на язык человеком и не подкладывай дров в его огонь». Поскольку еврейский текст здесь труден, а греческий представляет собой связное изречение, основной текст следует греческому варианту.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּחֲרֹשׁ עַל אִישׁ לֹא הוֹן
  choice: Не вступай в спор с острым на язык человеком
  rationale: Сохранившийся еврейский текст допускает приблизительное понимание «не замышляй против человека без достатка», но выражение трудно и не вполне ясно в контексте. Греческая параллель μὴ διαμάχου μετὰ ἀνθρώπου γλωσσώδους даёт связное предостережение против спора с язвительным или несдержанным в речах человеком; этот смысл принят в основном тексте, а еврейское чтение сохранено в примечании.
- source_word: μὴ ἐπιστοίβαζης ἐπὶ τὸ πῦρ αὐτοῦ ξύλα
  choice: и не подкладывай дров в его огонь
  rationale: Передаёт ясную греческую метафору разжигания ссоры естественным русским выражением, не разъясняя образ сверх текста.
