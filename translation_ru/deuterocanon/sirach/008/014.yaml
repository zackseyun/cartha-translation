  text: Do not prosper in the inheritance of a wicked man[a], lest you be burned by the sparks of his fire.
translation:
  language: ru
  text: Не преуспевай, пользуясь наследством нечестивца[a], чтобы не сгореть от искр его огня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь находится другое изречение: «Не судись с судьёй, потому что судить будут в его пользу, сообразно его положению». Еврейский текст Каирской генизы, напротив, предостерегает от выгоды, связанной с наследством нечестивца.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּצְלַח
  choice: Не преуспевай
  rationale: Прямо передаёт обычное значение глагола צלח — «преуспевать, добиваться успеха» — и сохраняет необычную силу еврейского предостережения.
- source_word: בְּנַחֲלַת
  choice: пользуясь наследством
  rationale: נחלה означает наследство, наследственное владение или имущество. В сочетании с צלח предлог בְּ естественно выражает средство или сферу достижения выгоды; такой перевод понятнее по-русски, чем буквальное «в наследстве».
- source_word: רָשָׁע
  choice: нечестивца
  rationale: Передаёт существительное мужского рода в единственном числе и соответствует достойному регистру литературы мудрости.
- source_word: פֶּן תְּבֹעַר
  choice: чтобы не сгореть
  rationale: Союз פן вводит предостережение о возможном последствии, а בער здесь рисует образ охваченного огнём человека.
- source_word: בִּשְׁבִיב
  choice: от искр
  rationale: שביב обозначает искру, огненную вспышку или пламя. «От искр» сохраняет яркий образ вторичного, но всё же губительного воздействия огня.
- source_word: אִשּׁוֹ
  choice: его огня
  rationale: Местоименный суффикс мужского рода относится к нечестивцу и сохраняет метафору исходящей от него разрушительной опасности.
theological_decisions:
- issue: Расхождение еврейского и греческого текстов
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству Каирской генизы.
  alternative: 'Греческий текст содержит другое изречение: «Не судись с судьёй, потому что судить будут в его пользу, сообразно его положению».'
  rationale: При наличии еврейского текста Сираха ему отдаётся первенство. Греческое чтение существенно отличается и не поддаётся согласованию с еврейским без устранения реального текстуального варианта, поэтому оно вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным тоном наставления. Формулировка «пользуясь наследством» делает синтаксическую связь естественной, не устраняя смысловой напряжённости необычного еврейского выражения.
