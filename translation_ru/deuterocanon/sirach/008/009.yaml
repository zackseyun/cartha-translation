  text: Do not boast over one who is dying[b][a]; remember that all of us are being gathered.
translation:
  language: ru
  text: 'Не злорадствуй над умирающим[b]; помни: все мы будем собраны[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все мы собраны». Это традиционный образ смерти; возможный перевод: «все мы умрём».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая текстовая традиция здесь существенно отличается: в ней говорится о том, чтобы не отвергать речи старцев, учиться у них разумению и уметь дать ответ в нужное время. В основном тексте дано чтение еврейских рукописей Каирской генизы.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְהַלֵּל
  choice: Не злорадствуй
  rationale: Хитпаэль от הלל может означать самовозвышение или торжество. При עַל גֹּוֵעַ естественный русский эквивалент «злорадствовать» ясно передаёт недопустимое торжество над чужой смертью, не сводя смысл к обычной радости.
- source_word: עַל גֹּוֵעַ
  choice: над умирающим
  rationale: עַל указывает на объект торжества, а причастие גֹּוֵעַ обозначает человека, который умирает, а не уже умершего.
- source_word: זְכֹר
  choice: помни
  rationale: Прямой и естественный перевод повелительной формы, сохраняющий нравоучительный тон.
- source_word: כֻּלָּנוּ
  choice: всем нам
  rationale: Сохраняет явно выраженную включённость говорящего и слушателей.
- source_word: נֶאֱסָפִים
  choice: суждено быть собранными
  rationale: Сохраняет метафору собирания как обозначение смерти. Русская конструкция передаёт общую неизбежность, выраженную причастной формой, и не добавляет отсутствующего в тексте места назначения.
theological_decisions:
- issue: Метафорическое обозначение смерти в נֶאֱסָפִים
  choice: 'Сохранить образ: «быть собранными»'
  alternative: «всем нам суждено умереть»
  rationale: Прямое «умереть» яснее, но устраняет традиционную метафору еврейского текста; вариант «быть собранными к своему народу» добавил бы слова, которых здесь нет.
- issue: Расхождение еврейской и греческой традиций
  choice: Следовать засвидетельствованному еврейскому тексту Кааны
  alternative: Перевести греческий текст о наставлениях старцев
  rationale: Предоставленный еврейский источник имеет высокую степень уверенности и является основной исходной базой; существенное расхождение с греческой традицией отмечено в сноске без смешения двух форм текста.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным афористическим звучанием. «Злорадствуй» естественнее буквального «хвались над» и передаёт контекстуальный смысл торжества над гибелью другого. Метафора смерти намеренно сохранена и пояснена в сноске.
