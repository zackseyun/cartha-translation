  source_fidelity: 'Основной текст точно следует сохранившемуся еврейскому: אַל תֵּלֵךְ передано как «Не ходи с», אַכְזָרִי — «жестоким человеком», а предостережение פֶּן תַּכְבִּיד אֶת רָעָתֶךָ — как недопущение того, чтобы собственная беда стала тяжелее. «Ещё тяжелее» уместно выражает каузативное «сделать тяжёлым / утяжелить» и не изменяет смысла. Существенно отличающееся греческое чтение корректно вынесено в сноску.'
