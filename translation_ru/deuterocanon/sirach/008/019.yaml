  text: Do not go with a cruel man[a], lest you add weight to your own trouble.
translation:
  language: ru
  text: Не ходи с жестоким человеком[a], чтобы не сделать свою беду ещё тяжелее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции: «Не открывай своего сердца всякому человеку и не позволяй ему отплатить тебе благосклонностью». Еврейское и греческое свидетельства здесь существенно расходятся.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם אַכְזָרִי
  choice: с жестоким человеком
  rationale: אַכְזָרִי обозначает жестокого, безжалостного человека. Предлог «с» естественно выражает подразумеваемое совместное хождение; форма единственного мужского рода сохранена без превращения высказывания в указание на конкретное лицо.
- source_word: אַל תֵּלֵךְ
  choice: Не ходи
  rationale: Сохранено основное значение глагола הלך — «идти, ходить». В сочетании «ходить с кем-либо» оно также естественно передаёт смысл общения или сопровождения, не усиливая толкование.
- source_word: פֶּן
  choice: чтобы не
  rationale: פֶּן вводит предостережение о нежелательном последствии. Русское «чтобы не» ясно и естественно передаёт эту функцию.
- source_word: תַּכְבִּיד
  choice: сделать … ещё тяжелее
  rationale: Каузативная форма от כבד означает «утяжелить, сделать тяжелее». Перевод сохраняет образ тяжести и звучит естественно по-русски.
- source_word: אֶת רָעָתֶךָ
  choice: свою беду
  rationale: רָעָה может означать зло, вред, бедствие или несчастье. Здесь «беда» передаёт угрожающее адресату последствие; возвратное «свою» точно отражает суффикс второго лица.
theological_decisions:
- issue: Существенное расхождение между сохранившимся еврейским текстом и греческой параллелью в Сир 8:19
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству, а греческое чтение приведено в сноске.
  alternative: 'Греческий текст: «Не открывай своего сердца всякому человеку и не позволяй ему отплатить тебе благосклонностью».'
  rationale: Еврейское свидетельство сохранилось и имеет высокую степень надёжности, поэтому оно положено в основу перевода. Греческая традиция передаёт существенно иной текст, который нельзя свести к стилистическому варианту; сноска сохраняет это текстологическое расхождение, не устраняя его искусственно.
translation_notes:
  register: Современный литературный русский язык; краткое наставление передано прямо и достойно. Оборот «сделать свою беду ещё тяжелее» сохраняет еврейский образ тяжести без неестественной буквальности.
