  text: Do not abandon the discourse of the wise[b][a], and occupy yourself with their riddles.
translation:
  language: ru
  text: Не оставляй речей мудрецов[a] и углубляйся в их загадки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции этот стих имеет существенно иной текст: «Не разжигай углей грешника, чтобы не сгореть тебе в огне его пламени».'
    reason: textual_variant
  - marker: b
    text: 'Еврейский глагол здесь редок и не вполне ясен; возможный перевод: «усердно занимайся их загадками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּטֹּשׁ
  choice: Не оставляй
  rationale: Глагол נטש означает «оставлять, покидать». Выбран прямой и естественный русский эквивалент, сохраняющий силу предостережения.
- source_word: שִׂיחַת חֲכָמִים
  choice: речей мудрецов
  rationale: שיחה может обозначать речь, беседу или рассуждение. Множественное «речей» естественно по-русски передаёт совокупность высказываний мудрецов и не создаёт впечатления, будто речь идёт лишь о присутствии при одной беседе.
- source_word: וּבְחִידֹתֵיהֶם
  choice: в их загадки
  rationale: חידה — загадка, иносказательное или трудное для понимания изречение. Прямое «загадки» сохраняет образность литературы мудрости и не устраняет смысловую широту слова.
- source_word: הִתְרַפֵּשׂ
  choice: углубляйся
  rationale: Редкая возвратная форма выражает деятельную, настойчивую вовлечённость. «Углубляйся» естественно сочетается с загадками и передаёт сосредоточенное проникновение в их смысл, не воспроизводя неясную этимологическую образность буквально.
