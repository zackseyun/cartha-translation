  text: Do not shame a man who turns back from transgression[a]; remember that we all are guilty.
translation:
  language: ru
  text: Не стыди человека, отвернувшегося от преступления[a]; помни, что все мы виновны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Не радуйся о мёртвом; помни, что все мы умрём». Здесь греческое чтение отличается от еврейского в обеих половинах стиха; основной текст следует сохранившемуся еврейскому свидетельству, а греческое чтение приводится как вариант.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּכְלִים
  choice: Не стыди
  rationale: Глагол כלם в породе hифиль означает подвергать стыду, позорить. «Не стыди» кратко и естественно передаёт межличностную направленность запрета.
- source_word: אִישׁ
  choice: человека
  rationale: Хотя еврейское слово имеет мужской род и может означать «мужчина», здесь оно обозначает отдельного человека как объект нравственного наставления; русское «человека» сохраняет единственное число и звучит естественно.
- source_word: שָׁב
  choice: отвернувшегося
  rationale: Причастие от שוב выражает поворот или возвращение. В сочетании с מִן оно указывает на отход от проступка; «отвернувшегося» сохраняет образ движения, не заменяя его специальным богословским термином «покаявшегося».
- source_word: מִפֶּשֶׁע
  choice: от преступления
  rationale: פשע обозначает преступление, нарушение или мятеж. «Преступление» сохраняет серьёзный нравственно-правовой оттенок и подходит к книжному стилю Премудрости.
- source_word: זְכֹר
  choice: помни
  rationale: Прямой и естественный перевод императива.
- source_word: כִּי כֻּלָּנוּ חַיָּבִים
  choice: что все мы виновны
  rationale: חַיָּבִים может означать «виновны», «подлежим ответственности» или «обязаны». «Все мы виновны» естественно по-русски и сохраняет нравственно-судебный смысл еврейского текста, не подменяя его греческой мыслью о смертности.
theological_decisions:
- issue: Расхождение еврейского и греческого свидетельств во всём стихе
  choice: 'Основной текст следует сохранившемуся еврейскому чтению: «Не стыди человека, отвернувшегося от преступления… все мы виновны»'
  alternative: 'Греческий параллельный текст: «Не радуйся о мёртвом; помни, что все мы умрём»'
  rationale: Сохранившийся еврейский текст имеет первенство для основного перевода Сираха. Греческое чтение существенно отличается в обеих половинах стиха и потому приводится в примечании как значимое альтернативное свидетельство, а не смешивается с еврейским текстом.
- issue: Передача языка обращения от проступка
  choice: отвернувшегося от преступления
  alternative: покаявшегося в грехе
  rationale: Еврейский текст описывает поворот прочь от нарушения, не употребляя отдельного технического термина покаяния. Выбранная формулировка сохраняет этот образ и не вносит более позднюю богословскую терминологию.
- issue: Смысл חַיָּבִים
  choice: виновны
  alternative: подлежим ответственности; должны умереть
  rationale: Еврейское слово допускает оттенки виновности и ответственности. Перевод «виновны» соответствует ближайшему нравственному контексту, тогда как «должны умереть» отражало бы греческую параллель и неоправданно разрешало бы неоднозначность еврейского свидетельства.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным афористическим строем. «Не стыди» понятно широкому читателю; «отвернувшегося от преступления» сохраняет образ еврейского глагола и избегает конфессионально нагруженной терминологии.
