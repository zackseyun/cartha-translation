translation:
  language: ru
  text: Не вступай в спор со злоязычным человеком[b] и не подкладывай дров в огонь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое свидетельство гласит: «Не укоряй человека, который отвращается от греха; помни, что все мы заслуживаем наказания». Сохранившийся еврейский текст вместо этого предостерегает от спора с человеком, опасным в речи, и от разжигания конфликта.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «с человеком языка» — то есть с человеком, чья речь причиняет вред или разжигает распри.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּינָץ
  choice: Не вступай в спор
  rationale: Запрет с глаголом, обозначающим спор или распрю. Эта формулировка естественна в современном русском и передаёт предостережение не ввязываться в конфликт.
- source_word: עִם
  choice: с
  rationale: Предлог обозначает другую сторону спора; русское «с» здесь наиболее естественно.
- source_word: אִישׁ לָשׁוֹן
  choice: человеком злоязычным
  rationale: Буквально «человеком языка» — древнееврейское обозначение человека, чья речь вредоносна или склонна разжигать распри. «Злоязычный» сохраняет связь с языком и ясно передаёт отрицательный смысл, не сужая его только до клеветы или многословия.
- source_word: וְאַל תִּתֵּן עַל אֵשׁ עֵץ
  choice: и не подкладывай дров в огонь
  rationale: Буквально говорится о помещении дерева на огонь. Русское «подкладывать дров в огонь» сохраняет конкретный образ и естественно выражает усиление конфликта.
theological_decisions:
- issue: Расхождение еврейского и греческого текстов
  choice: 'В основном тексте переведено сохранившееся еврейское чтение: предостережение от спора со злоязычным человеком и от разжигания конфликта.'
  alternative: 'Греческий текст: «Не укоряй человека, который отвращается от греха; помни, что все мы подлежим взысканию».'
  rationale: Еврейский текст здесь сохранён с высокой уверенностью и представляет цельное двучленное изречение, в котором образ дров и огня поясняет опасность разжигания словесной распри. Греческое свидетельство существенно отличается и потому приведено в сноске, но не подменяет основной еврейский текст.
translation_notes:
  register: Современный литературный русский, краткий и достойный тон наставления. «Злоязычный» понятно обычному читателю и сохраняет языковой образ оригинала; фраза «подкладывать дров в огонь» естественна и поддерживает параллелизм стиха.
