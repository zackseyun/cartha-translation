  text: Do not pledge yourself for one stronger than you; and if you have pledged yourself[a], act as one who must pay.
translation:
  language: ru
  text: Не ручайся сверх своих возможностей[a]; если же поручился, считай, что платить придётся тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «более, чем ты»; возможен также смысл: «за того, кто выше тебя». Греческий текст здесь читается иначе: «Не советуйся с глупцом, потому что он не сможет сохранить тайну».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעֲרֹב
  choice: Не поручайся
  rationale: Глагол ערב здесь обозначает принятие на себя поручительства за чужое обязательство. «Не поручайся» — естественная и точная формулировка на современном русском языке.
- source_word: יָתֵר מִמְּךָ
  choice: за того, кто сильнее тебя
  rationale: יתר допускает значения превосходства, избыточности или более высокого положения. В контексте поручительства речь идёт о человеке, чьи возможности или обязательства превосходят возможности поручителя; формулировка сохраняет образ исходного текста, а примечание разъясняет диапазон смысла.
- source_word: וְאִם עָרַבְתָּ
  choice: а если поручился
  rationale: Повторяется тот же корень ערב, поэтому в переводе последовательно сохранён юридико-финансовый термин «поручиться».
- source_word: כִּמְשַׁלֵּם
  choice: будь готов заплатить
  rationale: 'Форма с כ представляет поручившегося как плательщика. По-русски «будь готов заплатить» естественно передаёт практический смысл: поручитель должен считать себя обязанным к выплате, не утверждая, что платёж уже совершён.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая форма наставления сохранена. Юридико-финансовое «поручаться» понятно широкому читателю и передаёт повтор еврейского корня. Подлинная многозначность יָתֵר מִמְּךָ и существенно отличающееся греческое чтение отражены в сноске.
