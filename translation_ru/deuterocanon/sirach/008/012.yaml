translation:
  language: ru
  text: Не пренебрегай тем, что говорят вернувшиеся[a], слышавшие от своих отцов.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто обращается (кается)»; еврейское слово обозначает возвращающихся, но его точный оттенок здесь неясен.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческой традиции здесь сказано: «Не давай взаймы человеку, который сильнее тебя; а если дашь, считай это потерянным». По-видимому, это иная текстовая традиция данного стиха.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּמְאַס
  choice: Не пренебрегай
  rationale: Передаёт прямой запрет и оттенок презрительного отвержения, оставаясь естественным для современной русской наставительной речи.
- source_word: בִּשְׁמִיעַת
  choice: рассказами
  rationale: Буквально слово связано со слушанием или услышанным. В данном синтаксическом контексте «рассказами» естественно передаёт то, что слушают и что эти люди прежде услышали от отцов; буквальное «слушанием» по-русски звучало бы неестественно.
- source_word: שָׁבִים
  choice: тех, кто вернулся
  rationale: Сохраняет основное значение причастия от глагола «возвращаться», не сводя его без достаточных оснований только к покаянию или к возвращению из плена.
- source_word: אֲשֶׁר שָׁמְעוּ
  choice: и слышал их
  rationale: Относительное предложение описывает тех же людей. Единственное число сказуемого в русском согласовано с конструкцией «тех, кто»; местоимение «их» проясняет подразумеваемый предмет услышанного.
- source_word: מֵאֲבֹתָם
  choice: от своих отцов
  rationale: Сохраняет конкретное древнееврейское обозначение отцов как носителей передаваемого знания, не заменяя его более общим словом «предки».
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческой традиции Сир 8:12
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству.
  alternative: 'Греческая традиция содержит иное изречение: «Не давай взаймы человеку, который сильнее тебя; а если дашь, считай это потерянным».'
  rationale: Греческая строка представляет не малый вариант, а другую текстовую традицию. Поэтому она отмечена в сноске, но не смешана с основным еврейским чтением.
- issue: Возможный смысл שָׁבִים
  choice: «тех, кто вернулся»
  alternative: «тех, кто обращается (кается)» или «вернувшихся» в более специальном смысле
  rationale: Контекст не позволяет уверенно определить характер возвращения. Перевод сохраняет широкое пространственное значение, а возможный религиозно-нравственный оттенок указан в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой наставительной интонацией. Оборот «рассказы тех, кто…» выбран вместо формально близкого, но неестественного «слушание возвращающихся»; он также связывает услышанное от отцов с передаваемым рассказом.
