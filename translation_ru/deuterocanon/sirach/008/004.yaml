  text: For many has gold ruined[b][a], and it leads astray the heart of nobles.
translation:
  language: ru
  text: Ведь многих погубило золото, и оно сбивает с пути сердце знатных[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь существенно иное чтение: «Не насмехайся над необразованным человеком, чтобы не были обесчещены твои предки».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «щедрых». Еврейское слово может обозначать знатных, князей или щедрых людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: многих
  rationale: Субстантивированное прилагательное обозначает множество людей; винительный падеж передаёт его роль прямого дополнения при переходном глаголе.
- source_word: הִפְחִיז
  choice: погубило
  rationale: Редкий и трудный глагол выражает причинение безрассудства или разрушительной нравственной неустойчивости. «Погубило» естественно передаёт итог этого воздействия, не дублируя буквально вторую половину стиха.
- source_word: זָהָב
  choice: золото
  rationale: Прямое и стилистически естественное соответствие еврейскому слову.
- source_word: יַשְׂגֶּה
  choice: сбивает с пути
  rationale: Каузативное значение глагола связано с заблуждением и уклонением с верного пути; выражение сохраняет нравственный образ оригинала.
- source_word: לֵב
  choice: сердце
  rationale: Сохраняет еврейский антропологический образ сердца как средоточия мыслей, желаний и решений.
- source_word: נְדִיבִים
  choice: знатных
  rationale: Слово может обозначать знатных или князей, а также щедрых людей. В контексте золота социальное значение уместно в основном тексте, тогда как иной оттенок отмечен в сноске.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающимся греческим чтением
  choice: Основной текст следует еврейскому чтению о золоте, губящем многих и сбивающем с пути сердце знатных.
  alternative: 'Греческий текст: «Не насмехайся над необразованным человеком, чтобы не были обесчещены твои предки».'
  rationale: Для Книги Премудрости Иисуса, сына Сирахова, сохранившийся еврейский текст имеет приоритет. Греческое чтение представляет собой не малое разночтение, а совершенно другую строку, поэтому оно приводится в сноске без смешения с основным текстом.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным стилем изречения мудрости. Инверсия «многих погубило золото» сохраняет смысловой акцент еврейского текста и остаётся естественной по-русски.
