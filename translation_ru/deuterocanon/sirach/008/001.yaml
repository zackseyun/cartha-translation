translation:
  language: ru
  text: Не вступай в спор с могущественным человеком, чтобы не оказаться в его руках.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально еврейский текст можно понять так: «зачем тебе быть отданным в его руку?» Греческая параллель поддерживает более плавный смысл: «чтобы не попасть в его руки».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרִיב
  choice: Не вступай в спор
  rationale: Глагол ריב обозначает спор, тяжбу или открытое противостояние. Такая передача естественна по-русски и выражает предостережение не ввязываться в конфликт.
- source_word: עִם אִישׁ גָּדוֹל
  choice: с могущественным человеком
  rationale: Хотя גָּדוֹל буквально означает «большой, великий», в данном контексте речь идёт о влиятельности и власти; это подтверждает греческое δυνάστης. «Могущественный человек» не предполагает нравственного величия.
- source_word: לָמָּה תִשּׁוֹם עַל יָדוֹ
  choice: чтобы не оказаться в его руках
  rationale: 'Сохранившийся еврейский текст буквально труден: «зачем тебе быть помещённым в его руку?». Греческая параллель ясно передаёт предостережение: «как бы не попасть в его руки». Русское выражение передаёт вероятный смысл естественно, не скрывая текстуальную особенность, отмеченную в сноске.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткое, назидательное предостережение передано ясно и достойно. «Вступай в спор» охватывает как словесный конфликт, так и более серьёзное противостояние; местоимение «его» сохраняет мужской референт исходного текста.
