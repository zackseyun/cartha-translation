translation:
  language: ru
  text: 10 Тот, о ком написано, что он предназначен к установленному сроку[a], чтобы отвратить гнев, прежде чем разгорится гнев Божий, обратить сердца отцов к сыновьям[b] и восстановить колена Израиля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало стиха в еврейском тексте трудно и буквально допускает понимание: «написанный, приготовленный для времени». В греческом: «записанный для обличений в назначенные времена».'
    reason: Сохраняет подлинную лексическую и текстовую неопределённость начальной фразы.
  - marker: b
    text: В еврейском тексте — «отцов… к сыновьям (или детям)» во множественном числе; в греческом — «сердце отца к сыну» в единственном.
    reason: Отмечает числовое расхождение между еврейским и греческим свидетелями.
  - marker: c
    text: В греческом тексте — «колена Иакова»; в еврейском — «колена Израиля».
    reason: Отмечает текстовый вариант в именовании народа.
lexical_decisions:
- source_word: הכתוב נכון לעת
  choice: о ком написано, что он предназначен для назначенного времени
  rationale: Сохраняет явное значение הכתוב («написано») и передаёт נכון как предназначение к определённому времени, не устраняя трудность еврейской формулировки.
- source_word: להשבית אף לפני חרון אל
  choice: утишить гнев прежде, чем воспылает ярость Божья
  rationale: להשבית означает заставить прекратиться или утихнуть; חרון אל прямо называет пламенный гнев Бога. Глагольная формулировка естественно передаёт образ разгорающейся ярости.
- source_word: להשיב לב אבות על בנים
  choice: обратить сердца отцов к сыновьям
  rationale: Следует сохранившемуся еврейскому множественному числу и удерживает пророческую идиому «обратить сердце», не сводя её к истолковывающему «примирить».
- source_word: ולהכין שבטי ישראל
  choice: восстановить колена Израиля
  rationale: להכין может означать устроить, утвердить или привести в должное состояние; в контексте пророческого обновления «восстановить» передаёт смысл естественно. «Израиля» следует еврейскому тексту.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и греческого параллельного чтения
  choice: Основной текст следует еврейскому свидетельству, а греческое используется для проверки и отмечается там, где чтения расходятся.
  alternative: 'Строить основной текст преимущественно по греческому: «записанный для обличений в назначенные времена».'
  rationale: Еврейский текст данного стиха сохранился с высокой уверенностью, хотя начало трудно; поэтому его конкретные элементы не следует молча заменять более кратким или отличным греческим чтением.
- issue: Пророческая формула об обращении сердец
  choice: Сохранить выражение «обратить сердца отцов к сыновьям».
  alternative: «Примирить отцов с детьми».
  rationale: Буквальная идиома сохраняет связь с пророческой традицией и не навязывает тексту исчерпывающее социальное толкование.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Формула «ярость Божья» сохраняет явное אל еврейского текста; «колена» употреблено как укоренившийся библейский термин.
