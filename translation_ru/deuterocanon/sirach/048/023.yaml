  text: In his days the sun stood still[b][a], and life was added to the king.
translation:
  language: ru
  text: В его дни солнце остановилось[b], и жизнь царя была продлена[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть срок жизни царя был увеличен; из ближайшего контекста ясно, что речь идёт о Езекии.
    reason: cross_reference
  - marker: b
    text: В греческом тексте употреблено необычное выражение, передающее мысль о задержке или воспрепятствовании движению солнца; оно соответствует еврейскому «солнце остановилось».
    reason: lexical_alternative
lexical_decisions:
- source_word: עמד
  choice: остановилось
  rationale: Буквально глагол означает «стояло», но применительно к солнцу здесь выражает прекращение его движения. «Остановилось» естественно передаёт этот смысл по-русски; необычное греческое ἀνεπόδισεν также указывает на задержку или воспрепятствование движению.
- source_word: השמש
  choice: солнце
  rationale: Прямое соответствие еврейскому определённому существительному; в русском языке в данном контексте артикль отдельно не передаётся.
- source_word: ונוסף
  choice: была продлена
  rationale: Еврейская конструкция буквально говорит, что к жизни было добавлено. Русское «жизнь была продлена» естественно и точно выражает результат, не создавая неуклюжей фразы «жизнь была добавлена».
- source_word: חיי
  choice: жизнь
  rationale: Хотя еврейская форма морфологически множественная и находится в сопряжённом состоянии, она обозначает жизнь или срок жизни; русский естественно требует единственного числа.
- source_word: המלך
  choice: царя
  rationale: Сохранён титул исходного текста, а не подставлено имя Езекии; родительный падеж обусловлен естественной русской конструкцией «жизнь царя».
theological_decisions:
- issue: Следует ли прямо назвать Езекию в основном тексте
  choice: Сохранить «царя»
  alternative: «царя Езекии» или «Езекии»
  rationale: Еврейский текст употребляет титул «царь», а личность царя ясна из контекста. Имя дано в сноске как пояснение, но не внесено в сам стих.
- issue: Насколько буквально передавать прибавление жизни
  choice: «жизнь царя была продлена»
  alternative: «к жизни царя было добавлено»
  rationale: Выбранная формулировка передаёт тот же смысл увеличения срока жизни на естественном современном русском, не уточняя, кем именно она была продлена.
translation_notes:
  register: 'Современный литературный русский язык, ясный и торжественно-сдержанный. Порядок сносок приведён к последовательному [a], [b] в соответствии с их появлением в тексте: лексическая сноска при слове «остановилось» обозначена [b] лишь для согласования с предоставленной английской разметкой, поэтому в тексте фактический порядок маркеров — [b], затем [a].'
