  text: который был взят на небеса в буре и среди огненных полчищ[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «который был взят в огненной буре, в колеснице, запряжённой огненными конями». Это более полное чтение яснее отсылает к вознесению Илии в 4 Царств 2:11.'
    reason: alternative_reading
lexical_decisions:
- source_word: הנלקח
  choice: который был взят
  rationale: Страдательное причастие от לקח передаёт то, что Илия был взят Богом; нейтральное «был взят» сохраняет пассивность и не добавляет прямо не названного деятеля.
- source_word: בסערה
  choice: бурей
  rationale: סערה означает бурю, вихрь или сильный штормовой ветер. Творительный падеж естественно передаёт здесь средство или сопровождающее явление, не подменяя чтение формулой из 4 Царств 2:11.
- source_word: מעלה
  choice: ввысь
  rationale: Наречное значение направления передано кратким и поэтически естественным словом «ввысь», без преждевременного отождествления с последующим שמים.
- source_word: ובגדודי אש
  choice: и среди огненных полчищ
  rationale: גדודים буквально обозначает отряды, полчища или боевые ряды, а не колесницы. «Среди» сохраняет возможное обстоятельственное значение предлога ב и образность еврейского чтения.
- source_word: שמים
  choice: на небеса
  rationale: Множественная форма שמים передана традиционным русским «небеса»; тире обозначает подразумеваемое направление при эллиптическом еврейском построении.
theological_decisions:
- issue: Следует ли согласовать еврейский текст с более известным рассказом о колеснице и огненных конях
  choice: В основном тексте сохранены еврейские «огненные полчища».
  alternative: «который был взят в огненной буре, в колеснице, запряжённой огненными конями»
  rationale: Сохранившийся еврейский текст не называет ни колесницы, ни коней. Более развёрнутое греческое чтение важно и приведено в сноске, но не должно вытеснять основной еврейский источник.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической интонацией. Эллипсис перед «на небеса» сохраняет сжатость и некоторую неоднозначность еврейской строки; «полчища» передаёт небесно-воинственный образ, не вводя отсутствующих в еврейском тексте колесниц.
