lexical_decisions:
- source_word: ברוח גבורה
  choice: В духе могущества
  rationale: Предлог ב допускает значение сферы или средства, а גבורה означает силу, мощь, могущество. Формулировка сохраняет пророческий оттенок и не уточняет без достаточных оснований, идёт ли речь о внутреннем состоянии или о действии духа.
- source_word: חזה
  choice: увидел
  rationale: Глагол обозначает видение, нередко пророческое; прямое «увидел» позволяет контексту передать этот оттенок без поясняющего пересказа.
- source_word: אחרית
  choice: конец
  rationale: Слово может означать конец, исход или грядущее. «Конец» близко еврейскому тексту и согласуется с греческим τὰ ἔσχατα, не снимая эсхатологической неоднозначности.
- source_word: וינחם
  choice: и утешил
  rationale: Порода пиэль от נחם здесь имеет значение утешения; русский глагол естественен и точно передаёт смысл.
- source_word: אבלי ציון
  choice: скорбящих о Сионе
  rationale: Еврейская конструкция может обозначать скорбящих о Сионе или принадлежащих Сиону скорбящих. Основной текст передаёт наиболее естественное понимание конструкции, а греческий локативный вариант отмечен в сноске.
theological_decisions:
- issue: Характер пророческого вдохновения в выражении ברוח גבורה
  choice: В духе могущества
  alternative: В великом духе
  rationale: Основной текст следует высоконадёжному еврейскому чтению, не отождествляя «дух» прямо со Святым Духом и не вводя конфессионального толкования. Греческое чтение сохраняется в примечании.
- issue: Значение אחרית
  choice: конец
  alternative: грядущее / последние события
  rationale: Буквальная формулировка сохраняет возможный эсхатологический смысл, но не навязывает его как единственно допустимый.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным библейским звучанием. Сохранены образность, синтаксическая компактность и неоднозначность исходного текста; архаизмы и конфессионально нагруженные уточнения исключены.
