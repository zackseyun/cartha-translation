lexical_decisions:
- source_word: המקים
  choice: воскресивший
  rationale: Причастие породы hифиль от קום означает здесь возвращение умершего к жизни. «Воскресивший» естественно и ясно передаёт действие Илии, не меняя его агентивного характера.
- source_word: גוע
  choice: умершего
  rationale: Слово обозначает того, кто испустил дух, то есть умер. «Умершего» точнее и благозвучнее в поэтической похвале, чем предметно-физическое «труп».
- source_word: ממות
  choice: из смерти
  rationale: Сохранено прямое разделительное значение предлога מן и краткий поэтический образ еврейского текста.
- source_word: ומשאול
  choice: и из Шеола
  rationale: Транслитерация сохраняет древнееврейское представление о царстве мёртвых и не сужает значение до одной лишь могилы.
- source_word: כרצון יהוה
  choice: по воле Господа
  rationale: Основной еврейский свидетель буквально указывает на волю YHWH. Русское «по воле» естественно передаёт כרצון, а יהוה передано традиционным благоговейным именованием «Господь».
theological_decisions:
- issue: Формула божественного действия в конце стиха
  choice: по воле Господа
  alternative: словом Всевышнего
  rationale: В основном еврейском свидетельстве стоит כרצון יהוה («по воле Господа»), тогда как греческий параллельный текст читает ἐν λόγῳ Ὑψίστου («словом Всевышнего»). Основной текст следует еврейскому источнику, а значимое различие открыто отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным ритмом поэтической похвалы. Оборот «из смерти и из Шеола» намеренно сохраняет образность и параллелизм еврейского текста.
