translation:
  language: ru
  text: Тогда восстал пророк, подобный огню[a], и слова его были словно пылающая печь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «И восстал пророк Илия, подобный огню». В еврейском тексте имя не названо, хотя из контекста ясно, что речь идёт об Илии.'
    reason: alternative_reading
  - marker: b
