    reason: textual_variant
lexical_decisions:
- source_word: עד אשר
  choice: Тогда
  rationale: Оборот служит переходом к следующему этапу повествования; «тогда» естественно передаёт последовательность событий, не навязывая строгого значения временного предела.
- source_word: קם
  choice: восстал
  rationale: Передаёт появление выдающегося пророка и сохраняет возвышенный библейский регистр; соответствует также греческому ἀνέστη.
- source_word: נביא
  choice: пророк
  rationale: В еврейском тексте имя не названо. Русская конструкция без артикля естественно сохраняет это, а контекст указывает на Илию.
- source_word: כאש
  choice: подобный огню
  rationale: Ясная и выразительная передача сравнения, общего для еврейского и греческого свидетельств.
- source_word: ודבריו
  choice: и слова его
  rationale: Сохраняет явно выраженное в еврейском тексте множественное число, несмотря на единственное число в греческом параллельном тексте.
- source_word: כתנור בוער
  choice: были словно пылающая печь
  rationale: Сохраняет еврейский образ печи и значение בוער. «Пылающая» звучит естественно и поэтически, не ослабляя образ до бытового.
theological_decisions:
- issue: Следует ли прямо назвать пророка Илиёй
  choice: Не добавлять имя в основной текст; следовать еврейскому чтению «пророк».
  alternative: «Тогда восстал пророк Илия, подобный огню».
  rationale: Основное еврейское свидетельство не содержит имени, хотя греческий текст прямо называет Илию и контекст несомненно говорит о нём. Разночтение сохранено в примечании.
- issue: Следует ли согласовать вторую строку с греческим образом факела
  choice: 'Сохранить еврейское чтение: множественное число «слова» и образ пылающей печи.'
  alternative: «И слово его горело, словно факел».
  rationale: Еврейский текст здесь доступен и первичен для перевода; греческий вариант существенно отличается по числу, синтаксису и образу, поэтому отмечен отдельно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краткий и образный; подлинные различия между еврейским и греческим свидетельствами вынесены в примечания без гармонизации.
