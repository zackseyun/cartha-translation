translation:
  language: ru
  text: Он лишил их хлебного запаса[a] и в своём рвении сделал их малочисленными.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посох хлеба» — образное выражение, означающее запас пищи или снабжение ею; греческий параллельный текст передаёт этот смысл словами: «он навёл на них голод».'
    reason: Пояснение еврейской идиомы и значимого варианта греческого параллельного текста.
lexical_decisions:
- source_word: וישבר
  choice: сокрушил
  rationale: Глагол שבר означает «сломать, сокрушить». В сочетании с образным выражением «опора хлеба» вариант «сокрушил» сохраняет конкретную метафору и звучит естественно в возвышенной повествовательной речи.
- source_word: מטה לחם
  choice: опору хлеба
  rationale: Буквально «посох хлеба»; это библейская идиома, обозначающая то, чем поддерживается жизнь, то есть запас или снабжение пищей. «Опора хлеба» сохраняет образ и остается понятнее буквального «посох хлеба»; греческое λιμόν подтверждает значение голода.
- source_word: ובקנאתו
  choice: и в своей ревности
  rationale: קנאה может означать ревность или рвение. Здесь речь об ardent, непримиримой преданности Илии Божьему делу; «ревность» сохраняет традиционный библейский смысл и присущую слову напряженность, не сводя его лишь к усердию.
- source_word: המעיטם
  choice: сделал их малочисленными
  rationale: Порода hифиль глагола מעט имеет результативное значение «сделать малым или немногочисленным, уменьшить числом». Формулировка сохраняет это значение и соответствие греческому ὠλιγοποίησεν, не уточняя сверх текста, произошло ли это через смерть, убыль или иное бедствие.
- source_word: λιμόν
  choice: голод
  rationale: Греческий параллельный текст прямо передает образ «опоры хлеба» словом «голод», подтверждая идиоматический смысл еврейской фразы; это отражено в сноске, а не подменяет основной еврейский образ.
theological_decisions:
- issue: Передавать ли מטה לחם буквально или раскрывать как голод
  choice: Сохранить в основном тексте еврейский образ «опора хлеба», пояснив его в сноске.
  alternative: «Он навёл на них голод» или «Он лишил их хлеба».
  rationale: Первичен хорошо засвидетельствованный еврейский текст. Греческий параллельный перевод надежно удостоверяет смысл идиомы, но не требует заменять еврейский образ истолкованием.
- issue: Как передать קנאה применительно к Илии
  choice: «ревность»
  alternative: «рвение»
  rationale: «Ревность» в современном литературном русском может обозначать горячую, непримиримую преданность делу и сохраняет богословскую напряженность исходного слова; контекст исключает обычное значение личной зависти.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Еврейская метафора сохранена без неестественного буквального «посох хлеба»; результативное «сделал их малочисленными» намеренно сохраняет неоднозначность способа уменьшения их числа.
