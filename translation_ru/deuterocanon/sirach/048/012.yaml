  text: Elijah was hidden in the storehouse[a], and Elisha was filled with his spirit. Twice as many signs, and many wonders[b], came from his mouth.
translation:
  language: ru
  text: Илия был сокрыт в сокровищнице[a], а Елисей исполнился его духа. Из уст его исходили и вдвое больше знамений, и множество чудес[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Илия, который был сокрыт вихрем». В еврейском свидетельстве: «Илия был сокрыт в сокровищнице».'
    reason: textual_variant
  - marker: b
    text: Еврейская фраза сжата и буквально указывает на двойную меру знамений; вероятно, это перекликается с двойной долей, которой просил Елисей.
    reason: lexical_alternative
lexical_decisions:
- source_word: שבאוצר נסתר
  choice: был сокрыт в сокровищнице
  rationale: 'Следуем сохранившемуся еврейскому тексту: אוצר буквально означает «сокровищница, хранилище». Несколько загадочный образ сохранён, а существенно отличающееся греческое чтение вынесено в сноску.'
- source_word: ונמלא רוחו אלישע
  choice: Елисей исполнился его духа
  rationale: Суффикс «его» естественнее всего относится к Илии; строчная буква не навязывает более определённого богословского истолкования.
- source_word: פי שנים
  choice: вдвое больше
  rationale: Эллиптическое выражение буквально указывает на двойную меру и, вероятно, перекликается с просьбой Елисея о двойной доле; перевод сохраняет эту связь, не превращая оборот в явно выраженное действие.
- source_word: אותות הרבה
  choice: знамений
  rationale: אותות передано традиционным библейским словом «знамения», отличающим его от следующего מופתים.
- source_word: ומופתים
  choice: множество чудес
  rationale: מופתים естественно передаётся как «чудеса» в устойчивом сочетании со знамениями; הרבה учтено как указание на многочисленность, хотя синтаксис еврейской строки сжат.
- source_word: כל מוצא פיהו
  choice: исходило из уст его
  rationale: Сохранён исходный образ того, что выходит из уст, то есть произнесённого слова; согласование во множественном смысловом ряду делает фразу естественной по-русски.
theological_decisions:
- issue: Расхождение еврейского и греческого текста в первой части стиха
  choice: 'В основном тексте: «Илия был сокрыт в сокровищнице»'
  alternative: 'По-гречески: «Илия, который был сокрыт вихрем»'
  rationale: При наличии еврейского свидетельства основной текст следует ему. Древнее и связное греческое чтение существенно отличается и потому сохраняется в сноске.
- issue: К кому относится выражение «его духа»
  choice: К духу Илии
  alternative: Более явное указание на Божьего Духа
  rationale: И еврейский суффикс, и греческое αὐτοῦ естественно указывают на Илию как ближайший антецедент. Написание со строчной буквы сохраняет формулировку источника без усиления её богословской определённости.
- issue: Смысл פי שנים
  choice: Двойная мера знамений
  alternative: «Он удвоил» либо «двойная доля»
  rationale: Фраза эллиптична. «Вдвое больше» передаёт количественный смысл и вероятный отголосок двойной доли Елисея, не добавляя отсутствующего в тексте прямого дополнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формы «сокрыт», «исполнился» и «из уст его» сохраняют достоинство и образность оригинала, оставаясь понятными современному читателю.
