translation:
  language: ru
  text: И воззвали они к Богу Всевышнему[a], и простёрли к Нему руки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте далее сказано: «и Святой с небес быстро услышал их и избавил их через Исаию».'
    reason: alternative_reading
lexical_decisions:
- source_word: ויקראו
  choice: воззвали
  rationale: Глагол קרא с направлением к Богу означает обращение к Нему в молитве. «Воззвали» естественно передаёт молитвенный призыв и несколько возвышенный тон контекста, не усиливая его до прямого указания на крик.
- source_word: אל אל עליון
  choice: к Богу Всевышнему
  rationale: Первое אל является предлогом «к», второе — обозначением Бога, а עליון — титулом «Всевышний». Русская конструкция с согласованным приложением компактно и ясно передаёт еврейское выражение.
- source_word: ויפרשו
  choice: простёрли
  rationale: פרש здесь обозначает простирание рук в молитве. «Простёрли» точно передаёт жест и соответствует dignified литературному регистру.
- source_word: כפים
  choice: руки
  rationale: Хотя כפים буквально может означать «ладони», в русском языке молитвенный жест естественно описывается словом «руки».
- source_word: אליו
  choice: к Нему
  rationale: Предлог выражает направленность молитвенного жеста к Богу; «к Нему» точно и естественно передаёт эту связь.
theological_decisions:
- issue: Соотношение краткого еврейского текста и более пространного греческого параллельного чтения
  choice: В основном тексте переведено только засвидетельствованное еврейское предложение.
  alternative: 'Добавить из греческого: «и Святой с небес скоро услышал их и избавил их рукой Исаии».'
  rationale: При наличии надёжного еврейского свидетеля он служит основой перевода. Продолжение греческого текста представляет важное текстовое различие, поэтому сохранено в примечании, но не внесено без обозначения в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Формы «воззвали» и «простёрли» сохраняют молитвенную торжественность, оставаясь понятными современному читателю.
