base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/015.yaml
  text: Yet for all this the people did not turn back[a], and they did not cease from their sins[c][b], until they were uprooted from their land and were scattered throughout the earth.
translation:
  language: ru
  text: Но, несмотря на всё это, народ не обратился[a] и не перестал грешить[c], пока не был исторгнут из своей земли и рассеян по всей земле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не раскаялся». Буквально еврейский текст говорит, что народ «не вернулся», а в греческом тексте прямо употреблён глагол со значением «раскаяться».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по всем странам». Еврейское выражение может обозначать широкое рассеяние по многим землям.'
    reason: alternative_reading
  - marker: c
    text: 'Греческий текст далее добавляет: «и народа осталось совсем мало, и правитель из дома Давида». В сохранившемся еврейском тексте этих слов нет, поэтому они не включены в основной перевод.'
    reason: textual_variant
lexical_decisions:
- source_word: בכל זאת
  choice: Но, несмотря на всё это
  rationale: Передаёт уступительно-противительный смысл выражения и естественно связывает стих с предшествующим контекстом.
- source_word: לא שב
  choice: не обратился
  rationale: Глагол שוב буквально выражает поворот или возвращение, а здесь — нравственное обращение. Русское «обратился» сохраняет образ перемены направления и религиозный смысл, подтверждаемый греческим μετενόησεν.
- source_word: העם
  choice: народ
  rationale: Обычное и естественное соответствие коллективному עם в данном контексте.
- source_word: ולא חדלו מחטאתם
  choice: и не перестал грешить
  rationale: Идиоматично передаёт непрекращающееся пребывание в грехах. Единственное число согласовано с собирательным существительным «народ», тогда как исходный текст допускает переход к множественному согласованию по смыслу.
- source_word: עד אשר נסחו מארצם
  choice: пока не был исторгнут из своей земли
  rationale: «Исторгнут» передаёт насильственное удаление и образ искоренения, выраженный редким глаголом נסח, сохраняя торжественный, но понятный регистр.
- source_word: ויפוצו בכל הארץ
  choice: и рассеян по всей земле
  rationale: Передаёт широкое рассеяние за пределами родной земли. ארץ может означать как землю вообще, так и множество стран; существенная альтернатива отмечена в сноске.
theological_decisions:
- issue: Значение לא שב в сопоставлении с греческим μετενόησεν
  choice: не обратился
  alternative: не раскаялся; не вернулся
  rationale: Еврейский текст первичен и сохраняет образ поворота, тогда как греческий текст ясно указывает на покаяние. «Не обратился» удерживает оба смысловых аспекта, не сводя выражение ни к пространственному возвращению, ни только к внутреннему раскаянию.
- issue: Объём значения הארץ в выражении בכל הארץ
  choice: по всей земле
  alternative: по всем странам; по всей стране
  rationale: Контекст изгнания указывает на широкое рассеяние. Формулировка сохраняет лексическую неоднозначность слова ארץ, а возможный смысл рассеяния по разным странам вынесен в сноску.
- issue: Продолжение стиха в греческом свидетеле
  choice: Основной текст завершается там, где завершается сохранившийся еврейский текст
  alternative: 'Добавить по греческому: «и осталось народа совсем немного, и правитель в доме Давида»'
  rationale: При наличии надёжного еврейского текста он служит основой перевода. Более длинное греческое чтение важно для текстологии, но не должно без обозначения включаться в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; «исторгнут» сохраняет силу образа насильственного изгнания, не вводя конфессиональной терминологии.
