translation:
  language: ru
  text: Как грозен ты, Илия![a] И кто, подобно тебе, может похвалиться?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Как прославился ты, Илия, своими чудесами! И кто подобен тебе, чтобы похвалиться?» Еврейский текст буквально говорит: «Как страшен ты, Илия!»; здесь ему соответствует «Как грозен ты».'
    reason: alternative_reading
lexical_decisions:
- source_word: מה נורא
  choice: Как грозен
  rationale: Еврейское восклицание выражает восхищение тем, кто внушает страх и благоговейный трепет. «Грозен» сохраняет эту смысловую силу и в современном русском звучит естественнее, чем буквальное «страшен», которое могло бы получить преимущественно отрицательный оттенок.
- source_word: אתה
  choice: ты
  rationale: В еврейском это именное предложение без выраженной связки; настоящее время естественно передаётся по-русски конструкцией «грозен ты».
- source_word: אליהו
  choice: Илия
  rationale: Использована традиционная и общеупотребительная русская форма библейского имени.
- source_word: ואשר כמוך יתפאר
  choice: И кто, подобно тебе, может похвалиться?
  rationale: Передана очевидная по контексту риторическая вопросительная сила фразы, подтверждаемая греческой параллелью. «Похвалиться» естественно передаёт יתפאר и сохраняет присущую выражению смысловую напряжённость, не превращая его в нейтральное «прославиться».
theological_decisions:
- issue: Расхождение еврейского текста с греческой параллелью в первой части стиха
  choice: Следовать еврейскому מה נורא и передать образ внушающего трепет Илии
  alternative: «Как прославился ты, Илия, своими чудесами»
  rationale: Сохранившийся еврейский свидетель имеет приоритет и содержит оттенок страха и благоговения, отсутствующий в греческом «был прославлен». Греческий текст приведён в примечании как значимое древнее разночтение и использован для проверки риторического смысла второй части.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной риторикой. Инверсия «грозен ты» поддерживает восклицательный строй оригинала, не создавая архаического звучания.
