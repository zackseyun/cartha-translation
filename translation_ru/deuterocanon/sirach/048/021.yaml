translation:
  language: ru
  text: Он поразил стан Ассирии[a] и привёл их в смятение мором.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По-гречески: «Он поразил стан ассирийцев, и ангел Его истребил их».'
