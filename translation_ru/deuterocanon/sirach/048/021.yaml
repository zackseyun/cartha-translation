lexical_decisions:
- source_word: ויך
  choice: Он поразил
  rationale: Глагол נכה означает «ударить, поразить». «Поразил» передаёт сильное непосредственное действие и естественно звучит в современном литературном русском.
- source_word: מחנה אשור
  choice: стан Ассирии
  rationale: Конструкция буквально означает «стан Ассирии». Слово «стан» сохраняет библейский военный контекст, оставаясь понятным современному читателю.
- source_word: ויהמם
  choice: привёл его в смятение
  rationale: Глагол המם выражает причинение смятения, паники или разгрома. Формулировка сохраняет каузативный смысл и согласуется с единственным числом слова «стан».
- source_word: במגפה
  choice: мором
  rationale: מגפה означает поражение, мор или эпидемическое бедствие; предлог ב имеет инструментальное значение. «Мором» кратко и естественно передаёт средство действия в данном повествовательном контексте.
theological_decisions:
- issue: Расхождение еврейского текста и греческой параллели во второй части стиха
  choice: 'Следовать еврейскому чтению: «привёл его в смятение мором»'
  alternative: 'Следовать греческому чтению: «и ангел Его истребил их»'
  rationale: Сохранившийся еврейский текст здесь надёжен и является основным источником. Греческое чтение явно называет ангела и говорит об истреблении; это содержательно значимый вариант, поэтому он сохранён в сноске, а не внесён в основной текст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Стан» и «мор» лаконичны, понятны и соответствуют военному и повествовательному контексту.
