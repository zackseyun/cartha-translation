  text: Happy is the one who saw you and died[a], and happy are you, for you will surely live.
translation:
  language: ru
  text: Блажен тот, кто увидел тебя и умер[a], и блажен ты, ибо непременно будешь жить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Блаженны видевшие тебя и украшенные любовью, ведь и мы будем жить». Еврейский текст вместо этого продолжает: «и блажен ты, ибо непременно будешь жить».'
    reason: alternative_reading
lexical_decisions:
- source_word: אשרי / ואשריך
  choice: блажен тот / блажен ты
  rationale: Еврейская формула выражает состояние человека, достойного особого счастья и благословения. «Блажен» сохраняет характерное для библейских изречений торжественное восклицание, оставаясь понятным современному читателю; суффикс во второй форме передан прямым обращением «ты».
- source_word: ראך
  choice: увидел тебя
  rationale: Форма Qal перфекта от ראה с суффиксом 2-го лица мужского рода единственного числа прямо обращена к Илии; простой глагол «увидел» не добавляет отсутствующего в источнике оттенка.
- source_word: ומת
  choice: и умер
  rationale: Союз и перфект переданы буквально, без внесения уступительного смысла «хотя умер», который возможен по контексту, но грамматически не выражен.
- source_word: כי
  choice: ибо
  rationale: Союз вводит основание второго провозглашения блаженства. «Ибо» ясно передаёт объяснительную связь и соответствует приподнятому поэтическому регистру.
- source_word: חיה תחיה
  choice: непременно будешь жить
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает утверждение. Наречие «непременно» естественно передаёт эту эмфазу по-русски.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и существенно отличающейся греческой формы стиха
  choice: Основной текст переведён по еврейскому свидетельству; греческое разночтение приведено в сноске.
  alternative: 'Следовать греческому тексту: «Блаженны видевшие тебя и украшенные любовью, ведь и мы будем жить».'
  rationale: Для Книги Иисуса, сына Сирахова, сохранившийся еврейский текст имеет первенство. Однако греческая форма существенно меняет вторую половину стиха и число адресатов, поэтому её необходимо сохранить для прозрачности, не смешивая два свидетельства в основном тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм двух формул אשרי сохранён; неоднозначное сочетание блаженства и смерти не истолковано дополнительно.
