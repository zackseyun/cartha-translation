translation:
  language: ru
  text: При жизни он совершал чудеса, и при кончине его дела были дивны.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «и в смерти его». Заключительная фраза содержит несколько трудную форму; греческий текст имеет «при кончине его» и подтверждает смысл дивных дел, связанных с его смертью.'
    reason: source_clarification
lexical_decisions:
- source_word: בחייו
  choice: При жизни
  rationale: Предлог בְּ при חַיִּים имеет временное значение. «При жизни» естественно и кратко передаёт период жизни Елисея.
- source_word: עשה
  choice: совершал
  rationale: Обычный глагол «делать, совершать» передан в естественном русском сочетании «совершал чудеса» без дополнительного возвышения смысла.
- source_word: נפלאות
  choice: чудеса
  rationale: Слово обозначает необычайные, вызывающие изумление деяния; «чудеса» ясно передаёт смысл и согласуется с греческим τέρατα.
- source_word: ובמותו
  choice: и в смерти его
  rationale: Сохраняется буквальная и несколько напряжённая формулировка еврейского текста, связывающая дивные дела со смертью Елисея, но не уточняющая, произошли ли они в момент смерти или после неё.
- source_word: תמהי
  choice: были дивны
  rationale: Необычная форма в еврейском свидетельстве по контексту выражает изумительность; греческое θαυμάσια подтверждает это значение. «Дивны» сохраняет торжественный, но понятный регистр.
- source_word: מעשה
  choice: дела его
  rationale: Хотя еврейская форма внешне единственного числа, она допускает собирательный смысл, а греческий текст имеет множественное τὰ ἔργα αὐτοῦ. Русское множественное число естественно передаёт подразумеваемую совокупность деяний.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и греческого параллельного свидетельства при трудной форме заключительной фразы
  choice: 'Основой оставлен еврейский текст: «в смерти его», а греческий использован для подтверждения смысла «дела были дивны».'
  alternative: 'Следовать греческому ближе: «при кончине его дела были дивны»; либо буквально воспроизвести внешнее единственное число: «дело его было удивительным».'
  rationale: Еврейское свидетельство имеет приоритет, хотя форма תמהי и число מעשה создают небольшую трудность. Греческий параллельный текст надёжно подтверждает общий смысл, не требуя заменить еврейское «в смерти» более определённым толкованием.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Выражение «в смерти его» намеренно сохраняет смысловую напряжённость оригинала; «дивны» поддерживает параллелизм с «чудесами», не превращая его в тавтологию.
