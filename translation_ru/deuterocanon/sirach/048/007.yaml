    reason: textual_variant
lexical_decisions:
- source_word: המושח
  choice: помазавший
  rationale: Причастная форма от משח продолжает характеристику Илии; русское действительное причастие естественно передаёт определительное значение без добавления местоимения.
- source_word: מלא תשלומות
  choice: исполнителя возмездия
  rationale: Сочетание в составном древнееврейском тексте затруднительно. «Исполнитель возмездия» передаёт предполагаемое указание на человека, помазанного для совершения воздаяния, и сохраняет судебно-карательный оттенок תשלומות.
- source_word: ונביא
  choice: и пророка
  rationale: Форма без артикля естественно передаётся существительным без дополнительного уточнения; по контексту имеется в виду Елисей.
- source_word: תחליף תחתיך
  choice: тебе на смену
  rationale: Оборот от חלף с תחתיך обозначает замену и преемство в служении. Формулировка современна и не вводит излишне официального понятия должности.
theological_decisions:
- issue: Расхождение сохранившегося древнееврейского текста и греческой традиции в Сир 48:7
  choice: 'Основной текст следует древнееврейскому свидетельству: Илия помазал исполнителя возмездия и пророка себе на смену.'
  alternative: 'Греческий текст: «слышавший на Синае обличение и на Хориве — суды возмездия».'
  rationale: При наличии древнееврейского текста он служит основой перевода. Существенно отличающееся греческое чтение сохранено в примечании, чтобы не скрывать текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с библейской сдержанностью. «Возмездие» сохраняет судебно-карательный оттенок, а «тебе на смену» ясно и естественно выражает преемство. Маркеры примечаний размещены непосредственно после соответствующих мест.
