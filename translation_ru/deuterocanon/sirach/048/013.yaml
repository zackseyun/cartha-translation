base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/013.yaml
  text: In his days he did not tremble before anyone[a], and no flesh mastered his spirit. No word was too wondrous for him[b], and beneath him his flesh was created.
translation:
  language: ru
  text: 'При жизни он ни перед кем не трепетал,

    и ни один смертный не властвовал над его духом.

    Ни одно слово не было для него слишком дивным[b],

    и после смерти тело его пророчествовало[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительное полустишие переведено по греческому тексту: «и в успении (или: во сне) тело его пророчествовало». В контексте речь идёт о посмертном состоянии. Дошедший еврейский текст здесь труден и буквально читается приблизительно так: «и под ним было сотворено его тело».'
    reason: textual_variant
  - marker: b
    text: 'Или: «Ни одно дело не было для него слишком дивным». Еврейское דבר может означать и «слово», и «дело, предмет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מימיו לא זע מכל
  choice: При жизни он ни перед кем не трепетал
  rationale: מימיו обозначает время его жизни, а זע — дрожь или трепет. Оборот передаёт бесстрашие пророка, не превращая его в отвлечённую невозмутимость.
- source_word: ולא משל ברוחו כל בשר
  choice: и ни один смертный не властвовал над его духом
  rationale: כל בשר — букв. «всякая плоть», здесь идиома, обозначающая людей; отрицательная конструкция по-русски естественно передаётся как «ни один смертный». משל ברוחו сохранено как «властвовал над его духом».
- source_word: כל דבר לא נפלא ממנו
  choice: Не было слова, слишком дивного для него
  rationale: דבר может означать как «слово», так и «дело/предмет». Выбор «слово» поддерживается греческим πᾶς λόγος, а «слишком дивного» сохраняет оттенок נפלא и не сводит выражение только к сокрытости или трудности.
- source_word: ἐν κοιμήσει ἐπροφήτευσεν τὸ σῶμα αὐτοῦ
  choice: и в смертном покое тело его пророчествовало
  rationale: Для трудного заключительного еврейского полустишия принят связный греческий параллельный текст. κοιμήσει буквально указывает на сон/покой и в контексте смерти Елисея естественно передано как «в смертном покое»; необычный образ пророчествующего тела сохранён.
theological_decisions:
- issue: Выбор текста в заключительном полустишии
  choice: 'Следовать греческому параллельному чтению: «и в смертном покое тело его пророчествовало»'
  alternative: 'Буквально по дошедшему еврейскому тексту: «и под ним было сотворено его тело»'
  rationale: Дошедшее еврейское чтение ומתחתיו נברא בשרו грамматически переводимо, но в данном контексте остаётся тёмным и, вероятно, отражает текстовую порчу. Греческое чтение связно продолжает тему пророческой силы Елисея после смерти. Сомнение не скрыто, а отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским ритмом. «Смертный» естественно раскрывает еврейскую идиому «плоть», а «смертный покой» передаёт греческий эвфемистический образ, не устраняя связи со смертью Елисея. Все текстовые и лексические неоднозначности вынесены в сноски у соответствующих выражений.
