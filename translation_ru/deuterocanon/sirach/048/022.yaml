base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/022.yaml
  text: For Hezekiah did what was good[a], and was strong in the ways of David, as Isaiah the prophet commanded him[b], the one praised among the prophets.
translation:
  language: ru
  text: Ибо Езекия делал добро[a] и твёрдо держался путей Давида, как повелел ему пророк Исаия[b], прославленный среди пророков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «делал угодное Господу». Сохранившийся еврейский текст гласит просто: «делал добро».'
    reason: alternative_reading
  - marker: b
    text: 'В греческом тексте Исаия назван «великим пророком, верным в своём видении». В еврейском тексте: «прославленный среди пророков».'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: Ведь
  rationale: Передаёт пояснительную связь с предшествующим контекстом естественно для современного русского языка.
- source_word: עשה ... את הטוב
  choice: делал добро
  rationale: Идиоматично передаёт буквальное еврейское «делал добро / то, что хорошо», не добавляя отсутствующее в еврейском тексте «угодное Господу».
- source_word: ויחזק בדרכי דוד
  choice: твёрдо шёл путями Давида
  rationale: Передаёт силу חזק и библейский образ путей как образа жизни; буквальное «был силён на путях» по-русски неестественно.
- source_word: כאשר צוהו
  choice: как повелел ему
  rationale: Сохраняет сильное значение צוה и местоименный объект, относящий повеление к Езекии.
- source_word: ישעיה הנביא
  choice: пророк Исаия
  rationale: Естественный русский порядок слов для титула и имени.
- source_word: המהלל בנביאים
  choice: прославленный среди пророков
  rationale: Сохраняет пассивное значение и сравнительно сжатую форму еврейского чтения.
theological_decisions:
- issue: Включать ли слова «Господу» по греческому параллельному тексту
  choice: В основном тексте не добавлены
  alternative: «делал угодное Господу»
  rationale: Сохранившийся еврейский текст содержит лишь «делал добро»; греческое чтение отмечено в сноске как значимый вариант.
- issue: Заключительное описание Исаии
  choice: «прославленный среди пророков» по еврейскому тексту
  alternative: «великий пророк, верный в своём видении» по греческому тексту
  rationale: Основной текст следует сохранившемуся еврейскому свидетельству, а существенно отличающееся греческое чтение документируется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Оборот «твёрдо шёл путями Давида» выбран вместо неестественного буквального «был силён в путях Давида»; он сохраняет образ жизненного пути и значение стойкости.
