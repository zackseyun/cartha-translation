base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/048/017.yaml
  text: Hezekiah fortified his city[a], and brought water into its midst; he cut through rock like bronze[b], and dammed up a reservoir in the mountains.
translation:
  language: ru
  text: Езекия укрепил свой город, проведя воду внутрь него; он прорубил скалы, словно они были из меди[a], и запрудил в горах водоём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение «словно они были из меди» необычно и допускает иное понимание; в греческом тексте сказано: «железом».'
    reason: textual_variant
  - marker: b
    text: Заключительная фраза на еврейском языке очень сжата; её можно также понять как «перегородил (или запрудил) горы; водоём». Греческий текст говорит более общо о сооружении источников воды.
    reason: alternative_reading
lexical_decisions:
- source_word: יחזקיהו
  choice: Езекия
  rationale: Традиционная русская форма имени библейского царя.
- source_word: חזק עירו
  choice: укрепил свой город
  rationale: В контексте Иерусалима глагол означает усиление городских укреплений; это значение подтверждается греческим ὠχύρωσεν.
- source_word: בהטות אל תוכה מים
  choice: направил в него воду
  rationale: Передаёт целенаправленный отвод воды внутрь города естественным современным русским языком.
- source_word: ויחצב ... צורים
  choice: прорубил скалы
  rationale: Глагол обозначает высекание или прорубание; в контексте водных сооружений речь, вероятно, идёт о проходе через скальную породу.
- source_word: כנחשת
  choice: словно медь
  rationale: Формально отражает еврейское сравнительное כ и существительное «медь/бронза», не подменяя трудное еврейское чтение греческим «железом»; необычность пояснена в сноске.
- source_word: ויחסום הרים מקוה
  choice: запрудил в горах водоём
  rationale: Сжатая еврейская конструкция передана как сооружение запруды или водохранилища в горах; единственное число соответствует מקוה.
