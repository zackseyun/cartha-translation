  text: By his word he restrained the heavens[b][a], and brought down fire three times.
translation:
  language: ru
  text: Словом Бога он затворил небо[a] и трижды низвёл огонь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «словом Господа он затворил небо». Еврейский текст имеет «словом Бога».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально по-еврейски: «три огня»; по смыслу — огонь был низведён в трёх случаях. Греческий текст также имеет значение «трижды огонь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בדבר אל
  choice: Словом Бога
  rationale: 'Предлог ב перед דבר передаёт средство действия: «словом». אל естественно читается как обозначение Бога. Такое прочтение близко сохранившемуся еврейскому тексту; греческое ἐν λόγῳ Κυρίου («словом Господа») подтверждает общий смысл.'
- source_word: עצר שמים
  choice: затворил небо
  rationale: עצר означает удерживать, запирать, не давать действовать. В рассказе об Илии речь идёт о небе, не дающем дождя; перевод сохраняет образ и не добавляет прямо не упомянутый в стихе дождь. Единственное число «небо» естественно для русского языка, хотя שמים имеет форму множественного числа.
- source_word: ויורד
  choice: низвёл
  rationale: 'Форма выражает причинное действие: он сделал так, что огонь сошёл. «Низвёл» кратко передаёт эту каузативность и сохраняет возвышенный, но понятный библейский регистр.'
- source_word: שלוש אשות
  choice: трижды низвёл огонь
  rationale: Буквально выражение означает «три огня», однако греческое τρὶς πῦρ и контекст поддерживают значение трёх случаев низведения огня. Наречие «трижды» естественно передаёт этот смысл по-русски.
theological_decisions:
- issue: Следует ли вслед за греческим текстом говорить «словом Господа»
  choice: Словом Бога
  alternative: Словом Господа
  rationale: Сохранившийся еврейский текст содержит אל, естественно понимаемое как «Бог», тогда как греческий параллельный текст употребляет Κυρίου, «Господа». Основной текст следует еврейскому свидетельству, не устраняя близкий вариант греческой традиции.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Затворил небо» и «низвёл огонь» сохраняют образность исходного текста, оставаясь понятными обычному читателю.
