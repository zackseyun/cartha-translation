  text: In his days Sennacherib came up and sent Rabshakeh[a]; he stretched out his hand against Zion and blasphemed in his pride.
translation:
  language: ru
  text: В его дни выступил Сеннахирим и послал Рабсака. Он простёр руку против Сиона и в своей гордыне богохульствовал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «и хвалился в своём высокомерии». Еврейское свидетельство говорит о богохульной речи; ему следует основной текст.'
    reason: alternative_reading
lexical_decisions:
- source_word: עלה
  choice: выступил
  rationale: Глагол עלה буквально означает движение вверх, а в военном повествовании — выступление или наступление. «Выступил» естественно передаёт военный смысл, не добавляя отсутствующего в тексте направления.
- source_word: וישלח
  choice: послал
  rationale: Прямой и стилистически нейтральный эквивалент שלח, подходящий для исторического повествования.
- source_word: רבשקה
  choice: Рабсака
  rationale: Использована укоренившаяся русская передача ассирийского титула/обозначения «Рабсак»; винительный падеж обусловлен глаголом «послал».
- source_word: ויט ידו
  choice: простёр руку
  rationale: Сохранён образ еврейской идиомы נטה יד, обозначающей направленное враждебное действие. «Простёр руку» звучит достойно и понятно, не сводя образ к одному конкретному военному действию.
- source_word: על ציון
  choice: против Сиона
  rationale: В контексте враждебного жеста предлог על естественно передаётся как «против».
- source_word: ויגדף
  choice: богохульствовал
  rationale: Глагол גדף обозначает хульную, дерзкую речь с религиозным оттенком. Русское «богохульствовал» сохраняет эту богословскую силу, не вводя отдельного прямого дополнения.
- source_word: אל
  choice: передано смыслом глагола «богохульствовал»
  rationale: Последовательность ויגדף אל допускает понимание אל как указания на Бога либо как элемента эллиптической конструкции. Русский глагол «богохульствовал» сохраняет направленность хулы на Бога, но не усиливает синтаксически не вполне ясное место добавлением «Бога» как прямого дополнения.
- source_word: בגאונו
  choice: в своей гордыне
  rationale: גאון здесь выражает надменное само­возвышение. «Гордыня» передаёт отрицательный нравственный и богословский оттенок и естественно сочетается с «богохульствовал».
theological_decisions:
- issue: Соотношение еврейского окончания («богохульствовал в своей гордыне») и греческого параллельного чтения («хвалился в своём высокомерии»)
  choice: Основной текст следует сохранившемуся еврейскому свидетельству и передаёт явное указание на богохульную речь.
  alternative: «и хвалился в своём высокомерии»
  rationale: При наличии еврейского текста Сираха он служит главным основанием перевода. Греческое чтение содержит существенный иной оттенок — надменное хвастовство вместо явного богохульства, — поэтому оно отмечено в сноске, а не заменяет еврейское чтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Простёр руку» сохраняет исходный образ, тогда как «выступил» делает военный контекст понятным без излишнего архаизма. Форма «Рабсак» сохраняет привычное русскому читателю историко-библейское наименование.
