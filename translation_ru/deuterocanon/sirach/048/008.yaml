lexical_decisions:
- source_word: השמע
  choice: Ты возгласил
  rationale: Еврейская каузативная форма от שמע буквально означает «дал услышать». В данном контексте естественное и достойное русское соответствие «возгласил» передаёт публичное провозглашение, не смешивая чтение с греческим «помазывающий».
- source_word: בסיני
  choice: на Синае
  rationale: Русское употребление с названием горы естественно требует предлога «на».
- source_word: תוכחות
  choice: обличения
  rationale: Слово обозначает укоры, обличения или наставляющие предостережения. «Обличения» сохраняет серьёзный и увещательный оттенок множественного числа.
- source_word: ובחורב
  choice: и на Хориве
  rationale: Название горы по-русски естественно сочетается с предлогом «на»; союз ו передан как «и».
- source_word: משפטי נקם
  choice: суды возмездия
  rationale: 'Сохранена конструкция сопряжённого состояния: משפטי — «суды», נקם — «возмездие, отмщение». «Возмездие» звучит естественнее современного «мщения» и передаёт карательный характер суда.'
theological_decisions:
- issue: Существенное расхождение между сохранившимся еврейским текстом и греческой параллелью
  choice: 'Основной текст следует еврейскому чтению: «Ты возгласил на Синае обличения и на Хориве — суды возмездия».'
  alternative: 'Греческий текст имеет иной смысл: «помазывающий царей для воздаяния и пророков как преемников после него».'
  rationale: Сохранившееся еврейское свидетельство здесь принято за основу. Греческое чтение отражает не простой переводческий вариант, а существенно иную текстовую форму, поэтому оно приведено в сноске без попытки согласовать два текста.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным библейским звучанием. Местоимение «Ты» сохраняет прямое обращение контекста. Тире во второй части помогает естественно прочитать параллельную конструкцию с подразумеваемым глаголом.
