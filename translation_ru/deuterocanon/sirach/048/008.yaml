  text: Ты возвестил на Синае обличения[a] и на Хориве — суды возмездия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь существенно иное чтение: «помазывающий царей для воздаяния и пророков-преемников после себя». По-видимому, еврейский и греческий тексты отражают разные формы этого стиха.'
