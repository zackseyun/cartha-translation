lexical_decisions:
- source_word: המוריד
  choice: низвергавший
  rationale: Причастие каузативной породы от ירד означает «заставлявший сойти, низводивший». «Низвергавший» естественно передаёт и движение вниз, и свержение властителей; это значение подтверждается греческим καταγαγών.
- source_word: מלכים
  choice: царей
  rationale: В еврейском тексте прямо названы цари; обобщать до «правителей» нет оснований.
- source_word: על שחת
  choice: к погибели
  rationale: שחת может обозначать яму, могилу, гибель или разрушение. Здесь результативное «к погибели» сохраняет образ окончательного падения и согласуется с греческим εἰς ἀπώλειαν, не исключая буквального образа ямы.
- source_word: ונכבדים
  choice: и знатных
  rationale: נכבדים — люди, обладающие весом, почётом и высоким положением. В параллели с царями русское «знатных» кратко и естественно обозначает высокопоставленных людей, не уточняя их должность.
- source_word: ממטותם
  choice: с их лож
  rationale: מטות означает кровати или ложа. «С их лож» сохраняет конкретный образ исходного текста и подходит к возвышенному, но понятному регистру стиха.
theological_decisions:
- issue: Следует ли раскрывать во второй части строки намёк на суд Илии над царём, прикованным к постели
  choice: Сохранить буквальный образ «знатных — с их лож», не добавляя в основной текст болезни или конкретного царя.
  alternative: «знатных — с их одров болезни» либо явное упоминание больного царя
  rationale: Еврейский и греческий тексты говорят только о знатных людях и их ложах. Вероятная отсылка к рассказу о царе Охозии помогает понять строку, но не должна превращаться в добавление к переводу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Форма «низвергавший» сохраняет связь с окружающим описанием Илии; тире во второй части естественно передаёт пропуск повторного глагола. «Ложа» выбраны вместо разговорного «кровати», поскольку речь идёт о царях и знатных людях.
