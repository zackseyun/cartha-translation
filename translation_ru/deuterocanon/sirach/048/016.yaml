  text: A remnant was left to Judah[a], and to the house of David a ruler. Some of them did what was right, but some of them greatly increased apostasy.
translation:
  language: ru
  text: У Иуды остался лишь малый остаток, а у дома Давида — правитель. Одни из них поступали праведно, другие же безмерно умножали свою неверность[a].
  philosophy: optimal-equivalence
  footnotes:
