lexical_decisions:
- source_word: וישאר
  choice: остался
  rationale: Форма нифаля передаёт состояние того, что уцелело или осталось; русский глагол сохраняет этот оттенок без добавления идеи особого сохранения.
- source_word: ליהודה מזער
  choice: у Иуды остался лишь малый остаток
  rationale: מזער указывает на крайне малое количество. «Малый остаток» естественно передаёт контекст уцелевшей части народа, а конструкция с «у Иуды» выражает отношение, обозначенное предлогом ל.
- source_word: בית דוד
  choice: дом Давида
  rationale: Сохранён устойчивый библейский династический образ, понятный и в современном русском языке.
- source_word: קצין
  choice: правитель
  rationale: Слово обозначает человека, наделённого властью; «правитель» не уточняет титул сверх того, что дано в еврейском тексте.
- source_word: עשו יושר
  choice: поступали праведно
  rationale: Выражение буквально связано с совершением правого и передаёт нравственную прямоту; данный вариант звучит естественно и достойно по-русски.
- source_word: הפליאו
  choice: безмерно умножали
  rationale: Глагол в породе хифиль выражает необычайную степень действия; «безмерно» сохраняет усиление, а «умножали» согласуется с греческим параллельным текстом.
- source_word: מעל
  choice: неверность
  rationale: Слово обозначает вероломное нарушение верности, нередко заветной. «Неверность» сохраняет как религиозный, так и более широкий смысл и не сужает его исключительно до формального отступничества.
theological_decisions:
- issue: Степень конкретизации מעל в кратком обзоре истории царей
  choice: неверность
  alternative: вероотступничество; вероломство; грехи
  rationale: Еврейское מעל обозначает нарушение верности и сильнее общего понятия греха, однако не всегда означает исключительно формальное вероотступничество. Основной текст сохраняет более широкое напряжение слова, а греческое чтение «грехи» отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского династического выражения «дом Давида». Синтаксис с тире делает первую фразу ясной, не устраняя её лаконичность; нравственное противопоставление передано без конфессиональной конкретизации.
