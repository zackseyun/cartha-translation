lexical_decisions:
- source_word: נמוגו
  choice: растаяло
  rationale: Еврейский глагол передаёт образ утраты твёрдости, внутреннего распада и исчезновения мужества; «растаяло» сохраняет исходную метафору.
- source_word: בגאון לבם
  choice: их гордое сердце
  rationale: Сжатое еврейское выражение допускает значения гордости, возвышенности или внутренней надменной уверенности. Атрибутивная передача звучит естественно по-русски и сохраняет образ гордого сердца, лишившегося стойкости.
- source_word: ויחילו
  choice: они корчились
  rationale: Глагол может обозначать дрожь, мучительные судороги и родовые муки. «Корчились» передаёт телесную остроту страдания, не повторяя прямо следующего сравнения.
- source_word: כיולדה
  choice: словно роженица
  rationale: Единственное число причастной формы указывает на женщину в родах; «роженица» кратко и естественно передаёт этот образ в современном литературном русском.
- source_word: τότε ἐσαλεύθησαν καρδία καὶ χεῖρες αὐτῶν
  choice: Тогда растаяло их гордое сердце
  rationale: Основной текст следует надёжному еврейскому свидетелю. Греческая параллель «тогда поколебались их сердце и руки» подтверждает общий смысл паники, но отражает иной или расширенный вариант.
