  text: He declared what would be forever[b][a], and hidden things before they came.
translation:
  language: ru
  text: Он возвестил грядущее до конца времён[a] и сокровенное[b] — прежде, чем всё это наступило.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «навеки», «до скончания века». Еврейское выражение допускает передачу как «до вечности»; греческий текст — «до века».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «скрытое», «утаённое».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עד עולם
  choice: до конца времён
  rationale: Еврейское выражение буквально соединяет «до» с обозначением века/вечности; греческое ἕως τοῦ αἰῶνος подтверждает протяжённость до предела века. «До конца времён» естественно по-русски передаёт необозримо далёкий временной охват, не превращая его без пояснения в наречие «вечно».
- source_word: הגיד
  choice: возвестил
  rationale: Глагол означает «сообщил, дал знать». «Возвестил» соответствует пророческому контексту и сохраняет возвышенный, но понятный регистр.
- source_word: נהיות
  choice: грядущее
  rationale: Форма обозначает будущие события, то, чему предстоит произойти; собирательное «грядущее» кратко и естественно передаёт этот смысл, подтверждаемый греческим τὰ ἐσόμενα.
- source_word: ונסתרות
  choice: и сокровенное
  rationale: Слово обозначает скрытые, сокрытые вещи. «Сокровенное» сохраняет смысл и торжественный тон, не привнося специального значения «апокрифическое».
- source_word: לפני בואן
  choice: прежде, чем всё это наступило
  rationale: 'Буквально: «до их прихода». В отношении будущих событий русское «наступило» идиоматично; «всё это» указывает одновременно на грядущее и сокровенное, сохраняя множественный охват исходной формы.'
theological_decisions:
- issue: Временной охват пророческого знания
  choice: возвестил грядущее до конца времён
  alternative: возвестил то, что будет вовеки
  rationale: Перевод сохраняет широкий и поэтический временной охват עד עולם / ἕως τοῦ αἰῶνος, но не превращает похвалу пророческому откровению в систематическое утверждение об исчерпывающем знании всего будущего.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Возвестил», «грядущее» и «сокровенное» понятны современному читателю и соответствуют поэтической похвале пророку; синтаксис остаётся ясным и не перегруженным архаизмами.
