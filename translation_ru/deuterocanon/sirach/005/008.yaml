    reason: textual_variant
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: И ты говоришь
  rationale: Еврейский перфект во втором лице в контексте предостережения передаёт типичное или предполагаемое высказывание адресата. Настоящее время естественно звучит по-русски и сохраняет обличительную непосредственность.
- source_word: רַחֲמָיו
  choice: Милостей Его
  rationale: Множественное число сохраняет форму еврейского слова и передаёт представление о многочисленных проявлениях Божьего милосердия.
- source_word: רַבִּים
  choice: много
  rationale: Прямо передаёт количественное значение при существительном во множественном числе, не усиливая его до «безмерны» или «велики».
- source_word: לְרֹב עֲוֹנוֹתַי
  choice: множество моих беззаконий
  rationale: Сохраняет количественный смысл רֹב и множественное число עֲוֹנוֹתַי. В русском предложении оборот естественно поставлен как объект глагола «простит», без искусственного «за множество».
- source_word: עֲוֹנוֹתַי
  choice: моих беззаконий
  rationale: «Беззакония» сохраняет нравственную весомость слова и его множественное число; более общее «грехи» возможно, но менее точно.
- source_word: יִסְלָח
  choice: Он простит
  rationale: Будущее время передаёт уверенное ожидание прощения, на котором самонадеянно строит расчёт говорящий.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста с греческим параллельным текстом
  choice: Основной текст переведён с сохранившегося еврейского свидетельства; греческое чтение приведено в сноске как текстовый вариант.
  alternative: Перевести греческое чтение о неправедном богатстве и дне взыскания как основной текст.
  rationale: Еврейское свидетельство здесь надёжно и содержит самостоятельное предостережение против самонадеянного расчёта на Божью милость. Греческий текст существенно иной и потому должен быть явно сохранён, но не подменять основной еврейский текст.
- issue: Самонадеянное обращение к Божьей милости
  choice: Сохранена прямая речь без пояснения, будто множество беззаконий служит основанием или гарантией прощения.
  alternative: Добавить в основной текст явное осуждение или условие покаяния.
  rationale: Само предостережение определяется контекстом, тогда как эта строка передаёт слова человека. Добавление богословского пояснения внутрь цитаты устранило бы напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Порядок слов «Милостей Его» и «Он простит» слегка приподнят, но понятен; он сохраняет акцент исходной прямой речи. Местоимение, относящееся к Богу, написано с прописной буквы в соответствии с принятой русской религиозно-литературной практикой.
