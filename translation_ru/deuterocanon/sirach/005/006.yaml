  text: 'Не говори: «Господь милосерден и сотрёт все мои беззакония».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Не говори
  rationale: Прямо передаёт еврейский запрет, естественно звуча по-русски.
- source_word: רַחוּם
  choice: милосерден
  rationale: Передаёт Божье сострадание и готовность проявлять милость; соответствует контексту самонадеянного упования на милость.
- source_word: יהוה
  choice: Господь
  rationale: Традиционная и общепонятная русская передача тетраграмматона без введения конфессионально маркированной транслитерации.
- source_word: וְכָל עֲוֹנוֹתַי יִמְחֶה
  choice: и сотрёт все мои беззакония
  rationale: Сохраняет образ глагола מחה «стереть» и полноту כָל; «беззакония» передаёт עֲוֹנוֹת как виновные проступки, а не только абстрактные грехи.
theological_decisions:
- issue: Высказывание о Божьем милосердии
  choice: Сохранено как запрещённая человеку самоуверенная реплика, без отрицания самого Божьего милосердия.
  alternative: Разъяснить в тексте, что осуждается злоупотребление милостью.
  rationale: Еврейский стих лишь запрещает так говорить; пояснение мотива внутри перевода превысило бы исходный текст.
- issue: Связь двух частей высказывания
  choice: Передана союзом «и».
  alternative: «Потому что Он сотрёт» или точка с запятой.
  rationale: Еврейское וְ допускает простое сочинение; причинное истолкование не следует навязывать.
translation_notes:
  register: Современный литературный русский язык; краткая, строгая форма наставления. Кавычки ясно отделяют предостерегаемую реплику. Маркеры сносок не требуются.
