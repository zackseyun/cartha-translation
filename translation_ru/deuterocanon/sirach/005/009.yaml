translation:
  language: ru
  text: Ибо милость и гнев — у Него[a], и на нечестивых ляжет Его ярость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции вместо этого: «Не провеивай зерно при всяком ветре и не ходи по всякой тропе; таков двуязычный грешник». Это чтение существенно отличается от сохранившегося еврейского текста и, вероятно, отражает иную текстовую форму стиха.'
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание предшествующего наставления; «ибо» естественно передаёт причинно-пояснительную связь в достойном литературном регистре.
- source_word: רַחֲמִים
  choice: милость
  rationale: Форма множественного числа употреблена как отвлечённое понятие сострадательной милости; русское единственное число звучит естественно.
- source_word: אַף
  choice: гнев
  rationale: Буквально слово означает «нос», но в данном устойчивом употреблении обозначает гнев. Выбор отличает его от более сильного רָגְזוֹ во второй части.
- source_word: עִמּוֹ
  choice: у Него
  rationale: Передаёт мысль о том, что милость и гнев пребывают у подразумеваемого Бога, не добавляя отсутствующего в еврейском тексте имени.
- source_word: אֵל
  choice: на
  rationale: Предлог обозначает направленность и объект, на который нисходит и остаётся ярость.
- source_word: רְשָעִים
  choice: нечестивых
  rationale: Традиционное и понятное обозначение людей, поступающих нечестиво; сохраняет нравственно-религиозную окраску исходного слова.
- source_word: יָנוּחַ
  choice: опустится
  rationale: Глагол נוח означает покоиться или оседать. «Опустится» естественно передаёт движение к состоянию покоя и значение имперфекта, хотя менее буквально, чем «почиет».
- source_word: רָגְזוֹ
  choice: Его ярость
  rationale: Слово выражает сильное возмущение или гнев; «ярость» сохраняет усиление относительно אַף и притяжательный суффикс.
theological_decisions:
- issue: К кому относятся местоименные формы «у Него» и «Его ярость»
  choice: Подразумеваемый референт — Бог; имя не добавлено в основной текст.
  alternative: Явно сказать «у Бога» и «Божья ярость».
  rationale: Контекст достаточно ясно указывает на Бога, однако в самой еврейской строке Его имя отсутствует. Местоименная передача сохраняет и контекстуальную ясность, и форму источника.
- issue: Существенное расхождение еврейского и греческого свидетельств
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству, а греческое чтение приведено в сноске.
  alternative: 'Перевести греческую строку как основной текст: «Не развевай при всяком ветре и не ходи по всякой тропе; таков двуязычный грешник».'
  rationale: При наличии надёжного еврейского текста он имеет приоритет для данного проекта. Греческая традиция представляет существенно иную форму стиха, поэтому её нельзя ни смешивать с еврейской, ни замалчивать.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Прописные местоимения указывают на Бога по контексту, не вставляя Его имени в основной текст. Параллелизм «милость и гнев» сохранён; более сильное «ярость» во второй части передаёт лексическое различие исходника.
