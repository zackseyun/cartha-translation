  text: Не полагайся на свою силу, идя вслед за желанием своей души[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно греческой параллели: «Не следуй самому себе и своей силе, идя по желаниям своего сердца». Еврейский текст гласит: «Не полагайся на свою силу, идя вслед за желанием своей души».'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово, переведённое как «душа», может также означать самого человека или его жизнь.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשָּׁעֵן
  choice: Не полагайся
  rationale: Глагол שׁען буквально означает «опираться», а также «полагаться». В современном русском «не полагайся» естественно передаёт предостережение против самоуверенности, сохраняя смысл исходной метафоры.
- source_word: כֹּחֶךָ
  choice: на свою силу
  rationale: כֹּחַ означает «сила» или «мощь». Возвратное «свою» естественно передаёт принадлежность силы адресату и подчёркивает личную самонадеянность без добавления отсутствующего в еврейском тексте усиления «только».
- source_word: לָלֶכֶת
  choice: чтобы следовать
  rationale: Буквально инфинитив означает «идти». Вместе с אַחַר он образует выражение «идти вслед за», которое в данном нравственном наставлении по-русски естественнее передать одним глаголом «следовать».
- source_word: אַחַר
  choice: следовать
  rationale: Предлог означает «за, вслед за». Его значение включено в русский глагол «следовать», благодаря чему сохраняется образ направляемого желаниями поведения без неестественного оборота.
- source_word: תַּאֲוַת
  choice: желанию
  rationale: תַּאֲוָה обозначает желание, влечение или страстное стремление. Нейтральное «желание» сохраняет широту значения и не сужает его до сексуальной похоти. Единственное число соответствует еврейской форме.
- source_word: נַפְשֶׁךָ
  choice: своей души
  rationale: נֶפֶשׁ может означать душу, самого человека, жизнь или внутреннее влечение. «Душа» сохраняет образность еврейского текста и соответствует греческому ψυχή; более широкие значения отмечены в сноске.
theological_decisions:
- issue: Антропологический термин נַפְשֶׁךָ / ψυχή
  choice: своей души
  alternative: самого себя; своей жизни
  rationale: Перевод «душа» сохраняет антропологическую лексику источников и не сводит выражение к простому возвратному местоимению. Поскольку в библейском употреблении слово шире позднейшего представления о душе как обособленной нематериальной части человека, возможные значения указаны в сноске.
- issue: Расхождение еврейского текста и греческой параллели
  choice: 'Основной текст следует высоконадежному еврейскому чтению: «Не полагайся на свою силу…»'
  alternative: 'Греческая параллель: «Не следуй своей душе и своей силе…»'
  rationale: Еврейский текст прямо засвидетельствован и имеет высокую степень уверенности, поэтому он положен в основу перевода. Подлинное текстовое расхождение с греческой традицией сохранено в сноске, а не устранено согласованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Оборот «следовать желанию» выбран вместо буквального «идти вслед за желанием» ради естественности; единственное число «желанию» отражает еврейскую форму. Сноски [a] и [b] присутствуют в основном тексте.
