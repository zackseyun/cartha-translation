translation:
  language: ru
  text: Не будь тем, кто веет при всяком ветре,[a] и не сворачивай на путь бури.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этого стиха существенно отличается: «Слава и бесчестие — в речи, и язык человека — его падение». Основной текст переведён по сохранившемуся еврейскому свидетельству.'
    reason: alternative_reading
  - marker: b
    text: Значение еврейского слова שִׁבֹּלֶת здесь неясно. Оно может означать «буря» или «поток», а в других местах — также «колос». В переводе выбрано значение, лучше всего согласующееся с образом ветра в первой части стиха.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּהְיֶה
  choice: Не будь
  rationale: Обычная форма запрета с глаголом היה; краткая формулировка сохраняет наставительный тон.
- source_word: זוֹרֶה
  choice: тем, кто веет
  rationale: Причастие от זרה передаёт сельскохозяйственный образ веяния зерна. Описательная конструкция звучит по-русски естественнее, чем редкое существительное «веяльщик», и сохраняет конкретную метафору.
- source_word: לְכָל רוּחַ
  choice: при всяком ветре
  rationale: Фраза сохраняет образ человека, готового веять при любом ветре, и подразумеваемое непостоянство, не заменяя метафору отвлечённым толкованием.
- source_word: וּפוֹנֶה
  choice: и не ступай
  rationale: Вторая часть продолжает сферу действия запрета. Глагольное выражение передано идиоматично в сочетании с «путь», не превращая образ в пояснительную перефразировку.
- source_word: דֶרֶך
  choice: на путь
  rationale: Сохраняется образ выбора и следования определённым путём.
- source_word: שִׁבֹּלֶת
  choice: бури
  rationale: Значение слова в данном месте неясно. Погодный смысл согласуется с параллельным образом ветра; лексическая неопределённость отмечена в сноске.
