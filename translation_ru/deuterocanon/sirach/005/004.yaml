    text: 'В греческом тексте: «Не говори: “Я согрешил — и что со мной случилось?” — ведь Господь долготерпелив». Вероятно, это чтение восходит к иному еврейскому тексту, чем сохранившийся.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Не говори
  rationale: Прямой отрицательный императив с אמר естественно и точно передаётся кратким запретом «не говори».
- source_word: מִי יוּכַל כֹּחוֹ
  choice: Кто устоит перед Его силой?
  rationale: Дошедший до нас еврейский текст краток и синтаксически затруднён. «Устоит перед Его силой» идиоматично выражает подразумеваемое противостояние силе, не устраняя вопросительного и предостерегающего характера фразы.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предшествующего запрета; «ведь» сохраняет компактную пояснительную связь.
- source_word: יְהֹוָה
  choice: ГОСПОДЬ
  rationale: Тетраграмматон передан традиционным русским титулом прописными буквами, позволяющим отличить его от обычного слова «Господь».
- source_word: מְבַקֵּשׁ
  choice: ищет
  rationale: Основное значение בקש — «искать». Нейтральное «ищет» сохраняет смысловую открытость глагола и не добавляет прямо не выраженной идеи суда или избавления.
- source_word: נִרְדָּפִים
  choice: гонимых
  rationale: Страдательное причастие от רדף обозначает тех, кого преследуют. «Гонимых» естественно в русском библейском регистре и ближе к корню, чем более широкое «угнетённых».
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческого параллельного свидетельства
  choice: Основной текст переведён по сохранившемуся еврейскому чтению; греческое чтение приведено в сноске.
  alternative: '«Не говори: “Я согрешил — и что со мной случилось?” — ведь Господь долготерпелив».'
  rationale: При наличии еврейского текста он служит основным свидетельством, однако греческий перевод отражает явно иное чтение и потому должен быть отмечен, а не молчаливо согласован с еврейским.
- issue: Неясность выражения о том, что ГОСПОДЬ «ищет гонимых»
  choice: Сохранён буквальный и допускающий несколько оттенков оборот «ищет гонимых».
  alternative: «вступается за гонимых» или «взыскивает за гонимых».
  rationale: Контекст может подразумевать Божье вмешательство ради преследуемых, но сам глагол означает прежде всего «искать». Более истолковательные варианты преждевременно устранили бы смысловую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка краткая и доступная; архаизмы избегаются, кроме укоренённого обозначения «ГОСПОДЬ». Местоимение «Его» написано с прописной буквы для ясной отсылки к ГОСПОДУ.
