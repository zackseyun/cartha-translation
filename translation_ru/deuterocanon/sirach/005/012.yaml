  text: Do not trust in deceitful wealth[b][a], for it will not profit in the day of wrath.
translation:
  language: ru
  text: Не полагайся на обманчивое богатство[b], потому что в день гнева оно не поможет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции этот стих читается иначе: «Если у тебя есть разумение, отвечай ближнему; если же нет, пусть рука твоя будет у твоих уст». Здесь перевод следует сохранившемуся еврейскому тексту, который существенно отличается от греческого.'
    reason: textual_variant
  - marker: b
    text: 'Возможные варианты: «ложное богатство», «богатство, нажитое обманом» или «богатство лжи». Еврейское выражение может обозначать как нечестно приобретённое богатство, так и богатство, которое в итоге оказывается ненадёжным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטַח
  choice: Не полагайся
  rationale: Естественно передаёт отрицательное наставление и идею возложения надежды, не усиливая запрет сверх еврейского текста.
- source_word: עַל נִכְסֵי שֶׁקֶר
  choice: на обманчивое богатство
  rationale: '«Богатство» передаёт собирательный смысл имущества и средств, а «обманчивое» сохраняет двусмысленность: оно может быть приобретено обманом или само оказаться ненадёжным.'
- source_word: כִּי
  choice: потому что
  rationale: Прямо выражает основание предостережения.
- source_word: לֹא יוֹעִילוּ
  choice: оно не поможет
  rationale: Передаёт значение отсутствия пользы или помощи; согласование в единственном числе естественно для русского собирательного существительного «богатство».
- source_word: בְּיוֹם עֶבְרָה
  choice: в день гнева
  rationale: Сохраняет устойчивую, торжественную формулу и силу слова עֶבְרָה, не уточняя прямо, чей это гнев.
theological_decisions:
- issue: Следует ли уточнять, что речь идёт именно о Божьем гневе или суде
  choice: в день гнева
  alternative: в день Божьего гнева; в день суда
  rationale: Еврейский текст называет гнев, но не указывает его субъекта и не заменяет его словом «суд»; перевод сохраняет эту богословскую напряжённость.
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающейся греческой традицией
  choice: Перевести сохранившийся еврейский текст как основной
  alternative: 'Греческое чтение: «Если у тебя есть разумение, отвечай ближнему; если же нет, пусть рука твоя будет у твоих уст»'
  rationale: Для данного места имеется надёжно засвидетельствованный еврейский текст; греческое расхождение следует отметить, но не подменять им основной перевод.
translation_notes:
  register: Современный литературный русский язык с кратким наставительным ритмом. Формулировка dignified, но понятна широкому читателю; субъект гнева намеренно не уточнён.
