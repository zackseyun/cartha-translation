  text: Будь скор слушать[c], а отвечай терпеливо[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с долготою духа» — еврейская идиома, обозначающая терпение и сдержанность.'
