    reason: alternative_reading
  - marker: c
    text: Греческий текст этого стиха существенно отличается от сохранившегося еврейского и, по-видимому, отражает иную текстовую форму. Перевод следует сохранившемуся еврейскому свидетельству как основному источнику.
    reason: textual_variant
lexical_decisions:
- source_word: הֱיֶה מְמַהֵר
  choice: Будь скор
  rationale: Императив с причастной формой выражает постоянную готовность и быстроту; «будь скор» сохраняет увещательный тон и звучит достойно по-русски.
- source_word: לְהַאֲזִין
  choice: на слушание
  rationale: Глагол означает внимательное слушание, а не простое восприятие звука. В сочетании «скор на слушание» этот активный смысл передаётся ясно и лаконично.
- source_word: וּבְאֶרֶךְ רוּחַ
  choice: с долготерпением
  rationale: Буквально «с долготой духа» — идиома терпения и сдержанности. «С долготерпением» сохраняет образную связь с продолжительностью и естественно выражает неспешную, выдержанную реакцию.
- source_word: הָשֵׁב
  choice: отвечай
  rationale: Здесь глагол имеет значение возвращения слова, то есть ответа. Русское «отвечай» естественно выражает это действие.
- source_word: פִּתְגָּם
  choice: словом
  rationale: Существительное может означать слово, изречение или высказывание. Творительный оборот «отвечай словом» сохраняет его лексическую самостоятельность и не сводит его безоговорочно к абстрактному «ответу».
