  text: Do not go after your heart and your eyes[b][a], to walk in evil desires.
translation:
  language: ru
  text: Не следуй за своим сердцем и своими глазами[a], предаваясь дурным желаниям.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не иди вслед за своим сердцем и своими глазами». Выражение «сердце и глаза» соединяет внутреннее желание с внешней привлекательностью увиденного.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая версия этого стиха существенно отличается: «И не говори: „Кто одолеет меня?“ — ибо Господь непременно взыщет с тебя». Здесь основным принят еврейский текст, а греческий сохранён как свидетельство иной текстовой традиции.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תֵּלֵךְ אַחֲרֵי
  choice: Не следуй за
  rationale: Сочетание הלך с אַחֲרֵי буквально означает «идти вслед за»; русское «следовать за» естественно передаёт этот образ и смысл подчинения чему-либо.
- source_word: לִבְּךָ וְעֵינֵיךָ
  choice: своим сердцем и своими глазами
  rationale: 'Сохранены оба конкретных образа: сердце обозначает внутреннее влечение, а глаза — внешнюю привлекательность увиденного. Возвратное «своим» естественно согласуется в русском с обращением на «ты».'
- source_word: לָלֶכֶת
  choice: предаваясь
  rationale: Буквально повторяется глагол «идти/ходить», однако буквальное «ходить в желаниях» по-русски неестественно. Деепричастие передаёт сопутствующий образ действий, не вводя жёсткой причинной связи.
- source_word: בַּחֲמוּדוֹת רָעָה
  choice: дурным желаниям
  rationale: חֲמוּדוֹת может обозначать желанные вещи, влечения или страстные желания; в данном контексте сочетание сердца и глаз указывает на влечение. «Дурным» ясно передаёт нравственную оценку רָעָה, не усиливая её до более узкого значения «порочным».
theological_decisions:
- issue: Антропологический образ «сердце и глаза»
  choice: Сохранить в основном тексте конкретные слова «сердце» и «глаза»
  alternative: Не следуй собственным желаниям; не поддавайся своим страстям
  rationale: Еврейский текст различает внутреннее влечение и привлекательность увиденного. Обобщающий перевод устранил бы библейскую образность и возможные межтекстовые связи.
- issue: Смысл выражения חֲמוּדוֹת רָעָה
  choice: дурные желания
  alternative: порочные влечения; желанные злые вещи
  rationale: Фраза допускает предметное и абстрактное понимание, но упоминание сердца и глаз делает значение «желания» наиболее связным. Выбор не уточняет вид этих желаний и тем самым не привносит конфессионального толкования.
- issue: Расхождение еврейского и греческого свидетельств
  choice: Следовать еврейскому тексту Каханы, отметив греческий вариант в сноске
  alternative: 'Принять греческий текст: «Не говори: „Кто одолеет меня?“…»'
  rationale: Предоставленный еврейский источник имеет высокую степень уверенности и является основным источником задания; греческое свидетельство отражает существенно иную параллельную традицию, которую нельзя молча смешивать с еврейским текстом.
translation_notes:
  register: Современный литературный русский язык, обращение на «ты» в соответствии с формами единственного числа исходного текста. Тон краткий и наставительный. Оборот «предаваясь дурным желаниям» выбран вместо неестественного буквального «ходить в дурных желаниях»; конкретная образность сердца и глаз сохранена.
