  text: Do not delay to return to him[b][a], and do not put it off from day to day.
translation:
  language: ru
  text: Не медли вернуться к нему[a] и не откладывай это со дня на день[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«К нему», вероятно, означает «к Богу»: речь идёт об обращении к Нему, однако в еврейском тексте здесь стоит только местоимение.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «не переноси это с одного дня на другой». Еврейский глагол имеет не вполне ясную форму, но контекст указывает на повторяющееся откладывание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּאַחֵר
  choice: Не медли
  rationale: Отрицательная повелительная конструкция с глаголом אחר запрещает задержку; «не медли» точно, естественно и лаконично передаёт её силу.
- source_word: לָשׁוּב
  choice: вернуться
  rationale: Глагол שוב означает «возвратиться, обратиться назад» и в данном контексте, вероятно, подразумевает нравственное возвращение к Богу, не требуя добавления специального богословского термина.
- source_word: אֵלָיו
  choice: к нему
  rationale: В еврейском тексте стоит местоимение без названного в самом стихе лица; перевод сохраняет эту сдержанность и не подставляет отсутствующий титул «Бог» или «Господь».
- source_word: אַל תִּתְעַבֵּר
  choice: не откладывай это
  rationale: Форма глагола трудна, однако параллелизм с первым полустишием и следующее выражение о последовательных днях ясно указывают на отсрочку. Местоимение «это» естественно отсылает к возвращению.
- source_word: מִיּוֹם אֶל יוֹם
  choice: со дня на день
  rationale: Устойчивое современное русское выражение точно передаёт буквальный образ и смысл повторяющегося откладывания.
theological_decisions:
- issue: Следует ли прямо назвать возвращение покаянием и возвращением к Богу
  choice: Сохранить буквальное «вернуться к нему»
  alternative: «обратиться к Богу» или «покаяться и вернуться к Господу»
  rationale: Контекст, вероятно, указывает на Бога и покаяние, но сам еврейский стих содержит только местоимение и глагол «вернуться». Эксплицирование в основном тексте сняло бы сохранённую источником неявность.
- issue: Как передать трудный глагол תִּתְעַבֵּר
  choice: «не откладывай это»
  alternative: «не медли», «не пропускай», «не будь небрежен»
  rationale: Контекстуальное значение отсрочки лучше всего соответствует параллелизму и обороту «со дня на день». Греческий текст этого стиха существенно расходится с еврейской традицией и потому не определяет перевод.
translation_notes:
  register: Современный литературный русский язык; краткое увещевание передано ясно и достойно. Строчная буква в «нему» сохраняет формальную неопределённость местоимения, а вероятный божественный референт пояснён в сноске.
