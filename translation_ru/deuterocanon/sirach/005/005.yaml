base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/005/005.yaml
  text: Do not say[a], “I have sinned[b], and what has been done to me? Nothing,” for God is patient.
translation:
  language: ru
  text: 'Не говори: «Я согрешил — и что мне за это будет? Ничего»[b], ведь Бог не скор на гнев[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «долог ноздрями»; это еврейская идиома со значением «медлен на гнев». Возможный перевод: «долготерпелив».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте иначе: «Не будь без страха в отношении искупления, прибавляя грех ко грехам». Еврейский текст предостерегает от мысли, будто грех останется без последствий, поскольку Бог не скор на гнев; оба чтения предостерегают от самонадеянности в отношении греха и искупления.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Не говори
  rationale: Прямой отрицательный императив естественно и точно передаётся прямым запретом.
- source_word: חָטָאתִי
  choice: Я согрешил
  rationale: Еврейский перфект обозначает совершённый грех, последствия которого говорящий самонадеянно отрицает.
- source_word: וְמַה יֵעָשֶׂה לִי
  choice: и что мне за это будет?
  rationale: Форма допускает значение «что будет мне сделано?» или шире «что со мной случится?». Русское выражение передаёт ожидаемые последствия естественно, не утверждая, что речь идёт только о прошлом.
- source_word: מְאוּמָה
  choice: Ничего
  rationale: Слово употреблено как краткий ответ на риторический вопрос и означает полное отсутствие последствий.
- source_word: כִּי
  choice: ведь
  rationale: Сохраняет пояснительную связь с предшествующим предостережением и звучит естественно по-русски.
- source_word: אֵל
  choice: Бог
  rationale: Обычное и контекстуально уместное обозначение Бога.
- source_word: אֶרֶךְ אַפַּיִם
  choice: не скор на гнев
  rationale: Это ясная современная передача еврейской идиомы, буквально описывающей медленность Божьего гнева; она сохраняет упоминание именно гнева, а не только общего терпения.
theological_decisions:
- issue: Смысл Божьего долготерпения
  choice: Бог не скор на гнев
  alternative: Бог терпелив / Бог долготерпелив
  rationale: 'Фраза сохраняет напряжение текста: отсрочка последствий свидетельствует о Божьем долготерпении, но не даёт основания считать грех безнаказанным.'
- issue: Расхождение еврейского и греческого текста
  choice: Основной текст переведён по засвидетельствованному еврейскому чтению
  alternative: 'Греческое чтение: «Не будь беспечен относительно искупления, прибавляя грех ко грехам»'
  rationale: При высокой уверенности еврейского свидетельства оно определяет основной перевод; существенно отличающееся греческое чтение сохраняется в примечании без попытки искусственно объединить оба текста.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, назидательная и доступная. Разговорно естественное «что мне за это будет?» передаёт вопрос о последствиях, а «не скор на гнев» сохраняет библейский образ без архаической тяжеловесности.
