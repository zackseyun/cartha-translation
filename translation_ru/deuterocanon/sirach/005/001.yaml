  text: Do not rely on your wealth[a], and do not say, “I have the power.”
translation:
  language: ru
  text: 'Не полагайся на своё богатство и не говори: «Мне достаточно собственной силы».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская фраза буквально говорит о «силе моей руки»; греческий текст передаёт её смысл как «мне достаточно» или «я самодостаточен».
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּשָּׁעֵן
  choice: Не полагайся
  rationale: Глагол שׁען буквально описывает опору на что-либо, а в переносном употреблении означает доверие или надежду. «Не полагайся» естественно передаёт этот смысл в современном русском языке.
- source_word: חֵילֶךָ
  choice: своё богатство
  rationale: חַיִל может означать силу, могущество, средства или богатство. Греческое χρήμασίν («деньги, имущество») подтверждает здесь имущественный смысл.
- source_word: יֵשׁ לְאֵל יָדִי
  choice: Мне достаточно собственной силы
  rationale: Еврейская фраза сжата и буквально связывает способность с «силой руки». Перевод сохраняет мысль о самодостаточности, основанной на собственной силе; греческое Αὐτάρκη μοί ἐστιν подтверждает оттенок «мне достаточно».
theological_decisions:
- issue: Передача трудной еврейской фразы с учётом греческой параллели
  choice: Предостережение против уверенности в достаточности собственной силы
  alternative: «Моя рука сильна» / «У меня есть сила»
  rationale: Еврейский текст остаётся основным и сохраняет образ собственной силы, тогда как греческая параллель помогает выявить подразумеваемую самодостаточность. Формулировка не сводит фразу ни только к обладанию силой, ни только к общему утверждению «мне всего хватает».
translation_notes:
  register: Современный литературный русский язык; краткая назидательная формулировка с сохранением параллелизма двух запретов. Местоимение «собственной» подчёркивает самоуверенность, выраженную еврейским оборотом, без привнесения конфессиональной терминологии.
