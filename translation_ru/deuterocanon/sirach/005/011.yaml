lexical_decisions:
- source_word: פִתאוֹם
  choice: внезапно
  rationale: Передаёт обычное наречное значение и подчёркивает неожиданность наступления суда.
- source_word: יֵצֵא
  choice: изойдёт
  rationale: Сохраняет образ гнева, который «выходит», не сводя выражение к менее образному «вспыхнет».
- source_word: זַעְמוֹ
  choice: гнев Его
  rationale: Передаёт силу זעם; местоименный суффикс сохранён, а подразумеваемый Бог не назван прямо сверх еврейского текста.
- source_word: וּבְעֵת
  choice: и во время
  rationale: Формально и естественно воспроизводит временную конструкцию.
- source_word: נָקָם
  choice: возмездия
  rationale: В современном литературном русском сохраняет судебно-карательный смысл, не вызывая столь сильной ассоциации с личной мстительностью, как «месть».
- source_word: תִּסָּפֶה
  choice: ты будешь сметён
  rationale: Сохраняет яркий образ гибели или уничтожения и пассивную направленность действия.
theological_decisions:
- issue: Подразумеваемый референт местоименного суффикса в «гнев Его»
  choice: Сохранить местоимение; из контекста подразумевается Бог/Господь.
  alternative: Прямо написать «гнев Бога» либо отнести местоимение к неопределённому властителю.
  rationale: Еврейский стих не повторяет Божьего имени; сохранение местоимения не устраняет формальную неоднозначность, хотя контекст естественно указывает на Бога.
translation_notes:
  register: Современный литературный русский с достоинством мудростной речи. «Изойдёт» несколько возвышенно, но понятно и сохраняет исходный образ; «возмездие» естественно для контекста Божьего суда. Маркер текстологического примечания поставлен после первой части стиха, где становится очевидным расхождение с греческой версией.
