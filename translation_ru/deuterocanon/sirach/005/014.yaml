translation:
  language: ru
  text: Будь твёрд в своём разумении, и да будет слово твоё единым.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этого стиха существенно иной: «Не слыви шептуном и не злоумышляй своим языком; ибо вору — стыд, а двуличному — суровое осуждение». Он подчёркивает предостережение против двуличной речи, созвучное словам «да будет слово твоё единым».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֶה סָמוּךְ עַל דַּעְתֶּךָ
  choice: Будь твёрд в своём суждении
  rationale: Императив הֱיֶה передаёт прямое наставление; סָמוּךְ выражает устойчивость и твёрдость, а דַּעַת здесь естественно понимать как обдуманное суждение или разумение, а не просто запас знаний.
- source_word: וְאֶחָד יְהִי דְבָרֶךָ
  choice: и да будет слово твоё единым
  rationale: Юссив יְהִי передан увещевательным «да будет». Буквальное «единым» сохраняет образ еврейского אֶחָד и подразумевает цельную, последовательную речь без двуличия, не сводя выражение к пояснительному пересказу.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и существенно отличающейся греческой параллели
  choice: Основной текст переведён непосредственно с еврейского как призыв к твёрдому суждению и единству слова; отличие греческого свидетеля отмечено в сноске.
  alternative: Перевести по греческому тексту как предостережение от злоречия, ловушки собственного языка и двуязычия.
  rationale: При наличии надёжно засвидетельствованного еврейского текста ему отдаётся первенство. Вместе с тем греческая форма стиха сохраняет важное древнее разночтение и подтверждает, что образ единого слова может иметь этический оттенок недвуличной речи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Формула «да будет» сохраняет краткость и увещевательную силу оригинала; архаичные или конфессионально окрашенные обороты не используются.
