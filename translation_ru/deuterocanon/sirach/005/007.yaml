translation:
  language: ru
  text: Не рассчитывай на прощение, чтобы прибавлять грех ко греху.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Не медли обратиться к Господу и не откладывай со дня на день, потому что внезапно выйдет гнев Господа и во время возмездия ты погибнешь». Сохранившийся здесь еврейский текст короче и особо предостерегает от того, чтобы рассчитывать на прощение, продолжая грешить.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶל סְלִיחָה
  choice: на прощение
  rationale: При בָּטַח предлог обозначает то, на что полагаются; русское сочетание «надеяться на прощение» естественно передаёт эту связь.
- source_word: אַל תִּבְטָח
  choice: не надейся
  rationale: Форма выражает запрет, а глагол בטח — доверие или опору. Здесь «не надейся» ясно передаёт предостережение против самонадеянного расчёта на прощение.
- source_word: לְהוֹסִיף
  choice: чтобы прибавлять
  rationale: Инфинитив связывает надежду на прощение с целью или следствием — продолжением греха. Несовершенный вид «прибавлять» передаёт повторяемое накопление проступков.
- source_word: עָוֹן עַל עָוֹן
  choice: грех ко греху
  rationale: עָוֹן может означать грех, вину или беззаконие; в данном сочетании речь идёт о прибавлении одного проступка к другому. «Грех ко греху» кратко и естественно сохраняет образ накопления.
theological_decisions:
- issue: Связь Божьего прощения с продолжающимся грехом
  choice: Стих запрещает рассчитывать на прощение как на основание продолжать грешить.
  alternative: Можно понимать его шире как общее предостережение против чрезмерной уверенности в помиловании.
  rationale: Еврейский синтаксис непосредственно связывает надежду на прощение с прибавлением греха ко греху. Это не отрицание возможности прощения, а осуждение самонадеянного злоупотребления им. Греческая параллель развивает ту же мысль как предостережение не откладывать обращение до наступления суда.
translation_notes:
  register: Краткое наставление в современном литературном русском языке. Формулировка сохраняет строгость текста, избегает архаизма «беззаконие» и не превращает предостережение в отрицание самого прощения.
