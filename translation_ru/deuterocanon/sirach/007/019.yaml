translation:
  language: ru
  text: 'Не пренебрегай разумной женой: женщина, наделённая обаянием, ценнее жемчуга.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассудительной женщиной» или «мудрой женой». Еврейское слово может означать как жену, так и женщину, а определение подчёркивает разумность и здравый смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейскую вторую строку можно также передать: «женщина, исполненная привлекательности (или благосклонности), ценнее жемчуга». Слово, переведённое как «жемчуг», может также обозначать кораллы либо иные драгоценности. В греческом тексте: «Не упусти мудрую и добрую женщину, ибо её обаяние дороже золота».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְאַס
  choice: Не пренебрегай
  rationale: Глагол מָאַס означает отвергать, презирать или относиться с пренебрежением. Русское «не пренебрегай» естественно передаёт наставительный тон, не усиливая его до открытой ненависти.
- source_word: אִשָּׁה מַשְׁכֶּלֶת
  choice: разумной женой
  rationale: Форма от שכל указывает на рассудительность, понимание и здравый смысл. «Разумная» сохраняет этот смысл; в контексте домашних наставлений אִשָּׁה естественно понимать как «жена», хотя возможно и «женщина».
- source_word: וְטוֹבַת חֵן
  choice: и добрая благосклонность
  rationale: Сжатая еврейская конструкция буквально связывает «добро/благая» с חֵן — благосклонностью, расположением, привлекательностью или благодатью. Перевод сохраняет союз «и» и не вводит отсутствующее в еврейском тексте притяжательное «её».
- source_word: מִפְּנִינִים
  choice: ценнее жемчуга
  rationale: פְּנִינִים обозначает драгоценный предмет и может пониматься как жемчуг, кораллы или драгоценные камни. «Жемчуг» — традиционный и контекстуально уместный вариант; сравнительная конструкция естественно передана словом «ценнее».
theological_decisions:
- issue: Значение אִשָּׁה в бытовом наставлении
  choice: жена
  alternative: женщина
  rationale: Еврейское слово допускает оба значения. Контекст семейных и домашних наставлений поддерживает значение «жена», но неоднозначность отмечена в сноске.
- issue: Отнесение חֵן к женщине
  choice: не добавлять притяжательное «её» в основном тексте
  alternative: «её привлекательность / любезность»
  rationale: Еврейская фраза грамматически сжата и не содержит явного местоименного суффикса. Основной текст сохраняет эту открытость, не устраняя возможную смысловую связь с предшествующей женой.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным наставительным звучанием. Сохранена сжатость и некоторая неоднозначность еврейской второй части; греческое разночтение вынесено в сноску.
