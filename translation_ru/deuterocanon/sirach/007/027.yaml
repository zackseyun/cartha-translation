  text: With all your heart honor your father[a], and do not forget the labor pains of your mother.
translation:
  language: ru
  text: Всем сердцем почитай своего отца и не забывай родовых мук своей матери.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст во второй части выражен сжато: буквально — «и мать, родившую тебя, не забывай»; греческая параллель уточняет: «не забывай родовых мук своей матери».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל לִבְּךָ
  choice: Всем сердцем
  rationale: Естественная русская библейская идиома, точно передающая полноту и искренность почтения.
- source_word: כַּבֵּד
  choice: почитай
  rationale: В отношении родителей глагол כבד означает оказывать подобающую честь и уважение; «почитай» точно и естественно передаёт этот смысл.
- source_word: לְאָבִיךָ
  choice: своего отца
  rationale: Прямо передаёт личное родственное обозначение; возвратное местоимение естественно при русском повелительном наклонении.
- source_word: וְאֵם יוֹלַדְתְּךָ
  choice: своей матери
  rationale: Еврейское выражение буквально говорит о «матери, родившей тебя». В переводе материнство выражено прямо, а образ рождения сохранён в словах «родовых мук» на основании греческой параллели.
- source_word: אַל תִּשֶּׁה
  choice: не забывай
  rationale: Такое понимание подтверждается греческим μὴ ἐπιλάθῃ и создаёт связный смысл в данном контексте.
- source_word: μητρὸς ὠδῖνας
  choice: родовых мук своей матери
  rationale: Греческая параллель ясно называет страдания матери при родах. «Родовые муки» — современное, понятное и достаточно возвышенное выражение.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и уточняющей греческой параллели
  choice: Еврейский текст принят за основу, а сжатая последняя часть раскрыта по греческой параллели как призыв не забывать родовых мук матери.
  alternative: 'Перевести еврейскую строку без греческого уточнения: «и не забывай мать, родившую тебя».'
  rationale: Еврейская формулировка сжата, тогда как греческий текст сохраняет ясное чтение о родовых муках. Основной текст следует засвидетельствованному параллельному смыслу, а сноска делает это решение прозрачным.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской серьёзностью. «Почитай» сохраняет достоинство заповеди, а «родовые муки» ясно передаёт греческое уточнение без архаизма и излишней клиничности.
