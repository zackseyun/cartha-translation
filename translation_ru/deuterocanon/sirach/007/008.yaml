translation:
  language: ru
  text: Не прибавляй греха к греху[a], ведь даже за один грех не останешься без наказания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более буквальный перевод начала стиха: «Не связывай грех вторично». Смысл, по-видимому: не повторяй греха. Последние слова можно также перевести: «не будешь оправдан» или «не будешь признан невиновным».'
    reason: Сохранены необычная метафора еврейского текста и судебный оттенок заключительного глагола.
lexical_decisions:
- source_word: אַל תִּקְשׁוֹר
  choice: Не прибавляй
  rationale: אַל выражает прямой запрет. Буквальное значение תִּקְשׁוֹר — «связывать», что подтверждается греческим καταδεσμεύσῃς, однако сочетание «связывать грех» в современном русском неясно. По контексту повторения естественно передано «прибавляй».
- source_word: לְשָׁנוֹת חֵטְ
  choice: грех ко греху
  rationale: לְשָׁנוֹת указывает на повторение, а חֵטְ означает «грех». Русская конструкция «грех ко греху» ясно и кратко передаёт совершение греха вновь, сохраняя образ накопления, принятый в основном тексте.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание запрета; «ведь» естественно сохраняет краткую причинную связь.
- source_word: בְאַחַת
  choice: и за один
  rationale: 'Буквально «в одном / при одном»; здесь подразумевается один грех. Частица «и» передаёт усилительный смысл: даже единственный грех не остаётся без последствий.'
- source_word: לֹא תִנָּקֶה
  choice: не останешься без наказания
  rationale: Nifal глагола נקה допускает значения «быть чистым», «быть оправданным» и «остаться без наказания». В предостерегающем контексте последнее естественно по-русски; судебный оттенок отмечен в сноске.
theological_decisions:
- issue: Передать ли לֹא תִנָּקֶה судебным выражением или указанием на наказание
  choice: не останешься без наказания
  alternative: не будешь оправдан; не будешь признан невиновным
  rationale: Еврейский глагол и греческое οὐκ ἀθῷος ἔσῃ допускают судебный оттенок, но контекст наставления прежде всего предупреждает, что даже один грех не остаётся без последствий. Неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткий наставительный тон. Формулировка «грех ко греху» понятна обычному читателю и не перегружает основной текст неясной буквальной метафорой, которая вынесена в сноску.
