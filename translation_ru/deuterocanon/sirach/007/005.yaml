  text: Do not seek to become a ruler if you have no strength to put an end to insolence[a].
translation:
  language: ru
  text: Не стремись стать правителем, если у тебя нет сил положить конец дерзости.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Не оправдывай себя перед Господом и перед царём не выставляй себя мудрецом»; это чтение отражает существенно иную форму стиха.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּבַקֵּשׁ
  choice: Не стремись
  rationale: В запрете глагол בקש означает «искать, добиваться, стремиться». «Не стремись» естественно передаёт направленное желание занять положение власти.
- source_word: לִהְיוֹת מוֹשֵׁל
  choice: стать правителем
  rationale: מוֹשֵׁל обозначает правителя или управляющего; «стать правителем» сохраняет смысл предостережения против стремления к власти.
- source_word: חַיִל
  choice: сил
  rationale: חַיִל может означать силу, способность или ресурсы. Множественное «сил» по-русски естественно охватывает не только физическую мощь, но и практическую способность управлять.
- source_word: לְהַשְׁבִּית
  choice: положить конец
  rationale: Каузативная форма от שבת означает заставить прекратиться; выражение «положить конец» передаёт решительное пресечение.
- source_word: זָדוֹן
  choice: дерзости
  rationale: זָדוֹן обозначает гордую, самонадеянную и вызывающую неправоту. «Дерзость» сохраняет её общественный и нравственный оттенок, не расширяя значения до всякого зла.
- source_word: μὴ δικαίου ἔναντι Κυρίου, καὶ παρὰ βασιλεῖ μὴ σοφίζου
  choice: учтено как вторичное свидетельство, но не положено в основу главного текста
  rationale: Греческий текст существенно расходится с сохранившимся еврейским и, вероятно, отражает иную форму стиха; это расхождение отмечено в сноске.
theological_decisions:
- issue: Расхождение еврейской и греческой форм Сир 7:5
  choice: Основной текст переведён по сохранившемуся еврейскому тексту
  alternative: «Не оправдывай себя перед Господом и перед царём не выставляй себя мудрецом»
  rationale: Для Книги Сираха при наличии еврейского текста он служит первичным источником. Существенно отличающееся греческое чтение сохранено в сноске ради текстологической прозрачности.
translation_notes:
  register: 'Современный литературный русский язык; краткая назидательная формулировка сохраняет достоинство и прямоту еврейского текста. «Сил» намеренно оставлено широким по смыслу: речь может идти о способности, власти и практических ресурсах.'
