translation:
  language: ru
  text: Не желай повторять ложь[a], потому что её конец не будет приятным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не желай лгать поверх лжи»; вероятно, имеется в виду добавлять ложь ко лжи или повторять её. В греческом тексте: «не желай никакой лжи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּחְפֹּץ
  choice: Не желай
  rationale: Передаёт запрет-наставление и сохраняет волевой оттенок глагола חפץ — «желать, находить удовольствие».
- source_word: לְכַחֵש עַל כָּחַש
  choice: повторять ложь
  rationale: Буквально выражение близко к «лгать поверх лжи» и может означать добавлять ложь ко лжи или повторять её; ясная русская формулировка сохраняет накопительный смысл. Греческая параллель расширяет его до практики всякой лжи.
- source_word: כִּי
  choice: потому что
  rationale: Естественно вводит основание предшествующего запрета.
- source_word: תִקְוָתוֹ
  choice: её конец
  rationale: Хотя תקוה обычно означает «надежда, ожидание», здесь речь, вероятно, о том, к чему приводит ложь. «Конец» передаёт итог, не перегружая русский текст.
- source_word: לֹא תִנְעָם
  choice: не будет приятным
  rationale: Сохраняет конкретную семантику נעם — «быть приятным, сладостным» — и будущий оттенок еврейской глагольной формы; греческое «не ко благу» подтверждает отрицательную оценку результата.
