lexical_decisions:
- source_word: לֶחֶם
  choice: хлеб
  rationale: Основное значение слова — «хлеб»; контекст не даёт достаточных оснований обобщать его до «пищи».
- source_word: אַבִּירִים
  choice: могучих
  rationale: Слово может обозначать могучих или сильных, а в отдельных контекстах — быков. Здесь референт неясен, поэтому буквальное «могучих» сохраняет подлинную неоднозначность.
- source_word: וּתְרוּמַת יָד
  choice: и приношение руки
  rationale: Формулировка сохраняет образ еврейского текста и не навязывает ему более узкого культового толкования; существенно отличающийся греческий вариант приведён в сноске.
- source_word: זִבְחֵי צֶדֶק
  choice: жертвы праведности
  rationale: Формальная конструкция передаёт как нравственный, так и культовый оттенок слова צדק, не сводя его лишь к качеству «правильные».
- source_word: וּתְרוּמַת קֹדֶשׁ
  choice: и священное приношение
  rationale: Передаёт посвящённый, культовый характер приношения естественным современным русским выражением.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческой параллели
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству, а греческое чтение дано в сноске.
  alternative: «И протяни руку твою бедному, чтобы благословение твоё стало полным».
  rationale: При наличии еврейского текста Сираха он служит главным источником. Греческая версия выражает здесь совершенно иную мысль, что может указывать на иной еврейский протограф или повреждение одной из текстовых традиций; поэтому расхождение нельзя скрывать.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, соответствующим культовой лексике регистром. Необычность выражений «хлеб могучих» и «приношение руки» сохранена намеренно ввиду трудности и текстовой нестабильности еврейского чтения.
