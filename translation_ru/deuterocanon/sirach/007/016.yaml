  text: Humble pride very much[a], for the hope of man is worms.
translation:
  language: ru
  text: Весьма и весьма смири гордость[a], ибо надежда человека — черви.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели (Свит) сказано: «Не причисляй себя ко множеству грешников». По-видимому, это иная текстовая традиция, а не небольшое разночтение.'
    reason: textual_variant
lexical_decisions:
- source_word: מְאֹד מְאֹד
  choice: весьма и весьма
  rationale: Повтор наречия резко усиливает повеление; сохранение повтора передаёт выразительность еврейского текста, не сводя её к одному усилителю.
- source_word: הַשְׁפִּיל
  choice: смири
  rationale: Побудительная форма породы хифиль от שׁפל означает активное принижение или смирение; «смири» естественно сочетается с «гордость» и сохраняет силу повеления.
- source_word: גַּאֲוָה
  choice: гордость
  rationale: Широкое и прямое соответствие существительному со значением гордости или самовозвышения; «высокомерие» было бы уже и истолковывающе.
- source_word: תִקְוַת
  choice: надежда
  rationale: Обычное значение слова — «надежда, ожидание». Необычная острота выражения сохранена, а не заменена истолкованием вроде «конец» или «участь».
- source_word: אֱנוֹשׁ
  choice: человека
  rationale: Слово обозначает человека с оттенком его бренности. Русское единственное число сохраняет обобщённый антропологический смысл без добавления отсутствующего в тексте определения «смертного».
- source_word: רִמָּה
  choice: черви
  rationale: Слово обозначает червей, связанных с тлением. Множественное число естественно в русском образе телесного распада и соответствует смыслу данного изречения.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческой параллели
  choice: 'Основной текст следует еврейскому чтению: «Весьма и весьма смири гордость, ибо надежда человека — черви».'
  alternative: 'Греческая параллель: «Не причисляй себя ко множеству грешников».'
  rationale: При наличии еврейского текста перевод основывается прежде всего на нём. Греческое чтение не является близким вариантом формулировки, а отражает иную текстовую традицию, поэтому оно приведено в сноске без попытки согласовать два разных чтения.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной и достойной формой. Повтор «весьма и весьма» намеренно сохраняет семитское усиление; тире подчёркивает резкий итог изречения. Маркер сноски поставлен после первой смысловой части, где расходится греческая традиция.
