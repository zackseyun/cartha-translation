translation:
  language: ru
  text: Есть у тебя скот — присматривай за ним[a]; и если он полезен[b], оставь его у себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «смотри [своими] глазами», то есть внимательно следи за скотом.'
    reason: lexical_alternative
  - marker: b
    text: Точный оттенок еврейского слова אֻמָּנָה здесь не вполне ясен; греческий параллельный текст передаёт его как «полезен» или «пригоден».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהֵמָה לְךָ
  choice: Есть у тебя скот
  rationale: Именная конструкция с לְךָ выражает обладание. «Скот» естественно обозначает домашних хозяйственных животных и согласуется с греческим κτήνη.
- source_word: רְאֵה עֵינֶיךָ
  choice: присматривай за ним
  rationale: 'Буквально: «смотри [своими] глазами». В контексте это призыв внимательно следить за скотом и заботиться о нём; русский глагол передаёт смысл без неестественной буквальности.'
- source_word: אֻמָּנָה
  choice: полезен
  rationale: Точный оттенок редкого слова здесь не вполне ясен. Греческое χρήσιμα поддерживает значение «полезный, пригодный»; «прибыльный» было бы более узким толкованием.
- source_word: הַעֲמִידָהּ
  choice: оставь его у себя
  rationale: Каузатив от עמד буквально означает «поставь/удержи стоящим», а в данном контексте — сохрани во владении. Греческое ἐμμενέτω σοι также указывает на продолжение обладания.
