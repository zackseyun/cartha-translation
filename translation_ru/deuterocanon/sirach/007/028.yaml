base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/028.yaml
  text: Remember that if not for them[a], you would not have come into the world[b]; and what can you do for them as they have done for you?
translation:
  language: ru
  text: 'Помни: если бы не они[a], ты не пришёл бы в мир. И чем ты можешь отплатить им за то, что они сделали для тебя?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть твои родители; это следует из ближайшего контекста, хотя в самом стихе они прямо не названы.
    reason: cross_reference
  - marker: b
    text: 'Еврейский текст можно передать более буквально: «И что ты делаешь для них, как они поступают с тобой?» Глагол может обозначать действие по отношению к кому-либо или воздаяние. Греческий текст прямо выражает мысль об ответном воздаянии: «Что ты воздашь им в ответ на то, что они сделали для тебя?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכוֹר
  choice: Помни
  rationale: Прямо передаёт повелительную форму זכר и звучит естественно и весомо в современном русском языке.
- source_word: לוּלֵי הֵם
  choice: если бы не они
  rationale: Передаёт еврейскую конструкцию контрфактической зависимости; местоимение сохранено, а его референт определяется ближайшим контекстом.
- source_word: לֹא בָאתָ לָעוֹלָם
  choice: ты не пришёл бы в мир
  rationale: Сохраняет образное выражение исходного текста буквально и понятно; речь идёт о появлении на свет благодаря родителям.
- source_word: וּמָה אַתָּה עוֹשֶׂה לָהֶם
  choice: И чем ты можешь отплатить им
  rationale: Еврейский текст буквально допускает «что ты делаешь им/для них», но риторический смысл взаимного воздаяния подтверждается продолжением с גמל и греческим ἀνταποδώσεις. Модальный оборот передаёт невозможность соразмерной отдачи, не превращая её в прямое утверждение.
- source_word: שֶׁהֵם גּוֹמְלִים לָךְ
  choice: за то, что они сделали для тебя
  rationale: גמל допускает значения «воздавать», «оказывать» и «делать добро». В родительском контексте русский оборот естественно передаёт оказанное благодеяние, сохраняя общность формулировки.
theological_decisions:
- issue: К кому относится местоимение «они»
  choice: Сохранить местоимение в основном тексте, пояснив в сноске, что речь о родителях
  alternative: Вставить «твои родители» непосредственно в стих
  rationale: Еврейский и греческий тексты оставляют референт местоименным, тогда как ближайший контекст ясно говорит об отце и матери. Такое решение сохраняет форму источника без утраты понятности.
- issue: Характер ответного деяния детям по отношению к родителям
  choice: Передать вопрос через «отплатить», оставив риторическую несоизмеримость открытой
  alternative: «Что ты можешь сделать для них, как они сделали для тебя?»
  rationale: Греческая параллель прямо употребляет ἀνταποδώσεις — «воздашь, отплатишь», а еврейское גמל также связано с воздаянием. «Отплатить» делает смысл ясным, но не вводит доктринального вывода о том, каким именно должно быть воздаяние.
translation_notes:
  register: Современный литературный русский язык с краткой, наставительной интонацией. Синтаксис разделён на два предложения ради естественного ритма. Обращение дано в мужском роде согласно грамматической форме еврейского текста; лексика общепонятна и не содержит конфессионально окрашенных добавлений.
