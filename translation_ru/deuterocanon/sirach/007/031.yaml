base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/031.yaml
  text: Honor God and honor the priest[a], and give them their portion[b], as you were commanded.
translation:
  language: ru
  text: Почитай Бога и оказывай честь священнику[a]; отдай им их долю[b], как тебе было заповедано.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Бойся Господа и прославляй священника, и отдай ему его долю, как заповедано тебе от начала»; далее следует более полный перечень положенных священникам приношений.'
    reason: alternative_reading
  - marker: b
    text: 'В еврейском тексте буквально «их долю» — во множественном числе, вероятно, о доле, положенной священникам в целом. В греческом параллельном тексте число согласовано с единственным: «ему его долю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד
  choice: почитай
  rationale: Пиэль повелительного глагола כבד означает воздавать должную честь. «Почитай» естественно и точно передаёт нравственный императив.
- source_word: אֵל
  choice: Бога
  rationale: Еврейское אֵל — ясное обозначение Бога. Основной текст следует сохранившемуся еврейскому чтению, а не греческому κύριον («Господа»).
- source_word: וַהֲדַר
  choice: оказывай честь
  rationale: Форма от הדר выражает почтительное, достойное отношение. Такое выражение сохраняет смысловую близость к первому повелению, но отражает различие еврейских глаголов и не создаёт тяжёлого повтора.
- source_word: כֹּהֵן
  choice: священнику
  rationale: 'Единственное число имеет обобщённое, институциональное значение: речь идёт о представителе священства.'
- source_word: וְתֵן
  choice: отдай
  rationale: Повелительная форма означает «дай». В контексте установленной доли «отдай» естественно указывает на то, что она причитается священникам, не превращая дар в денежную выплату.
- source_word: חֶלְקָם
  choice: им их долю
  rationale: Местоименный суффикс стоит во множественном числе. Перевод сохраняет это число, хотя непосредственно перед ним упомянут священник в обобщённом единственном числе.
- source_word: כַּאֲשֶׁר צֻוֵּיתָה
  choice: как тебе было заповедано
  rationale: Пассивная форма указывает на ранее данное адресату повеление. Формулировка точна и соответствует возвышенному, но современному русскому регистру.
theological_decisions:
- issue: Божественный титул в первой части стиха
  choice: Передать еврейское אֵל словом «Бог»
  alternative: Следовать греческому параллельному тексту и перевести «Господь»
  rationale: Приоритет отдаётся ясному сохранившемуся еврейскому тексту. Отличие греческого свидетеля отмечено в сноске, но не внесено в основной текст.
- issue: Число притяжательного суффикса в חֶלְקָם
  choice: 'Сохранить множественное число: «им их долю»'
  alternative: 'Согласовать с единственным числом: «ему его долю» или «долю священника»'
  rationale: Еврейский суффикс множественного числа, вероятно, относит положенную долю к священникам как к группе, тогда как «священник» употреблён как представитель служения. Сглаживание устранило бы подлинную грамматическую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с кратким, назидательным и достойным звучанием. «Почитай» и «оказывай честь» передают два близких, но различных еврейских глагола. Точка с запятой помогает ясно отделить требование почтения от требования отдать положенную долю.
