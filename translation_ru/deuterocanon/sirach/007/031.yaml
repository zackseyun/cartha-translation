  source_fidelity: 'Основной текст точно следует ясному еврейскому свидетельству: אֵל передано как «Бога», два последовательных повеления о почтении сохранены, а множественный суффикс в חֶלְקָם отражён в «им их долю». Формула «как тебе было заповедано» адекватно передаёт пассивное צֻוֵּיתָה. Греческое чтение не подменяет еврейский основной текст и корректно отмечено в сноске.'
  naturalness: «Почитай Бога и оказывай честь священнику; отдай им их долю, как тебе было заповедано» звучит как современный литературный русский с уместно сжатым назидательным регистром. Сочетание обобщённого единственного «священнику» с последующим множественным «им» намеренно сохраняет грамматическую особенность еврейского текста и остаётся понятным в русском контексте.
  terminology: «Бог», «священник», «доля» и «заповедано» выбраны точно и без конфессионально обусловленной интерпретации. Сноски верно разграничивают еврейское множественное число и сглаживающее греческое единственное, а также различие между еврейским «Бог» и греческим «Господь».
