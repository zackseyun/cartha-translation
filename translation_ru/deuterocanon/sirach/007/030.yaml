  source_fidelity: '«Всеми силами люби своего Создателя и не оставляй Его служителей» точно передаёт еврейский текст: בְּכָל מְאֹדְךָ — полнота силы; אֱהוֹב — повеление «люби»; עוֹשֶׂךָ — «твой Создатель»; מְשָׁרְתָיו — «Его служители»; לֹא תַעֲזֹב — «не оставляй». Греческий параллельный текст подтверждает эти соответствия, особенно смысл «всей силой» и служебно-культовой окраски «служителей».'
  naturalness: Фраза звучит естественно в современном литературном русском и сохраняет лаконичный наставительный параллелизм. «Всеми силами» — устойчивое выражение; «не оставляй» уместно и не сужает значение до материальной поддержки либо пренебрежения.
  terminology: «Создатель» с прописной буквы адекватно обозначает божественного референта. «Служители» удачно передаёт מְשָׁרְתָיו, сохраняя возможный оттенок священного/храмового служения без конфессионально узкого термина. Сноска b корректно отмечает эту возможность и альтернативу «Его слуг». Маркеры сносок стоят при соответствующих словах.
