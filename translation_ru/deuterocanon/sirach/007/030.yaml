  text: With all your strength[a], love your Maker[b], and do not forsake his ministers.
translation:
  language: ru
  text: Всеми силами[a] люби своего Создателя и не оставляй Его служителей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всей своей силой»; возможный смысл: «всей своей мощью».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно, имеются в виду прежде всего те, кто служит Богу при святилище; иначе: «Его слуг».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכָל מְאֹדְךָ
  choice: всеми силами
  rationale: Устойчивое и естественное русское выражение, передающее полноту силы или мощи; соответствует греческому ἐν ὅλῃ δυνάμει.
- source_word: אֱהוֹב
  choice: люби
  rationale: Прямой перевод повелительной формы глагола אהב.
- source_word: עוֹשֶׂךָ
  choice: своего Создателя
  rationale: Причастная форма означает «того, кто создал тебя». «Своего Создателя» кратко и естественно передаёт личное отношение к Богу как Творцу; прописная буква обозначает очевидный божественный референт.
- source_word: מְשָׁרְתָיו
  choice: Его служителей
  rationale: Слово от корня שרת обозначает тех, кто состоит при ком-либо на службе, нередко священной или храмовой. «Служители» сохраняет эту вероятную официально-культовую окраску, не сводя значение исключительно к священникам.
- source_word: לֹא תַעֲזֹב
  choice: не оставляй
  rationale: Передаёт обычное значение עזב — оставлять, покидать, отказываться от поддержки — и сохраняет нравственную силу запрета без излишнего уточнения.
theological_decisions:
- issue: Референт и написание עוֹשֶׂךָ
  choice: Создателя
  alternative: того, кто создал тебя; творца
  rationale: Контекст говорит о Боге как Создателе человека. Прописная буква ясно обозначает божественный референт, не добавляя к тексту нового содержания.
- issue: Круг лиц, обозначенных מְשָׁרְתָיו / λειτουργοὺς αὐτοῦ
  choice: Его служителей
  alternative: Его слуг; тех, кто служит Ему
  rationale: Еврейский и греческий тексты допускают общее значение служения, но, вероятно, подразумевают людей, занятых священным или храмовым служением. «Служители» сохраняет обе возможности и не вводит более узкую конфессиональную должность.
translation_notes:
  register: Современный литературный русский язык с кратким, наставительным звучанием. Формулировка доступна широкому читателю, сохраняет параллелизм и не уточняет сверх текста ни статус служителей, ни конкретную форму поддержки.
