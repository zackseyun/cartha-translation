translation:
  language: ru
  text: Не гнушайся своей женой[a] и не доверяй той, которую ненавидишь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Есть ли у тебя жена по твоему желанию? Не прогоняй её». Сохранившиеся еврейский и греческий тексты здесь заметно различаются; основной текст следует еврейскому свидетельству, а в сноске приведён греческий вариант.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה לְךָ
  choice: своей женой
  rationale: Сочетание אִשָּׁה с לְךָ естественно обозначает жену адресата. Русское «своей женой» кратко и ясно передаёт брачную принадлежность.
- source_word: אַל תְּתַעֲבֶהָ
  choice: не гнушайся
  rationale: Глагол выражает сильное отвращение и отвержение. «Не гнушайся» точно передаёт эту силу и уместно в достойном стиле наставления.
- source_word: וּשְׂנוּאָה
  choice: той, которую ненавидишь
  rationale: Форма допускает буквальное «ненавистная/ненавидимая», однако в противопоставлении естественно относится к женщине, которую ненавидит адресат. Формулировка не утверждает, что её ненавидят другие.
- source_word: אַל תַּאֲמֵן בָּהּ
  choice: не доверяй той
  rationale: Hifil אמן с предлогом ב обозначает доверие или уверенность в ком-либо. «Не доверяй» прямо и естественно передаёт смысл без добавления отсутствующего в еврейском возвратного оттенка.
theological_decisions:
- issue: Значительное расхождение сохранившегося еврейского текста и греческой параллели
  choice: Основной текст переведён по еврейскому свидетельству; греческий вариант сохранён в сноске.
  alternative: 'Греческий: «Есть ли у тебя жена по сердцу? Не прогоняй её».'
  rationale: При наличии еврейского текста он служит основой перевода Сираха. Греческая форма заметно отличается и представляет важное текстовое свидетельство, поэтому её следует привести, не смешивая два чтения.
translation_notes:
  register: Современный литературный русский язык с краткой формой наставления. «Гнушайся» сохраняет силу еврейского глагола, оставаясь понятным и достойным; синтаксис второй части передаёт неоднозначную причастную форму через естественную относительную конструкцию.
