translation:
  language: ru
  text: Не падай духом в молитве и не пренебрегай подаянием милостыни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово צדקה может также означать «праведность», однако здесь греческий параллельный текст прямо говорит о подаянии милостыни.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתְקַצֵּר
  choice: Не падай духом
  rationale: Еврейская форма допускает затруднения, однако греческое μὴ ὀλιγοψυχήσῃς ясно указывает на утрату мужества или уныние. «Не падай духом» естественно передаёт этот смысл по-русски.
- source_word: בַּתְּפִלָּה
  choice: в молитве
  rationale: Еврейский текст говорит буквально «в молитве» и не содержит притяжательного местоимения. Такой оборот естественен и в современном русском языке.
- source_word: וּבִצְדָקָה
  choice: и … милостыней
  rationale: צדקה может означать «праведность», но в данном контексте обозначает благотворительное подаяние; это подтверждает греческое ἐλεημοσύνην ποιῆσαι — «творить/подавать милостыню».
- source_word: אַל תִּתְעַבָּר
  choice: не пренебрегай
  rationale: Глагол передаёт идею пройти мимо, оставить без внимания. Греческое μὴ παρίδῃς подтверждает значение «не упускай, не пренебрегай».
theological_decisions:
- issue: Значение צדקה в данном наставлении
  choice: милостыня
  alternative: праведность
  rationale: Контекст и древний греческий параллельный текст поддерживают конкретный смысл благотворительного подаяния, но более широкое значение слова отмечено в сноске, чтобы не скрывать лексическую многозначность.
translation_notes:
  register: Современный литературный русский язык; краткое наставление передано естественно и достойно. «Не падай духом» избегает неясного буквализма, а «в молитве» следует еврейскому тексту без добавления притяжательного местоимения.
