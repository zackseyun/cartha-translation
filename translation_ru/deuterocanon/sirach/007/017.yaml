  text: Глубоко смири свою душу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленный еврейский фрагмент имеет иное содержание и, по-видимому, не соответствует Сир 7:17; перевод следует греческому тексту: «Глубоко смири свою душу».'
    reason: Зафиксировать существенное расхождение источников, не смешивая два разных чтения в основном тексте.
lexical_decisions:
- source_word: ταπείνωσον
  choice: смири
  rationale: Греческий аорист повелительного наклонения передаёт решительный призыв; «смири» естественно и точно выражает добровольное смирение.
- source_word: σφόδρα
  choice: глубоко
  rationale: Передаёт высокую степень действия без тяжеловесного «весьма»; по-русски естественно сочетается со «смири».
- source_word: τὴν ψυχήν σου
  choice: свою душу
  rationale: Сохраняет традиционный и богословски ёмкий образ «души», не сужая его до чувств или характера.
theological_decisions:
- issue: Объект смирения
  choice: свою душу
  alternative: самого себя
  rationale: Буквальное «душу» сохраняет антропологическую формулировку греческого свидетеля и не снимает возможную широту значения ψυχή.
- issue: Текстуальная основа при расхождении свидетелей
  choice: Следовать греческому тексту данного стиха
  alternative: 'Перевести предоставленный еврейский текст как «Не спеши говорить мне: „Пролом“; возложи на Бога и прими его путь»'
  rationale: Предоставленный еврейский фрагмент не соответствует содержанию Сир 7:17 в греческой традиции и в проверочном английском слое; он, вероятно, оказался здесь вследствие несовпадения привязки. Поэтому для данного стиха использован согласованный греческий свидетель, а расхождение отмечено открыто.
