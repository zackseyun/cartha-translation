translation:
  language: ru
  text: Не навлекай на себя вину в собрании у врат Божьих[a] и не унижай себя в общине.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Не греши среди городской толпы и не низвергай себя в толпе». Это чтение может отражать иной еврейский текст или истолковывающее сглаживание необычного выражения «врата Божьи».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּרְשִׁיעֲךָ
  choice: Не навлекай на себя вины
  rationale: Порода hифиль глагола רשע с объектным суффиксом допускает смысл «сделать виновным, навлечь вину». Русская формулировка передаёт не просто совершение греха, а возникновение собственной виновности.
- source_word: בַּעֲדַת שַׁעֲרֵי אֵל
  choice: в собрании у врат Божьих
  rationale: עֵדָה передано как «собрание», а необычное שַׁעֲרֵי אֵל сохранено буквально по высоконадёжному еврейскому свидетельству. Предлог «у» естественно обозначает общественное или судебное собрание при вратах.
- source_word: וְאַל תַּפִּילְךָ
  choice: и не унижай себя
  rationale: Каузативная форма от נפל с возвратным объектом означает доведение себя до низкого, униженного положения. «Не унижай себя» звучит естественно по-русски, сохраняя образ самоуничижения или падения.
- source_word: בַּקְּהִלָּה
  choice: перед общиной
  rationale: קְהִלָּה обозначает собравшееся сообщество. «Община» отличает этот термин от עֵדָה в первой строке; «перед» естественно передаёт публичный характер унижения, хотя буквально предлог ב означает «в».
theological_decisions:
- issue: Следовать ли необычному еврейскому выражению «врата Божьи» или греческому варианту «множество города»
  choice: Сохранить в основном тексте еврейское чтение «у врат Божьих»
  alternative: «Не греши среди множества городского»
  rationale: Сохранившийся еврейский текст имеет высокий уровень достоверности и является первичным для перевода. Греческий текст может отражать иной еврейский оригинал либо истолковывающее сглаживание; его чтение поэтому вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительной мудрости. Сохранена краткая двухчастная структура стиха и необычность еврейского чтения; избегнута архаизация.
