translation:
  language: ru
  text: Не засевай борозды несправедливости против брата, иначе пожнёшь её всемеро.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально: «пожнёшь его/это»; местоименный суффикс сам по себе неоднозначен. Здесь он отнесён к посеянной несправедливости, что лучше соответствует образу сева и жатвы.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте изречение имеет более общий вид: «Отступи от несправедливости, и она отступит от тебя». Это отражает иную форму изречения, чем сохранившийся еврейский текст.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּזְרַע
  choice: Не сей
  rationale: Краткий запрет естественно передаёт еврейскую отрицательную конструкцию и сохраняет явный земледельческий образ.
- source_word: חֲרוּשֵׁי עָוֶל
  choice: борозд несправедливости
  rationale: «Борозды» сохраняют необычный, но намеренный образ пахоты, связанный далее с жатвой; «несправедливость» передаёт нравственный и межличностный смысл עָוֶל без излишне церковной окраски.
- source_word: עַל אָח
  choice: против брата
  rationale: Предлог имеет здесь направленное против кого-либо значение; слово «брата» сохранено без добавления отсутствующего в еврейском притяжательного местоимения.
- source_word: פֶּן
  choice: а не то
  rationale: Современная и естественная русская формула предупреждения передаёт предостерегающую силу частицы פֶּן.
- source_word: תִּקְצְרֵהוּ
  choice: пожнёшь её
  rationale: Дополнение понято как посеянная несправедливость, что поддерживает последовательность образов сева и жатвы; неоднозначность еврейского суффикса отмечена в сноске.
- source_word: שִׁבְעָתָיִם
  choice: всемеро
  rationale: Кратко и идиоматично передаёт семикратное, усиленное воздаяние, сохраняя числовой образ оригинала.
theological_decisions:
- issue: К чему относится местоименный суффикс в תִּקְצְרֵהוּ
  choice: 'Объектом жатвы считается посеянная несправедливость: «пожнёшь её всемеро».'
  alternative: 'Суффикс можно формально связать с братом: «пожнёшь его всемеро»; греческий текст содержит иную форму изречения.'
  rationale: Пара «сеять — жать» убедительнее всего связывает объект жатвы с посеянной несправедливостью. Однако краткость еврейской формы допускает грамматическую неоднозначность, поэтому она не скрыта.
translation_notes:
  register: Современный литературный русский язык с краткой афористической структурой. Земледельческая метафора оригинала сохранена, хотя сочетание «борозды несправедливости» намеренно остаётся несколько необычным.
