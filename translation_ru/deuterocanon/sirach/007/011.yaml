translation:
  language: ru
  text: 'Не презирай человека, чей дух исполнен горечи; помни: есть тот, кто возвышает и низводит.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «возвышает и низводит»; в греческом параллельном тексте порядок обратный: «низводит и возвышает».'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּבֶז
  choice: не презирай
  rationale: Глагол בזה означает относиться с презрением. «Не презирай» передаёт более широкий смысл, чем «не насмехайся», и следует первичному еврейскому свидетельству.
- source_word: לֶאֱנוֹשׁ
  choice: человека
  rationale: אֱנוֹשׁ обозначает человека, нередко с оттенком человеческой слабости; русское «человека» естественно передаёт здесь единичное существительное с обобщающим значением.
- source_word: בְּמַר רוּחַ
  choice: чей дух исполнен горечи
  rationale: Формулировка сохраняет образы «горечи» и «духа», но звучит естественнее современного буквального оборота «в горечи духа». Она не уточняет без достаточных оснований, вызвана ли горечь страданием, скорбью или озлоблением.
- source_word: זְכוֹר
  choice: помни
  rationale: Прямой и естественный эквивалент повелительной формы.
- source_word: כִּי יֵשׁ
  choice: есть тот, кто
  rationale: Сохраняется бытийная конструкция и неопределённо выраженный единственный деятель без внесения отсутствующего в исходном тексте имени или титула.
- source_word: מֵרִים וּמַשְׁפִּיל
  choice: возвышает и низводит
  rationale: Перевод следует засвидетельствованному еврейскому порядку глаголов. «Низводит» передаёт понижение положения лучше, чем «унижает», которое в современном русском часто означает оскорбление достоинства.
theological_decisions:
- issue: Не названный прямо субъект перемены человеческого положения
  choice: 'Сохранить непрямое обозначение: «есть тот, кто»'
  alternative: «Бог возвышает и низводит» или «Господь возвышает и низводит»
  rationale: И еврейский, и греческий тексты подразумевают единственного, вероятно божественного деятеля, но не называют его. Перевод не добавляет отсутствующего имени и сохраняет богословскую недосказанность.
- issue: Порядок противоположных действий
  choice: «возвышает и низводит» по еврейскому тексту
  alternative: «низводит и возвышает» по греческому параллельному тексту
  rationale: При высокой уверенности в еврейском свидетельстве основной текст следует его порядку; разночтение греческой традиции отмечено в сноске, не устраняя текстуального напряжения.
translation_notes:
  register: Современный литературный русский с достоинством библейской мудрой речи. Синтаксис краткий и ясный; образность еврейского выражения сохранена без неестественного буквализма. Строчная форма «тот» не вводит редакционного указания на Бога там, где источник оставляет деятеля неназванным.
