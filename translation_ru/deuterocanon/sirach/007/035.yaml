translation:
  language: ru
  text: 'Не медли: будь с плачущими[a] и скорби со скорбящими.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом свидетельстве: «Не медли посещать больного, ибо за такие дела тебя полюбят». Это чтение существенно отличается от сохранившегося еврейского текста.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּתְאַחֵר
  choice: Не медли
  rationale: Отрицательная частица с формой глагола выражает запрет медлить или уклоняться; «не медли» кратко и естественно передаёт настоятельность призыва.
- source_word: מִבּוֹכִים
  choice: быть с плачущими
  rationale: Буквально предлог מִן может указывать на удаление («от плачущих»), но в данном запрете и параллелизме смысл состоит в том, чтобы не сторониться плачущих. Добавление «быть с» ясно передаёт солидарность, не смешивая плач со скорбью следующей части.
- source_word: אֲבֵלִים
  choice: скорбящими
  rationale: Существительное обозначает тех, кто пребывает в трауре или скорби. Субстантивированное причастие «скорбящие» понятно современному читателю и сохраняет связь с однокоренным глаголом.
- source_word: תִּתְאַבָּל
  choice: скорби
  rationale: Форма породы hitpael призывает самому вступить в состояние скорби вместе с другими; русский императив сохраняет прямоту увещания и корневой повтор.
theological_decisions:
- issue: Соотношение еврейского и греческого свидетельств
  choice: Основной текст следует сохранившемуся еврейскому чтению — призыву быть рядом с плачущими и разделять скорбь скорбящих.
  alternative: 'Греческое свидетельство: «Не медли посещать больного, ибо за такие дела тебя полюбят».'
  rationale: Еврейский текст здесь сохранён и имеет высокую степень надёжности, поэтому он положен в основу перевода. Греческий текст представляет существенно иное чтение, которое необходимо сохранить в сноске, не смешивая два варианта.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой наставления. Корневой повтор «скорби со скорбящими» намеренно сохраняет параллелизм еврейского текста; «быть с» делает смысл первой строки естественным по-русски.
