base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/024.yaml
  text: Do you have daughters? Guard their chastity[a], and do not show them a cheerful face.
translation:
  language: ru
  text: Есть у тебя дочери — оберегай их тела[a] и не будь с ними слишком снисходителен.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их плоть». В контексте речь может включать охрану их целомудрия и чести.'
    reason: Сохраняет конкретное значение еврейского слова и отмечает вероятный контекстуальный смысл.
  - marker: b
    text: 'Буквально: «не делай своё лицо светлым по отношению к ним»; то есть, вероятно, не проявляй чрезмерной мягкости и не потворствуй им.'
    reason: Объясняет еврейский образ, который при буквальной передаче по-русски мог бы быть понят неверно.
lexical_decisions:
- source_word: בָּנוֹת לְךָ
  choice: Есть у тебя дочери
  rationale: Еврейское именное выражение буквально означает «дочери у тебя». Русская конструкция сохраняет условно-наставительный характер фразы без необходимости превращать её в отдельный вопрос.
- source_word: נְצוֹר
  choice: оберегай
  rationale: Глагол означает «хранить, стеречь, оберегать». «Оберегай» естественно передаёт заботливый, но настойчивый призыв к защите.
- source_word: שְׁאֵרָם
  choice: их тело
  rationale: שְׁאֵר может обозначать плоть или тело; греческий параллельный текст прямо передаёт его словом σῶμα, «тело». Конкретное «тело» не сужает смысл исключительно до целомудрия, хотя в контексте оно может подразумеваться.
- source_word: וְאַל תָּאִיר אֲלֵיהֶם פָּנִים
  choice: не будь с ними слишком снисходителен
  rationale: Буквальный образ — «не делай лицо светлым по отношению к ним»; греческий текст также говорит о весёлом или приветливом лице. В данном наставлении это идиома чрезмерной мягкости или потворства. Естественная русская формулировка передаёт вероятный смысл, а исходный образ сохранён в примечании.
theological_decisions:
- issue: Этический смысл предостережения родителю
  choice: Передать идиому как предупреждение против чрезмерной снисходительности, отметив образ лица в сноске.
  alternative: «не показывай им приветливого лица»
  rationale: Буквальная русская передача способна прозвучать как запрет на доброжелательность к дочерям вообще. Добавление «слишком» выражает подразумеваемую чрезмерность, не превращая стих в конкретную современную теорию воспитания.
- issue: Смысл охраны שְׁאֵרָם
  choice: «оберегай их тело»
  alternative: «береги их целомудрие»
  rationale: Еврейское слово конкретно называет плоть или тело, что подтверждается греческим σῶμα. «Целомудрие» возможно как контекстуальный вывод, но оно уже и потому оставлено для пояснения, а не внесено непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык, наставительный и сдержанный тон. Тире передаёт краткую условно-побудительную структуру оригинала. Формулировка избегает архаичного «не просветляй лица» и не вводит более узкое «целомудрие» в основной текст.
