  text: Give a gift before every living person[a], and do not withhold kindness even from the dead.
translation:
  language: ru
  text: Дай дар в присутствии каждого живого человека[a] и не отказывай в доброте даже умершему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Не уклоняйся от плачущих и скорби вместе со скорбящими». Это свидетельствует о существенно иной текстовой традиции данного стиха.'
    reason: textual_variant
lexical_decisions:
- source_word: תֵּן מַתָּן
  choice: Дай дар
  rationale: Сохраняет прямой императив и сочетание однокоренных в древнееврейском слов, оставаясь понятным и естественным по-русски.
- source_word: לִפְנֵי כָל חָי
  choice: каждому живому
  rationale: Буквально выражение допускает «перед каждым живым», однако в данном контексте לִפְנֵי естественно передаёт направленность дара к каждому живому человеку. Субстантивированное «живому» сохраняет лаконизм и параллель с умершим.
- source_word: וְגַם מִמֵּת
  choice: и даже умершему
  rationale: Аддитивное וְגַם передано сочетанием «и даже», подчёркивающим распространение обязанности на умершего; מִן при глаголе מנע обозначает лицо, которому не следует отказывать.
- source_word: אַל תִּמְנַע חָסֶד
  choice: не откажи в милости
  rationale: Идиоматично передаёт запрет удерживать или не оказывать חֶסֶד. «Милость» здесь означает конкретное благодеяние и почтительное исполнение долга, не ограничивая смысл одним чувством.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и значительно отличающейся греческой традиции
  choice: Основной текст переведён с еврейского.
  alternative: 'Греческий текст: «Не оставляй плачущих и скорби со скорбящими».'
  rationale: При наличии древнееврейского текста Сираха он принимается за основу. Греческая строка представляет не малое разночтение, а существенно иную текстовую традицию, поэтому она полностью приведена в сноске без попытки слить оба чтения.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная форма наставления. Формулировка «умершему не откажи в милости» сохраняет широту חֶסֶד и может включать подобающие погребальные и поминальные обязанности, не добавляя их прямо в текст.
