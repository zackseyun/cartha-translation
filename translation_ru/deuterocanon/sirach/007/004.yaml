translation:
  language: ru
  text: Не оправдывай себя перед царём[a] и не выставляй себя разумным перед царём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Не проси у Господа власти и у царя — почётного места». Здесь перевод следует существенно отличающемуся еврейскому тексту.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּצְטַדֵּק
  choice: Не оправдывай себя
  rationale: Возвратная форма глагола от צדק передаёт смысл «показывать себя правым, оправдывать себя»; перевод сохраняет возвратность и предостережение от самоутверждения.
- source_word: לִפְנֵי מֶלֶךְ / מִפְּנֵי מֶלֶךְ
  choice: перед царём
  rationale: Компактно и естественно передаёт присутствие при царе; отсутствие артикля в еврейском не требует определённого «этим царём».
- source_word: אַל תִּתְבּוֹנֵן
  choice: не выставляй себя разумным
  rationale: Форма от בין в данном социальном контексте указывает не просто на внутреннее размышление, а на демонстрацию собственной рассудительности; «выставляй себя» ясно передаёт этот оттенок без тяжеловесности.
theological_decisions:
- issue: Существенное расхождение еврейского и греческого текстов
  choice: 'Основным принят сохранившийся еврейский текст: предостережение не оправдывать себя и не выставлять себя разумным перед царём.'
  alternative: 'Греческий текст: «Не проси у Господа власти и у царя — почётного места».'
  rationale: В Книге Премудрости Иисуса, сына Сирахова, сохранившееся еврейское свидетельство принимается за основу; существенно отличающийся греческий вариант документируется в сноске и не используется для устранения различия.
translation_notes:
  register: Современный литературный русский язык; краткая параллельная конструкция сохраняет афористичность оригинала. Повтор «перед царём» намеренно воспроизводит структуру еврейского текста.
