  text: In all your words remember your end, and you will never sin.[a]
translation:
  language: ru
  text: Во всех своих словах помни о своём конце — и никогда не согрешишь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившееся еврейское свидетельство (издание Каханы по рукописям Каирской генизы) читается приблизительно так: «Не отвращай сердца от того, кто любит, ибо от него будешь любим». Здесь еврейский текст существенно отличается от греческой традиции, поэтому основной текст следует греческому чтению.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς λόγοις σου
  choice: Во всех своих словах
  rationale: λόγοι допускает значения «слова» и «дела/обстоятельства»; «во всех своих словах» близко к греческому и естественно по-русски.
- source_word: μιμνήσκου
  choice: помни
  rationale: Прямо и естественно передаёт повелительное значение глагола.
- source_word: τὰ ἔσχατά σου
  choice: о своём конце
  rationale: 'Сохраняет неоднозначность греческого выражения: речь может идти о смерти или конечном исходе жизни, без внесения более узкой эсхатологической трактовки.'
- source_word: καὶ εἰς τὸν αἰῶνα οὐχ ἁμαρτήσεις
  choice: и никогда не согрешишь
  rationale: В сочетании с отрицанием εἰς τὸν αἰῶνα естественно означает «никогда», а ἁμαρτάνω передано обычным библейским глаголом «грешить».
- source_word: אַל תִּשָּׂא לֵב מֵאוֹהֵב, כִּי מִמֶּנוּ תֵּאָהֵב
  choice: сохранено как существенно отличающееся еврейское чтение в примечании
  rationale: Дошедший еврейский текст резко расходится с греческой традицией и допускает трудное понимание; основной текст следует связному греческому параллельному свидетельству, а еврейское чтение приводится открыто.
theological_decisions:
- issue: Следует ли явно истолковывать «конец» эсхатологически
  choice: о своём конце
  alternative: о своей конечной участи
  rationale: Греческий текст не уточняет, идёт ли речь только о смерти, окончательном исходе или суде; краткая формулировка сохраняет эту широту.
- issue: Выбор текста при резком расхождении еврейского и греческого свидетельств
  choice: Основной текст следует греческому параллельному свидетельству, еврейское чтение вынесено в примечание
  alternative: Следовать сохранившемуся еврейскому тексту в основном тексте
  rationale: Еврейское чтение здесь семантически расходится с греческим и, вероятно, отражает повреждение либо иную редакцию; греческий текст связен, а примечание обеспечивает текстологическую прозрачность.
translation_notes:
  register: Современный литературный русский язык; краткое наставительное изречение передано возвышенно, но понятно. Тире подчёркивает связь между повелением и его результатом.
