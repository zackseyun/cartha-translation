translation:
  language: ru
  text: Не спеши на военной службе[a], ибо это тяжкий труд, назначенный Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте сказано: «Не говори: „Он посмотрит на множество моих даров и, когда я принесу дары Богу Всевышнему, Он примет их“». Этот греческий текст отражает текстовую традицию, существенно отличающуюся от сохранившегося еврейского текста.'
