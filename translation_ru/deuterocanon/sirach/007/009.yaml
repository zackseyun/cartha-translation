lexical_decisions:
- source_word: אַל תָּאִיץ
  choice: Не спеши
  rationale: Отрицательное повеление передаёт предостережение против поспешного, необдуманного действия; современное русское выражение сохраняет этот смысл.
- source_word: בַּצָּבָא
  choice: идти в войско
  rationale: צָבָא обычно означает войско или военную службу. В сочетании с глаголом движения по смыслу подразумевается поспешное вступление или отправление в войско; такой перевод естественнее буквального «в войске».
- source_word: מְלֶאכֶת עֲבֹדָה
  choice: тяжкий труд
  rationale: Сочетание слов «работа» и «труд/служба» подчёркивает обременительность занятия. «Тяжкий труд» кратко и естественно передаёт усиленный смысл.
- source_word: מֵאֵל
  choice: Богом
  rationale: Предлог מִן может обозначать источник или деятеля; творительный падеж естественно передаёт здесь значение назначения Богом.
- source_word: נֶחֱלָקָה
  choice: назначенный
  rationale: Пассивная форма от חלק обозначает то, что распределено, отведено или назначено. «Назначенный» сохраняет идею уделения данного труда.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческой параллели
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству
  alternative: Греческая параллель содержит изречение о множестве даров и их принятии Всевышним Богом
  rationale: Там, где еврейский текст Сираха сохранился с высокой степенью надёжности, он служит первичным основанием перевода. Греческий текст здесь отражает иную текстовую традицию, поэтому его содержание приводится в сноске, а не смешивается с еврейским чтением.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, наставительная и достойная. «Войско» выбрано как ясное библейское слово без излишней архаичности; конструкция «идти в войско» делает подразумеваемое вступление на военную службу естественным по-русски.
