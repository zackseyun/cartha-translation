  text: Do not cower before a noble[a], lest you set a bribe against your integrity.
translation:
  language: ru
  text: Не робей перед вельможей, чтобы не запятнать свою честность нечестной наживой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст: «чтобы не положить камня преткновения на пути своей праведности». Еврейский текст конкретнее говорит о нечестной наживе, внесённой в нравственную цельность человека.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָגוּר
  choice: робей
  rationale: В данном контексте глагол означает боязливо отступать или поддаваться запугиванию перед влиятельным человеком; «робей» естественно передаёт не просто страх, а малодушную уступчивость.
- source_word: נָדִיב
  choice: вельможей
  rationale: Слово обозначает знатного, высокопоставленного человека; греческое δυνάστης подтверждает оттенок власти и влияния.
- source_word: בֶּצַע
  choice: нечестной наживой
  rationale: בצע означает корыстную или неправедную прибыль. Такой перевод сохраняет более широкий смысл еврейского слова и не ограничивает его исключительно взяткой.
- source_word: בִּתְמִימִיךָ
  choice: свою честность
  rationale: Здесь תמם выражает нравственную цельность и прямоту. «Честность» ясно и естественно передаёт этический смысл, подтверждаемый греческим ἐν εὐθύτητί σου.
- source_word: וְנָתוּן
  choice: не запятнать
  rationale: Буквальный образ «поместить/внести наживу в честность» по-русски неестественен. «Запятнать» передаёт внесение нравственной порчи, не устраняя связи с конкретной нечестной наживой.
theological_decisions:
- issue: Смысл трудной фразы וְנָתוּן בֶּצַע בִּתְמִימִיךָ при отличающемся греческом чтении
  choice: Передать еврейский текст как предостережение не запятнать честность нечестной наживой.
  alternative: «Не положи преткновения на пути своей праведности» — по греческому тексту.
  rationale: Сохранившийся еврейский текст имеет приоритет и прямо упоминает неправедную наживу. Греческий параллельный текст выражает более общий образ нравственного препятствия; он приведён в сноске, чтобы не скрывать текстовое и смысловое различие.
translation_notes:
  register: Современный литературный русский язык; наставительный и достойный тон. «Вельможа» сохраняет социальный оттенок исходного слова, а конструкция с «запятнать» делает сжатую еврейскую фразу понятной без чрезмерного истолкования.
