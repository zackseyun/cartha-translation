translation:
  language: ru
  text: Не проси у Бога власти и не добивайся у царя почётного места[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой версии здесь другое изречение: «Сын, не сей в бороздах неправды — и не пожнёшь её всемеро». Основной текст следует сохранившемуся еврейскому свидетельству этого стиха.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תְּבַקֵּשׁ
  choice: Не проси
  rationale: בקש может означать «искать», «просить» или «добиваться». Сочетание с מן («у, от») естественно передаётся здесь как просьба о даровании власти; русский вариант «не проси у» сохраняет эту направленность и звучит ясно.
- source_word: מֵאֵל
  choice: у Бога
  rationale: אֵל означает «Бог»; предлог מן после בקש в данном контексте естественно передать русским «у». Более специальный божественный титул в текст не добавляется.
- source_word: מֶמְשֶׁלַת
  choice: власти
  rationale: ממשלה обозначает власть, правление или господство. «Власть» сохраняет широкий смысл и не ограничивает его территориальным царствованием.
- source_word: וְכֵן
  choice: а
  rationale: 'Буквально: «и также». Во второй части продолжается действие запрета; русская конструкция «не проси… а…» естественно соединяет параллельные дополнения, не вводя противопоставления по существу.'
- source_word: מִמֶּלֶךְ
  choice: у царя
  rationale: מן означает источник получения; «у царя» идиоматично соответствует еврейскому выражению. Определённость формы сохранена существительным «царь» в родительном падеже.
- source_word: מוֹשַׁב כָּבוֹד
  choice: почётного места
  rationale: מוֹשָׁב — место для сидения, место или положение, а כָּבוֹד — честь, почёт. «Почётное место» естественно по-русски и сохраняет как образ места, так и социальное возвышение.
theological_decisions:
- issue: Соотношение еврейского и греческого свидетельств в этом стихе
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; существенно отличающееся греческое чтение приведено в сноске.
  alternative: «Сын, не сей в бороздах неправды — и не пожнёшь её всемеро».
  rationale: Когда еврейский текст Сираха сохранился, он служит основой перевода. Греческий свидетель содержит здесь иное изречение, поэтому варианты не гармонизируются и различие отмечается открыто.
translation_notes:
  register: Современный литературный русский язык; краткое наставление передано прямо и достойно. «Почётное место» звучит естественнее буквального «места славы» и сохраняет социальный смысл выражения.
