translation:
  language: ru
  text: Есть у тебя сыновья? Строго воспитывай их и найди для них жён[a], пока они молоды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Есть у тебя дети? Воспитывай их и с юности сгибай им шею». Еврейский текст вместо второй части стиха говорит: «…и найди для них жён, пока они молоды».'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: сыновья
  rationale: Еврейское слово здесь обозначает именно сыновей; дальнейшее указание взять для них жён подтверждает мужской референт.
- source_word: יַסֵּר
  choice: наставляй их строго
  rationale: Глагол יסר сочетает значения воспитания, исправления и дисциплины. Эта формулировка передаёт воспитательную строгость естественным современным русским языком.
- source_word: וְשָׂא לָהֶם נָשִׁים
  choice: возьми для них жён
  rationale: Еврейская идиома описывает участие отца в устройстве брака сыновей. Буквальная, но понятная формулировка сохраняет культурную перспективу исходного текста.
- source_word: בִּנְעוּרֵיהֶם
  choice: пока они молоды
  rationale: Передаёт действие в пору их молодости и в данном еврейском чтении относится к устройству брака.
theological_decisions:
- issue: Расхождение еврейского текста и греческой параллели во второй части стиха
  choice: 'Следовать сохранившемуся еврейскому чтению: «возьми для них жён, пока они молоды»'
  alternative: 'Греческое чтение: «с юности сгибай им шею»'
  rationale: При наличии надёжного еврейского свидетеля он служит основным текстом. Существенно отличающееся греческое чтение сохранено в примечании, чтобы не скрывать текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; достоинство наставительной речи сохранено без архаизмов. «Наставляй строго» передаёт исправительное воспитание, а не только наказание.
