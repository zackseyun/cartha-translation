translation:
  language: ru
  text: Выдай дочь замуж — и заботе конец[a]; соедини её с рассудительным мужчиной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и дело (или забота) выйдет», то есть завершится. Греческий перевод передаёт эту мысль более развёрнуто: «и совершишь великое дело».'
    reason: Сохранить необычный еврейский оборот и отметить более пространную греческую параллель.
  - marker: b
    text: 'Или: «отдай её в жёны рассудительному мужчине».'
    reason: Разъяснить брачный смысл выражения «соедини её с», сохраняя в основном тексте образ еврейского глагола.
lexical_decisions:
- source_word: הוֹצֵא בַת
  choice: Выдай дочь замуж
  rationale: Буквально глагол означает «вывести/отослать», но при слове «дочь» это идиома выдачи замуж; такое понимание подтверждает греческое ἔκδου.
- source_word: וְיֵצֵא עֵסֶק
  choice: и заботе конец
  rationale: 'Буквально: «и выйдет дело/забота». Русская идиома передаёт завершение хлопот или дела, не привнося греческое расширение «совершишь великое дело» в основной текст.'
- source_word: נָבוֹן
  choice: благоразумным
  rationale: Слово обозначает человека понимающего, рассудительного и способного здраво судить; «благоразумный» естественно подходит к наставлению о выборе мужа.
- source_word: חַבְּרָהּ
  choice: соедини её
  rationale: Форма от корня חבר выражает присоединение или соединение. В контексте речь о брачном союзе; буквальный образ сохранён, а его смысл разъяснён в примечании.
