  text: Do not count yourself among the people’s dead[b][a]; remember that passing away will not pass over.
translation:
  language: ru
  text: 'Не причисляй себя к умершим из народа; помни: уход из жизни не пройдёт мимо.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции: «Не гнушайся тяжёлого труда и земледелия, созданного Всевышним». Здесь греческий текст существенно отличается от сохранившегося еврейского.'
    reason: alternative_reading
  - marker: b
    text: Еврейский текст второй части строки труден и, вероятно, содержит игру слов со значениями «уходить» и «проходить мимо»; общий смысл, по-видимому, в том, что смерть или смертность никого не минует.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּחְשׁוֹבְךָ
  choice: Не причисляй себя
  rationale: Глагол חשב здесь передаёт мысль о причислении себя к определённой группе. Такой перевод сохраняет повелительную форму и естественно звучит по-русски.
- source_word: בָּמֳתֵי עָם
  choice: к умершим из народа
  rationale: Сжатое еврейское выражение понято как обозначение умерших, принадлежащих народу или общине. Формулировка сохраняет конкретный образ, не превращая его в отвлечённое понятие смерти.
- source_word: זְכוֹר
  choice: помни
  rationale: Прямой и естественный перевод повелительной формы глагола זכר.
- source_word: עִבָּרוֹן
  choice: уход из жизни
  rationale: Трудное существительное, вероятно, связано с корнем עבר и образует игру слов со следующим глаголом. «Уход из жизни» передаёт вероятную тему смертности, не вводя менее надёжные значения вроде «гнев» или «преступление».
- source_word: לֹא יִתְעַבָּר
  choice: не пройдёт мимо
  rationale: Фраза означает, что названное не минует человека. Сочетание «уход… не пройдёт мимо» по возможности сохраняет повтор корня עבר и исходную смысловую напряжённость.
- source_word: μὴ μισήσῃς ἐπίπονον ἐργασίαν καὶ γεωργίαν ὑπὸ Ὑψίστου ἐκτισμένην
  choice: не включено в основной текст
  rationale: Греческая традиция существенно отличается от сохранившегося еврейского текста. Поскольку еврейское свидетельство здесь имеется и оценено как надёжное, греческий вариант приведён в сноске, а не объединён с основным текстом.
theological_decisions:
- issue: Расхождение между сохранившимся еврейским текстом Бен-Сиры и греческой традицией
  choice: Основной текст следует еврейскому свидетельству; греческое чтение дано в сноске
  alternative: «Не гнушайся тяжёлого труда и земледелия, созданного Всевышним»
  rationale: Еврейский текст здесь сохранился с высокой степенью надёжности, тогда как греческий отражает существенно иное чтение. Оба свидетельства нельзя незаметно согласовать, поэтому различие обозначено открыто.
- issue: Неясность образа עִבָּרוֹן и игры слов с יתעבר
  choice: Передать вероятную тему смерти словами «уход из жизни не пройдёт мимо»
  alternative: «преступление не будет прощено» или «гнев не минует»
  rationale: Контекст первой половины строки и повтор корня עבר поддерживают смысл ухода или прохождения, но точное значение существительного остаётся спорным. Перевод сохраняет игру слов, а неопределённость поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, назидательной интонацией. Сохранены сжатость еврейской строки и её словесная игра; необычность мысли не сглажена конфессиональным толкованием.
