  text: Love an intelligent servant as yourself[a], and do not withhold freedom from him.
translation:
  language: ru
  text: Разумного раба[a] люби, как самого себя, и не лишай его свободы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «разумного»; в греческом параллельном тексте — «доброго».
    reason: alternative_reading
lexical_decisions:
- source_word: עֶבֶד
  choice: раб
  rationale: Слово обозначает несвободного, зависимого человека; последующее упоминание свободы делает рабский статус явным, поэтому смягчённое «слуга» здесь неточно.
- source_word: מַשְׂכִּיל
  choice: разумный
  rationale: Причастие характеризует человека, обладающего пониманием и поступающего рассудительно. «Разумный» естественно звучит по-русски и сохраняет смысл еврейского текста.
- source_word: חַבֵּב
  choice: люби
  rationale: Повелительная форма выражает глубокую привязанность и высокую оценку; «люби» прямо и естественно передаёт её силу.
- source_word: כְּנֶפֶשׁ
  choice: как самого себя
  rationale: Буквально выражение связано с «душой/жизнью», но в данном сравнении означает отношение к другому как к себе самому. Выбран естественный русский эквивалент.
- source_word: וְאַל תִּמְנַע מִמֶּנוּ
  choice: и не лишай его
  rationale: Глагол означает удерживать, не давать или отнимать возможность получить нечто. С существительным «свобода» сочетание «не лишай его свободы» звучит естественно и точно.
- source_word: חֹפֶשׁ
  choice: свобода
  rationale: Здесь имеется в виду освобождение от рабского состояния. «Свобода» ясно передаёт смысл без излишне технического термина «манумиссия».
theological_decisions:
- issue: Передача социального статуса עֶבֶד в наставлении
  choice: раб
  alternative: слуга
  rationale: Контекст прямо говорит о предоставлении свободы, поэтому несвободный статус нельзя затушёвывать. Перевод описывает историческую социальную реальность текста, не добавляя ей богословского оправдания.
translation_notes:
  register: Современный литературный русский язык; краткая форма наставления сохранена. Порядок слов слегка адаптирован для естественного русского звучания, при этом этическая сила обоих повелений не ослаблена.
