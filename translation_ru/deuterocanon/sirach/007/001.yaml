base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/001.yaml
  text: Do not do evil[a], and evil will not overtake you; keep far from iniquity[b], and it will turn away from you.
translation:
  language: ru
  text: Не делай зла[a], и зло не настигнет тебя; держись вдали от беззакония[b], и оно отступит от тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Во второй части это же еврейское слово может означать также «беду» или «вред»: «Не делай зла, и беда не настигнет тебя». В еврейском тексте одно слово повторено дважды; так же построена и греческая версия.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная фраза в еврейском тексте кратка; её можно перевести и так: «и оно удалится от тебя». Смысл в том, что удаление от беззакония отвращает и связанную с ним опасность или последствие.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעַשׂ
  choice: Не делай
  rationale: Прямо передаёт еврейский запрет с глаголом עשה, не добавляя оттенка привычного действия или специальной юридической терминологии.
- source_word: רָעָה
  choice: зло
  rationale: Сохраняет этический смысл и намеренный повтор одного слова в обеих частях; греческая параллель также повторяет соответствующее слово. Во втором употреблении возможен оттенок беды или вреда, что отмечено в сноске.
- source_word: יַשִּׂיגְךָ
  choice: не настигнет тебя
  rationale: Глагол выражает достижение или настигание; этот вариант естественен по-русски и сохраняет образ преследующего человека зла.
- source_word: הַרְחֵק מֵעָוֹן
  choice: держись вдали от беззакония
  rationale: Передаёт активное удаление и сохраняет пространственную метафору. «Беззаконие» отражает нравственную тяжесть עָוֹן, которое также может обозначать вину или последствия вины.
- source_word: וְיֵט מִמְּךָ
  choice: и оно отступит от тебя
  rationale: Сохраняет краткость и некоторую неоднозначность еврейской фразы, не вводя явно не названного деятеля. Местоимение естественно соотносится с беззаконием и связанными с ним последствиями.
theological_decisions:
- issue: Нравственное зло или бедствие во втором употреблении רָעָה
  choice: В обоих случаях переведено «зло»
  alternative: 'Во второй части: «беда» или «вред»'
  rationale: Повтор в еврейском тексте и греческой параллели создаёт намеренную связь между поступком и его последствием. Единый перевод сохраняет эту риторическую симметрию, а возможный оттенок бедствия отмечен в сноске.
- issue: Субъект заключительной фразы וְיֵט מִמְּךָ
  choice: «оно отступит от тебя» — без уточнения иного деятеля
  alternative: «и [Бог] удалит его от тебя» либо «и оно удалится от тебя»
  rationale: Еврейская формулировка кратка и не называет Бога субъектом. Перевод не должен вносить богословское уточнение, отсутствующее в исходном тексте; «отступит» передаёт направленное движение в сторону.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной и достойной интонацией. Параллельная структура и повтор «зло» сохранены; «держись вдали» естественно передаёт пространственный образ исходного текста.
