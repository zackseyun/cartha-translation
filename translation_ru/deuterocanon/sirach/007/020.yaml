    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרֵעַ
  choice: Не поступай дурно с
  rationale: Глагол רעע здесь означает причинять зло, вредить или плохо обращаться. Эта формулировка естественна по-русски и сохраняет нравственно-межличностный смысл запрета.
- source_word: עוֹבֵד אֱמֶת
  choice: работником, который трудится честно
  rationale: Буквально сочетание означает «работающий/служащий истины» или «работник истины». В контексте, при поддержке греческого ἐργαζόμενον ἐν ἀληθείᾳ, речь о честном, добросовестном труде.
- source_word: וְכֵן
  choice: и с
  rationale: Союз вводит второй однородный объект того же запрета. Русская конструкция «не поступай дурно с… и с…» передаёт это без искусственного повторения отрицания.
- source_word: שׁוֹמֵר
  choice: наёмным работником
  rationale: Еврейское чтение затруднительно и само по себе может указывать на сторожа или хранителя, однако греческое μίσθιον ясно свидетельствует в пользу наёмного работника.
- source_word: נוֹחֵן נַפְשׁוֹ
  choice: отдающим все силы
  rationale: Переданный еврейский оборот труден; греческое διδόντα ψυχὴν αὐτοῦ буквально означает «отдающего свою душу/жизнь». В трудовом контексте русский оборот «отдающий все силы» естественно выражает полную самоотдачу, не создавая ненужного впечатления буквальной смерти.
