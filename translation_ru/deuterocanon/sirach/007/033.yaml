translation:
  language: ru
  text: Также протяни руку бедному[a], чтобы твоё благословение стало полным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Пусть благодеяние дара будет перед каждым живым, и не удерживай благодеяния от умершего». Еврейский свидетель здесь, напротив, гласит: «Также протяни руку бедному, чтобы твоё благословение стало полным».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Также
  rationale: Передаёт присоединительный смысл и естественно связывает наставление с предыдущими увещаниями.
- source_word: לְאֶבְיוֹן
  choice: бедному
  rationale: אֶבְיוֹן обозначает бедного, нуждающегося человека; «бедному» ясно и естественно передаёт социально-этический смысл.
- source_word: הוֹשִׁיט יָד
  choice: протяни руку
  rationale: Сохраняет конкретный телесный образ еврейского выражения, подразумевающего помощь или подаяние, не сводя его к одному виду благотворительности.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Естественно выражает целевое или результативное отношение между частями стиха.
- source_word: תִּשְׁלַם
  choice: стало полным
  rationale: Форма от שלם здесь допускает смысл достижения полноты или завершённости; перевод не подменяет его идеей воздаяния.
- source_word: בִּרְכָתֶךָ
  choice: твоё благословение
  rationale: Сохраняет широту בְּרָכָה, которое может обозначать благословение, благой дар или благодеяние, не устраняя смысловую неоднозначность.
theological_decisions:
- issue: Значительное расхождение еврейского и греческого свидетелей в Сир 7:33
  choice: Основной текст переведён по сохранившемуся еврейскому чтению; греческое чтение приведено в сноске.
  alternative: 'Греческий текст: «Пусть милость дара будет явлена каждому живому, и даже умершего не лишай милости».'
  rationale: Еврейский свидетель содержит связный самостоятельный текст, тогда как греческий представляет существенно иную форму стиха. Следование еврейскому в основном тексте и указание греческого варианта в сноске сохраняют оба древних свидетельства без искусственного согласования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Сохранён образ протянутой руки и намеренно не устранена неоднозначность выражения «твоё благословение».
