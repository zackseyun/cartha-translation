translation:
  language: ru
  text: Не пустословь в собрании правителей[a] и не повторяй в своей молитве одно и то же слово[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не говори попусту»; возможен также смысл «не будь многословен». Греческая параллель также предостерегает от праздной или чрезмерной речи среди старейшин.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не повторяй слова в молитве». Вероятно, речь об избыточном или механическом повторении, а не о запрете всякого повторного прошения.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּסַוֵּר
  choice: пустословь
  rationale: Глагол обозначает праздную, чрезмерную или несдержанную речь; это подтверждает греческое ἀδολέσχει. «Пустословь» передаёт смысл точнее и достойнее, чем разговорное «болтай».
- source_word: בַּעֲדַת
  choice: в собрании
  rationale: עֵדָה означает собравшееся сообщество или собрание; русский вариант естественен для официальной обстановки.
- source_word: שָׂרִים
  choice: правителей
  rationale: שָׂרִים обозначает людей высокого положения и власти. «Правители» сохраняет властный смысл, не сужая его до монархических «князей».
- source_word: תִּישֶׁן דָּבָר
  choice: не повторяй слова
  rationale: Трудное еврейское выражение поддерживается греческим μὴ δευτερώσῃς λόγον — «не повторяй слова». Буквальная формулировка сохраняет открытым точный объём запрета.
- source_word: בַּתְּפִלָּה
  choice: в своей молитве
  rationale: 'Еврейское выражение означает «в молитве», а греческое ἐν προσευχῇ σου уточняет личную отнесённость: «в своей/твоей молитве».'
theological_decisions:
- issue: Запрещается ли всякое повторение молитвенных прошений или лишь избыточное и механическое повторение?
  choice: Основной текст буквально предостерегает от повторения слова в молитве, не вводя пояснение в сам перевод.
  alternative: 'Передать толковательно: «не повторяйся в молитве» или «не умножай слов в молитве».'
  rationale: Еврейский текст и греческая параллель прямо говорят о повторении речи, однако сами по себе не устанавливают запрета на всякое настойчивое повторное прошение. Буквальный основной текст и осторожное примечание сохраняют богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с краткой, наставительной формой. «Пустословь» сохраняет достоинство премудростной речи, не становясь архаизмом; параллелизм двух запретов сохранён.
