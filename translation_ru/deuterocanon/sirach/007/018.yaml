base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/007/018.yaml
  text: Do not trade away a friend for a price[c][b][a], or a brother who is worth the gold of Ophir.
translation:
  language: ru
  text: Не променяй друга на плату[b], ни брата[c], ценимого как золото Офира[d].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь совсем иное чтение: «Помни, что гнев не длится долго». Сохранившийся еврейский текст из Каирской генизы предостерегает от того, чтобы променять друга или брата на богатство.'
    reason: textual_variant
  - marker: b
    text: 'Или: «не обменивай друга на вознаграждение».'
    reason: lexical_alternative
  - marker: c
    text: Слово «брат» может обозначать как родного брата, так и, в более широком смысле, близкого родственника или товарища.
    reason: lexical_alternative
  - marker: d
    text: Еврейское выражение трудно для истолкования; возможно, здесь подразумевается брат, чью ценность сравнивают с золотом Офира.
    reason: source_uncertainty
lexical_decisions:
- source_word: תָּמִיר
  choice: променяй
  rationale: Форма породы hифиль от מור означает обмен или замену; «променяй» естественно передаёт и обмен, и нравственно отрицательный оттенок отказа от близкого человека ради выгоды.
- source_word: אוֹהֵב
  choice: друга
  rationale: Буквально слово может означать «любящий», но в литературе мудрости обычно обозначает друга или преданного близкого человека.
- source_word: בִּמְחִיר
  choice: за плату
  rationale: Сохраняет значение цены или вознаграждения и коммерческий образ, не ограничивая его только наличными деньгами.
- source_word: אָח
  choice: брата
  rationale: Сохранено прямое родственное обозначение; возможный более широкий смысл пояснён в сноске.
- source_word: תָּלוּי
  choice: ценимого на вес
  rationale: Форма трудна и допускает буквальные значения, связанные с подвешиванием или зависимостью. В параллелизме с платой и золотом наиболее вероятен образ взвешивания и оценки; перевод сохраняет этот образ, не вводя неподтверждённого определения вроде «верный».
- source_word: בִּזְהַב אוֹפִיר
  choice: золота Офира
  rationale: Сохранено библейское географическое название, связанное с золотом исключительной ценности.
theological_decisions:
- issue: Выбор между еврейским и резко отличающимся греческим чтением
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству Каирской генизы.
  alternative: 'Греческий текст: «Помни, что гнев не длится долго».'
  rationale: Там, где еврейский текст Сираха сохранился, он служит первичным источником. Существенно иное греческое чтение отмечено в сноске как свидетельство нестабильной текстовой традиции, без попытки искусственно согласовать оба варианта.
- issue: Трудное выражение אָח תָּלוּי
  choice: «брата, ценимого на вес золота Офира»
  alternative: «брата за золото Офира»; буквально возможны значения «висящий» или «зависящий».
  rationale: Контекст цены и золота указывает на оценку или взвешивание, однако еврейская форма остаётся трудной. Неопределённость честно отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной формой наставления. «Променяй» сохраняет торговый образ и нравственную силу предупреждения; «золото Офира» оставлено как библейский образ высочайшей ценности.
