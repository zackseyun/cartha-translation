translation:
  language: ru
  text: Не замышляй насилия против брата и не делай того же против друга и против товарища.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Не замышляй лжи против брата твоего и не делай того же другу».'
    reason: 'Греческая традиция содержит существенное разночтение: «ложь» вместо еврейского «насилие»; кроме того, в ней упомянут только «друг».'
lexical_decisions:
- source_word: תַּחֲרוֹשׁ
  choice: замышляй
  rationale: Буквально глагол означает «пахать», но в сочетании с отвлечённым объектом имеет переносный смысл «замышлять, готовить»; по-русски «замышлять насилие» естественно передаёт образ в его контекстуальном значении.
- source_word: חָמָס
  choice: насилия
  rationale: Слово обозначает насилие, жестокость или преступное притеснение; «насилие» сохраняет конкретную силу еврейского текста и не размывает её общим словом «зло».
- source_word: אָח
  choice: брата
  rationale: Сохранено прямое значение «брат» без преждевременного уточнения, идёт ли речь о родственнике или о ближнем из той же общины.
- source_word: רֵעַ וְחָבֵר
  choice: друга и товарища
  rationale: Два близких по смыслу обозначения переданы разными русскими словами, чтобы сохранить парность исходного текста.
- source_word: יַחְדָּו
  choice: равно как
  rationale: В данном перечислении слово подчёркивает совместное, равное распространение запрета на названных людей; оборот «равно как» передаёт эту функцию естественнее буквального «вместе».
theological_decisions:
- issue: Объём значения слова «брат»
  choice: Сохранить «брат» без поясняющего расширения
  alternative: «ближний» или «соплеменник»
  rationale: Еврейское אָח допускает как буквальное, так и более широкое общинное понимание; перевод не должен устранять эту неоднозначность.
- issue: Характер замышляемого проступка
  choice: «насилие» по еврейскому тексту
  alternative: «ложь» по греческому параллельному тексту
  rationale: Основным источником служит надёжно засвидетельствованный еврейский текст; существенное разночтение греческой традиции отмечено в сноске, а не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык; краткая наставительная формулировка сохраняет достоинство и параллелизм мудростной речи. «Равно как» слегка возвышенно, но понятно современному читателю и позволяет избежать неестественного буквального «вместе».
