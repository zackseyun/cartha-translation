translation:
  language: ru
  text: Всем сердцем бойся Бога и свято почитай Его священников.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכָל לִבְּך
  choice: всем сердцем
  rationale: Прямо передаёт еврейское выражение полноты внутренней преданности и естественно звучит по-русски.
- source_word: פְּחַד
  choice: бойся
  rationale: Сохраняет сильное и богословски значимое понятие страха перед Богом; более мягкое «благоговей» неоправданно сужало бы смысл.
- source_word: אִל
  choice: Бога
  rationale: Обычный русский эквивалент еврейского обозначения Бога; греческая параллель читает «Господа», но уверенный еврейский текст имеет אִל.
- source_word: הַקְדִישׁ
  choice: свято почитай
  rationale: Буквально глагол означает «освящай, считай святым, отделяй как святыню». Формула «свято почитай» сохраняет связь со святостью и одновременно естественно выражает требуемое отношение к священникам; её поддерживает греческое θαύμαζε в значении высокого почтения.
theological_decisions:
- issue: Характер страха перед Богом
  choice: бойся Бога
  alternative: благоговей перед Богом
  rationale: Еврейское פְּחַד обозначает страх и не требует его немедленного истолкования лишь как благоговения; перевод сохраняет напряжённость исходного образа.
- issue: Смысл повеления относительно священников
  choice: свято почитай Его священников
  alternative: освящай Его священников
  rationale: Буквальное «освящай» по-русски могло бы ошибочно приписать читателю совершение обряда посвящения. Выбранная формулировка передаёт признание их священного статуса и должное почтение, не вводя конфессионально специфического учения.
