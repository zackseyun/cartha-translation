lexical_decisions:
- source_word: על מקנה
  choice: о скоте
  rationale: מקנה здесь естественнее всего обозначает принадлежащий человеку скот; русское «скот» охватывает стада и не сужает значение до крупного рогатого скота.
- source_word: בין רב למעט
  choice: много ли его или мало
  rationale: Идиоматический оборот противопоставляет количество. Такая формулировка ясна по-русски и сохраняет распределительный смысл.
- source_word: ועל ממחיר
  choice: и о цене
  rationale: Еврейская конструкция, вероятно, сжата или текстуально неровна; по смыслу речь идёт о цене или оценке в торговой ситуации.
- source_word: ממכר תגר
  choice: товара у торговца
  rationale: ממכר может обозначать продаваемое, а תגר — торговца. Формулировка передаёт коммерческий смысл, не навязывая спорного притяжательного отношения «продажа торговца».
