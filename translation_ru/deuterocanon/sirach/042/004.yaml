  text: об обмане с весами и гирями[a] и о мерах — ефе и каменной гире[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «о точности весов и гирь», а не «об обмане с весами и гирями». Еврейский текст здесь труден и не вполне согласуется с греческим.'
    reason: alternative_reading
  - marker: b
    text: 'Вторая часть греческого текста существенно отличается: «о приобретении многого и малого»; возможно также понимание «о больших и малых количествах». В еврейском тексте названы ефа и каменная гиря.'
    reason: textual_variant
  - marker: c
    text: Ефа — древняя мера объёма сыпучих веществ; каменная гиря служила эталоном веса в торговле.
    reason: cultural_note
lexical_decisions:
- source_word: שחק
  choice: обман
  rationale: Переданное еврейское слово в этом месте трудно для истолкования. В сочетании с весами оно, вероятнее всего, указывает на нечестную манипуляцию при взвешивании; расхождение с греческим чтением «точность» сохранено в сноске.
- source_word: מאזנים
  choice: весы
  rationale: Обычное и понятное современному читателю обозначение прибора для взвешивания.
- source_word: פלס
  choice: безмен
  rationale: В данном торговом контексте слово обозначает весовой прибор или приспособление для уравновешивания. «Безмен» естественно передаёт этот смысл, не повторяя слово «весы».
- source_word: תמחות
  choice: меры
  rationale: Форма текстологически трудна, однако сочетание с ефой и камнем указывает на торговые меры и эталоны измерения. Общее слово «меры» не навязывает узкой реконструкции.
- source_word: איפה
  choice: ефа
  rationale: Сохранено название конкретной древней меры объёма; его значение поясняется в сноске.
- source_word: אבן
  choice: каменная гиря
  rationale: В торговом контексте «камень» означает камень, служивший эталонной гирей; перевод делает эту функцию явной.
- source_word: περὶ ἀκριβείας ζυγοῦ καὶ σταθμίων
  choice: об обмане с весами и безменом
  rationale: Греческий параллельный текст говорит о точности весов и гирь, но основной текст следует сохранившемуся еврейскому свидетельству; альтернативное греческое понимание отмечено в сноске.
- source_word: περὶ κτήσεως πολλῶν καὶ ὀλίγων
  choice: о мерах — ефе и каменной гире
  rationale: Греческая вторая часть значительно отличается от еврейской. Основной перевод сохраняет конкретные еврейские обозначения ефы и каменной гири, а вариант отражён в сноске.
