  yaml_path: translation/deuterocanon/sirach/042/021.yaml
  text: He has set in order the mighty works of his wisdom[a], and he alone is from everlasting. He neither gains increase nor diminishes[d][c][b], and he has no need of any counselor.
translation:
  language: ru
  text: Он упорядочил великие дела Своей мудрости; Он один существует от века.[a] К Нему ничего не прибавляется, и от Него ничего не отнимается,[b] и Он не нуждается ни в чьём совете.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Он один от века». Греческая параллель разворачивает временную мысль: «прежде века и во век».'
    reason: cross_reference
  - marker: b
    text: 'Еврейское слово, переданное словами «не отнимается», в этом месте трудно для истолкования. Вероятный смысл: к Богу нельзя ничего прибавить и от Него ничего отнять.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «ни в каком понимающем» или «ни в ком проницательном»; в данном контексте это может означать того, чей совет или разумение могло бы понадобиться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גבורת חכמתו תכן
  choice: Он привёл в порядок великие дела Своей мудрости
  rationale: Глагол תכן может обозначать установление, соразмерение или упорядочение, а греческое ἐκόσμησεν подтверждает оттенок упорядочивания. גבורת — сжатая конструкция; греческое τὰ μεγαλεῖα поддерживает конкретное «великие дела», а не только отвлечённое «могущество».
- source_word: אחד הוא מעולם
  choice: Он один — от века
  rationale: אחד הוא буквально допускает «Он один/един»; в контексте выражена исключительность Бога. מעולם передано традиционно и естественно как «от века», причём греческая параллель подтверждает временной смысл, простирающийся за пределы отдельной эпохи.
- source_word: לא נוסף ולא נאצל
  choice: К Нему ничего не прибавляется и от Него ничего не убавляется
  rationale: 'Параллельная пассивная конструкция сохранена ясной русской формулировкой. Значение נאצל в данном месте трудно, поэтому перевод передаёт вероятную антитезу: к Богу нельзя ничего прибавить и от Него ничего отнять.'
- source_word: ולא צריך לכל מבין
  choice: и Он не нуждается ни в ком разумном
  rationale: מבין буквально означает «понимающий, разумный, проницательный». Формальный вариант сохраняет неоднозначность роли такого человека и не сужает её без необходимости до «советника».
theological_decisions:
- issue: Единственность Бога в אחד הוא
  choice: Он один
  alternative: Он един
  rationale: «Он один» естественно выражает исключительность, сохраняя близость к буквальному строю и не превращая фразу в более специальную метафизическую формулу.
- issue: Временное значение מעולם с учётом греческой параллели
  choice: от века
  alternative: издревле; от вечности
  rationale: «От века» допускает сильный временной смысл и соответствует греческому свидетельству «прежде века и во век», но не расширяет еврейскую строку до полной греческой формулы.
- issue: Самодостаточность Бога и значение מבין
  choice: не нуждается ни в ком разумном
  alternative: не нуждается ни в каком советнике
  rationale: Контекст позволяет понимать מבין как советника, однако еврейское слово шире. В основном тексте сохранено это более широкое значение, чтобы не разрешать подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи, но без архаизмов. Прописные местоимения по отношению к Богу использованы последовательно. Синтаксис сохраняет трёхчастное движение еврейского стиха и его богословское напряжение.
