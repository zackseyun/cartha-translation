  source_fidelity: Первая строка обоснованно передаёт еврейское תכן как упорядочивающее действие, при этом греческая параллель поддерживает понимание גבורת как «великих дел». Антитеза «ничего не прибавляется / не отнимается» удачно отражает вероятный смысл трудного נאצל, не выдавая его за несомненный. Заключительное מבין буквально шире, чем «советник», однако в русском основной вариант «ни в ком разумном» семантически и стилистически неудачен.
