  terminology: «От века» уместно как сжатая передача מעולם с учётом греческой временной параллели. «Совет» в основном тексте передаёт контекстуальную функцию מבין, а сноска сохраняет буквальную широту «понимающего/проницательного», не навязывая специального богословского толкования.
