lexical_decisions:
- source_word: לא נעדר ממנו כל שכל
  choice: Не укрылось от Него ни одно разумение
  rationale: Еврейское שכל здесь обозначает мысль, замысел или содержание разумения; в контексте всеведения естественная русская отрицательная конструкция передаёт, что ничто мыслимое не остаётся вне Его знания. «Разумение» сохраняет связь с исходной лексемой, не сужая её до способности Бога понимать.
- source_word: ולא חלפו כל דבר
  choice: и не миновало Его ни одно слово
  rationale: דבר может означать «слово», «дело» или «вещь». Выбрано «слово» согласно ближайшему лексическому значению и греческому λόγος; глагол חלף передан как «миновало», сохраняя образ того, что ничто не проходит мимо Бога.
theological_decisions:
- issue: Выражение Божьего всеведения
  choice: 'Сохранить две параллельные отрицательные формулы: ничто не укрылось и ничто не миновало Его'
  alternative: 'Передать пояснительно: «Он понимает всё и знает обо всём»'
  rationale: Исходный текст утверждает полноту знания образно и с некоторой лексической широтой; пояснительный вариант устранил бы поэтический параллелизм и чрезмерно конкретизировал смысл.
translation_notes:
  register: Современный литературный русский с библейской торжественностью; синтаксический параллелизм еврейского текста сохранён. Местоимение «Него» написано с прописной буквы как ясная отсылка к Богу.
