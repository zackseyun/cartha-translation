  text: All these live and endure forever; in every need, all obey.[a][b]
translation:
  language: ru
  text: Всё это живёт и пребывает вовеки; во всякой нужде всё повинуется.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В составном еврейском тексте по каирским рукописям здесь стоит иная, по-видимому смещённая из соседнего контекста строка: «И кто может насытиться созерцанием великолепия небесной выси в её чистоте?» Более древнее еврейское свидетельство из Масады и греческая традиция поддерживают смысл, переданный в основном тексте.'
    reason: textual_variant
  - marker: b
    text: 'Или: «при всякой нужде»; также возможно: «для всякой надобности» или «для всякого назначения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ταῦτα / הכל
  choice: Всё это
  rationale: Передаёт указательную силу греческого выражения и отсылает к только что названным творениям.
- source_word: ζῇ / חי
  choice: живёт
  rationale: Прямо и естественно выражает продолжающуюся жизнь творения.
- source_word: μένει εἰς τὸν αἰῶνα / קים לעד
  choice: пребывает вовеки
  rationale: Сохраняет длительный характер действия и возвышенный, но современно понятный регистр.
- source_word: ἐν πάσαις χρείαις
  choice: для всякой надобности
  rationale: χρεία допускает значения нужды, применения и назначения; выбранная формулировка сохраняет эту широту и не сводит смысл только к человеческой нужде.
- source_word: ὑπακούει
  choice: повинуется
  rationale: Передаёт упорядоченное послушание всего творения; единственное число согласовано с собирательным «всё».
- source_word: ומי ישבע להביט תואר תואר מרום רקיע על טוהר
  choice: кто может насытиться созерцанием великолепия небесной выси в её чистоте
  rationale: Эта приблизительная передача приведена в примечании как свидетельство сохранившейся каирской еврейской строки, вероятно смещённой из соседнего контекста.
theological_decisions:
- issue: Основной текст при расхождении сохранившейся каирской еврейской строки с контекстом и древними параллельными свидетельствами
  choice: В основном тексте следовать связному чтению греческой традиции, которое также поддерживается древним свидетельством из Масады.
  alternative: 'Перевести буквально напечатанную составную еврейскую строку: «И кто может насытиться созерцанием великолепия небесной выси в её чистоте?»'
  rationale: Каирская еврейская строка не соответствует ходу данного контекста и, по-видимому, была смещена. Греческий текст даёт связное чтение стиха, согласующееся с более древним еврейским свидетельством. Расхождение открыто отмечено, а не скрыто.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Пребывает вовеки» сохраняет достоинство стиля, а «для всякой надобности» — смысловую широту χρεία. Все текстологические расхождения вынесены в прозрачные примечания.
