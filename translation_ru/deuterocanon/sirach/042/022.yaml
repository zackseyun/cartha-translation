  text: He lives and stands forever[b][a]; his goodness passes from one thing to another.
translation:
  language: ru
  text: Он жив и пребывает вовеки; Его благость переходит от одного к другому.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская формулировка здесь кратка и не вполне ясна. В греческом тексте сохранилось иное, более пространное чтение: «Ничего не было ни прибавлено, ни убавлено, и Он не нуждался ни в каком советнике. Как желанны все Его дела, и как искра — то, что можно увидеть!»'
    reason: textual_variant
  - marker: b
    text: 'Возможный перевод: «Его благость проходит над всем» или «Его благость идёт от одного к другому». Еврейское выражение сжато, и точный смысл слов «это над этим» неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוא
  choice: Он
  rationale: Местоимение в контексте гимна относится к Богу, поэтому передано личным местоимением.
- source_word: חי
  choice: жив
  rationale: Еврейская форма выражает продолжающуюся жизнь; краткое «жив» естественно по-русски и сохраняет длительный смысл.
- source_word: ועומד
  choice: и пребывает
  rationale: Буквально глагол означает «стоит», но в сочетании с «вовеки» передаёт незыблемое, непрерывное существование; «пребывает» естественно выражает этот смысл.
- source_word: לעד
  choice: вовеки
  rationale: Достоинственное и понятное обозначение бесконечной продолжительности.
- source_word: זה על זה
  choice: от одного к другому
  rationale: Сжатый оборот допускает значение последовательности или отношения между предметами; перевод сохраняет эту неопределённость без искусственной конкретизации.
- source_word: חלף
  choice: переходит
  rationale: Глагол может означать прохождение, переход или смену; «переходит» сохраняет образ движения и не сужает смысл.
- source_word: טובו
  choice: Его благость
  rationale: Слово обозначает добро, благость или благодеяние. «Благость» прямо связывает качество и благотворное действие, не сводя его лишь к щедрости или красоте.
theological_decisions:
- issue: Соотношение сохранившейся еврейской строки и более пространного греческого параллельного текста
  choice: Основной текст переведён по сохранившемуся еврейскому чтению; греческое разночтение приведено в примечании.
  alternative: Заменить еврейскую строку греческим текстом или согласовать её с ним.
  rationale: При наличии еврейского текста Сираха он имеет первенство. Греческая форма, по-видимому, отражает иной или расширенный текст и потому не должна незаметно подменять еврейское чтение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Пребывает вовеки» передаёт устойчивость без архаической перегруженности; во второй половине сохранена смысловая сжатость и неоднозначность еврейского текста.
