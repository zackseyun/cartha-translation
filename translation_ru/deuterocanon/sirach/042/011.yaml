base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/011.yaml
  text: Keep a strict watch over your virgin daughter[a], lest she make you a byword of disgrace, a gossip of the city and a curse of the people[c][b], and seat you in the assembly at the gate.
translation:
  language: ru
  text: Установи строгий надзор над своей дочерью-девственницей, чтобы она не создала тебе дурной славы[a], не сделала тебя предметом пересудов в городе и проклятий в народе[c] и не усадила тебя среди собравшихся у ворот[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имя позора»; возможно также: «позорная репутация» или «дурное имя». Греческая параллель развивает эту мысль как публичное осмеяние.'
    reason: lexical_alternative
  - marker: b
    text: Заключительные слова еврейского текста трудны. Буквально речь идёт о том, что дочь заставит отца сидеть «среди собрания (или толпы) у ворот». Городские ворота служили местом общественных собраний и суда; греческая параллель также говорит о позоре перед множеством людей.
    reason: cultural_note
  - marker: c
    text: 'Масадский список сохраняет более краткий текст: «За дочерью следи; пересуды в городе и собрание народа…» Здесь перевод следует более полному тексту Каирской генизы.'
    reason: textual_variant
lexical_decisions:
- source_word: בני על בתולתך החזק משמר
  choice: За девственной дочерью своей установи строгий надзор
  rationale: בני в сочетании с משמר имеет идиоматический смысл установления охраны, а החזק усиливает требование бдительности. «Девственная дочь» сохраняет значение בתולה и социально-половой оттенок исходного текста.
- source_word: פן תעשה לך שם סרה
  choice: чтобы она не создала тебе дурной славы
  rationale: שם סרה означает дурную, позорящую репутацию. Формулировка естественна по-русски и сохраняет направленность последствий на отца.
- source_word: דבת עיר
  choice: не сделала тебя предметом пересудов в городе
  rationale: דבה может обозначать дурную молву, злоречие или пересуды. Такой перевод ясно выражает публичный характер позора и согласуется с синтаксисом всей фразы.
- source_word: וקללת עם
  choice: и проклятий в народе
  rationale: Фраза описывает человека как объект общественного проклятия или поношения; множественное число «проклятий» естественно сочетается с «предметом».
- source_word: והושיבתך בעדר שער
  choice: и не усадила тебя среди собравшихся у ворот
  rationale: Глагол сохраняет каузативное значение «заставить/привести к тому, чтобы сидеть». Трудное בעדר שער передано как собрание у городских ворот — месте публичного разбирательства, без полного устранения образной неоднозначности.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и греческой параллели в трудной заключительной фразе
  choice: Следовать еврейскому тексту, понимая «ворота» как место публичного собрания; греческий использовать лишь как подтверждение темы общественного позора.
  alternative: 'Следовать греческому расширению: «сделает тебя посмешищем врагов… и опозорит перед множеством».'
  rationale: Еврейский свидетель сохранён и потому остаётся основой перевода. Греческая параллель помогает установить общий контекст, но её дополнительные упоминания врагов и многочисленной толпы не внесены в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительной премудростной речи. Синтаксис сделан понятным для широкого читателя; общественно-историческая установка стиха сохранена без смягчения или конфессионального истолкования.
