  text: He searches out the deep and the heart[b][a], and he understands all their secrets.
translation:
  language: ru
  text: Бездну и сердце Он исследует[b] и вникает во всё, что в них обнажено[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «и постиг все их замыслы (или: хитрости)». В еврейском тексте буквально говорится обо «всей их обнажённости», то есть обо всём, что открыто перед Ним.'
    reason: alternative_reading
  - marker: b
    text: 'Масадская рукопись сохраняет лишь краткое начало: «Бездну и сердце исследовал»; текст Каирской генизы продолжается словами обо всём, что в них обнажено.'
    reason: textual_variant
lexical_decisions:
- source_word: תהום
  choice: бездну
  rationale: Передаёт космическую глубину или бездну; греческое ἄβυσσον подтверждает этот смысл.
- source_word: לב
  choice: сердце
  rationale: Сохраняет древнееврейское обозначение внутреннего человека, включая мысли и намерения; соответствует греческому καρδίαν.
- source_word: חקר
  choice: исследует
  rationale: Глагол означает тщательное разыскание и исследование. Настоящее время естественно выражает постоянное Божье знание.
- source_word: מערומיהם
  choice: всё, что в них обнажено
  rationale: Сохраняет образ обнажённости в еврейском тексте, но выражает его естественнее, чем буквальное «все их наготы»; речь идёт обо всём открытом и не скрытом от Бога.
- source_word: יתבונן
  choice: вникает
  rationale: Форма глагола обозначает внимательное постижение и различение, а не только зрительное наблюдение.
theological_decisions:
- issue: Божественный субъект подразумевается, но не назван в данной еврейской строке
  choice: Передать субъект местоимением «Он», не добавляя имени «Господь»
  alternative: Прямо вставить «Господь»
  rationale: Контекст ясно указывает на Бога, а греческий параллельный текст далее прямо называет Господа; однако в самой еврейской строке имя отсутствует, поэтому оно не добавлено.
- issue: Образ обнажённости и греческое чтение о замыслах
  choice: 'Сохранить в основном тексте еврейский образ: «всё, что в них обнажено»'
  alternative: «все их тайны» или, по греческому тексту, «все их замыслы/хитрости»
  rationale: Первенство отдано засвидетельствованному еврейскому чтению; отличающаяся греческая традиция отмечена в сноске, без устранения текстовой неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Необычный еврейский образ сохранён в понятной форме; синтаксис остаётся кратким и торжественным.
