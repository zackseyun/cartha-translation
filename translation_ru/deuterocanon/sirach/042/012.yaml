translation:
  language: ru
  text: Не показывай своей красоты ни одному мужчине[a] и не сиди в доме среди женщин[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «всякому мужчине не давай облика [или красоты]». Греческий параллельный текст отражает иное понимание: «Не смотри ни на какого человека в его красоте».'
    reason: alternative_reading
  - marker: b
    text: Последний еврейский глагол в генизском тексте имеет неясную форму и значение. Греческий параллельный текст поддерживает смысл «не сиди вместе, не пребывай в обществе женщин»; сообщается, что свидетельство из Масады также отражает близкое значение, связанное с общением.
    reason: textual_variant
lexical_decisions:
- source_word: לכל זכר
  choice: ни одному мужчине
  rationale: Еврейское выражение буквально означает «всякому/каждому лицу мужского пола». Русское «ни одному мужчине» естественно передаёт распределительное значение при запрете и сохраняет указание на пол.
- source_word: אל תתן תאר
  choice: не показывай своей красоты
  rationale: תאר обозначает облик, наружность, красоту; сочетание с נתן здесь лучше понимать идиоматически — не являть и не делать свою красоту доступной чужому взгляду. «Не показывай» звучит современно и достойно, не превращая выражение в буквальное «не давай облика».
- source_word: ובית נשים
  choice: в доме среди женщин
  rationale: Перевод сохраняет еврейское בית («дом») и вместе с греческим параллельным текстом передаёт обстановку пребывания среди женщин, не уточняя без достаточных оснований, идёт ли речь об особых женских покоях.
- source_word: אל תסתויד
  choice: не сиди
  rationale: Форма и значение глагола в генизском еврейском тексте неясны. Греческое συνέδρευε указывает на совместное сидение или пребывание в обществе; конкретное «не сиди» сохраняет образ и не расширяет запрет до всякого общения.
theological_decisions:
- issue: Гендерно определённая лексика наставления
  choice: Сохранить «мужчине» и «женщин»
  alternative: 'Передать обобщённо: «никому» и «среди людей»'
  rationale: Еврейский текст прямо употребляет זכר и נשים. Нейтрализация устранила бы существенную особенность наставления.
- issue: Соотношение трудного еврейского текста и греческого параллельного свидетельства
  choice: Взять еврейский текст за основу, а греческий использовать для уточнения неясного последнего глагола
  alternative: Следовать греческому тексту целиком либо оставить буквальную, но непонятную передачу еврейской формы
  rationale: Сохранившийся еврейский текст имеет первенство, однако греческое свидетельство позволяет осторожно восстановить смысл неясного глагола. Расхождение в первой половине стиха не сглаживается, а отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая форма наставления сохранена. «Не показывай своей красоты» естественнее буквального «не давай облика», а «не сиди в доме среди женщин» удерживает как еврейское упоминание дома, так и поддержанное греческим текстом значение совместного пребывания.
