base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/008.yaml
  text: 'Concerning the discipline of a simpleton and a fool[a], and an old man who turns back and takes counsel in sexual immorality: be truly careful[b], and a modest man before every living being.'
translation:
  language: ru
  text: 'О наставлении простака и глупца и о старике, который возвращается и ищет совета в распутстве[a]: будь по-настоящему осмотрителен и скромен перед всеми живущими[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте вместо слов о старике, который возвращается и ищет совета в распутстве: «и о престарелом человеке, которого судят вместе с юношами». Еврейский и греческий тексты здесь существенно различаются.'
    reason: alternative_reading
  - marker: b
    text: 'По греческому параллельному тексту: «и будешь истинно наставлен и испытан перед всеми живущими».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוסר
  choice: наставление
  rationale: Слово обозначает нравственное обучение, в том числе исправляющее; «наставление» естественно звучит в данном перечислении.
- source_word: פותה
  choice: простак
  rationale: Передаёт смысл доверчивого, легко вводимого в заблуждение человека и сохраняет лексику традиции Премудрости.
- source_word: כסיל
  choice: глупец
  rationale: Обычное обозначение нравственно и разумно несостоятельного человека в литературе Премудрости.
- source_word: ושב
  choice: который возвращается к прежнему
  rationale: Глагол буквально означает возвращение; добавление «к прежнему» делает подразумеваемый рецидив понятным, не уточняя его сверх текста.
- source_word: ישיש
  choice: старик
  rationale: Прямо и естественно обозначает человека преклонного возраста.
- source_word: נוטל עצה
  choice: ищет совета
  rationale: Естественный русский эквивалент идиомы «берёт совет»; сохраняет совещательный смысл.
- source_word: בזנות
  choice: в распутстве
  rationale: Передаёт широкий смысл недозволенного сексуального поведения, не сужая его до проституции.
- source_word: זהיר
  choice: осмотрителен
  rationale: Выражает осторожность и нравственную бдительность в более точном и литературном регистре, чем общее «осторожен».
- source_word: באמת
  choice: по-настоящему
  rationale: Передаёт усилительный смысл подлинности и звучит естественно в современном русском.
- source_word: צנוע
  choice: скромен
  rationale: Сохраняет основной смысл скромности и сдержанности, не сводя слово исключительно к смирению или осторожности.
- source_word: לפני כל חי
  choice: перед всеми живущими
  rationale: Естественно передаёт буквальное «перед всяким живым» и сохраняет универсальный охват.
theological_decisions:
- issue: Выбор основного свидетеля при существенном расхождении еврейского и греческого текстов
  choice: Основной текст следует сохранившемуся еврейскому чтению о старике, который возвращается к прежнему и ищет совета в распутстве.
  alternative: 'Греческий параллельный текст: «и о глубоком старике, судящемся с юношами»; в заключении: «и будешь истинно наставлен и испытан перед всеми живущими».'
  rationale: Сохранившийся еврейский текст является первичным источником перевода Сираха; существенное греческое разночтение вынесено в примечания, чтобы не скрывать текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством, присущим учительной литературе. Сохранена несколько сжатая, перечневая структура еврейского текста; существенные греческие варианты даны в примечаниях.
