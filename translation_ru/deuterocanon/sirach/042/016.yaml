translation:
  language: ru
  text: Солнце восходит и сияет над всем видимым[b][a], и слава Господа — над всеми Его делами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «над всем явленным (открытым взору)». В греческом параллельном тексте смысл ближе к: «давая свет, взирает на всё».'
    reason: alternative_reading
  - marker: b
    text: Более древний еврейский текст из Масады, по-видимому, содержит в этой строке иную формулировку, чем рукописи Каирской генизы, положенные в основу перевода.
    reason: textual_variant
lexical_decisions:
- source_word: שמש
  choice: Солнце
  rationale: Прямое обозначение небесного светила; в русском языке артикль не требуется.
- source_word: זורחת
  choice: восходит и сияет
  rationale: Причастие от זרח совмещает оттенки восхода и сияния. Два русских глагола передают полноту образа, а греческое φωτίζων подтверждает смысл освещения.
- source_word: על כל
  choice: над всем / над всеми
  rationale: Оборот выражает всеохватность. Повтор предлога «над» сохраняет параллелизм двух частей стиха.
- source_word: נגלתה
  choice: видимым
  rationale: Форма указывает на открытое, явленное взору. «Всё видимое» естественно по-русски и не придаёт слову лишнего оттенка особого откровения.
- source_word: כבוד
  choice: слава
  rationale: Обычный и богословски ёмкий русский эквивалент כבוד в отношении Бога.
- source_word: ה׳
  choice: Господа
  rationale: Рукописное сокращение божественного имени/титула передано традиционным для русского библейского стиля словом «Господь».
- source_word: מעשיו
  choice: Его творениями
  rationale: В данном контексте речь идёт обо всём сотворённом Богом. «Творения» звучит естественнее, чем буквальное «дела», и сохраняет связь с мирозданием.
theological_decisions:
- issue: Передача божественного имени/титула ה׳
  choice: Господа
  alternative: ГОСПОДА
  rationale: Источник использует сокращённое ה׳; «Господь» соответствует русской традиции и не навязывает графическое решение, которого сам данный текст явно не задаёт.
- issue: Расхождение еврейского и греческого текста в первой части
  choice: Солнце восходит и сияет над всем видимым
  alternative: Солнце, давая свет, взирает на всё
  rationale: Основой служит еврейский текст, включая נגלתה — «видимое/явленное». Греческий параллельный текст помогает передать זורחת как сияние, но его глагол «взирает» не вводится в основной текст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксический параллелизм сохранён; местоимение «Его» написано с прописной буквы в соответствии с распространённой русской религиозно-издательской практикой.
