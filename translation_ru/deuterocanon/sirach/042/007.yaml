  text: For whatever place you appoint[a], keep count by your hand; and every giving and receiving should be in writing.
translation:
  language: ru
  text: Всё, что передаёшь[a], сам учитывай; всякую выдачу и получение записывай.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза здесь сжата и не вполне ясна; буквально в ней присутствуют слова «место» и «поручать (назначать)». В греческом параллельном тексте сказано: «Что бы ты ни передавал, [передавай] по числу и весу, и всякую выдачу и получение [оформляй] письменно». Это подтверждает общий смысл тщательного учёта и письменной записи операций.'
    reason: alternative_reading
lexical_decisions:
- source_word: על מקום תפקד
  choice: Всё, что поручаешь другому
  rationale: 'Еврейская фраза сжата и в буквальном виде неясна: מקום обычно означает «место», а פקד может означать «поручать, вверять, назначать, учитывать». Контекст хозяйственного учёта и греческое ὃ ἐὰν παραδιδῷς («что бы ты ни передавал») указывают на поручение или передачу имущества другому лицу. Неясность отмечена в сноске.'
- source_word: יד תספור
  choice: пересчитывай собственноручно
  rationale: 'Буквально: «пусть твоя рука считает» или «рукой считай». Русское «собственноручно» сохраняет акцент на личной проверке и звучит естественно; «пересчитывай» передаёт практический смысл контроля количества.'
- source_word: ומתת ולקח
  choice: всякую выдачу и получение
  rationale: Парная формула обозначает обе стороны хозяйственной операции — то, что выдано, и то, что получено. Слова «выдача и получение» уместны для документированного учёта и соответствуют греческому δόσις καὶ λῆψις.
- source_word: הכל בכתב
  choice: записывай
  rationale: 'Буквально: «всё — в письменном виде». Глагольная формулировка естественна по-русски и ясно выражает требование фиксировать каждую операцию письменно.'
