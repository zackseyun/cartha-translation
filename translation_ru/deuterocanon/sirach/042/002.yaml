translation:
  language: ru
  text: о законе Всевышнего и установлении[b], и о судебном решении, оправдывающем нечестивого[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «о судебном решении, признающем нечестивого правым» или «о том, кто оправдывает нечестивого». Еврейское выражение здесь кратко и не вполне ясно; глагол להצדיק и соответствующий ему греческий δικαιῶσαι употреблены в судебном смысле.'
    reason: лексическая альтернатива и текстуальная неясность
  - marker: b
    text: В еврейском тексте — «установление»; в греческой параллели — «завет».
    reason: разночтение древних свидетельств
lexical_decisions:
- source_word: תורת עליון
  choice: закон Всевышнего
  rationale: תורה может означать и «наставление», и «закон»; сочетание с חוק и общий юридический контекст здесь поддерживают значение «закон».
- source_word: חוק
  choice: установление
  rationale: חוק обозначает закреплённое предписание или постановление. «Установление» сохраняет юридический оттенок и не сливается со словом «закон».
- source_word: מצדיק / להצדיק רשע
  choice: суд, оправдывающий нечестивого
  rationale: 'Корень צדק в породе hифиль имеет здесь судебный смысл: признать правым, оправдать. Греческая параллель с κρίματος и δικαιῶσαι подтверждает судебный контекст, хотя дошедший еврейский текст сформулирован сжато и несколько неровно.'
- source_word: רשע
  choice: нечестивого
  rationale: רשע обозначает виновного, неправедного или нечестивого человека; в данном контексте «нечестивого» естественно передаёт нравственно-судебный смысл и согласуется с греческим ἀσεβῆ.
- source_word: על / ועל
  choice: о / и о
  rationale: Повтор предлога оформляет перечень; русское «о … и о …» сохраняет его структуру естественным образом.
theological_decisions:
- issue: Судебное значение צדק/δικαιόω
  choice: оправдывающем
  alternative: признающем нечестивого праведным; выносящем решение в пользу нечестивого
  rationale: «Оправдывать» является точным и понятным русским судебным термином. Сноска сохраняет более развёрнутые варианты и не сводит выражение к позднейшему богословскому употреблению.
- issue: Неясная форма еврейского свидетельства מצדיק להצדיק
  choice: суд, оправдывающий нечестивого
  alternative: тот, кто оправдывает нечестивого
  rationale: Греческая параллель прямо читает «о суде — оправдать нечестивого» (περὶ κρίματος δικαιῶσαι τὸν ἀσεβῆ), что позволяет восстановить предмет перечня, не скрывая расхождения с кратким еврейским свидетельством; расхождение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным юридико-мудрым регистром. Сохранена структура фрагмента как продолжения перечня из предыдущего стиха; подлинная текстуальная неясность не устранена молча, а отражена в сносках.
