    reason: lexical_alternative
lexical_decisions:
- source_word: על חשבון
  choice: о расчёте
  rationale: Предлог על вводит предмет речи, а חשבון в данном хозяйственно-правовом контексте означает расчёт или сведение счетов.
- source_word: חוכר
  choice: арендатор
  rationale: Слово обозначает человека, который арендует землю или иное имущество; «арендатор» точно и естественно в современном русском языке.
- source_word: אדון
  choice: хозяин
  rationale: В хозяйственном контексте слово указывает на владельца или распорядителя; «хозяин» сохраняет широту значения и звучит естественнее, чем возвышенное «господин».
- source_word: אורח
  choice: гость
  rationale: Основное значение еврейского слова — «гость», хотя оно может обозначать и путника; перевод следует сохранившемуся еврейскому тексту.
- source_word: מחלקות נחלה
  choice: разделе наследства
  rationale: Сочетание обозначает раздел или распределение наследственного владения; выбран обычный русский юридико-бытовой оборот.
- source_word: ויש
  choice: и имущества
  rationale: Краткое и необычное здесь יש понято как наличное достояние, собственность; форма «имущества» естественно продолжает выражение «о разделе».
