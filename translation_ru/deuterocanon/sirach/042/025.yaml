  text: One thing complements another's good things[b][a], and who can have enough of seeing his glory?
translation:
  language: ru
  text: Одно укрепило блага другого[a], и кто насытится, созерцая Его славу?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более формально: «Одно утвердило блага другого». Греческий глагол означает «делать твёрдым», «укреплять»; в этом контексте он может выражать взаимную согласованность сотворённого.'
    reason: lexical_alternative
  - marker: b
    text: «Его», вероятнее всего, относится к Богу; альтернативно «слава» может пониматься как великолепие, явленное в творении.
    reason: alternative_reading
lexical_decisions:
- source_word: ἓν τοῦ ἑνὸς
  choice: одно … другого
  rationale: Сохранена эллиптическая взаимная соотнесённость творений; существительное не добавлено, поскольку русское субстантивированное «одно» звучит естественно в контексте.
- source_word: ἐστερέωσεν
  choice: утверждает
  rationale: Передаёт основное значение «делать твёрдым, укреплять» и одновременно допускает смысл взаимной поддержки и согласованности творений. Настоящее время по-русски естественно выражает общий порядок, описанный греческим аористом.
- source_word: τὰ ἀγαθά
  choice: благо
  rationale: Собирательное единственное «благо» естественно передаёт субстантивированное множественное число со значением благих свойств или благодеяний.
- source_word: τίς πλησθήσεται
  choice: кто насытится
  rationale: Формально и идиоматично передаёт будущую пассивную форму со значением достижения полноты или удовлетворения; риторическая невозможность сохраняется.
- source_word: ὁρῶν
  choice: созерцая
  rationale: Деепричастие сохраняет длительный характер причастия и уместно для благоговейного видения славы.
- source_word: δόξαν αὐτοῦ
  choice: Его славу
  rationale: «Слава» — прямой и традиционно понятный эквивалент δόξα. Местоимение наиболее естественно относится к Богу; прописная буква разъясняет выбранное прочтение, а альтернатива отмечена в сноске.
theological_decisions:
- issue: К кому относится αὐτοῦ
  choice: «Его» — к Богу
  alternative: «его/её» — к творению или явленному в нём великолепию
  rationale: В окружающем гимне порядок творения являет величие Творца, поэтому отнесение местоимения к Богу наиболее естественно. Грамматически возможное более безличное понимание сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но доступным библейским звучанием. Эллиптичность первой части и богословская неоднозначность местоимения сохранены; смысл не сводится к частному конфессиональному толкованию.
