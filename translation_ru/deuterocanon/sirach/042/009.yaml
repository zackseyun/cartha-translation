base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/009.yaml
  text: 'A daughter is a hidden cause of deceit to her father[a], and anxiety over her drives away his sleep: in her youth, lest she remain unmarried, and in her virginity[b], lest she not be married.'
translation:
  language: ru
  text: 'Дочь — скрытая ложь отцу[a], и тревога о ней прогоняет его сон: в её юности — как бы она не миновала пору замужества[b], а в девстве — как бы её не выдали замуж.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «скрытая ложь». Греческий параллельный текст читает «тайная бессонница», что, вероятно, указывает на скрытое беспокойство, которое дочь причиняет отцу.'
    reason: alternative_reading
  - marker: b
    text: 'Еврейское выражение неясно. Греческий параллельный текст допускает смысл: «как бы она не миновала расцвет», то есть подходящую для замужества пору.'
    reason: textual_variant
lexical_decisions:
- source_word: בת לאב
  choice: Дочь для отца
  rationale: Кратко передаёт еврейское обозначение отношения дочери к отцу; оборот «для отца» естественно вводит то, чем она оказывается для него.
- source_word: מטמנת שקר
  choice: скрытая ложь
  rationale: Сохраняет трудное и резкое чтение дошедшего еврейского текста, не подменяя его более гладким греческим вариантом о скрытом бодрствовании или бессоннице.
- source_word: דאגה תפריע שנתו
  choice: тревога о ней прогоняет его сон
  rationale: Передаёт длительное беспокойство и идиоматический смысл лишения сна; местоимение «его» ясно относится к отцу.
- source_word: בנעוריה פן תגור
  choice: в юности её — как бы она не миновала пору замужества
  rationale: Значение еврейского глагола здесь неясно; формулировка учитывает греческое παρακμάσῃ — пройти расцвет, миновать подходящую пору — и сохраняет связь с брачной заботой контекста.
- source_word: ובתוליה פן לא תנשא
  choice: а в девстве — как бы её не выдали замуж
  rationale: Сохраняет явное указание на девство и пассивную социальную перспективу еврейского תנשא.
theological_decisions:
- issue: Трудное чтение מטמנת שקר при греческом ἀπόκρυφος ἀγρυπνία
  choice: В основном тексте сохранено буквальное «скрытая ложь», а греческий вариант указан в примечании.
  alternative: «тайная бессонница» или «скрытая тревога»
  rationale: Сохранившийся еврейский свидетель имеет приоритет, однако его неясность нельзя скрывать; греческий параллельный текст помогает увидеть общий образ тайного отцовского беспокойства.
- issue: Значение פן תגור
  choice: «как бы она не миновала пору замужества»
  alternative: «как бы она не осталась незамужней»; «как бы не увяла»
  rationale: Еврейское чтение допускает сомнения, а греческий параллельный текст указывает на минование расцвета или брачного возраста. Перевод передаёт вероятный смысл, не утверждая больше, чем позволяют свидетели.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной литературы. Синтаксический параллелизм сохранён; трудные места не сглажены без пояснения. Формулировка отражает древний социальный контекст текста, не превращая его в современное предписание.
