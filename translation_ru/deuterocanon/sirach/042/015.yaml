base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/015.yaml
  text: I will remember the works of God[a], and what I have seen I will recount. At the word of God is his will, and his work accomplishes his pleasure.
translation:
  language: ru
  text: Вспомню дела Бога[a] и расскажу о том, что видел. По слову Бога совершается его воля, и его дело осуществляет его волю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Вспомню дела Господа и расскажу о том, что видел; в словах Господа — его дела». Заключительная строка еврейского текста трудна, поэтому основной перевод передаёт её вероятный смысл, а не воспроизводит буквально.'
    reason: alternative_reading
lexical_decisions:
- source_word: אזכור נא
  choice: Вспомню
  rationale: Глагол передаёт намерение говорящего обратиться к делам Бога; частица נא здесь служит мягким вводным маркером и не требует добавления временного «теперь».
- source_word: מעשי אל
  choice: дела Бога
  rationale: מעשים означает дела или деяния; «дела Бога» естественно звучит в гимническом контексте и следует еврейскому אל.
- source_word: וזה חזיתי ואספרה
  choice: и расскажу о том, что видел
  rationale: Сжатая еврейская конструкция естественно раскрывается относительным оборотом; такое понимание подтверждается греческой параллелью.
- source_word: באומר אלהים רצונו
  choice: По слову Бога совершается его воля
  rationale: Передаёт связь Божьего слова и воли, выраженную трудным еврейским оборотом; глагол «совершается» добавлен для ясного русского синтаксиса без претензии на буквальную реконструкцию.
- source_word: ופועל רצונו לקחו
  choice: и его дело исполняет его желание
  rationale: 'Текст этого полустишия неясен. Перевод передаёт вероятный смысл: действие Бога осуществляет то, чего он желает, сохраняя повтор корня רצון через близкие слова «воля» и «желание».'
theological_decisions:
- issue: Божественное наименование אל при греческом Κυρίου
  choice: Бог
  alternative: Господь
  rationale: Основной сохранившийся еврейский свидетель читает אל («Бог»), тогда как греческая параллель имеет Κυρίου («Господа»). Основной текст следует еврейскому чтению, а греческое отражено в примечании.
- issue: Трудное заключительное полустишие
  choice: Передать вероятный смысл как исполнение Божьей воли его делом
  alternative: 'Следовать греческому: «в словах Господа — его дела»'
  rationale: Еврейский текст синтаксически и текстологически труден. Основной перевод остаётся еврейско-ориентированным, но не скрывает альтернативное греческое свидетельство, приведённое в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, гимническим звучанием. Формулировка ясна обычному читателю; текстовая неуверенность не замалчивается и вынесена в примечание.
