  source_fidelity: 'Первая строка верно следует еврейскому тексту: «дела Бога» передаёт מעשי אל, а «расскажу о том, что видел» естественно раскрывает сжатую конструкцию וזה חזיתי ואספרה. Вторая строка еврейского текста синтаксически трудна; предложенное смысловое решение допустимо лишь как вероятностное и должно оставаться отмеченным в примечании. Греческая параллель корректно приведена как альтернативное свидетельство.'
