  text: For a bad wife[a], a seal is good; and where hands are slack[c][b], open it.
translation:
  language: ru
  text: С плохой женой печать — хорошее средство; а там, где много рук, всё держи под замком.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально: «слабые» или «вялые руки»; в греческой параллели: «много рук». Основной текст следует связному смыслу греческого чтения.'
    reason: textual_variant
  - marker: b
    text: В сохранившемся еврейском тексте стоит «открой» или «открывай», а в греческой параллели — «закрой, запри». Основной текст следует греческому чтению, согласующемуся с контекстом.
    reason: textual_variant
lexical_decisions:
- source_word: אשה רעה
  choice: дурная жена
  rationale: אשה может означать «женщина» или «жена»; домашний контекст изречения и параллельная традиция благоприятствуют значению «жена». «Дурная» передаёт רעה естественно и не усиливает формулировку до «злая».
- source_word: חותם חסם
  choice: хорошо запирать на печать
  rationale: Еврейская формула кратка и эллиптична; חותם указывает на печать, а חסם — на преграждение или запирание. Греческое καλὸν σφραγίς подтверждает оценочную формулу «печать хороша». Выбранная русская фраза сохраняет образ опечатывания и практический смысл надёжного запирания.
- source_word: ומקום
  choice: а там, где
  rationale: Передаёт локативный переход естественным русским оборотом; греческое ὅπου подтверждает значение «где».
- source_word: ידים רפות
  choice: много рук
  rationale: Сохранившийся еврейский текст буквально указывает на «слабые/опущенные руки», однако греческая параллель χεῖρες πολλαί читается как «много рук» и создаёт связный афоризм о доступе многих людей. Разночтение отмечено в сноске.
- source_word: תפתח
  choice: держи под замком
  rationale: Сохранившаяся еврейская форма означает «откроешь/открывай», но это противоречит первой строке и практическому смыслу изречения. Греческое κλεῖσον прямо означает «закрой, запри»; основной текст следует этому контекстуально связному чтению, сохраняя еврейскую форму в сноске.
theological_decisions:
- issue: «Жена» или более широкое «женщина» в резком наставлении
  choice: жена
  alternative: женщина
  rationale: И еврейское אשה, и греческое γυνή допускают оба значения. Домашне-хозяйственный контекст делает «жену» вероятнее и не позволяет неоправданно распространить отрицательное суждение на женщин вообще.
- issue: Следовать ли трудному буквальному чтению сохранившегося еврейского текста во второй половине
  choice: принять связное чтение греческой параллели в основном тексте
  alternative: «там, где руки опущены, открывай»
  rationale: Еврейское буквальное чтение создаёт внутренне противоречивое наставление, тогда как греческая параллель сохраняет ясный смысл о защите имущества при доступе многих. Подлинная текстовая неопределённость не скрыта, а обозначена сносками.
translation_notes:
  register: Современный литературный русский язык с краткой афористической интонацией. Формулировка сохраняет резкость древнего домашнего наставления, но не расширяет его до общего суждения о женщинах. Оборот «запирать на печать» слегка архаизован лишь настолько, насколько необходимо для сохранения древнего образа печати как средства защиты.
