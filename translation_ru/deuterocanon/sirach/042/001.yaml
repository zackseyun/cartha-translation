translation:
  language: ru
  text: Но этого не стыдись[a] и не проявляй лицеприятия[b], чтобы не согрешить[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст Септуагинты здесь значительно отличается: он разворачивает наставление в несколько конкретных предписаний, касающихся стыда и осмотрительности. Основной перевод следует еврейскому тексту Каирской генизы.'
    reason: textual_variant
  - marker: b
    text: 'Или: «не оказывай предпочтения». Буквально еврейская идиома означает «не поднимай лица».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское выражение кратко и допускает также передачу: «и согрешишь» или «и не греши». Перевод «чтобы не согрешить» передаёт его как предостережение, связанное с лицеприятием.'
    reason: alternative_reading
lexical_decisions:
- source_word: אך על אלה
  choice: Но вот чего
  rationale: Сочетание частицы אך с על אלה выделяет и ограничивает последующий перечень. «Но вот чего» естественно вводит по-русски предметы, которых не следует стыдиться, сохраняя связь с контекстом.
- source_word: אל תבוש
  choice: не стыдись
  rationale: Глагол בוש обозначает стыд и бесчестье, а не просто неловкость; краткая форма повеления соответствует назидательному тону.
- source_word: ואל תשא פנים
  choice: не будь пристрастен
  rationale: Идиома נשא פנים, буквально «поднимать лицо», означает оказывать предпочтение или проявлять пристрастие. Выбран современный и ясный русский эквивалент.
- source_word: וחטא
  choice: и не согреши
  rationale: Масоретская огласовка здесь отсутствует, а краткая форма допускает понимание как предостережения, связанного с предыдущим запретом. Отрицание естественно распространяется на сочинённый глагол в русском, при этом точная логическая связь не уточняется.
theological_decisions:
- issue: Связь финального «и согреши / и не согреши» с запретом лицеприятия
  choice: 'Передать как сочинённое предостережение: «не будь пристрастен — и не согреши»'
  alternative: «не будь пристрастен, чтобы не согрешить»; «не будь пристрастен и тем не греши»
  rationale: 'Еврейская формулировка предельно сжата: ואל תשא פנים וחטא. Выбранная конструкция сохраняет тесную связь двух действий, но не превращает её однозначно ни в цель, ни в следствие.'
translation_notes:
  register: Современный литературный русский язык; краткий, достоинственный назидательный тон. Тире помогает сохранить сжатость и неоднозначность связи заключительного предостережения с запретом пристрастия.
