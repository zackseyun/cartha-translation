base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/010.yaml
  text: In her virginity[a], lest she be seduced, and in her husband’s house, lest she go astray; in her father’s house, lest she become pregnant, and in her husband’s house[b], lest she be barren.
translation:
  language: ru
  text: Пока она девственна — как бы её не соблазнили[a]; в доме мужа — как бы она не сбилась с пути; в доме отца — как бы она не забеременела, а в доме мужа — как бы она не оказалась бесплодной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «как бы она не была осквернена»; еврейский текст говорит: «как бы её не соблазнили». В обоих случаях контекст имеет половой смысл.'
    reason: alternative_reading
  - marker: b
    text: Буквально еврейское выражение можно понять как «как бы она не была удержана», однако греческая параллель подтверждает здесь смысл «как бы она не оказалась бесплодной».
    reason: lexical_alternative
lexical_decisions:
- source_word: בבתוליה
  choice: пока она девственна
  rationale: Передаёт состояние девственности естественным современным русским языком и соответствует греческому ἐν παρθενίᾳ.
- source_word: פן תפתה
  choice: как бы её не соблазнили
  rationale: В данном контексте форма глагола указывает на то, что дочь могут соблазнить; перевод сохраняет сексуальный оттенок, подтверждаемый греческой параллелью.
- source_word: ובבית בעלה לא תשטה
  choice: в доме мужа — как бы она не сбилась с пути
  rationale: '«Сбиться с пути» сохраняет широту еврейского глагола: речь может идти о нравственном или половом проступке, но текст не требует однозначно переводить его как супружескую неверность.'
- source_word: בבית אביה פן תהרה
  choice: в доме отца — как бы она не забеременела
  rationale: Ясно и непосредственно передаёт опасение беременности до вступления в брак.
- source_word: בבית אישה
  choice: в доме мужа
  rationale: В брачном контексте אישה означает её мужа; одинаковый перевод двух близких еврейских выражений делает социальную обстановку ясной.
- source_word: פן תעצר
  choice: как бы она не оказалась бесплодной
  rationale: Буквально глагол связан с удержанием или прекращением, однако в репродуктивном контексте и при поддержке греческого στειρώσῃ наиболее вероятен смысл бесплодия.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и греческой параллели
  choice: Сохранён порядок и формулировка еврейского текста, а греческий использован для уточнения сексуального смысла первого предостережения и репродуктивного смысла последнего.
  alternative: 'Перестроить стих по греческому порядку: сначала объединить два предостережения, относящиеся к дому отца, а затем два, относящиеся к замужеству.'
  rationale: Еврейский текст здесь связен и служит основным источником; перестановка по греческому устранила бы реальное различие между свидетелями.
- issue: Степень конкретизации выражения לא תשטה
  choice: «не сбилась с пути»
  alternative: «не изменила мужу» или «не согрешила»
  rationale: Еврейский глагол допускает нравственный и половой оттенок, но не вынуждает сводить смысл исключительно к прелюбодеянию; более широкая формулировка сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткими параллельными конструкциями. Повтор «в доме мужа» сохранён вслед за еврейским текстом; эвфемистическая широта выражения «сбилась с пути» не снимает нравственного и полового напряжения стиха.
