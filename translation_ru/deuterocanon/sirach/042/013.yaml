translation:
  language: ru
  text: Ведь из одежды выходит моль, а от женщины — зло женщины.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «а от женщины — женская злоба». Еврейская фраза кратка и имеет пословичный характер; греческий текст также буквально говорит о «зле женщины».'
    reason: Лексическая альтернатива для רעת אשה и пояснение намеренно сжатой конструкции.
lexical_decisions:
- source_word: כי
  choice: ведь
  rationale: Передаёт пояснительно-причинный оттенок еврейского союза и естественно вводит пословичное обоснование.
- source_word: בגד
  choice: одежда
  rationale: Слово обозначает одежду или отдельный предмет одежды; собирательное «одежда» естественно по-русски и соответствует образу ткани, повреждаемой молью.
- source_word: יצא
  choice: выходит
  rationale: Сохраняет основной образ глагола «выходить, исходить», не заменяя его более свободным «заводится».
- source_word: עש
  choice: моль
  rationale: Обозначает платяную моль либо связанное с ней повреждение одежды; «моль» — точное и краткое русское соответствие.
- source_word: אשה
  choice: женщина
  rationale: Хотя слово может означать и жену, обобщённая пословичная формулировка и греческая параллель поддерживают более широкое значение «женщина».
- source_word: רעת אשה
  choice: зло женщины
  rationale: Сохраняет конструкцию «зло/злоба женщины» и намеренно резкую, сжатую формулировку оригинала, не расширяя её до общего утверждения сверх сказанного.
theological_decisions:
- issue: Резкая отрицательная характеристика женщины в пословичной формулировке
  choice: Сохранить прямое выражение «от женщины — зло женщины» без смягчения и обобщения.
  alternative: «от женщины исходит зло» или «от жены — зло жены»
  rationale: Еврейский текст и греческая параллель содержат именно заострённую гендерную формулировку. Перевод сохраняет напряжение текста, но не добавляет к нему более широкого богословского вывода.
translation_notes:
  register: Современный литературный русский язык; сжатый, афористичный строй оригинала сохранён. Тире обозначает опущенный во второй части глагол «выходит» и делает параллелизм естественным по-русски.
