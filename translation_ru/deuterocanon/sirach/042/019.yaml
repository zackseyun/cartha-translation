    reason: textual_variant
lexical_decisions:
- source_word: מחוה
  choice: возвещает
  rationale: Глагол означает «даёт знать, сообщает». «Возвещает» сохраняет возвышенный тон литературы мудрости и согласуется с греческим ἀπαγγέλλων, не становясь архаичным.
- source_word: חליפות
  choice: перемены
  rationale: Слово обозначает изменения, чередования или сменяющие друг друга события. «Перемены» естественно передаёт широкий смысл еврейского существительного.
- source_word: נהיות
  choice: грядущие
  rationale: Форма от היה указывает на то, что возникает, совершается или наступает. «Грядущие» естественно передаёт направленность к наступающим событиям, хотя несколько сжимает оттенок становления; он поясняется исходной синтаксической связью с «переменами».
- source_word: ומגלה
  choice: и открывает
  rationale: Обычная передача גלה в значении раскрытия прежде скрытого; ясна и уместна в современном литературном русском.
- source_word: חקר
  choice: исследование
  rationale: Существительное может означать поиск, исследование или тщательное изыскание. «Исследование» сохраняет необычную, но значимую еврейскую конструкцию «исследование сокрытого», не подменяя её понятием «глубины».
- source_word: נסתרות
  choice: сокрытого
  rationale: Субстантивированная форма передаёт совокупность скрытых вещей или тайн. Единственное собирательное «сокрытого» звучит по-русски естественнее буквального «скрытых вещей» и сохраняет широту выражения.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и более пространной греческой параллели
  choice: Основной текст следует еврейскому чтению и не вводит прямо формулу «прошедшее и будущее».
  alternative: «Он возвещает то, что прошло и что наступит, и открывает следы сокрытого».
  rationale: Сохранившийся еврейский текст первичен. Греческая параллель подтверждает временной смысл смены событий, но содержит более явное развёртывание, которого нет в данном еврейском чтении; поэтому оно вынесено в примечание.
translation_notes:
  register: Современный литературный русский с достоинством, подходящим для книги Премудрости. «Возвещает» поддерживает возвышенный регистр; «грядущие перемены» обеспечивает естественность, а «исследование сокрытого» намеренно сохраняет формальную и смысловую напряжённость еврейского выражения. Маркеры примечаний стоят после соответствующего первого полустишия в порядке, заданном консультационным слоем.
