  text: Better a man's wickedness than a woman's goodness[a], and a woman who brings shame becomes a reproach.
translation:
  language: ru
  text: Лучше порочность мужчины, чем добродетель женщины[a]; и женщина, навлекающая позор, становится предметом поношения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная часть еврейского стиха трудна для истолкования. Греческая параллель по смыслу передаёт её так: «и женщина, навлекающая позор, становится предметом поношения»; это поддерживает смысл, отражённый в переводе.'
    reason: alternative_reading
lexical_decisions:
- source_word: מטוב ... מטוב
  choice: лучше ... чем
  rationale: Предлог מן, ассимилированный в форме מטוב, имеет сравнительное значение; это подтверждается греческим κρείσσων ... ἢ.
- source_word: רוע
  choice: порочность
  rationale: Слово обозначает нравственное зло; «порочность» сохраняет моральную окраску и естественно противопоставляется добродетели.
- source_word: איש
  choice: мужчины
  rationale: Сохраняется конкретное гендерное противопоставление איש и אשה; значение «муж» контекстом не требуется.
- source_word: מטוב אשה
  choice: чем добродетель женщины
  rationale: Передаётся буквальное сопоставление порочности мужчины с добротой или добродетелью женщины, без сглаживания до «чем добрая женщина».
- source_word: מחרפת
  choice: навлекающая позор
  rationale: 'Причастие имеет активный оттенок: женщина причиняет или навлекает бесчестье; это согласуется с греческим καταισχύνουσα.'
- source_word: תביע
  choice: становится
  rationale: Форма и синтаксис трудны. Результативное «становится» осторожно передаёт предполагаемый смысл с опорой на греческую параллель, не выдавая точную семантику спорной формы за бесспорную.
- source_word: חרפת
  choice: предметом поношения
  rationale: חרפה означает позор, поругание или поношение; выражение естественно передаёт лицо, сделавшееся объектом осуждения.
theological_decisions:
- issue: Гендерно окрашенное и нравственно вызывающее сравнение мужчины и женщины
  choice: Сохранить прямое противопоставление «мужчины» и «женщины», не смягчая оценку.
  alternative: Обобщить высказывание или заменить его гендерно нейтральной формулировкой.
  rationale: Еврейский текст намеренно противопоставляет איש и אשה. Перевод должен прозрачно передавать риторику древнего изречения, а не исправлять её согласно позднейшим взглядам.
- issue: Неясность заключительной части еврейского текста
  choice: 'Следовать сохранившемуся еврейскому тексту, а греческую параллель использовать для осторожного прояснения результата: женщина становится предметом поношения.'
  alternative: «Позорящая женщина навлекает поношение» или буквальная, но малопонятная передача спорной еврейской формы.
  rationale: Еврейское תביע допускает трудности в разборе, тогда как греческое εἰς ὀνειδισμόν ясно указывает на поношение как итог. Формулировка сохраняет эту смысловую опору, не устраняя текстовую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством афористической речи. Резкость гендерного противопоставления сохранена как особенность исходного текста. «Добродетель» выбрана как естественная нравственная пара к «порочности»; финальная фраза намеренно снабжена сноской из-за неясности еврейского чтения.
