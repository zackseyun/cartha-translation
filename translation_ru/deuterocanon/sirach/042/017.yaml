base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/042/017.yaml
  text: The holy ones of God have not been sufficient to recount the wonders of the Lord[b][a]. God has strengthened his hosts to be strong before his glory.
translation:
  language: ru
  text: Святые Божьи не смогли поведать о чудесах Господа.[a][b] Бог укрепил свои воинства, чтобы они устояли перед его славой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В рукописи из Масады, по-видимому, стоит «не постигли» там, где каирские рукописи читают «не смогли» или «оказались не в силах»; греческий текст поддерживает смысл: «не смогли поведать полностью».'
    reason: textual_variant
  - marker: b
    text: 'Вторая часть стиха различается в еврейских рукописях: каирские рукописи читают «Бог укрепил свои воинства», тогда как рукопись из Масады, по-видимому, — «Господь укрепил среди своих светил». В греческом тексте: «которые утвердил Господь Вседержитель, чтобы всё утвердилось в его славе».'
    reason: textual_variant
lexical_decisions:
- source_word: לא הספיקו
  choice: не смогли
  rationale: Передаёт значение недостаточности сил или способности в каирском чтении; греческий параллельный текст также указывает на невозможность полностью поведать, а не просто на непонимание.
- source_word: קדושי אל
  choice: святые Божьи
  rationale: 'Сохраняет неопределённость референта: речь может идти о святых людях или небесных существах; вариант не вводит позднейших конфессиональных оттенков слова «угодники».'
- source_word: לספר נפלאות ה׳
  choice: поведать обо всех чудесах Господа
  rationale: «Поведать» естественно передаёт לספר в возвышенном контексте, а «чудеса» — נפלאות. Слово «всех» подтверждается греческим πάντα и ясно выражает подразумеваемую полноту рассказа, с которой святые не справились.
- source_word: אמץ אלהים
  choice: Бог укрепил
  rationale: Следует основному еврейскому тексту, где субъектом назван אלהים, и передаёт каузативный смысл укрепления.
- source_word: צבאיו
  choice: свои воинства
  rationale: «Воинства» сохраняет широту צבאיו и возможную отсылку к небесным силам, не сводя выражение к земным армиям.
- source_word: להתחזק לפני כבודו
  choice: чтобы они устояли перед его славой
  rationale: Естественно по-русски передаёт цель укрепления и значение стойкости в присутствии славы, согласуясь с греческим στηριχθῆναι, но не уточняя природу воинств.
theological_decisions:
- issue: Различные божественные наименования в двух частях стиха
  choice: «Господа» в первой части и «Бог» во второй
  alternative: «Господь» в обеих частях
  rationale: Так сохраняются ה׳ и אלהים основного еврейского текста; греческий текст и иной еврейский свидетель поддерживают «Господь» во второй части, что отмечено в сноске.
- issue: Кого обозначают «святые Божьи»
  choice: сохранить выражение без уточнения
  alternative: «ангелы Божьи» или «святые люди Божьи»
  rationale: Контекст допускает понимание как небесных существ, так и посвящённых Богу людей; источник не требует разрешать эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Святые Божьи» и «воинства» сохраняют образность и неоднозначность источника; местоимения, относящиеся к Богу, даны со строчной буквы по общим нормам современного русского текста.
