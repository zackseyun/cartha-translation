base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/026.yaml
  text: His diligence is to finish the foddering place[b][a]; he sets his heart on plowing the furrows.
translation:
  language: ru
  text: Он усердно доводит до конца работу в стойле[a] и всем сердцем обрабатывает борозды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст: «и бодрствование его — ради корма для телят». Он подчёркивает неустанную заботу о кормлении скота; еврейский текст, вероятно, говорит о завершении работы в стойле или у места кормления.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно: «и всем сердцем разбивает комья в бороздах» или «боронит борозды». Еврейский глагол обозначает обработку уже вспаханной земли, но точный вид работы не вполне ясен; греческий текст говорит о проведении борозд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ושקידתו
  choice: Он усердно
  rationale: Существительное от שקד выражает постоянную сосредоточенность и прилежание; наречная передача естественна по-русски и сохраняет образ неустанного труда.
- source_word: לכלות
  choice: доводит до конца работу
  rationale: כלה здесь имеет значение завершения. Слово «работу» добавлено по контексту, поскольку буквальное сочетание «закончить стойло» по-русски двусмысленно и может ошибочно означать строительство стойла.
- source_word: מרבק
  choice: в стойле
  rationale: מרבק обозначает стойло или место кормления и откорма скота. «Стойло» — понятный современному читателю сельскохозяйственный термин; кормовой оттенок отражён в примечании.
- source_word: לב ישית
  choice: всем сердцем
  rationale: Еврейская идиома буквально означает «направляет сердце» и указывает на полную сосредоточенность и преданность делу. Русское «всем сердцем» сохраняет образ сердца без неестественного буквализма.
- source_word: לשדד
  choice: обрабатывает
  rationale: В земледельческом контексте глагол означает вторичную обработку вспаханной почвы — разбивание комьев или боронование. Более широкое «обрабатывает» не навязывает спорную техническую детализацию.
- source_word: בתלמים
  choice: борозды
  rationale: תלמים — борозды или вспаханные ряды. В русском языке прямое дополнение естественно сочетается с более широким глаголом «обрабатывает».
