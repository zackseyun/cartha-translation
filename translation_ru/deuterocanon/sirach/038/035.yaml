translation:
  language: ru
  text: Но они будут поддерживать устроенный порядок мира[a], и их молитва — в их ремесленном труде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «порядок века»; возможно также: «творение века» или «творение мира». Греческое выражение κτίσμα αἰῶνος может обозначать как устойчивый уклад человеческой жизни, так и устроенный порядок мира в более широком смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их моление — в труде ремесла». Эти слова могут означать, что молитва ремесленников связана с их искусным трудом, совершается в нём или обращена к успеху этого труда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: но
  rationale: Передаёт противопоставление предыдущему описанию ремесленников, не участвующих в совете и управлении.
- source_word: κτίσμα αἰῶνος
  choice: мироустройство
  rationale: Компактно передаёт созданный и устойчивый порядок мира или человеческой жизни, не сводя выражение только к обществу либо только к космосу. Неоднозначность греческого сочетания отмечена в сноске.
- source_word: στηρίσουσιν
  choice: будут поддерживать
  rationale: Сохраняет будущее время и значение укрепления, обеспечения устойчивости; в контексте речь идёт о том, что труд ремесленников поддерживает общий порядок жизни.
- source_word: ἡ δέησις αὐτῶν
  choice: их молитва
  rationale: δέησις обычно обозначает молитву, просьбу или моление; «молитва» ясно и естественно звучит по-русски, не исключая оттенка прошения.
- source_word: ἐν ἐργασίᾳ τέχνης
  choice: в труде их ремесла
  rationale: Сохраняет предложную конструкцию и связывает молитву со сферой искусного ремесленного труда; τέχνη здесь по контексту означает ремесло, а не искусство в современном узком смысле.
theological_decisions:
- issue: Смысл слов о молитве ремесленников
  choice: Молитва связана с их ремесленным трудом и пребывает в нём.
  alternative: Они молятся об успехе своего ремесла; их прошение сопровождает работу.
  rationale: Греческое ἐν допускает несколько оттенков связи, поэтому перевод не уточняет, является ли труд выражением молитвы, её предметом или средой, в которой она совершается.
- issue: Объём выражения κτίσμα αἰῶνος
  choice: Не ограничивать его исключительно общественным устройством или космическим творением.
  alternative: «порядок века», «творение мира», «жизненный уклад»
  rationale: Сжатое греческое выражение допускает как более широкий смысл устроенного мира, так и контекстуальное указание на устойчивый порядок человеческой жизни.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Мироустройство» выбрано как понятное, хотя и несколько книжное слово, позволяющее естественно передать сжатое κτίσμα αἰῶνος; тире во второй части делает эллиптическую греческую конструкцию ясной без добавления смыслового глагола.
