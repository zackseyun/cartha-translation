  text: My son[a], in your sickness do not be negligent; pray to God[b], for he will heal you.
translation:
  language: ru
  text: Сын мой, когда ты болен, не оставляй болезнь без внимания[a]; молись Богу[b], ибо Он исцелит тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пренебрегай ею»; греческий параллельный текст также передаёт смысл «не оставляй без внимания». Еврейское выражение допускает некоторую неясность.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом параллельном тексте: «Господу»; еврейский текст здесь читает: «Богу».'
    reason: alternative_reading
lexical_decisions:
- source_word: בני
  choice: Сын мой
  rationale: Буквально передаёт еврейское обращение и сохраняет отеческий наставительный тон книги; греческое τέκνον имеет более широкое значение «дитя», но здесь основным является сохранившийся еврейский текст.
- source_word: בחולי
  choice: когда ты болен
  rationale: Предлог ב с חולי допускает обстоятельственное значение «в болезни / когда болен». Выбран естественный современный русский оборот; греческое ἐν ἀρρωστήματί σου подтверждает отнесённость болезни к адресату.
- source_word: על תתעבר
  choice: не оставляй болезнь без внимания
  rationale: 'Передаёт поддерживаемый греческим μὴ παράβλεπε смысл: не пренебрегать болезнью, не упускать её из виду. Поскольку форма и конструкция еврейского текста допускают некоторую смысловую неясность, альтернативу отмечает сноска.'
- source_word: התפלל
  choice: молись
  rationale: Прямое и естественное соответствие еврейскому глаголу; греческое εὔξαι подтверждает значение.
- source_word: אל אל
  choice: Богу
  rationale: Еврейский текст буквально говорит «Богу». Греческий параллельный текст читает «Господу»; это различие сохранено в сноске.
- source_word: כי הוא ירפא
  choice: и Он исцелит тебя
  rationale: 'Еврейский текст буквально сообщает: «ибо/ведь Он исцелит»; объект «тебя» ясен из контекста и прямо выражен в греческом σε. Союз «и» естественно передаёт последовательность наставления и обещания, не устраняя причинного оттенка полностью.'
theological_decisions:
- issue: Божественное именование в призыве к молитве
  choice: Богу
  alternative: Господу
  rationale: Сохранившийся еврейский свидетель содержит אל («Бог»), поэтому он определяет основной текст. Чтение греческого Κυρίῳ («Господу») приведено в сноске как значимое текстовое различие.
- issue: Характер утверждения об исцелении
  choice: Он исцелит тебя
  alternative: Он может исцелить тебя
  rationale: Будущая форма ירפא и греческое ἰάσεταί σε выражают уверенное утверждение, а не только возможность. Перевод сохраняет эту напряжённость и не ослабляет обещание модальным словом.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным наставительным тоном. Обращение «Сын мой» сохраняет форму еврейского оригинала; формулировка о болезни сделана естественной для обычного читателя, а текстовые и лексические различия вынесены в сноски.
