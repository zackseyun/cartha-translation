  text: The wisdom of a scribe comes with the opportunity for leisure, and the one who is less occupied with his work will become wise.[a]
translation:
  language: ru
  text: Мудрость книжника приходит, когда у него есть свободное время, и кто меньше занят своим делом, тот станет мудрым.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сохранившийся еврейский текст этой строки труден и не вполне соответствует греческому. Перевод следует более ясному греческому тексту, особенно в слове «книжник» и в мысли о том, что для обретения мудрости необходимо свободное время.
    reason: textual_variant
lexical_decisions:
- source_word: חכם / יתחכם || σοφία / σοφισθήσεται
  choice: мудрость / станет мудрым
  rationale: Сохраняет ключевую для изречения тему мудрости. Еврейская строка трудна, тогда как греческий параллельный текст ясно связывает начало и конец стиха с мудростью.
- source_word: תומך מלמד || γραμματέως
  choice: книжник
  rationale: Сохранившийся еврейский текст здесь неустойчив и допускает понимание, связанное с земледельческим орудием; греческое γραμματεύς однозначно обозначает книжника. «Книжник» передаёт человека, занятого Писанием и учёностью, а не просто переписчика.
- source_word: ἐν εὐκαιρίᾳ σχολῆς
  choice: когда у него есть свободное время
  rationale: Естественно передаёт благоприятную возможность для досуга и занятий, не создавая впечатления праздности.
- source_word: ὁ ἐλασσούμενος πράξει αὐτοῦ
  choice: кто меньше занят своим делом
  rationale: Передаёт человека, практическая занятость которого уменьшена и потому оставляет время для приобретения мудрости; слово «делом» сохраняет широту πράξις.
theological_decisions:
- issue: Выбор между трудным сохранившимся еврейским текстом и связным греческим параллельным свидетельством
  choice: Основной смысл передан по греческому тексту с открытым указанием на расхождение в сноске
  alternative: Буквально передать еврейскую строку как вопрос о человеке, держащемся за плуг и хвалящемся рукоятью погоняла
  rationale: Еврейская форма стиха текстуально трудна и не вполне соответствует греческой. Греческий текст даёт цельное изречение о свободном времени как условии книжной мудрости; этот выбор является текстологическим, а не вероучительным.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским словом «книжник». Синтаксис прост и афористичен; формулировка «свободное время» понятнее современному читателю, чем более отвлечённый «досуг».
