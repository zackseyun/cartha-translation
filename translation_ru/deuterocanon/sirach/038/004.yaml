  text: The Lord created medicines from the earth[b][a], and a sensible man will not despise them.
translation:
  language: ru
  text: Бог производит из земли лекарства[a], и разумный человек не станет ими пренебрегать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «Бог производит [или: выводит] из земли»; форма глагола в рукописной традиции неясна. В греческом параллельном тексте: «Господь сотворил из земли лекарства».'
    reason: textual_variant
lexical_decisions:
- source_word: אל
  choice: Бог
  rationale: Еврейское אל прямо обозначает Бога. Греческое Κύριος («Господь») отражено в примечании как вариант параллельного свидетельства, но основной текст следует высокоуверенному еврейскому источнику.
- source_word: מארץ
  choice: из земли
  rationale: Сочетание מן + ארץ указывает на земной источник лекарственных средств; это подтверждается греческим ἐκ γῆς.
- source_word: מצוציא
  choice: производит
  rationale: Форма в еврейской рукописной традиции затруднительна и, вероятно, передаёт выведение или произведение из земли. «Производит» сохраняет эту конкретную образность и не подменяет неясный еврейский глагол более определённым греческим «сотворил».
- source_word: תרופות
  choice: лекарства
  rationale: Слово обозначает лечебные средства; «лекарства» — ясный и естественный современный русский эквивалент.
- source_word: גבר מבין
  choice: разумный человек
  rationale: גבר מבין — человек, обладающий пониманием и рассудительностью. По-русски «разумный человек» естественно выражает общий характер изречения.
- source_word: אל ימאס בם
  choice: не станет ими пренебрегать
  rationale: Глагол מאס означает отвергать, презирать или считать негодным. «Не станет пренебрегать» естественно передаёт отрицание такого отношения к лекарствам.
theological_decisions:
- issue: 'Божественный субъект: еврейское אל и греческое Κύριος'
  choice: Бог производит из земли лекарства
  alternative: Господь сотворил лекарства из земли
  rationale: Основной текст следует еврейскому אל («Бог») и сохраняет менее определённый смысл трудной формы מצוציא. Греческий параллельный текст ясно читает «Господь сотворил» и потому указан в примечании без устранения текстового различия.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная синтаксическая форма. Сохранена предметность слова «лекарства», а трудное еврейское чтение не сведено без оговорки к более ясному греческому варианту.
