translation:
  language: ru
  text: И Он дал человеку[a] разумение, чтобы хвалиться[b] его могуществом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «людям», «смертным»: еврейское слово «человек» здесь имеет собирательный смысл и относится к людям вообще.'
    reason: lexical_alternative
  - marker: b
    text: Или «величаться», «славиться». Еврейское слово допускает значение хвалы, величания или обретения славы; греческий параллельный текст поддерживает возвышенный смысл, а не просто самодовольство.
    reason: lexical_alternative
  - marker: c
    text: Буквально «его могуществом». Вероятнее всего, речь о могуществе Бога, явленном в Его делах; греческий параллельный текст говорит «в его чудесных делах». Грамматически возможно также отнесение местоимения к человеку.
    reason: alternative_reading
lexical_decisions:
- source_word: ויתן
  choice: И Он дал
  rationale: Прошедшее время передаёт повествовательную форму еврейского глагола; греческое ἔδωκεν также указывает на совершившееся дарование. Местоимение «Он» естественно восстанавливает подразумеваемого в контексте Бога.
- source_word: לאנוש
  choice: человеку
  rationale: אֱנוֹשׁ обозначает человека как смертное существо и здесь имеет собирательно-представительный смысл; единственное число сохраняет форму еврейского текста.
- source_word: בינה
  choice: разумение
  rationale: בִּינָה означает понимание, разумение или проницательность. «Разумение» близко еврейскому слову и уместно в контексте знаний о врачевании; греческое ἐπιστήμην подтверждает значение знания или умения.
- source_word: להתפאר
  choice: хвалиться
  rationale: Форма хитпаэль от פאר может означать «хвалиться», «величаться», «славиться». Выбор сохраняет возвратный оттенок и не превращает выражение прямо в действие прославления Бога.
- source_word: בגבורתו
  choice: его могуществом
  rationale: גְּבוּרָה непосредственно означает силу или могущество; такой перевод не добавляет отсутствующего в еврейском тексте слова «деяния». Греческое «в его чудесных делах» показывает, что могущество может подразумеваться как явленное в Божьих делах.
theological_decisions:
- issue: К кому относится суффикс в בגבורתו («его могуществом»)
  choice: В основном тексте местоимение оставлено формально неоднозначным; наиболее вероятный референт — Бог.
  alternative: Местоимение может быть понято как относящееся к человеку, то есть человек хвалится собственной силой или достижениями.
  rationale: Контекст представляет Бога дарующим средства исцеления и разумение, а греческое «в его чудесных делах» особенно поддерживает отнесение к Божьим делам. Однако еврейская форма сама по себе не устраняет грамматическую неоднозначность, поэтому строчная буква и примечание её сохраняют.
- issue: Смысл להתפאר
  choice: Переведено возвратным «хвалиться», сохраняя возможность значения «величаться / находить славу».
  alternative: «Прославляться» или «прославлять [Бога]».
  rationale: Еврейский хитпаэль допускает хвалу, величание и прославление, а греческий параллельный текст тяготеет к значению прославления. Прямое «прославлять Бога» сняло бы заложенное в форме напряжение и изменило бы грамматический залог.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной буквальностью. «Разумение» сохраняет библейскую приподнятость, оставаясь понятным; «хвалиться» передаёт возвратную форму оригинала. Строчное «его» намеренно сохраняет формальную неоднозначность референта, разъяснённую в сноске.
