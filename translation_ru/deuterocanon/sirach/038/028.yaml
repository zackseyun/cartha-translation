  source_fidelity: 'Перевод точно передаёт ремесленную сцену и основные смысловые элементы греческого текста: кузнеца у наковальни, его сосредоточенное внимание к ещё не обработанному железу, воздействие огненного испарения на плоть и изнурительную борьбу с жаром печи. «Огненный пар» сохраняет отличие ἀτμίς («испарение, выдыхание») от θέρμη («жар»), а «плавит его плоть» правомерно удерживает намеренно резкий образ τήξει σάρκας.'
