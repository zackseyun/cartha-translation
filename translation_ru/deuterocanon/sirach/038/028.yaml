  text: So the smith sits near the anvil and studies the raw iron; the vapor of the fire wastes his flesh, and he struggles with the heat of the furnace.
translation:
  language: ru
  text: Так и кузнец сидит у наковальни, внимательно следя за необработанным железом[a]; огненный пар плавит его плоть[b], и он борется с жаром печи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «за бездействующим железом». Греческое слово может означать то, что не действует или ещё не обрабатывается.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть огонь изнуряет и истощает его тело. В греческом тексте буквально: «плавит его плоть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χαλκεύς
  choice: кузнец
  rationale: В данном контексте это естественное общее обозначение мастера, работающего с металлом; упоминание железа не требует более узкого толкования самого существительного.
- source_word: ἐγγὺς ἄκμονος
  choice: у наковальни
  rationale: Кратко и естественно передаёт пространственное значение «рядом с наковальней».
- source_word: καταμανθάνων
  choice: внимательно следя
  rationale: Передаёт пристальное, сосредоточенное наблюдение за материалом в ходе работы, не придавая выражению излишне отвлечённого смысла.
- source_word: ἀργῷ σιδήρῳ
  choice: за необработанным железом
  rationale: ἀργός здесь вероятнее всего означает железо, ещё не подвергнутое работе. Формулировка сохраняет ремесленный контекст и не вносит дополнительных металлургических уточнений.
- source_word: ἀτμὶς πυρός
  choice: огненный пар
  rationale: Сохраняет образ испарения или дыхания огня и не смешивает ἀτμίς с последующим θέρμη — «жаром».
- source_word: τήξει
  choice: плавит
  rationale: Сохраняет яркую буквальную метафору греческого глагола применительно к плоти; возможный переносный смысл пояснён в сноске.
- source_word: σάρκας αὐτοῦ
  choice: его плоть
  rationale: Буквально и выразительно передаёт множественное σάρκας как собирательное обозначение телесной плоти.
- source_word: ἐν θέρμῃ καμίνου
  choice: с жаром печи
  rationale: «Жар» отличает θέρμη от ранее упомянутого пара, а «печь» естественно обозначает кузнечную нагревательную установку.
- source_word: διαμαχήσεται
  choice: он борется
  rationale: Передаёт напряжённое противостояние изнуряющему жару без чрезмерно военного оттенка.
