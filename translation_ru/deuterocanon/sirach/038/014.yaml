translation:
  language: ru
  text: чтобы его мольба имела успех[a], а исцеление послужило сохранению жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово פשרה здесь неясно. В греческом параллельном тексте сказано подробнее: «и сами они будут молиться Господу, чтобы Он даровал им облегчение и исцеление ради продолжения жизни».'
    reason: alternative_reading
lexical_decisions:
- source_word: פשרה
  choice: его мольба
  rationale: Еврейское слово в этом месте неясно. Греческое δεηθήσονται («будут молиться, просить») поддерживает значение прошения или мольбы. «Мольба» естественно передаёт обращённую к Богу просьбу, не придавая ей узкообрядового смысла.
- source_word: יצלח לו
  choice: имела успех
  rationale: Глагол означает «преуспевать, удаваться, достигать успеха»; сослагательная целевая формулировка согласуется с греческим εὐοδώσῃ («да соделает успешным»).
- source_word: ורפאות
  choice: исцеление
  rationale: Форма может обозначать исцеление или средства исцеления; греческое ἴασιν подтверждает общий смысл восстановления здоровья. Единственное число естественно для русского контекста.
- source_word: למען מחיה
  choice: послужило сохранению жизни
  rationale: Оборот выражает цель — продолжение или поддержание жизни; такая формулировка передаёт и еврейский текст, и греческое χάριν ἐμβιώσεως.
theological_decisions:
- issue: Соотношение трудного еврейского текста с более ясным греческим параллельным чтением
  choice: Сохранить краткую структуру еврейского текста, понимая פשרה как мольбу на основании греческого свидетельства.
  alternative: «чтобы Он даровал им облегчение и исцеление ради продолжения жизни»
  rationale: Альтернатива полнее следует греческому тексту, но удаляется от сохранившейся еврейской формулировки. Основной перевод не скрывает неопределённости и поясняет её в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная формулировка. Союз «чтобы» сохраняет зависимость данного фрагмента от предыдущего контекста стиха.
