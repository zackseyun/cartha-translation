  text: So too every craftsman and planner[a], who labors by night as by day.
translation:
  language: ru
  text: Так и всякий мастер и знаток замысла[a], который трудится ночью, как днём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст краток: «всякий мастер и знаток замысла». Последнее слово может обозначать человека, который продумывает или рассчитывает работу, либо искусного ремесленника. Греческий текст расширяет картину: упоминает строителя или мастера-строителя, а затем резчиков печатей и их ночной труд ради завершения работы.'
    reason: alternative_reading
lexical_decisions:
- source_word: אף
  choice: Так и
  rationale: Передаёт присоединительно-сопоставительное значение частицы в продолжении описания разных тружеников.
- source_word: עשה חרש
  choice: всякий мастер
  rationale: Сжатое еврейское сочетание обозначает человека, занимающегося квалифицированным ручным трудом; широкое «мастер» не сужает значение до кузнеца или плотника.
- source_word: וחשב
  choice: и искусный замыслитель
  rationale: Слово связано с замыслом, расчётом и художественно-ремесленным проектированием. «Замыслитель» сохраняет личное обозначение и не придаёт ему слишком современного профессионального смысла; «искусный» проясняет ремесленный контекст.
- source_word: אשר
  choice: который
  rationale: Относительное местоимение вводит характеристику мастера.
- source_word: לילה כיום
  choice: ночью, как днём
  rationale: Сохраняет прямое сравнение и передаёт труд, продолжающийся ночью так же, как днём.
- source_word: יגיע
  choice: трудится
  rationale: Передаёт напряжённый труд без архаического оттенка слова «изнуряется».
