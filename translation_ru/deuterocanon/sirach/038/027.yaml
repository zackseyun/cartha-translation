    rationale: חשב обозначает того, кто задумывает, рассчитывает или выполняет искусную работу, но отдельный эпитет «искусный» в строке не засвидетельствован.
  - severity: medium
    issue: «Замыслитель» не является естественным современным русским наименованием ремесленника.
    rationale: Слово звучит искусственно и может восприниматься как идеолог или интриган, а не как человек, занимающийся техническим либо художественным замыслом.
  - severity: low
    issue: Сноска слишком определённо называет ἀρχιτέκτων «главным мастером».
