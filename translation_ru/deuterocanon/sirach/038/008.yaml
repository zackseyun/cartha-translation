translation:
  language: ru
  text: чтобы дело его не прекращалось и чтобы от людей исходила действенная помощь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское תושיה здесь имеет неясное значение; оно может указывать на действенную помощь, успешный исход или благополучие. В греческом тексте: «и мир от него — по лицу земли».'
    reason: alternative_reading
lexical_decisions:
- source_word: למען
  choice: чтобы
  rationale: Естественно передаёт целевое или целево-следственное значение союза.
- source_word: לא ישבות
  choice: не прекращалось
  rationale: Глагол שבת здесь означает прекращение деятельности; форма сохраняет оттенок желаемого продолжающегося действия.
- source_word: מעשהו
  choice: дело его
  rationale: Существительное обозначает совершаемую работу или деятельность; местоименный суффикс сохранён без уточнения референта, поскольку контекст допускает некоторую неоднозначность.
- source_word: ותושיה
  choice: и … действенная помощь
  rationale: Редкое и трудное в этом контексте תושיה может обозначать действенность, успешный исход, здравое средство или помощь. «Действенная помощь» сохраняет практический положительный смысл, не сводя слово только к успеху или благополучию.
- source_word: מבני אדם
  choice: от людей
  rationale: Буквально «от сынов человеческих»; это родовое обозначение людей вообще. Предлог מן естественно передан как указание на источник — «от».
theological_decisions:
- issue: Соотношение трудного еврейского ותושיה מבני אדם и греческого чтения о мире на земле
  choice: 'Основной текст следует сохранившемуся еврейскому: «от людей приходила действенная помощь».'
  alternative: 'Греческий параллельный текст: «и мир от него — по лицу земли».'
  rationale: При наличии еврейского текста он служит главным основанием перевода. Однако значение תושיה здесь не вполне ясно, а греческое свидетельство заметно отличается, поэтому вариант не смешивается с основным текстом, а приводится в примечании.
- issue: Референт местоименного суффикса в מעשהו
  choice: Сохранить «его» без поясняющей подстановки имени.
  alternative: 'Уточнить: «дело аптекаря/Бога».'
  rationale: Сам еврейский текст содержит лишь местоименный суффикс. Явное называние референта устранило бы сохраняющуюся в контексте неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Инверсия «дело его» сохраняет достоинство стиля, оставаясь понятной; «людей» естественно передаёт родовое выражение без мужского ограничения.
