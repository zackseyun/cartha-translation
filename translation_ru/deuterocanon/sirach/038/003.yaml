lexical_decisions:
- source_word: דעת
  choice: знание
  rationale: Существительное обозначает знание или разумение; в сочетании со словом «врач» речь идёт о приобретённой профессиональной компетентности. Единственное число сохраняет форму еврейского текста.
- source_word: רופא
  choice: врач
  rationale: Обозначает целителя, занимающегося врачеванием. «Врач» — естественное и литературно нейтральное современное соответствие; греческое ἰατροῦ подтверждает медицинский смысл.
- source_word: תרים קרנו
  choice: поднимет его рог
  rationale: Сохранён буквальный образ поднятого рога как знака возросшей чести и достоинства. Хотя по-русски возможна передача «возвысит его», она устранила бы выразительный образ еврейского текста. Греческий параллельный текст передаёт этот образ словами «поднимет его голову».
- source_word: נדיבים
  choice: знатные
  rationale: Слово здесь обозначает высокопоставленных, благородных людей. Субстантивированное «знатные» понятно современному читателю и передаёт общественное положение без излишне узкого значения «князья».
- source_word: יתיצב
  choice: предстанет
  rationale: Глагол означает встать, занять место или явиться перед кем-либо. «Предстанет» естественно передаёт появление врача перед людьми высокого положения и сохраняет достоинство регистра.
theological_decisions:
- issue: Расхождение еврейского и греческого текстов во второй части стиха
  choice: 'В основном тексте следовать еврейскому чтению: «перед знатными он предстанет»'
  alternative: 'Греческий текст: «перед вельможами им будут восхищаться»'
  rationale: Сохранившийся еврейский текст имеет высокую степень достоверности и прямо говорит, что врач предстанет перед знатными. Греческий вариант меняет оттенок смысла, говоря об их восхищении врачом, поэтому он сохранён в примечании, но не подменяет основное чтение.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для литературы мудрости. Образ «поднимет его рог» намеренно сохранён как яркая метафора возвышения и почёта; синтаксис второй части сделан естественным для русского языка.
