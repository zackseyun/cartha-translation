  text: All these have trusted in their hands[a], and each becomes skillful in his own work.
translation:
  language: ru
  text: Все они полагаются на свои руки[a], и каждый искусен в своём деле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза необычна; её можно также понять как «были вверены в их руки» или «они доверились своим рукам». В основном тексте отражён вероятный смысл: ремесленники полагаются на мастерство своих рук.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες οὗτοι
  choice: Все они
  rationale: Естественно отсылает к перечисленным выше ремесленникам, не добавляя отсутствующего в греческом слова «мужчины».
- source_word: εἰς χεῖρας αὐτῶν ἐνεπίστευσαν
  choice: полагаются на свои руки
  rationale: 'Передаёт наиболее вероятный в данном контексте смысл: ремесленники доверяют умению собственных рук. Необычность греческой конструкции и возможное пассивное понимание отмечены в сноске.'
- source_word: ἕκαστος
  choice: каждый
  rationale: Сохраняет обычный распределительный смысл греческого слова.
- source_word: ἐν τῷ ἔργῳ αὐτοῦ
  choice: в своём деле
  rationale: В контексте ремёсел ἔργον обозначает работу или занятие; «дело» звучит естественно и сохраняет принадлежность каждому ремесленнику.
- source_word: σοφίζεται
  choice: искусен
  rationale: В ремесленном контексте глагол выражает практическую мудрость и умение. Настоящее «искусен» естественнее по-русски, чем буквальное «становится искусным», и не требует понимать форму как процесс приобретения навыка.
