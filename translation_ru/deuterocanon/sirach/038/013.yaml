  text: For there is a time when success is in his hands[a], for he too will make supplication to God.
translation:
  language: ru
  text: Ведь бывает время, когда успех — в его руках[a], ибо и он тоже обращается к Богу с мольбой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «бывает время, когда успех и в их руках». В еврейском свидетельстве стоит единственное число — «в его руках», которому следует перевод.'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: ведь / потому что
  rationale: В первом случае частица вводит обоснование мысли в контексте, во втором — объясняет успех врача его обращением к Богу; различное русское оформление естественно передаёт одну и ту же причинную функцию.
- source_word: יש עתם
  choice: бывает время
  rationale: Передаёт неопределённое временное выражение естественным современным русским оборотом, не добавляя идеи строго назначенного срока.
- source_word: בידו
  choice: в его руках
  rationale: Сохраняет еврейский образ практической способности и участия врача; единственное число соответствует основному еврейскому свидетельству.
- source_word: מצלחת
  choice: успех
  rationale: Обозначает благоприятный исход или преуспевание и хорошо соответствует медицинскому контексту; значение подтверждается греческим εὐοδία.
- source_word: גם הוא
  choice: и он
  rationale: Показывает, что врач также обращается к Богу, сохраняя связь человеческого врачебного труда с зависимостью от Бога.
- source_word: אל אל
  choice: к Богу
  rationale: Последовательность естественно понимается как предлог אֶל и божественное наименование אֵל; по-русски достаточно одного сочетания «к Богу».
- source_word: יעתיר
  choice: обращается с мольбой
  rationale: Передаёт усиленный оттенок усердной просьбы лучше, чем общее «молится», оставаясь естественным и понятным по-русски.
- source_word: ἐν χερσὶν αὐτῶν
  choice: в их руках (вариант в сноске)
  rationale: Греческий параллельный текст содержит множественное число, тогда как основной еврейский свидетель — единственное; вариант существенен и отмечен в сноске.
theological_decisions:
- issue: Соотношение врачебного умения и Божьего действия
  choice: У врача действительно может быть успех, но сам врач обращается к Богу с мольбой.
  alternative: Можно было бы ослабить причинную связь и сказать лишь, что врачи иногда достигают успеха; греческое множественное число также позволяет обобщить высказывание на врачей вообще.
  rationale: 'Еврейский текст удерживает обе стороны: реальную действенность человеческого врачебного труда и зависимость врача от Бога. Перевод не сводит исцеление ни исключительно к человеческому мастерству, ни исключительно к непосредственному чуду.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Оборот «обращается к Богу с мольбой» передаёт настойчивую молитву без архаичного «возносит моление». Настоящее время уместно для общего, повторяющегося положения.
