  yaml_path: translation/deuterocanon/sirach/038/005.yaml
  text: Was not water made sweet by wood[c][b][a], so that his power might be made known to every man?
translation:
  language: ru
  text: Не от дерева ли вода стала сладкой,[b] чтобы каждому человеку[c] стала известна Его сила?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сила дерева». Еврейский и греческий тексты допускают такое отнесение местоимения, хотя контекст скорее указывает на Божью силу, явленную через использованное средство.'
    reason: alternative_reading
  - marker: b
    text: Вероятно, это отсылка к тому, как горькая вода стала сладкой посредством дерева (Исх. 15:25).
    reason: cross_reference
  - marker: c
    text: 'Буквально: «всякому человеку»; еврейское слово употреблено в единственном числе в общем значении — о любом представителе человечества.'
    reason: cultural_note
lexical_decisions:
- source_word: הלא
  choice: Не ... ли
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ; это согласуется и с греческим οὐκ.
- source_word: בעץ
  choice: деревом
  rationale: Предлог ב указывает на средство действия. «Деревом» сохраняет широкое и аллюзивное значение עץ и греческого ξύλον, не уточняя без необходимости «дерево» как растение или «кусок дерева».
- source_word: המתיקו מים
  choice: была услаждена вода
  rationale: Глагол означает «сделать сладким». «Услаждена» точно передаёт изменение вкуса воды и сохраняет возвышенный, но понятный библейский регистр.
- source_word: בעבור להודיע
  choice: чтобы явить
  rationale: Передаёт целевое отношение и каузативное значение «сделать известным». «Явить» естественно сочетается с «силой» и не перегружает фразу.
- source_word: כל אנוש
  choice: каждому человеку
  rationale: אנוש обозначает человека как представителя человечества; русское «каждому человеку» сохраняет дистрибутивность כל и естественно звучит в современной литературной речи.
- source_word: כחו
  choice: Его силу
  rationale: Мужской суффикс единственного числа допускает отнесение к Богу; контекст чуда благоприятствует этому прочтению. Прописная буква делает выбранный референт явным, а альтернативная синтаксическая возможность отмечена в сноске.
theological_decisions:
- issue: К кому относится местоименный суффикс в כחו
  choice: «Его» — к Богу
  alternative: «его силу» — силу дерева; возможно также отнесение к Моисею
  rationale: Смысл высказывания, вероятнее всего, состоит в явлении Божьей силы посредством дерева. Однако еврейский и греческий тексты грамматически не устраняют ближайшее отнесение местоимения к дереву, поэтому неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Риторическая форма и инструментальное значение «деревом» сохранены; формулировка остаётся краткой и пригодной для публичного чтения.
