  terminology: «Дерево», «сила» и «каждому человеку» приемлемы. Прописное «Его» допустимо как выбранное контекстуальное отнесение к Богу, но альтернативное отнесение к дереву должно оставаться в сноске. Сноску о Исх. 15:25 следует привязать к слову «дерева», сноску об альтернативном референте — к «Его силе», а примечание к כל אנוש — к «человеку».
