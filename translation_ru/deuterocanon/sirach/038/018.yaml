translation:
  language: ru
  text: Ибо из скорби рождается беда[a]; так и удручённое сердце изнемогает от печали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Ибо от скорби происходит смерть, и печаль в сердце сокрушает силу». В еврейском тексте стоит «беда», а не «смерть», поэтому основной текст следует еврейскому свидетельству, сохраняя здесь греческий вариант.'
    reason: alternative_reading
lexical_decisions:
- source_word: מדין
  choice: из скорби
  rationale: Форма в еврейском тексте трудна сама по себе, однако греческое ἀπὸ λύπης подтверждает значение скорби или печали; оно соответствует контексту траура.
- source_word: יוצא
  choice: выходит
  rationale: Сохраняет еврейский образ беды, исходящей из скорби, и звучит естественно в современном русском языке.
- source_word: אסון
  choice: беда
  rationale: Еврейское слово означает тяжёлое несчастье или бедствие. Более краткое «беда» уместно в поэтическом параллелизме; греческое разночтение «смерть» вынесено в примечание.
- source_word: רע לבב
  choice: скорбящее сердце
  rationale: Буквально выражение связано с «плохим, тяжким состоянием сердца», но в контексте означает сердце, охваченное скорбью, а не нравственно злое сердце. Греческое λύπη καρδίας также поддерживает такое понимание.
- source_word: יכלה
  choice: изнемогает
  rationale: Глагол передаёт истощение, ослабление или угасание; «изнемогает» естественно выражает постепенную утрату сил.
- source_word: עצבה
  choice: от печали
  rationale: Существительное обозначает печаль, скорбь или боль. Предлог «от» ясно передаёт причину изнеможения, не устраняя эмоциональный образ.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. Союз «так и» передаёт כן и подчёркивает параллель между внешней бедой и внутренним изнеможением. Смысловая неоднозначность греческого и еврейского свидетельств сохранена в примечании.
