translation:
  language: ru
  text: Отступи от неправды и исправь свои дела[a]; очисти сердце от всех прегрешений[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Средняя часть стиха в сохранившемся еврейском тексте неясна. Греческая параллель гласит: «направь руки», то есть исправь свои поступки.'
    reason: textual_variant
  - marker: b
    text: 'Или, согласно греческой параллели: «от всякого греха». Еврейское слово может обозначать сознательные, мятежные проступки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נום מעול
  choice: Отступи от неправды
  rationale: Форма נום в составном еврейском тексте не вполне ясна, однако контекст и греческое ἀπόστησον указывают на повеление удалиться от зла. «Отступи» сохраняет образ движения прочь, а «неправда» передаёт широкий нравственный смысл עול, включая зло и несправедливость.
- source_word: ומהכר פנים
  choice: и направь руки свои
  rationale: Сохранившееся еврейское чтение текстологически затруднительно. Перевод следует ясному греческому соответствию εὔθυνον χεῖρας — «направь / выпрями руки», то есть исправь свои поступки, не раскрывая метафору в основном тексте.
- source_word: ומכל פשעים
  choice: от всех преступлений
  rationale: פשעים обозначает проступки и преступления, нередко с оттенком сознательного мятежа. «От всех преступлений» сохраняет более сильную окраску еврейского слова; греческое «от всякого греха» отмечено как возможный вариант.
- source_word: טהר לב
  choice: очисти сердце
  rationale: טהר означает «очищать, делать чистым». Эта формулировка естественна по-русски и сохраняет нравственно-религиозный образ внутреннего очищения.
theological_decisions:
- issue: Использование греческой параллели при трудном еврейском чтении
  choice: 'В среднем предложении принять засвидетельствованный греческим текстом смысл: «направь руки свои».'
  alternative: Передать трудное еврейское чтение буквально либо истолковать его как выражение, связанное с лицом.
  rationale: Еврейский текст остаётся первичным, но данное место в нём неясно и отмечено как небольшое расхождение, тогда как греческая параллель даёт связное повеление, соответствующее окружающим призывам. Сноска делает текстологическую основу решения прозрачной.
- issue: Передача פשעים
  choice: «преступлений»
  alternative: «грехов»
  rationale: Основной текст сохраняет усиленный оттенок еврейского слова, не сводя его к более общему понятию; греческий вариант «грехов» приводится в сноске, чтобы не скрывать различие свидетелей.
translation_notes:
  register: Современный литературный русский язык с краткими, торжественными повелительными формами. Сохранена библейская метафора рук как поступков; устаревшая и конфессионально окрашенная лексика по возможности не используется.
