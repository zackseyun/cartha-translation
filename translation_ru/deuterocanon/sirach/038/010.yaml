  naturalness: '«Направь руки свои» грамматически возможно, но в современном литературном русском звучит неестественно и неясно: оно скорее обозначает физическое направление рук, чем исправление поведения. «Исправь свои дела» естественно передаёт смысл метафоры в данном текстологически неуверенном месте. Порядок «свои руки» также был бы современнее, но не устраняет семантической неясности.'
