base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/025.yaml
  text: How can one who guides the plow become wise[b][a], who drives the ox with a goad and whose concerns are with the cattle?
translation:
  language: ru
  text: Как станет мудрым тот, кто ведёт плуг[a], погоняет вола и чьи мысли заняты скотом[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Первая часть еврейского текста не вполне ясна. В греческом параллельном тексте сказано более прямо: «Как станет мудрым тот, кто держит плуг… и погоняет волов?» Перевод следует еврейскому тексту, а греческий помогает уточнить земледельческий образ.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «и говорит о скоте». Еврейское слово может указывать как на мысли и заботы человека, так и на предмет его речи; греческий параллельный текст скорее поддерживает значение «рассказ, разговор».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אלוף
  choice: тот, кто ведёт
  rationale: В данном контексте еврейское слово истолковано функционально — как обозначение человека, занятого пахотой, а не как титул «глава» или «вождь». Такое решение согласуется с земледельческим контекстом и греческим параллельным текстом.
- source_word: ינהג
  choice: ведёт
  rationale: Глагол означает «вести, направлять, погонять». В сочетании с плугом русское «ведёт» естественно передаёт управление им при пахоте.
- source_word: ישובב
  choice: погоняет
  rationale: Форма и точный смысл не вполне ясны; в контексте полевых работ и с учётом греческого параллельного текста речь идёт об активном управлении тягловым животным.
- source_word: לשדד
  choice: плуг
  rationale: Корень связан со взламыванием и обработкой почвы. Греческий текст прямо называет плуг; предметное обозначение создаёт ясную и естественную русскую фразу, не меняя земледельческого смысла.
- source_word: בשור
  choice: вола
  rationale: Предлог допускает инструментальное понимание «с помощью вола», однако по-русски в этом контексте естественнее сказать, что пахарь погоняет вола.
- source_word: שעיותיו
  choice: чьи мысли заняты
  rationale: Слово может обозначать мысли, заботы или речь. Выбран широкий смысл внутренней сосредоточенности на своём занятии; более узкая возможность, связанная с разговорами, сохранена в сноске.
- source_word: בני בקר
  choice: скотом
  rationale: Буквально выражение означает «сыновья крупного скота» и служит обозначением животных бычьего рода. Обобщённое «скот» звучит естественно и соответствует профессиональному кругу забот пахаря.
