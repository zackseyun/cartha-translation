translation:
  language: ru
  text: Кто грешит перед своим Создателем, тот будет противиться врачу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «попадёт в руки врача». В еврейском: «будет противиться врачу».'
    reason: alternative_reading
lexical_decisions:
- source_word: אשר
  choice: Кто
  rationale: Вводит обобщённое относительное предложение; по-русски естественно передаёт универсальный, афористический смысл.
- source_word: חואט
  choice: грешит
  rationale: Глагол חטא имеет здесь нравственно-религиозное значение; «грешит» сохраняет его точнее, чем более общее «поступает дурно».
- source_word: לפני
  choice: перед
  rationale: Прямо передаёт значение «перед, в присутствии»; греческое ἔναντι подтверждает этот смысл. Перевод «против» был бы излишним истолкованием.
- source_word: עושהו
  choice: своим Создателем
  rationale: Буквально «тем, кто создал его / его Создателем». Прописная буква уместна как обозначение Бога в данном контексте, а возвратное «своим» естественно соотносится с субъектом.
- source_word: יתנכר
  choice: будет противиться
  rationale: Hitpael от נכר может означать отчуждаться, держаться чужим или враждебно. В сочетании с врачом выражает сопротивление и нежелание принять помощь, не сводя смысл к открытому неповиновению.
- source_word: רופא
  choice: врачу
  rationale: «Врач» — современное, достойное и точное обозначение медицинского лица; отсутствие артикля в еврейском не требует в русском особого выражения неопределённости.
theological_decisions:
- issue: Расхождение еврейского и греческого текста во второй части стиха
  choice: 'Основной текст следует сохранившемуся еврейскому чтению: «будет противиться врачу».'
  alternative: 'Греческий текст: «попадёт в руки врача».'
  rationale: При наличии надёжного еврейского свидетельства оно имеет первенство. Существенно отличающееся греческое чтение сохранено в сноске, чтобы не скрывать текстовую и смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим строем. «Создатель» сохраняет возвышенность премудростной речи, а «врач» звучит естественно и современно.
