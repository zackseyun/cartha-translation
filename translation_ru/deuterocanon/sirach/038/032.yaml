  text: With his arm he will shape clay[a], and before his feet he will bend his strength.
translation:
  language: ru
  text: Рукой он формует глину и перед ногами сгибает силу свою.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед ногами сгибает силу свою». Греческое выражение сжато и понимается по-разному: оно может описывать, как мастер склоняется к работе или напрягает силы у своих ног; возможно также понимание, что он покоряет крепость глины. В тексте сохранена образная неоднозначность.'
    reason: Сохраняет пространственное значение πρὸ ποδῶν и не навязывает спорное отнесение местоимения или конкретное толкование «сгибает силу».
lexical_decisions:
- source_word: ἐν βραχίονι αὐτοῦ
  choice: Рукой
  rationale: Буквально выражение указывает на руку как орудие физического труда; краткое «рукой» естественно по-русски и сохраняет телесный образ.
- source_word: τυπώσει
  choice: придаёт форму
  rationale: В сочетании с πηλόν глагол означает формование глины. Настоящее время передаёт обобщённое описание ремесла, выраженное в греческом последовательностью форм будущего времени.
- source_word: πηλόν
  choice: глине
  rationale: В контексте работы горшечника πηλός обозначает глину как материал ремесла.
- source_word: πρὸ ποδῶν
  choice: ногами
  rationale: Греческое выражение буквально означает «перед ногами / у ног». В данном ремесленном контексте оно, вероятно, описывает обработку глины ногами; инструментальная передача делает образ понятным по-русски.
- source_word: κάμψει ἰσχὺν αὐτοῦ
  choice: преодолевает её сопротивление
  rationale: 'Буквально: «согнёт его/её силу». По ближайшему возможному антецеденту αὐτοῦ может относиться к глине и описывать, как мастер делает неподатливый материал податливым. «Сопротивление» естественно выражает здесь силу или крепость материала, не скрывая иной возможности, указанной в сноске.'
