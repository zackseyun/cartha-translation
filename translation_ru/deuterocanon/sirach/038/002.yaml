translation:
  language: ru
  text: От Бога врач обретает мудрость[a], и от царя получает дары[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст: «Ибо исцеление — от Всевышнего». В еврейском тексте стоит «от Бога», а далее — трудная конструкция «врач обретает мудрость».'
    reason: textual_variant
  - marker: b
    text: 'Или: «получает вознаграждение». Буквальное значение еврейского выражения не вполне ясно; греческий текст: «получит дар».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מאת אל
  choice: от Бога
  rationale: Основной еврейский свидетель прямо называет Бога (אל); греческое «от Всевышнего» отмечено в сноске как значимый вариант.
- source_word: יחכם רופא
  choice: врач обретает мудрость
  rationale: 'Передаёт трудную, но читаемую еврейскую конструкцию буквально по смыслу: יחכם — «становится мудрым, обретает мудрость», רופא — «врач». Более естественное «обретает мудрость» сохраняет связь врачебного умения с Богом.'
- source_word: מאת מלך
  choice: от царя
  rationale: Неопределённая еврейская форма допускает «от царя» или «от какого-либо царя»; в русском обобщённое «от царя» звучит естественно и соответствует греческой параллели.
- source_word: ישא משאות
  choice: получает дары
  rationale: Сочетание допускает буквальное «несёт ноши», однако משאות может обозначать дары или подношения, а греческая параллель ясно говорит о получении дара. Множественное число «дары» следует форме еврейского текста.
