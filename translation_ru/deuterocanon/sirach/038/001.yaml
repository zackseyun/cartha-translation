translation:
  language: ru
  text: Почитай врача по мере нужды в нём[a], ведь и у него есть удел от Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно греческому тексту: «Почитай врача почестями, которых он достоин, по нужде в нём, ведь и его создал Господь». Еврейский текст во второй части стиха буквально говорит: «ведь и у него есть удел от Бога».'
    reason: alternative_reading
lexical_decisions:
- source_word: רעי
  choice: Почитай
  rationale: Повелительная форма допускает значения доброго расположения и уважения; греческое Τίμα прямо поддерживает значение «почитай». Такой перевод естественен и сохраняет достоинство назидательной речи.
- source_word: רופא
  choice: врача
  rationale: רופא обозначает лечащего, целителя; современное литературное «врач» точно, понятно и стилистически уместно.
- source_word: לפני צרכו
  choice: когда нуждаешься в нём
  rationale: Сжатое еврейское выражение связывает отношение к врачу с нуждой в нём. Русская формулировка передаёт практический смысл без внесения греческого упоминания услуг или вознаграждения.
- source_word: חלק אל
  choice: удел от Бога
  rationale: חלק означает «доля, удел»; אל здесь понимается как «Бог». «Удел от Бога» сохраняет образ еврейского текста и не смешивает его с греческим чтением о сотворении врача.
theological_decisions:
- issue: Основание для почитания врача
  choice: ведь и у него есть удел от Бога
  alternative: ведь и его создал Господь
  rationale: Основной текст следует сохранившемуся еврейскому свидетельству, где говорится об уделе от Бога. Отличающееся греческое чтение о сотворении врача не устраняется, а приводится в примечании.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-возвышенным тоном литературы мудрости. Сохранён образ «удела» из еврейского текста; различие между еврейским и греческим свидетельствами вынесено в примечание.
