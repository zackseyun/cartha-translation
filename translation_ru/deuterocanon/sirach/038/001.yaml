  source_fidelity: 'Основная мысль передана верно: врачу следует оказывать почёт, а его положение связано с Божьим уделом. Однако «когда нуждаешься в нём» сужает и временно переосмысляет сжатое לפני צרכו; в соответствии с английской аудиторской формулировкой и возможным смыслом оборота лучше передать меру/обусловленность нуждой, не сводя её к моменту обращения.'
  naturalness: «Почитай врача по мере нужды в нём» звучит по-современному литературно и сохраняет сдержанный назидательный регистр. «Удел от Бога» естественно и образно.
  terminology: '«Врач», «почитай» и «удел от Бога» уместны. В примечании греческое чтение следует передать точнее: речь идёт о почёте, подобающем врачу, а не прямо об «услугах». Имя Κύριος передано как «Господь».'
  issues:
  - severity: medium
    issue: В главном тексте «когда нуждаешься в нём» заменяет отношение к нужде временным условием.
