  - severity: low
    issue: Примечание передаёт греческое τιμαῖς αὐτοῦ как «за его услуги».
    rationale: Греческий текст говорит о почёте, подобающем врачу; «услуги» является интерпретационным сдвигом. Более точная русская формулировка сохраняет связь с основным повелением «Почитай».
  revised_text: Почитай врача по мере нужды в нём[a], ведь и у него есть удел от Бога.
  revised_footnotes:
