lexical_decisions:
- source_word: בני
  choice: Сын мой
  rationale: Форма обращения с суффиксом первого лица сохраняет личный, наставнический тон книги.
- source_word: על המת
  choice: об умершем
  rationale: Предлог על обозначает здесь того, по кому скорбят; выражение естественно для современного литературного русского языка.
- source_word: הזיב דמעה
  choice: пролей слёзы
  rationale: Еврейская каузативная идиома буквально говорит о том, чтобы дать слезе течь; множественное число по-русски естественно передаёт призыв плакать и согласуется с греческим παράллельным текстом.
- source_word: התמרר
  choice: предайся горечи
  rationale: Возвратная порода выражает вхождение в состояние горькой скорби. Перевод сохраняет отдельность повеления и не сводит его лишь к наречию при следующем действии.
- source_word: וגהה קינה
  choice: и начни плач
  rationale: קינה — погребальный плач или причитание. Последний еврейский глагол текстуально труден; смысл начала плача поддерживается греческим ἔναρξαι θρήνου.
