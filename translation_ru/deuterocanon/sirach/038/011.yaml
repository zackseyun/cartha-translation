translation:
  language: ru
  text: Принеси благоугодное памятное приношение и обогати приготовленную жертву лучшим из своего достатка.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «принеси благоугодное памятное приношение и утучни приготовленное крыльями своего богатства». Выражение «крыльями своего богатства» не вполне ясно; вероятно, оно означает лучшее или всю полноту имеющихся средств.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте: «Принеси благоухание и памятное приношение из тонкой пшеничной муки и сделай приношение тучным, словно тебя уже нет». Последняя часть существенно отличается; здесь перевод следует еврейскому тексту.'
    reason: alternative_reading
lexical_decisions:
- source_word: הגש
  choice: Принеси
  rationale: Повелительная форма в жертвенном контексте означает принести или представить приношение; «принеси» естественно и сохраняет культовый смысл.
- source_word: ניחוח
  choice: благоугодное
  rationale: В языке жертвоприношений слово указывает на угодность приношения; явного существительного «благоухание» в еврейском тексте нет.
- source_word: אזכרה
  choice: памятное приношение
  rationale: Культовый термин для памятной части приношения; перевод сохраняет как идею памятования, так и жертвенную конкретность.
- source_word: ודשן
  choice: щедро приготовь
  rationale: Глагол буквально связан с полнотой или тучностью и здесь передаёт обильность жертвы; сочетание естественно по-русски.
- source_word: ערוך
  choice: приготовь жертву
  rationale: Слово обозначает нечто разложенное или приведённое в порядок, вероятно жертвенные части на жертвеннике; контекстуальное «приготовь жертву» ясно передаёт смысл.
- source_word: בכנפי הוניך
  choice: из лучшего, что у тебя есть
  rationale: Буквально «крыльями твоего богатства»; вероятная идиома указывает на край, полноту либо отборную часть достояния. Перевод сохраняет призыв не скупиться, не перенося непрозрачный образ в основной текст.
theological_decisions:
- issue: Жертвенная образность в наставлении мудрости
  choice: 'Сохранить прямую жертвенную терминологию: «памятное приношение», «жертва».'
  alternative: Обобщить как «память», «дар» или духовное благочестие.
  rationale: И еврейский текст, и греческая параллель используют культовую лексику; перевод не должен превращать жертву исключительно в молитву или внутреннее благочестие.
- issue: Неясная идиома בכנפי הוניך
  choice: Передать как «из лучшего, что у тебя есть» и раскрыть буквальный образ в примечании.
  alternative: «крыльями твоего богатства» или «по мере своего достатка».
  rationale: Идиома не вполне прозрачна. Основной перевод выражает вероятный смысл, а примечание сохраняет буквальную форму и возможный оттенок полноты средств.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю, с сохранением торжественной жертвенной лексики. Неясная еврейская метафора вынесена в примечание; разночтение греческой традиции отмечено отдельно.
