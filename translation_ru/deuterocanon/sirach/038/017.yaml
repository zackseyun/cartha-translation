base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/017.yaml
  text: My son[a], make the mourning bitter and complete the lament; perform his mourning as is fitting for him. For a day or two, because of slander, shed tears[b]; then be comforted because of grief.
translation:
  language: ru
  text: Сын мой, пусть оплакивание твоё будет горьким и доведи плач до конца; соверши траур по умершему, как ему подобает. День или два проливай слёзы[a], а затем найди утешение в скорби[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «день или два ради слезы». В греческой версии стоит: «день или два ради нареканий», вероятно, чтобы человека не осудили за пренебрежение положенным трауром.'
    reason: textual_variant
  - marker: b
    text: Еврейское עון обычно означает «вина» или «беззаконие», но здесь может обозначать бедствие или страдание; греческая версия имеет «скорбь, печаль».
    reason: alternative_reading
lexical_decisions:
- source_word: המר
  choice: пусть плач твой будет горьким
  rationale: Побудительная форма от מרר передаёт образ горького, сильного плача. Такой перевод сохраняет еврейскую метафору и звучит естественно по-русски; греческое πίκρανον подтверждает этот оттенок.
- source_word: והתם מספד
  choice: соверши погребальное оплакивание до конца
  rationale: תם здесь указывает на завершение или полное исполнение обряда, а מספד — на оплакивание умершего. Формулировка не призывает немедленно прекратить скорбь, а велит исполнить положенное оплакивание полностью.
- source_word: ושית אבלו
  choice: соблюди траур по умершему
  rationale: אבל обозначает траур по умершему, а глагол שית — установление или совершение. Русская формулировка ясно передаёт обрядовый смысл и отношение суффикса к покойному.
- source_word: כיוצא בו
  choice: как ему подобает
  rationale: Выражение означает соответствие тому, что причитается умершему; греческое κατὰ τὴν ἀξίαν αὐτοῦ подтверждает смысл уместности и достоинства.
- source_word: יום ושנים
  choice: день или два
  rationale: Естественная передача краткого, ограниченного периода; греческая параллель также имеет «один день и два».
- source_word: בעבור דמעה
  choice: проливай слёзы
  rationale: Еврейский текст буквально говорит «ради слезы/плача». В контексте это естественно передаётся призывом плакать в течение дня или двух. Отличающееся греческое чтение вынесено в примечание.
- source_word: הנחם
  choice: утешься
  rationale: Императив означает принять утешение или дать себе утешиться после установленного времени плача; соответствует греческому παρακλήθητι.
- source_word: בעבור עון
  choice: после скорби
  rationale: Обычное значение עון — «вина, беззаконие», но здесь оно контекстуально трудно. Греческое λύπης поддерживает значение скорби или печали. Предлог передан как «после», чтобы по-русски ясно выразить переход от оплакивания к утешению, не скрывая трудность текста в примечании.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и греческой параллели
  choice: Основной текст переведён с еврейского; греческий привлечён для проверки и для разъяснения трудных мест в примечаниях.
  alternative: Следовать греческой версии в основном тексте, переводя χάριν διαβολῆς как «чтобы избежать нареканий».
  rationale: Сохранившийся еврейский текст является первичным свидетельством и явно содержит דמעה, «слеза», тогда как греческая версия отражает иное чтение. Различие нельзя молча устранять. В последней фразе греческое λύπη помогает установить подходящий контексту смысл редкого или неясного употребления עון.
- issue: Смысл заключительного עון
  choice: Передать контекстуально как «скорбь», отметив буквальную альтернативу.
  alternative: Перевести обычным значением «вина» или «беззаконие».
  rationale: Обычное значение создало бы неясную связь с утешением, тогда как тема стиха и греческое λύπη поддерживают значение бедствия, печали или скорби. Примечание сохраняет подлинную лексическую неоднозначность.
translation_notes:
  register: 'Современный литературный русский язык с достоинством мудростной литературы. Сохранён еврейский образ «горького плача», а обрядовые термины переданы понятно для широкого читателя. Текстовые и лексические трудности не сглажены: расхождение еврейского דמעה и греческого διαβολή, а также неоднозначность עון отмечены в сносках.'
