    rationale: Греческий глагол допускает «украсить», «привести в порядок», «отделать»; сочетание с ἐπὶ συντελείας указывает на окончательную стадию, но не требует значения безупречности.
  - severity: low
    issue: «Своих работ» добавляет принадлежность, не выраженную непосредственно в συντέλειαν ἔργων.
    rationale: Возможная контекстуальная связь с мастером понятна, но лучше сохранить неопределённое «работ».
  - severity: low
