  verdict: revise
  source_fidelity: 'Первая часть в целом верно передаёт καρδίαν ... δώσει εἰς συντέλειαν ἔργων. Во второй части черновик обоснованно раскрывает подразумеваемый объект κοσμῆσαι как «их», то есть работы, однако «до совершенства» чрезмерно усиливает смысл: κοσμέω прежде всего означает придать надлежащий порядок, вид или отделку, а ἐπὶ συντελείας — направленность к завершению.'
  naturalness: «Вложит сердце в завершение своих работ» понятно, но «посвятит своё сердце завершению работ» естественнее для современного литературного русского. Глагольное «будет бодрствовать» сглаживает образ отвлечённого существительного ἡ ἀγρυπνία αὐτοῦ; «его бдение — чтобы...» сохраняет его точнее и остаётся литературным.
  terminology: '«Сердце», «завершение» и «бдение» сохраняют ключевые образы и лексику оригинала. Не следует добавлять «своих» к «работ»: αὐτοῦ относится в тексте к сердцу, а не прямо к работам. «Придать законченный вид» передаёт ремесленно-оформительский оттенок κοσμῆσαι, не утверждая безоговорочно идею абсолютного совершенства.'
