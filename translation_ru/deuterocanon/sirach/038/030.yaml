  text: He will apply his heart to the completion of his work[a], and his wakefulness is to bring it to perfection.
translation:
  language: ru
  text: Он посвятит своё сердце завершению работ[a], и его бдение — чтобы придать им законченный вид.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «отдаст своё сердце завершению работ, и его бдение — привести в порядок (или украсить) к завершению». Выражение сжато; подразумеваемым объектом во второй части, вероятно, являются работы. Глагол может обозначать приведение в надлежащий вид, отделку или украшение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καρδίαν αὐτοῦ δώσει εἰς
  choice: вложит сердце в
  rationale: Сохраняет образ «сердца» как средоточия мысли и воли, при этом естественно передаёт направленную и усердную отдачу делу.
- source_word: συντέλειαν ἔργων
  choice: завершение своих работ
  rationale: συντέλεια здесь означает доведение ремесленных трудов до конца; множественное ἔργων сохранено как «работ».
- source_word: ἡ ἀγρυπνία αὐτοῦ
  choice: будет бодрствовать
  rationale: Греческое отвлечённое существительное естественно передано глагольной конструкцией, сохраняющей образ бодрствования и неослабного усердия.
- source_word: κοσμῆσαι
  choice: довести ... до совершенства
  rationale: В ремесленном контексте глагол означает привести в надлежащий порядок, отделать или украсить; выбранная формулировка передаёт тщательную окончательную отделку.
- source_word: ἐπὶ συντελείας
  choice: до совершенства
  rationale: Целевая формула указывает на окончательное завершение; «до совершенства» также передаёт оттенок хорошей, должной отделки, не сводя действие к простому прекращению труда.
