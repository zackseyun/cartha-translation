  text: A scribe’s wisdom increases wisdom[a], and one free from busyness will become wise.
translation:
  language: ru
  text: Мудрость книжника умножает мудрость, и тот, кто свободен от дел[a], станет мудрым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не обременён занятиями»; буквально: «испытывает недостаток в делах (занятиях)».'
    reason: Еврейское עסק может означать дело, занятие или работу; выражение подчёркивает наличие свободного времени для обретения мудрости.
lexical_decisions:
- source_word: חכמת סופר
  choice: мудрость книжника
  rationale: «Книжник» передаёт роль учёного знатока текстов, а не просто человека, умеющего писать; конструкция сохраняет повтор слова «мудрость» в еврейском тексте.
- source_word: תרבה חכמה
  choice: умножает мудрость
  rationale: Причинное значение глагола передаёт приумножение или возрастание мудрости; формулировка сохраняет выразительный повтор оригинала.
- source_word: וחסר עסק
  choice: и тот, кто свободен от дел[a]
  rationale: Буквально выражение означает человека, у которого недостаёт занятий или дел. В контексте речь идёт о свободе от поглощающих время обязанностей, а не обязательно о безработице.
- source_word: יתחכם
  choice: станет мудрым
  rationale: Возвратная порода здесь обозначает обретение мудрости или возрастание в ней; «станет мудрым» ясно и естественно передаёт этот смысл.
