translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Сохранён намеренный повтор «мудрость», а неоднозначность выражения о занятиях вынесена в сноску. Приведённый греческий параллельный текст имеет иное содержание и, вероятно, отражает расхождение текстовой традиции или нумерации, поэтому перевод основан на высоконадёжном еврейском источнике.
