base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/020.yaml
  text: 'Remember his lot, for it is your lot: his yesterday, and your today.'
translation:
  language: ru
  text: 'Помни о его уделе[a], ведь это и твой удел: ему — вчера, тебе — сегодня.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о его установлении» / «о назначенной ему участи». Еврейское חק часто означает «установление» или «предписание», но здесь, вероятно, речь об уделе человека — смерти.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте иначе: «Не предавай сердце своё печали; удали её, помня о последнем». Это чтение также указывает на смертность, однако отличается от еврейской формулировки.'
    reason: alternative_reading
lexical_decisions:
- source_word: זכור
  choice: Помни
  rationale: Повелительная форма глагола זכר передаёт призыв постоянно держать в памяти; «помни» прямо, естественно и сохраняет лаконичность еврейского текста.
- source_word: חקו
  choice: о его уделе
  rationale: חק обычно может означать «установление» или «предписание», но в контексте смерти и скорби обозначает назначенную человеку участь; «удел» сохраняет идею назначенности и не вызывает оттенка случайности.
- source_word: כי הוא חקך
  choice: ведь это и твой удел
  rationale: Фраза распространяет участь умершего на самого скорбящего. Частица «и» естественно выражает подразумеваемую общность участи, не устраняя краткость оригинала.
- source_word: לו אתמול ולך היום
  choice: ему — вчера, тебе — сегодня
  rationale: 'Сжатая антитеза оригинала сохранена без добавления глагола «умер»: контекст указывает на смерть, но еврейская формулировка оставляет её подразумеваемой.'
theological_decisions:
- issue: Значение חק в контексте смерти и скорби
  choice: удел — назначенная общая человеческая участь
  alternative: установление; предопределённая участь
  rationale: Непосредственный контекст говорит о смертности, а не о правовом постановлении. «Удел» передаёт назначенную участь, не привнося учения о механистическом предопределении.
- issue: Степень раскрытия эллипсиса לו אתמול ולך היום
  choice: сохранить эллиптическую форму «ему — вчера, тебе — сегодня»
  alternative: «вчера умер он, сегодня умрёшь ты»
  rationale: Оригинал намеренно не называет смерть прямо. Сохранение эллипсиса удерживает поэтическое напряжение и не делает текст более определённым, чем еврейский источник.
- issue: Соотношение еврейского текста с греческой параллелью
  choice: переводить еврейскую форму, а греческое разночтение вынести в примечание
  alternative: следовать греческому чтению о скорби и последних вещах
  rationale: Еврейский источник имеет высокую степень уверенности и существенно отличается по формулировке; греческий текст подтверждает тему смертности, но не заменяет еврейское чтение.
translation_notes:
  register: Современный литературный русский язык с достоинством и библейской лаконичностью. Конструкция с тире сохраняет резкий параллелизм еврейской строки; слово «удел» понятно современному читателю и передаёт назначенную участь лучше, чем юридически окрашенное «установление».
