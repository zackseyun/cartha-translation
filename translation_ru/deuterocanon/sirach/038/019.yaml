  text: Do not set your heart on him any longer[a]; let his memory go[c][b], and remember the end.
translation:
  language: ru
  text: Не принимай его больше близко к сердцу[a]; отпусти память о нём[b] и помни о конце[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не полагай больше к нему сердца»; это образное выражение означает не оставаться внутренне прикованным к умершему.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оставь воспоминание о нём». Еврейский глагол здесь труден; вероятный смысл — ослабить власть скорби, а не полностью забыть умершего. Греческий параллельный текст также указывает на то, что скорбь проходит.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «помни о его конце» либо «помни о собственном конце». В еврейском тексте сказано просто «о конце», без уточнения.'
    reason: alternative_reading
lexical_decisions:
- source_word: אל תשים אליו לב
  choice: Не устремляй к нему своё сердце
  rationale: Еврейское выражение буквально говорит о направлении сердца к человеку. В контексте скорби это призыв не оставаться внутренне сосредоточенным на умершем. Формулировка сохраняет образ сердца и естественно звучит по-русски.
- source_word: עוד
  choice: больше
  rationale: 'Наречие указывает на прекращение продолжающегося состояния: не делай этого впредь, не оставайся в нём далее.'
- source_word: פרע זכרו
  choice: отпусти память о нём
  rationale: Глагол פרע здесь труден для точного истолкования. В данном контексте речь, по-видимому, не о полном забвении умершего, а об освобождении от удерживающей скорби. Перевод сохраняет образ отпускания, не превращая повеление в резкий призыв забыть человека.
- source_word: וזכור אחרית
  choice: и помни о конце
  rationale: אחרית может обозначать конец, исход или конечную участь. Краткая формулировка сохраняет неопределённость еврейского текста и не уточняет без основания, идёт ли речь о конце умершего, собственной смерти скорбящего или общей смертности.
theological_decisions:
- issue: К кому относится «конец» (אחרית)
  choice: 'Оставить объект неуточнённым: «помни о конце»'
  alternative: «помни о его конце» или «помни о собственном конце»
  rationale: В еврейском тексте притяжательное уточнение отсутствует. Неопределённость позволяет услышать одновременно напоминание о смерти, конечной участи и пределах человеческой жизни; перевод не должен сужать этот смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством мудрой наставительной речи. Сохранены сердечный образ еврейского оригинала, лаконичность повелений и намеренная неопределённость последней фразы.
