  source_fidelity: 'Начальная часть точно передаёт греческий текст: гончар сидит за работой, вращает круг ногами и постоянно озабочен своим делом. Однако «каждое его изделие учтено» сужает πᾶσα ἡ ἐργασία αὐτοῦ («вся его работа / вся его деятельность») до готовых изделий и заменяет обобщающее «вся» дистрибутивным «каждое». Хотя такое понимание возможно как смысловой оттенок ἐργασία, его не следует делать единственным текстом перевода.'
