  yaml_path: translation/deuterocanon/sirach/038/031.yaml
  text: So the potter[a], sitting at his work and turning the wheel with his feet, is continually anxious over his work, and all his labor is by number;
translation:
  language: ru
  text: 'Так и горшечник: сидя за работой и ногами вращая круг, он всё время озабочен своим трудом, и вся его работа сосчитана[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, что он изготовляет, сосчитано». Греческое слово ἐργασία может означать как работу, так и результат работы — изготовленные изделия; ἐνάριθμος — «сосчитанный», «исчисленный».'
    reason: лексическая неоднозначность
lexical_decisions:
- source_word: οὕτως κεραμεύς
  choice: Так и горшечник
  rationale: οὕτως связывает этот пример с предшествующим перечислением ремесленников; «горшечник» — обычное и точное название мастера, изготовляющего глиняные сосуды.
- source_word: καθήμενος ἐν ἔργῳ αὐτοῦ
  choice: сидя за работой
  rationale: Передаёт одновременно позу мастера и его занятость делом естественным современным русским выражением.
- source_word: συστρέφων ἐν ποσὶν αὐτοῦ τροχόν
  choice: ногами вращая круг
  rationale: Сохраняет указание на способ приведения гончарного круга в движение; «вращая» точно и естественно передаёт действие.
- source_word: ἐν μερίμνῃ κεῖται διὰ παντὸς ἐπὶ τὸ ἔργον αὐτοῦ
  choice: он всё время озабочен своим трудом
  rationale: Оборот выражает постоянную заботу и напряжённую сосредоточенность на работе. «Озабочен» сохраняет оттенок беспокойной заботы, не придавая ему медицинского смысла.
- source_word: ἐνάριθμος πᾶσα ἡ ἐργασία αὐτοῦ
  choice: каждое его изделие учтено
  rationale: ἐνάριθμος означает «сосчитанный, учтённый», а ἐργασία может обозначать не только труд, но и его результат. Дистрибутивное «каждое» делает фразу ясной по-русски, не устраняя лексической неоднозначности, отмеченной в сноске.
