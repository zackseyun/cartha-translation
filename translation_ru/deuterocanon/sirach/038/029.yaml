  source_fidelity: «Стук молота» точно передаёт φωνὴ σφύρης в ремесленном контексте. «Бьёт по его уху» — осмысленное, не чрезмерно категоричное решение для трудного καινεῖ при τὸ οὖς αὐτοῦ; сноска корректно сохраняет его лексическую неопределённость. «Глаза его устремлены на форму сосуда» естественно передаёт κατέναντι ὁμοιώματος σκεύους, не добавляя догматических либо ремесленно-специфических деталей.
