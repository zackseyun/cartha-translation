  text: Стук молота бьёт по его уху[a], а глаза его устремлены на форму сосуда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Стук молота отдаётся у него в ухе». Греческий глагол в этом контексте труден для истолкования и, вероятно, передаёт повторяющееся воздействие шума молота на слух мастера.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ σφύρης
  choice: стук молота
  rationale: В ремесленном контексте φωνή обозначает слышимый звук, производимый молотом. Русское «стук молота» естественно передаёт характер этого звука.
- source_word: καινεῖ
  choice: бьёт
  rationale: Глагол труден в данном контексте. При дополнении «ухо» и упоминании молота «бьёт по уху» передаёт воздействие повторяющегося стука, не прибегая к неясному буквальному значению «обновляет».
- source_word: τὸ οὖς αὐτοῦ
  choice: по его уху
  rationale: Сохранено единственное число греческого текста и конкретный телесный образ.
- source_word: κατέναντι
  choice: устремлены на
  rationale: Буквально слово указывает на положение «напротив, перед». В сочетании с глазами здесь естественно выражает сосредоточенный взгляд ремесленника.
- source_word: ὁμοιώματος
  choice: форму
  rationale: «Форма» сохраняет широкое значение подобия или образа, не уточняя его как заранее заданный образец.
- source_word: σκεύους
  choice: сосуда
  rationale: В ремесленном контексте σκεῦος может обозначать изготовляемый сосуд или изделие; «сосуд» соответствует непосредственному предметному образу и сохраняет достоинство стиля.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: глаза его
  rationale: Конкретный образ греческого текста сохранён; порядок слов поддерживает ровный литературный ритм.
