  source_fidelity: 'Вторая половина передана точно по смыслу: והנחם — призыв утешиться, עם צאת נפשו — при уходе/исходе его נפש. В первой половине дошедшая еврейская фраза чрезвычайно сжата и синтаксически трудна; предложенное прочтение «Когда умерший упокоится, пусть утихнет и память о нём» остаётся допустимой осторожной передачей мотивов покоя и памяти, но не должно подаваться как бесспорный буквальный синтаксис.'
  naturalness: Фраза звучит естественно и достойно для современного литературного русского. «Когда его оставит жизнь» несколько естественнее, чем «когда жизнь его покинет», и яснее выражает смерть без излишней абстрактности.
  terminology: «Упокоится» уместно в мудростно-погребальном контексте и не чрезмерно конфессионально. «Жизнь» для נפש сохраняет широкую семантику слова; вариант «душа» следует оставить в сноске. «Участь» в греческой альтернативе точно передаёт κρίμα в данном контексте.
