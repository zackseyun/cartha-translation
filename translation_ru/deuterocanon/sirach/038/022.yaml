  text: The resting place of the dead is his dwelling[b][a]; and be comforted when his life departs.
translation:
  language: ru
  text: Когда умерший обретёт покой, пусть успокоится и память о нём; утешься, когда жизнь его покинет[a].[b]
  philosophy: optimal-equivalence
  footnotes:
