    reason: alternative_reading
lexical_decisions:
- source_word: מושבת מתו
  choice: когда умерший обретёт покой
  rationale: Трудная и сжатая конструкция связана с корнем ישב и обозначением умершего. В погребальном контексте естественно передать её как упокоение умершего, не конкретизируя место словом «могила», которого в еврейском тексте нет.
- source_word: שבת זכרו
  choice: пусть успокоится и память о нём
  rationale: שבת означает прекращаться или покоиться, а זכרו — «память о нём». Формулировка сохраняет повтор корневой идеи покоя и передаёт фразу как увещание, хотя дошедший еврейский текст здесь сжат и текстологически труден.
- source_word: והנחם
  choice: утешься
  rationale: Возвратное повеление естественно передаёт призыв принять утешение, не добавляя подразумеваемого утешителя.
- source_word: עם צאת
  choice: когда … покинет
  rationale: Предлог עם в данном обороте имеет временной оттенок, а צאת буквально обозначает выход или уход. Русская конструкция передаёт этот образ естественно.
- source_word: נפשו
  choice: жизнь его
  rationale: נפש может означать жизнь, душу, самого человека или жизненное дыхание. В основном тексте выбрано нейтральное «жизнь», чтобы не навязывать более узкое антропологическое толкование; вариант «душа» сохранён в сноске.
theological_decisions:
- issue: Значение נפש при описании смерти
  choice: когда жизнь его покинет
  alternative: когда душа его отойдёт
  rationale: Основной вариант передаёт смерть, не превращая широкое еврейское понятие נפש в строгое учение о душе. Традиционный и лексически возможный вариант отмечен в сноске.
- issue: Существенное расхождение еврейского и греческого текстов
  choice: Перевести сохранившийся еврейский текст, честно отметив его трудность
  alternative: '«Помни: его участь — как и твоя; вчера — мне, сегодня — тебе»'
  rationale: Приоритет отдан указанному еврейскому свидетелю. Греческая параллель отражает заметно иную текстовую форму и поэтому приведена в сноске, а не смешана с основным текстом.
- issue: Синтаксис מושבת מתו שבת זכרו
  choice: увещание дать успокоиться памяти об умершем после его упокоения
  alternative: «Место покоя умершего — его жилище; память о нём прекратилась»
  rationale: Еврейская последовательность сжата и отмечена источником как имеющая небольшое несоответствие. Выбранный вариант даёт связный современный русский текст, сохраняя ключевые значения покоя и памяти и не опираясь на греческую редакцию.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной речи. Сохранена образность покоя, памяти и ухода жизни; устранены неестественные кальки, но текстологическая неуверенность не скрыта.
