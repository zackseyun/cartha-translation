lexical_decisions:
- source_word: וגם
  choice: Также
  rationale: Передаёт присоединительный смысл наставления и естественно связывает его с ближайшим контекстом.
- source_word: לרופא
  choice: врачу
  rationale: רופא означает врача или целителя; современное «врач» сохраняет достоинство стиля и обозначает представителя профессии вообще.
- source_word: תן מקום
  choice: отведи место
  rationale: Сохраняет конкретный образ еврейского выражения «дай место», но по-русски естественнее указывает на признание врачу надлежащего места и роли.
- source_word: ולא ימוש
  choice: не отпускай его
  rationale: מוש выражает удаление или уход. В контексте это естественно передаёт призыв не позволять врачу уйти и не отказываться от его помощи.
- source_word: כי גם בו צורך
  choice: потому что и в нём есть нужда
  rationale: Сохраняет безличную конструкцию, добавочное גם и практический смысл необходимости врача.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческого параллельного свидетельства
  choice: Следовать еврейскому тексту и не включать греческую вставку в основной стих.
  alternative: «Также отведи место врачу, ведь Господь создал и его; пусть он не отходит от тебя, потому что в нём есть нужда».
  rationale: В данном месте еврейский текст сохранился и не содержит слов о сотворении врача Господом. Греческое расширение важно как древнее вариантное чтение, поэтому отмечено в сноске, но не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством, подобающим литературе премудрости. Формулировка сохраняет образность еврейского текста и избегает как архаизма «лекарь», так и разговорного оттенка.
