  source_fidelity: 'Еврейский текст передан в целом верно: сохраняются призыв дать врачу подобающее место, запрет на его удаление и указание на его необходимость. Однако «и в нём есть нужда» по-русски означает, что нужда находится внутри врача, а не что врач необходим. Кроме того, «не отпускай его» несколько активнее истолковывает безлично-интранзитивное ולא ימוש («пусть он не отходит»).'
  naturalness: «Также дай место врачу» — естественная литературная передача, более непосредственная, чем «отведи место врачу». Формулировка «ибо он тоже нужен» современна, ясна и сохраняет добавочное גם.
  terminology: «Врач» уместно для современного литературного русского и регистра книги Премудрости. «Господь» в сноске точно передаёт греческое Κύριος, не добавляя этого чтения в основной текст.
