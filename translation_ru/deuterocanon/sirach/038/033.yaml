lexical_decisions:
- source_word: καρδίαν ἐπιδώσει
  choice: приложит сердце
  rationale: Сохраняет конкретный образ греческой идиомы и передаёт усердную сосредоточенность мастера; выражение понятно и уместно в возвышенной повествовательной речи.
- source_word: συντελέσαι
  choice: к завершению
  rationale: 'Передаёт целевое значение инфинитива: мастер сосредоточен на том, чтобы довести работу до конца.'
- source_word: τὸ χάρισμα
  choice: отделки
  rationale: Обычное значение «дар» здесь плохо согласуется с контекстом гончарного ремесла. «Отделка» передаёт вероятный смысл завершённого покрытия или оформления изделия, не вводя чрезмерно узкий технический термин.
- source_word: ἡ ἀγρυπνία αὐτοῦ
  choice: будет бодрствовать
  rationale: Естественно по-русски передаёт образ неусыпного внимания к работе, выраженный греческим существительным «бодрствование».
- source_word: καθαρίσαι
  choice: очищая
  rationale: Передаёт практическое очищение печи без нежелательного ритуального оттенка слова «очищать» в данном ремесленном контексте.
- source_word: κάμινον
  choice: печь
  rationale: Греческое слово может обозначать печь или горн; «печь» является естественным широким соответствием и хорошо подходит к гончарному контексту.
