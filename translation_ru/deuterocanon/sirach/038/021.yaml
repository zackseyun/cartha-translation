base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/038/021.yaml
  text: Do not keep remembering him[a], for there is no return; you will not help him, and you will harm yourself.
translation:
  language: ru
  text: Не продолжай вспоминать о нём, ведь у него нет надежды[a]. Что это даст? Ты лишь навредишь себе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «ведь у него нет надежды»; в греческой параллели: «ведь возврата нет».'
    reason: alternative_reading
lexical_decisions:
- source_word: אל תזכרנו
  choice: Не продолжай вспоминать о нём
  rationale: Отрицательное повеление с זכר в контексте наставления о скорби запрещает не саму память об умершем, а длительное сосредоточение на ней. Такая передача естественна по-русски и не звучит как требование полностью забыть человека.
- source_word: כי אין לו תקוה
  choice: ведь возврата нет
  rationale: 'В еврейском тексте буквально сказано: «ведь у него нет надежды», однако греческая параллель οὐ γάρ ἐστιν ἐπάνοδος прямо означает «ведь возврата нет». В контексте смерти это ясно выражает практический смысл; буквальное еврейское чтение сохранено в сноске.'
- source_word: מה תועיל
  choice: ему ты не поможешь
  rationale: 'Еврейское выражение буквально допускает вопрос «какую пользу принесёшь?», а подразумеваемый объект определяется контекстом. Греческое τοῦτον οὐκ ὠφελήσεις делает объект явным: «ему не поможешь».'
- source_word: ולך תרע
  choice: а себе навредишь
  rationale: Фраза указывает на вред самому скорбящему; греческое σεαυτὸν κακώσεις подтверждает возвратный смысл. Союз «а» естественно передаёт противопоставление бесполезности для умершего и вреда для себя.
theological_decisions:
- issue: Передача תקוה в выражении כי אין לו תקוה
  choice: ведь возврата нет
  alternative: ведь у него нет надежды
  rationale: Еврейский текст первичен и буквально говорит об отсутствии надежды, тогда как греческая параллель говорит об отсутствии возвращения. Основной текст следует ясному контекстуальному чтению, засвидетельствованному греческим текстом, но отличие еврейского свидетельства не устраняется и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и наставительный. Формулировка доступна обычному читателю, не устраняет текстовое расхождение между еврейским и греческим свидетельствами.
