  text: Do not be astonished at evildoers[a]; run to the Lord and wait for his light.
translation:
  language: ru
  text: Не изумляйся тем, кто делает зло[a]; беги к Господу и жди Его света.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «В день благополучия забываются беды, а в день бедствия не вспомнят о благополучии». Греческое свидетельство здесь существенно отличается от сохранившегося еврейского текста.'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּתְמַה
  choice: Не изумляйся
  rationale: Передаёт запрет удивляться или быть застигнутым врасплох, не сводя смысл к страху либо смятению.
- source_word: בְּעוֹשֵׂי רָע
  choice: тем, кто делает зло
  rationale: Естественно передаёт буквальное «делающим зло» и сохраняет акцент на поступках людей.
- source_word: תָּרוּץ
  choice: беги
  rationale: Сохраняет конкретность и настоятельность еврейского глагола «бежать».
- source_word: לַיי
  choice: к Господу
  rationale: Благоговейное написание указывает на Божественное имя; традиционное русское «Господь» естественно в данной конструкции.
- source_word: וְקַוֵּה
  choice: и жди
  rationale: Глагол объединяет ожидание и надежду; «жди» сохраняет образ устремлённого ожидания, не устраняя оттенок надежды.
- source_word: לְאוֹרוֹ
  choice: Его света
  rationale: Сохраняет буквальный и многозначный образ света как возможного обозначения Божьего благоволения, водительства или избавления.
theological_decisions:
- issue: Передача Божественного имени в благоговейном написании יי
  choice: Господь
  alternative: Яхве
  rationale: «Господь» соответствует устойчивой русской библейской традиции и ясно обозначает Бога Израиля, не вводя спорную реконструкцию произношения.
- issue: Существенное расхождение еврейского и греческого свидетелей
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству, греческое чтение дано в сноске
  alternative: Перевести греческий текст как основной или согласовать оба чтения
  rationale: Еврейский текст здесь сохранён и текстуально уверен; греческий свидетель содержит иное изречение, которое нельзя незаметно объединить с еврейским.
translation_notes:
  register: Современный литературный русский язык с краткой наставительной интонацией. Конкретное «беги» и образ «Его света» сохранены; местоимение «Его» написано с прописной буквы по принятой русской библейской традиции.
