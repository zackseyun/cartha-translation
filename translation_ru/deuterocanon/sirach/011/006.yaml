  text: Many who were oppressed sat on a throne[b][a], and one not thought of put on a turban.
translation:
  language: ru
  text: Многие угнетённые воссели на престол[b], и тот, о ком не думали, надел тюрбан[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по смыслу: «неожиданный человек удостоился великой чести». Буквально еврейский текст говорит о том, кто «не пришёл на сердце», а затем «надел тюрбан»; это конкретный образ внезапного возвышения.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст передаёт этот стих иначе: «Многие властители были тяжко унижены, и славные люди были отданы в руки товарищей». Обе формы говорят о перемене общественного положения.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים נִדְכָּאִים
  choice: Многие угнетённые
  rationale: Сохраняет количественное значение רַבִּים и пассивно-социальный оттенок נִדְכָּאִים — людей подавленных, униженных или притесняемых.
- source_word: יָשְׁבוּ עַל כִּסֵּא
  choice: воссели на престол
  rationale: כִּסֵּא здесь обозначает не просто сиденье, а престол и возвышение к власти; «воссели» естественно передаёт обретение высокого положения.
- source_word: וּבַל עָלוּ עַל לֵב
  choice: и тот, о ком не помышляли
  rationale: Буквально выражение означает «не поднимались на сердце»; русская формулировка сохраняет смысл человека, которого не принимали в расчёт и чьего возвышения не ожидали.
- source_word: עָטוּ צְנִיף
  choice: надел тюрбан
  rationale: Сохраняется конкретный еврейский образ облачения в головной убор как знак достоинства или должности, без замены его отвлечённым «обрёл почёт».
theological_decisions:
- issue: Расхождение еврейского текста и греческой параллели
  choice: 'Основной текст следует высоконадёжному еврейскому свидетельству: угнетённые восходят на престол, а неожиданный человек надевает тюрбан.'
  alternative: 'Греческий текст: многие властители были тяжко унижены, а славные люди отданы в руки других.'
  rationale: Еврейский текст является первичным источником для перевода данного места. Греческая форма заметно отличается, но подтверждает общую тему резкой перемены общественного положения; расхождение открыто отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. «Воссели» слегка возвышенно, но понятно и уместно при слове «престол»; остальная формулировка остаётся ясной для обычного читателя.
