translation:
  language: ru
  text: Время беды заставляет забыть об удовольствии[a], а конец человека скажет о нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь: «Ибо он, обращая добро во зло, подстерегает и на желанное наложит порицание». Еврейское и греческое чтения заметно различаются; основной текст следует сохранившемуся еврейскому свидетельству как первичному для Книги Премудрости Иисуса, сына Сирахова, там, где оно доступно.'
    reason: textual_variant
lexical_decisions:
- source_word: עֵת רָעָה
  choice: время беды
  rationale: עֵת обозначает время или пору, а רָעָה здесь естественно понимать как бедствие или несчастье, а не только нравственное зло. Выражение «время беды» звучит ясно и сохраняет краткость изречения.
- source_word: תְּשַׁכֵּח
  choice: заставляет забыть
  rationale: Каузативная форма глагола שכח передаёт значение «делать так, чтобы забыли». Русская конструкция сохраняет эту причинную силу, не вводя не названного в тексте субъекта.
- source_word: תַּעֲנוּג
  choice: наслаждение
  rationale: Существительное означает удовольствие, отраду или наслаждение. «Наслаждение» уместно в лаконичной литературной сентенции и не сужает смысл до отдельного удовольствия.
- source_word: וְסוֹף אָדָם
  choice: а конец человека
  rationale: סוֹף может обозначать конец или итог, а אָדָם здесь имеет обобщающее единственное число. «Конец человека» сохраняет как образ завершения жизни, так и возможный оттенок её окончательного итога.
- source_word: יַגִּיד עָלָיו
  choice: скажет о нём
  rationale: Каузатив נגד означает сообщать, объявлять, давать знать; сочетание с עָלָיו буквально говорит о свидетельстве относительно человека. Формулировка не уточняет сверх текста, что именно его конец откроет или докажет.
theological_decisions:
- issue: Смысл выражения «конец человека»
  choice: конец человека скажет о нём
  alternative: итог жизни человека покажет, каков он
  rationale: 'Основной текст сохраняет открытую образность еврейского изречения: речь может идти о смерти, конечной участи или итоге жизни. Более истолковывающий вариант неоправданно снимает эту многозначность.'
- issue: Обобщающее значение אָדָם
  choice: человек
  alternative: мужчина
  rationale: В данном изречении אָדָם обозначает отдельного представителя человеческого рода, а не специально лицо мужского пола. Русское «человек» точно передаёт обобщающее единственное число.
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным строем. Союз «а» подчёркивает переход ко второй части сентенции. Необычная, но понятная персонификация «конец… скажет» намеренно сохраняет образность и смысловую открытость еврейского текста.
