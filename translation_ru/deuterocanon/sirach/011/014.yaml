  text: There is one who is poor and perishing as he walks[a], lacking everything, yet more than a poor man.
translation:
  language: ru
  text: Добро и зло, жизнь и смерть, бедность и богатство — от Господа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившаяся еврейская строка в этом месте существенно отличается и, по-видимому, не соответствует нумерации данного стиха. Поэтому перевод следует устойчивому греческому чтению: «Добро и зло, жизнь и смерть, бедность и богатство — от Господа».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀγαθὰ καὶ κακά
  choice: добро и зло
  rationale: Сохраняется широкая и богословски напряжённая антитеза греческого текста; перевод «благополучие и бедствие» неоправданно сужал бы смысл.
- source_word: ζωὴ καὶ θάνατος
  choice: жизнь и смерть
  rationale: Прямой и естественный перевод устойчивой противопоставленной пары.
- source_word: πτωχεία καὶ πλοῦτος
  choice: бедность и богатство
  rationale: Точно передаёт социально-материальную противоположность и звучит естественно по-русски.
- source_word: παρὰ Κυρίου ἐστίν
  choice: от Господа
  rationale: Кратко и точно выражает источник или происхождение, не уточняя сверх текста характер божественного действия.
theological_decisions:
- issue: Господь назван источником как добра, так и зла
  choice: Сохранено буквальное «добро и зло… от Господа»
  alternative: «благополучие и бедствие… от Господа»
  rationale: Греческое κακά допускает неблагоприятные обстоятельства, но прямо противопоставлено ἀγαθὰ; перевод не должен устранять заложенное в тексте богословское напряжение или объявлять Бога виновником нравственного зла.
translation_notes:
  register: Современный литературный русский язык; афористическая симметрия оригинала сохранена. Тире естественно передаёт опущенную в русском связку.
