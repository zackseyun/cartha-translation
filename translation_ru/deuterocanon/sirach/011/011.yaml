  terminology: '«Трудится», «выбивается из сил» и «спешит» удачно различают три греческих причастия. «Отстаёт» допустимо сохраняет широкую идею нехватки/недостижения. Сноску следует уточнить: в её нынешнем пересказе финальное «не останется безнаказанным» не имеет выраженного субъекта, тогда как еврейская строка допускает восстановление субъекта лишь с определённой текстологической осторожностью.'
