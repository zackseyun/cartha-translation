base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/011.yaml
  text: There is[a] one who labors and toils and hurries, yet all the more he comes up short.
translation:
  language: ru
  text: Есть[a] человек, который трудится, выбивается из сил и спешит — и тем больше отстаёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленная строка из каирских рукописей Бен-Сиры не соответствует греческому тексту этого стиха, поэтому основной перевод следует греческому свидетельству. Еврейская строка приблизительно означает: «Сын мой, зачем ты умножаешь своё притеснение? Не следует умножать: [кто умножает], не останется безнаказанным». Синтаксис средней части неясен.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν
  choice: Есть
  rationale: Экзистенциальная конструкция естественно вводит описание определённого типа человека; настоящее время и неопределённость сохранены.
- source_word: κοπιῶν
  choice: трудится
  rationale: Передаёт напряжённую работу и позволяет сохранить последующее усиление без слияния однородных причастий.
- source_word: πονῶν
  choice: выбивается из сил
  rationale: Выражает тяжесть и изнурительность усилий, отличая это слово от более общего κοπιῶν.
- source_word: σπεύδων
  choice: спешит
  rationale: Сохраняет вероятный смысл поспешности; возможный оттенок усердия не исключается контекстом перечисления усилий.
- source_word: τόσῳ μᾶλλον
  choice: всё больше
  rationale: Передаёт нарастающий и иронический контраст между усиленными стараниями и ухудшающимся результатом.
- source_word: ὑστερεῖται
  choice: отстаёт
  rationale: Сохраняет широкое значение недостатка или недостижения цели, не уточняя без основания, является ли нехватка материальной.
theological_decisions:
- issue: Расхождение между предоставленной еврейской строкой и греческим свидетельством Сир 11:11
  choice: Основной текст переведён по связному греческому параллельному свидетельству, а расхождение с еврейской строкой отмечено в сноске.
  alternative: 'Перевести предоставленную еврейскую строку: «Сын мой, зачем ты умножаешь своё притеснение? … не останется безнаказанным».'
  rationale: Предоставленная еврейская строка не соответствует греческому тексту данного стиха и, по всей видимости, относится к иному контексту. Следование греческому свидетельству здесь сохраняет последовательность Сир 11:11, не скрывая текстологической проблемы.
translation_notes:
  register: Современный литературный русский язык; конструкция краткая и афористичная. Цепочка из трёх действий сохранена, а «отстаёт» намеренно не конкретизирует вид нехватки.
