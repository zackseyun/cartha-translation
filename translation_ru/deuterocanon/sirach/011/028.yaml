translation:
  language: ru
  text: 'Не говори[a]: «Вот, я исполнил своё желание — и чего теперь мне будет недоставать?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая параллель: «До конца не называй никого блаженным, и по детям его узнают человека». Еврейское свидетельство здесь, напротив, предостерегает от слов: «Я исполнил своё желание; и чего теперь мне будет недоставать?»'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Не говори
  rationale: Отрицательная частица с глагольной формой выражает прямой запрет; это естественная и точная русская формулировка.
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательную силу слова и вводит самодовольное утверждение без архаичного оттенка.
- source_word: עָשִׂיתִי חֶפְצִי
  choice: я исполнил своё желание
  rationale: Передаёт завершённость действия и значение חֵפֶץ как желания или воли; формулировка естественна для современного литературного русского.
- source_word: וּמֶה עַתָּה
  choice: и чего теперь
  rationale: Союз «и» передаёт וּ, а вопросительная конструкция сохраняет переход от самодовольства к уверенности в будущем благополучии.
- source_word: יֵעָזֵב לִי
  choice: мне будет недоставать
  rationale: В контексте хвастливого риторического вопроса форма означает то, чего говорящий якобы ещё может лишиться или в чём испытать недостаток; русский оборот ясно передаёт этот смысл.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и значительно отличающейся греческой параллели
  choice: Основной текст переведён непосредственно с еврейского, а греческое чтение приведено в сноске.
  alternative: «До конца не называй никого блаженным, и по детям его узнают человека».
  rationale: При наличии надёжного еврейского свидетельства оно имеет первенство. Греческий текст выражает сходное предостережение против преждевременной уверенности, но словесно представляет иное чтение, поэтому его нельзя смешивать с основным текстом.
- issue: Неоднозначность יֵעָזֵב לִי
  choice: «мне будет недоставать»
  alternative: «мне останется»
  rationale: Буквальная семантика допускает представление об оставлении или остатке, однако контекст риторического самодовольства лучше поддерживает вопрос «чего мне будет недоставать?». Сноска не требуется, поскольку буквальная альтернатива без контекста затемняет смысл.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Вот» сохраняет живость прямой речи, а «исполнил своё желание» звучит естественно, не снижая регистра. Тире внутри цитаты обозначает риторический переход и не заменяет явно переданный союз «и».
