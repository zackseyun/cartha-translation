translation:
  language: ru
  text: Ведь Господу легко[a] в одно мгновение сделать бедного богатым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Ведь Господу легко в день смерти воздать человеку по путям его». Греческий текст представляет существенно иную форму стиха, чем сохранившийся еврейский.'
    reason: alternative_reading
lexical_decisions:
- source_word: נֹכַח בְּעֵינֵי יי
  choice: Господу легко
  rationale: נֹכַח в сочетании с בְּעֵינֵי יי и при поддержке греческого κοῦφον передаёт лёгкость, отсутствие затруднения. Естественная русская конструкция «Господу легко» сохраняет этот смысл без буквального, но менее естественного оборота «легко в глазах Господа».
- source_word: בְּפֶתַע פִּתְאֹם
  choice: в одно мгновение
  rationale: Удвоенное выражение подчёркивает внезапность и быстроту. «В одно мгновение» естественно по-русски передаёт усиленный временной смысл.
- source_word: לְהַעֲשִׁיר
  choice: сделать … богатым
  rationale: Каузативная форма породы hифиль означает «сделать богатым»; аналитический перевод прозрачен и точно передаёт причинительное значение.
- source_word: דָּל
  choice: бедного
  rationale: Субстантивированное прилагательное в единственном числе обозначает неимущего человека. Русская форма «бедного» сохраняет обобщённо-личный смысл и не требует добавлять отсутствующее в тексте слово «человек».
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит обоснование предыдущей мысли; «ведь» естественно передаёт причинно-пояснительную связь.
theological_decisions:
- issue: Передача божественного имени יי
  choice: Господь
  alternative: Яхве; ГОСПОДЬ
  rationale: יי представляет благоговейное обозначение божественного имени. Традиционное и естественное русское соответствие «Господь» не вносит конфессионально специфического толкования.
- issue: Различие еврейской и греческой форм стиха
  choice: Основной текст следует сохранившемуся еврейскому тексту; греческая форма дана в сноске
  alternative: «Ведь Господу легко в день смерти воздать человеку по путям его»
  rationale: Еврейское свидетельство здесь сохранилось и имеет высокую степень надёжности, поэтому оно служит основой перевода. Греческий текст представляет существенно иную форму стиха, которую необходимо сохранить как текстологическую альтернативу, не смешивая два чтения.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма соответствует стилю премудростной литературы. Формулировка ясна обычному читателю и при этом сохраняет причинную связь, внезапность действия и смысл божественной лёгкости.
