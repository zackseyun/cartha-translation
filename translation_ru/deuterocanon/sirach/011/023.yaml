  text: Do not say, "What do I need, and what good things will be mine from now on?"[a]
translation:
  language: ru
  text: 'Не говори: «Что мне нужно и какие блага будут у меня отныне?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст здесь резко отличается: «Он не знал, что будет потом, оставил это другому и умер» — или близко к этому. Основной текст следует греческому чтению, поскольку еврейская строка, по-видимому, повреждена или оказалась не на своём месте.'
    reason: textual_variant
lexical_decisions:
- source_word: לֹא יָדַע / μὴ εἴπῃς
  choice: Не говори
  rationale: Сохранившийся еврейский текст содержит «он не знал», однако далее образует резко расходящуюся и, вероятно, смещённую либо повреждённую строку. В основном тексте принято связное греческое наставление μὴ εἴπῃς, соответствующее контексту; еврейское чтение приведено в примечании.
- source_word: Τίς ἐστίν μου χρεία
  choice: В чём я нуждаюсь
  rationale: χρεία означает «нужда, потребность». Такая формулировка естественна по-русски и сохраняет риторический характер вопроса.
- source_word: τίνα ... ἔσται μου τὰ ἀγαθά
  choice: какие блага будут у меня
  rationale: τὰ ἀγαθά может обозначать блага, добрые вещи или выгоды. «Блага» сохраняет широкий смысл и не ограничивает его только имуществом.
- source_word: ἀπὸ τοῦ νῦν
  choice: отныне
  rationale: Точное и литературное обозначение времени, уместное в современном русском библейском тексте.
theological_decisions:
- issue: Выбор основного текста при резком расхождении еврейского и греческого свидетелей
  choice: Основной текст следует греческому наставлению
  alternative: «Он не знал, что будет потом, оставил это другому и умер» (или близко к этому).
  rationale: Хотя сохранившийся еврейский текст обычно имеет первенство, здесь его строка существенно расходится с параллелью и, по-видимому, текстуально не соответствует данному месту. Греческое чтение связно и подходит к контексту наставления. Расхождение не скрывается, а отражено в примечании.
translation_notes:
  register: Современный литературный русский язык; лаконичное, достойное наставление. Кавычки и вопросительная форма сохраняют прямую речь, а примечание открыто обозначает существенное текстовое расхождение.
