base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/030.yaml
  text: A good day makes one forget trouble[a], and a bad day makes one forget prosperity; and a man's end will be set before him.
translation:
  language: ru
  text: Добрый день заставляет забыть беду, а тяжёлый день — забыть благополучие; и конец человека будет на нём.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и конец человека будет на нём». Этот оборот может означать, что окончательная участь человека предстанет перед ним, придёт на него или ляжет на него. Греческий текст в этом месте существенно отличается от сохранившегося еврейского и не проясняет фразу.'
    reason: Сохранение неоднозначности буквального еврейского оборота и указание на расхождение текстовых традиций.
lexical_decisions:
- source_word: טוֹב יוֹם
  choice: Добрый день
  rationale: Буквально «добрый/хороший день»; речь идёт о благоприятном времени. Краткая форма сохраняет образ и естественно звучит по-русски.
- source_word: תִּשָּכַח רָעָה
  choice: заставляет забыть беду
  rationale: Глагольная форма передаёт забвение, а רָעָה в данном противопоставлении означает беду или несчастье, а не нравственное зло. Каузативная русская конструкция естественно выражает смысл всего оборота.
- source_word: וְרָע יוֹם
  choice: а тяжёлый день
  rationale: Антитеза благоприятному дню указывает на день бедствия. «Тяжёлый» по-русски яснее передаёт неблагоприятные обстоятельства и не вносит оттенка нравственного зла.
- source_word: תִּשָׁכַח טוֹבָה
  choice: забыть благополучие
  rationale: טוֹבָה здесь обозначает пережитое благо, достаток или благополучие; выбранный вариант ясно противопоставлен беде.
- source_word: וְאַחֲרִית אָדָם
  choice: и конец человека
  rationale: אַחֲרִית может означать конец, последнюю участь или исход. «Конец человека» сохраняет краткость и смысловую широту еврейского выражения; אָדָם употреблено родовым образом.
- source_word: תִּהְיֶה עָלָיו
  choice: настигнет его
  rationale: Буквально «будет на нём/над ним». Глагол «настигнет» естественно передаёт возможный смысл того, что окончательная участь приходит на человека, не превращая неясную фразу в строго определённое учение.
theological_decisions:
- issue: Смысл последней участи человека
  choice: конец человека настигнет его
  alternative: конец человека будет на нём
  rationale: Еврейское עָלָיו допускает образ того, что приходит на человека или оказывается на нём. Основной текст передаёт вероятный смысл естественно, а примечание сохраняет буквальную форму и её неоднозначность. Существенно отличающийся греческий параллельный текст не используется для устранения этой неясности.
- issue: Родовое значение אָדָם
  choice: человека
  alternative: мужчины
  rationale: В данном контексте אָדָם обозначает человека вообще, поэтому русское «человека» точно и естественно передаёт родовое значение без ограничения мужским полом.
translation_notes:
  register: Современный литературный русский язык, сжатый афористический строй. Параллелизм первых двух частей сохранён; лексика доступная и достойная. Точка с запятой отделяет неясную заключительную мысль, не разрывая единства стиха.
