translation:
  language: ru
  text: Добро и зло[a], жизнь и смерть[b], бедность и богатство — от него[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедствие», «несчастье» или «вред». Еврейское רַע может обозначать не только зло вообще, но и несчастье или бедствие.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст этого стиха существенно отличается: «Дар Господа остаётся у благочестивых, и Его благоволение будет способствовать успеху вовек». Еврейское и греческое свидетельства здесь не совпадают.'
    reason: textual_variant
  - marker: c
    text: 'Буквально по-еврейски: «от него». По контексту, вероятно, имеется в виду Бог, однако в самой этой строке имя Бога не названо.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  choice: добро
  rationale: Субстантивированное «добро» естественно образует широкую пару противоположностей со «злом», не сужая значение до благополучия.
- source_word: וְרַע
  choice: и зло
  rationale: «Зло» сохраняет широкий диапазон еврейского רַע и напряжение текста; возможное значение бедствия или несчастья отмечено в сноске.
- source_word: חַיִּים
  choice: жизнь
  rationale: Обычный русский эквивалент в устойчивой смысловой паре «жизнь и смерть»; передаёт абстрактное значение еврейской формы.
- source_word: וָמָוֶת
  choice: и смерть
  rationale: Прямой и естественный антоним к слову «жизнь».
- source_word: רֵישׁ
  choice: бедность
  rationale: Наиболее естественное современное обозначение недостатка средств в противопоставлении богатству.
- source_word: וְעֹשֶׁר
  choice: и богатство
  rationale: Современный широкий эквивалент, точно передающий социально-экономическую противоположность бедности.
- source_word: מֵיי הוּא
  choice: от него
  rationale: Еврейский текст содержит местоименную отсылку, а не явное имя Бога; краткая конструкция сохраняет это без добавления отсутствующего титула.
theological_decisions:
- issue: К кому относится конечное местоимение
  choice: от него
  alternative: от Господа / от Бога
  rationale: По контексту подразумевается, вероятно, Бог, однако в данной еврейской строке имя или титул Бога прямо не назван. Перевод сохраняет местоимение, а вероятный референт поясняет в сноске.
- issue: Значение רַע в высказывании о божественном источнике
  choice: зло
  alternative: бедствие / несчастье / вред
  rationale: Рַע может обозначать как зло в широком смысле, так и переживаемое бедствие. Основной текст сохраняет широкий и богословски напряжённый вариант, не разрешая неоднозначность; более узкие значения приведены в сноске.
- issue: Расхождение еврейского и греческого свидетелей
  choice: следовать засвидетельствованной еврейской строке
  alternative: греческое чтение о даре Господа и Его благоволении
  rationale: Предоставленный еврейский источник имеет высокую уверенность и является первичным для данного проекта; существенное расхождение с греческой параллелью следует открыто отметить, а не смешивать тексты.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура и три пары противоположностей сохранены. Тире естественно вводит итоговое утверждение. Формулировка намеренно не смягчает רַע и не заменяет местоимение явным именем Бога.
