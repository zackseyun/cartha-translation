    rationale: אוֹרְבִים обозначает тех, кто подстерегает или устраивает засаду; глагол «подстерегают» сохраняет образ, не привязывая его к буквальному нахождению в засаде.
  - severity: low
    issue: Частица וְכֵן не выражена явно
    rationale: Простое «и» создаёт параллелизм, но «также» точнее отражает присоединительное значение וְכֵן.
