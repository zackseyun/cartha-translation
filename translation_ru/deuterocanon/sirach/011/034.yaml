base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/034.yaml
  text: Keep many out of your house[a], and do not bring every man into your home, for many lie in wait[b], and many are deceivers.
translation:
  language: ru
  text: Не допускай в свой дом многих[a] и не вводи туда всякого человека, ибо много тех, кто подстерегает, и также много обманщиков[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Основной текст следует еврейскому свидетельству. Греческий текст здесь читается иначе: «Посели у себя постороннего — и он ввергнет тебя в смятение и отдалит тебя от того, что принадлежит тебе». Вероятно, это иная форма текста или расширенный вариант предупреждения.'
    reason: alternative_reading
  - marker: b
    text: В указанном еврейском издании части этого стиха заключены в квадратные скобки, что указывает на реконструкцию или неуверенность, обусловленную состоянием сохранившихся рукописей.
    reason: textual_variant
lexical_decisions:
- source_word: מְנַע רַבִּים מִתּוֹךְ בֵּיתֶךָ
  choice: Не впускай многих в свой дом
  rationale: Императив מְנַע выражает недопущение или удержание вне дома. Русское «не впускай» естественно передаёт предупреждение об ограничении доступа, а «в свой дом» сохраняет домашний контекст.
- source_word: וְלֹא כָל אִישׁ לְהָבִיא אֶל בַּיִת
  choice: и не каждого человека вводи в дом
  rationale: Конструкция предостерегает от неразборчивого гостеприимства. «Не каждого человека» передаёт обобщённое אִישׁ естественным современным русским языком, не сужая смысл до лиц мужского пола.
- source_word: אוֹרְבִים
  choice: сидят в засаде
  rationale: Причастие обозначает людей, скрытно подстерегающих жертву. Выражение сохраняет конкретный образ засады и звучит по-русски естественнее, чем существительное «засадники».
- source_word: וְכֵן נוֹכְלִים רַבִּים הֵם
  choice: и многие — обманщики
  rationale: נוֹכְלִים обозначает коварных, лживых людей; «обманщики» сохраняет широкий смысл без неоправданного уточнения вида обмана. וְכֵן передано присоединительным «и» в параллельной конструкции.
- source_word: ἐνοίκισον ἀλλότριον ...
  choice: отражено в сноске как альтернативное чтение
  rationale: Греческий параллельный текст заметно отличается от еврейского и описывает последствия поселения постороннего; его следует сохранить как текстовый вариант, не вводя в основной перевод.
theological_decisions:
- issue: Обобщённое אִישׁ в наставлении
  choice: человек
  alternative: мужчина / всякий муж
  rationale: 'В данном контексте אִישׁ имеет обобщённое значение: речь идёт о любом допускаемом в дом лице. «Человек» сохраняет объём предупреждения и соответствует современному литературному русскому.'
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем наставления. Сохранены образ засады, повтор «многие» и предостерегающий тон; текстовые расхождения вынесены в сноски.
