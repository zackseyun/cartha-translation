review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл еврейского текста передан верно: предостережение против неразборчивого допуска людей в дом и мотивировка опасностью от подстерегающих и обманщиков сохранены. Однако «сидят в засаде» несколько сужает образ до буквальной засады; «подстерегают» точнее передаёт participium אוֹרְבִים. Вторая группа в еврейском тексте вводится также частицей וְכֵן, которую лучше явно отразить словом «также».'
  naturalness: Предлагаемая правка сохраняет краткий афористичный строй современного литературного русского. «Не допускай в свой дом многих» и «не вводи туда всякого человека» естественны, избегают неудачного повтора «в дом» и не меняют смысла.
  terminology: «Человек» оправданно передаёт обобщённое אִישׁ в русском наставительном контексте. «Обманщики» точно и нейтрально передаёт נוֹכְלִים. В сноске «посторонний» адекватно передаёт греч. ἀλλότριον; греческое чтение не следует переносить в основной текст.
