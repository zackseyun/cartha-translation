  text: The wisdom of the poor lifts up his head[a], and seats him among nobles.
translation:
  language: ru
  text: Мудрость бедняка поднимает его голову[a] и усаживает его среди знатных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедного», «незнатного» или «смиренного». В еврейском тексте — слово со значением «бедный, слабый, занимающий низкое положение»; греческая параллель допускает более широкий смысл: «смиренный, униженный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָכְמַת דַּל
  choice: Мудрость бедняка
  rationale: Сопряжённая конструкция буквально означает «мудрость бедного». «Бедняка» естественно передаёт конкретный социально-экономический смысл דַּל, не исключая оттенка низкого положения.
- source_word: תִּשָּׂא רֹאשׁוֹ
  choice: поднимает его голову
  rationale: Сохранён исходный образ возвышения и восстановления достоинства; греческая параллель также буквально говорит о поднятии головы.
- source_word: וּבֵין נְדִיבִים
  choice: среди знатных
  rationale: При множественном числе בֵּין естественно передаётся как «среди», а נְדִיבִים здесь обозначает людей высокого общественного положения, что подтверждает греческое μεγιστάνων.
- source_word: תּוֹשִׁיבֶנּוּ
  choice: усаживает его
  rationale: Порода hифиль глагола ישב означает «даёт сесть, помещает на место»; формулировка сохраняет образ почётного места в обществе.
theological_decisions:
- issue: Передавать ли דַּל как социальную бедность или как смирение и низкое положение
  choice: бедняка
  alternative: бедного, незнатного или смиренного человека
  rationale: Первичный еврейский текст наиболее прямо указывает на бедного или слабого человека. Греческое ταπεινοῦ расширяет возможный смысл до человека низкого положения или смиренного; эта неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого афористического строя и исходной метафоры «поднять голову». «Знатные» обозначает общественно влиятельных людей без излишне узкого монархического оттенка.
