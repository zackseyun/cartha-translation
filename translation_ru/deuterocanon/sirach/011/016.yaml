translation:
  language: ru
  text: Он высоко поднял его и возвеличил его[a][b], и многие дивились ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально еврейское выражение можно передать как «поднял на его голове». Вероятный образный смысл — поднял на высоту или возвёл на высокое положение.
    reason: lexical_alternative
  - marker: b
    text: Приведённый греческий текст этого стиха не соответствует данной еврейской строке; перевод следует сохранившемуся еврейскому свидетельству.
    reason: textual_variant
lexical_decisions:
- source_word: נָשָׂא בְּרֹאשׁוֹ
  choice: поднял его высоко
  rationale: Сочетание буквально содержит образ поднятия «на/к голове», но в данном поэтическом контексте, вероятнее всего, означает возведение на высоту или высокое положение. Русское «поднял его высоко» естественно передаёт движение вверх, не уточняя его как исключительно физическое или общественное.
- source_word: וַיְרֹמְמֵהוּ
  choice: и возвеличил его
  rationale: Глагол רומם означает «возвысить, вознести, возвеличить». «Возвеличил» сохраняет параллелизм, одновременно указывая на повышение достоинства или положения.
- source_word: וַיִּתְמְהוּ
  choice: дивились
  rationale: תמה выражает сильное удивление или изумление. «Дивились» здесь звучит кратко, достойно и естественно для поэтической библейской речи.
- source_word: עָלָיו
  choice: ему
  rationale: При глаголе удивления предлог על обозначает того, кто вызывает удивление; русское управление «дивились ему» передаёт это естественно.
- source_word: רַבִּים
  choice: многие
  rationale: Сохраняет неопределённое обозначение множества людей без добавления отсутствующего в еврейском тексте существительного.
theological_decisions:
- issue: В еврейском тексте подлежащее и лицо, к которому относится действие, прямо не названы
  choice: Сохранены местоимения «он» и «его» без отождествления действующего лица или объекта
  alternative: Назвать действующим лицом Бога или Господа либо считать его неназванным правителем
  rationale: Мужской род глаголов и суффиксов позволяет передать участников местоимениями, но контекст данной строки не даёт основания прямо назвать их. Перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Неявные участники действия не конкретизированы; параллелизм двух глаголов возвышения сохранён.
