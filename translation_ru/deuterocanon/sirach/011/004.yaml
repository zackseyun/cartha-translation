lexical_decisions:
- source_word: מַעֲטֶה אֹבֵד
  choice: бедняк
  rationale: Сочетание буквально допускает понимание «изношенная одежда / ветхий плащ», однако в данном контексте может метонимически обозначать бедного, жалкого на вид человека. Основной текст передаёт этот вероятный этический смысл, а предметное прочтение сохраняется в примечании.
- source_word: אַל תְּהַתֵּל
  choice: не глумись
  rationale: Глагол передаёт насмешку или издевательство; «не глумись» естественно и достойно выражает запрет презрительного отношения.
- source_word: תְּקַלֵּס
  choice: не восхваляй себя
  rationale: Порода piel выражает хвалу или прославление; возвратное дополнение следует из контекста параллельного предостережения. Формулировка сохраняет отличие от первого глагола.
- source_word: בִּמְרִירֵי יוֹם
  choice: в горькие дни
  rationale: Перевод следует сохранившемуся еврейскому тексту и удерживает образ дней горечи или бедствия, не подменяя его отличающимся греческим чтением.
theological_decisions:
- issue: Расхождение еврейского текста и греческой параллели
  choice: В основном тексте следовать краткому еврейскому двустишию.
  alternative: Греческая параллель говорит об одежде и дне славы, а затем добавляет объяснение о дивных и сокрытых делах Господа.
  rationale: Еврейское свидетельство сохранилось, имеет высокую уверенность и является первичным для перевода; существенное греческое разночтение необходимо честно представить в примечании, не смешивая две текстовые формы.
translation_notes:
  register: Современный литературный русский язык с краткой назидательной интонацией. «Глумись» сохраняет серьёзность мудростного наставления; «восхваляй себя» передаёт лексическую силу второго глагола и не сглаживает необычное сочетание с «горькими днями». Все маркеры примечаний присутствуют в основном тексте.
