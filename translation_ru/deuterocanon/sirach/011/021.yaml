translation:
  language: ru
  text: Иной богатеет через лишения[a], и это будет наградой, причитающейся ему[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через самоограничение», «через страдания» либо «от тяжкого труда». Еврейское выражение имеет широкий смысл; греческий параллельный текст говорит о труде и бедности.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский оборот труден; буквально, при неясном синтаксисе: «и это сделает его награду обязательной (или причитающейся)». Возможный смысл: «и это будет ему заслуженной наградой».'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  choice: Иной
  rationale: Естественное для русской литературы мудрости введение одного из возможных типов людей; передаёт экзистенциальную конструкцию без лишней тяжеловесности.
- source_word: מִתְעַשּׁר
  choice: богатеет
  rationale: Возвратная порода причастия обозначает процесс обретения богатства; несовершенный вид сохраняет наблюдение общего характера.
- source_word: מֵהִתְעַנּוֹת
  choice: через лишения
  rationale: Сохраняет широкий диапазон страдания, стеснённых обстоятельств и самоограничения, не сводя выражение ни к аскезе, ни только к труду.
- source_word: וְזֶה
  choice: и это
  rationale: Прямо передаёт союз и указательное местоимение, относящееся к только что описанному обогащению через лишения.
- source_word: יְחַיֵּב שְׂכָרוֹ
  choice: вменит ему награду
  rationale: Сохраняет необычную каузативно-юридическую силу трудного еврейского оборота и его неоднозначность, не превращая её безоговорочно в утверждение о личной заслуге.
theological_decisions:
- issue: Связь богатства, лишений и воздаяния в трудном заключительном обороте
  choice: «и это вменит ему награду»
  alternative: «и это — заслуженная им награда»; «и это будет ему наградой»
  rationale: Еврейское יְחַיֵּב שְׂכָרוֹ синтаксически сжато и допускает оттенки обязанности, вины или причитающегося воздаяния. Основной текст сохраняет напряжение и юридическую окраску глагола, а сноска поясняет вероятный смысл, не утверждая более сильного учения о заслуге, чем позволяет источник.
translation_notes:
  register: Современный литературный русский язык с краткой афористичностью книги Премудрости. «Лишения» понятно широкому читателю и не навязывает узко аскетического толкования; необычность заключительной фразы намеренно сохранена и разъяснена в сноске.
