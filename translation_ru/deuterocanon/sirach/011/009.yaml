base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/009.yaml
  text: My son[a], do not answer a matter before you hear it, and do not speak in the midst of conversation.
translation:
  language: ru
  text: Сын мой[a], не отвечай, пока не выслушаешь, и посреди разговора не говори.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Не спорь о деле, которое тебя не касается, и не участвуй в суде грешников». Сохранившиеся еврейская и греческая версии здесь существенно различаются; основной текст следует еврейскому свидетельству, а греческое чтение приведено как иной вариант текстовой традиции.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Еврейский текст содержит обращение к ученику в мужском роде и единственном числе; традиционный русский порядок слов звучит естественно и достойно.
- source_word: אַל תָּשִׁיב דָּבָר
  choice: не отвечай
  rationale: השיב означает «отвечать, давать ответ». В данном контексте דָּבָר обозначает содержание или предмет ответа; по-русски его необязательно выражать отдельным дополнением.
- source_word: טֶרֶם תִּשְׁמָע
  choice: пока не выслушаешь
  rationale: טֶרֶם указывает на действие, преждевременное по отношению к слушанию. «Пока не выслушаешь» естественно передаёт требование сначала услышать всё необходимое, не добавляя явно отсутствующего объекта.
- source_word: וּבְתוֹךְ שִׂיחָה
  choice: и посреди разговора
  rationale: שִׂיחָה означает речь, беседу или разговор. Перевод сохраняет неопределённость еврейского текста и не добавляет «чужой речи».
- source_word: אַל תְּדַבֵּר
  choice: не говори
  rationale: Прямое и естественное соответствие обычному еврейскому глаголу «говорить» в форме запрета.
- source_word: περὶ πράγματος οὗ οὐκ ἔστιν σοι χρεία μὴ ἔριζε, καὶ ἐν κρίσει ἁμαρτωλῶν μὴ σύνεδρευε
  choice: не принято в основном тексте
  rationale: Греческое чтение существенно расходится с сохранившимся еврейским свидетельством. При высокой уверенности в еврейском тексте оно приводится как самостоятельная текстовая традиция в сноске.
theological_decisions:
- issue: Существенное расхождение еврейской и греческой текстовых традиций
  choice: Основной текст следует сохранившемуся еврейскому свидетельству.
  alternative: 'Следовать греческому чтению: «Не спорь о деле, которое тебя не касается, и не участвуй в суде грешников».'
  rationale: Еврейское свидетельство доступно и оценено как надёжное; расхождение нельзя сглаживать или объединять, поэтому греческая форма сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с краткой, наставительной интонацией. Формулировка «посреди разговора» непосредственно передаёт еврейский текст и не уточняет без основания, что речь принадлежит другому человеку.
