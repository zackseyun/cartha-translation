  text: Сын мой[a], держись назначенного тебе удела и живи в нём[b], и состарься в своём деле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом свидетельстве: «Не говори: „У меня всего достаточно; какое же зло может отныне постигнуть меня?“» Сохранившийся здесь еврейский текст существенно отличается от греческой традиции.'
    reason: alternative_reading
  - marker: b
    text: 'Еврейское בְּחֻקֶּךָ имеет не вполне ясный смысл. Возможные значения: «в своём уделе», «в предписанной тебе сфере» или «по своему правилу (пути)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Мужское обращение в единственном числе сохраняет форму отцовского наставления.
- source_word: עֲמוֹד
  choice: держись
  rationale: Императив עמד здесь естественно передаёт стойкое пребывание и верность определённому пути, а не только буквальное стояние.
- source_word: בְּחֻקֶּךָ
  choice: назначенного тебе удела
  rationale: Трудное сочетание может обозначать установленную долю, предписанную сферу или правило. «Назначенный тебе удел» сохраняет идею данного человеку места, не сводя её исключительно к закону.
- source_word: וּבוֹ הִתְהַלֵּךְ
  choice: и следуй ему
  rationale: התהלך обозначает продолжающийся образ действий. «Следуй ему» естественно передаёт метафору хождения по назначенному пути и согласуется с мужским родом слова «удел».
- source_word: וּבִמְלָאכְתְּךָ
  choice: за своим трудом
  rationale: מלאכה означает работу, занятие или труд; оборот «за своим трудом» по-русски выражает постоянство в деле.
- source_word: הִתְיַשֶּׁן
  choice: состарься
  rationale: Форма передаёт достижение старости и длительное постоянство, а не изнеможение.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста с греческим свидетельством
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству.
  alternative: 'Перевести по греческому: «Не говори: „Я ни в чём не нуждаюсь; какое же зло может отныне постигнуть меня?“»'
  rationale: При наличии еврейского текста он служит основой перевода. Греческий вариант существенно иной и потому приведён в примечании как важное альтернативное свидетельство, без попытки искусственно согласовать обе формы текста.
- issue: Неоднозначность בְּחֻקֶּךָ
  choice: «назначенного тебе удела»
  alternative: «твоего установления», «предписанного тебе поприща», «своего пути»
  rationale: Выбранная формулировка сохраняет представление об установленной доле или сфере жизни, но примечание честно отмечает лексическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростного наставления. Синтаксис краток и афористичен; спорное место не истолковано чрезмерно уверенно, а его неоднозначность отражена в примечании.
