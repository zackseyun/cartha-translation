  yaml_path: translation/deuterocanon/sirach/011/032.yaml
  text: Before you examine a man[a], do not call him blessed[b], for a man will be called blessed in his end.
translation:
  language: ru
  text: Прежде чем исследовать человека, не называй его блаженным, ибо по его исходу[a] человека назовут блаженным.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в конце его жизни» или «по его конечному итогу». Еврейское слово может обозначать конец, исход или конечный результат.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст здесь существенно отличается: «От искры огня умножится груда углей, и грешный человек подстерегает ради крови». Это указывает на крупное расхождение между еврейской и греческой текстовыми традициями данного стиха.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּטֶרֶם תַּחְקֹר
  choice: Прежде чем исследовать
  rationale: Сохраняет временное значение בְּטֶרֶם и значение глагола חקר — тщательно исследовать, проверять; конструкция естественна для современного русского языка.
- source_word: אָדָם
  choice: человека
  rationale: В единственном числе обозначает отдельного человека в обобщённом изречении; русское «человек» точно передаёт смысл без ненужного сужения до лица мужского пола.
- source_word: אַל תְּאַשְּׁרֵהוּ
  choice: не называй его блаженным
  rationale: Передаёт каузативно-оценочное значение אשר в пиэле — признавать или провозглашать кого-либо блаженным — и позволяет сохранить повтор корня далее в стихе.
- source_word: בְּאַחֲרִיתוֹ
  choice: по его концу
  rationale: 'Сохраняет неоднозначность אַחֲרִית: конец жизни, конечный исход или итог; формулировка намеренно не сводит выражение только к смерти.'
- source_word: יְאֻשַּׁר
  choice: назовут блаженным
  rationale: Передаёт пассивную форму того же корня אשר и сохраняет значимый повтор с «не называй его блаженным».
theological_decisions:
- issue: Смысл «блаженным» в оценке человеческой жизни
  choice: блаженным
  alternative: счастливым / благополучным
  rationale: «Блаженным» сохраняет торжественную оценочную силу אשר и допускает как благополучие, так и более глубокую нравственно-религиозную оценку, не устраняя напряжение текста.
- issue: Значение אַחֲרִיתוֹ
  choice: по его концу
  alternative: по исходу его жизни / после его смерти
  rationale: Еврейское слово может указывать на конец, итог или конечную участь. Основной текст не ограничивает его исключительно моментом смерти.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Повтор «называй… назовут блаженным» намеренно сохраняет активную и пассивную формы одного еврейского корня. Оборот «по его концу» несколько возвышенный, но понятный и нужен для сохранения смысловой неоднозначности оригинала.
