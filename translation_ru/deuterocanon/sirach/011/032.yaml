- from: Прежде чем исследовать человека, не называй его блаженным, ибо лишь по его концу[a] человека назовут блаженным.[b]
  to: Прежде чем исследовать человека, не называй его блаженным, ибо по его исходу[a] человека назовут блаженным.[b]
