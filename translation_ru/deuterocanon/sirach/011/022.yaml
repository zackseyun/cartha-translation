  source_fidelity: 'Еврейский текст передаёт реплику в первом лице целиком: «Я обрёл покой, и теперь буду есть от моих благ». Черновик правильно сохраняет первое лицо, но оставляет незавершённую конструкцию после прямой речи: исходное «и когда он скажет» требует главного предложения, которого в еврейской строке нет и которое не следует добавлять без основания.'
  naturalness: «Вкушать свои блага» понятно, но несколько искусственно и может означать духовное приобщение; для материальных благ и глагола «есть» естественнее «буду пользоваться своими благами». Однако нужно сохранить эллиптический, незавершённый характер еврейской строки, а не подставлять повествовательное продолжение.
