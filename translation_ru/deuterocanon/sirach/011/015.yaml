base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/015.yaml
  text: And the eye of the Lord looked on him for good[c][b][a], and shook him out of the dust of filth.
translation:
  language: ru
  text: И око Господа взирало на него во благо[a], и Он вытряхнул его из смрадного праха[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «око Господа следило за ним с благоволением». Еврейское выражение соединяет образ внимательного Божьего взгляда с намерением принести благо.'
    reason: lexical_alternative
  - marker: b
    text: «Смрадный прах» можно также понять как «прах зловония» или «нечистый прах»; оттенок яркого еврейского образа не вполне ясен.
    reason: alternative_reading
  - marker: c
    text: 'Греческий текст этого стиха существенно иной: «Господь исторг корни народов и насадил смиренных вместо них». По-видимому, еврейская и греческая формы текста отражают разные текстовые традиции.'
    reason: textual_variant
lexical_decisions:
- source_word: וְעֵין יי
  choice: И око Господа
  rationale: Сохранён конкретный еврейский образ единственного «ока», обозначающий Божий взор и попечение. Сокращённое обозначение Божьего имени יי передано традиционным и понятным «Господа».
- source_word: צָפַתְהוּ לְטוֹב
  choice: взирало на него во благо
  rationale: Глагол передаёт наблюдение или внимательный взгляд, а לְטוֹב — благую направленность этого взгляда. Формулировка сохраняет как зрительный образ, так и оттенок благоволения, не сводя его однозначно к защите.
- source_word: וַיְנַעֲרֵהוּ
  choice: и Он вытряхнул его
  rationale: Глагол נער выражает встряхивание или вытряхивание. Образ сохранён, несмотря на его необычность; местоимение «Он» поясняет, что действующим лицом является Господь, поскольку еврейский глагол мужского рода не согласуется с существительным «око» женского рода.
- source_word: מֵעֲפַר צַחֲנָה
  choice: из смрадного праха
  rationale: עפר — «прах, пыль», а צחנה указывает на зловоние или нечистоту. «Смрадный прах» сохраняет резкость и некоторую смысловую неопределённость еврейского образа, не конкретизируя его как навозную кучу.
theological_decisions:
- issue: Передача сокращённого обозначения Божьего имени יי
  choice: Господа
  alternative: Яхве; ГОСПОДА
  rationale: В данном еврейском свидетеле употреблено благоговейное сокращение. «Господь» соответствует традиционной передаче Божьего имени и естественно звучит в русском тексте, не вводя конфессионально маркированного решения.
- issue: Направленность Божьего взгляда в выражении לְטוֹב
  choice: во благо
  alternative: благосклонно; ему на благо
  rationale: «Во благо» сохраняет богословски значимое напряжение между благосклонным взглядом и действием ради блага, не выбирая окончательно только одно из этих значений.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Слова «око» и «прах» сохраняют конкретность и достоинство исходного образа; необычный глагол «вытряхнул» намеренно удерживает резкую метафору еврейского текста.
