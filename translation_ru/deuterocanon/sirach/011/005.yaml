  text: For the works of the Lord are wondrous[b][a], and his work is hidden from man.
translation:
  language: ru
  text: Ибо дивны дела Господа[a], и Его деяние сокрыто от человека[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этого стиха существенно отличается: «Многие властители сидели на земле, а тот, о ком не помышляли, носил венец». По-видимому, еврейское и греческое свидетельства отражают здесь разные формы текста.'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «от человека»; еврейское слово употреблено в единственном числе в общем значении — о людях, или человечестве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלָאוֹת
  choice: дивны
  rationale: Передаёт значение необычайного, чудесного и сохраняет краткую именную конструкцию еврейского текста.
- source_word: מַעֲשֵׂי
  choice: дела
  rationale: Естественно обозначает действия и свершения Бога и сохраняет множественное число.
- source_word: יי
  choice: Господа
  rationale: Благоговейное написание Божественного имени передано традиционным русским титулом без попытки реконструировать произношение имени.
- source_word: וְנֶעְלָם
  choice: сокрыто
  rationale: Передаёт пассивное значение недоступности человеческому знанию; слово естественно для возвышенного, но понятного библейского регистра.
- source_word: מֵאָדָם
  choice: от человека
  rationale: Сохраняет единственное число родового אָדָם; по смыслу речь идёт о человеке вообще, то есть о людях.
- source_word: פָּעֳלוֹ
  choice: Его деяние
  rationale: Сохраняет переход от множественного «дела» к единственному числу и лексически различает близкие מַעֲשֵׂי и פָּעֳלוֹ.
theological_decisions:
- issue: Передача Божественного имени, записанного как יי
  choice: Господа
  alternative: ГОСПОДА; Яхве
  rationale: Форма יי является благоговейным обозначением Божественного имени. «Господа» соответствует русской библейской традиции и не утверждает конкретного произношения.
- issue: Родовое значение אָדָם
  choice: от человека
  alternative: от людей; от человечества
  rationale: Выбранный вариант сохраняет грамматическое единственное число и одновременно допускает обобщённое значение, не ограничивая смысл мужчиной.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Краткий параллелизм исходного текста сохранён; «дела» и «деяние» передают смену множественного и единственного числа.
