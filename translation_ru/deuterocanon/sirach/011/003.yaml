translation:
  language: ru
  text: Пчела мала среди летающих существ[a], но её плод — лучший из урожаев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди птиц». Еврейское слово может обозначать как птиц, так и летающих существ вообще. В греческом параллельном тексте вторая часть звучит: «а плод её — первый среди сладостей».'
    reason: Лексическая альтернатива и значимое расхождение между еврейским текстом и греческой параллелью.
lexical_decisions:
- source_word: אֱלִיל
  choice: мала
  rationale: В сочетании с בְּעוֹף и в соответствии с греческим μικρά слово обозначает малый размер; краткая форма естественна для русского изречения.
- source_word: בְּעוֹף
  choice: среди летающих созданий
  rationale: Еврейское עוף охватывает летающих существ шире, чем только птиц; перевод сохраняет эту широту и включает пчелу без смысловой шероховатости.
- source_word: דְּבֹרָה
  choice: пчела
  rationale: Прямое значение слова; обобщённое единственное число естественно для русского изречения.
- source_word: וְרֹאשׁ
  choice: но … лучший
  rationale: רֹאשׁ здесь выражает первенство или превосходство. Союз «но» передаёт подразумеваемое противопоставление между малостью пчелы и ценностью её плода.
- source_word: תְּנוּבוֹת
  choice: из урожаев
  rationale: תְּנוּבוֹת означает плоды земли, урожаи или произведения. «Урожаи» сохраняет конкретный образ еврейского текста и не добавляет отсутствующее в нём определение «сладкий».
- source_word: פּרִיָהּ
  choice: плод её
  rationale: Буквальный образ еврейского текста, подтверждаемый греческим ὁ καρπὸς αὐτῆς; речь подразумевает мёд, но метафору следует сохранить.
