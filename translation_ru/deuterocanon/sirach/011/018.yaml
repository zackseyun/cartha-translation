translation:
  language: ru
  text: Бывает, что человек богатеет благодаря рачительности и скупости, и это — доля его награды:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В предоставленной строке еврейских рукописей Каирской генизы здесь находится другое изречение: «Мудрость, разум и понимание дела — от Господа; грех и прямые пути — от Господа». Поскольку эта строка не соответствует греческому тексту Сир 11:18, основной перевод следует греческому свидетельству.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔστιν πλουτῶν
  choice: Бывает, что человек богатеет
  rationale: Оборот передаёт существование такого случая и процесс приобретения богатства; по-русски звучит естественно и не добавляет оценки.
- source_word: ἀπὸ προσοχῆς
  choice: благодаря рачительности
  rationale: προσοχή обозначает внимательность и тщательность. «Рачительность» передаёт хозяйственную старательность и сохраняет отличие от следующей за ней отрицательно окрашенной «скупости».
- source_word: καὶ σφιγγίας αὐτοῦ
  choice: и скупости
  rationale: σφιγγία означает чрезмерную бережливость, стеснённость в расходах; «скупость» ясно и современно передаёт отрицательную окраску.
- source_word: καὶ αὕτη ἡ μερὶς
  choice: и вот доля
  rationale: μερὶς — «доля», «часть»; «вот» естественно вводит последующее описание доставшегося человеку результата.
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: его награды
  rationale: μισθός может означать плату или воздаяние. «Награда» сохраняет формулировку текста и не навязывает образ наёмного труда.
theological_decisions:
- issue: Расхождение предоставленного еврейского текста с греческим свидетельством Сир 11:18
  choice: Основной текст переведён по греческому параллельному свидетельству, а еврейское разночтение полностью приведено в сноске.
  alternative: 'Перевести в основном тексте предоставленную еврейскую строку: «Мудрость, разум и понимание дела — от Господа; грех и прямые пути — от Господа».'
  rationale: Предоставленная еврейская строка не соответствует греческому тексту Сир 11:18 и, по-видимому, представляет иное изречение. Греческое свидетельство даёт связный текст данного стиха; расхождение нельзя ни скрывать, ни устранять богословским истолкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. «Рачительность» несколько книжное, но понятное слово, точно противопоставляющее хозяйственную тщательность скупости. Двоеточие сохранено, поскольку стих синтаксически подводит к продолжению.
