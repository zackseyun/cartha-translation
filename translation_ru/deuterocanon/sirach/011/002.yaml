  text: Do not praise a man for his appearance[a], and do not despise a man who is ugly in his looks.
translation:
  language: ru
  text: Не хвали человека за его внешность[a] и не гнушайся человеком, неприглядным на вид.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Не хвали мужчину за его красоту и не гнушайся человеком из-за его внешности». В первой части еврейское слово имеет более широкое значение — «внешность, облик», тогда как греческое слово означает «красота».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תְּהַלֵּלו
  choice: Не хвали
  rationale: Пиэль глагола הלל означает «хвалить, превозносить»; «не хвали» естественно и точно передаёт запрет.
- source_word: אָדָם
  choice: человека
  rationale: В обоих полустишиях речь идёт об отдельном человеке; русское «человек» сохраняет обобщённый смысл без ненужного уточнения пола.
- source_word: בְּתָאֳרוֹ
  choice: за его внешность
  rationale: תֹּאַר обозначает наружный вид, облик. Предлог «за» естественно выражает основание похвалы; «внешность» сохраняет более широкий смысл еврейского слова, в отличие от греческого «красота».
- source_word: וְאַל תְּתַעֵב
  choice: и не гнушайся
  rationale: תעב выражает сильное отвращение или неприятие. «Не гнушайся» передаёт эту силу точнее, чем более слабое «не презирай».
- source_word: מְכוֹעָר
  choice: неприглядным
  rationale: Слово означает «некрасивый, безобразный, неприглядный». «Неприглядный» прямо относится к наружности, но не привносит идеи физического уродства.
- source_word: בְּמַרְאֵהוּ
  choice: на вид
  rationale: מַרְאֶה обозначает видимую наружность; русское выражение «на вид» естественно сохраняет конкретную зрительную направленность.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой назидательной формой. «Гнушайся» несколько возвышенно, но остаётся понятным и передаёт сильное значение еврейского глагола; «неприглядным на вид» звучит естественно и не усиливает текст до значения физического уродства.
