  text: Stand by your covenant and attend to it, and grow old in your work.[a]
translation:
  language: ru
  text: Дар праведника устоит для боящихся его, и его благоволение будет действенно вовеки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое свидетельство существенно отличается: «Стой в своём завете, занимайся им и состарься в своём деле». Еврейское רְצוֹנוֹ может также означать «его воля» или «его желание».'
    reason: alternative_reading
lexical_decisions:
- source_word: מַתַּן צַדִּיק
  choice: дар праведного
  rationale: מַתַּן означает «дар, даяние», а צַדִּיק здесь естественно понимать как субстантивированное «праведный». Перевод сохраняет конструкцию и не уточняет сверх текста, кто именно является праведным.
- source_word: יַעֲמֹד
  choice: сохранится
  rationale: Глагол עמד буквально означает «стоять», а в данном контексте — оставаться, быть прочным, сохраняться. «Сохранится» естественно передаёт продолжительность действия в современном русском языке.
- source_word: לִירֵאָיו
  choice: для тех, кто боится его
  rationale: Форма обозначает «для боящихся его». Развёрнутая конструкция понятнее современному читателю и сохраняет местоименную неоднозначность еврейского текста.
- source_word: רְצוֹנוֹ
  choice: воля его
  rationale: רצון может означать волю, желание или благоволение. «Воля» позволяет не сводить смысл исключительно к чувству расположения и сочетается с последующим глаголом исполнения.
- source_word: יִצְלַח לָעַד
  choice: исполнится навеки
  rationale: צלח выражает успех, осуществление или преуспевание, а לָעַד — неограниченную длительность. В сочетании с «волей» естественный русский эквивалент — «исполнится навеки».
theological_decisions:
- issue: Существенное расхождение еврейского и греческого свидетелей
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству высокой степени надёжности.
  alternative: 'Греческий текст: «Стой в своём завете, занимайся им и состарься в своём деле».'
  rationale: Задание требует прежде всего переводить по оригинально-языковому источнику. Здесь дан уверенно засвидетельствованный еврейский текст, поэтому именно он положен в основу; несводимое к нему греческое чтение сохранено в примечании.
- issue: Референт местоимения «его»
  choice: Местоимение оставлено без поясняющей подстановки существительного.
  alternative: Явно отнести местоимение к праведному человеку или к Богу.
  rationale: Еврейская форма сама не повторяет референт. Уточнение в основном тексте преждевременно устранило бы возможную смысловую напряжённость.
- issue: Значение רְצוֹנוֹ
  choice: «воля его»
  alternative: «его благоволение»
  rationale: Оба значения лексически возможны. «Воля» лучше образует цельную русскую фразу с יִצְלַח, но вариант «благоволение» отмечен как реальная смысловая возможность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Навеки» и порядок слов «воля его» поддерживают достоинство изложения, не делая его архаичным. Основной текст следует еврейскому источнику; греческое расхождение раскрыто в примечании.
