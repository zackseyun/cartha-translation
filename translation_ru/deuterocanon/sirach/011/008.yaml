translation:
  language: ru
  text: Пока не исследуешь дело, не искажай его[a]; сначала всё проверь, а затем упрекни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол может буквально означать «искривлять», «извращать» или «представлять в ложном виде»; здесь речь может идти о преждевременном искажении дела или несправедливом суждении о нём.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская формулировка в конце стиха трудна. В греческом тексте весь стих читается иначе: «Прежде чем выслушать, не отвечай и посреди речи не вмешивайся».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם תַּחְקוֹר
  choice: Прежде чем исследовать
  rationale: חקר означает тщательное разыскание, исследование или выяснение. Инфинитивная конструкция естественна по-русски и сохраняет временную последовательность еврейского текста.
- source_word: אַל תְּסַלֵּף
  choice: не искажай
  rationale: Сלף буквально связано с искривлением, искажением или извращением. Прямой перевод сохраняет образ и не сводит неоднозначное предостережение исключительно к поиску недостатков или осуждению.
- source_word: בַּקֵּר לְפָנִים
  choice: сперва разберись
  rationale: בקר здесь призывает предварительно проверить или рассмотреть дело, а לְפָנִים указывает на первоочередность. «Разберись» звучит естественно и передаёт требование выяснить обстоятельства.
- source_word: וְאַחַר תַּזִּיף
  choice: а потом упрекни
  rationale: Форма תַּזִּיף трудна текстуально и лексически. В данном еврейском параллелизме «упрекни» правдоподобно обозначает критическую реакцию, допустимую лишь после проверки; неопределённость и греческое чтение отмечены в сноске.
theological_decisions:
- issue: Характер предписанной реакции после выяснения обстоятельств
  choice: упрекни
  alternative: ответь / вмешайся в речь
  rationale: Еврейский текст допускает понимание заключительного глагола как порицания после расследования, тогда как греческая традиция представляет иной совет о слушании и невмешательстве. Основной текст следует засвидетельствованному еврейскому чтению, не скрывая греческого варианта.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим ритмом текста премудрости. «Разберись» — общеупотребительное, но не разговорно-сниженное слово; оно ясно выражает необходимость предварительно выяснить обстоятельства. Пунктуация сохраняет двучленную последовательность наставления.
