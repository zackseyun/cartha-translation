  text: Before death, do not call a man blessed, for in his end a man is made known.
translation:
  language: ru
  text: До смерти не называй человека блаженным[b], ведь в конце человек познаётся.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь читается совершенно иначе: «Берегись злодея, ибо он замышляет зло, как бы он не навлёк на тебя вечный позор». Вероятно, это иная форма текста; в основном тексте принят сохранившийся еврейский вариант.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «не провозглашай человека счастливым (удачливым)».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в конце человек становится узнаваемым»; «по исходу человека узнают». Еврейское выражение может указывать как на конец жизни, так и на окончательный итог.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי מָוֶת
  choice: До смерти
  rationale: Кратко и прямо передаёт временное значение еврейского оборота и предостережение не выносить окончательной оценки преждевременно.
- source_word: אַל תְּאַשֶּׁר
  choice: не называй ... блаженным
  rationale: 'Глагол אשר здесь имеет декларативно-оценочное значение: называть или провозглашать кого-либо блаженным, счастливым. «Блаженным» сохраняет характерный для литературы мудрости оттенок.'
- source_word: גָּבֶר
  choice: человека
  rationale: В данном изречении существительное мужского рода употреблено обобщённо. Русское «человек» естественно сохраняет единственное число и универсальную применимость сентенции.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание запрета и естественно звучит в современном русском афористическом высказывании.
- source_word: בְּאַחֲרִיתוֹ
  choice: по своему концу
  rationale: אַחֲרִית обозначает конец, исход или конечный итог. Оборот «по своему концу» сохраняет как временной, так и оценочный оттенок, не сводя смысл исключительно к моменту смерти.
- source_word: יִנָּכֵר
  choice: познаётся
  rationale: Пассивная форма от נכר допускает значения «быть узнанным», «оказаться распознанным», «стать явным». «Познаётся» кратко и естественно выражает мысль, что подлинная оценка человека определяется лишь в итоге.
- source_word: אִישׁ
  choice: человек
  rationale: Передаёт обобщённое единственное число и поддерживает повтор существительного в обеих частях еврейской сентенции.
theological_decisions:
- issue: Обобщённые существительные мужского рода в еврейской литературе мудрости
  choice: Передать גבר и איש словом «человек»
  alternative: «муж» или «мужчина»
  rationale: Еврейские формы грамматически мужского рода, но сентенция имеет универсальную применимость. Русское «человек» не устраняет грамматическое число и род искусственно и не сужает смысл до лиц мужского пола.
- issue: Смысл заключительной части
  choice: «человек познаётся по своему концу»
  alternative: «в конце человек становится известен»; «в своём конце человек узнаётся»
  rationale: Перевод сохраняет напряжение между концом жизни и окончательным исходом человека. Он не уточняет, идёт ли речь исключительно о характере, судьбе или нравственной оценке.
- issue: Существенно отличающееся греческое чтение
  choice: Следовать сохранившемуся еврейскому тексту, отметив греческий вариант в сноске
  alternative: 'Перевести греческое чтение: «Берегись злодея...»'
  rationale: Для Сираха сохранившийся еврейский свидетель является первичным здесь; греческий текст, вероятно, представляет иную текстовую форму и потому должен быть доступен читателю как вариант, а не подменять основной текст.
translation_notes:
  register: Современный литературный русский язык с кратким, афористическим строем изречения мудрости. «Блаженным» несколько возвышенно, но понятно и уместно для библейской литературы; синтаксис остаётся естественным для современного читателя.
