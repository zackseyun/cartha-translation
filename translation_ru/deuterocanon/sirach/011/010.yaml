translation:
  language: ru
  text: Не вступай в спор без причины[a] и не ввязывайся в распрю надменных.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение еврейского слова עַצָּבָה здесь не вполне ясно: оно может обозначать боль, огорчение, беду, обиду или повод для спора. В переводе оно понято как отсутствие достаточной причины для конфликта.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст здесь существенно отличается: «Дитя, пусть твои занятия не будут слишком многочисленны; если умножишь их, не будешь оправдан; если будешь гнаться, не настигнешь, и, убегая, не спасёшься». Вероятно, это чтение восходит к иной еврейской текстовой основе или отражает значительное расхождение в передаче текста.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֵין עַצָּבָה
  choice: без причины
  rationale: Оборот בְּאֵין обозначает отсутствие чего-либо, а многозначное עַצָּבָה в контексте спора, вероятно, указывает на обиду, повод или основание для конфликта. «Без причины» естественно передаёт практический смысл, не скрывая лексической неопределённости, отмеченной в сноске.
- source_word: אַל תִּתְחָר
  choice: не вступай в спор
  rationale: Форма связана с идеей разгорячаться или ввязываться в соперничество и распрю. В данном контексте «не вступай в спор» ясно и естественно выражает запрет.
- source_word: וּבְרִיב
  choice: в распре
  rationale: רִיב означает спор, тяжбу или распрю. «Распря» позволяет отличить вторую строку от первого «спора» и сохраняет серьёзный, афористичный регистр.
- source_word: זֵדִים
  choice: надменных
  rationale: זֵדִים обозначает дерзких, самонадеянных, высокомерных людей. «Надменные» — понятная современная характеристика с нужной нравственной окраской.
- source_word: אַל תְּקוֹמֵם
  choice: не восставай
  rationale: Глагол от קום сохраняет образ вставания или выступления. «Не восставай в распре» передаёт этот образ, хотя контекстуально возможно понимание «не ввязывайся»; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Основное текстуальное свидетельство и роль греческой параллели
  choice: Перевод следует сохранившемуся еврейскому тексту; резко отличающееся греческое чтение приводится в сноске.
  alternative: 'Следовать греческому тексту: «Дитя, пусть твои занятия не охватывают многого…»'
  rationale: При наличии еврейского текста Сираха он служит основой перевода. Греческая версия здесь представляет существенно иной текст и, вероятно, восходит к другой еврейской основе либо отражает значительное текстовое расхождение.
- issue: Смысл запрета אַל תְּקוֹמֵם
  choice: Сохранить образное «не восставай», не уточняя окончательно характер участия в распре.
  alternative: 'Передать толковательно: «не ввязывайся» или «не выступай против них».'
  rationale: Еврейский глагол допускает образ вставания, выступления или вступления в конфликт. Буквально-естественная формулировка сохраняет напряжение между этими оттенками и не навязывает конкретный сценарий.
translation_notes:
  register: Современный литературный русский язык с кратким назидательным ритмом. «Распря» несколько возвышенно, но общеупотребительно и уместно для афористической премудростной речи; синтаксис остаётся ясным для современного читателя.
