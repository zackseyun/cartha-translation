  text: Do not say[a], “I have enough before me; what disaster will come upon me?”
translation:
  language: ru
  text: 'Не говори[a]: «Мне достаточно того, что передо мной; какое бедствие постигнет меня?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Не вводи всякого человека в свой дом, потому что много засад у коварного». Это существенно иная текстовая форма данного стиха.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Не говори
  rationale: Прямо передаёт отрицательное повеление с глаголом אמר, не заменяя речь более толковательным «не думай».
- source_word: דַּיִּי
  choice: Мне достаточно
  rationale: Передаёт значение достаточности у די и естественно звучит по-русски, не смещая смысл к субъективному довольству.
- source_word: לְפָנַי
  choice: того, что передо мной
  rationale: Сохраняет еврейский образ имеющегося перед человеком; добавление «того, что» необходимо для естественной русской синтаксической связи.
- source_word: מַה אָסוֹן
  choice: какое бедствие
  rationale: «Бедствие» передаёт серьёзность אָסוֹן точнее, чем более широкое «вред».
- source_word: יְהִי עָלָי
  choice: постигнет меня
  rationale: Естественный современный русский эквивалент буквального «будет на мне»; будущее время сохраняет форму и самоуверенный характер риторического вопроса.
- source_word: Μὴ πάντα ἄνθρωπον εἴσαγε εἰς τὸν οἶκόν σου· πολλὰ γὰρ τὰ ἔνεδρα τοῦ δολίου
  choice: не включено в основной текст
  rationale: Греческий текст представляет существенно иную форму стиха, поэтому его нельзя объединять с сохранившимся еврейским чтением; он приводится в сноске.
theological_decisions:
- issue: Расхождение еврейской и греческой форм Сир 11:29
  choice: Основной текст переведён по сохранившемуся еврейскому чтению, греческое дано в сноске.
  alternative: 'Следовать греческому тексту: «Не вводи всякого человека в свой дом, потому что много засад у коварного».'
  rationale: Еврейский источник здесь сохранился и оценён как надёжный; существенно отличающееся греческое чтение важно для истории текста, но не должно подменять или смешивать еврейскую форму стиха.
translation_notes:
  register: Современный литературный русский язык; наставительный тон краток и достоин. Формулировка сохраняет образ имеющегося «перед» человеком и не добавляет модального оттенка возможности в риторический вопрос.
