  text: The blessing of God is the lot of the righteous[b][a], and in the time of his hope it will blossom.
translation:
  language: ru
  text: Благословение Бога — удел праведника, и в пору его надежды оно расцветёт.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «Благословение Бога — удел праведника, и в пору его надежды оно расцветёт». Греческий текст существенно отличается: «Бедственный час заставляет забыть о роскоши, а при кончине человека открываются его дела». Вероятно, здесь представлены разные текстовые традиции.'
    reason: textual_variant
  - marker: b
    text: 'Или: «его надежда расцветёт». Еврейскую фразу можно понять и так, что расцветает благословение, и так, что расцветает надежда праведника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּת אֵל
  choice: Благословение Бога
  rationale: Конструктивная цепочка буквально обозначает Божье благословение; определённая форма естественно выражает общее изречение.
- source_word: גּוֹרָל
  choice: удел
  rationale: Сохраняет значение назначенной доли, но в современном русском звучит естественнее буквального «жребий» и не переосмысляет слово как предопределённую судьбу.
- source_word: צַדִּיק
  choice: праведника
  rationale: Субстантивированное прилагательное обозначает представителя нравственной категории; единственное число соответствует еврейскому тексту.
- source_word: וּבְעֵת תִּקְוָתוֹ
  choice: и в пору его надежды
  rationale: «В пору» передаёт явное временное выражение и остаётся литературным и понятным; «его надежды» сохраняет притяжательный суффикс и смысловую открытость תקוה.
- source_word: תִּפְרָח
  choice: оно расцветёт
  rationale: Глагол сохраняет образ цветения. Местоимение среднего рода грамматически естественно отсылает к «благословению», тогда как примечание отмечает возможную связь с надеждой.
theological_decisions:
- issue: К чему относится תִּפְרָח («расцветёт»)
  choice: В основном тексте «оно» естественнее всего относится к Божьему благословению.
  alternative: 'Можно понимать: «его надежда расцветёт».'
  rationale: Еврейская фраза допускает обе смысловые связи. Перевод следует наиболее естественному антецеденту, а примечание сохраняет подлинную неоднозначность.
- issue: Резкое расхождение еврейского и греческого текстов
  choice: Основным принят засвидетельствованный еврейский текст.
  alternative: Греческая традиция говорит о бедственном часе, забвении роскоши и раскрытии дел человека при его кончине.
  rationale: Согласно заданной текстологической политике еврейское свидетельство первично, но существенно иной греческий параллельный текст необходимо отметить как признак расходящихся текстовых традиций.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического изречения. «Удел» сохраняет метафору назначенной доли без архаичного оттенка «жребия»; «в пору» звучит естественно и удерживает временную формулу оригинала.
