lexical_decisions:
- source_word: שִׂכְלוּת
  choice: безрассудство
  rationale: Передаёт глупость как нравственно порочное состояние или поведение в контексте литературы мудрости; звучит естественнее и весомее, чем «глупость».
- source_word: וְחֹשֶׁךְ
  choice: и тьма
  rationale: Сохраняет конкретный еврейский образ и его возможные нравственные и бедственные оттенки, не устраняя многозначности.
- source_word: לְפוֹשְׁעִים
  choice: преступающим
  rationale: Причастная форма передаёт людей, сознательно нарушающих должное или восстающих против него, не сужая смысл до юридического обозначения «преступники».
- source_word: נוֹצְרָה
  choice: уготованы
  rationale: Передаёт пассивное значение сохранения или приготовления чего-либо для будущей участи; во множественном числе согласуется с двумя однородными подлежащими по нормам русского языка.
- source_word: וּמְרֵעִים
  choice: с теми, кто творит зло
  rationale: Сохраняет деятельный смысл причастия и позволяет воспроизвести корневую связь со словом רָעָה.
- source_word: רָעָה
  choice: зло
  rationale: Сохраняет намеренную игру однокоренных слов и двусмысленность между нравственным злом и бедствием или несчастьем.
- source_word: עִמָּם
  choice: пребывает с ними
  rationale: «С» прямо передаёт עם, а глагол «пребывает» делает краткую именную конструкцию естественной по-русски, сохраняя мысль о сопутствующем зле.
theological_decisions:
- issue: Резкое расхождение сохранившегося еврейского текста с греческой традицией
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству Кааны.
  alternative: 'Следовать греческому параллельному тексту: «Когда он говорит: “Я обрёл покой и теперь стану есть от моих благ”, он не знает, сколько времени пройдёт; он оставит их другим и умрёт».'
  rationale: Еврейское свидетельство имеет высокий уровень уверенности и в данном проекте обладает приоритетом там, где оно сохранилось. Существенно отличающееся греческое чтение дано в сноске, чтобы открыто показать текстологическое расхождение, а не смешивать две традиции.
translation_notes:
  register: Современный литературный русский язык с достоинством, подобающим книге Премудрости. Сохранены лаконизм, параллелизм и корневая связь между «творит зло» и «зло»; богословски значимая двусмысленность слова רָעָה не устранена.
