lexical_decisions:
- source_word: יֵשׁ
  choice: Бывает, человек
  rationale: Экзистенциальная конструкция вводит обобщённый образ человека; такой оборот естественен для русского изречения и не сужает смысл до конкретного лица.
- source_word: עָמֵל
  choice: трудится
  rationale: Передаёт напряжённый труд и сохраняет глагольную форму описания.
- source_word: וְיָגֵעַ
  choice: изнуряет себя
  rationale: Сохраняет усиление после «трудится» и передаёт связанную с корнем יגע усталость от тяжёлых усилий.
- source_word: וָרָץ
  choice: спешит
  rationale: Буквально «бежит»; в контексте мудрого изречения речь, вероятнее всего, о торопливой, напряжённой деятельности.
- source_word: וּכְדֵי כֵן
  choice: но от этого лишь
  rationale: 'Трудный оборот передан как ироническое противопоставление и усиление результата: несмотря на усилия, продвижения нет. Неоднозначность текста отмечена в сноске через указание существенно иной греческой традиции.'
- source_word: הוּא מִתְאַחֵר
  choice: отстаёт
  rationale: Возвратная форма от אחר означает задерживаться, запаздывать или отставать; «отстаёт» естественно выражает контраст со спешкой.
