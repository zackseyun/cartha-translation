  text: My son[a], if you do not run, you will not attain; and if you do not seek, you will not find.
translation:
  language: ru
  text: Сын мой[a], если не побежишь — не достигнешь, и если не будешь искать — не найдёшь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое свидетельство здесь существенно отличается: в нём говорится о человеке медлительном, слабом и бедном, на которого Господь взирает во благо и которого поднимает из унижения. Поэтому основной текст следует еврейскому свидетельству, а греческое чтение отмечено как значительная альтернативная текстовая традиция.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Звательная форма существительного «сын» с суффиксом первого лица единственного числа; сохраняет мужской род и традиционный тон наставления в литературе мудрости.
- source_word: תָּרוּץ
  choice: побежишь
  rationale: Глагол רוץ буквально означает «бежать». Конкретный образ деятельного усилия сохранён без истолковывающей замены на «постараешься» или «поспешишь».
- source_word: תגִּיעַ
  choice: достигнешь
  rationale: Передаёт значение достижения цели и естественно сочетается с образом бега; при этом не сужает смысл до пространственного прибытия.
- source_word: תְּבַקֵּשׁ
  choice: будешь искать
  rationale: Обычное значение בקש — «искать»; форма с «будешь» естественно выражает условное будущее и поддерживает параллелизм.
- source_word: תִמְצָא
  choice: найдёшь
  rationale: Стандартное соответствие для מצא; сохраняет ясную и устойчивую пару «искать — найти».
theological_decisions:
- issue: Обращение к ученику с указанием рода
  choice: Сын мой
  alternative: Дитя моё
  rationale: Еврейский текст прямо употребляет форму мужского рода единственного числа. Её сохранение передаёт конкретную форму обращения и наставнический тон, не превращая её без текстовых оснований в гендерно-нейтральную.
- issue: Выбор основного текстового свидетельства при существенном расхождении с греческим
  choice: Непосредственно перевести сохранившийся еврейский афоризм, а расхождение греческой традиции отметить в сноске.
  alternative: Следовать греческому тексту о слабом и бедном человеке, которого Господь возвышает из унижения.
  rationale: Доступное еврейское свидетельство содержит связный параллельный афоризм и принимается здесь за основной текст. Существенно иной греческий вариант не смешивается с ним, но сохраняется в примечании как важная альтернативная текстовая традиция.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и афористичным звучанием. Будущие формы с отрицанием естественно передают условную конструкцию еврейского текста; тире подчёркивают причинно-следственный параллелизм.
