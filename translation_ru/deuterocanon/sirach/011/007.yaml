  rationale: 'Исправлено единственное смысловое добавление: «жестоко» заменено на «глубоко», чтобы передать усиление מְאֹד без невыраженного оттенка жестокого обращения. Начало уточнено для ясности русской фразы. Идиома «отданы в руку» остаётся переданной смысловым, естественным для современного русского языка оборотом «отданы во власть других». Примечание сохраняет альтернативное греческое чтение и его привязку [a].'
