base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/011/007.yaml
  text: Many who were exalted have been greatly disgraced[a], and brought low together; even the honored have been given into another's hand.
translation:
  language: ru
  text: Многие из возвышенных были глубоко унижены и все вместе низведены; даже почитаемые были отданы во власть других.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь существенно иное чтение: «Прежде чем исследуешь, не порицай; сначала разберись, а затем обличай». Основной перевод следует сохранившемуся еврейскому тексту.'
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים
  choice: Многие
  rationale: Субстантивированное количественное слово; по-русски не требует добавления «люди».
- source_word: נִשָּׂאִים
  choice: возвышенные
  rationale: Обозначает людей высокого положения, а не буквальное физическое поднятие.
- source_word: נִקְלוּ מְאֹד
  choice: были жестоко унижены
  rationale: Передаёт утрату чести и крайнюю степень унижения; «жестоко» естественно выражает усиление מְאֹד в данном контексте.
- source_word: וְהִשְׁפִּלוּ
  choice: низведены
  rationale: Форма еврейского текста сжата и допускает грамматическую трудность; перевод сохраняет контекстуальный смысл понижения и падения прежнего статуса.
- source_word: יַחַד
  choice: все вместе
  rationale: Передаёт коллективный смысл наречия, не уточняя, было ли действие строго одновременным.
- source_word: וְגַם נִכְבָּדִים
  choice: даже почитаемые
  rationale: «Даже» сохраняет усилительную силу сочетания וְגַם, а «почитаемые» выражает высокий общественный статус без сужения до наследственной знати.
- source_word: נִתְּנוּ בְיָד
  choice: были отданы в чужую власть
  rationale: Еврейская идиома означает передачу под власть или контроль другого; смысловой перевод естественнее буквального «в руку».
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста с греческим параллельным чтением
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству.
  alternative: 'Греческое чтение: «Прежде чем исследуешь, не порицай; сначала разберись, а затем обличай».'
  rationale: При наличии еврейского текста Сираха он имеет первенство; греческая версия здесь представляет существенно иную текстовую форму и потому приводится в примечании, но не подменяет основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством афористической премудрости. Социальная перемена выражена ясно, без архаичного буквального оборота «отданы в руку»; точка с запятой сохраняет двухчастное строение изречения.
