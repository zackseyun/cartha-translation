    reason: alternative_reading
lexical_decisions:
- source_word: בְּפֶה חָכָם
  choice: устами мудреца
  rationale: Передаёт инструментальное значение בְּ и сохраняет еврейский образ речи, исходящей из уст мудрого человека; единственное число имеет обобщающий смысл.
- source_word: תֵּאָמֵר
  choice: произносится
  rationale: Нифаль имперфекта в изречении передан настоящим временем общей закономерности; пассивная форма исходного текста сохранена.
- source_word: תְּהִלָּה
  choice: хвала
  rationale: Основное значение существительного здесь — «хвала»; его подтверждает греческое αἶνος. Объект хвалы в еврейском тексте не назван.
- source_word: וּמשֵׁל בָּהּ
  choice: и тот, кто владеет ею
  rationale: משל передаёт власть или обладание; «владеет» естественно по-русски и сохраняет идею овладения, не уточняя сверх текста, идёт ли речь о хвале, мудрости или искусстве речи.
- source_word: יִלַמְּדֶנָּה
  choice: научит ей
  rationale: Глагол למד означает «учить», а суффикс женского рода отсылает к не вполне явно определённому женскому антецеденту. Русское местоимение сохраняет сжатость и некоторую неоднозначность еврейской фразы.
theological_decisions:
- issue: Расхождение второй части еврейского текста и греческой параллели
  choice: 'Следовать сохранившемуся еврейскому чтению: «и тот, кто владеет ею, научит ей»'
  alternative: 'Греческая параллель: «и Господь даст ему (или ей) преуспеть»'
  rationale: Еврейский текст этого стиха сохранился, имеет высокую степень надёжности и служит основным источником. Существенно отличающееся греческое чтение отмечено в сноске, а не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Синтаксис остаётся кратким и афористичным; необычная смысловая сжатость второй части сохранена без конфессионального истолкования.
