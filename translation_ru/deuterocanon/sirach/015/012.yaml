lexical_decisions:
- source_word: פֶּן תֹּאמַר
  choice: Не говори
  rationale: В наставлении פֶּן с формой глагола выражает предостережение или запрет. «Не говори» естественно передаёт эту силу по-русски.
- source_word: הוּא
  choice: Он
  rationale: Местоимение относится к Богу по контексту; перевод сохраняет местоименную форму исходного текста, не подставляя имя прямо в стих.
- source_word: הִתְקִילָנִי
  choice: заставил меня споткнуться
  rationale: Еврейское слово передаёт причинение преткновения. Перевод сохраняет конкретную метафору и не заменяет её более широким греческим смыслом «ввёл меня в заблуждение».
- source_word: כִּי
  choice: ведь
  rationale: «Ведь» естественно вводит обоснование предшествующего запрета и сохраняет причинно-пояснительную связь.
- source_word: אֵין צֹרֶךְ
  choice: ему не нужны
  rationale: Эта формулировка ясно и идиоматично передаёт отсутствие нужды при подразумеваемом субъекте — Боге.
- source_word: אַנְשֵׁי חָמָס
  choice: люди насилия
  rationale: חָמָס обозначает насилие или насильственное злодеяние. «Люди насилия» сохраняет более конкретный смысл еврейского текста, не обобщая его до «грешников».
theological_decisions:
- issue: Следует ли передать действие Бога по еврейскому тексту или по более широкому греческому параллельному чтению
  choice: «Он заставил меня споткнуться»
  alternative: «Он ввёл меня в заблуждение»
  rationale: Сохранившийся еврейский текст имеет высокую степень надёжности и потому определяет основной перевод. Греческое чтение отражает значимое расширение смысла и отмечено в сноске.
- issue: Следует ли перевести חָמָס конкретно как насилие или обобщить под влиянием греческого «грешный человек»
  choice: «люди насилия»
  alternative: «грешник» / «грешные люди»
  rationale: Еврейское выражение конкретно называет людей, связанных с насилием и злодеянием. Этот более узкий этический смысл сохранён в основном тексте, а греческий вариант приведён в сноске.
translation_notes:
  register: Современный литературный русский язык; краткий афористичный строй наставления сохранён. Конкретная метафора преткновения и более узкое обозначение людей насилия следуют еврейскому свидетельству, а расхождения греческого параллельного текста вынесены в сноски.
