base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/019.yaml
  text: The eyes of God see his works[b][a], and he knows every deed of a man.
translation:
  language: ru
  text: Очи Бога видят дела его[b], и Он знает всякое деяние человека[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское אִישׁ — форма мужского рода единственного числа («муж», «человек»), нередко употребляемая в литературе мудрости в обобщающем смысле.
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст в первой части стиха имеет другой вариант: «Очи Его — на боящихся Его»; вторая часть также утверждает, что Богу известно всякое человеческое дело.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֵינֵי אֵל
  choice: Очи Бога
  rationale: Сохраняет конкретный антропоморфный образ еврейского текста и его возвышенный поэтический тон; «очи» в современном литературном русском понятно и уместно для библейской мудрой речи.
- source_word: יִרְאוּ
  choice: видят
  rationale: Прямо передаёт простое значение qal «видеть», без добавления оттенков наблюдения или суда.
- source_word: מַעֲשָׂיו
  choice: дела его
  rationale: Местоименный суффикс мужского рода единственного числа естественно соотносится с человеком, упомянутым во второй половине стиха. Постпозиция «его» уменьшает риск ошибочно понять это как «дела Бога».
- source_word: יַכִּיר
  choice: знает
  rationale: В данном контексте глагол обозначает полное распознавание и знание. Русское «знает» звучит естественно и не ослабляет мысль о совершенной осведомлённости Бога.
- source_word: כָּל מִפְעַל
  choice: всякое деяние
  rationale: Передаёт распределительное כָּל при существительном в единственном числе и сохраняет смысл сделанного поступка, избегая буквального повтора слова «дело».
- source_word: אִישׁ
  choice: человека
  rationale: Русское «человек» обычно передаёт как конкретного мужчину, так и человека вообще; здесь оно естественно сохраняет обобщающий характер языка мудрости.
theological_decisions:
- issue: Антропоморфный образ Божьего восприятия
  choice: Сохранить буквальный образ «Очи Бога».
  alternative: «Бог видит»
  rationale: Еврейский текст выражается конкретно и образно; нет оснований превращать образ в абстрактное утверждение.
- issue: Референт суффикса в מַעֲשָׂיו
  choice: Понимать «его» как относящееся к человеку.
  alternative: Понимать как «дела Бога».
  rationale: Параллельная вторая строка говорит о всяком деянии человека, поэтому первая строка наиболее естественно также относится к человеческим делам. Формальная неоднозначность русского местоимения частично сохраняется.
- issue: Обобщающее אִישׁ
  choice: «человека»
  alternative: «мужчины»
  rationale: В литературе мудрости форма мужского рода единственного числа часто представляет любого человека; русское «человек» передаёт это без искусственного сужения смысла.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Очи» сохраняет поэтический образ; остальная лексика проста и понятна. Божественное местоимение «Он» написано с прописной буквы согласно распространённой русской библейской традиции.
