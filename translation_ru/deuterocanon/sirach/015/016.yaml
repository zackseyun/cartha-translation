base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/016.yaml
  text: Fire and water are set before you; whichever you choose[a], stretch out your hand to it.
translation:
  language: ru
  text: Перед тобой положены[a] огонь и вода; к чему пожелаешь, протяни руку[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское מוּצָק имеет здесь необычную форму; значение «положены перед тобой» подтверждается греческой параллелью: «положил перед тобой».'
    reason: textual_variant
  - marker: b
    text: 'В еврейском тексте буквально: «протяни руки»; в греческой параллели стоит единственное число: «руку».'
    reason: textual_variant
lexical_decisions:
- source_word: מוּצָק
  choice: положены
  rationale: Форма еврейского слова необычна, однако сочетание с לְפָנֶיךָ и греческая параллель παρέθηκέν σοι указывают на то, что огонь и вода представлены человеку как находящиеся перед ним возможности.
- source_word: לְפָנֶיךָ
  choice: перед тобой
  rationale: Прямой и естественный русский эквивалент пространственного оборота, который в контексте выражает предложенный человеку выбор.
- source_word: אֵשׁ וָמָיִם
  choice: огонь и вода
  rationale: Конкретная пара противоположностей сохранена буквально, как в еврейском тексте и греческой параллели.
- source_word: בַּאֲשֶׁר תַּחְפֹּץ
  choice: к чему пожелаешь
  rationale: Глагол חפץ обозначает желание или волеизъявление. Формулировка сохраняет открытую альтернативу и не подменяет образ более отвлечённым словом «выберешь».
- source_word: שְׁלַח יָדֶיךָ
  choice: протяни руку
  rationale: Оборот означает протянуть руку к выбранному предмету. Единственное число естественно для русского устойчивого выражения и согласуется с греческим χεῖρά σου; числовое расхождение с еврейской формой отмечено в сноске.
theological_decisions:
- issue: Нравственная свобода человека, подчёркнутая в стихе
  choice: Альтернативы представлены как реальные, а человеку прямо предлагается проявить собственную волю.
  alternative: Детерминистское истолкование, ослабляющее значение человеческого желания и действия.
  rationale: Еврейский и греческий тексты изображают две возможности перед человеком и побуждают его протянуть руку к желаемой. Перевод сохраняет эту напряжённость, не добавляя позднейших богословских оговорок.
translation_notes:
  register: Современный литературный русский язык; краткая, образная и торжественно-сдержанная формулировка. Синтаксис сохраняет параллелизм исходного изречения.
