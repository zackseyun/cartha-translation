  text: Do not say[a], “My transgression is from God,” for he has not done what he hates.
translation:
  language: ru
  text: 'Не говори[a]: «Моё преступление — от Бога», — ведь Он не делает того, что ненавидит.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Не говори: „Через Господа я отпал“, — ведь ты не сделаешь того, что Он возненавидел». Греческий текст передаёт близкую, но не тождественную сохранившемуся еврейскому тексту формулировку.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Не говори
  rationale: Прямой отрицательный императив передан кратко и естественно.
- source_word: מֵאֵל
  choice: от Бога
  rationale: 'Предлог מִן здесь естественнее всего указывает на источник: человек не должен приписывать Богу происхождение собственного преступления.'
- source_word: פִּשְׁעִי
  choice: моё преступление
  rationale: פשע обозначает серьёзное, нередко сознательное нарушение или неповиновение. «Преступление» сохраняет нравственную весомость слова и хорошо сочетается с притяжательной формой.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание запрета; «ведь» естественно передаёт пояснительно-причинную связь в современном русском языке.
- source_word: אֶת אֲשֶׁר שָׂנֵא
  choice: того, что ненавидит
  rationale: Относительная конструкция передана естественно; подразумеваемый субъект ненависти — Бог, названный в предыдущей части.
- source_word: לֹא עָשָׂה
  choice: Он не делал
  rationale: Еврейский перфект сохранён как форма прошедшего времени, способная в данном изречении выражать общее утверждение. Местоимение с прописной буквы делает смену субъекта ясной по-русски.
theological_decisions:
- issue: Отрицается ли происхождение греха от Бога или грех, совершённый из-за Бога
  choice: '«Моё преступление — от Бога»: отрицание того, что преступление человека исходит от Бога.'
  alternative: «Из-за Господа я отступил» / «Через Господа я отпал».
  rationale: Основной еврейский свидетель מֵאֵל פִּשְׁעִי прежде всего выражает источник или происхождение. Греческий параллельный текст содержит близкую, но не тождественную формулировку, поэтому она приведена в примечании, а не слита с основным текстом.
- issue: Степень волевого оттенка в פשע
  choice: «преступление»
  alternative: «грех» или «неповиновение».
  rationale: «Преступление» сохраняет серьёзность и вероятный оттенок сознательного нарушения, не сводя значение к политическому мятежу и не навязывая более узкую богословскую терминологию.
- issue: Кто является субъектом לֹא עָשָׂה
  choice: 'Бог: «Он не делал того, что ненавидит».'
  alternative: 'Греческий текст обращается ко второму лицу: «ты не сделаешь того, что Он возненавидел».'
  rationale: Еврейская форма עָשָׂה — третье лицо мужского рода единственного числа, и ближайший возможный субъект — Бог. Расхождение греческого параллельного текста сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык; краткий, достоинственный ритм наставления. Формулировка следует первичному еврейскому свидетельству, а существенное расхождение греческого параллельного текста вынесено в примечание.
