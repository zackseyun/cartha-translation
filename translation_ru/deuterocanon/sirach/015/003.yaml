translation:
  language: ru
  text: Она накормит его хлебом разумения и напоит водой проницательности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «водой мудрости»; в еврейском — «водой проницательности».'
