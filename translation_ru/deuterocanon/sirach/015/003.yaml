lexical_decisions:
- source_word: וְהֶאֱכִילַתְהוּ
  choice: Она накормит его
  rationale: Порода hифиль от אכל означает «дать есть, накормить». Форма с суффиксом «его» указывает на субъект женского рода; в контексте это олицетворённая Премудрость. Будущее время естественно передаёт смысл в последовательности обещаний данного отрывка.
- source_word: לֶחֶם
  choice: хлебом
  rationale: Сохранён конкретный образ хлеба, образующий смысловую пару с водой; обобщение «пищей» ослабило бы метафору.
- source_word: שָׂכֶל
  choice: разумения
  rationale: Слово обозначает разумение, здравый смысл или рассудительность. «Разумение» сохраняет возвышенный, но понятный регистр и естественно сочетается с образом хлеба.
- source_word: וּמֵי
  choice: водой
  rationale: Хотя еврейское слово морфологически имеет форму множественного числа, по-русски вещественное существительное в единственном числе здесь звучит естественно.
- source_word: תְבוּנָה
  choice: проницательности
  rationale: Выбор отличает תבונה от שָׂכֶל и передаёт способность глубоко понимать и различать. Греческий параллельный текст читает «мудрости»; вариант отмечен в сноске.
- source_word: תַּשְׁקֶנּוּ
  choice: напоит
  rationale: Форма от שקה означает «дать пить, напоить». Русское «напоит водой…» кратко и естественно сохраняет образ оригинала.
theological_decisions:
- issue: Субъект женского рода — олицетворённая Премудрость
  choice: Она
  alternative: Он
  rationale: Еврейские глагольные формы указывают на субъект женского рода, а контекст называет этим субъектом Премудрость. Поэтому местоимение «она» не является конфессиональным истолкованием, а передаёт грамматику и контекст источника.
- issue: Различие двух понятий мудрости
  choice: «разумение» для שָׂכֶל и «проницательность» для תְבוּנָה
  alternative: Передать оба слова как «понимание» или принять греческое «мудрость» во второй строке
  rationale: Разные русские слова сохраняют лексическое различие еврейского текста, не превращая близкие понятия в полные синонимы; вариант греческой традиции вынесен в сноску.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Параллелизм «хлебом разумения — водой проницательности» сохранён без излишней архаизации.
