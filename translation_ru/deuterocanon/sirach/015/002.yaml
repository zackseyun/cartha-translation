translation:
  language: ru
  text: Она выйдет ему навстречу, как мать, и примет его, как жена его юности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «как жена в пору девичества», то есть как юная невеста или девственная жена.'
