lexical_decisions:
- source_word: וְקִדְּמַתְהוּ
  choice: выйдет ему навстречу
  rationale: Глагол קדם здесь передаёт активное движение навстречу; греческое ὑπαντήσεται подтверждает этот смысл. Такой перевод сохраняет инициативу олицетворённой Премудрости.
- source_word: כָאֵם
  choice: как мать
  rationale: Прямо передаёт сравнительную конструкцию с כ и сохраняет материнский образ.
- source_word: וּכְאֵשֶׁת נְעוּרִים
  choice: как жена его юности
  rationale: Еврейское выражение אֵשֶׁת נְעוּרִים означает жену, связанную с годами юности человека, и несёт оттенок ранней супружеской близости. Формулировка сохраняет образ оригинала, не подменяя его более узким греческим оттенком девственности.
- source_word: תְּקַבְּלֶנּוּ
  choice: примет его
  rationale: קבל означает «принимать, встречать»; «примет его» естественно по-русски и сохраняет параллелизм двух частей стиха.
theological_decisions:
- issue: Женское олицетворение Премудрости в образах матери и жены
  choice: 'Сохранить женский личный образ: «Она выйдет… и примет»'
  alternative: Передать Премудрость безлично или устранить личные местоимения
  rationale: Еврейские глагольные формы имеют женский род, а сравнения с матерью и женой прямо поддерживают женское олицетворение. Его устранение обеднило бы поэтическое и богословское напряжение текста.
- issue: Соотношение еврейского אֵשֶׁת נְעוּרִים и греческого γυνὴ παρθενείας
  choice: 'В основном тексте следовать сохранившемуся еврейскому чтению: «жена его юности»'
  alternative: «девственная жена» или «юная невеста» по греческому тексту
  rationale: Сохранившийся еврейский свидетель является основным; греческий параллельный текст отражает близкий, но не тождественный оттенок, который уместно отметить в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Выражение «жена его юности» намеренно сохраняет ёмкий образ еврейского оригинала; активное «выйдет ему навстречу» ясно передаёт инициативу Премудрости.
