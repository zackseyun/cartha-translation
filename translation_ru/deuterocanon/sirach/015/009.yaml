translation:
  language: ru
  text: Хвала неуместна в устах нечестивца, ибо Бог не определил её ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «потому что она не была послана от Господа». Еврейский текст буквально: «потому что она не была выделена ему Богом».'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָאֲתָה
  choice: неуместна
  rationale: Передаёт значение несообразности и неподобающего характера хвалы, а не только отсутствие внешней красоты.
- source_word: תְהִלָּה
  choice: хвала
  rationale: Прямое и естественное соответствие существительному со значением хвалы; контекст не требует уточнения «песнь».
- source_word: בְּפִי
  choice: в устах
  rationale: Сохраняет конкретный образ еврейского текста и при этом звучит естественно в литературном русском языке.
- source_word: רָשָׂע
  choice: нечестивец
  rationale: Передаёт единственное число и нравственно-религиозную характеристику еврейского רָשָׂע, не смешивая её с греческим «грешник».
- source_word: נֶחְלְקָה לּוֹ
  choice: она ему назначена
  rationale: Глагол передаёт смысл определения или выделения кому-либо доли. «Назначена» сохраняет идею уделения и звучит по-русски естественнее буквального «выделена ему в удел».
- source_word: מֵאֵל
  choice: не от Бога
  rationale: Сохраняет исходный предлог и представляет Бога как источник того, что назначается человеку.
theological_decisions:
- issue: Соотношение еврейского и греческого чтений во второй части стиха
  choice: 'В основном тексте следовать еврейскому чтению: «не от Бога она ему назначена».'
  alternative: 'Греческое: «она не была послана от Господа».'
  rationale: Сохранившийся еврейский текст имеет высокую степень надёжности и содержит ясный образ назначения доли. Греческое чтение, вероятно, отражает иной исходный текст либо толкование; оно приведено в сноске без вытеснения еврейского чтения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Оборот «в устах нечестивца» сохраняет образ оригинала; синтаксис остаётся ясным для обычного читателя.
