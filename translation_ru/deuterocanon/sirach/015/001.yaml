base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/001.yaml
  text: He who fears Yahweh will do this[b][a], and he who grasps the law will attain her.
translation:
  language: ru
  text: Кто боится Господа, тот поступит так, и кто держится Закона[a], тот обретёт её[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское תּוֹרָה можно также передать как «Тора» или, шире, «наставление».
    reason: lexical_alternative
  - marker: b
    text: Последний глагол в сохранившемся еврейском тексте труден для истолкования; греческий параллельный текст имеет значение «обретёт её» или «достигнет её», то есть Премудрости.
    reason: textual_variant
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: кто боится Господа
  rationale: Субстантивированное причастие передано естественной для русского языка обобщающей конструкцией. Тетраграмматон по принятой русской библейской традиции передан как «Господь».
- source_word: יַעֲשֶׂה זֹאת
  choice: тот поступит так
  rationale: Сохраняет указательное значение единственного числа, не уточняя сверх текста, к чему именно относится «так».
- source_word: וְתוֹפֵשׂ תּוֹרָה
  choice: и кто держится Закона
  rationale: תפש выражает крепкое удерживание; «держится» естественно передаёт этот образ. «Закон» соответствует греческому νόμος и контексту Торы, а возможный более широкий смысл отмечен в сноске.
- source_word: יַדְרִיכֶנָּה
  choice: тот обретёт её
  rationale: Сохранившаяся еврейская форма затруднительна; греческое καταλήμψεται αὐτήν поддерживает значение достижения или обретения. Женское местоимение сохраняет отсылку к персонифицированной Премудрости.
theological_decisions:
- issue: К кому относится местоимение женского рода в последней части стиха
  choice: 'К персонифицированной Премудрости: «её»'
  alternative: Понимать выражение отвлечённо как достижение плода соблюдения Торы либо, при более буквальном следовании трудной еврейской форме, как руководство с её стороны
  rationale: Контекст Сир 14:20–15:10 изображает Премудрость как женщину, а греческий параллельный текст прямо содержит дополнение женского рода αὐτήν. Местоимение сохраняет образ и не устраняет литературно-богословскую связь.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Закон» написан с прописной буквы как обозначение Торы; «Премудрость» подразумевается местоимением и поясняется в сноске. Порядок сносок приведён к последовательному [a], [b].
