base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/015.yaml
  text: If you desire[a], you will keep the commandment, and to act faithfully is a matter of your good pleasure. If you trust in him[c][b], you too will live.
translation:
  language: ru
  text: Если пожелаешь, соблюдёшь заповедь[a], а разумение — исполнять его волю[b]. Если доверишься ему[c], то и ты будешь жить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте стоит единственное число: «заповедь»; в греческой параллели — множественное: «заповеди».'
    reason: textual_variant
  - marker: b
    text: 'Средняя часть стиха в еврейском тексте трудна для понимания. Возможен более буквальный перевод: «и разумение — исполнять его волю». Греческая параллель читается иначе: «совершать верность — дело благоизволения».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «Если поверишь в него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תַּחְפֹּץ
  choice: Если пожелаешь
  rationale: Глагол חפץ выражает желание и волевую расположенность; условная конструкция сохранена без усиления до отвлечённого учения о свободе воли.
- source_word: תִּשְׁמֹר מִצְוָה
  choice: соблюдёшь заповедь
  rationale: Передаёт глагол שמר в обычном библейском значении соблюдения и сохраняет единственное число מִצְוָה; греческое множественное число отмечено в сноске.
- source_word: וְתָבִינָה
  choice: а разумность — в том
  rationale: Передача исходит прежде всего из засвидетельствованного еврейского текста и понимает трудную форму в связи с идеей разумения; синтаксическая неясность открыто отмечена в сноске.
- source_word: לַעֲשׂוֹת רְצוֹנוֹ
  choice: чтобы исполнять его волю
  rationale: Буквально и естественно передаёт инфинитив לעשות и местоименный суффикс третьего лица в רצונו, не заменяя «его волю» человеческим «благоизволением».
- source_word: אִם תַּאֲמִין בּוֹ
  choice: Если доверишься ему
  rationale: אמן с ב может обозначать доверие или веру в кого-либо; «доверишься ему» естественно передаёт личностный характер выражения, а близкая альтернатива дана в сноске.
- source_word: גַּם אַתָּה תִּחְיֶה
  choice: то и ты будешь жить
  rationale: «И ты» сохраняет эмфатическое גם אתה, а будущее «будешь жить» прямо передаёт תִּחְיֶה.
theological_decisions:
- issue: Соотношение человеческого желания и послушания
  choice: 'Сохранена условно-волевая формулировка: «Если пожелаешь, соблюдёшь».'
  alternative: «Если выберешь, сможешь соблюдать»
  rationale: Текст подчёркивает ответственность человека, но не утверждает отдельно ни абсолютную автономию воли, ни способность как философско-догматическую категорию.
- issue: Трудное еврейское среднее предложение и греческая параллель
  choice: 'Основной текст следует сохранившемуся еврейскому чтению: разумность связывается с исполнением его воли.'
  alternative: «а поступать верно зависит от твоего доброго желания»
  rationale: 'Еврейское לעשות רצונו непосредственно означает «исполнять его волю», тогда как греческая параллель говорит о совершении верности и благоизволении. Расхождение не сглажено: греческое чтение приведено в сноске.'
- issue: Значение веры в заключительной строке
  choice: «Если доверишься ему»
  alternative: «Если поверишь в него»
  rationale: Выбран личностный оттенок доверия, не исключающий значения веры; лексическая многозначность сохранена сноской.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинственным синтаксисом. Формы «соблюдёшь заповедь», «исполнять его волю» и «будешь жить» сохраняют библейскую выразительность, оставаясь понятными современному читателю.
