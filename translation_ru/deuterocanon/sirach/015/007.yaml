  text: Men of falsehood will not attain her[b][a], and men of insolence will not see her.
translation:
  language: ru
  text: Люди лжи[a] не достигнут её[b], и люди надменные не увидят её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «люди лжи». В греческой параллели — «люди неразумные»; это может отражать иной исходный текст или истолковывающий перевод.'
    reason: alternative_reading
  - marker: b
    text: Еврейский глагол при буквальном понимании как «направлять её» здесь труден. Греческая параллель поддерживает смысл «достичь», «обрести» или «постичь» её.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יַדְרִיכוּהָ
  choice: не достигнут её
  rationale: Обычное каузативное значение корня דרך («вести, направлять») здесь затруднительно, поскольку объект — Премудрость, а параллельная строка говорит о невозможности увидеть её. Греческое οὐ μὴ καταλήμψονται αὐτήν поддерживает смысл «достичь, обрести, постичь»; «не достигнут её» естественно передаёт недоступность Премудрости для таких людей, не сводя речь только к интеллектуальному пониманию.
- source_word: מְתֵי שָׁוְא
  choice: люди лжи
  rationale: Сочетание буквально означает «люди лжи/пустоты/ничтожества». «Люди лжи» сохраняет еврейский образ и нравственный смысл; греческое «люди неразумные» отмечено как вариант традиции.
- source_word: וְאַנְשֵׁי זָדוֹן
  choice: люди надменные
  rationale: זָדוֹן обозначает надменность, дерзость и самонадеянное своеволие. «Надменные» звучит естественно по-русски и сохраняет нравственную характеристику, не расширяя её до общего «нечестивые».
- source_word: לֹא יִרְאוּהָ
  choice: не увидят её
  rationale: Прямое значение ראה — «видеть»; оно подтверждается греческим ἴδωσιν. Буквальный образ сохранён, хотя в контексте он может подразумевать также распознавание или приобщение.
theological_decisions:
- issue: Соотношение еврейского текста и греческой параллели в первой строке
  choice: Сохранить еврейское «люди лжи», а трудный глагол передать как «не достигнут» с учётом греческой параллели.
  alternative: «Люди лжи не направят её» либо, по греческому тексту, «Люди неразумные не постигнут её».
  rationale: Сохранившийся еврейский текст остаётся основным свидетельством. Однако буквальное «не направят её» плохо согласуется с Премудростью как объектом и с параллельной строкой. Греческий текст служит древним свидетельством смысла «достичь/обрести/постичь», при этом его отличающееся определение людей не подменяет еврейское чтение.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для Писания. Параллелизм двух частей сохранён; «её» относится к Премудрости из контекста. Формула «люди лжи» намеренно несколько образна, но понятна и близка еврейскому выражению.
