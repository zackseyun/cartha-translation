  rationale: Исправление безопасно различает два еврейских глагола, устраняет добавленный русским «предал» смысл измены и делает перевод трудного חוֹתְפוֹ более естественным, не разрешая его спорную семантику. Сноска по-прежнему фиксирует существенное расхождение греческого параллельного текста.
