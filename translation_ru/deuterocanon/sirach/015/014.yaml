base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/015/014.yaml
  text: God[a], from the beginning, created man, and placed him in the hand of his own violence[b]; he gave him over to the hand of his own inclination.
translation:
  language: ru
  text: Бог изначально сотворил человека[a] и поставил его во власть захватывающей его силы;[b] Он отдал его во власть его собственного влечения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человечество». Еврейское אָדָם стоит в единственном числе, но может обозначать людей в целом.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово в этом месте трудно для перевода; оно может обозначать того, кто захватывает человека, или захватывающую его силу. В греческом тексте после слов «сотворил человека» сказано: «и оставил его в руке собственного решения». Оба чтения говорят о человеческом самоопределении, хотя выражают его по-разному.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִבְּרֵאשִׁית
  choice: изначально
  rationale: Передаёт временное значение «от начала», подтверждаемое греческим ἐξ ἀρχῆς, не создавая излишне прямой цитатной ассоциации с Быт 1:1.
- source_word: בָּרָא
  choice: сотворил
  rationale: Обычный и уместный в русском библейском регистре эквивалент глагола ברא при Боге как субъекте.
- source_word: אָדָם
  choice: человека
  rationale: Сохраняет грамматическое единственное число и допускает собирательное значение «человечество».
- source_word: וַיְשִׁיתֵהוּ בְּיַד
  choice: отдал его во власть
  rationale: Передаёт образ нахождения «в руке» как идиому власти или распоряжения естественным современным русским языком.
- source_word: חוֹתְפוֹ
  choice: того, что им овладевает
  rationale: Форма трудна и буквально связана с захватыванием или овладением. Нейтрально-субстантивированная конструкция сохраняет неоднозначность между овладевающей силой, порывом и насилием, не превращая её без достаточных оснований ни во внешнего похитителя, ни в однозначно внутренний импульс.
- source_word: וַיִּתְּנֵהוּ בְּיַד
  choice: Он предал его во власть
  rationale: Отражает повторную еврейскую конструкцию с ביד и несколько более сильный оттенок передачи в распоряжение, присущий נתן в таком сочетании.
- source_word: יִצְרוֹ
  choice: его собственного влечения
  rationale: יצר в антропологическом контексте обозначает внутреннее побуждение, направленность или склонность. «Влечение» естественно по-русски и не уточняет заранее, доброе оно или злое.
theological_decisions:
- issue: Нравственная самостоятельность человека после сотворения
  choice: Бог показан Творцом, отдающим человека во власть действующего в нём побуждения, без утверждения абсолютной автономии и без объявления этого побуждения непременно злым.
  alternative: «Оставил его в руке собственного решения» по греческому тексту либо «отдал его злому побуждению» в более догматически определённом прочтении.
  rationale: Еврейский и греческий тексты указывают на человеческое самоопределение, но трудное חוֹתְפוֹ и более широкое יִצְרוֹ не позволяют безоговорочно определить характер внутренней силы. Перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Параллелизм двух конструкций «во власть» сохранён как особенность еврейского текста; местоимение «Он» подчёркивает продолжение действий Бога и облегчает чтение длинной фразы.
