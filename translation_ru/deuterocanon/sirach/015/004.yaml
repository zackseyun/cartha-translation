  text: He will lean on her and not be shaken[c][b][a]; he will trust in her and not be put to shame.
translation:
  language: ru
  text: Он обопрётся на неё[a] и не поколеблется[b]; будет доверять ей и не постыдится[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть на Мудрость, которая в окружающем контексте представлена как женщина.
    reason: cross_reference
  - marker: b
    text: 'Или: «не пошатнётся»; еврейский глагол описывает утрату устойчивости или сдвиг с места.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не будет посрамлён»; выражение может также означать, что доверившийся не окажется разочарованным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁעַן עָלֶיהָ
  choice: обопрётся на неё
  rationale: Глагол שׁען обозначает опору и доверие. «Обопрётся на неё» сохраняет конкретный образ опоры и женский род местоимения, относящегося к олицетворённой Мудрости.
- source_word: וְלֹא יִמּוֹט
  choice: и не поколеблется
  rationale: מוֹט передаёт утрату устойчивости — шатание, сдвиг или падение. «Не поколеблется» естественно звучит по-русски и сохраняет образ стойкости.
- source_word: וּבָהּ יִבְטַח
  choice: будет доверять ей
  rationale: בטח означает доверять, полагаться и чувствовать себя в безопасности. «Будет доверять ей» прямо передаёт смысл и не дублирует образ физической опоры из первой части.
- source_word: וְלֹא יֵבוֹשׁ
  choice: и не постыдится
  rationale: בוש может означать испытать стыд или оказаться разочарованным из-за несбывшейся надежды. «Не постыдится» сохраняет основное значение без преждевременного устранения смысловой широты.
theological_decisions:
- issue: Женский род местоимений
  choice: Сохранить «неё / ей» как указание на олицетворённую Мудрость.
  alternative: Передать нейтрально, ослабив олицетворение.
  rationale: В еврейском тексте стоят женские суффиксы, а окружающий контекст изображает Мудрость как женщину; сохранение рода передаёт литературный и богословский образ оригинала.
- issue: Смысл стыда в итоге доверия
  choice: Перевести «не постыдится», сохранив возможность как личного стыда, так и несбывшейся надежды.
  alternative: «Не будет посрамлён» или «не разочаруется».
  rationale: Еврейское בוש допускает оттенки стыда, посрамления и разочарования. Основной текст оставляет напряжение, а примечание поясняет диапазон.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм двух полустиший сохранён; женское олицетворение Мудрости выражено явно.
