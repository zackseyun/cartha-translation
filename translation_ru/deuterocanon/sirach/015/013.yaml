  yaml_path: translation/deuterocanon/sirach/015/013.yaml
  text: Yahweh hates evil and abomination[a], and he will not permit it to those who fear him.
translation:
  language: ru
  text: Яхве ненавидит зло и мерзость[a] и не допустит, чтобы это произошло с теми, кто боится Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «и это не является желанным (или: приемлемым) для тех, кто боится Его». Еврейский текст гласит: «и Он не допустит, чтобы это произошло с теми, кто боится Его».'
    reason: alternative_reading
lexical_decisions:
- source_word: רָעָה
  choice: зло
  rationale: В сочетании с תוֹעֵבָה слово обозначает нравственное зло, а не бедствие.
- source_word: תּוֹעֵבָה
  choice: мерзость
  rationale: Передаёт сильное обозначение того, что нравственно или ритуально отвратительно; соответствует также греческому βδέλυγμα.
- source_word: שָׂנֵא
  choice: ненавидит
  rationale: Настоящее время естественно выражает общее, непреходящее утверждение.
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передана форма личного имени Бога, стоящая в еврейском тексте.
- source_word: וְלֹא יְאַנֶּנָּה
  choice: и не позволит этого
  rationale: Основной текст следует сохранившемуся еврейскому чтению с идеей недопущения; указательное «этого» естественно отсылает ко всему сочетанию «зло и мерзость», не вынуждая русский текст к неясному женскому местоимению единственного числа.
- source_word: לִירֵאָיו
  choice: тем, кто боится Его
  rationale: Современная и понятная передача библейского выражения о людях, благоговеющих перед Богом, без сведения значения к одному лишь ужасу.
theological_decisions:
- issue: Расхождение еврейского и греческого текста во второй части стиха
  choice: 'Следовать еврейскому чтению: «и не позволит этого тем, кто боится Его»'
  alternative: 'Греческая параллель: «и это не любимо (или: неприемлемо) для тех, кто боится Его»'
  rationale: Сохранившийся еврейский текст имеет высокую степень надёжности и служит основным источником; существенно иное греческое чтение отмечено в сноске, а не замалчивается.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и торжественная, но понятная. Сохранены сильные нравственные термины и явное расхождение между еврейским и греческим свидетельствами.
