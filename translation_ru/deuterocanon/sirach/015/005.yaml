  text: And he will exalt him above his companions[a], and in the midst of the assembly he will open his mouth.
translation:
  language: ru
  text: И она возвысит его над его товарищами[a], и среди собрания откроет ему уста.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над его товарищем (ближним)». В еврейском стоит форма единственного числа, которая здесь может иметь собирательный смысл; греческий перевод передаёт её множественным числом: «над его ближними».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוֹמְמַתְהוּ
  choice: и она возвысит его
  rationale: 'Пиэль от רומם означает «высоко поднять, возвысить, прославить». «Возвысит» сохраняет как образ высоты, так и значение почёта; греческое ὑψώσει подтверждает это понимание. Женский субъект естественно восстанавливается из ближайшего контекста: действует Премудрость.'
- source_word: מֵרֵעֵהוּ
  choice: над его товарищами
  rationale: Еврейская форма формально единственного числа («над его товарищем/ближним»), но может иметь собирательный смысл; греческое παρὰ τοὺς πλησίον αὐτοῦ прямо передаёт множественное число. «Товарищами» здесь естественно обозначает людей его круга и сохраняет сравнительное значение מִן.
- source_word: וּבְתוֹךְ
  choice: и среди
  rationale: Передаёт положение внутри собравшегося сообщества естественнее для современного русского, чем буквальное «посреди», не теряя пространственно-социального смысла.
- source_word: קָהָל
  choice: собрания
  rationale: Нейтральная передача קהל как публично собравшегося сообщества; не сужает значение до исключительно богослужебной общины. Греческое ἐκκλησία подтверждает смысл собрания.
- source_word: תִּפְתַּח פִּיו
  choice: откроет его уста
  rationale: Сохранён конкретный еврейский оборот, также отражённый в греческом. Он выражает дарование возможности или права публично говорить, а не просто факт речи.
theological_decisions:
- issue: Подразумеваемый субъект глаголов
  choice: Премудрость, переданная местоимением «она»
  alternative: Бог как подразумеваемый деятель либо неопределённый субъект
  rationale: В самом стихе субъект прямо не назван, однако формы וְרוֹמְמַתְהוּ и תִּפְתַּח — женского рода единственного числа, а ближайший явно названный субъект в контексте — Премудрость (חכמה). Поэтому русский женский род грамматически и контекстуально обоснован, при этом в примечании нет необходимости догматически отождествлять Премудрость с Богом.
- issue: Смысл открытия уст
  choice: Сохранить образ «откроет его уста»
  alternative: Истолковать как «даст ему говорить» или «он заговорит»
  rationale: Буквальный образ оставляет открытым оттенок дарованной способности, полномочия или смелости говорить перед собранием и не сводит выражение к одному толкованию.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Уста» сохранены ради устойчивого образа публичной, дарованной речи; прочая лексика остаётся понятной обычному читателю.
