translation:
  language: ru
  text: Он обретёт радость и ликование, а Премудрость даст ему в наследие вечное имя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также перевод: «и он унаследует вечное имя» или «и вечное имя станет его наследием». Еврейская форма допускает разные способы передать связь между Премудростью, человеком и вечным именем; в греческом тексте прямо сказано: «и вечное имя он унаследует».'
    reason: Сжатая еврейская конструкция и расхождение синтаксического оформления с греческим параллельным текстом.
lexical_decisions:
- source_word: שָׂשׂוֹן
  choice: веселье
  rationale: Передаёт радостное состояние и позволяет сохранить поэтическую пару с שִׂמְחָה без полного слияния близких по смыслу слов.
- source_word: שִׂמְחָה
  choice: радость
  rationale: Обычное и точное современное соответствие; вместе с «весельем» сохраняет параллельную пару исходного текста.
- source_word: יִמְצָא
  choice: обретёт
  rationale: Основное значение — «найдёт», однако в данном контексте речь идёт о приобретении блага; «обретёт» естественно звучит по-русски и не превращает действие в целенаправленный поиск.
- source_word: שֵׂם עוֹלָם
  choice: вечное имя
  rationale: Сохраняет буквальный образ имени, которое пребывает вовеки, то есть непреходящей известности, не подменяя метафору толкованием «добрая слава».
- source_word: תּוֹרִישֶׁנּוּ
  choice: она даст ему в наследие
  rationale: 'Форма допускает понимание каузативного значения корня ירש: «дать кому-либо унаследовать». Женский субъект естественно соотносится с Премудростью в контексте, а местоименный суффикс — с человеком.'
theological_decisions:
- issue: Синтаксис заключительной части стиха и субъект תּוֹרִישֶׁנּוּ
  choice: Премудрость даст человеку в наследие вечное имя.
  alternative: Он унаследует вечное имя; вечное имя станет его наследием.
  rationale: Масоретоподобная форма еврейского текста естественно читается как глагол в 3-м лице женского рода с местоименным объектом мужского рода, что позволяет видеть субъектом Премудрость из контекста. При этом сжатый синтаксис и греческое κατακληρονομήσει поддерживают альтернативную формулировку с самим человеком как наследником; смысловой центр во всех вариантах — получение непреходящего имени как наследия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены поэтическая парность «веселье и радость», образ «вечного имени» и мотив наследия; женское «она» отсылает к Премудрости в ближайшем контексте.
