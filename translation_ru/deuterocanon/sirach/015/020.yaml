lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: человеку
  rationale: Передаёт единственное число и общий смысл «человек, смертный», не сужая его до конкретного лица.
- source_word: הֶחֱלִים
  choice: укреплял
  rationale: Сохраняет наиболее прямой смысл редкого еврейского глагола в данном контексте; греческий параллельный текст, вероятно отражающий иную формулировку, передаёт эту часть как «не дал воли».
- source_word: אַנְשֵׁי כָזָב
  choice: лжецов
  rationale: Естественный современный русский эквивалент буквального «людей лжи/обмана».
- source_word: עֹשֶׂה שָׁוְא
  choice: кто творит пустое
  rationale: 'Сохраняет широкое и несколько неоднозначное значение שָׁוְא: пустое, тщетное, ложное или неправое дело.'
- source_word: מְגַלֶּה סוֹד
  choice: кто разглашает тайну
  rationale: По-русски естественно выражает буквальное «открывающий тайну» в смысле выдачи доверенного секрета.
theological_decisions:
- issue: Божье отношение к человеческому греху
  choice: «не повелевал человеку грешить»
  alternative: «никому не повелевал поступать нечестиво»
  rationale: Основной текст следует высокоуверенному еврейскому чтению לֹא צִוָּה אֱנוֹשׁ לַחֲטֹא, сохраняя ответственность человека и не добавляя конфессионального толкования.
- issue: Расхождение еврейского и греческого текстов во второй части
  choice: в основном тексте следовать еврейскому «не укреплял лжецов»
  alternative: греческое «никому не дал воли грешить»
  rationale: Приоритет отдан указанному еврейскому источнику; значимое греческое расхождение вынесено в примечание, а не устранено молча.
- issue: Дополнительное еврейское предложение
  choice: включить его в основной текст
  alternative: опустить вслед за греческой традицией и английским консультационным слоем
  rationale: Предложение присутствует в предоставленном высокоуверенном еврейском составном тексте; его отсутствие в греческом отмечено отдельно.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировки преимущественно естественные; выражение «творит пустое» намеренно сохраняет смысловую широту и напряжение еврейского שָׁוְא.
