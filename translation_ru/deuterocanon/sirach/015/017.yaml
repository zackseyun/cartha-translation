translation:
  language: ru
  text: Перед людьми — жизнь и смерть[a]; чего человек пожелает, то и будет ему дано.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Людям даны жизнь и смерть». Еврейский предлог допускает такое понимание, однако греческая параллель поддерживает смысл «перед людьми».'
    reason: alternative_reading
lexical_decisions:
- source_word: לִבְנֵי אָדָם
  choice: Перед людьми
  rationale: Еврейское выражение буквально допускает значение «людям/для людей», однако греческая параллель ἔναντι ἀνθρώπων ясно поддерживает образ двух возможностей, поставленных перед людьми. «Перед людьми» естественно передаёт этот смысл по-русски.
- source_word: חַיִּים וָמָוֶת
  choice: жизнь и смерть
  rationale: Прямое и идиоматичное обозначение двух противоположных возможностей; грамматически множественное חַיִּים по-русски передаётся единственным числом «жизнь».
- source_word: אֲשֶׁר יַחְפֹּץ
  choice: чего человек пожелает
  rationale: Глагол חפץ выражает желание, благоволение или волеизъявление. «Пожелает» сохраняет эту смысловую широту и не сводит выражение исключительно к техническому акту выбора. Слово «человек» эксплицирует подразумеваемое лицо и позволяет естественно сохранить общий единственный субъект.
- source_word: יִנָּתֵן לוֹ
  choice: то и будет ему дано
  rationale: Сохранена пассивная конструкция исходного текста без указания не названного в стихе действующего лица; корреляция «чего… то» звучит естественно по-русски.
theological_decisions:
- issue: Нравственная свобода человека и неназванный источник воздаяния
  choice: Сохранить рамку человеческого желания и пассивное «будет ему дано», не уточняя, кем именно.
  alternative: Усилить либо автономность человеческого выбора, либо прямое Божье предопределение результата.
  rationale: Еврейский и греческий тексты связывают результат с человеческим волеизъявлением, но не разъясняют соотношение человеческой свободы и Божьего владычества.
- issue: Коллективное выражение и последующий общий единственный субъект
  choice: Передать לִבְנֵי אָדָם как «людьми», а затем использовать обобщающее «человек… ему».
  alternative: Сохранить множественное число во всём стихе либо употребить «сыны человеческие».
  rationale: Так сохраняется переход источника от человечества в целом к отдельному человеку, а русский текст остаётся современным и естественным.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и достойная форма. Тире естественно выражает подразумеваемое расположение двух возможностей перед людьми. Архаизмы и конфессионально окрашенные уточнения исключены.
