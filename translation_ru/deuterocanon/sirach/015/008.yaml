translation:
  language: ru
  text: Она далека от насмешников[a], и люди лжи не вспомнят о ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Она далека от гордости, и лживые люди ни за что не вспомнят о ней». В еврейском тексте — «насмешники», тогда как в греческом — «гордость»; это, вероятно, отражает иное чтение исходного текста или его истолкование.'
    reason: alternative_reading
lexical_decisions:
- source_word: רְחוֹקָה הִיא
  choice: Она далека
  rationale: Сохраняет образ расстояния и женский род, относящийся в контексте к олицетворённой Мудрости.
- source_word: מִלֵּצִים
  choice: от насмешников
  rationale: Еврейское לץ обозначает дерзкого, высокомерного насмешника; «насмешники» естественно передаёт это значение в современной литературной русской речи.
- source_word: וְאַנְשֵׁי כָזָב
  choice: и люди лжи
  rationale: Близко воспроизводит еврейское выражение «люди лжи», сохраняя его нравственную весомость и не сужая значение до отдельного случая произнесённой неправды.
- source_word: לֹא יִזְכְּרוּהָ
  choice: не вспомнят о ней
  rationale: Передаёт обычное значение זכר «помнить, вспоминать»; греческая параллель с μνησθήσονται подтверждает именно смысл воспоминания.
theological_decisions:
- issue: К кому относится местоимение женского рода
  choice: '«Она… о ней»: продолжено олицетворение Мудрости.'
  alternative: Безличная передача Мудрости как отвлечённого качества.
  rationale: Контекст Сир 15 представляет Мудрость в женском образе; сохранение женских местоимений передаёт литературную и богословскую образность, не развивая её сверх сказанного.
- issue: Расхождение еврейского и греческого свидетельств
  choice: В основном тексте принято еврейское «насмешников».
  alternative: Греческое «гордости».
  rationale: Заданный еврейский текст имеет высокую степень надёжности и прямо читает לֵצִים; греческий вариант важен, но не должен вытеснять основной источник и поэтому отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным учительной литературе. Синтаксис краток и близок к еврейскому; оборот «люди лжи» намеренно сохраняет выразительную семитскую формулу.
