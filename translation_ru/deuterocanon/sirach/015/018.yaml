lexical_decisions:
- source_word: סָפְקָה
  choice: изобильна
  rationale: Форма допускает значения достаточности и изобилия; греческое πολλὴ подтверждает здесь смысл великой, обильной мудрости.
- source_word: חָכְמַת
  choice: мудрость
  rationale: Прямое и естественное соответствие חכמה в данном контексте.
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога.
- source_word: אַמִּיץ גְּבוּרוֹת
  choice: могуч силой
  rationale: Сохраняет усиленное выражение мощи; греческое ἰσχυρὸς ἐν δυναστείᾳ поддерживает абстрактный смысл силы или могущества, а не отдельных подвигов.
- source_word: וְחוֹזֶה כֹל
  choice: и видит всё
  rationale: Естественно передаёт всеохватное Божье видение и соответствует греческому βλέπων τὰ πάντα.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст прямо содержит тетраграмматон; транслитерация сохраняет личное имя, не заменяя его титулом.
- issue: Характер Божьей силы в גְּבוּרוֹת
  choice: силой
  alternative: могучими деяниями
  rationale: Контекст и греческая параллель позволяют понять множественное число как выражение мощи вообще, хотя смысл могущественных деяний лексически возможен.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным строем. Сохранены причинное «ибо», личное имя Яхве и лексическая неоднозначность первого сказуемого в примечании.
