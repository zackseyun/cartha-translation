base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/001.yaml
  text: Do not become an enemy instead of a friend, for an evil name will inherit shame and disgrace[b][a]; so it is with a sinful man of double tongue.
translation:
  language: ru
  text: Не становись врагом вместо друга, ведь дурное имя наследует стыд и бесчестье[a]; таков и грешник с раздвоенным языком[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст короче: «Дурное имя наследует стыд и бесчестье; таков злой человек, обладатель двух [вещей]». Греческий текст добавляет предостережение: «Не становись врагом вместо друга».'
    reason: textual_variant
  - marker: b
    text: 'Еврейское выражение буквально означает «обладатель двух [вещей]» и остаётся неясным; греческий текст поясняет: «с раздвоенным языком», то есть двояко говорящий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם רַע / ὄνομα πονηρόν
  choice: дурное имя
  rationale: Сохраняет общий для еврейского и греческого текстов образ «имени», означающего также репутацию, не сводя его к одному толкованию.
- source_word: וְקָלוֹן / αἰσχύνη
  choice: стыд
  rationale: Передаёт общественное унижение и сохраняет отличие от следующего близкого по смыслу существительного.
- source_word: חֶרְפָּה / ὄνειδος
  choice: бесчестье
  rationale: Выражает публичный позор и естественно образует смысловую пару со словом «стыд».
- source_word: תּוֹרִישׁ / κληρονομήσει
  choice: наследует
  rationale: Сохраняет подтверждённый обоими свидетелями образ наследования; настоящее время по-русски естественно выражает общее нравственное правило.
- source_word: אִישׁ רַע / ὁ ἁμαρτωλός
  choice: грешник
  rationale: Естественное русское соответствие греческому существительному; одновременно передаёт нравственную характеристику еврейского выражения «злой человек».
- source_word: בַּעַל שְׁתָּיִם / ὁ δίγλωσσος
  choice: с раздвоенным языком
  rationale: Следует ясному греческому толкованию и сохраняет образ двоякой, неискренней речи; неясность краткого еврейского выражения отмечена в сноске.
- source_word: ἀντὶ φίλου μὴ γίνου ἐχθρός
  choice: Не становись врагом вместо друга
  rationale: Прямо и естественно передаёт ясное греческое предостережение, отсутствующее в сохранившемся еврейском свидетеле.
theological_decisions:
- issue: Значительное расхождение между еврейским и греческим свидетелями
  choice: Включить в основной текст ясное греческое предостережение, а общее для свидетелей высказывание перевести преимущественно по еврейскому тексту; расхождение отметить в сноске.
  alternative: Перевести только краткий еврейский текст либо полностью следовать более пространному греческому тексту, включая неясную первую фразу о большом и малом.
  rationale: Так сохраняется наиболее содержательный древний контекст без сокрытия текстуального расхождения и без принудительного истолкования неясной греческой фразы.
- issue: Толкование выражения בַּעַל שְׁתָּיִם
  choice: Передать по греческому параллельному тексту как «с раздвоенным языком».
  alternative: 'Буквально: «обладатель двух [вещей]».'
  rationale: Еврейское выражение неполно и неясно, тогда как греческое δίγλωσσος даёт древнее и контекстуально уместное понимание; альтернативу следует сохранить в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. Сохранены библейский образ «дурного имени» и метафора раздвоенного языка; архаичные и конфессионально окрашенные формулировки не использованы.
