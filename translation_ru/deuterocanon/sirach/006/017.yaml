  source_fidelity: 'Основной текст точно передаёт оба параллельных члена сохранившегося еврейского текста: כָּמוֹהוּ ... רֵעֵהוּ и כִּשְׁמוֹ ... מַעֲשָׂיו. «Каков он сам ... таков и друг его» адекватно сохраняет сравнительную, афористическую форму, а «имя» не подменяется интерпретацией вроде «репутация». Сноска честно отмечает существенное расхождение греческой традиции и не смешивает её с еврейским основным текстом.'
