  terminology: «Друг» обоснованно выбран для רֵעֵהוּ в контексте дружбы. «Имя» и «дела» точно и без излишней богословской или интерпретационной нагрузки передают еврейские слова. В сноске «ближний» корректно соответствует греческому πλησίον, а «Господь» — Κύριον.
