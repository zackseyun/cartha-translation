translation:
  language: ru
  text: Ибо каков он сам[a], таков и друг его; и каково его имя, таковы и дела его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Боящийся Господа верно направляет свою дружбу, ибо каков он, таков и ближний его». Еврейское свидетельство в первой части стиха существенно отличается.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָמוֹהוּ
  choice: каков он сам
  rationale: 'Сравнительная конструкция с כ־ и местоименным суффиксом естественно передаёт соответствие: «каков он сам». Добавление «сам» делает русскую формулу ясной, не расширяя смысла.'
- source_word: רֵעֵהוּ
  choice: друг его
  rationale: רֵעַ может означать друга, товарища или ближнего. Контекст дружбы и греческая параллель поддерживают значение «друг»; постпозиция местоимения сохраняет достоинство и краткость изречения.
- source_word: כִּשְׁמוֹ
  choice: каково его имя
  rationale: Перевод сохраняет буквальное «имя», которое может подразумевать репутацию, но не сводится к ней. Так сохраняется лаконичность и смысловая открытость еврейского текста.
- source_word: מַעֲשָׂיו
  choice: дела его
  rationale: מַעֲשִׂים обозначает дела или поступки. «Дела» естественно для русской литературы мудрости и сохраняет нравственный оттенок.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающейся греческой формой стиха
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; греческое разночтение приведено в сноске.
  alternative: «Боящийся Господа верно направляет свою дружбу, ибо каков он, таков и ближний его».
  rationale: Приоритет отдаётся сохранившемуся еврейскому тексту Сираха. Поскольку греческая традиция содержит существенно иной первый колон, расхождение не устраняется и не согласовывается искусственно, а документируется в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, симметричным строением пословицы. Синтаксический параллелизм еврейского текста сохранён; формулировка торжественная, но понятная обычному читателю.
