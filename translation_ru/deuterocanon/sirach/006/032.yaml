  text: If you desire it[a], my son, you will become wise; and if you set your heart on it[b], you will become shrewd.
translation:
  language: ru
  text: Если пожелаешь этого[a], сын мой, станешь мудрым; и если приложишь к этому своё сердце[b], станешь рассудительным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Если захочешь, дитя, будешь наставлен; и если отдашь свою душу, станешь находчивым (или проницательным)». Общий смысл еврейского и греческого текстов близок, но греческий выдвигает на первый план наставление, тогда как еврейский говорит: «станешь мудрым».'
    reason: alternative_reading
  - marker: b
    text: Выражение «приложить сердце» означает намеренно сосредоточиться на чём-либо и посвятить себя этому.
    reason: cultural_note
lexical_decisions:
- source_word: אִם תַּחְפּוֹץ
  choice: Если пожелаешь этого
  rationale: 'Глагол חפץ выражает желание и добровольную устремлённость. Местоимение «этого» добавлено по смыслу: подразумевается обретение мудрости, о котором говорится в контексте.'
- source_word: בְּנִי
  choice: сын мой
  rationale: Еврейский текст содержит обращение в мужском роде единственного числа; порядок слов выбран в соответствии с естественной и достойной русской речью.
- source_word: תִּתְחַכָּם
  choice: станешь мудрым
  rationale: 'Форма от חכם передаёт вхождение в состояние или развитие качества: человек становится мудрым. Это точнее следует еврейскому тексту, чем греческое «будешь наставлен».'
- source_word: וְאִם תָּשִׂים לִבְּךָ
  choice: и если устремишь к этому своё сердце
  rationale: Буквальный образ «положить/направить сердце» означает сознательно обратить на что-либо внимание и посвятить себя этому. «Устремишь сердце» сохраняет образ и звучит естественно по-русски.
- source_word: תַּעֲרֹם
  choice: станешь рассудительным
  rationale: В контексте наставления о мудрости корень ערם обозначает практическую проницательность и благоразумную рассудительность, хотя в иных контекстах может иметь оттенок хитрости. «Рассудительным» сохраняет положительный смысл данного места без излишне отрицательного оттенка слова «хитрым».
