  text: Its net will become for you a strong refuge[b][a], and its cords garments of fine gold.
translation:
  language: ru
  text: Её сеть станет для тебя надёжным убежищем,[a][b] а её верёвки — одеждами из чистого золота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Её оковы станут для тебя крепкой защитой, а её ветви — одеянием славы». Это заметно отличается от сохранившегося еврейского чтения: «её сеть… её верёвки… одежды из чистого золота».'
    reason: alternative_reading
  - marker: b
    text: В еврейском образе сеть и верёвки, которые могут казаться стесняющими, представлены как защита и почётное облачение.
    reason: cross_reference
lexical_decisions:
- source_word: רִשְׁתָּהּ
  choice: её сеть
  rationale: Существительное רשת означает сеть или плетение. «Сеть» естественно передаёт еврейский образ и сочетается с упоминанием верёвок во второй части стиха.
- source_word: מְכוֹן עֹז
  choice: надёжным убежищем
  rationale: מכון обозначает утверждённое место, основание или обитель, а עז — силу и прочность. В данном образном контексте сочетание выражает защищённое, прочное место; «надёжное убежище» передаёт этот смысл естественным современным русским языком.
- source_word: חַבְלֹתֶיהָ
  choice: её верёвки
  rationale: חבל означает верёвку, шнур или связующую полосу. «Верёвки» сохраняют конкретность образа сети и его связь с тем, что первоначально может казаться стесняющим.
- source_word: בִּגְדֵי כָתֶם
  choice: одеждами из чистого золота
  rationale: בגדים — одежды, а כתם — чистое, драгоценное золото. Такая передача сохраняет возвышенный образ еврейского текста и не заменяет его греческим «одеянием славы».
- source_word: וְהָיְתָה לְךָ
  choice: и станет ... для тебя
  rationale: 'Форма выражает будущий результат: то, что воспринимается как сеть, станет для ученика защитой. Русское «станет для тебя» ясно передаёт эту перемену.'
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста с греческой параллелью
  choice: Основной текст переведён по еврейскому чтению «сеть… верёвки… одежды из чистого золота», а греческий вариант приведён в сноске.
  alternative: 'Следовать греческому: «оковы… защита силы; её путы/ветви… одеяние славы».'
  rationale: Здесь сохранился уверенно засвидетельствованный еврейский текст, поэтому он имеет приоритет. Греческая версия заметно отличается образами и может отражать иной еврейский протограф либо истолковывающий перевод; это различие нельзя скрывать.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но доступной образностью. Синтаксический параллелизм двух частей сохранён; неоднозначность метафоры не устранена поясняющим пересказом.
