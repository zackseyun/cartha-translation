translation:
  language: ru
  text: Если ты желаешь слушать[a], то примешь наставление; если преклонишь ухо[b], то станешь мудрым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст этого стиха труден и короче греческого. В греческом тексте: «Если полюбишь слушать, то примешь наставление, и если преклонишь ухо, то станешь мудрым». Перевод следует прежде всего еврейскому тексту, а греческий использует для уточнения смысла и восстановления полного параллелизма.'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «наклонишь своё ухо», то есть будешь внимательно слушать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תּוֹבֵא לִשְׁמֹעַ
  choice: Если ты желаешь слушать
  rationale: Необычная форма в сохранившемся еврейском тексте допускает оттенок желания или готовности; греческое ἐὰν ἀγαπήσῃς ἀκούειν подтверждает волевой смысл. «Желаешь слушать» естественно передаёт его по-русски.
- source_word: וְתֵט אָזְנְךָ
  choice: если преклонишь ухо
  rationale: Сохранена еврейская метафора внимательного слушания; выражение понятно в современном литературном русском и соответствует греческому κλίνῃς τὸ οὖς σου.
- source_word: תִּוָּסֵר
  choice: примешь наставление
  rationale: Форма от יסר обозначает получение наставления, вразумления или исправления. «Примешь наставление» передаёт пассивно-результативный смысл без излишне карательного оттенка.
- source_word: σοφὸς ἔσῃ
  choice: станешь мудрым
  rationale: Эта итоговая часть засвидетельствована в более полном греческом параллельном тексте, хотя отсутствует в приведённой краткой еврейской форме; перевод сохраняет греческий параллелизм.
