base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/019.yaml
  text: Draw near to her like one who plows and reaps[a], and wait for her abundant produce. For in her service you will labor only a little[b], and before long you will eat her fruit.
translation:
  language: ru
  text: Приблизься к ней, как пахарь и жнец[a], и ожидай её обильного урожая. Ведь в служении ей ты потрудишься совсем немного, а уже завтра[b] будешь есть её плоды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «как пахарь и сеятель» вместо «как пахарь и жнец».'
    reason: textual_variant
  - marker: b
    text: 'Буквально в еврейском тексте: «завтра». Здесь это может означать «вскоре»; в греческом тексте сказано «быстро».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּחוֹרֵשׁ וּכְקוֹצֵר
  choice: как пахарь и жнец
  rationale: 'Сохраняет краткий земледельческий образ еврейского текста: причастия обозначают пашущего и жнущего. Греческое разночтение отмечено отдельно.'
- source_word: קְרַב אֵלֶיהָ
  choice: Приблизься к ней
  rationale: Точно передаёт повеление приблизиться и сохраняет олицетворение Премудрости в женском образе.
- source_word: וְקַוֵּה
  choice: и ожидай
  rationale: Глагол выражает терпеливое ожидание с надеждой; в земледельческом контексте «ожидай» звучит естественно.
- source_word: לְרֹב תְּבוּאָתָהּ
  choice: обильного урожая от неё
  rationale: Передаёт и количественное значение רֹב, и сельскохозяйственный смысл תְּבוּאָה, при этом русская конструкция ясно относит урожай к олицетворённой Премудрости.
- source_word: בַעֲבֹדָתָהּ מְעַט תַּעֲבוֹד
  choice: трудясь ради неё, ты потрудишься совсем немного
  rationale: Сохраняет корневой повтор «труд/трудиться» и сравнительно малую меру усилий; «ради неё» естественнее буквального, но неясного «в её труде».
- source_word: וּלְמָחָר
  choice: а уже завтра
  rationale: Основной текст сохраняет конкретное еврейское «завтра» и не снимает его возможную идиоматичность; значение «вскоре» поясняется в сноске с учётом греческого параллельного текста.
- source_word: פִּרְיָהּ
  choice: её плоды
  rationale: Сохраняет плодовую метафору и женское олицетворение Премудрости; множественное число естественно в русском при глаголе «есть».
theological_decisions:
- issue: Олицетворение Премудрости в женском образе
  choice: Сохранить женские местоимения «ней», «неё», «её»
  alternative: Передавать Премудрость как безличное понятие
  rationale: Грамматика и контекст еврейского текста последовательно представляют Премудрость как женщину; обезличивание ослабило бы литературное и богословское напряжение образа.
- issue: Расхождение земледельческого образа в еврейском и греческом текстах
  choice: В основном тексте следовать еврейскому чтению «пахарь и жнец»
  alternative: Следовать греческому «пашущий и сеющий»
  rationale: Сохранившийся еврейский текст является первичным источником перевода; значимое греческое разночтение не устраняется, а приводится в сноске.
- issue: Временной смысл וּלְמָחָר
  choice: Оставить буквальное «уже завтра» с пояснением
  alternative: Передать идиоматически «вскоре» или «скоро»
  rationale: Так сохраняется выразительность и возможная неоднозначность еврейского текста, тогда как сноска сообщает вероятный идиоматический смысл и свидетельство греческого перевода.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Земледельческие образы переданы ясно и сжато; женское олицетворение Премудрости сохранено. Корневой повтор עבודה/עבד отражён словами «трудясь… потрудишься».
