  text: He will give understanding to your heart[a], and what you have desired will make you wise.
translation:
  language: ru
  text: Он даст твоему сердцу понимание[a], и то, чего ты желал, сделает тебя мудрым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Он Сам укрепит твоё сердце, и стремление к мудрости будет дано тебе». Еврейское свидетельство здесь гласит: «Он даст твоему сердцу понимание, и то, чего ты желал, сделает тебя мудрым».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהוּא
  choice: Он
  rationale: Местоимение мужского рода сохранено; с учётом греческого параллельного текста его наиболее вероятный референт — Господь, хотя в данной еврейской строке антецедент прямо не назван.
- source_word: יָבִין
  choice: даст … понимание
  rationale: Каузативная форма от בין означает «дать понять, наделить пониманием». Такая передача естественна по-русски и сохраняет направленность действия на сердце.
- source_word: לִבֶּךָ
  choice: твоему сердцу
  rationale: Сохранён библейский образ сердца как средоточия мысли, воли и внутреннего понимания, без сужения значения до одних эмоций.
- source_word: וַאֲשֶׁר אִוִּיתָה
  choice: и то, чего ты желал
  rationale: Относительная конструкция оставлена открытой, а אוה передано как «желать» без усиления до «страстно жаждать».
- source_word: יְחַכְּמֶךָּ
  choice: сделает тебя мудрым
  rationale: 'Каузативный смысл глагола חכם передан непосредственно: не просто «даст мудрость», а «сделает мудрым».'
theological_decisions:
- issue: К кому относится местоимение «Он»
  choice: К Господу, в согласии с греческим параллельным текстом
  alternative: К мудрости, размышлению либо иному не названному в этой строке субъекту
  rationale: В самой еврейской строке антецедент не выражен, однако греческая форма стиха связывает αὐτός с предшествующим упоминанием заповедей Господа. Перевод сохраняет местоимение и не добавляет имя «Господь» в основной текст.
- issue: Субъект второй части
  choice: «То, чего ты желал» само выступает грамматическим субъектом выражения «сделает тебя мудрым»
  alternative: 'Понять Господа как подразумеваемый субъект: «Он даст тебе желанную мудрость»'
  rationale: Еврейский текст допускает прямое чтение относительной конструкции как подлежащего перед יְחַכְּמֶךָּ. Эта несколько напряжённая формулировка сохранена, а не сглажена по греческому параллельному чтению.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа сердца. Обращение на «ты» соответствует форме единственного числа в еврейском тексте. Необычная логика второй части намеренно не устранена, поскольку отражает засвидетельствованное еврейское чтение.
