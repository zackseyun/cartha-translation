  text: It will be upon him like a heavy stone[a], and he will not delay to throw it off.
translation:
  language: ru
  text: Она будет лежать на нём, словно тяжёлый камень[a], и он не замедлит сбросить её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «словно камень ноши». В греческом тексте: «словно крепкий камень испытания», что добавляет к образу тяжести оттенок проверки.'
    reason: Различие между еврейским и греческим текстовыми свидетельствами существенно для смысла метафоры.
lexical_decisions:
- source_word: כְּאֶבֶן מַשָּׂא
  choice: словно тяжёлый камень
  rationale: כְּ отмечает сравнение, а מַשָּׂא означает ношу или груз. Естественное русское выражение «тяжёлый камень» сохраняет образ гнетущей тяжести без неуклюжего буквального оборота «камень ноши».
- source_word: תִּהְיֶה עָלָיו
  choice: она будет лежать на нём
  rationale: Оборот передаёт нахождение «на нём» и делает образ тяжёлого камня естественным по-русски. Женское «она» сохраняет подразумеваемую в контексте Премудрость.
- source_word: וְלֹא יְאַחֵר
  choice: и он не замедлит
  rationale: Глагол אחר в породе hифиль означает медлить или откладывать; «не замедлит» точно и литературно передаёт непосредственность действия.
- source_word: לְהַשְׁלִיכָה
  choice: сбросить её
  rationale: Глагол означает бросить или отбросить. «Сбросить» естественно продолжает образ лежащей на человеке тяжести, а женское местоимение сохраняет грамматическую отсылку к Премудрости.
theological_decisions:
- issue: Соотношение еврейского образа ноши и греческого образа испытания
  choice: В основном тексте сохранён засвидетельствованный еврейский образ тяжёлого камня; греческое уточнение вынесено в примечание.
  alternative: «словно тяжёлый камень испытания»
  rationale: Еврейский текст с высокой степенью надёжности говорит о камне как о ноше или грузе, тогда как греческий параллельный текст добавляет идею испытания. Включение «испытания» в основной текст смешало бы различающиеся свидетельства; примечание честно сохраняет значимый греческий вариант.
- issue: К чему относится женское местоимение
  choice: 'Сохранена отсылка к Премудрости: «она», «её».'
  alternative: Безличное «это» или местоимение мужского рода по слову «камень»
  rationale: Женские формы в еврейском и греческом текстах указывают на Премудрость как подразумеваемый предмет речи. Русское женское местоимение сохраняет эту связь и напряжение между лицом Премудрости и метафорой камня.
translation_notes:
  register: Современный литературный русский язык с простым, достойным синтаксисом. «Будет лежать на нём» сохраняет телесную наглядность образа; «не замедлит» придаёт изречению уместную для книги Премудрости краткость и торжественность.
