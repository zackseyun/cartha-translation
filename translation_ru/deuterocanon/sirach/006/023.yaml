translation:
  language: ru
  text: Послушай, сын мой, прими моё наставление и не отвергай моего совета.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сохранившаяся еврейская строка, приведённая для этого стиха, по-видимому, ошибочно соотнесена с ним или повреждена; перевод следует греческому параллельному тексту.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «дитя». В обращении мудреца к ученику употреблено традиционное «сын мой». Греческое γνώμην допускает также переводы «суждение» или «мнение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄκουσον
  choice: Послушай
  rationale: Естественный русский повелительный оборот, передающий призыв внимательно воспринять последующие слова.
- source_word: τέκνον
  choice: сын мой
  rationale: Хотя греческое слово шире и буквально означает «дитя, ребёнок», в контексте наставления мудреца ученику традиционный русский оборот «сын мой» точно передаёт педагогическое обращение.
- source_word: δέξαι
  choice: прими
  rationale: Передаёт не просто получение, а добровольное принятие наставления.
- source_word: γνώμην
  choice: наставление
  rationale: В данном контексте слово обозначает обдуманное суждение или указание мудреца; «наставление» естественно сочетается с призывом принять его и не сливается полностью с последующим «советом».
- source_word: ἀπαναίνου
  choice: не отвергай
  rationale: Передаёт отрицательное повеление со значением отказа или неприятия.
- source_word: συμβουλίαν
  choice: совета
  rationale: Точно и понятно передаёт совет мудреца, сохраняя достойный регистр литературы мудрости.
theological_decisions:
- issue: Выбор исходного свидетельства при несоответствии еврейской строки стиху
  choice: Перевод выполнен по согласному с контекстом греческому параллельному тексту, а несоответствие еврейской строки отмечено в сноске.
  alternative: Перевести представленную еврейскую строку как высказывание о сосуде горшечника и испытании человека.
  rationale: Представленная еврейская строка не соответствует содержанию Сир 6:23 и, по данным задания, является ошибочно соотнесённым или повреждённым свидетельством. Греческий текст даёт связное чтение, соответствующее контексту наставления.
translation_notes:
  register: Современный литературный русский язык; краткий, достойный наставительный стиль. Сохранён параллелизм двух повелений без архаизации.
