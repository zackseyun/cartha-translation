    reason: alternative_reading
lexical_decisions:
- source_word: דְּרֹש
  choice: Ищи
  rationale: Передаёт деятельный, настойчивый поиск; отличие от последующего בקש сохраняется выбором глагола «стремись».
- source_word: וַחֲקֹר
  choice: и исследуй
  rationale: Глагол חקר означает тщательное исследование; сочетание двух повелений подчёркивает усердный, вдумчивый поиск.
- source_word: בַּקֵּש
  choice: стремись
  rationale: В данном накопительном ряду естественно передаёт בקש и позволяет не повторять «ищи», сохраняя направленность к обретению мудрости.
- source_word: וּמְצָא
  choice: и найдёшь
  rationale: Еврейский текст буквально продолжает ряд повелений («и найди»), однако по-русски в этой конструкции естественнее результативное будущее «и найдёшь»; греческое разночтение вынесено в примечание.
- source_word: וְהֶחֱזַקְתָּהּ
  choice: Крепко держись её
  rationale: Порода hифиль глагола חזק с местоименным суффиксом выражает прочную привязанность или удержание; русский оборот сохраняет образ и женский референт.
- source_word: וְאַל תַּרְפֶּהָ
  choice: и не отпускай
  rationale: רפה здесь означает ослабить хватку, выпустить; краткий русский вариант естественно продолжает метафору удержания.
theological_decisions:
- issue: Референт местоименных суффиксов женского рода
  choice: Передать как «её», подразумевая олицетворённую Мудрость.
  alternative: Передать как «это», относя слова к наставлению или пониманию.
  rationale: Контекст главы изображает мудрость в женском образе, а женские суффиксы еврейского текста поддерживают эту персонификацию. Перевод не устраняет значимый литературно-богословский образ.
- issue: Расхождение еврейского и греческого текстов в формуле обретения
  choice: 'Основной текст следует еврейскому וּמְצָא: «и найдёшь».'
  alternative: 'Греческий параллельный текст: «и она станет тебе известна».'
  rationale: Сохранившийся еврейский свидетель имеет приоритет; заметное греческое разночтение приводится в сноске, не смешиваясь с основным текстом.
translation_notes:
  register: Современный литературный русский язык с кратким наставительным ритмом. Последовательность повелений передана энергично, а олицетворение Мудрости сохранено местоимением женского рода.
