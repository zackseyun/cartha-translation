    reason: textual_variant
lexical_decisions:
- source_word: לְאוֹהֵב אֱמוּנָה
  choice: верному другу
  rationale: Буквально еврейское выражение означает «любящему верность», однако в контексте Сир 6:14–16 речь идёт о надёжном друге. Греческое φίλου πιστοῦ прямо подтверждает смысл «верный друг».
- source_word: אֵין מְחִיר
  choice: нет цены
  rationale: מְחִיר обозначает цену или стоимость. Русское выражение «нет цены» естественно передаёт мысль о том, что такого друга невозможно оценить в денежном или меновом выражении.
- source_word: מִשְׁקָל
  choice: не измерить
  rationale: Слово связано с весом и взвешиванием; здесь метафорически говорится о невозможности определить меру. Глагольная формулировка звучит по-русски естественно и сохраняет образ неизмеримости.
- source_word: לְטוֹבָתוֹ
  choice: доброту его
  rationale: Еврейское слово указывает на его доброе качество, доброту или благо. «Доброту» сохраняет первичность еврейского свидетельства и не сводит выражение только к полезности или отвлечённой ценности.
