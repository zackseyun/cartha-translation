  language: ru
  text: Верному другу нет цены[a], и достоинства его не измерить[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «любящему верность»; в греческом тексте: «верному другу». В данном контексте имеется в виду друг, отличающийся верностью.'
    reason: alternative_reading
  - marker: b
