    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ
  choice: твои листья
  rationale: Хотя сохранившееся еврейское написание само по себе допускает понимание «на тебя», греческое τὰ φύλλα σου подтверждает чтение «твои листья»; оно также образует ясный параллелизм с «плодами» и образом дерева.
- source_word: תֹּאכַל
  choice: она пожрёт
  rationale: Глагол буквально означает «есть, пожирать». «Пожрёт» естественно передаёт разрушительное действие и сохраняет активный образ; местоимение указывает на подразумеваемую в контексте губительную силу.
- source_word: וּפֶרְיְךָ
  choice: твои плоды
  rationale: «Плоды» сохраняют древесную метафору и в русском естественно сочетаются с множественным «листья»; греческая параллель также употребляет множественное число.
- source_word: תְּשָׁרֵשׁ
  choice: погубит
  rationale: Еврейская форма трудна и может наводить на значение «искоренить», тогда как греческое ἀπολέσεις выражает уничтожение или утрату. «Погубит» передаёт несомненный разрушительный итог, не создавая неестественного образа выкорчёвывания плодов.
- source_word: וְהִנִיחַתְךָ
  choice: оставив тебя
  rationale: В данном контексте каузативная форма выражает оставление в определённом состоянии, что подтверждается греческим ἀφήσεις; деепричастный оборот естественно связывает итог с предшествующим разрушением.
- source_word: כְּעֵץ יָבֵשׁ
  choice: словно сухое дерево
  rationale: Прямой и выразительный перевод сравнения; «сухое» точнее сохраняет значение יָבֵשׁ, чем более толковательное «иссохшее».
theological_decisions:
- issue: Соотношение трудного еврейского текста и греческой параллели
  choice: Основываться на еврейском свидетельстве, привлекая греческое для прояснения образов листьев и уничтоженных плодов.
  alternative: 'Передать еврейское написание буквально: «На тебя она будет есть… и искоренит твой плод»; либо полностью воспроизвести греческий возвратный синтаксис: «Ты пожрёшь свои листья… и оставишь себя…».'
  rationale: Еврейский текст приоритетен, но в этом стихе несколько форм повреждены или неоднозначны. Греческая версия независимо сохраняет цельную древесную метафору и позволяет прояснить смысл, не устраняя текстовую трудность из примечаний.
translation_notes:
  register: Современный литературный русский язык с кратким, строгим ритмом. Глагол «пожрёт» сохраняет силу исходного образа, а «погубит» звучит естественно и не маскирует неопределённость, которая отмечена в сносках.
