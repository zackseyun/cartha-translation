lexical_decisions:
- source_word: מִשֹּׂנְאֶיךָ
  choice: от тех, кто ненавидит тебя
  rationale: Еврейское причастие буквально обозначает «ненавидящих тебя». Развёрнутая конструкция естественна для современного русского языка и точнее передаёт исходную формулировку, чем обобщающее «враги».
- source_word: הִבָּדֵל
  choice: держись подальше
  rationale: Повелительная форма породы нифаль от בדל призывает сознательно отделиться, отдалиться. «Держись подальше» ясно и естественно выражает это предостережение.
- source_word: וּמֵאֹהֲבֶיָך
  choice: а тех, кто любит тебя
  rationale: Сохранено первичное еврейское чтение «любящие тебя», не суженное до категории друзей. Союз «а» естественно передаёт резкий смысловой контраст между двумя частями изречения.
- source_word: הֵשָּׁמֵר
  choice: остерегайся
  rationale: Форма от שמר выражает необходимость беречься и проявлять настороженность. Русское «остерегайся» сохраняет повелительную силу и намеренно резкое предостережение.
theological_decisions:
- issue: Кого называет вторая часть стиха
  choice: тех, кто любит тебя
  alternative: друзей
  rationale: Сохраняется более широкое и неожиданное чтение сохранившегося еврейского текста אֹהֲבֶיךָ — «любящие тебя». Греческое φίλων («друзей») приведено в сноске как важное параллельное свидетельство, но не подменяет первичный еврейский источник.
- issue: Направленность предостережения во второй части
  choice: остерегайся тех, кто любит тебя
  alternative: будь осторожен с теми, кто любит тебя
  rationale: Более прямая формулировка отражает повторённый еврейский предлог מִן и глагол самосохранения, не смягчая заложенное в изречении напряжение.
translation_notes:
  register: Современный литературный русский язык с лаконичной формой мудрого изречения. Синтаксический параллелизм и резкий парадокс оригинала сохранены без конфессионального истолкования.
