  source_fidelity: '«Ведь бывает друг до поры» удачно передаёт כִּי יֵשׁ אוֹהֵב כְּפִי עֵת: речь о друге, чья дружба ограничена благоприятным временем или обстоятельствами. «В день беды он не устоит» сохраняет образ עמד («стоять, держаться стойко») и передаёт отсутствие верности в бедствии. Русский текст не добавляет отсутствующее в еврейском «твоей» (ср. греческий параллельный текст).'
  naturalness: Фраза краткая, ясная и афористичная; «ведь», «до поры» и «в день беды» естественны для современного литературного русского и уместны в жанре наставления.
