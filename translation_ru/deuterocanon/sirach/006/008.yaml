  text: For there is a friend for the occasion[a], and he will not stand firm in the day of distress.
translation:
  language: ru
  text: Ведь бывает друг до поры[a], и в день беды он не устоит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «друг на время»; возможно также: «друг, пока ему удобно». Еврейское выражение допускает несколько оттенков и указывает на дружбу, зависящую от обстоятельств.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹהֵב
  choice: друг
  rationale: Причастие буквально означает «любящий», однако в данном контексте употреблено как существительное со значением близкого человека или друга. Это подтверждает греческое φίλος.
- source_word: כְּפִי עֵת
  choice: до поры
  rationale: Буквально выражение связано с мерой или требованиями времени; идиоматически оно описывает дружбу, ограниченную благоприятными обстоятельствами. «До поры» естественно передаёт временный характер такой дружбы, не устраняя неоднозначность выражения.
- source_word: יַעֲמוֹד
  choice: устоит
  rationale: Глагол עמד буквально значит «стоять», а здесь подразумевает стойкость и верность во время испытания. «Устоит» сохраняет образ стояния и хорошо согласуется с греческим παραμείνῃ — «останется, пребудет».
- source_word: בְּיוֹם צָרָה
  choice: в день беды
  rationale: Перевод сохраняет еврейский оборот «день бедствия» в естественной для современного русского языка форме. צָרָה обозначает беду, тесноту или тяжёлое положение.
