translation:
  language: ru
  text: Сладкая речь[b] умножает друзей[a], а приветливые уста справляются о благополучии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «умножает любящего» затруднительно; в греческом тексте — «умножает его друзей». Здесь принят более ясный смысл греческой параллели.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «сладкое нёбо»; это образ приятной речи. В греческом тексте сходным образом сказано «сладкое горло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵךְ עָרֵב
  choice: сладкая речь
  rationale: Буквально «сладкое нёбо». Здесь часть речевого аппарата метонимически обозначает приятную речь; «сладкая речь» сохраняет вкусовой образ и звучит естественно по-русски. Греческое λάρυγξ γλυκύς («сладкое горло») подтверждает телесно-речевую метафору.
- source_word: יַרְבֶּה אוֹהֵב
  choice: умножает друзей
  rationale: 'Еврейское выражение буквально затруднительно: אוֹהֵב имеет форму единственного числа («любящий», «друг»). Греческая параллель φίλους αὐτοῦ («его друзей») ясно передаёт предполагаемый смысл, поэтому множественное число отражено в основном тексте, а расхождение отмечено в сноске.'
- source_word: שִׂפְתֵי חֵן
  choice: приветливые уста
  rationale: Буквально «уста благоволения/приязни». «Приветливые» естественно выражает доброжелательность חֵן, а «уста» сохраняют образ оригинала и поэтический параллелизм.
- source_word: שׁוֹאֲלֵי שָׁלוֹם
  choice: справляются о благополучии
  rationale: Еврейская идиома буквально означает «спрашивают о мире/благополучии» и относится к доброжелательному приветствию и расспросам о состоянии человека. Русское выражение сохраняет этот социальный смысл, не сводя שָׁלוֹם к абстрактному миротворчеству.
