  verdict: revise
  source_fidelity: Первая часть точно передаёт повеления הַט ... וְשָׂאֶהָ и сохраняет женское олицетворение мудрости. «Не тяготись» ослабляет תָּקוֹץ, которое выражает не просто ощущение обременительности, а неприятие, отвращение или досаду. «Узы» обоснованно опираются на греческую параллель, но трудность еврейского תַחְבּוּלוֹתֶיהָ следует формулировать в примечании точнее, не представляя значение «узы» как прямое и бесспорное значение еврейского слова.
  naturalness: «Склони своё плечо» — понятная литературная передача образа принятия ярма. «Не испытывай отвращения к её узам» несколько сильнее по тону, но естественно для современного литературного русского и лучше соответствует исходному глаголу. Точка с запятой делает две части краткого увещевания яснее.
  terminology: Женское «её» правильно сохраняет персонификацию мудрости. «Узы» соответствует греческому δεσμοί и образу дисциплинирующего ограничения. Примечание должно говорить о трудности еврейского слова, а не называть греческое чтение неуклюжим «её узами».
  issues:
  - severity: medium
    issue: «Не тяготись» недостаточно точно передаёт תָּקוֹץ.
    rationale: Это русское выражение означает главным образом «не считай тяжким» или «не уставай от», тогда как еврейский глагол указывает на отвращение, неприязнь либо досадливое неприятие. Следует сохранить эту более сильную семантику, не сводя её к физической или душевной тяжести.
  - severity: low
    issue: Формулировка примечания неточно описывает текстологическую ситуацию.
    rationale: Слова «еврейское слово, переданное как “узами”» могут создать впечатление, будто «узы» — прямое и ясное значение еврейского слова. Следует прямо отметить, что еврейское слово трудно, а «узы» поддержаны греческой параллелью.
