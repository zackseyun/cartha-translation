translation:
  language: ru
  text: Склони своё плечо и неси её; не испытывай отвращения к её узам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переданное здесь как «узы», трудно для толкования; греческий текст читает «её узы» и, вероятно, сохраняет подразумеваемый образ ограничивающей дисциплины мудрости.
    reason: textual_variant
lexical_decisions:
- source_word: הַט שִׁכְמְךָ
  choice: Склони плечо
  rationale: Императив הַט передаёт сознательное подчинение ноше; שִׁכְמְךָ буквально означает «твоё плечо». Такое выражение сохраняет телесный образ и звучит по-русски естественно и достойно.
- source_word: וְשָׂאֶהָ
  choice: и неси её
  rationale: Глагол נשׂא здесь обозначает несение ноши; местоименный суффикс женского рода относится к олицетворённой мудрости.
- source_word: וְאַל תָּקוֹץ
  choice: и не тяготись
  rationale: קוץ выражает сильное неприятие или отвращение. В контексте уз и дисциплины «не тяготись» естественно передаёт предостережение не роптать и не отвращаться, не усиливая русскую формулировку до эмоционально резкого «не испытывай отвращения».
- source_word: בְּתַחְבּוּלוֹתֶיהָ
  choice: её узами
  rationale: Еврейское чтение затруднительно; греческая параллель δεσμοῖς αὐτῆς ясно поддерживает «её узы». Этот вариант сохраняет образ сдерживающей дисциплины мудрости.
theological_decisions:
- issue: Олицетворение мудрости в женском роде
  choice: Сохранить форму «её»
  alternative: Передать мудрость безлично или средним родом
  rationale: Еврейские суффиксы женского рода и греческая параллель относятся к олицетворённой мудрости; сохранение женского рода передаёт литературно-богословский образ источника.
- issue: Текстуально трудное תַחְבּוּלוֹתֶיהָ
  choice: Передать как «её узы» с примечанием
  alternative: «её путями», «её наставлениями» или «её ограничениями»
  rationale: Масоретически не засвидетельствованное здесь еврейское чтение допускает иные лексические ассоциации, однако греческое δεσμοῖς поддерживает конкретный образ уз. Примечание сохраняет текстологическую прозрачность.
translation_notes:
  register: Современный литературный русский язык; краткая повелительная конструкция сохраняет телесный образ ноши и олицетворение мудрости. «Узы» выбраны как возвышенное, но общеупотребительное слово, соответствующее образности стиха.
