  text: For a fierce soul destroys its owner[a], and the rejoicing of an enemy overtakes him.
translation:
  language: ru
  text: Ибо необузданная душа погубит того, кто ею обладает, и сделает его поводом для радости врагов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально: «и радость врага настигнет их»; местоименный суффикс при последнем глаголе стоит во множественном числе и не согласуется с предшествующим единственным числом. В греческом тексте: «и сделает его радостью для врагов»; этот смысл отражён в основном тексте.'
    reason: textual_variant
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: душа
  rationale: Слово может обозначать душу, внутреннее «я», человека или жизнь. Здесь речь идёт о внутреннем складе человека; «душа» сохраняет антропологический образ еврейского текста и соответствует греческому ψυχή.
- source_word: עַזָּה
  choice: необузданная
  rationale: Прилагательное выражает силу и напор, но в данном предостережении имеет отрицательный смысл. «Необузданная» естественно передаёт губительную, не сдерживаемую нравственную силу, не сводя её просто к «злой», как в греческом переводе.
- source_word: תַּשְׁחִית
  choice: погубит
  rationale: Глагол שחת означает «губить, разрушать, портить». «Погубит» передаёт серьёзность саморазрушительных последствий и хорошо сочетается с одушевлённым объектом.
- source_word: בְּעָלֶיהָ
  choice: того, кто ею обладает
  rationale: Буквально — «её владельца/обладателя». Описательный оборот звучит по-русски естественнее, чем «её владелец», и сохраняет идею обладания, подтверждаемую греческим κτησάμενον.
- source_word: וְשִׂמְחַת שׂוֹנֵא
  choice: предметом злорадства врагов
  rationale: Буквально сочетание говорит о радости или ликовании врага. В контексте это вражеская радость по поводу падения человека; «злорадство» точно и естественно выражает отрицательную окраску, а «предметом» согласуется со смыслом греческой параллели.
- source_word: תַּשִּׂיגֵם
  choice: сделает его
  rationale: Еврейский глагол обычно означает «настигнет/достигнет», однако форма содержит суффикс множественного числа «их», не согласующийся с ближайшим антецедентом. Греческое ποιήσει αὐτόν («сделает его») даёт связный смысл и служит основанием для основного текста; трудность еврейского чтения отмечена в сноске.
theological_decisions:
- issue: Соотношение трудного еврейского чтения и связного греческого варианта во второй части стиха
  choice: 'Основной текст передаёт смысл греческой параллели: душа сделает человека предметом злорадства врагов.'
  alternative: «и радость врага настигнет их» либо «и ликование врага настигнет его»
  rationale: 'Еврейскому тексту отдаётся первенство, но его последняя форма трудна: местоименный суффикс стоит во множественном числе, а буквальная синтаксическая связь неясна. Греческая параллель сохраняет цельную мысль о том, что падение человека становится радостью врагов. Сноска открыто сообщает о расхождении и не скрывает неоднозначность источников.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрости. Оборот «того, кто ею обладает» выбран вместо буквального и менее естественного «её владельца»; «предметом злорадства» ясно передаёт смысл греческой параллели, не скрывая трудности еврейского текста.
