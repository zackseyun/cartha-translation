  text: For in the end you will find its rest[b][a], and it will turn for you into delight.
translation:
  language: ru
  text: Ибо со временем ты обретёшь её покой[a], и она станет для тебя отрадой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «впоследствии ты найдёшь её покой». Под «её» подразумевается олицетворённая мудрость; выражение может означать покой, обретаемый у неё или благодаря ей.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и она обратится для тебя в отраду»; речь идёт о том, что после труда и терпения мудрость приносит радость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָחוֹר
  choice: со временем
  rationale: Буквально слово указывает на то, что будет «после, впоследствии»; греческая параллель ἐπ᾽ ἐσχάτων подтверждает смысл конечного, позднейшего итога. «Со временем» естественно передаёт мысль о результате терпеливого следования мудрости.
- source_word: תִּמְצָא
  choice: ты обретёшь
  rationale: Глагол מצא означает «найти, обрести». «Обретёшь» естественно сочетается с «покоем» и сохраняет прямое обещание будущего результата.
- source_word: מְנוּחָתָהּ
  choice: её покой
  rationale: Суффикс женского рода отсылает к олицетворённой мудрости. Буквальное «её покой» сохраняет грамматическую связь и не уточняет сверх текста, идёт ли речь о покое, принадлежащем ей, или обретаемом у неё.
- source_word: וְתֵהָפֵךְ
  choice: и она станет
  rationale: Форма от הפך выражает перемену или превращение. В русском «станет для тебя отрадой» естественнее буквального «обратится для тебя в отраду», сохраняя результативный смысл.
- source_word: לְךָ
  choice: для тебя
  rationale: Дательный оборот обозначает личный результат и пользу для адресата.
- source_word: לְתַעֲנוּג
  choice: отрадой
  rationale: תענוג означает удовольствие, наслаждение, отраду. «Отрада» соответствует достоинству назидательной поэзии и выражает не просто развлечение, а переживаемую радость.
theological_decisions:
- issue: К кому относятся формы женского рода
  choice: Они относятся к олицетворённой мудрости в ближайшем контексте.
  alternative: Их можно понимать шире — как относящиеся к учению или к упражнению в мудрости.
  rationale: Еврейские формы женского рода и греческая параллель поддерживают связь с олицетворённой мудростью. Русское местоимение «она» естественно сохраняет эту персонификацию, не вводя дополнительного доктринального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном литературы мудрости. «Обретёшь» и «отрада» сохраняют достоинство стиха, оставаясь понятными обычному читателю; синтаксис краток и естественен.
