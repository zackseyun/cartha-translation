translation:
  language: ru
  text: Бывает друг — сотрапезник[a], но в день беды его не найти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «друг стола»; в греческом тексте — «сотрапезник», то есть тот, кто разделяет трапезу, но оказывается ненадёжным в беде.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте: «не будет найден»; в греческом — «не останется». Оба чтения говорят о том, что в беде такой друг исчезает.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹהֵב חָבֵר שֻׁלְחָן
  choice: друг — лишь сотрапезник
  rationale: Сжатое еврейское выражение описывает человека, чья дружба ограничивается общением за столом. «Сотрапезник» сохраняет образ совместной трапезы; «лишь» естественно передаёт подразумеваемое противопоставление следующей части стиха, не заменяя образ толкованием вроде «друг только в хорошие времена».
- source_word: וְלֹא יִמָּצֵא
  choice: его не найти
  rationale: Форма нифаль от מצא буквально означает «не будет найден». Русское «его не найти» звучит естественно и сохраняет чтение еврейского текста; греческое «не останется» отмечено в сноске как смысловой вариант.
- source_word: בְּיוֹם רָעָה
  choice: в день беды
  rationale: רָעָה здесь обозначает бедствие или несчастье, а не нравственное зло. «В день беды» кратко и ясно передаёт характерную для литературы мудрости формулу; греческое θλίψεως подтверждает значение бедствия и скорби.
