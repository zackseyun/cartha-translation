translation:
  language: ru
  text: Бывает друг, который становится врагом и предаёт огласке ссору, навлекающую на тебя позор.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «и ссору твоего позора раскроет». Еврейское выражение сжато и допускает разные оттенки связи между ссорой и позором.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשׁ אוֹהֵב
  choice: Бывает друг
  rationale: Причастие אוֹהֵב буквально означает «любящий», но в контексте наставления о дружбе и согласно греческому φίλος речь идёт о друге. Оборот «бывает друг» естественно передаёт существование такого типа друга.
- source_word: נֶהְפָּךְ לְשׂוֹנֵא
  choice: который становится врагом
  rationale: 'Оборот описывает перемену отношений: друг превращается в ненавистника, то есть врага. Такой перевод ясен и подтверждается греческим μετατιθέμενος εἰς ἔχθραν.'
- source_word: רִיב
  choice: ссору
  rationale: רִיב может означать спор, распрю или судебную тяжбу. Здесь, в контексте предавшего друга, «ссора» естественно передаёт межличностный конфликт, не придавая ему необоснованно юридического характера.
- source_word: חֶרְפָּתְךָ
  choice: навлекающую на тебя позор
  rationale: 'Буквальное сочетание «ссору твоего позора» по-русски неясно. Причастный оборот передаёт вероятную смысловую связь: разглашённая ссора становится причиной позора адресата, при этом сжатость оригинала отмечена в сноске.'
- source_word: יַחְשֹׂף
  choice: предаёт огласке
  rationale: Глагол означает «обнажить, раскрыть»; греческое ἀποκαλύψει также указывает на разглашение. «Предаёт огласке» естественно выражает публичное раскрытие постыдной ссоры. Настоящее время согласуется с русским обобщающим высказыванием.
