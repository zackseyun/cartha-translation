translation:
  language: ru
  text: Не отдавай себя во власть собственных желаний[a], иначе твоя сила будет истощена тебе во вред.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «Не падай в руку своей души». Здесь «душа» может означать внутреннее желание или влечение. В греческом тексте: «Не превозносись по совету своей души».'
    reason: Передать еврейский образ и существенное отличие греческой параллели.
  - marker: b
    text: 'Еврейский текст второй половины стиха труден; буквально он приблизительно читается: «и утучнишь (или: сделаешь сильной) свою силу против себя». В греческом тексте: «чтобы душа твоя не была растерзана, как бык». Перевод осторожно передаёт предупреждение о пагубных последствиях; его нельзя считать буквальным переводом неясной еврейской фразы.'
    reason: Сохранить текстологическую неопределённость и не скрывать расхождение еврейского и греческого свидетелей.
lexical_decisions:
- source_word: אַל תִּפּוֹל בְּיַד
  choice: Не отдавай себя во власть
  rationale: 'Буквально: «не падай в руку». В данном сочетании это образ попадания под чью-либо власть; по-русски естественно передаётся как добровольное подчинение себя этой власти.'
- source_word: נַפְשְׁךָ
  choice: собственных желаний
  rationale: נפש здесь может обозначать не только «душу», но также внутреннее влечение или желание. Контекст предостерегает от подчинения собственным побуждениям; множественное число естественно звучит по-русски и не превращает «душу» в отдельного властителя.
- source_word: חֵילֵךָ
  choice: твоя сила
  rationale: חיל допускает значения «сила», «мощь», «состояние/богатство». В контексте саморазрушительного действия наиболее уместно широкое значение «сила».
- source_word: וּתְעַבֶּה ... עָלֶיךָ
  choice: иначе твоя сила обернётся против тебя
  rationale: Еврейская фраза в дошедшем тексте трудна и не даёт надёжного однозначного смысла. Перевод сохраняет ясную идею того, что собственная сила становится губительной для человека, не вводя неподтверждённого конкретного образа.
theological_decisions:
- issue: Использование греческой параллели при трудном еврейском чтении
  choice: Передать стих как предостережение против подчинения собственным желаниям, ведущего к саморазрушению.
  alternative: '«Не падай в руку своей души и утучняй свою силу против себя»; либо по греческому тексту: «Не превозносись по совету своей души, чтобы душа твоя не была растерзана, как бык».'
  rationale: Первая половина еврейского текста допускает осмысленный идиоматический перевод, тогда как вторая текстуально и семантически неясна. Греческая параллель подтверждает общий мотив гибельных последствий самоугождения, но заметно расходится в деталях; поэтому детали не сглажены молча, а отмечены в сносках.
translation_notes:
  register: Современный литературный русский язык; наставительный и достойный тон. Выражение «отдавать себя во власть» понятно обычному читателю и сохраняет образ власти, присутствующий в еврейском обороте. Трудность второй строки вынесена в отдельную сноску.
