  text: A faithful friend is a bundle of life[b][a], and one who fears the Lord will attain him.
translation:
  language: ru
  text: Верный друг — узел жизни[a], и боящийся Господа обретёт его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «узел жизни, любящий верность». Греческий параллельный текст: «верный друг — лекарство жизни». Перевод сохраняет еврейский образ, а значение первой части уточняет по греческому тексту.'
    reason: alternative_reading
  - marker: b
    text: 'Последняя часть еврейского текста трудна: при слове «боящийся» не назван объект, а форма следующего глагола и его дополнения допускает неясное прочтение. В греческом параллельном тексте: «боящиеся Господа найдут его».'
    reason: textual_variant
lexical_decisions:
- source_word: צְרוֹר חַיִּים
  choice: узел жизни
  rationale: Буквально сохраняет выразительный еврейский образ чего-то связанного, сбережённого и драгоценного. Греческое φάρμακον ζωῆς («лекарство жизни») подтверждает жизнеподдерживающий смысл, но не заменяет основной еврейский образ.
- source_word: אוֹהֵב אֱמוּנָה
  choice: верный друг
  rationale: Переданный еврейский текст сжат и труден; буквально выражение означает «любящий верность». Греческое φίλος πιστός и контекст позволяют естественно понять его как характеристику надёжного, верного друга.
- source_word: יְרֵא
  choice: боящийся
  rationale: Причастие передано как обобщённое обозначение человека, что соответствует стилю наставлений Премудрости.
- source_word: וְאַל
  choice: и
  rationale: Обычное запретительное понимание формы («и не») здесь не даёт связного смысла. Координация поддерживается ясным греческим параллельным текстом.
- source_word: יַשִּׂיגֵם
  choice: обретёт его
  rationale: Еврейская форма допускает значение достижения или овладения, однако её число и объект в данном тексте проблематичны. «Обретёт его» сохраняет оттенок достижения ценного и согласуется с греческим εὑρήσουσιν αὐτόν — «найдут его».
- source_word: Κύριον
  choice: Господа
  rationale: Объект страха отсутствует в сохранившейся еврейской строке, но прямо дан в греческом параллельном тексте. Русская форма естественно передаёт «бояться Господа».
theological_decisions:
- issue: Восполнение объекта при слове «боящийся»
  choice: боящийся Господа
  alternative: боящийся
  rationale: Греческий параллельный текст прямо читает «боящиеся Господа» и проясняет трудный, сжатый еврейский текст, не привнося особого конфессионального толкования.
- issue: Референт местоимения в последней части
  choice: обретёт его — верного друга
  alternative: достигнет их / не настигнет их
  rationale: Еврейская форма текстологически трудна, тогда как греческий текст имеет ясное единственное число и соотносит местоимение с верным другом. Неопределённость еврейского свидетельства отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. «Узел жизни» намеренно сохраняет необычный исходный образ; «обретёт» звучит естественно и передаёт как нахождение, так и достижение драгоценного друга.
