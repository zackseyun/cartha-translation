base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/020.yaml
  text: It is difficult for a fool[b][a], and one lacking sense will not endure it.
translation:
  language: ru
  text: Для глупца она трудна[a], и неразумный не сможет её вынести[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «она тяжела для глупца»; буквально слово может описывать нечто искривлённое или труднопроходимое. Греческий текст: «она весьма трудна для необученных».'
    reason: lexical_alternative
  - marker: b
    text: «Неразумный» — буквально «лишённый сердца», то есть лишённый разумения. «Вынести» можно также понять как «выдержать» или «удержаться в ней»; последнее значение поддерживает греческий текст.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲקֻבָּה
  choice: трудна
  rationale: Редкое слово может обозначать нечто искривлённое, трудное или тяжёлое для прохождения. В данном контексте речь идёт о трудности мудрости для глупца; греческое τραχεῖά подтверждает значение «трудна, сурова», но еврейский текст не содержит явного усилителя «очень».
- source_word: לָאֱוִיל
  choice: для глупца
  rationale: Обычный термин литературы мудрости, обозначающий нравственную и рассудочную глупость, а не просто низкие умственные способности.
- source_word: וְלֹא יְכַלְכְּלֶנָּה
  choice: не сможет её вынести
  rationale: Глагол כלכל здесь допускает значения «выдерживать, переносить, удерживать». Перевод сохраняет образ трудного бремени и не сводит его исключительно к продолжительному пребыванию; греческий параллельный текст поясняет результат как неспособность оставаться в мудрости.
- source_word: חֲסַר לֵב
  choice: неразумный
  rationale: Буквально «лишённый сердца»; в древнееврейской антропологии сердце связано с разумением и рассудительностью. Естественный русский эквивалент — «неразумный».
- source_word: ἐμμενεῖ ἐν αὐτῇ
  choice: оставаться в ней (пояснение смысла)
  rationale: Греческий параллельный текст подчёркивает постоянство и верность мудрости; он служит проверкой контекста, но перевод следует прежде всего сохранившемуся еврейскому тексту.
theological_decisions:
- issue: Род местоимения, относящегося к мудрости
  choice: 'женский род: «она», «её»'
  alternative: 'средний род: «это»'
  rationale: В еврейском контексте подразумеваемая мудрость грамматически женского рода, а русский язык естественно сохраняет это согласование. Это не усиливает олицетворение сверх исходного контекста.
- issue: Характеристика человека без разумения
  choice: «неразумный» без указания пола
  alternative: «неразумный человек» или буквальное «лишённый сердца»
  rationale: Форма единственного числа мужского рода в еврейском выражает тип человека, а не ограничивает высказывание мужчинами. Русское субстантивированное прилагательное передаёт обобщённый характер сентенции.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Сохранён женский род подразумеваемой мудрости и параллелизм двух частей; неоднозначность редкого עֲקֻבָּה и глагола כלכל раскрыта в примечаниях.
