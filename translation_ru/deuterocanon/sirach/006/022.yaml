translation:
  language: ru
  text: Ибо наставление соответствует своему имени[a], а для многих оно неясно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Ибо мудрость соответствует своему имени, и многим она не очевидна». Еврейское свидетельство говорит о «наставлении», тогда как греческое — о «мудрости».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמּוּסָר
  choice: наставление
  rationale: Еврейское מוּסָר охватывает наставление, воспитание и исправляющую дисциплину. «Наставление» естественно звучит по-русски и сохраняет основной смысл еврейского чтения, не подменяя его греческим «мудрость».
- source_word: בִּשְׁמָהּ כֵּן הִיא
  choice: соответствует своему имени
  rationale: Выражение буквально указывает на соответствие предмета его имени. Такая формулировка ясна и не добавляет отсутствующего в тексте объяснения игры слов.
- source_word: נְכוֹחָה
  choice: ясно
  rationale: В сочетании с отрицанием и לְרַבִּים слово передаёт смысл явности или понятности; греческое φανερά подтверждает значение «явно, ясно».
- source_word: לְרַבִּים
  choice: для многих
  rationale: Естественная русская передача сочетания предлога לְ с «многие» в конструкции «для многих неясно».
theological_decisions:
- issue: Расхождение еврейского и греческого свидетельств в обозначении предмета
  choice: В основном тексте следовать еврейскому הַמּוּסָר — «наставление»
  alternative: Следовать греческому σοφία — «мудрость»
  rationale: Сохранившееся еврейское свидетельство имеет приоритет для основного текста. Поскольку греческий параллельный текст существенно расходится с ним, его чтение отмечено в сноске без сглаживания различия.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка. Сохранена необычная мысль о соответствии имени без попытки объяснить возможную игру слов, не раскрытую самим стихом.
