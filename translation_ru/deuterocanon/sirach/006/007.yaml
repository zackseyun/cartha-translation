  text: If you acquire a friend, acquire him through testing, and do not quickly put your trust in him.
translation:
  language: ru
  text: Если приобретаешь друга, приобретай его через испытание[a] и не спеши ему доверять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приобретай его, испытав». Еврейское выражение допускает смысл проверки человека или испытания, в котором обнаруживается его верность; глагол «приобретать» сохраняет несколько необычную метафору оригинала.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִיתָ / קְנֵהוּ
  choice: приобретаешь / приобретай его
  rationale: Глагол קנה означает «приобретать, обретать, получать»; греческие κτᾶσαι / κτῆσαι подтверждают эту метафору. Повтор корня сохранён, хотя по-русски выражение звучит несколько необычно.
- source_word: אוֹהֵב
  choice: друга
  rationale: В данном контексте אוֹהֵב обозначает личного друга; это подтверждает греческое φίλον.
- source_word: בְּנִסָּיוֹן
  choice: через испытание
  rationale: נסיון означает «испытание, проверка», а предлог בְּ допускает обстоятельственное или инструментальное понимание. «Через испытание» сохраняет эту смысловую широту и согласуется с греческим ἐν πειρασμῷ.
- source_word: וְאַל תְּמַהֵר
  choice: и не спеши
  rationale: Естественная русская передача предостережения не действовать поспешно.
- source_word: לִבְטוֹחַ עָלָיו
  choice: ему доверять
  rationale: בטח с על выражает доверие к человеку или опору на него; в данном контексте «доверять» звучит естественно и точно.
theological_decisions:
- issue: Мужской род единственного числа в наставлении о дружбе
  choice: 'Сохранить форму мужского рода: «друга», «его», «ему»'
  alternative: Передать обобщённо и без указания рода
  rationale: Еврейский и греческий тексты употребляют единственное число мужского рода; русская форма естественно сохраняет грамматику источника.
- issue: Условный смысл первой части
  choice: Передать как «Если приобретаешь друга»
  alternative: Передать буквально как утверждение «Ты приобрёл друга»
  rationale: Хотя в приведённом еврейском тексте условная частица отсутствует, конструкция в контексте наставления и явное греческое εἰ поддерживают условное прочтение.
translation_notes:
  register: Современный литературный русский язык с кратким наставительным ритмом. Сохранены повтор глагола «приобретать» и образ испытания, несмотря на их некоторую необычность в русском.
