  text: You will wear her like garments of honor[a], and you will crown yourself with her like a crown of splendor.
translation:
  language: ru
  text: Ты облечёшь её в одежды славы и увенчаешь её венцом великолепия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «венец ликования»; при этом сказано, что ты возложишь его на себя. Основной текст следует сохранившемуся еврейскому чтению: Премудрость увенчивается «венцом великолепия».'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּגְדֵי כָבוֹד
  choice: одежды славы
  rationale: Сочетание буквально обозначает «одежды славы/почёта». «Одежды славы» сохраняет конкретный образ, возвышенное достоинство и соответствие греческому στολὴν δόξης; выражение при этом естественно для литературного русского языка.
- source_word: תִלְבְּשֶׁנָּה
  choice: облачишься в неё
  rationale: Глагол לבשׁ означает «надевать, носить», а суффикс женского рода указывает на персонифицированную Премудрость. Возвратная русская конструкция естественно передаёт образ человека, облекающегося в неё.
- source_word: וַעֲטֶרֶת תִּפְאֶרֶת
  choice: словно венцом великолепия
  rationale: תִּפְאֶרֶת может означать красоту, великолепие или славу. «Венец великолепия» передаёт торжественный образ и не повторяет слово «слава» из первой строки.
- source_word: תְּעַטְּרֶנָּה
  choice: увенчаешь себя ею
  rationale: Корень עטר выражает действие увенчивания или украшения венцом; суффикс женского рода вновь отсылает к Премудрости. Формулировка также согласуется с явно возвратным оборотом греческого параллельного текста.
theological_decisions:
- issue: Референт суффиксов женского рода
  choice: Сохранить персонификацию Премудрости с помощью местоимений «неё» и «ею».
  alternative: Передать только образы одежды и венца, не называя Премудрость местоимением женского рода.
  rationale: В ближайшем контексте Премудрость представлена как женщина. Явные местоимения сохраняют литературный и богословский образ исходного текста, не превращая его в отвлечённое понятие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной образностью, соответствующей поэтической речи Премудрости. Параллелизм двух частей и женская персонификация сохранены.
