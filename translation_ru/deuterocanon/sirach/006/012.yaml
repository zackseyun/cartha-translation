translation:
  language: ru
  text: Если тебя постигнет беда[a], он обернётся против тебя и скроется от тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Если ты будешь унижен» — вместо еврейского: «Если тебя постигнет беда».'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם תַּשִּׂיגְךָ רָעָה
  choice: Если тебя постигнет беда
  rationale: Условная конструкция передаёт еврейское אִם; глагол השיג означает «настичь, постичь», а רעה здесь обозначает бедствие или несчастье, а не нравственное зло.
- source_word: יֵהָפֵךְ בְּךָ
  choice: он обернётся против тебя
  rationale: Сочетание הפך с ב описывает перемену отношения, которая в контексте ненадёжного друга становится враждебным поворотом.
- source_word: וּמִפָּנֶיךָ יִסָּתֵר
  choice: и скроется от тебя
  rationale: Буквально говорится о том, что человек скроется «от твоего лица»; современное русское выражение естественно передаёт намеренное уклонение от попавшего в беду.
- source_word: ἐὰν ταπεινωθῇς
  choice: если тебя унизят / если ты окажешься унижен
  rationale: Греческий параллельный текст содержит отличное от еврейского условие — «если будешь унижен (приведён в униженное положение)»; оно отмечено в сноске, но не заменяет сохранившееся еврейское чтение.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческого параллельного чтения
  choice: 'В основном тексте следовать еврейскому: «Если тебя постигнет беда».'
  alternative: 'По греческому: «Если тебя унизят» или «Если ты окажешься унижен».'
  rationale: Сохранившийся еврейский свидетель принят за основной, однако существенное расхождение греческой традиции не устраняется и приводится в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая назидательная формулировка сохранена. «Обернётся против тебя» передаёт резкую перемену отношения без разговорной сниженности.
