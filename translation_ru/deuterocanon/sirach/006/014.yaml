translation:
  language: ru
  text: Верный друг — крепкое убежище[a]; кто нашёл его, тот нашёл сокровище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Дошедший до нас еврейский текст здесь труден и заметно отличается от греческого свидетельства. Более буквально по переданному еврейскому тексту: «Любящий верность — любящий силу; кто нашёл его, нашёл богатство»; синтаксис первой части и отнесение местоимения не вполне ясны. В основном тексте передан более ясный смысл греческой параллели: «Верный друг — крепкое убежище».'
    reason: textual_variant
lexical_decisions:
- source_word: אוֹהֵב אֱמוּנָה
  choice: верный друг
  rationale: Сохранившийся еврейский текст буквально и синтаксически труден («любящий верность»), тогда как греческое φίλος πιστός ясно означает «верный друг» и естественно согласуется со второй частью изречения.
- source_word: תְּקוֹף
  choice: надёжное убежище
  rationale: Само еврейское слово в данной строке передаёт идею силы, но сочетание неясно; греческое σκέπη κραταιά означает прочное, сильное укрытие. «Надёжное убежище» естественно по-русски передаёт защитную метафору и её оценочный смысл.
- source_word: וּמוֹצְאוֹ
  choice: кто нашёл его
  rationale: Местоименное дополнение единственного числа отнесено к другу; мужской род в русском языке ясен и соответствует греческому αὐτόν.
- source_word: הוֹן
  choice: сокровище
  rationale: Еврейское הוֹן может означать богатство или достаток, а греческое θησαυρόν прямо означает «сокровище». Этот вариант лучше сохраняет образ и выразительность изречения.
theological_decisions:
- issue: Выбор между трудным еврейским чтением и ясным греческим параллельным свидетельством
  choice: 'Основной текст следует связному смыслу греческого свидетельства: «Верный друг — надёжное убежище».'
  alternative: 'Более буквально по дошедшему еврейскому тексту: «Любящий верность [любит / есть] силу, и кто нашёл его, нашёл богатство».'
  rationale: Еврейская строка в переданном виде синтаксически и семантически затруднительна, а греческий текст образует ясное изречение и естественно связывает обе его части. Неопределённость еврейского свидетельства открыто отмечена в сноске, без догматического разрешения текстологического вопроса.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная афористическая форма. «Надёжное убежище» звучит естественнее, чем буквальное «сильное укрытие», и сохраняет метафору защиты. Повтор «нашёл» намеренно сохранён ради структуры исходного изречения.
