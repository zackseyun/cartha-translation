translation:
  language: ru
  text: Когда тебе хорошо, он такой же, как ты, но в беде он отдалится от тебя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте вместо «он отдалится от тебя» сказано: «а с твоими слугами будет говорить смело». Основной текст следует сохранившемуся еврейскому свидетельству; греческий вариант приведён из-за существенного расхождения.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטוֹבָתְךָ
  choice: когда тебе хорошо
  rationale: Тובה обозначает благоприятные обстоятельства или благополучие; контекстуальная формулировка естественна по-русски и не сужает смысл до материального достатка.
- source_word: הוּא כָמוֹךָ
  choice: он такой же, как ты
  rationale: Прямое сравнение сохраняет еврейское «он как ты» и поддерживается греческим ὡς σύ; речь, вероятно, о мнимом друге, который в благополучии держится наравне с человеком.
- source_word: וּבְרָעָתְךָ
  choice: но в беде
  rationale: רעה в антитезе к טובה означает неблагоприятные обстоятельства, несчастье или беду; «но» естественно выражает противопоставление двух частей стиха.
- source_word: יִתְנַדֶּה מִמֶּךָּ
  choice: он отдалится от тебя
  rationale: Возвратная порода глагола передаёт самостоятельное дистанцирование или отчуждение; «отдалится» сохраняет этот оттенок и звучит естественно в современном русском.
