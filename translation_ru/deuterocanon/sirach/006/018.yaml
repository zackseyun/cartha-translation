translation:
  language: ru
  text: Сын мой[a], с юности принимай наставление, и до седых волос достигнешь мудрости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «избери наставление», тогда как еврейский текст говорит: «прими наставление». Основной текст следует еврейскому свидетельству; оба варианта призывают с юности обратиться к наставляющему учению.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Сохраняет прямое обращение к ученику как к сыну, характерное для еврейской литературы мудрости.
- source_word: מִנְּעוּרֶיךָ
  choice: с юности
  rationale: Естественно и точно передаёт начало процесса в молодые годы; соответствует также греческому ἐκ νεότητός σου.
- source_word: קַח לֶקַח
  choice: принимай наставление
  rationale: קח буквально означает «возьми», а לקח — получаемое учение или наставление. В русском сочетание «принимай наставление» естественно выражает сознательное усвоение учения. Несовершенный вид уместно передаёт продолжительное жизненное действие.
- source_word: וְעַד שֵׂיבָה
  choice: и до седых волос
  rationale: Сохраняет конкретный еврейский образ седины как обозначения преклонного возраста, поддержанный греческим параллельным текстом.
- source_word: תַּשִּׂיג
  choice: достигнешь
  rationale: Передаёт основное значение достижения или обретения результата; не подменяет еврейское чтение греческим «найдёшь».
- source_word: חָכְמָה
  choice: мудрости
  rationale: Стандартный и контекстуально точный эквивалент ключевого термина литературы мудрости.
