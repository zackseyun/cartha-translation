translation_notes:
  register: Современный литературный русский язык с достоинством афористического наставления. Синтаксис краткий и ясный; сохранены сыновнее обращение и образ седых волос. Разночтение греческого текста («избери воспитание/наставление») не вынесено в сноску, поскольку русский основной текст непосредственно следует высоконадёжному еврейскому свидетельству, а различие не требуется для понимания стиха.
