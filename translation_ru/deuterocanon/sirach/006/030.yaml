translation:
  language: ru
  text: Её ярмо — золотое украшение[a], а её узы — шнур из сине-пурпурной нити[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст сохраняет здесь образ «ярма», тогда как греческая параллель говорит о «золотом украшении на ней». Перевод удерживает оба смысла: ярмо Мудрости оказывается драгоценным украшением.'
    reason: alternative_reading
  - marker: b
    text: 'Возможные варианты: «шнур из фиолетово-синей нити» или «шнур гиацинтового цвета». Еврейское слово обозначает характерный сине-фиолетовый или сине-пурпурный краситель либо окрашенный им материал; греческое слово также указывает на этот цветовой диапазон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻלֵּי / עֻלָּהּ
  choice: ярмо — … украшение
  rationale: Еврейский текст сохраняет образ ярма и, по-видимому, игру созвучных форм, соединяя бремя с драгоценным украшением. Греческая параллель подчёркивает именно украшение (κόσμος χρυσός). Формулировка удерживает оба смысловых плана.
- source_word: זָהָב
  choice: золотое
  rationale: Естественное русское определение, прямо передающее материал и ценность образа.
- source_word: מוֹסְרוֹתֶיהָ
  choice: узы
  rationale: Слово обозначает путы или то, чем связывают. «Узы» сохраняют образ подчинения мудрости, но звучат естественно и допускают положительную окраску связи.
- source_word: פְּתִיל
  choice: шнур
  rationale: Слово означает скрученную нить или шнур. «Шнур» лучше сохраняет вещественность и прочность образа.
- source_word: תְּכֵלֶת
  choice: сине-пурпурная нить
  rationale: Термин обозначает ценную окрашенную нить синего или сине-фиолетового оттенка; греческое ὑάκινθινον подтверждает этот цветовой диапазон. Описательный перевод понятен современному читателю и не создаёт ложной точности оттенка.
theological_decisions:
- issue: Дисциплина Мудрости изображена одновременно как ограничение и как красота
  choice: Сохранить в одном стихе как образы ярма и уз, так и образы золота и дорогой окрашенной нити
  alternative: Передать весь образ только как украшение либо только как тяжёлые путы
  rationale: 'Еврейский текст и греческая параллель вместе сохраняют напряжение между подчинением и драгоценной красотой: связь с Мудростью не только ограничивает, но и украшает. Перевод не устраняет эту многозначность.'
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным параллелизмом. «Ярмо» и «узы» сохраняют библейскую образность без архаической синтаксической тяжеловесности; цвет передан описательно и понятно.
