base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/006/035.yaml
  text: See who has understanding[a], and seek him out[b]; and let your foot wear out his threshold.
translation:
  language: ru
  text: Присмотрись к тому, кто разумен[a], и настойчиво ищи его; пусть твоя нога истирается у его порога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое свидетельство существенно отличается: «Желай слушать всякое слово о Боге, и пусть не ускользают от тебя разумные изречения». Оба чтения призывают ревностно стремиться к мудрости.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «пусть твоя нога истирается у его порога» — образ частых посещений дома мудрого человека, чтобы учиться у него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Посмотри
  rationale: Повелительная форма ראה призывает распознать и найти такого человека; «посмотри» сохраняет прямоту обращения и естественно вводит косвенный вопрос.
- source_word: מִי יָבִין
  choice: кто обладает разумением
  rationale: Фраза указывает на человека, отличающегося способностью понимать и рассуждать. «Обладает разумением» передаёт характеристику личности и сохраняет связь с тематикой литературы мудрости.
- source_word: וְשַׁחֲרֵהוּ
  choice: и усердно ищи его
  rationale: Глагол שחר здесь означает настойчиво, ревностно искать. Наречие «усердно» передаёт интенсивность, не навязывая возможный буквальный оттенок раннего поиска.
- source_word: וְתִשְׁחוֹק
  choice: пусть ... истирает
  rationale: Трудная форма в сочетании с ногой и порогом создаёт образ многократных посещений. «Истирает» сохраняет яркую гиперболическую метафору постоянства.
- source_word: בְּסִפּוֹ
  choice: его порог
  rationale: סַף означает порог или дверной порог. «Порог» естественен в современном литературном русском и сохраняет образ дома мудрого наставника.
- source_word: רַגְלְךָ
  choice: твоя нога
  rationale: Сохранено единственное число еврейского текста; в данном образном выражении оно понятно и стилистически уместно.
theological_decisions:
- issue: Выбор между существенно различающимися еврейским и греческим свидетельствами
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству как наставление настойчиво искать понимающего человека.
  alternative: 'Греческое чтение: «Желай слушать всякое слово о Боге, и пусть не ускользают от тебя разумные изречения».'
  rationale: Еврейский текст здесь связен и понятен, поэтому принят за основу. Греческое свидетельство существенно отличается словесно, но выражает близкий призыв ревностно стремиться к мудрости; его чтение сохранено в примечании без попытки искусственно объединить обе формы текста.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным наставлению мудрости. Образ истираемого порога сохранён, а интенсивность поиска выражена явно. Местоимения даны со строчной буквы, поскольку речь идёт о мудром человеке, а не о Боге.
