translation:
  language: ru
  text: Охотно слушай всякую беседу[a], и пусть не ускользнёт от тебя мудрое изречение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий параллельный текст: «Стой среди множества старцев и, если кто мудр, примкни к нему». Сохранившийся еврейский текст здесь существенно отличается; основной текст следует еврейскому свидетельству.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל שִׂיחָה
  choice: всякую беседу
  rationale: כָּל имеет распределительное значение, а שִׂיחָה обозначает речь или беседу. «Всякую беседу» естественно передаёт широту наставления, не сужая его до формальной речи.
- source_word: חֲפוֹץ לִשְׁמֹעַ
  choice: желай слушать
  rationale: חפץ выражает желание и расположенность, а לִשְׁמֹעַ — внимательное восприятие речи. Формулировка сохраняет волевой оттенок еврейского текста и звучит как прямое наставление.
- source_word: וּמְשַׁל בִּינָה
  choice: изречение, исполненное разумения
  rationale: מָשָׁל в литературе мудрости — краткое поучительное изречение или притча; здесь «изречение» не ограничивает жанр народной пословицей. בִּינָה характеризует его как несущее разумение; такая передача естественнее буквального «изречение разумения».
- source_word: אַל יֵצְאֶךָּ
  choice: да не ускользнёт от тебя
  rationale: Еврейская идиома буквально говорит о том, чтобы изречение не вышло или не прошло мимо адресата. «Да не ускользнёт от тебя» сохраняет образ и передаёт призыв не упустить мудрую мысль.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческого параллельного чтения
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству.
  alternative: 'Греческое чтение: «Стой среди множества старейшин и, если кто мудр, прилепись к нему».'
  rationale: Еврейский текст этого стиха сохранился и отмечен как свидетельство высокой надёжности, поэтому он имеет приоритет. Греческий текст представляет существенно иную формулировку со сходной общей темой обретения мудрости; это расхождение следует обозначить в сноске, а не смешивать два чтения.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для книги Премудрости. Синтаксис слегка возвышенный, но понятный; образ «не ускользнёт» удерживает выразительность оригинала без архаизации.
