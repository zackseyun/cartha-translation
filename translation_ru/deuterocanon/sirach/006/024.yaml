  text: Вставь ноги в её колодки, а шею — в её ошейник.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Данный еврейский текст не соответствует этому стиху по содержанию и, по-видимому, относится к другому месту; перевод выполнен по сохранившемуся греческому тексту.
    reason: Предоставленный еврейский источник отмечен как major_mismatch и говорит о плоде дерева, труде и склонности, тогда как греческий текст и традиционная нумерация содержат призыв поместить ноги в путы Премудрости и шею в её ошейник.
lexical_decisions:
- source_word: πέδας
  choice: оковы
  rationale: Греческое слово обозначает путы или кандалы; «оковы» естественно передаёт образ добровольного подчинения Премудрости.
- source_word: κλοιόν
  choice: ошейник
  rationale: Слово обозначает надеваемое на шею кольцо, хомут или ошейник. «Ошейник» сохраняет конкретный и суровый образ греческого текста, не превращая его в более отвлечённое «ярмо».
- source_word: αὐτῆς
  choice: её
  rationale: Женский род местоимения относится к Премудрости, олицетворённой в ближайшем контексте.
theological_decisions:
- issue: Суровый образ подчинения Премудрости
  choice: Сохранены образы оков и ошейника без смягчения.
  alternative: 'Передать свободнее: «прими её наставление» или заменить ошейник на ярмо.'
  rationale: Греческий параллельный текст намеренно использует образ уз, и его богословское напряжение не следует устранять истолковывающим переводом.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, образная и торжественная. Эллипсис «а шею —» устраняет ненужный повтор глагола, сохраняя ясный параллелизм.
