  text: Приблизься к ней всей душой и всеми силами держись её путей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πάσῃ ψυχῇ σου
  choice: всей душой
  rationale: Естественно и точно передаёт полноту внутренней устремлённости, выраженную греческим оборотом.
- source_word: πρόσελθε αὐτῇ
  choice: приблизься к ней
  rationale: Сохраняет прямое значение глагола προσέρχομαι и женский род местоимения, относящегося к мудрости в контексте.
- source_word: ἐν ὅλῃ δυνάμει σου
  choice: всеми силами
  rationale: Современный русский идиоматический эквивалент выражения «всей твоей силой».
- source_word: συντήρησον τὰς ὁδοὺς αὐτῆς
  choice: держись её путей
  rationale: Передаёт настойчивое соблюдение и неуклонное следование её путям; буквальное «храни её пути» по-русски могло бы ошибочно означать их защиту или сохранение.
