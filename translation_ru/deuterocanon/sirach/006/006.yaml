  source_fidelity: Первая половина точно передаёт אנשי שלומך и пожелательное יהיו רבים. Во второй половине смысл еврейского בעל סודך — человек, допущенный к сокровенному доверию/совету, — передан в целом верно, однако предложенное «поверенный твоих тайн» звучит не вполне естественно и несколько юридико-канцелярски. Греческое σύμβουλοι действительно представляет значимый вариант с акцентом на советниках.
  naturalness: '«Пусть будет много тех, кто живёт с тобой в мире» понятно, но естественнее назвать субъект прямо: «Пусть много людей живут с тобой в мире». «Поверенный твоих тайн» в современном литературном русском не является обычным обозначением близкого конфидента; глагольная передача «доверяй свои тайны» сохраняет смысл и звучит афористично.'
