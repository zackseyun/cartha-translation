lexical_decisions:
- source_word: אַנְשֵׁי שְׁלוֹמְךָ
  choice: тех, кто живёт с тобой в мире
  rationale: Буквально «люди твоего мира»; оборот обозначает людей, находящихся с кем-либо в мирных, добрых отношениях. Формулировка сохраняет образ мира и согласуется с греческим οἱ εἰρηνεύοντές σοι.
- source_word: יִהְיוּ רַבִּים
  choice: пусть будет много
  rationale: Передаёт побудительно-пожелательное значение древнееврейского имперфекта и естественно звучит по-русски.
- source_word: וּבַעַל סוֹדְךָ
  choice: поверенный твоих тайн
  rationale: Буквально «владеющий твоей тайной/сокровенным советом», то есть человек, допущенный к доверительному общению. Выражение сохраняет более личный оттенок еврейского סוד, не сводя его только к совету.
- source_word: אֶחַד מֵאָלֶף
  choice: один из тысячи
  rationale: Естественный русский оборот, выражающий исключительную редкость и строгую избирательность.
theological_decisions:
- issue: Выбор основного чтения при расхождении еврейского текста и греческой параллели
  choice: Основным принят еврейский текст с личным значением «поверенный твоих тайн».
  alternative: 'Следуя греческому οἱ δὲ σύμβουλοί σου, перевести: «советников же у тебя — один из тысячи».'
  rationale: Оба свидетеля противопоставляют множество мирных знакомых одному особо доверенному человеку. Сохранившийся еврейский текст первичен и через סוד подчёркивает тайну и близкое доверие; греческий сохраняется в примечании как значимое иное чтение.
translation_notes:
  register: Современный литературный русский язык; афористическая симметрия сохранена. «Поверенный твоих тайн» звучит достойно и понятно, передавая одновременно доверительность и сокровенность еврейского выражения.
