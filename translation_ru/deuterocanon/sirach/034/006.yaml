  verdict: revise
  source_fidelity: 'Основной смысл передан верно: отрицательное условие, источник «от Всевышнего», неуточнённое «в/при посещении» и повеление не отдавать сердца сохранены. Однако оборот «если только ... не» в русском языке может восприниматься как ограничительное условие («лишь если»), а не как греческое ἐὰν μὴ («если не» / «если только не» в значении unless), поэтому здесь он менее ясен.'
  naturalness: «Если это не послано Всевышним при посещении, не отдавай им своего сердца» — естественнее и однозначнее по-русски. Формула «при посещении» намеренно сохраняет сжатость и смысловую неопределённость греческого ἐν ἐπισκοπῇ; примечание поясняет возможные оттенки.
  terminology: '«Всевышний» точно и уместно передаёт Ὑψίστος. «Сердце» сохраняет образ оригинала. Местоимение «им» оправдано контекстуальной отсылкой к сновидениям и подобным явлениям; сноску следует ставить непосредственно при этом местоимении. В прежней сноске неверно названо буквальное направление: εἰς αὐτά — «им/к ним», не «в них».'
