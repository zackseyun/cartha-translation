translation:
  language: ru
  text: Если это не послано Всевышним при посещении[a], не отдавай им[b] своего сердца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «При посещении» можно также понять как «во время посещения» или как указание на божественную проверку либо надзор.
    reason: alternative_reading
  - marker: b
    text: 'То есть сновидениям и подобным явлениям, упомянутым в контексте; буквально: «им» или «к ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: Если только… не
  rationale: Передаёт отрицательное условие естественным современным русским оборотом, сохраняя силу предостережения.
- source_word: παρὰ Ὑψίστου
  choice: Всевышним
  rationale: Παρά с родительным указывает на источник, однако при русском страдательном обороте источник естественно выражается творительным падежом. «Всевышний» сохраняет божественный титул.
- source_word: ἀποσταλῇ
  choice: это не послано
  rationale: Аорист страдательного залога в условной конструкции передан русским страдательным оборотом; указательное «это» допускает отнесение к сновидению или явлению из контекста.
- source_word: ἐν ἐπισκοπῇ
  choice: при посещении
  rationale: «Посещение» сохраняет основной библейский образ ἐπισκοπή, а предлог «при» не фиксирует однозначно временное, целевое или надзорное значение выражения.
- source_word: μὴ δῷς
  choice: не отдавай
  rationale: Сохраняет повелительную форму и метафору передачи сердца, при этом по-русски звучит естественнее буквального «не давай».
- source_word: εἰς αὐτὰ
  choice: им
  rationale: Местоимение среднего рода множественного числа отсылает к сновидениям и подобным явлениям в контексте; русский перевод сохраняет анафорическую краткость.
- source_word: τὴν καρδίαν σου
  choice: своего сердца
  rationale: Сохраняет библейскую антропологическую метафору внутреннего доверия и расположения, не сводя её лишь к вниманию или рассудку.
theological_decisions:
- issue: Значение ἐν ἐπισκοπῇ
  choice: при посещении
  alternative: во время посещения; под надзором; для испытания
  rationale: Греческое выражение допускает значение божественного посещения, проверки или надзора. Основной текст сохраняет эту открытость, а примечание обозначает диапазон значений, не уточняя без основания характер Божьего действия.
- issue: Условная допустимость сновидения как посланного свыше
  choice: Сохранить условие без пояснения того, как распознать происхождение сновидения
  alternative: Уточнить, что речь идёт только о подтверждённом Богом откровении
  rationale: Стих допускает возможность посланного Всевышним явления, но не сообщает здесь критериев распознавания; перевод не добавляет конфессионального толкования.
translation_notes:
  register: 'Современный литературный русский язык с сохранением библейской образности. Выражение «при посещении» намеренно несколько необычно: оно удерживает смысловую широту греческого ἐν ἐπισκοπῇ, а примечание помогает читателю без навязывания одного толкования.'
