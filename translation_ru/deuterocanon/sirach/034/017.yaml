base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/017.yaml
  text: The cry of the poor passes through the cloud[a], and until it reaches him it does not rest. It does not cease until God attends[b], and the righteous Judge executes judgment.
translation:
  language: ru
  text: Вопль бедняка проходит сквозь облако и не утихает, пока не достигнет Бога. Он не умолкнет, пока Бог не обратит внимания и праведный Судья не совершит суд[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «восстановит справедливость». Еврейская идиома буквально означает «совершит суд».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст здесь существенно иной: «Очи Господа — на любящих Его; Он — могучая защита и крепкая опора, укрытие от зноя и тень от полуденного жара, охрана от преткновения и помощь от падения». Поэтому исходный текст этого стиха остаётся текстологически не вполне определённым.'
    reason: textual_variant
lexical_decisions:
- source_word: שועת דל
  choice: вопль бедняка
  rationale: שועה — настойчивый крик о помощи, вызванный бедствием; דל обозначает бедного, униженного или социально слабого человека. «Вопль бедняка» сохраняет и остроту обращения, и социальный смысл.
- source_word: ענן חלפה
  choice: проходит сквозь облако
  rationale: Буквальный образ изображает вопль, преодолевающий облако на пути к Богу. Единственное число «облако» соответствует еврейскому тексту.
- source_word: ועד תגיע לא תנוח
  choice: не утихает, пока не достигнет Бога
  rationale: Глаголы женского рода относятся к שועה, «воплю». Бог прямо назван в следующей строке и указан здесь как подразумеваемая цель; «не утихает» естественно передаёт образ не знающего покоя вопля.
- source_word: לא תמוש
  choice: он не умолкнет
  rationale: В данном контексте מוש выражает прекращение или отступление продолжающегося вопля. «Не умолкнет» сохраняет звуковой образ и настойчивость просьбы.
- source_word: יפקוד אל
  choice: Бог не обратит внимания
  rationale: פקד может означать заметить, посетить, заняться делом или вмешаться. Выбранная передача выражает действенное внимание Бога, не уточняя заранее характер последующего действия.
- source_word: ושופט צדק
  choice: и праведный Судья
  rationale: Сочетание естественно читается как наименование Бога — Судьи, отличающегося праведностью. Заглавная буква показывает личное именование в данном контексте, не устраняя синтаксической связи с предшествующим словом «Бог».
- source_word: יעשה משפט
  choice: не совершит суд
  rationale: Еврейская идиома буквально означает «совершит/сделает суд» и может подразумевать как вынесение решения, так и восстановление справедливости. Основной текст сохраняет судебную образность.
theological_decisions:
- issue: Подразумеваемая цель в выражении «пока не достигнет»
  choice: 'В тексте уточнено: «пока не достигнет Бога».'
  alternative: 'Оставить дополнение невыраженным: «пока не достигнет».'
  rationale: В еврейском дополнение отсутствует, однако в следующем предложении Бог назван прямо. Уточнение делает русскую фразу ясной, не вводя нового участника или богословского утверждения.
- issue: Значение משפט
  choice: «совершит суд» в основном тексте
  alternative: «восстановит справедливость» или «сотворит правосудие»
  rationale: Формулировка сохраняет юридическую метафору и связь с именованием Бога Судьёй, а смысловой вариант отмечен в сноске.
- issue: Соотношение Бога и «праведного Судьи»
  choice: «Праведный Судья» понято как относящееся к Богу наименование.
  alternative: Понять слова как синтаксически отдельное упоминание судьи.
  rationale: Контекст и параллельное построение естественно указывают на одного действующего субъекта, но перевод не перестраивает фразу так, чтобы устранить её исходное поэтическое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Повтор «не утихает / не умолкнет» сохраняет настойчивость вопля, не создавая тяжеловесной буквальности. Судебная лексика удержана, а возможный этический оттенок משפט вынесен в сноску.
