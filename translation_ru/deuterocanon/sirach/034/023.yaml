base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/023.yaml
  text: Whoever takes away a neighbor’s livelihood is murdering him[b][a], and whoever withholds a hired worker’s wages is shedding blood.
translation:
  language: ru
  text: Убивает ближнего тот, кто лишает его средств к существованию[a], и проливает кровь тот, кто удерживает плату наёмного работника[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отнимает средства к жизни». Греческое слово обозначает то, чем человек поддерживает своё существование.'
    reason: lexical_alternative
  - marker: b
    text: То есть неправомерно удерживает причитающуюся наёмному работнику плату. В греческом тексте это прямо названо пролитием крови, а не просто уподоблено ему.
    reason: ethical_force
lexical_decisions:
- source_word: φονεύων τὸν πλησίον
  choice: убивает ближнего
  rationale: Причастие φονεύων выражает прямую, обобщающую характеристику поступка. «Убивает» сохраняет резкую нравственную силу текста; πλησίον передано традиционным и понятным словом «ближний».
- source_word: ὁ ἀφαιρούμενος συμβίωσιν
  choice: тот, кто лишает его средств к существованию
  rationale: ἀφαιρέω означает «отнимать, лишать», а συμβίωσις здесь — средства, необходимые для жизни. Местоимение «его» естественно связывает выражение с «ближним» и не меняет смысла.
- source_word: ἐκχέων αἷμα
  choice: проливает кровь
  rationale: Сохранён библейский оборот, обозначающий кровопролитие и вину за гибель человека; он поддерживает намеренно сильный параллелизм стиха.
- source_word: ὁ ἀποστερῶν μισθὸν μισθωτοῦ
  choice: тот, кто не отдаёт наёмному работнику его плату
  rationale: ἀποστερέω в сочетании с платой означает неправомерно удерживать или не выплачивать причитающееся. Такая формулировка ясна современному читателю; μισθωτός — наёмный работник, μισθός — его плата.
theological_decisions:
- issue: Прямое приравнивание лишения средств к жизни и невыплаты заработка к убийству и кровопролитию
  choice: Сохранить прямые утверждения «убивает» и «проливает кровь»
  alternative: 'Смягчить сравнением: «подобен убийце» или «словно проливает кровь»'
  rationale: 'В греческом тексте нет сравнительных частиц: обе части построены как прямое нравственное отождествление. Смягчение ослабило бы сознательно резкое этическое напряжение стиха.'
translation_notes:
  register: Современный литературный русский язык с сохранением библейского выражения «проливает кровь». Синтаксический параллелизм и прямая нравственная сила греческого текста сохранены; формулировка понятна без специальной богословской подготовки.
