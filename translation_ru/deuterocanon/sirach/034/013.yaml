translation:
  language: ru
  text: Он не проявляет пристрастия к бедному[a] и слышит мольбы угнетённого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом свидетельстве: «Дух боящихся Господа будет жить, потому что они надеются на Того, Кто спасает их». Греческий текст здесь отражает существенно иную форму стиха, чем сохранившийся еврейский текст.'
    reason: textual_variant
lexical_decisions:
- source_word: לא ישא פנים
  choice: не проявляет пристрастия
  rationale: Еврейская идиома נשא פנים буквально означает «поднимать лицо», но обычно выражает благосклонность или пристрастное отношение. Выбранный перевод естественен для современного русского языка и сохраняет судебно-нравственный оттенок.
- source_word: אל דל
  choice: к бедному
  rationale: 'Предлог אל указывает на лицо, к которому направлено пристрастие. Перевод намеренно не добавляет «против»: это уточнение отсутствует в еврейском тексте и устранило бы присущую формулировке напряжённость.'
- source_word: דל
  choice: бедному
  rationale: דל обозначает бедного, слабого или социально уязвимого человека. «Бедному» — прямой и понятный эквивалент; оттенок уязвимости поддерживается второй частью стиха.
- source_word: ותחנוני
  choice: и мольбы
  rationale: תחנונים — настойчивые просьбы о милости или помощи. Морфологическое множественное число сохранено русским словом «мольбы».
- source_word: מצוק
  choice: угнетённого
  rationale: מצוק обозначает человека, находящегося под давлением, в бедствии или стеснённых обстоятельствах. «Угнетённого» хорошо передаёт социальный оттенок в параллели с бедным, хотя возможен и более общий перевод «бедствующего».
- source_word: ישמע
  choice: слышит
  rationale: Форма yiqtol в изречении выражает обычное, характерное действие; настоящее время по-русски естественно передаёт этот общеистинный смысл.
- source_word: πνεῦμα φοβουμένων Κύριον ζήσεται
  choice: не включено в основной текст
  rationale: Греческое свидетельство представляет существенно иную текстовую форму. Поскольку здесь сохранился еврейский текст, основной перевод следует ему, а греческий вариант приводится в сноске.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческого свидетельства
  choice: Основной текст следует еврейскому свидетельству Каирской генизы; греческое чтение вынесено в текстологическую сноску.
  alternative: «Дух боящихся Господа будет жить, потому что они надеются на Того, Кто спасает их».
  rationale: Греческий текст здесь не является близким словесным соответствием еврейскому, а отражает существенно другую форму стиха. При наличии еврейского свидетельства оно имеет приоритет, однако значимый греческий вариант необходимо сохранить для прозрачности.
- issue: Направленность выражения לא ישא פנים אל דל
  choice: «не проявляет пристрастия к бедному»
  alternative: «не относится пристрастно против бедного» / «не ущемляет бедного»
  rationale: Еврейский предлог אל естественно передаёт направленность благосклонности или пристрастия «к» человеку. Добавление отрицательной направленности «против» истолковало бы фразу сверх сказанного и сняло бы напряжённость между беспристрастностью и вниманием к мольбам угнетённого.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно возвышенный. Синтаксический параллелизм двух частей сохранён. Формулировка «к бедному» не расширена толкованием «против бедного», чтобы не устранять неоднозначность и богословскую напряжённость еврейского текста.
