  yaml_path: translation/deuterocanon/sirach/034/026.yaml
  text: A furnace tests the tempering in dipping[b][a]; so wine tests hearts in the strife of the proud.
translation:
  language: ru
  text: Печь испытывает закалку при погружении[a], так вино испытывает сердца в распре гордых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение в первой строке неясно. Его можно понять и более конкретно: «остриё при закаливании», либо более широко: «металлическое изделие при погружении».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в битве гордых». Греческое слово может означать как битву, так и распрю или иное столкновение.'
    reason: alternative_reading
lexical_decisions:
- source_word: κάμινος
  choice: печь
  rationale: Обозначает печь или горн, дающий сильный жар. «Печь» сохраняет образ испытания металла и остаётся понятным современному читателю.
- source_word: δοκιμάζει
  choice: испытывает
  rationale: Глагол означает проверку, выявляющую качество; «испытывает» естественно связывает обе части сравнения.
- source_word: στόμωμα
  choice: закалку
  rationale: Трудное слово может обозначать закаливание, твёрдость или остриё. В сочетании с печью и погружением «закалка» передаёт вероятный металлургический образ, не уточняя без достаточных оснований конкретное изделие.
- source_word: ἐν βαφῇ
  choice: при погружении
  rationale: βαφή связано с погружением и может обозначать также окрашивание либо закаливание погружением. Нейтральная формулировка сохраняет действие и не скрывает неоднозначности.
- source_word: οὕτως
  choice: так
  rationale: Кратко и естественно вводит вторую часть сравнения.
- source_word: οἶνος
  choice: вино
  rationale: Прямое и однозначное соответствие греческому слову.
- source_word: καρδίας
  choice: сердца
  rationale: Сохраняет множественное число и библейский образ сердца как внутреннего человека.
- source_word: ἐν μάχῃ
  choice: в распре
  rationale: μάχη может означать битву, борьбу, ссору или столкновение. «В распре» подходит к вызванному вином межличностному конфликту, не делая образ непременно военным.
- source_word: ὑπερηφάνων
  choice: гордых
  rationale: Передаёт нравственную характеристику людей, чья распря обнаруживает сердца.
theological_decisions:
- issue: Толкование трудного выражения στόμωμα ἐν βαφῇ
  choice: Металлургический образ закалки, испытываемой при погружении
  alternative: Остриё, испытываемое при закаливании; металлическое изделие, испытываемое при погружении или окрашивании
  rationale: Это прежде всего лексическая трудность, а не доктринальный вопрос. Перевод сохраняет общий образ проверки металла жаром и погружением, не выдавая узкую реконструкцию за несомненный смысл.
- issue: Значение ἐν μάχῃ ὑπερηφάνων
  choice: в распре гордых
  alternative: в битве гордых; в столкновении надменных
  rationale: Греческое выражение допускает как буквальную битву, так и более общее противоборство. Контекст вина позволяет понять его как распрю, в которой раскрывается внутренний человек, однако более военное значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Сохранены параллелизм двух частей, образ сердца и лексическая неоднозначность трудных греческих выражений; техническая конкретизация вынесена в сноску.
