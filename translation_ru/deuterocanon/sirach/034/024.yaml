  text: One builds and another tears down—what did they gain beyond toil?[a]
translation:
  language: ru
  text: Один строит, другой разрушает — что приобрели они, кроме тяжких трудов?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какую пользу получили они сверх понесённых трудов?» Греческий текст спрашивает, что осталось в итоге, когда один строит, а другой разрушает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδομῶν
  choice: строит
  rationale: Причастие настоящего времени употреблено в обобщённом изречении; «строит» естественно передаёт конкретный образ.
- source_word: καθαιρῶν
  choice: разрушает
  rationale: Глагол обозначает разбор или разрушение построенного; выбор сохраняет прямое противопоставление строительству.
- source_word: τί ὠφέλησαν
  choice: что приобрели они
  rationale: Аорист ὠφελέω ставит вопрос о полученной пользе или выгоде; форма множественного числа относится к обоим действующим лицам.
- source_word: πλεῖον ἢ
  choice: кроме
  rationale: В данном сравнительном обороте выражает отсутствие какого-либо результата сверх понесённых трудов; в русском риторическом вопросе «кроме» передаёт смысл естественно.
- source_word: κόπους
  choice: тяжких трудов
  rationale: κόπος означает изнурительный труд, тяготы или утомление; сочетание передаёт не просто работу, а её тягостность.
theological_decisions:
- issue: Неопределённые единичные действующие лица в изречении
  choice: Один строит, другой разрушает
  alternative: Один строящий и один разрушающий
  rationale: Греческие субстантивированные причастия имеют обобщённый характер. Русская конструкция «один… другой…» сохраняет его без добавления пола действующих лиц.
- issue: Смысл риторического вопроса
  choice: что приобрели они, кроме тяжких трудов?
  alternative: какую пользу получили они сверх трудов?
  rationale: Перевод сохраняет мысль о тщетности взаимно уничтожающих действий, не уточняя сверх сказанного в греческом тексте, была ли речь о материальной выгоде или более общем результате.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и dignified формулировка. Конкретный образ строительства и разрушения сохранён, а риторический вопрос передан без конфессионального истолкования.
