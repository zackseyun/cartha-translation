base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/018.yaml
  text: Even God will not delay[a], and like a warrior he will go out and not hold back, until he crushes the loins of the cruel, and repays vengeance to the nations; until he dispossesses the scepter of arrogance, and the staff of the wicked he will cut down completely.
translation:
  language: ru
  text: 'И Бог не замедлит[a]: как воин, Он выступит и не станет сдерживаться, пока не сокрушит поясницу жестокого и не воздаст народам возмездие; пока не упразднит скипетр дерзости и посох нечестивца не отсечёт окончательно.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст в этом месте гласит: «возвышая душу и просвещая очи, даруя исцеление, жизнь и благословение». Он отражает существенно иную текстовую традицию, чем сохранившийся еврейский текст.'
    reason: textual_variant
lexical_decisions:
- source_word: גם אל לא יתמהמה
  choice: И Бог не замедлит
  rationale: גם передаётся присоединительным и одновременно усилительным «и»; אל — «Бог»; לא יתמהמה означает, что Он не станет медлить. В данном отрывочном контексте «даже Бог» по-русски могло бы создать не подтверждаемое текстом противопоставление.
- source_word: כגבור יצא
  choice: как воин, Он выступит
  rationale: גבור в контексте суда обозначает могучего воина, а יצא — выход для действия или битвы. «Выступит» естественно передаёт военный образ.
- source_word: לא יתאפק
  choice: не станет сдерживаться
  rationale: Глагол выражает удерживание или обуздание себя; возвратная конструкция сохраняет этот смысл.
- source_word: ימחץ מתני אכזרי
  choice: сокрушит поясницу жестокого
  rationale: מחץ — сильный глагол «раздробить, сокрушить»; מתנים буквально обозначает чресла или поясницу и также связано с образом силы. «Поясница» сохраняет телесную метафору, оставаясь понятнее архаического «чресла».
- source_word: לגוים ישיב נקם
  choice: воздаст народам отмщением
  rationale: ישיב נקם выражает ответное, воздающее отмщение; дательный «народам» сохраняет направленность предлога ל и звучит естественно в литературной русской речи.
- source_word: יוריש שבט זדון
  choice: упразднит скипетр дерзости
  rationale: Hифиль ירש здесь передаёт лишение обладания или устранение; שבט в контексте власти — «скипетр», а זדון — вызывающая гордыня, дерзость. «Упразднит» передаёт устранение властного символа без добавления конкретного способа.
- source_word: מטה רשע
  choice: посох нечестивца
  rationale: מטה — посох или жезл; выбор «посох» сохраняет параллелизм со «скипетром», не стирая различия слов. רשע может обозначать нечестивого человека, поэтому сохранено возможное личное значение.
- source_word: גדוע יגדע
  choice: не отсечёт окончательно
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает действие. «Окончательно» передаёт эмфатическую силу, а «отсечёт» сохраняет конкретный образ рубки.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческого свидетеля
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству, а греческое чтение приведено в сноске.
  alternative: 'Греческий текст: «возвышая душу и просвещая очи, даруя исцеление, жизнь и благословение».'
  rationale: Греческое свидетельство содержит не вариант отдельных слов, а существенно иной текст. Их нельзя согласовать без искусственного изменения одного из чтений, поэтому различие сохранено открыто.
- issue: Личное или абстрактное понимание רשע в выражении מטה רשע
  choice: «посох нечестивца»
  alternative: «посох нечестия»
  rationale: Еврейская форма допускает субстантивное обозначение нечестивого человека; перевод сохраняет это прямое чтение, не исключая символического смысла образа власти.
translation_notes:
  register: Современный литературный русский с торжественным, но не чрезмерно архаичным звучанием. Военные и властные образы еврейского текста сохранены; местоимение «Он» написано с прописной буквы как принятая в русском религиозном регистре уважительная графика. Маркер [a] помещён непосредственно после относящегося к нему первого утверждения.
