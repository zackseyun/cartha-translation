    rationale: При глаголе «воздать» естественнее либо винительный объект («воздаст ... возмездие»), либо конструкция с «за». Последняя добавила бы отсутствующее в еврейском основание воздаяния. Замена на «воздаст народам возмездие» сохраняет синтаксическую открытость исходного לְ и делает строку нормативной.
  - severity: low
