  terminology: «Воздаст», «замыслу», «вступится», «спасением» согласованы с контекстом и не навязывают конфессионального толкования. Заглавные местоимения допустимы в заявленном регистре. Сноска корректно отмечает существенное расхождение греческого текста; её перевод адекватно передаёт смысл греческого параллельного чтения.
