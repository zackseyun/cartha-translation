  source_fidelity: 'Основной текст точно передаёт сохранившееся еврейское чтение: двукратное עד — «пока не», воздаяние за дело и по замыслу, судебно-защитное значение יריב ריב עמו и каузативное «обрадует» сохранены. Эллипсис во второй части («и каждому — по его замыслу») естественно подхватывает «воздаст» и не меняет смысла.'
