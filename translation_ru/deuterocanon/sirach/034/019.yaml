base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/019.yaml
  text: Until he repays a man for his deed[a], and a person's recompense according to his scheme; until he pleads the case of his people and gladdens them with his salvation.
translation:
  language: ru
  text: пока Он не воздаст человеку за его дело и каждому — по его замыслу; пока не вступится за Свой народ и не обрадует его Своим спасением.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся греческий текст Сир 34:19 вместо этого гласит: «Приносящий жертву из неправедно нажитого приносит порочный дар, и дары беззаконных не будут приняты». Сохранившееся еврейское свидетельство здесь существенно отличается от греческого.'
    reason: alternative_reading
lexical_decisions:
- source_word: עד
  choice: пока не
  rationale: В обоих полустишиях обозначает предел продолжающегося состояния, связанного с предыдущим стихом; по-русски конструкция «пока не» естественно передаёт это временное значение.
- source_word: ישיב לאנוש פעלו
  choice: Он не воздаст человеку за его дело
  rationale: ישיב здесь означает ответное воздаяние, а פעלו — совершённое человеком дело; «воздаст» сохраняет судебно-нравственный оттенок.
- source_word: וגמול אדם כמזימתו
  choice: и каждому — по его замыслу
  rationale: Сжатая русская формулировка передаёт воздаяние человеку в соответствии с его замыслом. «Замысел» сохраняет возможную нравственную неоднозначность מזמה, не делая отрицательную оценку обязательной.
- source_word: יריב ריב עמו
  choice: не вступится за Свой народ
  rationale: Однокоренная конструкция имеет судебный смысл ведения или отстаивания дела; «вступится за» естественно выражает защиту дела народа в современном русском языке.
- source_word: ושמחם
  choice: не обрадует его
  rationale: 'Передаёт каузативное значение: Он сделает народ радостным. Единственное число местоимения согласовано с собирательным существительным «народ».'
- source_word: בישועתו
  choice: Своим спасением
  rationale: «Спасение» сохраняет широкий смысл ישועה — избавление, помощь и победоносное спасение — без неоправданного сужения.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста с греческим
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству, а греческое чтение приведено в сноске.
  alternative: 'Перевести греческое чтение как основной текст: «Приносящий жертву из неправедно нажитого приносит порочный дар, и дары беззаконных не будут приняты».'
  rationale: При наличии еврейского текста он служит первичным источником. Однако греческий текст здесь не просто варьирует формулировку, а содержит совершенно иной стих, поэтому расхождение необходимо явно сохранить для читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные местоимения обозначают Бога в контексте. Параллелизм двух конструкций «пока не» сохранён; судебная метафора передана естественным выражением «вступится за».
