translation:
  language: ru
  text: Боящийся Господа не устрашится и не оробеет, потому что Он — его надежда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленная строка из еврейских рукописей Каирской генизы гласит: «Он не оставит без внимания крик сироты и вдову, когда она многократно жалуется». Она не соответствует греческому тексту этого стиха и, вероятно, оказалась здесь из-за несовпадения нумерации или ошибочного соотнесения строк.'
    reason: textual_variant
lexical_decisions:
- source_word: ὁ φοβούμενος Κύριον
  choice: Боящийся Господа
  rationale: Субстантивированное причастие передано как обозначение любого человека, почитающего Бога; единственное число и смысл страха Господня сохранены без архаизации.
- source_word: οὐ μὴ πτοηθῇ
  choice: не устрашится
  rationale: Усиленное отрицание с πτοέω выражает уверенность в том, что человек не будет испуган или приведён в смятение.
- source_word: οὐ μὴ δειλιάσῃ
  choice: не оробеет
  rationale: δειλιάω обозначает боязливость и утрату мужества; «не оробеет» сохраняет отличие от предыдущего глагола и естественно звучит по-русски.
- source_word: ὅτι αὐτὸς ἐλπὶς αὐτοῦ
  choice: потому что Он — его надежда
  rationale: αὐτός естественно относится к Господу, а ἐλπίς прямо передано словом «надежда»; местоименная форма сохраняет краткость греческого текста.
theological_decisions:
- issue: Расхождение между предоставленной еврейской строкой и греческим текстом Сир 34:14
  choice: В основном тексте перевести греческое чтение
  alternative: «Он не оставит без внимания крик сироты и вдову, когда она умножает жалобу»
  rationale: Предоставленная еврейская строка совершенно не совпадает по содержанию с греческим текстом данного стиха и, согласно метаданным, вероятно, ошибочно соотнесена с этой ссылкой. Поэтому связное греческое чтение Сир 34:14 положено в основу, а еврейское свидетельство прозрачно приведено в примечании.
- issue: Референт αὐτός в заключительной части
  choice: 'Понимать местоимение как указание на Господа: «Он — его надежда»'
  alternative: 'Повторить существительное: «Господь — его надежда»'
  rationale: Ближайший естественный референт — Господь. Местоимение сохраняет форму исходного текста, не меняя богословского смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным библейской книге Премудрости. Пара «не устрашится и не оробеет» передаёт близкие, но не полностью тождественные греческие глаголы; синтаксис остаётся ясным для широкого читателя.
