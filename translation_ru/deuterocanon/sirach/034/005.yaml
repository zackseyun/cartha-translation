base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/005.yaml
  text: Divinations and omens[b] and dreams are empty, and the heart imagines them like a woman in labor.[a]
translation:
  language: ru
  text: Гадания, толкования знамений[b] и сны пусты, и сердце рисует образы, словно женщина в родах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившаяся еврейская строка, указанная для этого стиха, гласит: «Добрым оком давай бедному и не сердись, когда даешь ему». По-видимому, она относится к другому стиху или взята из ошибочно соотнесенного свидетельства. Здесь переведен греческий текст.'
    reason: textual_variant
  - marker: b
    text: 'Или: «предзнаменования». Греческое слово означает истолкование знаков как предвестий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαντεῖαι
  choice: гадания
  rationale: Прямое и понятное обозначение практик, посредством которых пытаются узнать скрытое или будущее.
- source_word: οἰωνισμοί
  choice: толкования знамений
  rationale: Слово обозначает распознавание и истолкование знаков как предвестий; развернутая передача яснее современному читателю, чем специальный термин «авгурии».
- source_word: ἐνύπνια
  choice: сны
  rationale: Простая и точная передача без неоправданного усиления до «видений».
- source_word: μάταιά
  choice: пусты
  rationale: Передает тщетность и ненадежность перечисленного, сохраняя лаконичность оригинала.
- source_word: φαντάζεται
  choice: рисует образы
  rationale: Передает создание внутренних образов и фантазий, не сводя глагол к сознательному вымыслу и не добавляя оценки «обманывается».
- source_word: καρδία
  choice: сердце
  rationale: Сохраняет библейский образ внутреннего центра мысли и чувства.
- source_word: ὡς ὠδινούσης
  choice: словно женщина в родах
  rationale: Женская форма причастия и значение родовых мук требуют явного обозначения женщины; необычное сравнение сохранено, а не истолковано сверх текста.
theological_decisions:
- issue: Несоответствие сохранившейся еврейской строки греческому тексту Сир 34:5
  choice: Основной текст переведен по греческому свидетельству, а несоответствующая еврейская строка приведена в примечании.
  alternative: 'Перевести в основном тексте данную еврейскую строку: «Добрым оком давай бедному и не сердись, когда даешь ему».'
  rationale: Предоставленная еврейская строка не связана по смыслу с контекстом Сир 34:5 и помечена как major_mismatch. Греческий текст дает связное чтение данного стиха; текстологическая неопределенность открыто обозначена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Перечень передан ясно и ритмично; необычный образ сердца и женщины в родах сохранен без догматического или психологического истолкования.
