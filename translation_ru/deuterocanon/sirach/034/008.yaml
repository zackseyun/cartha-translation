translation:
  language: ru
  text: Без лжи исполнится закон, а мудрость — совершенство в устах верного.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная фраза в греческом тексте предельно сжата; возможно также: «мудрость — завершение в устах верного». Синтаксическая связь дательного оборота допускает несколько близких пониманий.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνευ ψεύδους
  choice: без лжи
  rationale: Прямо передаёт сочетание предлога со значением отсутствия и отвлечённого существительного ψεῦδος; формулировка естественна для русского афористического стиля.
- source_word: συντελεσθήσεται
  choice: исполнится
  rationale: Будущее страдательное от συντελέω обозначает доведение до конца или осуществление; в сочетании с νόμος русское «исполнится» сохраняет оба оттенка.
- source_word: νόμος
  choice: закон
  rationale: Основное и наиболее прозрачное соответствие νόμος; контекст не требует сужать значение до «наставления».
- source_word: σοφία
  choice: мудрость
  rationale: Обычное точное соответствие греческому слову.
- source_word: στόματι πιστῷ
  choice: в устах верного человека
  rationale: Дательный падеж естественно понимается как указание на сферу проявления мудрости. Добавление «человека» делает метонимию понятной по-русски, не устраняя образ уст.
- source_word: τελείωσις
  choice: совершенство
  rationale: Слово может обозначать завершение или доведение до совершенства; «совершенство» сохраняет краткую предикативную формулу и соответствует форме отвлечённого существительного.
theological_decisions:
- issue: Значение νόμος в контексте литературы мудрости
  choice: закон
  alternative: наставление
  rationale: Греческий текст прямо употребляет νόμος, а непосредственный контекст не даёт достаточных оснований заменять его более толковательным словом.
- issue: Синтаксическая связь στόματι πιστῷ с τελείωσις
  choice: «мудрость — совершенство в устах верного человека»
  alternative: «мудрость — завершение для верных уст»
  rationale: Заключительная именная конструкция предельно сжата. Основной текст предлагает естественное прочтение дательного как сферы проявления, а примечание сохраняет возможность иной связи, не выдавая её за несомненную.
translation_notes:
  register: Современный литературный русский язык; сохранены афористическая краткость, параллелизм двух частей и образ уст как обозначение речи. Союз «а» передаёт переход ко второй сентенции без навязывания резкого противопоставления.
