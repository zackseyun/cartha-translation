  text: Empty and false hopes are for a senseless man[b][a], and dreams give wings to fools.
translation:
  language: ru
  text: Пустые и ложные[a] надежды — удел неразумного человека, и сны окрыляют глупцов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тщетные и обманчивые».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сны дают глупцам крылья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κεναὶ
  choice: пустые
  rationale: 'Сохраняет основной образ κενός: надежды лишены содержания и основания. В современном русском сочетание «пустые надежды» естественно и ясно.'
- source_word: ψευδεῖς
  choice: ложные
  rationale: Передаёт значение «неистинные, ложные», не усиливая его до намеренного обмана.
- source_word: ἐλπίδες
  choice: надежды
  rationale: Прямое и естественное соответствие обычному значению ἐλπίδες.
- source_word: ἀσυνέτῳ ἀνδρί
  choice: у неразумного человека
  rationale: Дательная конструкция передана естественным русским оборотом обладания. «Неразумный» подчёркивает недостаток понимания и не сливается полностью с последующим ἄφρονας; «человек» сохраняет обобщающий характер изречения без неестественного для современного русского «муж».
- source_word: ἐνύπνια
  choice: сны
  rationale: Обычное значение слова; контекст не требует уточнения «сновидения» или «видения во сне».
- source_word: ἀναπτεροῦσιν
  choice: окрыляют
  rationale: 'Сохраняет образ крыльев в компактной и естественной русской форме. Возможный положительный оттенок русского глагола здесь переосмысляется контекстом: речь идёт о глупцах, увлекаемых снами.'
- source_word: ἄφρονας
  choice: глупцов
  rationale: Передаёт характерный для литературы мудрости тип человека, лишённого здравого рассуждения, и отличает его от «неразумного» в первой части.
theological_decisions:
- issue: Обобщающее мужское единственное число ἀσυνέτῳ ἀνδρί
  choice: неразумного человека
  alternative: неразумного мужчину / неразумного мужа
  rationale: В изречении ἀνήρ имеет обобщающий характер. Русское «человек» естественно передаёт этот смысл и не вводит ограничение только по полу, тогда как «муж» звучало бы архаично или могло бы пониматься как «супруг».
- issue: Образное значение ἀναπτεροῦσιν
  choice: окрыляют
  alternative: дают крылья / уносят
  rationale: Перевод сохраняет исходную метафору, не разрешая однозначно, означает ли она воодушевление, возбуждение воображения или увлечение прочь от действительности.
translation_notes:
  register: Современный литературный русский, краткий афористический строй. Синтаксис сохраняет параллелизм греческого текста; метафора крыльев передана без поясняющей вставки в основной текст.
