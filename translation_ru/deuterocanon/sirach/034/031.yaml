base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/031.yaml
  text: At a banquet of wine do not rebuke your neighbor[a], and do not belittle him in his gladness; do not speak a word of reproach to him, and do not distress him by making demands.
translation:
  language: ru
  text: На винном пиру не укоряй ближнего и не принижай его, когда он веселится; не говори ему слов укоризны и не тяготи его своими требованиями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не тяготи его, требуя возврата долга»; греческое слово может означать требование или взыскание, часто — причитающегося долга.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συμποσίῳ οἴνου
  choice: на винном пиру
  rationale: Передаёт общественную трапезу с вином кратко, естественно и без сниженного оттенка выражения «пьянка».
- source_word: ἐλέγξῃς
  choice: не укоряй
  rationale: В данном контексте речь идёт о порицании человека во время пира; «укорять» передаёт межличностный смысл, не добавляя идеи судебного обличения.
- source_word: πλησίον
  choice: ближнего
  rationale: Сохраняет традиционный этический смысл слова, хотя в непосредственной ситуации это также может быть товарищ по застолью.
- source_word: ἐξουδενώσῃς
  choice: не принижай
  rationale: Глагол означает считать кого-либо ничтожным или обращаться с ним как с ничтожным; «принижать» естественно выражает социальное действие, не сводя смысл лишь к внутреннему презрению.
- source_word: ἐν εὐφροσύνῃ αὐτοῦ
  choice: когда он веселится
  rationale: Естественно передаёт состояние праздничной радости человека и яснее по-русски, чем буквальное «в его веселии».
- source_word: λόγον ὀνειδισμοῦ
  choice: слов укоризны
  rationale: Сохраняет образ речи, несущей упрёк или поношение, и соответствует достоинству афористического стиля.
- source_word: θλίψῃς
  choice: не тяготи
  rationale: Передаёт причинение тяготы и давление без неоправданного усиления до физического притеснения.
- source_word: ἐν ἀπαιτήσει
  choice: своими требованиями
  rationale: 'Оставляет выражение достаточно широким: существительное может обозначать требование или взыскание, нередко связанное с получением причитающегося; долговой оттенок вынесен в примечание.'
