  source_fidelity: 'Хотя приведённая еврейская строка относится к иному, по-видимому перемещённому материалу, она прямо отмечена как major_mismatch. Перевод обоснованно следует связному греческому тексту: πολλὰ ἑόρακα передано как «Многое я видел», ἐν τῇ ἀποπλανήσει μου — как «в своих странствиях», а σύνεσίς μου и сжатое πλείονα τῶν λόγων μου — как «понимание моё превосходит мои слова». Неопределённость ἀποπλάνησις сохранена в примечании.'
