  text: I have seen many things in my wandering, and my understanding is more than my words.[b][a]
translation:
  language: ru
  text: Многое я видел в своих странствиях[b], и понимание моё превосходит мои слова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сохранившаяся здесь строка еврейских рукописей Каирской генизы не соответствует смыслу этого стиха и, по-видимому, представляет перемещённый материал. Поэтому перевод Сир 34:11 следует греческому свидетельству.
    reason: textual_variant
  - marker: b
    text: 'Или: «в своих блужданиях», «в своих скитаниях» либо «в своих заблуждениях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ ἑόρακα
  choice: Многое я видел
  rationale: Передаёт совершившийся опыт первого лица и сохраняет явный объект греческого выражения; по-русски звучит естественно и ясно.
- source_word: ἐν τῇ ἀποπλανήσει μου
  choice: в своих странствиях
  rationale: Слово ἀποπλάνησις допускает значения странствия, блуждания или уклонения. «В своих странствиях» сохраняет опытный, автобиографический смысл, не сводя выражение непременно к нравственному заблуждению.
- source_word: πλείονα τῶν λόγων μου
  choice: превосходит мои слова
  rationale: Сжатое греческое сравнение буквально соотносит понимание автора с его словами. Глагол «превосходит» делает фразу естественной по-русски, не добавляя определённого толкования о том, что именно слова не способны выразить.
- source_word: σύνεσίς μου
  choice: понимание моё
  rationale: В литературе мудрости σύνεσις обозначает понимание, разумение или проницательность. «Понимание» — наиболее прямой и общедоступный русский эквивалент.
theological_decisions:
- issue: Несоответствие между сохранившейся еврейской строкой и греческим свидетельством
  choice: Перевести стих по греческому тексту, отметив проблему еврейского свидетельства в сноске.
  alternative: Перевести приведённую еврейскую строку о дающем бедному и воздаянии Господа.
  rationale: Приведённая строка каирской генизы не соответствует смыслу Сир 34:11 и, вероятно, представляет перемещённый материал из другого места. Греческое свидетельство содержит связный текст данного стиха; следование ему с открытой текстологической оговоркой лучше всего сохраняет доступное древнее свидетельство.
translation_notes:
  register: Современный литературный русский язык с достоинством, подобающим книге Премудрости. Инверсия «понимание моё» сохраняет мерную, афористическую форму, не делая фразу архаичной; неоднозначность ἀποπλάνησις раскрыта в сноске.
