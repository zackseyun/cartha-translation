  text: For dreams have misled many[b][a], and those who hoped in them have fallen.
translation:
  language: ru
  text: Ведь сны ввели многих в заблуждение, и те, кто надеялся на них, пали.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потерпели неудачу» либо «пришли к гибели». Греческое слово буквально сохраняет образ падения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς
  choice: многих
  rationale: Винительный падеж множественного числа обозначает неопределённое множество людей; по-русски существительное «людей» естественно подразумевается.
- source_word: ἐπλάνησεν
  choice: ввели в заблуждение
  rationale: Глагол означает заставить сбиться с пути, ввести в заблуждение. Этот перевод сохраняет предостережение, не усиливая его до прямого обвинения в обмане.
- source_word: τὰ ἐνύπνια
  choice: сны
  rationale: Обычное и ясное русское обозначение сновидений; в данном контексте нет необходимости сужать смысл до особых «видений во сне».
- source_word: ἐξέπεσαν
  choice: пали
  rationale: Перевод сохраняет образ падения и не уточняет без достаточных оснований, идёт ли речь о неудаче, отпадении или гибели.
- source_word: ἐλπίζοντες
  choice: те, кто надеялся
  rationale: Причастие относится к подразумеваемым людям; развёрнутая конструкция звучит естественно в современном русском языке.
- source_word: ἐπʼ αὐτοῖς
  choice: на них
  rationale: Местоимение отсылает к снам; сочетание «надеяться на» нормативно и точно передаёт направленность упования.
theological_decisions:
- issue: Характер предостережения о снах
  choice: Стих предупреждает, что сны вводили многих в заблуждение, а упование на них приводило к падению.
  alternative: Стих без исключения осуждает любые сны либо говорит исключительно об ошибочном истолковании снов.
  rationale: Греческий текст прямо связывает заблуждение со снами и падение — с надеждой на них, однако не утверждает явно, что всякий сон при любых обстоятельствах ложен.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, афористичная и достойная. Союз «ведь» передаёт пояснительное γὰρ, а буквальный образ падения сохранён с пояснением в сноске.
