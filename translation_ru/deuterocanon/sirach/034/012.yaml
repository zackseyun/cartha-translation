translation:
  language: ru
  text: Ибо он — Бог справедливости, и у него нет лицеприятия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В предоставленной греческой параллели в издании Суита здесь стоит другое предложение: «Много раз я подвергался опасности до смерти и благодаря этому был спасён». Это указывает на расхождение текста или нумерации стихов. Перевод следует сохранившемуся еврейскому свидетельству.'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего запрета; «ибо» ясно передаёт причинную связь и соответствует возвышенному, но современному регистру.
- source_word: אלהי משפט
  choice: Бог справедливости
  rationale: Сочетание выражает справедливый характер Бога как Судьи. «Справедливость» естественно передаёт здесь нравственно-судебный смысл משפט, не сужая его до отдельного акта суда.
- source_word: אין עמו
  choice: у него нет
  rationale: Естественная русская передача еврейской конструкции, обозначающей отсутствие чего-либо у Бога или в его отношении к людям.
- source_word: משוא פנים
  choice: лицеприятия
  rationale: Устойчивый русский библейский и литературный эквивалент идиомы о пристрастном отношении к человеку из-за его положения или личности; сохраняет судебный оттенок.
theological_decisions:
- issue: Передача משפט в утверждении о характере Бога
  choice: справедливости
  alternative: суда; правосудия
  rationale: Контекст связывает Божий характер с неприятием подкупа и жертвы, добытой притеснением. «Справедливость» сохраняет как нравственный, так и судебный смысл, не превращая характеристику Бога только в указание на акт суда.
- issue: Расхождение между сохранившимся еврейским текстом и указанной греческой параллелью
  choice: Следовать сохранившемуся еврейскому свидетельству и отметить расхождение
  alternative: Перевести греческое предложение; объединить оба чтения
  rationale: Для данного места предоставлен уверенно засвидетельствованный еврейский текст, тогда как греческая параллель содержит совершенно иное предложение, что указывает на текстовое или стиховое несоответствие. Смешение чтений скрыло бы реальное состояние источников.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Ибо» сохраняет причинную связь, а «лицеприятие» — точный судебно-нравственный оттенок исходной идиомы. Местоимения, относящиеся к Богу, даны со строчной буквы как нейтральная современная орфографическая практика.
