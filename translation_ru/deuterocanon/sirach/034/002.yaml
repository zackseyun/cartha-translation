  text: Like one grasping at a shadow and chasing the wind[a], so is one who clings to dreams.
translation:
  language: ru
  text: Как хватающий тень и гонящийся за ветром — таков тот, кто полагается на сны.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто держится за сны»; или: «кто обращает внимание на сны». Греческий глагол может означать, что человек крепко держится за что-либо, полагается на него или уделяет ему внимание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δρασσόμενος
  choice: хватающий
  rationale: Причастие обозначает попытку схватить или удержать рукой; «хватающий тень» прямо и естественно передаёт образ тщетного действия.
- source_word: σκιᾶς
  choice: тень
  rationale: Здесь имеется в виду неуловимая тень, а не прохлада; форма без артикля естественна для русского сравнительного образа.
- source_word: διώκων ἄνεμον
  choice: гонящийся за ветром
  rationale: Сохраняет метафору тщетной погони и звучит естественно в современном литературном русском.
- source_word: ὁ ἐπέχων
  choice: тот, кто полагается на
  rationale: Глагол ἐπέχω допускает оттенки держаться за что-либо, опираться на него или обращать на него внимание. В данном сравнении «полагается на» ясно выражает зависимость от ненадёжного основания, не устраняя лексическую неоднозначность, отмеченную в сноске.
- source_word: ἐνυπνίοις
  choice: сны
  rationale: Множественное число обозначает сновидения или видения во сне; «сны» — наиболее ясный и естественный русский эквивалент.
theological_decisions:
- issue: Смысл выражения ὁ ἐπέχων ἐνυπνίοις
  choice: тот, кто полагается на сны
  alternative: тот, кто держится за сны; тот, кто обращает внимание на сны
  rationale: Контекст сравнивает такое отношение к снам с попыткой схватить тень и погоней за ветром. «Полагается на» передаёт подразумеваемое доверие, однако сноска сохраняет возможные оттенки привязанности и внимания, не превращая стих в более широкое осуждение всякого сна.
translation_notes:
  register: Современный литературный русский язык с краткой, ритмичной структурой сравнения. Сохранены оба исходных образа — хватание тени и погоня за ветром; тире естественно оформляет сопоставление.
