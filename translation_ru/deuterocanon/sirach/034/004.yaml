  text: From the unclean[a], what will be made clean? And from falsehood, what will become true?
translation:
  language: ru
  text: От нечистого что может быть очищено? И от ложного что окажется истинным?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может также означать «говорить правду», «быть истинным» или «подтвердиться». Основной текст передаёт его результативный смысл в параллели с первой частью стиха.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ
  choice: от
  rationale: В обеих частях обозначает источник или происхождение; русский предлог «от» естественно сохраняет эту связь.
- source_word: ἀκαθάρτου
  choice: нечистого
  rationale: Субстантивированное прилагательное среднего или мужского рода в родительном падеже оставлено обобщённым, без добавления конкретного предмета или лица.
- source_word: τί
  choice: что
  rationale: Вводит риторический вопрос о том, какой результат может произойти из названного источника.
- source_word: καθαρισθήσεται
  choice: может очиститься
  rationale: 'Передаёт пассивно-результативную направленность глагола и естественно выражает подразумеваемую невозможность в русском риторическом вопросе; буквальнее: «будет очищено».'
- source_word: ψευδοῦς
  choice: ложного
  rationale: Субстантивированное прилагательное передано обобщённо, чтобы не сужать смысл до единичной произнесённой лжи.
- source_word: ἀληθεύσει
  choice: окажется истинным
  rationale: Сохраняет возможный результативно-верификационный смысл глагола в параллели с καθαρισθήσεται и звучит естественнее, чем буквальное «будет истинствовать».
theological_decisions:
- issue: Смысл ἀληθεύσει в афористическом параллелизме
  choice: 'результативно-верификационный: «окажется истинным»'
  alternative: 'речевой: «скажет правду»; статально-результативный: «станет истинным»'
  rationale: Контекст сопоставляет результат, происходящий от нечистого, с результатом, происходящим от ложного. Формулировка не сводит глагол только к речи и при этом сохраняет его смысловую неоднозначность в примечании.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма и параллелизм греческого текста сохранены. Добавление модального «может» делает риторический смысл естественным по-русски, не превращая его в прямое догматическое утверждение.
