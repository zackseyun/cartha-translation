translation:
  language: ru
  text: Милость Яхве прекрасна во время бедствия[a], как дождевая туча во время засухи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Всевышний не благоволит к приношениям нечестивых, и множеством жертв нельзя умилостивить Его за грехи». Еврейское и греческое свидетельства в этом стихе существенно различаются.'
    reason: textual_variant
lexical_decisions:
- source_word: נאה
  choice: прекрасна
  rationale: Слово выражает красоту, приятность и уместность; «прекрасна» естественно передаёт благотворность своевременной милости, не сводя смысл лишь к отвлечённой уместности.
- source_word: חסד
  choice: милость
  rationale: В данном контексте это благожелательная помощь в нужде. «Милость» сохраняет широту еврейского слова и звучит естественно в русской библейской речи.
- source_word: יהוה
  choice: Яхве
  rationale: Передано как личное имя Бога, присутствующее в еврейском тексте, без замены титулом.
- source_word: בזמן מצוקה
  choice: во время бедствия
  rationale: Сочетание обозначает пору тесноты, тяжёлого положения или нужды; «бедствие» ясно и ёмко передаёт этот смысл.
- source_word: כעב חזיזים
  choice: как дождевая туча
  rationale: Образ указывает на тучу, несущую дождь; в сопоставлении с засухой важна именно животворная влага, а не угроза бури.
- source_word: בעת בצרת
  choice: во время засухи
  rationale: Фраза обозначает время сухости, когда земля иссушена; «засуха» делает сельскохозяйственный образ ясным и естественным.
theological_decisions:
- issue: Существенное расхождение еврейского и греческого текстов
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству.
  alternative: «Всевышний не благоволит к приношениям нечестивых и множеством жертв не умилостивляется за грехи».
  rationale: Еврейский текст здесь сохранился и имеет высокую степень достоверности, поэтому он положен в основу перевода. Совершенно иное греческое чтение сохранено в примечании, чтобы не скрывать текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Образ изложен ясно и без конфессионально обусловленных уточнений.
