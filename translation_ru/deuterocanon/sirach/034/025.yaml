  text: One is praying and one is cursing—whose voice will the Master listen to?
translation:
  language: ru
  text: Один молится, другой проклинает — чей голос услышит Владыка?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς … καὶ εἷς
  choice: один … другой
  rationale: По-русски эта контрастная конструкция естественно передаётся как «один … другой», сохраняя противопоставление двух лиц.
- source_word: εὐχόμενος
  choice: молится
  rationale: В данном противопоставлении с «проклинает» глагол означает обращение к Богу в молитве.
- source_word: καταρώμενος
  choice: проклинает
  rationale: Прямо передаёт действие произнесения проклятия, не уточняя его объект, отсутствующий в греческом тексте.
- source_word: τίνος φωνῆς
  choice: чей голос
  rationale: 'Сохраняет родительное вопросительное местоимение τίνος: вопрос поставлен о том, кому принадлежит голос, а не просто о выборе между двумя голосами.'
- source_word: εἰσακούσεται
  choice: услышит
  rationale: В контексте молитвы может подразумевать благосклонное выслушивание, однако нейтральное «услышит» сохраняет краткость и исходную смысловую напряжённость.
- source_word: ὁ δεσπότης
  choice: Владыка
  rationale: Передаёт титул δεσπότης как обозначение верховного Господина; прописная буква указывает на Бога в данном контексте.
theological_decisions:
- issue: Смысл «услышит» как простого восприятия или благосклонного ответа
  choice: услышит
  alternative: внемлет
  rationale: Перевод не решает явно, идёт ли речь только о слышании или о принятии молитвы; это сохраняет возможную богословскую напряжённость греческого εἰσακούσεται.
- issue: Передача божественного титула δεσπότης
  choice: Владыка
  alternative: Господь
  rationale: «Владыка» точнее отличает δεσπότης от обычного κύριος и не привносит иной исходный титул.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма, естественный контраст и риторический вопрос сохранены.
