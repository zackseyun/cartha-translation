  text: A man who has not been tested knows little, but one who has wandered[b] increases cunning[c][a].
translation:
  language: ru
  text: Кто не был испытан, тот мало знает; а кто странствовал[b], тот приумножает хитрость[c].[a]
  philosophy: optimal-equivalence
  footnotes:
