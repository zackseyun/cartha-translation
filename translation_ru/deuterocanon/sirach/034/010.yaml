    reason: alternative_reading
  - marker: c
    text: 'Или: «изворотливость», «сметливость». Греческое слово может обозначать практическую находчивость, но нередко имеет отрицательный оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς οὐκ ἐπειράθη
  choice: кто не был испытан
  rationale: Греческий аорист ἐπειράθη может указывать как на испытание, так и на приобретаемый через него опыт. «Не был испытан» сохраняет эту связь, не сводя смысл просто к неопытности.
- source_word: ὀλίγα οἶδεν
  choice: тот мало знает
  rationale: Естественная русская передача выражения об ограниченном знании.
- source_word: ὁ δὲ πεπλανημένος
  choice: а кто странствовал
  rationale: Причастие от πλανάω допускает буквальное странствование, уклонение с пути и состояние введённого в заблуждение. «Странствовал» сохраняет связь с опытом путешествий, а сноска отмечает отрицательные оттенки.
- source_word: πληθυνεῖ
  choice: умножает
  rationale: Формально близкая передача будущего времени со значением увеличения или приумножения.
- source_word: πανουργίαν
  choice: житейскую сметливость
  rationale: πανουργία может означать практическую находчивость, но часто имеет отрицательный оттенок хитрости. Сочетание подходит контексту приобретённого опыта, а сноска сохраняет неоднозначность.
theological_decisions:
- issue: Несоответствие между предоставленной еврейской строкой и греческим свидетельством
  choice: Перевести этот стих по греческому параллельному тексту и отметить расхождение в сноске
  alternative: 'Перевести предоставленную еврейскую строку: «Дай ему сообразно его дару тебе, с добрым оком и по мере возможностей»'
  rationale: Предоставленный еврейский текст не соответствует содержанию Сир 34:10, тогда как греческий текст непосредственно засвидетельствован под этой ссылкой. Поэтому основой перевода служит греческое свидетельство; текстологическая проблема не скрывается.
- issue: Оценка приобретённой через странствия способности
  choice: Сохранить напряжение между практической сметливостью и предосудительной хитростью
  alternative: Однозначно положительное «приобретает большой опыт» или однозначно отрицательное «умножает коварство»
  rationale: πανουργία в греческом может обозначать как находчивость, так и хитрость с отрицательным оттенком; контекст не требует устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой премудростного изречения. Родовая конструкция передана нейтральным «кто… тот». Неоднозначность ключевых греческих слов сохранена в основном тексте и пояснена сносками.
