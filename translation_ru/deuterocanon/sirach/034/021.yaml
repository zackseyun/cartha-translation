  text: Кто приносит жертву из имущества бедных, тот словно закалывает сына на глазах у его отца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Приносящий жертву из имущества бедных — закалывающий сына перед его отцом». Греческий текст представляет собой сжатое пословичное сравнение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θύων
  choice: словно закалывает
  rationale: Причастие означает «приносящий в жертву, закалывающий». «Закалывает» сохраняет резкую, насильственную образность, а «словно» ясно выражает сжатое подразумеваемое сравнение.
- source_word: υἱὸν
  choice: сына
  rationale: В греческом нет притяжательного местоимения; перевод не добавляет, чей это сын, и сохраняет конкретное значение «сын», а не более широкое «ребёнок».
- source_word: ἔναντι
  choice: на глазах у
  rationale: Естественное современное русское выражение непосредственного присутствия, усиливающее ужас описанной сцены без изменения смысла.
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: у его отца
  rationale: 'Местоимение наиболее естественно относится к сыну: действие совершается на глазах у отца этого сына.'
- source_word: ὁ προσάγων θυσίαν
  choice: Кто приносит жертву
  rationale: Идиоматично передаёт подлежащее и сохраняет культовый контекст принесения жертвы.
- source_word: ἐκ χρημάτων πενήτων
  choice: из имущества бедных
  rationale: χρήματα может обозначать деньги, собственность или имущество вообще; «имущество» сохраняет широту значения, а πενήτων передано множественным «бедных».
theological_decisions:
- issue: Сила сопоставления несправедливой жертвы с убийством сына
  choice: 'Сжатая греческая конструкция передана как явное сравнение: жертвователь словно закалывает сына на глазах у его отца.'
  alternative: 'Более буквальное, но тяжеловесное построение: «Закалывающий сына перед его отцом — тот, кто приносит жертву из имущества бедных».'
  rationale: Явное «словно» проясняет подразумеваемую сравнительную связь и сохраняет нравственную резкость осуждения богослужения, оплаченного имуществом бедных, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Формулировка лаконична и понятна; резкий образ оригинала сохранён. Маркер сноски поставлен непосредственно после предложения.
