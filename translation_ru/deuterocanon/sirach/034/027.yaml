  source_fidelity: 'Перевод точно передаёт афористическую структуру греческого текста: сопоставление вина с жизнью, условие умеренности, риторический вопрос и заключительное указание на радость людей. Основное чтение «у того, кто лишён вина» является допустимым и, вероятно, наиболее естественным для краткого ἐλασσουμένῳ οἴνῳ. Сноска надлежащим образом сохраняет альтернативное понимание дательного как указания на вред, причинённый вином. Расхождение с главным чтением английской audit trail оправдано, поскольку греческая конструкция неоднозначна, а исходный текст имеет приоритет.'
