base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/027.yaml
  text: Wine is like life to a man[a], if you drink it in due measure. What is life to one diminished by wine? For it too was created for human gladness.
translation:
  language: ru
  text: Вино для человека — как жизнь, если пьёшь его в меру. Что за жизнь у того, кто лишён вина?[a] Ведь и оно создано на радость людям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Что за жизнь у того, кого вино подкосило?» Греческий оборот краток и допускает понимание как недостатка вина, так и вреда, причинённого вином.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἴσον ζωῆς
  choice: как жизнь
  rationale: Оборот выражает сопоставимость или равноценность; «как жизнь» естественно передаёт образ, не превращая его в строгое тождество.
- source_word: ἀνθρώπῳ
  choice: для человека
  rationale: Дательный единственного числа имеет обобщающее значение; «для человека» естественно и точно передаёт его по-русски.
- source_word: ἐὰν πίνῃς αὐτὸν
  choice: если пьёшь его
  rationale: Сохранено прямое обращение во втором лице единственного числа и афористический характер условия.
- source_word: μέτρῳ αὐτοῦ
  choice: в меру
  rationale: Буквально речь идёт о мере; русское «в меру» ясно и естественно передаёт умеренность без лишнего истолкования.
- source_word: τίς ζωὴ
  choice: Что за жизнь
  rationale: Такой вопрос сохраняет краткость и риторическую выразительность греческого текста.
- source_word: ἐλασσουμένῳ οἴνῳ
  choice: у того, кто лишён вина
  rationale: ἐλασσόομαι может означать испытывать недостаток или быть лишённым; дательный οἴνῳ указывает, в чём состоит недостаток. Синтаксис краток, поэтому иное понимание отмечено в сноске.
- source_word: ἔκτισται
  choice: создано
  rationale: Перфект пассива указывает на сотворённость и сохраняющееся предназначение вина; краткая форма естественна в русском контексте.
- source_word: εἰς εὐφροσύνην ἀνθρώποις
  choice: на радость людям
  rationale: εὐφροσύνη обозначает радость и веселье; формулировка современна, dignified и точно передаёт назначение.
theological_decisions:
- issue: Положительное предназначение вина и требование меры
  choice: Вино создано на радость людям, но его употребление прямо ограничено мерой
  alternative: Сделать стих общим предостережением против вина либо оправданием неограниченного употребления
  rationale: Греческий текст одновременно утверждает благой сотворённый дар и ставит условие меры; перевод сохраняет это напряжение, не вводя конфессионального вывода.
- issue: Смысл ἐλασσουμένῳ οἴνῳ
  choice: тот, кто лишён вина
  alternative: тот, кого вино умалило или подкосило
  rationale: 'Наиболее прямое чтение допускает дательный отношения: человек испытывает недостаток вина. Однако греческий оборот сжат и допускает инструментальное понимание, поэтому альтернатива сохранена в сноске.'
translation_notes:
  register: Современный литературный русский язык с кратким афористическим ритмом. «В меру» звучит естественно и сохраняет ключевое ограничение. Частица «Ведь» передаёт пояснительную связь заключительной фразы с вопросом.
