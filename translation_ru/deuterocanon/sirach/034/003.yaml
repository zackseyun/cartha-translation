lexical_decisions:
- source_word: ὅρασις ἐνυπνίων
  choice: сновидение
  rationale: Компактное русское слово естественно передаёт видение во сне и сохраняет тесную связь двух греческих существительных без пояснительного расширения.
- source_word: τοῦτο κατὰ τούτου
  choice: это одно напротив другого
  rationale: Греческое выражение кратко и эллиптично; перевод сохраняет сопоставление или противопоставление двух предметов и подготавливает образ лиц, находящихся друг напротив друга.
- source_word: κατέναντι προσώπου
  choice: напротив лица
  rationale: κατέναντι обозначает положение напротив, лицом к чему-либо. Буквальная конструкция сохраняет синтаксический рисунок последующего образа.
- source_word: ὁμοίωμα προσώπου
  choice: подобие лица
  rationale: ὁμοίωμα означает подобие или образ. «Подобие» подчёркивает сходство, не отождествляя увиденное с самой действительностью.
theological_decisions:
- issue: Смысл изречения о сновидениях
  choice: Сохранён образ сновидения как подобия или соответствующего отображения, а не самой действительности.
  alternative: Понять выражение более определённо как указание на зеркальное отражение либо как общее сопоставление одного с другим.
  rationale: Контекст предостерегает от доверия снам, однако сам греческий текст остаётся сжатым и допускает несколько оттенков сравнительного смысла; перевод не усиливает его до однозначного философского утверждения.
translation_notes:
  register: Современный литературный русский язык с сохранением афористической краткости и намеренной образной шероховатости греческого текста. Двоеточие не добавлено, чтобы не делать вторую часть более строго пояснительной, чем допускает оригинал.
