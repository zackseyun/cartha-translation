translation:
  language: ru
  text: Она положила знаки благоволения[a], и крик заставил облако поспешить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «И кто его опора?» Греческое свидетельство резко отличается от сохранившегося здесь еврейского текста и, вероятно, отражает существенно иную форму строки.'
    reason: textual_variant
lexical_decisions:
- source_word: תמרורי
  choice: знаки
  rationale: Слово обозначает заметные указатели или признаки; «знаки» естественно передаёт образ, не сужая его до физических отметок и не истолковывая как предзнаменования.
- source_word: רצון
  choice: благоволения
  rationale: רצון здесь вероятнее всего означает благосклонность или благоволение. «Благоволение» сохраняет возвышенный поэтический регистр и связь со «знаками».
- source_word: הניחה
  choice: она установила
  rationale: Форма выглядит как женский род единственного числа от הניח — «положить, поместить, установить». Перевод сохраняет её грамматический род, хотя из-за отрывочности строки субъект неясен.
- source_word: וצעקה
  choice: и крик
  rationale: Форма понята как существительное «крик», вводящее вторую, резко присоединённую часть строки.
- source_word: ענן
  choice: облако
  rationale: Единственное число передано конкретным существительным без добавления отсутствующего в еврейском тексте определения.
- source_word: חשתה
  choice: заставил … поспешить
  rationale: Синтаксис строки труден, однако корень חושׁ выражает поспешность. Каузативная русская конструкция ясно передаёт вероятную мысль о том, что крик побуждает облако двигаться скорее.
theological_decisions:
- issue: Резкое расхождение сохранившегося еврейского текста с греческим свидетелем
  choice: В основном тексте переведена сохранившаяся еврейская строка, а существенно иное греческое чтение вынесено в сноску.
  alternative: «И кто служит ему опорой?»
  rationale: При наличии еврейского текста Сираха он принят за основное свидетельство. Однако греческая строка имеет совершенно иной смысл и, возможно, отражает другую еврейскую основу или иную стадию текста, поэтому различие нельзя скрывать.
translation_notes:
  register: Современный литературный русский язык с кратким, несколько загадочным поэтическим строем оригинала. Женский род «она установила» следует форме הניחה; неопределённость подразумеваемого субъекта намеренно не устранена.
