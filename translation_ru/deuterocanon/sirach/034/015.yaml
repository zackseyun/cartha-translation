translation:
  language: ru
  text: Понимай то, что касается ближнего, исходя из собственного опыта, и всякое дело обдумывай.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст из Каирской генизы здесь существенно иной: «Разве не стекает слеза по щеке и не раздаётся стон о её мятежниках (возможно, разорителях)?» Текстовая традиция этого стиха неясна; основной текст следует греческому варианту.'
    reason: alternative_reading
lexical_decisions:
- source_word: νόει
  choice: Пойми
  rationale: Греческий императив призывает к вдумчивому пониманию; «пойми» естественно передаёт это побуждение, не добавляя оттенка судебного суждения.
- source_word: τὰ τοῦ πλησίον
  choice: ближнего
  rationale: Субстантивированное выражение буквально означает «то, что относится к ближнему». В русском глагол «понять» допускает естественное сжатие без чрезмерно узкого толкования как одних лишь чувств.
- source_word: ἐκ σεαυτοῦ
  choice: исходя из самого себя
  rationale: Сохраняет мысль о собственном опыте как основании для понимания другого человека.
- source_word: ἐπὶ παντὶ πράγματι
  choice: всякое дело
  rationale: 'Передаёт конкретное и широкое значение πράγμα: дело, вопрос или обстоятельство.'
- source_word: διανοοῦ
  choice: обдумывай
  rationale: Императив обозначает продолжительное, осмысленное размышление; «обдумывай» звучит ясно и естественно.
theological_decisions:
- issue: Резкое расхождение сохранившегося еврейского свидетеля и греческого текста
  choice: В основном тексте передан связный греческий вариант, а еврейский вариант приведён в примечании.
  alternative: «Разве не стекает слеза по щеке и не раздаётся стон о её разорителях (или мятежниках)?»
  rationale: Предоставленный еврейский текст отмечен как major_mismatch и представляет иную строку, тогда как греческий вариант содержит связное наставление. Расхождение нельзя скрывать, поэтому значимое еврейское свидетельство сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык, краткий наставительный стиль. Формулировка «пойми ближнего» сохраняет широту греческого выражения и избегает более узкого добавления «чувства».
