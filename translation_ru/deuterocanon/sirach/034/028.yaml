  text: Wine drunk at the proper time and in moderation is gladness of heart and joy of soul[a].
translation:
  language: ru
  text: Вино, выпитое в подходящее время и в меру[a], — ликование сердца и радость души.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «достаточное» или «которого довольно». Здесь греческое слово, вероятно, указывает на достаточное, не чрезмерное количество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαλλίαμα
  choice: ликование
  rationale: Существительное обозначает сильную, торжествующую радость; «ликование» сохраняет выразительность греческого слова и образует естественную параллель с «радостью».
- source_word: καρδίας
  choice: сердца
  rationale: Родительный падеж передан прямо и сохраняет поэтическую пару «сердца — души».
- source_word: εὐφροσύνη
  choice: радость
  rationale: Слово передаёт веселье, отраду и радостное состояние; «радость» звучит естественно и достойно.
- source_word: ψυχῆς
  choice: души
  rationale: В контексте обозначает внутреннюю жизнь человека; «души» сохраняет смысловую глубину и параллелизм с «сердца».
- source_word: οἶνος
  choice: вино
  rationale: Прямое соответствие греческому существительному.
- source_word: πινόμενος
  choice: выпитое
  rationale: Причастие согласовано с «вином» и естественно передаёт греческую конструкцию.
- source_word: ἐν καιρῷ
  choice: вовремя
  rationale: καιρός указывает на подходящее, уместное время; «вовремя» кратко и естественно выражает эту оценку.
- source_word: αὐτάρκης
  choice: в меру
  rationale: Буквально слово связано с достаточностью, тем, чего довольно. Применительно к употреблению вина «в меру» естественно передаёт достаточное, не чрезмерное количество, а сноска сохраняет буквальную возможность.
theological_decisions:
- issue: Нравственный оттенок αὐτάρκης при упоминании вина
  choice: Стих говорит о вине, употреблённом в подходящее время и в меру.
  alternative: 'Прилагательное можно понять более буквально: вино «в достаточном количестве» или «которого довольно».'
  rationale: Перевод «в меру» передаёт вероятный наставительный смысл, но сноска сохраняет лексическую неоднозначность и не превращает толкование в единственно возможное чтение.
translation_notes:
  register: Современный литературный русский язык; краткий афористический строй и поэтический параллелизм оригинала сохранены. Тире ясно отмечает именную сказуемую часть.
