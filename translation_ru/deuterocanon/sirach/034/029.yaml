  text: Вино, выпитое в избытке, — горечь для души[a], с раздражением и падением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вино, выпитое в избытке, — горечь души, с раздражением и преткновением». Последние два существительных выражены сжато и могут передавать оттенки раздражения, возбуждения, провокации, спотыкания или падения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πικρία
  choice: горечь
  rationale: Сохраняет образную силу греческого существительного, не сводя его значение только к скорби или озлоблению.
- source_word: ψυχῆς
  choice: для души
  rationale: Естественно по-русски передаёт отношение πικρία ψυχῆς и сохраняет антропологический термин «душа»; возможное формальное «горечь души» отмечено в сноске.
- source_word: οἶνος
  choice: вино
  rationale: Прямое обозначение вина; обобщение до любых алкогольных напитков не требуется.
- source_word: πινόμενος πολὺς
  choice: выпитое в избытке
  rationale: Передаёт в естественной русской форме вино, употребляемое в большом количестве, и направляет предостережение против чрезмерности, а не против вина самого по себе.
- source_word: ἐν ἐρεθισμῷ
  choice: ведёт к раздражению
  rationale: ἐρεθισμός может означать раздражение, возбуждение или провокацию; выбранная формулировка естественна в русском и передаёт последствие чрезмерного употребления, не исключая оттенка возбуждения вражды.
- source_word: ἀντιπτώματι
  choice: падению
  rationale: Сохраняет образ спотыкания или падения и его более широкое значение краха, не усиливая его без необходимости до окончательной гибели.
