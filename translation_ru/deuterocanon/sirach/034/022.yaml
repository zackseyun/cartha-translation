  yaml_path: translation/deuterocanon/sirach/034/022.yaml
  text: Bread for the needy is the life of the poor[a]; the one who deprives them of it is a man of blood.
translation:
  language: ru
  text: Хлеб нуждающихся — жизнь бедных; кто отнимает эту жизнь, тот — человек крови[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в греческом: «человек кровей» — семитизированный оборот, обозначающий человека, повинного в крови; возможны толкования: «виновный в кровопролитии», «убийца».'
    reason: Поясняет буквальную форму и идиоматический смысл, не подменяя образ источника однозначным юридическим определением.
lexical_decisions:
- source_word: ἄρτος
  choice: хлеб
  rationale: Сохранён конкретный образ хлеба как необходимого пропитания, без обобщения до «пищи».
- source_word: ἐπιδεομένων
  choice: нуждающихся
  rationale: Причастие обозначает тех, кто испытывает нужду или лишён необходимого; родительный падеж сохранён в сочетании «хлеб нуждающихся».
- source_word: ζωὴ πτωχῶν
  choice: жизнь бедных
  rationale: Краткая именная конструкция следует греческому тексту и выражает мысль, что хлеб поддерживает саму жизнь бедных.
- source_word: ὁ ἀποστερῶν
  choice: кто отнимает
  rationale: Глагол может означать лишать, удерживать или отнимать причитающееся. «Отнимает» естественно сочетается с прямым дополнением αὐτήν и сохраняет нравственную резкость высказывания.
- source_word: αὐτὴν
  choice: её
  rationale: Женское единственное число грамматически отсылает к ближайшему существительному ζωή («жизнь»), а не к ἄρτος («хлеб», мужской род). Поэтому перевод сохраняет референцию к жизни и не добавляет отсутствующего в греческом местоимения «их».
- source_word: ἄνθρωπος αἱμάτων
  choice: человек крови
  rationale: Буквально сохранён семитизированный оборот греческого текста. Он выражает кровную вину, не сводя её безоговорочно к узкому юридическому обозначению убийцы.
theological_decisions:
- issue: Нравственная сила уподобления лишающего бедных жизненно необходимого хлеба виновнику кровопролития
  choice: человек крови
  alternative: убийца; виновный в кровопролитии
  rationale: Буквальный образ сохраняет суровое отождествление лишения средств к жизни с кровной виной и не снимает заложенного в тексте напряжения.
- issue: Антецедент местоимения αὐτήν
  choice: местоимение относится к «жизни»
  alternative: передать как лишение нуждающихся хлеба
  rationale: Форма αὐτήν согласуется с ζωή, тогда как ἄρτος имеет мужской род. Перевод следует явному грамматическому свидетельству греческого источника, даже несмотря на более привычное контекстуальное понимание как удержание хлеба.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Слова «нуждающихся» и «бедных» передают два разных греческих обозначения. Необычный оборот «человек крови» намеренно сохранён ради образности источника и пояснён сноской.
