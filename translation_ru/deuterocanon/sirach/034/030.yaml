base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/034/030.yaml
  text: Drunkenness multiplies the anger of a foolish man into stumbling[a], diminishing strength and producing wounds.
translation:
  language: ru
  text: Опьянение умножает гнев неразумного, доводя его до падения[a], ослабляя силу и причиняя раны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «так что он спотыкается»; πρόσκομμα может означать преткновение, повод споткнуться или падение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πληθύνει
  choice: умножает
  rationale: Передаёт причинное значение увеличения и сохраняет выразительность греческого глагола.
- source_word: μέθη
  choice: опьянение
  rationale: Обозначает состояние алкогольного опьянения; по-русски звучит естественно и достойно.
- source_word: θυμὸν
  choice: гнев
  rationale: В контексте поведения неразумного под воздействием вина наиболее вероятно означает вспыльчивый гнев.
- source_word: ἄφρονος
  choice: неразумного
  rationale: Сохраняет мужской род единственного числа и характерный для литературы мудрости тип человека, лишённого рассудительности.
- source_word: εἰς πρόσκομμα
  choice: доводя его до падения
  rationale: Передаёт направленность εἰς и образ спотыкания или падения, выраженный πρόσκομμα, без сужения смысла до нравственного соблазна.
- source_word: ἐλαττῶν
  choice: ослабляя
  rationale: Естественно передаёт уменьшение силы как продолжающееся действие опьянения.
- source_word: ἰσχὺν
  choice: силу
  rationale: Прямое и широкое обозначение телесной или личной силы.
- source_word: προσποιοῦν
  choice: причиняя
  rationale: В сочетании с «ранами» это естественный русский способ передать причинное значение причастия.
- source_word: τραύματα
  choice: раны
  rationale: Сохраняет конкретный физический смысл греческого существительного.
theological_decisions:
- issue: Представительный мужской образ в литературе мудрости
  choice: неразумного
  alternative: неразумного человека; глупца
  rationale: Греческая форма имеет мужской род и единственное число. Субстантивированное русское прилагательное сохраняет этот образ без тяжеловесного добавления «человека».
- issue: Связь εἰς πρόσκομμα с основной конструкцией
  choice: опьянение усиливает гнев до результата — падения
  alternative: гнев неразумного ведёт к преткновению
  rationale: Синтаксис допускает некоторую смысловую неоднозначность; основной текст связывает результат с действием опьянения, а примечание сохраняет альтернативное понимание.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем изречения. «Неразумный» поддерживает достоинство регистра Премудрости; деепричастные обороты передают параллельные греческие причастия.
