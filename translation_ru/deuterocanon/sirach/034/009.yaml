    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὴρ
  choice: человек
  rationale: Существительное стоит в мужском роде и единственном числе, но в данном изречении имеет обобщающий смысл. Русское «человек» сохраняет эту форму естественно и без ненужного сужения значения.
- source_word: πεπαιδευμένος
  choice: много путешествовавший
  rationale: Обычное значение причастия — «обученный, воспитанный, опытный». Однако ближайший контекст главы связывает приобретение знания с путешествиями и многообразным опытом, а параллельная часть с πολυπειρῶν поддерживает это контекстуальное понимание. Лексическая неоднозначность отмечена в сноске.
- source_word: ἔγνω πολλά
  choice: знает многое
  rationale: Аорист в общеистинном изречении естественно передаётся русским настоящим временем; πολλά сохраняется как «многое».
- source_word: ὁ πολυπειρῶν
  choice: обладающий большим опытом
  rationale: Причастная конструкция обозначает человека, многое испытавшего. Выбран естественный современный русский оборот с сохранением акцента на опыте.
- source_word: ἐκδιηγήσεται
  choice: поведает
  rationale: Глагол означает подробно рассказать или изложить. «Поведает» передаёт речевой и несколько возвышенный оттенок, соответствующий литературному регистру книги.
- source_word: σύνεσιν
  choice: о постигнутом
  rationale: Буквально — «понимание, разумение». Сочетание «поведает понимание» по-русски неестественно; «поведает о постигнутом» сохраняет мысль о понимании, обретённом благодаря опыту.
theological_decisions:
- issue: Существенное расхождение между предоставленным еврейским текстом и греческим свидетельством
  choice: Основной текст переведён по греческому свидетельству, соответствующему контексту Сир 34:9; расхождение еврейской строки раскрыто в сноске.
  alternative: 'Перевести предоставленную еврейскую строку как основной текст: «Во всех своих делах являй светлое лицо и с радостью освящай десятину» (приблизительно).'
  rationale: 'Предоставленная еврейская строка не соответствует смыслу и ходу рассуждения в Сир 34:9 и, по всей видимости, относится к другому месту. Греческий текст согласуется с контекстом данного раздела. Выбор греческого свидетельства не скрывает текстологическую проблему: еврейский вариант приведён в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным библейской книге мудрости. Фраза построена как краткое параллельное изречение; «поведает» слегка возвышенно, но понятно современному читателю.
