translation:
  language: ru
  text: Обученный[b] человек знает многое, и многоопытный изложит своё разумение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленное еврейское свидетельство существенно отличается и приблизительно читается так: «Во всех своих делах являй светлое лицо и с радостью отделяй десятину от посвящённого». Поскольку эта строка не соответствует контексту Сир 34:9, основной текст здесь следует греческому свидетельству.'
    reason: textual_variant
  - marker: b
