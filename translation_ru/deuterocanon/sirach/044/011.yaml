  text: But these are men of steadfast love[b][a], and their hope will not cease.
translation:
  language: ru
  text: Но это мужи, исполненные верной любви[b], и надежда их не прекратится.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции здесь иной текст: «С их потомством остаётся доброе наследие — их потомки». Еврейский текст Каирской генизы гласит: «это мужи верной любви, и надежда их не прекратится». Масадский текст в ближайшем контексте также содержит отличающуюся формулировку, связанную с потомством и продолжением рода.'
    reason: textual_variant
  - marker: b
    text: Еврейское חסד может также означать «неизменная любовь», «милость», «доброта» или «верность».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: Но
  rationale: Передаёт противопоставление предшествующему контексту кратко и естественно для современного русского языка.
- source_word: אֵלֶּה
  choice: это
  rationale: Прямо передаёт указательное местоимение, относящееся к названным предкам.
- source_word: אַנְשֵׁי
  choice: мужи
  rationale: Сохраняет грамматически мужское обозначение выдающихся предков и соответствует возвышенному, но понятному регистру главы.
- source_word: חֶסֶד
  choice: верной любви
  rationale: Передаёт одновременно любовь, доброту и устойчивую верность, не сводя широкое значение חסד только к милосердию или благочестию.
- source_word: וְתִקְוָתָם
  choice: и надежда их
  rationale: Сохраняет прямое значение תקוה и притяжательный суффикс; порядок слов поддерживает достоинство библейского регистра без архаизации.
- source_word: לֹא תִשְׁבֹּת
  choice: не прекратится
  rationale: Прямо передаёт значение глагола שבת «прекращаться, переставать», не уточняя сверх текста, каким именно образом надежда продолжится.
theological_decisions:
- issue: Расхождение между еврейским текстом Каирской генизы и греческой параллелью
  choice: 'Основной текст переведён по сохранившейся еврейской строке: «это мужи верной любви, и надежда их не прекратится»'
  alternative: Греческое чтение о потомстве и добром наследии
  rationale: При наличии еврейского текста он служит основой перевода. Существенно отличающееся греческое чтение не смешивается с ним, а приводится в примечании, чтобы честно сохранить текстовую неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Мужи» уместно в перечне прославленных предков; остальная фраза избегает устаревшей грамматики и конфессионально нагруженных уточнений.
