  text: Enoch was found blameless, and he walked with the LORD, and he was taken away—an example of knowledge for generation after generation.
translation:
  language: ru
  text: Енох оказался непорочным, ходил с Господом и был взят — как знак познания из рода в род.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте заключительные слова звучат иначе: «пример покаяния для поколений».'
    reason: Греческая параллель содержит значимое древнее разночтение по сравнению с еврейским «знак познания из рода в род».
lexical_decisions:
- source_word: נמצא תמים
  choice: оказался непорочным
  rationale: Передаёт буквальное «был найден непорочным» естественным современным русским оборотом, сохраняя смысл нравственной цельности.
- source_word: והתהלך עם יהוה
  choice: ходил с Господом
  rationale: Сохраняет традиционный библейский образ постоянной жизни в общении с Богом; יהוה передано как «Господь».
- source_word: ונלקח
  choice: был взят
  rationale: Сохраняет краткость и недосказанность еврейского пассива, не уточняя прямо, кем и куда был взят Енох.
- source_word: אות דעת
  choice: знак познания
  rationale: 'Близко следует еврейскому тексту: אות — «знак», דעת — «знание/познание». «Познание» здесь звучит естественнее и допускает назидательный смысл, не подменяя его греческим чтением.'
- source_word: לדור ודור
  choice: из рода в род
  rationale: Устойчивый русский библейский оборот, точно передающий повтор «для поколения и поколения».
theological_decisions:
- issue: Смысл заключительной характеристики Еноха
  choice: знак познания
  alternative: пример покаяния
  rationale: Основной текст следует высокоуверенному еврейскому источнику, где стоит אות דעת. Отличающееся греческое чтение сохранено в примечании, а не внесено в основной текст.
- issue: Описание взятия Еноха
  choice: был взят
  alternative: был перенесён Богом / был взят на небо
  rationale: Еврейский текст не называет действующее лицо и место назначения; перевод сохраняет эту богословски значимую недосказанность.
translation_notes:
  register: Современный литературный русский с традиционной библейской образностью. Синтаксис краткий и торжественный; архаизмы сведены к понятному устойчивому выражению «из рода в род».
