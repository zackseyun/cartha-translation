    rationale: Русское «воздвиг» обычно относится к сооружению, восстанию или возведению на положение; в сочетании с «сына» оно звучит не как современный литературный перевод. «Даровал сына» передает контекстуальный смысл еврейской формулы, не подменяя сына заветом.
  - severity: low
    issue: Формулировка второго примечания неточно представляет отношение греческого текста к еврейскому.
    rationale: 'Греческое «благословение всех людей и завет» не просто стоит «вместо» всего еврейского выражения: «завет» присутствует в обоих свидетелях. Следует говорить о различном чтении данной части строки.'
