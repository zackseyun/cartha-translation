revisions:
- from: И для Исаака Он воздвиг сына[a] ради Авраама, его отца. Он дал ему завет каждого первенца[b], и благословение почило на голове Израиля.
  to: Также Исааку Он даровал сына[a] ради его отца Авраама. Он дал ему завет всех первенцев[b], и благословение почило на голове Израиля.
  rationale: Перевод сохраняет еврейское «сына» в основном тексте и не принимает греческое «завет» как замену этому слову. Исправлены русская сочетаемость глагола с «сыном», порядок слов для ясной отсылки «его отца» к Исааку и описание греческого варианта в примечаниях. Трудность еврейского выражения о завете и первенцах не устраняется интерпретацией.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:05:51Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной текст должен следовать еврейскому свидетельству: בן — «сын», а не «завет». Однако «воздвиг сына» неестественно по-русски в данном контексте; «даровал ... сына» передает смысл הקים בן как дарование/поставление потомка. Трудное «завет ... первенцев» сохранено без гармонизации с греческим текстом. Греческое чтение надлежащим образом вынесено в примечания.'
  naturalness: «Также Исааку Он даровал сына ради его отца Авраама» — современная литературная и ясная фраза. «Завет всех первенцев» намеренно сохраняет трудность еврейской конструкции, но звучит несколько естественнее, чем «завет каждого первенца». «Почило» уместно в умеренно возвышенном библейском регистре.
  terminology: «Завет», «благословение» и «Израиль» переданы последовательно. Имя «Израиль» оставлено без толкования, сохраняя возможную отсылку как к Иакову, так и к его потомству.
  issues:
