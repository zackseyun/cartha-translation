  text: And in Isaac he established[a], because of Abraham his father, a covenant with every firstborn[b], and the blessing rested on the head of Israel.
translation:
  language: ru
  text: Также Исааку Он даровал сына[a] ради его отца Авраама. Он дал ему завет всех первенцев[b], и благословение почило на голове Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст имеет: «И в Исааке Он установил через Авраама, его отца, благословение всех людей и завет». Еврейский текст читает: «Также Исааку Он даровал сына».'
    reason: alternative_reading
  - marker: b
    text: 'Еврейское выражение «завет всех первенцев» неясно. В соответствующей части греческий текст читает: «благословение всех людей и завет».'
    reason: textual_variant
lexical_decisions:
- source_word: וגם ליצחק הקים בן
  choice: И для Исаака Он воздвиг сына
  rationale: 'Перевод следует высоконадежному еврейскому основному тексту: ליצחק естественно передается «для Исаака», הקים — «воздвиг», а בן — «сына». Хотя греческий текст заметно расходится с этой строкой, подмена засвидетельствованного еврейского בן словом «завет» без необходимости смешала бы две разные части стиха.'
- source_word: בעבור אברהם אביו
  choice: ради Авраама, его отца
  rationale: בעבור выражает основание или действие ради кого-либо. «Ради» естественно передает здесь смысл «из-за заслуги/обетования, связанного с Авраамом», не уточняя богословский механизм.
- source_word: ברית כל ראשון נתיו
  choice: Он дал ему завет каждого первенца
  rationale: Фраза в еврейском тексте трудна. ברית — «завет», כל ראשון буквально связано с «каждым первенцем», а נתיו, вероятно, означает «дал ему». Формулировка сохраняет структуру и не исправляет неясный текст по греческому варианту.
- source_word: וברכה נחה על ראש ישראל
  choice: и благословение почило на голове Израиля
  rationale: נחה передано как «почило», а образ благословения на голове сохранен. Имя «Израиль» оставлено без поясняющей замены, чтобы удержать возможный отзвук как патриарха Иакова, так и происходящего от него народа.
theological_decisions:
- issue: Кого обозначает «Израиль»
  choice: Сохранено имя «Израиль» без уточнения
  alternative: Явно назвать Иакова либо народ Израиля
  rationale: В ряду Авраам—Исаак—Израиль прежде всего подразумевается патриарх Иаков, однако выражение способно одновременно указывать на его потомство. Перевод сохраняет эту многозначность.
- issue: Основание благословения Исаака
  choice: «ради Авраама, его отца»
  alternative: «по причине Авраама» или «за заслуги Авраама»
  rationale: «Ради» передает причинно-целевое значение בעבור, не вводя спорного учения о заслугах.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Воздвиг» и «почило» сохраняют достоинство и образность исходника, оставаясь понятными. Основной перевод отдает приоритет высоконадежному еврейскому свидетельству; существенное расхождение греческого текста вынесено в примечания.
