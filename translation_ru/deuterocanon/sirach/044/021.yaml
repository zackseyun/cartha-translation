base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/021.yaml
  text: Therefore he confirmed it to him with an oath that nations would be blessed in his offspring[a], and that he would give them as an inheritance from sea to sea[b], and from the River to the ends of the earth.
translation:
  language: ru
  text: 'Поэтому Он клятвой подтвердил ему обещание: народы будут благословлены в его потомстве, и Он даст им наследие от моря до моря[a] и от Реки[b] до краёв земли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В приведённом еврейском тексте буквально: «от вод до моря». Греческая параллель читает «от моря до моря» и, вероятно, сохраняет предполагаемую территориальную формулу.'
    reason: textual_variant
  - marker: b
    text: «Река» в библейских формулах о границах — обычное обозначение Евфрата.
    reason: cross_reference
lexical_decisions:
- source_word: על כן
  choice: Поэтому
  rationale: Естественная причинно-следственная связка, вводящая следствие сказанного об Аврааме ранее.
- source_word: בשבועה הקים לו
  choice: Он клятвой утвердил данное ему обещание
  rationale: Глагол הקים в сочетании с упоминанием клятвы выражает утверждение или подтверждение обязательства. Слово «обещание» восстановлено из контекста, чтобы идиома естественно звучала по-русски.
- source_word: לברך בזרעו גוים
  choice: народы будут благословлены в его потомстве
  rationale: Пассивная конструкция согласуется с греческим ἐνευλογηθῆναι и сохраняет формулировку обетования, не уточняя сверх текста способ действия.
- source_word: זרעו
  choice: его потомстве
  rationale: «Потомство» передаёт собирательное значение единственного числа и звучит естественнее современного буквального «семя».
- source_word: להנחילם
  choice: Он даст им наследие
  rationale: Побудительная порода נחל означает «дать в наследие, сделать наследниками». Местоимение «им» сохраняет грамматическую неоднозначность своего референта.
- source_word: מים עד ים
  choice: от моря до моря
  rationale: В приведённом еврейском тексте стоит מים, буквально «от вод», однако греческая параллель ἀπὸ θαλάσσης ἕως θαλάσσης подтверждает известную территориальную формулу «от моря до моря».
- source_word: ומנהר
  choice: и от Реки
  rationale: В библейских формулах о границах «Река» традиционно обозначает Евфрат; имя собственное не внесено непосредственно в текст.
- source_word: עד אפסי ארץ
  choice: до краёв земли
  rationale: Естественная современная передача устойчивого библейского выражения о самых дальних пределах земли или страны.
theological_decisions:
- issue: Формулировка обетования о благословении народов и действующее лицо
  choice: народы будут благословлены в его потомстве
  alternative: Он благословит народы через его потомство
  rationale: Пассив сохраняет поддержку греческой параллели и не сужает возможное понимание того, как именно благословение связано с потомством Авраама.
- issue: Референт местоимения в להנחילם
  choice: Он даст им наследие
  alternative: Он даст его потомкам наследие
  rationale: Еврейский суффикс множественного числа сам по себе не называет референта; формулировка «им» сохраняет эту неоднозначность, хотя контекст обетования позволяет понимать его как указание на потомство.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавные местоимения «Он» относятся к Богу; синтаксис остаётся понятным для широкого читателя. Текст сохраняет пассивную форму обетования и неоднозначность местоимения «им».
