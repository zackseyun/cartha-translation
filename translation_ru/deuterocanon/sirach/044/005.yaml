lexical_decisions:
- source_word: חוקרי
  choice: исследовавшие
  rationale: Причастие от חקר означает тщательное разыскание или исследование; выбранная форма сохраняет интеллектуальный и аналитический оттенок действия.
- source_word: מזמור
  choice: песен
  rationale: מזמור может обозначать песню или псалом. В данном контексте «песен» не сужает смысл до богослужебного или канонического употребления и согласуется с греческим параллельным текстом.
- source_word: על חוק
  choice: по установленному правилу
  rationale: חוק обозначает установленную норму, порядок или правило. В контексте музыкального искусства выражение, вероятно, относится к упорядоченному строю или принципам композиции; трудность еврейской фразы отмечена в сноске.
- source_word: נושאי
  choice: излагавшие
  rationale: Буквально причастие означает «несущие», однако в сочетании с משל и בכתב речь, вероятно, идет о представлении или передаче изречений в письменной форме. «Излагавшие» естественно выражает эту функцию по-русски.
- source_word: משל
  choice: притчи
  rationale: משל может означать притчу, пословицу, афоризм или мудрое изречение. «Притчи» сохраняет традиционный широкий литературный смысл, тогда как более широкое греческое соответствие отмечено в сноске.
- source_word: בכתב
  choice: письменно
  rationale: Прямо передает значение «в письменной форме»; греческое ἐν γραφῇ подтверждает указание на письменную фиксацию.
