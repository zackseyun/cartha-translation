  source_fidelity: 'Первая часть передаёт חקר и מזמור в целом удачно, но «строй песен» несколько добавляет значение «структуры», которого в еврейском тексте нет прямо: מזמור — «песнь/песни», а трудность относится к сочетанию על חוק. Во второй части «излагавшие» не передаёт образ נושאי («несущие, носящие») и вместе с «письменно» ослабляет связь с «в письме/письменно зафиксированном виде». Безопаснее сохранить образ «несли» и прямо передать בכתב как «в письменном виде».'
  naturalness: «Исследовавшие песни по правилу» — литературно естественная, хотя намеренно сдержанная формула, сохраняющая неясность исходного выражения. «Несли притчи в письменном виде» несколько необычно, но это оправдано как близкая передача параллельной еврейской конструкции; она яснее и естественнее, чем буквальное «несущие притчи в письме».
  terminology: '«Песни» уместнее, чем «псалмы», поскольку не навязывает культовый или канонический смысл. Для משל «притчи» допустимо, но сноска должна отметить также «пословицы/мудрые изречения» и более широкое греческое ἔπη. Формулировка сноски a не должна утверждать, что греческий текст прямо говорит об «искусно устроенной песне»: он говорит о музыкальных произведениях; это лишь косвенно помогает понять трудное еврейское выражение.'
