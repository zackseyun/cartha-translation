  text: But these were men of mercy, whose righteous deeds[b] were not forgotten;
translation:
  language: ru
  text: Но это[a] были милосердные люди, чьи праведные дела[b] не были забыты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившаяся в Каирской генизе еврейская строка здесь трудна и, по-видимому, не соответствует данному месту. Буквально её можно передать приблизительно так: «Словно их не было, они были, и их дети после них». Основной текст следует связному греческому параллельному свидетельству.'
    reason: textual_variant
  - marker: b
    text: 'Или: «дела справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλʼ ἢ / כאשר
  choice: Но эти
  rationale: Сохранившийся еврейский текст в данном месте труден и, по-видимому, не соответствует контексту стиха. Поэтому основной текст передаёт связное противопоставление греческого параллельного свидетельства, а разночтение отмечено в сноске.
- source_word: ἄνδρες ἐλέους
  choice: мужами милосердия
  rationale: Сочетание сохраняет явное мужское множественное число ἄνδρες и характерную для греческого текста конструкцию «мужи милосердия», то есть люди, отличавшиеся милосердием.
- source_word: δικαιοσύναι
  choice: праведные дела
  rationale: Множественное число обозначает конкретные проявления праведности, а не только отвлечённое качество. Вариант «праведные дела» естественен по-русски и сохраняет практический смысл выражения.
- source_word: οὐκ ἐπελήσθησαν
  choice: не были забыты
  rationale: Прямо передаёт греческий глагол и поддерживает контраст с предшествующим упоминанием людей, память о которых исчезла.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста с греческим параллельным свидетельством
  choice: В основном тексте следовать связному греческому чтению, открыто отметив проблему еврейского свидетельства.
  alternative: 'Передать еврейскую строку буквально: «Словно их не было, они были, и их дети после них»; возможное контекстуальное осмысление: «Словно их не существовало, они исчезли, и их дети после них».'
  rationale: Еврейскому тексту обычно отдаётся первенство, однако предоставленная строка здесь выглядит смещённой, повреждённой или не соответствующей данному стиху. Греческое чтение образует ясный контраст со стихом 9. Сноска сохраняет текстологическую неопределённость, не выдавая выбранное чтение за бесспорное.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Оборот «мужи милосердия» намеренно сохраняет образность греческой конструкции; синтаксис остаётся ясным для широкого читателя.
