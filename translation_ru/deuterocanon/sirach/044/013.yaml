  text: Their remembrance will stand forever[a], and their righteousness will not be forgotten.
translation:
  language: ru
  text: Память о них пребудет вовеки[a], и праведность их не будет забыта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Потомство их пребудет вовеки, и слава их не изгладится». В свитке из Масады также стоит «потомство» (буквально «семя») вместо «память» в каирских еврейских рукописях.'
    reason: textual_variant
lexical_decisions:
- source_word: זכרם
  choice: память о них
  rationale: זֵכֶר обозначает память, воспоминание или сохраняемую память о ком-либо. Русское «память о них» прямо передаёт чтение каирских еврейских рукописей и естественно звучит в данном контексте.
- source_word: יעמד
  choice: пребудет
  rationale: עמד буквально означает «стоять», а здесь выражает устойчивость и длительное сохранение. «Пребудет» сохраняет возвышенный поэтический оттенок и ясно передаёт продолжительность.
- source_word: עד עולם
  choice: вовеки
  rationale: Устойчивое выражение означает неограниченную длительность. «Вовеки» кратко и уместно для современного литературного библейского регистра.
- source_word: וצדקתם
  choice: и праведность их
  rationale: צדקה может означать праведность, справедливость или праведное поведение. «Праведность» сохраняет ёмкость исходного существительного, не сводя его только к отдельным поступкам.
- source_word: לא תשכח
  choice: не будет забыта
  rationale: 'Форма передаёт пассивное значение: их праведность не окажется забытой. Это также поддерживает смысловой параллелизм с сохраняющейся памятью в первой строке.'
theological_decisions:
- issue: Различие между каирской еврейской традицией и чтением Масады/греческого перевода
  choice: 'В основном тексте передано чтение каирских еврейских рукописей: «Память о них… праведность их…».'
  alternative: «Потомство их пребудет вовеки, и слава их не изгладится».
  rationale: Имеющийся еврейский текст служит основой перевода, однако свиток из Масады и греческая традиция свидетельствуют о существенном ином чтении. Оно сохранено в сноске, поскольку меняет оба ключевых образа стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. «Пребудет вовеки» передаёт поэтическую торжественность оригинала, оставаясь понятным широкому читателю.
