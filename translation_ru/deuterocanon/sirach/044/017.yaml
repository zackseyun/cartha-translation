base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/017.yaml
  text: Noah was found righteous[a], blameless; at the time of destruction he became a substitute. Because of him a remnant remained[b], and by his covenant the flood ceased.
translation:
  language: ru
  text: Ной оказался праведным и непорочным; во время гибели он стал заменой[a]. Благодаря ему сохранился остаток, и благодаря завету с ним потоп прекратился[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возмещением», «выкупом». Еврейское תחליף и греческое ἀντάλλαγμα обозначают то, что даётся или выступает вместо другого.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий параллельный текст в заключительной части стиха отличается и указывает скорее на наступление потопа. Здесь перевод следует еврейскому чтению: «и благодаря завету с ним потоп прекратился».'
    reason: textual_variant
lexical_decisions:
- source_word: נח
  choice: Ной
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: צדיק
  choice: праведным
  rationale: Передаёт нравственную правоту и соответствует греческому δίκαιος; сохраняет привычное библейское звучание.
- source_word: תמים
  choice: непорочным
  rationale: В данном контексте обозначает цельность и безупречность жизни, а не абсолютное совершенство.
- source_word: לעת כלה
  choice: во время гибели
  rationale: כלה здесь указывает на гибель и разрушение в ходе суда; перевод сохраняет краткость и катастрофический смысл.
- source_word: תחליף
  choice: заменой
  rationale: Слово обозначает того или то, что занимает место другого; греческое ἀντάλλαγμα подтверждает идею замены или выкупа. Точный оттенок оставлен открытым в сноске.
- source_word: בעבורו
  choice: Благодаря ему
  rationale: 'Естественно выражает причинную связь: с Ноем связано сохранение остатка.'
- source_word: שארית
  choice: сохранился остаток
  rationale: Сохраняет библейское понятие остатка — уцелевших среди суда — и звучит естественно по-русски.
- source_word: ובבריתו
  choice: по завету с ним
  rationale: Суффикс соотнесён с Ноем, а формулировка избегает неясного русского выражения «его завет», которое могло бы представить Ноя учредителем завета.
- source_word: חדל מבול
  choice: потоп прекратился
  rationale: Прямо передаёт еврейское חדל «прекратился, перестал»; расхождение с греческим отражено в сноске.
theological_decisions:
- issue: Расхождение заключительной части стиха в еврейском и греческом свидетелях
  choice: 'Следовать сохранившемуся еврейскому чтению: «и по завету с ним потоп прекратился»'
  alternative: Греческий параллельный текст в приведённой форме связывает последнюю фразу скорее с наступлением потопа, а не с его прекращением.
  rationale: При наличии еврейского текста Сираха он служит первичным основанием перевода. Здесь еврейское חדל מבול ясно означает прекращение потопа. Существенное расхождение с греческим не сглаживается, а отмечается в сноске.
- issue: Смысл תחליף применительно к Ною
  choice: «стал заменой» без дальнейшего догматического уточнения
  alternative: «стал выкупом», «стал возмещением» или «послужил взамен других»
  rationale: Еврейское תחליף и греческое ἀντάλλαγμα допускают несколько близких оттенков. «Замена» сохраняет основную идею занятия места другого, не навязывая конкретного учения о характере этой замены.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис краткий и ясный; термины «праведный», «непорочный», «остаток», «завет» сохраняют уместную библейскую лексику. Неоднозначность תחליף и текстовое расхождение в финале вынесены в сноски.
