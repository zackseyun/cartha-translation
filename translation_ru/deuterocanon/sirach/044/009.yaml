  terminology: «Память» верно передаёт זכר в контексте посмертного забвения. «Исчезли» и «словно никогда не существовали» хорошо разграничивают сжатое еврейское чтение и смысловое развёртывание греческого параллельного текста. Сноска корректно указывает на различие объёма текстовых свидетелей и не приписывает греческое дополнение еврейскому тексту.
