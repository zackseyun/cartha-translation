base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/044/009.yaml
  text: And there are some for whom there is no remembrance[a], they ceased to be, just as they had ceased, as though they had never existed, and so did their children after them.
translation:
  language: ru
  text: 'Есть среди них и те, о ком не осталось памяти[a]: они исчезли, словно никогда не существовали, а вслед за ними — и их дети.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь короче; буквально: «Есть среди них те, о ком нет памяти, и они прекратились, как прекратились». Греческий текст сохраняет более полную форму мысли: «они погибли, словно не существовали, и стали словно не бывшие, и дети их после них».'
    reason: textual_variant
lexical_decisions:
- source_word: ויש מהם
  choice: Есть среди них и те
  rationale: Передаёт значение части от ранее упомянутой группы и естественно звучит по-русски.
- source_word: אשר אין לו זכר
  choice: о ком не осталось памяти
  rationale: זכר может означать память или памятование; здесь речь идёт об исчезновении людей из памяти потомков, а не обязательно об отсутствии материального памятника.
- source_word: וישבתו
  choice: они исчезли
  rationale: Глагол שבת выражает прекращение, конец существования или деятельности. В данном контексте «исчезли» связывает прекращение жизни с отсутствием памяти, не предполагая насильственной гибели.
- source_word: καὶ ἀπώλοντο ὡς οὐχ ὑπάρξαντες
  choice: словно никогда не существовали
  rationale: Греческий параллельный текст разворачивает сжатую и неясную еврейскую формулировку כאשר שבתו и ясно выражает полное забвение.
- source_word: καὶ τὰ τέκνα αὐτῶν μετʼ αὐτούς
  choice: а вслед за ними — и их дети
  rationale: Передаёт дополнительную фразу полного греческого свидетеля кратко и естественно, сохраняя последовательность поколений.
theological_decisions:
- issue: Соотношение краткого еврейского текста и более полного греческого параллельного текста
  choice: В основном тексте использована ясная развёрнутая форма, засвидетельствованная по-гречески, а различие отмечено в сноске.
  alternative: Передать только еврейское «и прекратились, как прекратились», сохранив его трудную повторную конструкцию.
  rationale: Еврейский свидетель первичен, но его заключение крайне сжато и, вероятно, текстуально неполно; греческий текст сохраняет связное продолжение мысли. Сноска открыто показывает читателю границы свидетельств и не выдаёт дополнение за бесспорный еврейский текст.
translation_notes:
  register: Современный литературный русский язык; строй фразы торжественный, но понятный. «Не осталось памяти» передаёт тему забвения, а тире перед «и их дети» подчёркивает краткое присоединение последнего элемента.
