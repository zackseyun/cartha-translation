  source_fidelity: 'Основная строка точно передаёт первую часть еврейского текста («Есть среди них и те, о ком не осталось памяти») и, как это открыто обозначено сноской, передаёт развёртку, сохранённую в греческом параллельном тексте: исчезновение «словно никогда не существовали» и участь детей после них. «Исчезли» уместно передаёт смысл прекращения/исчезновения в данном контексте, не навязывая способ гибели. Неясная повторная конструкция еврейского текста не выдана за однозначно понятную.'
