  text: With their offspring their good endures faithfully[a], and their inheritance is for their children's children.
translation:
  language: ru
  text: И у их потомства прочно сохраняется их благо[a], а их наследие — детям их детей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По-гречески: «Их потомство утвердилось в заветах, и их дети — благодаря им». Более древнее еврейское свидетельство из Масады также отражает чтение, сосредоточенное на завете, а не формулировку каирских рукописей «их благо… и их наследие».'
    reason: alternative_reading
lexical_decisions:
- source_word: עם
  choice: с
  rationale: Предлог связывает сохраняющееся благо предков с их потомством; краткое «с» передаёт компактность еврейской конструкции.
- source_word: זרעם
  choice: их потомством
  rationale: זרע здесь обозначает потомков; «потомство» естественно по-русски и не сужает значение до потомков мужского пола.
- source_word: נאמן
  choice: прочно пребывает
  rationale: נאמן выражает устойчивость, надёжность и неизменность. Глагольная передача восполняет эллиптичность еврейской строки, не сводя смысл только к нравственной верности.
- source_word: טובם
  choice: их благо
  rationale: טוב может означать добро, благополучие или благо вообще. «Благо» сохраняет эту смысловую широту и не ограничивает речь ни нравственными качествами, ни материальным достатком.
- source_word: ונחלתם
  choice: и их наследие
  rationale: נחלה обозначает наследство или наследие; «наследие» уместно для межпоколенческой преемственности и допускает как материальный, так и нематериальный смысл.
- source_word: לבני בניהם
  choice: детям их детей
  rationale: Буквально «сыновьям их сыновей»; в данном родовом выражении «детям их детей» естественно передаёт охват последующих поколений без неоправданного ограничения мужской линией.
theological_decisions:
- issue: Выбор между чтением каирских еврейских рукописей и заветной формулировкой греческой и масадской традиций
  choice: В основном тексте переведено сохранившееся еврейское чтение о благе и наследии.
  alternative: «Их потомство утвердилось в заветах, и их дети — благодаря им».
  rationale: Приоритет отдан наличному еврейскому тексту высокой степени надёжности. Отличающееся чтение греческой параллели и более древнего масадского свидетеля не смешано с основным текстом, а сохранено в примечании как значимый текстовый вариант.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем. Эллипсис второй части сохранён посредством тире. Формулировка «их благо» намеренно удерживает широту еврейского טוב.
