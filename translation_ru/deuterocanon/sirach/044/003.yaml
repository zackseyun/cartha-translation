translation:
  language: ru
  text: 'владыки земли в своих царствах[a],

    мужи, прославившиеся могуществом;

    советники, отличавшиеся разумением,

    и провидцы всего в своих пророчествах[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское דורי ארץ — трудное выражение; греческий параллельный текст говорит об «осуществляющих власть в своих царствах», что поддерживает перевод «владыки земли».
    reason: alternative_reading
  - marker: b
    text: 'Или: «те, кто возвещал в пророчествах». Еврейский текст здесь предельно краток; греческий параллельный текст яснее говорит о тех, кто возвещал в пророчествах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דורי ארץ
  choice: владыки земли
  rationale: Еврейское выражение затруднительно, однако сочетание с במלכותם и греческое κυριεύοντες указывают на тех, кто осуществляет власть. «Владыки земли» сохраняет политический смысл и высокий, но понятный регистр.
- source_word: במלכותם
  choice: в своих царствах
  rationale: מלכות может означать царство, царствование или царскую власть. Здесь множественное «в своих царствах» естественно сочетается с образом правителей и соответствует греческому βασιλείαις.
- source_word: אנשי שם
  choice: мужи, прославившиеся
  rationale: Буквально «мужи имени», то есть известные, прославленные люди. Выбранная формулировка передаёт идиоматическое значение и сохраняет мужской род оригинала.
- source_word: בגבורתם
  choice: могуществом
  rationale: גבורה обозначает силу, мощь или доблесть. «Могущество» достаточно широко передаёт смысл и соответствует греческому δύναμις.
- source_word: היועצים
  choice: советники
  rationale: Причастная форма называет людей, дающих совет; краткое существительное естественно по-русски.
- source_word: בתבונתם
  choice: наделённые разумением
  rationale: תבונה означает разумение, проницательность, рассудительность. Такая конструкция яснее буквального «в своём разумении» и показывает основание их способности давать совет.
- source_word: וחוזי כל
  choice: и провидцы всего
  rationale: חוזי — «провидцы, созерцатели»; краткое כל оставлено в его широте как «всего», без уточнения невыраженного объекта.
- source_word: בנבואתם
  choice: в своих пророчествах
  rationale: נבואה может обозначать пророчество или пророческую речь. Множественное число по-русски естественно для совокупности пророческих изречений и согласуется с греческим προφητείαις.
theological_decisions:
- issue: Мужской род в перечне почитаемых предков Израиля
  choice: мужи, прославившиеся
  alternative: прославленные люди
  rationale: Еврейское אנשי прямо имеет мужскую форму; она сохранена без нейтрализации.
- issue: Объём пророческого знания в выражении וחוזי כל
  choice: провидцы всего
  alternative: возвещавшие в пророчествах
  rationale: Сохранена лаконичная и широкая формулировка еврейского текста; более явная идея пророческого возвещения засвидетельствована греческим параллельным текстом, но не подменяет собой неоднозначный еврейский источник.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой, уместной для поэтического перечня прославленных предков. Синтаксический параллелизм оригинала сохранён; трудные места не сглажены без пояснений.
