  text: He established him with a blessing[a], and gave him his inheritance; he set him over the tribes, as twelve divisions.
translation:
  language: ru
  text: Он утвердил его благословением и дал ему его наследие; он поставил его среди колен, разделив их на двенадцать частей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная еврейская фраза предельно сжата: буквально — «для/к коленам, разделить двенадцать». Объект действия «разделить» не назван. Греческий параллельный текст выражает мысль полнее: он говорит о распределении его долей между двенадцатью коленами.'
    reason: Сохранить неоднозначность сжатого еврейского синтаксиса и точно указать, каким образом греческий параллельный текст поддерживает понятное русское раскрытие смысла.
lexical_decisions:
- source_word: ויכוננהו
  choice: утвердил его
  rationale: Каузативная форма от כון означает «сделать прочным, утвердить». Русское «утвердил» точно и естественно передаёт этот смысл.
- source_word: בברכה
  choice: благословением
  rationale: Предлог ב здесь допускает инструментальное понимание; творительный падеж естественно передаёт смысл «посредством благословения».
- source_word: נחלתו
  choice: его наследие
  rationale: נחלה обозначает наследие или удел. «Наследие» сохраняет широкий смысл и соответствует греческому κληρονομία.
- source_word: ויציבהו
  choice: поставил его
  rationale: Глагол יצב означает твёрдо поставить или расположить. Нейтральное «поставил» не добавляет прямо не выраженной идеи власти над коленами.
- source_word: לשבטים
  choice: среди колен
  rationale: В сжатой конструкции ל связывает поставление Иакова/Израиля с устройством колен. «Среди колен» согласуется с греческим параллельным текстом и не превращает фразу в недвусмысленное назначение правителем.
- source_word: לחלק שנים עשר
  choice: разделив их на двенадцать частей
  rationale: Еврейская фраза буквально и сжато выражает деление на двенадцать; объект глагола подразумевается. Добавленное «их» делает фразу понятной по-русски, а «частей» передаёт результат деления.
theological_decisions:
- issue: К кому относятся местоимения мужского рода единственного числа
  choice: Сохранены местоимения «его», без прямого называния Иакова в основном тексте.
  alternative: Назвать Иакова или Израиля непосредственно.
  rationale: Контекст и греческий параллельный текст указывают на Иакова/Израиля, но данная еврейская строка сохраняет местоименную, эллиптическую форму; перевод не устраняет эту особенность.
- issue: Отношение Иакова/Израиля к двенадцати коленам
  choice: «поставил его среди колен»
  alternative: «поставил его над коленами» или «произвёл от него колена»
  rationale: Еврейская конструкция допускает более одного понимания. Выбранная формулировка сохраняет связь с коленами, не навязывая ни властного, ни генеалогического толкования; греческий параллельный текст поддерживает смысл распределения на двенадцать колен.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью без архаизмов. Синтаксис сделан ясным для обычного читателя, при этом эллиптичность и неоднозначность заключительной еврейской фразы отмечены в сноске.
