  - severity: medium
    issue: 'Сноска a: «собрание возвещает им хвалу».'
    rationale: Это повторяет смысловой сдвиг основного текста. Греческое τὸν ἔπαινον ἐξαγγέλλει ἐκκλησία означает, что собрание возвещает хвалу о них, а не возвещает хвалу им.
  - severity: low
