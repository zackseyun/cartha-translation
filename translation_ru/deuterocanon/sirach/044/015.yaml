  footnotes:
  - marker: a
    text: 'В еврейских рукописях Каирской генизы: «Их мудрость повторяет община, и их хвалу возвещает собрание». В греческом тексте: «Народы будут рассказывать об их мудрости, и собрание возвещает их хвалу». Основной текст следует еврейскому свидетельству; греческий текст называет более широкий круг рассказчиков — «народы».'
