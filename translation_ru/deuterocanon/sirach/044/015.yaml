lexical_decisions:
- source_word: חכמתם
  choice: их мудрость
  rationale: Прямая передача существительного חכמה с местоименным суффиксом 3-го лица множественного числа.
- source_word: תשנה
  choice: повторяет
  rationale: Глагол שנה здесь означает повторять или излагать вновь; активная конструкция естественно читается по-русски и сохраняет публичный характер передачи мудрости.
- source_word: עדה
  choice: община
  rationale: עדה обозначает сплочённое сообщество; «община» отличает его от параллельного קהל, не устраняя смысловой параллелизм.
- source_word: ותהלתם
  choice: и хвалу им
  rationale: תהלה означает хвалу; дательный оборот «им» естественно передаёт направленную на этих людей похвалу.
- source_word: יספר
  choice: возвещает
  rationale: ספר в данном контексте означает рассказывать, провозглашать; «возвещает» выражает публичное оглашение и соответствует поэтическому регистру.
- source_word: קהל
  choice: собрание
  rationale: קהל — собравшийся народ или собрание; выбор сохраняет отличие от עדה и параллельную структуру строки.
