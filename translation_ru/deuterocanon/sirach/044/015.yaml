  rationale: 'Исправлено значение притяжательного суффикса в תהלתם: «их хвалу» сохраняет смысл хвалы, произносимой о достойных предках, не превращая её в хвалу, обращённую к ним. Та же поправка внесена в передачу греческой параллели. Якорь текстологической сноски перенесён к заключительному колонию, к которому относится её содержание. Остальные решения сохранены, поскольку они точно передают еврейский параллелизм и естественны в современном литературном русском.'
