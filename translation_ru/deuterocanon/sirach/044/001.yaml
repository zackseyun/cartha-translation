translation:
  language: ru
  text: Ныне восхвалю мужей верной любви[a], отцов наших в их поколениях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст: «Восхвалим же славных мужей и отцов наших в их поколении». В еврейском тексте: «мужей верной любви»; глагол стоит в первом лице единственного числа: «восхвалю».'
    reason: Греческое чтение существенно отличается формой призыва и характеристикой прославляемых мужей.
lexical_decisions:
- source_word: אהללה נא
  choice: Восхвалю же
  rationale: Передаёт еврейскую форму первого лица единственного числа с оттенком намерения или побуждения; частица נא здесь естественно выражена словом «же». Греческое множественное «восхвалим» отмечено в сноске, а не подменяет сохранившийся еврейский текст.
- source_word: אנשי חסד
  choice: мужей верной любви
  rationale: 'Сохраняет смысловую насыщенность חסד: любовь, проявляющуюся в преданности и верности. «Милосердных мужей» звучало бы естественнее, но сужало бы значение до сострадания; греческое «славных мужей» отражает иное чтение или толкование.'
- source_word: אבותינו
  choice: отцов наших
  rationale: Прямо передаёт родственное и историческое обозначение אבותינו, сохраняя торжественный, но понятный русский строй.
- source_word: בדורותם
  choice: в их поколениях
  rationale: Передаёт множественное число еврейского דורותם и указывает на разные поколения, в которых жили прославляемые отцы.
theological_decisions:
- issue: Расхождение еврейского и греческого описания прославляемых мужей
  choice: В основном тексте дано еврейское «мужей верной любви».
  alternative: Греческое «славных мужей».
  rationale: При наличии древнееврейского текста ему отдаётся первенство; греческий вариант сохранён в сноске, поскольку он существенно меняет характеристику этих людей.
- issue: Единственное число в еврейском призыве и множественное в греческом
  choice: Восхвалю же
  alternative: Восхвалим же
  rationale: Еврейское אהללה — форма первого лица единственного числа; греческое Αἰνέσωμεν — увещательное первое лицо множественного числа. Расхождение не устранено молча, а обозначено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Необычное, но понятное сочетание «мужей верной любви» намеренно сохраняет богатство еврейского חסד и не сводит его лишь к милосердию или благочестию.
