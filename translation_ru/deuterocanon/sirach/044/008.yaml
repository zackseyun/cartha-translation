review_pass:
  verdict: revise
  source_fidelity: '«Некоторые из них оставили после себя имя» точно передаёт партитив יש מהם, глагол הניחו и мемориальное значение שם. Второй оборот в черновике слишком буквально следует спорному английскому слою: «среди их наследия» по-русски неясно, а «чтобы их восхваляли» не передаёт столь же хорошо смысл хвалебного поминовения/рассказывания, подтверждаемый греческой параллелью. Переработка сохраняет неоднозначное «наследие», но делает его естественной сферой, в которой помнят этих людей.'
  naturalness: '«Чтобы их восхваляли среди их наследия» звучит искусственно и вызывает неясность: наследие не является естественной группой людей, среди которой совершается действие. «Чтобы в их наследии о них вспоминали с похвалой» — современная литературная и торжественная формулировка, не утрачивающая библейского образа.'
  terminology: «Имя» и «наследие» следует сохранить. «Вспоминали с похвалой» передаёт функцию трудного להשתענות без неоправданного утверждения, что речь именно о прямом восхвалении наследниками; сноска указывает возможные оттенки и греческое свидетельство.
  issues:
  - severity: medium
    issue: Неестественный и семантически неясный оборот «среди их наследия».
    rationale: Буквальный образ בנחלתם допустимо сохранять, но в русском «среди наследия» не образует понятной локативной конструкции. Предлог «в» сохраняет термин «наследие» и делает фразу читаемой.
  - severity: medium
    issue: «Чтобы их восхваляли» чрезмерно сужает хвалебное поминовение до прямого восхваления.
    rationale: Трудная еврейская форма требует осторожности; греческое ἐκδιηγήσασθαι ἐπαίνους говорит скорее о рассказывании/перечислении похвал. «О них вспоминали с похвалой» охватывает этот смысл, не выдавая реконструкцию за несомненную.
  revised_text: Некоторые из них оставили после себя имя, чтобы в их наследии о них вспоминали с похвалой.[a]
