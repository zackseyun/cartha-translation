  text: Some of them left behind a name[a], to be praised among their inheritance.
translation:
  language: ru
  text: Некоторые из них оставили после себя имя, чтобы в их наследии о них вспоминали с похвалой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «в их наследии» может подразумевать потомков, оставленное ими наследие или круг тех, кому оно досталось. Трудный глагол передаёт хвалебное поминовение; греческая параллель говорит о рассказе об их похвалах.
    reason: Лексическая неоднозначность еврейского выражения и свидетельство греческой параллели.
lexical_decisions:
- source_word: יש מהם
  choice: Некоторые из них
  rationale: Естественно передаёт партитивное выражение, выделяющее часть ранее названных предков.
- source_word: הניחו
  choice: оставили после себя
  rationale: Передаёт мысль о том, что нечто продолжает существовать после смерти человека; в данном контексте речь о памятном имени.
- source_word: שם
  choice: имя
  rationale: Сохраняет конкретный библейский образ имени как доброй памяти и известности, не сводя его сразу к абстрактной «славе».
- source_word: להשתענות
  choice: чтобы их восхваляли
  rationale: Трудная еврейская форма указывает на хвалебное поминовение; греческая параллель подтверждает смысл рассказа о похвалах. Пассивная русская конструкция сохраняет смысл английского консультационного слоя, не делая греческий текст основной базой.
- source_word: בנחלתם
  choice: среди их наследия
  rationale: 'Сохраняет образ еврейского текста и его неоднозначность: это может быть наследие, потомство либо круг тех, кому оно досталось.'
theological_decisions:
- issue: Памятное значение «имени» и неоднозначность «наследия»
  choice: Сохранить конкретные слова «имя» и «наследие».
  alternative: «Некоторые из них оставили по себе славу, и потомки рассказывали об их похвалах».
  rationale: Выбранный вариант сохраняет библейскую образность и не сужает значение «наследия» исключительно до потомков. Смысл хвалебного поминовения передан в основной строке, а неоднозначность пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением библейских образов «имени» и «наследия». Формулировка торжественная, но понятная; подлинная неоднозначность последнего оборота вынесена в сноску.
