    rationale: Еврейский текст не называет субъекта, и в последовательном синтаксисе стиха естественнее сохранять Авраама как субъект. Греческий параллельный текст также имеет тот же продолжающийся субъект. Добавление Бога как субъекта чрезмерно разрешает синтаксическую неоднозначность.
  - severity: low
    issue: Сноска объединяет существенное греческое разночтение и интерпретацию об обрезании, а также утверждает субъектную неопределённость без уточнения её значения.
    rationale: Сноска должна прежде всего точно зафиксировать греческое чтение «завет» вместо еврейского «устав». Указание на обрезание допустимо как осторожное пояснение, но не должно представлять добавленного в черновике божественного субъекта как смысл текста.
