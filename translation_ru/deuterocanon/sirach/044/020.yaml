  text: who kept the commandments of the Most High and entered into covenant with him[a]. In his flesh he cut for him a statute[b], and in testing he was found faithful.
translation:
  language: ru
  text: который соблюдал заповеди Всевышнего и вступил с Ним в завет. В своей плоти он установил для Него устав[a] и в испытании оказался верным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «устав». В греческом параллельном тексте: «и в своей плоти он установил завет». Вероятно, краткая фраза отсылает к обрезанию как телесному знаку завета с Авраамом.'
    reason: alternative_reading
lexical_decisions:
- source_word: שמר מצות עליון
  choice: соблюдал заповеди Всевышнего
  rationale: В сочетании с «заповедями» глагол שמר означает верное исполнение; «соблюдал» естественно передаёт этот смысл и сохраняет возвышенный библейский регистр.
- source_word: ובא בברית עמו
  choice: и вступил с Ним в завет
  rationale: Передаёт буквальное «вошёл в завет с Ним» ясным современным русским выражением. Заглавная буква в местоимении проясняет, что речь о Всевышнем, не меняя содержания.
- source_word: בבשרו
  choice: На плоти его
  rationale: Предлог ב допускает пространственную передачу «на»; здесь она естественно указывает на телесный знак завета и сохраняет конкретный образ плоти.
- source_word: כרת לו חק
  choice: Он установил для него устав
  rationale: Основной текст следует еврейскому חק, «устав, установление». Глагол כרת буквально означает «высек/отрезал», но в данном сочетании «установил» передаёт смысл без неестественной русской кальки; смена субъекта отмечена местоимением «Он».
- source_word: בניסוי נמצא נאמן
  choice: и в испытании тот оказался верным
  rationale: «В испытании» сохраняет именную форму и не вносит оттенка нравственного искушения. «Оказался верным» естественно передаёт נמצא נאמן; указательное «тот» возвращает субъект к Аврааму после смены субъекта в предыдущей клаузе.
theological_decisions:
- issue: Связь телесного установления с обрезанием Авраама
  choice: Сохранить краткий образ «На плоти его» без поясняющей вставки в основной текст.
  alternative: «Он дал ему обрезание как телесный знак завета».
  rationale: Контекст указывает на Авраама и позволяет распознать аллюзию на обрезание, однако сам стих не называет его прямо; перевод не должен превращать аллюзию в толкование.
- issue: Расхождение еврейского и греческого текста в третьей клаузе
  choice: Следовать еврейскому чтению חק — «устав», указав греческое «завет» в сноске.
  alternative: «На плоти его Он установил с ним завет».
  rationale: Сохранившийся еврейский текст имеет приоритет, но существенное греческое разночтение необходимо сделать видимым.
- issue: Субъект выражения כרת לו חק
  choice: 'Понять подразумеваемым субъектом Всевышнего: «Он установил для него устав».'
  alternative: 'Понять субъектом Авраама: «на своей плоти он установил для Него устав».'
  rationale: Местоимение לו («для него») и образ данного Аврааму телесного установления лучше согласуются с Богом как подразумеваемым субъектом; при этом краткость еврейского допускает синтаксическую неоднозначность, которую следует отметить.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. «Всевышний», «завет», «плоть» и «устав» сохраняют ключевую лексику источника; синтаксис слегка прояснён местоимениями, чтобы обозначить вероятную смену субъекта, не разворачивая аллюзию в парафраз.
