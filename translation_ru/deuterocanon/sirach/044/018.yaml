lexical_decisions:
- source_word: באות עולם
  choice: вечный завет
  rationale: По контексту и представленному критическому свидетельству выражение передаёт непреходящий завет с Ноем. «Вечный завет» — естественная для русского библейского языка формулировка, сохраняющая смысл длительности עולם.
- source_word: נכרת עמו
  choice: с ним был заключён
  rationale: Буквальное еврейское выражение означает «с ним был рассечён», но это устойчивая идиома заключения завета. Русское «заключён завет» точно и естественно передаёт её без неясного буквализма.
- source_word: לבלתי השחית
  choice: чтобы не была уничтожена
  rationale: Передан целевой оттенок конструкции לבלתי и разрушительное значение השחית. Страдательная форма не вводит в текст не названного прямо деятеля.
- source_word: כל בשר
  choice: всякая плоть
  rationale: Сохранён широкий библейский оборот, охватывающий в контексте потопа живые существа, а не только человечество.
theological_decisions:
- issue: Следует ли прямо упоминать потоп по греческому параллельному тексту
  choice: В основном тексте оставить более общее еврейское чтение без прямого упоминания потопа.
  alternative: «чтобы никакая плоть не была истреблена потопом»
  rationale: Сохранившийся еврейский текст является первичным и не содержит явного соответствия греческому κατακλυσμῷ («потопом»). Более подробное греческое чтение приводится в сноске как важное текстовое свидетельство.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской лексикой. Идиома заключения завета передана естественно, а выражение «всякая плоть» сохранено ради широты и межтекстовой узнаваемости.
