translation_notes:
  register: Современный литературный русский язык с достоинством перечислительного панегирического стиля. Тире подчёркивают параллельное устройство фраз. Необычные, но смыслово ёмкие «изыскания» сохраняют интеллектуально-административный оттенок; «на своих постах» естественнее буквального «в своих стражах» и не устраняет полностью многозначность משמרותם.
