  source_fidelity: 'Исправление требуется для предлога ב в בספרתם: «благодаря своим писаниям» вводит причинное отношение, которого еврейский текст не выражает. Более близкое и нейтральное «в своих писаниях» сохраняет связь с письменной деятельностью, не уточняя её как причину мудрости. «В своих изысканиях» для במחקרותם допустимо; «на своих постах» удачно передаёт многозначное במשמרותם.'
