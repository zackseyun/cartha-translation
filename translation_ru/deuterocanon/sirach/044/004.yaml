translation:
  language: ru
  text: Вожди народов — в своих замыслах, и правители — в своих изысканиях[b]; мудрые в речах и в своих писаниях[a], и управляющие — на своих постах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейские свидетели немного различаются: текст Каирской генизы читает «в своих писаниях», а Масадский свиток имеет близкое чтение «в своих книгах». Оба чтения указывают на книжную или писцовую мудрость.'
    reason: textual_variant
  - marker: b
    text: 'Греческий текст в этой части стиха несколько отличается от еврейского: он подчёркивает разумение, связанное с писцовой деятельностью народа. Здесь перевод следует прежде всего еврейскому тексту.'
    reason: alternative_reading
lexical_decisions:
- source_word: שרי גוים
  choice: вожди народов
  rationale: Передаёт политический статус שרים и множественное גוים естественным и возвышенным русским выражением.
- source_word: במזמתם
  choice: в своих замыслах
  rationale: מזמה означает замысел, план или обдуманное решение; контекст похвалы требует нейтрально-положительного смысла.
- source_word: ורוזנים
  choice: и правители
  rationale: רוזנים обозначает высокопоставленных властителей или сановников; «правители» ясно сохраняет управленческий смысл.
- source_word: במחקרותם
  choice: в своих изысканиях
  rationale: Сохраняет значение тщательного исследования и поиска, не сводя его без необходимости лишь к пониманию.
- source_word: חכמי שיח
  choice: мудрые в речах
  rationale: Близко передаёт буквальное «мудрые речью/в речи» и естественно звучит по-русски.
- source_word: בספרתם
  choice: благодаря своим писаниям
  rationale: Передаёт связь мудрости с письменной и книжной деятельностью; вариант Масады «в своих книгах» подтверждает эту смысловую область.
- source_word: ומושלים
  choice: и управляющие
  rationale: Причастная форма от משל обозначает тех, кто осуществляет управление; выбор избегает близкого повтора слова «правители».
- source_word: במשמרותם
  choice: на своих постах
  rationale: משמרת может означать стражу, дежурство, порученную службу или должность; «на своих постах» сохраняет служебно-административную неоднозначность и звучит естественно.
