  text: Abraham[a], father of a multitude of nations—no blemish was found in his honor.
translation:
  language: ru
  text: Авраам, отец множества народов, не запятнал своей чести.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «и не нашлось равного ему в славе» (или «в чести»).'
    reason: Альтернативное чтение греческой традиции существенно отличается от сохранившегося еврейского текста.
lexical_decisions:
- source_word: אב
  choice: отец
  rationale: Еврейское слово прямо означает «отец»; тот же образ сохраняет греческое πατήρ. Такой перевод также передаёт отзвук обетования Аврааму.
- source_word: המון גוים
  choice: множество народов
  rationale: Фраза перекликается с данным Аврааму обетованием и буквально обозначает множество народов; греческое πλήθους ἐθνῶν подтверждает этот смысл.
- source_word: לא נתן בכבודו מום
  choice: не запятнал своей чести
  rationale: Буквально трудная еврейская конструкция говорит, что Авраам «не дал/не положил изъяна в своей чести». Естественное русское выражение «не запятнал своей чести» сохраняет активную форму, отрицание и образ неповреждённой чести.
- source_word: כבוד
  choice: честь
  rationale: כבוד может означать «честь» или «слава». В сочетании с מום («изъян, пятно») русское «честь» образует ясную и естественную фразу.
- source_word: מום
  choice: пятно (в глагольном выражении «не запятнал»)
  rationale: מום обозначает изъян или порок. Выражение «не запятнал» идиоматично передаёт этот образ применительно к чести, не добавляя конкретного нравственного проступка.
theological_decisions:
- issue: Расхождение еврейского и греческого текста в заключительной части стиха
  choice: 'Основной текст следует сохранившемуся еврейскому чтению: Авраам не запятнал своей чести.'
  alternative: 'Греческий текст: «и не нашлось равного ему в славе» (или «в чести»).'
  rationale: Еврейский свидетель имеет приоритет и содержит образ изъяна или пятна на чести. Греческая версия выражает иную похвалу — отсутствие равного Аврааму. Поскольку различие существенно, греческое чтение вынесено в примечание, а не смешано с еврейским.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Формула «отец множества народов» сохраняет торжественный отзвук обетования, а «не запятнал своей чести» естественно передаёт трудную еврейскую конструкцию.
