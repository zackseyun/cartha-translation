translation:
  language: ru
  text: Их тела были собраны в покое[a][b], и имя их живёт из поколения в поколение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Тело их было погребено в покое». Греческий свидетель прямо выражает погребальный смысл там, где еврейский текст говорит: «были собраны в покое».'
    reason: alternative_reading
  - marker: b
    text: 'Масадский текст сохраняет здесь более краткое чтение («если/в покое были собраны»), тогда как текст Каирской генизы гласит: «Их тела были собраны в покое».'
    reason: textual_variant
lexical_decisions:
- source_word: גויתם
  choice: их тела
  rationale: Еврейское גויה обозначает тело, нередко мёртвое тело. По контексту уместно множественное число «тела»; греческое τὸ σῶμα αὐτῶν имеет собирательную форму единственного числа.
- source_word: בשלום
  choice: в мире
  rationale: Предложное сочетание буквально означает «в мире» и сохраняет как еврейскую формулировку, так и соответствие греческому ἐν εἰρήνῃ, не сводя смысл лишь к наречию «мирно».
- source_word: נאספו
  choice: были собраны
  rationale: Страдательная форма אסף может быть эвфемистическим обозначением смерти, однако в сохранившемся еврейском тексте погребение прямо не названо. Буквальный выбор сохраняет образ и его неоднозначность; погребальный смысл поясняется в сноске по греческому свидетелю.
- source_word: ושמם
  choice: и имя их
  rationale: «Имя» прямо передаёт еврейское слово и сохраняет библейский образ продолжающейся славы и памяти.
- source_word: חי
  choice: живёт
  rationale: Глагол «живёт» сохраняет олицетворение имени и точно соответствует как еврейскому חי, так и греческому ζῇ.
- source_word: לדור ודור
  choice: из поколения в поколение
  rationale: Это естественная для современного русского передача устойчивого еврейского выражения о непрерывности в череде поколений.
theological_decisions:
- issue: Следует ли согласовать еврейский эвфемизм смерти с греческим «было погребено»
  choice: В основном тексте сохранить основанное на еврейском «были собраны в мире»
  alternative: Их тела были погребены в мире
  rationale: В Сирахе при наличии еврейского текста он имеет приоритет. Греческий параллельный текст подтверждает погребальный контекст, но делает его явным сильнее, чем еврейский; поэтому это уточнение вынесено в сноску.
translation_notes:
  register: Современный литературный русский с умеренно библейской образностью. Необычное сочетание «были собраны в мире» намеренно сохраняет еврейский эвфемизм и его смысловую напряжённость; сноска раскрывает более явное греческое прочтение.
