lexical_decisions:
- source_word: כל אלה
  choice: Все они
  rationale: Естественно отсылает к ранее перечисленным людям, не добавляя отсутствующего в еврейском тексте слова «мужи».
- source_word: בדורם
  choice: в своих поколениях
  rationale: Сохраняет образ исходного текста; множественное число согласуется с греческой параллелью ἐν γενεαῖς и указывает на разные исторические поколения перечисленных лиц.
- source_word: ומימיהם
  choice: и во дни свои
  rationale: Передаёт временной смысл оборота, подтверждаемый греческим ἐν ταῖς ἡμέραις αὐτῶν; формулировка современна, но сохраняет библейское достоинство.
- source_word: תפארתם
  choice: были славой
  rationale: Передаёт תפארת как «слава» и естественно разворачивает краткое еврейское именное предложение, не сводя значение к субъективной «гордости».
