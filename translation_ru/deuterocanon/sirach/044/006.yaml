lexical_decisions:
- source_word: אנשי חיל
  choice: мужи доблестные
  rationale: Сочетание обозначает людей силы, способности, доблести или достоинства. В хвалебном контексте «мужи доблестные» сохраняет широкий положительный смысл и не сводит его ни только к воинской храбрости, ни к богатству.
- source_word: וסמכי כח
  choice: твёрдые в силе
  rationale: Сочетание передаёт укоренённость, устойчивость или опору в силе. Такой перевод сохраняет образ стойкой силы и естественно звучит по-русски, не превращая выражение в неясное «поддерживающие силу».
- source_word: ושוקטים
  choice: спокойно жившие
  rationale: Причастие выражает покой, безмятежность и мирное состояние. Добавление «жившие» естественно связывает его с последующим указанием места; греческое εἰρηνεύοντες подтверждает мирный оттенок.
- source_word: על מכונתם
  choice: на своём месте
  rationale: מכונה может означать установленное место, основание или устойчивое положение. «На своём месте» сохраняет эту широту и не уточняет без необходимости как жилище или общественное положение.
