translation:
  language: ru
  text: Всевышний уделил[a] много славы[b], и его величие — от века[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В тексте Каирской генизы стоит חלק; в более древнем свитке из Масады — חולק, что поддерживает глагольное, распределительное понимание: «Всевышний уделяет (распределяет)». В греческом тексте: «Господь сотворил много славы».'
    reason: textual_variant
  - marker: b
    text: 'Или: «много чести»; по смыслу также возможно: «великие почести». Еврейское כבוד и греческое δόξα могут означать как славу, так и честь.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «издревле», «с древних времён» или «от вечности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רב
  choice: много
  rationale: В сочетании רב כבוד слово количественно усиливает понятие славы; «много славы» естественно по-русски и близко к еврейской конструкции.
- source_word: כבוד
  choice: славы
  rationale: כבוד охватывает значения «слава» и «честь». В поэтическом контексте похвалы прославленным людям «слава» звучит естественно; вариант «почести» отмечен в сноске.
- source_word: חלק / חולק
  choice: уделил
  rationale: 'Чтение Масадского свитка חולק подтверждает глагольное понимание: Всевышний распределяет, отводит долю славы. «Уделил» сохраняет этот смысл без излишней тяжеловесности.'
- source_word: עליון
  choice: Всевышний
  rationale: Устоявшийся и понятный русский эквивалент божественного титула.
- source_word: וגדלו
  choice: и его величие
  rationale: Суффикс передан притяжательным местоимением, а גדל — словом «величие». Строчная буква не вносит отсутствующей в оригинале графической интерпретации, хотя ближайшим референтом естественно является Всевышний.
- source_word: מימות עולם
  choice: от века
  rationale: Краткая возвышенная формула передаёт как идею глубокой древности, так и возможный смысл вечности, не устраняя диапазон еврейского выражения.
theological_decisions:
- issue: Подлежащее и синтаксис первой части стиха
  choice: 'Всевышний — подлежащее глагольной конструкции: «Всевышний уделил много славы».'
  alternative: «Господь сотворил много славы»; либо «великая слава — удел Всевышнего».
  rationale: Сохранившийся еврейский текст имеет приоритет, а чтение Масадского свитка חולק особенно поддерживает глагольное понимание с Всевышним как действующим лицом. Отличающееся греческое ἔκτισεν отражено в сноске.
- issue: Референт суффикса в וגדלו
  choice: «его величие» естественно относится к Всевышнему, но местоимение оставлено со строчной буквы.
  alternative: Понимать величие как относящееся к прославляемым людям либо явно написать «величие Всевышнего».
  rationale: Ближайший грамматический референт — Всевышний, что согласуется и с греческим αὐτοῦ. Строчная буква сохраняет обычную русскую орфографию и не превращает интерпретацию в типографически обязательную.
translation_notes:
  register: Современный литературный русский с кратким, возвышенным ритмом. Формула «от века» сохраняет библейскую торжественность, оставаясь понятной. Синтаксис первой части намеренно близок к еврейскому и не добавляет отсутствующего в данном тексте косвенного дополнения «им».
