  text: Raise your voices and bless together[a], and give thanks to Yahweh for all his works.
translation:
  language: ru
  text: Возвысьте голоса и вместе благословите[a], и благодарите Яхве за все Его дела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий параллельный текст: «И, словно ладан, источайте благоухание, и расцветайте, как лилия; распространяйте благоухание и пойте хвалебную песнь». Эта более пространная формулировка отражает иную текстовую форму, чем сохранившаяся еврейская строка.'
    reason: alternative_reading
lexical_decisions:
- source_word: הרימו קולכם
  choice: Возвысьте голоса
  rationale: Повелительная форма множественного числа от רום имеет побудительное значение и относится к «голосу». В еврейском стоит собирательное единственное число с суффиксом множественного числа; русское «голоса» естественно согласуется с обращением ко многим и сохраняет конкретный образ.
- source_word: וברכו
  choice: и благословляйте
  rationale: Порода пиэль глагола ברך обычно означает «благословлять». Перевод сохраняет богослужебную лексику и не сводит значение к более общему «хвалите»; подразумеваемый объект не добавлен в основной текст.
- source_word: יחדו
  choice: вместе
  rationale: Наречие прямо выражает совместность общего призыва; «вместе» звучит современно и сохраняет смысл без усиления.
- source_word: והודו
  choice: и благодарите
  rationale: В породе хифиль глагол ידה в контексте поклонения означает «благодарить, воздавать благодарение». Такой перевод передаёт оттенок благодарности, а не только хвалы.
- source_word: ליהוה
  choice: Яхве
  rationale: В еврейском тексте прямо употреблено личное имя יהוה. Транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- source_word: על כל מעשיו
  choice: за все Его дела
  rationale: מעשים означает «дела, деяния». «За все Его дела» сохраняет именную конструкцию и естественно сочетается с глаголом «благодарите».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Основной текст непосредственно называет Бога тетраграмматоном; форма «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Существенно отличающийся греческий параллельный текст
  choice: Основной текст следует сохранившейся еврейской строке, а греческая форма приведена в сноске
  alternative: Поместить более пространную греческую форму в основной текст
  rationale: Еврейское свидетельство имеет высокую степень надёжности и даёт связный самостоятельный текст. Греческая версия отражает иную, более пространную текстовую форму, поэтому она документирована без смешения двух традиций.
- issue: Не выраженный явно объект глагола וברכו
  choice: Не добавлять объект к слову «благословляйте»
  alternative: Добавить «Яхве» или «Его»
  rationale: Контекст ясно указывает на Бога, однако в еврейской строке объект при וברכו не назван. Его отсутствие сохранено, чтобы не устранять синтаксическую открытость оригинала.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным богослужебным звучанием. Повелительные формы во множественном числе передают общинный призыв; прописное «Его» указывает на Бога в соответствии с принятой русской библейской письменной традицией.
