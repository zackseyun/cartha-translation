  yaml_path: translation/deuterocanon/sirach/039/001.yaml
  text: But the one who gives himself over to it and meditates on the law of the Most High will seek out the wisdom of all the ancients[b][a], and will occupy himself with prophecies.
translation:
  language: ru
  text: Но тот, кто всецело отдаёт себя этому[a] и размышляет над Законом Всевышнего, будет тщательно искать мудрость всех древних и заниматься пророчествами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отдаёт свою душу»; то есть посвящает всего себя. Дополнение «этому» подразумевается из контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет посвящать себя пророческим писаниям»; буквально: «будет заниматься пророчествами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πλὴν
  choice: Но
  rationale: Союз вводит противопоставление предшествующему описанию ремесленников; «но» естественно передаёт здесь противительный переход.
- source_word: τοῦ ἐπιδιδόντος τὴν ψυχὴν αὐτοῦ
  choice: тот, кто всецело отдаёт себя этому
  rationale: Оборот буквально говорит о передаче своей души, то есть всего себя. «Всецело отдаёт себя» сохраняет силу выражения, а «этому» указывает на подразумеваемое по контексту занятие мудростью, не сужая его до одного только изучения Закона.
- source_word: διανοουμένου ἐν νόμῳ Ὑψίστου
  choice: размышляет над Законом Всевышнего
  rationale: διανοέομαι обозначает вдумчивое осмысление; русское управление «размышлять над» естественно передаёт сочетание с ἐν. «Всевышний» сохраняет божественный титул.
- source_word: σοφίαν πάντων ἀρχαίων
  choice: мудрости всех древних
  rationale: ἀρχαῖοι здесь означает людей древности; родительный оборот оставляет открытым, понимается ли их мудрость как принадлежащая им или переданная ими.
- source_word: ἐκζητήσει
  choice: будет искать
  rationale: Глагол означает усердно разыскивать или исследовать. В сочетании с абстрактным существительным «мудрость» русский глагол «искать» звучит естественно, а целенаправленность выражена контекстом.
- source_word: ἐν προφητείαις ἀσχοληθήσεται
  choice: заниматься пророчествами
  rationale: ἀσχολέομαι означает посвящать время и внимание чему-либо. «Пророчества» непосредственно передаёт προφητεῖαι, не превращая его без необходимости в «пророческие писания».
theological_decisions:
- issue: Подразумеваемое дополнение при выражении «отдаёт себя»
  choice: Передать контекстуальной формой «отдаёт себя этому».
  alternative: 'Оставить без дополнения («отдаёт себя») или конкретизировать: «посвящает себя изучению Закона».'
  rationale: В греческом дополнение прямо не названо. Местоимение «этому» делает русскую фразу грамматически ясной и отсылает к контекстуальному служению мудрости, не отождествляя его исключительно с изучением Закона.
- issue: Значение προφητείαις
  choice: Сохранить широкое «пророчествами».
  alternative: Перевести как «пророческими писаниями».
  rationale: Греческое слово может обозначать пророчества как содержание или пророческие тексты. Основной перевод сохраняет эту смысловую открытость, а более узкое понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным премудростной литературе. Синтаксис сделан плавным и общедоступным; выражения «Закон Всевышнего» и «мудрость древних» сохраняют библейский регистр без архаизации.
