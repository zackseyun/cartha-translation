  text: If the great Lord wills[a], he will be filled with a spirit of understanding; he himself will pour forth words of wisdom like rain[b], and in prayer he will give thanks to the Lord.
translation:
  language: ru
  text: Если великий Господь пожелает, он исполнится духом разумения; сам он изольёт, словно дождь, слова мудрости и в молитве воздаст благодарение Господу[a].
  philosophy: optimal-equivalence
  footnotes:
