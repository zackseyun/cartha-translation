    text: 'Или: «исповедуется перед Господом»; возможно также: «признает Господа». Греческий глагол допускает эти значения, хотя контекст молитвы здесь благоприятствует значению благодарения.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν Κύριος ὁ μέγας θελήσῃ
  choice: Если великий Господь пожелает
  rationale: Условная конструкция с аористом сослагательного наклонения передана естественным реальным условием; «пожелает» сохраняет волевой смысл θελήσῃ. Κύριος и определение ὁ μέγας переданы прямо и без архаизации.
- source_word: πνεύματι συνέσεως ἐμπλησθήσεται
  choice: он исполнится духом разумения
  rationale: Сохранены будущее время и страдательно-возвратный смысл глагола. «Дух разумения» передаёт качественное значение сочетания и выдерживает возвышенный, но понятный библейский регистр.
- source_word: ἀνομβρήσει ῥήματα σοφίας αὐτός
  choice: сам он изольёт, словно дождь, слова мудрости
  rationale: Редкий глагол содержит образ дождя; сравнительный оборот сохраняет его, не создавая неестественного русского выражения «одождит слова». «Сам он» передаёт эмфатическое αὐτός.
- source_word: ἐν προσευχῇ
  choice: в молитве
  rationale: Естественно передаёт сферу или обстоятельство действия, выраженное ἐν с дательным падежом.
- source_word: ἐξομολογήσεται Κυρίῳ
  choice: возблагодарит Господа
  rationale: В молитвенном контексте глагол естественно обозначает благодарение или хвалу. Русское управление с винительным падежом обусловлено выбранным глаголом; возможные значения исповедания и признания отмечены в сноске.
theological_decisions:
- issue: Значение ἐξομολογήσεται в контексте молитвы
  choice: благодарение Господа
  alternative: исповедание перед Господом или признание Господа
  rationale: Контекст дара разумения, слов мудрости и молитвы благоприятствует значению благодарственной хвалы, однако многозначность греческого глагола не устраняется и явно отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и метафора дождя сохранены; устаревшие формы вроде «соизволит» не использованы.
