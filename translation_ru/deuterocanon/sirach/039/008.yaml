  yaml_path: translation/deuterocanon/sirach/039/008.yaml
  text: He himself makes plain the instruction of his teaching[b][a], and in the law of the Lord’s covenant he will boast.
translation:
  language: ru
  text: Он сам ясно излагает наставление, содержащееся в его учении[a], и будет хвалиться законом завета Господа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выводит на свет воспитательное наставление его учения». Греческие слова могут также означать раскрытие чего-либо и формирующее воспитание или дисциплину.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет прославляться законом завета Господа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: Он сам
  rationale: Интенсивное местоимение подчёркивает действующее лицо; «Он сам» естественно сохраняет это ударение.
- source_word: ἐκφαίνει
  choice: ясно излагает
  rationale: Глагол обозначает выведение на свет, обнаружение или прояснение. «Ясно излагает» передаёт здесь понятное раскрытие наставления и сохраняет настоящее время греческой формы.
- source_word: παιδείαν
  choice: наставление
  rationale: В литературе мудрости слово охватывает обучение, воспитание и дисциплину. «Наставление» передаёт педагогический смысл, не сводя его к наказанию.
- source_word: διδασκαλίας
  choice: учения
  rationale: «Учение» сохраняет общий смысл преподавания и содержания наставления без излишне специального догматического оттенка.
- source_word: νόμῳ
  choice: законом
  rationale: В иудейском контексте премудрости νόμος естественно указывает на Закон, Тору; творительный падеж после «хвалиться» даёт современную русскую конструкцию.
- source_word: διαθήκης
  choice: завета
  rationale: В библейском употреблении διαθήκη означает завет; родительный падеж сохраняет связь с «законом».
- source_word: Κυρίου
  choice: Господа
  rationale: Передано традиционным и понятным библейским титулом «Господь».
- source_word: καυχήσεται
  choice: будет хвалиться
  rationale: Будущая форма означает хвалу, похвалу или торжествующую гордость. «Будет хвалиться» прямо передаёт значение, не устраняя возможного оттенка внутренней гордости.
theological_decisions:
- issue: Связь слов νόμῳ, διαθήκης и Κυρίου в выражении ἐν νόμῳ διαθήκης Κυρίου
  choice: «законом завета Господа»
  alternative: «законом — заветом Господа»; «заветным законом Господа»
  rationale: Родительный падеж διαθήκης естественнее всего определяет νόμῳ, а Κυρίου — «завет». Такая передача сохраняет компактность греческой конструкции и не отождествляет закон с заветом более определённо, чем это делает исходный текст.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены смена настоящего времени на будущее и напряжение между положительной похвалой и возможным оттенком хвастовства; тяжеловесная буквальная конструкция «наставление учения» слегка сглажена глаголом «ясно излагает».
