  text: With the service of harp and instruments of music[c][b][a], so you shall speak with a shout of praise.
translation:
  language: ru
  text: Под звуки арфы[a] и разных музыкальных инструментов — так возглашайте[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лиры». Еврейское слово обозначает древний струнный инструмент, точное современное соответствие которого не установлено.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный более буквальный перевод: «говорите с громким возгласом» или «говорите с ликованием»; это слово может также обозначать трубный сигнал.'
    reason: lexical_alternative
  - marker: c
    text: 'Греческий текст этого стиха значительно полнее: в нём прямо говорится о благословении Господа, возвеличивании его имени и хвале. Сохранившийся еврейский текст содержит здесь лишь упоминание музыкального сопровождения и возгласа.'
    reason: textual_variant
lexical_decisions:
- source_word: בשירות
  choice: под звуки
  rationale: В данном музыкально-богослужебном контексте слово указывает на музыкальное исполнение или сопровождение. Русское «под звуки» естественно связывает его с перечисленными далее инструментами, не вводя неясное буквальное «служение».
- source_word: נבל
  choice: арфы
  rationale: Название древнего струнного инструмента, точное современное соответствие которого спорно. «Арфа» — понятный и традиционный русский эквивалент; возможность «лиры» отмечена в сноске.
- source_word: כלי מינים
  choice: разных музыкальных инструментов
  rationale: Буквально сочетание означает инструменты различных видов. Перевод передаёт множественность видов и ясно выражает подразумеваемый музыкальный характер.
- source_word: וכן
  choice: так
  rationale: 'Наречие вводит способ последующего действия: «и так», «таким образом».'
- source_word: תאמרו
  choice: возглашайте
  rationale: Форма второго лица множественного числа означает «говорите/скажите». В сочетании с תרועה естественное русское «возглашайте» передаёт громкое совместное произнесение, не добавляя конкретных слов хвалы.
- source_word: בתרועה
  choice: возглашайте
  rationale: תרועה может обозначать громкий радостный крик, ликование, возглас или трубный сигнал. Значение включено в глагол «возглашайте»; более буквальные возможности сохранены в сноске.
theological_decisions:
- issue: Краткое еврейское чтение расходится с более полным греческим параллельным текстом
  choice: Перевести сохранившуюся еврейскую строку без добавления отсутствующих в ней призывов благословлять Господа и возвеличивать его имя.
  alternative: Следовать греческому тексту и включить явные призывы благословлять Господа, возвеличивать его имя и восхвалять его.
  rationale: Приоритет отдан засвидетельствованному еврейскому тексту. Греческая параллель подтверждает контекст музыкальной хвалы, но её дополнительные фразы не внесены в основной перевод; существенное расхождение обозначено сноской.
- issue: Явно ли תרועה означает хвалу
  choice: Не добавлять слова «хвалы» в основной текст.
  alternative: Перевести «с возгласом хвалы».
  rationale: Контекст хвалы поддерживается греческой параллелью, однако в самой краткой еврейской строке תרועה означает прежде всего громкий возглас, ликование или сигнал. Перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием. Конструкция «под звуки» выбрана вместо буквального и неестественного «со служением». Повелительное «возглашайте» естественно передаёт еврейскую форму второго лица множественного числа в контексте громкой богослужебной речи.
