base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/028.yaml
  text: There are spirits created for judgment[a], and in their anger they move mountains; at the time of wrath they display their might[b], and they stir up a storm from the open country.
translation:
  language: ru
  text: 'Есть духи, созданные для суда[a]: в гневе своём они сдвигают горы; в час ярости они являют свою мощь[b] и поднимают бурю из открытой местности.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ветры, созданные для наказания». Еврейское רוחות и греческое πνεύματα могут означать и «духи», и «ветры».'
    reason: lexical_alternative
  - marker: b
    text: Заключительная часть стиха в каирском еврейском тексте заключена в квадратные скобки, что указывает на текстуальную неуверенность. Греческий параллельный текст содержит тематически сходное развёрнутое описание духов, созданных для возмездия, но не воспроизводит эту формулировку буквально.
    reason: textual_variant
lexical_decisions:
- source_word: רוחות
  choice: духи
  rationale: Еврейское слово может означать как «духи», так и «ветры»; греческое πνεύματα сохраняет ту же двусмысленность. В основном тексте выбрано «духи», поскольку они представлены как созданные для суда и действующие как олицетворённые исполнители, а значение «ветры» сохранено в сноске.
- source_word: למשפט
  choice: для суда
  rationale: Передаёт назначение этих духов и сохраняет широкий смысл משפט, не сводя его исключительно к наказанию.
- source_word: נוצרו
  choice: созданные
  rationale: Точно передаёт пассивную форму «были созданы/сформированы» и согласуется с греческим ἔκτισται.
- source_word: ובאפם
  choice: в гневе своём
  rationale: אף здесь естественно понимать идиоматически как «гнев»; это подтверждается греческим ἐν θυμῷ αὐτῶν.
- source_word: הרים יעתיקו
  choice: они сдвигают горы
  rationale: Глагол выражает перемещение или смещение; «сдвигают горы» сохраняет образ колоссальной разрушительной силы без лишнего уточнения «искореняют».
- source_word: בעת זעם
  choice: во время ярости
  rationale: Близко передаёт временное обстоятельство и сильную окраску זעם.
- source_word: גבורתם יראו
  choice: они являют свою мощь
  rationale: Естественно передаёт проявление или демонстрацию силы; форма допускает понимание «показывают свою мощь».
- source_word: וסער מן שדה יעוררו
  choice: и поднимают бурю над открытой местностью
  rationale: סער — «буря», יעוררו — «пробуждают, поднимают», а שדה здесь обозначает поле или открытую местность. Предлог מן буквально означает «из/от», однако по-русски образ естественно передаётся как буря, поднимаемая над открытой местностью.
theological_decisions:
- issue: Следует ли понимать רוחות/πνεύματα как духов или как ветры
  choice: «духи» в основном тексте
  alternative: «ветры, созданные для наказания»
  rationale: Оба смысла лексически возможны, и стих намеренно соединяет представление об исполнителях суда с образами стихий. Основной вариант отражает олицетворённость, а сноска сохраняет реальную двусмысленность.
- issue: Включение заключительной части, заключённой в квадратные скобки в еврейском издании
  choice: включить в основной текст со сноской
  alternative: опустить как текстуально неуверенную
  rationale: Еврейское издание отмечает неуверенность квадратными скобками, однако греческий свидетель подтверждает более полный объём стиха. Сноска открыто сообщает о состоянии текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся ясным для широкого читателя; двусмысленность ключевого слова и текстуальная неуверенность не скрыты.
