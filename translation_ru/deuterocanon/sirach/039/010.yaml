  text: Nations will recount his wisdom[a], and the assembly will proclaim his praise.
translation:
  language: ru
  text: Народы будут рассказывать о его мудрости, и собрание[a] возвестит его хвалу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «община». Греческое ἐκκλησία означает собравшееся сообщество или собрание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διηγήσονται
  choice: будут рассказывать
  rationale: Глагол означает последовательный рассказ или повествование; это естественная современная передача будущего времени без ослабления публичного характера свидетельства.
- source_word: ἔθνη
  choice: народы
  rationale: В данном контексте речь идёт о народах вообще; вариант не навязывает противопоставления иудеев и язычников.
- source_word: σοφίαν
  choice: мудрости
  rationale: Обычное и контекстуально точное соответствие σοφία, сохраняющее нравственный и интеллектуальный смысл слова у Сираха.
- source_word: ἐξαγγελεῖ
  choice: возвестит
  rationale: Передаёт публичное объявление и соответствует возвышенному, но понятному регистру исходного стиха.
- source_word: ἐκκλησία
  choice: собрание
  rationale: В дохристианском иудейском контексте слово обозначает собравшуюся общину; «собрание» точно и не создаёт анахроничной отсылки к христианской Церкви.
- source_word: ἔπαινον
  choice: хвалу
  rationale: Сохраняет значение публичного одобрения и прославления и естественно сочетается с глаголом «возвестит».
- source_word: αὐτοῦ
  choice: его
  rationale: Оба местоимения относятся к мудрецу, упомянутому в контексте; мужской род и единственное число сохранены по греческому тексту.
theological_decisions:
- issue: Передача ἐκκλησία в дохристианском иудейском тексте
  choice: собрание
  alternative: община; церковь
  rationale: «Собрание» передаёт собравшееся сообщество и избегает анахроничного отождествления с христианской Церковью; допустимое «община» отмечено в сноске.
- issue: Род и число местоимения αὐτοῦ
  choice: его
  alternative: их
  rationale: Греческое местоимение стоит в мужском роде единственного числа и указывает на отдельного мудреца; нейтрализация множественным числом исказила бы источник.
- issue: Смысл сочетания τὸν ἔπαινον αὐτοῦ
  choice: его хвалу
  alternative: хвалу ему
  rationale: Формулировка сохраняет притяжательную конструкцию греческого текста и присущую ей возможность понимать выражение как хвалу, относящуюся к мудрецу, не вводя отсутствующего в источнике дательного дополнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксический параллелизм двух частей сохранён. Маркер сноски перенесён к слову «собрание», которого непосредственно касается пояснение; его положение после слова «мудрости» в английском консультационном слое признано техническим несоответствием.
