  source_fidelity: «Повествования о прославленных мужах» точно передаёт διηγήσεις ἀνδρῶν ὀνομαστῶν; «сохранит» соответствует συντηρήσει. «Проникнет в хитросплетения притч» передаёт образное ἐν στροφαῖς παραβολῶν συνεισελεύσεται — вхождение в повороты, сложные ходы притч — без неоправданного уточнения их смысла.
