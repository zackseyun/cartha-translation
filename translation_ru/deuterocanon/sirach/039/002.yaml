  text: He will preserve the accounts of famous men, and he will enter into the twists of parables.
translation:
  language: ru
  text: Он сохранит повествования о прославленных мужах и проникнет в хитросплетения притч.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διηγήσεις
  choice: повествования
  rationale: Передаёт рассказы или повествовательные свидетельства, не сужая значение до кратких «сообщений».
- source_word: ἀνδρῶν ὀνομαστῶν
  choice: о прославленных мужах
  rationale: ὀνομαστός означает известных, именитых людей; «мужах» сохраняет мужской референт и достоинство стиля.
- source_word: συντηρήσει
  choice: сохранит
  rationale: Сохраняет прямой смысл бережного удержания и передачи памяти.
- source_word: ἐν στροφαῖς παραβολῶν
  choice: в хитросплетения притч
  rationale: στροφαί буквально указывает на повороты; в данном контексте «хитросплетения» естественно выражает сложные смысловые ходы, не устраняя образность.
- source_word: συνεισελεύσεται
  choice: проникнет
  rationale: Передаёт вхождение внутрь и углубление в предмет; по-русски естественнее буквального «войдёт» при абстрактном дополнении.
theological_decisions:
- issue: Характер обращения мудреца с преданием и притчами
  choice: 'Сохранена последовательность: он хранит повествования и углубляется в притчи.'
  alternative: Понять первую часть как простое запоминание, а вторую — как сочинение притч.
  rationale: Греческий текст говорит о сохранении повествований и вхождении в «повороты» притч; он прямо не утверждает ни механического заучивания, ни авторства.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, мудрословным звучанием. Союз «и» сохраняет параллелизм греческой строки.
