base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/004.yaml
  text: He will serve among great men[a], and will appear before a ruler; he will travel through the land of foreign nations, for he has tested good and evil among men.
translation:
  language: ru
  text: Он будет служить среди вельмож и предстанет перед правителем; пройдёт по земле чужих народов, ведь среди людей он испытал и добро, и зло.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «познал на опыте добро и зло среди людей». Греческий глагол может означать как испытание или проверку, так и приобретение личного опыта.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνὰ μέσον μεγιστάνων
  choice: среди вельмож
  rationale: Оборот ἀνὰ μέσον означает «среди», а μεγιστάνων — высокопоставленных и влиятельных лиц. «Вельможи» естественно передаёт придворный и общественный статус без лишней конкретизации.
- source_word: ὑπηρετήσει
  choice: будет служить
  rationale: Глагол обозначает служение или исполнение обязанностей при ком-либо; широкий русский глагол не придаёт выражению специально религиозного смысла.
- source_word: ἔναντι ἡγουμένου ὀφθήσεται
  choice: предстанет перед правителем
  rationale: Буквально пассивная форма означает «будет увиден», но в данном сочетании речь идёт о появлении или получении доступа к правителю. «Предстанет» кратко и естественно передаёт официальный контекст.
- source_word: ἐν γῇ ἀλλοτρίων ἐθνῶν διελεύσεται
  choice: пройдёт по земле чужих народов
  rationale: Сохранены единственное число γῇ и множественное число ἐθνῶν. «Пройдёт по земле» передаёт пересечение или странствие, а «чужих народов» — взгляд человека, находящегося вне этих народов.
- source_word: ἐπείρασεν
  choice: испытал
  rationale: Глагол допускает значения испытания, пробы и познания на опыте. «Испытал» сохраняет как активный оттенок исследования, так и возможность личного переживания.
- source_word: ἀγαθὰ καὶ κακὰ
  choice: и добро, и зло
  rationale: Прямо сохраняется весомая противоположность добра и зла без сужения смысла до благополучия и несчастья.
- source_word: ἐν ἀνθρώποις
  choice: среди людей
  rationale: В данном контексте выражение относится к человеческому обществу в целом. Русское «людей» естественно передаёт родовое значение ἀνθρώποις и не создаёт ошибочного ограничения только мужчинами.
theological_decisions:
- issue: Смысл ἐπείρασεν применительно к добру и злу
  choice: Сохранить многозначное «испытал» в основном тексте
  alternative: «познал на опыте» или «изведал»
  rationale: Контекст допускает как проверку и исследование человеческих явлений, так и личное знакомство с ними на опыте; основной текст не должен устранять эту напряжённость.
- issue: Характер пары ἀγαθὰ καὶ κακὰ
  choice: «добро и зло»
  alternative: «хорошее и плохое» или «благополучие и бедствие»
  rationale: Греческая пара может охватывать и нравственную, и жизненно-опытную сферу. «Добро и зло» сохраняет широту и богословскую весомость выражения, не сводя его лишь к обстоятельствам судьбы.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной книги. «Вельможи» и «предстанет» поддерживают официальный придворный контекст, но остаются понятными современному читателю; синтаксис сохраняет параллельное движение греческого стиха.
