translation:
  language: ru
  text: Пути непорочного — прямы, а для чужих они гибельны.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «а для беззаконных — преткновения». По-видимому, греческий перевод понимает еврейское «чужие» как людей, чуждых Божьему пути.'
    reason: alternative_reading
  - marker: b
    text: Последний еврейский глагол труден для понимания; перевод «гибельны» передаёт отрицательный смысл, учитывая греческую параллель, где сказано о преткновениях.
    reason: textual_variant
lexical_decisions:
- source_word: ארחות
  choice: пути
  rationale: Сохраняет обычную метафору жизненного пути и соответствует множественному числу еврейского слова.
- source_word: תמים
  choice: непорочного
  rationale: Передаёт нравственный смысл «безупречный, цельный, непорочный», не подменяя еврейское слово греческим толкованием «благочестивый».
- source_word: יישרו
  choice: становятся прямыми
  rationale: Форма от ישר допускает значение «быть/становиться прямым». Русская формулировка сохраняет глагольную динамику, не вводя прямо не названного деятеля.
- source_word: כן
  choice: а
  rationale: В антитетическом параллелизме естественно обозначает сопоставление и контраст между двумя частями изречения.
- source_word: לזרים
  choice: для чужаков
  rationale: Буквально передаёт значение «для чужих, посторонних». Более узкое нравственное толкование греческого текста вынесено в примечание.
- source_word: יסתוללו
  choice: пагубными
  rationale: Еврейский глагол труден и его точный смысл неясен. Выбор передаёт отрицательный, ведущий к падению результат, подтверждаемый греческим «препятствиями для преткновения», но не отождествляет с ним еврейскую форму.
theological_decisions:
- issue: Еврейское «чужаки» и греческое толкование «беззаконные»
  choice: В основном тексте сохранено еврейское «для чужаков».
  alternative: «для беззаконных»
  rationale: При наличии надёжного еврейского текста он имеет приоритет. Греческая версия, вероятно, нравственно истолковывает «чужих» как людей, чуждых Божьему пути; это толкование не следует незаметно вносить в основной текст.
- issue: Неясный смысл заключительного еврейского глагола
  choice: «пагубными»
  alternative: «препятствиями для преткновения»
  rationale: Перевод сохраняет отрицательный итог, не выдавая конкретный образ греческой версии за бесспорное значение трудной еврейской формы.
translation_notes:
  register: Современный литературный русский язык с лаконичной, афористичной структурой. Слово «чужаки» намеренно сохраняет неопределённость еврейского זרים; примечание предупреждает против исключительно этнического прочтения через указание на греческое нравственное толкование.
