translation:
  language: ru
  text: Дела всякой плоти — пред Ним[a], и ничто не сокрыто от Его глаз.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всего живого» либо «всего человечества». Еврейское выражение «всякая плоть» имеет широкий смысл; так же буквально сказано и в греческом тексте.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте: «и невозможно быть скрытым от Его глаз»; невозможность выражена несколько явнее, чем в еврейском.'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשה
  choice: дела
  rationale: Единственное число в сопряжённой конструкции с כל בשר имеет собирательное значение. «Дела» естественно передаёт поступки и согласуется с греческим ἔργα.
- source_word: כל בשר
  choice: всякая плоть
  rationale: Сохраняет широкий библейский образ еврейского выражения, которое может обозначать всё живое или всё человечество; греческое πάσης σαρκὸς подтверждает буквальный образ.
- source_word: נגדו
  choice: пред Ним
  rationale: Кратко и достойно передаёт нахождение перед Богом, в Его присутствии; соответствует греческому ἐνώπιον αὐτοῦ.
- source_word: אין נסתר
  choice: ничто не сокрыто
  rationale: Прямо передаёт еврейское утверждение, не добавляя явно выраженной в греческом оттеночной идеи невозможности скрыться.
- source_word: מנגד עיניו
  choice: от Его глаз
  rationale: Передаёт образ глаз и исходное значение удаления или сокрытия от взора, оставаясь естественным по-русски.
theological_decisions:
- issue: Объём выражения «всякая плоть» под Божьим наблюдением
  choice: Сохранить идиому «всякая плоть», не сужая её значения.
  alternative: «всё человечество» или «всякое живое существо»
  rationale: Еврейский текст и греческая параллель сохраняют образ плоти; он допускает широкий охват и не позволяет безоговорочно ограничить речь только людьми либо всеми живыми существами.
- issue: Формулировка невозможности скрыться
  choice: Следовать еврейскому утверждению «ничто не сокрыто».
  alternative: «невозможно скрыться от Его глаз»
  rationale: Греческий текст делает невозможность более явной, тогда как еврейский прежде всего констатирует отсутствие чего-либо сокрытого; различие отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Пред Ним» и «всякая плоть» сохраняют достоинство и образность источника; синтаксис краток и понятен.
