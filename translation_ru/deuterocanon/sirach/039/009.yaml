base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/009.yaml
  text: Many will praise his understanding; it will not be blotted out forever. His remembrance will not depart[a], and his name will live for generations of generations.
translation:
  language: ru
  text: Многие будут восхвалять его разумение; оно не изгладится вовек. Память о нём не исчезнет, и имя его будет жить из поколения в поколение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в поколения поколений»; это выражение означает продолжение через сменяющие друг друга поколения.'
    reason: Сохраняется доступ к форме греческого выражения при естественной формулировке в основном тексте.
lexical_decisions:
- source_word: αἰνέσουσιν
  choice: будут восхвалять
  rationale: Передаёт будущее время и открыто выраженную похвалу; по стилю подходит возвышенной речи книги Премудрости.
- source_word: σύνεσιν
  choice: разумение
  rationale: Сохраняет значение понимания и проницательности, а также характерный для литературы мудрости регистр.
- source_word: ἕως τοῦ αἰῶνος
  choice: вовек
  rationale: Кратко и естественно передаёт идиому непреходящей длительности, сохраняя возвышенный тон.
- source_word: ἐξαλειφθήσεται
  choice: не изгладится
  rationale: Сохраняет образ стирания или уничтожения, не сводя его к отвлечённому понятию наследия.
- source_word: μνημόσυνον
  choice: память о нём
  rationale: В данном параллелизме речь идёт о сохраняющемся воспоминании о человеке, а не обязательно о вещественном памятнике.
- source_word: οὐκ ἀποστήσεται
  choice: не исчезнет
  rationale: Естественно по-русски выражает мысль о том, что память не уйдёт и не прекратится; буквальное «не отступит» здесь звучало бы неясно.
- source_word: ὄνομα αὐτοῦ
  choice: имя его
  rationale: Сохраняет буквальный образ имени как носителя славы и репутации.
- source_word: ζήσεται
  choice: будет жить
  rationale: Сохраняет яркое олицетворение имени в греческом тексте.
- source_word: εἰς γενεὰς γενεῶν
  choice: из поколения в поколение
  rationale: Естественная современная русская идиома, передающая продолжение памяти во множестве сменяющих друг друга поколений.
theological_decisions:
- issue: Степень буквальности образов непреходящей славы
  choice: Сохранить образы изглаживания, памяти и живущего имени.
  alternative: 'Передать всё обобщённо: «его наследие останется навеки».'
  rationale: Конкретные поэтические образы составляют смысловую и богословскую ткань стиха; обобщающий пересказ неоправданно сгладил бы её.
- issue: Длительность выражения εἰς γενεὰς γενεῶν
  choice: Передать как продолжение «из поколения в поколение», не уточняя абсолютную или ограниченную продолжительность.
  alternative: «Во все поколения» или «вовеки».
  rationale: Греческая усилительная формула указывает на длительное существование в череде поколений; перевод не должен усиливать её до более однозначного утверждения, чем позволяет форма источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом, подходящим для литературы мудрости. Архаизмы сведены к понятному слову «вовек»; параллельные образы исходного текста сохранены.
