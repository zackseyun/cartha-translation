  naturalness: «Воды громоздятся валом» — естественный современный поэтический русский оборот; он яснее передаёт накопление вод, чем «воды встают, словно вал». Номинальная вторая строка с тире литературно естественна в библейской поэзии.
  terminology: «Изречение уст Его» сохраняет конкретный образ מוצא פיו и возвышенный, но современно понятный регистр. «Хранилища вод» отражает греческое ἀποδοχεῖα ὑδάτων; сноска должна ясно обозначить, что еврейский текст имеет единственное число и что множественное число следует греческому свидетелю.
