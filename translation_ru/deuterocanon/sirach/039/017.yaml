base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/017.yaml
  text: At his word the waters pile up like a heap[a], and at the utterance of his mouth are storehouses of water.
translation:
  language: ru
  text: 'По слову Его воды громоздятся валом,

    а по изречению уст Его — хранилища вод.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст во второй строке кратко говорит: «и по изречению уст Его — Его хранилище»; греческий свидетель читает: «хранилища вод», что и принято в переводе.'
    reason: alternative_reading
lexical_decisions:
- source_word: בדברו
  choice: По слову Его
  rationale: 'Предлог ב допускает как орудийный, так и временной оттенок: воды собираются силой слова и тогда, когда оно произнесено. Краткая русская формула сохраняет оба смысла и поэтический параллелизм.'
- source_word: יעריך
  choice: встают
  rationale: 'Глагол ערך буквально означает «располагать, выстраивать». В сочетании с образом водяного вала и с учётом греческого ἔστη выбран естественный русский глагол, передающий результат: воды становятся собранной, возвышающейся массой.'
- source_word: כנד מים
  choice: воды встают, словно вал
  rationale: נד обозначает груду или собранную массу; применительно к воде это образ стоящего водяного вала. «Вал» звучит естественнее буквальной «груды воды» и не устраняет поэтического образа.
- source_word: ובמוצא פיו
  choice: а по изречению Его уст
  rationale: מוצא буквально указывает на то, что выходит из уст, то есть на произнесённое слово. «Изречение Его уст» сохраняет конкретность еврейского оборота и параллель с первой строкой.
- source_word: אוצרו
  choice: появляются хранилища вод
  rationale: Еврейский текст кратко говорит «его хранилище», тогда как греческий свидетель имеет «хранилища вод». Глагол «появляются» восполняет подразумеваемую связь с повелением, а «хранилища вод» ясно передаёт поддержанное греческим контекстуальное значение.
theological_decisions:
- issue: К кому относятся местоименные формы «Его слово» и «Его уста»
  choice: Сохранено местоимение, подразумевающее Бога как Творца в контексте гимна
  alternative: Прямо добавить в стих слово «Бог»
  rationale: Контекст ясно указывает на Бога, однако еврейский текст не называет Его в этом стихе. Сохранение местоимений избегает ненужного разъясняющего добавления.
- issue: Характер действия слова Творца
  choice: Слово представлено как действенное повеление, при котором воды встают и появляются их хранилища
  alternative: Истолковать речь только как описание уже существующего порядка природы
  rationale: Параллельные выражения связывают устройство вод непосредственно с Божьим словом, но перевод не уточняет сверх текста, идёт ли речь о сотворении, собирании или открытии водных хранилищ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской библейской издательской традиции; имя Бога в текст не добавлено. Образ «вала» выбран вместо неестественной «груды воды».
