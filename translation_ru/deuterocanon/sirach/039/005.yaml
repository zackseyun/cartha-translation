base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/005.yaml
  text: He will devote his heart to rising early to the Lord who made him[a], and he will make supplication before the Most High; he will open his mouth in prayer, and he will make supplication for his sins.
translation:
  language: ru
  text: Он направит своё сердце к тому, чтобы с раннего утра обратиться к Господу, создавшему его[a], и будет возносить прошения перед Всевышним; откроет свои уста в молитве и будет возносить прошения о своих грехах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы рано встать ради Господа»; греческий глагол говорит о раннем подъёме и в данном контексте может подразумевать усердное искание Господа с раннего утра.'
    reason: Лексическая неоднозначность ὀρθρίσαι; сноска сохраняет буквальный компонент раннего подъёма, не подменяя направленное πρός Κύριον значением «перед Господом».
lexical_decisions:
- source_word: ἐπιδώσει τὴν καρδίαν αὐτοῦ
  choice: устремит своё сердце
  rationale: Сочетание обозначает сознательное направление внутренней воли и усердия к определённой цели. «Устремит своё сердце» сохраняет образ сердца и звучит естественно и возвышенно по-русски.
- source_word: ὀρθρίσαι πρὸς Κύριον
  choice: с раннего утра обратиться к Господу
  rationale: ὀρθρίζω указывает на действие ранним утром, а πρός — на направленность к Господу. Формулировка сохраняет оба компонента, не сводя глагол однозначно ни к буквальному вставанию, ни к поиску.
- source_word: τὸν ποιήσαντα αὐτόν
  choice: создавшему его
  rationale: Причастный оборот прямо называет Господа тем, кто его создал; выбранная формулировка близка греческому тексту и естественна в русском контексте.
- source_word: ἔναντι Ὑψίστου
  choice: перед Всевышним
  rationale: Передаёт значение пребывания перед лицом или в присутствии Всевышнего, сохраняя пространственно-богословский образ.
- source_word: δεηθήσεται
  choice: будет молить
  rationale: Глагол выражает настойчивое прошение, а не молитву вообще. Одинаковый перевод обоих употреблений сохраняет намеренный повтор исходного текста.
- source_word: ἀνοίξει στόμα αὐτοῦ ἐν προσευχῇ
  choice: откроет свои уста в молитве
  rationale: Сохранён яркий образ открытых уст и предложная конструкция, а не сглаженное «начнёт молиться».
- source_word: περὶ τῶν ἁμαρτιῶν αὐτοῦ
  choice: о своих грехах
  rationale: περί обозначает предмет прошения. Перевод не уточняет, идёт ли речь об исповедании, прощении или ином прошении, и тем самым сохраняет смысловую открытость оригинала.
theological_decisions:
- issue: Передача κύριος применительно к Богу
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — традиционный и понятный русский эквивалент, сохраняющий богословскую и почтительную силу наименования без внесения дополнительного оттенка господства.
- issue: Содержание прошения περὶ τῶν ἁμαρτιῶν αὐτοῦ
  choice: будет молить о своих грехах
  alternative: будет просить прощения за свои грехи
  rationale: Греческий текст называет грехи предметом прошения, но прямо не говорит ни о прощении, ни об исповедании. Основной текст не разрешает эту богословскую неопределённость за оригинал.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Формы «уста», «Господь» и «Всевышний» сохраняют достоинство и образность оригинала; синтаксис остаётся понятным широкому читателю. Повтор «будет молить» намеренно сохранён.
