  source_fidelity: 'Основной смысл передан, включая образ сердца, раннее обращение к Богу, «Всевышнего» и повторное прошение о грехах. Однако «молить перед Всевышним» по-русски синтаксически неестественно: глагол «молить» обычно требует прямого дополнения либо конструкции «молить о».'
  naturalness: «Устремит своё сердце к тому, чтобы…» допустимо, но тяжеловесно. «Направит своё сердце» в данном контексте проще и литературно естественнее. «Возносить прошения перед Всевышним» естественно передаёт δεηθήσεται и сохраняет образ предстояния.
  terminology: «Господь», «Всевышний», «уста» и «грехи» выбраны удачно. Для δεηθήσεται последовательно употреблено «возносить прошения», что сохраняет отличие от более широкого понятия молитвы (προσευχή).
