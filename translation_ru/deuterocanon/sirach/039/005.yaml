  to: Он направит своё сердце к тому, чтобы с раннего утра обратиться к Господу, создавшему его[a], и будет возносить прошения перед Всевышним; откроет свои уста в молитве и будет возносить прошения о своих грехах.
  rationale: 'Исправлена неестественная русская сочетаемость при передаче δεηθήσεται: «возносить прошения» передаёт настойчивый характер прошения, допускает конструкцию «перед Всевышним» и повторяется в обоих случаях, как в греческом тексте. «Направит своё сердце» сохраняет καρδία и целенаправленность ἐπιδώσει, но звучит менее тяжеловесно. Сноска уточнена, чтобы не смешивать πρός («к, по направлению к») с ἔναντι («перед»).'
