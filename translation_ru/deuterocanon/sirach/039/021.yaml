review_pass:
  verdict: revise
  source_fidelity: Первая часть точно передаёт еврейское אין לאמר и риторическое זה למה זה. Во второй части исходное «всему придёт сила» неудачно меняет синтаксическую роль הכל и звучит так, словно сила приходит к вещам извне. «Всё проявит свою силу в своё время» естественно передаёт גבר («быть сильным; брать верх, проявлять силу») и сохраняет временную оговорку בעתו. Греческое расхождение уместно отмечено в примечании.
  naturalness: «Не следует говорить» и «Почему это? Почему то?» соответствуют современному литературному, афористичному русскому. «Ведь всему придёт сила» неестественно и семантически мутно; «ибо всё проявит свою силу в своё время» ясно и литературно. Союз «ибо» поддерживает мудростный регистр без архаизации.
  terminology: Специальных богословских терминов нет. Формулировка «проявит свою силу» не подменяет еврейское чтение греческим понятием пользы или потребности. В примечании греческое αὐτῶν лучше передать без ложной конкретизации как «для их нужд/потребностей».
  issues:
