  text: One should not say[a], “Why this and why that?” For everything will prevail in its time.
translation:
  language: ru
  text: 'Не следует говорить: «Почему это? Почему то?» — ибо всё проявит свою силу в своё время[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте вторая часть стиха читается иначе: «ибо всё создано для их нужд (или: потребностей)». В еврейском тексте: «ибо всё проявит свою силу в своё время».'
    reason: alternative_reading
lexical_decisions:
- source_word: אין לאמר
  choice: Не следует говорить
  rationale: Безличный еврейский оборот буквально означает «нельзя/не должно говорить»; русское «не следует говорить» естественно передаёт общее предостережение.
- source_word: זה למה זה
  choice: «Почему это? Почему то?»
  rationale: Сохранены повтор указательного местоимения и два риторических вопроса; «это… то» естественно обозначает сопоставление разных вещей.
- source_word: כי
  choice: ведь
  rationale: Вводит основание предостережения и естественно звучит в современной русской речи.
- source_word: הכל
  choice: всему
  rationale: Дательный оборот с «придёт сила» передаёт всеохватность еврейского «всё».
- source_word: בעתו
  choice: в своё время
  rationale: Передаёт принадлежность надлежащего времени каждой вещи, не усиливая выражение до более толковательного «в назначенный срок».
- source_word: יגבר
  choice: придёт сила
  rationale: Глагол גבר означает «становиться сильным, брать верх». Формулировка сохраняет образ силы и будущность, не сужая смысл до успеха или полезности.
theological_decisions:
- issue: Расхождение еврейского и греческого текста во второй части стиха
  choice: 'Основной текст следует сохранившемуся еврейскому чтению: «ведь всему придёт сила в своё время»'
  alternative: «ведь всё создано для своей пользы/потребности»
  rationale: При наличии надёжного еврейского текста он имеет первенство. Греческое чтение существенно отличается по смыслу и поэтому приведено в примечании, а не смешано с основным текстом.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим строем. Сохранены риторические вопросы и несколько необычный, но понятный образ обретения силы, отражающий еврейский глагол גבר.
