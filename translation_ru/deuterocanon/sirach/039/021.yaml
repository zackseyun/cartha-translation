    issue: 'Неудачная передача יגבר: «всему придёт сила».'
    rationale: Дательный оборот означает, что сила приходит ко «всему», тогда как הכל является субъектом глагола. Кроме того, выражение не является естественным современным русским. Требуется субъектная конструкция, сохраняющая семантику силы/преобладания.
  - severity: low
    issue: Сноска привязана к слову «говорить», хотя относится ко второй части стиха.
    rationale: Маркер альтернативного греческого чтения должен стоять после того места основного текста, которое имеет вариант, то есть после «в своё время».
