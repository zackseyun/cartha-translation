lexical_decisions:
- source_word: כל אלה
  choice: Всё это
  rationale: Естественно и точно передаёт собирательное значение еврейского выражения.
- source_word: לטובים ייטיבו
  choice: приносит добро добрым
  rationale: Сохраняет игру однокоренных слов טובים и ייטיבו и выражает благотворный результат для добрых людей.
- source_word: כן
  choice: но
  rationale: В данном антитетическом параллелизме связь между двумя частями по-русски естественно выражается противительным союзом; соответствие результатов сохраняется всей конструкцией.
- source_word: לרעים
  choice: для злых
  rationale: Передаёт субстантивированное прилагательное רעים как обозначение нравственно злых людей, не заменяя его более узким греческим «грешников».
- source_word: לרעה נהפכו
  choice: обращается во зло
  rationale: 'Передаёт изменение результата и сохраняет многозначность רעה: зло, беда или вред; единственное число согласовано с русским собирательным «всё это».'
theological_decisions:
- issue: Нравственно-религиозная характеристика получателей блага
  choice: добрым
  alternative: благочестивым
  rationale: Еврейский текст прямо говорит «добрым», тогда как греческая параллель уточняет «благочестивым». Основной текст следует еврейскому свидетельству, а греческое чтение отмечается в сноске.
- issue: Характер неблагоприятного результата для злых
  choice: во зло
  alternative: во вред
  rationale: «Во зло» сохраняет нравственную и событийную широту еврейского רעה, не сводя его только к практическому ущербу.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Однокоренной оборот «добро добрым» намеренно отражает еврейскую словесную связь; антитеза «добрым — злых» сохранена.
