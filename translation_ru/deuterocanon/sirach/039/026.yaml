base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/026.yaml
  text: The essentials for human life are water[a], fire, iron, and salt; wheat flour, milk, and honey; the blood of the grape, oil[b], and clothing.
translation:
  language: ru
  text: Самое необходимое для жизни человека — вода, огонь, железо и соль; пшеничная мука[a], молоко и мёд; кровь винограда[b], оливковое масло и одежда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение, стоящее за словами «пшеничная мука», в каирских рукописях передано не вполне ясно; греческий параллельный текст поддерживает значение «пшеничная мука» или «тонкая пшеничная мука».
    reason: textual_variant
  - marker: b
    text: 'Буквально: «кровь винограда». Выражение может обозначать виноградный напиток, в том числе вино; в переводе сохранён образ исходного текста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ראש לחיי אדם
  choice: самое необходимое для жизни человека
  rationale: ראש здесь указывает не на временное «начало», а на первостепенное, основное для человеческой жизни; это значение подтверждает греческое ἀρχὴ πάσης χρείας.
- source_word: חלב חטה
  choice: пшеничная мука
  rationale: Переданный еврейский текст в этом месте затруднителен; греческое σεμίδαλις πυρός ясно указывает на тонкую пшеничную муку. Выбран естественный русский эквивалент без излишней конкретизации сорта помола.
- source_word: חלב
  choice: молоко
  rationale: В перечне пищи слово означает «молоко», что подтверждается греческим γάλα; значение «жир» здесь не подходит.
- source_word: דם עינב
  choice: кровь винограда
  rationale: Буквальный образ сохранён вслед за еврейским текстом и греческим αἷμα σταφυλῆς; перевод не решает однозначно, имеется ли в виду именно вино или виноградный напиток шире.
- source_word: יצהר
  choice: масло
  rationale: Слово обычно обозначает свежее масло, как правило оливковое, однако общий перевод «масло» сохраняет степень конкретности исходного текста и соответствует греческому ἔλαιον.
- source_word: בגד
  choice: одежда
  rationale: Единственное число имеет собирательное значение; русское «одежда» естественно звучит в перечне жизненных потребностей.
theological_decisions:
- issue: Обобщающее значение אדם
  choice: жизнь человека
  alternative: жизнь мужчины
  rationale: אדם обозначает здесь человека вообще, а не мужчину как представителя пола. Русское «жизнь человека» точно и естественно передаёт обобщающий смысл.
translation_notes:
  register: Современный литературный русский язык; краткий перечислительный строй и образность оригинала сохранены. Точка с запятой разделяет смысловые группы перечня. Формулировка торжественная, но понятная широкому кругу читателей.
