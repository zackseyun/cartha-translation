  text: Good is allotted to the good from the beginning; so too[a], for the wicked, good and evil.
translation:
  language: ru
  text: Добро от начала предназначено доброму; так и для нечестивых — добро и зло.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Блага созданы для добрых от начала, а для грешников — злое». Сохранившийся здесь еврейский текст полнее: «для нечестивых — добро и зло».'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: добро
  rationale: Сохраняет широкое значение того, что благо или полезно, а также лаконичный параллелизм еврейской строки.
- source_word: חלק
  choice: предназначено
  rationale: Формально это существительное «доля, удел» в безглагольном предложении; предикативная передача «предназначено» естественна по-русски и выражает мысль о назначенном уделе, не смешивая её с греческим «создано».
- source_word: מראש
  choice: от начала
  rationale: Точно передаёт временное значение «с начала, изначально» и поддерживает возвышенный, но понятный стиль мудростной поэзии.
- source_word: לרעים
  choice: для нечестивых
  rationale: В данном нравственном противопоставлении речь идёт о дурных людях; «нечестивые» естественно для библейской литературы и не заменяет еврейское обозначение греческим «грешники».
- source_word: טוב ורע
  choice: добро и зло
  rationale: Сохраняет широкую и намеренно резкую антитезу еврейского текста, не сужая её до благополучия и бедствия.
theological_decisions:
- issue: Соотношение заключительной части еврейского текста с греческой параллелью
  choice: 'Сохранено еврейское чтение: для нечестивых — и добро, и зло.'
  alternative: 'Греческая параллель содержит более простую антитезу: «для грешников — злое».'
  rationale: Первичным здесь является сохранившийся еврейский текст, прямо включающий оба понятия, «добро и зло». Греческая версия отмечена в сноске как важное разночтение, но не подменяет еврейское свидетельство.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией мудростной поэзии. Компактный синтаксис сохраняет параллелизм оригинала; тире делает безглагольную вторую часть естественной и ясной.
