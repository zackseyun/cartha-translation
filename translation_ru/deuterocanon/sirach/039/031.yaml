    text: 'Буквально по-еврейски: «его уст».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий параллельный текст развёртывает эту строку: «и на земле будут приготовлены для нужд, и в свои времена не преступят слова». Это подчёркивает, что творения исполняют назначенное им в установленное время.'
    reason: alternative_reading
lexical_decisions:
- source_word: בצותו
  choice: По его повелению
  rationale: Сочетание ב с инфинитивом צוה передаёт обстоятельственное отношение к Божьему повелению; краткая русская формулировка сохраняет причинно-временной оттенок и согласуется с греческим ἐν τῇ ἐντολῇ αὐτοῦ.
- source_word: ישישו
  choice: они ликуют
  rationale: Глагол שוש/שיש обозначает радость, ликование. «Ликуют» естественно передаёт усиленный оттенок радости и уместно при олицетворении творений.
- source_word: ובחקם
  choice: следуя установленному для них порядку
  rationale: חק может означать установленное предписание, предел или порядок. В контексте речь идёт о назначенном творениям порядке действия; формулировка не сводит слово к юридическому «закону».
- source_word: לא ימרו פיו
  choice: не восстают против сказанного им
  rationale: מרה выражает неповиновение или мятеж, а פיו, буквально «его уста», метонимически означает произнесённое Богом. Русская формулировка сохраняет силу глагола и естественно передаёт объект неповиновения.
theological_decisions:
- issue: Антропоморфный образ Божьих уст
  choice: сказанного им
  alternative: его уст
  rationale: В еврейском «его уста» обозначают произнесённое повеление. Основной текст передаёт смысл естественным современным русским языком, а буквальный образ отмечен в сноске.
- issue: Характер повиновения творений
  choice: следуя установленному для них порядку
  alternative: по своему закону
  rationale: חק здесь допускает оттенки предписания, удела и установленного порядка. Выбранная формулировка сохраняет широту значения и не привносит специального богословского учения о природном законе.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Сохранены олицетворение творений и сильный оттенок неповиновения в глаголе מרה; буквальный антропоморфизм вынесен в сноску.
