  text: At his command they rejoice[b][a], and in their appointed order they do not rebel against his word.
translation:
  language: ru
  text: По его повелению они ликуют[b] и в своём установленном порядке не восстают против его слова[a].
  philosophy: optimal-equivalence
  footnotes:
