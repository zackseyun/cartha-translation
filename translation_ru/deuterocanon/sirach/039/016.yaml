translation:
  language: ru
  text: Все дела Бога хороши[a], и для всякой нужды Он в своё время даёт всё необходимое.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Все дела Господа весьма хороши, и всякое повеление исполнится в своё время». Основной текст следует сохранившемуся еврейскому чтению, где сказано «дела Бога» и говорится о том, что для всякой нужды даётся всё необходимое.'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשי אל
  choice: дела Бога
  rationale: «מעשי» — форма сопряжённого множественного числа от מעשה и обозначает всё, что Бог делает или создаёт; אל прямо передаётся как «Бог».
- source_word: כלם טובים
  choice: все … хороши
  rationale: Формулировка естественно передаёт всеохватность כלם и прямую положительную оценку טובים, не добавляя отсутствующее в еврейском тексте усиление «весьма».
- source_word: לכל צורך
  choice: для всякой нужды
  rationale: צורך здесь естественнее всего понимать как «нужда, необходимость»; предлог ל передан конструкцией «для».
- source_word: בעתו
  choice: в своё время
  rationale: Суффикс сохранён без уточнения референта, чтобы не устранять присущую еврейской формулировке неоднозначность; выражение означает надлежащее для этого время.
- source_word: יספיק
  choice: Он даст достаточно
  rationale: Hifil глагола ספק выражает снабжение достаточным количеством. Единственное число допускает подразумеваемого субъекта — Бога; местоимение «Он» делает это естественным по-русски, сохраняя смысл достаточности.
theological_decisions:
- issue: Божественное именование
  choice: Бог
  alternative: Господь
  rationale: Еврейский свидетель содержит אל, а не тетраграмматон. Греческое Κύριος отражено в примечании, но основной текст следует сохранившемуся еврейскому чтению.
- issue: Смысл второй половины стиха
  choice: Бог даст достаточно для всякой нужды
  alternative: всякое повеление исполнится в своё время
  rationale: Основной текст следует еврейскому לכל צורך בעתו יספיק. Существенно отличающееся греческое чтение сохранено в сноске, а не объединено с еврейским.
translation_notes:
  register: Современный литературный русский язык, краткий и достойный по тону. «Хороши» выбрано как прямое и понятное соответствие טובים. Заглавная буква в «Он» поддерживает традиционный русский библейский регистр, не меняя содержания.
