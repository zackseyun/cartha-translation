  text: Now with all your heart sing for joy[a], and bless the name of the Holy One.
translation:
  language: ru
  text: Теперь всем сердцем пойте с ликованием и благословляйте имя Святого[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «имя Господа»; в еврейском свидетельстве: «имя Святого».'
    reason: alternative_reading
lexical_decisions:
- source_word: עתה
  choice: Теперь
  rationale: Передаёт временной и дискурсивный переход к заключительному призыву; союз «и», имеющийся в греческой параллели, в еврейском тексте отсутствует.
- source_word: בכל לב
  choice: всем сердцем
  rationale: Естественная русская передача еврейского оборота, выражающего искренность и полноту внутреннего участия.
- source_word: הרנינו
  choice: пойте с ликованием
  rationale: Глагол רנן обозначает громкое, радостное славословие; сочетание сохраняет как голосовое выражение, так и радостный характер призыва.
- source_word: וברכו
  choice: и благословляйте
  rationale: В контексте обращения к Богу ברך означает благословлять и прославлять; «благословляйте» сохраняет устойчивый библейский оборот и согласуется по виду с продолжающимся призывом «пойте».
- source_word: את שם
  choice: имя
  rationale: Передаёт прямое дополнение в сочетании с последующим божественным титулом; «имя» служит почтительным обозначением самой личности и славы Бога.
- source_word: הקדוש
  choice: Святого
  rationale: Субстантивированное прилагательное передаёт божественный титул «Святой» и следует еврейскому свидетельству, не заменяя его греческим «Господь».
theological_decisions:
- issue: 'Божественный титул в заключительной фразе: еврейское הקדוש и греческое Κυρίου'
  choice: Святого
  alternative: Господа
  rationale: Основной текст следует сохранившемуся еврейскому свидетельству, где стоит «Святой». Значимое отличие греческой параллели — «Господь» — сохранено в сноске, без устранения разночтения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, молитвенно-гимническим звучанием. Множественное число повелительных форм сохранено; выражение «пойте с ликованием» ясно передаёт слышимую радостную хвалу.
