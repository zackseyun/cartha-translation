base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/034.yaml
  text: Do not say[a], “This is bad[b]; what is this?” for everything will prevail in its time.
translation:
  language: ru
  text: 'Не говори: «Это хуже того», — ведь всё в своё время будет признано хорошим.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст этого стиха труден. Последнюю часть буквально можно понять как «всё в своё время возобладает»; греческая параллель передаёт её смысл как «всё в своё время будет признано хорошим» или «преуспеет».
    reason: textual_variant
lexical_decisions:
- source_word: אל לאמר
  choice: Не говори
  rationale: Запретительная частица אל с инфинитивом естественно передаётся по-русски отрицательным повелением.
- source_word: זה רע מה זה
  choice: Это хуже того
  rationale: Еврейская последовательность слов трудна, но греческая параллель Τοῦτο τούτου πονηρότερον ясно поддерживает сравнительный смысл.
- source_word: הכל
  choice: всему
  rationale: Передаёт всеобщий охват הכל и естественно сочетается с безлично-предметным контекстом.
- source_word: בעתו
  choice: в своё время
  rationale: Сохраняет местоименный суффикс и временной смысл без добавления идеи назначенного срока.
- source_word: יגביר
  choice: придёт успех
  rationale: Контекстуально передаёт положительный исход; греческое εὐδοκιμηθήσεται поддерживает значения успеха и благоприятной оценки, тогда как буквальное «возобладает» здесь менее ясно.
theological_decisions:
- issue: Трудный еврейский текст и проясняющая греческая параллель
  choice: Понимать первую часть как запрет объявлять одно хуже другого, а вторую — как утверждение о благоприятном исходе всего в своё время.
  alternative: '«Не говори: “Это плохо; что это?” — ведь всё в своё время возобладает».'
  rationale: Сохраняется первенство дошедшего еврейского текста, но подлинная неясность учитывается в примечании, а сравнительный смысл и положительный оттенок последнего глагола проверяются по древней греческой параллели.
translation_notes:
  register: Современный литературный русский язык; краткая афористичная форма сохранена. Сравнительная конструкция выбрана по греческой параллели, а неопределённость финального глагола открыто отмечена.
