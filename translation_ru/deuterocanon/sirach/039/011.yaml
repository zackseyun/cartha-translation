  text: If he remains steadfast[a], he will leave behind a name beyond a thousand; and if he comes to rest[b], he still accomplishes them.
translation:
  language: ru
  text: Если он будет стоек, то оставит после себя имя, более великое, чем у тысячи[a]; а если упокоится[b], то совершает их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «оставит после себя имя, чем тысяча». Сравнение выражено эллиптически и затруднительно; вероятно, имеется в виду, что его имя превосходит имя или славу тысячи людей.'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол означает «обрести покой, отдохнуть» и в данном контексте может также подразумевать смерть.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν ἐμμένῃ
  choice: Если он устоит
  rationale: ἐμμένω означает оставаться, держаться, быть стойким; «устоит» естественно передаёт условный и положительно окрашенный смысл в контексте мудрости.
- source_word: ὄνομα καταλείψει
  choice: оставит после себя имя
  rationale: Сохранён библейский образ имени как непреходящей памяти и славы.
- source_word: ἢ χίλιοι
  choice: превосходящее имена тысячи людей
  rationale: Буквальное сочетание «имя… чем тысяча» в переданном греческом тексте синтаксически затруднительно. Перевод выражает вероятный сравнительный смысл, не оставляя по-русски неясным, что именно сопоставляется.
- source_word: ἐὰν ἀναπαύσηται
  choice: если упокоится
  rationale: '«Упокоится» сохраняет возможный намёк на смерть, но не сводит значение исключительно к ней: ἀναπαύομαι также означает отдыхать, обретать покой.'
- source_word: ἐμποιεῖ αὐτά
  choice: всё же совершит это
  rationale: ἐμποιεῖ передаёт осуществление или произведение действия; αὐτά — формально множественное и с не вполне ясным антецедентом. В русском «это» собирательно отсылает к делам или результатам, не конкретизируя их сверх текста.
theological_decisions:
- issue: Возможный намёк на смерть в ἀναπαύσηται
  choice: «если упокоится»
  alternative: «если умрёт» или «если отдохнёт»
  rationale: Выбранная формулировка удерживает двойную возможность — покой вообще и смерть, — не разрешая намеренно сохранённую греческим глаголом неоднозначность.
- issue: Продолжающееся действие мудреца после упокоения
  choice: «всё же совершит это»
  alternative: понимать глагол лишь как действие при жизни
  rationale: Фраза допускает мысль о продолжающемся воздействии мудреца или его трудов после смерти, но перевод не превращает это в более определённое догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Упокоится» выбрано ради смысловой двусмысленности; сравнительная фраза раскрыта минимально для ясности.
