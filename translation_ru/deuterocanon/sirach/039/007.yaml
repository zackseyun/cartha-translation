  terminology: «Замысел» и «знание» остаются приемлемыми соответствиями βουλή и ἐπιστήμη. «Сокровенное» не навязывает значения эзотерического учения и естественнее, чем «сокрытое у него»; сноска отмечает возможные более конкретные оттенки.
