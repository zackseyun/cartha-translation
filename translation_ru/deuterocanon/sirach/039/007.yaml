  text: Он сам направит свой замысел и знание и будет размышлять о своём сокровенном.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «о своих тайнах» или «о своих сокровенных делах». Краткое греческое выражение может обозначать как скрытые учения или предметы, так и то, что сокрыто в собственных размышлениях человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς
  choice: он сам
  rationale: Сохраняет выраженное греческим местоимением смысловое ударение.
- source_word: κατευθυνεῖ
  choice: направит
  rationale: Передаёт значение «направлять, выпрямлять путь», не добавляя отсутствующего в тексте толкования.
- source_word: βουλήν
  choice: замысел
  rationale: В данном контексте слово может обозначать внутреннее решение, намерение или обдуманный план; «замысел» естественно сочетается со знанием и сохраняет широту смысла.
- source_word: ἐπιστήμην
  choice: знание
  rationale: Прямое и уместное для литературы мудрости соответствие, допускающее оттенки понимания и познания.
- source_word: ἐν τοῖς ἀποκρύφοις αὐτοῦ
  choice: о сокрытом у него
  rationale: 'Передаёт субстантивированное множественное «сокрытое» и сохраняет неоднозначность αὐτοῦ: речь может идти о принадлежащих ему тайных предметах либо о скрытом в его внутреннем размышлении.'
- source_word: διανοηθήσεται
  choice: будет размышлять
  rationale: Естественно передаёт значение внутреннего обдумывания, выраженное будущей формой среднего залога.
theological_decisions:
- issue: К кому относятся местоимения мужского рода
  choice: 'Сохранён единый субъект: «он сам… свой… у него» без его дополнительного отождествления.'
  alternative: Передать субъект обобщённо или прямо назвать мудреца на основании контекста.
  rationale: Сам стих не называет субъекта, но грамматически последовательно употребляет мужской род единственного числа; перевод сохраняет эту связность и не разрешает контекстуальную неопределённость.
- issue: Смысл выражения ἐν τοῖς ἀποκρύφοις αὐτοῦ
  choice: Сохранена возможность понимать его как сокрытые предметы, связанные с самим субъектом.
  alternative: «О его тайнах», что может сильнее предполагать тайное учение или эзотерическое содержание.
  rationale: Краткая греческая конструкция допускает несколько оттенков, поэтому основной текст не уточняет природу сокрытого.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным книге Премудрости. Синтаксис близок к греческому, но не перегружен архаизмами; неоднозначность заключительной фразы сохранена и пояснена сноской.
