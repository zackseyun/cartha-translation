  source_fidelity: 'Основная структура и будущие формы переданы верно: подчёркнутое αὐτὸς — «Он сам», κατευθυνεῖ — «направит», а два дополнения βουλήν и ἐπιστήμην сохранены. Однако «о сокрытом у него» неестественно по-русски и размывает притяжательное αὐτοῦ. «О своём сокровенном» передаёт субстантивированное ἀποκρύφοις как собирательное понятие, сохраняет связь с субъектом и не уточняет характер сокрытого.'
