translation:
  language: ru
  text: Все дела Бога хороши[a], и всякую нужду Он удовлетворит в своё время.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Все дела Господа хороши». В еврейском тексте здесь стоит «Бог», а не «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: מעשה אל כלם
  choice: Все дела Бога
  rationale: Единственное число מעשה употреблено собирательно с כלם («все они»); русское множественное «дела» естественно передаёт совокупность Божьих деяний и согласуется с греческим τὰ ἔργα.
- source_word: טובים
  choice: хороши
  rationale: Прямо передаёт обычное значение טובים, не сужая смысл до полезности или нравственного совершенства.
- source_word: לכל צורך
  choice: всякую нужду
  rationale: צורך означает нужду или необходимость; конструкция с глаголом «удовлетворит» естественна по-русски и сохраняет охват «всякую».
- source_word: בעתו
  choice: в своё время
  rationale: Суффикс связывает время с каждой упомянутой нуждой или соответствующим случаем; «в своё время» сохраняет эту соотнесённость без пояснительного добавления «должное».
- source_word: יספיק
  choice: Он удовлетворит
  rationale: Глагол выражает достаточное обеспечение или восполнение. Подразумеваемый субъект — Бог; будущее время сохраняет форму еврейского имперфекта, которая здесь также допускает обобщающий смысл.
theological_decisions:
- issue: Божественный титул в первой части стиха
  choice: «Бога» в основном тексте
  alternative: «Господа»
  rationale: Сохранившийся еврейский текст читает אל («Бог»), тогда как греческая параллель — Κυρίου («Господа»). Приоритет отдан еврейскому свидетельству, а греческое разночтение отмечено в сноске.
- issue: Временное или обобщающее значение יספיק
  choice: «удовлетворит»
  alternative: «удовлетворяет» / «обеспечивает»
  rationale: Еврейский имперфект может выражать как будущее действие, так и общее закономерное действие. Будущее «удовлетворит» формально сохраняет перспективу формы, не исключая сентенционного смысла в контексте.
translation_notes:
  register: Современный литературный русский язык; краткая афористичная структура оригинала сохранена. Местоимение «Он» написано с прописной буквы как ясная отсылка к Богу, без внесения дополнительного титула.
