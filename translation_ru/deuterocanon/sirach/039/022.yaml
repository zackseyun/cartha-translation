  text: Blessings overflowed like the Nile[b][a], and like a river they drenched the world.
translation:
  language: ru
  text: Благословения[a] хлынули, как воды Нила, и, словно река, оросили мир[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте — множественное число: «благословения»; в греческой параллели — единственное число: «его благословение».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «насытили мир влагой». В греческой параллели: «и, словно потоп, оно напоило сушу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ברכות
  choice: Благословения
  rationale: В еврейском тексте стоит форма множественного числа. Русское множественное число сохраняет исходное чтение; греческое единственное число отмечено в сноске.
- source_word: כיאור
  choice: словно Нил
  rationale: יאר обычно обозначает Нил; конкретное название сохраняет образ его полноводного разлива.
- source_word: הציפה
  choice: разлились
  rationale: Глагол передаёт образ разлива или затопления. Возвратная форма естественна по-русски при сравнении благословений с Нилом.
- source_word: וכנהר
  choice: и, подобно реке
  rationale: Сохранён второй параллельный водный образ без отождествления этой реки с Нилом.
- source_word: תבל
  choice: мир
  rationale: תבל обозначает мир, часто в смысле обитаемой земли; «мир» кратко и естественно передаёт универсальный охват.
- source_word: ריותה
  choice: напоили
  rationale: Форма связана с насыщением водой, орошением. «Напоили» сохраняет поэтическую олицетворённость и не привносит буквального опьянения, возможного в греческой идиоме.
theological_decisions:
- issue: Число существительного «благословение»
  choice: 'Множественное число: «Благословения»'
  alternative: 'Единственное число с местоимением: «Его благословение»'
  rationale: Еврейское ברכות имеет форму множественного числа, тогда как греческая параллель читает ἡ εὐλογία αὐτοῦ — «его благословение». Основной текст следует еврейскому источнику, а вариант греческого свидетеля сохраняется в сноске.
- issue: Объект насыщения водой во второй строке
  choice: «мир»
  alternative: «сушу»
  rationale: Еврейское תבל означает «мир» или «обитаемую землю»; греческая параллель имеет ξηράν, «сушу». Различие свидетелей не сглаживается и отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим параллелизмом. «Нил» сохраняет конкретный древний образ разлива, а «напоили мир» передаёт одновременно орошение и насыщение влагой.
