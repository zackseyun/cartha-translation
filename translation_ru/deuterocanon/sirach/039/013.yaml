  yaml_path: translation/deuterocanon/sirach/039/013.yaml
  text: Listen to me[a], holy sons, and bud forth like a rose growing beside a stream in a field[b],
translation:
  language: ru
  text: Послушайте меня, благочестивые сыновья[a], и пускайте ростки, словно роза, растущая у полевого ручья[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святые сыновья». Слово ὅσιοι может обозначать святых, благочестивых или верных в почитании Бога людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «расцветайте, словно роза, растущая у ручья в поле». Глагол передаёт образ появления и развития растительной поросли, а сочетание «поток поля» допускает несколько способов выразить связь ручья с полем.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: εἰσακούσατέ
  choice: Послушайте
  rationale: Аористный императив выражает прямой призыв внимательно выслушать говорящего; «послушайте меня» естественно и точно передаёт обращение.
- source_word: υἱοὶ
  choice: сыновья
  rationale: Греческое слово имеет форму мужского рода во множественном числе; перевод сохраняет явную форму обращения, не заменяя её нейтральным «дети».
- source_word: ὅσιοι
  choice: благочестивые
  rationale: В данном обращении слово характеризует почтительность и верность в религиозной жизни. «Благочестивые» звучит по-русски естественнее сочетания «святые сыновья», не устраняя возможного оттенка святости.
- source_word: βλαστήσατε
  choice: пускайте ростки
  rationale: Императив продолжает образ роста растения и обозначает появление новой поросли; такой перевод не сужает значение до полного цветения.
- source_word: ῥόδον
  choice: роза
  rationale: Прямое и общеупотребительное соответствие греческому названию растения.
- source_word: φυόμενον
  choice: растущая
  rationale: Причастие описывает продолжающийся рост розы; «растущая» передаёт это без добавочной конкретизации.
- source_word: ἐπὶ ῥεύματος ἀγροῦ
  choice: у полевого ручья
  rationale: ἐπί при родительном здесь естественно указывает на близость к текущей воде, а ἀγροῦ связывает поток с полем или открытой местностью. Формулировка сохраняет конкретный природный образ и остаётся идиоматичной.
theological_decisions:
- issue: Форма обращения υἱοὶ ὅσιοι
  choice: благочестивые сыновья
  alternative: святые сыновья; благочестивые дети
  rationale: «Сыновья» сохраняет мужской род исходного обращения. «Благочестивые» передаёт религиозно-нравственный смысл ὅσιοι без утверждения более узкого доктринального понимания святости; альтернативный оттенок указан в примечании.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным увещательным тоном. Растительный образ передан конкретно; буквальная мужская форма обращения сохранена. Не вполне естественные русские кальки вроде «на потоке поля» устранены без снятия смысловой неоднозначности, которая отмечена в сноске.
