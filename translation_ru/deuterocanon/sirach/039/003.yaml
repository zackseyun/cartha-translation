lexical_decisions:
- source_word: ἀπόκρυφα
  choice: сокровенное
  rationale: Субстантивированное прилагательное означает скрытое или неясное; «сокровенное» сохраняет широту греческого слова и не сводит его только к скрытому смыслу.
- source_word: παροιμιῶν
  choice: в пословицах
  rationale: παροιμία обозначает пословицу или изречение; родительный падеж естественно передан сочетанием «сокровенное в пословицах».
- source_word: ἐκζητήσει
  choice: исследует
  rationale: Глагол выражает настойчивый, тщательный поиск; «исследует» естественно передаёт целенаправленное проникновение в трудный материал.
- source_word: ἐν αἰνίγμασι
  choice: в загадки
  rationale: В сочетании с ἀναστραφήσεται выражает сферу продолжительного обращения и занятий; направление «погружаться в» по-русски передаёт эту вовлечённость.
- source_word: παραβολῶν
  choice: притч
  rationale: В литературе мудрости слово может означать сравнения, образные изречения или притчи; «притчи» сохраняет традиционный и литературно уместный диапазон.
- source_word: ἀναστραφήσεται
  choice: будет погружаться
  rationale: Здесь глагол означает пребывать в определённой сфере, обращаться среди чего-либо или посвящать этому себя; выбранный вариант естественно выражает длительную вовлечённость.
