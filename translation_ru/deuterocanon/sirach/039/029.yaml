  text: Fire and hail[a], famine and pestilence—these also were created for judgment.
translation:
  language: ru
  text: Огонь и град, голод и мор — и они созданы для суда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «всё это создано для возмездия» или «для наказания»; в еврейском — «для суда».'
    reason: alternative_reading
lexical_decisions:
- source_word: אש
  choice: огонь
  rationale: Прямое и естественное соответствие обычному еврейскому существительному; согласуется с греческим πῦρ.
- source_word: ברד
  choice: град
  rationale: Стандартное обозначение природного явления; подтверждается греческим χάλαζα.
- source_word: רעב
  choice: голод
  rationale: В перечне общественных бедствий означает массовый голод, а не индивидуальное чувство голода; соответствует греческому λιμός.
- source_word: דבר
  choice: мор
  rationale: Еврейское слово обозначает губительную эпидемию, моровую язву. «Мор» краток, уместен в высоком литературном регистре и не смешивает значение с греческим θάνατος («смерть»).
- source_word: גם אלה
  choice: и они
  rationale: 'Естественно передаёт добавочное значение: перечисленные бедствия также относятся к ранее названным творениям.'
- source_word: למשפט
  choice: для суда
  rationale: Сохраняет широкий судебный смысл משפט и не сужает его до одного лишь наказания; греческий текст выражает более явно карательный оттенок.
- source_word: נוצרו
  choice: созданы
  rationale: Передаёт пассивную форму множественного числа и подразумеваемое божественное действие, согласуясь с темой творения в контексте.
theological_decisions:
- issue: Различие еврейского и греческого текстов в заключительной фразе
  choice: В основном тексте следовать еврейскому «для суда».
  alternative: «для возмездия» или «для наказания» по греческому тексту
  rationale: Сохранившийся еврейский текст является первичным свидетельством и содержит למשפט, не обязательно ограниченное карательным смыслом. Греческое εἰς ἐκδίκησιν усиливает оттенок возмездия; это различие сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным перечислением. Слово «мор» несколько возвышенное, но понятное по контексту и точно передаёт общественное бедствие; тире отделяет итоговое утверждение. Маркер примечания поставлен в основном тексте.
