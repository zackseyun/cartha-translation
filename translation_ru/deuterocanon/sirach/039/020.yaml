  text: From eternity to eternity he looks on[a], and nothing is too wondrous or too strong for him.
translation:
  language: ru
  text: От века и до века Он взирает[a], и нет ничего слишком дивного или слишком сильного для Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «От века и до века Он воззрел, и нет ничего дивного пред Ним»; дополнительных слов еврейского текста «или слишком сильного» там нет.'
    reason: textual_variant
lexical_decisions:
- source_word: מעולם ועד עולם
  choice: От века и до века
  rationale: Передаёт устойчивый еврейский оборот с возвышенным временным охватом и сохраняет параллель с греческим ἀπὸ τοῦ αἰῶνος εἰς τὸν αἰῶνα.
- source_word: יביט
  choice: Он взирает
  rationale: Еврейский имперфект естественно понимать как обобщённое настоящее в контексте премудрости; «взирает» сохраняет зрительный образ и достойный регистр.
- source_word: נפלא
  choice: слишком дивного
  rationale: В отрицательной конструкции выражает мысль, что ничто необычайное или превосходящее человеческие возможности не находится за пределами Божьего ведения и действия.
- source_word: חזק
  choice: слишком сильного
  rationale: Сохраняет дополнительное понятие силы, явно присутствующее в еврейском тексте, хотя отсутствующее в сохранившейся греческой параллели.
- source_word: ממנו
  choice: для Него
  rationale: 'В сочетании с отрицательной конструкцией это естественная русская передача смысла: ничто не превосходит Его возможностей; буквальное «от Него» здесь было бы неясно.'
theological_decisions:
- issue: Подлежащее подразумевается в еврейском и греческом тексте
  choice: Передать местоимением «Он», относящимся к Богу из контекста
  alternative: Явно добавить «Бог»
  rationale: Русскому предложению требуется выраженное подлежащее; местоимение сохраняет краткость источника и не добавляет отсутствующего в стихе имени.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Оборот «От века и до века» сохраняет поэтичность, а «для Него» делает заключительную мысль естественной и понятной.
