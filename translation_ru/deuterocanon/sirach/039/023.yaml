    rationale: В варианте «гнев Его ... превратит» русский синтаксис однозначно приписывает гневу превращение питья в рассол. Исходная форма позволяет подразумевать Бога как субъекта второго действия, и английский контрольный текст именно так её понимает. Следует сделать это различие ясным по-русски.
