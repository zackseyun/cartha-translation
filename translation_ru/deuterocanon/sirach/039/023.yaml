translation:
  language: ru
  text: Так и Его гнев лишит народы их владений[a], а Он превратит их питьё в рассол[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом: «гнев Его унаследует народы». Еврейский глагол здесь, вероятно, означает, что гнев лишит народы их владений.'
    reason: alternative_reading
  - marker: b
    text: 'В греческом — «воды»; еврейское слово имеет более широкое значение: «питьё», «то, что пьют».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כן
  choice: Так и
  rationale: Передаёт соотносительное значение с предшествующим контекстом и естественно вводит соответствующее действие.
- source_word: זעמו
  choice: гнев Его
  rationale: Сохраняет тяжесть образа Божьего суда; в еврейском именно «гнев» грамматически выступает субъектом первой части стиха.
- source_word: גוים
  choice: народы
  rationale: Нейтральное и обычное соответствие в контексте суда; вариант «язычники» внёс бы не выраженное здесь противопоставление.
- source_word: יוריש
  choice: лишит … владений
  rationale: Порода hифиль глагола ירש допускает значение «лишать владения, изгонять из владения». Такая передача согласуется с контекстом суда, не превращая гнев в получателя наследства.
- source_word: ויהפך
  choice: и превратит
  rationale: Продолжает последовательность будущих действий. В русском нулевой субъект естественно соотносится с ближайшим субъектом «гнев»; исходный текст допускает образ гнева как действующей силы.
- source_word: למלח
  choice: в рассол
  rationale: Передаёт превращение пригодной для питья жидкости в солёную и непригодную, а не в сухую соль.
- source_word: משקה
  choice: то, что они пьют
  rationale: Еврейское слово означает питьё или напиток и шире греческого «воды». Местоименное отнесение к народам делает по-русски ясным подразумеваемый объект, не сужая его до воды.
theological_decisions:
- issue: Следует ли понимать יוריש как «лишит владений» или как «унаследует»
  choice: гнев Его лишит народы владений
  alternative: гнев Его унаследует народы
  rationale: Приоритетный сохранившийся еврейский текст в контексте суда естественно допускает значение лишения владения. Греческое прочтение представляет значимую альтернативу и поэтому отмечено в сноске.
- issue: Следует ли передать משקה как общее «питьё» или конкретное «воды»
  choice: то, что они пьют
  alternative: их воды
  rationale: Основной текст следует более широкому еврейскому слову, а греческое уточнение «воды» сохраняется в сноске.
- issue: Кто является субъектом второго действия
  choice: гнев Его, как естественное грамматическое продолжение русского и еврейского высказывания
  alternative: 'Бог: «Он превратит»'
  rationale: Еврейский глагол имеет мужской род и может продолжать субъект זעמו («Его гнев»), также мужского рода. Не следует без необходимости вводить новое явное подлежащее, хотя в конечном счёте речь идёт о Божьем действии суда.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Оборот «лишит народы владений» сохраняет судебно-земельный оттенок глагола, а «то, что они пьют» избегает как неестественного «их питьё», так и неоправданного сужения до воды. Все сноски отмечены в основном тексте.
