  naturalness: «Поразмыслив ещё, я сделаю выбор» — современная литературная и синтаксически естественная передача деепричастного оборота с будущим средним глаголом. «Словно полная луна» ясно и поэтично передаёт сравнение без неуклюжего повторения «луна в полнолуние».
  terminology: Специальных богословских терминов нет. «Полная луна» точно передаёт употребление διχομηνία в данном образе; примечание сохраняет буквальную связь слова с серединой лунного месяца.
