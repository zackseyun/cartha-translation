  text: The desire of his will succeeds[a], and there is no hindrance to his salvation.
translation:
  language: ru
  text: То, чего Он желает, исполняется[a], и нет преграды Его спасению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его желание достигает успеха». В греческой параллели: «По Его повелению — всё, что Ему угодно, и нет никого, кто умалит Его спасение».'
    reason: Лексическая альтернатива и значимое расхождение формулировки греческой параллели.
lexical_decisions:
- source_word: תאות רצונו
  choice: то, чего Он желает
  rationale: Сочетание буквально допускает значение «желание Его воли», но по-русски естественнее передать его как объект Божественного желания. Это сохраняет семантическую неоднозначность תאוה — «желание» или «желаемое» — и согласуется с греческим εὐδοκία.
- source_word: יצליח
  choice: исполняется
  rationale: Hифиль צלח означает достижение успеха, осуществление задуманного. В отношении воли Бога «исполняется» звучит естественно и ясно передаёт её действенность; «преуспевает» здесь менее идиоматично.
- source_word: מעצור
  choice: преграда
  rationale: Существительное обозначает то, что удерживает или препятствует. «Преграда» близко передаёт безличную еврейскую конструкцию «нет препятствия», не заменяя её греческим личным выражением «нет никого, кто уменьшит».
- source_word: תשועתו
  choice: Его спасению
  rationale: תשועה охватывает спасение и избавление; «спасение» прямо соответствует также греческому σωτήριον и сохраняет широкое библейское значение без догматического сужения.
theological_decisions:
- issue: Широта значения תשועה
  choice: Его спасению
  alternative: Его избавлению / Его спасительному действию
  rationale: «Спасение» сохраняет традиционный богословский вес слова, но в данном контексте понимается широко — как Божье избавляющее действие и его результат.
- issue: Относится ли מעצור к препятствию или к лицу, которое препятствует
  choice: нет преграды
  alternative: нет никого, кто умалит
  rationale: Приоритет отдан еврейскому безличному существительному; личная формулировка греческой параллели отмечена в сноске, а не внесена в основной текст.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Местоимение «Он» и притяжательное «Его» написаны с прописной буквы как указание на Бога; синтаксис краткий и афористичный.
