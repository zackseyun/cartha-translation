base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/039/030.yaml
  text: The teeth of wild beasts, and scorpions and vipers, and a sword that takes vengeance to destroy the wicked— all these were created for their purpose, and they are kept in store until the time they are appointed.
translation:
  language: ru
  text: Зубы диких зверей, скорпионы и ядовитые змеи[a], и меч, несущий возмездие, чтобы истреблять[b] нечестивых — всё это создано для своего назначения; оно хранится в хранилище и в назначенное время будет призвано[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гадюки», «аспиды». Еврейское слово обозначает ядовитую змею, но точный вид неясен; в греческом тексте также употреблено общее обозначение змеи или гадюки.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский глагол может иметь более сильный смысл: «полностью уничтожать» или «предавать уничтожению».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «они находятся в хранилище и в назначенное время будут призваны». Заключительная фраза в еврейском тексте сжата; речь о силах, которые сохраняются до времени их применения.'
    reason: alternative_reading
lexical_decisions:
- source_word: חית שן
  choice: зубы диких зверей
  rationale: Еврейское сочетание буквально называет зубы зверей; единственное число שן имеет собирательное значение, что подтверждается греческим множественным ὀδόντες.
- source_word: עקרב
  choice: скорпионы
  rationale: Собирательное множественное естественно в перечне и соответствует греческому σκορπίοι.
- source_word: פתן
  choice: ядовитые змеи
  rationale: Точный биологический вид неясен; нейтральное выражение передаёт опасную ядовитую змею без ложной зоологической точности.
- source_word: חרב נקמות
  choice: меч, несущий возмездие
  rationale: Передаёт конструкцию «меч возмездия» с её активной силой; греческое ῥομφαία ἐκδικοῦσα также описывает карающий меч.
- source_word: להחרים
  choice: чтобы истреблять
  rationale: Глагол выражает уничтожение и может иметь усиленный смысл полного истребления или предания уничтожению.
- source_word: רשעים
  choice: нечестивых
  rationale: Передаёт морально-религиозную виновность; соответствует также греческому ἀσεβεῖς, не привнося конфессионально узкого значения.
- source_word: לצורכם
  choice: для своего назначения
  rationale: 'Сохраняет широкий функциональный смысл: эти силы созданы для той цели или надобности, для которой предназначены, без уточнения того, чья это потребность.'
- source_word: נבראו
  choice: создано
  rationale: Прямо сохраняет пассивное утверждение о сотворении и не смягчает богословское напряжение текста.
- source_word: באוצר
  choice: хранится в хранилище
  rationale: Сохраняет конкретный образ запаса или кладовой, где силы удерживаются до времени применения.
- source_word: ולעת יפקדו
  choice: до времени, когда будет призвано
  rationale: פקד здесь указывает на призыв, назначение или мобилизацию для действия; единственное число согласовано с обобщающим «всё это».
theological_decisions:
- issue: Вредоносные существа и разрушительные силы как часть сотворённого порядка под Божьим управлением
  choice: Сохранено прямое утверждение, что всё перечисленное создано для назначения и удерживается до времени призыва.
  alternative: Ослабить формулировку до наблюдения о природе либо заменить «создано» выражением «возникло».
  rationale: Еврейский текст явно говорит נבראו, «были созданы», а образ хранилища и будущего призыва подразумевает целенаправленное управление. Перевод не должен устранять возникающее богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Синтаксис перечня сохранён, но согласование с обобщающим «всё это» сделано естественным для русского. Терминология не привязана к конкретной конфессиональной традиции.
