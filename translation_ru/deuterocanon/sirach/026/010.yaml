lexical_decisions:
- source_word: πορνεία
  choice: распутство
  rationale: Передаёт широкий смысл недозволенного полового поведения, не сужая его до проституции и не прибегая к клинически звучащему выражению.
- source_word: γυναικός
  choice: женщины
  rationale: Родительный падеж выражает принадлежность; форма без артикля имеет обобщающий, пословичный характер.
- source_word: ἐν
  choice: по
  rationale: В обоих оборотах предлог обозначает внешний признак, по которому нечто распознаётся; русское «по» естественно передаёт эту функцию.
- source_word: μετεωρισμοῖς ὀφθαλμῶν
  choice: по тому, как она поводит глазами
  rationale: Выражение допускает значения поднятия, беспокойного движения или блуждания глаз. Такая передача сохраняет образ движения взгляда, не закрепляя однозначно надменность или соблазняющий жест.
- source_word: βλεφάροις
  choice: по движению её век
  rationale: Греческое слово буквально означает «веки». Добавление «движению» делает конкретный образ понятным по-русски и указывает на мимику глаз, не заменяя веки более общим «взглядом».
- source_word: γνωσθήσεται
  choice: узнаётся
  rationale: Будущее страдательного залога здесь имеет обобщённо-пословичную силу; настоящее время естественно выражает постоянное наблюдение.
theological_decisions:
- issue: Объём нравственного понятия πορνεία в литературе мудрости
  choice: распутство
  alternative: проституция; блуд; сексуальная распущенность
  rationale: Стих представляет обобщённое нравственное наблюдение и не уточняет конкретную разновидность полового проступка. Выбранное слово сохраняет широкий смысл без конфессионального или юридического сужения.
translation_notes:
  register: Современный литературный русский язык с пословичной краткостью. «Распутство» понятно широкому читателю и менее клинично, чем «сексуальная распущенность». Необычный образ век сохранён, но слегка прояснён словом «движение»; неоднозначность первого образа вынесена в примечание.
