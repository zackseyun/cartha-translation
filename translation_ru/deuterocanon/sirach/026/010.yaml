  - severity: low
    issue: «Как она поводит глазами» предпочтительно заменить более нейтральной формулой.
    rationale: μετεωρισμοῖς — трудное слово, допускающее смысл поднятости, беспокойства или блуждания. «Поводит глазами» прежде всего направляет читателя к блуждающему/заигрывающему движению; «по движению её глаз» оставляет больше пространства для образа, а варианты уточняются в сноске.
