  source_fidelity: В целом переданы и обобщённый характер γυναικός, и распознавание πορνεία по внешним признакам. Однако «по движению её век» вводит движение как прямое содержание основного текста, хотя βλεφάροις буквально означает «веки», а подразумеваемая мимика остаётся выводом. «Как она поводит глазами» также несколько сужает трудное μετεωρισμοῖς до блуждающего движения. Более нейтральная формулировка с примечанием лучше сохраняет неоднозначность греческого образа.
  naturalness: «Распутство женщины узнаётся…» — естественный современный литературный русский с краткостью, уместной для сентенции. «По движению её век» звучит менее естественно и избыточно истолковывает образ; «по её векам» лаконично, а пояснение следует дать в сноске.
  terminology: «Распутство» приемлемо для широкого нравственного значения πορνεία и не ограничивает его проституцией. «Женщины» корректно передаёт обобщённый генитив. Слова «глаза» и «веки» сохраняют конкретную образность оригинала.
  issues:
