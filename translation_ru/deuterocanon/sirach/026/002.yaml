lexical_decisions:
- source_word: אֵשֶׁת חַיִל
  choice: добродетельная жена
  rationale: Сочетание обозначает женщину силы, достоинства, способностей и доказанной доблести. В русском контексте литературы мудрости «добродетельная жена» звучит естественно и ёмко, не сводя выражение к физической или воинской силе.
- source_word: תְּדַּשֵּׁן
  choice: радует
  rationale: Буквально глагол связан с упитанностью, изобилием и процветанием; здесь образно выражает благотворное воздействие на мужа. Перевод «радует» согласуется с греческим εὐφραίνει и естественен по-русски.
- source_word: לְבַעֲלָהּ
  choice: своего мужа
  rationale: בעל в данном контексте означает «муж»; возвратное местоимение естественно передаёт принадлежность в русском языке.
- source_word: וּשְׁנֵי חַיָּיו
  choice: годы своей жизни
  rationale: Передаёт полную форму еврейского выражения «годы его жизни» и ясно соотносит их с мужем.
- source_word: יְבַלֶּה
  choice: проведёт
  rationale: В контексте жизни и времени глагол означает провести, прожить или довести до конца определённый срок.
- source_word: בַנְעִימִים
  choice: в благополучии
  rationale: Еврейское выражение указывает на приятные, отрадные обстоятельства. «В благополучии» естественно передаёт состояние приятной и благой жизни, не смешивая его с греческим вариантом «в мире».
theological_decisions:
- issue: Расхождение еврейского и греческого текста в заключительной фразе
  choice: В основном тексте следовать еврейскому בַנְעִימִים — «в благополучии»
  alternative: 'Греческий текст: «в мире»'
  rationale: Сохранившийся еврейский текст имеет высокую степень надёжности и является основным источником. Греческое ἐν εἰρήνῃ может отражать вариант текста или истолковывающий перевод, поэтому оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным библейской книге мудрости. «Добродетельная жена» сохраняет традиционную узнаваемость выражения, а «в благополучии» естественно передаёт еврейский образ приятной, отрадной жизни.
