  text: Slander in a city[a], and an assembly of a mob, and a false accusation—all these are worse than death.
translation:
  language: ru
  text: Клевета в городе[a], собрание толпы и ложное обвинение — всё это хуже смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст представляет собой сжатый перечень с неоднозначными сочетаниями в родительном падеже: буквально возможно понять «клевета города / в городе» и «собрание толпы». В переводе смысл выражен естественно для русского языка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβολὴν
  choice: Клевета
  rationale: Слово обозначает злонамеренное обвинение или опорочивание; «клевета» кратко и естественно передаёт смысл.
- source_word: πόλεως
  choice: в городе
  rationale: Сжатый родительный падеж допускает неоднозначность; «в городе» естественно передаёт общественную среду, не утверждая, что клевета направлена против самого города.
- source_word: ἐκκλησίαν
  choice: сборище
  rationale: Здесь речь о собравшейся группе, а не о религиозной общине; в сочетании с «толпой» слово передаёт отрицательную окраску контекста.
- source_word: ὄχλου
  choice: толпы
  rationale: ὄχλος означает толпу или множество; здесь контекст указывает на неупорядоченное и опасное скопление людей.
- source_word: καταψευσμόν
  choice: ложное обвинение
  rationale: Термин означает ложное утверждение против кого-либо; этот перевод отличает его от предшествующей «клеветы» и сохраняет обвинительный оттенок.
- source_word: ὑπὲρ θάνατον
  choice: хуже смерти
  rationale: Сравнительный оборот в сочетании с μοχθηρά означает, что перечисленное превосходит смерть своей тяжестью или пагубностью.
- source_word: πάντα
  choice: всё это
  rationale: Форма среднего рода множественного числа обобщает три предшествующих явления.
- source_word: μοχθηρά
  choice: хуже
  rationale: Прилагательное означает дурное, пагубное или тяжкое; вместе с ὑπὲρ θάνατον по-русски естественно образует выражение «хуже смерти».
