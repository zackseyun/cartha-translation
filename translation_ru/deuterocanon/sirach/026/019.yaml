  text: Golden pillars on a silver base[a], and beautiful feet on the breast of one who stands firm.
translation:
  language: ru
  text: Золотые столпы на серебряном основании, и прекрасные стопы на груди того, кто стоит твёрдо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий образ сжат и труден для истолкования; буквально вторая часть звучит примерно так: «прекрасные стопы на грудях стойкого (или устойчивого)». Слово, переведённое как «того, кто стоит твёрдо», в греческом тексте употреблено без поясняемого существительного.'
    reason: lexical_alternative
lexical_decisions:
- source_word: στύλοι χρύσεοι
  choice: золотые столпы
  rationale: «Столпы» сохраняют возвышенный поэтический образ вертикальных опор; прилагательное передаёт материал, а не только цвет.
- source_word: ἐπὶ βάσεως ἀργυρᾶς
  choice: на серебряном основании
  rationale: ἐπί с родительным здесь обозначает опору; «основание» естественно передаёт βάσις и сохраняет архитектурный образ.
- source_word: πόδες ὡραῖοι
  choice: прекрасные стопы
  rationale: «Стопы» конкретно передают πόδες и звучат уместно в поэтическом сравнении; ὡραῖοι выражает красоту и привлекательность.
- source_word: ἐπὶ στέρνοις
  choice: на груди
  rationale: στέρνοις буквально обозначает грудь или область груди. В русском языке собирательное единственное число естественнее буквального множественного «на грудях».
- source_word: εὐσταθοῦς
  choice: того, кто стоит твёрдо
  rationale: Прилагательное имеет значения устойчивости, твёрдости и прочности; субстантивная передача сохраняет возможную игру с телесной стойкой, не уточняя отсутствующее существительное.
