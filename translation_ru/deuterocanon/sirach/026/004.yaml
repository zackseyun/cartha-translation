lexical_decisions:
- source_word: πλουσίου δὲ καὶ πτωχοῦ
  choice: Богат человек или беден
  rationale: Генитивы πλουσίου и πτωχοῦ образуют социально-экономическое противопоставление. Русская конструкция передаёт его естественно, не усиливая значение πτωχός до «нищий». Частица δέ здесь понимается как слабый переход и отдельно не выражается.
- source_word: καρδία ἀγαθή
  choice: при добром сердце
  rationale: Сохраняется конкретный образ сердца как внутреннего нравственного и душевного состояния; предлог «при» естественно связывает бессказуемные части греческой фразы, не вводя сильной причинности.
- source_word: ἐν παντὶ καιρῷ
  choice: всегда
  rationale: Обычное современное русское соответствие выражению «во всякое время».
- source_word: πρόσωπον ἱλαρόν
  choice: лицо радостно
  rationale: πρόσωπον передано буквально как «лицо», а ἱλαρόν — как «радостно», что выражает видимую приветливость и внутреннюю радость без архаичного «лик».
theological_decisions:
- issue: Связь богатства или бедности, доброго сердца и радостного лица в бессказуемой греческой фразе
  choice: Богат человек или беден — при добром сердце лицо всегда радостно
  alternative: У богатого и бедного сердце доброе, и лицо во всякое время радостно
  rationale: Греческий синтаксис сжат и допускает более буквальное прочтение с притяжательными генитивами. Основной текст следует контекстуально естественному обобщению, но не превращает высказывание в обещание материального благополучия и не устраняет альтернативу, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой афористичной структурой. Сохранены образы сердца и лица; архаизмы и конфессионально окрашенные толкования не вводятся.
