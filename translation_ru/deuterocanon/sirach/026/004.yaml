  text: Богат ли человек или беден[a] — при добром сердце лицо всегда радостно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально греческий текст можно понять так: «У богатого и бедного сердце доброе; во всякое время лицо радостно». Фраза сжата, и связь между её частями прямо не выражена.'
