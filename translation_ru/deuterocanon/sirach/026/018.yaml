lexical_decisions:
- source_word: λύχνος
  choice: светильник
  rationale: Греческое слово обозначает конкретный переносной светильник, а не свет как отвлечённое понятие; русский вариант сохраняет предметный образ.
- source_word: ἐκλάμπων
  choice: ярко сияющий
  rationale: Причастие передаёт исходящее наружу, заметное сияние; «ярко сияющий» естественно выражает усиленный характер образа.
- source_word: ἐπὶ λυχνίας ἁγίας
  choice: на священной подставке
  rationale: Предлог передан пространственно, а ἁγίας — как «священной», чтобы сохранить оттенок посвящённости. «Подставка» позволяет отличить λυχνία от самого λύχνος и не вызывает анахронического представления о подсвечнике для свечи.
- source_word: κάλλος προσώπου
  choice: красота лица
  rationale: Прямой и естественный русский оборот сохраняет конкретность и поэтический параллелизм греческого текста.
- source_word: ἐπὶ ἡλικίᾳ στασίμῃ
  choice: в пору зрелости
  rationale: ἡλικία обозначает возраст или этап жизни, а στασίμῃ — его установившийся, устойчивый характер. Основной текст передаёт этот идиоматический оборот естественно, а буквальный оттенок отмечен в сноске.
