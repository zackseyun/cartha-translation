lexical_decisions:
- source_word: Μόλις
  choice: едва
  rationale: Передаёт значение «с трудом, едва» и сохраняет краткую, афористичную форму изречения.
- source_word: ἐξελεῖται
  choice: избежит
  rationale: Средняя форма с ἀπό допускает значение «избавиться, ускользнуть, избежать». «Избежит» естественно звучит по-русски и не уточняет, произошло ли избавление собственными или внешними усилиями.
- source_word: ἔμπορος
  choice: купец
  rationale: Обозначает человека, занимающегося торговлей; «купец» точно и уместно передаёт это значение в возвышенной литературной речи.
- source_word: πλημμελείας
  choice: проступка
  rationale: Слово обозначает ошибку, провинность или неправое дело. «Проступок» сохраняет общий нравственный смысл, не сводя его исключительно к торговому обману.
- source_word: δικαιωθήσεται
  choice: не будет оправдан
  rationale: Сохраняет страдательное и судебно-оценочное значение глагола δικαιόω, не вводя в контекст позднейшую богословскую терминологию.
- source_word: κάπηλος
  choice: лавочник
  rationale: Передаёт обозначение мелкого розничного торговца. Возможный отрицательный общественный оттенок отмечен в сноске, но не внесён в само наименование.
- source_word: ἁμαρτίας
  choice: греха
  rationale: Прямо сохраняет нравственно-религиозное значение исходного слова и отмеченный в стихе переход от проступка к греху.
theological_decisions:
- issue: Значение δικαιωθήσεται в контексте книги Премудрости
  choice: не будет оправдан
  alternative: не будет признан праведным; не будет признан невиновным
  rationale: «Оправдан» сохраняет судебно-декларативную силу греческого глагола, но не превращает изречение о нравственной опасности торговли в формулировку определённой доктрины.
translation_notes:
  register: Современный литературный русский язык с кратким афористичным строем. «Купец» и «лавочник» несколько традиционны, но точны, понятны и соответствуют древнему торговому контексту. Необычное сочетание «оправдан от греха» сохранено ради судебного значения δικαιωθήσεται и конструкции с ἀπό; двусмысленность не устранена пересказом.
