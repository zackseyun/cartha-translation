  text: Торговец едва ли избежит проступка[a], и лавочник[b] не будет признан невиновным в грехе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «едва ли избавится от проступка». Греческий глагол может означать «избежать» или «избавиться от».'
