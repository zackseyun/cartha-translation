  source_fidelity: Перевод точно передаёт два императивных наставления. «Берегись бесстыдного взгляда» естественно выражает предостерегающий смысл δύσной конструкции ὀπίσω ἀναιδοῦς ὀφθαλμοῦ, не выдавая спорную функцию ὀπίσω за однозначную; буквальная трудность прозрачно отмечена в сноске. «Не удивляйся, если она согрешит против тебя» передаёт μὴ θαυμάσῃς, условное ἐὰν и направленность εἰς σέ. Добавленное «она» обоснованно контекстом и снабжено сноской.
