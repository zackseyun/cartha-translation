translation:
  language: ru
  text: Берегись бесстыдного взгляда[a] и не удивляйся, если она[b] согрешит против тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «Берегись позади/от бесстыдного глаза». Оборот с ὀπίσω труден; здесь передан его вероятный смысл — предостережение от бесстыдного взгляда.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте местоимения «она» нет; женский субъект подразумевается из контекста, где речь идёт о женщине дурного нрава.
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπίσω ἀναιδοῦς ὀφθαλμοῦ
  choice: бесстыдного взгляда
  rationale: Сочетание с ὀπίσω трудно и, вероятно, выражает предостережение и необходимость держаться подальше. «Взгляд» естественно передаёт образ глаза в современном русском, а «берегись» вместе с φύλαξαι выражает защитный смысл всей конструкции.
- source_word: ἀναιδοῦς
  choice: бесстыдного
  rationale: Слово обозначает отсутствие стыда, дерзкую нескромность; «бесстыдный» точно сохраняет нравственную оценку исходного текста.
- source_word: φύλαξαι
  choice: берегись
  rationale: Аористный императив φυλάσσω здесь представляет прямое предостережение. Возвратное «берегись» кратко и естественно передаёт требование оградить себя.
- source_word: μὴ θαυμάσῃς
  choice: не удивляйся
  rationale: В данном предостерегающем контексте θαυμάζω означает не столько восхищение, сколько удивление или изумление.
- source_word: ἐὰν
  choice: если
  rationale: Сохраняет условный характер греческой конструкции и не превращает возможное действие в неизбежное.
- source_word: εἰς σὲ πλημμελήσῃ
  choice: согрешит против тебя
  rationale: πλημμελέω обозначает проступок, нарушение или грех, а εἰς σέ указывает на лицо, против которого он совершён. Выбор сохраняет нравственную весомость выражения.
theological_decisions:
- issue: Женский субъект подразумевается контекстом, но прямо не назван в греческой фразе
  choice: она
  alternative: этот человек; безличная передача
  rationale: Окончание глагола не указывает на род, однако ближайший контекст главы говорит о женщине. Местоимение делает русскую фразу ясной, а сноска отмечает, что оно добавлено по контексту.
- issue: Степень нравственной окраски πλημμελέω
  choice: согрешит против тебя
  alternative: поступит с тобой дурно; провинится перед тобой
  rationale: «Согрешит» сохраняет нравственную силу глагола, не уточняя вид проступка и не привнося конкретного конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; краткая форма наставления сохраняет достоинство и афористичность текста Премудрости. Трудная греческая идиома передана естественно, а буквальная форма и контекстуально восстановленный субъект отмечены в сносках.
