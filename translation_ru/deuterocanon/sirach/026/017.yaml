  text: Like the sun rising in the heights of the Lord[b][a], so is the beauty of a good wife in the adornment of his house.
translation:
  language: ru
  text: Как солнце, восходящее на высотах Господних, — так красота доброй жены в убранстве его дома.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в благоустройстве его дома». Греческое слово может означать как упорядоченное устройство, так и убранство, украшение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥλιος ἀνατέλλων
  choice: солнце, восходящее
  rationale: Сохраняет динамичный образ причастной конструкции и естественно звучит по-русски.
- source_word: ἐν ὑψίστοις Κυρίου
  choice: на высотах Господних
  rationale: Передаёт множественное число ὑψίστοις и зависимость от Κυρίου, не заменяя выражение толкованием «на небесах».
- source_word: κάλλος
  choice: красота
  rationale: Прямой и естественный эквивалент, подходящий для поэтического сравнения.
- source_word: ἀγαθῆς γυναικός
  choice: доброй жены
  rationale: γυνή допускает значения «женщина» и «жена»; контекст дома и брачный контекст окружающих стихов склоняют к значению «жена», а «доброй» сохраняет широкое значение ἀγαθή.
- source_word: ἐν κόσμῳ
  choice: в убранстве
  rationale: κόσμος здесь может обозначать и упорядоченность, и украшение; «убранство» естественно соединяет домашнюю обстановку с эстетическим оттенком.
- source_word: οἰκίας αὐτοῦ
  choice: дома её мужа
  rationale: Мужской род αὐτοῦ сохранён по смыслу; явное «её мужа» устраняет неестественную для русского неясность местоимения «его» и не меняет семейного контекста.
theological_decisions:
- issue: Гендерно окрашенная семейная лексика
  choice: доброй жены ... дома её мужа
  alternative: доброй женщины ... в доме его
  rationale: Перевод сохраняет вероятное брачное значение γυνή и мужской род αὐτοῦ, не нейтрализуя семейную рамку исходного текста.
- issue: Смысл κόσμος в образе дома
  choice: убранство
  alternative: устройство
  rationale: Греческое слово допускает оба оттенка. В основном тексте выбран естественный эстетический эквивалент, а подлинная лексическая многозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической премудростной речи. Инверсия умеренная; тире ясно оформляет эллиптическое сравнение, поскольку в греческом связка «такова» подразумевается.
