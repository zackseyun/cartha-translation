lexical_decisions:
- source_word: אִשָּׁה טוֹבָה
  choice: хорошая жена
  rationale: В сочетании с בַעֲלָהּ речь естественно идёт о жене. «Хорошая» сохраняет широкую нравственную и практическую похвалу еврейского טוֹבָה, не сужая её до более истолковательного «добродетельная».
- source_word: אַשְׁרֵי
  choice: счастлив
  rationale: Это мудростное восклицание о завидной, благополучной участи. «Счастлив» ясно и естественно передаёт смысл, тогда как «блажен» в современном русском может звучать более религиозно маркированно, чем требует данный контекст.
- source_word: בַעֲלָהּ
  choice: муж, у которого
  rationale: В брачном контексте слово означает «её муж». Перестройка фразы делает русский текст естественным и избегает неуместного современного значения «хозяин».
- source_word: וּמִסְפַּר יָמָיו
  choice: и число дней его
  rationale: Сохранён образный оборот еврейского текста, также засвидетельствованный греческим параллельным текстом, без сведения его к менее точному слову «жизнь».
- source_word: כִּפְלַיִם
  choice: удваивается
  rationale: Кратко и естественно передаёт значение «вдвое, двойной», сохраняя афористическое утверждение без принудительного буквального числового истолкования.
theological_decisions:
- issue: Передача אַשְׁרֵי в формуле мудростного благопожелания
  choice: счастлив
  alternative: блажен; счастлива участь
  rationale: Стих восхваляет благополучную участь мужа хорошей жены, не называя прямо Бога источником благословения. «Счастлив» сохраняет мудростный характер высказывания и не усиливает его богословскую определённость.
translation_notes:
  register: 'Современный литературный русский язык с кратким афористическим строем. Синтаксис слегка перестроен ради естественности, при этом сохранены оба образа оригинала: хорошая жена и удвоенное число дней.'
