  yaml_path: translation/deuterocanon/sirach/026/013.yaml
  text: Like a thirsty traveler she opens her mouth[a], and from every nearby water she will drink; opposite every stake she will sit down[c][b], and before every arrow she will open her quiver.
translation:
  language: ru
  text: Как жаждущий путник открывает рот, так и она будет пить из всякой воды поблизости; напротив каждого кола она сядет[a], и перед стрелой откроет колчан[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова о воде и коле, вероятно, образно говорят о половой неразборчивости и готовности воспользоваться любой возможностью.
    reason: cultural_note
  - marker: b
    text: Греческий текст сохраняет буквальные образы «стрелы» и «колчана». Точный смысл последней части труден и остаётся спорным, поэтому перевод не заменяет её однозначным толкованием.
    reason: lexical_alternative
lexical_decisions:
- source_word: διψῶν ὁδοιπόρος
  choice: жаждущий путник
  rationale: Причастие и существительное переданы близко к греческому тексту; выражение естественно для современного литературного русского и сохраняет силу сравнения.
- source_word: τὸ στόμα ἀνοίγει
  choice: открывает рот
  rationale: Прямой и конкретный перевод без добавочного усиления, которого нет в греческом.
- source_word: ἀπὸ παντὸς ὕδατος τοῦ σύνεγγυς πίεται
  choice: будет пить из всякой воды поблизости
  rationale: Будущее время πίεται сохранено. «Из всякой воды поблизости» передаёт παντός и идею любой доступной рядом воды, не раскрывая метафору вместо автора.
- source_word: κατέναντι παντὸς πασσάλου καθίσεται
  choice: напротив каждого кола она сядет
  rationale: πάσσαλος буквально означает кол или вбитый столб; «кол» сохраняет конкретный и, вероятно, двусмысленный образ. Будущее καθίσεται передано как «сядет».
- source_word: ἔναντι βέλους
  choice: перед каждой стрелой
  rationale: Хотя при βέλους в данной формулировке нет отдельного παντός, параллелизм и смысл английского консультационного слоя поддерживают распределительное «каждой». Точная сила метафоры остаётся неясной.
- source_word: ἀνοίξει φαρέτραν
  choice: откроет колчан
  rationale: φαρέτρα обычно означает «колчан». Необычный образ сохранён буквально, а его вероятный сексуальный смысл отмечен в сноске.
theological_decisions:
- issue: Сексуальная метафора в наставлении Премудрости
  choice: Сохранить образы воды, кола, стрелы и колчана, не заменяя их прямым утверждением о половой неразборчивости.
  alternative: Передать стих разъясняющим пересказом о готовности женщины вступать в связь с любым мужчиной.
  rationale: Греческий текст выражает порицание через яркие и местами трудные образы. Буквально-образная передача сохраняет авторскую напряжённость и не делает текст более однозначным или откровенным, чем источник.
- issue: Женский субъект во второй части стиха
  choice: Добавить «она» там, где это нужно для ясного русского синтаксиса.
  alternative: Оставить субъект только подразумеваемым или повторять «она» во всех частях.
  rationale: Ближайший контекст говорит о женщине; русское «так и она» ясно связывает сравнение с его предметом, а дальнейшее местоимение обеспечивает читаемость без чрезмерного повторения.
translation_notes:
  register: Современный литературный русский, сдержанный и достоинственный. Синтаксис слегка выровнен посредством «так и она», чтобы сравнение было естественным по-русски. Необычная образность оригинала намеренно сохранена; архаизмы и конфессиональная терминология не вводятся.
