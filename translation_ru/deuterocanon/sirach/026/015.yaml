translation:
  language: ru
  text: Немногословная жена — дар Господа, и нет ничего равноценного воспитанной душе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нет ничего равноценного наставленной душе»; «воспитанная» также может означать «дисциплинированная». Греческое πεπαιδευμένης включает оттенки наставления, формирования и дисциплины.'
    reason: Передаёт лексический диапазон πεπαιδευμένης и сохраняет конкретный смысл ἀντάλλαγμα как чего-либо равноценного или способного служить заменой.
lexical_decisions:
- source_word: δόσις
  choice: дар
  rationale: В этом изречении слово обозначает не действие дарения, а то, что дано; «дар» естественно передаёт смысл.
- source_word: Κυρίου
  choice: Господа
  rationale: Родительный падеж указывает на источник дара; традиционное и ясное соответствие κύριος в данном контексте — «Господь».
- source_word: γυνὴ
  choice: жена
  rationale: Хотя γυνή может означать и «женщина», контекст главы посвящён супруге и браку.
- source_word: σιγηρά
  choice: немногословная
  rationale: Слово характеризует сдержанность в речи. «Немногословная» сохраняет положительный смысл, не подразумевая полного молчания.
- source_word: ἀντάλλαγμα
  choice: ничто не сравнится
  rationale: Буквально слово может обозначать замену или нечто равноценное. В русском изречении эта формулировка естественно выражает несравненную ценность.
- source_word: πεπαιδευμένης
  choice: воспитанной
  rationale: Причастие от παιδεύω охватывает обучение, формирование характера и дисциплину; «воспитанная» сохраняет нравственный оттенок мудростной литературы.
- source_word: ψυχῆς
  choice: душой
  rationale: Здесь ψυχή обозначает внутреннего человека и его нравственный склад; «душа» сохраняет духовно-нравственный регистр.
theological_decisions:
- issue: Связь выражения πεπαιδευμένης ψυχῆς с упомянутой женой
  choice: Сохранить самостоятельное выражение «воспитанная душа», позволяя параллелизму связывать его с характером жены.
  alternative: 'Прямо уточнить: «воспитанная душа такой жены».'
  rationale: Греческий текст не повторяет слово «жена» во второй части. Прямое уточнение сняло бы подлинную грамматическую широту высказывания.
- issue: Смысл πεπαιδευμένης
  choice: «воспитанной» — сформированной наставлением и дисциплиной
  alternative: «обученной» или «дисциплинированной»
  rationale: Греческое слово допускает акцент как на наставлении, так и на дисциплине. «Воспитанная» в данном контексте объединяет оба оттенка без сведения смысла к формальному образованию.
translation_notes:
  register: Современный литературный русский язык с краткой, dignified пословичной формой. «Немногословная» передаёт похвальную сдержанность речи точнее, чем «молчаливая», а конструкция «ничто не сравнится» избегает тяжеловесного «нет равноценной замены».
