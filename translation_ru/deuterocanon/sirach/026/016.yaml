lexical_decisions:
- source_word: χάρις ἐπὶ χάριτι
  choice: очарование к очарованию
  rationale: В данном описании достоинств женщины χάρις обозначает привлекательность и обаяние, а не богословскую «благодать»; повтор передаёт накопление и усиление качества.
- source_word: γυνὴ
  choice: женщина
  rationale: Без указания на брачные отношения γυνή естественнее понимать в общем значении «женщина», а не «жена».
- source_word: αἰσχυντηρά
  choice: скромная
  rationale: Прилагательное обозначает нравственную стыдливость и сдержанность; «скромная» передаёт положительную оценку современным литературным языком.
- source_word: σταθμὸς
  choice: весы
  rationale: Слово связано со взвешиванием и мерой; «весы» сохраняют конкретный образ греческого текста.
- source_word: πᾶς ἄξιος
  choice: нет весов, достойных
  rationale: Сохранена сжатая и несколько необычная конструкция оригинала без добавления прямо не выраженного понятия стоимости.
- source_word: ἐγκρατοῦς ψυχῆς
  choice: души, владеющей собой
  rationale: Описательная формулировка естественно передаёт ἐγκρατής как самообладание и сохраняет ψυχή как «душа».
theological_decisions:
- issue: Значение αἰσχυντηρά как добродетели
  choice: скромная
  alternative: стыдливая
  rationale: Контекст выражает похвалу нравственной сдержанности, а не чувство позора; основной вариант не создаёт отрицательного оттенка.
- issue: Метафора неизмеримой ценности во второй части
  choice: нет весов, достойных души, владеющей собой
  alternative: никакие весы не могут измерить ценность души, владеющей собой
  rationale: Выбранный вариант следует форме греческого текста и сохраняет его смысловую напряжённость, не вводя явно слова «измерить» и «ценность».
- issue: χάρις в контексте женских достоинств
  choice: очарование
  alternative: благодать
  rationale: Контекст указывает на привлекательное, приятное качество человека; «благодать» могла бы без достаточного основания придать выражению специальный богословский смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством мудрой сентенции. Сохранены параллелизм, весовая метафора и необычная сжатость оригинала; архаические «стыдливая» и «целомудренная душа» не вынесены в основной текст.
