translation:
  language: ru
  text: Жена-пьяница — великий гнев, и своего позора она не скроет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυνὴ μέθυσος
  choice: жена-пьяница
  rationale: γυνή в контексте наставлений о супружестве означает «жена», а μέθυσος обозначает человека, склонного к пьянству, а не просто однажды опьяневшего.
- source_word: ὀργὴ μεγάλη
  choice: великий гнев
  rationale: Сохранён необычный именной образ греческого текста без добавления отсутствующих в источнике слов «причина» или «вызывает».
- source_word: ἀσχημοσύνην
  choice: бесстыдство
  rationale: Слово указывает на постыдное, непристойное поведение; «бесстыдство» передаёт этот деятельный оттенок точнее, чем одно лишь внутреннее чувство стыда.
- source_word: οὐ συγκαλύψει
  choice: не скроет
  rationale: Передаёт значение совместного/полного сокрытия естественным современным русским выражением.
theological_decisions:
- issue: Характер утверждения «ὀργὴ μεγάλη»
  choice: 'Сохранить прямое отождествление: «великий гнев»'
  alternative: «вызывает великий гнев» или «причина великого гнева»
  rationale: Греческий текст не выражает явно ни причинности, ни того, чей именно это гнев; буквальная именная конструкция сохраняет его напряжённость и неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой афористичной структурой. Необычная метафора оригинала сохранена; архаизмы и конфессионально окрашенная терминология не использованы.
