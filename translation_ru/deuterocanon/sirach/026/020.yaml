lexical_decisions:
- source_word: Ἐπὶ δυτὶ
  choice: О двух вещах
  rationale: ἐπί с дательным обозначает повод для скорби; русское «о двух вещах» естественно передаёт перечислительную конструкцию.
- source_word: λελύπηται
  choice: скорбит
  rationale: Перфектная форма выражает сохраняющееся состояние скорби; настоящее время «скорбит» естественно передаёт этот результативно-стативный смысл.
- source_word: ἡ καρδία μου
  choice: моё сердце
  rationale: Буквальный библейский образ естественен по-русски и сохраняет сердце как средоточие переживаний.
- source_word: ἐπὶ τῷ τρίτῳ
  choice: из-за третьей
  rationale: Передаёт основание или повод для гнева и сохраняет риторический переход от двух вещей к третьей.
- source_word: θυμός
  choice: гнев
  rationale: Нейтрально и точно передаёт сильный гнев, не усиливая его до ярости и не придавая ему особой богословской окраски.
- source_word: μοι ἐπῆλθεν
  choice: меня охватил
  rationale: Естественный русский оборот передаёт гнев как состояние, овладевшее говорящим, без уточнения, внешнее оно или внутреннее.
