translation:
  language: ru
  text: Того, кто возвращается от праведности ко греху, Господь приготовит для меча.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Того, кто уводит [кого-либо] от праведности ко греху». Греческое причастие имеет активную форму и буквально может означать «ведущий назад» или «возвращающий»; переходное понимание возможно, хотя дополнение в тексте не выражено. В данном контексте естественно также понимать его как возвращение самого человека к греху.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπανάγων
  choice: того, кто возвращается
  rationale: Причастие ἐπανάγων буквально может означать «ведущий/возвращающий назад»; в сочетании «от праведности ко греху» оно передаёт нравственное возвращение к прежнему пути. Русское «возвращается» естественно выражает этот смысл, не устраняя возможный переходный оттенок греческой формы.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: В противопоставлении греху слово обозначает нравственную правоту; «праведность» сохраняет обычную библейскую лексику и подходит здесь лучше, чем «справедливость».
- source_word: ἁμαρτίαν
  choice: греху
  rationale: Прямой и общепринятый эквивалент в нравственно-религиозном контексте.
- source_word: ὁ κύριος
  choice: Господь
  rationale: В контексте библейской книги Премудрости κύριος относится к Богу; традиционное и ясное русское соответствие — «Господь».
- source_word: ἑτοιμάσει
  choice: приготовит
  rationale: Сохраняет прямое значение будущего времени «приготовит, сделает готовым», не уточняя сверх текста характер суда.
- source_word: εἰς ῥομφαίαν
  choice: для меча
  rationale: Передаёт образ насильственного суда буквально и кратко. Слово ῥομφαία обозначает большой меч, однако родовое «меч» естественнее в современном русском библейском стиле.
theological_decisions:
- issue: Характер Божьего суда в словах «Господь приготовит для меча»
  choice: Сохранено прямое действие Господа как субъекта Божьего суда над возвращающимся от праведности ко греху.
  alternative: Понимать это лишь как общее провиденциальное последствие, а не как прямое карательное действие.
  rationale: Явный субъект ὁ κύριος и глагол будущего времени ἑτοιμάσει представляют Господа действующим лицом. Перевод сохраняет эту богословскую напряжённость, не развивая её в более подробное учение о воздаянии.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным библейским звучанием. Синтаксис сохраняет условно-обобщающий характер греческого причастного оборота; образ меча и прямая роль Господа не смягчены.
