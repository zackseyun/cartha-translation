base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/007.yaml
  text: A jealous wife is heartache and grief when set against another woman[b][a], and a scourge of the tongue that associates with everyone.
translation:
  language: ru
  text: Боль в сердце и скорбь — жена, ревнующая к другой женщине[a]; её язык — бич, касающийся всех[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «жена-соперница по отношению к другой жене» или «соперничающая из-за другой женщины». Греческое выражение сжато и может обозначать как ревность к другой женщине вообще, так и соперничество двух жён.'
    reason: lexical_alternative
  - marker: b
    text: 'Последняя часть стиха не вполне ясна. Буквально по-гречески: «бич языка, общающийся со всеми»; глагол может также обозначать нечто общее или разделяемое всеми. Вероятно, речь идёт о злых словах, задевающих всех без разбора.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλγος καρδίας
  choice: боль сердца
  rationale: Сохраняет образ внутренней сердечной боли и естественно звучит в современном литературном русском языке.
- source_word: πένθος
  choice: скорбь
  rationale: Передаёт глубокую печаль, не ограничивая значение обрядовым трауром, и поддерживает параллелизм с «болью сердца».
- source_word: γυνὴ ἀντίζηλος
  choice: жена, ревнующая
  rationale: ἀντίζηλος допускает значения ревности и соперничества. Выбранный вариант естественен в данном семейном контексте и не предполагает непременно многожёнство.
- source_word: ἐπὶ γυναικί
  choice: к другой женщине
  rationale: Передаёт направленность ревности и сохраняет более общее значение «женщина», не сужая его без необходимости до второй жены.
- source_word: μάστιξ γλώσσης
  choice: бич её языка
  rationale: Сохраняет выразительную метафору причиняющей боль речи; местоимение связывает оборот с упомянутой женой, как того требует естественный русский синтаксис.
- source_word: πᾶσιν ἐπικοινωνοῦσα
  choice: поражает всех
  rationale: Контекстуально передаёт распространение словесного бича на всех. Буквальное значение причастия допускает «сообщаться, делиться, быть общим», поэтому неоднозначность отмечена в сноске.
