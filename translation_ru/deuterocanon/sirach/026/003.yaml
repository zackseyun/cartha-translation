base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/003.yaml
  text: A good wife is a good gift[a]; she will be given into the bosom of one who fears God.
translation:
  language: ru
  text: Хорошая жена — хороший дар; она будет дана в объятия того, кто боится Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «она будет дана в удел боящихся Господа». Еврейский текст говорит: «в объятия того, кто боится Бога», используя более личный образ.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה טוֹבָה
  choice: добрая жена
  rationale: אִשָּׁה может означать «женщина» или «жена»; контекст брачной мудрости и греческая параллель поддерживают здесь значение «жена».
- source_word: מַתָּנָה טוֹבָה
  choice: добрый дар
  rationale: Сохраняет повтор определения טוֹבָה («добрая/добрый») и краткий афористичный строй еврейского текста.
- source_word: בְּחֵיק
  choice: в объятия
  rationale: Буквально слово обозначает «лоно, грудь» и передаёт образ близости. «В объятия» естественно звучит по-русски, сохраняя интимный образ, в отличие от греческого абстрактного «в уделе».
- source_word: יֵרֵא אֱלֹהִים
  choice: боящемуся Бога
  rationale: Передаёт единственное число и традиционное библейское понятие благоговейного страха перед Богом, не добавляя отсутствующего в словосочетании обозначения пола.
- source_word: תִּנָּתֵן
  choice: она будет дана
  rationale: Пассивная форма имперфекта естественно передаётся будущим временем; местоимение ясно обозначает жену как подлежащее.
theological_decisions:
- issue: Божественное именование в заключительной части
  choice: Бога
  alternative: Господа
  rationale: Основной еврейский свидетель содержит אֱלֹהִים («Бог»), тогда как греческая параллель — Κύριον («Господь»). В основном тексте предпочтено еврейское чтение, а греческое отмечено в сноске.
- issue: Образ дара и человеческих отношений
  choice: Сохранена пассивная формулировка «будет дана» без уточнения действующего лица
  alternative: «Бог даст её»
  rationale: Еврейский текст использует пассив и прямо не называет дарителя; перевод не должен без необходимости делать подразумеваемое богословское утверждение явным.
translation_notes:
  register: Современный литературный русский с достоинством библейской мудрой речи. Повтор «добрая — добрый» намеренно сохранён; «в объятия» передаёт еврейский образ естественнее буквального и архаичного «в лоно».
