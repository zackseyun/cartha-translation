lexical_decisions:
- source_word: ἀπὸ τριῶν
  choice: трёх вещей
  rationale: Предлог ἀπό с числительным указывает здесь на причины страха; существительное «вещей» восполнено по смыслу и не уточняет заранее последующее перечисление.
- source_word: εὐλαβήθη
  choice: устрашилось
  rationale: В данном контексте εὐλαβέομαι выражает боязнь или тревогу, а не благоговение. «Устрашилось» сочетается с сохранённым образом сердца и соответствует возвышенному повествовательному регистру.
- source_word: ἡ καρδία μου
  choice: моё сердце
  rationale: Сохранён образ сердца как средоточия внутренней реакции; по-русски он понятен и не требует замены на простое «я».
- source_word: ἐπὶ τῷ τετάρτῳ προσώπῳ
  choice: перед четвёртым лицом
  rationale: Оборот намеренно сохраняет необычное πρόσωπον («лицо», также «человек» или «облик») и не снимает неоднозначности. «Перед» естественно передаёт возможное пространственно-образное значение ἐπί с дательным.
- source_word: ἐδεήθην
  choice: я взмолился
  rationale: δέομαι означает настойчиво просить, умолять или молиться. «Взмолился» передаёт интенсивность и при этом не добавляет прямо не названного адресата молитвы.
theological_decisions:
- issue: Неоднозначность выражения ἐπὶ τῷ τετάρτῳ προσώπῳ
  choice: Сохранить в основном тексте буквальный образ «перед четвёртым лицом»
  alternative: «из-за четвёртого человека» или «перед четвёртой вещью»
  rationale: Греческое πρόσωπον допускает значения «лицо», «человек» и «облик». Буквальный образ сохраняет смысловую напряжённость источника, а примечание сообщает более гладкие толкования без выбора одного из них.
