  source_fidelity: 'Начальная часть передана верно по смыслу: ἀπὸ τριῶν — «из-за трёх вещей», ἡ καρδία μου сохранено как «моё сердце», а εὐλαβήθη передаёт страх. Однако «перед четвёртым лицом» неоправданно закрепляет пространственное значение «перед» и в русском практически неизбежно понимается как нахождение перед лицом конкретного человека. ἐπὶ τῷ τετάρτῳ προσώπῳ — трудный оборот; его следует передать более нейтрально, сохранив разъяснение о πρόσωπον в примечании.'
