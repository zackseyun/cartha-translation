base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/026/028.yaml
  text: 'Over two things my heart is grieved[a], and over a third anger has come upon me: a warrior brought low by poverty, and men of understanding if they are treated like refuse[b], and one who turns back from righteousness to sin—the Lord will prepare him for the sword.'
translation:
  language: ru
  text: 'О двух вещах скорбит моё сердце, а из-за третьей гнев охватил меня: воин, терпящий лишения из-за нищеты; разумные люди, если с ними обращаются как с отбросами[a]; и тот, кто возвращается от праведности ко греху, — Господь уготовит его для меча[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «если их выбрасывают, словно мусор» или «если с ними обращаются как с нечистотами». Греческий глагол образован от слова, означающего отбросы или нечистоты, и выражает презрительное унижение.'
    reason: lexical_alternative
  - marker: b
    text: Конечное «его» естественнее всего относится к тому, кто возвращается от праведности ко греху. Однако греческий перечень синтаксически сжат, поэтому заключительный приговор можно понять и как итог всего изречения.
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπὶ δυτὶ λελύπηται ἡ καρδία μου
  choice: О двух вещах скорбит моё сердце
  rationale: Оборот с ἐπί и дательным падежом называет причины скорби; перфект λελύπηται передаёт сохраняющееся состояние. Настоящее время «скорбит» естественно выражает его по-русски.
- source_word: ἐπὶ τῷ τρίτῳ θυμός μοι ἐπῆλθεν
  choice: а из-за третьей меня охватывает гнев
  rationale: Сохраняется переход от скорби о двух обстоятельствах к гневу из-за третьего; «охватывает» естественно передаёт образ гнева, находящего на говорящего.
- source_word: ἀνὴρ πολεμιστὴς ὑστερῶν διʼ ἔνδειαν
  choice: воин, терпящий лишения из-за нищеты
  rationale: ὑστερέω указывает на недостаток и нужду, а ἔνδεια — на бедность как её причину. Формулировка передаёт и материальные лишения, и унизительное положение воина.
- source_word: ἄνδρες συνετοὶ
  choice: разумные люди
  rationale: συνετός обозначает людей понимающих и рассудительных. «Разумные люди» звучит современно и не усиливает значение до особой духовной мудрости.
- source_word: ἐὰν σκυβαλωθῶσιν
  choice: если с ними обращаются как с отбросами
  rationale: Редкий глагол, образованный от σκύβαλον, выражает презрительное низведение человека до мусора или нечистот. Основной текст сохраняет резкость образа без излишне грубой лексики.
- source_word: ἐπανάγων ἀπὸ δικαιοσύνης ἐπὶ ἁμαρτίαν
  choice: тот, кто возвращается от праведности ко греху
  rationale: Причастие передаёт движение назад, от праведного пути к греху. «Праведность» сохраняет нравственно-религиозный смысл δικαιοσύνη в данном контексте.
- source_word: ὁ κύριος ἑτοιμάσει εἰς ῥομφαίαν αὐτόν
  choice: Господь уготовит его мечу
  rationale: «Уготовит ... мечу» передаёт назначение на гибель от меча, сохраняет сжатость и грозный судебный тон греческой фразы.
theological_decisions:
- issue: К кому относится конечное местоимение αὐτόν («его») после перечня трёх обстоятельств
  choice: В основном тексте «его» ближайшим образом относится к тому, кто возвращается от праведности ко греху.
  alternative: Заключительный приговор можно услышать как итог всего изречения, относящийся ко всему перечню.
  rationale: Местоимение стоит в единственном числе непосредственно после причастного оборота в единственном числе, поэтому такое соотнесение наиболее естественно. Сжатость греческого синтаксиса и возможность более широкого прочтения отмечены в сноске.
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: Противопоставление греху указывает прежде всего на нравственно-религиозную правильность жизни, а не на узкую тему общественной справедливости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Перечень разделён точками с запятой, чтобы показать три обстоятельства, не устраняя резкой синтаксической смены перед заключительным приговором. Форма «уготовит» намеренно сохраняет торжественный судебный оттенок, оставаясь понятной современному читателю.
