lexical_decisions:
- source_word: ἀνὴρ πολεμιστής
  choice: воин
  rationale: Кратко и естественно передаёт существительное с определением, сохраняя мужской род и единственное число.
- source_word: ὑστερῶν
  choice: терпящий лишения
  rationale: Причастие выражает недостаток, нужду или утрату необходимого; этот вариант сохраняет процессуальное значение и естественно сочетается с указанием причины.
- source_word: διʼ ἔνδειαν
  choice: из-за бедности
  rationale: ἔνδεια означает нужду, недостаток или бедность; здесь «бедность» ясно передаёт причинное значение διά с винительным падежом и избегает неестественного повтора слова «нужда».
- source_word: ἄνδρες συνετοί
  choice: люди разумные
  rationale: συνετός указывает на разумение и рассудительность. «Люди разумные» сохраняет смысл и звучит естественнее буквального «мужи разумные» в современном русском.
- source_word: ἐὰν σκυβαλωθῶσιν
  choice: если с ними обращаются как с отбросами
  rationale: Глагол связан со σκύβαλον — выброшенными отбросами или нечистотами — и выражает унизительное обращение с людьми как с чем-то грязным и ненужным.
