  text: A wicked wife is a shaking yoke for oxen[a]; whoever takes hold of her is like one who grabs a scorpion.
translation:
  language: ru
  text: Злая жена — шатающееся воловье ярмо[a]; кто держит её, тот словно хватается за скорпиона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение βοοζύγιον σαλευόμενον необычно и допускает разные понимания: «шатающееся воловье ярмо» или «мечущаяся упряжка волов». В любом случае образ передаёт неустойчивость и тяжесть, нарушающую порядок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βοοζύγιον
  choice: воловье ярмо
  rationale: Сложное слово вызывает конкретный образ волов и упряжи. «Воловье ярмо» сохраняет сельскохозяйственную метафору, не сводя её однозначно к самой паре запряжённых волов.
- source_word: σαλευόμενον
  choice: шатающееся
  rationale: Причастие передаёт движение, раскачивание или неустойчивость. «Шатающееся» сохраняет зримый и тревожный характер образа.
- source_word: γυνὴ πονηρά
  choice: злая жена
  rationale: В контексте семейной мудрости γυνή естественно означает «жена», а πονηρά выражает нравственно отрицательную характеристику сильнее, чем просто «плохая».
- source_word: ὁ κρατῶν αὐτῆς
  choice: кто держит её
  rationale: κρατέω может означать хватать, держать или удерживать. «Держит» сохраняет тактильный смысл и связь с последующим сравнением, не уточняя без необходимости, идёт ли речь об обладании или сдерживании.
- source_word: δρασσόμενος
  choice: хватается
  rationale: Глагол обозначает захватывание рукой. Возвратная форма естественна по-русски в сочетании «хвататься за скорпиона» и ярко передаёт опасность действия.
- source_word: σκορπίου
  choice: скорпиона
  rationale: Прямое наименование животного; родительный падеж обусловлен русским управлением «хвататься за».
