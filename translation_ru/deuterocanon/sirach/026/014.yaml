lexical_decisions:
- source_word: χάρις
  choice: благодатность
  rationale: Здесь слово обозначает привлекательное сочетание доброты, достоинства и обаяния, а не спасительную благодать. «Благодатность» сохраняет нравственно-эстетическую широту греческого слова.
- source_word: γυναικός
  choice: жены
  rationale: Упоминание «её мужа» прямо задаёт супружеский контекст, поэтому значение «жена» естественнее общего «женщина».
- source_word: τέρψει
  choice: радует
  rationale: Будущая форма в греческой сентенции выражает закономерный результат; русский настоящий вид лучше передаёт обобщённое утверждение. «Радует» естественно отражает значение доставлять удовольствие или отраду.
- source_word: ἐπιστήμη
  choice: разумение
  rationale: Слово может означать знание, понимание или практическую рассудительность. «Разумение» сохраняет содержательную широту и соответствует контексту житейской мудрости.
- source_word: πιανεῖ
  choice: укрепляет
  rationale: Буквально глагол означает «делает тучными, упитанными». В сочетании с костями образ говорит о питании, крепости и жизненной силе; «укрепляет» естественно передаёт смысл, а буквальная образность отмечена в сноске.
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: его кости
  rationale: Сохранён конкретный телесный образ греческого текста, обозначающий физическую и внутреннюю крепость человека.
