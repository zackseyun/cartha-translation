  text: Keep strict watch over a headstrong daughter[a], lest, finding freedom for herself, she make use of it.
translation:
  language: ru
  text: За дочерью установи неослабный надзор, чтобы она, найдя для себя послабление, не воспользовалась им.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «над дочерью непреклонно укрепи стражу, чтобы она, найдя для себя послабление, не воспользовалась [им]». Греческое выражение кратко; «им» подразумевает найденное послабление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ θυγατρί
  choice: за дочерью
  rationale: 'ἐπί с дательным падежом обозначает лицо, на которое направлен надзор; по-русски естественно: «надзор за дочерью».'
- source_word: ἀδιατρέπτως
  choice: неослабный
  rationale: Наречие относится прежде всего к повелению укрепить надзор и передаёт непреклонность, отсутствие отступления или послабления. Прилагательное «неослабный» естественно соединяется в русском с существительным «надзор», не приписывая дочери прямо не названное качество «своенравная».
- source_word: στερέωσον φυλακήν
  choice: установи ... надзор
  rationale: Буквально выражение означает «укрепи стражу/охрану». В контексте родительского наблюдения «установи надзор» сохраняет смысл и звучит естественно; усилительное значение στερέωσον передано словом «неослабный».
- source_word: εὑροῦσα ἄνεσιν ἑαυτῇ
  choice: найдя для себя послабление
  rationale: ἄνεσις может означать облегчение, свободу от ограничений или послабление. Здесь «послабление» сохраняет связь с надзором и не сводит выражение к абстрактной свободе.
- source_word: χρήσηται
  choice: не воспользовалась им
  rationale: χράομαι означает «пользоваться». Дополнение «им» естественно отсылает к найденному послаблению, хотя в греческом объект явно не повторён.
