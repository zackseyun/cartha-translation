  register: Современный литературный русский язык с достоинством наставительной мудрости. Перевод сохраняет строгость исходного наставления, но не переносит наречие ἀδιατρέπτως на характеристику дочери, поскольку грамматически естественнее связывать его с повелением укрепить надзор.
