base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/017.yaml
  text: And until his heart is filled with me[a], I will return and make him happy[b], and I will reveal my secrets to him.
translation:
  language: ru
  text: И пока его сердце не наполнится мною[a], я вернусь, осчастливлю его[b] и открою ему мои тайны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «пока она не станет доверять его душе»; возможно также понимание: «пока он не вверит ей свою душу». Далее: «и испытает его своими установлениями». Это отражает более пространное чтение об испытании человека Премудростью перед её благосклонным возвращением.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «сделаю его блаженным»; возможно также: «назову его блаженным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַד עֵת
  choice: И пока
  rationale: Передаёт союз и временной предел естественно для современного русского языка; слово «время» не добавлено, поскольку по-русски оно здесь избыточно.
- source_word: יִמָּלֵא לִבּוֹ בִּי
  choice: его сердце не наполнится мною
  rationale: Сохраняет буквальный и образный смысл еврейского текста, включая речь персонифицированной Премудрости от первого лица; не подменяет образ толкованием о доверии.
- source_word: אָשׁוּב
  choice: я вернусь
  rationale: Прямо передаёт обычное значение глагола שוב и подразумеваемый благоприятный поворот Премудрости к ученику после испытания.
- source_word: אֲאַשְּׁרֶנּוֹ
  choice: осчастливлю его
  rationale: Естественно передаёт каузативный смысл — сделать счастливым или блаженным — без излишне узкого конфессионального оттенка.
- source_word: וְגָלִיתִי לוֹ
  choice: и открою ему
  rationale: Русское «открою» идиоматично выражает раскрытие прежде сокрытого.
- source_word: מִסְתָּרִי
  choice: мои тайны
  rationale: Ясно передаёт скрытые вещи, принадлежащие Премудрости; множественное число соответствует смыслу собирательного выражения и не вносит технического богословского термина.
theological_decisions:
- issue: Соотношение сохранившейся еврейской строки с более пространным греческим параллельным текстом о страхе, испытании и доверии
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; греческое чтение отмечено в сноске.
  alternative: Включить в основной текст греческие формулировки о доверии души и испытании установлениями Премудрости.
  rationale: При наличии еврейского текста ему отдаётся первенство. Греческий параллельный текст важен для истории текста и контекста испытания, но его дополнительные части не следует незаметно вносить в основной перевод.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан плавным, но образ наполненного Премудростью сердца и неоднозначность глагола אֲאַשְּׁרֶנּוֹ сохранены. Все сноски обозначены в основном тексте.
