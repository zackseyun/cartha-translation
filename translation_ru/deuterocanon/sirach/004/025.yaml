translation:
  language: ru
  text: Не противься Богу, но смирись перед Богом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Не противоречь истине и стыдись своей неучёности». Еврейский текст вместо этого гласит: «Не противься Богу, но смирись перед Богом».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּסָּרֵב
  choice: не противься
  rationale: Глагол выражает отказ, упрямое сопротивление или противодействие. «Не противься» естественно передаёт запрет противостоять Богу и образует смысловой контраст со «смирись».
- source_word: עִם הָאֵל
  choice: Богу
  rationale: אֵל — обычное обозначение Бога. Предлог עִם, буквально «с», передан в соответствии с русским управлением глагола «противиться».
- source_word: וְאֶל אֱלֹהִים
  choice: перед Богом
  rationale: Предлог אֶל буквально указывает направление — «к Богу», однако при глаголе смирения русское «перед Богом» естественно выражает направленность и положение человека по отношению к Богу.
- source_word: הִכָּנֵעַ
  choice: смирись
  rationale: 'Форма имеет возвратно-средний смысл: стать смиренным, покориться, уступить. «Смирись» кратко и ясно сохраняет как внутреннее смирение, так и идею подчинения.'
theological_decisions:
- issue: Расхождение между сохранившимся еврейским текстом и греческой параллелью
  choice: Основной текст следует сохранившемуся еврейскому чтению о сопротивлении Богу и смирении перед Ним.
  alternative: «Не противоречь истине и стыдись того, что ты не наставлен».
  rationale: Поскольку еврейский свидетель здесь сохранился и имеет высокую степень надёжности, он положен в основу перевода. Существенно отличающееся греческое чтение не смешивается с ним, а приводится в примечании, чтобы сохранить текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, симметричная форма наставления сохраняет достоинство и прямоту еврейского оригинала. Повтор слова «Бог» оставлен ради ясности и параллелизма.
