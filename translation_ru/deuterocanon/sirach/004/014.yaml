review_pass:
  verdict: revise
  source_fidelity: 'Нужна правка. В еврейском тексте порядок и связь первой части иные, чем в черновике: מְשָׁרְתֵי קֹדֶשׁ стоит перед מְשָׁרְתֶיהָ, то есть буквально речь идёт о служащих святыне/святости, которые служат ей. Перевод «Кто служит ей, тот служит Святому» следует греческому параллельному тексту, но не первичному здесь еврейскому свидетельству. Кроме того, בֵּית [מוֹשָׁבָהּ אָהֵב] содержит именно лексику дома/обитания, а не явное «тех, кто любит её»; это следует передать в основном тексте с примечанием о трудности чтения.'
  naturalness: «Служащие святыне служат ей» — современная литературная и достаточно лаконичная русская передача, сохраняющая намеренно необычную связь оригинала. «Дом её обитания» несколько тяжеловесен, однако в данном месте оправдан как прозрачная передача текстуально трудного еврейского чтения; примечание объясняет эту трудность.
  terminology: 'קֹדֶשׁ не следует без оговорок превращать в личное «Святому»: слово может означать «святыню» или «святость», а личное истолкование опирается главным образом на греческий текст. אֱלֹהִים правильно передаётся как «Бог», а не «Господь».'
  issues:
  - severity: high
    issue: Переставлена связь членов первой части стиха.
    rationale: 'Черновик: «Кто служит ей, тот служит Святому». Еврейский текст в представленном виде: «служащие святыне/святости — её служащие»; греческий параллельный текст действительно имеет обратную связь. При первичности еврейского текста основной перевод не должен заменять его греческим.'
  - severity: medium
    issue: «Святому» излишне определяет неоднозначное קֹדֶשׁ как личное обозначение Бога.
    rationale: В еврейском выражении нет явного личного обозначения; «святыне» позволяет сохранить лексическую и референциальную неопределённость.
  - severity: medium
    issue: Вторая часть основного текста добавляет «тех, кто любит», чего еврейское трудное чтение явно не содержит.
    rationale: Еврейская строка содержит слова «дом/обитание» и требует осторожной, буквальной передачи; гладкое чтение «тех, кто любит её» следует привести как греческий вариант в примечании.
  revised_text: Служащие святыне служат ей, и Бог любит дом её обитания[a].
  revised_footnotes:
  - marker: a
    text: 'Еврейский текст в этой части труден и не вполне уверен: буквально — «дом её обитания». Греческий текст читает: «а тех, кто любит её, любит Господь».'
    reason: Текстологическая неопределённость еврейского чтения и альтернативное греческое чтение.
  revision_rationale: 'Перевод возвращает порядок и неопределённость еврейского текста: «святыне» вместо интерпретирующего «Святому», а также «дом её обитания» вместо греческого по смыслу «тех, кто любит её». Греческий параллельный текст полностью и нейтрально отражён в сноске. Повтор «служат» и «любит» сохранён.'
