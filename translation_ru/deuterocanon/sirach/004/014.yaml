  text: Those who minister to her minister to the Holy One[a], and God loves those who love her dwelling.
translation:
  language: ru
  text: Кто служит ей, тот служит Святому[a], и Бог любит тех, кто любит её обитель.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст: «а тех, кто любит её, любит Господь». Еврейский текст в этом месте, по-видимому, сохраняет более трудное и не вполне уверенное чтение с упоминанием её обители; слово «Святому» также передаёт сжатое еврейское выражение, которое можно понять как «святыне» или «святости».'
    reason: Альтернативное греческое чтение и лексическая неоднозначность еврейского текста.
lexical_decisions:
- source_word: מְשָׁרְתֵי / מְשָׁרְתֶיהָ
  choice: служит / служит ей
  rationale: Глагол שרת обозначает служение или прислуживание, нередко в священном или официальном контексте. «Служит» естественно звучит по-русски и сохраняет возвышенный оттенок; греческие λατρεύοντες и λειτουργήσουσιν подтверждают смысл преданного или священного служения.
- source_word: קֹדֶשׁ
  choice: Святому
  rationale: Сжатое еврейское выражение משרתי קדש допускает неоднозначность, но в данном контексте и с учётом греческого ἁγίῳ естественнее всего понимать его как указание на Святого, то есть Бога. Субстантивированное «Святому» сохраняет лаконичность исходного текста.
- source_word: וֵאלֹהִים
  choice: и Бог
  rationale: Еврейский текст прямо употребляет אֱלֹהִים, поэтому избрано «Бог», а не греческое «Господь».
- source_word: בֵּית [מוֹשָׁבָהּ אָהֵב]
  choice: любит тех, кто любит её обитель
  rationale: Переданный еврейский текст содержит трудное и редакционно неуверенное чтение с лексикой дома или обитания. Перевод сохраняет образ обители, но делает синтаксис естественным; более гладкое греческое чтение вынесено в примечание.
- source_word: אָהֵב
  choice: любит
  rationale: Обычное соответствие для אהב. Повтор глагола «любит» сохраняет риторическую симметрию чтения.
theological_decisions:
- issue: Обозначение Бога в первой части стиха
  choice: Святому
  alternative: святыне / святости
  rationale: Еврейское קֹדֶשׁ грамматически сжато и может обозначать святость или святыню, однако греческое ἁγίῳ и контекст служения поддерживают личное понимание. Неоднозначность отмечена сноской.
- issue: Божественный титул во второй части стиха
  choice: Бог
  alternative: Господь
  rationale: Основной еврейский свидетель читает אֱלֹהִים. Греческое ὁ κύριος вторично для данного перевода и отражено в примечании вместе с более широким вариантом греческой строки.
- issue: Объект Божьей любви во второй части стиха
  choice: те, кто любит её обитель
  alternative: те, кто любит её
  rationale: Основной текст удерживает более трудное еврейское чтение с упоминанием обители, не сглаживая его по греческому тексту. Ясное греческое чтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и возвышенный без архаизации. Синтаксический параллелизм служения и любви сохранён; местоимение женского рода относится к персонифицированной Премудрости.
