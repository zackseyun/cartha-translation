lexical_decisions:
- source_word: דֹּוֶוה נֶפֶשׁ חֲסֵרָה
  choice: душу нуждающегося
  rationale: Сочетание описывает человека, страдающего от недостатка и нужды. Такой перевод сохраняет широту еврейского выражения и не сводит его только к буквальному голоду, хотя греческая параллель говорит о «голодной душе».
- source_word: אַל תָּפוּחַ
  choice: не доводи до отчаяния
  rationale: Трудная глагольная форма в контексте означает усугубление страдания уже нуждающегося человека. Греческое λυπήσῃς («не огорчай, не причиняй скорби») подтверждает общий смысл причинения душевной боли; «не доводи до отчаяния» передаёт усилительный оттенок, не представляя его как бесспорный буквальный эквивалент.
- source_word: וְאַל תִּתְעַלֵּם
  choice: и не отворачивайся
  rationale: Возвратная форма от עלם может означать скрываться, делать вид, будто не замечаешь. «Не отворачивайся» естественно передаёт сознательное уклонение от человека и сохраняет образный оттенок лучше, чем нейтральное «не игнорируй».
- source_word: מִמְּדֻכְדַּךְ נָפֶשׁ
  choice: от человека, подавленного душой
  rationale: מדוכדך обозначает сокрушённого, удручённого, придавленного несчастьем. Формулировка сохраняет повтор слова נֶפֶשׁ и внутреннее измерение страдания, но по-русски указывает на самого человека, а не на отвлечённую «душу».
