translation:
  language: ru
  text: Если он перестанет следовать за мной, я отвергну его и отдам грабителям[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «и предаст его в руки его падения»; возможно, это отражает иное исходное чтение или истолковательное воспроизведение.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָסוּר מֵאַחֲרַי
  choice: перестанет следовать за мной
  rationale: Сочетание буквально означает «отступит от следования за мной». Русская формулировка естественно передаёт как значение глагола סור («отступать, уклоняться»), так и идиому מאחרי («вслед за мной, от следования за мной»), не усиливая её до полного вероотступничества.
- source_word: אַשׁלִיכֶנּוּ
  choice: я отвергну его
  rationale: Буквально глагол означает «брошу, отброшу». В данном контексте «отвергну» сохраняет резкость образа и естественно выражает прекращение поддержки со стороны Премудрости.
- source_word: וְאַסְגִּירֶנּוּ
  choice: и отдам
  rationale: Порода глагола סגר здесь означает передачу человека во власть других. «Отдам» — ясный и современный русский эквивалент; объект власти назван далее.
- source_word: לַשֹׁדְדִים
  choice: грабителям
  rationale: Еврейское слово обозначает грабителей, разорителей или мародёров. «Грабителям» прямо и понятно передаёт смысл без архаического оттенка.
theological_decisions:
- issue: Расхождение еврейского текста и греческой параллели
  choice: 'В основном тексте: «отдам грабителям» согласно сохранившемуся еврейскому тексту.'
  alternative: «предаст его в руки его падения» или «отдаст его на погибель» согласно греческому тексту.
  rationale: При наличии надёжно засвидетельствованного еврейского текста Сираха он служит первичным основанием перевода. Греческое чтение существенно отличается и потому приведено в сноске, а не смешано с основным текстом.
translation_notes:
  register: Современный литературный русский язык; речь Премудрости передана от первого лица. Формулировка ясная и достойная, без архаизмов и конфессионально окрашенных уточнений.
