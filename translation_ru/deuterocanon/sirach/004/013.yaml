base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/013.yaml
  text: Those who hold fast to her will find honor from Yahweh[a], and they will be favored with the blessing of Yahweh.
translation:
  language: ru
  text: Те, кто крепко держатся за неё, обретут почёт от Яхве[a] и будут удостоены благословения Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Кто крепко держится её, унаследует славу, и, куда бы он ни вошёл, Господь благословит его». Еврейский текст гласит: «обретут почёт от Яхве» и «будут удостоены благословения Яхве».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְתֹמְכֶיהָ
  choice: те, кто крепко держится её
  rationale: Глагол תמך означает «поддерживать, удерживать». В контексте олицетворённой Премудрости выражение передаёт твёрдую приверженность ей; это подтверждает и греческое ὁ κρατῶν αὐτῆς.
- source_word: יִמְצְאוּ
  choice: обретут
  rationale: Передаёт прямое значение «найдут» естественным для современного русского оборотом «обретут почёт», не следуя отличающемуся греческому чтению «унаследует».
- source_word: כָבוֹד
  choice: почёт
  rationale: В данном контексте слово обозначает честь и высокое положение, даруемые Богом. «Слава» возможна, особенно с учётом греческого δόξαν, но «почёт» точнее передаёт вероятный смысл еврейского текста.
- source_word: מֵיהֹוָה
  choice: от Яхве
  rationale: Предлог מן передан словом «от», а тетраграмматон — личным именем «Яхве».
- source_word: וְיֻחַנּוּ
  choice: будут одарены
  rationale: Пассивная форма от חנן выражает оказанное благоволение. «Будут одарены» сохраняет пассивность и естественно сочетается в русском языке с последующим «благословением».
- source_word: בְּבִרְכַּת יְהֹוָה
  choice: благословением Яхве
  rationale: Предлог ב допускает инструментальное или сопроводительное значение. Творительный падеж сохраняет эту связь, не сужая её до единственного толкования.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: В еврейском тексте дважды стоит тетраграмматон; его передача как «Яхве» сохраняет личное имя и соответствует предоставленному редакционному решению.
- issue: Соотношение еврейского текста и отличающегося греческого параллельного чтения
  choice: Основной текст следует ясному еврейскому свидетельству, а греческое чтение приводится в сноске
  alternative: Внести греческие формулировки «унаследует славу» и «куда бы он ни вошёл» в основной текст
  rationale: Указанный еврейский источник имеет высокую степень надёжности и подтверждён; греческая версия представляет значимое, но отличающееся чтение, которое следует сохранить, не смешивая тексты.
translation_notes:
  register: Современный литературный русский язык с достоинством, подобающим библейскому тексту. Множественное число еврейского текста сохранено; местоимение «её» относится к олицетворённой Премудрости из контекста. Формулировка избегает архаизма и чрезмерно конфессиональной лексики.
