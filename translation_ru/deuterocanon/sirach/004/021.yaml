  text: For there is a shame that bears iniquity[b][a], and there is a shame that is glory and favor.
translation:
  language: ru
  text: Ибо есть стыд, влекущий за собой вину[a], и есть стыд, приносящий честь и благоволение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение сжато и может также означать «несущий беззаконие»; греческий текст: «ведущий ко греху».'
    reason: alternative_reading
lexical_decisions:
- source_word: בֹּשֶׁת
  choice: стыд
  rationale: Сохраняет нравственный и общественный смысл еврейского слова и точно передаёт противопоставление двух видов стыда; «смущение» было бы слишком слабым.
- source_word: מַשְׂאֵת עָוֹן
  choice: навлекающий вину
  rationale: Сжатое еврейское выражение допускает оттенок несения вины; причастный оборот естественен по-русски и, с учётом греческого параллельного текста, передаёт отрицательное следствие такого стыда, не сводя עָוֹן только к самому греховному поступку.
- source_word: עָוֹן
  choice: вина
  rationale: В данном контексте слово может обозначать виновность или последствие проступка; «вина» ясно выражает нравственное следствие.
- source_word: כָּבוֹד
  choice: честь
  rationale: В контрасте со стыдом социально-нравственное значение «честь» звучит по-русски естественнее, чем «слава», оставаясь в пределах значения еврейского слова.
- source_word: חֵן
  choice: благоволение
  rationale: Передаёт одобрение и расположение, не внося без необходимости более поздних богословских ассоциаций слова «благодать».
theological_decisions:
- issue: Толкование сжатого выражения מַשְׂאֵת עָוֹן
  choice: Один вид стыда навлекает вину
  alternative: Один вид стыда ведёт ко греху; стыд от несения беззакония
  rationale: 'Еврейский текст остаётся основным: оборот связан с виной/беззаконием и допускает значение несения или навлечения. Греческое ἐπάγουσα ἁμαρτίαν подтверждает направленность к отрицательному нравственному следствию. Сноска сохраняет реальную неоднозначность.'
- issue: Передача положительной пары כָּבוֹד וָחֵן
  choice: честь и благоволение
  alternative: слава и благодать
  rationale: Выбранный вариант сохраняет общественно-нравственный смысл и не придаёт выражению специального конфессионального оттенка.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура оригинала сохранена. Повтор «есть стыд» удерживает параллелизм двух частей стиха.
