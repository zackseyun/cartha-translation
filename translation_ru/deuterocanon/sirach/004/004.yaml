    rationale: Это не выражено прямо в מִמִּסְכֵּנֶךָ. Суффикс «твой» может указывать на обращённость бедняка к адресату или на его сферу отношений, но не требует вывода о специальной ответственности.
  - severity: low
    issue: «Не пренебрегай просьбами» несколько ослабляет значение בזה.
    rationale: Глагол означает презирать, относиться с пренебрежением. Явное «не относись с презрением» точнее передаёт нравственную окраску, при этом по-русски естественно.
