  text: Do not withhold a gift from your poor man[a], and do not despise the request of the poor, nor give him occasion to curse you.
translation:
  language: ru
  text: Не отказывай нуждающемуся в даре[a], не относись с презрением к просьбам бедного и не давай ему повода проклясть тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте буквально: «не удерживай дара от твоего бедняка»; «твоего» передаёт суффикс второго лица и не обязательно предполагает собственность или особый юридический статус. Греческий вариант короче: «Не отказывай просителю, терпящему бедствие, и не отворачивай лица своего от бедного»; заключительной фразы о поводе для проклятия в нём нет.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: Не удерживай
  rationale: Прямо передаёт значение מנע — удерживать, не давать — и сохраняет нравственную силу запрета.
- source_word: מַתָּן
  choice: дара
  rationale: Нейтрально и прямо передаёт существительное со значением «дар, даяние», не сужая его до милостыни.
- source_word: מִמִּסְכֵּנֶךָ
  choice: от бедняка, за которого ты в ответе
  rationale: «Бедняк» передаёт значение מסכן, а пояснительная формулировка сохраняет значимый суффикс второго лица («твой»), не создавая по-русски впечатления владения человеком.
- source_word: וְלֹא תִבְזֶה
  choice: не пренебрегай
  rationale: В контексте просьб естественно выражает значение «считать незначительным, презирать»; буквальное «не презирай просьбы» по-русски менее естественно.
- source_word: שְׁאֵלוֹת דָּל
  choice: просьбами нуждающегося
  rationale: Множественное число שאלות сохранено; דל передано как «нуждающийся», что естественно обозначает бедного и уязвимого человека.
- source_word: וְלֹא תִתֵּן לוֹ מָקוֹם
  choice: и не давай ему повода
  rationale: Идиоматически передаёт буквальное «не давай ему места», то есть не создавай основания или случая для последующего действия.
- source_word: לְקַלְלֶךָ
  choice: проклясть тебя
  rationale: Прямо сохраняет значение глагола קלל и напряжённость предупреждения.
theological_decisions:
- issue: Полный еврейский текст и более краткое греческое чтение
  choice: Основной текст следует сохранившемуся еврейскому свидетельству, включая заключительную фразу о проклятии.
  alternative: 'Греческий текст: «Не отказывай просителю, терпящему бедствие, и не отворачивай лица своего от бедного».'
  rationale: При наличии надёжного еврейского текста он служит основой перевода; греческое свидетельство важно как древний вариант и приводится в сноске без смешения двух форм текста.
- issue: Значение притяжательного суффикса в מִמִּסְכֵּנֶךָ
  choice: 'Передать как отношение ответственности: «бедняка, за которого ты в ответе».'
  alternative: Буквальное «твоего бедняка» или более нейтральное «нуждающегося».
  rationale: Формулировка сохраняет обращённость обязанности к адресату, не внушая идеи собственности и не вводя узкой конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Повелительные формы единственного числа сохраняют грамматику еврейского обращения. Лексика не архаизирована; синтаксис следует трёхчастной структуре еврейского стиха.
