  rationale: Исправление устраняет неоправданно конкретное толкование суффикса «твой», сохраняя его как текстологически значимую деталь в сноске. Основной текст следует полному еврейскому свидетельству; сноска корректно фиксирует более краткий греческий параллельный текст и его отсутствие заключительной клаузы.
