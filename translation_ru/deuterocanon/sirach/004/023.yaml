translation:
  language: ru
  text: Не удерживай ни слова в мире[a] и не скрывай своей мудрости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Не препятствуй слову во время избавления» (или «спасения»). В сохранившемся еврейском тексте сказано: «в мире».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּמְנַע
  choice: Не удерживай
  rationale: Глагол מנע означает «удерживать, не давать, утаивать». Выбранный вариант сохраняет прямой запрет и естественно сочетается со «словом».
- source_word: דִּבֵּר
  choice: слова
  rationale: Форма указывает на речь или слово; конкретное единственное число сохраняет краткость еврейского выражения и соответствует греческому λόγον.
- source_word: בָּעוֹלָם
  choice: в мире
  rationale: Сохраняется необычное, но ясно засвидетельствованное чтение еврейского текста. Переводы вроде «вовремя» или «на людях» были бы истолкованием и устранили бы расхождение с греческой традицией.
- source_word: וְאַל תַּצְפִּין
  choice: и не скрывай
  rationale: Глагол צפן в данной форме передаёт сокрытие или утаивание. «Не скрывай» звучит естественно и точно продолжает наставление.
- source_word: אֶת חָכְמָתֶךָ
  choice: своей мудрости
  rationale: חכמה передано обычным и богословски нейтральным словом «мудрость». Возвратное местоимение естественно по-русски обозначает мудрость того же адресата.
theological_decisions:
- issue: Расхождение еврейского и греческого текстов в первой части стиха
  choice: 'Основной текст следует еврейскому чтению: «Не удерживай слова в мире»'
  alternative: 'Греческий параллельный текст: «Не препятствуй слову во время избавления (или спасения)»'
  rationale: Сохранившийся еврейский свидетель имеет приоритет, однако существенное расхождение с греческим текстом не сглаживается и отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, наставительным и достойным звучанием. Необычное выражение «в мире» намеренно сохранено по еврейскому источнику; различие с греческим текстом вынесено в сноску.
