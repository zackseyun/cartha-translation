translation:
  language: ru
  text: Не проявляй пристрастия себе во вред[a] и не спотыкайся о собственные препятствия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «не поднимай своего лица против собственной души». Еврейский оборот означает пристрастие или особое благоволение; греческий параллельный текст также передаёт его как пристрастие, направленное против самого себя.'
    reason: idiom_and_ambiguity
  - marker: b
    text: 'Еврейский текст можно передать буквальнее: «не спотыкайся о свои препятствия». В греческом параллельном тексте: «не стыдись до своего падения».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּשָּׂא פָנֶיךָ
  choice: Не проявляй пристрастия
  rationale: Еврейское выражение נשא פנים буквально связано с «поднятием лица», но идиоматически означает проявление благосклонности или пристрастия. Современная русская формулировка передаёт этический смысл без буквального семитизма.
- source_word: עַל נַפְשֶׁךָ
  choice: себе во вред
  rationale: נפש здесь обозначает самого человека, а על придаёт предупреждению парадоксальный смысл направленности против себя. «Себе во вред» естественно выражает этот смысл по-русски и согласуется с греческим κατὰ τῆς ψυχῆς σου.
- source_word: וְאַל תִּכָּשֵׁל
  choice: и не спотыкайся
  rationale: Масоретизированная еврейская форма происходит от כשל — «спотыкаться, оступаться». Основной текст следует высоконадёжному еврейскому свидетельству; отличающееся греческое чтение отмечено в сноске.
- source_word: לְמִכְשׁוֹלֶיךָ
  choice: о собственные препятствия
  rationale: מכשול может обозначать препятствие, камень преткновения или причину падения. Перевод сохраняет образ и намеренную созвучность с глаголом כשל, оставаясь понятным по-русски.
