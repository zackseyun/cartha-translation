translation:
  language: ru
  text: Не унижай себя перед глупцом[a] и не проявляй лицеприятия к правителям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «не расстилай перед глупцом самого себя (свою душу)»; греческий параллельный текст также сохраняет образ человека, который словно стелется перед другим.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская форма здесь не вполне ясна и может быть понята иначе, например как «не доверяй». Греческий параллельный текст: «не принимай лица властителя», то есть не оказывай ему пристрастного предпочтения; отсюда перевод «не проявляй лицеприятия к правителям».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּצַּע ... נַפְשֶׁךָ
  choice: Не унижай себя
  rationale: Глагол יצע буквально означает «расстилать, укладывать», а נֶפֶשׁ здесь обозначает самого человека. Греческое ὑποστρώσῃς σεαυτόν подтверждает метафору человека, который словно стелется перед другим; естественный русский эквивалент — «унижать себя».
- source_word: לְנָבָל
  choice: перед глупцом
  rationale: נָבָל обозначает глупца прежде всего в нравственном смысле. «Перед» естественно передаёт социальную направленность унизительного поведения.
- source_word: וְאַל תַּאֲמֵן
  choice: и не угождай
  rationale: Изолированная еврейская форма допускает иное понимание, в частности связь со значением «доверять», однако греческое μὴ λάβῃς πρόσωπον указывает на лицеприятное расположение к сильному. «Не угождай» естественно выражает предостережение против заискивания перед властью, не превращая строку в узко судебное предписание.
- source_word: לִפְּנֵי מוֹשְׁלִים
  choice: правителям
  rationale: מוֹשְׁלִים — люди, обладающие властью. При русском глаголе «угождать» значение направленности, выраженное לִפְּנֵי, естественно передаётся дательным падежом.
theological_decisions:
- issue: 'Неясность второго полустишия: еврейское תַּאֲמֵן не вполне прозрачно и формально может быть связано со значением «доверять», тогда как греческий параллельный текст говорит о принятии лица властителя.'
  choice: Передать как предостережение не угождать правителям.
  alternative: «не доверяй правителям» или «не проявляй лицеприятия перед правителями»
  rationale: Греческий параллельный текст поддерживает смысл пристрастного расположения к влиятельному лицу. В сочетании с первым полустишием речь, вероятно, идёт о самоуничижительном заискивании перед людьми; сноска сохраняет реальную текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык, краткая афористическая форма. «Глупец» сохраняет нравственную окраску исходного слова, а «угождать правителям» звучит естественно и передаёт социальное заискивание; неоднозначность еврейского второго полустишия вынесена в сноску.
