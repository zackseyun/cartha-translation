translation:
  language: ru
  text: Склони ухо к бедному[a] и ответь ему мирно, со смирением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Стань любимым в собрании и склони голову перед вельможей». Здесь греческий текст отражает существенно иную текстовую форму, чем сохранившийся еврейский.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַט
  choice: Склони
  rationale: Повелительная форма глагола נטה означает «наклони, обрати». В сочетании с «ухо» русский глагол «склони» сохраняет образ внимательного слушания и звучит ясно и достойно.
- source_word: לֶעָנִי
  choice: к бедному
  rationale: Слово עני может обозначать бедного, нуждающегося или угнетённого человека. «Бедному» — прямой и естественный вариант, соответствующий контексту заботы о социально уязвимом.
- source_word: אָזְנֶךָ
  choice: ухо
  rationale: Сохранён конкретный образ части тела, поскольку выражение «склонить ухо» понятно по-русски и передаёт внимательное слушание.
- source_word: וַהֲשִׁיבֵהוּ
  choice: и ответь ему
  rationale: В данном контексте форма глагола שוב в породе hифиль обозначает ответ или отклик; это значение непосредственно продолжает призыв выслушать бедного.
- source_word: שָׁלוֹם
  choice: мирно
  rationale: Здесь שָׁלוֹם употреблено обстоятельственно и характеризует ответ как мирный, доброжелательный. «Мирно» сохраняет связь с понятием мира и естественно звучит по-русски.
- source_word: בַּעֲנָוָה
  choice: со смирением
  rationale: ענוה означает смирение или кротость. «Со смирением» ясно передаёт требуемую нравственную установку, не сводя её лишь к мягкости тона.
theological_decisions:
- issue: Выбор основного текстового свидетельства при существенном расхождении еврейского и греческого текстов
  choice: Основной текст переведён непосредственно с сохранившегося еврейского текста; греческая параллель приведена в сноске.
  alternative: 'Греческий текст: «Стань любимым в собрании и склони голову перед вельможей».'
  rationale: При наличии надёжно засвидетельствованного еврейского текста Сираха он служит основой перевода. Греческая версия отражает здесь существенно иную текстовую форму, а не простое лексическое различие, поэтому она не подменяет основной текст, но сохраняется для прозрачности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным библейским звучанием. Образ «склони ухо» сохранён как прозрачная метафора внимательного слушания; синтаксис краток и соответствует форме наставления.
