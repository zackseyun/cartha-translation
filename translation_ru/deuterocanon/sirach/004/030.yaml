  language: ru
  text: Не прослыви двуличным[a] и не приучай свой язык к такой речи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обладателем двух [вещей]»; вероятно, это выражение означает человека с двойственной или лживой речью.'
