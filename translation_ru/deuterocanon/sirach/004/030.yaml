lexical_decisions:
- source_word: אַל תִּקָּרֵא
  choice: Не слыви
  rationale: Нифаль глагола קרא передаёт значение «называться, быть известным как». Русское «не слыви» естественно и кратко выражает предостережение о репутации.
- source_word: בַּעַל שְׁתַּיִם
  choice: двуличным
  rationale: 'Буквально: «обладатель двух [вещей]». В связи со следующим упоминанием языка это, вероятно, обозначение двойственной, неискренней речи. «Двуличным» ясно передаёт смысл, тогда как буквальное выражение по-русски было бы непонятно.'
- source_word: וְאֶל לְשׁוֹנְךָ אַל תַּרְגֵּל
  choice: и не приучай к этому свой язык
  rationale: Глагол רגל здесь означает приучать, вырабатывать привычку. Местоименное «к этому» сохраняет направленность предлога и соотносит вторую строку с только что названной двойственностью; образ языка сохранён буквально.
