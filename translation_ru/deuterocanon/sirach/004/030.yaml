translation_notes:
  register: Современный литературный русский язык с кратким наставительным звучанием. «Не слыви» несколько возвышенно, но общеупотребительно и соответствует форме еврейского пассива. Неясность идиомы раскрыта в сноске, а существенно отличающийся греческий вариант отмечен отдельно.
