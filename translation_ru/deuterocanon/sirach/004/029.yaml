translation:
  language: ru
  text: До самой смерти борись за праведность[a], и Яхве будет сражаться за тебя.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за справедливость». Еврейское צֶדֶק может означать «праведность» или «справедливость».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте здесь стоит иное предложение: «Не будь резок на язык, а в делах — медлителен и нерадив». Основной текст переведён по еврейскому свидетельству Каирской генизы.'
    reason: textual_variant
lexical_decisions:
- source_word: עַד הַמָּוֶת
  choice: до самой смерти
  rationale: Оборот обозначает предельную стойкость в борьбе. Частица «самой» естественно передаёт усилительную силу выражения, не утверждая прямо, что речь непременно идёт о мученической смерти.
- source_word: הִנָּצֵה
  choice: борись
  rationale: Возвратно-повелительная форма выражает вступление в борьбу или спор. «Борись» звучит естественно и сохраняет связь с военным образом следующей части стиха, не сужая смысл до физического боя.
- source_word: עַל הַצֶּדֶק
  choice: за праведность
  rationale: צֶדֶק охватывает нравственную правоту, праведность и справедливость. В основном тексте выбрана «праведность» как широкое этическое понятие языка Премудрости; существенная альтернатива отмечена в сноске.
- source_word: וַיהֹוָה
  choice: и Яхве
  rationale: Передано собственное имя Бога, непосредственно представленное тетраграмматоном в еврейском тексте.
- source_word: נִלְחָם לָךְ
  choice: будет сражаться за тебя
  rationale: Причастная форма в контексте повеления естественно выражает последующее или обещанное действие. «Сражаться за тебя» сохраняет военную метафору и параллелизм с первым полустишием.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст прямо содержит тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
- issue: Значение צֶדֶק
  choice: праведность
  alternative: справедливость / правда
  rationale: В контексте наставления слово может обозначать как широкую нравственную праведность, так и справедливость. Основной вариант не ограничивает смысл судебно-общественной сферой, а неоднозначность сохранена в сноске.
- issue: Характер обещания נִלְחָם לָךְ
  choice: будет сражаться за тебя
  alternative: сражается за тебя
  rationale: После повеления причастие естественно воспринимается как обещанный результат, однако формально может описывать и настоящее, характерное действие. Будущее время лучше передаёт ход увещания, не добавляя условия, которого в тексте нет.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным увещательным тоном. Повтор образа борьбы («борись» — «будет сражаться») намеренно сохраняет параллелизм еврейского текста. Формулировка понятна широкому читателю и не вводит конфессионально специфической терминологии.
