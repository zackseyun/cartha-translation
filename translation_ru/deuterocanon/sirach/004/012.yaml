  text: Those who love her love life[a], and those who seek her will obtain favor from Yahweh.
translation:
  language: ru
  text: Любящие её любят жизнь, а ищущие её обретут благоволение Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Кто любит её, тот любит жизнь, а те, кто с раннего утра стремится к ней, исполнятся радости».'
    reason: Альтернативное чтение греческой текстовой традиции, особенно во второй части стиха.
lexical_decisions:
- source_word: אֹהֲבֶיהָ
  choice: любящие её
  rationale: Причастная форма с суффиксом 3-го лица женского рода указывает на Премудрость в контексте; субстантивированное «любящие её» естественно передаёт множественное число.
- source_word: אָהֲבוּ חַיִּים
  choice: любят жизнь
  rationale: Хотя глагол формально имеет перфектную форму, в афористическом высказывании она выражает общую истину; настоящее время по-русски звучит естественно. Греческий параллельный текст также имеет настоящее время.
- source_word: וּמְבַקְשֶׁיהָ
  choice: а ищущие её
  rationale: בקש означает «искать». Усиление вроде «усердно» не добавлено, поскольку его нет в сохранившемся еврейском тексте.
- source_word: יָפִיקוּ
  choice: обретут
  rationale: В сочетании с רָצוֹן глагол передаёт достижение или получение благосклонности; «обретут» ясно и достойно звучит в русском афористическом стиле.
- source_word: רָצוֹן
  choice: благоволение
  rationale: При конструкции с מן и Божьим именем слово обозначает благосклонность, благоприятное отношение или принятие; «благоволение» сохраняет богословскую и стилистическую ёмкость.
- source_word: מֵיהֹוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה в принятой современной русской форме, не заменяя его титулом.
theological_decisions:
- issue: Расхождение еврейского и греческого текстов во второй части стиха
  choice: 'Следовать сохранившемуся еврейскому чтению: «ищущие её обретут благоволение Яхве»'
  alternative: 'Греческий параллельный текст: «те, кто с раннего утра стремится к ней, исполнятся радости»'
  rationale: Сохранившийся еврейский текст ясен и имеет высокую степень надёжности, поэтому положен в основу основного текста. Существенно отличающееся греческое чтение сохранено в сноске, чтобы не скрывать текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным афористическим строем. Женское местоимение сохраняет связь с Премудростью из контекста. Синтаксический параллелизм еврейского текста передан двумя причастными оборотами.
