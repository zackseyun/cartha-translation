  text: If he trusts her, he will inherit her, and his descendants will possess her.[a]
translation:
  language: ru
  text: Ведь я пойду с ним, словно чужая, и поначалу подвергну его испытаниям.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции этот стих читается иначе: «Если он доверится ей, то унаследует её, и его потомки будут владеть ею».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְהִתְנַכֵּר
  choice: словно чужая
  rationale: Форма от נכר передаёт притворное отчуждение или поведение чужака. В контексте олицетворённой Премудрости естественное русское выражение «словно чужая» сохраняет образ, не сводя его к буквальной маскировке.
- source_word: אֵלֵךְ עִמּוֹ
  choice: я пойду с ним
  rationale: Сохранены первое лицо и образ совместного пути. Женский род подразумевается из контекста, где говорит олицетворённая Премудрость.
- source_word: וּלְפָנִים
  choice: и поначалу
  rationale: Здесь выражение указывает на начальный этап отношений Премудрости с учеником; «поначалу» естественно передаёт временной смысл.
- source_word: אֶבְחָרֶנּוּ בְנִסְיוֹנוֹת
  choice: подвергну его испытаниям
  rationale: Хотя בחר обычно означает «избирать», в данном сочетании и контексте оно имеет смысл проверки или испытания. Русская формулировка избегает тяжёлого повтора «испытаю испытаниями».
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческой традиции
  choice: Основной текст переведён по предоставленному еврейскому свидетельству; греческое чтение вынесено в примечание.
  alternative: «Если он доверится ей, то унаследует её, и его потомки будут владеть ею».
  rationale: Еврейский источник отмечен как высоконадёжный и потому имеет первенство для основного текста, даже если его формулировка может отражать иной раздел стихов или отличающуюся текстовую традицию. Существенное греческое чтение сохранено открыто, без попытки искусственно согласовать обе версии.
translation_notes:
  register: Современный литературный русский язык; речь олицетворённой Премудрости передана в первом лице и женском роде. Формулировка сохраняет образ её первоначальной отчуждённости и последующих испытаний, оставаясь понятной без архаизмов.
