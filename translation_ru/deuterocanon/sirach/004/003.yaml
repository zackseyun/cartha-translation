  text: Do not embitter the inward parts of the poor[a], and do not cause pain to the heart of the needy.
translation:
  language: ru
  text: Не наполняй горечью душу бедняка[a] и не причиняй боли сердцу нуждающегося.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «внутренности бедняка»; в еврейской образности внутренности считались средоточием глубоких чувств. В греческом параллельном тексте стоит «сердце».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְמִיר
  choice: наполняй горечью
  rationale: Передаёт каузативный смысл корня חמר в данном контексте — «делать горьким, причинять горечь» — и естественно сочетается в русском языке с обозначением внутренней жизни человека.
- source_word: מְעֵי
  choice: душу
  rationale: Буквально слово обозначает «внутренности», которые в еврейской образности считались средоточием глубоких чувств. Русское «душу» естественно передаёт этот антропологический смысл; конкретный образ сохранён в примечании.
- source_word: דָךְ
  choice: бедняка
  rationale: Слово обозначает слабого, сокрушённого или бедного человека. «Бедняк» ясно выражает социальную уязвимость в данном наставлении.
- source_word: קֶרֶב
  choice: сердцу
  rationale: Буквально «внутренность, внутренняя часть»; здесь, в поэтическом параллелизме, речь идёт о внутренней эмоциональной жизни. «Сердце» — естественный русский эквивалент, согласующийся также с греческим параллельным текстом.
- source_word: עָנִי
  choice: нуждающегося
  rationale: Слово может означать бедного, угнетённого или страждущего. «Нуждающийся» сохраняет социальный смысл и позволяет не повторять механически «бедняка».
- source_word: תַּכְאִיב
  choice: не причиняй боли
  rationale: Прямо передаёт каузативное значение корня כאב — «заставлять испытывать боль, причинять боль».
theological_decisions:
- issue: Передача еврейской антропологической образности
  choice: В первом полустишии употребить естественное русское «душу», отметив буквальное «внутренности» в сноске; во втором — «сердцу».
  alternative: Сохранить в основном тексте буквальное «внутренности» или передать оба выражения словом «сердце».
  rationale: Еврейские מְעֵי и קֶרֶב относятся к внутренней жизни человека, но не являются тождественными словами. Перевод «душа… сердце» сохраняет вариативность поэтического параллелизма и остаётся понятным современному читателю, а сноска не скрывает конкретный образ первичного еврейского свидетельства.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-поэтический. Формулировка сохраняет параллелизм двух запретов и различает «бедняка» и «нуждающегося», не превращая их в разные категории людей.
