translation:
  language: ru
  text: И Бог назовёт тебя сыном[a], окажет тебе милость и избавит тебя от ямы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «и будешь как сын Всевышнего, и Он возлюбит тебя больше, чем твоя мать». Еврейское свидетельство вместо этого читает: «И Бог назовёт тебя сыном, окажет тебе милость и избавит тебя от ямы».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵל
  choice: И Бог
  rationale: אל здесь естественно понимать как обычное обозначение Бога; это также согласуется с греческим упоминанием Всевышнего.
- source_word: יִקְרָאֲךָ בֵּן
  choice: назовёт тебя сыном
  rationale: Передаёт буквальный смысл еврейского выражения без добавления отсутствующего в тексте притяжательного местоимения «своим».
- source_word: וְיָחְנְךָ
  choice: явит тебе милость
  rationale: Глагол חנן означает благосклонно отнестись, оказать милость; выбранная формулировка сохраняет возвышенный, но понятный современный регистр.
- source_word: וְיַצִּילְךָ
  choice: и избавит тебя
  rationale: נצל обозначает избавление или спасение от опасности; «избавит» естественно сочетается с последующим указанием на то, от чего Бог избавляет.
- source_word: מִשָׁחַת
  choice: от могилы
  rationale: שחת может означать яму, могилу или гибель. В данном обещании «могила» ясно передаёт образ смерти, не сводя его к идее окончательного осуждения.
theological_decisions:
- issue: Божественное именование праведного попечителя сыном
  choice: Бог назовёт тебя сыном
  alternative: ты будешь как сын Всевышнего
  rationale: Сохранившийся еврейский текст прямо говорит, что Бог назовёт адресата сыном; греческий текст смягчает это сравнением. Основной перевод следует еврейскому свидетельству, а греческое чтение приводится в сноске, чтобы не устранять текстологическое и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис прост и доступен; мужской род «сыном» сохранён по форме еврейского оригинала.
