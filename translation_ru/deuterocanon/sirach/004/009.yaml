translation:
  language: ru
  text: Будь сиротам как отец, а вдовам — вместо мужа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте — существенно иное чтение: «Спасай обиженного из руки обидчика и не робей, когда судишь». Вероятно, оно отражает другую текстовую форму этого стиха.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֵה כְאָב
  choice: Будь… как отец
  rationale: Императив הֱיֵה передан как «будь», а сравнительная частица כְ — как «как»; тем самым сохраняется образное уподобление, а не буквальное присвоение роли отца.
- source_word: לִיתוֹמִים
  choice: сиротам
  rationale: יתומים обозначает детей, лишившихся отца или родителей; современное русское «сиротам» ясно и естественно.
- source_word: וּתְמוּר
  choice: а… вместо
  rationale: תמור выражает замещение. «Вместо» кратко и точно передаёт мысль о принятии на себя отсутствующей семейной роли; союз «а» естественно связывает параллельные части наставления.
- source_word: בַּעַל
  choice: мужа
  rationale: В сочетании со вдовами בַּעַל означает мужа, а не господина или владельца.
- source_word: לְאַלְמָנוֹת
  choice: вдовам
  rationale: אלמנות однозначно означает вдов; дательный падеж сохраняет параллелизм с «сиротам».
- source_word: ἐξελοῦ ἀδικούμενον ἐκ χειρὸς ἀδικοῦντος, καὶ μὴ ὀλιγοψυχήσῃς ἐν τῷ κρίνειν σε
  choice: не включено в основной текст; приведено в сноске
  rationale: Греческий текст существенно отличается от сохранившегося еврейского и, вероятно, представляет иную текстовую форму стиха. При наличии надёжного еврейского свидетельства основной текст следует ему.
theological_decisions:
- issue: Расхождение между сохранившимся еврейским текстом Сираха и греческим параллельным свидетельством
  choice: 'Следовать еврейскому чтению: призыв стать сиротам как отец, а вдовам — вместо мужа'
  alternative: 'Следовать греческому чтению: «Спасай обиженного из руки обидчика и не робей, когда судишь»'
  rationale: Еврейский текст этого стиха сохранился, имеет высокую степень уверенности и подтверждён проверкой, поэтому положен в основу перевода. Существенно отличающееся греческое чтение сохранено в сноске как подлинное текстовое свидетельство, без попытки искусственно согласовать обе формы.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной и легко понятной формулировкой. Эллипсис «вдовам — вместо мужа» сохраняет параллелизм еврейской строки и избегает тяжеловесного повтора глагола.
