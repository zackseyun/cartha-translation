  text: For if he cries out against you in the bitterness of his soul, his Maker will hear his plea.[a][b]
translation:
  language: ru
  text: Ибо если он в горечи души своей проклянёт тебя, Творец его услышит его мольбу.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сохранившаяся еврейская строка из Каирской генизы, приведённая для этого места, не соответствует греческому тексту данного стиха; поэтому основной перевод здесь следует греческому свидетельству.
    reason: textual_variant
  - marker: b
    text: 'Или: «призовёт суд на тебя» вместо «проклянёт тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καραμένου
  choice: воззовёт против тебя
  rationale: Греческое причастие передаёт направленное против адресата обращение — жалобу или призыв к суду. «Воззовёт против тебя» сохраняет как враждебную направленность, так и молитвенно-судебный оттенок.
- source_word: ἐν πικρίᾳ ψυχῆς αὐτοῦ
  choice: в горечи своей души
  rationale: Близкий к форме источника перевод сохраняет эмоциональную и нравственную силу выражения, а также образ «души», не сводя его к сердцу или настроению.
- source_word: δέησις
  choice: мольба
  rationale: «Мольба» естественно передаёт настоятельное прошение страдающего и допускает одновременно молитвенный и судебный оттенки.
- source_word: ἐπακούσεται
  choice: услышит
  rationale: Глагол обозначает благосклонное слушание; «услышит» не делает подразумеваемый ответ явным и потому не переистолковывает источник.
- source_word: ὁ ποιήσας αὐτόν
  choice: Творец его
  rationale: Кратко и весомо передаёт «Тот, кто создал его» и сохраняет богословский акцент на Боге как Создателе угнетённого.
theological_decisions:
- issue: Выбор основного источника при несоответствии сохранившейся еврейской строки
  choice: Основной перевод выполнен по греческому параллельному свидетельству, а расхождение с приведённым еврейским текстом отмечено в сноске.
  alternative: 'Перевести приведённую еврейскую строку: «Полюби свою жизнь ради общины и ещё ниже склони голову перед властью».'
  rationale: Приведённая еврейская строка не соответствует содержанию данного стиха в греческой традиции и, вероятно, относится к иному месту либо представлена здесь со смещением. Греческий текст даёт связное чтение в контексте наставления об отношении к бедному; неопределённость текстовой традиции сохранена открыто.
translation_notes:
  register: Современный литературный русский язык с достоинством премудростной речи. Синтаксис сохраняет причинную связь и образность греческого текста; «воззовёт» и «мольба» слегка возвышенны, но понятны широкому читателю.
