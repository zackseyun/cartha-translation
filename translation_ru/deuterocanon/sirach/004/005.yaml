base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/005.yaml
  text: One crying out in bitter spirit and in the pain of his soul[a], and at the sound of his cry, his Rock will hear.
translation:
  language: ru
  text: Того, кто взывает в горечи духа и в боли своей души, услышит его Скала по голосу его вопля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Не отводи глаз от просящего и не давай человеку повода проклясть тебя». Еврейский текст вместо этого подчёркивает, что Скала страдальца услышит его вопль.'
    reason: alternative_reading
lexical_decisions:
- source_word: צוֹעֵק
  choice: взывающий
  rationale: Причастие изображает человека в самом действии настойчивого крика или мольбы; субстантивированное «взывающий» сохраняет незавершённость еврейской фразы, не добавляя отсутствующего в еврейском тексте запрета.
- source_word: מַר רוּחַ
  choice: в горечи духа
  rationale: Передаёт внутреннюю горечь и сохраняет образный язык оригинала; формулировка остаётся понятной и возвышенной.
- source_word: בִּכְאֵב נַפְשׁוֹ
  choice: в боли души своей
  rationale: נפש здесь обозначает внутреннее существо человека; «душа» сохраняет глубину личного страдания, не навязывая узкой антропологической трактовки.
- source_word: וּבְקוֹל צַעֲקָתוֹ
  choice: на голос его вопля
  rationale: Близко передаёт буквальный слуховой образ «при/на голос вопля»; «вопль» выражает силу צעקה.
- source_word: יִשְׁמַע
  choice: услышит
  rationale: Будущее время сохраняет предостерегающую, следственную направленность еврейского yiqtol.
- source_word: צוּרוֹ
  choice: его Скала
  rationale: Сохранён буквальный божественный эпитет «Скала», а прописная буква ясно указывает на Бога без устранения метафоры.
theological_decisions:
- issue: Соотношение еврейского текста и греческой параллели
  choice: Основной текст следует засвидетельствованному еврейскому чтению без добавления начального запрета; отличающееся греческое чтение приведено в сноске.
  alternative: «Не отводи глаз от просящего и не давай человеку повода проклясть тебя».
  rationale: Еврейский свидетель имеет заявленный высокий уровень надёжности и прямо говорит о страдальце, чей вопль услышит его Скала. Греческая параллель существенно отличается и потому не должна незаметно дополнять основной текст.
- issue: Значение נפש
  choice: душа
  alternative: жизнь; внутреннее существо; сам человек
  rationale: В сочетании с болью и горечью духа слово выражает глубочайшее внутреннее страдание; «душа» сохраняет многозначность и не сводит смысл к физической боли.
- issue: Божественный эпитет צור
  choice: Скала
  alternative: Бог; Творец; Защитник
  rationale: Сохранение метафоры передаёт богословски значимый язык еврейского текста, не подменяя его истолкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим книге Премудрости. Фрагментарное начало сохранено как особенность данного еврейского свидетельства; отсутствующий в нём императив из греческой версии не внесён в основной текст. Инверсия «души своей» и образ «Скала» поддерживают поэтический регистр без архаизации.
