  text: Wisdom has instructed her children[a], and she bears witness for all who have understanding in her.
translation:
  language: ru
  text: Премудрость наставила своих детей и свидетельствует в пользу всех, кто понимает её.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Премудрость возвысила себе сыновей и берёт под своё покровительство тех, кто ищет её». Сохранившийся еврейский текст гласит: «и свидетельствует в пользу всех, кто понимает её».'
    reason: alternative_reading
lexical_decisions:
- source_word: חָכְמוֹת
  choice: Премудрость
  rationale: Форма морфологически множественная, но здесь обозначает персонифицированную Премудрость в единственном числе; это подтверждается греческим Ἡ σοφία.
- source_word: לִמְּדָה
  choice: наставила
  rationale: Глагол למד означает «учить, наставлять». Совершенный вид передаёт еврейскую перфектную форму, а «наставила» соответствует стилю литературы Премудрости.
- source_word: בָנֶיהָ
  choice: своих детей
  rationale: בנים может обозначать как сыновей, так и детей вообще. В образе Премудрости-матери речь идёт о её последователях без необходимости ограничивать их мужским полом.
- source_word: וְתָעִיד
  choice: и свидетельствует
  rationale: Форма от עוד/העיד сохраняет значение свидетельства. Настоящее время по-русски естественно передаёт обобщающий характер изречения, не устраняя образ свидетельствующей Премудрости.
- source_word: לְכָל
  choice: в пользу всех
  rationale: Предлог ל при глаголе свидетельствования допускает направительное значение. «В пользу» естественно выражает вероятный благоприятный смысл свидетельства, хотя сама еврейская конструкция кратка.
- source_word: מְבִינִים בָּהּ
  choice: кто понимает её
  rationale: Причастие от בין обозначает понимающих или проницательных, а בָּהּ соотносит это понимание с Премудростью. Русское «понимает её» передаёт эту связь естественнее буквального «имеет понимание в ней».
theological_decisions:
- issue: Женская персонификация Премудрости
  choice: Сохранить Премудрость как лицо женского рода
  alternative: Передать חָכְמוֹת как отвлечённое понятие без персонификации
  rationale: Еврейская грамматика и образ её детей представляют Премудрость как женское лицо; греческий параллельный текст сохраняет ту же персонификацию.
- issue: Расхождение еврейского и греческого текста во второй части стиха
  choice: Следовать сохранившемуся еврейскому тексту и вынести греческое чтение в сноску
  alternative: 'Принять греческое чтение: «поддерживает тех, кто ищет её»'
  rationale: Для Сираха сохранившийся еврейский текст имеет приоритет. Существенно отличающееся греческое чтение сохраняется для прозрачности, но не заменяет основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для книги Премудрости. «Премудрость» сохраняет традиционную и понятную персонификацию; синтаксис сделан естественным без устранения юридического оттенка глагола «свидетельствует».
