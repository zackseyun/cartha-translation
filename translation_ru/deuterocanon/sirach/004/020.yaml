base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/020.yaml
  text: My son[a], keep the proper time and beware of evil[c][b], and do not be ashamed for your own soul.
translation:
  language: ru
  text: Сын мой, соблюдай подходящее время[a] и остерегайся зла[b]; не стыдись за свою душу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Дошедшая еврейская фраза неясна: в ней стоит הָמוֹן, обычно означающее «множество», «богатство» или «шум». В греческом параллельном тексте сказано просто: «соблюдай подходящее время».'
    reason: textual_variant
  - marker: b
    text: 'Возможный перевод с еврейского: «бойся зла»; греческий параллельный текст поддерживает смысл «остерегайся зла».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не стыдись за самого себя»; «не стыдись за свою жизнь». Еврейское נֶפֶשׁ и греческое ψυχή могут означать «душа», «сам человек» или «жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Прямое обращение в мужском роде и единственном числе; сохраняет форму еврейского текста и стиль наставительной литературы.
- source_word: עֵת הָמוֹן שְׁמֹר
  choice: соблюдай подходящее время
  rationale: עֵת означает «время, пора», а греческое καιρόν указывает на уместное, подходящее время. הָמוֹן в переданном еврейском тексте создаёт неясность и не имеет соответствия в греческом; это отмечено в сноске.
- source_word: וּפְחַד מִרָע
  choice: и остерегайся зла
  rationale: Буквальная форма допускает «бойся зла», однако греческое φύλαξαι ἀπὸ πονηροῦ ясно поддерживает предостережение беречься или остерегаться зла.
- source_word: וְאֶל נַפְשְׁךָ אַל תֵּבוֹשׁ
  choice: и не стыдись ради собственной души
  rationale: Сохраняется связь стыда с נֶפֶשׁ, которое может означать душу, самого человека или жизнь. «Ради» естественно передаёт трудную конструкцию אֶל, не устраняя её смысловой напряжённости.
theological_decisions:
- issue: Антропологический диапазон נַפְשְׁךָ / ψυχῆς σου
  choice: собственной души
  alternative: самого себя; собственной жизни
  rationale: «Душа» сохраняет внутренний и нравственный вес наставления, но не исключает значений «сам человек» и «жизнь»; они приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительной речи. Синтаксис краткий и афористичный; текстовая неясность и многозначность ключевых слов сохранены в сносках.
