  source_fidelity: 'Первая часть точно передаёт еврейский текст: הוֹשַׁע — «спаси/избавь», а мוּצָק ... מִמְּצִיקָיו — «угнетённого от его притеснителей». Во второй части «изнемогал» смещает קוץ к физическому или душевному истощению. В данном контексте слово обозначает досаду, тягость или нетерпение; это следует выразить прямо. «Когда судишь по справедливости» допустимо передаёт בְּמִשְׁפַט יֹשֶׁר.'
