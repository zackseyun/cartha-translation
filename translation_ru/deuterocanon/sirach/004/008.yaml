  text: Rescue the oppressed from his oppressors[a], and do not let your spirit grow impatient when judging rightly.
translation:
  language: ru
  text: Спаси угнетённого от его притеснителей[a] и не позволяй духу твоему терять терпение, когда судишь по справедливости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Приклони ухо своё к бедному и отвечай ему мирно, с кротостью». Еврейское свидетельство здесь говорит вместо этого о спасении угнетённого и о том, чтобы не терять терпения при справедливом суде.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשַׁע
  choice: Спаси
  rationale: Повелительная форма от ישׁע требует деятельного избавления. «Спаси» здесь естественно выражает срочную помощь человеку, находящемуся под гнётом, без необходимости придавать слову узко богословский смысл.
- source_word: מוּצָק
  choice: угнетённого
  rationale: Страдательное значение указывает на человека, подвергаемого давлению или притеснению; «угнетённый» ясно передаёт социально-правовой контекст.
- source_word: מִמְּצִיקָיו
  choice: от его притеснителей
  rationale: Форма родственна слову מוּצָק и обозначает тех, кто теснит или угнетает человека. «Притеснители» сохраняет эту корневую и смысловую связь.
- source_word: וְאַל תָּקוֹץ רוּחֲךָ
  choice: и не допускай, чтобы дух твой изнемогал
  rationale: קוץ допускает значения тяготиться, испытывать отвращение, терять терпение. В контексте правого суда формулировка передаёт внутреннее утомление и нежелание продолжать труд справедливого разбирательства, не сводя смысл только к раздражению.
- source_word: בְּמִשְׁפַט יֹשֶׁר
  choice: когда судишь по справедливости
  rationale: Сочетание связывает судебное действие с прямотой и справедливостью. Глагольная передача естественна по-русски и сохраняет практический характер наставления.
theological_decisions:
- issue: Значительное расхождение еврейского текста и греческой параллели
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; греческое чтение приведено в сноске.
  alternative: «Приклони ухо своё к бедному и отвечай ему мирно, с кротостью».
  rationale: Еврейское свидетельство здесь сохранилось и имеет приоритет как источник основного текста. Поскольку греческая традиция отличается не отдельными словами, а содержанием обеих частей стиха, её следует открыто сохранить как значимое разночтение, не смешивая две формы текста.
translation_notes:
  register: Современный литературный русский язык с достоинством премудростного наставления. Синтаксис остаётся ясным для широкого читателя; обращение во втором лице единственного числа и выражение «дух твой» сохраняют библейскую возвышенность без излишней архаизации.
