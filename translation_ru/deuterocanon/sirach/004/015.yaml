  text: Whoever listens to me will judge truly[b][a], and whoever gives ear to me will dwell securely in my inner chambers.
translation:
  language: ru
  text: Кто слушает меня, тот будет судить по правде[a], а кто внимает мне, тот будет жить в безопасности в моих внутренних покоях[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Кто повинуется ей, будет судить народы». Здесь еврейский и греческий тексты заметно расходятся; основной перевод следует сохранившемуся еврейскому чтению.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально еврейский текст говорит о «моих внутренних покоях», продолжая образ Премудрости как женщины, принимающей слушающего в свой дом. Конец фразы по-еврейски неясен; греческий текст передаёт общий смысл так: «поселится в уверенности».'
    reason: textual_and_cultural_note
lexical_decisions:
- source_word: שׁוֹמֵעַ לִי
  choice: кто слушает меня
  rationale: Глагол שמע может означать «слышать», «слушать» и «повиноваться». «Слушает» сохраняет слуховой образ и допускает подразумеваемое послушание; греческое ὑπακούων подтверждает смысл отзывчивого слушания.
- source_word: יִשׁפֹּט אֱמֶת
  choice: будет судить по правде
  rationale: 'Буквально: «будет судить истину». Русское «судить по правде» естественно передаёт наречный смысл и не вносит греческий объект «народы».'
- source_word: וּמַאֲזִין לִי
  choice: а кто внимает мне
  rationale: מאזין подчёркивает внимательное слушание. «Внимает» сохраняет параллелизм, не повторяя дословно первое «слушает».
- source_word: יִיחַן
  choice: будет жить
  rationale: Трудная форма обозначает размещение на стоянку или пребывание; греческое κατασκηνώσει подтверждает значение «поселится / будет обитать». «Будет жить» звучит естественно и сохраняет образ пребывания.
- source_word: בַּחֲדָרַי
  choice: в моих внутренних покоях
  rationale: חדרים — внутренние комнаты или покои. Формулировка сохраняет образ Премудрости как женщины, принимающей внимательного слушателя в пространство своего дома.
- source_word: מִבָּיִת
  choice: безопасно
  rationale: Конечное еврейское выражение синтаксически и текстуально затруднительно. Греческое πεποιθώς («уверенно, в безопасности») поддерживает смысл безопасного пребывания; эта неопределённость отмечена в сноске.
theological_decisions:
- issue: Расхождение еврейского и греческого текстов в первой части стиха
  choice: В основном тексте следовать еврейскому чтению «будет судить по правде»
  alternative: 'Греческое чтение: «будет судить народы»'
  rationale: Сохранившийся еврейский текст здесь первичен для перевода. Греческий параллельный текст существенно отличается и приводится в сноске, а не подменяет еврейское чтение.
- issue: Трудное конечное выражение מִבָּיִת
  choice: Передать общий смысл как безопасное пребывание во внутренних покоях
  alternative: 'Буквально, но неясно: «будет жить в моих покоях из дома / внутри дома»; ближе к греческому: «расположится станом в уверенности»'
  rationale: Еврейский конец строки неясен, тогда как греческая параллель поддерживает образ уверенного, безопасного пребывания. Сноска сохраняет текстологическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Параллелизм передан сочетанием «слушает» и более выразительного «внимает»; конструкция «судить по правде» понятна широкому читателю и сохраняет нравственно-судебный оттенок.
