  text: If he turns aside[b][a], she will bind him with bonds.
translation:
  language: ru
  text: Если он уклонится и отвернётся от неё, она свяжет его узами.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская фраза в первой части стиха трудна; выражение «отвернётся от неё» передаёт вероятный смысл в контексте речи о Премудрости.
    reason: textual_difficulty
  - marker: b
    text: 'Греческий текст здесь существенно иной: «И снова она прямо придёт к нему, обрадует его и откроет ему свои тайны». Вероятно, он отражает другую текстовую форму. Еврейское «она свяжет его узами» можно также понять как «она закуёт его»; при ином чтении глагола — «я свяжу его».'
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Сохраняет условное значение еврейской частицы, не превращая условие во временную последовательность.
- source_word: יָסוּר
  choice: уклонится
  rationale: Глагол סור обозначает уклонение, отступление или отход; выбранное слово сохраняет образ ухода с верного пути.
- source_word: וּנְטוֹתֵיהוּ
  choice: и отвернётся от неё
  rationale: Форма трудна и, вероятно, указывает на дальнейшее удаление от олицетворённой Премудрости. Дополнение «от неё» проясняет подразумеваемую связь, не устраняя текстовой трудности, отмеченной в сноске.
- source_word: וַאֲסַרְתִיהוּ
  choice: она свяжет его
  rationale: По контексту действующим лицом остаётся олицетворённая Премудрость. Еврейская форма допускает и чтение от первого лица, поэтому альтернатива указана в сноске.
- source_word: בָאֲסוּרִים
  choice: узами
  rationale: Передаёт общий образ связывания и ограничения, не конкретизируя материал или вид оков.
theological_decisions:
- issue: Кто действует во второй части стиха
  choice: 'Подлежащее — олицетворённая Премудрость: «она свяжет его».'
  alternative: 'Возможное чтение от первого лица: «я свяжу его».'
  rationale: Контекст раздела представляет Премудрость действующим лицом, поэтому третье лицо лучше сохраняет литературную последовательность; грамматическая неоднозначность не скрыта, а вынесена в сноску.
- issue: Соотношение сохранившегося еврейского текста и греческой параллели
  choice: Основной текст следует еврейскому свидетельству.
  alternative: 'Следовать греческому тексту: Премудрость вновь прямо приходит к человеку, радует его и открывает свои тайны.'
  rationale: Греческая версия существенно отличается и, вероятно, отражает иную текстовую форму. При наличии еврейского свидетельства высокой степени надёжности оно остаётся основой перевода, а вариант документируется в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной библейского текста формулировкой. «Уклонится» сохраняет образ отхода от пути, а «узами» — выразительность еврейского корневого повтора без неестественного русского «свяжет связями».
