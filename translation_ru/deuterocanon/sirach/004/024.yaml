  source_fidelity: 'Основной текст точно следует еврейскому: כִּי передано причинным «ведь»; נוֹדַעַת — «познаётся» с сохранением пассивно-возвратного значения; חָכְמָה / תְבוּנָה — «мудрость / разумение»; בְּמַעֲנֵה לָשׁוֹן — «в ответе языка». Образ «языка» сохранён, а не заменён отвлечённой «речью» во втором колоне. Смысловой диапазон «познаётся» (становится узнаваемой, обнаруживается) приемлемо передаёт нифаль ידע в этом лаконичном параллелизме.'
