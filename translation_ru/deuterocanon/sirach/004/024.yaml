  text: For wisdom is made known in speech[a], and understanding in the response of the tongue.
translation:
  language: ru
  text: Ведь мудрость познаётся в речи, а разумение — в ответе языка.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «а наставление — в слове языка»; в сохранившемся еврейском тексте: «а разумение — в ответе языка».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְאֹמֶר
  choice: в речи
  rationale: Передаёт высказывание или говорение без неоправданного сужения до отдельного изречения; соответствует параллельному греческому ἐν λόγῳ.
- source_word: נוֹדַעַת
  choice: познаётся
  rationale: 'Сохраняет пассивно-возвратный оттенок нифаля ידע: мудрость становится узнаваемой, обнаруживается через речь.'
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычный и контекстуально точный эквивалент.
- source_word: וּתְבוּנָה
  choice: а разумение
  rationale: «Разумение» передаёт способность понимать и различать; союз «а» естественно оформляет поэтический параллелизм без выраженного противопоставления.
- source_word: בְּמַעֲנֵה
  choice: в ответе
  rationale: Следует конкретному значению еврейского существительного «ответ, отклик», не подменяя его отличающимся греческим чтением.
- source_word: לָשׁוֹן
  choice: языка
  rationale: Сохраняет телесную метафору оригинала, также засвидетельствованную греческим γλώσσης.
theological_decisions:
- issue: Расхождение еврейского и греческого текстов во второй половине стиха
  choice: 'Основной текст следует еврейскому чтению: «разумение — в ответе языка»'
  alternative: 'Греческое чтение: «наставление — в слове языка»'
  rationale: Сохранившийся еврейский текст имеет высокую степень надёжности и является основным источником; реальное расхождение греческой традиции вынесено в примечание, а не сглажено.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным звучанием. Синтаксический параллелизм оригинала сохранён; «ответ языка» намеренно оставлен как понятная поэтическая метафора.
