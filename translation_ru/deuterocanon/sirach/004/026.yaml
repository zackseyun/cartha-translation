translation:
  language: ru
  text: Не стыдись отвернуться от беззакония[a] и не вставай перед потоком.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч.: «Не стыдись исповедовать свои грехи и не пытайся одолеть течение реки». В первой части еврейский и греческий тексты различаются, а во второй несколько расходятся; основной перевод следует еврейскому тексту, а греческий уточняет образ потока.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּבוֹשׁ
  choice: Не стыдись
  rationale: Прямо и естественно передаёт запрет со значением стыда; соответствует также греческому μὴ αἰσχυνθῇς.
- source_word: לָשׁוּב מֵעָוֹן
  choice: обратиться от беззакония
  rationale: «Обратиться» сохраняет образ возвращения или поворота в שוב, не заменяя его более узким богословским термином «покаяться»; «беззаконие» передаёт нравственную тяжесть עָוֹן.
- source_word: וְאַל תַּעֲמוֹד לִפְנֵי
  choice: и не становись против
  rationale: В контексте опасного потока сочетание естественно передаёт буквальный образ «не стой перед», то есть не вставай у него на пути и не противодействуй ему.
- source_word: שִׁבֹּלֶת
  choice: речного потока
  rationale: Здесь слово обозначает поток или течение, а не колос; греческое ῥοῦν ποταμοῦ подтверждает речной образ. Добавление «речного» делает необычный еврейский образ понятным.
theological_decisions:
- issue: Передавать ли שוב явно покаянным термином
  choice: обратиться от беззакония
  alternative: покаяться в грехе
  rationale: Еврейский текст говорит о повороте от беззакония, тогда как греческий — об исповедании грехов. Основной перевод следует сохранившемуся еврейскому чтению и не устраняет различие свидетелей.
translation_notes:
  register: Современный литературный русский язык с краткой наставительной формой. Сохранены параллелизм двух запретов и образ нравственного обращения; речной образ передан ясно, но без излишнего разъяснения в основном тексте.
