  terminology: «Высокомерен», «нерадив» и «небрежен» передают нравственно-практический регистр оригинала без конфессиональной интерпретации. В сноске «отдёрнута, когда нужно отдавать» точнее отражает греческое συνεσταλμένη («стянута, удержана/отведена назад»), чем «сжата».
