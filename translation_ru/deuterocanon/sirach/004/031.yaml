  text: Do not be proud in your speech[a], and slack and negligent in your work.
translation:
  language: ru
  text: Не будь высокомерен в своих речах[a] и не будь нерадив и небрежен в своей работе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте изречение имеет другую форму: «Пусть рука твоя не будет протянута, когда берёшь, и отдёрнута, когда отдаёшь».'
    reason: textual_variant
lexical_decisions:
- source_word: גַבְהָן
  choice: высокомерен
  rationale: Слово обозначает надменность, заносчивость. «Высокомерен» естественно сочетается с речью и ясно передаёт отрицательную нравственную оценку.
- source_word: בִּלְשׁוֹנֶךָ
  choice: в своих речах
  rationale: Буквально «на своём языке / своим языком»; в данном контексте речь идёт о манере говорить. Русское «в своих речах» звучит естественно и сохраняет смысл.
- source_word: רָפוּי
  choice: нерадив
  rationale: Передаёт отсутствие усердия и должной собранности в работе. Вместе со следующим определением сохраняет удвоенное порицание еврейского текста.
- source_word: רָשִׁישׁ
  choice: беспечен
  rationale: Редкое слово в контексте обозначает небрежность или недостаток усердия. «Беспечен» не дублирует полностью «нерадив», сохраняя два близких определения.
- source_word: בִּמְלַאכְתֶּךָ
  choice: в своей работе
  rationale: Широкое обозначение работы, занятия или дела; «работа» — наиболее ясный и современный русский эквивалент.
- source_word: μὴ ἔστω ἡ χείρ σου ἐκτεταμένη εἰς τὸ λαβεῖν, καὶ ἐν τῷ ἀποδιδόναι συνεσταλμένη
  choice: использовано как параллельный текст, а не основа перевода
  rationale: Греческий текст содержит существенно иной афоризм. Поскольку еврейский текст сохранился с высокой степенью надёжности, он положен в основу, а греческая форма приведена в сноске.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческой формы Сир 4:31
  choice: Перевести сохранившийся еврейский текст в основном тексте
  alternative: 'Перевести греческую форму: «Пусть рука твоя не будет протянута, когда берёшь, и сжата, когда отдаёшь».'
  rationale: Еврейское свидетельство для этого стиха сохранилось и оценено как надёжное, поэтому оно определяет основной перевод. Греческий текст представляет не стилистический вариант, а иное изречение, которое следует честно сохранить в сноске, не смешивая два чтения.
translation_notes:
  register: Современный литературный русский язык; наставительный, сдержанный и достойный тон. Синтаксический параллелизм и два близких по смыслу порицания сохранены без архаизации.
