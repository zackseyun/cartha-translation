  text: Do not sit with an unjust judge[a], for with him judgment will be according to his pleasure.
translation:
  language: ru
  text: Не заседай с несправедливым судьёй, потому что вместе с ним ты будешь судить так, как угодно ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь существенно иное чтение: «Подвизайся за истину до смерти, и Господь Бог будет сражаться за тебя».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֵּשֵׁב
  choice: Не заседай
  rationale: Глагол יָשַׁב буквально означает «сидеть», но рядом с судьёй естественно подразумевает участие в судебном заседании. «Не заседай» сохраняет образ и ясно передаёт контекст.
- source_word: שׁוֹפֵט עַוָּל
  choice: с несправедливым судьёй
  rationale: שׁוֹפֵט — тот, кто вершит суд; עַוָּל указывает на нравственную порочность и неправосудность. В юридическом контексте «несправедливый» точнее общего «нечестивый».
- source_word: כַאֲשֶׁר כִּרְצוֹנוֹ
  choice: так, как угодно ему
  rationale: Оборот выражает подчинение суда личной воле судьи. Эта формулировка естественна по-русски и передаёт оттенок произвола.
- source_word: תִּשְׁפּוֹט עִמּוֹ
  choice: вместе с ним ты будешь судить
  rationale: Сохранены второе лицо единственного числа и прямое значение глагола «судить», не устранённые в пользу безличной переформулировки.
theological_decisions:
- issue: Резкое расхождение сохранившегося еврейского текста и греческой традиции
  choice: Основной текст переведён по еврейскому свидетельству; греческое чтение вынесено в примечание.
  alternative: 'Греческий текст: «Подвизайся за истину до смерти, и Господь Бог будет сражаться за тебя».'
  rationale: При наличии надёжного еврейского текста он служит первичной основой. Греческое чтение здесь представляет существенно иной текст и потому не смешивается с еврейским, но сохраняется для читателя в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким назидательным строем. «Заседай» естественно связывает образ сидения с судебным контекстом; второе лицо еврейского текста сохранено.
