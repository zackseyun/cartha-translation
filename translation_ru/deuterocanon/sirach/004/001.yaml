base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/004/001.yaml
  text: My son[a], do not mock the life of the poor[b], and do not grieve a poor and bitter soul.
translation:
  language: ru
  text: Сын мой, не насмехайся над жизнью бедняка[a] и не причиняй боли душе[b] бедного, удручённого горем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «не лишай бедняка жизни»; это можно понимать и как «не лишай бедняка средств к жизни».'
    reason: alternative_reading
  - marker: b
    text: 'Еврейское слово, переведённое как «душа», может также означать жизнь, самого человека или его внутреннее «я»; буквально далее сказано: «горького душой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Сохраняет мужское единственное обращение, обычное для наставлений в еврейской литературе мудрости.
- source_word: אַל תִּלְעַג
  choice: не насмехайся
  rationale: Передаёт прямой запрет на насмешку и презрительное отношение; это естественная современная русская формулировка.
- source_word: לְחַיֵּי עָנִי
  choice: над жизнью бедняка
  rationale: Близко следует сохранившемуся еврейскому тексту, не сводя значение только к материальным средствам существования; отличие греческого свидетеля отмечено в сноске.
- source_word: וְאַל תַּדְאִיב
  choice: и не причиняй боли
  rationale: Глагол выражает причинение скорби, боли или страдания; русский оборот сохраняет как эмоциональную, так и более широкую силу выражения.
- source_word: נֶפֶשׁ
  choice: душе
  rationale: В данном сочетании слово указывает на внутреннюю жизнь страдающего человека, но его более широкий диапазон значений сохранён в сноске.
- source_word: עָנֵי וּמַר נָפֶשׁ
  choice: бедного, удручённого горем
  rationale: Передаёт бедность и состояние человека, буквально «горького душой», естественным и достойным современным русским языком.
theological_decisions:
- issue: Соотношение еврейского и греческого чтений первой части стиха
  choice: 'Основной текст следует еврейскому: «не насмехайся над жизнью бедняка».'
  alternative: 'По-гречески: «не лишай бедняка жизни», что допускает смысл «не лишай бедняка средств к жизни».'
  rationale: Сохранившийся еврейский текст является основным свидетельством; существенно отличающееся греческое чтение не подменяет его, а приводится в сноске как древняя текстовая альтернатива.
- issue: Мужское обращение в наставлении мудрости
  choice: «Сын мой»
  alternative: «Дитя моё»
  rationale: Еврейское בְּנִי прямо обозначает сына и не требует нейтрализации; универсальная применимость наставления не отменяет формы обращения источника.
- issue: Образ «горькой души»
  choice: «удручённого горем»
  alternative: «горького душой»
  rationale: Выбранная формулировка выражает глубокое внутреннее страдание, не приписывая человеку нравственной озлобленности, которой еврейское выражение само по себе не требует.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительной литературы. Формулировка сохраняет параллелизм двух запретов, мужское обращение и напряжение между буквальным еврейским чтением и отличающимся греческим свидетельством.
