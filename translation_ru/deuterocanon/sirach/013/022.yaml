base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/022.yaml
  text: A poor man totters[a]; he speaks, and they cry, “Away, away!”; but an intelligent man speaks[b], and there is no place for him.
translation:
  language: ru
  text: 'Бедняк пошатнётся[a] — заговорит, а ему кричат: «Прочь, прочь!»; скажет разумное[b] — для него нет места.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оступится», «потерпит неудачу». Еврейский глагол означает утрату устойчивости и не уточняет, идёт ли речь об ошибке или о несчастье.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст сжат и синтаксически неоднозначен: также возможно «говорит человек разумный». Греческий параллельный текст понимает эту часть как продолжение речи о бедняке: «высказал разумное, но ему не дали места». Буквально: «нет для него места», то есть его словам не дают места или не принимают их.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּל
  choice: бедняк
  rationale: Передаёт значение бедного, слабого или социально униженного человека; единственное число и афористическая индивидуализация сохранены.
- source_word: נָמוֹט
  choice: пошатнётся
  rationale: Сохраняет образ утраты устойчивости, не уточняя чрезмерно, идёт ли речь об ошибке, неудаче или бедственном положении.
- source_word: גָּע גָּע יִשֶּׂא
  choice: 'ему кричат: «Прочь, прочь!»'
  rationale: Краткая и трудная еврейская конструкция понята как поднятый против бедняка повторный возглас отвержения; добавленное «ему» естественно выражает направленность реакции.
- source_word: וְדִבֶּר מַשְׂכִּיל
  choice: но если он говорит разумно
  rationale: מַשְׂכִּיל может описывать разумную, проницательную речь. Такое прочтение сохраняет одного и того же бедняка как подразумеваемого субъекта и согласуется с греческим «высказал разумное», не вводя в текст отдельного разумного человека.
- source_word: וְאֵין לוֹ מָקוֹם
  choice: для него нет места
  rationale: Сохранён буквальный образ отсутствия места, который в контексте означает, что его разумной речи не дают пространства, признания или возможности быть услышанной.
