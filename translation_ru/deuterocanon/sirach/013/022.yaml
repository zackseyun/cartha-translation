  source_fidelity: Во второй части чересчур определённо введено условное придаточное («если он говорит разумно»), которого в еврейском тексте нет. Сжатое וְדִבֶּר מַשְׂכִּיל допускает понимание как «скажет разумное / заговорит с пониманием» (при продолжающемся подразумеваемом субъекте); это также согласуется с греческой параллелью. Перевод следует сохранить без искусственного условия и без утверждения, что речь непременно идёт об отдельном разумном человеке.
  naturalness: «Бедняк пошатнётся» и «Прочь, прочь!» звучат естественно в современном литературном русском и сохраняют афористическую резкость. Параллельная конструкция «скажет разумное — для него нет места» более плавна и точнее передаёт сжатость оригинала.
  terminology: «Бедняк» уместно передаёт דל. «Пошатнётся» хорошо сохраняет образ נָמוֹט. «Разумное» передаёт смысл מַשְׂכִּיל в данном синтаксически неоднозначном контексте, не навязывая отдельного субъекта. Буквальный образ «нет места» сохранён.
