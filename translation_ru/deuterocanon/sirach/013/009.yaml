  text: When a noble draws near[a], keep your distance, and then he will bring you nearer still.
translation:
  language: ru
  text: Когда вельможа позовёт тебя к себе[a], держись поодаль — и тогда он позовёт тебя ещё ближе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза предельно кратка; буквально её можно понять и как: «Приблизься к вельможе — будь далеко». Греческий параллельный текст поддерживает принятое здесь понимание: когда могущественный человек зовёт тебя, сохраняй сдержанность, и он позовёт тебя ближе.'
    reason: alternative_reading
lexical_decisions:
- source_word: קָרֵב
  choice: позовёт тебя к себе
  rationale: В еврейском тексте форма кратка и допускает понимание как повеление «приблизься». Однако греческий параллельный текст προσκαλεσαμένου σε ясно передаёт приглашение со стороны властного человека; это чтение также создаёт связный контраст с последующим советом держаться поодаль.
- source_word: נָדִיב
  choice: вельможа
  rationale: Здесь слово обозначает человека высокого общественного положения и влияния, а не просто щедрого человека. «Вельможа» кратко передаёт статус и согласуется с греческим δυνάστης, не уточняя конкретный титул.
- source_word: הֱיֶה רָחוֹק
  choice: держись поодаль
  rationale: Повелительная конструкция призывает проявлять сдержанность и сохранять почтительную дистанцию. Русское выражение естественно и сохраняет предостерегающий оттенок.
- source_word: וּכְדֵי כֵן
  choice: и тогда
  rationale: Оборот связывает сдержанность с последующим результатом. Усилительный оттенок, явный в греческом τόσῳ μᾶλλον, передан далее словом «ещё».
- source_word: יַגִּישֶׁךָ
  choice: он позовёт тебя ещё ближе
  rationale: Каузативная форма с объектным суффиксом означает, что вельможа приблизит адресата. «Позовёт… ближе» естественно продолжает образ приглашения, а «ещё» передаёт сравнительно-усилительный смысл греческого параллельного текста.
