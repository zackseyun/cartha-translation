lexical_decisions:
- source_word: אִם שַלְּךָ
  choice: Если у тебя что-нибудь есть
  rationale: Переданная еврейская фраза трудна, однако, вероятно, указывает на наличие у человека средств или чего-либо полезного для богача. Формулировка остаётся широкой и не устраняет неясность текста.
- source_word: יֵיטִיב דְּבָרָיו עִמָּךְ
  choice: он будет ласково говорить с тобой
  rationale: Буквально выражение связано с тем, что он «сделает свои слова хорошими» при общении с человеком; естественный русский оборот передаёт угодливую, располагающую речь.
- source_word: וִירֹשֶׁשְׁךָ
  choice: а потом разорит тебя
  rationale: Глагол означает довести до нищеты, лишить имущества. «Разорит» ясно и естественно передаёт экономическую эксплуатацию в данном контексте.
- source_word: וְלֹא יִכְאַב לוֹ
  choice: и не почувствует боли
  rationale: Сохранён образ боли и нравственная бесчувственность притеснителя; местоимение относится к тому, кто разоряет другого.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающейся греческой параллелью
  choice: Основной текст следует еврейскому свидетельству, а греческий вариант приведён в сноске.
  alternative: «Если ты ему полезен, он воспользуется тобой; а если окажешься в нужде, оставит тебя».
  rationale: Для Книги Премудрости Иисуса, сына Сирахова, сохранившийся еврейский текст имеет приоритет, но существенное расхождение древнего греческого свидетельства нельзя скрывать или сводить к однозначному прочтению.
translation_notes:
  register: Современный литературный русский язык; тон краткий и назидательный. «Ласково говорить» передаёт внешнюю приветливость без излишней архаики, а «разорит» — прямой социально-экономический смысл.
