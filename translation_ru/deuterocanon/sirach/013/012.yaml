  yaml_path: translation/deuterocanon/sirach/013/012.yaml
  text: A cruel man will give a stumbling block and will not spare[b][a]; against the life of many he plots a plot.
translation:
  language: ru
  text: Жестокий устроит преткновение и не пощадит;[a] против жизни многих он замышляет заговор.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте эта часть существенно отличается: «Безжалостен тот, кто не соблюдает сказанного, и он нисколько не пощадит, когда дело касается страдания и уз». Основной перевод следует сохранившемуся еврейскому тексту.'
    reason: textual_variant
  - marker: b
    text: 'Или более свободно: «он строит козни против многих жизней». В еврейском тексте употреблена усилительная однокоренная конструкция, буквально: «завязывает заговор».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכְזָרִי
  choice: жестокий
  rationale: Субстантивированное прилагательное обозначает жестокого, безжалостного человека; русское «жестокий» сохраняет краткость и обобщённый характер изречения.
- source_word: יִתֵּן כֹּשֶׂל
  choice: поставит преграду
  rationale: Буквально сочетание означает «даст [то, что вызывает] преткновение/падение». «Поставит преграду» естественно передаёт намеренно созданную помеху, не устраняя некоторой образной неопределённости еврейского текста.
- source_word: וְלֹא יַחְמוֹל
  choice: и не пощадит
  rationale: Глагол חמל может означать жалеть, щадить, проявлять сострадание. «Не пощадит» лаконично передаёт суровый тон и сочетается с будущей формой еврейского глагола.
- source_word: עַל נֶפֶשׁ רַבִּים
  choice: против жизни многих
  rationale: נפש в контексте угрожающего вреда означает жизнь; единственное число сохранено, а על передано как «против», поскольку речь идёт о враждебном умысле.
- source_word: קוֹשֵׂר קָשֶׁר
  choice: замышляет заговор
  rationale: Однокоренная конструкция буквально повторяет корень («завязывает заговор») и усиливает идею составления заговора. Русское «замышляет заговор» звучит естественно и сохраняет соответствующее смысловое усиление.
