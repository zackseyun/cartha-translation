    reason: textual_variant
  - marker: b
    text: 'В греческом тексте: «чтобы о тебе не забыли» — вместо еврейского «чтобы тебя не возненавидели». Основной текст следует сохранившемуся еврейскому свидетельству.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּתְקָרֵב
  choice: Не приближайся слишком
  rationale: Запрет передан естественно для современного русского языка. Наречие «слишком» явно выражает подразумеваемую контекстом чрезмерную близость и поддерживает смысл греческого параллельного текста.
- source_word: פֶּן
  choice: чтобы не
  rationale: В обеих частях «чтобы не» естественно и кратко передаёт предостерегающую силу פן, сохраняя параллелизм изречения.
- source_word: תִּתְרַחֵק
  choice: тебя не оттолкнули
  rationale: Передача учитывает трудность сохранившегося еврейского текста и подтверждается греческим ἀπωσθῇς — «быть оттолкнутым». Она выражает последствие чрезмерного сближения, не сглаживая текстовую проблему.
- source_word: וְאַל תִּתְרַחֵק
  choice: и не держись вдали
  rationale: Во второй части тот же корень ясно обозначает намеренное сохранение дистанции; формулировка естественна по-русски и сохраняет антитезу между приближением и удалением.
- source_word: תִּשָּׂנֵא
  choice: тебя не возненавидели
  rationale: Основное значение еврейского глагола — «быть ненавидимым». Сильная формулировка сохранена в основном тексте, а более мягкое греческое чтение отмечено в сноске.
