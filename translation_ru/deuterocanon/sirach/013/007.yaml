base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/007.yaml
  text: As long as you are useful[a], he will make sport of you; two or three times he will flatter you. Then he will look at you as if to pass beyond you[b], and he will shake his head at you.
translation:
  language: ru
  text: Пока ты ему полезен, он будет играть тобой[a] и дважды или трижды польстит тебе. Затем он посмотрит на тебя, словно собираясь пройти мимо[b], и покачает головой в твою сторону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол יְהָתֵל может означать насмехаться над человеком, забавляться им или обращаться с ним как с игрушкой.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст этой части стиха труден. Греческий текст передаёт мысль шире: после того как он воспользуется человеком, он увидит его и оставит. Перевод следует еврейскому образу, учитывая греческую параллель.'
    reason: textual_variant
lexical_decisions:
- source_word: עַד אֲשֶׁר תּוֹעִיל
  choice: Пока ты ему полезен
  rationale: 'Оборот выражает условие и длительность: отношение продолжается лишь до тех пор, пока адресат приносит пользу. Местоимение «ему» проясняет подразумеваемого выгодополучателя и согласуется с греческим параллельным текстом.'
- source_word: יְהָתֵל בָּךְ
  choice: он будет играть тобой
  rationale: Глагол может передавать насмешку, пренебрежительное забавление или обращение с человеком как с игрушкой. Русское «играть тобой» естественно выражает манипуляцию и сохраняет оттенок издевательства, не сводя смысл только к обману.
- source_word: פַעֲמַיִם שָׁלֹשׁ
  choice: дважды или трижды
  rationale: Сохранено конкретное числовое выражение повторности без превращения его в неопределённое «снова и снова».
- source_word: יַעֲרִיצֶךָ
  choice: польстит тебе
  rationale: В контексте временного, корыстного расположения речь идёт не об искреннем почтении, а о показной похвале. Греческий параллельный текст также описывает любезность, дающую ложную надежду.
- source_word: יִרְאֲךָ לְהִתְעַבֵּר בָּךְ
  choice: он посмотрит на тебя, словно собираясь пройти мимо
  rationale: Трудный еврейский оборот сохранён как образ демонстративного пренебрежения. Значение прохождения мимо поддерживается корнем עבר, а греческое «увидит тебя и оставит тебя» подтверждает общий смысл отвержения.
- source_word: וּבְרֹאשׁוֹ יָנִיעַ אֵלֶיךָ
  choice: покачает головой, глядя на тебя
  rationale: Жест передаёт презрение или неодобрительное отстранение. Такая формулировка звучит естественно по-русски и соответствует греческому параллельному свидетельству.
