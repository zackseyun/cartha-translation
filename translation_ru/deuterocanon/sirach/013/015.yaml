review_pass:
  verdict: revise
  source_fidelity: 'Первая половина черновика верно передаёт общий смысл эллиптического еврейского текста — тяготение живых существ к подобным себе. Однако «всякая плоть держится своего рода» грамматически и семантически неудачно: «плоть» не может естественно «держаться рода», а «своего рода» в современном русском также воспринимается как вводное выражение. Во второй половине «с подобным себе» несколько ослабляет прямое еврейское «к своему роду».'
  naturalness: «Всякая плоть» допустимо в библейском регистре, но в сочетании с «держится своего рода» звучит неестественно. «Всякое живое существо тянется к подобному себе» — современная литературная и афористичная передача, которая раскрывает эллипсис без внесения греческого «любит».
  terminology: «Подобное себе» адекватно передаёт смысл принадлежности к одному виду/роду в первой строке. Во второй строке следует сохранить «своим родом», поскольку еврейский текст повторяет מין; это также отличает основной еврейский текст от греческого «ближний».
  issues:
