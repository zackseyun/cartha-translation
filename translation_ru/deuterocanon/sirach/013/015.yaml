translation:
  language: ru
  text: Всякое живое существо тянется к подобному себе[a], и человек соединяется со своим родом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Всякое живое существо любит подобное себе, и всякий человек — ближнего своего». Еврейский текст в первой строке выражен кратко и говорит о тяготении к своему роду; во второй — о соединении человека со своим родом.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִין כָּל בָּשָׂר
  choice: всякая плоть… своего рода
  rationale: Сохраняет ключевые образы еврейского текста — «плоть» и «род», — но передаёт сжатую конструкцию естественным русским выражением.
- source_word: אֶצְלוֹ
  choice: держится своего рода
  rationale: Еврейская фраза эллиптична; выбор передаёт близость и тяготение к своему роду, подтверждаемые второй половиной стиха и греческой параллелью, не вводя прямо греческое «любит».
- source_word: יְחֻבַּר
  choice: соединяется
  rationale: Передаёт пассивно-возвратный смысл «быть соединённым, примыкать, вступать в общение» и сохраняет формальную связь с еврейским глаголом.
- source_word: אָדָם
  choice: человек
  rationale: В данном обобщающем изречении означает отдельного представителя человеческого рода; русское «человек» естественно сохраняет единственное число и универсальный смысл.
- source_word: אֶל מִינוֹ
  choice: с подобным себе
  rationale: Буквально — «со своим родом». В русском эта передача избегает тяжёлого повтора слова «род», сохраняя мысль о сходстве и принадлежности к одной категории.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и греческой параллели в эллиптичной первой части
  choice: Основной текст следует еврейскому чтению о привязанности каждого существа к своему роду; греческая параллель вынесена в примечание.
  alternative: «Всякое живое существо любит подобное себе, и всякий человек — ближнего своего».
  rationale: Еврейский свидетель здесь основной и подчёркивает соединение со своим родом. Греческий текст проясняет общий смысл близости, но отличается лексически словами «любит» и «ближнего», поэтому его формулировка не подменяет основной текст.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Выражение «всякая плоть» намеренно сохраняет библейский образ еврейского текста; «держится своего рода» естественно раскрывает его эллиптичную первую часть.
