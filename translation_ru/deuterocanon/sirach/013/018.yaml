translation:
  language: ru
  text: Дикие ослы пустыни — пища для льва[b]; так и бедные — пастбище богатых.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Какой может быть мир у гиены с собакой? И какой может быть мир у богатого с бедным?» Греческая параллель содержит другое изречение, но сохраняет мысль о враждебности между богатыми и бедными.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «дикие звери пустыни», если еврейское слово понимается в более широком смысле, а не как обозначение диких ослов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַאֲכַל
  choice: пища
  rationale: Существительное обозначает то, что едят. «Пища» естественно передаёт образ, не сужая его до значения «добыча».
- source_word: אֲרִי
  choice: лев
  rationale: Прямое и обычное соответствие еврейскому названию животного.
- source_word: פִּרְאֵי מִדְבָּר
  choice: дикие звери пустыни
  rationale: Передаёт наиболее вероятное собирательное значение диких животных открытой пустынной местности; более узкое понимание как диких ослов сохранено в примечании.
- source_word: כֵּן
  choice: так
  rationale: Кратко и естественно вводит вторую часть сравнительной притчи.
- source_word: מַרְעִית
  choice: пастбище
  rationale: 'Сохраняет буквальный пастбищный образ еврейского текста: бедные представлены как то, чем кормятся богатые. Перевод «добыча» сделал бы метафору менее точной.'
- source_word: עָשִׁיר
  choice: богатых
  rationale: Единственное число в еврейском употреблено обобщённо; по-русски множественное число естественно выражает социальную группу и соответствует параллельному «бедные».
- source_word: דַּלִּים
  choice: бедные
  rationale: В данном социальном противопоставлении слово обозначает бедных и нуждающихся; значение подтверждается греческим πένητα.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческой параллели
  choice: Основной текст следует еврейской притче о хищничестве и кормлении.
  alternative: «Какой мир у гиены с собакой? И какой мир у богатого с бедным?»
  rationale: Сохранившийся еврейский текст имеет приоритет и высокую степень надёжности. Греческий текст содержит иную притчу, сохраняющую ту же мысль о враждебности между богатыми и бедными; существенное разночтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичной, достоинственной формой притчи. Сохранены параллелизм и резкая метафора еврейского текста; тире помогает ясно передать именную конструкцию. Маркеры сносок размещены при соответствующих местах основного текста.
