translation:
  language: ru
  text: Смирение претит гордости[a], а бедняк — богачу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом свидетельстве: «Дикие ослы — добыча львов в пустыне; так бедные — пастбище богатых». Сохранившийся здесь еврейский текст гласит иначе: «Смирение претит гордости, а бедняк — богачу».'
    reason: alternative_reading
lexical_decisions:
- source_word: תּוֹעֲבַת
  choice: отвратительно / отвратителен для
  rationale: Конструкция выражает сильное отвращение одного к другому. Такая передача естественна по-русски и не придаёт выражению излишне культового оттенка слова «мерзость».
- source_word: גַּאֲוָה
  choice: гордость
  rationale: Прямое соответствие отвлечённому существительному; сохраняет нравственное противопоставление смирению.
- source_word: עֲנָוָה
  choice: смирение
  rationale: Передаёт скромность и смиренное расположение без сужения значения до одной лишь кротости.
- source_word: עָשִׁיר
  choice: богач
  rationale: Единственное число еврейского текста сохранено как обобщённый образ человека, обладающего богатством.
- source_word: אֶבְיוֹן
  choice: бедняк
  rationale: Передаёт бедного, нуждающегося человека и образует естественную русскую пару с «богачом».
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческого свидетеля
  choice: 'Основной текст следует сохранившемуся еврейскому чтению: «Смирение отвратительно для гордости, и бедняк отвратителен для богача».'
  alternative: 'Греческий свидетель: «Дикие ослы — добыча львов в пустыне; так бедные — пастбище богатых».'
  rationale: Еврейское чтение сохранилось и оценено как надёжное, поэтому оно положено в основу перевода. Существенно отличающееся греческое чтение приведено в сноске, а не сглажено и не объединено с еврейским.
translation_notes:
  register: Современный литературный русский язык; афористическая симметрия еврейской пословицы сохранена. Сильное תּוֹעֲבַת передано словом «отвратительно», а не более культово окрашенным «мерзость».
