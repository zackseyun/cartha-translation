translation:
  language: ru
  text: Богач говорит[a] — и много у него сторонников; даже его безобразные слова приукрашивают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий параллельный текст существенно отличается: «Богача, когда он пошатнётся, поддерживают друзья, а смиренного, когда он падёт, отталкивают даже друзья». Еврейский текст здесь говорит о том, как благосклонно принимают речь богача.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר
  choice: богач
  rationale: Единственное число обозначает типичного представителя; «богач» прямо и естественно передаёт социальный статус и мужской род еврейской формы.
- source_word: מְדַבֵּר
  choice: говорит
  rationale: Настоящее время соответствует обобщённому, пословичному характеру высказывания.
- source_word: וְעוֹזְרָיו רַבִּים
  choice: и много у него сторонников
  rationale: Буквально — «и помощников его много»; «сторонники» естественно передаёт здесь людей, которые поддерживают богача и благосклонно принимают его речь.
- source_word: דְבָרָיו
  choice: слова его
  rationale: Сохраняет конкретное обозначение произнесённых слов и слегка возвышенный ритм мудростного изречения.
- source_word: מְכוֹעֲרִין
  choice: безобразные
  rationale: Передаёт значение чего-то неприглядного или предосудительного и сохраняет образную противоположность красоте.
- source_word: מְיוּפִּין
  choice: делают прекрасными
  rationale: 'Сохраняет пассивно-каузативный смысл: окружающие представляют дурные слова богача в привлекательном виде; также удерживается ироническая антитеза «безобразные — прекрасными».'
