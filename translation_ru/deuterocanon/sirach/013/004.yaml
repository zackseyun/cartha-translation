translation:
  language: ru
  text: Если ты ему пригодишься[a], он будет пользоваться тобой; а если ты согнёшься, он тебя не пощадит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции: «Богач поступил несправедливо — и ещё бушует; бедняка обидели — и он ещё вынужден просить». Сохранившийся здесь еврейский текст содержит иное предостережение: если ты пригодишься ему, он будет пользоваться тобой; если ты согнёшься, он тебя не пощадит.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם תִּכְשַׁר לוֹ
  choice: если ты ему пригодишься
  rationale: Корень כשר обозначает пригодность, соответствие или полезность. В данном контексте речь идёт не о нравственной праведности, а о практической выгоде для влиятельного человека.
- source_word: יַעֲבֹד בָּךְ
  choice: он станет пользоваться тобой
  rationale: Буквально выражение допускает смысл «будет работать посредством тебя / использовать тебя». Русское «пользоваться тобой» естественно передаёт использование человека в своих интересах, не усиливая текст до однозначного «эксплуатировать».
- source_word: וְאִם תִּכְרַע
  choice: а если ты согнёшься
  rationale: כרע может означать сгибаться, преклоняться, становиться на колени или падать под тяжестью. «Согнёшься» сохраняет телесный образ и его возможный переносный смысл — ослабеть или оказаться униженным, — не устраняя подлинную неоднозначность.
- source_word: לֹא יַחְמֹל עָלֶיךָ
  choice: он тебя не пощадит
  rationale: חמל выражает жалость, сострадание и вследствие этого готовность пощадить. «Не пощадит» кратко и естественно передаёт как отсутствие сострадания, так и практическую безжалостность.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста с греческой традицией
  choice: Основной текст переведён непосредственно с еврейского свидетельства; греческое чтение приведено в сноске.
  alternative: 'Перевести греческий текст как основной: «Богач поступил несправедливо — и ещё гневается; бедняка обидели — и он ещё вынужден просить».'
  rationale: Еврейский текст здесь сохранился и потому служит первичным источником. Греческая форма стиха представляет существенное альтернативное чтение, которое нельзя ни смешивать с еврейским текстом, ни умалчивать; оно сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык; обращение на «ты» следует второму лицу единственного числа еврейского текста. Формулировка краткая, афористичная и предостерегающая. Глагол «согнёшься» намеренно сохраняет буквальный образ и переносную социальную окраску.
