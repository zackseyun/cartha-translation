review_pass:
  verdict: revise
  source_fidelity: 'Основной текст в целом верно следует еврейскому свидетельству: «пригодишься» передаёт практическую полезность, «не пощадит» — חמל. «Согнёшься» удачно сохраняет телесный образ כרע и не устраняет его возможный переносный смысл. Однако «станет пользоваться» вносит оттенок начала действия, которого в еврейском имперфекте нет. Сноска неточно передаёт греческое προσενεβριμήσατο («грубо возмущается / бушует», не просто «гневается») и слишком определённо разворачивает еврейский образ как «сгибаешься под тяжестью обстоятельств».'
  naturalness: Текст краток, афористичен и естественен для современного литературного русского. «Будет пользоваться тобой» точнее сохраняет видовременно́е значение оригинала, чем «станет пользоваться тобой», не добавляя оттенка начала.
  terminology: Термины и социальный регистр переданы нейтрально, без конфессионального истолкования. В сноске следует не называть адресата «влиятельным человеком» как факт текста и не конкретизировать причину «сгибания»; ни то ни другое прямо не выражено в еврейской строке.
  issues:
  - severity: low
    issue: Добавочный оттенок в «он станет пользоваться тобой»
    rationale: Глагол «станет» обозначает начало состояния или действия. יַעֲבֹד передаёт простое будущее/обычное следствие без специального акцента на начале.
  - severity: medium
    issue: Неточная и чрезмерно интерпретирующая сноска к греческому варианту
    rationale: προσενεβριμήσατο выражает резкое возмущение, бушевание или грубую вспышку, а не нейтральное «гневается». Объяснение «влиятельный человек» и «под тяжестью обстоятельств» выходит за пределы буквального еврейского текста и сужает сохраняемую им образность.
  revised_text: Если ты ему пригодишься[a], он будет пользоваться тобой; а если ты согнёшься, он тебя не пощадит.
  revised_footnotes:
