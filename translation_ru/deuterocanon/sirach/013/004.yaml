- from: Если ты ему пригодишься[a], он станет пользоваться тобой; а если ты согнёшься, он тебя не пощадит.
  to: Если ты ему пригодишься[a], он будет пользоваться тобой; а если ты согнёшься, он тебя не пощадит.
  rationale: Сохранён перевод по первичному еврейскому свидетельству и его краткая предостерегающая форма. Убрано невыраженное в оригинале значение начала действия; сноска исправлена для более точной передачи греческого варианта и освобождена от излишней конкретизации еврейского образа.
