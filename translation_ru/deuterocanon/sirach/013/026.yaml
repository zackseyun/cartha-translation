translation:
  language: ru
  text: Сердце человека меняет выражение его лица — к добру или ко злу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь заметно отличается: в нём говорится примерно так: «Признак сердца, пребывающего во благе, — радостное лицо», после чего следует трудная фраза о нахождении притч с усилием. Поскольку еврейский текст этого стиха сохранился, перевод следует ему; греческий текст подтверждает общую связь внутреннего состояния с выражением лица, но не точную формулировку.'
    reason: textual_variant
lexical_decisions:
- source_word: לֵב
  choice: сердце
  rationale: Сохраняет конкретный образ еврейской литературы мудрости, где сердце обозначает внутреннего человека, его мысли и расположение.
- source_word: אֱנוֹשׁ
  choice: человека
  rationale: Передаёт обозначение человека в единственном числе естественным современным русским языком, не сужая обобщающий смысл изречения.
- source_word: יְשַׁנֵּא
  choice: меняет
  rationale: 'Прямо передаёт каузативный смысл глагола: внутреннее состояние изменяет видимое выражение лица.'
- source_word: פָנָיו
  choice: выражение его лица
  rationale: Сохраняет конкретное упоминание лица и одновременно ясно выражает подразумеваемое изменение внешней мимики, а не физических черт.
- source_word: אִם לְטוֹב וְאִם לְרָע
  choice: к добру или ко злу
  rationale: Передаёт симметричное противопоставление טוב и רע, сохраняя возможную нравственную силу слов и не сводя их лишь к приятному и неприятному.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая форма афоризма сохранена. «Выражение его лица» употреблено вместо буквального «его лицо», поскольку по-русски сердце естественнее меняет именно выражение лица. Противопоставление передано традиционной и понятной парой «добро — зло».
