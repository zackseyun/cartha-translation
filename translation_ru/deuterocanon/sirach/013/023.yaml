lexical_decisions:
- source_word: עָשִׁיר דּוֹבֵר
  choice: Когда говорит богач
  rationale: Причастная конструкция передаёт обобщённую, афористическую ситуацию; «богач» — естественное современное обозначение богатого человека без добавления оценочного оттенка.
- source_word: הַכֹּל נִסְכָּתוּ
  choice: все умолкают
  rationale: Греческая параллель ἐσίγησαν подтверждает значение молчания; настоящее время сохраняет характер общего наблюдения.
- source_word: שִׂכְלוֹ
  choice: его разумение
  rationale: '«Разумение» передаёт способность рассуждать и смысл сказанного, сохраняя возможную иронию: любую мысль богача чрезмерно превозносят. Это также отличает еврейское чтение от греческого «его слово».'
- source_word: עַד עָב יַגִּיעוּ
  choice: возносят … до облаков
  rationale: Фраза сохраняет яркий пространственный образ крайнего возвеличивания; русский глагол «возносят» естественно выражает и подъём, и чрезмерную похвалу.
