base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/020.yaml
  text: When a rich man stumbles[a], he is supported by a friend; but when a poor man stumbles[b], he is driven away from friend to friend.
translation:
  language: ru
  text: Если богатый пошатнётся, друг его поддержит; а если бедный пошатнётся, его гонят от одного друга к другому.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь существенно иной: «Низкое положение отвратительно гордецу, и бедный отвратителен богатому». Перевод следует сохранившемуся еврейскому тексту.'
    reason: textual_variant
lexical_decisions:
- source_word: עָשִׁיר
  choice: богатый
  rationale: Существительное в единственном числе употреблено как обозначение типичного представителя; субстантивированное «богатый» естественно передаёт пословичный характер.
- source_word: מוּט / נָמוֹט
  choice: пошатнётся
  rationale: Обе формы одного корня описывают утрату устойчивости, но не обязательно окончательное падение; одинаковый перевод сохраняет параллелизм.
- source_word: נִסְמָךְ
  choice: поддержит
  rationale: Форма означает получение опоры или поддержки. Активная русская конструкция с названным действующим лицом звучит естественно и точно передаёт отношение между участниками.
- source_word: מֵרֵעַ
  choice: друг его
  rationale: רֵעַ здесь — друг или ближний; контекст противопоставляет реальную поддержку богатому повторному отказу бедному. Местоимение делает связь ясной без изменения смысла.
- source_word: דַל
  choice: бедный
  rationale: В данном социально-экономическом противопоставлении означает неимущего или слабого и соответствует «богатому».
- source_word: נִדְחָה
  choice: его гонят
  rationale: Глагол выражает отталкивание, удаление или изгнание. «Гонят» сохраняет конкретную силу образа и допускает повторяющееся действие.
- source_word: מֵרֵעַ אֶל רֵעַ
  choice: от одного друга к другому
  rationale: 'Передаёт направление и повторность: бедного не поддерживают, а отсылают дальше от одного человека к следующему.'
theological_decisions:
- issue: Существенное расхождение еврейского и греческого текста
  choice: Основным принят сохранившийся еврейский текст о поддержке богатого и отвержении бедного.
  alternative: 'Греческий текст: «Смирение отвратительно гордецу, и бедный отвратителен богатому».'
  rationale: Для данного проекта первичным источником при наличии надёжного еврейского свидетельства служит еврейский текст; значимое расхождение сохранено в примечании, а не сглажено.
translation_notes:
  register: Современный литературный русский язык с краткой пословичной конструкцией. «Пошатнётся» сохраняет образ неустойчивости, а «гонят от одного друга к другому» — резкий контраст между поддержкой и повторным отказом.
