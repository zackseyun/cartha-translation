translation:
  language: ru
  text: 'Не неси того, что тяжелее тебя, и не связывайся с тем, кто богаче тебя.


    Что общего у глиняного черепка с котлом? Тот ударит о него — и черепок разобьётся.


    Что общего у богатого с бедным?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּבֵד מִמְּךָ
  choice: тяжелее тебя
  rationale: Сохраняет конкретный образ непосильной тяжести и сравнительную конструкцию еврейского текста, не сводя её к отвлечённому «не по силам».
- source_word: תִּשָּׂא
  choice: не неси
  rationale: Греческий параллельный текст подтверждает запретительную форму; «нести» естественно сочетается с образом тяжести.
- source_word: תִּתְחַבָּר
  choice: не связывайся
  rationale: Передаёт предостережение против вступления в тесные отношения или союз, не сужая смысл до дружбы либо делового партнёрства.
- source_word: עָשִׁיר מִמְּךָ
  choice: кто богаче тебя
  rationale: Прямо передаёт еврейский текст; добавленное в греческой традиции «сильнее» не включено, поскольку оно отсутствует в данном еврейском источнике.
theological_decisions:
- issue: Характер предостережения об отношениях с богатым
  choice: Сохранено общее практическое предостережение без уточнения вида отношений.
  alternative: «Не дружи» или «не вступай в союз».
  rationale: Глагол допускает более широкий круг связей; конкретизация могла бы неоправданно превратить мудростное предостережение в узкий запрет.
translation_notes:
  register: Краткая, афористичная формулировка в современном литературном русском; сохранён параллелизм двух запретов и прямой образ тяжести.
