  terminology: «Черепок» передаёт פָּרוּר как осколок/черепок глиняной посуды; «котёл» передаёт סִיר. Формула «Что общего у… с…?» идиоматично передаёт риторический вопрос о возможности соединения/содружества, не навязывая более узкого вида отношений. Заключительное противопоставление «богатого» и «бедного» сохранено без доктринальных выводов.
