translation:
  language: ru
  text: Берегись и будь осторожен; не водись с людьми насилия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «ведь ты идёшь со своим падением»; возможно также: «ведь ты идёшь со своей гибелью». В сохранившемся еврейском тексте: «не водись с людьми насилия».'
    reason: textual_variant
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: Берегись
  rationale: Возвратная форма повелительного наклонения передаёт призыв оберегать себя и быть настороже; «берегись» естественно и ёмко выражает эту предосторожность.
- source_word: וֶהְיֵה זָהִיר
  choice: и будь осторожен
  rationale: זָהִיר означает «осторожный, осмотрительный». В еврейском тексте нет отдельного усилителя, поэтому «очень» не добавлено; настойчивость предупреждения передаётся сочетанием двух призывов.
- source_word: וְאַל תִּתְהַלֵּךְ
  choice: не водись
  rationale: Форма от הלך может буквально означать «ходить», но с עִם в наставлении о выборе общества подразумевает постоянное общение. Русское «водиться с» естественно сохраняет образ хождения и выражает связь с такими людьми.
- source_word: עִם
  choice: с
  rationale: Предлог обозначает совместность или общение и естественно сочетается с русским «водиться».
- source_word: אַנְשֵׁי חָמָס
  choice: людьми насилия
  rationale: חָמָס охватывает насилие, жестокий произвол и неправду. «Люди насилия» сохраняет конкретность и более широкий смысл еврейского выражения, не сводя его лишь к физически агрессивным людям.
theological_decisions:
- issue: Расхождение еврейского и греческого свидетелей во второй части стиха
  choice: 'Следовать сохранившемуся еврейскому чтению: «не водись с людьми насилия».'
  alternative: 'Греческое чтение: «ведь ты идёшь вместе со своим падением» или «навстречу своему падению».'
  rationale: Еврейский текст здесь сохранился и даёт связное наставление, поэтому он принят как основной. Существенно отличающееся греческое чтение отмечено в сноске, а не смешано с еврейским текстом.
translation_notes:
  register: Современный литературный русский язык с краткой, настойчивой интонацией наставления. «Не водись» употреблено как естественное русское выражение общения и союза, а «люди насилия» сохраняет широту חָמָס.
