base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/016.yaml
  text: What fellowship has a wolf with a lamb? So a wicked man with a righteous man[b][a], and likewise a rich man with a man brought low.
translation:
  language: ru
  text: Что общего у волка с ягнёнком? Так же — у нечестивого с праведником и у богача с человеком униженного положения[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь иная форма изречения: «Всякая плоть сходится по роду своему, и человек прилепится к подобному ему». Она также выражает общую мысль о том, что подобные соединяются с подобными.'
    reason: alternative_reading
  - marker: b
    text: Еврейское выражение, переведённое как «человек униженного положения», не вполне ясно. Возможно, оно обозначает человека низкого или ухудшившегося общественного положения, в том числе бедняка.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה יְּחֻבַּר
  choice: Что общего у… с…?
  rationale: Пассивная форма глагола חבר выражает риторический вопрос о соединении или общении. Русская идиома «что общего у… с…?» естественно передаёт невозможность такого союза, не сводя образ к физическому соединению.
- source_word: זְאֵב אֶל כֶּבֶשׂ
  choice: у волка с ягнёнком
  rationale: Названия животных переданы прямо; «ягнёнок» особенно ясно сохраняет противопоставление хищника и беззащитной жертвы.
- source_word: רָשָׁע לַצַּדִיק
  choice: у нечестивого — с праведником
  rationale: Субстантивированные формы переданы традиционными и понятными русскими обозначениями нравственно противоположных людей. Предлог ל в контексте истолкован как указание на отношение между ними, параллельное первой части стиха.
- source_word: עָשִׁיר
  choice: у богача
  rationale: Единственное число имеет обобщённый характер; «богач» кратко и естественно поддерживает форму изречения.
- source_word: אִישׁ נֶאֱצָל
  choice: с человеком, доведённым до унижения
  rationale: Выражение текстуально и лексически затруднительно. В противопоставлении богачу оно, вероятно, обозначает человека пониженного общественного или материального положения. Выбранная формулировка сохраняет оттенок пережитого умаления и не сужает смысл до одной лишь бедности.
theological_decisions:
- issue: Обобщающие формы мужского рода в изречении мудрости
  choice: нечестивый / праведник / богач / человек, доведённый до унижения
  alternative: нечестивый человек / праведный человек / богатый человек / бедняк
  rationale: Еврейский текст использует формы мужского рода в единственном числе как типических участников нравственного и социального противопоставления; русский перевод сохраняет эту форму, не добавляя деноминационного толкования.
- issue: Соотношение еврейского текста и отличающегося греческого параллельного чтения
  choice: В основном тексте переведено еврейское изречение о волке и ягнёнке
  alternative: «Всякая плоть сходится с подобной себе, и человек прилепится к подобному ему»
  rationale: Сохранившийся еврейский текст имеет высокий уровень уверенности и служит основным свидетельством. Существенно отличающееся греческое чтение не подменяет его, а приводится в примечании как свидетельство иной формы изречения.
