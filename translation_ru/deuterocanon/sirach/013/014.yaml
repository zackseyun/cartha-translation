  text: All flesh loves its own kind[a], and every person the one like himself.
translation:
  language: ru
  text: Всякая плоть любит себе подобных[a], и каждый человек — того, кто подобен ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «и каждый человек — ближнего своего». Еврейский текст буквально говорит: «того, кто подобен ему».'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַבָּשָׂר
  choice: Всякая плоть
  rationale: Буквально сохраняет еврейское выражение «всякая плоть» и его конкретный, телесный оттенок; в контексте изречения обозначает живых существ вообще.
- source_word: יֶאֱהַב
  choice: любит
  rationale: Имперфект имеет гномическое значение; настоящее время естественно передаёт общеизвестную закономерность.
- source_word: מִינוֹ
  choice: себе подобных
  rationale: מִין означает род, вид или разновидность. Русское выражение естественно передаёт тяготение к существам своего рода, не придавая фразе излишне научного звучания.
- source_word: וְכָל אָדָם
  choice: и каждый человек
  rationale: אָדָם здесь означает отдельного человека в обобщающем смысле; «каждый человек» точно и естественно в современном русском языке.
- source_word: אֶת הַדּוֹמֶה לוֹ
  choice: того, кто подобен ему
  rationale: Передаёт еврейское значение сходства без подмены его греческим чтением «ближнего своего».
theological_decisions:
- issue: Различие еврейского и греческого чтений во второй части стиха
  choice: 'В основном тексте следовать еврейскому: «того, кто подобен ему»'
  alternative: «ближнего своего»
  rationale: Сохранившийся еврейский текст является здесь первичным и прямо говорит о подобии. Греческое чтение представляет важный древний вариант, поэтому отмечено в сноске, но не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического изречения. «Всякая плоть» намеренно сохраняет образность еврейского текста; тире во второй части восполняет подразумеваемый глагол и делает параллелизм ясным.
