translation:
  language: ru
  text: Богатство — благо, если нет беззакония; а бедность — зло в устах надменности[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь стоит существенно иное изречение: «Сердце человека изменяет его лицо — к добру ли, ко злу ли».'
    reason: textual_variant
  - marker: b
    text: 'Еврейское выражение буквально означает «по устам надменности»; возможно также: «по суждению» или «по словам надменного».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב הָעֹשֶׁר
  choice: Богатство — благо
  rationale: Сохраняет краткость и афористичность еврейского выражения. «Благо» звучит достойно и яснее обозначает нравственную оценку, чем разговорное «хорошо».
- source_word: אִם אֵין עָוֹן
  choice: если нет беззакония
  rationale: Близко передаёт условную конструкцию и сохраняет некоторую открытость связи между богатством и беззаконием, не уточняя сверх текста, идёт ли речь о приобретении, владении или использовании богатства.
- source_word: וְרַע הָעוֹנִי
  choice: а бедность — зло
  rationale: Воспроизводит противопоставление «благо — зло» и параллелизм двух частей изречения.
- source_word: עַל פִּי זָדוֹן
  choice: в устах надменного
  rationale: Даёт естественную русскую фразу, сохраняющую образ уст/речи. При этом трудность еврейского оборота и абстрактного существительного זָדוֹן отмечена в сноске.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающимся греческим параллельным чтением
  choice: Основным текстом принят еврейский афоризм о богатстве и бедности.
  alternative: 'Греческий текст: «Сердце человека изменяет его лицо — к добру ли, ко злу ли».'
  rationale: В данном месте имеется уверенно засвидетельствованный еврейский текст, поэтому он служит основой перевода. Греческое чтение представляет собой иной афоризм и приводится в сноске, а не смешивается с еврейским.
- issue: Нравственная оценка богатства и бедности
  choice: Сохранено условное одобрение богатства и неоднозначное высказывание о бедности.
  alternative: Истолковать стих как безусловное осуждение бедности либо как утверждение, что бедность сама по себе нравственно зла.
  rationale: Еврейский текст связывает благо богатства с отсутствием беззакония, а оценка бедности грамматически зависит от трудного оборота עַל פִּי זָדוֹן. Перевод не превращает социальное состояние в однозначную нравственную вину.
translation_notes:
  register: Современный литературный русский язык с кратким, симметричным строением мудрого изречения. Слова «благо», «беззаконие» и «надменный» сохраняют dignified нравственный регистр, оставаясь понятными современному читателю.
