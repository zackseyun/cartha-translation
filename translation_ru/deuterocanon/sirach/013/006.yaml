lexical_decisions:
- source_word: צֹרֶךְ לוֹ עִמְּךָ
  choice: Ты ему нужен
  rationale: Естественно передаёт еврейское выражение со значением «у него есть нужда в тебе», сохраняя акцент на корыстной заинтересованности.
- source_word: וְהָשִׁיעַ לָךְ
  choice: и он обманет тебя
  rationale: Еврейская форма трудна и допускает неясность; в данном контексте речь идёт о вредном манипулировании. Перевод «обманет» согласуется с последующими знаками притворного расположения, не сужая смысл исключительно до материального разорения. Более конкретное свидетельство греческого параллельного текста вынесено в примечание.
- source_word: וְשׁוֹחֵק לְךָ
  choice: он будет улыбаться тебе
  rationale: Хотя глагол может означать смех или игру, в контексте притворного дружелюбия «улыбаться» звучит естественно и передаёт внешнюю благожелательность.
- source_word: וְהִבְטִיחֶךָ
  choice: внушать тебе чувство безопасности
  rationale: Каузативная форма от בטח означает побуждать человека чувствовать себя уверенно или безопасно. Этот вариант сохраняет каузативный оттенок и подразумеваемую манипуляцию.
- source_word: ἀποκενώσει σε
  choice: опустошит тебя (в примечании)
  rationale: Греческий параллельный текст конкретно описывает истощение или разорение человека; это важное разночтение сохранено в примечании, но не подменяет трудное еврейское чтение в основном тексте.
