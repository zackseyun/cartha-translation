revisions:
- from: Если богатый поступает несправедливо, он ещё и превозносится; а если бедный поступает несправедливо, ему приходится просить о милости.[a]
  to: Если богатый поступает несправедливо, он ещё и ведёт себя надменно; а если бедный поступает несправедливо, он сам молит о милости.[a]
  rationale: Исправление сохраняет еврейское чтение в основном тексте и не гармонизирует его с существенно отличающимся греческим изречением. Убрано невыраженное модальное усиление во второй строке; местоименное усиление הוּא передано словом «сам». Примечание уточнено по греческому образу, не приписывая котлу действие, которого текст не называет.
