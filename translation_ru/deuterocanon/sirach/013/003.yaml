review_pass:
  verdict: revise
  source_fidelity: 'Основной текст в целом верно передаёт еврейское двучленное изречение: богатый, поступая неправо, проявляет надменность, тогда как бедный в таком положении молит о милости. Однако «ему приходится» добавляет модальное значение внешней необходимости, которое не выражено непосредственно глаголом יִתְחַנָּן («умоляет, просит о милости»). Греческое примечание передаёт образ в целом, но формулировка «Один ударит другой» неточно представляет греческий синтаксис: речь о глиняном горшке, который ударяется о котёл и разбивается.'
  naturalness: «Поступает несправедливо» и «ведёт себя надменно» естественны в современном литературном русском и сохраняют афористический регистр. «Молит о милости» точнее и непосредственнее, чем безличное «ему приходится просить о милости», при этом сохраняет оттенок униженной мольбы.
  terminology: «Богатый» и «бедный» адекватно передают עָשִׁיר и דַּל. «Надменно» передаёт значение יִתְנַוֶּה без чрезмерной интерпретации. «Милость» уместна для יִתְחַנָּן. В примечании «глиняный горшок» и «котёл» сохраняют различие сосудов в греческом тексте.
  issues:
  - severity: medium
    issue: 'В основной строке добавлено значение необходимости: «ему приходится».'
    rationale: Еврейский יִתְחַנָּן обозначает мольбу или просьбу о милости; источник не выражает явно «приходится»/«вынужден». Лучше не усиливать модальность.
  - severity: medium
    issue: Греческое разночтение изложено с неточным распределением действия между сосудами.
    rationale: В греческом тексте после вопроса говорится о горшке, который ударяется о котёл и разбивается; «Один ударит другой — и тот разобьётся» создаёт не заданную текстом картину двух различных действующих лиц.
  revised_text: Если богатый поступает несправедливо, он ещё и ведёт себя надменно; а если бедный поступает несправедливо, он сам молит о милости.[a]
