  text: If a rich man does wrong[a], he acts arrogantly; but if a poor man does wrong, he himself pleads for mercy.
translation:
  language: ru
  text: Если богатый поступает несправедливо, он ещё и ведёт себя надменно; а если бедный поступает несправедливо, он сам молит о милости.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь существенно отличается: «Что общего у глиняного горшка с котлом? Горшок ударится о котёл и разобьётся».'
    reason: alternative_reading
lexical_decisions:
- source_word: עָשִׁיר
  choice: богатый
  rationale: Прямое соответствие сохранившемуся еврейскому тексту; субстантивированное прилагательное естественно звучит по-русски.
- source_word: יְעַוֶּה
  choice: поступает несправедливо
  rationale: Глагол выражает неправое, несправедливое действие; формулировка сохраняет нравственную широту и не сводит смысл к конкретному преступлению.
- source_word: יִתְנַוֶּה
  choice: ещё и превозносится
  rationale: 'Редкая форма в данном контексте передаёт высокомерное, надменное поведение. «Ещё и» естественно подчёркивает возмутительное усиление: совершив неправду, богатый держится высокомерно.'
- source_word: דַּל
  choice: бедный
  rationale: Передаёт социально и материально слабого человека и сохраняет прямое противопоставление богатому.
- source_word: יִתְחַנָּן
  choice: ему приходится просить о милости
  rationale: Глагол означает умолять, искать милости. Безлично-модальная конструкция передаёт подразумеваемое социальное принуждение, не уточняя адресата просьбы, которого источник не называет.
theological_decisions:
- issue: Существенное расхождение еврейского и греческого свидетельств
  choice: В основном тексте переведено сохранившееся еврейское изречение о богатом и бедном.
  alternative: 'Греческий текст: «Что общего у глиняного горшка с котлом? Один ударит другой — и тот разобьётся».'
  rationale: Предоставленный еврейский текст имеет высокую степень уверенности и образует ясное самостоятельное изречение. Греческое свидетельство содержит совершенно иной образ, поэтому его нельзя незаметно соединять с еврейским; существенное разночтение открыто сохранено в примечании.
- issue: Кто оказывает милость бедному
  choice: Адресат просьбы не указан.
  alternative: Уточнить, что бедный просит богатого или судью.
  rationale: Еврейский глагол указывает на мольбу о милости, но не называет того, к кому она обращена; конкретизация необоснованно разрешила бы неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством афористической мудрости. Параллелизм «если богатый… а если бедный…» сохранён; местоименное усиление передано не буквально, а естественными русскими средствами. Разночтение с греческим не гармонизировано.
