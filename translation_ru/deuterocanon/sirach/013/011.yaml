base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/013/011.yaml
  text: Do not trust his ease with you[a], and do not believe his many words; for with much talk he is testing you, and while laughing with you he is probing you.
translation:
  language: ru
  text: 'Не будь с ним слишком непринуждён[a] и не верь его многословию: ведь многими речами он испытывает тебя и, смеясь с тобой, исследует тебя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не позволяй себе свободно говорить с ним». Еврейское слово буквально означает «свободу»; в данном контексте речь может идти о непринуждённой близости или неосторожно свободной речи. Греческий параллельный текст особенно поддерживает последнее значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטַח
  choice: Не полагайся
  rationale: Естественно передаёт запрет доверяться или питать уверенность; в сочетании с отвлечённым существительным звучит по-русски лучше, чем «не доверяй свободе».
- source_word: לְחֹפֶשׁ עִמּוֹ
  choice: на свободу в общении с ним
  rationale: Сохраняет буквальный образ «свободы» и передаёт контекстуальный смысл непринуждённости и неосторожной откровенности. Греческое ἰσηγορεῖσθαι подтверждает оттенок свободной или равной речи.
- source_word: וְאַל תַּאֲמִין לְרֹב שִׂיחוֹ
  choice: и не верь его многословию
  rationale: Глагол относится к многочисленным речам собеседника. «Многословие» кратко и естественно выражает изобилие слов, не утверждая отдельно, что каждое слово ложно.
- source_word: כִּי מַרְבִּית שִׂיחוֹ
  choice: ведь обилием речей
  rationale: 'Передаёт причинную связь и инструментальный смысл: множество речей служит средством испытания.'
- source_word: נִסּיוֹן
  choice: он испытывает тебя
  rationale: Еврейская формулировка сжата, а греческое πειράσει σε ясно указывает на действие, направленное на адресата.
- source_word: וְשֹׂחֵק לְךָ
  choice: и, смеясь с тобой
  rationale: Сохраняет одновременность дружелюбного внешнего поведения и скрытого расспроса; не сужает значение до шутки или улыбки.
- source_word: וַחֲקָרֶךָ
  choice: выведывает всё о тебе
  rationale: Корень выражает тщательное исследование или расспрос. В межличностном контексте «выведывает» естественно передаёт скрытое намерение, тогда как дополнение «о тебе» сохраняет направленность действия.
