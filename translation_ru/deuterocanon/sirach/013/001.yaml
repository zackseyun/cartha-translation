  text: Whoever touches pitch will have his hand stick to it[a], and whoever associates with a scoffer will learn his way.
translation:
  language: ru
  text: Кто прикасается к смоле, у того к ней прилипнет рука[a], и кто водится с насмешником, тот научится его образу действий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Кто прикасается к смоле, тот осквернится, и кто общается с гордецом, тот станет подобен ему». В еврейском тексте сказано «насмешник» и «научится его образу действий».'
    reason: alternative_reading
lexical_decisions:
- source_word: נוֹגֵעַ בְּזֶפֶת
  choice: Кто прикасается к смоле
  rationale: Причастная конструкция выражает общее правило. «Кто прикасается» естественно передаёт её обобщённый смысл, а «смола» — липкое вещество в основе образа.
- source_word: תִּדְבַּק יָדוֹ
  choice: у того рука прилипнет к ней
  rationale: Сохранён конкретный еврейский образ прилипания руки; местоимение «к ней» естественно восполняет подразумеваемый объект.
- source_word: וְחוֹבֵר אֶל
  choice: и кто водится с
  rationale: Разговорно-литературное «водится с» ясно выражает постоянное общение и сближение, не перегружая пословицу формальностью.
- source_word: לֵץ
  choice: насмешником
  rationale: В еврейской литературе мудрости слово обозначает насмешника, глумящегося и отвергающего наставление. Этот смысл следует еврейскому свидетелю, в отличие от греческого «гордец».
- source_word: יִלְמַד דַּרְכּוֹ
  choice: тот научится его пути
  rationale: Формулировка близко передаёт единственное число «его путь» и нравственное усвоение чужого образа поведения, не заменяя его греческим толкованием «станет подобен ему».
theological_decisions:
- issue: Расхождение между еврейским текстом и греческой параллелью
  choice: 'В основном тексте следовать еврейскому чтению: рука «прилипнет», человек «научится пути» насмешника.'
  alternative: 'Греческая параллель: прикоснувшийся к смоле «осквернится», а общающийся с гордецом «станет подобен ему».'
  rationale: Сохранившийся еврейский текст имеет приоритет. Греческий передаёт сходную нравственную мысль, но смещает акцент с прилипания и усвоения пути на осквернение и уподобление; различие сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким пословичным строем. Конкретный образ еврейского текста сохранён; синтаксис сделан естественным и понятным обычному читателю.
