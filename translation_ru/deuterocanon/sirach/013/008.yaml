  text: Be careful not to be too bold[a], and do not make yourself like those who lack understanding.
translation:
  language: ru
  text: 'Берегись: не будь слишком самоуверен[a] и не уподобляйся неразумным.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая параллель: «Смотри, чтобы тебе не сбиться с пути, и не унизься среди своей радости». Еврейский и греческий тексты этого стиха существенно различаются.'
    reason: textual_variant
lexical_decisions:
- source_word: הִשָּׁמֵר
  choice: Берегись
  rationale: Возвратный императив передаёт прямое предостережение; «берегись» естественно и выразительно в современной литературной русской речи.
- source_word: אַל תִּרְהַב מְאֹד
  choice: не будь слишком самоуверен
  rationale: רהב обозначает чрезмерную смелость, самонадеянность или вызывающую уверенность; «самоуверен» передаёт предосудительную чрезмерность, а «слишком» отражает מְאֹד, не сводя выражение исключительно к гордости.
- source_word: וְאַל תִּדְמֶה
  choice: не уподобляйся
  rationale: דמה здесь имеет значение «быть похожим, становиться подобным»; русский возвратный глагол естественно передаёт волевой оттенок предостережения.
- source_word: בַּחֲסֵירֵי מַדָּע
  choice: неразумным
  rationale: Буквально — «лишённым знания/понимания». В контексте литературы мудрости «неразумным» кратко и естественно выражает недостаток здравого понимания, а не простую неосведомлённость.
theological_decisions:
- issue: Существенное расхождение еврейского текста и греческой параллели в обеих частях стиха
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; греческий вариант приведён в сноске.
  alternative: 'Греческий текст: «Смотри, чтобы тебе не сбиться с пути, и не унизься среди своей радости».'
  rationale: Когда еврейский текст Сираха сохранился с высокой уверенностью, он служит основным источником. Поскольку греческая параллель отражает существенно иное чтение, различие не сглаживается, а документируется как текстуальный вариант.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной афористичностью, уместной для наставления в книге Премудрости. Двоеточие после «Берегись» ясно связывает предупреждение с двумя последующими запретами.
