translation:
  language: ru
  text: Какой мир может быть между гиеной и собакой? Какой мир может быть между богачом и бедняком?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Что общего у волка с ягнёнком? Так и грешник — с благочестивым человеком». В сохранившемся еврейском тексте вместо этого стоят «гиена ... собака» и «богач ... бедняк».'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאַיִן
  choice: Какой ... может быть
  rationale: Буквально выражение связано с вопросом «откуда?», но здесь это риторическое отрицание возможности мирных отношений; выбранная русская формулировка естественно передаёт этот смысл.
- source_word: שָׁלוֹם
  choice: мир
  rationale: Слово обозначает мирные, согласные отношения; «мир» прямо передаёт еврейскую лексику и сохраняет афористичность.
- source_word: צָבוּעַ
  choice: гиена
  rationale: В позднем библейском и послебиблейском еврейском это слово обычно обозначает гиену. Отличающийся греческий образ не должен подменять сохранившееся еврейское чтение.
- source_word: כָּלֶב
  choice: собака
  rationale: Прямое и однозначное соответствие.
- source_word: עָשִׁיר
  choice: богач
  rationale: Краткое и естественное обозначение богатого мужчины, подходящее для параллельной структуры изречения.
- source_word: רָשׁ
  choice: бедняк
  rationale: Передаёт значение бедного, нуждающегося мужчины и образует естественную в современном русском парную оппозицию «богач — бедняк».
theological_decisions:
- issue: Расхождение между сохранившимся еврейским текстом и греческой параллелью
  choice: 'В основном тексте передать еврейское чтение: «гиена ... собака» и «богач ... бедняк».'
  alternative: 'Греческая параллель: «Что общего у волка с ягнёнком? Так и у грешника с благочестивым».'
  rationale: При наличии еврейского свидетеля приоритет отдаётся ему. Греческий текст содержит существенно иной образ и переносит противопоставление из социально-экономической области в нравственную, поэтому это разночтение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык; краткая, выразительная форма изречения. Повтор вопросительной конструкции сохраняет еврейский параллелизм. Слова «богач» и «бедняк» понятны широкой аудитории и стилистически уравновешены.
