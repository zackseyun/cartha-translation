  text: When a poor man speaks[a], they say, “Who is this?” and if he stumbles[b], they push him down all the more.
translation:
  language: ru
  text: 'Когда бедняк говорит, люди спрашивают: «Кто это такой?» А если он спотыкается, они тоже толкают его.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «они тоже толкают его». Глагол может обозначать толчок, отталкивание или действие, усугубляющее падение; смысл в том, что окружающие не помогают споткнувшемуся бедняку, а обращаются с ним враждебно.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая традиция здесь существенно отличается: «Богатство хорошо, когда в нём нет греха, а бедность дурна в устах благочестивого». Основной перевод следует сохранившемуся еврейскому тексту.'
    reason: textual_variant
lexical_decisions:
- source_word: דַּל
  choice: бедняк
  rationale: Передаёт человека бедного, слабого или низкого по общественному положению; форма единственного числа и обобщённый характер изречения сохранены.
- source_word: דּוֹבֵר
  choice: говорит
  rationale: Причастие имеет обобщённо-временное значение; настоящее время естественно передаёт повторяющуюся ситуацию.
- source_word: מִי זֶה
  choice: Кто это такой?
  rationale: Сохраняет прямой вопрос и его пренебрежительный оттенок в современном русском.
- source_word: נִתְקַל
  choice: споткнётся
  rationale: Сохраняет конкретный образ, допускающий также переносный смысл неудачи или падения.
- source_word: גַּם הֵם יֶהְדֳּפוּהוּ
  choice: они и сами толкают его
  rationale: Формально сохраняет גם הם — «они тоже / и сами» — и значение הדף «толкать, отталкивать», не превращая неоднозначную формулировку в однозначное усиление падения.
theological_decisions:
- issue: Расхождение еврейского и греческого текста
  choice: Основной текст следует сохранившемуся еврейскому свидетельству.
  alternative: 'Греческая традиция: «Хорошо богатство, в котором нет греха, и дурна бедность в устах благочестивого».'
  rationale: Предоставленный еврейский источник имеет высокую степень уверенности и существенно отличается от греческой параллели; различие следует сохранить в примечании, а не сглаживать.
translation_notes:
  register: Современный литературный русский язык; краткая, выразительная форма изречения. «Бедняк» сохраняет социальный оттенок, а «Кто это такой?» передаёт пренебрежение. Порядок маркеров выбран так, чтобы примечание [a] относилось к заключительной еврейской фразе, а [b] — ко всему стиху как текстовому варианту.
