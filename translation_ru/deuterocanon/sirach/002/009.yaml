base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/009.yaml
  text: You who fear Yahweh[a], hope for good[b], and for everlasting joy and mercy.
translation:
  language: ru
  text: Боящиеся Яхве, надейтесь на добро[a], на вечную радость и милость[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «на блага» — существительное стоит во множественном числе.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово, переведённое как «милость», может также означать «неизменная любовь» или «доброта»; в греческом параллельном тексте также стоит слово «милость».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: Боящиеся Яхве
  rationale: Причастная форма во множественном числе здесь служит прямым обращением к группе людей. Русское «Боящиеся Яхве» сохраняет и обращение, и благоговейный смысл глагола ירא.
- source_word: קַוּוּ
  choice: надейтесь
  rationale: Повелительная форма выражает исполненное ожидания упование. «Надейтесь» передаёт как еврейское значение, так и греческое ἐλπίσατε, не сужая смысл до простого ожидания.
- source_word: לְטוֹב
  choice: на добро
  rationale: Еврейское существительное стоит в единственном числе и обозначает добро или благо в широком смысле. Формулировка «на добро» сохраняет эту обобщённость; греческий параллельный текст имеет множественное число «блага».
- source_word: וּלְשִׁמְחַת עוֹלָם
  choice: на вечную радость
  rationale: שִׂמְחָה означает радость, а עוֹלָם указывает на непреходящую длительность. «Вечная радость» естественно и точно передаёт сочетание.
- source_word: וָחֶסֶד
  choice: и милость
  rationale: חֶסֶד может означать милость, неизменную любовь, верность или доброту. «Милость» уместна в ряду ожидаемых благ и согласуется с греческим ἐλέους, не устраняя более широкий смысл еврейского слова.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» прямо передаёт собственное имя в еврейском тексте и следует принятому для проекта решению. Греческое Κύριον отражает традиционную почтительную замену, но не требует скрывать имя в переводе с сохранившегося еврейского текста.
- issue: Соотношение еврейского текста и греческого параллельного свидетельства
  choice: Переводить прежде всего по сохранившемуся еврейскому тексту, сверяя его с греческим
  alternative: Следовать только греческому тексту и передать «блага» во множественном числе
  rationale: Еврейский текст данного стиха сохранился и потому является основным свидетельством. Греческий параллельный текст подтверждает общий смысл, но его множественное ἀγαθά не должно без необходимости заменять еврейское единственное טוֹב.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным призывом. Причастный оборот сохранён как прямое обращение; синтаксис сделан естественным для русского, а повтор предлога «на» ясно связывает перечисленные блага с повелением «надейтесь».
