base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/018.yaml
  text: Let us fall into the hand of Yahweh[a], and not into the hand of man, for as his greatness is[b], so also is his mercy.
translation:
  language: ru
  text: Предадимся в руку Яхве[a], а не в руку человека, потому что как велик Он, так велика и милость Его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — «в руки Господа… в руки людей»; еврейский текст в обоих случаях употребляет единственное число «рука». Перевод следует еврейскому свидетельству.
    reason: textual_variant
  - marker: b
    text: 'Или: «верная любовь». Еврейское חֶסֶד может означать милость, неизменную доброту или верную любовь; в греческом тексте — «милость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפֹּל
  choice: Предадимся
  rationale: Когортатив первого лица множественного числа выражает призыв. Буквальное «падём» сохраняло бы образ, но по-русски здесь могло бы ошибочно восприниматься как физическое падение; «предадимся в руку» естественно передаёт добровольное вверение себя чьей-либо власти.
- source_word: בְּיַד
  choice: в руку
  rationale: Сохранено единственное число еврейского текста и библейский образ руки как власти; греческий параллельный текст употребляет множественное число.
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, прямо стоящее в еврейском тексте, без замены титулом.
- source_word: אָדָם
  choice: человека
  rationale: Родительный падеж после «в руку»; слово употреблено обобщённо и сохраняет противопоставление Бога человеку.
- source_word: כְּגָדְלוֹ
  choice: как велик Он
  rationale: Идиоматично передаёт сравнительную конструкцию כ...כן и значение величия Бога, не утяжеляя русскую фразу отвлечённым существительным.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: В данном контексте חֶסֶד обозначает милосердную, верную благость Бога; «милость» согласуется с греческим ἔλεος, а возможный оттенок верной любви отмечен в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский источник содержит тетраграмматон как личное имя; транслитерация сохраняет это различие.
- issue: Значение חֶסֶד
  choice: милость
  alternative: верная любовь
  rationale: Контекст противопоставляет человеческую власть Божьему состраданию, а греческий параллельный текст подтверждает значение «милость»; при этом за словом сохраняется возможный оттенок неизменной, верной любви.
- issue: Образ «пасть/предаться в руку»
  choice: Предадимся в руку
  alternative: Падём в руку
  rationale: Выбрана естественная русская формулировка, передающая вверение себя Божьей власти. Она не устраняет напряжение между Божьим величием и милостью, но избегает ложного впечатления о буквальном падении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «милость Его» поддерживает параллелизм и достоинство речи; формы понятны широкому читателю.
