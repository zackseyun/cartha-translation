  yaml_path: translation/deuterocanon/sirach/002/014.yaml
  text: Woe to you who have lost hope[b][a]; what will you do at the visitation of Yahweh?
translation:
  language: ru
  text: Горе вам, потерявшим надежду[a]! Что вы будете делать при посещении Господнем[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «потерявшим стойкость» или «потерявшим терпение»; в еврейском — «надежду».'
    reason: alternative_reading
  - marker: b
    text: Буквально выражение говорит о посещении Господом — Его деятельном вмешательстве; в данном контексте оно имеет грозный оттенок суда.
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹי
  choice: Горе вам
  rationale: Сохраняет одновременно скорбный и угрожающий тон еврейского междометия и естественно звучит в русском пророческом и назидательном контексте.
- source_word: אוֹבְדֵי תִּקְוָה
  choice: потерявшим надежду
  rationale: Еврейское сочетание естественнее всего обозначает тех, кто утратил надежду; причастная конструкция сохраняет прямое обращение.
- source_word: תִּקְוָה
  choice: надежду
  rationale: Основное значение слова — «надежда, ожидание»; «надежда» здесь наиболее естественно и ясно.
- source_word: בִּפְקוֹד
  choice: когда ... посетит
  rationale: Глагольная русская конструкция передаёт действие Бога естественнее отвлечённого существительного «посещение», не уточняя его однозначно как наказание.
- source_word: יְהֹוָה
  choice: Господь
  rationale: Тетраграмматон передан традиционным русским библейским соответствием «Господь».
theological_decisions:
- issue: Следует ли прямо назвать Божье посещение наказанием
  choice: когда Господь посетит вас
  alternative: когда Господь накажет вас
  rationale: Корень פקד может обозначать Божье деятельное внимание или вмешательство, а в данном грозном контексте подразумевает суд. Формулировка «посетит вас» сохраняет эту смысловую широту и не превращает подразумеваемое наказание в единственно возможное лексическое значение.
- issue: Следует ли принять греческое «стойкость/терпение» вместо еврейского «надежда»
  choice: надежду
  alternative: стойкость / терпение
  rationale: Сохранившийся еврейский текст является первичным и ясно читает תִּקְוָה, «надежда»; греческий вариант важен как древнее свидетельство и указан в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Риторический вопрос и угрожающий оттенок сохранены; синтаксис сделан естественным для широкого круга читателей.
