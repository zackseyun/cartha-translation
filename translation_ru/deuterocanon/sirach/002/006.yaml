lexical_decisions:
- source_word: הַאֲמֵן בּוֹ / πίστευσον αὐτῷ
  choice: Положись на него
  rationale: Еврейский императив от אמן в породе hифиль и греческое πίστευσον выражают не только умственное согласие, но и доверие, на которое человек опирается. «Положись на него» естественно передаёт этот призыв по-русски.
- source_word: יַחֲזִיק בְּךָ / ἀντιλήμψεται σου
  choice: он поддержит тебя
  rationale: Обе формы могут обозначать, что кого-либо крепко держат, поддерживают или ему помогают. «Поддержит» сохраняет образ надёжной опоры и звучит естественно.
- source_word: יַשֵּׁר אָרְחוֹתֶיךָ / εὐθύνας τὰς ὁδούς σου
  choice: выпрями свои пути
  rationale: 'Еврейская и греческая формы поддерживают повелительное чтение: обращение к слушателю продолжается. «Пути» сохраняют традиционную метафору образа и направления жизни.'
- source_word: וְקַוֵּה אֵלָיו / καὶ ἔλπισον ἐπʼ αὐτόν
  choice: и надейся на него
  rationale: Еврейское קוה может означать ожидание с надеждой, а греческое ἐλπίζω ясно указывает на надежду. Русское выражение передаёт общий смысл обоих свидетельств.
theological_decisions:
- issue: Субъект и наклонение средней части стиха
  choice: 'Повеление читателю: «выпрями свои пути»'
  alternative: 'Обетование о действии Бога: «он направит (или выпрямит) твои пути»'
  rationale: Последовательность повелительных форм в еврейском тексте и греческой параллели благоприятствует продолжению обращения к слушателю. Альтернативное традиционное понимание отмечено, но не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная форма наставления в стиле литературы мудрости. Местоимения, относящиеся к Богу, написаны со строчной буквы как нейтральное редакционное решение. Метафора жизненных «путей» сохранена.
