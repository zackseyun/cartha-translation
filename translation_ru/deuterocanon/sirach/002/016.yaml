base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/016.yaml
  text: Those who fear Yahweh will seek his favor[b][a], and those who love him will learn his law.
translation:
  language: ru
  text: Боящиеся ГОСПОДА будут искать Его благоволения, а любящие Его будут изучать Его наставление[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его закон».'
    reason: Лексическая альтернатива для תוֹרָתוֹ.
  - marker: b
    text: 'В греческом тексте: «а любящие Его исполнятся законом».'
    reason: Существенное разночтение греческой параллели.
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: Боящиеся ГОСПОДА
  rationale: Передаёт устойчивое библейское понятие благоговейного страха перед Яхве и естественно звучит по-русски.
- source_word: יְהֹוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона; прописные буквы отличают Божественное имя от титула.
- source_word: יְבַקְּשׁוּ
  choice: будут искать
  rationale: Имперфект выражает ожидаемое или характерное действие; соответствует также греческому ζητήσουσιν.
- source_word: רְצוֹנוֹ
  choice: Его благоволения
  rationale: רצון здесь обозначает благосклонность, принятие или доброе расположение; греческое εὐδοκία поддерживает именно этот смысл.
- source_word: וְאֹהֲבָיו
  choice: а любящие Его
  rationale: Суффикс отсылает к ГОСПОДУ; причастная конструкция кратка, естественна и сохраняет параллелизм.
- source_word: יִלְמְדוּ
  choice: будут изучать
  rationale: Qal глагола למד означает учиться, изучать. «Изучать» естественно сочетается с Божьим наставлением и не предполагает пассивного значения.
- source_word: תוֹרָתוֹ
  choice: Его наставление
  rationale: תורה означает не только законодательный свод, но и наставление, учение. Такой выбор сохраняет широту еврейского слова; традиционное «закон» отмечено в сноске.
theological_decisions:
- issue: Расхождение еврейского и греческого текста во второй половине стиха
  choice: 'Следовать еврейскому чтению: «будут изучать Его наставление»'
  alternative: 'Греческий текст: «исполнятся законом»'
  rationale: Сохранившийся еврейский текст имеет высокую степень надёжности и служит первичным источником. Существенное греческое разночтение сохранено в сноске без попытки согласовать оба чтения.
- issue: Передача תוֹרָה
  choice: «наставление» в основном тексте
  alternative: «закон»
  rationale: «Наставление» точнее сохраняет семантическую широту תורה и не сводит его к юридическим предписаниям; традиционная передача дана как допустимая альтернатива.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. Сохранён синтаксический параллелизм двух частей; «ГОСПОДЬ» передаёт Божественное имя, а прописное «Его» соответствует принятому русскому религиозному письму.
