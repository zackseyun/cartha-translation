  text: Prepare your heart[a], and be strong; and do not be alarmed in a time of calamity.
translation:
  language: ru
  text: Приготовь своё сердце и будь твёрд; не поддавайся смятению в день бедствия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «не спеши во время испытания (или посещения)». Еврейский текст подчёркивает, что не следует впадать в смятение, а греческий — что в испытании не следует действовать поспешно.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָכֵן
  choice: приготовь
  rationale: Hифиль от כון означает «приготовить, утвердить, привести в порядок». «Приготовь» точно и естественно передаёт основной смысл; греческое εὐθυνον («направь, выпрями») дополнительно указывает на внутреннюю собранность.
- source_word: לִבְּךָ
  choice: своё сердце
  rationale: לֵב обозначает сердце как средоточие мысли, воли и решимости. Русское «сердце» сохраняет широкий библейский образ.
- source_word: וְהִתְחַזֵּק
  choice: будь твёрд
  rationale: Возвратная форма חזק призывает укрепиться и проявить стойкость. «Будь твёрд» звучит естественно и согласуется с греческим καρτέρησον — «держись стойко, будь стойким».
- source_word: וְאַל תִּבָּהֵל
  choice: не смущайся
  rationale: בהל означает быть потрясённым, смятённым или испуганным. «Не смущайся» здесь передаёт внутреннее смятение, не ограничивая смысл одним лишь страхом.
- source_word: בְּיוֹם אֵד
  choice: в день бедствия
  rationale: Это близкая и естественная передача буквального выражения «в день бедствия/несчастья»; «день» может обозначать пору наступившего испытания, а не только календарные сутки.
theological_decisions:
- issue: Различие еврейского и греческого текста в заключительной части
  choice: 'Основной текст следует еврейскому чтению: «не смущайся в день бедствия».'
  alternative: 'Греческий текст: «не спеши во время испытания (или посещения)».'
  rationale: Сохранившийся еврейский текст имеет высокий уровень достоверности и потому положен в основу. Греческий свидетель передаёт иной оттенок — предостережение от поспешности под давлением испытания; это различие сохранено в сноске, а не устранено толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Формы повелительного наклонения кратки и ясны; сохранены традиционные, но понятные образы «сердце» и «день бедствия».
