  text: You who fear Yahweh[a], wait for his mercy, and do not turn aside, lest you fall.
translation:
  language: ru
  text: Вы, боящиеся Яхве, ждите его милости[a] и не уклоняйтесь, чтобы не пасть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское חסד может также означать верную, неизменную любовь или благость; в греческом тексте здесь стоит слово «милость».
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה / οἱ φοβούμενοι Κύριον
  choice: Вы, боящиеся Яхве
  rationale: Еврейская конструкция и греческое причастие обращены непосредственно к группе людей. Местоимение «вы» сохраняет силу прямого призыва, а «боящиеся» передаёт благоговейный страх, не сводя его только к испугу.
- source_word: חַכּוּ / ἀναμείνατε
  choice: ждите
  rationale: Повелительная форма выражает терпеливое ожидание. Русское «ждите» естественно сочетается с дополнением «милости» и не добавляет оттенка, который внёс бы глагол «надейтесь».
- source_word: לְחַסְדּוֹ / τὸ ἔλεος αὐτοῦ
  choice: его милости
  rationale: חסד может обозначать верную любовь, благость или милость; греческое ἔλεος непосредственно поддерживает здесь перевод «милость».
- source_word: וְאַל תִּטּוּ / καὶ μὴ ἐκκλίνητε
  choice: не уклоняйтесь
  rationale: Формулировка сохраняет образ отклонения от верного пути, не добавляя отсутствующего в тексте уточнения о том, от чего именно нельзя уклоняться.
- source_word: פֶּן תִּפֹלוּ / ἵνα μὴ πέσητε
  choice: чтобы не пасть
  rationale: Так передаётся предупреждение о возможном падении без уточнения, является ли оно нравственным, духовным или связано с жизненными обстоятельствами.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; личное имя передано формой «Яхве», а не заменено титулом.
- issue: Смысл חסד с учётом греческой параллели
  choice: милость
  alternative: верная любовь; неизменная любовь; благость
  rationale: Хотя חסד обладает широким смысловым диапазоном, греческое ἔλεος служит веским свидетельством в пользу «милости» именно в этом стихе; альтернативный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством прямого наставления. Сохранены обращение во множественном числе, метафора уклонения и неопределённость характера возможного падения.
