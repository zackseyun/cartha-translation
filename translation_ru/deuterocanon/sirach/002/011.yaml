  text: Ибо Господь сострадателен и милостив; Он прощает грехи и спасает во время бедствия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָחוּם
  choice: сострадателен
  rationale: Передаёт милосердное сострадание Господа и сохраняет отличие от следующего חַנּוּן.
- source_word: חַנּוּן
  choice: милостив
  rationale: Естественное и традиционно узнаваемое соответствие слову со значением благосклонности и милости.
- source_word: יְהֹוָה
  choice: Господь
  rationale: Общепринятая русская передача тетраграмматона в библейском тексте.
- source_word: לַעֲוֹנוֹת
  choice: грехи
  rationale: Контекстуально ясная передача множественного עָוֹן; здесь речь о нравственной вине и проступках, которые Бог прощает.
- source_word: בְּעֵת צָרָה
  choice: во время бедствия
  rationale: Сохраняет временное значение конструкции и передаёт צָרָה как тяжёлое, стеснённое положение.
theological_decisions:
- issue: Субъект действий «прощает» и «спасает»
  choice: Сохранён единый субъект — Господь; местоимение «Он» выражено явно.
  alternative: 'Опустить местоимение: «прощает грехи и спасает…»'
  rationale: Русское явное «Он» делает синтаксис прозрачным, не добавляя нового богословского содержания.
- issue: Передача עֲוֹנוֹת
  choice: «грехи»
  alternative: «беззакония» или «вины»
  rationale: «Грехи» соответствует греческой параллели ἁμαρτίας и естественно сочетается с глаголом «прощает», не сужая смысл до юридической виновности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Пара прилагательных сохранена без архаизации; точка с запятой отражает смысловой переход от качества Господа к Его действиям.
