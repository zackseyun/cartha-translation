base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/010.yaml
  text: 'Look to the generations of old and see: who believed in Yahweh and was put to shame? Or who trusted in him and was abandoned? Or who called on him and was not answered?[a][b]'
translation:
  language: ru
  text: 'Взгляните на прежние поколения: кто верил в Яхве и был посрамлён? Или кто полагался на Него и был оставлен?[a] Или кто взывал к Нему и не получил ответа?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «кто оставался в страхе перед Ним и был оставлен?» В сохранившемся еврейском тексте: «кто полагался на Него и был оставлен?»'
    reason: alternative_reading
  - marker: b
    text: 'В греческом тексте: «кто воззвал к Нему, и Он пренебрёг им?» В еврейском тексте: «кто взывал к Нему и не получил ответа?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּיטוּ לְדוֹרוֹת רִאשׂוֹנִים
  choice: Взгляните на прежние поколения
  rationale: Императив множественного числа призывает обратиться к опыту предшествующих поколений. «Прежние поколения» естественно передаёт историческую ретроспективу без излишней архаизации.
- source_word: הֶאֱמִין בַּיהֹוָה
  choice: верил в Яхве
  rationale: Конструкция с אמן и предлогом ב выражает доверие и веру, направленные на Яхве. «Верил в» сохраняет отличие от следующего глагола בטח и не сводит смысл лишь к признанию истинности слов.
- source_word: וַיֵּבוֹשׁ
  choice: был посрамлён
  rationale: Глагол בוש здесь обозначает постыдный итог неоправдавшегося упования. Пассивная формулировка передаёт результативный оттенок и соответствует греческому κατῃσχύνθη.
- source_word: בָּטַח בּוֹ
  choice: полагался на Него
  rationale: בטח означает довериться, искать опоры и безопасности. «Полагался» сохраняет смысл практического доверия и отличает этот глагол от предшествующего אמן.
- source_word: וְנֶעֱזַב
  choice: был оставлен
  rationale: Пассив от עזב означает оказаться оставленным без помощи. «Был оставлен» прямо передаёт еврейский текст; более сильное «был покинут» также возможно.
- source_word: קָרָא אֵלָיו
  choice: взывал к Нему
  rationale: В данном контексте идиома обозначает обращённый к Богу призыв или молитву. «Взывал» кратко и достойно передаёт религиозный смысл.
- source_word: וְלֹא נֶעֱנָה
  choice: не получил ответа
  rationale: Пассивная форма ענה означает «ему не ответили / он не был отвечен». Русское «не получил ответа» звучит естественно и не добавляет идеи, будто его вовсе не услышали.
- source_word: ἐνέμεινεν τῷ φόβῳ αὐτοῦ
  choice: 'вариант вынесен в сноску: «оставался в страхе перед Ним»'
  rationale: Греческий текст расходится с сохранившимся еврейским чтением «полагался на Него». Поскольку надёжный еврейский текст здесь имеется, он положен в основу, а значимый греческий вариант сохранён в примечании.
- source_word: ὑπερεῖδεν αὐτόν
  choice: 'вариант вынесен в сноску: «Он пренебрёг им»'
  rationale: Греческий глагол означает не заметить, оставить без внимания или пренебречь, тогда как еврейский текст говорит об отсутствии ответа. Различие сохраняется в примечании.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблён тетраграмматон. Транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Расхождения между еврейским и греческим свидетелями текста Сираха
  choice: Основной текст следует сохранившемуся еврейскому чтению; греческие варианты приведены в сносках
  alternative: Поставить греческие чтения в основной текст
  rationale: Еврейский текст данного стиха сохранился и оценён как надёжный. Греческий параллельный текст служит важным свидетельством, поэтому его содержательные расхождения не устраняются молча, а отмечаются в сносках.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллельные риторические вопросы сохранены; различие между אמן («верил») и בטח («полагался») передано разными русскими глаголами. Добавленное в греческом «и посмотрите» не внесено, поскольку основной текст следует сохранившемуся еврейскому свидетелю.
