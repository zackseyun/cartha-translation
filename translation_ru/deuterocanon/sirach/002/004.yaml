  text: Всё, что постигает тебя, принимай, и, когда ты сломлен[a], будь терпелив.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «в твоём сокрушении»; греческий текст: «при переменах твоего унижения».'
