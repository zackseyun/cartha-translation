lexical_decisions:
- source_word: כָּל הַבָּא עָלֶיךָ
  choice: Всё, что постигает тебя
  rationale: 'Буквально: «всё, что приходит на тебя». Глагол «постигает» естественно передаёт нежеланные обстоятельства, не сужая их круга; греческая параллель также говорит обо всём, что бывает возложено на человека.'
- source_word: קַבֵּל
  choice: принимай
  rationale: Передаёт призыв принимать выпавшие обстоятельства без оттенка радушного одобрения, который был бы избыточен.
- source_word: וּבְשִׁבְרְךָ
  choice: в своей сокрушённости
  rationale: Следует сохранившемуся еврейскому чтению со значением сломленности или сокрушённости. Греческая параллель отражает более развёрнутое чтение о переменах униженного состояния; расхождение сохранено в примечании.
- source_word: הַאֲרֵךְ רוּחַ
  choice: будь терпелив
  rationale: Еврейская идиома «удлиняй дух» означает проявлять долготерпение; греческое μακροθύμησον подтверждает значение терпеливой стойкости.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и отличающейся греческой параллели
  choice: Основной текст следует еврейскому «в своей сокрушённости».
  alternative: «при переменах своего унижения»
  rationale: Еврейский свидетель здесь первичен и достаточно понятен, хотя источник отмечен как minor_mismatch. Греческая версия содержит идею «перемен» и «унижения», которую нельзя молча включить в еврейский текст; поэтому она приведена как вариант в примечании.
translation_notes:
  register: Современный литературный русский язык; краткая наставительная формулировка с достоинством и без архаизмов. «Сокрушённость» сохраняет образ еврейского текста, а примечание честно отмечает отличие греческой традиции.
