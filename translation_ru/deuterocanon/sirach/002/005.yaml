  text: For gold is tested in fire[a], and men who are accepted, in the furnace of affliction.
translation:
  language: ru
  text: 'Ибо золото испытывается в огне,

    а люди — в горниле страдания.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «а угодные люди — в горниле унижения».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִבָּחֵן
  choice: испытывают
  rationale: Глагол בחן означает проверять, испытывать, удостоверять качество. «Испытывают» естественно передаёт образ проверки золота, не добавляя значения очищения, которого сам глагол прямо не выражает.
- source_word: זָהָב
  choice: золото
  rationale: Прямое и однозначное соответствие.
- source_word: בְּנֵי אָדָם
  choice: людей
  rationale: Буквально «сыны человеческие», то есть люди. Современное родовое «людей» ясно и естественно по-русски, не меняя смысла.
- source_word: בְּכוּר
  choice: в горниле
  rationale: Форма естественно разбирается как предлог בְּ с существительным כּוּר — «плавильная печь, горнило». Такое прочтение создаёт точный параллелизм с испытанием золота в огне и согласуется с греческим καμίνῳ.
- source_word: עֹנִי
  choice: бедствия
  rationale: עֹנִי может обозначать бедствие, страдание, угнетённость или унижение. «Бедствие» сохраняет широту еврейского слова и хорошо передаёт обстоятельства испытания; греческое ταπείνωσις сильнее подчёркивает унижение.
theological_decisions:
- issue: Следует ли в основном тексте воспроизводить греческое δεκτοί («угодные, принятые»), отсутствующее в сохранившемся еврейском тексте
  choice: Не добавлять определение к слову «людей» в основном тексте; отметить греческое чтение в сноске
  alternative: «угодные люди — в горниле унижения» или «людей, которых принимают, — в горниле бедствия»
  rationale: 'Еврейская строка даёт ясный параллелизм: золото испытывается огнём, люди — бедствием. Греческое δεκτοί представляет важное дополнительное свидетельство, но его включение в основной текст добавило бы отсутствующее в еврейском определение и сузило бы всеобщую формулировку. Сноска сохраняет текстологическую и богословскую напряжённость без молчаливого выбора в пользу расширенного греческого чтения.'
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Горнило» — традиционное, но понятное слово, точно поддерживающее металлургический образ; «бедствие» сохраняет широкий смысл עֹנִי. Параллелизм двух строк передан с помощью тире и опущенного во второй строке глагола.
