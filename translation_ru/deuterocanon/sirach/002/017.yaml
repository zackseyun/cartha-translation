translation:
  language: ru
  text: 'Боящиеся Яхве приготовят свои сердца

    и перед Ним смирят свой дух.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «смирят свои души». В еврейском тексте — «свой дух»; этому чтению следует основной текст.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: боящиеся Яхве
  rationale: Причастная конструкция обозначает людей, для которых характерен страх перед Яхве. «Боящиеся» сохраняет устойчивый библейский образ и не ослабляет его до одного лишь почтения.
- source_word: יָכִינוּ לְבָבָם
  choice: приготовят свои сердца
  rationale: Глагол כון в породе hifil означает «приготовить, сделать готовым, утвердить». В данном контексте «приготовят» естественно передаёт этическую готовность и согласуется с греческим ἑτοιμάσουσιν.
- source_word: לְבָבָם
  choice: свои сердца
  rationale: לֵבָב обозначает внутреннего человека, включая волю и мысль. «Сердца» сохраняет понятную библейскую метафору без её пояснительного сужения.
- source_word: וּלְפָנָיו
  choice: перед Ним
  rationale: Буквальное и естественное соответствие еврейскому выражению «перед Ним», обозначающему пребывание в Его присутствии.
- source_word: יַכְנִיעוּ רוּחָם
  choice: смирят свой дух
  rationale: Еврейский текст прямо называет «их дух»; перевод сохраняет этот антропологический термин и каузативный смысл глагола, не сводя выражение к более общему «смирятся».
theological_decisions:
- issue: Передача Божественного имени יְהֹוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте употреблён тетраграмматон; форма «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Антропологический термин רוּחָם при греческом ψυχὰς αὐτῶν
  choice: свой дух
  alternative: свои души
  rationale: Основной текст следует высоконадёжному еврейскому свидетельству и сохраняет его формулировку; отличие греческой параллели отмечено в сноске, чтобы не устранять подлинное разночтение.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционной библейской образности. Синтаксис краткий и торжественный, но понятный; местоимение при сердце и духе передано возвратным «свои/свой», естественным для русского языка.
