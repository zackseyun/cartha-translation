base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/002/001.yaml
  text: My son[a], if you draw near to serve Yahweh, prepare yourself for every trial.
translation:
  language: ru
  text: Сын мой, если приступаешь служить Яхве, приготовь себя ко всякому испытанию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приготовь душу свою ко всякому испытанию». Греческое слово, переведённое как «испытание», в зависимости от контекста может также означать «искушение».'
    reason: Сохраняет буквальный образ נַפְשְׁךָ и отмечает более широкий смысловой диапазон греческого πειρασμός, не подменяя первичное еврейское чтение.
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Сохраняет обращение к одному ученику в мужском роде и отеческий тон литературы мудрости; порядок слов естественен для русского библейского наставления.
- source_word: תִּקְרַב
  choice: приступаешь
  rationale: Передаёт приближение и начало действия, сохраняя оттенок вступления в служение Богу; форма настоящего времени естественно выражает общее условие.
- source_word: לַעֲבוֹד
  choice: служить
  rationale: Еврейский глагол охватывает служение, послушание и богопочитание; более узкое «поклоняться» неоправданно ограничило бы смысл.
- source_word: אֶת יְהֹוָה
  choice: Яхве
  rationale: Передаёт непосредственно присутствующее в еврейском тексте личное имя Бога, а не заменяет его титулом.
- source_word: הָכֵן
  choice: приготовь
  rationale: Императив призывает намеренно привести себя в состояние готовности; «приготовь» ясно и достойно звучит в современном русском.
- source_word: נַפְשְׁךָ
  choice: себя
  rationale: Здесь נֶפֶשׁ обозначает самого человека, его жизнь и внутреннее существо в целом; «себя» не навязывает противопоставления души и тела.
- source_word: לְכָל נִסָּיוֹן
  choice: ко всякому испытанию
  rationale: «Всякому» сохраняет всеохватность לְכָל, а «испытание» передаёт проверку или трудное переживание без обязательного значения склонения ко греху.
theological_decisions:
- issue: Передача имени יְהֹוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный еврейский текст содержит тетраграмматон как личное имя; транслитерация сохраняет это различие, тогда как греческое Κύριος отражает традиционную замену титулом.
- issue: Антропологический смысл נַפְשְׁךָ
  choice: себя
  alternative: душу свою
  rationale: Контекст требует готовности всего человека. Буквальное «душу свою» возможно, но в современном русском способно неоправданно сузить смысл до нематериальной части человека; вариант отмечен в сноске.
- issue: Значение נִסָּיוֹן / πειρασμός
  choice: испытание
  alternative: искушение
  rationale: Еврейское слово прежде всего обозначает проверку или испытание. Греческое соответствие допускает также «искушение», поэтому эта смысловая возможность не устраняется, а указывается в сноске.
translation_notes:
  register: Современный литературный русский с достоинством наставительной речи. Синтаксис прост и понятен; сохранены обращение мудреца к ученику, личное имя Бога и открытый смысл испытания. Архаизм «душу свою» вынесен в сноску, а не использован в основном тексте.
