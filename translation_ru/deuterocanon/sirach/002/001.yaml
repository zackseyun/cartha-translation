  source_fidelity: 'Перевод точно передаёт еврейский текст: בְּנִי — «Сын мой», תִּקְרַב לַעֲבוֹד — «если приступаешь служить», личное имя יְהֹוָה — «Яхве», а также императив «приготовь себя ко всякому испытанию». «Приступаешь служить» несколько сильнее подчёркивает начало служения, чем буквальное «приближаешься, чтобы служить», но в данном наставительном контексте это естественное и верное выражение намерения или вступления в служение. «Всякому» обоснованно сохраняет לְכָל, в отличие от греческого параллельного текста, где существительное стоит в ед. числе.'
