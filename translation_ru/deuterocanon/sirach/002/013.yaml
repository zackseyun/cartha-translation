translation:
  language: ru
  text: 'Горе сердцу, которое не доверяет[a]: и оно не устоит.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Горе ослабевшему сердцу, потому что оно не верит; поэтому оно не будет защищено». В еврейском тексте сказано просто «сердцу» и «оно не устоит».'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  choice: Горе
  rationale: Сохраняет присущую еврейскому междометию силу скорби и грозного предостережения, уместную для библейской литературы мудрости.
- source_word: לְלֵב
  choice: сердцу
  rationale: Буквально передаёт еврейский образ сердца как внутреннего человека, включая волю и расположение; соответствует также греческому καρδίᾳ.
- source_word: אֲשֶׁר לֹא יַאֲמִין
  choice: которое не доверяет
  rationale: Глагол אמן здесь выражает доверие или веру. «Не доверяет» естественно передаёт практическое упование в контексте испытаний, не сводя смысл к отвлечённому признанию истинности.
- source_word: וְאַף הוּא
  choice: оно
  rationale: Местоимение сохраняет отнесённость последствия именно к сердцу; оттенок усиления וְאַף передан общей категоричностью краткой второй части, поскольку буквальное «и оно также» по-русски звучало бы неестественно и предполагало бы явно названный ряд других субъектов.
- source_word: לֹא יָקוּם
  choice: не устоит
  rationale: Передаёт буквальный образ «не встанет / не будет стоять» и его контекстуальный смысл неспособности сохранить твёрдость при испытании.
theological_decisions:
- issue: Передача глагола доверия/веры в наставлении литературы мудрости
  choice: не доверяет
  alternative: не верит; не имеет веры
  rationale: Еврейское אמן и греческое πιστεύει допускают значения веры и доверия. В контексте стойкости при испытаниях «доверяет» яснее выражает деятельное упование и не привносит более поздней отвлечённой догматической терминологии.
- issue: Различие между еврейским и греческим заключением стиха
  choice: оно не устоит
  alternative: поэтому не будет укрыто
  rationale: Основным источником служит засвидетельствованный еврейский текст לֹא יָקוּם. Отличающееся греческое чтение сохраняется в сноске, а не смешивается с основным текстом.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием изречения. Сохранён библейский образ сердца; «не устоит» естественно передаёт метафору стойкости без пояснительного расширения.
