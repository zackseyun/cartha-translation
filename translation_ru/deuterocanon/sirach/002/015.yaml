lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: боящиеся Яхве
  rationale: Причастное сочетание обозначает людей, чья жизнь характеризуется страхом перед Богом. «Боящиеся» сохраняет традиционный язык библейской мудрости и более полный смысл, чем смягчённое «почитающие»; имя יְהֹוָה передано как «Яхве».
- source_word: לֹא יַמְרוּ
  choice: не восстанут
  rationale: Глагол מרה выражает непокорность, противление или мятеж, а не просто единичное непослушание. «Не восстанут» естественно передаёт эту усиленную семантику по-русски.
- source_word: בִּדְרָכָיו
  choice: против Его путей
  rationale: При глаголе מרה предлог ב может указывать на объект противления. «Против Его путей» ясно выражает связь слов и сохраняет образ жизненных путей.
- source_word: וְאוֹהֲבָיו
  choice: любящие Его
  rationale: Причастие с местоименным суффиксом обозначает людей, любящих Бога; краткая русская конструкция естественна и сохраняет параллелизм с «боящиеся Яхве».
- source_word: יִצְרוּ
  choice: будут хранить
  rationale: נצר значит «хранить, оберегать, соблюдать». «Будут хранить» сохраняет как смысл верного соблюдения, так и оттенок бережного охранения.
- source_word: אָרְחוֹתָיו
  choice: Его стези
  rationale: Слово обозначает тропы или пути. «Стези» сохраняет поэтическое варьирование относительно דְּרָכִים («пути») и остаётся узнаваемым в достойном современном библейском регистре.
theological_decisions:
- issue: Передача имени יְהֹוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит Тетраграмматон. Транслитерация «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
- issue: Сила выражения לֹא יַמְרוּ
  choice: не восстанут
  alternative: не ослушаются
  rationale: Основной еврейский текст указывает на противление или мятеж; более мягкое «не ослушаются» соответствует греческой параллели, но не должно вытеснять более сильный смысл еврейского свидетельства.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Слово «стези» употреблено для сохранения поэтической вариативности двух еврейских обозначений пути; остальная лексика общепонятна и не привязана к конфессиональной терминологии.
