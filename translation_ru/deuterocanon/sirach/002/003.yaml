  text: Cling to him and do not turn away[a], so that you may be exalted in your latter end.
translation:
  language: ru
  text: Прильни к нему и не отступай, чтобы в конечном итоге ты стал велик.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы в конечном итоге ты возвысился». Еврейский глагол означает «расти, становиться великим»; в греческом параллельном тексте: «чтобы ты возрос». «Конечный итог» может означать будущую участь или исход жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִדָּבֵק
  choice: Прильни
  rationale: Глагол דבק выражает тесную и стойкую привязанность. «Прильни» сохраняет силу образа и звучит достойно, не прибегая к архаичному «прилепись».
- source_word: בּוֹ
  choice: к нему
  rationale: Местоименный суффикс мужского рода единственного числа по ближайшему контексту относится к Богу; перевод сохраняет местоимение, не подставляя имя прямо в текст.
- source_word: וְאַל תָּסוּר
  choice: и не отступай
  rationale: סור может означать уклоняться, отходить или отступать. «Не отступай» естественно передаёт как удаление, так и отказ от верности; греческое μὴ ἀποστῇς подтверждает этот смысл.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Союз естественно передаёт целевое, а возможно и следственное, отношение между наставлением и обещанным итогом.
- source_word: תִּגְדַּל
  choice: стать великим
  rationale: Основное значение גדל — «расти, становиться великим». Такой перевод ближе к еврейскому, чем однозначное «быть возвышенным», и сохраняет возможность как возрастания, так и обретения чести.
- source_word: בְּאַחֲרִיתֶךָ
  choice: к концу
  rationale: אַחֲרִית обозначает конец, последующую участь или конечный исход. «К концу» естественно по-русски и не сужает выражение до последнего часа жизни или строго эсхатологического смысла.
theological_decisions:
- issue: К кому относится местоимение «нему»
  choice: К Богу, о котором говорится в ближайшем контексте
  alternative: К мудрости или наставлению в более общем смысле
  rationale: Контекст главы призывает доверять Господу и бояться Его; еврейский и греческий тексты сохраняют местоимение мужского рода без нового названного предшествующего лица. Поэтому личное местоимение сохранено без поясняющей вставки «Богу».
- issue: Характер обещания в заключительной части
  choice: Стать великим, то есть возрасти или обрести честь, в конечном исходе
  alternative: Быть возвышенным Богом либо достичь материального благополучия к концу жизни
  rationale: Еврейское גדל и греческое αὐξηθῇς допускают рост, увеличение и достижение величия. Формулировка не сводит обещание к материальному успеху и не уточняет, кем именно совершается возвышение.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой наставления. «Прильни» сохраняет образ тесной верности, а «к концу» передаёт мудростную перспективу окончательного исхода без излишнего догматического уточнения.
