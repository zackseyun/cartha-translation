  text: You who fear Yahweh[a], trust in him, and your reward will not be delayed.
translation:
  language: ru
  text: Вы, боящиеся Яхве, доверьтесь Ему, и Он не задержит вашу награду.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «Он не даст вашей награде остаться на ночь». Греческий текст: «и вы ни в коем случае не потеряете своей награды».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאֵי יְהֹוָה
  choice: Боящиеся Яхве
  rationale: Причастное выражение во множественном числе в данном контексте служит обращением. Русская форма сохраняет прямой призыв и передаёт имя יהוה как «Яхве».
- source_word: הַאֲמִינוּ בּוֹ
  choice: доверьтесь Ему
  rationale: Повелительная форма אמן с предлогом ב выражает опору и доверие, а не только интеллектуальное согласие. Совершенный вид естественен для побуждения в современном русском.
- source_word: וְהוּא לֹא יָלִין
  choice: и Он не задержит
  rationale: Еврейский текст буквально говорит, что Он не оставит награду на ночь. «Не задержит» естественно передаёт образ промедления, сохраняя Бога как явно названный субъект; расхождение с греческим отражено в сноске.
- source_word: שְׂכַרְכֶם
  choice: вашей награды
  rationale: שכר может обозначать плату или воздаяние; в наставлении о доверии Богу «награда» звучит ясно и естественно.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не заменяет его титулом.
- issue: Смысл заключительной части стиха
  choice: Он не задержит вашей награды
  alternative: Он не оставит вашей награды на ночь; вы ни в коем случае не потеряете своей награды
  rationale: Основной текст следует еврейскому образу задержки, но выражает его естественно по-русски. Греческое чтение о непотере награды не подменяет еврейское и приводится в сноске, чтобы сохранить текстологическое напряжение.
translation_notes:
  register: Современный литературный русский язык; прямое увещевание, сдержанный и достойный тон. Заглавная буква в местоимении «Ему» и «Он» применена как почтительная русская издательская норма.
