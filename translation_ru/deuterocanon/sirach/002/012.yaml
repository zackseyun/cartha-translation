  source_fidelity: 'Основной текст точно передаёт еврейское «горе» и два первых образа: малодушие и ослабевшие руки. Заключительное «грешнику, чьи пути кривы» остаётся близким к трудному еврейскому выражению עִקֵּשׁ דְּרָכַיִם, не подменяя его более определённым греческим образом «двух троп». Выбор «грешнику» поддержан греческим ἁμαρτωλῷ, а значимое расхождение засвидетельствовано в примечании.'
