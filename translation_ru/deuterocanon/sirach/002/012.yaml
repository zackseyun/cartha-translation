  terminology: «Горе» уместно передаёт אוֹי. «Малодушным» хорошо отражает отрицательный смысл «мягких сердцем», подтверждаемый греческим δειλαῖς. «Грешнику» допустимо как согласованное с греческим параллелем решение для רָשָׁע; сноска сохраняет более буквальный еврейский образ. Конфессионально нагруженных интерпретаций нет.
