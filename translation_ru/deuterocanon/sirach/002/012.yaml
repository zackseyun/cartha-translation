  text: Woe to the faint of heart and the slack hands[a], and to the sinner of crooked ways.
translation:
  language: ru
  text: Горе малодушным и тем, у кого опустились руки, и грешнику, чьи пути кривы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально говорит о грешнике, «кривом путями»; греческий текст: «о грешнике, ступающем на две тропы», — возможно, то есть о человеке двоедушном или непостоянном.'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי
  choice: Горе
  rationale: Сохраняет характерную для пророческой и учительной речи формулу скорби и предостережения; «увы» звучало бы слабее.
- source_word: לְרַכֵּי לֵב
  choice: малодушным
  rationale: Буквально речь идёт о «мягких/слабых сердцем» в отрицательном смысле; греческое δειλαῖς подтверждает значение робости и недостатка мужества. «Малодушным» естественно и ёмко передаёт эту идиому.
- source_word: וּרְפֵה יָדָיִם
  choice: тем, у кого опустились руки
  rationale: Еврейский образ ослабевших рук означает утрату силы и решимости. Русская идиома сохраняет образ рук и ясно передаёт состояние бессилия или безволия.
- source_word: וְלָרָשָׁע
  choice: и грешнику
  rationale: רשע допускает значения «нечестивый» и «грешник»; греческое ἁμαρτωλῷ непосредственно поддерживает вариант «грешнику».
- source_word: עִקֵּשׁ דְּרָכַיִם
  choice: чьи пути кривы
  rationale: Передаёт сохранившееся еврейское чтение «кривой/извращённый путями», не устраняя его образность. Более определённое греческое чтение о двух путях вынесено в примечание.
theological_decisions:
- issue: Трудное заключительное выражение в еврейском тексте и отличающееся греческое чтение
  choice: Передать основной еврейский текст как «грешнику, чьи пути кривы»
  alternative: «грешнику, идущему двумя путями»
  rationale: Еврейское свидетельство имеет первенство и говорит о кривых путях, тогда как греческий параллельный текст конкретизирует образ как хождение двумя путями, возможно подразумевая двоедушие или непостоянство. Примечание сохраняет значимое разночтение, не выдавая одну интерпретацию за несомненную.
translation_notes:
  register: Современный литературный русский язык с достоинством учительной речи. «Горе» сохраняет библейскую силу предостережения; идиома «опустились руки» делает древний образ понятным без его утраты. Разночтение еврейского и греческого свидетельств сохранено в сноске.
