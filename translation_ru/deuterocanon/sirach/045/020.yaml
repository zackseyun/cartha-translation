translation:
  language: ru
  text: Он умножил честь Аарона и дал ему его наследие.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте далее сказано: «Начатки из первинок Он распределил между ними; для первенствующих Он приготовил хлеб в изобилии». Сохранившийся еврейский текст здесь короче греческого.'
    reason: textual_variant
lexical_decisions:
- source_word: ויוסף
  choice: умножил
  rationale: Глагол יסף в породе hифиль означает «прибавить, увеличить». «Умножил» естественно сочетается с «честью» и сохраняет идею её возрастания.
- source_word: לאהרן כבודו
  choice: честь Аарона
  rationale: כבוד может обозначать славу, почёт или высокое положение. В контексте возвышения Аарона как священника «честь» передаёт смысл естественно и без излишней конкретизации; местоименный суффикс выражен принадлежностью Аарону.
- source_word: ויתן לו
  choice: и дал ему
  rationale: Прямой и ясный перевод נתן с косвенным дополнением, соответствующий достоинству и простоте исходного текста.
- source_word: נחלתו
  choice: его наследие
  rationale: נחלה означает наследие либо назначенную долю. «Наследие» сохраняет библейские и заветные оттенки, не исключая значения священнической доли.
theological_decisions:
- issue: Характер наследия Аарона
  choice: его наследие
  alternative: назначенную ему долю
  rationale: Речь может идти о доле, назначенной Аарону в связи со священническим служением, а не о земельном владении. Слово «наследие» сохраняет более широкое значение еврейского נחלה и богословское напряжение контекста.
- issue: Субъект глаголов
  choice: Он
  alternative: Бог
  rationale: Еврейский текст продолжает речь с подразумеваемым субъектом. Местоимение сохраняет связность и не вводит в сам стих отсутствующее в нём имя.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским ритмом. Сохранены повтор местоимения «его» и многозначность слова «наследие»; текстовое расхождение с греческой традицией вынесено в примечание.
