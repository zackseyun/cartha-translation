base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/005.yaml
  text: He let him hear his voice[a], and brought him near into the dark cloud. He placed in his hand the commandment, a law of life and understanding, to teach Jacob his statutes[b], and Israel his testimonies and judgments.
translation:
  language: ru
  text: Он дал ему услышать Свой голос и подвёл его к густому мраку. Он вложил ему в руку заповедь[a] — закон жизни и разумения, — чтобы тот учил Иакова Его установлениям[b], а Израиль — Его свидетельствам и судам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «заповеди» (множественное число).'
    reason: textual_variant
  - marker: b
    text: 'В греческом тексте эта часть читается: «чтобы научить Иакова завету, а Израиль — Его судам»; в еврейском тексте: «Его установлениям… Его свидетельствам и судам».'
    reason: alternative_reading
lexical_decisions:
- source_word: וישמיעהו את קולו
  choice: Он дал ему услышать Свой голос
  rationale: Каузативная форма глагола שמע означает «дать/позволить услышать». Такая передача естественна по-русски и сохраняет мысль о том, что Бог дал Моисею услышать божественный голос.
- source_word: ויגישהו לערפל
  choice: и приблизил его к тёмному облаку
  rationale: Форма глагола נגש означает «приблизить, подвести», а ערפל обозначает густую тьму или тёмное облако, связанное с богоявлением. Основной текст следует еврейскому направлению движения «к», не устраняя образ облачной тьмы; греческое εἰσήγαγεν сильнее выражает введение внутрь.
- source_word: מצוה
  choice: заповедь
  rationale: Сохранено единственное число еврейского текста. Греческое множественное ἐντολάς отражено в примечании.
- source_word: תורת חיים ותבונה
  choice: закон жизни и разумения
  rationale: В синайском контексте תורה уместно передать как «закон», хотя слово может означать и «наставление». תבונה — разумение, способность понимать и различать; «разумение» сохраняет торжественный, но понятный регистр.
- source_word: ללמד ביעקב חוקיו
  choice: чтобы тот учил Иакова Его установлениям
  rationale: Инфинитив выражает цель поручения Моисею. Предлог ב при «Иакове» естественно передан русской конструкцией с дательным падежом. חוקים — установленные предписания или уставы; «установления» звучит ясно и достойно.
- source_word: ועדותיו ומשפטיו לישראל
  choice: а Израиль — Его свидетельствам и судам
  rationale: עדותיו сохранено как «Его свидетельства», не сведённое без оговорки к «завету»; משפטיו передано как «Его суды», что сохраняет юридическую силу слова и традиционную библейскую ёмкость.
theological_decisions:
- issue: Образ ערפל при богоявлении
  choice: тёмное облако
  alternative: густой мрак; мгла
  rationale: Выражение передаёт одновременно тьму, сокрытость и облачный контекст синайского богоявления, не объясняя природу явления сверх сказанного в тексте.
- issue: Расхождение еврейского и греческого текстов в юридических терминах
  choice: заповедь ... Его установления ... Его свидетельства и суды
  alternative: заповеди ... завет ... суды
  rationale: При наличии связного еврейского свидетельства основной текст следует ему. Реальные греческие варианты — множественное «заповеди» и «завет» вместо ряда еврейских терминов — сохранены в примечаниях.
- issue: Принадлежность установлений, свидетельств и судов
  choice: Его установления ... Его свидетельства и суды
  alternative: свои установления ... свои свидетельства и суды
  rationale: Прописная форма «Его» ясно относит правовые установления к Богу и избегает русской грамматической двусмысленности, при которой «свои» могло бы ошибочно отсылать к Моисею.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя; тире выделяют пояснение «закон жизни и разумения» и эллиптическое продолжение. Божественные местоимения написаны с прописной буквы ради устранения неоднозначности, а не как конфессиональное утверждение.
