  source_fidelity: 'Основной смысл еврейского текста передан верно: облачение Аарона, великолепие, слава и сила, затем нижние одежды, хитоны, верхняя одежда и колокольчики. Однако «во всё великолепие» по-русски звучит неестественно и несколько размывает значение כליל («полный, совершенный»). Кроме того, исходное тире после «силой» неясно связывает перечень одежд именно со «славой и силой», хотя в еврейском это последовательное описание облачения.'
  naturalness: «Облёк его совершенным великолепием» сохраняет возвышенный регистр, но естественнее для современного литературного русского. Парные тире вокруг перечня одежд ясно показывают его как конкретизацию того, чем он был украшен, и не перегружают фразу.
