base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/008.yaml
  text: He clothed him with perfect splendor[a], and adorned him with glory and strength, with trousers, tunics, and a robe[b]; and he encircled him with bells.
translation:
  language: ru
  text: Он облёк его совершенным великолепием[a], украсил славой и силой — нижними одеждами, хитонами и мантией — и окружил его колокольчиками[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полным великолепием». Еврейское выражение кратко соединяет значения полноты, красоты, славы и великолепия.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский и греческий тексты здесь различаются в перечне священнических одежд. В еврейском названы нижние одежды, хитоны, мантия и колокольчики; в греческом последовательность иная и упомянут эфод.
    reason: textual_variant
lexical_decisions:
- source_word: וילבישהו
  choice: Он облёк его
  rationale: Порода hифиль глагола לבש означает «облечь, одеть кого-либо». «Облёк» сохраняет торжественный характер священнического облачения и остаётся понятным в современном литературном русском.
- source_word: כליל תפארת
  choice: во всё великолепие
  rationale: כליל передаёт полноту или завершённость, а תפארת — красоту, великолепие и славу. Формулировка звучит естественно и возвышенно, не сводя ёмкое еврейское выражение к одному узкому оттенку.
- source_word: ויפארהו
  choice: украсил
  rationale: Глагол פאר здесь описывает придание Аарону великолепия посредством священных одежд. «Украсил» передаёт как конкретный образ облачения, так и заключённую в нём честь.
- source_word: בכבוד ועוז
  choice: славой и силой
  rationale: כבוד означает славу или честь, עוז — силу или могущество. Близкая к форме оригинала пара сохраняет достоинство и силу, связанные с первосвященническим облачением.
- source_word: מכנסים
  choice: нижними одеждами
  rationale: Слово обозначает закрывающую нижнюю часть тела священническую одежду. «Нижние одежды» точнее для древнего облачения и менее бытово, чем современные «штаны».
- source_word: כתנות
  choice: хитонами
  rationale: כתנת — древняя нательная одежда типа туники; традиционное и достаточно понятное «хитон» сохраняет исторический колорит. Число оригинала передано множественным числом.
- source_word: ומעיל
  choice: и мантией
  rationale: מעיל обозначает длинную верхнюю одежду, особенно в священническом контексте. «Мантия» естественно отличает её от нижних одежд и хитонов.
- source_word: ויקיפהו
  choice: окружил его
  rationale: Глагол передаёт окружение или опоясывание. Перевод сохраняет образ колокольчиков, расположенных кругом, не добавляя прямо не названного в строке подола.
- source_word: פעמונים
  choice: колокольчиками
  rationale: Уменьшительная форма в русском естественно обозначает небольшие колокольчики на священнической одежде. Определение «золотыми» не добавлено, поскольку его нет в данной еврейской строке.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста с греческим свидетелем в перечне священнических одежд
  choice: 'Основной текст следует содержательному и связному еврейскому чтению: «нижними одеждами, хитонами и мантией… колокольчиками».'
  alternative: Следовать греческой последовательности, где названы нижние одежды, длинное одеяние и эфод, но в данной строке не упомянуты колокольчики.
  rationale: При наличии сохранившегося еврейского текста он служит основным источником; греческий использован как древнее параллельное свидетельство и основание для текстологического примечания. Вариант не скрыт и не смешан с еврейским чтением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Слова «облёк» и «хитоны» сохраняют церемониальный и древний контекст, тогда как синтаксис и остальная лексика остаются доступными обычному читателю.
