base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/007.yaml
  text: He put splendor upon him and ministered to him with his glory[b][a]; he girded him with the horns of a wild ox and clothed him with bells.
translation:
  language: ru
  text: Он возложил на него великолепие и послужил ему своей славой[a]; препоясал его рогами дикого быка[b] и облёк его колокольчиками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Он установил для него вечный завет и дал ему священство народа; благословил его благолепием и препоясал его одеянием славы». Еврейское свидетельство здесь существенно отличается от греческого.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «могучей силой дикого быка». Еврейское выражение трудно для истолкования; образ может обозначать силу и возвышенность, а не буквальные рога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוד
  choice: великолепие
  rationale: Передаёт видимое величие и блеск, сохраняя отличие от следующего כבוד — «слава».
- source_word: וישרתהו
  choice: послужил ему
  rationale: Форма от שרת означает «служить, прислуживать». Необычная формулировка сохранена без богословского сглаживания; более буквальное русское соответствие уместно, несмотря на напряжённость выражения.
- source_word: בכבודו
  choice: своей славой
  rationale: Сохраняет притяжательный суффикс и инструментальное понимание предлога ב; כבוד передано возвышенным, но общеупотребительным словом «слава».
- source_word: ויאזרהו
  choice: препоясал его
  rationale: אזר обозначает опоясывание, особенно в контексте облачения; «препоясал» естественно для торжественной церемониальной речи.
- source_word: בתועפות ראם
  choice: рогами дикого быка
  rationale: Сохраняет конкретный и яркий образ возможных «рогов» תועפות и передаёт ראם как дикого быка; переносное понимание силы вынесено в примечание.
- source_word: וילבישהו פעמונים
  choice: облёк его в одеяние с колокольчиками
  rationale: Передаёт глагол לבש и колокольчики פעמונים в естественной русской форме; слово «одеяние» эксплицирует подразумеваемое священническое облачение, не меняя образа.
theological_decisions:
- issue: Выбор между еврейским текстом и существенно отличающимся греческим параллельным чтением
  choice: Основной текст следует сохранившемуся еврейскому свидетельству, а греческое чтение полностью приводится в примечании.
  alternative: «Он установил с ним вечный завет и дал ему священство народа; благословил его благолепием и препоясал его одеянием славы».
  rationale: Еврейский текст засвидетельствован с высокой уверенностью и потому положен в основу; значительное расхождение Септуагинты нельзя ни замалчивать, ни смешивать с ним.
- issue: Необычное утверждение, что Бог «послужил ему»
  choice: 'Сохранить прямое значение глагола: «послужил ему своей славой».'
  alternative: «почтил его своей славой» или «украсил его своей славой».
  rationale: Альтернативы звучат естественнее, но устраняют реальную лексическую и богословскую напряжённость еврейской формулировки.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией, подходящей описанию священнического облачения. Необычность «послужил ему своей славой» намеренно сохранена; архаизмы ограничены уместным церемониальным глаголом «препоясал».
