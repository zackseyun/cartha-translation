base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/006.yaml
  text: He exalted Aaron[a], a holy one like himself, from the tribe of Levi[b], and made him an everlasting statute.
translation:
  language: ru
  text: Он возвысил Аарона[a] — святого, подобного ему, его брата из колена Левия, — и утвердил его как вечное установление[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Аарона, святого, подобного ему, его брата, из колена Левия». В приведённой еврейской строке отсутствуют слова «подобного ему, его брата». Местоимение «ему» в греческом тексте не уточняется в самой строке.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «вечным уставом», «непреходящим установлением». Еврейское выражение, вероятно, относится к непреходящему священническому назначению Аарона, но сформулировано сжато.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וירם
  choice: Он возвысил
  rationale: Порода hифиль глагола רום означает «возвысить, высоко поднять»; выбор сохраняет почётно-священнический смысл и соответствует греческому ὕψωσεν.
- source_word: קדוש את אהרן
  choice: святого Аарона
  rationale: В еврейском קדוש характеризует Аарона как святого, то есть посвящённого Богу. Русская конструкция с согласованным определением естественна и не превращает выражение в титул.
- source_word: למטה לוי
  choice: из колена Левия
  rationale: מַטֶּה в родословном контексте означает «колено, племя»; «колено Левия» — устоявшееся и понятное библейское выражение.
- source_word: וישימהו
  choice: и поставил его
  rationale: שׂים может означать «положить, поставить, назначить». «Поставил» сохраняет сжатость оригинала и допускает смысл учреждения или назначения, не добавляя прямо «священником» либо «на должность».
- source_word: לחק עולם
  choice: вечным установлением
  rationale: חֹק — «установление, устав»; עוֹלָם здесь выражает непреходящую длительность. Творительный падеж после «поставил» естественно передаёт сжатую конструкцию оригинала, хотя её точный институциональный смысл остаётся неоднозначным.
- source_word: ὅμοιον αὐτῷ ἀδελφὸν αὐτοῦ
  choice: 'вариант: «подобного ему, его брата»'
  rationale: Эти слова присутствуют в греческом параллельном свидетельстве, но отсутствуют в приведённом еврейском тексте. Из-за существенного расхождения их следует отметить в примечании, а не бесспорно включать в основной текст.
theological_decisions:
- issue: Неявный субъект глагола וירם
  choice: Сохранено местоимение «Он» без прямого именования субъекта.
  alternative: «Бог возвысил» или «Господь возвысил».
  rationale: По контексту субъектом является Бог, однако в самой еврейской строке он прямо не назван; местоимение сохраняет синтаксическую сдержанность источника.
- issue: Расхождение еврейского текста и греческого параллельного свидетельства
  choice: Основной текст следует высоконадёжному еврейскому свидетельству; греческое расширение вынесено в примечание [a].
  alternative: «Он возвысил Аарона, святого, подобного ему, его брата, из колена Левия».
  rationale: Греческий текст содержит «подобного ему, его брата», тогда как предоставленная еврейская строка этих слов не имеет. Включение расширения в основной текст сделало бы составной греческий вариант неотличимым от еврейского источника и могло бы породить неясность, к кому относится «ему».
- issue: Смысл לחק עולם применительно к Аарону
  choice: «поставил его вечным установлением»
  alternative: «назначил его согласно вечному установлению» или «утвердил за ним вечное священство».
  rationale: Еврейская формула предельно сжата. Выбранный вариант сохраняет правовой и заветный оттенок, но не добавляет отсутствующего в строке слова «священство» и не устраняет метафорическую напряжённость, при которой сам Аарон назван установлением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Колено Левия» сохраняет привычную библейскую лексику; «установление» яснее современному читателю, чем архаическое «устав» в значении постановления. Маркеры [a] и [b] размещены в основном тексте.
