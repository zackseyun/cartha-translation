base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/017.yaml
  text: And he gave him his commandments[a], and granted him authority in statute and judgment, to teach Jacob his testimonies and to enlighten Israel with his law.
translation:
  language: ru
  text: И дал Он ему Свои заповеди[a] и наделил его властью в законе и суде, чтобы учить Иакова Его свидетельствам и просвещать Израиль Его Законом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст из Каирской генизы здесь короче: «И дал Он ему Свои заповеди и наделил его властью в законе и суде». Слова «чтобы учить Иакова Его свидетельствам и просвещать Израиль Его Законом» засвидетельствованы греческим текстом и включены здесь, поскольку еврейская строка, по-видимому, сокращена.'
    reason: textual_variant
lexical_decisions:
- source_word: ויתן לו מצותיו
  choice: И дал Он ему Свои заповеди
  rationale: Глагол נתן прямо означает «дал»; «заповеди» сохраняет за מצותיו заветно-правовой смысл. Начальный союз ו передан словом «И».
- source_word: וימשילהו
  choice: и наделил его властью
  rationale: Каузативная форма משל обозначает предоставление права управлять или власти. В контексте священнического служения эта формулировка выражает делегированные полномочия, не приписывая Аарону царского статуса.
- source_word: בחוק ומשפט
  choice: в уставах и судах
  rationale: Пара חוק ומשפט относится к правовым установлениям завета. Множественное число естественно по-русски передаёт сферу священнических полномочий, а предлог «в» сохраняет сжатую конструкцию еврейского текста.
- source_word: διδάξαι τὸν Ἰακὼβ τὰ μαρτύρια
  choice: чтобы учить Иакова Его свидетельствам
  rationale: Греческий инфинитив выражает цель данного поручения. «Свидетельства» сохраняет юридико-заветный оттенок μαρτύρια; местоимение «Его» указывает на Бога.
- source_word: καὶ ἐν νόμῳ αὐτοῦ φωτῖσαι Ἰσραήλ
  choice: и просвещать Израиль Его Законом
  rationale: «Просвещать» сохраняет метафору φωτίζω, а творительный падеж «Законом» естественно выражает средство. Прописная буква подчёркивает, что речь идёт о данном Богом Законе, а не о праве вообще.
theological_decisions:
- issue: Включение продолжения, сохранившегося в греческом свидетельстве, но отсутствующего в дошедшей еврейской строке
  choice: В основной текст включены слова о том, чтобы учить Иакова и просвещать Израиль.
  alternative: 'Ограничиться сохранившимся еврейским текстом: «И дал Он ему Свои заповеди и наделил его властью в уставах и судах».'
  rationale: Еврейское свидетельство в данном месте отмечено как существенно расходящееся и, вероятно, сокращённое; греческий текст сохраняет связное продолжение о наставническом служении Аарона. Дополнение открыто обозначено сноской, чтобы не скрывать текстологическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся ясным для обычного читателя; юридико-заветная лексика сохранена без архаизмов. Заглавные буквы в «Он», «Свои», «Его» и «Законом» помогают явно обозначить отнесённость к Богу.
