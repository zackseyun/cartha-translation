  text: holy garments of gold[a], blue, and purple, the work of a designer; a breastpiece of judgment, an ephod and a sash, and scarlet yarn[b], the work of a weaver.
translation:
  language: ru
  text: 'священные одежды: золото, синяя и пурпурная пряжа — искусно выполненная работа; нагрудник суда[a], эфод и пояс, алая пряжа[b] — работа ткача.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Нагрудник суда» — библейское наименование первосвященнического нагрудника в книге Исход.
    reason: cross_reference
  - marker: b
    text: 'Или: «багряная пряжа»; еврейское выражение обозначает алый или багряно-красный текстильный материал, употреблявшийся для священнических одежд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בגדי קודש
  choice: священные одежды
  rationale: Естественно передаёт сочетание со значением одежды, посвящённой для богослужения, и сохраняет культовый смысл.
- source_word: זהב תכלת, וארגמן
  choice: из золота, синей и пурпурной пряжи
  rationale: Золото названо как материал, а תכלת и ארגמן — как окрашенные текстильные материалы. Добавление «пряжи» делает перечень естественным по-русски и соответствует контексту изготовления священных одежд; תכלת обозначает сине-фиолетовый дорогой краситель, но краткое «синей» не создаёт ложной точности.
- source_word: מעשה חשב
  choice: искусная работа
  rationale: Фраза обозначает искусно выполненную, вероятно узорчатую текстильную работу. Перевод сохраняет идею мастерства, не утверждая точную технику — вышивание или узорное ткачество.
- source_word: חשן משפט
  choice: нагрудник суда
  rationale: Сохраняет устойчивую священническую терминологию Исхода и буквальную связь משפט с судом или вынесением решения, не устраняя возможную смысловую напряжённость.
- source_word: אפוד
  choice: эфод
  rationale: Техническое название священнического облачения без точного русского эквивалента; транслитерация позволяет не подменять предмет приблизительным описанием.
- source_word: ואזור
  choice: и пояс
  rationale: Современное и понятное обозначение поясного элемента священнической одежды.
- source_word: ושני תולעת
  choice: алая пряжа
  rationale: Сочетание обозначает алый или багряно-красный текстильный материал. «Алая пряжа» ясно передаёт материал в контексте ткачества, при этом возможный оттенок отмечен в сноске.
- source_word: מעשה אורג
  choice: работа ткача
  rationale: Прямо передаёт упоминание ткача и сохраняет отличие от более общего מעשה חשב в первой части стиха.
theological_decisions:
- issue: Терминология первосвященнического облачения
  choice: Сохранить технический термин «эфод», а остальные предметы передать ясными современными русскими словами.
  alternative: Описательно перевести все названия облачения без транслитерации.
  rationale: Стих перечисляет облачение первосвященника и перекликается с терминологией Исхода. Для «эфода» нет краткого точного русского соответствия; описательный перевод мог бы неоправданно сузить значение.
- issue: Значение משפט в выражении חשן משפט
  choice: нагрудник суда
  alternative: нагрудник решения
  rationale: Буквальный вариант сохраняет связь с библейской священнической терминологией и не решает однозначно, идёт ли речь о суде, решении или средстве получения решения.
translation_notes:
  register: Современный литературный русский язык с достоинством, подобающим перечню священных одежд. Синтаксический параллелизм двух частей сохранён с помощью тире; архаизмы исключены, а необходимый культовый термин «эфод» оставлен без описательной подмены.
