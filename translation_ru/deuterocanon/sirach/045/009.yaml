translation:
  language: ru
  text: И множество гранатов кругом[a] — чтобы при его шагах раздавался мелодичный звук.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте это место пространнее: «И окружил его гранатами и множеством золотых колокольчиков кругом, чтобы при его шагах раздавался слышимый звук, чтобы звук был слышен в храме, в напоминание сынам его народа». В сохранившемся еврейском тексте упомянуты только гранаты и звук при его шагах.'
    reason: textual_variant
lexical_decisions:
- source_word: ורמונים
  choice: гранатов
  rationale: Сохраняется конкретный образ гранатов — вероятно, украшений в форме граната на облачении первосвященника; отсутствующие в еврейском свидетеле колокольчики не вводятся в основной текст.
- source_word: המון
  choice: множество
  rationale: Передаёт значение многочисленности и обилия, не усиливая его сверх еврейского текста.
- source_word: סביב
  choice: кругом
  rationale: Кратко и естественно обозначает размещение украшений по всей окружности облачения.
- source_word: לתת
  choice: чтобы … раздавался
  rationale: Инфинитив выражает назначение или результат; безличная русская конструкция естественно передаёт возникновение звука при движении.
- source_word: נעינה
  choice: мелодичный звук
  rationale: Слово указывает на музыкальное звучание. Такой перевод сохраняет этот оттенок, но не добавляет прямо упомянутые лишь в греческом тексте колокольчики.
- source_word: בצעדיו
  choice: при его шагах
  rationale: 'Передаёт связь звучания с движением: звук возникает, когда он ступает.'
theological_decisions:
- issue: Выбор между кратким еврейским чтением и расширенным греческим параллельным текстом
  choice: Основной текст следует сохранившемуся еврейскому чтению, а более пространное греческое чтение приводится в сноске.
  alternative: «И окружил его гранатами и множеством золотых колокольчиков кругом, чтобы при его шагах раздавался слышимый звук в храме, в напоминание сынам его народа».
  rationale: Еврейский свидетель здесь сохранился и имеет первенство, хотя он заметно короче греческого. Введение колокольчиков и храмового контекста в основной текст скрыло бы реальное текстовое расхождение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Краткая именная конструкция сохраняет характер продолжения предыдущего описания; тире ясно вводит назначение украшений. Формулировка не устраняет необычность краткого еврейского чтения.
