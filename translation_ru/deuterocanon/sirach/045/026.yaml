  text: And now[a], please bless Yahweh[b], the good one.
translation:
  language: ru
  text: Итак[a], благословите же Яхве[b], Благого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «Итак, благословите же Яхве, Благого». Греческое свидетельство здесь существенно иное: «Да вложит Он в сердца ваши мудрость, чтобы судить Его народ по справедливости, дабы не исчезли их блага и их слава — в поколениях их».'
    reason: textual_variant
  - marker: b
    text: 'В еврейском тексте стоит Божье имя YHWH; здесь оно передано как «Яхве». Традиционная передача: «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет как временное значение, так и связующую силу еврейского вводного оборота.
- source_word: בָּרֲכוּ־נָא
  choice: благословите же
  rationale: Форма множественного числа повелительного наклонения передаёт призыв, а частица נָא — настойчивую, но учтивую просьбу; «же» естественно выражает этот оттенок по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт присутствующее в еврейском тексте личное имя YHWH, не заменяя его титулом.
- source_word: הַטּוֹב
  choice: Благого
  rationale: Определённое прилагательное употреблено субстантивированно и приложено к имени; «Благого» сохраняет краткость и торжественность конструкции.
- source_word: δόῃ ὑμῖν σοφίαν ...
  choice: не включено в основной текст
  rationale: Греческое свидетельство существенно расходится с сохранившимся еврейским текстом; при высокой уверенности еврейского чтения оно приводится в примечании как текстовый вариант.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо стоит тетраграмматон; транслитерация сохраняет личное Божье имя и не подменяет его титулом.
- issue: Соотношение еврейского и греческого свидетельств
  choice: Основной текст следует сохранившемуся еврейскому чтению; греческое приводится в примечании
  alternative: Принять греческое чтение за основной текст или объединить оба текста
  rationale: Еврейский текст сохранился и оценён как надёжный. Смешение двух существенно разных форм устранило бы реальное текстологическое различие.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Благого» передаёт субстантивированное определённое прилагательное без развёртывания его в пояснительное придаточное.
