base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/022.yaml
  text: But in their land he will not inherit[a], and among them he will not be allotted an inheritance; the offerings of Yahweh are his portion and his inheritance among the sons of Israel.
translation:
  language: ru
  text: Но на их земле он не получит наследственного удела, и среди них ему не будет выделен наследственный удел; жертвенные приношения Господу — его доля и его наследие среди сынов Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели заключительная часть стиха читается иначе: «ибо Он Сам — твоя доля и наследие». Сохранившийся еврейский текст гласит: «жертвенные приношения Господу — его доля и его наследие».'
    reason: alternative_reading
lexical_decisions:
- source_word: אך
  choice: Но
  rationale: Передаёт противопоставление предшествующему дарованию Аарону и его потомкам, не усиливая его сверх еврейского текста.
- source_word: בארצם
  choice: в их земле
  rationale: Сохраняет прямое указание на землю Израиля и естественно сочетается с лексикой наследственного удела.
- source_word: לא ינחל
  choice: не получит наследственного удела
  rationale: Передаёт значение глагола נחל в контексте распределения земли; выражение ясно современному читателю и сохраняет юридический оттенок.
- source_word: ובתוכם לא יחלק נחלה
  choice: и среди них ему не выделят наследия
  rationale: По контексту речь идёт не о действии священника, а об отсутствии назначенного ему земельного удела; безличная русская конструкция естественно выражает этот смысл и согласуется с греческой параллелью.
- source_word: אשי יהוה
  choice: приношения Господу
  rationale: אשי обозначает жертвенные, обычно огненные, приношения. Краткая формулировка сохраняет культовый смысл без тяжеловесного буквального выражения «огненные жертвы Господа».
- source_word: חלקו ונחלתו
  choice: его доля и его наследие
  rationale: Сохраняет оба юридико-заветных понятия и их смысловое напряжение с отсутствием земельного удела.
- source_word: בתוך בני ישראל
  choice: среди сынов Израиля
  rationale: Близко передаёт еврейскую формулу, обозначающую народ Израиля как целое, и сохраняет торжественный библейский регистр.
theological_decisions:
- issue: Различие между сохранившимся еврейским текстом и греческой параллелью в заключительной части стиха.
  choice: 'В основном тексте следовать еврейскому чтению: «приношения Господу — его доля и его наследие».'
  alternative: 'Греческая параллель: «ибо Он сам — твоя доля, наследие».'
  rationale: Сохранившийся еврейский свидетель прямо называет жертвенные приношения долей священника. Греческий текст отражает иную форму фразы и непосредственно отождествляет Бога с долей адресата. Поскольку различие богословски значимо, оно не сглажено, а отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для широкого читателя; сохранены повтор наследственной лексики и традиционная формула «сыны Израиля».
