base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/023.yaml
  text: And Phinehas son of Eleazar inherited a third place in might[c][b][a], because he was zealous for the God of all and stood in the breach for his people.
translation:
  language: ru
  text: И Финеес, сын Елеазара, получил третье место по доблести[a], потому что ревновал о Боге всего сущего и встал в проломе за свой народ[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «третий в славе»; в еврейском — «получил третье место по доблести». Здесь принято еврейское чтение.'
    reason: textual_variant
  - marker: b
    text: «Встать в проломе» — еврейский образ решительного заступничества или защиты народа в минуту общей опасности.
    reason: cultural_note
  - marker: c
    text: 'Греческий текст далее добавляет: «и совершил умилостивление за Израиль»; в сохранившемся еврейском тексте этих слов нет.'
    reason: textual_variant
lexical_decisions:
- source_word: נחל שלישי
  choice: унаследовал третье место
  rationale: Глагол נחל означает «наследовать, получить в удел», а שלישי — «третий». В данном контексте речь, вероятнее всего, идёт о месте в ряду почитаемых священников; формулировка сохраняет метафору наследования и не устраняет возможный оттенок преемства.
- source_word: בגבורה
  choice: за доблесть
  rationale: גבורה обозначает силу, доблесть, мужество. Русское «за доблесть» естественно связывает третье место с основанием почести, сохраняя отличие еврейского чтения от греческого «в славе».
- source_word: בקנאו
  choice: потому что ревновал
  rationale: Предлог ב при инфинитивной конструкции допускает обстоятельственное и причинное понимание; здесь причинная связь естественно объясняет оказанную Финеесу честь. Глагол «ревновал» сохраняет библейское значение пламенной преданности и решительного действия.
- source_word: לאלוה כל
  choice: о Боге всего сущего
  rationale: 'Буквально: «о Боге всего». Выражение «всего сущего» ясно передаёт всеобщность Божьего владычества и в современном русском звучит естественнее, чем двусмысленное «Боге всех».'
- source_word: ויעמוד בפרץ
  choice: встал в проломе
  rationale: Сохранён еврейский образ человека, вставшего в пробитой линии защиты в момент общей опасности. Сноска поясняет его заступнический и защитный смысл.
- source_word: עמו
  choice: за свой народ
  rationale: Местоименная форма означает «его народ». Предлог «за» естественно выражает действие в защиту и ради народа в составе русского оборота «встал в проломе за свой народ».
theological_decisions:
- issue: Связь ревности Финееса с оказанной ему честью
  choice: Почётное положение представлено как следствие его ревности о Боге и выступления в защиту народа.
  alternative: 'Оборот можно понимать менее причинно — как указание на обстоятельство или время: «когда он ревновал».'
  rationale: Конструкция ב + инфинитив допускает оба оттенка, однако в контексте похвалы причинное прочтение наиболее естественно; при этом перевод не добавляет подробностей из Чисел 25.
- issue: Смысл выражения «Бог всего»
  choice: Сохранён универсальный титул «Бог всего сущего».
  alternative: Возможны «Бог всех» или «Бог над всем».
  rationale: Такой перевод передаёт универсальность еврейского כל, не подменяя выражение более привычным конфессиональным титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены ключевые еврейские образы — наследование места, ревность и пролом, — но синтаксис сделан ясным для обычного читателя.
