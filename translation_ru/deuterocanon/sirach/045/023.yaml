revisions:
- from: И Финеес, сын Елеазара, унаследовал третье место за доблесть[a], потому что ревновал о Боге всего сущего и встал в проломе за свой народ[b].[c]
  to: И Финеес, сын Елеазара, получил третье место по доблести[a], потому что ревновал о Боге всего сущего и встал в проломе за свой народ[b].[c]
  rationale: Заменено «за доблесть» на «по доблести», чтобы не превращать בגבורה в причину награды и сохранить его связь с третьим местом в ряду почитаемых лиц. Соответственно исправлена текстологическая сноска. Остальные формулировки сохраняют смысл и образы еврейского текста, а сноска c честно отмечает существенное греческое добавление.
