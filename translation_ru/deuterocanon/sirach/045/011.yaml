  text: precious stones upon the breastpiece[a], engraved like a seal in their settings—every precious stone as a memorial[b], engraved with writing according to the number of the sons of Israel.
translation:
  language: ru
  text: драгоценные камни на нагруднике, с резьбой, как на печати, в оправах[a]; каждый драгоценный камень — в память, с выгравированной надписью по числу сынов Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст прямо упоминает золотую оправу; в еврейском тексте здесь сказано только об оправах.
    reason: textual_variant
  - marker: b
    text: 'В греческом тексте: «по числу колен Израиля». Еврейский текст читает: «сынов Израиля», вероятно имея в виду имена родоначальников колен, представленные на камнях.'
    reason: alternative_reading
lexical_decisions:
- source_word: אבני חפץ
  choice: драгоценные камни
  rationale: Естественно передаёт высокую ценность камней; этому соответствует и греческое λίθοις πολυτελέσιν.
- source_word: החשן
  choice: нагрудник
  rationale: Обозначает украшенную камнями часть облачения первосвященника; «нагрудник» не вызывает ошибочной ассоциации с доспехом.
- source_word: פתוחי חותם
  choice: вырезанные, как печать
  rationale: Сохраняет образ резьбы, характерной для печати или перстня-печати; греческий текст также говорит о резьбе печати.
- source_word: במלואים
  choice: вставленные в оправы
  rationale: В ювелирном контексте речь идёт о закреплении камней в оправах. Упоминание золота оставлено примечанию, поскольку в еврейском тексте его нет.
- source_word: לזכרון
  choice: для напоминания
  rationale: Передаёт мемориальную, культовую функцию камней без избыточного истолкования.
- source_word: בכתב חרות
  choice: с вырезанной надписью
  rationale: 'Естественная русская формулировка сохраняет оба элемента: письменную надпись и её нанесение резьбой.'
- source_word: למספר בני ישראל
  choice: по числу сынов Израиля
  rationale: Следует еврейскому чтению буквально и сохраняет возможную связь с именами сыновей Израиля; греческое чтение «колен Израиля» отмечено в сноске.
theological_decisions:
- issue: Назначение камней с надписями
  choice: Камни служат напоминанием и соотносятся с сынами Израиля.
  alternative: Текст можно понимать как указание непосредственно на колена Израиля.
  rationale: Еврейское לזכרון прямо выражает функцию напоминания, а בני ישראל буквально означает «сыны Израиля». Греческий параллельный текст уточняет «колена», но это уточнение не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим описанию священнического облачения. Синтаксис сохраняет перечислительный характер еврейского текста; терминология понятна без конфессионально узких уточнений.
