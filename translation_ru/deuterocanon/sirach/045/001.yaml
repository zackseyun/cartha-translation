translation:
  language: ru
  text: Возлюбленный Богом и людьми[a] — Моисей,[b] память о котором благословенна.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать как «мужчинами», так и «людьми»; греческий параллельный текст также имеет более широкое значение «людьми».
    reason: alternative_reading
  - marker: b
    text: 'Греческий текст этого стиха пространнее: перед именем Моисея он добавляет, что Бог «произвёл от него мужа милосердия, обретшего благоволение в глазах всякой плоти». В представленном еврейском тексте этих слов нет.'
    reason: textual_variant
  - marker: c
    text: 'Буквально: «память о нём — ко благу». Греческий параллельный текст гласит: «память которого — в благословениях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אהוב
  choice: Возлюбленный
  rationale: Передаёт пассивно-адъективное значение «любимый, возлюбленный» и сохраняет торжественный похвальный тон; соответствует греческому ἠγαπημένον.
- source_word: אלהים
  choice: Богом
  rationale: В контексте Моисея אלהים однозначно обозначает Бога Израиля; творительный падеж естественно передаёт деятеля при «возлюбленный».
- source_word: ואנשים
  choice: и людьми
  rationale: אנשים может означать «мужчины» или шире «люди»; здесь речь идёт о всеобщем почитании. Греческое ἀνθρώπων также поддерживает значение «людьми».
- source_word: משה
  choice: Моисей
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: זכרו
  choice: память о котором
  rationale: Естественно передаёт «его память / память о нём» и связывает вторую часть высказывания с именем Моисея.
- source_word: לטובה
  choice: благословенна
  rationale: Буквально выражение значит «ко благу / для добра», но в поминальном обороте означает добрую, благословенную память; греческое ἐν εὐλογίαις подтверждает такое понимание.
theological_decisions:
- issue: Соотношение краткого еврейского текста и более пространного греческого параллельного текста
  choice: Основной текст следует сохранившемуся еврейскому свидетельству; дополнительная греческая фраза вынесена в примечание.
  alternative: Включить в основной текст греческие слова о «муже милосердия», обретшем благоволение перед всякой плотью.
  rationale: При высокой уверенности в данном еврейском чтении оно должно определять основной текст. Греческий параллельный текст важен как свидетельство варианта и для истолкования идиомы, но его добавление отсутствует в представленном еврейском источнике.
- issue: Значение זכרו לטובה
  choice: «память о котором благословенна»
  alternative: «память о котором — ко благу» или «его память — для добра»
  rationale: Выбранная формулировка ясно передаёт поминальную идиому, не превращая её в утверждение о посмертной участи Моисея. Греческое «память которого — в благословениях» поддерживает этот смысл.
translation_notes:
  register: Современный литературный русский с достоинством библейской похвалы. Инверсия с тире подчёркивает характеристику Моисея, не создавая архаической тяжеловесности. Формула «память о котором благословенна» понятна современному читателю и сохраняет торжественно-поминальный оттенок.
