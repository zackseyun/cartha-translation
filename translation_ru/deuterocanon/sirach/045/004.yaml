translation:
  language: ru
  text: Благодаря его верности и смирению Он избрал его из всех людей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «В его вере и кротости Он освятил его; Он избрал его из всякой плоти». В еврейском тексте нет слов «освятил его»; кроме того, вместо «верность» возможно «вера».'
    reason: alternative_reading
lexical_decisions:
- source_word: באמונתו
  choice: за его верность
  rationale: 'Существительное אֱמוּנָה может означать как веру, так и верность, надёжность. В ряду похвальных качеств Моисея рядом со смирением естественнее понимать его как «верность». Предлог ב здесь передаёт основание избрания: «за».'
- source_word: ובענותו
  choice: и смирение
  rationale: עֲנָוָה обозначает смирение, кротость. «Смирение» ясно и естественно передаёт названное качество в современном литературном русском языке.
- source_word: בחר בו
  choice: Он избрал его
  rationale: Сочетание בחר ב идиоматически означает «избрать кого-либо». «Избрал» сохраняет достоинство библейского регистра и точнее соответствует контексту Божьего выбора, чем нейтральное «выбрал».
- source_word: מכל בשר
  choice: из всех людей
  rationale: 'Буквально: «из всякой плоти». В данном контексте выражение означает всё человечество; «из всех людей» естественно для современного русского языка и сохраняет универсальный охват.'
theological_decisions:
- issue: Значение אמונה / πίστις в похвале Моисею
  choice: верность
  alternative: вера
  rationale: Основной еврейский свидетель допускает оба значения, но сочетание со смирением указывает прежде всего на нравственное качество Моисея — верность. Вариант «вера», поддерживаемый греческой параллелью, сохранён в сноске.
- issue: Расхождение еврейского и греческого текстов
  choice: Следовать более краткому еврейскому тексту без слов «освятил его»
  alternative: 'Включить по греческому тексту: «за его веру и кротость Он освятил его; Он избрал его из всякой плоти»'
  rationale: При высокой уверенности в еврейском источнике перевод следует ему как первичному свидетельству. Значимое расширение греческой параллели отмечено в сноске, но не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Он» делает смену подразумеваемого субъекта ясной; «из всех людей» естественно передаёт идиому «из всякой плоти». Сноска сохраняет существенное расхождение с греческой параллелью.
