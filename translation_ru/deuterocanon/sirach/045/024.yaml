translation:
  language: ru
  text: Поэтому Он установил и для него предписание — вечный завет, чтобы поддерживать святилище.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Поэтому для него был установлен завет мира, чтобы он был хранителем святынь и своего народа, дабы достоинство священства принадлежало ему и его потомству вовеки». Еврейское свидетельство здесь короче и говорит о предписании и вечном завете для поддержания святилища.'
    reason: alternative_reading
lexical_decisions:
- source_word: לכן
  choice: Поэтому
  rationale: Ясно сохраняет причинно-следственную связь с ревностным поступком Финееса в предшествующем контексте.
- source_word: גם לו
  choice: и для него
  rationale: Передаёт добавочное значение גם и направленность установления именно в пользу Финееса, не перегружая русскую фразу.
- source_word: הכין
  choice: установил
  rationale: В сочетании с правовым и заветным языком естественно обозначает учреждение долговременного порядка, хотя буквально глагол может значить «приготовил».
- source_word: חק
  choice: предписание
  rationale: Сохраняет значение установленной нормы или положенного установления и не сужает его до материального содержания.
- source_word: ברית עולם
  choice: вечный завет
  rationale: Устойчиво и точно передаёт формулу долговечного, непреходящего завета.
- source_word: לכלכל
  choice: чтобы поддерживать
  rationale: Передаёт продолжающееся обеспечение и сохранение; цель намеренно оставлена широкой, как в еврейском тексте.
- source_word: מקדש
  choice: святилище
  rationale: Соответствует культовому контексту и не ограничивает значение одним лишь храмовым зданием.
theological_decisions:
- issue: Расхождение еврейского и греческого свидетельств о содержании заветного обещания
  choice: 'В основном тексте переведено сохранившееся еврейское чтение: предписание, вечный завет и поддержание святилища.'
  alternative: Греческий текст говорит о «завете мира», хранительстве святынь и народа и вечном достоинстве священства для Финееса и его потомства.
  rationale: Сохранившемуся еврейскому свидетельству отдан приоритет, а существенно более пространное греческое чтение приведено в сноске, поскольку оно заметно влияет на понимание обещания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Он» указывает на Бога, подразумеваемого формой глагола в контексте; прописная буква служит русской читательской ясности. Тире помогает естественно прочитать «вечный завет» как поясняющее продолжение, не устраняя возможной синтаксической неоднозначности еврейского текста.
