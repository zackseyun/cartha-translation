base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/025.yaml
  text: 'And his covenant was with David son of Jesse, from the tribe of Judah: the inheritance of the king is from son to son alone, but the inheritance of Aaron is also for his offspring[a].'
translation:
  language: ru
  text: 'И завет Его был с Давидом, сыном Иессея, из колена Иуды: царское наследие переходит лишь от сына к сыну, а наследие Аарона принадлежит также его потомству[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское свидетельство этого места короче и, по-видимому, сжато или иначе разделено по стихам; греческий текст сохраняет более полное противопоставление: царское наследие передаётся по одной династической линии, тогда как наследие Аарона принадлежит также его потомству.'
    reason: textual_variant
lexical_decisions:
- source_word: וגם בריתו עם דוד
  choice: И завет Его был с Давидом
  rationale: Еврейское וגם может означать «и» или «также»; в русском тексте выбрано естественное связующее «и». Суффикс в בריתו передан местоимением «Его», относящимся по контексту к Богу, без поясняющего добавления в основном тексте.
- source_word: בן ישי
  choice: сыном Иессея
  rationale: Обычное обозначение по отцу; имя передано в принятой русской библейской форме.
- source_word: למטה יהודה
  choice: из колена Иуды
  rationale: מטה в родословном контексте означает племя или колено; «колено Иуды» — ясная и устоявшаяся русская библейская формулировка.
- source_word: κληρονομία βασιλέως
  choice: царское наследие
  rationale: Греческая параллель восполняет отсутствующую в данном еврейском свидетельстве часть противопоставления. Формулировка «царское наследие» естественна по-русски и сохраняет смысл κληρονομία.
- source_word: υἱοῦ ἐξ υἱοῦ μόνου
  choice: переходит лишь от сына к сыну
  rationale: Так передана последовательная династическая преемственность и ограничение, выраженное μόνου, без уточнения, которого нет непосредственно в тексте.
- source_word: κληρονομία Ἀαρὼν καὶ τῷ σπέρματι αὐτοῦ
  choice: а наследие Аарона — также к его потомству
  rationale: Передано противопоставление царской линии и наследственного священства. «Потомство» естественно выражает σπέρμα и соответствует еврейскому זרעו.
theological_decisions:
- issue: Соотношение краткого еврейского свидетельства и более полного греческого текста
  choice: Сохранить имеющуюся еврейскую формулировку о завете с Давидом и дополнить её засвидетельствованным в греческом противопоставлением царского наследия наследию Аарона.
  alternative: Перевести только приведённый еврейский текст, включая фразу о вечном первосвященстве, и не включать греческое противопоставление.
  rationale: Еврейское свидетельство отмечено как существенно не совпадающее и выглядит сжатым либо иначе разделённым по стихам; греческая параллель сохраняет связное и полное противопоставление. Сноска открыто сообщает читателю о текстологической ситуации, не выдавая составной текст за бесспорно единое еврейское чтение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Использованы общеупотребительные формы «завет», «колено Иуды», «наследие» и «потомство»; синтаксис сделан ясным без устранения текстологической сложности.
