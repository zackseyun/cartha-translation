base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/018.yaml
  text: Strangers grew angry with him[a], and in the wilderness they were jealous of him—men of Dathan and Abiram, and the company of Korah, in fury and wrath.
translation:
  language: ru
  text: Чужие разгневались на него[a] и позавидовали ему в пустыне — люди из окружения Дафана и Авирона и собрание Корея — в ярости и гневе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст короче: «Чужие разгневались на него и позавидовали ему в пустыне». В греческом тексте далее прямо названы люди из окружения Дафана и Авирона и собрание Корея, «в ярости и гневе».'
    reason: textual_variant
lexical_decisions:
- source_word: ויחרו בו
  choice: разгневались на него
  rationale: Глагол חרה с предлогом ב выражает вспыхнувший против кого-либо гнев; выбран естественный современный русский оборот.
- source_word: זרים
  choice: чужие
  rationale: Слово обозначает чужих или посторонних и здесь не обязательно указывает на иноплеменников; «чужие» сохраняет эту неоднозначность.
- source_word: ויקנאו בו
  choice: позавидовали ему
  rationale: קנא может означать ревность, рвение или зависть; в повествовании о соперничестве с Аароном естественнее значение зависти.
- source_word: במדבר
  choice: в пустыне
  rationale: Обычный и понятный русский эквивалент для места странствий Израиля.
- source_word: ἄνδρες οἱ περὶ Δαθὰν καὶ Ἀβειρών
  choice: люди Дафана и Авирона
  rationale: Кратко передаёт круг людей, связанных с Дафаном и Авироном, названный в греческом параллельном тексте.
- source_word: ἡ συναγωγὴ Κόρε
  choice: собрание Корея
  rationale: Передаёт организованную группу Корея без привнесения позднейшего церковного смысла.
- source_word: ἐν θυμῷ καὶ ὀργῇ
  choice: в ярости и гневе
  rationale: Сохраняет усилительный греческий дублет и его риторическую напряжённость.
theological_decisions:
- issue: Соотношение краткого сохранившегося еврейского текста и более полного греческого параллельного текста
  choice: Основной текст сохраняет две еврейские части и после тире включает греческое уточнение о Дафане, Авироне и Корее.
  alternative: 'Ограничиться кратким еврейским чтением: «Чужие разгневались на него и позавидовали ему в пустыне».'
  rationale: Еврейское свидетельство первично, но греческий текст сохраняет раннее более полное чтение либо поясняющее расширение. Сноска открыто отмечает различие, не выдавая составной текст за единогласное свидетельство рукописей.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Чужие» намеренно сохраняет возможное значение посторонних или неуполномоченных людей, не превращая их однозначно в этнических иноземцев.
