  terminology: Имена «Дафан», «Авирон» и «Корей» нормативны для русской библейской традиции. «Собрание Корея» приемлемо для συναγωγή и не вносит церковных коннотаций. «Ярость и гнев» сохраняет греческий усилительный дублет.
