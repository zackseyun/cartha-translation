  source_fidelity: 'Основные еврейские колоны переданы точно: זרים — «чужие», ויחרו בו — «разгневались на него», ויקנאו בו — «позавидовали ему», במדבר — «в пустыне». Греческое расширение допустимо в основном тексте при прозрачной сноске. Однако «люди Дафана и Авирона» недостаточно ясно передаёт οἱ περὶ («люди из окружения / связанные с») и может звучать как принадлежность; заключительное «в ярости и гневе» нуждается в более ясном синтаксическом присоединении к перечисленным противникам.'
