  language: en
  yaml_path: translation/deuterocanon/sirach/045/021.yaml
  text: He gave him the choicest holy bread[a]; they shall eat the food offerings of Yahweh. The bread of the Presence is his portion[c][b], a gift to him and to his offspring.
translation:
  language: ru
  text: Он дал ему в пищу первую долю святынь[a]; они будут есть жертвы, приносимые Яхве огнём[b]. Хлеб Присутствия[c] — его доля, дар ему и его потомству.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «первое из святынь он дал ему как хлеб». Еврейская фраза сжата; греческий параллельный текст говорит шире о жертвах, данных священникам в пищу.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский термин обычно передают как «жертвы, сжигаемые для Яхве» или «огненные жертвы»; он обозначает культовые приношения, совершаемые посредством огня.
    reason: lexical_alternative
  - marker: c
    text: Священный хлеб, полагавшийся перед Богом; традиционное название — «хлебы предложения».
    reason: lexical_alternative
lexical_decisions:
- source_word: ראשית קדש נתן לו לחם
  choice: Он дал ему лучшие из святынь в пищу
  rationale: Сжатая еврейская конструкция буквально связывает «первое/лучшее из святого» с «хлебом/пищей». Перевод сохраняет приоритет священной доли и её пищевое назначение, не сводя выражение только к конкретному виду хлеба.
- source_word: אשי יהוה
  choice: огненные приношения Яхве
  rationale: אִשֵּׁי — культовый термин для приношений, совершаемых на огне; формулировка сохраняет жертвенный образ и передаёт тетраграмматон личным именем.
- source_word: יאכלון
  choice: они будут есть
  rationale: Форма множественного числа указывает на священников — Аарона и его потомков; будущее время уместно для установленного им права.
- source_word: לחם פנים
  choice: Хлеб Присутствия
  rationale: Устойчивое культовое выражение обозначает хлеб, полагаемый перед Богом; перевод прозрачен и ближе к еврейскому, чем традиционное «хлебы предложения».
- source_word: חלקו
  choice: его доля
  rationale: Передаёт назначенную, причитающуюся священнику часть.
- source_word: ומתנה לו ולזרעו
  choice: дар ему и его потомству
  rationale: מתנה означает дар или пожалование, а זרעו в данном контексте — продолжающуюся священническую линию.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; «Яхве» сохраняет личное заветное имя без замены титулом.
- issue: Характер священнических приношений
  choice: огненные приношения / Хлеб Присутствия
  alternative: пища Господних жертв / хлебы предложения
  rationale: Выбранные выражения сохраняют культовый и жертвенный смысл исходных терминов, а традиционные варианты отмечены в сносках.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены сжатость еврейского текста, культовая терминология и множественное число в отношении священнических получателей; неоднозначность первой фразы вынесена в сноску.
