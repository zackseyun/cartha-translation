translation:
  language: ru
  text: Бог почтил его[a] и укрепил его на высотах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст пространнее: «Он уподобил его славе святых и возвеличил его среди ужасов врагов». Еврейское свидетельство гласит: «Бог почтил его и укрепил его на высотах».'
    reason: textual_variant
lexical_decisions:
- source_word: ויכבדהו
  choice: почтил его
  rationale: Глагол כבד в данной породе означает оказать честь, почтить. Этот вариант прямо передаёт еврейский текст, не усиливая его до «прославил».
- source_word: אלהים
  choice: Бог
  rationale: В контексте это обычное обозначение единого Бога как подлежащего.
- source_word: ויאמצהו
  choice: укрепил его
  rationale: 'Глагол אמץ здесь имеет каузативный смысл: сделать сильным, укрепить.'
- source_word: במרומים
  choice: на высотах
  rationale: מרומים буквально означает «высоты». Формулировка сохраняет пространственный образ и не решает однозначно, идёт ли речь о небесной сфере или о возвышенном положении.
theological_decisions:
- issue: Значительное расхождение еврейского и греческого свидетелей
  choice: 'Основной текст следует сохранившемуся еврейскому чтению: «Бог почтил его и укрепил его на высотах».'
  alternative: 'Греческий текст: «Он уподобил его славе святых и возвеличил его среди ужасов врагов».'
  rationale: Еврейское свидетельство имеет высокую степень надёжности и потому положено в основу; существенно отличающееся греческое чтение приведено в сноске, чтобы не скрывать текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и понятная формулировка. Образ «высот» сохранён без истолковывающего уточнения.
