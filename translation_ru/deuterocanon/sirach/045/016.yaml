  text: to minister and to serve as priest to him[a], and to bless his people in his name. He chose him from among all the living to present burnt offerings and fat portions.
translation:
  language: ru
  text: чтобы служить Ему и священнодействовать пред Ним, и благословлять Его народ Его именем. Он избрал его из всех живущих, чтобы тот приносил всесожжения и жертвенные части жира.[a]
  philosophy: optimal-equivalence
  footnotes:
