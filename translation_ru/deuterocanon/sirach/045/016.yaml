lexical_decisions:
- source_word: לשרת
  choice: служить
  rationale: В данном контексте глагол обозначает священное служение; русское «служить» естественно передаёт это значение, а следующий оборот прямо уточняет его священнический характер.
- source_word: ולכהן לו
  choice: и быть у Него священником
  rationale: Глагол от כהן означает исполнять священническое служение. Такой оборот ясен современному читателю и сохраняет указание на особое служение Богу.
- source_word: ולברך את עמו בשמו
  choice: и благословлять Его народ Его именем
  rationale: Формулировка близко передаёт еврейский текст и сохраняет богослужебный смысл благословения, произносимого именем Бога.
- source_word: ויבחר בו מכל חי
  choice: Он избрал его из всех живущих
  rationale: מכל חי буквально охватывает «всех живущих». Перевод не сужает выражение до «всех людей» и сохраняет широту оригинала.
- source_word: להגיש
  choice: приносил
  rationale: В жертвенном контексте глагол означает подносить или представлять приношение; по-русски «приносить» здесь наиболее естественно и точно.
- source_word: עלה
  choice: всесожжения
  rationale: Это установленное обозначение жертвы, полностью сжигавшейся на жертвеннике; множественное число естественно передаёт собирательно-повторительный смысл в данном контексте.
- source_word: וחלבים
  choice: жертвенные части жира
  rationale: Множественное число указывает на предназначенные для жертвенника жировые части животных. Формулировка яснее для современного читателя, чем традиционное, но архаичное «тук».
- source_word: προσαγαγεῖν κάρπωσιν Κυρίῳ, θυμίαμα καὶ εὐωδίαν εἰς μνημόσυνον, ἐξιλάσκεσθαι περὶ τοῦ λαοῦ σου
  choice: не включено в основной текст; более полный греческий вариант приведён в сноске
  rationale: 'Греческий параллельный текст значительно полнее сохранившегося еврейского: он упоминает Господа, фимиам, благоухание, напоминание и искупление народа. Эти элементы нельзя молча вносить в основной перевод еврейского свидетельства, но существенное разночтение необходимо показать.'
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и более полным греческим параллельным чтением
  choice: Основной текст следует еврейскому свидетельству, а расширение греческого текста приводится в сноске.
  alternative: Перевести полный греческий вариант в основном тексте либо объединить оба свидетельства.
  rationale: Еврейский текст данного места сохранился и потому служит основанием основного перевода. Внесение греческих дополнений создало бы составной текст, тогда как их полное умолчание скрыло бы важное текстовое расхождение.
translation_notes:
  register: Современный литературный русский язык с достоинством богослужебного контекста. Местоимения, относящиеся к Богу, написаны с прописной буквы. Архаичное «тук» заменено понятным техническим выражением «жертвенные части жира»; неоднозначность местоимений «Он/его» сохранена.
