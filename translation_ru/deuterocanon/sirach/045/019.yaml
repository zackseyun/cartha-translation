base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/019.yaml
  text: The men of Dathan and Abiram[a], and the company of Korah in the strength of their anger— Yahweh saw and was enraged[b], and he consumed them in the heat of his anger.
translation:
  language: ru
  text: Яхве увидел и разгневался; Он истребил их в пылу Своего гнева.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте этот стих пространнее: «Господь увидел и не благоволил; и они были уничтожены в ярости гнева. Он явил над ними чудеса, чтобы истребить их огнём Своего пламени». Еврейский текст здесь короче.'
    reason: alternative_reading
lexical_decisions:
- source_word: וירא יהוה
  choice: Яхве увидел
  rationale: Прямо передаёт еврейское ראה и сохраняет личное имя יהוה. Порядок слов естественен для современного русского языка.
- source_word: ויתאנף
  choice: и разгневался
  rationale: Форма глагола אנף выражает сильный гнев; «разгневался» звучит современно и достойно, не ослабляя смысла.
- source_word: ויכלם
  choice: Он истребил их
  rationale: Форма допускает значение доведения до конца, уничтожения. Контекст суда над мятежниками и греческое συνετελέσθησαν подтверждают смысл полного уничтожения, хотя еврейский текст не уточняет способ.
- source_word: בחרון אפו
  choice: в пылу Своего гнева
  rationale: Передаёт устойчивый образ палящего, разгоревшегося гнева и при этом естественно звучит по-русски.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит Тетраграмматон; передача личным именем сохраняет отличие имени Бога от титула.
- issue: Соотношение еврейского текста и более пространного греческого параллельного чтения
  choice: Основной текст следует сохранившемуся еврейскому чтению; греческое расширение вынесено в примечание
  alternative: Включить в основной текст греческие слова о чудесах и огненном пламени
  rationale: Еврейское свидетельство здесь имеется и должно оставаться основным. Греческий текст подтверждает уничтожающий характер суда, но содержит подробности, отсутствующие в еврейской строке.
- issue: Граница стиха
  choice: Стих начинается со слов «Яхве увидел» согласно явному номерному маркеру в предоставленном еврейском издании
  alternative: Присоединить предшествующие слова о людях Дафана и Авирона и общине Корея
  rationale: В исходном еврейском материале маркер (יט) стоит непосредственно перед וירא יהוה; греческий параллельный текст данного стиха также начинается с того, что Господь увидел. Поэтому предшествующая фраза относится к предыдущему стиху и не включается вопреки английскому консультационному слою.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Местоимение «Он» написано с прописной буквы как уважительное обозначение Бога. Предшествующая фраза о Дафане, Авироне и Корее не включена из-за явной границы стиха в еврейском источнике.
