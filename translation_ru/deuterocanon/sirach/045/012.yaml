translation:
  language: ru
  text: Великолепие славы и хвала могуществу[a], услада для глаз и совершенство красоты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «предмет гордости и чести, произведение силы, украшения, желанные глазам». Еврейское свидетельство здесь заметно отличается по формулировке, хотя оба текста возвышенно описывают первосвященническое убранство.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוד
  choice: великолепие
  rationale: Передаёт величие и сияющую красоту, сохраняя отличие от следующего כבוד («слава»).
- source_word: כבוד
  choice: слава
  rationale: Обычное возвышенное значение слова; в сочетании הוד כבוד получается поэтическое «великолепие славы».
- source_word: ותהלת עז
  choice: и хвала могуществу
  rationale: 'Близко передаёт сжатое еврейское сочетание: תהלה — «хвала», עז — «сила, могущество»; формулировка намеренно не устраняет его неоднозначность.'
- source_word: מחמד עין
  choice: услада для глаз
  rationale: מחמד обозначает нечто желанное и радующее; вместе с עין выражение описывает зрительную привлекательность.
- source_word: ומכלל יופי
  choice: и совершенство красоты
  rationale: מכלל может указывать на полноту или совершенство; здесь это соответствует возвышенному описанию первосвященнического убранства.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческой параллели
  choice: Основной текст переведён по еврейскому свидетельству Каирской генизы; существенное отличие греческого текста отмечено в сноске.
  alternative: 'Перевод под влиянием греческого: «предмет похвалы и чести, произведение силы, желанные для глаз украшения».'
  rationale: Сохранившийся еврейский текст связен и имеет высокую степень достоверности, поэтому он остаётся основой перевода. Греческая параллель выражает сходную общую мысль о великолепии первосвященнических украшений, но заметно отличается словесно; это различие нельзя молча сглаживать.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Сохранён именной ряд еврейского оригинала и его сжатость; церковнославянизмы и конфессионально окрашенные толкования не вводились.
