  text: At his word the signs came quickly[a], and he strengthened him before a king. He commanded him concerning the people[c][b], and showed him his glory.
translation:
  language: ru
  text: По его слову знамения быстро происходили[a], и Он укрепил его перед царём[b]. Он дал ему повеления о народе и показал ему Свою славу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Своими словами Он прекратил знамения», а не «знамения быстро происходили».'
    reason: textual_variant
  - marker: b
    text: 'В греческом тексте: «прославил его перед царями» вместо «укрепил его перед царём».'
    reason: textual_variant
  - marker: c
    text: 'Дошедший еврейский текст здесь труден и может означать: «и они увидели его славу»; основной текст следует поддержанному греческим свидетельством смыслу: «и показал ему Свою славу».'
    reason: textual_variant
lexical_decisions:
- source_word: בדבריו
  choice: По его слову
  rationale: Передаёт инструментальное значение предлога ב и сохраняет связь происходящего со словом Моисея; единственное число естественно по-русски.
- source_word: האותות מהרו
  choice: знамения совершались быстро
  rationale: אותות прямо передано как «знамения», а буквальное «спешили» сглажено в естественное русское выражение без утраты значения поспешности.
- source_word: ויחזקהו לפני מלך
  choice: и Он укрепил его перед царём
  rationale: Следует еврейскому חזק в породе hифиль («укрепил») и единственному числу מלך; прописная буква проясняет смену субъекта и указывает на Бога по контексту.
- source_word: ויצוהו אל העם
  choice: Он дал ему повеления о народе
  rationale: Сохраняет значение צוה «повелевать» и передаёт трудное אל העם как отношение повелений к народу, не навязывая узкого толкования.
- source_word: ויראו את כבודו
  choice: и показал ему Свою славу
  rationale: Основной текст принимает поддержанное греческим параллельным свидетельством чтение «показал ему», поскольку переданная еврейская форма трудна и, вероятно, нестабильна.
theological_decisions:
- issue: Соотношение еврейского текста и греческого параллельного свидетельства при значительном расхождении
  choice: Там, где еврейский текст ясен, основной текст следует ему; в последней фразе принято гречески поддержанное «показал ему Свою славу».
  alternative: 'Строго передать дошедшую еврейскую форму: «и они увидели его славу»; либо полностью следовать греческому тексту: «словами своими прекратил знамения и прославил его перед царями».'
  rationale: Так сохраняется первенство уцелевшего еврейского свидетельства, но учитывается вероятная повреждённость или нестабильность последней еврейской формы; существенные варианты не скрываются, а вынесены в примечания.
- issue: К кому относится местоимение в выражении «его/Свою славу»
  choice: «Свою славу» относится к Богу, Который показывает её Моисею.
  alternative: «его славу» можно формально понять как славу Моисея.
  rationale: Греческое ἔδειξεν αὐτῷ τῆς δόξης αὐτοῦ и повествовательный контекст естественнее указывают на Божью славу, показанную Моисею; возвратное местоимение устраняет ненужную русскую двусмысленность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис ясен для обычного читателя; ключевые еврейские образы («слово», «знамения», «слава») сохранены. Текстологические расхождения обозначены примечаниями без конфессионального истолкования.
