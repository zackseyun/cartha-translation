base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/015.yaml
  text: Moses ordained him and anointed him with holy oil[a]. It became for him an everlasting covenant, and for his offspring[c][b], for as long as the heavens endure.
translation:
  language: ru
  text: Моисей посвятил его на служение[a] и помазал священным маслом. И это стало вечным заветом для него и его потомства[b] — доколе существуют небеса[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполнил его руку». Это древнееврейское священническое выражение означает поставление или посвящение на служение; греческий текст также буквально говорит о наполнении рук.'
    reason: lexical_alternative
  - marker: b
    text: 'После слов о потомстве греческий параллельный текст продолжает: «служить Ему, быть священником и благословлять Его народ Его именем». В представленном сохранившемся еврейском тексте этих слов нет.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «как дни небес» — образ непреходящей длительности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וימלא משה את ידו
  choice: Моисей посвятил его в священники
  rationale: Буквально «Моисей наполнил его руку»; это устойчивое древнееврейское выражение означает поставление на священническое служение. Выбранный перевод передаёт значение идиомы ясно и естественно, не превращая её в непонятный буквальный образ.
- source_word: וימשחהו
  choice: помазал
  rationale: Глагол משח прямо обозначает ритуальное помазание; это значение подтверждается греческим ἔχρισεν.
- source_word: בשמן הקדש
  choice: священным маслом
  rationale: Так естественно передаётся ритуальный смысл сочетания; «священное» здесь характеризует масло как предназначенное для святого употребления.
- source_word: ברית עולם
  choice: вечным заветом
  rationale: Сочетание обозначает непреходящий, долговечный завет и соответствует греческому διαθήκην αἰώνιον. Слово «вечный» сохраняет силу исходной формулировки без богословского расширения.
- source_word: ולזרעו
  choice: и его потомства
  rationale: זרע — собирательное обозначение потомков. «Потомство» сохраняет собирательный смысл и звучит естественнее буквального «семя».
- source_word: כימי שמים
  choice: доколе существуют небеса
  rationale: Буквально «как дни небес». Контекстуально это образ продолжительности; выбранная формулировка ясно передаёт временной смысл, сохраняя образ небес.
theological_decisions:
- issue: Объём обещания завета в контексте священства
  choice: Завет назван вечным и отнесён к Аарону и его потомству, причём длительность выражена образом существования небес.
  alternative: Истолковать стих как прямое утверждение об абсолютно безусловном и непрерывном священстве во всех последующих обстоятельствах.
  rationale: Перевод сохраняет сильную формулировку еврейского текста, но не добавляет выводов о характере и условиях её исполнения, которых сам стих явно не формулирует.
- issue: Передача идиомы «наполнить руку»
  choice: посвятил его в священники
  alternative: наполнил его руку; поставил его; посвятил его
  rationale: В данном контексте это техническая формула поставления на священническое служение. Функциональная передача нужна для понятности, а буквальная форма сохранена в примечании.
- issue: Греческое продолжение, отсутствующее в представленном еврейском тексте
  choice: Не включать продолжение в основной текст, но отметить его в сноске.
  alternative: 'Включить греческое продолжение: «служить Ему, быть священником и благословлять Его народ Его именем».'
  rationale: Основной перевод следует сохранившемуся еврейскому свидетельству как первичному источнику задания; более полный греческий параллельный текст документируется для текстологической прозрачности.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Техническая священническая идиома раскрыта в основном тексте, а её буквальная форма вынесена в сноску. Синтаксис сохраняет связь помазания с последующим утверждением о завете, не сглаживая полностью неоднозначность местоименного «это».
