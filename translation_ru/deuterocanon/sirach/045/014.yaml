translation:
  language: ru
  text: Его хлебное приношение будет целиком сжигаться ежедневно, неизменно дважды в день[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Его жертвы будут целиком сжигаться ежедневно, постоянно, дважды в день». Еврейский текст говорит конкретнее: «его хлебное приношение».'
    reason: alternative_reading
lexical_decisions:
- source_word: מנחתו
  choice: его хлебное приношение
  rationale: В жертвенном и священническом контексте מִנְחָה обозначает именно хлебное приношение, а не приношение вообще.
- source_word: כליל תקטר
  choice: пусть целиком сжигается на жертвеннике
  rationale: כליל передаёт полное сожжение, а קטר — возжигание жертвы, от которого поднимается дым. Уточнение «на жертвеннике» естественно выражает жертвенный смысл, не превращая приношение в иной вид жертвы.
- source_word: בכל יום
  choice: каждый день
  rationale: Прямо передаёт временное выражение без ослабления его повторяемости.
- source_word: צמיד
  choice: неизменно
  rationale: В данном культовом контексте слово выражает постоянную, регулярную повторяемость; «неизменно» естественно сочетается с указанием частоты.
- source_word: פעמים
  choice: дважды
  rationale: При поддержке греческого δίς означает «дважды»; контекст связывает эту частоту с каждым днём.
theological_decisions:
- issue: Конкретный вид приношения в священническом контексте
  choice: Следовать еврейскому מנחתו и переводить «его хлебное приношение».
  alternative: «Его жертвы», как в греческом параллельном тексте.
  rationale: Сохранившийся еврейский текст здесь конкретнее греческого и служит основным источником; более общее греческое чтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством богослужебного контекста. Повелительно-нормативное «пусть… сжигается» передаёт модальность еврейской глагольной формы; тире сохраняет ритм и подчёркивает регулярность действия.
