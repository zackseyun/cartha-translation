base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/045/013.yaml
  text: Before him there had not been such garments[a], and no foreigner will ever wear them; only his sons and his descendants throughout their generations.
translation:
  language: ru
  text: 'До него не было подобных одежд, и никогда не облачится в них чужой: носить их могут лишь его сыновья и его потомки из поколения в поколение[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Вторая половина еврейского текста трудна. Приблизительно и с неопределённым субъектом она может означать: «[Он] доверил это ему и его сыновьям; так же и его сыновьям — в их поколениях». Греческий текст яснее выражает общий смысл: эти одежды не должен носить никто чужой; они принадлежат только сыновьям Аарона и его потомкам.'
    reason: alternative_reading
lexical_decisions:
- source_word: לפניו
  choice: До него
  rationale: 'В данном контексте выражает временное предшествование: прежде Аарона подобных священнических одежд не было. Это подтверждает греческое πρὸ αὐτοῦ.'
- source_word: לא היה כן
  choice: не было таких
  rationale: Сжатая еврейская конструкция указывает, что прежде не существовало ничего подобного; подразумеваемое существительное «одежды» восстанавливается из контекста.
- source_word: ילבשם
  choice: не облачится в них
  rationale: Глагол לבש означает «надевать, носить одежду»; «облачиться» естественно и достойно звучит применительно к священническим одеждам.
- source_word: זר / ἀλλογενής
  choice: чужой
  rationale: Обозначает человека вне установленного священнического рода. «Чужой» сохраняет родовую, а не этническую направленность запрета.
- source_word: לעולם
  choice: вовеки
  rationale: Передаёт постоянную силу отрицания кратко и в возвышенном, но понятном библейском регистре.
- source_word: לבניו... בניו לדורותם / τῶν υἱῶν αὐτοῦ... τὰ ἔκγονα αὐτοῦ διὰ παντός
  choice: только его сыновья и их потомки из поколения в поколение
  rationale: Главный текст учитывает ясное греческое свидетельство об исключительном праве сыновей Аарона и продолжении этого права в их потомстве; «их потомки» по-русски устраняет неясность референции и соответствует наследованию по поколениям.
theological_decisions:
- issue: Исключительное право рода Аарона на священнические одежды
  choice: Запрет распространяется на всякого, кто не принадлежит к установленной линии Аарона; одежды предназначены его сыновьям и их потомкам.
  alternative: Трудную еврейскую фразу можно понимать как утверждение, что Бог доверил или утвердил это за Аароном и его сыновьями, без прямо выраженной оговорки «только».
  rationale: Еврейский текст во второй половине стиха труден, однако זר прямо обозначает постороннего, а греческая параллель ясно формулирует исключение в пользу сыновей и потомков Аарона. Неопределённость еврейской передачи отмечена в сноске, а не скрыта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Облачится» и «вовеки» соответствуют теме священнического облачения, оставаясь понятными. Реальная текстологическая трудность еврейской второй половины стиха вынесена в сноску.
