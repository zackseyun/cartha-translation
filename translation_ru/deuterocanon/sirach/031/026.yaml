  text: Years of life are with a discerning man[a]; he will lie down until morning[b], and his life is with him.
translation:
  language: ru
  text: Годы жизни сопутствуют рассудительному человеку; он переночует до утра, и жизнь его останется при нём.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское נפש может означать «жизнь», «самого человека» или «душу». Поэтому возможен перевод: «и душа его останется при нём».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст здесь резко отличается от еврейского: приблизительно «Лишающий ближнего средств к жизни убивает его». По-видимому, он отражает иную текстовую форму; основной перевод следует сохранившемуся еврейскому свидетельству.'
    reason: textual_variant
lexical_decisions:
- source_word: שנות חיים
  choice: годы жизни
  rationale: Сохраняет образ и конструкцию еврейского текста, не превращая её без необходимости в прямое обещание «долгой жизни».
- source_word: עם איש נבון
  choice: сопутствуют рассудительному человеку
  rationale: Предлог עם передан естественной русской связью «сопутствуют», а נבון — словом «рассудительный», подчёркивающим способность понимать и здраво судить.
- source_word: ילין עד בקר
  choice: он переночует до утра
  rationale: Глагол לין обозначает ночлег или пребывание ночью; «переночует до утра» естественно и сохраняет ночной образ.
- source_word: ונפשו עמו
  choice: и жизнь его останется при нём
  rationale: נפש здесь вероятнее означает жизнь или живое «я», а не обязательно нематериальную душу. Формулировка передаёт сохранение жизни, не устраняя лексической неоднозначности, отмеченной в сноске.
theological_decisions:
- issue: Антропологическое значение נפש
  choice: жизнь его останется при нём
  alternative: душа его останется при нём
  rationale: В данном контексте נפש естественно понимать как жизнь или самого живого человека. Перевод «душа» мог бы внести более узкое богословское значение, которого еврейское слово само по себе не требует.
- issue: Резкое расхождение еврейского и греческого свидетелей
  choice: Основной текст следует сохранившемуся еврейскому чтению
  alternative: Перевести греческое чтение о лишении ближнего средств к жизни
  rationale: При наличии уверенно засвидетельствованного еврейского текста он служит основным источником; существенно отличающееся греческое чтение документируется в сноске, а не смешивается с ним.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, афористичным звучанием. Синтаксический параллелизм еврейского изречения сохранён, но эллиптическая конструкция с עם выражена естественным русским глаголом «сопутствуют».
