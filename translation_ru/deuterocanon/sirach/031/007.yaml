lexical_decisions:
- source_word: תקלה
  choice: камень преткновения
  rationale: Сохраняет конкретный образ препятствия, о которое спотыкаются и которое ведёт к беде; выражение естественно для русского библейского стиля.
- source_word: אויל
  choice: глупец
  rationale: Обычный термин литературы мудрости для человека, которому недостаёт не только рассудительности, но и нравственной зрелости.
- source_word: פותה
  choice: простодушный
  rationale: Передаёт неопытность и доверчивость человека, которого легко обмануть, без чрезмерно резкого оттенка слова «простак».
- source_word: יוקש
  choice: попадётся в западню
  rationale: Естественно по-русски передаёт пассивный образ попадания в ловушку.
- source_word: בו
  choice: в его западню
  rationale: Передаёт отнесённость местоименного суффикса к подразумеваемому предмету из контекста; формулировка согласована с образом ловушки, хотя буквальнее возможно «им».
theological_decisions:
- issue: Существенное расхождение еврейского и греческого свидетелей
  choice: Основной текст переведён по сохранившемуся еврейскому чтению.
  alternative: «Ведь сны многих ввели в заблуждение, и надеявшиеся на них пали».
  rationale: При наличии еврейского текста Сираха он служит основным источником. Греческий параллельный текст содержит не небольшой вариант, а существенно иную строку о снах, поэтому его следует сохранить в сноске, не смешивая два чтения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. «Камень преткновения» сохраняет метафору оригинала, а «простодушный» понятно передаёт термин литературы мудрости.
