  source_fidelity: 'Основная строка верно следует сохранившемуся еврейскому тексту: תקלה передано как «камень преткновения», אויל — «глупец», а פותה — как доверчивый, легко вводимый в заблуждение человек. Однако «в его западню» добавляет невыраженный в еврейском тексте притяжательный оттенок и неудачно соотносит «его» с нейтральным «это». Следует прямо передать בו инструментальным «им», сохранив образ ловушки в глаголе «пойман».'
  naturalness: «Ведь это — камень преткновения для глупца» звучит естественно в современном литературном русском с допустимой для книги Премудрости библейской образностью. «Всякий легковерный будет им пойман» ясно и не содержит искусственного «его западню».
  terminology: «Камень преткновения» уместно сохраняет образ תקלה. «Глупец» соответствует устойчивому термину мудростной литературы. «Легковерный» точнее, чем потенциально положительно окрашенное «простодушный», передаёт פותה как человека, которого легко обмануть. Сноска точно фиксирует существенное расхождение греческого свидетеля.
