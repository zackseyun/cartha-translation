  text: Even if you sit among many[b][a], do not reach out your hand before your companion.
translation:
  language: ru
  text: Даже если сидишь среди многих[b], не протягивай руку раньше своего товарища[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть не бери еду раньше другого человека за столом.
    reason: cultural_note
  - marker: b
    text: 'Греческий параллельный текст у Света здесь резко отличается: в нём говорится, что «насмешки беззаконных» не ведут к благоволению. Поэтому основной текст переведён по еврейскому свидетельству, а греческое чтение отмечено как расходящийся вариант.'
    reason: textual_variant
lexical_decisions:
- source_word: וגם אם
  choice: Даже если
  rationale: Передаёт уступительное условие естественным современным русским языком; начальное ו не требует отдельного «и» в самостоятельном стихе.
- source_word: בין רבים
  choice: среди многих
  rationale: Сохраняет неопределённость еврейского выражения и не добавляет прямо не названных понятий «толпа» или «пир».
- source_word: ישבת
  choice: сидишь
  rationale: Перфект в условно-наставительном контексте имеет обобщённое настоящее значение; форма второго лица передана естественно для русского изречения.
- source_word: לפני
  choice: раньше
  rationale: В данном контексте обозначает первенство действия, а не пространственное положение «перед».
- source_word: רע
  choice: своего сотрапезника
  rationale: רע здесь означает ближнего или товарища; контекст протягивания руки указывает на совместную трапезу. «Сотрапезник» ясно передаёт ситуативный смысл, не превращая его в близкого друга.
- source_word: אל תושיט יד
  choice: не протягивай руку
  rationale: Сохраняет конкретный образ еврейского текста и звучит естественно по-русски; подразумеваемый предмет — еда — пояснён в сноске, а не внесён в основной текст.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой наставительной формой. «Сотрапезник» несколько книжное, но общепонятное и точное для контекста застольного этикета; оно позволяет избежать двусмысленного «товарищ» и не перегружает основной текст пояснением.
