  text: Be the first to stop[a], for the sake of good manners, and do not be a glutton[b], lest you be despised.
translation:
  language: ru
  text: Первым перестань есть ради приличия[a] и не будь обжорой, чтобы не вызвать к себе отвращения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское מוסר часто означает «наставление» или «дисциплина»; здесь, в контексте поведения за столом, вероятнее всего имеются в виду воспитанность и соблюдение приличий.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст этой строки сохранился, однако в предоставленных исходных данных отмечено существенное расхождение: приведённый греческий параллельный текст этой еврейской строке не соответствует. Перевод следует прежде всего еврейскому свидетельству.'
    reason: textual_variant
lexical_decisions:
- source_word: חדל ראשון
  choice: Первым перестань есть
  rationale: Императив חדל означает «перестань, прекрати», а ראשון побуждает сделать это раньше других. Глагол «есть» добавлен из контекста застолья для естественности русского выражения.
- source_word: בעבור מוסר
  choice: ради приличия
  rationale: בעבור указывает на мотив или цель; מוסר обычно означает «наставление, дисциплина», но в контексте поведения за столом обозначает воспитанность и соблюдение приличий.
- source_word: גרגרן
  choice: обжора
  rationale: Слово обозначает человека, который жадно и чрезмерно ест. «Обжора» — ясный современный русский эквивалент с требуемой нравственной окраской.
- source_word: פן תמאס
  choice: чтобы не вызвать отвращения
  rationale: פן вводит предостережение, а форма от מאס передаёт отвержение или отвращение. Такая формулировка естественно выражает социальное последствие невоздержанности, не ограничивая смысл одним лишь презрением.
