lexical_decisions:
- source_word: הסב
  choice: Возляг за столом
  rationale: В контексте пира глагол обозначает принятую в древности позу за трапезой — лежать, опираясь на локоть. Добавление «за столом» делает значение ясным современному читателю.
- source_word: כאיש אשר נבחר
  choice: как человек благовоспитанный
  rationale: Буквально выражение допускает значения «как человек избранный» или «видный»; в наставлении о поведении за столом оно, вероятно, указывает на достойные, учтивые манеры.
- source_word: תעט
  choice: не набрасывайся на еду
  rationale: Глагол описывает жадное, невоздержанное принятие пищи. Такой перевод естественно передаёт порицаемое поведение, не сужая его до одного способа еды.
- source_word: תגעל
  choice: не вызвать отвращения
  rationale: Форма выражает итог непристойного поведения — стать отвратительным для окружающих или вызвать у них отвращение. Русская формулировка естественна и сохраняет социальный смысл предупреждения.
