translation_notes:
  register: Современный литературный русский язык с достойным наставительным тоном. Архаизирующее «возляг» сохранено как точное обозначение древней застольной позы, но пояснено словами «за столом». Маркеры сносок размещены непосредственно при соответствующих выражениях; текстологическая сноска поставлена в конце стиха.
