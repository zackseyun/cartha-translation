  text: Who is this? Let us call him blessed[a], for he has done wonders among his people.
translation:
  language: ru
  text: Кто он? Назовём его блаженным[a], потому что он совершил необычайное среди своего народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая параллель здесь существенно отличается: «Образованный человек знает многое, и многоопытный изложит разумение». Вероятно, она отражает иную форму текста или иное распределение стихов.'
    reason: alternative_reading
lexical_decisions:
- source_word: מי הוא זה
  choice: Кто он?
  rationale: Еврейская риторическая формула указывает на достойного подражания человека. По-русски «Кто он?» естественно передаёт вопрос, тогда как буквальное «Кто этот?» здесь звучит менее литературно.
- source_word: ונאשרנו
  choice: Назовём его блаженным
  rationale: Глагол אשר означает признать или провозгласить человека блаженным, счастливым. Форма с присоединённым ו допускает побудительно-волевой оттенок, переданный как «назовём».
- source_word: כי
  choice: потому что
  rationale: Союз вводит основание для провозглашения человека блаженным.
- source_word: הפליא לעשות
  choice: совершил необычайное
  rationale: Сочетание буквально выражает совершение чего-либо необыкновенного или дивного. «Совершил необычайное» сохраняет возвышенность, не уточняя характер поступка сверх текста.
- source_word: בעמו
  choice: среди своего народа
  rationale: 'Предлог ב здесь естественно понимать локативно: поступок был совершён среди народа этого человека. Перевод не вводит дополнительного значения благодеяния «для народа».'
theological_decisions:
- issue: Существенное расхождение между еврейским свидетелем и указанной греческой параллелью
  choice: Основной текст переведён по сохранившемуся еврейскому чтению; греческое чтение приведено в сноске.
  alternative: «Образованный человек знает многое, и многоопытный изложит разумение».
  rationale: Предоставленный греческий текст не является близким соответствием еврейской строке и, вероятно, отражает иную текстовую форму либо иную нумерацию стихов. Поскольку еврейский текст здесь сохранился с высокой уверенностью, он имеет приоритет, но существенное расхождение отмечено открыто.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским тоном. Формулировка сохраняет риторический вопрос и не конкретизирует, в чём именно состоял необычайный поступок.
