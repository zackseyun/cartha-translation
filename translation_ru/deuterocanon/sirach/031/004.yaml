translation:
  language: ru
  text: Бедняк трудится, истощая свои силы, а если отдохнёт, останется в нужде.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עמל עני
  choice: Бедняк трудится
  rationale: «עמל» передаёт тяжёлый, изнурительный труд; нейтральное современное «трудится» сохраняет достоинство и естественность речи.
- source_word: לחסר כחו
  choice: истощая свои силы
  rationale: Буквально выражение связано с убавлением, истощением силы; деепричастная конструкция ясно передаёт результат непрерывного труда.
- source_word: ואם ינוח
  choice: а если отдохнёт
  rationale: Сохраняется условная конструкция и обычное значение глагола נוח — отдыхать, прекращать труд.
- source_word: לא נחה לו
  choice: останется в нужде
  rationale: 'Форма в рукописной традиции трудна; перевод следует смыслу еврейского параллельного варианта «יהיה צריך» и подтверждённому английскому консультационному слою: прекращение труда не избавляет бедняка от нужды.'
theological_decisions:
- issue: Причина и нравственная оценка бедности
  choice: Не добавлять осуждения бедняка и не объяснять причину его нужды
  alternative: Истолковать нужду как следствие праздности или личной вины
  rationale: 'Еврейский текст описывает тяжёлое положение бедняка: труд истощает его, но отдых оставляет его в нужде. Нравственная причина бедности в стихе не названа.'
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма сохранена. Перевод основан на еврейском тексте и его внутреннем варианте. Приведённый греческий параллельный текст («от нечистого что очистится?..») по содержанию не соответствует этому стиху и потому не использован.
