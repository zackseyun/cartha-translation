base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/005.yaml
  text: One who eagerly pursues gain will not go unpunished[c][b][a], and one who loves profit will go astray by it.
translation:
  language: ru
  text: Кто гонится за богатством[b], тот не останется без наказания; кто любит прибыль[c], тот из-за неё собьётся с пути.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст содержит изречение о погоне за богатством и любви к прибыли. Греческий текст этого стиха гласит иначе: «Гадания, приметы и сны суетны, и сердце воображает, как у роженицы». По-видимому, здесь отражена существенно иная текстовая традиция.'
    reason: textual_variant
  - marker: b
    text: 'Или: «за золотом» или «за наживой»; еврейское слово может обозначать материальное богатство более конкретно.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «плату» или «цену».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רודף
  choice: гонится
  rationale: Причастие выражает постоянное, целенаправленное стремление; «гонится» естественно передаёт неодобрительный оттенок погони за материальной выгодой.
- source_word: חרוץ
  choice: богатство
  rationale: В данном контексте слово, вероятно, обозначает материальное достояние или наживу, а не буквально металл; «богатство» сохраняет этот широкий смысл и параллелизм с מחיר.
- source_word: לא ינקה
  choice: не останется без наказания
  rationale: Устойчивое выражение означает, что человек не избежит ответственности или наказания. Такой перевод ясен современному читателю и не сводит смысл лишь к субъективной виновности.
- source_word: אוהב
  choice: кто любит
  rationale: Субстантивированное причастие передано обобщающей конструкцией, параллельной началу первой части стиха.
- source_word: מחיר
  choice: прибыль
  rationale: Хотя обычные значения включают «цена» и «плата», здесь речь идёт о привязанности к материальной выгоде; «прибыль» естественно выражает экономико-нравственный смысл.
- source_word: בו
  choice: из-за неё
  rationale: 'Предлог с местоименным суффиксом понят причинно: любимая прибыль становится причиной уклонения. Женский род согласован с русским словом «прибыль».'
- source_word: ישגה
  choice: собьётся с пути
  rationale: Глагол обозначает уклонение или заблуждение. Выражение сохраняет образ движения в неверном направлении и его нравственную многозначность.
theological_decisions:
- issue: Выбор еврейского текста при резко расходящемся греческом параллельном чтении
  choice: 'Основной текст переведён по сохранившемуся еврейскому свидетельству: о погоне за богатством и любви к прибыли.'
  alternative: 'Греческий текст говорит: «Гадания, приметы и сны суетны, и сердце рисует образы, как у роженицы».'
  rationale: При наличии еврейского текста Сираха он служит основным источником. Однако греческое чтение представляет не малый вариант, а совершенно иное изречение, поэтому расхождение открыто отмечено, а не сглажено.
translation_notes:
  register: Современный литературный русский язык с лаконичной формой изречения и сохранённым параллелизмом двух частей. «Собьётся с пути» передаёт образно-нравственный смысл, не уточняя сверх источника характер заблуждения.
