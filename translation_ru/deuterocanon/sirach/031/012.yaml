base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/012.yaml
  text: Therefore hold fast to his goodness[a], and the assembly will recount his praise. Bread is instruction[c][b], and wine with it.
translation:
  language: ru
  text: Поэтому крепко держись его доброты[b], и собрание возвестит ему хвалу. Хлеб — наставление[c], и вино вместе с ним.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь существенно иной: «Многое я видел в своих странствиях, и разумение моё превосходит мои слова». Еврейское и греческое свидетельства резко расходятся.'
    reason: textual_variant
  - marker: b
    text: 'Или: «его щедрости», «его благодеяния».'
    reason: lexical_alternative
  - marker: c
    text: Заключительная фраза трудна как по тексту, так и по смыслу. Слово, переведённое как «наставление», может также означать «воспитание», «дисциплину» или «взыскание».
    reason: lexical_alternative
lexical_decisions:
- source_word: על כן
  choice: Поэтому
  rationale: Естественно передаёт выводное значение еврейского сочетания и связь с предшествующим контекстом.
- source_word: חזק
  choice: крепко держись
  rationale: Императив допускает значения «будь крепок», «укрепи» и «держись крепко»; при טובו последняя передача наиболее естественно выражает призыв не отступать от признания оказанной доброты.
- source_word: טובו
  choice: его доброты
  rationale: Сохраняет широкий смысл «доброта, благо» и одновременно допускает контекстуальный оттенок щедрости или благодеяния.
- source_word: ותהלתו יספר קהל
  choice: и собрание возвестит ему хвалу
  rationale: Передаёт יספר как публичное возвещение, а קהל — нейтральным «собрание», без излишне узкого культового оттенка.
- source_word: מוסר לחם
  choice: Хлеб — наставление
  rationale: מוסר охватывает наставление, воспитание и взыскание. «Наставление» звучит естественнее по-русски, но трудность и неоднозначность фразы отмечены в сноске.
- source_word: ויין יחדו
  choice: и вино вместе с ним
  rationale: Формально сохраняет значение יחדו «вместе, совместно» и не пытается прояснить неясную связь между хлебом, наставлением и вином.
theological_decisions:
- issue: Выбор основного текста при резком расхождении еврейского и греческого свидетелей
  choice: Основной текст переведён по сохранившемуся еврейскому чтению; греческое чтение приведено в сноске.
  alternative: 'Перевести только по-гречески: «Многое я видел в своих странствиях, и разумение моё превосходит мои слова».'
  rationale: Еврейский текст имеет приоритет как исходное свидетельство Сираха, однако глубокое расхождение нельзя скрывать или сглаживать посредством составного чтения.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксическая сжатость заключительной фразы сохранена намеренно из-за её неясности. Все варианты вынесены в сноски без конфессионального истолкования.
