  yaml_path: translation/deuterocanon/sirach/031/031.yaml
  text: Listen, my son, and accept my words; do not reject me, and in the end you will find my words.
translation:
  language: ru
  text: Слушай, сын мой, и прими мои слова; не насмехайся надо мной, и в конце концов ты найдёшь мои слова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этого стиха существенно отличается: в нём говорится о человеке, который постится из-за своих грехов, а затем снова совершает то же самое.'
    reason: Сообщает читателю о крупном расхождении между еврейской и греческой текстовыми традициями, не смешивая их в основном тексте.
lexical_decisions:
- source_word: שמע
  choice: Слушай
  rationale: Прямо передаёт повелительную форму единственного числа и естественно вводит отцовское наставление.
- source_word: וקח אמרי
  choice: и прими мои слова
  rationale: Буквально «возьми мои слова»; по-русски «прими» естественно выражает осознанное принятие наставления.
- source_word: ואל תלעיז עליי
  choice: не злословь обо мне
  rationale: הלעיז על означает говорить дурно о ком-либо, порочить или осмеивать; «не злословь обо мне» сохраняет речевой характер действия лучше, чем более общее «не отвергай меня».
- source_word: ובאחרית תמצא דברי
  choice: и в конце ты найдёшь мои слова верными
  rationale: 'Буквально: «и в конце ты найдёшь мои слова». Добавление «верными» делает подразумеваемый результат проверки понятным по-русски, не меняя утверждения о том, что окончательный исход подтвердит наставление.'
theological_decisions:
- issue: Расхождение еврейского текста с греческим параллельным текстом
  choice: Переводить засвидетельствованный еврейский текст без согласования с греческим
  alternative: Следовать греческому тексту о постящемся, который вновь совершает те же грехи
  rationale: Предоставленный еврейский источник имеет высокую степень уверенности и содержит совершенно иное наставление. Смешение двух традиций скрывало бы реальное текстовое расхождение.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным тоном наставления. Обращение «сын мой» сохранено. Формулировка избегает архаизмов и конфессионально окрашенных толкований.
