translation:
  language: ru
  text: Бессонница богача изнуряет его тело[a], а тревога о средствах к жизни прогоняет сон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало еврейского текста трудно и, вероятно, дошло в повреждённом виде. Греческий параллельный текст значительно отличается: «Пустые и ложные надежды — у неразумного человека, и сновидения окрыляют глупцов». Основной текст следует сохранившемуся еврейскому свидетельству в наиболее вероятном для контекста смысле.'
    reason: textual_variant
lexical_decisions:
- source_word: שקר עשיר
  choice: бессонница богача
  rationale: 'Переданный еврейский текст труден: שקר обычно означает «ложь, обман», но такое значение здесь не даёт связного параллелизма. По контексту второй строки и принятой реконструкции выражение передано как беспокойное бодрствование, то есть «бессонница»; עשיר сохранено как конкретное обозначение богатого человека.'
- source_word: ימחה שארו
  choice: изнуряет его тело
  rationale: שאר здесь естественно понимать в телесном значении «плоть, тело». Форма ימחה буквально допускает значение стирания или уничтожения; «изнуряет» передаёт постепенное истощение и звучит естественно по-русски.
- source_word: דאגת מחיה
  choice: тревога о пропитании
  rationale: דאגה обозначает тревожную заботу, а מחיה — средства поддержания жизни, пропитание. Такой перевод сохраняет материальный и психологический смысл сочетания.
- source_word: תפריע נומה
  choice: прогоняет сон
  rationale: Глагол выражает нарушение или устранение, а נומה означает сон или дремоту. «Прогоняет сон» ясно и образно передаёт действие.
theological_decisions:
- issue: Контраст между богатством и тревогой о пропитании
  choice: Сохранён без поясняющего сглаживания
  alternative: Передать מחיה как «богатство» или «имущество», устранив кажущееся напряжение
  rationale: Еврейский текст говорит о богатом человеке, но затем употребляет более широкое слово для средств к жизни. Это напряжение может быть намеренным и не должно устраняться переводом.
translation_notes:
  register: Современный литературный русский язык; краткий афористический строй и параллелизм двух частей сохранены. «Богач» употреблено как естественное обозначение типического лица, а «пропитание» — как понятное современному читателю слово без архаизации.
