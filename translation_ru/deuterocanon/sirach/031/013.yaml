lexical_decisions:
- source_word: בני
  choice: Сын мой
  rationale: Сохраняет обращение в мужском роде с суффиксом первого лица и характерный для литературы мудрости наставительный тон.
- source_word: אם
  choice: если
  rationale: Передаёт условную частицу, не превращая условие в ожидаемое событие.
- source_word: על שלחן גדול
  choice: за богатый стол
  rationale: Предлог при глаголе «сидеть» естественно передаётся по-русски как «за столом»; גדול здесь вероятнее указывает на изобилие или значительность трапезы, а не только на физический размер.
- source_word: ישבת
  choice: сядешь
  rationale: 'Форма перфекта в условно-наставительном контексте естественно передаётся русским будущим временем: «если сядешь».'
- source_word: אל תפתח
  choice: не разевай
  rationale: В сочетании с «глоткой» передаёт запрет широко раскрывать её и сохраняет резкость образа; нейтральное «не открывай» по-русски менее естественно.
- source_word: גרנך
  choice: глотку
  rationale: Сохраняет буквальный и нарочито телесный образ еврейского גרון и лучше, чем «горло», выражает хищную жадность в данном контексте.
