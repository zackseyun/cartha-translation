base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/015.yaml
  text: An evil eye hates God[b][a], and he created nothing worse than it.
translation:
  language: ru
  text: Злой глаз[a] ненавидит Бога, и ничего хуже него Он не сотворил.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «злой глаз». Это еврейская идиома о скупом, завистливом или недоброжелательном человеке.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза кратка и допускает также перевод: «и ничего хуже него не было создано». Слово «него» может относиться к человеку со «злым глазом» или к самому этому пороку.'
    reason: ambiguity
  - marker: c
    text: 'Греческий текст здесь резко отличается: «ибо надежда их — на Спасающего их». По-видимому, он отражает существенно иную форму текста.'
    reason: textual_variant
lexical_decisions:
- source_word: רע עין
  choice: злой глаз
  rationale: Буквально сохранён конкретный еврейский образ. Это идиома, обозначающая скупого, завистливого или недоброжелательного человека; пояснение вынесено в сноску, чтобы не сужать смысл в основном тексте.
- source_word: שונא
  choice: ненавидит
  rationale: Прямое значение глагола — «ненавидеть». Синтаксически естественнее всего понимать «злой глаз» как подлежащее, а Бога — как дополнение.
- source_word: אל
  choice: Бога
  rationale: В данном контексте אל естественно понимается как обозначение Бога. Форма винительного падежа требуется русским управлением глагола «ненавидит».
- source_word: ורע ממנו לא ברא
  choice: и ничего хуже него Он не сотворил
  rationale: 'Сжатая еврейская фраза передана без устранения её основной неоднозначности: подразумеваемым субъектом ברא, вероятнее всего, является Бог, а местоимение может отсылать к «злому глазу» как человеку либо свойству. Местоимение «Он» написано с прописной буквы для ясности подразумеваемого субъекта.'
theological_decisions:
- issue: Подлежащее и смысл первой части при резком расхождении с греческим текстом
  choice: 'Следовать сохранившемуся еврейскому свидетельству: «Злой глаз ненавидит Бога»'
  alternative: 'Греческий параллельный текст: «ибо надежда их — на Спасающего их»'
  rationale: Сохранившийся еврейский текст здесь является основным источником. Греческая строка представляет собой не малый вариант перевода, а существенно иной текст, поэтому она документируется в сноске, но не подменяет еврейское чтение.
- issue: Субъект глагола «сотворил»
  choice: 'Подразумеваемый субъект — Бог: «Он не сотворил»'
  alternative: 'Безличное/страдательное понимание: «ничего хуже него не было создано»'
  rationale: Глагол ברא обычно выражает творение и здесь естественно продолжает упоминание Бога. Вместе с тем краткость еврейской фразы допускает и более безличную передачу; эта возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и краткостью, соответствующими изречению Премудрости. Конкретная еврейская идиома сохранена в основном тексте, а её значение и текстовые разночтения разъяснены в сносках.
