translation:
  language: ru
  text: Кто держится за сновидения, тот словно хватается за тень и гонится за ветром.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст, помещённый здесь в издании Кааны, существенно отличается от греческого: «Забота о пропитании нарушает сон, и тяжёлая болезнь нарушает сон». Далее также читается: «Верный злому навлечёт позор, а хранящий тайну — друг, как собственная душа». Поскольку еврейский и греческий тексты при этой ссылке не совпадают, основной текст следует греческому свидетелю.'
    reason: textual_variant
  - marker: b
    text: 'Или: «кто обращает внимание на сновидения»; возможно также: «кто крепко держится за сновидения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: δρασσόμενος
  choice: хватается за
  rationale: Передаёт попытку схватить нечто неуловимое и тем самым сохраняет образ тщетности.
- source_word: σκιᾶς
  choice: тень
  rationale: Прямое и естественное соответствие образу чего-то неосязаемого.
- source_word: διώκων
  choice: гонится за
  rationale: Сохраняет активное, продолжающееся преследование; выражение естественно по-русски.
- source_word: ἄνεμον
  choice: ветром
  rationale: Сохраняет греческий образ погони за неуловимым ветром.
- source_word: ὁ ἐπέχων
  choice: кто держится за
  rationale: Глагол допускает значения «держаться за» и «обращать внимание на»; основной вариант сохраняет образ упорной, но тщетной привязанности, не делая его чрезмерно резким.
- source_word: ἐνυπνίοις
  choice: сновидения
  rationale: Ясно обозначает видения во сне и, в отличие от слова «мечты», не вызывает значения желаний или надежд.
theological_decisions:
- issue: Выбор основного источника при существенном расхождении еврейского и греческого свидетелей
  choice: Основной текст переводится по греческому свидетелю как относящийся к Сир 31:2 в данной системе нумерации; расхождение с сохранившимся еврейским текстом отмечено в сноске.
  alternative: Следовать находящемуся здесь составному еврейскому тексту Кааны, содержание которого не соответствует греческому стиху о сновидениях.
  rationale: Предоставленный еврейский материал отмечен как major_mismatch и, вероятно, отражает смещение стиха либо иную текстовую традицию. Поэтому греческий текст служит основанием для основного перевода, а еврейское расхождение не скрывается.
- issue: Смысл ἐπέχων применительно к сновидениям
  choice: держится за сновидения
  alternative: обращает внимание на сновидения
  rationale: Греческий глагол многозначен. Выбранный вариант согласуется с образами хватания и погони, но альтернативное понимание сохранено в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, образной синтаксической конструкцией. Перестановка частей сравнения делает фразу естественной по-русски, сохраняя все образы греческого текста. «Сновидения» выбрано ради смысловой точности и во избежание двусмысленности слова «мечты».
