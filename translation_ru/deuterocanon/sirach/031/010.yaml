base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/010.yaml
  text: Who is this[a], He has been tested in these things and has become complete; and it will be for him a ground for boasting.
translation:
  language: ru
  text: Кто он, прилепившийся к этому, но сохранивший благополучие? Это стало ему честью.[a] Ведь долгая благополучная жизнь будет тебе в честь.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст этого места труден. Греческая форма существенно отличается: «Кто не был испытан в малом, тот мало знает».'
    reason: textual_variant
  - marker: b
    text: 'Последняя еврейская строка неясна и, возможно, представляет собой иной вариант или повтор мысли: буквально приблизительно «ибо при умножении благополучия его жизни это будет тебе в честь».'
    reason: alternative_reading
lexical_decisions:
- source_word: מי הוא זה
  choice: Кто он
  rationale: Передаёт риторический вопрос еврейского текста естественным современным русским языком.
- source_word: שנדבק בו
  choice: прилепившийся к этому
  rationale: Сохраняет основной смысл еврейского דבק — «прилепляться, держаться, быть тесно связанным» — и не подменяет его мотивом испытания из расходящейся греческой формы.
- source_word: והיה לו שלום
  choice: но сохранивший благополучие
  rationale: שלום здесь допускает значения мира, целости и благополучия; причастная формулировка делает трудную еврейскую фразу связной, не снимая её неоднозначности.
- source_word: תפארה
  choice: честь
  rationale: В данном нравоучительном контексте תפארה означает честь, славу или предмет похвалы; «честь» звучит естественно и не усиливает оттенок самовосхваления.
- source_word: כי ברבות שלום חייו
  choice: Ведь долгая благополучная жизнь
  rationale: Отражает буквальные элементы еврейской строки — умножение/изобилие, благополучие и жизнь, — хотя её синтаксис и текстовая связь не вполне ясны.
theological_decisions:
- issue: Расхождение еврейского и греческого текстов
  choice: Основной текст следует засвидетельствованному еврейскому чтению, включая мотивы привязанности, благополучия и чести.
  alternative: 'Греческий параллельный текст: «Кто не был испытан в малом, тот мало знает».'
  rationale: При высокой уверенности в представленном еврейском свидетельстве нельзя без явного указания заменять его эклектической реконструкцией из существенно иного греческого текста. Разночтение вынесено в примечание.
- issue: Повторная строка после обозначения стиха
  choice: Сохранена как часть предоставленного еврейского источника.
  alternative: Считать её дублетом или фрагментом иной текстовой формы и исключить.
  rationale: Источник прямо включает эту строку; её удаление было бы более решительным текстологическим вмешательством, чем позволяет свидетельство. Неясность отмечена сноской.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной литературы. Сохранены повторы ключевых понятий «благополучие» и «честь»; трудное место не сглажено путём смешения несовместимых еврейской и греческой форм.
