translation:
  language: ru
  text: Понимай своего ближнего, как самого себя[a], и обо всём, что тебе ненавистно, размышляй[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «как собственную душу» или «как собственную жизнь»; еврейское נֶפֶשׁ может означать душу, жизнь или самого человека. Греческий параллельный текст существенно отличается: приблизительно «Кому он внимает? И кто его опора?» Здесь перевод следует сохранившемуся еврейскому тексту.'
    reason: lexical_alternative_and_textual_variant
  - marker: b
    text: 'Заключительные слова можно понимать как нравственную проверку: тщательно обдумывай всё, что ненавистно тебе самому, — то есть не причиняй этого другому. Однако еврейский текст прямо говорит о размышлении, а не формулирует запрет.'
    reason: alternative_reading
lexical_decisions:
- source_word: דעה
  choice: Познай
  rationale: Повелительная форма от ידע означает не просто получение сведений, а внимательное, личностное познание; «познай» сохраняет эту широту и не подменяет её заповедью любить.
- source_word: רעך
  choice: ближнего своего
  rationale: רע обозначает другого человека из круга отношений; «ближний» сохраняет библейский этический оттенок, не ограничиваясь пространственным соседством.
- source_word: כנפשך
  choice: как самого себя
  rationale: נפש здесь может обозначать душу, жизнь или самого человека; русское выражение естественно передаёт сравнение с собственной личностью.
- source_word: ובכל ששנאת
  choice: и обо всём, что тебе ненавистно
  rationale: Формулировка сохраняет широкий охват בכל и личный характер ששנאת, при этом звучит естественно по-русски.
- source_word: התבונן
  choice: размышляй
  rationale: Повелительная форма выражает вдумчивое рассмотрение и нравственное осмысление; «размышляй» не добавляет отсутствующего в тексте прямого указания на действие.
- source_word: τίνι ἐπέχει; καὶ τίς ἀντιστήριγμα αὐτοῦ;
  choice: в основном тексте не отражено
  rationale: Греческий параллельный текст резко расходится с сохранившимся еврейским свидетельством и используется только для текстологического контроля.
theological_decisions:
- issue: Соотношение с известной формулой «люби ближнего, как самого себя»
  choice: Сохранено «познай», соответствующее ידע.
  alternative: «Люби ближнего своего, как самого себя».
  rationale: Еврейский текст говорит о познании и внимательном понимании ближнего, а не употребляет глагол любви; гармонизация устранила бы самостоятельный смысл данного наставления.
- issue: Смысл заключительного нравственного наставления
  choice: Сохранена открытая формулировка «обо всём, что тебе ненавистно, размышляй».
  alternative: «Не делай ближнему того, что ненавистно тебе».
  rationale: Альтернатива правдоподобно раскрывает этический смысл, однако превращает размышление в прямой запрет, которого в еврейской формулировке явно нет.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Познай» и «ближнего своего» сохраняют достоинство и межтекстовый оттенок, но синтаксис остаётся понятным современному читателю. Маркеры сносок размещены непосредственно в основном тексте.
