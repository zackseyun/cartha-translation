  text: Even if you are constrained[a], wait for delicacies patiently[b], and it will bring you rest.
translation:
  language: ru
  text: Даже если тебя принуждают[a], терпеливо дожидайся изысканных блюд, и это принесёт тебе покой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская форма трудна и может означать «тебя принуждают» или «на тебя оказывают давление».
    reason: textual_variant
  - marker: b
    text: 'Греческое свидетельство содержит здесь совершенно иной текст: «Один молится, а другой проклинает — чей голос услышит Владыка?»'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם אם
  choice: Даже если
  rationale: Сочетание продолжает наставление и вводит уступительное условие; по-русски это естественно передаётся словами «даже если».
- source_word: נאנסתה
  choice: тебя принуждают
  rationale: Форма от אנס выражает принуждение или давление. Выбрано широкое значение без неуместного в данном контексте оттенка насилия; необычность формы и состояние текста требуют осторожной передачи.
- source_word: במטעמים
  choice: изысканных блюд
  rationale: מטעמים обозначает лакомые, отборные кушанья; «изысканные блюда» понятно современному читателю и соответствует возвышенному регистру.
- source_word: קוה קוה
  choice: терпеливо дожидайся
  rationale: Повтор глагола усиливает призыв ждать настойчиво или терпеливо. В русском буквальный повтор «жди, жди» звучал бы неестественно, поэтому интенсивность выражена наречием.
- source_word: וינוח לך
  choice: и это принесёт тебе покой
  rationale: נוח передаёт покой или облегчение, а לך указывает на того, кому он достаётся. Такая формулировка сохраняет несколько неопределённую синтаксическую связь еврейского текста.
theological_decisions:
- issue: Резкое расхождение сохранившегося еврейского текста с греческим свидетельством
  choice: Основной текст переведён с сохранившегося еврейского чтения, а греческое чтение приведено в сноске.
  alternative: «Один молится, а другой проклинает — чей голос услышит Владыка?»
  rationale: При наличии еврейского текста Сираха он служит основой перевода. Однако греческое свидетельство представляет не малый вариант, а совершенно иную текстовую традицию, поэтому различие необходимо явно сохранить.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным звучанием. Неестественный буквальный повтор еврейского глагола передан словом «терпеливо», а значительное расхождение текстовых традиций вынесено в сноску.
