base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/011.yaml
  text: Who was tested by it and was found complete? Let it be for him a boast[a]. Who was able to transgress and did not transgress[b], and to do evil and did not desire it?
translation:
  language: ru
  text: Кто был им испытан и оказался непорочен? Это послужит ему к чести[a]. Кто мог отступить — и не отступил[b], сделать зло — и не пожелал?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Первая строка в еврейской рукописной традиции текстуально трудна. Дошедшие слова можно передать более буквально: «Кто благословил его, и он был цел в своей жизни; он тебе во славу», однако контекст поддерживает смысл испытания и доказанной непорочности.'
    reason: textual_variant
  - marker: b
    text: 'Или: «Кто мог уклониться — и не уклонился, причинить зло — и не согласился?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: מי ברכו
  choice: Кто был им испытан
  rationale: Еврейский текст здесь повреждён или неустойчив. С учётом контекста испытания богатством передан вероятный смысл, при этом местоимение «им» сохраняет связь с предшествующим контекстом и не вводит существительное, отсутствующее в данной строке.
- source_word: וישלם בחייו
  choice: и оказался непорочен
  rationale: Глагол от корня שלם выражает здесь нравственную цельность и выдержанное испытание; «оказался непорочен» естественно передаёт результат проверки.
- source_word: הוא לך לתפארת
  choice: Это послужит ему к чести
  rationale: Из-за неустойчивости местоимений буквальное чтение затруднительно. Формулировка сохраняет смысл почёта и похвалы, выраженный словом תפארת, не превращая его в самохвальство.
- source_word: יוכל לסור ולא סר
  choice: мог отступить — и не отступил
  rationale: Сохранён конкретный образ уклонения с нравственно отрицательного пути, а повтор того же глагола передаёт еврейский параллелизм.
- source_word: ולהרע רעה
  choice: сделать зло
  rationale: Краткая формулировка естественно передаёт сочетание глагола и однокоренного дополнения с ясным нравственным смыслом.
- source_word: ולא אבה
  choice: и не пожелал
  rationale: אבה обозначает желание, готовность или согласие; «не пожелал» сохраняет акцент на внутреннем отказе от зла.
theological_decisions:
- issue: Неустойчивый еврейский текст первой строки
  choice: Передать контекстуальный смысл испытания и подтверждённой нравственной цельности, отметив трудность текста в сноске.
  alternative: 'Буквально передать: «Кто благословил его, и он был цел в своей жизни; он тебе во славу».'
  rationale: Буквальное чтение дошедших согласных создаёт неясную синтаксическую и смысловую связь. Контекст раздела поддерживает тему испытания богатством, однако реконструкция не скрывается от читателя.
- issue: Нравственный смысл глагола סור
  choice: Сохранить образ «отступить», не уточняя формально, является ли это нарушением заповеди, уклонением с пути или иным проступком.
  alternative: Перевести «преступить» или «согрешить».
  rationale: 'Так сохраняются исходная образность и богословски значимая широта: речь может идти как об отступлении от верного пути, так и о конкретном нарушении.'
translation_notes:
  register: Современный литературный русский язык с достоинством, присущим премудростной литературе. Риторические вопросы и глагольный параллелизм сохранены; редкие церковнославянизмы и конфессионально окрашенные уточнения не использованы.
