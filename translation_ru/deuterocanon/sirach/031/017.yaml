  text: Stretch out your hand to the place he looks at[a], and do not reach with him into the dish.
translation:
  language: ru
  text: Туда, куда он смотрит, протягивай руку и не тянись вместе с ним к блюду.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции здесь читается: «Блаженна душа боящегося Господа». Сохранившийся в Каирской генизе еврейский текст содержит иное наставление — о поведении за столом; в этом месте текстовая традиция остаётся неясной.'
    reason: alternative_reading
lexical_decisions:
- source_word: מקום יביט
  choice: к тому месту, на которое он смотрит
  rationale: מקום означает «место», а יביט — «он смотрит». Формулировка сохраняет конкретный образ и в контексте застолья указывает на пищу, которую заметил или выбрал другой человек.
- source_word: אל תושיט יד
  choice: не протягивай руки
  rationale: По наиболее вероятному чтению трудного места перед תושיט стоит отрицание אל. Это соответствует последующему запрету и естественному смыслу наставления о поведении за столом.
- source_word: ואל תחד עמו
  choice: и не тянись вместе с ним
  rationale: Форма תחד текстуально трудна. Перевод передаёт очевидный в контексте запрет одновременно тянуться за пищей, не приписывая глаголу чрезмерно точного значения.
- source_word: בטנא
  choice: к блюду
  rationale: Слово может обозначать корзину или вместилище; в застольном контексте речь идёт об общей посуде с пищей. «Блюдо» естественно передаёт этот смысл по-русски.
- source_word: φοβουμένου τὸν Κύριον μακαρία ἡ ψυχή
  choice: не принято в основном тексте
  rationale: Греческая традиция содержит совершенно иную строку. Поскольку еврейский текст здесь сохранился, он положен в основу перевода, а существенное греческое разночтение вынесено в примечание.
theological_decisions:
- issue: Расхождение между сохранившимся еврейским текстом и греческой традицией
  choice: В основном тексте следовать еврейскому наставлению о поведении за столом, указав греческое чтение в примечании.
  alternative: «Блаженна душа боящегося Господа».
  rationale: Еврейское свидетельство для Книги Премудрости Иисуса, сына Сирахова, при наличии имеет приоритет, однако греческое чтение настолько отличается, что его необходимо сохранить для прозрачности текстовой традиции.
- issue: Наличие отрицания перед תושיט
  choice: 'Перевести как запрет: «не протягивай руки».'
  alternative: «Протяни руку».
  rationale: 'В представленном составном еврейском тексте последовательность графически неясна, но вероятное чтение אל תושיט создаёт параллель с ואל תחד и даёт связное наставление: не посягать на то, что выбрал другой, и не тянуться к блюду одновременно с ним.'
translation_notes:
  register: Современный литературный русский язык с лаконичной, достойной формой наставления. Синтаксический параллелизм двух запретов отражает наиболее вероятное еврейское чтение и делает застольный контекст понятным без лишнего истолкования.
