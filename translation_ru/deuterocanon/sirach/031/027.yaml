lexical_decisions:
- source_word: ואם
  choice: И если
  rationale: Сохраняет присоединительный союз ו и условное значение אם, естественно вводя условную конструкцию по-русски.
- source_word: יפצירו בך
  choice: станут настойчиво уговаривать тебя
  rationale: Глагол выражает настойчивое побуждение или давление; сочетание передаёт эту силу без неестественного русского оборота «будут давить на тебя».
- source_word: לאכול
  choice: поесть
  rationale: Инфинитив אכל означает «есть»; в контексте настойчивого приглашения к трапезе совершенный вид «поесть» звучит естественно и не добавляет лишней торжественности.
- source_word: סור מן הסבה
  choice: покинь пиршество
  rationale: סור указывает на удаление или уход, а הסבה — на совместную трапезу с возлежанием либо собравшееся за ней общество. «Покинь пиршество» ясно передаёт сцену, не сводя выражение лишь к предмету «стол».
- source_word: ותמצא נחת
  choice: и обретёшь покой
  rationale: נחת может обозначать покой, облегчение или отдохновение. «Обретёшь покой» сохраняет широту значения и естественно выражает результат ухода.
theological_decisions:
- issue: Заключённая в квадратные скобки еврейская фраза и её значительное расхождение с греческой параллелью
  choice: Основной текст переведён по сохранившемуся еврейскому чтению, а квадратные скобки сохранены; расхождение с греческим текстом отмечено в сноске.
  alternative: 'Греческая параллель: «Лишающий наёмного работника платы — словно проливающий кровь».'
  rationale: При наличии еврейского свидетельства оно служит основой перевода Сираха. Однако греческий текст здесь передаёт совершенно иное высказывание, что может указывать на другую текстовую традицию или несовпадение нумерации; скрывать это существенное расхождение нельзя.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинственным звучанием. Квадратные скобки исходного свидетельства сохранены как указание на текстовую неуверенность; формулировка не сглаживает расхождение между еврейской и греческой традициями.
