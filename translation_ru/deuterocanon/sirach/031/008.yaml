base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/031/008.yaml
  text: Blessed is the man who is found blameless[b][a], and who has not gone astray after wealth.
translation:
  language: ru
  text: Блажен человек, оказавшийся непорочным, и не сбившийся с пути из-за богатства.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст второй части стиха труден. Вероятный смысл: богатство не заставило этого человека уклониться от правильного пути. Возможны также переводы: «не погнавшийся за богатством» или «не совращённый деньгами».'
    reason: alternative_reading
  - marker: b
    text: Греческий текст этого стиха существенно отличается от сохранившегося еврейского. Здесь перевод следует еврейскому тексту, а его неясность отмечена отдельно.
    reason: textual_variant
lexical_decisions:
- source_word: אשרי
  choice: Блажен
  rationale: Традиционная и естественная для русской библейской литературы формула блаженства; передаёт объективную оценку, а не только субъективное счастье.
- source_word: איש
  choice: человек
  rationale: В русском языке «человек» естественно передаёт איש и сохраняет обобщающий характер изречения без ненужного сужения до обозначения пола.
- source_word: נמצא
  choice: оказавшийся
  rationale: 'Сохраняет пассивно-оценочный оттенок: человек был найден или явил себя таким.'
- source_word: תמים
  choice: непорочным
  rationale: В нравственном контексте обозначает цельность и безупречность поведения, но не обязательно абсолютное безгрешное совершенство.
- source_word: ממון
  choice: богатства
  rationale: Обозначает материальное достояние шире, чем только наличные деньги.
- source_word: לא נלוז
  choice: не сбившийся с пути
  rationale: Передаёт образ отклонения от правильного пути и его нравственный смысл.
- source_word: ויחר ממון
  choice: из-за богатства
  rationale: Передаёт вероятную связь нравственного уклонения с богатством, не пытаясь буквально воспроизвести трудное и, возможно, повреждённое еврейское чтение.
theological_decisions:
- issue: Неясность еврейской фразы о богатстве
  choice: «не сбившийся с пути из-за богатства»
  alternative: «не погнавшийся за богатством»; «не совращённый деньгами»
  rationale: Сохраняется надёжно различимое смысловое ядро — богатство и отсутствие нравственного уклонения, — но не утверждается более точная синтаксическая реконструкция, чем допускает трудный текст.
- issue: Значительное расхождение еврейского текста и греческой параллели
  choice: Следовать сохранившемуся еврейскому тексту, отметив расхождение в сноске
  alternative: 'Перевести греческий текст: «Без лжи исполнится закон, и мудрость в верных устах достигнет совершенства»'
  rationale: При высокой уверенности в приведённом еврейском свидетельстве оно остаётся основой перевода; существенно иной греческий текст нельзя незаметно смешивать с ним.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Формула «Блажен человек» сохраняет жанровую окраску, а образ «сбиться с пути» естественно передаёт нравственное уклонение.
