translation:
  language: ru
  text: 'Долголетие — от здорового желудка: утром человек встаёт — и жизнь его с ним.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст под этим номером содержит иной стих: «Хлеб нуждающихся — жизнь бедных; кто отнимает его, тот человек крови».'
    reason: Крупное текстовое расхождение между еврейским источником и греческой традицией необходимо сделать видимым читателю.
lexical_decisions:
- source_word: שנות חיים
  choice: долгие годы жизни
  rationale: Буквально «годы жизни»; в контексте выражение подразумевает продолжительность жизни.
- source_word: על קרב
  choice: при здоровом желудке
  rationale: קרב обозначает внутренности, утробу или желудок; предлог על передаёт основание или условие.
- source_word: תולל
  choice: здоровом
  rationale: Форма в данном композитном еврейском тексте трудна; по смыслу обозначает благополучное, исправное состояние внутренних органов. Перевод сохраняет медицинско-бытовой образ без чрезмерной конкретизации.
- source_word: וקם בבקר
  choice: встанет человек утром
  rationale: Естественная русская передача буквального «и встаёт утром»; подразумеваемый субъект выражен словом «человек».
- source_word: ונפשו אתו
  choice: и жизнь его при нём
  rationale: נפש может означать душу, жизнь или жизненную силу. Здесь «жизнь» лучше соответствует противопоставлению утренней бодрости последствиям неумеренности, при сохранении необычного образа «при нём».
theological_decisions:
- issue: Значение נפש
  choice: жизнь
  alternative: душа / жизненная сила
  rationale: Контекст посвящён телесному состоянию после еды; «жизнь» сохраняет широту еврейского слова и не вносит учения о самостоятельной душе.
- issue: Несоответствие греческого параллельного источника
  choice: следовать засвидетельствованному еврейскому тексту
  alternative: перевести греческое «Хлеб нуждающихся — жизнь бедных…»
  rationale: Предоставленный еврейский источник имеет высокую уверенность, но существенно расходится с греческой нумерацией/традицией; основной перевод поэтому опирается на еврейское свидетельство, а расхождение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством афористической мудрости. Двоеточие и тире передают причинно-следственный ход еврейского изречения; необычный оборот «жизнь его при нём» намеренно сохранён.
