  rationale: Субстантивированное прилагательное естественно обозначает состоятельного человека и сохраняет мужской род единственного числа.
- source_word: לקבץ הון
  choice: чтобы накопить состояние
  rationale: לקבץ означает собирать или накапливать, а הון — имущество, богатство, состояние; цельная русская формулировка естественно выражает накопление богатства.
- source_word: ינוח
  choice: отдыхает
  rationale: Прямо передаёт глагол נוח и сохраняет противопоставление труду.
- source_word: לקבל תענוג
  choice: наслаждается достатком
  rationale: Буквально сочетание означает «получать удовольствие/наслаждение». В контексте богатства תענוג может указывать на материальные блага и довольство ими; перевод сохраняет этот контекст без узкого «роскошью».
