  text: Во всех своих делах будь скромен[a], и никакая беда тебя не коснётся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь существенно иное чтение: «Один строит, а другой разрушает — что приобрели они, кроме трудов?» Настоящий перевод следует сохранившемуся еврейскому тексту, который заметно отличается от греческой традиции.'
    reason: textual_variant
lexical_decisions:
- source_word: בכל מעשיך
  choice: Во всех своих делах
  rationale: Сочетание בכל с מעשיך задаёт всеобъемлющую сферу наставления; «во всех своих делах» естественно и сохраняет нравственно-практический оттенок.
- source_word: היה
  choice: будь
  rationale: Форма глагола היה имеет повелительное значение и с именной частью сказуемого естественно передаётся русским «будь».
- source_word: צנוע
  choice: скромен
  rationale: Слово обозначает скромность, сдержанность и неброское поведение. «Скромен» прямо передаёт смысл, не сужая его до одного лишь смирения или самообладания.
- source_word: וכל אסון לא
  choice: и никакая беда
  rationale: Еврейская конструкция с כל и отрицанием идиоматично передаётся по-русски отрицательным местоимением «никакая»; «беда» сохраняет широкий смысл серьёзного несчастья.
- source_word: יגע בך
  choice: тебя не коснётся
  rationale: Глагол נגע буквально означает «касаться» и здесь образно говорит о беде, достигающей человека; русское выражение сохраняет этот образ и звучит естественно.
