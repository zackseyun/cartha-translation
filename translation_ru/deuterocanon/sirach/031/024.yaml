  text: Pain and sleepless wandering[a], and retching and choking[c][b], and a turned face with a foolish man.
translation:
  language: ru
  text: Боль и сон, бегущий прочь,[a] и позывы к рвоте, и удушье,[b] и искажённое лицо — вот что бывает у человека глупого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст всей строки труден, особенно названия симптомов и выражение об изменившемся лице. Греческий текст этого стиха совершенно иной: «Кто приносит жертву из имущества бедных, тот словно закалывает сына перед его отцом». Это указывает на значительное расхождение текстовых традиций.'
    reason: textual_variant
  - marker: b
    text: 'Возможные переводы двух последних симптомов: «рвота и удушье»; выражение о лице можно также понять как «отвёрнутое лицо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מכאוב
  choice: боль
  rationale: Существительное обозначает телесную боль или мучительное состояние; в перечне физических последствий естественно передаётся словом «боль».
- source_word: ונדד ישנה
  choice: сон, бегущий прочь
  rationale: Сохраняет образ сна, который удаляется или бежит, и передаёт состояние бессонницы, не сводя трудное выражение к одному толкованию.
- source_word: ומער
  choice: позывы к рвоте
  rationale: Форма трудна, но контекст указывает на желудочное расстройство; такая передача не утверждает с излишней уверенностью, что речь именно о состоявшейся рвоте.
- source_word: ותשניק
  choice: удушье
  rationale: Передаёт сдавливание горла или затруднение дыхания; в русском перечне симптомов звучит естественно.
- source_word: ופני הפוכות
  choice: искажённое лицо
  rationale: Буквально речь о «перевёрнутом/изменённом лице»; «искажённое лицо» сохраняет телесный образ и допускает болезненную гримасу, не выбирая менее вероятное значение отведённого взгляда.
- source_word: עם איש כסיל
  choice: вот что бывает у человека глупого
  rationale: Синтаксис всей еврейской строки повреждён или крайне сжат. Формулировка естественно связывает перечень с глупцом, но потому отмечена общей текстологической сноской.
theological_decisions:
- issue: Связь перечня симптомов с «человеком глупым»
  choice: представить симптомы как состояние глупого человека
  alternative: 'буквально: «с человеком глупым»'
  rationale: Еврейское עם буквально значит «с», однако буквальная русская фраза остаётся почти бессвязной. Контекстуальная связь выражена осторожно, а трудность текста оговорена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Образ «сон, бегущий прочь» намеренно сохраняет еврейскую метафору; синтаксис слегка прояснён ради понятности, а серьёзная текстологическая проблема вынесена в сноску.
