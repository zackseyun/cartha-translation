    rationale: Формула «вот что бывает у человека глупого» утверждает, что перечисленное является состоянием или следствием глупости. В еврейском тексте стоит עם, буквально «с/при», а синтаксис строки признан трудным; перевод не должен без оговорки превращать это в однозначный диагноз глупца.
  - severity: low
    issue: Выбор «человек глупый» ослабляет терминологическую окраску כסיל.
    rationale: «Глупец» естественнее в русском переводе мудростной литературы и ближе к функции существительного איש כסיל.
