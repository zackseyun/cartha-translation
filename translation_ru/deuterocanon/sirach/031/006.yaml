lexical_decisions:
- source_word: חבולי
  choice: были погублены
  rationale: Передаёт состояние людей, которым золото причинило тяжкий вред и принесло гибель; естественнее по-русски, чем буквальное «изранены».
- source_word: זהב
  choice: золотом
  rationale: Прямое соответствие; творительный падеж выражает причину или средство погибели.
- source_word: הבוטח
  choice: тот, кто полагается
  rationale: Сохраняет заметный в еврейском переход от множественного числа к единственному причастному обороту, не сглаживая возможную синтаксическую шероховатость.
- source_word: פנינים
  choice: жемчуг
  rationale: Традиционное и допустимое значение; более широкое значение «драгоценности» отмечено в сноске.
- source_word: להנצל מרעה
  choice: найти избавление от беды
  rationale: Конструкция с «не нашли» сохранена; רעה здесь может означать как зло, так и бедствие, а «беда» естественно передаёт конкретную угрозу в контексте избавления.
- source_word: להושע
  choice: быть спасёнными
  rationale: Передаёт значение спасения или избавления без уточнения его механизма.
- source_word: ביום עברה
  choice: в день гнева
  rationale: Сохраняет судебно-эсхатологическую напряжённость выражения и соответствует возвышенному языку библейской мудрости.
theological_decisions:
- issue: Выбор основного текста при существенном расхождении еврейского и греческого свидетелей
  choice: Основной перевод следует сохранившемуся еврейскому тексту; греческий вариант приведён в сноске.
  alternative: 'Следовать греческому чтению: «Если только это не послано Всевышним при посещении, не отдавай этому своего сердца».'
  rationale: Еврейский свидетель здесь имеется и потому служит основой; крупное расхождение с греческим нельзя скрывать, поэтому оно документировано без попытки искусственно согласовать тексты.
- issue: Характер רעה
  choice: беда
  alternative: зло
  rationale: Еврейское слово допускает нравственное зло и бедствие. В сочетании с избавлением «беда» звучит естественно, но не устраняет контекст суда, усиленный словами «день гнева».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранён переход еврейского текста от множественного «многие» к единственному «тот, кто», поскольку он может быть значимым и не требует молчаливого синтаксического исправления.
