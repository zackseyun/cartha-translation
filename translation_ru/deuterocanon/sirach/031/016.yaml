translation:
  language: ru
  text: Ибо от всякого дела дрожит глаз[a], и слеза струится по лицу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся здесь еврейский текст резко отличается от греческой традиции, где сказано: «Боящийся Господа вовсе не устрашится и не будет малодушествовать, потому что Он — его надежда». Основной текст следует сохранившемуся еврейскому свидетельству.'
    reason: textual_variant
lexical_decisions:
- source_word: כי
  choice: Ибо
  rationale: Передаёт объяснительно-причинную функцию союза, не воспроизводя неестественное для русского удвоение причинных средств.
- source_word: מפני כל דבר
  choice: от всего
  rationale: 'Предлог מפני здесь допускает причинное значение, а דבר имеет широкий смысл: «дело, вещь, слово». Краткое «от всего» сохраняет обобщённость и естественно звучит по-русски.'
- source_word: תזוע עין
  choice: дрожит глаз
  rationale: Сохраняет единственное число и телесный образ; זוע передано прямым глаголом движения «дрожать».
- source_word: ומפנים
  choice: и по лицу
  rationale: Буквальное «из лица» по-русски неестественно. «По лицу» сохраняет упоминание лица и естественно обозначает движение слезы.
- source_word: דמעה תדמע
  choice: потечёт слеза
  rationale: Сохраняет единственное число существительного דמעה и передаёт внутренний объект/этимологическую фигуру естественным русским выражением.
theological_decisions:
- issue: Резкое расхождение сохранившегося еврейского текста и греческой традиции
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству.
  alternative: 'Греческий текст: «Боящийся Господа нисколько не устрашится и не будет малодушествовать, потому что Он — его надежда».'
  rationale: Еврейский текст здесь сохранился, но не соответствует греческому. Их нельзя гармонизировать без утраты текстологической прозрачности, поэтому греческое чтение вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с кратким, несколько афористичным строем. Неясность и сжатость еврейской строки сохранены без догматической гармонизации с греческим чтением.
