  text: Know that your neighbor is a man like yourself[b][a], and eat what is set before you.
translation:
  language: ru
  text: Знай, что твой ближний — такой же человек, как ты[a][b], и ешь то, что поставлено перед тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское איש כמוך можно передать более буквально: «мужчина, подобный тебе». Здесь איש употреблено в значении «человек».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое свидетельство здесь существенно отличается: «возвышая душу и просвещая глаза, давая исцеление, жизнь и благословение». По-видимому, еврейский и греческий тексты сохранили разные формы этого стиха.'
    reason: alternative_reading
lexical_decisions:
- source_word: דע
  choice: Знай
  rationale: Прямо передаёт повелительную форму глагола ידע и сохраняет наставительный тон.
- source_word: רעך
  choice: твой ближний
  rationale: Рֵעַ может означать друга, товарища или ближнего; здесь «ближний» лучше всего передаёт отношение к другому человеку в нравственно-бытовом контексте.
- source_word: איש כמוך
  choice: такой же человек, как ты
  rationale: איש — существительное мужского рода со значениями «мужчина» и «человек». В данном сравнении естественное русское «такой же человек, как ты» выражает мысль о равном человеческом достоинстве, а грамматически более буквальный вариант отмечен в сноске.
- source_word: ואכול
  choice: и ешь
  rationale: Сохраняет простое соединение с повелительной формой без добавления причинного или следственного оттенка.
- source_word: דבר
  choice: то, что
  rationale: В сочетании с последующим определением דָּבָר идиоматически означает предлагаемое за столом; буквальное «вещь» по-русски было бы неестественно.
- source_word: ששם לפניך
  choice: что поставлено перед тобой
  rationale: 'Естественно передаёт застольный смысл: пища подана и находится перед человеком.'
theological_decisions:
- issue: Родовое значение выражения איש כמוך
  choice: такой же человек, как ты
  alternative: мужчина, подобный тебе
  rationale: Хотя איש имеет форму мужского рода и может прямо означать мужчину, в этом изречении оно допускает общее значение «человек». Основной текст передаёт естественный для русского языка общий смысл, а более буквальная гендерно маркированная передача сохранена в сноске.
- issue: Существенное расхождение еврейского и греческого свидетельств
  choice: Основной текст следует сохранившемуся еврейскому тексту
  alternative: «возвышая душу и просвещая глаза, давая исцеление, жизнь и благословение»
  rationale: Греческий текст представляет не близкий перевод этой еврейской строки, а существенно иную форму стиха. Их нельзя безосновательно согласовать, поэтому греческое чтение приводится отдельно в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким наставительным синтаксисом. Выражение «такой же человек, как ты» звучит естественно и ясно, а последовательность двух повелений сохраняет простую структуру еврейской строки.
