    reason: textual_variant
lexical_decisions:
- source_word: אל תאמר
  choice: Не говори
  rationale: Прямо передаёт отрицательное повеление с глаголом אמר («говорить»), не превращая его в указание о мыслях.
- source_word: ספוק עליו
  choice: Ему достаточно
  rationale: ספוק выражает достаточность, а עליו с местоименным суффиксом указывает на лицо мужского рода. Формулировка естественна по-русски и сохраняет межличностный смысл еврейского текста.
- source_word: זכור
  choice: помни
  rationale: Сохраняет краткую повелительную форму и афористический строй оригинала.
- source_word: רעה עין רעה
  choice: «злой глаз» — зло
  rationale: Сохраняет конкретный образ עין и повтор רעה, не сводя многозначную библейскую идиому только к скупости или зависти. Кавычки показывают, что это устойчивый образ, а сноска разъясняет его смысл.
theological_decisions:
- issue: Передача еврейской идиомы רעה עין («злой глаз»)
  choice: Сохранить образ «злой глаз» в основном тексте и пояснить его в сноске
  alternative: скупость; завистливый взгляд; недоброжелательность
  rationale: В контексте трапезы выражение может указывать на скупое, завистливое или недоброжелательное расположение, однако сам еврейский текст остаётся конкретным и афористичным. Сохранение образа не устраняет его смысловую широту.
- issue: Существенное расхождение еврейского текста и указанной греческой параллели
  choice: Перевести сохранившийся еврейский текст и отметить расхождение в сноске
  alternative: 'Следовать греческому чтению: «Дух боящихся Господа будет жить»'
  rationale: Предоставленный еврейский текст засвидетельствован с высокой уверенностью и является основным источником для перевода. Греческая строка ему не соответствует и, вероятно, отражает иную нумерацию или текстовое соотнесение.
translation_notes:
  register: Современный литературный русский язык; тон краткий, наставительный и афористичный. Синтаксис следует параллелизму еврейского текста, а кавычки выделяют библейскую идиому, которая без пояснения могла бы быть понята в русском только как указание на сглаз.
