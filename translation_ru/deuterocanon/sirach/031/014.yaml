  text: 'Не говори: «Ему достаточно»; помни: «злой глаз»[a] — зло.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «злой глаз» обычно обозначает скупое, завистливое или недоброжелательное отношение.
    reason: lexical_alternative
  - marker: b
