translation:
  language: ru
  text: Слушай, сын мой, и не презирай меня; впоследствии ты постигнешь мои слова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В указанном греческом параллельном тексте содержится совсем другое изречение: «Омывшийся после соприкосновения с мёртвым и снова прикоснувшийся к нему — какую пользу получил он от своего омовения?» Это может отражать существенное расхождение в нумерации стихов или в текстовой традиции; основной текст следует сохранившемуся еврейскому свидетелю.'
    reason: textual_variant
lexical_decisions:
- source_word: שמע
  choice: Слушай
  rationale: Повелительная форма призывает внимательно выслушать наставление; перевод «повинуйся» неоправданно сужал бы значение.
- source_word: בני
  choice: сын мой
  rationale: Сохраняет мужской род, единственное число и обращение исходного текста, оставаясь естественным для русского наставительного жанра.
- source_word: תבוז
  choice: не пренебрегай мною
  rationale: Глагол выражает презрительное отвержение или неуважение. В сочетании с личным дополнением «не пренебрегай мною» естественнее по-русски, чем более резкое «не презирай меня», и не ослабляет предостережение до простого «не игнорируй».
- source_word: ובאחרית
  choice: в конце концов
  rationale: Передаёт временную направленность к последующему итогу наставления естественным современным русским выражением.
- source_word: תשיג
  choice: постигнешь
  rationale: Сохраняет заложенные в глаголе оттенки достижения и понимания; с дополнением «мои слова» звучит естественно и содержательнее, чем буквальное «достигнешь».
- source_word: אמרי
  choice: мои слова
  rationale: Прямой и стилистически достойный эквивалент, не требующий более специального «изречения».
theological_decisions:
- issue: Расхождение между сохранившимся еврейским текстом и указанной греческой параллелью
  choice: Основной текст переведён по сохранившемуся еврейскому свидетелю Бен-Сиры.
  alternative: 'Греческая параллель: «Омывшийся после прикосновения к мёртвому и снова прикоснувшийся к нему — какую пользу получил он от своего омовения?»'
  rationale: Греческий текст содержит не вариант отдельных слов, а совершенно иное изречение, что указывает на расхождение нумерации стихов либо текстовой традиции. Поскольку здесь имеется еврейский текст, он положен в основу перевода, а расхождение открыто отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным наставительным звучанием. Синтаксис краток и ясен; архаизмы устранены. Сноска относится ко всему стиху, поэтому маркер поставлен в его конце.
