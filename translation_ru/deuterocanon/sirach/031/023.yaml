  text: Разве малого недостаточно человеку разумному? И на постели своей он не задыхается[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское «не задыхается» в этом месте не вполне ясно: сохранившийся текст труден, но по контексту речь, вероятно, о том, что умеренность в еде избавляет человека от мучительного состояния в постели.'
    reason: textual_variant
  - marker: b
    text: Греческий параллельный текст, указанный в исходных данных для этого стиха, не соответствует данной еврейской строке и, по-видимому, относится к другому стиху. Поэтому перевод следует прежде всего еврейскому свидетельству, отмечая его неясность.
    reason: textual_variant
