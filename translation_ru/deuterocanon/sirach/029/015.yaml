translation:
  language: ru
  text: Не забывай благодеяний поручителя[a], ведь он отдал за тебя свою жизнь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть человека, который поручился за твой долг или иное обязательство.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «свою душу»; в данном контексте: «свою жизнь» или «самого себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριτας
  choice: благодеяний
  rationale: Множественное число χάριτας обозначает конкретные благодеяния или оказанные услуги, а не отвлечённую «благодать»; «благодеяний» сохраняет множественное число и соответствует возвышенному наставительному контексту.
- source_word: ἐγγύου
  choice: поручителя
  rationale: ἐγγύος — человек, принявший на себя ответственность за чужой долг или обязательство. «Поручитель» — точный и понятный современный русский термин.
- source_word: μὴ ἐπιλάθῃ
  choice: не забывай
  rationale: Прямо передаёт запрет забывать или оставлять без благодарной памяти оказанное благодеяние.
- source_word: ἔδωκεν
  choice: отдал
  rationale: В сочетании с «жизнь» глагол «отдал» естественно передаёт ἔδωκεν и серьёзность принятого поручителем риска, не добавляя обязательного жертвенного смысла.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: свою жизнь
  rationale: ψυχή здесь означает жизнь, которой поручитель рискует ради другого; возвратное «свою» естественно соотносит её с подлежащим.
- source_word: ὑπὲρ σοῦ
  choice: за тебя
  rationale: ὑπέρ выражает действие ради адресата или от его имени; «за тебя» кратко и естественно сохраняет оба смысловых оттенка в данном контексте.
theological_decisions:
- issue: Значение ψυχή в контексте поручительства
  choice: свою жизнь
  alternative: свою душу; самого себя
  rationale: Речь идёт о личном риске поручителя, а не об учении о составе человека. Перевод «жизнь» передаёт контекстуальный смысл, а буквальное значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, наставительным и достойным звучанием. «Благодеяния» уместно для премудростной литературы и не вносит специального богословского значения; финансово-правовой термин «поручитель» остаётся понятным широкому читателю.
