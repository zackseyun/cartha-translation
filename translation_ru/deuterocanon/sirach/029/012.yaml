  text: Store up almsgiving in your treasuries[b][a], and it will rescue you from every affliction.
translation:
  language: ru
  text: Запри милостыню в своих хранилищах[a], и она избавит тебя от всякой беды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сберегай милостыню в своих сокровищницах». Буквально: «Запри милостыню в своих хранилищах».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от всякого бедствия» или «от всякого притеснения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύγκλεισον
  choice: Спрячь
  rationale: Императив буквально означает «запри, заключи». В сочетании с хранилищами передаёт образ ценности, которую надёжно прячут и берегут.
- source_word: ἐλεημοσύνην
  choice: милостыню
  rationale: В эллинистическом иудейском употреблении слово обозначает конкретную помощь нуждающимся; «милостыня» сохраняет эту конкретность лучше, чем более широкое «милосердие».
- source_word: ἐν τοῖς ταμείοις σου
  choice: в своих хранилищах
  rationale: ταμεῖον может означать кладовую, внутреннюю комнату или сокровищницу. «Хранилища» естественно передаёт место, где держат нечто ценное, не сужая образ до определённого типа помещения.
- source_word: ἐξελεῖταί
  choice: избавит
  rationale: Глагол означает вывести или вызволить из опасности. «Избавит» естественно сочетается с конструкцией «от всякой беды» и сохраняет действенный характер обещания.
- source_word: ἐκ πάσης κακώσεως
  choice: от всякой беды
  rationale: κακώσις может обозначать бедствие, тяготу, причинённое зло или притеснение. «Беда» здесь звучит естественно и сохраняет достаточную широту значения.
theological_decisions:
- issue: Олицетворённая действенность милостыни
  choice: и она избавит тебя от всякой беды
  alternative: и это избавит тебя от всякого зла
  rationale: Греческий текст прямо приписывает милостыне защитную силу. Перевод сохраняет это богословское напряжение, не сводя высказывание к обычному следствию и не добавляя позднейших оговорок.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрости. Метафора надёжно укрытого сокровища сохранена; формулировка краткая и понятная.
