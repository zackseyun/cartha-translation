lexical_decisions:
- source_word: ἀχάριστος
  choice: неблагодарный
  rationale: Передаёт отсутствие благодарности ясно и с присущей греческому слову нравственной оценкой.
- source_word: ἐν διανοίᾳ
  choice: в мыслях
  rationale: Сохраняет явное указание на внутренний образ мыслей, не сводя выражение просто к характеристике человека.
- source_word: ἐγκαταλείψει
  choice: оставит
  rationale: Передаёт значение «покинуть, оставить»; в данном контексте выражает предательство по отношению к благодетелю.
- source_word: ῥυσάμενον
  choice: того, кто избавил его
  rationale: Передаёт субстантивированное причастие от ῥύομαι и делает подразумеваемый объект избавления явным по-русски.
theological_decisions:
- issue: Родовая характеристика без выраженного существительного
  choice: неблагодарный
  alternative: неблагодарный человек
  rationale: Греческое прилагательное употреблено субстантивированно; русский язык позволяет сохранить такую форму без добавления отсутствующего в источнике слова «человек».
- issue: Внутренняя неблагодарность
  choice: в мыслях
  alternative: по своему нраву
  rationale: Буквальная внутренняя направленность ἐν διανοίᾳ сохранена, поскольку её устранение ослабило бы смысловой акцент источника.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и достойная формулировка. Союз «И» сохранён как часть связи с предшествующим контекстом.
