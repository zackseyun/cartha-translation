translation:
  language: ru
  text: Лучше бедняку жить под крышей из балок, чем вкушать роскошные яства у чужих[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в чужом доме» или «среди чужих». Греческое выражение может обозначать как других людей, так и то, что им принадлежит.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρείσσων
  choice: лучше
  rationale: Сравнительная форма естественно вводит краткое изречение о том, что предпочтительнее.
- source_word: βίος πτωχοῦ
  choice: бедняку жить
  rationale: Предикативная перестройка передаёт «жизнь бедняка» естественным современным русским языком, сохраняя обобщённую форму мужского рода исходного текста.
- source_word: ὑπὸ σκέπην δοκῶν
  choice: под кровом из брёвен
  rationale: δοκῶν синтаксически понимается как родительный множественного числа от δοκός («балка, бревно»), зависящий от σκέπην («кров, укрытие»), а не как причастие от δοκέω. Выражение рисует скромное, простое жилище.
- source_word: ἐδέσματα λαμπρά
  choice: роскошные яства
  rationale: ἐδέσματα означает кушанья, а λαμπρά — великолепные, пышные; сочетание «роскошные яства» сохраняет возвышенный образ и контраст с бедным кровом.
- source_word: ἐν ἀλλοτρίοις
  choice: у чужих
  rationale: Субстантивированное множественное прилагательное допускает значения «у других», «среди чужих» и, по контексту, «в чужом доме». Краткое «у чужих» сохраняет широту греческого выражения.
