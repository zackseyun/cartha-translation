  source_fidelity: 'Основная передача верна: повелительное «Выйди», обращение «пришелец», вероятное контекстуальное «с почётного места», причинное «ведь», а также значение ἐπεξενώταί μοι как состояния принятого гостя хорошо соответствуют греческому тексту. Однако «помещение для гостя» чрезмерно канцелярски и конкретизирует ξενία как физическое помещение; слово охватывает гостеприимство и ночлег/приют.'
