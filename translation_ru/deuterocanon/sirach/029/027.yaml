  terminology: «Пришелец» уместно для πάροικε в литературном библейском регистре и не должно быть заменено более узким «иностранец». «Почётное место» допустимо как контекстуальная передача необычного ἀπὸ προσώπου δόξης при сохранении буквального варианта в сноске. «Брат» не следует догматически уточнять как кровного родственника или единоверца.
