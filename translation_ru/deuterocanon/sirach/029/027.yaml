  text: Go out[a], sojourner, from the place of honor, for my brother has become my guest[b], and I need the lodging.
translation:
  language: ru
  text: «Выйди, пришелец, с почётного места[a], ведь мой брат стал у меня гостем, и нужно место для ночлега[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лица славы». Греческое выражение необычно; возможно также: «с почётного положения». По контексту пришельцу велят уступить заметное или почётное место другому гостю.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «нужно гостеприимство» или «нужен приют». Греческое слово может обозначать как гостеприимство, так и ночлег или место для проживания гостя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξελθε
  choice: Выйди
  rationale: Прямой повелительный глагол передаёт резкость греческого ἔξελθε без смягчающего истолкования.
- source_word: πάροικε
  choice: пришелец
  rationale: Слово обозначает живущего среди других, но не принадлежащего к местному сообществу; «пришелец» сохраняет его уязвимое положение и звучит уместно в литературном русском тексте.
- source_word: ἀπὸ προσώπου δόξης
  choice: с почётного места
  rationale: Буквально необычное выражение означает «от лица/присутствия славы». По контексту вероятнее всего имеется в виду заметное или почётное место; неоднозначность отмечена в сноске.
- source_word: ἐπεξενώταί μοι
  choice: стал у меня гостем
  rationale: 'Перфект передаёт наступившее состояние: брат был принят и теперь находится у говорящего как гость.'
- source_word: ὁ ἀδελφός
  choice: мой брат
  rationale: При названии близкого родственника греческий артикль в данном контексте естественно передаётся по-русски притяжательным местоимением.
- source_word: χρεία τῆς ξενίας
  choice: нужно помещение для гостя
  rationale: Передаёт необходимость, связанную с размещением гостя, не вводя отсутствующего в греческом конкретного слова «комната».
