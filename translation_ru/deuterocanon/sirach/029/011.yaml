  text: Store up your treasure according to the commandments of the Most High[a], and it will profit you more than gold.
translation:
  language: ru
  text: Отложи своё сокровище в соответствии с заповедями Всевышнего, и оно принесёт тебе больше пользы, чем золото.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θὲς
  choice: Помести
  rationale: Аористный императив от τίθημι означает «положи, помести». Выбор сохраняет образ намеренного размещения сокровища, не добавляя отсутствующего в самом стихе прямого указания на милостыню.
- source_word: τὸν θησαυρόν σου
  choice: своё сокровище
  rationale: θησαυρός обозначает сокровище или накопленное богатство; «сокровище» сохраняет как имущественный смысл, так и более широкий смысл того, что человек ценит.
- source_word: κατʼ ἐντολὰς
  choice: согласно заповедям
  rationale: Передан греческий плюрал ἐντολάς без сведения его к собирательному единственному числу. «Согласно» естественно выражает соответствие Божьим предписаниям.
- source_word: Ὑψίστου
  choice: Всевышнего
  rationale: Устоявшаяся русская передача божественного титула Ὕψιστος.
- source_word: λυσιτελήσει σοι
  choice: оно принесёт тебе больше пользы
  rationale: λυσιτελέω означает «быть полезным, выгодным». Такая передача звучит естественно по-русски и сохраняет обращение к адресату.
- source_word: μᾶλλον ἢ τὸ χρυσίον
  choice: чем золото
  rationale: Вместе со сравнительной конструкцией «больше пользы» точно передаёт превосходство над золотом, не заменяя пользу более общим словом «лучше».
theological_decisions:
- issue: Следует ли прямо истолковать сокровище как милостыню
  choice: 'Оставить формулировку широкой: «Помести своё сокровище согласно заповедям Всевышнего»'
  alternative: «Раздавай милостыню и тем собирай себе сокровище»
  rationale: Контекст главы связан с помощью ближнему и милостыней, однако в самом греческом тексте этого стиха милостыня прямо не названа. Широкая формулировка сохраняет смысловую открытость оригинала.
translation_notes:
  register: Современный литературный русский язык; тон краткий, наставительный и достойный. Сохранены повелительная форма, множественное число «заповедям» и экономический образ пользы в сравнении с золотом.
