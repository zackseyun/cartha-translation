  yaml_path: translation/deuterocanon/sirach/029/005.yaml
  text: Until he receives it[a], he will kiss his neighbor's hand, and for his neighbor’s money he will lower his voice; but at the time of repayment he will delay[b], and he will repay with words of indifference and blame the timing.
translation:
  language: ru
  text: Пока не получит денег, он будет целовать ближнему руку и ради его денег будет говорить смиренным голосом[a]; а когда настанет время возврата, станет тянуть время, ответит равнодушными словами[b] и станет винить время.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «смирит голос», то есть станет говорить тихо и заискивающе.'
    reason: lexical_alternative
  - marker: b
    text: 'Глагол, обычно означающий «воздать, вернуть», употреблён иронически: вместо возврата денег он отвечает лишь равнодушными словами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως οὗ λάβῃ
  choice: Пока не получит денег
  rationale: Греческий текст не называет объект прямо, но контекст следующей фразы ясно указывает на деньги, которые заёмщик хочет получить; дополнение делает русскую фразу естественной.
- source_word: καταφιλήσει χεῖρα αὐτοῦ
  choice: будет целовать ближнему руку
  rationale: Сохраняется конкретный образ преувеличенной почтительности. Дательный «ближнему» естественно передаёт принадлежность руки и проясняет контекстуального референта местоимения αὐτοῦ.
- source_word: ἐπὶ τῶν χρημάτων τοῦ πλησίον
  choice: ради его денег
  rationale: 'ἐπί в данном контексте выражает повод или мотив униженного поведения: желание получить деньги ближнего. Местоимение избегает тяжеловесного повтора.'
- source_word: ταπεινώσει φωνήν
  choice: заговорит смиренным голосом
  rationale: Буквально выражение означает «смирит голос»; русский оборот передаёт не просто громкость, а заискивающий, покорный тон.
- source_word: ἐν καιρῷ ἀποδόσεως
  choice: когда настанет время возврата
  rationale: ἀπόδοσις в финансовом контексте означает возврат долга; формулировка естественна по-русски и сохраняет временную конструкцию.
- source_word: παρελκύσει χρόνον
  choice: станет тянуть время
  rationale: Идиома точно и живо передаёт намеренное затягивание срока.
- source_word: ἀποδώσει λόγους ἀκηδίας
  choice: отплатит словами безразличия
  rationale: '«Отплатит» сохраняет иронию ἀποδώσει: вместо денег должник возвращает лишь слова. «Безразличие» передаёт ἀκηδία как отсутствие заботы и участия, не сводя выражение только к оправданиям.'
- source_word: τὸν καιρὸν αἰτιάσεται
  choice: обвинит само время
  rationale: Сохраняется прямой объект греческого выражения — «время». Частица «само» подчёркивает перенос вины на срок или обстоятельства, не устраняя присущую выражению широту смысла.
