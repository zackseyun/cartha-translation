  source_fidelity: Греческое βαρέα ταῦτα передано верно по смыслу. Однако ἐπιτίμησις οἰκίας буквально не называет «хозяев дома»; такая передача вводит невыраженный субъект и меняет единственное число. В контексте речь идёт об упрёках, связанных с домом/жильём. Родительный при ὀνειδισμὸς δανιστοῦ естественно передать как оскорбления со стороны заимодавца; исходная русская конструкция может означать оскорбления, направленные на заимодавца.
  naturalness: «Тяжело это для человека разумного» понятно, но порядок слов несколько книжно-неестественен. «Упрёки по поводу жилья» и «оскорбления со стороны заимодавца» звучат современно, ясно и сохраняют лаконичный афористический строй.
  terminology: «Разумный человек» адекватно передаёт ἄνθρωπος ἔχων φρόνησιν. «Заимодавец» точно передаёт δανιστής. Для ἐπιτίμησις уместны «упрёки», а не «укоры хозяев дома», поскольку в греческом не сказано о хозяевах.
