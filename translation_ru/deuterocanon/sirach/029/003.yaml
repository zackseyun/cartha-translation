  text: Keep your word[a], and be faithful to him, and at all times you will find what you need.
translation:
  language: ru
  text: Твёрдо держись своего слова[a] и будь верен ему — тогда во всякое время найдёшь то, что тебе нужно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Утверди своё обещание и поступай надёжно с тем, кому ты его дал».'
    reason: Греческое выражение допускает как отнесение местоимения к данному слову или обещанию, так и личное понимание — к участнику соглашения.
lexical_decisions:
- source_word: στερέωσον
  choice: твёрдо держись
  rationale: Глагол означает «укрепить, утвердить, сделать твёрдым»; в сочетании со «словом» речь идёт о неуклонном исполнении данного обязательства.
- source_word: λόγον
  choice: своего слова
  rationale: В контексте финансовых обязательств λόγος обозначает данное слово или обещание; «слово» сохраняет образ и естественно звучит по-русски.
- source_word: πιστώθητι
  choice: будь верен
  rationale: Форма передаёт призыв проявить верность и надёжность, не сводя смысл только к внешней кредитоспособности.
- source_word: μετʼ αὐτοῦ
  choice: ему
  rationale: Местоимение наиболее естественно соотнести с данным словом (λόγον), которое в греческом мужского рода; русский перевод сохраняет эту связь. Возможное личное прочтение отмечено в сноске.
- source_word: ἐν παντὶ καιρῷ
  choice: во всякое время
  rationale: Близко передаёт широкий временной охват греческого выражения и сохраняет возвышенный, но понятный регистр.
- source_word: εὑρήσεις
  choice: найдёшь
  rationale: Прямой эквивалент будущего времени εὑρίσκω; контекст допускает смысл получения необходимого, но не требует его явного уточнения.
- source_word: τὴν χρείαν σου
  choice: то, что тебе нужно
  rationale: Естественная русская передача буквального «твою нужду/необходимость», обозначающая необходимую помощь или средства без чрезмерного уточнения.
theological_decisions:
- issue: Референт μετʼ αὐτοῦ
  choice: 'Связать местоимение с данным словом/обещанием: «будь верен ему».'
  alternative: 'Понимать местоимение как указание на человека, перед которым дано обязательство: «будь верен ему» в личном смысле или «поступай с ним надёжно».'
  rationale: Ближайший грамматический антецедент λόγον — мужского рода, поэтому связь со «словом» возможна и хорошо соответствует призыву исполнять обещание. Однако личное прочтение также допускается контекстом и сохранено в примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным ритмом. Формулировка понятна широкому читателю; тире естественно выражает следствие, заложенное последовательностью повелений и будущего времени.
