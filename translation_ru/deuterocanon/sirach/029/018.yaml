base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/018.yaml
  text: Surety has destroyed many who were upright[a], and has shaken them like a wave of the sea; it has driven mighty men from their homes, and they wandered among foreign nations.
translation:
  language: ru
  text: Поручительство погубило многих, чьи дела шли успешно[a], и раскачало их, словно морская волна; оно изгнало из родных мест могущественных мужей, и они скитались среди чужих народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «шедших прямо»; возможно также: «шедших прямым путём». Греческое выражение может означать людей, которые успешно продвигались в своих делах.'
    reason: Сохранение смысловой неоднозначности κατευθύνοντας между буквальным «идти прямо» и переносным «преуспевать».
lexical_decisions:
- source_word: ἐγγύη
  choice: поручительство
  rationale: Греческое существительное обозначает принятие на себя обеспечения чужого долга; «поручительство» — современный и точный русскоязычный юридико-финансовый термин.
- source_word: ἀπώλεσεν
  choice: погубило
  rationale: Передаёт сильное значение причинённой гибели или разорения, не ограничивая смысл исключительно физической смертью.
- source_word: κατευθύνοντας
  choice: чьи дела шли успешно
  rationale: Причастие буквально описывает идущих прямо или благополучно продвигающихся. В данном контексте выражение естественно указывает на людей, дела которых складывались успешно, при сохранении буквальной возможности в сноске.
- source_word: ἐσάλευσεν
  choice: раскачало
  rationale: Глагол означает трясти, колебать; «раскачало» естественно соединяется с последующим сравнением с морской волной.
- source_word: ὡς κῦμα θαλάσσης
  choice: словно морская волна
  rationale: Сохраняет сравнение и единственное число греческого образа.
- source_word: ἄνδρας δυνατούς
  choice: могущественных мужей
  rationale: Передаёт как силу или высокое положение δυνατούς, так и явно мужское обозначение ἄνδρας.
- source_word: ἀπῴκισεν
  choice: изгнало из родных мест
  rationale: Глагол выражает принудительное удаление из места проживания или страны; формулировка подчёркивает утрату дома и подготавливает упоминание скитаний среди чужих народов.
- source_word: ἐπλανήθησαν
  choice: они скитались
  rationale: В контексте изгнания речь идёт прежде всего о физическом странствии, а не о нравственном заблуждении.
- source_word: ἐν ἔθνεσιν ἀλλοτρίοις
  choice: среди чужих народов
  rationale: Ясно передаёт пребывание среди народов, не являющихся своими.
theological_decisions:
- issue: Неоднозначность κατευθύνοντας
  choice: чьи дела шли успешно
  alternative: шедших прямым путём / праведных
  rationale: Форма допускает буквальный образ прямого пути и переносный смысл успешного продвижения. Контекст материального разорения вследствие поручительства поддерживает практический смысл, однако нравственное прочтение не исключается и отмечено в сноске.
- issue: Мужской род в ἄνδρας δυνατούς
  choice: могущественных мужей
  alternative: могущественных людей / сильных
  rationale: Греческий текст употребляет конкретное ἄνδρας («мужей, мужчин»), поэтому мужская отнесённость сохранена без нейтрализации.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Финансово-правовое «поручительство» понятно современному читателю; синтаксический параллелизм и морской образ оригинала сохранены.
