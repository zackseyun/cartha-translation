lexical_decisions:
- source_word: ἐπὶ μικρῷ καὶ μεγάλῳ
  choice: и малым, и многим
  rationale: Сочетание ἐπί с дательным здесь обозначает обстоятельства или меру того, чем следует быть довольным. Формулировка сохраняет контраст между малым достатком и изобилием и естественно звучит по-русски.
- source_word: εὐδοκίαν
  choice: доволен
  rationale: Существительное может означать благорасположение, удовольствие или удовлетворение. В сочетании с ἔχε оно выражает устойчивое довольство или благожелательное принятие своего положения.
- source_word: ἔχε
  choice: будь
  rationale: Буквально глагол означает «имей», однако по-русски сочетание естественно передаётся составным повелительным выражением «будь доволен».
