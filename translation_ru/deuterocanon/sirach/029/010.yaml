translation:
  language: ru
  text: Потеряй серебро ради брата и друга и не дай ему ржаветь под камнем и пропасть[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не дай ему испортиться под камнем и погибнуть». Греческий глагол здесь труден для точного истолкования; общий смысл в том, что спрятанное серебро портится или пропадает впустую, вместо того чтобы пойти на помощь нуждающемуся.'
    reason: Лексическая неопределённость редкого греческого глагола μὴ ἰωθῇ и образного выражения о порче серебра.
lexical_decisions:
- source_word: ἀπόλεσον
  choice: Потеряй
  rationale: 'Аористный императив от ἀπόλλυμι передан прямо и с сохранением парадоксальной силы: лучше лишиться средств ради близкого человека, чем бесполезно прятать их. Более гладкие варианты «потрать» и «пожертвуй» сужают значение.'
- source_word: ἀργύριον
  choice: серебро
  rationale: Сохранён конкретный древний образ серебра как денег; он понятен по контексту и поддерживает афористичность изречения.
- source_word: διʼ ἀδελφὸν καὶ φίλον
  choice: ради брата и друга
  rationale: 'διά с винительным выражает основание или пользу: расстаться с серебром ради близких. Притяжательное местоимение не добавлено, поскольку его нет в греческом тексте.'
- source_word: μὴ ἰωθῇ
  choice: не дай ему ржаветь
  rationale: Трудная и редкая форма в данном контексте обозначает порчу спрятанного серебра. Образ ржавления сохранён как древняя бытовая метафора, несмотря на его неточность с точки зрения современной химии.
- source_word: ὑπὸ τὸν λίθον
  choice: под камнем
  rationale: Дословно сохранён наглядный образ денег, спрятанных или зарытых под камнем.
- source_word: εἰς ἀπώλειαν
  choice: и пропасть
  rationale: 'Греческое выражение результата передано естественным русским глаголом: спрятанное богатство в итоге гибнет и становится бесполезным.'
