  yaml_path: translation/deuterocanon/sirach/029/001.yaml
  text: He who shows mercy lends to his neighbor[a], and he who strengthens him with his hand keeps the commandments.
translation:
  language: ru
  text: Кто проявляет милость, тот даст взаймы ближнему; а кто подаёт руку помощи[a], тот соблюдает заповеди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «укрепляет своей рукой». В греческом тексте не названо прямо, кого поддерживают; выражение передаёт конкретную, деятельную помощь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ποιῶν ἔλεος
  choice: Кто проявляет милость
  rationale: Семитизированное сочетание буквально означает «творящий милость» и говорит о деятельном милосердии, а не только о чувстве. «Проявляет милость» естественно передаёт этот смысл по-русски.
- source_word: δανιεῖ
  choice: даст взаймы
  rationale: Форма является будущим временем изъявительного наклонения. «Даст взаймы» точно передаёт финансовый смысл глагола и естественно звучит в контексте.
- source_word: τῷ πλησίον
  choice: ближнему
  rationale: В этическом контексте πλησίον обозначает ближнего; русское существительное сохраняет традиционный библейский смысл без архаизации синтаксиса.
- source_word: ὁ ἐπισχύων τῇ χειρὶ αὐτοῦ
  choice: кто поддерживает его своей рукой
  rationale: ἐπισχύω может означать «укреплять, поддерживать». Дополнение в греческом не выражено, но по контексту подразумевается ближний; образ руки сохраняет конкретный, деятельный характер помощи.
- source_word: τηρεῖ ἐντολάς
  choice: соблюдает заповеди
  rationale: Устойчивое сочетание τηρέω с ἐντολή означает соблюдение заповедей. Нулевой артикль перед множественным числом естественен для греческого и не лишает выражение религиозно-нравственного смысла.
theological_decisions:
- issue: Относятся ли ἐντολάς к Божьим заповедям или к предписаниям вообще
  choice: заповеди
  alternative: повеления
  rationale: В контексте Премудрости Иисуса, сына Сирахова, слово обозначает признанные нравственно-религиозные заповеди. Русское «заповеди» сохраняет эту весомость, не уточняя сверх текста их перечень.
- issue: Выражает ли будущее δανιεῖ предписание, обещание или характерный поступок милосердного человека
  choice: даст взаймы
  alternative: даёт взаймы
  rationale: Сохранено грамматическое будущее греческого текста. Перевод не решает дополнительно, имеет ли оно оттенок следствия, готовности или общего правила.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской лексикой. Параллелизм двух частей сохранён; точка с запятой делает его ясным без тяжеловесного повторения союза.
