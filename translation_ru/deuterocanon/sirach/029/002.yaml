translation:
  language: ru
  text: Дай взаймы ближнему в час его нужды и, в свою очередь, вовремя верни долг ближнему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δάνεισον
  choice: Дай взаймы
  rationale: Точно передаёт повелительное наклонение и значение предоставления займа; современнее и естественнее буквального «одолжи».
- source_word: τῷ πλησίον
  choice: ближнему
  rationale: Сохраняет устойчивое библейское обозначение другого человека и повтор во второй части стиха.
- source_word: ἐν καιρῷ χρείας αὐτοῦ
  choice: когда он в нужде
  rationale: Естественно передаёт временное обстоятельство и состояние нужды, не добавляя более узкого значения.
- source_word: καὶ πάλιν
  choice: и сам
  rationale: 'πάλιν здесь выражает ответное, взаимное действие: тот, кто даёт другому взаймы, должен со своей стороны возвращать долг. «Сам» естественно передаёт этот поворот в русском контексте.'
- source_word: ἀπόδος
  choice: возврати долг
  rationale: Глагол означает отдать или вернуть причитающееся; слово «долг» эксплицирует подразумеваемый предмет возврата и устраняет неестественную двусмысленность русского «возврати ближнему».
- source_word: εἰς τὸν καιρόν
  choice: вовремя
  rationale: Передаёт соблюдение надлежащего срока без излишне конкретизирующего «в назначенный срок».
theological_decisions:
- issue: Взаимность наставления
  choice: 'Сохранить смену ролей: читатель должен и давать взаймы нуждающемуся, и сам своевременно возвращать долг.'
  alternative: Понять обе части как наставление только заимодавцу.
  rationale: ἀπόδος обычно означает «отдай/возврати», а καὶ πάλιν указывает на ответное действие; это сохраняет этическое напряжение между помощью ближнему и собственной ответственностью.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростного изречения. Синтаксис краткий и параллельный; сохранён повтор «ближнему», но подразумеваемый объект ἀπόδος выражен словом «долг» ради ясности.
