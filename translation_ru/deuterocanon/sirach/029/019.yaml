  text: A sinner who falls into surety and pursues contracts will fall into lawsuits[a][b].
translation:
  language: ru
  text: Грешник, став поручителем и гоняясь за подрядами, окажется втянут в судебные тяжбы[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «попадёт под суд»; или: «окажется втянут в судебные споры». Греческое κρίσεις может обозначать судебные разбирательства, решения суда или правовые споры.'
    reason: lexical_alternative
  - marker: b
    text: Поручитель — тот, кто принимает на себя ответственность за долг или иное обязательство другого человека.
    reason: cultural_note
lexical_decisions:
- source_word: ἁμαρτωλός
  choice: грешник
  rationale: Существительное в единственном числе имеет обобщающий смысл; «грешник» естественно и прямо передаёт нравственную характеристику.
- source_word: ἐμπεσὼν εἰς ἐγγύην
  choice: став поручителем
  rationale: ἐγγύη обозначает поручительство или обеспечение чужого обязательства. Русское выражение ясно передаёт смысл, тогда как буквальное «впав в поручительство» звучало бы неестественно.
- source_word: διώκων
  choice: гоняясь за
  rationale: Причастие выражает настойчивое стремление; «гоняясь за» сохраняет активный и предостерегающий оттенок контекста.
- source_word: ἐργολαβίας
  choice: подрядами
  rationale: ἐργολαβία может обозначать подрядные работы или договорные предприятия. «Подряды» сохраняет деловой и договорный смысл, не расширяя его до любых сделок.
- source_word: ἐμπεσεῖται εἰς κρίσεις
  choice: окажется втянут в судебные тяжбы
  rationale: κρίσεις допускает значения судебных разбирательств, решений или споров. В контексте поручительства и подрядов наиболее естествен юридический смысл; формулировка также передаёт повторяющийся образ попадания во что-либо.
