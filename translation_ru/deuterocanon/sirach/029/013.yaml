  text: More than a strong shield and more than a mighty spear, it will fight for you against an enemy.
translation:
  language: ru
  text: Это будет сражаться за тебя лучше крепкого щита и могучего копья[a] против врага.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте подлежащее здесь не повторено; имеется в виду то, что восхваляется в предыдущем стихе и образно представлено как сражающееся за человека. По контексту возможны такие отнесения, как милостыня или оказанная помощь.
    reason: Сохранение неявного подлежащего и контекстуальной неоднозначности.
lexical_decisions:
- source_word: ὑπὲρ ἀσπίδα κράτους
  choice: лучше крепкого щита
  rationale: В сравнительной конструкции ὑπὲρ выражает превосходство; генитив κράτους передан естественным русским определением «крепкого».
- source_word: ὑπὲρ δόρυ ἀλκῆς
  choice: лучше могучего копья
  rationale: Сохранены повтор ὑπὲρ и военный параллелизм; ἀλκή обозначает силу, мощь или боевую доблесть.
- source_word: κατέναντι ἐχθροῦ
  choice: против врага
  rationale: Оборот обозначает враждебное противостояние; у ἐχθροῦ нет артикля, поэтому неопределённое «врага» предпочтительнее «этого врага» или контекстуально определённого «врага твоего».
- source_word: πολεμήσει
  choice: будет сражаться
  rationale: Будущее время и образ личного участия в битве переданы прямо, без ослабления метафоры.
- source_word: ὑπὲρ σοῦ
  choice: за тебя
  rationale: Здесь ὑπὲρ имеет значение действия в чью-либо защиту или от чьего-либо имени; «за тебя» естественно сочетается с «сражаться».
- source_word: implicit subject of πολεμήσει
  choice: это
  rationale: В греческом подлежащее не повторено. Указательное «это» позволяет отослать читателя к предмету похвалы в предыдущем стихе, не называя его прямо и не навязывая конкретного толкования.
theological_decisions:
- issue: Неявное подлежащее, перенесённое из предыдущего стиха
  choice: Передать нейтральным указательным словом «это» и пояснить в сноске.
  alternative: «милостыня будет сражаться», «твоя доброта будет сражаться» или «она будет сражаться»
  rationale: Греческий текст этого стиха не называет подлежащее заново. Конкретизация в основном тексте устранила бы оставленную оригиналом контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным воинским образом. Синтаксический параллелизм двух сравнений сохранён; архаизмы вроде «ратовать» и «щит силы» отвергнуты.
