  yaml_path: translation/deuterocanon/sirach/029/009.yaml
  text: For the sake of the commandment[a], help the poor, and according to his need do not send him away empty.
translation:
  language: ru
  text: Ради заповеди помоги бедному и, сообразно его нужде, не отпускай его ни с чем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не отвергай его, оставляя с пустыми руками».'
    reason: 'Лексическая альтернатива: ἀποστρέψῃς может буквально передавать отвержение или отсылку, а κενόν — состояние человека, не получившего помощи.'
lexical_decisions:
- source_word: χάριν ἐντολῆς
  choice: ради заповеди
  rationale: Предлог «ради» с родительным естественно передаёт мотив или основание, выраженное χάριν; «заповедь» сохраняет весомый и при этом неуточнённый смысл ἐντολή.
- source_word: ἀντιλαβοῦ
  choice: помоги
  rationale: Форма повелительного наклонения от ἀντιλαμβάνομαι обозначает деятельную поддержку; «помоги» ясно и естественно передаёт этот смысл по-русски.
- source_word: πένητος
  choice: бедному
  rationale: πένης — бедный, нуждающийся человек. Субстантивированное «бедному» сохраняет единичную форму греческого текста и не добавляет указания на пол.
- source_word: κατὰ τὴν ἔνδειαν αὐτοῦ
  choice: сообразно его нужде
  rationale: Оборот передаёт соответствие помощи действительной нужде человека; «сообразно» сохраняет значение κατά, не превращая его в более общее «из-за».
- source_word: μὴ ἀποστρέψῃς αὐτὸν κενόν
  choice: не отпускай его ни с чем
  rationale: В данном сочетании ἀποστρέφω и κενός описывают отказ в помощи, после которого человек уходит, ничего не получив. Русская идиома «ни с чем» естественно сохраняет конкретный смысл.
theological_decisions:
- issue: К чему относится «заповедь»
  choice: Сохранено неопределённое «заповедь» без указания конкретного установления
  alternative: Назвать её Божьей заповедью вообще или определённой заповедью Торы
  rationale: Греческое ἐντολῆς стоит в единственном числе, но содержание и источник заповеди в самом стихе не уточнены; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткий наставительный тон оригинала сохранён. «Ради заповеди» звучит достойно и не конкретизирует не названную в тексте заповедь; «ни с чем» — понятная современная идиома.
