  text: But be patient with the humble[a], and do not keep him waiting for almsgiving.
translation:
  language: ru
  text: Но будь терпелив к бедняку и не заставляй его ждать милостыни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не откладывай подаяние ему». Греческий глагол может означать «откладывать» или «затягивать дело».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: Но
  rationale: Передаёт противопоставление или уточнение по отношению к предшествующему наставлению естественным современным русским союзом.
- source_word: ἐπὶ ταπεινῷ
  choice: к бедняку
  rationale: ταπεινός может означать смиренного, униженного или человека низкого положения; контекст займа и милостыни указывает прежде всего на материально нуждающегося, поэтому «бедняк» ясно выражает социально-экономический смысл.
- source_word: μακροθύμησον
  choice: будь терпелив
  rationale: Императив призывает проявлять долготерпение и снисходительность; «будь терпелив» звучит естественно и сохраняет этическую направленность.
- source_word: ἐπʼ ἐλεημοσύνην
  choice: милостыни
  rationale: В иудейско-греческом употреблении ἐλεημοσύνη обозначает конкретную помощь нуждающемуся, то есть милостыню, а не только отвлечённое милосердие.
- source_word: μὴ παρελκύσῃς αὐτόν
  choice: не заставляй его ждать
  rationale: παρελκύω выражает затягивание или отсрочку; при личном дополнении αὐτόν эта формулировка естественно передаёт мысль о том, что нуждающегося нельзя томить ожиданием.
