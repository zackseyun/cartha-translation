  text: Многие сочли заём находкой[a] и доставили хлопоты тем, кто им помог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как находку» или «как нечто найденное», то есть словно полученное взаймы было неожиданным приобретением, а не тем, что следует вернуть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: Многие
  rationale: Неопределённое множественное число с обобщающим значением; краткое и естественное соответствие в русском языке.
- source_word: ὡς εὕρεμα
  choice: неожиданной находкой
  rationale: εὕρεμα буквально обозначает найденное, находку; в контексте займа речь о деньгах, воспринятых как нежданное приобретение, а не как сумма, подлежащая возврату. Слово «неожиданной» делает этот переносный смысл понятным, не устраняя буквального образа.
- source_word: ἐνόμισαν
  choice: сочли
  rationale: 'Аорист νομίζω передан совершенным видом: «сочли» означает «приняли за, стали считать» и естественно звучит в афористическом изречении.'
- source_word: δάνος
  choice: заём
  rationale: δάνος означает предоставленную взаймы сумму; «заём» точнее, чем абстрактный «долг».
- source_word: παρέσχον πόνον
  choice: причинили неприятности
  rationale: Буквально сочетание означает «доставили тяготу/страдание». «Причинили неприятности» естественно передаёт отрицательные последствия для давших взаймы, не усиливая меру страдания сверх текста.
- source_word: τοῖς βοηθήσασιν αὐτοῖς
  choice: тем, кто им помог
  rationale: Субстантивированное причастие обозначает оказавших им помощь. Формулировка сохраняет широту греческого выражения и не подменяет её более узким обозначением «заимодавцы».
