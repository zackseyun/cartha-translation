lexical_decisions:
- source_word: ἀγαθὰ
  choice: добро
  rationale: 'Слово «добро» сохраняет широту греческого среднего множественного: оно может обозначать блага вообще, а также имущество или достаток.'
- source_word: ἐγγύου
  choice: поручителя
  rationale: «Поручитель» — современное и точное обозначение человека, который отвечает за обязательство другого.
- source_word: ἀνατρέψει
  choice: погубит
  rationale: В данном контексте глагол означает не просто физически «опрокинуть», а расстроить или привести к гибели добро и состояние поручителя; «погубит» естественно передаёт результат, не сужая его до одной юридической формы ущерба.
- source_word: ἁμαρτωλός
  choice: грешник
  rationale: Существительное без артикля имеет обобщённое значение; «грешник» прямо сохраняет нравственную характеристику субъекта.
theological_decisions:
- issue: Нравственная характеристика субъекта
  choice: грешник
  alternative: грешный человек
  rationale: Краткое «грешник» непосредственно соответствует ἁμαρτωλός и не добавляет к этическому предостережению лишних богословских уточнений.
translation_notes:
  register: Современный литературный русский язык; краткая афористичная форма сохранена. Выражение «добро поручителя» намеренно оставляет открытым, идёт ли речь только об имуществе или шире — о его благополучии и благах.
