lexical_decisions:
- source_word: ξενιεῖς
  choice: будешь принимать у себя
  rationale: Будущее время ξενίζω обозначает приём человека как гостя. Такое выражение естественно по-русски и сохраняет контекст гостеприимства.
- source_word: ποτιεῖς
  choice: поить
  rationale: Глагол означает давать кому-либо пить. Краткое «поить» естественно сочетается с предшествующим выражением и сохраняет прямоту греческого текста.
- source_word: εἰς ἀχάριστα
  choice: неблагодарных
  rationale: Субстантивированное ἀχάριστα характеризует тех, кому оказывают гостеприимство, как неблагодарных. Русская форма во множественном числе не уточняет их пол и звучит естественно.
- source_word: πρὸς ἐπὶ τούτοις
  choice: а вдобавок ко всему этому
  rationale: Несколько избыточное греческое сочетание имеет усилительное добавочное значение. Перевод передаёт мысль о новой тяготе сверх уже названных.
- source_word: πικρὰ
  choice: горькие слова
  rationale: Прилагательное среднего рода множественного числа употреблено субстантивированно, а объект глагола «услышишь» прямо не назван. «Слова» естественно восполняет подразумеваемое, тогда как сноска сохраняет формальную неоднозначность.
- source_word: ἀκούσει
  choice: услышишь
  rationale: Простое будущее ἀκούω передано обычным русским глаголом совершенного вида, подходящим для предупреждения о предстоящем результате.
