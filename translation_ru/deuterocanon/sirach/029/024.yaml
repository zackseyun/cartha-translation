  text: A miserable life is to go from house to house[a], and where one stays as a stranger[b], he will not open his mouth.
translation:
  language: ru
  text: Тяжела жизнь — переходить из дома в дом[a]; и там, где человек живёт как пришлый[b], он не откроет рта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Дословно: «из дома в дом». Речь идёт о неустроенной жизни человека, вынужденного переходить от одного жилья к другому.'
    reason: lexical_alternative
  - marker: b
    text: «Живёт как пришлый» передаёт проживание в чужом доме без положения его полноправного члена.
    reason: cultural_note
lexical_decisions:
- source_word: ζωὴ πονηρά
  choice: тяжела жизнь
  rationale: В данном контексте πονηρά характеризует жизнь как тягостную и бедственную, а не как нравственно злую. Русское «тяжела жизнь» естественно передаёт эту оценку.
- source_word: ἐξ οἰκίας εἰς οἰκίαν
  choice: переходить из дома в дом
  rationale: В греческом буквально выражено движение «из дома в дом». Добавленный по смыслу инфинитив делает фразу естественной по-русски и передаёт неустроенность постоянных переходов.
- source_word: παροικήσει
  choice: поселится как чужак
  rationale: παροικέω означает жить где-либо, не принадлежа полностью к местному сообществу или дому. «Как чужак» сохраняет социальную незащищённость, не сводя значение лишь к краткому гостеванию.
- source_word: οὐκ ἀνοίξει στόμα
  choice: не откроет рта
  rationale: Сохранён образный греческий оборот, означающий, что зависимый от хозяев человек не решается или не имеет возможности высказаться.
