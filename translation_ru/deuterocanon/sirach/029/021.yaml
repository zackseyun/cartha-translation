translation:
  language: ru
  text: Основа жизни — вода, хлеб, одежда и дом, укрывающий наготу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дом, скрывающий стыд (непристойность)». Греческое слово может обозначать как наготу — то, что следует прикрывать, — так и стыд или непристойность в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρχὴ ζωῆς
  choice: Основа жизни
  rationale: Сочетание буквально допускает «начало жизни», но в афористическом перечне необходимых благ ἀρχή естественно обозначает основание, то, без чего невозможно жить. «Основа жизни» сохраняет образ и звучит по-русски естественнее, чем «начало жизни».
- source_word: ὕδωρ
  choice: вода
  rationale: Прямое соответствие конкретному существительному в перечне основных потребностей.
- source_word: ἄρτος
  choice: хлеб
  rationale: Сохранено конкретное значение греческого слова; расширительное «пища» здесь не требуется.
- source_word: ἱμάτιον
  choice: одежда
  rationale: Единственное число имеет обобщённый смысл; «одежда» естественно передаёт его в современном русском языке.
- source_word: οἶκος
  choice: дом
  rationale: Передаёт конкретный образ жилища, названного среди необходимых для жизни благ, без интерпретирующей замены на «кров» или «убежище».
- source_word: καλύπτων
  choice: укрывающий
  rationale: Причастие согласовано с «дом» и сохраняет сжатую структуру греческого текста; «укрывающий» естественно выражает как физическое сокрытие, так и защиту от постыдной открытости.
- source_word: ἀσχημοσύνην
  choice: наготу
  rationale: В контексте одежды и дома слово прежде всего указывает на то, что должно быть скрыто от посторонних глаз, то есть на телесную обнажённость; при этом его более широкий оттенок стыда и непристойности отмечен в сноске.
