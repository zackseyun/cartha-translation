  text: Добрый человек поручится за своего ближнего, а потерявший стыд оставит его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνὴρ ἀγαθός
  choice: добрый человек
  rationale: Сочетание обозначает нравственно доброго, порядочного человека. «Добрый человек» естественно звучит в современной русской речи и сохраняет личный, пословичный характер изречения; буквальное «добрый муж» было бы неоправданно архаичным.
- source_word: ἐγγυήσεται
  choice: поручится за
  rationale: Глагол обозначает принятие на себя поручительства, особенно в долговом или имущественном контексте. Русское «поручится за» точно и понятно передаёт этот смысл.
- source_word: τὸν πλησίον
  choice: своего ближнего
  rationale: В этико-социальном контексте πλησίον — человек, состоящий с кем-либо в отношениях близости и взаимной ответственности. «Своего ближнего» естественно связывает его с подразумеваемым субъектом.
- source_word: ὁ ἀπολωλεκὼς αἰσχύνην
  choice: потерявший стыд
  rationale: 'Перевод сохраняет образ греческого перфектного причастия: человек утратил стыд как нравственное ограничение. Более гладкое «бесстыдный» возможно, но устраняет этот образ.'
- source_word: καταλείψει αὐτόν
  choice: оставит его
  rationale: καταλείπω может означать «оставить», «покинуть», «бросить». «Оставит его» сохраняет лаконичность и не усиливает степень предательства сверх явно сказанного; местоимение «его» воспроизводит связь с ближним.
theological_decisions:
- issue: Мужской род в обобщающем изречении
  choice: добрый человек
  alternative: добрый мужчина; добрый муж
  rationale: Хотя ἀνήρ имеет мужской род и может особо обозначать мужчину, здесь изречение носит обобщающий характер. В русском «человек» грамматически мужского рода и не превращает пословичную формулу в утверждение исключительно о мужчинах; «муж» звучало бы архаично, а «мужчина» неестественно.
- issue: Связь частей изречения
  choice: противительное «а»
  alternative: соединительное «и»
  rationale: Греческое καί формально соединительно, но смысл сопоставляет доброго человека с утратившим стыд. Русское «а» естественно выражает это противопоставление, не добавляя более резкого значения «но».
translation_notes:
  register: Современный литературный русский язык; краткая, dignified пословичная формулировка без архаизмов и конфессионально окрашенной терминологии.
