translation:
  language: ru
  text: «Проходи, пришелец[a], накрой стол и, если у тебя есть что-нибудь под рукой, накорми меня».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземец», «живущий на чужбине». Греческое πάροικος обозначает человека, который живёт среди других, но остаётся для них чужим и не считается полноправным членом дома или общины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάρελθε
  choice: Проходи
  rationale: Повелительное наклонение от παρέρχομαι допускает значения движения мимо, дальше или внутрь. Русское «проходи» естественно передаёт резкое распоряжение и сохраняет контекстуальную двусмысленность направления.
- source_word: πάροικε
  choice: пришелец
  rationale: πάροικος обозначает человека, живущего среди других без положения полноправного члена их дома или общины. «Пришелец» сохраняет и проживание на чужой стороне, и социальную отчуждённость; «гость» неоправданно смягчило бы смысл.
- source_word: κόσμησον τράπεζαν
  choice: накрой на стол
  rationale: В бытовом контексте κοσμέω означает привести в порядок, приготовить; современное русское выражение «накрыть на стол» точно и естественно передаёт подготовку стола к еде.
- source_word: εἴ τι ἐν τῇ χειρί σου
  choice: если у тебя есть что-нибудь под рукой
  rationale: Оборот указывает на то, чем человек располагает. «Под рукой» сохраняет образ руки и естественно выражает доступность или наличие средств.
- source_word: ψώμισόν με
  choice: накорми меня
  rationale: ψωμίζω означает давать пищу, кормить, первоначально — кусочками. Прямое «накорми меня» сохраняет требовательный тон повеления.
