  text: Many[a], because of wickedness, turned away; they were afraid of being defrauded gratuitously.
translation:
  language: ru
  text: Многие из-за зла отвернулись, боясь лишиться своего ни за что.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Многие из-за нечестности отступились: они боялись, что их обманут и они останутся ни с чем».'
    reason: Передаёт возможный контекстуальный оттенок πονηρία («нечестность») и более развёрнуто выражает финансовый смысл ἀποστερηθῆναι δωρεάν.
lexical_decisions:
- source_word: πολλοὶ
  choice: Многие
  rationale: Неопределённое подлежащее во множественном числе естественно и точно передаётся субстантивированным «многие».
- source_word: χάριν πονηρίας
  choice: из-за нечестности
  rationale: Послелог χάριν с родительным указывает на причину. В контексте займов πονηρία обозначает зло, проявляющееся как недобросовестность или нечестность; русский вариант сохраняет нравственную оценку и связь с обманом.
- source_word: ἀπέστρεψαν
  choice: отвернулись
  rationale: Глагол передаёт отступление или отказ участвовать; «отвернулись» сохраняет образность греческого текста и не добавляет прямо не названного объекта помощи.
- source_word: ἀποστερηθῆναι
  choice: лишиться своего
  rationale: Страдательный инфинитив означает быть лишённым принадлежащего человеку, нередко вследствие обмана. «Лишиться своего» естественно звучит по-русски и соответствует финансовому контексту.
- source_word: δωρεὰν
  choice: напрасно
  rationale: Наречие может означать «даром», «безвозмездно», «без причины» или «понапрасну». Здесь «напрасно» выражает опасение понести ничем не возмещённую потерю, не вводя неестественного оборота «быть обманутым безвозмездно».
- source_word: εὐλαβήθησαν
  choice: опасаясь
  rationale: Форма выражает осторожный страх или опасение. Деепричастие естественно связывает этот мотив с предшествующим отказом и сохраняет смысл сказуемого.
theological_decisions:
- issue: Нравственный смысл πονηρίας
  choice: нечестность
  alternative: зло; порочность
  rationale: В контексте предоставления займов речь, вероятнее всего, идёт о недобросовестном поведении, заставляющем людей отказываться от помощи. «Нечестность» сохраняет моральное осуждение, не связывая стих с узкой конфессиональной трактовкой.
- issue: К кому относится нечестность
  choice: не уточнять принадлежность
  alternative: из-за чужой нечестности; по собственной порочности
  rationale: Греческий родительный πονηρίας сам по себе не называет носителя нечестности. Основной текст сохраняет эту неоднозначность, тогда как ссудный контекст позволяет понимать её прежде всего как нечестность должников.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краток и понятен; образ «отвернулись» сохранён, а не заменён контекстуальным пояснением «отказались давать взаймы».
