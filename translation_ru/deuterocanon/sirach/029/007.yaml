review_pass:
  verdict: revise
  source_fidelity: Основной вариант неоправданно сужает πονηρία до «нечестности». В данном стихе слово обозначает зло/порочность в широком смысле; ближайший контекст допускает нечестное поведение, но не требует этого уточнения. «Лишиться своего» удачно передаёт ἀποστερηθῆναι как утрату принадлежащего человеку, а «ни за что» естественно выражает δωρεάν — потерю без основания или возмещения.
  naturalness: Предлагаемая формулировка кратка, современна и сохраняет сдержанный библейский регистр. «Боясь лишиться своего ни за что» звучит естественнее, чем «напрасно лишиться своего» и не создаёт впечатления бессмысленности действия вместо незаслуженной потери.
  terminology: «Зло» сохраняет широкий этический смысл πονηρία и не предрешает, чья именно порочность имеется в виду. «Отвернулись» адекватно передаёт ἀπέστρεψαν без добавления объекта действия. Сноска обозначает допустимые контекстуальные оттенки, не выдавая их за единственный смысл.
  issues:
  - severity: medium
    issue: «Нечестность» в основном тексте сужает πονηρίας.
    rationale: Греческое πονηρία шире нечестности и может означать зло, порочность или злонамеренность; текст не уточняет ни форму зла, ни его носителя.
  - severity: low
    issue: «Напрасно» менее точно передаёт δωρεάν в сочетании с ἀποστερηθῆναι.
    rationale: Здесь естественнее передать идею лишения «ни за что», то есть без основания либо без возмещения, а не просто бесполезность или тщетность.
