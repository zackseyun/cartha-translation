base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/029/006.yaml
  text: If he is able[a], he will scarcely recover half, and will count it as a find; but if not, he has been deprived of his money, and has gained an enemy for nothing. He will repay him with curses and insults[b], and instead of honor he will repay him with dishonor.
translation:
  language: ru
  text: Если ему удастся, он едва получит обратно половину и сочтёт её находкой[a]; если же нет, тот лишит его денег и наживёт в его лице врага[b]. За это тот отплатит ему проклятиями и оскорблениями и вместо почёта воздаст ему бесчестие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сочтёт это находкой»; то есть даже возвращённая половина будет казаться неожиданной удачей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наживёт себе врага не даром». Греческое выражение также может означать «не без причины»; оно подчёркивает, что вражда возникает не беспричинно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν ἰσχύσῃ
  choice: Если сможет
  rationale: ἰσχύω означает «быть в силах, мочь». Нулевая форма подлежащего в русском сохраняет присущую греческому тексту неявность референта и не уточняет без необходимости, идёт ли речь о возможности должника заплатить или заимодавца взыскать долг.
- source_word: μόλις κομίσεται τὸ ἥμισυ
  choice: едва получит обратно половину
  rationale: κομίζω в контексте займа обозначает получение назад, а μόλις — трудность и неполноту успеха. Оборот естественен по-русски и сохраняет смысл возврата долга.
- source_word: λογιεῖται αὐτὸ ὡς εὕρεμα
  choice: сочтёт её находкой
  rationale: 'Сохраняется образ εὕρεμα: даже возвращённая половина воспринимается как нечто неожиданно найденное.'
- source_word: ἀπεστέρησεν αὐτὸν τῶν χρημάτων αὐτοῦ
  choice: лишится своих денег
  rationale: Результативная конструкция передаёт потерю денег заимодавцем, не усиливая значение до намеренного мошенничества или насильственного ограбления.
- source_word: ἐκτήσατο αὐτὸν ἐχθρὸν οὐ δωρεάν
  choice: не даром приобретёт себе врага
  rationale: Краткий русский оборот сохраняет горькую иронию κτάομαι и буквальный образ οὐ δωρεάν — враг приобретён ценой финансовой потери, а не получен «даром».
- source_word: κατάρας καὶ λοιδορίας
  choice: проклятиями и оскорблениями
  rationale: 'Переданы оба вида враждебной речи: κατάρα — проклятие, λοιδορία — брань или оскорбление.'
- source_word: ἀποδώσει αὐτῷ
  choice: отплатит ему / воздаст ему
  rationale: 'Два русских глагола естественно передают повтор ἀποδώσει и сохраняют иронию: вместо возврата денег должник «отдаёт» словесную вражду и бесчестие.'
- source_word: ἀντὶ δόξης ... ἀτιμίαν
  choice: вместо почёта ... бесчестием
  rationale: В данном социально-нравственном контексте δόξα означает оказываемый человеку почёт, а ἀτιμία — противоположное ему бесчестие; антитеза сохранена.
theological_decisions:
- issue: Нравственная оценка невозвращённого займа
  choice: Стих передан как практическое наблюдение о потере денег, возникшей вражде и оскорблениях.
  alternative: Истолковать текст как прямое осуждение ростовщичества, как утверждение о Божьем суде или как однозначное обвинение должника в преднамеренном мошенничестве.
  rationale: Греческий текст описывает конкретные последствия неудачного займа, но не формулирует более широкого учения о процентах, Божьем суде или заведомом обмане.
- issue: Неявные референты местоимений и глагольных форм
  choice: Начальная неопределённость сохранена, а дальнейшие роли обозначены естественными средствами русского синтаксиса.
  alternative: Вставить слова «должник» и «заимодавец» во все части стиха, полностью устранив синтаксическую напряжённость.
  rationale: В греческом подлежащие не названы явно и могут восприниматься через контекст; излишнее уточнение превратило бы контекстуальный вывод в прямое утверждение текста.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для литературы мудрости. Лексика общепонятна; сохранены экономическая метафора «находки», ироническое «не даром» и парная антитеза «почёт — бесчестие».
