translation:
  language: ru
  text: Помоги ближнему по мере своих сил и будь осторожен, чтобы самому не упасть.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы самому не попасть в беду»; возможно также: «чтобы самому не угодить в ловушку». В греческом тексте не уточняется, какая именно опасность имеется в виду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιλαβοῦ
  choice: Помоги
  rationale: Средний императив ἀντιλαμβάνομαι выражает деятельную помощь. «Помоги» естественно передаёт этот смысл по-русски, не добавляя вида или способа поддержки.
- source_word: τοῦ πλησίον
  choice: ближнему
  rationale: В этическом контексте πλησίον традиционно и ясно передаётся словом «ближний»; греческий родительный обусловлен управлением глагола ἀντιλαμβάνομαι, тогда как по-русски глагол «помочь» требует дательного падежа.
- source_word: κατὰ δύναμίν σου
  choice: по мере своих сил
  rationale: Оборот κατά с винительным обозначает меру или предел. Русское выражение сохраняет мысль о помощи, соразмерной возможностям человека.
- source_word: πρόσεχε σεαυτῷ
  choice: будь осторожен
  rationale: Предупредительная формула призывает заботиться и о собственной безопасности. «Будь осторожен» звучит естественно и не имеет возможного нравоучительного оттенка выражения «следи за собой».
- source_word: μὴ ἐμπέσῃς
  choice: чтобы самому не упасть
  rationale: У ἐμπίπτω буквально значение «впасть, попасть, упасть во что-либо», но дополнение в греческом отсутствует. Перевод сохраняет открытый характер опасности, а «самому» ясно передаёт противопоставление помощи ближнему и риска для помогающего.
theological_decisions:
- issue: Смысл предупреждения μὴ ἐμπέσῃς
  choice: 'Общее предостережение: помогая другому, следует остерегаться, чтобы не пасть самому'
  alternative: Чтобы самому не попасть в беду; чтобы самому не угодить в ловушку
  rationale: Греческий текст не называет конкретной опасности. Поэтому основной текст не ограничивает предупреждение финансовой, нравственной или иной бедой и сохраняет исходную многозначность.
translation_notes:
  register: Современный литературный русский язык; краткая наставительная форма и параллелизм исходного изречения сохранены. Союз «и» передаёт греческое καί без усиления противопоставления, а местоимение «самому» делает естественным по-русски подразумеваемый контраст.
