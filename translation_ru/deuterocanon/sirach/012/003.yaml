  text: No good comes to one who persists in wickedness[b][a], nor to one who does not show mercy.
translation:
  language: ru
  text: Нет добра тому, кто упорствует во зле,[a] и тому, кто не оказывает милосердия.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение, переданное словами «упорствует во зле», неясно; греческий текст поддерживает этот смысл: «тому, кто продолжает делать зло».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально по-еврейски: «не совершил праведности». Здесь «праведность» может означать также благотворительность; греческий текст говорит о милосердии или милостыне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין טוֹבָה
  choice: Нет добра
  rationale: Близко передаёт еврейскую безличную конструкцию «нет добра» и сохраняет её краткость; греческое οὐκ ἔστιν ἀγαθὰ подтверждает основной смысл.
- source_word: לִמְנֹחַ רָשָׁע
  choice: тому, кто упорствует во зле
  rationale: Еврейское выражение в данном месте затруднительно и буквально может быть связано с покоем или пребыванием; греческое τῷ ἐνδελεχίζοντι εἰς κακά ясно поддерживает продолжительное пребывание во зле. Формулировка не скрывает текстологическую трудность, вынесенную в примечание.
- source_word: וְגַם
  choice: и тому
  rationale: Сохраняет добавочное значение еврейского союза и естественно связывает две параллельные конструкции после «нет добра».
- source_word: צְדָקָה
  choice: милостыни
  rationale: Хотя слово может означать «праведность», в позднем еврейском оно также обозначает благотворительность; греческое ἐλεημοσύνην непосредственно поддерживает значение «милостыня». Конкретное существительное точнее сохраняет предмет действия עָשָׂה, чем более широкое «милосердие».
- source_word: לֹא עָשָׂה
  choice: не творит
  rationale: Формально передаёт сочетание «не делает» и по-русски естественно сочетается с «милостыней» в возвышенном, но понятном регистре.
theological_decisions:
- issue: Значение צְדָקָה в данном изречении
  choice: милостыня, благотворительное деяние
  alternative: праведность
  rationale: Еврейское слово допускает оба значения, однако греческий параллельный текст использует ἐλεημοσύνη, то есть милостыню или дело милосердия. Основной текст следует этому контекстуальному свидетельству, а более широкое значение сохраняется в примечании.
- issue: Смысл трудного выражения לִמְנֹחַ רָשָׁע
  choice: упорствовать во зле
  alternative: пребывать в покое как нечестивый / давать покой нечестивому
  rationale: Греческий параллельный текст поддерживает длительное продолжение злых дел. Поскольку форма еврейского текста трудна, неоднозначность отмечена, а не представлена как бесспорная.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим строем. «Творит милостыню» сохраняет достоинство и формальную близость к еврейскому עָשָׂה, оставаясь понятным современному читателю; две реальные неоднозначности документированы в сносках.
