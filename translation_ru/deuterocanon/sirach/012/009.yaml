    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטוֹבַת אִישׁ
  choice: когда человеку хорошо
  rationale: Передаёт благоприятное положение человека естественным современным русским языком и сохраняет противопоставление последующему «когда ему плохо».
- source_word: שׂוֹנֵא
  choice: враг
  rationale: В контексте обозначает враждебно настроенного человека; это естественный эквивалент, согласующийся с греческим ἐχθροί.
- source_word: רֵעַ (первая строка)
  choice: друг
  rationale: Сохраняет прямое лексическое повторение и иронию еврейского изречения; возможный смысл дружелюбного поведения указан в сноске.
- source_word: וּבְרָעָתוֹ
  choice: а когда ему плохо
  rationale: רָעָה здесь означает бедственное, неблагоприятное положение, а не нравственное зло; симметричная формулировка подходит лаконичному афоризму.
- source_word: רֵעַ (вторая строка)
  choice: друг
  rationale: Основное значение слова в данном противопоставлении врагу.
- source_word: בּוֹדֵד
  choice: держится в стороне
  rationale: Естественно выражает намеренное отстранение друга в пору несчастья и соответствует идее отделения, подтверждаемой греческим διαχωρισθήσεται.
