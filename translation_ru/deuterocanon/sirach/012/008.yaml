translation:
  language: ru
  text: Друг не познаётся в благополучии[a], и враг не остаётся скрытым в беде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Любящий [или: друг] не познаётся в благополучии, и ненавидящий [или: враг] не остаётся скрытым в беде». Греческий параллельный текст в первой части отличается и приблизительно читается: «Друг не будет отмщён среди благ». Здесь предпочтён сохранившийся еврейский текст, образующий уравновешенное противопоставление благополучия и беды.'
    reason: textual_variant
lexical_decisions:
- source_word: אוֹהֵב
  choice: друг
  rationale: Причастие обозначает человека, проявляющего любовь и дружбу; в контексте изречения естественное русское соответствие — «друг». Греческое φίλος подтверждает этот смысл.
- source_word: לֹא יִוָּדַע
  choice: не познаётся
  rationale: Нифаль от ידע означает «быть узнанным, обнаружиться». «Не познаётся» сохраняет близость к еврейскому тексту и выражает мысль, что благополучие не выявляет подлинного друга.
- source_word: בַּטּוֹבָה
  choice: в благополучии
  rationale: Буквально «в добре»; здесь речь о благоприятных обстоятельствах. «Благополучие» естественно противопоставляется беде.
- source_word: וְלֹא יְכֻסֶּה
  choice: не скроется
  rationale: Пуаль глагола כסה передаёт пассивное состояние «быть скрытым». Русская возвратная форма естественно выражает, что в беде враждебность становится явной.
- source_word: בְרָעָה
  choice: в беде
  rationale: רעה здесь означает несчастье или тяжёлые обстоятельства, а не нравственное зло. «В беде» ясно и естественно для современного читателя.
- source_word: שׂוֹנֵא
  choice: враг
  rationale: Причастие буквально означает «ненавидящий»; в данном противопоставлении другу естественно переводится как «враг». Греческое ἐχθρός подтверждает это значение.
