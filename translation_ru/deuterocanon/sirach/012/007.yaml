base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/007.yaml
  text: Give to the good[a], and withhold from the evil; honor the poor, and do not give to a stranger.[b]
translation:
  language: ru
  text: Давай доброму, а злому не помогай.[a] Почитай бедного и не давай чужому.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально: «удерживай от злого»; это может означать не оказывать помощи злому человеку либо удерживаться от зла. В греческом параллельном тексте: «не поддерживай грешника».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «постороннему» или «иноземцу». Еврейское слово может обозначать человека вне своего круга или общины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן לַטּוֹב
  choice: Давай доброму
  rationale: Прямо передаёт повеление и сохраняет краткое обозначение человека как «доброго»; личное значение подтверждается греческим τῷ ἀγαθῷ.
- source_word: וּמְנַע מֵרָע
  choice: а от злого удерживай
  rationale: 'Сохраняет формальную и смысловую неоднозначность еврейского текста: речь может идти об удержании помощи от злого человека либо об уклонении от зла. Греческий параллельный текст понимает объект лично: «не поддерживай грешника».'
- source_word: הֹקֵיר מָךְ
  choice: почитай бедного
  rationale: הֹקֵיר выражает почтение или высокую оценку, а מָךְ обозначает бедного, нуждающегося либо человека низкого положения. Выбран ясный и достойный русский эквивалент.
- source_word: וְאַל תִּתֵּן לְזֵר
  choice: и не давай чужому
  rationale: «Чужой» естественно передаёт широкое значение זָר — человека вне своего круга, постороннего или иноземца — без неоправданного сведения смысла к этничности.
theological_decisions:
- issue: Личное или отвлечённое значение מֵרָע
  choice: Сохранено буквальное «от злого», допускающее личный референт.
  alternative: «Не поддерживай грешника» или «удерживайся от зла».
  rationale: Еврейский текст допускает оба оттенка, тогда как греческий параллельный текст явно говорит о грешнике. Основной перевод не устраняет подлинную неоднозначность, а примечание поясняет её.
- issue: Социальный охват слова זָר
  choice: «чужому» без этнического уточнения
  alternative: «постороннему», «иноземцу» или «чужеземцу»
  rationale: Еврейское слово может обозначать любого находящегося вне надлежащего круга; этническое толкование не является обязательным.
translation_notes:
  register: Современный литературный русский язык; краткий афористический строй и параллелизм еврейского текста сохранены. «Давай» выбрано вместо более книжного «дай», поскольку форма выражает общее, повторяющееся правило поведения. «Чужому» сохраняет социальную дистанцию исходного слова, не вводя узкого этнического смысла.
