  text: Do good to the righteous[a], and you will find repayment—if not from him, then from Yahweh.
translation:
  language: ru
  text: 'Делай добро праведнику — и получишь воздаяние: если не от него, то от Господа.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «от Всевышнего»; в еврейском — «от Господа».'
    reason: textual_variant
lexical_decisions:
- source_word: הֵיטִב
  choice: Делай добро
  rationale: Побудительная форма породы hифиль от יטב обозначает деятельное благодеяние другому; выражение естественно по-русски и соответствует греческому εὖ ποίησον.
- source_word: לַצַּדִּיק
  choice: праведнику
  rationale: Передаёт еврейское обозначение нравственно праведного человека и сохраняет форму единственного числа; греческое εὐσεβεῖ имеет близкий смысл «благочестивому».
- source_word: תִּמְצָא תַשְׁלוּמַת
  choice: получишь воздаяние
  rationale: Буквально глагол значит «найдёшь», однако по-русски сочетание «найдёшь воздаяние» неестественно; «получишь» ясно передаёт результат, а «воздаяние» сохраняет смысл ответного возмещения без сведения его только к материальной плате.
- source_word: אִם לֹא מִמֶּנוּ
  choice: если не от него
  rationale: Сохраняет условную конструкцию и мужской род единственного числа, относящийся к праведнику.
- source_word: מֵיְהֹוָה
  choice: от Господа
  rationale: Основной текст следует сохранившемуся еврейскому чтению с именем יהוה; традиционная русская передача «Господь» уместна в современном литературном библейском регистре.
theological_decisions:
- issue: Различие Божьего наименования в еврейском и греческом свидетелях
  choice: от Господа
  alternative: от Всевышнего
  rationale: Приоритет отдан сохранившемуся еврейскому тексту מֵיְהֹוָה; значимое греческое чтение παρὰ Ὑψίστου вынесено в примечание, а не согласовано молча.
- issue: Род и число лица, получающего добро
  choice: от него
  alternative: от этого человека
  rationale: Еврейский суффикс и греческое αὐτοῦ стоят в мужском роде единственного числа и соотносятся с праведником; эта грамматическая конкретность сохранена.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Тире подчёркивает связь поступка и результата, двоеточие вводит уточнение об источнике воздаяния.
