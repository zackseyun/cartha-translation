translation:
  language: ru
  text: Если делаешь добро, знай, кому делаешь добро, и будет надежда на твоё благо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, следуя греческому тексту более прямо: «и за твои добрые дела будет благодарность». Еврейское выражение может также относиться к добру, которое ты делаешь.'
    reason: 'Альтернативное прочтение заключительной фразы: основной текст сохраняет естественное значение еврейского выражения («твоё благо»), а греческая параллель яснее связывает итог с добрыми делами.'
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Сохраняет условное значение частицы, не превращая наставление в утверждение о неизбежном событии.
- source_word: תֵּטִיב
  choice: делаешь добро
  rationale: Передаёт каузативное значение היטיב — делать добро или приносить пользу — и соответствует греческому εὖ ποιῇς.
- source_word: תֵּדַע
  choice: знай
  rationale: В контексте форма имеет побудительный смысл; прямое «знай» также соответствует греческому γνῶθι.
- source_word: לְמִי
  choice: кому
  rationale: Предлог ל обозначает получателя благодеяния; в русском повтор глагола естественно сокращён посредством местоимения «его».
- source_word: וִיהִי
  choice: и будет
  rationale: Передаёт вероятный результативный смысл формы, сохраняя при этом лёгкий оттенок пожелания, возможный в еврейском.
- source_word: תִקְוָה
  choice: надежда
  rationale: Прямое значение существительного — надежда, ожидание или благоприятная перспектива.
- source_word: לְטוֹבָתָךְ
  choice: для твоего доброго дела
  rationale: Формулировка связывает טובה с совершённым благодеянием, как подсказывает греческая параллель, но не уточняет, идёт ли речь о благодарности, воздаянии или ином благом результате.
theological_decisions:
- issue: Смысл заключительного выражения לְטוֹבָתָךְ с учётом греческого καὶ ἔσται χάρις τοῖς ἀγαθοῖς σου
  choice: «будет надежда для твоего доброго дела» — широкая формулировка о благоприятной перспективе, связанной с благодеянием
  alternative: «тебе воздадут благодарностью за твои добрые дела» либо «будет надежда на твоё благополучие»
  rationale: Еврейский текст допускает связь как с благодеянием, так и с благом самого благотворителя; греческий текст яснее говорит о χάρις в отношении добрых дел. Основной текст не сводит смысл ни к материальному воздаянию, ни исключительно к человеческой благодарности, а варианты сохранены в примечании.
translation_notes:
  register: Современный литературный русский язык с краткой наставительной интонацией. Повтор «делаешь добро» во второй части заменён на естественное «его делаешь», без потери референта. Заключительная фраза намеренно несколько необычна, чтобы не устранить смысловую неоднозначность еврейского текста.
