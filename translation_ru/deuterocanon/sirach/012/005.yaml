  source_fidelity: Основной текст верно передаёт предписание не давать пищи и предостережение о том, что полученное может быть обращено против адресата. Трудное כְּלֵי לָחֶם обоснованно сглажено до «хлеба», а условно-предупредительная связь «чтобы ... не» отражает смысл, проясняемый греческим ἵνα μὴ, не выдавая спорную форму לָמָּה за однозначную.
