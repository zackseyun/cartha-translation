  text: Do not give him your bread[b][a], lest by it he set himself against you.
translation:
  language: ru
  text: Не давай ему хлеба[a], чтобы с его помощью он не выступил против тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение буквально можно понять как «сосуды (или предметы) хлеба»; формулировка трудна. Греческий параллельный текст яснее указывает на хлеб или пищу.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы с их помощью он не взял над тобой власть». В греческом параллельном тексте сильнее выражена мысль о господстве над тобой.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּלֵי לָחֶם
  choice: хлеба
  rationale: Еврейское выражение буквально трудно и, по-видимому, означает «сосуды/предметы хлеба». В контексте и с учётом греческого параллельного текста естественнее передать конкретным «хлеб», то есть пищу или пропитание.
- source_word: אַל תִּתֵּן לוֹ
  choice: не давай ему
  rationale: Прямая передача еврейского запрета в естественной современной русской форме.
- source_word: לָמָּה
  choice: чтобы… не
  rationale: 'Обычное значение слова — «почему», однако в данном повреждённом или трудном контексте оно не даёт связного смысла. Греческое ἵνα μὴ подтверждает значение предостережения: «чтобы не».'
- source_word: בָם
  choice: с его помощью
  rationale: В еврейском стоит множественное «ими», согласованное с трудным начальным выражением. Поскольку в русском основном тексте употреблено собирательное «хлеб», местоименная связь естественно передана в единственном числе.
- source_word: יַקְבִּיל אֵלֶיךָ
  choice: выступил против тебя
  rationale: Передаёт вероятный еврейский смысл противостояния или враждебного обращения против адресата, не усиливая его до безусловного «подчинит тебя», как мог бы предполагать греческий текст.
theological_decisions:
- issue: Соотношение трудного еврейского текста и греческого параллельного свидетельства
  choice: Основой оставлен еврейский текст, а греческий использован для прояснения предупредительной конструкции и оттенка враждебного действия.
  alternative: «Не давай ему припасов, иначе с их помощью он возьмёт над тобой власть».
  rationale: Такой выбор сохраняет первенство сохранившегося еврейского свидетельства и его более сдержанный смысл, но учитывает греческий текст там, где еврейская конструкция неясна.
translation_notes:
  register: Современный литературный русский язык, сдержанный и назидательный. Конкретный образ хлеба сохранён; трудность еврейского текста и более сильное чтение греческого вынесены в примечания.
