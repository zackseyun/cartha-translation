  text: Afterward you will understand my words[a], and for my sister you will sigh.
translation:
  language: ru
  text: Впоследствии ты постигнешь мои слова и о моей сестре будешь вздыхать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь труден, особенно выражение «о моей сестре». В греческом тексте вместо этого сказано: «Он пробудет с тобой час, но, если ты уклонишься, не выдержит». По-видимому, греческий текст отражает существенно иной вариант или иное истолкование.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְאָחוֹר
  choice: Впоследствии
  rationale: Передаёт временное значение «позже, после этого», не уточняя, идёт ли речь о слишком позднем осознании или просто о последующем времени.
- source_word: תַּשִּׂיג
  choice: постигнешь
  rationale: Глагол буквально означает «достигать, настигать»; при дополнении «мои слова» русское «постигнешь» естественно выражает достижение понимания и сохраняет образный оттенок исходного слова.
- source_word: אֲמָרַי
  choice: мои слова
  rationale: Прямой и естественный перевод существительного во множественном числе с местоименным суффиксом первого лица.
- source_word: וּלְאַחְוָתִי
  choice: о моей сестре
  rationale: Передаёт наиболее очевидное чтение сохранённой еврейской формы как «моя сестра», а предлог לְ в сочетании с глаголом эмоционального состояния естественно выражен по-русски предлогом «о». Смысл выражения остаётся неясным, поэтому неопределённость отмечена в сноске.
- source_word: תִּתְאַנָּח
  choice: будешь вздыхать
  rationale: Глагол обозначает вздохи или стенания. «Будешь вздыхать» естественно звучит по-русски и не усиливает эмоциональную окраску без достаточных оснований.
theological_decisions:
- issue: Выбор основного текстового свидетеля при значительном расхождении еврейского и греческого текстов
  choice: Основной текст следует сохранившемуся еврейскому свидетельству.
  alternative: 'Перевести по греческому тексту: «Он пробудет с тобой некоторое время, но, если ты уклонишься, не выдержит».'
  rationale: Поскольку еврейский текст Сираха здесь сохранился, он служит первичным основанием перевода. Существенно отличающееся греческое чтение не подменяет его, но приводится в сноске для прозрачности.
- issue: Передача неясного еврейского выражения וּלְאַחְוָתִי
  choice: Сохранить буквальное «о моей сестре» в основном тексте и отметить трудность в сноске.
  alternative: Истолковать выражение как «о моём сродстве», «о товариществе» либо заменить всю строку греческим чтением.
  rationale: Еврейская формулировка семантически трудна. Буквальная передача сохраняет подлинную неоднозначность и не вводит в текст неподтверждённое толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Постигнешь» сохраняет образ достижения понимания, а неясное «о моей сестре» оставлено без догматического или контекстуального сглаживания.
