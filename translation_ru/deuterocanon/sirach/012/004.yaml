  text: Give to the godly, and do not support the sinner.[a]
translation:
  language: ru
  text: В час нужды его постигнет двойное зло; оно настигнет его во всяком благе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст заметно отличается от греческого. Буквально: «двойное зло настигнет в час нужды; во всяком благе оно достигнет его». Дополнение «его» в первой части не выражено, но естественно восстанавливается по второй. Греческий текст: «Дай благочестивому и не поддерживай грешника».'
    reason: Сноска отмечает подразумеваемое дополнение, сохраняет смысловой параллелизм еврейского текста и документирует существенное расхождение с греческой традицией, которой следует английская контрольная версия.
lexical_decisions:
- source_word: פִּי שְׁנַיִם
  choice: двойное
  rationale: Устойчивое сочетание буквально означает «вдвое, в двойной мере»; в связи со словом «зло» естественно передаётся как «двойное зло».
- source_word: רָעָה תַּשִּׂיג
  choice: зло настигнет тебя
  rationale: Рָעָה выступает подлежащим женского рода при תַּשִּׂיג. Объект в еврейском не выражен; «тебя» восстановлено по обращению к читателю и по смыслу контекста.
- source_word: בְּעֵת צֹרֶךְ
  choice: во время нужды
  rationale: צֹרֶךְ обозначает нужду или затруднительное положение; выбран прямой и естественный русский эквивалент.
- source_word: בְּכָל טוֹבָה תַּגִּיעַ אֵלָיו
  choice: а всякое добро ты доставишь ему
  rationale: 'Форма תַּגִּיעַ допускает понимание как 2-го лица мужского рода в каузативном значении: «ты доставишь/доведёшь до него». Предлог בְּ при כָּל может здесь вводить сферу или предмет действия; перевод передаёт вероятный смысл без добавления конкретного вида помощи.'
theological_decisions:
- issue: Расхождение еврейского текста с греческой традицией
  choice: Перевести засвидетельствованный еврейский текст, отметив расхождение в сноске
  alternative: 'Следовать греческому: «Дай благочестивому и не поддерживай грешника»'
  rationale: Задание требует прежде всего опираться на оригинально-языковое свидетельство. Представленный еврейский текст имеет высокую уверенность и подтверждение, поэтому существенное отличие греческой параллели нельзя молча устранить.
- issue: Неявное дополнение при «настигнет»
  choice: Восстановить «тебя» и обозначить это текстологической сноской
  alternative: 'Оставить без объекта: «двойное зло настигнет во время нужды»'
  rationale: Русскому глаголу здесь требуется ясный объект, а контекст наставления естественно указывает на адресата; при этом добавление должно быть прозрачно для читателя.
translation_notes:
  register: Современный литературный русский язык, сжатый наставительный стиль. Синтаксис сохраняет резкость и некоторую смысловую напряжённость еврейского текста; союз «а» естественно связывает противопоставленные последствия, не вводя конфессионального толкования.
