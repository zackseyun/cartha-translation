  text: Do not seat him at your right hand[a], lest he seek your seat.
translation:
  language: ru
  text: Не сажай его по правую руку от себя[a], чтобы он не стал добиваться твоего места.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не сажай его справа от себя, иначе он станет добиваться твоего места». «Место» здесь может означать не только сиденье, но и положение или статус.'
    reason: Лексическая альтернатива и пояснение сохранённой многозначности.
lexical_decisions:
- source_word: אַל תּוֹשִׁיבֵהוּ
  choice: Не сажай его
  rationale: 'Запрет с каузативной формой глагола ישב: не усаживать и не предоставлять место; краткая форма естественна для современного русского языка.'
- source_word: לִימִינֶךָ
  choice: по правую руку от себя
  rationale: Сохраняет конкретный образ близости справа и возможный оттенок почётного, привилегированного положения.
- source_word: לָמָּה
  choice: чтобы … не
  rationale: Буквально форма может означать «зачем?», однако здесь она естественно вводит нежелательное следствие, которого следует избежать. Предупредительная связь передана без искусственного вопроса.
- source_word: יְבַקֵּשׁ
  choice: стал добиваться
  rationale: בקש означает искать, стремиться получить. В сочетании с «местом» русский глагол «добиваться» ясно передаёт притязание, не сводя смысл к буквальному поиску.
- source_word: מוֹשָׁבֶךָ
  choice: твоего места
  rationale: מושב может обозначать сиденье, место или положение. «Место» сохраняет образ рассаживания и одновременно допускает смысл положения или статуса.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и отличающейся греческой параллели
  choice: Перевести непосредственно ясный еврейский текст, сохранив предостережение о предоставлении опасному человеку почётной близости.
  alternative: Следовать более общей греческой формулировке о сближении с грешником и участии в его грехах.
  rationale: Еврейское чтение имеет высокую степень надёжности и является непосредственным источником данного перевода. Приведённая греческая параллель заметно расходится с ним по формулировке, поэтому не должна вытеснять или расширять еврейский текст.
- issue: Конкретное место или общественное положение
  choice: Оставить слово «место», допускающее оба смысла.
  alternative: Передать явно как «положение» или «статус».
  rationale: Еврейское מושב продолжает буквальный образ сидения, но может подразумевать положение человека. Перевод не устраняет эту содержательную двусмысленность.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой мудрого предостережения. Оборот «по правую руку» сохраняет библейский образ, оставаясь понятным современному читателю; местоимение «от себя» устраняет неестественность русского выражения «по твою правую руку».
