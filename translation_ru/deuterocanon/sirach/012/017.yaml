  naturalness: «Таков и тот, кто водится с надменным человеком» — более естественный современный литературный и афористичный русский оборот, чем «Таков тот, кто сходится с дерзким человеком». Образ «валяется в его грехах» намеренно сохраняет буквальную, несколько резкую образность еврейского глагола и понятен в данном контексте.
