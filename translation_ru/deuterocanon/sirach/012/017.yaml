translation:
  language: ru
  text: Таков и тот, кто водится с надменным человеком и валяется в его грехах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое свидетельство здесь существенно отличается: «Если постигнет тебя зло, ты найдёшь его там раньше тебя; и, словно помогая, он подставит тебе подножку». Сохранившийся еврейский текст из Каирской генизы говорит вместо этого о том, кто водится с надменным человеком и валяется в его грехах.'
    reason: alternative_reading
lexical_decisions:
- source_word: כֵּן
  choice: Таков тот
  rationale: Форма вводит сопоставление с предшествующим образом; русский оборот сохраняет краткость и афористичность.
- source_word: חוֹבֵר אֶל
  choice: кто сходится с
  rationale: Причастие от חבר обозначает присоединение или общение. «Сходится с» передаёт устойчивую связь, не утверждая непременно близкой дружбы.
- source_word: אִישׁ זָדוֹן
  choice: с дерзким человеком
  rationale: זָדוֹן обозначает надменную, самонадеянную дерзость, связанную с неправедностью; «дерзкий» сохраняет нравственную окраску без расширения до общего «нечестивый».
- source_word: וּמִתְגֹלֵל
  choice: и валяется
  rationale: Возвратная форма от גלל сохраняет конкретный образ катания или валяния. Необычность метафоры удержана, а более толковательное «погрязает» не внесено в основной текст.
- source_word: בַּעֲוֹנֹתָיו
  choice: в его грехах
  rationale: עון здесь естественно передаётся как «грехи»; местоименный суффикс отнесён к дерзкому человеку, чьи проступки разделяет или в которых оказывается вовлечён связавшийся с ним человек.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и существенно отличающегося греческого свидетельства
  choice: Основной текст переведён по сохранившемуся еврейскому чтению, а греческое чтение приведено в примечании.
  alternative: 'Греческий текст: «Если постигнет тебя зло, ты найдёшь его там прежде себя; и, словно помогая, он подставит тебе подножку».'
  rationale: Еврейское свидетельство здесь имеется и потому служит основой перевода. Греческая строка выражает заметно иной образ и смысловой ход, поэтому различие нельзя скрывать или сводить к стилистическому варианту.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Необычный еврейский образ «валяться в грехах» сохранён намеренно; «сходится с» звучит естественно, но не чрезмерно разговорно.
