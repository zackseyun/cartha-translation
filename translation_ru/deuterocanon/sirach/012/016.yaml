base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/016.yaml
  text: Who will pity a snake charmer who is bitten[b][a], or anyone who goes near a beast of prey?
translation:
  language: ru
  text: Кто пожалеет заклинателя змей, укушенного, или всякого, кто приближается к хищному зверю?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к зверю зуба (или зубов)», то есть к опасному хищному животному.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст здесь существенно отличается: в нём говорится о враге, который сладко говорит устами, но в сердце замышляет низвергнуть тебя в яму; он плачет на глазах, но, найдя удобный случай, не насытится кровью. Поскольку этот стих сохранился на еврейском, основной текст следует еврейскому свидетельству.'
    reason: textual_variant
lexical_decisions:
- source_word: מִי יוּחַן
  choice: Кто пожалеет
  rationale: Риторический вопрос; форма от חנן в данном контексте естественно передаётся глаголом «пожалеть», не устраняя оттенка сострадания или благосклонности.
- source_word: חוֹבֵר
  choice: заклинателя змей
  rationale: חוֹבֵר обозначает заклинателя; упоминание укуса позволяет естественно уточнить подразумеваемый объект — змей.
- source_word: נָשׁוּךְ
  choice: если тот укушен
  rationale: Пассивное причастие описывает пострадавшего заклинателя. Условная конструкция по-русски ясно выражает ситуацию, не превращая её в причинное объяснение.
- source_word: וְכָל הַקָּרֵב
  choice: или всякого, кто приближается
  rationale: Параллельный второй случай в русском риторическом вопросе естественно вводится союзом «или»; настоящее время сохраняет причастный характер действия.
- source_word: אֶל חַיַּת שֵׁן
  choice: к хищному зверю
  rationale: Буквально «к зверю зуба/зубов»; выражение обозначает опасного зверя, способного растерзать добычу. «Хищный зверь» передаёт идиоматический смысл современно и сдержанно.
