  source_fidelity: 'Первая строка передана точно: אַל תַּאֲמִין ... לָעַד — «Не доверяй врагу вовек». Во второй строке сопоставление следует выразить явно: как медь подвергается окислению/коррозии, таково и зло врага. Это соответствует и греческой параллели ὡς ... οὕτως.'
  naturalness: Фраза «его зло, словно медь, покрывается ржавчиной» синтаксически понятна, но «ржавчина» в современном точном употреблении относится прежде всего к железу и стали, а не к меди. «Окисляется» естественно для меди и сохраняет краткий афористический строй.
  terminology: «Враг», «вовек» и «зло» уместны и сохраняют регистр мудростного изречения. «Медь» допустима для נְחֹשֶׁת; замена «ржавеет» на «окисляется» устраняет техническую неточность без смыслового сужения.
