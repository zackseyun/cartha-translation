  text: Не доверяй врагу вовек, ибо как медь окисляется, так и зло его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּאֲמִין בְּשׂוֹנֵא לָעַד
  choice: Не доверяй врагу вовек
  rationale: Передаёт прямой запрет и временное לָעַד («вовек, никогда»), не ослабляя его до совета об осторожности.
- source_word: נְחֹשֶׁת
  choice: медь
  rationale: Основное значение еврейского слова — медь или медный сплав; «медь» здесь естественна по-русски и сохраняет образ коррозии металла.
- source_word: רֹעַ
  choice: зло
  rationale: Сохраняет широкое нравственное значение слова, не сужая его до коварства, злобы или порочности.
- source_word: יַחֲלִיא
  choice: покрывается ржавчиной
  rationale: Контекстуальное значение подтверждается греческой параллелью ἰοῦται («ржавеет, покрывается окисью»). Обычное русское выражение понятно читателю, хотя применительно к меди речь технически идёт о коррозии.
theological_decisions:
- issue: Безусловность предостережения о враге
  choice: Сохранён категорический запрет «не доверяй… вовек».
  alternative: «Не доверяй врагу надолго» или «не доверяй врагу полностью».
  rationale: Такие альтернативы смягчили бы לָעַד и внесли бы отсутствующее в исходном тексте разрешение на ограниченное доверие.
translation_notes:
  register: 'Краткая афористическая фраза в современном литературном русском. Синтаксис слегка распрямлён: сравнительный образ отнесён непосредственно к «его злу», как позволяет еврейская строка и подтверждает греческая параллель. Слово «вовек» сохраняет достоинство мудростной речи, оставаясь общеупотребительным.'
