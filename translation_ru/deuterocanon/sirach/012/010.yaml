    rationale: Медь не ржавеет в обычном русском смысле; она окисляется и покрывается патиной. В данном сравнении лучше сохранить металл и передать процесс нейтральным «окисляется». Кроме того, явная конструкция «как..., так и...» точнее отражает греческое ὡς... οὕτως и вероятный смысл еврейской строки.
