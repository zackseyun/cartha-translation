- from: Даже если он послушает тебя и будет вести себя смирно, настрой своё сердце бояться его.[a]
  to: Даже если он прислушается к тебе и будет вести себя тихо, всё же храни в сердце страх перед ним.[a]
  rationale: Правка устраняет неестественную кальку, сохраняет образ сердца и прямое значение «бояться», а также выбирает для внешнего поведения человека нейтральное «вести себя тихо». Сноска передаёт греческий смысл естественным русским языком, не внося его развёрнутую охранительную лексику в основной текст.
