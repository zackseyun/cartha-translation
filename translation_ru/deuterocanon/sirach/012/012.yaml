base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/012/012.yaml
  text: Be to him like one who reveals a secret[a], and he will not find a way to ruin you[b]; and know the outcome of jealousy.
translation:
  language: ru
  text: Обращайся с ним как с тем, кто разглашает тайну[a], и он не найдёт возможности погубить тебя; и знай, к чему приводит зависть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как с тем, кто раскрывает тайну». Смысл образа, вероятно, в том, чтобы держаться с таким человеком настороже, как с тем, кто выдаёт доверенное.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и знай, чем кончается ревность». Еврейское выражение буквально означает «знай конец зависти (или ревности)». Греческая версия здесь содержит более пространное предупреждение о том, что враг может занять твоё место.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֱיֵה לוֹ
  choice: Будь с ним
  rationale: Императив היה с ל обозначает образ поведения или отношение к человеку. «Будь с ним» естественно по-русски и сохраняет прямую форму еврейского наставления.
- source_word: כִּמְגַלֶּה רָז
  choice: как с тем, кто разглашает тайну
  rationale: Причастие מגלה означает «открывающий, разглашающий», а רז — «тайна». Предлог «с» перед сравнительным оборотом ясно передаёт подразумеваемое осторожное обращение с таким человеком, не устраняя образ исходного текста.
- source_word: וְלֹא יִמְצָא לְהַשְׁחִיתְךָ
  choice: и он не найдёт возможности погубить тебя
  rationale: 'Буквально: «и не найдёт погубить тебя». Добавление «возможности» делает конструкцию естественной по-русски. «Погубить» передаёт широкий разрушительный смысл Hiphil от שחת, не ограничивая его физическим убийством.'
- source_word: וְדַע אַחֲרִית
  choice: и знай, к чему приводит
  rationale: ודע — прямой императив «знай». אחרית означает «конец, исход, итог»; оборот «к чему приводит» естественно выражает итоговое последствие, подразумеваемое еврейской фразой.
- source_word: קִנְאָה
  choice: зависть
  rationale: קנאה может означать зависть, ревность или рвение. В контексте враждебного намерения «зависть» наиболее естественна, при сохранении варианта «ревность» в примечании.
theological_decisions:
- issue: Краткое еврейское чтение и значительно более развёрнутый греческий параллельный текст
  choice: Перевести сохранившийся еврейский текст как основной
  alternative: 'Следовать греческому предупреждению: не ставить врага рядом и не сажать по правую руку, чтобы он не занял твоё место'
  rationale: При наличии еврейского свидетельства оно имеет приоритет. Греческая версия подтверждает общий смысл предостережения, но содержит иной, расширенный текст, который нельзя незаметно вносить в основной перевод.
- issue: Значение קִנְאָה
  choice: зависть
  alternative: ревность
  rationale: Оба значения лексически возможны. Контекст злонамеренного соперничества поддерживает «зависть», однако неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичной, назидательной интонацией. Синтаксис сохраняет последовательность еврейских императивов и образность, но устраняет неестественную для русского конструкцию инфинитива после «найти».
