  text: Do not set him beside you[a], lest he push you aside and stand in your place.
translation:
  language: ru
  text: Не ставь его рядом с собой[a], иначе он оттеснит тебя и встанет на твоё место.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Кто пожалеет заклинателя змей, укушенного змеёй, и всех, кто приближается к диким зверям?» В этом месте греческое свидетельство содержит существенно иное чтение.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּעֲמִידֵהוּ
  choice: Не ставь его
  rationale: Глагол עמד в породе hифиль означает «поставить, заставить стоять». Русское «не ставь его» точно и естественно передаёт запрет без лишнего уточнения.
- source_word: אֶצְלֶךָ
  choice: рядом с собой
  rationale: Предлог אצל обозначает близость; выражение сохраняет пространственный образ и допускает подразумеваемую близость положения или доверия.
- source_word: לָמָּה
  choice: иначе
  rationale: Формально слово обычно означает «зачем?» или «почему?», но здесь в контексте предостережения вводит нежелательное последствие. «Иначе» естественно передаёт эту функцию, не усложняя русскую фразу.
- source_word: יֶהְדָּפְךָ
  choice: он оттеснит тебя
  rationale: הדף означает толкнуть, оттеснить или вытеснить. «Оттеснит» сохраняет образ физического смещения и его переносный смысл.
- source_word: וְיַעֲמֹד תַּחְתֶּיךָ
  choice: и встанет на твоё место
  rationale: עמד буквально означает «встать, стоять», а תחת может обозначать положение под кем-либо или замещение. Русское «встанет на твоё место» сохраняет глагольный образ и ясно выражает вытеснение.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающимся греческим чтением
  choice: Основной текст переведён по еврейскому свидетельству Каирской генизы.
  alternative: Принять греческое чтение о заклинателе змей и приближающихся к диким зверям как основной текст.
  rationale: Для книги Сираха сохранившийся еврейский текст имеет приоритет. Греческое свидетельство здесь отражает существенно иную текстовую традицию, поэтому оно приведено в примечании, а не смешано с основным текстом.
translation_notes:
  register: Современный литературный русский язык; краткое и достойное по тону предостережение. Сохранены пространственные образы близости, оттеснения и занятия чужого места.
