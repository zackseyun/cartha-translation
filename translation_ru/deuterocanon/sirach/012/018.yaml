translation:
  language: ru
  text: Он не пройдёт мимо, пока в нём не разгорится огонь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Он покачает головой, всплеснёт руками, будет много шептаться и изменится в лице». Это более пространное чтение, вероятно, истолковывает враждебное поведение, которое в еврейском тексте описано кратко.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יַעֲבֹר
  choice: он не пройдёт мимо
  rationale: Глагол עבר обычно означает «проходить, проходить мимо». Перевод сохраняет еврейский образ и подразумеваемое упорство действующего лица, не заменяя его более толковательным «не отступит».
- source_word: עַד
  choice: пока не
  rationale: 'В отрицательной конструкции естественно обозначает предел действия: «не… пока не…».'
- source_word: תִּבְעַר
  choice: не разгорится
  rationale: 'Форма согласуется с существительным אֵשׁ женского рода, которое естественно понимать как подлежащее: огонь горит или разгорается. Такой перевод точнее, чем причинное «он разожжёт», для которого данная форма не даёт достаточного основания.'
- source_word: בּוֹ
  choice: в нём
  rationale: Предлог с местоименным суффиксом буквально означает «в нём». Референт местоимения в кратком еврейском тексте остаётся не вполне ясным, поэтому двусмысленность сохранена.
- source_word: אֵשׁ
  choice: огонь
  rationale: Существительное передано без неопределённого артикля, которого в русском нет; оно служит подлежащим при глаголе «разгорится».
theological_decisions:
- issue: Расхождение между кратким еврейским текстом и значительно более пространным греческим параллельным чтением
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству, а греческое чтение приведено в сноске.
  alternative: «Он покачает головой, всплеснёт руками, будет много шептаться и изменится в лице».
  rationale: При наличии еврейского текста ему отдаётся первенство. Греческое чтение существенно отличается и, возможно, отражает иной Vorlage или истолковывающее расширение, поэтому оно не должно молча подменять еврейский текст, но важно для текстовой прозрачности.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формулировкой. Сохранена образность и некоторая неясность еврейского текста; сноска документирует существенно отличающееся греческое чтение.
