translation:
  language: ru
  text: Ведь и Бог ненавидит творящих зло и воздаст нечестивым возмездием.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «Бог ненавидит творящих зло»; в греческом: «Всевышний возненавидел грешников». Во второй части греческое слово можно также перевести как «безбожным».'
    reason: Текстовые и лексические различия между еврейским и греческим свидетельствами.
lexical_decisions:
- source_word: אֵל
  choice: Бог
  rationale: Прямо передаёт основной еврейский текст; греческое «Всевышний» отмечено в сноске.
- source_word: שֹׂנֵא
  choice: ненавидит
  rationale: Сохраняет сильное и прямое значение еврейского причастия и соответствует греческому ἐμίσησεν; настоящее время выражает постоянную характеристику.
- source_word: רָעִים
  choice: творящих зло
  rationale: Передаёт активный нравственный смысл «злые, делающие зло» и отличает эту группу от רְשָׁעִים во второй части стиха.
- source_word: לָרְשָׁעִים
  choice: нечестивым
  rationale: Естественно передаёт еврейское «нечестивые, виновные» и учитывает оттенок греческого ἀσεβέσιν — «нечестивым, безбожным».
- source_word: יָשִׁיב
  choice: воздаст
  rationale: Передаёт смысл ответного воздаяния и хорошо сочетается с судебно-нравственным контекстом.
- source_word: נָקָם
  choice: отмщением
  rationale: Сохраняет сильный смысл кары и мстительного воздаяния, не ослабляя его до общего «наказания».
theological_decisions:
- issue: Различие в Божественном наименовании между еврейским и греческим текстами
  choice: Бог
  alternative: Всевышний
  rationale: Основной перевод следует высоконадёжному еврейскому свидетельству אֵל, а греческий вариант ὁ ὕψιστος прозрачно отмечается в сноске.
- issue: Сильное высказывание о Божьей ненависти
  choice: ненавидит
  alternative: отвергает
  rationale: Смягчение устранило бы подлинное богословское напряжение текста; и еврейский, и греческий источники употребляют прямой глагол ненависти.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Ведь и» естественно передаёт כִּי גַם; «воздаст… отмщением» сохраняет параллелизм и суровую тональность оригинала.
