translation_notes:
  register: Современный литературный русский язык с краткой, афористичной формой наставления. Слово «совет» сохраняет традиционный регистр литературы мудрости; «не досадуй» передаёт эмоциональную широту еврейского глагола без чрезмерно конкретного толкования как раскаяния.
