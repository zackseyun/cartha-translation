  source_fidelity: 'Перевод точно передаёт еврейское наставление: בלא עצה — «без совета», אל תפעל דבר — «ничего не делай», ואחר מעשיך — «после своих поступков», אל תתקצף — «не досадуй». «Не досадуй» сохраняет возможный диапазон глагола (досада, раздражение, гнев) и не навязывает более узкое «раскаивайся».'
