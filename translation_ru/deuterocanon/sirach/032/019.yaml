translation:
  language: ru
  text: Ничего не делай без совета, и после своих поступков не досадуй[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не раздражайся», «не гневайся». Еврейский глагол может обозначать досаду или гнев после совершённого; в данном контексте возможен и оттенок сожаления о своём поступке.'
    reason: lexical_alternative
  - marker: b
    text: Сохранившийся греческий текст этого стиха не соответствует данной еврейской формулировке, поэтому перевод следует сохранившемуся еврейскому свидетельству.
    reason: textual_variant
lexical_decisions:
- source_word: בלא עצה
  choice: без совета
  rationale: Оборот означает действие без совета или предварительного обдумывания. «Без совета» сохраняет характерную для литературы мудрости формулировку и допускает оба оттенка.
- source_word: אל תפעל דבר
  choice: ничего не делай
  rationale: В отрицательном повелении דבר имеет обобщающее значение «что-либо»; по-русски весь оборот естественно передаётся как «ничего не делай».
- source_word: ואחר מעשיך
  choice: и после своих поступков
  rationale: Перевод сохраняет буквальную временную последовательность и множественное число מעשיך — сначала поступки, затем последующая внутренняя реакция.
- source_word: אל תתקצף
  choice: не досадуй
  rationale: Возвратная форма от קצף обозначает состояние гнева, раздражения или досады. «Не досадуй» естественно звучит в русском наставлении и не сужает смысл исключительно до сожаления.
