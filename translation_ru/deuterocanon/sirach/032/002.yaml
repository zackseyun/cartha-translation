translation:
  language: ru
  text: чтобы ты радовался их почёту[a] и получил награду за наставление[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также перевод: «чести, оказанной им». Еврейское выражение допускает оба смысловых оттенка.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово מוסר может также означать «воспитание», «дисциплина» или «добрый порядок». Греческий параллельный текст здесь читается совсем иначе: «Кто внимает заповедям, тот приносит мирную жертву». Основной текст следует сохранившемуся еврейскому свидетельству.'
    reason: alternative_reading
lexical_decisions:
- source_word: למען
  choice: чтобы
  rationale: Естественно передаёт целевое или результативное значение союза, не устраняя возможного смыслового оттенка результата.
- source_word: תשמח
  choice: ты радовался
  rationale: Глагол שמח означает радость и ликование; «радовался» звучит современно и сохраняет возвышенный тон.
- source_word: בכבודם
  choice: их почёту
  rationale: 'Передаёт כבוד как «почёт, честь» и сохраняет некоторую неопределённость: речь может идти как об их чести, так и о почёте, оказанном им.'
- source_word: ועל
  choice: и … за
  rationale: В сочетании со второй частью фразы обозначает основание, за которое человек получает награду; по-русски это естественно выражается предлогом «за».
- source_word: מוסר
  choice: наставление
  rationale: מוסר может означать наставление, воспитание, дисциплину или исправление. «Наставление» уместно в контексте литературы мудрости и не привносит исключительно карательного смысла.
- source_word: תשא
  choice: получил
  rationale: Хотя נשא буквально означает «нести, поднимать», в сочетании с שכר речь идиоматически идёт о получении награды.
- source_word: שכר
  choice: награду
  rationale: שכר обозначает воздаяние, плату или награду; здесь «награда» лучше соответствует этико-назидательному контексту, чем коммерчески окрашенная «плата».
theological_decisions:
- issue: Выбор основного текстового свидетельства при существенном расхождении еврейского и греческого текстов
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству и оставлен в контексте наставления о пире.
  alternative: 'Перевод по греческому параллельному тексту: «Кто внимает заповедям, тот приносит мирную жертву».'
  rationale: При наличии еврейского текста Сираха он служит первичным источником. Греческое чтение существенно отличается и потому приводится в сноске, а не используется для гармонизации основного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. Синтаксис прост и понятен; лексическая и текстологическая неоднозначность не скрыта, а обозначена в сносках.
