translation:
  language: ru
  text: Кто стремится к тому, что угодно Богу, примет наставление[a], и Бог ответит ему в его молитве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции: «Не предлагай даров, потому что Он их не примет». Сохранившийся еврейский текст здесь существенно отличается от греческого.'
