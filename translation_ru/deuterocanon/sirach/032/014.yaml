lexical_decisions:
- source_word: דורש חפצי אל
  choice: кто ищет того, что угодно Богу
  rationale: Причастие דורש передаёт постоянное, характерное стремление, а сжатое сочетание חפצי אל — то, что угодно Богу, Его волю и благоволение, без излишнего догматического уточнения.
- source_word: יקח לקח
  choice: примет наставление
  rationale: Буквально «возьмёт учение/наставление»; русское «примет наставление» естественно передаёт готовность усвоить мудрое поучение.
- source_word: ומשחרהו
  choice: а кто с раннего утра ищет Его
  rationale: Глагол שחר может обозначать раннее и вместе с тем усердное искание. Формулировка сохраняет временной образ, не сводя его только к отвлечённому усердию; местоименный суффикс отнесён к Богу.
- source_word: ישיג מענה / ויענהו בתפלתו
  choice: получит ответ в своей молитве
  rationale: Формулировка объединяет засвидетельствованные еврейские выражения об обретении ответа и ответе в молитве, сохраняя молитву как сферу ответа и не усиливая причинное значение предлога.
- source_word: μὴ δωροκόπει, οὐ γὰρ προσδέξεται
  choice: не принято в основном тексте
  rationale: Греческая традиция существенно расходится с сохранившимся еврейским свидетельством. Поскольку еврейский текст здесь доступен, он положен в основу, а греческий вариант вынесен в примечание.
theological_decisions:
- issue: Существенное расхождение еврейской и греческой текстовых традиций
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; греческое чтение приведено в сноске.
  alternative: 'Перевести по-гречески: «Не предлагай даров, потому что Он их не примет».'
  rationale: Еврейский текст имеет приоритет там, где он сохранился, однако греческий вариант полностью меняет содержание стиха и потому должен быть открыт читателю.
- issue: Характер ответа на молитву
  choice: «получит ответ в своей молитве»
  alternative: «Бог ответит на его молитву»
  rationale: Выбранный вариант не уточняет сверх текста ни непосредственного субъекта ответа, ни точного отношения предлога בת к молитве, сохраняя смысловую напряжённость еврейских формулировок.
translation_notes:
  register: Современный литературный русский язык с ясным синтаксисом и умеренно возвышенным тоном литературы мудрости. Образ раннего искания сохранён буквально, но естественно; богословские уточнения, отсутствующие в еврейском тексте, не добавлены.
