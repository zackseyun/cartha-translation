translation:
  language: ru
  text: Молния появляется перед градом, а благоволение — перед смиренным[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В представленном греческом свидетельстве этот стих звучит иначе: «Жертва праведного угодна, и память о ней не будет забыта». Вероятно, это отражает иную текстовую традицию или расхождение в нумерации стихов.'
    reason: textual_variant
  - marker: b
    text: 'Или: «униженным», «сокрушённым». Еврейское слово может обозначать как смиренного, так и того, кто унижен или сокрушён.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: предшествует / смиренному
  rationale: В первом полустишии временная последовательность естественно передана глаголом «предшествует»; во втором форма «смиренному» сохраняет конструкцию «перед / в присутствии» без тяжеловесного буквального повтора.
- source_word: בָרָד
  choice: град
  rationale: Обычное значение еврейского существительного; соответствует метеорологическому образу.
- source_word: יִנְצַח
  choice: предшествует
  rationale: Глагол в данном контексте труден и может означать выступление вперед, первенство или явление прежде чего-либо. В сочетании с לִפְנֵי и образом молнии перед градом значение предшествования наиболее связно; во втором полустишии оно выражено параллельной эллиптической конструкцией.
- source_word: בָּרָק
  choice: молния
  rationale: Прямое и естественное значение слова, образующее метеорологическую пару с градом.
- source_word: דַכָּא
  choice: смиренный
  rationale: Слово может обозначать смиренного, униженного или сокрушённого. В контексте изречения о благоволении «смиренный» естественно передаёт вероятный нравственный смысл, тогда как альтернативы отмечены в сноске.
- source_word: חֵן
  choice: благоволение
  rationale: В литературном русском языке передаёт расположение и благосклонное принятие, обычные для חֵן в контексте мудрости; при этом не сводит слово к внешнему обаянию.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и расходящимся с ним греческим свидетельством
  choice: Основной текст переведён по еврейскому изречению о молнии, граде, смиренном и благоволении.
  alternative: 'Греческое чтение: «Жертва праведного угодна, и память о ней не будет забыта».'
  rationale: Для Книги Премудрости Иисуса, сына Сирахова, сохранившийся еврейский текст имеет приоритет. Греческая строка здесь отражает иную текстовую традицию либо иную нумерацию стихов и поэтому приведена в текстологической сноске.
translation_notes:
  register: Краткое двучленное изречение передано современным литературным русским языком. Эллипсис во второй части сохраняет афористическую сжатость и параллелизм еврейского текста; «благоволение» поддерживает достойный сапиенциальный регистр.
