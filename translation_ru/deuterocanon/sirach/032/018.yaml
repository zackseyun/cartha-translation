translation:
  language: ru
  text: Мудрый человек не берёт взяток, а надменный насмешник[a] не соблюдает закона[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское זד ולץ буквально содержит два обозначения, соединённые союзом «и»: «надменный (человек) и насмешник». Оно может обозначать двух лиц или передавать составную характеристику одного человека.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «наставления». Еврейское תורה может означать не только закон, но и авторитетное учение или наставление.'
    reason: lexical_alternative
  - marker: c
    text: Греческий текст, указанный как параллель к этому стиху, содержит другую строку — о слезах вдовы — и не соответствует сохранившемуся еврейскому тексту; перевод здесь следует прежде всего еврейскому свидетельству.
    reason: textual_variant
lexical_decisions:
- source_word: איש חכם
  choice: мудрый человек
  rationale: Передаёт явно выраженное единственное число и мужскую форму еврейского сочетания, сохраняя при этом общеобобщающий характер изречения.
- source_word: לא יקח
  choice: не берёт
  rationale: Форма yiqtol в изречении о мудрости выражает характерное, обычное поведение; русское настоящее время естественно передаёт эту обобщённость.
- source_word: שחד
  choice: взяток
  rationale: Обычное и точное современное соответствие слову со значением подкупа; множественное число после отрицания идиоматично по-русски и не меняет смысла.
- source_word: זד ולץ
  choice: надменный насмешник
  rationale: Сочетание передано как двойная характеристика одного типа человека, что согласуется с глаголом в единственном числе. Возможность понимать слова как два обозначения сохранена в примечании.
- source_word: לא ישמור
  choice: не соблюдает
  rationale: Глагол שמר при תורה означает следовать предписаниям, соблюдать их; настоящее время поддерживает форму общего нравственного положения.
- source_word: תורה
  choice: закона
  rationale: В данном этическом противопоставлении слово обозначает авторитетное нравственное установление. Более широкое значение «наставление» отмечено в примечании.
theological_decisions:
- issue: Значение תורה в контексте книги Премудрости
  choice: закон
  alternative: наставление; учение
  rationale: «Закон» ясно передаёт обязательную силу תורה, не исключая более широкого смысла авторитетного наставления, который указан в примечании.
- issue: Относится ли זד ולץ к одному человеку или к двум типам людей
  choice: 'единая характеристика: «надменный насмешник»'
  alternative: «наглец и насмешник»
  rationale: Глагол לא ישמור стоит в единственном числе и допускает понимание пары слов как составной характеристики одного человека; синтаксическая неоднозначность не устраняется и отмечена в примечании.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной формой изречения. Настоящее время передаёт постоянную нравственную характеристику. Лексика ясная и достойная, без конфессионально окрашенных уточнений.
