  yaml_path: translation/deuterocanon/sirach/032/026.yaml
  text: Mercy is beautiful in the time of his distress[b][a], like rain clouds in a time without rain.
translation:
  language: ru
  text: Прекрасно милосердие во время бедствия человека[b][a], словно дождевые облака во время бездождья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Уместно милосердие во время бедствия». Прилагательное может подчёркивать красоту, приятность или уместность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по-гречески: «его бедствия»; местоимение мужского рода единственного числа употреблено здесь в обобщённом наставлении мудрости. В переводе его обобщённый смысл передан словом «человека».'
    reason: cultural_note
lexical_decisions:
- source_word: ὡραῖον
  choice: прекрасно
  rationale: Сохраняет основное значение красоты и привлекательности, при этом контекст допускает оттенок уместности; он отмечен в сноске.
- source_word: ἔλεος
  choice: милосердие
  rationale: Прямо передаёт сострадательное отношение и помощь нуждающемуся, сохраняя весомость греческого слова.
- source_word: ἐν καιρῷ
  choice: в пору
  rationale: Передаёт значимое или подходящее время и позволяет естественно сохранить повтор выражения в обеих частях стиха.
- source_word: θλίψεως
  choice: бедствия
  rationale: Охватывает тяготу, притеснение и тяжёлые обстоятельства без узкого специального оттенка.
- source_word: αὐτοῦ
  choice: его
  rationale: Сохраняет мужское единственное местоимение греческого текста, употреблённое в обобщённом наставлении мудрости.
- source_word: νεφέλαι ὑετοῦ
  choice: дождевые облака
  rationale: Естественно и ясно передаёт образ облаков, несущих дождь.
- source_word: ἀβροχίας
  choice: бездождья
  rationale: Точно обозначает отсутствие дождя и сохраняет связь с повторным указанием времени; слово «засуха» было бы несколько более интерпретирующим.
theological_decisions:
- issue: Обобщённое мужское местоимение αὐτοῦ в наставлении мудрости
  choice: В основном тексте сохранено «его»
  alternative: «человека» или безличная перестройка
  rationale: Греческий текст содержит местоимение мужского рода единственного числа в обобщённом смысле; его сохранение не снимает подлинную грамматическую особенность источника.
translation_notes:
  register: Современный литературный русский язык с краткой, образной и достойной формулировкой. Инверсия «Прекрасно милосердие» сохраняет афористичность греческой фразы; «в пору» естественно воспроизводит параллельное ἐν καιρῷ.
