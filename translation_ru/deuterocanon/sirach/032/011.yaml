lexical_decisions:
- source_word: בעת מפקד
  choice: когда придёт время уходить
  rationale: מפקד здесь по контексту застолья обозначает назначенный момент ухода или отпуска; передаётся естественной современной фразой без излишней конкретизации.
- source_word: אל תתאחר
  choice: не задерживайся
  rationale: Прямо передаёт запрет медлить или оставаться дольше положенного.
- source_word: פטר לביתך
  choice: отправляйся домой
  rationale: Императив פטר в данном контексте означает удалиться, отбыть; русский глагол естественно передаёт движение к дому.
- source_word: ושלם רצון
  choice: и исполни своё желание
  rationale: Сохраняет связь שלם с исполнением/осуществлением и неоднозначность רצון как желания или воли, не подменяя её более вольным «делай, что тебе нравится».
