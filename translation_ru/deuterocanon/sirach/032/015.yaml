    reason: textual_variant
lexical_decisions:
- source_word: דורש
  choice: ищет
  rationale: Причастие от דרש передаёт деятельное искание и стремление; «ищет» естественно звучит по-русски и не сужает смысл до формального изучения.
- source_word: תורה
  choice: Закон
  rationale: В контексте Бен-Сиры תורה обозначает авторитетное Божье наставление и может указывать на Тору; «Закон» сохраняет этот религиозный вес.
- source_word: יפיקנה
  choice: постигнет его
  rationale: Форма от הפיק здесь означает достижение или обретение искомого. «Постигнет» естественно передаёт успешное усвоение Закона в контексте литературы мудрости, хотя буквально возможно «обретёт».
- source_word: ומתלהלה
  choice: притворщик
  rationale: Трудное слово, вероятно, характеризует неискреннего человека, который разыгрывает роль или обманывает себя. Краткое «притворщик» сохраняет противопоставление искреннему искателю, а неопределённость отмечена в сноске.
- source_word: יוקש
  choice: попадётся в ловушку
  rationale: Пассивное значение корня — быть пойманным или угодить в западню. Образ ловушки передан явно и естественно.
- source_word: בו
  choice: в его же ловушку
  rationale: 'Местоименный суффикс соотнесён с ближайшим предшествующим תורה: неискренний человек оказывается уловлен тем самым Законом. Частица «же» подчёркивает антитезу, не устраняя грамматическую неоднозначность полностью.'
theological_decisions:
- issue: Передавать תורה широко как «наставление» или конкретнее как «Закон»
  choice: Закон
  alternative: наставление; учение
  rationale: Еврейский текст является первичным свидетельством, а в иудейской литературе мудрости תורה правдоподобно обозначает Тору как Божий Закон, а не просто общий совет.
- issue: Толкование трудного ומתלהלה при резко отличающемся греческом чтении
  choice: притворщик
  alternative: тот, кто обманывает себя; легкомысленный человек
  rationale: Перевод передаёт вероятную неискренность, но не превращает её в высокомерие, для которого здесь нет надёжного основания. Лексическая неопределённость сохранена в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством, присущим книге Премудрости. Синтаксис краткий и афористичный. Заглавная буква в слове «Закон» указывает на Тору как авторитетное Божье наставление. Маркеры сносок расположены после первой смысловой части; порядок [a][b] соответствует последовательности: сначала лексическая трудность основного еврейского текста, затем крупное текстовое расхождение.'
