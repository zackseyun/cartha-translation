translation:
  language: ru
  text: пока Он не рассудит дело Своего народа и не обрадует их Своей милостью[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока Он не вынесет решение по делу Своего народа»; возможно также: «пока Он не совершит правосудие ради Своего народа». Греческое выражение буквально повторяет однокоренные слова и может быть судебной идиомой, означающей вынесение решения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως
  choice: пока не
  rationale: В сочетании с последующими глаголами передаёт временной предел предшествующего действия; эта конструкция естественна для современного русского языка.
- source_word: κρίνῃ τὴν κρίσιν
  choice: рассудит дело
  rationale: Передаёт формально повторную греческую судебную формулу естественным русским оборотом, не уточняя без необходимости, идёт ли речь только о решении дела или также о восстановлении справедливости.
- source_word: τοῦ λαοῦ αὐτοῦ
  choice: Своего народа
  rationale: Возвратное притяжательное местоимение естественно соотносит народ с действующим субъектом; родительный падеж сохраняет возможность понимать дело как относящееся к народу, а не обязательно как суд над ним или решение в его пользу.
- source_word: εὐφράνει
  choice: обрадует
  rationale: 'Сохраняет переходное каузативное значение: Он доставит им радость.'
- source_word: ἐν τῷ ἐλέει αὐτοῦ
  choice: Своей милостью
  rationale: Творительный падеж естественно выражает средство, которым Он их обрадует, и точно передаёт ἐν в инструментальном значении.
theological_decisions:
- issue: Смысл судебной формулы κρίνῃ τὴν κρίσιν
  choice: рассудит дело Своего народа
  alternative: вынесет решение по делу Своего народа; совершит правосудие ради Своего народа
  rationale: Греческая формула допускает акцент на рассмотрении дела, вынесении решения либо правосудии в пользу народа. Основной текст сохраняет эту смысловую открытость, а более определённые варианты приведены в примечании.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Заглавные буквы в местоимениях «Он», «Своего», «Своей» указывают на Бога согласно принятой русской библейской традиции; синтаксис сохраняет фрагментарную связь стиха с предшествующим контекстом.
