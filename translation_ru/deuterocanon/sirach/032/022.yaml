base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/022.yaml
  text: Do not trust in the way of the wicked[a], and be careful in your paths. In all your ways guard yourself, for everyone who does these things keeps the commandment.
translation:
  language: ru
  text: Не полагайся на путь нечестивых и будь осторожен на своих путях.[a] На всех своих путях береги себя, ибо всякий, кто поступает так, соблюдает заповедь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В представленном еврейском издании эта строка стоит перед обозначением стиха 22 и может относиться к соседнему стиху. Греческий текст для Сир 32:22 ей не соответствует. Поэтому строка сохранена по последовательности еврейского текста, но её принадлежность к этому стиху текстологически не вполне определённа.
    reason: textual_variant
lexical_decisions:
- source_word: אל תבטח בדרך רשעים
  choice: Не полагайся на путь нечестивых
  rationale: Сохраняет метафору жизненного пути и предостережение еврейского текста; «полагаться» естественно передаёт בטח в данном контексте.
- source_word: ובארחותיך הזהר
  choice: и будь осмотрителен на своих стезях
  rationale: זהר выражает осторожность и бдительность; «стези» сохраняет параллелизм с «путём» и соответствует возвышенному, но понятному регистру книги Премудрости.
- source_word: בכל דרכיך
  choice: На всех своих путях
  rationale: Сохраняет еврейскую метафору путей как образа образа жизни и поступков.
- source_word: שמור נפשך
  choice: береги себя
  rationale: נפש здесь обозначает самого человека или его жизнь, а не отвлечённую «душу»; русское выражение передаёт практическое предостережение.
- source_word: כי
  choice: ведь
  rationale: Вводит основание для наставления и естественно связывает части изречения в современном русском языке.
- source_word: כל עושה אלה
  choice: всякий, кто поступает так
  rationale: Передаёт обобщающий смысл причастной конструкции; «так» естественнее буквального «делает это» и соотносится с предшествующими наставлениями.
- source_word: שומר מצוה
  choice: соблюдает заповедь
  rationale: Сохраняет единственное число מצוה и обычный библейский смысл глагола שמר применительно к заповеди, не уточняя сверх текста, идёт ли речь о конкретной заповеди или о Божьем наставлении в целом.
theological_decisions:
- issue: Объём значения מצוה в контексте литературы Премудрости
  choice: заповедь
  alternative: одну заповедь; предписание Закона
  rationale: В еврейском тексте стоит единственное число без явного упоминания Закона. Перевод сохраняет эту форму и не вводит более узкое богословское толкование.
- issue: Соотношение самосохранения и соблюдения заповеди
  choice: Сохранена причинная связь без дополнительного истолкования
  alternative: Пояснить, что осторожность сама является исполнением Закона
  rationale: Текст связывает наставление с соблюдением заповеди, но не раскрывает точный характер этой связи; перевод сохраняет богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой, подходящей для книги Премудрости. Синтаксис сделан ясным для обычного читателя; метафоры пути, стезей и соблюдения заповеди сохранены.
