translation:
  language: ru
  text: Говори кратко[a], даже если знаешь много, и будь подобен тому, кто знает и молчит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь весьма сжат и, возможно, эллиптичен: буквально — нечто вроде «[всё/кратко] сказать, и мало — много». Перевод передаёт вероятный смысл: говорить сдержанно, даже обладая большими знаниями. Греческий параллельный текст для этого стиха не соответствует данной еврейской строке, поэтому здесь основным источником служит еврейский текст.'
    reason: textual_variant
lexical_decisions:
- source_word: כל לאמר ומעט הרבה
  choice: Говори кратко, даже если знаешь много
  rationale: 'Еврейский текст сжат и, по-видимому, эллиптичен. Перевод передаёт вероятное наставление: при обширном знании говорить немного и сдержанно, не создавая в русском искусственно обрывочной фразы.'
- source_word: ודמה
  choice: и будь подобен
  rationale: Передаёт значение уподобления и сохраняет наставительный характер второй части изречения.
- source_word: ליודע
  choice: тому, кто знает
  rationale: 'Предлог ל после דמה естественно понимается как вводящий объект сравнения: «подобен знающему».'
- source_word: ומחריש
  choice: и молчит
  rationale: Причастная форма от חרש выражает молчание или сознательное воздержание от речи; нейтральное «молчит» звучит естественно и не усиливает исходный текст.
- source_word: יחדו
  choice: и
  rationale: Буквально «вместе, одновременно» связывает знание и молчание как одновременные качества. В русском это естественно передаётся простым союзом без добавления противопоставления «всё же».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная форма наставления. «Будь подобен» сохраняет достоинство премудростной речи, а «тому, кто знает и молчит» — намеренную связь знания с речевой сдержанностью.
