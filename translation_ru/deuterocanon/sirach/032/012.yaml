  text: And fulfill your desire in the fear of God[a], and not with any lack.
translation:
  language: ru
  text: Исполняй желаемое в страхе Божьем, не испытывая ни в чём недостатка.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Дай Всевышнему соразмерно Его дару и с добрым оком — по мере того, что найдёт твоя рука». Греческий свидетель отражает существенно иную форму этого стиха, чем сохранившийся еврейский текст.'
    reason: alternative_reading
lexical_decisions:
- source_word: ושלם
  choice: исполняй
  rationale: Форма от שלם выражает призыв довести что-либо до полноты или исполнения. «Исполняй» естественно сочетается с последующим רצון и не смешивает еврейское чтение с греческим «дай».
- source_word: רצון
  choice: желаемое
  rationale: Слово может означать желание, волю, благоволение или угодное. В еврейском тексте нет явного притяжательного показателя, поэтому нейтральное «желаемое» сохраняет смысловую открытость лучше, чем однозначное «своё желание» или добавленное «волю Бога».
- source_word: ביראת אל
  choice: в страхе Божьем
  rationale: Сохранён характерный для литературы мудрости оборот, обозначающий благоговейное отношение к Богу как обстоятельство и меру действия.
- source_word: אל
  choice: Бог
  rationale: Здесь אל — обычное обозначение Бога; в составе устойчивого русского выражения употреблена форма «Божьем».
- source_word: ולא בחסר כל
  choice: ни в чём не допуская недостатка
  rationale: Буквально сжатый оборот говорит об отсутствии какого-либо недостатка. Русская деепричастная конструкция передаёт увещательный смысл и всеохватность כל, не уточняя сверх текста, идёт ли речь о недостаточности, неполноте или скупости.
theological_decisions:
- issue: Существенное расхождение между сохранившимся еврейским текстом и греческим свидетелем
  choice: Основной текст следует еврейскому свидетельству, а греческая форма стиха приводится в сноске.
  alternative: «Дай Всевышнему по дару Его и с добрым оком — сколько найдёт рука твоя».
  rationale: При наличии надёжного еврейского текста Сираха он служит основой перевода. Греческий свидетель отражает заметно иную форму стиха, поэтому его нельзя незаметно гармонизировать с еврейским, но важно сохранить как текстологически значимое альтернативное чтение.
translation_notes:
  register: Современный литературный русский язык с достоинством, присущим наставлению мудрости. Сжатость и некоторая неоднозначность еврейского выражения сохранены; искусственно архаические слова и конфессионально окрашенные уточнения не добавлены.
