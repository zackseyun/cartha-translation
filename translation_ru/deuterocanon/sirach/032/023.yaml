translation:
  language: ru
  text: Во всех своих делах береги себя[a], ибо тот, кто так поступает, соблюдает заповедь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «береги свою душу» или «береги свою жизнь»; древнееврейское нефеш может означать самого человека, его душу или жизнь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «соблюдает одну заповедь». Единственное число «заповедь» может пониматься обобщённо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בכל מעשיך
  choice: Во всех своих делах
  rationale: Передаёт всеохватный смысл בְּכָל и конкретно-нравственный оттенок מעשים; «делах» естественно для русского наставительного стиля.
- source_word: שמור
  choice: храни
  rationale: Императив передаёт бдительное оберегание; выбор также позволяет сохранить повтор корня שמר во второй части стиха.
- source_word: נפשך
  choice: себя
  rationale: נפש здесь может обозначать всего человека, его жизнь или душу. «Себя» естественно передаёт практический призыв к самосохранению и нравственной осмотрительности, не сужая значение до нематериальной души.
- source_word: כי
  choice: ведь
  rationale: Вводит основание для наставления и естественно связывает две части русского предложения.
- source_word: עושה זה
  choice: тот, кто так поступает
  rationale: Передаёт обобщённое значение причастной конструкции и указывает именно на следование предшествующему наставлению.
- source_word: שומר מצוה
  choice: хранит заповедь
  rationale: Сохраняет как образ «хранения», так и лексический повтор שמר. Единственное число מצוה передано без уточнения определённости, которой древнееврейская форма здесь явно не выражает.
theological_decisions:
- issue: Значение נפש в наставлении мудрости
  choice: себя
  alternative: свою душу; свою жизнь
  rationale: Контекст говорит обо всех делах человека, поэтому נפש естественно охватывает всю личность и жизнь. Основной вариант не навязывает позднейшего противопоставления души и тела.
- issue: Определённость и обобщённость מצוה
  choice: заповедь
  alternative: одну заповедь; заповедь как обобщённое понятие
  rationale: В древнееврейском стоит существительное в единственном числе без артикля. Русская форма «заповедь» сохраняет возможность как конкретного, так и обобщённого понимания, не добавляя отсутствующей в источнике определённости.
translation_notes:
  register: Современный литературный русский с лаконичным, достойным стилем наставительной литературы. Повтор «храни — хранит» намеренно воспроизводит повтор древнееврейского корня שמר. Греческий параллельный текст тематически не совпадает с данным древнееврейским стихом и, вероятно, отражает расхождение в нумерации, поэтому основанием перевода служит высокоуверенный древнееврейский текст.
