    reason: textual_variant
lexical_decisions:
- source_word: כרביד זהב
  choice: как золотое ожерелье
  rationale: רביד обозначает шейное украшение или ожерелье; конкретный образ естественно передаётся русским «ожерелье», а כ выражает сравнение.
- source_word: נפך
  choice: карбункул
  rationale: Точная идентификация древнего камня неясна. «Карбункул» — традиционный и достаточно узнаваемый библейский эквивалент; неопределённость отмечена в сноске.
- source_word: ספיר
  choice: сапфир
  rationale: Традиционный эквивалент сохраняет привычную библейскую лексику, хотя древнее название могло относиться к лазуриту; это оговорено в сноске.
- source_word: כך נאים דברים יפים
  choice: так прекрасны добрые слова
  rationale: נאים и יפים совместно подчёркивают красоту и уместность речи. Русское сочетание избегает тавтологии «прекрасны прекрасные слова», сохраняя положительную эстетическую оценку.
- source_word: על משתה היין
  choice: на пиршестве с вином
  rationale: Фраза обозначает пир, для которого характерно вино; перевод звучит естественно и сохраняет конкретную обстановку.
