  choice: Переводить сохранившийся связный еврейский текст Бен-Сиры
  alternative: Следовать указанному греческому тексту о том, чтобы удаляться от зла и неправды
  rationale: Греческая параллель семантически не соответствует еврейскому стиху и, по-видимому, имеет иную нумерацию или текстовую привязку. При наличии высоконадёжного еврейского свидетельства приоритет отдан ему.
