  text: One who fears Yahweh will understand judgment[d][c][b][a], and from the dawn he will bring forth wise sayings from his heart.
translation:
  language: ru
  text: Кто боится Яхве, поймёт суд[a][b][c][d] и с рассветом извлечёт из сердца мудрые изречения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейские рукописи расходятся: в одних стоит «поймёт суд», в других — «поймут Его суд».'
    reason: alternative_reading
  - marker: b
    text: Еврейское выражение, переведённое как «с рассветом», не вполне ясно; оно может означать также «рано» или указывать вообще на рассвет либо сумерки.
    reason: lexical_alternative
  - marker: c
    text: 'Другой еврейский вариант строки гласит: «Боящиеся Яхве поймут Его суд и с великой мудростью извлекут из своего сердца».'
    reason: textual_variant
  - marker: d
    text: Сохранившаяся греческая параллель имеет существенно иной текст, что указывает здесь на другую текстовую традицию.
    reason: textual_variant
lexical_decisions:
- source_word: ירא יהוה / יראי יהוה
  choice: боящийся Яхве
  rationale: В одном еврейском свидетельстве стоит единственное число, в другом — множественное. Представительное единственное число сохраняет форму первой строки и естественно звучит по-русски.
- source_word: יבין / יבינו
  choice: поймёт
  rationale: Глагол בין обозначает понимание и распознавание; «поймёт» ясно передаёт его смысл в контексте премудрости.
- source_word: משפט / משפטו
  choice: суд
  rationale: Слово משפט может обозначать суд, судебное решение, правосудие или то, что справедливо. Краткое «суд» сохраняет смысловую широту и не устраняет разночтение между формами без местоименного суффикса и с ним.
- source_word: מנשף
  choice: с рассветом
  rationale: נשף может указывать на рассвет или сумерки; контекст допускает временной смысл «с раннего часа». Выбор «с рассветом» сохраняет образ времени суток, а неопределённость отмечена в сноске.
- source_word: יוציא
  choice: вынесет
  rationale: Каузативная форма передаёт выведение или вынесение чего-либо наружу. В сочетании «вынесет из сердца» сохраняется исходная метафора внутренней мудрости, становящейся явной.
- source_word: ובחכמות רבות
  choice: мудрые изречения
  rationale: Буквальное множественное «многие мудрости» неестественно по-русски. «Мудрые изречения» передаёт проявленную во множестве слов мудрость; более буквальная синтаксическая возможность приведена в сноске.
- source_word: מלבם
  choice: из сердца
  rationale: Сохраняется еврейский образ сердца как средоточия мысли и намерения. Число согласовано с представительным единственным числом основного текста.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация «Яхве» прямо передаёт собственное имя и соответствует принятому для проекта решению, не подменяя его титулом.
- issue: Выбор основного текстового свидетельства при расхождении с греческим текстом
  choice: Основой служит сохранившийся еврейский текст, а значительное расхождение греческой параллели отмечается в сноске.
  alternative: Перевести греческую строку либо объединить еврейский и греческий тексты.
  rationale: Для Книги Сираха сохранившееся еврейское свидетельство первично. Греческая строка здесь отражает иную текстовую традицию и не должна незаметно смешиваться с еврейской.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формула «вынесет из сердца» намеренно сохраняет еврейскую метафору, не превращая её в отвлечённое «подумает» или однозначное «произнесёт».
