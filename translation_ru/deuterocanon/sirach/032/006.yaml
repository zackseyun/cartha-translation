base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/006.yaml
  text: Like settings of gold and a seal of beryl[b][a], so is the sound of a psalm with the sweetness of new wine.
translation:
  language: ru
  text: Как оправы из чистого золота и печать из берилла[b], так и звучание псалма вместе с усладой молодого вина.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели к этому стиху сказано: «Не являйся пред Господом с пустыми руками». Она отражает другую текстовую традицию или нумерацию; основной перевод следует сохранившемуся еврейскому тексту.'
    reason: textual_variant
  - marker: b
    text: 'Возможно также: «печать из изумруда» или «перстень-печатка с изумрудом». Точная идентификация камня ברקת неясна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מלואות פז
  choice: золотые оправы
  rationale: Поэтическое и эллиптическое выражение обозначает оправы или обрамления из чистого золота; «золотые оправы» ясно передаёт ювелирный образ, не перегружая строку.
- source_word: חותם ברקת
  choice: печать из берилла
  rationale: חותם означает печать или перстень-печатку, но наличие кольца прямо не выражено. ברקת — драгоценный камень с не вполне уверенной идентификацией; «берилл» сохраняет принятую научную передачу.
- source_word: קול מזמור
  choice: так звучит псалом
  rationale: קול — «голос, звук», а מזמור — «псалом, песнопение». Глагольная русская конструкция естественно передаёт буквальное «звучание псалма» и сохраняет богослужебно-поэтический оттенок.
- source_word: על נועם תירוש
  choice: при сладости молодого вина
  rationale: תירוש обозначает молодое вино, נועם — приятность, усладу или сладость. Неоднозначный предлог על здесь передан как «при», выражая сопутствующее пиршеству вино без чрезмерно точного истолкования связи.
theological_decisions:
- issue: Выбор еврейского текста при расхождении с греческой параллелью
  choice: Основной текст переведён по сохранившемуся еврейскому поэтическому изречению.
  alternative: 'Греческий текст: «Не являйся пред Господом с пустыми руками».'
  rationale: Предоставленная греческая параллель семантически не соответствует еврейской строке и отражает другую текстовую традицию либо нумерацию. Поскольку еврейское свидетельство сохранилось и имеет высокую степень надёжности, оно положено в основу, а расхождение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной поэтической образностью. Парная конструкция «как… так…» делает подразумеваемое еврейское сравнение понятным, не устраняя образной сжатости оригинала.
