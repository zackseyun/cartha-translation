- from: Как золотые оправы и печать из берилла[b], так звучит псалом при сладости молодого вина.[a]
  to: Как оправы из чистого золота и печать из берилла[b], так и звучание псалма вместе с усладой молодого вина.[a]
  rationale: Исправление сохраняет смысл и образность еврейской строки, но делает русскую синтаксическую связь яснее и естественнее. «Вместе с» — намеренно сдержанная передача неоднозначного על; она не утверждает, что псалом исполняется именно «над» вином или исключительно во время пира. Все исходные сноски и их якоря сохранены.
