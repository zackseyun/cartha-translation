lexical_decisions:
- source_word: מלל
  choice: говори
  rationale: Повелительная форма со значением «говорить»; краткое и естественное начало наставления.
- source_word: שב
  choice: старейшина
  rationale: Обращение к старшему, почитаемому участнику трапезы; слово передаёт и возраст, и уважительный общественный статус.
- source_word: כי הוא לך
  choice: ведь тебе это подобает
  rationale: Фраза выражает уместность речи для положения адресата, а не простую принадлежность.
- source_word: והצנא שכל
  choice: но говори разумно и сдержанно
  rationale: Сжатая и не вполне однозначная еврейская конструкция, вероятно, соединяет благоразумие со скромностью или сдержанностью. Повтор глагола «говори» делает подразумеваемую связь ясной по-русски, не устраняя лексической неопределённости, отмеченной в сноске.
- source_word: ואל תמנע שיר
  choice: и не мешай пению
  rationale: מנע означает «удерживать, препятствовать»; «пение» естественно передаёт שיר в контексте праздничной трапезы.
theological_decisions:
- issue: Обращение שב в контексте наставления о трапезе
  choice: старейшина
  alternative: старик; пожилой человек
  rationale: «Старейшина» сохраняет почтительный оттенок и общественное достоинство адресата, не сводя обозначение лишь к возрасту.
- issue: Неоднозначность выражения והצנא שכל
  choice: говори разумно и сдержанно
  alternative: будь скромен в своей мудрости; проявляй благоразумную сдержанность
  rationale: Перевод сохраняет сочетание разумности и сдержанности и не превращает сжатое наставление в более узкое конфессиональное или нравоучительное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством, подобающим книге Премудрости. Синтаксис краток и ясен; «старейшина» сохраняет уважительное обращение, а «пению» естественно звучит в контексте пиршества.
