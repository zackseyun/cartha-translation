  text: Do not trust in a way of stumbling[b][a], and in your end be on guard.
translation:
  language: ru
  text: Не полагайся на путь, ведущий к падению[a], и в конце своём будь настороже[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово מחתף трудно для истолкования; вероятно, речь идёт о пути, на котором можно оступиться или упасть. Возможны переводы: «скользкий путь» или «коварный путь».'
    reason: lexical_alternative
  - marker: b
    text: Приведённый греческий параллельный текст, по-видимому, относится к другому стиху, поэтому там, где он расходится с сохранившимся еврейским текстом, перевод ему не следует.
    reason: textual_variant
lexical_decisions:
- source_word: אל תבטח
  choice: Не полагайся
  rationale: Глагол בטח означает доверять или полагаться. «Не полагайся» естественно передаёт предостережение и хорошо сочетается с образом пути.
- source_word: בדרך
  choice: на путь
  rationale: דרך может обозначать как дорогу, так и образ действий. Русское «путь» сохраняет эту намеренную двуплановость.
- source_word: מחתף
  choice: ведущий к падению
  rationale: Слово трудно для истолкования; по контексту оно, вероятно, указывает на то, что заставляет оступиться или упасть. Выбранный вариант сохраняет этот основной смысл, не уточняя без достаточных оснований, скользок ли путь или коварен.
- source_word: ובאחריתך
  choice: и в конце своём
  rationale: אחרית с суффиксом второго лица может означать твой конец, исход или дальнейшую участь. Формулировка сохраняет притяжательное значение суффикса и эсхатологическую либо жизненную открытость выражения.
- source_word: השמר
  choice: будь настороже
  rationale: Возвратный императив призывает беречься и проявлять бдительность; «будь настороже» ясно и естественно передаёт этот оттенок.
theological_decisions:
- issue: Значение «твоего конца»
  choice: Сохранено открытое выражение «в конце своём»
  alternative: «в будущем», «в итоге», «до самого конца»
  rationale: Еврейское אחרית допускает значения конца, исхода и будущей участи. Перевод не сводит его исключительно ни к смерти, ни к ближайшему результату поступков.
translation_notes:
  register: Современный литературный русский язык с кратким назидательным ритмом. Несколько необычный оборот «в конце своём» намеренно сохраняет притяжательный суффикс и смысловую открытость еврейского выражения.
