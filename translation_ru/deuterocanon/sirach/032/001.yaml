base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/001.yaml
  text: If they have made you the leader[a], do not exalt yourself; be among them like one of them. Care for them, and then recline; prepare what is needed[c][b], and then take your place.
translation:
  language: ru
  text: '[Если ты поставлен распорядителем, не превозносись и не садись во главе среди знатных.][a] Будь для них как один из них; позаботься о них[b], а потом возляг[c]. Приготовь всё необходимое[d], а потом займи своё место.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальная строка в издании Каханы заключена в квадратные скобки. Это отмечает её особый текстологический статус; здесь она переведена, поскольку присутствует в приведённом еврейском свидетельстве и соответствует наставлению распорядителю трапезы.
    reason: textual_variant
  - marker: b
    text: 'Или: «присмотри за ними». Еврейский глагол может выражать и заботу, и практическое попечение.'
    reason: lexical_alternative
  - marker: c
    text: На торжественных трапезах древности за столом обычно не сидели, а возлежали.
    reason: cultural_note
  - marker: d
    text: Еврейский текст в этом месте труден; вероятно, речь идёт о необходимых приготовлениях для гостей или трапезы.
    reason: textual_difficulty
lexical_decisions:
- source_word: ראש נבחרת
  choice: если тебя избрали распорядителем
  rationale: Буквально выражение указывает на главу или руководителя собравшихся. Контекст трапезы позволяет естественно передать эту роль словом «распорядитель», не превращая её в постоянный титул.
- source_word: אל תתרומם
  choice: не превозносись
  rationale: Возвратный оттенок глагола выражает самовозвышение; «не превозносись» сохраняет образ и нравственный призыв к смирению.
- source_word: ובראש גדולים אל תשב
  choice: и не садись во главе знатных
  rationale: Перевод сохраняет пространственный образ почётного места во главе и передаёт גדולים как людей высокого положения, не уточняя их общественный статус сверх текста.
- source_word: היה להם כאחד מהם
  choice: будь для них как один из них
  rationale: Формулировка передаёт призыв не отделять себя от остальных и сохраняет повтор местоимений исходного текста.
- source_word: דאג להם
  choice: позаботься о них
  rationale: Глагол может обозначать как внутреннюю заботу, так и практическое попечение; в контексте трапезы русское выражение охватывает оба оттенка.
- source_word: תסב
  choice: возляг
  rationale: Глагол обозначает принятую в древности позу за торжественной трапезой. «Возляг» точно отражает обычай, а культурная сноска предотвращает непонимание.
- source_word: הכן מרכם
  choice: приготовь всё необходимое
  rationale: Переданный еврейский текст в этом месте труден. Контекст требует предварительного устройства трапезы или обслуживания гостей; обобщённая формулировка избегает ложной лексической точности.
- source_word: תרבץ
  choice: займи своё место
  rationale: Глагол может означать лечь, расположиться или устроиться. Контекстуальный перевод естественно передаёт завершение приготовлений и не повторяет «возляг».
