  register: Современный литературный русский язык с достоинством наставительной речи. «Возляг» оставлено как точный культурно обусловленный термин и пояснено сноской; остальные формулировки сделаны понятными без архаизации. Квадратные скобки в основном тексте отражают текстологические скобки издания Каханы.
