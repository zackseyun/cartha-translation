  text: He who keeps the law guards his life[a], and he who trusts in Yahweh will not be put to shame.
translation:
  language: ru
  text: Кто соблюдает Закон, тот хранит свою жизнь[a], и кто уповает на ГОСПОДА, не будет посрамлён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этого стиха существенно отличается: «пока не воздаст человеку по делам его и делам людей — по их помышлениям». Основной текст здесь следует сохранившемуся еврейскому свидетельству.'
    reason: textual_variant
lexical_decisions:
- source_word: נוצר
  choice: соблюдает
  rationale: Причастие от נצר означает «хранить, беречь, соблюдать». При слове תורה естественное русское сочетание «соблюдает Закон» передаёт внимательное исполнение предписаний.
- source_word: תורה
  choice: Закон
  rationale: תורה может означать «наставление, учение», но здесь в сочетании с упованием на יהוה имеет выраженный заветно-религиозный смысл. «Закон» кратко и узнаваемо передаёт этот оттенок, не исключая смысла Божьего наставления.
- source_word: שומר נפשו
  choice: хранит свою жизнь
  rationale: נפש здесь обозначает жизнь или самого человека, а не «душу» в узком современном смысле. Формулировка сохраняет образ хранения и словесный параллелизм נוצר / שומר.
- source_word: ובוטח ביהוה
  choice: и кто уповает на ГОСПОДА
  rationale: Причастная конструкция передана обобщённым оборотом «кто…». Глагол «уповает» естественно выражает доверие к Богу и соответствует возвышенному библейскому регистру.
- source_word: לא יבוש
  choice: не будет посрамлён
  rationale: בוש может обозначать стыд и крушение надежды. «Не будет посрамлён» сохраняет библейскую идиому и особенно уместно после слов об уповании.
theological_decisions:
- issue: Передача имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве; Иегова
  rationale: Традиционная русская передача имени יהוה как «ГОСПОДЬ» соответствует иудейской традиции благоговейного чтения и древнегреческой практике κύριος; прописные буквы отмечают наличие тетраграмматона.
- issue: Существенное расхождение еврейского и греческого текстов
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству, а греческое чтение вынесено в примечание.
  alternative: 'Следовать греческому тексту: «пока не воздаст человеку по делам его и делам людей — по их помышлениям»'
  rationale: Еврейский текст здесь сохранён и потому служит основной исходной формой. Греческий параллельный текст содержит не малый вариант, а иное изречение; его нельзя молча согласовать с еврейским, поэтому расхождение явно отмечено.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формы «уповает» и «посрамлён» сохраняют узнаваемый библейский регистр, оставаясь понятными современному читателю. Параллелизм двух обобщённых конструкций «кто… тот… / и кто…» отражает строй еврейского изречения.
