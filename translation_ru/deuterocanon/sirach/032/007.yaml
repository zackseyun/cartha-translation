  source_fidelity: Основной текст точно передаёт императив דבר, обращение נער, условие необходимости и условное «если тебя спросят». «Два или три раза» следует имеющемуся еврейскому чтению פעמים ושלש. Передача בחזק как «сдержанно» остаётся интерпретационной, но осторожно маркирована сноской и согласуется с выбранной английской линией; она не выдаётся за бесспорное лексическое значение.
