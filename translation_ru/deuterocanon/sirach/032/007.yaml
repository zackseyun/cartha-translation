  text: Speak[a], young man, if there is need for you to do so, with restraint[b], two or three times if you are asked.
translation:
  language: ru
  text: Говори, юноша, если тебе необходимо, — сдержанно[a], два или три раза, если тебя спросят.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское בחזק в этой строке имеет неясное значение. Возможны также переводы: «кратко», «осторожно» или «лишь с трудом». Дошедший греческий параллельный текст существенно отличается.'
    reason: textual_variant
lexical_decisions:
- source_word: דבר
  choice: Говори
  rationale: Повелительная форма глагола דבר прямо призывает адресата говорить; настоящее повелительное «говори» естественно по-русски.
- source_word: נער
  choice: юноша
  rationale: Существительное стоит в мужском роде и обозначает молодого мужчину; «юноша» сохраняет прямое обращение и возвышенно-наставительный тон.
- source_word: אם צריך אתה
  choice: если тебе необходимо
  rationale: Передаёт условие необходимости и сохраняет выраженное в еврейском тексте обращение ко второму лицу.
- source_word: בחזק
  choice: сдержанно
  rationale: Форма и значение слова в данной строке неясны. С учётом контекста наставления об умеренной речи выбрано осторожное смысловое соответствие, не предполагающее напористости.
- source_word: פעמים ושלש
  choice: два или три раза
  rationale: Передаёт ограниченное число повторений естественной русской формулой; союз «или» выражает подразумеваемую альтернативу между двумя и тремя разами.
- source_word: אם ישאלך
  choice: если тебя спросят
  rationale: Неопределённо-личная русская конструкция точно передаёт условие, не добавляя отсутствующего в исходнике определённого субъекта.
