translation:
  language: ru
  text: Как печать на мешочке с золотом — песнь Богу на пиршестве с вином[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Божья песнь»; возможно также: «песнь о Боге». Еврейское выражение сжато и допускает разные смысловые отношения между песнью и Богом.'
    reason: lexical_alternative
  - marker: b
    text: Предшествующие строки этого фрагмента в еврейской рукописной традиции переданы неясно. Заключительное сравнение переведено по сохранившемуся еврейскому тексту; греческий текст под этим номером существенно отличается.
    reason: textual_variant
lexical_decisions:
- source_word: כחותם
  choice: как печать
  rationale: Префикс כ выражает сравнение. «Печать» передаёт חותם без излишнего сужения до конкретного вида печатки.
- source_word: על כיס זהב
  choice: на мешочке с золотом
  rationale: כיס — мешочек или кошель для денег и ценностей; по-русски конкретный образ естественно передаётся как «мешочек с золотом».
- source_word: שיר
  choice: песнь
  rationale: Единственное число обозначает конкретную песнь; «песнь» соответствует возвышенному, но понятному тону изречения.
- source_word: אל
  choice: Богу
  rationale: Сжатое сочетание שיר אל допускает направленное понимание — песнь, обращённая к Богу. Альтернативная связь сохранена в примечании.
- source_word: על משתה היין
  choice: на пиршестве с вином
  rationale: משתה обозначает пир, часто с употреблением вина; היין прямо уточняет вино. Такая формулировка сохраняет образ и звучит естественно по-русски.
theological_decisions:
- issue: Сжатое сочетание שיר אל
  choice: песнь Богу
  alternative: Божья песнь; песнь о Боге
  rationale: Еврейское сочетание не определяет однозначно отношение между песнью и Богом. Основной текст передаёт вероятное направление песни к Богу, а примечание сохраняет генитивное и тематическое прочтения, не превращая фразу в узкое литургическое утверждение.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной конструкцией. Тире сохраняет сжатость именного сравнения; «песнь» придаёт уместную торжественность, оставаясь понятным обычному читателю.
