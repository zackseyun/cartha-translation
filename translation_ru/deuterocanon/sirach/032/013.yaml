base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/013.yaml
  text: For all these things bless your Maker[a], who fills you with his goodness. He who seeks the law will obtain favor[c][b], but the hypocrite will be caught by it.
translation:
  language: ru
  text: За всё это благословляй своего Создателя[a], насыщающего тебя Своими благами. Кто ищет Бога[b], тот надеется на благоволение, а самовосхваляющийся[c] будет им уловлен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское свидетельство этого стиха существенно отличается от греческого текста: «Ибо Господь воздаёт и воздаст тебе семикратно».'
    reason: textual_variant
  - marker: b
    text: Еврейский текст этой строки труден. Буквально выражение можно понять как «кто ищет Бога»; в контексте книги оно может также указывать на поиск Божьего наставления или Закона.
    reason: alternative_reading
  - marker: c
    text: Еврейское слово неясно; вероятное значение — «самовосхваляющийся» или «хвастун». Возможны и другие понимания, например «самообольщённый» или «лицемер».
    reason: lexical_alternative
lexical_decisions:
- source_word: ברך
  choice: благословляй
  rationale: Императив означает благословлять или восхвалять Бога. «Благословляй» сохраняет библейскую образность и естественно сочетается с прямым дополнением.
- source_word: עושך
  choice: своего Создателя
  rationale: Причастная форма буквально означает «того, кто создал тебя». «Создатель» кратко и естественно передаёт личное отношение, выраженное суффиксом.
- source_word: המרוך מטובתו
  choice: насыщающего тебя Своими благами
  rationale: Форма в составном еврейском свидетельстве не вполне ясна; по смыслу Создатель щедро даёт человеку от Своей благости. Русское выражение передаёт насыщение дарами, не сводя טובתו лишь к абстрактному нравственному качеству.
- source_word: דורש אל
  choice: кто ищет Божьего наставления
  rationale: Переданное אל допускает понимание «Бог» или иное синтаксическое толкование. В контексте премудрости речь, вероятно, идёт о стремлении к Богу и исходящему от Него наставлению; основной текст сохраняет эту связь, а неоднозначность отмечена в сноске.
- source_word: יקוה רצון
  choice: тот обретёт благоволение
  rationale: Буквально сочетание может означать «будет надеяться на благоволение». Результативное «обретёт» естественно для изречения премудрости и передаёт вероятный контекстуальный смысл.
- source_word: ומתלהלה
  choice: а самообольщённый
  rationale: Редкая или повреждённая форма неясна. «Самообольщённый» передаёт нравственно ненадёжного человека, который обманывается насчёт себя; другие возможные смыслы указаны в сноске.
- source_word: יוקש בו
  choice: будет им уловлен
  rationale: Глагол означает попадание в силки или западню. «Будет уловлен» сохраняет метафору, а местоимение «им» — некоторую неясность референта исходного בו.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающейся греческой традицией
  choice: Основной текст переведён по еврейскому свидетельству Кааны, а греческое чтение приведено в сноске.
  alternative: 'Перевести только греческий текст: «Ибо Господь воздаёт и воздаст тебе семикратно».'
  rationale: При наличии еврейского текста он служит первичным источником. Однако расхождение с греческим здесь затрагивает всё содержание стиха, поэтому альтернативная традиция должна быть явно сохранена.
- issue: Неоднозначность אל
  choice: Божьего наставления
  alternative: Бога; божественного учения; закона
  rationale: Такой перевод связывает поиски с Богом и контекстом премудрости, но не отождествляет неясное слово с Торой безоговорочно. Сноска сохраняет более буквальную возможность «ищет Бога».
- issue: Референт местоимения בו
  choice: им
  alternative: будет пойман этим; попадёт из-за него в западню
  rationale: Местоименное выражение позволяет не устранять неясность еврейского текста относительно того, чем или кем человек будет уловлен.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским, достойным регистром. Заглавные буквы в местоимениях о Боге использованы последовательно в пределах стиха. Неясности еврейского текста не устранены догматически: основные решения сопровождаются краткими текстологическими и лексическими сносками.'
