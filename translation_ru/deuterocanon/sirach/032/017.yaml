base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/017.yaml
  text: A wise man will incline himself to reproof[a], but one who is deceived will follow his own desire. A wise man will not conceal anger, but a scoffer will not guard his tongue.
translation:
  language: ru
  text: Мудрый прислушивается к обличениям[a], а легковерный идёт на поводу у своего желания. Мудрый не скрывает гнева, а насмешник не следит за своим языком.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом свидетельстве: «Он не оставит без внимания ни мольбу сироты, ни вдову, когда та изливает свою жалобу». Сохранившийся здесь еврейский текст существенно отличается от греческого.'
    reason: alternative_reading
lexical_decisions:
- source_word: איש חכם
  choice: мудрый человек
  rationale: Передаёт грамматически мужскую форму и естественно звучит как обозначение человека в изречении мудрости.
- source_word: יטה תוכחות
  choice: склоняется к обличениям
  rationale: Сохраняет образ наклонения или обращения к наставляющим обличениям; множественное число соответствует еврейскому тексту.
- source_word: ואחר צרכו ימשך נפתה
  choice: а обманутый следует за своим желанием
  rationale: נפתה передано в пассивном значении как человек, введённый в заблуждение; צרכו допускает значения нужды, желания или того, что ему подходит, а ימשך — следования или увлечения вслед.
- source_word: לא יכסה כחמה
  choice: не скрывает гнева
  rationale: Прямо отражает сохранившийся еврейский текст, не устраняя его непростой и потенциально напряжённый смысл.
- source_word: לץ
  choice: насмешник
  rationale: Естественный современный эквивалент характерного для литературы мудрости обозначения дерзкого глумливого человека.
- source_word: לא ישמר לשונו
  choice: не сдерживает языка
  rationale: Естественная русская идиома, сохраняющая образ контроля над речью.
theological_decisions:
- issue: Расхождение еврейского и греческого свидетелей
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству, включая оба двустишия.
  alternative: 'Греческий текст: «Он не оставит без внимания мольбу сироты и вдову, когда она изливает свою жалобу».'
  rationale: При наличии еврейского текста Сираха он служит первичным источником. Греческое свидетельство здесь существенно отличается, поэтому оно приведено в сноске, а не смешано с основным текстом.
- issue: Неясный смысл утверждения о гневе мудрого
  choice: не скрывает гнева
  alternative: не таит гнева / не покрывает ярости
  rationale: Формулировка сохраняет буквальный и богословски напряжённый смысл еврейского чтения, не добавляя объяснения о якобы праведном или оправданном гневе.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным стилем изречения мудрости. Сохранены параллелизм, мужская форма обобщённого лица и неоднозначность еврейского текста.
