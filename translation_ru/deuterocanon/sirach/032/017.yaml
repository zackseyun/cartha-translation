revisions:
- from: Мудрый человек склоняется к обличениям[a], а обманутый следует за своим желанием. Мудрый человек не скрывает гнева, а насмешник не сдерживает языка.
  to: Мудрый прислушивается к обличениям[a], а легковерный идёт на поводу у своего желания. Мудрый не скрывает гнева, а насмешник не следит за своим языком.
  rationale: Правка сглаживает русский стиль и точнее передаёт обобщённо-характеризующее значение נפתה, не меняя смыслового контраста еврейского текста. Формулировка о гневе сохранена без интерпретирующих добавлений. Сноска по-прежнему фиксирует самостоятельное и резко отличающееся греческое чтение.
