base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/032/020.yaml
  text: Do not walk on a path full of obstacles[b][a], and do not stumble over the same hazard twice.
translation:
  language: ru
  text: Не ходи по пути, полному ловушек,[a] и не спотыкайся дважды об одно и то же препятствие.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение буквально говорит о «пути ловушек». Слово может обозначать ловушки, западни или то, обо что спотыкаются.
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст здесь существенно иной: «Кто служит с благорасположением, будет принят, и его прошение достигнет облаков». Основной текст следует сохранившемуся еврейскому свидетельству.'
    reason: textual_variant
lexical_decisions:
- source_word: בדרך
  choice: по пути
  rationale: דרך обозначает путь или дорогу; здесь сохраняется как буквальный образ, так и возможный переносный смысл жизненного поведения.
- source_word: מוקשות
  choice: полному ловушек
  rationale: Слово указывает на то, что захватывает в ловушку или заставляет споткнуться. «Ловушки» сохраняют конкретный образ и не сводят его только к обычным трудностям.
- source_word: אל תלך
  choice: не ходи
  rationale: הלך обычно означает «идти, ходить»; выбранная форма естественно передаёт наставление и поддерживает образ пути.
- source_word: ואל תתקל
  choice: и не спотыкайся
  rationale: В данном контексте глагол описывает столкновение с помехой, ведущее к падению; «спотыкаться» естественно продолжает дорожный образ.
- source_word: בנגף
  choice: об одно и то же препятствие
  rationale: נגף здесь понимается как то, обо что спотыкаются. Уточнение «одно и то же» естественно выражает повторность, подразумеваемую сочетанием с «дважды», не превращая препятствие в отдельное событие.
- source_word: פעמים
  choice: дважды
  rationale: Слово имеет прямое числовое значение «два раза, дважды».
