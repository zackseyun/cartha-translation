lexical_decisions:
- source_word: Ἐπίστρεφε
  choice: Обратись
  rationale: Передаёт направленное возвращение к Господу и естественно звучит как нравственный призыв, не заменяя сам глагол более узким богословским термином «покайся».
- source_word: ἐπὶ Κύριον
  choice: к Господу
  rationale: ἐπί с винительным при глаголе движения указывает направление; русский оборот «обратись к Господу» естественен и точен.
- source_word: ἀπόλειπε
  choice: оставь
  rationale: Императив означает оставить, отойти от чего-либо; краткое «оставь» выражает решительный разрыв без архаизма.
- source_word: ἁμαρτίας
  choice: грехи
  rationale: Сохранено конкретное множественное число греческого существительного.
- source_word: δεήθητι
  choice: помолись
  rationale: Аористный императив δέομαι обозначает обращение с мольбой или прошением. «Помолись» естественно в данном увещании; оттенок прошения определяется контекстом.
- source_word: κατὰ πρόσωπον
  choice: пред лицом Его
  rationale: Сохранён образный оборот со словом «лицо»; местоимение «Его» восполняет подразумеваемого Господа из первой части стиха.
- source_word: σμίκρυνον
  choice: уменьши
  rationale: Прямо передаёт повеление сделать меньшим, не усиливая его до полного устранения.
- source_word: πρόσκομμα
  choice: то, что ведёт к падению
  rationale: Контекстуально ясная передача препятствия или причины нравственного преткновения. Описательная формулировка не определяет, является ли оно внутренним или внешним.
theological_decisions:
- issue: Эллиптический оборот κατὰ πρόσωπον без явно названного обладателя лица
  choice: пред лицом Его
  alternative: в Его присутствии; пред Ним
  rationale: Местоимение отнесено к ранее названному Господу. Перевод сохраняет антропоморфный образ, не превращая его в отдельное богословское утверждение.
- issue: Нравственный смысл πρόσκομμα
  choice: то, что ведёт к падению
  alternative: препятствие; преткновение; повод к падению
  rationale: Греческое слово допускает как конкретное препятствие, так и причину нравственного падения. Описательный перевод понятен современному читателю и не уточняет природу этого препятствия сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «пред лицом Его». Повелительные формы сохранены; пунктуация отражает последовательность четырёх увещаний. Все поясняемые места отмечены в основном тексте.
