    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ γὰρ δύναται
  choice: Ведь … не всё может
  rationale: γάρ вводит основание или пояснение, а δύναται выражает возможность. Такая конструкция естественно передаёт общий смысл по-русски.
- source_word: πάντα εἶναι ἐν ἀνθρώποις
  choice: не всё может быть у людей
  rationale: Греческая фраза сжата и допускает оттенки «в людях» и «среди людей». Русское «у людей» сохраняет её общий смысл — людям доступно или присуще не всё — без искусственной буквальности.
- source_word: ἀνθρώποις
  choice: людей
  rationale: Множественное число обозначает людей вообще, а не только мужчин.
- source_word: ὅτι
  choice: потому что
  rationale: ὅτι указывает причину предыдущего утверждения; «потому что» ясно передаёт логическую связь.
- source_word: οὐκ ἀθάνατος
  choice: не бессмертен
  rationale: Прямой и общеупотребительный эквивалент греческого ἀθάνατος в отрицательной конструкции.
- source_word: υἱὸς ἀνθρώπου
  choice: сын человеческий
  rationale: Сохранён семитизированный образ греческого выражения, при этом строчная буква и сноска показывают, что здесь это общее обозначение смертного человека, а не титул.
theological_decisions:
- issue: Передавать ли υἱὸς ἀνθρώπου буквально или идиоматически
  choice: сын человеческий
  alternative: человек; смертный человек
  rationale: Буквальная формулировка сохраняет текстуру источника и его возможную многозначность. Контекст не указывает на мессианский титул; это разъяснено в сноске, а не устранено заменой в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством, присущим премудростной литературе. Сжатость греческой фразы сохранена без тяжеловесного «не всё может находиться в людях».
