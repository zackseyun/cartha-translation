  text: Who will sing praise to the Most High in Hades[b][a], instead of the living who give thanks?
translation:
  language: ru
  text: Кто в аде[a] восхвалит Всевышнего вместо живых, воздающих благодарение[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в шеоле», «в преисподней» или «в могиле». В греческом тексте: «в Аиде»; здесь имеется в виду мир мёртвых.'
    reason: lexical_alternative
  - marker: b
    text: «Воздавать благодарение» можно также перевести как «приносить благодарность», «выражать признательность» или «исповедовать»; здесь речь идёт о благодарственной хвале Богу.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑψίστῳ
  choice: Всевышнего
  rationale: Дательный падеж обозначает Того, Кому воздаётся хвала; «Всевышний» — естественная передача этого божественного титула в русской библейской речи.
- source_word: τίς αἰνέσει
  choice: кто… восхвалит
  rationale: Сохранены вопросительная форма и будущее время. «Восхвалит» прямо передаёт αἰνέω и не добавляет отсутствующего в греческом тексте указания на пение.
- source_word: ἐν ᾅδου
  choice: в аде
  rationale: Передаёт греческое обозначение мира мёртвых. Поскольку современное русское «ад» может пониматься как место окончательного наказания, значение здесь уточнено в сноске.
- source_word: ἀντὶ ζώντων
  choice: вместо живых
  rationale: Буквально сохраняет выраженное ἀντί значение замещения или противопоставления и не сглаживает несколько напряжённую формулировку стиха.
- source_word: διδόντων ἀνθομολόγησιν
  choice: воздающих благодарение
  rationale: Оборот естественно передаёт буквальное «дающих благодарение/признание» и сохраняет богослужебный оттенок; возможные значения исповедания и признания отмечены в сноске.
theological_decisions:
- issue: Значение ᾅδης в контексте книги Премудрости Иисуса, сына Сирахова
  choice: мир мёртвых, обозначенный словом «ад» и разъяснённый в сноске
  alternative: место окончательного наказания; шеол; могила; преисподняя
  rationale: Стих противопоставляет умерших живым по способности хвалить Бога и сам по себе не излагает учение об окончательном наказании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Риторический вопрос, будущее время и буквальное противопоставление «вместо живых» сохранены; маркеры сносок поставлены непосредственно после поясняемых выражений.
