lexical_decisions:
- source_word: ἐπάναγε
  choice: Обратись вновь
  rationale: Императив выражает возвращение и новое обращение к Богу; «вновь» передаёт значение повторного движения, заложенное в приставке ἐπανά-.
- source_word: ἐπὶ Ὕψιστον
  choice: к Всевышнему
  rationale: Предлог обозначает направленность, а Ὕψιστος сохранено как традиционный и понятный титул Бога.
- source_word: ἀπόστρεφε
  choice: отвернись
  rationale: Настоящий императив призывает к устойчивому нравственному отвращению от зла; русский совершенный вид естественнее передаёт прямой призыв, не исключая дальнейшей постоянства.
- source_word: ἀπὸ ἀδικίας
  choice: от неправды
  rationale: ἀδικία охватывает неправедность, несправедливость и дурные поступки; «неправда» сохраняет широкое нравственное значение и звучит естественно в библейском увещании.
- source_word: σφόδρα
  choice: всем сердцем
  rationale: Наречие усиливает повеление. Идиоматическое «всем сердцем» естественно выражает крайнюю степень отвращения, не ослабляя силы текста.
- source_word: μίσησον
  choice: возненавидь
  rationale: Сильный императив сохранён без смягчения; совершенный вид уместен как прямой призыв занять решительную нравственную позицию.
- source_word: βδέλυγμα
  choice: всё мерзкое
  rationale: Существительное обозначает нечто отвратительное или мерзостное. Субстантивированное выражение естественно по-русски и не сужает значение до конкретного предмета или ритуальной категории.
theological_decisions:
- issue: Значение ἀδικία в призыве к покаянию
  choice: неправда
  alternative: неправедность; несправедливость; беззаконие
  rationale: Контекст связывает возвращение к Богу с отказом от нравственного зла вообще. «Неправда» сохраняет широкий смысл и не ограничивает речь лишь социальной несправедливостью или юридическим беззаконием.
- issue: Сила βδέλυγμα
  choice: всё мерзкое
  alternative: мерзость; то, что отвратительно
  rationale: Перевод сохраняет резкую нравственную оценку греческого слова, но не вносит более узкого ритуального или конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского увещания. Синтаксис краткий и повелительный; сильные слова μισέω и βδέλυγμα не смягчены. Выражение «всем сердцем» выбрано ради естественного русского усиления σφόδρα.
