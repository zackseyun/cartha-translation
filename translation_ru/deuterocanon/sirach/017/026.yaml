translation:
  language: ru
  text: Ведь люди не могут вместить в себе всё, потому что человек[a] не бессмертен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «сын человеческий». Здесь это общее обозначение смертного человека, а не титул.'
    reason: Сохраняет сведения об образном выражении оригинала и предотвращает ошибочное титульное прочтение.
lexical_decisions:
- source_word: οὐ γὰρ
  choice: Ведь не
  rationale: «Ведь» естественно передаёт пояснительно-обосновывающую функцию γάρ и сохраняет связь с предыдущей мыслью.
- source_word: δύναται πάντα εἶναι
  choice: не всё может быть
  rationale: Оборот передаёт значение возможности у δύναται и всеохватность πάντα, оставаясь естественным для современного русского языка.
- source_word: ἐν ἀνθρώποις
  choice: среди людей
  rationale: В данном контексте ἐν с множественным обозначением людей естественно понимается как «среди людей»; такой перевод звучит по-русски яснее, чем буквальное «в людях».
- source_word: ἀθάνατος
  choice: бессмертен
  rationale: Прямой и краткий эквивалент, сохраняющий противопоставление человеческой ограниченности и бессмертия.
- source_word: υἱὸς ἀνθρώπου
  choice: сын человеческий
  rationale: Сохраняет образное семитское выражение греческого текста; строчные буквы и примечание показывают, что здесь это общее обозначение смертного человека, а не титул.
theological_decisions:
- issue: Следует ли понимать υἱὸς ἀνθρώπου как титул или как общее обозначение человека
  choice: 'Общее обозначение смертного человека: «сын человеческий»'
  alternative: «человек»; «Сын Человеческий»
  rationale: Контекст мудрой книги, отсутствие артикля и пояснение о смертности указывают на родовое значение. Сохранение исходного оборота не устраняет его образность, а строчное написание и сноска не позволяют привнести позднейшее титульное прочтение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. «Среди людей» выбрано ради естественности, а исходный оборот «сын человеческий» сохранён со строчным написанием и разъяснён в сноске.
