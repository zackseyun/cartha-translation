  text: He added knowledge to them[a], and he bequeathed to them the law of life.
translation:
  language: ru
  text: Он прибавил им знание и дал им в наследие закон жизни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закон, дарующий жизнь». Буквально по-гречески: «закон жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθηκεν
  choice: прибавил
  rationale: Передаёт основное значение аориста προστίθημι — «добавил, присоединил» — и сохраняет мысль о знании как о ещё одном даре.
- source_word: ἐπιστήμην
  choice: знание
  rationale: Широкое и нейтральное соответствие ἐπιστήμη, не сужающее смысл до практического умения или особого рода проницательности.
- source_word: νόμον ζωῆς
  choice: закон жизни
  rationale: Буквально сохраняет родительную конструкцию νόμον ζωῆς и не устраняет её смысловую неоднозначность.
- source_word: ἐκληροδότησεν
  choice: дал в наследие
  rationale: Естественно по-русски передаёт заложенный в κληροδοτέω смысл передачи чего-либо в наследство.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж передан прямо; повторное αὐτοῖς во второй части по-русски выражено местоимением при глагольной конструкции «дал им в наследие».
theological_decisions:
- issue: Следует ли понимать νόμον ζωῆς буквально как «закон жизни» или функционально как «закон, дарующий жизнь»
  choice: закон жизни
  alternative: закон, дарующий жизнь
  rationale: Основной текст сохраняет формальную генитивную связь и присущую ей богословскую неоднозначность; возможное значение действия закона отмечено в сноске, но не внесено в текст как единственное толкование.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным библейским ритмом. Выражение «дал в наследие» понятно современному читателю и сохраняет наследственный оттенок греческого глагола без излишней архаизации.
