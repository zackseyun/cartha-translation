lexical_decisions:
- source_word: μεγαλεῖον δόξης
  choice: величие славы
  rationale: Передаёт сочетание как проявленное величие или великолепие славы, сохраняя отвлечённое существительное и возвышенный параллелизм исходного текста.
- source_word: εἶδον οἱ ὀφθαλμοὶ αὐτῶν
  choice: их глаза увидели
  rationale: Сохраняет явно названный орган зрения и параллель с упоминанием слуха во второй части стиха.
- source_word: δόξαν φωνῆς αὐτῶν
  choice: славу их голоса
  rationale: 'Следует засвидетельствованному греческому тексту: повторяет слово «слава» и передаёт αὐτῶν как «их», не исправляя трудное чтение без рукописного основания.'
- source_word: ἤκουσεν τὸ οὖς αὐτῶν
  choice: их уши услышали
  rationale: Греческий текст буквально говорит об одном «ухе», однако в современном русском при общем множественном обладателе естественно распределительное множественное число; телесный образ и параллелизм с глазами сохранены.
theological_decisions:
- issue: Притяжательное местоимение при слове «голос»
  choice: «славу их голоса» — по переданному греческому αὐτῶν
  alternative: «славу Его голоса», то есть голоса Бога
  rationale: Контекст может указывать на Божий голос, и такое понимание делает фразу более связной, однако представленный греческий текст прямо имеет форму множественного числа «их». Поэтому основное чтение следует источнику, а контекстуально вероятное толкование отмечено в сноске.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного библейского параллелизма. Необычное «слава их голоса» оставлено намеренно как отражение трудного греческого чтения; пояснение вынесено в сноску.
