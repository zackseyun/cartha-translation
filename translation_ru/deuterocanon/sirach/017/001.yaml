translation:
  language: ru
  text: Господь сотворил человека из земли[a] и снова возвратил его в неё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человечество» или «человеческое существо»; греческое ἄνθρωπον стоит в единственном числе и представляет человечество в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριος
  choice: Господь
  rationale: Устоявшаяся передача греческого божественного титула κύριος в русском библейском стиле.
- source_word: ἔκτισεν
  choice: сотворил
  rationale: Передаёт значение κτίζω «создавать, творить» и сохраняет возвышенный контекст сотворения.
- source_word: ἐκ γῆς
  choice: из земли
  rationale: Точно выражает происхождение из γῆ и естественно звучит по-русски.
- source_word: ἄνθρωπον
  choice: человека
  rationale: Сохраняет единственное число греческого слова и допускает его собирательно-представительное значение без сведения текста только к мужчине.
- source_word: πάλιν
  choice: снова
  rationale: Явно передаёт πάλιν и подчёркивает возвращение к исходному месту.
- source_word: ἀπέστρεψεν
  choice: возвратил
  rationale: Каузативное употребление ἀποστρέφω здесь означает, что Господь вернул человека; «возвратил» естественно и точно передаёт эту мысль.
- source_word: εἰς αὐτήν
  choice: в неё
  rationale: Местоимение относится к земле; направление внутрь, выраженное εἰς, естественно передаётся русским «в неё».
theological_decisions:
- issue: Объём значения ἄνθρωπον
  choice: «человека» в единственном числе, с представительным значением всего человечества
  alternative: «человечество» или «человеческое существо»
  rationale: Форма единственного числа и вероятный отзвук повествования о сотворении сохраняются словом «человека», которое в русском языке может обозначать человека как родовое существо.
- issue: Действие Бога при возвращении человека в землю
  choice: «возвратил его»
  alternative: «обратил его назад» или «отправил его обратно»
  rationale: Текст прямо приписывает Господу действие возвращения, не уточняя его способа; выбранная формулировка сохраняет это утверждение без дополнительного истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис краток и близок к греческому оригиналу; местоимение «неё» ясно отсылает к земле.
