  text: He himself watches over the host of the height of heaven[b][a], and all men are earth and ashes.
translation:
  language: ru
  text: Он сам наблюдает[b] за воинством[a] небесной выси, а все люди — земля и пепел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о силе небесной выси». Греческое δύναμις может означать как «силу», так и, в библейском употреблении, небесное «воинство».'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол может также означать «посещает» или «надзирает за».
    reason: lexical_alternative
lexical_decisions:
- source_word: δύναμιν
  choice: воинстве
  rationale: В библейском греческом δύναμις может обозначать не только «силу», но и небесное воинство. В данном космическом контексте «воинство» естественно противопоставляется бренности всех людей; лексическая неоднозначность отмечена в сноске.
- source_word: ὕψους οὐρανοῦ
  choice: небесной выси
  rationale: Сочетание передано как описание высоты неба, без превращения ὕψους в не выраженный прямо божественный титул «Всевышний». «Небесная высь» сохраняет возвышенный космологический образ и звучит естественно по-русски.
- source_word: αὐτὸς
  choice: Он Сам
  rationale: Усилительное местоимение сохранено посредством «Сам»; прописная буква указывает на Бога как подразумеваемого субъекта в контексте.
- source_word: ἐπισκέπτεται
  choice: печётся о
  rationale: Глагол выражает деятельное попечение и надзор, а не обязательно краткое посещение. «Печётся о» сохраняет достойный регистр и естественно сочетается с Божьим попечением о небесном воинстве.
- source_word: οἱ ἄνθρωποι πάντες
  choice: все люди
  rationale: Русское «все люди» точно и недвусмысленно охватывает всё человечество, не сужая смысл до мужчин.
- source_word: γῆ καὶ σποδός
  choice: земля и пепел
  rationale: Сохранены конкретные греческие слова «земля» и «пепел», без уподобления более привычной формуле «прах и пепел».
theological_decisions:
- issue: Значение δύναμιν в небесном контексте
  choice: воинство
  alternative: сила; мощь
  rationale: Коллективное значение «воинство» засвидетельствовано в библейском употреблении и хорошо соответствует космическому контексту, однако возможное значение «сила» сохранено в сноске.
- issue: Обобщающее значение οἱ ἄνθρωποι πάντες
  choice: все люди
  alternative: все мужчины; весь род человеческий
  rationale: Здесь грамматически мужская форма имеет родовое значение и относится ко всему человечеству; русский перевод не должен создавать неоправданного ограничения по полу.
- issue: Образ человеческой бренности γῆ καὶ σποδός
  choice: земля и пепел
  alternative: прах и пепел
  rationale: Дословный образ греческого текста сохранён без гармонизации с традиционной библейской формулой, что удерживает самостоятельную формулировку Сираха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Небесная высь» передаёт космологический образ естественнее, чем тяжеловесное «высота неба»; именная конструкция «земля и пепел» сохраняет краткость и силу оригинала.
