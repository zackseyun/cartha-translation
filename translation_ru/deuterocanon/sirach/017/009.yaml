translation:
  language: ru
  text: чтобы они рассказывали о величии его дел[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о великих его деяниях».'
    reason: Лексема τὰ μεγαλεῖα может обозначать как величие, проявленное в делах, так и сами великие, могущественные деяния.
lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое значение союза и естественно сочетается в русском языке с глаголом в прошедшей форме, употреблённой здесь в значении сослагательного наклонения.
- source_word: διηγῶνται
  choice: они рассказывали
  rationale: Глагол означает подробно излагать, повествовать или рассказывать; «рассказывали» сохраняет речевой характер действия и звучит естественно.
- source_word: τὰ μεγαλεῖα
  choice: о величии
  rationale: Субстантивированное множественное число может обозначать величие, великие свершения или проявления могущества. В сочетании с τῶν ἔργων оборот «о величии … дел» точно и естественно передаёт смысл, не дублируя понятие деяний.
- source_word: τῶν ἔργων
  choice: его дел
  rationale: ἔργα здесь обозначает совершённые Богом дела; русское «дел» сохраняет широкое значение исходного слова.
- source_word: αὐτοῦ
  choice: его
  rationale: Притяжательное местоимение относится к Богу в ближайшем контексте. Строчная буква соответствует современному нейтральному издательскому употреблению и не меняет референта.
theological_decisions:
- issue: К кому относится местоимение αὐτοῦ
  choice: 'К Богу: «его дел».'
  alternative: Иной референт в непосредственном контексте.
  rationale: В контексте Сир 17 речь идёт о Божьих действиях по отношению к людям; грамматически и тематически местоимение указывает на Бога.
- issue: Конкретное или отвлечённое значение τὰ μεγαλεῖα
  choice: «о величии» — величие, явленное в Божьих делах.
  alternative: «о великих его деяниях» — конкретные могущественные свершения.
  rationale: Греческое выражение допускает оба оттенка. Основной текст сохраняет конструкцию «величие … дел», а примечание отмечает конкретное прочтение, не устраняя смысловую многозначность.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная без архаизмов. Местоимение «его» дано со строчной буквы в соответствии с нейтральной современной орфографической практикой.
