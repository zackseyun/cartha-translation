  source_fidelity: Перевод верно передаёт восклицательную конструкцию ὡς μεγάλη, «милосердие» (ἐλεημοσύνη), божественный титул «Господа» и направленность обращения к Богу. «Искупление» является допустимым доступным соответствием для ἐξιλασμός; притяжательное «Его» проясняет подразумеваемую связь с Господом и не меняет смысла.
