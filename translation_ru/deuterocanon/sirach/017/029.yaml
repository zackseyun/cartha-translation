  yaml_path: translation/deuterocanon/sirach/017/029.yaml
  text: How great is the mercy of the Lord[a], and his atonement for those who turn to him.
translation:
  language: ru
  text: Как велико милосердие Господа и как велико Его искупление[a] для тех, кто обращается к Нему!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очищение от греха»; более специальный вариант — «умилостивление».'
    reason: Греческое ἐξιλασμός допускает оттенки очищения от вины, искупления и умилостивления; сноска сохраняет эту смысловую широту.
lexical_decisions:
- source_word: ὡς μεγάλη
  choice: Как велико
  rationale: ὡς с прилагательным передаёт восклицание, а не сравнение. Повтор «как велико» во второй части делает эллиптическую греческую конструкцию естественной по-русски.
- source_word: ἐλεημοσύνη
  choice: милосердие
  rationale: При указании на Господа слово означает милостивое сострадание, а не раздачу милостыни.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: κύριος употреблено как божественный титул; традиционное и понятное русское соответствие — «Господь».
- source_word: ἐξιλασμός
  choice: искупление
  rationale: «Искупление» сохраняет смысл устранения вины и восстановления отношений, не сводя слово к одной узкой богословской модели.
- source_word: τοῖς ἐπιστρέφουσιν
  choice: для тех, кто обращается
  rationale: В религиозном контексте ἐπιστρέφω обозначает обращение или возвращение к Богу; «обращается» естественно передаёт этот оттенок покаяния.
- source_word: ἐπʼ αὐτόν
  choice: к Нему
  rationale: С ἐπιστρέφω предлог выражает направленность обращения к Господу; местоимение с прописной буквы соответствует принятому благоговейному русскому оформлению.
theological_decisions:
- issue: Значение ἐξιλασμός
  choice: искупление
  alternative: очищение от греха; умилостивление
  rationale: Основной вариант передаёт устранение вины и примирение, но не уточняет механизм искупления сверх сказанного в греческом тексте; более технические возможности отмечены в сноске.
- issue: Отнесение второго существительного к Господу
  choice: Его искупление
  alternative: искупление
  rationale: В греческом притяжательное отношение во второй части подразумевается контекстом. Местоимение делает русскую фразу ясной, не утверждая отдельной доктринальной схемы.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной восклицательной интонацией. Эллипсис оригинала раскрыт повтором «как велико» ради ясности и естественности; богословская терминология оставлена доступной, а технические соответствия вынесены в сноску.
