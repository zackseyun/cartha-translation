lexical_decisions:
- source_word: ὄνομα ἁγιασμοῦ
  choice: святое имя
  rationale: Греческое сочетание буквально означает «имя святости/освящения», но в данном контексте естественно передаётся по-русски как «святое имя», без неясного и тяжеловесного оборота.
- source_word: αἰνέσουσιν
  choice: будут восхвалять
  rationale: Будущее время и значение глагола αἰνέω переданы прямо; «восхвалять» сохраняет возвышенный богослужебный оттенок.
- source_word: καί
  choice: и
  rationale: Сохранена соединительная связь с предшествующим высказыванием.
theological_decisions:
- issue: Значение родительного ἁγιασμοῦ при ὄνομα
  choice: святое имя
  alternative: имя святости / имя освящения
  rationale: Форма допускает буквальный родительный оборот, однако «святое имя» передаёт его вероятную качественную функцию и звучит естественно, не вводя дополнительного учения об освящении.
