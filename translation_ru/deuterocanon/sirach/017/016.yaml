lexical_decisions:
- source_word: ἅπαντα τὰ ἔργα αὐτῶν
  choice: все их дела
  rationale: «Все» передаёт усиленную полноту ἅπαντα, а «дела» естественно охватывает поступки и результаты деятельности, не сужая смысл до отдельных действий.
- source_word: ὡς ὁ ἥλιος
  choice: словно солнце
  rationale: Сохраняется явное сравнение с солнцем без добавления отсутствующих в греческом тексте слов «ясны» или «видны».
- source_word: ἐναντίον αὐτοῦ
  choice: перед Ним
  rationale: Естественно передаёт значение присутствия и открытости перед Богом; прописная буква ясно указывает на божественного референта в русском религиозном тексте.
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: Его глаза
  rationale: Сохранён конкретный антропоморфный образ греческого текста; современное «глаза» доступнее обычному читателю, чем архаическое «очи».
- source_word: ἐνδελεχεῖς
  choice: непрестанно обращены
  rationale: Предикативное прилагательное выражает постоянство и неослабевающее внимание; русская наречно-глагольная конструкция звучит естественно.
- source_word: ἐπὶ τὰς ὁδοὺς αὐτῶν
  choice: на их пути
  rationale: «Пути» сохраняет образ дороги и одновременно допускает этический смысл — образ жизни и поведение.
theological_decisions:
- issue: Антропоморфный язык о Божьем знании
  choice: «Его глаза непрестанно обращены на их пути»
  alternative: «Он непрестанно наблюдает за их поведением»
  rationale: Конкретный образ глаз сохранён, поскольку он принадлежит исходному тексту и выражает постоянное Божье ведение, не сводя его к отвлечённой формулировке.
- issue: Смысл сравнения с солнцем
  choice: 'Сохранить буквальное сравнение: «перед Ним, словно солнце»'
  alternative: «ясны перед Ним, как солнце»
  rationale: Греческий текст прямо не содержит определения «ясны». Перевод сохраняет образ и его некоторую неоднозначность, а вероятный смысл полной открытости поясняется в сноске.
