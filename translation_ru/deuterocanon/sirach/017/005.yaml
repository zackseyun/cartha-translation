lexical_decisions:
- source_word: διαβούλιον
  choice: способность рассуждать
  rationale: Существительное обозначает рассуждение, обдумывание или способность к взвешенному суждению. Такой перевод естественен по-русски и не сужает значение до совета, данного кем-либо.
- source_word: γλῶσσαν
  choice: язык
  rationale: Сохранено конкретное название органа, вероятно также подразумевающее речь, как и в греческом перечислении.
- source_word: ὀφθαλμούς
  choice: глаза
  rationale: Конкретное множественное число сохранено без замены на абстрактное «зрение».
- source_word: ὦτα
  choice: уши
  rationale: Конкретное название органов сохранено в соответствии с формой исходного перечня.
- source_word: καρδίαν
  choice: сердце
  rationale: Буквальный перевод сохраняет библейское представление о сердце как средоточии не только чувств, но также мысли и воли.
- source_word: ἔδωκεν
  choice: дал
  rationale: Прямой и стилистически нейтральный эквивалент аориста в данном повествовательном контексте.
- source_word: διανοεῖσθαι
  choice: чтобы они могли мыслить
  rationale: Инфинитив выражает цель или назначение дарованных способностей. «Мыслить» передаёт умственную деятельность, а конструкция с «чтобы» естественно воспроизводит целевое отношение по-русски.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж непосредственно передан русским косвенным дополнением.
theological_decisions:
- issue: Антропологический смысл καρδία в перечне человеческих способностей
  choice: Сохранить «сердце», пояснив в сноске его мыслительную и волевую функцию.
  alternative: разум; понимание
  rationale: Так сохраняется библейская антропология и не устраняется присущее тексту соединение телесного образа с внутренней познавательной способностью.
- issue: Конкретные органы и абстрактные способности в одном перечне
  choice: 'Сохранить смешанный перечень: «способность рассуждать, язык и глаза, уши и сердце».'
  alternative: рассудок, речь, зрение, слух и разум
  rationale: Греческий текст сам сочетает абстрактное понятие с названиями органов; сглаживание всего ряда в абстрактные способности было бы излишним толкованием.
translation_notes:
  register: Современный литературный русский язык; фраза проста и dignified, при этом сохранён компактный, смешанный перечень способностей и органов из греческого текста.
