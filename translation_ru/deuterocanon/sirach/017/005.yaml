  text: Он дал им рассудительность[a], язык, глаза, уши и сердце[b], чтобы они могли размышлять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обдумывание»; греческое слово может обозначать обдумывание или способность выносить взвешенные суждения.'
