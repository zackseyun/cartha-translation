translation:
  language: ru
  text: 'И сказал им: «Берегитесь всякой несправедливости»[a], и каждому из них дал повеление относительно его ближнего.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Остерегайтесь всякого неправого дела». Греческое выражение кратко и допускает оба близких по смыслу перевода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἀπὸ παντὸς ἀδίκου
  choice: Берегитесь всякой несправедливости
  rationale: Сочетание προσέχετε с ἀπό выражает предостережение. «Берегитесь» естественно передаёт этот смысл по-русски, а «всякой несправедливости» сохраняет широкий нравственный охват субстантивированного ἀδίκου.
- source_word: ἐνετείλατο
  choice: дал заповедь
  rationale: Глагол обозначает властное повеление или предписание. В контексте наставления Бога выражение «дал заповедь» сохраняет его силу и библейский регистр.
- source_word: ἑκάστῳ
  choice: каждому из них
  rationale: 'Передаёт выраженное в греческом распределительное значение: предписание обращено к каждому в отдельности.'
- source_word: περὶ τοῦ πλησίον
  choice: о ближнем
  rationale: πλησίον в нравственном контексте означает ближнего, другого человека. Краткое «о ближнем» сохраняет структуру и некоторую смысловую открытость оригинала, не добавляя пояснения о конкретном содержании заповеди.
theological_decisions:
- issue: Нравственный объём ἀδίκου
  choice: «всякой несправедливости»
  alternative: «всякого неправого дела»; «всякой неправды»
  rationale: «Несправедливость» подчёркивает нравственное и общественное измерение предостережения, согласующееся с последующим упоминанием ближнего, но не превращает слово в узкий богословский термин.
- issue: Содержание заповеди о ближнем
  choice: Не уточнять, как именно следует поступать с ближним
  alternative: «заповедал каждому, как поступать с ближним»
  rationale: Греческое περὶ τοῦ πλησίον означает лишь «о/относительно ближнего». Добавление «как поступать» сделало бы подразумеваемое содержание явным и тем самым сузило бы лаконичную формулировку источника.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис близок к греческому, но остаётся естественным; формулировка «дал заповедь о ближнем» намеренно сохраняет лаконичность и смысловую открытость оригинала.
