translation:
  language: ru
  text: Каждому народу Он поставил правителя, и Израиль — доля Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκάστῳ ἔθνει
  choice: каждому народу
  rationale: 'Дательный падеж передаёт распределительное значение: речь идёт о каждом из народов.'
- source_word: κατέστησεν
  choice: поставил
  rationale: Глагол означает назначение или установление кого-либо в определённом положении; «поставил» естественно сочетается с обозначением правителя и сохраняет библейскую образность.
- source_word: ἡγούμενον
  choice: правителя
  rationale: Субстантивированное причастие обозначает того, кто руководит или управляет; «правитель» точно передаёт властную функцию без лишней конкретизации.
- source_word: μερὶς
  choice: доля
  rationale: Существительное означает долю или часть; «доля» кратко и естественно сохраняет образ принадлежности и распределения.
- source_word: Κυρίου
  choice: Господа
  rationale: Родительный падеж передан как принадлежность; κύριος в данном библейском контексте переводится «Господь».
- source_word: Ἰσραήλ
  choice: Израиль
  rationale: Общепринятая русская форма имени народа.
- source_word: ἐστιν
  choice: —
  rationale: Настоящая связка в русском именном сказуемом естественно передаётся тире без явного глагола «есть».
theological_decisions:
- issue: Связь между назначением правителей народам и принадлежностью Израиля Господу
  choice: 'Сохранён соединительный союз «и»: «и Израиль — доля Господа»'
  alternative: «но Израиль — собственная доля Господа»
  rationale: Греческое καί буквально соединяет предложения. Контраст может подразумеваться контекстом, но его не следует усиливать союзом «но» или словом «собственная», которых в исходном тексте нет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Он» написано с прописной буквы как ясная отсылка к Богу в контексте стиха; синтаксис краток и близок к греческому оригиналу.
