  source_fidelity: 'Перевод верно передаёт смысл греческого текста: Бог внушает остальным живым существам страх перед человеком и предоставляет человеку власть над зверями и птицами. «Внушил ... страх перед ним» естественно раскрывает значение τὸν φόβον αὐτοῦ, не превращая его в страх самого человека. «Дал ему власть над» — обоснованное русское синтаксическое восполнение эллиптического греческого инфинитива κατακυριεύειν; оно соответствует и смыслу контекста, и отражённому в английском аудите пониманию предоставленной власти.'
