  text: And he placed his fear upon all flesh[a], and to rule over beasts and birds.
translation:
  language: ru
  text: И внушил он страх перед ним всякой плоти[a] и дал ему власть над зверями и птицами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всем живым существам». Буквально: «всякой плоти» — здесь это выражение широко обозначает живых существ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθηκεν
  choice: внушил
  rationale: В сочетании с φόβον и обозначением тех, на кого направлен страх, русское «внушил страх» естественно передаёт буквальное «поместил страх», не меняя смысла.
- source_word: τὸν φόβον αὐτοῦ
  choice: страх перед ним
  rationale: Речь идёт не о его собственном страхе, а о страхе, который испытывают перед человеком прочие живые существа; такая формулировка устраняет грамматическую неясность по-русски, сохраняя референт местоимения.
- source_word: ἐπὶ πάσης σαρκός
  choice: всякой плоти
  rationale: Сохранена библейская идиома «всякая плоть»; в данном контексте она охватывает живых существ, а не обозначает нравственно испорченную человеческую природу.
- source_word: κατακυριεύειν
  choice: дал ему власть над
  rationale: Инфинитив выражает предоставленную человеку возможность господствовать. По-русски связь с ἔθηκεν требует естественного синтаксического восполнения; «дал ему власть» передаёт сильное значение κατακυριεύω, не превращая фразу в обрывочную конструкцию.
- source_word: θηρίων
  choice: зверями
  rationale: «Звери» — краткий, понятный и стилистически уместный эквивалент θηρία; он может обозначать животных, особенно диких.
- source_word: πετεινῶν
  choice: птицами
  rationale: Естественный современный эквивалент для πετεινά без добавления отсутствующего в греческом тексте выражения «небесными».
theological_decisions:
- issue: Единственное число как собирательное обозначение человека
  choice: 'Сохранить мужское единственное число: «перед ним», «ему».'
  alternative: 'Передать коллективный смысл множественным числом: «перед ними», «им».'
  rationale: Греческое αὐτοῦ стоит в единственном числе и в контексте относится к человеку как представительному единственному; перевод не сглаживает эту форму до множественного числа.
- issue: Значение σάρξ в выражении πάσης σαρκός
  choice: Перевести идиомой «всякой плоти» и пояснить её в сноске.
  alternative: Передать непосредственно как «всем живым существам» или «всякой живой твари».
  rationale: Формулировка сохраняет образ и лексику источника, тогда как сноска сообщает широкий коллективный смысл, не приписывая слову σάρξ нравственно-богословского оттенка.
- issue: Синтаксическая зависимость κατακυριεύειν
  choice: 'Передать как дарование власти человеку: «дал ему власть».'
  alternative: 'Формально оставить инфинитив: «и властвовать над зверями и птицами».'
  rationale: Греческая фраза с инфинитивом сжата и допускает понимание предоставленной способности или полномочия. Русское восполнение делает связь ясной, но не уточняет способ осуществления этой власти.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Идиома «всякая плоть» сохранена ради образности источника и снабжена ясной сноской; синтаксис сделан естественным для русского чтения.
