lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: После этого
  rationale: Передаёт явную временную последовательность естественным современным русским выражением.
- source_word: ἐξαναστήσεται
  choice: восстанет
  rationale: Сохраняет буквальный образ вставания и оттенок решительного действия, не сводя его к нейтральному «начнёт действовать».
- source_word: ἀνταποδώσει
  choice: воздаст
  rationale: Точно передаёт ответное возмездие и уместно звучит в современном литературном русском библейском тексте.
- source_word: τὸ ἀνταπόδομα αὐτῶν
  choice: их воздаяние
  rationale: Сохраняет смысл заслуженного ответного возмездия и лексическую связь с глаголом «воздаст».
- source_word: εἰς κεφαλὴν αὐτῶν ἀποδώσει
  choice: обратит ... на их же голову
  rationale: Передаёт возвращение воздаяния к самим виновным и сохраняет образ исходного греческого оборота; частица «же» естественно подчёркивает возвратность последствий.
theological_decisions:
- issue: Характер Божьего действия в языке суда
  choice: 'Сохранено личное и деятельное описание: «он восстанет и воздаст им».'
  alternative: «Он допустит, чтобы они испытали последствия своих поступков».
  rationale: Греческий текст говорит о личном ответном действии субъекта, а не только о безличном наступлении последствий; перевод не смягчает заложенное в тексте напряжение.
- issue: Регистр местоимения, относящегося к Богу
  choice: Строчная форма «он».
  alternative: Прописная форма «Он».
  rationale: Греческое письмо не кодирует современную русскую практику почтительного написания божественных местоимений с прописной буквы; строчная форма не вносит дополнительного конфессионального оформления.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Сохранены антропоморфный образ «восстанет», повтор корня «воздаст — воздаяние» и идиома с единственным числом «голову».
