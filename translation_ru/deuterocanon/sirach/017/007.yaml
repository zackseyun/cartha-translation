lexical_decisions:
- source_word: ἔθηκεν τὸν ὀφθαλμὸν αὐτοῦ
  choice: устремил Свой взор
  rationale: 'Буквально: «положил Свой глаз». Русское выражение «устремил взор» естественно передаёт направленное внимание и сохраняет зрительный образ, не прибегая к архаичному обороту.'
- source_word: ἐπὶ τὰς καρδίας αὐτῶν
  choice: на их сердца
  rationale: Предлог ἐπί с винительным указывает на направленность. «Сердца» сохраняет библейский образ внутреннего мира человека, включая разум и волю.
- source_word: δεῖξαι
  choice: чтобы показать
  rationale: Инфинитив выражает цель; «показать» непосредственно передаёт значение глагола и поддерживает зрительный образ первой части стиха.
- source_word: τὸ μεγαλεῖον τῶν ἔργων αὐτοῦ
  choice: величие Своих дел
  rationale: «Величие» передаёт τὸ μεγαλεῖον, а «дел» сохраняет широкий смысл ἔργων как Божьих деяний. Возвратное «Своих» ясно относит дела к подлежащему.
theological_decisions:
- issue: Антропоморфный образ Божьего глаза
  choice: Сохранить зрительный образ в выражении «устремил Свой взор»
  alternative: «обратил внимание на их сердца» или буквальное «положил Свой глаз на их сердца»
  rationale: Абстрактное «обратил внимание» устранило бы образ исходного текста, тогда как дословное «положил глаз» в современном русском имеет нежелательные разговорные оттенки. «Устремил взор» сохраняет образ и остаётся естественным и достойным.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но не архаичным звучанием. Заглавные буквы в местоимениях «Свой», «Своих» указывают на Бога и соответствуют принятой русской библейской традиции.
