  text: A man's almsgiving is like a seal with him[b][a], and he will preserve a person's kindness like the pupil of the eye.
translation:
  language: ru
  text: Милостыня человека — как печать при нём, а благодеяние человека сбережёт[a], как зеницу ока[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте субъект глагола не назван. Возможно также понимание: «Бог сбережёт благодеяние человека».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «как зрачок [глаза]»; «зеница ока» — устойчивое русское выражение для того, что особенно тщательно оберегают.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεημοσύνη
  choice: милостыня
  rationale: В эллинистическом иудейском употреблении слово обозначает конкретную помощь нуждающимся. «Милостыня» точнее передаёт этот смысл, чем более широкие «милосердие» или «благотворительность».
- source_word: ἀνδρός
  choice: человека
  rationale: Хотя греческое существительное имеет мужской род и может означать мужчину, в данном изречении оно естественно воспринимается обобщённо. Русское «человека» сохраняет общий смысл и не создаёт неоправданного акцента на поле.
- source_word: σφραγίς
  choice: печать
  rationale: Прямое соответствие сохраняет образ знака, имеющего ценность и остающегося при владельце, не уточняя его как перстень или иной предмет.
- source_word: μετ᾿ αὐτοῦ
  choice: остающаяся при нём
  rationale: Буквальное «при нём» само по себе звучит по-русски неполно; причастный оборот естественно выражает образ печати, которая находится и остаётся с человеком.
- source_word: χάριν
  choice: благодеяние
  rationale: В параллели с милостыней слово обозначает оказанное добро или благодетельный поступок. «Благодеяние» сохраняет предметный смысл и не привносит богословских оттенков слова «благодать».
- source_word: ἀνθρώπου
  choice: человека
  rationale: Это общее обозначение человеческого существа; русский родительный падеж «человека» точно и естественно передаёт его.
- source_word: κόρην
  choice: зеницу ока
  rationale: Греческое слово буквально обозначает зрачок. Устойчивое русское сравнение «как зеницу ока» передаёт и телесный образ, и смысл особенно бережного хранения.
- source_word: συντηρήσει
  choice: он сохранит
  rationale: Форма будущего времени третьего лица единственного числа передана без добавления названного субъекта. «Сохранит» соответствует смыслу бережного хранения и позволяет удержать синтаксическую неопределённость оригинала.
theological_decisions:
- issue: Необозначенный субъект глагола συντηρήσει
  choice: 'Сохранено неявное «он»: «он сохранит»'
  alternative: «Бог сохранит» или безлично-обобщённое «сохранят»
  rationale: В греческом предложении субъект прямо не назван. Контекст может позволять понимать его как Бога, однако явное добавление «Бог» разрешило бы оставленную текстом неопределённость. Русское местоимение указывает лишь грамматическое лицо и сопровождается примечанием.
translation_notes:
  register: Современный литературный русский с достоинством библейского изречения. Устойчивое выражение «зеница ока» намеренно сохранено как широко понятный библейский образ; более архаичные «муж» и отвлечённая «благодать» не использованы. Параллелизм двух частей и неопределённость субъекта второй части сохранены.
