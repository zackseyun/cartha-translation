  text: What is brighter than the sun? Yet even this fails[b][a], and flesh and blood devises evil.
translation:
  language: ru
  text: Что ярче солнца? Но и оно меркнет[a], а плоть и кровь[b] замышляют зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «угасает», «исчезает» или «затмевается»; греческий глагол допускает все эти оттенки.'
