    text: «Плоть и кровь» — образное обозначение смертных людей.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί φωτεινότερον ἡλίου
  choice: Что ярче солнца?
  rationale: 'Вопросительное τί имеет безличное значение «что», а родительный ἡλίου после сравнительной степени естественно передаётся русской конструкцией без предлога: «ярче солнца».'
- source_word: καὶ τοῦτο ἐκλείπει
  choice: Но и оно меркнет
  rationale: Местоимение относится к солнцу; καί в контексте передаёт уступительно-противительное «но и». Глагол ἐκλείπει может означать ослабевать, прекращаться, исчезать или затмеваться; «меркнет» сохраняет образ света, не ограничивая смысл исключительно астрономическим затмением.
- source_word: σάρκα καὶ αἷμα
  choice: плоть и кровь
  rationale: Сохранён конкретный антропологический оборот, обозначающий смертного человека; по-русски он понятен и не требует замены отвлечённым словом «человечество».
- source_word: πονηρὸς / πονηρόν
  choice: зло
  rationale: По смыслу консультационного чтения слово обозначает нравственное зло как предмет человеческого замысла. В переданной строке Swete формы πονηρὸς и σάρκα создают падежное несоответствие этому синтаксису; перевод следует контекстуально связному чтению πονηρόν ... σὰρξ καὶ αἷμα, лежащему в основе засвидетельствованной традиции перевода.
- source_word: ἐνθυμήσεται
  choice: замышляют
  rationale: Глагол означает внутренне обдумывать или замышлять. Русское настоящее время передаёт общее изречение естественнее греческого будущего, имеющего здесь обобщающий оттенок.
theological_decisions:
- issue: Антропологический оборот «плоть и кровь»
  choice: Сохранить «плоть и кровь» как обозначение смертного человека
  alternative: Передать как «смертные люди» или «человек»
  rationale: Буквальный образ подчёркивает телесность и ограниченность человека, не привнося позднейших специальных значений слова «плоть».
- issue: Синтаксис заключительной части при расхождении падежных форм
  choice: 'Передать контекстуально связный смысл: «плоть и кровь замышляют зло»'
  alternative: 'Следовать переданным формам буквально: «злой подумает о плоти и крови»'
  rationale: Буквальное прочтение указанных форм грамматически возможно лишь с резкой сменой смысла и плохо связано с контекстом; консультационный слой отражает известное чтение с πονηρόν как дополнением и σὰρξ καὶ αἷμα как подлежащим. Выбранный вариант сохраняет антитезу между ограниченностью светила и нравственной немощью смертного человека.
translation_notes:
  register: Современный литературный русский язык; краткая риторическая форма и параллелизм сохранены. «Меркнет» звучит естественно и образно, а «замышляют зло» передаёт нравственный смысл без конфессионального уточнения.
