lexical_decisions:
- source_word: ἐπιστήμην συνέσεως
  choice: знанием и разумением
  rationale: Греческое сочетание буквально связывает «знание» с «разумением». Русская парная формула естественнее тяжеловесного «знанием разумения» и сохраняет оба смысловых компонента, не превращая их в две явно раздельные способности.
- source_word: ἐνέπλησεν
  choice: наполнил
  rationale: Прямой и естественный эквивалент образа наполнения в аористе.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение относится к людям, упомянутым в контексте.
- source_word: ἀγαθὰ καὶ κακὰ
  choice: добро и зло
  rationale: Краткая русская формула передаёт наиболее вероятный контекстуальный смысл нравственных категорий, сохраняя при этом в примечании предметно-оценочную возможность греческих субстантивированных прилагательных.
- source_word: ὑπέδειξεν
  choice: показал
  rationale: Глагол означает «показать, указать, дать увидеть»; «показал» ясно и естественно в данном контексте.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж передан как косвенное дополнение при глаголе «показал».
theological_decisions:
- issue: Следует ли понимать ἀγαθὰ καὶ κακὰ как нравственные категории или как полезные и вредные вещи
  choice: добро и зло
  alternative: благое и дурное; хорошие и плохие вещи
  rationale: Контекст говорит о дарованной человеку способности понимания и различения, поэтому нравственный смысл наиболее вероятен. Однако греческая форма допускает более широкое обозначение благого и дурного, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формула «знанием и разумением» выбрана ради ясности и естественности, при сохранении тесной связи двух греческих существительных.
