  source_fidelity: 'Текст точно передаёт обе части греческого стиха: οὐκ ἐκρύβησαν передано пассивной конструкцией «не были скрыты», ἀπ᾿ αὐτοῦ — «от Него», а πᾶσα ἁμαρτία αὐτῶν и ἔναντι Κυρίου — «каждый их грех был пред Господом». «Несправедливые дела» является допустимым современным выражением для αἱ ἀδικίαι и сохраняет множественность конкретных проступков.'
