  text: Their injustices were not hidden from him[a], and every sin of theirs was before the Lord.
translation:
  language: ru
  text: Их несправедливые дела не были скрыты от Него[a], и каждый их грех был пред Господом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не ускользнули от Его внимания». Буквально по-гречески: «не были скрыты от Него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐκρύβησαν
  choice: не были скрыты
  rationale: Пассивная форма буквально передаёт образ дел, которые не остались сокрытыми; это точнее сохраняет форму греческого текста, чем пояснительное «не ускользнули от внимания».
- source_word: αἱ ἀδικίαι αὐτῶν
  choice: их несправедливые дела
  rationale: ἀδικίαι может обозначать несправедливость, неправду или конкретные неправедные поступки. Сочетание «несправедливые дела» естественно по-русски и сохраняет направленность на поступки, выраженную множественным числом.
- source_word: ἀπ᾿ αὐτοῦ
  choice: от Него
  rationale: Предлог ἀπό с родительным падежом прямо передаётся как «от»; в сочетании «скрыты от Него» русский язык естественно выражает недоступность чьему-либо знанию или взору.
- source_word: πᾶσα ἁμαρτία αὐτῶν
  choice: каждый их грех
  rationale: Единственное число с πᾶσα имеет распределительное значение и подчёркивает каждый отдельный грех, а не грех как отвлечённое понятие.
- source_word: ἔναντι Κυρίου
  choice: пред Господом
  rationale: ἔναντι означает «перед, в присутствии». «Пред Господом» — краткая, dignified и привычная библейская формула, непосредственно сохраняющая пространственный образ оригинала.
theological_decisions:
- issue: Божественное знание о человеческой неправде и грехе
  choice: Сохранено утверждение, что несправедливые дела не скрыты от Бога и каждый грех находится пред Господом.
  alternative: «Ни один их грех не ускользнул от внимания Господа».
  rationale: Греческий текст использует образы несокрытости и нахождения пред Господом, а не формулирует отвлечённое учение о всеведении. Перевод сохраняет эту образность и не расширяет богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Пред Господом» выбрано вместо более разговорного «перед Господом», тогда как остальная фраза избегает архаизмов. Прописная буква в «Него» служит принятой русской формой почтительного местоименного обозначения Бога, не меняя смысла исходного текста.
