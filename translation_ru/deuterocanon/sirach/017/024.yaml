    rationale: При начальном «от умершего» русский читатель может понять оборот как «благодарение исчезает у/отходит от умершего». Перестановка «Благодарение от умершего ... прекращается» ясно обозначает отсутствие благодарения, исходящего от умершего, что соответствует ἀπὸ νεκροῦ ... ἀπόλλυται ἐξομολόγησις.
  revised_text: Благодарение от умершего, словно от того, кого уже нет, прекращается; живой же и здоровый восхвалит Господа.
