- from: От умершего, словно от того, кого уже нет, исчезает благодарение[a]; живой же и здоровый восхвалит Господа.
  to: Благодарение от умершего, словно от того, кого уже нет, прекращается; живой же и здоровый восхвалит Господа.
  rationale: 'Исправлен только порядок слов в первой части, чтобы однозначнее передать, что благодарение не исходит от умершего и прекращается. Риторический характер сравнения «словно от того, кого уже нет» сохранён; текст не делает самостоятельного утверждения о посмертном существовании. Сноска слегка уточнена: «признание» добавлено как современный общий эквивалент лексического значения наряду с традиционным «исповедание».'
  reviewer_model: gpt-5.6-terra
