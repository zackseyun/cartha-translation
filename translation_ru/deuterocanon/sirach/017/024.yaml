  yaml_path: translation/deuterocanon/sirach/017/024.yaml
  text: From the dead, as from one who no longer exists, thanksgiving perishes; but one who is alive and well will praise the Lord.
translation:
  language: ru
  text: Благодарение от умершего, словно от того, кого уже нет, прекращается; живой же и здоровый восхвалит Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ νεκροῦ
  choice: От умершего
  rationale: 'Предлог ἀπό с родительным указывает на источник: благодарение уже не исходит от умершего. «От умершего» естественно передаёт субстантивированное νεκροῦ и его единственное число.'
- source_word: ὡς μηδὲ ὄντος
  choice: словно от того, кого уже нет
  rationale: Формулировка сохраняет сравнительный и риторический характер оборота, не превращая его в отдельное метафизическое утверждение о состоянии умерших.
- source_word: ἀπόλλυται
  choice: исчезает
  rationale: Глагол означает «гибнуть, пропадать, утрачиваться». «Исчезает» передаёт образное прекращение благодарения и звучит естественно по-русски.
- source_word: ἐξομολόγησις
  choice: благодарение
  rationale: В Септуагинте существительное часто обозначает благодарное признание и хвалу Богу. «Благодарение» сохраняет смысловую связь с последующим «восхвалит», не сводя оба греческих слова к одному русскому корню.
- source_word: ζῶν καὶ ὑγιὴς
  choice: живой же и здоровый
  rationale: Оба прилагательных употреблены субстантивированно; краткая русская конструкция сохраняет параллелизм и противопоставление умершему.
- source_word: αἰνέσει τὸν κύριον
  choice: восхвалит Господа
  rationale: Будущее время передано будущим совершенного вида; «восхвалит» естественно выражает направленную к Господу хвалу и отличает αἰνέω от ἐξομολόγησις.
theological_decisions:
- issue: Смысл слов «словно от того, кого уже нет» применительно к умершему
  choice: Сохранить как риторическое сравнение
  alternative: 'Передать буквально: «словно от несуществующего»'
  rationale: Стих говорит о прекращении деятельного благодарения со стороны умершего и противопоставляет его живому и здоровому человеку. Сравнительная частица ὡς не позволяет превращать фразу в однозначное учение о посмертном существовании или несуществовании.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным регистром мудрой сентенции. Сохранены параллелизм двух частей, будущее время второй части и богословская напряжённость риторического сравнения.
