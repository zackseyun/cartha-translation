review_pass:
  verdict: revise
  source_fidelity: 'Смысл и синтаксическое противопоставление в целом переданы верно: ἀπὸ νεκροῦ сохраняется как исходная точка, ὡς μηδὲ ὄντος — как риторическое сравнение, а ζῶν καὶ ὑγιής противопоставлен умершему. Однако «исчезает благодарение от умершего» в данном порядке слов может читаться по-русски как благодарение, покидающее умершего, а не как благодарение, прекращающееся со стороны умершего. Более прямой порядок устраняет эту двусмысленность, сохраняя образ ἀπόλλυται.'
  naturalness: Фраза «Благодарение от умершего, словно от того, кого уже нет, прекращается» несколько книжна, но естественна для современного литературного библейского регистра и яснее исходного порядка. «Живой же и здоровый» лаконично и уместно передаёт субстантивированные причастие и прилагательное.
  terminology: «Благодарение» удачно передаёт ἐξομολόγησις в данном контексте, не стирая различия с αἰνέσει («восхвалит»). «Господь» для κύριος соответствует принятому библейскому употреблению. Примечание корректно сохраняет лексическую широту слова; «признание» точнее и современнее, чем «исповедание», как один из альтернативных вариантов.
  issues:
