    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: Но
  rationale: Передаёт противительный переход к Божьему ответу на покаяние; по-русски звучит естественно и сдержанно.
- source_word: μετανοοῦσιν
  choice: кающимся
  rationale: Субстантивированное причастие в дательном падеже обозначает тех, кто кается; русская форма сохраняет деятельный смысл покаяния.
- source_word: ἔδωκεν
  choice: даровал
  rationale: Соответствует значению «дал» и естественно сочетается с существительным «возвращение», сохраняя оттенок дара.
- source_word: ἐπάνοδον
  choice: возвращение
  rationale: Близко передаёт значение возвращения или пути назад, не уточняя сверх текста, идёт ли речь о возвращении к Богу, восстановлении или возобновлении прежнего положения.
- source_word: παρεκάλεσεν
  choice: ободрил
  rationale: Передаёт широкий поддерживающий смысл глагола, который может означать ободрение, утешение или увещание, не сводя его исключительно к приказу либо утешению.
- source_word: ἐκλείποντας
  choice: ослабевающих
  rationale: Сохраняет широкое значение «изнемогать, ослабевать, сдаваться», не ограничивая его физической или духовной немощью.
- source_word: ὑπομονήν
  choice: терпением
  rationale: Творительный падеж позволяет компактно передать терпеливую стойкость как содержание или средство ободрения; неоднозначность греческой конструкции отмечена в сноске.
theological_decisions:
- issue: Смысл ἐπάνοδον в контексте покаяния
  choice: возвращение
  alternative: путь назад; восстановление
  rationale: Перевод не разворачивает существительное в законченное вероучительное утверждение и сохраняет открытым, подразумевается ли возвращение к Богу, восстановление или новое положение.
- issue: Связь ὑπομονήν с παρεκάλεσεν и ἐκλείποντας
  choice: ободрил ослабевающих терпением
  alternative: призвал ослабевающих к стойкости
  rationale: Греческая фраза синтаксически сжата. Основной текст сохраняет образ поддерживающего ободрения, а сноска указывает возможное понимание терпения как качества, к которому призывают.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимение «Он» написано с прописной буквы по русской библейской издательской традиции; синтаксис остаётся ясным для обычного читателя, а неоднозначности исходного текста вынесены в сноски.
