  choice: Сохранены выражения «перед ним» и «от его глаз».
  alternative: 'Передать отвлечённо: «он всегда знает их поступки» или «не укроются от его взора».'
  rationale: Греческий текст выражает постоянное Божье знание через конкретные зрительные образы. Их сохранение не сводит смысл к абстрактному утверждению и поддерживает тон литературы мудрости.
