  text: И облёк их силой и создал их по Своему образу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνέδυσεν
  choice: облек
  rationale: Глагол буквально означает «одевать, облекать»; сочетание «облек силой» сохраняет греческую метафору и звучит достойно и понятно по-русски.
- source_word: ἰσχύν
  choice: силой
  rationale: ἰσχύς обозначает силу или мощь; «сила» — естественный современный эквивалент без усиления смысла до отвлечённой «власти».
- source_word: κατ᾿ εἰκόνα αὐτοῦ
  choice: по Своему образу
  rationale: Так передаётся конструкция κατά с винительным падежом и сохраняется явная перекличка с языком повествования о сотворении человека в Бытии.
- source_word: ἐποίησεν
  choice: сотворил
  rationale: В контексте создания людей «сотворил» естественно передаёт ποιέω и сохраняет библейскую аллюзию, не добавляя нового содержания.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение сохраняет множественное число и отсылает к людям, упомянутым в контексте.
theological_decisions:
- issue: Аллюзия на сотворение человека по образу Бога в κατ᾿ εἰκόνα αὐτοῦ
  choice: по Своему образу
  alternative: в Своём образе
  rationale: Выбранный оборот точно отражает греческую конструкцию и узнаваемо отсылает к Быт 1:26–27, не уточняя сверх текста природу образа Божьего.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Метафора «облек силой» сохранена; прописная буква в «Своему» однозначно указывает на Бога как субъект.
