  yaml_path: translation/deuterocanon/sirach/017/002.yaml
  text: He gave them a fixed number of days and a set time[b][a], and he gave them authority over the things on it.
translation:
  language: ru
  text: Он дал им определённое число дней и назначенный срок[a] и дал им власть над тем, что на ней[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отведённое время».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тем, что на ней»; местоимение, вероятно, относится к земле, упомянутой в предыдущем стихе.'
    reason: cross_reference
lexical_decisions:
- source_word: ἡμέρας ἀριθμοῦ
  choice: определённое число дней
  rationale: Родительная конструкция указывает на исчисленные, ограниченные числом дни; выбранная формулировка естественно передаёт конечность отведённой жизни.
- source_word: καιρόν
  choice: назначенный срок
  rationale: В данном контексте καιρός означает установленный или отведённый период, а не время вообще.
- source_word: ἐξουσίαν
  choice: власть
  rationale: Слово обозначает предоставленное право распоряжаться или управлять и не сводится к физической силе.
- source_word: τῶν ἐπ᾿ αὐτῆς
  choice: тем, что на ней
  rationale: Формулировка сохраняет эллиптическое местоимение греческого текста; женский род указывает, вероятнее всего, на землю из предыдущего стиха.
theological_decisions:
- issue: Объём человеческой власти в выражении ἐξουσίαν τῶν ἐπ᾿ αὐτῆς
  choice: людям дана власть над тем, что находится на земле
  alternative: людям дана власть над самой землёй
  rationale: Греческая конструкция ставит объектом власти находящееся «на ней», а не непосредственно землю. Местоименная форма сохранена, чтобы не конкретизировать объект сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Синтаксический параллелизм двух форм «дал им» сохранён; неопределённость местоименной отсылки не устранена.
