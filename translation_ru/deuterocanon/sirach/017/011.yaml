translation:
  language: ru
  text: Он установил с ними вечный завет[a] и показал им свои установления[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «завет на века».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «решения»; также возможно: «суды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκην
  choice: завет
  rationale: В библейском греческом διαθήκη обозначает прежде всего завет, а не обычное соглашение; этот вариант сохраняет религиозно-исторический смысл слова.
- source_word: αἰῶνος
  choice: вечный
  rationale: Родительный αἰῶνος характеризует завет как непреходящий, сохраняющий силу вовеки. «Вечный» — естественное русское соответствие в сочетании со словом «завет».
- source_word: ἔστησεν
  choice: установил
  rationale: Глагол выражает утверждение и введение чего-либо в силу. «Установил» передаёт это точнее, чем более идиоматическое, но менее буквальное «заключил».
- source_word: μετ᾿ αὐτῶν
  choice: с ними
  rationale: μετά с родительным падежом имеет прямое значение «с» и сохраняет взаимно-реляционный характер завета.
- source_word: τὰ κρίματα αὐτοῦ
  choice: свои установления
  rationale: В данном заветно-правовом контексте κρίματα может означать обязательные постановления или установления. Русское «суды» было бы формально ближе традиционной библейской лексике, но в современном языке легко понимается как судебные учреждения или процессы.
- source_word: ὑπέδειξεν
  choice: показал
  rationale: Глагол означает «показать, указать, дать увидеть или понять»; прямое «показал» сохраняет простоту и параллельное построение греческой фразы.
theological_decisions:
- issue: Характер завета, обозначенный сочетанием διαθήκην αἰῶνος
  choice: вечный завет
  alternative: завет на века
  rationale: Перевод сохраняет полноценную заветную терминологию и утверждение о непреходящем характере завета, не сводя его к обычному договору. Альтернатива в сноске отражает временной оттенок αἰών.
- issue: Значение κρίματα в заветном контексте
  choice: установления
  alternative: решения; суды
  rationale: Контекст допускает как нормативно-правовой, так и судебный оттенок. Основной вариант естественен для современного русского языка, а сноска сохраняет более широкий диапазон греческого слова.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимение «свои» написано со строчной буквы в соответствии с нейтральной современной издательской практикой. Маркеры сносок помещены непосредственно после слов, к которым они относятся; тем самым исправлена перестановка маркеров в консультационном английском тексте.
