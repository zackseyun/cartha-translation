  text: How great is the mercy of the Lord[a], and his atonement for those who turn to him.
translation:
  language: ru
  text: Как велико милосердие Господа и Его искупление[a] для тех, кто обращается к Нему!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умилостивление»; «очищение от вины». Слово может подразумевать и прощение как результат искупления.'
    reason: Греческое ἐξιλασμός обозначает искупительное действие или устранение вины; варианты передают его спорный и многогранный смысл, не навязывая определённую богословскую модель.
lexical_decisions:
- source_word: ὡς μεγάλη
  choice: Как велико
  rationale: Сочетание ὡς с прилагательным имеет здесь восклицательную силу; русское «как велико» естественно её передаёт.
- source_word: ἐλεημοσύνη
  choice: милосердие
  rationale: В сочетании «милосердие Господа» слово обозначает Божью милость и сострадание, а не раздачу милостыни.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: В иудейском тексте Премудрости κύριος является благоговейным обозначением Бога.
- source_word: ἐξιλασμός
  choice: прощение
  rationale: В данном призыве к возвращению к Богу слово указывает на устранение вины и восстановление отношений. «Прощение» понятно современному читателю, а более буквальные богословские соответствия сохранены в примечании.
- source_word: τοῖς ἐπιστρέφουσιν ἐπ᾿ αὐτόν
  choice: для тех, кто обращается к Нему
  rationale: Глагол ἐπιστρέφω передаёт поворот и возвращение к Богу; «обращается к Нему» сохраняет этот образ без замены его техническим термином «кается».
theological_decisions:
- issue: Значение ἐξιλασμός применительно к возвращающимся к Богу
  choice: прощение
  alternative: искупление; умилостивление; очищение от вины
  rationale: Основной текст выражает доступный по контексту результат — снятие вины перед Богом, — не закрепляя определённую позднейшую теорию искупления. Более узкие или технические варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной восклицательной интонацией. Местоимение «Нему» написано с прописной буквы как традиционное благоговейное обозначение Бога; синтаксис остаётся ясным и доступным.
