  terminology: «Милосердие», «Господь» и «обращается к Нему» уместны. Для ἐξιλασμός предпочтительно «искупление» в основном тексте; сноска должна сохранять варианты «умилостивление» и «очищение от вины», не представляя «прощение» как точное прямое соответствие.
