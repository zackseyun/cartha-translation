translation:
  language: ru
  text: Кто прославит Всевышнего в царстве мёртвых[a] вместо живых, воздающих благодарение?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в Аиде». Здесь имеется в виду царство мёртвых, а не обязательно место окончательного суда или наказания.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὑψίστῳ
  choice: Всевышнего
  rationale: Дательный падеж указывает на Того, Кому воздаётся хвала; «Всевышний» сохраняет силу божественного титула.
- source_word: τίς αἰνέσει
  choice: Кто прославит
  rationale: Будущая форма αἰνέω выражает риторический вопрос. «Прославит» точно передаёт хвалу, не добавляя отсутствующего в греческом указания на пение.
- source_word: ἐν ᾅδου
  choice: в царстве мёртвых
  rationale: ᾅδης обозначает область пребывания умерших. Этот перевод естественен по-русски и не сужает значение до могилы или места окончательного наказания.
- source_word: ἀντὶ ζώντων
  choice: вместо живых
  rationale: ἀντί выражает замещение или противопоставление; субстантивированное ζώντων естественно передаётся как «живых».
- source_word: διδόντων ἀνθομολόγησιν
  choice: воздающих благодарение
  rationale: Оборот буквально говорит о принесении благодарения или ответной хвалы. «Воздающих благодарение» сохраняет культовый оттенок и грамматическую связь с «живыми».
theological_decisions:
- issue: Значение ᾅδης в контексте премудростной литературы
  choice: царство мёртвых как область пребывания умерших
  alternative: ад; преисподняя; могила; шеол
  rationale: Стих противопоставляет умерших живым, воздающим благодарение. Перевод не вводит учения о месте окончательного наказания, которого сам текст прямо не выражает.
- issue: Смысл риторического вопроса о хвале после смерти
  choice: сохранить вопрос без догматического пояснения
  alternative: переформулировать как категорическое утверждение о невозможности посмертной хвалы
  rationale: Вопросительная форма греческого текста сохраняет присущую стиху богословскую напряжённость и не требует систематического вывода о состоянии умерших.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка краткая и риторическая; архаизм «преисподняя» не использован ради ясности, а значение греческого ᾅδης пояснено сноской.
