  text: From the dead[a], as from one who no longer exists, praise perishes; but one who is alive and well will praise the Lord.
translation:
  language: ru
  text: У мёртвого, словно у того, кого уже нет, хвала исчезает[a], а живой и здоровый будет восхвалять Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исчезает благодарение»; греческое слово может также означать «исповедание», но параллель с выражением «будет восхвалять Господа» здесь указывает на хвалу или благодарение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ νεκροῦ
  choice: От мёртвого
  rationale: Единственное число употреблено обобщённо; такой перевод сохраняет конкретность греческого выражения и естественно вводит противопоставление живому.
- source_word: ὡς μηδὲ ὄντος
  choice: словно от того, кого уже нет
  rationale: Передаёт риторическое уподобление умершего несуществующему, не превращая его в категорическое метафизическое утверждение.
- source_word: ἀπόλλυται
  choice: исчезает
  rationale: Глагол обозначает утрату, прекращение или гибель; применительно к хвале «исчезает» звучит естественно и сохраняет образный смысл.
- source_word: ἐξομολόγησις
  choice: хвала
  rationale: Хотя существительное допускает значения «благодарение» и «исповедание», параллель с αἰνέσει τὸν κύριον указывает здесь прежде всего на хвалу Богу.
- source_word: ζῶν καὶ ὑγιὴς
  choice: живой и здоровый
  rationale: Прямо и естественно передаёт оба определения, противопоставленные состоянию умершего.
- source_word: αἰνέσει
  choice: будет восхвалять
  rationale: Сохраняет будущее время и явно выраженное действие прославления Господа.
- source_word: τὸν κύριον
  choice: Господа
  rationale: В иудейском контексте книги Премудрости κύριος относится к Богу; традиционное русское соответствие — «Господь».
theological_decisions:
- issue: 'Значение ἐξομολόγησις: исповедание, благодарение или хвала'
  choice: хвала
  alternative: благодарение; исповедание
  rationale: Параллелизм с «будет восхвалять Господа» поддерживает значение благодарственной хвалы. В сноске сохранены реальные лексические альтернативы без навязывания покаянного смысла.
- issue: Смысл выражения ὡς μηδὲ ὄντος
  choice: 'риторическое сравнение: «словно от того, кого уже нет»'
  alternative: буквальное утверждение, что умерший не существует
  rationale: Частица ὡς вводит сравнение; перевод сохраняет напряжение текста и не делает сверх него вывода о состоянии умерших.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. «Мёртвого» и «живой и здоровый» сохраняют резкое противопоставление оригинала; формулировка остаётся понятной без архаизации.
