  source_fidelity: 'Основной смысл передан верно: запрет бояться смерти, названной установленным для адресата уделом, и напоминание о прежних и последующих. Однако конструкция «смерти — назначенного тебе удела» синтаксически шероховата: родительный падеж после «не бойся» может создавать впечатление, что бояться следует именно «удела», а не смерти. Явная связка точнее передаёт сжатую именную конструкцию еврейского текста без подмены её исключительно греческим «приговором».'
