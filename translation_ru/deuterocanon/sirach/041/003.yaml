  text: Do not fear the decree of your death[c][b][a]; remember that those before and those after are with you.
translation:
  language: ru
  text: 'Не бойся смерти: это твой установленный удел[a][c]. Помни: те, кто был прежде, и те, кто будет после тебя, — с тобой[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст допускает буквальную передачу: «Не бойся смерти — твоего установленного удела (или определения)»; греческий параллельный текст гласит: «Не бойся приговора смерти».'
    reason: alternative_reading
  - marker: b
    text: Слова «те, кто был прежде, и те, кто будет после тебя, — с тобой» указывают на общую смертную участь людей прошлого, настоящего и будущего.
    reason: lexical_alternative
  - marker: c
    text: В Масадском свитке этот раздел сохранился лишь фрагментарно; здесь полнее Каирские рукописи Генизы, а греческий текст помогает прояснить сжатое выражение о смерти.
    reason: textual_variant
lexical_decisions:
- source_word: אל תפחד
  choice: Не бойся
  rationale: Прямо и естественно передаёт еврейский запрет с глаголом פחד, сохраняя торжественную краткость наставления.
- source_word: ממות חקיך
  choice: смерти — назначенного тебе удела
  rationale: Еврейская фраза сжата и буквально соединяет «смерть» с חקיך, словом из смыслового поля установленного удела или определения. Приложение через тире сохраняет оба элемента, не сводя выражение только к греческому «приговору смерти».
- source_word: זכור
  choice: помни
  rationale: Точное и естественное соответствие повелительной форме; уместно для современной русской речи и литературы мудрости.
- source_word: ראשנים ואחרנים
  choice: жившие прежде и те, кто будет после
  rationale: Передаёт временное противопоставление прежних и последующих людей, не вводя в основной текст более узкое понятие «поколения».
- source_word: עמך
  choice: с тобой
  rationale: Сохраняет буквальную образность еврейского выражения. Его контекстуальный смысл — общность смертной участи — пояснён в сноске, а не подставлен в основной текст.
theological_decisions:
- issue: Как передать сжатое еврейское выражение о смерти при расхождении с греческим параллельным текстом
  choice: «смерти — назначенного тебе удела»
  alternative: «приговора смерти»; «предопределённой тебе смерти»; «смерти»
  rationale: 'Еврейскому свидетельству отдано первенство: в нём явно присутствуют и «смерть», и понятие установленного удела. Греческое κρίμα θανάτου подтверждает оттенок определения или приговора, но не должно полностью вытеснять более многозначный еврейский оборот.'
- issue: Следует ли раскрыть выражение «с тобой» как общую участь всех людей
  choice: Сохранить «с тобой» в тексте и пояснить смысл в сноске
  alternative: «разделяют с тобой одну участь»
  rationale: Буквальная формулировка сохраняет лаконичность и возможную образную напряжённость текста; наиболее вероятный смысл сообщается читателю без превращения толкования в сам перевод.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным мудрой литературы наставительным тоном. Тире перед приложением передаёт сжатость и неоднозначность еврейской конструкции; архаизмы и конфессионально окрашенные формулы не используются.
