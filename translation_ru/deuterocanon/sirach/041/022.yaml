  text: for a friend[a], over words of reproach; and after giving a gift to a brother, do not reproach him.
translation:
  language: ru
  text: перед другом — из-за укоризненных слов[a], и, дав брату подарок, не попрекай его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская строка здесь сжата и допускает разные синтаксические толкования. Греческий параллельный текст делает подразумеваемый смысл яснее: «от друзей — о словах поношения; и, дав, не попрекай».'
    reason: textual_variant
lexical_decisions:
- source_word: מאוהב
  choice: перед другом
  rationale: Оборот эллиптичен; אוהב обозначает друга. В контексте перечня того, чего следует стыдиться, начальное מ־ естественно передаётся как «перед», то есть «стыдись перед другом». Греческое ἀπὸ φίλων подтверждает отнесение фразы к друзьям.
- source_word: על דברי חרפה
  choice: за оскорбительные слова
  rationale: על может обозначать основание, а דברי חרפה — слова, наносящие оскорбление или бесчестящие человека. Формулировка сохраняет сжатость и социально-нравственный смысл.
- source_word: ומאחרי מתת
  choice: и, дав … подарок
  rationale: Буквально «и после дарения/дара». Деепричастный оборот естественно выражает предшествующее действие по-русски, не меняя временного отношения.
- source_word: אח
  choice: брату
  rationale: Сохранено буквальное родственное обозначение; в мудрой литературе оно может также подразумевать близкого человека или соплеменника.
- source_word: מנאץ
  choice: не попрекай его
  rationale: Еврейская форма трудна и сжата; греческое μὴ ὀνείδιζε ясно указывает на запрет попрекать после оказанной помощи. «Попрекать подарком» — естественное русское выражение и соответствует контексту.
theological_decisions:
- issue: Использование греческого параллельного текста для прояснения эллиптического еврейского стиха
  choice: Первую часть связать с подразумеваемым в окружающем перечне призывом стыдиться, а вторую передать как прямой запрет попрекать брата после подарка.
  alternative: 'Оставить обе части фрагментарными: «от друга за слова позора, и после дара брату — порицающий».'
  rationale: Еврейский текст первичен, но синтаксически сжат и отмечен как существенно расходящийся; греческий параллельный текст сохраняет ясный запрет во второй части и подтверждает упоминание друзей в первой. Предлагаемый перевод не устраняет эллиптичность без уведомления читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительной речи. Сохранена краткая структура перечня; «попрекать» выбрано как ясный общеупотребительный глагол для упрёка оказанным благодеянием.
