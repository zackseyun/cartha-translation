  source_fidelity: В первой колоне еврейское מ־ при «друге» формально означает «от/из-за», но в продолжающемся перечне предметов стыда (с подразумеваемым из контекста «стыдись») оно, как и греческое ἀπό, может передаваться по-русски через «перед». Такой перевод допустим только при сохранении связи с подразумеваемым наставлением. Во второй колоне «дав брату подарок, не попрекай его» точно передаёт временную последовательность и запрет, разъясняемый греческим параллельным текстом.
  naturalness: «За оскорбительные слова» в сочетании с «перед другом» звучит не вполне естественно и может значить, что адресат должен стыдиться именно своих оскорбительных слов. «Из-за укоризненных слов» лучше сохраняет неопределённость краткого оригинала и естественнее в наставительном перечне.
  terminology: «Брат», «подарок» и «попрекать» уместны. «Укоризненные слова» ближе к חרפה и к греческому ὀνειδισμός, чем «оскорбительные слова», не сужая, кому именно адресованы или от кого исходят эти слова.
