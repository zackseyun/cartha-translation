  text: Be concerned for your name, for it will go with you more than a thousand stores of wisdom.
translation:
  language: ru
  text: Заботься о своём имени, ведь оно будет с тобой дольше, чем тысячи сокровищ мудрости.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «чем тысяча великих сокровищ золота».'
    reason: 'Фиксирует существенное расхождение древней параллельной традиции: «золота» вместо еврейского «мудрости», а также единственное число «тысяча».'
lexical_decisions:
- source_word: פחד על שם
  choice: Заботься о своём имени
  rationale: Передаёт призыв проявлять серьёзную заботу об имени, то есть о сохраняющейся за человеком репутации, не добавляя отсутствующего в еврейском тексте определения «добром».
- source_word: כי הוא ילוך
  choice: ведь оно будет с тобой дольше
  rationale: Буквально выражение говорит, что имя «пойдёт с тобой»; сравнительный оборот следующей части и греческое διαμενεῖ поддерживают естественную русскую передачу длительного пребывания.
- source_word: מאלפי אוצרות חכמה
  choice: чем тысячи сокровищ мудрости
  rationale: Сохраняет еврейские «тысячи», «сокровища» и «мудрость», не заменяя последнюю греческим вариантом «золото».
theological_decisions:
- issue: Смысл слова «имя»
  choice: Сохранено прямое «имя»
  alternative: «добрая слава» или «репутация»
  rationale: Прямой образ понятен по-русски и сохраняет широту исходного выражения, не сводя его к одному толкованию.
- issue: Расхождение еврейского и греческого текста в конце стиха
  choice: В основном тексте принято еврейское «мудрости»
  alternative: Греческое «золота»
  rationale: Еврейский источник имеет высокую уверенность и задан как первичный; значимый греческий вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; наставительный, сдержанно-мудрый тон. Формулировка сохраняет образ имени и делает сравнительную конструкцию естественной для обычного читателя.
