  text: Be ashamed before father and mother for sexual immorality[a], and before a ruler in office for lying.
translation:
  language: ru
  text: Стыдись перед отцом и матерью разврата, а перед восседающим правителем — лжи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально еврейский текст говорит о «восседающем правителе»; в греческой версии — «предводителе и властителе». Обе формы указывают на представителя власти.
    reason: alternative_reading
lexical_decisions:
- source_word: בוש
  choice: Стыдись
  rationale: Императив сохраняет прямую увещательную силу еврейского глагола и естественно звучит по-русски.
- source_word: מאב ואם
  choice: перед отцом и матерью
  rationale: После בוש предлог מן указывает на тех, перед кем следует испытывать стыд; греческая параллель подтверждает это отношение.
- source_word: אל זנות
  choice: разврата
  rationale: זנות обозначает недозволенное половое поведение шире, чем проституция; «разврат» кратко и достаточно широко передаёт этический смысл.
- source_word: מנשיא יושב
  choice: перед восседающим правителем
  rationale: Передаёт как נשיא («правитель»), так и образ יושב — правителя, занимающего место власти, не сводя выражение просто к должности.
- source_word: אל כחש
  choice: лжи
  rationale: כחש здесь означает ложь или обман; «лжи» прямо и естественно соответствует контексту нравственного наставления.
