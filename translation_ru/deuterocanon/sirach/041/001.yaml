revisions:
- from: О смерть, как горько вспоминать о тебе человеку, который спокойно живёт, довольствуясь тем, что имеет,[a] человеку безмятежному, во всём преуспевающему и ещё полному сил получать удовольствие.[b]
  to: О смерть, как горько вспоминать о тебе человеку, живущему спокойно среди того, что ему принадлежит,[a] человеку безмятежному, во всём преуспевающему и ещё имеющему силы наслаждаться.[b]
  rationale: Убрано «довольствуясь», поскольку оно истолковывает состояние человека как удовлетворённость, а не передаёт осторожно подтверждаемую греческой параллелью идею мирной жизни среди собственного достояния. Последняя характеристика перестроена для естественного русского синтаксиса при сохранении еврейского «наслаждение» в основном тексте и греческого варианта в сноске.
