base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/001.yaml
  text: O death[a], how bitter is your remembrance to a man at ease in his possessions, to a man untroubled and prospering in everything[b], and still strong enough to enjoy pleasure.
translation:
  language: ru
  text: О смерть, как горько вспоминать о тебе человеку, живущему спокойно среди того, что ему принадлежит,[a] человеку безмятежному, во всём преуспевающему и ещё имеющему силы наслаждаться.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение можно понять также как «спокойно пребывает на своём месте (или в своём положении)»; греческая параллель говорит о человеке, мирно живущем среди того, что ему принадлежит.
    reason: textual_variant
  - marker: b
    text: 'Буквально по еврейскому тексту: «ещё есть в нём сила получать удовольствие». В греческой параллели сказано конкретнее: «ещё способному принимать пищу».'
    reason: alternative_reading
lexical_decisions:
- source_word: מה מר זכרך / ὡς πικρόν σου τὸ μνημόσυνόν
  choice: как горько вспоминать о тебе
  rationale: Еврейское זכרך и греческое μνημόσυνον обозначают память или воспоминание. Русская глагольная конструкция естественно передаёт этот смысл и сохраняет прямое обращение к смерти.
- source_word: לאיש שוקט על מכונתו / ἀνθρώπῳ εἰρηνεύοντι ἐν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: человеку, который спокойно живёт, довольствуясь тем, что имеет
  rationale: Еврейская фраза допускает понимание «покоится на своём месте/положении», тогда как греческая параллель говорит о мирной жизни среди своего имущества. Выбранная формулировка естественна по-русски и сохраняет идею спокойствия и обеспеченности, не делая богатство обязательным смыслом.
- source_word: איש שליו / ἀνδρὶ ἀπερισπάστῳ
  choice: человеку безмятежному
  rationale: שליו указывает на спокойствие и благополучную беззаботность, а ἀπερίσπαστος — на отсутствие тревог и помех. «Безмятежный» кратко передаёт общий оттенок.
- source_word: ומצליח בכל / καὶ εὐοδουμένῳ ἐν πᾶσιν
  choice: во всём преуспевающему
  rationale: Оба свидетеля говорят об успехе или благополучном ходе дел во всех отношениях.
- source_word: ועוד בו חיל לקבל תענוג / καὶ ἔτι ἰσχύοντι ἐπιδέξασθαι τροφήν
  choice: и ещё полному сил получать удовольствие
  rationale: Основной текст следует ясному еврейскому תענוג («удовольствие, наслаждение»), а не более конкретному греческому τροφή («пища»). Оборот בו חיל передан естественным русским выражением «полному сил».
theological_decisions:
- issue: Мужской род единственного числа в איש
  choice: человеку
  alternative: мужчине
  rationale: В контексте איש обозначает отдельного представителя человечества, а не противопоставляет мужчину женщине. Русское «человек» сохраняет единственное число и не вводит ненужного полового акцента.
- issue: Соотношение еврейского текста и греческой параллели в последней фразе
  choice: получать удовольствие
  alternative: принимать пищу / наслаждаться пищей
  rationale: Сохранившийся еврейский текст имеет תענוג, «удовольствие, наслаждение», тогда как греческий свидетель конкретизирует его как «пищу». Поскольку еврейское чтение осмысленно, оно оставлено в основном тексте, а расхождение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством премудростной поэзии. Прямое обращение «О смерть» и параллельное повторение «человеку» сохранены; синтаксис сделан плавным и понятным без устранения текстовой неопределённости.
