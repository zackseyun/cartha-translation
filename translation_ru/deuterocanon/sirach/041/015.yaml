    reason: textual_variant
lexical_decisions:
- source_word: טוב
  choice: лучше
  rationale: Сравнительное значение естественно в контексте еврейской притчи и прямо подтверждается греческим κρείσσων.
- source_word: איש
  choice: человек
  rationale: Передаёт мужскую форму единственного числа в обобщающем значении и по-русски естественнее, чем «муж».
- source_word: מצפין
  choice: скрывающий
  rationale: Сохраняет причастную форму и повторяющуюся структуру обеих частей сравнения; соответствует греческому ἀποκρύπτων.
- source_word: אולתו
  choice: свою глупость
  rationale: Передаёт אולת в регистре литературы мудрости без чрезмерно резкого оттенка слова «тупость»; местоимение «свою» естественно указывает на принадлежность подлежащему.
- source_word: חכמתו
  choice: свою мудрость
  rationale: Прямое значение подтверждается греческим σοφία; повтор «свою» сохраняет параллелизм.
- source_word: מוסר בשת
  choice: наставление — стыд
  rationale: Максимально кратко учитывает трудную заключительную фразу еврейского текста, не скрывая её и не навязывая определённого истолкования синтаксической связи.
