translation:
  language: ru
  text: пристально смотреть в лицо чужой жене[a] и приближаться к её служанке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское זרה можно также перевести как «посторонняя женщина» или «чужая женщина»; в греческой параллели сказано «замужняя женщина», что поддерживает перевод «чужая жена».
    reason: alternative_reading
lexical_decisions:
- source_word: מהביט
  choice: пристально смотреть
  rationale: Глагол הביט означает «смотреть, всматриваться». В перечне постыдных поступков и с учётом греческого κατανοήσεως выражение передаёт намеренный, пристальный взгляд, а не случайный взгляд.
- source_word: אל פני
  choice: в лицо
  rationale: Буквально «к лицу»; русское «смотреть в лицо» естественно передаёт конкретный еврейский оборот и сохраняет упоминание лица.
- source_word: זרה
  choice: чужой жене
  rationale: Еврейское слово может обозначать «чужую, постороннюю женщину»; греческая параллель уточняет γυναικὸς ὑπάνδρου — «замужнюю женщину». Выражение «чужая жена» естественно обозначает жену другого мужчины и сохраняет оттенок запретной женщины.
- source_word: ומהתקרב
  choice: и приближаться
  rationale: Форма от קרב буквально означает «приближаться, подходить близко» и не устраняет возможного намёка на непристойное сближение.
- source_word: שפחתה
  choice: к её служанке
  rationale: שפחה — зависимая женщина-служанка, нередко рабыня. «Служанка» понятно современному читателю и уместно в данном домашнем контексте; социальная точность отмечена в решениях.
theological_decisions:
- issue: Значение זרה с учётом греческой параллели
  choice: чужая жена
  alternative: посторонняя женщина; чужая женщина; замужняя женщина
  rationale: Еврейский текст допускает более широкое значение, тогда как греческая параллель прямо говорит о замужней женщине. Основной текст следует этому уточнению, но не скрывает более широкого значения еврейского слова.
- issue: Характер взгляда в מהביט
  choice: пристально смотреть
  alternative: смотреть; глядеть
  rationale: Сам еврейский глагол может быть нейтральнее, однако контекст перечня постыдных действий и греческое «внимательно разглядывать» поддерживают усиленное выражение без добавления явно сексуальной характеристики.
translation_notes:
  register: Современный литературный русский язык; сохранена синтаксическая фрагментарность стиха как продолжения перечня. Формулировка сдержанная и достойная, без архаизации. Местоимение «её» относится к чужой жене.
