  source_fidelity: 'Русский текст точно передаёт сохранившуюся еврейскую строку: מהביט אל פני זרה передано как «пристально смотреть в лицо чужой жене», а ומהתקרב אל שפחתה — как «и приближаться к её служанке». Усиление «пристально» обосновано контекстом перечня постыдных поступков и греческим κατανοήσεως; «чужая жена» правомерно отражает уточняющее свидетельство греческого γυναικὸς ὑπάνδρου, не выдавая его за единственно возможное значение еврейского זרה.'
