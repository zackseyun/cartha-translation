base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/013.yaml
  text: The good of life is a limited number of days[b][a], but the good of a name is days without number.
translation:
  language: ru
  text: Благо жизни — ограниченное число дней, а благо имени[b] — дни без числа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст: «а доброе имя останется навеки».'
    reason: alternative_reading
  - marker: b
    text: «Имя» здесь означает не просто личное имя, а также репутацию и память о человеке.
    reason: lexical_alternative
lexical_decisions:
- source_word: טובת
  choice: благо
  rationale: Существительное передаёт значение добра, блага или ценности и позволяет сохранить параллель «благо жизни — благо доброго имени», не вводя отсутствующее в еврейском тексте явное сравнение «лучше».
- source_word: חי
  choice: жизни
  rationale: В данном контексте слово естественно понимать отвлечённо как «жизнь»; это соответствует греческому ζωῆς и противопоставлению продолжительности жизни и долговечности доброй славы.
- source_word: ימי מספר
  choice: ограниченное число дней
  rationale: Буквально «дни числа», то есть дни исчислимые, имеющие предел. Такой перевод ясно передаёт смысл и сохраняет контраст со второй половиной стиха.
- source_word: שם
  choice: доброго имени
  rationale: «Имя» здесь означает также репутацию и сохраняемую людьми добрую память. Прилагательное «доброго» естественно выражает конструкцию טובת שם — благо, связанное с добрым именем, — и согласуется с греческим ἀγαθὸν ὄνομα.
- source_word: ימי אין מספר
  choice: дни без числа
  rationale: Перевод близко сохраняет еврейский образ «дней, которым нет числа», не заменяя его более однозначным «навсегда»; греческое истолкование вынесено в примечание.
theological_decisions:
- issue: Соотношение еврейского образа и греческого истолкования
  choice: В основном тексте сохранено еврейское противопоставление исчислимых дней жизни и дней доброго имени, которым нет числа.
  alternative: «Доброе имя останется навеки».
  rationale: Сохранившийся еврейский текст ясен и имеет высокий уровень достоверности, поэтому он первичен. Греческий параллельный текст делает смысл долговечности явным; его формулировка сохранена в сноске без устранения образной неоднозначности еврейского текста.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная форма изречения. Параллелизм исходного еврейского текста сохранён, а несколько необычное выражение «дни без числа» удерживает его образность.
