  text: Скрытая мудрость и спрятанное сокровище — какая польза в том и другом?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «какая польза в обоих?»'
    reason: lexical_alternative
  - marker: b
