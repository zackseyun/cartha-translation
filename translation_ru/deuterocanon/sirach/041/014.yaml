    reason: textual_variant
lexical_decisions:
- source_word: חכמה
  choice: мудрость
  rationale: Основное значение слова в данном изречении; ему соответствует греческое σοφία.
- source_word: טמונה
  choice: скрытая
  rationale: Причастие обозначает то, что укрыто или держится втайне; краткое и естественное соответствие.
- source_word: אוצר
  choice: сокровище
  rationale: В параллели с мудростью речь идёт о ценности, а не о месте хранения; это подтверждает греческое θησαυρός.
- source_word: מוסתר
  choice: спрятанное
  rationale: Передаёт намеренную сокрытость и позволяет сохранить поэтический параллелизм без точного повтора слова «скрытая».
- source_word: מה תועלה
  choice: какая польза
  rationale: Естественно передаёт риторический вопрос о практической выгоде или пользе.
- source_word: בשתיהם
  choice: от обоих
  rationale: Сохраняет буквальное указание еврейского текста на оба названных предмета вместе, не заменяя его более истолковывающим «от каждого из них».
