translation:
  language: ru
  text: Тело человека — суета, но доброе имя не пресечётся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий параллельный текст существенно отличается: «Скорбь людей — в их телах, а имя грешников, недоброе, не изгладится». Последние слова греческой фразы понимают по-разному; возможны также передачи: «имя грешников не изгладится как доброе» или «не изгладится навсегда». Еврейский текст гласит: «имя доброты не пресечётся».'
    reason: alternative_reading
lexical_decisions:
- source_word: הבל
  choice: суета
  rationale: Слово обозначает мимолётность и непрочность; «суета» сохраняет характерный для библейской литературы мудрости образ, не сводя его только к буквальному «дыханию» или «пару».
- source_word: אדם בגויתו
  choice: тело человека
  rationale: גויה здесь означает тело, а не обязательно труп. Русская именная конструкция естественно передаёт мысль о телесной бренности человека.
- source_word: אך
  choice: но
  rationale: Союз выражает противопоставление между преходящим телом и сохраняющимся добрым именем.
- source_word: שם חסד
  choice: доброе имя
  rationale: Буквальное «имя доброты» по-русски неестественно. «Доброе имя» ясно передаёт имя или репутацию, связанную с добротой, и сохраняет ёмкость афоризма.
- source_word: לא יכרת
  choice: не пресечётся
  rationale: Глагол כרת буквально связан с отсечением или прекращением. «Не пресечётся» сохраняет этот образ и означает, что доброе имя не исчезнет.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческого параллельного текста
  choice: 'Основной текст следует еврейскому чтению: «доброе имя не пресечётся»'
  alternative: Греческий параллельный текст говорит об имени грешников, которое не будет изглажено как доброе либо навсегда
  rationale: Сохранившееся еврейское свидетельство имеет высокую степень достоверности и потому определяет основной текст. Существенно отличающееся греческое чтение приводится в сноске без попытки искусственно согласовать оба варианта.
translation_notes:
  register: Современный литературный русский язык с краткой афористической формой. «Суета» и «не пресечётся» сохраняют библейскую выразительность, оставаясь понятными современному читателю.
