  text: The children of the despised are an evil thing[c][b][a], and the offspring of a fool are in the terror of the wicked.
translation:
  language: ru
  text: Потомство презренного — нечто дурное[a][c], а потомки глупца пребывают в страхе нечестивых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Первая строка на еврейском трудна; в греческой параллели сказано приблизительно: «Отвратительные дети — дети грешников».'
    reason: alternative_reading
  - marker: b
    text: 'Во второй строке греческая параллель расходится с еврейским текстом ещё сильнее: приблизительно «и они общаются в поселениях нечестивых».'
    reason: alternative_reading
  - marker: c
    text: Более древняя масадская рукопись в этом месте сохранилась лишь фрагментарно; основное читаемое еврейское свидетельство стиха дают рукописи Каирской генизы.
    reason: textual_variant
lexical_decisions:
- source_word: נין
  choice: потомство
  rationale: Слово обозначает потомков, потомство; собирательное «потомство» сохраняет широкий смысл и не ограничивает речь детьми определённого возраста.
- source_word: נמאס
  choice: презренного
  rationale: Страдательное значение «презираемый, отвергнутый» естественно передаётся родительным определением при слове «потомство».
- source_word: דבר רעים
  choice: нечто дурное
  rationale: Еврейское сочетание трудно и, возможно, текстуально нестабильно. Передача сохраняет значение דבר как «нечто, дело» и отрицательную оценку רעים, не закрепляя предположительную реконструкцию.
- source_word: נכד
  choice: потомки
  rationale: Хотя слово может означать внука, в поэтическом параллелизме с נין оно шире указывает на последующее поколение или потомство.
- source_word: אויל
  choice: глупца
  rationale: Это обычное обозначение нравственно неразумного человека в литературе мудрости; «глупец» сохраняет данный оттенок.
- source_word: במגור
  choice: пребывают в страхе
  rationale: מגור означает страх, ужас. Глагол «пребывают» добавлен для естественного русского именного предложения, не уточняя причину или характер страха.
- source_word: רשע
  choice: нечестивых
  rationale: Форма единственного числа может иметь собирательное значение. Множественное «нечестивых» естественно выражает нравственную категорию и сохраняет неоднозначность родительного отношения.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и заметно отличающейся греческой параллели
  choice: Основной текст переведён по еврейскому свидетельству Каирской генизы; греческий использован только для проверки общей резко отрицательной оценки.
  alternative: 'Следовать греческому: «Отвратительные дети — дети грешников, и они общаются в поселениях нечестивых».'
  rationale: Еврейский текст здесь доступен, хотя первая строка трудна. Греческая версия существенно расходится с ним, особенно во второй части, поэтому не должна без пояснения вытеснять еврейское чтение.
- issue: Неоднозначность выражения במגור רשע
  choice: «в страхе нечестивых»
  alternative: «в страхе перед нечестивыми» или, по греческой линии, «в обиталищах нечестивых»
  rationale: 'Родительная конструкция в русском сохраняет возможную неоднозначность: это может быть страх, испытываемый нечестивыми, исходящий от них или связанный с ними. Уточнение «перед» неоправданно разрешило бы напряжение текста.'
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем литературы мудрости. Формулировка намеренно сохраняет суровую оценку и текстовую неоднозначность, не сглаживая их конфессиональным толкованием.
