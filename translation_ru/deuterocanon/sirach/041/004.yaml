  source_fidelity: 'Начальная часть точно передаёт еврейский текст: «удел» соответствует חלק, «от Бога» — מאל, а «всякая плоть» сохраняет библейскую идиому. «Установление Всевышнего» является допустимой нейтральной передачей при расхождении еврейского «закон» и греческого «благоволение». Числовой ряд надёжнее оформить как уступительную конструкцию, а не как повеление. В заключении «укоризна за жизнь» слишком конкретно истолковывает трудный родительный оборот как посмертное порицание за земные дела; лучше сохранить его неоднозначность.'
