base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/004.yaml
  text: This is the lot of all flesh from God[a], so why reject the decree of the Most High? Whether for a thousand years, or a hundred, or ten[d][c][b], there is no rebuke of life in Sheol.
translation:
  language: ru
  text: Таков удел всякой плоти от Бога[a]; зачем же отвергать установление Всевышнего?[b] Будь то тысяча, сто или десять лет[c] — в Шеоле нет обличения жизни.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «от Бога»; в греческом параллельном тексте — «от Господа».
    reason: alternative_reading
  - marker: b
    text: Еврейский текст, по-видимому, гласит «закон Всевышнего», а греческий — «благоволение Всевышнего». «Установление» передаёт общий смысл определённого Всевышним в данном контексте.
    reason: alternative_reading
  - marker: c
    text: 'Последовательность чисел в еврейском свидетельстве неясна: буквально она выглядит как «тысяча лет, сто и десять». В греческом тексте: «десять, сто или тысяча лет».'
    reason: textual_variant
  - marker: d
    text: 'Заключительная фраза трудна. Буквальное «обличение жизни» может означать обличение, относящееся к жизни; возможны также переводы: «в Шеоле нет обличения относительно жизни» или «в Шеоле не требуют отчёта за жизнь». Греческий текст употребляет «Аид», еврейский — «Шеол».'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: זה חלק כל בשר
  choice: Таков удел всякой плоти
  rationale: «Удел» прямо передаёт еврейское חלק и сохраняет библейский образ; «всякая плоть» воспроизводит идиому смертного человечества.
- source_word: מאל
  choice: от Бога
  rationale: Следует сохранившемуся еврейскому чтению; греческое «от Господа» отмечено в сноске.
- source_word: תמאס
  choice: отвергать
  rationale: Естественно передаёт значение מאס — отвергать, отказываться принимать — и соответствует риторическому вопросу.
- source_word: בתורת עליון / ἐν εὐδοκίᾳ Ὑψίστου
  choice: установление Всевышнего
  rationale: Нейтрально передаёт контекст божественно определённой смертности, не устраняя расхождение между еврейским «законом» и греческим «благоволением».
- source_word: לאלף שנים מאה ועשר / εἴτε δέκα εἴτε ἑκατὸν εἴτε χίλια ἔτη
  choice: Проживи человек тысячу лет, сто или десять
  rationale: Сохраняет порядок чисел, представленный в еврейском свидетельстве, но выражает три срока раздельно по ясному греческому параллельному тексту; неопределённость отмечена в сноске.
- source_word: איש תוכחות בשאול חיים / οὐκ ἔστιν ἐν ᾅδου ἔλεγμὸς ζωῆς
  choice: в Шеоле нет укоризны за жизнь
  rationale: Сохраняет трудную и сжатую формулировку источников. «Укоризна» передаёт תוכחות / ἔλεγμος, а «Шеол» следует первичному еврейскому свидетельству.
theological_decisions:
- issue: Передача שאול / ᾅδης
  choice: Шеол
  alternative: Аид; царство мёртвых; могила
  rationale: Еврейский текст здесь сохранился и употребляет שאול; транслитерация не привносит более поздних представлений и сохраняет исходное понятие.
- issue: Расхождение между еврейским «законом» и греческим «благоволением» Всевышнего
  choice: установление Всевышнего
  alternative: закон Всевышнего; благоволение Всевышнего; воля Всевышнего
  rationale: Выбранное слово соответствует контексту назначенной Богом смертности и не превращает спорное чтение одного свидетеля в однозначное богословское утверждение.
- issue: Смысл заключительной фразы о жизни и Шеоле
  choice: не сглаживать выражение «нет укоризны за жизнь»
  alternative: в Шеоле не спрашивают отчёта о жизни; в Шеоле не упрекают за прожитые годы
  rationale: Еврейская строка повреждена или трудна, а греческая также допускает неоднозначное соотношение родительного «жизни» с «укоризной»; буквальная сжатость сохраняет напряжение текста.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены выражения «всякая плоть» и «Шеол» как значимые исходные образы; синтаксис сделан понятным для обычного читателя без устранения текстовой неопределённости.
