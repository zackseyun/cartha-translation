lexical_decisions:
- source_word: מהפר
  choice: за нарушение
  rationale: Глагол от корня פרר в породе hифиль означает нарушить, расторгнуть или сделать недействительным обязательство. В перечне постыдных поступков «за нарушение» естественно передаёт нравственный смысл выражения.
- source_word: אלה
  choice: клятвы
  rationale: אלה может обозначать клятву, заклятие или проклятие, связанное с клятвой. В сочетании с ברית наиболее уместно «клятва», при этом оттенок клятвенного проклятия отмечен в сноске.
- source_word: וברית
  choice: и завета
  rationale: ברית обычно означает обязывающий завет или договор. «Завет» сохраняет формальный и нравственный характер обязательства, не сужая его до обычного соглашения.
- source_word: ממטה
  choice: и за то, что кладёшь
  rationale: Еврейское выражение кратко и не вполне ясно. Греческое πήξεως ἀγκῶνος, буквально «утверждения локтя», указывает на положение локтя на столе; «кладёшь» сохраняет конкретный жест и звучит естественно по-русски.
- source_word: אציל
  choice: локоть
  rationale: אציל обозначает локоть или сустав руки; греческое ἀγκών подтверждает значение «локоть».
- source_word: אל לחם
  choice: на хлеб
  rationale: Еврейский предлог допускает направление к хлебу, тогда как греческое ἐπ᾿ ἄρτους поддерживает образ локтя, положенного на хлебы. «На хлеб» близко передаёт конкретный образ, не объясняя сверх текста точный характер нарушения застольного приличия.
