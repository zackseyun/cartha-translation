lexical_decisions:
- source_word: כל מאפס אל אפס ישוב
  choice: Всё, что из небытия, возвратится в небытие
  rationale: Передаёт обобщающее כל, движение שוב и намеренный повтор אפס. «Небытие» сохраняет резкость мысли и в данном контексте звучит естественнее, чем буквальное «ничто».
- source_word: חנף
  choice: нечестивый
  rationale: В литературе мудрости слово обозначает человека безбожного, нравственно испорченного, а не обязательно лицемера; греческое ἀσεβεῖς подтверждает широкий религиозно-нравственный смысл.
- source_word: מתהו אל תהו
  choice: из пустоты в пустоту
  rationale: Сохраняет повтор תהו и образ движения от пустоты к пустоте, не сужая значение до космогонического «хаоса».
- source_word: כן
  choice: так и
  rationale: Естественно вводит сопоставление двух частей изречения.
theological_decisions:
- issue: Значение חנף
  choice: нечестивый
  alternative: лицемер; безбожник
  rationale: «Нечестивый» передаёт широкий нравственно-религиозный смысл и не сводит слово лишь к притворству.
- issue: Соотношение еврейского и греческого свидетельств
  choice: Основной текст переведён по сохранившемуся еврейскому чтению, а греческий вариант дан в сноске
  alternative: Принять греческое «из земли в землю» в основной текст или объединить оба чтения
  rationale: Еврейский текст здесь имеется и имеет приоритет; греческий отражает существенно иную форму стиха, которую следует сохранить отдельно, не создавая искусственного согласования.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная структура и повторы исходного еврейского текста сохранены. Единственное число «нечестивый» следует еврейскому חנף, несмотря на множественное число в греческом параллельном тексте.
