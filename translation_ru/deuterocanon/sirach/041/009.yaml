translation:
  language: ru
  text: Если вы родитесь, то родитесь для проклятия; и если умрёте, проклятие станет вашим уделом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γεννηθῆτε / γεννηθήσεσθε
  choice: родитесь / родитесь
  rationale: Перевод следует цельному греческому параллельному тексту, который в данном случае лучше соответствует границам стиха и английскому контрольному слою; повтор глагола сохранён.
- source_word: εἰς κατάραν
  choice: для проклятия
  rationale: Передаёт направленность или итоговое назначение без уточнения, кем именно произнесено проклятие.
- source_word: μερισθήσεσθε
  choice: станет вашим уделом
  rationale: Естественно передаёт значение «получить как долю, удел» и сохраняет образ распределения, а не просто повторяет «будете прокляты».
theological_decisions:
- issue: Расхождение между составным еврейским свидетельством и греческим параллельным текстом
  choice: Следовать цельному греческому тексту данного стиха
  alternative: 'Перевести приведённый составной еврейский текст: «Если умножитесь — через бедствие…» и далее'
  rationale: Приведённый еврейский материал содержит больше строк и, вероятно, затрагивает соседний текст; метаданные отмечают minor_mismatch. Греческий текст имеет ясное соответствие Sirach 41:9 и поддерживается аудированным английским слоем.
- issue: Смысл посмертного проклятия
  choice: Сохранить формулировку об уделе без догматического пояснения
  alternative: Истолковать как вечное осуждение или как дурную память потомков
  rationale: Источник не разъясняет природу проклятия; перевод не должен устранять эту богословскую неопределённость.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и симметричная конструкция. Местоимение «вы» сохраняет множественное число греческих глагольных форм.
