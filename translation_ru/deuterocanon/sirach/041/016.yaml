  yaml_path: translation/deuterocanon/sirach/041/016.yaml
  text: 'Instruction in shame: hear[a], sons, and be ashamed according to my judgments. Not every shame is fitting to keep[b], and not every disgrace is rightly chosen.'
translation:
  language: ru
  text: Наставление о стыде. Слушайте, сыновья, и стыдитесь, следуя моим суждениям.[a] Не всякий стыд подобает хранить, и не всякое посрамление следует избирать.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Итак, стыдитесь моего слова».'
    reason: alternative_reading
  - marker: b
    text: 'Далее греческий текст заметно отличается: «ведь не всякий стыд хорошо хранить, и не всё у всех одобряется в вере».'
    reason: alternative_reading
lexical_decisions:
- source_word: מוסר בשת
  choice: Наставление о стыде
  rationale: מוסר в литературе мудрости обозначает воспитывающее наставление; сочетание естественно вводит поучение о надлежащем и ненадлежащем стыде. Русское «о стыде» яснее и естественнее буквального «в стыде».
- source_word: שמעו בנים
  choice: Слушайте, сыновья
  rationale: Императив передан современным и естественным «слушайте», а явно мужское обращение בנים сохранено в форме речи учителя мудрости.
- source_word: והכלמו על משפטי
  choice: и стыдитесь согласно моим суждениям
  rationale: «Стыдитесь» сохраняет побудительное значение; על перед משפטי понято как указание на меру или основание оценки — «согласно», а משפטי передано как «мои суждения» без подмены греческим «словом».
- source_word: לא כל בשת נאה לשמור
  choice: Не всякий стыд подобает хранить
  rationale: נאה выражает уместность или подобие, а לשמור — сохранение; формулировка удерживает образ хранимого стыда и звучит достойно по-русски.
- source_word: ולא כל הכלם נבחר
  choice: и не всякое посрамление следует избирать
  rationale: הכלם обозначает стыд, позор или посрамление, а נבחר буквально связано с выбором. «Следует избирать» сохраняет метафору выбора и этическую направленность фразы.
theological_decisions:
- issue: Мужское обращение בנים
  choice: сыновья
  alternative: дети
  rationale: Еврейский текст прямо обращается к «сыновьям» в традиционной форме наставления мудреца; грамматически и культурно значимая форма не нейтрализуется.
- issue: Расхождение еврейского текста и греческой параллели
  choice: В основном тексте следовать засвидетельствованному еврейскому чтению
  alternative: 'Следовать греческому: «Итак, стыдитесь моего слова: не всякий стыд хорошо хранить, и не всё у всех одобряется в вере»'
  rationale: Сохранившийся еврейский текст имеет высокую степень уверенности и является первичным источником. Существенно отличающееся греческое чтение прозрачно отмечено в сноске, а не смешано с основным текстом.
translation_notes:
  register: Современный литературный русский язык с достоинством поучительной речи. Параллелизм и повтор корня «стыд» сохранены, но во второй строке употреблено «посрамление», чтобы отразить смену еврейской формы. Все сноски имеют маркеры в основном тексте.
