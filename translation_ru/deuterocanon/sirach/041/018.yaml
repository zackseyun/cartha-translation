  yaml_path: translation/deuterocanon/sirach/041/018.yaml
  text: Before a master and mistress[a], be ashamed of a lie; before an assembly and the people, of transgression; before a companion and a friend, of wrongdoing; and where you sojourn[c][b], of theft.
translation:
  language: ru
  text: Перед господином и госпожой стыдись лжи[a], перед собранием и народом — преступления, перед товарищем и другом — вероломства[b], а там, где живёшь, — воровства[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «господином и госпожой»; в греческой параллели: «судьёй и правителем». Перевод следует сохранившемуся еврейскому тексту.'
    reason: textual_variant
  - marker: b
    text: Еврейское מעל может также означать «проступок», «нарушение верности» или «злоупотребление доверием».
    reason: lexical_alternative
  - marker: c
    text: 'Заключительная еврейская фраза неясна; буквально — приблизительно: «в месте, где живёшь, относительно זר». Греческая параллель указывает на воровство, что и отражено в переводе.'
    reason: textual_variant
lexical_decisions:
- source_word: מאדון וגברת
  choice: перед господином и госпожой
  rationale: Сохраняется чтение основного еврейского свидетеля. Предлог מ־ в контексте перечня того, чего следует стыдиться перед людьми, естественно передаётся как «перед».
- source_word: על שקר
  choice: лжи
  rationale: Кратко и естественно передаёт существительное שקר в конструкции, обозначающей предмет стыда.
- source_word: מעדה ועם
  choice: перед собранием и народом
  rationale: עדה обозначает собрание или общину; «собрание» сохраняет широкий общественный смысл без ненужного культового оттенка.
- source_word: על פשע
  choice: преступления
  rationale: פשע означает нарушение, проступок или преступление; выбранное слово сохраняет серьёзный нравственный вес выражения.
- source_word: מחבר ורע
  choice: перед товарищем и другом
  rationale: Передаёт пару близких социальных отношений, не сужая חָבֵר до делового или юридического партнёра.
- source_word: על מעל
  choice: вероломства
  rationale: מעל часто обозначает неверность, злоупотребление доверием или вероломный поступок; в межличностном контексте «вероломство» точнее общего «злодеяния».
- source_word: וממקום תגור
  choice: а там, где живёшь
  rationale: Естественная русская передача трудной еврейской конструкции, связанной с местом проживания или временного пребывания.
- source_word: על זר
  choice: воровства
  rationale: Еврейское זר здесь неясно; греческая параллель указывает на кражу. Основной текст передаёт наиболее вероятный смысл, а неопределённость отмечается в сноске.
