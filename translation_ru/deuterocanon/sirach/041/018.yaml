  source_fidelity: 'Перевод точно передаёт последовательность четырёх пар адресатов и предметов стыда в еврейском тексте. «Перед» уместно раскрывает функцию מ־ в этом поучительном перечне. «Вероломство» — допустимая контекстуальная передача מעל как нарушения доверия; его более широкие варианты корректно указаны в сноске. Неясное זר не выдаётся за несомненно установленное чтение: перевод «воровства» обоснован греческой параллелью и сопровождается пояснением.'
