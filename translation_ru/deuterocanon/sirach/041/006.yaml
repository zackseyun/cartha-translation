translation:
  language: ru
  text: От сына беззакония исходит власть зла, и нужда всегда будет с его потомством.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Погибнет наследие детей грешников, и с их потомством останется поношение». Сохранившийся еврейский текст труден, особенно в построении второй части; однако слово, переданное здесь как «нужда», обычно означает «бедность, нужда», тогда как греческий текст говорит о поношении.'
    reason: alternative_reading
lexical_decisions:
- source_word: מבן עול
  choice: от сына беззакония
  rationale: Сохраняется единственное число и конструкция с предлогом מ־ («от»). עול обозначает неправду, несправедливость, беззаконие; «сын беззакония» передаёт нравственную характеристику в краткой и понятной форме.
- source_word: ממשלת רע
  choice: исходит власть зла
  rationale: ממשלה — «власть, господство, правление», а רע может быть субстантивированным «злом». Глагол «исходит» добавлен для естественной русской связи между частями краткой еврейской конструкции, не устраняя её смысловой напряжённости.
- source_word: וריש עם
  choice: и позор
  rationale: Сохранившийся еврейский текст здесь труден. Греческое ὄνειδος подтверждает смысл публичного позора или поношения; «позор» звучит естественно и ёмко.
- source_word: זרעו
  choice: его потомством
  rationale: זרע в данном контексте означает потомков, а не буквальное «семя»; собирательное «потомство» сохраняет форму и смысл.
- source_word: תמיד
  choice: всегда пребывает
  rationale: תמיד выражает постоянство или непрерывность. «Всегда пребывает» естественно связывает это наречие с трудным вторым полустишием.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и греческой параллели в текстуально трудном месте
  choice: Сохранить структуру и лексику еврейского свидетельства, используя греческую параллель лишь для уточнения смысла второго полустишия как длительного позора потомков.
  alternative: 'Перевести непосредственно по греческому тексту: «Наследие детей грешников погибнет, и с их потомством останется поношение».'
  rationale: Еврейское свидетельство является основным, хотя второе полустишие повреждено или неясно. Греческий текст помогает установить общий смысл, но не должен без необходимости заменять отличающееся еврейское чтение.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Сын беззакония» сохраняет образность оригинала; «потомство» и «позор» понятны широкому кругу читателей. Подлинная текстовая неясность отмечена в сноске, а не сглажена в основном тексте.
