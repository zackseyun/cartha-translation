  text: The children of a wicked father are cursed[a], for because of him they are a disgrace.
translation:
  language: ru
  text: Дети нечестивого отца проклинают[a] его, ибо из-за него терпят позор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Дети нечестивого отца порицают его, потому что из-за него они будут опозорены». Еврейское слово передаёт более сильное значение: «проклинают», тогда как греческое подчёркивает порицание.'
    reason: alternative_reading
lexical_decisions:
- source_word: אב רשע
  choice: нечестивого отца
  rationale: Еврейское сочетание стоит в единственном числе и прямо называет отца; רשע указывает на нравственную порочность и здесь естественно передаётся словом «нечестивый».
- source_word: יקוב
  choice: прокляты
  rationale: Глагол נקב допускает значение произнесения проклятия. Пассивная формулировка передаёт результативный, обобщающий смысл фразы, хотя греческая параллель говорит скорее об укоризне.
- source_word: ילד
  choice: дети
  rationale: Форма единственного числа имеет собирательный смысл; множественное число подтверждается греческим τέκνα и звучит по-русски естественно.
- source_word: כי בגללו
  choice: ведь из-за него
  rationale: Сохранена явная причинная связь между положением детей и отцом; местоимение ясно соотносится с отцом.
- source_word: לחרפה
  choice: покрыты позором
  rationale: חרפה означает позор, бесчестье или поношение. Идиоматическая русская конструкция передаёт состояние общественного бесчестья без неестественного буквального оборота «для позора».
theological_decisions:
- issue: Передавать ли более сильный язык проклятия в еврейском тексте или язык укоризны в греческой параллели
  choice: В основном тексте сохранено «прокляты» по еврейскому свидетельству.
  alternative: «Детей нечестивого отца укоряют, и из-за него они будут опозорены».
  rationale: Сохранившийся еврейский текст имеет приоритет и, вероятно, выражает более сильную мысль о проклятии. Греческая параллель подчёркивает общественное порицание; это расхождение не сглажено, а отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура сохранена. Выражение «покрыты позором» выбрано как естественная передача социального бесчестья, обозначенного חרפה.
