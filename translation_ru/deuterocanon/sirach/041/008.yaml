  text: Woe to you[a], wicked men[b], who have abandoned the law of the Most High.
translation:
  language: ru
  text: Горе вам, нечестивые люди, которые оставили закон[a] Всевышнего[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское תורת может означать также «наставление» или «учение»; перевод «закон» соответствует вероятному заветному смыслу и поддерживается греческим νόμον.
    reason: lexical_alternative
  - marker: b
    text: 'В греческом параллельном тексте: «Всевышнего Бога»; основной еврейский свидетель говорит просто: «Всевышнего».'
    reason: alternative_reading
lexical_decisions:
- source_word: אוי / οὐαί
  choice: Горе
  rationale: Передаёт и скорбь, и пророческое обличение; сильнее и точнее, чем более мягкое «увы».
- source_word: לכם / ὑμῖν
  choice: вам
  rationale: Прямо передаёт адресата и естественно сочетается по-русски с формулой «горе вам».
- source_word: אנשי רשע / ἄνδρες ἀσεβεῖς
  choice: нечестивые люди
  rationale: Сохраняет выраженный существительным человеческий референт и передаёт как еврейскую идею порочности, так и греческий оттенок нечестия, не сужая смысл до одного конкретного проступка.
- source_word: אשר / οἵτινες
  choice: которые
  rationale: Ясно и естественно вводит поясняющее относительное предложение.
- source_word: עזבתם / ἐγκατελίπετε
  choice: оставили
  rationale: Передаёт сознательный отказ или отступление без архаического оттенка слова «покинули» и без усиления, не обязательного в исходном тексте.
- source_word: תורת / νόμον
  choice: закон
  rationale: Хотя еврейское слово может означать также «наставление» или «учение», здесь заветный контекст и греческое νόμον поддерживают перевод «закон».
- source_word: עליון / θεοῦ Ὑψίστου
  choice: Всевышнего
  rationale: Следует основному еврейскому чтению, где употреблён божественный титул без явно выраженного слова «Бог».
theological_decisions:
- issue: Божественный титул עליון в сопоставлении с греческим θεοῦ Ὑψίστου
  choice: Всевышнего
  alternative: Всевышнего Бога
  rationale: Основной еврейский свидетель не содержит отдельного слова «Бог». Более пространное греческое чтение отмечено в сноске, чтобы не добавлять его в основной текст.
- issue: Значение תורת в данном контексте
  choice: закон
  alternative: наставление; учение
  rationale: «Закон» сохраняет вероятный заветный смысл и согласуется с греческим νόμον, тогда как более широкий диапазон еврейского слова отражён в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной обличительной формулой. Синтаксис с относительным предложением выбран ради ясности для широкого круга читателей; архаизмы и конфессионально маркированная лексика не используются.
