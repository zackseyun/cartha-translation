base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/041/002.yaml
  text: O death, how fitting is your sentence for a man who is needy and lacking strength, stumbling in everything, defiant, and having lost hope.
translation:
  language: ru
  text: О смерть, как хорош твой приговор для человека нуждающегося и лишённого сил, который спотыкается и во всём попадает в ловушку[a], непокорен и утратил надежду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст в этой части читается иначе: «достигшего глубокой старости и тревожащегося обо всём».'
    reason: Еврейский текст говорит о человеке, который спотыкается и во всём попадает в ловушку; греческий свидетель содержит другой ряд характеристик. Примечание сохраняет это значимое текстовое расхождение.
lexical_decisions:
- source_word: חקיך
  choice: твой приговор
  rationale: По контексту речь о решении или определении смерти; греческое τὸ κρίμα подтверждает значение «приговор, решение». Русское единственное число также соответствует греческому параллельному тексту.
- source_word: איש אונים וחסר עצמה
  choice: для человека нуждающегося и лишённого сил
  rationale: Передаёт параллельные характеристики человека в нужде и без сил; греческие ἐπιδεομένῳ и ἐλασσουμένῳ ἰσχύϊ подтверждают такое понимание.
- source_word: איש כושל ינקש בכל
  choice: который спотыкается во всём
  rationale: כושל обозначает человека, теряющего опору или терпящего неудачу, а ינקש — попадающего в западню; краткое русское выражение сохраняет образ постоянного преткновения, не перегружая стих.
- source_word: סורב
  choice: остаётся непокорным
  rationale: Слово выражает упрямое сопротивление или непослушание; «непокорным» естественно по-русски и согласуется с греческим ἀπειθοῦντι.
- source_word: אובד תקוה
  choice: потерял надежду
  rationale: Прямо передаёт состояние утраченной надежды; не заменяет его более богословски нагруженным словом «отчаялся».
theological_decisions:
- issue: Положительная оценка смертного приговора
  choice: «как благ твой приговор»
  alternative: «как уместен твой приговор»
  rationale: Сохранено прямое טוב — «благ, хорош», хотя по-русски это звучит напряжённо. Такая формулировка не сглаживает мысль стиха о смерти как облегчении для измученного человека.
translation_notes:
  register: Современный литературный русский язык с торжественным прямым обращением к смерти. Синтаксис сделан цельным и понятным, при этом сохранены резкая оценка смерти как блага и последовательность характеристик страдающего человека.
