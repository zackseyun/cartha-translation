translation:
  language: ru
  text: Стыдись отказать в просимом и заставить ближнего отвернуться ни с чем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь неясен и значительно отличается от греческого, который приблизительно гласит: «и приветствия по поводу молчания, и взгляда на женщину-блудницу (или спутницу)». Основной текст следует сохранившемуся еврейскому свидетельству.'
    reason: alternative_reading
lexical_decisions:
- source_word: ממנוע
  choice: отказать
  rationale: מן с формой от מנע выражает удержание или отказ; в сочетании с просьбой естественнее всего по-русски «отказать».
- source_word: מתת שאלה
  choice: в просимом
  rationale: 'Переданный еврейский оборот труден: מתת обычно связано с даром или даянием, а שאלה — с просьбой. «В просимом» сохраняет связь с просьбой, не навязывая неясному сочетанию чрезмерно точного толкования.'
- source_word: מהשב
  choice: заставить … отвернуться
  rationale: Каузативная форма от שוב может означать «повернуть назад, заставить уйти»; здесь она передана как действие, вследствие которого ближний уходит после отказа.
- source_word: אפי רעך
  choice: ближнего отвернуться ни с чем
  rationale: Сочетание, вероятнее всего, относится к лицу ближнего, а не к гневу говорящего. Русская идиома «отвернуться ни с чем» передаёт образ отвращённого лица и смысл безуспешного ухода, избегая неестественного буквального «повернуть лицо ближнего».
- source_word: רעך
  choice: ближнего
  rationale: רע обозначает ближнего, товарища или другого человека; «ближний» сохраняет библейскую этическую окраску и понятно современному читателю.
theological_decisions:
- issue: Значительное расхождение сохранившегося еврейского текста с греческим
  choice: Основной текст следует еврейскому свидетельству и понимает строку как предостережение против отказа просителю и унизительного отсылания ближнего.
  alternative: 'Греческий текст приблизительно: «[стыдись] приветствия по поводу молчания и взгляда на женщину-блудницу (или спутницу)».'
  rationale: Приоритет отдаётся сохранившемуся еврейскому тексту, однако его трудность и существенное отличие от греческой традиции открыто отмечены в сноске; неоднозначность не используется для догматического вывода.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Параллельные инфинитивные конструкции сохранены; буквальный, но неестественный образ «повернуть лицо ближнего» передан понятной идиомой «заставить … отвернуться ни с чем».
