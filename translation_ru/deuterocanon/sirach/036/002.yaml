  yaml_path: translation/deuterocanon/sirach/036/002.yaml
  text: A wise man will not hate the law[a], but the one who is hypocritical in it is like a ship in a storm.
translation:
  language: ru
  text: Мудрый человек не возненавидит закона[a], а тот, кто лицемерит в отношении закона, подобен кораблю в бурю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «законом» здесь, вероятно, подразумевается Божий Закон, Тора; греческое слово также может обозначать наставление.
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: ἀνὴρ σοφὸς
  choice: мудрый человек
  rationale: Сочетание буквально обозначает «мудрого мужа», но в изречении имеет обобщающий смысл; «мудрый человек» естественно передаёт его в современном русском языке.
- source_word: οὐ μισήσει
  choice: не возненавидит
  rationale: Будущее время и прямое значение μισέω сохранены без ослабления до «не станет презирать».
- source_word: νόμον
  choice: Закона
  rationale: В контексте Книги Премудрости Иисуса, сына Сирахова, слово прежде всего указывает на Божий Закон, Тору; прописная буква помогает передать этот вероятный референт, а примечание сохраняет более общее значение.
- source_word: ὁ δὲ ὑποκρινόμενος ἐν αὐτῷ
  choice: а тот, кто лицемерит по отношению к нему
  rationale: Глагольная конструкция передаёт деятельный характер причастия ὑποκρινόμενος, а «по отношению к нему» ясно связывает αὐτῷ с Законом и звучит естественнее буквального «в нём».
- source_word: ὡς ἐν καταιγίδι πλοῖον
  choice: подобен кораблю в бурю
  rationale: Сохранены образ корабля и сильной бури; русская сравнительная конструкция ясно выражает подразумеваемое уподобление.
theological_decisions:
- issue: Значение νόμος
  choice: Божий Закон, то есть Тора, с кратким переводом «Закон»
  alternative: закон или наставление в общем смысле
  rationale: В иудейской литературе Премудрости νόμος обычно обозначает Тору, хотя слово способно сохранять оттенок наставления; примечание не устраняет эту смысловую широту.
- issue: Смысл ὑποκρινόμενος
  choice: человек лицемерно относится к Закону, лишь изображая верность ему
  alternative: статическое обозначение «лицемер»
  rationale: Причастие выражает действие или образ поведения, поэтому глагольный перевод сохраняет нравственное противопоставление подлинной мудрости и притворства.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным литературе Премудрости. Формулировка ясна обычному читателю; образ и резкое противопоставление исходного текста сохранены.
