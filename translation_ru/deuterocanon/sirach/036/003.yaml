  text: A man of understanding will trust in the law, and the law is as trustworthy to him as an oracle of the righteous.
translation:
  language: ru
  text: Разумный человек доверится Закону, и Закон будет для него столь же надёжен, как изречение праведников.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «изречение», может означать также вопрос, ответ или авторитетное решение; его точный оттенок здесь не вполне ясен.
    reason: Сохраняет смысловую неоднозначность слова ἐρώτημα, не перегружая основной текст и не уточняя, что речь идёт о пророческом либо непосредственно божественном речении.
lexical_decisions:
- source_word: ἄνθρωπος συνετός
  choice: разумный человек
  rationale: Передаёт человека, обладающего пониманием и рассудительностью, естественным современным русским выражением.
- source_word: ἐμπιστεύσει νόμῳ
  choice: доверится Закону
  rationale: Сохраняет форму будущего времени и значение доверия; прописная буква показывает, что речь идёт о Законе как о данном Богом установлении.
- source_word: πιστός
  choice: верен
  rationale: 'Сохраняет образ взаимной надёжности: разумный человек доверяется Закону, а Закон оказывается верен ему.'
- source_word: ἐρώτημα δικαίων
  choice: изречение праведников
  rationale: Выражение передано без добавления прямого указания на пророчество или Бога; «изречение» позволяет сохранить оттенок авторитетного ответа или речения.
theological_decisions:
- issue: Характер «изречения праведников»
  choice: Не уточнять, является ли оно пророческим или непосредственно божественным оракулом
  alternative: «пророчество праведников» или «Божье изречение»
  rationale: Греческий текст прямо не содержит ни слова «пророчество», ни слова «Бог»; уточнение сняло бы присущую выражению неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Формулировка сохраняет параллелизм доверия человека Закону и верности Закона человеку; избегаются как разговорность, так и излишне архаичные «оракул» и «вещание».
