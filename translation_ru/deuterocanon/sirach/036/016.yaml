translation:
  language: ru
  text: Наполни Сион хвалой Тебе[a], а народ Твой — Твоей славой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвещением Твоих славных деяний»; также возможно: «перечислением Твоих достоинств». Греческое слово может обозначать хвалу либо хвалебное возвещение достоинств и славных деяний.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «а народ Твой — от Твоей славы». Предлог может указывать на источник; в основном тексте смысл естественно передан как наполнение народа Божьей славой.'
    reason: source_idiom
lexical_decisions:
- source_word: πλῆσον
  choice: Наполни
  rationale: Аористный императив передаёт прямую молитвенную просьбу о наполнении; «наполни» естественно и сохраняет образ исходного текста.
- source_word: Σιὼν
  choice: Сион
  rationale: Традиционная и общепонятная русская форма библейского топонима.
- source_word: ἀρεταλογίας σου
  choice: хвалой Тебе
  rationale: Редкое существительное ἀρεταλογία может обозначать хвалу, прославление достоинств либо возвещение славных деяний. Краткое выражение «хвалой Тебе» естественно в молитвенном контексте, а более конкретные значения сохранены в сноске.
- source_word: ἀπὸ τῆς δόξης σου
  choice: Твоей славой
  rationale: Хотя ἀπό буквально указывает на источник («от»), при подразумеваемом повторении глагола наполнения по-русски содержание наполнения естественно выражается творительным падежом.
- source_word: τὸν λαόν σου
  choice: народ Твой
  rationale: Прямой объект подразумеваемого во второй части глагола «наполни»; порядок слов соответствует возвышенной, но современной русской библейской речи.
theological_decisions:
- issue: Значение ἀρεταλογία в молитве о восстановлении
  choice: хвала Богу
  alternative: возвещение Божьих славных деяний или достоинств
  rationale: Греческое слово допускает как саму хвалу, так и провозглашение того, за что Бога хвалят. Основной текст сохраняет широкий смысл, не ограничивая его только деяниями; существенная неоднозначность отмечена в сноске.
- issue: Значение ἀπό при подразумеваемом глаголе наполнения
  choice: Твоей славой
  alternative: от Твоей славы
  rationale: Буквальное «наполни народ Твой от Твоей славы» в современном русском неясно и неестественно. Творительный падеж ясно передаёт содержание наполнения, тогда как оттенок источника указан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской религиозной издательской традиции. Эллипсис второго «наполни» передан тире, что делает параллелизм ясным и не утяжеляет стих.
