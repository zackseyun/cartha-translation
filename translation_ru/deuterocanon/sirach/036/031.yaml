translation_notes:
  register: Современный литературный русский язык с сохранением лаконичной формы изречения и его образов. Эллиптическое «Так и человеку» удерживает синтаксическую связь с вопросом «Кто доверится…?»; метафора гнезда оставлена в основном тексте.
