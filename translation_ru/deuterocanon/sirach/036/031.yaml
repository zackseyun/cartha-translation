base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/036/031.yaml
  text: For who will trust a well-armed robber[b][a], stumbling from city to city? So it is with a man who has no nest and lodges wherever evening finds him.
translation:
  language: ru
  text: Кто доверится снаряжённому разбойнику[a], который, спотыкаясь, идёт из города в город? Так же не доверяют и человеку, у которого нет гнезда[b] и который останавливается на ночлег там, где застанет его вечер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хорошо подпоясанному разбойнику»; греческое слово может указывать на экипированность и готовность к действию.'
    reason: lexical_alternative
  - marker: b
    text: «Нет гнезда» — образ человека, у которого нет постоянного дома и надёжного пристанища.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐζώνῳ
  choice: снаряжённому
  rationale: Прилагательное буквально описывает хорошо подпоясанного, экипированного и готового к действию человека. «Снаряжённому» передаёт практический смысл и не добавляет прямого указания на оружие, которого в самом слове нет.
- source_word: λῃστῇ
  choice: разбойнику
  rationale: Слово обозначает грабителя или разбойника, нередко действующего с насилием; «разбойник» естественно и точно передаёт этот смысл по-русски.
- source_word: σφαλλομένῳ
  choice: спотыкаясь, бредёт
  rationale: Причастие выражает спотыкание, шаткость или сбивание с пути. Формулировка сохраняет образ неустойчивого движения между городами, не сводя его просто к нейтральному странствованию.
- source_word: νοσσιὰν
  choice: гнезда
  rationale: Буквальное значение — «гнездо», здесь это яркая метафора собственного постоянного и безопасного пристанища; замена на «дом» устранила бы образ.
- source_word: καταλύοντι
  choice: останавливается на ночлег
  rationale: Глагол означает останавливаться или располагаться на постой, часто на ночь. Выбранная фраза естественна в контексте наступления вечера.
- source_word: οὗ ἐὰν ὀψίσῃ
  choice: там, где застанет его вечер
  rationale: Оборот связан с поздним временем и наступлением вечера. Перевод передаёт остановку в случайном месте, где человека настигает вечер, и соответствует образу бесприютности.
- source_word: ἀνθρώπῳ
  choice: человеку
  rationale: Русское «человеку» сохраняет единственное число и обобщённый характер изречения, не внося ненужного гендерного акцента.
