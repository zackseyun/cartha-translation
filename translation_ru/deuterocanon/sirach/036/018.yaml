  yaml_path: translation/deuterocanon/sirach/036/018.yaml
  text: Give a reward to those who wait for you[a], and let your prophets be trusted. Hear, O Lord[b], the prayer of your suppliants.
translation:
  language: ru
  text: Воздай тем, кто ожидает Тебя[a], и да будут Твои пророки признаны достойными доверия[b]. Услышь, Господи, молитву тех, кто взывает к Тебе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тем, кто стойко ожидает Тебя». Греческий глагол может означать как ожидание, так и стойкое терпение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть Твоим пророкам доверяют». Греческое выражение может относиться либо к признанию пророков достойными доверия, либо к доверию к ним.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς μισθὸν
  choice: Воздай
  rationale: Императив δὸς с μισθόν требует просьбы о вознаграждении или воздаянии. «Воздай» естественно и ёмко передаёт эту мысль в контексте молитвы, не придавая ей коммерческого оттенка слова «плата».
- source_word: τοῖς ὑπομένουσίν σε
  choice: тем, кто ожидает Тебя
  rationale: ὑπομένω может обозначать ожидание, стойкость или терпеливое пребывание. При личном дополнении σε и в молитвенном контексте «ожидает Тебя» звучит естественно и выражает верное упование; смысл стойкости отмечен в сноске.
- source_word: οἱ προφῆταί σου
  choice: Твои пророки
  rationale: Прямой и естественный перевод греческого словосочетания.
- source_word: ἐμπιστευθήτωσαν
  choice: да будут признаны верными
  rationale: Пассивный императив допускает понимание «пусть им доверяют» или «пусть они окажутся/будут признаны достоверными». Основной вариант передаёт просьбу о подтверждении истинности пророков и их слов, а альтернативный смысл сохранён в сноске.
- source_word: εἰσάκουσον
  choice: Услышь
  rationale: Глагол означает благосклонно услышать мольбу. «Услышь» сохраняет краткость императива и естественный язык библейской молитвы.
- source_word: Κύριε
  choice: Господи
  rationale: Форма звательного обращения к Богу естественно передаётся русским звательным по функции «Господи».
- source_word: δεήσεως
  choice: молитву
  rationale: δέησις обозначает прошение, мольбу или молитву. «Молитву» понятно современному читателю и уместно в данном контексте.
- source_word: τῶν ἱκετῶν σου
  choice: тех, кто взывает к Тебе
  rationale: ἱκέτης — проситель, умоляющий о помощи. Описательный перевод точен и естественнее для современного русского языка, чем книжное «молителей» или редкое «просителей».
theological_decisions:
- issue: Значение τοῖς ὑπομένουσίν σε
  choice: тем, кто ожидает Тебя
  alternative: тем, кто стойко держится Тебя; тем, кто терпеливо пребывает пред Тобой
  rationale: Греческий глагол совмещает оттенки ожидания и стойкого терпения. В основном тексте избрано естественное для молитвы выражение верного упования, а подлинная лексическая многозначность сохранена в сноске.
- issue: Смысл ἐμπιστευθήτωσαν применительно к пророкам
  choice: да будут признаны верными Твои пророки
  alternative: да доверяют Твоим пророкам; да поверят Твоим пророкам
  rationale: Сжатая пассивная конструкция может говорить как о признании достоверности пророков, так и о доверии к ним. Основной текст подчёркивает подтверждение их истинности, не превращая фразу в утверждение о личной безошибочности; альтернативное прочтение указано в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимения, относящиеся к Богу, написаны с прописной буквы как стилистический выбор. Синтаксис сохраняет три последовательных прошения греческого текста; редкая лексика по возможности заменена ясными описательными выражениями.
