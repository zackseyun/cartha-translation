  text: Have mercy on the people, O Lord, who are called by your name, and on Israel, whom you likened to a firstborn son.
translation:
  language: ru
  text: Помилуй, Господи, народ, названный Твоим именем, и Израиль, которого Ты уподобил первенцу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Израиль, которого Ты сделал Своим первенцем»; ср. Исх. 4:22. Буквально греческий текст говорит: «которого Ты уподобил первенцу».'
    reason: Сохраняется альтернативное, более сильное прочтение образа Израиля как Божьего первенца, при этом поясняется сравнительная форма греческого выражения.
lexical_decisions:
- source_word: ἐλέησον
  choice: помилуй
  rationale: Аористный императив передаёт прямую молитвенную просьбу о милости; «помилуй» естественно и торжественно звучит в современном русском библейском тексте.
- source_word: λαόν
  choice: народ
  rationale: Существительное без артикля по контексту обозначает определённый народ; добавление «Твой» не требуется, поскольку принадлежность раскрывается следующим оборотом.
- source_word: Κύριε
  choice: Господи
  rationale: Русская звательная форма естественно передаёт греческое обращение κύριε.
- source_word: κεκλημένον ἐπʼ ὀνόματί σου
  choice: названный Твоим именем
  rationale: Сохраняет совершенное пассивное значение причастия и выраженную в греческом связь народа с Божьим именем, не заменяя её более свободным «носящий Твоё имя».
- source_word: Ἰσραήλ
  choice: Израиль
  rationale: Традиционная русская форма имени собственного.
- source_word: ὡμοίωσας
  choice: Ты уподобил
  rationale: Передаёт сравнительную силу ὁμοιόω — «сделать подобным, уподобить» — и не превращает сравнение в прямое утверждение тождества.
- source_word: πρωτόγονον
  choice: первенцу
  rationale: Передаёт значение «первенец, перворождённый» без обязательного добавления отсутствующего в греческом слова «сын»; контекст родственного образа остаётся ясным.
theological_decisions:
- issue: Утверждает ли заключительная часть, что Израиль является Божьим первенцем, или говорит об уподоблении первенцу
  choice: «которого Ты уподобил первенцу»
  alternative: «которого Ты сделал Своим первенцем»
  rationale: Глагол ὁμοιόω имеет сравнительное значение «уподоблять, делать подобным». Основной текст сохраняет формулировку данного греческого свидетеля и не гармонизирует её с Исх. 4:22; более сильное понимание вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Порядок слов слегка перестроен ради естественного русского звучания; коллективное единственное число «народ, названный» сохранено.
