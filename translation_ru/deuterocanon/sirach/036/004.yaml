translation:
  language: ru
  text: Подготовь речь[a] — и тогда тебя услышат; свяжи воедино наставление и ответь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Подготовь слово — и тогда тебя услышат». Греческое λόγον стоит в единственном числе и может означать «слово» или «речь»; выражение «свяжи воедино наставление» можно также передать более истолковательно: «упорядочь наставление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑτοίμασον
  choice: Подготовь
  rationale: Аористный императив ἑτοιμάζω выражает призыв заранее привести речь в готовность; «подготовь» естественно и точно передаёт эту мысль.
- source_word: λόγον
  choice: свою речь
  rationale: Единственное число λόγον может означать «слово», «речь» или содержание высказывания. В данном контексте «свою речь» звучит естественно и сохраняет грамматическое число оригинала.
- source_word: οὕτως
  choice: тогда
  rationale: 'Наречие указывает на следствие или способ: если речь подготовлена, говорящего услышат. «Тогда» кратко и естественно выражает практический результат.'
- source_word: ἀκουσθήσῃ
  choice: тебя услышат
  rationale: Будущая пассивная форма ἀκούω передана русской неопределённо-личной конструкцией, естественной для смысла «получить возможность быть выслушанным».
- source_word: σύνδησον
  choice: свяжи воедино
  rationale: Сохраняется буквальная метафора συνδέω — соединить отдельные части в связное целое; «воедино» делает образ ясным по-русски.
- source_word: παιδείαν
  choice: наставление
  rationale: В литературе мудрости παιδεία означает воспитывающее обучение, наставление и дисциплину. «Наставление» лучше всего подходит к контексту обдуманного ответа и не сужает смысл до наказания.
- source_word: ἀποκρίθητι
  choice: отвечай
  rationale: Императив ἀποκρίνομαι прямо означает «ответь/отвечай». Несовершенный вид по-русски естественно передаёт общий совет о порядке речи.
