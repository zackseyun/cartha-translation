  text: He who acquires a wife begins an acquisition[b][a], a helper corresponding to him and a pillar of rest.
translation:
  language: ru
  text: 'Кто приобретает жену, тот полагает начало приобретению[a]: она — помощница, ему под стать[b], и столп покоя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полагает начало достоянию» либо «собственности». В греческом тексте слова «приобретает» и «приобретение» однокоренные.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «соответствующая ему»; то есть подходящая ему или ему соразмерная.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κτώμενος
  choice: Кто приобретает
  rationale: Причастная конструкция имеет обобщённый, пословичный смысл; «кто приобретает» естественно передаёт его по-русски и сохраняет связь с однокоренным κτήσεως.
- source_word: γυναῖκα
  choice: жену
  rationale: В контексте создания домашнего уклада γυνή означает именно жену, а не женщину вообще.
- source_word: ἐνάρχεται κτήσεως
  choice: полагает начало приобретению
  rationale: Оборот сохраняет значение начала и, насколько возможно по-русски, однокоренную игру κτώμενος — κτήσεως, не сводя κτῆσις однозначно к имуществу или собственности.
- source_word: βοηθὸν
  choice: помощница
  rationale: Прямой и естественный эквивалент, согласованный с «женой».
- source_word: κατʼ αὐτόν
  choice: ему под стать
  rationale: Передаёт буквальное «соответствующую ему» как соответствие или пригодность, не уточняя характер этого соответствия.
- source_word: στύλον ἀναπαύσεως
  choice: столп покоя
  rationale: Сохраняет архитектурную метафору στῦλος и широкое значение ἀνάπαυσις — покой, отдых, отрада.
theological_decisions:
- issue: Мужской адресат в пословичном изречении
  choice: Кто приобретает жену
  alternative: Человек, вступающий в брак
  rationale: Перевод сохраняет мужскую перспективу греческого текста, обусловленную словом «жена», и не заменяет её гендерно-нейтральным обобщением.
- issue: Характер соответствия жены мужу
  choice: ему под стать
  alternative: подходящая ему
  rationale: 'Выражение κατʼ αὐτόν оставлено достаточно широким: оно обозначает соответствие, но не определяет его как подчинение, равенство или совпадение качеств.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенной пословичной интонацией. «Столп покоя» сохраняет компактную образность оригинала; пояснительные местоимение и двоеточие делают греческое приложение понятным по-русски.
