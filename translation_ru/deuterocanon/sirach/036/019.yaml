  yaml_path: translation/deuterocanon/sirach/036/019.yaml
  text: according to the blessing of Aaron over your people[a], and all those on the earth will know that you are the Lord[b], the God of the ages.
translation:
  language: ru
  text: по благословению Аарона над Твоим народом[a], и узнают все на земле, что Ты — Господь, Бог веков[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для Твоего народа»; возможно также: «о Твоём народе». Греческое выражение может относиться к благословению, которое Аарон произносит над Израилем.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вечный Бог». Буквально по-гречески: «Бог веков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὴν εὐλογίαν
  choice: по благословению
  rationale: Передаёт соответствие благословению Аарона и естественно звучит по-русски, не добавляя отсутствующего в данном фрагменте сказуемого.
- source_word: Ἀαρὼν
  choice: Аарона
  rationale: Традиционная и общепринятая русская форма имени; родительный падеж определяется сочетанием «благословение Аарона».
- source_word: περὶ τοῦ λαοῦ σου
  choice: над Твоим народом
  rationale: В контексте произнесения благословения русское «над народом» естественно передаёт направленность благословения, хотя περὶ допускает также значения «о» и «для».
- source_word: γνώσονται
  choice: узнают
  rationale: Будущее время сохранено; «узнают» здесь естественно выражает достижение познания или признания.
- source_word: πάντες οἱ ἐπὶ τῆς γῆς
  choice: все на земле
  rationale: Кратко и близко к греческому выражению, без добавления существительного «жители».
- source_word: Κύριος
  choice: Господь
  rationale: Обычное русское соответствие этому божественному титулу.
- source_word: ὁ θεὸς τῶν αἰώνων
  choice: Бог веков
  rationale: Сохраняет буквальный временной образ множественного αἰώνων и не сводит его без пояснения к толкованию «вечный Бог».
theological_decisions:
- issue: Передача божественного титула Κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — стандартный и контекстуально уместный божественный титул; вариант «Владыка» здесь был бы менее прямым.
- issue: Передача выражения ὁ θεὸς τῶν αἰώνων
  choice: Бог веков
  alternative: вечный Бог
  rationale: Буквальная конструкция сохраняет образ и широту греческого выражения; смысловой вариант приведён в сноске без устранения возможного оттенка.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-библейского регистра. Начальная строчная буква сохраняет синтаксическую незавершённость исходного фрагмента и его связь с предшествующим контекстом. Местоимение «Твоим» написано с прописной буквы как традиционное уважительное обращение к Богу.
