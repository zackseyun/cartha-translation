translation:
  language: ru
  text: Женщина примет любого мужчину[a], но одна дочь лучше другой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Жена примет любого мужчину». Греческое γυνή означает «женщина» или «жена», а ἄρρην буквально указывает на лицо мужского пола.'
    reason: Лексическая неоднозначность слов γυνή и ἄρρην и возможный брачный оттенок выражения.
lexical_decisions:
- source_word: πάντα ἄρρενα
  choice: любого мужчину
  rationale: Сочетание πάντα с формой единственного числа имеет распределительное значение «любого / всякого». Ἄρρην обозначает мужчину как представителя мужского пола; русское «мужчину» передаёт смысл естественно, тогда как буквальное «самца» применительно к человеку звучало бы уничижительно.
- source_word: ἐπιδέξεται
  choice: примет
  rationale: Будущая форма среднего залога выражает принятие или согласие принять. «Примет» сохраняет краткость изречения и не добавляет прямо не названного брачного действия.
- source_word: γυνή
  choice: женщина
  rationale: Γυνή может означать как «женщина», так и «жена». Здесь обобщённое «женщина» меньше сужает смысл; возможное брачное прочтение отмечено в сноске.
- source_word: ἔστιν δὲ
  choice: но
  rationale: Δέ вводит сопоставление двух частей изречения; русское «но» кратко и ясно передаёт противопоставление.
- source_word: θυγάτηρ θυγατρὸς κρεῖσσον
  choice: одна дочь лучше другой
  rationale: 'Повтор существительного при сравнительной форме κρεῖσσον представляет сравнительную конструкцию: речь идёт не о «дочери дочери», а о превосходстве одной дочери над другой.'
theological_decisions:
- issue: Социальный контекст изречения
  choice: Передать стих как обобщённое наблюдение о женщине и сравнении дочерей, не добавляя нравственной оценки или прямого указания на брак.
  alternative: Перевести γυνή как «жена» и сделать брачный контекст явным либо смягчить гендерную формулировку.
  rationale: Греческий текст краток и афористичен. Перевод сохраняет его исторически обусловленную гендерную формулировку и неоднозначность, не превращая наблюдение в отдельное богословское или нравственное утверждение.
translation_notes:
  register: Современный литературный русский язык; краткий, достойный и пословичный строй. Формулировка «любого мужчину» предпочтена буквальному, но неестественному применительно к человеку «любого самца».
