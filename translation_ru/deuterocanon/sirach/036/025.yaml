  yaml_path: translation/deuterocanon/sirach/036/025.yaml
  text: If there is mercy and gentleness on her tongue[b][a], her husband is not like the sons of men.
translation:
  language: ru
  text: Если на её языке милость и кротость[a], то её муж не таков, как другие мужчины[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть если её речь отмечена милостью и кротостью. Греческое выражение буквально говорит о том, что эти качества находятся «на её языке».
    reason: cultural_note
  - marker: b
    text: 'Буквально: «не таков, как сыны человеческие». Этот несколько необычный греческий оборот, вероятно, означает, что такой муж выделяется среди прочих мужчин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ γλώσσης αὐτῆς
  choice: на её языке
  rationale: Сохраняет греческий образ языка как носителя речи; примечание поясняет смысл выражения.
- source_word: ἔλεος
  choice: милость
  rationale: Прямо передаёт нравственный оттенок сострадания и благожелательности, не сводя его лишь к приветливости.
- source_word: πραΰτης
  choice: кротость
  rationale: Традиционное и понятное обозначение мягкости и незлобивости; точнее передаёт добродетель, чем нейтральное «мягкость».
- source_word: ὁ ἀνὴρ αὐτῆς
  choice: её муж
  rationale: В контексте речи о жене ἀνήρ означает именно супруга.
- source_word: καθʼ υἱοὺς ἀνθρώπων
  choice: как другие мужчины
  rationale: Передаёт вероятный смысл необычного греческого сравнения современным русским языком; буквальная форма приведена в примечании, поскольку оборот допускает напряжённость и не вполне прозрачен.
theological_decisions:
- issue: Мужской антропологический оборот καθʼ υἱοὺς ἀνθρώπων
  choice: как другие мужчины
  alternative: как сыны человеческие
  rationale: Мужской род сохранён, но буквальный греческий оборот в основном тексте передан естественным русским сравнением. Примечание сохраняет исходную формулировку и предупреждает, что речь, вероятно, об исключительности мужа, а не о его нечеловеческой природе.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного образа «на языке». Синтаксис сделан ясным, а необычный буквальный оборот второй части сохранён в примечании без догматического уточнения.
