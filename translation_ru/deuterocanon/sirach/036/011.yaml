lexical_decisions:
- source_word: ἐν ὀργῇ πυρὸς
  choice: В пылающем гневе
  rationale: Греческое сочетание буквально означает «в гневе огня». Прилагательное «пылающем» естественно передаёт огненный образ и силу губительного гнева, не сводя выражение к общему «в гневе».
- source_word: καταβρωθήτω
  choice: да будет пожран
  rationale: Страдательный императив передаёт пожелание быть поглощённым или пожранным. «Пожран» сохраняет сильную метафору исходного глагола и не подменяет её более нейтральным «истреблён».
- source_word: ὁ σωζόμενος
  choice: уцелевший
  rationale: Причастие буквально может обозначать «спасаемого» или «сохраняемого», однако во враждебном контексте вероятен смысл того, кто до сих пор избежал гибели. «Уцелевший» выражает этот контекстуальный смысл; буквальная неоднозначность отмечена в сноске.
- source_word: οἱ ἀδικοῦντες τὸν λαόν σου
  choice: поступающие несправедливо с Твоим народом
  rationale: Формулировка сохраняет глагольный характер причастия и объект «Твой народ», не усиливая значение до более узкого «угнетающие».
- source_word: εὕροισαν ἀπώλειαν
  choice: да найдут погибель
  rationale: Оптатив передан как молитвенное пожелание. «Найдут погибель» близко следует греческой идиоме, оставаясь понятным и торжественным по-русски.
theological_decisions:
- issue: Просительный характер суда
  choice: Сохранить прямое молитвенное пожелание суда посредством «да будет… и да найдут…»
  alternative: Передать как предсказание будущего суда либо смягчить пожелание
  rationale: καταβρωθήτω и εὕροισαν выражают просьбу или пожелание. Перевод сохраняет суровую импрекативную силу и не превращает её в нейтральное предсказание.
- issue: Неоднозначность ὁ σωζόμενος
  choice: В основном тексте передать контекстуально как «уцелевший», а буквальный смысл сохранить в сноске
  alternative: «спасаемый» или «сохраняемый» непосредственно в основном тексте
  rationale: Контекст говорит о враге, пока избежавшем уничтожения, однако форма сама по себе допускает смысл спасения или сохранения. Сноска не позволяет скрыть эту подлинную трудность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Конструкции с «да» сохраняют торжественный импрекативный тон; написание «Твоим» с прописной буквы соответствует обращению к Богу.
