translation:
  language: ru
  text: Гортань пробует на вкус пищу, добытую на охоте, так и разумное сердце — ложные слова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте буквально: «Гортань пробует на вкус пищу охоты, так разумное сердце — ложные слова»; во второй части глагол опущен и подразумевается из сравнения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φάρυγξ
  choice: гортань
  rationale: Существительное буквально обозначает горло или глотку. «Гортань» сохраняет телесный образ и в данном афористическом контексте звучит достойно, хотя физиологически органом вкуса является не она.
- source_word: γεύεται
  choice: различает вкус
  rationale: Глагол означает «пробовать на вкус, вкушать». Выражение «различает вкус» естественно связывает чувственное восприятие с подразумеваемым распознаванием во второй части сравнения.
- source_word: βρώματα θήρας
  choice: добытой на охоте пищи
  rationale: βρώματα — пища, съестное; родительный θήρας связывает её с охотой. Формулировка сохраняет широкий смысл и не сужает его до мяса дичи.
- source_word: καρδία συνετή
  choice: разумное сердце
  rationale: В литературе мудрости сердце является средоточием понимания и суждения. «Разумное» точно передаёт συνετή и сохраняет исходный антропологический образ.
- source_word: λόγους ψευδεῖς
  choice: ложные слова
  rationale: Близкая и естественная передача слов, характеризуемых ложностью, без сужения до формальных утверждений или намеренной лжи.
- source_word: οὕτως καρδία συνετὴ λόγους ψευδεῖς
  choice: так и разумное сердце — ложные слова
  rationale: В греческой второй части нет выраженного глагола; тире сохраняет эллипсис и позволяет читателю перенести действие распознавания из первой части, не добавляя в основной текст отдельный толкующий глагол.
