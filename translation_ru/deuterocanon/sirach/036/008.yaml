  text: По ведению Господа они были разделены, и Он изменил времена и праздники.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν γνώσει Κυρίου
  choice: По знанию Господа
  rationale: Сохраняет инструментально-причинную неоднозначность ἐν и близко передаёт греческую формулировку, не уточняя без достаточных оснований, идёт ли речь о знании, принадлежащем Господу, или о знании о Нём.
- source_word: διεχωρίσθησαν
  choice: были разделены
  rationale: Пассивная форма и множественное число сохранены; перевод не подменяет разделение более интерпретирующим «были различены».
- source_word: ἠλλοίωσεν
  choice: изменил
  rationale: Естественный современный эквивалент со значением изменения или преобразования.
- source_word: καιρούς
  choice: времена
  rationale: Передаёт множественное число и смысл установленных или особых времён без неоправданного сужения до сезонов года.
- source_word: ἑορτάς
  choice: праздники
  rationale: Прямой и общеупотребительный эквивалент для религиозных праздничных дней.
theological_decisions:
- issue: Субъект глагола ἠλλοίωσεν прямо не назван
  choice: Он изменил
  alternative: изменил
  rationale: В русском языке местоимение делает фразу естественной; прописная буква соотносит подразумеваемого субъекта с Господом, как подсказывает ближайший контекст, не добавляя нового титула.
- issue: Характер «знания Господа»
  choice: По знанию Господа
  alternative: Знанием Господа / благодаря познанию Господа
  rationale: Родительный оборот сохраняет возможную субъективную и объективную трактовку, не решая богословскую неоднозначность за текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Синтаксис намеренно близок к греческому, но остаётся понятным обычному читателю; подлинная неоднозначность выражения «знание Господа» сохранена.
