  source_fidelity: «По знанию Господа» передаёт γενитивную конструкцию, однако в современном русском это сочетание звучит как неестественная калька и не вполне ясно выражает обстоятельственное ἐν γνώσει. «По ведению Господа» — традиционно понятный литературный оборот со значением «по его знанию/усмотрению», не превращающий γνώσις в иной богословский термин. Пассив «были разделены», множественное число «времена и праздники» и подразумеваемый субъект второго глагола сохранены.
  naturalness: Нужна небольшая стилистическая правка первого оборота. «По ведению Господа» естественнее для современной литературной библейской прозы, чем «По знанию Господа». Остальная фраза ясна и благозвучна.
  terminology: «Господь», «времена» и «праздники» уместны. «Ведение» здесь не является техническим конфессиональным термином, а передаёт γνώσις в его контекстуально возможном значении знания или усмотрения.
