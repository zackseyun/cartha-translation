  source_fidelity: 'Вторая половина греческой строки продолжает партитивное противопоставление: из совокупности дней одни выделены и освящены, другие отнесены к разряду обычных, исчисляемых дней. Черновое «отнёс к числу дней» слишком буквально воспроизводит греческий оборот, но по-русски создаёт нелогичное впечатление, будто дни отнесены к дням. Английская аудиторская формулировка о «fixed number of days» не должна определять русский перевод: она не отражает наиболее естественную функцию εἰς ἀριθμὸν ἡμερῶν в данном контрасте.'
