lexical_decisions:
- source_word: ἀπ᾽ αὐτῶν
  choice: одни из них … другие
  rationale: 'Повторённое сочетание ἀπό с родительным падежом допускает партитивное понимание: речь идёт о разных днях из одной совокупности. В русском эта конструкция естественно передаётся парой «одни из них … другие», хотя буквальное «от них» оставалось бы более неопределённым.'
- source_word: ἀνύψωσεν
  choice: возвысил
  rationale: Глагол означает «поднял, возвысил»; в данном контексте «возвысил» передаёт выделение особым достоинством и сохраняет торжественный регистр.
- source_word: ἡγίασεν
  choice: освятил
  rationale: «Освятил» прямо передаёт значение ἁγιάζω и не сужает его до исключительно обрядового «посвятил».
- source_word: ἔθηκεν
  choice: отнёс
  rationale: 'У τίθημι широкий диапазон значений: «положил, поставил, определил». В сочетании с «к числу» естественное русское «отнёс» передаёт классификацию, а не физическое помещение.'
- source_word: εἰς ἀριθμὸν ἡμερῶν
  choice: к числу дней
  rationale: Формулировка близка к буквальному «в число дней» и сохраняет не вполне определённый смысл греческой фразы, не добавляя в основной текст отсутствующего прилагательного «обычных».
theological_decisions:
- issue: Подлежащее при глаголах в греческом тексте не названо
  choice: он
  alternative: Бог; Господь; отсутствие выраженного местоимения
  rationale: Строчное «он» необходимо для естественного самостоятельного русского предложения и сохраняет анафорическую отсылку, не вводя отсутствующего в этой строке имени или титула.
- issue: Соотношение двух групп дней
  choice: одни из них … другие
  alternative: от них … от них
  rationale: Партитивное прочтение хорошо соответствует контексту различения дней, однако примечание сохраняет более буквальную неопределённость повторённого ἀπ᾽ αὐτῶν.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным для отдельного стиха; неявное греческое подлежащее передано строчным «он», чтобы не навязывать в этой строке божественный титул. Оба маркера примечаний присутствуют в основном тексте.
