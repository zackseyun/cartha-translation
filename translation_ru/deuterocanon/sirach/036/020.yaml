  text: Every food is eaten by the stomach[a], but one food is better than another.
translation:
  language: ru
  text: Всякую пищу съедает желудок, но одна пища лучше другой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶν βρῶμα
  choice: всякую пищу
  rationale: 'Сочетание имеет обобщённо-дистрибутивный смысл: речь идёт о любом виде пищи. В русском винительный падеж обусловлен естественной активной конструкцией.'
- source_word: φάγεται κοιλία
  choice: желудок принимает
  rationale: Греческая форма буквально означает «будет съедено желудком», но в изречении выражает постоянную, общеизвестную закономерность. Активная русская конструкция звучит естественно и сохраняет желудок как образ того, что принимает пищу.
- source_word: κοιλία
  choice: желудок
  rationale: В контексте еды слово обозначает пищеварительный орган; «желудок» точнее и литературнее, чем «живот» или «чрево».
- source_word: ἔστιν δὲ
  choice: но
  rationale: Союз вводит контраст между способностью желудка принимать всякую пищу и различием пищи по качеству.
- source_word: βρῶμα βρώματος κάλλιον
  choice: одна пища лучше другой
  rationale: Греческий сравнительный оборот буквально сопоставляет «пищу с пищей». Русская формула естественно передаёт мысль, что виды пищи различаются по качеству.
