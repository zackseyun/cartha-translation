translation_notes:
  register: 'Краткое изречение передано современным литературным русским языком с сохранением афористичности и параллельного повторения слова «пища». Будущее пассивное греческого текста понято как гномическое; оно передано настоящим временем. Из-за серьёзного несоответствия английской сноски исходному греческому тексту сноска не перенесена: в английском слое маркер поставлен после «stomach», хотя её содержание относится ко второй половине стиха.'
