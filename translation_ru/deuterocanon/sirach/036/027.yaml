  yaml_path: translation/deuterocanon/sirach/036/027.yaml
  text: Where there is no fence[a], the property will be plundered; and where there is no wife[b], he will groan as he wanders.
translation:
  language: ru
  text: Где нет ограды[a], имущество будет разграблено; а у кого нет жены[b], тот будет стонать, скитаясь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изгороди». Греческое слово означает защитное ограждение или преграду вокруг владения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по-гречески: «и где нет жены, будет стонать, скитаясь»; субъект второй части не назван прямо и подразумевается из контекста.'
    reason: source_ambiguity
lexical_decisions:
- source_word: φραγμός
  choice: ограда
  rationale: Слово обозначает защитную преграду или ограждение вокруг владения. «Ограда» сохраняет образ, не уточняя материал и устройство.
- source_word: διαρπαγήσεται
  choice: будет разграблено
  rationale: Будущее страдательного залога выражает насильственное расхищение имущества другими людьми.
- source_word: κτῆμα
  choice: имущество
  rationale: Общее обозначение собственности или владения; «имущество» ясно и естественно в данном контексте.
- source_word: γυνή
  choice: жена
  rationale: В контексте изречения о домашнем укладе слово означает именно жену, а не женщину вообще.
- source_word: στενάξει
  choice: будет стонать
  rationale: Передаёт сильное выражение тяготы и страдания, заложенное в στενάζω.
- source_word: πλανώμενος
  choice: скитаясь
  rationale: Причастие описывает продолжающееся неустроенное состояние, сопутствующее стенанию.
- source_word: οὗ οὐκ ἔστιν ... καὶ οὗ οὐκ ἔστιν
  choice: Где нет ... а у кого нет ...
  rationale: В первой части пространственное «где» естественно относится к незащищённому имуществу; во второй «у кого» ясно выражает отсутствие жены у подразумеваемого человека, не добавляя отсутствующего в греческом существительного.
theological_decisions:
- issue: Подразумеваемый субъект второй части
  choice: тот будет стонать, скитаясь
  alternative: он будет стонать, скитаясь
  rationale: В греческом субъект глагола прямо не назван, но по слову «жена» подразумевается человек, у которого её нет. Соотносительная конструкция «у кого ... тот» естественна по-русски, не вводит слова «мужчина» или «муж» и сохраняет подразумеваемый характер субъекта.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. Параллелизм сохранён настолько, насколько позволяет естественный русский синтаксис; во второй части использована соотносительная конструкция, устраняющая неясную русскую анафору без добавления нового действующего лица.
