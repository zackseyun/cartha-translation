  text: A woman's beauty brightens the face[b][a], and surpasses every desire of a man.
translation:
  language: ru
  text: Красота женщины озаряет лицо[a] и превосходит всякое желание мужчины[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «радует лицо», «веселит лицо».'
    reason: Лексическая вариативность глагола ἱλαρύνει.
  - marker: b
    text: 'Греческое слово может также означать «человек»: «превосходит всякое человеческое желание».'
    reason: Слово ἀνθρώπου допускает как гендерно конкретное, так и обобщённое прочтение.
lexical_decisions:
- source_word: κάλλος
  choice: красота
  rationale: Прямо передаёт значение внешней красоты и естественно звучит в русском изречении.
- source_word: γυναικός
  choice: женщины
  rationale: Родительный падеж передан буквально; более узкое «жены» контекстом не требуется.
- source_word: ἱλαρύνει
  choice: озаряет
  rationale: Глагол означает «делать радостным, весёлым»; в сочетании с «лицом» слово «озаряет» сохраняет и образ видимого выражения, и оттенок радости.
- source_word: πρόσωπον
  choice: лицо
  rationale: Сохраняется конкретный образ греческого текста без добавления неуказанного притяжательного местоимения.
- source_word: ὑπὲρ πᾶσαν ἐπιθυμίαν
  choice: превыше всего, чего желает
  rationale: Так естественно по-русски передаётся значение превосходства, выраженное ὑπέρ с винительным падежом, а существительное «желание» раскрывается без изменения смысла.
- source_word: ἀνθρώπου
  choice: мужчина
  rationale: Хотя ἄνθρωπος может иметь обобщённое значение «человек», сопоставление с «женщиной» в данном изречении допускает и, вероятно, поддерживает гендерно конкретное прочтение.
- source_word: ὑπεράγει
  choice: превыше
  rationale: Передаёт значение «превосходит, превышает»; вместе с предшествующей конструкцией образует естественную русскую сравнительную формулу.
theological_decisions:
- issue: Гендерная определённость слова ἀνθρώπου
  choice: В основном тексте — «мужчина».
  alternative: «человек»
  rationale: Высказывание говорит о красоте женщины в отношении воспринимающего её; потому мужское прочтение уместно, однако лексически возможное обобщённое значение не скрывается и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной формой. «Озаряет лицо» сохраняет телесный образ оригинала; «превыше всего, чего желает» устраняет неестественное для русского сочетание «превосходит всякое желание», не ослабляя сравнительного смысла.
