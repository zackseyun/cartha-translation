  text: A horse for mounting is like a mocking friend; under anyone who sits on it[a], it neighs.
translation:
  language: ru
  text: 'Конь для верховой езды — как насмешливый друг: под всяким, кто сидит на нём[a], он ржёт.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение кратко и необычно. Оборот, переведённый как «для верховой езды», в других контекстах может обозначать спаривание, но здесь упоминание человека, сидящего на коне, указывает на езду верхом.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵππος
  choice: конь
  rationale: Обычное обозначение лошади; «конь» естественно звучит в данном образе и не уточняет без необходимости, что это жеребец.
- source_word: εἰς ὀχείαν
  choice: для верховой езды
  rationale: Хотя ὀχεία может иметь значение спаривания, сочетание с образом сидящего сверху человека указывает здесь на езду верхом; перевод сохраняет этот смысл без двусмысленного русского «для случки».
- source_word: ὡς φίλος μῶκος
  choice: как насмешливый друг
  rationale: μῶκος связано с насмешкой и издевательством; «насмешливый друг» сохраняет личностное сравнение и его отрицательную окраску.
- source_word: ὑποκάτω παντὸς ἐπικαθημένου
  choice: под каждым, кто на него сядет
  rationale: Передаёт универсальность παντός и значение сидения сверху; по-русски формулировка естественна и ясно относится к коню.
- source_word: χρεμετίζει
  choice: он ржёт
  rationale: Обычный русский глагол для характерного голоса лошади, соответствующий χρεμετίζει.
