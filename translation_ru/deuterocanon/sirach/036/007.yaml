lexical_decisions:
- source_word: διὰ τί
  choice: Почему
  rationale: Естественно вводит прямой вопрос о причине различия.
- source_word: ἡμέρα ἡμέρας ὑπερέχει
  choice: один день превосходит другой
  rationale: Родительный падеж при ὑπερέχει выражает сравнение; «превосходит» сохраняет его силу, не уточняя, в каком именно отношении один день выше другого.
- source_word: πᾶν φῶς ἡμέρας ἐνιαυτοῦ
  choice: свет каждого дня в году
  rationale: Передаёт распределительное πᾶν и связывает ἐνιαυτοῦ со всеми рассматриваемыми днями года; по-русски звучит ясно и естественно.
- source_word: ἀφ᾽ ἡλίου
  choice: исходит от солнца
  rationale: ἀπό обозначает источник; «исходит от» точно и литературно передаёт эту связь.
theological_decisions:
- issue: Сравнительное значение ὑπερέχει
  choice: превосходит другой
  alternative: выше другого
  rationale: Формулировка сохраняет вопрос о различии между днями при общем источнике света и не привносит нравственной либо культовой оценки.
