  yaml_path: translation/deuterocanon/sirach/036/001.yaml
  text: No evil will confront the one who fears the Lord[b][a], but in trial he will rescue him again.
translation:
  language: ru
  text: Того, кто боится Господа, не постигнет зло[a], но в испытании[b] Господь вновь избавит его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беда» или «несчастье». Греческое κακόν может обозначать зло, вред либо бедствие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в искушении» или «при испытании». Греческое πειρασμός может означать испытание, искушение или тяжёлое переживание.'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте подлежащее и дополнение при глаголе «избавит» прямо не названы; по контексту подразумевается, что Господь избавит боящегося Его.
    reason: implicit_participants
lexical_decisions:
- source_word: τῷ φοβουμένῳ Κύριον
  choice: того, кто боится Господа
  rationale: Субстантивированное причастие обозначает любого человека, для которого характерен страх Господень. Оборот сохраняет единственное число и звучит естественно по-русски.
- source_word: οὐκ ἀπαντήσει
  choice: не постигнет
  rationale: Глагол передаёт встречу или наступление чего-либо; при подлежащем κακόν русское «не постигнет» естественно выражает смысл «не случится с ним», не устраняя образ надвигающейся беды.
- source_word: κακόν
  choice: зло
  rationale: Слово может означать зло, вред или бедствие. «Зло» сохраняет его смысловую широту и не сводит изречение только к физическому ущербу.
- source_word: ἐν πειρασμῷ
  choice: в испытании
  rationale: πειρασμός допускает значения испытания, искушения и тяжёлого переживания. В контексте избавления «испытание» наиболее широко передаёт невзгоду, не ограничивая смысл нравственным искушением.
- source_word: καὶ πάλιν
  choice: вновь
  rationale: πάλιν обычно означает «снова, вновь» и здесь указывает на повторное или возобновляемое избавление.
- source_word: ἐξελεῖται
  choice: Господь вновь избавит его
  rationale: Форма глагола означает «избавит, спасёт». Для естественного русского предложения явно названы подразумеваемые из контекста субъект — Господь — и объект — боящийся Его человек.
theological_decisions:
- issue: Подразумеваемое подлежащее ἐξελεῖται
  choice: Господь вновь избавит его
  alternative: он избавится; для него найдётся избавление
  rationale: В греческом подлежащее не выражено, однако ближайшее упоминание Господа и общий смысл изречения естественно указывают на Него как на совершающего избавление. Неявность оригинала отмечена в сноске.
- issue: Соотношение обещания «не постигнет зло» с последующим испытанием
  choice: Сохранено прямое обещание о зле и одновременно признана реальность испытания
  alternative: Сузить κακόν до окончательного вреда или перефразировать обещание как защиту только от последствий зла
  rationale: 'Текст сам удерживает напряжение между первой и второй частями: боящегося Господа не постигнет зло, однако он оказывается в испытании и получает избавление. Перевод не снимает этого напряжения толкованием.'
translation_notes:
  register: Современный литературный русский язык с достоинством, присущим изречению мудрости. Порядок слов выдвигает «того, кто боится Господа» как тему, а повтор слова «Господь» устраняет неясность русского местоимения и делает подразумеваемый греческий субъект понятным.
