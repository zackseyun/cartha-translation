  text: Give testimony to your creatures from the beginning[b][a], and raise up the prophecies spoken in your name.
translation:
  language: ru
  text: Дай свидетельство Твоим творениям, сотворённым в начале[a], и воздвигни пророчества, изречённые во имя Твоё[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоим творениям, бывшим в начале». Греческое выражение сжато и может относиться вообще к тому, что Бог сотворил в начале, а не только к живым существам.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «исполни пророчества, изречённые во имя Твоё». Буквально по-гречески: «воздвигни пророчества»; это может подразумевать, что Бог приведёт их в исполнение.'
    reason: alternative_reading
lexical_decisions:
- source_word: δὸς
  choice: Дай
  rationale: Аористный императив δίδωμι передан прямым и естественным русским повелением.
- source_word: μαρτύριον
  choice: свидетельство
  rationale: Сохраняет юридический и откровенный оттенок греческого слова, не уточняя без основания содержание свидетельства.
- source_word: τοῖς ἐν ἀρχῇ κτίσμασίν σου
  choice: Твоим созданиям, существующим от начала
  rationale: κτίσμα может обозначать созданное существо или творение вообще; «создания» сохраняет эту широту, а причастный оборот ясно связывает ἐν ἀρχῇ именно с ними.
- source_word: ἔγειρον
  choice: воздвигни
  rationale: Передаёт основную метафору ἐγείρω — поднять, воздвигнуть — и не сводит её заранее только к исполнению пророчеств.
- source_word: προφητείας
  choice: пророчества
  rationale: Прямой эквивалент для пророческих речений; множественное число сохранено.
- source_word: τὰς ἐπʼ ὀνόματί σου
  choice: изречённые во имя Твоё
  rationale: Добавленное «изречённые» естественно раскрывает подразумеваемую связь пророчеств с Божьим именем как источником полномочия, не меняя основного смысла.
theological_decisions:
- issue: Кого или что обозначают «создания, существующие от начала»
  choice: Созданные Богом существа или творения, существующие от начала
  alternative: Древний народ или племена, образованные Богом; либо первоначальные дела Божьего творения вообще
  rationale: κτίσμασιν естественно относится к сотворённым существам или вещам. Контекст может намекать на Божий народ или первоначальный установленный Им порядок, однако текст не даёт основания прямо подменять широкое обозначение Израилем.
- issue: Смысл просьбы «воздвигни пророчества»
  choice: Просьба привести пророческие слова в действенную силу или подтвердить их
  alternative: Исполни пророчества; вновь пошли пророков
  rationale: Грамматическим объектом являются пророчества, а не пророки. Метафорическое «воздвигни» сохраняет открытым, идёт ли речь об исполнении, подтверждении или новом проявлении силы пророческих слов.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Метафора «воздвигни пророчества» намеренно сохранена, а сжатая конструкция о созданиях слегка прояснена без устранения её смысловой широты. Заглавные местоимения поддерживают традиционный русский регистр обращения к Богу.
