translation:
  language: ru
  text: Собери все колена Иакова и дай им их наследие, как в начале.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также более буквально: «и унаследуй их, как в начале» или «и распредели их как наследие, как в начале». Греческий глагол необычен и связан с образами наследования и распределения удела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σύναγε
  choice: Собери
  rationale: Императив настоящего времени от συνάγω передаёт прямую молитвенную просьбу собрать воедино рассеянные колена.
- source_word: πάσας φυλὰς Ἰακώβ
  choice: все колена Иакова
  rationale: «Колена» — естественное и укоренённое русское обозначение племенных подразделений Израиля; имя Иаков сохранено вслед за греческим текстом.
- source_word: κατακληρονομήσεις
  choice: дай им их наследие
  rationale: Редкий глагол κατακληρονομέω содержит образ наследования и удела. Контекст допускает восстановление колен в их наследственном уделе; ясная русская формулировка сохраняет этот образ, а буквальная неоднозначность отмечена в сноске.
- source_word: αὐτούς
  choice: им
  rationale: Местоимение относится ко всем коленам Иакова; при смысловой передаче наследственной конструкции естественно выражено дательным падежом.
- source_word: καθὼς ἀπʼ ἀρχῆς
  choice: как в начале
  rationale: Фраза сохраняет отсылку к первоначальному или древнему порядку, не уточняя сверх текста, идёт ли речь о первом разделе земли либо о более широком устройстве Израиля.
theological_decisions:
- issue: Направленность образа наследования в κατακληρονομήσεις
  choice: Просьба дать коленам их наследие, то есть восстановить их в наследственном уделе.
  alternative: «унаследуй их, как в начале» или «распредели их как наследие, как в начале»
  rationale: Греческая форма необычна и грамматически допускает понимание колен как объекта Божьего наследования либо распределения. Основной текст передаёт вероятный контекстуальный смысл восстановления уделов, но сноска сохраняет реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Сохранены библейские термины «колена» и «наследие»; синтаксис краток и понятен широкому читателю.
