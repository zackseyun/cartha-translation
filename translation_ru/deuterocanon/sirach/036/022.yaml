  text: A crooked heart causes grief[b][a], and a very experienced man will repay him.
translation:
  language: ru
  text: Кривое сердце[a] причинит скорбь, а многоопытный человек воздаст ему[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искривлённое», «развращённое сердце».'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово можно также передать как «ответит ему» или «отплатит ему». Каков именно будет этот ответ, не уточняется; местоимение «ему», вероятнее всего, указывает на человека с кривым сердцем.
    reason: alternative_reading
lexical_decisions:
- source_word: καρδία
  choice: сердце
  rationale: Сохраняет обычный для библейской речи образ внутреннего мира, где соединяются мысли, воля и нравственный настрой.
- source_word: στρεβλή
  choice: кривое
  rationale: Передаёт образ искривлённости и нравственного искажения, не усиливая его до однозначно крайней порочности.
- source_word: δώσει λύπην
  choice: причинит скорбь
  rationale: Естественно передаёт буквальное «даст скорбь» и сохраняет будущую форму греческого глагола.
- source_word: ἄνθρωπος
  choice: человек
  rationale: В русском языке «человек» естественно передаёт родовое значение существительного в изречении, не меняя его личного и единственного характера.
- source_word: πολύπειρος
  choice: многоопытный
  rationale: Точно передаёт значение человека, приобретшего большой и разнообразный опыт; слово уместно в возвышенной литературной речи.
- source_word: ἀνταποδώσει
  choice: воздаст
  rationale: Сохраняет значение ответного действия или возмещения, не уточняя, будет ли оно добрым, справедливым либо карательным.
- source_word: αὐτῷ
  choice: ему
  rationale: Передаёт дательный падеж единственного числа; наиболее естественно местоимение относится к человеку с кривым сердцем, хотя в греческом тексте это лицо названо лишь через образ сердца.
theological_decisions:
- issue: Неопределённый характер ответного действия в ἀνταποδώσει
  choice: воздаст ему
  alternative: ответит ему; отплатит ему
  rationale: Греческий глагол обозначает ответное воздаяние, но сам по себе не определяет его содержание и нравственную окраску. Перевод сохраняет эту смысловую напряжённость.
- issue: Родовое значение ἄνθρωπος в изречении
  choice: человек
  alternative: мужчина; муж
  rationale: Контекст не противопоставляет полы, а русское «человек» точно и естественно выражает родовое значение, оставаясь в единственном числе.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Сочетания «кривое сердце» и «воздаст ему» сохраняют образность и неоднозначность греческого текста; «многоопытный» точно, компактно и понятно передаёт πολύπειρος.
