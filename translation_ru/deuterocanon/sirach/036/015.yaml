  text: Have compassion on the city of your sanctuary[a], Jerusalem, the city of your dwelling place.
translation:
  language: ru
  text: Смилуйся над городом Твоей святыни — Иерусалимом, городом Твоего покоя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «городом Твоего пребывания».'
    reason: Лексическое значение κατάπαυμα допускает контекстуальное понимание как места, где Бог пребывает, наряду с более буквальным образом покоя.
lexical_decisions:
- source_word: οἰκτείρησον
  choice: Смилуйся
  rationale: Повелительная форма выражает просьбу о сострадательной милости. «Смилуйся» естественно звучит в возвышенной молитвенной речи и передаёт как сострадание, так и милость.
- source_word: πόλιν
  choice: городом
  rationale: Хотя в греческом существительное без артикля, Иерусалим и притяжательные определения делают его определённым; русская конструкция оформлена приложением в творительном падеже после «над городом».
- source_word: ἁγιάσματός σου
  choice: Твоей святыни
  rationale: ἁγίασμα обозначает освящённое или святое место. «Святыня» сохраняет ёмкость греческого слова и связь Иерусалима со священным присутствием Бога.
- source_word: Ἰερουσαλήμ
  choice: Иерусалимом
  rationale: Употреблена общепринятая русская форма названия; падеж обусловлен приложением к слову «городом».
- source_word: καταπαύματός σου
  choice: Твоего покоя
  rationale: κατάπαυμα буквально обозначает покой или место успокоения. «Твоего покоя» сохраняет исходный образ, не сводя его безоговорочно к простому пребыванию или жилищу.
theological_decisions:
- issue: Как передать два родительных определения, характеризующих Иерусалим
  choice: «городом Твоей святыни … городом Твоего покоя»
  alternative: «Твоим святым городом, местом Твоего пребывания»
  rationale: Греческий текст даёт два параллельных описания города. Перевод сохраняет их раздельность и не устраняет напряжение между образами святыни и Божьего покоя.
- issue: Следует ли понимать κατάπαυμα исключительно как Божье жилище
  choice: Сохранить основной образ покоя
  alternative: Передать как «пребывание» или «жилище»
  rationale: Значение пребывания возможно по контексту, однако греческое слово непосредственно связано с покоем. Основной текст сохраняет этот образ, а контекстуальный вариант отмечен в сноске.
translation_notes:
  register: Современная литературная русская речь с возвышенным молитвенным звучанием. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают традиционный русский библейский регистр. Тире ясно оформляет приложение «Иерусалимом».
