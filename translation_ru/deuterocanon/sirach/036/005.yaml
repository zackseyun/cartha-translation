lexical_decisions:
- source_word: τροχὸς ἁμάξης
  choice: колесо повозки
  rationale: Передаёт конкретный образ τροχός («колесо») с уточняющим ἁμάξης («повозки, телеги»), сохраняя простую бытовую образность изречения.
- source_word: σπλάγχνα
  choice: внутренности
  rationale: Слово буквально обозначает внутренние органы, а переносно — внутреннее состояние человека. «Внутренности» сохраняет нарочито телесный образ и не сводит смысл только к чувствам или разуму.
- source_word: μωροῦ
  choice: глупца
  rationale: «Глупец» естественно для русской традиции литературы мудрости и выражает не только недостаток ума, но и нравственно-практическое безрассудство.
- source_word: ὁ διαλογισμὸς αὐτοῦ
  choice: его мысль
  rationale: διαλογισμός допускает значения «мысль», «рассуждение», «размышление». Единственное число «мысль» сохраняет форму оригинала и не делает выражение излишне отвлечённым.
- source_word: ὡς ἄξων στρεφόμενος
  choice: словно вращающаяся ось
  rationale: Причастие στρεφόμενος передаёт продолжающееся вращение; формулировка сохраняет параллельный механический образ и намёк на переменчивость или беспокойное кружение мысли.
