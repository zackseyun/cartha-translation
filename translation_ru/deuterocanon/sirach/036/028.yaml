revisions:
- from: Ибо кто доверится готовому к нападению разбойнику[a], скитающемуся[b] из города в город? Так и человеку, у которого нет гнезда[c] и который ночует там, где застанет его вечер.
  to: Ибо кто доверится хорошо снаряжённому разбойнику[a], блуждающему[b] из города в город? Так же не доверятся и человеку, у которого нет гнезда[c] и который ночует там, где застанет его вечер.
  rationale: 'Исправлена русская синтаксическая неполнота второй части сравнения. Уточнены два лексических выбора: «хорошо снаряжённому» не добавляет конкретной цели нападения, а «блуждающему» лучше сохраняет нестабильность движения. Метафора гнезда, временной образ вечера и все сносочные якоря сохранены.'
