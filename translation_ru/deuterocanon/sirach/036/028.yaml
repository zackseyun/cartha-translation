  yaml_path: translation/deuterocanon/sirach/036/028.yaml
  text: For who will trust a well-armed robber[b][a], staggering from city to city? So it is with a man who has no nest and lodges wherever night finds him.
translation:
  language: ru
  text: Ибо кто доверится хорошо снаряжённому разбойнику[a], блуждающему[b] из города в город? Так же не доверятся и человеку, у которого нет гнезда[c] и который ночует там, где застанет его вечер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хорошо подпоясанному разбойнику», то есть снаряжённому и готовому действовать; возможный перевод: «вооружённому разбойнику».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое слово может также означать неустойчивое движение: «спотыкающемуся», «мечущемуся» или «сбивающемуся с пути».'
    reason: lexical_ambiguity
  - marker: c
    text: «Гнездо» — буквальный образ постоянного, защищённого жилища.
    reason: metaphor_clarification
lexical_decisions:
- source_word: τίς γὰρ πιστεύσει
  choice: Ибо кто доверится
  rationale: πιστεύω с дательным обозначает доверие лицу; «ибо» сохраняет пояснительную связь γάρ с предшествующей мыслью.
- source_word: εὐζώνῳ λῃστῇ
  choice: готовому к нападению разбойнику
  rationale: εὔζωνος буквально описывает хорошо подпоясанного, то есть снаряжённого и готового действовать человека; при λῃστής контекстуальный смысл передан без сведения образа только к наличию оружия.
- source_word: σφαλλομένῳ ἐκ πόλεως εἰς πόλιν
  choice: скитающемуся из города в город
  rationale: Форма σφαλλομένῳ может передавать неустойчивое, сбивчивое движение. «Скитающемуся» естественно выражает отсутствие постоянного места, не устраняя полностью оттенок беспорядочного перемещения.
- source_word: οὕτως ἀνθρώπῳ
  choice: Так и человеку
  rationale: Кратко и естественно вводит прямое сопоставление; ἄνθρωπος здесь имеет обобщающее значение.
- source_word: μὴ ἔχοντι νοσσιὰν
  choice: у которого нет гнезда
  rationale: Сохранена конкретная метафора νοσσιά — птичьего гнезда, обозначающая отсутствие постоянного дома и защищённого пристанища.
- source_word: καταλύοντι
  choice: который ночует
  rationale: В данном контексте καταλύω означает останавливаться на ночлег; «ночует» ясно и лаконично связывается с наступлением вечера.
- source_word: οὗ ἐὰν ὀψίσῃ
  choice: там, где застанет его вечер
  rationale: Передаёт неопределённость места и временной смысл глагола, связанный с наступлением вечера, не заменяя вечер более поздней «ночью».
