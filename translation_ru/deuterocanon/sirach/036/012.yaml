  text: Crush the heads of enemy rulers[a], who say, “There is no one but us.”
translation:
  language: ru
  text: 'Сокруши головы вражеских правителей, которые говорят: «Нет никого, кроме нас».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Кроме нас, никого нет». Греческие слова выражают надменное притязание на исключительность; в них можно услышать и почти божественное самовозвышение, однако слово «Бог» в тексте отсутствует.'
    reason: Лексическая альтернатива и сохранение богословской неоднозначности исходного текста.
lexical_decisions:
- source_word: σύντριψον
  choice: Сокруши
  rationale: Аористный императив от συντρίβω выражает решительное разрушительное действие; «сокруши» сохраняет силу образа и соответствует возвышенному молитвенному контексту.
- source_word: κεφαλὰς
  choice: головы
  rationale: Сохранён конкретный образ во множественном числе без смягчающей замены на «власть» или «силу».
- source_word: ἀρχόντων ἐχθρῶν
  choice: вражеских правителей
  rationale: Сочетание двух родительных передано естественно по-русски как обозначение правителей, принадлежащих к враждебной стороне. Возможное более буквальное «правителей врагов» звучит тяжеловесно и в данном контексте существенно не меняет смысла.
- source_word: λεγόντων
  choice: которые говорят
  rationale: Причастие передано определительным придаточным, естественным для современного русского языка и характеризующим названных правителей.
- source_word: Οὐκ ἔστιν πλὴν ἡμῶν
  choice: Нет никого, кроме нас
  rationale: Фраза выражает надменную исключительность, но прямо не упоминает Бога; перевод не усиливает богословское содержание сверх греческого текста.
theological_decisions:
- issue: Характер притязания врагов
  choice: «Нет никого, кроме нас» — как заявление о надменной исключительности без добавления слова «Бог».
  alternative: «Нет Бога, кроме нас» или «Кроме нас, никого нет».
  rationale: В греческом тексте слово «Бог» отсутствует. Возможный оттенок почти божественного самовозвышения следует сохранить как подразумеваемый, а не превращать в прямое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-поэтической речи. Конкретный насильственный образ оригинала сохранён; синтаксис сделан естественным и понятным широкому читателю.
