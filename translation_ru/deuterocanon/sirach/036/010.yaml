  text: And all men are from the ground[a], and Adam was created from the earth.
translation:
  language: ru
  text: И все люди — из почвы, и Адам был сотворён из земли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωποι πάντες
  choice: все люди
  rationale: Сочетание обозначает всё человечество. В современном русском «все люди» естественно передаёт обобщающий смысл греческого мужского множественного числа без ненужного сужения до мужчин.
- source_word: ἀπὸ ἐδάφους
  choice: из праха
  rationale: ἐδάφος означает почву, грунт, землю. «Прах» естественно передаёт библейский образ земного вещества, из которого происходит человек, и позволяет сохранить лексическое различие с γῆς.
- source_word: ἐκ γῆς
  choice: из земли
  rationale: γῆ обозначает землю; перевод сохраняет конкретную отсылку к сотворению Адама и параллелизм с ἀπὸ ἐδάφους.
- source_word: ἐκτίσθη
  choice: был сотворён
  rationale: Пассивная форма κτίζω прямо выражает сотворение; «был сотворён» точно и достойно передаёт форму и мотив творения.
- source_word: Ἀδάμ
  choice: Адам
  rationale: Сохранено собственное имя прародителя, которое одновременно поддерживает его представительное отношение ко всему человечеству.
theological_decisions:
- issue: Связь всех людей с Адамом
  choice: Первое полустишие говорит обо всех людях, а второе указывает на сотворение Адама из земли.
  alternative: 'Второе полустишие можно понимать как представительное пояснение: Адам выступает образом человечества в целом.'
  rationale: Перевод сохраняет как личное имя Адама, так и обобщающий смысл первого утверждения, не определяя жёстко логическую связь между ними.
translation_notes:
  register: Современный литературный русский язык с библейски достоинственным, но общепонятным словоупотреблением. Тире слегка обозначает именную связь «люди — из праха», подразумеваемую греческим текстом без явной связки.
