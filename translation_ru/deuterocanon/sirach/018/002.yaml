lexical_decisions:
- source_word: Κύριος
  choice: Господь
  rationale: Κύριος — подлежащее и обычный титул «Господь»; в русском языке определённый артикль не передаётся.
- source_word: μόνος
  choice: только
  rationale: 'μόνος подчёркивает исключительность: никто другой не разделяет этого положения. Начальное «только» естественно и ясно передаёт данный акцент.'
- source_word: δικαιωθήσεται
  choice: будет признан праведным
  rationale: Будущее время пассивного залога от δικαιόω. Такой перевод сохраняет пассивную и декларативную силу глагола, явно передаёт значение праведности и не сводит его ни к оправданию виновного, ни исключительно к публичному подтверждению правоты.
theological_decisions:
- issue: Передача δικαιωθήσεται в кратком прославлении Бога
  choice: будет признан праведным
  alternative: будет оправдан; будет признан правым
  rationale: Глагол допускает декларативный, судебный и виндикативный оттенки. Основной текст сохраняет компонент праведности и пассивную форму, а примечание отмечает подлинную смысловую широту, не разрешая её однозначно.
