  source_fidelity: 'Греч. συντελέσῃ обозначает завершение без названного объекта; в русском «завершит» без дополнения звучит неполно. Кроме того, «только» в первой части не имеет прямого соответствия в тексте (τότε ἄρχεται: «тогда начинает») и несколько усиливает парадокс. Исправленный вариант сохраняет лаконичность, неопределённость предмета завершения и временную структуру оригинала.'
  naturalness: «Когда человек закончит» — естественная современная русская абсолютная конструкция. Параллельные «тогда начнёт» и «тогда окажется в недоумении» сохраняют афористичность и уравновешенность изречения.
  terminology: Термины не требуют богословской стандартизации. «Окажется в недоумении» удачно передаёт ἀπορηθήσεται как состояние растерянности или отсутствия решения, не сужая его до смерти, труда или определённой доктринальной интерпретации.
