lexical_decisions:
- source_word: ὅταν
  choice: когда
  rationale: Вводит общее временно-условное высказывание; «когда» естественно звучит в кратком изречении и не утяжеляет его.
- source_word: συντελέσῃ
  choice: завершит
  rationale: Передаёт достижение завершения, не уточняя, идёт ли речь о труде, познании или жизненном пути; эта открытость соответствует греческому тексту.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Естественное русское обозначение любого человека в обобщающем изречении.
- source_word: τότε ἄρχεται
  choice: тогда он только начинает
  rationale: «Начинает» прямо передаёт ἄρχεται, а «только» естественно подчёркивает парадокс завершения, которое оказывается началом.
- source_word: παύσηται
  choice: остановится
  rationale: Передаёт прекращение действия без излишне книжного «перестанет» или смыслового сужения.
- source_word: ἀπορηθήσεται
  choice: окажется в недоумении
  rationale: Передаёт состояние растерянности и отсутствия ясного пути или ответа; сохраняет пассивно-результативный оттенок греческой формы.
theological_decisions:
- issue: Смысл парадокса о пределах человеческих возможностей
  choice: 'Сохранить широкое изречение: достигнув завершения, человек обнаруживает, что лишь начинает, а остановившись — оказывается в недоумении.'
  alternative: Истолковать стих исключительно как высказывание о бесконечности человеческого труда либо о смерти, прекращающей деятельность.
  rationale: Греческий текст краток и не называет прямо ни труд, ни смерть. Перевод не сужает его богословскую и философскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткий, уравновешенный и достойный стиль мудрого изречения. Параллелизм двух частей и исходная смысловая неопределённость сохранены.
