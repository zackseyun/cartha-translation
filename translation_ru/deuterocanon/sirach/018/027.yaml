translation:
  language: ru
  text: Мудрый человек во всём будет осмотрителен[a], и в дни грехов[b] будет остерегаться проступка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет относиться ко всему с благоговением». Греческий глагол может означать и благоговение, и осторожную осмотрительность; контекст здесь скорее указывает на нравственную осмотрительность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в дни грехов»; вероятно, имеются в виду времена, отмеченные грехом, или обстоятельства, особенно располагающие к искушению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος σοφός
  choice: мудрый человек
  rationale: Сочетание передаёт обобщённый характер изречения и естественно звучит по-русски; σοφός в литературе мудрости обозначает практическую и нравственную мудрость.
- source_word: ἐν παντί
  choice: во всём
  rationale: 'Кратко и естественно сохраняет широкий охват греческого выражения: во всяком деле или обстоятельстве.'
- source_word: εὐλαβηθήσεται
  choice: будет осмотрителен
  rationale: Глагол может обозначать как благоговение, так и осторожность. Параллельная часть стиха об избегании проступка поддерживает здесь смысл нравственной осмотрительности.
- source_word: ἐν ἡμέραις ἁμαρτιῶν
  choice: в дни грехов
  rationale: Сохранены образ и множественное число оригинала; выражение может обозначать времена, отмеченные грехом, либо случаи особого искушения.
- source_word: προσέξει ἀπό
  choice: будет остерегаться
  rationale: προσέχω означает быть внимательным, принимать меры предосторожности; с ἀπό здесь выражено внимательное избегание чего-либо.
- source_word: πλημμελίας
  choice: проступка
  rationale: Слово обозначает вину, нарушение или дурной поступок. «Проступок» сохраняет нравственный смысл, не сужая его до случайной ошибки или юридически определённого преступления.
theological_decisions:
- issue: Значение εὐλαβηθήσεται в изречении мудрости
  choice: нравственная осмотрительность
  alternative: благоговение во всём
  rationale: Хотя глагол допускает религиозный оттенок благоговения, ближайший параллелизм — внимательное избегание проступка — сильнее поддерживает практический смысл осторожности. Альтернатива сохранена в примечании.
- issue: Обобщённое ἄνθρωπος
  choice: мудрый человек
  alternative: мудрец
  rationale: «Человек» непосредственно передаёт ἄνθρωπος и сохраняет универсальный, пословичный характер высказывания; «мудрец» могло бы звучать как обозначение особой группы.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным регистром книги Премудрости. Сохранены пословичная структура, параллелизм и неоднозначность ключевого глагола; буквальный образ «дни грехов» оставлен в основном тексте и пояснён в сноске.
