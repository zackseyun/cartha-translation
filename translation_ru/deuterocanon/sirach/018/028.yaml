translation:
  language: ru
  text: Каждый рассудительный человек познал мудрость и воздаст хвалу тому, кто нашёл её.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς συνετός
  choice: всякий рассудительный
  rationale: Сочетание имеет распределительное значение и обозначает человека, наделённого пониманием и здравым суждением; субстантивированная форма мужского рода сохраняет форму греческого оригинала и естественна по-русски.
- source_word: ἔγνω
  choice: постиг
  rationale: Аорист γινώσκω передаёт состоявшееся узнавание или обретение понимания; «постиг» здесь естественно выражает распознание мудрости как таковой.
- source_word: σοφίαν
  choice: мудрость
  rationale: Прямое и устойчивое соответствие, уместное в контексте литературы мудрости.
- source_word: τῷ εὑρόντι αὐτήν
  choice: нашедшему её
  rationale: Артикль с причастием в дательном падеже обозначает адресата хвалы, а местоимение женского рода относится к σοφίαν; русский язык естественно сохраняет эту связь.
- source_word: δώσει ἐξομολόγησιν
  choice: воздаст хвалу
  rationale: Будущее время передано прямо; в данном контексте ἐξομολόγησις означает хвалебное, благодарное признание, а выражение «воздать хвалу» естественно сочетается с дательным падежом адресата.
theological_decisions:
- issue: Родовое обозначение рассудительного человека и образ мудрости
  choice: Сохранить мужской род в «рассудительный» и женский род в местоимении «её»
  alternative: 'Передать обобщённо: «всякий рассудительный человек… нашедшему мудрость»'
  rationale: Греческий текст употребляет субстантивированное прилагательное мужского рода для человека и местоимение женского рода для мудрости. Русский перевод сохраняет обе особенности без добавления конфессионального толкования.
- issue: Кому воздаётся хвала
  choice: Хвала воздаётся тому, кто нашёл мудрость
  alternative: 'Понимать нашедшего мудрость как подлежащее: «нашедший её воздаст хвалу»'
  rationale: Форма τῷ εὑρόντι стоит в дательном падеже и потому естественно обозначает адресата при δώσει ἐξομολόγησιν; подлежащим остаётся «всякий рассудительный» из первой части.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Формулировка краткая и доступная; порядок слов подчёркивает, что «нашедшему её» является адресатом хвалы.
