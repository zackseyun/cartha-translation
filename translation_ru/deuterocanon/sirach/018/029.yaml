lexical_decisions:
- source_word: συνετοὶ ἐν λόγοις
  choice: разумные в речах
  rationale: Сохраняет характеристику рассудительности именно в сфере речи, не сужая λόγοι до отдельных «слов».
- source_word: καὶ αὐτοὶ ἐσοφίσαντο
  choice: и сами обрели мудрость
  rationale: Передаёт аорист ἐσοφίσαντο как становление мудрыми; естественнее по-русски, чем буквальное «умудрились», которое может означать ухитрились.
- source_word: ἀνώμβρησαν
  choice: излили
  rationale: Передаёт образ обильного излияния, заключённый в редком глаголе, связанном с дождём или ливнем.
- source_word: παροιμίας ἀκριβεῖς
  choice: точные изречения
  rationale: παροιμία здесь может обозначать краткое мудрое изречение; ἀκριβεῖς передано как «точные», то есть тщательно выверенные.
