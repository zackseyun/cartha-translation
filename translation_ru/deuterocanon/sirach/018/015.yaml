lexical_decisions:
- source_word: Τέκνον
  choice: Дитя моё
  rationale: Форма обращения означает «дитя, ребёнок» и сама по себе не уточняет пол. «Дитя моё» сохраняет тёплый наставнический тон и гендерную открытость греческого слова.
- source_word: ἐν ἀγαθοῖς
  choice: делая добро
  rationale: Буквально выражение широко означает «в добрых [делах/благах]». В контексте благодеяния естественное русское «делая добро» сохраняет широту смысла и связывает первую часть с речью о даре.
- source_word: μὴ δῷς μῶμον
  choice: не попрекай
  rationale: Буквально — «не давай упрёка/порицания». В данном нравственном контексте речь идёт о попрёках, которыми человек портит своё благодеяние; глагольная передача звучит по-русски ясно и естественно.
- source_word: ἐν πάσῃ δόσει
  choice: ни один дар
  rationale: δόσις может обозначать как даяние, так и дар. Отрицательная конструкция «ни один дар» естественно передаёт охват πάσῃ и сохраняет предметную связь с щедростью.
- source_word: λύπην λόγων
  choice: словами, причиняющими боль
  rationale: 'Сжатое сочетание буквально означает «печаль/огорчение слов». Передача раскрывает причинный смысл: слова, сопровождающие дар, могут огорчить или ранить получателя.'
