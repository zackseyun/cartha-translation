  text: Дитя моё, делая добро, не примешивай к нему упрёка и при всяком даре не огорчай словами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально во второй части: «и при всяком даре — огорчение слов». Это сжатое выражение предостерегает от того, чтобы не портить щедрый дар словами, которые огорчают или ранят.'
