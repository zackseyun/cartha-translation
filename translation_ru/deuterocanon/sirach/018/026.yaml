translation:
  language: ru
  text: От утра до вечера время меняется[a], и всё происходит быстро перед Господом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пора меняется»; греческое καιρός может означать время, пору, подходящий срок или обстоятельства.'
    reason: lexical_alternative
  - marker: b
