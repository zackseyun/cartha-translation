    reason: alternative_reading
lexical_decisions:
- source_word: ἀπὸ πρωΐθεν ἕως ἑσπέρας
  choice: От утра до вечера
  rationale: Естественно передаёт полный дневной промежуток, не сужая πρωΐθεν до самого рассвета.
- source_word: μεταβάλλει
  choice: меняется
  rationale: Передаёт изменение или переход без уточнения его характера.
- source_word: καιρός
  choice: время
  rationale: Сохраняет широкий смысл греческого слова, которое здесь может также обозначать пору, срок или обстоятельства.
- source_word: πάντα
  choice: всё
  rationale: Естественный русский собирательный эквивалент греческого среднего рода множественного числа со всеохватным значением.
- source_word: ταχινὰ
  choice: происходит быстро
  rationale: Греческое именное сказуемое буквально характеризует всё как быстрое или стремительное; глагол «происходит» добавлен ради естественного русского синтаксиса, не превращая быстроту в «лёгкость» или «скоротечность».
- source_word: ἔναντι Κυρίου
  choice: пред Господом
  rationale: Кратко и в достойном библейском регистре передаёт значение «перед Господом, в присутствии или в очах Господа».
theological_decisions:
- issue: Значение καιρός в изречении мудрости
  choice: время
  alternative: пора; обстоятельства
  rationale: «Время» сохраняет смысловую широту текста и связь с промежутком от утра до вечера, не ограничивая речь сезоном или отдельным случаем.
- issue: Смысл πάντα ἐστὶν ταχινὰ ἔναντι Κυρίου
  choice: всё происходит быстро пред Господом
  alternative: всё стремительно пред Господом; всё скоротечно в очах Господа
  rationale: Основной смысл ταχινός связан с быстротой. Перевод не подменяет его идеей лёгкости для Бога и не утверждает однозначно мимолётность всего сущего, сохраняя напряжение между быстротой событий и Божьей перспективой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «пред Господом». Первый рядок передан прямо; во втором ради естественности русского языка введено нейтральное «происходит», а буквальная структура сохранена в примечании.
