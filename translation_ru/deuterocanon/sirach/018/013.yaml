  yaml_path: translation/deuterocanon/sirach/018/013.yaml
  text: A man's mercy is for his neighbor[a], but the Lord's mercy is for all flesh[b]; he rebukes and disciplines and teaches and turns back his flock like a shepherd.
translation:
  language: ru
  text: 'Милость человека — к его ближнему, а милость Господа — ко всякой плоти[a]: Он обличает, вразумляет, учит и, словно пастух, возвращает Своё стадо[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ко всему человечеству» либо «ко всем живым существам». Греческое «всякая плоть» — широкое библейское выражение, обозначающее тварную жизнь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приводит назад» либо «восстанавливает». Греческий глагол означает поворот или возвращение и здесь соответствует образу пастуха, возвращающего отбившихся.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: милость
  rationale: «Милость» сохраняет нравственный и богословский вес слова и поддерживает точный параллелизм между человеческой и Господней милостью.
- source_word: ἀνθρώπου
  choice: человека
  rationale: Родительный падеж единственного числа выражает обобщённого отдельного человека и создаёт контраст с Господом.
- source_word: πλησίον αὐτοῦ
  choice: к его ближнему
  rationale: «Ближний» — естественный и традиционный русский эквивалент πλησίον в нравственном контексте; предлог «к» передаёт направленность милости.
- source_word: Κυρίου
  choice: Господа
  rationale: Сохраняет обычное библейское обозначение κύριος и параллельную конструкцию «милость человека — милость Господа».
- source_word: πᾶσαν σάρκα
  choice: ко всякой плоти
  rationale: Буквальный библейский оборот сохраняет намеренно широкий охват и не сужает его без достаточных оснований только до человечества.
- source_word: ἐλέγχων
  choice: обличает
  rationale: Передаёт исправительное указание на неправоту, не придавая слову исключительно судебного смысла.
- source_word: παιδεύων
  choice: вразумляет
  rationale: Выражает исправляющее и воспитывающее воздействие и при этом не сливается со следующим «учит».
- source_word: διδάσκων
  choice: учит
  rationale: Прямой и естественный эквивалент, сохраняющий последовательность пастырских действий.
- source_word: ἐπιστρέφων
  choice: возвращает
  rationale: Передаёт возвращение заблудившихся в контексте образа пастуха, не вводя позднейшего специального богословского значения «обращает».
- source_word: ὡς ποιμήν
  choice: словно пастух
  rationale: Ясно сохраняет выраженное в греческом тексте сравнение и звучит естественно по-русски.
- source_word: τὸ ποίμνιον αὐτοῦ
  choice: Своё стадо
  rationale: «Стадо» естественно передаёт ποίμνιον и сохраняет пастушеский образ; возвратное «Своё» недвусмысленно относит стадо к действующему Господу.
theological_decisions:
- issue: Охват выражения πᾶσαν σάρκα
  choice: «Всякая плоть» — широкое библейское обозначение тварной жизни, намеренно оставленное без сужения.
  alternative: «Всё человечество» или «все живые существа».
  rationale: Выражение противопоставляет ограниченную милость человека всеохватной милости Господа. Буквальный оборот сохраняет широту и подлинную неопределённость относительно точных границ.
- issue: Значение ἐπιστρέφων в пастушеском образе
  choice: «Возвращает» Своё стадо.
  alternative: «Обращает», «приводит назад» или «восстанавливает».
  rationale: Контекст пастуха указывает на возвращение отбившихся; выбранное слово сохраняет образ, не превращая глагол в узкий технический термин о религиозном обращении.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксический параллелизм двух первых частей сохранён; двоеточие естественно вводит поясняющий ряд действий Господа. Библейский оборот «всякая плоть» оставлен в основном тексте, а его возможный охват разъяснён в сноске.
