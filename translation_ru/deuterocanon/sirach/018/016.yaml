  text: Before you make a vow[a], prepare your vow[b], and do not be like one who tests Yahweh.
translation:
  language: ru
  text: Прежде чем дать обет, приготовься исполнить его[a] и не уподобляйся тому, кто испытывает Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приготовь свой обет». Еврейское выражение несколько затруднительно; оно может подразумевать, что ещё до произнесения обета человек должен быть готов исполнить обещанное.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст здесь значительно отличается: «Разве роса не охладит зной? Так и слово лучше дара». По-видимому, греческая традиция отражает иную форму текста.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּטֶרֶם תִּדּוֹר
  choice: Прежде чем дать обет
  rationale: Естественно передаёт временную конструкцию и глагол נדר («давать обет»), сохраняя наставительный характер стиха.
- source_word: הָכֵן נִדְרֶךָ
  choice: приготовься исполнить его
  rationale: Буквально сочетание близко к «приготовь свой обет», что по-русски неясно и неестественно. В контексте речь идёт о заблаговременной готовности исполнить обещанное; неоднозначность формы отмечена в сноске.
- source_word: בַּל תִּהְיֶה
  choice: не уподобляйся
  rationale: Передаёт запрет и последующее сравнение естественной современной русской конструкцией.
- source_word: כִּמְנַסָּה
  choice: тому, кто испытывает
  rationale: Причастная форма от נסה обозначает человека, подвергающего кого-либо испытанию или проверке.
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблён тетраграмматон; транслитерация сохраняет личное имя и не превращает его в титул.
- issue: Смысл предостережения об испытании Бога
  choice: кто испытывает Яхве
  alternative: кто искушает Яхве
  rationale: «Испытывает» сохраняет широкий смысл נסה — подвергать проверке, испытывать — и не сужает выражение до побуждения ко злу.
translation_notes:
  register: Современный литературный русский язык с краткой наставительной формой. Выражение «приготовься исполнить его» выбрано вместо неестественного буквального «приготовь свой обет»; буквальная форма и текстовая неопределённость сохранены в сноске.
