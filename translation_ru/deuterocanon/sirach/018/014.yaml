  yaml_path: translation/deuterocanon/sirach/018/014.yaml
  text: He has mercy on those who accept discipline[b][a], and on those who eagerly hasten to his judgments.
translation:
  language: ru
  text: Он милует тех, кто принимает вразумление[a], и тех, кто спешит к Его судам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление»; греческое слово может означать обучение, воспитание или исправляющее вразумление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Его установления» или «Его решения»; греческое слово может обозначать суды, решения или постановления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεᾷ
  choice: милует
  rationale: Передаёт проявление милости и сострадания, сохраняя религиозно-нравственную силу греческого глагола.
- source_word: τοὺς ἐκδεχομένους
  choice: тех, кто принимает
  rationale: В сочетании с παιδείαν речь, вероятнее всего, идёт о готовности принять вразумление, а не просто ожидать его.
- source_word: παιδείαν
  choice: вразумление
  rationale: Русское «вразумление» охватывает наставление и исправляющее воздействие, уместное в контексте литературы мудрости.
- source_word: κατασπεύδοντας
  choice: ревностно устремляется
  rationale: Передаёт усиленное значение поспешности вместе с готовностью и усердием; форма согласована с русской конструкцией «тех, кто».
- source_word: ἐπὶ τὰ κρίματα αὐτοῦ
  choice: к Его судам
  rationale: 'Предлог с винительным после глагола направленного движения передан как «к», а «суды» сохраняет широту κρίματα: судебные решения, постановления или установления.'
theological_decisions:
- issue: Значение παιδεία в контексте литературы мудрости
  choice: вразумление
  alternative: наставление; воспитание; исправление
  rationale: «Вразумление» сохраняет одновременно обучающий и исправляющий оттенки, не сводя речь ни только к передаче знаний, ни только к наказанию.
- issue: Смысл κρίματα αὐτοῦ
  choice: Его суды
  alternative: Его установления; Его решения
  rationale: «Суды» не снимают присущую греческому слову неоднозначность между Божьими решениями и нормативными постановлениями.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Его» написано с прописной буквы как указание на Бога; буквальный образ движения сохранён в «устремляется к», чтобы не добавлять отсутствующее в греческом «исполнять» или «следовать».
