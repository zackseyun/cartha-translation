translation:
  language: ru
  text: Прежде чем молиться, приготовься и не уподобляйся человеку, испытывающему[a] Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искушающему Господа». Греческий глагол может означать как «испытывать», так и «искушать»; здесь, вероятнее всего, имеется в виду попытка подвергнуть Господа испытанию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὶν εὔξασθαι
  choice: Прежде чем молиться
  rationale: Естественная русская временная конструкция точно передаёт предшествование действию молитвы; εὔχομαι здесь по контексту означает молитву, хотя в иных контекстах может относиться и к обету.
- source_word: ἑτοίμασον σεαυτόν
  choice: приготовь себя
  rationale: Сохраняет повелительное наклонение и прямое возвратное дополнение, подчёркивая личную внутреннюю готовность.
- source_word: μὴ γίνου ὡς ἄνθρωπος
  choice: не уподобляйся человеку
  rationale: Передаёт значение γίνομαι и сравнение с ὡς более естественно для современного литературного русского, чем буквальное «не становись как человек».
- source_word: πειράζων
  choice: испытывающему
  rationale: Глагол πειράζω допускает значения «испытывать» и «искушать»; когда объектом выступает Господь, речь, вероятнее всего, о попытке подвергнуть Его проверке.
- source_word: τὸν κύριον
  choice: Господа
  rationale: В контексте иудейской литературы мудрости κύριος обозначает Бога; традиционное русское соответствие — «Господь».
theological_decisions:
- issue: Смысл πειράζων τὸν κύριον
  choice: испытывающему Господа
  alternative: искушающему Господа
  rationale: Основной текст выражает предостережение не подвергать Бога проверке, но сноска сохраняет реальную лексическую неоднозначность πειράζω.
- issue: Обобщающее ἄνθρωπος
  choice: человеку
  alternative: мужчине
  rationale: ἄνθρωπος здесь имеет обобщающее значение «человек», а не указывает специально на мужской пол; русское «человек» точно сохраняет этот смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным изречению мудрости. Форма единственного числа сохраняет прямое личное наставление оригинала; синтаксис сделан естественным без устранения смысловой неоднозначности πειράζω.
