lexical_decisions:
- source_word: πρὶν ἢ λαλῆσαι
  choice: прежде чем говорить
  rationale: Оборот выражает временное предшествование. Русская конструкция с неопределённой формой естественна и точно передаёт греческий оборот с аористным инфинитивом.
- source_word: μάνθανε
  choice: учись
  rationale: Императив настоящего времени призывает приобретать знание или наставление до того, как говорить. «Учись» сохраняет краткость и афористичность.
- source_word: πρὸ ἀρρωστίας
  choice: до болезни
  rationale: Предлог с существительным обозначает временное предшествование. Буквальное «до болезни» сохраняет параллелизм двух частей и не уточняет, идёт ли речь о конкретном заболевании или болезни вообще.
- source_word: θεραπεύου
  choice: позаботься о себе
  rationale: Глагол θεραπεύω может означать ухаживать, заботиться, лечить или принимать лечебные меры. Поскольку действие должно совершиться до болезни, «позаботься о себе» естественно передаёт профилактический смысл, не сводя его исключительно к медицинскому лечению.
