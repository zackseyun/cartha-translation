  text: Do not delight in a mere scrap of pleasure[b][a], for its end is poverty.
translation:
  language: ru
  text: 'Не радуйся даже крупице удовольствия[b]: конец его — бедность[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная часть еврейского текста неясна. Буквально она содержит трудносочетаемое выражение, приблизительно: «у которого “уста/край двух” — его бедность». Греческая параллель гласит: «Не радуйся большой роскоши и не связывай себя с её расходами», что поддерживает общий смысл: потворство удовольствиям ведёт к материальной нужде.'
    reason: textual_variant
  - marker: b
    text: 'Или: «Не радуйся даже малому удовольствию». Еврейское שֶׁמֶץ может означать малую частицу, крупицу или едва заметный след.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּשְׂמַח
  choice: Не радуйся
  rationale: Естественно передаёт запрет, выраженный сочетанием אַל с формой глагола שׂמח, и сохраняет связь с переживаемым удовольствием.
- source_word: שֶׁמֶץ
  choice: даже крупице
  rationale: שֶׁמֶץ обозначает малую частицу, обломок или едва заметную долю. «Даже крупице» сохраняет смысл малости и естественно звучит по-русски; возможен и перевод «даже малому удовольствию».
- source_word: תַּעֲנוּג
  choice: удовольствия
  rationale: Слово обозначает удовольствие, наслаждение или чувственную усладу. Нейтральное «удовольствие» не сужает значение до роскоши, как в греческой параллели.
- source_word: אֲשֶׁר
  choice: ':'
  rationale: 'Отношение между частями передано пояснительно-причинной пунктуацией: вторая часть сообщает основание предостережения. Буквальное относительное «которого» по-русски было бы тяжеловесно.'
- source_word: פִּי שְׂנַיִם רֵישׁוֹ
  choice: конец его — бедность
  rationale: Переданная еврейская фраза синтаксически неясна, однако רֵישׁוֹ надёжно указывает на бедность или нужду. Перевод выражает вероятный итог удовольствия, не скрывая текстовой трудности, отмеченной в сноске.
theological_decisions:
- issue: Объём запрета на удовольствие
  choice: Сохранено буквальное предостережение против даже малой доли удовольствия без богословского смягчения.
  alternative: Истолковать стих исключительно как осуждение чрезмерной роскоши или распутства.
  rationale: Еврейское שֶׁמֶץ указывает на малую частицу, тогда как греческая параллель говорит о большой роскоши. Расхождение нельзя молча разрешать в пользу более узкого нравственного толкования.
translation_notes:
  register: Современный литературный русский язык; краткая форма афоризма сохранена. Двоеточие делает причинно-пояснительную связь естественной, а сноски открыто отмечают расхождение между трудным еврейским чтением и греческой параллелью.
