  yaml_path: translation/deuterocanon/sirach/018/006.yaml
  text: It is not possible to diminish or to add[a], and it is not possible to trace out the wonders of the Lord.
translation:
  language: ru
  text: Нельзя ни убавить, ни прибавить, и невозможно постичь[a] чудеса Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исследовать до конца»; буквально — «проследить».'
    reason: Лексическая альтернатива сохраняет метафору греческого ἐξιχνιάσαι и оттенок исчерпывающего исследования.
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: нельзя / невозможно
  rationale: Безличная конструкция выражает невозможность. В первой части «нельзя» естественно сочетается с парными инфинитивами, а во второй «невозможно» ясно передаёт тот же смысл без тяжеловесного повтора.
- source_word: ἐλαττῶσαι
  choice: убавить
  rationale: Глагол означает сделать меньше. «Убавить» сохраняет прямое противопоставление слову «прибавить» и звучит естественно в афористической формулировке.
- source_word: προσθεῖναι
  choice: прибавить
  rationale: Передаёт основное значение добавления и образует ясную, уравновешенную пару с «убавить».
- source_word: ἐξιχνιάσαι
  choice: постичь
  rationale: Глагол буквально связан с выслеживанием по следам и означает исследовать до конца. «Постичь» естественно выражает невозможность полного уразумения; буквальный образ и смысловые альтернативы отмечены в сноске.
- source_word: τὰ θαυμάσια
  choice: чудеса
  rationale: Кратко передаёт широкий смысл дивных вещей или деяний, не сужая выражение только до дел либо событий.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: В данном контексте κύριος является божественным титулом; традиционное «Господь» уместно в современном русском библейском регистре.
theological_decisions:
- issue: Неуказанный объект при «убавить или прибавить»
  choice: 'Оставить объект невыраженным: «нельзя ни убавить, ни прибавить»'
  alternative: Добавить по контексту «к ним», «к Его делам» или сходное дополнение
  rationale: В греческом тексте объект отсутствует. Его добавление сузило бы смысл и устранило афористическую неопределённость оригинала.
- issue: Передача κύριος
  choice: Господь
  alternative: владыка / господин
  rationale: В Книге Сираха здесь имеется в виду Бог; «Господь» сохраняет функцию божественного титула без дополнительной конкретизации.
translation_notes:
  register: Современный литературный русский с кратким, торжественным и афористическим строем. Парное «ни убавить, ни прибавить» сохраняет ритм и противопоставление оригинала; богословски значимая неопределённость объекта не устранена.
