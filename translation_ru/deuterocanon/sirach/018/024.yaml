base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/024.yaml
  text: Remember wrath in the days of your end[b][a], and the time of vengeance at the turning away of the face.
translation:
  language: ru
  text: Помни о гневе в дни своей кончины[a] и о времени возмездия при отвращении лица[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в дни своего конца». Греческое слово может означать как конец, так и смерть.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «при отвращении лица». Вероятно, имеется в виду отнятие благоволения, по всей видимости Божьего, однако в греческом тексте субъект прямо не назван.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: Помни
  rationale: Прямо и естественно передаёт аористный повелительный глагол со значением «помни, держи в памяти».
- source_word: θυμοῦ
  choice: о гневе
  rationale: θυμός обозначает сильный гнев; в контексте возмездия, вероятно, подразумевается гнев суда, однако субъект в греческом тексте не назван.
- source_word: ἐν ἡμέραις τελευτῆς
  choice: в дни своей кончины
  rationale: τελευτή может означать конец или смерть. «Кончина» сохраняет торжественный регистр и ясно указывает на последние дни человека без неестественного оборота «дни твоего конца».
- source_word: καιρὸν ἐκδικήσεως
  choice: о времени возмездия
  rationale: καιρός — время или срок; ἐκδίκησις здесь в сочетании с гневом обозначает карающее воздаяние. «Возмездие» сохраняет судебный оттенок и не уточняет сверх текста, кто именно его совершает.
- source_word: ἐν ἀποστροφῇ προσώπου
  choice: когда лицо отвернётся
  rationale: Передаёт образ буквального «отвращения/отворачивания лица» естественным русским оборотом, не добавляя Бога в качестве явно названного субъекта.
theological_decisions:
- issue: Назван ли Бог источником гнева и возмездия и обладателем отворачивающегося лица
  choice: Оставить субъект невыраженным, как в греческом тексте
  alternative: 'Явно перевести: «когда Бог отвернёт Своё лицо»'
  rationale: Контекст, вероятно, указывает на Божий суд и отнятие благоволения, но греческая фраза Бога прямо не называет. Неявность сохраняет образ и богословское напряжение источника.
- issue: Значение ἐκδίκησις
  choice: возмездие
  alternative: оправдание или защита
  rationale: Сочетание с θυμός и напоминанием о кончине делает значение карающего воздаяния наиболее вероятным, хотя слово в иных контекстах допускает смысл защиты или восстановления справедливости.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным наставительным звучанием. Сохранены параллелизм двух дополнений при «помни» и неявность субъекта суда; тяжеловесная буквальная конструкция «при отвращении лица» заменена естественным, но образно точным оборотом.
