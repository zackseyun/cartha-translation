base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/018/008.yaml
  text: What is a man[a], and what is his use? What is his good[c][b], and what is his evil?
translation:
  language: ru
  text: Что такое человек и какая от него польза?[a] Каково его благо и каково его зло?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какова его практическая ценность?» Греческое χρῆσις может означать пользу, применение или функцию.'
    reason: lexical_alternative
  - marker: b
    text: «Зло» может также означать дурное, беду или вред; греческое κακόν шире исключительно нравственного зла. Выражения «его благо» и «его зло» намеренно сохраняют неопределённость греческого текста.
    reason: lexical_alternative
lexical_decisions:
- source_word: τί
  choice: что / каково
  rationale: Повторяющееся вопросительное местоимение вводит риторические вопросы. В русском для естественности используются соответствующие контексту формы «что» и «каково», без ослабления параллелизма.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Единственное число имеет обобщённое значение. Русское «человек» естественно обозначает как отдельного человека, так и человека вообще и не требует искусственного уточнения рода.
- source_word: χρῆσις
  choice: польза
  rationale: Слово обозначает употребление, практическую пользу или ценность. Оборот «какая от него польза» передаёт его прямо и идиоматично, не добавляя более узкого представления о предназначении.
- source_word: ἀγαθόν
  choice: благо
  rationale: Субстантивированное прилагательное противопоставлено κακόν. «Благо» сохраняет широкий нравственный и жизненный смысл, не сводя его лишь к выгоде.
- source_word: κακόν
  choice: зло
  rationale: В паре с ἀγαθόν слово означает зло, дурное или вредоносное. «Зло» сохраняет весомость антитезы, а более широкий диапазон отмечен в сноске.
- source_word: αὐτοῦ
  choice: его / от него
  rationale: Повторяющееся местоимение относится к человеку в единственном числе. В первой половине русский оборот «от него» естественно выражает практическую пользу, а во второй сохранена притяжательная конструкция «его благо… его зло».
theological_decisions:
- issue: Обобщённое обозначение человека
  choice: человек
  alternative: человечество
  rationale: Греческий текст говорит о человеке в единственном числе. «Человек» сохраняет как грамматическую форму, так и универсальный антропологический смысл, не превращая образ в отвлечённое коллективное понятие.
- issue: Нравственный или более широкий смысл κακόν
  choice: зло
  alternative: дурное / вред
  rationale: Антитеза «благо — зло» уместна в контексте литературы мудрости и сохраняет нравственную напряжённость. При этом перевод не утверждает, что значение ограничивается только нравственным злом; более широкий смысл указан в сноске.
- issue: Значение притяжательного родительного в выражениях τὸ ἀγαθὸν αὐτοῦ и τὸ κακὸν αὐτοῦ
  choice: его благо… его зло
  alternative: что для него благо… что для него зло / что в нём доброго… что в нём дурного
  rationale: 'Притяжательная конструкция сохраняет неопределённость греческого текста: речь может идти о благе и зле человека, не уточняя, находятся ли они в нём, исходят от него или выпадают на его долю. Более истолковательные русские варианты сузили бы смысл.'
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным ритмом. Повтор «каково» сохраняет симметрию второй пары вопросов; формулировки торжественны, но понятны без специальной подготовки.
