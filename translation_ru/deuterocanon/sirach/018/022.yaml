lexical_decisions:
- source_word: ἐμποδισθῇς
  choice: не позволяй ничему помешать тебе
  rationale: 'Передаёт страдательный запрет как естественное по-русски предостережение: нельзя допускать, чтобы препятствие задержало исполнение обязанности.'
- source_word: ἀποδοῦναι εὐχήν
  choice: исполнить обет
  rationale: В сочетании с ἀποδοῦναι слово εὐχή означает обет, который надлежит исполнить; русское «исполнить обет» идиоматично и точно.
- source_word: εὐκαίρως
  choice: вовремя
  rationale: Сохраняет значение своевременности и уместного срока без архаичной тяжеловесности.
- source_word: μὴ μείνῃς
  choice: не жди
  rationale: В данном контексте глагол обозначает промедление, а не пребывание на месте.
- source_word: ἕως θανάτου
  choice: до смерти
  rationale: Буквально и кратко передаёт предельный срок откладывания.
- source_word: δικαιωθῆναι
  choice: быть оправданным
  rationale: Сохраняет страдательную форму и связь с лексикой оправдания, не уточняя сверх текста, означает ли это оправдание, признание правым или обнаружение праведности.
theological_decisions:
- issue: Значение δικαιωθῆναι в нравоучительном контексте Сираха
  choice: быть оправданным
  alternative: быть признанным правым; оказаться праведным
  rationale: Основной вариант сохраняет традиционную и широкую лексику греческого глагола. Сноска предупреждает, что здесь не следует автоматически предполагать позднейший узкотехнический богословский смысл.
