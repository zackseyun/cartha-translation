  source_fidelity: 'Перевод точно передаёт последовательность и основные оттенки греческого текста: πρὶν ἀρρωστῆσαί σε — «Прежде чем ты заболеешь», ταπεινώθητι в естественном увещевательном возвратном значении — «смирись», а δεῖξον ἐπιστροφήν — «яви раскаяние». Формулировка «во время грехов» намеренно сохраняет необычную и не вполне уточнённую временную связь ἐν καιρῷ ἁμαρτημάτων, не подменяя её более узким «после того как согрешишь».'
  naturalness: Текст звучит как современное литературное русское наставление. «Яви раскаяние» несколько приподнято, но уместно для жанра премудростной литературы и хорошо соответствует императиву «покажи». «Во время грехов» необычно, однако это оправданное сохранение шероховатости и смысловой открытости оригинала, а не ошибка русского употребления.
