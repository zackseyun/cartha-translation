  text: Before you become sick[a], humble yourself, and in the time of sins show repentance.
translation:
  language: ru
  text: Прежде чем ты заболеешь, смирись, а во время грехов яви раскаяние[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «яви обращение» / «покажи своё возвращение». Греческое ἐπιστροφή означает поворот или возвращение; рядом с упоминанием грехов оно передано словом «раскаяние».'
    reason: Сохраняется буквальный образ и лексическая широта ἐπιστροφή.
lexical_decisions:
- source_word: πρὶν ἀρρωστῆσαί σε
  choice: прежде чем ты заболеешь
  rationale: 'Передаёт временное предшествование и начинательное значение аористного инфинитива ἀρρωστῆσαι: речь идёт о наступлении болезни.'
- source_word: ταπεινώθητι
  choice: смирись
  rationale: Краткий естественный русский императив передаёт формально пассивную форму с уместным здесь возвратным значением — добровольно смирить себя.
- source_word: ἐν καιρῷ ἁμαρτημάτων
  choice: во время грехов
  rationale: Сохраняет множественное число ἁμαρτημάτων и необычную временную конструкцию оригинала, не сводя её однозначно к «когда согрешишь» или «после греха».
- source_word: δεῖξον ἐπιστροφήν
  choice: яви раскаяние
  rationale: «Яви» передаёт δεῖξον как требование сделать внутренний поворот видимым, а «раскаяние» естественно выражает нравственный смысл ἐπιστροφή в непосредственной связи с грехами. Буквальный образ возвращения отмечен в сноске.
theological_decisions:
- issue: Значение ἐπιστροφήν в связи с ἁμαρτημάτων
  choice: раскаяние
  alternative: обращение; возвращение
  rationale: Контекст грехов указывает на нравственный поворот от них, однако греческое слово буквально допускает значение обращения или возвращения; эта смысловая широта сохранена в сноске без привнесения поздней конфессиональной терминологии.
- issue: Залоговое значение ταπεινώθητι
  choice: смирись
  alternative: будь смирён
  rationale: Хотя греческая форма формально пассивна, в наставлении она естественно выражает призыв к добровольному смирению. Вариант «будь смирён» мог бы ошибочно представить человека лишь объектом внешнего унижения.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой мудрого наставления. Необычное «во время грехов» намеренно сохраняет напряжение и неоднозначность греческой конструкции.
