  text: He saw and recognized that their destruction was evil[b][a]; therefore he multiplied his atonement for them.
translation:
  language: ru
  text: Он увидел и понял, что их гибель бедственна; поэтому умножил своё умилостивление.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умножил своё искупление» или «умножил своё очищение». Греч. ἐξιλασμός обозначает умилостивление или искупительное очищение; дополнение «за них» в греческом тексте прямо не выражено.'
    reason: Сохраняет лексическую альтернативу для ἐξιλασμός и отмечает, не вводя в основной текст, вероятную контекстуальную направленность действия.
lexical_decisions:
- source_word: ἶδεν
  choice: увидел
  rationale: Прямо передаёт аорист ὁράω и сохраняет последовательность «увидел и понял».
- source_word: ἐπέγνω
  choice: понял
  rationale: Передаёт переход от восприятия к осознанию; в современном русском звучит естественнее, чем «познал».
- source_word: τὴν καταστροφὴν αὐτῶν
  choice: их гибель
  rationale: καταστροφή обозначает гибель, разрушение или крушение; «гибель» точно и естественно передаёт здесь бедственный удел людей.
- source_word: ὅτι πονηρά
  choice: что их гибель бедственна
  rationale: Женская форма πονηρά согласуется с καταστροφή и в данном контексте характеризует гибель как тяжкую, пагубную, а не обязательно нравственно злую.
- source_word: διὰ τοῦτο
  choice: поэтому
  rationale: Кратко и естественно передаёт причинно-следственную связь.
- source_word: ἐπλήθυνεν
  choice: умножил
  rationale: Сохраняет выразительную силу глагола со значением «увеличить, сделать обильным».
- source_word: τὸν ἐξιλασμὸν αὐτοῦ
  choice: Своё умилостивление за них
  rationale: «Умилостивление» сохраняет культово-богословскую весомость ἐξιλασμός. Возвратное «Своё» естественно соотносит действие с Богом; «за них» обозначает подразумеваемую направленность, но отмечено сноской как добавление для ясности.
theological_decisions:
- issue: Передача ἐξιλασμός
  choice: умилостивление
  alternative: искупление; очищение; милость
  rationale: «Умилостивление» наиболее прямо сохраняет значение устранения вины или вражды и не сводит термин к общей милости. «Искупление» возможно, но в русском может сместить акцент на выкуп.
- issue: Подразумеваемый объект умилостивления
  choice: за них с пояснительной сноской
  alternative: 'не выражать объект: «умножил Своё умилостивление»'
  rationale: В греческом объект после ἐξιλασμόν прямо не назван. Добавление «за них» делает русскую фразу понятной и связывает её с αὐτῶν, не выдавая дополнение за бесспорно выраженное в оригинале.
translation_notes:
  register: Современный литературный русский, сдержанный и возвышенный. «Бедственна» сохраняет широкий контекстуальный смысл πονηρά, а термин «умилостивление» — богословскую напряжённость исходного текста.
