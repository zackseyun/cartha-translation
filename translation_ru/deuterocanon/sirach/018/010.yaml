  text: Like a drop of water from the sea and a grain of sand[b][a], so are a few years in the day of eternity.
translation:
  language: ru
  text: Как капля воды из моря и песчинка[a], таковы и несколько лет в дне вечности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крупинка песка»; греческое слово часто означает «камешек», но в сочетании со словом «песок» здесь, вероятнее всего, обозначает отдельную песчинку.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «в дне века». Греческое выражение сжато и сопоставляет несколько человеческих лет с безмерной длительностью.'
    reason: alternative_reading
lexical_decisions:
- source_word: σταγὼν ὕδατος ἀπὸ θαλάσσης
  choice: капля воды из моря
  rationale: Сохраняется исходный образ одной капли, взятой из необъятного моря; формулировка близка греческому тексту и естественна по-русски.
- source_word: ψῆφος ἄμμου
  choice: песчинка
  rationale: Хотя ψῆφος часто означает «камешек», зависимое ἄμμου указывает здесь на отдельную частицу песка; «песчинка» ясно и кратко передаёт образ.
- source_word: ὀλίγα ἔτη
  choice: несколько лет
  rationale: Передаёт малое число и краткость человеческих лет без усиления, которого нет в исходном тексте.
- source_word: ἐν ἡμέρᾳ αἰῶνος
  choice: в дне вечности
  rationale: Сохраняет необычный единственный образ «дня» и передаёт αἰών как безмерную длительность, с которой сопоставлены немногие годы.
- source_word: οὕτως
  choice: так и
  rationale: Естественно вводит вторую часть сопоставления и сохраняет лаконичность греческой конструкции.
theological_decisions:
- issue: Значение αἰών в выражении ἐν ἡμέρᾳ αἰῶνος
  choice: вечность
  alternative: век
  rationale: Контекст противопоставляет краткость нескольких лет безмерной длительности. «Вечность» ясно выражает этот смысл, тогда как «век» в современном русском может быть понят как ограниченный исторический период.
- issue: Эллиптический характер сравнения
  choice: сохранить краткую конструкцию без добавления слов «ничтожны» или «малы»
  alternative: так ничтожны несколько лет в сравнении с днём вечности
  rationale: Греческий текст оставляет меру малости внутри самих образов капли и песчинки. Сохранение эллипсиса не привносит дополнительной оценочной лексики и удерживает поэтическое напряжение.
translation_notes:
  register: Современный литературный русский язык с лаконичной, слегка приподнятой образностью. Необычное выражение «в дне вечности» намеренно сохранено ради метафоры оригинала; тире помогает современному читателю воспринять эллиптическую конструкцию.
