translation:
  language: ru
  text: Неблагодарный глупец осыпает упрёками, а дар завистливого[a] изнуряет глаза.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человека с недобрым глазом», то есть того, кто даёт неохотно или скупо. Греческое βασκάνος может означать завистливого человека и вызывать образ «дурного глаза».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὸς
  choice: неразумный
  rationale: Передаёт нравственно-практическую глупость в афористическом контексте и естественно сочетается с субстантивированным определением «неблагодарный человек».
- source_word: ἀχάριστος
  choice: неблагодарный человек
  rationale: Обозначает человека, лишённого благодарности; явное существительное делает греческую характеристику естественной по-русски.
- source_word: ὀνειδιεῖ
  choice: попрекает
  rationale: Сохраняет значение упрёка и поношения; в контексте дара также уместно передаёт оттенок попрёка оказанным благодеянием, не делая его единственно возможным смыслом.
- source_word: δόσις
  choice: дар
  rationale: В данном изречении естественнее обозначает подаренное, а не сам акт даяния; «дар» поддерживает достойный регистр.
- source_word: βασκάνου
  choice: завистливого
  rationale: Прямо передаёт основное греческое значение, сохраняя в сноске возможные оттенки недоброго глаза, скупости и неохотного даяния.
- source_word: ἐκτήκει
  choice: изнуряет
  rationale: Передаёт постепенное истощение или изведение и звучит естественно с образом глаз, не устраняя его метафоричности.
- source_word: ὀφθαλμούς
  choice: глаза
  rationale: Сохраняет конкретный греческий образ вместо толкующего «зрение».
