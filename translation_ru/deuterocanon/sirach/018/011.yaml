translation:
  language: ru
  text: Поэтому Господь был долготерпелив к ним и излил на них Свою милость.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим контекстом ясно и естественно.
- source_word: ἐμακροθύμησεν
  choice: был долготерпелив
  rationale: Сохраняет смысл терпеливого сдерживания гнева и уместный для библейской мудрой литературы возвышенный регистр; выражение понятно современному читателю.
- source_word: Κύριος
  choice: Господь
  rationale: Обычное русское наименование Бога, точно передающее κύριος в данном контексте.
- source_word: ἐπʼ αὐτοῖς
  choice: к ним
  rationale: При слове «долготерпелив» это естественное русское управление, передающее направленность отношения к людям.
- source_word: ἐξέχεεν
  choice: излил
  rationale: Сохраняет конкретную метафору греческого глагола «выливать, изливать».
- source_word: τὸ ἔλεος αὐτοῦ
  choice: Свою милость
  rationale: «Милость» — точный и узнаваемый эквивалент ἔλεος; возвратное «Свою» естественно соотносит милость с подлежащим «Господь».
- source_word: ἐπʼ αὐτοὺς
  choice: на них
  rationale: Естественно сочетается с «излил» и сохраняет пространственный образ оригинала.
theological_decisions:
- issue: Передача κύριος как божественного титула
  choice: Господь
  alternative: Владыка
  rationale: «Господь» является стандартным и нейтральным русским соответствием божественного титула, не внося дополнительного толкования.
- issue: Оттенок ἐμακροθύμησεν
  choice: был долготерпелив
  alternative: проявил терпение
  rationale: Выбранный вариант сохраняет богословски значимый оттенок продолжительного терпения и сдерживания гнева, не уточняя сверх текста, в чём именно оно проявилось.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис краток и близок к греческому, а метафора излияния сохранена.
