  text: Remember the time of famine in the time of plenty[a], and poverty and need in the days of wealth.
translation:
  language: ru
  text: Во время изобилия помни о времени голода[a], а в дни богатства — о бедности и нужде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о поре голода во время достатка». Греческое слово καιρός может означать как время, так и определённую пору, а πλησμονή — изобилие, полноту или насыщение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: помни
  rationale: Аористный императив выражает прямой призыв сознательно держать в памяти; «помни» естественно и точно передаёт побудительную силу.
- source_word: καιρὸν λιμοῦ
  choice: о времени голода
  rationale: καιρός обозначает время или пору, а λιμός — голод, в том числе тяжёлый общественный голод; сочетание сохраняет конкретный образ исходного текста.
- source_word: ἐν καιρῷ πλησμονῆς
  choice: во время изобилия
  rationale: πλησμονή означает полноту, насыщенность или изобилие; в данном материальном противопоставлении «изобилие» ясно и естественно.
- source_word: πτωχείαν
  choice: о бедности
  rationale: πτωχεία обозначает состояние бедности; выбран прямой общеупотребительный эквивалент.
- source_word: ἔνδειαν
  choice: о нужде
  rationale: ἔνδεια подчёркивает недостаток и лишение; «нужда» сохраняет отличие от близкого по смыслу слова «бедность».
- source_word: ἐν ἡμέραις πλούτου
  choice: в дни богатства
  rationale: πλοῦτος означает богатство или достаток; буквальный образ «дней богатства» сохраняет параллелизм и остаётся понятным по-русски.
theological_decisions:
- issue: Следует ли превращать конкретные противопоставления в общее наставление о возможной будущей беде
  choice: Сохранены пары «голод — изобилие» и «бедность и нужда — богатство».
  alternative: 'Обобщённый пересказ: «В благополучные времена помни, что могут наступить трудности».'
  rationale: Греческий текст строится на конкретных экономических состояниях и сбалансированном параллелизме; обобщение добавило бы не выраженную прямо мысль и ослабило образность.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным мудростным звучанием. Перестановка обстоятельства «Во время изобилия» в начало делает наставление естественным по-русски, не меняя смысловых связей; тире во второй части позволяет избежать неуклюжего повторения «помни».
