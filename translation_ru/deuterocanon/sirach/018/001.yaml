translation:
  language: ru
  text: Живущий вечно сотворил всё вместе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разом»; или: «в совокупности», «как единое целое». Греческое наречие κοινῇ выражено здесь сжато и может подчёркивать всё сотворённое как целое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ζῶν
  choice: Живущий
  rationale: Субстантивированное причастие с артиклем обозначает того, кто живёт. Русское «Живущий» сохраняет описательную форму и не добавляет отсутствующего в греческом тексте имени или титула.
- source_word: εἰς τὸν αἰῶνα
  choice: вечно
  rationale: Выражение обозначает непрекращающуюся длительность. «Вечно» естественно для современного русского языка и сохраняет возвышенный тон.
- source_word: ἔκτισεν
  choice: сотворил
  rationale: В космологическом контексте κτίζω означает создание сущего. «Сотворил» точно передаёт происхождение всего и уместно в литературном библейском регистре.
- source_word: τὰ πάντα
  choice: всё
  rationale: Выражение охватывает всю совокупность существующего. Русское «всё» ясно, кратко и не вводит дополнительного толкования вроде «всё творение».
- source_word: κοινῇ
  choice: вместе
  rationale: Наречие может означать «сообща», «совместно», «в совокупности». «Вместе» сохраняет сжатость и неоднозначность греческого выражения; возможные смысловые оттенки отмечены в сноске.
theological_decisions:
- issue: Отождествление субъекта с Богом при отсутствии явного божественного имени или титула
  choice: Сохранено описательное «Живущий вечно» без добавления слова «Бог» или «Господь».
  alternative: «Бог, живущий вечно»; «Господь, живущий вечно».
  rationale: Греческий текст обозначает субъекта субстантивированным причастием, а не словами θεός или κύριος. Перевод сохраняет эту форму и не делает контекстуальное отождествление частью явного текста.
- issue: Смысл κοινῇ применительно к акту творения
  choice: Передано как «вместе» с сохранением смысловой сжатости.
  alternative: «разом»; «в совокупности»; «как единое целое».
  rationale: Контекст не позволяет с полной уверенностью решить, подчёркивает ли наречие одновременность, совокупность или общность всего сотворённого. Основной текст не закрепляет только одно из этих толкований, а сноска раскрывает варианты.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным библейским звучанием. Причастная формула сохранена без архаического «во веки», а неоднозначность заключительного наречия не устранена толкованием.
