translation:
  language: ru
  text: Не следуй своим желаниям и удерживайся от своих влечений.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не иди вслед за своими желаниями и сдерживай свои влечения».'
    reason: 'Лексически возможный вариант: «не иди вслед» более буквально сохраняет образ движения в ὀπίσω … πορεύου, а «сдерживай» передаёт призыв к самообладанию в κωλύου.'
lexical_decisions:
- source_word: Ὀπίσω … μὴ πορεύου
  choice: не следуй
  rationale: Сочетание ὀπίσω с πορεύομαι означает идти вслед за кем-либо или чем-либо; «не следуй» естественно передаёт этот образ и повелительный запрет.
- source_word: τῶν ἐπιθυμιῶν σου
  choice: своим желаниям
  rationale: ἐπιθυμία обозначает желание или сильное стремление и здесь имеет предостерегающий нравственный оттенок, но не ограничивается сексуальной похотью.
- source_word: ἀπὸ τῶν ὀρέξεών σου
  choice: от своих влечений
  rationale: ὄρεξις указывает на стремление, влечение или сильный позыв. «Влечения» отличает это слово от ἐπιθυμίαι, не сужая его значения до телесного аппетита.
- source_word: κωλύου
  choice: удерживай себя
  rationale: Форма повелительного наклонения среднего/страдательного залога в данном контексте выражает самоограничение; «удерживай себя» ясно сохраняет этот возвратный смысл.
theological_decisions:
- issue: Нравственный оттенок слов, обозначающих желание
  choice: «желания» и «влечения»
  alternative: «похоти» и «страсти»
  rationale: Греческий текст предостерегает от подчинения желаниям, но сам по себе не сводит наставление к сексуальной сфере и не требует максимально отрицательной терминологии.
translation_notes:
  register: Современный литературный русский язык; краткое, достойное по тону нравственное наставление. Синтаксический параллелизм двух повелительных форм сохранён.
