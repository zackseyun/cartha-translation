  text: Is not a word better than a good gift? And both are with a gracious man[a][b].
translation:
  language: ru
  text: Разве слово не лучше хорошего дара?[a] И то и другое есть у благожелательного человека.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «речь», «высказывание»; в греческом тексте произнесённое слово сопоставляется с вещественным даром.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и то и другое свойственно благожелательному человеку». Греческое причастие также может означать человека, наделённого благодатью или снискавшего благоволение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἰδοὺ
  choice: разве… не
  rationale: Сочетание вводит риторический вопрос. Русская конструкция «разве… не» естественно передаёт его утвердительный смысл, не воспроизводя буквально и архаично ἰδού («вот»).
- source_word: λόγος
  choice: слово
  rationale: Здесь λόγος обозначает произнесённое слово или высказывание, противопоставленное вещественному дару. «Слово» сохраняет краткость и афористичность греческого текста.
- source_word: ὑπὲρ
  choice: лучше
  rationale: В данной сравнительной конструкции ὑπέρ выражает превосходство, а не пространственное положение.
- source_word: δόμα ἀγαθόν
  choice: хороший дар
  rationale: δόμα означает дар или подарок, а ἀγαθόν прямо характеризует его как хороший. Формулировка не добавляет отсутствующего в греческом уточнения о щедрости или ценности дара.
- source_word: ἀμφότερα
  choice: и то и другое
  rationale: Местоимение отсылает к двум ранее названным вещам — слову и дару; выбранная формулировка естественна по-русски.
- source_word: παρὰ ἀνδρὶ
  choice: есть у человека
  rationale: παρά с дательным лицом указывает, что обе вещи присущи такому человеку или находятся у него. «Есть у» сохраняет эту намеренно широкую связь.
- source_word: κεχαριτωμένῳ
  choice: благожелательного
  rationale: В контексте слова и дара причастие описывает человека, отмеченного благоволением, любезностью или благодатью. «Благожелательный» естественно передаёт качество его отношения к другим, а более буквальные оттенки отмечены в сноске.
theological_decisions:
- issue: 'Значение κεχαριτωμένῳ: качество человека или оказанное ему благоволение'
  choice: благожелательного человека
  alternative: человека, наделённого благодатью; человека, снискавшего благоволение
  rationale: Контекст связывает выражение с добрым словом и даром, поэтому основному тексту подходит характеристика поведения. Сноска сохраняет возможный пассивный оттенок греческого причастия и не придаёт выражению узкого догматического смысла.
- issue: Мужской представитель в афористическом высказывании
  choice: человека
  alternative: мужа
  rationale: Хотя ἀνδρί имеет мужскую форму, здесь речь идёт о человеке как носителе названных качеств, а не о противопоставлении полов. «Человек» точно и естественно передаёт обобщающий смысл без архаизации.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным афористическим звучанием. Риторическая форма оригинала сохранена; буквальное «вот» опущено как неестественное в данном русском вопросе. Слово «дар» предпочтено более бытовому «подарок».
