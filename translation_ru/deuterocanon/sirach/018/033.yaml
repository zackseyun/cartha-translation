  terminology: «Обжора» и «пьяница» точно и идиоматично передают нравственно окрашенные обозначения лиц в еврейском тексте. «Кошелёк» является уместным современным соответствием для экономически интерпретируемого трудного заключительного слова; текстовая оговорка корректно вынесена в примечание.
