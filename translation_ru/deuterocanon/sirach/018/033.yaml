  text: Do not be a glutton and a drunkard[b][a], when there is nothing in your purse.
translation:
  language: ru
  text: Не будь обжорой и пьяницей, когда в кошельке у тебя ничего нет.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское בַּכִּים трудно для истолкования; греческий параллельный текст читает «в кошельке» (ἐν μαρσιππίῳ), что подтверждает принятый здесь экономический смысл.
    reason: textual_variant
  - marker: b
    text: 'Греческое свидетельство развёртывает предостережение: «Не обедней, пируя на взятые взаймы деньги, когда в кошельке у тебя ничего нет».'
    reason: alternative_reading
lexical_decisions:
- source_word: זוֹלֵל
  choice: обжора
  rationale: В еврейской литературе мудрости слово обозначает человека, преданного чрезмерной и расточительной еде; существительное сохраняет параллелизм с «пьяницей».
- source_word: וְסוֹבֵא
  choice: и пьяница
  rationale: Слово обозначает человека, преданного чрезмерному употреблению вина; «пьяница» естественно и весомо звучит в современном русском.
- source_word: וּמְאוּמָה אֵין
  choice: когда… ничего нет
  rationale: Связка передаёт обстоятельство нужды, на фоне которого звучит предостережение; «когда» естественно выражает подразумеваемую условно-причинную связь.
- source_word: בַּכִּים
  choice: в кошельке у тебя
  rationale: Еврейская форма трудна, однако греческое ἐν μαρσιππίῳ прямо указывает на кошель или денежную суму. «В кошельке у тебя» ясно передаёт экономический смысл.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и греческого параллельного свидетельства при трудном последнем слове
  choice: Основное предостережение переведено по еврейскому тексту, а заключение — в экономическом смысле, подтверждаемом греческим «в кошельке».
  alternative: «Не обедней, пируя на взятые взаймы деньги, когда в кошельке у тебя ничего нет».
  rationale: Еврейское свидетельство сохраняет порицание обжорства и пьянства и потому остаётся основой текста. Греческий параллельный текст помогает понять трудную заключительную форму, но его расширенное упоминание бедности и займа не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык; краткая форма афоризма, прямое нравственное предостережение и парный ряд «обжора и пьяница» сохранены. «Кошелёк» понятнее современному читателю, чем архаичные «кошель» или «сума».
