  source_fidelity: Основная строка верно передаёт сохранившееся еврейское предостережение против זולל и סובא как «обжоры» и «пьяницы». Заключительный экономический смысл («когда в кошельке у тебя ничего нет») обоснованно сохраняет отмеченную неопределённость еврейского בַּכִּים и опирается на греческий параллельный текст, не внося в основной текст его дополнительное упоминание займа и обнищания.
