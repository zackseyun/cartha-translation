translation:
  language: ru
  text: Перед судом исследуй себя, и в час посещения[a] обретёшь искупление[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в час проверки», «во время испытания» или «в час воздаяния». Греческое слово может указывать на Божье посещение — время проверки или решительного вмешательства.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «очищение от вины» или «умилостивление». Греческое слово обозначает устранение вины и восстановление благоволения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ κρίσεως
  choice: Перед судом
  rationale: κρίσις обозначает суд или судебную оценку; «перед судом» сохраняет широкий смысл, не сужая его до осуждения.
- source_word: ἐξέταζε σεαυτόν
  choice: исследуй себя
  rationale: Повелительная форма призывает к внимательному самоиспытанию. «Исследуй себя» естественно звучит по-русски и передаёт направленность действия на самого человека.
- source_word: ἐν ὥρᾳ ἐπισκοπῆς
  choice: в час посещения
  rationale: ἐπισκοπή может означать посещение, проверку или надзор; в библейском контексте возможно Божье посещение, связанное с испытанием или вмешательством. Традиционное выражение сохраняет эту многозначность.
- source_word: εὑρήσεις
  choice: обретёшь
  rationale: Будущая форма εὑρίσκω буквально означает «найдёшь»; «обретёшь» здесь естественно сочетается с отвлечённым существительным и не превращает обещанное в заслуженную награду.
- source_word: ἐξιλασμόν
  choice: искупление
  rationale: ἐξιλασμός указывает на устранение вины и восстановление благоволения. «Искупление» доступно современному читателю и сохраняет религиозную весомость термина, хотя не исчерпывает всех его оттенков.
theological_decisions:
- issue: Значение ἐπισκοπή в контексте книги Премудрости
  choice: посещение с возможным Божьим и судебным оттенком
  alternative: проверка; испытание; время отчёта
  rationale: Выражение может говорить о решающем времени, когда человек подвергается проверке или Божьему вмешательству. «Посещение» не устраняет эту намеренную смысловую широту.
- issue: Передача ἐξιλασμόν
  choice: искупление
  alternative: очищение от вины; умилостивление; прощение
  rationale: Греческое слово сочетает идею устранения вины с восстановлением благоволения. «Искупление» сохраняет богословскую насыщенность; более узкие или специальные варианты приведены в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким, наставительным ритмом. Слова «суд», «посещение» и «искупление» сохраняют торжественность и богословскую многозначность оригинала без конфессионального уточнения.
