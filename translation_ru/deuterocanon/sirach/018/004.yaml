lexical_decisions:
- source_word: τίς
  choice: кто
  rationale: Вопросительное местоимение вводит риторический вопрос; простое «кто» естественно по-русски и сохраняет его силу.
- source_word: ἐξιχνιάσει
  choice: исследует до конца
  rationale: Форма будущего времени буквально передаёт идею прослеживания и исчерпывающего исследования. «Исследует до конца» сохраняет риторическую форму, не добавляя в текст модального «может».
- source_word: τὰ μεγαλεῖα
  choice: великие дела
  rationale: Существительное во множественном числе может обозначать великие деяния или проявления величия; «великие дела» естественно в библейском контексте и не сужает смысл до военных подвигов.
- source_word: αὐτοῦ
  choice: Его
  rationale: Притяжательное местоимение относится по контексту к Богу. Прописная буква соответствует принятому русскому библейскому оформлению, не добавляя имени в сам текст.
theological_decisions:
- issue: Референт местоимения αὐτοῦ
  choice: «Его» — Бог
  alternative: «его» без типографического уточнения референта
  rationale: Ближайший контекст говорит о Господе, поэтому местоимение естественно относится к Богу; при этом имя Бога не вставляется в стих.
- issue: Риторическая сила будущего ἐξιχνιάσει
  choice: 'сохранить вопрос в будущем времени: «кто исследует»'
  alternative: 'модальное толкование: «кто может исследовать»'
  rationale: Греческий текст не содержит отдельного глагола способности. Будущее время в риторическом вопросе само подразумевает невозможность исчерпывающего исследования и сохраняет исходную богословскую напряжённость без поясняющей вставки.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная риторическая формулировка. «До конца» передаёт интенсивность приставочного глагола ἐξιχνιάζω без архаизма «исследит» или менее прозрачной метафоры «проследит».
