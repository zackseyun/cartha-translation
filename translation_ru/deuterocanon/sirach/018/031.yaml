  yaml_path: translation/deuterocanon/sirach/018/031.yaml
  text: If you grant your soul the pleasure it desires[a], it will make you a joy to your enemies.
translation:
  language: ru
  text: Если ты будешь потакать своей душе, исполняя её желания[a], то станешь радостью для своих врагов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если ты предоставишь своей душе удовлетворение её желаний, то станешь тем, чему будут радоваться твои враги».'
    reason: 'Лексическая альтернатива: более явно передаёт предоставление душе желанного удовлетворения и раскрывает, что враги радуются участи человека.'
lexical_decisions:
- source_word: ἐὰν χορηγήσεις
  choice: Если будешь потакать
  rationale: Условная конструкция передана прямо. χορηγέω буквально означает «предоставлять, снабжать», но в сочетании с желаниями собственной души здесь естественно выражает потворство им.
- source_word: τῇ ψυχῇ σου
  choice: своей души
  rationale: Сохранено явное упоминание ψυχή — внутреннего «я», включая область влечений; перевод не сужает значение до одного лишь аппетита.
- source_word: εὐδοκίαν ἐπιθυμίας
  choice: желаниям
  rationale: Сжатая греческая конструкция обозначает удовлетворение, которого ищет влечение. Русское «потакать желаниям» естественно передаёт весь оборот, не ограничивая ἐπιθυμία сексуальной похотью.
- source_word: ποιήσει σε
  choice: станешь
  rationale: Греческое «сделает тебя» идиоматично передано результативной конструкцией; подразумеваемым подлежащим остаётся потворство желаниям.
- source_word: ἐπίχαρμα τῶν ἐχθρῶν σου
  choice: поводом для ликования своих врагов
  rationale: ἐπίχαρμα — то, чему или из-за чего радуются. «Повод для ликования» сохраняет враждебное злорадство точнее, чем нейтральная «радость», и не усиливает смысл до «посмешища».
theological_decisions:
- issue: Антропологический смысл ψυχή
  choice: Сохранить слово «душа»
  alternative: «самому себе» или «своему аппетиту»
  rationale: Речь идёт не о техническом учении о составе человека, а о внутреннем желании и самообладании; всё же явное ψυχή следует сохранить.
- issue: Оттенок ἐπίχαρμα применительно к врагам
  choice: «поводом для ликования своих врагов»
  alternative: «радостью для своих врагов» или «посмешищем для своих врагов»
  rationale: Фраза указывает, что враги будут радоваться участи человека. Выбранный вариант выявляет обусловленное контекстом злорадство, не добавляя конкретного образа насмешки.
translation_notes:
  register: Современный литературный русский язык, краткая афористическая форма наставления. «Потакать желаниям» понятно современному читателю и передаёт нравственный смысл без конфессионального уточнения; «ликование» поддерживает достоинство библейского регистра.
