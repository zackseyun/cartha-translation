lexical_decisions:
- source_word: κράτος
  choice: сила
  rationale: Передаёт явленную мощь и естественно сочетается с родительным «Его величия», не привнося политического оттенка господства.
- source_word: μεγαλωσύνης
  choice: величие
  rationale: Сохраняет возвышенный смысл Божьего превосходства и в современном русском звучит естественнее, чем более церемониальное «величество» в данном сочетании.
- source_word: ἐξαριθμήσεται
  choice: исчислит
  rationale: Риторическая форма означает способность полностью сосчитать или определить меру; «исчислит» кратко и достойно передаёт этот смысл.
- source_word: προσθήσει
  choice: сможет до конца
  rationale: Буквально глагол означает «прибавит, продолжит»; вместе с инфинитивом он указывает на дальнейшее, исчерпывающее повествование. Основной текст передаёт идиому естественным русским выражением, а буквальный образ отмечен в сноске.
- source_word: ἐκδιηγήσασθαι
  choice: поведать
  rationale: Сложный глагол выражает подробное или полное изложение; «поведать» сохраняет повествовательный и возвышенный оттенок без технической тяжеловесности.
- source_word: τὰ ἐλέη αὐτοῦ
  choice: о Его милостях
  rationale: Множественное число сохранено и обозначает многочисленные проявления Божьей милости, а не только внутреннее сострадание.
theological_decisions:
- issue: Связь κράτος и μεγαλωσύνης
  choice: «силу Его величия»
  alternative: «могущество Его величества»
  rationale: Выбранный вариант сохраняет генитивную связь и богословскую возвышенность, но не делает выражение излишне церемониальным и не сводит μεγαλωσύνη к титулу.
- issue: Значение προσθήσει ἐκδιηγήσασθαι
  choice: «сможет до конца поведать» с пояснительной сноской
  alternative: «прибавит, повествуя» / «продолжит рассказывать»
  rationale: Греческий оборот допускает буквальное понимание «прибавить к рассказу» и идиоматическое «продолжить или исчерпывающе рассказать». Основной вариант естественен по-русски, а сноска сохраняет неоднозначность образа.
- issue: Оформление местоимений, относящихся к Богу
  choice: 'прописная буква: «Его»'
  alternative: 'строчная буква: «его»'
  rationale: В современном русском библейском регистре прописная буква остаётся понятным знаком почтения; она не изменяет референцию или содержание исходного текста.
translation_notes:
  register: Современный литературный русский с кратким, возвышенным ритмом риторических вопросов. Лексика понятна широкому читателю; греческий образ προσθήσει сохранён в сноске, чтобы основной текст не звучал неестественно.
