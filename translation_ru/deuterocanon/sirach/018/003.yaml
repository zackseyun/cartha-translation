translation:
  language: ru
  text: Он никому не дал возвестить о Своих делах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он никому не позволил возвестить о Своих делах»; возможно также: «Он никому не дал способности возвестить о Своих делах» или «Он никому не поручил возвещать о Своих делах». Употреблённый здесь греческий глагол редок и может указывать на разрешение, наделение способностью или поручение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐθενί
  choice: никому
  rationale: Дательный падеж отрицательного местоимения естественно передаётся русским «никому» и сохраняет структуру, в которой действие не предоставлено ни одному человеку.
- source_word: ἐξεποίησεν
  choice: не дал
  rationale: Редкий глагол в сочетании с инфинитивом допускает оттенки разрешения, наделения способностью или поручения. Русское «не дал» естественно сохраняет эту смысловую широту, не сводя выражение только к позволению или только к способности.
- source_word: ἐξαγγεῖλαι
  choice: возвестить
  rationale: Совершенный вид соответствует аористному инфинитиву, а «возвестить» передаёт публичный, декларативный характер ἐξαγγέλλω и сохраняет достойный библейский регистр.
- source_word: τὰ ἔργα αὐτοῦ
  choice: о Своих делах
  rationale: «Дела» прямо передаёт ἔργα. Предложная конструкция с «возвестить о» звучит естественно по-русски; возвратное «Своих» недвусмысленно относит дела к подлежащему.
theological_decisions:
- issue: Смысл утверждения о возвещении Божьих дел
  choice: Никому не было дано возвестить о Его делах.
  alternative: Никому не было позволено, поручено или дано способности возвестить о Его делах.
  rationale: Греческая формулировка кратка, а редкий глагол не позволяет уверенно выбрать только разрешение, назначение либо наделение способностью. Перевод «не дал» сохраняет эту напряжённость и не вводит более сильного тезиса о полной непознаваемости Божьих дел.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формула «не дал возвестить» лаконична и понятна, а прописные буквы в местоимениях сохраняют традиционный русский издательский способ обозначения Бога без добавления толкования.
