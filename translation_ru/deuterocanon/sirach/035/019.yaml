translation:
  language: ru
  text: Всякий мужчина примет женщину[a], но мужчина выберет молодую женщину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции здесь стоит иное изречение: «Ничего не делай без совета и, сделав это, не раскаивайся». Греческий текст в этом месте существенно отличается от сохранившегося еврейского.'
    reason: textual_variant
lexical_decisions:
- source_word: כָּל זָכָר
  choice: всякий мужчина
  rationale: Слово זכר прямо обозначает лицо мужского пола. «Всякий мужчина» естественно передаёт обобщающий характер изречения, при этом отличие от איש во второй части отражено словом «человек».
- source_word: תְּקַבֵּל
  choice: примет
  rationale: קבל значит «принимать, получать». «Примет» сохраняет широту смысла, не сводя высказывание непременно к браку.
- source_word: אִשָּׁה
  choice: женщину
  rationale: אשה может означать женщину или жену. Здесь обобщённый контекст и противопоставление слову עלמה поддерживают более нейтральное «женщину».
- source_word: אַךְ
  choice: но
  rationale: Союз выражает контраст между готовностью принять и осознанным выбором.
- source_word: אִישׁ
  choice: человек
  rationale: Так сохраняется лексическое различие между זכר («мужчина» как лицо мужского пола) и איש, которое здесь может обозначать зрелого, рассудительного человека; вместе с тем русский контекст не скрывает, что речь идёт о мужчине.
- source_word: יִבְחַר
  choice: выберет
  rationale: בחר прямо означает «выбирать»; форма будущего времени подходит для обобщённого изречения.
- source_word: עַלְמָה
  choice: молодую женщину
  rationale: עלמה обозначает молодую женщину брачного возраста. Перевод «девственницу» был бы чрезмерно узким, а «девицу» — стилистически устаревшим.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающейся греческой традицией
  choice: Основной текст переведён по сохранившемуся еврейскому изречению.
  alternative: 'Греческий текст: «Ничего не делай без совета и, сделав, не раскаивайся».'
  rationale: При наличии еврейского текста Сираха исходным служит он. Поскольку греческий свидетель содержит здесь совершенно иное изречение, вариант приведён в сноске, а не смешан с основным текстом.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная конструкция. Сохранён несколько резкий контраст между זכר и איש, а неоднозначное אשה не сужено до значения «жена».
