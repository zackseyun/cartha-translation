review_pass:
  verdict: revise
  source_fidelity: 'Основной текст черновика передаёт греческий параллельный текст, но не соответствует приложенному еврейскому свидетельству, которое с высокой уверенностью содержит совершенно иное предложение: «Спаси нас, Боже всего, и наведи страх перед Тобою на все народы». При приоритете исходного текста еврейское чтение должно быть основным. Греческое чтение следует сохранить в сноске как существенное расхождение свидетельств.'
  naturalness: «Тебя поставили во главе?» само по себе естественно, но относится к иному чтению. В исправленном тексте «Спаси нас, Боже всего» и «наведи на все народы страх перед Тобою» представляют собой ясный современный литературный русский с уместно возвышенным молитвенным регистром.
  terminology: «Боже всего» точно передаёт אלהי הכל, не сужая всеохватность выражения. «Страх перед Тобою» передаёт פחדך без навязывания более узкого толкования (например, «благоговение»). Местоимение «Тобою» пишется с прописной буквы как обычное русское библейское обращение к Богу.
  issues:
  - severity: high
    issue: Основной текст переведён по греческому чтению, полностью отличному от предоставленного еврейского текста.
    rationale: Еврейский источник в задании имеет высокую уверенность и должен быть первичным основанием перевода. Английский audit trail честно фиксирует несоответствие, но не отменяет приоритета исходного текста при независимой проверке.
  - severity: medium
    issue: Сноска описывает еврейское чтение как второстепенное, хотя именно оно должно быть основным при данном исходном свидетельстве.
    rationale: После переноса еврейского текста в основную строку сноска должна документировать вместо этого несоответствующее греческое чтение и не утверждать безоговорочно, что основной перевод следует ему.
  revised_text: Спаси нас, Боже всего, и наведи на все народы страх перед Тобою.[a]
  revised_footnotes:
  - marker: a
    text: 'Приложенное греческое свидетельство, связанное здесь с Сир. 35:1, вместо этого гласит: «Тебя поставили во главе? Не превозносись; будь среди них как один из них». Оно полностью отличается от еврейского текста; основной перевод передаёт приложенное еврейское чтение.'
    reason: textual_variant
  revision_rationale: 'Исправление восстанавливает перевод предоставленного еврейского текста: הושיענו — «Спаси нас», אלהי הכל — «Боже всего», והרם פחדך על כל הגוים — «наведи на все народы страх перед Тобою». Поскольку греческий параллельный текст передаёт другое изречение, он не смешивается с основным текстом и прозрачно отмечен в сноске. Это также сохраняет спорность привязки свидетельств, не выдавая одно чтение за другое.'
