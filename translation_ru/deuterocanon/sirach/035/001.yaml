  text: If they made you a leader, do not exalt yourself; be among them as one of them.[a]
translation:
  language: ru
  text: Тебя поставили во главе? Не превозносись; будь среди них как один из них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Приложенное еврейское свидетельство для этой ссылки гласит: «Спаси нас, Боже всего, и наведи страх перед Тобой на все народы». Поскольку эти слова не соответствуют греческому стиху, связанному здесь с Сир. 35:1, основной перевод следует греческому тексту; расхождение отмечено открыто.'
    reason: textual_variant
lexical_decisions:
- source_word: Ἡγούμενόν
  choice: во главе
  rationale: Причастие обозначает человека, который руководит или распоряжается. Оборот «поставили во главе» естественен по-русски и не приписывает ему конкретной политической должности.
- source_word: κατέστησαν
  choice: поставили
  rationale: Глагол выражает назначение или поставление в определённое положение; «поставили» сохраняет неопределённое множественное число действующих лиц.
- source_word: μὴ ἐπαίρου
  choice: не превозносись
  rationale: Так сохраняются и образ самовозвышения, и нравственная сила запрета.
- source_word: γίνου
  choice: будь
  rationale: В данном увещевании повелительное «будь» естественно передаёт требуемый образ поведения.
- source_word: ὡς εἷς ἐξ αὐτῶν
  choice: как один из них
  rationale: Фраза подчёркивает смирение и единство с остальными, сохраняя сравнение исходного текста.
theological_decisions:
- issue: Выбор текста при полном расхождении еврейского и греческого свидетельств
  choice: Основной текст переведён по приложенному греческому свидетельству, которое содержит связное чтение, соотнесённое в задании с данным стихом; расхождение с еврейским текстом открыто отмечено в сноске.
  alternative: 'Перевести приложенный еврейский текст как основной: «Спаси нас, Боже всего, и наведи страх перед Тобой на все народы».'
  rationale: Два свидетельства передают совершенно разные предложения. Скрыто объединять их или исправлять одно по другому нельзя. Греческое чтение согласуется с указанным английским консультационным слоем и потому помещено в основной текст, а высоконадёжное, но не соответствующее ссылке еврейское свидетельство полностью зафиксировано в сноске.
translation_notes:
  register: Современный литературный русский язык; сдержанный, ясный и достойный регистр. Вопросительная форма греческого текста сохранена, а «во главе» выбрано вместо более должностных «правителем» или «начальником».
