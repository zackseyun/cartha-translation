  text: And all the ends of the earth will know that you are the eternal God[a][b].
translation:
  language: ru
  text: И узнают все пределы земли, что Ты — вечный Бог[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции: «Боящиеся Господа найдут суд и зажгут праведные дела, словно свет». Еврейское свидетельство здесь сохраняет существенно иную строку.'
    reason: textual_variant
  - marker: b
    text: 'Буквально также возможно: «Бог вечности» или «Бог навеки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וידעו
  choice: и узнают
  rationale: 'Форма с ו в данном поэтическом контексте естественно передаёт будущее или результирующее действие: всеобщему признанию ещё предстоит совершиться.'
- source_word: כל אפסי ארץ
  choice: все пределы земли
  rationale: Устойчивый древнееврейский образ обозначает самые отдалённые края мира. «Все пределы земли» сохраняет образность оригинала и звучит понятно и торжественно по-русски.
- source_word: אלהי עולם
  choice: вечный Бог
  rationale: Сочетание буквально может быть понято как «Бог вечности» или «Бог навеки». В основном тексте выбран естественный русский эквивалент «вечный Бог», а формальная неоднозначность отмечена в сноске.
- source_word: אתה
  choice: Ты
  rationale: Самостоятельное местоимение в еврейском подчёркнуто; русское «Ты» сохраняет это ударение без необоснованного добавления «Ты один».
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и существенно отличающейся греческой традиции
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; греческое чтение приведено в сноске.
  alternative: «Боящиеся Господа найдут суд и зажгут праведные дела, словно свет».
  rationale: При наличии еврейского текста Сираха он служит первичным источником. Греческая строка здесь не является близким переводным соответствием и потому не должна подменять или гармонизировать еврейское чтение, но её значительное расхождение необходимо обозначить.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Оборот «пределы земли» сохраняет поэтическую метонимию оригинала; прописная буква в «Ты» выражает традиционное уважительное обращение к Богу.
