  text: Speak, elder, for it is fitting for you—yet with accurate knowledge, and do not hinder the music.[b][a]
translation:
  language: ru
  text: Говори, старший, ведь тебе это подобает, но говори с точным знанием и не мешай музыке.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Приведённый основной еврейский текст, по-видимому, относится не к этому стиху. Поэтому перевод здесь выполнен по греческому параллельному тексту.
    reason: textual_variant
  - marker: b
    text: 'Или: «не прерывай музыкального исполнения». Греческое слово может обозначать не только музыку как таковую, но и музыкальное выступление в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Λάλησον
  choice: Говори
  rationale: Прямое повеление говорить; современная и естественная форма без архаизации.
- source_word: πρεσβύτερε
  choice: старший
  rationale: Обращение к старшему по возрасту или положению человеку. «Старший» сохраняет уважительный оттенок и, в отличие от «старейшина», не предполагает определённой должности.
- source_word: πρέπει γάρ σοι
  choice: ведь тебе это подобает
  rationale: Передаёт уместность и приличие речи для старшего участника собрания.
- source_word: ἐν ἀκριβεῖ ἐπιστήμῃ
  choice: с точным знанием
  rationale: Сохраняет акцент на точности и компетентности, не сводя выражение лишь к благоразумию или красноречию.
- source_word: μὴ ἐμποδίσῃς
  choice: не мешай
  rationale: Естественно передаёт запрет препятствовать или нарушать ход происходящего.
- source_word: μουσικά
  choice: музыке
  rationale: Краткий и естественный перевод греческого среднего множественного числа; более широкое значение музыкального исполнения отмечено в сноске.
