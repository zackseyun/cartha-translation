  text: Put him to work, so that he may not be idle,
translation:
  language: ru
  text: Пошли его на работу, чтобы он не оставался без дела,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμβαλε
  choice: Пошли
  rationale: Аористный императив ἐμβάλλω буквально означает «брось/помести», но в сочетании с εἰς ἐργασίαν выражает распоряжение направить или поставить человека на работу. «Пошли» естественно передаёт повелительную силу и смысл назначения к труду.
- source_word: αὐτὸν
  choice: его
  rationale: Винительный падеж местоимения мужского рода единственного числа указывает на мужчину в контексте.
- source_word: εἰς ἐργασίαν
  choice: на работу
  rationale: ἐργασία означает работу, труд или занятие; с ἔμβαλε оборот идиоматически обозначает направление человека на работу.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз вводит придаточное цели; русское «чтобы» ясно и естественно сохраняет целевое значение.
- source_word: μὴ ἀργῇ
  choice: он не оставался без дела
  rationale: ἀργέω значит бездействовать, оставаться праздным или неработающим. Формулировка «не оставался без дела» передаёт практический смысл, не усиливая его до нравственной характеристики «ленился».
