  text: In all your works be preeminent[a]; do not give a blemish to your honor.
translation:
  language: ru
  text: Во всех своих делах отличайся; не запятнай своей чести.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не запятнай своего доброго имени». Греческое слово, переведённое как «честь», может также означать славу или репутацию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: Во всех своих делах
  rationale: Передаёт весь объём выражения и сохраняет прямую связь ἔργα с делами и поступками человека.
- source_word: γίνου ὑπεράγων
  choice: отличайся
  rationale: Греческое сочетание призывает быть выдающимся, превосходить обычный уровень. «Отличайся» естественно звучит по-русски и не превращает наставление в безусловное требование быть «лучше всех».
- source_word: μὴ δῷς μῶμον
  choice: не запятнай
  rationale: Запрет с μή и аористным сослагательным передан прямым повелительным оборотом. Глагол «запятнать» естественно сохраняет образ пятна, порока или повода для порицания, заключённый в μῶμον.
- source_word: ἐν τῇ δόξῃ σου
  choice: своей чести
  rationale: В данном нравственно-наставительном контексте δόξα обозначает честь, доброе имя или репутацию, а не сияющую славу. Русская конструкция с «запятнать» требует прямого дополнения.
theological_decisions:
- issue: Значение δόξα в контексте нравственного наставления
  choice: честь
  alternative: слава; доброе имя; репутация
  rationale: «Честь» сохраняет общественно-нравственный смысл греческого слова и не вносит в текст специально богословского значения «славы»; возможный оттенок доброго имени отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая форма наставления сохранена. «Отличайся» передаёт сравнительную силу ὑπεράγων без неестественного оборота «будь превосходящим», а «не запятнай своей чести» воспроизводит образ μῶμον в идиоматичной форме.
