  yaml_path: translation/deuterocanon/sirach/035/030.yaml
  text: For it is better that your children should beg from you than that you should look to the hands of your sons[a][b].
translation:
  language: ru
  text: Ведь лучше, чтобы твои дети просили у тебя[a], чем тебе смотреть на руки своих сыновей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умоляли тебя»; греческий глагол может обозначать настойчивую просьбу, вызванную нуждой.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «смотреть на руки своих сыновей» — образ зависимости от их помощи или содержания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖσσον
  choice: лучше
  rationale: Естественно передаёт сравнительную оценку, выраженную греческим прилагательным.
- source_word: τὰ τέκνα
  choice: твои дети
  rationale: τέκνα обозначает детей в широком смысле; притяжательное значение местоимения σου естественно выражено словом «твои».
- source_word: δεηθῆναί σου
  choice: просили у тебя
  rationale: δέομαι может означать настойчиво просить или умолять; нейтральное «просили» сохраняет широту значения, а более сильный вариант отмечен в сноске.
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: смотреть на руки
  rationale: Сохранён конкретный греческий образ, который в контексте подразумевает ожидание помощи или содержания.
- source_word: υἱῶν σου
  choice: своих сыновей
  rationale: υἱῶν конкретно означает «сыновей»; возвратное «своих» естественно для русского при совпадении обладателя с субъектом инфинитива.
theological_decisions:
- issue: Различие между τέκνα и υἱῶν
  choice: Передать как «дети» и «сыновья»
  alternative: Передать оба слова как «дети»
  rationale: Греческий текст сначала употребляет более широкое τέκνα, а затем конкретно мужское υἱῶν; перевод сохраняет это различие, не истолковывая его дополнительно.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис близок к греческому, но естественен по-русски; конкретный образ рук сохранён, а его подразумеваемый смысл пояснён в сноске.
