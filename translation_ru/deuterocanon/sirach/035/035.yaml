base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/035/035.yaml
  text: A yoke and a strap will bend the neck[a], and for a wicked servant there are racks and tortures.
translation:
  language: ru
  text: Ярмо и ремень согнут шею, а злому рабу[a] — дыбы и пытки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злому слуге»; греческое слово может обозначать домашнего слугу, однако контекст принуждения допускает перевод «раб».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγός
  choice: ярмо
  rationale: В сочетании с шеей слово обозначает конкретное ярмо; значение «весы» здесь не подходит.
- source_word: ἱμάς
  choice: ремень
  rationale: Греческое слово означает кожаный ремень или плеть; «ремень» естественно передаёт орудие удержания рядом с ярмом, не усиливая значение до наказания плетью.
- source_word: κάμψουσιν
  choice: согнут
  rationale: Будущее время действительного залога сохранено; глагол прямо передаёт физический образ сгибания шеи.
- source_word: τράχηλον
  choice: шею
  rationale: Прямое анатомическое значение передано естественным русским винительным падежом.
- source_word: οἰκέτῃ
  choice: рабу
  rationale: Слово может означать домашнего слугу, но контекст принуждения и телесного наказания делает зависимое, рабское положение особенно заметным.
- source_word: κακούργῳ
  choice: злому
  rationale: Прилагательное характеризует человека как дурного или творящего зло; «злому» сохраняет широкую нравственную оценку, не сужая её до уголовного значения.
- source_word: στρέβλαι
  choice: дыбы
  rationale: Слово обозначает орудия истязания, в частности дыбу; русский конкретный образ сохраняет множественное число оригинала.
- source_word: βάσανοι
  choice: пытки
  rationale: В данном карательном контексте основное значение — физические истязания; «пытки» передаёт его прямо и современно.
theological_decisions:
- issue: Передача зависимого положения οἰκέτης
  choice: раб
  alternative: слуга; домашний слуга
  rationale: Хотя слово шире, чем обозначение раба в строгом смысле, образы ярма, удержания и истязаний выдвигают на первый план принудительную зависимость. Альтернатива отмечена в сноске, чтобы не устранять лексическую широту оригинала.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. Эллиптическая конструкция с тире во второй части сохраняет резкий параллелизм греческой фразы; конкретные и суровые образы оригинала не смягчены.
