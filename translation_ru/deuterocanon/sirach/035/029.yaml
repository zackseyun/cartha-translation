translation:
  language: ru
  text: Пока ты ещё жив и в тебе есть дыхание, не отдавай себя во власть ни одному смертному.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «не меняй себя ради какой бы то ни было плоти». Греческое выражение сжато; «плоть» здесь может означать смертного человека. Оно может передавать предостережение не уступать себя смертным людям и не меняться ради них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: Пока ты ещё жив
  rationale: Передаёт продолжающийся период жизни и подчёркнутое ἔτι («ещё») естественным современным русским оборотом.
- source_word: πνοὴ ἐν σοί
  choice: в тебе есть дыхание
  rationale: πνοή здесь обозначает дыхание как признак жизни; перевод сохраняет образ оригинала, не придавая слову более узкого богословского смысла «дух».
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  choice: не отдавай себя во власть
  rationale: Буквальное «не изменяй себя» в сочетании с возвратным местоимением и дательным πάσῃ σαρκί по-русски не раскрывает сжатого идиоматического смысла. Выбранная формулировка передаёт предостережение не уступать себя чужой власти, а буквальная возможность отмечена в сноске.
- source_word: πάσῃ σαρκί
  choice: никому из смертных
  rationale: В данном контексте σάρξ обозначает человека как смертное существо, а не «греховную природу». «Никому из смертных» естественно передаёт распределительное значение πάσῃ и сохраняет оттенок человеческой бренности.
theological_decisions:
- issue: Значение σάρξ в контексте Премудрости Иисуса, сына Сирахова
  choice: смертный человек
  alternative: плоть как телесное желание или греховная природа
  rationale: Контекст допускает обычное библейское употребление «плоти» как обозначения смертных людей. Перевод через «греховную природу» привнёс бы не обусловленное данным местом позднейшее богословское значение.
- issue: Смысл μὴ ἀλλάξῃς σεαυτὸν πάσῃ σαρκί
  choice: не отдавать себя во власть смертных
  alternative: не изменять себя ради какого-либо человека
  rationale: Греческая фраза остаётся сжатой и допускает буквальное понимание через «изменять». Основной текст передаёт вероятный смысл уступки или передачи себя под чужую власть, а иная возможность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростного наставления. Обращение на «ты» соответствует форме единственного числа в греческом тексте. Необычное буквальное «плоть» вынесено в сноску, чтобы основной текст был понятен без привнесения значения «греховная природа».
