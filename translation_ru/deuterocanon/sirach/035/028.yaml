  yaml_path: translation/deuterocanon/sirach/035/028.yaml
  text: Do not give authority over yourself in your lifetime to son or wife[a], brother or friend; and do not give your property to another, lest you regret it and have to ask for it back.
translation:
  language: ru
  text: Не давай власти над собой ни сыну, ни жене, ни брату, ни другу, пока ты жив; и не отдавай своего имущества другому, чтобы тебе потом, пожалев об этом, не пришлось просить вернуть его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пришлось просить о нём»; возможно также: «не оказался в нужде из-за него». Заключительные греческие слова δέῃ περὶ αὐτῶν выражены сжато, поэтому точный оттенок смысла не вполне ясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ δῷς ἐξουσίαν ἐπὶ σὲ
  choice: не давай власти над собой
  rationale: Сочетание ἐξουσίαν ἐπὶ σέ обозначает власть или право распоряжаться человеком. Русское «власть над собой» сохраняет прямую конструкцию и смысл предостережения.
- source_word: ἐν ζωῇ σου
  choice: пока ты жив
  rationale: 'Естественная современная передача временного значения: не отказываться от самостоятельности при жизни.'
- source_word: υἱῷ καὶ γυναικί, ἀδελφῷ καὶ φίλῳ
  choice: ни сыну, ни жене, ни брату, ни другу
  rationale: В русском отрицательном перечислении повторение «ни» естественно передаёт совокупность названных близких людей, не подразумевая, что запрет относится лишь к некоторым из них.
- source_word: τὰ χρήματά σου
  choice: своего имущества
  rationale: χρήματα может обозначать не только деньги, но и имущество или материальные средства в целом. «Имущество» сохраняет эту широту.
- source_word: ἑτέρῳ
  choice: другому
  rationale: Кратко и непосредственно передаёт неопределённое указание на другого человека.
- source_word: ἵνα μὴ μεταμεληθεὶς
  choice: чтобы потом, раскаявшись, не пришлось
  rationale: μεταμέλομαι выражает последующее сожаление о сделанном. «Потом» естественно раскрывает временную последовательность, уже заключённую в причастии.
- source_word: δέῃ περὶ αὐτῶν
  choice: просить вернуть его
  rationale: В контексте передачи имущества выражение, вероятнее всего, указывает на необходимость просить о возвращении отданного. Формулировка делает подразумеваемый объект просьбы ясным, а примечание сохраняет сжатость и неоднозначность греческого выражения.
