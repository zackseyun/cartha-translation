  text: Обнови знамение и повтори чудо[a]; яви величие руки, укрепи мышцу и десницу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая параллель у Свете здесь существенно отличается: в ней говорится о печати из огненно-красного камня на золотом украшении и о гармонии музыки на пиршестве с вином. Поскольку еврейский текст сохранился и оценён как надёжный, перевод следует ему; греческое чтение отмечено как значительное разночтение.'
