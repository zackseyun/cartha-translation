lexical_decisions:
- source_word: חדש
  choice: обнови
  rationale: Императив выражает просьбу о новом явлении или возобновлении действия; «обнови» сохраняет эту смысловую широту.
- source_word: אות
  choice: знамение
  rationale: Обычное библейское обозначение знака, через который явно обнаруживается Божье действие.
- source_word: ושנה
  choice: и повтори
  rationale: Глагол שנה здесь имеет значение «сделать вновь, повторить» и образует параллель с предыдущим повелением.
- source_word: מופת
  choice: чудо
  rationale: В сочетании со «знамением» слово обозначает необычайное проявление Божьей силы; «чудо» естественно и понятно современному читателю.
- source_word: האדר
  choice: яви величие
  rationale: Побудительная форма связана с величием и величественным проявлением; выражение «яви величие» естественнее по-русски, чем буквальное «прославь» применительно к руке.
- source_word: יד
  choice: руки
  rationale: Телесный образ Божьей силы сохранён буквально, без замены отвлечённым словом «могущество».
- source_word: ואמץ
  choice: укрепи
  rationale: Прямо передаёт значение придания силы или крепости.
- source_word: זרוע
  choice: мышцу
  rationale: «Мышца» сохраняет традиционный библейский образ деятельной силы и отличает זרוע от следующих рядом «руки» и «десницы».
- source_word: וימין
  choice: и десницу
  rationale: «Десница» точно обозначает правую руку, сохраняет отдельный образ еврейского текста и соответствует достоинству поэтической молитвы.
theological_decisions:
- issue: Антропоморфные образы Божьей силы
  choice: Сохранить «руку», «мышцу» и «десницу» как три телесных образа
  alternative: Передать их обобщённо как «силу» или «могущество»
  rationale: Еврейский текст намеренно использует конкретные и частично параллельные образы. Их сохранение не устраняет богословскую напряжённость и поэтическую выразительность.
- issue: Существенное расхождение еврейского текста с греческой параллелью
  choice: Переводить высоконадёжный сохранившийся еврейский текст
  alternative: Следовать греческому чтению об огненном камне в золотом украшении и музыке на пиршестве
  rationale: Греческая параллель содержит иной текст и не служит основанием для исправления засвидетельствованного еврейского чтения; расхождение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным молитвенно-поэтическим звучанием. «Знамение», «мышца» и «десница» сохраняют библейскую образность, но синтаксис остаётся ясным и естественным.
