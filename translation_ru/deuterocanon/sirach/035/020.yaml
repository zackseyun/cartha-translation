translation:
  language: ru
  text: Нёбо распознаёт вкус речи, а понимающее сердце — вкус лжи.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нёбо испытывает вкусы речи, а проницательное сердце — вкусы лжи». В еврейском тексте образ вкуса повторён в обеих частях строки.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст здесь существенно иной: «Не ходи по пути преткновения и не споткнись о каменистые места». Перевод следует сохранившемуся еврейскому тексту.'
    reason: textual_variant
lexical_decisions:
- source_word: חך
  choice: нёбо
  rationale: Буквально обозначает нёбо как орган вкуса; такой перевод сохраняет конкретную вкусовую метафору.
- source_word: בוחן
  choice: различает
  rationale: В данном изречении глагол передаёт испытание и распознавание на вкус; «различает» естественно связывает обе части строки.
- source_word: מטעמי
  choice: оттенки
  rationale: Слово связано со вкусом и вкусовыми качествами. «Оттенки» сохраняет образ тонкого распознавания и естественно сочетается в русском как с речью, так и с ложью; повтор передан в обеих частях.
- source_word: דבר
  choice: речи
  rationale: Здесь единственное число допускает собирательное значение — речь, сказанное, — а не обязательно одно отдельное слово.
- source_word: לב מבין
  choice: понимающее сердце
  rationale: Сохраняется древнееврейское представление о сердце как средоточии разумения и грамматическая характеристика сердца причастием.
- source_word: כזב
  choice: лжи
  rationale: Передаёт собирательное значение ложного и обманчивого высказывания, не сужая смысл до одной конкретной лжи.
