  register: Современный литературный русский язык с лаконичным строением изречения. Сохранены параллелизм, древнееврейский образ понимающего сердца и повторяющаяся вкусовая метафора; «оттенки» выбрано ради естественности, а буквальный вариант дан в примечании.
