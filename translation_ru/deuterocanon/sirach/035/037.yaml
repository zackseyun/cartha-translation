  text: Ведь праздность научила многому злу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь безделье научило многому злу». Греческое ἀργία может означать праздность, безделье, леность или бездействие; «праздность» выбрана как широкое и естественное слово для данного изречения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὴν
  choice: многому
  rationale: С абстрактным существительным κακία прилагательное πολύς выражает значительную меру или объём; по-русски в сочетании с глаголом «научила» это естественно передаётся конструкцией «многому злу».
- source_word: γὰρ
  choice: ведь
  rationale: Частица γάρ вводит объяснение или обоснование. «Ведь» кратко и естественно сохраняет эту связующую функцию в современном русском языке.
- source_word: κακίαν
  choice: злу
  rationale: 'κακία имеет широкий нравственный смысл: зло, порочность, нечестие. «Зло» не сужает значение до злобы или конкретного порока и хорошо соответствует обобщённому изречению.'
- source_word: ἐδίδαξεν
  choice: научила
  rationale: Сохранена явная греческая метафора обучения. Русское совершенное прошедшее «научила» естественно выражает итог подтверждённой опытом общей истины.
- source_word: ἡ ἀργία
  choice: праздность
  rationale: ἀργία обозначает состояние без дела, бездействие или леность. «Праздность» передаёт это состояние широко, уместна в литературном изречении и менее разговорна, чем «лень».
