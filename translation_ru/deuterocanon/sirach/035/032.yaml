  text: On the day the days of your life are completed[a], and at the time of your death, distribute your inheritance.
translation:
  language: ru
  text: В день, когда завершатся дни твоей жизни[a], и в час смерти распредели наследство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при завершении дней твоей жизни»; буквально по-гречески: «в день завершения дней твоей жизни».'
    reason: Сноска сохраняет необычную именную конструкцию и повтор слова «день» в греческом оригинале.
lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: В день, когда
  rationale: Временное ἐν с дательным падежом передано естественным русским оборотом; добавление «когда» позволяет ясно связать выражение с родительным оборотом συντελείας ἡμερῶν.
- source_word: συντελείας ἡμερῶν ζωῆς σου
  choice: завершатся дни твоей жизни
  rationale: Сохраняется характерное для греческого текста повторение идеи дня и буквальный смысл «завершения дней твоей жизни», но громоздкая именная конструкция преобразована в естественную русскую глагольную.
- source_word: ἐν καιρῷ τελευτῆς
  choice: в час смерти
  rationale: καιρός обозначает определённое время, а τελευτή в контексте распоряжения наследством — смерть. «В час смерти» звучит естественно и достойно, не смягчая прямого смысла.
- source_word: διάδος
  choice: распредели
  rationale: Аористный императив требует однократного целенаправленного действия; «распредели» точно подходит к разделу наследства.
- source_word: κληρονομίαν
  choice: своё наследство
  rationale: Хотя существительное в греческом стоит без притяжательного местоимения, контекст ясно указывает на имущество адресата; русское «своё» делает связь естественной, не меняя смысла.
theological_decisions:
- issue: Передавать ли τελευτή общим словом «кончина/конец» или прямо как смерть
  choice: смерть
  alternative: кончина; конец
  rationale: В контексте окончательного распоряжения наследством слово обозначает смерть. Прямой перевод сохраняет практическую и нравственную силу наставления без конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительной мудрости. Синтаксис сделан естественным, при этом повтор «день — дни» и прямое упоминание смерти сохранены.
