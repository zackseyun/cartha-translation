lexical_decisions:
- source_word: προσευχὴ
  choice: молитва
  rationale: Обычное и естественное обозначение обращения к Богу в данном контексте.
- source_word: ταπεινοῦ
  choice: смиренного
  rationale: Передаёт нравственно-духовный оттенок греческого слова, не сводя его значение только к бедности или угнетённости.
- source_word: νεφέλας διῆλθεν
  choice: прошла сквозь облака
  rationale: Сохраняет яркий образ молитвы, беспрепятственно восходящей к Богу, без усиления глагола до значения «пронзила».
- source_word: ἕως συνεγγίσῃ
  choice: пока не приблизится
  rationale: Ближайшее грамматическое подлежащее — «молитва»; формулировка сохраняет движение образа к Божьему присутствию.
- source_word: οὐ μὴ παρακληθῇ
  choice: не утешится
  rationale: Пассивная форма παρακαλέω обычно означает «быть утешенным». Русская форма женского рода естественно согласуется с «молитвой», сохраняя её олицетворение.
theological_decisions:
- issue: Неоднозначность подлежащего во второй части стиха
  choice: 'Молитва олицетворена: она приближается и до этого не получает утешения.'
  alternative: Приближается молитва, а неутешенным остаётся смиренный человек; либо обе формы относятся к молящемуся.
  rationale: В греческом обе глагольные формы допускают связь с существительным женского рода προσευχή, тогда как перенос последнего глагола на молящегося требует подразумеваемой смены подлежащего. Основной текст следует ближайшей грамматической связи, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и возвышенный, но понятный. Сохранены образ облаков, олицетворение молитвы и неоднозначность греческого текста.
