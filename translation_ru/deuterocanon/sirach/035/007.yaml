  text: Hasten the end and attend to the appointed time[b][a], for who will tell you what you should do?
translation:
  language: ru
  text: Ускорь конец и обрати внимание на назначенный срок, ведь кто скажет тебе, что делать?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая параллель здесь читается совершенно иначе: «Говори, юноша, если тебе нужно говорить, — едва ли дважды, когда тебя спросят». По-видимому, она отражает иную форму текста или иную привязку стиха, а не близкий перевод сохранившегося еврейского текста.'
    reason: textual_variant
  - marker: b
    text: 'Буквально с еврейского: «что ты сделаешь» или «что будешь делать»; по смыслу возможно также: «как тебе поступить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: החיש
  choice: Приблизь
  rationale: Повелительная форма от חושׁ выражает настоятельность. В сочетании с קץ естественнее всего передать её как призыв приблизить или ускорить конец, сохранив необычную краткость еврейского текста.
- source_word: קץ
  choice: конец
  rationale: קץ означает «конец», «предел», «завершение». Определённость в русском здесь естественно выражается контекстом без местоимения «этот».
- source_word: ופקוד
  choice: и обрати внимание на
  rationale: 'פקד имеет широкий диапазон значений: «обратить внимание», «посетить», «назначить», «учесть». Здесь нейтральная формулировка сохраняет активное отношение к названному сроку, не сужая смысл до одного специального значения.'
- source_word: מועד
  choice: назначенный срок
  rationale: מועד обозначает установленное или назначенное время. «Назначенный срок» звучит естественно и сохраняет идею заранее определённого момента.
- source_word: כי
  choice: ведь
  rationale: Частица вводит обоснование предшествующих повелений; «ведь» естественно передаёт эту связь в современном русском.
- source_word: מי יאמר לך
  choice: кто скажет тебе
  rationale: Сохраняет прямую вопросительную конструкцию и риторическую силу еврейского будущего времени.
- source_word: מה תעשה
  choice: что делать
  rationale: 'Буквально: «что ты сделаешь / будешь делать». Русский инфинитив естественно выражает практический вопрос о том, как поступить, не вводя более сильной модальности «следует».'
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и резко отличающейся греческой параллелью
  choice: Основной текст переведён по еврейскому свидетельству; греческое чтение отмечено в сноске.
  alternative: 'Перевести греческое изречение: «Говори, юноша, если в тебе есть нужда, едва ли дважды, когда тебя спросят».'
  rationale: Сохранившийся еврейский текст является первичным источником для данного перевода. Греческая версия не представляет собой близкого перевода этой строки и, вероятно, отражает иную форму текста или иную нумерацию, поэтому она не заменяет еврейское чтение, но должна быть открыто отмечена.
translation_notes:
  register: Современный литературный русский с краткой, несколько загадочной афористичностью оригинала. Необычное «приблизь конец» сохранено намеренно; богословский субъект или конкретное понимание «конца» не добавлены.
