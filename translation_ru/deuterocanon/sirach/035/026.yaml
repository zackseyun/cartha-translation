  text: Кто станет доверять военному отряду[a], скачущему из города в город?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Приведённая греческая параллель к этому стиху имеет совершенно иное содержание: «Поймите, что я трудился не для себя одного, но для всех, кто ищет наставления». Поэтому здесь за основной принят еврейский текст.'
    reason: textual_variant
lexical_decisions:
- source_word: מי
  choice: Кто
  rationale: Вопросительное местоимение вводит риторический вопрос; в русском языке будущность выражена формой сказуемого «поверит».
- source_word: יאמין
  choice: поверит
  rationale: Глагол אמן в породе hifil здесь означает довериться, положиться; конструкция «поверить кому-либо» естественно передаёт личное доверие.
- source_word: בגדוד צבא
  choice: военному отряду
  rationale: גדוד обозначает отряд или вооружённую группу, а צבא уточняет военный характер; сочетание передано естественно, без тяжеловесного «отряду войска».
- source_word: המדלג
  choice: скачущему
  rationale: Причастие от דלג буквально описывает движение скачками; «скачущему» сохраняет яркий образ и оттенок непостоянного перемещения.
- source_word: מעיר אל עיר
  choice: из города в город
  rationale: Прямое и естественное русское соответствие повторяющемуся перемещению между городами.
theological_decisions:
- issue: Полное расхождение между сохранившимся еврейским текстом и греческой параллелью
  choice: Основной текст переведён по еврейскому свидетельству, а расхождение отмечено в сноске.
  alternative: 'Греческая параллель: «Поймите, что я трудился не для себя одного, но для всех, кто ищет наставления».'
  rationale: Поскольку еврейский текст здесь сохранился, он служит первичным источником. Содержание греческой параллели совершенно иное, поэтому согласовывать их искусственно нельзя; текстовую неопределённость следует показать читателю.
translation_notes:
  register: Современный литературный русский язык; краткая, образная формулировка с сохранением риторического вопроса и военной семантики исходного текста.
