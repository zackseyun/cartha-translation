  text: Собери все колена Иакова[a], и пусть они получат удел в наследство, как в прежние дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели этому стиху соответствует иной текст: «Среди вельмож не ставь себя с ними наравне и, когда говорит другой, не болтай много». По-видимому, это связано с иной текстовой традицией или несовпадением нумерации стихов с сохранившимся еврейским текстом.'
