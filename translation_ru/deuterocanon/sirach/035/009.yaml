lexical_decisions:
- source_word: אסוף
  choice: Собери
  rationale: Повелительная форма от אסף выражает призыв собрать воедино рассеянных; «собери» естественно и точно передаёт эту силу.
- source_word: כל שבטי יעקב
  choice: все колена Иакова
  rationale: Прямая передача древнееврейской сопряжённой конструкции; «колена» сохраняет библейский родоплеменной и заветный контекст.
- source_word: ויתנחלו
  choice: пусть они вновь получат свой удел
  rationale: Форма от נחל обозначает обретение наследственного удела. Слово «удел» естественно передаёт подразумеваемое земельное наследие; «вновь» раскрывает восстановительный смысл в сочетании с «как в прежние дни», не превращая его в отдельное новое утверждение.
- source_word: כימי קדם
  choice: как в прежние дни
  rationale: Передаёт сравнение с давними временами и сохраняет направленность молитвы на восстановление прежнего положения.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческой параллели
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству как молитва о восстановлении колен Иакова.
  alternative: 'Греческая параллель: «Среди вельмож не ставь себя с ними наравне и, когда говорит другой, не болтай много».'
  rationale: В книге Сираха при наличии еврейского текста приоритет отдаётся ему. Здесь греческая строка имеет совершенно иное содержание и, вероятно, отражает другую текстовую линию либо несовпадение нумерации; существенное расхождение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской лексикой. «Колена Иакова» и «удел» сохраняют историко-библейскую образность, оставаясь понятными читателю; синтаксис передаёт молитвенно-призывный характер строки.
