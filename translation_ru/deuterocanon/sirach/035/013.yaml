translation:
  language: ru
  text: Дай свидетельство о прежних деяниях Своих и без промедления утверди видение во имя Своё.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст этой строки труден, особенно выражение, переданное словами «без промедления». В греческом тексте эта строка читается иначе: «И сверх всего этого благословляй Создавшего тебя и насыщающего тебя Своими благами».'
    reason: alternative_reading
lexical_decisions:
- source_word: תן עדות
  choice: Дай свидетельство
  rationale: Императив передан близко к еврейскому тексту; выражение сохраняет смысл явного свидетельствования и звучит естественно в возвышенной молитвенной речи.
- source_word: למראש מעשיך
  choice: о прежних деяниях Своих
  rationale: Трудная форма למראש, вероятнее всего, указывает на прежнее, совершённое ранее. «Деяния» естественно обозначает действия Бога и сохраняет поэтический регистр.
- source_word: והקם
  choice: и утверди
  rationale: Каузативная форма קום может означать «поставить», «утвердить», «осуществить». «Утверди» хорошо сочетается с «видением» и не устраняет возможного оттенка подтверждения или исполнения.
- source_word: חזון
  choice: видение
  rationale: Прямой и традиционно понятный эквивалент, сохраняющий пророческий образ без уточнения «откровение» или «пророчество».
- source_word: דברק
  choice: без промедления
  rationale: Еврейское чтение крайне неясно; согласные допускают предположение о связи с молнией и, следовательно, быстротой. Передача «без промедления» выражает предполагаемый смысл естественным русским языком, а неопределённость отмечена в сноске.
- source_word: בשמך
  choice: во имя Своё
  rationale: Передаёт сочетание предлога ב со словом «имя» и сохраняет не вполне ясную синтаксическую связь, не уточняя её богословски.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающейся греческой параллелью
  choice: Основной текст следует еврейскому свидетельству, а греческое чтение приводится в сноске.
  alternative: «И сверх всего этого благословляй Создавшего тебя и насыщающего тебя Своими благами».
  rationale: Сохранившийся еврейский текст имеет приоритет, однако его вторая половина трудна и, вероятно, повреждена. Существенно отличающуюся греческую форму необходимо показать читателю, не подменяя ею основной текст.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным молитвенным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции; неясность еврейского текста не скрыта и вынесена в сноску.
