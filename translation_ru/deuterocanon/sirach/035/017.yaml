  text: The throat eats every kind of food[b][a], but one kind of food is more pleasant than another.
translation:
  language: ru
  text: Горло принимает всякую пищу[b][a], но одна пища приятнее другой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст представляет собой краткое и несколько неровное изречение. Греческий текст этого стиха существенно отличается: «Грешный человек уклонится от обличения и найдёт суждение по своему желанию». Возможно, в его основе лежал иной еврейский текст либо еврейская текстовая традиция была повреждена.'
    reason: textual_variant
  - marker: b
    text: 'Или: «глотка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל מאכל
  choice: всякую пищу
  rationale: 'Сочетание выражает всеобщность: горло принимает пищу всякого рода. В русском естественно звучит «всякую пищу».'
- source_word: אוכל
  choice: принимает
  rationale: Буквально глагол значит «ест», однако по-русски о горле естественнее сказать «принимает пищу»; это сохраняет образ органа, через который проходит еда, без смыслового усиления.
- source_word: גרגרת
  choice: горло
  rationale: Слово обозначает горло или глотку. «Горло» понятно современному читателю и не сужает значение до вкусового восприятия.
- source_word: אך
  choice: но
  rationale: Частица вводит контраст между общей способностью принимать пищу и различием в её приятности.
- source_word: יש אכל מאכל נעים
  choice: одна пища приятнее другой
  rationale: Сохранившаяся еврейская формулировка кратка и неровна. Русская сравнительная конструкция естественно передаёт подразумеваемое сопоставление разных видов пищи.
theological_decisions:
- issue: Существенное расхождение еврейского и греческого текста
  choice: Основной перевод следует данному еврейскому тексту, а греческое разночтение отмечено в сноске.
  alternative: 'Перевести греческий текст: «Грешный человек уклонится от обличения и найдёт суждение по своему желанию».'
  rationale: Еврейский источник указан как основной и имеет высокую степень уверенности, однако совершенно иное греческое чтение важно сохранить для текстологической прозрачности, не смешивая две традиции в основном тексте.
translation_notes:
  register: Современный литературный русский язык; форма краткого мудрого изречения сохранена. «Принимает пищу» выбрано вместо неестественного олицетворённого «ест», при этом образ горла остаётся явным. Маркеры сносок размещены непосредственно после слова «пищу» в порядке, соответствующем предоставленному консультационному тексту.
