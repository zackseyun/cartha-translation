translation:
  language: ru
  text: Услышь молитву рабов Твоих — по Твоему благоволению к Твоему народу.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по Твоей воле». Еврейское רצון может означать как волю, так и благоволение или благорасположение; здесь выражение «к Твоему народу» позволяет понять его как благосклонное расположение.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая текстовая традиция в этом стихе значительно отличается: «Ищущий закона будет исполнен им, а лицемер преткнётся в нём». Это указывает на существенное расхождение между сохранившимися еврейской и греческой формами текста Книги Сираха.'
    reason: textual_variant
lexical_decisions:
- source_word: תשמע
  choice: Услышь
  rationale: Форма имперфекта в молитвенном обращении выражает просьбу; русский повелительный глагол естественно передаёт эту функцию.
- source_word: תפלת
  choice: молитву
  rationale: Сохранено единственное число еврейского существительного в сопряжённой форме.
- source_word: עבדיך
  choice: рабов Твоих
  rationale: В обращённой к Богу молитве «рабы Твои» — устойчивое и достойное обозначение тех, кто Ему служит; здесь выражение не акцентирует социальное рабство.
- source_word: כרצונך
  choice: по Твоему благоволению
  rationale: רצון допускает значения «воля», «благоволение», «благорасположение». В сочетании с последующим «к Твоему народу» особенно уместен смысл благосклонного расположения.
- source_word: על
  choice: к
  rationale: При существительном «благоволение» русский предлог «к» естественно передаёт направленность расположения на народ.
- source_word: עמך
  choice: Твоему народу
  rationale: Прямо сохраняется коллективное и заветное обозначение, без добавочной конфессиональной конкретизации.
theological_decisions:
- issue: Передача עבדיך в обращении к Богу
  choice: рабов Твоих
  alternative: слуг Твоих
  rationale: В современном литературном русском молитвенное «рабы Твои» сохраняет смысл смиренного служения и принадлежности Богу. В данном контексте оно не утверждает социально-правовой статус порабощённых людей.
- issue: Значение כרצונך
  choice: по Твоему благоволению
  alternative: по Твоей воле
  rationale: «Благоволение» передаёт вероятный благосклонный, реляционный оттенок רצון, однако возможное значение «воля» сохранено в примечании, чтобы не устранять подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного обращения. Заглавные местоимения сохраняют традиционную почтительность при обращении к Богу; тире делает связь между просьбой и основанием естественной и ясной.
