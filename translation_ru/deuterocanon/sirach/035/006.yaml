  text: Пробуди гнев и излей ярость[a], смири противника и отбрось врага.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий параллельный текст здесь резко отличается: в нём говорится об изумрудной печати в золотом изделии и о мелодии при приятном вине. Здесь принят хорошо засвидетельствованный еврейский текст Каирской генизы.'
    reason: textual_variant
lexical_decisions:
- source_word: העיר
  choice: Пробуди
  rationale: Повелительная форма каузативного значения передаёт призыв привести гнев в действие; «пробуди» сохраняет образ и высокий, но современный молитвенный регистр.
- source_word: אף
  choice: гнев
  rationale: Буквально слово может означать «нос», но устойчиво обозначает гнев; перевод отличает его от более сильного חמה.
- source_word: ושפוך
  choice: и излей
  rationale: Сохраняется конкретный образ שפך — «лить, изливать», характерный для речи о суде.
- source_word: חמה
  choice: ярость
  rationale: Слово обозначает жар, неистовство или яростный гнев; «ярость» передаёт усиление по отношению к אף, не сливая оба слова.
- source_word: והכניע
  choice: смири
  rationale: כנע означает смирить, покорить, низложить; «смири» сохраняет мотив унижения противника и параллелизм.
- source_word: צר
  choice: притеснителя
  rationale: צר может обозначать врага, противника или притеснителя. «Притеснитель» естественно различает его с последующим אויב и отражает враждебное давление.
- source_word: והדוף
  choice: и отрази
  rationale: הדף значит оттолкнуть, отбросить, дать отпор; «отрази» кратко и естественно передаёт военную силу глагола.
- source_word: אויב
  choice: врага
  rationale: Обычное обозначение врага; сохранено как кульминационный объект второго параллельного призыва.
theological_decisions:
- issue: Адресат и подразумеваемое подлежащее повелительных форм
  choice: Стих передан как прямое прошение к Богу во втором лице, без добавления Его имени или обращения.
  alternative: Общее побуждение без определённого адресата.
  rationale: В еврейском тексте подлежащее не выражено, однако контекст представляет эти повелительные формы как молитву к Богу. Русские формы второго лица сохраняют это, не добавляя отсутствующих в стихе слов.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-поэтической речи. Сохранены четыре повелительных глагола, параллелизм двух пар и различие между אף и חמה; архаизмы и конфессионально окрашенные добавления исключены.
