lexical_decisions:
- source_word: כל מאכל
  choice: всякая пища
  rationale: Сочетание כל с существительным в единственном числе выражает распределительную всеобщность; «всякая пища» естественно передаёт общий характер утверждения.
- source_word: תסגר
  choice: оказывается заключённой
  rationale: Передаёт страдательное значение и сохраняет конкретный образ пищи, заключённой внутри, не сводя выражение просто к попаданию в желудок.
- source_word: בבטן
  choice: в желудке
  rationale: В контексте еды בטן обозначает орган пищеварения. Современное «желудок» здесь яснее, чем более широкое «живот» или архаическое «чрево».
- source_word: אך
  choice: но
  rationale: Союз обозначает противопоставление общей участи всякой пищи различию в её приятности.
- source_word: יש מאכל ממאכל
  choice: одна пища… другой
  rationale: Сжатая еврейская конструкция выражает сравнение; русская сравнительная конструкция сохраняет смысл без добавления слова «вид».
- source_word: תנעם
  choice: приятнее
  rationale: Корень נעם обозначает приятность, усладу или привлекательность; «приятнее» сохраняет широту значения и не ограничивает его сладостью.
