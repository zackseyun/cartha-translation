  text: A woman’s beauty brightens the face[a], and it surpasses every delight of the eye.
translation:
  language: ru
  text: Красота женщины озаряет лицо[a] и превосходит всё, что услаждает глаз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте — существенно иное чтение: «Во всяком деле доверяй своей душе, ибо и это — соблюдение заповедей».'
    reason: alternative_reading
lexical_decisions:
- source_word: תאר
  choice: красота
  rationale: Существительное обозначает внешний облик, стройность или привлекательность; в сочетании с «женщиной» слово «красота» естественно передаёт смысл, не сводя его только к телосложению.
- source_word: יחליץ פנים
  choice: озаряет лицо
  rationale: Трудное еврейское выражение описывает заметное положительное воздействие на лицо. «Озаряет лицо» звучит естественно по-русски и сохраняет образ, не уточняя без основания, чьё именно это лицо.
- source_word: מחמד עין
  choice: всё, что услаждает глаз
  rationale: Выражение буквально указывает на желанное или приятное для глаза. Такой перевод сохраняет одновременно зрительный образ и значение удовольствия.
- source_word: יגבר
  choice: превосходит
  rationale: Глагол означает «быть сильнее», «одолевать», «преобладать»; в данном поэтическом сравнении «превосходит» ясно передаёт превосходство.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческой версии
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству, а иное греческое чтение приведено в сноске.
  alternative: 'Следовать греческому чтению: «Во всяком деле доверяй своей душе, ибо и это — соблюдение заповедей».'
  rationale: При наличии еврейского текста Сираха он служит первичным источником. Поскольку греческая версия содержит совершенно иную строку, её нельзя незаметно смешивать с еврейской, но существенное расхождение необходимо сохранить для читателя.
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим параллелизмом. Формулировка достойная и понятная; неоднозначность относительно того, чьё лицо озаряет красота, намеренно не устранена.
