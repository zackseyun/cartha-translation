    reason: lexical_alternative
lexical_decisions:
- source_word: הרף
  choice: порази
  rationale: 'В контексте обращения к Богу и последующего упоминания видимых могущественных дел передано как призыв выступить против чужого народа. При этом форма в сохранившемся еврейском свидетельстве необычна: обычное значение корня связано с ослаблением или прекращением действия, поэтому неопределённость прямо отмечена в сноске.'
- source_word: על
  choice: на / против
  rationale: После глагола в принятом контекстуальном прочтении предлог обозначает направленность действия против народа; в русском это естественно выражено конструкцией «порази народ» без отдельного перевода предлога.
- source_word: עם נכר
  choice: чужой народ
  rationale: Сохраняется собирательное значение עם «народ», а נכר передаёт принадлежность к иному, чужому народу. «Чужой народ» звучит естественно и не превращает коллективное обозначение в отдельных «чужеземцев».
- source_word: ויראו
  choice: и пусть они увидят
  rationale: Префиксальная форма после повеления понята как волевая последовательность, а не как простое предсказание будущего.
- source_word: גבורתיך
  choice: Твои могущественные дела
  rationale: Множественная форма указывает на явленные действия силы, которые можно увидеть, а не только на отвлечённое могущество.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста с греческой параллелью
  choice: Основной текст переведён по еврейскому свидетельству, а существенное расхождение с греческим отмечено в сноске.
  alternative: Перевод по греческому тексту говорил бы о заботе о присутствующих, возлежании и получении венца.
  rationale: При наличии еврейского свидетельства оно остаётся первичным; резко отличающийся греческий текст нельзя молча согласовывать с ним.
- issue: Неопределённость повелительной формы הרף
  choice: В основном тексте принято контекстуальное «порази», но неоднозначность сохранённого еврейского чтения раскрыта в сноске.
  alternative: «Ослабь натиск на чужой народ», «оставь чужой народ в покое» или «будь спокоен по отношению к чужому народу».
  rationale: Контекст ожидает явления Божьей силы перед чужим народом, однако обычный смысл еврейского корня не позволяет скрыть противоположно направленные лексические возможности.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным молитвенным звучанием. Местоимение «Твои» написано с прописной буквы как обращение к Богу. Необычность и смысловое напряжение еврейской формы не устранены молча, а вынесены в сноску.
