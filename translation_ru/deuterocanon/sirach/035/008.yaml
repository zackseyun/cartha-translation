lexical_decisions:
- source_word: השבת ראש פאתי מואב
  choice: Подведи итог своей речи; немногими словами скажи многое
  rationale: 'Сохранившийся еврейский текст в этой части труден и, по-видимому, местами повреждён: буквальное чтение не даёт связного смысла. Перевод следует ясному греческому параллельному тексту κεφαλαίωσον λόγον, ἐν ὀλίγοις πολλά, который, вероятно, сохраняет смысл наставления о краткой и содержательной речи.'
- source_word: κεφαλαίωσον λόγον
  choice: Подведи итог своей речи
  rationale: Глагол κεφαλαιόω означает «сводить к главному, подытоживать». Русское выражение естественно передаёт повеление кратко изложить основную мысль.
- source_word: ἐν ὀλίγοις πολλά
  choice: немногими словами скажи многое
  rationale: 'Буквально: «в немногом — многое». Добавление «словами» раскрывает подразумеваемую греческую идиому без изменения её смысла.'
- source_word: γίνου ὡς γινώσκων
  choice: Будь как тот, кто знает
  rationale: Передаёт повеление и сравнительную конструкцию прямо, сохраняя лаконичность текста Премудрости.
- source_word: ἅμα σιωπῶν
  choice: но молчит
  rationale: Греческое выражение буквально означает «одновременно молчащий». Союз «но» естественно подчёркивает намеренное напряжение между знанием и сдержанным молчанием.
