  yaml_path: translation/deuterocanon/sirach/035/038.yaml
  text: Assign him work as is fitting for him; and if he does not obey[a], make his fetters heavy. But do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: ru
  text: Поручи ему работу, какая ему подобает; а если он не повинуется, утяжели его оковы. Но ни с кем[a] не переходи меры и ничего не делай без рассуждения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со всякой плотью», то есть с любым человеком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: Поручи ему работу
  rationale: Оборот καθίστημι с εἰς и винительным падежом означает назначение на дело или постановку к работе; русский вариант естественно передаёт повелительную силу.
- source_word: καθὼς πρέπει αὐτῷ
  choice: какая ему подобает
  rationale: πρέπει обозначает то, что подходит или приличествует; «подобает» сохраняет оттенок должной уместности и остаётся понятно в литературной речи.
- source_word: κἂν μὴ πειθαρχῇ
  choice: а если он не повинуется
  rationale: πειθαρχέω означает повиноваться власти или установленному порядку; прямого слова «дисциплина» в греческом тексте нет.
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: утяжели его оковы
  rationale: πέδαι — оковы, прежде всего ножные; формулировка близка к буквальному образу и не добавляет отсутствующих деталей.
- source_word: μὴ περισσεύσῃς
  choice: не переходи меры
  rationale: В данном увещании περισσεύω указывает на превышение надлежащей меры; идиоматический русский оборот яснее, чем буквальное «не излишествуй».
- source_word: ἐν πάσῃ σαρκί
  choice: ни с кем
  rationale: Буквально «со всякой плотью»; в контексте σάρξ обозначает любого человека. В основном тексте выбран естественный русский эквивалент, а конкретный образ сохранён в сноске.
- source_word: ἄνευ κρίσεως
  choice: без рассуждения
  rationale: κρίσις допускает значения суда, суждения и рассудительного решения. «Без рассуждения» сохраняет практический смысл обдуманной и справедливой оценки, не сужая его до формального суда.
- source_word: μὴ ποιήσῃς μηδέν
  choice: ничего не делай
  rationale: Греческое отрицательное построение передаёт всеобщий запрет; русский порядок слов звучит естественно и сохраняет категоричность.
theological_decisions:
- issue: Передача σάρξ в наставлении о мере строгости
  choice: ни с кем
  alternative: ни с какой плотью
  rationale: Здесь «плоть» по смыслу обозначает человека вообще. Буквальная калька в современном русском неестественна и может затруднить понимание, поэтому антропологический образ отмечен в сноске, а основной текст передаёт контекстуальный смысл.
- issue: Значение κρίσις
  choice: рассуждение
  alternative: суд / справедливое решение
  rationale: Греческое слово сохраняет напряжение между рассудительностью, оценкой и судебной справедливостью. «Рассуждение» не превращает наставление исключительно в юридическое предписание; альтернативные оттенки указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительной мудрой речи. Синтаксис краткий и повелительный; архаические кальки устранены, а конкретный образ σάρξ сохранён в сноске.
