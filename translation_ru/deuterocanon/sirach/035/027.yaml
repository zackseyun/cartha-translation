  source_fidelity: В основной строке верно сохранены сравнение «так и», образ «гнезда» и мотив ночного отдыха. Однако «там, где застанет его вечер» превращает еврейское כאשר יערב («когда / как наступает вечер») в явно пространственное «где бы ни…». Такая оттеночная экспликация возможна в английском аудите, но непосредственно еврейским текстом не выражена и при текстуальной неопределённости строки лучше её не закреплять.
  naturalness: Фраза в целом литературна, но «устраивается на покой» несколько тяжелее и активнее, чем требуется для неопределённого причастия. «Отдыхает, когда наступает вечер» естественно, кратко и сохраняет образный, притчевый тон.
  terminology: '«Гнездо» следует сохранить в тексте; сноска «или: нет дома» уместно объясняет метафорическое значение. Текстологическая сноска правильно отмечает расхождение греческой традиции; формулировку о ненадёжности сохранившегося текста можно сделать осторожнее, не утверждая больше, чем позволяют фрагментарность и краткость еврейской строки.'
