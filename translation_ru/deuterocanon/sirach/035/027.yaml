    reason: lexical_alternative
lexical_decisions:
- source_word: כן
  choice: Так и
  rationale: Передаёт вводимое еврейским словом уподобление и сохраняет связь с предшествующим образом.
- source_word: איש
  choice: человек
  rationale: Естественно передаёт единичного представителя человеческого рода; грамматическая форма и контекст не требуют более узкого слова «мужчина».
- source_word: אשר לא קן
  choice: у которого нет гнезда
  rationale: Сохраняет буквальный образ קן («гнездо»), не подменяя его истолковывающим «дом» или «пристанище».
- source_word: המרגיע
  choice: устраивается на покой
  rationale: Передаёт причастную форму, связанную с успокоением и отдыхом, естественным русским выражением и не делает из неясной формы чрезмерно точного грамматического вывода.
- source_word: כאשר יערב
  choice: там, где застанет его вечер
  rationale: В контексте отсутствия постоянного пристанища выражение указывает не только на время, но и на случайное место ночлега; формулировка сохраняет эту подразумеваемую пространственную окраску.
