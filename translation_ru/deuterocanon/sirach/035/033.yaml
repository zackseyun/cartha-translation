  text: Fodder and a stick and loads are for a donkey[c][b][a]; bread and discipline and work are for a servant.
translation:
  language: ru
  text: Корм, палка[a] и грузы — ослу; хлеб, дисциплина[b] и работа — домашнему рабу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прут»; греческое ῥάβδος может также означать «жезл».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «воспитание», «обучение» или «наставление».'
    reason: lexical_alternative
  - marker: c
    text: 'Греческое οἰκέτης обозначает домашнего раба или слугу; возможный перевод: «домашнему слуге».'
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: корм
  rationale: Множественная форма обозначает пищу для животного; собирательное «корм» естественно звучит по-русски и сохраняет конкретный смысл.
- source_word: ῥάβδος
  choice: палка
  rationale: Слово может означать палку, прут или жезл. В перечне средств обращения с ослом «палка» передаёт предметный смысл без излишне высокого стиля.
- source_word: φορτία
  choice: поклажа
  rationale: Речь идёт о грузе, который несёт вьючное животное. «Поклажа» конкретна и хорошо соответствует образу осла.
- source_word: ὄνῳ
  choice: ослу
  rationale: Дательный падеж сохраняет лаконичную именную конструкцию греческого текста и выражает предназначение перечисленного.
- source_word: ἄρτος
  choice: хлеб
  rationale: Прямое соответствие греческому слову; обобщать его до «пищи» здесь нет необходимости.
- source_word: παιδεία
  choice: дисциплина
  rationale: В данном бытовом перечне слово включает приучение к порядку, наставление и исправление; «дисциплина» сохраняет эту широту лучше, чем одно лишь «обучение».
- source_word: ἔργον
  choice: работа
  rationale: Простое и современное обозначение труда в домашнем хозяйстве.
- source_word: οἰκέτῃ
  choice: домашнему рабу
  rationale: οἰκέτης обозначает раба или зависимого слугу, принадлежащего к домашнему хозяйству. Перевод сохраняет и бытовую сферу, и несвободный статус человека.
theological_decisions:
- issue: Передача социального статуса οἰκέτης
  choice: домашнему рабу
  alternative: слуге; домашнему слуге
  rationale: Контекст говорит об управлении зависимым домашним работником. «Раб» не смягчает историческую социальную асимметрию, а определение «домашний» передаёт специфику οἰκέτης; примечание сохраняет менее явный вариант «слуга».
- issue: Смысл παιδεία в параллели с хлебом и работой
  choice: дисциплина
  alternative: воспитание; обучение; наставление
  rationale: Греческое слово допускает как обучение, так и исправительное воспитание. В этом контексте «дисциплина» естественно охватывает приучение и коррекцию, не уточняя конкретный способ воздействия.
translation_notes:
  register: Лаконичная, пословичная фраза передана двумя параллельными именными частями с тире и без добавленного сказуемого. Лексика современная и понятная, но сохраняет достоинство и резкость исходного социального образа.
