  text: And again[a], if there is healing for the tongue[b], it is not among human beings.
translation:
  language: ru
  text: Кто доверяет Закону, тот внимает заповедям, и кто полагается на Господа, тот не будет умалён.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившаяся еврейская строка в предоставленном каирском рукописном свидетельстве, по-видимому, повреждена или не соответствует этому стиху. Поэтому перевод следует связному греческому чтению: «Кто доверяет Закону, тот внимает заповедям, и кто полагается на Господа, тот не будет умалён».'
    reason: textual_variant
  - marker: b
    text: «Не будет умалён» можно также передать как «не будет унижен» или, более истолковательно, «не потерпит недостатка».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων / ὁ πεποιθὼς
  choice: кто доверяет / кто полагается
  rationale: Оба выражения передают деятельное упование. Небольшое варьирование делает русский текст естественным, не превращая доверие лишь в интеллектуальное согласие.
- source_word: νόμῳ
  choice: Закону
  rationale: В контексте Премудрости Иисуса, сына Сирахова, речь идёт о Торе как о данном Богом Законе; прописная буква ясно передаёт это значение.
- source_word: προσέχει
  choice: внимает
  rationale: Глагол означает направлять внимание, прислушиваться. «Внимает» сохраняет эту точность и не усиливает смысл до полного исполнения, как могло бы сделать «соблюдает».
- source_word: ἐντολαῖς
  choice: заповедям
  rationale: Это обычный и точный русский эквивалент в религиозно-нравственном контексте.
- source_word: Κυρίῳ
  choice: Господа
  rationale: Стандартная передача греческого обозначения Бога κύριος в данном контексте.
- source_word: οὐκ ἐλαττωθήσεται
  choice: не будет умалён
  rationale: Формально передаёт будущее страдательное значение ἐλαττόω — «сделать меньшим, умалить», не устраняя возможные оттенки унижения, ущерба или недостатка.
theological_decisions:
- issue: Сохранившаяся еврейская строка не соответствует данному стиху по содержанию и отмечена как текстуально несовпадающая.
  choice: Перевести связное чтение греческого параллельного текста и открыто отметить расхождение в сноске.
  alternative: 'Перевести буквально сохранившуюся еврейскую строку: «И ещё, если есть исцеление для языка, его нет среди людей».'
  rationale: Еврейская строка, вероятно, попала сюда вследствие повреждения или несовпадения рукописного материала, тогда как греческий текст даёт связное чтение для Сир 35:24. Выбор греческого чтения сохраняет стих в его засвидетельствованной форме, а сноска честно сообщает об источниковой неопределённости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Внимает» и «не будет умалён» сохраняют достоинство и смысловую широту оригинала; синтаксис остаётся ясным для обычного читателя.
