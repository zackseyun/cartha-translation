  source_fidelity: 'Русский текст точно следует связному греческому параллельному чтению: πιστεύων/πεποιθώς переданы как «доверяет/полагается», νόμῳ — «Закону», προσέχει ἐντολαῖς — «внимает заповедям», а οὐκ ἐλαττωθήσεται сохраняет пассивную и намеренно широкую формулировку «не будет умалён». Сноска честно объясняет, что сохранившаяся еврейская строка не соответствует данному месту, не выдавая греческое чтение за перевод этой строки.'
