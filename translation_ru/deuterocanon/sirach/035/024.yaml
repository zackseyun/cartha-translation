  terminology: '«Закон», «заповеди» и «Господь» последовательны и уместны в контексте Сираха. Различение «доверяет» и «полагается» допустимо: оно не создаёт смыслового противопоставления, которого нет в греческом, а делает параллельную конструкцию естественной по-русски.'
