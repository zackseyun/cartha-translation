  text: Where[a] there is listening[b], do not pour out speech, and do not show off wisdom[c] at the wrong time.
translation:
  language: ru
  text: Когда[a] идёт слушание[b], не изливай речей и не изображай мудреца некстати[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленное еврейское свидетельство, по-видимому, ошибочно отнесено к Сир. 35:4; поэтому перевод следует греческому параллельному тексту, который предостерегает от многословия и несвоевременного изображения мудрости.
    reason: textual_variant
  - marker: b
    text: 'Или: «Там, где есть слушатели». Греческое слово может обозначать как слушание, так и аудиторию.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не выказывай мудрости не вовремя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: там, где
  rationale: Передаёт обстоятельственное значение греческого наречия естественным для современного русского оборотом.
- source_word: ἀκρόαμα
  choice: слушают
  rationale: Сохраняет значение слушания и не сужает его до формально собравшейся аудитории; возможное значение «аудитория» отмечено в сноске.
- source_word: μὴ ἐκχέῃς
  choice: не изливай
  rationale: Сохраняет выразительную метафору греческого глагола «выливать, изливать».
- source_word: λαλιάν
  choice: речей
  rationale: Естественно сочетается с «изливай» и передаёт речь, разговор или поток слов в контексте наставления о сдержанности.
- source_word: ἀκαίρως
  choice: когда для неё не время
  rationale: Ясно и естественно передаёт смысл «несвоевременно, некстати», связывая его с демонстрацией мудрости.
- source_word: μὴ σοφίζου
  choice: не выставляй свою мудрость напоказ
  rationale: Передаёт предостережение не казаться мудрецом и не щеголять мудростью, не сводя выражение к запрету быть мудрым.
theological_decisions:
- issue: Выбор исходного свидетельства для данного стиха
  choice: Перевод выполнен по греческому параллельному тексту, поскольку предоставленный еврейский текст не соответствует Сир. 35:4.
  alternative: 'Перевести предоставленный еврейский текст: «И узнают они, как узнали мы, что нет Бога, кроме Тебя».'
  rationale: Еврейская строка явно относится к иному контексту, тогда как греческий текст содержит связное наставление, засвидетельствованное для Сир. 35:4. Расхождение открыто обозначено в сноске, а ошибочно приписанный еврейский текст не выдаётся за текст этого стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным библейской литературе мудрости. Метафора «изливать речи» сохранена, а более разговорное «не умничай» отвергнуто как стилистически сниженное.
