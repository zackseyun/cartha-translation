  text: Put a child to work[a], and you will find rest; leave his hands idle, and he will seek freedom.
translation:
  language: ru
  text: Занимайся ребёнком[a] — и обретёшь покой; развяжи ему руки — и он станет искать свободы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Трудись с ребёнком» или «трудись над ребёнком». Греческое выражение сжато; в данном наставлении оно может подразумевать, что ребёнка следует занимать делом и не оставлять в праздности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: Приучи ребёнка к труду
  rationale: Сжатое греческое выражение буквально допускает смысл «трудись с ребёнком», но в контексте наставления оно побуждает занимать ребёнка работой. Русское «приучи ребёнка к труду» естественно передаёт длительную воспитательную направленность повеления, не усиливая его до принуждения.
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: обретёшь покой
  rationale: ἀνάπαυσις означает покой или облегчение; «обретёшь покой» сохраняет образ и форму следствия в изречении.
- source_word: ἄνες χεῖρας αὐτῷ
  choice: развяжи ему руки
  rationale: Передан буквальный образ ослабления или отпускания рук. Русская идиома может означать предоставление свободы действий, что согласуется с последующим ζητήσει ἐλευθερίαν, хотя возможный смысл безделья пояснён в сноске.
- source_word: ζητήσει ἐλευθερίαν
  choice: он станет искать свободы
  rationale: Сохраняется прямое значение ἐλευθερία — «свобода», без замены на оценочные «своеволие» или «распущенность». Родительный падеж после «искать» естествен для литературного русского языка.
theological_decisions:
- issue: Социально-этический смысл παιδί и ἐλευθερία
  choice: Передать παιδί как «ребёнок», а ἐλευθερία как «свобода», сохраняя наставительный характер домашней мудрости.
  alternative: «Юный слуга» и «самоволие»
  rationale: παιδί прежде всего обозначает ребёнка, хотя может относиться и к юному слуге; ближайший контекст допускает воспитательное прочтение. Перевод «свобода» сохраняет лексическую и этическую напряжённость текста и не подменяет её отрицательной интерпретацией.
translation_notes:
  register: Современный литературный русский язык с достоинством мудрого изречения. Параллелизм двух частей сохранён; конкретный образ рук оставлен в основном тексте, а неоднозначность первой строки отмечена в сноске.
