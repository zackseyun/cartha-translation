translation:
  language: ru
  text: Наполни Сион Своим великолепием[a] и Свой храм — Своей славой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этого стиха значительно отличается: «Там играй, исполняй свои замыслы и не согрешай надменным словом». Это указывает на существенное расхождение между греческим свидетельством и сохранившейся еврейской формой.'
    reason: textual_variant
lexical_decisions:
- source_word: מלא
  choice: Наполни
  rationale: Прямо передаёт повелительную форму глагола מלא и естественно вводит оба параллельных дополнения.
- source_word: ציון
  choice: Сион
  rationale: Сохранено собственное название, прямо указанное в еврейском тексте, без замены на более широкое «Иерусалим».
- source_word: הודך
  choice: Своим великолепием
  rationale: הוד обозначает великолепие, величие или сияющую красоту; «великолепие» сохраняет отличие от כבוד во второй части строки.
- source_word: ומכבודך
  choice: а Свой храм — Своей славой
  rationale: Глагол «наполни» во второй части подразумевается; מ־ контекстуально передано как указание на то, чем наполняется храм. Союз «а» естественно оформляет русский поэтический параллелизм без противопоставления.
- source_word: היכלך
  choice: Свой храм
  rationale: В сочетании с Сионом היכל означает Божий храм, а не дворец; возвратное «Свой» согласуется с обращением к Богу.
- source_word: כבודך
  choice: Своей славой
  rationale: «Слава» — точное и привычное в данном молитвенном контексте соответствие כבוד.
theological_decisions:
- issue: Различение הוד и כבוד
  choice: הוד передано как «великолепие», а כבוד — как «слава»
  alternative: Передать оба слова как «слава» либо הוד как «величие»
  rationale: Еврейский текст использует два близких, но разных слова. Их различение сохраняет поэтическую ткань и не добавляет богословских уточнений.
- issue: Выбор основного текстового свидетельства
  choice: Основной текст переведён по сохранившейся еврейской строке
  alternative: Следовать существенно отличающемуся греческому чтению
  rationale: При наличии еврейского текста Сираха он служит первичным свидетельством. Греческий текст отражает здесь иную текстовую форму, поэтому его расхождение отмечено в сноске, а не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической сдержанностью. Местоимения, относящиеся к Богу, написаны с прописной буквы. Эллипсис второго полустишия сохранён с помощью тире; лексическое различие между הוד и כבוד передано без искусственного усложнения.
