translation:
  language: ru
  text: Коварное сердце приносит печаль, а опытный человек воздаст ему тем же.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная часть стиха неясна. Буквально еврейский текст можно передать приблизительно так: «и опытный человек возвратит её в нём / им». Женский суффикс, вероятно, относится к «печали», но значение последнего выражения остаётся спорным. Возможные переводы: «ответит на это тем же» или «воздаст ему соответственно».'
    reason: alternative_reading
  - marker: b
    text: 'Греческий параллельный текст значительно отличается: «Не доверяй дороге, на которой не спотыкаются». Он может отражать иной еврейский исходный текст или повреждение текстовой традиции.'
    reason: textual_variant
lexical_decisions:
- source_word: לב עקוב
  choice: коварное сердце
  rationale: «Сердце» сохраняет обычное для еврейской литературы мудрости обозначение внутреннего человека, его мыслей и намерений; «коварное» передаёт нравственную искривлённость עקוב естественным современным русским языком.
- source_word: יתן עצבת
  choice: приносит печаль
  rationale: Буквальное «даёт печаль» имеет причинный смысл; «приносит печаль» звучит естественно и не усиливает значение сверх исходного текста.
- source_word: איש ותיק
  choice: опытный человек
  rationale: ותיק обозначает испытанного, зрелого, опытного человека. Русское «опытный человек» ясно и соответствует литературному регистру; איש здесь не требует искусственного подчёркивания пола.
- source_word: ישיבנה בו
  choice: воздаст ему тем же
  rationale: Трудная краткая конструкция допускает значения возвращения, ответа или воздаяния. Выбранный вариант естественно выражает вероятную взаимную направленность, не скрывая неопределённости, отмеченной в сноске.
theological_decisions:
- issue: Неясная местоименная конструкция в заключительной части
  choice: воздаст ему тем же
  alternative: ответит на это подобным образом; возвратит это ему
  rationale: Еврейский текст синтаксически сжат и допускает несколько соотнесений суффиксов. Основной текст передаёт вероятный смысл ответного воздаяния, а альтернативы сохраняются в примечании.
- issue: Существенное расхождение с греческим параллельным текстом
  choice: следовать сохранившемуся еврейскому тексту
  alternative: «Не доверяй дороге, на которой не спотыкаются»
  rationale: При высокой уверенности в представленном еврейском чтении оно служит основой перевода; резко отличающийся греческий текст отмечается как свидетельство иной Vorlage или повреждения текстовой традиции.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического изречения. Перевод основан прежде всего на еврейском тексте; неоднозначность финальной фразы и расхождение с греческой традицией вынесены в сноски.
