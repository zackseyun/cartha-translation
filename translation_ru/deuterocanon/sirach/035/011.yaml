lexical_decisions:
- source_word: רחם
  choice: Помилуй
  rationale: Повелительная форма выражает прямую молитвенную просьбу о сострадательной милости; «помилуй» естественно и сохраняет возвышенный библейский тон.
- source_word: קרית קדשך
  choice: город Твоей святости
  rationale: Передаёт сжатую генитивную конструкцию буквально, не уточняя без необходимости, имеется ли в виду святой город вообще или город Божьего святилища.
- source_word: ירושלים
  choice: Иерусалим
  rationale: Устоявшаяся русская форма топонима.
- source_word: מכון שבתך
  choice: утверждённое место Твоего пребывания
  rationale: «Утверждённое место» сохраняет значение מכון как установленного, прочного места, а «Твоего пребывания» отдельно передаёт שבתך, не сливая два элемента.
theological_decisions:
- issue: Как понимать сжатое выражение קדשך
  choice: город Твоей святости
  alternative: Твой святой город; город Твоего святилища
  rationale: Основной текст сохраняет абстрактный генитив еврейского оригинала и не решает скрытую в нём неоднозначность; более естественные и более толковательные варианты указаны в сноске.
- issue: Соотношение сохранившегося еврейского текста и существенно отличающейся греческой параллели
  choice: Основной текст переведён с еврейского; греческое разночтение отмечено в сноске.
  alternative: Следовать греческой параллели или составить смешанный текст
  rationale: При наличии надёжного еврейского свидетельства оно имеет приоритет; существенно иной греческий текст следует сохранить как прозрачное текстологическое примечание, а не гармонизировать с еврейским.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Прописные формы «Твоей» и «Твоего» подчёркивают обращение к Богу по принятой русской религиозной письменной традиции. Тире делает приложение «Иерусалим» ясным без утяжеления синтаксиса.
