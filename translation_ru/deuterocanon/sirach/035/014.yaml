  text: Give the recompense of those who wait for you[b][a], and let your prophets be found faithful.
translation:
  language: ru
  text: Даруй воздаяние ожидающим Тебя[a], и да будут признаны верными пророки Твои.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надеющимся на Тебя». Еврейский глагол может выражать и ожидание, и надежду.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст здесь читается совсем иначе: «Боящийся Господа примет наставление, и встающие рано обретут благоволение». Вероятно, это отражает иную форму текста.'
    reason: alternative_reading
lexical_decisions:
- source_word: תן
  choice: Даруй
  rationale: Повелительная форма נתן в обращённой к Богу просьбе. «Даруй» естественно для молитвенного контекста и сохраняет достойный, но понятный современный регистр.
- source_word: פעלת
  choice: воздаяние
  rationale: Существительное может обозначать дело, результат действия или воздаяние. В данном контексте просьбы о Божьем ответе ожидающим Его «воздаяние» передаёт вероятный бенефактивный смысл, не уточняя, награда это или иное ответное деяние Бога.
- source_word: קוויך
  choice: ожидающим Тебя
  rationale: Причастная форма от קוה совмещает значения ожидания и надежды. Основной текст сохраняет образ ожидания, а смысл «надеющимся на Тебя» отмечен в сноске.
- source_word: ונביאיך
  choice: и ... пророки Твои
  rationale: Прямо передаёт форму со значением «и Твои пророки»; постпозиция местоимения соответствует dignified literary Russian.
- source_word: יאמנו
  choice: да будут признаны верными
  rationale: Форма от אמן здесь допускает значения подтверждения, удостоверения и обнаружения истинности или надёжности. Формулировка передаёт публичное оправдание истинности пророков, не сводя смысл исключительно к их личной верности.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческого параллельного чтения
  choice: Основной текст переведён по еврейскому чтению как просьба о воздаянии ожидающим Бога и подтверждении Его пророков.
  alternative: 'Греческий текст имеет иной смысл: «Боящийся Господа примет наставление, и встающие рано обретут благоволение».'
  rationale: При наличии еврейского текста Сираха он служит главным источником. Греческое чтение существенно отличается и, вероятно, представляет иную текстовую форму; поэтому оно приведено в сноске, а не объединено с еврейским чтением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Формы «Даруй» и «да будут» уместны в обращении к Богу, но остаются понятными современному читателю. Заглавные буквы в местоимениях, относящихся к Богу, выдержаны последовательно в рамках стиха.
