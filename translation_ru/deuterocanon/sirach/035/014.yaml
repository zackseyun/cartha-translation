  source_fidelity: 'Основной текст точно следует сохранившемуся еврейскому чтению: תן передано как молитвенное «Даруй»; פעלת — как «воздаяние» в допустимом контекстуальном значении; קוויך — «ожидающим Тебя» с надлежащей альтернативой «надеющимся»; ונביאיך — «пророки Твои»; יאמנו — «да будут признаны верными». Существенно расходящееся греческое чтение не смешано с еврейским текстом и корректно вынесено в сноску.'
