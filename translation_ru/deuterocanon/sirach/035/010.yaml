  yaml_path: translation/deuterocanon/sirach/035/010.yaml
  text: Have mercy on the people called by your name[a], on Israel, your firstborn[c][b], whom you acquired.
translation:
  language: ru
  text: Смилуйся над народом, носящим Твоё имя[a], — над Израилем, первенцем, которого Ты приобрёл[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «названным Твоим именем». Этот еврейский оборот обозначает народ, принадлежащий Богу и связанный с Ним.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которым Ты владеешь», «которого Ты купил»; возможно также: «которого Ты создал». Еврейский глагол допускает несколько близких значений.'
    reason: alternative_reading
  - marker: c
    text: В греческом тексте здесь стоит существенно иная строка, отражающая другую текстовую традицию. Настоящий перевод следует сохранившемуся еврейскому тексту.
    reason: textual_variant
lexical_decisions:
- source_word: רַחֵם
  choice: Смилуйся
  rationale: Повелительная форма глагола רחם выражает просьбу о деятельном сострадании. «Смилуйся» естественно звучит в русской молитвенной речи и сохраняет вес исходного выражения.
- source_word: עַל־עָם
  choice: над народом
  rationale: עם — собирательное существительное в единственном числе. Притяжательное местоимение в еврейском тексте отсутствует, поэтому не добавлено «Твоим народом».
- source_word: נִקְרָא בִּשְׁמֶךָ
  choice: названным Твоим именем
  rationale: Сохранён библейский оборот, указывающий на принадлежность Богу и связь с Ним; более разъяснительный вариант «носящим Твоё имя» вынесен в примечание.
- source_word: יִשְׂרָאֵל
  choice: Израилем
  rationale: Имя собственное передано в принятой русской библейской форме.
- source_word: בְּכוֹר
  choice: первенцем
  rationale: Еврейское существительное означает «первенец». В исходном тексте нет ни слова «сын», ни притяжательного суффикса, поэтому они не добавлены.
- source_word: קָנִיתָה
  choice: Ты приобрёл
  rationale: Глагол קנה может означать приобретение, обладание, покупку, а в отдельных контекстах — сотворение. «Приобрёл» сохраняет широкую идею обретения в собственность, не сводя её ни к покупке, ни к сотворению.
theological_decisions:
- issue: Заветная принадлежность в выражении נִקְרָא בִּשְׁמֶךָ
  choice: 'Сохранить образ: «названным Твоим именем»'
  alternative: «принадлежащим Тебе» или «носящим Твоё имя»
  rationale: Буквальный образ сохраняет заветный и библейский смысл, не заменяя его однозначным толкованием.
- issue: Связь слова בְּכוֹר с Израилем
  choice: «над Израилем, первенцем» без добавления «Твоим» или «сыном»
  alternative: «над Израилем, Твоим первенцем» или «Твоим первородным сыном»
  rationale: Контекст допускает подразумеваемое отношение к Богу, однако соответствующие слова прямо отсутствуют в еврейском тексте; перевод не делает подразумеваемое явным.
- issue: Смысл קָנִיתָה применительно к Израилю
  choice: «которого Ты приобрёл»
  alternative: «которым Ты владеешь», «которого Ты купил» или «которого Ты создал»
  rationale: Выбранный вариант передаёт идею обретения Израиля Богом, сохраняя смысловую широту глагола и не вводя более узкого богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Синтаксический параллелизм еврейского текста сохранён; устаревшее «стяжал» не используется. Прописные буквы в местоимениях обращения к Богу поддерживают традиционный русский библейский регистр.
