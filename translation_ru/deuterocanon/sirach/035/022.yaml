    rationale: Такой перевод заменяет מכה («удар») на «боль» и приписывает תנעם сравнительное значение тяжести, хотя форма непосредственно соотносится с «приятен / сладостен». При текстовой трудности более безопасен буквальный перевод с поясняющим примечанием.
