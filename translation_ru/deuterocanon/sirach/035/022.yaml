lexical_decisions:
- source_word: כל נכה
  choice: любая рана
  rationale: כל понято дистрибутивно, а נכה — как повреждение или рана. Такой порядок слов естественен по-русски и сохраняет общий, афористический характер высказывания.
- source_word: תאכל חיה
  choice: у живого существа может зажить
  rationale: 'Сохранившийся еврейский текст здесь крайне труден: буквальное сочетание допускает понимание со значением «есть, пожирать» и «живое существо», однако в контексте вероятен смысл заживления раны. Перевод передает этот вероятный смысл, не делая его категорическим.'
- source_word: אך
  choice: но
  rationale: Простой противительный союз ясно обозначает поворот ко второй половине изречения.
- source_word: מכה ממכה תנעם
  choice: бывает боль тяжелее боли
  rationale: Форма תנעם и вся заключительная фраза неясны и, вероятно, повреждены. Смысловой перевод сохраняет сравнительную конструкцию и намеренный повтор, выражая различную тяжесть страдания.
