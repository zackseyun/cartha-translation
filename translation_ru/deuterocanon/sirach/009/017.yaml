translation:
  language: ru
  text: Держись подальше от человека, который властен убить[a], и не страшись ужасов смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом свидетельстве здесь находится существенно иное изречение: «Пусть праведные мужи будут твоими сотрапезниками, и пусть страх Господень будет твоей похвалой». Основной текст следует сохранившемуся еврейскому тексту этого стиха.'
    reason: textual_variant
lexical_decisions:
- source_word: רְחַק מֵאִישׁ
  choice: Держись подальше от человека
  rationale: Повелительная форма требует сознательно сохранять дистанцию. «Держись подальше» естественно звучит по-русски и передаёт длительную осторожность; «человек» точно и без излишней архаики передаёт אישׁ в данном наставлении.
- source_word: שַׁלִּיט לַהֲרוֹג
  choice: который властен убить
  rationale: שַׁלִּיט обозначает обладающего властью или реальной силой. Оборот «властен убить» сохраняет связь с инфинитивом לַהֲרוֹג и не сужает смысл до официального правителя или судебной казни.
- source_word: וְאַל תִּפְחַד
  choice: и не страшись
  rationale: Отрицательное повеление передано кратко и достойно. «Не страшись» здесь литературно, понятно современному читателю и сочетается с сильным существительным «ужасы».
- source_word: פַּחֲדֵי מַוֶת
  choice: ужасов смерти
  rationale: Множественное сопряжённое сочетание буквально выражает «страхи/ужасы смерти». Русское «ужасы смерти» сохраняет множественность и напряжённость еврейского выражения.
theological_decisions:
- issue: Существенное расхождение еврейского и греческого свидетелей
  choice: Основной текст переведён по сохранившемуся еврейскому тексту; иное греческое изречение приведено в сноске.
  alternative: 'Греческий текст: «Пусть праведные мужи будут твоими сотрапезниками, и хвались страхом Господним».'
  rationale: В данном стихе еврейский текст сохранился с высокой степенью уверенности, поэтому он служит основанием перевода. Греческое свидетельство содержит не малый вариант, а существенно иное изречение; его нельзя смешивать с еврейским, но необходимо отметить для текстологической прозрачности.
translation_notes:
  register: Современный литературный русский язык с достоинством, присущим библейской книге Премудрости. Формулировка ясна обычному читателю, без конфессионально обусловленных толкований; сохранены резкость повеления и образ «ужасов смерти».
