  text: Do not envy a wicked man[a], for you do not know what his day will be.
translation:
  language: ru
  text: Не завидуй нечестивому человеку[a], ведь ты не знаешь, каким будет его день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь иное изречение: «По мере своих сил считайся с ближними и советуйся с мудрыми».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Не завидуй
  rationale: Глагол קנא в этой конструкции означает зависть к другому человеку; краткая форма естественна для наставления в литературе мудрости.
- source_word: בְּאִישׁ רָשָׁע
  choice: нечестивому человеку
  rationale: איש передаёт единственное число и обозначает человека мужского пола, а רשע в контексте мудрости указывает на нравственно порочного, нечестивого человека.
- source_word: כִּי לֹא תֵּדֵע
  choice: ведь ты не знаешь
  rationale: כִּי вводит основание запрета; «ведь» естественно передаёт причинную связь и сохраняет характер назидательного изречения.
- source_word: מַה יּוֹמוֹ
  choice: каким будет его день
  rationale: 'Буквально: «каков его день». Формулировка сохраняет образ дня и намеренную краткость еврейского текста, не добавляя отсутствующего в оригинале глагола «принесёт» и не истолковывая «день» как «конец».'
theological_decisions:
- issue: Расхождение еврейского и греческого свидетельств
  choice: Основной текст переведён по сохранившемуся еврейскому чтению, а существенно отличающееся греческое чтение приведено в сноске.
  alternative: «По мере сил своих суди о ближних и советуйся с мудрыми».
  rationale: Для Книги Иисуса, сына Сирахова сохранившийся еврейский текст является первичным источником. Греческое свидетельство здесь содержит иное изречение, а не близкий вариант той же фразы, поэтому различие следует открыто отметить, не смешивая два чтения.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой наставления. «Нечестивый» сохраняет нравственно-религиозную окраску רשע; необычный образ «его день» оставлен ради смысловой открытости еврейского текста.
