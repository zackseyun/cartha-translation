  source_fidelity: 'Основной текст следует сохранившемуся еврейскому свидетельству, а не существенно расходящейся греческой версии. Однако еврейские имперфекты в наставительном контексте лучше передать будущим временем: это сохраняет перспективу предостережения, явную в оригинале.'
  naturalness: «Ты ступаешь ... и ходишь» грамматически возможно как обобщающее настоящее, но в данном кратком предупреждении менее точно, чем «ты будешь ступать ... и ходить». «До самой сети» передаёт עַד более естественно для современного литературного русского, чем тяжеловесное «вплоть до сети».
  terminology: «Ловушки» и «сеть» ясно передают פחים и רשת; они сохраняют различие образов. Формула «Знай» уместна для דַּע. В примечании греческое γλωσσώδης точнее передано как «болтливый», а φοβερός — как «внушает страх».
