translation:
  language: ru
  text: 'Знай: ты будешь ступать среди ловушек и ходить до самой сети.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст гласит: «Знай: ты будешь ступать среди ловушек и ходить до самой сети». Греческая традиция этого стиха существенно отличается: «Болтливый человек внушает страх в своём городе, и того, кто опрометчив в речах, возненавидят». Перевод следует сохранившемуся еврейскому тексту как основному свидетельству этого места.'
    reason: textual_variant
lexical_decisions:
- source_word: דַּע
  choice: Знай
  rationale: Прямое повеление от ידע; краткая форма сохраняет наставительный характер еврейского текста.
- source_word: בֵין פַּחִים
  choice: среди западней
  rationale: פַּח обозначает западню или ловушку, а בֵּין во множественном окружении передаёт движение посреди множества опасностей. «Западни» сохраняют образ намеренно расставленных ловушек.
- source_word: תִּצְעָד
  choice: ты ступаешь
  rationale: Глагол צעד означает ступать, делать шаги; настоящее время по-русски естественно выражает предостережение о положении, в котором находится человек, не устраняя оттенка предстоящего действия.
- source_word: וְעַד רֶשֶׁת
  choice: и … вплоть до сети
  rationale: עַד буквально указывает предел — «до, вплоть до», а רֶשֶׁת означает сеть. Сохранён несколько необычный пространственный образ исходного текста без утверждения, что человек уже попался.
- source_word: תִּתְהַלָּךְ
  choice: ходишь
  rationale: Форма хитпаэль глагола הלך здесь передаёт продолжающееся или повторяющееся хождение. «Ходишь» звучит естественно и сохраняет параллелизм со «ступаешь».
