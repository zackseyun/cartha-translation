lexical_decisions:
- source_word: אַל תִּתֵּן ... נַפְשְׁךָ
  choice: Не отдавай себя
  rationale: נפש здесь обозначает самого человека, а не только «душу». Русское «не отдавай себя» естественно передаёт предостережение против полного подчинения страсти.
- source_word: לְזוֹנָה
  choice: блуднице
  rationale: זוֹנָה означает женщину, занимающуюся проституцией. «Блудница» сохраняет точность и достойный библейско-литературный регистр; современное «проститутка» возможно, но звучит более клинически.
- source_word: פֶּן
  choice: чтобы не
  rationale: פן вводит нежелательное последствие. «Чтобы не» естественно выражает предостережение в современном русском языке.
- source_word: תָּסֵב
  choice: растратить
  rationale: Форма указывает на поворот, отведение или утрату имущества; в данном контексте «растратить» ясно передаёт практический итог, не добавляя конкретного механизма потери.
- source_word: נַחֲלָתֶךָ
  choice: своё наследство
  rationale: נחלה может означать наследство, наследственный удел или имущество. «Наследство» сохраняет основной смысл и семейно-имущественный оттенок.
theological_decisions:
- issue: Расхождение между сохранившимся еврейским текстом и значительно более пространным греческим чтением
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству.
  alternative: 'Перевести по-гречески: «Отведи взгляд от красивой женщины и не разглядывай чужой красоты; красота женщины многих ввела в заблуждение, и от неё страсть разгорается, как огонь».'
  rationale: При наличии еврейского текста Сираха он служит основным источником. Греческая форма отражает существенно иной или более полный вариант и потому приводится в примечании, а не смешивается с еврейской строкой.
- issue: Характер возможной потери נחלה
  choice: Сохранить широкое понятие наследства и передать последствие как растрату.
  alternative: «Чтобы не лишиться своего удела» или «чтобы не отвести в сторону своё наследство».
  rationale: Еврейская формулировка допускает оттенки растраты, отчуждения или утраты наследственного имущества. Перевод не уточняет, идёт ли речь о текущем имуществе или наследственном уделе.
translation_notes:
  register: Современный литературный русский язык с краткой назидательной интонацией. «Блудница» выбрана как понятное, точное и стилистически достойное слово; архаическая синтаксическая калька намеренно устранена.
