  text: Не отдавай себя проститутке, чтобы не лишиться своего наследства.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь значительно пространнее: «Отведи взгляд от красивой женщины и не разглядывай чужой красоты; красота женщины многих ввела в заблуждение, и от этого страсть разгорается, как огонь».'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово может означать наследство, наследственный удел или имущество; еврейский глагол допускает смысл отвода, отчуждения или утраты этого достояния.
