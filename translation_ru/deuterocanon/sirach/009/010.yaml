base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/010.yaml
  text: Do not abandon an old friend, for a new one is not equal to him; a new friend is like new wine—when it grows old, you will drink it with gladness.
translation:
  language: ru
  text: 'Не оставляй давнего друга, потому что новый не сравнится с ним. Новый друг — как молодое вино: когда оно выдержится, будешь пить его с радостью.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленная еврейская строка, по-видимому, относится к другому изречению и не соответствует Сир 9:10. Поэтому этот стих переведён по греческому свидетельству.
    reason: textual_variant
lexical_decisions:
- source_word: Μὴ ἐγκαταλίπης
  choice: Не оставляй
  rationale: Передаёт запрет на отказ от длительной дружбы естественным современным русским языком; «не покидай» звучало бы несколько более пространственно или возвышенно.
- source_word: φίλον ἀρχαῖον
  choice: давнего друга
  rationale: ἀρχαῖος здесь обозначает друга, с которым связывает долгая дружба, а не пожилого человека; «давний друг» точно и идиоматично.
- source_word: ὁ γὰρ πρόσφατος οὐκ ἔστιν ἔφισος αὐτῷ
  choice: потому что новый не сравнится с ним
  rationale: Сохраняет явное сопоставление старого и нового друга и естественно передаёт отрицательное равенство ἔφισος.
- source_word: οἶνος νέος φίλος νέος
  choice: Новый друг — как молодое вино
  rationale: Краткое греческое соположение раскрыто как сравнение. Для вина νέος естественно передаётся словом «молодое», тогда как для друга — «новый».
- source_word: ἐὰν παλαιωθῇ
  choice: когда оно выдержится
  rationale: В контексте вина глагол означает созревание с возрастом; «выдержится» естественнее буквального «состарится». Условная форма имеет характер общего житейского правила.
- source_word: μετ’ εὐφροσύνης πίεσαι αὐτόν
  choice: будешь пить его с радостью
  rationale: Сохраняет образ будущего наслаждения вином и прямо передаёт существительное εὐφροσύνη.
theological_decisions:
- issue: Выбор исходного свидетельства для Сир 9:10
  choice: Перевести соответствующий этому стиху греческий текст
  alternative: Перевести предоставленную еврейскую строку как Сир 9:10
  rationale: Предоставленная еврейская строка говорит о красоте женщины и по содержанию относится к другому изречению. Греческое свидетельство содержит общеизвестный текст Сир 9:10 о давнем и новом друге. Несоответствие источников отмечено в сноске, а не скрыто.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Афористическая структура и винный образ сохранены; сравнение, неявное в краткой греческой конструкции, выражено естественно для русского языка.
