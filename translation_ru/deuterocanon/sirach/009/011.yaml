  text: Do not dine with her husband[a], and do not sit drinking with him while drunk.
translation:
  language: ru
  text: Не ешь вместе с её мужем[a] и не садись с ним за стол в пьяном виде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции этот стих читается иначе: «Не завидуй славе грешника, ведь ты не знаешь, какова будет его погибель». Сохранившийся еврейский текст здесь существенно отличается от греческого.'
    reason: alternative_reading
lexical_decisions:
- source_word: עִם בַּעְלָהּ
  choice: вместе с её мужем
  rationale: Предлог עִם выражает совместность, а בַּעְלָהּ в данном контексте означает мужа женщины; местоименный суффикс женского рода сохранён словом «её».
- source_word: אַל תִּטְעָם
  choice: не ешь
  rationale: Глагол буквально связан со вкушением, но в сочетании с указанием на совместность естественно обозначает совместную трапезу. «Не ешь» звучит ясно и без стилистически избыточного уточнения.
- source_word: וְאַל תָּסֵב
  choice: и не садись с ним за стол
  rationale: Глагол обозначает сидение или возлежание за трапезой. Современное русское «садиться за стол» естественно передаёт древний застольный образ.
- source_word: שִׁכּוֹר
  choice: в пьяном виде
  rationale: Слово обозначает состояние опьянения. Безличное обстоятельственное выражение сохраняет некоторую синтаксическую неоднозначность краткой еврейской формулировки и не добавляет отсутствующего в тексте упоминания вина.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческой традиции
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству как предостережение против совместной еды и застолья с мужем женщины.
  alternative: 'Греческий текст: «Не завидуй славе грешника, ведь ты не знаешь, какова будет его погибель».'
  rationale: При наличии надёжно засвидетельствованного еврейского текста он принимается за основу. Радикально отличающееся греческое чтение не смешивается с ним, но приводится в примечании, чтобы честно отразить историю текста.
translation_notes:
  register: Современный литературный русский язык; краткое наставление передано прямо и достойно. Оборот «садись за стол» выбран вместо архаичного «возлежать», а формулировка «в пьяном виде» сохраняет сжатость и некоторую неоднозначность еврейского текста.
