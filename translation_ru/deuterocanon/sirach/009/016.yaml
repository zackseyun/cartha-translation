translation:
  language: ru
  text: Пусть твои мысли будут с разумными, и пусть вся твоя речь будет в Законе Всевышнего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст из Каирской генизы здесь читается иначе: «Не завидуй преуспевающему дерзкому человеку; помни, что до смерти он не останется безнаказанным». По-видимому, этот еврейский свидетель содержит другую или смещённую строку, поэтому основной текст переведён с греческого.'
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ μετὰ συνετῶν
  choice: с рассудительными
  rationale: Греческое συνετῶν обозначает людей, обладающих пониманием и здравым суждением. Субстантивированное «рассудительные» передаёт смысл без указания пола и звучит естественно в современной литературной русской речи.
- source_word: ἔστω ὁ διαλογισμός σου
  choice: пусть твои размышления будут
  rationale: διαλογισμός может означать размышление, рассуждение или мысль. Множественное «размышления» естественно по-русски, а конструкция «пусть… будут» сохраняет побудительную силу ἔστω.
- source_word: πᾶσα διήγησίς σου
  choice: всякая речь твоя
  rationale: διήγησις здесь широко охватывает речь, беседу или изложение. «Всякая речь твоя» сохраняет распределительное значение πᾶσα и соответствует возвышенному афористическому строю стиха.
- source_word: ἐν νόμῳ Ὑψίστου
  choice: в Законе Всевышнего
  rationale: Предлог ἐν передан прямо как «в», не сводя выражение однозначно к «согласно». «Всевышний» — традиционное и понятное русское соответствие божественному титулу Ὕψιστος; прописная буква в слове «Закон» указывает на Божье наставление в данном контексте.
theological_decisions:
- issue: Выбор основного источника при расхождении еврейского и греческого свидетелей
  choice: Основной текст переведён по греческой строке, а существенно отличающееся чтение сохранившегося еврейского свидетеля приведено в сноске.
  alternative: «Не завидуй преуспевающему наглецу; помни, что до смерти он не останется безнаказанным».
  rationale: Сохранившийся еврейский текст для этой ссылки отмечен как существенно не совпадающий с греческим и, вероятно, представляет иной или смещённый стих. Греческая строка связно соответствует традиционной нумерации Сир 9:16. Сноска открыто сохраняет важное расхождение, не создавая ложного впечатления единогласия источников.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и афористичным строем. Инверсия «речь твоя» умеренно возвышенна, но понятна современному читателю. Расхождение рукописных традиций обозначено прозрачно, без устранения текстологической неопределённости.
