  text: Keep far away from a man who has authority to kill, and you will not have to fear death.[a]
translation:
  language: ru
  text: Держись подальше от человека, имеющего власть убить, — тогда тебе не придётся бояться смерти.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст этого стиха содержит другое изречение: «Не оставляй старого друга, потому что новый с ним не сравнится». Греческая традиция, напротив, содержит предостережение, переданное в основном тексте.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακρὰν ἄπεχε
  choice: Держись подальше
  rationale: Повелительная конструкция требует намеренно сохранять дистанцию; выбран естественный современный русский оборот с сохранением силы предостережения.
- source_word: ἀπὸ ἀνθρώπου
  choice: от человека
  rationale: Передаёт единственное число ἀνθρώπου без ненужного уточнения пола там, где речь идёт о любом конкретном человеке, обладающем опасной властью.
- source_word: ὃς ἔχει ἐξουσίαν
  choice: имеющего власть
  rationale: ἐξουσία обозначает власть или полномочие действовать; «власть» сохраняет социально-правовой оттенок лучше, чем простая физическая способность.
- source_word: τοῦ φονεῦσαι
  choice: убивать
  rationale: Широко и прямо передаёт возможность лишать жизни, не сужая смысл до незаконного убийства или официальной казни.
- source_word: καὶ οὐ μὴ ὑποπτεύσῃς
  choice: и тебе не придётся страшиться
  rationale: В данном контексте глагол выражает тревожное ожидание или опасение, а усиленное отрицание — уверенный практический результат.
- source_word: φόβον θανάτου
  choice: смерти
  rationale: Буквально выражение означает «страх смерти»; в русском сочетание «страшиться смерти» естественно передаёт весь смысл без избыточного повтора.
theological_decisions:
- issue: Выбор исходного чтения при существенном расхождении сохранившегося еврейского и греческого текстов
  choice: Основной текст следует греческому чтению данного стиха.
  alternative: 'Еврейское свидетельство: «Не оставляй старого друга, потому что новый с ним не сравнится».'
  rationale: Свидетели содержат не варианты одной фразы, а два разных изречения. Для основного текста принято греческое чтение, соответствующее стиховой традиции Сираха 9:13, а самостоятельное еврейское изречение полностью приведено в примечании, чтобы не скрывать текстовое расхождение.
translation_notes:
  register: Современный литературный русский язык; тон прямого житейского наставления. Формулировка ясная и сдержанно-достоинственная, без конфессионально окрашенной терминологии.
