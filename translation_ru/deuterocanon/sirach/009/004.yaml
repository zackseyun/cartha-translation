  text: Не сближайся с проституткой[a], чтобы не попасться на её уловки.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте стоит «проститутка»; в греческом параллельном тексте — «женщина, играющая на струнном инструменте».
