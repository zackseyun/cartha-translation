lexical_decisions:
- source_word: עִם זוֹנָה
  choice: с блудницей
  rationale: Предлог עִם означает «с», а זוֹנָה — женщину, занимающуюся проституцией. «Блудница» сохраняет краткость и нравственно-назидательный регистр исходного текста, не прибегая к грубой лексике.
- source_word: אַל תִּסְתַּיֵּד
  choice: не сближайся
  rationale: Редкий еврейский глагол обозначает здесь продолжительное общение или близкое знакомство. «Не сближайся» естественно передаёт предостережение против вовлечённости, не уточняя без достаточных оснований её характер.
- source_word: פֶּן תִּלָּכֵד
  choice: чтобы не попасться
  rationale: פֶּן вводит нежелательное последствие, а пассивная форма תִּלָּכֵד передаёт образ поимки или попадания в ловушку. Русское «чтобы не попасться» сохраняет этот образ и звучит естественно.
- source_word: בְּלִקְחֹתֶיהָ
  choice: на её уловки
  rationale: Еврейское выражение неоднозначно; греческое ἐν τοῖς ἐπιχειρήμασιν αὐτῆς указывает на замыслы, попытки или приёмы. «На её уловки» естественно сочетается с глаголом «попасться» и передаёт вероятный смысл, не сводя его исключительно к соблазнению.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и отличающегося греческого параллельного чтения
  choice: В основном тексте следовать еврейскому чтению «блудница», отметив отличие греческого свидетеля в сноске.
  alternative: Следовать греческому чтению и перевести «женщина, играющая на струнном инструменте».
  rationale: Еврейский текст здесь сохранился и служит основным источником. Однако различие греческого параллельного текста существенно для истории текста и потому не должно быть скрыто.
- issue: Передача трудного выражения בְּלִקְחֹתֶיהָ
  choice: Перевести «на её уловки», учитывая греческий параллельный текст.
  alternative: «её соблазнами»; «её замыслами»; «тем, что она берёт».
  rationale: Значение еврейской формы не вполне ясно. Греческое чтение поддерживает смысл приёмов или замыслов; «уловки» сохраняют образ опасного вовлечения и не вносят лишней догматической определённости.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формулировкой в стиле наставительной мудрости. «Не сближайся» избегает как архаичного «не сообщайся», так и разговорного «не водись»; «уловки» сохраняют понятный образ ловушки.
