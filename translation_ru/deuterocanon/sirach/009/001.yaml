  yaml_path: translation/deuterocanon/sirach/009/001.yaml
  text: Do not be jealous of the wife in your bosom[c][b][a], lest you teach against yourself an evil lesson.
translation:
  language: ru
  text: Не ревнуй жену, которую ты держишь у груди[a], чтобы не преподать себе во вред дурное наставление[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жену твоего лона/груди» — образ интимной супружеской близости. Глагол также может означать «завидовать», но в этом контексте вероятнее речь о ревности.'
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: 'В еврейском тексте сказано только «зло/дурное»; кому именно обращено преподавание, прямо не указано. Греческая параллель уточняет: «дурное наставление (или обучение)».'
    reason: textual_and_ambiguity_note
lexical_decisions:
- source_word: אַל תְּקַנֵּא
  choice: Не ревнуй
  rationale: Глагол קנא может выражать и зависть, и ревность; супружеский контекст делает «ревновать» наиболее естественным и точным выбором.
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: жену, приникшую к твоей груди
  rationale: Буквально это «жена у твоей груди/на твоём лоне». Русская формулировка сохраняет образ телесной близости, но избегает неестественного выражения «жена твоего лона».
- source_word: פֶּן
  choice: чтобы не
  rationale: Частица вводит предостережение о нежелательном последствии; «чтобы не» звучит в современном русском естественнее, чем архаическое «дабы не».
- source_word: תִּלְמַד עָלֶיךָ רָעָה
  choice: не преподать во вред себе дурной урок
  rationale: Форма למד здесь имеет значение «учить, преподать», а עָלֶיךָ указывает на обращённое против самого человека последствие. «Дурной урок» учитывает греческую параллель παιδείαν πονηράν и при этом сохраняет некоторую недосказанность еврейского текста, где стоит просто «зло».
theological_decisions:
- issue: Кому преподаётся дурной урок
  choice: Не называть прямо ни жену, ни мужа получателем урока
  alternative: «Чтобы не научить её злу против себя» или «чтобы самому не научиться злу»
  rationale: В еврейском тексте получатель действия прямо не указан, а форма глагола и греческая параллель поддерживают значение «преподать/научить». Нейтральная конструкция сохраняет эту неоднозначность и не вводит отсутствующее местоимение.
translation_notes:
  register: Современный литературный русский язык с достоинством поучительной литературы. Образ груди сохранён, но выражен естественно; синтаксическая неоднозначность заключительной части не устранена искусственно.
