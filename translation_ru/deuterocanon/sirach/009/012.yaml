  terminology: «К ней» верно передаёт грамматический род и число еврейского местоимения. «Яма» предпочтительнее «могильной ямы», поскольку שָׁחַת может означать яму, могилу или место гибели. Примечание о греческой версии необходимо; его формулировка уточнена, чтобы не представлять спорное «до ада» как однозначный русский оборот.
