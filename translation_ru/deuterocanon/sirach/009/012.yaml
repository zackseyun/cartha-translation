  - severity: medium
    issue: Необоснованное уточнение значения בְּדָמִים
    rationale: Перевод «из-за крови» фиксирует причинное значение. Предлог допускает более широкое обстоятельственное прочтение; «в крови» сохраняет эту неоднозначность.
  - severity: low
