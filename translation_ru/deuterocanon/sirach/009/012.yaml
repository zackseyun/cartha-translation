translation:
  language: ru
  text: Чтобы сердце твоё не склонилось к ней и чтобы ты в крови не склонился к яме.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этого стиха существенно иной: «Не одобряй благоволения нечестивых; помни, что до ада они не будут оправданы».'
    reason: Греческая традиция не соответствует данному еврейскому чтению по содержанию; это существенное расхождение следует отмечать отдельно, не смешивая оба текста в основном переводе.
lexical_decisions:
- source_word: אֵלֶיהָ
  choice: к ней
  rationale: Еврейское местоимение имеет форму женского рода единственного числа; перевод сохраняет её, не заменяя множественным числом.
- source_word: וּבְדָמִים
  choice: и из-за крови
  rationale: Множественная форма דמים часто обозначает пролитую кровь или кровопролитие. Более буквальное «из-за крови» сохраняет некоторую неоднозначность причины и обстоятельства.
- source_word: שָׁחַת
  choice: могильную яму
  rationale: Слово обозначает яму, могилу или место гибели; сочетание передаёт одновременно конкретный образ нисхождения и угрозу смерти.
theological_decisions:
- issue: Расхождение еврейского и греческого текстов
  choice: Основной текст переведён по засвидетельствованному еврейскому чтению
  alternative: 'Следовать греческому тексту: «Не находи удовольствия в благополучии нечестивых; помни, что до самого ада они не будут оправданы»'
  rationale: Предоставленный еврейский источник имеет высокую степень уверенности и является первичным основанием задания; греческий параллельный текст отражает существенно иное чтение, которое следует отметить, а не смешивать с еврейским.
- issue: Род и число адресата оборота אֵלֶיהָ
  choice: «к ней»
  alternative: «к ним»
  rationale: Женский род единственного числа явно выражен в еврейском тексте. Контекстуальная замена на множественное число устранила бы грамматически засвидетельствованную особенность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Синтаксис слегка приподнят, но прозрачен; образ сердца и нисхождения в могильную яму сохранён.
