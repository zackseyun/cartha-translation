  source_fidelity: 'Основной смысл передан, включая женский род единственного числа в אֵלֶיהָ. Однако «из-за крови ты не сошёл» заметно удаляется от еврейского וּבְדָמִים תִּטֶּה אֶל שָׁחַת: здесь повторён глагол «склоняться/обращаться», употреблённый в активной форме, а предлог ב- не требует однозначного причинного понимания «из-за».'
