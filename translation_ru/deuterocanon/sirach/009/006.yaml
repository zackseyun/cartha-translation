translation:
  language: ru
  text: Не сближайся с певицами[a], чтобы они не обожгли тебя своими устами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Не отдавай души своей блудницам, чтобы не лишиться своего наследия». Там сексуально-нравственный смысл предостережения выражен прямо, тогда как еврейский текст говорит о «певицах» и об опалении «их устами».'
    reason: alternative_reading
lexical_decisions:
- source_word: עִם מְנַגְּנוֹת
  choice: с певицами
  rationale: Сохраняет женский род и образ женщин, занятых музыкальным исполнением; не вносит прямо выраженного лишь в греческом тексте указания на проституцию.
- source_word: אַל תִּדְמוֹךְ
  choice: не сближайся
  rationale: Редкий и не вполне ясный глагол в данном контексте обозначает тесное общение или близкую связь. Русское «не сближайся» естественно передаёт предостережение, не уточняя без основания характер близости.
- source_word: פֶּן
  choice: чтобы… не
  rationale: Естественная современная русская конструкция для обозначения нежелательного последствия; соответствует предостерегающему значению частицы.
- source_word: יִשְׂרְפֻךָ
  choice: они не опалили тебя
  rationale: Сохраняет активную форму и метафору огня. «Опалили» звучит естественнее буквального «сожгли» применительно к воздействию уст и не устраняет образ причиняемого вреда.
- source_word: בְּפִיפִיֹתָם
  choice: своими устами
  rationale: Передаёт конкретный образ уст и инструментальное значение предлога; возвратное притяжательное местоимение ясно связывает уста с певицами.
theological_decisions:
- issue: Расхождение еврейского и греческого текстов
  choice: В основном тексте следовать сохранившемуся еврейскому чтению о певицах и их устах.
  alternative: «Не отдавай души своей блудницам, чтобы не лишиться своего наследия».
  rationale: Сохранившийся еврейский текст является первичным для перевода и оставляет образное предостережение без явного обозначения женщин как блудниц. Греческий свидетель существенно конкретизирует сексуально-нравственный смысл и заменяет образ опаления утратой наследия, поэтому его чтение приводится в сноске, а не смешивается с основным текстом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрости. «Не сближайся» общепонятно и допускает социальную либо интимную близость; «устами» сохраняет возвышенный конкретный образ оригинала. Маркер [a] помещён непосредственно после слова, к которому относится разночтение.
