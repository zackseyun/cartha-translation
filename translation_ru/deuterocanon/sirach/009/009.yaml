base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/009/009.yaml
  text: Turn your eyes away from a graceful woman[a], and do not gaze at beauty that is not yours.
translation:
  language: ru
  text: Отведи взгляд от привлекательной женщины[a] и не засматривайся на красоту, которая не для тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Вовсе не садись с замужней женщиной и не пей с ней вина, чтобы душа твоя не склонилась к ней и ты духом своим не соскользнул к погибели». Еврейское свидетельство здесь короче и носит более общий характер.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַעֲלִים עַיִן
  choice: Отведи взгляд
  rationale: Еврейская идиома буквально означает «скрой глаз», но здесь естественно выражает призыв отвести взгляд.
- source_word: אֵשֶׁת חֵן
  choice: привлекательной женщины
  rationale: חֵן обозначает обаяние, привлекательность, благовидность; перевод не сводит выражение исключительно к внешней красоте, отдельно названной далее.
- source_word: תַּבִּיט
  choice: не засматривайся
  rationale: В контексте предостережения глагол указывает не на случайный взгляд, а на намеренное или продолжительное разглядывание.
- source_word: יֹפִי
  choice: красоту
  rationale: Прямой и естественный эквивалент существительного со значением красоты.
- source_word: לֹא לָךְ
  choice: которая не для тебя
  rationale: Краткая еврейская конструкция допускает оттенки «не твоя» и «не предназначенная тебе». Формулировка «не для тебя» сохраняет нравственную границу, не превращая женщину в объект собственности.
theological_decisions:
- issue: Соотношение краткого еврейского текста и более пространного греческого параллельного чтения
  choice: Основной текст следует сохранившемуся еврейскому чтению; греческое свидетельство приводится в сноске.
  alternative: 'Перевести по греческому тексту: не садиться с замужней женщиной и не пить с ней вина, чтобы не впасть в погибель.'
  rationale: При наличии надежного еврейского свидетельства оно служит основой перевода. Греческий текст существенно пространнее и конкретизирует предостережение, поэтому его нельзя молча включать в основной текст.
translation_notes:
  register: Современный литературный русский язык; краткое наставление передано естественно и достойно. «Привлекательной» сохраняет значение обаяния в חֵן и не дублирует слово «красота» во второй части.
