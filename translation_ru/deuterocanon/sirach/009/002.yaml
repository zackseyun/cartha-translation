translation:
  language: ru
  text: Не отдавай[a] женщине души своей, позволяя ей ступать по твоим высотам.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская форма первого глагола трудна; в греческом тексте: «Не отдавай женщине души своей, чтобы она ступила на твою силу».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «твои высоты». Это может быть образ положения, достоинства или силы; греческий текст передаёт этот образ как «твою силу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּקְנֶא
  choice: Не отдавай
  rationale: 'Переданная еврейская форма трудна и буквально может быть понята иначе, однако греческое μὴ δῷς («не отдавай») убедительно свидетельствует о смысле предостережения: не вручать себя во власть другого.'
- source_word: נַפְשְׁךָ
  choice: душу свою
  rationale: נפש может обозначать душу, жизнь или всего человека. «Душу свою» сохраняет образ еврейского текста и соответствует греческому ψυχή, не сводя выражение только к жизни или воле.
- source_word: לְאִשָּׁה
  choice: женщине
  rationale: Обычное слово означает как женщину, так и жену; отсутствие притяжательного уточнения не позволяет без необходимости ограничить смысл словом «жена».
- source_word: לְהַדְרִיכָהּ
  choice: чтобы не дать ей ступать
  rationale: Форма передаёт образ побуждения или допущения ходить, наступать; греческое ἐπιβῆναι подтверждает конкретный образ восхождения или наступания. Отрицательная конструкция по-русски естественно выражает подразумеваемое предостережение о результате.
- source_word: עַל בָּמוֹתֶיךָ
  choice: по твоим высотам
  rationale: Основное значение — «твои высоты, возвышенности». Образ сохранён в основном тексте; вероятный переносный смысл положения, достоинства или силы пояснён в сноске.
theological_decisions:
- issue: Следует ли раскрыть образ как прямое предостережение против господства женщины
  choice: Сохранить образы отдаваемой души и хождения по высотам
  alternative: Не отдавай себя женщине, чтобы она не получила над тобой власть
  rationale: Это изречение мудрости, а не систематическое учение о браке или достоинстве полов. Образный перевод сохраняет смысловую напряжённость текста и не усиливает его до общего доктринального утверждения.
- issue: Как передать отношение между запретом и инфинитивной конструкцией
  choice: «чтобы не дать ей ступать»
  alternative: «давая ей ступить» или «и она взойдёт»
  rationale: Такой оборот естественен по-русски и передаёт предупреждение о нежелательном следствии, не превращая его в безусловное предсказание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Инверсия «душу свою» сохраняет поэтическую весомость, оставаясь понятной; конкретный образ намеренно не заменён современным словом «власть».
