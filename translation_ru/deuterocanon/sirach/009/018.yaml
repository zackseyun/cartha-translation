translation:
  language: ru
  text: В руках мастеров изделие удостоится похвалы, а правитель народа мудр в своей речи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст из Каирской генизы содержит существенно иную строку: «И если приблизишься, не понесёшь вины, чтобы он не отнял твою жизнь». Еврейское и греческое свидетельства здесь резко расходятся.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν χειρὶ τεχνιτῶν
  choice: в руках мастеров
  rationale: Греческий оборот буквально говорит о «руке мастеров» как о средстве и сфере умелого труда. По-русски при множественном числе «мастеров» естественно сказать «в руках», сохранив образ.
- source_word: ἔργον
  choice: изделие
  rationale: В данном контексте слово обозначает результат труда мастеров, а не нравственный поступок или труд вообще.
- source_word: ἐπαινεθήσεται
  choice: удостоится похвалы
  rationale: Передаёт будущее страдательное значение и естественно звучит как обобщённое изречение.
- source_word: ὁ ἡγούμενος λαοῦ
  choice: правитель народа
  rationale: ὁ ἡγούμενος обозначает того, кто возглавляет и управляет; политический контекст поддерживает слово «правитель», а неопределённо-обобщённый смысл сохраняется без указательного оттенка.
- source_word: σοφὸς ἐν λόγῳ αὐτοῦ
  choice: мудр в своей речи
  rationale: Сохранены предикативное «мудр» и смысл λόγος как речи или высказывания, без уточнения, которого нет в греческом тексте.
theological_decisions:
- issue: Резкое расхождение еврейского и греческого свидетелей в Сир 9:18
  choice: Основной текст переведён по греческому свидетелю, а сохранившаяся еврейская строка приведена в примечании.
  alternative: 'Перевести в основном тексте еврейскую строку: «И если приблизишься, не понесёшь вины, как бы у тебя не отняли жизнь».'
  rationale: Свидетели содержат не небольшие варианты, а разные изречения. Принятую для данного стиха греческую основу необходимо сопровождать ясным указанием на существенное еврейское разночтение, не скрывая текстологической неопределённости.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным афористическим строем. «Мастера» и «изделие» понятны широкому читателю и передают ремесленный контекст; синтаксический параллелизм двух частей сохранён.
