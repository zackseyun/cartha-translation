review_pass:
  verdict: revise
  source_fidelity: Первая половина верно передаёт возвратный смысл להתנבל, но «из-за того, что видят твои глаза» излишне причинно истолковывает בְּמַרְאֵה עֵינֶיךָ и звучит тяжеловесно. Во второй половине «не доводи себя до разорения» неоправданно добавляет каузативную, волевую конструкцию, которой в לשומם нет. Более прямое «не разорись» сохраняет результативный смысл без такого добавления. Неясное אחר ביתהּ следует оставить открытым и пояснить в сноске.
  naturalness: «Тем, что предстаёт твоим глазам» — естественная современная литературная передача зрительного образа без сведения его к причине. «Гоняясь за её домом» остаётся намеренно необычным, поскольку и еврейский оборот труден, но в русском понятнее буквального «следуя за её домом».
  terminology: «Унижай себя» допустимо для reflexive Hitpael נבל. «Разорись» уместно передаёт в данном контексте гибельный/опустошительный оттенок שמם, не навязывая узкое значение «испугаться». Греческую параллель и её существенное расхождение следует сохранить.
