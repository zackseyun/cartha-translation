  text: Do not debase yourself by the sight of your eyes[b][a], nor be appalled after her house.
translation:
  language: ru
  text: Не унижай себя тем, что предстаёт твоим глазам, и не разорись, гоняясь за её домом.[b][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая параллель: «Не разглядывай деву, чтобы не споткнуться из-за связанных с нею укоров (или наказаний)». Еврейский и греческий тексты этого стиха существенно различаются.'
    reason: alternative_reading
  - marker: b
    text: Еврейское «вслед за её домом» неясно; речь может идти о погоне за нею или за её домочадцами либо о разорении вследствие связи с её домом.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהִתְנַבֵּל
  choice: унижай себя
  rationale: Возвратная форма от נבל означает сделать себя низким, презренным или опозоренным; «унижай себя» сохраняет возвратность и нравственную направленность предостережения.
- source_word: בְּמַרְאֵה עֵינֵיךָ
  choice: из-за того, что видят твои глаза
  rationale: 'Буквально: «видом/зрелищем твоих глаз». Перевод сохраняет образ зрительного соблазна и при этом звучит понятно по-русски.'
- source_word: וּלְשׁוֹמֵם
  choice: не доводи себя до разорения
  rationale: Глагол שמם может выражать опустошение, разорение или потрясение. В контексте предостережения «доводи себя до разорения» передаёт сильное значение гибельных последствий, не сводя его только к испугу.
- source_word: אֲחַר בֵּיתָהּ
  choice: следуя за её домом
  rationale: Еврейское выражение буквально означает «вслед/за её домом» и остаётся трудным. Формулировка намеренно сохраняет необычный образ, а возможные значения поясняются в сноске.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающейся греческой параллелью
  choice: Основной текст переведён с еврейского, а греческое чтение приведено в сноске.
  alternative: «Не разглядывай деву, чтобы не споткнуться из-за связанных с нею укоров/наказаний».
  rationale: При наличии еврейского свидетеля он имеет приоритет; однако значительное расхождение с греческим нельзя скрывать, поэтому оно отмечено явно.
translation_notes:
  register: Современный литературный русский язык с достоинством назидательной речи. Сохранена заметная шероховатость трудного еврейского выражения, но фраза сделана синтаксически понятной; текстовое расхождение и смысловая неопределённость вынесены в сноски.
