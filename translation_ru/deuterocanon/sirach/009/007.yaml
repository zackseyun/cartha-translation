translation:
  language: ru
  text: Не разглядывай девственницу, чтобы не попасть под наказания, связанные с нею.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы не угодить под наказания, связанные с нею». Еврейское выражение сжато и может подразумевать последствия связи с нею.'
    reason: lexical_alternative
  - marker: b
