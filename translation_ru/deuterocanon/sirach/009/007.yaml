    reason: alternative_reading
lexical_decisions:
- source_word: בִּבְתוּלָה
  choice: в девственницу
  rationale: Существительное обозначает девственницу, то есть молодую незамужнюю женщину; лексическая определённость сохранена, а предложное управление согласовано с русским «всматриваться в».
- source_word: אַל תִּתְבּוֹנֵן
  choice: Не всматривайся
  rationale: Форма глагола указывает на пристальное, задерживающееся рассматривание, а не на случайный взгляд. «Не всматривайся» естественно передаёт продолжительное сосредоточенное внимание.
- source_word: פֶּן
  choice: чтобы не
  rationale: Передаёт предостережение о возможном нежелательном последствии без излишне архаичного русского оборота.
- source_word: תִּוָּקֵש
  choice: попасть в западню
  rationale: Передаёт пассивное значение попадания в ловушку и сохраняет образ западни, уместный в контексте наставления.
- source_word: בַּעֲנָשֶׁיהָ
  choice: из-за наказаний, связанных с ней
  rationale: 'עֹנֶשׁ означает наказание или взыскание; женский суффикс соотносит их с женщиной. Формулировка сохраняет сжатость и неоднозначность связи: речь может идти о последствиях отношений с ней, а не обязательно о наказании, которому подвергается только она.'
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческого свидетеля
  choice: Основной текст переведён с еврейского, а греческое чтение приведено в сноске.
  alternative: Перевести греческое предостережение об улицах города либо объединить оба чтения.
  rationale: Еврейский источник имеет высокую степень уверенности и служит здесь основой. Объединение разных чтений устранило бы реальное текстовое расхождение.
- issue: К кому относятся наказания
  choice: Сохранена неоднозначная связь наказаний с женщиной.
  alternative: Уточнить, что наказывают мужчину, женщину или обоих.
  rationale: Сжатая еврейская конструкция не определяет этого однозначно, поэтому перевод не вводит отсутствующего в источнике богословского или нравственно-правового уточнения.
translation_notes:
  register: Современный литературный русский язык с наставительным, но не архаичным звучанием. «Девственница» сохраняет точность еврейского слова; «попасть в западню» удерживает образ ловушки. Маркеры сносок поставлены после всего предложения, поскольку первая сноска поясняет заключительную фразу, а вторая — стих целиком.
