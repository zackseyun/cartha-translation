translation:
  language: ru
  text: Молодое вино — новый друг[a]; когда оно состарится, тогда, быть может, выпьешь его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст представляет собой краткое, эллиптическое изречение: буквально его начало можно передать как «Новое вино — новый друг». Предоставленный греческий текст этого стиха имеет совершенно иное содержание — предостережение о западнях и городских укреплениях; здесь перевод следует сохранившемуся еврейскому свидетельству.'
    reason: textual_variant
  - marker: b
    text: 'Заключительная часть еврейского текста не вполне ясна; более буквально: «а состарившееся — после, быть может, выпьешь его». Вероятный смысл сравнения в том, что дружба, подобно вину, созревает со временем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַיִן חָדָשׁ
  choice: молодое вино
  rationale: В винодельческом контексте современное русское «молодое вино» естественнее буквального «новое вино» и точно передаёт сочетание «вино» + «новое, молодое», сохраняя образ созревания.
- source_word: אוֹהֵב חָדָשׁ
  choice: новый друг
  rationale: 'Переданный еврейский текст эллиптичен. Именное прочтение создаёт краткое сопоставление: молодое вино — новый друг; оно понятно по-русски и не добавляет отсутствующего глагола.'
- source_word: וְיָשָׁן
  choice: когда оно состарится
  rationale: Форма означает «старый/состарившийся». В сравнении с вином временное придаточное естественно выражает созревание, не подменяя образ толкованием о дружбе.
- source_word: אַחַר אוּלַי
  choice: тогда, быть может
  rationale: Сохраняет и последовательность «после, затем», и модальную неуверенность «возможно» в текстуально трудной заключительной части.
- source_word: תִּשְׁתֶּינוּ
  choice: выпьешь его
  rationale: Передаёт наиболее вероятный смысл глагола «пить» с отнесением местоимения к вину. Не добавлено «с удовольствием», поскольку этого значения в сохранившейся еврейской форме прямо нет, а её окончание не вполне надёжно.
theological_decisions:
- issue: Выбор основного текста при существенном расхождении еврейского и греческого свидетельств
  choice: Перевести сохранившееся еврейское изречение о молодом вине и новом друге, отметив расхождение в сноске.
  alternative: Следовать греческому тексту с предостережением о западнях и хождении по городским стенам.
  rationale: Для Сираха при наличии еврейского свидетельства оно имеет приоритет. Предоставленный греческий параллельный текст отражает существенно иную форму стиха и не может быть незаметно объединён с еврейской.
- issue: Интерпретация образа созревшего вина
  choice: Сохранить образ без явного пояснения в основном тексте.
  alternative: 'Перевести смысл разъяснительно: старой дружбой можно наслаждаться после её испытания временем.'
  rationale: Еврейское изречение подразумевает сопоставление дружбы с вином, но не формулирует его вывод прямо. Сохранение образа уважает лаконичность и смысловую открытость оригинала.
translation_notes:
  register: Современный литературный русский язык с лаконичным, пословичным ритмом. Выражение «молодое вино» выбрано как естественный русский винодельческий эквивалент. Неясность финальной части сохранена словами «быть может», а предполагаемое нравственное толкование вынесено в сноску.
