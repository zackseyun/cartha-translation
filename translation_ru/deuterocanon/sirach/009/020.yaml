translation:
  language: ru
  text: По мере своих сил[a] приобретай друга и держись мудрых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть сообразно своим возможностям или средствам.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская форма здесь редка и не вполне ясна; греческий параллельный текст конкретнее: «советуйся с мудрыми».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכֹחֲךָ
  choice: по мере своих сил
  rationale: Предлог בְּ с существительным כֹּחַ здесь естественно передаёт меру возможностей человека; греческое κατὰ τὴν ἰσχύν σου подтверждает значение «сообразно своей силе/способности».
- source_word: קְנֵה
  choice: приобретай
  rationale: Глагол קנה обычно означает «приобретать, обретать». В сочетании с «другом» речь не обязательно идёт о покупке, поэтому русское «приобретай» сохраняет исходный образ и допускает значение «обретай».
- source_word: רֵעֶךָ
  choice: друга
  rationale: רֵעַ может обозначать друга, товарища или ближнего. В данном наставлении личное «друга» наиболее прямо передаёт еврейскую форму единственного числа с притяжательным суффиксом.
- source_word: וְעִם חֲכָמִים
  choice: и … мудрых
  rationale: Субстантивированное «мудрых» естественно обозначает мудрых людей и не сужает представительную форму множественного числа до лиц только мужского пола.
- source_word: תִּסְתַּיָּד
  choice: держись
  rationale: Редкая и не вполне ясная форма в контексте указывает на связь или общение с мудрыми. «Держись мудрых» сохраняет широкий relational смысл, не сводя его безоговорочно к более узкому «советуйся», представленному в греческой традиции.
theological_decisions:
- issue: Представительное значение חֲכָמִים
  choice: мудрых
  alternative: мудрецов; мудрых мужей
  rationale: Контекст говорит о классе мудрых людей, а не устанавливает ограничение по полу; нейтральное субстантивированное прилагательное точно и естественно передаёт это значение.
- issue: Характер отношений с мудрыми в תִּסְתַּיָּד
  choice: держись мудрых
  alternative: советуйся с мудрыми
  rationale: Еврейская форма редка и допускает более широкую связь с мудрыми, тогда как греческий параллельный текст конкретизирует её как обращение за советом. Основной текст не устраняет эту неопределённость, а греческое прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой наставительной интонацией. Сохранены единственное число «друга», образ приобретения и неопределённость редкого еврейского глагола; архаизмы и конфессионально окрашенные формулы не использованы.
