translation:
  language: ru
  text: Не приближайся к чужой женщине[a], чтобы не попасть в её сети.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к посторонней женщине». В литературе мудрости это выражение может обозначать женщину, отношения с которой выходят за дозволенные границы; греческая параллель также предполагает предостережение от неподобающей связи.'
    reason: Сохранение лексической неоднозначности выражения אִשָּׁה זָרָה и осторожное отражение свидетельства греческой параллели без излишнего сужения смысла.
lexical_decisions:
- source_word: אַל תִּקְרַב
  choice: Не приближайся
  rationale: Прямой запрет передаёт значение отрицательной формы повеления; глагол сохраняет образ намеренного сближения, не ограничивая его только физическим движением.
- source_word: אִשָּׁה זָרָה
  choice: чужая женщина
  rationale: Буквально — женщина «чужая, посторонняя». В литературе мудрости выражение может обозначать женщину вне дозволенных брачных и нравственных границ, а не обязательно иноплеменницу. Русское «чужая женщина» сохраняет эту многозначность.
- source_word: פֶּן
  choice: чтобы не
  rationale: Частица вводит предостережение о нежелательном последствии. Такая конструкция естественна в современном русском и не устраняет предупредительный смысл.
- source_word: תִּפּוֹל בִּמְצוּדֹתֶיהָ
  choice: попасть в её сети
  rationale: Еврейский текст буквально говорит о падении в ловушки или сети; греческая параллель подтверждает образ западни. Русское устойчивое выражение «попасть в сети» естественно сохраняет метафору уловления.
theological_decisions:
- issue: Значение выражения אִשָּׁה זָרָה в контексте литературы мудрости
  choice: чужая женщина
  alternative: иноплеменная женщина; распутная женщина; блудница
  rationale: 'Основной текст сохраняет буквальную и контекстуальную неоднозначность: речь может идти о посторонней женщине, в частности о женщине вне законных брачных отношений. Перевод «иноплеменная» неоправданно свёл бы смысл к происхождению, а «распутная» или «блудница» внесли бы более узкое толкование, чем прямо выражено в еврейском тексте. Греческая параллель указывает на недозволенную половую связь, что отмечено в сноске.'
translation_notes:
  register: Краткий назидательный стих в современном литературном русском. Формулировка dignified и доступная; устойчивый оборот «попасть в сети» сохраняет образ исходного текста без архаизации.
