  text: If she does not go according to your hand[b][a], cut her off from your flesh.
translation:
  language: ru
  text: Если она не поступает по твоей воле[a], отсеки её от своей плоти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по твоей руке» — то есть согласно твоему направлению или власти.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «отсеки её от своей плоти» рисует решительное отделение посредством телесного образа; явного юридического термина для развода здесь нет.
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ μὴ
  choice: если не
  rationale: Передаёт прямое условие греческого текста, не сглаживая его конструкцией «если только не».
- source_word: πορεύεται
  choice: поступает
  rationale: В данном контексте глагол обозначает образ действий; буквальное «идёт» по-русски было бы неясно и неестественно.
- source_word: κατὰ χεῖρά σου
  choice: по твоей воле
  rationale: Греческое «по твоей руке» — образное выражение действия согласно направлению или власти адресата. Русское «по твоей воле» естественно передаёт смысл, а образ руки отмечен в сноске.
- source_word: ἀπότεμε
  choice: отсеки
  rationale: Сохраняет резкий императив и телесный образ отсечения, не подменяя его юридическим термином «разведись».
- source_word: ἀπὸ τῶν σαρκῶν σου
  choice: от своей плоти
  rationale: Сохраняет телесную образность и оттенок тесного, вероятно брачного, единства; греческое множественное число σάρκες естественно передаётся по-русски единственным числом.
- source_word: αὐτήν
  choice: её
  rationale: Женское местоимение прямо указывает на женщину, о которой говорится в контексте.
theological_decisions:
- issue: Характер предписанного разрыва
  choice: Сохранить образное «отсеки её от своей плоти»
  alternative: 'Передать прямо: «разведись с ней» или мягче: «отделись от неё»'
  rationale: В греческом тексте нет явного юридического термина для развода. Телесная метафора требует решительного отделения, но не позволяет переводчику безоговорочно свести её к одной правовой процедуре.
- issue: Власть мужа, выраженная оборотом κατὰ χεῖρά σου
  choice: Передать как «по твоей воле» с пояснением буквального образа
  alternative: 'Буквально: «по твоей руке»; интерпретирующе: «под твоим контролем»'
  rationale: Так сохраняется идея действия согласно направлению или власти адресата, но не усиливается до более жёсткого «под контролем», которого греческий оборот сам по себе не требует.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, суровости и телесной метафоры оригинала. «Поступает» делает условие понятным без излишнего истолкования; «отсеки» намеренно сохраняет резкость греческого императива.
