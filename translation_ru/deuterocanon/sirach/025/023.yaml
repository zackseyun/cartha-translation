translation:
  language: ru
  text: Ослабевшие руки и подгибающиеся колени — жена, которая не благословляет своего мужа[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не считает (не называет) своего мужа счастливым». Еврейский глагол может также передавать мысль, что она не делает мужа счастливым или благополучным. Греческая параллель имеет смысл: «не считает своего мужа счастливым».'
    reason: Сохранение лексической неоднозначности еврейского תְאַשֵּׁר и свидетельства греческой параллели.
lexical_decisions:
- source_word: רִפְיוֹן יָדַיִם
  choice: ослабевшие руки
  rationale: Сочетание буквально передаёт образ рук, утративших силу. Такая формулировка естественна по-русски и не сводит образ только к нравственной слабости.
- source_word: וְכִשְׁלוֹן בִּרְכַּיִם
  choice: и подгибающиеся колени
  rationale: כִשְׁלוֹן связано с падением или спотыканием; применительно к коленям русское «подгибающиеся» ясно передаёт образ утраты опоры и согласуется с греческой параллелью.
- source_word: אִשָּׁה
  choice: жена
  rationale: Упоминание בַּעֲלָהּ («своего мужа») однозначно задаёт брачный контекст.
- source_word: לֹא תְאַשֵּׁר
  choice: не делает … счастливым
  rationale: Пиэль глагола אשר может означать делать счастливым или блаженным, а также считать либо называть счастливым. Основной вариант естественно передаёт вероятный результативный смысл, не ограничивая выражение формальным произнесением благословения.
- source_word: בַּעֲלָהּ
  choice: своего мужа
  rationale: В данном брачном контексте слово означает мужа; возвратное «своего» естественно выражает принадлежность при подлежащем «жена».
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и более пространной греческой параллели
  choice: Основной текст переведён по высоконадёжному еврейскому свидетельству; греческий использован только для проверки образов и синтаксической связи.
  alternative: Включить отсутствующее в данной еврейской строке греческое описание злой жены как униженного сердца, мрачного лица и сердечной раны.
  rationale: Дополнительный греческий материал не следует вводить в перевод данной сохранившейся еврейской строки. При этом греческая параллель подтверждает сопоставление такой жены с ослабевшими руками и коленями.
- issue: Неоднозначность формы תְאַשֵּׁר
  choice: В основном тексте дан результативный смысл «не делает своего мужа счастливым», а иные возможные оттенки сохранены в сноске.
  alternative: «Не благословляет своего мужа» или «не считает своего мужа счастливым».
  rationale: Русское «благословляет» может ошибочно сузить смысл до религиозной формулы, тогда как еврейский глагол допускает счастье, благополучие и признание блаженным. Сноска сохраняет эту смысловую напряжённость; греческое οὐ μακαρίζει особенно поддерживает значение «не считает/не называет счастливым».
translation_notes:
  register: Современный литературный русский язык с сохранением краткой афористической формы и телесной образности еврейского текста. Тире ясно выражает сопоставление, не добавляя отсутствующей в источнике связки.
