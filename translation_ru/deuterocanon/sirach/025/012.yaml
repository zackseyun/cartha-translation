  yaml_path: translation/deuterocanon/sirach/025/012.yaml
  text: The fear of the Lord surpasses everything[b][a]; to whom will the one who holds fast to it be compared?
translation:
  language: ru
  text: Страх Господень превосходит всё[a]; с кем сравнится тот, кто крепко держится его[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Страх Господень превыше всего». Греческое выражение подчёркивает превосходство над всем.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тот, кто обладает им». Глагол может означать как крепко держаться чего-либо, так и владеть им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φόβος Κυρίου
  choice: страх Господень
  rationale: Сохраняет прямое значение φόβος и устойчивое богословское выражение литературы мудрости, не смягчая его до одного лишь «благоговения».
- source_word: ὑπὲρ πᾶν ὑπερέβαλεν
  choice: превосходит всё
  rationale: Естественно передаёт усиленную мысль о превосходстве над всем; аорист понят как гномический и потому выражен настоящим временем.
- source_word: ὁ κρατῶν αὐτοῦ
  choice: тот, кто крепко держится его
  rationale: Передаёт длительное и твёрдое удержание, допускаемое κρατέω; местоимение «его» соотнесено со «страхом Господним» и сохраняет грамматический образ оригинала.
- source_word: τίνι ὁμοιωθήσεται
  choice: с кем сравнится
  rationale: Передаёт будущую пассивную форму в естественном русском риторическом вопросе без добавления отсутствующих в греческом слов.
theological_decisions:
- issue: Смягчать ли «страх» до «благоговения»
  choice: страх Господень
  alternative: благоговение перед Господом
  rationale: Ключевой термин φόβος сохранён прямо, чтобы не устранять присущее библейской мудрости смысловое напряжение.
- issue: Временное значение аориста ὑπερέβαλεν
  choice: превосходит
  alternative: превзошёл
  rationale: Высказывание имеет характер общей максимы; русское настоящее время естественно передаёт эту гномическую силу.
- issue: Смысл κρατῶν
  choice: кто крепко держится его
  alternative: кто обладает им
  rationale: Основной текст подчёркивает твёрдое удержание, а примечание сохраняет возможный оттенок обладания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрости. Синтаксис краткий и афористичный; сохранены риторический вопрос и ключевое выражение «страх Господень».
