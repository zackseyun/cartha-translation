base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/005.yaml
  text: If you did not desire them in your youth[b][a], how will you attain them in your old age?
translation:
  language: ru
  text: Если в юности ты не желал их[a][b], как же обретёшь их в старости?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте не названо, к чему относится местоимение «их». По контексту книги речь, вероятно, идёт о мудрости и связанных с нею качествах, однако основной текст этого не уточняет.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский глагол חפץ означает «желать», «находить удовольствие». Возможный смысловой перевод: «не стремился к ним».'
    reason: alternative_reading
  - marker: c
    text: 'Греческий текст этого стиха существенно отличается: в нём говорится о том, как прекрасны для седых волос здравое суждение, а для старцев — знание совета. Настоящий перевод следует сохранившемуся еврейскому тексту.'
    reason: textual_variant
lexical_decisions:
- source_word: בִּנְעֻרוֹתֶיךָ
  choice: в юности
  rationale: Форма с местоименным суффиксом обозначает период молодости; русское «в юности» естественно и ясно противопоставлено «в старости».
- source_word: לֹא חֲפַצְתָּם
  choice: ты не желал их
  rationale: חפץ прежде всего означает «желать, находить удовольствие»; перевод сохраняет прямое значение глагола и выраженный местоименным суффиксом объект во множественном числе.
- source_word: תַּשִּׁיגֵם
  choice: обретёшь их
  rationale: השיג означает «достичь, настичь, получить». «Обретёшь» естественно сочетается с подразумеваемыми нематериальными благами, не уточняя их вопреки еврейскому тексту.
- source_word: בְּזִקְנוֹתֶיךָ
  choice: в старости
  rationale: Существительное во множественном числе обозначает период старости; по-русски это естественно передаётся единственным числом.
theological_decisions:
- issue: Неуказанный антецедент местоимения «их»
  choice: Сохранить неопределённое «их» в основном тексте.
  alternative: 'Уточнить: «мудрости», «рассудительности» или «этих благ».'
  rationale: В еврейском тексте объект выражен лишь местоименным суффиксом множественного числа. Его конкретизация устранила бы намеренную или контекстуальную неопределённость.
- issue: Соотношение еврейского текста и греческой параллели
  choice: Переводить засвидетельствованный еврейский текст, а значительное расхождение с греческим отметить в сноске.
  alternative: 'Следовать греческому тексту: «Как прекрасна седина, умеющая судить, и старцы, знающие совет».'
  rationale: Еврейский источник имеет высокую заявленную уверенность и должен быть первичным; греческая версия здесь не является близким эквивалентом и не должна молча заменять его.
translation_notes:
  register: Современный литературный русский язык с краткой афористической формой. Обращение на «ты» передаёт формы второго лица единственного числа. Частица «же» подчёркивает риторический характер вопроса, не снимая его смысловой напряжённости.
