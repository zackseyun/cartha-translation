base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/008.yaml
  text: Happy is the man who has not stumbled with his tongue[a], and has not served one more contemptible than himself.
translation:
  language: ru
  text: Счастлив тот, кто не оступался в речах[a] и не служил человеку, более презренному, чем он сам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте вместо этого: «человек, радующийся своим детям, живущий и видящий падение врагов». Еврейское свидетельство здесь существенно отличается от греческого.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Счастлив тот
  rationale: Еврейская формула блаженства указывает на счастливую, достойную одобрения участь; такой вариант естественен для современной русской речи и не усиливает богословский оттенок без необходимости.
- source_word: נִכְשַׁל בִּלְשׁוֹנוֹ
  choice: не оступился языком
  rationale: Сохранена метафора преткновения и конкретный образ языка; выражение обозначает ошибку или проступок в речи, не сводя смысл только к греху вообще.
- source_word: עֹבֵד
  choice: не служил
  rationale: Широкое значение служения или подчинённого положения передано без излишнего уточнения о рабстве либо современной наёмной работе.
- source_word: נִקְלֶה מִמֶּנּוּ
  choice: человеку, более презренному, чем он сам
  rationale: נִקְלֶה обозначает низко ценимого, бесчестного или презренного человека; сравнительная конструкция сохранена. Слово «человеку» добавлено для ясности подразумеваемого носителя признака.
theological_decisions:
- issue: Существенное расхождение между еврейским и греческим текстами
  choice: Основной текст следует сохранившемуся еврейскому свидетельству, а существенно иной греческий вариант приведён в сноске.
  alternative: 'Греческий текст: «человек, радующийся своим детям, при жизни увидевший падение врагов».'
  rationale: Для Книги Премудрости Иисуса, сына Сирахова, сохранившийся еврейский текст имеет приоритет как исходноязычное свидетельство; значительное расхождение греческой традиции нельзя скрывать, поэтому оно отмечено отдельно.
translation_notes:
  register: Современный литературный русский язык с достоинством афористической мудрой речи. Сохранены еврейская метафора «оступиться языком» и социально-нравственная напряжённость второй строки; формулировка не конкретизирует характер служения сверх источника.
