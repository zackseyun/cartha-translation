translation:
  language: ru
  text: Я предпочёл бы делить кров со львом и драконом, чем жить со злой женщиной[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со злой женой». Греческое γυνή в зависимости от контекста может означать и «женщина», и «жена».'
    reason: Лексическая неоднозначность греческого γυνή.
lexical_decisions:
- source_word: συνοικῆσαι
  choice: жить со
  rationale: Глагол συνοικέω означает совместное проживание; простой современный оборот сохраняет бытовой смысл без лишних оттенков.
- source_word: λέοντι
  choice: львом
  rationale: Сохранён яркий образ единственного числа исходного текста.
- source_word: δράκοντι
  choice: драконом
  rationale: δράκων может обозначать дракона или огромного змея; «дракон» прямо передаёт традиционный усиленный образ, не сужая его до обычной змеи.
- source_word: εὐδόκησα
  choice: я предпочёл бы
  rationale: В сравнительной конструкции с ἤ глагол выражает предпочтение. Условная форма по-русски естественно передаёт смысл афористического выбора.
- source_word: ἐνοικῆσαι
  choice: поселиться
  rationale: ἐνοικέω означает обитать или жить где-либо; «поселиться» сохраняет пространственно-бытовой смысл и позволяет избежать неуклюжего повтора.
- source_word: μετὰ γυναικὸς πονηρᾶς
  choice: со злой женщиной
  rationale: γυνή допускает значения «женщина» и «жена»; без явного указания на супружеские отношения в основном тексте сохранено более общее «женщина». πονηρά здесь имеет нравственно отрицательный смысл, естественно передаваемый словом «злая».
theological_decisions:
- issue: Передавать ли γυνή как «женщина» или как «жена»
  choice: женщина
  alternative: жена
  rationale: Само греческое слово допускает оба значения, а притяжательного или иного однозначного показателя супружеских отношений нет. Домашний контекст делает значение «жена» вполне возможным, поэтому оно отмечено в сноске, но не подменяет неоднозначность основного текста.
translation_notes:
  register: Современный литературный русский язык с лаконичным, слегка возвышенным тоном изречения. Сравнение выражено естественной конструкцией «предпочёл бы… чем…»; образы льва и дракона сохранены.
