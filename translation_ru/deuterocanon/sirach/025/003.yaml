translation:
  language: ru
  text: Гордый бедняк, лживый[a] богач и старик, который прелюбодействует и лишён разумения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово מְכַחֵשׁ может также означать «обманывающий» или «отрицающий»; греческий параллельный текст имеет значение «лжец».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «испытывает недостаток знания»; возможны также переводы «лишён понимания» и «не обладает здравым суждением». Греческий текст сходным образом говорит о недостатке разумения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּל גֵּאֶה
  choice: гордый бедняк
  rationale: Сохраняет характеристику бедного человека как надменного; естественный русский порядок слов передаёт тесное сочетание существительного и определения.
- source_word: וְעָשִׁיר מְכַחֵשׁ
  choice: лживый богач
  rationale: Причастие от כחש может обозначать ложь, обман или отрицание. Греческое ψεύστην подтверждает общее значение «лживый»; такая формулировка кратка и сохраняет параллелизм.
- source_word: וְזָקֵן
  choice: и старик
  rationale: Здесь זקן обозначает пожилого мужчину, а не носителя должности, поэтому «старик» точнее, чем «старейшина».
- source_word: מְנָאֵף
  choice: который прелюбодействует
  rationale: Передаёт действующее причастие как продолжающееся или характерное действие и не ослабляет прямого значения супружеской неверности.
- source_word: וַחֲסַר דַּעַת
  choice: и лишён разумения
  rationale: Фраза означает недостаток знания, понимания или здравого суждения. «Лишён разумения» сохраняет нравственно-интеллектуальный оттенок и согласуется с греческим ἐλαττούμενον συνέσει.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и более полного греческого параллельного текста
  choice: Перевести непосредственно сохранившуюся еврейскую строку, используя греческий текст только для проверки значения спорных слов.
  alternative: 'Добавить греческое вводное предложение: «Три рода людей возненавидела душа моя…»'
  rationale: Приоритет принадлежит сохранившемуся еврейскому тексту. Хотя греческий параллельный текст содержит вводную рамку, добавление её в основной текст означало бы перевод отсутствующих здесь еврейских слов. При этом греческий надёжно подтверждает значения «лживый» и «лишён разумения».
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. Параллелизм трёх порицаемых типов сохранён; архаизмы сведены к минимуму, при этом «разумение» выбрано ради достоинства стиля и более широкого смысла, чем бытовое «здравый смысл».
