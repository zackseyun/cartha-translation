translation:
  language: ru
  text: Не пленяйся красотой женщины и не желай её ради того, что у неё есть.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «и не возжелай женщины». Еврейский текст выражается конкретнее, предостерегая от желания женщины ради того, что у неё есть.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּפּוֹל בְּיֹפִי
  choice: не пленяйся красотой
  rationale: Буквально еврейский текст говорит «не падай из-за/перед красотой», но здесь это образное предостережение против власти внешней привлекательности. «Не пленяйся» естественно передаёт этот смысл по-русски, не устраняя метафоричность полностью.
- source_word: אִשָּׁה
  choice: женщины
  rationale: Слово может означать как женщину, так и жену; отсутствие указания на брак требует более общего значения «женщина».
- source_word: וְעַל יֵש לָהּ
  choice: из-за того, чем она владеет
  rationale: Сжатая еврейская фраза указывает на то, что у неё есть или что ей принадлежит. Формулировка не сужает смысл исключительно до денег, поскольку речь может идти также об имуществе, положении или иных преимуществах.
- source_word: לֹא תַּחְמוֹד
  choice: не желай её
  rationale: Глагол חמד обозначает сильное желание или вожделение и нередко имеет оттенок корыстного посягательства. Местоимение «её» делает подразумеваемый объект ясным по-русски, а мотив желания выражен следующими словами.
theological_decisions:
- issue: Расхождение между еврейским текстом и более краткой греческой параллелью во второй части стиха
  choice: 'Следовать еврейскому чтению: «не желай её из-за того, чем она владеет»'
  alternative: «не вожделей женщины»
  rationale: Сохранившийся еврейский текст имеет высокую степень надёжности и содержит указание на корыстный мотив желания, отсутствующее в греческой параллели. Различие сохранено в сноске, а не сглажено.
translation_notes:
  register: Современный литературный русский язык с краткой, назидательной интонацией. «Пленяйся» сохраняет достоинство речи и передаёт образ опасного подчинения красоте; «чем она владеет» звучит естественно и не ограничивает смысл одним лишь богатством.
