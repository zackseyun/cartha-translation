base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/025.yaml
  text: A bad wife is leprosy to her husband[a]; let him drive her out of his house[c][b], and he will be healed of his leprosy.
translation:
  language: ru
  text: Дурная жена — проказа для мужа[a]. Пусть он выгонит её из своего дома[b] — и исцелится от своей проказы.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское צָרַעַת, традиционно переводимое как «проказа», в библейской речи обозначает более широкий круг тяжёлых кожных поражений, а не обязательно современную болезнь Хансена.
    reason: cultural_note
  - marker: b
    text: 'Возможно также: «пусть он разведётся с ней». Буквально еврейский текст говорит: «пусть он выгонит её из своего дома»; это может подразумевать разрыв брака, не уточняя его юридическую форму.'
    reason: alternative_reading
  - marker: c
    text: 'Греческая параллель значительно отличается: «Не давай ни воде выхода, ни злой жене власти». Основной перевод следует сохранившемуся еврейскому тексту.'
    reason: textual_variant
lexical_decisions:
- source_word: אִשָּׁה רָעָה
  choice: дурная жена
  rationale: Контекст прямо называет её мужа, поэтому אִשָּׁה здесь естественно передать как «жена». «Дурная» сохраняет широкий нравственный и практический смысл רָעָה, не сужая его до исключительно злонамеренного поведения.
- source_word: צָרַעַת
  choice: проказа
  rationale: Это традиционное и узнаваемое соответствие библейскому термину, хотя древняя категория охватывала более широкий круг тяжёлых кожных поражений. Повтор слова сохранён ради образной симметрии стиха.
- source_word: לְבַעֲלָהּ
  choice: для своего мужа
  rationale: В брачном контексте בַּעַל означает «муж». Русская конструкция «проказа для своего мужа» естественно передаёт отношение, выраженное предлогом לְ־ и местоименным суффиксом.
- source_word: יְגַרְשֶׁנָּה מִבֵּיתוֹ
  choice: пусть он выгонит её из своего дома
  rationale: Глагол גרש с уточнением «из своего дома» прежде всего обозначает конкретное изгнание. Побудительный оттенок формы передан словом «пусть»; юридически более узкое «разведётся» оставлено в примечании как возможный смысл.
- source_word: וְיִתְרַפֵּא מִצָּרַעְתּוֹ
  choice: и исцелится от своей проказы
  rationale: Форма естественно читается как результат предшествующего действия. «Исцелится» сохраняет медицинскую метафору, а «своей проказы» передаёт местоименный суффикс и повтор исходного слова.
theological_decisions:
- issue: Следует ли понимать יְגַרְשֶׁנָּה как юридически оформленный развод или как изгнание из дома
  choice: 'Передать конкретно: «пусть он выгонит её из своего дома»'
  alternative: «пусть он разведётся с ней»
  rationale: Еврейский текст называет изгнание из дома, но не уточняет его юридическую форму. Основной перевод не разрешает эту неоднозначность в пользу определённой брачной доктрины.
- issue: Статус существенно отличающегося греческого текста
  choice: Следовать сохранившемуся еврейскому тексту, указав греческий вариант в примечании
  alternative: 'Перевести греческое чтение: «Не давай воде выхода и злой жене — власти»'
  rationale: Для данного проекта еврейское свидетельство имеет высокую степень уверенности и служит первичным источником; значительное расхождение греческой параллели необходимо сделать видимым, но не смешивать с основным текстом.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным синтаксисом. Сохранены резкость наставления, медицинская метафора и повтор «проказа»; эвфемизация и конфессионально обусловленное уточнение о разводе не вводились.
