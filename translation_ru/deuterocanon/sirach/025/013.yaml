translation:
  language: ru
  text: Всякая рана — только не рана сердца; всякое зло — только не зло женщины.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякая беда — только не беда женщины». Еврейское רָעָה может означать «зло», «беду», «вред» или «несчастье», а אִשָּׁה — «женщину» или, в зависимости от контекста, «жену».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: любая / любое
  rationale: 'Распределительное значение передано местоимением «любой»: изречение сопоставляет всякий случай из названной категории с наиболее тяжёлым примером. Повтор сохраняет параллелизм двух частей.'
- source_word: מַכָּה
  choice: рана
  rationale: Слово обозначает удар и причинённое им повреждение; в сочетании с «сердцем» и при поддержке греческого πληγή «рана» сохраняет как прямой, так и переносный смысл.
- source_word: הַלֵּב
  choice: сердца
  rationale: 'Буквальный образ сохранён: в древнееврейском «сердце» может обозначать внутреннего человека, но уточняющий пересказ сузил бы смысл.'
- source_word: רָעָה
  choice: зло
  rationale: Существительное может означать как зло, так и беду, вред или несчастье. Основной текст сохраняет более резкий нравственный оттенок, поддержанный греческим πονηρία; событийное значение отмечено в сноске.
- source_word: אִשָּׁה
  choice: женщины
  rationale: Без определяющего контекста слово может означать «женщина» или «жена». Более прямое и широкое значение помещено в основной текст, а семейно-бытовой вариант отмечен в сноске.
- source_word: וְלֹא כְ
  choice: но не такая / но не такое, как
  rationale: 'Сравнительное отрицание выражает превосходящую степень: какая угодно рана или какое угодно зло, но ничто не сравнится с названным далее. Русская развёрнутая форма делает этот смысл ясным, не устраняя семитский параллелизм.'
theological_decisions:
- issue: Резко звучащее обобщение о женщине
  choice: Сохранить в основном тексте прямую формулировку «зло женщины»
  alternative: «беда от жены» или «зло жены»
  rationale: Исходный текст формулирует мысль резко и обобщённо; перевод не должен без текстовых оснований смягчать или исправлять её. Вместе с тем смысловая широта רָעָה и אִשָּׁה честно отражена в сноске.
translation_notes:
  register: Сжатый, афористичный синтаксис соответствует жанру мудрого изречения. Лексика современная и литературная; повтор «но не такая/такое, как» сохраняет формальный параллелизм и делает подразумеваемое сравнение естественным по-русски.
