base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/017.yaml
  text: A woman's evil darkens a man's appearance[b][a], and makes his face gloomy like a bear.
translation:
  language: ru
  text: Зло женщины[a] омрачает облик мужчины и делает его лицо мрачным, как у медведя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское אִשָּׁה может означать также «жена»; поэтому изречение можно понимать более конкретно: «Зло жены омрачает облик мужа».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте здесь иной образ: «и омрачает её лицо, как вретище». Сохранившийся еврейский текст читает: «его лицо… как у медведя».'
    reason: alternative_reading
lexical_decisions:
- source_word: רֹעַ
  choice: зло
  rationale: Существительное обозначает нравственное зло или вредоносность. «Зло» сохраняет краткость и обобщённую силу еврейского изречения, не сужая смысл до одной лишь злобы или дурного характера.
- source_word: אִשָּׁה
  choice: женщины
  rationale: אִשָּׁה может означать как «женщина», так и «жена». Поскольку притяжательная связь прямо не выражена, в основном тексте сохранено более общее «женщина», а семейное прочтение отмечено в сноске.
- source_word: יַשְׁחִיר
  choice: омрачает
  rationale: Каузативная форма передаёт значение «делать тёмным, чернить». «Омрачает» естественно сочетается с «обликом» и не создаёт нежелательного русского оттенка клеветы, возможного у глагола «чернить».
- source_word: מַרְאֶה אִישׁ
  choice: облик мужчины
  rationale: מַרְאֶה означает видимый облик или внешний вид, а אִישׁ здесь прямо обозначает мужчину. Формулировка сохраняет гендерную конкретность и звучит естественно по-русски.
- source_word: וְיַקְדִיר פָּנָיו
  choice: и делает его лицо мрачным
  rationale: קדר может выражать потемнение, помрачение или мрачность. Такой перевод сохраняет и зрительный, и эмоциональный оттенок, избегая неестественного буквального повтора.
- source_word: לְדוֹב
  choice: как у медведя
  rationale: Сохранившийся еврейский текст ясно содержит דֹּב, «медведь». Русская сравнительная конструкция «как у медведя» естественнее, чем двусмысленное «как медведя», и передаёт сопоставление лица с медвежьим обликом.
theological_decisions:
- issue: Гендерно конкретная формулировка изречения
  choice: «Зло женщины… облик мужчины»
  alternative: «Дурной нрав жены омрачает облик мужа»
  rationale: В еврейском тексте употреблены אִשָּׁה и אִישׁ. Перевод не нейтрализует гендерную форму изречения и вместе с тем не навязывает более узкое супружеское прочтение; возможность понимать אִשָּׁה как «жену» сохранена в сноске.
- issue: Расхождение еврейского и греческого образов
  choice: Основной текст следует еврейскому чтению «как у медведя»
  alternative: 'Греческое чтение: «омрачает её лицо, как вретище»'
  rationale: Заданный первичный еврейский свидетель содержит ясный образ медведя. Существенно отличающееся греческое чтение не подменяет основной текст, но приводится в сноске, чтобы сохранить текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой изречения. Лексика понятна широкому читателю; параллелизм и повтор семантики потемнения сохранены без чрезмерной буквальности.
