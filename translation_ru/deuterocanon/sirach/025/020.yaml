base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/025/020.yaml
  text: Like a sandy ascent under the feet of an old man[c][b][a], so is a sharp-tongued wife to a gentle man.
translation:
  language: ru
  text: Как песчаный подъём[a] под ногами старика, так и жена, несдержанная на язык[b], — для мужа мягкого нравом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское חוּץ здесь трудно истолковать. В греческом параллельном тексте стоит «песчаный», что, вероятно, сохраняет образ зыбкого подъёма, тяжёлого для старика.
    reason: textual_variant
  - marker: b
    text: 'Или: «болтливая жена». Буквально по-еврейски: «жена языка»; греческое слово также означает женщину, склонную много говорить.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «тихого», «спокойного» или «кроткого мужа». Еврейское слово означает «мягкий, нежный»; греческий параллельный текст допускает значения «тихий», «спокойный», «мирный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲלֵה חוּץ
  choice: как подъём по песку
  rationale: מַעֲלֵה означает подъём или путь вверх. Значение חוּץ в данном еврейском чтении неясно; греческое ἀνάβασις ἀμμώδης («песчаный подъём») убедительно указывает на трудный подъём по зыбкому песку.
- source_word: לְרַגְלֵי יָשִׁישׁ
  choice: для ног старика
  rationale: יָשִׁישׁ обозначает престарелого человека, а не носителя должности. Формулировка сохраняет конкретный образ ненадёжной опоры, особенно тяжёлой для пожилого человека.
- source_word: אֵשֶׁת לָשׁוֹן
  choice: жена, несдержанная на язык
  rationale: Буквально — «жена языка». Греческое γλωσσώδης означает «болтливая, многоречивая». Русское выражение «несдержанная на язык» передаёт отрицательную характеристику речи, не сужая её непременно до язвительности.
- source_word: לְאִישׁ רַךְ
  choice: для мягкого мужа
  rationale: רַךְ буквально значит «мягкий, нежный» и применительно к человеку допускает значения «мягкий нравом, кроткий». Перевод «мягкий» сохраняет широту еврейского слова; греческое ἡσύχῳ подтверждает близкую характеристику спокойного или мирного человека.
theological_decisions:
- issue: Гендерно-конкретная форма изречения
  choice: жена ... муж
  alternative: супруг ... человек
  rationale: Еврейский текст прямо называет אֵשֶׁת («жену») и אִישׁ («мужчину/мужа»), как и греческий параллельный текст. Гендерная конкретность сохранена, а «муж» естественно соответствует слову «жена» в русском контексте.
- issue: Характеристика мужа как רַךְ
  choice: мягкий
  alternative: тихий, спокойный или кроткий
  rationale: Выбрано более прямое соответствие еврейскому слову, чтобы не сводить его смысл исключительно к молчаливости, миролюбию либо религиозно окрашенной кротости.
translation_notes:
  register: Современный литературный русский язык с сохранением краткой формы библейского сравнения. Выражение «несдержанная на язык» понятно современному читателю и передаёт неодобрительный оттенок, не усиливая текст до однозначно «злоязычной» или «язвительной» жены. Необычное сочетание «мягкий муж» намеренно сохраняет смысловую напряжённость еврейского רַךְ; более привычные толкования вынесены в сноску.
