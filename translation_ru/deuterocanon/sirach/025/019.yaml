  yaml_path: translation/deuterocanon/sirach/025/019.yaml
  text: Any evil is small compared with the evil of a woman[b][a]; may the lot of a sinner fall upon her.
translation:
  language: ru
  text: Всякое зло мало по сравнению со злом женщины[a]; пусть жребий грешника падёт на неё[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всякое зло ничтожно рядом со злом женщины». Еврейский и греческий тексты выражают сравнение, которое по-русски можно передать несколькими способами.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительную часть можно понять и как предсказание: «жребий грешника падёт на неё». Однако греческий параллельный текст поддерживает оттенок пожелания или проклятия.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְעַט רָעָה
  choice: всякое зло мало
  rationale: В контексте сравнительной конструкции מְעַט передаёт не малое количество, а относительную незначительность; «мало» сохраняет краткость и резкость афоризма. Слово רָעָה оставлено как «зло», чтобы не сужать смысл до нравственной порочности или несчастья.
- source_word: כְרָעַת אִשָּׁה
  choice: в сравнении со злом женщины
  rationale: Префикс כְּ выражает сопоставление; развёрнутая русская конструкция ясно передаёт сравнительный смысл. אִשָּׁה означает «женщина», а не обязательно «жена»; суровая гендерная формулировка источника не смягчается.
- source_word: גוֹרַל
  choice: доля
  rationale: גוֹרַל обозначает жребий и выпавшую по жребию долю. «Доля» естественно сочетается в русском с глаголом «выпасть» и сохраняет идею назначенного удела, не вводя более детерминистическое «судьба».
- source_word: חוֹטֵא
  choice: грешника
  rationale: Субстантивированное причастие обозначает человека, который грешит; родительный падеж обусловлен сочетанием «доля грешника».
- source_word: יִפּוֹל עָלֶיהָ
  choice: пусть ... выпадет ей
  rationale: Еврейский yiqtol допускает модально-желательное прочтение, а греческий оптатив ἐπιπέσοι его поддерживает. Дательный «ей» естественно передаёт выпадение доли на чей-либо удел.
theological_decisions:
- issue: Модальность заключительной части
  choice: 'Пожелание или проклятие: «пусть доля грешника выпадет ей»'
  alternative: 'Предсказание: «доля грешника выпадет ей»'
  rationale: Форма еврейского глагола сама по себе допускает оба оттенка, но греческий оптатив усиливает основание для желательного прочтения. Альтернатива отмечена в сноске, чтобы не скрывать неоднозначность.
- issue: Гендерная формулировка
  choice: Сохранено единственное число «женщины»
  alternative: «жены» или обобщённое множественное «женщин»
  rationale: Еврейское אִשָּׁה и греческое γυναικός здесь не требуют значения «жена». Резкость древнего изречения сохранена без смягчения и без расширения до множественного числа.
translation_notes:
  register: Краткий, афористичный и намеренно резкий язык в духе древней литературы мудрости. Современная литературная русская речь без архаизмов; неоднозначность финального глагола и сравнительной конструкции документирована сносками.
