translation:
  language: ru
  text: Как прекрасна мудрость у пожилых, а мысль и совет — у почитаемых!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ὡραία
  choice: Как прекрасна
  rationale: ὡς с прилагательным выражает восклицание; «как прекрасна» сохраняет эстетическую оценку и возвышенный тон.
- source_word: γερόντων
  choice: стариков
  rationale: Родительный множественного числа обозначает пожилых людей; «стариков» прямо передаёт возраст и грамматически мужскую форму исходного текста, не превращая её в обозначение должности «старейшин».
- source_word: σοφία
  choice: мудрость
  rationale: Основное значение центрального для книги Премудрости термина.
- source_word: δεδοξασμένοις
  choice: у людей, почитаемых за славу
  rationale: Субстантивированное причастие совершенного вида обозначает людей, удостоенных почёта и пребывающих в почёте; формулировка передаёт это состояние без богословски нагруженного «прославленных».
- source_word: διανόημα
  choice: рассудительность
  rationale: В параллели с βουλή слово обозначает способность или плод обдумывания; «рассудительность» естественно передаёт практическое разумение.
- source_word: βουλή
  choice: совет
  rationale: В данном контексте означает благоразумный совет или взвешенное решение; «совет» ясно и естественно звучит по-русски.
theological_decisions:
- issue: Референция γερόντων по полу и возрасту
  choice: Сохранено «стариков»
  alternative: «пожилых людей» или «старших»
  rationale: Греческая форма прямо мужская и означает стариков, тогда как контекст сам по себе не доказывает намеренной универсализации. Перевод сохраняет форму источника, не истолковывая её как церковную должность.
- issue: Смысл δεδοξασμένοις
  choice: «у людей, почитаемых за славу»
  alternative: «у почитаемых» или «у прославленных»
  rationale: Выбор сохраняет общественный смысл оказанной чести и избегает возможной ассоциации «прославленных» с посмертным или божественным прославлением.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной афористики. Повтор «как прекрасны» добавлен для естественного русского параллелизма, при этом синтаксическая связь двух частей сохранена.
