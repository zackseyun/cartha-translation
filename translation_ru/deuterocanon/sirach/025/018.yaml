translation:
  language: ru
  text: Муж её сидит среди друзей[a] и стонет, сам не понимая отчего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Муж её возляжет среди своих друзей и, услышав, горько застонал». Вторая часть заметно отличается от сохранившегося еврейского текста.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲלָה
  choice: муж её
  rationale: В данном контексте בַּעַל с суффиксом 3-го лица женского рода обозначает мужа женщины; варианты «господин» или «владелец» здесь неуместны.
- source_word: בֵּין רֵעִים
  choice: среди друзей
  rationale: רֵעִים означает друзей, товарищей или близких; «среди друзей» естественно передаёт общественное окружение мужа, не сужая его до соседей.
- source_word: יֵשֵׁב
  choice: сидит
  rationale: Основное значение еврейского глагола — «сидеть». Настоящее время по-русски подходит для обобщённого описания; греческое «возляжет» отмечено в сноске.
- source_word: וּבְלֹא טַעֲמוֹ
  choice: сам не понимая отчего
  rationale: טַעַם может означать вкус, разумение, рассудительность или понимание. В сочетании с בְּלֹא выражение указывает, что муж не понимает причины своего горестного состояния; перевод сохраняет смысл идиомы в естественной современной русской речи.
- source_word: יִתְאַנָּח
  choice: стонет
  rationale: Глагол обозначает тяжёлый вздох или стон, вызванный горем. «Стонет» передаёт более сильное страдание, чем «вздыхает».
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческого параллельного свидетельства
  choice: 'Основной текст следует еврейскому чтению: муж сидит среди друзей и стонет, не понимая отчего.'
  alternative: 'Греческий текст: «Муж её возляжет среди своих близких и, услышав, горько застонет».'
  rationale: Поскольку еврейский текст данного стиха сохранился и оценён как надёжный, он положен в основу перевода. Существенное расхождение греческого свидетельства, особенно во второй части стиха, не сглажено, а приведено в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Порядок слов «муж её» сохраняет связь с женщиной, о которой говорится в контексте, а формулировка «сам не понимая отчего» естественно передаёт еврейскую идиому без буквального и неясного «без своего вкуса/разума».
