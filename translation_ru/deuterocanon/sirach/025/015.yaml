translation:
  language: ru
  text: Нет головы опаснее головы змеи[a], и нет ярости сильнее ярости врага.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Нет яда опаснее змеиного яда». По-гречески буквально: «нет головы выше головы змеи»; основной перевод сохраняет этот образ, а не заменяет его истолкованием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κεφαλή
  choice: голова
  rationale: Греческий текст прямо употребляет конкретное существительное «голова» в обоих случаях. Возможное метонимическое понимание как «яд» не подменяет исходный образ в основном тексте.
- source_word: ὄφις
  choice: змея
  rationale: «Змея» — естественный современный русский эквивалент без ненужной архаичности слова «змей».
- source_word: θυμός
  choice: ярость
  rationale: Здесь слово обозначает сильный враждебный гнев; «ярость» передаёт его интенсивность и сохраняет параллелизм изречения.
- source_word: ἐχθρός
  choice: враг
  rationale: Обычный и точный русский эквивалент, сохраняющий личностно-реляционный смысл греческого слова.
- source_word: ὑπέρ
  choice: опаснее / сильнее
  rationale: В конструкции сравнения ὑπέρ указывает на превосходство. В первом полустишии его смысл естественно раскрывается как «опаснее», а во втором — как «сильнее»; это делает не вполне естественное для русского буквальное «выше» понятным, не устраняя образ головы змеи.
