  yaml_path: translation/deuterocanon/sirach/025/009.yaml
  text: Blessed is the man who lives with an intelligent wife[a], and who has not slipped with his tongue[c][b], and who has not served one unworthy of him.
translation:
  language: ru
  text: Блажен тот, кто живёт с рассудительной женой[a], кто не оступился в речи[b] и кто не служил человеку, недостойному его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с благоразумной женой»; греческое слово обозначает практическую рассудительность и здравый смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не оступился языком», то есть не допустил промаха в речи.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не был в рабстве у человека, недостойного его»; греческий глагол может обозначать как служение, так и рабскую зависимость.'
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: Блажен
  rationale: Сохраняет традиционный для изречений-блаженств и литературы мудрости возвышенный тон; не сводит смысл к субъективному ощущению счастья.
- source_word: συνοικῶν
  choice: живёт с
  rationale: Естественно передаёт совместную жизнь в одном доме; сочетание с γυναικί в данном контексте указывает на супружескую жизнь.
- source_word: γυναικὶ συνετῇ
  choice: с рассудительной женой
  rationale: «Жена» соответствует брачно-бытовому контексту, а «рассудительная» передаёт практический ум и благоразумие συνετός без акцента лишь на интеллектуальных способностях.
- source_word: ἐν γλώσσῃ οὐκ ὠλίσθησεν
  choice: не оступился в словах
  rationale: Сохраняет метафору преткновения, но выражает её естественно по-русски и не уточняет проступок как «грех» сверх сказанного в греческом тексте.
- source_word: ἐδούλευσεν
  choice: не пришлось служить
  rationale: Передаёт реальное подчинённое служение, не усиливая его до однозначного рабства; конструкция «не пришлось» естественно связывается с оценкой блаженной доли.
- source_word: ἀναξίῳ αὐτοῦ
  choice: человеку, недостойному его
  rationale: Передаёт личное, социально-оценочное отношение без более резких и иерархических формулировок «низшему» или «стоящему ниже».
theological_decisions:
- issue: Мужской род в изречении-блаженстве
  choice: кто
  alternative: муж, который
  rationale: Греческие артикль и относительные местоимения имеют мужской род, однако русское обобщающее «кто» естественно для сентенции и не меняет явно супружеского контекста, заданного словом «женой».
- issue: Степень несвободы в ἐδούλευσεν
  choice: служить
  alternative: быть в рабстве у
  rationale: Глагол допускает как служение, так и рабскую зависимость; ближайший контекст не позволяет уверенно навязать юридический статус раба, поэтому в основном тексте выбрано менее определённое «служить», а сильный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством афористической литературы мудрости. Параллельная трёхчастная структура сохранена; буквальные семитизирующие обороты смягчены там, где они были бы неестественны по-русски.
