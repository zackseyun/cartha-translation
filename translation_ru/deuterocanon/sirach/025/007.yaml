lexical_decisions:
- source_word: στέφανος
  choice: венец
  rationale: Слово обозначает венок или венец как знак чести; «венец» естественно передаёт метафору почёта в возвышенной речи Премудрости.
- source_word: γερόντων
  choice: стариков
  rationale: Форма родительного падежа множественного числа обозначает пожилых людей. «Стариков» сохраняет возрастное значение и не вносит возможного должностного оттенка слова «старейшины».
- source_word: πολυπειρία
  choice: богатый опыт
  rationale: Сложное слово указывает на обширный опыт, накопленный со временем. «Богатый опыт» звучит естественно по-русски и передаёт значение широты и множества пережитого.
- source_word: καύχημα
  choice: хвалятся
  rationale: Существительное может обозначать хвалу, предмет похвалы или то, чем хвалятся. Глагольная конструкция ясно и естественно сохраняет активный смысл греческого выражения.
- source_word: φόβος Κυρίου
  choice: страх перед Господом
  rationale: Сохранено слово «страх», чтобы не сглаживать богословское напряжение устойчивого языка Премудрости; оборот «перед Господом» ясно обозначает направленность страха и естественен в современном русском.
theological_decisions:
- issue: Передача Κυρίου в выражении φόβος Κυρίου
  choice: Господом
  alternative: ГОСПОДОМ
  rationale: Греческий источник содержит Κυρίου, поэтому выбрана обычная передача «Господь», без внесения типографического обозначения еврейского имени Бога, которого непосредственно в данном греческом тексте нет.
- issue: Смысл выражения φόβος Κυρίου
  choice: страх перед Господом
  alternative: благоговение перед Господом
  rationale: Буквальное «страх» сохраняет характерную для литературы Премудрости смысловую напряжённость и не сводит выражение только к благоговению.
translation_notes:
  register: Современный литературный русский с лаконичным, афористичным строем. «Стариков» употреблено в нейтральном возрастном смысле; параллелизм двух частей сохранён, хотя существительное καύχημα естественно передано глагольной конструкцией.
