lexical_decisions:
- source_word: שָׁלֹשׁ
  choice: Три вещи
  rationale: Числительное вводит последующий перечень; добавление слова «вещи» естественно по-русски и согласуется с дальнейшей отсылкой во множественном числе.
- source_word: שָׂנְאָה
  choice: возненавидела
  rationale: Перфект обозначает сформировавшееся, сохраняющее силу неприятие; русское прошедшее совершенного вида передаёт это без искусственной временной конструкции.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: Сохранён образный еврейский оборот, который понятен по-русски и подчёркивает глубину личного отвращения.
- source_word: וְצַר לִי מְאֹד
  choice: и мне очень тяжело
  rationale: Естественный современный оборот, передающий сильную личную тягость и стеснение, не сводя выражение только к гневу или оскорблению.
- source_word: בְּחַיֵּיהֶם
  choice: из-за их жизни
  rationale: Передаёт предлог בְּ и множественную местоименную отсылку максимально близко к еврейскому тексту, сохраняя возможную неоднозначность между самой жизнью этих лиц и их образом жизни.
theological_decisions:
- issue: Резкое расхождение еврейского и греческого текстов в Сир 25:2
  choice: Основной текст переведён по сохранившемуся еврейскому чтению; существенно отличающееся греческое чтение вынесено в сноску.
  alternative: «Согласие братьев, дружба между ближними и жена с мужем, живущие в согласии друг с другом».
  rationale: При наличии еврейского текста он служит основой перевода Сираха. Поскольку греческий свидетель содержит не вариант отдельного слова, а совершенно иное высказывание о трёх социальных благах, расхождение необходимо явно обозначить, не смешивая две текстовые формы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Оборот «душа моя» сохранён ради образности и эмоциональной силы; «из-за их жизни» намеренно не уточнено как «из-за их образа жизни», чтобы не устранять неоднозначность еврейского выражения.
