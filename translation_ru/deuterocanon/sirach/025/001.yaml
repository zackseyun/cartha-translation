lexical_decisions:
- source_word: Ἐν τρισὶν
  choice: В трёх вещах
  rationale: Оборот сохраняет перечислительную структуру и передаёт сферу или основание, в котором говорящая обрела красоту.
- source_word: ὡραιώθην
  choice: я обрела красоту
  rationale: Передаёт результативно-пассивный оттенок аориста ὡραιόω естественным современным русским языком, не сводя образ к почёту или славе.
- source_word: ἀνέστην ὡραία
  choice: предстала прекрасной
  rationale: «Предстала» сохраняет конкретный образ выхода или вставания перед кем-либо, но по-русски звучит естественнее буквального «встала прекрасной».
- source_word: ἔναντι Κυρίου καὶ ἀνθρώπων
  choice: пред Господом и людьми
  rationale: «Пред» кратко и возвышенно передаёт значение присутствия или взора; ἀνθρώπων обозначает людей вообще.
theological_decisions:
- issue: Кто говорит в первом лице женского рода
  choice: 'Сохранить женский род: «обрела», «предстала прекрасной»'
  alternative: Передать без указания рода или мужским родом
  rationale: Греческое ὡραία явно имеет форму женского рода и описывает говорящую; перевод не должен устранять эту грамматическую характеристику.
- issue: Передача Κυρίου
  choice: Господом
  alternative: ГОСПОДОМ
  rationale: В данном греческом свидетельстве стоит Κυρίου; обычное русское «Господь» сохраняет богословскую отнесённость без реконструкции еврейского тетраграмматона.
- issue: Связь ἀνέστην с ὡραία
  choice: предстала прекрасной
  alternative: встала прекрасной / явилась прекрасной
  rationale: Выбранный вариант удерживает телесно-пространственный образ глагола и одновременно избегает неестественной русской конструкции и чрезмерно абстрактного «показалась».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Пред Господом» сохраняет достоинство регистра; женский род следует явной форме ὡραία. Двоеточие оставлено, поскольку стих вводит последующее перечисление.
