  text: If you did not gather in your youth[a], how then would you find anything in your old age?
translation:
  language: ru
  text: Если в юности ты не собирал[a], то как найдёшь в старости?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая форма глагола в этом списке текстуально затруднительна; перевод передаёт её вероятный смысл: «собирать» или «накапливать».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐν νεότητι
  choice: в юности
  rationale: Естественно обозначает период жизни и сохраняет параллель с выражением «в старости».
- source_word: οὐ συναγίοχας
  choice: ты не собирал
  rationale: Переданная греческая форма необычна и, вероятно, текстуально повреждена; перевод отражает наиболее вероятный смысл, связанный с собиранием, не уточняя подразумеваемый предмет.
- source_word: πῶς ἂν εὕροις
  choice: то как найдёшь
  rationale: Риторический вопрос передаёт потенциально-условный оттенок конструкции с ἄν; «то» естественно выражает вывод из первой части.
- source_word: ἐν τῷ γήρᾳ σου
  choice: в старости
  rationale: Сохраняет обозначение жизненного периода и лаконичный параллелизм с «в юности»; принадлежность к адресату ясна из формы обращения и русского контекста.
theological_decisions:
- issue: Подразумеваемый предмет глаголов «собирать» и «находить»
  choice: Не добавлять предмет, оставив его невыраженным.
  alternative: 'Уточнить: «мудрость», «богатство» или «запасы».'
  rationale: В греческом тексте дополнение отсутствует. Эллипсис сохраняет широту изречения и не навязывает ему исключительно духовное либо материальное толкование.
- issue: Необычная форма συναγίοχας
  choice: Передать вероятный смысл «собирал» и отметить текстовую трудность в сноске.
  alternative: Перевести как «накапливал» или «запасал» без оговорки.
  rationale: Так перевод остаётся понятным, но не скрывает неуверенность, присутствующую на уровне источника.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная формулировка с симметрией «в юности — в старости». Неопределённый предмет действия намеренно не восполнен.
