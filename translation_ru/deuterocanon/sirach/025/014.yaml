translation:
  language: ru
  text: Всякая напасть[a], только не напасть от ненавидящих; и всякое возмездие[b], только не возмездие от врагов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякая беда»; греческое слово может означать навлечённое бедствие, нападение или причинённый вред.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческое изречение эллиптично, буквально: «всякая напасть — и не напасть ненавидящих; и всякое возмездие — и не возмездие врагов». Смысл в том, что такая вражда тяжелее прочих бедствий.'
    reason: cultural_note
lexical_decisions:
- source_word: πᾶσαν
  choice: всякая / всякое
  rationale: 'Форма передаёт распределительное значение: лучше любое бедствие или возмездие, чем то, которое исходит от особенно враждебных людей; повтор сохраняет афористический параллелизм.'
- source_word: ἐπαγωγήν
  choice: напасть
  rationale: 'Существительное обозначает то, что навлекают на человека: бедствие, нападение или причинённый вред. «Напасть» сохраняет широту значения и связь с целенаправленным враждебным действием, не ограничивая смысл телесной раной.'
- source_word: μισούντων
  choice: ненавидящих
  rationale: 'Субстантивированное причастие передано причастием, сохраняющим активный смысл: речь о тех, кто ненавидит.'
- source_word: ἐκδίκησιν
  choice: отмщение
  rationale: Слово означает ответное карательное воздаяние. «Отмщение» уместно в достоинственном афористическом регистре и точнее «наказания» передаёт мотив возмездия.
- source_word: ἐχθρῶν
  choice: врагов
  rationale: Обычный и ясный эквивалент родительного падежа множественного числа, сохраняющий личностный характер вражды.
theological_decisions:
- issue: Толкование эллиптического сравнительного изречения
  choice: Сохранена безглагольная формула «всякая X, только не Y», подразумевающая, что вред от ненавидящих и возмездие врагов тяжелее иных бедствий.
  alternative: 'Развернуть смысл как восклицательное сравнение: «Нет напасти хуже напасти от ненавидящих и нет отмщения хуже отмщения врагов».'
  rationale: Греческий текст намеренно краток и эллиптичен. Русская конструкция с «только не» передаёт подразумеваемое предпочтение, не добавляя отсутствующего в оригинале сказуемого и не устраняя его афористическую напряжённость.
- issue: Объём значения ἐπαγωγή
  choice: В основном тексте — «напасть».
  alternative: «Беда», «бедствие», «нападение» или «рана».
  rationale: Значение слова здесь не вполне определённо. «Напасть» допускает как причинённый вред, так и более широкое бедствие; варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным афористическим строем. «Только не» естественно выражает эллиптическое сравнение; «отмщение» сохраняет возвышенную серьёзность исходного параллелизма.
