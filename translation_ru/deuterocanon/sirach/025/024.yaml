translation:
  language: ru
  text: От женщины — начало греха,[a] и из-за неё все мы умираем.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятно, это краткая отсылка к женщине в древнем рассказе о грехопадении; сам стих не уточняет её имени и не развивает эту мысль.
    reason: cross_reference
  - marker: b
    text: 'Или: «и из-за неё все мы умерли (погибли)». Еврейская форма может обозначать завершённое действие, тогда как греческий текст говорит: «все мы умираем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאִשָּׁה
  choice: От женщины
  rationale: Предлог מִן обозначает источник или происхождение; «от женщины» сохраняет эту силу и соответствует греческому ἀπὸ γυναικός. Слово אִשָּׁה здесь передано как «женщина», а не «жена», поскольку брачные отношения прямо не обозначены.
- source_word: תְחִלַת עָוֹן
  choice: начало греха
  rationale: תְחִלָּה означает начало, а עָוֹן в данном контексте естественно передать словом «грех»; греческое ἀρχὴ ἁμαρτίας подтверждает это понимание. Именная конструкция сохранена без добавления глагола «пришло».
- source_word: וּבִגְלָלָהּ
  choice: и из-за неё
  rationale: בגלל выражает причинную связь. «Из-за неё» — ясный современный русский эквивалент, не усиливающий инструментальный оттенок.
- source_word: גָוַעְנוּ
  choice: умираем
  rationale: Глагол גוע означает «умирать, испускать дух». Хотя еврейская форма может описывать завершённое действие («мы умерли/погибли»), греческое ἀποθνήσκομεν имеет настоящее время и поддерживает универсальное «умираем».
- source_word: יַחַד
  choice: все мы ... вместе
  rationale: יַחַד буквально означает «вместе, сообща». Перевод сохраняет этот оттенок, тогда как «все» также отражено местоименной конструкцией «все мы» и согласуется с греческим πάντες.
theological_decisions:
- issue: Обобщённое отнесение начала греха и смерти к женщине
  choice: Сохранить прямую формулировку «От женщины — начало греха»
  alternative: 'Смягчить или конкретизировать: «Из-за Евы начался грех»'
  rationale: Еврейский и греческий тексты говорят о «женщине» в единственном числе и, вероятно, отсылают к рассказу о грехопадении, но сам стих не называет Еву и не развивает богословское объяснение. Поэтому гендерная формулировка и её напряжённость сохранены без внесения имени или дополнительных выводов.
- issue: Временная форма утверждения о смерти
  choice: «все мы умираем вместе»
  alternative: «все мы умерли (или погибли) вместе»
  rationale: Еврейская форма допускает завершённое действие, но греческая параллель поддерживает настоящее, обобщённое значение. Альтернатива отмечена в сноске, чтобы сохранить подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичной, афористичной интонацией. Тире естественно передаёт бессвязочную именную конструкцию первой части. Сохранены прямота гендерной формулировки и буквальный коллективный оттенок «вместе».
