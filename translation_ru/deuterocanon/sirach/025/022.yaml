lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет пояснительную связь с предшествующим изречением и естественно звучит в русском мудростном тексте.
- source_word: בַעֲדָהּ
  choice: из-за неё
  rationale: 'Передаёт причинное значение предлога с местоименным суффиксом: она выступает причиной или поводом для названного позора.'
- source_word: חֶרְפָּה
  choice: поношение
  rationale: Сохраняет общественный аспект позора, упрёка и бесчестья, не сливая его со следующим словом «стыд».
- source_word: וּבֹשֶׁת
  choice: стыд
  rationale: Прямо передаёт существительное, обозначающее стыд или унижение, и сохраняет парное сочетание с חֶרְפָּה.
- source_word: אִשָּׁה
  choice: жена
  rationale: Хотя слово может означать «женщина», выражение «своего мужа» однозначно задаёт брачный контекст.
- source_word: מְכַלְכֶּלֶת
  choice: содержит
  rationale: Причастие от כלכל означает материально обеспечивать, снабжать или поддерживать. «Содержит» ясно выражает материальный характер действия и согласуется с греческим ἐπιχορηγῇ.
- source_word: אֶת בַּעֲלָהּ
  choice: своего мужа
  rationale: В данном брачном контексте בעל означает «муж»; возвратное «своего» естественно соотносит его с подлежащим «жена».
theological_decisions:
- issue: Следует ли пояснять или смягчать древнюю оценку материального содержания мужа женой
  choice: Сохранить прямое утверждение о поношении и стыде без редакционного смягчения или одобрительного пояснения.
  alternative: Добавить в основной текст указание на древние общественные представления либо смягчить оценочное суждение.
  rationale: Перевод должен передавать риторику источника, не усиливая её и не подменяя современным комментарием.
- issue: Значение אִשָּׁה
  choice: жена
  alternative: женщина
  rationale: Упоминание «своего мужа» определяет слово как обозначение супруги, а не женщины вообще.
translation_notes:
  register: Современный литературный русский с достоинством афористического текста. Тире выделяет именную пару «поношение и стыд», а придаточное с «когда» явно связывает её с ситуацией, описанной во второй части. Формулировка не добавляет осуждения сверх исходного текста.
