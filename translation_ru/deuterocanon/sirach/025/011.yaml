  text: Happy is the husband of a prudent wife[b][a], and who does not plow with an ox and a donkey together.
translation:
  language: ru
  text: Счастлив муж, у которого рассудительная жена и который не пашет, запрягши вместе быка и осла.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст содержит существенно иное чтение: «Как велик тот, кто обрёл мудрость, но нет никого выше того, кто боится Господа».'
    reason: alternative_reading
  - marker: b
    text: Этот образ, вероятно, отсылает ко Второзаконию 22:10, где запрещено пахать, запрягши вместе быка и осла; здесь он служит пословичным образом несочетаемой пары.
    reason: cross_reference
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Счастлив
  rationale: Формула блаженства указывает на достойное зависти благополучие; «счастлив» естественно звучит в современной русской литературной речи и не усиливает религиозный оттенок сверх самого еврейского слова.
- source_word: בַעַל אִשָּׁה
  choice: муж, у которого … жена
  rationale: Буквально сочетание имеет вид «владелец/муж женщины», но служит обычным обозначением мужа. Описательная русская конструкция передаёт смысл без неуместного оттенка собственности.
- source_word: מַשְׁכָּלֶת
  choice: рассудительная
  rationale: Слово обозначает здравомыслие и умение разумно поступать; «рассудительная» точнее передаёт практическую мудрость, чем отвлечённое «умная».
- source_word: חוֹרֵשׁ
  choice: пашет
  rationale: Причастная форма обозначает совершающего пахоту; в русском предложении естественно передаётся личной формой глагола.
- source_word: בְּשׁוֹר וְבַחְמוֹר יַחְדָּו
  choice: вместе на быке и осле
  rationale: Передаёт оба животных и наречие «вместе», сохраняя отсылку к Второзаконию 22:10 и не добавляя отсутствующего в тексте прямого упоминания ярма.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческой традиции
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; греческое чтение приведено в примечании.
  alternative: 'Греческий текст: «Как велик тот, кто обрёл мудрость, но нет никого выше боящегося Господа».'
  rationale: Еврейское и греческое чтения представляют здесь совершенно разные изречения. Их нельзя безосновательно согласовывать; приоритет отдан имеющемуся еврейскому тексту, а значимое греческое разночтение сохранено открыто.
translation_notes:
  register: Современный литературный русский язык с лаконичной интонацией изречения мудрости. Синтаксис слегка расправлен ради ясности, но параллель между двумя характеристиками счастливого мужа сохранён; образ несочетаемых животных оставлен без пояснения в основном тексте.
