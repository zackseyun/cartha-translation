translation:
  language: ru
  text: Блажен тот, кто обрёл рассудительность, и тот, кто излагает перед слушающими.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «излагает в уши слышащих». Глагол может означать «рассказывает», «излагает» или «объясняет»; выражение образно обозначает речь, обращённую к слушателям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Блажен
  rationale: Сохраняет характерную для библейской литературы мудрости формулу о достойном зависти, благом состоянии человека; «счастлив» было бы семантически возможно, но менее торжественно.
- source_word: εὗρε
  choice: обрёл
  rationale: Передаёт завершённое обретение и его сохраняющийся результат; в данном изречении звучит естественнее, чем нейтральное «нашёл».
- source_word: φρόνησιν
  choice: рассудительность
  rationale: φρόνησις обозначает практическое разумение и здравое суждение. «Рассудительность» сохраняет этот оттенок и не смешивает слово без необходимости с более общим понятием мудрости.
- source_word: διηγούμενος
  choice: тот, кто рассказывает
  rationale: Причастие от διηγέομαι может означать рассказывать, излагать или объяснять. «Рассказывает» естественно по-русски и не сужает значение до специального толкования.
- source_word: εἰς ὦτα ἀκουόντων
  choice: тем, кто слушает
  rationale: Естественно передаёт адресованную речь и сохраняет причастную характеристику воспринимающих её людей; буквальный образ «в уши» пояснён в сноске.
