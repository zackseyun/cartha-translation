  text: My son[a], in your prosperity walk in humility, and you will be loved more than one who gives gifts.
translation:
  language: ru
  text: Сын мой[a], в достатке своём живи смиренно — и тебя будут любить больше, чем любят того, кто раздаёт подарки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Дитя, совершай свои дела с кротостью, и ты будешь любим достойным человеком». Еврейский текст гласит: «Сын мой, в достатке своём живи смиренно — и тебя будут любить больше, чем любят того, кто раздаёт подарки».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Мужское существительное единственного числа с суффиксом первого лица; передаёт прямое обращение и следует сохранившемуся еврейскому тексту.
- source_word: בְּעָשְׁרְךָ
  choice: в достатке своём
  rationale: Слово связано с богатством и материальным благополучием. «В достатке» звучит естественно по-русски и сохраняет указание на обеспеченное состояние.
- source_word: הִתְהַלֵּךְ
  choice: живи
  rationale: Форма глагола «ходить» здесь идиоматически обозначает образ жизни и поведения. Русское «живи» естественно передаёт этот этический смысл.
- source_word: בַּעֲנָוָה
  choice: смиренно
  rationale: Передаёт ענוה как смирение и скромность; наречие естественно сочетается с «живи».
- source_word: וְתֵאָהֵב
  choice: и тебя будут любить
  rationale: 'Сохраняет пассивное значение: адресат станет объектом любви. Будущее время выражает ожидаемый результат наставления.'
- source_word: מִנּוֹתֵן מַתָּנוֹת
  choice: больше, чем того, кто раздаёт подарки
  rationale: Сравнительный מן и причастная конструкция переданы явно. «Раздаёт подарки» подчёркивает не единичный акт, а характерное действие дарителя.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческой параллели
  choice: 'В основном тексте следовать еврейскому чтению: достаток, смиренная жизнь и любовь большая, чем к раздающему подарки.'
  alternative: 'Греческое чтение: «Дитя, совершай свои дела с кротостью, и тебя полюбит достойный человек».'
  rationale: Сохранившийся еврейский текст имеет высокий уровень уверенности и потому положен в основу перевода. Существенно отличающееся греческое чтение сохранено в сноске, без попытки искусственно согласовать обе формы текста.
translation_notes:
  register: Современный литературный русский язык; наставительный и достойный тон. Метафорическое «ходи» заменено более естественным русским «живи», а существенное расхождение с греческой традицией вынесено в сноску.
