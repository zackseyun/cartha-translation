lexical_decisions:
- source_word: לֵב כָּבֵד
  choice: тяжёлое сердце
  rationale: Буквально сохраняет образ еврейского текста. Выражение может подразумевать внутреннюю отягощённость, нечуткость или упорство; греческая традиция передаёт его как «жёсткое сердце».
- source_word: יִרְבּוּ מַכְאֹבָיו
  choice: умножает свои страдания
  rationale: Передаёт увеличение множества болей или страданий и сохраняет отнесение местоименного суффикса к сердцу. «Страдания» естественно охватывают как телесную боль, так и душевную скорбь.
- source_word: וּמִתְהוֹלֵל
  choice: тот, кто ведёт себя безрассудно
  rationale: Трудная форма допускает оттенки необузданного поведения, самозаблуждения и хвастливого высокомерия. Выбранная формулировка передаёт практический нравственный смысл, не сводя слово к одному узкому толкованию.
- source_word: מוֹסִיף
  choice: прибавляет
  rationale: Прямо передаёт значение причастия «добавляет, продолжает добавлять» и естественно сочетается с последующей формулой накопления.
- source_word: עָוֹן עַל עָוֹן
  choice: грех ко греху
  rationale: Сохраняет образ последовательного накопления проступков. В данном нравоучительном контексте עָוֹן естественнее всего передать словом «грех», хотя оно может также обозначать вину или беззаконие.
theological_decisions:
- issue: Расхождение еврейского и греческого свидетельств в первой части стиха
  choice: В основном тексте следовать высоконадёжному еврейскому чтению «Тяжёлое сердце умножает свои страдания».
  alternative: 'Греческий параллельный текст: «жёсткое сердце пострадает в конце» и «жёсткое сердце будет отягощено в конце».'
  rationale: Сохранившийся еврейский текст является здесь первичным источником, однако греческое свидетельство существенно отличается и не должно быть скрыто. Поэтому его чтение приведено в сноске без попытки искусственно согласовать обе традиции.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной речи. Сохранены краткий параллелизм, образ «тяжёлого сердца» и формула накопления «грех ко греху»; подлинная текстовая и лексическая неоднозначность вынесена в сноски.
