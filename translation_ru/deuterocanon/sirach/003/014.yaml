base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/014.yaml
  text: A father's righteousness will not be wiped away[a], and in place of sins it will be planted.
translation:
  language: ru
  text: Добро, оказанное отцу, не изгладится[a], и вместо грехов оно будет насаждено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Ибо милостыня, оказанная отцу, не будет забыта, и вместо грехов будет воздвигнута для тебя». Греческий текст несколько отличается от еврейского, особенно словами «милостыня» и «будет воздвигнута для тебя».'
    reason: alternative_reading
lexical_decisions:
- source_word: צִדְקַת אָב
  choice: праведность отца
  rationale: 'Еврейское сочетание буквально означает «праведность отца». Перевод сохраняет широкий нравственный смысл צְדָקָה и грамматическую неоднозначность: речь может идти как о праведности, связанной с отцом, так и, с учётом контекста, о праведном отношении к нему. Более узкое «милостыня» отражает греческую параллель, но не основной еврейский текст.'
- source_word: לֹא תִּמָּחֶה
  choice: не изгладится
  rationale: Форма от מחה передаёт образ стирания или удаления. «Не изгладится» естественно звучит в современном литературном русском и сохраняет оттенок того, что поступок не будет вычеркнут из памяти или счёта.
- source_word: וּתְמוּר
  choice: и вместо
  rationale: תמור обозначает замену или обмен. «Вместо» сохраняет эту сильную связь, не объясняя её как конкретный механизм искупления или заслуги.
- source_word: חַטָּאת
  choice: грехов
  rationale: В данном контексте слово обозначает нравственные проступки; множественное число согласуется с греческой параллелью ἁμαρτιῶν и лучше передаёт смысл, чем культовое «жертва за грех».
- source_word: הִיא תְּנַתֵּעַ
  choice: она будет насаждена
  rationale: Глагол связан с נטע, «сажать, насаждать». Женское местоимение «она» отсылает к «праведности». «Будет насаждена» сохраняет необычный образ еврейского текста и не добавляет отсутствующее в нём «для тебя»; греческое «будет воздвигнута для тебя» отмечено в сноске.
theological_decisions:
- issue: Обещает ли стих заслугу, заменяющую или искупающую грехи
  choice: Сохранено прямое выражение «вместо грехов» без разъяснения механизма.
  alternative: Праведный поступок будет памятен, несмотря на грехи; он искупит грехи; он приведёт к восстановлению после греха.
  rationale: Текст употребляет сильный язык нравственного воздаяния, но не формулирует развитого учения об искуплении или сокровищнице заслуг. Перевод сохраняет богословское напряжение и не сужает смысл.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Не изгладится» и «будет насаждена» сохраняют образность оригинала без архаической грамматики. Необычная метафора насаждения намеренно не сглажена.
