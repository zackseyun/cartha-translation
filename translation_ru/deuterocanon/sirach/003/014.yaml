  terminology: '«Добро» здесь шире, чем «милостыня», и уместнее, чем «праведность отца», поскольку не приписывает праведность самому отцу. Сноска корректно отмечает отличия греческого текста: «милостыня/милосердие» и «будет воздвигнута для тебя».'
