translation:
  language: ru
  text: Умаляй себя во всяком величии[a] — и пред Богом найдёшь милость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно греческой параллели: «Чем ты выше, тем больше смиряй себя».'
    reason: Еврейское מִכָּל גְּדוּלָה буквально и сжато означает «от/при всяком величии», тогда как греческий текст выражает сравнительную связь явно.
lexical_decisions:
- source_word: מַעֵט נַפְשְךָ
  choice: Умаляй себя
  rationale: 'Буквально: «уменьшай себя». Русское «умаляй себя» сохраняет образ добровольного самоумаления и повелительную форму, не сводя смысл только к внутреннему чувству смирения.'
- source_word: מִכָּל גְּדוּלָה
  choice: во всяком величии
  rationale: 'Необычное еврейское сочетание передано достаточно формально. Оно допускает понимание как «при любом величии/высоком положении»; греческая параллель раскрывает смысл: «чем ты больше, тем больше смиряй себя».'
- source_word: וְלִפְנֵי אֵל
  choice: и пред Богом
  rationale: Сохраняет пространственно-судебный оттенок «перед лицом Бога» в естественной для возвышенной русской речи краткой форме.
- source_word: תִּמְצָא רַחֲמִים
  choice: найдёшь милость
  rationale: רַחֲמִים может обозначать милосердие или сострадание; в конструкции «найти» по-русски естественно «найти милость», что также сохраняет библейскую формулу.
theological_decisions:
- issue: Соотношение величия и смирения
  choice: Сохранён прямой еврейский образ самоумаления «во всяком величии».
  alternative: «Чем ты выше, тем больше смиряй себя».
  rationale: Альтернатива яснее и согласуется с греческой параллелью, однако превращает сжатое еврейское выражение в явно сравнительную конструкцию. Основной текст сохраняет подлинную неоднозначность, а сноска сообщает традиционное греческое прочтение.
- issue: רַחֲמִים как результат перед Богом
  choice: «милость»
  alternative: «милосердие» или «сострадание»
  rationale: «Найдёшь милость пред Богом» — естественная библейская формула, не уточняющая сверх источника характер божественного благоволения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Форма «пред Богом» выбрана ради краткости и достоинства; редкое «умаляй себя» намеренно сохраняет конкретный образ еврейского текста. Сноска отмечена в основном тексте.
