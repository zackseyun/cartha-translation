base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/021.yaml
  text: Do not seek what is too wondrous for you[a], and do not search out what is hidden from you.
translation:
  language: ru
  text: Не ищи того, что слишком дивно для тебя[a], и не исследуй того, что от тебя сокрыто.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к греческой параллели: «Не ищи того, что труднее тебя, и не исследуй того, что сильнее тебя». Еврейский текст говорит о том, что слишком дивно и сокрыто от человека; греческий — о том, что превосходит его возможности.'
    reason: alternative_reading
lexical_decisions:
- source_word: פְּלָאוֹת
  choice: того, что для тебя слишком дивно
  rationale: Форма множественного числа от פלא обозначает дивное, необычайное. В сочетании с מִמְּךָ и с учётом греческой параллели речь идёт о предметах, превышающих возможности человека, а не только о чудесах.
- source_word: מִמְּךָ
  choice: для тебя
  rationale: Буквально «от тебя», но здесь оборот указывает на предел доступного человеку. Сочетание «для тебя слишком дивно» естественно передаёт этот смысл по-русски.
- source_word: אַל תִּדְרוֹשׁ
  choice: не ищи
  rationale: דרש может означать искать, допытываться или исследовать. «Не ищи» сохраняет краткость и прямую побудительную силу исходного текста.
- source_word: וּמְכֻסֶּה מִמְּךָ
  choice: того, что от тебя сокрыто
  rationale: Причастие от כסה означает покрытое или скрытое. «От тебя сокрыто» сохраняет образ и близко следует еврейскому выражению.
- source_word: אַל תַּחְקוֹר
  choice: не исследуй
  rationale: חקר обозначает тщательное разыскание, исследование или испытание; «исследуй» передаёт более настойчивый характер действия по сравнению с דרש.
- source_word: χαλεπότερά σου / ἰσχυρότερά σου
  choice: учтено в выражении «для тебя слишком дивно»
  rationale: Греческая параллель — «более трудного, чем ты» и «более сильного, чем ты» — подтверждает смысл пределов человеческих возможностей, хотя не заменяет засвидетельствованный еврейский образ.
theological_decisions:
- issue: Запрещает ли стих всякое исследование тайн или предостерегает от попыток постичь недоступное человеку
  choice: Предостережение мудрости против поиска того, что превосходит человеческие пределы или остаётся сокрытым
  alternative: Безусловный запрет на исследование богословских тайн
  rationale: Еврейский текст подчёркивает дивное сверх меры и сокрытое от человека, а греческий — более трудное и сильное, чем он. Перевод сохраняет призыв к смирению, не превращая его в явно выраженный всеобщий запрет на познание.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Дивно» сохраняет возвышенный оттенок еврейского פלא, оставаясь понятным; параллелизм глаголов передан как «не ищи / не исследуй».
