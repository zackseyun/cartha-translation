base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/015.yaml
  text: In the day of distress it will be remembered for your benefit; like heat upon frost[a], your sins will be blotted out.
translation:
  language: ru
  text: В день бедствия это будет вспомнено тебе во благо; как тепло на инее[a], так исчезнут твои грехи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «как ясная погода на морозе, так растворятся твои грехи». В еврейском тексте — «тепло на инее». В обоих случаях изображено исчезновение замёрзшей влаги.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹם צָרָה
  choice: В день бедствия
  rationale: Сохраняет временную формулу и передаёт צָרָה как тяжёлое бедствие или невзгоду естественным литературным русским языком.
- source_word: תִּזָּכֵר לָךְ
  choice: это будет вспомнено тебе во благо
  rationale: Форма женского рода, вероятно, отсылает к названному в контексте почитанию родителей или соответствующему благому делу. Дательный לָךְ передан как дательный пользы, без уточнения неназванного деятеля.
- source_word: כְּחֹם עַל כְּפוֹר
  choice: как тепло на инее
  rationale: Еврейские חֹם и כְּפוֹר буквально обозначают тепло и иней/мороз. «Иней» создаёт по-русски ясный образ того, что исчезает от тепла; первичным остаётся еврейское чтение, тогда как греческий параллельный текст отражён в примечании.
- source_word: לְהַשְׁבִּית עֲוֹנֶיךָ
  choice: так исчезнут твои грехи
  rationale: השׁבית означает заставить прекратиться, устранить. В контексте сравнения перевод «исчезнут» удерживает и значение удаления, и образ инея, пропадающего от тепла; עוון передано доступным словом «грехи», без сужения только до вины.
theological_decisions:
- issue: Связь почитания родителей с устранением грехов
  choice: 'Сохранено прямое соположение: прежнее благое дело будет вспомнено человеку во благо, и его грехи исчезнут.'
  alternative: Истолковать стих либо как механическое заслуживание прощения, либо только как общее обещание помощи в беде.
  rationale: Текст связывает память о поступке с устранением грехов, но не объясняет механизм этой связи. Перевод сохраняет богословское напряжение и не вводит позднейшую систематизацию.
- issue: Неявный деятель пассивного глагола תִּזָּכֵר
  choice: Сохранена безлично-пассивная формулировка «это будет вспомнено».
  alternative: «Бог вспомнит это» или «о тебе вспомнят».
  rationale: Еврейский текст прямо не называет деятеля и грамматически, вероятнее всего, говорит о воспоминании прежнего дела, а не самого человека.
translation_notes:
  register: Современный литературный русский язык с достоинством премудростной литературы. Синтаксический параллелизм сохранён; «это» естественно отсылает к поступку, названному в ближайшем контексте, не конкретизируя его внутри данного стиха.
