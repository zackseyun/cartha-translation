base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/016.yaml
  text: For one who despises his father is insolent[b][a], and one who provokes his mother is cursed by his Creator.
translation:
  language: ru
  text: Ибо тот, кто презирает своего отца, поступает дерзко[a], а тот, кто проклинает свою мать, гневит своего Создателя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступает самонадеянно». В греческом параллельном тексте: «подобен богохульнику тот, кто оставляет отца».'
    reason: Лексическая альтернатива и вариант греческого параллельного текста.
  - marker: b
    text: 'Греческий параллельный текст иначе строит вторую часть стиха: «и проклят Господом тот, кто гневит свою мать».'
    reason: Существенное различие между ясным еврейским текстом и греческим параллельным чтением.
lexical_decisions:
- source_word: מֵזִיד
  choice: поступает дерзко
  rationale: Причастная форма от זיד выражает высокомерное, самонадеянное поведение. Наречная конструкция естественна по-русски и сохраняет нравственную тяжесть еврейского выражения, не придавая ему более узкого значения «богохульствует».
- source_word: בּוֹזֶה
  choice: презирает
  rationale: בזה означает считать ничтожным, относиться с презрением. «Презирает» прямо и естественно передаёт смысл в контексте почитания родителей.
- source_word: מַכְעִיס
  choice: гневит
  rationale: Порода hifil от כעס означает «вызывать гнев, раздражать». В еврейском порядке слов объектом этого действия служит «своего Создателя».
- source_word: בּוֹרְאוֹ
  choice: своего Создателя
  rationale: 'Буквально: «его Создателя». Возвратное притяжательное местоимение по-русски ясно связывает Создателя с действующим лицом и сохраняет богословски значимое именование Бога.'
- source_word: מְקַלֵּל
  choice: проклинает
  rationale: Причастие piel от קלל здесь имеет активное значение «проклинающий». Оно образует подлежащее второго высказывания вместе с дополнением «свою мать».
- source_word: אִמּוֹ
  choice: свою мать
  rationale: Суффикс третьего лица передан русским возвратным местоимением «свою», естественным при совпадении обладателя с подлежащим.
theological_decisions:
- issue: Синтаксические роли во второй части еврейского текста
  choice: тот, кто проклинает свою мать, гневит своего Создателя
  alternative: тот, кто гневит свою мать, проклят своим Создателем
  rationale: Еврейская последовательность וּמַכְעִיס בּוֹרְאוֹ מְקַלֵּל אִמּוֹ естественно разбирается как сказуемое с дополнением («гневит своего Создателя») перед причастным подлежащим с дополнением («проклинающий свою мать»). Греческий параллельный текст отражает иное построение, поэтому оно отмечено в сноске, но не подменяет ясное еврейское чтение.
- issue: Передача מֵזִיד с учётом греческого βλάσφημος
  choice: поступает дерзко
  alternative: подобен богохульнику
  rationale: Еврейское слово обозначает дерзкое, самонадеянное поведение и само по себе не требует специфического значения «богохульник». Более резкая греческая характеристика сохранена в сноске как параллельное чтение.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Гневит» сохраняет причинное значение глагола и звучит достойно, хотя несколько возвышенно; это уместно для наставительной литературы. Перевод следует высоконадёжному еврейскому тексту, а расхождения с греческим параллельным свидетельством открыто вынесены в сноски.
