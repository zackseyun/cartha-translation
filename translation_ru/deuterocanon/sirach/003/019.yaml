  text: πολλοὶ εἰσιν ὑψηλοὶ καὶ ἐπίδοξοι· ἀλλὰ πραέσιν ἀποκαλύπτεται μυστήρια.
  language: Greek
  pages: []
  confidence: high
base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/019.yaml
  text: Many are lofty and renowned[a], but mysteries are revealed to the gentle.
translation:
  language: ru
  text: Много великих и прославленных, но тайны открываются кротким[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «смиренным». Греческое πραέσιν обозначает людей кротких, мягких и незаносчивых.
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: много
  rationale: Сохраняет неопределённое множественное значение и краткую, афористичную форму греческого текста.
- source_word: ὑψηλοὶ
  choice: великих
  rationale: Передаёт образ высокого положения или величия применительно к людям; буквальное «высоких» по-русски здесь звучало бы неестественно и могло бы быть понято как указание на рост.
- source_word: ἐπίδοξοι
  choice: прославленных
  rationale: Передаёт общественную известность и почёт, заключённые в слове ἐπίδοξοι, естественным современным русским выражением.
- source_word: πραέσιν
  choice: кротким
  rationale: Передаёт мягкий, незаносчивый и не склонный к самоутверждению характер; возможный оттенок смирения сохранён в сноске.
- source_word: ἀποκαλύπτεται
  choice: открываются
  rationale: Сохранён пассивный смысл без указания того, кто открывает тайны; русское множественное число согласовано с подлежащим «тайны».
- source_word: μυστήρια
  choice: тайны
  rationale: Прямо и естественно передаёт скрытые, ещё не открытые вещи, не добавляя специальных культовых или доктринальных оттенков.
theological_decisions:
- issue: 'Передача πραέσιν: «кротким», «смиренным» или «мягким»'
  choice: кротким
  alternative: смиренным
  rationale: «Кротким» лучше сохраняет значение мягкости и неагрессивной, незаносчивой расположенности. Контраст с великими и прославленными допускает также оттенок смирения, поэтому альтернативное прочтение отмечено в сноске.
- issue: Кем открываются тайны
  choice: 'Сохранена безличная пассивная конструкция: «тайны открываются»'
  alternative: «Бог открывает тайны»
  rationale: Греческий текст не называет деятеля прямо; добавление Бога как подлежащего устранило бы намеренную недосказанность текста.
translation_notes:
  register: Краткий, афористичный и достойный современный литературный русский. Синтаксический контраст исходного текста сохранён; богословски значимая пассивная форма не конкретизирована.
