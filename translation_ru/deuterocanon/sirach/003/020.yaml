lexical_decisions:
- source_word: רַבִּים רַחֲמֵי אֱלֹהִים
  choice: многочисленны милости Божьи
  rationale: Сохраняет множественное число еврейского רַחֲמֵי и предикативное значение רַבִּים («многочисленны, многочисленны по числу»), передавая обилие проявлений Божьего милосердия без сведения их к абстрактному единственному числу.
- source_word: וְלַעֲנָוִים
  choice: и смиренным
  rationale: «Смиренные» естественно передаёт нравственный и социальный смысл עֲנָוִים в литературе мудрости; «кроткие» было бы уже по значению и сильнее окрашено традиционной терминологией.
- source_word: יְגַלֶּה
  choice: Он открывает
  rationale: Глагол גלה с объектом סוד означает раскрытие или сообщение сокровенного. «Открывает» звучит естественно по-русски и не добавляет толкования.
- source_word: סוֹדוֹ
  choice: Свою тайну
  rationale: סוד может обозначать тайну, доверительно сообщаемый замысел или сокровенный совет. «Тайну» — прямой эквивалент; возвратное «Свою» ясно соотносит её с Богом.
theological_decisions:
- issue: Существенное расхождение между сохранившимся еврейским текстом и греческой параллелью
  choice: 'В основном тексте следовать еврейскому свидетельству: «Ибо многочисленны милости Божьи, и смиренным Он открывает Свою тайну».'
  alternative: 'Греческая параллель: «Ибо велико владычество Господа, и смиренные прославляют Его».'
  rationale: Сохранившийся еврейский текст имеет высокий уровень уверенности и является первичным источником для основного перевода. Греческий текст отражает существенно иную форму всего стиха, поэтому он приведён в примечании, а не объединён с еврейским чтением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, пригодным для Писания звучанием. Инверсия «многочисленны милости Божьи» сохраняет еврейскую структуру и множественное число, оставаясь понятной читателю. Заглавные местоимения в отношении Бога применены последовательно внутри стиха.
