  source_fidelity: 'Основной текст верно следует сохранившемуся еврейскому чтению: רַבִּים передано как «многочисленны», רַחֲמֵי сохранено во множественном числе («милости»), אֱלֹהִים — как «Бог», а סוֹדוֹ — как «Свою тайну». Неоднозначность слова סוֹד надлежащим образом отмечена. Однако греческая параллель содержит страдательную форму δοξάζεται: буквально «Он прославляется смиренными», а не активное «смиренные прославляют Его».'
