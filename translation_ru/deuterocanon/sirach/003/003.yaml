base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/003.yaml
  text: Whoever honors his father makes atonement for his sins[b][a], and whoever honors his mother stores up treasure.
translation:
  language: ru
  text: Кто почитает отца, тому будет искуплен грех[a], а кто почитает мать, тот собирает сокровище[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его грех будет искуплен». В еврейском тексте стоит единственное число; оно может иметь собирательный смысл. В греческой параллели — «грехи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «откладывает сокровище в запас». Образ говорит о сохранении и накоплении ценности, подобно богатству.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַבֵּד
  choice: почитает
  rationale: Причастная форма породы пиэль от כבד означает оказывать должную честь. «Почитает» естественно передаёт нравственную обязанность перед отцом и матерью; «уважает» было бы слабее, а «прославляет» — чрезмерно возвышенно.
- source_word: אָב
  choice: отца
  rationale: В еврейском тексте прямо назван отец в единственном числе; это сохраняет параллелизм с матерью во второй части стиха.
- source_word: תְּכֻפַּר חַטָּאתוֹ
  choice: тому будет искуплен грех
  rationale: Еврейская пассивная форма от כפר выражает искупление греха. Конструкция с «тому» звучит естественно по-русски и сохраняет пассивность исходного текста, не превращая почитающего отца в явно названного совершителя искупления.
- source_word: וְגוֹנֵז אוֹצָר
  choice: собирает сокровище
  rationale: גנז обозначает складывание или сохранение ценности в запасе, а אוצר — сокровище. «Собирает сокровище» сохраняет образ накопляемого воздаяния без отрицательного оттенка слова «копит» или «припрятывает».
- source_word: אִמּוֹ
  choice: мать
  rationale: Суффикс означает «его мать»; в русской обобщённо-личной конструкции «кто почитает мать» естественно передаёт тот же смысл без тяжеловесного повторения местоимения.
theological_decisions:
- issue: Искупление греха в контексте литературы мудрости
  choice: 'Сохранить прямую лексику искупления: «тому будет искуплен грех».'
  alternative: «тому простятся грехи»; «тот заглаживает свои грехи»
  rationale: Еврейское כפר и греческое ἐξιλάσεται имеют искупительное значение. Перевод не ослабляет утверждение до общей нравственной пользы и вместе с тем не уточняет механизм искупления посредством позднейших богословских систем.
- issue: Пассивность еврейской формы и более активное звучание греческой параллели
  choice: 'Следовать высоконадёжному еврейскому тексту и сохранить пассив: «будет искуплен».'
  alternative: «искупает свои грехи»
  rationale: Еврейское תְּכֻפַּר грамматически пассивно и согласуется с חַטָּאתוֹ. Греческая параллель допускает более активное выражение результата, но не требует устранять пассивную форму основного источника.
- issue: Раздельное упоминание отца и матери
  choice: Передать «отца» и «мать» отдельно.
  alternative: «родителей»
  rationale: Исходный текст образует два параллельных высказывания и прямо называет каждого из родителей; обобщение нарушило бы структуру стиха.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Синтаксический параллелизм двух частей сохранён; богословски значимое «искуплен» оставлено без конфессионального истолкования.
