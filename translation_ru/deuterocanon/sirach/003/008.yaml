  text: My son[a], honor your father in word and deed, so that all blessings may come upon you.
translation:
  language: ru
  text: Сын мой, чти отца своего словом и делом, чтобы тебя достигли все благословения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «чтобы от него пришло на тебя благословение»; тем самым отец яснее представлен как источник благословения.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Еврейский текст прямо обращён к сыну в мужском роде; традиционный порядок слов звучит естественно и достойно по-русски.
- source_word: בְּמַאֲמָר וּבְמַעֲשֶׂה
  choice: словом и делом
  rationale: Устойчивое русское сочетание точно передаёт речь и поступки; перестановка по сравнению с греческим параллельным текстом следует еврейскому источнику.
- source_word: כַּבֵּד
  choice: чти
  rationale: Краткий повелительный глагол передаёт требование оказывать отцу должные почёт и уважение и соответствует библейскому нравственному регистру.
- source_word: אָבִיךָ
  choice: отца своего
  rationale: Прямой и естественный русский эквивалент притяжательной конструкции; возвратное местоимение однозначно связывает отца с адресатом.
- source_word: עֲבוּר
  choice: чтобы
  rationale: Передаёт целевое или результативное отношение, не устраняя присущую конструкции смысловую гибкость.
- source_word: יַשִׂיגוּךָ
  choice: тебя достигли
  rationale: Сохраняет образ благословений, достигающих человека, и точнее отражает еврейский глагол, чем более свободное «пришли на тебя».
- source_word: כֹּל בְּרָכוֹת
  choice: все благословения
  rationale: Сохраняет множественное число и полный охват, выраженный еврейским כֹּל.
theological_decisions:
- issue: Источник обещанных благословений
  choice: В основном тексте источник не назван.
  alternative: 'Греческий параллельный текст можно передать: «чтобы от него пришло на тебя благословение», явно связывая благословение с отцом.'
  rationale: Еврейский первичный текст говорит лишь о том, что все благословения достигнут адресата. Поэтому основной перевод не уточняет, исходят ли они от Бога или от отца; особенность греческого свидетельства отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным, но понятным наставительным звучанием. «Чти» уместно в контексте сыновнего долга и не создаёт архаической тяжеловесности.
