  text: For many are the speculations of the sons of man[b][a], and evil imaginings lead astray.
translation:
  language: ru
  text: Ведь много домыслов[b] у сынов человеческих[a], и злые измышления вводят в заблуждение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «людей». Еврейский текст буквально говорит «сынов человеческих»; это обобщённое выражение, обозначающее людей вообще.
    reason: lexical_alternative
  - marker: b
    text: Редкое еврейское слово можно также понять как «мысли», «рассуждения» или «предположения». В греческом тексте стоит слово со значением «мнение» или «предположение».
    reason: alternative_reading
lexical_decisions:
- source_word: רַבִּים
  choice: много
  rationale: Передаёт количественное значение и позволяет естественно построить русскую безличную конструкцию «много домыслов».
- source_word: עֶשְׁתּוֹנֵי
  choice: домыслов
  rationale: Редкое еврейское слово обозначает мысли, рассуждения или предположения; «домыслы» сохраняют оттенок самостоятельно построенных и ненадёжных представлений, согласующийся с греческим ὑπόλημψις.
- source_word: בְּנֵי אָדָם
  choice: сынов человеческих
  rationale: Сохраняет семитский образ исходного текста; в данном контексте это обобщённое обозначение людей, а не особый титул.
- source_word: דִמְיוֹנוֹת רָעוֹת
  choice: злые измышления
  rationale: «Измышления» естественно обозначают созданные умом представления, а «злые» сохраняет нравственную весомость רָעוֹת и греческого πονηρά.
- source_word: מַתְעוֹת
  choice: вводят в заблуждение
  rationale: 'Передаёт каузативный смысл: такие измышления заставляют ошибаться и сбивают с верного понимания.'
theological_decisions:
- issue: Обобщённое антропологическое выражение בְּנֵי אָדָם
  choice: сынов человеческих
  alternative: людей; человеческих существ
  rationale: Буквальный образ сохранён без придания ему мессианского смысла; сноска поясняет, что выражение относится к человечеству вообще.
- issue: Степень отрицательной окраски עֶשְׁתּוֹנֵי
  choice: домыслы
  alternative: мысли; рассуждения; предположения
  rationale: Контекст предостережения и греческая параллель поддерживают значение ненадёжных, самостоятельно составленных представлений, но сноска сохраняет лексическую неопределённость редкого слова.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Оборот «сыны человеческие» сохранён как осмысленный образ оригинала, а редкое слово עֶשְׁתּוֹנֵי передано естественным русским «домыслы» с пояснением вариантов в сноске.
