base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/012.yaml
  text: My son[a], be strong in honoring your father, and do not forsake him all the days of your life.
translation:
  language: ru
  text: Сын мой[a], будь твёрд в почитании своего отца и не оставляй его во все дни своей жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Дитя, поддерживай своего отца в его старости и не огорчай его, пока он жив».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Звательная форма слова בן с суффиксом первого лица единственного числа. Такой перевод сохраняет мужской род и наставительный тон еврейской литературы мудрости.
- source_word: הִתְחַזֵּק
  choice: будь твёрд
  rationale: Императив породы хитпаэль от חזק передаёт укрепление себя, стойкость или решимость. «Будь твёрд» естественно звучит по-русски и сохраняет образ внутренней стойкости.
- source_word: בִּכִבּוּד
  choice: в почитании
  rationale: Сочетание предлога ב с существительным כיבוד обозначает сферу проявления стойкости. «В почитании» сохраняет форму и подчёркивает постоянное деятельное уважение.
- source_word: אָבִיךָ
  choice: своего отца
  rationale: Возвратное притяжательное местоимение естественно для русского языка при совпадении обладателя с адресатом повеления и точно передаёт «твоего отца».
- source_word: וְאַל תַּעַזְבֵהוּ
  choice: и не оставляй его
  rationale: עזב может означать «оставлять, покидать, бросать». «Не оставляй» передаёт как физическое оставление, так и отказ от сыновней заботы, не усиливая значение сверх еврейского текста.
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: во все дни своей жизни
  rationale: Близкая и понятная передача устойчивого еврейского выражения, обозначающего продолжительность всей жизни.
theological_decisions:
- issue: Расхождение еврейского текста и греческого параллельного свидетельства
  choice: 'Основной текст следует еврейскому чтению: «будь твёрд в почитании своего отца и не оставляй его».'
  alternative: 'Греческий текст: «поддерживай своего отца в его старости и не огорчай его при его жизни».'
  rationale: Сохранившийся еврейский текст является первичным свидетельством. Греческая версия явно упоминает старость отца и запрет огорчать его, тогда как еврейская подчёркивает стойкость в почитании и недопустимость оставления. Существенное древнее разночтение сохранено в сноске без смешения двух форм текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном литературы мудрости. Формулировка близка еврейскому оригиналу, но остаётся естественной и понятной; значимое греческое разночтение вынесено в сноску.
