translation:
  language: ru
  text: Размышляй о том, что тебе велено[a], и не занимайся сокрытым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «что тебе дозволено» или «что тебе разрешено»; греческий перевод: «что тебе велено». Основной текст следует греческому чтению.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּמֶּה שֶׁהוּרְשֵׁיתָ
  choice: о том, что тебе дозволено
  rationale: Еврейский текст прежде всего указывает на то, что человеку разрешено или предоставлено; оборот «о том, что» естественно вводит предмет размышления. Расхождение с греческим переводом отмечено в сноске.
- source_word: הִתְבּוֹנֵן
  choice: размышляй
  rationale: Глагол призывает вдумчиво рассматривать предмет; «размышляй» естественно звучит в контексте наставления мудрости.
- source_word: וְאֵין לְךָ עֵסֶק
  choice: и не занимайся
  rationale: Еврейская идиома обозначает то, что не относится к надлежащей сфере занятий человека. Отрицательное повеление передаёт наставительный характер фразы без излишне разговорного «тебе нет дела».
- source_word: בְּנִסְתָּרוֹת
  choice: сокрытым
  rationale: Передаёт скрытые от человека предметы или дела, не привнося более поздних богословских оттенков слова «тайны» или «мистерии».
theological_decisions:
- issue: Расхождение между еврейским הוּרְשֵׁיתָ и греческим προσετάγη
  choice: 'В основном тексте: «что тебе дозволено»'
  alternative: «что тебе велено» или «что тебе поручено»
  rationale: Сохранившийся еврейский текст имеет приоритет и естественнее выражает разрешение или предоставленную человеку область. Греческий параллельный текст понимает это как повеление; существенная неоднозначность не устраняется, а отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык; краткое, достойное по тону наставление. «Сокрытым» сохраняет широту исходного выражения и избегает специальных конфессиональных ассоциаций.
