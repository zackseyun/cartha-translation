  text: Without the pupil[a], light is lacking; and without knowledge, wisdom is lacking.
translation:
  language: ru
  text: Без зрачка[a] нет света, и без знания нет мудрости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся греческий текст содержит здесь другое изречение: «Жестокое сердце будет отягощено страданиями, и грешник прибавит грехи к грехам».'
    reason: textual_variant
lexical_decisions:
- source_word: בְּאֵין
  choice: без / нет
  rationale: Сочетание בְּאֵין выражает отсутствие. Русская конструкция «без… нет…» естественна, лаконична и сохраняет афористический параллелизм.
- source_word: אִישׁוֹן
  choice: зрачок
  rationale: В сочетании со «светом» слово обозначает зрачок глаза. Современное анатомическое наименование ясно передаёт смысл, не воспроизводя затемняющую его буквальную этимологию «человечек глаза».
- source_word: יֶחְסַר / תֶּחְסַר
  choice: нет
  rationale: Обе формы глагола חסר означают недостаток или отсутствие. Повтор «нет… нет…» сохраняет лексическую повторяемость и равновесие двух частей еврейской строки.
- source_word: אוֹר
  choice: свет
  rationale: Передано в основном словарном значении; слово поддерживает конкретный образ зрения в первой части изречения.
- source_word: דַעַת
  choice: знание
  rationale: «Знание» непосредственно передаёт דַעַת и сохраняет его отличие от חָכְמָה — «мудрости».
- source_word: חָכְמָה
  choice: мудрость
  rationale: Стандартное значение слова в литературе мудрости; естественный и точный русский эквивалент.
theological_decisions:
- issue: Расхождение сохранившихся еврейского и греческого свидетельств в Сир 3:27
  choice: Основной текст переведён по сохранившейся еврейской строке; существенно отличающееся греческое чтение приведено в сноске.
  alternative: 'Греческое чтение: «Жестокое сердце будет отягощено страданиями, и грешник прибавит грехи к грехам».'
  rationale: Там, где еврейский текст Сираха сохранился с высокой уверенностью, ему отдаётся первенство. Греческий текст содержит не малый вариант, а иное изречение, поэтому он не заменяет основной текст, но должен быть отмечен ради текстологической прозрачности.
translation_notes:
  register: Современный литературный русский язык; краткая, симметричная и достойная форма изречения. Конструкция «без… нет…» звучит естественно для широкого читателя и сохраняет параллелизм оригинала.
