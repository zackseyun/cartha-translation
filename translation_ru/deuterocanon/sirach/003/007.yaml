  text: и будет служить тем, кто дал ему жизнь, как господам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как владыкам». Греческое слово обозначает лиц, обладающих полной властью; здесь это сильное сравнение, подчёркивающее почтение к родителям и подчинение им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεσπόταις
  choice: господам
  rationale: Слово обозначает лиц, обладающих полной властью. «Господам» сохраняет силу сравнения, но не сводит отношения с родителями к буквальному владению, как могло бы подразумевать «хозяевам».
- source_word: δουλεύσει
  choice: будет служить
  rationale: Будущее время глагола δουλεύω выражает служение в подчинённом положении. Естественное русское «будет служить» передаёт смысл, а силу подчинения раскрывает следующее сравнение.
- source_word: ἐν τοῖς γεννήσασιν αὐτόν
  choice: тем, кто родил его
  rationale: Оборот буквально указывает на породивших его. Такая передача понятна современному читателю и сохраняет явную связь обязанности с происхождением, не заменяя выражение более общим словом «родителям».
theological_decisions:
- issue: Сила образа сыновнего подчинения
  choice: Сохранено прямое сравнение служения родившим его со служением господам.
  alternative: «будет почтительно заботиться о родителях»
  rationale: Греческий текст намеренно соединяет δουλεύσει и δεσπόταις, создавая сильный образ подчинения. Смягчение до почтения или заботы устранило бы заложенное в источнике этическое напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Причастный оборот заменён более естественной конструкцией «тем, кто родил его»; сильная властная образность оригинала сохранена.
