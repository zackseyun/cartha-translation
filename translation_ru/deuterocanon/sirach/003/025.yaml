  text: A heavy heart will come to ruin in the end[b][a], and one who loves good things will be led by them.
translation:
  language: ru
  text: Тяжёлое сердце в конце концов погибнет[b][a], а любящий блага будет ведом ими.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «жёсткое сердце пострадает напоследок». Буквально по-еврейски: «тяжёлое сердце испортится к своему концу».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «испортится», «сгниёт». Еврейский глагол буквально означает «смердеть, портиться», а здесь образно указывает на гибельный исход.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵב כָּבֵד
  choice: тяжёлое сердце
  rationale: 'Сохраняет буквальный образ основного еврейского свидетельства и его смысловую открытость: речь может идти не просто о печали, а о нравственно отягощённом или внутренне неустроенном сердце. Греческое «жёсткое сердце» дано в примечании.'
- source_word: תִּבְאַשׁ
  choice: погибнет
  rationale: Основное значение глагола — «смердеть, портиться, гнить»; в сочетании с указанием на конец он образно выражает гибельный исход. Естественное русское «погибнет» передаёт результат, а буквальный образ сохранён в примечании.
- source_word: אַחֲרִיתוֹ
  choice: в конце концов
  rationale: Передаёт значение конечного исхода и естественно звучит в русском изречении, не вынуждая выбирать между «его концом» и «своим концом».
- source_word: וְאֹוהֵב טוֹבוֹת
  choice: любящий блага
  rationale: '«Блага» сохраняет широту множественного טוֹבוֹת: это могут быть добрые вещи, блага или благодеяния; перевод не сужает выражение до удовольствий.'
- source_word: יִנְהַג בָּהֶם
  choice: будет руководствоваться ими
  rationale: Глагол נהג связан с ведением и направлением. Возвратная конструкция естественно передаёт мысль о том, что любимые человеком блага направляют его образ действий, сохраняя некоторую неоднозначность еврейской фразы.
theological_decisions:
- issue: Еврейское «тяжёлое сердце» и греческое «жёсткое сердце»
  choice: В основном тексте переведено еврейское לֵב כָּבֵד как «тяжёлое сердце».
  alternative: «Жёсткое сердце».
  rationale: При наличии уверенно засвидетельствованного еврейского текста он служит основой. Греческий параллельный текст может отражать иной еврейский оригинал или истолковывающий перевод; различие вынесено в примечание, чтобы не устранять смысловое и богословское напряжение.
- issue: Обобщённый субъект второй части
  choice: Причастная конструкция «любящий блага».
  alternative: «Тот, кто любит блага».
  rationale: Краткая форма соответствует афористическому строю и передаёт обобщённый смысл, не делая изречение относящимся исключительно к мужчинам.
translation_notes:
  register: 'Современный литературный русский язык с кратким, достойным афористическим строем. Сохранён непривычный, но ясный образ «тяжёлого сердца»; буквальная резкость глагола объяснена в примечании. Маркеры примечаний следуют порядку консультационного слоя: [b][a].'
