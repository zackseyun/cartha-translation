  language: ru
  text: И почитающий свою мать — как тот, кто собирает сокровища.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: почитающий
  rationale: В контексте наставления о сыновнем долге глагол означает оказывать матери должную честь и уважение; «почитающий» естественно передаёт этот смысл без излишне культового оттенка слова «прославляющий».
- source_word: ἀποθησαυρίζων
  choice: накапливает сокровище
  rationale: Причастие обозначает складывание или накопление ценностей в сокровищнице. Такой перевод сохраняет конкретную метафору постепенного приобретения ценного.
- source_word: μητέρα αὐτοῦ
  choice: свою мать
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит мать с действующим лицом и сохраняет единственное число исходного текста.
- source_word: ὡς
  choice: словно тот, кто
  rationale: Сравнительный оборот ясно передаёт уподобление, а добавление подразумеваемой связки и слова «тот» делает безглагольную греческую конструкцию естественной по-русски.
theological_decisions:
- issue: Образ награды за почитание матери
  choice: Сохранено открытое сравнение с накоплением сокровища без уточнения природы этого сокровища.
  alternative: Истолковать сокровище как материальное благополучие, небесную награду или общую нравственную пользу.
  rationale: Греческий текст не определяет, земное ли это сокровище, небесное или метафорическое; перевод не должен разрешать эту богословскую неопределённость.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная форма наставления. Союз «И» сохранён как связь с предыдущим стихом. Метафора передана прямо, без поясняющей парафразы.
