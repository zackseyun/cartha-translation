  text: Water extinguishes a blazing fire[b][a]; so almsgiving makes atonement for sin.
translation:
  language: ru
  text: Вода гасит пылающий огонь; так и милостыня[a] искупает грех[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «праведность». Еврейское צדקה может иметь и это значение, однако в греческом параллельном тексте стоит «милостыня» (ἐλεημοσύνη), что, вероятно, передаёт подразумеваемый здесь смысл.
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте — «грехи» (множественное число); еврейское «грех» можно понимать в обобщённом смысле.
    reason: alternative_reading
lexical_decisions:
- source_word: אש לוהטת
  choice: пылающий огонь
  rationale: Передаёт образ огня, горящего с большой силой; значение подтверждается греческим φλογιζόμενον.
- source_word: יכבו מים
  choice: вода гасит
  rationale: Естественная русская формулировка для собирательного «вода» и глагола со значением «гасить, тушить»; сохраняет конкретный образ первой половины изречения.
- source_word: כן
  choice: так и
  rationale: Кратко и ясно обозначает сопоставление двух частей афористического высказывания.
- source_word: צדקה
  choice: милостыня
  rationale: Хотя слово может означать «праведность», здесь конкретный смысл помощи нуждающимся поддерживается параллельным греческим ἐλεημοσύνη и контекстом Книги Сираха.
- source_word: תכפר
  choice: искупает
  rationale: Сохраняет сильное значение глагола כפר — совершать искупление — и не ослабляет богословское утверждение текста.
- source_word: חטאת
  choice: грех
  rationale: В еврейском тексте слово употреблено в единственном числе и может иметь обобщённый смысл; здесь оно обозначает грех, а не жертву за грех.
theological_decisions:
- issue: Значение צדקה в сочетании с языком искупления
  choice: «милостыня искупает грех»
  alternative: «праведность искупает грех»
  rationale: Греческая параллель прямо передаёт צדקה словом ἐλεημοσύνη («милостыня»). Глагол «искупает» сохраняет богословскую напряжённость исходного утверждения, не смягчая его до значения «возмещает» или «заглаживает».
translation_notes:
  register: Современный литературный русский язык; краткий, достоинственный и афористичный строй. Сохранены образный параллелизм и прямое богословское утверждение оригинала.
