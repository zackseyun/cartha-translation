translation:
  language: ru
  text: Честь человека — в почитании своего отца, а кто бесчестит свою мать[a], тот умножает грех.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проклинает свою мать». Еврейский глагол может иметь это более узкое значение, хотя параллелизм почитания и бесчестья, а также греческий текст поддерживают более широкое «бесчестит».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте: «Ибо слава человека — от чести его отца, а мать в бесчестии — позор для детей». Вторая часть там отражает несколько иную форму текста, чем сохранившаяся еврейская.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּבוֹד אִישׁ
  choice: честь человека
  rationale: כְּבוֹד здесь означает общественную и нравственную честь, а не видимую славу. אִישׁ имеет мужскую форму, но в данном изречении употреблено обобщённо; русское «человек» естественно передаёт общеобязательный смысл сентенции.
- source_word: כִּבּוּד אָבִיו
  choice: в почитании своего отца
  rationale: 'Вокализация כִּבּוּד указывает на почитание, оказываемое отцу. Конструкция с «в» естественно раскрывает краткую именную фразу: честь человека состоит в почитании отца. Возвратное «своего» однозначно соотносит отца с субъектом.'
- source_word: וּמַרְבֶּה חֵטְא
  choice: тот умножает грех
  rationale: Причастная форма מַרְבֶּה передаёт увеличение или умножение, а חֵטְא прямо обозначает грех. Корреляция «кто… тот» сохраняет обобщённый характер высказывания и звучит естественно по-русски.
- source_word: מְקַלֵּל אִמּוֹ
  choice: кто бесчестит свою мать
  rationale: В породе пиэль קלל может означать как «проклинать», так и шире — унижать, презирать, лишать чести. «Бесчестит» поддерживает противопоставление почитанию в первой строке; более узкое значение вынесено в примечание.
theological_decisions:
- issue: Обобщённый субъект אִישׁ
  choice: честь человека
  alternative: честь мужчины
  rationale: Сентенция касается всеобщей обязанности почитать родителей. «Человек» в современном русском сохраняет обобщённую референцию без ненужного ограничения только взрослыми мужчинами.
- issue: Значение מְקַלֵּל в контексте отношения к матери
  choice: бесчестит свою мать
  alternative: проклинает свою мать
  rationale: Еврейский глагол допускает оба значения, а параллелизм с почитанием и греческое свидетельство поддерживают более широкое значение бесчестья. Узкий вариант не исключён и указан в сноске.
- issue: Отношение чести человека к почитанию отца
  choice: честь человека — в почитании своего отца
  alternative: честь человека — честь его отца
  rationale: В масоретской вокализации композитного еврейского текста различены כְּבוֹד, «честь», и כִּבּוּד, «почитание». Перевод сохраняет это различие и не отождествляет две «чести», хотя греческая параллель допускает оттенок происхождения славы человека от чести отца.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Тире передаёт именную конструкцию исходного текста; оборот «кто… тот» обеспечивает ясность и естественный ритм. Лексика «почитание», «бесчестит», «умножает грех» сохраняет достоинство и этическую весомость оригинала без архаизации.
