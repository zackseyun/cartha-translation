translation:
  language: ru
  text: Благословение отца укрепляет корни[a], а проклятие матери вырывает растение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Ибо благословение отца укрепляет дома детей, а проклятие матери исторгает основания». Еврейский текст использует земледельческие образы: «корни» и «растение».'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּרְכַת אָב
  choice: благословение отца
  rationale: Естественная русская передача конструкции со значением благословения, произносимого отцом; сохраняет единственное число и параллель с «проклятием матери».
- source_word: תְּיַסֵּד
  choice: укрепляет
  rationale: Глагол יסד означает прочно основывать, утверждать. В сочетании с образом корней «укрепляет» звучит по-русски естественно и сохраняет смысл придания устойчивости.
- source_word: שֹׁרֶשׁ
  choice: корни
  rationale: Еврейский текст использует образ корня; множественное число по-русски естественно передаёт собирательное значение в этой пословице.
- source_word: וְקִלְלַת אֵם
  choice: а проклятие матери
  rationale: Союз «а» передаёт противопоставление двух частей изречения без чрезмерного усиления; родительный падеж естественно отражает сопряжённую конструкцию.
- source_word: תִּנְתּשׁ
  choice: вырывает
  rationale: В данном земледельческом контексте глагол обозначает извлечение посаженного из земли. «Вырывает» сохраняет образ и позволяет избежать неестественного сочетания «искореняет насаждение».
- source_word: נֶטַע
  choice: насаждение
  rationale: Слово обозначает посаженное растение или то, что насаждено. «Насаждение» сохраняет связь с действием посадки и подходит возвышенному пословичному стилю.
theological_decisions:
- issue: Выбор основной образности при расхождении еврейского и греческого текстов
  choice: 'Сохранена еврейская земледельческая образность: «укрепляет корни… вырывает насаждение».'
  alternative: 'Следовать греческой параллели: «благословение отца укрепляет дома детей, а проклятие матери исторгает основания».'
  rationale: Сохранившийся еврейский текст имеет высокую степень надёжности и внутренне связен, поэтому он определяет основной перевод. Отличающаяся греческая образность отмечена в сноске как значимый текстуальный параллельный вариант.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified пословичным строем. Земледельческая метафора еврейского текста сохранена; формулировка доступна обычному читателю без конфессиональной терминологии.
