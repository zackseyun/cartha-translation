  text: The heart of the wise understands the sayings of the wise[b][a], and an attentive ear rejoices in wisdom.
translation:
  language: ru
  text: Сердце мудрого поймёт изречения мудрецов[a], и внимательное ухо возрадуется мудрости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «изречения», может также означать «притчи» или «пословицы»; в греческом тексте стоит «притчу» в единственном числе.
    reason: lexical_alternative
  - marker: b
    text: 'Вторая строка греческого текста отличается и может быть передана приблизительно так: «и ухо слушающего — желание мудреца». Перевод следует сохранившемуся еврейскому тексту: «и внимательное ухо возрадуется мудрости».'
    reason: textual_variant
lexical_decisions:
- source_word: לֵב חָכָם
  choice: сердце мудрого
  rationale: 'Сохраняется еврейский антропологический образ: «сердце» обозначает внутреннюю способность мыслить и понимать; единственное число חָכָם имеет обобщающий смысл.'
- source_word: יָבִין
  choice: поймёт
  rationale: Глагол בין здесь означает постичь смысл наставления. Будущее совершенного вида естественно передаёт форму еврейского имперфекта в сентенционном высказывании.
- source_word: מִשְׁלֵי חֲכָמִים
  choice: изречения мудрецов
  rationale: מָשָׁל может означать изречение, притчу или пословицу; «изречения» не сужает жанр чрезмерно, а «мудрецов» ясно обозначает носителей традиции мудрости.
- source_word: אֹזֶן מַקְשֶׁבֶת
  choice: внимательное ухо
  rationale: Сохранён конкретный образ уха, которое внимательно слушает; сочетание естественно для возвышенной современной русской речи.
- source_word: לְחָכְמָה תִּשְׂמָח
  choice: возрадуется мудрости
  rationale: Русское управление дательным падежом естественно выражает радость, направленную на мудрость, и близко передаёт еврейское לְ; «возрадуется» сохраняет достоинство поэтического регистра.
