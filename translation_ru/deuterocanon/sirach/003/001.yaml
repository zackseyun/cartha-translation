  text: Listen[a], children, to a father's instruction, and do so that you may live.
translation:
  language: ru
  text: Слушайте[a], дети, наставление отца и поступайте так, чтобы жить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Слушайте меня, вашего отца… чтобы вы спаслись». Еврейский текст выражается более обобщённо: «наставление отца… чтобы жить».'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Повелительное множественного числа от שמע передаёт призыв внимательно слушать; значение послушания подразумевается последующим требованием действовать, но не подставляется заранее.
- source_word: בָנִים
  choice: дети
  rationale: Формально это мужское множественное число «сыновья», однако в контексте наставления обращение имеет общий сыновний смысл; «дети» естественно передаёт его по-русски без неоправданного ограничения только мужчинами.
- source_word: מִשְׁפַט
  choice: наставление
  rationale: Здесь слово обозначает авторитетное предписание или руководство отца, а не судебный приговор; «наставление» соответствует жанру литературы мудрости.
- source_word: אָב
  choice: отца
  rationale: В еврейском тексте нет местоименного суффикса. Русская беспредложная конструкция «наставление отца» сохраняет обобщённую формулировку и не добавляет «моего» или «вашего».
- source_word: וַעֲשׂוּ
  choice: и поступайте так
  rationale: Буквально «и делайте»; «поступайте так» естественно по-русски выражает исполнение только что названного наставления.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Ясно и естественно вводит целевое придаточное.
- source_word: תִּחְיוּ
  choice: жить
  rationale: Форма от חיה означает «жить». Греческое «быть спасёнными» представляет значимое разночтение и отмечено в сноске, но не заменяет чтение основного еврейского свидетеля.
theological_decisions:
- issue: Расхождение еврейского и греческого свидетелей в указании на отца
  choice: В основном тексте сохранить обобщённое еврейское «наставление отца»
  alternative: Греческое «слушайте меня, отца»
  rationale: При наличии надёжного еврейского текста он служит основным свидетелем; греческое чтение не вносится в основной текст, но сохраняется в сноске.
- issue: 'Итоговая цель: «жить» или «быть спасёнными»'
  choice: Следовать еврейскому «чтобы жить»
  alternative: Греческое «чтобы вы спаслись»
  rationale: Еврейское תִּחְיוּ прямо означает «жить», тогда как греческое σωθῆτε представляет богословски значимое альтернативное чтение, которое следует обозначить, не устраняя различия между свидетелями.
translation_notes:
  register: 'Современный литературный русский язык; краткий, достойный и доступный тон наставления. Синтаксис сохраняет последовательность еврейских призывов: слушать, затем действовать.'
