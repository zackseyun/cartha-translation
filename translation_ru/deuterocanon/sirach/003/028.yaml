translation:
  language: ru
  text: 'Не спеши исцелять рану насмешника, ведь ей нет исцеления: от дурного насаждения они были посажены.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий параллельный текст: «ибо в нём укоренилось растение зла». Заключительная часть еврейского текста грамматически затруднительна: глагольная форма передана во множественном числе.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תָּרוּץ
  choice: Не спеши
  rationale: Глагол רוץ буквально означает «бежать», но в данном запрете передаёт предостережение от поспешного действия; «не спеши» естественно выражает этот смысл по-русски.
- source_word: לְרַפְּאוֹת
  choice: исцелять
  rationale: Рפא обозначает исцеление или лечение. «Исцелять» сохраняет связь с последующим существительным רְפוּאָה и поддерживает образ раны.
- source_word: מַכַּת
  choice: рану
  rationale: מכה может означать удар, поражение или рану; рядом с глаголом «исцелять» значение «рана» наиболее связно.
- source_word: לֵץ
  choice: насмешника
  rationale: В литературе мудрости לץ — человек, который высокомерно глумится и отвергает наставление. «Насмешник» передаёт этот нравственный тип без излишне конфессиональной окраски.
- source_word: אֵין לָהּ רְפוּאָה
  choice: ей нет исцеления
  rationale: Формулировка сохраняет женский род местоимения, соотнося его с «раной», и лексическую связь רפא/רפואה — «исцелять/исцеление».
- source_word: מִנֶּטַע רַע
  choice: от дурного насаждения
  rationale: נטע может обозначать посадку, насаждение или посаженное растение. «Насаждение» сохраняет ботанический образ и не уточняет сверх текста, идёт ли речь об одном растении или о происхождении.
- source_word: נִטְעוֹ
  choice: они посажены
  rationale: В переданном еврейском тексте форма выглядит множественной, хотя ближайшие существительные стоят в единственном числе. Перевод сохраняет это грамматическое несоответствие, а не исправляет его молча.
theological_decisions:
- issue: Расхождение еврейского и греческого свидетельств в заключительной части стиха
  choice: 'В основном тексте сохранено множественное число еврейской формы: «они посажены»'
  alternative: «ибо в нём укоренилось растение зла»
  rationale: Сохранившийся еврейский текст имеет приоритет, хотя его заключение грамматически затруднительно. Греческий параллельный текст даёт связное чтение в единственном числе, но оно приведено в сноске как важное текстовое свидетельство, а не подменяет еврейское чтение.
translation_notes:
  register: Современный литературный русский язык с достоинством, присущим учительной литературе. Повтор «исцелять — исцеление» намеренно сохраняет словесную связь оригинала; необычность последней фразы отражает текстовую трудность еврейского свидетельства.
