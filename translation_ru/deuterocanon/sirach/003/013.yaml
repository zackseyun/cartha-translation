base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/013.yaml
  text: Even if a man lacks understanding[a], be patient with him[b], and do not shame him all the days of his life.
translation:
  language: ru
  text: Даже если человеку недостаёт разумения, будь к нему снисходителен[a] и не стыди его всю его жизнь.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будь терпелив с ним»; «делай ему скидку». Еврейское выражение буквально связано с тем, чтобы оставить или отпустить, а греческий параллельный текст поясняет его как призыв к снисходительности.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте: «и не бесчести его в полную силу» или «изо всех сил». Еврейский текст гласит: «все дни его жизни». Основной текст следует еврейскому свидетельству; греческий вариант, вероятно, отражает иной древнееврейский исходный текст или истолковывающий перевод.'
    reason: textual_variant
lexical_decisions:
- source_word: וְגַם
  choice: Даже если
  rationale: В данном наставлении сочетание имеет уступительное значение; это подтверждает греческое κἂν («даже если»).
- source_word: אִישׁ
  choice: человеку
  rationale: Еврейское существительное стоит в мужском роде, но здесь выражает обобщённый случай; «человеку» естественно передаёт этот смысл по-русски, не сужая его до конкретного мужчины.
- source_word: יֶחְסַר מַדָּעוֹ
  choice: недостаёт разумения
  rationale: Буквально речь идёт о недостатке знания или понимания; греческое σύνεσιν также указывает на разумение, рассудительность. Выбранная формулировка сохраняет смысл и достоинство речи.
- source_word: עֲזָב לוֹ
  choice: будь к нему снисходителен
  rationale: Еврейское выражение буквально допускает смысл «оставь ему / отпусти ему», а греческое συγγνώμην ἔχε поясняет его как терпеливую снисходительность и готовность делать поправку на слабость человека.
- source_word: וְאַל תַּכְלִים אוֹתוֹ
  choice: не стыди его
  rationale: Глагол означает посрамлять или унижать; краткое «не стыди» прямо и естественно передаёт межличностную силу запрета.
- source_word: כָּל יְמֵי חַיָיו
  choice: всю его жизнь
  rationale: Естественная современная передача буквального выражения «все дни его жизни» без изменения временного охвата.
