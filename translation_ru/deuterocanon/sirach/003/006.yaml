  text: Whoever honors his father will have long days[a], and whoever honors his mother repays God.
translation:
  language: ru
  text: Кто почитает отца, у того умножатся дни; а на том, кто почитает мать, — Божье воздаяние.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте вторая часть стиха читается иначе: «а кто слушается Господа, тот даст покой своей матери». Еврейский и греческий тексты здесь существенно расходятся.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְכַבֵּד
  choice: почитает
  rationale: В контексте отношения к родителям причастие от כבד означает оказывать должное почтение; «почитает» естественно и сохраняет связь с формулировкой заповеди.
- source_word: אָבִיו
  choice: отца
  rationale: Русская конструкция с обобщающим «кто» позволяет естественно передать принадлежность без повторения местоимения «своего».
- source_word: יִרְבּוּ יָמָיו
  choice: у того умножатся дни
  rationale: Сохраняет еврейский образ буквально «его дни станут многочисленны», не сводя его сразу к пояснительному «будет долго жить».
- source_word: וּגְמוּל אֱלֹהִים עַל
  choice: тот воздаёт Богу
  rationale: Передаёт сжатую и несколько трудную еврейскую фразу как воздаяние, направленное Богу, не подменяя её существенно отличным греческим чтением.
- source_word: אִמּוֹ
  choice: мать
  rationale: При обобщающем «кто» русское «мать» ясно обозначает мать данного человека и звучит естественнее, чем «свою мать».
theological_decisions:
- issue: Расхождение еврейского текста и греческой параллели во второй части стиха
  choice: 'Основной текст следует сохранившемуся еврейскому чтению: почитание матери представлено как воздаяние Богу.'
  alternative: 'Греческий текст: «кто слушается Господа, тот успокоит свою мать».'
  rationale: Еврейское свидетельство здесь имеется и оценено как надёжное, поэтому оно положено в основу перевода; значительное расхождение с греческим сохранено в примечании, а не устранено молча.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Параллельная конструкция сохранена; «умножатся дни» передаёт образность оригинала, а не только её смысловое объяснение.
