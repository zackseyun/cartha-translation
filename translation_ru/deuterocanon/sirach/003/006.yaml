  source_fidelity: 'Первая строка передана точно: מְכַבֵּד אָבִיו и יִרְבּוּ יָמָיו соответствуют «кто почитает отца, у того умножатся дни». Во второй строке עַל обычно обозначает направленность/нахождение «на, над, для»; сочетание וּגְמוּל אֱלֹהִים עַל מְכַבֵּד אִמּוֹ естественнее передать как Божье воздаяние, пребывающее на почитающем мать, а не как действие человека по воздаянию Богу. Сжатость и синтаксическая трудность еврейского текста сохранены без замены греческим чтением.'
  naturalness: «Кто почитает отца, у того умножатся дни» — естественная для современного литературного библейского регистра конструкция. «На том, кто почитает мать, — Божье воздаяние» звучит ясно и не приписывает человеку невозможного в данном контексте действия «воздавать Богу».
  terminology: «Почитает» удачно передаёт כבד в отношении родителей. «Божье воздаяние» передаёт גְמוּל אֱלֹהִים, не уточняя без необходимости, является ли оно наградой или возмездием; в данном контексте положительная окраска следует из параллелизма, но не вводится отдельным словом. Примечание корректно фиксирует существенное расхождение греческой параллели.
