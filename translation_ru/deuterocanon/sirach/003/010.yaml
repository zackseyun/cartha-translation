lexical_decisions:
- source_word: אַל תִּתְכַּבֵּד
  choice: Не ищи себе почёта
  rationale: Запрет с формой хитпаэль от כבד передаёт стремление приобрести почёт или возвысить себя. Русское «не ищи себе почёта» сохраняет возвратную направленность и звучит естественнее буквального «не почитай себя».
- source_word: בְּקְלוֹן
  choice: в бесчестье
  rationale: קלון означает позор, бесчестье или унижение. Предлог ב допускает как обстоятельственное «в», так и инструментальное «посредством, за счёт»; основной текст сохраняет более широкую формулировку, а иной оттенок отмечен в сноске.
- source_word: אָבִיךָ
  choice: своего отца
  rationale: Передано существительным в единственном числе с естественным для русского запрета возвратным притяжательным местоимением.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание запрета; «ведь» естественно передаёт пояснительно-причинную связь в изречении мудрости.
- source_word: לֹא כָבוֹד הוּא לָךְ
  choice: это не честь для тебя
  rationale: Сохранена именная конструкция и намеренный повтор смыслового корня כבד; греческая параллель также подтверждает значение чести или славы.
