base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/002.yaml
  text: For Yahweh honored the father above the children[b][a], and he established the mother's authority over her children.
translation:
  language: ru
  text: Ведь Господь почтил отца перед детьми[a] и утвердил власть матери над её детьми[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «почтил отца перед детьми». Оборот может указывать на почётное положение отца перед детьми; возможен также перевод: «поставил отца выше детей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «утвердил право матери в отношении её детей». Еврейское מִשְׁפָּט может означать «суд», «справедливость» или законное «право». В греческом параллельном тексте во второй строке сказано «над сыновьями», тогда как еврейский текст имеет «над её детьми».'
    reason: lexical_and_textual_variant
lexical_decisions:
- source_word: יְהֹוָה
  choice: Господь
  rationale: Передаёт тетраграмматон традиционным и понятным русским соответствием; согласуется с Κύριος в греческом параллельном тексте.
- source_word: כִּבֵּד
  choice: возвысил … в глазах
  rationale: Порода пиэль глагола כבד означает «почтить, оказать честь». В сочетании с לִפְנֵי הַבָּנִים такой перевод естественно выражает данное отцу почётное положение по отношению к детям.
- source_word: לִפְנֵי הַבָּנִים
  choice: в глазах детей
  rationale: לִפְנֵי буквально значит «перед, в присутствии»; здесь оборот указывает на положение отца перед детьми, не утверждая без пояснения значение превосходства.
- source_word: מִשְׁפַּט הָאֵם
  choice: власть матери
  rationale: מִשְׁפָּט может обозначать суд, установленное право или законное притязание. В семейном контексте «власть» ясно передаёт признанное положение матери, а возможное юридическое значение сохранено в примечании.
- source_word: קִיֵּם
  choice: утвердил
  rationale: Глагол означает «сделать прочным, подтвердить, установить»; «утвердил» сохраняет и учредительный, и подтверждающий оттенки.
- source_word: עַל יְלָדֶיהָ
  choice: над её детьми
  rationale: Предлог עַל выражает здесь отношение власти или законного положения, а местоименный суффикс прямо указывает на детей матери.
theological_decisions:
- issue: Соотношение положения отца и детей
  choice: «возвысил отца в глазах детей»
  alternative: «поставил отца выше детей»
  rationale: Еврейское לִפְנֵי допускает пространственно-социальное значение «перед, в присутствии», тогда как греческое ἐπὶ указывает на положение по отношению к детям. Основной текст передаёт почётный статус отца, не превращая неоднозначный предлог в категорическое утверждение превосходства.
- issue: Социально-правовой смысл מִשְׁפַּט הָאֵם
  choice: «власть матери»
  alternative: «право матери»
  rationale: «Власть» естественно выражает обязательное для детей положение матери, установленное Богом; примечание сохраняет возможный юридический оттенок «право», не привнося позднейших доктринальных схем.
- issue: Сохранение различия между отцом и матерью
  choice: «отца … матери»
  alternative: обобщённое «родителей»
  rationale: Еврейский текст намеренно называет отца и мать отдельно; сохранение параллелизма точно передаёт его гендерно конкретную формулировку.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной литературы. Союз «ведь» передаёт причинное כִּי и связывает стих с ближайшим контекстом. Формулировка избегает канцеляризма, сохраняя юридико-семейный оттенок второй строки.
