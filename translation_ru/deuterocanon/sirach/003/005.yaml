base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/005.yaml
  text: Whoever honors his father will rejoice in his children[b][a], and his prayer will be heard and answered.
translation:
  language: ru
  text: Кто почитает своего отца, тот будет радоваться своему сыну[a], и молитва его будет услышана и получит ответ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «будет радоваться благодаря детям»; в еврейском — единственное число: «своему сыну».'
    reason: alternative_reading
  - marker: b
    text: 'В конце греческого текста стоит только «будет услышана»; еврейский текст добавляет: «и получит ответ».'
    reason: alternative_reading
lexical_decisions:
- source_word: מְכַבֵּד
  choice: почитает
  rationale: Причастная форма породы piel от כבד означает оказывать подобающую честь. «Почитает» естественно передаёт нравственную силу выражения и соответствует возвышенному стилю книги.
- source_word: אָבִיו
  choice: своего отца
  rationale: Еврейский текст прямо говорит об отце; возвратное «своего» ясно соотносит его с субъектом придаточного предложения.
- source_word: יִשְׂמַח
  choice: будет радоваться
  rationale: Глагол выражает радость; будущее время сохраняет характерное для литературы мудрости обещание следствия.
- source_word: בִּבְנוֹ
  choice: своему сыну
  rationale: Еврейский текст содержит единственное число «его сын» с предлогом ב, который здесь естественно передать русским дательным при глаголе «радоваться». Греческое множественное число отмечено в сноске.
- source_word: וּתְפִלָתוֹ
  choice: и молитва его
  rationale: תפלה — обычное обозначение молитвы. Постпозиция местоимения поддерживает сдержанный, литературный регистр.
- source_word: יִשְׁמַע וְיַעֲנֶה
  choice: будет услышана и получит ответ
  rationale: Так переданы оба еврейских глагола без явного называния подразумеваемого божественного деятеля. Формула «молитва получит ответ» естественнее по-русски, чем буквальное «будет отвечена».
theological_decisions:
- issue: Обещание тому, кто почитает отца
  choice: Передать следствие как изречение мудрости, не называя Бога прямо совершающим действие.
  alternative: «Бог услышит его молитву и ответит на неё».
  rationale: Божественное действие подразумевается, но еврейский текст не называет Бога; перевод сохраняет эту степень неявности.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным изречениям мудрости. Синтаксис ясен для широкого читателя; сохранены еврейское единственное число и неявность божественного деятеля.
