base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/031.yaml
  text: One who does good will be called blessed for his ways[a], and at the time of his stumbling he will find support.
translation:
  language: ru
  text: Того, кто делает добро, назовут счастливым за его образ жизни[a], и во время его падения он найдёт опору.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Воздающий за благодеяния помнит о том, что будет после». Первая строка греческой версии существенно отличается от сохранившегося еврейского текста, однако во второй обе версии говорят об опоре во время падения.'
    reason: alternative_reading
lexical_decisions:
- source_word: פועל טוב
  choice: делающий добро
  rationale: Мужская форма единственного числа передаёт еврейское причастное выражение как обобщённое обозначение человека, не добавляя отсутствующего в тексте существительного.
- source_word: יקראנו
  choice: будут прославлять
  rationale: Буквально форма означает «назовёт/провозгласит его», причём субъект не назван. В сочетании с указанием на пути человека речь, вероятно, идёт о похвальном признании; неопределённо-личная конструкция сохраняет невыраженный субъект лучше, чем пассив.
- source_word: בדרכיו
  choice: за его пути
  rationale: Сохраняется библейская метафора «путей» как образа поведения; предлог «за» естественно выражает основание похвалы.
- source_word: בעת מוטו
  choice: во время своего падения
  rationale: מוט обозначает шатание, спотыкание или падение; греческое πτώσεως подтверждает образ падения. Возвратное «своего» ясно связывает падение с тем же человеком.
- source_word: ימצא משען
  choice: он найдёт опору
  rationale: משען — то, на что можно опереться, буквально или переносно; «опора» естественно передаёт этот образ и соответствует греческому στήριγμα.
theological_decisions:
- issue: Обобщённая форма мужского рода в изречении мудрости
  choice: делающий добро
  alternative: тот, кто делает добро
  rationale: Причастие мужского рода единственного числа сохраняет грамматическую форму еврейского текста и его обобщённую силу, не превращая высказывание во множественное число.
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающейся первой строкой греческой версии
  choice: В основном тексте следовать еврейской первой строке; расхождение греческой версии отметить в сноске
  alternative: «Воздающий за благодеяния помнит о будущем»
  rationale: При наличии уверенно засвидетельствованного еврейского текста он первичен для перевода Сираха. Греческая версия подтверждает смысл второй строки, но иначе передаёт первую; это значимое различие сохранено для читателя в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростного изречения. Сохранены метафоры «путей», «падения» и «опоры»; синтаксис сделан естественным, а подлинное расхождение еврейской и греческой традиций вынесено в сноску.
