  naturalness: '«Делающего добро будут прославлять за его пути» звучит по-русски тяжеловесно: начальное субстантивированное причастие без опорного слова и сочетание «за его пути» неестественны. «Образ жизни» естественно передаёт мудростную метафору путей в современном литературном русском.'
  terminology: «Назовут счастливым» передаёт публичное признание благополучным/благословенным, не придавая «прославлять» чрезмерно возвышенного, почти культового оттенка. «Опора» удачно сохраняется.
