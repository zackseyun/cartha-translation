base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/003/023.yaml
  text: Do not probe into what is beyond you[b][a], for what is too great for you has been shown to you.
translation:
  language: ru
  text: Не исследуй того, что превосходит тебя[a], ибо тебе показано то, что слишком велико для тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не исследуй вещей, которые превосходят тебя». Еврейская форма глагола трудна; в греческой параллели: «Не проявляй излишнего любопытства во множестве своих дел».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст можно также понять так: «ибо ты увидел многое, что превосходит тебя»; греческая параллель поддерживает перевод: «тебе показано то, что слишком велико для тебя».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיוֹתֵר מִמְּךָ
  choice: того, что выше тебя
  rationale: Сравнительное выражение обозначает то, что превосходит меру или возможности человека. Формулировка естественна по-русски и сохраняет образ исходного текста.
- source_word: אַל תַּמֵּר
  choice: не исследуй
  rationale: Форма еврейского глагола трудна, однако контекст и греческое μὴ περιεργάζου указывают на предостережение от чрезмерно пытливого исследования. «Не исследуй» передаёт действие ясно и без добавления отрицательной оценки знания как такового.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предшествующего наставления; «ведь» сохраняет краткую объяснительную связь и естественно звучит в современном русском языке.
- source_word: רַב מִמְּךָ
  choice: то, что слишком велико для тебя
  rationale: Фраза говорит о том, что превосходит человеческую меру или способность понимания. Перевод сохраняет сравнительный смысл и перекличку с первой частью стиха.
- source_word: הָרְאֵיתָ
  choice: тебе уже показано
  rationale: Еврейскую форму можно понять активно — «ты увидел», однако греческое ὑπεδείχθη σοι прямо поддерживает пассивный смысл. Частица «уже» естественно передаёт контекстуальный оттенок достаточности данного откровения, не превращая его в отдельное утверждение исходника.
theological_decisions:
- issue: Залог הָרְאֵיתָ с учётом греческой параллели
  choice: 'пассивное прочтение: «тебе уже показано»'
  alternative: 'активное прочтение: «ты увидел» или «ты видел»'
  rationale: 'Еврейская форма допускает активное понимание, но греческая параллель ясно выражает пассив: «было показано тебе». Пассивное прочтение даёт связное наставление о границах человеческого исследования, не уточняя, кем именно показано, и потому не вносит дополнительного догматического содержания.'
translation_notes:
  register: Современный литературный русский язык с кратким, достойным тоном наставления. Сохранены параллелизм двух сравнительных выражений и неоднозначность еврейского текста в примечаниях; основной текст следует пассивному прочтению, поддержанному греческой параллелью.
