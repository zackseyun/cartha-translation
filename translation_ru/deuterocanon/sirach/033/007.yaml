lexical_decisions:
- source_word: δόξασον
  choice: Прославь
  rationale: Аористный императив δοξάζω прямо выражает повеление воздать славу или прославить. В данном фрагменте «прославь» сохраняет возвышенный библейский оттенок и не ослабляет значение до простого уважения.
- source_word: χεῖρα
  choice: руку
  rationale: χείρ означает «рука»; отсутствие артикля естественно передаётся по-русски без обязательного определителя.
- source_word: βραχίονα
  choice: мышцу
  rationale: βραχίων обозначает руку как образ силы; «мышца» — закрепившийся в русской библейской речи образ, менее анатомически узкий, чем «предплечье», и позволяющий отличить его от χείρ.
- source_word: δεξιόν
  choice: правую
  rationale: δεξιόν согласуется с βραχίονα и означает «правую», сохраняя буквальный образ правой стороны без дополнительного толкования.
theological_decisions:
- issue: Предоставленный греческий текст отмечен как существенно не совпадающий с ожидаемым текстом стиха и содержит только отдельную клаузу
  choice: Перевести только засвидетельствованную греческую клаузу и явно отметить состояние источника
  alternative: Восстановить полный текст стиха по другим изданиям или древним версиям
  rationale: Приоритет предоставленного оригинального свидетельства требует не добавлять отсутствующий контекст. Сноска сохраняет прозрачность относительно крупного расхождения и фрагментарности данных.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. «Правая мышца» сохраняет различие между χείρ и βραχίων и звучит естественнее для образа силы, чем анатомическое «правое предплечье».
