  - marker: b
    text: 'Или: «своей славы» или «своего доброго имени».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: во всех своих делах
  rationale: Передаёт всеохватность πᾶσι и обычное значение ἔργοι как дел и поступков; по-русски звучит естественно.
- source_word: γίνου ὑπεράγων
  choice: отличайся
  rationale: Императив γίνου вместе с ὑπεράγων призывает проявлять превосходство в делах. «Отличайся» сохраняет положительный смысл и звучит естественнее буквального «будь превосходящим».
- source_word: μὴ δῷς μῶμον
  choice: не пятнай
  rationale: Греческое выражение буквально говорит о том, чтобы не дать или не причинить пятна. Русское «не пятнай» естественно сохраняет образ нравственного пятна и запретительную силу конструкции.
- source_word: ἐν τῇ δόξῃ σου
  choice: своей чести
  rationale: В данном наставительно-этическом контексте δόξα обозначает общественное достоинство, доброе имя или честь, а не богословскую славу.
theological_decisions:
- issue: Значение δόξα в этическом наставлении
  choice: честь
  alternative: слава; доброе имя
  rationale: Речь идёт о поведении человека и о пятне, которое может лечь на его общественное достоинство. «Честь» ясно выражает этот смысл, не придавая слову излишне богословского оттенка.
- issue: Сравнительная сила ὑπεράγων
  choice: отличайся
  alternative: превосходи других; будь выдающимся
  rationale: Греческое слово содержит идею превосходства, но прямо не называет тех, кого следует превосходить. Поэтому перевод не добавляет объект сравнения, а альтернативу отмечает в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая форма наставления сохраняет достоинство и афористичность оригинала. Образ пятна передан естественным русским глаголом «пятнать».
