translation:
  language: ru
  text: Во всех своих делах отличайся[a]; не допускай пятна на своей чести[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будь выдающимся»; буквальнее: «превосходи».'
