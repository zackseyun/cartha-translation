translation:
  language: ru
  text: В ярости огня да будет поглощён спасаемый[a], и да найдут погибель те, кто несправедливо поступают с Твоим народом.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое ὁ σωζόμενος буквально означает «спасаемый»; в данном контексте оно может также пониматься как «уцелевший» — человек, избежавший одной гибели, но всё же подвергающийся дальнейшему суду.
    reason: lexical_alternative
  - marker: b
    text: Предоставленный греческий текст этого стиха существенно расходится с ожидаемым текстом Сир 33:11. Перевод следует именно этому греческому свидетельству, не согласуя его с другой текстовой традицией или нумерацией.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν ὀργῇ πυρὸς
  choice: В ярости огня
  rationale: Близко передаёт необычное и выразительное сочетание с родительным падежом, не уточняя, является ли огонь носителем ярости или её орудием.
- source_word: καταβρωθήτω
  choice: да будет поглощён
  rationale: Передаёт страдательное повелительное значение и образ полного уничтожения; по-русски естественно сочетается с образом огня, сохраняя исходный смысл «пожирания».
- source_word: ὁ σωζόμενος
  choice: тот, кто спасается
  rationale: 'Возвратная форма сохраняет неоднозначность греческого причастия: речь может идти как о спасаемом, так и о том, кто избегает гибели или уцелел.'
- source_word: οἱ ἀδικοῦντες τὸν λαόν σου
  choice: те, кто поступает несправедливо с Твоим народом
  rationale: Передаёт деятельное совершение несправедливости против народа, не сужая значение до конкретного вида притеснения.
- source_word: εὕροισαν ἀπώλειαν
  choice: да найдут погибель
  rationale: Сохраняет образное сочетание «найти погибель» и пожелательно-повелительную силу греческого оптатива.
theological_decisions:
- issue: Неоднозначность ὁ σωζόμενος
  choice: тот, кто спасается
  alternative: спасаемый; уцелевший; избежавший гибели
  rationale: Выбранная русская формулировка не решает без достаточных оснований, говорится ли о получающем спасение или о временно уцелевшем перед последующим судом.
- issue: Несоответствие предоставленного греческого текста ожидаемому контексту Сир 33:11
  choice: Перевести предоставленный греческий текст как самостоятельную молитву о суде
  alternative: Согласовать стих с иной рукописной традицией или системой нумерации
  rationale: Приоритет отдаётся непосредственно предоставленному греческому свидетельству; расхождение отмечается, но текст не гармонизируется.
translation_notes:
  register: Современный литературный русский язык с торжественной, молитвенно-судебной интонацией. Частица «да» сохраняет пожелательно-повелительный строй оригинала; необычный образ «ярость огня» намеренно не сглажен.
