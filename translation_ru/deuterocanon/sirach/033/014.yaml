  yaml_path: translation/deuterocanon/sirach/033/014.yaml
  text: Opposite evil is good[a], and opposite death is life; so opposite a godly man is a sinner.
translation:
  language: ru
  text: Напротив зла — добро, и напротив смерти — жизнь; так и напротив благочестивого — грешник.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέναντι
  choice: напротив
  rationale: Троекратное ἀπέναντι выстраивает ряд противопоставленных пар. «Напротив» сохраняет пространственный образ и афористический параллелизм греческого текста.
- source_word: κακοῦ / ἀγαθόν
  choice: зла / добро
  rationale: Субстантивированные прилагательные естественно передаются отвлечёнными существительными, образующими ясную нравственную антитезу.
- source_word: θανάτου / ζωή
  choice: смерти / жизнь
  rationale: Прямые и однозначные соответствия сохраняют вторую антитезу.
- source_word: οὕτως
  choice: так и
  rationale: Связывает заключительную пару с двумя предыдущими и естественно передаёт смысл «подобным образом».
- source_word: εὐσεβοῦς
  choice: благочестивого
  rationale: Субстантивированное прилагательное мужского рода в единственном числе передано без добавления слова «человек»; «благочестивый» выражает почтение к Богу и нравственную верность.
- source_word: ἁμαρτωλός
  choice: грешник
  rationale: Стандартное личное обозначение, сохраняющее мужской род, единственное число и прямой контраст с εὐσεβοῦς.
theological_decisions:
- issue: Личное противопоставление εὐσεβοῦς и ἁμαρτωλός
  choice: «благочестивого — грешник»
  alternative: «благочестивого человека — грешник»
  rationale: Греческий текст употребляет формы мужского рода в единственном числе субстантивно. Русский позволяет сохранить личный и грамматически мужской характер высказывания без внесённого существительного «человек».
translation_notes:
  register: Краткая афористическая фраза в современном литературном русском. Повтор «напротив» намеренно сохранён ради трёхчастного параллелизма; тире делает эллиптическую конструкцию естественной и ясной.
