  text: On the day your life's days come to an end[a], and at the time of death, distribute your inheritance.
translation:
  language: ru
  text: В день, когда завершатся дни твоей жизни[a], и в час смерти распредели наследство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в день завершения дней твоей жизни».'
    reason: Сноска сохраняет необычную именную конструкцию греческого текста, в основном тексте переданную естественной русской придаточной конструкцией.
lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: В день
  rationale: Естественная русская передача временного оборота с ἐν и дательным падежом, сохраняющая указание на определённый момент.
- source_word: συντελείας ἡμερῶν ζωῆς σου
  choice: когда завершатся дни твоей жизни
  rationale: Передаёт существительное συντέλεια как завершение и сохраняет буквальный образ «дней твоей жизни», не сглаживая его до простого «жизнь завершится».
- source_word: καὶ ἐν καιρῷ τελευτῆς
  choice: и в час смерти
  rationale: καιρός указывает на наступившее время или пору, а τελευτή в данном контексте означает смерть. «В час смерти» естественно и достойно передаёт сочетание, не добавляя идеи точного назначенного срока.
- source_word: διάδος
  choice: распредели
  rationale: Повелительная форма διαδίδωμι обозначает раздачу или распределение между получателями; этот глагол естественно сочетается с наследством.
- source_word: κληρονομίαν
  choice: наследство
  rationale: Прямой и общеупотребительный русский эквивалент для имущества, передаваемого наследникам.
