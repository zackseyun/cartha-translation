lexical_decisions:
- source_word: ἔμβλεψον
  choice: взгляни на
  rationale: Повелительная форма призывает направить внимание на предмет. «Взгляни на» естественно для современного русского языка и сохраняет зрительный оттенок глагола.
- source_word: πάντα τὰ ἔργα
  choice: все дела
  rationale: ἔργα широко обозначает творения и деяния Всевышнего. «Дела» сохраняет эту смысловую широту и привычно звучит в библейской речи.
- source_word: τοῦ ὑψίστου
  choice: Всевышнего
  rationale: ὁ ὕψιστος — устойчивый титул Бога; «Всевышний» является точным и общепринятым русским соответствием.
- source_word: δύο δύο
  choice: идут по два
  rationale: Повтор числительного имеет распределительное значение. Добавление «идут» делает фразу естественной по-русски, не устраняя образ попарного устройства.
- source_word: ἓν κατέναντι τοῦ ἑνός
  choice: одно напротив другого
  rationale: κατέναντι может указывать как на противопоставление, так и на соотнесённое расположение. Основной вариант сохраняет выраженную в контексте парность контрастов.
theological_decisions:
- issue: Божественный титул ὁ ὕψιστος
  choice: Всевышний
  alternative: Наивысший
  rationale: «Всевышний» — традиционный и понятный титул Бога в русской библейской речи, не добавляющий особого доктринального оттенка.
- issue: Характер пар в делах Всевышнего
  choice: одно напротив другого
  alternative: одно в соответствии с другим
  rationale: Греческое κατέναντι допускает и противопоставление, и парное соответствие. В основном тексте передан контраст, а альтернативный смысл сохранён в примечании, чтобы не устранять исходную неоднозначность.
