  text: And there is a friend who changes into enmity[b][a], and he will expose a quarrel to your disgrace.
translation:
  language: ru
  text: Бывает и друг, переходящий к вражде[a], и он раскроет ссору, тебе на позор[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «друг, обращающийся во вражду»; в греческом тексте употреблено отвлечённое существительное «вражда», а не слово «враг».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «раскроет ссору как поношение для тебя». Греческое выражение кратко и допускает акцент либо на позорном характере самой ссоры, либо на позоре, который принесёт её раскрытие.'
    reason: alternative_reading
lexical_decisions:
- source_word: φίλος
  choice: друг
  rationale: Обычное личное обозначение близкого человека; «друг» естественно передаёт смысл и соответствует контексту.
- source_word: μεταβαλλόμενος εἰς ἔχθραν
  choice: чья дружба оборачивается враждой
  rationale: Греческое выражение описывает переход друга во вражду. Перестройка через «чья дружба» делает фразу естественной по-русски и сохраняет абстрактное существительное ἔχθρα, не заменяя его словом «враг».
- source_word: μάχην
  choice: ссору
  rationale: В контексте межличностных отношений слово указывает скорее на спор или распрю, чем на физическое сражение.
- source_word: ἀποκαλύψει
  choice: предаст огласке
  rationale: Глагол означает «откроет, обнаружит, раскроет»; в контексте враждебного поступка выражение «предаст огласке» естественно передаёт разглашение того, что способно опозорить человека.
- source_word: ὀνειδισμοῦ σου
  choice: тебе на позор
  rationale: Так передаётся мотив поношения и бесчестья, при этом не утверждается сверх необходимого, относится ли определение непосредственно к ссоре или к последствию её разглашения.
