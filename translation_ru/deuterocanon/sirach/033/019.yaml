  text: Listen to me[a], you great men of the people, and you leaders of the assembly, give ear.
translation:
  language: ru
  text: Послушайте меня, знатные мужи народа, и вы, предводители собрания, внимайте.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσατέ
  choice: Послушайте
  rationale: Аористный императив множественного числа выражает прямой призыв к внимательному слушанию; «послушайте» естественно звучит по-русски и сохраняет побудительную силу.
- source_word: μεγιστᾶνες
  choice: знатные люди
  rationale: Слово обозначает влиятельных, высокопоставленных мужчин. «Знатные люди» сохраняет мужскую референцию, но не ограничивает смысл строго наследственной аристократией.
- source_word: λαοῦ
  choice: народа
  rationale: Прямой и естественный эквивалент коллективного обозначения народа в общественном контексте.
- source_word: ἡγούμενοι
  choice: предводители
  rationale: Субстантивированное причастие обозначает тех, кто возглавляет собрание. «Предводители» передаёт деятельное руководство, не превращая их непременно в формальных правителей.
- source_word: ἐκκλησίας
  choice: собрания
  rationale: В данном контексте речь идёт о собравшемся сообществе; «собрание» избегает анахроничного отождествления с позднейшим церковным институтом.
- source_word: ἐνωτίσασθε
  choice: внимайте
  rationale: Императив усиливает первоначальный призыв слушать. «Внимайте» кратко передаёт сосредоточенное слушание и сохраняет риторический параллелизм.
theological_decisions:
- issue: Мужская референция в обращении к общественной знати
  choice: знатные люди народа
  alternative: знатные среди народа
  rationale: Греческое существительное имеет мужскую форму и обозначает мужчин высокого положения; перевод не нейтрализует эту референцию, но и не добавляет более узкого понятия наследственной знати.
- issue: Передача ἐκκλησία
  choice: собрание
  alternative: община
  rationale: «Собрание» сохраняет основной смысл собравшегося общественного тела и не вносит не обязательного здесь позднейшего значения институциональной Церкви.
translation_notes:
  register: Современный литературный русский язык с dignified риторической интонацией. Повторный призыв к слушанию сохранён посредством пары «послушайте — внимайте»; синтаксическая структура греческого обращения передана без усложнения.
