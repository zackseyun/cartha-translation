lexical_decisions:
- source_word: πολλὴν
  choice: многому
  rationale: Прилагательное согласовано с κακίαν в единственном числе; в русском сочетание «многому злу» естественно передаёт количественную силу выражения, не превращая его в перечень отдельных злых дел.
- source_word: γὰρ
  choice: ведь
  rationale: Частица вводит обоснование предшествующего наставления. «Ведь» естественно и кратко сохраняет пояснительно-причинную связь.
- source_word: κακίαν
  choice: злу
  rationale: Слово широко обозначает зло, порочность или дурное; «зло» сохраняет общий нравственный смысл и не сужает его до злобы либо конкретного порока.
- source_word: ἐδίδαξεν
  choice: научила
  rationale: Аорист в изречении выражает обобщённое наблюдение. Простое прошедшее «научила» сохраняет педагогическую метафору и звучит в русском как завершённая сентенция.
- source_word: ἡ ἀργία
  choice: праздность
  rationale: Слово означает бездеятельность, незанятость. «Праздность» прямо и достойно передаёт этот смысл; «лень» сильнее подчёркивала бы внутреннее нежелание трудиться, а «бездействие» было бы менее выразительным.
