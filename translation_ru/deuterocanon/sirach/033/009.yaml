lexical_decisions:
- source_word: ἔξαρον
  choice: Подними
  rationale: Повелительная форма передаёт действие «поднять» или «воздвигнуть». Выбрано краткое и прямое соответствие, сохраняющее неоднозначность между буквальным поднятием и побуждением к действию.
- source_word: ἀντίδικον
  choice: противника
  rationale: Слово может обозначать соперника в споре или судебного противника, а шире — противостоящего человека. «Противник» сохраняет этот диапазон и хорошо соотносится с «врагом» во второй части.
- source_word: ἔκτριψον
  choice: истреби
  rationale: Повелительная форма от ἐκτρίβω, буквально «стереть, извести», в контексте вражды выражает полное уничтожение. «Истреби» передаёт силу образа естественным и достойным русским языком.
- source_word: ἐχθρόν
  choice: врага
  rationale: Обычное обозначение враждебного человека; неопределённость греческого существительного без артикля в русском естественно сохраняется формой без дополнительного определения.
