  alternative: Реконструировать строку по предполагаемому еврейскому оригиналу или другим греческим и переводным свидетельствам.
  rationale: Представленный греческий текст синтаксически ясен, но метаданные указывают на существенное расхождение. Поэтому перевод следует засвидетельствованной формулировке и отмечает текстологическую проблему в сноске.
