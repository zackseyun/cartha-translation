base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/020.yaml
  text: To son and wife[a], to brother and friend, do not give authority over yourself during your lifetime; and do not give your possessions to another[c][b], lest you regret it and have to plead for them.
translation:
  language: ru
  text: Сыну и жене, брату и другу не давай власти над собой, пока ты жив; и не отдавай другому своего имущества[a], чтобы потом не пожалеть и не пришлось просить о нём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих денег» или «своего достояния». Греческое χρήματα может обозначать деньги, вещи или имущество в широком смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы, пожалев, ты нуждался относительно него». Греческое выражение говорит о нужде или обращении с просьбой в связи с переданным имуществом; по смыслу может подразумеваться просьба вернуть его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱῷ καὶ γυναικί, ἀδελφῷ καὶ φίλῳ
  choice: сыну и жене, брату и другу
  rationale: Сохранены конкретные родственные и личные отношения, а также мужской род υἱῷ и ἀδελφῷ; γυναικί в бытовом перечне естественно означает «жене».
- source_word: μὴ δῷς ἐξουσίαν ἐπὶ σὲ
  choice: не давай власти над собой
  rationale: «Власть» передаёт значение ἐξουσία как права или полномочия распоряжаться человеком и его делами; оборот естественен по-русски и сохраняет структуру греческого выражения.
- source_word: ἐν ζωῇ σου
  choice: пока ты жив
  rationale: 'Современная и ясная передача временного ограничения: предупреждение относится к периоду жизни адресата.'
- source_word: μὴ δῷς ἑτέρῳ τὰ χρήματά σου
  choice: не отдавай другому своего имущества
  rationale: χρήματα может обозначать деньги, имущество или материальные средства вообще; «имущество» сохраняет широкий смысл, не сужая его до наличных денег.
- source_word: ἵνα μὴ μεταμεληθεὶς δέῃ περὶ αὐτῶν
  choice: чтобы потом не пожалеть и не просить его обратно
  rationale: μεταμεληθείς выражает последующее сожаление, а δέῃ περὶ αὐτῶν буквально указывает на нужду относительно отданного имущества. В контексте естественный смысл — оказаться вынужденным просить его обратно; этот смысл раскрыт без усиления до «умолять».
