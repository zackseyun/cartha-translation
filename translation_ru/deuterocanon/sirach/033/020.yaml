  source_fidelity: 'Основной смысл передан верно: запрет передавать власть над собой и имущество близким или другому лицу, пока человек жив. Однако заключительное «просить его обратно» несколько конкретизирует греческое δέῃ περὶ αὐτῶν: оно говорит о нужде/обращении с просьбой в связи с переданным имуществом, не выражая прямо «обратно».'
  naturalness: Текст звучит естественно и сохраняет лаконичный наставительный регистр. «Не пришлось просить о нём» столь же естественно, но точнее сохраняет сдержанность оригинала.
