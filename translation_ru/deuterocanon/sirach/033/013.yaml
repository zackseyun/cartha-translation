lexical_decisions:
- source_word: συνάγαγε
  choice: Собери
  rationale: Аористный императив глагола συνάγω передаёт прямое повеление. «Собери» естественно и кратко сохраняет эту силу.
- source_word: πάσας
  choice: все
  rationale: Форма πάσας всеохватно определяет существительное φυλάς; «все» — прямой и естественный русский эквивалент.
- source_word: φυλάς
  choice: колена
  rationale: В библейском контексте φυλή обозначает племенное подразделение Израиля. Традиционное русское «колена» точно передаёт устойчивое выражение «колена Иакова» и сохраняет возвышенный библейский регистр.
- source_word: Ἰακώβ
  choice: Иакова
  rationale: Греческий текст прямо называет Иакова; родительный падеж требуется русским сочетанием «колена Иакова» и сохраняет отсылку к праотцу.
