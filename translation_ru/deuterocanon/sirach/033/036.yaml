  text: Не советуйся с каждым, но имей одного советника из тысячи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἐν παντὶ ἀνθρώπῳ συμβούλευε
  choice: Не с каждым советуйся
  rationale: Передаёт запрет естественным современным русским языком. Предлог ἐν при συμβούλευε здесь указывает на того, с кем советуются; ἄνθρωπος употреблено обобщённо, поэтому «каждый» сохраняет смысл без ненужного указания пола.
- source_word: ἀλλὰ
  choice: но
  rationale: Сохраняет прямое противопоставление запрета и положительного наставления.
- source_word: ἕνα ἐκ χιλίων
  choice: из тысячи… одного
  rationale: Близко передаёт греческую конструкцию и сохраняет выразительную гиперболу о крайней избирательности.
- source_word: σύμβουλον ἔχε
  choice: выбери себе… советника
  rationale: Буквально ἔχε означает «имей, держи», однако в сочетании с «одного из тысячи» русское «выбери себе» естественно выражает требование обрести одного надёжного советника. Более формальная альтернатива отмечена в сноске.
