lexical_decisions:
- source_word: σύντριψον
  choice: Сокруши
  rationale: Аористный императив от συντρίβω передаёт решительное разбивание или сокрушение; «сокруши» сохраняет силу и возвышенную краткость образа.
- source_word: κεφαλὰς
  choice: головы
  rationale: Буквальное множественное число от κεφαλή; конкретный и резкий образ сохранён без смягчающего пересказа.
- source_word: ἀρχόντων
  choice: правителей
  rationale: Родительный падеж множественного числа от ἄρχων обозначает обладающих властью; «правителей» естественно передаёт политическое или властное значение.
- source_word: ἐχθρῶν
  choice: врагов
  rationale: 'Родительный падеж естественно зависит от «правителей»: речь о правителях врагов. Такая конструкция близка греческой и не устраняет возможную смысловую широту.'
- source_word: λεγόντων
  choice: которые говорят
  rationale: Причастие настоящего времени характеризует названных правителей; придаточное определительное звучит естественно по-русски.
- source_word: Οὐκ ἔστιν πλὴν ἡμῶν
  choice: Нет никого, кроме нас
  rationale: πλήν с родительным выражает исключение; перевод сохраняет хвастливое заявление об исключительности, не превращая его в сравнительное «нет никого, подобного нам».
theological_decisions:
- issue: Смысл заявления врагов
  choice: «Нет никого, кроме нас» — притязание на исключительное значение или власть.
  alternative: «Нет никого, подобного нам».
  rationale: Греческий оборот прямо выражает исключение, а не сравнение; перевод сохраняет высокомерный тон и не вносит более узкого богословского смысла.
translation_notes:
