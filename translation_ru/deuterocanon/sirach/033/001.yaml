base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/001.yaml
  text: One who fears Yahweh will not meet with evil[a], for even in trial he will turn back and escape.
translation:
  language: ru
  text: Боящийся Яхве не столкнётся со злом, а если ему и придётся бежать, он вновь спасётся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст второй части труден. По данной огласовке речь идёт о бегстве; при ином понимании согласных возможен перевод: «но и в испытании он вновь спасётся». Приведённый греческий параллельный текст относится к другому изречению и потому здесь не использован.'
    reason: Альтернативное прочтение и несоответствие греческого параллельного текста.
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: Боящийся Яхве
  rationale: Причастная конструкция обозначает человека, для которого характерно благоговение перед Яхве; единственное число сохраняет обобщённый характер изречения.
- source_word: לֹא יִפְגַּע רָע
  choice: не столкнётся со злом
  rationale: פגע означает встречу или столкновение, а רָע может обозначать как зло, так и бедствие; формулировка намеренно не сужает смысл до телесного вреда.
- source_word: כִּי אִם
  choice: а если … и
  rationale: Оборот вводит оговорку к первой части изречения. Русская уступительно-условная конструкция естественно передаёт напряжение между обещанием защиты и возможностью бегства.
- source_word: בְּנוּסוֹ
  choice: ему придётся бежать
  rationale: По данной огласовке форма естественно понимается от נוס, «бежать, спасаться бегством». При этом текстологическая и морфологическая трудность отмечена в сноске.
- source_word: שָׁב וְנִמְלָט
  choice: он вновь спасётся
  rationale: שָׁב может употребляться наречно в значении «снова», а נמלט означает «ускользнуть, спастись». Такое сочетание естественно по-русски и не вводит сюда без достаточных оснований тему покаяния.
theological_decisions:
- issue: Передача имени יְהֹוָה
  choice: Яхве
  alternative: Господь
  rationale: Передано личное имя Бога, непосредственно стоящее в еврейском тексте.
- issue: Сила обещания защиты от רָע
  choice: не столкнётся со злом
  alternative: не потерпит никакого вреда
  rationale: Выбранная формулировка сохраняет уверенность мудрого изречения, но не превращает его в однозначное обещание полного отсутствия страданий; вторая часть допускает опасность и бегство.
- issue: Толкование בְּנוּסוֹ
  choice: приходится бежать
  alternative: во время испытания
  rationale: Основной текст следует данной еврейской огласовке, а возможное понимание как испытания сохраняется в примечании, не устраняя реальную неопределённость.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная форма сохранена. «Столкнётся со злом» оставляет открытым широкий смысл רָע, а «вновь спасётся» естественно передаёт сочетание שָׁב וְנִמְלָט.
