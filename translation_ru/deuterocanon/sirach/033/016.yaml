  text: And I too kept watch last of all[a], like one who gleans behind the grape harvesters.
translation:
  language: ru
  text: И я тоже бодрствовал последним, словно тот, кто подбирает оставшееся вслед за сборщиками винограда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
