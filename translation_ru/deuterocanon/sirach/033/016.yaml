lexical_decisions:
- source_word: κἀγώ
  choice: И я
  rationale: Слияние καί и ἐγώ сохраняет связь с предыдущим контекстом и выделяет говорящего; по-русски это естественно передаётся сочетанием «И я».
- source_word: ἔσχατος
  choice: последний
  rationale: Предикативное прилагательное указывает, что говорящий оказался последним, после остальных; буквальная форма сохраняет образ и синтаксическую сжатость греческого текста.
- source_word: ἠγρύπνησα
  choice: бодрствовал
  rationale: Глагол означает «не спать, бодрствовать, быть бдительным». «Бодрствовал» сохраняет присущую оригиналу неоднозначность между буквальным бодрствованием и усердным поздним трудом.
- source_word: ὡς
  choice: словно
  rationale: Вводит образное сравнение; «словно» естественно и ясно обозначает его в современном русском языке.
- source_word: καλαμώμενος
  choice: подбирающий остатки винограда
  rationale: Причастие описывает собирание того, что осталось после основных работников. Упоминание винограда обусловлено следующим словом τρυγητῶν и делает сельскохозяйственный образ понятным без архаичного «подбирать колосья», неуместного для сбора винограда.
- source_word: ὀπίσω
  choice: вслед за
  rationale: Передаёт как следование позади работников, так и более позднее собирание оставшегося после них; в русском контексте звучит естественнее буквального «позади».
- source_word: τρυγητῶν
  choice: сборщиками
  rationale: Существительное обозначает работников, собирающих виноград; из словосочетания «остатки винограда» конкретная деятельность сборщиков уже ясна, поэтому повтор слова «виноград» не требуется.
