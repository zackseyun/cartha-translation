  text: When you acquire a friend[a], acquire him through testing, and do not quickly trust him.
translation:
  language: ru
  text: Когда приобретаешь друга, приобретай его через испытание[a] и не спеши ему доверять.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приобретай его во время испытания»; возможно также: «обретай его, испытав». Греческое выражение ἐν πειρασμῷ допускает несколько близких толкований.'
    reason: Лексико-синтаксическая неоднозначность выражения ἐν πειρασμῷ.
lexical_decisions:
- source_word: ὅταν κτήσῃ φίλον
  choice: Когда приобретаешь друга
  rationale: Конструкция ὅταν с сослагательным наклонением выражает общий повторяющийся случай. «Приобретаешь друга» сохраняет намеренно деловой оттенок κτάομαι и подготавливает повтор того же глагола.
- source_word: ἐν πειρασμῷ κτῆσαι αὐτόν
  choice: приобретай его через испытание[a]
  rationale: Повтор «приобретай» передаёт повтор κτάομαι и афористичность греческой строки. «Через испытание» естественно указывает на проверку надёжности друга, не устраняя полностью возможный временной смысл оборота ἐν πειρασμῷ.
- source_word: μὴ ταχὺ ἐμπιστεύσῃς αὐτῷ
  choice: не спеши ему доверять
  rationale: Идиоматический русский оборот точно передаёт запрет на поспешное доверие; дательный αὐτῷ отражён формой «ему».
theological_decisions:
- issue: Мужской род единичного образа друга
  choice: 'Сохранить формы мужского рода: «друга», «его», «ему»'
  alternative: Употребить обобщённо-нейтральную конструкцию во множественном числе
  rationale: Греческий текст последовательно использует мужской род единственного числа; русская форма одновременно сохраняет грамматику источника и обычный обобщающий характер наставления.
- issue: Характер испытания в выражении ἐν πειρασμῷ
  choice: 'Основной текст понимает его как проверку друга: «через испытание»'
  alternative: 'Понимать как время жизненного испытания: «во время испытания»'
  rationale: Контекст предостережения от преждевременного доверия поддерживает смысл проверки надёжности, однако греческий предлог ἐν допускает и временное понимание, поэтому оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством краткого наставления. Повтор «приобретаешь — приобретай» намеренно сохранён ради структуры и выразительности оригинала; более естественное «заводишь друга» было отвергнуто как сглаживающее этот повтор.
