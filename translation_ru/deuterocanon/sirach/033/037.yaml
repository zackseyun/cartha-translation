  verdict: approve
  source_fidelity: «Когда приобретаешь друга, приобретай его через испытание» сохраняет условно-обобщённую конструкцию ὅταν с аористным сослагательным, повтор κτάομαι и смысл ἐν πειρασμῷ как проверки. «Не спеши ему доверять» точно передаёт μὴ ταχὺ ἐμπιστεύσῃς αὐτῷ. Единственное число и мужской род сохранены в соответствии с греческим текстом.
  naturalness: Формулировка литературна и понятна для современного русского. Намеренный повтор «приобретаешь — приобретай» несколько афористичен, но оправдан повтором κτάομαι в оригинале; «не спеши ему доверять» естественно и кратко.
  terminology: «Испытание» уместно для πειρασμός в контексте проверки надёжности. Сноска корректно сохраняет возможность временного понимания «во время испытания» и близкий смысл проверки. Богословски нагруженных терминов нет.
