  text: For there is a friend in his own time[a], and he will certainly not remain in the day of your distress.
translation:
  language: ru
  text: Ведь есть друг лишь до поры[a], и в день твоего бедствия он ни за что не останется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «друг на время своё»; возможно также: «друг, пока ему это удобно». Речь идёт о дружбе, зависящей от благоприятных обстоятельств.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλος
  choice: друг
  rationale: Обычное и прямое обозначение личного друга; в данном контексте речь идёт о ненадёжности дружбы.
- source_word: ἐν καιρῷ αὐτοῦ
  choice: на своё время
  rationale: 'Сохраняет неоднозначность выражения: это может быть друг лишь на некоторое время либо друг, остающийся им, пока обстоятельства благоприятны для него.'
- source_word: οὐ μὴ παραμείνῃ
  choice: точно не останется с тобой
  rationale: Сочетание οὐ μή с сослагательным наклонением выражает усиленное отрицание; «точно не останется» передаёт его будущую направленность и категоричность. Добавление «с тобой» естественно выражает подразумеваемую верность другу в беде.
- source_word: ἐν ἡμέρᾳ θλίψεώς σου
  choice: в день твоего бедствия
  rationale: Сохраняет образ «дня» как времени испытания, а «бедствие» передаёт серьёзность θλῖψις.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением назидательной, афористичной формы. Союз «но» естественно передаёт смысловое противопоставление между временной дружбой и оставлением в беде, хотя в греческом стоит καί («и»).
