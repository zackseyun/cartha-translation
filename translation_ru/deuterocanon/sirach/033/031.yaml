  text: If you have a servant[a], let him be as yourself[b], because you acquired him with blood.
translation:
  language: ru
  text: Если у тебя есть раб[a], пусть он будет как ты сам, ведь кровью[b] ты приобрёл его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «домашний слуга». Греческое οἰκέτης нередко обозначает слугу из числа домашних, но упоминание о его приобретении подчёркивает здесь несвободный статус.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в крови». Вероятно, выражение указывает на приобретение дорогой ценой, однако текст не уточняет, чья кровь имеется в виду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέτης
  choice: раб
  rationale: Слово может обозначать домашнего слугу или члена домашней прислуги, однако глагол «приобрёл» в данном контексте подчёркивает зависимое положение и принадлежность хозяину; «раб» не смягчает эту социальную реальность.
- source_word: ἔστω ὡς σύ
  choice: пусть он будет как ты сам
  rationale: Передаёт прямую повелительную конструкцию греческого текста и сохраняет её смысловую широту, не сводя её только к указанию о том, как обращаться с рабом.
- source_word: ἐν αἵματι
  choice: кровью
  rationale: Буквально передаёт яркий и неоднозначный образ, не уточняя без достаточных оснований, чья кровь имеется в виду и каким именно образом приобретение было связано с кровью.
- source_word: ἐκτήσω
  choice: ты приобрёл
  rationale: «Приобрёл» отражает широкое значение κτάομαι и не навязывает исключительно торговый смысл, как могло бы слово «купил».
theological_decisions:
- issue: Передача обозначения зависимого домашнего работника
  choice: раб
  alternative: слуга; домашний слуга
  rationale: Контекст приобретения делает рабский, несвободный статус заметным; выбор «раб» сохраняет историческую и нравственную напряжённость текста, не смягчая её.
- issue: Смысл выражения «пусть он будет как ты»
  choice: пусть он будет как ты сам
  alternative: обращайся с ним как с самим собой
  rationale: 'Более буквальная формулировка сохраняет неоднозначность: речь может идти и о положении раба, и об отношении к нему. Развёрнутый вариант преждевременно ограничил бы смысл.'
translation_notes:
  register: Современный литературный русский язык с кратким, наставительным строем фразы. Сохранены прямота социальной терминологии, образ крови и смысловая открытость греческой конструкции.
