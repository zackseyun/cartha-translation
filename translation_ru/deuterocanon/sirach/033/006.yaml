  text: For there is no God except you, Lord. Renew signs and alter wonders,
translation:
  language: ru
  text: Ибо нет Бога, кроме Тебя, Господи. Обнови знамения и измени чудеса.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сотвори иные (новые) чудеса». Буквально: «измени чудеса».'
    reason: Глагол ἀλλοιόω означает «изменять, делать иным»; в данном молитвенном параллелизме возможна контекстуальная передача как просьбы о новых чудесах.
lexical_decisions:
- source_word: ἐγκαίνισον σημεῖα
  choice: Обнови знамения
  rationale: Императив ἐγκαίνισον передаёт просьбу обновить или совершить заново знамения; «обнови» сохраняет форму и смысл греческого выражения.
- source_word: ἀλλοίωσον θαυμάσια
  choice: яви иные чудеса
  rationale: Буквальное «измени чудеса» по-русски может означать исправление уже существующих чудес. В данном параллелизме ἀλλοιόω указывает на чудеса иного, нового рода; «яви иные» естественно выражает это, не сливая фразу с предыдущим императивом.
- source_word: πλὴν σοῦ
  choice: кроме Тебя
  rationale: Прямо передаёт исключительное значение греческого оборота.
theological_decisions:
- issue: Утверждение исключительности Бога
  choice: нет Бога, кроме Тебя
  alternative: нет бога, кроме Тебя
  rationale: Прописная буква у слова «Бог» соответствует прямому исповеданию единственного истинного Бога; смысл греческого текста сохранён без дополнительных догматических уточнений.
- issue: Характер просьбы о чудесах
  choice: яви иные чудеса
  alternative: измени чудеса
  rationale: Выбрана контекстуальная передача, согласно которой молящийся просит о новых проявлениях Божьей силы, а не об изменении природы прежних чудес. Необычная буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенно-возвышенным, но понятным строем. Местоимения обращения к Богу написаны с прописной буквы. Сохранены две параллельные повелительные просьбы.
