base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/017.yaml
  text: Have mercy on the people[a], O Lord, who are called by your name, and on Israel[b], whom you made equal to a firstborn son.
translation:
  language: ru
  text: Помилуй народ, Господи, названный Твоим именем[a], и Израиль, которого уподобь первенцу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Названный Твоим именем» — библейский оборот, означающий, что народ принадлежит Богу и носит Его имя.
    reason: cultural_note
  - marker: b
    text: 'Заключительная греческая фраза синтаксически трудна. Возможно также: «Израиль, которого Ты уподобил первенцу», то есть речь идёт не о новой просьбе, а о прежнем отношении Бога к Израилю.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλέησον
  choice: Помилуй
  rationale: Аористный императив передаёт прямую молитвенную просьбу о милосердном действии; «помилуй» естественно и торжественно звучит по-русски.
- source_word: λαόν
  choice: народ
  rationale: Существительное обозначает народ как единое целое; притяжательное «Твой» не добавлено, поскольку его нет в греческом тексте.
- source_word: Κύριε
  choice: Господи
  rationale: Русская звательная форма точно передаёт прямое молитвенное обращение κύριε.
- source_word: κεκλημένον ἐπ᾽ ὀνόματί σου
  choice: названный Твоим именем
  rationale: Формулировка сохраняет библейский оборот, указывающий на принадлежность народа Богу, не сводя его к простому произнесению имени.
- source_word: Ἰσραήλ
  choice: Израиль
  rationale: Общепринятая русская передача имени народа.
- source_word: ὃν
  choice: которого
  rationale: Мужской род относительного местоимения согласуется с Израилем, представленным как единый народ.
- source_word: πρωτογόνῳ
  choice: первенцу
  rationale: Дательный падеж после ὁμοιόω передаёт того, кому уподобляется Израиль; слово «сын» в греческом тексте прямо не выражено и потому не добавлено.
- source_word: ὁμοίωσον
  choice: уподобь
  rationale: Форма морфологически является аористным повелительным наклонением второго лица единственного числа. Русское «уподобь» сохраняет просьбу и сравнение, хотя синтаксис всей заключительной части остаётся трудным.
theological_decisions:
- issue: Статус Израиля как первенца
  choice: 'Заключительный глагол передан как новая просьба: «которого уподобь первенцу».'
  alternative: «которого Ты уподобил первенцу», то есть описание уже данного Израилю положения.
  rationale: ὁμοίωσον по форме является повелительным наклонением, поэтому основной текст сохраняет значение просьбы. Вместе с тем относительное местоимение ὃν делает конструкцию необычной, что допускает понимание фразы как указания на прежнее отношение Бога к Израилю; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью. Синтаксическая неровность заключительной фразы слегка сохранена ради неоднозначности греческого текста; местоимения в обращении к Богу написаны с прописной буквы.
