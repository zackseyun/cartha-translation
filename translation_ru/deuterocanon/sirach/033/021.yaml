  yaml_path: translation/deuterocanon/sirach/033/021.yaml
  text: As long as you are still alive and breath is in you[a], do not give yourself over to any flesh.
translation:
  language: ru
  text: Пока ты ещё жив и в тебе есть дыхание, не отдавай себя во власть никому[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. буквально: «не меняй (или: не отдавай) себя никакой плоти». Выражение необычно; возможный смысл: «не передавай себя никому» или «не подчиняй себя ни одному человеку».'
    reason: Сочетание ἀλλάξῃς σεαυτόν с πάσῃ σαρκί необычно; примечание сохраняет буквальный образ и синтаксическую неопределённость, не подменяя дательный падеж конструкцией «на какую плоть».
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: Пока ты ещё жив
  rationale: ἕως с ἔτι и формой настоящего времени выражает период, в течение которого человек продолжает жить; «пока ты ещё жив» естественно передаёт временной предел и усиление ἔτι.
- source_word: πνοὴ ἐν σοί
  choice: в тебе есть дыхание
  rationale: πνοή прежде всего означает дыхание; здесь оно служит признаком продолжающейся жизни. Перевод сохраняет конкретный образ без более нагруженного варианта «дух».
- source_word: μὴ ἀλλάξῃς σεαυτόν
  choice: не отдавай себя во власть
  rationale: Буквальное значение ἀλλάσσω — «менять, обменивать», однако сочетание возвратного объекта с дательным лица указывает на передачу себя другому или подчинение ему. «Не отдавай себя во власть» ясно передаёт этот смысл, не сводя наставление лишь к изменению поведения.
- source_word: πάσῃ σαρκί
  choice: никому
  rationale: Буквально — «никакой плоти», но в данном контексте σάρξ метонимически обозначает человека. В русском «никакой плоти» звучало бы неясно и могло бы восприниматься как указание на телесность вообще; «никому» естественно передаёт референт, а буквальная форма сохранена в примечании.
theological_decisions:
- issue: Значение πάσῃ σαρκί
  choice: никому
  alternative: никакой плоти / ни одному человеку
  rationale: Контекст наставляет не передавать себя под власть другого человека. Основной текст передаёт человеческий референт естественным русским словом, а примечание сохраняет необычный буквальный образ и тем самым не устраняет оттенок человеческой бренности.
- issue: Смысл μὴ ἀλλάξῃς σεαυτόν
  choice: не отдавай себя во власть
  alternative: не меняй себя / не передавай себя / не подчиняйся
  rationale: Греческая конструкция допускает оттенки передачи себя и подчинения. Выбранная формулировка передаёт практический смысл предостережения, а примечание отмечает возможные варианты, не превращая его в узкоконфессиональное утверждение.
translation_notes:
  register: Современный литературный русский язык; обращение на «ты» соответствует форме единственного числа в греческом. Тон краткий, наставительный и достойный. Буквально неясное «никакой плоти» вынесено в примечание, тогда как основной текст остаётся понятным обычному читателю.
