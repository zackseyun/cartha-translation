translation:
  language: ru
  text: Как перед ними ты был явлен святым среди нас[a], так перед нами будь возвеличен среди них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ты был освящён среди нас». По отношению к Богу это библейское выражение означает, что Его святость была явлена или признана.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческая форма выражает пожелание или молитву; возможно также: «да будешь возвеличен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ … οὕτως
  choice: как … так
  rationale: Сохраняет ясную соотносительную конструкцию и параллелизм греческой фразы.
- source_word: ἐνώπιον αὐτῶν
  choice: перед ними
  rationale: Передаёт значение присутствия или нахождения на виду и сохраняет соответствие с последующим «перед нами».
- source_word: ἡγιάσθης
  choice: ты был явлен святым
  rationale: Аорист пассива от ἁγιάζω применительно к Богу означает не приобретение святости, а явление и признание Его святости. Формулировка сохраняет пассив и делает библейскую идиому понятной современному читателю.
- source_word: ἐν ἡμῖν
  choice: среди нас
  rationale: Обозначает сферу явления внутри сообщества; «среди нас» естественнее буквального «в нас».
- source_word: ἐναντίον ἡμῶν
  choice: перед нами
  rationale: Передаёт нахождение в присутствии или на виду и поддерживает симметрию выражения «перед ними».
- source_word: μεγαλυνθείης
  choice: будь возвеличен
  rationale: Пассивный оптатив выражает молитвенное пожелание. Повелительная форма «будь» естественно передаёт это значение, не превращая его в утверждение.
- source_word: ἐν αὐτοῖς
  choice: среди них
  rationale: Параллельно «среди нас» указывает на явление Божьего величия в среде другой группы людей.
theological_decisions:
- issue: Смысл пассива ἡγιάσθης по отношению к Богу
  choice: «ты был явлен святым»
  alternative: «ты был освящён»; «тебя признали святым»
  rationale: Бог не становится святым вследствие чужого действия. Греческая библейская идиома говорит о том, что Его святость была явлена или признана. Выбранная формулировка сохраняет пассивную конструкцию и не определяет, кто именно признал Бога святым.
- issue: Молитвенная сила оптатива μεγαλυνθείης
  choice: «будь возвеличен»
  alternative: «да будешь возвеличен»; «пусть будет явлено твоё величие»
  rationale: Оптатив обозначает пожелание или прошение. «Будь возвеличен» сохраняет молитвенный тон, пассивный залог и лаконичный параллелизм исходного текста.
translation_notes:
  register: Современный литературный русский с возвышенным молитвенным тоном. Параллелизм «перед ними — перед нами» и «среди нас — среди них» сохранён; устаревшая формула «да будешь» вынесена в примечание.
