  text: On the day the days of your life are completed[a], and at the time of death, give an inheritance.
translation:
  language: ru
  text: В день завершения дней твоей жизни[a] и в час кончины оставь наследство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «в день завершения дней твоей жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ
  choice: В день
  rationale: Временное ἐν с дательным падежом естественно передаётся по-русски как «в день».
- source_word: συντελείας
  choice: когда завершатся
  rationale: Существительное обозначает завершение или окончание; придаточная конструкция сохраняет смысл и звучит естественно по-русски.
- source_word: ἡμερῶν ζωῆς σου
  choice: дни твоей жизни
  rationale: Прямо и понятно передаёт греческую родительную конструкцию, сохраняя её библейскую образность.
- source_word: καιρῷ τελευτῆς
  choice: в час смерти
  rationale: καιρός обозначает определённое время, а τελευτή здесь — конец жизни, смерть. «В час смерти» — естественная и достойная русская формулировка.
- source_word: διδὸς
  choice: передай
  rationale: Императив δίδωμι буквально означает «дай», но применительно к наследству русское «передай» точнее выражает распоряжение имуществом без добавления чуждого содержания.
- source_word: κληρονομίαν
  choice: наследство
  rationale: Слово обозначает наследство или наследственное имущество; конкретное «наследство» сохраняет семейно-правовой смысл.
theological_decisions:
- issue: Передавать ли κληρονομίαν конкретным словом «наследство» или более широким «наследие».
  choice: наследство
  alternative: наследие
  rationale: Контекст содержит практическое наставление о передаче имущества в конце жизни. «Наследство» сохраняет конкретный семейно-правовой смысл и не вносит метафорических оттенков.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сделан естественным, а буквальная греческая конструкция сохранена в сноске.
