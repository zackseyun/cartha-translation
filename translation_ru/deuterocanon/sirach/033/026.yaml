  text: Put your servant to work[a], and you will find rest; let his hands be idle, and he will seek freedom.
translation:
  language: ru
  text: Заставь раба[a] работать — и обретёшь покой; позволь его рукам бездействовать — и он будет искать свободы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое παιδί буквально означает «ребёнок» или «мальчик» и может обозначать подвластного домашнего слугу; здесь слова о поисках свободы указывают, вероятнее всего, на раба.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: Заставь раба работать
  rationale: Аористный императив передаёт прямое повеление. В данном употреблении оборот означает задействовать подвластного человека в труде; русская формулировка естественна и сохраняет принудительный характер отношений.
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: обретёшь покой
  rationale: Сохраняет образ нахождения покоя и естественно звучит в литературной речи.
- source_word: ἄνες χεῖρας αὐτῷ
  choice: позволь его рукам бездействовать
  rationale: ἀνίημι здесь означает ослабить требование, дать рукам оставаться без дела. Перевод удерживает конкретный образ рук, не сводя его просто к общему понятию праздности.
- source_word: ζητήσει ἐλευθερίαν
  choice: он станет искать свободы
  rationale: ζητέω передано нейтральным «искать», без усиления до требования или мятежа; ἐλευθερία прямо обозначает свободу.
theological_decisions:
- issue: Социальное положение, обозначенное словом παιδί
  choice: раб
  alternative: слуга; мальчик; ребёнок
  rationale: Хотя слово буквально связано с ребёнком или мальчиком и может обозначать домашнего слугу, упоминание принудительного труда и поисков свободы делает несвободный статус существенным. «Раб» передаёт эту социальную реальность без смягчения.
translation_notes:
  register: Современный литературный русский язык с лаконичной формой изречения. Сохранены параллелизм двух половин стиха, конкретный образ рук и напряжение между покоем хозяина и стремлением раба к свободе.
