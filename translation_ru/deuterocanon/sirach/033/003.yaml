base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/003.yaml
  text: A discerning man understands the word of Yahweh[b][a], and his instruction is like the Urim in the breastpiece.
translation:
  language: ru
  text: Рассудительный человек понимает слово Яхве[a], и его наставление — словно урим в нагруднике[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст этого стиха резко отличается от дошедшего до нас греческого текста, где сказано: «Подними руку Твою на чужие народы, и пусть они увидят Твоё могущество». Здесь перевод следует еврейскому свидетельству.'
    reason: textual_variant
  - marker: b
    text: Слова «его наставление» могут означать наставление рассудительного человека или наставление Яхве.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ נָבוֹן
  choice: рассудительный человек
  rationale: Передаёт образ зрелого, способного к верному различению человека; сохраняет мужской род исходного выражения, но звучит естественно по-русски.
- source_word: יָבִין
  choice: понимает
  rationale: 'Прямо передаёт значение глагола בין в контексте мудрости: верно постигать смысл.'
- source_word: דְּבַר יְהֹוָה
  choice: слово Яхве
  rationale: דָּבָר здесь естественно понимать как божественное слово или изречение, а тетраграмматон передан личным именем «Яхве».
- source_word: וְתוֹרָתוֹ
  choice: его наставление
  rationale: «Наставление» сохраняет педагогический смысл תּוֹרָה и не сужает его до юридического «закона»; местоимение намеренно оставлено двусмысленным.
- source_word: כְּאוּרִים
  choice: словно урим
  rationale: Форма указывает на установленный культовый термин «урим», связанный со священническим узнаванием Божьего решения, а не просто на «свет».
- source_word: בַּחֹשֶׁן
  choice: в нагруднике
  rationale: Имеется в виду священнический нагрудник, а не защитный доспех; современное слово понятно читателю и сохраняет предметный образ.
theological_decisions:
- issue: Передача имени יְהֹוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон; транслитерированная форма сохраняет личное имя Бога и не заменяет его титулом.
- issue: К кому относится суффикс в וְתוֹרָתוֹ
  choice: его наставление — с сохранением неоднозначности местоимения
  alternative: наставление рассудительного человека; наставление Яхве
  rationale: Еврейское местоимение допускает соотнесение как с рассудительным человеком, продолжающим быть темой высказывания, так и с непосредственно названным Яхве. Основной текст не устраняет эту неоднозначность, а примечание поясняет её.
translation_notes:
  register: Современный литературный русский язык с достоинством, присущим тексту премудрости. Сохранены технический термин «урим», конкретный образ священнического нагрудника и подлинная синтаксическая неоднозначность местоимения.
