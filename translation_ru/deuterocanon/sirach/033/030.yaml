base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/033/030.yaml
  text: Set him to work as is fitting for him[a], and if he does not obey, make his fetters heavy; but do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: ru
  text: Назначь ему подходящие для него работы; а если он не повинуется, утяжели его оковы. Но ни с одним человеком не переходи меры[a] и ничего не делай без рассуждения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ни с какой плотью».'
    reason: Сохраняет конкретную греческую формулировку ἐν πάσῃ σαρκί при естественной передаче её идиоматического смысла в основном тексте.
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: Поставь его на ... работы
  rationale: Передаёт как назначение/поставление, выраженное κατάστησον, так и конкретные работы или занятия, обозначенные ἔργα.
- source_word: καθὼς πρέπει αὐτῷ
  choice: подобающие ему
  rationale: Естественно и кратко передаёт значение уместности и соответствия в πρέπει, не уточняя, по какому именно признаку работы ему подходят.
- source_word: κἂν μὴ πειθαρχῇ
  choice: а если он не повинуется
  rationale: πειθαρχέω означает повиноваться власти или установленному порядку; существительное «дисциплина» в греческом тексте отсутствует.
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: утяжели его оковы
  rationale: 'Сохраняет прямой образ физического стеснения: βαρύνω — делать тяжёлым, πέδαι — оковы, путы.'
- source_word: μὴ περισσεύσῃς
  choice: не переходи меры
  rationale: В запрете περισσεύω указывает на превышение должной меры. Русская формулировка естественна и не добавляет отсутствующее в тексте определение вроде «чрезмерно суров».
- source_word: ἐν πάσῃ σαρκί
  choice: ни с одним человеком[a]
  rationale: В данном контексте «всякая плоть» идиоматически обозначает любого человека. Основной текст передаёт смысл по-русски естественно, а буквальный образ сохраняется в примечании.
- source_word: ἄνευ κρίσεως
  choice: без рассуждения
  rationale: 'Сохраняет широту κρίσις: обдуманное суждение, различение или решение, не сводя выражение исключительно к судебному разбирательству.'
- source_word: μὴ ποιήσῃς μηδέν
  choice: ничего не делай
  rationale: Естественно передаёт категорический запрет, выраженный греческим сочетанием отрицаний.
theological_decisions:
- issue: Этически трудное наставление о принудительном труде и оковах
  choice: Сохранить прямые указания о работах, повиновении и утяжелении оков
  alternative: Смягчить их до общего наставления о служении и ограничении
  rationale: Греческий текст прямо говорит о труде и физических оковах. Перевод не должен скрывать социальную и нравственную трудность отрывка.
- issue: Значение выражения ἐν πάσῃ σαρκί
  choice: В основном тексте передать идиоматически как «ни с одним человеком», а буквальную форму привести в примечании
  alternative: Оставить в основном тексте «ни с какой плотью»
  rationale: В греческом σάρξ сохраняет конкретный образ «плоти», но всё выражение обозначает людей. Буквальная русская калька здесь неестественна и может затемнить смысл; примечание сохраняет исходную формулировку и её антропологический оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством назидательной речи. Синтаксис прямой и понятный; жёсткая лексика оригинала не смягчена. «Подобающие» и «рассуждение» слегка возвышенны, но общеупотребительны и соответствуют жанру Премудрости.
