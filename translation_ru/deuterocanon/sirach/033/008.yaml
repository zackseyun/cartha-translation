lexical_decisions:
- source_word: ἔγειρον
  choice: Пробуди
  rationale: Повелительная форма от ἐγείρω передаёт побуждение вызвать θυμός к активному проявлению. «Пробуди» сохраняет образ и звучит естественно и возвышенно.
- source_word: θυμόν
  choice: гнев
  rationale: θυμός может означать гнев, пыл или яростный порыв. «Гнев» здесь не чрезмерно усиливает значение и позволяет отличить его от следующего ὀργή.
- source_word: ἔκχεον
  choice: излей
  rationale: Повелительная форма от ἐκχέω буквально передаёт образ изливания; «излей» — естественный русский эквивалент, сохраняющий метафору.
- source_word: ὀργήν
  choice: ярость
  rationale: ὀργή обозначает гнев или негодование. «Ярость» позволяет избежать повтора слова «гнев» и передаёт силу выраженного чувства, не устраняя параллелизм.
theological_decisions:
- issue: Целостность источника и деление на стихи
  choice: Перевести сохранившуюся греческую клаузу как самостоятельную строку с двумя повелениями, не добавляя слов из контекста.
  alternative: Считать строку частью более длинного предложения согласно иной редакции или иной разбивке текста.
  rationale: Предоставленное греческое свидетельство содержит только эту повелительную клаузу и отмечено как имеющее существенное расхождение. Поэтому перевод строго следует засвидетельствованному тексту и открыто указывает на его ограниченность.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным и умеренно возвышенным библейским звучанием. Параллелизм двух повелений и различие между θυμός и ὀργή сохранены без добавления отсутствующего контекста.
