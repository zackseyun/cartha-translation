  text: Fodder and a rod and loads are for a donkey[a]; bread and discipline and work are for a servant.
translation:
  language: ru
  text: Корм, палка и грузы — ослу; хлеб, воспитание и работа — рабу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «домашнему слуге». Греческое слово обозначает зависимого слугу, принадлежащего к домашнему хозяйству.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: корм
  rationale: Во множественном числе слово обозначает пищу для животного; русское собирательное «корм» естественно передаёт этот смысл.
- source_word: ῥάβδος
  choice: палка
  rationale: Сохраняет конкретный образ орудия управления и наказания, не сводя значение только к наказанию.
- source_word: φορτία
  choice: грузы
  rationale: Передаёт множественное число и буквально обозначает то, что навьючивают на осла.
- source_word: ὄνῳ
  choice: ослу
  rationale: Дательный падеж соответствует греческой форме и естественно входит в русскую безглагольную пословичную конструкцию.
- source_word: ἄρτος
  choice: хлеб
  rationale: Сохраняет конкретный образ греческого текста, хотя слово может шире обозначать пищу.
- source_word: παιδεία
  choice: воспитание
  rationale: Передаёт широкий диапазон наставления, приучения и исправления, не сужая слово до одного лишь обучения или телесного наказания.
- source_word: ἔργον
  choice: работа
  rationale: Прямой и естественный эквивалент в контексте устройства домашнего хозяйства.
- source_word: οἰκέτῃ
  choice: рабу
  rationale: В данном контексте слово обозначает зависимого домашнего работника несвободного статуса; «раб» не смягчает отражённую в изречении древнюю социальную реальность.
theological_decisions:
- issue: Передача οἰκέτῃ в изречении об управлении домом
  choice: рабу
  alternative: домашнему слуге
  rationale: Контекст сопоставляет управление ослом и зависимым членом хозяйства, поэтому несвободный статус здесь существенен. Вариант «слуга» возможен лексически, но способен создать впечатление свободно нанятого работника.
translation_notes:
  register: Краткая безглагольная конструкция сохраняет афористический параллелизм оригинала. Лексика современная и понятная; исторически жёсткий смысл текста не смягчён и не усилен.
