lexical_decisions:
- source_word: κρεῖσσον
  choice: лучше
  rationale: 'Естественно передаёт сравнительную оценку: что предпочтительнее и полезнее.'
- source_word: τὰ τέκνα
  choice: твои дети
  rationale: τέκνα обозначает детей без ограничения по полу; местоимение передаёт родительный σου при δεηθῆναι в естественном русском построении.
- source_word: δεηθῆναί σου
  choice: нуждались в тебе
  rationale: δέομαι с родительным здесь выражает нужду в ком-либо или зависимость от него.
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: смотреть на руки
  rationale: Сохраняет конкретный греческий образ ожидания помощи или содержания, не заменяя его сразу толкованием.
- source_word: υἱῶν σου
  choice: своих сыновей
  rationale: υἱοί, в отличие от более широкого τέκνα, означает именно сыновей; «своих» естественно при совпадении субъекта и обладателя.
