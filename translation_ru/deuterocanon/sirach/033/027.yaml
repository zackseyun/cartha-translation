  source_fidelity: 'Текст точно передаёт структуру и основные образы греческого оригинала: ζυγός — «ярмо», ἱμάς — «ремень», κάμψουσιν — «согнут», στρέβλαι — «дыбы», βάσανοι — «пытки». Будущее время и обобщённое «шею» сохранены. Вторая часть корректно передана именной конструкцией с тире, соответствующей отсутствующему в греческом глаголу.'
