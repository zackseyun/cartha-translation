  yaml_path: translation/deuterocanon/sirach/033/027.yaml
  text: A yoke and a strap will bend the neck[a], and for a wicked servant there are racks and tortures.
translation:
  language: ru
  text: Ярмо и ремень согнут шею, а злому рабу[a] — дыбы и пытки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злому слуге»; греческое οἰκέτης может означать домашнего слугу или раба.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζυγός
  choice: ярмо
  rationale: В сочетании с шеей имеется в виду конкретное ярмо, а не весы; «ярмо» точно сохраняет предметный образ и оттенок принуждения.
- source_word: ἱμάς
  choice: ремень
  rationale: Слово обозначает кожаный ремень или ремешок; «ремень» естественно звучит по-русски и сохраняет образ средства удержания.
- source_word: κάμψουσιν
  choice: согнут
  rationale: Форма будущего времени передаёт физическое действие; «согнут» сохраняет образ, не усиливая его толкованием.
- source_word: τράχηλον
  choice: шею
  rationale: Единственное число употреблено обобщённо; русская форма без определения естественно передаёт эту сентенцию.
- source_word: οἰκέτῃ
  choice: рабу
  rationale: οἰκέτης может обозначать домашнего слугу или раба; контекст принудительного подчинения и телесного наказания делает «раб» наиболее точным обозначением зависимого статуса.
- source_word: κακούργῳ
  choice: злому
  rationale: Прилагательное характеризует человека как дурного или злого; «злому» не сужает значение до юридического понятия «преступник».
- source_word: στρέβλαι
  choice: дыбы
  rationale: Существительное обозначает орудия истязания, в частности дыбу; множественное число оригинала сохранено.
- source_word: βάσανοι
  choice: пытки
  rationale: Слово обозначает пытки или тяжкие мучения; «пытки» сохраняет суровость и конкретность контекста.
theological_decisions:
- issue: Передача зависимого статуса в οἰκέτῃ
  choice: раб
  alternative: слуга; домашний слуга
  rationale: Хотя слово допускает более широкое значение домашнего слуги, здесь ярмо, ремень и истязания подчёркивают несвободный статус и принуждение. Альтернатива указана в примечании, чтобы сохранить лексическую широту.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Тире естественно восполняет отсутствующий во второй части глагол и сохраняет резкое параллельное построение оригинала.
