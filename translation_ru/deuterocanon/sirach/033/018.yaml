  text: Understand that I have not labored for myself alone[a], but for all who seek instruction.
translation:
  language: ru
  text: 'Поймите: я трудился не для себя одного, а для всех, кто ищет наставления.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воспитания» или «обучения». Греческое слово παιδεία может обозначать не только передачу знаний, но и нравственное формирование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: Поймите
  rationale: Аористный императив во множественном числе призывает слушателей осознать сказанное; «поймите» ясно и естественно передаёт эту силу.
- source_word: οὐκ ἐμοὶ μόνῳ
  choice: не только для себя
  rationale: Дательный указывает, в чью пользу совершался труд; эта формулировка естественно выражает, что труд был предпринят не ради одного лишь говорящего.
- source_word: ἐκοπίασα
  choice: я трудился
  rationale: Глагол κοπιάω обозначает напряжённый, требующий усилий труд. «Трудился» сохраняет этот оттенок и соответствует достойному современному регистру.
- source_word: πᾶσιν τοῖς ζητοῦσιν
  choice: для всех, кто ищет
  rationale: Передаёт обобщающий и включительный смысл греческого субстантивированного причастия без ненужного усложнения.
- source_word: παιδείαν
  choice: наставления
  rationale: παιδεία охватывает обучение, воспитание и нравственное формирование. «Наставление» здесь наиболее естественно сохраняет широту смысла, тогда как «образование» звучало бы слишком институционально.
