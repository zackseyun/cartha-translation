  text: Settle a stranger with you[a], and he will throw you into turmoil, and estrange you from your own.
translation:
  language: ru
  text: Посели у себя чужого[a] — и он ввергнет тебя в смуту и отчуждит тебя от твоих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужака». Греческое слово обозначает того, кто не принадлежит к своему дому, кругу или к тому, что считается своим; оно не обязательно указывает на иноземца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παροίκισον
  choice: посели у себя
  rationale: 'Повелительная форма каузативного глагола: дать кому-либо поселиться рядом или в своём доме. Русское выражение естественно передаёт принятие человека на жительство.'
- source_word: ἀλλότριον
  choice: чужого
  rationale: Слово обозначает того, кто принадлежит не к своему кругу, чужака. «Чужого» сохраняет смысловую связь с последующим «твоих» и не сужает значение до этнического иностранца.
- source_word: διαστρέψει σε ἐν ταραχαῖς
  choice: ввергнет тебя в смуту
  rationale: В данном сочетании глагол указывает на нарушение нормального порядка, а ταραχαί — на беспорядок, волнение или смуту. Перевод передаёт практические последствия, не приписывая тексту нравственного развращения.
- source_word: ἀπαλλοτριώσει σε
  choice: отдалит тебя
  rationale: Глагол означает сделать чужим, отчуждить. «Отдалит» звучит естественно и сохраняет направленность последующего родительного оборота.
- source_word: τῶν ἰδίων σου
  choice: от твоих
  rationale: 'Греческая субстантивированная форма намеренно широка: речь может идти о своих людях, домашних либо о том, что принадлежит человеку. Эллиптическое «твоих» сохраняет личностный оттенок и не устраняет неоднозначность.'
