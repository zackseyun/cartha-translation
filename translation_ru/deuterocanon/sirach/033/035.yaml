    issue: «Отдалит тебя» ослабляет ἀπαλλοτριώσει.
    rationale: Глагол обозначает не просто увеличение дистанции, а отчуждение, превращение человека в чужого по отношению к «своим». «Отчуждит» лучше сохраняет силу и образность исходного выражения.
  - severity: low
    issue: Сноска описывает значение «чужого» несколько уже, чем позволяет контекст.
    rationale: Формула «не принадлежит к своему дому или кругу» полезна, но может прозвучать как исчерпывающее определение. Добавление «или к тому, что считается своим» лучше сохраняет широкую семантику без навязывания одного толкования.
