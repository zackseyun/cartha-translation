  verdict: revise
  source_fidelity: «Посели у себя чужого» точно передаёт повелительное каузативное παροίκισον и широкий смысл ἀλλότριον, не сводя его к этническому иностранцу. «Ввергнет тебя в смуту» удачно передаёт πρακтический, разрушительный смысл διαστρέψει σε ἐν ταραχαῖς. Однако «отдалит тебя» заметно слабее ἀπαλλοτριώσει, то есть «сделает чужим, отчуждит/отдалит как от своего».
  naturalness: Текст краток, афористичен и естественен для современного литературного русского. Тире после первого побудительного предложения уместно. «Отчуждит тебя от твоих» несколько книжнее, но в данном сжатом наставлении ясно, естественно и семантически точнее, чем «отдалит».
  terminology: «Чужой» и «твои» сохраняют намеренную широту греческих ἀλλότριον и τῶν ἰδίων σου. Примечание уместно объясняет, что «чужой» не обязательно означает иноземца; его следует немного расширить, чтобы не ограничивать принадлежность лишь домом или кругом, поскольку τῶν ἰδίων σου также допускает более широкий смысл «своего».
  issues:
