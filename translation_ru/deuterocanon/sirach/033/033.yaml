  yaml_path: translation/deuterocanon/sirach/033/033.yaml
  text: Fodder and a rod and loads are for a donkey[a]; bread and discipline and work are for a servant.
translation:
  language: ru
  text: Корм, палка и поклажа — ослу; хлеб, воспитание и работа — домашнему рабу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «домашнему слуге»; греческое слово οἰκέτης обозначает домашнего раба или слугу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χορτάσματα
  choice: корм
  rationale: Множественное число обозначает пищу для животных; русское собирательное «корм» естественно передаёт смысл в отношении осла.
- source_word: ῥάβδος
  choice: палка
  rationale: В данном изречении это орудие понуждения и исправления, а не посох; «палка» звучит конкретно и передаёт суровость образа.
- source_word: φορτία
  choice: поклажа
  rationale: Речь о грузе, который несёт вьючное животное; «поклажа» точно и естественно сохраняет этот конкретный образ.
- source_word: ὄνῳ
  choice: ослу
  rationale: Дательный падеж сохраняет лаконичный параллелизм греческого именного изречения.
- source_word: ἄρτος
  choice: хлеб
  rationale: Греческий текст называет именно хлеб; конкретное слово сохранено, хотя в контексте оно может обозначать пропитание вообще.
- source_word: παιδεία
  choice: воспитание
  rationale: Слово охватывает обучение, формирование и исправление; «воспитание» сохраняет эту широту и не сводит смысл только к наказанию.
- source_word: ἔργον
  choice: работа
  rationale: Прямое современное обозначение труда или назначенного дела.
- source_word: οἰκέτῃ
  choice: домашнему рабу
  rationale: οἰκέτης обозначает принадлежащего дому раба или домашнего слугу; «домашний раб» сохраняет и бытовую сферу, и несвободный статус.
theological_decisions:
- issue: Передача οἰκέτῃ в контексте домашнего подчинения
  choice: домашнему рабу
  alternative: слуге; домашнему слуге
  rationale: Перевод не смягчает социальную реальность рабского статуса и одновременно сохраняет присущий οἰκέτης оттенок принадлежности к домашнему хозяйству. Это историческое обозначение не превращает изречение в одобрение рабства.
translation_notes:
  register: Лаконичная пословичная конструкция без глагола воспроизводит параллелизм оригинала. Лексика современная и понятная, но сохраняет достоинство и суровую конкретность древнего изречения.
