translation:
  language: ru
  text: Ненавидящий наставление[a] не станет мудрым[b], и он мечется, как корабль в бурю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «закон». Еврейское слово תוֹרָה может означать наставление, учение или закон.'
    reason: lexical_alternative
