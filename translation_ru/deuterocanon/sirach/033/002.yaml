    reason: textual_variant
lexical_decisions:
- source_word: שׂוֹנֵא
  choice: ненавидящий
  rationale: Причастие употреблено как обозначение человека определённого типа. «Ненавидящий» кратко и точно передаёт деятельную неприязнь, не ослабляя её до простого нежелания слушать.
- source_word: תוֹרָה
  choice: наставление
  rationale: В контексте литературы мудрости слово может означать наставление или учение, хотя сохраняет и значение «закон». «Наставление» естественно звучит по-русски и не сужает смысл до свода правовых предписаний; вариант «закон» отмечен в сноске.
- source_word: יֶחְכַּם
  choice: не станет мудрым
  rationale: Форма глагола выражает достижение мудрости как результат или процесс. «Не станет мудрым» передаёт это точнее, чем статичное «не будет мудр».
- source_word: מִתְמוֹטֵט
  choice: его бросает
  rationale: Возвратно-пассивная форма описывает неустойчивость под действием внешней силы. В сочетании с бурей и образом корабля русское «его бросает» ясно и естественно передаёт качку и потерю устойчивости.
- source_word: בְּמִסְעָר
  choice: в бурю
  rationale: Существительное обозначает бурю или шторм. Выражение «в бурю» лаконично и хорошо сочетается с корабельным сравнением.
- source_word: כָּאֳנִיָּה
  choice: словно корабль
  rationale: Сравнение передано прямо; «корабль» соответствует масштабу образа и сохраняет достоинство стиля.
theological_decisions:
- issue: Значение תוֹרָה в контексте мудрости
  choice: наставление
  alternative: закон; учение
  rationale: Высказывание носит характер поучительной сентенции, поэтому широкое значение «наставление» уместно в основном тексте. Возможный традиционный оттенок «закон» не исключён и сохранён в сноске.
- issue: Расхождение предоставленной греческой параллели с еврейским текстом
  choice: следовать связному еврейскому свидетельству высокой степени надёжности
  alternative: заменить стих содержанием предоставленной греческой строки или считать еврейский текст непереводимым
  rationale: Приведённая греческая строка говорит о страхе перед народами и явно отражает другой стих; она не подтверждает и не опровергает лексику данной еврейской строки. Поэтому перевод основан на связном еврейском тексте, а расхождение честно отмечено.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Образ бури и корабля сохранён без поясняющего расширения; формулировка «его бросает» передаёт живую динамику оригинала и остаётся понятной широкому читателю.
