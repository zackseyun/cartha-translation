translation:
  language: ru
  text: 'Остерегайся злодея: ведь он замышляет злое — как бы он не навлёк на тебя вечного позора.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Берегись человека, творящего зло: ведь он замышляет злые дела — как бы он не навлёк на тебя поношения навеки».'
    reason: Лексические варианты для κακοῦργος, πονηρά, μῶμος и εἰς τὸν αἰῶνα; вариант сохраняет значение δῷ как причинения или навлечения, не усиливая его до «обрёк».
lexical_decisions:
- source_word: πρόσεχε ἀπὸ κακούργου
  choice: Остерегайся злодея
  rationale: Сочетание πρόσεχε ἀπό выражает предостережение и требование держаться настороже; κακοῦργος обозначает человека, делающего зло, без обязательного узкого значения «преступник».
- source_word: πονηρὰ τεκταίνεται
  choice: он замышляет зло
  rationale: Субстантивированное πονηρά означает злые или пагубные дела, а τεκταίνεται передаёт намеренное, искусное вынашивание замысла.
- source_word: μή ποτε
  choice: как бы не
  rationale: Оборот вводит опасаемое возможное последствие и естественно передаётся русской предостерегающей конструкцией.
- source_word: μῶμον ... δῷ σοι
  choice: навлёк он на тебя позор
  rationale: Буквальное «дал тебе порицание/пятно» по-русски естественно выражается как причинение или навлечение позора; «позор» сохраняет смысл бесчестья и укоризны.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Оборот прямо указывает на длительность последствия — «навсегда, навеки»; перевод не ослабляет его до неопределённого «когда-либо».
