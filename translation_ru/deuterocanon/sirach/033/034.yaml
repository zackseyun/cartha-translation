    rationale: «Как бы не навлёк он» возможно в поэтическом или архаизованном стиле, но «как бы он не навлёк» естественнее в современном литературном русском и точнее обозначает опасаемое действие данного лица.
  - severity: low
    issue: Сноска передаёт δῷ как «обрёк».
    rationale: «Обрёк» подразумевает окончательное предопределение участи и сильнее греческого «даст/причинит». Следует употребить «навлечёт» или «причинит».
