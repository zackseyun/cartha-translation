  text: Hasten the time and remember the oath[b][a], and let them recount your mighty deeds.
translation:
  language: ru
  text: Ускори наступление срока[b] и вспомни о клятве; пусть они расскажут о Твоих великих деяниях.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст этого стиха при проверке источника отмечен как текстологически неустойчивый («существенное расхождение»). Перевод следует сохранившейся греческой формулировке и не предлагает предположительного восстановления текста.
    reason: textual_variant
  - marker: b
    text: 'Или: «время»; греческое καιρός может означать также подходящее или назначенное время.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σπεῦσον
  choice: ускорь наступление
  rationale: Аористный императив σπεύδω выражает настоятельный призыв ускорить событие. Сочетание «ускорь наступление» естественно по-русски и сохраняет побудительную силу греческой формы.
- source_word: καιρόν
  choice: срок
  rationale: καιρός может обозначать время, подходящий момент или назначенный срок. «Срок» передаёт возможную определённость этого времени, не добавляя прямого указания на того, кто его назначил.
- source_word: μνήσθητι
  choice: вспомни
  rationale: Аористный императив среднего залога от μιμνῄσκομαι прямо передаётся глаголом «вспомни»; он сохраняет краткость и настоятельность обращения.
- source_word: ὁρκισμοῦ
  choice: о клятве
  rationale: ὁρκισμός означает клятву или скреплённое клятвой обязательство. «Клятва» сохраняет основной смысл и не уточняет без достаточного основания содержание обещания.
- source_word: ἐκδιηγησάσθωσαν
  choice: пусть они расскажут
  rationale: Форма третьего лица повелительного наклонения передаётся русской конструкцией «пусть они». «Расскажут» естественно выражает значение подробного повествования, заложенное в ἐκδιηγέομαι.
- source_word: τὰ μεγαλεῖά σου
  choice: о Твоих великих деяниях
  rationale: Субстантивированное множественное μεγαλεῖα в библейском греческом обычно обозначает великие, могущественные дела. «Великие деяния» звучит естественно и достойно, избегая буквального, но неясного «величия» во множественном числе.
theological_decisions:
- issue: К кому обращено местоимение второго лица
  choice: 'Сохранено обращение к Богу без добавления отсутствующего в греческом тексте наименования; местоимение написано с прописной буквы: «Твоих».'
  alternative: Оставить референт формально неопределённым и писать «твоих» со строчной буквы.
  rationale: Упоминание клятвы и великих деяний соответствует молитвенному обращению к Богу в библейском стиле. При этом перевод не вводит никакого дополнительного титула и не уточняет содержание клятвы.
- issue: Неопределённость исходного текста, отмеченная при валидации
  choice: Переведён засвидетельствованный греческий текст без конъектурной реконструкции, а неопределённость раскрыта в сноске.
  alternative: Исправить текст на основании предполагаемого еврейского оригинала или иной реконструкции.
  rationale: Помета major_mismatch указывает на существенную текстологическую проблему, однако предоставленный греческий текст остаётся непосредственным источником перевода; незасвидетельствованная реконструкция внесла бы лишнюю определённость.
translation_notes:
  register: Современный литературный русский язык с молитвенно-библейской торжественностью, но без архаизмов. Точка с запятой ясно разделяет два побуждения, соединённые греческим καί, и не меняет их смысловой связи.
