  language: ru
  text: Поставь его на работу, чтобы он не оставался без дела;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔμβαλε
  choice: Поставь
  rationale: Императив от ἐμβάλλω буквально может означать «вбрось, введи», но в сочетании с εἰς ἐργασίαν передаёт побуждение назначить человеку работу. «Поставь ... на работу» сохраняет повелительную силу и естественно звучит по-русски.
- source_word: αὐτὸν
  choice: его
  rationale: Местоимение мужского рода, единственного числа, в винительном падеже; оно указывает на мужчину, о котором говорится в ближайшем контексте.
- source_word: εἰς ἐργασίαν
  choice: на работу
  rationale: ἐργασία означает работу, труд, занятие. В данном обороте русское «поставить на работу» передаёт смысл яснее и естественнее, чем буквальное «ввести в труд».
- source_word: ἵνα μὴ ἀργῇ
  choice: чтобы он не оставался без дела
  rationale: ἀργέω означает бездействовать, не работать, быть праздным. «Не оставался без дела» передаёт отсутствие деятельности, не добавляя более сильного нравственного обвинения в лени.
theological_decisions:
- issue: Передача местоимения мужского рода в контексте зависимого работника или раба
  choice: его / он
  alternative: гендерно-нейтральная формулировка
  rationale: Мужской род явно выражен в греческом тексте и соответствует участнику, названному в окружающем контексте; нейтрализация изменила бы конкретную социальную ситуацию текста.
- issue: Степень буквальности выражения ἔμβαλε αὐτὸν εἰς ἐργασίαν
  choice: Поставь его на работу
  alternative: Введи его в труд; Брось его в работу
  rationale: Выбран естественный русский идиоматический оборот, сохраняющий прямой повелительный смысл греческого выражения без неуместной буквальности.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная формулировка. Сохранено мужское единственное число и завершающая точка с запятой, отражающая незавершённость синтаксического движения в исходной подаче стиха.
