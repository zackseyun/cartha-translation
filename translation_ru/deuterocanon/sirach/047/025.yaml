  naturalness: «Дал Ефрему повод к падению» — современная литературная и ясная формулировка; она передаёт функцию מכשול как причины падения, не создавая неестественного сочетания «дал преткновение». «Продался всякому злу» естественно и выразительно.
  terminology: '«Ефрем» и «земля» уместны. «Повод к падению» несколько менее предметен, чем מכשול, но точнее по-русски передаёт его метафорическую функцию. Сноска должна точнее отразить греческое чтение: в нём говорится, что грехи умножились, чтобы удалить их с их земли, и что они искали всякое зло до прихода возмездия.'
