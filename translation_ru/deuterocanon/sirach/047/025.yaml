base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/025.yaml
  text: He gave Ephraim a stumbling block[a], to drive them from their land; and his sin grew very great, and he sold himself to every evil.
translation:
  language: ru
  text: Он дал Ефрему повод к падению[a], чтобы изгнать их из их земли. Его грех чрезвычайно возрос, и он продался всякому злу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте эта часть стиха читается иначе: «И весьма умножились их грехи, чтобы удалить их из их земли; и они искали всякое зло, пока не пришло на них возмездие». Еврейский свидетель здесь короче и говорит о грехе одного человека.'
    reason: alternative_reading
lexical_decisions:
- source_word: ויתן לאפרים מכשול
  choice: Он поставил Ефрему преткновение
  rationale: Буквально конструкция означает, что он дал Ефрему нечто служащее причиной падения. «Поставил… преткновение» сохраняет предметную метафору מכשול и естественнее по-русски, чем буквальное «дал преткновение».
- source_word: להדיחם
  choice: чтобы изгнать их
  rationale: Глагол выражает причинённое удаление или изгнание; «изгнать» ясно передаёт результат и сочетается с последующим указанием на землю.
- source_word: מאדמתם
  choice: из их земли
  rationale: «Земля» передаёт не только почву, но и территорию проживания народа, не усиливая сверх меры заветные ассоциации.
- source_word: ותגדל חטאתו מאד
  choice: Его грех чрезвычайно возрос
  rationale: Следуем еврейскому единственному числу חטאתו и наречию מאד. Формулировка сохраняет вероятную отсылку к ранее названному правителю.
- source_word: ולכל רעה התמכר
  choice: и он продался всякому злу
  rationale: Возвратная форма от מכר сохраняет образ добровольной самопродажи злу; «продался» звучит естественно и нравственно весомо в современном русском.
theological_decisions:
- issue: Единственное число в еврейском тексте и множественное в греческом
  choice: 'В основном тексте сохранено еврейское: «Его грех чрезвычайно возрос… он продался».'
  alternative: 'Греческий: «И весьма умножились их грехи… и они изыскали всякое нечестие, пока не пришло на них возмездие».'
  rationale: Сохранившийся еврейский свидетель первичен, однако значительное расхождение с греческой традицией отмечено в сноске без попытки искусственно согласовать чтения.
- issue: Образ нравственного действия в התמכר
  choice: «он продался всякому злу»
  alternative: «он предался всякому злу»
  rationale: Выбранный вариант сохраняет буквальный образ самопродажи и не вводит дополнительных конфессиональных толкований.
translation_notes:
  register: 'Современный литературный русский, с умеренно возвышенной библейской лексикой. «Преткновение» сохранено ради исходной метафоры, а синтаксис разделён на два предложения для ясности. Местоименное число не сглажено: «Ефрему» как собирательному обозначению соответствует последующее «их», тогда как далее еврейский текст переходит к одному виновнику.'
