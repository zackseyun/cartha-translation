  yaml_path: translation/deuterocanon/sirach/047/005.yaml
  text: For he called on God Most High[a], and he gave strength to his right hand[b], to drive back a man skilled in war and to raise up the horn of Israel.
translation:
  language: ru
  text: Ибо он воззвал к Богу Всевышнему[a], и Он дал силу его правой руке, чтобы оттеснить воина, искусного в военном деле, и вознести рог Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «к Богу Всевышнему»; греческий параллельный текст: «к Господу, Всевышнему».'
    reason: alternative_reading
  - marker: b
    text: Рог — библейский образ силы, чести и могущества.
    reason: lexical_alternative
lexical_decisions:
- source_word: קרא אל
  choice: воззвал к
  rationale: Еврейское выражение обозначает обращение к Богу с призывом о помощи; «воззвал к» естественно для библейского повествования и сохраняет молитвенный оттенок.
- source_word: אל עליון
  choice: Богу Всевышнему
  rationale: Это прямое соответствие еврейскому «Бог Всевышний»; греческое параллельное чтение «Господа, Всевышнего» отмечено в сноске, но не подменяет основной еврейский текст.
- source_word: ויתן בימינו עז
  choice: Он дал силу его правой руке
  rationale: 'Сохранён телесный образ еврейского текста: Бог наделяет правую руку Давида силой для действия. Заглавная буква у «Он» помогает различить Бога и Давида, не меняя содержания.'
- source_word: להדוף
  choice: отразить
  rationale: Глагол передаёт значение оттеснения или отражения противника и уместен в военном контексте, не уточняя способ победы.
- source_word: איש יודע מלחמות
  choice: мужа, искусного в войне
  rationale: Фраза буквально описывает человека, знающего войны; выбранный вариант естественен по-русски, сохраняет возвышенный регистр и указывает на воинскую опытность.
- source_word: ולהרים את קרן ישראל
  choice: вознести рог Израиля
  rationale: Сохранена традиционная библейская метафора рога как силы, чести и могущества; её значение поясняется в сноске.
theological_decisions:
- issue: Божественный титул при небольшом расхождении еврейского и греческого свидетельств
  choice: Богу Всевышнему
  alternative: Господу Всевышнему
  rationale: Основной еврейский текст читает אל עליון, «Бог Всевышний», тогда как греческая параллель имеет «Господа, Всевышнего». Перевод следует первичному еврейскому свидетельству, а вариант греческого текста сохраняет в сноске.
- issue: Референты местоимений в первой половине стиха
  choice: «он» — Давид; «Он» — Бог; «его» — Давид
  alternative: Сохранить одинаковое написание местоимений без графического различения
  rationale: Контекст и синтаксис указывают, что Давид воззвал, а Бог дал силу его правой руке. Различение регистра делает русский текст понятным, не вводя дополнительного богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Сохранены образы «правой руки» и «рога Израиля»; редкое слово «муж» употреблено здесь в значении взрослого мужчины-воина и поддерживает поэтический строй стиха.
