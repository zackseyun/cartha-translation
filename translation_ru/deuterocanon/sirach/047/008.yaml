base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/008.yaml
  text: In all his work he gave thanks to God Most High with words of glory[a]; with all his heart he loved his Maker[b], and every day he gave thanks to him with songs.
translation:
  language: ru
  text: Во всех своих делах он воздавал благодарение Богу Всевышнему словами славы[a]; всем сердцем он любил своего Создателя[b] и каждый день благодарил Его песнями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «словами славы»; сходно и по-гречески: «словом славы».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст: «всем сердцем он любил своего Создателя и каждый день благодарил Его песнями». В греческом тексте: «он воспел и возлюбил Создавшего его»; прямого упоминания «каждый день» в нём нет.'
    reason: alternative_reading
lexical_decisions:
- source_word: בכל מעשהו
  choice: Во всех своих делах
  rationale: Передаёт совокупность всей деятельности Давида естественным русским выражением; множественное число «делах» здесь звучит яснее, чем буквальное собирательное единственное.
- source_word: נתן הודות
  choice: воздавал благодарение
  rationale: Сохраняет смысл еврейского оборота «давал благодарения» и уместный возвышенный регистр, не сводя благодарение к более широкому понятию хвалы.
- source_word: לאל עליון
  choice: Богу Всевышнему
  rationale: Прямо передаёт божественный титул עליון и естественно следует русскому порядку слов.
- source_word: באמרי כבוד
  choice: словами славы
  rationale: Близко передаёт конструкцию «слова/речения славы»; греческое ῥήματι δόξης подтверждает это понимание.
- source_word: בכל לבו
  choice: всем сердцем
  rationale: Естественный русский эквивалент еврейской идиомы полной внутренней преданности.
- source_word: אוהב
  choice: он любил
  rationale: Форма может иметь причастный оттенок, но в повествовательной последовательности естественно передаётся личной формой прошедшего времени; это поддерживает и греческое ἠγάπησεν.
- source_word: עשהו
  choice: своего Создателя
  rationale: Передаёт личное обозначение «того, кто создал его» кратко, ясно и благоговейно.
- source_word: וכבל יום
  choice: и каждый день
  rationale: Текстуальная форма несколько неустойчива, но, вероятнее всего, означает регулярность — «каждый день» или «день за днём».
- source_word: הודה לו בזמירות
  choice: благодарил Его песнями
  rationale: Сохраняет значение благодарения и передаёт זמירות общедоступным словом «песни», не конкретизируя его до канонических псалмов.
theological_decisions:
- issue: Божественный титул עליון
  choice: Всевышний
  alternative: Высочайший
  rationale: «Всевышний» — устойчивое и точное русское обозначение Бога, соответствующее еврейскому עליון и греческому Ὕψιστος, без привнесения конфессиональной трактовки.
- issue: Различие между еврейским и греческим порядком и составом второй части стиха
  choice: 'Следовать более полному еврейскому чтению: любовь к Создателю и ежедневное благодарение песнями'
  alternative: 'По греческому: «воспел и возлюбил Создавшего его», без упоминания ежедневного благодарения'
  rationale: Еврейский источник обозначен как основной и с высокой степенью надёжности; греческое чтение сохраняется в примечании как значимый текстовый вариант.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным для широкого читателя; прописное «Его» употреблено как уважительное местоименное обозначение Бога.
