translation:
  language: ru
  text: Он дал города среди филистимлян[a], и до сего дня сокрушил их рог[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «города в Филистии», «города у филистимлян» или, по смыслу контекста, «города, отнятые у филистимлян». Еврейское выражение предельно сжато; глагол может означать «дал» или «поставил». Греческий параллельный текст связывает эту строку с продолжительным поражением филистимлян Давидом.'
    reason: alternative_reading
  - marker: b
    text: Рог — библейский образ силы и могущества.
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתן
  choice: отдал
  rationale: Глагол נתן прежде всего означает «дать, отдать, поместить». Выбрано «отдал», чтобы сохранить лаконичную активную формулировку еврейского текста, не подменяя её более определённым толкованием о завоевании или разрушении.
- source_word: בפלשתים
  choice: среди филистимлян
  rationale: Предлог ב при названии народа допускает здесь несколько пониманий. «Среди филистимлян» наиболее непосредственно передаёт форму еврейского выражения; возможные контекстуальные значения указаны в сноске.
- source_word: ערים
  choice: города
  rationale: Обычное значение существительного — «города» или «селения»; в военно-политическом контексте уместно более стандартное «города».
- source_word: ועד היום שבר
  choice: и по сей день сокрушён
  rationale: Глагол שבר означает «сломать, сокрушить». Русская результативная конструкция передаёт совершённое Давидом действие и сохраняющийся до времени автора результат, выраженный словами ועד היום.
- source_word: קרנם
  choice: их рог
  rationale: Сохранён буквальный библейский образ рога как силы и могущества; его подтверждает греческое κέρας. Значение образа поясняется в сноске.
theological_decisions:
- issue: Исторический смысл действий Давида в отношении филистимских городов
  choice: Сохранить сжатую еврейскую формулировку об отданных городах среди филистимлян.
  alternative: «Он отнял города у филистимлян» или «Он сокрушил филистимлян со всех сторон».
  rationale: Еврейское свидетельство первично и не уточняет однозначно характер действия. Греческий параллельный текст ясно связывает стих с продолжительным поражением филистимлян, но его развёрнутую формулировку не следует незаметно вносить в основной текст.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичности и образности еврейского текста. Необычная сжатость первой части не сглажена догматическим или историческим уточнением; двусмысленность раскрыта в сноске.
