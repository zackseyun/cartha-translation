translation:
  language: ru
  text: Как мудр ты был в юности[a], и ты, как Нил, изливал наставления.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь существенно иное чтение: «Твоя душа покрыла землю, и ты наполнил её загадочными притчами». Вероятно, оно восходит к иному еврейскому оригиналу или другой текстовой традиции.'
    reason: alternative_reading
lexical_decisions:
- source_word: מה חכמת
  choice: Как мудр ты был
  rationale: Восклицательное מה выражает восхищение, а форма от חכם передаёт состояние мудрости; по-русски естественно и достойно звучит «Как мудр ты был».
- source_word: בנעוריך
  choice: в юности
  rationale: Прямое временное обозначение ранних лет Соломона.
- source_word: ותצף
  choice: разливалось
  rationale: Глагол создаёт образ воды, поднимающейся и выходящей из берегов; «разливалось» сохраняет водную метафору и выражает изобилие.
- source_word: כיאר
  choice: словно Нил
  rationale: יאר обычно обозначает Нил; конкретный гидроним сохраняет исходный образ лучше, чем обобщённое «река».
- source_word: מוסר
  choice: наставление
  rationale: מוסר означает формирующее поучение, наставление или дисциплину; в похвале мудрости Соломона «наставление» передаёт смысл естественно и без излишней конфессиональной окраски.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающимся греческим чтением
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству.
  alternative: «Твоя душа покрыла землю, и ты наполнил её загадочными притчами».
  rationale: При наличии еврейского текста Сираха он служит основой перевода. Греческое свидетельство отражает существенно иную древнюю текстовую традицию, поэтому оно не заменяет основной текст, но приводится в сноске.
translation_notes:
  register: Современный литературный русский язык; восклицательная похвала передана без архаизации. «Словно Нил» сохраняет конкретный поэтический образ, а «разливалось» согласует с ним водную метафору.
