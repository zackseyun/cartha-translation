  source_fidelity: 'В еврейской строке глагольная форма ותצף естественнее относится ко второму лицу: «ты разливался/изливал(ся)», а מוסר обозначает содержание или сферу этого изобилия («наставление», во множественном русском выражении — «наставления»). В черновике «наставление разливалось» меняет синтаксического носителя действия. Греческое чтение действительно резко расходится с еврейским и уместно сохранено в сноске.'
