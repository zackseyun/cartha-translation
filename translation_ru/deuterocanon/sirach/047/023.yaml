base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/023.yaml
  text: And he gave a remnant to Jacob[a], and to the house of David a root from him. And Solomon lay down with his fathers[c][b], and left behind him one of his offspring.
translation:
  language: ru
  text: И Он даровал Иакову остаток, а дому Давида — корень от него[a]. Соломон почил со своими предками[b] и оставил после себя потомка[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «корень от него». «Корень» — образ продолжения рода; его можно также передать словом «потомок». К кому относится «него», в этом еврейском построении не вполне ясно.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово после слов «Соломон почил» в данном свидетеле неясно; греческий параллельный текст читает «со своими предками», и здесь принято это чтение.
    reason: textual_variant
  - marker: c
    text: 'Или: «наследника», «одного из своих потомков». Еврейское слово редкое и не вполне ясное, но речь идёт о продолжателе рода Соломона.'
    reason: alternative_reading
lexical_decisions:
- source_word: שארית / κατάλιμμα
  choice: остаток
  rationale: Еврейское שארית и греческое κατάλιμμα обозначают то, что осталось или было сохранено. «Остаток» естественно передаёт этот смысл и сохраняет оттенок продолжения народа и рода.
- source_word: שרש / ῥίζαν
  choice: корень
  rationale: Оба слова буквально означают «корень». Здесь это образ продолжения династии Давида; буквальный образ сохранён, чтобы не сводить его к одному толкованию.
- source_word: וישכב ... / ἀνεπαύσατο
  choice: почил со своими предками
  rationale: В контексте смерти וישכב употреблено как традиционная формула, а греческое ἀνεπαύσατο подтверждает значение покоя после смерти. Русское «почил» понятно и соответствует возвышенному повествовательному регистру.
- source_word: מיושש
  choice: со своими предками
  rationale: Еврейская форма в данном свидетеле трудна и допускает иные объяснения, однако греческий параллельный текст μετὰ τῶν πατέρων убедительно свидетельствует в пользу чтения «с предками».
- source_word: מנון
  choice: потомка
  rationale: Редкое или не вполне ясное еврейское слово в контексте указывает на продолжателя рода. «Потомок» сохраняет необходимую широту и не уточняет без достаточных оснований, что речь непременно идёт именно о сыне или наследнике.
theological_decisions:
- issue: Образ династического обетования в выражении «корень от него»
  choice: сохранить метафору продолжающегося рода Давида без прямого мессианского уточнения
  alternative: потомок от него; мессианский корень от него
  rationale: Стих говорит о сохранении дома Давида. Образ корня может иметь дальнейшие мессианские созвучия, но сам текст не требует делать их явными; буквальная метафора сохраняет богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Метафора «корень» и термин «остаток» сохранены; текстуальная неуверенность не скрыта и вынесена в примечания.
