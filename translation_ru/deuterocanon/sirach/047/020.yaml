base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/020.yaml
  text: You put a blemish on your honor[a], and profaned your bed[b], bringing wrath on your offspring and groaning on your couch.
translation:
  language: ru
  text: Ты запятнал свою честь и осквернил своё ложе[a], навлёк гнев на своих потомков, а на своём ложе — стон[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «и осквернил своё семя» вместо «и осквернил своё ложе».'
    reason: textual_variant
  - marker: b
    text: 'В греческом тексте конец стиха читается: «и скорбь — из-за твоего безрассудства».'
    reason: textual_variant
lexical_decisions:
- source_word: ותתן מום בכבודך
  choice: Ты запятнал свою честь
  rationale: Буквально еврейский оборот означает «ты положил порок на свою честь». «Запятнал свою честь» естественно передаёт причинный смысл и сохраняет образ пятна или изъяна; כבוד здесь обозначает личное и царское достоинство.
- source_word: ותחלל את יצועיך
  choice: и осквернил своё ложе
  rationale: Глагол חלל в интенсивной породе выражает осквернение того, что должно оставаться священным или непорочным. יצועים — ложе с явным брачно-половым оттенком; множественное число по-русски естественно передано собирательным единственным.
- source_word: להביא אף על צאצאיך
  choice: навлекая гнев на своих потомков
  rationale: Инфинитив להביא передаёт следствие поступка. אף означает сильный гнев, а צאצאים охватывает потомство и династических наследников, не ограничиваясь непосредственными детьми.
- source_word: ואנחה על משכבך
  choice: и стенание — на своё ложе
  rationale: אנחה означает стон, вздох или стенание; существительное «стенание» сохраняет параллелизм с «гневом». משכב — место лежания, ложе. Повтор слова «ложе» передаёт намеренную связь двух еврейских обозначений постели, хотя делает её заметнее в русском.
theological_decisions:
- issue: Связь последней части стиха с проступком Соломона
  choice: 'Еврейский текст связывает осквернение ложа с двумя последствиями: гневом для потомков и стенанием на собственном ложе.'
  alternative: Греческий текст говорит об осквернении семени и о скорби из-за безрассудства.
  rationale: Основой перевода служит засвидетельствованный еврейский текст, который дважды использует лексику ложа и тем самым создаёт смысловую связь между проступком и последующим страданием. Отличное греческое чтение не подменяет основной текст, а отмечается как текстовый вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной библейской образностью. Обращение на «ты» соответствует прямому обличению Соломона. Синтаксический параллелизм сохранён; тире во второй паре помогает ясно соотнести «стенание» с «ложем».
