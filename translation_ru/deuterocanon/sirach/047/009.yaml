  yaml_path: translation/deuterocanon/sirach/047/009.yaml
  text: With songs in the gardens he made preparation before the altar[b][a], and he arranged the sound of psalm and harps.
translation:
  language: ru
  text: С песнями в садах[a] он совершил приготовления перед жертвенником и наладил звучание псалма и арф[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение «с песнями в садах» неясно. В греческом тексте: «Он поставил певцов напротив жертвенника, чтобы их звучанием услаждать мелодии»; вероятно, греческий перевод отражает иной исходный текст или повреждение еврейской фразы.'
    reason: textual_variant
  - marker: b
    text: 'Или: «лир»; еврейское слово обозначает струнные музыкальные инструменты, точный тип которых не установлен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בגינות שיר
  choice: Песнями в садах
  rationale: Передаёт сохранённый еврейский текст без исправления по греческому параллельному чтению. Сочетание в еврейском неясно, поэтому неопределённость отмечена сноской.
- source_word: הכין
  choice: всё подготовил
  rationale: Глагол означает «приготовил, устроил, привёл в готовность». Слово «всё» служит естественным русским дополнением при отсутствии выраженного объекта и не уточняет его содержания.
- source_word: לפני מזבח
  choice: перед жертвенником
  rationale: Прямо передаёт пространственное или культовое значение оборота; определённость жертвенника ясна из храмового контекста.
- source_word: קול
  choice: звучание
  rationale: В музыкальном контексте קול естественно означает не только «голос», но и «звук, звучание».
- source_word: מזמור
  choice: псалма
  rationale: Сохраняет литургический оттенок еврейского обозначения песни, исполняемой с музыкальным сопровождением.
- source_word: נבלים
  choice: арф
  rationale: נבל обозначает древний струнный инструмент; «арфа» — традиционный и понятный русский эквивалент, хотя точный тип инструмента не вполне установлен.
- source_word: תקן
  choice: устроил
  rationale: Передаёт значение «привёл в порядок, наладил, организовал» и естественно сочетается со словом «звучание».
theological_decisions:
- issue: Следовать ли трудному еврейскому тексту или более гладкому греческому параллельному чтению
  choice: Основной текст следует сохранившемуся еврейскому чтению, а греческое расхождение раскрывается в сноске.
  alternative: «Он поставил певцов напротив жертвенника, чтобы их звучанием услаждать мелодии».
  rationale: Еврейский свидетель имеет приоритет, однако его начальная фраза трудна и существенно расходится с греческой. Сноска сохраняет текстологическую прозрачность и не позволяет молча устранить неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной культовой лексикой. Синтаксис сделан плавным, но необычный образ еврейского текста сохранён и пояснён, а не заменён греческим чтением.
