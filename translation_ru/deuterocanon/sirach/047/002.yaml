review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан: культовый жир служит образом особо выделенного Давида. Однако «был отделён от Израиля» в русском языке может означать отделение Давида от самого Израиля как народа, тогда как еврейское מישראל и особенно греческое ἀπὸ τῶν υἱῶν Ἰσραήλ выражают выделение из среды Израиля/его сынов.'
  naturalness: Фраза понятна, но сопоставление настоящего времени «отделяется» с прошедшим «был отделён» стилистически менее ровное. Причастная конструкция «жир, отделённый…» естественна и компактна для торжественного сравнения.
  terminology: «Жир» сохраняет конкретный жертвенный образ חלב. «Священная жертва» допустимо передаёт сжатое מקדש, не отождествляя его со святилищем; примечание обоснованно приводит более конкретное чтение греческой традиции — жертву благополучия.
  issues:
  - severity: medium
    issue: «Давид был отделён от Израиля» может быть понято как отчуждение от Израиля, а не как выделение из его среды.
    rationale: Оригинальная конструкция מישראל кратка, но греческая параллель уточняет «от сынов Израиля». «Выделен из среды Израиля» сохраняет образ особого отделения и делает направление сравнения ясным, не добавляя действующего лица или доктринальной формулы.
  - severity: low
    issue: Временная форма в первой части не соответствует форме во второй.
    rationale: Замена на «жир, отделённый…» лучше отражает еврейское страдательное причастие מורם и создаёт более стройный русский параллелизм.
  revised_text: Как жир, отделённый от священной жертвы,[a] так и Давид был выделен из среды Израиля.
  revised_footnotes:
  - marker: a
    text: 'Еврейская формулировка здесь сжата. Греческий перевод уточняет: «как жир, отделённый от жертвы благополучия, так Давид — от сынов Израиля».'
    reason: textual_variant
