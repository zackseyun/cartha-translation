revisions:
- from: Как жир отделяется от священной жертвы,[a] так Давид был отделён от Израиля.
  to: Как жир, отделённый от священной жертвы,[a] так и Давид был выделен из среды Израиля.
  rationale: Правка устраняет нежелательное русское значение отделения Давида от Израиля и передаёт сравнительное выделение Давида из среды народа. Культовый образ, сжатость еврейского текста и уточняющее свидетельство греческой параллели сохранены.
  reviewer_model: gpt-5.6-terra
