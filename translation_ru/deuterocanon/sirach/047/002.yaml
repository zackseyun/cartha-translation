translation:
  language: ru
  text: Как жир, отделённый от священной жертвы,[a] так и Давид был выделен из среды Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская формулировка здесь сжата. Греческий перевод уточняет: «как жир, отделённый от жертвы благополучия, так Давид — от сынов Израиля».'
    reason: textual_variant
lexical_decisions:
- source_word: כחלב
  choice: как жир
  rationale: חֵלֶב обозначает жир, в данном контексте — жертвенный жир как особо выделяемую часть; конкретный культовый образ сохранён без замены абстрактным «лучшая часть».
- source_word: מורם
  choice: отделяется
  rationale: Страдательное причастие от רום в жертвенном контексте указывает на часть, изъятую и предназначенную особо. Греческое ἀφωρισμένον подтверждает значение отделения.
- source_word: מקדש
  choice: от священной жертвы
  rationale: Сжатое еврейское выражение передаёт культовый смысл. Перевод не отождествляет קדש с физическим святилищем, а греческая параллель указывает на жертву благополучия.
- source_word: כן דוד מישראל
  choice: так Давид был отделён от Израиля
  rationale: Вторая половина подразумевает тот же глагол, что и первая. Явное повторение по-русски делает сравнение понятным; «от Израиля» сохраняет краткость еврейского текста и отделительное значение, подтверждаемое греческим ἀπὸ τῶν υἱῶν Ἰσραήλ.
theological_decisions:
- issue: Насколько явно выразить избрание Давида
  choice: «Давид был отделён от Израиля»
  alternative: «Давид был избран Богом из Израиля»
  rationale: Образ подразумевает особое выделение Давида, однако стих прямо не называет ни избрания, ни действующего лица — Бога. Формулировка сохраняет богословскую силу сравнения, не добавляя отсутствующего утверждения.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная форма и конкретный жертвенный образ оригинала сохранены. Повтор глагола во второй части восполняет подразумеваемую еврейскую связку и обеспечивает естественность русского синтаксиса.
