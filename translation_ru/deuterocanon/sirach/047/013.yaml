base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/013.yaml
  text: Solomon reigned in days of peace[a], and God gave him rest on every side, so that he might build a house for his name and prepare a sanctuary forever.
translation:
  language: ru
  text: Соломон царствовал во дни мира[a], и Бог даровал ему покой со всех сторон, чтобы он воздвиг дом, посвящённый имени Его, и приготовил святилище навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившаяся еврейская строка короче: «Соломон царствовал во дни мира, и Бог даровал ему покой со всех сторон». Греческий текст содержит целевую часть о том, чтобы воздвигнуть дом, посвящённый имени Бога, и приготовить святилище навеки.'
    reason: textual_variant
lexical_decisions:
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: מלך
  choice: царствовал
  rationale: Передаёт глагольную форму и естественно звучит в повествовании о царе.
- source_word: בימי שלוה
  choice: во дни мира
  rationale: Сохраняет временную образность еврейского выражения и обозначает период мира и спокойствия.
- source_word: ואל הניח לו מסביב / ᾧ ὁ θεὸς κατέπαυσεν κυκλόθεν
  choice: и Бог даровал ему покой со всех сторон
  rationale: Греческое параллельное чтение проясняет слегка нерегулярный еврейский текст и явно называет Бога субъектом; «даровал покой со всех сторон» естественно передаёт הניח и מסביב.
- source_word: ἵνα στήσῃ οἶκον ἐπʼ ὀνόματι αὐτοῦ
  choice: чтобы он воздвиг дом во имя Его
  rationale: Целевая конструкция сохранена; «воздвиг дом» соответствует храмовому контексту, а «во имя Его» не устраняет библейскую формулу.
- source_word: καὶ ἑτοιμάσῃ ἁγίασμα εἰς τὸν αἰῶνα
  choice: и навеки приготовил святилище
  rationale: «Святилище» точно передаёт ἁγίασμα, а «навеки» — εἰς τὸν αἰῶνα без смыслового расширения.
theological_decisions:
- issue: Включение целевой части о строительстве храма, имеющейся в греческом тексте, но отсутствующей в сохранившейся еврейской строке
  choice: Включить греческое продолжение в основной текст и отметить разночтение сноской
  alternative: 'Ограничить основной текст сохранившимся еврейским чтением: «Соломон царствовал во дни мира, и Бог даровал ему покой со всех сторон».'
  rationale: Еврейский свидетель здесь короче и имеет небольшое текстовое несоответствие, тогда как древний греческий параллельный текст содержит связное продолжение о храме. Включение продолжения сохраняет полноту древней текстовой традиции, а сноска открыто сообщает о различии свидетелей.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Формулы «во дни мира», «воздвиг дом» и «святилище» понятны современному читателю и сохраняют достоинство храмового контекста.
