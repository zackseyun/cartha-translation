base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/022.yaml
  text: But God will not abandon mercy[a], nor let any of his words fall to the ground. He will not cut off offspring and posterity from his chosen one[b], and he will not destroy the seed of the one who loved him.
translation:
  language: ru
  text: Но Бог не оставит милости[a] и не даст ни одному из Своих слов упасть на землю. Он не пресечёт у Своего избранника[b] ни детей, ни потомков и не истребит семени того, кто любил Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Но Господь не оставит Своей милости и не погубит ни одного из Своих дел». В еврейском тексте вместо второй части сказано: «и не даст ни одному из Своих слов упасть на землю».'
    reason: textual_variant
  - marker: b
    text: Еврейскую форму можно прочитать и как «Своих избранников», но греческая параллель поддерживает единственное число.
    reason: alternative_reading
lexical_decisions:
- source_word: אל
  choice: Бог
  rationale: Еврейский основной текст содержит אל — «Бог», тогда как греческая параллель имеет Κύριος — «Господь». Перевод следует первичному еврейскому свидетельству.
- source_word: יטוש
  choice: не оставит
  rationale: Естественно передаёт значение «не покинет, не отвергнет» в современном литературном русском.
- source_word: חסד
  choice: милости
  rationale: «Милость» соответствует контексту Божьей верности и греческому ἔλεος, не исключая оттенка неизменной любви.
- source_word: ולא יפיל מדבריו ארצה
  choice: и не даст ни одному из Своих слов упасть на землю
  rationale: Сохранён еврейский образ, означающий, что Божье слово не останется неисполненным; греческий текст здесь отличается.
- source_word: לא יכרית
  choice: не пресечёт
  rationale: Глагол передаёт прекращение рода; «не пресечёт» естественно сочетается с династическим контекстом.
- source_word: לבחיריו
  choice: у Своего избранника
  rationale: Хотя еврейскую форму можно понять как множественное число, греческая параллель и контекст рода Давида поддерживают единственное число.
- source_word: נין ונכד
  choice: ни детей, ни потомков
  rationale: Парная формула обозначает продолжение рода через поколения. Такой перевод сохраняет двучленность и звучит естественно по-русски.
- source_word: זרע
  choice: семени
  rationale: Библейское «семя» сохраняет династический и заветный оттенок исходного слова.
- source_word: אובהו
  choice: того, кто любил Его
  rationale: Передаёт человека, любившего Бога; греческое τοῦ ἀγαπήσαντος αὐτόν также поддерживает прошедшее время и, вероятно, указывает на Давида.
- source_word: ישמיד
  choice: истребит
  rationale: Сильный и точный русский эквивалент уничтожения рода, уместный в возвышенном библейском регистре.
theological_decisions:
- issue: Божественный титул в начале стиха
  choice: Бог
  alternative: Господь
  rationale: Основное еврейское свидетельство имеет אל («Бог»), а греческая параллель — Κύριος («Господь»). В основном тексте предпочтено еврейское чтение; различие отражено в примечании.
- issue: Число слова «избранник»
  choice: Своего избранника
  alternative: Своих избранников
  rationale: Еврейская форма допускает множественное прочтение, однако греческое ἐκλεκτοῦ αὐτοῦ стоит в единственном числе, а контекст говорит о Давиде и его династии. Неопределённость отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Сохранены еврейский образ «слова упасть на землю» и династический термин «семя»; синтаксис сделан понятным для обычного современного читателя.
