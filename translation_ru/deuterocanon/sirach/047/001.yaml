    reason: alternative_reading
lexical_decisions:
- source_word: וגם
  choice: И
  rationale: Связывает стих с предшествующим контекстом; добавочное значение גם естественно передаётся союзом «и».
- source_word: אחריו
  choice: после него
  rationale: Сохраняет указание на личного предшественника, упомянутого ранее.
- source_word: עמד
  choice: восстал
  rationale: В данном контексте обозначает появление следующего деятеля; формулировка также согласуется с греческим ἀνέστη, не сводя значение к неподвижному «стоял».
- source_word: נתן
  choice: Нафан
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: להתיצב
  choice: чтобы предстать
  rationale: Возвратная порода глагола יצב выражает принятие положения перед кем-либо или явление в его присутствие; «предстать» естественно и точно передаёт эту мысль.
- source_word: לפני דוד
  choice: перед Давидом
  rationale: Прямо следует сохранившемуся еврейскому чтению; греческий вариант «во дни Давида» отмечен в сноске.
theological_decisions:
- issue: Отношение Нафана к Давиду в заключительной части стиха
  choice: перед Давидом
  alternative: во дни Давида
  rationale: Сохранившийся еврейский текст имеет לפני דוד («перед Давидом»), тогда как греческая параллель передаёт временное отношение. Основной текст следует еврейскому свидетельству, а существенное разночтение сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Восстал» сохраняет лаконичность и оттенок выхода на историческую сцену; «предстать перед Давидом» ясно передаёт еврейскую конструкцию.
