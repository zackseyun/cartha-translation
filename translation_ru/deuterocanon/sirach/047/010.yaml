base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/010.yaml
  text: He gave splendor[a], beauty, and glory to the festivals year after year; when they praised his holy name[b], before morning the court resounded.
translation:
  language: ru
  text: Он из года в год придавал праздникам величие, красоту и славу[a]; когда они славили Его святое имя, с раннего утра святилище звучало[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально здесь стоят три близких слова: «величие, красота и честь (или слава)».'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительные слова сохранившегося еврейского текста неясны; буквально их можно понять как «до утра звучал суд (или устав)». Греческий параллельный текст гласит: «с раннего утра святилище звучало».'
    reason: textual_variant
lexical_decisions:
- source_word: ויתן לחגים
  choice: придавал праздникам
  rationale: נתן буквально означает «давать», однако с перечислением качеств естественное русское сочетание «придавать праздникам величие» точно передаёт смысл наделения праздников торжественным великолепием. Дательный оттенок предлога ל сохранён.
- source_word: בכל שנה ושנה
  choice: из года в год
  rationale: Русский оборот передаёт усиленную повторяемость еврейского выражения «в каждый год и год».
- source_word: הוד פאר וכבוד
  choice: величие, красоту и славу
  rationale: 'Сохранены все три близких по смыслу существительных: הוד — величие/великолепие, פאר — красота/благолепие, כבוד — слава/честь. Такой ряд звучит возвышенно, но остаётся понятным современному читателю.'
- source_word: בהללו
  choice: когда они славили
  rationale: Предлог ב при данной форме передан как временное обстоятельство. Множественное число согласуется с греческим параллельным текстом, где участники богослужения славят святое имя.
- source_word: את שם קדשו
  choice: Его святое имя
  rationale: Естественный русский библейский оборот, точно передающий еврейское выражение.
- source_word: לפני בקר ירן משפט
  choice: с раннего утра святилище звучало
  rationale: Сохранившийся еврейский текст заключительной части труден. Перевод следует ясному греческому параллельному чтению ἀπὸ πρωῒ ἠχεῖν τὸ ἁγίασμα — «с раннего утра святилище звучало», не добавляя прямо не названных музыки или хвалы.
theological_decisions:
- issue: Текстуально трудная заключительная фраза еврейского свидетеля
  choice: 'Передать её по ясному греческому параллельному чтению: «с раннего утра святилище звучало»'
  alternative: 'Буквально по дошедшему еврейскому тексту: «до утра звучал суд/устав» либо «перед утром двор звучал»'
  rationale: Еврейские слова לפני בקר ירן משפט в данном контексте семантически неясны и, вероятно, повреждены. Греческий текст сохраняет связный смысл храмового прославления. Неопределённость еврейского свидетеля открыто отмечена в сноске, а не скрыта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, богослужебно уместным звучанием. Синтаксис остаётся ясным для широкого читателя; архаизмы и конфессионально окрашенные уточнения не вводятся.
