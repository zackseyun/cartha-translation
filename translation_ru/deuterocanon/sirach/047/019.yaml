translation:
  language: ru
  text: Ты отдал женщинам свою силу[a] и дал им власть над своим телом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово здесь передано как «сила»; греческий параллельный текст: «ты склонил свои чресла к женщинам», что прямо подчёркивает сексуальный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כסלך
  choice: свою силу
  rationale: Еврейская форма трудна и допускает разные толкования. В данном контексте речь идёт о телесной, мужской силе; греческое соответствие «чресла» подтверждает сексуальный смысл. «Сила» сохраняет естественность и не делает перевод излишне анатомическим.
- source_word: ותתן
  choice: ты отдал
  rationale: Глагол נתן буквально означает «дать»; «отдал» по-русски естественно передаёт здесь добровольную уступку и прямоту упрёка.
- source_word: לנשים
  choice: женщинам
  rationale: Предлог ל указывает на тех, кому была отдана сила.
- source_word: ותמשילם
  choice: и позволил им властвовать
  rationale: Каузативная форма от משל выражает допущение или установление власти. Местоименный суффикс относится к женщинам; «позволил им властвовать» ясно и естественно передаёт обвинительный смысл.
- source_word: בגויתך
  choice: над твоим телом
  rationale: גויה обозначает тело, физическую сторону человека. Хотя предлог буквально может передаваться как «в», сочетание с глаголом власти естественно выражается по-русски как «властвовать над телом»; греческий параллельный текст также говорит о теле.
theological_decisions:
- issue: Использование еврейского текста и греческого параллельного свидетельства в трудном выражении
  choice: Еврейский текст принят за основу, а греческое «твои чресла» использовано для уточнения телесно-сексуального смысла слова כסלך.
  alternative: Перевести буквально «Ты отдал женщинам свои чресла» либо понять כסלך как «своё безумие».
  rationale: Контекст обличения Соломона и греческое параллельное свидетельство поддерживают значение мужской телесной силы, однако неоднозначность еврейского слова отмечена в сноске, а не устранена без оговорки.
translation_notes:
  register: Современный литературный русский язык; тон прямого, но достойного обличения. «Властвовать» сохраняет библейскую возвышенность, оставаясь понятным современному читателю.
