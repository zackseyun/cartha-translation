  source_fidelity: 'Основной текст в целом точно следует еврейскому: «в юности», «поразил могучего воина», «снял вечный позор» и «сокрушил славу Голиафа» хорошо передают исходные выражения. Однако конструкция «подняв руку с пращой» двусмысленна: она может означать, что праща была поднята вместе с рукой, тогда как еврейское על קלע, при поддержке греческого параллеля, связывает действие с пращой/камнем пращи. Более ясное «подняв руку, чтобы метнуть камень из пращи» передаёт действие без добавления имени Давида или определения противника как исполина.'
