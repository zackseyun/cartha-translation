  text: In his youth he struck down a warrior and removed everlasting disgrace[a]; when he raised his hand with the sling[b], he shattered the glory of Goliath.
translation:
  language: ru
  text: 'В юности он поразил могучего воина и снял вечный позор[a]: подняв руку, чтобы метнуть камень из пращи[b], он сокрушил славу Голиафа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «снял позор с народа»; в еврейском — «снял вечный позор».'
    reason: alternative_reading
  - marker: b
    text: Греческий текст прямо называет противника исполином и говорит о камне пращи и о низвержении гордости Голиафа.
    reason: lexical_alternative
lexical_decisions:
- source_word: בנעוריו
  choice: В юности
  rationale: Передаёт временное значение еврейского выражения естественным современным русским языком, не уточняя возраст сверх текста.
- source_word: הכה גבור
  choice: он поразил могучего воина
  rationale: Глагол הכה означает «ударить, поразить», а גבור — «сильный, могучий человек, воин». Греческое «исполина» уточняет контекст, но основной текст следует сохранившемуся еврейскому чтению.
- source_word: ויסר חרפת עולם
  choice: и снял вечный позор
  rationale: «Снял позор» естественно передаёт ויסר חרפת, а «вечный» сохраняет прямое значение עולם и присущую выражению силу.
- source_word: בהניפו ידו על קלע
  choice: подняв руку с пращой
  rationale: Еврейская фраза сжата и буквально описывает поднятие руки при использовании пращи; русский оборот сохраняет действие и орудие, а греческий параллельный текст подтверждает связь с камнем из пращи.
- source_word: וישבר תפארת גלית
  choice: он сокрушил славу Голиафа
  rationale: תפארת допускает значения «слава, великолепие, предмет гордости»; «сокрушил славу» сохраняет широкий еврейский образ, не сводя его только к гордыне или похвальбе.
theological_decisions:
- issue: Расхождение еврейского и греческого текстов в описании снятого позора
  choice: 'В основном тексте: «снял вечный позор» по сохранившемуся еврейскому тексту'
  alternative: 'Греческое чтение: «снял позор с народа»'
  rationale: При наличии еврейского текста Сираха он служит основной опорой; греческий параллельный текст фиксируется в примечании как значимый вариант.
- issue: Обозначение противника Давида
  choice: «могучего воина» по еврейскому גבור
  alternative: «исполина» по греческому γίγαντα
  rationale: Основной текст сохраняет менее конкретное еврейское обозначение, тогда как имя Голиафа далее ясно устанавливает повествовательный контекст.
translation_notes:
  register: Современный литературный русский язык с достоинством и лёгкой поэтической выразительностью. Сохранены параллельные глагольные образы «поразил», «снял», «сокрушил» и подлинная неоднозначность слова תפארת.
