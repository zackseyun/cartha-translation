  text: You covered the earth with your wisdom[a], and you filled the heights with song of praise.
translation:
  language: ru
  text: Ты покрыл землю своей мудростью[a] и наполнил высоты хвалебной песней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Имя твоё достигло далёких островов, и тебя любили за твой мир». Греческая версия отражает существенно иную форму текста, чем сохранившийся еврейский текст.'
    reason: alternative_reading
lexical_decisions:
- source_word: כסית
  choice: покрыл
  rationale: Обычное значение глагола כסה — «покрывать». Перевод сохраняет конкретный поэтический образ мудрости, распространившейся по всей земле.
- source_word: בחכמתך
  choice: своей мудростью
  rationale: 'Предлог ב здесь естественно понимать в инструментальном значении: земля покрыта посредством мудрости. Русское «своей мудростью» передаёт это без ненужного уточнения.'
- source_word: ותקלס
  choice: наполнил
  rationale: Форма трудна для истолкования. В сочетании с במרום שירה она, вероятно, описывает наполнение или оглашение высот песней; «наполнил» сохраняет образ и не навязывает более позднее значение прямого восхваления.
- source_word: במרום
  choice: высоты
  rationale: מרום может обозначать высоту, выси или небеса. «Высоты» сохраняет пространственную поэтическую образность, не сужая смысл до конкретного космологического понятия.
- source_word: שירה
  choice: хвалебной песней
  rationale: שירה означает «песня» или «пение». В данном контексте «хвалебная песня» естественно передаёт вероятный характер этой песни и звучит современно по-русски.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающейся греческой параллелью
  choice: Основной текст переведён по еврейскому свидетельству Каирской генизы.
  alternative: «Имя твоё достигло далёких островов, и тебя любили за твой мир».
  rationale: Поскольку еврейский текст данного стиха сохранился и оценён как надёжный, ему отдан приоритет. Греческий текст, вероятно, отражает иной еврейский прототип или другую стадию текстовой традиции; его чтение приведено в сноске для прозрачности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. Синтаксис прост и понятен; слова «высоты» и «хвалебная песня» сохраняют образность оригинала без архаизации.
