  yaml_path: translation/deuterocanon/sirach/047/011.yaml
  text: Yahweh also passed over his transgression[a], and exalted his horn forever; he gave him a decree of kingship[b], and established his throne in Jerusalem.
translation:
  language: ru
  text: Господь также простил его преступление[a] и навеки возвысил его рог; он дал ему установление о царской власти[b] и утвердил его престол до Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «провёл мимо» или «отвёл его преступление»; в греческом тексте: «удалил его грехи».'
    reason: lexical_alternative
  - marker: b
    text: 'По-еврейски: «установление о царской власти»; заключительные слова буквально: «утвердил его престол до Иерусалима». Смысл этого трудного оборота не вполне ясен. В греческом тексте: «дал ему завет царей и престол славы в Израиле».'
    reason: alternative_reading
lexical_decisions:
- source_word: יהוה
  choice: Господь
  rationale: Традиционная и естественная для русского библейского текста передача тетраграмматона, без спорной реконструкции произношения.
- source_word: העביר פשעו
  choice: простил его преступление
  rationale: Буквально оборот означает «провёл мимо / отвёл его преступление»; в данном контексте естественное русское «простил» точно передаёт действие Бога, а образность еврейского выражения отмечена в сноске.
- source_word: וירם ... קרנו
  choice: возвысил его рог
  rationale: Сохранена библейская метафора рога как силы, достоинства и царского могущества; глагол передаёт возвышение статуса.
- source_word: לעולם
  choice: навеки
  rationale: Кратко и естественно выражает долговечность царской и династической чести.
- source_word: חוק ממלכת
  choice: установление о царской власти
  rationale: Сохраняет юридическую силу חוק и царственное значение ממלכת, не подменяя еврейское чтение греческим «заветом царей».
- source_word: וכסאו הכין
  choice: утвердил его престол
  rationale: הכין здесь означает сделать прочным, упрочить или утвердить; выражение естественно передаёт династический смысл.
- source_word: עד ירושלים
  choice: в Иерусалиме
  rationale: Хотя עד обычно значит «до», в данном контексте пространственный оборот естественно передаётся местным значением; буквальное чтение и расхождение с греческим текстом указаны в сноске.
theological_decisions:
- issue: Действие Бога по отношению к преступлению Давида
  choice: «простил его преступление» с пояснением буквального образа в сноске
  alternative: «отвёл / провёл мимо его преступление»; греч. «удалил его грехи»
  rationale: Передаётся божественное прощение без дополнительных утверждений об искуплении или безусловном одобрении Давида; различие еврейского и греческого свидетельств сохранено.
- issue: Формулировка царского дара
  choice: «установление о царской власти»
  alternative: греч. «завет царей»
  rationale: Основной текст следует сохранившемуся еврейскому чтению חוק ממלכת, а значимое греческое разночтение вынесено в сноску.
- issue: Местонахождение престола
  choice: «утвердил его престол в Иерусалиме»
  alternative: букв. «до Иерусалима»; греч. «престол славы в Израиле»
  rationale: Основной текст предлагает понятное контекстуальное прочтение трудного еврейского оборота, не скрывая его буквальной формы и греческого варианта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранена метафора «рог», тогда как неестественные для русского буквальные обороты разъяснены в сносках. Все маркеры сносок присутствуют в основном тексте.
