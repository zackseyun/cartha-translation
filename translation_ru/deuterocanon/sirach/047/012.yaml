  terminology: «Разумный сын» удачно передаёт מַשְׂכִּיל как рассудительного, понимающего человека. «Живший в безопасности» точно передаёт еврейское чтение. В сноске «восстал» неестественно в данном контексте; греческое чтение лучше передать как «появился».
