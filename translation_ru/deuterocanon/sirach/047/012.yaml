translation:
  language: ru
  text: Благодаря ему после него появился разумный сын[a], живший в безопасности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По-гречески: «После него появился сведущий сын, и благодаря ему он поселился в приволье». Еврейское свидетельство гласит: «живший в безопасности».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַעֲבוּרוֹ
  choice: И благодаря ему
  rationale: 'Предлог выражает причинную связь или благо, полученное ради предшественника: «благодаря ему», «ради него». Выбрано естественное русское выражение, сохраняющее связь благополучия сына с отцом.'
- source_word: עָמַד אַחֲרָיו
  choice: после него встал
  rationale: Глагол עָמַד буквально означает «встать, стоять», а в данном контексте указывает на появление преемника. Формулировка сохраняет еврейский образ, не заменяя его более истолковывающим «наследовал престол».
- source_word: בֵּן מַשְׂכִּיל
  choice: разумный сын
  rationale: מַשְׂכִּיל обозначает человека понимающего, рассудительного и проницательного. «Разумный» передаёт познавательный оттенок слова, не сводя его исключительно к нравственной мудрости.
- source_word: שׁוֹכֵן לָבֶטַח
  choice: живший в безопасности
  rationale: שׁוֹכֵן означает «живущий, обитающий», а לָבֶטַח — «безопасно, в безопасности». Перевод естественен для современного русского языка и точно передаёт смысл еврейского чтения.
theological_decisions:
- issue: Связь безопасной жизни сына с его предшественником
  choice: Сын появляется после предшественника благодаря ему и живёт в безопасности; более точная природа этой связи не уточняется.
  alternative: Вслед за греческим текстом фразу можно понять так, что сын благодаря предшественнику поселился на просторе или жил в приволье.
  rationale: Еврейский и греческий тексты связывают благоприятное положение сына с предшественником, но различаются синтаксисом и образом. Основной текст следует еврейскому свидетельству, не превращая эту связь в более определённое династическое или богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Оборот «после него встал» намеренно сохраняет образ еврейского עָמַד, тогда как причастная конструкция «живший в безопасности» делает фразу естественной и ясной.
