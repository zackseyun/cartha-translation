translation:
  language: ru
  text: Ты был назван славным именем — тем, которым назван Израиль[a]; ты накопил золота, словно железа, и умножил серебра, словно свинца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «именем, призываемым над Израилем». Еврейский оборот может обозначать имя, призываемое над кем-либо, наречённое кому-либо или указывающее на принадлежность; греческий текст также допускает смысл «призываемое над Израилем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נקראת בשם הנכבד
  choice: Ты был назван славным именем
  rationale: 'Пассивная форма נקראת передана прямо, а הנכבד — как «славным»: это сохраняет оттенки чести, величия и высокого достоинства имени и естественно звучит по-русски.'
- source_word: הנקרא על ישראל
  choice: тем, которое призывают над Израилем
  rationale: Повтор корня קרא сохранён через «назван / призывают». Оборот с על передан без сведения его смысла только к принадлежности или только к богослужебному призыванию; греческое ἐπικεκλημένου подтверждает такое понимание.
- source_word: ותצבר
  choice: ты накопил
  rationale: Глагол означает собирание и накопление богатства; «накопил» ясно и естественно передаёт этот смысл.
- source_word: כברזל זהב
  choice: золота, словно железа
  rationale: Сравнение подчёркивает необычайное изобилие золота, ставшего столь же обычным, как железо; образ исходного текста сохранён.
- source_word: וכעפרת הרבית כסף
  choice: и умножил серебро, словно свинец
  rationale: עפרת здесь означает свинец, что подтверждается греческим μόλιβον. Глагол הרבית передан как «умножил», сохраняя компактный поэтический параллелизм.
theological_decisions:
- issue: К кому и каким образом относится «славное имя»
  choice: Сохранена формулировка о славном имени, призываемом над Израилем, без уточнения механизма этой связи.
  alternative: Истолковать выражение как прямое указание на то, что Соломон носит имя Господа, либо как общее утверждение о заветной принадлежности Израиля.
  rationale: Еврейский и греческий тексты связывают почитаемое Божье имя с Израилем, но не раскрывают здесь точный богословский смысл оборота. Перевод сохраняет эту многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической похвалы. Синтаксический параллелизм и образы золота как железа и серебра как свинца сохранены; архаичные и конфессионально нагруженные формулы избегаются.
