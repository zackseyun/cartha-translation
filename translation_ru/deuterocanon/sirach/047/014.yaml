  source_fidelity: 'Основной текст в целом точно передаёт древнееврейское אשר הכין בית לשמו, ויצב לעד מקדש: относительное придаточное, «дом», формула «для имени Его», прочное установление святилища и длительность «навеки». Однако «приготовил дом» в современном русском звучит как предварительная подготовка уже существующего дома и недостаточно ясно передаёт создание/устроение храмового дома; «устроил» лучше сохраняет широкий смысл הכין, не сводя его только к строительству.'
