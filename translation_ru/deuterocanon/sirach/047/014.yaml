translation:
  language: ru
  text: который устроил дом для имени Его[a] и навеки утвердил святилище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В представленном греческом параллельном тексте вместо этой строки сказано: «Как мудр ты стал в юности своей и наполнился разумением, словно река». Этот греческий текст отражает другую строку в окружающем контексте; основной текст здесь следует сохранившемуся древнееврейскому тексту.'
    reason: textual_variant
lexical_decisions:
- source_word: אשר
  choice: который
  rationale: Вводит определительное придаточное, относящееся к Соломону в предшествующем контексте.
- source_word: הכין
  choice: приготовил
  rationale: Передаёт значение «подготовил, устроил», не сводя глагол исключительно к строительству.
- source_word: בית
  choice: дом
  rationale: Сохраняет буквальный библейский образ дома Божьего, хотя по контексту речь идёт о храме.
- source_word: לשמו
  choice: для имени Его
  rationale: Сохраняет значимую древнееврейскую формулу посвящения святилища имени Бога без пояснительной подмены словом «Господь».
- source_word: ויצב
  choice: утвердил
  rationale: 'Передаёт каузативный смысл: поставил прочно, сделал устойчивым.'
- source_word: לעד
  choice: навеки
  rationale: Естественно передаёт риторически сильное обозначение непреходящей длительности, не устраняя исторического напряжения.
- source_word: מקדש
  choice: святилище
  rationale: Точно обозначает священное место; определённость понятна из контекста.
theological_decisions:
- issue: Храм и формула имени Бога
  choice: дом для имени Его
  alternative: храм для Господа
  rationale: 'Сохранена богословски значимая древнееврейская формула: храм связан с Божьим именем, а не описан как место, которое буквально вмещает Бога.'
- issue: Сила выражения לעד
  choice: навеки
  alternative: на все времена
  rationale: Прямой перевод сохраняет идеализированную риторику постоянства и не пытается согласовать её с последующим разрушением храма.
- issue: Расхождение древнееврейского и греческого текстов
  choice: Основной текст следует сохранившемуся древнееврейскому чтению
  alternative: Следовать греческому тексту о мудрости Соломона в юности
  rationale: Древнееврейское свидетельство указано как высоконадёжное и непосредственно представляет данный стих; существенно отличающееся греческое чтение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Инверсия «для имени Его» сохраняет традиционный сакральный оттенок, оставаясь понятной; строчная буква в начале обусловлена продолжением предложения из предыдущего стиха.
