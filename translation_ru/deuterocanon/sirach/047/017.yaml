translation:
  language: ru
  text: Песней, притчей, загадкой и изречением ты привёл народы в изумление.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово здесь трудно для истолкования и может передавать потрясение или сильное волнение. В греческом тексте: «В песнях, пословицах, притчах и толковании страны дивились тебе».'
    reason: textual_variant
lexical_decisions:
- source_word: בשיר
  choice: песней
  rationale: Предлог ב допускает значение средства или сферы; творительный падеж естественно передаёт здесь инструментальный смысл и вводит перечень словесных форм.
- source_word: משל
  choice: притчей
  rationale: משל обозначает притчу, пословицу или мудрое изречение. «Притча» уместна применительно к Соломону и сохраняет широту образной мудрой речи.
- source_word: חידה
  choice: загадкой
  rationale: חידה обычно означает загадку или намеренно тёмное, требующее разгадки изречение; прямой русский эквивалент ясен и точен.
- source_word: ומליצה
  choice: изречением
  rationale: מליצה может обозначать искусную, выразительную речь, а иногда истолкование. Нейтральное «изречение» естественно завершает перечень, не устраняя возможного оттенка красноречия.
- source_word: עמים
  choice: народы
  rationale: Сохраняет множественное собирательное значение и не сужает его до политических государств.
- source_word: הסערתה
  choice: ты привёл ... в изумление
  rationale: Еврейская форма трудна и буквально связана с волнением или потрясением. Греческий параллельный текст ясно указывает на удивление; выбранная формулировка передаёт результат сильного воздействия без неестественной буквальности.
