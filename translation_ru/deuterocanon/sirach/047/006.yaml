base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/006.yaml
  text: Therefore the daughters answered him[a], and acclaimed him among the myriads. When he put on the turban, he fought[b], and all around he subdued the foe.
translation:
  language: ru
  text: Поэтому девушки откликнулись ему[a] и прославили его среди десятков тысяч. Облачившись в тюрбан, он сражался и повсюду покорил врага.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Вероятно, речь о женщинах, которые после победы откликались песней или торжественными возгласами. Греческий текст здесь читается иначе: «Так он прославил его среди десятков тысяч и восхвалил его благословениями Господа, когда ему был принесён венец славы».'
    reason: Культурное пояснение к «девушки откликнулись ему» и значимое альтернативное чтение греческой традиции, в котором вместо еврейского «тюрбана» упомянут «венец славы».
lexical_decisions:
- source_word: על כן
  choice: Поэтому
  rationale: Передаёт следственное значение оборота и связывает стих с предшествующим рассказом о победах Давида.
- source_word: ענו לו
  choice: отвечали ему
  rationale: Сохраняет основное значение глагола ענה — «отвечать, откликаться»; в данном контексте возможен отклик победной песней, что поясняется в сноске.
- source_word: בנות
  choice: дочери
  rationale: Формально соответствует еврейскому слову; по контексту имеются в виду женщины, участвующие в победном праздновании.
- source_word: ויכנוהו
  choice: прославляли его
  rationale: Форма в еврейском тексте трудна; публичное прославление соответствует контексту и поддерживается греческим параллельным текстом ἐδόξασεν и ᾔνεσεν.
- source_word: ברבבה
  choice: среди десятков тысяч
  rationale: Передаёт числовой образ רבבה естественным современным русским выражением и согласуется с греческим ἐν μυριάσιν.
- source_word: בעטותו
  choice: облачённый
  rationale: Передаёт обстоятельственное значение формы — действие совершается, когда Давид надевает или носит головной убор; русская конструкция остаётся краткой и естественной.
- source_word: צניף
  choice: тюрбан
  rationale: Прямое значение — обмотанный головной убор. Греческое «венец славы» представляет значимое царское прочтение и приводится в сноске.
- source_word: נלחם
  choice: сражался
  rationale: Естественно и точно передаёт военное действие.
- source_word: ומסביב
  choice: повсюду
  rationale: Передаёт пространственный охват «вокруг, со всех сторон» без архаического оттенка.
- source_word: הכניע
  choice: покорял
  rationale: Сохраняет значение подчинения и низложения противника.
- source_word: צר
  choice: врага
  rationale: Передаёт собирательно употреблённое единственное число и звучит естественно по-русски.
theological_decisions:
- issue: Соотношение еврейского образа צניף и греческого διάδημα δόξης
  choice: В основном тексте сохранено еврейское «тюрбан», а греческое царское прочтение вынесено в сноску.
  alternative: «венец» или «венец славы» в основном тексте
  rationale: При наличии надёжного еврейского текста приоритет отдаётся ему. Однако греческая традиция может отражать вариант текста или истолкование, подчёркивающее царское достоинство Давида, поэтому она сохранена для читателя.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Неясность еврейского ענו לו сохранена глаголом «отвечали», а вероятный песенный контекст пояснён в сноске. Единственный маркер [a] присутствует в основном тексте.
