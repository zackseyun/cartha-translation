base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/024.yaml
  text: A broad folly and lacking understanding was Rehoboam[a], who caused the people to revolt by his counsel, until one arose—may there be no remembrance of him—Jeroboam son of Nebat[b], who sinned and caused Israel to sin.
translation:
  language: ru
  text: Ровоам был преисполнен глупости и лишён разумения; своим замыслом он довёл народ до отпадения[b], пока не появился Иеровоам, сын Навата, — да не останется о нём памяти! — тот, кто согрешил и ввёл Израиль в грех.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь сжат, а деление на стихи, по-видимому, нестабильно. Греческая параллель даёт более полный текст, включая слова: «и дал Ефрему путь греха». Эта фраза не включена в основной текст, поскольку её нет в сохранившейся здесь еврейской строке.'
    reason: textual_variant
  - marker: b
    text: 'Или: «своим замыслом он отделил народ». Еврейское выражение трудно для истолкования; греческая параллель поддерживает смысл, согласно которому политика Ровоама привела народ к отпадению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רחב אולת וחסר בינה
  choice: безмерно глуп и лишён разумения
  rationale: Буквальное «широк глупостью» неестественно по-русски. «Безмерно глуп» передаёт усилительный смысл трудного выражения רחב אולת, а «лишён разумения» прямо отражает חסר בינה; греческая параллель также характеризует Ровоама как скудного разумом.
- source_word: רחבעם
  choice: Ровоам
  rationale: Принятая в русской библейской традиции форма имени.
- source_word: הפריע בעצתו עם
  choice: своими решениями он довёл народ до мятежа
  rationale: Фраза в еврейском свидетеле трудна. Греческое ἀπεστέτησεν λαὸν ἐκ βουλῆς αὐτοῦ подтверждает, что политика или замысел Ровоама вызвали отпадение народа. «Решения» естественнее в политическом контексте, чем буквальный «совет».
- source_word: עד אשר קם, אל יהי לו זכר
  choice: Затем восстал… — да не останется о нём памяти! —
  rationale: Передаёт появление Иеровоама и сохраняет отдельное резкое проклятие еврейского текста. «Затем» выбрано вместо буквального «до тех пор, пока», поскольку в сжатом и нестабильно разделённом тексте это лучше связывает последовательность событий, не создавая ложной временной зависимости.
- source_word: ירבעם בן נבט
  choice: Иеровоам, сын Навата
  rationale: Использованы традиционные русские библейские формы имён.
- source_word: חטא והחטיא את ישראל
  choice: сам согрешил и ввёл Израиль в грех
  rationale: Сохраняется различие между простым глаголом «согрешил» и каузативной формой «побудил грешить». Слово «сам» ясно подчёркивает эту последовательность без добавления нового содержания.
theological_decisions:
- issue: Соотношение сжатого еврейского текста и более полной греческой параллели
  choice: 'Основной текст передаёт общую для свидетелей последовательность: неразумие Ровоама, вызванный его политикой мятеж и грех Иеровоама, вовлёкшего в грех Израиль.'
  alternative: Включить греческое добавление о том, что Иеровоам «дал Ефрему путь греха», либо воспроизвести еврейские строки как разрозненные фрагменты.
  rationale: Еврейский текст остаётся основным, а греческий помогает установить синтаксическую связь там, где еврейское свидетельство сжато. Отсутствующая в сохранившейся еврейской строке фраза о Ефреме не внесена в основной текст.
- issue: К кому относится пожелание об отсутствии памяти
  choice: Пожелание «да не останется о нём памяти» отнесено к Иеровоаму.
  alternative: Отнести его к Ровоаму или оставить референта полностью неопределённым.
  rationale: Положение фразы непосредственно при сообщении о появлении Иеровоама и последующее осуждение его греха делают это прочтение наиболее вероятным, хотя сжатость еврейского текста отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Традиционные формы имён сохранены. Неловкая буквальность еврейской идиомы устранена, но резкость нравственной оценки и проклятия не смягчена.
