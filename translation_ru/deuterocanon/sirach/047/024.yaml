  source_fidelity: 'Нужна правка временно-синтаксической связки: «Затем» не передаёт עד אשר («пока не / до тех пор, пока не»), а «восстал» неоправданно приписывает Иеровоаму именно мятежное действие там, где קם означает «появился / возник». Характеристика Ровоама, его роль в отпадении народа и двойная характеристика греха Иеровоама в остальном переданы по общему ядру еврейского текста и греческой параллели.'
  naturalness: Исправленный вариант сохраняет современный литературный и сдержанно-библейский русский. «Преисполнен глупости» естественнее, чем «безмерно глуп», при этом лучше передаёт образную интенсивность трудного רחב אולת.
  terminology: Традиционные русские формы «Ровоам», «Иеровоам» и «Нават» уместны. «Ввёл Израиль в грех» надёжно передаёт каузатив החטיא. «Отпадение» соответствует политико-религиозному смыслу, который поддержан греческим ἀπεστέτησεν.
