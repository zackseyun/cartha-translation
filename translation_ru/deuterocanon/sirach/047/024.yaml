revisions:
- from: Безмерно глуп и лишён разумения был Ровоам[a]; своими решениями он довёл народ до мятежа[b]. Затем восстал Иеровоам, сын Навата, — да не останется о нём памяти! — который сам согрешил и ввёл Израиль в грех.
  to: Ровоам был преисполнен глупости и лишён разумения; своим замыслом он довёл народ до отпадения[b], пока не появился Иеровоам, сын Навата, — да не останется о нём памяти! — тот, кто согрешил и ввёл Израиль в грех.[a]
  rationale: 'Перевод исправляет два небезразличных для смысла момента: сохраняет עד אשר как «пока не появился» и передаёт קם нейтрально, не называя появление Иеровоама восстанием. «Преисполнен глупости» точнее и литературнее передаёт трудное выражение רחב אולת. Сноска a сохранена и перенесена к заключительному утверждению, к которому относится текстологическое пояснение; сноска b остаётся у спорного выражения о действиях Ровоама.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T10:06:38Z'
