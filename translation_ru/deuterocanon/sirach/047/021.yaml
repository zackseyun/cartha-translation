translation:
  language: ru
  text: чтобы разделить народ на два колена[a], и из Ефрема — царство насилия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «чтобы власть разделилась и от Ефрема началось непокорное царство». Еврейский текст прямо говорит о разделении народа на два колена.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «царство беззакония» или «мятежное царство». Еврейское חמס может означать насилие, неправду или злодеяние; греческий текст подчёркивает непокорность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לחלק
  choice: разделить
  rationale: Инфинитив обозначает вызванный политический раскол, а не простое распределение.
- source_word: העם
  choice: народ
  rationale: Прямо передаёт עם и обозначает единый народ до раскола.
- source_word: לשני שבטים
  choice: на два колена
  rationale: שבטים буквально означает «колена»; традиционный библейский термин здесь остаётся понятным и сохраняет формулировку еврейского текста.
- source_word: ומאפרים
  choice: и от Ефрема
  rationale: Предлог מן указывает на происхождение; эта передача также соответствует греческому ἐξ Ἐφραὶμ.
- source_word: ממלכת חמס
  choice: царство беззакония
  rationale: Именная конструкция естественно передаётся по-русски родительным определительным; «беззаконие» охватывает насилие и неправду, не сводя смысл только к физической жестокости.
- source_word: חמס
  choice: беззаконие
  rationale: Слово может означать насилие, неправду и злодеяние; греческое ἀπειθῆ дополнительно указывает на непокорность, поэтому широкая нравственная характеристика уместнее узкого «насилие».
theological_decisions:
- issue: Характеристика царства, возникшего от Ефрема
  choice: царство беззакония
  alternative: насильственное царство; мятежное царство; непокорное царство
  rationale: Еврейское חמס подчёркивает насилие или неправду, тогда как греческое ἀπειθῆ — непокорность. Основной текст сохраняет широкое нравственное осуждение, а примечание сообщает о диапазоне смысла.
- issue: Глагольность второй части
  choice: произошло царство
  alternative: 'буквально оставить именную фразу: «и от Ефрема — царство беззакония»'
  rationale: В еврейском вторая часть не содержит явного глагола. «Произошло» добавлено курсивно не маркируемо как естественная русская связка возникновения, согласующаяся с происхождением «от Ефрема», но не приписывает Ефрему намеренного учреждения царства.
translation_notes:
  register: Современный литературный русский с умеренно библейской лексикой. «Колена» сохраняет точный историко-библейский термин. Порядок примечаний приведён в последовательность их появления; все маркеры присутствуют в основном тексте.
