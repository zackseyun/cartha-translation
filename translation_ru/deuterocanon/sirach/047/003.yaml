base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/047/003.yaml
  text: He played with young lions as with a kid[b][a], and with bears as with calves of Bashan.
translation:
  language: ru
  text: 'Он играл с молодыми львами, как с козлёнком,

    и с медведями — как с молодняком Васана.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «и с медведями — как с ягнятами овечьего стада»; здесь второе сравнение выражено конкретнее, чем в еврейском: «с молодняком Васана».'
    reason: alternative_reading
  - marker: b
    text: Васан славился крепким, упитанным скотом; вероятно, этот образ представляет опасных зверей такими же ручными и безобидными, как домашний молодняк.
    reason: cultural_note
lexical_decisions:
- source_word: לכפירים
  choice: с молодыми львами
  rationale: כפירים обозначает молодых львов; предлог ל в поэтическом контексте передан ассоциативным «с», что согласуется с греческой параллелью.
- source_word: שחק
  choice: играл
  rationale: Глагол выражает игру или забаву; «играл» естественно передаёт образ бесстрашного обращения с опасными зверями.
- source_word: כגדי
  choice: как с козлёнком
  rationale: גדי — молодой козёл, козлёнок. Добавленное по-русски «с» ясно показывает, что молодой лев уподоблен ручному домашнему животному.
- source_word: ולדבים
  choice: и с медведями
  rationale: Союз и предлог продолжают параллельную конструкцию первого полустишия.
- source_word: כבני בשן
  choice: как с молодняком Васана
  rationale: Буквально выражение означает «как с сынами/молодыми [животными] Васана». «Молодняк» сохраняет неопределённость вида животного и одновременно передаёт пастушеский образ региона, известного своим скотом.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и более пояснительного греческого чтения
  choice: В основном тексте следовать еврейскому «молодняком Васана», не уточняя вид животного.
  alternative: 'Следовать греческому: «как с ягнятами овечьего стада»; либо конкретизировать по контексту как «с телятами Васана».'
  rationale: Сохранившийся еврейский текст первичен и оставляет вид молодняка неопределённым. Греческая версия подтверждает общий смысл сравнения с безобидными домашними животными, но делает образ конкретнее.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого поэтического параллелизма. «Молодняк Васана» намеренно сохраняет лексическую неопределённость еврейского текста; тире во втором полустишии облегчает чтение параллельной конструкции.
