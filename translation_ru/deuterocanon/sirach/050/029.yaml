  text: For if one does these things[a], he will prevail in everything, for the light of the Lord is his path.
translation:
  language: ru
  text: Ведь если человек будет исполнять всё это, он справится со всем, потому что свет Господа — его путь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его след» или «отпечаток его ноги».'
    reason: Сохраняет конкретный образ греческого ἴχνος, который в основном тексте естественно передан словом «путь».
lexical_decisions:
- source_word: ἐὰν γὰρ αὐτὰ ποιήσῃ
  choice: Ведь если человек будет исполнять всё это
  rationale: «Ведь» передаёт пояснительную связь γὰρ с предыдущим наставлением. Не выраженное в греческом подлежащее передано словом «человек» для естественности русского текста, а «исполнять всё это» обозначает практическое следование упомянутым ранее наставлениям.
- source_word: πρὸς πάντα ἰσχύσει
  choice: он справится со всем
  rationale: Сжатое сочетание буквально выражает силу или способность по отношению ко всему. «Справится со всем» естественно передаёт практическую действенность, не сводя смысл исключительно к успеху или к противоборству.
- source_word: φῶς Κυρίου
  choice: свет Господа
  rationale: Сохранён прямой образ света и традиционное обозначение κύριος — «Господь».
- source_word: τὸ ἴχνος αὐτοῦ
  choice: его путь
  rationale: ἴχνος буквально означает «след», «отпечаток ноги» и может обозначать путь или направление движения. «Его путь» естественно выражает образ жизненного пути, а конкретность греческого слова отмечена в сноске.
theological_decisions:
- issue: Образ τὸ ἴχνος αὐτοῦ
  choice: Свет Господа представлен как путь человека, который исполняет наставления.
  alternative: 'Более буквально: свет Господа — его след или отпечаток ноги; образ может подчёркивать видимый след либо направление движения.'
  rationale: Греческая фраза метафорична и сжата. Основной текст передаёт наиболее связное в контексте Премудрости понимание — Божий свет определяет путь человека, — однако сноска сохраняет конкретный и несколько неоднозначный образ оригинала.
translation_notes:
  register: Современный литературный русский язык; ясный, наставительный и достойный стиль. Синтаксис сохранён как причинно связанное изречение, а тяжеловесный буквализм устранён без потери образа, отмеченного сноской.
