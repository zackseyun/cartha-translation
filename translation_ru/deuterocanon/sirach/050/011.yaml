    issue: Неестественное сочетание «одежды чести».
    rationale: В современном литературном русском это калькированная конструкция. «Почётные одежды» передаёт смысл בִּגְדֵי כָבוֹד без потери регистра.
  - severity: low
    issue: В примечании «ограда святилища» неточно передаёт заявленную греческую альтернативу.
    rationale: Для περιβολή здесь уместнее отметить возможное «облачение» или «двор святилища»; «ограда» меняет обозначаемый объект.
  - severity: low
    issue: Несогласованность видов в описании последовательных действий.
    rationale: «Он украшал» звучит как повторяющееся или длительное действие, тогда как контекст представляет церемониальную сцену; «он украсил» естественнее и ближе к форме греческого параллельного текста.
  revised_text: Когда он облачался в почётные одежды и надевал великолепные одежды, когда он восходил к величественному жертвеннику[a], он украсил двор святилища.
