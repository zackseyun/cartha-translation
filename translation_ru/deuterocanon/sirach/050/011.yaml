base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/011.yaml
  text: When he put on garments of honor and clothed himself in garments of splendor[a], when he went up to the altar of glory, he adorned the court of the sanctuary.
translation:
  language: ru
  text: Когда он облачался в почётные одежды и надевал великолепные одежды, когда он восходил к величественному жертвеннику[a], он украсил двор святилища.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «к святому жертвеннику»; продолжение там можно понять как «прославил облачение (или двор) святилища». В еврейском тексте — «величественный жертвенник» и «двор святилища».'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲטוֹתוֹ
  choice: когда он облачался
  rationale: Глагол описывает священническое облачение; «облачался» естественно и торжественно звучит в данном культовом контексте.
- source_word: בִּגְדֵי כָבוֹד
  choice: в одежды чести
  rationale: Сохраняет конструкцию и смысл כבוד — «честь, слава», не смешивая её с последующим обозначением великолепия.
- source_word: וְהִתְלַבְּשׁוֹ
  choice: и одевался
  rationale: Передаёт возвратное значение и сохраняет поэтический параллелизм без тяжеловесного повтора «облачался».
- source_word: בִּגְדֵי תִפְאָרֶת
  choice: в одежды великолепия
  rationale: תפארת обозначает красоту, великолепие и славу; «великолепие» уместно для парадных священнических одежд.
- source_word: בַּעֲלוֹתוֹ
  choice: когда восходил
  rationale: Передаёт буквальное движение вверх и соответствует торжественному регистру стиха.
- source_word: מִזְבַּח הוֹד
  choice: к величественному жертвеннику
  rationale: הוד выражает величие, великолепие или славу. Прилагательное создаёт естественное русское сочетание и не переопределяет его как освящённость.
- source_word: וַיֶּהְדַּר
  choice: он украшал
  rationale: 'Глагол הדר здесь имеет каузативный смысл: придавать великолепие, украшать.'
- source_word: עֲזֶרֶת מִקְדָּשׁ
  choice: двор святилища
  rationale: Точно и ясно передаёт священный ограждённый двор и конструктивную связь с «святилищем».
theological_decisions:
- issue: Расхождение еврейского и греческого свидетелей в характеристике жертвенника
  choice: 'Основной текст следует сохранившемуся еврейскому чтению: жертвенник назван величественным.'
  alternative: 'По греческому тексту: «святой жертвенник»; далее греческая формулировка допускает передачу «прославил облачение/ограду святилища».'
  rationale: Еврейский свидетель здесь сохранён, уверен и связен, поэтому он имеет приоритет; реальное расхождение с греческой традицией отмечено, а не устранено.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным регистром. Культовые термины переданы ясно и традиционно; поэтический параллелизм двух строк сохранён.
