revisions:
- from: Когда он облачался в одежды чести и одевался в одежды великолепия, когда восходил к величественному жертвеннику[a], он украшал двор святилища.
  to: Когда он облачался в почётные одежды и надевал великолепные одежды, когда он восходил к величественному жертвеннику[a], он украсил двор святилища.
  rationale: Правка устраняет неестественную кальку «одежды чести», делает глагольную последовательность более ясной в русском повествовании и уточняет альтернативное греческое чтение в примечании. Смысл, культовый регистр, еврейский приоритет и текстологическая неоднозначность сохранены.
