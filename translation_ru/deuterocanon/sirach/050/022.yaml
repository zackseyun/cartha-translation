base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/022.yaml
  text: And now[a], please bless Yahweh, the God of Israel, who does wondrous things on the earth, who makes man great from the womb and deals with him according to his will.
translation:
  language: ru
  text: А теперь благословите же Яхве, Бога Израиля, Который творит чудеса на земле, возвышает человека от утробы и поступает с ним по Своей воле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «и поступает с нами по Своей милости» вместо «и поступает с ним по Своей воле».'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: благословите же
  rationale: Множественное повелительное наклонение передано прямо, а частица נָא — побудительной частицей «же», естественной для торжественного призыва и не создающей разговорной вежливой формулы.
- source_word: יְהֹוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: Яхве, Бога Израиля
  rationale: Личное имя Бога передано транслитерацией «Яхве»; приложение «Бога Израиля» сохраняет синтаксис и идентификацию исходного текста.
- source_word: הַמַּפְלִיא לַעֲשׂוֹת
  choice: творящего чудеса
  rationale: Идиоматически передаёт причастную конструкцию со значением совершения дивных, необычайных дел.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: В хвалебном контексте выражение вероятнее имеет широкий смысл «на земле», а не локальный «в стране».
- source_word: הַמְגַדֵּל אָדָם
  choice: возвеличивающего человека
  rationale: Порода hифиль глагола גדל выражает возвышение или наделение величием; «человека» сохраняет единичный собирательно-представительный смысл אָדָם без ненужного полового уточнения.
- source_word: מֵרֶחֶם
  choice: от утробы
  rationale: Сохраняет буквальный образ еврейского текста, подтверждаемый греческим ἐκ μήτρας; добавление «материнской» не требуется по-русски в данном возвышенном регистре.
- source_word: וַיַּעֲשֵׂהוּ בִּרְצוֹנוֹ
  choice: и поступающего с ним по Своей воле
  rationale: Передаёт действие Бога по отношению к человеку, не сужая многозначное עשה до физического создания; «по Своей воле» прямо отражает בִּרְצוֹנוֹ. Причастная координация делает фразу естественной по-русски.
theological_decisions:
- issue: Представительное значение אָדָם
  choice: человека
  alternative: человечество; мужчину
  rationale: Единственное число сохранено, но контекст указывает на человека как представителя человеческого рода, а не специально на взрослого мужчину.
- issue: Расхождение последней части стиха в еврейском и греческом свидетелях
  choice: по Своей воле
  alternative: по Своей милости
  rationale: Основной текст следует сохранившемуся еврейскому ברצונו. Значимое греческое чтение κατὰ τὸ ἔλεος αὐτοῦ сохраняется в примечании, чтобы не устранять текстологическую и богословскую напряжённость.
- issue: Референт притяжательного местоимения в «по Своей воле»
  choice: Своей
  alternative: его
  rationale: Русское возвратное местоимение ясно относит волю к Богу, как и еврейский местоименный суффикс; прописная буква соответствует благоговейному литературному регистру, не добавляя отдельного доктринального утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, молитвенно-хвалебным звучанием. Причастный ряд сохраняет структуру еврейского текста; архаические формы и конфессионально специфическая терминология не используются.
