    issue: Причастная форма в последней части
    rationale: «И поступающего с ним» стирает переход от еврейских причастий к личной форме וַיַּעֲשֵׂהוּ. Личная форма «и поступает с ним» точнее и естественнее.
  - severity: low
    issue: «Возвеличивающего человека»
    rationale: Глагол допустим, но «возвышает человека» точнее передаёт значение hифиля גדל и лучше согласуется с греческим ὑψοῦντα, не предполагая наделения человека собственной величественностью.
