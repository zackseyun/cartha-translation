  rationale: Перестроен причастный ряд в относительное предложение с личными глаголами, чтобы сохранить смысловую и формальную динамику еврейского текста и сделать фразу более естественной по-русски. «Возвеличивающего» заменено на «возвышает» как более точное соответствие הַמְגַדֵּל. Сноска отредактирована для соответствия новой грамматической форме, без изменения содержания разночтения.
