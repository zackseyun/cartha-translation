  text: И во второй раз они пали ниц[a], чтобы принять от него благословения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пасть»; здесь имеется в виду земной поклон во время богослужения.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте говорится: «явить благословение от Всевышнего»; в этом варианте источник благословения назван прямо.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁנוּ ... שֵׁנִית
  choice: во второй раз
  rationale: Оба элемента выражают повторность. Русское «во второй раз» естественно передаёт их общий смысл, не создавая тяжеловесного повтора «снова во второй раз».
- source_word: לִנְפּוֹל
  choice: пали ниц
  rationale: Буквально глагол означает «пасть», а в данном богослужебном контексте — совершить земной поклон. «Пали ниц» сохраняет образ еврейского текста и ясно передаёт поклонение.
- source_word: בְּרָכוֹת
  choice: благословения
  rationale: Сохранено грамматическое множественное число еврейского текста; в русском оно естественно в контексте получения священнических благословений.
- source_word: לָקַחַת
  choice: принять
  rationale: Хотя основное значение — «брать», здесь речь идёт о принятии преподаваемых благословений.
- source_word: מִפָּנָיו
  choice: от него
  rationale: Еврейское выражение буквально означает «от его лица/из его присутствия». Естественное русское «от него» сохраняет местоимение и не уточняет его референта сверх текста.
theological_decisions:
- issue: К кому относится местоимение в מִפָּנָיו и как соотнести его с греческим чтением
  choice: 'В основном тексте сохранено еврейское местоимение: «от него».'
  alternative: 'Греческий текст: «явить благословение от Всевышнего».'
  rationale: Сохранившийся еврейский текст имеет местоименный суффикс третьего лица и в ближайшем контексте может указывать на священнослужителя. Греческая традиция прямо называет Всевышнего источником благословения. Основной текст следует еврейскому свидетельству, а иной греческий вариант отмечен в сноске без устранения смыслового напряжения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным богослужебным оттенком. Формулировка «пали ниц» сохраняет конкретный образ еврейского текста; синтаксис сделан естественным для русского читателя.
