  text: the inhabitants of Seir and Philistia[a], and the foolish nation that dwells in Shechem.
translation:
  language: ru
  text: жители Сеира и Филистии[a] и неразумный народ, живущий в Сихеме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «живущие на горе Самарии, филистимляне» — вместо «жители Сеира и Филистии».'
    reason: textual_variant
lexical_decisions:
- source_word: יוֹשְׁבֵי
  choice: жители
  rationale: Субстантивированная форма множественного числа в сопряжённом состоянии обозначает людей, постоянно живущих в данной местности; «жители» естественно и точно передаёт собирательный смысл.
- source_word: שֵׂעִיר
  choice: Сеира
  rationale: Название местности передано в принятой русской библейской форме. В еврейском тексте нет отдельного слова «гора», поэтому оно не добавляется.
- source_word: וּפְלֶשֶׁת
  choice: и Филистии
  rationale: Форма обозначает землю или область, а не непосредственно филистимлян; зависимость от слова «жители» сохраняется по-русски.
- source_word: גּוֹי
  choice: народ
  rationale: В данном контексте גוי обозначает этническую общность. Русское «народ» звучит естественнее, чем «нация», и не привносит современного политического оттенка.
- source_word: נָבָל
  choice: неразумный
  rationale: Слово выражает не только недостаток ума, но и предосудительное нравственное безрассудство. «Неразумный» сохраняет оценочную силу, не сводя её к интеллектуальной неспособности.
- source_word: הַדָּר
  choice: живущий
  rationale: Причастие имеет определительное значение и указывает на постоянное проживание; «живущий» естественно согласуется с единственным собирательным существительным «народ».
- source_word: בִּשְׁכֶם
  choice: в Сихеме
  rationale: Использована традиционная и узнаваемая русская форма библейского топонима Шхем.
theological_decisions:
- issue: Расхождение еврейского и греческого текстов в первом географическом наименовании
  choice: В основном тексте принято еврейское чтение «жители Сеира и Филистии».
  alternative: 'Греческий текст: «живущие на горе Самарии, филистимляне».'
  rationale: Сохранившийся и уверенно засвидетельствованный еврейский текст имеет приоритет; существенно отличающееся греческое чтение сохранено в сноске без попытки согласовать варианты.
translation_notes:
  register: Современный литературный русский язык с лаконичной, достойной библейской интонацией. Географические названия даны в узнаваемых русских библейских формах; синтаксис следует параллельному строению еврейской строки.
