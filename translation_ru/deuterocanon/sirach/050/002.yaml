translation:
  language: ru
  text: В его время было вырыто водохранилище, и проложен водовод[a], подобный морю обилием воды.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «водовод», не вполне ясно; оно может обозначать также канал или водоток.
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте этот стих существенно иной: «Им была заложена высота двойного сооружения, высокая подпорная стена священной ограды». Еврейское свидетельство вместо этого говорит о водохранилище и водоводе.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּדוֹרוֹ
  choice: В его время
  rationale: Оборот обозначает период деятельности первосвященника; современное русское «в его время» естественно передаёт временной смысл, не сужая его до буквального «в его поколении».
- source_word: נִכְרָה
  choice: было вырыто
  rationale: Пассивная форма глагола כרה обозначает выкапывание или высекание; применительно к водохранилищу «было вырыто» ясно и естественно.
- source_word: מִקְוֶה
  choice: водохранилище
  rationale: В архитектурном контексте слово указывает на место сбора и хранения значительного объёма воды; «водохранилище» передаёт масштаб сооружения лучше, чем более узкие «водоём» или «цистерна».
- source_word: שִׂיחַ
  choice: водовод
  rationale: Точное значение еврейского слова здесь неясно, но параллелизм с водохранилищем предполагает канал либо иное сооружение для проведения воды. «Водовод» сохраняет инженерный оттенок, а неопределённость отмечена в сноске.
- source_word: כַּיָּם
  choice: подобный морю
  rationale: Явное сравнение с морем сохранено без ослабления.
- source_word: בַּהֲמוֹנוֹ
  choice: по своему многоводью
  rationale: Слово הָמוֹן может обозначать множество, изобилие или шумную массу. В контексте водного сооружения «многоводье» естественно передаёт идею огромного количества воды, хотя возможный оттенок шума не выражен однозначно.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающейся греческой параллелью
  choice: Основной текст переведён по еврейскому свидетельству как описание водохранилища и водовода.
  alternative: 'Греческий текст: «Им была заложена высота двойного сооружения, высокая подпорная стена священной ограды».'
  rationale: Сохранившийся еврейский текст имеет приоритет как исходное свидетельство, однако греческая параллель отражает подлинное крупное разночтение, которое нельзя молча устранять; поэтому она приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным для отдельного стиха; добавлен подразумеваемый глагол «проложен», чтобы избежать обрывочной конструкции и ясно связать оба водных сооружения.
