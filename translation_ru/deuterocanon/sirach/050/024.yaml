  yaml_path: translation/deuterocanon/sirach/050/024.yaml
  text: May his mercy remain faithful with Shimon[a], and may he establish for him the covenant of Phinehas[b], which shall not be cut off from him or from his offspring as long as the days of heaven endure.
translation:
  language: ru
  text: Да пребудет Его милость верна Шимону[a], и да утвердит Он для него завет Пинхаса[b], который не будет отнят ни у него, ни у его потомства, доколе существуют небеса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Да вверит Он нам Свою милость и во дни его да избавит нас». Это чтение существенно отличается от сохранившегося еврейского текста, где говорится о Шимоне и завете Пинхаса.'
    reason: alternative_reading
  - marker: b
    text: «Завет Пинхаса» — указание на непреходящий священнический завет в Числах 25:12–13.
    reason: cross_reference
lexical_decisions:
- source_word: יֵאָמֵן עִם שִׁמְעוֹן חַסְדּוֹ
  choice: Да пребудет Его милость верна Шимону
  rationale: Нифаль от אמן передаёт устойчивость и верность, а חסד — милость с оттенком неизменной, заветной преданности. Формулировка сохраняет оба смысловых компонента и звучит естественно по-русски.
- source_word: וְיָקֶם לוֹ
  choice: и да утвердит Он для него
  rationale: Хифиль от קום в сочетании с заветом означает установить, утвердить или подтвердить; «утвердит» сохраняет заветный оттенок.
- source_word: בְּרִית פִּינְחָס
  choice: завет Пинхаса
  rationale: Краткая формулировка сохраняет аллюзию на вечный священнический завет, связанный с Пинхасом.
- source_word: אֲשֶׁר לֹא יִכָּרֵת
  choice: который не пресечётся
  rationale: Глагол כרת буквально связан с отсечением; «не пресечётся» естественно передаёт непрерывность завета и сохраняет образность исходного выражения.
- source_word: וּלְזַרְעוֹ
  choice: ни для него, ни для его потомства
  rationale: זרע в родословном контексте означает потомство; повтор отрицательной конструкции нужен для ясного и естественного русского синтаксиса.
- source_word: כִּימֵי שָׁמָיִם
  choice: доколе существуют небеса
  rationale: Идиома обозначает продолжительность, равную дням небес; перевод ясно передаёт длительность, сохраняя небесный образ.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и существенно отличающейся греческой параллели
  choice: Основной текст переведён по еврейскому чтению о Шимоне и завете Пинхаса; разночтение вынесено в сноску.
  alternative: «Да вверит Он нам Свою милость и во дни его да избавит нас».
  rationale: Там, где еврейский текст Сираха сохранился с высокой степенью надёжности, он имеет первенство. Греческий текст, вероятно, отражает иную Vorlage или свободную передачу и потому не должен подменять еврейское чтение, но его существенное отличие необходимо отметить.
- issue: Смысл вечности завета Пинхаса
  choice: Сохранён образ продолжения завета для Шимона и его потомства, пока существуют небеса.
  alternative: Обобщить как «вечный завет».
  rationale: Развёрнутый образ еврейского текста передаёт обещанную длительность, не превращая его в более абстрактную догматическую формулу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным строем. Формы «да пребудет», «да утвердит» и «доколе» поддерживают достоинство библейского регистра, оставаясь понятными современному читателю. Имена переданы как Шимон и Пинхас в соответствии с транслитерацией еврейских форм.
