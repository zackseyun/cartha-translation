  text: И песнь подала голос[a], и над множеством они расположили его светильник.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции: «И псалмопевцы восхваляли своими голосами; в переполненном доме мелодия звучала сладостно». Это указывает на то, что второе полустишие еврейского текста, возможно, повреждено или дошло в иной редакции.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתֵּן הַשִּׁיר קוֹלוֹ
  choice: И песнь возвысила свой голос
  rationale: Сочетание נתן с קול означает издать или возвысить голос. Формулировка сохраняет олицетворение песни и близка к еврейскому синтаксису, оставаясь естественной по-русски.
- source_word: וְעַל הֲמּוֹן
  choice: и над множеством
  rationale: Предлог על передаётся пространственным «над», а המון — как «множество». Это сохраняет образ исходного текста и не устраняет неясность трудной строки.
- source_word: הֶעֱרִיכוּ
  choice: они установили
  rationale: Порода hifil глагола ערך означает располагать, устраивать, устанавливать в порядке. «Установили» естественно сочетается со светильником, не добавляя отсутствующей в тексте конкретики.
- source_word: נֵרוֹ
  choice: его светильник
  rationale: נר обычно обозначает светильник, а суффикс мужского рода единственного числа — «его». Референт местоимения остаётся неопределённым, как и в сохранившемся еврейском тексте.
theological_decisions:
- issue: Выбор основного свидетельства при трудном втором полустишии
  choice: Основной текст переведён непосредственно с сохранившегося еврейского, а существенно отличающееся греческое чтение вынесено в примечание.
  alternative: 'Перевести по греческому: «И псалмопевцы восхваляли своими голосами; в переполненном доме мелодия звучала сладостно».'
  rationale: Еврейский текст засвидетельствован, поэтому он положен в основу, хотя второе полустишие неясно и заметно расходится с греческой традицией. Примечание честно сохраняет текстологическую неопределённость, не подменяя еврейское чтение более гладким греческим.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным литургическим звучанием. Необычный образ «песнь возвысила свой голос» намеренно сохраняет поэтику еврейского текста; неясность местоимения в выражении «его светильник» не устранена толкованием.
