translation:
  language: ru
  text: Два народа отвратительны душе моей, а третий — не народ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «а третий — не нация». В еврейском тексте здесь стоит «народ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנֵי גוֹיִם
  choice: два народа
  rationale: Предлог ב при последующем глаголе отвращения обозначает объект чувства; по-русски это естественно выражается конструкцией «два народа отвратительны». Существительное גוֹיִם передано как «народы».
- source_word: קָצָה נַפְשִׁי
  choice: отвратительны душе моей
  rationale: Оборот сохраняет явно названную в еврейском тексте «душу» и передаёт сильное чувство отвращения. Инверсия поддерживает поэтический, достоинственный строй фразы без архаизации.
- source_word: וְהַשְּׁלִישִׁית
  choice: а третий
  rationale: Порядковое числительное указывает на третью общность. В русском род согласован с подразумеваемым словом «народ»; союз «а» естественно передаёт риторический переход и усиление.
- source_word: אִינֶנּוּ עָם
  choice: и не народ
  rationale: Еврейское עָם означает «народ». Частица «и» в конструкции «и не народ» передаёт усиленную риторическую оценку; тире восполняет опущенную связку.
theological_decisions:
- issue: Сохранять ли антропологическую идиому «душа моя»
  choice: 'Сохранить прямое упоминание души: «отвратительны душе моей»'
  alternative: «два народа мне отвратительны»
  rationale: В еврейском тексте прямо стоит נַפְשִׁי, и греческая параллель также сохраняет ψυχή μου. Такое прочтение удерживает поэтическую образность, не превращая идиому в отдельное догматическое утверждение.
- issue: Передавать ли финальное עָם как «народ» или вслед за греческим как «племя/нация»
  choice: «народ» в основном тексте
  alternative: «не племя» или «не нация» по греческой параллели
  rationale: Сохранившийся еврейский текст имеет высокий уровень достоверности и потому определяет основной перевод. Вариант греческой параллели отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим ритмом. Сохранены резкость высказывания и образ «души», но устранена неестественная для русского буквальность конструкции с предлогом ב.
