base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/019.yaml
  text: And all the people of the land cried out in prayer before the Merciful One[b][a], until he finished ministering at the altar and his ordinances reached completion.
translation:
  language: ru
  text: И весь народ страны воскликнул в молитве пред Милосердным[a], пока он не окончил служение у жертвенника и не исполнил положенное ему[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в молитве пред Милосердным». В греческом тексте: «народ Господа Всевышнего… в молитве пред Милосердным».'
    reason: textual_variant
  - marker: b
    text: 'Еврейская заключительная фраза трудна; буквально: «и его установления достигли его». Возможный смысл: «и он исполнил положенное ему». Греческий текст передаёт заключение иначе: «пока не завершилось убранство (или служение) Господа и они не окончили Его богослужение».'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרֹנּוּ
  choice: возгласил
  rationale: Глагол רנן обозначает громкий, звучный возглас, иногда радостный; в сочетании с молитвой «возгласил молитву» передаёт совместное громкое моление, не утверждая непременно, что народ пел.
- source_word: כָּל עַם הָאָרֶץ
  choice: весь народ страны
  rationale: Сохранено указание на народ данной земли, то есть собравшееся население, а не на всё человечество.
- source_word: בִּתְפִלָּה
  choice: молитву
  rationale: В русском сочетание «возгласил молитву» естественнее буквального «возгласил в молитве» и сохраняет литургический контекст.
- source_word: לִפְנֵי רַחוּם
  choice: пред Милосердным
  rationale: Рַחוּם употреблено как божественный титул без существительного «Бог»; субстантивированное прилагательное сохраняет эту форму и звучит торжественно.
- source_word: עַד כַּלּוֹתוֹ לְשָׁרֵת מִזְבֵּחַ
  choice: пока он не окончил служение у жертвенника
  rationale: Инфинитив с местоименным суффиксом указывает на завершение священнического действия; «служение у жертвенника» естественно передаёт культовое значение שרת.
- source_word: וּמִשְׁפָּטָיו הִגִּיעַ אֵלָיו
  choice: и не довёл до конца все предписанные обряды
  rationale: Трудная еврейская фраза в данном культовом контексте относится к исполнению положенного порядка служения. Перевод передаёт завершённость обряда, подтверждаемую греческим параллельным текстом, не используя неестественную русскую персонификацию установлений.
theological_decisions:
- issue: Божественный титул רַחוּם
  choice: Милосердный
  alternative: милосердный Бог; Сострадательный
  rationale: Исходный текст называет Бога эпитетом и не добавляет слова «Бог»; перевод сохраняет акцент на милосердии и не вносит отсутствующее существительное.
- issue: Субъект завершения служения
  choice: он — служащий у жертвенника священник
  alternative: служение Господа было завершено общиной
  rationale: Еврейский текст в единственном числе естественно продолжает описание действий первосвященника; греческий текст иначе формулирует заключительную часть, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Пред» и «жертвенник» поддерживают сакральный регистр, оставаясь понятными. Все сноски обозначены в основном тексте.
