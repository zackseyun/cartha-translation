base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/012.yaml
  text: When he received the portions from the hand of his brothers[a], and he stood at his arrangement, around him was a crown of sons, like saplings of cedars in Lebanon[b]; and they surrounded him like willows by a stream—all the sons of Aaron in their splendor.
translation:
  language: ru
  text: Когда он принимал части жертвы из рук своих братьев[a] и стоял у разложенных по порядку частей[b], вокруг него был венец из сынов, словно молодые кедры на Ливане; и окружали они его, как ивы у потока, — все сыны Аарона в своём великолепии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «из рук священников»; в еврейском: «из рук своих братьев». По контексту речь идёт о его собратьях-священниках.'
    reason: alternative_reading
  - marker: b
    text: 'Еврейское выражение неясно и буквально связано с тем, что разложено или расположено по порядку. Греческий текст уточняет сцену: он стоял у очага жертвенника.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּקַבְּלוֹ נְתָחִים
  choice: Когда он принимал части жертвы
  rationale: Инфинитивная конструкция задаёт временное обстоятельство. נְתָחִים — разделанные части; добавление «жертвы» естественно передаёт несомненный культовый контекст, не уточняя вид жертвы.
- source_word: מִיַּד אֶחָיו
  choice: из рук своих братьев
  rationale: Сохранено еврейское чтение «братьев»; множественное «из рук» естественно по-русски для нескольких участников. Из контекста видно, что речь о собратьях-священниках.
- source_word: נִצָּב עַל מַעֲרָכוֹת
  choice: стоял у сложенных рядов
  rationale: Фраза в еврейском тексте трудна. מַעֲרָכוֹת обозначает нечто разложенное или уложенное по порядку; «у сложенных рядов» сохраняет предметную и культовую неоднозначность. Греческий параллельный текст помещает первосвященника у очага жертвенника, но это пояснение не внесено прямо в основной текст.
- source_word: עֲטֶרֶת בָּנִים
  choice: венец сынов
  rationale: Сохранены зрительная метафора венца и явное мужское обозначение; далее эти лица названы сынами Аарона.
- source_word: כִּשְׁתִילֵי אֲרָזִים בַּלְּבָנוֹן
  choice: словно молодые кедры на Ливане
  rationale: שְׁתִילֵי указывает на молодые посадки или побеги. «Молодые кедры» звучит естественно и поэтично; для горной области по-русски идиоматично «на Ливане».
- source_word: בְּעַרְבֵי נָחַל
  choice: как ивы у потока
  rationale: Передан традиционный образ влаголюбивых ив возле водного потока.
- source_word: בִּכְבוֹדָם
  choice: в своём великолепии
  rationale: Передаёт торжественный вид и почётное достоинство сынов Аарона в данном описании.
theological_decisions:
- issue: Кого обозначают «его братья»
  choice: В основном тексте сохранено «своих братьев».
  alternative: «из рук священников»
  rationale: Еврейский свидетель прямо читает «его братьев», тогда как греческий — «священников». Последующий контекст отождествляет окружающих с сынами Аарона, поэтому священнический смысл отмечен в сноске, но не подменяет еврейское чтение.
- issue: Значение трудной фразы עַל מַעֲרָכוֹת
  choice: «у сложенных рядов»
  alternative: «у очага жертвенника»; «при своём порядке служения»; «над разложенными частями»
  rationale: Еврейская фраза допускает несколько толкований, связанных с расположением или порядком. Греческий текст яснее указывает на очаг жертвенника, однако перевод не должен безоговорочно заменять этим уточнением сохранившееся неоднозначное еврейское выражение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Поэтические параллели сохранены; культовая неясность еврейского текста не устранена молча.
