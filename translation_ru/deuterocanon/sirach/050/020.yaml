base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/020.yaml
  text: Then he came down and lifted up his hands over all the assembly of Israel[a], to give the blessing of Yahweh with his lips[b], and to glory in the name of Yahweh.
translation:
  language: ru
  text: Тогда он сошёл и поднял руки над всем собранием Израиля. Благословение Яхве было на его устах[a], и именем Яхве он величался[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально: «и благословение Яхве — на (или: в) его устах». Греческий параллельный текст понимает фразу как выражение цели: «чтобы устами преподать благословение».'
    reason: alternative_reading
  - marker: b
    text: 'Также возможно: «ликовал именем Яхве» или «хвалился именем Яхве». Глагол может обозначать величание, торжество или похвальбу; греческий параллельный текст употребляет столь же многозначное слово.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַד
  choice: сошёл
  rationale: Передаёт движение вниз и естественно звучит в повествовании о первосвященнике, сходящем после священнодействия.
- source_word: וְנָשָׂא יָדָיו
  choice: и поднял руки
  rationale: Точно передаёт устойчивый жест благословения или молитвы, оставаясь понятным современному читателю.
- source_word: קְהַל יִשְׂרָאֵל
  choice: всем собранием Израиля
  rationale: «Собрание» сохраняет общественный и богослужебный смысл קהל без излишне конфессиональной окраски.
- source_word: וּבִרְכַּת יְהֹוָה בִּשְׂפָתָיו
  choice: Благословение Яхве было на его устах
  rationale: Передаёт дошедшую еврейскую именную конструкцию без молчаливого добавления цели или действия; связка «было» необходима по-русски и отмечена как подразумеваемая.
- source_word: וּבְשֵׁם יְהֹוָה
  choice: и именем Яхве
  rationale: Творительный падеж естественно выражает основание или предмет хвалы и сохраняет связь с Божьим именем.
- source_word: הִתְפָּאֵר
  choice: хвалился
  rationale: Сохраняет значение возвышения, гордости или похвалы, подтверждаемое греческим καυχᾶσθαι, не устраняя возможного смыслового напряжения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Передано личное заветное имя, непосредственно стоящее в еврейском тексте, а не заменяющий его титул.
- issue: Синтаксис וּבִרְכַּת יְהֹוָה בִּשְׂפָתָיו
  choice: Благословение Яхве было на его устах
  alternative: чтобы устами преподать благословение Яхве
  rationale: Основной текст следует сохранившейся еврейской именной фразе; греческий параллельный текст явно понимает её как цель действия, поэтому этот вариант указан в примечании.
- issue: Смысл הִתְפָּאֵר
  choice: хвалился
  alternative: ликовал / величался
  rationale: Форма допускает оттенки похвалы, гордости и торжества; выбранное слово ближе всего к еврейскому глаголу и греческому καυχᾶσθαι, а неоднозначность отмечена.
translation_notes:
  register: Современный литературный русский с достоинством богослужебного повествования. Синтаксис остаётся близким к еврейскому, но не архаичным; неоднозначность именной фразы и заключительного глагола сохранена и пояснена в примечаниях.
