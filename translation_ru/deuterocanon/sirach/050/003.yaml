lexical_decisions:
- source_word: אֲשֶׁר בְּיָמָיו
  choice: При нём
  rationale: Естественно передаёт временную формулу «в его дни» применительно к периоду служения первосвященника.
- source_word: נִבְנָה
  choice: была построена
  rationale: Точно передаёт пассивную форму глагола בנה; значение «восстановлена» контекстуально возможно, но прямо не выражено.
- source_word: קִיר / פִּנּוֹת
  choice: стена с угловыми укреплениями
  rationale: קיר означает «стена», а трудное פנות — буквально «углы». Формулировка сохраняет архитектурный смысл, не утверждая более конкретно, что речь непременно идёт о башнях.
- source_word: מָעוֹן
  choice: обитель
  rationale: Передаёт значение жилища или места пребывания и сохраняет возвышенный архитектурный регистр строки.
- source_word: כְּהֵיכַל מֶלֶךְ
  choice: подобная царскому дворцу
  rationale: Сочетание היכל с מלך естественно означает царский дворец; «подобная» ясно передаёт сравнительную частицу כ־.
- source_word: ἐν ἡμέραις αὐτοῦ ἠλαττώθη ἀποδοχεῖον ὑδάτων, χαλκὸς ὡσεὶ θαλάσσης τὸ περίμετρον
  choice: учтено как разночтение, но не принято в основной текст
  rationale: Греческий текст существенно расходится с сохранившимся еврейским и, вероятно, отражает иной Vorlage либо повреждение одной из традиций.
