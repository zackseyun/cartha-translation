lexical_decisions:
- source_word: כִּכְלִי זָהָב
  choice: как золотой сосуд
  rationale: Предлог כְּ передаёт сравнение, а כְּלִי обозначает сосуд или искусно изготовленный предмет. «Золотой сосуд» сохраняет конкретный поэтический образ.
- source_word: מְפֻתָּח
  choice: с гравировкой
  rationale: Причастие указывает на обработку резьбой или иным декоративным способом. «С гравировкой» естественно передаёт искусную отделку металла, не уточняя технику сверх исходного текста.
- source_word: וְאַנְטִיל
  choice: и сурьмой
  rationale: Значение редкого еврейского слова неясно; возможно, речь идёт о сурьме либо о декоративной вставке или отделке. В основном тексте сохранено вероятное предметное значение, а неопределённость отмечена в сноске.
- source_word: הַנֶּאֱחָז
  choice: закреплённый
  rationale: Форма нифаля выражает состояние удерживаемого или прикреплённого предмета. «Закреплённый» сохраняет образ крепления, не навязывая конкретной ювелирной техники.
- source_word: עַל אַבְנֵי חֵפֶץ
  choice: на драгоценных камнях
  rationale: Буквально говорится о «желанных» или ценных камнях; греческое παράллельное чтение также подтверждает смысл драгоценных камней.
