translation:
  language: ru
  text: пока не завершил служение у жертвенника и не расположил по порядку жертвенные приготовления Всевышнего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «чтобы привести в порядок приношение Всевышнего Вседержителя». Еврейский текст выражен короче: «расположить по порядку приготовления (или расположения) Всевышнего».'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד כַּלּוֹתוֹ
  choice: пока не завершил
  rationale: Оборот с עַד и инфинитивом от כלה обозначает предел предшествующего действия; такая передача естественна по-русски и сохраняет временное значение.
- source_word: לְשָׁרֵת
  choice: служение
  rationale: В священническом контексте שרת означает совершение богослужебного служения, а не обычную работу.
- source_word: מִזְבֵּחַ
  choice: жертвенника
  rationale: Обычная и точная передача מזבח в контексте жертвоприношений.
- source_word: וּלְסַדֵּר
  choice: и не расположил по порядку
  rationale: סדר означает располагать или приводить в порядок; формулировка передаёт конкретное упорядочивание предметов и согласуется с конструкцией после עַד.
- source_word: מַעַרְכוֹת
  choice: всё
  rationale: Еврейское множественное число обозначает расположенные по порядку совокупности, но не называет их прямо. Местоименная передача в сочетании «расположил по порядку всё» сохраняет эту предметную неопределённость и звучит естественнее буквальных «порядки» или «расположения».
- source_word: עֶלְיוֹן
  choice: Всевышнего
  rationale: Устоявшаяся русская передача божественного титула עֶלְיוֹן.
theological_decisions:
- issue: Насколько конкретно передавать культовый объект מַעַרְכוֹת с учётом греческого προσφοράν
  choice: 'Сохранить в основном тексте неопределённость еврейского выражения: «расположил по порядку всё для Всевышнего»'
  alternative: «привёл в порядок приношение Всевышнего Вседержителя»
  rationale: Сохранившийся еврейский текст имеет первенство и употребляет более широкое множественное מַעַרְכוֹת, тогда как греческий текст конкретизирует его как «приношение» и добавляет титул «Вседержитель». Основной текст не должен без необходимости устранять различие между свидетелями; греческое чтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством богослужебного контекста. «Служение у жертвенника» естественно передаёт священническую деятельность, а формула «всё для Всевышнего» намеренно сохраняет лаконичность и предметную неопределённость еврейского текста.
