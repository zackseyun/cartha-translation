  source_fidelity: Основная передача верно отражает временную границу, служение при жертвеннике и упорядочивание культового предмета. Однако «всё для Всевышнего» неоправданно превращает множественное, хотя и эллиптическое, מַעַרְכוֹת в неограниченное «всё» и несколько смещает конструкцию «расположения/устройства Всевышнего» к целевому значению «для».
  naturalness: «Пока не завершил служение у жертвенника» литературно понятно в контексте продолжающегося описания. Более конкретное «жертвенные приготовления» естественно по-русски и соответствует культовому контексту, не вынуждая выбирать между отдельными видами приношений.
  terminology: «Жертвенник» и «Всевышний» точны и уместны. «Жертвенные приготовления» передаёт מַעַרְכוֹת как множественные упорядоченные культовые устройства/расположения, не сводя их безоговорочно к греческому единственному «приношению». В сноске следует точнее представить греческую формулировку, включая «Вседержителя».
