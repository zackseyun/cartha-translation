translation:
  language: ru
  text: Блажен человек, который размышляет обо всём этом[a]; кто принимает всё это к сердцу, тот станет мудрым.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Счастлив человек». Еврейское אַשְׁרֵי и греческое μακάριος допускают перевод «счастлив», однако «блажен» лучше сохраняет характер изречения мудрости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Сохраняет традиционную форму библейского изречения о благополучии человека перед Богом и передаёт больше, чем эмоциональное «счастлив»; соответствует также греческому μακάριος.
- source_word: אִישׁ
  choice: человек
  rationale: В данном изречении грамматически мужское אִישׁ обозначает отдельного человека в обобщённом смысле; русское «человек» точно и естественно передаёт эту функцию.
- source_word: בְּאֵלֶּה יֶהְגֶּה
  choice: размышляет обо всём этом
  rationale: Глагол הגה здесь означает сосредоточенное обдумывание; сочетание с בְּאֵלֶּה естественно передаётся по-русски как «размышляет обо всём этом».
- source_word: וְנוֹתֵן עַל לִבּוֹ
  choice: принимает это близко к сердцу
  rationale: Естественно передаёт еврейский образ внимательного внутреннего усвоения. Местоимение «это» восстанавливает объект из первой части; такую связь подтверждает греческое αὐτά.
- source_word: יֶחְכָּם
  choice: станет мудрым
  rationale: Передаёт значение приобретения мудрости, не навязывая возможный пассивный оттенок греческого σοφισθήσεται вопреки более ясному еврейскому чтению.
theological_decisions:
- issue: Обобщённое мужское обозначение в изречении мудрости
  choice: человек
  alternative: муж; тот
  rationale: Еврейское אִישׁ имеет форму мужского рода, но здесь служит обобщённым обозначением человека. Русское «человек» сохраняет и грамматическую форму мужского рода, и универсальный смысл без искусственного ограничения мужчинами.
- issue: Соотношение еврейского текста и греческой параллели
  choice: Еврейский текст принят за основу; греческий использован для подтверждения подразумеваемого объекта «это»
  alternative: 'Буквально оставить объект невыраженным: «и полагающий на сердце станет мудрым»'
  rationale: Сохранившийся еврейский свидетель имеет приоритет. Греческое αὐτά подтверждает естественную отсылку ко всему ранее сказанному и позволяет ясно выразить её по-русски без добавления нового смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Синтаксический параллелизм сделан ясным посредством конструкции «кто… тот…»; точка с запятой предотвращает ошибочное прочтение второй части как отдельного, не связанного с первой утверждения.
