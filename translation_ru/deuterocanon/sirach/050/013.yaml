lexical_decisions:
- source_word: וְאִשֵּׁי יְהֹוָה
  choice: и огненные жертвы Господу
  rationale: אִשֵּׁי обозначает жертвы, приносимые на огне. Дательный «Господу» естественно передаёт принадлежность и посвящение жертв, не создавая впечатления, будто речь идёт о жертвах, принадлежащих Самому Господу.
- source_word: בְּיָדָם
  choice: были в их руках
  rationale: Буквальная и естественная передача, сохраняющая конкретный образ священников, держащих жертвы.
- source_word: נֶגֶד
  choice: перед
  rationale: В данном богослужебном контексте выражает совершение действия на виду у всего собрания.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: всем собранием Израиля
  rationale: «Собрание» точно и естественно передаёт קהל как общину, собравшуюся для богослужения.
theological_decisions:
- issue: Степень конкретности жертвенного термина אִשֵּׁי
  choice: огненные жертвы Господу
  alternative: приношения Господу
  rationale: Еврейский текст конкретно указывает на жертвы, связанные с огнём, тогда как греческий параллельный текст использует более общее προσφορά. Поскольку еврейское свидетельство здесь уверенное, его более точное значение сохранено в основном тексте, а более широкое греческое чтение отмечено в сноске.
- issue: Передача тетраграмматона יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционная русская библейская передача «Господь» сохраняет достоинство регистра; форма исходного имени указана в сноске вместе с лексическим пояснением.
translation_notes:
  register: Современный литературный русский язык с торжественным богослужебным оттенком. Синтаксис близок к еврейскому, но естественен по-русски; союз «и» сохранён, поскольку стих продолжает предыдущее описание.
