base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/027.yaml
  text: Instruction in understanding and mastery of expression[a], by Shimon son of Yeshua, son of Eleazar son of Sira, who poured forth wisdom from his heart[b].
translation:
  language: ru
  text: Наставление в разумении и мастерстве речи[a], составленное Шимоном, сыном Иешуа, сыном Элеазара, сыном Сиры, который излил мудрость, исходившую из его сердца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение, переданное словами «мастерство речи» (וּמוֹשֵׁל אוֹפַנִּים), трудно для понимания. Возможно, речь идёт об умении упорядоченно выражать мысль или строить произведение; точный оттенок неясен.
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст заключительной части стиха не вполне ясен. Греческий параллельный текст гласит: «который излил мудрость из своего сердца»; это чтение положено в основу перевода.'
    reason: textual_variant
lexical_decisions:
- source_word: מוּסַר שֵׂכֶל
  choice: наставление в разумении
  rationale: מוּסַר обозначает формирующее наставление, а שֵׂכֶל — разумение или рассудительность. Такое сочетание естественно звучит как заглавие или заключительная авторская приписка.
- source_word: וּמוֹשֵׁל אוֹפַנִּים
  choice: и мастерстве речи
  rationale: Трудное еврейское выражение, вероятно, указывает на умение упорядоченно выражать мысль или строить речь. Перевод передаёт наиболее вероятный смысл, не воспроизводя буквально неясные «обороты» или «колёса».
- source_word: לְשִׁמְעוֹן
  choice: Шимона
  rationale: В контексте приписки предлог לְ, вероятнее всего, обозначает авторство или принадлежность. Русская родительная конструкция передаёт это без добавления отсутствующего в тексте глагола.
- source_word: נִיבַּע / הִבִּיעַ
  choice: излил
  rationale: Глаголы создают образ обильного истечения или изречения. «Излил» сохраняет образность и согласуется с греческим ἀνώμβρησεν.
- source_word: בִּתְבוּנוֹת; Greek σοφίαν
  choice: мудрость
  rationale: Еврейское чтение заключительной части неустойчиво, тогда как греческая параллель ясно говорит о мудрости; поэтому в основном тексте принято гречески засвидетельствованное значение.
- source_word: Greek ἀπὸ καρδίας αὐτοῦ
  choice: из своего сердца
  rationale: Это ясное чтение греческой параллели служит опорой там, где составной текст еврейских рукописей труден и не даёт надёжного буквального смысла.
