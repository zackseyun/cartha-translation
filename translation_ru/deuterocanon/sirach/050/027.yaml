revisions:
- from: Наставление в разумении и мастерстве речи[a] Шимона, сына Иешуа, сына Элеазара, сына Сиры, который излил мудрость из своего сердца[b].
  to: Наставление в разумении и мастерстве речи[a], составленное Шимоном, сыном Иешуа, сыном Элеазара, сыном Сиры, который излил мудрость, исходившую из его сердца[b].
  rationale: Редакция не меняет принятого гречески направляемого решения для трудной заключительной части и не устраняет отмеченную в примечании неопределённость трудного еврейского выражения. «Составленное Шимоном» естественно передаёт атрибутивную функцию לְשִׁמְעוֹן, а «мудрость, исходившую из его сердца» сохраняет смысл «мудрость от/из его сердца» в естественном русском синтаксисе.
  reviewer_model: gpt-5.6-terra
