  text: All flesh together hurried, and they fell on their faces to the ground, to bow down before the Most High, before the Holy One of Israel.
translation:
  language: ru
  text: Все вместе поспешили и пали ниц на землю, чтобы поклониться перед Всевышним, перед Святым Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל בָּשָׂר
  choice: все
  rationale: Буквально «всякая плоть»; в данном повествовательном контексте это собирательное обозначение всех присутствующих людей. Естественное русское «все» передаёт смысл без неуместного акцента на телесности.
- source_word: יַחְדָּו נִמְהָרוּ
  choice: вместе поспешили
  rationale: יַחְדָּו означает совместность действия, а נִמְהָרוּ — поспешное, быстрое движение; порядок слов сделан естественным для русского языка.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם אָרְצָה
  choice: и пали ниц на землю
  rationale: Устойчивое русское выражение «пасть ниц» точно передаёт падение лицом к земле как жест поклонения.
- source_word: לְהִשְׁתַּחֲוֹת
  choice: чтобы поклониться
  rationale: Инфинитив выражает цель предыдущего действия; «поклониться» сохраняет культовый смысл.
- source_word: עֶלְיוֹן
  choice: Всевышним
  rationale: Традиционное и понятное русское соответствие божественному титулу «Высочайший».
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святым Израиля
  rationale: Формально сохраняет устойчивый библейский титул Бога и его связь с Израилем.
theological_decisions:
- issue: Соотношение титулов עֶלְיוֹן и קְדוֹשׁ יִשְׂרָאֵל
  choice: перед Всевышним, перед Святым Израиля
  alternative: перед Всевышним, Святым Израиля
  rationale: Повтор предлога לִפְנֵי сохранён, чтобы воспроизвести параллелизм еврейского текста и не сводить два титула к простой пояснительной конструкции.
- issue: Расширенное чтение греческой версии
  choice: не включать «Господу их, Вседержителю Богу»
  alternative: поклониться Господу их, Вседержителю Богу Всевышнему
  rationale: Основой служит высокоуверенный еврейский текст, где этих дополнительных титулов нет; греческая версия учитывается как параллель, но её расширение не вносится в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и ритмичный; архаизирующее «пали ниц» сохранено как широко понятное устойчивое выражение. Маркеры сносок не требуются.
