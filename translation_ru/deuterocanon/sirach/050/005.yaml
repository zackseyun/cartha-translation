    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נֶהְדַּר
  choice: Как величествен был он
  rationale: Восклицательное מַה с נהדר выражает восхищение внушительным, славным обликом. «Величествен» естественно передаёт зрительное великолепие и достоинство первосвященника.
- source_word: בְּהַשְׁגִּיחוֹ
  choice: когда выглядывал
  rationale: Форма от שׁגח / השגיח обозначает выглядывание или взгляд наружу. Перевод остаётся близким к еврейскому и сохраняет параллелизм с последующим «когда выходил».
- source_word: מֵאֹהֶל
  choice: из шатра
  rationale: אֹהֶל буквально означает «шатёр». Сохранение этого слова передаёт унаследованную образность скинии в контексте храмового богослужения, не подменяя её словом «храм».
- source_word: וּבְצֵאתוֹ
  choice: когда выходил
  rationale: Естественно передаёт временное значение инфинитивной конструкции и её параллель с первой строкой.
- source_word: מִבֵּית הַפָּרֹכֶת
  choice: из дома завесы
  rationale: Формально передаёт сочетание בֵּית הַפָּרֹכֶת и не добавляет отсутствующего в тексте пространственного толкования «из-за завесы». Необычная храмовая формулировка сохраняется как образ исходного текста.
theological_decisions:
- issue: Сочетание образов шатра и храмового дома с завесой
  choice: Сохранить «шатёр» и «дом завесы» как разные образы святилища
  alternative: Свести оба выражения к «святилищу» или «храму»
  rationale: Еврейский текст сочетает אֹהֶל и בֵּית הַפָּרֹכֶת, вероятно используя лексику скинии применительно к храмовому служению. Гармонизация устранила бы эту значимую напряжённость образов.
- issue: Разночтение первой половины стиха в греческом параллельном тексте
  choice: Следовать засвидетельствованному еврейскому чтению и отметить греческий вариант
  alternative: 'Перевести по-гречески: «как он был прославлен при обходе народа»'
  rationale: Еврейское свидетельство задано как основное и имеет высокую степень уверенности, однако заметно отличающееся греческое чтение представляет подлинную текстологическую альтернативу и потому вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным регистром. Синтаксический параллелизм двух временных придаточных сохранён; необычная культовая образность не сглажена.
