base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/050/001.yaml
  text: Simon son of Yohanan the priest was the glory of his brothers and the splendor of his people[a]; in his generation the house was repaired[b], and in his days the temple was strengthened.
translation:
  language: ru
  text: Велик среди своих братьев и слава своего народа — священник Симон, сын Иоханана[a]. В его поколении о Доме позаботились[b], и в его дни Храм был укреплён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Симон, сын Онии, великий священник»; этот титул обычно передают как «первосвященник». В данном еврейском тексте: «Симон, сын Иоханана, священник».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Дом был приведён в порядок» или «Дом был восстановлен». Еврейский глагол может означать, что о Доме позаботились или его привели в порядок; греческий параллельный текст конкретнее указывает на строительные, возможно кровельные, работы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדוֹל אֶחָיו
  choice: велик среди своих братьев
  rationale: Передаёт конструкцию близко к её прямому смыслу и сохраняет похвальный параллелизм, не превращая Симона в «славу братьев», что выражено в еврейском менее явно.
- source_word: וְתִפְאֶרֶת עַמּוֹ
  choice: и слава своего народа
  rationale: תִפְאֶרֶת обозначает славу, великолепие и украшение; «слава» естественно выражает здесь общественную честь и сохраняет возвышенный регистр.
- source_word: שִׁמְעוֹן בֶּן יוֹחָנָן
  choice: Симон, сын Иоханана
  rationale: «Симон» — укоренившаяся русская форма имени שִׁמְעוֹן; «Иоханан» непосредственно передаёт еврейскую форму и не отождествляет её без необходимости с русской формой «Иоанн».
- source_word: הַכֹּהֵן
  choice: священник
  rationale: Основной еврейский свидетель содержит обычное обозначение «священник», без слова «великий»; более полный греческий титул отмечен в сноске.
- source_word: בְּדוֹרוֹ
  choice: при нём
  rationale: Буквально «в его поколении». В данном повествовательном контексте естественное русское «при нём» обозначает время его служения, не утверждая, что работы выполнял лично он.
- source_word: נִפְקַד הַבָּיִת
  choice: Дом был восстановлен
  rationale: Nifal глагола פקד допускает значения «был принят во внимание, был досмотрен, о нём позаботились». Строительный контекст и греческое указание на кровельные работы поддерживают смысл ремонта или восстановления; «восстановлен» сохраняет некоторую широту.
- source_word: הַבָּיִת
  choice: Дом
  rationale: Сохранено буквальное храмовое наименование «Дом» и отличие от следующего הֵיכָל. Заглавная буква помогает современному читателю распознать указание на Дом Божий.
- source_word: חֻזַּק הֵיכָל
  choice: Храм был укреплён
  rationale: Пассив חזק прямо означает «был укреплён, сделан прочным», а הֵיכָל в контексте обозначает храм или святилище.
theological_decisions:
- issue: Титул Симона
  choice: священник
  alternative: великий священник / первосвященник
  rationale: Основной еврейский текст читает הַכֹּהֵן, «священник», тогда как греческий параллельный текст содержит ἱερεὺς ὁ μέγας, то есть «великий священник», обычно «первосвященник». Основной текст следует сохранившемуся еврейскому чтению, а значимое расхождение не скрывается и вынесено в сноску.
- issue: Характер работ над Домом
  choice: был восстановлен
  alternative: о нём позаботились / он был отремонтирован / был покрыт кровлей
  rationale: Еврейский глагол имеет более широкое значение заботы или приведения в порядок, а греческий текст конкретизирует строительное действие. Перевод не принимает греческую конкретизацию за несомненное еврейское чтение.
translation_notes:
  register: Современный литературный русский с торжественным, но ясным синтаксисом. Инверсия в первой фразе сохраняет поэтическую похвалу оригинала. «Дом» и «Храм» разграничены вслед за еврейскими הַבָּיִת и הֵיכָל; маркеры [a] и [b] включены в основной текст.
