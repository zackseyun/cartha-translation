    reason: textual_variant
lexical_decisions:
- source_word: יִתֵּן
  choice: да дарует
  rationale: В контексте благословения форма выражает пожелание, а не простое будущее; конструкция с «да» естественно передаёт это значение по-русски.
- source_word: לָכֶם
  choice: вам
  rationale: Точно передаёт косвенное дополнение во множественном числе.
- source_word: חָכְמַת לֵבָב
  choice: мудрость сердца
  rationale: Перевод следует сохранившемуся еврейскому чтению и сохраняет образ сердца как средоточия внутреннего разумения; греческое разночтение вынесено в примечание.
- source_word: וִיהִי
  choice: и да будет
  rationale: Форма продолжает благословение-пожелание; оборот «да будет» сохраняет молитвенную торжественность и остаётся понятным современному читателю.
- source_word: שָׁלוֹם
  choice: мир
  rationale: Обычное русское соответствие, которое в данном контексте охватывает согласие, благополучие и отсутствие вражды.
- source_word: בֵּינֵיכֶם
  choice: между вами
  rationale: Буквально и естественно передаёт взаимный мир среди обращённых лиц.
theological_decisions:
- issue: Выбор основного чтения при расхождении еврейского и греческого текстов
  choice: В основном тексте принято еврейское чтение «мудрость сердца».
  alternative: Греческий текст читает «радость сердца» и содержит более пространное продолжение о мире в Израиле.
  rationale: Еврейский текст стиха сохранился и имеет высокую степень достоверности, поэтому он положен в основу перевода. Значимые греческие варианты не смешиваются с ним, а отмечаются в сносках.
- issue: Прописная или строчная буква в местоимении, обозначающем Бога
  choice: Строчное «он».
  alternative: Почтительное написание «Он» с прописной буквы.
  rationale: Современная русская орфография не требует прописной буквы в таком местоимении; строчное написание не меняет богословского смысла и не привносит конфессиональной редакционной традиции.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной интонацией благословения. Конструкции «да дарует» и «да будет» сохраняют параллелизм еврейского текста; архаические слова и конфессионально маркированные обороты не используются.
