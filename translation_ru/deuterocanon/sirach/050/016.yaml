  text: And they raised a shout and made a mighty sound heard[a], to make remembrance before the Most High.
translation:
  language: ru
  text: И они возгласили и дали услышать могучий звук — в напоминание[a] пред Всевышним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для поминовения пред Всевышним». Еврейский инфинитив и греческая параллель передают богослужебный мемориальный смысл; текст не уточняет, что именно должно быть приведено на память.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרִיעוּ
  choice: возгласили
  rationale: Глагол обозначает громкий торжественный возглас или восклицание в богослужебной обстановке. «Возгласили» передаёт церемониальный характер действия, не добавляя отсутствующего в еврейском тексте указания на трубы.
- source_word: וַיַּשְׁמִיעוּ
  choice: дали прозвучать
  rationale: Каузативная форма от שמע означает «сделали слышимым, дали услышать». Такое выражение естественно по-русски и сохраняет каузативный оттенок.
- source_word: קוֹל אַדִּיר
  choice: могучему звуку
  rationale: קוֹל может означать как голос, так и звук; контекст допускает широкий смысл торжественного звукового сигнала. «Могучий» сохраняет силу определения אַדִּיר, не сводя его к одной лишь громкости.
- source_word: לְהַזְכִּיר
  choice: в напоминание
  rationale: Оборот сохраняет поминально-мемориальный смысл богослужебного действия и не вводит прямо не названный объект воспоминания.
- source_word: לִפְנֵי עֶלְיוֹן
  choice: пред Всевышним
  rationale: «Всевышний» естественно передаёт божественный титул עֶלְיוֹן, а «пред» соответствует לִפְנֵי и поддерживает возвышенный богослужебный регистр.
theological_decisions:
- issue: Богослужебный смысл памятного действия
  choice: в напоминание пред Всевышним
  alternative: как памятный знак пред Всевышним
  rationale: Еврейский инфинитив и греческая параллель выражают идею воспоминания или памятного знака в богослужении. Формулировка намеренно не уточняет, кому или о чём надлежит напомнить, поскольку исходный текст этого не разрешает.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным богослужебным оттенком. Синтаксис сохраняет параллелизм двух еврейских глаголов; сведения греческой параллели о сынах Аарона и трубах не внесены, поскольку в данном еврейском стихе они прямо не выражены.
