translation:
  language: ru
  text: как солнце, сияющее над царским дворцом[a], и как радуга, появляющаяся в облаке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой версии: «храм Всевышнего» вместо «царского дворца». Еврейское הֵיכַל может означать и дворец, и храм.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשֶׁמֶשׁ
  choice: как солнце
  rationale: Префикс כְּ вводит сравнение; этот оборот естественно продолжает поэтический ряд.
- source_word: מְשַׁקֶּרֶת
  choice: сияющее
  rationale: Необычная еврейская форма в данном контексте обозначает излучение света; греческое ἐκλάμπων подтверждает значение «сиять».
- source_word: אֶל הֵיכַל הַמֶּלֶךְ
  choice: на царский дворец
  rationale: Предлог אֶל здесь передан направленно-пространственным «на», а הֵיכַל в сочетании с «царём» допускает прямое значение «дворец». Греческое культовое чтение вынесено в примечание.
- source_word: וּכְקֶשֶׁת
  choice: и как радуга
  rationale: Хотя קֶשֶׁת также означает «лук», упоминание облака однозначно указывает здесь на радугу.
- source_word: נִרְאֲתָה
  choice: явившаяся
  rationale: Нифаль выражает появление или становление видимым; «явившаяся» сохраняет возвышенный поэтический тон.
- source_word: בֶעָנָן
  choice: в облаке
  rationale: Сохранено единственное число еврейского текста, в отличие от множественного числа греческой параллели.
theological_decisions:
- issue: Еврейское «дворец царя» и греческое «храм Всевышнего»
  choice: В основном тексте сохранено еврейское чтение «царский дворец».
  alternative: «храм Всевышнего»; также возможно понимание еврейского выражения как «храм Царя».
  rationale: Сохранившийся еврейский текст имеет приоритет и буквально допускает значение «дворец царя». Греческая версия свидетельствует о культовом понимании образа, поэтому существенное разночтение отмечено, но не подменяет основной текст.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Причастные обороты сохраняют параллелизм двух сравнений; со строчной буквы стих начинается как продолжение синтаксического ряда предыдущего контекста.
