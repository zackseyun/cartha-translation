translation:
  language: ru
  text: тот, кто заботился о своём народе, оберегая его от внезапной беды[a], и укреплял свой город перед лицом угрозы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от внезапного бедствия»; в греческом тексте — «от падения (гибели)», что также указывает на защиту от разрушения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «укреплял свой город против осады». Греческий текст яснее указывает на военную осаду, тогда как еврейское выражение может иметь более широкий смысл: угроза, бедствие или вражеское давление.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַדּוֹאֵג לְעַמּוֹ
  choice: тот, кто заботился о своём народе
  rationale: Причастие от דאג выражает деятельную, постоянную заботу. Прошедшее время естественно для русского повествовательного контекста главы, посвящённой Симону, при сохранении описательного характера еврейской формы.
- source_word: מֵחֶתֶף
  choice: оберегая его от внезапной беды
  rationale: חֶתֶף обозначает внезапный разрушительный удар или бедствие. Добавление «оберегая его» естественно передаёт защитное значение предлога מִן при глаголе заботы; «внезапной» сохраняет существенный оттенок еврейского слова.
- source_word: וּמְחַזֵּק
  choice: и укреплял
  rationale: Порода пиэль глагола חזק означает «укреплять, делать сильным» и в сочетании с городом допускает как общее укрепление, так и фортификацию.
- source_word: עִירוֹ
  choice: свой город
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит город с тем же деятелем.
- source_word: מִצָּר
  choice: перед лицом угрозы
  rationale: צַר может указывать на тесноту, бедствие, вражеское давление или противника. Формулировка сохраняет широту еврейского текста и вместе с тем подходит к контексту укрепления города; более конкретное понимание как осады вынесено в сноску.
