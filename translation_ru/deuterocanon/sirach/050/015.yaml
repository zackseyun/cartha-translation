translation:
  language: ru
  text: Тогда сыны Аарона, священники, громко трубили в кованые трубы.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь содержится более пространное описание: священник простирает руку над чашей для возлияния, изливает «кровь винограда» к основанию жертвенника как благоухание Всевышнему, Царю всего. Сохранившийся здесь еврейский текст содержит только строку о трубном возгласе.'
    reason: textual_variant
  - marker: b
    text: 'Или: «издавали громкий возглас на кованых трубах». Еврейский глагол может обозначать громкое восклицание, ликование или сигнальный звук; в данном контексте этот звук производится трубами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временную последовательность и вводит следующее богослужебное действие.
- source_word: יָרִיעוּ
  choice: громко трубили
  rationale: Глагол обозначает громкий возглас, ликование или сигнальный звук; упоминание труб показывает, что здесь речь о громком трубном звучании. Перевод сохраняет силу глагола и естественно звучит по-русски.
- source_word: בְנֵי אֲהַרֹן
  choice: сыны Аарона
  rationale: Сохраняет формальное обозначение священнического рода и возвышенный литургический регистр.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Передаёт приложение, поясняющее, кем были названные сыны Аарона.
- source_word: בַּחֲצֹצְרוֹת
  choice: в трубы
  rationale: Обозначает металлические священнические трубы храмового обряда; конструкция «трубили в трубы» естественно передаёт инструментальное значение предлога.
- source_word: מִקְשֶׁה
  choice: кованые
  rationale: Техническое обозначение изделия, сформированного ковкой или чеканкой из металла; «кованые» кратко и понятно передаёт способ изготовления.
theological_decisions:
- issue: Соотношение краткой еврейской строки и более пространного греческого параллельного текста
  choice: Основной текст переводится по сохранившемуся еврейскому свидетельству; дополнительные греческие подробности вынесены в примечание.
  alternative: Включить в основной текст греческое описание возлияния и «крови винограда».
  rationale: При наличии еврейского текста он имеет приоритет. Греческий текст описывает иное, более пространное культовое действие, отсутствующее в данной еврейской строке, поэтому смешивать свидетельства в основном тексте не следует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным литургическим оттенком. «Сыны Аарона» сохраняет традиционную родовую формулу, а «громко трубили» делает сжатый еврейский оборот понятным без введения узкотехнического термина.
