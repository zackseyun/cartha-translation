translation:
  language: ru
  text: 'как зеленеющая маслина, полная плодов[b],

    и как пышное дерево, напояющее свои ветви[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «и как кипарис, возносящийся до облаков» — вместо еврейского «и как пышное дерево, напояющее свои ветви». Здесь принят сохранившийся еврейский текст Каирской генизы.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «полная гаргар»; значение редкого еврейского слова не вполне ясно, но, вероятно, речь идёт о плодах маслины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּזַיִת רַעֲנָן
  choice: как зеленеющая маслина
  rationale: כְּ выражает сравнение; זַיִת здесь означает оливковое дерево, а רַעֲנָן передаёт свежую, пышную зелень и жизненную силу. «Зеленеющая маслина» естественно сохраняет поэтический образ.
- source_word: מָלֵא גַרְגַּר
  choice: полная плодов
  rationale: Редкое גַרְגַּר, вероятно, обозначает плоды маслины. «Плодов» яснее и естественнее по-русски, не вводя ботанически неудачное «ягод»; более конкретное значение отмечено в сноске.
- source_word: וּכְעֵץ שָׁמֵן
  choice: и как тучное дерево
  rationale: שָׁמֵן буквально выражает тучность, насыщенность и обилие; «тучное дерево» сохраняет необычный и поэтически напряжённый образ еврейского текста, не отождествляя дерево без достаточных оснований с конкретной породой.
- source_word: מְרַוֶּה עָנָף
  choice: напояющее свои ветви
  rationale: Причастие от רוה означает поить, насыщать влагой. «Напояющее свои ветви» сохраняет активную форму и метафору внутреннего изобилия; единственное עָנָף по-русски естественно передано собирательным множественным числом.
