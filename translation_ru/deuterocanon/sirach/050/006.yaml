translation:
  language: ru
  text: Словно сияющая звезда из-за облаков[a], и словно полная луна во дни праздника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «как утренняя звезда посреди облака». Еврейский текст выражается шире: «словно сияющая звезда из-за облаков».'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּכוֹכָב אוֹר
  choice: как сияющая звезда
  rationale: כְּ вводит сравнение, כוֹכָב означает «звезда», а אוֹר здесь передаёт светимость. По-русски естественное и близкое к еврейскому сочетание — «сияющая звезда».
- source_word: מִבֵּין עָבִים
  choice: среди облаков
  rationale: Сочетание מִן с בֵּין буквально указывает на появление «из среды / из-за» облаков. «Среди облаков» сохраняет образ и звучит по-русски естественно, не делая слишком сильного акцента на движении.
- source_word: וּכְיָרֵחַ מָלֵא
  choice: и как полная луна
  rationale: Сохранены союз и параллельная сравнительная конструкция; יָרֵחַ — «луна», מָלֵא — «полная».
- source_word: בִּימֵי מוֹעֵד
  choice: в дни праздника
  rationale: מוֹעֵד может обозначать назначенное время или праздник. В храмовом контексте главы и рядом с образом полной луны наиболее вероятен праздничный смысл, однако конкретный праздник не назван.
theological_decisions:
- issue: Следовать ли еврейскому образу светящейся звезды или более конкретному греческому чтению «утренняя звезда»
  choice: В основном тексте передано еврейское «сияющая звезда»
  alternative: «Как утренняя звезда среди облака»
  rationale: Сохранившийся еврейский текст имеет приоритет и говорит о свете или сиянии, не уточняя утреннее время. Греческое чтение представляет значимый древний вариант и поэтому приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с поэтической торжественностью. Сохранён параллелизм двух сравнений; формулировка понятна широкому читателю и не уточняет сверх источника ни вид звезды, ни конкретный праздник.
