  source_fidelity: 'Черновик точно передаёт заключительные два сравнения еврейского текста, хотя אֵשׁ («огонь») несколько конкретизировано как «пламя». Однако в нём пропущены первые два сравнения стиха: «как бутон среди ветвей в праздничные дни» и «как лилия у водных протоков». Кроме того, примечание ошибочно утверждает, будто греческое «как лилии у истоков вод» соответствует еврейскому образу огня ладана: образ лилии имеется и в представленном еврейском тексте.'
