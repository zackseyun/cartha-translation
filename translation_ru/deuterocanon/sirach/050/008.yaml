translation:
  language: ru
  text: как бутон среди ветвей в праздничные дни[a], как лилия у водных протоков, как цветок Ливана в летние дни и как пламя ладана на зерновом приношении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст передаёт ряд сравнений несколько иначе: «как цветок розы в дни весны … как побеги Ливана в летние дни». Сравнение с лилией у водных выходов в нём также есть, тогда как образ пламени ладана на зерновом приношении в этой последовательности отсутствует. Основной текст следует еврейскому свидетельству.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּפֶרַח
  choice: как цветок
  rationale: Предлог כְּ передаёт сравнение «как», а פֶּרַח означает цветок или цветение. «Цветок» естественно и поэтично звучит по-русски.
- source_word: לְבָנוֹן
  choice: Ливана
  rationale: 'Сопряжённое сочетание פֶּרַח לְבָנוֹן передано родительным падежом: «цветок Ливана», что сохраняет образ и его поэтическую сжатость.'
- source_word: בִּימֵי קָיִץ
  choice: в летние дни
  rationale: Передаёт и временное значение, и буквальный образ «дней лета», но звучит естественнее современного русского варианта «в дни лета».
- source_word: וּכְאֵשׁ
  choice: и как пламя
  rationale: אֵשׁ буквально означает «огонь», однако в сочетании с возжигаемым ладаном «пламя» точнее и естественнее передаёт конкретный зрительный образ.
- source_word: לְבוֹנָה
  choice: ладана
  rationale: לְבוֹנָה обозначает именно ладан, а не благовоние вообще; родительный падеж отражает связь с пламенем.
- source_word: עַל הַמִּנְחָה
  choice: на хлебном приношении
  rationale: В храмовом контексте מִנְחָה обозначает приношение из муки или зерна. Традиционно понятное «хлебное приношение» сохраняет культовую конкретность без тяжеловесного «зернового приношения».
theological_decisions:
- issue: Культовый термин מִנְחָה
  choice: хлебное приношение
  alternative: приношение; зерновое приношение
  rationale: Контекст храмового служения требует сохранить жертвенный смысл термина. «Хлебное приношение» понятно русскому читателю и указывает на неживотную жертву, не сводя её к неопределённому «приношению».
- issue: Расхождение еврейской и греческой традиций текста
  choice: В основном тексте следовать еврейскому чтению «как пламя ладана на хлебном приношении»
  alternative: 'Греческое чтение: «как лилии у истоков вод»'
  rationale: Предоставленный еврейский источник имеет высокую степень достоверности и прямо содержит культовый образ; отличающееся греческое чтение сохранено в примечании, а не согласовано с ним искусственно.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Сохранена последовательность сравнений и храмовая образность; архаизмы и узкоспециальная терминология избегаются. Маркер примечания поставлен после первой строки образа, чтобы отметить расхождение параллельной традиции, затрагивающее последующее сравнение.
