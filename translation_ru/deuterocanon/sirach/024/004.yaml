  text: Я поселилась на высотах, и престол мой был в столпе облачном.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный вариант: «в том столпе облачном». Греческий текст говорит: «в столпе облачном»; выражение, вероятно, отсылает к известному столпу облачному — знаку Божьего присутствия и водительства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσκήνωσα
  choice: поселилась
  rationale: Передаёт обустройство постоянного жилища и сохраняет образ вселения; форма женского рода согласуется с олицетворённой Премудростью в контексте главы.
- source_word: ἐν ὑψηλοῖς
  choice: на высотах
  rationale: Естественно передаёт субстантивированное множественное число со значением возвышенных, небесных мест, не усиливая его до «высочайших».
- source_word: θρόνος
  choice: престол
  rationale: Сохраняет явный царственный и возвышенный образ греческого θρόνος.
- source_word: ἐν στύλῳ νεφέλης
  choice: в столпе облачном
  rationale: Близко передаёт греческую конструкцию и сохраняет библейскую образность столпа облачного, включая вероятную отсылку к Божьему присутствию и водительству в пустыне.
theological_decisions:
- issue: Отсылка к столпу облачному во время странствия Израиля по пустыне
  choice: Сохранить выражение «в столпе облачном» без поясняющего расширения в основном тексте.
  alternative: «в том столпе облачном»
  rationale: Греческий текст употребляет существительное без артикля, но образ, вероятно, отсылает к известному столпу облачному. Перевод сохраняет эту отсылку, не превращая вероятную связь в явно утверждённое отождествление.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Инверсия «престол мой» и традиционное сочетание «столп облачный» сохраняют поэтическую и межтекстовую выразительность; пунктуация адаптирована к русской норме.
