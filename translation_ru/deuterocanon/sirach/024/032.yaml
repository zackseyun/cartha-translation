  text: I will again make instruction shine like the dawn[c][b][a], and I will bring these things to light far into the distance.
translation:
  language: ru
  text: Я ещё заставлю наставление сиять, как заря, и открою всё это далеко в даль.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я ещё озарю наставление, подобно утренней заре, и явлю это далеко». В греческом тексте после единственного числа «наставление» стоит средний род множественного числа («это»); вероятно, имеются в виду содержание или отдельные стороны наставления Премудрости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: ещё
  rationale: 'Передаёт добавочное и продолжительное значение: говорящий продолжает распространять наставление, без ненужного оттенка противопоставления.'
- source_word: παιδείαν
  choice: наставление
  rationale: В контексте Сираха слово обозначает формирующее обучение и мудрое наставление, а не только дисциплину или наказание.
- source_word: ὡς ὄρθρον
  choice: подобно заре
  rationale: Сохраняет поэтический образ раннего утреннего света и соответствует возвышенному, но понятному регистру.
- source_word: φωτιῶ
  choice: озарю
  rationale: Переходный глагол с прямым дополнением παιδείαν естественно передаётся как «озарю наставление»; световая метафора сохраняется без внесения идеи, будто наставление само является источником света.
- source_word: ἐκφανῶ
  choice: явлю
  rationale: Передаёт значение раскрытия и выведения на свет, продолжая образ освещения в первой части стиха.
- source_word: αὐτά
  choice: всё это
  rationale: Сохраняет греческое множественное указание на содержание или отдельные выражения наставления, не заменяя его необоснованно единственным числом.
- source_word: ἕως εἰς μακράν
  choice: вдали
  rationale: Кратко и естественно передаёт пространственный образ широкой, далёкой распространённости.
theological_decisions:
- issue: Референт αὐτά в речи Премудрости
  choice: «всё это» — содержание и проявления наставления
  alternative: «его» — наставление как единое целое
  rationale: Греческое αὐτά стоит во множественном числе после единственного παιδείαν. Перевод сохраняет это грамматическое напряжение и не сужает смысл до одной заранее определённой доктринальной трактовки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. Параллельные световые образы сохранены; синтаксис сделан ясным для обычного читателя.
