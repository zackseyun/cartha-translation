  text: Whoever obeys me will not be put to shame, and those who work with me will not sin.
translation:
  language: ru
  text: Кто слушается меня, тот не будет постыжен, и те, кто трудится во мне,[a] не согрешат.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со мной».'
    reason: 'ἐν ἐμοί буквально означает «во мне», но в данном сочетании может пониматься инструментально или ассоциативно: «со мной», «при моём содействии».'
lexical_decisions:
- source_word: ὁ ὑπακούων μου
  choice: кто слушается меня
  rationale: Передаёт значение ὑπακούω как послушного отклика и сохраняет личное дополнение μου.
- source_word: οὐκ αἰσχυνθήσεται
  choice: не будет постыжен
  rationale: Страдательная формулировка естественно передаёт будущее значение αἰσχυνθήσεται и допускает как внешний позор, так и переживание стыда.
- source_word: οἱ ἐργαζόμενοι
  choice: те, кто трудится
  rationale: Нейтрально и современно передаёт субстантивированное причастие, не сужая смысл до определённого вида деятельности.
- source_word: ἐν ἐμοὶ
  choice: во мне
  rationale: Формально сохраняет греческий предлог ἐν и образ пребывания или деятельности в Премудрости; более гладкое «со мной» возможно, но менее буквально.
- source_word: οὐχ ἁμαρτήσουσιν
  choice: не согрешат
  rationale: Прямо передаёт будущее время ἁμαρτάνω, сохраняя его нравственно-богословский смысл.
theological_decisions:
- issue: Связь трудящихся с олицетворённой Премудростью
  choice: во мне
  alternative: со мной
  rationale: Греческое ἐν ἐμοί буквально означает «во мне». Перевод сохраняет необычный и богословски насыщенный образ, не заменяя его более однозначным представлением о совместной деятельности.
- issue: Категоричность обещания οὐχ ἁμαρτήσουσιν
  choice: не согрешат
  alternative: не впадут в заблуждение
  rationale: Сохранено прямое утверждение исходного текста без ослабления или истолкования; контекст олицетворённой Премудрости определяет характер обещания.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис прост и общедоступен; необычное «трудится во мне» сохранено как значимая неоднозначность и пояснено сноской.
