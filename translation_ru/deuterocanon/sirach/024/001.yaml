  text: Премудрость восхвалит саму себя[a] и среди своего народа будет хвалиться[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «восхвалит свою душу»; греческое выражение в данном контексте может иметь возвратное значение: «саму себя».'
