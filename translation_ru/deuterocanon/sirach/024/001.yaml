lexical_decisions:
- source_word: Ἡ σοφία
  choice: Премудрость
  rationale: Существительное передано с прописной буквы, поскольку в этой главе Премудрость олицетворена и выступает как говорящая женская фигура.
- source_word: αἰνέσει
  choice: восхвалит
  rationale: Будущее время αἰνέω означает «хвалить, восхвалять»; выбранный глагол естественно сочетается с возвышенным, но понятным регистром.
- source_word: ψυχὴν αὐτῆς
  choice: саму себя
  rationale: Буквально выражение означает «свою душу», однако в данном контексте это рефлексивный оборот. Перевод «саму себя» ясно передаёт смысл, не создавая искусственного разграничения между Премудростью и её душой.
- source_word: ἐν μέσῳ
  choice: среди
  rationale: Естественный современный русский эквивалент, сохраняющий значение пребывания внутри сообщества.
- source_word: λαοῦ αὐτῆς
  choice: своего народа
  rationale: λαός означает «народ»; возвратное притяжательное местоимение естественно передаёт явную принадлежность к олицетворённой Премудрости.
- source_word: καυχήσεται
  choice: будет величаться
  rationale: Глагол может обозначать хвалу, торжественное превознесение или похвальбу. «Величаться» сохраняет публичный характер самопровозглашения и не навязывает однозначно отрицательной нравственной оценки.
theological_decisions:
- issue: Олицетворение Премудрости
  choice: Сохранить прописную букву и формы женского рода
  alternative: Передать слово со строчной буквы как отвлечённое качество
  rationale: Греческая грамматика и дальнейшая речь главы представляют Премудрость как олицетворённую говорящую фигуру; перевод сохраняет эту литературно-богословскую особенность, не отождествляя её с какой-либо конкретной доктринальной фигурой.
- issue: Оценка самовосхваления
  choice: Перевести καυχήσεται как «будет величаться»
  alternative: «будет хвалиться» или «будет прославляться»
  rationale: Исходный глагол допускает оттенки как торжественного превознесения, так и похвальбы. «Будет величаться» сохраняет эту напряжённость лучше, чем явно неодобрительное «хвалиться» или пассивное «прославляться».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка краткая и естественная; олицетворение и два будущих глагола исходного текста сохранены.
