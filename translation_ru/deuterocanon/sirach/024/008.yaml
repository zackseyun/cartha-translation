translation:
  language: ru
  text: 'Тогда Творец всего повелел мне, и Создавший меня установил мой шатёр[a] и сказал: «Поселись в Иакове и получи наследственный удел в Израиле[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поставил мою скинию». Греческое выражение буквально описывает установку или закрепление шатра.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «будь наделена уделом в Израиле» или «получи наследие в Израиле». Греческий глагол соединяет образы наследования и назначения удела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατό μοι
  choice: дал мне повеление
  rationale: Передаёт властное распоряжение, выраженное ἐντέλλομαι, естественным для современного русского языка оборотом.
- source_word: ὁ κτίστης ἁπάντων
  choice: Творец всего
  rationale: Сохраняет универсальный охват ἁπάντων и прямое обозначение Бога как Создателя.
- source_word: ὁ κτίσας με
  choice: Создавший меня
  rationale: Сохраняет причастную конструкцию, параллель с «Творец всего» и явное отношение олицетворённой Премудрости к её Создателю.
- source_word: κατέπηξεν τὴν σκηνήν μου
  choice: раскинул мой шатёр
  rationale: Передаёт конкретный образ установки шатра; «шатёр» звучит современно и не привносит в основной текст более узкую культовую окраску слова «скиния».
- source_word: Ἐν Ἰακὼβ κατασκήνωσον
  choice: Поселись в Иакове
  rationale: Передаёт повеление обосноваться и пребывать; имя «Иаков» сохранено как библейское собирательное обозначение народа.
- source_word: ἐν Ἰσραὴλ κατακληρονομήθητι
  choice: получи наследственный удел в Израиле
  rationale: Сочетание сохраняет одновременно образы наследия и назначенного удела, а также пассивно-рецептивный оттенок греческой формы.
theological_decisions:
- issue: Отношение олицетворённой Премудрости к Богу
  choice: Сохранить личную речь Премудрости и прямо назвать её созданной Творцом.
  alternative: Ослабить олицетворение или истолковать его через более поздние христологические категории.
  rationale: Греческий текст одновременно ярко олицетворяет Премудрость и проводит различие между ней и Создателем; перевод не должен устранять это напряжение.
- issue: Образ пребывания среди Иакова и Израиля
  choice: Сохранить конкретные образы шатра, поселения и наследственного удела.
  alternative: Заменить их отвлечённым указанием на присутствие Премудрости среди Божьего народа либо усилить культовую терминологию.
  rationale: Так сохраняется образная последовательность исходного текста без навязывания узкого конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксический параллелизм и конкретная образность греческого текста сохранены; архаизмы и излишне конфессиональная терминология исключены.
