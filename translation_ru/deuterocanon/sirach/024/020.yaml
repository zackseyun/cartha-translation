  text: For the memory of me is sweeter than honey[c][b][a], and my inheritance is sweeter than the honeycomb.
translation:
  language: ru
  text: Ведь память обо мне[a] слаще мёда, и наследие моё — слаще сотового мёда[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воспоминание обо мне»; возможно также: «памятование обо мне».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мёда воска»; выражение обычно понимают как «мёд в сотах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημόσυνόν μου
  choice: память обо мне
  rationale: μνημόσυνον может означать память, воспоминание или памятование. В поэтической речи персонифицированной Премудрости выражение «память обо мне» естественно передаёт личный объект греческого родительного μου, не превращая слово в обозначение материального памятника.
- source_word: ὑπὲρ μέλι γλυκύ
  choice: слаще мёда
  rationale: Хотя γλυκύ имеет положительную форму, сочетание с ὑπέρ выражает сравнение; по-русски оно естественно передаётся сравнительной степенью «слаще».
- source_word: κληρονομία μου
  choice: наследие моё
  rationale: κληρονομία означает наследство или наследие. «Наследие» в данном поэтическом контексте сохраняет смысл того, что Премудрость передаёт или предоставляет, не сужая его до конкретного имущества.
- source_word: μέλιτος κηροῦ
  choice: сотового мёда
  rationale: Буквально сочетание связано с мёдом и восковыми сотами и идиоматически обозначает мёд из сот. «Сотовый мёд» сохраняет образ и позволяет сравнивать сладость именно с мёдом, а не с воском или самими сотами.
theological_decisions:
- issue: Первое лицо говорящей Премудрости
  choice: Сохранить личные формы «обо мне» и «моё», представляя Премудрость говорящей о себе.
  alternative: Передать строку отвлечённо, как память или наследие мудрости без подчёркнутой персонификации.
  rationale: В контексте Сир 24 Премудрость говорит от первого лица. Перевод сохраняет эту персонификацию, не уточняя сверх текста её богословский статус.
- issue: Пропуск сказуемого во второй части
  choice: Повторить «слаще» для ясного и естественного русского синтаксиса.
  alternative: 'Оставить эллипсис: «и наследие моё — сотового мёда».'
  rationale: В греческой второй части сравнительное сказуемое подразумевается из первой. Его повторение по-русски раскрывает грамматический эллипсис, не добавляя нового смысла.
translation_notes:
  register: Современный литературный русский язык с поэтическим параллелизмом. Начальное «ведь» передаёт объяснительное γάρ; порядок «наследие моё» сохраняет возвышенную, но понятную интонацию.
