  text: Still I will pour out instruction like prophecy[c][b][a], and I will leave it for everlasting generations.
translation:
  language: ru
  text: И ещё я изолью учение, словно пророчество[a], и оставлю его для грядущих поколений во все века.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как пророчество». Греческое выражение может обозначать как сравнение, так и представление учения в качестве пророчества.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι
  choice: и ещё
  rationale: В данном контексте обозначает дальнейшее, продолжающее предшествующее действие; сочетание «и ещё» естественно передаёт эту связь и не вносит значения отсрочки.
- source_word: διδασκαλίαν
  choice: учение
  rationale: Обозначает наставление или преподаваемую мудрость. «Учение» здесь звучит естественно для литературы Премудрости, не требуя узкотехнического смысла.
- source_word: ὡς προφητείαν
  choice: словно пророчество
  rationale: «Словно» сохраняет наиболее вероятную сравнительную силу ὡς, не отождествляя учение с пророчеством; допустимое отождествляющее прочтение отмечено в сноске.
- source_word: ἐκχέω
  choice: изолью
  rationale: Форма передаёт будущее значение в связи со следующим будущим καταλείψω и сохраняет яркий образ обильного излияния.
- source_word: καταλείψω
  choice: оставлю
  rationale: Точно передаёт значение оставления чего-либо последующим поколениям; адресат, выраженный оборотом εἰς γενεάς, естественно оформлен дательным падежом.
- source_word: αὐτήν
  choice: его
  rationale: Местоимение относится к διδασκαλίαν; в русском согласуется со словом «учение» в среднем роде.
- source_word: εἰς γενεὰς αἰώνων
  choice: грядущим поколениям навеки
  rationale: Передаёт направленность наследия к поколениям и идиоматический смысл неограниченной длительности, избегая неестественного буквального «поколениям веков».
theological_decisions:
- issue: Сила оборота ὡς προφητείαν
  choice: 'сравнительное прочтение: учение изливается словно пророчество'
  alternative: 'отождествляющее прочтение: учение изливается как пророчество'
  rationale: Греческое ὡς допускает оба оттенка. Основной текст сохраняет явное сравнение и не усиливает утверждение о статусе учения, а подлинная неоднозначность отражена в сноске.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным строем. «Изолью» сохраняет библейскую метафору, а «грядущим поколениям навеки» естественно передаёт смысл греческого идиоматического оборота.
