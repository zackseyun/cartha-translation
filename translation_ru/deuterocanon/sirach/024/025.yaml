  yaml_path: translation/deuterocanon/sirach/024/025.yaml
  text: It fills with wisdom like the Pishon[d][c][b][a], and like the Tigris in the days of firstfruits.
translation:
  language: ru
  text: Он изливает мудрость, как Фисон, и, как Тигр, — во дни нового урожая.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во дни новых [плодов / вещей]»; возможны также переводы: «во время первых плодов» или «во время молодой поросли». Греческое выражение неоднозначно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιπλῶν
  choice: Он изливает
  rationale: Мужской артикль с причастием указывает на ранее названный «закон»; активный глагол сохраняет образ реки, обильно несущей свои воды. «Изливает» естественнее по-русски, чем буквальное, но неполное «наполняет» без названного объекта.
- source_word: ὡς Φισὼν
  choice: как Фисон
  rationale: Передано принятое русское библейское название реки; артикль в русском перед именем собственным не требуется.
- source_word: σοφίαν
  choice: мудрость
  rationale: Прямое и контекстуально последовательное соответствие σοφία; строчная буква не навязывает дополнительного толкования персонификации.
- source_word: ὡς Τίγρις
  choice: как Тигр
  rationale: Принятое русское название реки.
- source_word: ἐν ἡμέραις νέων
  choice: во дни нового урожая
  rationale: Субстантивированное νέων допускает понимание новых плодов или нового урожая; выбранная формулировка естественна и сохраняет сельскохозяйственный образ, а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Кто изливает мудрость
  choice: Местоимение «Он» отнесено к ранее названному закону
  alternative: Безличное «она наполняется» либо отнесение к персонифицированной Мудрости
  rationale: Форма ὁ πιπλῶν имеет мужской род и согласуется с ближайшим смысловым антецедентом νόμος («закон»); перевод не превращает грамматически мужское определение в женскую персонификацию.
- issue: Персонификация мудрости
  choice: «мудрость» со строчной буквы
  alternative: «Мудрость» с прописной буквы
  rationale: Греческая орфография не задаёт такого богословского различия; строчная буква сохраняет образ, не закрепляя спорную идентификацию.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Перестановка оборота «как Тигр» и тире делают ясным, что указание времени относится к образу Тигра; речной параллелизм сохранён.
