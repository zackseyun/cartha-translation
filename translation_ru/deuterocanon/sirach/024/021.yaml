    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐσθίοντές με
  choice: те, кто ест меня
  rationale: Субстантивированное причастие настоящего времени передано естественной русской конструкцией с общим, продолжающимся значением; местоимение «меня» сохраняет прямую метафору персонифицированной Премудрости.
- source_word: ἔτι
  choice: всё ещё
  rationale: Передаёт продолжение голода и жажды после вкушения, не добавляя прямо не выраженного в греческом «ещё больше».
- source_word: πεινάσουσιν
  choice: будут голодны
  rationale: Естественно передаёт будущую форму глагола πεινάω и сохраняет парадокс исходного образа.
- source_word: οἱ πίνοντές με
  choice: те, кто пьёт меня
  rationale: Сохраняет синтаксический параллелизм с первой частью и прямой образ питья Премудрости.
- source_word: διψήσουσιν
  choice: будут испытывать жажду
  rationale: Современное литературное выражение, точно передающее будущую форму и избегающее менее естественного сочетания «будут жаждать» без названного предмета желания.
theological_decisions:
- issue: Парадокс продолжающихся голода и жажды после вкушения Премудрости
  choice: Сохранить буквальные образы голода и жажды в основном тексте.
  alternative: «Будут желать ещё» или «будут голодать и жаждать ещё больше».
  rationale: Греческий текст прямо говорит, что вкушающие по-прежнему будут голодны и испытывать жажду. Возможный смысл — возрастающее стремление к Премудрости — пояснён в сноске, но не подставлен вместо намеренно напряжённой метафоры.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным ритмом. Синтаксический параллелизм греческого текста сохранён; метафора не истолкована в основном тексте.
