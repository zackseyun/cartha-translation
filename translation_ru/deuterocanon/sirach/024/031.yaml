base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/031.yaml
  text: I said[a], ‘I will water my garden, and I will drench my garden bed.’ And behold, my channel became a river[c][b], and my river became a sea.
translation:
  language: ru
  text: 'Я сказала: «Полью свой сад и напою влагой свою грядку[a]». И вот, мой оросительный канал превратился в реку, а моя река — в море.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возделанный участок». Греческое слово обозначает садовую гряду или участок зелени, не обязательно цветник.'
    reason: lexical_alternative
  - marker: b
    text: 'Образ последовательно возрастает: небольшой оросительный канал становится рекой, а река — морем.'
    reason: literary_note
lexical_decisions:
- source_word: εἶπα
  choice: Я сказала
  rationale: Аорист означает «я сказал(а)». В русском требуется указать род; в контексте говорит Премудрость, представленная как женщина.
- source_word: Ποτιῶ
  choice: Полью
  rationale: Будущее время глагола со значением «поить, поливать»; применительно к саду естественно русское «полью».
- source_word: κῆπον
  choice: сад
  rationale: Обычное значение κῆπος; более узкое «плодовый сад» контекстом не требуется.
- source_word: μεθύσω
  choice: напою влагой
  rationale: Глагол буквально связан с опьянением или обильным насыщением питьём; в образе орошения передаёт насыщение водой без неуместного буквального упоминания опьянения.
- source_word: πρασιάν
  choice: грядку
  rationale: πρασιά — возделанный участок, гряда или садовая грядка; «грядка» естественно и не ограничивает образ цветами.
- source_word: ἰδοὺ
  choice: И вот
  rationale: Сохраняет внезапность и риторическую выразительность греческого оборота.
- source_word: διῶρυξ
  choice: оросительный канал
  rationale: Слово обозначает прорытый водный путь или канал; уточнение «оросительный» ясно связывает его с поливом сада.
- source_word: ποταμόν
  choice: реку
  rationale: Основное значение — река; оно сохраняет нарастание масштаба образа.
- source_word: θάλασσαν
  choice: море
  rationale: Стандартное значение; контекст не указывает на конкретное море.
theological_decisions:
- issue: Расширение образа от орошения сада до моря
  choice: Сохранить конкретный водно-земледельческий образ без его истолкования в основном тексте.
  alternative: Прямо отождествить разрастание вод с распространением учения Премудрости или Писания.
  rationale: Сам стих не раскрывает аллегорию явно; перевод не должен вносить в текст определённое богословское толкование.
- issue: Род говорящего при переводе εἶπα
  choice: Передать как «Я сказала» в соответствии с образом Премудрости в контексте главы.
  alternative: Использовать «Я сказал», формально возможное вне контекста из-за отсутствия грамматического рода в греческой форме.
  rationale: Русское прошедшее время требует рода, а непосредственный контекст однозначно представляет говорящую Премудрость в женском роде.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краток и ритмичен; тире во второй части устраняет тяжёлое повторение «превратилась», не меняя смысла.
