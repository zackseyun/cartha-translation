lexical_decisions:
- source_word: ἐκλίπητε ἐν ἰσχύϊ
  choice: не теряйте силы
  rationale: Сочетание буквально означает призыв не лишиться или не иссякнуть в силе. «Не теряйте силы» естественно звучит по-русски и сохраняет образ убывающей силы без лишнего истолкования.
- source_word: κολλᾶσθε
  choice: держитесь
  rationale: Глагол обозначает тесное присоединение и стойкую приверженность. «Держитесь» передаёт продолжительное, сознательное действие на современном литературном русском языке.
- source_word: αὐτῷ
  choice: его
  rationale: Форма местоимения допускает мужской или средний род. По смыслу увещания выбран личный референт, однако строчная буква не добавляет к греческому тексту особого типографского толкования.
- source_word: κραταιωθῆτε
  choice: укрепиться
  rationale: Греческий пассивный аорист выражает обретение силы как результат. Русский возвратный инфинитив естественно передаёт это значение в целевой конструкции.
theological_decisions:
- issue: Референт αὐτῷ в добавочной строке увещания
  choice: его
  alternative: это / её
  rationale: Грамматически местоимение может быть мужского или среднего рода. Личное «его» лучше соответствует характеру призыва держаться Господа, но строчное написание сохраняет сдержанность там, где сам греческий текст не уточняет референта.
- issue: Текстуальный статус Сир 24:24
  choice: сохранить строку в основном тексте и отметить её текстуальную историю в сноске
  alternative: опустить строку из основного текста
  rationale: Строка присутствует в используемом греческом источнике и сохраняется в принятой нумерации главы; сноска честно указывает, что она засвидетельствована не во всех текстовых традициях.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным увещательным строем. Формулировки ясны обычному читателю, но сохраняют смысловую напряжённость исходного текста; архаизмы и конфессионально маркированная капитализация местоимения не используются.
