lexical_decisions:
- source_word: ὁ ἐκφαίνων
  choice: Он заставляет… сиять
  rationale: Артикль с причастием продолжает характеристику закона из ближайшего контекста. Русское «Он» сохраняет мужской род слова «закон», а каузативная конструкция передаёт переходное значение ἐκφαίνω и образ сияния.
- source_word: ὡς φῶς
  choice: словно свет
  rationale: Сохраняет прямое сравнение, выраженное ὡς, и следует засвидетельствованному греческому тексту, не исправляя «свет» на предполагаемое иное чтение.
- source_word: παιδείαν
  choice: наставление
  rationale: В контексте Премудрости слово обозначает формирующее обучение и наставление; этот вариант не сужает смысл до наказания или школьного образования.
- source_word: ὡς Γηὼν
  choice: словно Гихон
  rationale: Передаёт второе сравнение и традиционное русское написание названия реки.
- source_word: ἐν ἡμέραις τρυγητοῦ
  choice: в дни сбора винограда
  rationale: Ясно передаёт конкретное значение τρυγητός — время сбора винограда, не используя менее понятное «время виноградной жатвы».
theological_decisions:
- issue: К кому относится ὁ ἐκφαίνων
  choice: Местоимение «Он» относится к закону, названному в предшествующем контексте.
  alternative: «Тот, кто заставляет наставление сиять» — личное прочтение, которое может быть отнесено к олицетворённой Премудрости или говорящему.
  rationale: Последовательность причастий в контексте описывает закон. Русское местоимение мужского рода естественно согласуется со словом «закон» и не вводит нового божественного субъекта; сноска сохраняет формальную неоднозначность греческой конструкции.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной образностью. Повтор «словно» сохраняет параллелизм греческого текста; необычное сопоставление света и реки намеренно не сглажено.
