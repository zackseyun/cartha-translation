  text: In the holy tent I ministered before him[b][a], and so I was established in Zion.
translation:
  language: ru
  text: В святом шатре[a] я совершала служение перед ним, и так была утверждена на Сионе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В святой скинии».'
    reason: Традиционное библейское слово «скиния» точнее обозначает культовый шатёр, но менее прозрачно для части современных читателей.
lexical_decisions:
- source_word: σκηνῇ ἁγίᾳ
  choice: в святом шатре
  rationale: «Шатёр» сохраняет конкретный образ σκηνή и понятен современному читателю; традиционное «скиния» дано как допустимая альтернатива в сноске.
- source_word: ἐνώπιον αὐτοῦ
  choice: перед ним
  rationale: Буквально передаёт пространственно-личностный смысл выражения и не уточняет референта сверх контекста.
- source_word: ἐλειτούργησα
  choice: я несла служение
  rationale: Передаёт культовый оттенок λειτουργέω естественным русским выражением, не приписывая Премудрости прямо не названную священническую должность. Женский род обусловлен образом персонифицированной Премудрости.
- source_word: οὕτως
  choice: и так
  rationale: Сохраняет связь между предшествующим служением и последующим утверждением, не определяя её точнее как причинную или временную.
- source_word: ἐστηρίχθην
  choice: утвердилась
  rationale: Передаёт пассивное значение обретения твёрдого, установленного положения и соответствует возвышенному контексту.
- source_word: Σειὼν
  choice: Сион
  rationale: Общепринятая русская библейская передача географического имени.
theological_decisions:
- issue: Культовый оттенок служения Премудрости
  choice: «несла служение»
  alternative: «совершала священное служение»; «служила»
  rationale: Выбранная формулировка сохраняет храмово-культовую окраску глагола, но не усиливает её до прямого утверждения о священническом статусе.
- issue: Связь служения с утверждением на Сионе
  choice: «и так»
  alternative: «и потому»; «и таким образом»
  rationale: Греческое οὕτως допускает результирующую или образную связь; перевод сохраняет эту смысловую открытость, не превращая её в однозначную причинность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис плавный и доступный; архаизм «скиния» вынесен в сноску. Местоимение «ним» оставлено со строчной буквы в соответствии с нейтральной современной издательской практикой.
