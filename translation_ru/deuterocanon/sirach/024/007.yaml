  text: Among all these I sought a resting place[b][a], and in whose inheritance shall I lodge?
translation:
  language: ru
  text: Среди всего этого я искала место покоя[a]; в чьём наследии мне остановиться[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покоя». Греческое слово означает покой или отдохновение; здесь последующий вопрос о пребывании позволяет понимать его и как место покоя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ночевать», «расположиться станом» или «поселиться». Греческий глагол может означать остановиться на ночлег, расположиться или обрести пристанище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τούτων πάντων
  choice: Среди всего этого
  rationale: μετά с родительным здесь естественно понимать как поиск внутри уже названного круга, а не во временном смысле «после всего этого».
- source_word: ἀνάπαυσιν
  choice: место покоя
  rationale: Существительное означает «покой, отдохновение»; в сочетании с последующим вопросом о поселении контекстуально уместен конкретизированный смысл места, где можно обрести покой.
- source_word: ἐζήτησα
  choice: я искала
  rationale: Прямо передаёт аорист ζητέω; женский род обусловлен говорящей персонифицированной Премудростью.
- source_word: κληρονομίᾳ τίνος
  choice: в чьём наследии
  rationale: Сохраняет вопрос о принадлежности удела и библейский смысл κληρονομία как наследия или отведённого владения.
- source_word: αὐλισθήσομαι
  choice: мне поселиться
  rationale: Передаёт намерение остановиться и обосноваться в определённом месте; более естественно по-русски, чем буквальное «ночевать», при сохранении альтернативы в примечании.
theological_decisions:
- issue: Поиск места пребывания персонифицированной Премудростью
  choice: Оставить «наследие» неопределённым и не называть его Израилем в самом стихе.
  alternative: Прямо уточнить, что речь идёт о наследии Израиля, либо абстрактно передать поиск принятия среди народов.
  rationale: Сам греческий текст ещё не указывает обладателя наследия; дальнейший контекст уточняет образ. Перевод сохраняет развитие мысли и не вносит позднейших отождествлений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Женский род последовательно отражает речь персонифицированной Премудрости; порядок частей слегка перестроен ради естественного русского вопроса.
