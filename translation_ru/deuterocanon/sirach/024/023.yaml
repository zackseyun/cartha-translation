translation:
  language: ru
  text: Всё это — книга завета Бога Всевышнего, Закон, который Моисей заповедал собраниям Иакова как наследие.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «общинам Иакова». Здесь имеются в виду собранные общины народа Израиля, а не обязательно позднейшие учреждения, называемые синагогами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα πάντα
  choice: Всё это
  rationale: Нейтральное множественное число в греческом охватывает всё сказанное выше; по-русски собирательное «всё это» естественно передаёт тот же охват.
- source_word: βίβλος διαθήκης
  choice: книга завета
  rationale: «Книга» не уточняет без необходимости материальную форму рукописи, а «завет» передаёт обычное библейское значение διαθήκη в связи с Богом, Моисеем и Иаковом.
- source_word: θεοῦ Ὑψίστου
  choice: Бога Всевышнего
  rationale: Сохранены и существительное «Бог», и титул «Всевышний», а также их последовательность в греческом тексте.
- source_word: νόμον
  choice: Закон
  rationale: Речь идёт об уже определённом Законе Моисея; прописная буква помогает обозначить его как конкретный корпус Божьего наставления, не меняя лексического значения.
- source_word: ὃν ἐνετείλατο Μωυσῆς
  choice: который Моисей заповедал
  rationale: Глагол ἐντέλλομαι означает повелевать или заповедовать; «заповедал» естественно для библейского законодательного контекста и не добавляет отсутствующего в тексте глагола «дал».
- source_word: κληρονομίαν
  choice: как наследие
  rationale: Винительный падеж характеризует Закон как наследственное достояние общин Иакова; оборот «как наследие» ясно передаёт эту связь.
- source_word: συναγωγαῖς Ἰακώβ
  choice: собраниям Иакова
  rationale: «Собрания» передаёт общины собранного народа и не вносит позднейшего институционального смысла слова «синагога»; имя Иаков сохранено буквально.
theological_decisions:
- issue: Значение διαθήκη в связи с Моисеем и Иаковом
  choice: завет
  alternative: завещание
  rationale: Контекст говорит о Божьем установлении для народа через Моисея, поэтому здесь имеется в виду завет, а не частноправовое завещание.
- issue: Кто выступает субъектом глагола ἐνετείλατο
  choice: Моисей заповедал
  alternative: Бог заповедал через Моисея
  rationale: Грамматическим субъектом в сохранившемся греческом тексте прямо назван Моисей; богословски привычную формулировку не следует подставлять вместо неё.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет отождествление книги завета с Законом; формулировка не сглаживает указание греческого текста на Моисея как субъекта глагола.
