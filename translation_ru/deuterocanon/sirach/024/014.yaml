translation:
  language: ru
  text: Как пальма, я вознеслась на морских берегах[a], как насаждения роз — в Иерихоне; как прекрасная маслина — на равнине, и вознеслась, как платан.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на морских берегах». Некоторые исследователи предполагают иное первоначальное название местности, поскольку пальмы чаще связываются с оазисами или речными берегами; однако дошедший до нас греческий текст говорит о морских берегах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: φοῖνιξ
  choice: пальма
  rationale: В данном ботаническом сравнении слово естественно обозначает пальму; вид дерева точнее не уточняется.
- source_word: ἀνυψώθην
  choice: я вознеслась
  rationale: Передаёт одновременно образ высокого роста и оттенок возвышения; женский род согласуется с Премудростью, говорящей в контексте от первого лица.
- source_word: αἰγιαλοῖς
  choice: на побережьях
  rationale: Греческое слово обозначает морские берега или прибрежные земли; русский предлог «на» здесь естественнее буквального «в».
- source_word: φυτὰ ῥόδου
  choice: розовые кусты
  rationale: Передаёт множественное число и растительный образ естественным современным русским выражением, не меняя его на собирательное «розы».
- source_word: Ἰερειχώ
  choice: Иерихон
  rationale: Принятая русская форма библейского топонима; после «в» употреблён предложный падеж.
- source_word: ἐλαία εὐπρεπής
  choice: прекрасная маслина
  rationale: «Маслина» — традиционное и понятное обозначение оливкового дерева, а «прекрасная» передаёт красоту и благородный вид εὐπρεπής.
- source_word: πεδίῳ
  choice: на равнине
  rationale: Передаёт ровную открытую местность и естественно сочетается с русским предлогом «на».
- source_word: πλάτανος
  choice: платан
  rationale: Точное современное русское название дерева; вариант «сикомор» обозначал бы другое растение.
theological_decisions:
- issue: 'Оттенок ἀνυψώθην: физический рост или возвышение Премудрости'
  choice: вознеслась
  alternative: выросла высокой
  rationale: Сохранён смысловой диапазон между высотой дерева и возвышением персонифицированной Премудрости, без сведения глагола только к росту.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной образностью. Синтаксический параллелизм греческого текста сохранён; повтор глагола «вознеслась» оставлен намеренно.
