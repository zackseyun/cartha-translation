  text: I am the mother of beautiful love[a], and of fear, and of knowledge, and of holy hope[b];
translation:
  language: ru
  text: Я — мать прекрасной любви[a], страха[b], знания и святой надежды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благой любви», «благородной любви»; греческое καλῆς может выражать как нравственную доброту и благородство, так и красоту.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «благоговения»; в литературе мудрости греческое φόβου часто обозначает благоговейный страх, особенно перед Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μήτηρ
  choice: мать
  rationale: Сохраняет буквальный и выразительный образ материнства в речи олицетворённой Премудрости.
- source_word: καλῆς
  choice: прекрасной
  rationale: Передаёт как эстетический, так и нравственный оттенок καλός; возможные смыслы «благая» и «благородная» отмечены в сноске.
- source_word: ἀγάπης
  choice: любви
  rationale: Прямое и естественное соответствие ἀγάπη в данном контексте.
- source_word: φόβου
  choice: страха
  rationale: Буквально передаёт φόβος и не устраняет присущую литературе мудрости напряжённость между страхом и благоговением.
- source_word: γνώσεως
  choice: знания
  rationale: Наиболее прямое соответствие γνῶσις; «понимание» было бы более толковательным.
- source_word: ἁγίας
  choice: святой
  rationale: Сохраняет обычную библейскую лексику и религиозный смысл ἅγιος.
- source_word: ἐλπίδος
  choice: надежды
  rationale: Естественно и точно передаёт ἐλπίς в этом перечислении.
theological_decisions:
- issue: Значение φόβου в контексте литературы мудрости
  choice: страха
  alternative: благоговения
  rationale: В литературе мудрости φόβος нередко означает благоговейный страх, особенно перед Богом, однако здесь объект не назван и греческий текст не уточняет смысл. Перевод «страх» сохраняет исходную многозначность и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным библейским звучанием. Повтор греческого καί перед каждым элементом не воспроизведён механически, поскольку естественное русское перечисление яснее передаёт структуру фразы; тире подчёркивает именное сказуемое. Маркер [b] поставлен непосредственно после слова «страха», к которому относится сноска.
