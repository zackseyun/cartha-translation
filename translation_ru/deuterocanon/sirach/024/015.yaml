base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/024/015.yaml
  text: Like cinnamon and aspalathus[a], I gave forth a scent of spices, and like choice myrrh I spread fragrance, like galbanum and onycha and stacte[e][d][c][b], and like the smoke of frankincense in the tabernacle.
translation:
  language: ru
  text: Как корица и аспалат[a], я источала аромат благовоний, а как отборная смирна распространяла благоухание — как гальбан, ониха и стакта[b] и как дым ладана в шатре[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Аспалат — ароматическое растение, точное отождествление которого неизвестно.
    reason: cultural_note
  - marker: b
    text: Гальбан, ониха и стакта — душистые вещества, употреблявшиеся при составлении благовоний; точная природа онихи и стакты остаётся предметом обсуждения.
    reason: cultural_note
  - marker: c
    text: 'Или: «в скинии». Греческое слово буквально означает «шатёр», но в контексте священных благовоний может указывать на скинию — шатёр святилища.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: корица
  rationale: Обычное значение греческого названия пряности; вариант «кассия» здесь менее вероятен.
- source_word: ἀσπάλαθος
  choice: аспалат
  rationale: Точное ботаническое отождествление растения не установлено, поэтому сохранено транслитерированное название без ложной конкретизации.
- source_word: ἀρωμάτων
  choice: благовоний
  rationale: 'Родительный падеж естественно связан с ὀσμήν: речь идёт об аромате душистых веществ, причём всё окружение стиха связано с храмовыми благовониями.'
- source_word: δέδωκα ὀσμήν
  choice: я источала аромат
  rationale: Передаёт распространение запаха и сохраняет возвышенный поэтический регистр. Женский род обусловлен говорящей Премудростью в контексте главы.
- source_word: σμύρνα ἐκλεκτή
  choice: отборная смирна
  rationale: ἐκλεκτή означает выбранную, отборную; «отборная» естественно характеризует высококачественную смирну.
- source_word: διέδωκα εὐωδίαν
  choice: я распространяла благоухание
  rationale: εὐωδία обозначает приятный аромат; «благоухание» передаёт это без избыточного добавления отдельного определения «сладкое».
- source_word: χαλβάνη
  choice: гальбан
  rationale: Устоявшееся название ароматической смолы, известной по библейским составам благовоний.
- source_word: ὄνυξ
  choice: ониха
  rationale: В перечне благовоний обозначает ароматическое вещество, а не драгоценный камень оникс; выбрана традиционная русская форма названия.
- source_word: στακτή
  choice: стакта
  rationale: Сохранено специальное название ароматического вещества, чтобы не заменять его предположительным общим толкованием.
- source_word: λίβανου ἀτμίς
  choice: дым ладана
  rationale: Хотя ἀτμίς может означать пар или испарение, при воскурении ладана естественный русский образ — поднимающийся дым.
- source_word: ἐν σκηνῇ
  choice: в шатре
  rationale: Основной текст сохраняет буквальное значение σκηνή и не устраняет его культовый подтекст; возможное указание на скинию отмечено в сноске.
theological_decisions:
- issue: Культовое значение σκηνή
  choice: в шатре
  alternative: в скинии
  rationale: Перечень составных частей священного благовония ясно вызывает образ святилища, однако само греческое слово буквально означает «шатёр». Буквальный вариант оставлен в тексте, а культовое прочтение дано в сноске, чтобы сохранить смысловую напряжённость.
- issue: Род говорящей Премудрости
  choice: я источала; я распространяла
  alternative: перестройка фразы без маркировки рода
  rationale: В контексте главы от первого лица говорит персонифицированная Премудрость; женский род естественно передаёт это в русском языке и не вводит дополнительного учения о природе Премудрости.
translation_notes:
  register: Современный литературный русский с достоинством гимнической речи. Синтаксический параллелизм и череда сравнений сохранены, редкие названия благовоний не заменены расплывчатыми обобщениями. Точка с запятой и тире помогают ясно представить длинный греческий ряд образов.
