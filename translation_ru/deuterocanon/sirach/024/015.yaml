  source_fidelity: 'Передача основных греческих образов точна: κιννάμωμον — «корица», ἀσπάλαθος сохранён как «аспалат», редкие ингредиенты благовония не подменены догадочными толкованиями, а ἐν σκηνῇ в основном тексте передано буквально как «в шатре». Женские формы глаголов оправданы ближайшим контекстом, где говорит персонифицированная Премудрость. Однако в русском чередование сравнений после тире синтаксически недостаточно прозрачно: «как гальбан…» может ошибочно восприниматься как пояснение к «благоуханию», а не как дальнейшие параллельные сравнения действия.'
