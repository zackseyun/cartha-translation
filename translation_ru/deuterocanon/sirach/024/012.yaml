translation:
  language: ru
  text: И я укоренилась среди прославленного народа[a], в уделе Господа — Его наследии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди славного народа» или «среди народа, облечённого славой». Греческое перфектное страдательное причастие обозначает состояние, возникшее в результате прославления, но может пониматься и почти как прилагательное.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческую фразу можно также передать: «в уделе наследия Господа» или «в наследственном уделе Господа». Сочетание допускает несколько близких синтаксических разборов.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρίζωσα
  choice: я укоренилась
  rationale: Аорист действительного залога, первое лицо единственного числа. «Укоренилась» естественно передаёт образ пускания корней; женский род обусловлен тем, что в контексте говорит Премудрость.
- source_word: λαῷ
  choice: среди народа
  rationale: λαός обозначает народ как единое сообщество. Предлог ἐν при образе укоренения естественно передаётся по-русски как «среди».
- source_word: δεδοξασμένῳ
  choice: облечённого славой
  rationale: Перфектное страдательное причастие δοξάζω указывает на обретённое в результате действие состояние. Такая передача сохраняет пассивно-результативный оттенок и звучит естественнее буквального «прославленного» в данном сочетании.
- source_word: μερίδι
  choice: уделе
  rationale: μερίς означает выделенную долю или удел; «удел» сохраняет связь с распределением наследия и уместен в библейском контексте.
- source_word: Κυρίου
  choice: Господа
  rationale: Стандартная передача Κύριος в отношении Бога; родительный падеж прямо зависит от «уделе».
- source_word: κληρονομίας αὐτοῦ
  choice: в Его наследии
  rationale: κληρονομία — «наследие»; αὐτοῦ относится к Господу. Повтор предлога и тире ясно передают вероятное приложение, не сводя компактную греческую конструкцию к одному бесспорному синтаксическому разбору.
theological_decisions:
- issue: Передача δεδοξασμένῳ как свойства народа или как результата совершённого над ним действия
  choice: народа, облечённого славой
  alternative: славного народа; прославленного народа
  rationale: Греческое перфектное страдательное причастие допускает почти качественное понимание, однако основная передача сохраняет мысль о дарованной или обретённой славе, не объявляя её просто внутренним свойством народа.
- issue: Синтаксическая связь ἐν μερίδι Κυρίου κληρονομίας αὐτοῦ
  choice: в уделе Господа — в Его наследии
  alternative: в уделе наследия Господа; в наследственном уделе Господа
  rationale: Греческая фраза компактна и может пониматься аппозиционно либо как генитивная цепочка. Тире сохраняет вероятное приложение «Его наследии», не устраняя исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены образ укоренения, результативный оттенок причастия и неоднозначность заключительной генитивно-аппозиционной конструкции.
