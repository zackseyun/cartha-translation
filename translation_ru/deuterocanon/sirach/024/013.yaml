  text: Like a cedar I was raised high in Lebanon[a], and like a cypress in the mountains of Hermon.
translation:
  language: ru
  text: Как кедр, я высоко поднялась в Ливане, и как кипарис — в горах Ермона.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая форма Ἀερμών соответствует топониму, обычно передаваемому по-русски как «Ермон».
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: как
  rationale: Вводит сравнение; обычная и естественная сравнительная конструкция в современном русском языке.
- source_word: κέδρος
  choice: кедр
  rationale: Стандартное соответствие греческому названию дерева, сохраняющее образ высоты и величия, связанный с Ливаном.
- source_word: ἀνυψώθην
  choice: высоко поднялась
  rationale: Передаёт прежде всего пространственный образ высоты и не придаёт глаголу излишне выраженного значения почётного возвышения. Женский род обусловлен речью о персонифицированной Премудрости; буквальный русский пассив «была поднята» здесь звучал бы неестественно и мог бы создавать образ физического перемещения.
- source_word: ἐν τῷ Λιβάνῳ
  choice: на Ливане
  rationale: В русском библейском и географическом употреблении название может обозначать горный край или гору; предлог «на» естественно сочетается с данным древесным образом.
- source_word: κυπάρισσος
  choice: кипарис
  rationale: Наиболее обычное лексическое соответствие греческому κυπάρισσος; варианты «ель» и «сосна» менее точны.
- source_word: ἐν ὄρεσιν Ἀερμών
  choice: в горах Ермона
  rationale: Сохраняет множественное число ὄρεσιν и передаёт Ἀερμών в принятой русской форме топонима «Ермон».
theological_decisions:
- issue: Следует ли передавать ἀνυψώθην явно почётным или богословски окрашенным словом
  choice: высоко поднялась
  alternative: была превознесена / была вознесена
  rationale: В контексте персонифицированная Премудрость описывает себя через образы высоких деревьев. Пространственная формулировка сохраняет метафору роста и высоты, не превращая её без достаточных оснований в утверждение о почётном статусе.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Параллелизм двух сравнений сохранён; тире во второй части естественно восполняет повторяющееся сказуемое. Женский род согласован с персонифицированной Премудростью в контексте главы.
