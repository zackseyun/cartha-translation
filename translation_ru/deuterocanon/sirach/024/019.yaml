translation:
  language: ru
  text: Придите ко мне, жаждущие меня[a], и насытьтесь моими плодами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «желающие меня», «тоскующие по мне». Греческое причастие выражает сильное желание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тем, что я произвожу», «моим урожаем». В греческом имеется в виду произведённое; слово «плоды» сохраняет окружающий образ Премудрости как плодоносящего растения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προέλθετέ πρὸς μέ
  choice: Придите ко мне
  rationale: Повелительная форма во множественном числе и направительное πρὸς μέ переданы естественным русским приглашением приблизиться к олицетворённой Премудрости.
- source_word: οἱ ἐπιθυμοῦντές μου
  choice: желающие меня
  rationale: Причастие ἐπιθυμοῦντες выражает сильное желание; прямое дополнение сохраняет направленность желания на саму Премудрость и не добавляет толкования.
- source_word: ἐμπλήσθητε
  choice: насытьтесь
  rationale: В сочетании с плодами глагол означает наполниться ими досыта. Возвратная повелительная форма естественна по-русски и передаёт образ вкушения, не сводя его к отвлечённому удовлетворению.
- source_word: γενημάτων
  choice: плодами
  rationale: Слово обозначает произведённое, урожай или плоды. «Плоды» сохраняет растительный поэтический образ ближайшего контекста.
theological_decisions:
- issue: Приглашение олицетворённой Премудрости
  choice: Сохранить речь от первого лица и образ насыщения её плодами без расшифровки метафоры.
  alternative: Прямо назвать плоды учением, дарами или благами Премудрости.
  rationale: Греческий текст оставляет значение плодов образным; поясняющая конкретизация внесла бы отсутствующее в нём богословское толкование.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейско-поэтической интонацией. Синтаксис краток и сохраняет параллелизм двух повелений.
