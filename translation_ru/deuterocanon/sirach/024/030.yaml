lexical_decisions:
- source_word: κἀγώ
  choice: И я
  rationale: Передаёт присоединительное значение καί и переход говорящего к собственной роли без избыточного усиления «и я тоже».
- source_word: διῶρυξ
  choice: канал
  rationale: Слово обозначает искусственно проложенный канал; это отличает его от реки как естественного источника воды.
- source_word: ἀπὸ ποταμοῦ
  choice: берущий начало от реки
  rationale: Передаёт происхождение канала от реки и звучит по-русски естественнее буквального «канал от реки»; неопределённость существительного без артикля сохранена.
- source_word: ὑδραγωγός
  choice: водовод
  rationale: Обозначает искусственное сооружение или русло для проведения воды. «Водовод» сохраняет этот смысл и параллель с каналом, не обязательно предполагая монументальный акведук.
- source_word: ἐξῆλθον
  choice: вышел
  rationale: Формально и ясно передаёт глагол движения; образное движение канала или водовода в сад не разворачивается в дополнительное толкование.
- source_word: παράδεισον
  choice: сад
  rationale: В непосредственном контексте орошения имеется в виду возделанный сад или парк. «Сад» сохраняет конкретный образ и не навязывает эсхатологического смысла.
theological_decisions:
- issue: Значение παράδεισος в метафоре Премудрости и орошения
  choice: сад
  alternative: рай
  rationale: Греческое слово допускает оба значения, но образ канала и водовода непосредственно указывает на орошаемый сад. Возможное чтение «рай» сохранено в сноске, чтобы не устранять смысловую и богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «словно» сохраняет греческий параллелизм. Формула «берущий начало от реки» делает связь источника и канала ясной без расширения метафоры.
