  text: The first did not finish knowing her[c][b][a], and likewise the last did not trace her out.
translation:
  language: ru
  text: Первый не познал её до конца, и последний также не исследовал её до конца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Первый не завершил познавать её, и таким же образом последний не проследил её до конца».'
    reason: Более буквальная передача сочетания συνετέλεσεν … γνῶναι и образного ἐξιχνίασεν.
lexical_decisions:
- source_word: οὐ συνετέλεσεν … γνῶναι
  choice: не познал … до конца
  rationale: Передаёт значение завершённости συντελέω при инфинитиве γνῶναι естественным современным русским языком, не добавляя модального значения «не смог».
- source_word: ὁ πρῶτος
  choice: первый
  rationale: Сохраняет субстантивированное и намеренно неуточнённое обозначение, противопоставленное «последнему».
- source_word: αὐτήν
  choice: её
  rationale: Женский род местоимения сохраняет олицетворение Премудрости в контексте главы.
- source_word: καὶ οὕτως
  choice: и … также
  rationale: Передаёт параллель между двумя утверждениями, а не причинно-следственную связь.
- source_word: ὁ ἔσχατος
  choice: последний
  rationale: Сохраняет открытое временное или поколенческое противопоставление «первому», не превращая выражение в специальный эсхатологический термин.
- source_word: οὐκ ἐξιχνίασεν
  choice: не исследовал … до конца
  rationale: Глагол обозначает тщательное разыскание или прослеживание; «исследовал до конца» естественно передаёт образ полного постижения и сохраняет отличие от простого «познал» в первой части.
theological_decisions:
- issue: Референт и грамматический род олицетворённой Премудрости
  choice: Сохранено личное местоимение женского рода «её».
  alternative: Передать Премудрость как безличное понятие и перестроить фразу без местоимения.
  rationale: В Сир 24 Премудрость выступает как олицетворённая говорящая женщина; женское местоимение непосредственно отражает греческий текст и литературный контекст, не вводя позднейших богословских отождествлений.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной библейской интонацией. Повтор «до конца» выбран ради точной и понятной передачи идеи неисчерпаемости Премудрости; два разных русских глагола сохраняют различие между γινώσκω и ἐξιχνιάζω.
