  text: I[a], like a vine, put forth grace[c][b], and my blossoms are the fruit of glory and wealth.
translation:
  language: ru
  text: Я, словно виноградная лоза, распустилась благодатью[a], и цветы мои — плод славы и богатства[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «красотой», «благосклонностью» или «очарованием». Греческое слово может выражать как привлекательность, так и даруемое благо.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «плод славы и богатства» можно также понять как «славный и богатый плод» или «плод, отмеченный славой и богатством».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ
  choice: Я
  rationale: Явно выраженное местоимение сохранено ради эмфазы в речи олицетворённой Премудрости.
- source_word: ὡς ἄμπελος
  choice: словно виноградная лоза
  rationale: Передаёт прямое сравнение и ясно обозначает именно виноградную лозу.
- source_word: βλαστήσασα
  choice: произрастила
  rationale: Аористное причастие βλαστάνω описывает появление растительного побега или плода; переходная русская форма сохраняет необычный поэтический оборот с прямым дополнением χάριν.
- source_word: χάριν
  choice: благодать
  rationale: Сохраняет широкий диапазон χάρις — благодатность, благосклонность, красоту и привлекательность — не сводя образ лишь к внешней красоте.
- source_word: τὰ ἄνθη μου
  choice: цветы мои
  rationale: Точно и естественно передаёт ἄνθη в рамках растительного образа.
- source_word: καρπὸς
  choice: плод
  rationale: Сохранено единственное число греческого сказуемого; по-русски конструкция остаётся естественной.
- source_word: δόξης
  choice: славы
  rationale: Передаёт возвышенное и многозначное δόξα, которое может включать славу, честь и великолепие.
- source_word: πλούτου
  choice: богатства
  rationale: Прямое соответствие πλοῦτος; родительный падеж сохраняет греческую образную конструкцию.
theological_decisions:
- issue: Значение χάριν в поэтическом самоописании Премудрости
  choice: благодать
  alternative: красоту, благосклонность или очарование
  rationale: «Благодать» удерживает одновременно эстетический и благотворный оттенки слова, не навязывая узкого конфессионального толкования.
- issue: Связь родительных δόξης καὶ πλούτου со словом καρπός
  choice: плод славы и богатства
  alternative: славный и богатый плод; плод, отмеченный славой и богатством
  rationale: Формально сохранена неоднозначная греческая конструкция, не уточняющая без необходимости, обозначают ли родительные происхождение, качество или результат.
translation_notes:
  register: Современный литературный русский язык с возвышенной поэтической интонацией. Необычное сочетание «произрастила благодать» намеренно сохраняет смелую метафору оригинала; синтаксис второй части удерживает его смысловую неоднозначность.
