translation:
  language: ru
  text: Прежде века[a], от начала Он сотворил меня[b], и вовеки я не исчезну[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Прежде вечности»; греч. αἰών может означать век либо безграничную длительность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «создал меня». Речь ведёт олицетворённая Премудрость.'
    reason: clarification
  - marker: c
    text: 'Или: «не прекратлюсь». Букв.: «до века [я] не исчезну»; в этом контексте αἰών может обозначать вечность. В греческом стоит усиленное отрицание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ αἰῶνος
  choice: Прежде века
  rationale: Сохраняет образ αἰών как века или вечности и передаёт первозданное временное предшествование, не сводя выражение однозначно к абстрактному «до времени».
- source_word: ἀπʼ ἀρχῆς
  choice: от начала
  rationale: Близко передаёт исходную предложную конструкцию и сохраняет возвышенную библейскую лаконичность.
- source_word: ἔκτισέν με
  choice: сотворил меня
  rationale: Прямо передаёт обычное значение κτίζω и не смягчает богословски напряжённую речь о персонифицированной Премудрости.
- source_word: ἕως αἰῶνος
  choice: вовеки
  rationale: Естественно выражает неограниченную длительность в данном контексте, хотя буквально оборот допускает передачу «до века».
- source_word: οὐ μὴ ἐκλίπω
  choice: я не исчезну
  rationale: Эмфатическое οὐ μή передано решительным отрицанием; ἐκλείπω здесь относится к прекращению существования или исчезновению, а не к неудаче.
theological_decisions:
- issue: Следует ли смягчать утверждение о сотворении Премудрости
  choice: сотворил меня
  alternative: основал меня / образовал меня
  rationale: Греческое ἔκτισεν прямо допускает и в данном контексте естественно выражает сотворение. Перевод сохраняет формулировку текста и не разрешает её напряжение посредством позднейших доктринальных построений.
- issue: Следует ли понимать αἰών одинаково в обеих частях стиха
  choice: 'Передать контекстуально: «век» в первой части и «вовеки» во второй'
  alternative: «до вечности… до вечности» или «прежде времени… навеки»
  rationale: 'Один и тот же греческий термин в двух идиоматических сочетаниях имеет разные контекстуальные оттенки: первичность и неограниченную продолжительность. Сноски сохраняют неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Прежде века», «от начала» и «вовеки» понятны современному читателю, сохраняют компактность греческой строки и не делают формулировку излишне разговорной.
