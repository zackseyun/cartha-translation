translation:
  language: ru
  text: Я одна обошла небесный свод[a] и прошла по глубинам бездн[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «круг небес». Греческое слово может обозначать круговой простор или изогнутый свод.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в глубине бездн»; слово «глубина» в греческом тексте стоит в единственном числе, а «бездны» — во множественном.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: γῦρον
  choice: небесный свод
  rationale: Слово обозначает нечто круглое или изогнутое, а также круговой предел; в сочетании с «небом» выражение «небесный свод» естественно передаёт космический образ, сохраняя альтернативу «круг небес» в сноске.
- source_word: ἐκύκλωσα
  choice: обошла
  rationale: Глагол κυκλόω передаёт движение вокруг или охватывание по кругу. «Обошла» сохраняет образ кругового движения и звучит естественно по-русски.
- source_word: μόνη
  choice: Я одна
  rationale: Форма женского рода согласуется с персонифицированной Премудростью и подчёркивает исключительность говорящей.
- source_word: βάθει
  choice: в глубинах
  rationale: Хотя греческая форма стоит в единственном числе, по-русски сочетание с множественным ἀβύσσων естественнее передаётся как «в глубинах бездн»; буквальная грамматическая форма отмечена в сноске.
- source_word: ἀβύσσων
  choice: бездн
  rationale: Родительный падеж множественного числа сохранён; «бездны» передают непостижимые космические глубины и высокий регистр оригинала.
- source_word: περιεπάτησα
  choice: прошла
  rationale: Глагол буквально означает «ходить, проходить»; «прошла» сохраняет конкретный образ движения, не усиливая его толкованием вроде «исследовала» или «покорила».
theological_decisions:
- issue: Персонифицированная говорящая
  choice: Сохранить первое лицо и женский род («Я одна») как речь персонифицированной Премудрости.
  alternative: Истолковать говорящую как определённую божественную ипостась и обозначить это непосредственно в переводе.
  rationale: Контекст Сир 24 представляет Премудрость говорящей от первого лица. Сам стих не требует разрешать более поздние богословские вопросы о её отождествлении.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным космологическим образом. Женский род ясно указывает на Премудрость как говорящую; синтаксис двух однородных глаголов не перегружен повтором местоимения.
