translation:
  language: ru
  text: Ибо её разумение обильнее моря, и её совет обильнее великой бездны.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её мысль». Греческое слово может обозначать как мысль, так и способность или плод мышления.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте сказуемое во второй части опущено и подразумевается; для ясности в русском переводе оно повторено.
    reason: syntactic_clarification
lexical_decisions:
- source_word: διανόημα
  choice: разумение
  rationale: Слово обозначает мысль либо способность и плод мышления; «разумение» естественно для контекста персонифицированной Премудрости и не сужает смысл до отдельной мысли.
- source_word: ἐπληθύνθη
  choice: обильнее
  rationale: 'В сочетании с ἀπό передаёт семитизированное сравнение: разумение Премудрости превосходит море по обилию, а не происходит из него.'
- source_word: βουλή
  choice: совет
  rationale: Сохраняет характерный для литературы премудрости смысл обдуманного совета или замысла, не устраняя возможную смысловую широту.
- source_word: ἀβύσσου μεγάλης
  choice: великой бездны
  rationale: Передаёт образ огромной первозданной водной глубины; «бездна» сохраняет космическую образность греческого текста.
- source_word: ἀπὸ ... θαλάσσης
  choice: обильнее моря
  rationale: ἀπό здесь понимается как отражение семитского сравнительного оборота; буквальное «от моря» создало бы ложное впечатление происхождения разумения от моря.
- source_word: αὐτῆς
  choice: её
  rationale: Контекст представляет Премудрость как женский образ; местоимение сохраняет эту грамматическую и литературно-богословскую персонификацию.
theological_decisions:
- issue: Персонификация Премудрости
  choice: Сохранено женское личное местоимение «её».
  alternative: Передать Премудрость отвлечённо и избежать личного местоимения.
  rationale: Греческие формы женского рода и ближайший контекст последовательно изображают Премудрость как говорящую женскую фигуру; обезличивание сгладило бы значимую особенность текста.
- issue: Эллипсис во второй части сравнения
  choice: Сравнительное «обильнее» мысленно распространяется на «совет», но не повторяется.
  alternative: 'Повторить: «и её совет обильнее великой бездны».'
  rationale: Так сохраняется эллиптическое построение греческого текста, хотя русская формулировка приобретает несколько возвышенный и сжатый характер.
translation_notes:
  register: Современный литературный русский с достоинством библейской премудростной речи. Сжатая конструкция «и её совет — великой бездны» намеренно сохраняет греческий эллипсис; тире помогает русскому читателю распознать подразумеваемое сказуемое. «Великая бездна» удерживает древнюю космическую водную образность.
