  yaml_path: translation/deuterocanon/sirach/024/016.yaml
  text: Like a terebinth I spread out my branches[d][c][b][a], and my branches are branches of glory and grace.
translation:
  language: ru
  text: Я, словно теревинф, раскинула свои ветви, и мои ветви — ветви славы и благодати.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простёрла свои ветви».'
    reason: lexical_alternative
  - marker: b
    text: Теревинф — крупное дерево, часто встречающееся в библейских образах; иногда название передают более общим словом «дуб», однако в греческом тексте назван именно теревинф.
    reason: cultural_note
lexical_decisions:
- source_word: τερέβινθος
  choice: теревинф
  rationale: Греческий текст называет конкретное дерево. «Теревинф» сохраняет ботанический и библейский образ, не подменяя его более общим словом «дуб».
- source_word: ἐξέτεινα
  choice: раскинула
  rationale: Глагол означает протягивание, простирание наружу; применительно к ветвям «раскинула» звучит естественно и точно передаёт пространственный образ.
- source_word: κλάδους / κλάδοι
  choice: ветви
  rationale: «Ветви» — прямой и понятный эквивалент; повтор слова сохранён ради поэтического акцента исходного текста.
- source_word: δόξης
  choice: славы
  rationale: «Слава» сохраняет возвышенный библейский смысл δόξα и не сужает его до зрительного великолепия или общественного почёта.
- source_word: χάριτος
  choice: благодати
  rationale: χάρις допускает значения благодати, благосклонности и привлекательности. «Благодать» сохраняет смысловую ёмкость и возвышенный регистр сочетания, не сводя его лишь к красоте.
theological_decisions:
- issue: Поэтическое самоописание Премудрости посредством образа плодоносного дерева
  choice: Сохранить прямую метафору и повтор «ветви — ветви славы и благодати».
  alternative: Передать как «мои ветви славны и прекрасны» либо «славные и благодатные ветви».
  rationale: В греческом повторено κλάδοι и употреблены родительные δόξης καὶ χάριτος. Буквенная структура сохраняет поэтическую силу и не превращает неоднозначные существительные в однозначные прилагательные.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Женский род глагола согласован с Премудростью, говорящей в контексте главы. Сравнение вынесено вперёд вслед за порядком греческого текста; повтор «ветви» намеренно сохранён.
