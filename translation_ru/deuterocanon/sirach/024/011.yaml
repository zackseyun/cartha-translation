    reason: lexical_alternative
lexical_decisions:
- source_word: πόλει ἠγαπημένῃ
  choice: в возлюбленном городе
  rationale: Причастие ἠγαπημένῃ имеет значение «возлюбленный, любимый»; форма без артикля по-русски естественно передаётся определённым обозначением города, который далее назван Иерусалимом. «Возлюбленный» сохраняет возвышенный стиль.
- source_word: ὁμοίως
  choice: также
  rationale: Наречие связывает эту строку с предшествующим повествованием. «Также» звучит естественнее в современном русском, чем более буквальное «подобным образом».
- source_word: κατέπαυσεν
  choice: дал он мне покой
  rationale: Глагол καταπαύω может означать «дать покой», «успокоить», «поселить». Выбор сохраняет образ покоя и не сужает смысл до одного лишь поселения.
- source_word: ἐξουσία
  choice: власть
  rationale: ἐξουσία обозначает власть, право или полномочие. «Власть» естественно передаёт абстрактное существительное и соответствует олицетворённой Премудрости.
theological_decisions:
- issue: Неявное подлежащее при κατέπαυσεν
  choice: Сохранено местоименное «он» без прямого именования Бога.
  alternative: «Господь дал мне покой» / «Бог поселил меня»
  rationale: В греческом подлежащее выражено только формой глагола мужского рода в третьем лице; контекст указывает на Бога, но сам стих прямо Его не называет. Перевод не устраняет эту формальную неявность.
- issue: Временная отнесённость именной второй части
  choice: Добавлена прошедшая связка «была».
  alternative: «в Иерусалиме — моя власть» / «в Иерусалиме моя власть»
  rationale: В греческой именной конструкции связка отсутствует. Прошедшее время согласует вторую часть с аористом κατέπαυσεν и повествованием об утверждении Премудрости, не меняя содержания существительного ἐξουσία.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным строем. Инверсия «дал он мне» сохраняет неявное местоименное подлежащее и поэтическое достоинство; двоеточие или тире не добавлялись, чтобы удержать параллелизм греческих частей.
