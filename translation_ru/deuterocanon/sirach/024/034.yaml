  text: See that I have not labored for myself alone[a], but for all who seek her.
translation:
  language: ru
  text: 'Посмотрите: я потрудился не для себя одного, а для всех, кто ищет её.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδετε
  choice: Посмотрите
  rationale: Аористный императив множественного числа служит призывом обратить внимание и признать сказанное; «Посмотрите» естественно передаёт этот призыв, не превращая его в простое сообщение.
- source_word: οὐκ ἐμοὶ μόνῳ
  choice: не для себя одного
  rationale: Дательный обозначает того, ради кого или в чью пользу совершён труд; формулировка сохраняет акцент μόνῳ и естественно звучит по-русски.
- source_word: ἐκοπίασα
  choice: я потрудился
  rationale: Совершенный вид передаёт греческий аорист как завершённый труд, плоды которого предлагаются читателям; «потрудился» также сохраняет оттенок приложенных усилий.
- source_word: ἀλλὰ πᾶσι
  choice: а для всех
  rationale: Русское противопоставление «не… а…» естественно передаёт конструкцию οὐκ… ἀλλά; «для всех» соотносится с дательным πᾶσι.
- source_word: τοῖς ἐκζητοῦσιν
  choice: кто ищет
  rationale: Причастная конструкция передана естественным русским определительным оборотом. «Ищет» соответствует контексту поиска Премудрости без избыточного усиления.
- source_word: αὐτήν
  choice: её
  rationale: Местоимение относится к олицетворённой Премудрости, представленной в главе как женщина; женский род сохраняет образ исходного текста.
theological_decisions:
- issue: Референт и род αὐτήν в речи о Премудрости
  choice: «её» — об олицетворённой Премудрости
  alternative: «её» или «это» — о мудрости как отвлечённом понятии
  rationale: В контексте Сир 24 Премудрость говорит как женский персонаж. Женское местоимение сохраняет литературный и богословский строй главы, не добавляя к тексту дальнейших отождествлений.
translation_notes:
  register: Современный литературный русский язык; обращение во множественном числе, сдержанный возвышенный тон. Конструкция «не… а…» выбрана как наиболее естественная для русского противопоставления.
