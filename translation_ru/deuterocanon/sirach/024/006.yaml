translation:
  language: ru
  text: Среди морских волн и по всей земле, среди всех народов и племён я обрела себе владение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий глагол также можно передать: «приобрела» или «вступила во владение»; что именно приобретено, в греческом тексте не сказано.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν κύμασιν θαλάσσης
  choice: Среди морских волн
  rationale: Передаёт конкретный морской образ и естественно выражает нахождение внутри множества волн.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: по всей земле
  rationale: В универсальном географическом контексте γῆ означает землю в широком смысле; оборот «по всей земле» естественен в современном русском.
- source_word: ἐν παντὶ λαῷ καὶ ἔθνει
  choice: среди каждого народа и племени
  rationale: Сохраняет распределительное παντί и различает два обозначения человеческих общностей, не придавая ἔθνος современного политического смысла слова «нация».
- source_word: ἐκτησάμην
  choice: я обрела владение
  rationale: Глагол κτάομαι выражает приобретение или вступление во владение. Формулировка естественна по-русски, а женский род соответствует говорящей Премудрости; неопределённость отсутствующего в греческом дополнения отмечена в сноске.
theological_decisions:
- issue: Не названное дополнение при ἐκτησάμην
  choice: 'Передать обобщённо: «обрела владение»'
  alternative: «приобрела»; «овладела»; «обрела себе достояние»
  rationale: В греческом объект приобретения прямо не назван. Обобщённое «владение» делает фразу понятной по-русски, но не уточняет, приобрела ли Премудрость народы, место среди них или область господства; эта неоднозначность оговорена в сноске.
translation_notes:
  register: Современный литературный русский с возвышенным, но доступным библейским звучанием. Сохранена женская форма речи Премудрости и параллельное построение исходной фразы.
