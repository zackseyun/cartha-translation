lexical_decisions:
- source_word: ὁ ἀναπληρῶν
  choice: Он наполняет
  rationale: Греческое ἀναπληρόω передаёт действие наполнения до полноты. Формулировка сохраняет активный характер причастия и не превращает разумение лишь в качество самого субъекта.
- source_word: σύνεσιν
  choice: разумением
  rationale: Творительный падеж естественно выражает содержание наполнения; «разумение» уместно в литературе мудрости и сохраняет смысл способности понимать и постигать.
- source_word: ὡς Εὐφράτης
  choice: как Евфрат
  rationale: ὡς вводит сравнение; русское «как Евфрат» естественно сохраняет образ великой реки.
- source_word: Ἰορδάνης
  choice: Иордан
  rationale: Передано общепринятым русским названием реки без добавления отсутствующих в греческом уточнений.
- source_word: ἐν ἡμέραις θερισμοῦ
  choice: во дни жатвы
  rationale: Сохраняется конкретный сезонный оборот оригинала и его возвышенный, но понятный библейский регистр.
theological_decisions:
- issue: К кому относится ὁ ἀναπληρῶν
  choice: Местоимение «Он» сохраняет связь с подразумеваемым мужским antecedentом из контекста.
  alternative: «Наполняющий» или безличное «это наполняет».
  rationale: Артиклевое причастие мужского рода отсылает к предшествующему существительному мужского рода; перевод не вводит нового богословского отождествления и не уточняет его сверх контекста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Во дни жатвы» сохраняет поэтичность и конкретность греческого выражения; синтаксическая недосказанность глагола «наполняет» намеренно удерживает образ и неоднозначность оригинала.
