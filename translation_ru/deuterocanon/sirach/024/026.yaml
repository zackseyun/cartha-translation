    rationale: При сохранении двух «как» фраза «наполняет разумением, как Евфрат, и как Иордан» не даёт ясной русской синтаксической связи. Объединение сравнений после «подобно» устраняет это, не меняя смысла.
  - severity: low
    issue: Сноска a неточно называет свой вариант буквальным
    rationale: В её формулировке «наполняющий разумением» повторяется та же синтаксическая проблема. Следует дать вариант с «разумение» как прямым дополнением.
