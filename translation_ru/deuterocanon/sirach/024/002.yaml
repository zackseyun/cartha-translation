  yaml_path: translation/deuterocanon/sirach/024/002.yaml
  text: In the assembly of the Most High she will open her mouth[c][b][a], and before his power she will boast.
translation:
  language: ru
  text: В собрании Всевышнего она[a] откроет уста и перед Его силой[b] будет хвалиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Премудрость, представленная как личность в ближайшем контексте.
    reason: cross_reference
  - marker: b
    text: 'Или: «перед Его воинством».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: в собрании
  rationale: В данном иудейско-греческом контексте слово обозначает собравшуюся общину. «Собрание» нейтрально и не вносит более поздних церковных оттенков.
- source_word: Ὑψίστου
  choice: Всевышнего
  rationale: Устоявшаяся и естественная передача греческого божественного титула Ὕψιστος.
- source_word: στόμα αὐτῆς ἀνοίξει
  choice: она откроет уста
  rationale: Греческая конструкция передаёт образное выражение о начале речи. «Откроет уста» сохраняет олицетворение и возвышенный, но понятный регистр.
- source_word: ἔναντι
  choice: перед
  rationale: Кратко и естественно выражает пребывание в присутствии кого-либо.
- source_word: δυνάμεως αὐτοῦ
  choice: Его силой
  rationale: Прямое значение δύναμις — «сила, могущество». Возможное коллективное значение «воинство» не исключается и вынесено в примечание.
- source_word: καυχήσεται
  choice: будет хвалиться
  rationale: Передаёт основное значение глагола — хвалиться, говорить с торжеством о собственной славе; контекст определяет это как речь олицетворённой Премудрости, без обязательного отрицательного оттенка.
theological_decisions:
- issue: К кому относится местоимение женского рода
  choice: Сохранено местоимение «она», а Премудрость названа только в примечании.
  alternative: Вставить в основной текст слово «Премудрость».
  rationale: Из ближайшего контекста ясно, что речь идёт об олицетворённой Премудрости, однако в самом стихе существительное не повторяется.
- issue: Значение δυνάμεως αὐτοῦ
  choice: «перед Его силой»
  alternative: «перед Его воинством»
  rationale: Форма допускает как абстрактное значение «сила, могущество», так и контекстуально возможное коллективное «воинство». Основной текст следует более прямому значению, а альтернативу сохраняет примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Сочетание «откроет уста» сохраняет образность оригинала; прописная буква в «Его» служит русской традиции обозначения отсылки к Всевышнему.
