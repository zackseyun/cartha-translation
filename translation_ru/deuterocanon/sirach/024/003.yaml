  language: ru
  text: Я вышла из уст Всевышнего и, словно туман, покрыла землю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθον
  choice: вышла
  rationale: Аорист ἐξέρχομαι передаёт совершившееся исхождение. «Вышла» естественно звучит в современной русской речи и сохраняет возвышенный образ происхождения персонифицированной Премудрости.
- source_word: ἀπὸ στόματος
  choice: из уст
  rationale: Русское библейское и литературное выражение «из уст» точно сохраняет метафору речи и происхождения; множественное «уст» идиоматично для русского языка при единственном στόματος.
- source_word: Ὑψίστου
  choice: Всевышнего
  rationale: Устоявшаяся русская передача божественного титула Ὕψιστος, уместная для библейского регистра.
- source_word: ὡς ὁμίχλη
  choice: словно туман
  rationale: ὁμίχλη может обозначать туман или мглу. «Туман» понятен современному читателю и сохраняет поэтический образ; «словно» естественно вводит сравнение.
- source_word: κατεκάλυψα
  choice: покрыла
  rationale: Глагол означает «покрыть сверху, окутать». «Покрыла» прямо передаёт значение, не добавляя отсутствующего в тексте уточнения способа действия.
- source_word: γῆν
  choice: землю
  rationale: В космико-поэтическом контексте γῆ обозначает землю в широком смысле, а не отдельную страну или область.
theological_decisions:
- issue: Происхождение персонифицированной Премудрости от Бога
  choice: Сохранено прямое высказывание «Я вышла из уст Всевышнего».
  alternative: «Я была изречена Всевышним» или «Я вышла по повелению Всевышнего».
  rationale: Греческий текст представляет Премудрость говорящей от первого лица и использует образ исхождения из уст Бога. Перевод сохраняет поэтическую и богословскую напряжённость, не сводя образ исключительно к речи, творению или иной догматической категории.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Женский род глаголов обусловлен говорящей персонифицированной Премудростью в контексте главы. Пунктуация завершена точкой, поскольку стих представлен отдельно; смысловой параллелизм сохранён.
