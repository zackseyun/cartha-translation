lexical_decisions:
- source_word: ζυγὸς
  choice: ярмо
  rationale: В сочетании с шеей обозначает именно ярмо, а не коромысло или весы; сохраняется конкретный образ принуждения.
- source_word: ἱμὰς
  choice: ремень
  rationale: Греческое слово обозначает кожаный ремень или полосу; «ремень» — ясный и естественный современный эквивалент.
- source_word: κάμψουσιν
  choice: согнут
  rationale: Будущее время и физический образ переданы прямо, без усиления значения до «сломят» или «насильно склонят».
- source_word: τράχηλον
  choice: шею
  rationale: Единственное число сохранено как обобщённый образ.
- source_word: οἰκέτῃ
  choice: раб
  rationale: Слово может обозначать домашнего слугу, однако контекст насильственного подчинения и наказания делает зависимый, несвободный статус существенным.
- source_word: κακούργῳ
  choice: злого
  rationale: Передаёт нравственную характеристику, не сужая значение до юридически осуждённого преступника.
- source_word: στρέβλαι
  choice: дыба
  rationale: Слово обозначает приспособление для выкручивания тела и пытки; «дыба» кратко и конкретно передаёт этот образ. Русское собирательно-обобщённое употребление в единственном числе естественнее буквального множественного.
- source_word: βάσανοι
  choice: пытки
  rationale: Передаёт тяжесть мучений и непосредственно соответствует карательному контексту.
theological_decisions:
- issue: Передача обозначения зависимого домашнего работника
  choice: раб
  alternative: слуга / домашний слуга
  rationale: В данном изречении речь идёт о принудительном удержании и телесных пытках, поэтому «раб» не смягчает подразумеваемую социальную действительность. Смысловая возможность «слуга» отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Жёсткие образы оригинала сохранены без смягчения; тире естественно передаёт подразумеваемую связку во второй части.
