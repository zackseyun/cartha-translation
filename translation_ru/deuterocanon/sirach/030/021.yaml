  text: Do not look with your eyes and groan[a], like a eunuch embracing a young woman.
translation:
  language: ru
  text: Он смотрит своими глазами и тяжело вздыхает[a], как евнух, обнимающий девушку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой версии этот стих имеет иную форму: «Не предавай душу свою печали и не мучь себя собственными замыслами». Еврейское свидетельство сохраняет образ неудовлетворённого желания, тогда как греческое прямо предостерегает от печали, которую человек причиняет себе сам.'
    reason: alternative_reading
lexical_decisions:
- source_word: ראה בעיניו
  choice: Он смотрит своими глазами
  rationale: Еврейский текст буквально передаёт зрительное восприятие и содержит местоименный суффикс третьего лица («его глазами»). Описательное «он смотрит» сохраняет засвидетельствованную еврейскую форму, не внося отсутствующего в ней отрицания; «своими глазами» удерживает намеренно выразительный образ непосредственного видения.
- source_word: ומתאנח
  choice: и тяжело вздыхает
  rationale: Глагол обозначает скорбный, мучительный вздох. Наречие «тяжело» передаёт силу переживания естественнее для современного русского языка, чем более резкое «стонет».
- source_word: כאשר
  choice: как
  rationale: Обычный и естественный русский способ ввести сравнение.
- source_word: סריס
  choice: евнух
  rationale: Смысл сравнения основан на невозможности осуществить половую близость, поэтому значение «придворный» здесь не подходит.
- source_word: יחבק
  choice: обнимающий
  rationale: Причастная конструкция естественно передаёт незавершённое действие внутри сравнения и сохраняет образ телесной близости.
- source_word: נערה
  choice: девушку
  rationale: Современное нейтральное обозначение молодой женщины; оно не архаично и не создаёт обязательного впечатления детского возраста.
theological_decisions:
- issue: Соотношение еврейской и греческой форм стиха
  choice: Основной текст переведён как описательное высказывание по сохранившемуся еврейскому свидетельству; греческое увещевание приведено в сноске.
  alternative: 'Внести в основной текст греческое отрицательное повеление: «Не предавай душу свою печали и не мучь себя собственными замыслами».'
  rationale: Еврейский текст сохраняет иной, яркий образ и не содержит явного отрицания. Смешение греческого запрета с еврейским сравнением молча создало бы форму, прямо не засвидетельствованную ни одной традицией. Сноска позволяет сохранить существенное разночтение и его наставительный смысл.
- issue: Лицо первого предложения
  choice: 'Третье лицо: «Он смотрит… и тяжело вздыхает».'
  alternative: 'Второе лицо с запретом: «Не смотри… и не вздыхай».'
  rationale: Суффикс в בעיניו буквально означает «его глазами». Хотя ראה без огласовки допускает форму повелительного наклонения второго лица, местоименный суффикс и отсутствие отрицательной частицы поддерживают описательное прочтение; греческое второе лицо отмечено отдельно.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранён резкий телесный образ еврейского текста; архаизмы и конфессионально окрашенные выражения не использованы.
