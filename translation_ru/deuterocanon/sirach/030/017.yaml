  text: Death is better than a life of emptiness[b][a], and eternal rest than unrelenting pain.
translation:
  language: ru
  text: Лучше смерть, чем пустая жизнь[a], и вечный покой — чем неотступная боль[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «горькая жизнь»; еврейский текст говорит о «пустой жизни».'
    reason: alternative_reading
  - marker: b
    text: В греческом параллельном тексте говорится о длительной болезни или немощи; в еврейском — о боли, описанной как постоянная, неотступная.
    reason: lexical_alternative
lexical_decisions:
- source_word: טוב למות
  choice: лучше смерть
  rationale: 'Конструкция טוב ל־ имеет сравнительное значение: «лучше…». Хотя למות формально означает «умереть», существительное «смерть» естественно передаёт краткую афористическую форму; такое понимание подтверждает и греческое θάνατος.'
- source_word: מחיי שוא
  choice: чем пустая жизнь
  rationale: שוא охватывает значения пустоты, тщеты и бесполезности. «Пустая жизнь» ясно и естественно передаёт еврейское выражение, не смешивая его с отличающимся греческим чтением «горькая жизнь».
- source_word: ונוחת עולם
  choice: и вечный покой
  rationale: נוחה обозначает покой, а עולם — неограниченную или весьма длительную продолжительность. «Вечный покой» сохраняет силу сопоставления и не уточняет сверх текста, идёт ли речь исключительно о посмертном состоянии.
- source_word: מכאב נאמן
  choice: чем неотступная боль
  rationale: כאב означает «боль», а נאמן здесь характеризует её как стойкую, постоянную, не прекращающуюся. «Неотступная боль» естественно передаёт эту длительность и тяжесть.
theological_decisions:
- issue: Расхождение еврейского и греческого текста в первом сравнении
  choice: В основном тексте передано еврейское «пустая жизнь»
  alternative: 'Греческий параллельный текст: «горькая жизнь»'
  rationale: Сохранившийся еврейский текст имеет высокую степень надёжности и служит основным свидетельством; греческое чтение указано в сноске, чтобы не скрывать древнюю текстовую разницу.
- issue: Смысл עולם в изречении
  choice: «вечный»
  alternative: «непрестанный», «неизменный», «долговечный»
  rationale: Перевод сохраняет предельную длительность выражения и богословское напряжение, не превращая само изречение в подробное утверждение о загробной жизни.
translation_notes:
  register: Краткое симметричное изречение в современном литературном русском языке. Эллипсис во второй части («вечный покой — чем…») сохраняет афористическую параллельность оригинала; лексика понятна широкому кругу читателей и остаётся торжественно-сдержанной.
