lexical_decisions:
- source_word: ἵππος
  choice: конь
  rationale: Обычное и естественное русское обозначение лошади в кратком назидательном сравнении; сохраняет мужской род греческого слова.
- source_word: ἀδάμαστος
  choice: необъезженный
  rationale: В отношении коня точно передаёт образ животного, не приученного повиноваться человеку, и звучит по-русски естественнее буквального «неукрощённый».
- source_word: ἀποβαίνει
  choice: становится
  rationale: Передаёт наступивший результат и сохраняет афористическую краткость.
- source_word: σκληρός
  choice: строптивым
  rationale: В данном контексте слово характеризует не физическую твёрдость, а непокорность и сопротивление; «строптивый» особенно уместно применительно к коню.
- source_word: υἱός
  choice: сын
  rationale: Сохраняет конкретное значение мужского рода и единственного числа в греческом тексте.
- source_word: ἀνειμένος
  choice: которого не сдерживают
  rationale: Передаёт состояние того, кому дали волю и не установили должных ограничений, не сужая смысл до одного лишь отсутствия надзора.
- source_word: ἐκβαίνει
  choice: —
  rationale: Результативное значение глагола выражено общим для обеих частей сказуемым «становится»; эллипсис во второй части естественен по-русски и подчёркивает параллелизм.
- source_word: προαλής
  choice: своевольным
  rationale: Редкое слово обозначает, по контексту, необузданную, самоуверенно своевольную склонность; выбранный эквивалент сохраняет смысл, не придавая ему чрезмерной определённости.
