lexical_decisions:
- source_word: כי
  choice: ведь
  rationale: Естественно вводит основание предшествующего наставления и сохраняет краткость изречения.
- source_word: רבים
  choice: многих
  rationale: Прямо передаёт широкое, обобщающее значение еврейского слова.
- source_word: הרג
  choice: погубил
  rationale: Передаёт значение убийства или причинения гибели; в русском афористическом контексте «погубил» звучит естественно и допускает обобщённый результат.
- source_word: דין
  choice: гнев
  rationale: Форма и значение слова здесь несколько неясны; контекст и параллелизм с קצפון указывают на гнев или негодование, а не на судебное «решение».
- source_word: ואין
  choice: и нет
  rationale: Сохраняет сочинительную связь и стандартное еврейское отрицание наличия.
- source_word: תעלה
  choice: пользы
  rationale: Ясно и современно передаёт значение выгоды, пользы или преимущества.
- source_word: בקצפון
  choice: в ярости
  rationale: Передаёт сильный гнев и сохраняет предложную конструкцию; отличие от «гнева» в первой части делает параллелизм выразительным без изменения смысла.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста с указанной греческой параллелью
  choice: Основной перевод выполнен по сохранившемуся еврейскому свидетельству; расхождение отмечено в сноске.
  alternative: 'Перевод по греческой параллели: «Знайте, что я трудился не для себя одного, но для всех, кто ищет наставления».'
  rationale: При наличии еврейского текста он служит основным источником. Греческая строка имеет совершенно иное содержание и, вероятно, отражает расхождение в нумерации стихов либо другую текстовую традицию; подменять ею связное еврейское изречение не следует.
translation_notes:
  register: Краткое афористическое изречение на современном литературном русском языке. Сохранён смысловой параллелизм двух частей; «гнев» и «ярость» различены стилистически, но относятся к одному полю значений.
