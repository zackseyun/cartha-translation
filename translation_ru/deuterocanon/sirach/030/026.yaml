  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Указанная греческая параллель содержит другое изречение: «Поймите, что я трудился не для себя одного, но для всех, кто ищет наставления». Вероятно, это связано с расхождением в нумерации стихов или с иной текстовой традицией. Основной перевод следует сохранившемуся еврейскому тексту.'
