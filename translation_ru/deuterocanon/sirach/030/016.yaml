  - marker: b
    text: 'Буквально по-еврейски: «благо сердца»; греческая параллель: «радость сердца».'
    reason: alternative_reading
lexical_decisions:
- source_word: אין עושר על עושר
  choice: Нет богатства больше, чем
  rationale: Конструкция אין ... על выражает превосходство или сравнение. Перевод сохраняет образ богатства и естественно передаёт сравнительный смысл; греческое βελτίων подтверждает его.
- source_word: שר עצם
  choice: здоровье тела
  rationale: Еврейское выражение сжато и не вполне прозрачно. Греческая параллель ὑγείας σώματος прямо поддерживает значение телесного здоровья; современное русское «здоровье тела» ясно и не создаёт сомнительного буквального образа.
- source_word: אין טובה על
  choice: нет блага больше, чем
  rationale: Повторена сравнительная структура первого полустишия, а существительное טובה передано как «благо».
- source_word: טוב לבב
  choice: радость сердца
  rationale: Буквально выражение допускает «благо/доброту сердца», но в контексте обозначает внутреннее благополучие и радость. Греческое χαρὰν καρδίας подтверждает эмоциональное значение.
