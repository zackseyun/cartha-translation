translation:
  language: ru
  text: Нет богатства ценнее здоровья тела[a], и нет блага ценнее радости сердца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение сжато и может быть понято как «крепость тела»; греческая параллель говорит: «здоровье тела».'
