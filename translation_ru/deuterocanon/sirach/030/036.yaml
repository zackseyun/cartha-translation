lexical_decisions:
- source_word: ἔμβαλε
  choice: Дай
  rationale: Аористный императив ἐμβάλλω в сочетании с εἰς ἐργασίαν означает побуждение или назначение к занятию; «дай ему работу» естественно передаёт повеление без буквального и неуместного «брось».
- source_word: αὐτὸν
  choice: ему
  rationale: Местоимение мужского рода относится к мужчине; дательный падеж обусловлен естественной русской конструкцией «дать кому-либо работу».
- source_word: εἰς ἐργασίαν
  choice: работу
  rationale: Сочетание обозначает вовлечение в трудовую деятельность. «Работу» ясно и современно передаёт смысл, хотя меняет греческий образ движения «в труд» ради естественности русского языка.
- source_word: ἵνα μὴ ἀργῇ
  choice: чтобы он не оставался без дела
  rationale: ἵνα выражает цель, а ἀργῇ — бездействие или незанятость. Формулировка сохраняет целевое значение и не усиливает его до нравственно окрашенного «не ленился».
