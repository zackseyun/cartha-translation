  text: Не смейся вместе с ним[a], чтобы не страдать вместе с ним, а в конце будешь скрежетать зубами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не смейся с ним». Греческий глагол подразумевает, что человек присоединяется к смеху другого.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συγγελάσῃς
  choice: смейся вместе с ним
  rationale: Сложный глагол означает участие в смехе другого; выражение «смеяться вместе с ним» естественно передаёт совместность действия, не уточняя сверх текста его мотив.
- source_word: συνοδυνηθῇς
  choice: страдать вместе с ним
  rationale: Сложный глагол обозначает совместное переживание боли или страдания; формулировка сохраняет параллель с «вместе с ним» в первой части.
- source_word: ἐπʼ ἐσχάτῳ
  choice: в конце
  rationale: Оборот указывает на конечный итог или последствие.
- source_word: γομφιάσεις τοὺς ὀδόντας σου
  choice: скрежетать зубами
  rationale: Глагол в сочетании с «зубами» обозначает скрежет зубов как проявление боли, досады или мучения; это устойчивое и понятное русское выражение.
