translation:
  language: ru
  text: Не давай ему полной воли в юности[a] и не оставляй без внимания его пагубные поступки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не давай ему власти в юности». Еврейский глагол может означать предоставление власти или права распоряжаться; в греческом тексте — «не давай ему власти в юности».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «его пороки» или «его губительные поступки». Смысл выражения — не терпеть и не оставлять без внимания дурные проявления поведения юноши.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תמשילהו
  choice: не давай ему полной воли
  rationale: Каузативная форма от משל означает «дать власть, позволить господствовать». В контексте наставления о воспитании естественное русское выражение «дать полную волю» передаёт мысль о предоставлении юноше бесконтрольной самостоятельности; греческое ἐξουσίαν подтверждает значение власти или свободы распоряжаться.
- source_word: בנעוריו
  choice: в юности
  rationale: Прямое и естественное обозначение периода молодости.
- source_word: תשא
  choice: не оставляй без внимания
  rationale: 'נשא имеет широкий круг значений: «нести, терпеть, прощать»; здесь в сочетании с отрицанием и обозначением дурных поступков речь, вероятно, о том, чтобы не терпеть их и не проходить мимо них. Выбор сохраняет воспитательный контекст и не вносит богословски нагруженного значения «прощать».'
- source_word: לשחיתותיו
  choice: его пагубные поступки
  rationale: שחיתות связано с порчей, разложением и причинением вреда. В данном контексте множественное число с притяжательным суффиксом естественно понимать как вредные или развращённые проявления поведения юноши.
