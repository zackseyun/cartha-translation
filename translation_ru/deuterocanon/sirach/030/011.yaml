translation_notes:
  register: Современный литературный русский язык; наставительный тон сохранён без архаизмов. «Полной воли» звучит естественно и передаёт не политическую власть, а бесконтрольность в воспитательном контексте. Обе подлинные лексические неоднозначности отмечены сносками.
