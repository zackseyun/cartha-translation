lexical_decisions:
- source_word: קנאה
  choice: ревность
  rationale: В контексте наставления о разрушительных состояниях слово обозначает губительную ревность или зависть; «ревность» сохраняет основной спектр значения, не придавая ему положительного смысла.
- source_word: דין
  choice: гнев
  rationale: Обычное значение связано с судом, однако здесь, в паре с קנאה и среди состояний, сокращающих жизнь, вероятнее значение враждебного, гневливого расположения. Неуверенность отражена в сноске.
- source_word: יקצרו ימים
  choice: сокращают дни
  rationale: Сохранён ясный и естественный по-русски древнееврейский образ преждевременного сокращения жизни.
- source_word: ובלא עת
  choice: прежде времени
  rationale: Естественно передаёт значение преждевременности.
- source_word: תזקין
  choice: старит
  rationale: 'Причинная передача глагола естественна по-русски: тревога заставляет человека преждевременно стареть.'
- source_word: דאגה
  choice: тревога
  rationale: Передаёт изнуряющее внутреннее беспокойство; звучит современно и уместно для афористической речи.
