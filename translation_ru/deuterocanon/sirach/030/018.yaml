  text: Delicacies poured out before a shut mouth are like an offering set before an idol[a][b].
translation:
  language: ru
  text: Яства, излитые перед закрытым ртом, — словно приношение, поставленное перед идолом[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское גלול — презрительное название идола; возможна передача: «мерзкий идол» или, с сохранением буквального уничижительного оттенка, «навозный идол».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте вместо «приношение, поставленное перед идолом» сказано: «кушанья, положенные у гробницы». Оба чтения сохраняют образ тщетно предложенного ценного дара.'
    reason: textual_variant
lexical_decisions:
- source_word: טובה
  choice: яства
  rationale: В контексте пищи и греческой параллели слово обозначает не отвлечённое благо, а желанную еду; «яства» передаёт конкретный смысл и сохраняет достоинство стиля.
- source_word: שפוכה
  choice: излитые
  rationale: Страдательное причастие от שפך буквально передаёт образ чего-то излитого; форма согласована с русским множественным «яства».
- source_word: על פה סתום
  choice: перед закрытым ртом
  rationale: Так естественно по-русски передаётся пища, предложенная тому, чей рот закрыт, при сохранении образа еврейского текста.
- source_word: תנופה
  choice: приношение
  rationale: Слово может быть техническим обозначением возношения, но в данном сравнении важнее общий культовый смысл дара, представленного тому, кто не способен его принять.
- source_word: מצגת
  choice: поставленное
  rationale: Передаёт причастное значение чего-то помещённого или представленного перед кем-либо.
- source_word: לפני גלול
  choice: перед идолом
  rationale: גלול — презрительное обозначение идола. Основной перевод ясно передаёт референт, а уничижительный оттенок раскрыт в примечании.
theological_decisions:
- issue: Культовый термин תנופה в сравнении из литературы мудрости
  choice: обобщённое «приношение»
  alternative: «приношение возношения» или «возношение»
  rationale: Общий вариант сохраняет культовый образ, не навязывая узкотехнического ритуального толкования там, где главный смысл — бесполезность дара.
- issue: Презрительный термин גלול
  choice: «идол» в основном тексте
  alternative: «мерзкий идол» или буквально-презрительное «навозный идол»
  rationale: «Идол» точно и естественно называет предмет, тогда как экспрессивная этимологическая окраска термина прозрачно отмечена в сноске.
- issue: Различие еврейского и греческого второго сравнения
  choice: 'следовать высокоуверенному еврейскому тексту: «перед идолом»'
  alternative: 'по греческому: «кушанья, положенные у гробницы»'
  rationale: Еврейский источник здесь сохранён и имеет высокий уровень уверенности; греческое чтение представляет значимый вариант, который следует отметить, не смешивая его с основным текстом.
translation_notes:
  register: Современный литературный русский с краткой формой мудрого изречения. «Яства» слегка возвышенно, но понятно и уместно для конкретной ценной пищи; тире и оборот «что приношение» сохраняют сжатый параллелизм оригинала.
