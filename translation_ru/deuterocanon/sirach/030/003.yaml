translation:
  language: ru
  text: Кто наставляет своего сына, тот вызовет зависть у врага[a] и перед друзьями будет радоваться ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вызовет у врага ревность». Греческий глагол может обозначать как зависть, так и ревность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ διδάσκων
  choice: Кто наставляет
  rationale: Субстантивированное причастие настоящего времени обозначает того, кто постоянно занимается наставлением; «наставляет» естественно передаёт родительское воспитание.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: своего сына
  rationale: Греческий текст прямо говорит о сыне в мужском роде и единственном числе; возвратное «своего» естественно соотносит его с подлежащим.
- source_word: παραζηλώσει
  choice: вызовет зависть
  rationale: Глагол может означать возбуждение ревности или зависти; при объекте «враг» контекстуально естественно «вызовет зависть».
- source_word: τὸν ἐχθρόν
  choice: у врага
  rationale: Определённый артикль и единственное число сохранены как обобщённое обозначение врага; конструкция с «у» требуется русским выражением «вызвать зависть у кого-либо».
- source_word: ἔναντι φίλων
  choice: перед друзьями
  rationale: Кратко и точно передаёт значение «перед, в присутствии» и сохраняет публичный характер радости.
- source_word: ἐπʼ αὐτῷ
  choice: о нём
  rationale: При глаголе радости оборот указывает на сына как предмет или повод радости; «о нём» сохраняет возможную смысловую широту.
- source_word: ἀγαλλιάσεται
  choice: будет радоваться
  rationale: Передаёт будущее время и сильную положительную радость естественным современным русским языком.
