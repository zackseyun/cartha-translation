  text: Do not give your soul over to grief[b][a], and do not stumble in your iniquity.
translation:
  language: ru
  text: Не предавай душу свою печали[a][b] и не оступись из-за собственной вины.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское לדין в этом месте трудно для истолкования. Греческий параллельный текст поддерживает значение «печаль» или «скорбь»; при чтении одних еврейских согласных возможно также значение «суд».
    reason: lexical_alternative
  - marker: b
    text: 'Греческий свидетель здесь значительно полнее: «Люби душу свою и утешай сердце своё, и удали от себя печаль, потому что печаль многих погубила и пользы в ней нет». Сохранившийся еврейский текст короче.'
    reason: alternative_reading
lexical_decisions:
- source_word: אל תתן
  choice: не предавай
  rationale: В сочетании с дополнением глагол נתן может выражать передачу или отдачу во власть чего-либо. «Не предавай» естественно передаёт призыв не поддаваться разрушительному состоянию.
- source_word: לדין
  choice: печали
  rationale: Еврейское слово в данном месте трудно для истолкования. Более полный греческий свидетель последовательно говорит о λύπη — «печали, скорби», поэтому «печали» наиболее вероятно передаёт смысл, не расширяя краткий еврейский текст.
- source_word: נפשך
  choice: душу свою
  rationale: נפש может означать душу, жизнь или самого человека. «Душу свою» сохраняет антропологический образ еврейского текста и соответствует греческому ψυχή.
- source_word: ואל תכשל
  choice: и не оступись
  rationale: כשל обозначает преткновение, падение или нравственную неудачу. «Не оступись» сохраняет метафору и звучит естественно в современном русском языке.
- source_word: בעונך
  choice: из-за собственной вины
  rationale: עון охватывает значения вины, беззакония и последствий проступка; предлог ב здесь допускает причинное понимание. Выбор передаёт личную нравственную ответственность без архаичного оборота «в беззаконии своём».
theological_decisions:
- issue: Краткое еврейское чтение и более полный греческий параллельный текст
  choice: Основной текст следует сохранившейся краткой еврейской строке; греческий текст используется для уточнения трудного לדין как «печали».
  alternative: 'Перевести более полный греческий текст: «Люби душу свою и утешай сердце своё, и удали от себя печаль, потому что печаль многих погубила и пользы в ней нет».'
  rationale: При наличии еврейского текста он остаётся основным. Греческое свидетельство помогает определить смысл трудного слова, но его дополнительные фразы не следует без обозначения включать в основной перевод.
- issue: Значение בעונך
  choice: «из-за собственной вины»
  alternative: «в своём беззаконии» или «из-за своего греха»
  rationale: Форма допускает как сферическое, так и причинное понимание, а עון может обозначать и проступок, и вину за него. Выбранная формулировка понятна современному читателю и не связывает текст с узкоконфессиональным толкованием.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным наставительным звучанием. Оборот «душу свою» сохраняет библейскую образность, тогда как «не оступись» и «из-за собственной вины» обеспечивают ясность для обычного современного читателя.
