    reason: textual_variant
lexical_decisions:
- source_word: יסר
  choice: Наставляй
  rationale: Глагол יסר обозначает исправляющее наставление, воспитание и дисциплину. «Наставляй» естественно звучит по-русски и сохраняет как воспитательный, так и исправительный смысл.
- source_word: והכבד עולו
  choice: и отягчай его ярмо
  rationale: 'Буквально: «и делай тяжёлым его ярмо». Формулировка сохраняет конкретную еврейскую метафору строгости и возложенного ограничения, не сводя её к общему понятию бремени.'
- source_word: עולו
  choice: его ярмо
  rationale: עול буквально означает «ярмо». Этот выбор сохраняет образ исходного текста и характерную для литературы мудрости метафору дисциплины как сдерживающей обязанности.
- source_word: פן
  choice: чтобы ... не
  rationale: פן вводит предостережение о нежелательном результате. Русская конструкция «чтобы ... не» передаёт это естественнее, чем архаичное «дабы не».
- source_word: באולתו
  choice: в своём безрассудстве
  rationale: אולת означает глупость, безрассудство, неразумие. «Безрассудство» подходит к серьёзному контексту последствий и сохраняет обстоятельственно-причинную неоднозначность предлога ב.
- source_word: יבלע בך
  choice: не погубил тебя
  rationale: בלע буквально значит «поглощать, проглатывать», но здесь метафорически указывает на разорение или гибель родителя из-за поведения сына. «Погубил» ясно передаёт контекстуальный смысл; буквальный образ «поглотил тебя» по-русски был бы неясен.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческой параллели
  choice: 'Основной текст следует еврейскому чтению: «чтобы он в своём безрассудстве не погубил тебя»'
  alternative: 'Греческая параллель: «воспитывай сына своего и трудись над ним, чтобы он не преткнулся из-за твоего позора»'
  rationale: Сохранившийся еврейский текст имеет высокий уровень уверенности и является первичным источником проекта. Существенно отличающееся греческое чтение не подменяет его, но приводится в сноске как важный текстовый вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством краткого изречения. Сохранена выразительная метафора ярма; синтаксис сделан естественным для современного читателя. Сноска отмечает значительное расхождение еврейского и греческого свидетельств.
