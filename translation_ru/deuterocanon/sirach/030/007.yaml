  text: He will bind up his wounds over the souls of his sons, and at every cry his inward parts will be troubled.
translation:
  language: ru
  text: Когда речь идёт о жизни своих сыновей, он перевяжет свои раны[a], и при каждом крике всё внутри у него будет содрогаться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о душах своих сыновей». Греческое ψυχή может означать как душу, так и жизнь; связь этого оборота с последующим образом перевязывания ран в греческом тексте выражена сжато.'
    reason: Сохраняет лексическую и синтаксическую неоднозначность ψυχή и περὶ, не навязывая богословского или психологического истолкования.
lexical_decisions:
- source_word: περὶ ψυχῶν υἱῶν
  choice: заботясь о жизни своих сыновей
  rationale: περί с родительным здесь передаёт предмет тревоги или заботы; ψυχαί в контексте означает жизни, а не отвлечённые «души». Такая передача сохраняет связь со страданием отца и звучит естественно по-русски.
- source_word: καταδεσμεύσει τραύματα αὐτοῦ
  choice: он будет перевязывать свои раны
  rationale: καταδεσμεύω буквально означает обвязывать или перевязывать; образ ран сохранён без истолковывающего расширения.
- source_word: ἐπὶ πάσῃ βοῇ
  choice: от каждого крика
  rationale: βοή может обозначать крик или вопль; в данном контексте естественно передано как «крик», вызывающий тревожную реакцию.
- source_word: ταραχθήσεται σπλάγχνα αὐτοῦ
  choice: его внутренности будут содрогаться
  rationale: σπλάγχνα буквально — внутренности и образно средоточие глубоких чувств. Телесная метафора сохранена, а «содрогаться» естественно выражает сильное внутреннее смятение.
theological_decisions:
- issue: Значение ψυχῶν применительно к сыновьям
  choice: жизни своих сыновей
  alternative: души своих сыновей
  rationale: Контекст родительской тревоги допускает значение «жизни»; оно не навязывает антропологического разделения души и тела и сохраняет конкретность угрозы.
translation_notes:
  register: Современный литературный русский язык с сохранением яркой телесной метафоры оригинала. Синтаксис слегка прояснён деепричастным оборотом, поскольку буквальное «о жизнях сыновей» по-русски неясно и неестественно.
