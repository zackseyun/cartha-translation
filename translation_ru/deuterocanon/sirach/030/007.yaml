revisions:
- from: Заботясь о жизни своих сыновей, он будет перевязывать свои раны, и от каждого крика его внутренности будут содрогаться.
  to: Когда речь идёт о жизни своих сыновей, он перевяжет свои раны[a], и при каждом крике всё внутри у него будет содрогаться.
  rationale: Перевод исправлен, поскольку исходное «Заботясь» безопасно заменить на передачу предметного значения περὶ без добавленного мотива. Формулировка также ближе к английской аудиторской линии («over the souls/lives of his sons»), сохраняя её неясную связь с образом ран. Сноска отмечает допустимое значение «души», не предпочитая его значению «жизнь».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:01:38Z'
review_pass:
  verdict: revise
  source_fidelity: Начальный оборот περὶ ψυχῶν υἱῶν не называет прямо действие заботы; деепричастие «Заботясь» добавляет истолкование. ψυχή здесь может означать «жизнь» (а не обязательно нематериальную душу), но связь этого оборота с последующим «перевяжет свои раны» в греческом намеренно сжата и не вполне прозрачна. «При каждом крике» точнее передаёт ἐπὶ πάσῃ βοῇ, чем причинное «от каждого крика».
  naturalness: Исправленный текст сохраняет современный литературный строй. Оборот «Когда речь идёт о жизни…» позволяет естественно передать греческое περὶ («о, относительно») без добавления мотива заботы. «Всё внутри у него будет содрогаться» передаёт образ σπλάγχνα как средоточия глубокого телесно переживаемого волнения, не создавая в русском неестественной конструкции «внутренности будут содрогаться».
  terminology: «Жизнь сыновей» передаёт ψυχῶν в его жизненном, а не доктринально-антропологическом смысле. Притяжательное «своих» в отношении сыновей следует контексту и английской аудиторской версии, хотя в данном греческом обороте местоимение выражено не повторно. «Раны» и «перевяжет» сохраняют τραύματα и καταδεσμεύσει.
  issues:
  - severity: medium
    issue: Добавлен мотив заботы в первом деепричастном обороте.
    rationale: «Заботясь о жизни своих сыновей» сужает неоднозначное περὶ ψυχῶν υἱῶν до конкретного психологического мотива. В оригинале выражена лишь связь действия с жизнью/душами сыновей.
  - severity: low
    issue: Причинная связь в «от каждого крика».
    rationale: ἐπὶ πάσῃ βοῇ буквально обозначает реакцию при, на каждый крик; «от» допустимо, но несколько сильнее формулирует причинность.
