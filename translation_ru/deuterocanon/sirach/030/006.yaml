  text: Before enemies he left behind an avenger[a], and for friends one who repays kindness.
translation:
  language: ru
  text: Перед лицом врагов он оставил после себя мстителя[a], а для друзей — того, кто воздаёт добром за добро.
  philosophy: optimal-equivalence
  footnotes:
