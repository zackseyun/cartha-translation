    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναντίον
  choice: перед лицом
  rationale: Передаёт положение перед врагами и оттенок открытого противостояния, не усиливая значение до прямого «против».
- source_word: ἐχθρῶν
  choice: врагов
  rationale: Прямой и естественный эквивалент родительного падежа множественного числа.
- source_word: κατέλιπεν
  choice: оставил после себя
  rationale: В контексте речь о сыне, который остаётся после отца и продолжает его дело.
- source_word: ἔκδικον
  choice: мстителя
  rationale: Сохраняет сильный оттенок того, кто взыскивает за причинённое зло или совершает возмездие; возможные более мягкие значения отмечены в сноске.
- source_word: τοῖς φίλοις
  choice: для друзей
  rationale: Естественно выражает направленность благого ответного действия по отношению к друзьям.
- source_word: ἀνταποδιδόντα
  choice: того, кто воздаёт
  rationale: Передаёт взаимный, ответный характер действия, выраженный приставками ἀνταπο-.
- source_word: χάριν
  choice: добром за добро
  rationale: В данном межличностном контексте χάρις означает оказанное благодеяние или доброту; идиома ясно передаёт ответную благодарность делом, не привнося богословского значения «благодать».
theological_decisions:
- issue: Нравственная окраска ἔκδικον в контексте семейной чести
  choice: мстителя
  alternative: защитника; того, кто восстановит справедливость
  rationale: Греческое слово допускает как возмездие, так и защиту или восстановление справедливости. Основной текст сохраняет более сильный и непосредственный оттенок, не оправдывая и не осуждая его; неоднозначность отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для библейской премудростной книги. Параллелизм между врагами и друзьями сохранён; эллиптическое «того» во второй части естественно соотносится с оставленным после себя сыном.
