base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/012.yaml
  text: Bend his neck in his youth[a], and break his loins while he is still small[b], lest he become stubborn and bring you bitterness of soul.
translation:
  language: ru
  text: Пригни его голову в юности и сломай ему чресла[a], пока он ещё мал, чтобы он не ожесточился[b], не восстал против тебя и не причинил тебе душевной муки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст говорит: «сломай ему чресла»; в греческой параллели: «сокруши ему бока (рёбра)».'
    reason: textual_variant
  - marker: b
    text: 'Еврейские слова, переведённые «чтобы он не ожесточился», читаются и понимаются с трудом; греческая параллель яснее: «чтобы, ожесточившись, он не ослушался тебя». Последние слова о душевной муке присутствуют в еврейском свидетельстве, но отсутствуют в греческой параллели.'
    reason: alternative_reading
lexical_decisions:
- source_word: כוף ראשו
  choice: Пригни его голову
  rationale: כוף выражает принуждение склониться или согнуться, а ראשו буквально означает «его голову». Перевод сохраняет конкретный телесный образ еврейского текста и не заменяет «голову» истолковательным «шею».
- source_word: בנערותו
  choice: в юности
  rationale: Прямое и естественное обозначение раннего возраста.
- source_word: ובקע מתניו
  choice: и переломи ему поясницу
  rationale: בקע означает рассечь, расколоть или переломить, а מתנים — чресла, бёдра или поясничную область. «Переломи ему поясницу» ясно и без смягчения передаёт резкий телесный образ, не прибегая к малопонятному современному читателю слову «чресла».
- source_word: כשהוא קטן
  choice: пока он ещё мал
  rationale: Сохраняется конкретное указание на малолетство и подчёркивается раннее время наставления.
- source_word: למה ישקה
  choice: чтобы он не ожесточился
  rationale: Еврейское чтение затруднительно. Значение передано с опорой на греческую параллель σκληρυνθεὶς — «став жёстким, ожесточившись», при этом неопределённость отмечена в сноске.
- source_word: ומרה בך
  choice: не восстал против тебя
  rationale: Еврейская формулировка обозначает непокорность или мятеж против адресата; этот смысл подтверждается греческим ἀπειθήσῃ σοι — «не послушался тебя».
- source_word: ונולד ממנו מפח נפש
  choice: и не причинил тебе душевной муки
  rationale: מפח נפש обозначает глубокое разочарование, крушение надежд или душевное страдание. Естественная русская формулировка передаёт итоговую скорбь, хотя буквально оборот говорит о возникновении душевной муки «от него».
theological_decisions:
- issue: Суровый образ телесного наказания в наставлении о воспитании
  choice: Сохранить конкретную и резкую телесную метафорику основного еврейского свидетельства.
  alternative: Смягчить до «строго воспитывай его» или «держи его в повиновении».
  rationale: И еврейский текст, и греческая параллель употребляют жёсткие телесные образы. Их абстрактное перефразирование скрыло бы напряжённость древнего наставления и внесло бы в перевод современную этическую корректировку.
- issue: Трудное чтение למה ישקה
  choice: Передать «чтобы он не ожесточился» с явной текстологической оговоркой.
  alternative: 'Следовать неясной еврейской форме буквально либо перевести общо: «чтобы он не стал упрямым».'
  rationale: Греческая параллель ясно свидетельствует о становлении жёстким или ожесточённым; такой перевод даёт связный смысл, не выдавая реконструкцию за бесспорное еврейское чтение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Резкость исходной образности сохранена; архаичное «чресла» заменено понятным словом «поясница». Все текстологические различия, существенные для смысла, вынесены в сноски.
