translation:
  language: ru
  text: Радость сердца — жизнь человека, и ликование продлевает его дни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Конец еврейской строки неясен: дошедший текст буквально читается приблизительно как «удлинил его нос (или гнев)». Греческая параллель говорит, напротив, что ревность и гнев сокращают дни; поэтому здесь передан вероятный смысл: радость продлевает дни человека.'
    reason: textual_variant
lexical_decisions:
- source_word: שמחת לב
  choice: радость сердца
  rationale: Прямая и естественная передача еврейского сочетания «радость/веселье сердца», сохраняющая внутренний, душевный смысл слова לב.
- source_word: חיי איש
  choice: жизнь человека
  rationale: Форма חיי буквально имеет вид множественного числа («жизни»), но здесь выражает целостное понятие жизни. איש употреблено в обобщённом изречении, поэтому современное русское «человека» передаёт смысл без неоправданного сужения до мужчины.
- source_word: וגיל אדם
  choice: и ликование
  rationale: גיל означает радостное ликование. Принадлежность человеку, выраженная словом אדם, в русском понятна из местоимения «его» во второй части фразы; это позволяет избежать тяжеловесного «ликование человека ... его дни».
- source_word: האריך אפו
  choice: продлевает его дни
  rationale: 'Переданный еврейский текст буквально труден: אפו обычно означает «его нос» или «его гнев». Контекст и греческая параллель, где сильные чувства сокращают дни, указывают на вероятный смысл о продлении дней. Настоящее время соответствует характеру изречения.'
theological_decisions:
- issue: Обобщённое обозначение человека в איש / אדם
  choice: Передать איש как «человек», а אדם отразить местоимением «его»
  alternative: Сохранить формальное различие как «мужчина» и «человек»
  rationale: Обе половины стиха имеют характер общего мудрого изречения. Русское «мужчина» внесло бы более узкое биологическое значение, тогда как местоименная связь сохраняет единый человеческий референт и естественный параллелизм.
- issue: Трудное окончание еврейского текста
  choice: В основном тексте передать вероятный смысл «продлевает его дни», снабдив его примечанием
  alternative: Буквально перевести «удлинило его нос/гнев» либо написать «продлевает его жизнь»
  rationale: Буквальный вариант в данном контексте не даёт ясного смысла. «Дни» осторожно учитывает греческое ἡμέρας и сохраняет библейский образ продолжительности жизни, не скрывая текстологическую трудность.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Сохранены образ «радости сердца» и библейское выражение «продлевает дни»; текстологическая неопределённость не замалчивается.
