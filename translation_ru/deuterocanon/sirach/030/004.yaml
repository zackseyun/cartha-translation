base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/004.yaml
  text: His father has died[a], yet it is as though he had not died, for he has left behind one like himself after him.
translation:
  language: ru
  text: Его отец умер, но словно и не умер, потому что оставил после себя подобного себе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «оставил после него подобного ему». По контексту речь идёт о потомке, вероятнее всего о сыне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐτελεύτησεν
  choice: умер
  rationale: Глагол означает «достиг конца» и в данном контексте прямо указывает на смерть. «Умер» передаёт смысл ясно и без добавленного эвфемизма.
- source_word: αὐτοῦ ὁ πατήρ
  choice: его отец
  rationale: Местоимение αὐτοῦ выражает принадлежность; современное русское «его отец» естественно и точно.
- source_word: ὡς οὐκ ἀπέθανεν
  choice: словно и не умер
  rationale: ὡς вводит уподобление, а не буквальное отрицание смерти. Частица «и» естественно подчёркивает парадокс исходной фразы.
- source_word: ὅμοιον αὐτῷ
  choice: подобного себе
  rationale: Субстантивированное прилагательное обозначает человека, подобного отцу, но не называет его прямо сыном; перевод сохраняет эту недосказанность.
- source_word: κατέλιπεν μετʼ αὐτόν
  choice: оставил после себя
  rationale: Сочетание указывает на того, кто остаётся жить после отца. «Оставил после себя» естественно передаёт как глагол, так и временно-последовательный смысл μετʼ αὐτόν.
theological_decisions:
- issue: Следует ли прямо назвать оставшегося потомка сыном
  choice: подобного себе
  alternative: сына, подобного себе
  rationale: Контекст говорит о сыновьях, и здесь, вероятно, подразумевается сын, однако в самой греческой фразе существительного «сын» нет. Основной текст не устраняет эту формальную недосказанность.
translation_notes:
  register: Современный литературный русский язык; изложение краткое и афористичное. Конструкция «но словно и не умер» сохраняет парадокс и риторическую силу греческого текста, а «подобного себе» не конкретизирует подразумеваемого потомка сверх сказанного в источнике.
