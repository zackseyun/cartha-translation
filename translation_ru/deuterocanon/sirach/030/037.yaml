translation:
  language: ru
  text: Ибо праздность научила многому злу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великому злу»; греческое выражение может подчёркивать как количество зла, так и его величину.'
