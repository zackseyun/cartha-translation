lexical_decisions:
- source_word: πολλὴν
  choice: многому
  rationale: При κακίαν прилагательное может указывать на большое количество или значительную степень зла. «Многому злу» естественно передаёт прежде всего количественный оттенок, не исключая усилительного.
- source_word: γὰρ
  choice: ибо
  rationale: Союз сохраняет пояснительную связь с предшествующей мыслью; «ибо» уместно в кратком назидательном изречении и остаётся понятным современному читателю.
- source_word: κακίαν
  choice: злу
  rationale: Слово обозначает зло, порочность или нравственную испорченность. Общее «зло» сохраняет широту греческого понятия и не сужает его до отдельного порока.
- source_word: ἐδίδαξεν
  choice: научила
  rationale: Аорист передан русским прошедшим временем, которое естественно выражает обобщённый, подтверждённый опытом результат и сохраняет образ праздности как учителя.
- source_word: ἡ ἀργία
  choice: праздность
  rationale: «Праздность» точно передаёт отвлечённое понятие бездействия и уклонения от труда; «лень» сильнее обозначает внутреннее качество, а «недеятельность» звучит нейтральнее исходного слова.
