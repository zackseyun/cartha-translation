translation:
  language: ru
  text: Ведь лучше, чтобы твои дети нуждались в тебе, чем тебе смотреть на руки своих сыновей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть ждать от сыновей помощи или содержания. Буквально по-гречески: «смотреть на руки своих сыновей».'
    reason: Пояснение идиоматического смысла при сохранении буквального образа в основном тексте.
lexical_decisions:
- source_word: κρεῖσσον
  choice: лучше
  rationale: Естественно передаёт сравнительное значение «лучше, предпочтительнее».
- source_word: τὰ τέκνα
  choice: твои дети
  rationale: τέκνα означает детей или потомков; притяжательное значение выражено следующим σου.
- source_word: δεηθῆναί σου
  choice: просили у тебя
  rationale: Форма δέομαι с родительным может означать «просить кого-либо, обращаться с просьбой»; в контексте подразумевается просьба о материальной поддержке, однако основной текст не усиливает её до однозначного «нищенствовать».
- source_word: ἐμβλέπειν εἰς χεῖρας
  choice: смотреть на руки
  rationale: Сохраняет конкретный зрительный образ греческого выражения, которое в данном контексте подразумевает ожидание помощи или содержания.
- source_word: υἱῶν σου
  choice: своих сыновей
  rationale: υἱῶν прямо означает «сыновей»; возвратное «своих» естественно по-русски при совпадении обладателя с субъектом инфинитивной конструкции.
theological_decisions:
- issue: Различие между τέκνα и υἱῶν
  choice: дети — сыновья
  alternative: в обоих случаях «дети»
  rationale: Сохранено различие исходного текста между общим обозначением детей и конкретным обозначением сыновей.
- issue: Образ экономической зависимости
  choice: смотреть на руки своих сыновей
  alternative: зависеть от поддержки своих сыновей
  rationale: Основной текст сохраняет телесный образ оригинала, а сноска поясняет его вероятный идиоматический смысл, не устраняя образность.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Союз «ведь» передаёт пояснительное γάρ; формулировка сохраняет семейную и экономическую напряжённость исходного текста.
