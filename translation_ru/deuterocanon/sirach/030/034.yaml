  to: Приучай его к труду, пока он ребёнок, — и обретёшь покой; ослабь над ним надзор — и он станет искать свободы[b].
  rationale: Перевод первой части и «обретёшь покой» сохранены как точные и естественные. Во второй части образ «рук» в греческом контекстуально обозначает ослабление дисциплинарного воздействия; «ослабь над ним надзор» передаёт этот смысл современным литературным русским без неудачной кальки. Отдельная лексическая сноска a не нужна, поскольку буквальная русская калька была бы неясной и не улучшала бы передачу текста. Сноска b сохранена; она разъясняет контекст, не заменяя буквальное «свободы» интерпретацией.
  reviewer_model: gpt-5.6-terra
