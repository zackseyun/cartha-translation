  naturalness: «Приучай его к труду» и «обретёшь покой» звучат хорошо. Формулировка «ослабь над ним руку» воспринимается как смешение образов и хуже передаёт практический смысл греческого ἄνες χεῖρας αὐτῷ. «Ослабь над ним надзор» естественна и сохраняет смысловую связь с дисциплиной.
