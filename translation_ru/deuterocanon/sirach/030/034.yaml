  yaml_path: translation/deuterocanon/sirach/030/034.yaml
  text: Put him to work while he is a child[a], and you will find rest; let his hands go idle[b], and he will seek freedom.
translation:
  language: ru
  text: Приучай его к труду, пока он ребёнок, — и обретёшь покой; ослабь над ним надзор — и он станет искать свободы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Здесь «свобода» означает стремление освободиться от ограничений и дисциплины, а не политическую свободу.
    reason: cultural_note
lexical_decisions:
- source_word: ἔργασαι ἐν παιδί
  choice: Приучай его к труду, пока он ребёнок
  rationale: Фраза с ἐργάζομαι и ἐν παιδί сжата и допускает оттенок «занимай его трудом / действуй так с ним в детстве». Выбранная формулировка естественно передаёт наставление приучать ребёнка к упорядоченному труду, не усиливая его до жестокого «заставляй».
- source_word: εὑρήσεις ἀνάπαυσιν
  choice: обретёшь покой
  rationale: ἀνάπαυσις означает покой или облегчение; «обретёшь покой» сохраняет образ и афористичность греческой фразы.
- source_word: ἄνες χεῖρας αὐτῷ
  choice: ослабь над ним руку
  rationale: ἄνες от ἀνίημι значит «ослабь, отпусти», а χεῖρας αὐτῷ буквально связано с руками и отношением к нему. Русский оборот передаёт ослабление дисциплины или надзора, сохраняя образ руки.
- source_word: ζητήσει ἐλευθερίαν
  choice: он станет искать свободы
  rationale: 'ἐλευθερία буквально означает «свобода». Перевод сохраняет исходное слово и контекстуальную напряжённость: здесь речь идёт о стремлении выйти из-под установленной дисциплины, а не о политической свободе.'
theological_decisions:
- issue: Мужской род и единственное число в наставлении о ребёнке
  choice: 'Сохранить мужской род: «его… он»'
  alternative: Передать обобщённо и без указания пола
  rationale: Греческий текст продолжает речь о конкретном ребёнке посредством αὐτῷ и подразумеваемого подлежащего единственного числа; сохранение мужского рода не превращает высказывание в универсально-нейтральную формулу.
- issue: Нравственный смысл ἐλευθερία
  choice: Сохранить буквальное «свобода» и пояснить контекст в сноске
  alternative: Истолковать непосредственно как «своеволие» или «непослушание»
  rationale: Более оценочные варианты устранили бы намеренную смысловую напряжённость между свободой и дисциплиной, присутствующую в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным афористическим строем. Тире подчёркивают две параллельные пары действия и следствия; архаизмы и конфессионально окрашенные выражения исключены.
