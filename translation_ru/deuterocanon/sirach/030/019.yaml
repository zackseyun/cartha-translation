translation:
  language: ru
  text: Какая польза от идолов народов[a], которые не едят и не чувствуют запахов?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте далее: «Так и тот, кого Господь изгоняет».'
    reason: alternative_reading
lexical_decisions:
- source_word: מה יעריכו
  choice: Что пользы
  rationale: Еврейское выражение ставит риторический вопрос о ценности или пользе; греческое τί συμφέρει подтверждает оттенок практической бесполезности.
- source_word: לאלילי הגוים
  choice: в идолах народов
  rationale: Передаёт принадлежность идолов другим народам без конфессионально окрашенного слова «язычники»; конструкция естественно сочетается с «что пользы».
- source_word: אשר לא יאכלון
  choice: которые не едят
  rationale: Прямо передаёт относительное придаточное, подчёркивающее безжизненность идолов.
- source_word: ולא יריחון
  choice: и не обоняют
  rationale: Сохраняет буквальный смысл глагола «обонять, ощущать запах» и отличие этого действия от вкушения; «обоняют» здесь точнее, чем допускающее иной смысл «не чувствуют».
theological_decisions:
- issue: Включать ли продолжение, имеющееся в греческом тексте, но отсутствующее в сохранившемся еврейском свидетельстве
  choice: В основном тексте переведена только еврейская фраза
  alternative: 'Добавить: «Таков и тот, кого прогнал Господь»'
  rationale: Там, где еврейский текст Сираха сохранился, он является основным источником. Значимое греческое добавление отмечено в сноске, чтобы не скрывать текстовое различие.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос передан кратко и достойно. Слово «народы» сохраняет еврейскую формулировку и избегает лишней церковной окраски.
