  source_fidelity: 'Основной текст верно передаёт еврейский риторический вопрос о бесполезности идолов и сохраняет два признака их безжизненности: они не едят и не воспринимают запахов. Греческое продолжение обоснованно вынесено в сноску, поскольку его нет в данном еврейском свидетельстве.'
  naturalness: Оборот «Что пользы в идолах» понятен, но «Какая польза от идолов» более обычен в современном литературном русском. Непереходное употребление «обоняют» без дополнения звучит несколько тяжеловесно; «чувствуют запахов» естественнее и сохраняет смысл.
  terminology: «Идолы народов» точно передаёт אֱלִילֵי הַגּוֹיִם и уместно по регистру. «Господь» в сноске соответствует греческому Κύριος; глагол следует передать как продолжающееся пассивное действие, а не как завершённое «прогнал».
  issues:
