  - severity: low
    issue: «Не обоняют» без указанного объекта звучит не вполне естественно в современном русском.
    rationale: «Не чувствуют запахов» ясно выражает отсутствие способности воспринимать запахи и не меняет смысла еврейского יריחון.
  - severity: medium
