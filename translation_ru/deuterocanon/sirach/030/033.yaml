    reason: alternative_reading
lexical_decisions:
- source_word: χορτάσματα
  choice: корм
  rationale: Обозначает пищу для животного; «корм» естественно и конкретно передаёт образ.
- source_word: ῥάβδος
  choice: палка
  rationale: В данном контексте это орудие понуждения или наказания. «Жезл» звучит возвышенно и может вызвать неверные ассоциации, а «посох» предполагает опору.
- source_word: φορτία
  choice: поклажа
  rationale: Слово обозначает груз, который несут. «Поклажа» хорошо сочетается с образом навьюченного осла и сохраняет краткий ряд существительных.
- source_word: ὄνῳ
  choice: ослу
  rationale: Точный и нейтральный современный эквивалент.
- source_word: ἄρτος
  choice: хлеб
  rationale: Греческий текст прямо называет хлеб; конкретный образ не следует обобщать до «пищи».
- source_word: παιδεία
  choice: воспитание
  rationale: Слово охватывает обучение, приучение к порядку и исправление. «Воспитание» сохраняет эту широту, тогда как «наказание» чрезмерно сужает смысл.
- source_word: ἔργον
  choice: работа
  rationale: Прямой современный эквивалент, сохраняющий лаконизм изречения.
- source_word: οἰκέτῃ
  choice: домашнему рабу
  rationale: οἰκέτης обозначает зависимого члена домашнего хозяйства, нередко раба. Такой перевод передаёт и домашнюю сферу, и несвободный социальный статус.
theological_decisions:
- issue: Социальный статус οἰκέτης
  choice: домашний раб
  alternative: слуга; домашний слуга
  rationale: В контексте предписанных хлеба, воспитания и работы подчёркнута подчинённость зависимого работника. «Домашний раб» прозрачнее передаёт историческую реальность, не смягчая её словом «слуга».
- issue: Диапазон значения παιδεία
  choice: воспитание
  alternative: обучение; приучение к порядку; исправление; наказание
  rationale: Контекст допускает как обучение и формирование поведения, так и исправительную строгость. Основной текст сохраняет широкое значение, а примечание отмечает возможный оттенок.
translation_notes:
  register: Краткое, ритмичное изречение с опущенной связкой передано двумя параллельными рядами и тире. Лексика современная и достойная; «поклажа» слегка книжное, но понятное слово, точно соответствующее образу вьючного осла.
