translation:
  language: ru
  text: Корм, палка и грузы — ослу; хлеб, воспитание[a] и работа — домашнему рабу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приучение к порядку», «исправление»; греческое слово может включать обучение, воспитание и наказание.'
