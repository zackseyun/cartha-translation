lexical_decisions:
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: При жизни
  rationale: Естественная русская временная конструкция, точно передающая значение «в течение его жизни».
- source_word: εἶδεν
  choice: увидел
  rationale: Объект глагола в данном предложении не назван, поэтому он не добавлен в переводе и смысловая открытость греческого текста сохранена.
- source_word: εὐφράνθη
  choice: обрадовался
  rationale: Передаёт сильную положительную эмоциональную реакцию без архаизации речи.
- source_word: ἐν τῇ τελευταῖ αὐτοῦ
  choice: на исходе жизни
  rationale: Естественно и сжато обозначает заключительную пору его жизни; возможные оттенки отражены в сноске.
- source_word: οὐκ ἐλυπήθη
  choice: не был огорчён
  rationale: Сохраняет пассивную форму и эмоциональный смысл греческого выражения, не уточняя неназванную причину огорчения.
