  text: Так бывает с тем, у кого есть богатство, но кто не получает от него удовольствия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте мысль развёрнута образно: «глядит и стонет, словно евнух, обнимающий девственницу и стонущий». Этот образ поясняет речь о том, кто обладает богатством, но не получает от него удовольствия или пользы.'
    reason: alternative_reading
lexical_decisions:
- source_word: כן
  choice: Так и тот
  rationale: Вводит сопоставление с предшествующим образом; эта формулировка естественно передаёт сравнительно-притчевый смысл.
- source_word: מי שיש לו
  choice: тот, у кого есть
  rationale: Естественно передаёт еврейскую конструкцию обладания и неопределённо-личное значение, не добавляя указания на пол.
- source_word: עושר
  choice: богатство
  rationale: Обозначает материальный достаток; современное нейтральное слово точнее архаизирующего «богатства» во множественном числе.
- source_word: ואין נהנה ממנו
  choice: но кто не пользуется им
  rationale: נהנה может означать получение удовольствия или пользы. «Не пользуется им» сохраняет обе стороны смысла лучше, чем более узкое «не наслаждается им».
