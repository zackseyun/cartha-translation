  text: Gladness of heart is a man's life, and a man's rejoicing prolongs his days.[a]
translation:
  language: ru
  text: Радость сердца — жизнь человека, и ликование мужчины продлевает его дни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст этого стиха труден и резко отличается от греческой традиции. Перевод следует ясному смыслу греческого параллельного текста: «Радость сердца — жизнь человека, и ликование мужчины продлевает его дни».'
    reason: textual_variant
lexical_decisions:
- source_word: εὐφροσύνη καρδίας
  choice: радость сердца
  rationale: Передаёт внутреннюю радость и сохраняет библейское представление о сердце как средоточии внутренней жизни.
- source_word: ζωὴ ἀνθρώπου
  choice: жизнь человека
  rationale: Сохраняет единственное число и обобщающее значение ἄνθρωπος в естественной современной русской форме.
- source_word: ἀγαλλίαμα
  choice: ликование
  rationale: Передаёт не только состояние радости, но и её деятельное, выраженное проявление.
- source_word: ἀνδρός
  choice: мужчины
  rationale: Греческое ἀνήρ обозначает мужчину; современное «мужчины» точнее и понятнее, чем неоднозначное русское «мужа».
- source_word: μακροημέρευσις
  choice: продлевает его дни
  rationale: Естественно выражает смысл долгоденствия и сохраняет библейский образ продления дней.
theological_decisions:
- issue: Резкое расхождение сохранившегося еврейского текста и греческой традиции
  choice: Основной текст переведён по ясному греческому параллельному свидетельству, а расхождение отмечено в сноске.
  alternative: Буквально передать дошедший еврейский текст о деве, насилии при совершении суда и взыскании со стороны Яхве.
  rationale: Предоставленный еврейский текст по смыслу не соответствует греческому стиху и, вероятно, отражает повреждение, иной фрагмент либо серьёзное текстовое расхождение. Его буквальный перевод как бесспорного текста Сир 30:22 ввёл бы читателя в заблуждение; греческое свидетельство даёт связный и устойчивый смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Конструкция краткая и афористичная; «мужчины» выбрано вместо архаичного и двусмысленного «мужа».
