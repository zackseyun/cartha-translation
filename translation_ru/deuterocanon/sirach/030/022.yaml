review_pass:
  verdict: revise
  source_fidelity: 'Основной текст черновика передаёт греческий параллельный текст, но не еврейский текст, указанный как исходный и имеющий высокую уверенность. Еврейское свидетельство содержит иное изречение: сопоставление с тем, кто ложится с девицей, затем — с тем, кто совершает суд принуждением, и взыскание со стороны Яхве. Поскольку расхождение существенно, греческий вариант следует отразить в сноске, а не подменять им основной перевод без обозначения этого в самом тексте.'
  naturalness: «Радость сердца — жизнь человека» звучит по-русски хорошо, но относится к иному тексту. В исправленном варианте «вершит суд принуждением» сохраняет краткость и намеренно не уточняет характер принуждения сверх еврейского выражения.
  terminology: «Яхве» соответствует тетраграмматону יהוה в предоставленном еврейском тексте. «С девицей» передаёт בתולה без навязывания вывода о согласии или несогласии; «взыщет с его руки» передаёт образ ответственности в еврейском выражении.
  issues:
  - severity: high
    issue: Основной текст переведён по греческому параллелю, а не по предоставленному еврейскому исходному тексту.
    rationale: Греческое «Радость сердца…» не имеет соответствия в указанном еврейском тексте. При обзоре исходного языка прежде всего нельзя выдавать перевод иной текстовой традиции за перевод еврейского стиха.
  - severity: medium
    issue: Сноска описывает расхождение, но не даёт читателю содержания альтернативного еврейского чтения.
    rationale: При настолько резком расхождении сноска должна ясно указать, что греческий текст содержит другое изречение, а не только назвать еврейский текст трудным.
  revised_text: Как тот, кто ложится с девицей, так и тот, кто вершит суд принуждением; Яхве взыщет с его руки.[a]
  revised_footnotes:
  - marker: a
    text: 'Дошедший еврейский текст резко отличается от греческой традиции. Греческий параллельный текст читает: «Радость сердца — жизнь человека, и ликование мужчины продлевает его дни». Еврейская формулировка трудна; перевод передаёт её без дальнейшего уточнения образов «ложится с девицей» и «вершит суд принуждением».'
    reason: textual_variant
  revision_rationale: Исправление восстанавливает содержание предоставленного еврейского текста как исходного свидетельства. Спорные и потенциально нагруженные выражения переданы сдержанно и буквально, без интерпретационного расширения; совершенно иной греческий параллельный текст сохранён в сноске как важный текстологический вариант.
