  text: On the day your life's days are completed, and at the time of your death, distribute your inheritance.
translation:
  language: ru
  text: В день, когда завершатся дни твоей жизни[a], и в час твоей смерти распредели своё наследство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в день завершения дней твоей жизни». Греческое выражение сжато и допускает также перевод: «в день, когда дни твоей жизни подойдут к концу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἡμέρᾳ συντελείας ἡμερῶν ζωῆς σου
  choice: В день, когда завершатся дни твоей жизни
  rationale: Греческое выражение буквально говорит о «дне завершения дней твоей жизни». Придаточная конструкция сохраняет образ и смысл, но звучит естественнее по-русски.
- source_word: ἐν καιρῷ τελευτῆς
  choice: в час твоей смерти
  rationale: καιρός обозначает определённое время или срок, а τελευτή здесь, в контексте распоряжения наследством, естественно означает смерть. «В час» передаёт наступление решающего времени и соответствует литературному русскому регистру.
- source_word: διάδος
  choice: распредели
  rationale: Аористный императив требует однократного решительного действия; глагол может означать передачу или раздачу. «Распредели» точно подходит к распоряжению наследством.
- source_word: κληρονομίαν
  choice: своё наследство
  rationale: 'Основное значение — «наследство». Возвратное местоимение добавлено по ясному контексту: адресат должен распорядиться принадлежащим ему имуществом.'
theological_decisions:
- issue: Смысл наставления о наследстве
  choice: Практический совет распорядиться своим наследством при завершении жизни
  alternative: Общий призыв к щедрости перед смертью
  rationale: Упоминание смерти и κληρονομία указывает прежде всего на распоряжение наследством. Перевод не расширяет этот смысл до общего богословского учения о щедрости.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Сохранены образ «дней жизни» и параллелизм временных выражений; синтаксис слегка развёрнут ради естественности.
