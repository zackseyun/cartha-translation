  text: Дай покой душе своей[a], обрадуй сердце своё и удали от себя гнев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст этого места труден, а сохранившийся греческий текст данного стиха имеет существенно иное содержание. Перевод следует еврейскому свидетельству; слово «обрадуй» передаёт вероятный по контексту смысл неясной глагольной формы.
    reason: textual_variant
lexical_decisions:
- source_word: פוג נפשך
  choice: Дай отдых душе своей
  rationale: Императив פוג передаёт ослабление напряжения, успокоение или предоставление покоя. Русское выражение сохраняет направленность действия на внутреннего человека и звучит естественно в наставлении.
- source_word: נפשך
  choice: душе своей
  rationale: נפש здесь обозначает внутреннее «я» или жизнь человека. «Душа» сохраняет антропологическую ёмкость слова, не навязывая строгого противопоставления души и тела.
- source_word: ופיג
  choice: обрадуй
  rationale: Форма трудна для истолкования. В параллели с первой строкой и перед предостережением от гнева она, вероятно, описывает благотворное восстановление внутреннего состояния; «обрадуй» передаёт этот смысл, не маскируя неопределённость, отмеченную в сноске.
- source_word: לבך
  choice: сердце своё
  rationale: לב — внутренний центр мысли, воли и чувства; «сердце» является естественным и традиционно понятным русским соответствием.
- source_word: וקצפון
  choice: и гнев
  rationale: Существительное обозначает гнев или ярость. «Гнев» точно и естественно подходит к нравственному наставлению.
- source_word: הרחק ממך
  choice: удали от себя
  rationale: Императив выражает активное отстранение. «Удали от себя» сохраняет повелительную силу и образ дистанцирования.
theological_decisions:
- issue: Антропологический смысл נפש
  choice: душе своей
  alternative: себе; жизни своей
  rationale: «Душа» сохраняет глубину речи о внутреннем человеке, но сама по себе не утверждает жёсткого дуализма души и тела.
- issue: Трудный еврейский текст и существенно отличающийся греческий параллельный текст
  choice: Следовать сохранившемуся еврейскому свидетельству и открыто отметить неуверенность в сноске.
  alternative: Передать ופיג буквально как «ослабь» либо последовать греческому тексту, описывающему бодрствование после сборщиков винограда.
  rationale: Еврейский текст для Сираха здесь является первичным свидетельством, тогда как приведённый греческий текст явно отражает существенно иную строку. Разночтение нельзя молча согласовывать или скрывать.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой мудрого наставления. Синтаксический параллелизм еврейской строки сохранён; архаизмы и конфессионально окрашенные формулы не вводятся.
