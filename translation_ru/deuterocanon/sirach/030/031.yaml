lexical_decisions:
- source_word: ἐν πᾶσι τοῖς ἔργοις σου
  choice: Во всех своих делах
  rationale: Передаёт всеохватность πᾶσι и обычное значение ἔργοις — «дела, поступки»; по-русски звучит естественно и близко к форме греческого текста.
- source_word: γίνου ὑπεράγων
  choice: будь превосходен
  rationale: γίνου здесь выражает призыв к постоянному образу действий, а ὑπεράγων — превосходство, выдающееся качество. Формулировка сохраняет несколько необычный, но понятный образ оригинала.
- source_word: μὴ δῷς μῶμον
  choice: не пятнай
  rationale: Буквальное «не дай порока/пятна» по-русски неидиоматично. Глагол «пятнать» естественно передаёт образ μῶμον как изъяна или пятна, нанесённого доброму имени.
- source_word: ἐν τῇ δόξῃ σου
  choice: своей чести
  rationale: В данном наставлении δόξα означает общественное достоинство, честь или доброе имя, а не обязательно богословскую «славу». «Честь» кратко сохраняет этот смысл.
