translation:
  language: ru
  text: Годы, прожитые с радостным сердцем, лучше лакомств[b][a], и пища его будет ему на пользу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «Годы доброго сердца вместо лакомств, и пища его поднимется на него». Смысл второй части, вероятно, в том, что пища полезна человеку или хорошо им усваивается.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст Свита под этим номером содержит иное изречение: не давать при жизни власти над собой и своим имуществом ни сыну, ни жене, ни брату, ни другу. Таким образом, еврейское свидетельство здесь представляет существенно иную текстовую традицию.'
    reason: textual_variant
lexical_decisions:
- source_word: שנות
  choice: Годы с
  rationale: Сохраняет образ продолжительного времени, выраженный еврейским множественным числом в сопряжённой конструкции, не сглаживая его до «вся жизнь».
- source_word: לב טוב
  choice: радостным сердцем
  rationale: В контексте премудрости выражение обозначает внутреннее благополучие и бодрость; «радостное сердце» естественно передаёт этот смысл, не сводя его к одной лишь нравственной доброте.
- source_word: תחת
  choice: лучше
  rationale: 'Предлог буквально означает «вместо, взамен», но здесь выражает подразумеваемое предпочтение: годы сердечной радости предпочтительнее изысканной еды.'
- source_word: מטעמים
  choice: лакомств
  rationale: Слово обозначает вкусные, изысканные блюда; «лакомства» передаёт этот смысл современно и кратко.
- source_word: ומאכלו
  choice: и пища его
  rationale: Местоименный суффикс имеет мужской род и естественнее всего относится к человеку с радостным сердцем. Сохранён порядок, близкий к еврейскому.
- source_word: יעלה עליו
  choice: пойдёт ему на пользу
  rationale: Буквально «поднимется на него»; по смыслу речь о том, что пища благотворна или хорошо усваивается. Русская формулировка передаёт смысл без неясного буквализма.
