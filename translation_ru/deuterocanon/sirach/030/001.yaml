translation:
  language: ru
  text: Кто любит своего сына, тот будет усердно наказывать его бичом[a], чтобы под конец порадоваться[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет настойчиво подвергать его бичеванию». Греческий глагол указывает на усердие, постоянство или настойчивость действия, а существительное может означать «бичи», «удары бичом» или «бичевания».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «при последних его [обстоятельствах]». Оборот может относиться к поздней поре, конечному исходу или завершению жизни; местоименная отсылка в греческом не вполне однозначна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀγαπῶν τὸν υἱὸν αὐτοῦ
  choice: Кто любит своего сына
  rationale: Субстантивированное причастие имеет обобщающий, пословичный смысл; υἱός означает именно «сын».
- source_word: ἐνδελεχήσει
  choice: будет постоянно
  rationale: Глагол передаёт настойчивое, усердное или продолжающееся действие. «Постоянно» сохраняет аспект длительности, не сводя смысл лишь к готовности наказать.
- source_word: μάστιγας αὐτῷ
  choice: наказывать его розгой
  rationale: Греческое множественное μάστιγας обозначает бичи, удары бичом или бичевания. В контексте воспитания «наказывать розгой» естественно по-русски и сохраняет конкретный образ телесного наказания, не заменяя его отвлечённым «воспитывать» или «исправлять».
- source_word: ἵνα εὐφρανθῇ
  choice: чтобы … порадоваться
  rationale: Форма выражает цель или ожидаемый результат; подразумеваемым субъектом остаётся любящий отец.
- source_word: ἐπʼ ἐσχάτων αὐτοῦ
  choice: в конце … за него
  rationale: Греческое выражение допускает понимание как поздней поры, конечного исхода или завершения жизненного пути сына. Краткая русская формулировка сохраняет эту широту, а «за него» естественно передаёт повод для радости.
theological_decisions:
- issue: Конкретный образ телесного наказания
  choice: Сохранить образ розги
  alternative: 'Передать отвлечённо: «воспитывать», «исправлять» или «наказывать» без указания орудия'
  rationale: μάστιγας прямо называет бичи или бичевания. Перевод не должен смягчать нравственную напряжённость исходного текста либо превращать её в поддержку какой-либо современной воспитательной практики.
- issue: Неоднозначность выражения ἐπʼ ἐσχάτων αὐτοῦ
  choice: «в конце порадоваться за него» с пояснением в сноске
  alternative: «в последние дни его жизни» или «при его кончине»
  rationale: Более узкие варианты преждевременно отождествляют «последнее» либо со старостью, либо со смертью, тогда как греческий оборот может указывать шире на конечный жизненный итог.
translation_notes:
  register: Современный литературный русский язык с кратким пословичным строем. Формулировка сохраняет мужской род и конкретность «сына», явный образ телесного наказания и смысловую широту заключительного оборота; архаизмы вроде «бичевать чадо» исключены.
