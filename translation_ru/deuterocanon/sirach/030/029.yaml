  text: As long as you still live and breath is in you[a], do not give yourself over to any flesh.
translation:
  language: ru
  text: Пока ты ещё жив и в тебе есть дыхание, не отдавай себя ни одному смертному.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «никакой плоти». Здесь греческое слово «плоть», вероятно, означает смертного человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔτι ζῇς
  choice: Пока ты ещё жив
  rationale: Передаёт временное значение ἕως и подчёркивающий смысл ἔτι («ещё»), сохраняя естественный русский порядок слов.
- source_word: πνοὴ ἐν σοί
  choice: в тебе есть дыхание
  rationale: Сохраняет телесный образ дыхания как признака жизни и близко следует греческой конструкции.
- source_word: μὴ ἀλλάξῃς σεαυτὸν
  choice: не отдавай себя
  rationale: Буквальное «не меняй себя» в данном сочетании по-русски неясно. С рефлексивным дополнением и последующим дательным оборотом выражение, вероятно, предостерегает от передачи себя в распоряжение другого; формулировка не добавляет явно не выраженного слова «власть».
- source_word: πάσῃ σαρκί
  choice: никакой плоти
  rationale: Дательный падеж передан согласно управлению русского выражения «отдавать себя кому». Отрицательное местоимение естественно выражает распределительное значение πᾶς при отрицании, а «плоть» сохраняет исходный антропологический образ.
theological_decisions:
- issue: Значение σάρξ в контексте небиблейской мудрости, а не специальной павловской терминологии
  choice: плоть
  alternative: человек; смертный человек
  rationale: Здесь «плоть», вероятнее всего, обозначает смертного человека вообще, а не греховную природу. Сохранение образа не навязывает специального догматического смысла; идиоматическое значение поясняется в сноске.
- issue: Неоднозначность ἀλλάσσω с возвратным местоимением и дательным дополнением
  choice: не отдавай себя
  alternative: не променяй себя; не предавай себя; не подчиняй себя
  rationale: Выбранный вариант делает наставление понятным, но не уточняет без достаточных оснований, идёт ли речь именно о власти, суде или распоряжении другого человека.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной интонацией наставления. Сохранены образ дыхания и необычное слово «плоть»; его контекстуальное значение разъяснено в сноске.
