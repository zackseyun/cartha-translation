translation:
  language: ru
  text: Жизнь бедняка лучше чистого золота[a], а добрый дух — жемчуга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Здоровье и благополучие лучше всякого золота, а крепкое тело — несметного богатства». Еврейский и греческий тексты здесь существенно расходятся, что может указывать на иной вариант текстовой традиции или на повреждение сохранившегося еврейского текста.'
    reason: textual_variant
lexical_decisions:
- source_word: חיי
  choice: Жизнь
  rationale: Форма сопряжённого состояния от חַיִּים здесь передаёт понятие жизни и сохраняет краткость изречения.
- source_word: שר
  choice: бедняка
  rationale: Трудное чтение еврейского свидетеля в данном контексте понято как обозначение бедного или нуждающегося человека; греческий параллельный текст отражает иное чтение.
- source_word: איביתי
  choice: лучше
  rationale: 'Форма текстологически трудна, но параллельная сравнительная конструкция и греческое βελτίων поддерживают значение превосходства: «лучше».'
- source_word: מפז
  choice: чистого золота
  rationale: פז обозначает золото высшего качества; «чистое золото» естественно передаёт его исключительную ценность.
- source_word: ורוח טובה
  choice: а добрый дух
  rationale: Дословное и достаточно широкое выражение, которое может охватывать внутреннее состояние, расположение духа и жизненную силу, не сводя смысл только к весёлому настроению.
- source_word: מפנינים
  choice: жемчуга
  rationale: פנינים обычно обозначает жемчуг либо сходную драгоценность; «жемчуг» — понятное и традиционно обоснованное соответствие.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческого параллельного свидетельства
  choice: 'В основном тексте сохранено еврейское чтение: «Жизнь бедняка… а добрый дух…».'
  alternative: 'Греческое чтение: «Здоровье и благополучие лучше всякого золота, а крепкое тело — несметного богатства».'
  rationale: Поскольку еврейский текст сохранился, основной перевод следует ему. Существенно отличающееся греческое свидетельство приведено в сноске, чтобы не скрывать возможную иную текстовую традицию или повреждение еврейского текста.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная форма. Лексика понятна широкому читателю, при этом сохранены достоинство и смысловая широта еврейского выражения.
