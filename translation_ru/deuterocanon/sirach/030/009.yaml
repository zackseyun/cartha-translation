  text: Discipline your son[a], lest you be put to shame; but if you play with him, he will humiliate you.
translation:
  language: ru
  text: Воспитывай сына своего[a], чтобы тебе не пришлось стыдиться; а будешь играть с ним — он тебя опозорит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Лелей ребёнка — и он изумит тебя; играй с ним — и он огорчит тебя». Еврейский текст вместо этого гласит: «Воспитывай сына своего… он тебя опозорит».'
    reason: alternative_reading
lexical_decisions:
- source_word: יסר
  choice: Наставляй
  rationale: Еврейский глагол обозначает исправляющее наставление и дисциплину. «Наставляй» естественно звучит по-русски и сохраняет воспитательный, корректирующий смысл, не сводя его к наказанию.
- source_word: בנך
  choice: сына своего
  rationale: 'В еврейском тексте прямо употреблено существительное мужского рода в единственном числе: «твой сын»; род и число сохранены.'
- source_word: לבל תבוש
  choice: чтобы тебе не покрыться стыдом
  rationale: Оборот выражает цель или предотвращение результата. «Покрыться стыдом» передаёт как личный стыд, так и публичное бесчестье.
- source_word: תשחק עמו
  choice: будешь играть с ним
  rationale: Сохранено конкретное значение глагола שׂחק — «играть, забавляться». Контекст может подразумевать излишнюю фамильярность или потакание, но это толкование не внесено в основной текст.
- source_word: יכלימך
  choice: он тебя опозорит
  rationale: Форма от כלם означает причинить стыд, посрамить или унизить. «Опозорит» ясно передаёт активное действие сына и общественный аспект стыда.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и отличающимся греческим параллельным чтением
  choice: Основной текст переведён по достоверно засвидетельствованному еврейскому чтению.
  alternative: 'Греческое чтение: «Лелей ребёнка — и он изумит тебя; играй с ним — и он огорчит тебя».'
  rationale: Сохранившийся еврейский текст имеет высокую степень достоверности и даёт связное наставление о воспитании сына и возможном позоре родителя. Отличия греческого текста не сглажены, а отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Сына своего» придаёт фразе умеренно возвышенное библейское звучание, оставаясь понятным современному читателю.
