base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/038.yaml
  text: Put him to work as is fitting for him[a], and if he does not obey, make his fetters heavy. But do not be excessive with any flesh, and do nothing without judgment.
translation:
  language: ru
  text: Поручи ему работу, которая ему подходит; и если он не повинуется, утяжели его оковы. Но не проявляй чрезмерности ни с кем[a] и ничего не делай без рассуждения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со всякой плотью»; это оборот, обозначающий любого человека.'
    reason: Сноска сохраняет буквальный образ греческого выражения ἐν πάσῃ σαρκί и поясняет его идиоматический смысл.
lexical_decisions:
- source_word: εἰς ἔργα κατάστησον
  choice: Поручи ему работу
  rationale: Передаёт каузативное значение κατάστησον и направленность на труд естественным современным русским выражением, не добавляя идеи надзора или конкретного вида работ.
- source_word: καθὼς πρέπει αὐτῷ
  choice: какая ему подобает
  rationale: Сохраняет значение уместности и соответствия, выраженное πρέπει, в литературном и понятном регистре.
- source_word: κἂν μὴ πειθαρχῇ
  choice: и если он не повинуется
  rationale: πειθαρχέω означает подчинение власти или установленному порядку; отдельного существительного «дисциплина» в греческом тексте нет.
- source_word: βάρυνον τὰς πέδας αὐτοῦ
  choice: утяжели его оковы
  rationale: Буквально передаёт βάρυνον и πέδαι, не подменяя образ указанием «затянуть» цепи, которого в источнике нет.
- source_word: μὴ περισσεύσῃς
  choice: не будь чрезмерно суров
  rationale: Глагол предостерегает от превышения меры; добавление «суров» естественно раскрывает подразумеваемый в данном контексте вид чрезмерности после упоминания оков.
- source_word: ἐν πάσῃ σαρκί
  choice: ни с кем
  rationale: В этом семитизированном обороте «всякая плоть» обозначает любого человека. Идиоматический перевод помещён в текст, а буквальный образ сохранён в сноске.
- source_word: ἄνευ κρίσεως
  choice: без рассуждения
  rationale: Сохраняет возможные оттенки κρίσις — обдуманное суждение, различение и взвешенное решение — и не сужает смысл до формального судебного разбирательства.
- source_word: μὴ ποιήσῃς μηδέν
  choice: ничего не делай
  rationale: Прямо и естественно передаёт усиленное греческое запрещение.
theological_decisions:
- issue: Значение σάρξ в выражении ἐν πάσῃ σαρκί
  choice: ни с кем, с буквальным образом в сноске
  alternative: ни с какой плотью / по отношению ко всякой плоти
  rationale: Здесь σάρξ обозначает людей вообще, вероятно с оттенком их телесной слабости, а не особую богословскую категорию. Основной текст передаёт смысл по-русски, а сноска сохраняет образ и возможный антропологический оттенок.
- issue: Значение κρίσις
  choice: рассуждение
  alternative: суд / суждение / осмотрительность
  rationale: Контекст наставления допускает как внутреннее рассуждение, так и вынесение взвешенного решения. «Рассуждение» не превращает фразу в исключительно юридическое предписание и сохраняет её мудростный характер.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис остаётся ясным для широкого читателя; слова «подобает» и «оковы» поддерживают достоинство регистра без излишней архаизации.
