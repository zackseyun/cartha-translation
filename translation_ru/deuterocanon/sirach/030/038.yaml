    rationale: Смысл верен, но современный литературный русский естественнее выражает это как «работу, которая ему подходит».
  revised_text: Поручи ему работу, которая ему подходит; и если он не повинуется, утяжели его оковы. Но не проявляй чрезмерности ни с кем[a] и ничего не делай без рассуждения.
