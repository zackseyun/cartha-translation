  text: If you mistreat him and send him away[a], he will run off; on what road will you look for him?
translation:
  language: ru
  text: Если ты станешь плохо с ним обращаться и отошлёшь его, он убежит; по какой дороге ты будешь искать его?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: Если
  rationale: Сохраняет открытое условное значение греческой конструкции.
- source_word: κακώσῃς
  choice: станешь плохо с ним обращаться
  rationale: Передаёт широкий межличностный смысл причинения зла или дурного обращения, не ограничивая его физическим насилием.
- source_word: ἀπάρᾳς
  choice: прогонишь его
  rationale: В сочетании с последующим ἀποδρᾷ обозначает удаление человека, вслед за которым тот убегает; «прогонишь» естественно передаёт эту причинную связь.
- source_word: ἀποδρᾷ
  choice: он убежит
  rationale: Передаёт конкретный смысл бегства или побега и форму будущего времени.
- source_word: ἐν ποίᾳ ὁδῷ
  choice: на какой дороге
  rationale: Сохраняет конкретный образ дороги и риторическую заострённость вопроса, не сводя выражение к общему «где».
- source_word: ζητήσεις
  choice: ты будешь искать
  rationale: Точно передаёт будущее время и значение поиска в риторическом вопросе.
