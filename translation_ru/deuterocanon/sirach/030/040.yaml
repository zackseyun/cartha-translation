  source_fidelity: «Прогонишь» несколько усиливает ἀπάρᾳς, которое в данном контексте означает «отослать / удалить». «Отошлёшь» передаёт значение без добавочного оттенка изгнания. Образ ὁδός лучше передаётся русским «по какой дороге», а не «на какой дороге».
