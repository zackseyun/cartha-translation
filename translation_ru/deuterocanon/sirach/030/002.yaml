  text: He who disciplines his son will profit by him, and among his acquaintances he will boast because of him.
translation:
  language: ru
  text: Кто воспитывает своего сына, тот получит от него пользу и среди знакомых будет им хвалиться.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ παιδεύων
  choice: Кто воспитывает
  rationale: Глагол παιδεύω охватывает воспитание, наставление и исправляющую дисциплину. «Воспитывает» естественно передаёт весь этот диапазон и не сводит смысл к наказанию.
- source_word: τὸν υἱὸν αὐτοῦ
  choice: своего сына
  rationale: В греческом тексте употреблено конкретное существительное мужского рода в единственном числе — «сына»; возвратное «своего» естественно указывает на субъект.
- source_word: ὀνήσεται
  choice: получит пользу
  rationale: Будущая форма среднего залога означает, что отец получит пользу или выгоду; выбранное выражение ясно и естественно в современном русском языке.
- source_word: ἐπʼ αὐτῷ
  choice: от него
  rationale: При ὀνήσεται оборот обозначает источник получаемой пользы.
- source_word: ἀνὰ μέσον γνωρίμων
  choice: среди знакомых
  rationale: γνωρίμων обозначает знакомых или близко известных людей; «знакомых» не преувеличивает степень близости, как могло бы слово «друзей».
- source_word: καυχήσεται
  choice: будет хвалиться
  rationale: Глагол прямо означает хвалиться или превозноситься. Формулировка сохраняет социальный оттенок чести и не заменяет его более оценочным «будет гордиться».
- source_word: ἐπʼ αὐτῷ
  choice: им
  rationale: При καυχήσεται оборот указывает на того, кем хвалятся; русское управление «хвалиться кем» передаёт этот смысл естественно.
theological_decisions:
- issue: Нравственная оценка того, что отец хвалится сыном
  choice: «будет им хвалиться» без смягчения или осуждающей окраски
  alternative: «будет им гордиться»
  rationale: Текст сообщает о почёте, который хорошо воспитанный сын приносит отцу, но сам по себе не даёт явной нравственной оценки похвальбе. Прямое соответствие сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткий афористичный строй изречения сохранён. «Воспитывает» выбрано как широкое и достойное обозначение формирующего наставления и исправления.
