  terminology: «Воспитывает» уместно сохраняет широкий диапазон παιδεύω — формирующее наставление и дисциплину — без неоправданного сведения к наказанию. «Сын» точно передаёт мужской род и число оригинала. «Хвалиться» является прямым, стилистически подходящим соответствием καυχᾶσθαι и не навязывает ни смягчающей, ни осуждающей интерпретации.
