  source_fidelity: 'Перевод точно передаёт структуру и смысл греческого текста: παιδεύων — «воспитывает», υἱόν — «своего сына», ὀνήσεται ἐπ’ αὐτῷ — «получит от него пользу», а καυχήσεται ἐπ’ αὐτῷ — «будет им хвалиться». Будущее время в обеих частях сохранено. «Среди знакомых» адекватно передаёт ἀνὰ μέσον γνωρίμων; естественная русская соотнесённость с субъектом не добавляет несодержащегося в тексте уточнения.'
