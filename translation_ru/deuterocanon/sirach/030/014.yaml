  text: Better is a poor man who is alive in himself than a rich man stricken in his flesh[a].
translation:
  language: ru
  text: Лучше бедняк, в ком есть жизнь, чем богач, поражённый телесным недугом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Лучше бедняк, здоровый и крепкий телом, чем богач, истерзанный в своём теле». Еврейский текст короче и буквально говорит: «жив в самом себе» и «поражён в своей плоти».'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: Лучше
  rationale: В изречении слово выражает сравнительную оценку; греческое κρείσσων подтверждает сравнительный смысл.
- source_word: מסכן
  choice: бедняк
  rationale: Передаёт бедного или нуждающегося мужчину и сохраняет прямое противопоставление богачу.
- source_word: וחי בעצמו
  choice: полный жизни
  rationale: Естественно передаёт буквальное «жив в самом себе», не подменяя еврейский текст более развёрнутым греческим описанием здоровья и крепости.
- source_word: מעשיר
  choice: чем богач
  rationale: Предлог «чем» явно оформляет подразумеваемое еврейской конструкцией сравнение.
- source_word: ונגע בבשרו
  choice: поражённый телесным недугом
  rationale: נגע указывает на поражение или недуг, а בשר — на плоть, телесную сторону человека. Формулировка сохраняет телесную конкретность и звучит естественно по-русски.
theological_decisions:
- issue: Телесно-антропологическое противопоставление
  choice: поражённый телесным недугом
  alternative: поражённый в своей плоти
  rationale: Основной текст сохраняет телесный смысл בשר, но избегает неестественной русской кальки; обобщения до «нездорового» не делается.
- issue: Смысл выражения בעצמו
  choice: полный жизни
  alternative: жив сам по себе
  rationale: Буквальная калька по-русски могла бы означать одиночество или самостоятельность. Выбранная формулировка удерживает смысл жизненности, а более пространное греческое чтение отмечено отдельно.
- issue: Мужской род в паре персонажей
  choice: бедняк ... богач
  alternative: бедный человек ... богатый человек
  rationale: Сохраняется мужской род единственного числа и лаконичная форма изречения без превращения её в специально гендерно-нейтральное высказывание.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная форма. «Полный жизни» устраняет двусмысленность буквальной кальки «жив сам по себе», а «телесным недугом» естественно передаёт конкретное поражение плоти.
