base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/030/039.yaml
  text: If you have a servant, let him be like yourself, because you acquired him with blood; if you have a servant, lead him as yourself, because you need him as your own life.
translation:
  language: ru
  text: Если у тебя есть раб[a], пусть он будет как ты, ведь ты приобрёл его кровью[b]. Если у тебя есть раб, обращайся с ним, как с собой[c], ведь он будет нужен тебе, как сама твоя жизнь[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. οἰκέτης — домашний раб или зависимый домашний слуга.
    reason: Уточняет историческое значение слова, не смягчая несвободный статус человека.
  - marker: b
    text: 'Буквально: «в крови»; греческое выражение не поясняет, чья кровь имеется в виду.'
    reason: Сохраняет реальную неоднозначность необычного выражения.
  - marker: c
    text: 'Буквально: «веди его как самого себя».'
    reason: Показывает форму исходного выражения за естественным русским переводом.
  - marker: d
    text: 'Или: «как твоя душа».'
    reason: Отражает семантическую широту греческого ψυχή.
lexical_decisions:
- source_word: οἰκέτης
  choice: раб
  rationale: Слово обозначает зависимого домашнего слугу, в античном контексте обычно раба; «слуга» могло бы скрыть его несвободное положение.
- source_word: ἐν αἵματι
  choice: кровью
  rationale: Сохранён конкретный и неоднозначный образ греческого текста без уточнения, чья это кровь и о каких обстоятельствах приобретения идёт речь.
- source_word: ἄγε αὐτὸν
  choice: обращайся с ним
  rationale: Буквально глагол означает «веди его», но в данном наставлении выражает способ обращения и руководства; русский буквальный оборот «веди его как самого себя» был бы неясен.
- source_word: ὡς ἡ ψυχή σου
  choice: как собственная жизнь
  rationale: ψυχή здесь допускает значения «душа» и «жизнь»; в сравнении с необходимостью человека естественное русское выражение «как собственная жизнь» передаёт смысл, не превращая фразу в отвлечённое учение о душе.
- source_word: ἐπιδέησις
  choice: будет нужен
  rationale: 'Сохранены будущее время и значение нужды в нём: «ты будешь нуждаться в нём».'
theological_decisions:
- issue: Отношение к рабу
  choice: «пусть он будет как ты» и «обращайся с ним как с самим собой»
  alternative: Сгладить κοινωνально-правовой контекст словом «слуга» или усилить текст до утверждения полного юридического равенства
  rationale: Перевод сохраняет нравственное требование уподобить обращение с рабом обращению с собой, но не вкладывает в стих более конкретное социальное или конфессиональное учение, чем выражено по-гречески.
- issue: Образ крови
  choice: оставить «приобрёл его кровью» без истолкования
  alternative: «дорогой ценой», «ценой собственной крови» или указание на кровное родство
  rationale: Источник не указывает носителя крови и не разъясняет образ; его богословская и историческая напряжённость сохранена.
translation_notes:
  register: Современный литературный русский язык; наставительный тон краток и достоин. Исторически точное «раб» сохранено, а не эвфемизировано. Необычный образ крови и возможность перевода ψυχή как «душа» отмечены, но не истолкованы за пределами источника.
