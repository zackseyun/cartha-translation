translation:
  language: ru
  text: Кто заглядывает в её окно и у её дверей прислушивается[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подслушивает». Еврейский глагол означает напряжённо, внимательно слушать и может подразумевать подслушивание; в греческом тексте — «слушает».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׁקִיף
  choice: Кто заглядывает
  rationale: Причастие от שׁקף описывает направленный взгляд через проём; «заглядывает» естественно передаёт не случайный взгляд, а намеренное всматривание.
- source_word: בְּעַד חֲלוֹנָה
  choice: в её окно
  rationale: בְּעַד обозначает взгляд через проём. В русском сочетание «заглядывает в окно» естественнее буквального «через окно» и сохраняет пространственный образ; принадлежность Мудрости передана местоимением «её» по контексту и греческой параллели.
- source_word: וְעַל פְּתָחֶיהָ
  choice: и у её дверей
  rationale: 'Форма פְּתָחֶיהָ — множественное число с суффиксом 3-го лица женского рода: «её входы/двери». Перевод сохраняет число и архитектурный образ.'
- source_word: יְצוֹתֵת
  choice: прислушивается
  rationale: Глагол выражает напряжённое, намеренное слушание и может подразумевать подслушивание. «Прислушивается» сохраняет основное значение, не приписывая действующему лицу непременно скрытный мотив.
theological_decisions:
- issue: Олицетворение Мудрости в женском роде
  choice: Сохранить местоимение «её»
  alternative: Передать Мудрость безлично или заменить местоимение существительным
  rationale: Контекст представляет Мудрость как женщину и хозяйку дома; женское местоимение сохраняет образность еврейского текста и греческой параллели.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая конструкция сохранена. Настоящее время у обоих глаголов делает синтаксис по-русски цельным, при этом еврейская форма второго глагола допускает оттенок последующего или обычного действия.
