base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/006.yaml
  text: For one who is evil to himself[a], there is none more evil than he; and this is the repayment of his evil.
translation:
  language: ru
  text: Кто недобр к самому себе[a], того хуже нет; и с ним — воздаяние за его зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч.: «кто жалеет для самого себя» или «кто скуп по отношению к самому себе»; то есть, возможно, речь о скупце, который отказывает даже себе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע לְנַפְשׁוֹ
  choice: Кто зол к самому себе
  rationale: Еврейское безглагольное выражение буквально означает «зол/плох к себе (своей душе)». Формулировка сохраняет нравственную лексику и широту еврейского текста, тогда как греческий параллельный текст уточняет возможный смысл как скупость по отношению к самому себе.
- source_word: אֵין רַע מִמֶּנּוּ
  choice: того хуже нет
  rationale: Естественная русская сравнительная конструкция передаёт смысл «нет никого хуже него». Слово «хуже» сохраняет связь с повторяющимся корнем רע, не создавая тяжеловесного «нет более злого».
- source_word: וְעִמּוֹ
  choice: и с ним
  rationale: Буквально сохранено необычное и несколько неоднозначное еврейское выражение «и с ним», не сводя его без необходимости к указательному «это» греческой версии.
- source_word: תּשְלוּמַת רָעָתוֹ
  choice: воздаяние за его зло
  rationale: תשלומת обозначает возмещение, расплату или воздаяние. «Воздаяние» соответствует достоинству афористического контекста; «за его зло» по-русски естественно выражает нравственное последствие, сохраняя повтор רע.
theological_decisions:
- issue: Характер воздаяния
  choice: Не уточнять, является ли воздаяние прямым Божьим наказанием или внутренним последствием зла.
  alternative: «Божья кара за его зло»
  rationale: В еврейском тексте субъект воздаяния не назван; конкретизация внесла бы отсутствующее богословское толкование.
translation_notes:
  register: Современный литературный русский с кратким афористическим строем. «Зол к самому себе» намеренно сохраняет широкую и резкую формулировку еврейского текста; греческое уточнение вынесено в сноску. Тире после «с ним» помогает естественно прочесть эллиптическую конструкцию, не устраняя её неоднозначности.
