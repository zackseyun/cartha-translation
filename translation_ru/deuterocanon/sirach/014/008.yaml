  text: Evil is the man with an envious eye[b][a], turning away his face and despising lives.
translation:
  language: ru
  text: 'Зол человек с завистливым глазом[a]: он отворачивает лицо и презирает людей[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с дурным глазом». Греческое выражение может обозначать завистливую, недоброжелательную и скупую настроенность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «души»; возможно также: «жизни». Здесь речь, вероятно, идёт о людях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηρὸς
  choice: зол
  rationale: Предикативное прилагательное даёт нравственную оценку человеку; краткая форма «зол» сохраняет силу греческого слова и афористичность изречения.
- source_word: ὁ βασκαίνων ὀφθαλμῷ
  choice: человек с завистливым глазом
  rationale: Оборот обозначает завистливую, недоброжелательную и скупую настроенность, сохраняя при этом образ глаза. Существительное «человек» естественно передаёт субстантивированное причастие мужского рода.
- source_word: ἀποστρέφων πρόσωπον
  choice: отворачивает лицо
  rationale: Передаёт конкретный телесный образ уклонения, отказа или нежелания помочь; личная форма делает русское изречение естественным.
- source_word: ὑπερορῶν
  choice: презирает
  rationale: Глагол выражает пренебрежение и высокомерное отношение; «презирает» ясно передаёт нравственную остроту контекста.
- source_word: ψυχάς
  choice: людей
  rationale: Здесь ψυχαί, вероятнее всего, обозначает человеческие личности, а не отдельно мыслимые нематериальные души. «Людей» естественно и ясно передаёт референт во множественном числе.
theological_decisions:
- issue: Передача выражения βασκαίνων ὀφθαλμῷ
  choice: с завистливым глазом
  alternative: с дурным глазом
  rationale: Основной текст раскрывает этический смысл зависти и недоброжелательности, но сохраняет образ глаза; буквальная и культурно значимая возможность «дурной глаз» отмечена в сноске.
- issue: Передача ψυχάς
  choice: людей
  alternative: души; жизни
  rationale: Контекст допускает значение людей или живых существ и не требует технического антропологического смысла «душ». Альтернативы сохранены в сноске, чтобы не скрывать широту греческого слова.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой изречения. Конкретные образы глаза и отворачиваемого лица сохранены; личные формы глаголов обеспечивают естественное русское звучание без устранения смысловой неоднозначности.
