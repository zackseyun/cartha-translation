  text: If he is evil to himself[a], to whom will he do good? He will not enjoy his own good things.
translation:
  language: ru
  text: Кто зол к самому себе, кому он сделает добро? Он не насладится своим благом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не увидит своего добра». Здесь «увидеть добро», вероятно, означает испытать его или насладиться им; греческий текст поясняет этот смысл: «не порадуется своему имуществу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַע לְנַפְשׁוֹ
  choice: жесток к самому себе
  rationale: Предикативное רַע с לְנַפְשׁוֹ описывает дурное, вредящее отношение человека к самому себе. «Жесток к самому себе» естественно передаёт смысл в данном контексте, не превращая נפש в специальный антропологический термин «душа».
- source_word: לְמִי יֵיטִיב
  choice: кому сделает добро?
  rationale: Форма יֵיטִיב (порода hифиль от יטב) означает «сделает добро, принесёт пользу». Формулировка сохраняет риторический вопрос и контраст с дурным отношением к себе.
- source_word: וְלֹא יִרְאֶה
  choice: не насладится
  rationale: Буквально глагол означает «не увидит», однако здесь «видеть добро» — идиома переживания или вкушения благополучия. Греческая параллель с εὐφρανθήσεται («возрадуется, насладится») подтверждает такое понимание.
- source_word: בְּטוֹבָתוֹ
  choice: тем добром, которое у него есть
  rationale: טובה может обозначать добро, благополучие или имеющиеся блага. Перевод сохраняет более широкий смысл еврейского текста и не сужает его до имущества, как это делает греческая параллель.
