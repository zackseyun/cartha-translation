  text: Do not deprive yourself of a good day, and do not let your share in a good desire pass you by.
translation:
  language: ru
  text: Не отказывай себе в благах дня и не позволяй своей доле в добром желании пройти мимо тебя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском свидетельстве также имеется заключённая в скобки фраза: «и не удерживай благо от самого себя». В представленном источнике её текстуальный статус неясен; возможно, она вторична. Греческий параллельный текст во второй части сформулирован иначе: «и не позволяй своей доле в добром желании пройти мимо тебя».'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תִּמְנַע מִטּוֹבַת יוֹם / μὴ ἀφυστερήσῃς ἀπὸ ἀγαθῆς ἡμέρας
  choice: Не отказывай себе в благах дня
  rationale: Еврейский оборот говорит о том, чтобы не удерживать от себя благо дня, а греческий — о лишении себя доброго дня. Русское выражение передаёт добровольный отказ от доступного блага, не сводя смысл к удовольствиям.
- source_word: '[וְאַל תִּמְנַע מִטּוֹבָה נַפְשֶׁךָ]'
  choice: не включено в основной текст
  rationale: В представленном еврейском источнике эта фраза заключена в квадратные скобки, её текстуальный статус неясен, и она, вероятно, дублирует первую часть. Вариант отмечен в сноске.
- source_word: μερὶς
  choice: своей доле
  rationale: Сохраняет греческое представление о принадлежащей человеку доле; притяжательное местоимение естественно передаёт отношение этой доли к адресату.
- source_word: ἐπιθυμίας ἀγαθῆς
  choice: доброго желания
  rationale: Буквальный и намеренно неуточняющий перевод неоднозначного греческого словосочетания. Он не подменяет желание такими толкованиями, как удовольствие, достаток или желанное благо.
- source_word: μὴ σε παρελθάτω
  choice: не позволяй … пройти мимо тебя
  rationale: Естественно передаёт образ чего-либо, проходящего мимо и остающегося неиспользованным.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и греческого параллельного свидетельства
  choice: Первая часть переведена по устойчивому еврейскому тексту, вторая — по греческому параллельному тексту
  alternative: 'Включить в основной текст заключённую в скобки еврейскую фразу: «и не удерживай благо от самого себя»'
  rationale: Еврейскому свидетельству отдан приоритет там, где его текст устойчив. Поскольку следующая еврейская фраза в издании помечена как неуверенная и может быть вторичной, связная вторая часть взята из греческого свидетельства, а вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с наставительным, сдержанно возвышенным тоном. Синтаксис остаётся доступным, а необычное выражение «доля доброго желания» сохранено ради подлинной неоднозначности греческого текста.
