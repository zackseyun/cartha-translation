  yaml_path: translation/deuterocanon/sirach/014/012.yaml
  text: Refresh yourself while you still have the power; remember that there is no pleasure in Sheol[a], and death does not delay, and the decree of Sheol has not been made known to you.
translation:
  language: ru
  text: Радуй себя, пока это в твоих силах; помни, что в Шеоле нет наслаждения[a], смерть не медлит, и установление Шеола тебе не открыто.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Помни, что смерть не замедлит и завет Аида не был показан тебе». В еврейском тексте: «установление Шеола тебе не открыто».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְאֵל יָדְךָ הִדָּשֵׁן
  choice: Подкрепляй себя, пока это в твоих силах
  rationale: Глагол דשן может обозначать насыщение, благополучие и пользование благами; «подкрепляй себя» сохраняет его конкретность, не сводя выражение к буквальному «утучняй себя». Оборот אֵל יָדְךָ передан как указание на наличные силы и возможности.
- source_word: זְכוֹר
  choice: помни
  rationale: Прямой и естественный эквивалент повелительной формы в наставлении мудрости.
- source_word: בִשְׁאוֹל
  choice: в Шеоле
  rationale: Транслитерация сохраняет древнееврейское представление о мире умерших и не привносит позднейшего значения ада как места наказания.
- source_word: תַּעֲנוּג
  choice: наслаждения
  rationale: Существительное означает удовольствие, отраду или наслаждение; выбранное слово естественно связано с призывом пользоваться жизненными благами до смерти.
- source_word: וְלֹא מָוֶת יִתְמַהְמַהּ
  choice: смерть не медлит
  rationale: Краткая формулировка передаёт общеистинный характер высказывания и значение глагола «медлить, задерживаться»; её подтверждает греческая параллель.
- source_word: וְחֹק לִשְׁאוֹל
  choice: а установление Шеола
  rationale: חֹק обозначает установленный порядок, закон или постановление. «Установление» сохраняет неоднозначность выражения, не уточняя без достаточных оснований, идёт ли речь о сроке смерти, законе мира умерших или приговоре.
- source_word: לֹא הֻגַּד לָךְ
  choice: тебе не открыто
  rationale: Пассивная форма נגד означает «не сообщено, не дано знать». «Не открыто» естественно по-русски передаёт отсутствие сообщённого человеку знания.
theological_decisions:
- issue: Передача שְׁאוֹל / ᾅδης
  choice: Шеол
  alternative: могила; мир мёртвых; Аид
  rationale: «Шеол» сохраняет древнееврейское обозначение обители умерших и не отождествляет его с позднейшими учениями об аде.
- issue: Смысл חֹק לִשְׁאוֹל
  choice: установление Шеола
  alternative: закон Шеола; постановление о Шеоле; завет Аида
  rationale: Еврейский текст допускает более одного понимания связи между חֹק и שְׁאוֹל. Нейтральное «установление» сохраняет эту напряжённость; греческое «завет Аида» отмечено в сноске как вариант параллельной традиции.
translation_notes:
  register: Современный литературный русский язык с кратким, наставительным ритмом литературы мудрости. Сохранён термин «Шеол»; синтаксис сделан ясным, но смысл трудного еврейского выражения חֹק לִשְׁאוֹל намеренно не конкретизирован.
