base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/018.yaml
  text: 'Like the leaves budding on a luxuriant tree—one withers and another sprouts—so are the generations of flesh and blood: one dies and another is born[a].'
translation:
  language: ru
  text: 'Как листья на зеленеющем дереве: один увядает, другой распускается, — так и поколения плоти и крови: одно умирает, другое рождается[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово גּוֹמֵל может означать «созревает» или нечто близкое; в греческом тексте читается «рождается», что соответствует образу сменяющих друг друга поколений. В переводе принято это чтение.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּפֶרַח עָלֶה
  choice: Как листья, распускающиеся
  rationale: Сжатый еврейский оборот передаёт образ распускающейся листвы; греческое ὡς φύλλον θάλλον подтверждает значение роста и цветения. Множественное число естественно по-русски и согласуется с последующим сопоставлением отдельных листьев.
- source_word: עֵץ רַעֲנָן
  choice: на пышно зеленеющем дереве
  rationale: רַעֲנָן обозначает свежесть, зелень и обильный рост; этот вариант сохраняет живой растительный образ и согласуется с греческим δασέος — густым, покрытым листвой деревом.
- source_word: שֶׁזֶּה נוֹבֵל וְאַחֵר צוֹמֵחַ
  choice: один увядает, другой вырастает
  rationale: נוֹבֵל означает «увядает», а צוֹמֵחַ — «растёт, произрастает». Формулировка сохраняет противопоставление ухода одной листвы и появления другой.
- source_word: כֵּן דּוֹרוֹת בָּשָׂר וָדָם
  choice: так и поколения плоти и крови
  rationale: Сохранены сравнительный переход, множественное דּוֹרוֹת и буквальный семитский оборот «плоть и кровь», обозначающий смертных людей.
- source_word: אֶחַד גֹּוֵעַ
  choice: одно умирает
  rationale: Глагол גוע означает умереть, испустить дух. Нейтральное «умирает» ясно передаёт смысл; средний род обусловлен русским словом «поколение».
- source_word: וְאֶחַד גּוֹמֵל
  choice: другое рождается
  rationale: Еврейское גּוֹמֵל допускает значение достижения зрелости, однако греческое γεννᾶται прямо свидетельствует о рождении. В контексте смены поколений «рождается» создаёт ясную параллель с «умирает», а разночтение отмечено в сноске.
theological_decisions:
- issue: Антропологический оборот בָּשָׂר וָדָם
  choice: сохранить буквальный оборот «плоть и кровь»
  alternative: «люди» или «человечество»
  rationale: Буквальный образ подчёркивает телесность и смертность человека, сохраняет семитскую фактуру текста и не вносит дополнительного богословского толкования.
- issue: Значение וְאֶחַד גּוֹמֵל
  choice: «другое рождается» по греческому параллельному свидетельству
  alternative: «другое созревает» или «другое вырастает»
  rationale: Еврейская форма неоднозначна, поэтому основной текст следует ясному греческому γεννᾶται, подходящему к смене поколений, а возможное еврейское значение сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической премудростной речи. Сохранены образ дерева, параллелизм «один — другой / одно — другое» и традиционный, но понятный оборот «плоть и кровь»; архаизмы и конфессионально окрашенная терминология не использованы.
