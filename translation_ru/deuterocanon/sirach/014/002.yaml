  text: Blessed is the man whom his soul has not reproached[a], and whose hope has not ceased.
translation:
  language: ru
  text: Блажен человек, чья душа не укорила его[a] и чья надежда не угасла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст первого полустишия в сохранившейся каирской рукописи труден. В греческом параллельном тексте сказано: «чья душа не осудила его»; возможны также оттенки: «не укорила» или «не постыдила».'
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Формула блаженства, характерная для литературы мудрости; «блажен» сохраняет возвышенный, но понятный современному читателю тон.
- source_word: אִישׁ
  choice: человек
  rationale: В данном изречении мужское единственное число имеет обобщающее значение; русское «человек» естественно передаёт его без ненужного сужения смысла.
- source_word: לֹא חִסַּדְתּוֹ נַפְשׁוֹ
  choice: которого не укоряет его душа
  rationale: Сохраняется образ души как внутреннего свидетеля. Значение трудной еврейской формы уточняется по греческому κατέγνω; «укоряет» передаёт внутреннее осуждение, не усиливая его до окончательного приговора.
- source_word: וְלֹא שָׁבְתָה
  choice: не угасла
  rationale: Глагол выражает прекращение или иссякновение; применительно к надежде «не угасла» звучит естественно и сохраняет смысл продолжающейся надежды.
- source_word: תּוֹחַלְתּוֹ
  choice: надежда
  rationale: Обычное и контекстуально точное соответствие; оно также согласуется с греческим ἐλπίς.
theological_decisions:
- issue: Передача трудного первого полустишия при расхождении и неясности сохранившегося еврейского текста
  choice: «которого не укоряет его душа» — еврейский образ сохранён, а значение глагола уточнено по греческому параллельному тексту.
  alternative: «которого не осудила его душа»; «которого не постыдила его душа»
  rationale: Еврейская форма текстологически трудна. Греческое κατέγνω поддерживает значение осуждения, однако «укоряет» лучше сохраняет возможную смысловую широту и не снимает неоднозначность чрезмерно категоричной формулировкой.
translation_notes:
  register: Современный литературный русский язык с достоинством изречения мудрости. Синтаксис краткий и афористичный; архаизмы сведены к традиционной и понятной формуле «Блажен».
