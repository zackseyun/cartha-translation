  yaml_path: translation/deuterocanon/sirach/014/022.yaml
  text: Go out after her in search[a], and lurk at all her entrances.
translation:
  language: ru
  text: Иди за нею, тщательно разыскивая её, и подстерегай[a] у всех её входов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стереги», «будь настороже». Значение редкого еврейского глагола не вполне ясно; греческая параллель передаёт образ ожидания в засаде.'
    reason: Лексическое значение редкого глагола יְרַצֵּד не вполне однозначно; греческий текст поддерживает более резкий образ подстерегания.
lexical_decisions:
- source_word: לָצֵאת
  choice: отправляйся
  rationale: Инфинитив יצא в данном наставительном контексте имеет побудительную силу; «отправляйся» естественно передаёт начало целенаправленного поиска.
- source_word: אַחֲרֶיהָ
  choice: за нею
  rationale: Сохранён суффикс женского рода, отсылающий к олицетворённой Премудрости, а также образ следования за ней.
- source_word: בְחֵקֶר
  choice: на поиски
  rationale: חקר обозначает поиск или исследование; выражение «на поиски» идиоматично по-русски и согласуется с греческим ὡς ἰχνευτής — «как следопыт».
- source_word: מְבוֹאֶיהָ
  choice: у всех её входов
  rationale: מבוא — конкретный вход или место входа; греческое εἴσοδος подтверждает пространственный образ. Женский суффикс сохранён.
- source_word: יְרַצֵּד
  choice: подстерегай
  rationale: Редкий еврейский глагол обозначает напряжённое выслеживание или ожидание; греческое ἐνέδρευε ясно поддерживает образ засады. «Подстерегай» сохраняет его силу, не делая выражение чрезмерно зловещим.
theological_decisions:
- issue: Олицетворение Премудрости в женском роде
  choice: Сохранить местоимение «нею» и притяжательное «её»
  alternative: Повторить слово «Премудрость» или обезличить фразу
  rationale: Еврейские суффиксы имеют женский род и относятся к олицетворённой Премудрости в ближайшем контексте; сохранение рода передаёт литературный и богословский образ без дополнительного истолкования.
- issue: Сила образа ожидания в засаде
  choice: Передать как «подстерегай»
  alternative: «стереги» или «карауль»
  rationale: Греческая параллель однозначно сохраняет образ засады, а редкий еврейский глагол допускает такое сильное значение. Сноска отмечает менее резкие варианты, не устраняя напряжённость исходного образа.
translation_notes:
  register: Современный литературный русский язык с ясной наставительной интонацией. Синтаксис краткий и образный; женский род олицетворённой Премудрости и конкретный образ входов сохранены.
