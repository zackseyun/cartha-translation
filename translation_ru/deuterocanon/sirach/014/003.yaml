translation:
  language: ru
  text: Богатство не к лицу мелочному человеку, и золото — человеку с дурным глазом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «С дурным глазом» — еврейское образное выражение о человеке скупом, завистливом или недоброжелательном.
    reason: Поясняет непривычную для современного русского читателя идиому, не устраняя её смысловой многозначности.
lexical_decisions:
- source_word: לְלֵב קָטֹן
  choice: мелочному человеку
  rationale: 'Буквально: «малому сердцем» или «с малым сердцем». В контексте богатства выражение обозначает мелочного, скупого человека; греческое μικρολόγῳ подтверждает эту смысловую направленность. Буквальная русская калька «человеку с малым сердцем» была бы неясна, а «малодушному» ошибочно указывало бы прежде всего на трусость.'
- source_word: לֹא נָאוֶה
  choice: не к лицу
  rationale: Естественно передаёт значение «не подобает, не пристало, не подходит» и сохраняет афористический тон.
- source_word: עֹשֶׁר
  choice: богатство
  rationale: Прямое и стилистически нейтральное соответствие еврейскому слову со значением богатства.
- source_word: חָרוּץ
  choice: золото
  rationale: В данном именном употреблении слово означает золото, особенно драгоценное или отборное; перевод не смешивает его с более общим עֹשֶׁר в первой строке.
- source_word: אִישׁ רַע עַיִן
  choice: человеку с дурным глазом
  rationale: Сохранён выразительный еврейский образ; в данном контексте он характеризует скупого, завистливого или недоброжелательного человека.
theological_decisions:
- issue: Нравственный смысл выражения «дурной глаз»
  choice: Сохранить образ в основном тексте и пояснить его в сноске
  alternative: Перевести непосредственно как «скупому человеку» или «завистнику»
  rationale: Еврейская идиома допускает взаимосвязанные оттенки скупости, зависти и недоброжелательства. Сохранение образа не сводит смысл к одному оттенку и не привносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура оригинала сохранена. Оборот «не к лицу» придаёт фразе естественное достоинство без архаизации. Тире во второй части естественно обозначает пропуск повторяющегося сказуемого «не к лицу».
