  text: He sets his nest in her foliage[a], and lodges among her branches.
translation:
  language: ru
  text: Он устроит своё гнездо в её листве[a] и будет ночевать среди её ветвей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Он поместит своих детей под её кровом и будет ночевать под её ветвями». В еврейском тексте — «своё гнездо» и «в её листве».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָשִׂים
  choice: устроит
  rationale: Глагол שׂים означает «класть, помещать»; в сочетании с «гнездом» русское «устроит» естественно передаёт конкретное действие, не превращая образ в отвлечённое «жилище».
- source_word: קִנּוֹ
  choice: своё гнездо
  rationale: Еврейский текст прямо говорит о «его гнезде». Возвратное «своё» естественно по-русски при подлежащем «он» и сохраняет древесный образ.
- source_word: בְעָפְיָהּ
  choice: в её листве
  rationale: Слово обозначает листву, густую листовую поросль. «В её листве» точно и естественно сохраняет женский суффикс, относящийся к олицетворённой Премудрости в древесном образе.
- source_word: וּבַעֲנָפֶיהָ
  choice: среди её ветвей
  rationale: עֲנָפִים — «ветви». «Среди» хорошо передаёт расположение внутри ветвей; греческое «под ветвями» отмечено отдельно как вариант.
- source_word: יִתְלוֹנָן
  choice: будет ночевать
  rationale: Глагол выражает ночлег, пребывание на ночь. «Будет ночевать» конкретнее общего «жить» и сохраняет оттенок временного укрытия.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческой параллели
  choice: 'В основном тексте следовать еврейскому чтению: «своё гнездо», «в её листве», «среди её ветвей».'
  alternative: 'Греческая параллель: «Он поместит своих детей под её кровом и будет ночевать под её ветвями».'
  rationale: Сохранившийся еврейский свидетель связен и образен, поэтому он положен в основу перевода. Отличия греческой традиции существенны для истории текста и сохранены в сноске без смешения двух чтений.
translation_notes:
  register: Современный литературный русский язык; образная и достойная речь без архаизации. Будущее время соответствует форме еврейских глаголов и контексту. Женское местоимение сохранено как отсылка к олицетворённой Премудрости.
