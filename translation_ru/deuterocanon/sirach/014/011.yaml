  text: My son[a], if you have the means, treat yourself well; and if you have anything, do good to yourself.
translation:
  language: ru
  text: Сын мой, если у тебя есть достаток, позаботься о себе; и если у тебя что-нибудь есть, будь добр к себе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В сохранившемся еврейском тексте содержится призыв делать добро себе. В греческом тексте после призыва делать добро себе добавлено: «и приноси Господу достойные приношения»; этой фразы нет в сохранившемся еврейском тексте, и, возможно, греческий перевод сохраняет более полный вариант стиха.'
    reason: textual_variant
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Прямое обращение с существительным בֵּן и суффиксом первого лица; сохраняет мужской род еврейского текста и звучит естественно в русском наставлении.
- source_word: אִם יֵשׁ לְךָ
  choice: если у тебя есть
  rationale: Естественная русская передача еврейской конструкции обладания; намеренно сохраняет незаполненное дополнение, как в оригинале.
- source_word: שָׁרֵית נַפְשֶׁךָ
  choice: есть достаток, позаботься о себе
  rationale: Сжатое и необычное еврейское выражение, вероятно, говорит об имеющихся средствах и благом отношении к себе. «Достаток» передаёт наличие ресурсов без узкого значения излишка, а «позаботься о себе» естественно выражает направленность действия на נַפְשֶׁךָ.
- source_word: וְאִם יֵשׁ לְךָ הֵיטִיב לָךְ
  choice: и если у тебя что-нибудь есть, сделай себе добро
  rationale: Передаёт повторную условную конструкцию еврейского текста и сохраняет этически окрашенное, несколько буквальное значение каузативной формы יטב с לָךְ.
- source_word: προσφορὰς Κυρίῳ ἀξίως πρόσαγε
  choice: и приноси Господу достойные приношения
  rationale: Так переводится дополнительная греческая фраза, отсутствующая в сохранившемся еврейском тексте; она приводится в сноске как важный текстовый вариант, а не включается в основной текст.
theological_decisions:
- issue: Дополнительная фраза о приношениях Господу в греческом параллельном тексте
  choice: Оставить основной текст по сохранившемуся еврейскому свидетельству, а греческое дополнение указать в сноске
  alternative: 'Включить в основной текст: «и приноси Господу достойные приношения»'
  rationale: Еврейский текст сохранился и имеет высокую степень надёжности; в нём стоят две сходные условные части, но нет упоминания приношений. Греческое чтение существенно и может отражать более полный текст, однако его включение без обозначения устранило бы реальную текстологическую неопределённость.
- issue: Значение הֵיטִיב לָךְ
  choice: сделай себе добро
  alternative: поступай с собой хорошо; позаботься о себе
  rationale: Формулировка сохраняет этическое напряжение призыва благотворить самому себе и не сводит его к разговорному удовольствию или потреблению.
translation_notes:
  register: Современный литературный русский с достоинством наставительной речи. Повтор условий сохранён, поскольку он присутствует в еврейском тексте; близкие, но не одинаковые формулировки «позаботься о себе» и «сделай себе добро» передают параллелизм без искусственного сглаживания.
