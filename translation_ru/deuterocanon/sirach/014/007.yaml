  language: ru
  text: Даже если он делает добро, он делает это в забвении[a], а в конце концов являет своё зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «делает это забывчиво» или «делает это так, словно предаёт забвению»; греческое выражение буквально означает «в забвении».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν
  choice: даже если
  rationale: Сокращение καὶ ἐάν вводит уступительное условие; «даже если» естественно передаёт этот оттенок по-русски.
- source_word: εὖ ποιῇ
  choice: делает добро
  rationale: Оборот εὖ ποιέω означает делать добро или поступать хорошо; выбран краткий и естественный эквивалент.
- source_word: ἐν λήθῃ
  choice: в забвении
  rationale: Буквально «в забвении»; необычный образ сохранён, чтобы не сужать смысл до невнимательности, забывчивости или поступка, обречённого на забвение.
- source_word: ποιεῖ
  choice: делает это
  rationale: Повтор глагола сохранён, а местоимение «это» указывает на добро из первой части и делает фразу понятной по-русски.
- source_word: ἐπʼ ἐσχάτων
  choice: под конец
  rationale: Временной оборот указывает на конечный итог; «под конец» звучит естественно и сохраняет последовательность событий.
- source_word: ἐκφαίνει
  choice: обнаруживает
  rationale: Глагол означает являть, выводить на свет; «обнаруживает» здесь передаёт проявление скрытого нравственного зла, не уточняя, намеренно ли оно раскрывается.
- source_word: τὴν κακίαν αὐτοῦ
  choice: своё зло
  rationale: κακία может означать зло, порочность или злобу; широкое «зло» не сужает значение до одной лишь злонамеренности.
