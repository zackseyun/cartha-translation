  text: Все его дела истлеют[a], и дело его рук будет тянуться за ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По-гречески: «Всякое разлагающееся дело погибает, и тот, кто делает его, уйдёт вместе с ним». Еврейский текст во второй части говорит иначе: дело рук человека тянется за ним.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל מַעֲשָׂיו
  choice: Все его дела
  rationale: Передаёт полноту כָּל и широкий смысл מַעֲשָׂיו — всё сделанное человеком; «дела» звучит естественно и литературно.
- source_word: רָקוֹב יִרְקָבוּ
  choice: истлеют
  rationale: Сочетание однокоренных форм усиливает идею разложения. Русское «истлеют» естественно выражает полное разрушение, не воспроизводя тяжеловесно еврейский этимологический повтор.
- source_word: וּפֹעַל יָדָיו
  choice: и труд его рук
  rationale: פֹעַל обозначает дело, труд или его плод; выражение «труд его рук» сохраняет конкретный образ рук и избегает неестественного повтора слова «дела».
- source_word: יִמָּשֵׁךְ אַחֲרָיו
  choice: потянется за ним
  rationale: Сохраняет образ того, что сделанное человеком тянется вслед за ним. Форма «потянется» допускает оттенок движения под воздействием силы, но по-русски звучит естественнее буквального «будет волочиться».
theological_decisions:
- issue: Расхождение еврейского и греческого текста во второй части стиха
  choice: 'Следовать сохранившемуся еврейскому тексту: «труд его рук потянется за ним».'
  alternative: 'По-гречески: «и тот, кто делает это, уйдёт вместе с ним».'
  rationale: 'Еврейское свидетельство имеет высокую степень надёжности и является первичным для основного текста. Греческий вариант меняет подлежащее: уходит не труд вслед за человеком, а сам деятель вместе со своим делом; это значимое расхождение сохранено в сноске.'
translation_notes:
  register: Современный литературный русский язык с краткой афористичной формой. «Истлеют» сохраняет образ тления и интенсивный смысл еврейского повтора; «потянется за ним» передаёт необычный образ оригинала без чрезмерной буквальности.
