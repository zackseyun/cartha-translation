translation:
  language: ru
  text: Блажен человек, который размышляет о мудрости[b][a] и с разумением размышляет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Счастлив человек». Древнееврейская формула אַשְׁרֵי говорит не только о чувстве счастья, но и о благополучии, достойной зависти участи.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте: «Блажен человек, который достигнет конца в мудрости и будет рассуждать в своём разумении». Эта формулировка заметно отличается от древнееврейской в обоих полустишиях.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Сохраняет форму и возвышенный тон библейского изречения о достойном зависти благополучии, не сводя смысл к эмоциональному счастью.
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: Естественно передаёт родовое обозначение человека; грамматический мужской род сохраняется в форме «блажен» и в местоимении.
- source_word: בְּחָכְמָה יֶהְגֶּה
  choice: размышляет о мудрости
  rationale: הגה обозначает сосредоточенное размышление или обдумывание; русское управление «размышлять о» естественно передаёт בְּ.
- source_word: וּבִתְבוּנָה
  choice: с разумением
  rationale: Передаёт תבונה как способность понимать и различать, сохраняя возможный обстоятельственный или инструментальный оттенок предлога בְּ.
- source_word: יִשְׁעֶה
  choice: вникает в неё
  rationale: Редкий глагол выражает направленное внимание или обращение к чему-либо. «Вникает» передаёт внимательное интеллектуальное устремление и не навязывает буквального физического образа.
theological_decisions:
- issue: Родовое обозначение человека в изречении о блаженстве
  choice: человек, который
  alternative: муж, который
  rationale: אֱנוֹשׁ обозначает смертного человека, а не специально взрослого мужчину; современное «человек» точно и естественно, при этом мужской грамматический образ исходного изречения не устраняется.
- issue: Связь разумения со вторым действием
  choice: с разумением вникает в неё
  alternative: размышляет о разумении
  rationale: Предлог допускает обстоятельственное понимание, а местоименное дополнение естественно относит второе действие к мудрости. Однако синтаксическая неоднозначность не превращается в отдельное доктринальное утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской литературы мудрости. Параллелизм передан без архаизмов; «вникает» сохраняет оттенок сосредоточенного внимания. Порядок маркеров [b][a] сохранён в соответствии с предоставленным английским консультационным слоем.
