base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/013.yaml
  text: Before you die[a], do good to one you love, and according to what your hand attains[b], give to him.
translation:
  language: ru
  text: Прежде чем умрёшь, сделай добро тому, кого любишь[a], и дай ему по мере своих возможностей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «другу». В греческой параллели: «сделай добро другу».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «[сообразно] достижению твоей руки», то есть в пределах своих средств или возможностей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם תָּמוּת
  choice: Прежде чем умрёшь
  rationale: 'Прямо и естественно передаёт временное придаточное: действие должно быть совершено до смерти адресата.'
- source_word: הֵיטִב
  choice: сделай добро
  rationale: Побудительная форма выражает активное благодеяние, а не просто доброе отношение.
- source_word: לְאוֹהֵב
  choice: тому, кого любишь
  rationale: Сохраняет широкое значение еврейского обозначения близкого, любимого человека; греческое φίλῳ подтверждает личные отношения, но допускает более узкое «другу».
- source_word: וְהַשִּׂיגַת יָדְךָ
  choice: по мере своих возможностей
  rationale: Еврейский образ того, чего достигает рука, идиоматически обозначает доступные человеку средства или возможности; греческое κατὰ τὴν ἰσχύν σου подтверждает это значение.
- source_word: תֶּן לוֹ
  choice: дай ему
  rationale: Кратко и точно передаёт повеление с явно названным получателем.
theological_decisions:
- issue: 'Кому следует благотворить: לְאוֹהֵב / φίλῳ'
  choice: тому, кого любишь
  alternative: другу; близкому человеку
  rationale: Еврейский текст оставляет отношение более широким, тогда как греческая параллель говорит о друге. Основной текст следует еврейскому свидетельству, а более узкий вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; наставление передано кратко и достойно. В основном тексте смысл еврейской идиомы выражен естественно, а её образ сохранён в сноске.
