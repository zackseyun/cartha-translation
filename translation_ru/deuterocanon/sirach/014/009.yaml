base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/009.yaml
  text: In the eye of the greedy[a], his portion is too little, and by taking his neighbor’s share he destroys his own portion.
translation:
  language: ru
  text: В глазах алчного[a] его доля слишком мала, и, забирая долю ближнего, он губит свою долю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально говорит: «В глазах … его доля мала». Слово, переведённое как «алчного», в еврейской рукописной традиции неясно; греческий текст читает: «Глаз алчного не насыщается долей», что поддерживает такой смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעֵין
  choice: В глазах
  rationale: 'Сохраняет образ еврейского выражения и естественно передаёт субъективную оценку: такой человеку видится его доля.'
- source_word: כּוֹשֵׁל
  choice: алчного
  rationale: Еврейская форма в рукописной традиции трудна; греческая параллель πλεονέκτου ясно указывает на жадного, корыстолюбивого человека. «Алчный» соответствует нравоучительному регистру и идее ненасытности.
- source_word: מְעַט
  choice: слишком мала
  rationale: Передаёт не объективный размер доли, а то, что алчному она кажется недостаточной; это согласуется с греческим «не насыщается долей».
- source_word: חֶלְקוֹ / חֵלֶק
  choice: его доля / долю
  rationale: «Доля» естественна в русском тексте мудрости и сохраняет лексический повтор еврейского оригинала.
- source_word: וְלוֹקֵחַ
  choice: но, забирая
  rationale: 'Причастная форма описывает характерное действие алчного. Союз «но» естественно подчёркивает парадокс: стремясь увеличить свою долю, он губит её.'
- source_word: רֵעֵהוּ
  choice: ближнего
  rationale: Передаёт этическую направленность רֵעַ — другого человека, товарища или соседа — и звучит естественно в библейском русском регистре.
- source_word: מְאַבֵּד
  choice: губит
  rationale: Передаёт каузативное значение «уничтожает, приводит к гибели» и сохраняет активную нравственную ответственность субъекта.
theological_decisions:
- issue: Использование греческой параллели при трудном еврейском чтении
  choice: כּוֹשֵׁל передано как «алчный», а первая строка — как выражение ненасытности.
  alternative: 'Более буквально: «В глазах спотыкающегося его доля мала».'
  rationale: Буквальное обычное значение еврейской формы плохо согласуется с контекстом. Греческая параллель говорит о глазе алчного, который не насыщается долей, и, вероятно, отражает смысл трудного еврейского чтения. Неясность рукописной традиции отмечена в сноске.
- issue: Связь между присвоением чужого и утратой своего
  choice: 'Сохранено активное парадоксальное утверждение: человек «губит свою» долю.'
  alternative: 'Смягчить до следствия: «теряет свою долю».'
  rationale: Еврейский каузатив מְאַבֵּד выражает активное причинение гибели; перевод не уточняет механизм воздаяния и тем самым сохраняет богословскую и нравственную ёмкость афоризма.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и афористичным звучанием. Образ «в глазах» и тройной мотив доли сохранены; «алчный» поддерживает тон литературы мудрости без конфессионально окрашенной терминологии.
