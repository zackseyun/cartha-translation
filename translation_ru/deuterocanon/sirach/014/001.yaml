translation:
  language: ru
  text: Счастлив человек, который не оступился в словах[a] и которого не осудило собственное сердце[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь труден; буквально он близок к выражению «чьи уста его не оставили». В греческой параллели сказано: «не оступился своими устами», то есть не оступился в речи.'
    reason: alternative_reading
  - marker: b
    text: 'Еврейская форма глагола необычна; возможен также перевод: «которого не укорил суд его сердца». Греческая параллель имеет отличающееся чтение: «не был пронзён скорбью о грехе».'
    reason: textual_variant
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Счастлив
  rationale: Формула блаженства в литературе мудрости описывает достойное зависти благополучие. «Счастлив» естественно звучит по-русски и не предполагает явно названного подателя благословения.
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: Слово обозначает человека как смертное человеческое существо; русское «человек» сохраняет обобщающий смысл без ненужного сужения до пола.
- source_word: לֹא עֲזָבוֹ פִיהוּ
  choice: не оступился в словах
  rationale: 'Масоретически трудное выражение буквально близко к «его уста не оставили его». Греческая параллель говорит о том, кто «не оступился своими устами», и проясняет вероятный смысл: человек не согрешил или не навлёк на себя беду речью. Русское выражение передаёт этот смысл без неясного буквализма.'
- source_word: דִּין לִבּוֹ
  choice: собственное сердце
  rationale: Сочетание включает понятия «суд» и «сердце» и представляет внутренний суд сердца над человеком. В конструкции «сердце осудило» судебный оттенок сохраняется, тогда как слово «совесть» было бы более интерпретирующим.
- source_word: וְלֹא אָבַח עָלָיו
  choice: не осудило
  rationale: Глагольная форма необычна и текстуально не вполне ясна; в сочетании с «судом сердца» она, вероятно, выражает внутреннее обвинение или укор. «Не осудило» естественно передаёт судебный образ контекста.
theological_decisions:
- issue: Формула блаженства
  choice: Счастлив человек
  alternative: Блажен человек
  rationale: Контекст относится к наставлению мудрости, а не называет прямое действие Бога. «Счастлив» ясно передаёт состояние человека, сохраняя нравственную весомость формулы.
- issue: Текстуально трудная первая строка
  choice: не оступился в словах
  alternative: чьи уста его не оставили; не согрешил устами
  rationale: Еврейский текст сохранён как основной свидетель, но его буквальное чтение неясно. Греческая параллель подтверждает мотив преткновения в речи; выбранный перевод передаёт вероятный смысл, не превращая его в более узкое утверждение о конкретном грехе.
- issue: Внутренний суд сердца
  choice: которого не осудило собственное сердце
  alternative: которого не укорила совесть; который не был пронзён скорбью о грехе
  rationale: Выбранный вариант следует имеющимся еврейским словам о суде сердца. Греческое чтение о скорби греха важно как параллель, но не должно безоговорочно заменять отличающееся еврейское свидетельство.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным изречению мудрости. Синтаксис краткий и ясный; трудные места не сглажены без пояснения, а вынесены в сноски.
