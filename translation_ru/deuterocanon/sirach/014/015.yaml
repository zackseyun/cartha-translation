translation:
  language: ru
  text: Разве ты не оставишь другому своё богатство, а свой труд — тем, кому выпадет доля?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с еврейского: «знающим жребий». Вероятно, речь идёт о тех, кто получит долю при разделе по жребию; греческий текст говорит о «разделе жребия» (или удела).'
    reason: Сноска сохраняет буквальную необычность еврейского выражения и обозначает вероятное значение в свете греческой параллели, не сводя его к однозначному юридическому наследованию.
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и сохраняет наставительный тон.
- source_word: לְאַחֵר תַּעֲזוֹב
  choice: не другому оставишь ты
  rationale: «Оставишь» точно передаёт значение глагола, не уточняя юридическое завещание; «другому» прямо обозначает иного получателя.
- source_word: חֵילֶךָ
  choice: своё богатство
  rationale: В контексте премудростной литературы слово обозначает материальное достояние или имущество; «богатство» естественно в данном предостережении.
- source_word: וִיגִיעֲךָ
  choice: свой труд
  rationale: Сохраняет как значение затраченных усилий, так и возможный оттенок приобретённого трудом, не подменяя его более узким толкованием.
- source_word: לְיוֹדֵי גוֹרָל
  choice: тем, кому достанется доля
  rationale: Передаёт идиоматический смысл получения удела при разделе; греческая параллель также указывает на раздел доли или наследства. Буквальный образ пояснён в сноске.
