base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/014/016.yaml
  text: Give to a brother[a], and be gracious, and indulge yourself, for in Sheol there is no seeking pleasure. And whatever is good to do[b], do it before God.
translation:
  language: ru
  text: Дай брату, будь милостив и побалуй себя[a], ведь в Шеоле[b] не ищут наслаждений. И всё, что хорошо делать, делай пред Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «дай и возьми, и обмани душу свою». Это трудное выражение, по-видимому, также указывает на позволенное себе удовольствие; еврейский текст яснее: «побалуй себя».'
    reason: alternative_reading
  - marker: b
    text: 'Шеол — мир мёртвых; возможные переводы: «могила» или «подземный мир».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן לְאָח
  choice: Дай брату
  rationale: Сохраняет конкретное значение «брат», которое в контексте может обозначать также ближнего или члена общины, не подменяя его более широким толкованием.
- source_word: וְחֹנֵן
  choice: будь милостив
  rationale: Передаёт значение милости и благосклонности глагола חנן; в данном ряду повелений звучит естественно и не сводит смысл только к материальной щедрости.
- source_word: וּפַנֵּק נַפְשֶׁךָ
  choice: побалуй себя
  rationale: Передаёт смысл заботливого, даже несколько изысканного удовольствия, выраженный פנק, естественным современным русским оборотом.
- source_word: כִּי אֵין בִּשְׁאוֹל
  choice: ведь в Шеоле … уже не
  rationale: Название Шеол сохранено как обозначение мира мёртвых, а частица «уже» естественно выражает подразумеваемый контраст между нынешней жизнью и пребыванием среди мёртвых.
- source_word: לְבַקֵּשׁ תַּעֲנוּג
  choice: не ищут наслаждений
  rationale: Сохраняет глагольную идею поиска и смысл удовольствия или наслаждения; множественное число по-русски здесь идиоматично и не сужает значение до одного отдельного удовольствия.
- source_word: וְכָל דָּבָר שֶׁיָּפֶה לַעֲשׂוֹת
  choice: И всё, что хорошо делать
  rationale: יפה в этом контексте означает нравственно хорошее, подобающее или уместное, а не только эстетически прекрасное; формулировка сохраняет широту выражения.
- source_word: לִפְנֵי אֱלֹהִים עֲשֶׂה
  choice: делай пред Богом
  rationale: «Пред Богом» кратко и весомо передаёт буквальный образ действия в Божьем присутствии и перед Его взором.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: Шеол
  alternative: могила; мир мёртвых; преисподняя
  rationale: Транслитерация сохраняет древнееврейское представление о месте пребывания мёртвых, не отождествляя его без достаточных оснований ни с отдельной могилой, ни с позднейшим понятием ада.
- issue: Соотношение еврейского и греческого чтений повеления о самом себе
  choice: побалуй себя
  alternative: обмани душу свою; порадуй себя; доставь себе удовольствие
  rationale: Сохранившийся еврейский текст имеет первенство и ясно употребляет פנק в значении мягкого, приятного обращения с собой. Трудное греческое чтение сохраняется в примечании как важный текстовый вариант.
translation_notes:
  register: Современный литературный русский язык с лаконичным, наставительным ритмом. «Побалуй себя» намеренно сохраняет конкретность еврейского פנק, а «пред Богом» придаёт заключению достоинство без избыточной архаизации.
