translation:
  language: ru
  text: Он укрывается в её тени от зноя[a] и будет пребывать в её обителях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к греческой параллели: «Она укроет его от палящего зноя, и он будет пребывать в её славе». В еврейском тексте — «в её обителях», а в греческом — «в её славе».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחוֹסֶה
  choice: Он укрывается
  rationale: Причастие от חסה выражает поиск убежища и защиты; настоящее время естественно передаёт обобщённое, изреченческое значение.
- source_word: בְּצִלָּהּ
  choice: в её тени
  rationale: צל означает «тень» как защиту от жара. Женское местоимение сохраняет отсылку к персонифицированной Премудрости и естественно звучит по-русски.
- source_word: מֵחֹרֶב
  choice: от зноя
  rationale: חרב здесь обозначает сильный жар, сухой зной; греческое καῦμα подтверждает температурный образ.
- source_word: וּבִמְעוֹנוֹתֶיהָ
  choice: в её обителях
  rationale: מָעוֹן — место пребывания, жилище. «Обители» сохраняет множественное число, пространственный образ и возвышенный регистр, не сводя значение только к защитному укрытию.
- source_word: יִשְׁכֹּן
  choice: поселится
  rationale: Глагол שכן значит жить, пребывать, поселяться. Будущий вид сохраняет форму еврейского имперфекта и передаёт устойчивое пребывание, следующее за поиском убежища.
theological_decisions:
- issue: Род персонифицированной Премудрости
  choice: Передать женские суффиксы как «её».
  alternative: Использовать указательное или безличное выражение, ориентируясь преимущественно на образ дерева.
  rationale: В русском языке «Премудрость» женского рода, поэтому «её тень» и «её обители» естественно сохраняют как грамматическую форму, так и персонификацию исходного контекста.
- issue: Разночтение между еврейским «в её обителях» и греческим «в её славе»
  choice: Следовать засвидетельствованному еврейскому тексту в основном переводе.
  alternative: 'Перевести по греческой параллели: «будет пребывать в её славе».'
  rationale: Еврейский источник имеет высокую степень надёжности и является основным; существенное греческое разночтение сохранено в примечании без попытки его богословски согласовать.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной интонацией литературы Премудрости. «Зной» конкретно передаёт образ палящего жара, а «обители» сохраняет достоинство стиля и буквальный пространственный образ.
