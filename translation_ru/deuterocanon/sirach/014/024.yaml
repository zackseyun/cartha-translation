  text: He who camps around her house and drives his tent peg into her wall—[a]
translation:
  language: ru
  text: кто разбивает стан вокруг её дома и вбивает свои колья в её стену.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто поселяется возле её дома и закрепляет кол в её стенах». В греческом тексте яснее сказано «поблизости», тогда как еврейский текст образно говорит «вокруг»; в еврейском здесь «колья», а в греческом — «кол».'
    reason: Передача лексических и числовых вариантов еврейского и греческого текстов.
lexical_decisions:
- source_word: הַחוֹנֶה
  choice: кто разбивает стан
  rationale: Причастие от חנה обозначает того, кто располагается станом; выражение сохраняет конкретный образ и передаёт характерное действие.
- source_word: סְבִיבוֹת
  choice: вокруг
  rationale: Еврейское слово выражает окружающую близость. Греческое σύνεγγυς означает «поблизости», однако более яркий образ еврейского текста сохранён.
- source_word: בֵּיתָהּ
  choice: её дома
  rationale: Буквальная притяжательная конструкция; женский суффикс в контексте относится к персонифицированной Мудрости.
- source_word: וְהֵבִיא
  choice: вбивает
  rationale: Формально глагол означает «приносит/вводит», но сочетание с кольями и греческое πήξει указывают на установку или закрепление кольев; по-русски естественно «вбивает».
- source_word: יְתֵדָיו
  choice: свои колья
  rationale: Еврейская форма имеет множественное число с притяжательным суффиксом — «его колья»; возвратное «свои» естественно связывает принадлежность с подлежащим. Сохраняется число еврейского текста, несмотря на единственное число в греческом.
- source_word: בְּקִירָהּ
  choice: в её стену
  rationale: קיר — «стена»; предлог ב־ в сочетании с действием закрепления допускает направительное «в», соответствующее образу вбивания кольев.
theological_decisions:
- issue: К кому относятся местоимения женского рода
  choice: К персонифицированной Мудрости
  alternative: К обычной женщине или хозяйке дома
  rationale: Ближайший контекст говорит о поиске Мудрости и наблюдении у её дверей, поэтому образ её дома продолжает персонификацию.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического образа стоянки возле дома персонифицированной Мудрости. Строка начинается со строчной буквы и завершается точкой, поскольку синтаксически продолжает характеристику человека из окружающего контекста; тире английского консультационного слоя не переносится без опоры в еврейском тексте.
