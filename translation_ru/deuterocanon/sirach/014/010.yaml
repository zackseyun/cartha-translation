translation:
  language: ru
  text: Человек с дурным глазом[a] скупится на хлеб, и за его столом — скудость[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дурной глаз» — древнее выражение, обозначающее завистливую, недоброжелательную или скупую настроенность.
    reason: lexical_alternative
  - marker: b
    text: Еврейский текст этой части стиха труден для истолкования; греческая параллель поддерживает смысл скудости или скупости за столом.
    reason: alternative_reading
lexical_decisions:
- source_word: עַיִן רַע / ὀφθαλμὸς πονηρός
  choice: человек с дурным глазом
  rationale: Сохранён древний образ «дурного глаза», обозначающий завистливую, недоброжелательную и скупую настроенность; добавление «человек» делает фразу естественной по-русски, не устраняя исходную метафору.
- source_word: תָּעִיט / φθονερὸς
  choice: скупится
  rationale: Еврейская форма трудна, но контекст и греческая параллель указывают на завистливое, неохотное отношение к пище. «Скупится» естественно передаёт практический смысл поведения.
- source_word: לָחֶם / ἄρτος
  choice: хлеб
  rationale: И еврейский, и греческий тексты называют хлеб; конкретный образ сохранён, хотя в данном контексте хлеб может представлять пищу вообще.
- source_word: מְהוּמָה
  choice: скудость
  rationale: Еврейское чтение допускает трудности, а греческая параллель поддерживает смысл недостатка и убогости угощения. «Скудость» хорошо сочетается с образом стола и не сводит выражение лишь к черте характера.
- source_word: שֻלְחָנוֹ / τράπεζα αὐτοῦ
  choice: за его столом
  rationale: По-русски выражение «за его столом» естественно обозначает как место трапезы, так и предложенное хозяином угощение.
