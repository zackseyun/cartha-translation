lexical_decisions:
- source_word: וְנוֹטֶה
  choice: раскидывает
  rationale: В сочетании с אָהֳלוֹ глагол נטה обозначает установку, раскидывание шатра; русский оборот сохраняет конкретный образ и звучит естественно.
- source_word: אָהֳלוֹ
  choice: свой шатёр
  rationale: אָהֶל — обычное обозначение шатра или палатки. «Шатёр» соответствует возвышенному, но понятному регистру книги и сохраняет образ странника.
- source_word: עַל יָדָהּ
  choice: рядом с ней
  rationale: Буквально «у/при её руке»; здесь это пространственный оборот со значением близости. Греческое κατὰ χεῖρας αὐτῆς подтверждает образ руки, однако в основном русском тексте буквальная калька была бы неясна.
- source_word: וְשָׁכַן
  choice: и поселяется
  rationale: שכן означает пребывать, обитать, поселяться. В контексте шатра «поселяется» естественно связывает обе половины стиха и не предполагает непременно постоянного проживания.
- source_word: שֹׁכֶן טוֹב
  choice: в добром жилище
  rationale: Передаёт сжатую и несколько необычную еврейскую конструкцию через образ хорошего места обитания. «Добром» сохраняет широкое значение טוֹב, не сводя его только к удобству или приятности.
theological_decisions:
- issue: Женская персонификация мудрости
  choice: Сохранено местоимение «ней».
  alternative: Заменить на безличное обозначение или повторить слово «мудрость».
  rationale: Контекст представляет мудрость как женщину; женское местоимение сохраняет литературный и богословский образ еврейского текста.
- issue: Степень сглаживания образов шатра и жилища
  choice: Сохранены конкретные образы шатра, поселения и жилища.
  alternative: 'Передать отвлечённо: «он остаётся близ мудрости и благоденствует».'
  rationale: Исходный текст выражает близость к мудрости посредством пространственного и бытового образа; отвлечённый пересказ устранил бы существенную метафору.
- issue: Неясность выражения שֹׁכֶן טוֹב
  choice: «в добром жилище» с примечанием об альтернативе.
  alternative: «обретает приятное пристанище» или «обитает среди благ».
  rationale: Еврейская формулировка компактна, а греческий параллельный текст допускает оттенок пребывания в благом месте или среди благ. Основной перевод не уточняет неоднозначность сверх необходимого.
