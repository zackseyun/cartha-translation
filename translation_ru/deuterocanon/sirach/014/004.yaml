translation:
  language: ru
  text: Кто отказывает себе, тот накопит для другого, и его благами будет наслаждаться чужой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «чужой» в единственном числе; в греческом переводе — «другие» во множественном.
    reason: alternative_reading
lexical_decisions:
- source_word: מוֹנֵעַ לְנַפְשׁוֹ
  choice: отказывает себе
  rationale: Глагол מנע означает «удерживать, не давать», а לְנַפְשׁוֹ в данном обороте имеет возвратный смысл. Перевод передаёт добровольное лишение себя доступных благ без буквального, но неестественного «своей душе».
- source_word: יִקְבֹּץ לְאַחֵר
  choice: накопит для другого
  rationale: 'קבץ значит «собирать, накапливать»; контекст подчёркивает иронию: накопленное достанется не собиравшему, а другому.'
- source_word: וּבְטוֹבָתוֹ
  choice: его благами
  rationale: טובה употреблено конкретно о принадлежащих человеку хороших вещах или достатке. «Блага» сохраняет широту выражения и звучит естественно.
- source_word: יִתְבַּעְבֵּעַ
  choice: будет наслаждаться
  rationale: Редкая форма описывает обильное, возможно роскошное наслаждение; греческое τρυφήσουσιν подтверждает этот смысл. Русское выражение ясно передаёт его без излишнего усиления.
- source_word: זָר
  choice: чужой
  rationale: Еврейский текст использует единственное число и обозначает постороннего, не самого накопителя. Субстантивированное «чужой» сохраняет эту форму и смысл.
