translation:
  language: ru
  text: 'Всякая плоть, как одежда, ветшает, и извечный закон таков: умирая, все умрут.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская заключительная фраза буквально и грамматически необычно звучит приблизительно так: «умирающий — умрут»; в ней повторён корень со значением «умирать, испускать дух». Это краткая формула всеобщей смертности. Греческая параллель передаёт её как извечное установление о смерти.'
    reason: Сохраняет неясность и грамматическую необычность еврейского текста, поясняя роль греческой параллели без неестественной русской псевдобуквальности.
lexical_decisions:
- source_word: כָּל הַבָּשָׂר
  choice: всякая плоть
  rationale: Сохраняет конкретный древнееврейский образ и собирательное значение смертных живых существ; соответствует греческому πᾶσα σὰρξ.
- source_word: כַּבֶּגֶד יִבְלֶה
  choice: как одежда, ветшает
  rationale: Глагол בלה обозначает обветшание, изнашивание от времени; «ветшает» естественно продолжает сравнение с одеждой и сохраняет возвышенный, но понятный регистр.
- source_word: וְחֹק עוֹלָם
  choice: и извечный закон таков
  rationale: חק здесь — установленный закон или непреложное установление, а עולם указывает на его давность и постоянство. «Извечный закон» звучит естественно и не вводит дополнительной конфессиональной терминологии.
- source_word: גֹּוֵעַ יִגְוָעוּ
  choice: умирая, все умрут
  rationale: Передаёт корневой повтор גוע и общий смысл всеобщей смертности. Добавленное «все» делает необычную древнееврейскую конструкцию понятной по-русски, не превращая её во второе лицо, которого в еврейском тексте нет.
theological_decisions:
- issue: Трудная заключительная формула גֹּוֵעַ יִגְוָעוּ
  choice: умирая, все умрут
  alternative: умирающий — умрут; смертью умрёшь
  rationale: Еврейский текст имеет напряжённое сочетание причастия единственного числа и глагола множественного числа. Перевод сохраняет повтор глагольного корня и универсальность смертного удела, тогда как форма второго лица опиралась бы преимущественно на более свободное понимание греческой параллели.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. «Плоть» и «ветшает» сохраняют конкретность и достоинство оригинала, оставаясь понятными обычному читателю.
