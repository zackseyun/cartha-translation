translation:
  language: ru
  text: Кто устремляет своё сердце к её путям и размышляет над её постижениями[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «и постигнет её сокровенное» или «её тайны». Еврейский текст говорит о «её постижениях (разумениях)»; этому чтению следует основной текст.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַשָּׂם
  choice: Кто направляет
  rationale: Субстантивированное причастие означает «тот, кто полагает/направляет». В сочетании с «сердцем» глагол «направляет» естественно передаёт сознательную устремлённость.
- source_word: עַל דְרָכֶיהַ לִבּוֹ
  choice: своё сердце к её путям
  rationale: Сохраняется образ сердца как средоточия мысли и воли, а также женское олицетворение Премудрости. Русское «направляет сердце к» звучит естественнее буквального «полагает сердце на».
- source_word: וּבִתְבוּנֹתֶיהַ
  choice: и … над её прозрениями
  rationale: Еврейское תבונותיה обозначает её разумения, постижения или прозрения. «Прозрения» передаёт результаты глубокого понимания, не подменяя основной еврейский текст греческим чтением о тайнах.
- source_word: יִתְבּוֹנָן
  choice: размышляет
  rationale: Форма hitpael выражает вдумчивое рассмотрение и стремление понять; «размышляет» естественно и точно передаёт созерцательный оттенок.
theological_decisions:
- issue: Женское олицетворение Премудрости
  choice: её
  alternative: её как неодушевлённое притяжательное местоимение без выраженного олицетворения
  rationale: Женские формы в еврейском и греческом поддерживают литературный образ Премудрости как женщины; местоимение «её» сохраняет этот образ без догматического уточнения.
- issue: Мужской род участника
  choice: Кто направляет своё сердце
  alternative: Тот, кто направляет своё сердце
  rationale: Еврейская форма — причастие мужского рода единственного числа, но русское относительное «кто» естественно передаёт обобщённого участника, не внося несуществующего противопоставления полов.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической мудростной речи. Синтаксис краткий и афористичный; сохранены образы сердца, путей и женского олицетворения Премудрости.
