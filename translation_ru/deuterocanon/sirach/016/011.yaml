base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/011.yaml
  text: Even if one person is stiff-necked[a], it is astonishing if he will be cleared; for mercy and anger are with him, and he bears and forgives[b], but upon the wicked he lets his wrath rest.
translation:
  language: ru
  text: 'Даже если один человек упорствует[a], удивительно, если он будет оправдан[b]. Ведь с Ним и милость, и гнев: Он терпит и прощает, но даёт Своему гневу пребывать на нечестивых[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «делает шею жёсткой»; то есть упрямо сопротивляется.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «будет признан невиновным» или «останется без наказания». Еврейское יִנָּקֶה и греческое ἀθῳωθήσεται имеют судебно-правовой оттенок.'
    reason: lexical_alternative
  - marker: c
    text: Еврейский текст изображает гнев как пребывающий на нечестивых, а не просто внезапно вспыхивающий.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְשֶׁה עֹרֶף / σκληροτράχηλος
  choice: упорно противится
  rationale: Еврейская идиома буквально говорит о человеке, который «делает шею жёсткой», а греческое соответствие также обозначает упорное сопротивление. Русское «упорно противится» естественно передаёт смысл; исходный образ сохранён в сноске.
- source_word: תֵּמַהּ זֶה / θαυμαστὸν τοῦτο
  choice: удивительно
  rationale: Оба свидетеля выражают изумление по поводу предполагаемой возможности. Краткое «удивительно» сохраняет риторическую силу и звучит современно.
- source_word: יִנָּקֶה / ἀθῳωθήσεται
  choice: будет оправдан
  rationale: Еврейский и греческий глаголы допускают судебно-правовой смысл освобождения от вины или наказания. «Будет оправдан» сохраняет этот смысл, не сводя его исключительно к безнаказанности.
- source_word: רַחֲמִים
  choice: милость
  rationale: Слово обозначает сострадательную милость; «милость» ясно противопоставляется следующему упоминанию гнева и соответствует библейскому регистру.
- source_word: אַף
  choice: гнев
  rationale: Здесь אַף — существительное «гнев», а не союз «также», что подтверждается параллелизмом и последующим רָגְזוֹ.
- source_word: וְנוֹשֵׂא
  choice: Он терпит
  rationale: Глагол буквально значит «нести» и в нравственном контексте может выражать терпеливое перенесение проступка. Буквальное «несёт» по-русски здесь неясно, поэтому выбран естественный смысловой эквивалент.
- source_word: וְסוֹלֵחַ
  choice: прощает
  rationale: Это обычное значение глагола в контекстах Божьего прощения; русский эквивалент ясен и точен.
- source_word: יַנִּיחַ רָגְזוֹ
  choice: оставляет Свой гнев
  rationale: Еврейский оборот рисует гнев покоящимся на нечестивых. «Оставляет Свой гнев» сохраняет образ длительно пребывающего гнева, а не краткой вспышки.
theological_decisions:
- issue: В Боге одновременно названы милость и гнев
  choice: Сохранено прямое сопоставление милости и гнева, а затем прощения и гнева, пребывающего на нечестивых.
  alternative: Сгладить высказывание, подчеркнув только милость, либо представить гнев как исключительно кратковременное недовольство.
  rationale: Еврейский текст намеренно удерживает обе стороны рядом; перевод не должен устранять эту богословскую напряжённость.
- issue: Смысл оправдания упорно противящегося человека
  choice: Передана удивительность возможности его оправдания без уточнения, идёт ли речь о судебном признании невиновным или об освобождении от наказания.
  alternative: Перевести однозначно как «останется без наказания».
  rationale: יִנָּקֶה и греческое ἀθῳωθήσεται имеют судебную окраску, но допускают более одного смыслового оттенка; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Архаическое «жестоковыйный» заменено понятным выражением «упорно противится»; местоимения о Боге написаны с прописной буквы в соответствии с традиционным русским библейским регистром.
