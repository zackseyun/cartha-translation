base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/016.yaml
  text: His mercies are seen by all his creatures[b][a], and he has apportioned his light and his praise to the sons of man.
translation:
  language: ru
  text: Его милости видны всем Его творениям[b], а сынов человеческих Он наделил Своим светом и Своей хвалой[a].
  philosophy: optimal-equivalence
  footnotes:
