    reason: textual_variant
lexical_decisions:
- source_word: רַחֲמָיו
  choice: Его милости
  rationale: Сохраняет множественное число еврейского слова и передаёт как милосердие, так и его конкретные проявления.
- source_word: יֵרָאוּ
  choice: видны
  rationale: Передаёт естественное значение формы от ראה — «быть видимыми»; контекст со «светом» поддерживает значение проявленности, а не страха.
- source_word: לְכָל בִּרְיוֹתָיו
  choice: всем Его творениям
  rationale: 'Предлог ל естественно передан дательным падежом: милости доступны взору всех сотворённых Им существ. «Творения» сохраняет смысл созданных существ.'
- source_word: וְאוֹרוֹ
  choice: Свой свет
  rationale: Сохраняет исходный образ и его возможные буквальные и богословские оттенки без истолкования как откровения или славы.
- source_word: וְשִׁבְחוֹ
  choice: Свою хвалу
  rationale: Формально близко к שבח и не подменяет неоднозначное «хвала/достохвальность» словом «слава».
- source_word: חָלַק
  choice: уделил
  rationale: Естественно передаёт значение распределения или назначения доли и сочетается с объектами «свет» и «хвала» в возвышенной русской речи.
- source_word: לִבְנֵי אָדָם
  choice: сынам человеческим
  rationale: Сохраняет мужскую форму и образ еврейской идиомы בני אדם; примечание поясняет её общеантропологический смысл.
theological_decisions:
- issue: Антропологическое выражение בני אדם
  choice: сынам человеческим
  alternative: людям / человеческому роду
  rationale: Основной текст сохраняет форму и библейский образ еврейской идиомы, а примечание указывает, что она обозначает человечество в целом.
- issue: Отношение Божьих «света» и «хвалы» к человечеству
  choice: Свой свет и Свою хвалу Он уделил сынам человеческим
  alternative: Свой свет и Свою славу Он распределил между людьми
  rationale: Еврейский текст говорит об уделении, не уточняя, имеются ли в виду откровение, честь, достохвальность или способность воздавать хвалу; перевод сохраняет эту открытость.
- issue: Расхождение еврейского и греческого свидетелей
  choice: Основной текст следует сохранившемуся еврейскому свидетельству
  alternative: 'Греческое: «Кто вспомнит обо мне с высоты?»'
  rationale: При наличии уверенно засвидетельствованного еврейского текста он служит основой; резко отличающийся греческий вариант фиксируется в примечании, а не смешивается с ним.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Сынам человеческим» сохраняет исходную идиому; прописные местоимения при обращении к Богу поддерживают традиционный русский издательский регистр, не добавляя смысловых уточнений.
