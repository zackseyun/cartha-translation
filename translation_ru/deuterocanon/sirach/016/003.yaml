base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/003.yaml
  text: Do not trust in their life[a], and do not rely on their future; for one who does what is pleasing is better than a thousand[c][b], and to die childless than to have many children in unrighteousness and a lawless end.
translation:
  language: ru
  text: Не полагайся на их жизнь и не надейся на их будущее[a], потому что не будет у них доброго конца. Ибо один, исполняющий угодное[b], лучше тысячи; и лучше умереть бездетным, чем иметь много детей в неправде и прийти к концу, отмеченному дерзким нечестием[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст: «не держись за их место» или «не полагайся на их положение»; еврейский текст говорит об их будущем, дальнейшей судьбе или исходе.'
    reason: textual_variant
  - marker: b
    text: 'Возможно также: «исполняющий волю». Вероятно, подразумевается воля Бога или угодное Ему, но в еврейском тексте слово «Бог» прямо не названо.'
    reason: lexical_alternative
  - marker: c
    text: Еврейская концовка сжата и синтаксически неоднозначна. Слова «в неправде» могут характеризовать как многих детей, так и обстоятельство их появления; «дерзкое нечестие» также можно передать как «самонадеянное зло» или «нечестивый конец». Общий смысл противопоставляет бездетную смерть многочисленному потомству, связанному с неправдой и дурным концом.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תַּאֲמִין בְּחַיֵּיהֶם
  choice: Не полагайся на их жизнь
  rationale: Глагол אמן с предлогом выражает доверие или уверенность, а не просто интеллектуальную веру. Формулировка сохраняет необычный образ еврейского текста и связь с жизнью нечестивого потомства в контексте.
- source_word: וְאַל תִּבְטַח בְּעִקְבוֹתָם
  choice: и не надейся на их будущее
  rationale: בטח означает уповать или рассчитывать на что-либо; עקבותם буквально связано с тем, что следует позади, и здесь естественно обозначает дальнейшую судьбу или исход. Следующая фраза о недобром конце подтверждает такое понимание.
- source_word: כִּי לֹא תִהְיֶה לָהֶם אַחֲרִית טוֹבָה
  choice: потому что не будет у них доброго конца
  rationale: Отдельная строка присутствует в данном еврейском источнике и потому сохранена, несмотря на её отсутствие в греческой параллели. אחרית здесь означает конец, исход или конечную участь.
- source_word: טוֹב אֶחָד עוֹשֶׂה רָצוֹן מֵאָלֶף
  choice: один исполняющий угодное лучше тысячи
  rationale: Еврейская конструкция эллиптична; сравнительное значение подтверждается греческим текстом. רצון может означать волю, благоугодное или приемлемое; объект действия в тексте прямо не назван.
- source_word: וּמוֹת עֲרִירִי
  choice: и лучше умереть бездетным
  rationale: Сравнительное «лучше» естественно восстанавливается из предыдущей конструкции. ערירי означает бездетного, лишённого потомства.
- source_word: בָּנִים רַבִּים בְּעַוְלָה
  choice: много детей, живущих в неправде
  rationale: עולה обозначает неправду, несправедливость или нечестие. Причастный оборот по-русски ясно передаёт нравственную характеристику детей, не сводя выражение к обстоятельству их рождения.
- source_word: וּמֵאַחֲרִית זָדוֹן
  choice: и конец, исполненный дерзкого нечестия
  rationale: Сжатая еврейская фраза допускает трудности синтаксического присоединения. זדון сочетает оттенки дерзости, самонадеянности и злого умысла; развёрнутая русская формулировка сохраняет этический смысл без конфессиональной конкретизации.
theological_decisions:
- issue: Неявный объект в выражении עוֹשֶׂה רָצוֹן
  choice: 'Оставить объект не названным: «исполняющий угодное».'
  alternative: «исполняющий волю Бога» или «угождающий Богу».
  rationale: В контексте литературы мудрости, вероятно, подразумевается угодное Богу, однако слово «Бог» в еврейском тексте отсутствует. Перевод сохраняет богословский намёк, не делая его явным дополнением.
- issue: Резкое сопоставление бездетности и многочисленного нечестивого потомства
  choice: Сохранить прямое утверждение, что лучше умереть бездетным.
  alternative: Смягчить как общее предпочтение праведности многочисленному потомству.
  rationale: Текст намеренно формулирует жёсткое наставление мудрости, ставя нравственное качество выше числа потомков; перевод не устраняет эту напряжённость.
- issue: Наличие фразы о недобром конце
  choice: 'Включить: «потому что не будет у них доброго конца».'
  alternative: Опустить вслед за более краткой греческой формой и английским консультационным текстом.
  rationale: Фраза явно присутствует в предоставленном основном еврейском свидетельстве. Поскольку перевод должен исходить прежде всего из оригинального источника, её опускать нельзя.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительной литературы. Синтаксис сделан ясным для обычного читателя, но необычные образы и резкость исходного текста сохранены. Фраза «доброго конца» восстановлена непосредственно по основному еврейскому свидетельству; разночтение греческой параллели и неоднозначность רצון и заключительной фразы вынесены в сноски.
