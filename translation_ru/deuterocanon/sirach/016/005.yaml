  text: Многое подобное этому видел мой глаз, и многое столь же могучее слышало моё ухо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «и более сильное, чем это, слышало моё ухо». Еврейский текст говорит о могучем, подобном этому, без явно выраженной сравнительной степени.'
    reason: Греческий параллельный текст содержит сравнительную степень ἰσχυρότερα, тогда как еврейское כָּאֵלֶּה выражает уподобление.
lexical_decisions:
- source_word: רַבּוֹת כָּאֵלֶּה
  choice: многое подобное
  rationale: 'Прилагательное во множественном числе употреблено субстантивированно, а כָּאֵלֶּה выражает уподобление: «многое подобное этому». В русском единственное собирательное «многое» звучит естественно.'
- source_word: רַאֲתָה עֵינִי
  choice: видел мой глаз
  rationale: Сохранено единственное число еврейского поэтического выражения и параллелизм с «слышало моё ухо».
- source_word: וְעַצֻּמוֹת כָּאֵלֶּה
  choice: о столь же могучем
  rationale: עַצֻּמוֹת обозначает силу, мощь или внушительность; כָּאֵלֶּה в еврейском тексте означает «подобное этому», не выражая сравнительной степени явно. Предлог «о» необходим для естественного сочетания с русским «слышать» в значении получения вести.
- source_word: שָׂמְעָה אָזְנִי
  choice: слышало моё ухо
  rationale: 'Сохранены единственное число и образная симметрия исходного двустишия: глаз видит, ухо слышит.'
