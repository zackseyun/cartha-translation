lexical_decisions:
- source_word: לֹא נָשָׂא
  choice: не пощадил
  rationale: В данном контексте נשא с отрицанием и личным дополнением означает отказ простить или проявить снисхождение. «Не пощадил» естественно передаёт смысл суда и согласуется с греческим οὐκ ἐξιλάσατο.
- source_word: לֲנְסִיכֵי קֶדֶם
  choice: древних властителей
  rationale: Еврейское выражение буквально обозначает «властителей/князей древности». В основном тексте сохранено еврейское чтение, а греческое отождествление их с древними исполинами вынесено в сноску.
- source_word: הַמּוֹרִים
  choice: восставших
  rationale: Причастие от מרה выражает непокорность, мятеж или противление. «Восставших» сохраняет нравственный смысл сознательного бунта и подходит к возвышенному повествовательному регистру.
- source_word: עוֹלָם
  choice: не передано отдельным словом
  rationale: Переданное еврейское עולם в этом месте текстологически затруднительно и в обычном значении «вечно» или «древность» нарушает смысл и синтаксис строки. Неясность обозначена в сноске, а основной текст следует связному смыслу, подтверждаемому греческим параллельным текстом.
- source_word: בִּגְבוּרָתָם
  choice: полагаясь на свою мощь
  rationale: גבורה означает силу, могущество, мощь. Такая передача естественно выражает, что собственная сила стала основанием их восстания, и соответствует греческому τῇ ἰσχύϊ αὐτῶν.
theological_decisions:
- issue: Кого Бог подверг суду
  choice: Основной текст следует еврейскому «древние властители».
  alternative: «Древние исполины», как в греческом тексте.
  rationale: Сохранившийся еврейский текст имеет приоритет, однако греческий перевод представляет древнюю интерпретацию, отождествляющую этих властителей с первобытными исполинами. Сноска сохраняет это различие, не устраняя неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Древние властители» понятнее и естественнее буквального «князья древности»; оборот «полагаясь на свою мощь» передаёт смысл без тяжеловесной кальки.
