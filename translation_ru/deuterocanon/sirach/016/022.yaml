translation:
  language: ru
  text: Кто возвестит о деле праведности,[a][b] и кто станет ожидать его? Ведь завет далёк.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь труден; приблизительно: «Что за дело праведности — кто расскажет о нём? И надежда на что?..» Греческий текст читается яснее: «Кто возвестит дела праведности, и кто станет ждать (или: выстоит)? Ведь завет далёк».'
    reason: textual_variant
  - marker: b
    text: 'Или: «о делах праведности»; возможно также: «о праведном деле» или «о справедливом деле».'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте — «завет»; в дошедшем еврейском тексте, по-видимому, «установление» или «постановление».
    reason: alternative_reading
lexical_decisions:
- source_word: מָה מַעֲשֶׂה צֶדֶק / ἔργα δικαιοσύνης
  choice: о праведном деле
  rationale: Передаёт общее смысловое ядро трудного еврейского чтения и греческого «дела праведности» естественным современным русским выражением; единственное число отражает форму дошедшего еврейского текста, а вариант множественного числа отмечен в сноске.
- source_word: מִי יַגִּידֶנּוּ / τίς ἀναγγελεῖ
  choice: Кто возвестит
  rationale: Глаголы в обоих источниках допускают значение «сообщить, объявить, возвестить». «Возвестит» сохраняет возвышенный, но понятный регистр риторического вопроса.
- source_word: וְתִקְוַת מָּה כִי אָצוּק חוֹק / ἢ τίς ὑπομενεῖ
  choice: и кто станет ожидать его
  rationale: Еврейская строка крайне трудна, но תִקְוָה связано с надеждой и ожиданием; греческое ὑπομενεῖ означает «будет ждать, выстоит». «Станет ожидать» сохраняет вероятное пересечение этих смыслов, не сводя выражение исключительно к терпению.
- source_word: חוֹק / ἡ διαθήκη
  choice: завет
  rationale: Основной текст следует связному греческому чтению διαθήκη, тогда как еврейское חוֹק означает «установление, постановление». Расхождение явно обозначено в сноске.
- source_word: μακρὰν
  choice: ещё далёк
  rationale: Прямо передаёт греческое «далеко» и объясняет вопрос об ожидании. Частица «ещё» естественно выражает временную отдалённость, подразумеваемую контекстом.
theological_decisions:
- issue: Как соотнести трудный дошедший еврейский текст с более связным греческим параллельным чтением
  choice: В основном тексте использован связный смысл греческой строки с учётом еврейской лексики ожидания; существенные еврейские варианты вынесены в сноски.
  alternative: 'Перевести строго по еврейскому тексту: «Что за дело праведности — кто расскажет о нём? И надежда на что? Ведь установлено постановление».'
  rationale: Дошедшая еврейская строка синтаксически и семантически нарушена, особенно во второй половине, тогда как греческий текст образует связное риторическое высказывание. Выбор не скрывает разночтение и не придаёт слову «завет» бесспорного статуса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка сохраняет риторический параллелизм и открыто отмечает текстологическую неуверенность.
