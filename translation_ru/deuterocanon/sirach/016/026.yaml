translation:
  language: ru
  text: Когда Бог изначально сотворил Свои творения, Он определил порядок их жизни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Вторая часть еврейского текста трудна для понимания. В греческом тексте сказано: «и от сотворения их Он отделил их доли», что поддерживает мысль о первоначальном установлении и распределении порядка.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּבְרֹא
  choice: Когда ... сотворил
  rationale: 'Предлог כ при инфинитиве ברא естественно выражает время: «когда сотворил».'
- source_word: אֵל
  choice: Бог
  rationale: Прямое и контекстуально достаточное соответствие божественному наименованию אֵל.
- source_word: מַעֲשָׂיו
  choice: Свои творения
  rationale: В контексте сотворения речь идёт о созданном Богом; «творения» по-русски естественнее, чем буквальное «дела», и сохраняет связь с актом творения.
- source_word: מֵרֹאשׁ
  choice: изначально
  rationale: Передаёт исходную точку и первоначальный порядок творения, соответствуя также греческому ἀπ’ ἀρχῆς.
- source_word: עַל חַיֵּיהֶם
  choice: их порядок жизни
  rationale: Передача намеренно сохраняет некоторую широту трудного еврейского выражения, связывая חַיֵּיהֶם с жизнью созданных существ.
- source_word: חָלָק
  choice: распределил между ними
  rationale: Корень выражает разделение или наделение долями; добавление «между ними» делает синтаксическую связь ясной по-русски.
- source_word: מִשְׁטָרָם
  choice: их порядок
  rationale: מִשְׁטָר может обозначать управление, установленный строй или порядок. «Порядок» подходит контексту устроения творения и не приписывает существам самостоятельного владычества.
theological_decisions:
- issue: Описание первоначального устроения творения в текстуально трудной второй части стиха
  choice: Передать мысль о том, что Бог распределил между творениями установленный для них порядок жизни.
  alternative: '«Над их жизнями Он распределил их власть»; либо, ближе к греческому: «и, создавая их, Он отделил их доли».'
  rationale: Еврейский текст остаётся основой, однако сочетание עַל חַיֵּיהֶם [חָלָק מִשְׁטָרָם] неясно. Греческий параллельный текст подтверждает общую идею разделения долей при сотворении. Формулировка не превращает возможный «порядок/управление» в более определённое богословское учение.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Неясность еврейской второй части обозначена сноской; основной текст передаёт вероятный смысл без излишней конкретизации.
