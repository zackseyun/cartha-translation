revisions:
- from: Когда Бог изначально сотворил Свои творения, Он распределил между ними их порядок жизни.[a]
  to: Когда Бог изначально сотворил Свои творения, Он определил порядок их жизни.[a]
  rationale: Исправление удаляет не подтверждённое текстом «между ними» и заменяет неестественное «распределил ... порядок жизни» на естественное и более осторожное «определил порядок их жизни». Сноска прямо отмечает трудность еврейского текста и сохраняет греческое свидетельство об «отделении долей», не подменяя еврейский текст греческим чтением.
