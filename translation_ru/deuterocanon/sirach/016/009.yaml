    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא חָמַל
  choice: И не пощадил Он
  rationale: חמל может означать жалость, сострадание или пощаду. В контексте суда «не пощадил» естественно передаёт действие; местоимение «Он» проясняет подразумеваемого деятеля и сохраняет связь с контекстом.
- source_word: גוֹי
  choice: народа
  rationale: גוי обозначает народ или племенную общность; «народ» не вызывает современных государственно-политических ассоциаций слова «нация».
- source_word: חֶרֶם
  choice: обречённого на истребление
  rationale: חרם обозначает нечто преданное заклятию и тем самым предназначенное для уничтожения. Выбранная формулировка передаёт судебную и сакральную силу термина понятным современным языком.
- source_word: הַנּדוֹשִׁים
  choice: попранных
  rationale: Трудная еврейская форма, вероятно, связана с образом попрания или молотьбы. «Попранных» сохраняет этот образ суда, не прибегая к неясному буквальному «обмолоченных».
- source_word: בַּעֲוֹנָם
  choice: в их беззаконии
  rationale: עון выражает беззаконие и вину, а предлог ב допускает значение состояния или обстоятельства. Буквально близкая формулировка сохраняет неопределённость между пребыванием во грехе и судом за него.
theological_decisions:
- issue: Передача חרם в контексте Божьего суда
  choice: обречённого на истребление
  alternative: преданного заклятию; подлежащего уничтожению
  rationale: Формулировка сохраняет суровый судебный смысл и связь с посвящением уничтожению, не вводя позднейшей конфессиональной терминологии.
- issue: Толкование трудной формы הַנּדוֹשִׁים с учётом греческой параллели
  choice: попранных в их беззаконии
  alternative: удалённых в их грехах; сокрушённых за своё беззаконие
  rationale: Основной текст следует первичному еврейскому свидетельству и сохраняет образ попрания. Отличающееся греческое чтение вынесено в примечание, чтобы не скрывать текстовую и смысловую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Тире обозначает пояснительное приложение и помогает сохранить переход от собирательного единственного числа «народа» к множественному «попранных». Архаизмы сведены к минимуму; «беззаконие» сохранено как точный и общепонятный религиозно-нравственный термин.
