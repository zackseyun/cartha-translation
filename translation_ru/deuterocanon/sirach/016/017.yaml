base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/017.yaml
  text: Do not say[a], “I am hidden from God, and from on high who will remember me? In a great people I will not be known; and what is my life among the ends of the winds, all the sons of man?”
translation:
  language: ru
  text: 'Не говори[a]: «Я скрыт от Бога, и кто вспомнит обо мне свыше? Среди многочисленного народа меня не узнают; и что значит моя жизнь среди всех сынов человеческих — как на пределах ветров?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте вместо «как на пределах ветров» — «в неизмеримом творении»; возможно, это отражает другой еврейский исходный текст или истолковывающую передачу трудного еврейского выражения.
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תֹּאמַר
  choice: Не говори
  rationale: Прямой запрет передан обычной и естественной русской формой без добавления «про себя», которого нет в еврейском тексте.
- source_word: מֵאֵל נִסְתַּרְתִּי
  choice: Я скрыт от Бога
  rationale: Сохраняется утверждение говорящего о том, будто он недоступен Божьему взору; греческое κρυβήσομαι подтверждает значение сокрытости.
- source_word: וּבַמָּרוֹם
  choice: с высоты
  rationale: Передаёт пространственный образ вышнего мира, не подменяя его более истолковывающим словом «небеса».
- source_word: יִזְכְּרֵנִי
  choice: вспомнит обо мне
  rationale: Сохраняет основное значение корня זכר и соответствует греческому μνησθήσεται; предложное управление естественно для современного русского языка.
- source_word: בְּעַם כָּבֵד
  choice: среди великого множества
  rationale: כבד буквально связано с тяжестью и весом, но здесь обозначает большое, многочисленное собрание людей; перевод сохраняет оттенок величины и звучит естественно.
- source_word: לֹא אִוָּדֵעַ
  choice: меня не узнают
  rationale: Пассивное значение нифаля от ידע передано как отсутствие узнавания или замеченности; форма не уточняет действующее лицо и сохраняет мысль мнимой безвестности.
- source_word: וּמַה נַפְשִׁי
  choice: и что значит моя жизнь
  rationale: נפש может означать душу, жизнь или самого человека. В риторическом вопросе о собственной незначительности «моя жизнь» естественно передаёт экзистенциальный смысл, не вводя узко антропологического толкования.
- source_word: כְּקַצּוֹת רוּחוֹת
  choice: словно на пределах ветров
  rationale: Сохранён трудный и конкретный космический образ еврейского текста. Предлог «на» делает выражение приемлемым по-русски, а «словно» передаёт כְּ.
- source_word: כּלָ בּנֵי אָדָם
  choice: среди всех сынов человеческих
  rationale: Коллективная еврейская формула передана традиционным, но понятным современному читателю выражением, обозначающим всё человечество. Перестановка внутри последней фразы позволяет по-русски связать её с вопросом о незначительности отдельной жизни.
theological_decisions:
- issue: 'Трудный образ в заключительной части: еврейские «пределы ветров» или греческое «неизмеримое творение»'
  choice: В основном тексте сохранён еврейский образ «словно на пределах ветров»
  alternative: «в неизмеримом творении»
  rationale: Сохранившийся еврейский текст является первичным свидетельством. Греческий вариант может отражать иной Vorlage или истолковывающее сглаживание трудного оборота; альтернативу следует отметить, но не подменять ею еврейское чтение.
- issue: Значение נַפְשִׁי в риторическом вопросе
  choice: «моя жизнь»
  alternative: «моя душа»
  rationale: Контекст говорит о кажущейся незначительности отдельного человеческого существования, поэтому «жизнь» передаёт широкий смысл נפש и не навязывает определённой доктрины о составе человека.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Риторические вопросы и образ высоты сохранены; трудная заключительная метафора не сглажена до однозначного толкования.
