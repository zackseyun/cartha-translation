base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/027.yaml
  text: He ordered his works forever[a], and their beginnings for their generations; they neither hungered nor grew weary, and they did not cease from their works.
translation:
  language: ru
  text: Он навеки упорядочил Свои творения и их начала — на все их поколения[a]. Они не голодают и не устают и не прекращают своих дел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их власти» или «области владычества». Греческое слово может означать «начала», а также «власти» или установленные области действия; точный смысл в этом месте не вполне ясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκόσμησεν
  choice: упорядочил
  rationale: В космологическом контексте глагол означает привести в порядок, устроить; перевод передаёт установление Богом стройного порядка творения, а не его украшение.
- source_word: εἰς αἰῶνα
  choice: навеки
  rationale: Передаёт устойчивость установленного порядка во времени естественным и возвышенным русским выражением.
- source_word: τὰ ἔργα αὐτοῦ
  choice: Свои творения
  rationale: В данном контексте речь идёт о сотворённых Богом частях мироздания; «творения» яснее русского «дела» указывает на созданный мир.
- source_word: τὰς ἀρχὰς αὐτῶν
  choice: определил им служение
  rationale: Многозначное ἀρχαί может обозначать начала, власти или установленные области действия. Контекст непрерывного исполнения дел позволяет передать функциональный смысл, не превращая творения в самостоятельные «владычества».
- source_word: εἰς γενεὰς αὐτῶν
  choice: из рода в род
  rationale: Естественно выражает длительность через последовательные поколения; принадлежность местоимения отражена конструкцией «им ... из рода в род».
- source_word: οὔτε ἐπείνασαν οὔτε ἐκοπίασαν
  choice: не испытывают ни голода, ни усталости
  rationale: Гномические аористы описывают постоянное свойство установленного порядка, поэтому настоящее время уместно по-русски; параллелизм двух отрицаний сохранён.
- source_word: οὐκ ἐξέλιπον ἀπὸ τῶν ἔργων αὐτῶν
  choice: не прекращают своего дела
  rationale: Передаёт отсутствие сбоя или прекращения в исполнении назначенной деятельности. Единственное собирательное «дела» звучит естественнее, сохраняя общий смысл множественного ἔργων.
theological_decisions:
- issue: Значение τὰς ἀρχὰς αὐτῶν в описании порядка творения
  choice: Установленное Богом служение или область действия Его творений
  alternative: Их начала; их власти или владения
  rationale: ἀρχή действительно допускает значения «начало» и «власть». Однако последующие слова о неустанном исполнении дел поддерживают функциональное понимание. Сноска сохраняет подлинную лексическую неоднозначность и не утверждает отдельной доктрины о космических властях.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Настоящее время передаёт общеистинный характер греческих аористов. Прописное «Свои» принято как уважительное оформление местоимения, относящегося к Богу.
