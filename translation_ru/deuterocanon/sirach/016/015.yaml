  text: Yahweh hardened Pharaoh’s heart[a], though he did not know him, for his deeds are revealed under heaven.
translation:
  language: ru
  text: Господь ожесточил сердце фараона[a], который не знал Его, ибо дела его[b] открыты под небесами.
  philosophy: optimal-equivalence
  footnotes:
