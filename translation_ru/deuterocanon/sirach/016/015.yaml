    reason: ambiguous_referent
lexical_decisions:
- source_word: יְהֹוָה
  choice: Господь
  rationale: Передаёт тетраграмматон в соответствии с укоренившейся русской библейской традицией, без реконструкции произношения имени.
- source_word: הִקְשָׁה
  choice: ожесточил
  rationale: Каузативная форма глагола קשה в повествованиях о фараоне означает сделать сердце упорным, неподатливым; «ожесточил» сохраняет связь с русской традицией перевода Исхода.
- source_word: לֵב פַּרְעֹה
  choice: сердце фараона
  rationale: Сохраняет библейский образ сердца как средоточия воли и мысли и явную отсылку к рассказу об Исходе.
- source_word: אֲשֶׁר לֹא יְדָעוֹ
  choice: который не знал Его
  rationale: Относительное местоимение естественно соотносится с фараоном, а объектный суффикс — с Господом. Буквальная относительная конструкция не навязывает отсутствующий в еврейском тексте однозначный уступительный или причинный оттенок.
- source_word: שֶׁמַעֲשָׂיו
  choice: ведь дела его
  rationale: Префикс שׁ понят как вводящий пояснение. Строчная форма «его» сохраняет возможную неоднозначность того, чьи именно дела имеются в виду, хотя ближайший грамматический референт — фараон.
- source_word: מְגֻלִּין
  choice: открыты
  rationale: Пассивное причастие выражает обнажённость, явность и невозможность скрыть дела; «открыты» звучит естественно и сохраняет этот смысл.
- source_word: תַּחַת הַשָּׁמַיִם
  choice: под небесами
  rationale: Близко передаёт еврейскую форму множественного числа и сохраняет возвышенный библейский оборот.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и греческой параллели
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; существенное расхождение греческого текста отмечено в сноске.
  alternative: 'Перевести по греческому: «Не говори: „Я скроюсь от Господа“».'
  rationale: При наличии еврейского текста он служит первичным источником для перевода Сираха. Греческая строка не соответствует ему словесно и, вероятно, отражает иную текстовую форму либо иную нумерацию и привязку стихов; её нельзя молча смешивать с еврейской.
- issue: Референт выражения «дела его»
  choice: Сохранить местоименную неоднозначность исходного текста.
  alternative: 'Уточнить: «дела фараона» или «дела Господа».'
  rationale: Еврейский суффикс допускает понимание по ближайшему референту — как указание на фараона, однако прямое уточнение отсутствует. Эксплицитная замена имени внесла бы толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Сохранены традиционные выражения «ожесточил сердце» и «под небесами»; синтаксис сделан ясным без устранения реальной местоименной неоднозначности.
