  terminology: «Жизнь» уместнее «души» в данном космологическом контексте и не навязывает позднейшего антропологического смысла. «Поверхность» естественно передаёт πρόσωπον применительно к подразумеваемой земле. Сноски корректно объясняют образ и сохраняют альтернативное направление εἰς.
