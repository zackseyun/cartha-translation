  source_fidelity: 'Текст точно передаёт греческую структуру: τὸ πρόσωπον αὐτῆς выступает подлежащим («её поверхность покрыла»), ψυχὴν παντὸς ζῴου передано как «жизнь всякого живого существа», а ἀποστροφή — как возвращение. Женский род местоимений сохранён без неоправданного внесения слова «земля» в основной текст. Передача εἰς как «к ней» допустима; вариант «в неё» надлежащим образом отмечен.'
