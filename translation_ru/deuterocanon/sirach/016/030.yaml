  text: The surface of it covered the life of every living thing[b][a], and to it is their return.
translation:
  language: ru
  text: Её поверхность[a] покрыла жизнь всякого живого существа, и к ней они возвращаются[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «её лицо»; вероятно, имеется в виду поверхность земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и в неё они возвращаются».'
    reason: alternative_reading
lexical_decisions:
- source_word: ψυχὴν
  choice: жизнь
  rationale: В сочетании с παντὸς ζῴου слово обозначает одушевлённую жизнь живого существа, а не обязательно нематериальную «душу».
- source_word: παντὸς ζῴου
  choice: всякого живого существа
  rationale: Передаёт широкий смысл ζῷον и не сужает его до одних животных.
- source_word: ἐκάλυψεν
  choice: покрыла
  rationale: Сохраняет прямое значение глагола и необычное построение греческой фразы, где подлежащим выступает τὸ πρόσωπον αὐτῆς.
- source_word: τὸ πρόσωπον αὐτῆς
  choice: её поверхность
  rationale: Буквально «её лицо»; применительно к подразумеваемой земле современное русское «поверхность» ясно передаёт пространственный образ, сохраняя местоимение женского рода.
- source_word: καὶ εἰς αὐτὴν
  choice: и к ней
  rationale: εἰς допускает значения направления «к» и «в». В основном тексте выбрано менее конкретизирующее «к ней», а вариант «в неё» отмечен в сноске.
- source_word: ἡ ἀποστροφὴ αὐτῶν
  choice: они возвращаются
  rationale: Греческое отглагольное существительное «их возвращение» естественно передано по-русски глагольной конструкцией без изменения смысла.
theological_decisions:
- issue: К чему относятся местоимения αὐτῆς и αὐτὴν
  choice: 'Сохранить местоимения женского рода: «её… к ней», подразумевая землю из контекста.'
  alternative: 'Уточнить в тексте: «поверхность земли… к земле» или передать местоимение нейтрально.'
  rationale: В данной строке земля прямо не названа, хотя контекст указывает на неё. Местоименная передача сохраняет анафору и не добавляет отсутствующего в греческой фразе существительного.
- issue: Направление возвращения, выраженное εἰς
  choice: «к ней»
  alternative: «в неё»
  rationale: «К ней» сохраняет общее представление о возвращении к земле, не делая погребение единственно возможным смыслом; более пространственное «в неё» остаётся допустимым вариантом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Сохранены женские местоимения греческого текста и его необычный образ; номинальная конструкция заключительной части ради естественности передана глаголом.
