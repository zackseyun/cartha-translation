  rationale: 'Правка минимальна: «высшие небеса» улучшает современную естественность, «стоят» не добавляет смысловой конкретизации, а «содрогнутся» передаёт еврейский имперфект и согласуется с греческим будущим временем. Трудное еврейское чтение о нисхождении и стоянии сохранено в основном тексте и пояснено сноской; греческий вариант не подменяет его.'
