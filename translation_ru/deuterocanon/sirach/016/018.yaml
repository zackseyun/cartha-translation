base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/018.yaml
  text: 'Look—the heavens and the highest heavens[a], the deep and the earth: when he descends upon them, they stand still[b]; at his visitation they quake.'
translation:
  language: ru
  text: 'Вот небеса и высшие небеса[a], бездна и земля: когда он нисходит на них, они стоят[b]; при его посещении они содрогнутся.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «небеса и небеса небес» — древнееврейское выражение превосходной степени.'
    reason: lexical_alternative
  - marker: b
    text: 'Эта строка составного древнееврейского текста трудна: буквально она говорит, что при его нисхождении они «стоят». В греческом тексте соответствующая часть стиха читается проще: «бездна и земля поколеблются при его посещении».'
    reason: textual_variant
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт указательно-восклицательную силу частицы естественным и достойным современным русским выражением.
- source_word: הַשָּׁמַיִם וּשְׁמֵי הַשָּׁמַיִם
  choice: небеса и высочайшие небеса
  rationale: Древнееврейская конструкция «небеса небес» выражает превосходную степень; идиоматический перевод сохраняет смысл высшей небесной области.
- source_word: תְהוֹם
  choice: бездна
  rationale: Слово обозначает первозданную глубину или бездну; русский вариант «бездна» естественен в космическом контексте и согласуется с греческим ἄβυσσος.
- source_word: בְּרִדְתּוֹ עֲלֵיהֶם עוֹמְדִים
  choice: когда он нисходит на них, они стоят недвижимо
  rationale: Перевод непосредственно отражает сохранившееся древнееврейское чтение, не устраняя его напряжённость; «недвижимо» уточняет контекстуальный смысл «стоят».
- source_word: בְּפָקְדוֹ
  choice: при его посещении
  rationale: פקד здесь обозначает властное вмешательство, посещение или испытующее обращение Бога; существительное сохраняет формальный вес и некоторую смысловую широту исходного слова.
- source_word: יִרְגְּשׁוּ
  choice: они содрогаются
  rationale: Передаёт сильное движение, дрожь или потрясение космических областей; греческое σαλευθήσονται подтверждает значение «будут потрясены».
theological_decisions:
- issue: Антропоморфный образ божественного нисхождения
  choice: когда он нисходит на них
  alternative: при его посещении
  rationale: Несмотря на трудность составного древнееврейского текста, выражение о нисхождении присутствует в основном еврейском свидетельстве и не должно молча устраняться в пользу менее антропоморфного греческого чтения.
- issue: Значение божественного פקד
  choice: при его посещении
  alternative: когда он испытывает их
  rationale: «Посещение» сохраняет возможность как явления, так и властного вмешательства или суда, не сводя неоднозначное слово к одной доктринальной трактовке.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Местоимение «он» оставлено со строчной буквы по общим нормам современного издания; параллелизм и напряжение между неподвижностью и содроганием сохранены.
