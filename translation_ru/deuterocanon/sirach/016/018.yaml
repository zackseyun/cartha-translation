  source_fidelity: 'Первая часть еврейского текста передана в целом точно: сохранены «небеса», «небеса небес», бездна, земля, нисхождение и глагол «стоят». Однако «недвижимо» несколько чрезмерно конкретизирует простой глагол «стоят». Финальный еврейский имперфект יִרְגְּשׁוּ естественнее передать будущим временем: «содрогнутся». Греческий параллельный текст подтверждает именно будущее космическое потрясение при божественном посещении.'
