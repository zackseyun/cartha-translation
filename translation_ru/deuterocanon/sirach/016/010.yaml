  text: So also six hundred thousand foot soldiers[b][a], gathered together in the arrogance of their heart.
translation:
  language: ru
  text: Так же и шестьсот тысяч пеших воинов[a], собранных вместе в надменности своего сердца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «шестьсот тысяч пеших воинов», вероятно, отсылает к поколению израильтян, странствовавшему по пустыне; ср. традиционное число в Исх. 12:37 и Чис. 11:21.
    reason: cross_reference
  - marker: b
    text: 'Или: «в дерзости своего сердца»; или: «в самонадеянности своего сердца».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Так же и
  rationale: Передаёт присоединение ещё одного, параллельного предыдущим, примера суда и естественно связывает стих с контекстом.
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: шестьсот тысяч
  rationale: Прямо передаёт еврейское числительное; число написано словами в соответствии с литературным регистром.
- source_word: רַגְלִי
  choice: пеших воинов
  rationale: Слово обозначает людей, идущих или сражающихся пешими; греческое πεζῶν подтверждает военный смысл. Вариант «пеших воинов» ясен современному читателю.
- source_word: הַנֶּאֱסָפִים
  choice: собранных вместе
  rationale: Сохраняет пассивное значение причастия от אסף и согласуется с греческим ἐπισυναχθέντας, не уточняя, кем именно они были собраны.
- source_word: בִּזְדוֹן
  choice: в надменности
  rationale: זדון выражает вызывающую, самонадеянную гордость. «Надменность» передаёт нравственную окраску и остаётся естественным литературным словом; возможны также «дерзость» и «самонадеянность».
- source_word: לִבָּם
  choice: своего сердца
  rationale: Сохраняет еврейское собирательное единственное число «сердце» при множественном носителе; русское возвратное местоимение естественно указывает на принадлежность этой группе.
theological_decisions:
- issue: Кого обозначают шестьсот тысяч
  choice: Не называть эту группу Израилем в основном тексте, сохранив неявную отсылку.
  alternative: Прямо определить их как поколение Израиля во время странствования по пустыне.
  rationale: Число, вероятно, отсылает к поколению исхода, однако сам стих не называет группу прямо. Поэтому вероятная идентификация вынесена в перекрёстную сноску, а неоднозначность основного текста сохранена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Причастный оборот сохраняет компактность и синтаксическую зависимость еврейского текста; порядок слов остаётся естественным для русского языка.
