  text: An unjust one will not escape with plunder[a], and the desire of the righteous will never fail.
translation:
  language: ru
  text: Неправедник не уйдёт с награбленным[a], и желание праведника никогда не останется тщетным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст: «Грешник не уйдёт с награбленным, и терпение благочестивого нисколько не будет задержано». Во второй части еврейский текст употребляет активную форму: «и он никогда не пресечёт желания праведника»; деятель не назван.'
    reason: Греческий параллельный текст во второй части заметно отличается, говоря о терпении благочестивого; еврейский текст говорит о желании праведника и не выражает деятеля активного глагола.
lexical_decisions:
- source_word: לֹא יִמָּלֵט
  choice: не спасётся
  rationale: Нифаль глагола מלט означает «спастись, избежать опасности или возмездия». В данном контексте «не спасётся» естественно передаёт мысль о невозможности уйти от суда.
- source_word: בְּגָזֵל
  choice: благодаря награбленному
  rationale: גזל обозначает грабёж или добытое грабежом, а предлог בְּ может указывать на средство. Перевод показывает, что неправедно приобретённое не поможет избежать возмездия.
- source_word: עַוָּל
  choice: неправедный
  rationale: Слово обозначает человека, поступающего несправедливо или превратно. «Неправедный» точно сохраняет нравственный контраст с צַדִּיק — «праведником», не подменяя еврейское слово более общим «грешник» из греческого параллельного текста.
- source_word: וְלֹא יַשְׁבִּית
  choice: не останется тщетным
  rationale: Форма הִפעיל буквально выражает прекращение или пресечение; при объекте «желание праведника» смысл естественно передаётся как обещание, что оно не будет окончательно сведено на нет. Безличная конструкция не уточняет не названного прямо деятеля.
- source_word: תַּאֲוַת צַדִּיק
  choice: желание праведника
  rationale: תאוה означает желание, стремление или сильное чаяние; единственное число צדיק имеет обобщающий смысл. Буквальное «желание праведника» сохраняет широту выражения.
- source_word: לְעוֹלָם
  choice: вовек
  rationale: При отрицании выражение имеет значение «никогда, вовек». Краткое «вовек» соответствует возвышенному, но понятному регистру книги.
theological_decisions:
- issue: Нравственное обозначение עַוָּל и греческое ἁμαρτωλός
  choice: неправедный
  alternative: грешник
  rationale: Основной текст следует еврейскому עַוָּל, подчёркивающему неправедность, тогда как греческое «грешник» отражает близкую, но более общую нравственную категорию.
- issue: Смысл и грамматическая форма второй половины стиха
  choice: желание праведника вовек не останется тщетным
  alternative: Он вовек не пресечёт желания праведника
  rationale: В еврейском стоит активная каузативная форма «не прекратит/не пресечёт», но деятель прямо не назван. Русская безличная формулировка сохраняет обещание текста и не вводит явно названного субъекта. Отличающееся греческое чтение вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Формулировки остаются понятными без специальной богословской подготовки; слово «вовек» сохраняет афористическую краткость еврейского двустишия.
