  text: In the assembly of the wicked[a], fire burns; and among a godless nation, wrath is kindled.
translation:
  language: ru
  text: В собрании нечестивых пылает огонь, и среди безбожного народа[a] воспылал гнев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «среди непокорного народа воспылал гнев»; в еврейском — «среди безбожного народа».'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲדַת רְשָׁעִים
  choice: В собрании нечестивых
  rationale: עֵדָה означает собравшуюся общину или сообщество, а предлог ב здесь естественно понимать локативно. רְשָׁעִים обозначает нравственно порочных, нечестивых людей; «нечестивые» точнее передаёт еврейский текст, чем греческое «грешники».
- source_word: יוֹקֶדֶת אֵשׁ
  choice: пылает огонь
  rationale: Причастная форма от יקד выражает продолжающееся горение или сильное пламя. «Пылает огонь» сохраняет образ и звучит естественно и возвышенно.
- source_word: וּבְגוֹי חָנֵף
  choice: и среди безбожного народа
  rationale: גּוֹי здесь — народ, а ב имеет локативный смысл. חָנֵף в данном контексте означает нечестивый, безбожный или осквернённый; «безбожный» ясно передаёт религиозно-нравственный смысл и не смешивает его с более узким современным значением слова «лицемерный».
- source_word: נִצְּתָה חֵמָה
  choice: воспылал гнев
  rationale: Совершенная форма נִצְּתָה передаёт вспыхнувшее действие, а חֵמָה — сильный гнев или ярость. «Воспылал гнев» сохраняет метафору возгорания и прошедшее время еврейского текста.
theological_decisions:
- issue: Следовать ли еврейскому חָנֵף («безбожный, нечестивый») или греческому ἀπειθεῖ («непокорный, непослушный»).
  choice: безбожного
  alternative: непокорного
  rationale: Сохранившийся еврейский текст является основным источником для перевода. Греческий параллельный текст отражает близкую, но не тождественную характеристику народа, поэтому его вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным и достойным звучанием. Параллелизм двух полустиший и общий образ пылающего огня и вспыхнувшего гнева сохранены; временное различие еврейских форм передано настоящим и прошедшим временем.
