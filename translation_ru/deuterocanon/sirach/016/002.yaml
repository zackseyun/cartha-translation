  text: Even if they become many[a], do not delight in them, if the fear of Yahweh is not with them.
translation:
  language: ru
  text: Даже если их станет много, не радуйся им[a], если с ними нет страха Господнего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение здесь не вполне ясно; греческая параллель поддерживает перевод «не радуйся им».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אִם / ἐὰν
  choice: Даже если
  rationale: 'Передаёт уступительное условие в контексте: многочисленность сама по себе не является поводом для радости.'
- source_word: פָּרוּ / πληθύνωσιν
  choice: их станет много
  rationale: Еврейский глагол означает «плодиться, умножаться», а греческая параллель подтверждает значение увеличения числом. Формулировка естественна по-русски и не сужает смысл до физиологической плодовитости.
- source_word: אַל תָּבֻעַ בָּם / μὴ εὐφραίνου ἐπʼ αὐτοῖς
  choice: не радуйся им
  rationale: Еврейская форма не вполне прозрачна, но греческая параллель ясно указывает на радость или удовлетворение по поводу них. Выбран краткий и естественный русский эквивалент.
- source_word: אִם אֵין אִתָּם / εἰ μὴ ἔστιν ... μετʼ αὐτῶν
  choice: если с ними нет
  rationale: Сохраняет выраженную в еврейском и греческом текстах идею присутствия или сопутствия, а не просто обладания.
- source_word: יִרְאַת יְהֹוָה / φόβος Κυρίου
  choice: страха перед Господом
  rationale: Сохраняет традиционную для литературы мудрости формулу «страх Господень», но выражает её на ясном современном русском языке без ослабления до одного лишь «почтения».
- source_word: יְהֹוָה
  choice: Господом
  rationale: Передаёт тетраграмматон принятой в русской библейской традиции формой «Господь».
theological_decisions:
- issue: Передача формулы יִרְאַת יְהֹוָה
  choice: страх перед Господом
  alternative: почтение к Господу
  rationale: Буквальная формула сохраняет богословскую насыщенность понятия, включающего благоговение, послушание и осознание Божьего суда; слово «почтение» неоправданно сужало бы напряжение текста.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционной библейской формулы «страх перед Господом». Синтаксис краткий и афористичный, в соответствии с жанром премудрости.
