  text: For every act of righteousness there is a reward; each person will find it according to his works[a][b].
translation:
  language: ru
  text: За всякое праведное дело полагается награда; каждый обретёт её по своим делам[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В сохранившемся еврейском тексте эта строка короче: буквально «Всякий, кто делает праведность, имеет награду». В греческой версии стих полнее: «Для всякой милостыни (или: дела милосердия) он отведёт место; каждый обретёт по своим делам».'
    reason: textual_variant
  - marker: b
    text: Еврейское צְדָקָה означает «праведность» или «справедливость»; соответствующее греческое ἐλεημοσύνη может означать «милостыня» либо, шире, «дело милосердия».
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעֹשֶׁה
  choice: за каждое ... дело
  rationale: 'Буквально: «всякий, кто делает». Распределительная конструкция передана через «каждое дело», что естественно по-русски и согласуется с греческим πάσῃ, не устраняя связи награды с совершающим поступок.'
- source_word: צְדָקָה
  choice: праведное дело
  rationale: Еврейское слово означает «праведность», «справедливость», а в данном сочетании обозначает её практическое осуществление. «Праведное дело» звучит естественнее буквального «делать праведность» и сохраняет первенство еврейского чтения.
- source_word: יֵשׁ לוֹ שָׂכָר
  choice: есть награда
  rationale: Экзистенциальная конструкция буквально означает «у него есть награда». Русское «есть награда» сохраняет краткость и утвердительный характер изречения; שָׂכָר здесь передано как «награда», а не более коммерческое «плата».
- source_word: ἕκαστος κατὰ τὰ ἔργα αὐτοῦ εὑρήσει
  choice: каждый обретёт её по своим делам
  rationale: Греческая параллель содержит отсутствующую в сохранившейся еврейской строке вторую часть. «Обретёт» близко передаёт εὑρήσει, а местоимение «её» естественно связывает фразу с упомянутой наградой, хотя в греческом прямое дополнение не выражено.
- source_word: ἐλεημοσύνη
  choice: милостыня / дело милосердия (в сноске)
  rationale: Греческое слово может обозначать как подаяние, так и более широко дело милосердия. Это чтение отмечено в сноске, но не заменяет еврейское צְדָקָה в основном тексте.
theological_decisions:
- issue: Передавать ли צְדָקָה как «праведность» или следовать греческому ἐλεημοσύνη — «милостыня, дело милосердия»
  choice: В основном тексте — «праведное дело»; греческий оттенок указан в сноске.
  alternative: «За каждую милостыню» или «за каждое дело милосердия».
  rationale: Сохранившееся еврейское свидетельство имеет приоритет, но отличающееся греческое чтение сохраняется для прозрачности и не сводится молча к одному значению.
- issue: Включать ли вторую часть греческой параллели, отсутствующую в данной еврейской строке
  choice: Включить «каждый обретёт её по своим делам» с текстологической сноской.
  alternative: 'Ограничиться еврейской формой: «Всякий, кто поступает праведно, имеет награду».'
  rationale: Источник отмечен как имеющий небольшое расхождение, а греческая версия сохраняет более полный двучленный стих. Включение второй части учитывает всё представленное древнее свидетельство, при этом расхождение явно документировано.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем изречения. «Праведное дело» понятно широкому читателю и менее тяжеловесно, чем буквальное «делать праведность»; «обретёт» поддерживает достоинство библейского регистра без архаизации.
