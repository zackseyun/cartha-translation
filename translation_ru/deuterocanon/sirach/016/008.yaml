  text: And he did not spare Lot’s neighbors[b][a], who became arrogant in their pride.
translation:
  language: ru
  text: И не пощадил тех, среди кого жил Лот[a], — они возносились в своей гордыне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально выражение связано с местом или сообществом пребывания Лота; возможны переводы: «обитателей поселения Лота» или «соседей Лота».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская форма трудна. Возможный перевод с учётом греческой параллели: «они стали отвратительны из-за своей гордыни».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא חָמַל
  choice: И не пощадил
  rationale: Глагол חמל может означать жалость или сострадание, но в контексте суда естественнее передать его как «пощадить»; это значение подтверждается греческим οὐκ ἐφείσατο.
- source_word: מְגוּרֵי לוֹט
  choice: тех, среди кого жил Лот
  rationale: מְגוּרִים связано с временным проживанием или пребыванием пришельца. Контекст подразумевает сообщество, с которым было связано проживание Лота; описательный перевод звучит естественно и не подменяет выражение прямым названием Содома.
- source_word: הַמִּתְעַבְּרִים
  choice: они возносились
  rationale: Трудная еврейская форма в сочетании с בְּגַאֲוָתָם допускает понимание высокомерного, заносчивого поведения. Перевод сохраняет связь с гордыней, не усиливая текст до конкретного наименования греха.
- source_word: בְּגַאֲוָתָם
  choice: в своей гордыне
  rationale: Предлог ב сохраняется как характеристика состояния или образа поведения. «Гордыня» передаёт отрицательную нравственную окраску גַּאֲוָה и соответствует греческому ὑπερηφανία.
theological_decisions:
- issue: Кого обозначает выражение מְגוּרֵי לוֹט
  choice: Людей, среди которых жил Лот
  alternative: Дом Лота; область или поселение, где жил Лот; прямо «содомляне»
  rationale: Исторически речь идёт о сообществе, связанном с пребыванием Лота, однако еврейский текст не называет Содом прямо. Поэтому перевод сохраняет косвенное обозначение и не сужает его до домашних Лота.
- issue: Смысл трудной формы הַמִּתְעַבְּרִים
  choice: Высокомерно возносились
  alternative: Сделались отвратительными; были ненавистны из-за своей гордыни
  rationale: Еврейская форма трудна, тогда как греческая параллель выражает отвращение к ним по причине гордыни. Основной текст следует вероятному еврейскому смыслу надменного поведения, а гречески поддержанное прочтение сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Описательное «тех, среди кого жил Лот» понятно широкому читателю и одновременно сохраняет необычность исходного обозначения; тире помогает избежать тяжёлой цепочки придаточных.
