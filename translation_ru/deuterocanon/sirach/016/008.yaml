  verdict: approve
  source_fidelity: «И не пощадил» точно передаёт וְלֹא חָמַל в контексте суда. Описательное «тех, среди кого жил Лот» корректно передаёт необычное מְגוּרֵי לוֹט как сообщество, связанное с пребыванием Лота, не вводя прямо не названных в строке содомлян. «Они возносились в своей гордыне» является допустимой передачей трудного הַמִּתְעַבְּרִים и сохраняет связь с בְּגַאֲוָתָם; примечание надлежащим образом отмечает поддерживаемую греческой параллелью альтернативу.
  naturalness: Текст краток, ясен и звучит по-русски естественно в сдержанном библейском регистре. Тире удачно отделяет поясняющее высказывание о людях, среди которых жил Лот. Формула «возносились в своей гордыне» несколько торжественна, но уместна для жанра и понятна современному читателю.
  terminology: «Пощадил», «гордыня» и «Лот» употреблены последовательно и в подходящем регистре. Примечание a не превращает косвенное обозначение в прямое название Содома; примечание b сохраняет текстологическую неопределённость, не выдавая греческое решение за несомненный смысл еврейского текста.
