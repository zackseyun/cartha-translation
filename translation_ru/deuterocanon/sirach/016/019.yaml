  text: Even the peaks of the mountains and the foundations of the world—when he looks at them[a], they quake.
translation:
  language: ru
  text: Даже вершины гор и основания мира[a] содрогаются в трепете, когда он взирает на них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «основания мира»; в греческом параллельном тексте — «основания земли».
    reason: alternative_reading
lexical_decisions:
- source_word: קִצְבֵי הָרִים
  choice: вершины гор
  rationale: קִצְבֵי буквально обозначает края или крайние пределы; в сочетании с «горами» естественное русское выражение «вершины гор» передаёт их крайние высоты и сохраняет величественный образ.
- source_word: וִיסוֹדֵי תֵבֵל
  choice: и основания мира
  rationale: יְסוֹדֵי означает «основания», а תֵבֵל — устроенный, обитаемый мир. Перевод следует основному еврейскому свидетельству, не подменяя «мир» греческим вариантом «земля».
- source_word: בְּהַבִּיטוֹ אֲלֵיהֶם
  choice: когда он взирает на них
  rationale: Инфинитивная конструкция естественно передаётся временным придаточным. «Взирает» сохраняет достоинство речи; строчная форма «он» не добавляет отсутствующего в самой фразе имени Бога.
- source_word: רַעַשׁ יִרְעָשׁוּ
  choice: содрогаются
  rationale: Сочетание однокоренных существительного и глагола усиливает образ сотрясения. Русское «содрогаются» ёмко передаёт и само движение, и его интенсивность без неестественного повтора.
theological_decisions:
- issue: Неявно названный божественный субъект в выражении בְּהַבִּיטוֹ
  choice: «когда он взирает на них» со строчной буквы
  alternative: «когда Бог взирает на них» или «от Его взгляда»
  rationale: Из контекста субъектом является Бог, однако еврейская фраза не называет Его прямо. Местоименная передача сохраняет эту особенность и не вносит отсутствующее существительное.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной лексикой. Порядок слов сделан естественным для русского; космический образ и усиленное сотрясение сохранены без тяжеловесного буквального повтора.
