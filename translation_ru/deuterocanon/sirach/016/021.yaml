  text: If I have sinned, no eye sees me; or if I lie, who knows it in every hiding place?
translation:
  language: ru
  text: «Если я согрешил, ни один глаз меня не видит; или, если я солгу, кто узнает об этом во всяком тайном месте?»[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая параллель здесь существенно отличается; в частности, в ней сказано, что многие его дела находятся в сокрытых местах. Основной текст переведён по сохранившемуся еврейскому свидетельству.
    reason: textual_variant
  - marker: b
    text: 'Или: «во всяком укрытии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתִי
  choice: Если я согрешил
  rationale: Условная частица אִם с перфектом естественно передаётся условным придаточным; совершенный вид подходит для общего гипотетического высказывания.
- source_word: לֹא תִרְאֵנִי עָיִן
  choice: ни один глаз меня не видит
  rationale: Сохранён конкретный образ глаза как подлежащего, не сведённый к более общему «никто меня не видит».
- source_word: אוֹ אִם אֲכַזֵב
  choice: и если я солгу
  rationale: כזב здесь обозначает ложь или обман. Русское «солгу» ясно и естественно в контексте скрытого проступка; союз «и» передаёт продолжение внутреннего рассуждения, хотя אוֹ буквально может означать «или».
- source_word: בְּכָל סֵתֶר
  choice: в любом тайном месте
  rationale: סֵתֶר обозначает скрытое, тайное место. Формулировка сохраняет пространственный оттенок и естественна по-русски.
- source_word: מִי יוֹדֵעַ
  choice: кто узнает об этом
  rationale: 'Буквально: «кто знает?» В русском вопрос о незаметном поступке естественно звучит с «узнает»; «об этом» эксплицирует подразумеваемый объект без изменения смысла.'
- source_word: καὶ καταιγίς, ἣν οὐκ ὄψεται ἄνθρωπος, τὰ δὲ πλεῖονα τῶν ἔργων αὐτοῦ ἐν ἀποκρύφοις
  choice: учтено как параллель, подтверждающая мотив сокрытого, но не как основа перевода
  rationale: Греческий текст значительно расходится с сохранившимся еврейским, однако подтверждает лексику скрытости. При высоконадёжном еврейском свидетельстве основной текст переводится с еврейского.
theological_decisions:
- issue: Приоритет источника при существенном расхождении еврейского и греческого текста Сираха
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; греческая параллель использована только для проверки мотива сокрытого
  alternative: Перевести по греческому тексту либо согласовать оба чтения в одном тексте
  rationale: Еврейский текст данного стиха сохранился с высокой степенью надёжности и потому имеет приоритет. Смешение двух существенно различных свидетельств скрыло бы реальную текстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, серьёзным и риторическим звучанием. Сохранён конкретный образ «глаза» и пространственный смысл тайного места; текстовая разница с греческим вынесена в примечание.
