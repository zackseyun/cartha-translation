translation:
  language: ru
  text: Слушайте меня и примите моё наставление[a]; сердцем внимайте моим словам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «примите моё разумение [или: наставление]». В греческом: «Слушай меня, дитя, и учись знанию».'
    reason: Различия между еврейским и греческим свидетелями, а также смысловой диапазон שִׂכְלִי.
  - marker: b
    text: 'Буквально по-еврейски: «положите сердце на мои слова»; ср. греческое: «внимай сердцем своим моим словам».'
    reason: Сохранение буквального образа, лежащего в основе русской идиоматической передачи.
lexical_decisions:
- source_word: שִׁמְעוּ אֵלַי
  choice: Слушайте меня
  rationale: Множественное повелительное наклонение еврейского текста передаёт не просто слышание, а внимательное слушание. Форма множественного числа сохранена, несмотря на единственное число в греческой параллели.
- source_word: וּקְחוּ שִׂכְלִי
  choice: примите моё наставление
  rationale: לקח буквально означает «взять, принять», а שִׂכְלִי с суффиксом первого лица — «моё разумение / наставление». В контексте поучения «примите моё наставление» естественно по-русски выражает усвоение передаваемого разумения, не сводя его к простому сообщению сведений.
- source_word: וְעַל דְבָרַי שִׂימוּ לֵב
  choice: сердцем внимайте моим словам
  rationale: Еврейская идиома буквально говорит «положите сердце на мои слова». Перевод сохраняет явное упоминание сердца и передаёт направленное, внутреннее внимание современным литературным русским языком.
theological_decisions:
- issue: Обозначение адресата
  choice: В основном тексте нет обращения «дитя»
  alternative: «Слушай меня, дитя…»
  rationale: Сохранившийся еврейский текст не содержит обращения, тогда как греческая параллель имеет τέκνον и употребляет повелительные формы единственного числа. Основной текст следует еврейскому свидетельству, а греческое разночтение отмечено в сноске.
- issue: Образ сердца
  choice: Сохранено слово «сердце»
  alternative: «внимательно слушайте мои слова»
  rationale: И еврейский, и греческий тексты прямо упоминают сердце как средоточие внутреннего внимания и осмысления; этот образ не следует устранять ради более отвлечённой формулировки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном учительной речи. Формы «внимайте» и «сердцем» сохраняют достоинство и библейскую образность, оставаясь понятными современному читателю.
