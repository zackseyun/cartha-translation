translation:
  language: ru
  text: Благодаря одному бездетному человеку, боящемуся Господа,[a] город будет заселён, а из-за семьи вероломных людей он будет разорён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «От одного благоразумного человека город будет заселён». Еврейский текст читает: «От одного бездетного, боящегося Господа».'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאֶחַד
  choice: от одного
  rationale: Предлог מִן указывает на источник или начало; это соответствует и греческому ἀπό.
- source_word: עֲרִירִי
  choice: бездетного
  rationale: В сохранившемся еврейском тексте слово обычно означает человека без детей или потомства. Субстантивированное прилагательное по-русски естественно продолжает оборот «от одного».
- source_word: יְרֵא יְהֹוָה
  choice: боящегося Господа
  rationale: Передаёт буквальный смысл благоговейного страха перед YHWH и явно сохраняет присутствующее в еврейском тексте Божье имя в традиционной русской форме «Господь».
- source_word: תֵּשֵׁב עִיר
  choice: город заселится
  rationale: Глагол выражает становление города населённым; возвратная форма сохраняет результативное значение и звучит естественно по-русски.
- source_word: מִמִּשְׁפַּחַת
  choice: из-за семьи
  rationale: 'В параллельной антитезе מִן допускает причинное прочтение: вероломная семья приводит город к запустению. «Из-за» ясно передаёт этот смысл без неестественного русского оборота «от семьи».'
- source_word: בֹּגְדִים
  choice: вероломных
  rationale: Слово обозначает тех, кто поступает предательски и нарушает верность. «Вероломных» сохраняет нравственную силу, не сужая значение до политической измены.
- source_word: תֶּחֱרָב
  choice: он опустеет
  rationale: Глагол חרב означает быть разорённым или опустошённым; «опустеет» соответствует греческому ἐρημωθήσεται и ясно соотносится с городом.
theological_decisions:
- issue: Расхождение между еврейским עֲרִירִי («бездетный») и греческим συνετός («разумный, благоразумный»)
  choice: В основном тексте принято еврейское чтение «бездетного».
  alternative: 'По греческому тексту: «от одного благоразумного человека».'
  rationale: При наличии надёжного еврейского свидетельства оно служит основой перевода; существенное греческое разночтение сохранено в сноске, поскольку заметно меняет смысл.
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционная русская библейская передача «Господь» понятна широкому читателю и сохраняет личную направленность выражения «боящийся Господа», не превращая его в общее обозначение религиозности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской афористической речи. Сохранён параллелизм одного человека и целой семьи, а также резкий контраст между заселением и запустением.
