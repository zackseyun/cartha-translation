  text: Those lacking sense will understand these things[a], and a foolish man will consider this.
translation:
  language: ru
  text: Лишённые разумения поймут всё это, и глупый человек обдумает это[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте во второй части стоит «это», а в греческой параллели — «глупости». Перевод следует еврейскому чтению; греческий текст помогает понять слово «глупый» как указание не просто на неопытность, но и на ошибочность суждения.
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְרֵי לֵב
  choice: лишённые разумения
  rationale: Буквально «лишённые сердца»; в еврейской мудрой традиции «сердце» здесь обозначает способность понимать и здраво судить, а не сферу чувств.
- source_word: יָבִינוּ
  choice: поймут
  rationale: 'Прямо передаёт обычное значение глагола: понимать, постигать, распознавать.'
- source_word: אֵלֶּה
  choice: всё это
  rationale: Еврейское указательное местоимение стоит во множественном числе. Русское «всё это» естественно обозначает совокупность названного ранее и сохраняет отличие от единичного זֹאת во второй части.
- source_word: גֶבֶר
  choice: человек
  rationale: В данном изречении существительное обозначает отдельного мужчину как типичного представителя; русское «человек» звучит естественнее, при этом согласованное прилагательное сохраняет мужскую форму.
- source_word: פּוֹתֶה
  choice: глупый
  rationale: Слово может означать простодушного, неопытного или легко вводимого в заблуждение человека. Греческая параллель усиливает отрицательную оценку словами «неразумный и заблуждающийся», поэтому «глупый» здесь уместнее нейтрального «наивный».
- source_word: יַחְשֹׁב
  choice: обдумает
  rationale: Передаёт значение размышления или рассмотрения без добавления оценки содержания мысли.
- source_word: זֹאת
  choice: это
  rationale: В еврейском тексте указательное местоимение стоит в единственном числе; перевод не уравнивает его с множественным אֵלֶּה первой части.
theological_decisions:
- issue: Необычное утверждение о понимании со стороны лишённых разумения
  choice: Сохранить прямое утверждение еврейского текста
  alternative: Истолковать строку как вопрос, отрицание или ироническое высказывание
  rationale: В представленном еврейском свидетельстве глагол имеет утвердительную форму; явного показателя вопроса, отрицания или иронии нет. Поэтому смысловая напряжённость не устраняется догадочной интерпретацией.
- issue: Содержание размышления глупого человека
  choice: Следовать еврейскому «обдумает это»
  alternative: Следовать греческому «обдумывает глупости»
  rationale: Основным источником служит сохранившееся еврейское чтение זֹאת, тогда как отличающееся греческое чтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном мудрого изречения. Идиома «лишённые сердца» передана по смыслу, а различие между множественным «всё это» и единственным «это» сохранено настолько, насколько это естественно по-русски.
