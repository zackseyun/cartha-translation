base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/016/012.yaml
  text: As great as his mercies are[a], so also is his reproof[c][b]; he will judge a man according to his deeds.
translation:
  language: ru
  text: Как велики Его милости, так велико и Его обличение; каждого Он будет судить по его делам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человека — по его делам»; еврейское слово стоит в мужском единственном числе, но здесь имеет обобщающее значение.'
    reason: cultural_note
lexical_decisions:
- source_word: כְּרָב
  choice: как велики... так велико
  rationale: 'Конструкция כְּ... כֵּן выражает соразмерность: «как… так…». Русская парная конструкция передаёт её ясно и естественно.'
- source_word: רַחֲמָיו
  choice: Его милости
  rationale: Сохранено множественное число еврейского רחמים, которое может указывать на обилие милосердия или его многократные проявления.
- source_word: תּוֹכַחְתּוֹ
  choice: Его обличение
  rationale: Слово обозначает обличение, укор или исправляющее наставление; «обличение» сохраняет нравственно-исправительный смысл и согласуется с греческим ἔλεγχος.
- source_word: אִישׁ
  choice: каждого
  rationale: Еврейское существительное стоит в мужском единственном числе, но имеет обобщающее значение. «Каждого» естественно передаёт распределительный смысл по-русски, не ограничивая высказывание только мужчинами.
- source_word: כְּמִפְעָלָיו
  choice: по его делам
  rationale: מִפְעָל обозначает дело, поступок или действие; «по делам» кратко и точно передаёт основание суда.
- source_word: יִשְׁפֹּט
  choice: будет судить
  rationale: Будущее время поддержано греческим κρινεῖ и сохраняет торжественный судебный смысл высказывания.
theological_decisions:
- issue: Соотношение Божьей милости, обличения и суда
  choice: Сохранена пропорциональная параллель между великими милостями и великим обличением, за которой следует суд по делам.
  alternative: Передать תּוֹכַחְתּוֹ как «наказание», усилив карательный оттенок.
  rationale: 'Еврейское תּוֹכַחַת и греческое ἔλεγχος прежде всего указывают на обличение или исправление, а не только на возмездие. Такой перевод сохраняет напряжение текста: обилие милости не устраняет нравственной ответственности.'
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным и торжественным строем. Заглавное написание местоимений, относящихся к Богу, использовано последовательно в пределах стиха.
