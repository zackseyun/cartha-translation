lexical_decisions:
- source_word: אַל תִּתְאַוֶּה
  choice: Не желай
  rationale: Запретительная конструкция с אַל и формой глагола передаёт прямое предостережение; «не желай» естественно и без лишнего усиления выражает волевой смысл.
- source_word: תֹּאַר
  choice: привлекательной внешности
  rationale: תֹּאַר обозначает внешний облик, нередко привлекательный. Такой перевод сохраняет направленность наставления на наружность, а не на многочисленность детей.
- source_word: נַעֲרֵי שָׁוְא
  choice: никчёмных юношей
  rationale: נַעֲרֵי — «юноши», а שָׁוְא несёт значения пустоты, тщетности и негодности; «никчёмных» ясно передаёт отрицательную нравственно-практическую оценку.
- source_word: וְאַל תִּשְׂמַח
  choice: и не радуйся
  rationale: Прямая параллельная запретительная формула, естественная для русского наставительного стиля.
- source_word: בִּבְנֵי עַוְלָה
  choice: сыновьям неправедности
  rationale: Сохраняется еврейская конструкция «сыны неправедности/несправедливости» и её намеренно ёмкий нравственный смысл; русский дательный соответствует управлению глагола «радоваться».
- source_word: Μὴ ἐπιθύμει τέκνων πλῆθος ἀχρήστων
  choice: не принято в основном тексте
  rationale: Греческая параллель говорит о множестве бесполезных детей, существенно отличаясь от сохранившегося еврейского чтения; вариант отражён в сноске.
theological_decisions:
- issue: Выбор основного текста при расхождении еврейского и греческого свидетелей
  choice: Основной текст следует сохранившемуся еврейскому чтению, а греческий вариант приводится в сноске.
  alternative: 'Следовать греческому тексту: «Не желай множества бесполезных детей и не радуйся нечестивым сыновьям».'
  rationale: Для Книги Премудрости Иисуса, сына Сирахова, сохранившийся еврейский текст имеет первенство; значительное расхождение с греческой традицией нельзя скрывать, поэтому оно документируется без смешения двух чтений.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным наставительным звучанием. Сохранены поэтический параллелизм и необычный образ еврейского текста; сноска отмечает существенный греческий вариант.
