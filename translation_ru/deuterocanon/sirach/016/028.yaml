  text: Each one did not oppress his neighbor[a], and they will never disobey his word.
translation:
  language: ru
  text: Каждый не притеснял ближнего своего, и они вовек не ослушаются[a] его слова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будут непослушны его слову».'
    reason: Греческий глагол допускает как событийную передачу «не ослушаются», так и обозначение устойчивого состояния — «не будут непослушны».
lexical_decisions:
- source_word: ἕκαστος
  choice: Каждый
  rationale: 'Сохраняет распределительное значение греческого единственного числа: речь идёт о каждом по отдельности в составе целого.'
- source_word: τὸν πλησίον αὐτοῦ
  choice: ближнего своего
  rationale: Передаёт субстантивированное πλησίον — того, кто находится рядом, — не сужая значение до бытового «соседа»; оборот остаётся понятным и уместным в возвышенном описании миропорядка.
- source_word: οὐκ ἔθλιψεν
  choice: не теснил
  rationale: Глагол θλίβω буквально связан с давлением и стеснением и может означать притеснение. «Не теснил» сохраняет пространственный образ и допускает более широкий смысл причинения тяготы ближнему.
- source_word: ἕως αἰῶνος
  choice: вовек
  rationale: В сочетании с отрицанием естественно выражает непрекращающуюся длительность и соответствует смыслу «никогда не» без утраты торжественного регистра.
- source_word: οὐκ ἀπειθήσουσι
  choice: не ослушаются
  rationale: Передаёт будущее время и значение отказа повиноваться; по-русски естественно сочетается с родительным «слова».
- source_word: τοῦ ῥήματος αὐτοῦ
  choice: его слова
  rationale: Сохраняет широту ῥῆμα — слово, изречение или веление — и не сужает его до явно выраженного приказа.
theological_decisions:
- issue: К кому относится местоимение «его» в выражении «его слова»
  choice: Сохранено местоимение «его»; наиболее вероятно, подразумевается Бог
  alternative: Прямо написать «слова Божьего» либо отнести местоимение к иному подразумеваемому единственному референту из контекста
  rationale: В описании упорядоченного творения естественным референтом является Бог, однако греческий текст называет его лишь местоимением. Русский перевод сохраняет эту форму и не устраняет остаточную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Ближнего своего» и «вовек» выбраны ради достоинства стиля и точности, но синтаксис оставлен простым и понятным.
