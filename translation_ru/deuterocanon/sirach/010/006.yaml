translation:
  language: ru
  text: Ни за какой проступок[a] не воздавай ближнему злом и не ходи путём гордыни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «За всякую несправедливость не гневайся на ближнего»; здесь подчёркнуты гнев или затаённая обида, а не воздаяние злом.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּכֵל פֶּשַׁע
  choice: ни за какой проступок
  rationale: 'Буквально сочетание означает «за/при всяком проступке». В контексте запрета русская конструкция «ни за какой» естественно передаёт всеобщий смысл: никакой проступок не должен становиться поводом для возмездия.'
- source_word: אַל תְּשַׁלֵּם רַע
  choice: не воздавай ... злом
  rationale: Пиэль глагола שׁלם имеет значение «воздавать, отплачивать». Формулировка сохраняет смысл ответного зла и звучит естественно и достойно по-русски.
- source_word: לְרֵעַ
  choice: ближнему
  rationale: רֵעַ обозначает ближнего, товарища или другого человека в рамках отношений. «Ближний» точно соответствует этической лексике изречения и поддерживается греческим τῷ πλησίον.
- source_word: וְאַל תִּהֲלַךְ
  choice: и не ходи
  rationale: Сохранён образ хождения как образ поведения и жизненного пути, обычный для библейской литературы мудрости.
- source_word: בְּדֶרֶךְ גַּאֲוָה
  choice: путём гордыни
  rationale: Передана метафора דֶּרֶךְ — «путь, образ жизни». גַּאֲוָה здесь означает гордость, надменность; «гордыня» подчёркивает нравственно предосудительный характер качества, не утрачивая краткости.
theological_decisions:
- issue: Расхождение еврейского и греческого текста в первом запрете
  choice: В основном тексте следовать еврейскому чтению «не воздавай ... злом».
  alternative: 'Греческий: «за всякую несправедливость не гневайся на ближнего» или «не таи обиды на ближнего».'
  rationale: Сохранившийся еврейский текст имеет высокую степень надёжности и прямо запрещает ответное зло. Греческое чтение семантически близко, но переносит акцент на гнев или затаённую обиду; это существенное различие сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным тоном наставления. Сохранены библейские образы «ближнего» и хождения «путём», при этом синтаксис остаётся понятным современному читателю.
