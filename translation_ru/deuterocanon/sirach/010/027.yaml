translation:
  language: ru
  text: Лучше тот, кто трудится и имеет достаток, чем тот, кто превозносит себя, но не имеет пропитания.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом свидетельстве: «Дитя моё, в кротости прославляй свою душу и воздавай ей честь по её достоинству». Еврейский и греческий тексты здесь существенно расходятся.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוֹב
  choice: Лучше
  rationale: В начале изречения слово имеет сравнительный смысл; естественная русская форма — «Лучше… чем…».
- source_word: עוֹבֵד
  choice: тот, кто трудится
  rationale: Глагольная форма от עבד здесь обозначает труд, а не рабское или служебное положение; контекст противопоставляет труд самопревозношению.
- source_word: וְיוֹתֵר הוֹן
  choice: и имеет достаток
  rationale: Краткое и несколько неясное сочетание выражает наличие материального изобилия или обеспеченности. «Имеет достаток» естественно передаёт смысл, не усиливая его до большого богатства.
- source_word: מִמִּתְכַּבֵּד
  choice: чем тот, кто превозносит себя
  rationale: 'Порода хитпаэль указывает на возвратное действие: человек сам придаёт себе почёт или важность. «Превозносит себя» передаёт отрицательный оттенок самовозвеличивания.'
- source_word: וַחֲסַר
  choice: но не имеет
  rationale: Хотя союз буквально соединительный, по смыслу здесь выражено противопоставление внешней важности и реальной нужды; русское «но» делает его ясным.
- source_word: מַתָּן
  choice: пропитания
  rationale: Форма допускает связь со значением «дар», однако в экономическом контексте изречения вероятнее обозначает насущное обеспечение. «Пропитание» сохраняет широту значения лучше, чем узкое «пища».
theological_decisions:
- issue: Существенное расхождение еврейского и греческого свидетельств в Сир 10:27
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству, а греческое чтение приведено в сноске.
  alternative: 'Греческое свидетельство: «Дитя моё, в кротости прославляй свою душу и воздавай ей честь по её достоинству».'
  rationale: Еврейское чтение имеет высокий заявленный уровень достоверности, но греческий текст содержит совершенно иное изречение. Это расхождение нельзя сглаживать или скрывать, поэтому альтернативное свидетельство сохранено явно.
translation_notes:
  register: Современный литературный русский язык; краткая форма пословицы сохранена. Лексика понятна широкому читателю, при этом тон остаётся достойным и афористичным.
