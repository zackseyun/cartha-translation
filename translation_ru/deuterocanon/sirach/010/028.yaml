  yaml_path: translation/deuterocanon/sirach/010/028.yaml
  text: Who will justify the one who sins against his own soul[a], and who will honor the one who dishonors his own life?
translation:
  language: ru
  text: Кто оправдает того, кто грешит против собственной души[a]? И кто почтит того, кто бесчестит собственную жизнь?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст из Каирской генизы резко отличается от греческого и труден для понимания. Приблизительно: «Сын мой, в смирении почитай себя, и он даст тебе разумение, а ты утратил честь». Основной текст следует греческому чтению, поскольку еврейское свидетельство здесь, по-видимому, текстуально неустойчиво.'
    reason: textual_variant
lexical_decisions:
- source_word: τὸν ἁμαρτάνοντα
  choice: согрешающего
  rationale: Причастие передано субстантивированно и обобщённо, с сохранением глагольного характера греческого выражения.
- source_word: εἰς τὴν ψυχὴν αὐτοῦ
  choice: против собственной души
  rationale: Предлог εἰς в данном контексте выражает направленность действия против самого человека; «душа» сохраняет отличие ψυχή от ζωή во второй части стиха.
- source_word: τίς δικαιώσει
  choice: кто оправдает
  rationale: 'Передаёт судебно-нравственный смысл δικαιόω: признать правым или невиновным.'
- source_word: δοξάσει
  choice: кто почтит
  rationale: В контексте мудрости речь идёт о воздании чести; «почтит» естественно противопоставлено «бесчестит».
- source_word: τὸν ἀτιμάζοντα
  choice: того, кто бесчестит
  rationale: Передаёт обращение с чем-либо как лишённым чести и сохраняет антитезу с δοξάσει.
- source_word: τὴν ζωὴν αὐτοῦ
  choice: собственную жизнь
  rationale: Прямо передаёт ζωή и сохраняет смысловое отличие от ψυχή в первой части.
theological_decisions:
- issue: Резкое расхождение сохранившегося еврейского текста и греческой параллели
  choice: Основной текст переведён по связному греческому чтению
  alternative: «Сын мой, в смирении почитай себя, и он даст тебе разумение и утраченную честь» — приблизительный перевод трудного еврейского текста
  rationale: Еврейская строка в представленном виде синтаксически и смыслово неустойчива и существенно расходится с греческим двустишием. Чтобы не создавать искусственно определённый смысл из, вероятно, повреждённого текста, основной перевод следует греческому свидетелю, а еврейский вариант указан в примечании.
translation_notes:
  register: Современный литературный русский язык, сжатый и достойный регистр литературы мудрости. Сохранены риторический параллелизм, различие между «душой» и «жизнью» и нравственно-судебный оттенок глагола «оправдать».
