  source_fidelity: 'Перевод точно следует сохранившемуся еврейскому тексту: рефлексивно-интенсивное תתחכם передано как «не мудрствуй», עבד — деепричастием «служа», а возвратное תתכבד — как «не возвеличивай себя». «Во время нужды» адекватно передаёт במועד צרכך. Существенное расхождение греческого параллельного текста не смешано с еврейским чтением и прозрачно отмечено.'
  naturalness: Фраза краткая, афористичная и звучит по-русски литературно. «Не мудрствуй, служа своему желанию» несколько намеренно сжато, но это уместно для наставительного параллелизма и сохраняет образ служения собственному желанию.
