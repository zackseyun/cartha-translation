base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/026.yaml
  text: Do not act too wisely to serve your own desire[a], and do not honor yourself in the time of your need.
translation:
  language: ru
  text: Не мудрствуй, служа своему желанию,[a] и не возвеличивай себя во время нужды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий свидетель передаёт этот стих совсем иначе: «Лучше тот, кто трудится во всём, чем тот, кто расхаживает, хвалясь, но не имеет хлеба». Сохранившийся еврейский текст из Каирской генизы предостерегает от своекорыстного мудрствования и самовозвеличивания во время нужды.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תּתְחַכַּם
  choice: Не мудрствуй
  rationale: Возвратная форма глагола חכם указывает на стремление выказать собственную мудрость или действовать с самоуверенной хитростью. «Не мудрствуй» кратко и естественно передаёт это предостережение, не сводя его только к обману.
- source_word: לַעֲבוֹד חֶפְצֶךָ
  choice: служа своему желанию
  rationale: עבד означает «служить, работать», а חפץ — «желание, воля, удовольствие». Формулировка сохраняет выразительный образ желания как господина, которому человек служит.
- source_word: וְאַל תִּתְכַּבֵּד
  choice: и не возвеличивай себя
  rationale: Возвратная форма כבד означает придавать себе вес, добиваться почёта, превозноситься. «Не возвеличивай себя» передаёт рефлексивность и естественно звучит по-русски.
- source_word: בְּמוֹעֵד צָרְכֶּךָ
  choice: во время нужды
  rationale: מוֹעֵד обозначает установленное время или пору, а צרך — нужду или недостаток. Греческое упоминание нехватки хлеба подтверждает понимание последнего слова как реальной нужды.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческого свидетеля
  choice: Основной текст переведён по сохранившемуся еврейскому чтению; греческий вариант приведён в сноске.
  alternative: «Лучше тот, кто трудится во всём, чем тот, кто расхаживает, хвалясь, но не имеет хлеба».
  rationale: При наличии еврейского текста он служит основой перевода Сираха. Однако греческое чтение существенно отличается и не должно быть ни замолчано, ни искусственно согласовано с еврейским; его следует сохранить как древний альтернативный вариант.
translation_notes:
  register: Современный литературный русский язык с краткой афористичной формой. «Мудрствуй» сохраняет оттенок показной или чрезмерной мудрости; синтаксис следует параллелизму еврейского текста.
