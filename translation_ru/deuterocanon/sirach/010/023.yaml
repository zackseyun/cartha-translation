translation:
  language: ru
  text: Нельзя презирать разумного бедняка и нельзя почитать неправедного человека, которого возвысили.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая традиция передаёт здесь существенно иной текст: «Великий человек, судья и правитель будут почитаемы, и никто из них не выше боящегося Господа». Еврейское свидетельство, положенное в основу перевода, вместо этого содержит нравственное изречение о том, что нельзя презирать разумного бедняка и почитать возвышенного неправедника.'
