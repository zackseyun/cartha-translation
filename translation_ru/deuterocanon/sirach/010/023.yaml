lexical_decisions:
- source_word: אֵין לִבְזוֹת
  choice: Нельзя презирать
  rationale: Сочетание אֵין с инфинитивом выражает не буквальное отсутствие действия, а недопустимость или запрет. «Нельзя презирать» сохраняет краткий назидательный характер изречения.
- source_word: דַּל
  choice: бедняка
  rationale: דַּל обозначает бедного, слабого или человека низкого положения. «Бедняк» естественно передаёт здесь социальное положение и сохраняет единственное число.
- source_word: מַשְׂכִּיל
  choice: разумного
  rationale: Причастие указывает на понимание, рассудительность и проницательность. «Разумный» звучит естественно и подчёркивает противопоставление ума низкому общественному положению.
- source_word: לְכַבֵּד
  choice: почитать
  rationale: В породе пиэль глагол כבד означает оказывать честь, придавать вес или проявлять почтение. «Почитать» подходит для краткого нравственного наставления.
- source_word: עַוָּל
  choice: неправедного человека
  rationale: Слово обозначает человека, совершающего неправду или отличающегося несправедливостью. Такой перевод сохраняет нравственно-правовой оттенок, не сужая его до конкретного преступления.
- source_word: אֲשֶׁר הוּרָם
  choice: которого возвысили
  rationale: Пассивная форма указывает на человека, поднятого на более высокое положение. Формулировка сохраняет пассивный смысл и социальный контраст с бедняком.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и существенно отличающейся греческой традицией
  choice: Основной текст напрямую переведён с еврейского свидетельства Кааны.
  alternative: «Знатный человек, судья и правитель будут почитаемы, но никто из них не выше боящегося Господа».
  rationale: Сохранившийся еврейский текст имеет высокий уровень достоверности и содержит ясное нравственное изречение, поэтому ему отдано первенство. Поскольку греческая традиция передаёт совершенно иной текст, её чтение не смешано с основным переводом, а полностью приведено в примечании.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная форма изречения. Повтор «нельзя» сохранён ради параллелизма двух еврейских конструкций. Формулировка «которого возвысили» намеренно удерживает пассивность оригинала и не уточняет, кем именно человек был возвышен.
