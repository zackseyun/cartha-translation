lexical_decisions:
- source_word: שׁוֹפֵט
  choice: судья
  rationale: Еврейское существительное обозначает судью или должностное лицо, наделённое властью; греческое κριτής подтверждает значение «судья».
- source_word: יוֹסֵד
  choice: устраивает
  rationale: Глагол может означать «основывает» или «утверждает», однако применительно к народу, в параллели с סְדוּרָה и с учётом греческого παιδεύσει, здесь уместен смысл приведения народа в надлежащий порядок.
- source_word: עַמּוֹ
  choice: свой народ
  rationale: Передаёт существительное עם с явным притяжательным суффиксом; по-русски возвратное «свой» естественно относится к подлежащему.
- source_word: מֶמְשֶׁלֶת
  choice: правление
  rationale: Слово обозначает власть или осуществление управления; «правление» сохраняет связь с деятельностью правителя и хорошо соответствует параллелизму.
- source_word: מֵבִין
  choice: разумного человека
  rationale: Субстантивированное причастие обозначает человека, обладающего пониманием и рассудительностью. Добавление «человека» делает русскую фразу естественной, не превращая качество в отвлечённое понятие.
- source_word: סְדוּרָה
  choice: упорядочено
  rationale: Передаёт состояние устроенности и порядка, сохраняя смысловую перекличку с первым полустишием.
