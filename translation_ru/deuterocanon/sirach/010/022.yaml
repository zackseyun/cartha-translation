  text: A resident alien[a], a foreigner, a stranger, and a poor man—their glory is the fear of God.
translation:
  language: ru
  text: Пришелец, чужак, иноземец и бедняк — их слава — страх Божий.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Несправедливо унижать разумного бедняка, и не подобает прославлять грешного человека». Еврейский и греческий тексты здесь существенно различаются.'
    reason: alternative_reading
lexical_decisions:
- source_word: גֵּר
  choice: пришелец
  rationale: В библейском и мудростном контексте слово обозначает не просто путника, а человека некоренного происхождения, живущего среди другого народа; «пришелец» кратко сохраняет этот социальный оттенок.
- source_word: וְזָר
  choice: чужак
  rationale: זר указывает на человека, не принадлежащего к обычному родственному или общественному кругу. «Чужак» позволяет отличить его от следующего נָכְרִי.
- source_word: נָכְרִי
  choice: иноземец
  rationale: Слово обычно обозначает человека из другого народа или другой страны; «иноземец» передаёт это точнее и не сливается с «чужаком».
- source_word: וָרָשׁ
  choice: и бедняк
  rationale: רש — бедный, неимущий человек; сохранены единственное число и структура перечисления.
- source_word: תִּפְאֶרֶת
  choice: их слава
  rationale: תפארת может означать славу, великолепие или украшение. Здесь «слава» естественно выражает то, что придаёт достоинство перечисленным людям.
- source_word: יִרְאַת אֱלֹהִים
  choice: в страхе Божьем
  rationale: Устойчивое выражение литературы мудрости обозначает благоговейный страх перед Богом. Конструкция «их слава в…» естественна по-русски и сохраняет смысл именного еврейского высказывания.
theological_decisions:
- issue: Существенное расхождение между еврейским текстом и греческой параллелью
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству, а иной греческий текст приведён в сноске.
  alternative: 'Греческий текст: «Несправедливо унижать разумного бедняка, и не подобает прославлять грешного человека».'
  rationale: При наличии еврейского текста он служит основным источником, однако греческая версия содержит не малое разночтение, а существенно иное изречение, поэтому различие открыто отмечено.
- issue: Смысл выражения «страх Божий»
  choice: Сохранено традиционное и лексически прямое выражение «страх Божий».
  alternative: «благоговение перед Богом»
  rationale: Прямой перевод сохраняет характерный для литературы мудрости богословский термин и не сводит его значение только к одному пояснительному оттенку.
translation_notes:
  register: Современный литературный русский язык с краткой афористической структурой. Термины «пришелец», «чужак» и «иноземец» намеренно различены, чтобы не сглаживать три разных еврейских обозначения человека, не принадлежащего к местному общественному кругу.
