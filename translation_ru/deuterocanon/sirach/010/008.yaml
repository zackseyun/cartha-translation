translation:
  language: ru
  text: Царская власть переходит от народа к народу из-за насилия и гордыни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции: «Царская власть переходит от народа к народу из-за несправедливости, бесчинств и денег».'
    reason: textual_variant
lexical_decisions:
- source_word: מַלְכוּת
  choice: царская власть
  rationale: Слово обозначает царствование или верховную власть, а не только территориальное царство; в данном изречении речь идёт о переходе политического господства.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: от народа к народу
  rationale: גוי обозначает народ как политическую общность; формулировка сохраняет краткость и ритм еврейского изречения.
- source_word: תִּסֹּב
  choice: переходит
  rationale: Буквально глагол связан с поворотом или перемещением; здесь он естественно выражает переход власти от одного народа к другому.
- source_word: בִּגְלַל
  choice: из-за
  rationale: Предлог указывает на причину; «из-за» ясно и естественно передаёт причинную связь в современном русском языке.
- source_word: חֲמַס
  choice: насилие
  rationale: В еврейском это прежде всего насилие или насильственное беззаконие; выбор следует основному еврейскому свидетельству, несмотря на греческое ἀδικίας («несправедливость»).
- source_word: גַּאֲוָה
  choice: гордыня
  rationale: Слово выражает предосудительную гордость, надменность; «гордыня» сохраняет нравственную окраску и подходит возвышенному, но понятному регистру.
theological_decisions:
- issue: Различие между еврейским и греческим перечнем причин
  choice: 'В основном тексте следовать еврейскому чтению: «насилие и гордыня».'
  alternative: 'Греческая традиция: «из-за несправедливости, бесчинств и денег».'
  rationale: Сохранившийся еврейский текст имеет высокую степень достоверности и потому определяет основной перевод. Более пространное и существенно отличающееся греческое чтение сохраняется в примечании без попытки согласовать обе традиции.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим строем. «Царская власть» точнее абстрактного значения מַלְכוּת, чем территориальное «царство»; «гордыня» передаёт нравственно отрицательный оттенок без конфессионального уточнения.
