translation:
  language: ru
  text: Он смёл[a] их с земли и вырвал их с корнем, и стёр с земли память о них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское וְסִחָם трудно для точного истолкования; греческая параллель подтверждает общий смысл удаления или уничтожения. Возможный перевод: «Он стёр их с земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסִחָם
  choice: Он смёл их
  rationale: Редкая и трудная еврейская форма в контексте обозначает решительное удаление; греческая параллель подтверждает смысл уничтожения или устранения. «Смёл» сохраняет яркость образа, не сводя его к более узкому значению «иссушил».
- source_word: מֵאֶרֶץ
  choice: с земли
  rationale: אֶרֶץ допускает значения «земля» и «страна»; повтор в обоих полустишиях и греческое ἀπὸ γῆς поддерживают более широкий смысл «с земли».
- source_word: וַיִּתְּשֵׁם
  choice: и вырвал с корнем
  rationale: Глагол נתשׁ выражает вырывание или искоренение. Русское «вырвал с корнем» естественно передаёт метафору полного устранения.
- source_word: וַיַּשְׁבֵּת
  choice: и стёр
  rationale: Каузатив от שׁבת буквально означает «заставил прекратиться». При дополнении «память о них» естественное русское «стёр» точно передаёт прекращение памяти, сохраняя образ окончательного исчезновения.
- source_word: זִכְרָם
  choice: память о них
  rationale: Это естественный современный русский эквивалент, обозначающий сохраняющееся воспоминание или след, оставленный людьми.
