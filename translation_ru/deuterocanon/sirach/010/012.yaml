translation:
  language: ru
  text: Начало гордыни человека — дерзость[a], и сердце его отворачивается от Создавшего его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Начало гордыни человека — его отступление от Господа, и сердце его отошло от Создавшего его». Первая часть еврейского текста короче; основной перевод следует еврейскому свидетельству.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּחִלַת
  choice: Начало
  rationale: Сохраняет прямое значение формы сопряжённого состояния и краткую афористическую структуру.
- source_word: גְּאוֹן
  choice: гордыни
  rationale: В контексте мудростной литературы слово обозначает нравственно предосудительное самовозвышение; «гордыня» яснее передаёт отрицательный оттенок, чем нейтральная «гордость».
- source_word: אָדָם
  choice: человеческой / человека
  rationale: Еврейское אָדָם имеет здесь обобщённое значение и относится к человеку вообще, а не только к мужчине. В первой части естественно передано прилагательным, во второй существительным для ясности местоименной связи.
- source_word: מוּעָז
  choice: дерзость
  rationale: Передаёт вызывающую, самонадеянную смелость и сохраняет краткость еврейского текста, не добавляя прямо не названный объект неповиновения.
- source_word: וּמֵעֹשֶׂהוּ
  choice: от его Создателя
  rationale: Буквально «от создавшего его». «Создатель» естественно и благоговейно обозначает Бога; прописная буква проясняет референт.
- source_word: יָסוּר לִבּוֹ
  choice: сердце человека отвращается
  rationale: Глагол סור означает отходить, уклоняться, отворачиваться. «Отвращается от» здесь передаёт направленное отчуждение, а настоящее время соответствует характеру общего изречения.
theological_decisions:
- issue: Следует ли вслед за греческим параллельным текстом прямо назвать Господа объектом первого действия
  choice: Сохранить более краткое еврейское «дерзость», а отчуждение от Бога выразить во второй части стиха.
  alternative: «Начало человеческой гордыни — отступление от Господа, и сердце человека удаляется от его Создателя».
  rationale: Первичным свидетельством служит еврейский текст, где מוּעָז не называет Господа прямо. Греческий текст раскрывает богословскую направленность высказывания, но вносить это уточнение в первую часть значило бы устранить различие между свидетельствами.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным звучанием мудростного изречения. «Гордыня» и «дерзость» сохраняют выраженную нравственную оценку; обобщённое אָדָם передано без ограничения смысла мужским полом.
