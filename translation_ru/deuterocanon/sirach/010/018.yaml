  text: Arrogance and insolence are not fitting for a human being[a], much less for one born of a woman.
translation:
  language: ru
  text: Высокомерие и дерзость не подобают человеку[a] — тем более тому, кто рождён женщиной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Высокомерие не сотворено для людей, ни яростный гнев — для рождённых женщинами». Еврейское свидетельство вместо этого говорит: «Высокомерие и дерзость не подобают человеку… тем более тому, кто рождён женщиной».'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא נָאוֶה
  choice: не подобают
  rationale: Передаёт оценочное значение неприличия и неуместности в еврейском тексте, не заимствуя греческое «не сотворено».
- source_word: לֶאֱנוֹשׁ
  choice: человеку
  rationale: אֱנוֹשׁ обозначает смертного человека; русский собирательный единственный естественно сохраняет представительный смысл.
- source_word: זָדוֹן
  choice: высокомерие
  rationale: Передаёт гордую, самонадеянную установку и не смешивает её со следующим обозначением вызывающей дерзости.
- source_word: וְעַזוּת
  choice: дерзость
  rationale: Выражает наглую, бесстыдную смелость с ясно отрицательной нравственной окраской.
- source_word: אַף
  choice: тем более
  rationale: Сохраняет усилительный переход к выражению о рождённом женщиной; в русском здесь естественна именно такая риторическая градация.
- source_word: לִילוּד אִשָּׁה
  choice: рождённому женщиной
  rationale: Сохраняет краткий библейский образ человеческой смертности и ограниченности.
theological_decisions:
- issue: Соотношение еврейского текста и греческой параллели
  choice: 'В основном тексте следовать засвидетельствованному еврейскому чтению: «не подобают» и «дерзость».'
  alternative: «Высокомерие не сотворено для людей, ни гневная ярость — для рождённых женщинами».
  rationale: Сохранившийся еврейский текст имеет высокий уровень уверенности и служит первичным источником; заметно отличающееся греческое чтение следует сохранить в примечании, не подменяя им основной текст.
translation_notes:
  register: Современный литературный русский язык; сжатая, афористичная и достойная форма. Конструкция «рождённому женщиной» намеренно сохраняет традиционный библейский образ без архаизации остальной фразы.
