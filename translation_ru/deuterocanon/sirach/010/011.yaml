  text: At a man's death[a], his inheritance is maggots and worms[b], gnats and creeping things.
translation:
  language: ru
  text: Когда человек умирает, его наследством становятся личинки и черви, мошки[a] и ползучие существа.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово כִּנִּים можно также перевести как «вши» или, более широко, «мелкие насекомые»; точный вид насекомых неясен.
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте перечень иной и более общий: «он унаследует ползучих существ, зверей и червей».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמוֹת אָדָם
  choice: Когда человек умирает
  rationale: Предлог בְּ с инфинитивом образует временную конструкцию. «Когда человек умирает» естественно передаёт её по-русски; אָדָם здесь обозначает отдельного человека в обобщающем смысле.
- source_word: יִנְחַל
  choice: ему достаются в наследство
  rationale: 'Глагол означает «наследовать, получить в наследство». Такая конструкция сохраняет горькую иронию: итоговым «наследством» умершего становятся существа разложения.'
- source_word: רִמָּה
  choice: личинки
  rationale: Слово обозначает червеобразных личинок, связанных с гниением и трупным разложением; этот вариант также позволяет отличить его от следующего תוֹלֵעָה.
- source_word: וְתוֹלֵעָה
  choice: и черви
  rationale: Обычное значение — «червь»; отдельный перевод сохраняет парное перечисление двух близких, но не тождественных слов.
- source_word: כִּנִּים
  choice: мошки
  rationale: Точное обозначение мелких насекомых неясно; «мошки» уместно в данном перечне, а возможные значения «вши» и более общее «паразиты» отмечены в сноске.
- source_word: וָרֶמֶשׂ
  choice: и ползучие твари
  rationale: רֶמֶשׂ — широкое обозначение мелких существ, которые ползают. «Ползучие твари» передаёт собирательный характер слова без неоправданного сужения до пресмыкающихся.
theological_decisions:
- issue: Обобщающее значение אָדָם
  choice: человек
  alternative: мужчина
  rationale: В изречении речь идёт об участи всякого отдельного человека, а не специально мужчины; русское «человек» точно сохраняет это обобщение.
- issue: Соотношение еврейского текста и греческой параллели
  choice: Перевести сохранившийся еврейский перечень напрямую
  alternative: 'Следовать греческому чтению: «он унаследует ползучих существ, зверей и червей»'
  rationale: Еврейский свидетель является основным и содержит более конкретный перечень. Греческая версия подтверждает общий образ, но отличается по составу существ, поэтому её чтение приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичной, достойной формой мудрого изречения. Конструкция «достаются в наследство» сохраняет ключевую метафору и её мрачную иронию; перечисление следует еврейскому тексту.
