  text: Следы народов Бог стёр, а их корень искоренил до самых глубин земли[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст: «Господь вырвал корни народов и насадил смиренных вместо них». Еврейский текст говорит о стирании «следов» народов и об искоренении их корня до глубин земли.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово, переведённое как «глубины», встречается редко и может означать самое дно или нижний предел земли; общий смысл — полное искоренение.
    reason: lexical_alternative
lexical_decisions:
- source_word: עִקְבוֹת
  choice: следы
  rationale: Слово связано с пятой и следом шага. «Следы» сохраняет конкретный образ еврейского текста и естественно сочетается с глаголом «стёр».
- source_word: גּוֹיִם
  choice: народы
  rationale: В контексте премудростной литературы речь идёт о народах, без более поздней богословской окраски слова «язычники».
- source_word: טִמְטֵם
  choice: стёр
  rationale: Глагол передаёт устранение, изглаживание или уничтожение. «Стёр» поддерживает образ следов, не усиливая значение до полного истребления сверх того, что выражено текстом.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Следует еврейскому чтению, не гармонизируя его с греческим «Господь».
- source_word: וְשָׁרְשָׁם
  choice: и корень их
  rationale: Сохранено единственное число еврейского текста, вероятно имеющее собирательное значение.
- source_word: עַד אֶרֶץ קִעֲקָע
  choice: до самых глубин земли
  rationale: Редкое קִעֲקָע указывает на нижний предел или глубину. Такая передача выражает полное искоренение, но не вводит слишком конкретный образ «скального основания».
theological_decisions:
- issue: Расхождение еврейского и греческого образов
  choice: 'Основной текст следует сохранившемуся еврейскому чтению: Бог стирает следы народов и их корень до глубин земли.'
  alternative: 'Греческий текст: «Господь вырвал корни народов и насадил смиренных вместо них».'
  rationale: Сохранившийся еврейский текст имеет приоритет; существенное греческое разночтение вынесено в примечание, чтобы не скрывать иную древнюю форму стиха.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Инверсия «стёр Бог» сохраняет поэтическую выразительность и акцентирует сначала объект суда, не делая фразу архаичной.
