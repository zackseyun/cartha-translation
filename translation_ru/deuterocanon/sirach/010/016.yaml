    rationale: Фраза «и корень их — до самых глубин земли» в современном русском не сообщает, что именно произошло с корнем. В еврейском поэтическом синтаксисе действие может быть эллиптически продолжено, но русский перевод нуждается в его экспликации.
  - severity: low
    issue: Примечание a чрезмерно конкретизирует синтаксис второго еврейского колона.
    rationale: Слова «об их корне, уничтоженном до глубин земли» представляют подразумеваемое действие как прямо выраженное. Лучше описать еврейский образ как искоренение, не приписывая тексту отдельную наличную глагольную форму.
