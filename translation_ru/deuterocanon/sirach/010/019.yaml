base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/019.yaml
  text: What offspring is honorable? Human offspring[a]. What offspring is honorable? Those who fear God[b]. What offspring is honorable? Those who keep the commandment.
translation:
  language: ru
  text: Какое потомство достойно чести? Человеческое потомство. Какое потомство достойно чести? Те, кто боится Бога.[b] Какое потомство достойно чести? Те, кто соблюдает заповедь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте заключительная строка звучит: «Какое потомство бесчестно? Потомство человеческое». Еврейский текст вместо неё говорит о потомстве, достойном чести: «те, кто соблюдает заповедь».'
    reason: textual_variant
  - marker: b
    text: 'В греческом тексте: «боящиеся Господа»; в еврейском: «боящиеся Бога».'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶרַע / σπέρμα
  choice: потомство
  rationale: Слово сохраняет собирательное значение и повторяется как ключевое во всех трёх частях изречения; «семя» в современном русском здесь звучало бы менее естественно.
- source_word: נִכְבָּד / ἔντιμον
  choice: достойное чести
  rationale: Передаёт значение почёта и достоинства, не создавая присущего слову «знатное» оттенка высокого происхождения, который изречение как раз ставит под вопрос.
- source_word: מַה / ποῖον
  choice: какое
  rationale: Естественно вводит риторический вопрос о том, кого следует считать достойным чести.
- source_word: לֶאֱנוֹשׂ / ἀνθρώπου
  choice: человеческое
  rationale: Передаёт общее указание на человечество без необоснованного ограничения мужским полом.
- source_word: יְרֵא אֱלֹהִים / οἱ φοβούμενοι τὸν κύριον
  choice: боящиеся Бога
  rationale: Основной текст следует сохранившемуся еврейскому чтению «Бога»; причастная конструкция передана естественным русским субстантивированным причастием.
- source_word: שׂוֹמֵר מִצְוָה
  choice: соблюдающие заповедь
  rationale: Сохранено единственное число «заповедь». «Соблюдать» естественно передаёт этико-заветный смысл שמר в современном литературном русском.
theological_decisions:
- issue: Расхождение еврейского и греческого текста в заключительной части стиха
  choice: В основном тексте следовать сохранившемуся еврейскому чтению о соблюдающих заповедь.
  alternative: 'Греческий параллельный текст: «Какое потомство бесчестно? Потомство человеческое».'
  rationale: Для Сираха сохранившийся еврейский текст имеет приоритет, однако греческое чтение существенно меняет построение и смысл заключительной строки, поэтому оно явно приведено в примечании.
- issue: Божественное именование
  choice: «Бога» по еврейскому יְרֵא אֱלֹהִים.
  alternative: «Господа» по греческому οἱ φοβούμενοι τὸν κύριον.
  rationale: Еврейский свидетель является основным; греческий вариант не устраняется и отмечается в примечании.
translation_notes:
  register: Современный литературный русский с кратким, афористическим ритмом. Повтор «достойное чести потомство» сохраняет композицию и ключевую лексику источника; родовые или аристократические ассоциации намеренно не привнесены.
