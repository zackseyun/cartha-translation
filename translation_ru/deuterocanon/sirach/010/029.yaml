  text: Who will declare righteous the one who condemns himself[a], and who will honor the one who dishonors himself?
translation:
  language: ru
  text: Кто признает правым того, кто сам себя осуждает?[a] И кто окажет честь тому, кто сам себя бесчестит?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте здесь другое изречение: «Бедняка почитают за его знание, а богача почитают за его богатство». Еврейская и греческая версии этого стиха существенно различаются.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַרְשִׁיעַ
  choice: осуждает
  rationale: Причастие породы hифиль от רשע имеет судебный смысл «признавать виновным, осуждать». В сочетании с נַפְשׁוֹ естественно передаётся как действие человека против самого себя.
- source_word: נַפְשׁוֹ
  choice: сам себя
  rationale: Здесь נֶפֶשׁ обозначает самого человека; русское возвратное выражение естественно и не создаёт неоправданного противопоставления души и тела.
- source_word: יַצְדִיקֶנּוּ
  choice: признает правым
  rationale: Hифиль от צדק выражает судебное признание правоты. Формулировка сохраняет юридический оттенок и избегает возможного узкоконфессионального звучания слова «оправдает».
- source_word: יְכַבֵּד
  choice: окажет честь
  rationale: Пиэль от כבד означает «чтить, оказывать честь»; эта передача естественно выражает общественное признание и поддерживает противопоставление следующему причастию.
- source_word: מַקְלֶה
  choice: бесчестит
  rationale: Причастие от קלל передаёт отношение к кому-либо как к незначительному, недостойному чести. «Бесчестит» создаёт ясную антитезу выражению «окажет честь».
theological_decisions:
- issue: Расхождение еврейского и греческого свидетелей
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; существенно иное греческое изречение приведено в сноске.
  alternative: 'Греческий текст: «Бедняка почитают за его знание, а богача почитают за его богатство».'
  rationale: Еврейский текст здесь имеется и обладает высокой заявленной достоверностью, поэтому он служит основой перевода. Полностью отличающийся греческий вариант нельзя ни смешивать с ним, ни замалчивать; он отмечен как отдельная текстовая традиция.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического изречения. Повтор «кто сам себя» и параллелизм двух вопросов сохранены; судебная окраска первого полустишия отличена от социальной категории чести во втором.
