lexical_decisions:
- source_word: מִקְוֵה
  choice: надежда
  rationale: Основное значение здесь — «надежда» или «то, на что надеются». Перевод следует сохранившемуся еврейскому тексту; греческое «начало» отмечено в сноске как иное чтение.
- source_word: זָדוֹן
  choice: высокомерие
  rationale: Передаёт гордую, самонадеянную и дерзкую установку, сохраняя нравственный смысл еврейского слова.
- source_word: חֵטְא
  choice: грех
  rationale: Прямое соответствие еврейскому существительному; это значение подтверждается и греческим параллельным текстом.
- source_word: מְקוֹרָהּ
  choice: источник его
  rationale: Сохраняет образ источника и относит местоимение к высокомерию; мужской род в русском обусловлен родом выбранного существительного.
- source_word: יַבִּיעַ
  choice: изливает
  rationale: Передаёт образ потока, исходящего из источника, и естественно сочетается с существительным «источник».
- source_word: זִמָּה
  choice: нечестие
  rationale: Передаёт широкий смысл злого умысла и нравственной порочности, не сужая слово до одной лишь сексуальной распущенности.
theological_decisions:
- issue: Еврейское מִקְוֵה в сравнении с греческим ἀρχή в начале стиха
  choice: 'В основном тексте следовать еврейскому чтению: «надежда высокомерия — грех».'
  alternative: «начало гордости — грех»
  rationale: Для этого стиха сохранился еврейский текст, которому отдаётся первенство. Греческая традиция существенно отличается и потому приведена в сноске, а не молчаливо согласована с еврейской.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического изречения. Метафора источника сохранена; подлинное расхождение между еврейской и греческой традициями вынесено в сноску.
