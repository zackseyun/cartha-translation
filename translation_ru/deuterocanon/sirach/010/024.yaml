lexical_decisions:
- source_word: נָגִיד
  choice: вождь
  rationale: Обозначает человека, поставленного над другими и облечённого властью. «Вождь» сохраняет отличие от следующего מוֹשֶׁל и не вносит обязательного династического оттенка слова «князь».
- source_word: מוֹשֶׁל
  choice: правитель
  rationale: Передаёт лицо, осуществляющее власть, и естественно звучит в трёхчленном перечне должностных лиц.
- source_word: שׁוֹפֵט
  choice: судья
  rationale: Прямое и обычное обозначение судебной должности.
- source_word: נִכְבָּדוּ
  choice: пользуются почётом
  rationale: Форма выражает то, что перечисленные лица почитаемы; этот вариант естественно передаёт общественное уважение и согласуется с множественным числом.
- source_word: וְאֵין גָּדוֹל
  choice: но нет никого выше
  rationale: Сохраняет сравнительно-превосходный смысл и ясно выражает противопоставление почётным властителям.
- source_word: מִיְּרֵא אֱלֹהִים
  choice: боящегося Бога
  rationale: Сохраняет устойчивое библейское выражение о благоговейном страхе перед Богом и единственное число типичного представителя.
theological_decisions:
- issue: Выбор между еврейским текстом и существенно отличающимся греческим чтением
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; расхождение отмечено сноской.
  alternative: 'Греческое свидетельство: «Свободные будут служить мудрому рабу, и разумный человек не станет роптать».'
  rationale: При наличии еврейского текста Сираха он служит первичным источником. Греческий текст содержит не малый вариант, а иное изречение, поэтому его следует сохранить в аппарате, не смешивая с основным текстом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской афористической речи. Синтаксис краток и ясен; выражение «боящийся Бога» сохранено как важная библейская формула.
