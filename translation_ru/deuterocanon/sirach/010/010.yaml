translation:
  language: ru
  text: Малейшая болезнь заставит врача побледнеть[a]; сегодня он царь, а завтра падёт[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «заставит пожелтеть» — образ болезненного изменения цвета лица.'
