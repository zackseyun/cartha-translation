  text: There is a poor man who is honored because of his insight[a], and there is one who is honored because of his wealth.
translation:
  language: ru
  text: Есть бедняк, которого уважают за его рассудительность[a], и есть тот, кого уважают за его богатство.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Тот, кого почитают в бедности, — насколько же больше в богатстве? А тот, кого не почитают в богатстве, — насколько же больше в бедности?» Еврейский и греческий тексты здесь существенно различаются.'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּל
  choice: бедняк
  rationale: Слово обозначает бедного или слабого человека. «Бедняк» естественно передаёт субстантивированное прилагательное мужского рода в единственном числе.
- source_word: נִכְבָּד
  choice: которого уважают
  rationale: Форма нифаля от כבד выражает почёт и общественное уважение. Русская конструкция «которого уважают» естественнее буквального «уважаемый» и одинаково применима в обеих частях.
- source_word: בִּגְלַל
  choice: за
  rationale: Предлог обозначает основание или причину. В сочетании с глаголом «уважают» русское «за» ясно и естественно выражает это отношение.
- source_word: שִׂכְלוֹ
  choice: его рассудительность
  rationale: שכל может означать разумение, благоразумие и здравый смысл. «Рассудительность» передаёт практическую разумность, не отождествляя её без необходимости с более широким понятием мудрости.
- source_word: עָשְׁרוֹ
  choice: его богатство
  rationale: Существительное прямо обозначает материальное богатство; это наиболее ясный современный русский эквивалент.
- source_word: יֵשׁ ... וְיֵשׁ
  choice: Бывает ... и бывает ...
  rationale: Повтор сохраняет уравновешенный афористический параллелизм еврейской конструкции и звучит естественно по-русски.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста с греческой параллелью
  choice: 'Основной текст следует еврейскому свидетельству и противопоставляет две причины общественного уважения: рассудительность бедняка и богатство другого человека.'
  alternative: 'Греческий текст содержит два риторических вопроса: если человека уважают в бедности, то насколько больше — в богатстве; если же он лишён уважения в богатстве, то насколько больше — в бедности.'
  rationale: Сохранившийся еврейский текст является первичным источником для основного перевода, однако существенное расхождение с греческой формой нельзя скрывать, поэтому она приводится в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма и синтаксический параллелизм сохранены. «Человек» во второй части добавлено для естественности и не уточняет пол сверх того, что выражено еврейской формой.
