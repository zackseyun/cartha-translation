  text: Pride is hateful to the Lord and to men[a], and from both comes oppressive wrongdoing.
translation:
  language: ru
  text: Гордость ненавистна Господу и людям, и притеснение — преступление против обоих.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская вторая часть стиха очень сжата и допускает иное понимание: «и от обоих исходит преступное притеснение». В греческом: «и перед обоими она совершит несправедливые дела», где подразумеваемым подлежащим, по-видимому, служит гордость.'
    reason: Сохраняет подлинную синтаксическую неоднозначность еврейского текста и отмечает отличающееся прочтение греческой параллели.
lexical_decisions:
- source_word: שְׂנוּאָה
  choice: ненавистна
  rationale: 'Передаёт предикативное значение причастной формы: гордость является предметом ненависти и отвращения.'
- source_word: לְאָדוֹן
  choice: Господу
  rationale: Хотя אָדוֹן может означать земного господина, контекст и греческое Κυρίου указывают здесь на Бога.
- source_word: וַאֲנָשִׁים
  choice: и людям
  rationale: В современном русском «людям» естественно обозначает людей вообще и не сужает смысл до взрослых мужчин.
- source_word: גַּאֲוָה
  choice: гордость
  rationale: Обычное и уместное для литературы мудрости обозначение высокомерного самомнения.
- source_word: וּמִשְּׁנֵיהֶם
  choice: против обоих
  rationale: Сохраняет отсылку к двум ранее названным сторонам — Господу и людям; значение предлога מן в сжатой фразе допускает понимание направленности проступка против них.
- source_word: מַעַל
  choice: преступление
  rationale: Слово обозначает тяжкий проступок, неверность или вероломное нарушение; «преступление» сохраняет нравственную тяжесть без навязывания исключительно культового смысла.
- source_word: עֹשֶׁק
  choice: притеснение
  rationale: Передаёт конкретный еврейский оттенок угнетения, эксплуатации и несправедливого обращения.
theological_decisions:
- issue: Кого обозначает אָדוֹן
  choice: Господь, то есть Бог
  alternative: земной господин или хозяин
  rationale: Греческая параллель Κυρίου и противопоставление Господа людям поддерживают божественный референт.
- issue: Связь второй части стиха с первой
  choice: притеснение является преступлением против обеих названных сторон
  alternative: от обеих сторон происходит притеснительное злодеяние; либо гордость совершает несправедливые поступки перед обеими
  rationale: Еврейская именная фраза предельно сжата. Основной текст следует наиболее прямому пониманию מַעַל עֹשֶׁק как характеристики притеснения, а альтернативную синтаксическую связь сохраняет примечание.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма сохранена. «Ненавистна» и «преступление» придают стиху достойную, но понятную нравоучительную тональность.
