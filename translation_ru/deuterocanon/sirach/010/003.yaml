base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/003.yaml
  text: As the judge of a people[a], so are his officials; and as the head of a city, so are its inhabitants.
translation:
  language: ru
  text: Каков правитель народа[a], таковы и его сановники; каков глава города, таковы и его жители.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая параллель: «Необразованный царь погубит свой народ, а город будет населён благодаря благоразумию правителей». Сохранившиеся еврейская и греческая формы этого стиха существенно различаются; основной текст следует еврейскому свидетельству.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּשׁוֹפֵט עַם
  choice: Каков судья народа
  rationale: 'Сочетание כְּ... כֵּן передаёт сопоставительную структуру пословицы: «каков… таковы…». שׁוֹפֵט может обозначать как судью, так и правителя; «судья» сохраняет прямое значение и политический контекст.'
- source_word: מְלִיצָיו
  choice: его служители
  rationale: מֵלִיץ может означать толкователя, посредника или представителя; в контексте управления речь, вероятно, идёт о людях при правителе, исполняющих официальные функции. «Служители» естественно передаёт это значение, не сужая его до советников или чиновников.
- source_word: וּכְרֹאשׁ עִיר
  choice: и каков глава города
  rationale: רֹאשׁ буквально означает «голова», а применительно к сообществу — «глава, начальник». Русское «глава города» сохраняет метафору и ясно выражает руководящую роль.
- source_word: יוֹשְׁבָיו
  choice: его жители
  rationale: Причастие от ישׁב обозначает живущих, обитателей. «Жители» кратко и естественно соответствует городскому контексту; местоимение «его» относится к городу.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческой параллели
  choice: 'Основной текст следует сохранившемуся еврейскому свидетельству: нрав и порядок при руководителе отражаются на его служителях и жителях города.'
  alternative: 'Греческая параллель: «Необразованный царь погубит свой народ, а город будет населён благодаря разумности правителей».'
  rationale: Еврейский текст здесь сохранился, имеет высокую степень надёжности и подтверждён; поэтому именно он служит основанием перевода. Существенно отличающийся греческий вариант приводится в сноске без попытки искусственно согласовать обе формы.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной конструкцией «каков… таковы…», передающей еврейский параллелизм. Тон dignified и общепонятный; неоднозначное מְלִיצָיו переведено достаточно широко как «служители».
