translation:
  language: ru
  text: Среди братьев почитаем их глава[a], а боящийся Бога — среди своего народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Богатый, знатный и бедный — их предмет гордости страх Господень». Еврейский и греческий тексты здесь существенно различаются; основной текст следует сохранившемуся еврейскому.'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּין אַחִים
  choice: среди братьев
  rationale: Предлог בֵּין обозначает положение внутри группы; «среди» естественно передаёт этот смысл. אַחִים сохранено как грамматически мужское множественное «братья».
- source_word: רֹאשָׁם
  choice: их глава
  rationale: רֹאשׁ буквально означает «голова», а применительно к группе — её глава или предводитель. «Глава» сохраняет образность и общественный смысл.
- source_word: נִכְבָּד
  choice: почитаем
  rationale: Форма от כבד имеет значение «быть почитаемым, уважаемым». Краткая форма «почитаем» соответствует достоинству изречения.
- source_word: וִירֵא אֱלֹהִים
  choice: и боящийся Бога
  rationale: Сохранены единственное число и характерная для библейской мудрости формула страха Божьего; «Бога» следует еврейскому אֱלֹהִים, а не греческому «Господа».
- source_word: בְּעַמּוֹ
  choice: среди своего народа
  rationale: Предлог בְּ здесь передаёт пребывание внутри сообщества. Возвратное «своего» естественно соотносит народ с боящимся Бога и сохраняет местоименный суффикс.
theological_decisions:
- issue: Существенное расхождение еврейского и греческого свидетелей
  choice: Основной текст переведён по сохранившемуся еврейскому тексту.
  alternative: 'Греческий текст: «Богатый, славный и бедный — похвала им страх Господень».'
  rationale: В данном месте еврейский и греческий тексты существенно различаются. Поскольку доступен еврейский свидетель с высокой степенью уверенности, он положен в основу; значимое греческое чтение приведено в сноске без попытки искусственно согласовать варианты.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным афористическим строем. Синтаксическая незавершённость второй части отражает лаконичность и некоторую неясность еврейского текста, не подменяя её добавленным сказуемым.
