translation:
  language: ru
  text: В руке Бога — власть всякого человека, и перед законодателем Он полагает его величие.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «В руке Господа — власть над землёй, и в надлежащее время Он поставит над нею пригодного человека». Вторая половина там существенно отличается и, вероятно, отражает иной еврейский исходный текст или его истолкование.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «его великолепие», «его достоинство» или «его честь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד אֱלֹהִים
  choice: В руке Бога
  rationale: Сохранена еврейская метафора власти и контроля; אֱלֹהִים прямо передано как «Бог», без замены на «Господь».
- source_word: מֶמְשֶׁלֶת כָּל גֶּבֶר
  choice: власть всякого человека
  rationale: מֶמְשֶׁלֶת обозначает правление или властные полномочия, а גֶּבֶר — мужчину или человека; буквальная формулировка сохраняет широкий и несколько необычный смысл еврейского текста.
- source_word: וְלִפְנֵי מְחוֹקֵק
  choice: и перед законодателем
  rationale: מְחוֹקֵק буквально означает того, кто устанавливает закон или издаёт постановления; синтаксическая неоднозначность оборота לִפְנֵי сохранена без поясняющего перефразирования.
- source_word: יָשִׁית הוֹדוֹ
  choice: Он полагает его величие
  rationale: יָשִׁית передано конкретным глаголом «полагает», а הוֹד — как «величие», охватывающее достоинство, великолепие и величавость. Заглавная буква у «Он» делает явной наиболее естественную отсылку к Богу, тогда как местоименный суффикс «его» сохраняет неоднозначность референта.
theological_decisions:
- issue: Соотношение Божьего верховенства и человеческой политической власти
  choice: Стих утверждает, что власть человека находится в Божьей руке, но не уточняет способ её установления.
  alternative: Понимать стих как прямое утверждение, что Бог лично назначает каждого правителя.
  rationale: Еврейский текст ясно говорит о Божьем контроле над человеческой властью, однако не формулирует механизм назначения; более определённое толкование не внесено.
- issue: Расхождение еврейского текста и греческой параллели
  choice: Основным принят еврейский текст, а существенно отличающийся греческий вариант приведён в примечании.
  alternative: Согласовать еврейский текст с греческим чтением о власти над землёй и своевременном воздвижении пригодного правителя.
  rationale: Еврейское свидетельство обозначено как основное и уверенное; гармонизация устранила бы подлинное текстовое расхождение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Метафора «в руке Бога» и несколько трудная структура второй строки сохранены ради близости к еврейскому тексту; текстовые и лексические альтернативы вынесены в примечания.
