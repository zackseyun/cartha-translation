  terminology: «Гордецы» и «смиренные» точно образуют требуемую антитезу. «Престол» уместен для образа власти. «Низверг» адекватно передаёт הָפַךְ в контексте. Имя «Бог» верно отражает אֱלֹהִים; подменять его «Господом» по греческому тексту не следует.
