translation:
  language: ru
  text: Бог низверг престол гордецов[a] и посадил смиренных вместо них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «престолы правителей».'
    reason: 'Отмечает существенное разночтение: в еврейском тексте — единственное число («престол гордецов»), в греческом — множественное («престолы правителей»).'
lexical_decisions:
- source_word: כִּסֵּא גֵאִים
  choice: престол гордецов
  rationale: Еврейский текст имеет существительное «престол» в единственном числе и множественное «гордецов». Перевод сохраняет это число и образ власти, не подменяя его чтением греческого параллельного текста.
- source_word: הָפַךְ
  choice: низверг
  rationale: В данном контексте буквальное «перевернул/опрокинул» означает свержение с престола; «низверг» естественно передаёт политический образ и силу действия.
- source_word: עֲנָוִים
  choice: смиренных
  rationale: Передаёт кротость и отсутствие гордыни; это естественная антитеза слову «гордецов».
- source_word: תַּחְתָּם
  choice: на их место
  rationale: Контекстуально означает, что смиренные заняли место гордецов; русский оборот ясно передаёт заместительное значение.
theological_decisions:
- issue: Именование действующего лица
  choice: Бог
  alternative: Господь
  rationale: Еврейский источник прямо читает אֱלֹהִים («Бог»), тогда как «Господь» засвидетельствовано в греческом параллельном тексте. Приоритет отдан указанному еврейскому источнику.
- issue: Число слова «престол»
  choice: единственное число
  alternative: множественное число («престолы»), как в греческом тексте и английском POB
  rationale: Сохраняется форма כִּסֵּא в единственном числе. Разночтение открыто отмечено в сноске, а не молча устранено.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом мудростной поэзии. Противопоставление «гордецов — смиренных» и параллелизм двух частей сохранены.
