  source_fidelity: 'Основной смысл передан верно: еврейский текст говорит, что Бог низверг престол гордецов и посадил смиренных вместо них. Единственное число «престол» обоснованно сохранено по еврейскому тексту; греческий параллельный текст имеет множественное число и «правителей». Однако местоимение в תַּחְתָּם относится к гордецам, а не к престолу: «на их место» смыслово допустимо, но в русском при единственном «престол» создаёт ненужную синтаксическую двусмысленность.'
