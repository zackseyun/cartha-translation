translation:
  language: ru
  text: В руке Бога — власть над миром[a], и в своё время человек встанет над миром.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции: «В руке Господа — успех человека, и на лицо книжника Он возложит Свою славу». Здесь греческая традиция существенно отличается от сохранившегося еврейского текста.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּיַד אֱלֹהִים
  choice: В руке Бога
  rationale: Сохранён понятный русский библейский образ руки как символа власти и распоряжения; אֱלֹהִים точно передано словом «Бог», а не «Господь».
- source_word: מֶמְשֶׁלֶת תֵּבֵל
  choice: власть над миром
  rationale: מֶמְשֶׁלֶת обозначает господство или власть, а תֵּבֵל — обитаемый мир. Такая формулировка естественна по-русски и ясно передаёт отношение управления.
- source_word: לְעֵת
  choice: в должное время
  rationale: Оборот указывает на подобающее, назначенное время; «в должное время» сохраняет эту смысловую оттенённость и высокий, но современный регистр.
- source_word: וְאִישׁ
  choice: человека
  rationale: אִישׁ — существительное мужского рода в единственном числе, здесь обозначающее отдельного правителя. Русское «человека» не добавляет отсутствующего в еврейском тексте определения «нужного» или «подходящего».
- source_word: יַעֲמוֹד עָלֶיהָ
  choice: Он поставит над ним
  rationale: Буквально выражение связано со стоянием «над» миром, но в контексте власти означает установление человека правителем. Заглавное «Он» делает явной естественно подразумеваемую отсылку к Богу, не называя конкретного земного правителя.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческой традиции
  choice: Основной текст следует еврейскому свидетельству, а греческий вариант полностью приводится в сноске.
  alternative: 'Следовать греческому тексту: успех человека находится в руке Господа, и Господь возлагает Свою славу на лицо книжника.'
  rationale: Еврейский текст здесь сохранён и имеет высокую степень надёжности; греческая форма стиха существенно иная и потому не должна незаметно смешиваться с ним.
- issue: Подлежащее и значение יַעֲמוֹד во второй строке
  choice: «Он поставит» — Бог устанавливает человека над миром.
  alternative: «человек в должное время встанет над ним» — человек выступает грамматическим подлежащим.
  rationale: Еврейская конструкция допускает более буквальное прочтение со значением «встанет», однако контекст מֶמְשֶׁלֶת и עָלֶיהָ указывает на поставление у власти. Перевод сохраняет богословскую мысль о Божьем распоряжении правлением, не добавляя определения качеств назначенного человека.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Образ «в руке Бога» сохранён, тогда как синтаксис второй части слегка прояснён ради естественности. Не добавлено оценочное «нужного человека», которого нет непосредственно в еврейском тексте.
