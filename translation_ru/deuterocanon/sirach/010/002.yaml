base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/010/002.yaml
  text: An undisciplined king will ruin a city[a], but a city is inhabited through the wisdom of its rulers.
translation:
  language: ru
  text: Необузданный царь погубит город, а город населён благодаря благоразумию своих правителей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально второе полустишие: «город населён благоразумием своих правителей». В греческой версии мысль выражена иначе: каков предводитель города, таковы и все его жители.'
    reason: Сохранена буквальная конструкция еврейского текста и отмечено существенное отличие древней греческой параллели.
lexical_decisions:
- source_word: מֶלֶךְ
  choice: царь
  rationale: Обычное значение еврейского слова; речь идёт о единоличном правителе. «Царь» естественно для литературного русского языка в древнем контексте.
- source_word: פָּרוּעַ
  choice: необузданный
  rationale: Слово обозначает отсутствие сдержанности и должного порядка. «Необузданный» передаёт нравственно-политический смысл, не сужая его до беззакония.
- source_word: יַשְׁחִית
  choice: погубит
  rationale: Глагол שחת выражает причинение гибели, разрушения или порчи. «Погубит» естественно применительно как к самому городу, так и к городской общине и не требует полного физического уничтожения.
- source_word: עִיר
  choice: город
  rationale: Стандартное соответствие, охватывающее и поселение, и городское сообщество.
- source_word: נוֹשֶׁבֶת
  choice: населён
  rationale: Причастная форма указывает на состояние города как населённого или обитаемого. Сохранён конкретный образ еврейского текста без замены его толкованием вроде «процветает».
- source_word: בְּשֶׂכֶל
  choice: благодаря благоразумию
  rationale: בְּ выражает средство или основание, а שֶׂכֶל — практический разум, рассудительность. Оборот «благодаря благоразумию» естественно передаёт причинную связь в русском языке.
- source_word: שָׂרֶיהָ
  choice: своих правителей
  rationale: Множественное число שרים обозначает руководителей, начальников или должностных лиц города. «Правители» ясно передаёт их руководящую роль; местоимение «своих» однозначно соотносит их с городом.
theological_decisions:
- issue: Соотношение еврейской формулировки и греческой параллели
  choice: Основной текст следует сохранившемуся еврейскому свидетельству и сохраняет образ города, населённого благодаря благоразумию его правителей.
  alternative: 'Передать по греческой параллели: «Каков правитель города, таковы и все его жители».'
  rationale: Еврейский текст здесь надёжен и является основным источником. Греческая версия свидетельствует о близкой общей мысли — состояние жителей соответствует руководству, — но заметно иначе формулирует оба полустишия, поэтому её чтение отмечено в сноске, а не внесено в основной текст.
- issue: Смысл состояния נוֹשֶׁבֶת
  choice: «населён»
  alternative: «процветает» или «остаётся населённым»
  rationale: «Населён» сохраняет конкретное значение еврейского слова и не усиливает его до процветания. «Остаётся» могло бы удачно выражать устойчивость города, но такого временного оттенка в форме прямо нет.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной и достойной формой. Порядок двух полустиший соответствует еврейскому тексту; противопоставление передано союзом «а». Термины не несут конфессионально-специфической нагрузки.
