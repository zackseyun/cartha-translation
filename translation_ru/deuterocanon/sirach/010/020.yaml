  source_fidelity: Основной текст корректно передаёт риторический вопрос и сохраняет образ זֶרַע как собирательного «потомства». Формула «потомство того, кто преступает заповедь» следует выбранному в английской контрольной версии способу прояснить трудный еврейский синтаксис при сохранении единственного числа מִצְוָה. Сноска точно отмечает греческое чтение с множественным числом и субъектом «те, кто».
  naturalness: «Какое потомство достойно презрения?» — естественная для современного литературного русского риторическая формула; вторая фраза кратка и афористична. «Преступает заповедь» уместно в библейско-мудростном регистре и не звучит архаично чрезмерно.
  terminology: «Потомство», «заповедь» и «преступает» последовательно передают ключевые термины и соответствуют регистру. «Достойно презрения» несколько интерпретирует оценочный נִקְלֶה как основание для презрения, но в данном контексте верно воспроизводит смысл презренности и не меняет утверждения.
