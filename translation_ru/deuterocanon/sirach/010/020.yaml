  text: What kind of offspring is contemptible? The offspring of one who transgresses a commandment.[a]
translation:
  language: ru
  text: Какое потомство достойно презрения? Потомство того, кто преступает заповедь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «те, кто преступает заповеди» — во множественном числе; это чтение проясняет трудную формулировку еврейского текста.'
    reason: alternative_reading
lexical_decisions:
- source_word: זֶרַע
  choice: потомство
  rationale: Слово может означать «семя» или, собирательно, потомков; здесь речь идёт о происхождении и потомстве.
- source_word: נִקְלֶה
  choice: достойно презрения
  rationale: Передаёт значение низкого, лишённого чести, презренного и согласуется с греческим ἄτιμον.
- source_word: מַה
  choice: какое
  rationale: Естественно передаёт риторический вопрос, относящий потомство к определённому разряду.
- source_word: לֶאֱנוֹשׁ
  choice: того, кто
  rationale: Еврейская конструкция трудна; перевод сохраняет указание на человека и с опорой на параллель проясняет синтаксическую связь.
- source_word: עוֹבֵר
  choice: преступает
  rationale: В сочетании с מִצְוָה означает нарушение заповеди; «преступает» сохраняет нравственно-правовой оттенок.
- source_word: מִצְוָה
  choice: заповедь
  rationale: Сохранено единственное число еврейского текста и характерный для библейской литературы смысл.
theological_decisions:
- issue: Расхождение еврейского и греческого текста во второй части стиха
  choice: Основной текст следует сохранившемуся еврейскому чтению, сохраняя единственное число «заповедь»; греческая параллель используется для прояснения трудного синтаксиса.
  alternative: «те, кто преступает заповеди» — более прямое следование греческому тексту во множественном числе.
  rationale: Еврейский текст здесь засвидетельствован, хотя формулировка трудна. Греческая версия служит важным параллельным свидетельством, а её отличие отмечено в сноске без устранения текстовой неоднозначности.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма и риторический вопрос сохранены. Формулировка «достойно презрения» звучит естественно и передаёт оценочный смысл, не вводя конфессионально обусловленного толкования.
