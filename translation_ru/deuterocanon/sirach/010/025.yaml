  text: Do not act wisely in doing your work, and do not boast in a time of distress.[a]
translation:
  language: ru
  text: Не выставляй себя мудрецом, исполняя своё дело, и не хвались в час твоей беды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст здесь существенно иной: «Разумный раб возвышен, а глупый раб не станет жаловаться». Значение последнего глагола не вполне ясно; возможны оттенки «роптать» или «искать предлог».'
    reason: textual_variant
lexical_decisions:
- source_word: Μὴ σοφίζου
  choice: Не выставляй себя мудрецом
  rationale: Средняя форма глагола σοφίζω в данном предостережении подразумевает демонстрацию собственной мудрости или стремление умничать, а не осуждение подлинно мудрого поведения. Перевод передаёт этот отрицательный оттенок естественным современным русским языком.
- source_word: ποιῆσαι τὸ ἔργον σου
  choice: исполняя своё дело
  rationale: Инфинитивная конструкция указывает на действие или сферу, в которой человек не должен выставлять себя мудрецом. «Исполняя своё дело» сохраняет связь с порученной работой и звучит естественно.
- source_word: μὴ δοξάζου
  choice: не хвались
  rationale: В контексте наставления глагол означает прославлять себя, гордиться или хвалиться. «Не хвались» кратко и ясно передаёт возвратный смысл.
- source_word: ἐν καιρῷ στενοχωρίας σου
  choice: во время бедствия
  rationale: στενοχωρία обозначает бедствие, тяготу или стеснённые обстоятельства, а καιρός имеет временное значение. Выбранная формулировка сохраняет смысл и достоинство стиля.
- source_word: עֶבֶד מַשְׂכּיל הוּרָם, וְעֶבֶד סָכָל לֹא יִתְאוֹנֵן
  choice: приведено в сноске как иное еврейское чтение
  rationale: Сохранившийся еврейский свидетель существенно расходится с греческим текстом и не допускает их объединения в один перевод. Его содержание поэтому документируется отдельно, включая неопределённость последнего глагола.
theological_decisions:
- issue: Существенное расхождение еврейского и греческого свидетелей в Сир 10:25
  choice: В основном тексте передано греческое наставление не выставлять себя мудрецом и не хвалиться в бедствии.
  alternative: 'Сохранившийся еврейский текст: «Разумный раб будет возвышен, а глупый раб не станет жаловаться»; значение последнего глагола не вполне ясно.'
  rationale: Это текстологическое, а не вероучительное расхождение. Свидетели выражают разные мысли, поэтому их нельзя незаметно согласовать или слить; основной текст следует греческому свидетельству, а значимое еврейское чтение полностью отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным назидательным тоном. Выражение «не выставляй себя мудрецом» избегает ошибочного впечатления, будто осуждается сама мудрость, и передаёт отрицательный оттенок показного умничанья.
