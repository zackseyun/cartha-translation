  source_fidelity: 'Основной текст верно следует греческому свидетелю (Μὴ σοφίζου ... μὴ δοξάζου ... ἐν καιρῷ στενοχωρίας σου) и не смешивает его с существенно расходящимся еврейским текстом. Однако σου в последней фразе относится к адресату и должно быть отражено: речь идёт о его бедствии/тесноте.'
  naturalness: «Не выставляй себя мудрецом» — естественная современная передача предостережения против показной мудрости; «исполняя своё дело» стилистически приемлемо. «В час твоей беды» кратко, литературно и точнее передаёт личное притяжательное σου, чем общее «во время бедствия».
  terminology: «Хвалиться» точно передаёт δοξάζου в данном контексте. В сноске «разумный раб» точно воспроизводит עבד; термин оставлен именно как характеристика варианта рукописного текста. Для הוּרָם предпочтительна не маркированная будущность форма «возвышен», поскольку это перфект в пассиве; у יתאונן будущая форма сохраняет имперфект и отмеченная неопределённость значения.
