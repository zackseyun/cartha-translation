review_pass:
  verdict: revise
  source_fidelity: 'Основной текст в целом верно следует сохранившемуся еврейскому чтению: מַה — «почему», גאה — «гордиться», עפר ואפר — «прах и пепел», а יוּרַם גִּוְיוֹ передано без неоправданной конкретизации как «тело ... поднято». Однако еврейские суффиксы в заключительной части единственного числа; перевод «тело их» сглаживает эту особенность. При текстологически трудном месте лучше сохранить единственное число, не устраняя неясную соотнесённость местоимения.'
  naturalness: «Почему гордятся прах и пепел» допустимо в кратком библейском регистре, но нейтральный порядок «Почему прах и пепел гордятся» естественнее для современного литературного русского. «Хотя при жизни тело его поднято» остаётся намеренно странным, как и еврейский текст; перестановка «тело его при жизни поднято» немного яснее, не добавляя толкования.
  terminology: «Прах и пепел» — удачная традиционная и современно понятная передача образа. «Тело» корректно сохраняет диапазон גִּוְיוֹ («тело; труп») без преждевременного выбора. Примечание корректно сообщает греческое чтение, но его следует сформулировать как параллельное чтение и прямо отметить, что первое лицо в греческом тексте остаётся синтаксически трудным.
  issues:
  - severity: medium
    issue: Единственное число еврейских притяжательных суффиксов передано русским множественным «их».
    rationale: В еврейском בְּחַיָּיו и גִּוְיוֹ буквально имеют суффикс единственного числа. Хотя русское множественное согласование с парой «прах и пепел» естественно, здесь оно снимает формальную особенность и часть неясности трудного текста. «Его» сохраняет источник и не требует решать, к кому именно относится суффикс.
  - severity: low
    issue: Примечание называет греческий текст просто «греческим текстом» и не отмечает его собственную синтаксическую трудность.
    rationale: Это параллельное древнее чтение, а не замена основному еврейскому тексту. Указание на необычное первое лицо в греческой фразе точнее отражает состояние свидетельств и не создаёт ложной уверенности в реконструкции смысла.
  revised_text: Почему прах и пепел гордятся, хотя тело его при жизни поднято?[a]
  revised_footnotes:
  - marker: a
    text: 'Заключительная часть еврейского текста трудна для понимания; в ней стоят местоименные суффиксы единственного числа. В греческом параллельном тексте читается: «Ибо при жизни я выбросил его внутренности»; необычное первое лицо в этой фразе также затрудняет толкование. Греческое чтение подчёркивает телесную бренность и смертность человека. Возможно, еврейский текст также указывает на унижение или тленность тела.'
    reason: Альтернативное древнее чтение и текстологическая трудность.
  revision_rationale: 'Исправление ограничено сохранением единственного числа еврейских суффиксов и небольшой перестановкой слов для современного русского порядка. Заключительная фраза намеренно не истолковывается как «труп», «разложение» или «унижение»: текст еврейского свидетеля здесь неясен. Примечание точнее разграничивает еврейскую основу перевода и греческий параллельный текст.'
