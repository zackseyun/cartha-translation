translation:
  language: ru
  text: Почему гордятся прах и пепел, хотя при жизни тело их поднято?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная часть еврейского текста трудна для понимания. В греческом тексте: «Ведь ещё при жизни я выбросил его внутренности», — что подчёркивает телесную бренность и смертность человека. Возможно, и еврейский текст указывает на унижение или тленность тела.'
    reason: Альтернативное древнее чтение и текстологическая трудность.
lexical_decisions:
- source_word: מַה יִּגְאֶה
  choice: Почему гордятся
  rationale: 'Вопросительное מַה в риторическом вопросе передаёт укор: «почему, с какой стати?». Глагол גאה означает гордиться, превозноситься. Множественное число требуется нормами современного русского языка при парном подлежащем «прах и пепел», хотя в еврейском глагол стоит в единственном числе.'
- source_word: עָפָר וָאֵפֶר
  choice: прах и пепел
  rationale: Устойчивый библейский образ человеческой бренности; «прах» здесь естественнее и выразительнее нейтрального «пыль».
- source_word: אֲשֶׁר בְּחַיָּיו
  choice: хотя при жизни
  rationale: Связь заключительной части с вопросом неясна. Уступительное «хотя» передаёт принятую контекстуальную связь, не превращая трудный оборот в однозначное причинное объяснение.
- source_word: יוּרַם גִּוְיוֹ
  choice: тело их поднято
  rationale: יוּרַם — страдательная форма от רום, «поднять, возвысить»; גִּוְיוֹ может означать тело или труп. Выбрано менее определённое «тело», а буквальный образ поднятия сохранён. Местоимение согласовано по-русски с парным образом «прах и пепел».
theological_decisions:
- issue: Трудное заключительное предложение в сохранившемся еврейском тексте
  choice: 'Следовать еврейскому чтению: «хотя при жизни тело их поднято»'
  alternative: 'Следовать греческому параллельному тексту: «ведь ещё при жизни я выбросил его внутренности»'
  rationale: Еврейский свидетель является основным, однако его последняя часть здесь трудна и заметно расходится с греческой. Поэтому еврейская формулировка сохранена в основном тексте, а греческое чтение приведено в примечании как важное свидетельство темы телесной бренности.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого библейского образа. «Прах и пепел» переданы как олицетворённая пара; ради естественной русской грамматики использовано множественное число. Формулировка заключительной части намеренно не сглаживает неясность еврейского текста.
