translation:
  language: ru
  text: Как почитают человека, когда он богат[a], и как презирают, когда он беден!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий параллельный текст иначе выстраивает фразу и расставляет акценты: «Но тот, кого почитают в бедности, — насколько больше в богатстве? И тот, кто лишён почёта в богатстве, — насколько больше в бедности?» В основном тексте предпочтение отдано еврейскому свидетельству; греческое использовано для сопоставления.'
    reason: alternative_reading
lexical_decisions:
- source_word: נִכְבָּד
  choice: почитают человека
  rationale: Нифаль от כבד обозначает того, кто пользуется почётом или уважением. Безлично-обобщённое «почитают человека» естественно по-русски и передаёт общественную оценку.
- source_word: בְּעָשְׁרוֹ
  choice: когда он богат
  rationale: Предлог ב здесь обозначает состояние или обстоятельство. Такая формулировка ясно передаёт смысл «в его богатстве», не утверждая прямо, что богатство является причиной почёта.
- source_word: אֵיכָכָה
  choice: как
  rationale: Восклицательно-вопросительная частица выражает степень. Русское «как» сохраняет риторическую силу, не вводя отсутствующего в основном еврейском свидетельстве значения «тем более».
- source_word: וְנִקְלֶה
  choice: и как презирают
  rationale: Нифаль от קלה указывает на низкую оценку, пренебрежение или презрение. «Презирают» создаёт ясную смысловую противоположность глаголу «почитают».
- source_word: בְּעָנְיוֹ
  choice: когда он беден
  rationale: Как и в первой половине стиха, ב передаёт состояние или обстоятельство. Параллельная конструкция сохраняет антитезу богатства и бедности.
