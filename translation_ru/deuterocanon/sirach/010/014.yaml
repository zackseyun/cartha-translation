translation:
  language: ru
  text: Поэтому Бог наполнил его сердце и поразил его[a][b], и сокрушил его до конца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь труден; буквально — приблизительно: «Поэтому Бог наполнил его сердце, поразил и поразил его до конца». Дополнение при первом «поразил» в еврейском тексте не выражено. Греческий текст гласит: «Поэтому Господь сделал бедствия (или кары) необычайными и истребил их до конца».'
    reason: textual_variant
  - marker: b
    text: В греческом тексте стоит «Господь», тогда как в еврейском свидетельстве — «Бог».
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Обычная причинно-следственная связка, вводящая следствие сказанного ранее.
- source_word: מִלֵּא לִבּוֹ
  choice: наполнил его сердце
  rationale: Сохраняет буквальный образ еврейского текста и не добавляет отсутствующего в нём указания, чем именно было наполнено сердце.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Основной перевод следует сохранившемуся еврейскому свидетельству; греческое «Господь» отмечено в сноске.
- source_word: נָגַע
  choice: поразил его
  rationale: В контексте Божьего суда глагол נגע имеет смысл поражения или кары. Дополнение «его» восстановлено по контексту, поскольку дошедшая еврейская фраза синтаксически трудна.
- source_word: וַיַּכֵּהוּ
  choice: а затем сокрушил
  rationale: Передаёт губительную силу формы от נכה и позволяет избежать неестественного повтора русского «поразил».
- source_word: עַד כַּלֵּה
  choice: окончательно
  rationale: Выражает полноту доведённого до конца уничтожения; этому соответствует и греческое εἰς τέλος.
theological_decisions:
- issue: Различие Божьего титула в еврейском и греческом свидетельствах
  choice: Бог
  alternative: Господь
  rationale: Приоритет отдан сохранившемуся еврейскому тексту, а вариант греческого свидетельства указан в сноске без гармонизации.
- issue: Синтаксически трудная первая часть стиха
  choice: Сохранить образ наполненного сердца и понять נגע как последующее поражение человека
  alternative: 'Следовать греческому: «Господь сделал необычайными бедствия и истребил их окончательно»'
  rationale: Так основной текст остаётся максимально близким к еврейскому свидетельству, не скрывая его трудности и не подменяя его существенно отличающимся греческим чтением.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Неясность еврейского оборота не устранена добавлением предполагаемого содержания сердца; существенное отличие греческого текста вынесено в сноску.
