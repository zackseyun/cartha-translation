base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/014.yaml
  text: At the opening of his hands they will rejoice[b][a], but the transgressors will suddenly come to an end forever.
translation:
  language: ru
  text: 'Когда он раскроет руки, он возрадуется[a][b]; так преступающие закон внезапно исчезнут навеки.


    [a] Первая половина стиха в сохранившемся еврейском тексте трудна для понимания и, возможно, повреждена; в ней, по-видимому, упоминаются «народ» и «грабёж». Греческий текст гласит: «Когда он раскроет руки, он возрадуется».


    [b] Масадская рукопись сохраняет здесь лишь фрагментарное чтение; каирский генизный текст и греческий текст существенно расходятся в первой половине стиха. Поэтому основной текст следует более ясному греческому чтению.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Первая половина стиха в сохранившемся еврейском тексте трудна для понимания и, возможно, повреждена; в ней, по-видимому, упоминаются «народ» и «грабёж». Греческий текст гласит: «Когда он раскроет руки, он возрадуется».'
    reason: alternative_reading
  - marker: b
    text: Масадская рукопись сохраняет здесь лишь фрагментарное чтение; каирский генизный текст и греческий текст существенно расходятся в первой половине стиха. Поэтому основной текст следует более ясному греческому чтению.
    reason: textual_variant
lexical_decisions:
- source_word: שאתו כפים / ἐν τῷ ἀνοῖξαι αὐτὸν χεῖρας
  choice: когда он раскроет ладони
  rationale: Еврейское выражение в данном месте неясно и, вероятно, повреждено. Перевод опирается на ясное греческое чтение со значением раскрытия рук; «ладони» естественно передаёт этот образ по-русски.
- source_word: עם עם / εὐφρανθήσεται
  choice: то возрадуется
  rationale: 'Еврейское чтение непонятно и допускает связь с «народом» и грабежом, тогда как греческий текст однозначно содержит форму единственного числа будущего времени: «возрадуется». Расхождение отмечено в сносках.'
- source_word: פתאם
  choice: внезапно
  rationale: Прямое и естественное соответствие еврейскому наречию, сохраняющее неожиданность исхода.
- source_word: לנצח
  choice: навеки
  rationale: Передаёт значение окончательности и длительности без ослабления формулировки.
- source_word: יתם / ἐκλείψουσιν
  choice: исчезнут
  rationale: Оба глагола могут обозначать прекращение существования, иссякновение или исчезновение. «Исчезнут» естественно в данном контексте и не добавляет образа насильственной гибели.
- source_word: οἱ παραβαίνοντες
  choice: преступающие закон
  rationale: Греческое причастие обозначает тех, кто преступает установленные пределы или предписания. Развёрнутая формулировка яснее современному читателю, чем отвлечённое «преступники», которое может звучать исключительно уголовно-правовым термином.
theological_decisions:
- issue: Использование греческого параллельного текста при трудном еврейском чтении
  choice: Основной текст следует ясному греческому чтению первой половины стиха, а расхождение с еврейскими рукописями раскрывается в сносках.
  alternative: Передать предположительный еврейский смысл с упоминанием народа и грабежа.
  rationale: Сохранившаяся еврейская строка синтаксически и лексически нестабильна, тогда как греческая версия даёт связный смысл. Выбор не скрывает текстологическую проблему и не выдаёт реконструкцию за несомненный текст.
- issue: Связь между двумя половинами стиха
  choice: «так и»
  alternative: «но» или «потому что»
  rationale: Греческое οὕτως выражает соответствие или итог («так», «таким образом»), тогда как еврейское כי может иметь пояснительное значение. «Так и» сохраняет связь частей без привнесения явно не выраженного противопоставления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Возрадуется» и «навеки» сохраняют достоинство стиля, оставаясь понятными; «преступающие закон» избегает узкого современного значения слова «преступники».
