translation:
  language: ru
  text: Дети и строительство города утверждают имя[a][b], но выше того и другого ценится безупречная жена.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Каирский еврейский текст читается приблизительно так: «а от обоих происходит мудрость»; греческий параллельный текст: «но выше того и другого ценится безупречная жена». Поскольку еврейский текст этой части стиха, по-видимому, повреждён или неустойчив, основной текст следует более ясному греческому чтению.'
    reason: alternative_reading
  - marker: b
    text: Более древний свиток из Масады здесь сохранился лишь фрагментарно и не позволяет уверенно установить окончательную форму строки.
    reason: textual_variant
lexical_decisions:
- source_word: ילד / τέκνα
  choice: дети
  rationale: Еврейское слово допускает собирательное понимание, а греческое множественное τέκνα подтверждает смысл «дети».
- source_word: ועיר יעמידו שם / οἰκοδομὴ πόλεως στηρίζουσιν ὄνομα
  choice: строительство города сохраняет имя
  rationale: Переданный еврейский текст синтаксически труден; греческий параллельный текст ясно говорит о строительстве города. «Сохраняют имя» естественно передаёт образ устойчивой, переживающей человека славы, не заменяя буквально выраженное «имя» словом «слава».
- source_word: ὑπὲρ ἀμφότερα ... λογίζεται
  choice: выше того и другого ценится
  rationale: Передаёт сравнительный смысл греческого выражения и сохраняет форму мудрого изречения; «ценится» отражает λογίζεται.
- source_word: γυνὴ ἄμωμος
  choice: безупречная жена
  rationale: В контексте γυνή естественно означает жену; «безупречная» выражает ἄμωμος как нравственную незапятнанность, не утверждая абсолютного безгрешия.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческого параллельного текста в заключительной части стиха
  choice: 'В основном тексте принято ясное греческое чтение: «выше того и другого ценится безупречная жена».'
  alternative: Передать еврейское чтение приблизительно как «а от обоих происходит мудрость».
  rationale: Еврейское чтение в этой строке выглядит текстуально неустойчивым и нарушает ясную сравнительную структуру изречения; греческий текст сохраняет связный смысл. Подлинное расхождение не скрыто, а вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и достойная форма. Сочетание «сохраняют имя» удерживает библейский образ долговечной памяти, а «выше того и другого ценится» ясно выражает сравнение без конфессионального толкования.
