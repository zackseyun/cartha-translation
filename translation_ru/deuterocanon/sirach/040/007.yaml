  text: Again he prepares for battle[a], and he wakes up, and there is no terror; then he finds rest.
translation:
  language: ru
  text: И снова он готовится к битве[a], пробуждается — и ужаса нет; тогда он обретает покой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст допускает более буквальную передачу: «И снова он устраивает (или выстраивает) битву, пробуждается — и ужаса нет; и обретает покой». Греческий текст заметно отличается: «Во время своего избавления он пробудился, удивляясь, что нет никакого страха». Основной текст следует сохранившемуся еврейскому свидетельству.'
    reason: alternative_reading
lexical_decisions:
- source_word: עוד
  choice: И снова
  rationale: Слово указывает на повторение очередного тревожного переживания; «и снова» естественно связывает стих с предшествующим перечислением.
- source_word: עורך מלחמה
  choice: готовится к битве
  rationale: Глагол ערך буквально означает «располагать, выстраивать, приводить в порядок» и употребляется в военном контексте. Русское «готовится к битве» естественно передаёт образ, не добавляя лишних тактических подробностей.
- source_word: והקיץ
  choice: пробуждается
  rationale: קיץ означает пробуждение от сна. Настоящее время сохраняет характер обобщённого описания повторяющегося человеческого опыта.
- source_word: ואימה אין
  choice: и ужаса нет
  rationale: Сохранена краткая безглагольная конструкция еврейского текста и сильное значение אימה — «ужас, страх».
- source_word: ומצא מנוח
  choice: тогда он обретает покой
  rationale: מנוח означает покой или отдохновение. «Тогда» ясно выражает последовательность событий, подразумеваемую контекстом, а «обретает покой» звучит естественно и достойно.
