  yaml_path: translation/deuterocanon/sirach/040/013.yaml
  text: From force to force[a], like a perennial wadi, and from a mighty channel[c][b], with a crash of sounds.
translation:
  language: ru
  text: От силы к силе[a], словно неиссякающий поток[c], и из могучего русла — в оглушительном грохоте[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Богатство неправедных иссякнет, как река, и прогремит, как сильный гром во время дождя». Это свидетельствует о существенно иной форме текста, чем сохранившийся еврейский.'
    reason: alternative_reading
  - marker: b
    text: Еврейский текст этой строки труден, а фрагмент из Масады сохранился слишком неполно, чтобы надёжно установить чтение. Перевод следует еврейским рукописям Каирской генизы с учётом греческого параллельного текста.
    reason: textual_variant
  - marker: c
    text: 'Или: «словно постоянный поток». Еврейское נחל нередко обозначает вади — русло временного водотока, — а איתן указывает на устойчивое, непрекращающееся течение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מחיל אל חיל
  choice: от силы к силе
  rationale: Слово חיל может означать силу, мощь, войско или богатство. В сохранившемся еврейском тексте ближайшие образы бурного потока и могучего русла поддерживают значение нарастающей силы; заметно отличающееся греческое чтение вынесено в примечание.
- source_word: נחל איתן
  choice: неиссякающий поток
  rationale: נחל обозначает поток, вади или его русло, а איתן — устойчивость, постоянство и мощь. Сочетание «неиссякающий поток» естественно для современного русского языка и передаёт идею постоянного течения.
- source_word: אפיק אדיר
  choice: могучее русло
  rationale: אפיק — русло, ложе потока или ущелье; אדיר — могучий, мощный. «Могучее русло» сохраняет конкретный образ водного потока и параллелизм строки.
- source_word: בחזיז קולות
  choice: с грохотом звуков
  rationale: Редкое и трудное выражение; קולות может означать звуки, голоса или громовые раскаты. Перевод сохраняет слуховой образ и его силу, не сводя неоднозначную еврейскую формулировку исключительно к грому.
