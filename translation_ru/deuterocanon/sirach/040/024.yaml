base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/024.yaml
  text: A brother and a companion are for a time of trouble[a], but righteousness delivers more than both.
translation:
  language: ru
  text: Брат и товарищ нужны в пору беды, но праведность[a] избавляет лучше, чем оба они.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Братья и помощь — на время скорби, и милостыня (или: милосердие) избавит лучше, чем и то и другое». В еврейском тексте здесь стоит «праведность».'
    reason: Альтернативное греческое чтение отличается и во второй части первой строки, и в ключевом нравственном понятии заключительной строки.
lexical_decisions:
- source_word: אח
  choice: брат
  rationale: Прямое и конкретное значение еврейского слова сохранено; расширительные варианты «родственник» или «ближний» здесь не требуются.
- source_word: ושותף
  choice: и товарищ
  rationale: Слово обозначает того, кто участвует в общем деле или разделяет обстоятельства с другим. «Товарищ» естественно передаёт личную взаимную поддержку, не ограничивая смысл деловым партнёрством.
- source_word: לעת צרה
  choice: в пору беды
  rationale: Краткое и естественное выражение для времени нужды, бедствия или тяжёлых обстоятельств; сохраняет афористический строй изречения.
- source_word: ומשניהם
  choice: лучше, чем они оба
  rationale: 'Передан сравнительный смысл: действие праведности превосходит помощь обоих названных людей.'
- source_word: צדק
  choice: праведность
  rationale: Основной еврейский текст имеет широкое нравственное понятие «праведность». Более узкое «справедливость» могло бы неоправданно придать высказыванию судебно-правовой оттенок. Отличающееся греческое чтение отмечено в сноске.
- source_word: מצלת
  choice: избавляет
  rationale: Глагол означает выручать, избавлять от опасности. «Избавляет» уместно в литературном изречении и не усиливает без необходимости сотериологический оттенок.
theological_decisions:
- issue: Еврейское צדק и греческое ἐλεημοσύνη в заключительном сравнении
  choice: В основном тексте — «праведность», согласно сохранившемуся еврейскому свидетельству.
  alternative: «милостыня» или «милосердие», согласно греческому параллельному тексту.
  rationale: Сохранившийся еврейский текст служит основным источником, однако греческое чтение существенно меняет нравственный акцент стиха и потому прозрачно сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим строем. Выражение «нужны в пору беды» естественно восполняет подразумеваемую в еврейском именную связку; союз «но» ясно передаёт смысловое противопоставление и превосходство последней опоры.
