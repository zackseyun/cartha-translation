base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/005.yaml
  text: Yet envy[a], anxiety, and fear, and the dread of death, bring contention in abundance; and at the time of his rest upon his bed[b], the sleep of night changes his misery.
translation:
  language: ru
  text: Но зависть, тревога, страх и ужас смерти порождают множество распрей[a]; а когда он отдыхает на своём ложе, ночной сон изменяет его страдание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская фраза, переведённая словами «порождают множество распрей», сжата и не вполне ясна. В греческой версии перечень треволнений пространнее и прямо включает гнев и распрю.
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «изменяет его беду» или «меняет его мучительное состояние». Здесь еврейское слово, вероятно, означает бедствие или страдание, а не нравственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אך
  choice: но
  rationale: Передаёт присоединённое противопоставление в контексте перечисления тягот человеческой жизни; звучит естественно по-русски.
- source_word: קנאה
  choice: зависть
  rationale: В ряду мучительных переживаний слово имеет отрицательный смысл; «зависть» точнее передаёт его здесь, чем положительно окрашенная «ревность».
- source_word: דאגה
  choice: тревога
  rationale: Обозначает мучительную заботу и беспокойство; «тревога» естественна в современной литературной речи.
- source_word: פחד
  choice: страх
  rationale: Прямой эквивалент, не усиливающий без необходимости степень переживания.
- source_word: אימת מות
  choice: ужас смерти
  rationale: Сохраняет усиленное значение אימה и конструкцию со значением страха перед смертью.
- source_word: תחרה ורב
  choice: разжигают множество раздоров
  rationale: Сжатая и не вполне ясная еврейская фраза, вероятно, описывает обильные распри или смятение, вызываемые перечисленными страстями; глагол «разжигают» передаёт возможное каузативное значение, а греческая параллель подтверждает мотив гнева и распри.
- source_word: ועת נוחו
  choice: а когда человек отдыхает
  rationale: Естественно передаёт временное значение עת и устраняет по-русски неясное местоимение без добавления нового действующего лица.
- source_word: על משכבו
  choice: на своём ложе
  rationale: Близко к образу еврейского текста и сохраняет достойный поэтический регистр.
- source_word: שינת לילה
  choice: ночной сон
  rationale: Краткий и естественный русский эквивалент определительной конструкции.
- source_word: תשנה
  choice: изменяет
  rationale: Прямо передаёт значение «менять, изменять», подтверждаемое греческим ἀλλοιοῖ.
- source_word: רעתו
  choice: его страдание
  rationale: В данном контексте רעה обозначает бедственное, мучительное состояние, а не нравственное зло; «страдание» передаёт это без морального оттенка.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и более пространной греческой параллели
  choice: Основной текст следует еврейскому свидетельству, а греческая параллель используется лишь для прояснения трудной фразы תחרה ורב.
  alternative: Расширить русский текст по греческой версии, прямо добавив гнев, смятение и распрю.
  rationale: Еврейский текст здесь сохранился и остаётся первичным; расширение по греческому списку скрыло бы различие между свидетелями.
- issue: Значение רעתו в заключительной строке
  choice: Передать как «его страдание», то есть мучительное состояние человека.
  alternative: Буквальное «его зло» либо «его беда».
  rationale: Контекст говорит о тяготах и нарушенном покое, а не о нравственной порочности; при этом сноска сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской ритмикой. «Ложе» сохраняет поэтический образ без архаизации; трудные места не сглажены и отмечены сносками.
