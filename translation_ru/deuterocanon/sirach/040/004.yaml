  text: от носящего тюрбан и венец[a] — до облачённого в одежду из шкуры.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «от носящего одеяние цвета гиацинта и венец — до одетого в грубый лён». Еврейские и греческие свидетели различаются в конкретных образах одежды, но одинаково обозначают широкий общественный диапазон.'
