lexical_decisions:
- source_word: מעוטה
  choice: малую
  rationale: 'Слово понято как определение к צניף: небольшая или скромная головная повязка. Такой перевод следует еврейскому чтению, не приписывая ему более точного социального значения.'
- source_word: צניף
  choice: повязку
  rationale: Обозначает обёрнутый головной убор. «Головная повязка» естественнее в данном контексте, чем более культурно специфичный «тюрбан».
- source_word: וציץ
  choice: и венец
  rationale: ציץ может означать цветок, налобное украшение или венец. «Венец» сохраняет значение нарядного головного украшения и согласуется с греческим στέφανον; цветочный оттенок слова остаётся возможным, но не навязывается.
- source_word: ועד
  choice: до
  rationale: Передаёт конечную точку охватываемого социального диапазона.
- source_word: עוטה
  choice: облачённого
  rationale: Причастие означает покрытого или одетого во что-либо. «Облачённого» сохраняет параллель с «носящего» и достойный литературный регистр.
- source_word: שמלת עור
  choice: одежду из шкуры
  rationale: Буквально «одежда из кожи/шкуры». «Шкура» передаёт грубый материал, не уточняя способ его обработки.
