  text: from the day he comes out from his mother's womb until the day he returns to the mother of all the living[a].
translation:
  language: ru
  text: с того дня, когда человек выходит из утробы матери, до дня, когда он возвращается к матери всех живущих[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к матери всех живущих». Вероятно, это поэтическое обозначение земли, в которую человек возвращается после смерти. В греческом тексте мысль о смерти выражена прямо: «день смерти».'
    reason: Сохраняет метафору основного еврейского текста и поясняет вероятный смысл с учётом греческой параллели.
lexical_decisions:
- source_word: מיום
  choice: с того дня
  rationale: Предлог מן с יוֹם обозначает начальную границу временного промежутка; «с того дня» естественно передаёт эту функцию по-русски.
- source_word: צאתו
  choice: когда человек выходит
  rationale: Форма от יצא буквально передаёт выход; в сочетании с утробой матери речь идёт о рождении. Глагольный перевод сохраняет конкретный образ еврейского текста.
- source_word: מרחם אמו
  choice: из утробы матери
  rationale: Прямой и естественный перевод, сохраняющий телесно-конкретный образ рождения. Притяжательное отношение ясно из контекста, поэтому русское «его» не требуется.
- source_word: עד יום
  choice: до дня
  rationale: Обозначает конечную границу того же временного промежутка и воспроизводит параллельную структуру стиха.
- source_word: שובו
  choice: когда он возвращается
  rationale: שוב означает «возвращаться». Личная глагольная конструкция поддерживает параллелизм с «когда человек выходит».
- source_word: אל אם כל חי
  choice: к матери всех живущих
  rationale: Сохранена поэтическая материнская метафора еврейского текста без подстановки толкований «земля» или «могила». «Всех живущих» точно передаёт כל חי и допускает возможное библейское созвучие.
theological_decisions:
- issue: Метафорическое обозначение смерти выражением «мать всех живущих»
  choice: Сохранить еврейскую метафору в основном тексте.
  alternative: Перевести как «земля», «могила» или прямо как «смерть».
  rationale: Первичный еврейский свидетель не называет землю или смерть прямо. Греческая параллель с выражением «день смерти» подтверждает общий смысл, но не требует устранять образность и неоднозначность еврейского текста.
- issue: Возможное созвучие с Быт 3:20
  choice: Не делать аллюзию на Еву явной в переводе или примечании.
  alternative: Истолковать «мать всех живущих» как прямую отсылку к Еве.
  rationale: Формулировка действительно созвучна Быт 3:20, однако контекст возвращения после жизни вероятнее указывает на землю. Перевод сохраняет словесное созвучие, не превращая возможную аллюзию в установленное толкование.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и поэтической образности. «Человек» введено как естественный русский субъект обобщённого высказывания; дальнейшее «он» избегает тяжеловесного повтора. Метафора не заменена конфессиональным или доктринальным толкованием.
