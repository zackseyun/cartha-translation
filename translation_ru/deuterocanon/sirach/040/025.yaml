  text: Gold and silver make the foot stand firm[a], but better than both is sound counsel.
translation:
  language: ru
  text: Золото и серебро дают твёрдую опору[a], но добрый совет лучше их обоих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Золото и серебро утверждают ногу, и выше их обоих — добрый совет». Греческий текст также сохраняет образ ноги и ставит совет выше золота и серебра.'
    reason: Передача буквального образа и сравнительной конструкции еврейского текста.
lexical_decisions:
- source_word: זהב וכסף
  choice: золото и серебро
  rationale: Прямой перевод устойчивой пары названий драгоценных металлов, обозначающей материальное богатство; пара подтверждается греческим χρυσίον καὶ ἀργύριον.
- source_word: יעמידו רגל
  choice: дают твёрдую опору
  rationale: 'Буквально: «поставят ногу» или «утвердят ногу». Перевод естественно передаёт значение устойчивости и обеспеченности, сохраняя образ опоры; буквальная форма отмечена в сноске.'
- source_word: ומשניהם
  choice: но … лучше их обоих
  rationale: Буквально выражение означает «и сверх/выше их обоих». В контексте оно вводит сопоставление, в котором совет превосходит золото и серебро; противительный союз естественно выражает этот смысл по-русски.
- source_word: עצה טובה
  choice: добрый совет
  rationale: 'Близко передаёт оба элемента еврейского выражения: עצה — «совет», טובה — «добрый, хороший». Такая формулировка звучит естественно и сохраняет лаконичность изречения.'
