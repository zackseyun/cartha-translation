lexical_decisions:
- source_word: יִרְאַת אֱלֹהִים
  choice: Страх Божий
  rationale: Сохраняет прямое значение еврейского выражения и библейскую формулу, не сужая её до одного лишь почтения. «Божий» следует еврейскому אֱלֹהִים, тогда как греческое «Господа» рассматривается как параллельное чтение.
- source_word: כְּעֵדֶן בְּרָכָה
  choice: словно благословенный Эдем
  rationale: Передаёт имя и образ Эдема, а также связь с благословением. Греческое παράδεισος подтверждает образ райского сада, но сохранившийся еврейский текст позволяет прямо назвать Эдем.
- source_word: וְעַל כָּל כָּבוֹד
  choice: лучше всякой славы
  rationale: על понято сравнительно, что поддерживается греческим ὑπὲρ πᾶσαν δόξαν. Формулировка сохраняет сопоставление со всякой славой и звучит естественно по-русски.
- source_word: חָפְתָה
  choice: он укрывает
  rationale: Форма от корня со значением покрытия передаёт защитный образ; местоимение согласовано в русском со словом «страх». Глагол «укрывает» выражает не просто заслонение, но защиту, не добавляя явно названного объекта.
theological_decisions:
- issue: Божественное именование
  choice: Божий
  alternative: Господень
  rationale: Основной еврейский свидетель содержит אֱלֹהִים («Бог»). Греческое Κυρίου («Господа») отмечает вариант традиции, но не заменяет здесь засвидетельствованное еврейское чтение.
- issue: Смысл страха перед Богом
  choice: Сохранено слово «страх»
  alternative: благоговение перед Богом
  rationale: Библейская формула включает благоговейный трепет, однако перевод одним словом «благоговение» преждевременно снимает смысловое напряжение исходного выражения.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и поэтического параллелизма. Формула «Страх Божий» выдержана в возвышенном, но общеупотребительном библейском регистре; «благословенный Эдем» делает образ понятным без утраты еврейского топонима.
