base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/001.yaml
  text: Great toil is allotted[c][b][a], and a heavy burden upon the children of man—from the day they come forth from their mother’s womb until the day they return to the mother of all.
translation:
  language: ru
  text: Людям выпал на долю тяжкий труд[a], и тяжёлое бремя[b] лежит на сынах Адама — со дня их выхода из утробы матери и до дня погребения в матери всех[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь сжат и может подразумевать: «Бог определил в удел». В греческом параллельном тексте: «создан для каждого человека».'
    reason: textual_ambiguity
  - marker: b
    text: 'Буквально по греческому параллельному тексту: «тяжёлое ярмо».'
    reason: lexical_alternative
  - marker: c
    text: Слова от «со дня» до конца стиха содержатся в полном греческом параллельном тексте; сохранившееся еврейское свидетельство короче.
    reason: alternative_reading
  - marker: d
    text: «Мать всех» — образ земли, в которой погребают умерших.
    reason: cultural_note
lexical_decisions:
- source_word: עסק גדול
  choice: тяжкий труд
  rationale: Сочетание обозначает тягостное, изнурительное занятие или труд. Такой перевод естественен по-русски и согласуется с греческим ἀσχολία μεγάλη.
- source_word: חלק אל
  choice: выпал на долю
  rationale: Еврейское выражение сжато и допускает понимание Бога как распределяющего долю; греческий параллельный текст говорит, что это создано для каждого человека. Безличная русская формулировка сохраняет идею удела, не устраняя текстовую неоднозначность.
- source_word: ועל כבד
  choice: тяжёлое бремя
  rationale: Еврейский текст эллиптичен, а греческое ζυγὸς βαρύς буквально означает «тяжёлое ярмо». «Тяжёлое бремя» ясно передаёт смысл, тогда как точная метафора указана в примечании.
- source_word: על בני אדם / ἐπὶ υἱοὺς Ἀδάμ
  choice: на сынах Адама
  rationale: Выражение сохраняет явную адамову образность греческого параллельного текста и обозначает всё человечество, не превращая антропологический образ в отвлечённое понятие.
- source_word: ἀφʼ ἡμέρας ἐξόδου ἐκ γαστρὸς μητρὸς αὐτῶν
  choice: со дня их выхода из утробы матери
  rationale: Близко передаёт греческую временную формулу и сохраняет её зримый образ рождения.
- source_word: ἕως ἡμέρας ἐπὶ ταφῇ εἰς μητέρα πάντων
  choice: до дня погребения в матери всего сущего
  rationale: Передаёт прямо засвидетельствованные в греческом тексте погребение и образ земли как общей матери, не добавляя отсутствующего глагола «вернуться».
theological_decisions:
- issue: Использование полного греческого параллельного текста при кратком еврейском свидетельстве
  choice: Еврейское начало переведено как основное, а указание на срок от рождения до погребения включено по греческому параллельному тексту и отмечено сноской.
  alternative: Ограничить основной текст только краткой сохранившейся еврейской строкой.
  rationale: Для книги Сираха сохранившийся еврейский текст первичен, но греческое свидетельство здесь даёт связное продолжение той же мысли. Сноска открыто показывает источник расширения.
- issue: בני אדם / υἱοὺς Ἀδάμ как обозначение человечества
  choice: сыны Адама
  alternative: люди; человечество; сыны человеческие
  rationale: Так сохраняются собирательное значение и адамова образность источника без введения дополнительного богословского толкования.
- issue: Образ «матери всего сущего»
  choice: Сохранить образ земли-матери в основном тексте и пояснить его в сноске.
  alternative: Заменить образом возвращения в землю.
  rationale: Прямой образ греческого текста выразителен и понятен после краткого пояснения; его не следует молча истолковывать в самом переводе.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Формы «сыны Адама» и «мать всего сущего» сохраняют образность источников; синтаксис остаётся понятным современному читателю.
