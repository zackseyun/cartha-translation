base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/006.yaml
  text: For a little while[a], like a moment, he is quiet in vain; then, from the terrors of his heart[b], he is shaken—like one fleeing from before a pursuer.
translation:
  language: ru
  text: Ненадолго, тщетно, лишь на мгновение он обретает покой, и от ужасов в сердце своём содрогается.[a] Недолго он блуждает в видении своей души — словно бегущий от преследователя.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская конструкция синтаксически трудна. Греческий параллельный текст также говорит о крайне кратком покое, после которого человек встревожен во сне, словно во время дневной стражи.
    reason: alternative_reading
  - marker: b
    text: 'Еврейское чтение во второй половине строки трудно: первое слово может подразумевать «уцелевшего», но несомненным остаётся образ человека, бегущего от преследователя. Греческий параллельный текст сравнивает его с человеком, спасшимся от лица войны.'
    reason: textual_variant
lexical_decisions:
- source_word: מעט
  choice: ненадолго / недолго
  rationale: В обоих случаях передаёт краткость покоя и последующего переживания; повтор еврейского слова сохранён близкими русскими формами.
- source_word: לריק
  choice: тщетно
  rationale: 'Сохраняет значение бесполезности: краткий покой не приносит настоящего облегчения.'
- source_word: כרגע
  choice: всего лишь на мгновение
  rationale: Естественно передаёт предельно малую продолжительность, выраженную сравнением с мгновением.
- source_word: ישקוט
  choice: обретает покой
  rationale: Передаёт состояние тишины и отдыха, оставаясь естественным для литературного русского языка.
- source_word: ומבין בהלות לבו נרעש
  choice: но среди ужасов сердце его содрогается
  rationale: Еврейская конструкция трудна; перевод сохраняет внутренний источник смятения и не сводит его только к телесной дрожи.
- source_word: מעט טע מחזיון נפשו
  choice: недолго блуждает он в видении своей души
  rationale: Сохраняет образ и неоднозначность еврейского текста, не подменяя «видение души» однозначным толкованием как обычный сон.
- source_word: כשריד בורח מפני רודף
  choice: словно уцелевший, бегущий от преследователя
  rationale: Передаёт как значение שריד («уцелевший»), так и ясный образ панического бегства от того, кто гонится следом.
