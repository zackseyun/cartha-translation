revisions:
- from: Ненадолго — тщетно, всего лишь на мгновение — он обретает покой, но среди ужасов сердце его содрогается.[a] Недолго блуждает он в видении своей души — словно уцелевший, бегущий от преследователя.[b]
  to: Ненадолго, тщетно, лишь на мгновение он обретает покой, и от ужасов в сердце своём содрогается.[a] Недолго он блуждает в видении своей души — словно бегущий от преследователя.[b]
  rationale: Перевод исправляет смещение субъекта в первой строке, убирает невыраженное в оригинале противопоставление и делает русскую фразу более прозрачной. Во второй строке сохранены повтор «недолго», образ «видения своей души» и неясность трудного еврейского чтения; спорное значение «уцелевший» перенесено в примечание, чтобы не выдавать его за установленное.
