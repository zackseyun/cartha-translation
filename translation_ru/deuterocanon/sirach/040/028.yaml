translation:
  language: ru
  text: 'Дитя[a], не живи попрошайничеством[b]: лучше умереть[c], чем попрошайничать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Обращение «Дитя» есть в греческой версии; в сохранившемся еврейском тексте этой строки его нет.
    reason: textual_variant
  - marker: b
    text: Еврейское выражение здесь трудно для понимания; греческая версия поясняет его как жизнь попрошайничеством, то есть за счёт выпрашиваемых даров или милостыни.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально по-еврейски: «быть собранным» — устойчивый образ смерти; греческая версия прямо говорит «умереть».'
    reason: idiom
lexical_decisions:
- source_word: חיי
  choice: не живи
  rationale: Форма слова обозначает образ или уклад жизни. В сочетании с אל תחי естественный русский перевод передаёт не отдельные «жизни», а постоянный способ существования.
- source_word: מכי מתן
  choice: подаянием
  rationale: Еврейское выражение неясно; греческая параллель ζωήν ἐπαιτήσεως указывает на жизнь за счёт выпрашиваемых даров или милостыни. «Жить подаянием» передаёт этот смысл естественно и без смешения бедности как состояния с попрошайничеством как образом жизни.
- source_word: אל תחי
  choice: не живи
  rationale: Прямой отрицательный императив от חיה; краткая русская форма сохраняет наставительный тон.
- source_word: טוב
  choice: лучше
  rationale: В контексте слово имеет сравнительное значение, подтверждаемое греческим κρεῖσσον.
- source_word: נאסף
  choice: умереть
  rationale: Буквально «быть собранным / приобщённым»; это еврейский эвфемистический оборот о смерти. Греческое ἀποθανεῖν прямо передаёт предполагаемый смысл.
- source_word: כמסתולל
  choice: чем просить подаяния
  rationale: Еврейская форма трудна и допускает неуверенный разбор; греческое ἐπαιτεῖν служит веским свидетельством в пользу значения «просить милостыню, нищенствовать». Союз «чем» выражает сравнительную конструкцию по-русски.
- source_word: τέκνον
  choice: Дитя моё
  rationale: Обращение присутствует в греческой параллели, хотя отсутствует в сохранившейся еврейской строке. «Дитя моё» сохраняет наставительный, родительский тон и не сужает адресата до сына мужского пола.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким наставительным ритмом. Выражение «жить подаянием» выбрано вместо более социально окрашенного «жить жизнью нищего»; повтор «подаянием / подаяния» сохраняет смысловой параллелизм и ясность. Текст в квадратных скобках после основной еврейской строки не включён, поскольку представляет отдельный добавочный материал, а не содержание Сираха 40:28.
