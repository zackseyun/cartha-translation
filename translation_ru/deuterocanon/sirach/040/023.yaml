  text: A companion and a friend conduct themselves for a time, but better than both is an intelligent wife.
translation:
  language: ru
  text: Товарищ и друг бывают рядом лишь на время[a], но лучше их обоих — разумная жена[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своё время» или «в нужное время». Еврейское לעת и греческое εἰς καιρόν допускают как временную ограниченность, так и оттенок своевременности.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово может также означать «женщина»; греческая параллель яснее указывает на супружеский смысл.
    reason: lexical_alternative
lexical_decisions:
- source_word: עמית
  choice: товарищ
  rationale: Слово обозначает близкого соратника или человека своего круга; «товарищ» естественно передаёт этот смысл и позволяет отличить его от следующего רע — «друг».
- source_word: רע
  choice: друг
  rationale: В паре с עמית это слово уместно передать как «друг», сохранив два близких, но не вполне тождественных вида отношений.
- source_word: לעת
  choice: до поры
  rationale: Выражение связано с ограниченным временем или сроком. «До поры» естественно по-русски передаёт временность, не исключая более общего значения «на время».
- source_word: ינהגו
  choice: идут рядом
  rationale: Форма от נהג допускает представление о движении, следовании или продолжающемся поведении. «Идут рядом» сохраняет образ совместного пути и звучит естественнее буквального «ведут себя» в данном контексте.
- source_word: ומשניהם
  choice: но лучше их обоих
  rationale: Хотя сравнительное значение не выражено отдельным прилагательным, строение еврейской фразы и греческое ὑπὲρ ἀμφότερα указывают на превосходство над обоими.
- source_word: אשה
  choice: жена
  rationale: Еврейское слово может означать и «женщину», и «жену»; греческая параллель γυνὴ μετὰ ἀνδρός яснее указывает на супружеский контекст.
- source_word: משכלת
  choice: разумная
  rationale: Слово выражает практическую рассудительность, понимание и здравый смысл; «разумная» ясно и достойно передаёт этот комплекс значений.
theological_decisions:
- issue: Передавать ли אשה как «женщина» или как «жена»
  choice: жена
  alternative: женщина
  rationale: Само еврейское слово допускает оба значения, однако греческая параллель говорит о женщине в связи с мужчиной/мужем, а контекст сопоставляет близкие отношения. Выбор «жена» контекстуален и не вносит конфессионального толкования.
- issue: Понимать ли לעת как временную длительность или как подходящий момент
  choice: до поры
  alternative: в нужное время
  rationale: Еврейское לעת и греческое εἰς καιρόν допускают временной оттенок без полной однозначности. Основной текст передаёт ограниченность во времени, а примечание сохраняет альтернативу своевременности.
translation_notes:
  register: Современный литературный русский язык с краткой афористической формой, подходящей книге Премудрости. Оборот «идут рядом» сохраняет образ отношений как совместного пути, а «до поры» придаёт строке естественную ритмичность без устранения смысловой неоднозначности.
