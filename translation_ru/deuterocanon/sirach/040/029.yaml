base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/029.yaml
  text: A man who watches another’s table—his life is not to be counted as life[a]; he defiles his appetite with another man’s delicacies[b], but a man who knows inward restraint will beware.
translation:
  language: ru
  text: Кто смотрит на чужой стол, того жизнь нельзя считать жизнью[a]; он оскверняет себя чужими яствами, но человек, знающий тайну внутренностей, будет остерегаться[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чужой стол»; и в греческом тексте — «стол, принадлежащий другому». Речь идёт о зависимости от чужого пропитания, а не об этнической принадлежности.'
    reason: lexical_alternative
  - marker: b
    text: 'Конец стиха в еврейском тексте труден: буквально он говорит о человеке, «знающем тайну внутренностей». Греческий текст передаёт смысл так: «знающий и наставленный человек будет беречься», что позволяет понимать эту фразу как указание на благоразумие и внутреннее самообладание.'
    reason: alternative_reading
lexical_decisions:
- source_word: איש משגיח על שלחן זר
  choice: Кто смотрит на чужой стол
  rationale: Сохраняется образ человека, устремляющего взгляд на стол, принадлежащий другому. «Чужой» здесь естественно обозначает чужую собственность, а не иноземное происхождение.
- source_word: אין חייו למנות חיים
  choice: того жизнь нельзя считать жизнью
  rationale: Передаёт эмфатический повтор еврейского слова «жизнь» и близко соответствует конструкции «не считать жизнью».
- source_word: מעוג לנפש מטעמו
  choice: он оскверняет себя чужими яствами
  rationale: Еврейский текст труден; перевод учитывает греческую параллель, где говорится об осквернении своей ψυχή чужими кушаньями. «Себя» не сужает נפש до нематериальной души, а «яства» сохраняют контекст стола и пищи.
- source_word: לאיש יודע סוד מעים
  choice: человек, знающий внутреннюю меру
  rationale: Фраза буквально связана с «тайной внутренностей» и остаётся неясной. «Внутренняя мера» сохраняет телесно-внутренний образ, но выражает понятную в контексте мудрости мысль о самообладании.
- source_word: φυλάξεται
  choice: будет остерегаться
  rationale: Греческая параллель ясно выражает благоразумную самозащиту; русский глагол краток и естественен для наставления мудрости.
