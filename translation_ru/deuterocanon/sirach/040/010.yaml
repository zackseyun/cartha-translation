  text: For the wicked[a], evil was created, and because of them destruction will cease only when it is complete.
translation:
  language: ru
  text: Для нечестивого создано зло, и из-за него оно не отступит, пока не совершится до конца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «и из-за них произошёл потоп». Здесь заключительная часть стиха существенно отличается от сохранившегося еврейского текста.'
    reason: alternative_reading
lexical_decisions:
- source_word: על רשע
  choice: Для нечестивого
  rationale: Предлог על допускает значения «для», «на» и «против»; здесь «для нечестивого» естественно передаёт связь созданного зла с нечестивцем, не сужая её только до направленного наказания. Единственное число רשע сохранено как обобщённое.
- source_word: נבראה רעה
  choice: создано зло
  rationale: רעה может означать как зло, так и бедствие. Буквальное и широкое «зло» сохраняет смысловую напряжённость и не устраняет возможный оттенок карающего бедствия.
- source_word: ובעבור
  choice: и из-за него
  rationale: 'בעבור выражает причину: «из-за, по причине». Местоименный референт восполнен из ближайшего обобщённого существительного «нечестивый»; греческое δι’ αὐτούς подтверждает причинное понимание, хотя употребляет множественное число.'
- source_word: תמוש כלה
  choice: оно не отступит, пока не совершится до конца
  rationale: מוש означает удаляться, отступать или прекращаться, а כלה связано с завершением и полным окончанием. Сжатая и трудная еврейская конструкция передана без внесения греческого упоминания потопа; местоимение «оно» относится к злу/бедствию.
theological_decisions:
- issue: Передача רעה как нравственного зла или карающего бедствия
  choice: зло
  alternative: бедствие
  rationale: Еврейское слово сохраняет оба смысловых поля. «Зло» формально прозрачно и оставляет открытым возможный смысл бедствия, назначенного нечестивому.
- issue: Расхождение еврейского заключительного оборота с греческим чтением о потопе
  choice: Следовать сохранившемуся еврейскому тексту в основном переводе
  alternative: «и из-за них произошёл потоп»
  rationale: При наличии еврейского свидетельства оно первично; существенно отличающееся греческое чтение сохранено в сноске.
- issue: Референт причинного оборота ובעבור
  choice: из-за него
  alternative: из-за них
  rationale: Русское единственное число согласовано с обобщённым רשע в еврейском тексте. Греческий параллельный текст понимает нечестивых во множественном числе, но это не требует изменения числа в основном переводе.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной речи. Сохранены обобщённое единственное число «нечестивый», широкое слово «зло» и необычная, смыслово напряжённая формулировка заключительной части. Маркер сноски поставлен после всего стиха, поскольку разночтение касается его заключительной части.
