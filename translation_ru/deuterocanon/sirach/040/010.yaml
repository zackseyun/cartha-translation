review_pass:
  verdict: revise
  source_fidelity: Основной текст следует еврейскому свидетельству в первой части и верно отмечает существенное греческое разночтение. Однако отрицание «не» и временной оборот «пока не» в заключительной части не выражены в сохранившемся еврейском тексте. Они интерпретируют крайне сжатую и трудную конструкцию תמוש כלה слишком определённо.
  naturalness: «Оно не отступит, пока не совершится до конца» звучит по-русски понятно, но «совершится» при референте «зло» стилистически и семантически неудачно; кроме того, такая формулировка создаёт не подтверждённое источником утверждение о его продолжении до завершения.
  terminology: «Нечестивый» уместно передаёт обобщённое רשע; «зло» сохраняет широту רעה. Для כלה предпочтительно «гибель/уничтожение» как возможное именное значение, а не развёртывание в «пока не совершится до конца».
  issues:
  - severity: high
    issue: Внесены отрицание и временное ограничение в заключительную часть.
    rationale: В еврейском тексте отсутствуют эквиваленты «не» и «пока». Конструкция תמוש כלה текстуально трудна, поэтому перевод не должен превращать её в однозначное «не отступит, пока не…».
  - severity: medium
    issue: Референт «оно» и глагол «совершится» неясны.
    rationale: В русском тексте «оно» формально относится к «злу», но «зло совершится» не является естественным выражением; более того, это не отражает возможного именного понимания כלה как «гибель, уничтожение».
  revised_text: Для нечестивого создано зло, и из-за него гибель отступит полностью.[a]
  revised_footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «и из-за них произошёл потоп». Здесь заключительная часть стиха существенно отличается от сохранившегося еврейского текста.'
    reason: alternative_reading
  revision_rationale: Перевод сохраняет обобщённое единственное число еврейского текста и широкое «зло» для רעה. В трудной заключительной конструкции передано значение תמוש («отступит, уйдёт») и возможное именное значение כלה («гибель»), без добавления отсутствующих в еврейском отрицания и временного союза. Греческое чтение о потопе остаётся в сноске как материально отличающаяся параллельная традиция.
