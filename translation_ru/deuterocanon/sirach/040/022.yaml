translation:
  language: ru
  text: Красота и облик радуют глаз[a], но лучше их обоих — растительность поля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово означает «облик, внешний вид»; в греческом параллельном тексте стоит «изящество». Поэтому возможно: «Красота и изящество радуют глаз».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «произрастания (или всходы) поля»; греческий параллельный текст говорит о зелени посева, то есть о свежей полевой растительности, а не о собранном урожае.'
    reason: alternative_reading
lexical_decisions:
- source_word: יפי
  choice: красота
  rationale: Прямое и естественное соответствие еврейскому существительному со значением красоты и привлекательности.
- source_word: ותאר
  choice: облик
  rationale: Передаёт обычное значение תאר — внешний вид, облик, форма — и сохраняет еврейскую пару близких, но не тождественных понятий. Греческое χάρις допускает альтернативу «изящество», отмеченную в сноске.
- source_word: יחמידו עין
  choice: радуют глаз
  rationale: Естественный русский оборот для того, что глаз находит желанным и приятным; сохраняет зрительную направленность выражения.
- source_word: ומשניהם
  choice: но лучше и того и другого
  rationale: Сравнительный смысл, явный в греческом ὑπὲρ ἀμφότερα, выражен по-русски прямо; союз «но» естественно вводит противопоставление.
- source_word: צמחי שדה
  choice: полевая поросль
  rationale: Передаёт множественное צמחי как растения, всходы или произрастания поля, не сужая смысл до собранного урожая; соответствует греческому образу свежей зелени посева.
