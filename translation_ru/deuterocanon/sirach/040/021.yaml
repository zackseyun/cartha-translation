  text: Flute and harp make song sweet[a], but better than both is a pure tongue.
translation:
  language: ru
  text: Свирель и арфа услаждают песню, но обеих превосходит чистая речь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «а приятная речь — лучше обеих»; возможно также: «сладкоречие».'
    reason: alternative_reading
lexical_decisions:
- source_word: חליל
  choice: свирель
  rationale: Обозначает духовой инструмент; «свирель» — естественный библейский эквивалент, не приписывающий древнему инструменту устройство современной поперечной флейты.
- source_word: נבל
  choice: арфа
  rationale: Щипковый струнный инструмент; «арфа» узнаваема современному читателю и соответствует устойчивому библейскому словоупотреблению.
- source_word: יעריבו
  choice: услаждают
  rationale: Передаёт значение «делать приятным, сладостным» и сохраняет каузативный оттенок формы в краткой поэтической строке.
- source_word: שיר
  choice: песню
  rationale: Прямое соответствие еврейскому существительному со значением песни или пения; греческое μέλη подтверждает музыкальный контекст.
- source_word: ומשניהם
  choice: но обеих превосходит
  rationale: Передаёт сравнительный смысл «выше/лучше их обеих» и естественно связывает две половины афоризма.
- source_word: לשון ברה
  choice: чистая речь
  rationale: לשון буквально значит «язык», но здесь метонимически обозначает речь; «чистая» следует сохранившемуся еврейскому ברה и передаёт его качественный или нравственный оттенок.
theological_decisions:
- issue: Расхождение еврейского и греческого в заключительной фразе
  choice: чистая речь
  alternative: приятная речь / сладкоречие
  rationale: Сохранившийся еврейский текст первичен и читает לשון ברה — «чистый язык/чистая речь». Греческое γλῶσσα ἡδεῖα передаёт иной оттенок — «приятная речь»; он сохранён в сноске без устранения текстовой неоднозначности.
translation_notes:
  register: Современный литературный русский с достоинством поэтического изречения. «Свирель» и «арфа» сохраняют древний музыкальный колорит; «чистая речь» звучит естественнее буквального «чистый язык» и ясно передаёт метонимию.
