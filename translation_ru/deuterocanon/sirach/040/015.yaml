  source_fidelity: 'Русский основной текст точно следует сохранившемуся еврейскому тексту: נוצר מחמס передано как «Порождение насилия», לא ינקה — судебно окрашенным «не останется безнаказанным», а единственные числа в «корень нечестивца» сохранены. Трудный образ על שן תלע не чрезмерно уточнён; «на остром утёсе» передаёт подтверждаемую греческой параллелью картину острой скалы, а буквальный компонент «зуб» честно пояснён в примечании.'
