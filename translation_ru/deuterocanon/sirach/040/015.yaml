  terminology: «Нечестивец» адекватно передаёт חנף в данном нравственно-религиозном контексте и не навязывает значение «лицемер». «Насилие» верно отражает חמס. Примечание a ясно разграничивает греческое альтернативное чтение и еврейский основной текст; оба маркера присутствуют и стоят у относящихся к ним мест.
