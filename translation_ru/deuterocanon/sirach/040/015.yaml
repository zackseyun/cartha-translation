base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/015.yaml
  text: The offspring of violence will not go unpunished[b][a], for the root of the godless is on a jagged crag.
translation:
  language: ru
  text: Порождение насилия не останется безнаказанным[a], ведь корень нечестивца — на остром утёсе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой версии: «Потомство нечестивых не умножит ветвей, и нечистые корни — на крутой скале». Она также использует образ порочного растения, но отличается от сохранившегося еврейского текста.'
    reason: alternative_reading
  - marker: b
    text: Конец еврейской строки труден для понимания. Буквально слово «зуб» вызывает образ острого скального выступа, то есть утёса или зубца скалы.
    reason: lexical_alternative
lexical_decisions:
- source_word: נוצר
  choice: порождение
  rationale: В данном контексте форма обозначает то, что произведено или возникло; греческое ἔκγονα подтверждает значение потомства или порождения. «Порождение» сохраняет возможную широту образа, не ограничивая его только биологическими потомками.
- source_word: מחמס
  choice: насилия
  rationale: חמס обозначает насилие, неправду или жестокое беззаконие. Выбрано прямое и сильное значение «насилие», соответствующее первичному еврейскому свидетельству.
- source_word: לא ינקה
  choice: не останется безнаказанным
  rationale: Отрицательная форма נקה обычно выражает мысль о том, что виновный не будет оправдан или освобождён от наказания. Русская формулировка естественно передаёт этот судебный оттенок.
- source_word: שרש
  choice: корень
  rationale: Еврейский текст употребляет единственное число; оно сохранено и поддерживает растительную метафору.
- source_word: חנף
  choice: нечестивца
  rationale: Слово обозначает безбожного, нечестивого или порочного человека. «Нечестивец» передаёт нравственно-религиозный смысл без сведения его к одному лишь лицемерию.
- source_word: על שן תלע
  choice: на остром утёсе
  rationale: Трудное выражение буквально включает שן, «зуб», метафорически — острый выступ скалы. Греческое ἐπ’ ἀκροτόμου πέτρας подтверждает образ крутой, резко обрывающейся скалы; «на остром утёсе» звучит естественно и сохраняет опасную неустойчивость образа.
theological_decisions:
- issue: Расхождение между сохранившимся еврейским текстом и греческой параллелью в первой строке
  choice: 'Основной текст следует еврейскому чтению: «Порождение насилия не останется безнаказанным».'
  alternative: «Потомство нечестивых не умножит ветвей».
  rationale: При наличии еврейского текста он является первичным. Греческая версия заметно отличается, хотя подтверждает общий образ порочного роста и потому приводится в примечании; различие не сглаживается.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. «Порождение» сохраняет образную широту, «не останется безнаказанным» ясно передаёт судебную идиому, а трудность заключительного скального образа отмечена без его догматического истолкования.
