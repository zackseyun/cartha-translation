  text: Wine and strong drink gladden the heart, but better than both is the love of lovers.
translation:
  language: ru
  text: 'Вино и хмельной напиток веселят сердце,

    но лучше и того и другого — любовь влюблённых.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «но лучше обоих — любовь к мудрости»; там также вместо «хмельного напитка» упомянута музыка.'
    reason: 'Греческая параллель содержит два существенных варианта: μουσικά («музыка») вместо שכר и ἀγάπησις σοφίας («любовь к мудрости») вместо אהבת דודים. Примечание сохраняет это разночтение, не смешивая его с основным переводом еврейского текста.'
lexical_decisions:
- source_word: יין
  choice: вино
  rationale: Прямое и естественное соответствие еврейскому слову.
- source_word: ושכר
  choice: и хмельной напиток
  rationale: שכר обозначает опьяняющий напиток, отличный от вина; «хмельной напиток» понятно современному читателю и не сужает значение до конкретного вида алкоголя.
- source_word: יעליצו לב
  choice: веселят сердце
  rationale: Передаёт каузативный смысл глагола עלץ и традиционную библейскую образность без архаического синтаксиса.
- source_word: ומשניהם
  choice: но больше обоих
  rationale: Сравнительное значение естественно в контексте; союз «но» ясно выражает противопоставление, подразумеваемое фразой.
- source_word: אהבת דודים
  choice: любовь влюблённых
  rationale: Сохраняет человеческий и взаимный любовный смысл еврейского דודים, не подменяя его греческим вариантом «любовь к мудрости».
theological_decisions:
- issue: Расхождение еврейского текста и греческой параллели в заключительной фразе
  choice: любовь влюблённых
  alternative: любовь к мудрости
  rationale: 'Перевод следует указанному высоконадёжному еврейскому источнику: אהבת דודים. Существенное разночтение греческой традиции сохраняется в примечании, а не вносится в основной текст.'
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим параллелизмом. Выражение «любовь влюблённых» намеренно сохраняет конкретный взаимный и романтический оттенок еврейского текста.
