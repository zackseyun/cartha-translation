base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/040/026.yaml
  text: Wealth and strength lift up the heart[a], and the fear of God is beyond both. In the fear of God there is no lack[b], and there is no need to seek support along with it.
translation:
  language: ru
  text: Богатство и сила возвышают сердце, а страх Божий превосходит и то и другое.[a] Страх Божий не знает недостатка, и вместе с ним не нужно искать опоры.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и от обоих»; по смыслу возможны также переводы: «больше обоих» или «лучше обоих».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и вместе с ним не нужно искать поддержки». Смысл в том, что страх Божий не требует добавочной опоры.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חיל
  choice: богатство
  rationale: В сочетании с כח слово обозначает материальное состояние или средства; это подтверждается греческим χρήματα.
- source_word: כח
  choice: сила
  rationale: Прямой и естественный эквивалент, соответствующий также греческому ἰσχύς.
- source_word: יגדלו לב
  choice: возвышают сердце
  rationale: Сохраняет образ возвышения сердца и не сводит его однозначно ни к уверенности, ни к гордости.
- source_word: ומשניהם
  choice: а страх Божий превосходит и то и другое
  rationale: 'Контекст требует сравнительного смысла: страх Божий стоит выше богатства и силы. Союз «а» естественно передаёт сопоставление, не превращая его в резкое противопоставление.'
- source_word: יראת אלהים
  choice: страх Божий
  rationale: Сохраняет традиционный библейский оборот и весь диапазон смысла — благоговение, трепет и послушание; אלהים передано как «Божий».
- source_word: מחסור
  choice: недостаток
  rationale: Близко передаёт отсутствие нужды или ущерба и соответствует греческому ἐλάττωσις.
- source_word: ואין לבקש עמה משען
  choice: и вместе с ним не нужно искать опоры
  rationale: Передаёт достаточность страха Божьего и образ משען как поддержки или опоры, не уточняя её вид.
theological_decisions:
- issue: Передача יראת אלהים
  choice: страх Божий
  alternative: благоговение перед Богом
  rationale: «Страх Божий» сохраняет вес центрального понятия литературы Премудрости и не устраняет напряжение между благоговением, трепетом и послушанием.
- issue: Достаточность страха Божьего в заключительной строке
  choice: вместе с ним не нужно искать опоры
  alternative: с ним не приходится искать помощи
  rationale: Формулировка следует образу еврейского текста и утверждает достаточность страха Божьего, не уточняя богословски природу возможной опоры.
translation_notes:
  register: Современный литературный русский язык с традиционным библейским выражением «страх Божий». Синтаксис сохраняет параллелизм еврейского текста; метафора сердца и неоднозначность её положительной либо отрицательной оценки не устранены.
