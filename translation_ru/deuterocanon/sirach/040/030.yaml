translation:
  language: ru
  text: Бесстыдному человеку[a] попрошайничество сладко[b], а в нём оно пылает, как огонь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «человеку, сильному духом (душой)»; греческий параллельный текст говорит: «в устах бесстыдного [человека]».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «просьба сладка». Греческий текст точнее указывает на выпрашивание подаяния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לאיש עוז נפש
  choice: бесстыдному человеку
  rationale: Буквальное еврейское выражение допускает смысл «человеку, сильному духом», однако в данном контексте עוז נפש указывает на дерзкую беззастенчивость; это подтверждается греческим ἀναιδοῦς — «бесстыдного, беззастенчивого». Буквальная возможность отмечена в сноске.
- source_word: תמתיק שאלה
  choice: попрошайничество сладко
  rationale: שאלה буквально связано с просьбой или прошением, а греческое ἐπαίτησις уточняет, что речь идёт о выпрашивании подаяния. «Попрошайничество сладко» сохраняет метафору сладости и социальный смысл.
- source_word: ובקרבו
  choice: но внутри у него
  rationale: קרב обозначает внутренность или внутреннее существо человека. Союз передан как «но», поскольку в изречении выражено смысловое противопоставление внешней сладости и внутреннего жжения.
- source_word: תבער כמו אש
  choice: оно пылает, как огонь
  rationale: Форма женского рода позволяет отнести действие к שאלה — просьбе или попрошайничеству. «Пылает» передаёт интенсивность בער, не разъясняя сверх текста природу внутреннего мучения.
theological_decisions:
- issue: Смысл трудного выражения לאיש עוז נפש
  choice: 'нравственная беззастенчивость: «бесстыдному человеку»'
  alternative: «человеку, сильному духом» или «дерзкому человеку»
  rationale: Еврейская формулировка неоднозначна, но отрицательный контекст предостережения о попрошайничестве и греческое ἀναιδοῦς поддерживают значение бесстыдной дерзости. Буквальный вариант сохранён в сноске, чтобы не скрывать неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский язык с краткой формой мудрого изречения. Слово «попрошайничество» прямо передаёт контекст и греческое уточнение; образ сладости и внутреннего огня сохранён без добавочного толкования.
