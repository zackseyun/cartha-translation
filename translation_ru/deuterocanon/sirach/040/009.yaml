  text: Pestilence and bloodshed, strife and the sword, devastation and ruin, calamity and death.
translation:
  language: ru
  text: Мор и кровопролитие, распря и меч, опустошение и разорение, бедствие и смерть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דבר
  choice: мор
  rationale: Обычное значение в перечне бедствий — повальная смертоносная болезнь; «мор» кратко и естественно передаёт этот смысл.
- source_word: דם
  choice: кровопролитие
  rationale: Буквально «кровь»; в ряду общественных бедствий слово метонимически обозначает пролитие крови.
- source_word: חרחר
  choice: распря
  rationale: Редкое слово допускает связь с разжиганием вражды; греческий параллельный текст ἔρις прямо поддерживает значение «распря».
- source_word: חרב
  choice: меч
  rationale: Прямой эквивалент; здесь также подразумевается вооружённое насилие, но образ оригинала сохранён.
- source_word: שד
  choice: опустошение
  rationale: Передаёт разорительное уничтожение и сохраняет краткую форму перечня.
- source_word: שבר
  choice: разорение
  rationale: В данном контексте означает сокрушение, крах или гибель; «разорение» естественно сочетается с «опустошением», не сливая два еврейских термина.
- source_word: רעה
  choice: бедствие
  rationale: Слово может означать «зло» или «несчастье»; в перечне напастей контекстуально уместно «бедствие».
- source_word: מות
  choice: смерть
  rationale: Прямой и однозначный эквивалент.
