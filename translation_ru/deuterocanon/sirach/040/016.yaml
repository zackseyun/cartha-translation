translation:
  language: ru
  text: Словно поросль на насаждениях у потока[a][b], перед всяким дождём они увядают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское כקרדמות имеет неясное значение. В греческом параллельном тексте изображена растительность у воды и на речном берегу, которую вырывают раньше всякой другой травы. Перевод «поросль» не предполагает точного определения растения.
    reason: lexical_alternative
  - marker: b
    text: Более древнее свидетельство из Масады, по-видимому, содержит здесь существенно иное чтение. Основной текст следует еврейским рукописям Каирской генизы, сохраняя указание на текстологическую неуверенность.
    reason: textual_variant
lexical_decisions:
- source_word: כקרדמות
  choice: словно поросль
  rationale: Редкое и неясное слово, по-видимому, обозначает невысокую дикую растительность. «Поросль» сохраняет образ непрочной растительности, не приписывая слову точного ботанического значения.
- source_word: על מטעי נחל
  choice: среди насаждений у потока
  rationale: מטעי означает «насаждения», а נחל — поток, русло или вади. Формулировка сохраняет как земледельческий образ, так и связь с водотоком.
- source_word: מפני כל מטר
  choice: от всякого дождя
  rationale: Предлог מפני может выражать нахождение перед чем-либо либо причину. Здесь причинное «от» естественно связывает дождь с исчезновением хрупкой поросли, хотя сам образ остается намеренно неожиданным.
- source_word: נדעכו
  choice: они увядают
  rationale: Глагол означает угасание, затухание или исчезновение. В образе растительности «увядают» передает смысл естественно, сохраняя идею угасания.
