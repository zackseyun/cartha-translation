translation:
  language: ru
  text: от восседающего на высоком престоле[a] до возвращающегося в прах и пепел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «от сидящего на престоле во славе до униженного в земле и пепле». Греческий текст прямо выражает идеи славы и унижения, которые в еврейском переданы короче.'
    reason: alternative_reading
lexical_decisions:
- source_word: מיושב
  choice: от восседающего
  rationale: Предлог מ обозначает исходную точку диапазона («от»), а причастие יושב — человека, занимающего место; «восседающего» естественно сочетается с престолом и передаёт высокий статус без добавления отсутствующих в еврейском тексте деталей.
- source_word: כסא
  choice: престоле
  rationale: כסא в данном контексте означает царский или почётный престол, что подтверждается греческим θρόνος.
- source_word: לגבה
  choice: высоком
  rationale: Слово указывает на высоту или возвышенность. «Высоком» сохраняет прямой пространственный смысл и допускает социальный оттенок возвышенного положения; греческое «в славе» вынесено в примечание как более развернутая передача.
- source_word: עד
  choice: до
  rationale: В конструкции «от… до…» עד обозначает противоположный предел охватываемого диапазона, а не только временное «пока».
- source_word: לשוב
  choice: возвращающегося
  rationale: Инфинитив с ל обозначает второй предел диапазона и сохраняет библейский образ возвращения человека в прах.
- source_word: עפר ואפר
  choice: прах и пепел
  rationale: Устойчивое и естественное русское сочетание, передающее смертность, бренность и унижение человека.
theological_decisions:
- issue: Соотношение еврейского текста и более развернутой греческой параллели
  choice: 'Основной текст следует краткой еврейской формулировке: «от восседающего на высоком престоле до возвращающегося в прах и пепел».'
  alternative: «от сидящего на престоле во славе до униженного в земле и пепле»
  rationale: Сохранившийся еврейский текст является первичным основанием перевода. Греческая параллель подтверждает общий контраст, но явно добавляет идеи славы и унижения; они отмечены в сноске, а не внесены в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Восседающий» оправдан царским контекстом слова «престол»; синтаксическая краткость оригинала сохранена.
