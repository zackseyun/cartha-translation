  text: Everything from the earth returns to the earth[a], and what is from above to what is above.
translation:
  language: ru
  text: Всё, что из земли, возвращается в землю[a], а то, что свыше, — к тому, что свыше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По греческому тексту: «а то, что из вод, возвращается в море».'
    reason: alternative_reading
lexical_decisions:
- source_word: כל
  choice: Всё, что
  rationale: Неограниченное собирательное значение подтверждается греческим πάντα ὅσα; формулировка не сужает смысл до людей.
- source_word: מארץ אל ארץ
  choice: из земли… в землю
  rationale: Сохраняет повтор слова «земля» и выражает движение от места происхождения обратно к нему.
- source_word: ישוב
  choice: возвращается
  rationale: Обычное значение שוב — «возвращаться, обращаться назад»; здесь оно естественно передаёт возврат к исходному месту.
- source_word: ואשר
  choice: а то, что
  rationale: Неличная относительная конструкция соответствует широкому, космическому параллелизму; союз «а» естественно вводит сопоставленный второй член.
- source_word: ממרום אל מרום
  choice: что свыше, — к тому, что свыше
  rationale: Передаёт повтор מרום и вертикальный образ, сохраняя загадочность еврейского текста и не уточняя его как «небо».
theological_decisions:
- issue: Расхождение еврейского второго полустишия с греческой традицией
  choice: 'Основным текстом передано еврейское чтение: «а то, что свыше, — к тому, что свыше»'
  alternative: 'Греческий текст: «а то, что из вод, возвращается в море»'
  rationale: Сохранившийся еврейский текст является первичным источником для перевода Сираха. Его краткость и неоднозначность сохранены, а существенно отличающееся греческое чтение приведено в сноске.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная. Эллиптичность и повтор второго полустишия сохранены без конфессионального истолкования.
