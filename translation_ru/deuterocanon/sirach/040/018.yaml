  text: Wine and strong drink sweeten life[a], but better than both is finding a treasure.
translation:
  language: ru
  text: Вино и крепкий напиток услаждают жизнь, но нахождение сокровища лучше и того и другого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Вино и крепкий напиток услаждают жизнь, а выше обоих — нахождение сокровища». Еврейская форма может также обозначать «того, кто находит сокровище». Греческий параллельный текст поддерживает сравнительный смысл: «выше обоих».'
    reason: Сноска поясняет сравнительное значение ומשניהם и сохраняет возможную личную передачу формы מוצא.
lexical_decisions:
- source_word: חיי
  choice: жизнь
  rationale: Форма связана со словом «жизнь»; в сочетании со сказуемым от מתק естественный русский перевод передаёт смысл как воздействие вина и хмельного напитка на жизнь, не заменяя образ другим.
- source_word: יין
  choice: вино
  rationale: Обычное и точное соответствие еврейскому названию вина.
- source_word: ושכר
  choice: и хмельной напиток
  rationale: שכר обозначает опьяняющий напиток, отличный от вина. «Крепкий напиток» мог бы ошибочно подразумевать дистиллированный алкоголь, поэтому выбран более широкий исторически нейтральный оборот.
- source_word: ימתקו
  choice: делают … приятнее
  rationale: Глагол מתק буквально связан со сладостью; применительно к жизни естественный русский эквивалент передаёт значение «услаждают, делают приятной». Сравнительная форма «приятнее» хорошо сочетается с последующим сопоставлением.
- source_word: ומשניהם
  choice: но … лучше и того и другого
  rationale: Предлог допускает буквальное понимание «от/из обоих» или «сверх обоих»; греческое ὑπὲρ ἀμφότερα подтверждает сравнительный смысл. Союз «но» естественно обозначает противопоставление.
- source_word: מוצא
  choice: найти
  rationale: Причастная или субстантивированная форма означает нахождение либо находящего. Инфинитив по-русски кратко и естественно выражает действие в сравнительной конструкции.
- source_word: אוצר
  choice: сокровище
  rationale: В контексте речь идёт о ценном сокровище, что также подтверждается греческим θησαυρόν; значение «хранилище» здесь менее вероятно.
