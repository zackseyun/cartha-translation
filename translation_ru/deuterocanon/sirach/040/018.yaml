translation_notes:
  register: Современный литературный русский язык; фраза краткая, афористичная и понятная. «Хмельной напиток» избегает анахроничной ассоциации «крепкого напитка» с дистиллированным алкоголем. Тире подчёркивает итоговое сравнение.
