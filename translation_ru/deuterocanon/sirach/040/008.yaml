translation:
  language: ru
  text: Всякую плоть сопровождает тревога, а её богатство лишает её сна[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «со всякой плотью, от человека до скота, а на грешников — всемеро больше этого». Этой более пространной формулировки нет в использованной здесь сохранившейся еврейской строке.'
    reason: alternative_reading
lexical_decisions:
- source_word: ועם כל בשר
  choice: Со всякой плотью
  rationale: Сохраняется собирательный библейский образ «всякой плоти», обозначающий живых существ в их телесном существовании. Предлог עם передан как «с».
- source_word: דאגתם עמם
  choice: пребывает её тревога
  rationale: דאגה означает тревогу, беспокойство; עמם буквально выражает нахождение «с ними». Глагол «пребывает» естественно восполняет подразумеваемую связку и передаёт мысль о тревоге как постоянной спутнице.
- source_word: ועשרם
  choice: а её богатство
  rationale: עֹשֶׁר прямо обозначает богатство или достаток. В русском согласование в единственном числе соответствует собирательному выражению «всякая плоть».
- source_word: מניד שנתם
  choice: прогоняет сон
  rationale: Форма от נוד/ניד передаёт причинение движения или лишение покоя; применительно ко сну образно означает, что богатство отгоняет сон.
- source_word: ἐπὶ ἁμαρτωλῶν ἑπταπλάσια πρὸς ταῦτα
  choice: не включено в основной текст
  rationale: Греческое свидетельство содержит дополнительное указание на семикратные бедствия грешников, которого нет в сохранившейся еврейской строке; оно приведено в примечании.
theological_decisions:
- issue: Краткое еврейское чтение и более пространное греческое
  choice: Основной текст следует сохранившемуся еврейскому чтению; расширение греческого текста вынесено в примечание.
  alternative: 'Включить в стих греческое продолжение: «от человека до скота, а на грешников — всемеро больше этого».'
  rationale: При наличии еврейского текста Сираха он служит основным свидетельством. Греческое чтение существенно для истории текста, но его дополнительная формулировка не должна молча включаться в основной текст.
translation_notes:
  register: Современный литературный русский язык с сохранением традиционного и понятного библейского выражения «всякая плоть». Синтаксис слегка возвышенный, но прозрачный; образ богатства, прогоняющего сон, сохранён без поясняющего истолкования.
