  text: Kindness will never be shaken[b][a], and righteousness will stand forever.
translation:
  language: ru
  text: Доброта никогда не поколеблется[a][b], и праведность утвердится навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая параллель: «Благодать — словно рай среди благословений, и милостыня пребудет вовек». Еврейский текст вместо этого говорит о «доброте» и «праведности».'
    reason: alternative_reading
  - marker: b
    text: В Масаде сохранился иной еврейский вариант этого места, отличающийся от текста Каирской генизы; однако дошедший фрагмент здесь слишком неполон, чтобы на его основании уверенно изменить перевод всего стиха.
    reason: textual_variant
lexical_decisions:
- source_word: וחסד
  choice: Доброта
  rationale: חסד может означать доброту, милость и верную любовь. В данном изречении явного заветного контекста нет, поэтому «доброта» ясно и естественно передаёт нравственную добродетель, не сужая значение до милостыни.
- source_word: לעולם לא ימוט
  choice: никогда не поколеблется
  rationale: Глагол מוט обозначает утрату устойчивости — колебание, шатание или смещение. Такой перевод сохраняет образ незыблемости и звучит естественно по-русски.
- source_word: וצדקה
  choice: и праведность
  rationale: צדקה означает праведность или справедливость, а в более позднем употреблении может относиться и к благотворительности. Поскольку сохранившийся еврейский текст прямо читает צדקה, в основном тексте выбрано «праведность»; отличающееся греческое чтение отмечено в сноске.
- source_word: לעד תכון
  choice: утвердится навеки
  rationale: Форма от כון выражает утверждённость, прочность и устойчивость. «Утвердится навеки» сохраняет этот смысл и параллелизм с первым полустишием.
theological_decisions:
- issue: Расхождение между еврейским текстом Каирской генизы и греческой параллелью
  choice: 'В основном тексте: «праведность утвердится навеки»'
  alternative: 'Греческая традиция: «милостыня пребудет вовек»'
  rationale: При наличии надёжно засвидетельствованного еврейского текста предпочтение отдаётся ему. Греческая версия отражает существенное текстовое или толковательное расхождение, поэтому она приведена в сноске, а не внесена в основной текст.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура и параллелизм еврейского оригинала сохранены. Лексика понятна широкому читателю и не привязана к конфессиональной терминологии.
