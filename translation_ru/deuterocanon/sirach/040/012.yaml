  text: Every gift and injustice will be wiped away[b][a], but faith will stand forever.
translation:
  language: ru
  text: Всякий дар[b] и всякая несправедливость будут изглажены, а вера[a] устоит навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верность устоит навеки». Греческое слово πίστις может означать как веру, так и верность.'
    reason: alternative_reading
  - marker: b
    text: В древнем еврейском свидетельстве из Масады, по-видимому, отражено чтение, связанное со словом «заём», тогда как греческий текст имеет «дар». Основной текст следует греческому чтению.
    reason: textual_variant
lexical_decisions:
- source_word: πᾶν
  choice: всякий / всякая
  rationale: Распределительное значение передано с повтором местоимения, естественным для русского языка при существительных разного рода.
- source_word: δῶρον
  choice: дар
  rationale: Прямое и широкое соответствие греческому δῶρον; варианты «подношение» и «взятка» без достаточного контекстуального основания сужают смысл.
- source_word: ἀδικία
  choice: несправедливость
  rationale: Передаёт нравственный и общественный смысл слова, не ограничивая его только отдельным проступком.
- source_word: ἐξαλειφθήσεται
  choice: будут изглажены
  rationale: Сохраняет образ стирания и полного устранения; множественное число требуется нормами русского согласования при однородных подлежащих.
- source_word: πίστις
  choice: вера
  rationale: Основное соответствие термину πίστις; возможное в данном контексте значение «верность» вынесено в примечание, чтобы сохранить смысловую неоднозначность.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Естественно передаёт устойчивое выражение со значением непреходящей длительности.
- source_word: στήσεται
  choice: устоит
  rationale: Сохраняет метафору стойкости и вместе с тем ясно выражает продолжительное существование.
theological_decisions:
- issue: Значение πίστις
  choice: вера
  alternative: верность; доверие
  rationale: Греческое слово допускает значения «вера» и «верность». Основной текст сохраняет традиционно широкое «вера», а контекстуально вероятное «верность» отмечено в сноске без устранения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Формулировка сохраняет параллелизм, образ изглаживания и метафору того, что вера «устоит».
