  yaml_path: translation/deuterocanon/sirach/023/003.yaml
  text: so that my ignorances may not multiply[a], and my sins may not increase, and I may fall before my adversaries[b], and my enemy may rejoice over me.
translation:
  language: ru
  text: чтобы не умножались мои заблуждения[a], не возрастали мои грехи, чтобы я не пал перед противниками и мой враг не злорадствовал надо мной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ошибки», «поступки по неведению». Греческое слово отличается от слова «грехи» в следующей части стиха.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «не радовался бы моей беде» или «не торжествовал бы надо мной»; речь идёт о враждебной радости врага.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως μὴ
  choice: чтобы не
  rationale: Передаёт зависимое от предыдущей просьбы значение цели и предотвращения нежелательного исхода; по-русски естественнее, чем отдельное «дабы».
- source_word: μὴ πληθύνωσιν
  choice: не умножались
  rationale: Сохраняет образ увеличения числа и согласуется с множественным числом подлежащего.
- source_word: αἱ ἄγνοιαι μου
  choice: мои заблуждения
  rationale: Ἄγνοια может обозначать незнание или ошибку, вызванную незнанием. «Заблуждения» естественно звучит во множественном числе и не отождествляет их прямо с последующими «грехами».
- source_word: αἱ ἁμαρτίαι μου
  choice: мои грехи
  rationale: Обычный и богословски весомый эквивалент ἁμαρτίαι, сохраняющий отличие от ἄγνοιαι.
- source_word: πλεονάσωσιν
  choice: не возрастали
  rationale: Передаёт увеличение или умножение, избегая стилистического повтора «умножались».
- source_word: πεσοῦμαι
  choice: чтобы я не пал
  rationale: Прямо передаёт образ падения и в русском зависимом предложении естественно выражает предотвращаемое следствие.
- source_word: ἔναντι τῶν ὑπεναντίων
  choice: перед моими противниками
  rationale: Ἔναντι означает «перед, в присутствии», а ὑπεναντίων — тех, кто противостоит; множественное число сохранено.
- source_word: ἐπιχαρεῖταί μοι
  choice: не злорадствовал надо мной
  rationale: Глагол обозначает радость по поводу чужой беды или враждебное торжество; «злорадствовать» точно и естественно выражает эту контекстуально явную окраску.
- source_word: ὁ ἐχθρός μου
  choice: мой враг
  rationale: Сохраняет единственное число греческого текста после множественного «противниками».
theological_decisions:
- issue: Различие между ἄγνοιαι и ἁμαρτίαι
  choice: Передать как «заблуждения» и «грехи»
  alternative: «грехи по неведению» и «грехи» либо «неведение» и «грехи»
  rationale: Греческий текст различает эти понятия, но не требует понимать ἄγνοιαι как техническое обозначение грехов по неведению. Выбранная пара сохраняет различие без внесения дополнительного толкования.
- issue: Враждебная окраска ἐπιχαρεῖταί μοι
  choice: «злорадствовал надо мной»
  alternative: «радовался обо мне/надо мной» или «торжествовал надо мной»
  rationale: В сочетании с «мой враг» речь идёт не о нейтральной радости, а о злой радости из-за падения говорящего. Русское «злорадствовать» компактно передаёт этот оттенок.
- issue: Связь цепочки нежелательных последствий после ὅπως μή
  choice: Повторить «чтобы ... не» перед «пал»
  alternative: Соединить все части одним начальным «чтобы не»
  rationale: Повтор делает русскую синтаксическую структуру ясной и сохраняет общий характер молитвы о предотвращении умножения заблуждений, грехов, падения и торжества врага.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. «Пал» сохраняет библейскую образность без архаизации; «злорадствовал» естественно передаёт враждебную радость. Все примечания отмечены в основном тексте.
