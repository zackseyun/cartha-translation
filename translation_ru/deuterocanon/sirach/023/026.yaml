translation:
  language: ru
  text: Она оставит после себя память, которая станет проклятием, и её позор не будет изглажен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλείψει
  choice: оставит по себе
  rationale: Будущее время от καταλείπω; здесь речь о том, что останется после неё. Оборот «оставит по себе» естественно передаёт посмертное или долговременное наследие памяти.
- source_word: εἰς κατάραν
  choice: ставшую проклятием
  rationale: 'εἰς с винительным указывает на результат: память о ней станет проклятием. Такая формулировка ясно передаёт значение, не воспроизводя неестественную для русского языка конструкцию «в проклятие».'
- source_word: τὸ μνημόσυνον αὐτῆς
  choice: память
  rationale: μνημόσυνον здесь означает сохраняющееся воспоминание или память о человеке, а не материальный памятник.
- source_word: τὸ ὄνειδος αὐτῆς
  choice: её позор
  rationale: ὄνειδος обозначает бесчестье, поношение или общественный позор. «Позор» кратко и естественно сохраняет как личный, так и публичный оттенок.
- source_word: οὐκ ἐξαλειφθήσεται
  choice: не будет изглажен
  rationale: Будущее страдательного залога от ἐξαλείφω. «Изглажен» сохраняет образ стирания и в сочетании с «позором» звучит литературно и понятно.
theological_decisions:
- issue: Нравственные последствия применительно к женщине, совершившей прелюбодеяние в контексте
  choice: Сохранить суровое утверждение о долговечной позорной памяти без смягчения и добавочных пояснений.
  alternative: Свести смысл к общей дурной репутации либо добавить прямое утверждение о Божьем суде.
  rationale: Греческий текст говорит о памяти, проклятии и неизгладимом позоре, но в этом предложении прямо не уточняет источник суда и не развивает богословское объяснение.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной литературы. Синтаксис сохраняет параллелизм двух частей; формулировка ясна обычному читателю и не содержит конфессиональных добавлений.
