base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/007.yaml
  text: Hear instruction of the mouth[a], children[b], and the one who keeps it will certainly not be caught.
translation:
  language: ru
  text: Послушайте наставление о речи[a], дети, и тот, кто соблюдает его, ни в коем случае не будет пойман[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наставление уст»; возможно также: «наставление для уст». Греческое выражение кратко и может обозначать наставление, регулирующее речь.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст содержит усиленное отрицание: «никогда не будет пойман» или «никак не будет схвачен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Παιδείαν στόματος
  choice: наставление о речи
  rationale: Буквально сочетание означает «наставление уст»; по-русски «наставление о речи» естественно передаёт обучение, относящееся к употреблению уст, не сводя παιδεία только к наказанию или дисциплине.
- source_word: ἀκούσατε
  choice: послушайте
  rationale: Аористный императив призывает внимательно воспринять наставление. «Послушайте» естественно в современном русском и не добавляет прямо выраженного требования повиноваться.
- source_word: τέκνα
  choice: дети
  rationale: Форма обращения во множественном числе не ограничена мужским полом; притяжательное «мои» в греческом отсутствует.
- source_word: ὁ φυλάσσων
  choice: тот, кто соблюдает его
  rationale: φυλάσσω может означать хранить, оберегать или соблюдать. Здесь речь о следовании наставлению; местоимение «его» восполняет подразумеваемый объект и отсылает к наставлению.
- source_word: οὐ μὴ
  choice: ни в коем случае не
  rationale: Сочетание οὐ μή выражает усиленное отрицание; выбранный оборот сохраняет эту силу без ослабления до простого «не».
- source_word: ἁλῷ
  choice: будет пойман
  rationale: Форма от ἁλίσκομαι означает «быть пойманным, схваченным». Такой перевод сохраняет широкий образ и не сужает его до юридического «будет уличён».
theological_decisions:
- issue: Подразумеваемое дополнение при φυλάσσων
  choice: Добавлено «его», относящееся к наставлению о речи.
  alternative: 'Оставить дополнение невыраженным: «тот, кто соблюдает».'
  rationale: В русском языке глагол «соблюдает» обычно требует дополнения; ближайший и грамматически подходящий антецедент — «наставление».
- issue: Смысл заключительного предостережения
  choice: 'Сохранён общий образ: «не будет пойман».'
  alternative: 'Конкретизировать юридически: «не будет уличён»; либо образно: «не попадёт в ловушку».'
  rationale: Греческий глагол допускает широкий смысл поимки. Контекст речи может подразумевать как обнаружение проступка, так и попадание в последствия собственных слов, поэтому конкретизация не внесена.
translation_notes:
  register: Современный литературный русский с умеренно торжественным тоном мудростного наставления. Обращение «дети» сохранено без добавления «мои»; компактность оригинала передана без конфессиональной конкретизации.
