  verdict: revise
  source_fidelity: Первая фраза в черновике передаёт вероятный контекстуальный смысл καταλειφθήσεται («будет пойман/погублен»), однако «попадётся на собственных устах» не является естественным русским выражением и создаёт неясный образ. ἐν τοῖς χείλεσιν αὐτοῦ и ἐν αὐτοῖς относятся к речи через образ уст; в русском естественнее передать этот образ как «словами», не меняя смысла. Связь второго ἐν αὐτοῖς с теми же словами следует выразить инструментально-причинно, а не физическим «о них».
  naturalness: «Собственными словами» и «из-за них» звучат естественно в современном литературном русском и сохраняют афористический регистр. Согласованная пара «злословящий и гордец» более плавна без повторного союза после запятой.
  terminology: «Грешник», «злословящий» и «гордец» адекватно передают ἁμαρτωλός, λοίδορος и ὑπερήφανος. «Споткнутся» сохраняет метафору σκανδαλισθήσονται. В сноске необходимо точнее отметить лексическую альтернативу καταλειφθήσεται, не выдавая контекстуальное «будет пойман» за буквальное значение.
