lexical_decisions:
- source_word: ἐν τοῖς χείλεσιν αὐτοῦ
  choice: на собственных устах
  rationale: Предлог ἐν допускает местный и инструментальный оттенки. Русское выражение сохраняет конкретный образ уст и показывает, что причиной падения становится собственная речь грешника.
- source_word: καταλειφθήσεται
  choice: попадётся
  rationale: Буквально глагол обычно означает «будет оставлен» или «будет покинут», однако параллель со «споткнутся» указывает здесь на то, что человек окажется пойман или погублен собственной речью. Более буквальная возможность отмечена в сноске.
- source_word: ἁμαρτωλός
  choice: грешник
  rationale: Субстантивированное прилагательное в единственном числе обозначает грешного человека как обобщённый тип, что естественно передаётся словом «грешник».
- source_word: λοίδορος
  choice: злословящий
  rationale: Слово обозначает человека, который бранит и оскорбляет других. Причастная форма понятна современному читателю и сохраняет акцент на порочной речи.
- source_word: ὑπερήφανος
  choice: гордец
  rationale: Существительное «гордец» естественно передаёт человека, отличающегося высокомерием и гордостью, и хорошо соответствует параллельному обозначению лица.
- source_word: σκανδαλισθήσονται
  choice: споткнутся
  rationale: Перевод сохраняет метафору препятствия и падения, не придавая слову более позднего узкотехнического богословского смысла.
- source_word: ἐν αὐτοῖς
  choice: о них
  rationale: Местоимение относится к устам; выражение «споткнутся о них» естественно продолжает метафору и сохраняет формальную неоднозначность между устами и произносимыми ими словами.
