base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/017.yaml
  text: To a promiscuous man every bread is sweet[b][a]; he will not stop until he comes to his end.
translation:
  language: ru
  text: Распутному человеку всякий хлеб сладок[a]; он не остановится, пока не придёт к своему концу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякий вид хлеба сладок». Вероятно, этот образ говорит о неразборчивом влечении, а не только о хлебе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока не умрёт». Греческое выражение может прямо указывать на смерть, но также допускает более широкий смысл окончательной гибели.'
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνῳ
  choice: распутному
  rationale: Передаёт привычное сексуально безнравственное поведение, не сужая значение до проституции; естественно звучит в современном русском.
- source_word: πᾶς ἄρτος
  choice: всякий хлеб
  rationale: Сохраняет буквальный образ хлеба и его притчевую многозначность, не подменяя метафору явным указанием на партнёров или наслаждение.
- source_word: ἡδύς
  choice: сладок
  rationale: Сохраняет вкусовой образ, связанный с хлебом, и нравственную иронию высказывания.
- source_word: οὐ μὴ κοπάσῃ
  choice: он не остановится
  rationale: Сильное греческое отрицание передано ясно и естественно; κοπάζω здесь означает прекращение или утихание действия.
- source_word: ἕως ἂν τελευτήσῃ
  choice: пока не придёт к своему концу
  rationale: Передаёт как возможное указание на смерть, так и более широкий смысл окончательной гибели или краха, не устраняя неоднозначность.
theological_decisions:
- issue: Следует ли раскрыть образ хлеба как неразборчивый сексуальный аппетит
  choice: 'Сохранить в основном тексте образ: «всякий хлеб сладок».'
  alternative: «ему желанна всякая женщина» или «всякая пища сладка»
  rationale: Греческий текст использует именно образ хлеба; прямое раскрытие сексуального референта внесло бы в перевод больше, чем сказано, тогда как контекст уже указывает на распутство.
- issue: Следует ли передать τελευτήσῃ исключительно как смерть
  choice: 'Передать шире: «придёт к своему концу».'
  alternative: «пока не умрёт»
  rationale: Глагол может прямо обозначать смерть, однако допускает и более широкий смысл завершения или окончательной гибели; выбранный вариант сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. «Распутному» понятно обычному читателю и соответствует контексту половой безнравственности; метафора хлеба и неоднозначность конца сохранены.
