  yaml_path: translation/deuterocanon/sirach/023/012.yaml
  text: There is a word wrapped in death; may it not be found in the inheritance of Jacob. For all these things will depart from the godly, and they will not wallow in sins.
translation:
  language: ru
  text: Есть речь, окутанная смертью[a]; да не найдётся она в наследии Иакова. Ведь всё это удалится от благочестивых, и они не станут погрязать в грехах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «облечённая смертью» или «окружённая смертью». В греческом тексте речь образно представлена как покрытая смертью со всех сторон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέξις
  choice: речь
  rationale: В данном контексте слово обозначает произнесённое выражение или род речи. «Речь» естественнее русского «слово» передаёт связь с речевыми грехами, сохраняя единственное число греческого текста.
- source_word: ἀντιπεριβεβλημένη
  choice: облечённая
  rationale: Причастие создаёт образ чего-либо, со всех сторон покрытого или окутанного. «Облечённая смертью» сохраняет метафору и звучит достойно и естественно.
- source_word: θανάτῳ
  choice: смертью
  rationale: Творительный падеж естественно передаёт греческий дательный при причастии и сохраняет образ речи, несущей на себе смерть.
- source_word: μὴ εὑρεθήτω
  choice: да не встретится она
  rationale: Оборот с «да не» передаёт запретительно-пожелательную силу греческого императива третьего лица. «Встретится» в русском здесь естественнее буквального «будет найдена».
- source_word: ἐν κληρονομίᾳ Ἰακώβ
  choice: в наследии Иакова
  rationale: Буквальное и понятное выражение сохраняет заветное и общинное обозначение, не уточняя богословски его объём.
- source_word: εὐσεβῶν
  choice: благочестивых
  rationale: Слово обозначает людей, почитающих Бога и живущих благоговейно; «благочестивые» — устойчивое и достойное русское соответствие без отрицательного оттенка.
- source_word: ταῦτα πάντα
  choice: всё это
  rationale: Собирательное русское выражение естественно отсылает ко всем упомянутым видам греховной речи и соответствует согласованию греческого среднего множественного с глаголом в единственном числе.
- source_word: ἀποστήσεται
  choice: удалится
  rationale: Передаёт значение отделения и отступления, сохраняя «всё это» подлежащим, как в греческом тексте.
- source_word: ἐγκυλισθήσονται
  choice: не станут погрязать
  rationale: Глагол рисует образ катания или валяния в чём-либо. «Погрязать» сохраняет сильный образ нравственного погружения, но звучит естественнее и достойнее буквального «валяться».
- source_word: ἐν ἁμαρτίαις
  choice: в грехах
  rationale: Сохранено множественное число, указывающее на конкретные греховные поступки и привычки.
theological_decisions:
- issue: Кого обозначает «наследие Иакова»
  choice: Сохранено заветное общинное обозначение «наследие Иакова» без поясняющего расширения.
  alternative: Истолковать выражение как исключительно этнический Израиль либо как метафорическое название всех праведных.
  rationale: Греческая формулировка сама не разрешает вопрос о точном объёме обозначаемого сообщества; буквальная передача сохраняет эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конструкция «да не» сохраняет пожелательно-запретительный тон, а «погрязать» передаёт резкий греческий образ без разговорного оттенка.
