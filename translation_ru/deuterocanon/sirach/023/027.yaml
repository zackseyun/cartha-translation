base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/027.yaml
  text: And those who are left behind will know that nothing is better than the fear of the Lord, and nothing is sweeter than paying attention to the commandments of the Lord.
translation:
  language: ru
  text: И оставшиеся[a] узнают, что нет ничего лучше страха Господня и нет ничего слаще, чем внимать заповедям Господа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кто был оставлен»; возможно также: «уцелевшие». Греческий текст буквально говорит о тех, кто был оставлен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «быть внимательным к заповедям Господа», «слушаться заповедей Господа». Греческий глагол выражает внимательное и отзывчивое отношение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνώσονται
  choice: узнают
  rationale: Будущая форма ἐπιγινώσκω обозначает узнавание или достижение ясного понимания. «Узнают» естественно передаёт это значение, не усиливая его до полного познания.
- source_word: οἱ καταλειφθέντες
  choice: оставшиеся
  rationale: Субстантивированное страдательное причастие буквально обозначает тех, кто был оставлен. «Оставшиеся» сохраняет эту неопределённость и не уточняет без достаточных оснований, что речь именно о выживших или об остатке.
- source_word: οὐδὲν κρεῖττον
  choice: нет ничего лучше
  rationale: Естественная русская сравнительная конструкция, сохраняющая абсолютный смысл греческого выражения.
- source_word: φόβου Κυρίου
  choice: страха Господня
  rationale: 'Сохраняет устойчивое библейское выражение и его широкое смысловое поле: страх, благоговение и послушное отношение к Господу.'
- source_word: γλυκύτερον
  choice: слаще
  rationale: Сохраняет буквальную метафору сладости и поэтический параллелизм изречения.
- source_word: τοῦ προσέχειν
  choice: чем внимать
  rationale: «Внимать» кратко и естественно передаёт направленное, отзывчивое внимание, подразумеваемое προσέχειν, и соответствует возвышенному, но понятному регистру книги.
- source_word: ἐντολαῖς Κυρίου
  choice: заповедям Господа
  rationale: «Заповеди» — точный и узнаваемый библейский эквивалент ἐντολαί; форма «Господа» сохраняет явный генитив исходного текста.
theological_decisions:
- issue: Смысл выражения «страх Господень» в литературе мудрости
  choice: Сохранить традиционное выражение «страх Господень».
  alternative: «благоговение перед Господом» или «трепет перед Господом»
  rationale: Греческое выражение обладает богословской ёмкостью и включает благоговение, трепет и послушание. Парафраз сузил бы его смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены параллелизм двух сравнительных конструкций и метафора сладости; неоднозначность обозначения «оставшихся» не устранена.
