  text: So also a woman who leaves her husband and presents an heir by another man;[a]
translation:
  language: ru
  text: Так и женщина, оставившая мужа и представляющая наследника от другого мужчины.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от чужого». Греческое ἐξ ἀλλοτρίου означает происхождение от того, кто не является мужем этой женщины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: Так и
  rationale: Сохраняет сравнительно-связующую функцию выражения и естественно продолжает предшествующую мысль.
- source_word: γυνὴ
  choice: женщина
  rationale: Передаёт γυνή без преждевременного сужения до значения «жена»; брачный статус уже выражен словами «мужа».
- source_word: καταλιποῦσα
  choice: оставившая
  rationale: Точно передаёт аористное причастие и не усиливает его дополнительной оценочностью слова «бросившая».
- source_word: τὸν ἄνδρα
  choice: мужа
  rationale: В данном брачном контексте ἀνήρ означает супруга; русское притяжательное местоимение не требуется.
- source_word: παριστῶσα
  choice: представляющая ему
  rationale: Сохраняет смысл «предъявлять, представлять» в семейно-правовом контексте; «ему» естественно обозначает мужа как того, чьим наследником выдаётся ребёнок, не заменяя глагол более толковательным «рождающая».
- source_word: κληρονόμον
  choice: наследника
  rationale: Прямой и обычный эквивалент существительного со значением лица, получающего наследство.
- source_word: ἐξ ἀλλοτρίου
  choice: от другого мужчины
  rationale: Предлог ἐξ указывает на происхождение, а субстантивированное ἀλλοτρίου — на мужчину вне брака; формулировка ясна по-русски и сохраняет оттенок происхождения.
theological_decisions:
- issue: Нравственно-правовой смысл прелюбодеяния и появления наследника не от мужа
  choice: Описать поступок прямо, не добавляя наименований «прелюбодейка» или «незаконный наследник».
  alternative: «Так и жена, бросившая мужа и родившая наследника от чужого».
  rationale: Греческий текст называет действия и происхождение наследника, но не употребляет в этом стихе оценочного существительного; перевод не должен усиливать формулировку источника.
- issue: Кому женщина представляет наследника
  choice: Добавить «ему» как естественно подразумеваемое указание на оставленного мужа.
  alternative: «представляющая наследника от другого мужчины» без косвенного дополнения.
  rationale: παριστῶσα имеет переходно-презентативный смысл, а брачно-наследственный контекст предполагает представление ребёнка мужу или его дому. Добавление проясняет русскую фразу, не меняя её предметного смысла.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной и слегка формальной библейской интонацией. Причастные формы сохраняют структуру греческого изречения; лексика избегает как архаизма «чужеложница», так и разговорной резкости.
