  text: Her children will not take root[a], and her branches will not bear fruit;
translation:
  language: ru
  text: Её дети не пустят корней[a], и ветви её не принесут плода.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не распространятся в корень»; это сжатый растительный образ, означающий, что они не укоренятся.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ διαδώσουσιν τὰ τέκνα αὐτῆς εἰς ῥίζαν
  choice: Её дети не пустят корней
  rationale: Греческое выражение буквально передаёт распространение или разрастание «в корень», но по-русски естественный ботанический образ — «пустить корни». Множественное «корней» соответствует устойчивому русскому выражению и сохраняет связь с последующими ветвями и плодом.
- source_word: τὰ τέκνα αὐτῆς
  choice: её дети
  rationale: τέκνα прямо означает «дети» и в контексте также допускает смысл потомства; перевод не устраняет эту смысловую связь.
- source_word: οἱ κλάδοι αὐτῆς
  choice: ветви её
  rationale: κλάδοι — «ветви» или «побеги»; «ветви» ясно и естественно продолжает растительную метафору.
- source_word: οὐ δώσουσιν καρπόν
  choice: не принесут плода
  rationale: Хотя δίδωμι буквально означает «давать», русское идиоматическое выражение для плодоношения — «приносить плод».
theological_decisions:
- issue: Образ суда над женщиной и её потомством в контексте
  choice: Сохранить семейную и растительную образность, не разъясняя её как прямое утверждение о судьбе потомков.
  alternative: 'Передать явно: «её потомки не укоренятся и останутся бесплодными».'
  rationale: Греческий текст выражает последствие метафорически. Предлагаемый перевод сохраняет напряжение между буквальным упоминанием детей и образом растения, не добавляя отсутствующего в стихе толкования.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка. Инверсия «ветви её» поддерживает библейскую ритмику, не делая текст архаичным.
