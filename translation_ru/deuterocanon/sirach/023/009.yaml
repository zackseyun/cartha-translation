base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/009.yaml
  text: Do not accustom your mouth to an oath[a], and do not become accustomed to invoking the Holy One by name.
translation:
  language: ru
  text: Не приучай свои уста к клятвам и не привыкай призывать Святого по имени.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не привыкай употреблять святое имя». Греческое выражение ὀνομασίᾳ τοῦ ἁγίου может означать называние или призывание Святого либо употребление святого имени; в контексте имеется в виду непочтительное обращение с Божьим именем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκῳ
  choice: к клятвам
  rationale: Дательный падеж при ἐθίζω обозначает то, к чему приучают; русское множественное число естественно передаёт привычную практику, на которую направлено предостережение.
- source_word: μὴ ἐθίσῃς
  choice: Не приучай
  rationale: 'Сохраняет запрет и каузативный оттенок глагола: адресат не должен приучать к этому свои уста.'
- source_word: τὸ στόμα σου
  choice: свои уста
  rationale: Сохраняет телесный образ оригинала; «уста» уместны в современном литературном библейском регистре и не сводят выражение к абстрактной «речи».
- source_word: ὀνομασίᾳ
  choice: призывать … по имени
  rationale: Передаёт называние или обращение с употреблением имени и естественно сочетается с вероятным божественным референтом τοῦ ἁγίου.
- source_word: τοῦ ἁγίου
  choice: Святого
  rationale: Субстантивированное прилагательное, вероятнее всего, является благоговейным обозначением Бога; прописная буква отражает титульное употребление, не добавляя слова «Бог».
- source_word: μὴ συνεθισθῇς
  choice: не привыкай
  rationale: Естественно передаёт пассивно-инхоативный смысл — не становиться привыкшим, — и слегка отличает вторую формулировку от каузативного «не приучай» в первой части.
theological_decisions:
- issue: Референт выражения τοῦ ἁγίου
  choice: Передать как божественный титул «Святой»
  alternative: Понять метонимически как «святое имя» или более обобщённо как «святое»
  rationale: В контексте речи, клятв и употребления имени наиболее вероятно указание на Бога, однако конструкция допускает связь со святым именем; эта неоднозначность отмечена в сноске.
- issue: Объём запрета
  choice: Сохранить акцент на выработке привычки к клятвам и призыванию имени
  alternative: Сформулировать абсолютный запрет на любую клятву
  rationale: Повторяющиеся глаголы ἐθίζω и συνεθίζω говорят прежде всего о привыкании и постоянной практике; перевод не расширяет запрет сверх явного смысла греческого текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским словом «уста». Параллелизм двух запретов сохранён; формулировка остаётся понятной обычному читателю и не превращает предупреждение против привычной практики в более широкий догматический тезис.
