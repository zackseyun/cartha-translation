  text: A man transgressing from his bed says in his soul[a], “Who sees me?”
translation:
  language: ru
  text: 'Мужчина, нарушающий верность своему брачному ложу[a], говорит в душе своей: «Кто меня видит?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «преступающий (или отступающий) от своего ложа». В данном контексте это эвфемистическое указание на сексуальную неверность; «брачному» передаёт подразумеваемый контекст, не называя проступок прямо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: мужчина
  rationale: Существительное употреблено в единственном числе и в данном контексте обозначает конкретного представителя мужского пола, а не человечество вообще.
- source_word: παραβαίνων
  choice: отступающий
  rationale: Причастие передаёт идею нарушения границы, отступления или проступка. Выбор сохраняет нравственный смысл и при этом не превращает эвфемизм прямо в слово «прелюбодействующий».
- source_word: ἀπὸ τῆς κλίνης αὐτοῦ
  choice: от своего ложа
  rationale: κλίνη означает кровать или ложе. «Ложе» естественно сочетается с подразумеваемой супружеской неверностью и сохраняет образность исходного выражения, не раскрывая эвфемизм непосредственно в основном тексте.
- source_word: λέγων ἐν τῇ ψυχῇ αὐτοῦ
  choice: говорит в душе
  rationale: Формула обозначает внутреннюю речь. Такой перевод сохраняет прямое значение ψυχή и звучит понятно и достойно по-русски.
- source_word: Τίς με ὁρᾷ;
  choice: Кто меня видит?
  rationale: Прямой перевод вопроса в настоящем времени сохраняет уверенность говорящего в том, что его поступок скрыт.
theological_decisions:
- issue: Следует ли прямо назвать подразумеваемую сексуальную или супружескую неверность
  choice: Сохранить в основном тексте эвфемистическое выражение «отступающий от своего ложа»
  alternative: «изменяющий своему супружескому ложу» или «совершающий прелюбодеяние»
  rationale: Контекст убедительно указывает на сексуальную неверность, однако сама греческая фраза не употребляет прямого слова «прелюбодеяние». Эвфемизм сохранён, а его смысл разъяснён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Слово «ложе» сохраняет образ исходного текста; необычное сочетание «отступающий от своего ложа» намеренно удерживает его эвфемистическую неоднозначность и поясняется сноской.
