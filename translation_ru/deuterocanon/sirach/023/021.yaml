  yaml_path: translation/deuterocanon/sirach/023/021.yaml
  text: This man will be punished in the streets of the city[a], and where he did not suspect it[b], he will be caught.
translation:
  language: ru
  text: Этот человек будет наказан на улицах города[a] и будет схвачен там, где он этого не ожидал[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на городских площадях». Греческое выражение буквально указывает на широкие улицы или открытые места города, подчёркивая публичность происходящего.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «там, где он этого не подозревал»; «там, где он этого не предполагал».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτος
  choice: Этот человек
  rationale: Указательное местоимение отсылает к мужчине из ближайшего контекста; такой перевод сохраняет и анафорическую силу, и мужской род.
- source_word: ἐν πλατείαις πόλεως
  choice: на улицах города
  rationale: πλατεῖαι обозначает широкие улицы или открытые городские пространства. Выражение «на улицах города» естественно по-русски и сохраняет оттенок публичности.
- source_word: ἐκδικηθήσεται
  choice: будет наказан
  rationale: Пассивная форма здесь передаёт воздаяние или исполнение суда, а не обязательно личную месть.
- source_word: οὗ οὐχ ὑπενόησεν
  choice: там, где не ожидал
  rationale: ὑπονοέω может означать предполагать, подозревать или ожидать; в данном контексте речь о непредвиденном месте или обстоятельстве поимки.
- source_word: πιασθήσεται
  choice: будет схвачен
  rationale: Будущее страдательного залога указывает на поимку или захват; «схвачен» ясно передаёт это значение и сохраняет более сильный оттенок, чем разговорное «пойман».
theological_decisions:
- issue: К кому относятся формы мужского рода
  choice: Стих говорит именно об этом мужчине, поэтому сохранён мужской род.
  alternative: Обезличенное «этот человек» без дальнейшего выражения рода или нейтральная перефразировка.
  rationale: Греческий текст употребляет формы мужского рода, а ближайший контекст определяет конкретного референта; нейтрализация была бы неоправданной.
- issue: Смысл ἐκδικηθήσεται
  choice: 'Публичное наказание или справедливое воздаяние: «будет наказан».'
  alternative: «Ему отомстят» или «на нём будет совершено возмездие».
  rationale: Контекст допускает судебно-карательный смысл, но не требует вводить представление о личной мести или уточнять, кто именно наказывает.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и афористичная. Сохранены публичный характер наказания, внезапность поимки и параллельность двух будущих страдательных форм.
