    issue: «согрешила против своего мужа» для ἐπλημμέλησεν
    rationale: Формулировка естественна, но «согрешила» усиливает религиозно-нравственную окраску и может размывать специально сохранённое в оригинале различие между проступком против мужа и последующим прямо названным прелюбодеянием. «Совершила проступок против своего мужа» точнее передаёт общий характер глагола.
  - severity: low
    issue: «предавшись разврату» для ἐν πορνείᾳ
    rationale: Деепричастие делает «разврат» предшествующим или причинным действием. Греческий предлог ἐν обозначает обстоятельство/сферу; «в распутстве» ближе к нему и не добавляет временной связи.
