base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/023.yaml
  text: For first[a], she disobeyed the law of the Most High; and second, she committed an offense against her husband; and third, in sexual immorality she committed adultery and presented children from another man.
translation:
  language: ru
  text: Ибо, во-первых, она не повиновалась закону Всевышнего; во-вторых, совершила проступок против своего мужа; а в-третьих, в распутстве совершила прелюбодеяние и родила детей от другого мужчины.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «представила детей от другого мужчины»; по смыслу — родила детей, отцом которых был не её муж.'
    reason: Сохраняет для читателя буквальный оттенок παρέστησεν, одновременно поясняя естественный смысл выражения в контексте.
lexical_decisions:
- source_word: πρῶτον μὲν γὰρ ... καὶ δεύτερον ... καὶ τὸ τρίτον
  choice: Ибо, во-первых ... во-вторых ... а в-третьих
  rationale: Сохраняет причинное γάρ и явное трёхчастное перечисление, оставаясь естественным для современного русского языка.
- source_word: ἐν νόμῳ Ὑψίστου ἠπείθησεν
  choice: не повиновалась закону Всевышнего
  rationale: Передаёт ἀπειθέω как неповиновение установленному Божьему закону; «Всевышний» — традиционный и ясный перевод божественного титула Ὑψίστος без добавления слова «Бог».
- source_word: εἰς ἄνδρα ἑαυτῆς ἐπλημμέλησεν
  choice: согрешила против своего мужа
  rationale: Передаёт совершённую по отношению к мужу нравственную вину естественнее, чем буквальное «совершила проступок», но не подменяет её заранее конкретным обвинением в прелюбодеянии, названным далее.
- source_word: ἐν πορνείᾳ
  choice: предавшись разврату
  rationale: Выражает широкое значение πορνεία как половой безнравственности; деепричастная конструкция естественно связывает обстоятельство с последующим прелюбодеянием.
- source_word: ἐμοιχεύθη
  choice: совершила прелюбодеяние
  rationale: Несмотря на формально пассивную форму, в контексте обозначает участие женщины в прелюбодеянии; активное русское выражение ясно передаёт смысл.
- source_word: ἐξ ἀλλοτρίου ἀνδρὸς τέκνα παρέστησεν
  choice: родила детей от другого мужчины
  rationale: В данном контексте естественно передаёт появление детей, зачатых не от мужа. Буквальный оттенок παρέστησεν отмечен в сноске, поскольку «представила детей» по-русски звучит неясно и может исказить смысл.
theological_decisions:
- issue: Трёхчастное развитие обвинения
  choice: 'Сохранить три раздельно пронумерованных проступка: неповиновение Божьему закону, грех против мужа, затем прелюбодеяние и рождение детей от другого мужчины.'
  alternative: Объединить второй и третий пункты в одно обвинение в супружеской неверности.
  rationale: Греческий текст подчёркнуто перечисляет три аспекта вины; их разграничение сохраняет риторическое и нравственное нарастание.
- issue: Значение ἐπλημμέλησεν по отношению к мужу
  choice: согрешила против своего мужа
  alternative: совершила проступок против своего мужа
  rationale: «Согрешила» сохраняет нравственный вес глагола и звучит по-русски естественно, не отождествляя второй пункт с конкретно названным далее прелюбодеянием.
- issue: Передача титула Ὑψίστου
  choice: Всевышнего
  alternative: Всевышнего Бога
  rationale: Переводит божественный титул без добавления отсутствующего в греческом тексте существительного.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Явное трёхчастное перечисление сохранено; архаичные «блудодеяние» и неестественное в данном контексте «представила детей» в основном тексте не используются.
