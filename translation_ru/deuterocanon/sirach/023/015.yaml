  text: A man accustomed to words of reproach will never be disciplined all his days[a][b].
translation:
  language: ru
  text: Человек, привыкший к оскорбительным словам, во все дни своей жизни не будет вразумлён.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к словам упрёка»; или: «к бранным словам».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально греческая конструкция выражает усиленное отрицание: «ни в коем случае не будет вразумлён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνθρωπος
  choice: Человек
  rationale: Передаёт родовое значение греческого ἄνθρωπος и естественно звучит в современном русском языке.
- source_word: συνεθιζόμενος
  choice: привыкший
  rationale: Причастие выражает состояние, сформированное повторяющейся привычкой; «привыкший» кратко и естественно сохраняет этот смысл.
- source_word: λόγοις ὀνειδισμοῦ
  choice: к оскорбительным словам
  rationale: ὀνειδισμός охватывает упрёк, поношение и оскорбление. В контексте привычной речи «оскорбительные слова» ясно передаёт её бранный характер, не сужая выражение до одного лишь порицания.
- source_word: ἐν πάσαις ταῖς ἡμέραις αὐτοῦ
  choice: во все дни своей жизни
  rationale: Естественно передаёт греческий временной оборот как охватывающий весь срок жизни человека.
- source_word: οὐ μὴ παιδευθῇ
  choice: не примет вразумления
  rationale: παιδεύω здесь допускает значения обучения, воспитания, исправления и наказующего наставления. «Не примет вразумления» естественно выражает нравственно-воспитательный смысл, а конструкция с οὐ μή обозначает решительное отрицание.
