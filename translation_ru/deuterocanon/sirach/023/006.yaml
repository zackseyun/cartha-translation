base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/006.yaml
  text: Do not let the appetite of the belly and sexual intercourse overtake me[b][a], and do not give me over to a shameless soul.
translation:
  language: ru
  text: Пусть желание чрева и соитие[a] не овладеют мной, и не предавай меня бесстыдной душе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «половая связь», «половые отношения». Греческое слово само по себе может нейтрально обозначать половое соединение; в контексте этой молитвы оно названо среди сил, способных овладеть человеком.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «бесстыдной душе»; возможно также понимание «бесстыдному внутреннему “я”» или «бесстыдному нраву».'
    reason: ambiguity
lexical_decisions:
- source_word: κοιλίας ὄρεξις
  choice: желание чрева
  rationale: Сохраняет телесный образ греческого сочетания и его широкий смысл — телесный аппетит, не сводя его без достаточных оснований только к обжорству.
- source_word: συνουσιασμός
  choice: страсть к соитию
  rationale: Передаёт связь слова с половым соединением и отрицательную направленность молитвы; слово «страсть» делает естественным образ того, что может овладеть человеком, но не усиливает значение до «разврата».
- source_word: μὴ καταλαβέτωσάν με
  choice: пусть … не овладеют мной
  rationale: Форма во множественном числе относится к двум названным влечениям; καταλαμβάνω здесь выражает захват, подчинение или одоление человека.
- source_word: ψυχὴ ἀναιδεῖ
  choice: бесстыдной душе
  rationale: 'Буквально сохраняет ψυχή и намеренно не устраняет неясность: речь может идти о бесстыдном внутреннем «я» или душевном складе.'
- source_word: μὴ παραδῷς με
  choice: не предавай меня
  rationale: Передаёт значение παραδίδωμι — отдавать или предавать во власть кому-либо или чему-либо.
theological_decisions:
- issue: Нравственная окраска συνουσιασμός
  choice: страсть к соитию
  alternative: соитие; половая связь; распущенность
  rationale: Само слово связано с половым соединением и не обязательно обозначает распущенность, однако контекст молитвы говорит об опасном влечении. Выбранный вариант сохраняет эту напряжённость, не объявляя всякую половую близость порочной.
- issue: Смысл ψυχή в выражении ψυχὴ ἀναιδεῖ
  choice: сохранить буквальное «бесстыдной душе»
  alternative: бесстыдному нраву; бесстыдному самому себе
  rationale: Греческий текст не уточняет, обозначает ли ψυχή внутреннее «я», душевный склад или персонифицированную силу. Буквальная формулировка сохраняет антропологический язык и подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Чрево» сохранено ради телесного образа оригинала; синтаксис сделан естественным для молитвенного обращения, без конфессионально обусловленных уточнений.
