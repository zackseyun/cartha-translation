base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/002.yaml
  text: Who will set whips over my thoughts[a], and the discipline of wisdom over my heart, so that they may not spare me for my ignorances, and may not overlook their sins?
translation:
  language: ru
  text: Кто поставит бичи над моими помыслами и над моим сердцем — наставление мудрости, чтобы они не щадили меня за мои проступки по неведению, а оно ни в коем случае не оставляло без внимания их грехов?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «их грехов». После слов «мои проступки по неведению» такое местоимение неясно; по смыслу иногда понимают «моих грехов», но греческий текст здесь не исправлен.'
    reason: alternative_reading
lexical_decisions:
- source_word: τίς ἐπιστήσει
  choice: Кто поставит
  rationale: Сохраняет прямую форму риторического вопроса и образ установления над человеком средств исправления.
- source_word: ἐπὶ τοῦ διανοήματός μου
  choice: над моими помыслами
  rationale: «Помыслы» естественно передают внутренние мысли и намерения, не сводя значение только к интеллекту.
- source_word: μάστιγας
  choice: бичи
  rationale: Сохраняет конкретный и суровый образ телесного наказания; слово уместно в современном литературном библейском регистре.
- source_word: ἐπὶ τῆς καρδίας μου παιδείαν σοφίας
  choice: над моим сердцем — наставление мудрости
  rationale: «Сердце» сохранено как библейский центр мысли и воли. «Наставление» передаёт παιδεία как обучение, воспитание и исправляющую дисциплину; конструкция с тире воспроизводит параллелизм без лишнего повторения глагола.
- source_word: ἐπὶ τοῖς ἀγνοήμασίν μου
  choice: за мои проступки по неведению
  rationale: ἀγνόημα обозначает не просто незнание, а ошибку или проступок, совершённый по неведению. Такой перевод естественен по-русски и сохраняет отличие от следующего ἁμαρτήματα.
- source_word: μὴ φείσωνται
  choice: чтобы они не щадили меня
  rationale: Множественное число соотнесено с «бичами»; дополнение «меня» выражает подразумеваемый объект действия и делает фразу понятной по-русски.
- source_word: οὐ μὴ παρῇ
  choice: а оно ни в коем случае не оставляло без внимания
  rationale: Единственное число соотнесено с «наставлением мудрости», а усиленное отрицание οὐ μή передано словами «ни в коем случае».
- source_word: τὰ ἁμαρτήματά αὐτῶν
  choice: их грехов
  rationale: Сохранено засвидетельствованное местоимение αὐτῶν «их», хотя его отнесение в контексте затруднительно; неоднозначность поясняется в сноске.
theological_decisions:
- issue: Образ сурового исправления мудростью
  choice: Сохранить конкретные «бичи» и исправляющее «наставление мудрости»
  alternative: Смягчить образ до «сдерживания», «руководства» или «совета»
  rationale: Греческий текст намеренно изображает нравственное исправление как суровое воздействие на внутреннюю жизнь; смягчение ослабило бы напряжение молитвы.
- issue: Неясное местоимение в выражении τὰ ἁμαρτήματά αὐτῶν
  choice: Сохранить в основном тексте «их грехов» и отметить трудность
  alternative: Исправить по смыслу на «моих грехов»
  rationale: Предоставленный греческий источник прямо содержит αὐτῶν («их»). Без отдельного текстологического основания нельзя молча заменять его местоимением первого лица.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Слова «бичи», «помыслы» и «сердце» сохраняют образность исходного текста, а «проступки по неведению» делает редкое существительное ἀγνοήματα понятным обычному читателю. Переключение с множественного «они» на единственное «оно» отражает грамматическое напряжение греческого текста.
