lexical_decisions:
- source_word: ὀφθαλμοὶ
  choice: глазах
  rationale: Буквальное значение — «глаза». Предложный оборот делает сжатую греческую фразу понятной по-русски, не заменяя конкретный образ отвлечёнными словами «взгляд» или «зрение».
- source_word: ἀνθρώπων
  choice: людей
  rationale: Родительный падеж множественного числа обозначает людей вообще; современное русское «людей» естественно передаёт родовое значение без неоправданного ограничения мужчинами.
- source_word: φόβος
  choice: страх
  rationale: Основное значение существительного — «страх». Более сильные варианты «ужас» и «трепет» добавили бы не выраженную в тексте степень или оттенок.
- source_word: αὐτοῦ
  choice: перед ним
  rationale: Греческий родительный при φόβος допускает понимание как страха, направленного на названное лицо. «Перед ним» по-русски естественно выражает это отношение, однако из-за сжатости фразы иная синтаксическая связь отмечена в сноске.
theological_decisions:
- issue: Как передать крайне сжатую и контекстуально трудную греческую именную конструкцию
  choice: «и страх перед ним — в глазах людей»
  alternative: '«и глаза людей — его страх»; более истолковательно: «и он боится глаз людей»'
  rationale: Основной текст следует порядку и доступным связям переданного греческого текста, добавляя лишь необходимую русскую связность посредством тире и предлога. Возможное понимание αὐτοῦ как субъекта страха не вносится молча в текст, а сохраняется в сноске. Это не позволяет строить богословский вывод на текстуально или синтаксически неустойчивом месте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксическая необычность частично сохранена, поскольку греческий текст эллиптичен; тире обозначает подразумеваемую связку. Маркер [a] помещён непосредственно в основном тексте.
