  yaml_path: translation/deuterocanon/sirach/023/001.yaml
  text: Lord, Father and Master of my life, do not abandon me to their counsel; do not let me fall by them.
translation:
  language: ru
  text: Господи, Отец и Владыка моей жизни, не оставляй меня на волю их замысла; не дай мне пасть из-за них[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди них».'
    reason: Предлог ἐν в сочетании с αὐτοῖς допускает как причинно-инструментальное, так и пространственно-средовое понимание.
lexical_decisions:
- source_word: Κύριε
  choice: Господи
  rationale: Естественная русская звательная форма для прямого молитвенного обращения.
- source_word: πάτερ καὶ δέσποτα ζωῆς μου
  choice: Отец и Владыка моей жизни
  rationale: Сохраняет оба обращения и зависимость «моей жизни», не сводя два титула к одному.
- source_word: ἐν βουλῇ αὐτῶν
  choice: на волю их замысла
  rationale: βουλή может обозначать совет, намерение или замысел; в данном контексте «замысел» естественно передаёт враждебный план, а конструкция «оставить на волю» выражает опасность оказаться в его власти.
- source_word: ἐν αὐτοῖς
  choice: из-за них
  rationale: Передаёт возможное инструментально-причинное значение ἐν применительно к упомянутым лицам и соответствует смыслу «пасть по их вине/через них».
theological_decisions:
- issue: Обращение «Отец» к Господу
  choice: 'Сохранено как отдельный титул: «Господи, Отец и Владыка…»'
  alternative: «Господи, Отец, Владыка…» или объединение титулов
  rationale: Греческий текст прямо координирует πάτερ и δέσποτα; перевод не устраняет богословски значимое обращение и не уточняет его сверх источника.
- issue: Неоднозначность ἐν αὐτοῖς
  choice: 'Основной текст: «из-за них»; вариант отмечен в сноске'
  alternative: «среди них» / «в них»
  rationale: Греческий оборот допускает более одного понимания; причинное прочтение подходит контексту, но пространственно-средовое значение не должно быть скрыто.
translation_notes:
  register: Современный литературный русский язык с молитвенно-возвышенным, но понятным регистром. Инверсия «Владыка моей жизни» избегает архаического «жизни моей», сохраняя достоинство обращения.
