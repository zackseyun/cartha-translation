  text: Do not accustom your mouth to crude ignorance, for in it there is a word of sin.
translation:
  language: ru
  text: Не приучай свои уста к грубой, невоспитанной речи[a], ведь в ней есть греховное слово.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение допускает также перевод: «к грубой невоспитанности» или «к непристойной грубости».'
    reason: Фраза ἀπαιδευσίαν ἀσυρῆ лексически редка и охватывает как невоспитанность, так и грубую или непристойную манеру речи.
lexical_decisions:
- source_word: ἀπαιδευσίαν ἀσυρῆ
  choice: к грубой, невоспитанной речи
  rationale: Сочетание обозначает невоспитанность, невежественную грубость или непристойную речь. Слово «речь» введено по контексту упоминания уст и последующего λόγος, чтобы по-русски ясно передать речевую направленность выражения, не сводя его только к ругани.
- source_word: συνεθίσῃς τὸ στόμα σου
  choice: не приучай свои уста
  rationale: Сохранены повелительный запрет, идея вырабатываемой привычки и образ уст; «уста» соответствует возвышенному наставительному регистру и остаётся понятным современному читателю.
- source_word: λόγος ἁμαρτίας
  choice: греховное слово
  rationale: Близкая передача греческого сочетания без уточнения, идёт ли речь об отдельном слове, высказывании или речи вообще.
theological_decisions:
- issue: Сфера запрещённой речи
  choice: Не уточнять её как клятву, богохульство или ругань
  alternative: Передать как «неумеренные клятвы», «сквернословие» или «брань»
  rationale: В данном греческом тексте стоит более широкое и неоднозначное выражение ἀπαιδευσίαν ἀσυρῆ; узкая конкретизация внесла бы содержание, которого этот стих прямо не формулирует.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оборотом «свои уста». Формулировка наставительная и ясная, без конфессиональной конкретизации.
