base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/010.yaml
  text: For just as a servant being constantly examined will not be spared bruises[a], so also one who swears and names the Name continually will never be cleansed from sin.
translation:
  language: ru
  text: Ведь как домашний раб, которого постоянно испытывают, не останется без синяков, так и тот, кто непрестанно клянётся и произносит Имя[a], никогда не очистится от греха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «призывает Имя». В контексте клятв, вероятно, имеется в виду постоянное употребление Божьего имени в клятвах или непочтительной речи.'
    reason: Лексическая неоднозначность глагола ὀνομάζω и подразумеваемого объекта.
lexical_decisions:
- source_word: οἰκέτης
  choice: домашний раб
  rationale: Слово обозначает зависимого слугу в составе дома; «домашний раб» сохраняет как бытовой контекст, так и несвободное положение, существенное для образа наказания.
- source_word: ἐξεταζόμενος ἐνδελεχῶς
  choice: которого постоянно подвергают проверке
  rationale: Причастие и наречие передают длительное, повторяющееся испытание или строгое разбирательство; выбранная формулировка сохраняет эту продолжительность, не вводя прямо отсутствующего в тексте указания на допрос или пытку.
- source_word: ἀπὸ μώλωπος οὐκ ἐλαττωθήσεται
  choice: не останется без синяков
  rationale: μώλωψ — синяк, кровоподтёк или рубец от удара. Греческий оборот передаёт мысль, что человек не избежит таких следов; по-русски это естественно выражается фразой «не останется без синяков».
- source_word: ὁ ὀμνύων
  choice: тот, кто … клянётся
  rationale: Настоящее причастие описывает привычное, повторяющееся действие; значение постоянства дополнительно выражено словом «непрестанно».
- source_word: καὶ ὀνομάζων
  choice: и произносит Имя
  rationale: В контексте клятв глагол, вероятно, указывает на произнесение или призывание Божьего имени. Написание «Имя» сохраняет подразумеваемую священную отсылку, не добавляя в основной текст отсутствующего существительного «Бог».
- source_word: διὰ παντός
  choice: непрестанно
  rationale: Оборот означает постоянное и повторяющееся действие; «непрестанно» кратко передаёт эту силу и соответствует литературному регистру.
- source_word: ἀπὸ ἁμαρτίας οὐ μὴ καθαρισθῇ
  choice: никогда не очистится от греха
  rationale: Сочетание οὐ μή выражает усиленное отрицание, а καθαρίζω здесь говорит о нравственно-религиозном очищении.
theological_decisions:
- issue: Кого или что обозначает «Имя» в выражении об oath-taking и назывании
  choice: Подразумевается произнесение Божьего имени при постоянных клятвах или непочтительной речи
  alternative: Общее называние или произнесение имени без определённой отсылки к Богу
  rationale: Непосредственный контекст клятв делает отсылку к Божьему имени наиболее вероятной. Основной текст сохраняет эллиптичность греческого выражения, а сноска отмечает возможный оттенок «призывания».
translation_notes:
  register: Современный литературный русский язык с достоинством мудростного изречения. Синтаксический параллелизм «как… так и…» сохранён; формулировки остаются понятными без церковнославянизмов.
