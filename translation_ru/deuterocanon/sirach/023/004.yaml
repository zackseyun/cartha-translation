lexical_decisions:
- source_word: Κύριε
  choice: Господи
  rationale: Звательная форма κύριος в обращении к Богу; «Господи» естественно для современной русской молитвенной речи.
- source_word: πάτερ
  choice: Отец
  rationale: Прямое обращение к Богу; форма «Отец» сохраняет именование и согласуется с рядом обращений.
- source_word: θεὲ ζωῆς μου
  choice: Бог моей жизни
  rationale: Компактно сохраняет греческую родительную конструкцию и не уточняет сверх текста, означает ли она источник, хранителя или владыку жизни.
- source_word: μετεωρισμὸν ὀφθαλμῶν
  choice: надменного взгляда
  rationale: Передаёт наиболее вероятный в контексте нравственный смысл — высокомерие, выраженное глазами, — сохраняя образ зрения. Возможный более буквальный смысл отмечен в сноске.
- source_word: μὴ δῷς μοι
  choice: не давай мне
  rationale: Прямая и естественная передача запретительно-просительной конструкции с δίδωμι без истолковывающего расширения.
theological_decisions:
- issue: Нравственный смысл μετεωρισμὸν ὀφθαλμῶν
  choice: надменный взгляд
  alternative: возношение, беспокойство или блуждание глаз
  rationale: В молитве об избавлении от пороков выражение вероятнее всего обозначает гордость, заметную во взгляде. Однако семантика μετεωρισμός допускает буквальное представление о поднятости либо беспокойном движении, поэтому неоднозначность отражена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного обращения. «Надменный взгляд» звучит естественнее буквального «надменности глаз», а сноска сохраняет лексическую неоднозначность греческого выражения.
