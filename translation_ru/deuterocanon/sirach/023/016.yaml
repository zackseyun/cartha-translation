translation:
  language: ru
  text: Два вида умножают грехи, а третье[a] навлечёт гнев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «третье»; в греческом после этого слова подразумевается существительное.'
    reason: Сохраняет грамматическую эллиптичность τὸ τρίτον, не уточняя, что именно является третьим видом.
lexical_decisions:
- source_word: Δύο εἴδη
  choice: Два рода
  rationale: εἴδη обозначает виды или категории; «рода» естественно передаёт структуру нумерованного изречения и сохраняет согласование со словом «третий».
- source_word: πληθύνουσιν ἁμαρτίας
  choice: умножают грехи
  rationale: Сохраняется явный греческий плюрал «грехи» и образ увеличения их числа, выраженный глаголом πληθύνω.
- source_word: τὸ τρίτον
  choice: третий
  rationale: В греческом стоит субстантивированная форма среднего рода с подразумеваемым существительным. По-русски естественно восстановить согласование с ранее названным словом «род», не повторяя его.
- source_word: ἐπάξει
  choice: навлечёт
  rationale: Будущая форма ἐπάγω означает «привести, навлечь». «Навлечёт» естественно сочетается с «гневом» и передаёт мысль о наступающем последствии.
- source_word: ὀργήν
  choice: гнев
  rationale: «Гнев» сохраняет серьёзный, возможно карающий оттенок ὀργή, не добавляя отсутствующего в греческом указания на того, кому принадлежит этот гнев.
theological_decisions:
- issue: Чей гнев имеется в виду
  choice: В тексте оставлено просто «гнев» без уточнения.
  alternative: «гнев Божий» или «наказание»
  rationale: Греческий текст содержит только ὀργήν и не называет Бога. Уточнение сняло бы сохранённую источником смысловую открытость.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная форма изречения сохранена. «Навлечёт гнев» звучит возвышенно, но остаётся понятным обычному читателю.
