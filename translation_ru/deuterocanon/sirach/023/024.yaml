  text: She will be brought out before the assembly[a], and there will be an inspection concerning her children.
translation:
  language: ru
  text: Её выведут перед собранием, и её детей подвергнут проверке[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её детей постигнет посещение»; здесь может подразумеваться не только проверка, но и судебная кара.'
    reason: Слово ἐπισκοπή может обозначать как проверку или надзор, так и посещение с судебно-карательным оттенком.
lexical_decisions:
- source_word: αὕτη
  choice: Её
  rationale: Указательное местоимение женского рода относится к упомянутой в непосредственном контексте женщине; русское личное местоимение звучит естественно и сохраняет связность.
- source_word: εἰς ἐκκλησίαν
  choice: перед собранием
  rationale: ἐκκλησία здесь означает собравшуюся общину, а не церковь как позднейший христианский институт. Предлог εἰς при глаголе выведения передан с учётом публичного представления женщины собранию.
- source_word: ἐξαχθήσεται
  choice: выведут
  rationale: Будущее страдательного залога от ἐξάγω обозначает, что женщину публично выведут или приведут; неопределённо-личная русская конструкция естественно передаёт греческий пассив.
- source_word: ἐπὶ τὰ τέκνα αὐτῆς
  choice: детей её
  rationale: Сочетание с ἐπί допускает значения «относительно», «на» или «против». Объектная конструкция при слове «проверка» сохраняет направленность действия на детей, не делая наказание однозначным.
- source_word: ἐπισκοπὴ
  choice: проверка
  rationale: Слово может обозначать проверку, надзор или посещение, в том числе судебное и карательное. «Проверка» естественна в современном русском и сохраняет официальный оттенок, а более грозное значение отмечено в сноске.
- source_word: ἔσται
  choice: ждёт
  rationale: Идиоматическая русская конструкция передаёт греческое будущее существования «будет», сохраняя краткость и зловещий оттенок высказывания.
theological_decisions:
- issue: Следует ли передавать ἐκκλησία поздней церковной терминологией
  choice: собрание
  alternative: община; церковь
  rationale: В данном контексте книги Премудрости речь идёт о публичном разбирательстве перед собравшимся обществом, а не о сформировавшемся христианском церковном институте.
- issue: Насколько явно выражать карательный смысл ἐπισκοπή
  choice: проверка
  alternative: посещение; кара; разбирательство
  rationale: Греческое существительное допускает как проверку или надзор, так и грозное судебное посещение. Основной текст не превращает возможный карательный оттенок в однозначное наказание; эта смысловая напряжённость сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная, но понятная без специальной церковной лексики. Инверсия «детей её» поддерживает достоинство библейского регистра, не создавая архаичности.
