base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/011.yaml
  text: A man who swears many oaths will be filled with lawlessness[a], and the whip will not depart from his house. If he stumbles, his sin is upon him; and if he disregards it, he has sinned doubly. And if he swore in vain, he will not be justified[d][c][b], for his house will be filled with afflictions.
translation:
  language: ru
  text: Человек, который часто клянётся, исполнится беззакония, и бич[a] не отступит от его дома. Если он провинится, вина за это будет на нём; а если оставит это без внимания[b], то согрешит вдвойне. И если он поклянётся впустую[c], то не будет оправдан, потому что его дом наполнится бедствиями[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кара». Греческое μάστιξ буквально означает бич или плеть, а переносно — тяжёлое наказание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пренебрежёт этим». Речь может идти о том, что человек оставляет без внимания свой проступок или связанную с ним вину, тем самым усугубляя её.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «поклянётся через пустоту». Возможны оттенки пустой, напрасной или ложной клятвы.'
    reason: lexical_alternative
  - marker: d
    text: Греческое слово здесь трудно для точной передачи; оно, вероятно, означает навлечённые несчастья, кары или бедствия, обрушивающиеся на дом.
    reason: lexical_difficulty
lexical_decisions:
- source_word: ἀνὴρ πολύορκος
  choice: человек, который часто клянётся
  rationale: Передаёт характеристику человека, склонного к многократным клятвам, естественным современным русским языком; мужской образ исходного текста не превращён в отвлечённое понятие.
- source_word: πλησθήσεται ἀνομίας
  choice: исполнится беззакония
  rationale: Сохраняет образ наполнения и нравственно-правовой вес ἀνομία, не сводя его к простой ошибке.
- source_word: μάστιξ
  choice: бич
  rationale: «Бич» сохраняет буквальный образ орудия наказания и возможный переносный смысл кары.
- source_word: πλημμελήσῃ
  choice: провинится
  rationale: Глагол обозначает проступок или ошибку; «провинится» передаёт нравственную вину, но не добавляет отсутствующего в греческом указания на неумышленность.
- source_word: ἁμαρτία αὐτοῦ ἐπʼ αὐτῷ
  choice: его грех останется на нём
  rationale: Сохраняет конкретную греческую идиому личной ответственности, делая её понятной по-русски.
- source_word: ὑπερίδῃ
  choice: оставит это без внимания
  rationale: Передаёт значение сознательного пренебрежения или игнорирования, не уточняя сверх текста, что именно оставлено без внимания — проступок, вина или обязанность исправить содеянное.
- source_word: ἥμαρτεν δισσῶς
  choice: согрешит вдвойне
  rationale: Передаёт усиленную, удвоенную виновность без попытки перечислить два отдельных греха.
- source_word: διὰ κενῆς ὤμοσεν
  choice: поклянётся впустую
  rationale: Сохраняет образ пустоты и допускает оттенки пустой, напрасной или ложной клятвы, не сужая выражение до лжесвидетельства.
- source_word: οὐ δικαιωθήσεται
  choice: не будет оправдан
  rationale: Сохраняет судебно-нравственный смысл признания правым или невиновным, не привнося более позднюю богословскую терминологию.
- source_word: ἐπαγωγῶν
  choice: бедствиями
  rationale: Редкое и трудное в данном контексте слово обозначает навлечённые несчастья или кары; «бедствия» сохраняет необходимую широту смысла.
theological_decisions:
- issue: Смысл δικαιωθήσεται в контексте наставления о клятвах
  choice: не будет оправдан
  alternative: не будет признан невиновным / не будет обелён
  rationale: Контекст говорит о вине и последствиях клятвы. Формулировка сохраняет судебно-нравственное напряжение греческого глагола, но не превращает стих в утверждение о специальной доктрине оправдания.
- issue: Характер проступка в πλημμελήσῃ
  choice: если он провинится
  alternative: если он ошибётся / если он согрешит неумышленно
  rationale: В греческом есть идея проступка или ошибки, однако неумышленность прямо не выражена. Перевод не вводит отдельной категории неумышленного греха.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для книги Премудрости. Синтаксис сохраняет последовательность и параллелизм греческого текста, но избегает тяжёлых калькированных форм вроде «многоклятвенный». Образы «исполнится» и «бич» сохранены как значимые элементы исходной поэтики.
