  text: Ему было известно всё прежде, чем было сотворено; так и когда всё завершится.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Прежде чем было сотворено всё, он знал это; так же и после завершения». Греческая форма ἔγνωσται может передаваться как «было известно» или, по смыслу, активным глаголом «знал».'
