  terminology: «Сотворено» уместно для κτισθῆναι и соответствует библейскому регистру. «Известно ему» сохраняет местоименную отсылку, не вводя в текст слово «Бог». В сноске слово «состоянийную» употреблено неестественно; корректнее «стативную» или описательное «передачу состояния».
