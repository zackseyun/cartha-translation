lexical_decisions:
- source_word: πρὶν ἢ
  choice: прежде чем
  rationale: Естественно вводит придаточное времени и точно передаёт предшествование.
- source_word: κτισθῆναι
  choice: было сотворено
  rationale: Передаёт аористный пассивный инфинитив κτίζω, сохраняя значение творения и пассивную конструкцию.
- source_word: τὰ πάντα
  choice: всё
  rationale: Современный и всеохватный русский эквивалент; местоимение «оно» далее грамматически отсылает к «всё».
- source_word: ἔγνωσται
  choice: уже было известно
  rationale: Передаёт результативно-состоянийную силу греческого перфекта и смысл полного предшествующего знания, не превращая неоднозначную форму в однозначно активную.
- source_word: αὐτῷ
  choice: ему
  rationale: 'Дательный передан как носитель знания: «ему известно». Строчная буква сохраняет форму исходного местоимения и не подменяет его явным словом «Бог».'
- source_word: οὕτως καὶ
  choice: так же и
  rationale: Сохраняет явное сопоставление знания до сотворения и после завершения.
- source_word: μετὰ τὸ συντελεσθῆναι
  choice: после завершения
  rationale: Передаёт временное значение конструкции μετά с артиклевым инфинитивом, не уточняя сверх текста, что именно или когда именно завершается.
theological_decisions:
- issue: К кому относится αὐτῷ
  choice: Сохранено местоимение «ему» без замены на «Богу»
  alternative: 'Передать явно: «Богу было известно»'
  rationale: Контекст указывает на Бога, однако сам стих употребляет местоимение; сохранение местоимения избегает внесения явного имени в основной текст.
- issue: Залог и синтаксическая неоднозначность ἔγνωσται
  choice: «оно уже было ему известно»
  alternative: «он уже знал это»
  rationale: Состоянийная конструкция ближе сохраняет форму и результативную силу греческого перфекта, тогда как активный вариант возможен по смыслу, но сильнее разрешает грамматическую неоднозначность.
- issue: Смысл «после завершения»
  choice: Не уточнять эсхатологический момент и объект завершения
  alternative: «после того, как завершится всё»
  rationale: Греческая формулировка кратка и допускает понимание завершения всего упомянутого; нейтральный вариант сохраняет её напряжение и не добавляет специальной доктринальной схемы.
