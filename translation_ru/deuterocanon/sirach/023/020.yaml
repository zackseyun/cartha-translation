  source_fidelity: 'В целом смысл передан точно: πρὶν ἢ κτισθῆναι τὰ πάντα — «прежде чем было сотворено всё», а ἔγνωσται αὐτῷ естественно передаётся как «ему было известно». Однако «уже» не выражено в греческом тексте и слегка усиливает временной оттенок. Во второй части «после завершения» грамматически возможно, но по-русски оставляет неясным, что именно завершено; исходная конструкция, вероятнее всего, соотносится со «всем».'
