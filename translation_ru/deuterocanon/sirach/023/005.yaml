lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Простой союз сохраняет связь с продолжающейся молитвой предыдущей строки.
- source_word: ἐπιθυμίαν
  choice: желание
  rationale: Греческое существительное обозначает сильное желание и в данном контексте имеет отрицательную нравственную окраску, но само по себе не ограничено сексуальной похотью. Широкий русский эквивалент сохраняет этот смысловой диапазон; отрицательный смысл проясняется контекстом и примечанием.
- source_word: ἀπόστρεψον
  choice: отврати
  rationale: Аористный императив выражает просьбу о решительном действии. «Отврати» сохраняет образ поворота и удаления, присутствующий в греческом глаголе, и соответствует возвышенному, но понятному регистру молитвы.
- source_word: ἀπʼ ἐμοῦ
  choice: от меня
  rationale: Предложное сочетание прямо выражает удаление от говорящего, не добавляя отсутствующего в тексте уточнения «изнутри меня».
theological_decisions:
- issue: Нравственная окраска ἐπιθυμία
  choice: Сохранено широкое «желание», а не более узкое «вожделение».
  alternative: «страсть», «вожделение», «дурное желание»
  rationale: Слово может обозначать нравственно предосудительное сильное желание, однако греческая формулировка не сводит его исключительно к сексуальной похоти. Перевод не должен без необходимости сужать смысл или добавлять определение «дурное».
translation_notes:
  register: Современный литературный русский язык с кратким молитвенным синтаксисом. Глагол «отврати» слегка возвышен, но общеупотребителен в религиозно-поэтическом контексте и точно передаёт образ исходного глагола. Точка с запятой сохраняет незавершённость строки и её связь с дальнейшим контекстом.
