base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/023/014.yaml
  text: Remember your father and your mother[a], for you sit in the midst of great men; lest you be forgotten before them, and by your habit become foolish, and wish that you had not been born[b], and curse the day of your birth.
translation:
  language: ru
  text: Помни об отце и матери, ведь ты сидишь среди вельмож[a]. Смотри, не забудься перед ними[b], не стань глупцом из-за своей привычки, не пожелай, чтобы тебе лучше было не родиться, и не прокляни день своего рождения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди знатных людей» либо «среди высокопоставленных мужчин». Греческое слово обозначает влиятельных людей высокого положения и имеет форму мужского рода.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «смотри, не окажись забытым в их присутствии»; возможно также: «не окажись незамеченным в их присутствии». Греческую форму здесь можно понять как рефлексивно, так и пассивно.'
    reason: alternative_reading
lexical_decisions:
- source_word: μνήσθητι
  choice: помни
  rationale: Аористный императив призывает сознательно держать в памяти; «помни» передаёт это прямо и естественно.
- source_word: πατρὸς καὶ μητρός σου
  choice: об отце и матери
  rationale: Сохранено отдельное упоминание каждого из родителей, как в греческом тексте.
- source_word: ἀνὰ μέσον μεγιστάνων
  choice: среди вельмож
  rationale: «Среди» естественно передаёт пространственно-социальный оборот, а «вельможи» обозначает высокопоставленных и влиятельных мужчин, сохраняя исторический общественный контекст.
- source_word: συνεδρεύει
  choice: ты сидишь
  rationale: Глагол означает совместно сидеть, нередко в совете или собрании; краткий перевод не добавляет прямо не названного учреждения.
- source_word: μή ποτε
  choice: как бы тебе не
  rationale: Русская предупредительная конструкция естественно вводит цепь возможных нежелательных последствий.
- source_word: ἐπιλαθῇ ἐνώπιον αὐτῶν
  choice: не забыться перед ними
  rationale: Контекст допускает рефлексивный смысл — потерять сдержанность или самообладание в их присутствии. Неоднозначность формы отмечена в сноске.
- source_word: τῷ ἐθισμῷ σου
  choice: из-за своей привычки
  rationale: Дательный падеж передан как причина или средство; существительное обозначает привычку, приобретённую манеру поведения.
- source_word: μωρανθῇς
  choice: не поглупеть
  rationale: Передан результативный смысл — стать или показаться глупым; глагол естественно включается в последовательность предупреждений.
- source_word: θελήσεις εἰ μὴ ἐγεννήθης
  choice: не пожелать, чтобы ты не родился
  rationale: Идиоматически передаёт сожаление о собственном рождении, сохраняя структуру пожелания.
- source_word: τὴν ἡμέραν τοῦ τοκετοῦ σου μὴ καταράσῃ
  choice: не проклясть день своего рождения
  rationale: Сохранён образ дня рождения и продолжена единая цепь нежелательных последствий, зависящая от μή ποτε.
theological_decisions:
- issue: Социально и грамматически маркированное μεγιστάνων
  choice: вельмож
  alternative: знатных людей; высокопоставленных мужчин
  rationale: «Вельможи» кратко обозначает мужчин высокого общественного положения и не нейтрализует историческую социальную обстановку.
- issue: Неоднозначность ἐπιλαθῇ ἐνώπιον αὐτῶν
  choice: не забыться перед ними
  alternative: не быть забытым у них на глазах; не оказаться незамеченным в их присутствии
  rationale: Контекст последующего глупого поведения поддерживает смысл утраты самообладания, однако форма допускает пассивное понимание; оно сохранено в сноске, без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией книги Премудрости. Синтаксис предупреждения объединяет все последствия в одну ясную цепь; «вельможи» сохраняет древний общественный колорит, оставаясь понятным современному читателю.
