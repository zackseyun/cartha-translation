lexical_decisions:
- source_word: πολλοὶ
  choice: Многие
  rationale: Прямо передаёт количественное прилагательное и естественно звучит в изречении.
- source_word: ἔπεσαν
  choice: пали
  rationale: Точно передаёт аорист ἔπεσαν; совершенный вид уместен для обобщающего изречения и поддерживает повтор корня с πεπτωκότες.
- source_word: ἐν στόματι μαχαίρας
  choice: от уст меча
  rationale: Сохраняет буквальный образ «уст меча» и его риторическую связь с «языком». Предлог «от» естественно выражает причину гибели, не устраняя метафору.
- source_word: καὶ οὐχ ὡς
  choice: но не так, как
  rationale: Сохраняет формально выраженное сравнение, не добавляя отсутствующего в греческом повторения «столь многие» и не разрешая однозначно, относится ли сопоставление к числу или характеру падения.
- source_word: οἱ πεπτωκότες
  choice: павшие
  rationale: Естественно передаёт субстантивированное причастие перфекта и сохраняет повтор образа падения.
- source_word: διὰ γλῶσσαν
  choice: из-за языка
  rationale: Передаёт причинное значение διά с винительным падежом и сохраняет конкретный образ языка как губительной речи.
theological_decisions:
- issue: Образное противопоставление меча и языка
  choice: Сохранены телесные образы «уста меча» и «язык».
  alternative: 'Передать идиоматически: «от острия меча» и «из-за злых слов».'
  rationale: Буквальные образы передают риторическую силу греческого текста и внутреннюю связь между «устами» и «языком», не сводя смысл к абстрактной речи.
- issue: Неоднозначность καὶ οὐχ ὡς
  choice: «но не так, как»
  alternative: «но не столько, сколько» или «но не так много, как».
  rationale: Греческий текст не повторяет количественного слова во второй части. Выбранная формулировка сохраняет напряжение между возможным количественным сравнением и более общим сопоставлением.
translation_notes:
  register: Современный литературный русский язык с достоинством мудрого изречения. Необычное сочетание «уста меча» намеренно сохранено ради образности и пояснено сноской.
