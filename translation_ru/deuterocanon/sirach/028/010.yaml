  yaml_path: translation/deuterocanon/sirach/028/010.yaml
  text: As the fuel of a fire, so it will be kindled; according to a man's strength, so will his wrath be; and according to his wealth he will raise up his anger, and according to the firmness of the conflict it will be kindled.
translation:
  language: ru
  text: Чем больше топлива у огня, тем сильнее он разгорится; какова сила человека, такова будет его ярость; чем больше его богатство, тем выше он поднимет свой гнев, и чем ожесточённее распря, тем сильнее разгорится гнев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст выражен сжатой параллельной конструкцией: буквально «по топливу огня — разгорится» и «по прочности (или силе) распри — разгорится». В последнем члене субъект глагола не назван; по контексту это может быть гнев, тогда как перевод называет его для ясности. «Ожесточённость распри» передаёт στερέωσις, которое также может означать её прочность или силу.'
    reason: Сохраняет и точно локализует синтаксическую неоднозначность ἐκκαυθήσεται и диапазон значения στερέωσις.
lexical_decisions:
- source_word: ὕλην
  choice: топливо
  rationale: В сочетании с πυρός слово обозначает горючий материал, питающий огонь; «топливо» естественно передаёт образ и не сужает значение до одних дров.
- source_word: ἐκκαυθήσεται
  choice: разгорится
  rationale: Будущая пассивная форма описывает воспламенение или сильное разгорание; русский возвратный глагол естественно сохраняет огненную метафору в обеих частях стиха.
- source_word: ἰσχὺν
  choice: сила
  rationale: Передаёт физическую или общественную способность человека и поддерживает соразмерность, выраженную повторением κατὰ.
- source_word: ἀνθρώπου
  choice: человека
  rationale: Греческое слово имеет обобщённое значение; русское «человека» сохраняет единственное число и не вводит ненужного гендерного ограничения.
- source_word: θυμός
  choice: ярость
  rationale: Передаёт горячий, бурный гнев и позволяет отличить θυμός от следующего ὀργή, не превращая различие в строгий технический контраст.
- source_word: πλοῦτον
  choice: богатство
  rationale: Прямой и современный эквивалент, указывающий на материальные средства или влияние человека.
- source_word: ἀνυψώσει
  choice: раздует сильнее
  rationale: Буквально глагол означает «поднимет, возвысит»; в контексте огненной метафоры «раздует» естественно выражает усиление гнева, а сравнительная конструкция передаёт соразмерность κατὰ.
- source_word: ὀργήν
  choice: гнев
  rationale: Обычный русский эквивалент, сохраняющий некоторое отличие от более бурной «ярости» для θυμός.
- source_word: στερέωσιν τῆς μάχης
  choice: упорнее распря
  rationale: στερέωσις обозначает прочность, закреплённость или силу; применительно к μάχη речь, вероятно, об укоренившемся, ожесточённом споре. «Упорнее распря» звучит естественно, сохраняя смысл стойкости конфликта без излишнего уточнения.
- source_word: μάχης
  choice: распря
  rationale: В контексте наставления о ссорах слово обозначает не обязательно военное сражение, а враждебный спор или конфликт.
theological_decisions:
- issue: Соотношение силы, богатства и гнева
  choice: 'Сохранена пропорциональная структура: сила человека и его средства определяют размах ярости и гнева.'
  alternative: Понять богатство как нравственное или духовное изобилие.
  rationale: πλοῦτος без контекстуального указания естественнее означает материальное богатство; текст мудрости наблюдает, как возможности человека усиливают последствия его гнева, не вынося отдельного доктринального суждения о богатстве.
- issue: Различение θυμός и ὀργή
  choice: θυμός передано как «ярость», ὀργή — как «гнев».
  alternative: Передать оба слова как «гнев».
  rationale: Различение отражает два греческих слова, хотя их смысловые поля пересекаются и строгого богословского разграничения текст не устанавливает.
- issue: Неясный субъект первого ἐκκαυθήσεται
  choice: Местоимение «он» соотнесено с огнём.
  alternative: 'Понять подразумеваемым субъектом гнев или конфликт: «так и вспыхнет гнев».'
  rationale: Ближайшее существительное πυρός указывает на огонь, однако греческий текст эллиптичен; перевод сохраняет образ, а примечание отмечает неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрой речи. Повторяющаяся конструкция κατὰ передана параллелями «каково/какова» и «чем… тем…», чтобы сочетать ясность с ритмом. Огненный образ поддержан глаголами «раздует» и «разгорится».
