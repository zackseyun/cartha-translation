  text: Третий язык потряс многих и разогнал их от народа к народу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «клеветнический язык», «двойной язык»; в более общем смысле — «раздорная речь». По-гречески буквально: «третий язык».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα τρίτη
  choice: третий язык
  rationale: 'Сохраняется буквальный и необычный образ греческого выражения: γλῶσσα означает «язык» и метонимически речь, а τρίτη — «третий». Возможные идиоматические толкования вынесены в примечание.'
- source_word: ἐσάλευσεν
  choice: потряс
  rationale: Глагол означает «поколебать, потрясти, привести в смятение»; «потряс» сохраняет конкретную метафору и естественно звучит по-русски.
- source_word: διέστησεν
  choice: рассеял
  rationale: Глагол выражает разделение или разъединение; вместе с оборотом «от народа к народу» здесь уместно передаёт рассеяние людей среди разных народов.
- source_word: ἀπὸ ἔθνους εἰς ἔθνος
  choice: от народа к народу
  rationale: Передаёт направление перемещения и сохраняет повтор существительного ἔθνος; «народ» в данном контексте естественнее русского «нация».
theological_decisions:
- issue: Толкование идиомы γλῶσσα τρίτη
  choice: Сохранить в основном тексте буквальное выражение «третий язык».
  alternative: «клеветнический язык», «двойственный язык» или, шире, «раздорная речь»
  rationale: Предоставленный греческий текст буквально говорит о «третьем языке». Перевод не устраняет намеренно необычный образ и не навязывает одно из возможных толкований; они указаны в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской афористической речи. Необычное выражение «третий язык» намеренно сохранено; синтаксис краткий и прозрачный.
