  yaml_path: translation/deuterocanon/sirach/028/004.yaml
  text: He has no mercy on a man like himself[b][a], yet he asks for his own sins to be forgiven?
translation:
  language: ru
  text: Не проявляет милосердия к человеку, подобному ему,[a] а сам просит прощения за свои грехи?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сохранившаяся еврейская строка, приведённая для этого места, по-видимому, не соответствует данному стиху; поэтому перевод выполнен по греческому тексту.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «и молится о своих грехах?» Греческий текст прямо не называет, о чём именно он просит; по контексту подразумевается прощение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπʼ ἄνθρωπον ὅμοιον αὐτῷ
  choice: человека, подобного себе
  rationale: Поскольку приведённая еврейская строка, по-видимому, относится к другому месту, перевод опирается на греческое свидетельство. Оборот означает человека, подобного самому действующему лицу, то есть такого же смертного.
- source_word: οὐκ ἔχει ἔλεος
  choice: не милует
  rationale: Кратко и естественно передаёт отсутствие милосердия в контексте взаимного прощения; сохраняет активную направленность отношения к другому человеку.
- source_word: καὶ περὶ τῶν ἁμαρτιῶν αὐτοῦ δεῖται
  choice: но просит прощения за собственные грехи?
  rationale: Глагол δεῖται означает «просит, умоляет, молится»; предмет просьбы в греческом тексте подразумевается. Контекст указывает на просьбу о прощении. «Но» ясно выражает риторическое противопоставление, а «собственные» подчёркивает αὐτοῦ.
theological_decisions:
- issue: Выбор основного источника при несоответствии еврейской строки
  choice: Перевести по греческому свидетельству и отметить несоответствие еврейского текста
  alternative: Перевести приведённую еврейскую строку, хотя она не соответствует стиху Сираха 28:4
  rationale: Еврейская строка «И лёгок среди возлежащих жених, живущий в доме своего тестя» тематически и текстуально не соответствует данному стиху. Греческий текст соответствует контексту главы о гневе, мести и прощении, поэтому здесь он служит основным свидетельством; неопределённость источника раскрыта в сноске.
- issue: Подразумеваемый предмет просьбы
  choice: В основном тексте уточнить, что речь идёт о прощении грехов
  alternative: 'Буквально: «и молится о своих грехах?»'
  rationale: Греческий текст прямо не называет желаемый результат просьбы, но контекст ясно подразумевает прощение. Уточнение делает русский текст естественным, а буквальная возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык; форма риторического вопроса и нравственное напряжение оригинала сохранены. Лексика ясная и достойная, без конфессионально окрашенных уточнений.
