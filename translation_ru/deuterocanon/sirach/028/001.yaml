translation:
  language: ru
  text: Кто мстит, тот встретит отмщение от Господа, и Господь непременно сохранит в памяти его грехи.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившаяся еврейская строка, указанная для этого стиха, гласит: «Не страшись завтрашней беды, ведь ты не знаешь, что породит день». Она не соответствует здесь греческому тексту Книги Премудрости Иисуса, сына Сирахова, и, по-видимому, относится к другому стиху либо возникла из-за несоответствия при передаче текста. Поэтому перевод Сирах 28:1 следует греческому свидетельству.'
    reason: textual_variant
  - marker: b
    text: 'Буквально греческий текст повторяет один глагол: «сохраняя, сохранит». Подлежащее во второй части прямо не названо; по смыслу речь, вероятнее всего, о Господе, сохраняющем грехи мстящего в памяти.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: ὁ ἐκδικῶν
  choice: кто мстит
  rationale: Обобщающая конструкция естественно передаёт греческое субстантивированное причастие и его значение привычного или сознательного действия.
- source_word: παρὰ Κυρίου
  choice: от Господа
  rationale: Предлог παρά с родительным падежом указывает здесь на источник; κύριος передано традиционным «Господь».
- source_word: εὑρήσει ἐκδίκησιν
  choice: встретит отмщение
  rationale: Сохраняется словесная связь с «мстит» и буквальный образ греческого глагола «найти, встретить», при этом русская фраза остаётся естественной.
- source_word: τὰς ἁμαρτίας αὐτοῦ
  choice: грехи его
  rationale: Прямо сохраняется нравственно-религиозное значение ἁμαρτίαι без ослабления до «проступков».
- source_word: διατηρῶν διατηρήσει
  choice: непременно сохранит
  rationale: Наречие «непременно» передаёт усиление, создаваемое повторением одного греческого глагола; «сохранит» оставляет смысл удержания грехов за человеком, не сводя его лишь к мысленному воспоминанию.
theological_decisions:
- issue: Расхождение между предоставленным еврейским текстом и греческим свидетельством
  choice: Переводить Sirach 28:1 по греческому тексту
  alternative: 'Перевести предоставленную еврейскую строку: «Не страшись завтрашней беды, ведь ты не знаешь, что породит день»'
  rationale: Еврейская строка не соответствует содержанию Sirach 28:1 и близка к Притч 27:1; поэтому для данного стиха основным свидетельством служит греческий текст, а расхождение открыто отмечается в сноске.
- issue: Подразумеваемое подлежащее в καὶ τὰς ἁμαρτίας αὐτοῦ διατηρῶν διατηρήσει
  choice: 'Явно назвать Господа подлежащим: «Господь… сохранит»'
  alternative: Оставить местоимение «он», которое по-русски могло бы быть понято как указание на мстящего
  rationale: Хотя в греческой второй части подлежащее прямо не названо, смысловой контекст указывает на Господа как на того, кто сохраняет грехи мстящего за ним. Явное существительное устраняет случайную русскую двусмысленность, а грамматическая неявность оригинала отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой назидательной формой. Слова «мстит — отмщение» намеренно сохраняют корневую связь оригинала; «непременно» передаёт греческое усилительное повторение.
