translation:
  language: ru
  text: Её смерть — лютая смерть[a], и её царство мёртвых предпочтительнее[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Смерть от неё — лютая смерть». Местоимение женского рода отсылает к упомянутому ранее языку или к злоречивой речи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «царство мёртвых лучше её». Греческое выражение допускает сравнительное понимание, хотя объект сравнения прямо не назван.'
    reason: alternative_reading
lexical_decisions:
- source_word: θάνατος πονηρός ὁ θάνατος αὐτῆς
  choice: Её смерть — лютая смерть
  rationale: Повтор слова θάνατος сохранён ради резкого параллелизма. «Лютая» передаёт здесь губительный, мучительный характер смерти, не сводя πονηρός только к нравственному значению «злая».
- source_word: αὐτῆς
  choice: её
  rationale: Женский род греческого местоимения сохранён; он отсылает к женскому антецеденту из предшествующего контекста, вероятнее всего к γλῶσσα («язык») или к злоречивой речи. В русском грамматический род слова «язык» иной, поэтому связь пояснена в сноске.
- source_word: λυσιτελὴς μᾶλλον
  choice: предпочтительнее
  rationale: Сочетание выражает сравнительную выгоду или предпочтительность. В данном мрачном сопоставлении естественное русское «предпочтительнее» точнее по смыслу, чем коммерчески окрашенное «выгоднее».
- source_word: ᾅδης
  choice: царство мёртвых
  rationale: Передаёт греческий ᾅδης как область пребывания умерших, не сужая значение до физической могилы и не отождествляя его с позднейшим понятием места вечного наказания.
theological_decisions:
- issue: Передача ᾅδης
  choice: царство мёртвых
  alternative: Аид; преисподняя; могила
  rationale: «Царство мёртвых» прозрачно для современного читателя и сохраняет смысл греческого термина без привнесения учения об аде как месте окончательного наказания.
- issue: Синтаксическая связь αὐτῆς во второй части
  choice: её царство мёртвых
  alternative: царство мёртвых предпочтительнее её
  rationale: Основной текст формально сохраняет генитив αὐτῆς при ᾅδης и не вставляет отсутствующий в греческом объект сравнения. Возможное сравнительное понимание дано в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с кратким, афористичным строем. Сохранены повтор «смерть — смерть», женское местоимение и напряжённая неоднозначность второй части; неестественные для русского оттенки разъяснены сносками.
