translation:
  language: ru
  text: Человек таит гнев на человека, а у Господа просит исцеления?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленный еврейский текст для этого стиха гласит: «Всё я взвесил на чаше весов и не нашёл ничего легче отрубей», что не соответствует данному контексту. Поэтому перевод следует греческому тексту Сир 28:3.'
    reason: textual_variant
lexical_decisions:
- source_word: ἄνθρωπος ἀνθρώπῳ
  choice: человек на человека
  rationale: Оба употребления ἄνθρωπος обозначают людей в общем смысле; повтор сохранён, поскольку он подчёркивает противоречие между отношением человека к ближнему и его обращением к Господу.
- source_word: συντηρεῖ ὀργήν
  choice: таит гнев
  rationale: συντηρεῖ передаёт длительное удерживание или сохранение гнева. Русское «таит гнев» естественно выражает устойчивую злобу, а не краткую вспышку.
- source_word: παρὰ Κυρίου
  choice: у Господа
  rationale: При глаголе просьбы русская конструкция «просит у Господа» естественно передаёт источник ожидаемого исцеления.
- source_word: ζητεῖ ἴασιν
  choice: просит исцеления
  rationale: В данном риторическом вопросе ζητεῖ означает стремление получить исцеление от Господа; «просит» звучит по-русски естественнее буквального «ищет», сохраняя смысл обращения за помощью.
theological_decisions:
- issue: Расхождение между предоставленным еврейским текстом и греческим свидетельством данного стиха
  choice: Перевести соответствующий контексту текст греческого свидетельства и отметить расхождение в сноске.
  alternative: 'Перевести предоставленную еврейскую строку: «Всё я взвесил на чаше весов и не нашёл ничего легче отрубей».'
  rationale: Предоставленная еврейская строка содержательно не соответствует Сир 28:3 и контексту наставления о гневе и прощении. Греческое свидетельство содержит связный текст этого стиха. Выбор источника раскрыт, а не скрыт.
- issue: Риторическая сила вопроса
  choice: Сохранить вопросительную форму.
  alternative: Передать как утвердительное осуждение.
  rationale: 'Греческий текст оформляет мысль как вопрос, обличающий внутреннее противоречие: человек удерживает гнев, но ожидает исцеления от Господа.'
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной и обличительной интонацией. Повтор «человек… на человека» намеренно сохранён; «таит гнев» передаёт продолжительное удерживание злобы без излишней архаизации.
