review_pass:
  verdict: revise
  source_fidelity: '«Уже не угаснет» не передаёт усиленного будущего отрицания οὐ μὴ σβεσθῇ: по-русски оно обычно означает, что нечто больше не будет угасать, и может подразумевать предшествующее угасание. «Попадут в её власть» заметно истолковывает буквальное «впадут в неё» и сужает образ до подчинения силе. «Опустошит» точнее передаёт λυμανεῖται как причинение разорения, чем более конкретное «растерзает».'
  naturalness: Исправленный текст сохраняет современный литературный и возвышенный библейский регистр. Повторение местоимения «она» оправдано греческой анафорой и позволяет не подставлять в текст предполагаемый референт.
  terminology: «Господь» и «леопард» переданы корректно. Женский род «её/она» сохраняет грамматическую связь с подразумеваемым в контексте женским референтом, не навязывая толкования. В сноске отмечен вариант понимания ἐν αὐτοῖς.
  issues:
  - severity: medium
    issue: «Уже не угаснет»
    rationale: Это выражение имеет аспектуально-временной оттенок «не станет угасать впредь» и не выражает однозначно категорическое οὐ μή. Нужна формулировка «ни за что не угаснет» или «никогда не угаснет».
  - severity: medium
    issue: «Попадут в её власть»
    rationale: Добавляет идею власти и подчинения, которой нет в ἐμπεσοῦνται εἰς αὐτήν («впадут в неё»). Следует сохранить образ падения, пояснив референт в сноске.
  - severity: low
    issue: «Растерзает их»
    rationale: В контексте хищников возможно, но λυμαίνομαι шире и означает разорять, губить, опустошать. «Опустошит» точнее сохраняет эту широту.
