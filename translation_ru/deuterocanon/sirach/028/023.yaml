base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/023.yaml
  text: Those who forsake the Lord will fall into it[a], and it will burn among them and will certainly not be quenched; it will be sent against them like a lion[c][b], and like a leopard it will ravage them.
translation:
  language: ru
  text: Оставившие Господа впадут в неё[a]; она разгорится среди них[b] и ни за что не угаснет. Она будет послана против них, словно лев, и, словно леопард[c], опустошит их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение указывает на описанную выше губительную силу языка и злоречия.
    reason: cross_reference
  - marker: b
    text: 'Или: «разгорится в них».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «пантера».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ καταλείποντες Κύριον
  choice: оставившие Господа
  rationale: Причастие обозначает тех, кто оставляет или покидает Господа. «Оставившие» естественно по-русски и сохраняет религиозную серьёзность выражения без дополнительного конфессионального оттенка.
- source_word: ἐμπεσοῦνται εἰς αὐτήν
  choice: попадут в её власть
  rationale: Буквально — «впадут в неё». В данном контексте речь идёт о губительной силе языка; выражение «попадут в её власть» естественно передаёт попадание под её воздействие, сохраняя женский род местоимения.
- source_word: ἐν αὐτοῖς ἐκκαήσεται
  choice: она разгорится среди них
  rationale: ἐκκαίω означает «разжигать, воспламенять(ся)». Предлог ἐν допускает как пространственное «среди», так и более внутреннее «в них»; основной текст сохраняет образ распространяющегося среди людей огня.
- source_word: οὐ μὴ σβεσθῇ
  choice: уже не угаснет
  rationale: Конструкция οὐ μή с сослагательным наклонением выражает усиленное отрицание. «Уже не угаснет» естественно и решительно передаёт невозможность угасания.
- source_word: ἐξαποσταλήσεται ἐπʼ αὐτοῖς
  choice: будет послана против них
  rationale: Будущее страдательное ἐξαποστέλλω означает «будет послана», а ἐπί в данном контексте имеет враждебную направленность — «против них».
- source_word: ὡς λέων
  choice: словно лев
  rationale: Прямое и естественное воспроизведение сравнения.
- source_word: ὡς πάρδαλις
  choice: словно леопард
  rationale: πάρδαλις обозначает крупную пятнистую кошку; «леопард» — наиболее понятный современный русский эквивалент, тогда как «пантера» остаётся допустимым вариантом.
- source_word: λυμανεῖται αὐτούς
  choice: растерзает их
  rationale: Глагол выражает жестокое причинение вреда, разорение или уничтожение. «Растерзает» естественно продолжает образ хищного зверя, не ослабляя силы греческого выражения.
theological_decisions:
- issue: Референт αὐτήν и подразумеваемого подлежащего в последующих предложениях
  choice: Сохранить женское местоимение «она/её», отсылающее к губительной силе языка в ближайшем контексте.
  alternative: Повторить в основном тексте «язык» либо использовать безличное «это».
  rationale: Греческий текст не повторяет существительное, но сохраняет женский род. Русский язык позволяет естественно удержать эту связь местоимением, не подменяя неоднозначный образ явным толкованием.
- issue: Значение ἐν αὐτοῖς
  choice: «среди них»
  alternative: «в них»
  rationale: Оба понимания грамматически возможны. «Среди них» лучше передаёт распространяющийся огонь в контексте разрушительной речи, а вариант с внутренним смыслом отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изложения. Синтаксис сделан ясным для обычного читателя; образ огня и хищников сохранён. Местоимение женского рода удерживает связь с контекстом, не вводя в стих отсутствующее в нём существительное.
