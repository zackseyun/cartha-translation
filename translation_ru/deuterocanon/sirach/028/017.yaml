translation:
  language: ru
  text: Удар бича оставляет синяки[a], а удар языка сокрушит кости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кровоподтёки»; греческое слово обозначает следы, оставленные ударами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πληγὴ
  choice: удар
  rationale: В обоих полустишиях слово обозначает удар, а не только возникшую от него рану; повтор сохраняет строгий параллелизм греческого текста.
- source_word: μάστιγος
  choice: бича
  rationale: Родительный падеж указывает на орудие удара. «Бич» передаёт конкретный образ кнута или плети и соответствует возвышенному, но понятному регистру.
- source_word: ποιεῖ
  choice: оставляет
  rationale: Буквально глагол значит «делает, производит». В сочетании с рубцами естественное русское «оставляет» ясно выражает результат удара и сохраняет настоящее время.
- source_word: μώλωπας
  choice: рубцы
  rationale: Слово обозначает следы от ударов — кровоподтёки, синяки или рубцы. В контексте бича «рубцы» создаёт наиболее конкретный образ; лексическая широта отмечена в сноске.
- source_word: γλώσσης
  choice: языка
  rationale: 'Сохранена конкретная метонимия греческого текста: язык означает пагубную речь. Это удерживает образ и контраст с бичом.'
- source_word: συγκλάσει
  choice: сокрушит
  rationale: Будущее время сохранено, а приставочный глагол передан сильным «сокрушит», то есть «сломает, раздробит». Так сохраняются нарастание образа и отличие от настоящего времени первого полустишия.
- source_word: ὀστᾶ
  choice: кости
  rationale: Прямой образ греческого текста сохранён без добавочного толкования.
