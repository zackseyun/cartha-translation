  source_fidelity: Текст точно передаёт общий субъект ὁ προσέχων αὐτῇ («кто прислушивается к ней»), усиленное отрицание οὐ μή («никогда не найдёт») и параллельное второе следствие. «Покой» удачно соответствует ἀνάπαυσις. Формулировка «не будет жить спокойно» несколько более развернута, чем образ κατασκηνώσει, но в данном контексте верно выражает невозможность спокойного, устойчивого пребывания; буквальный образ надлежащим образом отмечен в сноске.
