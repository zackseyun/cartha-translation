lexical_decisions:
- source_word: ὁ προσέχων αὐτῇ
  choice: Кто прислушивается к ней
  rationale: Причастная конструкция обозначает любого, кто склонен внимать ей. Местоимение «ней» сохраняет женский род греческого αὐτῇ и связь с упомянутым в контексте языком как источником злословия.
- source_word: οὐ μὴ εὑρῇ ἀνάπαυσιν
  choice: никогда не найдёт покоя
  rationale: Сочетание οὐ μή с сослагательным наклонением выражает усиленное отрицание; «никогда не найдёт» естественно передаёт его категоричность. «Покой» охватывает отдых, облегчение и внутреннее успокоение.
- source_word: οὐδὲ κατασκηνώσει μεθʼ ἡσυχίας
  choice: и не будет жить спокойно
  rationale: Глагол κατασκηνόω буквально связан с размещением лагеря или постоянным пребыванием, а ἡσυχία означает тишину и невозмутимость. В данном образном контексте выражение «не будет жить спокойно» ясно передаёт смысл, а буквальный образ отмечен в сноске.
