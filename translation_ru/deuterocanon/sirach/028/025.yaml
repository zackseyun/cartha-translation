lexical_decisions:
- source_word: λόγοις
  choice: слов
  rationale: В данном наставлении λόγοις обозначает произносимые человеком слова; прямой русский эквивалент сохраняет конкретность выражения.
- source_word: ζυγὸν
  choice: весы
  rationale: Хотя ζυγός часто означает «ярмо», в сочетании со σταθμός здесь возникает образ взвешивания; «весы» естественно передают этот смысл.
- source_word: σταθμόν
  choice: гирю
  rationale: σταθμός может обозначать весовую меру или гирю. «Гиря» сохраняет конкретный образ взвешивания и образует ясную пару со словом «весы».
- source_word: στόματί
  choice: уст
  rationale: Сохраняется буквальный образ части тела, на которую ставят преграду; «уста» поддерживает достоинство библейского регистра без архаической неясности.
- source_word: θύραν
  choice: дверь
  rationale: Прямой эквивалент сохраняет образ преграды, закрывающей выход словам.
- source_word: μοχλόν
  choice: засов
  rationale: μοχλός обозначает брус или запор, которым закрепляют дверь; «засов» точно и естественно передаёт этот образ по-русски.
- source_word: ποίησον
  choice: сделай
  rationale: Простой императив сохраняет повтор и параллельное построение греческого текста.
