  text: A third tongue has driven out strong women[a], and has deprived them of the fruit of their labor;
translation:
  language: ru
  text: Третий язык[a] изгнал мужественных женщин и лишил их плодов их труда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «язык, сеющий раздор»; или: «клеветнический язык». По-гречески буквально: «третий язык» — вероятно, речь идёт о злоречии, которое вмешивается как третья сторона и разлучает людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα τρίτη
  choice: третий язык
  rationale: Сохранён буквальный и образный греческий оборот; вероятно, он обозначает злоречие или клевету, вмешивающуюся между людьми как третья сторона.
- source_word: γυναῖκας ἀνδρείας
  choice: мужественных женщин
  rationale: Прилагательное ἀνδρείας передаёт силу и отвагу. «Мужественных» сохраняет выраженную в греческом характеристику и естественно звучит по-русски.
- source_word: ἐξέβαλεν
  choice: изгнал
  rationale: Глагол означает «выгнать, изгнать»; совершенный вид соответствует греческому аористу и силе действия.
- source_word: ἐστέρεσεν
  choice: лишил
  rationale: Глагол выражает лишение чего-либо; русский вариант краток и точно передаёт смысл.
- source_word: τῶν πόνων αὐτῶν
  choice: плодов их труда
  rationale: Буквально — «их трудов». После глагола «лишил» речь, вероятнее всего, идёт о достигнутом тяжёлым трудом; слово «плодов» делает эту связь ясной, не меняя основного смысла.
