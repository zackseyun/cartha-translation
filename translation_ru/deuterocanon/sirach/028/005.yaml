  text: He, being flesh, keeps wrath; who then will make atonement for his sins?[c][b][a]
translation:
  language: ru
  text: Он сам, будучи смертным, хранит гнев[b]; кто же совершит искупление[c] за его грехи?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст этой строки труден и, по-видимому, повреждён либо крайне сокращён. В греческом параллельном тексте сказано: «Он сам, будучи смертным, хранит гнев; кто совершит искупление за его грехи?» Перевод следует этому восстанавливаемому смыслу.'
    reason: textual_variant
  - marker: b
    text: 'Или: «держится за злобу».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «кто простит его грехи?» Греческий глагол точнее передаёт мысль об искуплении или очищении от грехов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַל מֵחָתָן, אֹרֵחַ מַכְנִיס אֹרֵחַ
  choice: перевод по греческому параллельному тексту
  rationale: Сохранившийся еврейский текст этой строки в каирских рукописях связно не читается и, по-видимому, повреждён либо крайне эллиптичен. Поэтому для восстановления смысла использован древний греческий параллельный текст.
- source_word: αὐτὸς σὰρξ ὢν
  choice: Сам он, будучи плотью
  rationale: «Плоть» сохраняет конкретный библейский образ человеческой бренности и слабости, не превращая его в специальный термин для греховной природы.
- source_word: διατηρεῖ μῆνιν
  choice: таит гнев
  rationale: Глагол передаёт продолжительное удерживание чувства, а сочетание «таит гнев» естественно по-русски выражает затаённую, сохраняемую враждебность.
- source_word: τίς ἐξιλάσεται
  choice: кто же совершит искупление
  rationale: Греческий глагол означает умилостивление или очищение от греха, а не просто межличностное прощение. Формулировка сохраняет богословскую содержательность вопроса.
- source_word: τὰς ἁμαρτίας αὐτοῦ
  choice: за его грехи
  rationale: Это обычное значение греческого выражения; предлог «за» требуется естественным русским управлением при сочетании «совершить искупление».
theological_decisions:
- issue: Значение σάρξ в контексте премудростной литературы
  choice: будучи плотью
  alternative: будучи смертным
  rationale: Здесь речь идёт о человеческой бренности, а не о техническом учении о «греховной природе». Буквальный образ сохраняет напряжение между слабостью человека и его упорством в гневе.
- issue: Искупительный смысл ἐξιλάσεται
  choice: совершит искупление
  alternative: простит
  rationale: Выбранный вариант сохраняет значение очищения или искупления грехов и не сводит вопрос к обычному прощению, при этом не уточняет, кто именно должен совершить искупление.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краток и афористичен; «плоть», «гнев», «искупление» сохраняют образность и богословское напряжение греческого свидетельства.
