base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/019.yaml
  text: Blessed is the one sheltered from it[a], who has not passed through its wrath, who has not drawn its yoke, and has not been bound in its chains.
translation:
  language: ru
  text: Блажен тот, кто защищён от него[a], кто не прошёл сквозь его ярость, не влачил его ярма и не был скован его цепями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте все местоимения в этом стихе стоят в женском роде, поскольку относятся к слову «язык», которое по-гречески женского рода; речь идёт о губительном языке из предшествующего контекста.
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: Блажен
  rationale: Сохраняет характерную для литературы мудрости форму блаженства и передаёт больше, чем субъективное «счастлив».
- source_word: σκεπασθεὶς
  choice: защищён
  rationale: Страдательное причастие обозначает того, кто укрыт и ограждён от опасности; «защищён» естественно звучит по-русски и сохраняет пассивную форму.
- source_word: ἀπʼ αὐτῆς
  choice: от него
  rationale: Местоимение относится к упомянутому в предшествующем контексте губительному языку. В греческом оно женского рода по роду слова γλῶσσα, тогда как русское «язык» требует мужского рода.
- source_word: διῆλθεν ἐν τῷ θυμῷ αὐτῆς
  choice: не прошёл сквозь его ярость
  rationale: Сохраняется образ прохождения через переживание, а θυμός передаётся как сильная, разрушительная «ярость».
- source_word: εἵλκυσεν
  choice: не тащил
  rationale: Передаёт прямое значение «тянуть, тащить», не сглаживая необычный образ ярма.
- source_word: ζυγὸν
  choice: ярма
  rationale: Сохраняет конкретный и метафорически насыщенный образ подчинения и рабства.
- source_word: δεσμοῖς
  choice: цепями
  rationale: Ясно и наглядно передаёт узы или оковы и согласуется с образом порабощения.
- source_word: ἐδέθη
  choice: не был скован
  rationale: Сохраняет страдательный залог и образ лишения свободы; в сочетании с «цепями» естественнее буквального «связан».
theological_decisions:
- issue: Референт местоимений женского рода в греческом тексте
  choice: 'Местоимения отнесены к губительному языку из ближайшего контекста и в русском поставлены в мужском роде: «него», «его».'
  alternative: Сохранить грамматический женский род греческого текста («неё», «её»), подразумевая персонифицированную губительную речь.
  rationale: Женский род греческих форм обусловлен прежде всего существительным γλῶσσα («язык»), которое в греческом женского рода. Русское соответствие «язык» — мужского рода, поэтому смена рода необходима для ясной и естественной связи с контекстом и не устраняет самой персонификации.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным поучению мудрости. Образы прохождения сквозь ярость, ярма и цепей сохранены без конфессионального истолкования.
