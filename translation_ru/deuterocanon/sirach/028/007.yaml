  text: Remember the commandments[a], and do not be angry with your neighbor; remember the covenant of the Most High, and overlook ignorance.
translation:
  language: ru
  text: Помни заповеди и не гневайся на ближнего; помни[a] завет Всевышнего и прости неведение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте второе «помни» не повторено, но подразумевается по смыслу.
    reason: syntactic_clarity
  - marker: b
    text: 'Буквально: «неведение». В контексте: не вменяй в вину то, что совершено по незнанию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μνήσθητι
  choice: Помни
  rationale: Аористный императив призывает сознательно помнить и принимать во внимание. «Помни» прямо, естественно и сохраняет повелительную форму.
- source_word: ἐντολῶν
  choice: заповеди
  rationale: В нравственно-религиозном контексте «заповеди» точнее передаёт ἐντολαί, чем более общее «повеления»; отсутствующее в греческом уточнение «Закона» не добавляется.
- source_word: μὴ μηνίσῃς
  choice: не гневайся
  rationale: Запрет с μή передаёт повеление не испытывать и не питать гнева. Формулировка естественна в современном русском и не усиливает значение до «не ярись».
- source_word: τῷ πλησίον
  choice: на ближнего
  rationale: В этическом контексте πλησίον означает «ближний»; управление «гневаться на кого-либо» соответствует русской норме.
- source_word: διαθήκην Ὑψίστου
  choice: завет Всевышнего
  rationale: διαθήκη в библейском греческом обычно означает «завет». Родительный падеж Ὑψίστου сохранён без истолковывающего изменения на «завет со Всевышним».
- source_word: πάριδε
  choice: оставь без внимания
  rationale: Императив имеет значение «пройти мимо, не принять во внимание, не поставить в вину». Эта формулировка передаёт призыв к снисхождению, не утверждая, будто проступка вовсе не было.
- source_word: ἄγνοιαν
  choice: неведение
  rationale: Существительное буквально означает отсутствие знания, неведение. Контекст допускает смысл проступка, совершённого по неведению, однако основной текст сохраняет лексическую открытость оригинала.
theological_decisions:
- issue: Эллипсис глагола перед «заветом Всевышнего»
  choice: Повторить «помни» перед словами «завет Всевышнего».
  alternative: Оставить бессоюзную именную конструкцию без повторения глагола.
  rationale: В греческом второе «помни» формально не повторено, но по смысловой параллели начальный императив относится и к завету. Повторение делает русскую фразу грамматически ясной, не добавляя нового богословского содержания.
- issue: Значение ἄγνοιαν в контексте прощения
  choice: Сохранить буквальное «неведение», пояснив возможный контекстуальный смысл в сноске.
  alternative: Перевести в основном тексте как «проступок по неведению».
  rationale: Контекст, вероятно, подразумевает обиду или проступок, вызванный неведением, но само греческое существительное не называет проступок прямо. Сохранение «неведения» не снимает эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с лаконичным, наставительным и достойным звучанием. Слова «заповеди», «завет», «Всевышний» и «ближний» сохраняют естественный библейский регистр без архаической грамматики.
