translation:
  language: ru
  text: Перед ним был уголь; он подул на него[a], и уголь разгорелся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой версии: «Если подуешь на искру, она разгорится; а если плюнешь на неё, она погаснет; и то и другое исходит из твоих уст». Еврейский текст короче: «Перед ним был уголь; он подул на него, и уголь разгорелся».'
    reason: alternative_reading
lexical_decisions:
- source_word: הָיְתָה
  choice: лежал
  rationale: В сочетании с предметом и обстоятельством места экзистенциальная конструкция естественно передаётся по-русски глаголом «лежал», без излишнего акцента на возникновении.
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Сохраняет наиболее естественное значение предлога и мужской единственный суффикс еврейского текста.
- source_word: גַחֶלֶת
  choice: горячий уголь
  rationale: גחלת обозначает тлеющий или раскалённый уголь; определение «горячий» ясно передаёт способность угля разгореться и звучит естественнее буквального «уголь» без уточнения.
- source_word: נָפַח בָּה
  choice: он подул на него
  rationale: Передаёт конкретное действие раздувания огня; русское местоимение согласовано со словом «уголь».
- source_word: וּבָעֲרָה
  choice: и тот разгорелся
  rationale: «Разгорелся» выражает переход к более сильному горению вследствие дуновения; «тот» устраняет неясность местоименной отсылки.
- source_word: ἐὰν φυσήσῃς σπινθῆρα ἐκκαήσεται
  choice: учтено в примечании, но не принято в основном тексте
  rationale: Греческая параллель содержит более пространную форму изречения во втором лице и говорит об искре. Поскольку сохранился еврейский текст, основной перевод следует ему, а греческое разночтение приводится в сноске.
