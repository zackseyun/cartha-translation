    reason: lexical_alternative
  - marker: b
    text: Предоставленный еврейский фрагмент по смыслу не соответствует Сир 28:2 и, по-видимому, относится к другому месту. Поэтому основой перевода здесь служит греческое свидетельство.
    reason: textual_variant
lexical_decisions:
- source_word: ἄφες
  choice: Прости
  rationale: Аористный императив означает «отпусти, прости». В контексте проступка ближнего естественное русское соответствие — «прости».
- source_word: ἀδίκημα
  choice: проступок
  rationale: Слово обозначает совершённую несправедливость, обиду или неправое дело. «Проступок» ясно передаёт конкретное нарушение, не уточняя сверх текста его характер.
- source_word: τῷ πλησίον σου
  choice: ближнему своему
  rationale: В этическом контексте πλησίον — «ближний». Эта формулировка сохраняет библейский нравственный регистр и остаётся понятной современному читателю.
- source_word: δεηθέντος σου
  choice: когда ты помолишься
  rationale: Генитив абсолютный указывает на время обращения с мольбой. «Когда ты помолишься» естественно передаёт религиозный смысл прошения к Богу.
- source_word: αἱ ἁμαρτίαι σου λυθήσονται
  choice: грехи твои будут отпущены
  rationale: Глагол λύω буквально значит «развязывать, освобождать, отпускать». «Будут отпущены» сохраняет образ освобождения и одновременно естественно звучит в русском языке применительно к грехам.
theological_decisions:
- issue: Выбор первичного текста для Сир 28:2
  choice: Перевести греческий параллельный текст как источник, соответствующий Сир 28:2, и отметить несоответствие предоставленного еврейского фрагмента.
  alternative: Перевести предоставленный еврейский текст как Сир 28:2.
  rationale: Предоставленный еврейский текст говорит о том, кто завтра может исчезнуть и скорбит о не принадлежащем ему мире; по смыслу он не соответствует Сир 28:2. Греческий текст содержит связное и традиционно засвидетельствованное чтение данного стиха. Поэтому перевод следует греческому свидетельству, а расхождение открыто отмечено.
- issue: Метафора в λυθήσονται
  choice: Передать как «будут отпущены».
  alternative: Передать истолковывающе как «будут прощены» или буквально как «будут развязаны».
  rationale: «Отпущены» сохраняет как образ освобождения, так и естественный для контекста смысл прощения, не сводя неоднозначность греческого глагола только к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формы «ближнему своему» и «грехи твои» сохраняют достоинство и ритм изречения, не затрудняя понимания.
