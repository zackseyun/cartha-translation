  yaml_path: translation/deuterocanon/sirach/028/009.yaml
  text: For an angry man kindles strife[a], and a sinful man stirs up friends[b], and among those making peace he casts slander.
translation:
  language: ru
  text: Ведь вспыльчивый человек разжигает ссору, грешник вносит смуту в отношения друзей, а среди живущих в мире[a] распространяет клевету.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди тех, кто устанавливает мир». Греческое εἰρηνευόντων может обозначать как живущих в мире, так и содействующих примирению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: θυμώδης
  choice: вспыльчивый
  rationale: Прилагательное обозначает человека, склонного к гневу, с горячим нравом. «Вспыльчивый» естественно передаёт устойчивую черту характера, а не единичное состояние гнева.
- source_word: ἐκκαύσει μάχην
  choice: разжигает ссору
  rationale: «Разжигает» сохраняет огненную метафору ἐκκαίω, а «ссора» передаёт μάχη как межличностный раздор в контексте наставления мудрости.
- source_word: ἁμαρτωλός
  choice: грешник
  rationale: Существительное «грешник» кратко и естественно передаёт субстантивированную характеристику человека и сохраняет нравственную оценку греческого слова.
- source_word: ταράξει φίλους
  choice: вносит смуту в отношения друзей
  rationale: ταράσσω означает тревожить, приводить в смятение или расстраивать. Формулировка поясняет, что грешник нарушает дружеские отношения, не добавляя мысли о физическом конфликте.
- source_word: εἰρηνευόντων
  choice: живущих в мире
  rationale: Причастие от εἰρηνεύω может обозначать тех, кто пребывает в мирных отношениях или поддерживает мир. В данном контексте «живущих в мире» естественно выражает основное значение, а возможное деятельное понимание отмечено в сноске.
- source_word: ἐκβάλλει διαβολήν
  choice: распространяет клевету
  rationale: διαβολή — клевета или порочащее обвинение. Буквальное «бросает клевету» по-русски неестественно, поэтому выбран ясный динамический эквивалент, передающий внесение клеветы в мирное сообщество.
- source_word: ἄνθρωπος / ἀνήρ
  choice: человек / грешник
  rationale: Первое существительное естественно передано как «человек», а сочетание ἀνὴρ ἁμαρτωλός — как «грешник». Это сохраняет обобщающий характер изречения без ненужного повторения слова «мужчина».
theological_decisions:
- issue: Значение εἰρηνευόντων
  choice: те, кто живёт в мире
  alternative: те, кто примиряет других
  rationale: Глагол εἰρηνεύω часто означает «быть в мире, жить мирно»; вместе с тем форма допускает оттенок деятельного миротворчества. Основной текст сохраняет наиболее прямое контекстуальное прочтение, а альтернативу сообщает сноска.
- issue: Обобщающие обозначения человека
  choice: Передать ἄνθρωπος как «человек», а ἀνὴρ ἁμαρτωλός как «грешник»
  alternative: «муж» или «мужчина» в обеих параллельных частях
  rationale: Изречение имеет обобщающий нравственный смысл. Современная русская формулировка передаёт его без утверждения, будто речь относится исключительно к мужчинам, и не меняет богословского содержания.
translation_notes:
  register: Современный литературный русский язык; краткий назидательный строй и параллелизм сохранены. Настоящее время употреблено как естественная для русской пословичной мудрости форма, передающая обобщающее значение греческих будущих форм.
