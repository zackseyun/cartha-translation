translation:
  language: ru
  text: Берегись, чтобы не оступиться в ней[a] и не упасть перед тем, кто притаился в засаде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в ней». Местоимение отсылает к женскому существительному в предшествующем контексте; вероятно, к языку, то есть речи.'
    reason: Сохраняет буквальное значение ἐν αὐτῇ и не превращает контекстуальную отсылку в причинное толкование.
lexical_decisions:
- source_word: πρόσεχε
  choice: Смотри
  rationale: Краткое современное предостережение, передающее значение «будь внимателен, остерегайся».
- source_word: μὴ πῶς ὀλισθήσῃς ἐν αὐτῇ
  choice: не оступись из-за языка
  rationale: ὀλισθήσῃς метафорически означает «оступиться». Оборот ἐν αὐτῇ допускает буквальное «в ней» и инструментально-причинное понимание; по контексту местоимение указывает на язык, поэтому ясное русское выражение «из-за языка» сохраняет смысл предостережения.
- source_word: κατέναντι ἐνεδρεύοντος
  choice: перед тем, кто подстерегает тебя
  rationale: κατέναντι передано как «перед», а субстантивированное причастие ἐνεδρεύοντος — как действующее лицо, устроившее засаду; «тебя» естественно выражает подразумеваемый объект подстерегания.
