lexical_decisions:
- source_word: Ἀπόσχου
  choice: Держись подальше
  rationale: Аористный императив среднего залога передаёт призыв сознательно устраняться и не ввязываться; выражение естественно для современного русского языка.
- source_word: μάχης
  choice: от ссоры
  rationale: μάχη может обозначать как борьбу, так и спор или распрю; в данном нравоучительном контексте «ссора» ясно передаёт межличностный конфликт, ведущий к грехам.
- source_word: ἐλαττώσεις
  choice: уменьшишь число
  rationale: Будущее время указывает на результат воздержания от ссоры. Добавление «число» позволяет естественно по-русски сохранить переходность глагола и множественное число дополнения.
- source_word: ἁμαρτίας
  choice: грехов
  rationale: Множественное число обозначает отдельные греховные поступки; родительный падеж обусловлен русской конструкцией «уменьшить число».
