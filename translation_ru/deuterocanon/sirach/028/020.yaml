  text: Ибо ярмо его — железное ярмо[a], и узы его — бронзовые узы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. «её»: слово «язык» в греческом имеет женский род; в русском местоимение согласовано со словом «язык».'
    reason: Поясняет различие грамматического рода при сохранении естественного русского согласования.
lexical_decisions:
- source_word: ζυγός
  choice: ярмо
  rationale: Сохраняет конкретный образ тяжёлого подчинения; более общее «бремя» ослабило бы метафору.
- source_word: σιδηροῦς
  choice: железное
  rationale: Прямо передаёт материал и сохраняет краткую, выразительную форму греческого текста.
- source_word: δεσμοί
  choice: узы
  rationale: Передаёт общее значение пут и скрепляющих оков, не сужая его до буквальных цепей.
- source_word: χαλκεῖοι
  choice: бронзовые
  rationale: Греческое слово обозначает сделанное из меди или бронзы; «бронзовые» естественно звучит применительно к древним металлическим оковам.
- source_word: αὐτῆς
  choice: её
  rationale: Повторённое местоимение женского рода сохраняет олицетворённый образ губительного языка или речи, представленный в греческом контексте.
theological_decisions:
- issue: Сохранение женского олицетворения
  choice: «её» в обоих случаях
  alternative: «его» при согласовании с русским словом «язык»
  rationale: Форма αὐτῆς в греческом тексте женского рода и поддерживает литературный образ губительной речи как порабощающей силы. В основном тексте этот образ сохранён, а грамматически обусловленная русская альтернатива отмечена в сноске без догматизации.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Синтаксический параллелизм и повтор существительных сохранены; «ярмо» и «узы» понятны в контексте и удерживают конкретность исходной метафоры.
