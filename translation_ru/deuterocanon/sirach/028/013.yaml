base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/013.yaml
  text: Curse the whisperer and the double-tongued[a], for they have destroyed many who were at peace.
translation:
  language: ru
  text: Прокляните тайного клеветника и двуличного человека[a], ведь они погубили многих, живших в мире.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст здесь труден и, по-видимому, буквально читается: «Плюнь на неё — и она погаснет; [оба они исходят из твоих уст]». Вероятно, это продолжение образа огня или искры из предыдущего стиха. Греческий текст вместо этого говорит: «Прокляните тайного клеветника и двуличного человека»; его более связное в данном контексте чтение принято в основном тексте.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ψίθυρον
  choice: тайного клеветника
  rationale: Греческое слово обозначает человека, который распространяет злоречие исподтишка, «шёпотом». Сочетание передаёт и вредоносность речи, и её скрытый характер, оставаясь понятным современному читателю.
- source_word: δίγλωσσον
  choice: двуязычного
  rationale: Сохранена греческая метафора двуличной, противоречивой речи; в контексте значение ясно и не требует замены более толковательным выражением.
- source_word: εἰρηνεύοντας
  choice: живших в мире
  rationale: Причастие описывает людей, пребывавших в состоянии мира. Русская формулировка естественна и сохраняет его глагольный оттенок.
- source_word: רָקַק בָּהּ וְכָבְתָה
  choice: плюнь на него — и он погаснет
  rationale: Это буквальное значение сохранившегося еврейского текста приведено в примечании, поскольку оно резко расходится с греческим свидетельством и, вероятно, продолжает образ огня из предыдущего стиха.
- source_word: '[וּשְׁנֵיהֶם מִפִּיךָ הֵם]'
  choice: '[и то и другое исходит из твоих уст]'
  rationale: Скобки отражают текстуальную неуверенность издания; перевод сохраняет и образ уст, и неопределённую парную отсылку еврейской фразы.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческого параллельного свидетельства
  choice: В основном тексте передано связное греческое предостережение против тайного клеветника и двуязычного человека.
  alternative: «Плюнь на него — и он погаснет; [и то и другое исходит из твоих уст]».
  rationale: Еврейское чтение первично как непосредственное свидетельство, однако здесь оно трудно, частично заключено издателем в скобки и, по-видимому, представляет иной либо повреждённый текст. Греческое чтение образует цельное изречение и соответствует контексту о разрушительной речи. Расхождение не скрыто, а явно зафиксировано в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. «Тайный клеветник» яснее нейтрального «шептун» и передаёт скрытое злоречие; «двуязычный» намеренно сохраняет исходную метафору. Союз «ведь» естественно выражает пояснительное γάρ.
