review_pass:
  verdict: revise
  source_fidelity: 'Основной текст обоснованно следует связному греческому параллельному чтению: «прокляните» передаёт καταράσθε, а заключительная часть верно передаёт πολλοὺς γὰρ εἰρηνεύοντας ἀπώλεσαν. Примечание честно фиксирует резкое расхождение с дошедшим еврейским текстом. В еврейской цитате местоимение должно быть женского рода («на неё — и она погаснет»), поскольку речь, по-видимому, продолжает образ огня/искры из предыдущей строки; «на него» необоснованно меняет референцию.'
  naturalness: «Двуязычный» в современном русском означает человека, владеющего двумя языками, и потому не передаёт греческое δίγλωσσος в значении двуличного, неискреннего в речи человека. «Двуличный человек» естественно и ясно передаёт этический смысл. «Тайный клеветник» понятен, хотя несколько тяжеловесен; в паре с «двуличным человеком» он сохраняет наставительный регистр.
  terminology: «Двуличный человек» является безопасной современной передачей δίγλωσσον; это не вводит конфессионального толкования и избегает ложного значения «двуязычный». Образную неоднозначность еврейского чтения следует оставить в примечании, включая редакторские квадратные скобки.
  issues:
  - severity: high
    issue: «Двуязычного» — ложный друг для δίγλωσσον.
    rationale: В русском это прежде всего «владеющего двумя языками», тогда как греческое слово здесь обозначает человека с двойственной, двуличной речью.
  - severity: medium
    issue: В сноске еврейское בָּהּ передано как «на него».
    rationale: Форма местоимения женского рода; в контексте вероятен продолжающийся образ искры или огня. Следует перевести «на неё — и она погаснет», не подменяя референт мужским лицом.
  - severity: low
    issue: Фраза «и то и другое исходит» недостаточно буквально передаёт множественное «оба они».
    rationale: «Оба исходят из твоих уст» лучше сохраняет грамматическую форму, при этом не решая спорный референт.
  revised_text: Прокляните тайного клеветника и двуличного человека[a], ведь они погубили многих, живших в мире.
