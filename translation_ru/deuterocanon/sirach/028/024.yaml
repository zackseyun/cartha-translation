  text: 'Смотри: огради своё владение тернием; серебро своё и золото свяжи.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обнеси своё имущество изгородью из колючего кустарника»; «серебро своё и золото закрепи». Греческий текст сохраняет конкретный, пословичный образ тщательной охраны ценностей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: Смотри
  rationale: Краткое повелительное слово привлекает внимание и сохраняет прямоту греческого выражения.
- source_word: περίφραξον
  choice: огради
  rationale: Глагол обозначает окружение оградой; «огради» естественно передаёт конкретный образ защиты.
- source_word: τὸ κτῆμά σου
  choice: своё владение
  rationale: κτῆμα означает принадлежащее человеку имущество или владение; в сочетании с оградой «владение» сохраняет пространственно-конкретный образ.
- source_word: ἀκάνθαις
  choice: колючками
  rationale: 'Дательный падеж имеет инструментальное значение: ограда создаётся из колючих растений. «Колючками» звучит естественно и не уточняет вид растений сверх греческого текста.'
- source_word: τὸ ἀργύριόν σου
  choice: серебро своё
  rationale: Сохранено буквальное название металла, образующее параллель с золотом; обобщение «деньги» здесь не требуется.
- source_word: καὶ τὸ χρυσίον
  choice: и золото
  rationale: Передано конкретное название драгоценного металла, без обобщения до богатства.
- source_word: κατάδησον
  choice: надёжно свяжи
  rationale: Глагол передаёт связывание или закрепление; наречие «надёжно» выражает усилительное значение приставки и делает смысл команды ясным, сохраняя её конкретный образ.
