translation:
  language: ru
  text: Она никогда не одолеет благочестивых[a], и они не будут обожжены в её пламени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Она никогда не завладеет благочестивыми». Греческий глагол может означать «схватить», «овладеть» или «возобладать над».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ
  choice: никогда не
  rationale: Эмфатическое отрицание οὐ μή с аористом сослагательного наклонения выражает решительное отрицание будущего; «никогда не» естественно передаёт эту силу по-русски.
- source_word: κρατήσῃ
  choice: одолеет
  rationale: κρατέω может означать «схватить», «овладеть» или «возобладать над». В образном контексте разрушительной силы языка «одолеет» передаёт значение враждебного превосходства, не сводя его к физическому захвату.
- source_word: εὐσεβῶν
  choice: благочестивых
  rationale: Субстантивированное родительное множественного числа обозначает людей, почитающих Бога и живущих соответственно; «благочестивых» сохраняет религиозно-нравственный смысл и соответствует достоинству текста.
- source_word: φλογὶ
  choice: пламени
  rationale: φλόξ обозначает именно пламя, а не огонь вообще; этот выбор сохраняет конкретность и выразительность образа.
- source_word: καήσονται
  choice: сгорят
  rationale: Будущая пассивная форма обозначает, что люди подвергнутся действию огня. Русское «сгорят» естественно выражает это в данном образе, не добавляя отдельного утверждения о полном уничтожении.
theological_decisions:
- issue: Референт местоимения αὐτῆς («её» / «его»).
  choice: «её», с отнесением к языку, представленному в ближайшем контексте как губительная огненная сила.
  alternative: «его», если местоимение относить к безлично понимаемому огню или разрушительному действию.
  rationale: Греческое αὐτῆς — местоимение женского рода, согласованное с γλῶσσα («язык», в греческом женского рода) в контексте. Русское «её пламя» сохраняет связь с языком и образность исходного текста, хотя русское существительное «язык» мужского рода; местоимение здесь естественно продолжает олицетворённый образ подразумеваемой силы.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной синтаксической формой. «Благочестивых» сохраняет библейский религиозно-нравственный оттенок, а «одолеет» остаётся понятным без архаизации.
