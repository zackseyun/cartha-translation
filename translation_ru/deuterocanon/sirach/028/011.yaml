lexical_decisions:
- source_word: ἔρις
  choice: ссора
  rationale: Передаёт межличностный раздор или препирательство естественным современным русским словом.
- source_word: κατασπευδομένη
  choice: поспешно раздуваемая
  rationale: Сохраняет значение намеренно или усиленно ускоряемого развития ссоры; страдательная форма первого причастия отражена словом «раздуваемая».
- source_word: ἐκκαίει πῦρ
  choice: разжигает огонь
  rationale: Близко воспроизводит греческий образ воспламенения и естественно звучит по-русски.
- source_word: μάχη
  choice: драка
  rationale: В данном параллелизме и при результате «проливает кровь» обозначает уже физическое столкновение, в отличие от словесной ссоры.
- source_word: κατασπεύδουσα
  choice: стремительно вспыхнувшая
  rationale: Передаёт активную форму второго причастия и поспешное, бурное развитие столкновения, не выравнивая её со страдательной формой первой строки.
- source_word: ἐκχέει αἷμα
  choice: проливает кровь
  rationale: Точное и идиоматичное соответствие греческому выражению.
