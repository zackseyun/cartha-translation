base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/028/006.yaml
  text: Remember the end[a], and stop being hostile; remember decay and death[b], and remain in the commandments.
translation:
  language: ru
  text: 'Помни о конце[a] и перестань враждовать; помни о тлении и смерти[b] и держись заповедей.


    [a] Буквально по-гречески: «последнее». Это выражение может означать конец жизни человека или конечный исход.


    [b] Приведённая здесь еврейская рукописная строка содержит другое изречение, приблизительно: «…отвечает на дело, прежде чем выслушает». По-видимому, это несоответствие места в источнике, а не обычный вариант текста данного стиха.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «последнее». Это выражение может означать конец жизни человека или конечный исход.'
    reason: lexical_alternative
  - marker: b
    text: 'Приведённая здесь еврейская рукописная строка содержит другое изречение, приблизительно: «…отвечает на дело, прежде чем выслушает». По-видимому, это несоответствие места в источнике, а не обычный вариант текста данного стиха.'
    reason: textual_variant
lexical_decisions:
- source_word: μνήσθητι
  choice: помни
  rationale: Прямо и естественно передаёт повеление помнить и размышлять; перед «о тлении и смерти» глагол повторён по-русски для ясности синтаксиса.
- source_word: τὰ ἔσχατα
  choice: о конце
  rationale: Греческое выражение буквально означает «последнее» или «последние вещи» и допускает как личный конец, так и конечный исход; краткий основной вариант сохраняет эту смысловую широту, а буквальное значение отмечено в сноске.
- source_word: παῦσαι ἐχθραίνων
  choice: перестань враждовать
  rationale: Передаёт прекращение продолжающейся вражды или враждебного поведения, не сужая значение до одного внутреннего чувства ненависти.
- source_word: καταφθοράν
  choice: тлении
  rationale: В сочетании со смертью слово обозначает разрушение, разложение и бренность; «тление» естественно передаёт тему смертности в контексте библейской мудрости.
- source_word: θάνατον
  choice: смерти
  rationale: Стандартное и точное соответствие греческому слову.
- source_word: ἔμμενε
  choice: держись
  rationale: Повеление выражает постоянство и верность; сочетание «держись заповедей» естественно для современного русского языка.
- source_word: ἐντολαῖς
  choice: заповедей
  rationale: Сохраняет религиозно-нравственный смысл, не добавляя отсутствующего в греческом тексте уточнения «Божьих».
theological_decisions:
- issue: Выбор основного свидетеля текста для данного стиха
  choice: Перевести связный текст греческого параллельного свидетеля, отметив несовпадение предоставленной еврейской строки в сноске.
  alternative: 'Перевести предоставленную еврейскую строку непосредственно: «И легче путника тот, кто отвечает на дело, прежде чем выслушает».'
  rationale: Еврейская строка семантически не соответствует Сир 28:6 в греческой традиции и, вероятно, попала сюда из другого места. Использование греческого текста позволяет передать засвидетельствованный стих, а сноска открыто сохраняет текстологическую неопределённость.
- issue: Значение τὰ ἔσχατα
  choice: «о конце» с пояснением смыслового диапазона в сноске
  alternative: «о последних вещах» или «о своём конце»
  rationale: Греческий текст не уточняет прямо, идёт ли речь только о личной смерти или о конечном исходе вообще. Перевод не добавляет притяжательного «своём» и не навязывает развитое эсхатологическое толкование.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным назидательным звучанием. «Перестань враждовать» понятно обычному читателю и сохраняет поведенческий оттенок греческого выражения; «держись заповедей» звучит естественнее буквального «оставайся в заповедях».
