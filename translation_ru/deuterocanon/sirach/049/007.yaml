translation:
  language: ru
  text: искоренять, сносить, уничтожать и разрушать[b], а также строить, насаждать и возвышать[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст завершается дополнительным положительным глаголом, который может означать «возвышать», «поднимать ввысь» или «делать недосягаемым и защищённым». В греческом тексте этого глагола нет: там ряд заканчивается словами «строить и насаждать».'
    reason: textual_variant
  - marker: b
    text: Эта строка намеренно перекликается с пророческим поручением в Иеремии 1:10, хотя еврейская формулировка Сираха не полностью с ним совпадает.
    reason: cross_reference
lexical_decisions:
- source_word: לנתוש
  choice: искоренять
  rationale: Глагол נתש означает вырывать с корнем; «искоренять» ясно передаёт образ и сохраняет связь с призванием Иеремии.
- source_word: לנתוץ
  choice: сносить
  rationale: נתץ часто обозначает разрушение или снос сооружений. «Сносить» сохраняет конкретность и отличает этот глагол от следующего להרוס.
- source_word: ולהאביד
  choice: уничтожать
  rationale: Каузативная форма אבד означает приводить к гибели или уничтожению; «уничтожать» прямо передаёт этот смысл.
- source_word: להרוס
  choice: разрушать
  rationale: הרס обозначает разрушение и разорение. «Разрушать» естественно завершает ряд глаголов суда, не устраняя смысловое пересечение с לנתוץ.
- source_word: וכן
  choice: а также
  rationale: וכן вводит уравновешивающую положительную часть поручения; «а также» естественно выражает этот переход в современном русском языке.
- source_word: לבנות
  choice: строить
  rationale: Прямое значение בנה; вариант «восстанавливать» добавил бы отсутствующий в еврейском тексте оттенок повторного строительства.
- source_word: לנטע
  choice: насаждать
  rationale: «Насаждать» сохраняет образ посадки и торжественный пророческий регистр, оставаясь понятным современному читателю.
- source_word: ולהשגיב
  choice: возвышать
  rationale: Форма от שגב может означать поднимать на высоту, возвышать или делать недосягаемым и защищённым. «Возвышать» сохраняет семантическую открытость, не сводя слово только к прославлению или безопасности.
theological_decisions:
- issue: Отсылка к пророческому поручению Иеремии
  choice: Сохранить последовательность инфинитивов и её ритм, следуя конкретной формулировке еврейского текста Сираха.
  alternative: Приблизить русский текст к привычной формулировке Иеремии 1:10 или принять более краткую греческую последовательность.
  rationale: Еврейский текст явно перекликается с Иеремией 1:10, но не во всём совпадает с ним. Перевод сохраняет отсылку, не подменяя текст Сираха формулировкой другого места.
- issue: Конечное ולהשגיב при более кратком греческом тексте
  choice: Включить «возвышать» в основной текст и отметить расхождение в сноске.
  alternative: Опустить последний глагол вслед за греческим текстом либо конкретизировать его как «обезопасить» или «вознести».
  rationale: Сохранившийся еврейский источник имеет приоритет. При этом отсутствие соответствующего глагола в греческой параллели и широта значения שגב требуют сноски и осторожного перевода.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Цепочка инфинитивов сохранена; устаревшие и конфессионально окрашенные формулы не использованы.
