translation:
  language: ru
  text: 'Сим, Сиф и Енос удостоились чести,

    а превыше всего живого — их слава.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская заключительная фраза трудна; буквальная передача допускает: «превыше всего живого — их слава». В греческом тексте: «Сим и Сиф прославились среди людей, а выше всякого живого существа в творении — Адам».'
    reason: Греческая параллель опускает Еноса и вместо неясного еврейского местоименного выражения называет Адама.
lexical_decisions:
- source_word: נפקדו
  choice: удостоились чести
  rationale: В данном хвалебном контексте глагол передаёт почётное упоминание или признание; такой перевод естественнее буквального «были упомянуты» и согласуется с греческим ἐδοξάσθησαν.
- source_word: תפארת
  choice: слава
  rationale: Обычное значение существительного — «слава, великолепие, краса»; «слава» сохраняет возвышенный контекст перечисления праотцов.
- source_word: עמם
  choice: их слава
  rationale: Масоретизированное чтение составного еврейского текста допускает понимание עם суффиксом «их/с ними». Перевод следует засвидетельствованному еврейскому тексту, не заменяя его греческим упоминанием Адама.
theological_decisions:
- issue: 'Кого называет заключительная строка: трёх праотцов или Адама'
  choice: их слава
  alternative: слава Адама
  rationale: Еврейский источник прямо содержит עמם, тогда как греческая параллель имеет Ἀδάμ. Поскольку еврейский текст указан как основной и имеет высокую уверенность, в основном тексте сохранено еврейское чтение, а греческий вариант отмечен в сноске.
- issue: Включение Еноса
  choice: Сим, Сиф и Енос
  alternative: Сим и Сиф
  rationale: Енос явно присутствует в еврейском тексте (ואנוש), хотя отсутствует в греческой параллели и английском консультационном слое.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным ритмом мудростной поэзии. Тире во второй строке передаёт сжатую именную конструкцию, не устраняя неоднозначность еврейского оборота.
