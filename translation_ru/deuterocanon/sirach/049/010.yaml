base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/010.yaml
  text: And as for the twelve prophets[a], may their bones flourish from where they lie[c][b]; for they healed Jacob and delivered them by faithful hope.
translation:
  language: ru
  text: И да процветут кости двенадцати пророков там, где они покоятся[a]! Ведь они исцелили Иакова[b] и возвысили его верной надеждой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст: «да процветут их кости с их места». Еврейское выражение труднее и буквально означает приблизительно: «да процветут их кости из-под них».'
    reason: textual_variant
  - marker: b
    text: 'В греческом тексте: «утешили Иакова», тогда как в еврейском: «исцелили Иакова».'
    reason: alternative_reading
  - marker: c
    text: 'Заключение стиха в древних свидетелях различается. Еврейский текст можно понять как «возвысили его верной надеждой», а греческий гласит: «избавили их в вере надежды».'
    reason: textual_variant
lexical_decisions:
- source_word: שנים עשר הנביאים / τῶν ιβʹ προφητῶν
  choice: двенадцать пророков
  rationale: Оба свидетеля буквально говорят о «двенадцати пророках». Позднейшее наименование «малые пророки» в текст не внесено.
- source_word: עצמתם / τὰ ὀστᾶ
  choice: их кости
  rationale: Конкретный образ костей ясно засвидетельствован и в еврейском, и в греческом тексте; он выражает посмертную честь и память.
- source_word: פרחת / ἀναθάλοι
  choice: да процветут
  rationale: Форма передаёт пожелание, а глагол сохраняет образ нового роста и цветения.
- source_word: מתחתם / ἐκ τοῦ τόπου αὐτῶν
  choice: там, где они покоятся
  rationale: Еврейское выражение буквально трудно («из-под них»), тогда как греческое указывает на «их место». В контексте костей естественная русская формулировка передаёт место погребения, не устраняя разночтение, отмеченное в сноске.
- source_word: החלימו / παρεκάλεσεν
  choice: исцелили
  rationale: Приоритет отдан сохранившемуся еврейскому глаголу со значением «исцелять, восстанавливать». Греческое «утешили» отмечено в сноске.
- source_word: יעקב
  choice: Иакова
  rationale: Сохранено собственное имя источника, хотя здесь оно собирательно обозначает народ Израиля.
- source_word: וישגבהו
  choice: возвысили его
  rationale: Еврейская форма естественно соотносится с корнем שׂגב/שגב и единственным объектом «его», то есть Иакова. Расходящееся греческое чтение «избавили их» вынесено в сноску.
- source_word: באמונת תקוה / ἐν πίστει ἐλπίδος
  choice: верностью надежды
  rationale: Сжатая конструкция сохраняет связь понятий верности/веры и надежды, не превращая их без достаточного основания в два независимых качества.
theological_decisions:
- issue: Расхождение еврейского и греческого свидетелей в заключительной строке
  choice: 'Основной текст следует еврейскому чтению: «исцелили Иакова и возвысили его верностью надежды».'
  alternative: 'Греческий текст: «утешили Иакова и избавили их в вере надежды».'
  rationale: Сохранившийся еврейский текст имеет приоритет и даёт грамматически последовательный единственный объект «Иакова / его». Существенное греческое разночтение сохранено в сносках, а не смешано с еврейским чтением.
- issue: Образ процветающих костей
  choice: Сохранён буквальный образ «кости… процветут».
  alternative: Передать отвлечённо как продолжение памяти или славы пророков.
  rationale: Образ прямо присутствует в обоих древних свидетелях и не требует догматического истолкования как утверждения о конкретном виде посмертной жизни.
translation_notes:
  register: Современный литературный русский язык с достоинством и лёгкой поэтичностью, соответствующей благословению памяти пророков. Архаизмы сведены к общеупотребительной библейской формуле «да процветут»; трудные расхождения свидетелей не сглажены и пояснены в сносках.
