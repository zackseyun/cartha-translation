  source_fidelity: 'Основной текст последовательно следует сохранившемуся еврейскому свидетелю: «исцелили Иакова» и «возвысили его». Существенные расхождения греческого текста корректно сохранены в сносках. Однако «верностью надежды» в русском звучит неестественно и способно создать неверное впечатление, будто надежда обладает нравственной верностью; более ясное «верной надеждой» сохраняет сжатую связь веры/верности и надежды без доктринального развёртывания.'
