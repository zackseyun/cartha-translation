base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/004.yaml
  text: Except for David[a], Hezekiah, and Josiah, all of them acted corruptly; the kings of Judah abandoned the law of the Most High[b], until they came to an end.
translation:
  language: ru
  text: Кроме Давида, Езекии и Иосии, все они поступали порочно[a]; цари Иудеи оставили закон Всевышнего — до самого своего конца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод по греческому тексту: «все они совершали проступки»; еврейский глагол буквально передаёт смысл порчи, разрушения или губительного действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская заключительная фраза очень кратка: буквально «до их завершения (конца)»; в греческом тексте сказано: «цари Иудеи пришли к концу (исчезли)».'
    reason: alternative_reading
lexical_decisions:
- source_word: לבד / παρὲξ
  choice: кроме
  rationale: Оба источника вводят исключение; «кроме» ясно и естественно выделяет трёх царей из общего осуждения.
- source_word: השחיטו / πλημμελίαν ἐπλημμέλησαν
  choice: поступали порочно
  rationale: Еврейский глагол от корня שחת передаёт нравственную испорченность или губительное поведение, а греческий параллельный текст говорит о совершении проступка. Формулировка сохраняет общий нравственный смысл, не уточняя вид греха.
- source_word: ויעזבו / κατέλιπον
  choice: оставили
  rationale: Прямо передаёт сознательный отход царей от данного Богом закона; звучит естественно и не усиливает текст сверх источника.
- source_word: תורת עליון / τὸν νόμον τοῦ ὑψίστου
  choice: закон Всевышнего
  rationale: В царском и заветном контексте תורה уместно передать словом «закон»; עליון сохранено как божественный титул «Всевышний».
- source_word: מלכי יהודה
  choice: цари Иудеи
  rationale: Точное и привычное обозначение царей Иудейского царства.
- source_word: עד תמם / ἐξέλιπον
  choice: вплоть до своего конца
  rationale: Сохраняет краткость и некоторую неоднозначность еврейской фразы, не сводя «конец» исключительно к смерти отдельных царей или исчезновению династии; греческое чтение учтено в примечании.
theological_decisions:
- issue: Связь краткой заключительной фразы עד תמם с отступлением царей
  choice: «вплоть до своего конца» как итоговое продолжение высказывания о царях Иудеи
  alternative: 'Отдельное предложение: «цари Иудеи исчезли / пришли к концу»'
  rationale: Еврейский текст выражен предельно сжато, тогда как греческий делает конец царей отдельным сказуемым. Основной текст сохраняет еврейскую сжатость и напряжение, а примечание сообщает греческий вариант, не превращая один из них в единственно возможное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис остаётся кратким и афористичным; тире перед заключительной фразой помогает передать её резкость и не устраняет исходную неоднозначность.
