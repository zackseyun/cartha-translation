translation:
  language: ru
  text: Иезекииль увидел видение[a] и описал виды колесницы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Иезекииль, который увидел видение славы, явленное ему на колеснице херувимов». Еврейский текст короче; выражение, переданное как «виды колесницы», возможно, представляет собой сжатую или не вполне сохранившуюся формулировку.'
    reason: alternative_reading
lexical_decisions:
- source_word: וחזקאל
  choice: Иезекииль
  rationale: Употреблено традиционное русское имя пророка; начальный союз передан связностью стиха в контексте перечня, без обязательного отдельного «и».
- source_word: ראה
  choice: видел
  rationale: Прямое и естественное соответствие обычному еврейскому глаголу «видеть»; форма несовершенного вида по-русски уместна в повествовательной характеристике пророка.
- source_word: מראה
  choice: видение
  rationale: В пророческом контексте слово обозначает увиденное в откровении; это значение подтверждается греческим ὅρασιν.
- source_word: ויגד
  choice: описал
  rationale: Глагол в породе hifil значит «сообщил, возвестил, рассказал»; при объекте, обозначающем черты колесницы, «описал» звучит естественно и не добавляет нового содержания.
- source_word: זני
  choice: виды
  rationale: Передаёт засвидетельствованное, хотя и необычное в данном контексте, значение «виды, разновидности», не исправляя молча возможную текстовую трудность.
- source_word: מרכבה
  choice: колесницы
  rationale: Буквальное значение — «колесница». Уточнение «херувимов» отсутствует в сохранившемся еврейском тексте и потому оставлено для примечания о греческом чтении.
theological_decisions:
- issue: Следует ли расширять краткий еврейский текст по греческому параллельному чтению, прямо называя славу и херувимов?
  choice: В основном тексте сохранена краткая еврейская формулировка.
  alternative: «Иезекииль, который видел видение славы, показанное ему на колеснице херувимов».
  rationale: Сохранившийся еврейский текст имеет приоритет, хотя выражение זני מרכבה необычно и, возможно, текстологически неустойчиво. Более полное греческое чтение приводится в сноске, а не вводится без оговорки в основной текст.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. Необычность выражения «виды колесницы» сознательно сохранена как отражение еврейского свидетельства; текстологическое расхождение разъяснено в сноске.
