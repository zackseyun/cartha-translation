base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/001.yaml
  text: The name of Josiah is like blended incense[a], the work of a perfumer; his memory is sweet as honey to the mouth[b], and like music at a banquet of wine.
translation:
  language: ru
  text: Имя Иосии — как благовонная смесь для воскурения[a], приготовленная мастером благовоний; память о нём сладка для нёба, как мёд, и приятна, как песня на пиру с вином[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В начале греческого текста: «Память об Иосии — как смесь для воскурения, приготовленная искусством составителя». Еврейский текст в начале говорит об «имени», а греческий — о «памяти».'
    reason: alternative_reading
  - marker: b
    text: 'Еврейское מזמור может означать также музыкальное исполнение; поэтому возможен перевод: «как музыка на пиру с вином».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שם
  choice: Имя
  rationale: Еврейское שם прямо означает «имя»; мемориальный смысл далее выражен словом זכרו — «память о нём».
- source_word: כקטורת סמים
  choice: как благовонная смесь для воскурения
  rationale: קטורת обозначает воскурение или курение, а סמים — ароматические вещества; перевод передаёт составной характер благовония, подтверждаемый греческим σύνθεσιν θυμιάματος.
- source_word: וממלה מעשה רוקח
  choice: изготовленная искусным составителем
  rationale: Еврейская форма וממלה трудна, однако контекст и греческое ἐσκευασμένον указывают на приготовление смеси. רוקח — мастер, составляющий благовония и ароматические смеси; «составитель» сохраняет ремесленный смысл без анахроничного сужения до современного парфюмера.
- source_word: בחך כדבש ימתיק זכרו
  choice: память о нём сладка для нёба, как мёд
  rationale: חך буквально означает «нёбо», а זכרו — «память о нём». Имперфект ימתיק в данном хвалебном изречении естественно передать как постоянное, характерное качество.
- source_word: וכמזמור
  choice: и приятна, как песня
  rationale: מזמור может означать песню, обычно музыкально исполняемую. Добавленное «приятна» естественно связывает второе сравнение с «памятью», не меняя образа.
- source_word: על משתה היין
  choice: на пиру с вином
  rationale: משתה — пир или праздничное застолье, היין — вино; выражение звучит естественно по-русски и сохраняет праздничный контекст.
