base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/012.yaml
  text: So also Yehoshua son of Jehozadak[a], who in distress raised up an altar; and they raised up a holy temple, established for everlasting glory.
translation:
  language: ru
  text: Также Иешуа, сын Иехоцадака, который в бедственное время воздвиг жертвенник[a]; и они воздвигли святой храм, прочно устроенный для вечной славы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском издании слова «Также Иешуа, сын Иехоцадака, который в бедственное время воздвиг жертвенник» заключены в скобки как текстуально неуверенные; в греческой параллели этой строки нет.
    reason: textual_variant
lexical_decisions:
- source_word: גם
  choice: Также
  rationale: Связывает Иешуа с предшествующими прославляемыми вождями и естественно продолжает перечисление.
- source_word: יהושע בן יהוצדק
  choice: Иешуа, сын Иехоцадака
  rationale: Передаёт полные еврейские формы личного имени и патронима, сохраняя их узнаваемость в современном русском тексте.
- source_word: אשר במצוק הקימו מזבח
  choice: который в бедственное время воздвиг жертвенник
  rationale: מצוק в данном контексте обозначает бедствие или стеснённые обстоятельства; הקימו מזבח естественно передаётся как «воздвиг жертвенник». Неуверенность самой строки обозначена сноской.
- source_word: וירימו
  choice: и они воздвигли
  rationale: Сохраняет множественное число еврейского глагола и оттенок поднятия/сооружения, не уточняя прямо не названных соучастников.
- source_word: היכל קדש
  choice: святой храм
  rationale: היכל здесь означает храм, а קדש выражает его священный характер; русская конструкция звучит естественно и возвышенно.
- source_word: ומכונן
  choice: утверждённый
  rationale: Передаёт состояние прочной устроенности или основания; форма согласована с «храм» и сохраняет результативный оттенок.
- source_word: לכבוד עולם
  choice: для вечной славы
  rationale: כבוד передано как «слава», а עולם — как непреходящая длительность; выражение сохраняет торжественный регистр.
theological_decisions:
- issue: Текстуальный статус строки о жертвеннике
  choice: Включить строку в основной текст, отметив её сноской как неуверенно засвидетельствованную.
  alternative: Не включать её в основной текст и привести только в сноске, поскольку в еврейском издании она заключена в скобки, а в греческой параллели отсутствует.
  rationale: Предоставленный еврейский текст содержит эту строку, хотя редакционно отмечает её неуверенность. Включение со сноской сохраняет свидетельство основного источника и одновременно честно сообщает о текстологической проблеме.
- issue: Множественное число וירימו
  choice: Сохранить «они воздвигли», не называя субъект точнее.
  alternative: 'Передать в единственном числе: «он воздвиг».'
  rationale: Еврейская форма явно множественного числа; греческая параллель также предполагает множественного деятеля. Неопределённость референта не следует устранять толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим хвалебному перечню. Глагол «воздвигли» сохраняет возвышенный, но понятный регистр; синтаксис удерживает переход от единственного лица к неуточнённому множественному субъекту исходного текста.
