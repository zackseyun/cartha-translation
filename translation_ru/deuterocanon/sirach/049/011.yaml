  text: How shall we praise Zerubbabel? He was like a signet ring on the right hand[a][b].
translation:
  language: ru
  text: Как нам восхвалить Зоровавеля? Он был словно перстень-печать на правой руке[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как нам возвеличить Зоровавеля?» Греческий параллельный текст говорит «возвеличить», тогда как еврейское выражение допускает также значения «восхвалить» и «превознести».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «словно печать» или «словно перстень». Этот образ, вероятно, выражает честь и особую ценность; ср. образ перстня-печати в Аггея 2:23.'
    reason: cross_reference
lexical_decisions:
- source_word: מה נהללה
  choice: Как нам восхвалить
  rationale: Еврейское вопросительное מה с волитивной формой выражает риторическое восхищение. По-русски восклицательное оформление естественно передаёт силу этой фразы, не превращая её в просьбу о способе похвалы; греческое μεγαλύνωμεν подтверждает значение возвеличивания или прославления.
- source_word: זרבבל
  choice: Зоровавель
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: כחותם
  choice: словно перстень-печать
  rationale: חותם означает печать или перстень с печатью. Упоминание руки показывает, что здесь особенно уместен конкретный образ носимого перстня-печати, а не отвлечённой печати.
- source_word: על יד ימין
  choice: на правой руке
  rationale: Фраза буквально обозначает положение на правой руке; это подтверждает греческое ἐπὶ δεξιᾶς χειρός.
theological_decisions:
- issue: Образ Зоровавеля как печати на правой руке
  choice: Метафора сохранена без истолкования в основном тексте.
  alternative: Он был словно печать на правой руке.
  rationale: Образ может указывать на честь, избранность и особую ценность и перекликается с Аггея 2:23, однако сам стих этого не разъясняет. Перевод сохраняет образ и не навязывает ему единственного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Риторический вопрос передан как восклицание, а конкретное «перстень-печать» сохраняет связь печати с рукой.
