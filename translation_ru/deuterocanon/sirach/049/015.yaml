translation:
  language: ru
  text: Рождался ли когда-нибудь муж, подобный Иосифу[a]? И даже о его теле позаботились[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая параллель пространнее: «Иосиф же стал мужем, предводителем своих братьев, опорой народа, и о его костях позаботились». Еврейский текст здесь короче.'
    reason: alternative_reading
  - marker: b
    text: 'Еврейская фраза допускает и утвердительное, более буквальное чтение: «Подобно Иосифу родился муж; и даже о его теле позаботились». Забота о теле, вероятно, означает почтение к останкам Иосифа и их погребение; ср. Исх. 13:19; Нав. 24:32.'
    reason: textual_ambiguity_and_cross_reference
lexical_decisions:
- source_word: כיוסף
  choice: Подобно Иосифу
  rationale: 'Префикс כ выражает сравнение: «как, подобно». Такая передача сохраняет имя Иосифа и сравнительную конструкцию краткого еврейского текста.'
- source_word: אם נולד גבר
  choice: родился ли ещё такой муж?
  rationale: אם понято как вопросительная частица в риторическом вопросе, что естественно для хвалебного контекста и позволяет связно передать эллиптический еврейский оборот. גבר передано словом «муж», уместным в торжественной похвале человеку.
- source_word: גויתו
  choice: его теле
  rationale: גויה обозначает тело, нередко мёртвое тело. «Тело» сохраняет формулировку еврейского свидетеля, не заменяя её более конкретными греческими «костями».
- source_word: נפקדה
  choice: позаботились
  rationale: Пассивная форма от פקד здесь означает, что телу уделили внимание и о нём позаботились; контекст указывает на посмертное почтение и погребение останков.
theological_decisions:
- issue: Краткий еврейский текст и более пространное греческое чтение
  choice: Основной текст следует сохранившемуся еврейскому чтению; греческое расширение приведено в сноске.
  alternative: «Иосиф же стал мужем, предводителем братьев, опорой народа, и о костях его позаботились».
  rationale: Там, где еврейский текст Сираха сохранился, он имеет приоритет. Греческая параллель помогает понять контекст, но отсутствующие в еврейском свидетеле титулы не следует без оговорки вносить в основной текст.
- issue: Функция אם в эллиптической фразе
  choice: 'Передать как риторический вопрос: «родился ли ещё такой муж?»'
  alternative: 'Утвердительное чтение: «родился муж».'
  rationale: В библейском иврите אם может вводить эмоциональный риторический вопрос. Это чтение даёт естественный смысл «кто подобен Иосифу?» и не требует добавления греческих характеристик, однако неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Риторический вопрос делает эллиптическую еврейскую фразу понятной, а сноска сохраняет утвердительную возможность и более полное греческое чтение.
