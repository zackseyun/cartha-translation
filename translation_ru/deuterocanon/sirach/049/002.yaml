base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/002.yaml
  text: For he had compassion on our backsliding[c][b][a], and removed the abominations of vanity.
translation:
  language: ru
  text: Ибо он сжалился над нами в нашем отступничестве[a] и положил конец мерзостям суеты[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к греческому параллельному тексту: «Ибо он направил народ в его обращении» либо «при покаянии народа». В еврейском тексте стоит «наше отступничество», тогда как греческий отражает более положительное «обращение, возвращение».'
    reason: alternative_reading
  - marker: b
    text: '«Мерзости суеты» — вероятно, идольские мерзости: еврейское слово «суета, пустота» может употребляться как полемическое обозначение идолов.'
    reason: lexical_alternative
  - marker: c
    text: 'В греческом параллельном тексте: «и устранил мерзости беззакония» — в отличие от еврейского «мерзости суеты».'
    reason: textual_variant
lexical_decisions:
- source_word: נחל
  choice: сжалился
  rationale: Еврейская форма трудна и допускает разные толкования. В контексте преобразований Иосии передаёт благосклонный, милосердный отклик, не закрепляя более спорную реконструкцию.
- source_word: על משובתינו
  choice: над нами в нашем отступничестве
  rationale: משובה обычно означает отступничество или уклонение, а суффикс указывает на первое лицо множественного числа. Небольшая синтаксическая перестройка нужна для естественного русского языка и не превращает проступок как таковой в объект сострадания.
- source_word: וישבת
  choice: и положил конец
  rationale: Передаёт каузативно-результативный смысл прекращения или устранения порочных культовых явлений.
- source_word: תועבות
  choice: мерзостям
  rationale: Сохраняет сильную нравственно-религиозную оценку культово неприемлемых предметов или обычаев.
- source_word: הבל
  choice: суеты
  rationale: Слово буквально обозначает мимолётность, пустоту, тщету и может служить полемическим обозначением идолов. «Суета» сохраняет образность и не сужает значение до явно не названных идолов.
theological_decisions:
- issue: Следует ли согласовать еврейское משובה с более положительным греческим ἐπιστροφή («обращение», «возвращение»)?
  choice: В основном тексте сохранено еврейское значение «отступничество».
  alternative: «Он направил народ в его обращении» или «при покаянии народа».
  rationale: Сохранившийся еврейский текст имеет приоритет, но греческое свидетельство отражает подлинный древний вариант понимания и потому отмечено в сноске.
- issue: Следует ли передать הבל непосредственно словом «идолы»?
  choice: Использовано образное «суета».
  alternative: «идолы» или «ничтожные вещи».
  rationale: Антиидолопоклоннический смысл вероятен, однако еврейское слово шире и метафоричнее; прямое «идолы» устранило бы эту многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формула «сжалился над нами в нашем отступничестве» естественнее буквального «сжалился над нашим отступничеством» и избегает впечатления, будто сострадание обращено к самому греху. «Мерзости суеты» сохраняет сильную оценку и образность הבל.
