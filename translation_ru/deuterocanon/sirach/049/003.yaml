  text: Он направил своё сердце к Богу[a] и во дни насилия хранил верность[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «к Господу» вместо еврейского «к Богу».'
    reason: alternative_reading
  - marker: b
