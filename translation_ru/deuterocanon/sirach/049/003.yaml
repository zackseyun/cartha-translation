    reason: lexical_alternative
lexical_decisions:
- source_word: ויתם
  choice: направил
  rationale: Форма в составном еврейском тексте несколько неясна, однако греческое κατεύθυνεν убедительно поддерживает значение «направил, устремил, выправил», согласующееся с дополнением «сердце».
- source_word: אל אל
  choice: к Богу
  rationale: Основной текст следует сохранившемуся еврейскому чтению «к Богу»; греческое «к Господу» отмечено в сноске как разночтение.
- source_word: לבו
  choice: своё сердце
  rationale: Сохранён традиционный библейский антропологический образ сердца как средоточия воли, мысли и внутренней направленности человека.
- source_word: ובימי חמס
  choice: во дни насилия
  rationale: חמס обозначает насилие, неправду или злодеяние. Выражение «во дни насилия» естественно по-русски и сохраняет общественно-нравственный смысл еврейского текста; греческий параллельный текст говорит о «днях беззаконных».
- source_word: עשה חסד
  choice: хранил верность
  rationale: חסד может обозначать милость, доброту или преданную верность. В данном контексте «хранил верность» естественно передаёт устойчивую религиозно-нравственную преданность, не воспроизводя усиленный греческий глагол «укрепил» как будто он стоял в еврейском тексте.
theological_decisions:
- issue: Понимать ли עשה חסד как милость к людям или как верность Богу
  choice: хранил верность
  alternative: 'проявлял милость; греч.: укреплял благочестие'
  rationale: Еврейское выражение допускает как межличностную доброту, так и преданную верность, тогда как греческий параллельный текст явно истолковывает его в религиозном смысле. Основной перевод сохраняет широкое понятие верности, а различие свидетелей и смысловая неоднозначность вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Инверсия «во дни насилия» сохраняет достоинство стиля и остаётся понятной современному читателю; архаическая лексика сведена к минимуму.
