base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/005.yaml
  text: And they gave their horn backward[b][a], and their glory to a foolish foreign nation.
translation:
  language: ru
  text: И отдали они свой рог[a] другим[b], а свою славу — неразумному чужеземному народу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Рог» — библейский образ силы и власти; возможно также: «свою силу».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский текст здесь необычен и буквально может быть понят как «назад»; греческий параллельный текст имеет «другим». В еврейском глагол также стоит в единственном числе («отдал»), а в греческом — во множественном («отдали»).
    reason: textual_variant
lexical_decisions:
- source_word: קרנם
  choice: свой рог
  rationale: Сохранён буквальный библейский образ рога как символа силы и власти; греческое κέρας подтверждает эту метафору.
- source_word: לאחור
  choice: другим
  rationale: Еврейское чтение необычно и буквально указывает на движение «назад», однако греческое ἑτέροις («другим») вероятно сохраняет смысл исходного чтения и лучше соответствует конструкции с глаголом «отдали».
- source_word: כבודם
  choice: свою славу
  rationale: «Слава» передаёт широкий смысл כבוד — честь, достоинство и величие — и соответствует греческому δόξα.
- source_word: גוי
  choice: народу
  rationale: В данном контексте גוי обозначает иной народ как политико-этническую общность.
- source_word: נבל
  choice: неразумному
  rationale: Слово выражает не только недостаток ума, но и нравственно предосудительную глупость; «неразумный» передаёт оценку без добавления узкой богословской трактовки.
- source_word: נכרי
  choice: чужеземному
  rationale: Передаёт принадлежность к чужому народу и естественно сочетается в русском языке со словом «народ».
theological_decisions:
- issue: Метафорическое значение «рога»
  choice: Сохранить образ «рога» в основном тексте.
  alternative: 'Передать толкованием: «силу» или «могущество».'
  rationale: И еврейский, и греческий тексты сохраняют традиционный библейский образ силы и власти; его замена толкованием обеднила бы поэтическую и богословскую выразительность.
- issue: Необычное еврейское чтение לאחור
  choice: 'Следовать смыслу греческого параллельного текста: «другим».'
  alternative: 'Перевести буквально: «назад».'
  rationale: Еврейская форма в данном свидетеле текстуально затруднительна, тогда как греческое ἑτέροις даёт связный смысл. Разночтение открыто отмечено в сноске.
- issue: Число подлежащего в начале стиха
  choice: «Отдали они» — по греческому параллельному тексту и контексту, где речь идёт о царях.
  alternative: «Отдал он» — формально по еврейскому ויתן.
  rationale: Еврейская форма стоит в единственном числе, однако множественное число греческого ἔδωκαν согласуется с местоименным суффиксом множественного числа и ближайшим контекстом. Эта небольшая текстовая неоднозначность отмечена в сноске к разночтению.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной библейской образности. Инверсия не используется; тире во второй части естественно отмечает пропуск повторного глагола. Прилагательные «неразумному чужеземному» передают обе характеристики народа без конфессионально окрашенного толкования.
