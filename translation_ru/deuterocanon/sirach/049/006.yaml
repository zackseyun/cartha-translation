base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/049/006.yaml
  text: They set the holy city on fire[a], and made its streets desolate, by the hand of Yirmeyahu; for they afflicted him[c][b], though he had been formed in the womb as a prophet.
translation:
  language: ru
  text: Они предали огню святой город и опустошили его улицы[a] — рукою Иеремии[b], ибо они притесняли его, а ведь он ещё в материнской утробе был создан как пророк[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «её пути» или «её дороги»; применительно к городу имеются в виду улицы.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский оборот можно также понять как «через Иеремию», то есть в связи с его пророческим служением или предостережением. Синтаксис здесь сжат и допускает неоднозначность.
    reason: alternative_reading
  - marker: c
    text: Ср. Иеремия 1:5, где говорится о призвании Иеремии ещё до его рождения.
    reason: cross_reference
lexical_decisions:
- source_word: ויציתו
  choice: предали огню
  rationale: Глагол обозначает поджигание или сожжение; выражение «предали огню» естественно и достойно передаёт разрушительное действие.
- source_word: קרית קדש
  choice: святой город
  rationale: Еврейское сочетание прямо означает «святой город»; это чтение первично по отношению к несколько отличающемуся греческому параллельному тексту.
- source_word: וישמו
  choice: опустошили
  rationale: Форма передаёт доведение до запустения и хорошо соответствует картине разрушенного города.
- source_word: ארחתיה
  choice: его улицы
  rationale: Буквально существительное может означать «пути» или «дороги», но применительно к городу естественное русское соответствие — «улицы»; греческое ὁδοὺς также поддерживает это понимание.
- source_word: ביד ירמיהו
  choice: рукою Иеремии
  rationale: Сохранён сжатый еврейский оборот «рукою», который может обозначать действие через чьё-либо посредство или связь с пророческим служением; неоднозначность поясняется в сноске.
- source_word: כי ענוהו
  choice: ибо они притесняли его
  rationale: Глагол обозначает угнетение, унижение или причинение страдания; «притесняли» ясно передаёт несправедливое обращение, не уточняя его форму сверх текста.
- source_word: מרחם נוצר נביא
  choice: ещё в материнской утробе был создан как пророк
  rationale: Формулировка сохраняет образ формирования в утробе и пророческое предназначение, перекликаясь с Иеремией 1:5 без полного отождествления формулировок.
- source_word: ירמיהו
  choice: Иеремия
  rationale: Употреблена закрепившаяся в русском библейском языке форма имени, понятная современному читателю и соответствующая еврейскому имени ירמיהו.
theological_decisions:
- issue: Связь трудного оборота ביד ירמיהו с разрушением города и страданиями Иеремии
  choice: Сохранить в основном тексте оборот «рукою Иеремии», не устраняя синтаксическую напряжённость.
  alternative: 'Передать толковательно: «через Иеремию», «в связи со служением Иеремии» или «как предсказал Иеремия».'
  rationale: Еврейский текст сжат и допускает разные способы установления связи; греческий параллельный текст также сохраняет оборот «рукою Иеремии». Буквально узнаваемая формулировка вместе со сноской не приписывает тексту однозначное толкование.
- issue: Отношение притеснения Иеремии к его пророческому предназначению от утробы
  choice: Передать соединение как «а ведь», сохранив противопоставление между обращением людей с пророком и его предназначением.
  alternative: Буквально соединить простым «и» либо усилить уступительность словом «хотя».
  rationale: Еврейское והוא буквально присоединяет следующую характеристику, но в русском «а ведь» естественно выявляет заложенное контекстом напряжение, не превращая его в более сильную уступительную конструкцию.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксическая трудность исходного текста намеренно не сглажена полностью; тире обозначает сжатое присоединение оборота «рукою Иеремии». Лексика остаётся понятной обычному читателю без конфессионально окрашенных уточнений.
