  source_fidelity: 'Перевод верно передаёт первичный еврейский текст: מעט — «мало кто», נוצרו — «был сотворён», כ־חנוך — сравнение с Енохом, וגם הוא — «и он тоже», נלקח — «был взят». Трудное заключительное פנים не выдается за несомненное чтение: «с земли» обоснованно следует греческому параллельному тексту и оговорён в сноске.'
