  text: Few have been created on earth like Enoch, and he too was taken from the earth.
translation:
  language: ru
  text: Мало кто был сотворён на земле подобно Еноху[b], и он тоже был взят с земли[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Последнее еврейское слово здесь затруднительно; греческий параллельный текст читает «с земли», и это чтение принято в основном тексте.
    reason: textual_variant
  - marker: b
    text: 'В греческом тексте сказано сильнее: «ни один не был сотворён подобным Еноху на земле». В еврейском тексте стоит «мало», а не абсолютное «ни один».'
    reason: alternative_reading
  - marker: c
    text: 'Или: «был взят вверх». Эти слова напоминают о взятии Еноха Богом (ср. Быт. 5:24).'
    reason: lexical_alternative
lexical_decisions:
- source_word: מעט
  choice: Мало кто
  rationale: Еврейское слово означает «мало, немногие». Оборот «мало кто» естественен в современном русском и, в отличие от греческого «ни один», сохраняет количественное, а не абсолютное отрицание.
- source_word: נוצרו
  choice: был сотворён
  rationale: Пассивная форма передаёт сотворение или образование человека; «сотворён» сохраняет подразумеваемое действие Бога и соответствует греческому ἐκτίσθη.
- source_word: כחנוך
  choice: подобно Еноху
  rationale: Предлог כ выражает сравнение; «подобно Еноху» звучит естественно и достойно.
- source_word: וגם הוא
  choice: и он тоже
  rationale: Сохраняет присоединительное усиление исходного выражения без излишнего толкования.
- source_word: נלקח
  choice: был взят
  rationale: Глагол לקח отсылает к рассказу о том, что Бог взял Еноха. Нейтральное «был взят» сохраняет библейскую сдержанность и не уточняет способ его удаления.
- source_word: פנים
  choice: с земли
  rationale: Последнее еврейское слово в данном чтении затруднительно и, вероятно, отражает текстовую проблему. Греческий параллельный текст ясно читает «с земли», что принято в основном тексте с обязательной оговоркой в сноске.
theological_decisions:
- issue: Насколько явно описывать взятие Еноха
  choice: был взят с земли
  alternative: был взят на небо; был взят Богом
  rationale: Формулировка следует ясному греческому параллельному чтению и сохраняет сдержанность стиха, не добавляя прямо не названных места назначения или действующего лица.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Оборот «мало кто» делает еврейскую конструкцию естественной по-русски; «сотворён» и «был взят» сохраняют достоинство и лаконичность исходного текста.
