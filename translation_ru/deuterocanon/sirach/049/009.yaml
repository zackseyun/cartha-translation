translation:
  language: ru
  text: Он также упомянул Иова[a], хранившего все пути праведности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая параллель значительно отличается: «ибо он вспомнил врагов во время ливня и благотворил выпрямляющим пути». Еврейское свидетельство: «Он также упомянул Иова, хранившего все пути праведности».'
    reason: alternative_reading
lexical_decisions:
- source_word: וגם הזכיר
  choice: Он упомянул и
  rationale: Сохраняет добавочное значение וגם и прямой смысл הזכיר — «упомянул, назвал»; такой порядок слов естественен для современного русского языка.
- source_word: את איוב
  choice: Иова
  rationale: Имя передано в принятой русской библейской форме и поставлено в винительный падеж как прямое дополнение.
- source_word: ומכלכל
  choice: хранившего
  rationale: כלכל может означать поддерживать, сохранять или направлять. «Хранившего» передаёт деятельную и постоянную верность путям праведности, не сводя выражение лишь к внутреннему следованию им.
- source_word: כל דרכי צדק
  choice: все пути праведности
  rationale: Сохраняет образ путей и широкий нравственно-религиозный смысл צדק; «праведность» здесь уместнее более узкого «правосудия».
theological_decisions:
- issue: Значительное расхождение между сохранившимся еврейским текстом и греческой параллелью
  choice: 'Основной текст следует еврейскому чтению: «Иова, хранившего все пути праведности».'
  alternative: 'Греческая параллель: «ибо он вспомнил врагов во время ливня и благотворил выпрямляющим пути».'
  rationale: При наличии надёжного еврейского свидетельства оно имеет приоритет. Существенно отличающееся греческое чтение не смешивается с ним, а сохраняется в сноске как отдельная текстовая традиция.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка краткая и ясная; образ «путей праведности» сохранён. Причастный оборот однозначно относит последующую характеристику к Иову.
