translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для библейского текста. Благопожелание выделено восклицанием; редкая метафора «исцелил наши разрушения» намеренно сохранена. Лексика понятна обычному читателю, без архаизмов и конфессионально окрашенных добавлений.
