  yaml_path: translation/deuterocanon/sirach/049/013.yaml
  text: Nehemiah—may his memory be honored—who raised up our ruins[a], and healed our destruction[b], and set up doors and bars.
translation:
  language: ru
  text: Неемия — да будет почтена его память![a] Он восстановил наши руины[b], исцелил наши разрушения и поставил ворота и засовы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Это благопожелание о памяти Неемии, а не просто сообщение о том, что его помнят.
    reason: lexical_alternative
  - marker: b
    text: 'В греческой параллели конкретнее: «воздвиг для нас павшие стены, поставил ворота и засовы и восстановил места наших жилищ». Еврейский текст говорит шире — о «наших руинах» и «наших разрушениях» — и использует метафору исцеления.'
    reason: alternative_reading
lexical_decisions:
- source_word: יאדר זכרו
  choice: да будет почтена его память
  rationale: Передаёт благопожелательный характер выражения о памяти Неемии. Формулировка естественна для современного литературного русского языка и не усиливает смысл до «прославлена».
- source_word: המקים
  choice: восстановил
  rationale: Каузативная форма от קום изображает поднятие того, что пало. Буквальное «поднял наши руины» по-русски неестественно, поэтому «восстановил» передаёт образ и смысл действия.
- source_word: חרבתינו
  choice: наши руины
  rationale: Еврейское слово обозначает разрушенные или опустошённые места в широком смысле. Перевод не сужает его до городских стен, как греческая параллель.
- source_word: וירפא
  choice: исцелил
  rationale: Сохранена буквальная метафора исцеления, применённая к последствиям разрушения, вместо нейтрализующего «исправил» или «восстановил».
- source_word: הריסתינו
  choice: наши разрушения
  rationale: Слово указывает на разрушенное, снесённое или разорённое. «Разрушения» сохраняет отличие от предшествующих «руин» и позволяет удержать необычную метафору исцеления.
- source_word: ויצב
  choice: поставил
  rationale: Передаёт установку или водружение предметов на место простым и естественным русским глаголом.
- source_word: דלתים ובריח
  choice: ворота и засовы
  rationale: Буквально речь идёт о дверях и запирающем брусе; в контексте укреплений это створки городских ворот и их засовы. Контекстуальный перевод понятнее по-русски и подтверждается греческим πύλας καὶ μοχλούς.
