lexical_decisions:
- source_word: μετὰ πάσης σαρκός
  choice: среди всякой плоти
  rationale: μετά с родительным допускает значение «среди / вместе с». Слово σάρξ употреблено собирательно о живых смертных существах. Перевод сохраняет конкретный греческий образ и не сужает его до одного человечества.
- source_word: κατὰ τὴν δόσιν αὐτοῦ
  choice: по мере его дара
  rationale: δόσις означает как действие даяния, так и дар. Оборот κατά здесь естественно передаёт соразмерность распределения тому, что даёт Бог; «по мере его дара» яснее по-русски, чем буквальное «согласно его дару».
- source_word: ἐχορήγησεν
  choice: щедро даровал
  rationale: χορηγέω означает снабжать, предоставлять, одарять, нередко с оттенком обильного обеспечения. «Щедро даровал» естественно сочетается с личным объектом «её» и передаёт этот оттенок без лишнего уточнения.
- source_word: αὐτήν
  choice: её
  rationale: Местоимение женского рода отсылает к персонифицированной Премудрости в предшествующем контексте; «её» сохраняет эту грамматическую и литературную связь.
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: тем, кто любит его
  rationale: Дательный обозначает получателей, а причастный оборот — любящих Бога. Единственное число в русском «кто любит» естественно согласуется с местоимением «тем».
theological_decisions:
- issue: Соотнесение местоимений
  choice: «её» относится к Премудрости, а «его» — к Богу
  alternative: Передать αὐτήν нейтрально как «это» либо не уточнять личный характер Премудрости
  rationale: В контексте главы Премудрость грамматически женского рода и персонифицирована, тогда как Бог выступает дарующим; такой перевод сохраняет литературно-богословское напряжение текста, не развивая его в отдельное учение.
- issue: Объём выражения «всякая плоть»
  choice: Сохранить широкое собирательное выражение
  alternative: Перевести как «все люди»
  rationale: Греческое πᾶσα σάρξ может охватывать живых смертных существ шире, чем только человечество; сужение до людей не обязательно следует из данной строки.
translation_notes:
  register: Современный литературный русский с сохранением библейского образа «всякая плоть». Местоимения, относящиеся к Богу, написаны со строчной буквы в соответствии с нейтральной современной издательской нормой. Тире помогает прочитать фрагментарно присоединённый оборот как характеристику распределения.
