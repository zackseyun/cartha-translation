lexical_decisions:
- source_word: φόβος κυρίου
  choice: страх Господень
  rationale: Сохранена традиционная формула библейской литературы мудрости. Слова «благоговение» и «трепет» передают отдельные стороны смысла, но сужают его диапазон.
- source_word: δόξα
  choice: слава
  rationale: «Слава» сохраняет весомость и устойчивое библейское звучание слова, которое здесь указывает на честь и возвышение.
- source_word: καύχημα
  choice: то, чем можно хвалиться
  rationale: 'Описательное выражение естественно передаёт положительный в данном контексте смысл: основание для похвалы или гордости, не привнося обычного отрицательного оттенка слова «хвастовство».'
- source_word: εὐφροσύνη
  choice: радость
  rationale: Современное и ясное соответствие для радостного состояния; оно не дублирует более интенсивное «ликование» в конце стиха.
- source_word: στέφανος
  choice: венец
  rationale: Сохраняет образ почётного венка или награды и соответствует возвышенному библейскому регистру.
- source_word: ἀγαλλιάματος
  choice: ликования
  rationale: Передаёт усиленную, торжественную радость и сохраняет поэтическое накопление близких по смыслу слов.
theological_decisions:
- issue: Передача формулы φόβος κυρίου
  choice: страх Господень
  alternative: благоговение перед Господом; трепет перед Господом
  rationale: 'Буквальная передача сохраняет центральную формулу литературы мудрости и её широкий смысл: смиренный страх, почтение и послушание.'
- issue: Положительный смысл καύχημα
  choice: то, чем можно хвалиться
  alternative: гордость; похвала; предмет похвалы
  rationale: Контекст представляет καύχημα как благо. Выбранный оборот сохраняет идею основания для похвалы, не превращая её ни в порочную гордыню, ни во внешнюю похвалу со стороны других.
