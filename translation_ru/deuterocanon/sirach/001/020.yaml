lexical_decisions:
- source_word: שָׁרְשֶׁיהָ
  choice: корни её
  rationale: Существительное שֹׁרֶשׁ употреблено с суффиксом 3-го лица женского рода единственного числа. Русское «её» естественно соотносится с женским родом предшествующего понятия и сохраняет образ дерева.
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Передаёт длительность и незыблемость корней; слово уместно в краткой поэтической строке и сохраняет библейскую возвышенность без смыслового расширения.
- source_word: וַעֲנָפֶיהָ
  choice: а ветви её
  rationale: עָנָף означает «ветвь». Союз «а» ясно передаёт поэтический параллелизм между корнями и ветвями.
- source_word: אֹרֶךְ יָמִים
  choice: долголетие
  rationale: Буквально выражение означает «долгота дней», то есть долгую жизнь. «Долголетие» естественно для современного русского языка и сохраняет краткость именной конструкции.
theological_decisions:
- issue: Существенное расхождение между сохранившимся еврейским текстом и греческим свидетельством Сир 1:20
  choice: В основном тексте переведена сохранившаяся еврейская поэтическая строка.
  alternative: 'Греческий текст: «Гневливый человек не может быть оправдан».'
  rationale: При наличии еврейского текста перевод основывается прежде всего на нём. Поскольку греческое свидетельство содержит не малый вариант, а совершенно иную строку, оно приведено в примечании без попытки искусственно согласовать две традиции.
translation_notes:
  register: Краткая именная конструкция сохраняет поэтический параллелизм еврейской строки. «Вовеки» придаёт тексту достойное библейское звучание, а «долголетие» остаётся ясным современному читателю.
