translation:
  language: ru
  text: Полнота мудрости — бояться Господа, и она опьяняет их своими плодами[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившаяся в Каирской генизе еврейская строка в этом месте резко отличается: «С людьми истины она утверждена издревле, и с их потомством верна его милость». В указанном издании она заключена в скобки и отмечена как крупное несоответствие, поэтому основной текст здесь следует греческому чтению.'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «опьяняет их от её плодов»; речь идёт о плодах мудрости, представленной как женщина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλησμονὴ σοφίας
  choice: полнота мудрости
  rationale: Сохраняет именную конструкцию греческого текста и естественно звучит как изречение литературы мудрости.
- source_word: φοβεῖσθαι τὸν κύριον
  choice: бояться Господа
  rationale: Передаёт прямое значение инфинитивной конструкции, не сводя библейский страх к одному лишь уважению.
- source_word: μεθύσκει
  choice: опьяняет
  rationale: Сохраняет яркий образ греческого глагола «опьянять, делать пьяным», не ослабляя его до «насыщает».
- source_word: αὐτοὺς
  choice: их
  rationale: Сохраняет местоименную неопределённость греческого текста; вероятный антецедент находится в контексте.
- source_word: ἀπὸ τῶν καρπῶν αὐτῆς
  choice: своими плодами
  rationale: В современном русском творительный естественно обозначает средство опьянения; возвратное «своими» ясно соотносит плоды с грамматически женственной «мудростью».
theological_decisions:
- issue: Резкое расхождение между заключённой в скобки еврейской строкой и греческим текстом
  choice: Основной текст переведён по греческому чтению, а еврейское расхождение отражено в примечании.
  alternative: «С людьми истины она утверждена издревле, и с их потомством верна его милость».
  rationale: Еврейская строка в указанном издании заключена в скобки и отмечена как крупное несоответствие данному стиху; поэтому здесь основным служит связное греческое свидетельство, при полной текстологической прозрачности в примечании.
- issue: Олицетворение мудрости
  choice: «она… своими плодами»
  alternative: «мудрость… её плодами»
  rationale: Русское существительное «мудрость», как и греческое σοφία, женского рода, поэтому олицетворение сохраняется естественно и без дополнительных пояснений в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Традиционное «бояться Господа» и сильная метафора «опьяняет» сохранены; синтаксис сделан естественным для русского языка без устранения неопределённости местоимения «их».
