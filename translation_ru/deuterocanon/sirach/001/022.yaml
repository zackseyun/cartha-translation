  text: Until the appointed time, the patient one[b] will endure, and afterward joy will be repaid to him.[a]
translation:
  language: ru
  text: До назначенного времени терпеливый[b] будет терпеть, а затем ему воздастся радостью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленное еврейское свидетельство, по-видимому, не соответствует этому стиху. Здесь перевод дан по греческому тексту: «До назначенного времени терпеливый будет терпеть, а затем ему воздастся радостью».'
    reason: textual_variant
  - marker: b
    text: 'Или: «долготерпеливый».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως καιροῦ
  choice: До назначенного времени
  rationale: Поскольку приведённая еврейская строка не соответствует этому стиху, перевод опирается на греческое параллельное свидетельство. καιρός обозначает подходящее или назначенное время; этот оттенок сохранён без излишнего уточнения.
- source_word: ἀνέξεται
  choice: будет стойко переносить
  rationale: Будущая форма ἀνέχομαι передаёт выдерживание тяготы. Сочетание естественно по-русски и не дублирует значение определения «терпеливый».
- source_word: μακρόθυμος
  choice: терпеливый
  rationale: Прилагательное употреблено субстантивно и обозначает терпеливого, долготерпеливого человека. Форма мужского рода сохраняет грамматическое единственное число, не ограничивая смысл лицами мужского пола.
- source_word: ὕστερον
  choice: после
  rationale: Передаёт временную последовательность кратко и естественно; греческое слово само по себе не требует эсхатологического смысла «в конце».
- source_word: ἀναδώσει
  choice: воздастся
  rationale: Глагол означает «отдать, воздать». Безлично-пассивная русская конструкция сохраняет невыраженного в греческом деятеля и не вводит прямо Бога как субъект.
- source_word: εὐφροσύνη
  choice: радостью
  rationale: Слово означает радость, веселье. Творительный падеж в конструкции «воздастся радостью» ясно выражает содержание последующего воздаяния.
theological_decisions:
- issue: Несоответствие предоставленного еврейского текста греческому тексту данного стиха
  choice: Перевести по греческому параллельному свидетельству и отметить текстологическую проблему в сноске
  alternative: 'Перевести предоставленную еврейскую строку: «Блажен человек, который приближается к ней и услаждается её заповедями»'
  rationale: Еврейская строка семантически не соответствует Сир 1:22 и помечена источником как major_mismatch. Для данного стиха наиболее надёжным доступным основанием служит греческий текст; неопределённость открыто отражена в примечании.
- issue: Неуказанный деятель воздаяния
  choice: 'Сохранить его невыраженным: «ему воздастся радостью»'
  alternative: 'Указать Бога как субъекта: «Бог воздаст ему радостью»'
  rationale: Греческий текст не называет субъекта. Неявное божественное действие возможно, но его не следует превращать в выраженное утверждение перевода.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка сохраняет последовательность греческого текста, его обобщённый личный субъект и невыраженного деятеля воздаяния.
