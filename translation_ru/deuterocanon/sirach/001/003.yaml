base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/003.yaml
  text: The height of heaven and the breadth of the earth[a], and the depth of the abyss—who can search them out?
translation:
  language: ru
  text: Высоту небес, широту земли и глубину бездны — кто исследует?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте добавлено «и мудрость»: «Высоту небес, широту земли, бездну и мудрость — кто исследует?»'
    reason: textual_variant
lexical_decisions:
- source_word: רוּם שָׁמַיִם
  choice: высоту небес
  rationale: Сочетание обозначает вертикальную протяжённость небес; «высота» естественно образует ряд с широтой и глубиной.
- source_word: רֹחַב אָרֶץ
  choice: широту земли
  rationale: В космологическом контексте אָרֶץ означает землю в целом, а רֹחַב — её измеримую широту.
- source_word: עֹמֶק תְּהוֹם
  choice: глубину бездны
  rationale: Перевод сохраняет пространственное значение עֹמֶק и космическую, таинственную окраску תְּהוֹם; греческое ἄβυσσος подтверждает «бездна».
- source_word: מִי יַחֲקֹר
  choice: кто исследует?
  rationale: Глагол означает тщательно исследовать, доискиваться. Русское риторическое настоящее передаёт подразумеваемую невозможность без обязательного добавления отсутствующего в еврейском тексте «может».
theological_decisions:
- issue: Добавление «и мудрость» в греческом параллельном тексте
  choice: В основном тексте следовать сохранившемуся еврейскому чтению без слов «и мудрость».
  alternative: Греческий текст включает «и мудрость» в ряд того, что невозможно исследовать.
  rationale: Еврейский источник имеет высокую степень надёжности и не содержит этого элемента. Значимый греческий вариант сохранён в примечании, поскольку он расширяет смысл стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической максимы. Параллельный ряд «высоту — широту — глубину» сохраняет структуру еврейского текста; тире подчёркивает риторический вопрос.
