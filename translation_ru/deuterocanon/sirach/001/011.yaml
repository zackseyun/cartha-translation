translation:
  language: ru
  text: Страх Господень — слава и почёт[a], величие и венец великолепия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте — существенно иное чтение: «Страх Господень радует сердце и дарует веселье, радость и долгую жизнь».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת יְהֹוָה
  choice: Страх Господень
  rationale: Сохраняет устойчивое библейское выражение языка Премудрости и не сужает его до одного лишь «благоговения»; форма «Господень» естественна для возвышенного современного библейского регистра.
- source_word: כָּבוֹד
  choice: слава
  rationale: Передаёт достоинство и высокий почёт, выраженные словом כָּבוֹד, и сохраняет отличие от следующего יקר.
- source_word: וִיקָר
  choice: и почёт
  rationale: В данном ряду יקר обозначает ценность и почёт; «почёт» образует естественную пару со «славой», не повторяя заключительное תִּפְאָרֶת.
- source_word: וּגְדֻלָּה
  choice: величие
  rationale: Прямо и естественно передаёт идею величия или возвышенности в именном перечислении.
- source_word: וְעֲטֶרֶת תִּפְאָרֶת
  choice: и венец великолепия
  rationale: Сохраняет образ венца и конструкцию сопряжённого сочетания; «великолепие» отличает תִּפְאָרֶת от ранее употреблённого כָּבוֹד.
- source_word: φόβος κυρίου τέρψει καρδίαν, καὶ δώσει εὐφροσύνην καὶ χαρὰν καὶ μακροημέρευσιν
  choice: не принято в основной текст
  rationale: 'Греческий текст существенно отличается от сохранившегося еврейского: вместо именного ряда он содержит обещание радости и долголетия. Разночтение вынесено в примечание.'
theological_decisions:
- issue: Существенное расхождение еврейского и греческого текстов Сир 1:11
  choice: В основном тексте следовать сохранившемуся еврейскому чтению
  alternative: 'Следовать греческому чтению: «Страх Господень радует сердце и дарует веселье, радость и долгую жизнь»'
  rationale: Для Книги Премудрости Иисуса, сына Сирахова, сохранившийся еврейский свидетель имеет приоритет, однако самостоятельное и существенно иное греческое чтение важно сохранить в примечании, не устраняя текстологическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Именной ряд еврейского текста сохранён; тире ясно выражает подразумеваемую связку. Термины разграничены, чтобы не свести כָּבוֹד, יקר и תִּפְאָרֶת к одному русскому слову.
