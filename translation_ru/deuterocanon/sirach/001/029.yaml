translation:
  language: ru
  text: Люби страх перед Господом, находи в нём счастье сердцу своему и не бойся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь существенно отличается: «Сердце разумного обдумает притчу, и ухо слушателя жаждет мудреца». Перевод основного текста следует сохранившемуся еврейскому чтению.'
    reason: Зафиксировать крупное расхождение между еврейской и греческой текстовыми традициями, не смешивая их в основном тексте.
lexical_decisions:
- source_word: אֱהַב
  choice: Люби
  rationale: Повелительная форма глагола «любить» передана прямо и современно, без более архаичного «возлюби».
- source_word: יִרְאַת יְהֹוָה
  choice: страх перед Господом
  rationale: יִרְאָה здесь означает благоговейный страх; конструкция «страх перед Господом» естественна по-русски. Тетраграмматон передан традиционным «Господь».
- source_word: וְאַשֵּׁר
  choice: благословляй
  rationale: Редкая форма от корня אשר допускает значение «считать счастливым, ублажать, благословлять». Выбрано «благословляй» в соответствии с засвидетельствованным еврейским чтением и аудированным консультационным слоем, хотя выражение остаётся необычным.
- source_word: בָּהּ לִבְּךָ
  choice: в нём своё сердце
  rationale: Местоимение женского рода относится к יִרְאָה («страх», женского рода в еврейском); по-русски согласование с «страхом» требует «в нём». Возвратное «своё» естественно указывает на сердце адресата.
- source_word: וְאַל תִּירָא
  choice: и не бойся
  rationale: Прямо передаёт отрицательное повеление и сохраняет намеренный смысловой контраст со «страхом перед Господом».
theological_decisions:
- issue: Сочетание призыва любить страх Господень с повелением не бояться
  choice: Сохранить оба высказывания без поясняющего разграничения
  alternative: Уточнить первое как «благоговение», а второе как запрет обычного страха
  rationale: Еврейский текст намеренно использует однокоренные слова יראה и תירא. Перевод сохраняет богословское напряжение и не вводит отсутствующего в тексте толкования.
- issue: Передача имени יְהֹוָה
  choice: Господь
  alternative: Яхве
  rationale: Традиционная русская передача ясна широкому читателю и соответствует принятому чтению тетраграмматона как «Господь», не добавляя конфессионально специфической интерпретации.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Необычное сочетание «благословляй в нём своё сердце» сохранено ради близости к высоконадёжному еврейскому источнику; текстовое расхождение с греческой традицией вынесено в примечание.
