base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/025.yaml
  text: Desire wisdom, keep the commandments, and the Lord will supply her[b][a] to you.
translation:
  language: ru
  text: Желая мудрости, соблюдай заповеди, и Господь дарует тебе её.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сохранившаяся еврейская строка, приложенная к этому стиху, не соответствует Сир 1:25, поэтому здесь перевод следует греческому свидетельству.
    reason: textual_variant
  - marker: b
    text: 'Возможно: «Если желаешь мудрости, соблюдай заповеди, и Господь даст тебе её». Начальное причастие можно понимать условно, а глагол — передать более общим словом «даст».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιθυμήσας
  choice: Желая
  rationale: Аористное причастие допускает условное понимание («если желаешь»), однако форма «желая» сохраняет грамматическую связь с греческим текстом и естественно вводит наставление.
- source_word: σοφίαν
  choice: мудрости
  rationale: Обычный русский эквивалент; последующее местоимение женского рода сохраняет олицетворение мудрости.
- source_word: διατήρησον
  choice: соблюдай
  rationale: В сочетании с заповедями это естественный современный библейский оборот, передающий постоянное верное исполнение.
- source_word: ἐντολάς
  choice: заповеди
  rationale: Передаёт религиозно-нравственный смысл точнее, чем общее «повеления».
- source_word: Κύριος
  choice: Господь
  rationale: Традиционный и естественный эквивалент κύριος в данном богословском контексте.
- source_word: χορηγήσει
  choice: дарует
  rationale: Передаёт не просто действие «дать», но благосклонное предоставление дара; в русском звучит естественнее буквального «снабдит» применительно к мудрости.
- source_word: σοι
  choice: тебе
  rationale: Явно передаёт дательный падеж греческого местоимения.
- source_word: αὐτήν
  choice: её
  rationale: Сохраняет отсылку к существительному женского рода «мудрость» и его олицетворение, не вводя неестественного для русского личного «ей».
theological_decisions:
- issue: Выбор исходного свидетельства для этого стиха
  choice: Переводить по греческому параллельному тексту.
  alternative: Перевести приложенную еврейскую строку об ангелах Божьих.
  rationale: Приложенная еврейская строка по содержанию не соответствует Сир 1:25, тогда как греческое свидетельство соответствует нумерации и контексту. Текстологическая проблема прямо отмечена в сноске.
- issue: Олицетворение мудрости
  choice: Использовать местоимение женского рода «её».
  alternative: Избежать местоимения, повторив слово «мудрость».
  rationale: Местоимение сохраняет связь с женским родом σοφία и литературное олицетворение, оставаясь естественным по-русски.
- issue: Синтаксическая сила начального причастия
  choice: Сохранить причастную форму «Желая мудрости».
  alternative: 'Передать условно: «Если желаешь мудрости».'
  rationale: Греческое причастие допускает оба понимания; основной текст сохраняет форму источника, а условное прочтение указано в сноске без устранения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Соблюдай заповеди» понятно широкому читателю; «дарует» сохраняет достоинство стиля без архаической тяжеловесности. Порядок сносок приведён к последовательному [a][b].
