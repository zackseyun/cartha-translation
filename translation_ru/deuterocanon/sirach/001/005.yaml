translation:
  language: ru
  text: Корень мудрости — кому он был открыт? И кто познал её тонкости?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Источник мудрости — слово Бога на высотах, а пути её — вечные заповеди». Еврейское свидетельство здесь существенно отличается от греческого.'
    reason: alternative_reading
lexical_decisions:
- source_word: שֹׁרֶשׁ
  choice: корень
  rationale: Сохраняет конкретную еврейскую метафору основания и происхождения мудрости; не гармонизирует её с греческим πηγή («источник»).
- source_word: הַחָכְמָה
  choice: мудрость
  rationale: Обычное и контекстуально точное соответствие в литературе премудрости.
- source_word: לְמִי נִגְלָה
  choice: кому он был открыт
  rationale: Передаёт дательный компонент לְמִי и страдательное значение нифаля נִגְלָה. Местоимение «он» согласовано с русским словом «корень».
- source_word: מַעֲרֻמֶּיהָ
  choice: её тонкости
  rationale: «Тонкости» естественно передаёт смысл скрытых, трудно постижимых аспектов мудрости и не придаёт выражению отрицательного оттенка хитрости или коварства.
- source_word: מִי יָדַע
  choice: кто познал
  rationale: Сохраняет прямое значение ידע и завершённый характер еврейской формы; «познал» уместно для возвышенного, но современного литературного регистра.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческой параллели
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; греческий вариант приведён в сноске.
  alternative: «Источник мудрости — слово Бога на высотах, а пути её — вечные заповеди».
  rationale: Еврейское свидетельство имеет приоритет как текст на языке оригинала, однако греческая строка представляет собой не малый вариант, а существенно иное чтение, которое необходимо сохранить для прозрачности.
translation_notes:
  register: Современный литературный русский язык с лаконичной риторической формой. Образ «корня» и два вопроса еврейского текста сохранены; архаизмы и конфессионально окрашенные формулы не используются.
