base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/024.yaml
  text: In the treasures of wisdom are insightful sayings[b], but godliness[c] is an abomination to a sinner.[a]
translation:
  language: ru
  text: В сокровищницах мудрости хранятся изречения, исполненные знания[b], но благоговение перед Богом[c] отвратительно грешнику.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившаяся в Каирской генизе еврейская строка, помещённая у Каханы в этом месте, приблизительно гласит: «Он будет радоваться ей, и она будет радоваться ему; не оставляй его вовек». Она не соответствует приведённому здесь греческому тексту, поэтому основной перевод этого стиха выполнен по греческому свидетелю.'
    reason: textual_variant
  - marker: b
    text: 'Или: «притчи знания», «пословицы, исполненные понимания».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «благочестие», «почитание Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν θησαυροῖς σοφίας
  choice: в сокровищницах мудрости
  rationale: Оборот сохраняет образ хранилищ или сокровищ мудрости; «сокровищницы» естественно сочетаются с добавленным по смыслу глаголом «хранятся».
- source_word: παραβολαὶ ἐπιστήμης
  choice: изречения, исполненные знания
  rationale: παραβολαί в литературе мудрости может обозначать притчи, пословицы или содержательные изречения, а родительный ἐπιστήμης характеризует их как несущие знание и понимание. Выбранная формулировка естественна по-русски и не сужает жанр до евангельской притчи.
- source_word: βδέλυγμα
  choice: отвратительно
  rationale: Слово обозначает нечто мерзкое, ненавистное или вызывающее отвращение. Предикативное прилагательное передаёт силу греческого существительного без неестественного русского оборота.
- source_word: ἁμαρτωλῷ
  choice: грешнику
  rationale: 'Дательный падеж указывает, чем богопочитание является с точки зрения грешника: оно отвратительно ему.'
- source_word: θεοσέβεια
  choice: благоговение перед Богом
  rationale: Передаёт почтение и благочестивое отношение именно к Богу, оставаясь ясным для современного читателя.
theological_decisions:
- issue: Расхождение сохранившейся еврейской строки с греческим текстом Сир 1:24
  choice: Основной текст переведён по греческому свидетелю, а несовпадающая еврейская строка приведена в примечании.
  alternative: Поместить перевод сохранившейся еврейской строки в основной текст стиха.
  rationale: Предоставленный еврейский текст не соответствует по содержанию греческому тексту данного стиха и отмечен как major_mismatch. Греческий свидетель сохраняет связное чтение Сир 1:24; расхождение не устраняется молча, а документируется в примечании.
- issue: Значение θεοσέβεια
  choice: благоговение перед Богом
  alternative: благочестие
  rationale: Выбранный вариант явно сохраняет направленность почитания к Богу, не добавляя конфессионально обусловленного содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской литературы мудрости. Формулировка остаётся понятной широкому читателю; образ сокровищницы сохранён, а текстологическое расхождение вынесено в прозрачное примечание.
