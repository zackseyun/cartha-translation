translation:
  language: ru
  text: Вся мудрость исходит от Яхве[a] и пребывает с ним вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте стоит имя «Яхве»; в греческом параллельном тексте — «от Господа».
    reason: Указать различие между прямым употреблением божественного имени в еврейском источнике и передачей его титулом в греческой традиции.
lexical_decisions:
- source_word: כָּל חָכְמָה
  choice: Вся мудрость
  rationale: כָּל при отвлечённом существительном выражает всю полноту мудрости. В современном русском «вся мудрость» естественнее передаёт совокупный смысл, чем «всякая мудрость».
- source_word: מֵיהֹוָה
  choice: исходит от Яхве
  rationale: Предлог מִן обозначает источник или происхождение. Глагол «исходит» естественно выражает этот смысл по-русски, а имя «Яхве» непосредственно передаёт יהוה.
- source_word: וִעמּוֹ הִיא
  choice: и пребывает с ним
  rationale: 'Буквально: «и с ним она». В русском добавлен глагол «пребывает», выражающий подразумеваемую связку и длительное нахождение; греческое ἐστιν подтверждает наличие связочного значения. Местоимение женского рода обусловлено словом «мудрость» и не усиливает персонификацию сверх оригинала.'
- source_word: לְעוֹלָמִים
  choice: вовеки
  rationale: Форма обозначает неограниченную продолжительность. «Вовеки» — понятное, краткое и достойное по регистру соответствие; греческое εἰς τὸν αἰῶνα передаёт тот же смысл.
theological_decisions:
- issue: Передача имени יהוה при греческом параллельном Κυρίου
  choice: Яхве
  alternative: Господа
  rationale: Высоконадёжный еврейский источник прямо содержит тетраграмматон יהוה, поэтому в основном тексте сохранено личное имя. Греческое «Господа» отмечено в сноске как параллельная передача, не заменяющая свидетельство еврейского текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Вовеки» сохраняет торжественность, оставаясь понятным; порядок слов сделан естественным для русского языка.
