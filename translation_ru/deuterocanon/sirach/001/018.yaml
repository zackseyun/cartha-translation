base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/018.yaml
  text: The fear of Yahweh is the beginning of wisdom[a], and she satisfies with the abundance of her produce.
translation:
  language: ru
  text: Начало мудрости — страх перед ГОСПОДОМ[a], и она насыщает обилием своих плодов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст: «Он излил знание и разумение и возвысил славу тех, кто держится её». Здесь греческий текст резко отличается от сохранившегося еврейского и, вероятно, отражает иную форму текста.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית
  choice: начало
  rationale: Прямое значение еврейского слова — «начало» или «первая часть»; в данной формуле естественно и без лишнего истолкования передаётся словом «начало».
- source_word: חָכְמָה
  choice: мудрость
  rationale: Обычное и контекстуально точное соответствие в литературе мудрости.
- source_word: יִרְאַת יְהֹוָה
  choice: страх перед ГОСПОДОМ
  rationale: Слово «страх» сохраняет присущее выражению сочетание благоговения, почтения и подлинного трепета; передача только как «почитание» сузила бы смысл. Имя יהוה передано принятой библейской формой «ГОСПОДЬ».
- source_word: וּתְרַוֵּה
  choice: и она насыщает
  rationale: Глагол выражает насыщение, обильное наполнение или напоение. Женская форма сказуемого допускает отнесение к персонифицированной мудрости; «насыщает» естественно передаёт результат, не устраняя образ изобилия.
- source_word: בְּרֹב
  choice: обилием
  rationale: Предлог с существительным обозначает содержание или средство насыщения; творительный падеж естественно передаёт эту связь и сохраняет количественный оттенок.
- source_word: תְּבוּאָתָהּ
  choice: своих плодов
  rationale: Слово обозначает урожай, произведение земли или плоды. «Плоды» сохраняет земледельческий образ и в русском контексте звучит естественнее, чем более техническое «урожай»; возвратное «своих» ясно связывает плоды с персонифицированной мудростью.
theological_decisions:
- issue: Выбор основного чтения при резком расхождении еврейского и греческого текстов
  choice: Основной текст переведён по сохранившемуся еврейскому чтению, а греческий вариант приведён в сноске.
  alternative: 'Перевести по греческому тексту: «Он излил знание и разумение и возвысил славу тех, кто держится её».'
  rationale: Сохранившийся еврейский текст имеет приоритет как исходное свидетельство. Однако греческий здесь передаёт существенно иной текст, вероятно отражающий другую форму оригинала, поэтому расхождение нельзя скрывать.
- issue: Женская персонификация мудрости
  choice: Сохранено местоименное указание «она» и принадлежащие ей «свои плоды».
  alternative: Передать вторую часть безлично либо отнести её к страху перед Господом.
  rationale: Женская форма еврейского сказуемого и женский притяжательный суффикс поддерживают образ мудрости как женщины. При этом синтаксическая соотнесённость не абсолютно прозрачна, поэтому перевод не добавляет имени «мудрость» повторно.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской литературы мудрости. Конструкция с тире сохраняет краткость афористической формулы; сельскохозяйственный образ передан словом «плоды». Написание «ГОСПОДЬ» обозначает тетраграмматон.
