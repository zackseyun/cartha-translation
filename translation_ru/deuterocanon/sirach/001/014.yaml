  yaml_path: translation/deuterocanon/sirach/001/014.yaml
  text: The beginning of wisdom is the fear of Yahweh[b][a], and with the faithful she was formed in the womb.
translation:
  language: ru
  text: Начало мудрости — страх перед Яхве, и вместе с верными она была образована во чреве.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «была хранима во чреве», если еврейский глагол понимать как производное от корня со значением «хранить, оберегать», а не как обозначение формирования.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст здесь существенно иной: «Среди людей она свила гнездо как вечное основание, и их потомству будет вверена». Еврейское и греческое свидетельства заметно расходятся.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  choice: Начало мудрости
  rationale: Сохраняет естественное для еврейской литературы мудрости выражение, указывающее на исходное основание мудрости.
- source_word: יִרְאַת יְהֹוָה
  choice: страх перед Яхве
  rationale: «Страх» сохраняет силу еврейского יִרְאָה и не сводит его только к почтительности; предлог «перед» делает выражение естественным по-русски.
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте.
- source_word: וְעִם נֶאֱמָנִים
  choice: и вместе с верными
  rationale: Прямо передаёт значение עִם «с, вместе с»; נֶאֱמָנִים понимается как субстантивированное обозначение верных людей.
- source_word: נוֹצְרָה
  choice: была образована
  rationale: В сочетании с «во чреве» передаёт образ возникновения и формирования; возможное понимание от корня со значением «хранить, оберегать» отмечено в сноске.
- source_word: בַבָּטֶן
  choice: во чреве
  rationale: Передаёт образ материнской утробы в возвышенном, но понятном современном русском регистре.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Основной текст сохраняет личное имя, присутствующее в еврейском свидетеле, не заменяя его титулом.
- issue: Существенное расхождение еврейского и греческого свидетелей
  choice: Основной текст следует сохранившемуся еврейскому чтению, а греческое приводится в сноске.
  alternative: 'Следовать греческому тексту в основном переводе: «Среди людей она свила гнездо как вечное основание, и их потомству будет вверена».'
  rationale: Еврейский текст является первичным источником там, где он сохранился, однако значительно отличающееся греческое свидетельство необходимо явно представить читателю.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Во чреве» выбрано вместо разговорного «в животе» и более клинического «в утробе»; синтаксис остаётся ясным для широкого круга читателей.
