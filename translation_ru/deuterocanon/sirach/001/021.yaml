base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/021.yaml
  text: Happy is the man who meditates on her[b][a], and she is better for him than every treasure.
translation:
  language: ru
  text: Счастлив человек, который размышляет о ней,[b] и она для него лучше всякого сокровища.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом свидетельстве здесь читается совсем иначе: «Ибо порыв его гнева — его падение». Вероятно, это отражает иную форму текста или иное расположение стихов по сравнению с сохранившимся еврейским текстом.'
    reason: textual_variant
  - marker: b
    text: 'Или: «Блажен человек, который размышляет о ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Счастлив
  rationale: Еврейская формула блаженства обозначает достойное зависти благополучие; «счастлив» естественно звучит в современном русском, тогда как традиционное «блажен» отмечено в сноске как допустимый вариант.
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: Слово обозначает человеческое существо, смертного; русское «человек» точно передаёт смысл и сохраняет обобщающий характер изречения.
- source_word: יֶהְגֶּה בָּהּ
  choice: размышляет о ней
  rationale: Глагол הגה здесь выражает продолжительное вдумчивое размышление, а женское местоимение указывает на олицетворённую Премудрость.
- source_word: וְטוֹבָה הִיא לוֹ
  choice: и она для него лучше
  rationale: Союз וְ сохранён, а сравнительная конструкция с последующим מִכָּל требует значения «лучше», а не просто «хороша».
- source_word: מִכָּל אוֹצָר
  choice: всякого сокровища
  rationale: אוֹצָר в данном изречении означает сокровище или накопленное богатство; «всякого» передаёт обобщающую силу מִכָּל.
- source_word: ἡ γὰρ ῥοπὴ τοῦ θυμοῦ αὐτοῦ πτῶσις αὐτῷ
  choice: не принято в основном тексте
  rationale: Греческое свидетельство радикально расходится с сохранившимся еврейским текстом и, вероятно, отражает иную форму текста либо иную нумерацию; разночтение приведено в сноске.
theological_decisions:
- issue: Олицетворение Премудрости
  choice: о ней / она
  alternative: об этом / это
  rationale: Женский местоименный суффикс и контекст олицетворённой Премудрости требуют сохранить женский личный образ, не обезличивая его.
- issue: Обобщающее обозначение человека
  choice: человек
  alternative: муж
  rationale: Еврейское אֱנוֹשׁ означает человека или смертного, а не специально взрослого мужчину; «человек» сохраняет и лексическую точность, и универсальность мудрого изречения.
translation_notes:
  register: Современный литературный русский язык с достоинством мудрой сентенции. Формулировка ясна широкому читателю; женские местоимения сохраняют олицетворение Премудрости. Значительное расхождение греческого свидетельства не сглажено, а вынесено в текстологическую сноску.
