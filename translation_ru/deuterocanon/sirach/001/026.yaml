lexical_decisions:
- source_word: σοφία
  choice: мудрость
  rationale: Обычное и содержательно широкое обозначение нравственной и практической мудрости в книге Сираха.
- source_word: παιδεία
  choice: наставление
  rationale: Передаёт обучение и воспитание, не сужая значение до наказания или строгой дисциплины.
- source_word: φόβος κυρίου
  choice: страх Господень
  rationale: Сохраняет ключевое выражение литературы мудрости и его богословскую весомость; речь включает благоговение, но не сводится к нему.
- source_word: εὐδοκία
  choice: благоволение
  rationale: Сохраняет возможность понимать выражение и как то, что угодно Господу, и как Его одобрение или благосклонность.
- source_word: πίστις
  choice: вера
  rationale: Прямой традиционный эквивалент; возможное контекстуальное значение «верность» отмечено в сноске.
- source_word: πρᾳότης
  choice: кротость
  rationale: Передаёт нравственное качество мягкости и смиренной незлобивости; современная альтернатива «мягкость» отмечена в сноске.
theological_decisions:
- issue: Выбор основного источника при несоответствующем еврейском свидетельстве
  choice: Переводить данный стих по греческому тексту, явно отметив расхождение.
  alternative: Перевести приведённую еврейскую строку как текст Сираха 1:26.
  rationale: Предоставленная еврейская строка содержательно не соответствует Сираху 1:26 и помечена как major_mismatch; поэтому для этого стиха действующим древним свидетельством служит греческий текст.
- issue: Значение πίστις
  choice: вера
  alternative: верность или доверие
  rationale: Греческое слово допускает несколько значений. Основной текст сохраняет традиционное «вера», а контекстуально правдоподобные варианты не устраняются, но приводятся в сноске.
- issue: Смысл ἡ εὐδοκία αὐτοῦ
  choice: Его благоволение
  alternative: угодны Ему; Его одобрение
  rationale: 'Именная конструкция сохраняет неоднозначность: выражение может указывать на то, что угодно Господу, либо на Его одобрение и благосклонность.'
translation_notes:
  register: Современный литературный русский язык с традиционной лексикой литературы мудрости. Синтаксис сохраняет краткую афористичность и параллелизм греческого текста; «страх Господень» и «кротость» оставлены как понятные, укоренённые библейские выражения.
