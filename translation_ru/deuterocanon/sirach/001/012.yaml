  text: The fear of Yahweh gladdens the heart[a], and gives joy and favor and length of days.
translation:
  language: ru
  text: Страх перед Господом радует сердце[a], дарит радость, благоволение и долгую жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте этот стих имеет существенно иную форму: «Тому, кто боится Господа, будет хорошо в конце, и в день своей смерти он будет благословлён».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִרְאַת יְהֹוָה
  choice: страх перед Господом
  rationale: Сохраняет прямое значение יִרְאָה — «страх», не сводя его лишь к почтению; сочетание «страх перед» естественно в современном русском. Тетраграмматон по принятой библейской традиции передан как «Господь».
- source_word: מְשַׂמַּחַת לֵב
  choice: радует сердце
  rationale: Передаёт каузативное значение причастия и сохраняет традиционный, понятный образ לֵב как сердца — внутреннего человека.
- source_word: וְנוֹתֶנֶת
  choice: дарит
  rationale: В данном перечислении «дарит» звучит естественнее буквального «даёт» и ясно выражает сообщение благ.
- source_word: שִׂמְחָה
  choice: радость
  rationale: Прямой и естественный эквивалент, сохраняющий намеренное смысловое повторение с глаголом «радует».
- source_word: חֵן
  choice: благоволение
  rationale: Передаёт חֵן как обретаемое расположение или благосклонность, не внося в текст более узкого позднейшего богословского смысла слова «благодать».
- source_word: אֹרֶךְ יָמִים
  choice: долгие дни
  rationale: Сохраняет образность еврейской идиомы и остаётся понятным обозначением долголетия; вариант «долгая жизнь» был бы более динамичным.
theological_decisions:
- issue: Существенное расхождение еврейского текста и греческой параллели
  choice: В основном тексте переведено сохранившееся еврейское чтение; греческая форма приведена в сноске.
  alternative: «Тому, кто боится Господа, будет хорошо в конце, и в день своей смерти он будет благословлён».
  rationale: Еврейское свидетельство связно и является первичным для данного перевода. Однако греческий текст содержит не небольшую разновидность, а существенно иное изречение, поэтому это различие нельзя ни замалчивать, ни согласовывать искусственно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис прост и ясен; сохранены ключевые образы и смысловое повторение еврейского текста.
