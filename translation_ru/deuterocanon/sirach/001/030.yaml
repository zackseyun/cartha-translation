review_pass:
  verdict: revise
  source_fidelity: 'Основной текст верно следует предоставленному еврейскому свидетельству, а не греческому тексту, который в данном месте представляет полностью иное чтение. Однако русское «для своей души» слишком буквально передаёт לְנַפְשְׁךָ: в этом контексте естественное «для себя» сохраняет смысл без неуместной психологизации. Связка «будь» во второй строке оправданно восполняет эллипсис, но остаётся интерпретативным восполнением.'
  naturalness: «Приблизься» допустимо, но «Подойди» естественнее в кратком русском наставлении. «Доблестный муж» звучит архаично и не вполне естественно для целевого современного литературного регистра; «доблестный воин» ясно передаёт איש חיל в параллели с גבור.
  terminology: 'Специальная богословская терминология в основном еврейском чтении отсутствует. В примечании «милостыня» и «искупает грехи» корректно отражают греческую параллель. Примечание следует сформулировать увереннее: перед нами не просто отсутствие словесного соответствия, а альтернативное чтение греческой традиции; причина расхождения по одним этим данным не устанавливается.'
  issues:
  - severity: low
    issue: Буквальное «жизнь для своей души»
    rationale: Еврейское לְנַפְשְׁךָ здесь естественно передать «для себя»; такой вариант точнее воспроизводит идиоматический смысл в современном русском.
  - severity: low
    issue: «Доблестный муж» архаично
    rationale: Для современного литературного русского «доблестный воин» естественнее и сохраняет воинственно-героическую семантику איש חיל в данной паре.
  - severity: low
    issue: Примечание чрезмерно спекулирует о нумерации
    rationale: Расхождение очевидно, но предоставленные сведения не позволяют утверждать, что его причина именно в нумерации или соотнесении единиц. Лучше назвать греческий текст альтернативным чтением.
  revised_text: Подойди, не медли — и найдёшь жизнь для себя. Когда же подойдёшь, будь как герой, как доблестный воин.[a]
