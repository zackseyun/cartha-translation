translation:
  language: ru
  text: Приблизься и не медли — и найдёшь жизнь для своей души. А приблизившись, будь как герой, как доблестный муж.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая традиция здесь содержит иной текст: «Вода гасит пылающий огонь, а милостыня искупает грехи». Предоставленный еврейский текст не имеет с ним словесного соответствия; вероятно, нумерация или соотнесение текстовых единиц различаются.'
    reason: Полное расхождение между главным еврейским источником и греческой параллелью существенно для читателя и не должно быть скрыто.
lexical_decisions:
- source_word: קְרַב
  choice: Приблизься
  rationale: Передаёт повелительную форму глагола קרב и сохраняет намеренно неуточнённое направление приближения.
- source_word: וְאַל תְּאַחֵר
  choice: и не медли
  rationale: Естественная современная передача запрета со значением «не задерживайся, не откладывай».
- source_word: וְתִמְצָא חַיִּים לְנַפְשְׁךָ
  choice: и найдёшь жизнь для своей души
  rationale: Сохраняет конкретный образ «найти жизнь» и явное לְנַפְשְׁךָ, не сводя его к более свободному «обретёшь жизнь».
- source_word: כְּגִבּוֹר וּכְאִישׁ חַיִל
  choice: как герой, как доблестный муж
  rationale: גיבור обозначает сильного героя или воина, а איש חיל — мужественного, доблестного человека; параллелизм сохранён без излишней милитаризации.
theological_decisions:
- issue: Расхождение еврейского текста с греческой параллелью и английским консультационным слоем
  choice: Основной текст переведён с предоставленного еврейского источника
  alternative: «Вода гасит пылающий огонь, а милостыня искупает грехи» — по греческому тексту и English POB
  rationale: Задание предписывает прежде всего переводить оригинально-языковое свидетельство. Поскольку расхождение полное и явно отмечено как major_mismatch, греческое чтение не следует молча подменять еврейским или смешивать с ним; оно вынесено в примечание.
- issue: Эллипсис во второй еврейской строке
  choice: Добавлено «будь»
  alternative: 'Буквально: «А когда будешь близок — как герой и как доблестный муж»'
  rationale: В еврейской строке сказуемое после придаточного выражено эллиптически. «Будь» делает русскую фразу грамматически полной и наиболее естественно связывает её с образами героя и доблестного мужа, не добавляя нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык с кратким, наставительным ритмом. Сохранены повтор корня «приблизиться» и возвышенная, но понятная пара «герой — доблестный муж».
