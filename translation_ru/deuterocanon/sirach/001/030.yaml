  revision_rationale: Перевод сохраняет первенство предоставленного еврейского текста, его повтор «подойди / подойдёшь» и его эллиптическую вторую строку. Изменения ограничены естественностью современного русского и более точным описанием документированного текстового расхождения с греческой традицией.
