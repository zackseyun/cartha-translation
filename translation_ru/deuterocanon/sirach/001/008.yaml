translation:
  language: ru
  text: Всякой плоти Он дал её по Своей воле[a] и даровал её любящим Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «дал её всякой плоти по Своей воле». В греческой традиции здесь: «излил её на все Свои дела».'
    reason: textual_variant
lexical_decisions:
- source_word: אֶל כָּל בָּשָׂר
  choice: всякой плоти
  rationale: Буквально «всей/всякой плоти». Сохранён прозрачный библейский образ, который в контексте может охватывать всех живых существ или всё человечество.
- source_word: כִּרְצוֹנוֹ
  choice: по Своей воле
  rationale: Рָצוֹן обозначает волю, желание или благоволение. Эта формулировка естественна в современном литературном русском и сохраняет смысл свободного Божьего решения.
- source_word: נְתָנָהּ
  choice: Он дал её
  rationale: Переданный еврейский текст содержит форму от נתן, «давать». В основном тексте принят прямой еврейский вариант, а отличие греческого параллельного текста отмечено в сноске.
- source_word: וַיִּתְּנָהּ
  choice: и даровал её
  rationale: Глагол означает «и дал её»; «даровал» естественно передаёт благодетельный характер действия и позволяет избежать тяжеловесного непосредственного повтора. Женский суффикс относится к мудрости.
- source_word: לְאֹהֲבָיו
  choice: любящим Его
  rationale: Причастная форма буквально обозначает тех, кто любит Его. Русская формулировка кратка, естественна и не добавляет конфессионально обусловленного смысла.
theological_decisions:
- issue: Расхождение между еврейским свидетельством и греческим параллельным текстом в первом полустишии
  choice: Следовать засвидетельствованному еврейскому чтению «дал её», открыто отметив греческий вариант в сноске.
  alternative: «Он излил её на все Свои дела» — по греческому тексту; либо смешанное чтение «излил её на всякую плоть».
  rationale: 'Еврейский текст здесь прямо читается как «всякой плоти по Своей воле дал её», тогда как греческая традиция имеет иную формулировку: Господь «излил её на все Свои дела». Смешивать греческий глагол с еврейским дополнением без рукописного подтверждения менее прозрачно; поэтому основной текст переводит еврейское свидетельство, а реальная текстовая неопределённость сохраняется в примечании.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Образ «всякая плоть» сохранён ради точности и узнаваемости исходной идиомы.
