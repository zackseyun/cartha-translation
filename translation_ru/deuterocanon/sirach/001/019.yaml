  text: She is a staff of strength and a support[a], praise and everlasting honor to everyone who walks after her.
translation:
  language: ru
  text: Она — посох силы и опора[a], хвала и вечная честь для каждого, кто следует за ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Корень мудрости — бояться Господа, а её ветви — долгая жизнь». Еврейское чтение здесь существенно отличается от греческой традиции.'
    reason: textual_variant
lexical_decisions:
- source_word: מַטּהֵ עֹז
  choice: посох силы
  rationale: מַטֶּה означает посох или жезл, а עֹז — силу, мощь. «Посох силы» сохраняет образ надежной опоры и поэтический параллелизм.
- source_word: מַשְׁעֵנָה
  choice: опора
  rationale: Существительное обозначает то, на что опираются. «Опора» естественно звучит по-русски и не повторяет слово «посох».
- source_word: תְּהִלָּה
  choice: хвала
  rationale: Прямое значение слова — «хвала»; оно может подразумевать также похвальность или получаемую человеком похвалу. Конкретное существительное сохраняет неоднозначность оригинала.
- source_word: כְבוֹד עוֹלָם
  choice: вечная честь
  rationale: כָּבוֹד может означать славу или честь, а עוֹלָם — непреходящую длительность. В отношении человека «вечная честь» звучит естественно и близко к еврейскому тексту.
- source_word: לְכָל הַהוֹלֵךְ אַחֲרֶיהָ
  choice: для каждого, кто следует за ней
  rationale: הלך אחרי — устойчивое выражение со значением «следовать за кем-либо». Русское «следует за ней» естественно передает идиому и сохраняет женский образ Премудрости.
theological_decisions:
- issue: Существенное расхождение еврейского и греческого текстов
  choice: Основной текст переведен по сохранившемуся еврейскому чтению.
  alternative: 'Греческий текст: «Корень мудрости — бояться Господа, а её ветви — долгая жизнь».'
  rationale: При наличии еврейского текста Сираха он служит первичным источником. Поскольку греческая традиция здесь содержит существенно иной стих, ее чтение вынесено в примечание без попытки согласовать два варианта.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической мудростной речи. Женское местоимение сохраняет олицетворение Премудрости; буквальное «идёт за ней» заменено естественным русским «следует за ней».
