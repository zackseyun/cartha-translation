base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/013.yaml
  text: One who fears Yahweh—his end will be good[a]; and at the end of his days he will be blessed.
translation:
  language: ru
  text: Боящийся ГОСПОДА — его конец будет благим, и в конце своих дней он будет благословлён.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этого стиха существенно отличается: «Начало мудрости — бояться Господа, и с верными она была сотворена во чреве для них». Основной текст следует сохранившемуся еврейскому свидетельству.'
    reason: textual_variant
lexical_decisions:
- source_word: יְרֵא יְהֹוָה
  choice: Боящийся ГОСПОДА
  rationale: Причастие יְרֵא употреблено субстантивно и обозначает человека, для которого характерен страх перед Богом. Форма «боящийся» сохраняет обобщённое единственное число; тетраграмматон передан традиционным «ГОСПОДЬ».
- source_word: תִּיטַב אַחֲרִיתוֹ
  choice: благим будет его конец
  rationale: Сохраняется акцент еврейского выражения на конечном исходе жизни без сужения смысла до материального благополучия. Приподнятый, но понятный оборот соответствует поэтическому параллелизму.
- source_word: וּבְאַחֲרִית יָמָיו
  choice: на закате своих дней
  rationale: Естественный русский оборот передаёт завершение жизненного пути и избегает тяжеловесного повтора слова «конец», оставаясь близким к образу исходного текста.
- source_word: יִתְבָּרָךְ
  choice: он будет благословлён
  rationale: 'Контекст поддерживает пассивное понимание формы: боящийся Господа получает благословение. Возвратный оттенок грамматически возможен, но здесь менее вероятен.'
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста с греческим свидетелем
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству; греческое разночтение приведено в сноске.
  alternative: 'Принять греческий текст за основной: «Начало мудрости — бояться Господа, и с верными она была сотворена во чреве для них»; либо объединить оба чтения.'
  rationale: Еврейский текст здесь сохранился и имеет высокую степень надёжности, поэтому он служит основой. Существенно иное греческое чтение нельзя ни замалчивать, ни смешивать с еврейским; оно открыто отмечено как текстовый вариант.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «ГОСПОДЬ» передаёт тетраграмматон; синтаксис сохраняет краткость и параллелизм еврейской строки.
