translation:
  language: ru
  text: Начало мудрости — страх перед Яхве; с ним — обилие мира, жизни и исцеления.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст: «Весь их дом был наполнен желанными её дарами, а хранилища — её плодами». Эта строка существенно отличается от сохранившегося еврейского текста.'
