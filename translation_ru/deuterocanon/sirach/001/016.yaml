lexical_decisions:
- source_word: רֵאשִׁית
  choice: начало
  rationale: Передаёт обычное значение существительного и сохраняет возможный как временной, так и основополагающий смысл изречения.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Устоявшееся и контекстуально точное соответствие в литературе мудрости.
- source_word: יִרְאַת
  choice: страх перед
  rationale: Сохраняет вес еврейского слова «страх», не сводя его лишь к почтительности; конструкция «перед Яхве» естественна для современного русского языка.
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, непосредственно стоящее в еврейском тексте.
- source_word: וּמַרְבָּה
  choice: он умножает
  rationale: Форма допускает понимание как причастия со значением «умножает». В русском местоимение согласовано со словом «страх»; такой перевод не требует добавлять отсутствующее в источнике понятие «приносит».
- source_word: שָׁלוֹם
  choice: мир
  rationale: Основное соответствие; в сочетании с жизнью и исцелением сохраняет также оттенок целостного благополучия.
- source_word: חַיִּים
  choice: жизнь
  rationale: Еврейская форма морфологически множественного числа обычно обозначает жизнь как единое понятие.
- source_word: וּמַרְפֵּא
  choice: исцеление
  rationale: Сохраняет деятельный, восстановительный оттенок слова, не сужая его до общего состояния здоровья.
theological_decisions:
- issue: Передача имени יְהֹוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходной еврейской строке прямо употреблён тетраграмматон; транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Существенное расхождение еврейского и греческого свидетельств
  choice: Основной текст следует сохранившейся еврейской строке, а греческая форма приводится в примечании.
  alternative: 'Следовать греческому тексту: «Она наполнила весь их дом своими желанными дарами, а хранилища — своими плодами».'
  rationale: Сохранившийся еврейский текст является основным свидетельством для перевода, однако греческий вариант имеет совершенно иное содержание и потому должен быть явно сохранён как значимое текстовое разночтение.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Тире оформляет именное высказывание, а точка с запятой ясно связывает следствие с первой частью. Формулировка сохраняет библейскую весомость без архаизмов.
