translation:
  language: ru
  text: Кто исчислит песок морей, капли дождя и дни вечности[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дни века»; возможно также: «дни древности». Еврейское עוֹלָם может обозначать вечность, век либо давнее время; греческая параллель также указывает на неизмеримую длительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹל יַמִּים
  choice: песок морей
  rationale: Собирательное «песок» точно передаёт חוֹל, а множественное «морей» сохраняет форму יַמִּים и согласуется с греческой параллелью ἄμμον θαλασσῶν.
- source_word: נִטְפֵי מָטָר
  choice: капли дождя
  rationale: Буквальная и естественная передача сочетания в сопряжённом состоянии; сохраняет конкретный образ и соответствует греческому σταγόνας ὑετοῦ.
- source_word: וִימוֹת עוֹלָם
  choice: дни вечности
  rationale: Передача сохраняет образ «дней» и выражает неизмеримую длительность; при этом многозначность עוֹלָם отмечена в сноске.
- source_word: מִי יִמְנֶה
  choice: Кто исчислит
  rationale: Риторический вопрос передаёт невозможность для человека охватить перечисленное счётом. «Исчислит» звучит естественно в возвышенной мудростной речи и связывает все три дополнения.
theological_decisions:
- issue: Временное значение עוֹלָם в мудростной гиперболе
  choice: «вечности» как обозначение неизмеримой длительности
  alternative: «века» или «древних времён»
  rationale: Контекст перечисляет то, что не поддаётся человеческому счёту, а греческое ἡμέρας αἰῶνος поддерживает представление о необъятной длительности. Формулировка не превращает стих в специальное метафизическое утверждение; смысловая широта слова сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростной поэзии. Параллельные образы переданы кратко и симметрично; умеренно возвышенное «исчислит» соответствует риторическому строю стиха без архаизации.
