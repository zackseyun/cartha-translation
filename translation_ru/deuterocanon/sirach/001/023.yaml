  text: Until the right time he will conceal his words, and the lips of many will recount his understanding.[a]
translation:
  language: ru
  text: До назначенного времени он скроет свои слова, и уста многих поведают о его разумении.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст Каирской генизы здесь резко отличается от греческого и приблизительно гласит: «Ты возложишь на него вечный венец и вечную заслугу среди святых». Поскольку это еврейское свидетельство отмечено как существенное несоответствие, основной текст данного стиха следует греческому.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἕως καιροῦ
  choice: До назначенного времени
  rationale: Поскольку сохранившаяся еврейская строка существенно расходится с греческим текстом данного стиха, перевод основан на греческом параллельном источнике. Καιρός обозначает подходящее или назначенное время; выбранный вариант передаёт этот оттенок без излишнего уточнения.
- source_word: κρύψει
  choice: будет скрывать
  rationale: Будущее время глагола κρύπτω; формулировка естественно передаёт намеренное удержание слов до надлежащего срока.
- source_word: τοὺς λόγους αὐτοῦ
  choice: свои слова
  rationale: Возвратное местоимение по-русски ясно соотносит слова с подлежащим и естественнее буквального «его слова» в пределах одного предложения.
- source_word: χείλη πολλῶν
  choice: уста многих
  rationale: Сохранён поэтический образ греческого текста и параллелизм со «словами»; «уста» соответствует возвышенному, но понятному регистру литературы мудрости.
- source_word: ἐκδιηγήσεται
  choice: поведают
  rationale: Глагол выражает подробное изложение или рассказ. «Поведают» передаёт смысл и сочетается с образом уст, не утяжеляя строку.
- source_word: σύνεσιν αὐτοῦ
  choice: о его разумении
  rationale: Σύνεσις означает понимание, разумение или проницательность. «Разумение» сохраняет связь с традиционной лексикой литературы мудрости и не сужает значение до одного отдельного качества.
theological_decisions:
- issue: Выбор основного текста при существенном расхождении еврейского и греческого свидетелей
  choice: Основной текст переведён по греческому параллельному источнику, а отличающееся еврейское чтение приведено в примечании.
  alternative: 'Перевести сохранившуюся еврейскую строку как основной текст: «Ты возложишь на него вечный венец и вечную заслугу среди святых».'
  rationale: Предоставленная еврейская строка не соответствует по смыслу греческому тексту Сир 1:23 и помечена как major_mismatch. Поэтому греческий свидетель служит наиболее обоснованной основой именно для этого стиха; расхождение не гармонизируется и открыто отмечается.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической лексикой («уста», «разумение»), уместной для книги Премудрости, но доступной обычному читателю. Синтаксис остаётся ясным, а образность греческого текста сохранена.
