base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/001/031.yaml
  text: My son[a], do not be false in the fear of Yahweh[b], and do not draw near to him with a divided heart.
translation:
  language: ru
  text: Сын мой[a], не будь неискренним в страхе перед Яхве и не приближайся к Нему с раздвоенным сердцем[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское свидетельство гласит: «Сын мой, не будь неискренним в страхе перед Яхве и не приближайся к Нему с раздвоенным сердцем». В греческом тексте на этом месте содержится иное изречение: «Кто воздаёт за благодеяния, тот помнит о будущем и во время падения найдёт опору».'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «с сердцем и сердцем» — еврейская идиома, обозначающая внутреннюю двойственность или неискренность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנִי
  choice: Сын мой
  rationale: Сохраняет мужской род, единственное число и традиционное обращение наставника к ученику в литературе мудрости.
- source_word: אַל תְּכַזֵּב
  choice: не будь неискренним
  rationale: 'Глагол כזב здесь указывает шире, чем на словесную ложь: на фальшь и лицемерие в отношении богобоязненности.'
- source_word: בְּיִרְאַת יְהֹוָה
  choice: в страхе перед Яхве
  rationale: Сохраняет характерное для литературы мудрости понятие «страха» как благоговейного отношения к Богу и передаёт тетраграмматон личным именем «Яхве».
- source_word: וְאַל תִּקְרַב אֵלָיו
  choice: и не приближайся к Нему
  rationale: Естественно передаёт קרב с אֶל и сохраняет возможный религиозный оттенок приближения к Богу.
- source_word: בְּלֵב וָלֵב
  choice: с раздвоенным сердцем
  rationale: Буквально «с сердцем и сердцем»; это еврейская идиома внутренней двойственности и неискренности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя и соответствует заданному решению проекта.
- issue: Существенное расхождение еврейского и греческого текстов
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству, греческий вариант приведён в примечании
  alternative: Перевести греческий текст или объединить оба чтения
  rationale: Еврейский источник имеет высокую степень уверенности и является первичным для данного задания; существенно иной греческий текст нельзя безосновательно смешивать с ним.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка ясна обычному читателю; сохранены обращение «Сын мой», термин «страх» и образ сердца. Местоимение «Нему» написано с прописной буквы по принятой русской религиозной традиции.
