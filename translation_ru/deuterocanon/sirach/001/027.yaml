  text: Do not disobey the fear of the Lord, and do not come to him with a divided heart.
translation:
  language: ru
  text: Не противься страху Господню и не приближайся к Нему[a] с двоящимся сердцем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к нему», то есть к страху Господню.'
    reason: Греческое местоимение αὐτῷ может относиться как к Господу, так и к страху Господню.
lexical_decisions:
- source_word: μὴ ἀπειθήσῃς
  choice: не противься
  rationale: Передаёт запрет неповиновения или отказа внимать, не добавляя отсутствующего в греческом объекта действия.
- source_word: φόβῳ Κυρίου
  choice: страху Господню
  rationale: Сохраняет традиционное библейское выражение и дательный падеж греческого текста.
- source_word: μὴ προσέλθῃς
  choice: не приближайся
  rationale: Естественно передаёт движение или обращение к кому-либо, выраженное προσέρχομαι.
- source_word: ἐν καρδίᾳ δισσῇ
  choice: с двоящимся сердцем
  rationale: Сохраняет образ внутренней двойственности; «двоящееся» точнее удерживает динамический оттенок, чем более толковое «раздвоенное».
theological_decisions:
- issue: К кому относится местоимение αὐτῷ
  choice: к Нему — к Господу
  alternative: к нему — к страху Господню
  rationale: И «Господь», и «страх» в греческом мужского рода, поэтому формально возможны оба прочтения. Обращение к Господу с внутренне двойственным сердцем наиболее естественно по смыслу и соответствует древней переводческой традиции, но неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением библейской образности. Представленный еврейский отрывок помечен как крупное несоответствие и по содержанию не совпадает с Сир 1:27, поэтому основой послужил греческий параллельный текст.
