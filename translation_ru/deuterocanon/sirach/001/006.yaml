  text: Кому был открыт корень мудрости и кто познал её тонкости?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившаяся строка еврейского текста из Каирской генизы существенно расходится с этим стихом в греческой традиции. Она читается приблизительно так: «Один лишь Он внушает трепет; Бог властвует над всеми её сокровищницами». Поэтому основной текст здесь переведён с греческого.'
    reason: textual_variant
  - marker: b
    text: 'Или: «её искусные замыслы», «её действия». Греческое слово может обозначать хитроумные приёмы, но здесь не обязательно имеет отрицательный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα σοφίας
  choice: корень мудрости
  rationale: Передаёт прямое значение греческого выражения и сохраняет исходную метафору; предоставленная еврейская строка существенно расходится с этим стихом в греческой традиции.
- source_word: τίνι ἀπεκαλύφθη
  choice: кому был открыт
  rationale: Сохраняет страдательный залог и естественно передаёт значение «был явлен, открыт».
- source_word: τὰ πανουργεύματα αὐτῆς
  choice: все её тонкости
  rationale: В данном контексте слово обозначает сложные, искусные проявления мудрости без обязательного отрицательного оттенка; «тонкости» сохраняет эту смысловую открытость.
- source_word: τίς ἔγνω
  choice: кто познал
  rationale: «Познал» передаёт не только осведомлённость, но и глубокое постижение, уместное в риторическом вопросе о мудрости.
theological_decisions:
- issue: Выбор основного источника при существенном расхождении еврейского свидетеля
  choice: Основной текст переведён по греческому параллельному источнику
  alternative: 'Перевести сохранившуюся еврейскую строку: «Один лишь Он внушает трепет; Бог властвует над всеми её сокровищницами»'
  rationale: Предоставленный еврейский текст помечен как существенное расхождение и не соответствует Сир 1:6 греческой традиции. Поэтому основной перевод следует греческому тексту, а еврейское чтение прозрачно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; риторическая форма и метафора корня сохранены. «Познал» придаёт фразе достоинство, оставаясь понятным современному читателю; формулировка не устраняет текстологическую неопределённость.
