  text: All her storehouses she fills with delight[b][a], and her granaries with her produce.
translation:
  language: ru
  text: Все свои кладовые она наполняет желанными благами[a][b], а житницы — своим урожаем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «Все её кладовые она наполняет желанным, а её житницы — своим урожаем». Греческий свидетель содержит иной текст: «Венец мудрости — страх Господень, расцветающий миром и целительным здравием».'
    reason: textual_variant
  - marker: b
    text: 'Или: «драгоценностями», «приятными вещами» либо «отрадой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אוֹצָרֶיהָ
  choice: все свои кладовые
  rationale: אוֹצָר может означать хранилище, кладовую или сокровищницу. Параллель с אֲסָמֶיהָ указывает здесь прежде всего на место хранения припасов; множественное число передаёт форму еврейского текста.
- source_word: תְּמַלֵּא
  choice: она наполняет
  rationale: Имперфект передан настоящим временем как обобщающее изречение литературы мудрости; явное «она» сохраняет олицетворение мудрости и порядок мысли исходного текста.
- source_word: חֶמְדָּה
  choice: желанными благами
  rationale: חֶמְדָּה охватывает значения желанности, ценности, приятности и отрады. «Желанные блага» естественно сочетается с наполнением кладовых, не сводя слово только к эмоциональному переживанию.
- source_word: וַאֲסָמֶיהָ
  choice: а житницы
  rationale: אָסָם обозначает амбар или зернохранилище. «Житницы» сохраняет сельскохозяйственный образ и отличается от более общего «кладовые».
- source_word: בִּתְבוּאָתָהּ
  choice: своим урожаем
  rationale: תְּבוּאָה означает урожай, плоды или произведение земли. Возвратное «своим» естественно соотносит суффикс женского рода с олицетворённой мудростью.
- source_word: στέφανος σοφίας
  choice: не принято в основной текст
  rationale: Греческий свидетель содержит существенно иной текст о венце мудрости. При наличии еврейского текста основой перевода служит он, а греческое чтение приводится в примечании как важный текстовый вариант.
theological_decisions:
- issue: Существенное расхождение еврейского и греческого свидетелей в Сир 1:17
  choice: В основном тексте переведён сохранившийся еврейский текст.
  alternative: «Венец мудрости — страх Господень, расцветающий миром и целительным здравием».
  rationale: Для Книги Премудрости Иисуса, сына Сирахова приоритет отдаётся сохранившемуся еврейскому свидетельству. Резко отличающееся греческое чтение не гармонизируется с ним и полностью сохраняется в примечании, чтобы не скрывать текстовую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством, присущим изречению мудрости. «Житницы» сохраняет традиционный сельскохозяйственный образ, оставаясь понятным; эллипсис «житницы — своим урожаем» устраняет тяжёлый повтор глагола.
