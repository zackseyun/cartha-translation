  text: Before all these, wisdom was created[b][a], and true understanding is from eternity.
translation:
  language: ru
  text: Прежде всего была сотворена мудрость[a], и понимание, ведущее к рассудительности, — от века[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст передаёт эту строку иначе: «Мудрость превосходит всё это»; греческий текст: «Прежде всего была сотворена мудрость». Основной текст следует греческому чтению.'
    reason: alternative_reading
  - marker: b
    text: 'В еврейском тексте вторая часть стиха гласит: «И истина сильна (или: торжествует) от века»; в греческом — «и понимание, ведущее к рассудительности, — от века».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִכָּל אֵלֶּה / προτέρα πάντων
  choice: прежде всего этого
  rationale: Греческое προτέρα πάντων прямо выражает первенство во времени; указательное «этого» сохраняет связь с еврейским אֵלֶּה («это»). Расхождение с возможным сравнительным смыслом еврейского מן отмечено в сноске.
- source_word: רַבָּה / ἔκτισται
  choice: была сотворена
  rationale: Основной текст следует греческому ἔκτισται, тогда как сохранившееся еврейское רַבָּה означает «велика» или «стала великой». Разночтение не сглажено и вынесено в сноску.
- source_word: הַחָכְמָה / σοφία
  choice: мудрость
  rationale: Обычный и контекстуально точный эквивалент в литературе мудрости; строчная буква не навязывает полного олицетворения.
- source_word: σύνεσις φρονήσεως
  choice: разумное постижение
  rationale: Передаёт сочетание понимания и практической рассудительности естественным современным русским выражением, не сводя его просто к «истине» еврейского варианта.
- source_word: מֵעוֹלָם / ἐξ αἰῶνος
  choice: от века
  rationale: Сохраняет поэтический смысл изначальной древности и возможную вечностную окраску, не уточняя сверх текста, идёт ли речь строго о безначальной вечности.
theological_decisions:
- issue: Резкое расхождение еврейского и греческого свидетелей в обеих частях стиха
  choice: В основном тексте передана структура и центральный смысл греческого свидетеля, а еврейское чтение полностью сохранено в сносках.
  alternative: «Больше всего этого велика мудрость, и истина сильна от века» или «…истина торжествует от века».
  rationale: Составной еврейский текст здесь заключён издателем в скобки и существенно расходится с греческим. Греческий даёт связное чтение о первозданности мудрости; однако еврейский вариант обладает высокой текстовой значимостью и поэтому явно представлен читателю, а не устранён молча.
- issue: Характер утверждения о сотворении мудрости
  choice: Сохранено «была сотворена» как прямой перевод греческого ἔκτισται.
  alternative: Еврейское «мудрость велика» не содержит утверждения о сотворении.
  rationale: Перевод не отождествляет мудрость с каким-либо конкретным богословским субъектом и не делает догматических выводов из образного языка; текстовое расхождение отмечено открыто.
translation_notes:
  register: Современный литературный русский с достоинством поэтической книги мудрости. Выражение «от века» сохраняет библейскую возвышенность, оставаясь понятным; «разумное постижение» избегает тяжеловесного буквального «разумение рассудительности». Все разночтения обозначены непосредственно при соответствующих частях стиха.
