translation:
  language: ru
  text: Не лицемерь перед людьми[a] и следи за своими устами.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «в устах людей»; выражение может также пониматься как «среди людей» или «на людях».'
    reason: lexical_alternative
  - marker: b
    text: 'Сохранившаяся еврейская строка в предоставленном свидетельстве гласит: «Слушай все мои слова и исполняй их — и будешь записан в книге жизни». По-видимому, она не соответствует этому стиху, поэтому перевод здесь следует греческому тексту.'
    reason: textual_variant
lexical_decisions:
- source_word: μὴ ὑποκριθῇς
  choice: Не лицемерь
  rationale: Греческий глагол ὑποκρίνομαι здесь предостерегает от лицемерия и притворства. Краткая форма «не лицемерь» естественна для современного русского языка и сохраняет прямую силу запрета.
- source_word: ἐν στόμασιν ἀνθρώπων
  choice: перед людьми
  rationale: Буквально греческое выражение означает «в устах людей», однако в данном контексте оно, вероятно, относится к поведению или речи среди людей. В основном тексте выбран ясный идиоматический вариант, а буквальный образ и его неоднозначность отмечены в сноске.
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз естественно передаёт параллелизм двух наставлений.
- source_word: ἐν τοῖς χείλεσί σου πρόσεχε
  choice: следи за своими устами
  rationale: Выражение призывает тщательно контролировать собственную речь. «Следи за своими устами» сохраняет телесный образ χείλη и звучит понятно и достойно по-русски.
theological_decisions:
- issue: Выбор исходного текста при существенном расхождении еврейского и греческого свидетелей
  choice: Перевод выполнен по греческому тексту, а несовпадающая еврейская строка приведена в сноске.
  alternative: Перевести дошедшую еврейскую строку как текст Сир 1:28.
  rationale: Предоставленная еврейская строка не соответствует содержанию Сир 1:28 в греческой традиции и помечена как major_mismatch. Поэтому греческое свидетельство служит здесь основой перевода, а расхождение открыто документируется без попытки скрыто согласовать тексты.
translation_notes:
  register: Современный литературный русский язык с краткой наставительной интонацией. «Уста» сохраняют образ исходного текста и придают фразе умеренно возвышенное, но понятное звучание; архаические синтаксические обороты исключены.
