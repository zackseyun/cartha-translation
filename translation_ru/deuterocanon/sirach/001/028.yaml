  verdict: approve
  source_fidelity: 'Основной текст обоснованно следует греческому свидетельству: «Не лицемерь перед людьми» точно передаёт запрет μὴ ὑποκριθῇς, а «следи за своими устами» — призыв ἐν τοῖς χείλεσί σου πρόσεχε. Необычный образ ἐν στόμασιν ἀνθρώπων не утрачивается без уведомления читателя: его буквальность и возможные идиоматические понимания отмечены в сноске. Еврейская строка действительно содержательно не соответствует греческому тексту данного стиха, и сноска корректно фиксирует выбор основы перевода.'
  naturalness: Текст краток, ясен и соответствует современному литературному русскому с наставительной интонацией. «Не лицемерь перед людьми» естественно. «Следи за своими устами» несколько более образно, чем нейтральное «следи за своей речью», но понятно, литературно и уместно сохраняет образ «уст».
  terminology: «Лицемерь» адекватно передаёт ὑποκρίνομαι в данном этическом контексте. «Уста» — традиционное, но всё ещё понятное литературное слово; здесь оно оправдано соответствием греческому χείλεσιν. Формулировка сноски о несовпадающей еврейской строке нейтральна и не навязывает конфессионального вывода.
