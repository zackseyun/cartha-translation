  terminology: «Исследовал», «исчислил» и «дал» уместно передают глагольную цепочку, сохраняя сдержанно возвышенный библейский регистр. «Тем, кто любит его» грамматически верно отражает мужской суффикс без конфессионально обусловленного уточнения референта.
