translation:
  language: ru
  text: Он исследовал её, увидел и исчислил, и дал её тем, кто любит его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном свидетельстве: «Есть один мудрый, весьма грозный, восседающий на своём престоле». Сохранившийся здесь еврейский текст существенно отличается от греческой традиции.'
    reason: textual_variant
lexical_decisions:
- source_word: בְחָנָהּ
  choice: исследовал её
  rationale: Глагол בחן означает проверять или тщательно исследовать. «Исследовал» естественно передаёт внимательное постижение, не уточняя способ проверки сверх сказанного в еврейском тексте.
- source_word: וְרָאָהּ
  choice: увидел
  rationale: Прямое значение ראה — «видеть». Простой глагол сохраняет сжатую последовательность действий в еврейском тексте.
- source_word: וְסְפָרָהּ
  choice: исчислил
  rationale: ספר в данной форме означает считать, исчислять. «Исчислил» сохраняет образ полноты измерения Премудрости и звучит достойно, тогда как «сосчитал её» в современном русском было бы неестественно.
- source_word: וּנְתָנָהּ
  choice: дал её
  rationale: נתן — обычный глагол «давать». Прямой перевод не привносит отсутствующего в источнике оттенка.
- source_word: לְאֹהֲבָיו
  choice: тем, кто любит его
  rationale: Местоименный суффикс мужского рода единственного числа естественнее всего относится к Богу как подразумеваемому субъекту. Строчная буква сохраняет обычную современную русскую орфографию и не превращает толкование в графически закреплённое уточнение.
- source_word: ־הּ в глагольных формах
  choice: её
  rationale: Суффиксы женского рода относятся к Премудрости, грамматически женскому существительному и олицетворённому образу в контексте; «её» сохраняет это олицетворение.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста с греческим свидетелем
  choice: В основном тексте переведён сохранившийся еврейский вариант, а греческий приведён в сноске как существенно иное чтение.
  alternative: «Один есть мудрый, весьма грозный, восседающий на своём престоле».
  rationale: Еврейская строка целостна и переводима, поэтому она служит основным текстом. Однако греческая традиция содержит не словесную мелочь, а совершенно иной текст, что необходимо открыто отметить.
- issue: К кому относится мужской суффикс в לְאֹהֲבָיו
  choice: 'Он относится к Богу, подразумеваемому субъекту: «тем, кто любит его».'
  alternative: 'Отнести местоимение по смыслу к Премудрости: «тем, кто любит её».'
  rationale: В еврейском стоит суффикс мужского рода единственного числа, тогда как Премудрость обозначена женским родом. Перевод сохраняет грамматическое различие и не подменяет его смысловым согласованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Исчислил» выбрано вместо разговорно-буквального «сосчитал», а цепочка союзов слегка сглажена ради естественного русского синтаксиса. Олицетворение Премудрости сохранено местоимением женского рода.
