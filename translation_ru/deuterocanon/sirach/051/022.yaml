translation:
  language: ru
  text: Господь дал мне награду за слова моих уст; поэтому я приобрёл её[a] как доброе приобретение.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Её» — то есть Премудрость, о которой говорится в ближайшем контексте.
    reason: cross_reference
  - marker: b
    text: 'В греческом тексте: «Господь дал мне язык в награду, и им я буду прославлять Его».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהֹוָה
  choice: Господь
  rationale: Традиционная и естественная для русского библейского текста передача имени Божьего; сохраняет ясную отсылку к Тетраграмматону без введения спорной реконструкции произношения.
- source_word: שְׂכַר שִׂפְתוֹתָי
  choice: награду за слова моих уст
  rationale: Сохраняет конкретный образ уст, но по-русски яснее передаёт смысл выражения, чем буквальное «награду моих уст»; вероятно, речь идёт о произнесённых словах, хвале или исповедании, без устранения контекстной широты.
- source_word: בַּעֲבוּר כֵּן
  choice: поэтому
  rationale: Кратко и естественно выражает причинно-следственную связь еврейской фразы.
- source_word: קְנִיתִיהָ
  choice: я обрёл её
  rationale: Глагол допускает значения приобретения и обретения. «Обрёл» естественно звучит применительно к Премудрости и не навязывает коммерческий оттенок; женский суффикс сохранён местоимением «её».
- source_word: קִנְיָן טוֹב
  choice: доброе достояние
  rationale: Передаёт ценное владение и сохраняет достоинство речи. Полная еврейская игра между קנה и קנין в естественном русском воспроизводится лишь частично.
- source_word: αἰνέσω αὐτόν
  choice: не включено в основной текст
  rationale: Греческий параллельный текст существенно расходится с сохранившимся еврейским и говорит о прославлении Бога данным языком; при наличии еврейского свидетельства основная строка следует ему, а греческое чтение приводится в примечании.
theological_decisions:
- issue: Выбор основного чтения при расхождении еврейского и греческого текстов
  choice: 'Следовать сохранившемуся еврейскому тексту: Господь даёт награду, после чего говорящий обретает Премудрость как доброе достояние.'
  alternative: 'Следовать греческому тексту: «Господь дал мне язык в награду, и им я буду прославлять Его».'
  rationale: Для Книги Сираха сохранившийся еврейский текст является первичным источником. Существенно отличающееся греческое чтение не смешивается с основной строкой, но сохраняется в примечании.
- issue: Референт местоимения женского рода в קְנִיתִיהָ
  choice: Пояснить в примечании, что «её» относится к Премудрости.
  alternative: Вставить «Премудрость» непосредственно в основной текст.
  rationale: Местоимение сохраняет форму еврейского текста и его контекстную связность; пояснение устраняет возможную неясность, не подменяя местоимение явным существительным.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формула «слова моих уст» сохраняет еврейский телесный образ, а «доброе достояние» передаёт ценность приобретённой Премудрости без архаической тяжеловесности.
