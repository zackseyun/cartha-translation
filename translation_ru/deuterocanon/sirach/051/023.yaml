  text: Turn to me[a], you who are simple[b], and lodge in the house of my instruction.
translation:
  language: ru
  text: Обратитесь ко мне[a], неучёные[b], и остановитесь в доме моего учения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Приблизьтесь ко мне». Так передаёт эту фразу греческий текст.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «неразумные», «простодушные» или «глупцы»; греческий текст говорит о тех, кто не получил наставления.
    reason: alternative_reading
lexical_decisions:
- source_word: פְּנוּ אֵלַי
  choice: Обратитесь ко мне
  rationale: Императив от פנה буквально передаёт поворот или обращение к кому-либо. Русское «обратитесь ко мне» сохраняет еврейский образ и вместе с тем естественно выражает приглашение; греческое «приблизьтесь ко мне» подтверждает этот смысл.
- source_word: סְכָלִים
  choice: неучёные
  rationale: Еврейское слово может обозначать неразумных, простодушных или глупцов, однако в контексте приглашения к учению акцент, вероятно, падает на недостаток наставления. Греческое ἀπαίδευτοι («необученные, невоспитанные») поддерживает такое понимание. Сноска сохраняет более резкие возможные значения.
- source_word: וְלִינוּ
  choice: и поселитесь
  rationale: לין означает остановиться на ночлег, переночевать или расположиться где-либо. «Поселитесь» сохраняет образ вхождения в дом и продолжительного пребывания в нём, не ограничивая приглашение одной ночью; греческое αὐλίσθητε также относится к размещению на постой.
- source_word: בְּבֵית מִדְרָשִׁי
  choice: в доме моего учения
  rationale: Выражение буквально обозначает «дом моего изучения/наставления». «Дом моего учения» сохраняет метафору места, где обретают наставление, и не придаёт слову מדרש более позднего узкотехнического значения.
theological_decisions:
- issue: Передавать ли סְכָלִים как нравственное порицание или как указание на недостаток обучения
  choice: неучёные
  alternative: неразумные; простодушные; глупцы
  rationale: Контекст представляет приглашение в место наставления, а греческий параллельный текст подчёркивает отсутствие обучения. Поэтому основной текст не усиливает нравственное осуждение, тогда как сноска открыто сохраняет смысловой диапазон еврейского слова.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным тоном. Сохранены метафора дома учения и прямое приглашение; неоднозначность обращения вынесена в сноску.
