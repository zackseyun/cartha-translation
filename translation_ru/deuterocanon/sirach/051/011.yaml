lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временной переход от предшествующей молитвы и обещания хвалы к ответу Бога.
- source_word: שָׁמַע
  choice: услышал
  rationale: Сохраняет прямое значение глагола и его отличие от следующего וַיַּאֲזִין, обозначающего внимательное слушание.
- source_word: קוֹלִי
  choice: мой голос
  rationale: Буквально передаёт еврейский текст; в молитвенном контексте выражение может идиоматически означать «мой вопль», что отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיַּאֲזִין
  choice: внял
  rationale: Естественно и выразительно передаёт внимательное принятие услышанного, сохраняя смысловое усиление после «услышал».
- source_word: תַּחֲנוּנָי
  choice: моим мольбам
  rationale: Передаёт настойчивые молитвенные просьбы о милости в современном, но достойном регистре.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. «Внял» сохраняет параллелизм и смысловое усиление еврейских глаголов, не звуча архаично. Начальная часть предоставленного еврейского фрагмента относится к предшествующему стиху; перевод следует разметке (יא) и английскому справочному слою.
