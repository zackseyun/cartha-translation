base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/026.yaml
  text: Bring your neck under her yoke[a], and let your soul bear her burden. She is near to those who seek her, and the one who gives himself finds her.
translation:
  language: ru
  text: Подставьте свои шеи под её ярмо[a], и пусть ваши души несут её бремя. Она близка к тем, кто ищет её, и тот, кто отдаёт себя, находит её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «и пусть ваша душа примет наставление». В еврейском: «пусть ваша душа несёт её бремя».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְצַוְּארֵיכֶם בְּעֻלָּהּ הָבִיאוּ
  choice: Склоните ваши шеи под её ярмо
  rationale: Еврейский текст буквально призывает привести шеи под ярмо; по-русски «склонить шеи под ярмо» естественно передаёт добровольное подчинение наставлению Мудрости и сохраняет множественное число обращения.
- source_word: וּמַשָּׂאָהּ תִּשָּׂא נַפְשְׁכֶם
  choice: и пусть ваша душа несёт её бремя
  rationale: 'Сохраняется ясный образ еврейского текста: душа несёт бремя Мудрости. Единственное число «душа» соответствует собирательной форме оригинала при обращении ко многим.'
- source_word: קְרוּבָה הִיא לִמְבַקְשֶׁיהָ
  choice: Она близка к тем, кто ищет её
  rationale: Женский род сохраняет олицетворение Мудрости; причастная конструкция передана современным и точным русским оборотом.
- source_word: וְנוֹתֵן נַפְשׁוֹ
  choice: и тот, кто отдаёт себя
  rationale: Буквально выражение говорит об отдающем свою душу или жизнь; «отдаёт себя» передаёт полную личную посвящённость без ошибочного оттенка смерти.
- source_word: מוֹצֵא אֹתָהּ
  choice: находит её
  rationale: Прямо передаёт глагол «находить» и сохраняет женский объект, то есть олицетворённую Мудрость.
theological_decisions:
- issue: Олицетворение Мудрости
  choice: Женские местоимения «её», «она» сохранены.
  alternative: Передать Мудрость как безличное понятие и употребить средний род.
  rationale: Грамматика и образность еврейского текста представляют Мудрость в женском роде; обезличивание ослабило бы исходный образ.
- issue: Различие еврейского и греческого текста во второй строке
  choice: В основном тексте сохранено еврейское «пусть ваша душа несёт её бремя».
  alternative: 'Следовать греческому: «пусть ваша душа примет наставление».'
  rationale: Сохранившийся еврейский текст связен и является основным источником; значимое греческое чтение отмечено в сноске, а не подменяет его.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического наставления. Метафоры ярма и бремени сохранены; формулировки понятны без конфессионально обусловленной терминологии.
