  source_fidelity: 'Смысл еврейского текста в целом передан точно: сохраняются образ ярма и бремени, женское олицетворение Мудрости, а также буквальная линия «несёт её бремя», в отличие от греческого «принимает наставление». «Отдаёт себя» адекватно передаёт וְנוֹתֵן נַפְשׁוֹ без неоправданного сужения до смерти.'
  naturalness: «Склоните ваши шеи под её ярмо» понятно, но «склонить шею» по-русски прежде всего означает покорно наклонить её, тогда как исходный текст призывает поместить шею под ярмо. «Подставьте свои шеи под её ярмо» точнее и естественнее для данного образа. При обращении ко многим «пусть ваши души несут» звучит по-русски более гладко, чем собирательное «пусть ваша душа несёт».
  terminology: «Ярмо» и «бремя» — точные, современные литературные соответствия. Женские местоимения последовательно сохраняют образ Мудрости. Сноску следует обозначить как греческий параллельный текст, а не как неясное «далее».
