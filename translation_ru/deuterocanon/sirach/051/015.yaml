base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/015.yaml
  text: From her blossom, like a ripening cluster of grapes, my heart rejoiced in her; my foot walked in uprightness; from my youth I tracked her down.
translation:
  language: ru
  text: От её цветка, словно от созревающей грозди винограда,[a] возрадовалось моё сердце в ней; нога моя ступила прямо,[b] с юности я шёл по её следам.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно от краснеющей грозди винограда»; греческое слово может подчёркивать, что ягоды по мере созревания приобретают окраску.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нога моя ступила в правоте» либо «по прямому пути»; греческое выражение может обозначать и прямизну пути, и нравственную правоту.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «я выслеживал её», «я искал её»; греческий глагол буквально вызывает образ поиска по следам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἄνθους
  choice: От её цветения
  rationale: ἄνθος означает цветок или цветение. Притяжательное «её» связывает образ с олицетворённой Премудростью, а «цветение» естественно вводит последующий образ созревающей виноградной грозди.
- source_word: ὡς περκάζουσης σταφυλῆς
  choice: словно от наливающейся грозди винограда
  rationale: σταφυλή — гроздь винограда, а περκάζουσης указывает на приобретение окраски и достижение зрелости. «Наливающейся» естественно передаёт процесс созревания, не сводя образ лишь к изменению цвета.
- source_word: εὐφράνθη ἡ καρδία μου ἐν αὐτῇ
  choice: возрадовалось моё сердце в ней
  rationale: Сохраняются библейский образ сердца как внутреннего человека и формально неоднозначное ἐν αὐτῇ — «в ней», относящееся к олицетворённой Премудрости.
- source_word: ἐπέβη ὁ πούς μου ἐν εὐθύτητι
  choice: моя нога ступала прямо
  rationale: ἐπέβη буквально передаёт шаг или вступление, а εὐθύτης допускает как пространственную прямоту пути, так и нравственную правоту. Русское «ступала прямо» удерживает обе стороны образа.
- source_word: ἐκ νεότητός μου ἴχνευον αὐτήν
  choice: с юности моей я шёл по её следам
  rationale: ἴχνευον связано с ἴχνος, «след», и означает выслеживать, прослеживать или искать по следам. Перевод сохраняет конкретный образ следования по следам и перекличку с образом ноги.
theological_decisions:
- issue: Референт и род αὐτῇ / αὐτήν
  choice: Местоимения отнесены к олицетворённой Премудрости и переданы формами женского рода «ней» и «её».
  alternative: Передать Премудрость отвлечённо, ослабив олицетворение.
  rationale: В контексте книги Премудрость последовательно представлена как лицо женского рода; грамматический женский род греческих местоимений и ближайший контекст поддерживают сохранение этого олицетворения.
- issue: Значение ἐν εὐθύτητι
  choice: «прямо» — формулировка, совмещающая образ прямого пути и нравственную правоту.
  alternative: «в праведности» либо «по прямому пути».
  rationale: Греческое выражение допускает пространственное и этическое понимание; выбор не устраняет эту плодотворную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранены олицетворение Премудрости, виноградарский образ и цепочка образов ноги, прямого пути и следов; архаичные и конфессионально окрашенные формулы не вводились.
