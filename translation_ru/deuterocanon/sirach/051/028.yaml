  text: Many heard my instruction in my youth[b][a], and they acquired silver and gold by me.
translation:
  language: ru
  text: Многие слышали моё наставление в годы моей юности и приобрели благодаря мне[b] серебро и золото.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом параллельном тексте: «Примите наставление за большую сумму серебра и приобретите через него много золота». В отличие от греческого повеления, еврейский текст здесь представляет собой повествовательное утверждение.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «мною»; буквально возможно также «во мне». Еврейское выражение кратко и допускает разные оттенки; перевод «благодаря мне» понимает говорящего и его наставление как средство, благодаря которому другие обрели богатство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים
  choice: Многие
  rationale: Передаёт количественное значение кратко и естественно, без излишнего усиления вроде «множество людей».
- source_word: שָׁמְעוּ
  choice: слышали
  rationale: Сохраняет основное значение глагола — восприятие на слух; перевод «слушались» неоправданно вводил бы значение повиновения.
- source_word: לִמּוּדִי
  choice: моё наставление
  rationale: Соответствует дидактическому контексту книги Премудрости и передаёт существительное от корня למד как обучение или наставление.
- source_word: בִּנְעֻרוֹתָי
  choice: в годы моей юности
  rationale: Естественно передаёт обозначение периода молодости и сохраняет оттенок еврейской формы множественного числа.
- source_word: וְכֶסֶף וְזָהָב
  choice: серебро и золото
  rationale: Сохраняет конкретные названия драгоценных металлов и соответствующую образность.
- source_word: תִּקְנוּ
  choice: приобрели
  rationale: Глагол קנה здесь означает «приобрести, получить»; прошедшее время следует декларативному синтаксису еврейского текста, а не повелительной форме греческого параллельного текста.
- source_word: בִּי
  choice: через меня
  rationale: Передаёт вероятное значение посредства или средства, не заменяя компактную и неоднозначную еврейскую конструкцию более узким толкованием.
theological_decisions:
- issue: Соотношение еврейского текста и греческого параллельного чтения
  choice: Основной текст переведён с высоконадёжного еврейского свидетельства как повествовательное утверждение о тех, кто приобрёл серебро и золото через говорящего.
  alternative: 'Следовать греческому тексту и передать стих как призыв: «Примите наставление за большое количество серебра и приобретите через него много золота».'
  rationale: Сохранившийся еврейский текст имеет приоритет и грамматически является утверждением, тогда как греческий текст содержит повеление. Существенное расхождение сохранено в примечании, а не устранено молча.
- issue: Значение בִּי в заключительной фразе
  choice: через меня
  alternative: «мною» или более буквально и неясно «во мне»
  rationale: Предложное сочетание допускает несколько оттенков. «Через меня» естественно выражает посредство, вероятно связанное с наставлением говорящего, но не утверждает более конкретного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для текста Премудрости. Формулировка остаётся понятной широкому читателю; синтаксис еврейского текста сохранён без искусственной архаизации. Местоимение «моё» употреблено с буквой ё.
