base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/001.yaml
  text: I will praise you[a], God of my salvation; I will give thanks to you, God of my father. I will declare your name, the stronghold of my life[c][b], for you have redeemed my soul from death.
translation:
  language: ru
  text: Я буду славить Тебя, Боже моего спасения, буду благодарить Тебя, Боже моего отца.[c] Я возвещу имя Твоё — твердыню моей жизни[a], потому что Ты искупил душу мою[b] от смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское сочетание можно понимать и более явно: «Я возвещу, что имя Твоё — твердыня моей жизни».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мою жизнь» либо «меня самого»; еврейское нефеш может иметь все эти значения.'
    reason: lexical_alternative
  - marker: c
    text: 'Греческий текст начинает стих несколько иначе: «Буду благодарить Тебя, Господи, Царь, и восхвалю Тебя, Боже, Спаситель мой».'
    reason: textual_variant
lexical_decisions:
- source_word: אֲהַלְלֶךָּ
  choice: Я буду славить Тебя
  rationale: Глагол הלל в данной форме означает хвалить, прославлять. «Славить» естественно звучит в современной русской молитвенной речи и сохраняет отличие от следующего אוֹדְךָ.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: Боже моего спасения
  rationale: Сохранена еврейская конструкция «Бог моего спасения» и её богословская насыщенность; обращение передано русским звательным употреблением формы «Боже».
- source_word: אוֹדְךָ
  choice: буду благодарить Тебя
  rationale: ידה может означать благодарение, исповедание или хвалу. «Благодарить» сохраняет смысловой оттенок, отличный от параллельного «славить».
- source_word: אֱלֹהֵי אָבִי
  choice: Боже моего отца
  rationale: Еврейский текст прямо употребляет единственное число «моего отца»; оно не обобщено до «отцов» или «предков».
- source_word: אֲסַפְּרָה
  choice: Я возвещу
  rationale: ספר здесь означает рассказывать, возвещать или провозглашать. «Возвещу» соответствует открытому исповеданию хвалы и сохраняет возвышенный, но понятный регистр.
- source_word: שִׁמְךָ
  choice: имя Твоё
  rationale: Буквальное обозначение имени сохраняет библейский смысл, включающий явленную сущность и славу Бога, не подменяя его толкованием.
- source_word: מָעוֹז חַיַּי
  choice: твердыню моей жизни
  rationale: מָעוֹז обозначает укреплённое место, оплот или надёжное убежище. «Твердыня» сохраняет конкретную метафору силы и защиты; согласование в винительном падеже представляет фразу как приложение к «имя Твоё».
- source_word: פָדִיתָ
  choice: Ты избавил
  rationale: פדה означает выкупать, освобождать или избавлять. В сочетании «от смерти» русское «избавил» наиболее естественно передаёт совершившееся спасение, тогда как «искупил от смерти» в современном русском способно звучать неясно или привносить более узкий догматический оттенок.
- source_word: נַפְשִׁי
  choice: душу мою
  rationale: נפש может обозначать душу, жизнь или самого человека. «Душу мою» сохраняет образность и формальную близость к еврейскому тексту; возможный смысл «жизнь» отмечен в сноске.
theological_decisions:
- issue: Передача פָדִיתָ в благодарении за спасение от смерти
  choice: Ты избавил
  alternative: Ты выкупил / Ты искупил
  rationale: Контекст говорит о спасении от смерти, а семантика פדה включает освобождение посредством выкупа. «Избавил» ясно передаёт результат, не навязывая стиху позднейшую специально-догматическую формулу; оттенок выкупа признаётся в лексическом обосновании.
- issue: Синтаксическая связь שִׁמְךָ מָעוֹז חַיַּי
  choice: имя Твоё — твердыню моей жизни
  alternative: возвещу, что имя Твоё — твердыня моей жизни
  rationale: Краткое еврейское сочетание допускает приложение и более явно выраженную предикативную связь. Основной текст сохраняет сжатую приложительную конструкцию, а сноска указывает второе прочтение.
- issue: Смысл נַפְשִׁי
  choice: душу мою
  alternative: мою жизнь / меня самого
  rationale: Еврейское נפש имеет широкий антропологический диапазон. Выбор «душу» сохраняет поэтическую форму, но сноска не позволяет свести значение к одной поздней антропологической схеме.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным строем. Формы «Боже», «имя Твоё», «душу мою» сохраняют достоинство и поэтический параллелизм, оставаясь понятными современному читателю. Прописные местоимения употреблены последовательно как принятая русская форма почтительного обращения к Богу.
