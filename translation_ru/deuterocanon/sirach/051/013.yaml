base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/013.yaml
  text: I was young[a], and I loved wisdom; I desired her and sought her out. In faithfulness my foot walked; from my youth, O Lord[b], I learned wisdom.
translation:
  language: ru
  text: Я был юн и любил мудрость; желал её и искал её. Моя нога ступала в её истине[a]; Господи, с юности я учился мудрости.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «В её истине ступала моя нога». Возможно также: «В верности ступала моя нога» или «В истине ступала моя нога».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий параллельный текст заметно отличается: «Ещё будучи молодым, прежде чем я был уведён в сторону, я открыто искал мудрости в своей молитве». Основной текст следует сохранившемуся еврейскому свидетелю.'
    reason: alternative_reading
lexical_decisions:
- source_word: נַעַר הָיִיתִי
  choice: Я был юн
  rationale: Прямо передаёт состояние юности без добавления временного союза, отсутствующего в еврейском тексте.
- source_word: וָאוֹהַב חָכְמָה
  choice: и полюбил мудрость
  rationale: Сохраняет bracketed reading составного еврейского свидетеля и естественно вводит олицетворённую Мудрость.
- source_word: וְחָפַצְתִּי בָהּ
  choice: я возжелал её
  rationale: חפץ выражает сильное желание и расположение; местоимение женского рода сохраняет олицетворение мудрости.
- source_word: וּבִקַּשְׁתִיהָ
  choice: и искал её
  rationale: Простое и точное соответствие активному поиску, выраженному בקש.
- source_word: בַּאֲמִתָּהּ דָּרְכָה רַגְלִי
  choice: Путём её истины шла моя нога
  rationale: Суффикс женского рода в בַּאֲמִתָּהּ естественно соотносится с мудростью; перевод сохраняет конкретный образ ноги и смысл следования истине, не сводя выражение лишь к наречию.
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Естественная русская форма прямого обращения; не добавляет притяжательного значения.
- source_word: מִנְּעוּרַי חָכְמָה לָמַדְתִּי
  choice: с юности моей я учился мудрости
  rationale: Сохраняет начальную временную точку и активное значение למד; дательный падеж естественен при русском «учиться».
theological_decisions:
- issue: Еврейское чтение и существенно отличающийся греческий параллельный текст
  choice: Основной текст следует сохранившемуся еврейскому свидетелю.
  alternative: «Ещё будучи молодым, прежде чем уклониться, я явно искал мудрости в своей молитве».
  rationale: При наличии еврейского текста Сираха он имеет приоритет; греческое чтение не следует молча смешивать с ним, но значительное различие отмечается в сноске.
- issue: Значение בַּאֲמִתָּהּ
  choice: «Путём её истины»
  alternative: «В верности» или «в истине»
  rationale: Форма содержит суффикс третьего лица женского рода, вероятно отсылающий к мудрости. Формулировка сохраняет эту грамматическую связь и образ движения, а допустимые более наречные понимания приводятся в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Сохранены олицетворение мудрости, конкретный образ шагающей ноги и обращение «Господи»; архаизмы сведены к умеренному «возжелал», передающему силу חפץ.
