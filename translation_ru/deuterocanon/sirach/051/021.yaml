  text: My inward parts burned like an oven as I looked toward her[a]; therefore I will not forsake her.
translation:
  language: ru
  text: Всё внутри меня пылало, словно печь, когда я смотрел на неё[a]; поэтому я не оставлю её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «И утроба моя пришла в волнение, чтобы искать её; поэтому я приобрёл доброе достояние».'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעַי
  choice: всё внутри меня
  rationale: Буквально речь идёт о внутренних органах, которые в еврейской образности обозначают глубочайшие чувства. Формулировка сохраняет телесно-эмоциональный образ, но звучит естественнее по-русски, чем «мои внутренности» или архаичное «моя утроба».
- source_word: יֵחַמּוּ כַּתַּנּוּר
  choice: пылало, словно печь
  rationale: Глагол передаёт сильный жар, а תַּנּוּר означает печь. «Пылало» естественно выражает напряжённость стремления и сохраняет образ жара, не усиливая его до «горнила».
- source_word: לְהַבִּיט בָּהּ
  choice: когда я смотрел на неё
  rationale: Инфинитив с предлогом ב указывает на обращённый к ней взгляд. Временная конструкция ясно связывает взгляд с внутренним пылом, не добавляя толкования.
- source_word: בַּעֲבוּר כֵּן
  choice: поэтому
  rationale: Кратко и естественно передаёт следствие из предыдущей части стиха.
- source_word: לֹא אֶעֶזְבֶנָּה
  choice: я не оставлю её
  rationale: Прямо передаёт עזב и сохраняет обещание неизменной приверженности олицетворённой Премудрости. «Не покину» также возможно, но несколько сильнее подчёркивает личное расставание.
theological_decisions:
- issue: Существенное расхождение еврейского и греческого окончаний стиха
  choice: 'В основном тексте следовать еврейскому чтению: «поэтому я не оставлю её».'
  alternative: 'Греческий текст: «и утроба моя пришла в волнение, чтобы искать её; поэтому я приобрёл доброе достояние».'
  rationale: Сохранившийся еврейский текст имеет высокий уровень надёжности и потому положен в основу перевода. Поскольку греческая версия заметно отличается как образом внутреннего состояния, так и итоговым утверждением, её чтение полностью приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Выражение «всё внутри меня» делает древнюю телесную метафору понятной современному читателю; образ печи и женский род олицетворённой Премудрости сохранены.
