base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/010.yaml
  text: 'And I will exalt you: O Yahweh[a], you are my Father, for you are the mighty one of my salvation. Do not let me grow weak in the day of distress[b], in the day of ruin and desolation.'
translation:
  language: ru
  text: 'И я превознесу Тебя: «О Яхве[a], Ты — мой Отец, ибо Ты — могучий Избавитель мой. Не дай мне ослабеть в день бедствия[b], в день разорения и опустошения».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Я призвал Господа, Отца моего господина». В еврейском: «О Яхве, Ты — мой Отец».'
    reason: alternative_reading
  - marker: b
    text: 'В греческом тексте: «не оставь меня в дни скорби»; еврейское выражение буквально связано с ослабеванием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲרוֹמֵם
  choice: И я превознесу Тебя
  rationale: Форма от רומם передаёт возвышенное прославление; будущее время сохраняет возможное значение еврейского имперфекта с waw. Дополнение «Тебя» ясно из молитвенного контекста.
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя в соответствии с представленным консультационным слоем; отличие греческого чтения отмечено в сноске.
- source_word: אָבִי
  choice: мой Отец
  rationale: Следует сохранившемуся еврейскому чтению; греческое «Отец господина моего» вынесено в сноску.
- source_word: גִּבּוֹר יִשְׁעִי
  choice: сила моего спасения
  rationale: גִּבּוֹר допускает субстантивное «сильный, могучий». Русская формулировка естественно передаёт, что Бог является могущественной силой, совершающей спасение, не вводя явно воинского образа.
- source_word: אַל תַּרְפֵּנִי
  choice: Не дай мне ослабеть
  rationale: Сохраняет образ ослабевания от רפה и звучит естественно по-русски; греческое чтение со значением «не оставь меня» отмечено в сноске.
- source_word: בְּיוֹם צָרָה
  choice: в день бедствия
  rationale: צָרָה обозначает беду, тесноту и тяжёлое положение; «бедствие» соответствует высокому молитвенному регистру.
- source_word: בּיוֹם שׁוֹאָה וּמְשׁוֹאָה
  choice: в день разорения и опустошения
  rationale: Сохраняет парные, близкие по значению существительные еврейского текста, не сводя их к одному понятию.
theological_decisions:
- issue: Расхождение еврейского и греческого текстов в обращении к Богу
  choice: 'В основном тексте следовать еврейскому: «О Яхве, Ты — мой Отец»'
  alternative: 'Греческое: «Я призвал Господа, Отца господина моего»'
  rationale: Для Сираха при наличии еврейского свидетельства оно первично; существенное греческое разночтение сохранено в сноске.
- issue: Значение просьбы אַל תַּרְפֵּנִי
  choice: 'Передать еврейский образ ослабевания: «Не дай мне ослабеть»'
  alternative: 'По греческому: «Не оставь меня»'
  rationale: Еврейское רפה означает слабеть, ослаблять или отпускать, тогда как греческий текст выражает оставление. Основной текст не гармонизирован с греческим, а разночтение отмечено.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис остаётся ясным для обычного читателя; параллелизм и повтор «в день» сохранены. Местоимения при обращении к Богу написаны с прописной буквы как стилистический знак почтительности.
