lexical_decisions:
- source_word: ἐξομολογοῦμαι
  choice: Я благодарю
  rationale: В данном контексте глагол выражает благодарное прославление; настоящее время греческого текста передано прямо и естественно по-русски.
- source_word: τῷ ὀνόματί σου
  choice: имя Твоё
  rationale: Сохранён библейский образ обращения к Божьему имени без поясняющей замены на «Тебя».
- source_word: σκεπαστής
  choice: защита
  rationale: Слово обозначает того, кто укрывает и оберегает; «защита» естественно передаёт смысл, не сужая образ до буквального физического укрытия.
- source_word: βοηθός
  choice: помощник
  rationale: Прямое соответствие греческому существительному, сохраняющее параллелизм с «защитой».
- source_word: ἐγένου μοι
  choice: Ты стал мне
  rationale: Сохранены и динамика греческого глагола «стал», и личная конструкция с дательным значением.
theological_decisions:
- issue: Расхождение предоставленного еврейского текста с нумерацией стиха
  choice: Основной текст переведён по греческому параллельному свидетельству, которое прямо соответствует Сир 51:2 и согласуется с контекстом.
  alternative: Перевести предоставленный еврейский фрагмент о спасении от могилы, шеола и клеветы.
  rationale: Еврейский фрагмент представляет существенно иной и более длинный текст, относящийся к последующим строкам главы, тогда как греческое свидетельство точно соответствует указанной ссылке. Подмена содержания стиха из-за несовпадения входных данных была бы текстологически необоснованной.
