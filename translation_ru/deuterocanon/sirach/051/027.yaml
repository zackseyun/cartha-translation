  text: 'Посмотрите собственными глазами: я был мал[a] и держался её, и обрёл её.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «мал» может означать также «молод» или «незначителен».
    reason: lexical_alternative
