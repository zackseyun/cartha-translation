base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/020.yaml
  text: I gave my soul after her, and for everlasting ages I will not turn away from her. In purity I found her, and from the beginning I acquired a heart for her.
translation:
  language: ru
  text: 'Я отдал ей свою душу,

    и во веки веков от неё не отступлю.

    В чистоте я нашёл её

    и с самого начала обрёл для неё сердце.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַפְשִׁי נָתַתִּי אַחֲרֶיהָ
  choice: Я отдал душу, следуя за ней
  rationale: Сохранены и образ «отдать душу», и направленность אַחֲרֶיהָ («за ней»); добавленная деепричастная форма делает еврейское сочетание естественным и понятным по-русски, не сводя נֶפֶשׁ просто к возвратному «себя».
- source_word: לְנֵצַח נְצָחִים
  choice: во веки веков
  rationale: Устойчивое возвышенное русское соответствие усиленной формуле вечности, уместное для поэтической речи Премудрости.
- source_word: לֹא אַטֶּה מִמֶּנָּה
  choice: от неё не отступлю
  rationale: Глагол נטה передаёт отклонение или уклонение; «не отступлю» естественно выражает неизменную верность избранному пути.
- source_word: וּבְטָהֳרָה מְצָאתִיהָ
  choice: В чистоте я нашёл её
  rationale: Буквально сохранено בְּטָהֳרָה без уточнения, относится ли чистота к состоянию ищущего, способу поиска или сфере обретения.
- source_word: וְלֵב קָנִיתִי לָהּ מִתְּחִלָּתָהּ
  choice: и с самого начала обрёл сердце для неё
  rationale: «Обрёл» передаёт קנה без ненужного торгового оттенка «купил»; необычный образ «сердце для неё» сохранён, чтобы не подменять неоднозначную еврейскую формулу толкованием вроде «преданное ей сердце».
theological_decisions:
- issue: Образ души и личной преданности Премудрости
  choice: Сохранить «отдал душу»
  alternative: «всецело посвятил себя»
  rationale: Первый вариант ближе к נַפְשִׁי и сохраняет поэтическое напряжение текста, не превращая образ в объяснительную парафразу.
- issue: Неоднозначность выражения «обрёл сердце для неё»
  choice: Не уточнять характер этого сердца
  alternative: «обрёл сердце, преданное ей»
  rationale: Определение «преданное» богословски и психологически правдоподобно, но отсутствует в еврейском тексте и сужает его смысл.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим ритмом. Параллелизм строк отражает структуру еврейского стиха; архаизирующая формула «во веки веков» сохранена как понятная и укоренённая в библейском русском регистре. Греческий параллель заметно расходится с еврейским в последней части, поэтому перевод следует высокоуверенному еврейскому составному тексту Каханы.
