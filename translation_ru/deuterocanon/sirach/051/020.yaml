  source_fidelity: 'Первая строка в черновике («Я отдал душу, следуя за ней») меняет синтаксическую связь: деепричастие описывает обстоятельство отдачи, тогда как אַחֲרֶיהָ выражает направленность преданности к женскому референту (Премудрости). «Я отдал ей свою душу» естественно передаёт этот образ без неоправданного толкования. Остальные строки в целом следуют еврейскому тексту; греческая версия в заключительной части расходится с ним, поэтому оснований заменять еврейское чтение нет.'
  naturalness: «Отдал ей свою душу» — естественное современное поэтическое выражение. В заключительной строке перестановка слов («обрёл для неё сердце») делает фразу несколько более плавной, сохраняя намеренно необычный и неоднозначный образ оригинала. «Во веки веков» уместно в возвышенном библейском регистре.
  terminology: '«Душа», «чистота», «сердце» сохранены как ключевые библейские образы. Не следует уточнять «сердце» как преданность, разум или мужество: еврейская формула допускает более одного оттенка. Существующих сносок и якорей нет; добавлять сноску не требуется.'
