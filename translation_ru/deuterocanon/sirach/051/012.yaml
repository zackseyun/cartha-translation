  text: For he redeemed me from every evil[a], and delivered me in the day of trouble.
translation:
  language: ru
  text: Ибо Он искупил меня от всякого зла[a] и избавил меня в день бедствия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Ибо Ты спас меня от погибели и избавил меня от злого времени». В еврейском тексте: «от всякого зла» и «в день бедствия».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְדֵּנִי
  choice: искупил меня
  rationale: Глагол פדה обозначает освобождение или выкуп; «искупил меня» сохраняет более конкретный оттенок избавления ценой выкупа, не сводя его к общему «спас».
- source_word: מִכָּל רָע
  choice: от всякого зла
  rationale: רָע может означать зло, вред или бедствие. Широкое выражение «от всякого зла» сохраняет смысловую неоднозначность еврейского текста.
- source_word: וַיְמַלְּטֵנִי
  choice: избавил меня
  rationale: מלט здесь означает вывести из опасности, доставить в безопасное место. «Избавил меня» естественно передаёт этот смысл и сохраняет отличие от предшествующего פדה.
- source_word: בְּיוֹם צָרָה
  choice: в день бедствия
  rationale: Буквальная временная формула сохраняет конкретный образ еврейского текста; «бедствие» передаёт צרה как тяжёлое, стеснённое положение.
theological_decisions:
- issue: Выбор основного чтения между еврейским текстом и греческой параллелью
  choice: Основной текст переведён по сохранившемуся еврейскому чтению, а греческая форма приведена в сноске.
  alternative: «Ибо Ты спас меня от погибели и избавил меня от злого времени».
  rationale: Еврейский свидетель даёт связное чтение и является основным источником для данного места. Греческий текст заметно отличается лицом глагола и формулировками, поэтому его смысл не смешан с основным текстом, а сохранён как вариант.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Он» написано с прописной буквы как обозначение Бога; синтаксический параллелизм и различие между двумя глаголами избавления сохранены.
