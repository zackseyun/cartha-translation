translation:
  language: ru
  text: В юности я молился[a] и обрёл немало знания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Перед храмом я просил о ней и до конца буду искать её». Еврейский текст, положенный в основу перевода, гласит: «В юности я молился и обрёл немало знания».'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתְפַּלֵּל תְּפִלָּה
  choice: я молился
  rationale: Однокоренная конструкция буквально означает «молился молитвой». В современном русском естественно передать её одним глаголом, сохранив смысл и не создавая ненужной тяжеловесности.
- source_word: בִּנְעֻרוֹתָי
  choice: в юности
  rationale: Форма обозначает период молодости; «в юности» точно и естественно передаёт временное значение.
- source_word: וְהַרְבֵּה מָצָאתִי דֵעָה
  choice: и обрёл обширное знание
  rationale: Глагол מָצָאתִי сохраняет образ обретения, а דֵעָה передано как «знание», без подмены отдельным понятием «мудрость». Сочетание «обширное знание» естественнее буквального «много знания» и сохраняет значение изобилия, выраженное הַרְבֵּה.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и существенно отличающейся греческой параллели о поиске мудрости
  choice: Основной текст следует еврейскому чтению и не добавляет отсутствующее в нём «о ней»; греческое чтение полностью приводится в сноске.
  alternative: '«В юности я молился о ней и обрёл обширное знание» либо греческое: «Перед храмом я просил о ней и до конца буду искать её».'
  rationale: Еврейское свидетельство имеет высокую степень надёжности и прямо говорит о молитве в юности и обретении знания. Греческий текст, вероятно, отражает иную форму стиха и явно связывает просьбу с мудростью. Добавление «о ней» в основной текст искусственно объединило бы два различающихся свидетельства и скрыло бы текстуальное напряжение.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным звучанием. Однокоренная еврейская конструкция передана идиоматично; заметное расхождение между еврейским и греческим свидетельствами не сглажено, а вынесено в сноску.
