translation:
  language: ru
  text: от уст нечестия и от тех, кто измышляет ложь,[a] и от стрел лживого языка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «от нечистого языка и ложного слова» — вместо «от уст нечестия и от тех, кто измышляет ложь, и от стрел лживого языка». Поскольку для этого стиха сохранился еврейский текст, основной перевод следует ему; греческое чтение приведено здесь из-за существенного различия.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשִׂפְתֵי זִמָּה
  choice: от уст нечестия
  rationale: Предлог מִן выражает избавление «от», а буквальный образ «уст» сохраняет поэтический параллелизм с «языком». זִמָּה здесь передано широко как нравственное зло, без неоправданного сужения до распутства.
- source_word: וְטֹפְלֵי שֶׁקֶר
  choice: и от тех, кто измышляет ложь
  rationale: Причастие טֹפְלֵי обозначает людей, которые прилаживают, сочиняют или возводят ложь. «Измышляет ложь» естественно по-русски передаёт изготовление ложных обвинений или выдумок, не устраняя образ намеренного присоединения лжи.
- source_word: וְחִצֵּי
  choice: и от стрел
  rationale: Начальный предлог «от» по смыслу распространяется и на следующий член перечисления; образ стрел сохраняет представление о ранящей речи.
- source_word: לְשוֹן מִרְמָה
  choice: лживого языка
  rationale: Буквальный «язык» поддерживает телесную образность рядом с «устами», а существительное מִרְמָה естественно передано русским определением «лживого».
- source_word: ἀπὸ γλώσσης ἀκαθάρτου καὶ λόγου ψευδοῦς
  choice: не принято в основной текст
  rationale: Греческое чтение существенно отличается от сохранившегося еврейского текста. Основной текст следует еврейскому свидетелю, а греческий вариант отмечен в сноске.
