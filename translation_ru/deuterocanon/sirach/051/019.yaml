lexical_decisions:
- source_word: חַשְׁקָה נַפְשִׁי בָּהּ
  choice: Моя душа прилепилась к ней
  rationale: Глагол חשׁק выражает сильную привязанность, влечение или любовь. «Прилепилась» естественно передаёт здесь устойчивую глубокую привязанность и сохраняет образное выражение с «душой».
- source_word: וּפָנַי לֹא אַהֲפֹך מִמֶּנָּה
  choice: и я не отворачивал от неё лица
  rationale: Сохранён еврейский телесный образ «повернуть лицо от», а продолженное русское прошедшее время подходит к описанию постоянной преданности.
theological_decisions:
- issue: Женский референт местоимения בָּהּ / מִמֶּנָּה
  choice: к ней / от неё
  alternative: к мудрости / от мудрости
  rationale: Женское местоимение указывает на мудрость из контекста, но оригинал не повторяет существительное; местоименная форма сохраняет связность и не добавляет явного уточнения.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого параллелизма и библейского образа лица; «прилепилась» имеет dignified scriptural resonance without archaic syntax.
