translation:
  language: ru
  text: от удушья в огне, окружавшем меня со всех сторон,[a] и из среды огня, которого я не разжигал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст этого стиха труден и резко отличается от греческого. Более буквальная передача второй половины еврейской строки могла бы звучать примерно так: «из чрева бездны — к моей матери», но её смысл в данном контексте неясен.'
    reason: textual_variant
lexical_decisions:
- source_word: מְכַבּוֹת אֵשׁ
  choice: от удушающего огня
  rationale: Сохранившийся еврейский текст труден; значение уточняется по греческому ἀπὸ πνιγμοῦ πυρᾶς — буквально «от удушья (дымом) костра/огня». «Удушающий огонь» естественно передаёт угрозу удушья, не добавляя в текст прямо не названный дым.
- source_word: לְאֵין פֶּחָה / κυκλόθεν
  choice: окружавшего меня со всех сторон
  rationale: Еврейское словосочетание не даёт надёжного смысла в данном контексте; перевод следует ясному греческому κυκλόθεν («кругом, со всех сторон»). Добавленное «меня» естественно выражает подразумеваемый объект окружения.
- source_word: מֵרֶחֶם תְּהוֹם לְאִמִּי
  choice: из пламени, которого я не разжигал
  rationale: Сохранившаяся еврейская строка резко расходится с греческой и в контексте остаётся неясной. Основной текст следует связному греческому чтению ἐκ μέσου πυρὸς οὗ οὐκ ἐξέκαυσα, а еврейская форма отражена в примечании.
- source_word: οὗ οὐκ ἐξέκαυσα
  choice: которого я не разжигал
  rationale: Активная форма ἐξέκαυσα естественно означает «я разжёг/воспламенил». Русское «разжигал» сохраняет активный залог и мысль о пожаре, возникшем не по вине говорящего.
theological_decisions:
- issue: Использование греческой параллели при крайне трудном еврейском тексте
  choice: В основном тексте принят связный смысл греческого чтения с сохранением общего образа огня, присутствующего и в еврейском.
  alternative: 'Буквально передать дошедший еврейский текст: «от тушений огня без дуновения, из чрева бездны — к моей матери» (синтаксис и смысл неясны).'
  rationale: Уцелевший еврейский свидетель обычно имеет первенство, однако здесь он отмечен как существенно расходящийся и даёт неясную фразу. Греческая параллель позволяет восстановить связный образ избавления; расхождение честно обозначено в сноске без догматического истолкования.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. Формулировка сохраняет образ смертельной угрозы и не сглаживает текстологическую неопределённость; запятая перед маркером сноски не ставится, чтобы маркер относился ко всей первой фразе.
