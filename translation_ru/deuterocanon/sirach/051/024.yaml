- from: До каких пор вам будет недоставать всего этого[a], а душа ваша будет томиться сильной жаждой?
  to: До каких пор вам будет недоставать этого[a], а ваша душа будет сильно жаждать?
  rationale: Исправление устраняет добавленную всеохватность «всего», передаёт «весьма жаждущая» без дополнительного оттенка «томиться» и приводит полную, содержательно точную сноску по еврейскому и греческому чтениям. Союз «а» сохранён как естественное русское сопоставление, не превращающее связь в причинную или временную.
