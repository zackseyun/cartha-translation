translation:
  language: ru
  text: До каких пор вам будет недоставать этого[a], а ваша душа будет сильно жаждать?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «До каких пор вам будет недоставать из этих и этих, и душа ваша будет весьма жаждущей?» Неясное выражение «из этих и этих» передано в основном тексте как «этого». Греческий параллельный текст выражается яснее: «Как вы говорите, что испытываете недостаток в этом, тогда как души ваши сильно жаждут?» Основной текст следует еврейскому чтению; греческий текст учитывается как пояснение смысла.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַד מָתַי
  choice: До каких пор
  rationale: Естественная русская формула вопроса-упрёка, сохраняющая временную направленность еврейского выражения.
- source_word: תַחְסְרוּן
  choice: вам будет недоставать
  rationale: Глагол חסר означает «не иметь, испытывать недостаток». Будущее время передаёт незавершённый, продолжающийся характер состояния в риторическом вопросе.
- source_word: מִן אֵלּוּ וְאֵלּוּ
  choice: всего этого
  rationale: Буквальное «из этих и этих» по-русски неясно; выражение отсылает к ранее названным благам или наставлениям. Греческое ἐν τούτοις подтверждает обобщённое «в этом / во всём этом».
- source_word: וְנַפְשְׁכֶם
  choice: а душа ваша
  rationale: נפש здесь обозначает внутреннего человека как носителя глубокого желания. Единственное число еврейского текста сохранено, несмотря на обращение к нескольким людям; союз передан как «а», поскольку между недостатком и жаждой ощущается смысловое сопоставление.
- source_word: צְמֵאָה מְאֹד תִּהְיֶה
  choice: будет томиться сильной жаждой
  rationale: Передаёт будущее תִּהְיֶה и усиление מְאֹד естественным, образным русским выражением, не сводя жажду к буквальной физической потребности.
theological_decisions:
- issue: Значение נֶפֶשׁ в наставлении о мудрости
  choice: душа ваша
  alternative: вы сами; жизнь ваша
  rationale: «Душа» сохраняет экзистенциальную и духовную глубину образа жажды, не утверждая при этом какой-либо специальной антропологической доктрины.
- issue: Связь между недостатком и жаждой
  choice: сопоставительный союз «а»
  alternative: «и»; обстоятельственное «когда»
  rationale: Еврейское ו допускает простое соединение и смысловое сопоставление. «А» естественно по-русски и не усиливает связь до причинной или временной, которой текст прямо не выражает.
translation_notes:
  register: Современный литературный русский с достоинством библейской мудрой речи. Инверсия «душа ваша» сохраняет возвышенный оттенок, оставаясь понятной; чрезмерно архаичные формы исключены.
