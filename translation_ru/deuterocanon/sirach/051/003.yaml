base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/003.yaml
  text: from the snare of those watching for my stumbling[a], and from the hand of those seeking my life. You saved me from many troubles[b], and from the distress of a flame all around.
translation:
  language: ru
  text: Из западни тех, кто подстерегал моё падение[a], и из руки тех, кто искал моей жизни. Ты спас меня от многих бед и от гнёта пламени вокруг[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, кто следил за моей хромотой» или «за моим спотыканием». Еврейское выражение образно и несколько неопределённо.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский текст буквально передаёт трудное выражение, означающее «бедствие (или тесноту) пламени вокруг». Греческий параллельный текст здесь существенно отличается, развёрнуто описывая избавление, но не сохраняя именно этой формулировки.
    reason: textual_variant
lexical_decisions:
- source_word: מִמּוֹקֵשׁ
  choice: из западни
  rationale: Слово обозначает западню или ловушку; «западня» сохраняет конкретную поэтическую метафору вражеского умысла.
- source_word: צוֹפֵי צַלְעִי
  choice: тех, кто подстерегал моё падение
  rationale: צופי буквально указывает на наблюдающих, а צלעי здесь, вероятно, означает хромоту, спотыкание или падение. «Подстерегал моё падение» естественно передаёт враждебное ожидание промаха, не скрывая неоднозначности в примечании.
- source_word: וּמִּיַד
  choice: и из рук
  rationale: Буквальный образ руки обозначает власть и сохраняет еврейский параллелизм; во множественном русском выражение звучит естественнее.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: искавших моей жизни
  rationale: В контексте смертельной угрозы נפש означает жизнь; оборот сохраняет достоинство и близость к исходной идиоме.
- source_word: מֵרַבּוֹת צָרוֹת
  choice: от множества бед
  rationale: רבות допускает значение многочисленности и интенсивности; «множество бед» ясно передаёт естественное множественное прочтение.
- source_word: הוֹשַׁעְתָּנִי
  choice: Ты спас меня
  rationale: Прямо передаёт личное обращение к Богу и основное значение глагола ישע.
- source_word: וּמִמְּצוּקוֹת
  choice: и от муки
  rationale: Существительное обозначает тесноту, тяжкое давление или бедствие. «Мука» естественно сочетается с образом окружающего пламени, не устраняя его буквального или метафорического смысла.
- source_word: שַׁלְהֶבֶת
  choice: пламени
  rationale: Сохраняется конкретный образ единственного собирательного «пламени», который может пониматься буквально или образно.
- source_word: מִסָּבִיב
  choice: окружавшего меня
  rationale: Передаёт охват опасностью со всех сторон; местоимение «меня» проясняет естественную связь в русском, подразумеваемую контекстом.
theological_decisions:
- issue: Передача נפשי как «моей души» или «моей жизни»
  choice: моей жизни
  alternative: моей души
  rationale: В сочетании с врагами, ищущими נפש человека, речь идёт о покушении на жизнь, а не об антропологическом утверждении о душе.
- issue: Буквально или метафорически понимать заключительный образ огня
  choice: от муки пламени, окружавшего меня
  alternative: от окружавшей меня огненной муки
  rationale: Формулировка сохраняет самостоятельный конкретный образ пламени и не решает, обозначает ли он буквальный огонь или бедствие. Существенно отличающийся греческий параллельный текст не используется для замены хорошо засвидетельствованного еврейского чтения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Сохранены параллелизм, прямое обращение к Богу и конкретные образы западни, рук и пламени; неоднозначность редкого выражения вынесена в примечание.
