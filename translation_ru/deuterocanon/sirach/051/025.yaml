  text: 'Я открыл уста и заговорил о ней: приобретайте себе мудрость без серебра[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте и греческой параллели употреблено местоимение женского рода, вероятнее всего относящееся к мудрости, представленной как женщина; возможно и более отвлечённое понимание: «заговорил об этом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי פָתַחְתִּי
  choice: Я открыл уста
  rationale: Буквально передаёт устойчивый древнееврейский оборот о начале речи, сохраняет образность и соответствует греческой параллели.
- source_word: וְדִבַּרְתִּי בָהּ
  choice: и говорил о ней
  rationale: Суффикс женского рода естественно относится к персонифицированной мудрости; русское «о ней» сохраняет грамматический род и возможную персонификацию.
- source_word: קְנוּ לָכֶם
  choice: приобретайте себе
  rationale: Глагол קנה может означать как покупку, так и приобретение вообще. «Приобретайте» сохраняет оба оттенка, тогда как упоминание серебра поддерживает торговую метафору.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Прямое соответствие древнееврейскому слову; согласуется с женским родом предшествующего местоименного суффикса.
- source_word: בְּלֹא כָסֶף
  choice: без серебра
  rationale: Сохраняет конкретный образ древнееврейского текста и греческой параллели, не обобщая его до «денег» или «платы».
theological_decisions:
- issue: К чему относится местоименный суффикс женского рода в выражении וְדִבַּרְתִּי בָהּ
  choice: «о ней» — о мудрости, представленной как женщина
  alternative: «об этом» — о наставлении или предмете речи в более общем смысле
  rationale: Ближайшее упоминание мудрости и характерная для Книги Сираха её персонификация делают личное прочтение наиболее естественным, но примечание сохраняет допустимое более отвлечённое понимание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. «Уста» сохраняет достоинство и древний речевой образ, а синтаксис остаётся ясным для современного читателя.
