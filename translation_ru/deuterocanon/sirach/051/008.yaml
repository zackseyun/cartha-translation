base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/008.yaml
  text: And I remembered the mercies of Yahweh[a], and his acts of covenant faithfulness from of old, who delivers those who take refuge in him[b], and redeems them from every evil.
translation:
  language: ru
  text: 'И я вспомнил милости Господа и Его верную любовь, являемую издревле[a]: Он избавляет тех, кто ищет у Него убежища[b], и искупает их от всякого зла.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «и Его неизменную милость от века». Еврейский оборот может подчёркивать как давность Божьей верности, так и её непреходящий характер.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте: «Твоё милосердие, Господи, и Твоё дело от века, ибо Ты избавляешь ожидающих Тебя и спасаешь их от руки народов». В еврейском тексте здесь: «тех, кто ищет у Него убежища» и «от всякого зла».'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶזְכְּרָה
  choice: И я вспомнил
  rationale: Прямо передаёт значение זכר и сохраняет повествовательную связь, выраженную союзом.
- source_word: רַחֲמֵי יְהֹוָה
  choice: милости Господа
  rationale: Множественное «милости» отражает форму רַחֲמֵי как проявления сострадания; тетраграмматон передан традиционным русским «Господь».
- source_word: וַחֲסָדָיו אֲשֶׁר מֵעוֹלָם
  choice: и Его верную любовь, являемую издревле
  rationale: חסד передано как «верная любовь», что сохраняет оттенки постоянства, преданности и благости без чрезмерно узкого конфессионального истолкования. «Являемую» делает естественной связь с временным оборотом и допускает собирательное понимание еврейского множественного числа.
- source_word: הַמַּצִּיל
  choice: Он избавляет
  rationale: Причастная форма описывает Господа как Избавителя; отдельное предложение с двоеточием естественно по-русски передаёт пояснительно-аппозитивную связь, не навязывая строго причинного значения.
- source_word: חוֹסֵי בוֹ
  choice: тех, кто ищет у Него убежища
  rationale: Сохраняет конкретную метафору חסה ב — искать защиты у кого-либо, а не сводит её к общему понятию веры или доверия.
- source_word: וַיִּגְאָלֵם
  choice: и искупает их
  rationale: «Искупает» сохраняет более сильное значение גאל — освобождение посредством действия избавителя, — отличая его от предшествующего «избавляет».
- source_word: מִכָּל רָע
  choice: от всякого зла
  rationale: Широкая формулировка сохраняет возможные значения нравственного зла, бедствия и вреда.
theological_decisions:
- issue: Смысл חסד в описании Божьего спасительного действия
  choice: Его верную любовь, являемую издревле
  alternative: Его неизменную милость от века; Его дела заветной верности издревле
  rationale: «Верная любовь» передаёт устойчивую Божью благость и преданность, не ограничивая слово исключительно формальной категорией завета. Добавление «являемую» позволяет услышать множественное число как повторяющиеся проявления этой любви.
- issue: Временная сила מֵעוֹלָם
  choice: издревле
  alternative: от века; от вечности
  rationale: «Издревле» сохраняет акцент на давней и непрерывно засвидетельствованной Божьей верности, не превращая неоднозначный оборот в однозначное метафизическое утверждение о вечности.
- issue: Синтаксическая связь הַמַּצִּיל с предшествующей строкой
  choice: двоеточие и отдельное «Он избавляет»
  alternative: ибо Он избавляет; Который избавляет
  rationale: Такой вариант сохраняет пояснительное описание Господа и одновременно избегает навязывания чисто причинной связи; по-русски он яснее, чем относительное предложение после ряда дополнений.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Заглавные местоимения при обращении к Богу соответствуют распространённой русской религиозной издательской норме. Двоеточие перед спасительными действиями обеспечивает ясный ритм и сохраняет неоднозначность связи еврейского причастия.
