  text: And I raised my voice from the earth[b][a], and from the gates of Sheol I cried out.
translation:
  language: ru
  text: И вознёс я от земли голос мой[a], и от врат Шеола[b] воззвал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из земли» либо «из страны». В еврейском тексте стоит «от/из земли», тогда как греческий параллельный текст передаёт: «на земле».'
    reason: textual_variant
  - marker: b
    text: '«Шеол» — древнееврейское название мира мёртвых; возможные передачи: «мир мёртвых», «преисподняя» или, в некоторых контекстах, «могила».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָרִים
  choice: вознёс я
  rationale: Глагол רום здесь означает поднятие голоса. «Вознёс» сохраняет конкретный поэтический образ и соответствует возвышенному, но понятному регистру.
- source_word: מֵאֶרֶץ
  choice: от земли
  rationale: Предлог מִן естественно передаётся как «от/из», а אֶרֶץ — как «земля». Перевод следует основному еврейскому свидетельству; греческое «на земле» отмечено в сноске как расхождение.
- source_word: קוֹלִי
  choice: голос мой
  rationale: Прямое соответствие קוֹלִי. Постпозиция местоимения поддерживает поэтический ритм и достоинство речи.
- source_word: וּמִּשַּׁעֲרֵי
  choice: и от врат
  rationale: Сохраняется буквальный образ множественного שַׁעֲרֵי — «ворота/врата». Форма «врат» естественна в русском библейско-поэтическом контексте.
- source_word: שְׁאוֹל
  choice: Шеола
  rationale: Транслитерация сохраняет древнееврейское обозначение мира мёртвых и не сужает его до физической могилы или позднейшего представления об аде.
- source_word: שִׁוַּעְתִּי
  choice: воззвал
  rationale: שוע обозначает настойчивый вопль, обычно обращённый за помощью. «Воззвал» сохраняет молитвенно-просительный оттенок без добавления отсутствующего в тексте прямого дополнения.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: Шеол
  alternative: мир мёртвых; преисподняя; могила
  rationale: «Шеол» сохраняет широту и напряжение древнееврейского представления, не отождествляя его автоматически ни с могилой, ни с поздней доктриной ада.
- issue: Природа воззвания из врат Шеола
  choice: сохранён поэтический образ без догматического уточнения
  alternative: истолковать как буквальное пребывание среди мёртвых или только как метафору смертельной опасности
  rationale: Контекст допускает образ предельной близости к смерти, однако сам стих не требует однозначного решения между буквальным и метафорическим прочтением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Инверсия «голос мой» и слово «врата» уместны для гимнической речи, оставаясь понятными современному читателю. Маркеры сносок поставлены непосредственно после соответствующих выражений.
