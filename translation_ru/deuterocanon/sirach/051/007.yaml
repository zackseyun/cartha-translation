  text: I turned around[a], and there was no one to help me; I looked for support, and there was none.
translation:
  language: ru
  text: Я оглянулся вокруг, но некому было мне помочь; я искал поддержки, но её не было.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст говорит о поиске поддержки; греческий параллельный текст уточняет: «вглядываясь в поисках помощи от людей, но её не было». Перевод следует еврейскому тексту, а греческий подтверждает, что речь идёт о человеческой помощи.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶפְנֶה סָבִיב
  choice: Я оглянулся вокруг
  rationale: פנה означает «повернуться, обратиться», а סָבִיב — «вокруг, со всех сторон». В контексте поиска естественное русское «оглянулся вокруг» сохраняет телесный образ и передаёт взгляд во все стороны.
- source_word: עוֹזֵר לִי
  choice: некому было мне помочь
  rationale: Причастие עוֹזֵר обозначает помогающего. Безличная русская конструкция естественно передаёт отсутствие человека, который мог бы оказать помощь.
- source_word: וַאֲצַפֶּה
  choice: я искал
  rationale: צפה допускает значения «всматриваться», «ожидать», «надеяться». Параллелизм и греческое ἐμβλέπων поддерживают активное ожидание или поиск; «искал» наиболее естественно в данном контексте.
- source_word: סוֹמֵךְ
  choice: поддержки
  rationale: Форма от סמך может обозначать поддерживающего или поддержку. Русское абстрактное существительное согласуется с греческим ἀντίλημψις и сохраняет отличие от עוֹזֵר в первой половине стиха.
- source_word: וְאָיִן
  choice: но её не было
  rationale: Краткое бытийное отрицание передано естественной русской формулой; местоимение относится к «поддержке».
