  text: My soul came near to death[b][a], and my life to the depths of Sheol.
translation:
  language: ru
  text: 'Душа моя приблизилась к смерти[a],

    и жизнь моя — к глубинам шеола[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Душа моя коснулась смерти». Еврейский глагол буквально означает «коснуться, достичь», но здесь, вероятно, говорит о близости к смерти; в греческой версии — «приблизилась к смерти».'
    reason: lexical_alternative
  - marker: b
    text: 'Шеол — еврейское название мира мёртвых; в греческой версии здесь сказано: «Аида внизу».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּגַּע
  choice: приблизилась
  rationale: Глагол נגע буквально означает «коснуться, достичь», но в сочетании со «смертью» выражает предельную близость к смерти. Греческое ἤγγισεν («приблизилась») подтверждает такое понимание.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: נפש может означать душу, жизнь или самого человека. Перевод «душа моя» сохраняет отличие от חַיָּתִי («жизнь моя») во второй строке и поэтический параллелизм еврейского текста.
- source_word: חַיָּתִי
  choice: жизнь моя
  rationale: В данном параллелизме слово обозначает жизнь или жизненную силу говорящего; «жизнь моя» естественно по-русски и соответствует греческому ἡ ζωή μου.
- source_word: לִשְׁאוֹל
  choice: к глубинам шеола
  rationale: שְׁאוֹל — еврейское обозначение мира мёртвых. Транслитерация сохраняет образ исходного текста и не сужает его до отдельной могилы; управление объединено с תַּחְתִּיּוֹת в естественном русском обороте.
- source_word: תַּחְתִּיּוֹת
  choice: глубинам
  rationale: Форма множественного числа обозначает нижние, глубочайшие области. «Глубины шеола» кратко и ясно передают усилительный пространственный образ; греческое κάτω («внизу») поддерживает это значение.
theological_decisions:
- issue: Передача שְׁאוֹל при наличии греческой параллели ᾅδης
  choice: шеол
  alternative: царство мёртвых; преисподняя; ад
  rationale: Поскольку сохранился еврейский текст, предпочтён его собственный термин. «Ад» мог бы привнести более позднее представление о месте наказания, а «могила» чрезмерно сузила бы смысл. Примечание поясняет термин, не устраняя присущую тексту неопределённость представлений о посмертном мире.
translation_notes:
  register: Современный литературный русский язык с сохранением двухчастного поэтического параллелизма. Инверсия «душа моя / жизнь моя» придаёт строкам умеренно возвышенное библейское звучание, оставаясь понятной современному читателю. Тире во второй строке естественно передаёт эллипсис повторного глагола.
