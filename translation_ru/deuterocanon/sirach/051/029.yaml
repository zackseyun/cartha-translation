  text: May my soul rejoice in my old age[a], and may you not be put to shame by my song.
translation:
  language: ru
  text: Да возрадуется душа моя в старости моей[a], и да не будете постыжены в моей песне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Да возрадуется душа ваша в милости Его, и да не будете постыжены в хвале Его». В еврейском тексте вместо этого: «душа моя», «в старости моей» и «в моей песне».'
    reason: alternative_reading
lexical_decisions:
- source_word: תִּשְׂמַח
  choice: Да возрадуется
  rationale: Форма передана как пожелание; это соответствует волитивному оттенку еврейского текста и греческому оптативу.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: Сохраняет еврейский образ и внутренний, личный характер радости, не сводя выражение к простому «я».
- source_word: בְּשֵׂיבָתִי
  choice: в старости моей
  rationale: שֵׂיבָה буквально связано с сединой, но обычно обозначает старость; выбран естественный и достоинственный русский эквивалент.
- source_word: וְלֹא תֵבוֹשוּ
  choice: и да не будете вы постыжены
  rationale: Сохраняет множественное число адресатов, пожелательный строй и оттенок постыжения, а не только внутреннего стыда.
- source_word: בְּשִׁירָתִי
  choice: моей песней
  rationale: Еврейское слово означает «моя песня/моё пение»; творительный падеж естественно передаёт возможный смысл причины или средства при глаголе постыжения.
theological_decisions:
- issue: Существенное расхождение между сохранившимся еврейским текстом и греческой параллелью
  choice: 'В основном тексте следовать еврейскому чтению: «душа моя… в старости моей… моей песней».'
  alternative: 'Греческая параллель: «Да возрадуется душа ваша милости Его, и да не будете постыжены в хвале Его».'
  rationale: Сохранившийся еврейский свидетель имеет высокий уровень уверенности и является первичным для перевода; греческое чтение существенно отличается и потому приводится в сноске, не смешиваясь с основным текстом.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным пожелательным оборотом «да…». Инверсия «душа моя» и «в старости моей» сохраняет поэтическое достоинство стиха.
