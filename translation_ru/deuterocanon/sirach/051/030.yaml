base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/051/030.yaml
  text: Do your work in righteousness[a], and he will give you your reward in its time. Blessed is Yahweh forever, and praised is his name from generation to generation.
translation:
  language: ru
  text: Совершайте свои дела в праведности, и Он даст вам вашу награду в должное время[a]. Благословен Яхве вовеки, и прославлено имя Его из поколения в поколение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в его время». Это можно понимать как должное время для награды или как время, определённое Богом; такую же неоднозначность допускает греческий текст.'
    reason: Лексическая и местоименная неоднозначность בְּעִתּוֹ.
lexical_decisions:
- source_word: מַעֲשֵׂיכֶם עֲשׂוּ
  choice: Совершайте свои дела
  rationale: Сочетание существительного «ваши дела» с повелительным глаголом «делайте» передано без неестественного для русского языка повтора, но с сохранением предмета увещания и повелительной силы.
- source_word: בִצְדָקָה
  choice: в праведности
  rationale: Сохраняет этико-богословское значение צְדָקָה и передаёт образ действия, не сводя выражение только к юридической справедливости.
- source_word: וְהוּא נוֹתֵן לָכֶם שְׂכַרְכֶם
  choice: и Он даст вам вашу награду
  rationale: Местоимение оставлено без замены явным именованием Бога; причастие נוֹתֵן в данном обещании естественно передано будущим временем. שְׂכַר означает награду, плату или воздаяние; «награда» уместна в контексте литературы мудрости.
- source_word: בְּעִתּוֹ
  choice: в должное время
  rationale: Естественная русская формулировка передаёт наступление надлежащего срока. Неоднозначность местоименного суффикса — время награды или Божье время — отмечена в сноске.
- source_word: בָּרוּךְ יְהֹוָה לְעוֹלָם
  choice: Благословен Яхве вовеки
  rationale: Сохранена именная формула благословения и непосредственно передано личное имя יהוה.
- source_word: וּמְשֻׁבָּח שְׁמוֹ לְדֹר וָדֹר
  choice: и прославлено имя Его из поколения в поколение
  rationale: Передаёт параллельную доксологическую конструкцию и устойчивое значение לְדֹר וָדֹר как непрерывной хвалы во всех сменяющихся поколениях.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит Тетраграмматон; форма «Яхве» сохраняет личное заветное имя и соответствует заданной проектной норме.
- issue: Передача צְדָקָה
  choice: праведность
  alternative: справедливость; то, что право
  rationale: Контекст призывает к нравственно верным поступкам перед Богом. «Праведность» сохраняет богословско-назидательный строй оригинала, не исключая оттенка справедливости.
- issue: Референт суффикса в בְּעִתּוֹ
  choice: не уточнять в основном тексте; «в должное время»
  alternative: во время награды; в Божье время
  rationale: Еврейская форма, как и греческое ἐν καιρῷ αὐτοῦ, допускает соотнесение срока с наградой либо с Богом. Основной текст не должен догматически разрешать эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным доксологическим звучанием. Синтаксис остаётся ясным для широкого читателя; ключевой термин «праведность» и имя «Яхве» сохранены.
