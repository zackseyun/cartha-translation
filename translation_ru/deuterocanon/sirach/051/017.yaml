  text: Её иго было мне в честь, и моим наставникам я воздам благодарность.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь труден и заметно отличается от греческого. По-гречески: «В ней я преуспел и воздам славу тому, кто даёт мне мудрость». Еврейский текст говорит об «иге», которое было для говорящего честью, и о благодарности его наставникам (множественное число).'
    reason: textual_variant
lexical_decisions:
- source_word: עֻלָּהּ
  choice: её бремя
  rationale: Передаёт трудную еврейскую форму как обозначение возложенного бремени или ига; это чтение лучше следует представленному еврейскому тексту, чем греческому варианту о преуспевании.
- source_word: הָיָה לִי לְכָבוֹד
  choice: стало для меня честью
  rationale: Естественно по-русски передаёт буквальное «было мне для чести/славы», сохраняя положительную оценку бремени.
- source_word: לִמְלַמְּדַי
  choice: моему наставнику
  rationale: Контекст допускает наставника как личного учителя; форма еврейского свидетеля трудна и может быть понята также как относящаяся к наставникам, что отмечено в сноске.
- source_word: אֶתֵּן הוֹדָאָה
  choice: я воздам благодарность
  rationale: הוֹדָאָה здесь естественно означает благодарение или признательность; «воздам благодарность» сохраняет оттенок намеренного ответного почтения.
theological_decisions:
- issue: Кому воздаётся благодарность
  choice: не уточнять, является ли наставник человеком или Богом
  alternative: прямо назвать Бога подателем мудрости вслед за греческим текстом
  rationale: Еврейский текст говорит о наставнике, тогда как греческий — о дающем мудрость. Основной перевод следует еврейскому свидетелю и не разрешает референциальную неоднозначность богословским уточнением.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. «Бремя» звучит естественнее буквального «иго» в данном высказывании, а «стало для меня честью» устраняет неуклюжее буквальное «было мне для славы», не снимая парадокса.
