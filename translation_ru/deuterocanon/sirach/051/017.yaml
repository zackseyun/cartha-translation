  to: Её иго было мне в честь, и моим наставникам я воздам благодарность.[a]
  rationale: Исправлено число «наставникам» в соответствии с еврейской грамматикой; «бремя» заменено на более точное «иго». Сноска переработана так, чтобы честно и конкретно показать расхождение еврейского и греческого свидетелей, не выдавая грамматически ясное множественное число за неопределённость и не разрешая текстологическое расхождение в пользу одной богословской интерпретации.
