  text: I planned to improve my way[a], and I will not turn back, for I will find it.
translation:
  language: ru
  text: Я решил исправить свой путь[a] и не поверну назад, потому что найду его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Ибо я решил исполнить её, и ревностно стремился к добру, и вовсе не постыжусь». Это существенно иная форма текста по сравнению с сохранившимся еврейским.'
    reason: textual_variant
lexical_decisions:
- source_word: חָשַׁבְתִּי
  choice: Я решил
  rationale: Глагол обозначает обдуманное намерение; в данном контексте «решил» естественно передаёт целенаправленную нравственную решимость.
- source_word: לְהִיטֶיב [דַּרְכִּי]
  choice: исправить свой путь
  rationale: Инфинитив יטב может означать «делать лучше», а «путь» метафорически обозначает образ жизни; такая формулировка сохраняет образ и передаёт мысль о нравственном исправлении.
- source_word: וְלֹא אַהֲפֹךְ
  choice: и не поверну назад
  rationale: Несмотря на текстовую трудность формы הפך, в контексте речь идёт об отказе изменить избранный курс.
- source_word: כִּי אֶמְצָאֶנּוּ
  choice: потому что найду его
  rationale: מצא означает «найти» или «достичь». Мужской суффикс сохранён местоимением «его», а неоднозначный референт не уточняется вопреки еврейскому тексту.
theological_decisions:
- issue: Расхождение еврейского и греческого окончаний стиха
  choice: 'Основной текст следует сохранившемуся еврейскому чтению: «и не поверну назад, потому что найду его».'
  alternative: 'Греческий текст: «Ибо я решил исполнить её, и ревностно стремился к добру, и вовсе не постыжусь».'
  rationale: При наличии еврейского текста Сираха он принят за основу. Существенно отличающееся греческое чтение приведено в сноске, поскольку оно заметно меняет смысл.
translation_notes:
  register: Современный литературный русский язык; речь краткая и возвышенная без архаизации. Метафора «путь» сохранена, а не заменена более толковым словом «поведение».
