translation:
  language: ru
  text: Речь глупцов вызывает досаду[a], а смех их — в греховной распущенности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Речь глупцов тягостна»; προσόχθισμα может означать досаду, раздражение или нечто тягостное.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «смех их — в греховном разгуле»; σπατάλη может обозначать потворство желаниям, расточительную роскошь, невоздержность или необузданную жизнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διήγησις
  choice: речь
  rationale: Слово может обозначать рассказ, изложение или речь; здесь обобщённое «речь» естественно передаёт то, что говорят глупцы, не сужая смысл до формального повествования.
- source_word: μωρῶν
  choice: глупцов
  rationale: Сохранён традиционный нравственно-интеллектуальный термин литературы мудрости, а не более нейтральное обозначение неразумных людей.
- source_word: προσόχθισμα
  choice: вызывает отвращение
  rationale: Существительное обозначает нечто тягостное, досадное или вызывающее неприязнь. Предикативная конструкция с глаголом звучит по-русски естественно и сохраняет сильную отрицательную оценку.
- source_word: γέλως
  choice: смех
  rationale: Передано основное значение без уточнения «насмешка», которого сам греческий текст прямо не выражает.
- source_word: ἐν
  choice: в
  rationale: 'Предлог сохраняет значение сферы или среды: смех пребывает в области греховного разгула.'
- source_word: σπατάλῃ
  choice: разгуле
  rationale: Слово указывает на изнеженную, необузданную или расточительную жизнь и потворство желаниям. «Разгул» кратко и выразительно передаёт нравственно предосудительную избыточность.
- source_word: ἁμαρτίας
  choice: греховном
  rationale: Греческий родительный передан русским прилагательным ради естественности; прямая нравственная категория греха сохранена.
theological_decisions:
- issue: Нравственная сила терминов литературы мудрости
  choice: «глупцов» и «греховном»
  alternative: «неразумных» и «порочном»
  rationale: Более мягкие варианты ослабили бы нравственную остроту греческих μωρῶν и ἁμαρτίας; перевод сохраняет прямое обозначение глупости и греха.
- issue: Характер смеха глупцов
  choice: «смех» без добавления значения насмешки
  alternative: «насмешки»
  rationale: Контекст связывает смех с греховным разгулом, однако γέλως сам по себе означает смех и не требует истолковывать его именно как издевательство.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим строем, уместным для книги Премудрости. Тире во второй части восполняет отсутствующую в греческом связку; первая часть слегка развёрнута ради естественного русского синтаксиса.
