  text: A potter’s vessels are tested by the kiln[a], and likewise a man by his reasoning.
translation:
  language: ru
  text: Сосуды горшечника испытывает печь, а человека — его рассуждение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его мысли»; возможно также: «в своём размышлении». В греческой версии: «в его размышлении».'
    reason: Слово חֶשְׁבּוֹן и синтаксис оборота допускают значения мысли, рассуждения или обдумывания; греческая параллель отражает обстоятельственную конструкцию.
lexical_decisions:
- source_word: כְּלֵי יוֹצֵר
  choice: сосуды горшечника
  rationale: Конструктивное сочетание буквально обозначает сосуды, изготовленные горшечником; выбран естественный и конкретный русский оборот.
- source_word: לְבָעֵר כִּבְשָׁן
  choice: испытывает печь
  rationale: Еврейская фраза сжата и допускает понимание через обжиг; греческая параллель прямо говорит, что печь испытывает сосуды. Активная конструкция сохраняет образ печи, выявляющей качество изделия.
- source_word: וְכָמֹהוּ
  choice: а
  rationale: В параллельной конструкции русское «а» естественно вводит сопоставление «как сосуды — так человек», не утяжеляя афористическую строку.
- source_word: אִישׁ
  choice: человека
  rationale: Еврейское слово стоит в мужском единственном числе, но здесь имеет обобщающий смысл; русское «человек» сохраняет форму и универсальное значение.
- source_word: עַל חֶשְׁבּוֹנוֹ
  choice: его рассуждение
  rationale: חֶשְׁבּוֹן может обозначать расчёт, размышление или ход рассуждения; греческое ἐν διαλογισμῷ αὐτοῦ подтверждает связь с обдумыванием. «Рассуждение» сохраняет интеллектуальный образ и афористический параллелизм.
theological_decisions:
- issue: Обобщающее обозначение человека
  choice: человека
  alternative: личность / человека независимо от пола
  rationale: Мужская форма оригинала сохранена без придания ей ограничительного смысла; стих говорит о человеке вообще.
- issue: Способ выявления качеств человека
  choice: его рассуждение испытывает человека
  alternative: человек испытывается в своём размышлении
  rationale: 'Эллиптический параллелизм прочитан по образцу первой части: как печь выявляет качество сосудов, так рассуждение выявляет человека. При этом примечание сохраняет возможное понимание обстоятельственного оборота.'
translation_notes:
  register: Краткий афористический строй сохранён. Лексика современная и литературная; «сосуды горшечника» и «печь» удерживают конкретный ремесленный образ, а тире передаёт эллипсис второй части.
