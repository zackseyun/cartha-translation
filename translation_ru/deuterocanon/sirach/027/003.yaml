translation:
  language: ru
  text: Если он не будет с усердием держаться страха Господня, его дом будет вскоре разрушен.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его домашнее хозяйство вскоре будет разрушено». Греческое слово «дом» может обозначать не только строение, но также семью, домочадцев и всё домашнее хозяйство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν μὴ
  choice: Если ... не будет
  rationale: Передаёт условную конструкцию прямо и естественно для современного русского языка.
- source_word: ἐν φόβῳ Κυρίου
  choice: страха Господня
  rationale: Сохраняет устойчивое библейское выражение и его богословскую весомость, не сводя его лишь к почтению или благочестию.
- source_word: κρατήσῃ
  choice: будет ... держаться
  rationale: Передаёт идею твёрдой приверженности; возвратная форма естественна в русском сочетании «держаться страха Господня».
- source_word: κατὰ σπουδήν
  choice: ревностно
  rationale: Выражает усердие, серьёзность и внутреннее рвение, с которыми человек должен держаться страха Господня.
- source_word: ἐν τάχει
  choice: вскоре
  rationale: Передаёт быстроту наступления результата и естественно сочетается с будущим событием.
- source_word: καταστραφήσεται
  choice: рухнет
  rationale: Сохраняет яркий образ падения и разорения дома, не уточняя, идёт ли речь о строении или семье.
- source_word: αὐτοῦ ὁ οἶκος
  choice: его дом
  rationale: Сохраняет широту οἶκος, которое может обозначать жилище, домашних, семью или всё домохозяйство.
theological_decisions:
- issue: Значение выражения «страх Господень»
  choice: Сохранить традиционное библейское выражение «страх Господень».
  alternative: «благоговение перед Господом» или «почтение к Господу»
  rationale: Греческое выражение имеет устойчивое значение в литературе мудрости; буквальная библейская формула сохраняет межтекстовые связи и не сглаживает сочетание страха, почтения и верности.
- issue: Объём значения слова «дом»
  choice: Оставить в основном тексте «дом».
  alternative: «семья», «домочадцы» или «домохозяйство»
  rationale: οἶκος допускает как буквальное, так и расширенное понимание. Контекст не требует устранять эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрости. Формулировка краткая и афористичная; традиционное выражение «страх Господень» сохранено, а неоднозначность слова «дом» пояснена в сноске.
