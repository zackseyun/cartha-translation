  terminology: '«Страх Господень» — удачное и необходимое сохранение устойчивого библейского термина. «Дом» правильно оставлен в основном тексте, поскольку οἶκος допускает значение дома, домашнего хозяйства и семейного уклада. Сноску следует исправить: «разорится» добавляет преимущественно имущественное значение, которого греческий глагол сам по себе не требует.'
