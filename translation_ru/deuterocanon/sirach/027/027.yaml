  text: Whoever does evil[a], onto himself it will roll, and he will certainly not know from where it came upon him.
translation:
  language: ru
  text: Кто творит зло, на того оно и накатится[a], и он так и не узнает, откуда оно пришло к нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на него оно покатится». Греческий текст изображает зло как нечто, что накатывается на совершившего его.'
