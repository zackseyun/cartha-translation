lexical_decisions:
- source_word: ὁ ποιῶν
  choice: Кто творит
  rationale: Артиклированное причастие настоящего времени имеет обобщающий смысл; эта формулировка естественно передаёт характер изречения.
- source_word: πονηρὰ
  choice: зло
  rationale: Субстантивированное прилагательное среднего рода во множественном числе обозначает злые дела в совокупности; русское «зло» сохраняет нравственный смысл и согласуется с собирательным образом далее.
- source_word: εἰς αὐτὸν κυλισθήσεται
  choice: на того оно и накатится
  rationale: Передаёт направленное движение к самому совершающему зло и сохраняет греческий образ качения; частица «и» подчёркивает возврат последствия на виновника без тяжеловесного буквального порядка слов.
- source_word: καὶ οὐ μὴ ἐπιγνῷ
  choice: и он так и не узнает
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание; «так и не узнает» естественно передаёт эту категоричность.
- source_word: πόθεν ἧκε αὐτῷ
  choice: откуда оно пришло к нему
  rationale: Сохраняет указание и на источник, и на прибытие беды к человеку, не сводя вторую часть только к абстрактному знанию причины.
theological_decisions:
- issue: Воздаяние злом, возвращающимся к тому, кто его совершает
  choice: 'Сохранён предметный образ: зло накатывается на своего творца.'
  alternative: «Зло обратится против него» или «зло вернётся к нему».
  rationale: Греческий глагол κυλίω создаёт образ качения; его важно не заменять отвлечённым утверждением о последствиях. При этом перевод не уточняет механизм воздаяния, которого текст не называет.
translation_notes:
  register: Современный литературный русский язык с краткой формой нравственного изречения. «Творит зло» сохраняет достоинство библейского регистра, а «накатится» делает исходный образ ясным и живым.
