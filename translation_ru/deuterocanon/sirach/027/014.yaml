  text: The talk of one who swears much makes the hair stand up[a], and their quarrel stops the ears.
translation:
  language: ru
  text: От речи того, кто много клянётся[a], волосы встают дыбом, а от их ссоры затыкают уши.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое πολυκόρυφου — редкое и трудное для точного истолкования слово. Оно может обозначать человека, который часто клянётся или проклинает, либо, шире, того, чья речь громка, дерзка или хвастлива.
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰ
  choice: речь
  rationale: Широкое обозначение речи или разговора; «речь» естественно звучит в кратком изречении и сохраняет достоинство стиля.
- source_word: πολυκόρυφου
  choice: того, кто много клянётся
  rationale: Редкое и лексически трудное слово, вероятно обозначающее человека, склонного к многочисленным клятвам или проклятиям либо к громкой, возмутительной речи. Выбран вероятный контекстуальный смысл, а неопределённость отмечена в сноске.
- source_word: ὀρθώσει τρίχας
  choice: поднимает волосы дыбом
  rationale: Естественное русское выражение, сохраняющее яркий греческий образ испуга или ужаса.
- source_word: μάχη
  choice: ссора
  rationale: В контексте речи и житейской мудрости вероятнее словесная распря, а не буквальное сражение.
- source_word: ἐμφραγμὸς ὤτιων
  choice: заставляет затыкать уши
  rationale: Передаёт образ невыносимой распри, от которой человек закрывает уши; по-русски звучит яснее буквального «закупоривание ушей».
