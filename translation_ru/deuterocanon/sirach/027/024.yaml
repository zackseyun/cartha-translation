translation:
  language: ru
  text: Многое я возненавидел, но ни с чем я не сравнил его[a]; и Господь возненавидит его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но не уподобился ему». Греческое выражение допускает такое понимание, хотя активная форма глагола естественнее означает: «ни с чем не сравнил его».'
    reason: Сохраняет подлинную неоднозначность краткой греческой конструкции οὐχ ὡμοίωσα αὐτῷ.
lexical_decisions:
- source_word: πολλὰ
  choice: многое
  rationale: Субстантивированное среднее множественного числа естественно передаётся русским собирательным местоимением «многое».
- source_word: ἐμίσησα
  choice: я возненавидел
  rationale: Аорист выражает завершённый опыт говорящего; «возненавидел» сохраняет силу μισέω и хорошо звучит в изречении.
- source_word: οὐχ ὡμοίωσα αὐτῷ
  choice: ничто не сравнил с ним
  rationale: Активная форма ὡμοίωσα обычно означает «уподобил, сравнил»; подразумеваемым дополнением служит нечто из ранее названного «многого». В русском дополнение «ничто» выражено явно ради понятности, а местоимение «с ним» указывает на ранее описанного человека.
- source_word: ὁ κύριος
  choice: Господь
  rationale: В контексте книги Премудрости титул относится к Богу; традиционное и ясное русское соответствие — «Господь».
- source_word: μισήσει αὐτόν
  choice: возненавидит его
  rationale: Будущее время и сильное значение μισέω переданы прямо; повтор корня «ненавидеть» сохраняет связь с первой частью стиха.
theological_decisions:
- issue: Язык о ненависти Господа
  choice: Господь возненавидит его
  alternative: Господь будет питать к нему отвращение
  rationale: Прямой перевод не смягчает резкость высказывания и сохраняет повтор одного и того же греческого глагола μισέω применительно к говорящему и к Господу.
- issue: Смысл οὐχ ὡμοίωσα αὐτῷ
  choice: ничто не сравнил с ним
  alternative: не уподобился ему
  rationale: Активная морфология прежде всего поддерживает значение «не сравнил [ничего] с ним», то есть он хуже всего ненавистного говорящему. Однако возможное непереходное понимание отмечено в сноске, чтобы не скрывать неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, весомым ритмом изречения. Лексический повтор «возненавидел — возненавидит» намеренно сохраняет риторическую связь оригинала; архаизмы и конфессионально окрашенные уточнения не вводятся.
