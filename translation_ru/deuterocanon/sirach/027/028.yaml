  yaml_path: translation/deuterocanon/sirach/027/028.yaml
  text: Mockery and reproach are for the proud[b][a], and vengeance will lie in wait for him like a lion.
translation:
  language: ru
  text: Насмешка и поношение — удел гордых[a], и возмездие подстережёт его, как лев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надменных».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «устроит ему засаду, как лев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμπαιγμός
  choice: насмешка
  rationale: Передаёт насмешливое, унизительное обращение и естественно звучит в современном русском языке.
- source_word: ὀνειδισμός
  choice: поношение
  rationale: Сохраняет оттенки порицания, оскорбления и общественного бесчестья; в паре с «насмешкой» соответствует возвышенному регистру изречения.
- source_word: ὑπερηφάνων
  choice: гордых
  rationale: Родительный падеж множественного числа обозначает гордых или надменных людей как общий разряд; краткая субстантивированная форма естественна по-русски.
- source_word: ἐκδίκησις
  choice: возмездие
  rationale: Передаёт суровый смысл ответного воздаяния, не уточняя его деятеля и не приписывая ему эмоциональную мстительность, которой греческое слово здесь прямо не выражает.
- source_word: ἐνεδρεύσει
  choice: подстережёт
  rationale: Глагол обозначает тайное ожидание добычи или засаду; «подстережёт» сохраняет образ хищника и звучит естественно рядом со сравнением со львом.
- source_word: αὐτόν
  choice: его
  rationale: 'Сохраняет единственное число греческого местоимения: после обозначения общего разряда «гордых» предостережение индивидуализируется и относится к каждому гордому человеку.'
theological_decisions:
- issue: Передача единственного αὐτόν после множественного ὑπερηφάνων
  choice: 'Сохранить единственное число: «его»'
  alternative: «их» или «такого человека»
  rationale: Греческий текст переходит от общего разряда людей к его отдельному представителю. Единственное число сохраняет форму источника и остроту личного предостережения.
- issue: Передача ἐκδίκησις без смягчения и без указания неназванного деятеля
  choice: «возмездие»
  alternative: «месть», «кара», «правосудие»
  rationale: «Возмездие» сохраняет идею сурового ответного воздаяния и образ неотвратимой угрозы, но не добавляет того, кто именно мстит или карает. «Правосудие» чрезмерно смягчило бы предупреждение, а «месть» сильнее подразумевала бы личного мстителя.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Тире естественно восполняет отсутствующую в греческой именной фразе связку. «Удел» передаёт отношение родительного падежа, не делая его исключительно принадлежностью или действием самих гордых. Образ льва и неожиданного нападения сохранён.
