  text: A peg will be driven in between the joints of stones[b][a], and sin will be wedged in between selling and buying.
translation:
  language: ru
  text: Между стыками камней будет вбит колышек[a], а между продажей и покупкой будет сокрушён грех[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет прочно закреплён штырь».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально греческий текст говорит, что грех «будет сокрушён» между продажей и покупкой. По смыслу образа это также можно понять так: грех окажется зажат между двумя сторонами сделки, подобно колышку в стыке камней.'
    reason: textual_semantic_note
lexical_decisions:
- source_word: ἀνὰ μέσον
  choice: между
  rationale: Повторяющееся выражение обозначает положение между сторонами или предметами и сохраняет параллелизм обеих половин изречения.
- source_word: ἁρμῶν λίθων
  choice: стыками камней
  rationale: Ἁρμός — место соединения; в сочетании с камнями естественно означает стыки каменной кладки.
- source_word: παγήσεται πάσσαλος
  choice: будет вбит колышек
  rationale: Пассивная форма от πήγνυμι передаёт прочное закрепление предмета, а πάσσαλος здесь лучше понимать как небольшой кол или штырь, помещаемый в стык.
- source_word: πράσεως καὶ ἀγορασμοῦ
  choice: продажей и покупкой
  rationale: Сохраняются конкретные названия двух сторон торговой сделки и лаконичный параллелизм греческого текста.
- source_word: συντριβήσεται
  choice: будет сокрушён
  rationale: Это прямое значение будущего пассива от συντρίβω — «сокрушать, разбивать, раздавливать». Контекст допускает образ греха, зажатого между сторонами сделки, но перевод не подменяет необычный греческий глагол более гладким «вклинится».
- source_word: ἁμαρτία
  choice: грех
  rationale: Передаёт нравственно-религиозную силу слова, не сужая его до нечестности лишь одного определённого вида.
theological_decisions:
- issue: Нравственная сила ἁμαρτία в изречении о торговле
  choice: грех
  alternative: неправда; проступок
  rationale: Текст говорит о нравственной опасности, связанной с куплей и продажей, но не ограничивает её конкретным торговым нарушением.
- issue: Необычный образ συντριβήσεται ἁμαρτία
  choice: будет сокрушён грех
  alternative: грех окажется зажат; грех вклинится
  rationale: Выбранное чтение следует засвидетельствованному греческому глаголу и сохраняет напряжение образа. Возможный контекстуальный смысл отмечен в сноске, а не внесён в основной текст.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная конструкция. Союз «а» подчёркивает сопоставление двух частей. Необычная пассивная формулировка второй части сохранена по греческому источнику и пояснена сноской.
