  text: If you pursue righteousness[a], you will attain it, and put it on like a robe of glory.
translation:
  language: ru
  text: Если будешь стремиться к праведности[a], то достигнешь её и облачишься в неё, как в одеяние славы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к тому, что справедливо»; возможный перевод: «к справедливости». Греческое выражение охватывает и личную праведность, и справедливые поступки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διώκῃς
  choice: будешь стремиться к
  rationale: Передаёт настойчивое, деятельное устремление к нравственной цели; по-русски естественнее буквального «преследовать».
- source_word: τὸ δίκαιον
  choice: праведность
  rationale: Субстантивированное прилагательное среднего рода обозначает праведное и справедливое как общее нравственное благо; «праведность» сохраняет абстрактный смысл и сочетается с образом одеяния.
- source_word: καταλήμψῃ
  choice: достигнешь
  rationale: В контексте стремления к нравственному благу выражает успешное достижение цели, сохраняя динамику исходного образа.
- source_word: ἐνδύσῃ αὐτό
  choice: облачишься в неё
  rationale: Естественно и выразительно передаёт медиальное значение глагола и сохраняет метафору надевания праведности.
- source_word: ποδήρη
  choice: одеяние
  rationale: Греческое слово указывает на длинную, доходящую до ног одежду; «одеяние» сохраняет достоинство образа без излишней конкретизации фасона.
- source_word: δόξης
  choice: славы
  rationale: Прямо сохраняет генитивную конструкцию и возвышенный смысл δόξα, допускающий оттенки славы и почёта.
theological_decisions:
- issue: Значение τὸ δίκαιον в контексте литературы мудрости
  choice: праведность
  alternative: то, что справедливо; справедливость
  rationale: Греческое выражение охватывает как личную нравственную правоту, так и справедливые поступки. Основной вариант сохраняет цельность метафоры, а примечание удерживает широту значения без конфессионального сужения.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Синтаксис сохраняет условную структуру и последовательность образов греческого текста; местоимение женского рода согласовано с «праведностью».
