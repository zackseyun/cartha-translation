  text: The speech of the godly is always wisdom[b][a], but the fool changes like the moon.
translation:
  language: ru
  text: Речь благочестивого всегда мудра, а глупец меняется, как луна.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сравнение с луной, вероятно, указывает на смену её фаз: глупец непостоянен.'
    reason: cultural_note
lexical_decisions:
- source_word: διήγησις
  choice: речь
  rationale: Существительное может означать рассказ, изложение или речь; здесь в контексте изречения естественно обозначает то, что говорит человек.
- source_word: εὐσεβοῦς
  choice: благочестивого
  rationale: Субстантивированное родительное единственного числа означает «благочестивого человека»; краткая форма сохраняет нравственно-религиозный смысл.
- source_word: διὰ παντός
  choice: всегда
  rationale: Идиома означает «во всякое время», «постоянно»; «всегда» естественно и лаконично.
- source_word: σοφία
  choice: мудра
  rationale: Греческий текст буквально ставит существительное «мудрость» в роли сказуемого. В русском выражение «речь ... всегда мудрость» неестественно, поэтому предикативное «мудра» передаёт смысл без добавления нового содержания.
- source_word: ἄφρων
  choice: глупец
  rationale: Обычное обозначение в литературе мудрости человека, лишённого разумения; «глупец» звучит ясно и афористично.
- source_word: ἀλλοιοῦται
  choice: меняется
  rationale: Глагол означает становиться иным, изменяться; выбран прямой современный эквивалент.
- source_word: ὡς σελήνη
  choice: как луна
  rationale: Сохраняется явное сравнение, вероятно отсылающее к смене лунных фаз.
theological_decisions: []
