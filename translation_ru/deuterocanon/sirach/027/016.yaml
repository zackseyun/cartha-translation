  text: Whoever reveals secrets destroys trust[b][a], and will never find a friend for his soul.
translation:
  language: ru
  text: Кто разглашает тайны[a], тот разрушает доверие и никогда не найдёт себе близкого друга[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокровенное», «доверенные тайны».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «друга для своей души»; то есть друга, по-настоящему близкого ему или подходящего ему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀποκαλύπτων
  choice: Кто разглашает
  rationale: Субстантивированное причастие настоящего времени выражает общее правило о человеке, для которого характерно такое действие. «Кто разглашает» естественно передаёт пословичный характер высказывания.
- source_word: μυστήρια
  choice: тайны
  rationale: В данном контексте речь идёт о доверенных личных сведениях, а не о богословских таинствах. «Тайны» — ясный и достаточно широкий русский эквивалент.
- source_word: ἀπώλεσεν
  choice: разрушает
  rationale: Греческий аорист представляет последствие как решительное и свершившееся; в русском общем изречении настоящее время звучит естественнее, а совершившийся результат раскрывается дальнейшим «никогда не найдёт».
- source_word: πίστιν
  choice: доверие
  rationale: Контекст разглашения тайн и утраты дружбы требует межличностного значения, а не богословского «вера».
- source_word: οὐ μὴ εὕρῃ
  choice: никогда не найдёт
  rationale: Сочетание οὐ μή с сослагательным наклонением выражает усиленное отрицание, направленное в будущее.
- source_word: φίλον
  choice: друга
  rationale: Обычный и точный эквивалент в контексте личной близости.
- source_word: πρὸς τὴν ψυχὴν αὐτοῦ
  choice: по душе
  rationale: Русское выражение «друг по душе» естественно передаёт мысль о друге, близком и подходящем самой душе человека, сохраняя образ души.
theological_decisions:
- issue: Значение πίστις в небогословском контексте книги Премудрости
  choice: доверие
  alternative: вера; верность; надёжность
  rationale: Стих говорит о разглашении тайн и его последствиях для дружбы. Поэтому межличностное «доверие» отражает контекст и не привносит неуместного догматического смысла.
- issue: Образ ψυχή в выражении о друге
  choice: друга по душе
  alternative: друга для своей души; близкого друга; друга, подходящего ему
  rationale: Выражение сохраняет образ души и одновременно понятно современному русскому читателю. Сноска отмечает буквальную форму и возможный смысловой диапазон.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Повтор «Кто… тот…» подчёркивает форму общего нравственного изречения; выражение «друг по душе» сохраняет достоинство и доступность текста.
