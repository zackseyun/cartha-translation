translation:
  language: ru
  text: Не хвали человека, пока не узнаешь, как он рассуждает[a], ведь это — проверка людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до рассуждения». Возможны также переводы: «прежде размышления» или «прежде чем станет известно его рассуждение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ λογισμοῦ
  choice: пока не узнаешь его рассуждений
  rationale: Буквально оборот означает «до рассуждения (мысли)». В контексте изречения речь о том, что суждение человека должно обнаружиться прежде, чем его станут хвалить; добавленные по смыслу слова «не узнаешь его» делают эту связь естественной по-русски, а буквальная форма отражена в сноске.
- source_word: μὴ ἐπαινέσῃς
  choice: не хвали
  rationale: μή с аористом сослагательного наклонения выражает запрещение; «не хвали» — прямой и естественный русский эквивалент.
- source_word: ἄνδρα
  choice: человека
  rationale: Хотя греческое слово имеет форму мужского рода, здесь оно употреблено в общем, пословичном смысле. Русское «человека» естественно передаёт этот смысл без неоправданного ограничения мужчинами.
- source_word: οὗτος
  choice: по ним
  rationale: Указательное местоимение отсылает к предшествующему «рассуждению». Русская конструкция «по ним» ясно выражает, что именно рассуждения служат средством проверки.
- source_word: πειρασμὸς ἀνθρώπων
  choice: испытываются люди
  rationale: πειρασμός здесь означает испытание или проверку, а не искушение. Глагольная русская конструкция естественно передаёт выражение «испытание людей», сохраняя возможный смысл проверки человеческого характера по рассуждениям.
