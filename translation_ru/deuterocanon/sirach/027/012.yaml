  text: Среди неразумных выжидай подходящего времени, а среди человека рассудительного пребывай постоянно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσυνέτων
  choice: неразумных
  rationale: Прилагательное в субстантивированном родительном множественного числа обозначает людей, лишённых разумения или рассудительности. «Неразумные» сохраняет и умственный, и нравственный оттенок, не сводя значение к грубой глупости.
- source_word: συντήρησον καιρόν
  choice: выжидай подходящего времени
  rationale: συντηρέω передаёт внимательное соблюдение или ожидание, а καιρός — подходящий, своевременный момент. «Выжидай подходящего времени» естественно выражает призыв к сдержанности и верному выбору момента.
- source_word: διανοουμένου
  choice: мыслящих
  rationale: Причастие от διανοέομαι обозначает того, кто размышляет и обдумывает. Хотя греческая форма стоит в единственном числе, параллель с собирательным множественным ἀσυνέτων допускает естественное по-русски обозначение класса людей во множественном числе.
- source_word: ἐνδελέχιζε
  choice: оставайся постоянно
  rationale: Глагол выражает продолжительность, постоянство или настойчивое пребывание. Перевод сохраняет длительный характер действия, не уточняя сверх текста, в чём именно состоит общение.
- source_word: εἰς μέσον ... εἰς μέσον δέ
  choice: среди ... а среди
  rationale: Буквально конструкция означает нахождение «посреди», но в социальном контексте естественное русское соответствие — «среди». Союз «а» ясно передаёт сопоставление двух типов окружения.
