base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/001.yaml
  text: For the sake of gain many have sinned[b][a], and whoever seeks to increase it will turn away his eye.
translation:
  language: ru
  text: Ради наживы[a] многие согрешили, и кто стремится умножить её, тот отведёт взгляд[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выгоды», «прибыли». Греческое слово здесь, вероятно, обозначает материальную выгоду.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «отведёт глаз». Образ указывает на сознательное нежелание замечать то, что следует видеть, однако сам греческий текст не уточняет объект.'
    reason: idiom_clarification
lexical_decisions:
- source_word: χάριν ἀδιαφόρου
  choice: ради наживы
  rationale: χάριν с родительным указывает на мотив. В данном изречении ἀδιάφορον, судя по параллельной мысли об умножении, означает материальную выгоду; «нажива» естественно передаёт также отрицательный нравственный оттенок контекста.
- source_word: πολλοὶ ἥμαρτον
  choice: многие согрешили
  rationale: Аорист сохранён простой формой прошедшего времени, которая по-русски может выражать обобщённое наблюдение.
- source_word: ὁ ζητῶν πληθῦναι
  choice: кто стремится умножить её
  rationale: Субстантивированное причастие передано обобщающей конструкцией «кто…». Местоимение «её» поясняет подразумеваемый объект — наживу, не меняя смысла эллипсиса.
- source_word: ἀποστρέψει ὀφθαλμόν
  choice: отведёт взгляд
  rationale: Сохранён образ намеренного уклонения от видимого, но употреблена естественная современная русская идиома; объект, от которого отводят взгляд, вслед за греческим текстом не уточняется.
theological_decisions:
- issue: Нравственный смысл заключительного образа
  choice: отведёт взгляд
  alternative: закроет глаза на неправду; отвернёт око
  rationale: Греческий текст подразумевает нравственный компромисс, но не называет того, что именно человек отказывается видеть. Образ сохранён без внесения более конкретного обвинения.
translation_notes:
  register: Современный литературный русский язык с краткой формой, соответствующей жанру нравственного изречения. «Нажива» понятно обозначает корыстную прибыль; образ заключительной части сохранён без архаичного «око».
