  yaml_path: translation/deuterocanon/sirach/027/020.yaml
  text: Do not pursue him[a], for he has gone far away[b], and has escaped like a gazelle from a snare.
translation:
  language: ru
  text: Не преследуй его, ведь он далеко ушёл и вырвался, словно газель[a] из западни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно косуля» или «антилопа». Греческое слово обозначает газель или близкое к ней животное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ αὐτὸν διώξῃς
  choice: Не гонись за ним
  rationale: διώκω здесь означает преследовать или гнаться за кем-либо; «не гонись» естественно передаёт образ погони, не привнося значения религиозного или враждебного преследования.
- source_word: μακρὰν ἀπέστη
  choice: он далеко удалился
  rationale: ἀφίστημι обозначает удаление или отход, а μακράν подчёркивает расстояние; совершенный вид передаёт уже состоявшееся удаление.
- source_word: ἐξέφυγεν
  choice: вырвался
  rationale: Глагол выражает успешное бегство из опасности; «вырвался» естественно сочетается с последующим образом животного, избежавшего западни.
- source_word: ὡς δορκὰς
  choice: словно газель
  rationale: δορκάς обозначает газель либо близкое к ней животное; «газель» — наиболее ясное современному читателю соответствие, сохраняющее образ стремительного бегства.
- source_word: ἐκ παγίδος
  choice: из западни
  rationale: παγίς — ловушка или западня; «западня» точно передаёт орудие ловли дикого животного и естественно звучит в данном сравнении.
