  text: When a sieve is shaken[a], the refuse remains; so a person's filth is revealed in his thoughts.
translation:
  language: ru
  text: При встряхивании решета остаётся сор; так и нечистота человека — в его рассуждении.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое слово, переведённое как «нечистота», может означать также «отбросы», «сор» или «испражнения». Вторая половина изречения в греческом тексте не имеет выраженного глагола; возможный смысл: нечистота человека остаётся или обнаруживается в его рассуждении.'
    reason: lexical_alternative_and_source_ambiguity
lexical_decisions:
- source_word: ἐν σείσματι κοσκίνου
  choice: при встряхивании решета
  rationale: Передаёт обстоятельственное значение греческого оборота естественным русским выражением и сохраняет образ просеивания.
- source_word: διαμενεῖ
  choice: остаётся
  rationale: Глагол обозначает то, что продолжает находиться на месте, остаётся после просеивания.
- source_word: κοπρία
  choice: сор
  rationale: В контексте решета речь идёт о грубом остатке или отходах. «Сор» естественно передаёт этот образ, не сужая значение до навоза.
- source_word: σκύβαλα
  choice: нечистота
  rationale: Грубое слово может обозначать отбросы, нечистоты или испражнения. «Нечистота» сохраняет отталкивающий образ и допускает нравственное применение к человеку.
- source_word: ἀνθρώπου
  choice: человека
  rationale: В русском языке «человек» естественно передаёт родовое значение греческого существительного мужского рода.
- source_word: ἐν λογισμῷ αὐτοῦ
  choice: в его рассуждении
  rationale: λογισμός может означать мысль, размышление или рассуждение. Единственное число и процесс осмысления переданы без сведения значения только к отдельным мыслям.
theological_decisions:
- issue: Связь образа просеивания с внутренней жизнью человека
  choice: 'Сохранена эллиптическая конструкция: «нечистота человека — в его рассуждении»'
  alternative: «нечистота человека обнаруживается в его мыслях»
  rationale: В греческой второй части нет отдельного глагола «обнаруживается». Тире сохраняет напряжённую краткость поговорки и не превращает подразумеваемую связь в явное утверждение.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Сохранён резкий образ исходного текста, но выбраны слова, понятные обычному читателю; эллипсис второй части обозначен тире.
