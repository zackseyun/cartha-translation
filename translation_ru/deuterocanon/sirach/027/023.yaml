  text: Before your eyes his mouth speaks sweetly[a], and he will marvel at your words; but afterward he will twist his mouth and, in regard to your words, he will cause offense.
translation:
  language: ru
  text: В твоём присутствии он будет говорить сладко[a] и восхищаться твоими словами; но потом исказит свою речь и из-за твоих слов даст повод к преткновению.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «усладит твои уста». В греческом тексте стоит «твои уста», хотя по контексту, вероятно, имеются в виду его собственные уста, то есть его льстивая речь в твоём присутствии.'
    reason: textual_and_lexical_difficulty
  - marker: b
    text: 'Или: «в связи с твоими словами даст повод к преткновению»; возможно также: «использует твои слова, чтобы поставить тебе препятствие». Греческое σκάνδαλον означает преткновение, западню либо причину падения или вреда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέναντι τῶν ὀφθαλμῶν σου
  choice: В твоём присутствии
  rationale: Передаёт греческую идиому как происходящее непосредственно перед человеком; по-русски звучит естественнее буквального «перед твоими глазами».
- source_word: γλυκανεῖ στόμα σου
  choice: он будет говорить сладко
  rationale: Греческий текст буквально говорит об услаждении уст; русский оборот сохраняет образ льстивой сладости речи без неестественной буквальности. Форму σου после στόμα контекстуально следует понимать как текстовую трудность, поскольку дальнейшее αὐτοῦ ясно указывает на уста другого человека.
- source_word: ἐκθαυμάσει
  choice: восхищаться
  rationale: Передаёт усиленное, внешне выраженное удивление или одобрение, уместное в контексте лести.
- source_word: διαστρέψει τὸ στόμα αὐτοῦ
  choice: исказит свою речь
  rationale: Смысловой перевод буквального образа «искривит свои уста»; сохраняет представление о переходе к лживой или враждебной речи.
- source_word: ἐν τοῖς λόγοις σου δώσει σκάνδαλον
  choice: обратит твои же слова тебе во преткновение
  rationale: 'Сохраняет причинное значение δώσει и допускаемое ἐν указание на средство: чужие слова используются во вред говорившему. «Преткновение» удерживает образ σκάνδαλον, не сводя его только к обиде.'
