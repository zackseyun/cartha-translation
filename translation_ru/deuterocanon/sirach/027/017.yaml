  text: Cherish a friend and be faithful to him; but if you reveal his secrets[a], you will certainly not pursue after him.
translation:
  language: ru
  text: Дорожи другом и будь ему верен; но если выдашь его тайны, то уж точно не погонишься за ним.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то ни в коем случае не гонись за ним». Греческие слова можно понять либо как указание на последствие, либо, что менее вероятно, как запрет.'
    reason: alternative_reading
lexical_decisions:
- source_word: στέργον
  choice: Дорожи
  rationale: Императив στέργω выражает тёплую, устойчивую привязанность. «Дорожи» естественно передаёт и любовь, и верность дружеской связи, не сводя смысл к общему «люби».
- source_word: φίλον
  choice: другом
  rationale: Существительное обозначает друга как объект привязанности; неопределённость греческой формы в русском обобщённо-притчевом высказывании естественно передаётся без местоимения.
- source_word: πιστώθητι μετʼ αὐτοῦ
  choice: будь ему верен
  rationale: Форма πιστώθητι призывает проявить себя верным и надёжным, а сочетание с μετά описывает отношение к другу. «Будь ему верен» звучит естественно по-русски и сохраняет личностный характер верности.
- source_word: ἀποκαλύψῃς
  choice: выдашь
  rationale: В контексте доверенных сведений глагол означает раскрыть скрытое. «Выдашь» ясно передаёт предательское разглашение чужой тайны.
- source_word: τὰ μυστήρια αὐτοῦ
  choice: его тайны
  rationale: Здесь μυστήρια — доверенные личные сведения, а не обязательно религиозные таинства или мистерии.
- source_word: οὐ μὴ καταδιώξῃς ὀπίσω αὐτοῦ
  choice: то уже не погонишься за ним
  rationale: Оборот οὐ μή с конъюнктивом выражает усиленное отрицание, а καταδιώκω с ὀπίσω сохраняет образ погони вслед за удалившимся другом. Частица «уже» естественно обозначает последствие нарушенного доверия, не добавляя прямо отсутствующего в тексте глагола «догнать».
theological_decisions:
- issue: Смысл и модальность заключительной части после разглашения тайны друга
  choice: 'Притчевое предсказание последствия: «то уже не погонишься за ним»'
  alternative: 'Запрет: «то ни в коем случае не гонись за ним»'
  rationale: Сочетание οὐ μή с формой второго лица допускает восприятие как решительного утверждения о будущем последствии, хотя возможно и запретительное прочтение. Основной текст следует более естественному в данном контексте предсказательному пониманию, а примечание сохраняет реальную грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем наставления. Лексика понятна широкому читателю; образ погони сохранён без пояснительного расширения в основном тексте.
