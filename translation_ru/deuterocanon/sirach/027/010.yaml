  text: A lion lies in wait for prey[a]; so sins do for those who practice injustice.
translation:
  language: ru
  text: Лев подстерегает добычу[a] — так и грехи подстерегают тех, кто совершает несправедливые дела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Лев устраивает засаду на добычу; так и грехи — на тех, кто совершает несправедливые дела».'
    reason: Лексическая альтернатива для ἐνεδρεύει и более буквальная передача эллипсиса во второй части.
lexical_decisions:
- source_word: λέων
  choice: лев
  rationale: Единственное число без артикля имеет обобщённый, пословичный смысл; в русском языке форма «лев» естественно выражает общее наблюдение.
- source_word: θήραν
  choice: добычу
  rationale: Существительное обозначает объект охоты; «добыча» сохраняет ясный образ хищника.
- source_word: ἐνεδρεύει
  choice: подстерегает
  rationale: Глагол означает устраивать засаду или ждать в засаде. «Подстерегает» естественно передаёт направленность действия на добычу и позволяет сохранить подразумеваемый повтор глагола во второй части.
- source_word: οὕτως
  choice: так и
  rationale: Кратко и естественно вводит вторую часть сравнения.
- source_word: ἁμαρτίαι
  choice: грехи
  rationale: Сохранено прямое значение греческого существительного во множественном числе и его олицетворение.
- source_word: ἐργαζομένους
  choice: тех, кто совершает
  rationale: Причастие обозначает людей, занятых соответствующими поступками; оборот звучит ясно и современно.
- source_word: ἄδικα
  choice: несправедливые дела
  rationale: Субстантивированное среднее множественное число буквально указывает на несправедливые поступки или дела; перевод сохраняет конкретность формы и нравственный смысл.
theological_decisions:
- issue: Олицетворение ἁμαρτίαι
  choice: грехи сами изображены как хищники, подстерегающие совершающих несправедливость
  alternative: последствия или наказания за грехи подстерегают виновных
  rationale: В греческом тексте прямо сказано «грехи», а не «последствия» или «наказания». Образ и его богословское напряжение сохранены без поясняющего истолкования.
translation_notes:
  register: Современный литературный русский язык с кратким, выразительным строем изречения. Повтор «подстерегают» делает подразумеваемый греческий глагол явным и сохраняет параллелизм; тире подчёркивает сравнение.
