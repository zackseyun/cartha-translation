translation:
  language: ru
  text: Схватка гордецов — кровопролитие[a], а их оскорбительная речь тяжела для слуха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Битва гордецов — пролитие крови, а их поношение — дурная молва». Греческие слова допускают более буквальное понимание «битва» и «молва/весть», тогда как основной текст передаёт наиболее вероятный смысл в контексте наставления о поведении.'
    reason: Лексическая неоднозначность слов μάχη и ἀκοή.
lexical_decisions:
- source_word: ἔκχυσις αἵματος
  choice: кровопролитие
  rationale: Сочетание буквально означает «пролитие крови»; «кровопролитие» естественно и точно передаёт греческую идиому.
- source_word: μάχη
  choice: ссора
  rationale: Слово может обозначать битву, схватку или ссору. В контексте нравственного изречения «ссора» естественно передаёт межличностный конфликт, не исключая его насильственного исхода.
- source_word: ὑπερηφάνων
  choice: гордецов
  rationale: Субстантивированное прилагательное характеризует надменных, высокомерных людей; «гордецы» кратко сохраняет нравственную оценку.
- source_word: διαλοιδόρησις
  choice: брань
  rationale: Существительное обозначает поношение, ругань или оскорбительную перебранку. «Брань» передаёт словесную агрессию и соответствует достоинству стиля.
- source_word: ἀκοὴ μοχθηρά
  choice: тяжела для слуха
  rationale: ἀκοή может значить как «слух/слышание», так и «молва/весть», а μοχθηρά — «дурная, тягостная». Основной текст естественно выражает тягостность слышимой брани, не превращая выражение в техническое обозначение сообщения.
theological_decisions:
- issue: Связь гордости с насилием и пагубной речью
  choice: 'Передать стих как мудрое наблюдение: ссора гордецов оборачивается кровопролитием, а их брань мучительна для слушающих.'
  alternative: 'Более буквально: «Битва гордецов — пролитие крови, и их поношение — дурная молва».'
  rationale: Греческий текст параллельно описывает насильственный конфликт и оскорбительную речь. Формулировка не вводит конфессионального толкования и сохраняет нравственное напряжение изречения.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и достойная формулировка. Слово «брань» сохраняет возвышенность библейского регистра, оставаясь понятным по контексту.
