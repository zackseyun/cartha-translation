base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/027/029.yaml
  text: Those who rejoice at the fall of the godly will be caught in a trap[a], and pain will consume them before their death.
translation:
  language: ru
  text: Те, кто радуется падению благочестивых[a], попадутся в западню, и страдание поглотит их ещё до смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «набожных» или «почитающих Бога». Греч. εὐσεβῶν.
    reason: lexical_alternative
lexical_decisions:
- source_word: παγίδι
  choice: в западню
  rationale: Дательный падеж обозначает ловушку, в которой оказываются схваченными; «западня» ясно и естественно передаёт образ в современном русском языке.
- source_word: ἁλώσονται
  choice: попадутся
  rationale: Будущая пассивная форма означает «будут пойманы». В сочетании с «западней» русское «попадутся в западню» естественно сохраняет смысл и образ.
- source_word: οἱ εὐφραινόμενοι
  choice: те, кто радуется
  rationale: Субстантивированное причастие настоящего времени обозначает людей, испытывающих радость или удовольствие; конструкция естественна для современного русского языка.
- source_word: πτώσει
  choice: падению
  rationale: 'Прямой эквивалент πτῶσις сохраняет возможный широкий смысл: падение, поражение или несчастье, не уточняя его без основания.'
- source_word: εὐσεβῶν
  choice: благочестивых
  rationale: Слово обозначает почитающих Бога, набожных людей. «Благочестивые» сохраняет нравственно-религиозный смысл и достоинство стиля.
- source_word: ὀδύνη
  choice: страдание
  rationale: ὀδύνη может обозначать боль, мучение или тяжёлую скорбь. «Страдание» сохраняет неоднозначность между телесной и душевной болью.
- source_word: καταναλώσει
  choice: поглотит
  rationale: Глагол означает «истреблять, поглощать, изводить». «Поглотит» сохраняет сильную метафору исходного текста.
- source_word: πρὸ τοῦ θανάτου αὐτῶν
  choice: ещё до смерти
  rationale: Передаёт временное значение оборота «до их смерти»; частица «ещё» естественно подчёркивает, что страдание настигнет их прежде смерти, не меняя смысла.
theological_decisions:
- issue: Передача εὐσεβῶν в литературе мудрости
  choice: благочестивых
  alternative: набожных; почитающих Бога
  rationale: «Благочестивые» обозначает людей, чья жизнь отмечена почитанием Бога, не сужая понятие до конфессиональной или позднейшей богословской категории.
translation_notes:
  register: Современный литературный русский язык с кратким, выразительным построением. Сохранены образ западни, широкое значение страдания и напряжённая метафора поглощения. Маркер сноски поставлен непосредственно после слова, к которому относится.
