  text: Resentment and anger—these also are abominations[b][a], and a sinful man will cling to them.
translation:
  language: ru
  text: Злопамятство[a] и гнев — также мерзости, и грешный человек будет крепко держаться за них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мстительный гнев». Греческое Μῆνις может означать глубокий, долго не проходящий или мстительный гнев, тогда как ὀργή — более общее слово для гнева.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будет владеющим ими» или «будет иметь власть над ними». Выражение допускает разные толкования; здесь оно понято в том смысле, что грешный человек упорно удерживает эти пороки и не расстаётся с ними.'
    reason: alternative_reading
lexical_decisions:
- source_word: Μῆνις
  choice: злопамятство
  rationale: Слово обозначает глубокий, длительный, нередко мстительный гнев. «Злопамятство» передаёт устойчивую враждебность и отличает её от более общего ὀργή.
- source_word: ὀργή
  choice: гнев
  rationale: Обычное обозначение гнева; естественный и достаточно весомый русский эквивалент.
- source_word: βδελύγματα
  choice: мерзость
  rationale: Передаёт сильную нравственно-религиозную оценку того, что отвратительно. Конструкция «и то и другое» естественно обобщает два названных порока, хотя в греческом употреблено множественное число.
- source_word: ἀνὴρ ἁμαρτωλός
  choice: грешный человек
  rationale: По-русски это естественнее архаичного «грешный муж»; форма единственного числа сохраняет образ отдельного мужчины/человека, не превращая его во множественное обобщение.
- source_word: ἐγκρατὴς ἔσται αὐτῶν
  choice: будет крепко держаться за них
  rationale: 'Буквальная конструкция трудна: ἐγκρατής с родительным обычно выражает власть или твёрдое владение. В отрицательном контексте речь, вероятнее всего, об упорном удержании этих пороков; перевод сохраняет образ крепкой хватки, не устраняя неоднозначность без примечания.'
theological_decisions:
- issue: Смысл ἐγκρατὴς в контексте осуждаемых страстей
  choice: будет крепко держаться за них
  alternative: будет владеть ими / будет сдерживать их
  rationale: Обычное положительное значение «владеющий собой, воздержанный» здесь создаёт смысловое напряжение с осуждением злопамятства и гнева. Контекст поддерживает понимание «удерживать у себя, не отпускать», но грамматическая трудность отмечена в сноске.
- issue: Передача ἀνήρ
  choice: грешный человек
  alternative: грешный муж / грешник
  rationale: Греческое слово имеет мужскую форму единственного числа. «Человек» в данном русском предложении также стоит в мужском роде и звучит современно, тогда как «муж» приобрёл бы ненужную архаичность или значение супруга.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. «Злопамятство» ясно отличено от общего «гнева»; союз «однако» делает явным заложенный в греческом καί смысловой контраст. Трудное выражение в конце переведено естественно, а его подлинная неоднозначность сохранена в примечании.
