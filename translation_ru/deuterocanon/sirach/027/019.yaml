  text: And as a bird from your hand you have let go[a], so you have let your neighbor go, and you will not catch him.
translation:
  language: ru
  text: И как птицу ты выпустил из своей руки, так отпустил и ближнего — и не поймаешь его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будешь охотиться за ним». Греческий глагол содержит образ охоты.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πετεινὸν
  choice: птицу
  rationale: Общее обозначение птицы; естественно передаёт образ без архаизации.
- source_word: ἐκ χειρός σου
  choice: из руки
  rationale: Сохраняет конкретный образ птицы, выпущенной из руки; принадлежность руки адресату ясна из формы второго лица.
- source_word: ἀπέλυσας
  choice: ты выпустил
  rationale: В отношении птицы «выпустил» естественно выражает освобождение из руки.
- source_word: ἀφῆκας
  choice: отпустил
  rationale: Параллельно первому глаголу передаёт прекращение удерживания или связи, не привнося значения прощения.
- source_word: τὸν πλησίον
  choice: ближнего
  rationale: Обычное для библейской литературы обозначение человека, состоящего с адресатом в близких общественных отношениях.
- source_word: οὐ θηρεύσεις
  choice: не поймаешь
  rationale: Передаёт итог охоты и естественно продолжает сравнение с выпущенной птицей; охотничий оттенок отмечен в сноске.
theological_decisions:
- issue: Передавать ли последний глагол явным образом охоты или обозначить её результат
  choice: не поймаешь его
  alternative: не выследишь его
  rationale: Греческий θηρεύω содержит образ охоты, однако в пословице главное — невозможность вновь обрести отпущенного ближнего. Основной вариант сохраняет образ и звучит естественно, а альтернатива документирует охотничий оттенок.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным звучанием мудрого изречения. Параллелизм двух действий сохранён посредством «как… так…», а тире подчёркивает итог, не устраняя смысловой напряжённости образа.
