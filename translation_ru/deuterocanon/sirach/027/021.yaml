lexical_decisions:
- source_word: τραῦμά
  choice: рану
  rationale: Сохраняет конкретный образ телесной раны, на котором строится противопоставление неисцелимому ущербу от разглашения тайны.
- source_word: καταδῆσαι
  choice: можно перевязать
  rationale: Глагол означает обвязать или перевязать рану; безличная конструкция естественно передаёт греческое выражение возможности.
- source_word: λοιδορίας
  choice: оскорблений
  rationale: Обозначает брань, поношение или оскорбительные слова; выбран ясный современный эквивалент.
- source_word: διαλλαγή
  choice: примирение
  rationale: Передаёт восстановление отношений после ссоры или вражды.
- source_word: ἀποκαλύψας
  choice: раскрывший
  rationale: Аористное причастие обозначает совершённое разглашение; форма «раскрывший» кратко и естественно сохраняет эту завершённость.
- source_word: μυστήρια
  choice: тайны
  rationale: В данном контексте речь идёт о доверенных сокровенных сведениях, а не о богословских таинствах.
- source_word: ἀφήλπισεν
  choice: лишился надежды
  rationale: 'Сохраняет неопределённость греческого глагола: прямо не сказано, на что именно утрачена надежда.'
theological_decisions:
- issue: Смысл заключительной фразы ὁ δὲ ἀποκαλύψας μυστήρια ἀφήλπισεν
  choice: Раскрывший тайны лишился надежды, без уточнения её предмета.
  alternative: Раскрывший тайны сам отчаялся; либо для него уже нет надежды.
  rationale: Контекст указывает прежде всего на утрату надежды восстановить доверие и отношения, однако греческий текст не называет предмет надежды. Перевод сохраняет эту смысловую напряжённость, а пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма сохранена. Лексика ясная и достойная, без конфессионально окрашенных уточнений.
