translation:
  language: ru
  text: Рану можно перевязать, и после оскорблений возможно примирение; но раскрывший тайны утратил надежду.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для него уже нет надежды»; или: «он отчаялся». В греческом тексте не уточняется, какой именно надежды он утратил; по контексту, вероятнее всего, речь о надежде восстановить доверие после разглашения доверенных тайн.'
