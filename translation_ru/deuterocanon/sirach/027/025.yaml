  rationale: δολία обозначает обманный, вероломный характер удара; «коварный» кратко и точно сохраняет нравственную окраску.
- source_word: διελεῖ τραύματα
  choice: рассекает раны
  rationale: Сохраняет образ разделения или рассечения, выраженный διελεῖ, и не сглаживает необычное сочетание с τραύματα.
