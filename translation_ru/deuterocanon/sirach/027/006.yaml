  yaml_path: translation/deuterocanon/sirach/027/006.yaml
  text: The fruit shows the cultivation of a tree[a]; so a man's reasoning shows the inclination of his heart.
translation:
  language: ru
  text: Плод показывает, как ухаживали за деревом; так и рассуждение человека обнаруживает его внутренний склад.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально: «По возделыванию дерева — его плод; так и рассуждение — по внутренней склонности одного [человека]». Краткий синтаксис допускает передачу связи как признака: плод обнаруживает возделывание, а рассуждение — внутренний склад человека. В греческой параллели: «Возделывание дерева обнаруживает его плод; так и слово — помышление сердца человека».'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲבֹדַת עֵץ
  choice: уход за деревом
  rationale: Сочетание буквально означает «работа/служение дереву», но в земледельческом образе обозначает возделывание дерева или заботу о нём. Греческое γεώργιον ξύλου подтверждает этот смысл. «Уход за деревом» естественно звучит по-русски.
- source_word: פֶרִי
  choice: плод
  rationale: Обычное обозначение плода дерева; сохраняет как прямой земледельческий образ, так и переносный смысл пословицы.
- source_word: חֶשְׁבּוֹן
  choice: рассуждения
  rationale: Слово может означать счёт, расчёт, обдумывание или рассуждение. Здесь оно сопоставлено с внутренним יֵצֶר человека; множественное «рассуждения» естественно передаёт проявления его образа мыслей, не отождествляя слово исключительно с речью.
- source_word: יֵצֶר
  choice: внутренний склад
  rationale: Слово обозначает сформированную направленность, побуждение или расположение внутреннего человека. «Внутренний склад» передаёт антропологический смысл без привнесения позднейшей конфессиональной терминологии.
- source_word: אֶחָד
  choice: человека
  rationale: Буквально «одного»; в данном контексте имеется в виду отдельный человек. Греческая параллель прямо содержит ἀνθρώπου, «человека».
theological_decisions:
- issue: Связь внешнего проявления с внутренним складом человека
  choice: как внутренний склад человека соотносится с его рассуждениями
  alternative: слово обнаруживает помышление сердца человека
  rationale: Еврейский текст ставит חֶשְׁבּוֹן в соответствие с יֵצֶר, не употребляя явно ни «слово», ни «сердце». Поэтому основной текст следует еврейскому свидетельству, а более явное указание греческой параллели на речь и сердце сохраняется в примечании.
- issue: Родовое обозначение человека
  choice: человека
  alternative: мужчины / его
  rationale: Еврейское אֶחָד означает здесь отдельного человека, а греческое ἀνθρώπου имеет общий антропологический смысл. Русское «человека» точно передаёт родовое значение без мужской исключительности.
translation_notes:
  register: Современный литературный русский язык; краткая симметричная форма русской пословицы передаёт параллелизм оригинала. Выражение «внутренний склад» понятно широкому читателю и сохраняет смысл יֵצֶר без узкоконфессиональных оттенков.
