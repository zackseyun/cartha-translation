lexical_decisions:
- source_word: καθὼς γὰρ
  choice: Ибо как
  rationale: «Ибо» сохраняет пояснительную связь с контекстом, а «как» вводит сопоставление, продолженное словами «так и».
- source_word: ἀπώλεσεν / ἀπώλεσας
  choice: погубил / погубил
  rationale: Повтор одного сильного глагола передаёт намеренный повтор ἀπόλλυμι и не смягчает образ до простого прекращения отношений.
- source_word: ἄνθρωπος
  choice: человек
  rationale: В изречении слово употреблено обобщённо; русское «человек» естественно сохраняет единственное число и не делает биологический пол смысловым акцентом.
- source_word: τὸν ἐχθρὸν αὐτοῦ
  choice: своего врага
  rationale: Возвратное «своего» естественно по-русски соотносит врага с подлежащим «человек».
- source_word: οὕτως
  choice: так и
  rationale: Естественно завершает русскую сравнительную конструкцию «как… так и…».
- source_word: τὴν φιλίαν
  choice: дружбу
  rationale: Передаёт конкретные дружеские отношения; русский язык не требует воспроизводить греческий артикль отдельным средством.
- source_word: τοῦ πλησίον
  choice: с ближним
  rationale: Такое управление естественно выражает отношения дружбы по-русски, при этом неоднозначность греческого родительного падежа отмечена в сноске.
theological_decisions:
- issue: Обобщённое обозначение человека в изречении
  choice: человек
  alternative: мужчина / кто-либо
  rationale: ἄνθρωπος здесь имеет обобщённый смысл. «Человек» точно и естественно передаёт его, не внося отсутствующего в контексте акцента на поле.
- issue: Сила образа разрушенных отношений
  choice: погубил дружбу
  alternative: разрушил дружбу / прекратил дружбу
  rationale: Сильный глагол «погубил» сохраняет соответствие повторённому ἀπόλλυμι и резкость сопоставления с погибелью врага.
- issue: Неоднозначность τοῦ πλησίον
  choice: дружбу с ближним
  alternative: дружбу ближнего
  rationale: Основной текст выбран ради ясного современного русского синтаксиса; возможное понимание родительного падежа как дружбы, принадлежащей ближнему или исходящей от него, не устранено, а вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с краткой, ритмичной формой изречения. Сохранены прямое обращение на «ты», параллелизм двух частей и сильный повтор глагола.
