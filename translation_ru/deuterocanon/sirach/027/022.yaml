  text: One who winks with the eye devises evil things[a], and no one will turn him away from them.
translation:
  language: ru
  text: Кто подмигивает, замышляет зло, и никто не отвратит его от этого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «от него» или «от этого». Вероятно, имеется в виду зло, которое он замышляет.'
    reason: Сохранена неоднозначность местоимения ἀπʼ αὐτοῦ в единственном числе.
lexical_decisions:
- source_word: διανεύων ὀφθαλμῷ
  choice: Кто подмигивает
  rationale: Причастие διανεύων обозначает подачу знака или жест; в сочетании с инструментальным ὀφθαλμῷ речь естественно понимается как тайный знак глазом. «Подмигивает» кратко и естественно передаёт этот смысл.
- source_word: τεκταίνει
  choice: замышляет
  rationale: Глагол буквально связан с изготовлением или созданием, а в данном нравственном контексте означает обдуманное устроение, планирование зла.
- source_word: κακά
  choice: зло
  rationale: Субстантивированное множественное число имеет широкий смысл — злые дела или намерения. Русское собирательное «зло» сохраняет нравственную силу выражения без неоправданного уточнения.
- source_word: οὐδεὶς
  choice: никто
  rationale: Прямое и естественное соответствие греческому отрицательному местоимению.
- source_word: ἀποστήσει
  choice: не отвратит его
  rationale: Форма будущего времени передаёт побуждение отступить или удаление от избранного пути; «отвратит» здесь означает «заставит отказаться» и соответствует возвышенному, но понятному библейскому регистру.
- source_word: ἀπʼ αὐτοῦ
  choice: от этого
  rationale: Греческое местоимение стоит в единственном числе и буквально означает «от этого/него». Перевод сохраняет число и подлинную референциальную неоднозначность, связывая выражение с замышляемым злом или самим таким поведением.
