  text: Кто роет яму, тот упадёт в неё, и кто ставит западню, тот попадётся в ней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀρύσσων
  choice: кто роет
  rationale: Субстантивированное причастие настоящего времени выражает обобщённого деятеля; конструкция «кто…, тот…» естественно передаёт пословичный характер фразы.
- source_word: βόθρον
  choice: яму
  rationale: «Яма» точно и естественно передаёт образ выкопанной ловушки; варианты «ров» и «углубление» здесь менее уместны.
- source_word: εἰς αὐτὸν
  choice: в неё
  rationale: Местоимение по смыслу отсылает к βόθρον; женский род русского слова «яма» требует формы «неё».
- source_word: ἐμπεσεῖται
  choice: упадёт
  rationale: Будущая форма ἐμπίπτω означает падение внутрь; направление уже выражено сочетанием «в неё».
- source_word: ὁ ἱστῶν
  choice: кто ставит
  rationale: В сочетании с παγίς глагол обозначает установку ловушки; «ставит» — современная и точная русская коллокация.
- source_word: παγίδα
  choice: западню
  rationale: «Западня» сохраняет конкретный и литературный образ ловушки, а также поддерживает возвышенный, но понятный регистр.
- source_word: ἐν αὐτῇ
  choice: в неё
  rationale: Местоимение отсылает к παγίδα; перевод сохраняет параллелизм с первой половиной стиха.
- source_word: ἁλώσεται
  choice: попадётся
  rationale: Будущий пассив ἁλίσκομαι в контексте ловушки означает «быть пойманным»; «попадётся в западню» звучит естественно и сохраняет образ.
