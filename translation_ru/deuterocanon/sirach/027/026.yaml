  source_fidelity: 'Первое полустишие передано точно: βόθρον — «яма», εἰς αὐτόν — «в неё», ἐμπεσεῖται — «упадёт». Во втором полустишии требуется исправление управления: ἐν αὐτῇ означает «в ней», а не «в неё».'
