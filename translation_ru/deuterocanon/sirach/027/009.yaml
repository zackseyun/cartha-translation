  text: Birds settle with their own kind[b][a], and truth returns to those who practice it.
translation:
  language: ru
  text: Птицы находят пристанище среди себе подобных, и истина возвращается к тем, кто воплощает её в жизнь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к тем, кто делает (осуществляет) её». Греческий текст говорит об истине как о том, что осуществляют на деле, и олицетворяет её как возвращающуюся к таким людям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πετεινὰ
  choice: Птицы
  rationale: Средний род множественного числа обычно обозначает птиц вообще; это естественное и точное соответствие в русском языке.
- source_word: πρὸς τὰ ὅμοια αὐτοῖς
  choice: с подобными себе
  rationale: Передаёт сходство и взаимное тяготение, сохраняя обобщённую форму греческого выражения и не сужая её до биологического «своего вида».
- source_word: καταλύσει
  choice: селятся
  rationale: Глагол может означать останавливаться, располагаться на отдых или находить пристанище. «Селятся» естественно сочетается с образом птиц и сохраняет смысл пребывания среди подобных.
- source_word: ἀλήθεια
  choice: истина
  rationale: Сохраняет широту греческого существительного и его олицетворение; «правдивость» неоправданно сузила бы смысл до качества человека.
- source_word: πρὸς τοὺς ἐργαζομένους αὐτὴν
  choice: к тем, кто поступает по ней
  rationale: ἐργάζομαι с прямым дополнением означает делать, осуществлять, претворять на деле. Русское выражение показывает, что речь идёт не только о признании истины, но и о жизни в согласии с ней.
- source_word: ἐπανήξει
  choice: возвращается
  rationale: Передаёт значение возвращения или прихода вновь и сохраняет образ нравственной взаимности в изречении.
theological_decisions:
- issue: Олицетворение истины и нравственная взаимность
  choice: Истина «возвращается» к поступающим по ней.
  alternative: Истина приходит к тем, кто её исполняет.
  rationale: Греческое ἐπανήξει обозначает именно возвращение, а не просто приход. Такое чтение сохраняет олицетворение истины и напряжённую образность исходного текста, не объясняя механизм этой взаимности.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная форма мудрого изречения. Образ птиц и олицетворение истины сохранены без конфессионального истолкования.
