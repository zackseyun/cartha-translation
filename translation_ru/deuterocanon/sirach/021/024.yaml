  source_fidelity: 'Текст точно передаёт основное противопоставление греческого оригинала: слушание у двери названо проявлением ἀπαιδευσία («невоспитанности», отсутствия должного воспитания), а благоразумный человек представлен как тяготящийся ἀτιμία («бесчестьем/позором»). Инфинитив ἀκροᾶσθαι сохранён нейтральным «слушать», без преждевременной подстановки «подслушивать». Будущее βαρυνθήσεται адекватно выражено формой «будет тяготиться».'
