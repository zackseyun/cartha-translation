  text: It is a man's lack of discipline to listen at a door[a], but a prudent man will be burdened by disgrace.
translation:
  language: ru
  text: Слушать у двери[a] — признак невоспитанности; благоразумный же будет тяготиться бесчестием.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слушать у двери»; выражение подразумевает подслушивание, не называя его прямо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαιδευσία
  choice: невоспитанность
  rationale: Слово обозначает отсутствие должного воспитания и обучения, проявляющееся в непристойном поведении; «невоспитанность» естественно передаёт здесь нравственно-социальный оттенок.
- source_word: ἀνθρώπου
  choice: признак невоспитанности
  rationale: Родительный падеж указывает на свойство человека вообще. В русском обобщённое значение естественно выражено без тяжеловесного «невоспитанность человека».
- source_word: ἀκροᾶσθαι
  choice: слушать
  rationale: Инфинитив буквально означает «слушать». В сочетании с упоминанием двери подразумевается подслушивание, но этот вывод не вносится прямо в основной текст.
- source_word: παρὰ θύραν
  choice: у двери
  rationale: παρά с винительным здесь передаёт положение возле двери; «у двери» сохраняет конкретный образ и естественно звучит по-русски.
- source_word: φρόνιμος
  choice: благоразумный
  rationale: Слово обозначает человека, обладающего практической мудростью и здравым рассуждением; «благоразумный» сохраняет эту смысловую противоположность невоспитанности.
- source_word: βαρυνθήσεται
  choice: будет тяготиться
  rationale: Будущее пассивное передаёт образ отягощения. «Будет тяготиться» сохраняет метафору тяжести и естественно сочетается с причиной в творительном падеже.
- source_word: ἀτιμίᾳ
  choice: бесчестием
  rationale: Дательный падеж может обозначать причину или средство отягощения. «Бесчестье» передаёт общественно-нравственный смысл утраты чести, не сводя его только к внутреннему чувству стыда.
