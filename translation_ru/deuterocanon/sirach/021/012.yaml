lexical_decisions:
- source_word: οὐ παιδευθήσεται
  choice: не примет наставления
  rationale: Будущее страдательное от παιδεύω обозначает обучение, воспитание или исправительное наставление. Русское «не примет наставления» естественно передаёт неспособность воспользоваться наставлением, не сужая смысл до наказания или формального образования.
- source_word: ὃς
  choice: кто … тот
  rationale: Относительное местоимение обозначает любого человека; русская обобщающая конструкция «кто … тот» звучит естественно и не добавляет отсутствующего в греческом уточнения.
- source_word: οὐκ ἔστιν
  choice: не обладает
  rationale: В сочетании с обозначением качества связка естественно передаётся по-русски глаголом обладания; буквальное «не является» здесь было бы тяжеловесным.
- source_word: πανοῦργος
  choice: обладает житейской сметкой
  rationale: πανοῦργος может означать находчивого, сметливого или хитрого человека. В данном изречении качество представлено как необходимое для усвоения наставления, поэтому «житейская сметка» сохраняет практическую остроту слова, не приписывая ему однозначно порочного смысла.
theological_decisions:
- issue: Нравственная окраска πανοῦργος в изречении мудрости
  choice: 'Передать слово в относительно нейтрально-положительном смысле: «обладает житейской сметкой».'
  alternative: «не хитёр»; «не сметлив»; «не обладает проницательностью»
  rationale: Связь этого качества со способностью принять наставление делает сугубо отрицательное «хитрый» маловероятным, однако греческое слово сохраняет оттенок практической изворотливости. Выбранный вариант не превращает его ни в нравственную добродетель, ни в порок.
translation_notes:
  register: Современный литературный русский язык; краткая форма афоризма сохранена. «Житейская сметка» понятно передаёт практическую сообразительность и удерживает неоднозначность греческого πανοῦργος.
