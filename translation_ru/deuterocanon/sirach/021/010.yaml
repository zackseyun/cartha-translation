  text: The way of sinners is paved with stones[b][a], and at its end is the pit of Hades.
translation:
  language: ru
  text: Путь грешников вымощен камнями[a], и в конце его — яма Аида[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выровнен камнями». Греческое причастие подчёркивает, что дорогу сделали ровной; в данном сочетании, вероятно, имеется в виду мощёная дорога.'
    reason: lexical_alternative
  - marker: b
    text: 'Аид — царство мёртвых; возможные переводы: «преисподняя» или «могила».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁδὸς
  choice: путь
  rationale: «Путь» сохраняет и конкретный образ дороги, и переносный смысл образа жизни или поведения.
- source_word: ἁμαρτωλῶν
  choice: грешников
  rationale: Прямо передаёт родительный падеж и сохраняет выраженную в тексте нравственную характеристику.
- source_word: ὡμαλισμένη
  choice: вымощен
  rationale: Причастие означает «сделанный ровным, выровненный»; в сочетании с ἐκ λίθων естественное русское «вымощен» передаёт образ устроенной каменной дороги.
- source_word: ἐκ λίθων
  choice: камнями
  rationale: Творительный падеж естественно обозначает материал при русском глаголе «вымостить».
- source_word: ἐπʼ ἐσχάτῳ αὐτῆς
  choice: в конце его
  rationale: Сохраняет пространственный образ конечной точки пути и допускает переносный смысл его итога.
- source_word: βόθρος
  choice: яма
  rationale: Передаёт конкретный образ углубления или провала без усиления до «бездны».
- source_word: ᾅδου
  choice: Аида
  rationale: Сохраняет явное греческое название царства мёртвых и не подменяет его позднейшим понятием ада как места окончательного наказания.
theological_decisions:
- issue: Передача ᾅδου в образном высказывании литературы мудрости
  choice: Аида
  alternative: царства мёртвых; преисподней; могилы
  rationale: Транслитерация сохраняет понятийный мир греческого текста и его неоднозначность. Сноска поясняет значение, не отождествляя Аид без оговорок с позднейшим представлением об аде.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая фраза с сохранением дорожного образа. Тире естественно обозначает подразумеваемую связку перед итоговым образом.
