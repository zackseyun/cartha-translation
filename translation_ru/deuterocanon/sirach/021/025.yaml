lexical_decisions:
- source_word: χείλη
  choice: уста
  rationale: Сохраняет конкретный образ губ как обозначения речи и соответствует достоинству афористического стиля.
- source_word: ἀλλοτρίων
  choice: чужих
  rationale: Передаёт людей, стоящих вне подразумеваемого круга, не сводя значение к этнически окрашенному «иноземцев».
- source_word: ἐν τούτοις
  choice: от этого
  rationale: Естественно выражает вероятный причинный смысл ссылки на предшествующие обстоятельства; более буквальное пространственное прочтение отмечено в сноске.
- source_word: βαρυνθήσεται
  choice: отяготятся
  rationale: Передаёт будущую пассивную форму и сохраняет метафору тяжести, связанную с образом весов во второй части.
- source_word: λόγοι
  choice: слова
  rationale: Прямой и естественный эквивалент в контексте литературы мудрости.
- source_word: φρονίμων
  choice: мудрых
  rationale: Субстантивированное прилагательное обозначает благоразумных, рассудительных людей; «мудрых» сохраняет лексику литературы мудрости.
- source_word: ἐν ζυγῷ
  choice: на весы
  rationale: В данном контексте ζυγός обозначает весы или их коромысло, а не ярмо; русский оборот ясно передаёт образ взвешивания.
- source_word: σταθήσονται
  choice: будут положены
  rationale: В сочетании с весами глагол обозначает помещение на весы; формулировка сохраняет конкретный образ, не подменяя его толкованием «будут взвешены».
