translation:
  language: ru
  text: Мольба бедняка идёт от его уст до его ушей[a], и решение по его делу приходит незамедлительно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от уст до ушей его». Местоимение в греческом тексте формально неоднозначно; по смыслу под «ушами» чаще понимают уши Бога: мольба бедняка достигает Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «суд его», «правосудие для него». Греческое слово может означать судебное решение, суд или правосудие.'
    reason: alternative_reading
lexical_decisions:
- source_word: δέησις
  choice: мольба
  rationale: Слово обозначает настойчивую просьбу, прошение; «мольба» естественно передаёт её горячий и молитвенный характер.
- source_word: πτωχοῦ
  choice: бедняка
  rationale: Мужской род и единственное число греческого слова сохранены; современное «бедняк» обозначает человека, живущего в нужде.
- source_word: ἐκ στόματος ἕως ὠτίων αὐτοῦ
  choice: от его уст до ушей Его
  rationale: Сохранён необычный образ исходного текста. Первое местоимение отнесено к бедняку, второе — наиболее естественно к подразумеваемому Богу; прописная буква делает синтаксически необходимое различение прозрачным, а примечание отмечает буквальную неоднозначность.
- source_word: κρίμα
  choice: суд в его пользу
  rationale: κρίμα может означать судебное решение или осуществлённое правосудие. Контекст мольбы бедняка позволяет понять его как решение по его делу; добавление «в его пользу» передаёт направленность решения, не называя прямо подразумеваемого Судью.
- source_word: κατὰ σπουδήν
  choice: незамедлительно
  rationale: Оборот выражает поспешность и быстроту; «незамедлительно» звучит естественно и достойно в контексте судебного решения.
- source_word: ἔρχεται
  choice: приходит
  rationale: Сохранены простой глагол движения и настоящее время греческого текста, подчёркивающие непосредственность ответа.
theological_decisions:
- issue: К кому относится αὐτοῦ в выражении «до ушей его»
  choice: 'В основном тексте второе местоимение отнесено к Богу: «до ушей Его».'
  alternative: Грамматически αὐτοῦ может относиться к бедняку, ближайшему явно названному существительному.
  rationale: Смысл изречения и следующая строка о скором суде указывают на Бога как подразумеваемого Слушателя и Судью. Поскольку референт в греческом прямо не назван, формальная неоднозначность отмечена в сноске.
- issue: Значение κρίμα
  choice: «суд в его пользу» — решение, вынесенное по делу бедняка.
  alternative: 'Более формально: «его суд»; возможны также «его дело» или «правосудие для него».'
  rationale: Слово сохраняет судебно-богословскую широту, а контекст указывает, что речь идёт не об осуждении бедняка, а о скором разбирательстве и защите его прав.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным библейской мудрости. Необычный пространственный образ оригинала сохранён; архаизирующее «уста» употреблено как устойчивое возвышенное соответствие в параллели с «ушами», тогда как синтаксис остаётся простым и ясным.
