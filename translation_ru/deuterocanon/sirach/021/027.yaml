translation:
  language: ru
  text: Когда нечестивый проклинает Противника[a], он проклинает собственную душу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сатану». Греческое слово σατανᾶς — транслитерация семитского слова со значением «противник» или «обвинитель».'
    reason: Альтернативная передача термина σατανᾶ как традиционного собственного имени.
lexical_decisions:
- source_word: ἐν τῷ καταρᾶσθαι
  choice: Когда ... проклинает
  rationale: Сочетание ἐν с артиклевым инфинитивом выражает временное обстоятельство; конструкция «Когда ... проклинает» естественно передаёт его по-русски.
- source_word: ἀσεβῆ
  choice: нечестивый
  rationale: Субстантивированное прилагательное обозначает человека, не почитающего Бога; единственное число сохраняет обобщённый характер изречения.
- source_word: τὸν σατανᾶ
  choice: Противника
  rationale: Греческое σατανᾶς восходит к семитскому обозначению противника или обвинителя. Перевод передаёт значение слова, а прописная буква указывает на личного референта, не устраняя возможное понимание как имени.
- source_word: αὐτὸς
  choice: он
  rationale: Местоимение возвращает к субъекту инфинитива и несёт умеренное усиление; в русском контексте естественно передаётся местоимением «он».
- source_word: καταρᾶται
  choice: проклинает
  rationale: Повтор того же русского глагола сохраняет риторический параллелизм с первым употреблением καταρᾶσθαι.
- source_word: τὴν ἑαυτοῦ ψυχήν
  choice: собственную душу
  rationale: «Душу» сохраняет нравственно-духовную ёмкость ψυχή, а «собственную» ясно передаёт возвратное ἑαυτοῦ и усиливает парадокс изречения.
theological_decisions:
- issue: Передавать ли σατανᾶ как титул/обозначение или как собственное имя
  choice: Противника
  alternative: сатану
  rationale: Значение исходного термина — «противник» или «обвинитель», и в данном изречении нарицательный оттенок остаётся возможным. Основной текст передаёт значение, а традиционный вариант с именем сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура и повтор глагола сохранены. «Нечестивый» поддерживает библейское достоинство слога, оставаясь понятным современному читателю.
