  text: Instruction is shackles on the feet of the senseless[a], and like handcuffs on the right hand.
translation:
  language: ru
  text: Наставление[a] — оковы на ногах неразумных и словно наручники на правой руке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Воспитание — путы на ногах неразумных и словно оковы на правой руке».'
    reason: Лексическое значение παιδεία включает как наставление, так и воспитание или дисциплинирующее обучение; πέδαι и χειροπέδαι также допускают передачу словами «путы» и «оковы».
lexical_decisions:
- source_word: πέδαι
  choice: оковы
  rationale: Слово обозначает путы или оковы, прежде всего надеваемые на ноги; «оковы» ясно сохраняет образ физического ограничения.
- source_word: ἐν ποσὶν
  choice: на ногах
  rationale: Предложное сочетание указывает на расположение оков на ногах и естественно передаётся по-русски.
- source_word: ἀνοήτοις
  choice: для неразумных
  rationale: Прилагательное в субстантивированном употреблении обозначает людей, лишённых разумения; «неразумные» сохраняет характерный для литературы мудрости смысл без усиления до бранного обозначения.
- source_word: παιδεία
  choice: наставление
  rationale: Слово охватывает наставление, воспитание и дисциплинирующее обучение. «Наставление» передаёт широкий педагогический смысл, не сводя его к наказанию.
- source_word: χειροπέδαι
  choice: наручники
  rationale: Это оковы для рук; «наручники» — точный и понятный современному читателю русский эквивалент.
- source_word: ἐπὶ χειρὸς δεξιᾶς
  choice: на правой руке
  rationale: Сохранены и указание на правую руку, и единственное число исходного текста, несмотря на необычность образа.
