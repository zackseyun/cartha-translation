  text: A fool’s explanation is like a burden on the road[a], but grace will be found on the lips of the prudent.
translation:
  language: ru
  text: Объяснение глупца — словно ноша в пути, а на устах разумного найдётся благодать[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благосклонность» или «приятность». Греческое χάρις может означать благодать, благосклонность или привлекательную любезность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξήγησις
  choice: объяснение
  rationale: Передаёт изложение или разъяснение чего-либо и сохраняет прямой смысл греческого существительного, не превращая его просто в «речь».
- source_word: μωροῦ
  choice: глупца
  rationale: Обычный термин литературы мудрости, обозначающий нравственно и рассудочно неразумного человека, а не просто бытовое оскорбление.
- source_word: ὡς ἐν ὁδῷ φορτίον
  choice: словно ноша в пути
  rationale: Сохраняет конкретный образ обременительной поклажи во время пути; по-русски звучит естественнее буквального «груз на дороге».
- source_word: χείλους
  choice: на устах
  rationale: Сохраняет образный язык греческого текста и традиционную для литературы мудрости связь уст с речью.
- source_word: συνετοῦ
  choice: разумного
  rationale: Обозначает человека, обладающего пониманием и здравым суждением; естественно противопоставляется глупцу.
- source_word: εὑρεθήσεται χάρις
  choice: найдётся благодать
  rationale: Близко передаёт форму греческого выражения и сохраняет смысловую широту χάρις, которая может означать благодать, благосклонность или приятность.
theological_decisions:
- issue: Смысл χάρις применительно к устам разумного
  choice: благодать
  alternative: благосклонность; приятность
  rationale: Контекст допускает качество благотворной, привлекательной речи, но греческое слово шире этого оттенка. Основной текст сохраняет традиционно ёмкое «благодать», а сноска не позволяет неоправданно сузить смысл до богословского термина.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной формой. «Ноша в пути» передаёт образ естественно и достойно; «уста» сохраняют возвышенный библейский регистр без архаизации всего стиха.
