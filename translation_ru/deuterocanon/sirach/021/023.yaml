translation:
  language: ru
  text: Глупец заглядывает в дом с порога, а достойный человек стоит снаружи и говорит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст выражен сжато: «и честь человеку: снаружи станет и заговорит». Греческая параллель читает: «обученный человек станет снаружи»; слов «и говорит» в ней нет.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱוִיל
  choice: глупец
  rationale: Устойчивый термин еврейской литературы мудрости, обозначающий не только недостаток ума, но и нравственное и общественное неблагоразумие; сохраняет афористический стиль.
- source_word: מִפֶּתַח
  choice: с порога
  rationale: Передаёт положение человека у входа и естественно сочетается по-русски с образом назойливого заглядывания внутрь.
- source_word: יַבִּיט אֶל בָּיִת
  choice: заглядывает в дом
  rationale: Передаёт направленный внутрь взгляд; оттенок неуместного любопытства подтверждается греческим παρακύπτει.
- source_word: וְכָבוֹד לְאִישׁ
  choice: а достойный человек
  rationale: 'Еврейское выражение буквально сжато: «и честь человеку». В контексте оно характеризует соблюдающего приличия человека; «достойный» сохраняет связь с כָבוֹד и звучит естественно, не сводя смысл к происхождению или образованию.'
- source_word: בַּחוּץ יַעֲמוֹד
  choice: стоит снаружи
  rationale: Прямо передаёт еврейскую фразу; настоящее время в обеих частях естественно для русской пословичной сентенции.
- source_word: וִידַבֵּר
  choice: и говорит
  rationale: Глагол явно присутствует в еврейском свидетеле и потому сохранён, хотя в греческой параллели отсутствует; вероятный смысл — человек обращается к хозяевам, оставаясь снаружи.
