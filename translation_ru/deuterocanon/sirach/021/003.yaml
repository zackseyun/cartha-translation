base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/003.yaml
  text: Like one who grasps a woman’s private parts and urinates[b][a], so is one who suddenly enters his neighbor’s house.
translation:
  language: ru
  text: Кто держит рукой свой половой член[a], когда мочится, и кто внезапно входит в дом ближнего.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово אַמָּה обычно означает «предплечье» или «локоть», но употребляется также как обозначение мужского полового органа. Упоминание мочеиспускания указывает здесь именно на это значение.
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте здесь стоит совсем другая строка: «Зубы её — зубы льва, губящие жизни людей». По-видимому, она отражает существенно иную форму текста.'
    reason: textual_variant
lexical_decisions:
- source_word: הָאוֹחֵז
  choice: кто держит рукой
  rationale: Причастие от אחז означает «держать, схватить». Уточнение «рукой» естественно по-русски передаёт конкретное телесное действие, подразумеваемое контекстом.
- source_word: בָּאַמָה
  choice: свой половой член
  rationale: Существительное אַמָּה обычно означает «предплечье» или «локоть» как меру длины, но в позднем и раввинистическом употреблении служит также обозначением мужского полового органа. Сочетание с мочеиспусканием решительно указывает здесь на это значение. Возвратное «свой» ясно выражает подразумеваемую принадлежность.
- source_word: וּמַשְׁתִּין מָיִם
  choice: когда мочится
  rationale: Еврейское выражение буквально говорит «испускает воду». Современное русское «мочится» точно передаёт смысл без ненужной грубости; временная конструкция естественно связывает действие с тем, что человек держит член.
- source_word: וְהַנִּכְנָס
  choice: и кто входит
  rationale: В еврейском тексте две причастные конструкции просто соединены союзом «и». Перевод сохраняет это перечисление и не добавляет отсутствующего в источнике сравнения «таков и».
- source_word: לְבֵית חֲבֵרוֹ
  choice: в дом ближнего
  rationale: חָבֵר может обозначать друга, товарища или другого человека из близкого социального круга. «Ближний» соответствует стилю литературы мудрости и не предполагает тесной дружбы.
- source_word: פִּתְאוֹם
  choice: внезапно
  rationale: Наречие означает неожиданное, не предварённое предупреждением действие; «внезапно» передаёт его кратко и прямо.
theological_decisions:
- issue: Резкое расхождение между сохранившимся еврейским текстом и греческой традицией в Сир 21:3
  choice: В основном тексте переведено засвидетельствованное еврейское изречение; греческое чтение приведено в сноске.
  alternative: Взять за основной текст греческую строку о львиных зубах либо искусственно объединить оба чтения.
  rationale: Еврейский текст здесь сохранился и внутренне понятен, тогда как греческий представляет совершенно иную строку. Их объединение скрыло бы реальное текстовое расхождение. Следование еврейскому свидетельству с открытым указанием греческого варианта сохраняет обе формы традиции без гармонизации.
- issue: Синтаксическая связь двух действий
  choice: Сохранено простое соединение двух причастных оборотов союзом «и».
  alternative: 'Добавить сравнительную рамку: «Как тот, кто… так и тот, кто…».'
  rationale: В представленном еврейском тексте нет сравнительных частиц или явного сказуемого, оправдывающих такую рамку. Эллиптичность строки лучше сохранить, чем молча устранять её посредством добавленного толкования.
translation_notes:
  register: Современный литературный русский язык с прямой, но не вульгарной передачей телесной лексики. Формулировка намеренно сохраняет перечислительную и несколько эллиптическую структуру еврейской строки; добавленное в английском консультационном слое сравнение не перенесено, поскольку оно не выражено в еврейском тексте.
