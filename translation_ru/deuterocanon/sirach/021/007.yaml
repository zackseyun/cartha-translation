base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/007.yaml
  text: A man mighty in tongue is known from afar[b][a], but one with understanding knows when he slips.
translation:
  language: ru
  text: Человека, сильного в речах, узнают издалека[a], а разумный знает, когда тот оступается[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заметен издалека»; греческое выражение может указывать как на броскую речь, так и на славу, идущую впереди человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поскальзывается». Греческий образ может означать как буквальное скольжение, так и ошибку, в том числе в речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸς μακρόθεν
  choice: узнают издалека
  rationale: Передаёт предикативное γνωστός и наречие μακρόθεν естественным русским оборотом, не уточняя, идёт ли речь о заметности человека или о предшествующей ему славе.
- source_word: ὁ δυνατὸς ἐν γλώσσῃ
  choice: человека, сильного в речах
  rationale: Сохраняет значение силы или способности в области речи, выраженное δυνατός и ἐν γλώσσῃ, но избегает неестественного для современного русского буквального оборота «сильный языком».
- source_word: ὁ δὲ νοήμων
  choice: а разумный
  rationale: Кратко передаёт νοήμων как человека понимающего и рассудительного и сохраняет противопоставление красноречию.
- source_word: οἶδεν
  choice: знает
  rationale: Прямое соответствие обычному значению глагола; более толковательные варианты вроде «замечает» или «понимает» сделали бы смысл уже.
- source_word: ἐν τῷ ὀλισθάνειν αὐτόν
  choice: когда тот оступается
  rationale: Конструкция ἐν с артиклевым инфинитивом передана временным придаточным. Указательное «тот» отражает винительный субъект αὐτόν и естественно относит оступившегося к ранее названному человеку, а «оступается» сохраняет образ скольжения и возможность переносного смысла.
theological_decisions:
- issue: К кому относится αὐτόν
  choice: 'к ранее названному человеку, сильному в речах: «когда тот оступается»'
  alternative: 'к разумному человеку: «когда он сам оступается»'
  rationale: В греческом αὐτόν стоит в винительном падеже как субъект инфинитива и тем самым обычно обозначает лицо, отличное от подлежащего οἶδεν — «разумного». Перевод сохраняет эту грамматическую связь, не разъясняя, в чём именно состоит оступление.
- issue: Образ оступления
  choice: сохранён без уточнения как «оступается»
  alternative: истолковать прямо как речевую или нравственную ошибку
  rationale: ὀλισθάνειν допускает как буквальный образ скольжения, так и переносное значение ошибки. Контекст, вероятно, указывает на ошибку в речи, однако греческий текст этого прямо не оговаривает.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Сильного в речах» сохраняет достоинство и образность оригинала, оставаясь понятным; «тот» устраняет нежелательную русскую местоименную двусмысленность в соответствии с греческой грамматикой.
