translation:
  language: ru
  text: Дитя, согрешил ли ты? Больше не греши и молись о своих прежних грехах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Приведённая для этого стиха еврейская строка не соответствует Сир 21:1: «Три вещи я возненавидел, и четыре не полюбил». Поэтому перевод выполнен по греческому тексту.'
    reason: textual_variant
lexical_decisions:
- source_word: Τέκνον
  choice: Дитя
  rationale: Греческое обращение не указывает пола и не содержит притяжательного местоимения; «дитя» передаёт это прямо и естественно.
- source_word: ἥμαρτες
  choice: ты согрешил?
  rationale: Аорист ἁμαρτάνω здесь выражает совершённый грех; вопросительная форма сохранена без ослабления нравственно-религиозного смысла.
- source_word: μὴ προσθῇς μηκέτι
  choice: Больше не греши
  rationale: Буквально выражение означает «не прибавляй более», но в контексте речь идёт о недопустимости повторения греха. Русская формулировка передаёт смысл ясно и без буквалистской неестественности.
- source_word: περὶ τῶν προτέρων σου
  choice: о своих прежних грехах
  rationale: Буквально — «о прежнем твоём»; слово «грехах» восстанавливается из непосредственного контекста и устраняет неясность, неизбежную в русском.
- source_word: δεήθητι
  choice: молись
  rationale: Императив δέομαι означает просить, умолять, обращаться с мольбой; в покаянном контексте естественный русский эквивалент — «молись».
theological_decisions:
- issue: Выбор основного свидетельства при несовпадении еврейской строки со ссылкой на стих
  choice: Переводить греческий параллельный текст как относящийся к Сир 21:1, отметив расхождение в сноске.
  alternative: 'Перевести приложенную еврейскую строку: «Три вещи я возненавидел, и четыре не полюбил».'
  rationale: Приложенная еврейская строка тематически и текстуально не соответствует известному содержанию Сир 21:1 и, по всей видимости, смещена из другого места. Греческое свидетельство соответствует данной ссылке; честная сноска сохраняет сведения о текстологической проблеме, не подменяя ими сам стих.
translation_notes:
  register: Современный литературный русский язык; обращение краткое и наставительное. Сохранены вопросительная форма первой фразы, покаянный контекст и смысловой переход от прекращения греха к молитве о прежних грехах.
