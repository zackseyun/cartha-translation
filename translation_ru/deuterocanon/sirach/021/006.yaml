translation:
  language: ru
  text: Ненавидящий обличение идёт по следу грешника[a], а боящийся Господа обратится в сердце своём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на следу грешника». В первой части греческого текста нет явно выраженного глагола; «идёт» передаёт подразумеваемое движение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μισῶν
  choice: ненавидящий
  rationale: Субстантивированное причастие настоящего времени характеризует человека по его постоянному отношению к обличению.
- source_word: ἐλεγμὸν
  choice: обличение
  rationale: В контексте литературы мудрости слово обозначает нравственное порицание и исправляющее наставление; «обличение» сохраняет обе стороны значения.
- source_word: ἐν ἴχνει ἁμαρτωλοῦ
  choice: идёт по следу грешника
  rationale: ἴχνος означает след или отпечаток ноги. В греческой первой части нет явного сказуемого; «идёт» естественно передаёт подразумеваемое движение, не устраняя образ пути.
- source_word: ὁ φοβούμενος Κύριον
  choice: боящийся Господа
  rationale: Субстантивированное причастие обозначает человека, благоговейно боящегося Бога; Κύριον передано традиционным и понятным «Господа».
- source_word: ἐπιστρέψει
  choice: обратится
  rationale: Будущее время глагола ἐπιστρέφω передано без усиления до явно покаянного термина; «обратится» сохраняет возможные значения внутреннего поворота и возвращения.
- source_word: ἐν καρδίᾳ
  choice: в сердце своём
  rationale: Формулировка сохраняет библейскую антропологическую идиому и указывает на внутреннее обращение.
theological_decisions:
- issue: Передача Κύριον
  choice: Господа
  alternative: Владыку
  rationale: В данном благоговейном контексте речь идёт о Боге; «Господь» — естественное и традиционное соответствие, не привносящее конфессиональной конкретизации.
- issue: Эллипсис в первой части стиха
  choice: идёт по следу грешника
  alternative: находится на следу грешника
  rationale: В греческом нет выраженного личного глагола, поэтому русский требует восстановления связи. Глагол «идёт» согласуется с образом следа и пути, но факт эллипсиса отмечен в сноске.
- issue: Смысл ἐπιστρέψει ἐν καρδίᾳ
  choice: обратится в сердце своём
  alternative: раскается в сердце своём
  rationale: «Раскается» богословски конкретизировало бы более широкое ἐπιστρέψει. Буквально близкое «обратится» сохраняет смысловую напряжённость и внутреннюю направленность фразы.
translation_notes:
  register: Современный литературный русский с достоинством и лаконизмом изречения мудрости. Сохранены параллелизм двух субстантивированных причастий, образ следа и идиома сердца; синтаксический эллипсис пояснён сноской.
