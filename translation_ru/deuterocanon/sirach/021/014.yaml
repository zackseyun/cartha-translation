lexical_decisions:
- source_word: ἔγκατα
  choice: внутренность
  rationale: Слово буквально обозначает внутренние органы, а переносно — внутреннее существо человека. Единственное число «внутренность» сохраняет телесный образ и естественно согласуется с последующим глаголом в единственном числе.
- source_word: μωροῦ
  choice: глупца
  rationale: В литературе мудрости обозначает нравственно и умственно неразумного человека; «глупец» сохраняет краткость и пословичный тон.
- source_word: ὡς ἄγγιον συντετριμμένον
  choice: как разбитый сосуд
  rationale: ἄγγιον — общее обозначение вместилища или сосуда, а συντετριμμένον указывает на его разрушенное состояние. Формулировка сохраняет образ ёмкости, неспособной удержать содержимое.
- source_word: πᾶσαν γνῶσιν
  choice: никакого знания
  rationale: В сочетании с отрицанием οὐ естественный русский эквивалент передаёт значение «ни одного знания / никакого знания», не превращая πᾶσαν в утверждение о полноте знания.
- source_word: οὐ κρατήσει
  choice: не удержит
  rationale: κρατέω здесь означает удерживать или сохранять. «Не удержит» одновременно передаёт неспособность усвоить знание и поддерживает метафору разбитого сосуда.
