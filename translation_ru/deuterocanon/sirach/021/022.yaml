translation:
  language: ru
  text: Нога глупца спешит в дом, а человек с замыслами смиряется перед великими.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское «перед великими» можно также понять как «перед многими». Греческая параллель заметно отличается во второй части: «а многоопытный человек устыдится перед лицом (или: присутствием)».'
    reason: Альтернативное прочтение и существенное расхождение текстовых традиций.
lexical_decisions:
- source_word: רֶגֶל נָבָל
  choice: нога глупца
  rationale: Сохраняет единственное число и образную, афористическую форму еврейского текста; «глупец» естественно передаёт этико-интеллектуальный смысл נָבָל в литературе мудрости.
- source_word: מִהֲרָה
  choice: спешит
  rationale: Передаёт поспешность и импульсивность без ненужного усиления.
- source_word: אֶל בָּיִת
  choice: в чужой дом
  rationale: Русское «спешит в дом» без определения звучит неполно; «чужой» естественно выражает подразумеваемый вход в дом другого человека в контексте правил поведения, не превращая неопределённый еврейский оборот в конкретный «этот дом».
- source_word: אִישׁ מְזִימוֹת
  choice: человек, искусный в замыслах
  rationale: Сохраняет компонент «замыслов/планов» в מְזִימוֹת и оставляет его нравственную окраску открытой; слово «искусный» делает сочетание понятным по-русски, не подменяя его однозначно «благоразумным».
- source_word: יַכְנִיעַ
  choice: смиряется
  rationale: В контексте передаёт добровольное умаление себя или почтительную уступчивость, возможную для породы hiphil от כנע.
- source_word: לָרַבִּים
  choice: перед великими
  rationale: רַבִּים допускает значения «многие» и «великие/знатные»; последнее создаёт связный социальный смысл, но неоднозначность отмечена в примечании.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческой параллели во второй половине стиха
  choice: 'Основной текст следует еврейскому свидетельству: «человек, искусный в замыслах, смиряется перед великими».'
  alternative: 'Греческая параллель: «а многоопытный человек устыдится перед чьим-либо лицом (или: присутствием)».'
  rationale: При наличии еврейского текста он служит главным источником; существенное греческое расхождение сохраняется в сноске, поскольку меняет смысл второй строки.
- issue: Неоднозначность לָרַבִּים
  choice: перед великими
  alternative: перед многими
  rationale: Оба значения лексически возможны. «Перед великими» лучше сочетается с יַכְנִיעַ как выражением почтительной уступчивости, но альтернативу важно не скрывать.
translation_notes:
  register: Современный литературный русский язык с кратким афористическим ритмом. Сохранён образ «ноги глупца» и формальная уравновешенность двух частей; неясность второй части не устранена конфессиональным или доктринальным толкованием.
