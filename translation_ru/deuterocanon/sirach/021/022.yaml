  terminology: «Глупец», «смиряется перед великими» и вариант «перед многими» приемлемы. Для יַכְנִיעַ «смиряется» адекватно передаёт самоуничижение/подчинение в данном контексте. Сноска правильно фиксирует существенное расхождение греческого текста, но «чьим-либо» в ней не имеет основания.
