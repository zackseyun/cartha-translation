base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/015.yaml
  text: If an intelligent man hears a wise word[a], he will praise it and add to it; a wasteful man heard it and rejected it[c][b], and he cast it behind his back.
translation:
  language: ru
  text: Если знающий человек услышит мудрое изречение[a], он похвалит его и добавит к нему[b]; человек, предающийся излишествам, услышал его — оно ему не понравилось[c], и он отбросил его за спину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мудрое слово». Греческое выражение может обозначать мудрую речь или высказанную мудрую мысль, а не только отдельное слово.'
    reason: lexical_alternative
  - marker: b
    text: «Добавит к нему» может означать, что знающий человек разовьёт услышанную мудрую мысль, дополнив её собственным пониманием.
    reason: lexical_alternative
  - marker: c
    text: Греческое выражение в этом месте трудно для истолкования. Оно, по-видимому, передаёт отрицательную реакцию на услышанное; последующий жест выражает пренебрежение им.
    reason: alternative_reading
lexical_decisions:
- source_word: λόγον σοφόν
  choice: мудрое изречение
  rationale: λόγος здесь обозначает выраженную мысль или речённую мудрость, а не обязательно отдельное слово; «изречение» естественно передаёт единичность и афористический контекст.
- source_word: ἐπιστήμων
  choice: знающий человек
  rationale: Прилагательное обозначает человека сведущего, обладающего пониманием. «Знающий» сохраняет связь со знанием и не усиливает значение до общей характеристики ума.
- source_word: αἰνέσει αὐτόν
  choice: похвалит его
  rationale: Форма будущего времени прямо передаёт одобрительную реакцию; местоимение согласовано с мужским родом слова «изречение».
- source_word: ἐπʼ αὐτὸν προσθήσει
  choice: добавит к нему
  rationale: Близкая к форме греческого передача сохраняет открытым вопрос, означает ли выражение дальнейшее развитие мысли, собственное дополнение или нечто иное.
- source_word: ὁ σπαταλῶν
  choice: человек, предающийся излишествам
  rationale: Причастие σπαταλῶν описывает расточительный, самоугождающий или распущенный образ жизни. Выбранная формулировка передаёт эту нравственную широту лучше, чем узкое «расточитель».
- source_word: ἀπῄρεσεν αὐτῷ
  choice: отверг
  rationale: Оборот труден текстуально и семантически. В сочетании с последующим жестом он, вероятнее всего, выражает отрицательную реакцию и устранение услышанного; краткое «отверг» передаёт контекстуальный смысл без искусственной детализации.
- source_word: ἀπέστρεψεν αὐτοῦ ὀπίσω τοῦ νώτου αὐτοῦ
  choice: отбросил себе за спину
  rationale: Передаёт яркий образ сознательного пренебрежения. «Отбросил» естественнее по-русски, чем буквальное «повернул», и не требует добавлять отсутствующий в греческом объект существительным.
theological_decisions:
- issue: Мужской род единственного числа в изречении мудрости
  choice: Сохранить формы «знающий человек» и «человек, предающийся излишествам»
  alternative: «Кто обладает знанием… кто предаётся излишествам»
  rationale: Греческий текст использует мужские формы единственного числа как типические образы. Перевод сохраняет эту грамматическую форму, не превращая стих в гендерно нейтральное обобщение.
- issue: Смена времени между первым и вторым слышащим
  choice: Сохранить будущее «услышит… похвалит» и аорист «услышал… отверг… отбросил»
  alternative: Унифицировать обе половины в настоящем или будущем времени
  rationale: Необычная смена времени присутствует в греческом и может быть стилистически значимой; её не следует молча сглаживать.
translation_notes:
  register: Современный литературный русский язык с достоинством жанра мудрости. Сохранены лаконичный параллелизм, типические мужские образы и заметная смена глагольного времени. Формулировка избегает как архаизмов, так и разговорной сниженности.
