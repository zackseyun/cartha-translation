    rationale: Глагол и синтаксис в данном месте трудны; «отверг» истолковывает их сильнее, чем позволяет текст. Негативную реакцию безопаснее передать как «оно ему не понравилось», сохранив конкретный жест отбрасывания в следующей клаузе.
  - severity: medium
    issue: «Отбросил себе за спину»
    rationale: Русское «себе» здесь не заменяет подразумеваемый объект «его» и звучит неестественно. В греческом αὐτοῦ относится к услышанному слову; «отбросил его за спину» передаёт образ ясно и естественно.
