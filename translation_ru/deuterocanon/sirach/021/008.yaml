  text: He who builds his house with another’s money is like one gathering his stones for winter[a][b].
translation:
  language: ru
  text: Кто строит свой дом на чужие средства,[a] тот подобен тому, кто собирает свои камни к зиме.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на чужое имущество». Греческое выражение обозначает деньги, имущество или иные средства, принадлежащие другому.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «зима», может также означать ненастный, бурный сезон. Образ сбора камней к этому времени в самом стихе не поясняется.
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οἰκοδομῶν
  choice: Кто строит
  rationale: Субстантивированное причастие настоящего времени имеет обобщённый, пословичный смысл; конструкция «кто… тот» естественно передаёт его по-русски.
- source_word: τὴν οἰκίαν αὐτοῦ
  choice: свой дом
  rationale: В контексте строительства и камней οἰκία прежде всего обозначает здание; возвратное «свой» естественно соотносит дом со строителем.
- source_word: ἐν χρήμασιν ἀλλοτρίοις
  choice: на чужие средства
  rationale: χρήματα может означать деньги, имущество или материальные средства, а ἀλλότριος — принадлежащее другому. «На чужие средства» сохраняет широту выражения и естественно звучит применительно к строительству.
- source_word: ὡς συνάγων
  choice: тот словно собирает
  rationale: ὡς с причастием вводит сравнение; «словно» ясно и кратко передаёт образную связь.
- source_word: αὐτοῦ τοὺς λίθους
  choice: собирает себе камни
  rationale: αὐτοῦ допускает притяжательное понимание. Дательный «себе» по-русски естественно передаёт отнесённость камней к тому же строителю, не утяжеляя фразу.
- source_word: εἰς χειμῶνα
  choice: к зиме
  rationale: χειμών означает зиму, а также ненастный, бурный сезон. «К зиме» сохраняет временную направленность εἰς и образ запоздалого либо бесполезного приготовления.
