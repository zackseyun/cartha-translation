  text: In the mouth of fools is their heart[a], but the heart of the wise is their mouth.
translation:
  language: ru
  text: У глупых сердце в устах[a], а сердце мудрых — их уста.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. буквально: «В устах глупых — их сердце, а сердце мудрых — их уста». Вторая половина — краткая эллиптическая антитеза; её нередко понимают в том смысле, что мудрые обдумывают и сдерживают речь, однако это толкование не выражено прямо в греческом тексте.'
    reason: Пояснение буквальной формы и эллиптической антитезы греческого текста.
lexical_decisions:
- source_word: ἐν στόματι
  choice: во рту
  rationale: 'Сохраняет конкретный образ греческого текста: внутреннее у глупых сразу оказывается в устах.'
- source_word: μωρῶν
  choice: глупых
  rationale: Субстантивированное прилагательное передано естественно для русского изречения; форма «у глупых» также воспроизводит родительную конструкцию.
- source_word: ἡ καρδία
  choice: сердце
  rationale: «Сердце» сохраняет библейское обозначение внутреннего человека — мыслей, воли и расположения, — не сводя его лишь к чувствам.
- source_word: σοφῶν
  choice: мудрых
  rationale: Краткая форма «у мудрых» соответствует параллельному «у глупых» и сохраняет афористичность.
- source_word: καρδία δὲ σοφῶν στόμα αὐτῶν
  choice: а у мудрых уста — в сердце
  rationale: Вторая половина греческого текста предельно сжата и не содержит явной связки или второго ἐν. Русская формулировка передаёт очевидную антитетическую инверсию образа, не оставляя неестественное и потенциально обратное по смыслу «сердце мудрых — их уста».
