translation_notes:
  register: Краткий, афористичный регистр литературы мудрости. «Уста» во второй половине выбраны ради достоинства стиля и устойчивого русского образа «уста в сердце»; «во рту» в первой звучит естественно и непосредственно. Тире обозначает подразумеваемую связку и помогает прочитать антитезу.
