translation:
  language: ru
  text: Для благоразумного наставление — как золотое украшение и как браслет на его правой руке.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воспитание», «обучение» или «дисциплина». Греческое παιδεία может обозначать не только наставление, но и нравственное формирование и дисциплину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμος
  choice: украшение
  rationale: Здесь слово означает предмет убранства, а не «мир»; образ золота и параллель с браслетом указывают на носимое украшение.
- source_word: χρυσοῦς
  choice: золотое
  rationale: Прилагательное прямо обозначает материал или качество украшения; «золотое украшение» естественно по-русски.
- source_word: φρονίμῳ
  choice: для благоразумного
  rationale: Дательный падеж обозначает человека, которому наставление служит украшением. «Благоразумный» передаёт практическую рассудительность φρόνιμος и сохраняет субстантивированную форму без ненужного добавления слова «мужчина».
- source_word: παιδεία
  choice: наставление
  rationale: Слово охватывает обучение, воспитание и дисциплинирующее нравственное формирование. «Наставление» естественно в контексте литературы мудрости, а более широкий диапазон отмечен в сноске.
- source_word: χλιδών
  choice: браслет
  rationale: Упоминание правой руки указывает на надеваемое на руку украшение; «браслет» — ясный современный эквивалент.
- source_word: βραχίονι δεξιῷ
  choice: на его правой руке
  rationale: Фраза указывает место украшения; местоимение «его» естественно выражает подразумеваемую принадлежность и соотносит образ с благоразумным человеком.
theological_decisions:
- issue: Передача мужского единственного φρονίμῳ
  choice: для благоразумного
  alternative: для благоразумного человека; для благоразумного мужчины
  rationale: Греческая форма грамматически мужского рода и представляет типичного отдельного человека. Русское субстантивированное «благоразумного» сохраняет форму мужского рода, но не вносит излишне подчёркнутого указания на биологический пол.
translation_notes:
  register: Современный литературный русский язык с достоинством афористической речи. Параллельная конструкция «словно… словно…» сохраняет два сравнения оригинала; тире помогает естественно оформить именную конструкцию.
