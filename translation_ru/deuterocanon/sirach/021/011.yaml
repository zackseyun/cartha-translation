  text: Whoever keeps the law controls his understanding[b][a], and the fulfillment of the fear of the Lord is wisdom.
translation:
  language: ru
  text: Кто соблюдает Закон, тот держит под контролем своё мышление[a], а полнота страха Господня — мудрость[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «овладевает своим разумением», «крепко держится своего намерения» или «сохраняет своё разумение». Греческое выражение сжато, а ἐννόημα может означать мысль, намерение, замысел или разумение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «завершение страха Господня» или «исполнение страха Господня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ φυλάσσων νόμον
  choice: кто соблюдает Закон
  rationale: Субстантивированное причастие настоящего времени выражает общее правило; «соблюдает» естественно передаёт постоянное исполнение, а прописная буква указывает на известный Закон в иудейском контексте.
- source_word: κατακρατεῖ
  choice: владеет
  rationale: Глагол с родительным падежом может означать овладевать, господствовать или крепко держаться. «Владеет» сохраняет образ власти над внутренней способностью и звучит естественно по-русски.
- source_word: τοῦ ἐννοήματος αὐτοῦ
  choice: своим разумом
  rationale: ἐννόημα охватывает значения мысли, замысла, намерения и разумения. «Своим разумом» подходит к контексту наставления о нравственной и умственной собранности, не исключая иных оттенков, отмеченных в сноске.
- source_word: συντέλεια
  choice: полнота
  rationale: Слово обозначает завершение, доведение до полноты или конечный итог. «Полнота» естественно выражает достижение надлежащей меры и не придаёт фразе ненужного эсхатологического оттенка.
- source_word: τοῦ φόβου Κυρίου
  choice: страха Господня
  rationale: Сохранено устойчивое выражение литературы мудрости о благоговейном страхе, направленном к Господу.
- source_word: σοφία
  choice: мудрость
  rationale: Прямое и контекстуально точное соответствие основному термину литературы мудрости.
theological_decisions:
- issue: Связь соблюдения Закона с внутренней способностью в выражении κατακρατεῖ τοῦ ἐννοήματος αὐτοῦ
  choice: Соблюдающий Закон владеет своим разумом.
  alternative: Соблюдающий Закон крепко держится своего намерения или сохраняет своё разумение.
  rationale: Греческое выражение сжато и допускает как значение господства над мыслью, так и значение удержания намерения или сохранения разумения. Основной перевод лучше соответствует контексту мудрости, а подлинная многозначность сохранена в сноске.
- issue: Соотношение страха Господня и мудрости в выражении συντέλεια τοῦ φόβου Κυρίου σοφία
  choice: Полнота страха Господня — мудрость.
  alternative: Завершение или исполнение страха Господня — мудрость.
  rationale: Именная фраза не уточняет, является ли мудрость завершённой мерой, итогом или исполнением страха Господня. «Полнота» сохраняет эту смысловую напряжённость, а возможные оттенки отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык; краткий, афористичный строй изречения сохранён. Формулировка достоинственна и понятна широкому читателю, без привнесения конфессиональных толкований.
