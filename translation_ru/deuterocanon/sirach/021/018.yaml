  text: Wisdom to a fool is like a ruined house, and the knowledge of one without understanding is words that cannot be examined.
translation:
  language: ru
  text: Мудрость для глупца — словно разрушенный дом[a], а знание неразумного — непостижимые слова[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уничтоженный дом»; греческое слово может обозначать нечто разрушенное, стёртое или исчезнувшее.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слова, в которых невозможно разобраться»; греческое выражение может указывать как на непонятность слов, так и на невозможность исследовать их смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶκος ἠφανισμένος
  choice: разрушенный дом
  rationale: Причастие от ἀφανίζω может обозначать нечто уничтоженное, исчезнувшее или приведённое в негодность. «Разрушенный дом» естественно передаёт образ утраты целостности и пользы.
- source_word: μωρῷ
  choice: для глупца
  rationale: 'Дательный падеж выражает отношение: чем является мудрость для глупца. Русское «для глупца» ясно и естественно передаёт эту связь.'
- source_word: σοφία
  choice: мудрость
  rationale: Прямое и устойчивое соответствие греческому слову.
- source_word: γνῶσις
  choice: знание
  rationale: Сохранено отличие от σοφία («мудрость») и параллелизм двух частей стиха.
- source_word: ἀσυνέτου
  choice: неразумного
  rationale: Передаёт отсутствие понимания и рассудительности, не отождествляя это слово полностью с μωρός («глупец») в первой части.
- source_word: ἀδιεξέταστοι λόγοι
  choice: непостижимые слова
  rationale: Прилагательное обозначает слова, которые невозможно исследовать до конца или смысл которых не удаётся уяснить. «Непостижимые слова» звучит кратко и естественно, сохраняя смысловую неоднозначность между неисследуемостью и непонятностью.
