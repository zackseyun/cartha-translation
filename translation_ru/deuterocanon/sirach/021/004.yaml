translation:
  language: ru
  text: Всякое беззаконие — как обоюдоострый меч; от её раны нет исцеления.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: как
  rationale: Вводит прямое сравнение и естественно передаётся русским «как».
- source_word: ῥομφαία δίστομος
  choice: обоюдоострый меч
  rationale: Передаёт меч с двумя режущими краями; это естественное и образное выражение в современном литературном русском языке.
- source_word: πᾶσα ἀνομία
  choice: всякое беззаконие
  rationale: «Беззаконие» сохраняет смысл нарушения закона и нравственного порядка, а «всякое» передаёт распределительное значение πᾶσα при существительном в единственном числе.
- source_word: τῇ πληγῇ αὐτῆς
  choice: от нанесённой им раны
  rationale: πληγή допускает значения «удар» и «рана»; упоминание исцеления указывает здесь на рану. Развёрнутая формулировка ясно связывает рану с мечом-образом беззакония.
- source_word: οὐκ ἔστιν ἴασις
  choice: нет исцеления
  rationale: Сохраняет безличную структуру и категоричную, афористическую силу греческого выражения.
theological_decisions:
- issue: Нравственный смысл ἀνομία
  choice: беззаконие
  alternative: неправедность; злодеяние
  rationale: «Беззаконие» наиболее точно сохраняет идею нарушения закона или установленного нравственного порядка, не сводя слово к общему обозначению зла.
- issue: Референт αὐτῆς
  choice: рана, нанесённая мечом — то есть беззаконием
  alternative: рана самого беззакония
  rationale: 'Грамматически местоимение женского рода может соотноситься и с ῥομφαία, и с ἀνομία. Русская формулировка удерживает единый образ: беззаконие уподоблено мечу, который наносит неисцелимую рану.'
translation_notes:
  register: Краткий афористический стих передан современным литературным русским языком с сохранением параллели «меч — рана — исцеление». Тон строгий и выразительный, без архаизации.
