translation:
  language: ru
  text: Уста мудрого будут искать на собрании, и слова его будут обдумывать в сердце.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий глагол во второй части стоит в 3-м лице единственного числа, хотя явный субъект отсутствует; синтаксис труден. Перевод передаёт наиболее вероятный смысл: собравшиеся внутренне обдумывают слова мудрого. Буквально: «и будет обдумывать его слова в сердце».'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: στόμα
  choice: уста
  rationale: Сохраняет конкретный образ «уст» как метонимии речи; это естественное для русского библейского регистра слово, не сводящее образ сразу к отвлечённой «речи».
- source_word: φρονίμου
  choice: мудрого
  rationale: Мужской род и единственное число греческого субстантивированного прилагательного сохранены; «мудрого» в данном контексте естественнее, чем более узкое «благоразумного».
- source_word: ζητηθήσεται
  choice: будут востребованы
  rationale: Передаёт будущее пассивное значение и смысл того, что к словам мудрого стремятся обратиться. Буквальное «будут искомы» в современном русском неестественно.
- source_word: ἐν ἐκκλησίᾳ
  choice: на собрании
  rationale: «Собрание» обозначает собравшуюся общину без позднейшего технического значения «церковь»; предлог «на» естественен по-русски для происходящего во время собрания.
- source_word: λόγους
  choice: слова
  rationale: Широкий и прямой эквивалент λόγοι, не сужающий значение до изречений или наставлений.
- source_word: διανοηθήσεται
  choice: он обдумает
  rationale: Форма стоит в третьем лице единственного числа и обозначает внутреннее, вдумчивое рассмотрение. Местоимение «он» восстанавливает подразумеваемого мудрого, а не вводит множественный субъект, отсутствующий в греческом.
- source_word: ἐν καρδίᾳ
  choice: в сердце
  rationale: Сохранён библейский образ сердца как средоточия внутреннего размышления; притяжательное местоимение в греческом отсутствует и по-русски не требуется.
theological_decisions:
- issue: Род при передаче φρονίμου
  choice: мудрого
  alternative: мудрого человека
  rationale: Греческая форма имеет мужской род и единственное число. Краткая субстантивированная форма по-русски сохраняет это без добавления отсутствующего существительного.
- issue: Значение ἐκκλησία
  choice: собрание
  alternative: община
  rationale: Контекст говорит о собравшемся сообществе, а не о позднейшем христианском институте; «собрание» не вносит лишней экклезиологической конкретизации.
- issue: Подразумеваемый субъект διανοηθήσεται
  choice: мудрый («он»)
  alternative: неопределённые слушатели («будут обдумывать»)
  rationale: Греческий глагол стоит в третьем лице единственного числа, поэтому множественный субъект слушателей грамматически не выражен. Вместе с тем переход от «уст» к самому мудрому является метонимическим и потому отмечен сноской, чтобы не скрывать напряжённость конструкции.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. «Уста» сохраняют исходный образ, а «востребованы» делает пассивную конструкцию понятной современному читателю. Синтаксическая неоднозначность второй части не замалчивается, а разъясняется в сноске.
