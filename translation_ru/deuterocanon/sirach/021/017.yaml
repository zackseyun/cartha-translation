  source_fidelity: 'Первая часть передана в целом верно, однако «будут востребованы» привносит современный коммерческо-административный оттенок и менее точно передаёт ζητηθήσεται («будут искать»). Во второй части греческое διανοηθήσεται действительно имеет форму 3-го лица единственного числа, но прямое отнесение его к «мудрому» не задано текстом и создаёт неестественный смысл: мудрый обдумывает собственные слова. Конструкция греческого текста синтаксически трудна; наиболее вероятный смысл, согласующийся с контекстом и английским аудит-трейлом, — община внутренне обдумывает слова мудрого. Это следует передать по-русски неопределённо-личной конструкцией и отметить расхождение с формой греческого глагола.'
