base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/021/013.yaml
  text: The knowledge of a wise man will increase like a flood[b][a], and his counsel is like a spring of life.
translation:
  language: ru
  text: Знание мудрого умножится, как потоп[a], и совет его — как источник жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как наводнение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνῶσις
  choice: знание
  rationale: Прямое соответствие греческому существительному; в контексте литературы мудрости сохраняет смысл приобретённого знания.
- source_word: σοφοῦ
  choice: мудрого
  rationale: Сохранены родительный падеж, мужской род и единственное число греческого слова; субстантивированное русское прилагательное естественно обозначает мудрого человека.
- source_word: ὡς κατακλυσμός
  choice: как потоп
  rationale: κατακλυσμός означает потоп или мощное наводнение; «потоп» кратко и образно передаёт масштаб разлива.
- source_word: πληθυνθήσεται
  choice: умножится
  rationale: Форма будущего времени означает возрастание и становление многочисленным; «умножится» сохраняет образ обильного увеличения.
- source_word: βουλή
  choice: совет
  rationale: В данном контексте слово обозначает совет или наставление мудрого, а не отвлечённое намерение.
- source_word: πηγή ζωῆς
  choice: источник жизни
  rationale: «Источник» естественно передаёт πηγή как родник, из которого течёт вода, и сохраняет метафору животворного совета.
theological_decisions:
- issue: Род и число слова σοφοῦ
  choice: мудрого
  alternative: мудрых; мудрого человека
  rationale: Греческий текст имеет мужской род и единственное число. Русское «мудрого» сохраняет эту грамматическую конкретность, не превращая образ в обобщённое множественное число.
- issue: Характер выражения πηγή ζωῆς
  choice: метафора «источник жизни»
  alternative: источник, дающий жизнь
  rationale: Сохранена прямая метафора исходного текста без уточнения того, понимается ли жизнь буквально, нравственно или духовно.
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным строем. Тире во второй части естественно передаёт подразумеваемую связку; образы потопа и источника сохранены.
