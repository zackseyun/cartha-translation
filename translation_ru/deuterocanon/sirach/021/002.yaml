translation:
  language: ru
  text: 'Беги от греха, как от змеи[a]: если приблизишься к нему, он укусит тебя.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Беги от греха, как от лица (или присутствия) змеи».'
    reason: lexical_alternative
  - marker: b
    text: Сохранившаяся в указанном сводном издании каирских рукописей еврейская строка здесь не соответствует греческому тексту этого стиха и, по-видимому, попала не на своё место; поэтому перевод выполнен по греческому свидетелю.
    reason: textual_variant
lexical_decisions:
- source_word: φεῦγε
  choice: Беги
  rationale: Греческий императив выражает настойчивое требование спасаться бегством; «беги» сохраняет живость и безотлагательность предостережения.
- source_word: ἁμαρτίας
  choice: от греха
  rationale: Обычное и богословски содержательное соответствие греческому ἁμαρτία; форма с предлогом естественна после «беги».
- source_word: ὡς ἀπὸ προσώπου ὄφεως
  choice: как от змеи
  rationale: Буквально оборот говорит о бегстве «от лица/присутствия змеи», но по-русски буквальное «от лица змеи» звучало бы неестественно. Краткое «как от змеи» сохраняет конкретный образ непосредственной опасности.
- source_word: ἐὰν ... προσέλθῃς
  choice: если приблизишься к нему
  rationale: Передаёт условность и значение приближения; местоимение мужского рода грамматически соотнесено с «грехом», при этом метафора змеи остаётся понятной.
- source_word: δήξεταί σε
  choice: он укусит тебя
  rationale: Глагол означает именно «кусать»; конкретное следствие приближения сохраняет цельность образа змеи.
theological_decisions:
- issue: Основа перевода при резком расхождении еврейского и греческого свидетелей
  choice: Основной текст переведён по греческому свидетелю
  alternative: 'Перевести приведённую строку сводного еврейского текста: «Правитель, привыкший к домам пиршества, усаживающийся на высотах города»'
  rationale: Приведённая еврейская строка не соответствует содержанию Сир 21:2 в греческой традиции и отмечена в исходных данных как вероятное смещение текста. Поэтому для данного стиха использовано греческое свидетельство, а расхождение открыто отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; краткое, энергичное наставление. Сохранены конкретная метафора змеи и прямое обращение во втором лице единственного числа. Союз «если» передаёт реальное предостережение без добавочного конфессионального толкования.
