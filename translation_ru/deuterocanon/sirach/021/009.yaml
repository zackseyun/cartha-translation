translation:
  language: ru
  text: Собрание беззаконников — словно связка пакли[a], а конец их — пламя огня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собрание беззаконников — словно собранная вместе пакля». Греческий текст выражен сжато; буквально: «собранная вместе пакля — собрание беззаконников».'
    reason: lexical_alternative
lexical_decisions:
- source_word: στιππύον
  choice: пакля
  rationale: Греческое слово обозначает легко воспламеняющийся волокнистый материал, в частности грубые остатки льна. «Пакля» точно передаёт предметный образ и его горючесть.
- source_word: συνηγμένον
  choice: связка
  rationale: Причастие буквально означает «собранное вместе». Слово «связка» естественно и кратко передаёт образ собранной вместе пакли, предназначенной легко вспыхнуть.
- source_word: συναγωγὴ ἀνόμων
  choice: собрание беззаконников
  rationale: «Собрание» сохраняет общественный образ συναγωγή, а «беззаконники» передаёт значение ἄνομοι — люди, отвергающие закон и порядок, — не сводя его к общему обозначению злых людей.
- source_word: συντέλεια
  choice: конец
  rationale: В данном контексте слово указывает на окончательную участь или исход. «Конец» естественно звучит по-русски и сохраняет предельный смысл греческого слова.
- source_word: φλὸξ πυρός
  choice: пламя огня
  rationale: Буквальное поэтическое сочетание сохраняет эмфатический образ оригинала и уместно в литературе Премудрости.
theological_decisions:
- issue: Следует ли смягчить значение ἀνόμων до общего нравственного обозначения
  choice: беззаконников
  alternative: нечестивых; злодеев
  rationale: Греческое слово подчёркивает пренебрежение законом, а не просто общую порочность. Выбранный вариант сохраняет эту этико-правовую грань без привнесения позднейших доктринальных смыслов.
- issue: Следует ли раскрывать сжатую греческую метафору пояснительным переводом
  choice: словно связка пакли
  alternative: собрание беззаконников — собранная вместе пакля
  rationale: Слово «связка» умеренно раскрывает значение причастия συνηγμένον и делает образ понятным современному читателю, не превращая его в разъясняющий пересказ.
- issue: Согласование αὐτῶν с собранием или с беззаконниками
  choice: конец их
  alternative: конец его
  rationale: Греческое αὐτῶν стоит во множественном числе и естественно отсылает к беззаконникам как членам собрания. Форма «их» сохраняет это напряжение между собранием как целым и участью составляющих его людей.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Пакля» — точное предметное слово; значение при необходимости поясняется сноской. Поэтическое «пламя огня» намеренно сохраняет выразительную форму греческого текста.
