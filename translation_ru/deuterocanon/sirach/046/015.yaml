  text: By the faithfulness of his mouth he was sought out as a seer[c][b][a], and also by his word he was found faithful as a shepherd.
translation:
  language: ru
  text: Благодаря верности его уст к нему обращались как к провидцу[a][b], и по слову своему он оказался верным пастырем[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодаря вере его уст»; однако еврейское выражение естественнее понимать как верность или надёжность его речи.'
    reason: lexical_alternative
  - marker: b
    text: В греческом тексте — «пророк», тогда как в еврейском — «провидец».
    reason: alternative_reading
  - marker: c
    text: 'Вторая часть еврейской фразы синтаксически сжата; возможный смысл: «по его слову он был признан верным пастырем».'
    reason: textual_variant
lexical_decisions:
- source_word: באמונת
  choice: благодаря верности
  rationale: אֱמוּנָה здесь обозначает надёжность, верность; сочетание с «его устами» указывает прежде всего на достоверность речи, а не на внутреннюю веру.
- source_word: פיו
  choice: его уст
  rationale: Сохранён телесный образ еврейского текста и его параллелизм со «словом» во второй части; «уста» естественно для возвышенной русской речи.
- source_word: דרוש
  choice: к нему обращались
  rationale: Пассивное значение от דרש передаёт обращение за ответом или советом; это естественнее по-русски, чем буквальное «он был разыскиваем».
- source_word: חזה
  choice: провидец
  rationale: Передаёт более узкое еврейское обозначение человека, получающего видения, не заменяя его более общим греческим «пророк».
- source_word: וגם
  choice: и
  rationale: Союз сохраняет добавочное продолжение мысли; отдельное «также» в русском предложении было бы стилистически тяжеловесно.
- source_word: בדברו
  choice: по слову своему
  rationale: Сохраняет ключевой образ «слова» и допускает инструментальный смысл предлога ב; возвратное местоимение естественно соотносит слово с подлежащим.
- source_word: נאמן
  choice: оказался верным
  rationale: Передаёт качество надёжности и осторожно восполняет сжатую именную конструкцию; «оказался» выражает засвидетельствованный характер, не утверждая формального признания.
- source_word: רועה
  choice: пастырем
  rationale: Сохранена метафора пастуха-руководителя; «пастырь» соответствует достоинству контекста и остаётся понятным современному читателю.
theological_decisions:
- issue: Значение אמונה / πίστις
  choice: верность
  alternative: вера; надёжность
  rationale: Связь с «устами» делает наиболее вероятной характеристику достоверности речи. Альтернатива «вера» сохранена в примечании, поскольку формально возможна.
- issue: Еврейское חזה и греческое προφήτης
  choice: провидец
  alternative: пророк
  rationale: Основной текст следует сохранившемуся еврейскому чтению, а более общее греческое соответствие отмечено в сноске.
- issue: Сжатый синтаксис второй части
  choice: по слову своему он оказался верным пастырем
  alternative: по его слову он был признан верным пастырем; в слове своём он был верным пастырем
  rationale: Еврейская фраза допускает эллипсис и не вполне однозначно выражает отношение между «словом», «верным» и «пастырем». Основной текст даёт связное чтение, не вводя идеи официального признания; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой («уста», «провидец», «пастырь»). Формулировка остаётся доступной обычному читателю; параллелизм «уста — слово» и пастырский образ сохранены.
