base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/006.yaml
  text: He hurled destruction on an enemy nation[a], and as they fled he wiped them all out, so that every nation might know their ban[b], for Yahweh watches over their battle.
translation:
  language: ru
  text: Он обрушил гибель[c] на вражеский народ и во время их бегства уничтожил их всех, чтобы каждый народ узнал о предании уничтожению[a], ибо Яхве наблюдает за их битвой.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское חרם (хе́рем) — термин, обозначающий посвящение или предание уничтожению в контексте Божьего суда и войны. Еврейская фраза предельно сжата; буквально: «чтобы каждый народ узнал херем».'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст заметно отличается: в нём говорится, что он обрушил войну на народ и при их падении уничтожил сопротивлявшихся, чтобы народы узнали их всеоружие; далее сказано, что его война была пред лицом Господа и что он следовал за Владыкой.'
    reason: alternative_reading
  - marker: c
    text: В сохранившемся еврейском тексте прямое дополнение к глаголу «обрушил» не выражено. Слово «гибель» восстановлено по военному контексту; греческий параллельный текст вместо этого имеет «войну».
    reason: textual_note
lexical_decisions:
- source_word: השליך על גוי אויב
  choice: обрушил погибель на вражеский народ
  rationale: Глагол השליך передаёт резкое бросание или низвержение; дополнение «погибель» восстановлено по военному контексту, поскольку в дошедшем еврейском тексте прямой объект не выражен.
- source_word: ובנוסם
  choice: когда враги бежали
  rationale: Конструкция обозначает обстоятельство времени. Явное «враги» вместо местоимения устраняет неясность русского текста, не добавляя нового участника.
- source_word: האביד כולם
  choice: уничтожил их всех
  rationale: Порода hифиль глагола אבד означает «погубить, уничтожить», а כולם подчёркивает полноту действия.
- source_word: כל גוי
  choice: каждый народ
  rationale: Сочетание כל с существительным в единственном числе имеет распределительное значение.
- source_word: חרם
  choice: заклятие
  rationale: «Заклятие» сохраняет особый смысл посвящения уничтожению под Божьим судом и не сводит термин к общему слову «гибель».
- source_word: כי צופה יהוה מלחמתם
  choice: ибо Яхве следит за их битвой
  rationale: צפה означает наблюдать, нести дозор; перевод сохраняет прямое значение без однозначного истолкования как покровительства. Суффикс в מלחמתם передан местоимением «их».
theological_decisions:
- issue: Сжатая и неоднозначная фраза כל גוי חרם
  choice: «чтобы каждый народ познал заклятие»
  alternative: «чтобы каждый народ узнал об их обречении на уничтожение»
  rationale: В еврейском тексте при חרם нет выраженного притяжательного суффикса, а синтаксис предельно сжат. Основной текст сохраняет эту сжатость и богословски значимый термин, а примечание раскрывает его смысл.
- issue: Расхождение еврейского текста и греческого параллельного свидетельства
  choice: Основной перевод следует еврейскому тексту; греческое чтение отмечено в сноске.
  alternative: Перевести по греческому тексту, упомянув войну, противившихся и битву пред Господом.
  rationale: Сохранившийся еврейский свидетель имеет приоритет, но заметно отличающийся греческий текст важен для истории передачи и не должен быть скрыт.
- issue: Смысл צופה применительно к участию Яхве в битве
  choice: «следит за их битвой»
  alternative: «охраняет их в битве»
  rationale: Нейтральное «следит» сохраняет возможность активного надзора, но не превращает неоднозначный глагол в однозначное обещание защиты.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. «Познáл» сохраняет торжественность и краткость трудной еврейской фразы; «уничтожил их всех» точно и сдержанно передаёт военную сцену. Имя יהוה передано как «Яхве».
