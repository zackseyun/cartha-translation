revisions:
- from: Он обрушил погибель на вражеский народ и, когда враги бежали, уничтожил их всех, чтобы каждый народ познал заклятие[a], ибо Яхве следит за их битвой.[b]
  to: Он обрушил гибель[c] на вражеский народ и во время их бегства уничтожил их всех, чтобы каждый народ узнал о предании уничтожению[a], ибо Яхве наблюдает за их битвой.[b]
  rationale: Исправлены неточная русская передача חרם и неестественное выражение «познал заклятие». Восстановленное по контексту слово «гибель» сохранено для связности, но его отсутствие в еврейском тексте теперь прозрачно отмечено. Греческое разночтение передано точнее. Смысл, степень исторической напряжённости и синтаксическая сжатость еврейского текста не сглаживаются.
  reviewer_model: gpt-5.6-terra
