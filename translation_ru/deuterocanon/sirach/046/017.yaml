base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/017.yaml
  text: In a mighty crash his voice was heard[a], and the leaders of the foe were subdued[c][b], and all the rulers of the Philistines perished.
translation:
  language: ru
  text: С могучим грохотом раздался Его голос[a], и вожди врага были покорены[b], и погибли все правители филистимлян[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально еврейский текст говорит о «могучем грохоте»; греческая параллель выражается яснее: Господь возгремел с неба и дал услышать Свой голос в великом шуме.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «гарнизоны врага», если נציבי понимать не как обозначение вождей, а как военный термин для поставленных постов или гарнизонов.'
    reason: lexical_alternative
  - marker: c
    text: '«Правители филистимлян» — особый филистимский титул, известный также по Первой книге Царств; возможный перевод: «владыки филистимлян».'
    reason: cross_reference
lexical_decisions:
- source_word: בפרע אדיר
  choice: при могучем грохоте
  rationale: Еврейское выражение трудно и, вероятно, текстуально не вполне устойчиво; в контексте и с учётом греческой параллели оно обозначает мощное звуковое явление. «При могучем грохоте» сохраняет силу образа, не вводя прямо слово «гром», которого в данном еврейском тексте нет.
- source_word: נשמע קולו
  choice: раздался Его голос
  rationale: Естественная русская передача пассивной конструкции «его голос был услышан»; заглавная буква указывает на Бога как на контекстуальный референт, подтверждаемый греческой параллелью.
- source_word: ויכנע
  choice: были покорены
  rationale: Глагол выражает унижение, подчинение или усмирение; «были покорены» естественно звучит в военном контексте.
- source_word: נציבי צר
  choice: вожди врага
  rationale: נציב может означать начальника, поставленного правителя либо гарнизон/пост. Личное значение поддерживается параллельной строкой о правителях филистимлян; צר передано собирательным единственным числом «враг».
- source_word: ויאבד
  choice: погибли
  rationale: Форма передана непереходно, что сохраняет непосредственный акцент на участи филистимских правителей и не уточняет отдельно действующее лицо.
- source_word: סרני פלשתים
  choice: правители филистимлян
  rationale: סרנים — известный титул филистимских властителей. «Правители» ясно и современно передаёт функцию, не привнося феодальных оттенков слова «лорды».
theological_decisions:
- issue: К кому относится «Его голос»
  choice: К Богу
  alternative: Голос может восприниматься как косвенно связанный с молитвой или действием Самуила.
  rationale: Греческая параллель прямо говорит, что Господь возгремел с неба и сделал Свой голос слышимым; окружающий контекст также повествует о том, как Самуил воззвал к Господу против врагов Израиля. Заглавная буква делает контекстуальный референт ясным, не добавляя имени в основной текст.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным ритмом. Сохранена трёхчастная поэтическая последовательность еврейского текста. Неясности трудного начального выражения и слова נציבי вынесены в примечания; греческая параллель используется для контекстуального уточнения, но не заменяет основной еврейский текст.
