base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/011.yaml
  text: And the judges, each by his own name—everyone whose heart was not led astray and who did not turn away from God—may their memory be for blessing.
translation:
  language: ru
  text: И судьи — каждый по имени, все те, чьи сердца не уклонились[a] и которые не отступили от Бога[b], — да будет благословенна память о них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «все, кто не вознёс своего сердца». Греческая параллель читает: «чьё сердце не впало в неверность», что, вероятно, поясняет подразумеваемый здесь смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом тексте: «не отступили от Господа»; в данном еврейском свидетельстве — «от Бога».'
    reason: alternative_reading
lexical_decisions:
- source_word: והשופטים
  choice: И судьи
  rationale: В контексте речь идёт о судьях — вождях Израиля эпохи Судей; это прямое значение еврейского слова, подтверждаемое греческим οἱ κριταί.
- source_word: איש בשמו
  choice: каждый по имени
  rationale: Естественно передаёт мысль об индивидуальном поминовении каждого судьи и сохраняет смысл еврейской идиомы.
- source_word: כל אשר לא נשא לבו
  choice: все, чьё сердце не уклонилось
  rationale: Еврейский текст буквально допускает понимание «не вознёс своего сердца», однако греческая параллель указывает на сердце, не впавшее в неверность. «Не уклонилось» сохраняет образ сердца и выражает верность, не усиливая метафору до буквального «не блудило».
- source_word: ולא נסוג מאחרי אל
  choice: и кто не отступил от Бога
  rationale: Глагольное сочетание означает отступить или повернуть назад, перестав следовать. Основной еврейский свидетель читает אל — «Бог».
- source_word: יהי זכרם לברכה
  choice: да будет память о них благословенна
  rationale: Достойная и естественная русская передача пожелания благословенной памяти; она сохраняет молитвенно-пожелательный оттенок еврейского выражения.
theological_decisions:
- issue: Наименование Бога в выражении об отступлении
  choice: Бог
  alternative: Господь
  rationale: Основной еврейский текст содержит אל («Бог»), тогда как греческая параллель — Κυρίου («Господь»). В основном тексте предпочтён еврейский свидетель, а вариант греческого сохранён в примечании.
- issue: Смысл выражения о сердце
  choice: чьё сердце не уклонилось
  alternative: кто не вознёс своего сердца
  rationale: Переданный еврейский текст неоднозначен и буквально может относиться к возношению сердца, но греческий параллельный текст понимает выражение как неверность или уклонение. Основной перевод следует вероятному контекстуальному смыслу, а буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сохраняет перечислительно-поминальную форму оригинала; формулировки понятны широкому читателю без конфессионально окрашенной терминологии.
