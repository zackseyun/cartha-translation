  text: In the sight of every living thing—and even after his death he was sought out.[a]
translation:
  language: ru
  text: На глазах у всех живущих — и даже после смерти к нему обращались.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий параллельный текст разворачивает эту мысль: «После того как он уснул, он пророчествовал, возвестил царю его конец и поднял из земли свой голос в пророчестве, чтобы изгладить беззаконие народа». Вероятно, это поясняет еврейские слова «к нему обращались»: Самуила вопрошали после его смерти.'
    reason: alternative_reading
lexical_decisions:
- source_word: ובעיני
  choice: На глазах у
  rationale: Естественно передаёт еврейскую идиому «в глазах» и сохраняет публичный, наблюдаемый характер сказанного.
- source_word: כל חי
  choice: всех живущих
  rationale: Передаёт широкий охват выражения, при этом по-русски естественно относится ко всем живым людям.
- source_word: וגם
  choice: и даже
  rationale: Сохраняет соединительное и усилительное значение, подчёркивая кульминационный переход к событиям после смерти.
- source_word: אחרי מותו
  choice: после смерти
  rationale: Краткое и естественное соответствие еврейскому временному обороту; принадлежность смерти Самуилу ясна из контекста.
- source_word: נדרש
  choice: к нему обращались
  rationale: Передаёт нифаль глагола דרש в значении обращения за ответом или советом. Формулировка сохраняет некоторую неоднозначность еврейского текста и звучит естественнее буквального «был разыскиваем».
theological_decisions:
- issue: Насколько явно передавать посмертное действие Самуила
  choice: 'В основном тексте сохранить краткость еврейского свидетельства: «после смерти к нему обращались».'
  alternative: 'Следовать развёрнутому греческому чтению: «после того как он уснул, он пророчествовал, возвестил царю его конец и поднял из земли свой голос в пророчестве, чтобы изгладить беззаконие народа».'
  rationale: Сохранившийся еврейский текст имеет приоритет и не уточняет способ посмертного обращения. Греческий параллельный текст существенно поясняет этот смысл, поэтому приведён в сноске, но не подменяет основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Тире передаёт смысловой перелом и усиление וגם; формулировка не вводит деталей, отсутствующих в еврейском тексте.
