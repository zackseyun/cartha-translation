base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/008.yaml
  text: Therefore those two also were spared[a], out of six hundred thousand foot soldiers, to bring them into an inheritance[b], into a land flowing with milk and honey.
translation:
  language: ru
  text: Поэтому и эти двое были сохранены[a] из шестисот тысяч пеших воинов, чтобы ввести их в землю, данную в наследие[b], текущую молоком и мёдом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение буквально содержит трудные слова «в годах»; возможно, имеется в виду, что эти двое были сохранены на протяжении многих лет или дожили до старости. В греческой параллели проще: «они, будучи двумя, спаслись».'
    reason: textual_variant
  - marker: b
    text: 'Греческая параллель продолжает: «чтобы ввести их в наследие, в землю, текущую молоком и мёдом». Вероятно, здесь сохранился полный конец стиха, тогда как дошедший до нас еврейский текст короче.'
    reason: alternative_reading
lexical_decisions:
- source_word: לכן
  choice: Поэтому
  rationale: Сохраняет причинно-следственную связь с предыдущей строкой об отвращении гнева и прекращении худой молвы.
- source_word: גם הם
  choice: и эти двое
  rationale: Контекст указывает на Иисуса Навина и Халева; числительное прямо поддерживается греческим καὶ αὐτοὶ δύο.
- source_word: בשנים נאצלו
  choice: были сохранены
  rationale: Трудное еврейское выражение, вероятно, говорит о сохранении в течение лет или до преклонного возраста. Основной текст передаёт несомненный смысл глагола, а неоднозначность временного оборота отмечена в сноске.
- source_word: משש מאות אלף רגלי
  choice: из шестисот тысяч пеших воинов
  rationale: רגלי обозначает идущих пешком и в данном военно-переписном контексте естественно передаётся как «пешие воины»; это подтверждает греческое πεζῶν.
- source_word: εἰσαγαγεῖν αὐτοὺς εἰς κληρονομίαν
  choice: чтобы ввести их в наследие
  rationale: Греческое продолжение сохраняет образ обетованной земли как наследия и восполняет более краткое сохранившееся еврейское чтение.
- source_word: εἰς γῆν ῥέουσαν γάλα καὶ μέλι
  choice: в землю, текущую молоком и мёдом
  rationale: Прямо передаёт устойчивый библейский образ обетованной земли.
theological_decisions:
- issue: Использование греческой параллели для восполнения краткого еврейского свидетеля
  choice: Следовать сохранившемуся еврейскому тексту как основному и включить греческое продолжение о введении в наследие — землю, текущую молоком и мёдом.
  alternative: Перевести только сохранившийся еврейский текст и закончить словами «из шестисот тысяч пеших воинов».
  rationale: Греческая параллель, вероятно, сохраняет полный конец стиха; её содержание согласуется с контекстом Иисуса Навина и Халева и не устраняет трудность еврейского оборота, которая отдельно отмечена.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка ясна широкому читателю; подлинная текстовая трудность не разрешается догматически, а вынесена в сноску. «Пешие воины» предпочтено более специальному «пехотинцы».
