  text: And at the time of his resting on his bed[b][a], he testified before Yahweh and his anointed one.
translation:
  language: ru
  text: И когда он лежал на своём ложе, призвал в свидетели ГОСПОДА и Его помазанника.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «помазанник» образовано от того же корня, что и «Мессия»; здесь выражение может относиться именно к помазанному ГОСПОДОМ правителю во дни Самуила.
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст здесь резко отличается от еврейского: «И сокрушил предводителей Тира и всех правителей филистимлян». Это указывает на существенное расхождение между еврейским и греческим текстовыми свидетельствами.'
    reason: textual_variant
lexical_decisions:
- source_word: ועת נוחו
  choice: И когда он упокоился
  rationale: Оборот вводит время действия. «Упокоился» передаёт נוח в контексте последнего покоя, не называя смерть прямо и сохраняя возвышенный повествовательный регистр.
- source_word: על משכבו
  choice: на своём ложе
  rationale: משכב буквально обозначает место, где лежат. «Ложе» естественно сочетается с «упокоился» и не вносит более определённого толкования «смертное ложе».
- source_word: העיד
  choice: засвидетельствовал перед
  rationale: Глагол допускает значения свидетельствовать, предостерегать или призывать в свидетели. Здесь сохранено прямое и контекстуально возможное значение «засвидетельствовал перед», не устраняя неоднозначность полностью.
- source_word: יהוה
  choice: ГОСПОДОМ
  rationale: Тетраграмматон передан традиционным русским соответствием «ГОСПОДЬ» с прописными буквами.
- source_word: ומשיחו
  choice: и Его помазанником
  rationale: משיח означает «помазанник». Перевод сохраняет титул и его связь с ГОСПОДОМ, не подменяя его именем и не придавая ему однозначно позднейшего мессианского смысла.
theological_decisions:
- issue: Значение משיחו
  choice: Его помазанником
  alternative: Его Мессией; Его царём
  rationale: «Помазанник» непосредственно передаёт еврейский титул и сохраняет историческую возможность отнесения к помазанному правителю времени Самуила, не исключая лексической связи со словом «Мессия».
- issue: Синтаксическая роль יהוה ומשיחו при העיד
  choice: засвидетельствовал перед ГОСПОДОМ и Его помазанником
  alternative: призвал ГОСПОДА и Его помазанника в свидетели
  rationale: Форма העיד допускает оба понимания. Основной текст следует засвидетельствованному консультационному решению «testified before», не превращая возможное значение «призвал в свидетели» в единственное.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Ложе» и «упокоился» соответствуют контексту последнего покоя, но перевод не вводит прямо отсутствующее в еврейском слово «смерть».
