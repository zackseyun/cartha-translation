  naturalness: «До часа своей кончины» и «в глазах Яхве» литературны; однако «оказался верным» несколько точечно передаёт длительную характеристику до конца жизни. «Оставался верным» естественнее в исправленном порядке и контексте. Формула «выступил против него» сохраняет широту еврейского выражения и звучит нормально.
  terminology: «Яхве» правильно передаёт יהוה. «Выкуп» допустимо сохраняет базовое лексическое значение כפר, хотя в контексте возможен смысл «взятка»; это следует оставить в сноске без догматического или чрезмерно определённого толкования. Греческий текст не следует подменять основным текстом, поскольку он существенно расширяет высказывание.
