base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/019.yaml
  text: 'Even up to the time of his end[1], he was found faithful in the eyes of Yahweh: “I have taken a ransom and hidden it—from whom have I taken anything? And no man answered against him.”'
translation:
  language: ru
  text: «Разве я взял выкуп и скрыл его? У кого я взял хоть что-нибудь?» И никто не выступил против него. И до часа своей кончины[a] он оставался верным в глазах Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст краток и в первой фразе не вполне ясен. Вопросительная форма («Разве я взял...?») передаёт вероятный риторический смысл; буквально текст говорит о «выкупе» и сокрытии. Слово כפר может означать «выкуп», а в данном контексте также «взятку». Слова «никто не выступил против него» могут иметь более узкий смысл: «никто не обвинил его». Греческое свидетельство значительно расширяет текст и иначе располагает его части: «Перед временем вечного сна он засвидетельствовал пред Господом и Его помазанником: “Ни денег, ни даже обуви я не взял ни от кого”, — и никто не обвинил его».'
    reason: Альтернативное чтение, вероятная вопросительная интерпретация и существенное расхождение с греческим свидетелем.
lexical_decisions:
- source_word: וגם עד עת קצו
  choice: Даже до часа своей кончины
  rationale: Следует краткому еврейскому чтению «и также до времени его конца». «Кончина» естественно и достойно передаёт קץ в данном контексте, не заимствуя расширенное греческое чтение о вечном сне.
- source_word: נכון נמצא
  choice: он оказался верным
  rationale: נכון обозначает твёрдость, надёжность, утверждённость. В похвале нравственной непорочности Самуила «верным» передаёт смысл естественно, не сводя слово только к одному оттенку.
- source_word: בעיני יהוה
  choice: в глазах Яхве
  rationale: Сохранена еврейская образность выражения בעיני и прямо передано собственное имя יהוה.
- source_word: כפר
  choice: выкуп
  rationale: «Выкуп» — прямое значение כפר; в контексте неподкупности слово может означать также незаконное вознаграждение, то есть взятку. Эта контекстуальная возможность отмечена в сноске.
- source_word: ונעלם
  choice: и скрыл его
  rationale: Глагольная форма выражает сокрытие. Местоимение «его» относится к выкупу и необходимо для естественного русского синтаксиса.
- source_word: ממי לקחתי
  choice: У кого я взял хоть что-нибудь?
  rationale: Еврейская фраза эллиптична. «Хоть что-нибудь» ясно передаёт риторическое отрицание, не добавляя конкретного предмета.
- source_word: וכל אדם לא ענה בו
  choice: И никто не выступил против него
  rationale: ענה с предлогом ב допускает смысл ответа или свидетельства против кого-либо. Русское «выступил против него» сохраняет некоторую широту выражения; более узкий судебный смысл «обвинил» отмечен в сноске.
theological_decisions:
- issue: Передача имени Бога
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон יהוה; передача «Яхве» сохраняет личное заветное имя.
- issue: Связь цитаты с оценкой Самуила
  choice: Сохранить цитату как свидетельство его неподкупности, не разворачивая её в отдельное юридическое или догматическое утверждение
  alternative: Полностью истолковать речь как судебное самооправдание во взяточничестве либо привести её к расширенному греческому тексту
  rationale: Еврейский текст хвалит верность Самуила и приводит риторическое отрицание нечестной наживы, но остаётся кратким и местами неоднозначным.
- issue: Пунктуация первой части цитаты
  choice: 'Оформить как риторический вопрос: «Разве я взял выкуп и скрыл его?»'
  alternative: 'Читать как утверждение: «Я взял выкуп и скрыл его»'
  rationale: Без вопросительной пунктуации фраза звучала бы как признание и противоречила бы следующему вопросу и отсутствию обвинителя. В древнееврейском вопрос может передаваться без специальной частицы; добавленное «разве» делает подразумеваемую риторичность ясной, не устраняя лексическую неоднозначность כפר.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены еврейский образ «в глазах Яхве» и краткость свидетельства; эллипсис прояснён лишь настолько, насколько это необходимо для понятного русского текста.
