lexical_decisions:
- source_word: מה נהדר
  choice: Как славен был он
  rationale: Еврейское восклицание выражает восхищение воинской доблестью Иисуса Навина. «Как славен» естественно передаёт похвальный смысл и согласуется с греческим ἐδοξάσθη, не превращая славу в специальное богословское понятие.
- source_word: בנטותו יד
  choice: когда простирал руку
  rationale: Инфинитивная конструкция обозначает обстоятельство действия. «Простирал руку» сохраняет еврейский телесный и воинский образ; греческая параллель говорит о поднятии рук.
- source_word: בהניפו כידון
  choice: когда взмахивал копьём
  rationale: Глагол הניף означает поднимать или совершать размахивающее движение, а כידון — копьё либо метательное копьё. «Взмахивал копьём» ясно и образно передаёт действие без лишнего уточнения типа оружия.
- source_word: על עיר
  choice: против города
  rationale: В военном контексте предлог על выражает направленность враждебного действия; единственное число еврейского текста сохранено.
theological_decisions:
- issue: Расхождение еврейского и греческого свидетельств в названии оружия и числе объектов
  choice: В основном тексте следовать еврейскому чтению «копьём против города»
  alternative: 'Греческая параллель: «мечом против городов»'
  rationale: Сохранившийся еврейский текст имеет высокую степень надёжности и даёт связное чтение; греческий вариант отмечен в сноске как значимое текстовое расхождение.
- issue: Оттенок похвального выражения מה נהדר
  choice: Передать как «Как славен был он»
  alternative: «Как величественен он был» или «Как великолепен он был»
  rationale: Выбранная формулировка передаёт восхищение героем и близка греческому глаголу со значением прославления, не добавляя к тексту конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Синтаксический параллелизм еврейского текста сохранён; архаизмы и узкоконфессиональная лексика не используются.
