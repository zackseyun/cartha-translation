  text: Was it not by his hand that the sun stood still[b][a], and one day was like two?
translation:
  language: ru
  text: Не его ли рукой солнце остановилось[b], и один день стал как два[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть: «один день стал как два дня». В еврейском тексте сказано короче — «как два»; слово «дня» подразумевается из контекста.'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду победа Иисуса Навина, во время которой солнце остановилось; см. Нав 10:12–14.
    reason: cross_reference
lexical_decisions:
- source_word: הלא
  choice: Не ... ли
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, естественной русской конструкцией.
- source_word: בידו
  choice: по его слову
  rationale: Буквально «в его руке / посредством его руки»; в данном контексте выражает действенное распоряжение Иисуса Навина. «По его слову» естественно по-русски и сохраняет личную действенность, не приписывая физическое удержание солнца рукой.
- source_word: עמד
  choice: остановилось
  rationale: В сочетании с солнцем глагол означает прекращение движения; это согласуется и с греческим параллельным текстом, и с аллюзией на Нав 10.
- source_word: השמש
  choice: солнце
  rationale: Прямое соответствие еврейскому существительному.
- source_word: יום אחד
  choice: один день
  rationale: Прямо передаёт еврейское словосочетание, сохраняя числовое противопоставление «один — два».
- source_word: כשנים היה
  choice: стал как два
  rationale: Еврейский текст буквально говорит «был/стал как два», оставляя слово «дня» подразумеваемым. Русское «стал как два» сохраняет лаконизм и допускаемую глаголом היה динамику результата.
theological_decisions:
- issue: Чудо с остановившимся солнцем при Иисусе Навине
  choice: Передать как прямое утверждение поэтического повествования, не сводя его к метафоре или естественному явлению.
  alternative: Истолковать как поэтическую гиперболу о продолжительном свете или военной победе.
  rationale: И еврейский текст, и греческий параллельный текст прямо говорят об остановке солнца и об одном дне, ставшем как два; перевод не должен заранее разрешать напряжение текста.
- issue: Посредничество Иисуса Навина в чуде
  choice: «по его слову»
  alternative: «его рукой» / «через него»
  rationale: Сохраняется представление о событии, совершившемся по его действенному повелению, без неестественного для русского языка образа физического воздействия рукой.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Риторический вопрос сохранён; синтаксис краткий и ясный. Маркеры сносок поставлены непосредственно после относящихся к ним выражений.
