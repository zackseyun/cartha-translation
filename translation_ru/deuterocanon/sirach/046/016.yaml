base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/016.yaml
  text: He too called upon God when his enemies hemmed him in all around[a]; when he offered a milk-fed lamb[b], Yahweh thundered from heaven.
translation:
  language: ru
  text: И он тоже воззвал к Богу, когда враги теснили его со всех сторон[a]; когда он принёс в жертву молочного ягнёнка[b], Яхве возгремел с небес.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст в этом месте труден, и его точный смысл неясен. Он, вероятно, связан с врагами, находившимися вокруг него; греческий параллельный текст также содержит упоминание врагов «со всех сторон», но допускает иное синтаксическое понимание.
    reason: textual_variant
  - marker: b
    text: 'Или: «ягнёнка-сосунка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קרא אל אל
  choice: воззвал к Богу
  rationale: Оборот קרא אל обозначает обращение к кому-либо с призывом о помощи или в молитве; «воззвал к Богу» естественно и достойно передаёт этот смысл.
- source_word: כאפכה לו אויביו מסביב
  choice: когда враги теснили его со всех сторон
  rationale: Сохранившаяся еврейская форма трудна, однако контекст и греческое θλίψαι ... κυκλόθεν поддерживают смысл вражеского давления и окружения; перевод сохраняет эту вероятную семантику, не скрывая текстовой неясности в примечании.
- source_word: בעלתו
  choice: когда он принёс в жертву
  rationale: Форма еврейского текста необычна; греческое ἐν προσφορᾷ подтверждает контекст жертвоприношения. Глагольная передача ясно связывает действие со следующим дополнением.
- source_word: טלה חלב
  choice: молочного ягнёнка
  rationale: Сочетание указывает на молодого ягнёнка, ещё питающегося молоком. «Молочный ягнёнок» кратко и понятно; возможное «ягнёнок-сосунок» дано в примечании.
- source_word: וירעם משמים יהוה
  choice: Яхве возгремел с небес
  rationale: רעם означает громыхать, греметь; «возгремел» сохраняет образ громового ответа с неба. יהוה передано личным именем «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; форма «Яхве» передаёт личное имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; «воззвал» и «возгремел» сохраняют достоинство и образность исходного текста.
