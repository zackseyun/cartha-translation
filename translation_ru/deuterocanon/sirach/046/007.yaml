base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/007.yaml
  text: Also[a], because he fully followed God, and in the days of Moses showed loyalty—he and Caleb son of Jephunneh—by standing firm against the assembly's rebellion, to keep the people from sin and to silence wicked grumbling.
translation:
  language: ru
  text: Он всецело следовал за Богом и во дни Моисея проявил верность; он и Халев, сын Иефоннии, твёрдо выступили против мятежа общины, чтобы удержать народ от греха и прекратить злой ропот.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст сжат и местами неясен; буквально возможно: «твёрдо выступить при мятеже общины». Греческий текст пространнее: «выступить против врага, удержать народ от греха и прекратить злой ропот». Последние две фразы основного текста переведены по греческому свидетельству. Выражение «проявил верность» можно также перевести: «проявил милость».'
    reason: Текстологический вариант и лексическая альтернатива.
lexical_decisions:
- source_word: מלא אחרי אל
  choice: всецело следовал за Богом
  rationale: Еврейская идиома выражает полное, безраздельное следование Богу; перевод сохраняет её библейскую окраску и остаётся естественным по-русски.
- source_word: עשה חסד
  choice: проявил верность
  rationale: Хотя חסד и греческое ἔλεος могут означать милость, в рассказе о поведении Иисуса Навина и Халева уместнее значение преданной, верной стороны действия.
- source_word: להתיצב
  choice: твёрдо встав
  rationale: Передаёт как буквальное выступление, так и решительное нравственное противостояние.
- source_word: בפרע קהל
  choice: против мятежа общины
  rationale: Сжатая и несколько неясная еврейская формулировка, вероятно, описывает противостояние общинному бунту; греческая параллель подтверждает направленность противостояния, хотя читает «против врага».
- source_word: κωλῦσαι λαὸν ἀπὸ ἁμαρτίας
  choice: чтобы удержать народ от греха
  rationale: Прямо передаёт греческую целевую конструкцию, вероятно сохраняющую более полный текст стиха.
- source_word: κοπάσαι γογγυσμὸν πονηρίας
  choice: прекратить злой ропот
  rationale: Сохраняет образ ропота в пустыне и нравственную оценку греческого πονηρίας.
theological_decisions:
- issue: Дополнение сжатого еврейского текста по греческой параллели
  choice: В основной текст включены греческие целевые фразы «чтобы удержать народ от греха и прекратить злой ропот».
  alternative: Ограничиться сохранившимся еврейским текстом и завершить стих словами «твёрдо встав против мятежа общины».
  rationale: Еврейский свидетель первичен, однако отмечен как сжатый и имеющий небольшое расхождение; греческая версия, использованная как полноценное параллельное свидетельство, вероятно сохраняет продолжение. Сочетание источников обозначено сноской, чтобы не скрывать текстологическую сложность.
- issue: Значение חסד / ἔλεος
  choice: проявил верность
  alternative: проявил милость
  rationale: Контекст подчёркивает верное поведение во время мятежа, но возможное значение «милость» сохранено в сноске без устранения лексической неоднозначности.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Имя Χαλέβ передано в принятой русской библейской форме «Халев», Ἰεφοννή — «Иефонния». Синтаксис сохраняет вставное уточнение о Халеве и не скрывает сочетание еврейского и греческого свидетельств.
