base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/005.yaml
  text: For he called on God Most High when his enemies pressed him from all around[a], and God Most High answered him with hailstones and ice-stones.
translation:
  language: ru
  text: Ибо он воззвал к Богу Всевышнему, когда враги теснили его со всех сторон, и Бог Всевышний ответил ему камнями града и льда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «великий Господь услышал его (или их) камнями града, с могучей силой». Здесь перевод следует прежде всего еврейскому свидетельству; греческий текст рисует более развёрнутую картину явления Бога в буре.'
    reason: alternative_reading
lexical_decisions:
- source_word: קרא אל
  choice: воззвал к
  rationale: Сочетание выражает обращение к Богу за помощью; «воззвал к» естественно для возвышенного повествования и соответствует греческому ἐπεκαλέσατο.
- source_word: אל עליון
  choice: Бог Всевышний
  rationale: Передаёт божественный титул в порядке еврейского текста и сохраняет его повторение в обеих частях стиха.
- source_word: כאכפה לו אויביו מסביב
  choice: когда враги теснили его со всех сторон
  rationale: Редкая или не вполне ясная еврейская форма описывает вражеское давление; греческое θλίψαι и κυκλόθεν подтверждает смысл притеснения и окружения.
- source_word: ויענהו
  choice: ответил ему
  rationale: Прямо передаёт еврейский глагол ענה; в контексте это действенный ответ на молитвенный призыв.
- source_word: באבני ברד
  choice: градовыми камнями
  rationale: 'Предлог ב имеет орудийное значение: Бог отвечает посредством грозного явления; выражение сохраняет образ камней града.'
- source_word: וא לגביש / ואלגביש
  choice: и ледяными глыбами
  rationale: Редкое слово גביש обозначает ледяное или кристаллическое вещество. Отличная от «града» передача сохраняет двойной образ еврейского текста, не сводя оба термина к одному.
theological_decisions:
- issue: Повторение божественного титула
  choice: Повторить «Бог Всевышний» в обеих частях
  alternative: Во второй части употребить только «Всевышний» или местоимение «Он»
  rationale: Еврейский текст повторяет אל עליון, подчёркивая, что отвечает тот же Бог, к которому герой воззвал; повторение сохранено без догматического уточнения.
- issue: Характер Божьего ответа
  choice: 'Сохранить инструментальное описание ответа: «ответил ему градовыми камнями и ледяными глыбами»'
  alternative: Истолковать как общее указание на могущественную грозу
  rationale: Еврейский текст называет конкретные средства ответа. Более развёрнутое греческое чтение отмечено в сноске, но не подменяет основной еврейский свидетель.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Воззвал» сохраняет молитвенный оттенок, а «теснили его со всех сторон» ясно передаёт одновременно давление и окружение. Сноска [a] поставлена непосредственно после относящегося к ней описания Божьего ответа.
