    issue: «Ледяными глыбами» чрезмерно конкретизирует גביש.
    rationale: Редкое слово связано со льдом/кристаллическим веществом, но еврейский текст не уточняет величину предметов. «Глыбы» вводит дополнительный смысл крупного размера. Нейтральное «камни льда» лучше сохраняет образ и неоднозначность.
  - severity: low
    issue: Формулировка греческой сноски «среди камней града» излишне локализует ἐν.
    rationale: В данном контексте греческий предлог может передавать средство или сопутствующее явление. «Камнями града, с могучей силой» точнее и не предполагает пространственного значения.
