translation:
  language: ru
  text: Кто мог устоять перед ним? Ведь он вёл войны Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «Кто мог устоять перед ним? Ведь он вёл войны Яхве». Греческая параллель читается иначе, приблизительно: «Кто до него стоял так? Ведь Сам Господь навёл на него врагов». Основной текст следует еврейскому свидетельству.'
    reason: alternative_reading
lexical_decisions:
- source_word: מי הוא לפניו יתיצב
  choice: Кто мог устоять перед ним?
  rationale: Риторический вопрос передаёт невозможность противостоять описываемому герою. Модальное «мог» естественно выражает смысл еврейского оборота, а «устоять перед» сохраняет идею сопротивления.
- source_word: כי
  choice: Ведь
  rationale: Союз вводит основание предшествующего риторического вопроса; «ведь» ясно и естественно передаёт эту пояснительную связь.
- source_word: מלחמות
  choice: войны
  rationale: Форма множественного числа имеет широкий смысл; «битвы» неоправданно сузило бы его, а «военные походы» внесло бы отсутствующую конкретизацию.
- source_word: יהוה
  choice: Яхве
  rationale: Передаёт личное имя Бога, непосредственно присутствующее в еврейском тексте, не заменяя его титулом.
- source_word: נלחם
  choice: он вёл
  rationale: В сочетании с существительным «войны» глагол естественно переводится устойчивым русским выражением «вёл войны»; субъектом по контексту является восхваляемый герой.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский свидетель прямо употребляет личное имя Бога. Выбор «Яхве» сохраняет это лексическое различие, тогда как греческая параллель использует титул Κύριος.
- issue: Кто является субъектом נלחם
  choice: Герой стиха с местоимением «он»
  alternative: Яхве как субъект
  rationale: 'Порядок и синтаксис еврейского текста естественно дают смысл «он вёл войны Яхве»: יהוה определяет принадлежность войн. Такая формулировка сохраняет богословское напряжение между действиями героя и тем, что войны принадлежат Богу.'
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. «Вёл войны» звучит естественно и сохраняет широкий смысл оригинала; архаизмы и конфессионально окрашенные добавления не используются.
