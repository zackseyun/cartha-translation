translation:
  language: ru
  text: чтобы всё потомство Иакова знало, что хорошо всецело следовать за ГОСПОДОМ[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «все сыны Израиля» — вместо «всё потомство Иакова».'
    reason: alternative_reading
  - marker: b
    text: Еврейское выражение, переданное словами «всецело следовать за», необычно; греческий текст поддерживает значение «идти, следовать за Господом».
    reason: textual_variant
lexical_decisions:
- source_word: למען דעת
  choice: чтобы… знало
  rationale: Целевая конструкция с למען естественно передаётся союзом «чтобы»; דעת выражает предполагаемое знание как результат или цель.
- source_word: כל זרע יעקב
  choice: всё потомство Иакова
  rationale: זרע буквально означает «семя», но здесь собирательно обозначает потомков. «Потомство» сохраняет семейно-заветный оттенок и следует еврейскому чтению «Иаков».
- source_word: כי טוב
  choice: что хорошо
  rationale: Оборот вводит содержание того, что должно узнать потомство Иакова, и сохраняет прямую оценочную формулировку.
- source_word: למלא אחרי
  choice: всецело следовать за
  rationale: Необычный еврейский оборот в данном контексте выражает полную, нераздельную верность в следовании; наречие «всецело» передаёт силу מלא, а «следовать за» согласуется с греческим πορεύεσθαι ὀπίσω, не сводя образ к отвлечённому «повиноваться».
- source_word: יהוה
  choice: ГОСПОДОМ
  rationale: Тетраграмматон передан традиционным русским соответствием «ГОСПОДЬ» с прописным написанием, позволяющим отличить божественное имя от обычного титула.
theological_decisions:
- issue: «Потомство Иакова» в еврейском тексте и «сыны Израиля» в греческом
  choice: всё потомство Иакова
  alternative: все сыны Израиля
  rationale: Приоритет отдан сохранившемуся еврейскому свидетельству כל זרע יעקב; греческое разночтение отмечено в сноске, поскольку оно относится к обозначению той же общности, но формально отличается.
- issue: Передача оборота למלא אחרי
  choice: всецело следовать за ГОСПОДОМ
  alternative: идти вслед за Господом; быть вполне послушным Господу
  rationale: Выбранная формулировка сохраняет и значение полноты, выраженное מלא, и образ следования, поддержанный греческим параллельным текстом. Она не устраняет идиоматическое напряжение в пользу чисто абстрактного понятия послушания.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная и достойная формулировка. «Всё потомство» употреблено как собирательное единственное число. Прописное «ГОСПОДЬ» обозначает передачу тетраграмматона.
