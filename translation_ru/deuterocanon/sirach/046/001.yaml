base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/001.yaml
  text: Joshua son of Nun was a mighty warrior[a], Moses’ attendant in prophecy[b]; he was appointed in his days to be a great salvation for his chosen ones.
translation:
  language: ru
  text: Могучий воин Иисус, сын Навина, служитель Моисея в пророчестве[a]. Он был создан, чтобы в свои дни стать великим спасением для его избранных[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «преемник Моисея в пророчествах»; так связь Иисуса Навина с Моисеем представлена более явно как преемство, чем в сохранившемся еврейском тексте.'
    reason: alternative_reading
  - marker: b
    text: «Великое спасение» можно также перевести как «великое избавление» или «великая победа». Еврейское תשועה и греческое σωτηρία могут обозначать как военное избавление, так и спасение в более широком смысле. Суффикс в выражении «его избранных» формально допускает более одного референта.
    reason: lexical_alternative
lexical_decisions:
- source_word: גבור בן חיל
  choice: могучий воин
  rationale: Еврейское сочетание описывает сильного и доблестного воина; греческое κραταιὸς ἐν πολέμῳ подтверждает военный смысл.
- source_word: משרת משה
  choice: служитель Моисея
  rationale: משרת обозначает человека, исполняющего официальное служение при другом лице. «Служитель» сохраняет достоинство роли и не сводит её к бытовой прислуге.
- source_word: בנבואה
  choice: в пророчестве
  rationale: Краткая и необычная еврейская формулировка допускает несколько оттенков. Буквальная передача сохраняет неопределённость относительно пророческого служения или преемства.
- source_word: אשר נוצר להיות
  choice: Он был создан, чтобы… стать
  rationale: נוצר, вероятно, является страдательной формой со значением «был создан, сформирован». Такая передача следует сохранившемуся еврейскому тексту и может подразумевать целенаправленное приготовление, не заменяя его более однозначным «назначен».
- source_word: בימיו
  choice: в свои дни
  rationale: Возвратное местоимение естественно связывает временное выражение с Иисусом Навином и сохраняет смысл «при его жизни, в его время».
- source_word: תשועה גדולה
  choice: великое спасение
  rationale: תשועה охватывает спасение, избавление и победу. «Спасение» сохраняет широкое значение слова, тогда как военный контекст остаётся очевидным из начала стиха.
- source_word: לבחיריו
  choice: для Его избранных
  rationale: Местоименный суффикс формально допускает неоднозначность, но, вероятнее всего, относится к Богу. Заглавная буква делает это естественное прочтение ясным в русском тексте; примечание отмечает грамматическую особенность.
theological_decisions:
- issue: Отношение Иисуса Навина к Моисею в выражении בנבואה
  choice: «служитель Моисея в пророчестве»
  alternative: «преемник Моисея в пророчествах»
  rationale: Греческий текст прямо говорит о преемнике, но сохранившийся еврейский — о служителе. Основной текст следует еврейскому свидетельству, не усиливая утверждение до преемства.
- issue: Смысл תשועה в военном контексте
  choice: «спасение»
  alternative: «избавление» или «победа»
  rationale: Термин включает военное избавление, но не ограничен значением победы; широкий вариант сохраняет исторический и богословский диапазон.
- issue: Референт суффикса в לבחיריו
  choice: Бог — «Его избранных»
  alternative: Избранные Иисуса Навина
  rationale: По смыслу речь, вероятнее всего, идёт о Божьих избранных, хотя ближайшая грамматическая связь сама по себе не устраняет неоднозначности полностью.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Традиционная русская форма имени «Иисус, сын Навина» обеспечивает узнаваемость. Необычное «в пророчестве» намеренно сохраняет сжатость и неоднозначность еврейского выражения.
