  yaml_path: translation/deuterocanon/sirach/046/009.yaml
  text: And he gave Caleb strength, and it remained with him until old age, so that he went up into the highlands of the land, and his offspring took possession of an inheritance.
translation:
  language: ru
  text: Господь дал Халеву силу, и она оставалась с ним до старости, так что он поднялся на горную высоту той земли, а его потомство овладело наследственным уделом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В сохранившемся еврейском тексте: «И дал Халеву силу, и до старости она оставалась с ним». Наименование Господа и заключительная часть стиха сохранены в древнем греческом переводе.'
    reason: Еврейский рукописный текст короче греческого параллельного свидетеля и не называет явно субъекта глагола.
lexical_decisions:
- source_word: עצמה / ἰσχύν
  choice: силу
  rationale: Прямой и естественный эквивалент еврейского и греческого слов; сохраняет связь силы с Халевом до старости.
- source_word: ὕψος τῆς γῆς
  choice: возвышенности страны
  rationale: Передаёт местность на высоте, куда поднялся Халев, без неестественного буквального выражения «высота земли».
- source_word: σπέρμα αὐτοῦ
  choice: его потомство
  rationale: Собирательное значение греческого «семя», то есть потомки Халева.
- source_word: κατέσχεν κληρονομίαν
  choice: овладело наследственным уделом
  rationale: Сохраняет одновременно идеи вступления во владение и полученного в наследие земельного удела.
theological_decisions:
- issue: Субъект действия «дал»
  choice: Господь
  alternative: Он
  rationale: В сохранившемся еврейском тексте субъект подразумевается контекстом, тогда как греческий параллельный текст прямо называет Господа; явное наименование устраняет неясность местоимения, не вводя конфессионального толкования.
- issue: Полнота стиха при расхождении свидетелей
  choice: Включить заключительную часть по греческому тексту
  alternative: Ограничиться сохранившимся еврейским предложением
  rationale: Греческий свидетель сохраняет продолжение о восхождении Халева и уделе его потомства; оно согласуется с библейским повествованием и с полнотой данного стиха, а текстологическое различие отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и достойное, с умеренно библейской лексикой «наследственный удел». Имя Χαλέβ передано в привычной русской библейской форме «Халев».
