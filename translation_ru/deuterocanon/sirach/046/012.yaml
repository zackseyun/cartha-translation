base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/012.yaml
  text: May their bones blossom like a lily[c][b][a], and may their name be renewed in their sons.
translation:
  language: ru
  text: Пусть их кости расцветут, словно лилия[a][b], и пусть их имя обновится в их сыновьях[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское שושנה, вероятнее всего, означает «лилия»; встречается также перевод «роза».
    reason: lexical_alternative
  - marker: b
    text: 'В греческом параллельном тексте после слов «их кости расцветут» добавлено: «из их места». В имеющемся еврейском тексте этих слов нет.'
    reason: alternative_reading
  - marker: c
    text: 'Возможный перевод: «и пусть их имя передаётся их сыновьям». Глагол может выражать как обновление, так и преемственную передачу имени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תפרחנה
  choice: да расцветут
  rationale: Глагол פרח обозначает распускание и цветение. «Да расцветут» сохраняет пожелательный оттенок и яркий растительный образ.
- source_word: עצמותם
  choice: их кости
  rationale: Сохранено конкретное значение еврейского слова; оно также прямо подтверждается греческим τὰ ὀστᾶ αὐτῶν.
- source_word: כשושנה
  choice: как лилия
  rationale: שושנה вероятнее всего обозначает лилию; перевод сохраняет прямое цветочное сравнение, не заменяя его более общим образом.
- source_word: ושמם
  choice: и их имя
  rationale: Библейская идиома «имя» сохраняет одновременно значения памяти, доброй славы и продолжения рода, не сводя выражение лишь к репутации.
- source_word: תחליף
  choice: да обновится
  rationale: Форма от חלף допускает оттенки обновления, смены и преемства. «Да обновится» передаёт продолжение имени в следующем поколении, не превращая образ в простую замену.
- source_word: לבניהם
  choice: в их сыновьях
  rationale: Еврейский текст прямо говорит о сыновьях. Предлог передан оборотом «в сыновьях», естественно выражающим продолжение имени в потомках.
theological_decisions:
- issue: Указание на потомков мужского пола
  choice: в их сыновьях
  alternative: в их детях / в их потомках
  rationale: בניהם — форма мужского рода со значением «их сыновья». Конкретность оригинала сохранена, хотя по смыслу речь идёт о продолжении рода.
- issue: Образ цветущих костей
  choice: да расцветут их кости, как лилия
  alternative: да произрастут их кости со своего места / да процветут их останки
  rationale: Перевод следует имеющемуся еврейскому тексту и сохраняет поэтическое напряжение образа, не истолковывая его однозначно как учение о телесном воскресении. Добавление греческого параллельного текста вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пожелательной конструкцией «да…». Сохранены конкретность слова «кости», цветочный образ и неоднозначность продолжения имени в потомках.
