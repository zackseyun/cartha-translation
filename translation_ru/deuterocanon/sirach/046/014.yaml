translation:
  language: ru
  text: По повелению Господа он давал общине повеления[a], и Бог Иакова посетил его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В дошедшем до нас еврейском тексте: «давал повеления общине»; в греческом параллельном тексте: «судил общину».'
    reason: alternative_reading
  - marker: b
    text: 'В еврейском тексте прямое дополнение при глаголе не названо; «его» в основном тексте — контекстуальное восполнение (Самуил). Глагол может также означать «обратить внимание» или «позаботиться». В греческом тексте сказано: «Господь посетил Иакова».'
    reason: textual_and_lexical_ambiguity
lexical_decisions:
- source_word: במצות
  choice: по повелению
  rationale: Предлог ב при מִצְוָה здесь выражает основание или норму действия; «по повелению» естественно передаёт эту связь по-русски.
- source_word: יהוה
  choice: Господа
  rationale: Тетраграмматон передан традиционным русским соответствием «Господь».
- source_word: צוה
  choice: давал повеления
  rationale: Основное значение засвидетельствованного еврейского глагола — «повелевать». Оборот сохраняет повтор корня со словом «повеление» и допускает естественное управление словом «община».
- source_word: עדה
  choice: общине
  rationale: עֵדָה обозначает собранную общину народа; «община» здесь современнее и точнее передаёт сообщество, чем обозначение единичного собрания.
- source_word: ויפקד
  choice: посетил его
  rationale: 'פקד имеет широкий диапазон значений: «посетить», «обратить внимание», «позаботиться», иногда «призвать к ответу». В благоприятном контексте «посетил» сохраняет традиционную образность и не уточняет характер Божьего вмешательства сверх источника.'
- source_word: אלהי יעקב
  choice: Бог Иакова
  rationale: Сохранён обычный библейский титул в форме родительного сочетания.
theological_decisions:
- issue: Расхождение между еврейским צוה («повелевал») и греческим ἔκρινεν («судил»)
  choice: 'Основной текст следует сохранившемуся еврейскому чтению: «давал повеления общине»'
  alternative: «судил общину»
  rationale: Еврейский текст ясен лексически, хотя греческое чтение лучше согласуется с ролью Самуила как судьи. Чтобы не исправлять первичный свидетель молча, еврейское чтение оставлено в тексте, а греческое отмечено в сноске.
- issue: Неуказанный объект глагола ויפקד
  choice: 'В основном тексте подразумевается Самуил: «посетил его»'
  alternative: «посетил Иакова» или «обратил внимание на Иакова»
  rationale: В еврейском после глагола стоит подлежащее «Бог Иакова», но прямой объект не выражен; ближайшим подразумеваемым лицом является Самуил. Греческий текст, напротив, явно называет Иакова объектом. Неопределённость раскрыта в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Повтор «по повелению — давал повеления» намеренно отражает еврейский корневой повтор; неоднозначности еврейского и греческого свидетельств не устранены молча.
