  to: Любимый своим народом и угодный своему Создателю, испрошенный ещё во чреве матери, Самуил — назирей Яхве в пророческом служении — был судьёй и совершал священническое служение; по слову Бога он утвердил царство и помазал правителей над народом.[a]
