base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/046/013.yaml
  text: Beloved by his people and pleasing to his Maker[a], asked for from his mother's womb, Samuel, a Nazirite of the Lord in prophecy, judged and served as priest; by the word of God he established the kingdom, and anointed rulers over his people.
translation:
  language: ru
  text: Любимый своим народом и угодный своему Создателю, испрошенный ещё во чреве матери, Самуил — назирей Яхве в пророческом служении — был судьёй и совершал священническое служение; по слову Бога он утвердил царство и помазал правителей над народом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст читается иначе: «Самуил, возлюбленный своим Господом, пророк Господа, установил царство и помазал правителей над своим народом». В нём нет слов о любви народа, испрошенности во чреве матери, назирействе, судействе и священническом служении; также он не содержит выражения «по слову Бога».'
    reason: alternative_reading
lexical_decisions:
- source_word: אוהב עמו ורצוי עושהו
  choice: любимый своим народом и угодный своему Создателю
  rationale: Передаёт две параллельные характеристики Самуила. Причастная форма «любимый» естественна по-русски, а «Создатель» точно выражает עושהו, буквально «Тот, кто создал его».
- source_word: המשואל מבטן אמו
  choice: испрошенный ещё во чреве матери
  rationale: Сохраняет пассивное значение «испрошенный» и вероятную игру с именем Самуила; «ещё» естественно передаёт указание на самое раннее время, не уточняя сверх текста, у кого именно он был испрошен.
- source_word: נזיר יהוה בנבואה
  choice: назорей Яхве в пророческом служении
  rationale: «Назорей» сохраняет конкретный религиозный оттенок נזיר, а не сводит его к общему «посвящённому». Необычное сочетание с בנבואה передано достаточно буквально, но понятно для современного читателя.
- source_word: שופט ומכהן
  choice: судил народ и служил как священник
  rationale: שופט обозначает деятельность судьи и правителя, а כהן — священническое служение. Дополнение «народ» делает русскую фразу естественной и явно передаёт управленческую функцию, не утверждая отдельного формального титула сверх текста.
- source_word: בדבר אל
  choice: словом Божьим
  rationale: 'Передаёт средство или основание действия: царство было утверждено по Божьему слову и Его властью. Краткая форма соответствует сжатому еврейскому выражению.'
- source_word: הכין ממלכת
  choice: утвердил царство
  rationale: הכין здесь означает сделать прочным, установить. «Утвердил царство» естественно описывает роль Самуила в установлении монархии и сохраняет оттенок укрепления.
- source_word: וימשח נגידים על עם
  choice: и помазал правителей над народом
  rationale: נגידים — вожди или правители; «правители» подходит к Саулу и Давиду и не вносит наследственного титула «князья». «Над народом» следует еврейскому על עם без добавления отсутствующего в этом месте притяжательного местоимения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст прямо содержит тетраграмматон. «Яхве» сохраняет личное заветное имя и отличает его от אל, переданного далее как «Бог».
- issue: Статус Самуила как נזיר
  choice: назорей Яхве
  alternative: посвящённый Яхве
  rationale: «Назорей» сохраняет возможную связь с особым пожизненным посвящением от рождения. Более общее «посвящённый» звучало бы легче, но устранило бы культовую конкретность и связанную с ней смысловую напряжённость.
- issue: Священническая деятельность Самуила
  choice: служил как священник
  alternative: был священником
  rationale: Глагольная форма ומכהן говорит прежде всего о священническом служении, а не обязательно о формальном происхождении или постоянном сане. Такой перевод сохраняет богословски значимое различие.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским ритмом. Сохранены сжатость еврейской поэзии, игра вокруг «испрошенного» Самуила и необычное сочетание назорейства с пророческим служением. Термины «назорей», «Яхве», «помазал» оставлены ради точности религиозно-исторической лексики.
