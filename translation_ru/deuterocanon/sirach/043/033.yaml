base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/033.yaml
  text: The Lord made everything[a], and to those who fear him he gave wisdom[b]; the praise of the fathers is everlasting.
translation:
  language: ru
  text: Всё сотворил Господь и боящимся Его[a] даровал мудрость. Хвала отцам древности.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «благочестивым»; еврейский текст буквально говорит: «боящимся Его».'
    reason: alternative_reading
  - marker: b
    text: Эта фраза есть в еврейском тексте, но отсутствует в греческом. Возможно, она служила заглавием следующего раздела — похвалы отцам древности — или была перенесена оттуда.
    reason: textual_variant
lexical_decisions:
- source_word: את הכל
  choice: всё
  rationale: Передаёт всеобъемлющее значение еврейского כל и соответствует греческому πάντα; это естественная формулировка на современном русском языке.
- source_word: עשה
  choice: сотворил
  rationale: Глагол עשה значит «делать, создавать». В данном обобщающем высказывании о делах Господа «сотворил» естественно передаёт созидательный смысл, не сужая его до отдельного акта творения.
- source_word: ה׳
  choice: Господь
  rationale: Еврейское сокращённое написание обозначает священное имя Бога; традиционное русское «Господь» также согласуется с греческим ὁ κύριος.
- source_word: ליראיו
  choice: боящимся Его
  rationale: Буквально выражение означает тех, кто боится или благоговеет перед Ним. Сохранён характерный библейский оборот; греческое параллельное чтение «благочестивым» отмечено в сноске.
- source_word: נתן
  choice: даровал
  rationale: Передаёт значение «дал» в возвышенном, но современном литературном регистре и уместно сочетается с дарованием мудрости.
- source_word: חכמה
  choice: мудрость
  rationale: Это ключевой термин книги; русский эквивалент точно соответствует как еврейскому חכמה, так и греческому σοφία.
- source_word: שבח אבות עולם
  choice: Хвала отцам древности
  rationale: В еврейском тексте это именная фраза без выраженной связки. עולם естественно понимать как характеристику «отцов» — «отцы древности», а не как утверждение, что хвала вечна. Фрагментарная форма сохранена и может служить заглавием следующего раздела.
theological_decisions:
- issue: Передача священного имени ה׳
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: «Господь» сохраняет указание на Бога Израиля, соответствует греческому κύριος и естественно выглядит в русском тексте Второканонической книги.
- issue: Передача ליראיו
  choice: боящимся Его
  alternative: благочестивым
  rationale: Выбран буквальный и богословски значимый еврейский оборот; более истолковывающее греческое соответствие приведено в сноске, без устранения различия между свидетелями.
- issue: Включение שבח אבות עולם
  choice: включить как отдельную именную фразу «Хвала отцам древности»
  alternative: считать поздним переносом или заглавием следующего раздела и не включать в основной текст
  rationale: Поскольку фраза засвидетельствована в предоставленном еврейском источнике с высокой степенью уверенности, она сохранена. Её отсутствие в греческом и вероятная связь со следующим разделом открыто отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Синтаксис краток и прозрачен. Заглавная буква в местоимении «Его» поддерживает принятый в русской библейской традиции уважительный регистр; фрагментарность последней именной фразы сохранена ввиду её вероятного заголовочного характера.
