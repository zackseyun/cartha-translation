revisions:
- from: Холод северного ветра возвращается; словно гниль, он замораживает свой источник.[a] Он ложится на всякий стоячий водоём,[b] и водоём облачается в броню, словно в панцирь.
  to: Холод северного ветра возвращается; словно гниль, он замораживает свой источник.[a] Он ложится на всякое скопление вод,[b] и водоём облачается словно в панцирь.
  rationale: Правка устраняет русское ложное значение «стоячий» и плеоназм «броня ... панцирь», сохраняя исходную поэтическую структуру, олицетворение водоёма и спорный еврейский образ. Сноски сохраняют необходимые якоря [a] и [b] и яснее разграничивают еврейское чтение и греческую параллель.
