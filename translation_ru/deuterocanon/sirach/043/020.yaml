base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/020.yaml
  text: The cold of the north wind returns[a]; like rot, it freezes its spring. Over every standing body of water it settles[b], and the reservoir puts on armor like a breastplate.
translation:
  language: ru
  text: Холод северного ветра возвращается; словно гниль, он замораживает свой источник.[a] Он ложится на всякое скопление вод,[b] и водоём облачается словно в панцирь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально читает: «словно гниль, он замораживает свой источник»; образ остаётся неясным. В греческой параллели сказано более прямо: «подует холодный северный ветер, и из воды застынет лёд (или кристалл)». Основной текст следует сохранившемуся еврейскому чтению.'
    reason: alternative_reading
  - marker: b
    text: Еврейская формулировка в этой части стиха текстуально трудна. Греческая параллель поддерживает смысл льда, ложащегося на всякое скопление вод.
    reason: textual_variant
lexical_decisions:
- source_word: צִנַּת רוּחַ צָפוֹן
  choice: холод северного ветра
  rationale: Сочетание обозначает холод, приносимый северным ветром; в метеорологическом контексте רוּחַ означает «ветер», что подтверждается греческой параллелью.
- source_word: יָשִׁיב
  choice: возвращается
  rationale: Краткая и неоднозначная еврейская форма сохранена без добавления отсутствующего в тексте прямого дополнения; передаётся повторное наступление северного холода.
- source_word: וְכָרָקָב
  choice: словно гниль
  rationale: Еврейское чтение буквально означает «словно гниль/тление». Хотя образ труден, он сохранён как первичное засвидетельствованное чтение, а более ясная греческая параллель отмечена в сноске.
- source_word: יַקְפִּיא
  choice: замораживает
  rationale: Глагол означает «заставлять замёрзнуть, затвердевать»; выбран прямой и естественный русский эквивалент.
- source_word: מְקוֹרוֹ
  choice: свой источник
  rationale: Слово может обозначать источник или родник. «Свой источник» сохраняет притяжательный суффикс и не сужает значение до конкретного вида водного источника.
- source_word: מַעֲמַד מַיִם
  choice: стоячий водоём
  rationale: Выражение указывает на воду, собранную или находящуюся в одном месте; греческое συναγωγὴ ὕδατος подтверждает значение собравшейся массы воды.
- source_word: יְקָרִים
  choice: он ложится
  rationale: Еврейская форма текстуально трудна. Перевод опирается на греческое καταλύσει и передаёт лёд как покров, ложащийся на поверхность воды, не скрывая неопределённости в сноске.
- source_word: שִׁרְיוֹן
  choice: броня … панцирь
  rationale: Слово обозначает защитное вооружение, особенно панцирь. Формулировка сохраняет одновременно общий смысл брони и конкретный образ панциря.
- source_word: יִלְבַּשׁ מִקְוֶה
  choice: водоём облачается
  rationale: Еврейский текст олицетворяет собрание воды как надевающее броню; русский глагол «облачается» сохраняет метафору одежды и возвышенный поэтический строй.
