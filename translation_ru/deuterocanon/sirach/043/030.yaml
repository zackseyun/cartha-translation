  text: As you exalt the Lord[a], lift up your voice as much as you can, for there is still more.
translation:
  language: ru
  text: Возвеличивая Господа, возвысьте голос, насколько можете, ведь есть ещё больше.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «ибо Он всё ещё превзойдёт», то есть Господь остаётся превыше всякой хвалы. Еврейский текст короче: «ведь есть ещё больше».'
    reason: alternative_reading
lexical_decisions:
- source_word: מגדלי
  choice: возвеличивая
  rationale: Причастная форма от גדל обозначает тех, кто возвеличивает Господа в хвале. Деепричастная конструкция естественна по-русски и сохраняет связь со следующим призывом.
- source_word: ה׳
  choice: Господа
  rationale: Тетраграмматон передан традиционным и понятным русским титулом «Господь».
- source_word: הרימו קול
  choice: возвысьте голос
  rationale: Передаёт конкретный образ повышения голоса и одновременно соответствует возвышенному контексту хвалы.
- source_word: בכל תוכלו
  choice: насколько можете
  rationale: Фраза обозначает предел человеческих возможностей; такое выражение ясно и естественно в современном русском языке.
- source_word: כי יש עוד
  choice: ведь есть ещё больше
  rationale: Сохраняет краткость и эллиптичность еврейского текста, не уточняя без необходимости, что именно остаётся за пределами произнесённой хвалы.
theological_decisions:
- issue: Насколько явно выразить мысль о том, что Господь превосходит всякую хвалу
  choice: ведь есть ещё больше
  alternative: ибо Он превосходит и это
  rationale: Сохранившийся еврейский текст выражается кратко и неоднозначно, тогда как греческий текст прямо относит превосходство к Господу. Основной текст следует еврейскому свидетельству, а более явное греческое прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным, поэтическим звучанием. Сохранены повелительная интонация и лаконичная неоднозначность заключительной фразы.
