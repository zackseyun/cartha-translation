  text: Много таких чудес[a], но я видел лишь немногие из Его дел.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Есть много сокрытых вещей, превосходящих эти». Сохранившееся еврейское свидетельство короче: «Много таких чудес…»'
    reason: alternative_reading
  - marker: b
    text: 'В греческом тексте: «мы видели лишь немногие из Его дел»; в сохранившемся еврейском тексте — «я видел».'
    reason: textual_variant
lexical_decisions:
- source_word: רוב
  choice: много
  rationale: В сочетании с נפלאות слово выражает количественное изобилие; это согласуется и с греческим πολλὰ.
- source_word: נפלאות
  choice: чудес
  rationale: Существительное обозначает необычайные дела, вызывающие благоговейное изумление; «чудеса» естественно и ёмко передаёт этот смысл.
- source_word: כאלה
  choice: таких
  rationale: 'Указывает на явления, описанные ранее, и сохраняет значение сопоставления: «подобных этим».'
- source_word: מעט
  choice: лишь немногие
  rationale: В сочетании с партитивным מן передаёт ограниченное число увиденных Божьих дел.
- source_word: ראיתי
  choice: я увидел
  rationale: Сохраняет первое лицо единственного числа еврейского текста; форма совершенного вида естественно передаёт завершённое восприятие.
- source_word: ממעשיו
  choice: из Его дел
  rationale: 'Предлог מן имеет партитивное значение: увидена лишь малая часть всей совокупности Его дел.'
theological_decisions:
- issue: Следует ли включить в основной текст греческое указание на сокрытые вещи, превосходящие описанные
  choice: 'Основной текст следует более краткому сохранившемуся еврейскому чтению: «Много таких чудес».'
  alternative: «Есть много сокрытого, что превосходит это».
  rationale: Еврейское свидетельство здесь первично и не содержит явных соответствий греческим ἀπόκρυφα и μείζονα τούτων. Существенное более полное греческое чтение сохранено в сноске.
- issue: 'Первое лицо: единственное или множественное число'
  choice: «я увидел» по еврейскому тексту
  alternative: «мы увидели» по греческому тексту
  rationale: Сохранившийся еврейский текст имеет ראיתי, первое лицо единственного числа; греческий вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством гимнической речи. Заглавная буква в местоимении «Его» ясно указывает на Бога в данном контексте; синтаксис остаётся простым и доступным.
