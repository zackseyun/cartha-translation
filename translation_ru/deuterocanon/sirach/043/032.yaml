  source_fidelity: 'Основной текст верно следует сохранившемуся еврейскому чтению: «много таких чудес» и первое лицо единственного числа. Однако «я увидел» в русском языке легче воспринимается как единичный завершённый акт, тогда как еврейский перфект в контексте подводит итог опыту созерцания; «я видел» передаёт это естественнее. Противительное «но» допустимо как контекстуально выведенная связь между обилием дел и ограниченностью человеческого видения.'
  naturalness: «Я видел лишь немногие из Его дел» — естественная современная литературная формулировка и лучше выражает обобщённый опыт, чем «я увидел».
  terminology: '«Чудеса» и «дела» удачно передают נפלאות и מעשים. Заглавное «Его» уместно в данном гимническом контексте. Греческая сноска нуждается в уточнении: μείζονα τούτων означает «превосходящего это/эти [вещи]», а не просто «что превосходит это»; ἀπόκρυφα следует передать как «сокрытые вещи».'
