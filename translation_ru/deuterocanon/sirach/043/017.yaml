  terminology: Прописные «Он» и «Свой» допустимы как отсылка к Богу, подразумеваемому контекстом. «Саранча» — точная передача אַרְבֶּה. Сноска должна точнее характеризовать греческий вариант как чтение о голосе грома, упрекающем/обличающем землю, и о северной буре и вихре, не приписывая греческому тексту невыраженные детали.
