translation:
  language: ru
  text: При вспышке Он вздымает Свой снег[a], и тот, словно саранча, оседает в месте своего пребывания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское чтение трудно и резко отличается от греческой параллели. В греческом тексте вместо этого говорится о голосе Его грома, упрекающем землю, о буре северного ветра и вихре. В Масаде также сохранилась иная еврейская строка: там, где в тексте Каирской генизы стоит «при вспышке», отчасти читается «голос грома».'
    reason: textual_variant
lexical_decisions:
- source_word: ברשף
  choice: При вспышке
  rationale: רשף может обозначать вспышку, пламя или молниеподобный блеск. В погодном контексте краткое «при вспышке» сохраняет временно-обстоятельственный смысл, не уточняя образ сверх еврейского текста.
- source_word: יניף
  choice: Он развеивает
  rationale: Глагол נוף/הניף означает взмахивать, приводить в движение или заставлять лететь. Применительно к снегу «развеивает» естественно передаёт образ снега, пускаемого по воздуху.
- source_word: שלגו
  choice: Свой снег
  rationale: Форма буквально содержит местоименный суффикс «его снег». Русское «Свой снег» сохраняет эту особенность и соотносит действие с Богом, подразумеваемым контекстом.
- source_word: וכארבה
  choice: словно саранча
  rationale: ארבה — обычное обозначение саранчи, в том числе её множества. Сравнение передаёт плотное, роеподобное движение и оседание снега.
- source_word: ישכון
  choice: оседает
  rationale: שכן значит обитать, поселяться, покоиться. Для выпавшего снега «оседает» звучит естественно и сохраняет идею расположения на месте.
- source_word: דירתו
  choice: там, где остаётся
  rationale: דירה означает жилище или место пребывания. Такая передача сохраняет намеренно необычный пространственный образ и не создаёт ложной ясности в трудном еврейском чтении.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и резко отличающейся греческой параллелью
  choice: Основной текст переведён по еврейскому свидетельству Каирской генизы; греческое чтение отражено в сноске.
  alternative: 'Перевести по греческому тексту: о голосе грома, земле, буре северного ветра и вихре.'
  rationale: При наличии еврейского текста ему отдаётся первенство. Поскольку греческая параллель существенно отличается, вариант необходимо сохранить для текстологической прозрачности, не смешивая два чтения в основном тексте.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Сохранены краткость, погодный образ и необычное сравнение с саранчой; прописные «Он» и «Свой» обозначают подразумеваемого в контексте Бога.
