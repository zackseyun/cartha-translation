  source_fidelity: Первая строка верно следует сохранившемуся еврейскому чтению с повтором корня חדש, а не греческой параллели. Во второй строке сохранены намеренно не сглаженные и текстологически трудные образы כלי צבא и נבלי מרום. Однако греческая параллель, заявленная в обосновании как вынесенная в примечание, в самом наборе сносок отсутствует.
  naturalness: «Внушительна» в современном русском прежде всего значит «производит впечатление размерами/значительностью» и заметно ослабляет נורא. «Величественна» естественнее в поэтическом контексте и лучше передаёт внушаемый объектом трепет. Остальной несколько фрагментарный синтаксис уместен для сохранения трудного поэтического оригинала.
  terminology: «Небесное воинство», «небосвод» и «сияние» удачны. «Орудие» сохраняет широту כלי без необоснованного сведения к оружию. «Арфа высот» допустима как основной осторожный вариант; возможность «лиры» следует оставить в сноске.
