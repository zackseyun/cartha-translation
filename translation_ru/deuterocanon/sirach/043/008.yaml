base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/008.yaml
  text: Month by month it renews itself—how awe-inspiring it is in its changing! A vessel of the host on high[c][b][a], from the expanse of the sky is its shining.
translation:
  language: ru
  text: Из месяца в месяц она обновляется — как величественна она в своих переменах![a] Орудие небесного воинства, арфа высот[b][c]; с небосвода исходит её сияние.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая параллель: «Месяц, согласно своему имени, дивно возрастает в изменении». Она отражает иную формулировку или толкование, чем сохранившееся еврейское чтение: «Из месяца в месяц она обновляется».'
    reason: alternative_reading
  - marker: b
    text: Еврейский текст второй половины стиха труден и, вероятно, текстологически неопределён. В масадском тексте засвидетельствована родственная, но отличающаяся формулировка; общий смысл связывает луну с небесным воинством и сиянием на небе.
    reason: textual_variant
  - marker: c
    text: 'Также возможно: «лира высот». Выражение необычно и, вероятно, является поэтическим образом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חדש בחדשו הוא מתחדש
  choice: Из месяца в месяц она обновляется
  rationale: Повтор корня חדש передан через «месяца» и «обновляется»; временное значение בחדשו естественно выражено оборотом «из месяца в месяц». Возвратная форма сохранена, а женский род отсылает к луне в контексте.
- source_word: מה נורא בהשתנותו
  choice: как внушительна она в своих переменах
  rationale: נורא обозначает то, что внушает благоговейный трепет; «внушительна» сохраняет возвышенную силу без чрезмерного оттенка ужаса. Множественное «в своих переменах» естественно указывает на лунные фазы.
- source_word: כלי צבא
  choice: орудие небесного воинства
  rationale: כלי допускает значения «сосуд», «орудие», «инструмент» или «оружие», а צבא — «войско/воинство». «Орудие ... воинства» сохраняет многозначность כלי лучше, чем конкретное «оружие», и подходит космическому контексту.
- source_word: נבלי מרום
  choice: арфа высот
  rationale: נבל обычно означает струнный инструмент — арфу или лиру, а מרום — высоту или высь. Буквальный поэтический образ сохранён, хотя чтение и синтаксическая связь трудны.
- source_word: מרצף רקיע מזהירתו
  choice: с небосвода исходит её сияние
  rationale: רקיע передано традиционным и понятным «небосвод». Из-за неясности מרצף и эллиптичности фразы добавлено нейтральное «исходит», позволяющее передать направление и сияние без конкретизации спорного образа поверхности или настила.
theological_decisions:
- issue: Приоритет еврейского текста при расхождении с греческой параллелью
  choice: Основной текст следует сохранившемуся еврейскому чтению «из месяца в месяц она обновляется».
  alternative: 'Греческая параллель: «Месяц, согласно своему имени, дивно возрастает, изменяясь».'
  rationale: Еврейский текст здесь сохранился и ясно повторяет корень חדש; греческое чтение отражает иную формулировку или интерпретацию и вынесено в примечание.
- issue: Передача трудной второй половины стиха
  choice: Сохранены образы «орудия небесного воинства» и «арфы высот» с указанием текстовой неуверенности.
  alternative: Сгладить строку как общее описание луны среди небесного воинства либо прочитать נבלי не как музыкальный инструмент.
  rationale: Поэтическая и текстологическая напряжённость не разрешается догматически; буквальные возможности еврейского текста представлены в основном тексте и пояснены в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Синтаксис слегка торжественный, но понятный; трудные космические метафоры не сведены к одному однозначному толкованию.
