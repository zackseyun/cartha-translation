- from: Как пылающая печь среди действия зноя[a], солнце втройне опаляет горы; выдыхая огненный пар и испуская сверкающие лучи[b], оно слепит глаза.
  to: Как печь, раздуваемая мехами в разгар зноя[a], солнце втройне[b] опаляет горы; выдыхая огненные испарения и испуская сверкающие лучи, оно слепит глаза.
  rationale: 'Правка устраняет неестественную кальку, делает явным образ раздуваемой печи и переносит якорь текстологического примечания к слову «втройне». Смысловая неоднозначность трудного еврейского выражения не снимается догматически: «в разгар зноя» — естественная по-русски образная передача в свете греческого параллельного текста.'
