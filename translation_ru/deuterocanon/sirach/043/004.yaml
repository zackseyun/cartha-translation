    reason: alternative_reading
lexical_decisions:
- source_word: כור נפוח
  choice: пылающая печь
  rationale: Образ обозначает печь, жар которой раздувают; естественное русское выражение сохраняет образ сильного огня, подтверждаемый греческим κάμινον φυσῶν.
- source_word: מחם מצוק
  choice: среди действия зноя
  rationale: Еврейское выражение трудно и допускает несколько толкований; перевод намеренно сохраняет его необычность, учитывая греческое ἐν ἔργοις καύματος.
- source_word: שולח שמש
  choice: солнце
  rationale: Еврейская строка сжата, тогда как греческий параллельный текст ясно представляет солнце субъектом последующих действий.
- source_word: ידליק הרים
  choice: опаляет горы
  rationale: Глагол передаёт воспламенение или обжигание; «опаляет» естественно описывает действие солнечного жара, не утверждая буквального возгорания гор.
- source_word: τριπλασίως
  choice: втройне
  rationale: Наречие явно засвидетельствовано в греческом тексте, хотя в сохранившейся еврейской строке соответствующий элемент неясен.
- source_word: ἀτμίδας πυρώδεις ἐμφυσῶν
  choice: выдыхая огненный пар
  rationale: Перевод сохраняет греческий образ выдыхаемого раскалённого испарения и естественно звучит по-русски.
- source_word: לשאון מאור תגמר נושבת / καὶ ἐκλάμπων ἀκτῖνας
  choice: испуская сверкающие лучи
  rationale: Еврейский текст этого места труден; ясный греческий параллельный текст говорит об испускании сияющих лучей.
- source_word: ומנורה תכוה עין / ἀμαυροῖ ὀφθαλμούς
  choice: слепит глаза
  rationale: Выражение передаёт поражающее зрение действие яркого света. «Слепит» в современном русском обозначает временный зрительный эффект и не обязательно полную слепоту.
