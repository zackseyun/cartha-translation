    rationale: Оно является буквальным калькированием спорного оборота и в русском не имеет ясного смысла. Нужна литературная формулировка, сохраняющая осторожность в отношении трудного текста.
  - severity: low
    issue: Якорь сноски b расположен после «лучи», хотя сноска поясняет «втройне».
    rationale: Якорь следует перенести непосредственно к слову, которое содержит гречески засвидетельствованное дополнение.
  - severity: low
