translation:
  language: ru
  text: Целебное средство для всего — облако, источающее росу[a][c], прогоняющее палящий зной и приносящее влагу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение, переданное словами «облако, источающее росу», трудно для истолкования; греческий параллельный текст говорит о «тумане, росе», указывая на прохладную влагу, а не на грозовую тучу.
    reason: lexical_alternative
  - marker: b
    text: Буквально еврейское לדשן связано с обогащением или приданием изобилия; в данном контексте возможны переводы «чтобы обогатить», «чтобы оживить» или «насыщая влагой».
    reason: alternative_reading
  - marker: c
    text: Свиток из Масады в этом месте сохранился фрагментарно и не даёт ясного иного чтения; перевод опирается на еврейские рукописи Каирской генизы, а греческий текст служит для сопоставления.
    reason: textual_variant
lexical_decisions:
- source_word: מרפא כל
  choice: Исцеление для всех
  rationale: מרפא означает «исцеление, целебное средство», а כל допускает широкое «все/всё». Краткая именная конструкция сохраняет форму еврейского текста и соответствует греческому ἴασις πάντων.
- source_word: מערף ענן טל
  choice: роса, источаемая облаком
  rationale: Еврейское выражение трудно для истолкования; מערף связано с капанием или источением, а ענן טל — с облаком и росой. Перевод сохраняет образ влаги, исходящей от облака, и согласуется с греческим параллельным текстом «туман, роса».
- source_word: פורע
  choice: прогоняет
  rationale: При дополнении שרב уместно контекстуальное значение устранения или отведения зноя; оно также соответствует выраженной в греческом тексте мысли об облегчении от жары.
- source_word: לדשן
  choice: напитывая влагой
  rationale: Корень דשן буквально связан с тучностью, изобилием и обогащением. В контексте росы и зноя речь, вероятно, о восстановительном насыщении влагой; деепричастная форма естественно передаёт результат действия.
- source_word: שרב
  choice: палящий зной
  rationale: שרב обозначает иссушающий жар, иногда связанный с горячим ветром. «Палящий зной» ясно и выразительно передаёт климатический образ.
