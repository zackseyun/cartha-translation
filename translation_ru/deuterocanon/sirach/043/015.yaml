    reason: textual_variant
lexical_decisions:
- source_word: בכחו
  choice: Силой Своей
  rationale: Предлог ב здесь естественно передаёт средство действия; формулировка сохраняет прямую связь с Божьей силой и звучит по-русски естественно.
- source_word: יתן לענן עז
  choice: Он укрепляет облако
  rationale: Буквально сочетание означает «даёт облаку силу». Русское «укрепляет облако» ясно и кратко передаёт придание силы, не меняя образа и сохраняя единственное число еврейского текста.
- source_word: להשליך
  choice: чтобы оно низвергало
  rationale: Инфинитив допускает значение цели или результата. «Чтобы… низвергало» естественно связывает действие облака с выпадением града и сохраняет энергичность глагола השליך.
- source_word: אבני אלגביש
  choice: камни града
  rationale: Передаёт конкретный образ еврейского выражения «камни града», а не сглаживает его до простого «град»; греческая параллель также подтверждает образ градин-камней.
