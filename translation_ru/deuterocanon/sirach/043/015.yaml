  text: Силою Своею Он даёт облаку силу низвергать градовые камни.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «облако» в единственном числе; в греческом переводе — «облака» во множественном.
    reason: alternative_reading
  - marker: b
