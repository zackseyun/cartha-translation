translation:
  language: ru
  text: Мореплаватели рассказывают о пределах моря[a]; когда мы слышим их рассказы, мы изумляемся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «об опасности моря», тогда как в сохранившемся еврейском — «о его крае (пределе)». Основной текст следует еврейскому чтению.'
    reason: alternative_reading
lexical_decisions:
- source_word: יורדי הים
  choice: Плавающие по морю
  rationale: Буквально — «сходящие к морю», устойчивое еврейское обозначение мореходов. Русское «плавающие по морю» естественно передаёт смысл; греческая параллель также говорит о плывущих по морю.
- source_word: יספרו
  choice: рассказывают
  rationale: Глагол означает повествовать, сообщать или описывать пережитое; «рассказывают» ясно передаёт свидетельство мореходов.
- source_word: קצהו
  choice: о его дальних пределах
  rationale: Еврейское слово обозначает край, предел или оконечность. В данном контексте речь, вероятно, о далёких просторах и пределах моря. Основной текст следует сохранившемуся еврейскому чтению.
- source_word: לשמע אזנינו
  choice: услышав их рассказы
  rationale: Буквально — «при слышании наших ушей». По-русски естественнее выразить тот же слуховой образ деепричастной конструкцией; подразумеваемое содержание слышимого — рассказы мореходов из первой части стиха.
- source_word: נשתומם
  choice: мы изумляемся
  rationale: Глагол выражает сильное потрясение или изумление. «Изумляемся» сохраняет широту значения и не сводит реакцию только к страху; греческое «удивляемся» близко по смыслу.
