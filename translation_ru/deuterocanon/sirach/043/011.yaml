  text: Look at the rainbow and bless its Maker[b][a], for it is exceedingly majestic in splendor.
translation:
  language: ru
  text: Посмотри на радугу[a] и благослови её Создателя, ибо в своём великолепии она необычайно величественна.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лук»; здесь имеется в виду небесная дуга, то есть радуга.'
    reason: lexical_alternative
  - marker: b
    text: 'Свиток из Масады подтверждает здесь смысл величия и великолепия, употребляя родственную формулировку там, где каирский текст говорит: «в своём великолепии она необычайно величественна».'
    reason: textual_variant
lexical_decisions:
- source_word: ראה
  choice: Посмотри на
  rationale: Повелительная форма прямо призывает обратить взгляд; современная и естественная передача без архаизма «воззри».
- source_word: קשת
  choice: радугу
  rationale: Буквально «лук», но в данном описании небесных явлений имеется в виду небесная дуга — радуга; это согласуется и с греческой параллелью.
- source_word: וברך
  choice: и благослови
  rationale: Сохраняет обычное значение корня ברך и благоговейный тон; в контексте благословение Создателя подразумевает хвалу Ему.
- source_word: עושיה
  choice: её Создателя
  rationale: Причастная форма обозначает того, кто её создал, а суффикс отсылает к радуге. Прописная буква уместна как обозначение Бога, не добавляя Его имени в текст.
- source_word: כי
  choice: ибо
  rationale: Вводит основание призыва благословить Создателя и соответствует возвышенному поэтическому регистру.
- source_word: מאד
  choice: необычайно
  rationale: Передаёт сильную степень признака естественным современным русским словом.
- source_word: נאדרה
  choice: величественна
  rationale: Форма от אדר выражает величие, внушительность и великолепие; «величественна» сохраняет этот смысл.
- source_word: בהוד
  choice: в своём великолепии
  rationale: הוד означает великолепие, величие или славу. Русское возвратное притяжательное местоимение естественно связывает это качество с радугой, не меняя референта.
theological_decisions:
- issue: Кого следует благословить
  choice: «благослови её Создателя» — Бог подразумевается, но прямо не назван
  alternative: «благослови Бога, создавшего её»
  rationale: Еврейский текст говорит «её Создателя» и не называет Бога непосредственно; перевод сохраняет эту сдержанность и не разворачивает подразумеваемое в явное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Порядок слов во второй части слегка перестроен ради естественности и во избежание тяжеловесного сочетания «величественна в великолепии».
