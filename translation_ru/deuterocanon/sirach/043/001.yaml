translation:
  language: ru
  text: Великолепие высот — чистый небосвод, образ неба в видении славы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный составной еврейский текст здесь не совпадает с текстом данного стиха и, по-видимому, относится к соседнему контексту. Перевод следует древнегреческому свидетельству Сир 43:1.
    reason: Прозрачно отмечает существенное расхождение источников и основание выбора текста, не скрывая текстологическую проблему.
lexical_decisions:
- source_word: γαύριαμα ὕψους
  choice: великолепие высот
  rationale: Передаёт возвышенную похвалу небесной высоте без излишне буквального и неестественного «гордость высоты».
- source_word: στερέωμα καθαριότητος
  choice: чистый небосвод
  rationale: στερέωμα обозначает небесный свод, а родительный καθαριότητος выражает его ясность и чистоту; «небосвод» естественнее для современного русского текста, чем «твердь».
- source_word: εἶδος οὐρανοῦ
  choice: облик неба
  rationale: Сохраняет зрительный смысл εἶδος — вид, облик — и не смешивает его со следующим ὅραμα.
- source_word: ἐν ὁράματι δόξης
  choice: видение славы
  rationale: 'Сохраняет образное и несколько неоднозначное сочетание: небо предстаёт как явленная взору слава.'
theological_decisions:
- issue: Отсутствие явного упоминания Бога при описании славы
  choice: Сохранить без добавления «Божьей»
  alternative: «видение Божьей славы»
  rationale: В греческом тексте сказано только δόξης; уточнение обладателя славы было бы богословски вероятным, но текстуально добавленным.
- issue: Расхождение предоставленного еврейского текста с греческим параллельным текстом и принятой нумерацией стиха
  choice: Основной текст переведён по греческому свидетельству, соответствующему Сир 43:1
  alternative: Перевести предоставленный еврейский фрагмент как основной текст стиха
  rationale: Еврейский фрагмент по содержанию относится к соседнему контексту и не соответствует греческому Сир 43:1; подмена известного текста стиха несоответствующим фрагментом исказила бы его содержание.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Параллельные именные конструкции и точка с запятой сохраняют компактность и образность греческой строки.
