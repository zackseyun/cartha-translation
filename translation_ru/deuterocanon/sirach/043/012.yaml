base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/012.yaml
  text: He encircled the horizon in his glory[c][b][a], and the hand of God stretched out in his majesty.
translation:
  language: ru
  text: Он окружил установленный предел Своей славой[c][a], и рука Бога простёрлась в Его величии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Он окружил небо кругом славы». Еврейское חוק означает «установление, предписание» и также может обозначать установленную границу или предел.'
    reason: alternative_reading
  - marker: b
    text: 'В еврейском тексте — единственное число: «рука Бога»; в греческой параллели — множественное: «руки Всевышнего».'
    reason: textual_variant
  - marker: c
    text: 'В рукописи из Масады здесь сохранился лишь фрагмент: «…Своей славой»; более полный текст дают рукописи Каирской генизы.'
    reason: textual_variant
lexical_decisions:
- source_word: חוק
  choice: установленный предел
  rationale: חוק обычно означает установление или предписание, но в космическом поэтическом контексте может обозначать установленную границу. Такое выражение сохраняет идею божественно заданного порядка и естественнее по-русски, чем буквальное «устав»; греческое «небо» отмечено в сноске.
- source_word: הקיפה
  choice: окружил
  rationale: Глагол выражает охватывание или обведение кругом; «окружил» передаёт образ кратко и естественно.
- source_word: בכבודה
  choice: Своей славой
  rationale: Предлог ב допускает инструментальное значение «с помощью/посредством»; местоимение относится к Богу. Прописная буква соответствует принятому русскому благоговейному регистру.
- source_word: ויד אל
  choice: и рука Бога
  rationale: Сохранено единственное число еврейского текста и прямое значение אל как «Бог»; греческий вариант «руки Всевышнего» вынесен в сноску.
- source_word: נטתה
  choice: простёрлась
  rationale: Форма женского рода согласуется с «рукой» и означает «простираться, быть простёртой». Возвратная русская форма естественно передаёт грамматику, не превращая действие в пассив.
- source_word: בגבה
  choice: в Его величии
  rationale: Слово допускает значения высоты, возвышенности и величия; в гимническом контексте «величие» сохраняет поэтическую возвышенность без излишне пространственного толкования.
theological_decisions:
- issue: Расхождение еврейского текста и греческой параллели
  choice: Основной текст следует еврейскому חוק как «установленный предел» и сохраняет единственное число «рука Бога».
  alternative: «Он окружил небо кругом славы, и руки Всевышнего распростёрли его».
  rationale: Сохранившийся еврейский текст имеет приоритет, однако греческая параллель свидетельствует о существенно ином чтении и потому полностью приводится в сноске, без устранения текстологической неопределённости.
- issue: Референт местоименных суффиксов в בכבודה и בגבה
  choice: 'Оба переданы как относящиеся к Богу: «Своей славой» и «в Его величии».'
  alternative: Понимать суффиксы как относящиеся к описываемому космическому пределу.
  rationale: Ближайший богословско-поэтический контекст и греческое упоминание Всевышнего поддерживают божественный референт, хотя краткость еврейской строки оставляет некоторую грамматическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным гимническим звучанием. «Установленный предел» избегает канцелярского «устава», но удерживает смысл חוק и космический образ. Все существенные разночтения отмечены сносками.
