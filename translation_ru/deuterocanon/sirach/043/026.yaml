  text: For his sake the messenger succeeds[b][a], and by his word he accomplishes his will.
translation:
  language: ru
  text: Ради него посланник успешно действует[a] и по его слову исполняет волю.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ангел преуспевает». Еврейское מַלְאָךְ может означать и «посланник», и «ангел».'
    reason: lexical_alternative
  - marker: b
    text: 'Во второй половине стиха греческий текст читается иначе: «и словом его всё устрояется вместе» (или: «всё держится вместе»).'
    reason: alternative_reading
lexical_decisions:
- source_word: למענו
  choice: Ради него
  rationale: Передаёт значение цели или отнесённости — «ради него, для него» — и естественно соотносится с Богом в окружающем контексте.
- source_word: יצלח
  choice: успешно действует
  rationale: Глагол צלח означает «иметь успех, преуспевать». Такое выражение естественно по-русски и сохраняет мысль об успешном исполнении поручения.
- source_word: מלאך
  choice: посланник
  rationale: מלאך может обозначать как человеческого посланника, так и ангела. «Посланник» сохраняет присущую еврейскому слову неоднозначность; ангельское понимание указано в сноске.
- source_word: ובדבריו
  choice: и по его слову
  rationale: Предлог ב здесь выражает основание или средство действия. «По его слову» естественно передаёт исполнение по божественному повелению; форма דבריו буквально может пониматься как «по его словам».
- source_word: יפעל
  choice: исполняет
  rationale: פעל означает «делать, совершать, осуществлять». В сочетании с רצון русское «исполняет волю» точно и идиоматично.
- source_word: רצון
  choice: волю
  rationale: רצון означает «воля, желание, благоугодное». В еврейском тексте притяжательное местоимение отсутствует, поэтому перевод не добавляет «его», сохраняя некоторую синтаксическую открытость.
theological_decisions:
- issue: Следует ли понимать מלאך исключительно как ангела
  choice: посланник
  alternative: ангел
  rationale: Само еврейское слово допускает оба значения, а данный стих не устраняет неоднозначности. Основной текст не навязывает специально ангелологическое толкование.
- issue: Чья воля обозначена словом רצון
  choice: 'не добавлять притяжательное местоимение: «исполняет волю»'
  alternative: «исполняет его волю»
  rationale: В еврейском у רצון нет местоименного суффикса. Контекст позволяет понимать волю как Божью, но эксплицировать это в основном тексте означало бы устранить формальную недосказанность оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Строчная буква в местоимениях о Боге избегает внесения поздней конфессиональной орфографической традиции. Перевод следует прежде всего еврейскому тексту; заметно отличающееся греческое чтение вынесено в сноску.
