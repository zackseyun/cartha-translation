  text: For great is the Lord who made it[b][a], and by his word he hastens its course.
translation:
  language: ru
  text: Ведь велик Господь, создавший её[a], и словом Своим Он ускоряет её путь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В Масадском списке сохранилась лишь первая половина стиха: «Ведь велик Господь, создавший её». Продолжение известно по каирским рукописям, где еврейское чтение затруднительно; греческая параллель поддерживает смысл: «словом Своим Он ускоряет её путь».'
    reason: textual_variant
  - marker: b
    text: 'Еврейский текст второй половины допускает более буквальное, но неясное прочтение: «словом Своим Его могучий одерживает верх»; по греческой параллели возможно также: «по Своему повелению Он направляет её путь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גדול
  choice: велик
  rationale: Предикативное прилагательное о Господе; «велик» прямо передаёт еврейское слово и сохраняет возвышенный гимнический тон.
- source_word: ה׳
  choice: Господь
  rationale: Еврейское сокращённое обозначение Божественного имени передано традиционным и понятным русским соответствием.
- source_word: עושהו
  choice: создавший её
  rationale: Местоименный суффикс относится к луне, о которой говорится в контексте; в русском языке «луна» женского рода.
- source_word: בדבריו
  choice: словом Своим
  rationale: Инструментальное значение передано естественным русским оборотом. Единственное число выражает смысл повелительного слова, не навязывая отдельной богословской интерпретации.
- source_word: ינצח
  choice: ускоряет
  rationale: Еврейское чтение затруднительно; греческое κατέσπευσεν поддерживает значение поспешного движения или побуждения двигаться быстрее.
- source_word: אביריו
  choice: её путь
  rationale: Еврейская форма в данном контексте неясна, тогда как греческое πορείαν указывает на путь или движение небесного тела. «Путь» сохраняет образ и не вводит современный технический термин «орбита».
theological_decisions:
- issue: Передача Божественного имени
  choice: Господь
  alternative: Яхве
  rationale: Форма ה׳ является благоговейным сокращением Божественного имени; «Господь» соответствует русской библейской традиции и не требует реконструировать произношение.
- issue: Использование греческой параллели при трудном еврейском чтении
  choice: 'Вторая половина переведена с еврейского с прояснением по греческой параллели: «словом Своим Он ускоряет её путь»'
  alternative: 'Более буквальное чтение трудного еврейского текста: «Его могучий одерживает верх»'
  rationale: Еврейский текст остаётся основным, однако сочетание ינצח אביריו лексически и контекстуально трудно. Греческая параллель даёт связный астрономический образ движения; неопределённость открыто отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным гимническим звучанием. Синтаксис прост и понятен; прописное «Своим» поддерживает принятый в русском религиозном письме уважительный регистр. Неясность второй половины не скрыта, а вынесена в текстологическую и лексическую сноски.
