  source_fidelity: 'Первая половина точно передаёт כי גדול ה׳ עושהו: «Ведь велик Господь, создавший её». Женский род местоимения обоснован ближайшим контекстом о луне. Во второй половине перевод корректно следует трудному еврейскому чтению с прояснением по греческому κατέσπευσεν πορείαν: «словом Своим Он ускоряет её путь». Это не выдаётся за бесспорное буквальное значение еврейских слов.'
