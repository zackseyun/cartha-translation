  text: Who has seen him and can describe him? And who can magnify him as he is?[a]
translation:
  language: ru
  text: Кто видел Его и может описать Его? И кто может возвеличить Его таким, каков Он есть?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся здесь еврейский текст из Каирской генизы расходится с греческим и, по-видимому, не соответствует данному месту. Буквально: «Небесные высоты вновь обретают силу и не утомляются, ибо вам не исследовать их». В основном тексте принят греческий вариант: «Кто видел Его и может описать Его? И кто может возвеличить Его таким, каков Он есть?» — поскольку он связно вписывается в контекст.'
    reason: textual_variant
lexical_decisions:
- source_word: τίς ἑόρακεν αὐτόν
  choice: Кто видел Его
  rationale: Перфект ἑόρακεν обозначает совершившееся видение; простое «видел» естественно в современном русском и сохраняет прямоту вопроса.
- source_word: ἐκδιηγήσεται
  choice: может описать
  rationale: Глагол означает подробно рассказать или исчерпывающе изложить; «описать» ясно передаёт невозможность вполне выразить Божье величие.
- source_word: μεγαλυνεῖ
  choice: может возвеличить
  rationale: «Возвеличить» сохраняет хвалебный смысл глагола — провозгласить великим, прославить — и уместно для возвышенного, но понятного регистра.
- source_word: καθὼς ἐστιν
  choice: таким, каков Он есть
  rationale: Формулировка передаёт соотнесённость хвалы с тем, каков Бог в действительности, не добавляя слова «истинно», которого в греческом нет.
- source_word: מרומים
  choice: высоты (в сноске)
  rationale: Сохранившаяся еврейская строка расходится с греческой и, вероятно, не соответствует этому месту; её буквальный смысл прозрачно приведён в сноске, а основной текст следует контекстуально связному греческому свидетельству.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческого параллельного свидетельства
  choice: Основной текст следует греческому риторическому вопросу о непостижимом величии Бога.
  alternative: «Высоты обновляют силу и не утомляются, ибо вы не исследуете их до конца».
  rationale: Предоставленная еврейская строка помечена как несовпадающая и выглядит относящейся к иному контексту, тогда как греческий текст связно продолжает прославление Бога. Расхождение не скрыто, а полностью отражено в сноске.
- issue: Смысл μεγαλυνεῖ применительно к Богу
  choice: «возвеличить» — выразить и провозгласить Его величие
  alternative: «прославить» или «вознести»
  rationale: Перевод не предполагает, что человек делает Бога великим по существу; в данном хвалебном контексте речь идёт о признании и провозглашении Его величия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Местоимение «Его/Он» написано с прописной буквы по принятой русской религиозно-литературной норме; синтаксис остаётся простым и доступным.
