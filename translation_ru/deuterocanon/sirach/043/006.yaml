  source_fidelity: 'Основной смысл передан верно: второе ירח после «луна» обоснованно понимается как глагол «отмечает/указывает», а «возвращающиеся времена» сохраняет цикличность עתות שבות. Однако «владычица предела» чрезмерно превращает абстрактное ממשלת («власть, господство; управление») в личный титул. Более близкое «властвующая над концом» сохраняет поэтическую персонификацию, но яснее передаёт конструкцию и оставляет קץ неоднозначным.'
