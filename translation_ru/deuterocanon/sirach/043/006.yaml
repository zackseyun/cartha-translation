translation:
  language: ru
  text: И луна также отмечает возвращающиеся времена[a][b][c] — властвуя над концом, вечный знак.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «И луна во всём — для своего срока, явление времён и знак навеки». Еврейский текст вместо этого говорит о «возвращающихся временах» и о власти над «концом».'
    reason: alternative_reading
  - marker: b
    text: Краткое еврейское выражение «властвуя над концом» может указывать на власть луны над завершением месяца или над установленной границей времени.
    reason: lexical_alternative
  - marker: c
    text: 'В масадском фрагменте этого стиха сохранилось иное чтение: «ибо великий Господь создал её».'
    reason: textual_variant
lexical_decisions:
- source_word: וגם
  choice: и
  rationale: Союз сохраняет добавление луны к уже описываемым небесным светилам; в русском отдельное «также» здесь необязательно.
- source_word: ירח
  choice: луна
  rationale: Прямое обозначение небесного тела; определённость естественно передаётся контекстом.
- source_word: עתות שבות
  choice: возвращающиеся времена
  rationale: עתות означает времена или установленные сроки, а שבות передаёт возвращение, повторяемость. Формулировка сохраняет календарно-циклический смысл, не сужая его до времён года.
- source_word: ממשלת
  choice: владычица
  rationale: Существительное выражает власть или господство; применительно к луне женский образ «владычица» естественно сохраняет поэтическую персонификацию.
- source_word: קץ
  choice: предела
  rationale: קץ может означать конец, предел или завершение. «Предел» сохраняет краткость и допускает связь как с установленной границей времени, так и с завершением лунного месяца.
- source_word: ואות עולם
  choice: и вечный знак
  rationale: אות — «знак», עולם здесь выражает постоянную, непреходящую длительность. «Вечный знак» естественно и кратко передаёт сочетание.
theological_decisions:
- issue: Выбор между сохранившимся еврейским текстом и отличающейся греческой параллелью
  choice: В основном тексте следовать еврейскому чтению, используя греческий текст лишь для подтверждения календарного контекста
  alternative: 'Перевести по греческой параллели: «И луна во всём служит своему сроку, являя времена и оставаясь знаком навеки»'
  rationale: При наличии еврейского текста он имеет приоритет. Греческая параллель подтверждает временной и календарный смысл, но не содержит соответствия еврейскому выражению «владычица предела», поэтому различие сохранено в примечании, а не сглажено.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Сохранены лаконичность, персонификация луны и смысловая открытость слова קץ; архаизмы и конфессионально окрашенные уточнения не вводятся.
