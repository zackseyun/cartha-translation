  source_fidelity: 'Первая часть в целом верно передаёт календарную функцию небесных светил: בם естественно передано инструментальным «по ним». Однако «Им» в главном тексте вводит и графически маркирует Бога как явного субъекта, тогда как трудное עשיו не позволяет столь определённо устанавливать субъект. Добавленный глагол «совершается» также несколько сильнее утверждает смысл, чем допускает неясная еврейская строка.'
