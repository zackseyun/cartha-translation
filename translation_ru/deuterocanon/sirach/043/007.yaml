  yaml_path: translation/deuterocanon/sirach/043/007.yaml
  text: From them come the appointed time and the fixed seasons by statute[b][a], and the work he desired is in its cycle.
translation:
  language: ru
  text: По ним определяются назначенный срок и установленные времена[a], а желанное дело — в своём круговороте[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слово, переведённое как «назначенный срок», может также означать праздник; греческий текст говорит: «От луны — знак праздника».'
    reason: alternative_reading
  - marker: b
    text: 'Вторая часть еврейской строки трудна; приблизительно: «и желанное дело… в своём круговороте». Греческий текст читает: «светило, убывающее к завершению», а Масадский свиток — «ибо велик Господь, сотворивший её».'
    reason: textual_variant
lexical_decisions:
- source_word: בם
  choice: По ним определяются
  rationale: Предлог ב допускает значения «в них» и «посредством них». В сжатом поэтическом контексте речь идёт о небесных светилах как ориентирах календаря; формулировка сохраняет инструментальный смысл, не заменяя множественное число еврейского текста греческим единственным «луна».
- source_word: מועד
  choice: назначенный срок
  rationale: מועד означает назначенное время, а также праздник. Сочетание с זמני указывает прежде всего на календарное время; более широкое «назначенный срок» не сужает смысл до одного лишь праздника.
- source_word: וזמני חוק
  choice: установленные времена
  rationale: זמנים — времена или сроки, а חוק передаёт идею установленного порядка или предписания. «Установленные времена» естественно выражает обе стороны смысла без тяжеловесного буквального «времена установления».
- source_word: וחפץ עשיו
  choice: а желанное Им дело совершается
  rationale: Переданный текст труден. חפץ может обозначать желаемое, угодное или предмет воли; «желанное Им дело» сохраняет волевой оттенок и не выдаёт спорную морфологию עשיו за однозначную. Глагол «совершается» контекстуально связывает дело с его установленным ходом.
- source_word: בתקופתו
  choice: в своём круговороте
  rationale: תקופה обозначает оборот, цикл или периодическое возвращение. В астрономическом контексте «круговорот» передаёт повторяющийся ход светила и его календарную функцию.
theological_decisions:
- issue: Субъект и смысл второй части стиха
  choice: Обобщённое указание на желанное Творцом дело, совершающееся в установленном круговороте
  alternative: Указание непосредственно на луну как светило, отмечающее праздники; либо чтение Масадского свитка о величии Господа, сотворившего её
  rationale: Каирский еврейский текст во второй части труден, а греческая версия говорит о луне и празднике. Основной перевод сохраняет общую мысль о целенаправленном устройстве миропорядка, не подменяя неясный еврейский текст более определённым вариантом; разночтения вынесены в примечания.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сжатый параллелизм сохранён; неясность второй части не устранена догматическим уточнением. Все маркеры примечаний поставлены непосредственно при относящихся к ним выражениях.
