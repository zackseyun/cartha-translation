  terminology: «Назначенный срок» удачно передаёт מועד, а примечание сохраняет возможность значения «праздник». «Круговорот» подходит для תקופה в астрономико-календарном контексте. Слово «желанное» сохраняет возможный волевой оттенок חפץ без приписывания спорному чтению определённого субъекта.
