    reason: lexical_alternative
lexical_decisions:
- source_word: בדבר אל
  choice: По слову Бога
  rationale: Предлог ב при דבר передаёт основание или средство действия, а אל естественно понимается как «Бог». Такая формулировка следует представленному еврейскому тексту и сохраняет его краткость.
- source_word: יעמד חק
  choice: установлен порядок
  rationale: עמד буквально означает «стоять, оставаться», а חק — установленное предписание или неизменный порядок. В космическом контексте русское «установлен порядок» естественно передаёт устойчивость определённого Богом строя.
- source_word: ולא ישח
  choice: и они не ослабевают
  rationale: Форма еврейского глагола текстологически не вполне ясна. Греческое οὐ μὴ ἐκλυθῶσιν и масадское «не утомляются» поддерживают значение неослабной верности назначению.
- source_word: באשמרותם
  choice: на своих стражах
  rationale: אשמרות обозначает стражи, периоды несения стражи или назначенные посты. Выражение «на своих стражах» сохраняет образ небесных светил, неуклонно исполняющих назначенное служение.
theological_decisions:
- issue: Следует ли прямо называть Бога в основном тексте
  choice: «По слову Бога»
  alternative: «По его слову» или, по Масаде, «По слову Господа»
  rationale: В предоставленном основном еврейском тексте стоит אל, обычно означающее «Бог», поэтому божественный источник повеления выражен прямо. Вариант Масады употребляет אדני («Господь»), но его не следует без отметки подменять основным чтением.
- issue: Как передать חק в космическом контексте
  choice: «порядок»
  alternative: «установление», «устав» или «предписание»
  rationale: «Порядок» выражает назначенный Богом устойчивый строй, не сводя образ к человеческому законодательству и не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным строем. «Стражи» сохраняют традиционный библейский образ назначенных периодов или постов, а сноска поясняет возможное пространственное понимание.
