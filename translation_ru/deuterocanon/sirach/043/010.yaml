  source_fidelity: 'Основной смысл передан верно: בִּדְבַר אֵל понимается как «по слову Бога», חֹק — как установленный космический порядок, а вторая половина стиха, с учётом неясности еврейского глагола и греческого параллеля, говорит о том, что они не слабеют при исполнении назначенного им служения. Однако «на своих стражах» по-русски неестественно и может быть понято как нахождение рядом с охранниками, а не как несение стражи или пребывание на назначенных местах.'
  naturalness: «По слову Бога установлен порядок» допустимо, но «порядок остаётся незыблемым» лучше передаёт יעמד («стоит, остаётся твёрдым») и звучит более органично в русском поэтическом контексте. «На своих постах» — современное литературное и ясное соответствие образу אשמרותם; альтернативу со «стражами» следует сохранить в сноске.
  terminology: «Бог» точно отражает אל в представленном еврейском тексте; «Господь» остаётся только в примечании как чтение Масады. «Порядок» — удачная передача חק в контексте небесного устройства. Не следует уточнять, кто именно обозначен местоимением «они», поскольку исходный текст и параллель сохраняют это контекстуально обусловленное указание.
