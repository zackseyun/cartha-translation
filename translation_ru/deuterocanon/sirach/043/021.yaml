lexical_decisions:
- source_word: יבול הרים
  choice: плоды гор
  rationale: יבול обозначает то, что производит земля; «плоды гор» сохраняет широкий смысл и поэтическую краткость, не сводя образ к земледельческому урожаю.
- source_word: בחרב
  choice: засухой
  rationale: חֹרֶב здесь означает сухость или засуху; инструментальное «засухой» естественно передаёт разрушительное действие в контексте.
- source_word: ישיק
  choice: опаляет
  rationale: Глагол передаёт губительное действие жара; «опаляет» поддерживает параллелизм с пламенем, не утверждая буквального горения в первой строке.
- source_word: נוה צמחים
  choice: пастбища, поросшие растениями
  rationale: נָוֶה в природном контексте означает пастбище или луг, а צמחים — растения, поросль. Такая формулировка сохраняет оба элемента еврейского выражения и звучит понятно по-русски.
- source_word: בלהבה
  choice: пламенем
  rationale: Предлог ב допускает инструментальное понимание; краткое «пламенем» сохраняет плотность поэтического образа.
