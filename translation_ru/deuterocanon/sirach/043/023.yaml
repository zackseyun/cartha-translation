translation:
  language: ru
  text: По своему замыслу Он утихомирил бездну[a] и насадил в ней острова[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст в этом месте труден. В греческой параллели: «Своим помыслом Он утихомирил бездну и насадил её»; это поддерживает смысл «утихомирил бездну» и образ островов, утверждённых среди неё.'
    reason: textual_variant
  - marker: b
    text: 'Или: «приморские земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מחשבתו
  choice: по своему замыслу
  rationale: Существительное от חשב может обозначать мысль, намерение или замысел. В космологическом контексте «замысел» передаёт целенаправленность действия; греческое λογισμῷ αὐτοῦ также указывает на обдуманное решение.
- source_word: משיק
  choice: утихомирил
  rationale: Еврейская форма трудна, однако греческое ἐκόπασεν означает «успокоил, заставил утихнуть». «Утихомирил» естественно передаёт прекращение волнения вод, не устраняя образную силу выражения.
- source_word: רבה
  choice: бездну
  rationale: Еврейское чтение не вполне ясно; греческая параллель содержит ἄβυσσον. «Бездна» сохраняет библейский космологический образ глубинных вод.
- source_word: ויט
  choice: насадил
  rationale: Еврейский глагол допускает смысл помещения или утверждения, а греческое ἐφύτευσεν буквально значит «насадил». Выбор сохраняет яркую метафору установления островов среди вод.
- source_word: בתהום
  choice: в ней
  rationale: Буквально — «в бездне». Местоимение избегает тяжёлого повтора, при этом его соотнесённость с «бездной» остаётся ясной.
- source_word: איים
  choice: острова
  rationale: איים может означать как острова, так и приморские земли. В картине устроения моря конкретное значение «острова» наиболее естественно; иной вариант отмечен в сноске.
theological_decisions:
- issue: Расхождение между трудным еврейским текстом и более ясной греческой параллелью
  choice: 'За основу принят сохранившийся еврейский текст, а греческая параллель использована для уточнения трудных слов; получен смысл: «По своему замыслу Он утихомирил бездну и насадил в ней острова».'
  alternative: «Своей мыслью Он успокоил пучину и утвердил в ней приморские земли».
  rationale: Еврейскому свидетельству отдаётся первенство, но неясность форм משיק и רבה оправдывает обращение к греческим ἐκόπασεν и ἄβυσσον. Текстовая неопределённость открыто обозначена, без придания одному возможному восстановлению догматического веса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Местоимение «Он» написано с прописной буквы как традиционное обозначение Бога; синтаксис остаётся простым и понятным.
