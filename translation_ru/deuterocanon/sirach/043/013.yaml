  source_fidelity: 'Основной текст точно следует сохранившемуся древнееврейскому тексту: גבורתו передано как «Своей мощью», תתוה — осторожным «направляет» с лексической сноской, ברק — «молнию», זיקות — «вспышкам», а במרום — «в вышине». Причинительное «даёт вспышкам торжествовать» адекватно сохраняет принятую в аудите передачу ותנצח как «делает ... преобладающими/торжествующими», не подменяя еврейский текст греческим.'
