  text: By his might he directs the lightning[b][a], and he makes the flashes prevail on high.
translation:
  language: ru
  text: Своей мощью Он направляет молнию[b] и даёт вспышкам торжествовать в вышине.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой версии: «По Своему повелению Он унимает снег и ускоряет молнии Своего суда». Древнееврейский и греческий тексты этой строки существенно различаются.'
    reason: alternative_reading
  - marker: b
    text: Переведённый как «направляет» древнееврейский глагол редок, и его значение здесь не вполне ясно; возможны также переводы «намечает», «очерчивает» или «назначает».
    reason: lexical_alternative
lexical_decisions:
- source_word: גבורתו
  choice: Своей мощью
  rationale: 'Существительное обозначает силу, мощь; творительный оборот естественно передаёт инструментальный смысл: действие совершается Божьей мощью.'
- source_word: תתוה
  choice: Он направляет
  rationale: Редкий и в данном контексте не вполне ясный глагол может означать «намечать», «очерчивать», «направлять» или «назначать». «Направляет» сохраняет представление о Божьем управлении молнией и звучит естественно по-русски; неопределённость отмечена в сноске.
- source_word: ברק
  choice: молнию
  rationale: Обычное древнееврейское обозначение молнии или её яркого блеска.
- source_word: ותנצח
  choice: даёт … торжествовать
  rationale: Передаёт значение превосходства, одоления или торжества, не сводя образ к простому усилению либо посыланию.
- source_word: זיקות
  choice: вспышкам
  rationale: Слово может обозначать огненные вспышки или искры; в параллели с молнией нейтральное «вспышки» уместнее более узких вариантов.
- source_word: במרום
  choice: в вышине
  rationale: Буквально «в высоте, в вышине». Такой перевод сохраняет локативность и поэтический регистр, не уточняя её как строго космологическое понятие.
theological_decisions:
- issue: Существенное расхождение сохранившегося древнееврейского текста с греческой параллелью
  choice: Основной текст следует древнееврейскому свидетельству Каирской генизы и говорит о молнии и вспышках.
  alternative: «По Своему повелению Он унимает снег и ускоряет молнии Своего суда».
  rationale: Для данного стиха первичным является сохранившийся древнееврейский текст. Греческая форма представляет существенно иной текст и потому приводится в сноске, а не смешивается с основным переводом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической интонацией. Прописное «Он» ясно указывает на Бога в контексте, не добавляя конфессионально специфической терминологии. Необычный образ «даёт вспышкам торжествовать» сохранён ради семантики ותנצח и поэтического напряжения исходной строки.
