translation:
  language: ru
  text: Когда оно сияет, оно заставляет мир кипеть[b], и перед его мечом кто устоит?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «перед его мечом»; в греческой версии: «перед его жаром кто устоит?» В основном тексте сохранена еврейская метафора.'
    reason: alternative_reading
  - marker: b
    text: Более древний свидетель из Масады в этом месте сохранился лишь фрагментарно; основная формулировка взята из еврейских рукописей Каирской генизы и сверена с греческой версией.
    reason: textual_variant
lexical_decisions:
- source_word: בהצהירו
  choice: Когда оно сияет
  rationale: Еврейская форма указывает на яркое сияние или пылание солнца. Греческое «в полдень» передаёт время наибольшего жара, но основной текст сохраняет образ сияния еврейского свидетеля.
- source_word: ירתיח
  choice: мир кипит
  rationale: Глагол רתח означает «кипеть, бурлить»; буквальный образ ярко передаёт действие нестерпимого жара и не сглаживается до общего «нагревается».
- source_word: תבל
  choice: мир
  rationale: תבל обозначает мир, особенно обитаемую землю. «Мир» естественно и ёмко звучит по-русски.
- source_word: חרבו
  choice: его мечом
  rationale: Еврейский текст буквально говорит о «его мече», метафорически изображая разящую силу солнца. Греческое «жар» истолковывает этот образ, однако метафора сохранена.
- source_word: מי יתכלכל
  choice: кто устоит?
  rationale: Оборот выражает способность выдержать воздействие, удержаться под его напором. «Кто устоит?» естественно передаёт риторический вопрос и согласуется с греческой параллелью.
