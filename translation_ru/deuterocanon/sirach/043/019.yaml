  text: He spreads frost like salt[c][b][a], and it sprouts like palm shoots.
translation:
  language: ru
  text: Он расстилает иней, словно соль[a][c], и тот прорастает, как пальмовые побеги[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте Каханы буквально читается приблизительно: «туман/иней… лежит, словно соль»; в греческом параллельном тексте: «Он сыплет иней, словно соль, на землю». Строка текстологически неустойчива, поэтому перевод передаёт общий смысл обоих свидетельств, а не следует буквально повреждённому еврейскому чтению.'
    reason: textual_variant
  - marker: b
    text: 'Последний образ можно также перевести: «и он расцветает, как цветы пальмы». С учётом греческого параллельного текста речь может идти о замёрзшем инее, образующем острые ледяные выступы.'
    reason: lexical_alternative
  - marker: c
    text: В масадской рукописи эта часть стиха имеет иное чтение, чем в каирских рукописях Генизы, представленных в издании Каханы; это указывает на повреждение или разночтения в еврейской текстовой традиции.
    reason: textual_variant
lexical_decisions:
- source_word: אד
  choice: Он
  rationale: В дошедшем еврейском тексте стоит существительное «туман, испарение», однако строка текстологически неустойчива. Греческий параллельный текст и контекст гимна указывают на подразумеваемого деятеля — Бога; местоимение сохраняет связность, не вводя в основной текст сомнительный образ «тумана инея».
- source_word: כפור
  choice: иней
  rationale: Слово обозначает иней или изморозь. «Иней» — ясное и поэтически естественное обозначение белого морозного налёта.
- source_word: כמלח
  choice: словно соль
  rationale: Сравнение передаёт белизну и рассыпчатый вид инея; такая формулировка естественна в современном русском языке.
- source_word: ישכון
  choice: расстилает
  rationale: Буквальное значение глагола — «обитать, пребывать, ложиться». Из-за подразумеваемого божественного субъекта употреблена переходная конструкция «расстилает», передающая картину распростёртого инея, но не добавляющая отсутствующего в еврейском тексте указания «по земле».
- source_word: ויציץ
  choice: прорастает
  rationale: Глагол означает «цвести, давать ростки». «Прорастает» сохраняет растительную метафору и допускает образ выступающих кристаллов инея.
- source_word: כתמר
  choice: как пальмовые
  rationale: תמר означает пальму, в том числе финиковую; общее «пальмовые» сохраняет краткость образа без ненужного уточнения вида дерева.
- source_word: ציצים
  choice: побеги
  rationale: Слово может обозначать цветы, бутоны или выступающие растительные образования. «Побеги» согласуются с глаголом «прорастает» и передают сходство с направленными вверх ледяными образованиями.
theological_decisions:
- issue: Подразумеваемый субъект или буквальное существительное в начале строки
  choice: 'Начать с подразумеваемого божественного субъекта: «Он расстилает…»'
  alternative: 'Передать אד буквально: «Туман инея ложится, словно соль»; либо следовать греческому тексту: «Он сыплет иней, словно соль, на землю»'
  rationale: Еврейская строка, по-видимому, повреждена, а иная масадская форма текста подтверждает неустойчивость чтения. Греческий параллельный текст и окружающий гимн описывают действие Бога. Местоимение делает это подразумеваемое отношение явным, но более сильный греческий глагол «сыплет» и слова «на землю» не вносятся в основной текст.
