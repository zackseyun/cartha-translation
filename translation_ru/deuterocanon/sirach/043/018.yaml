translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим строем. «Ослепляет» передаёт блеск снега, а «сердце трепещет» сохраняет неоднозначное внутреннее волнение еврейского глагола и не сводит его только к изумлению.
