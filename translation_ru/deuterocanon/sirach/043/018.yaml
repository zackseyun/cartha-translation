translation:
  language: ru
  text: Вид снега[a] ослепляет глаза, а при его выпадении[b] сердце трепещет[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово можно понять как «белизна», но греческая параллель и метеорологический контекст убедительно указывают на снег.
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение буквально связано с «дождём» или «ливнем» и в данном контексте текстуально затруднительно; греческая параллель поддерживает понимание его как выпадения снега, то есть нисхождения осадков.
    reason: textual_variant
  - marker: c
    text: 'Масадский список сохраняет в этом разделе иную соседнюю строку: «и зрелище изумляет сердце». Это свидетельствует о некоторой неустойчивости порядка поэтических строк в еврейских рукописях.'
    reason: textual_variant
lexical_decisions:
- source_word: תואר
  choice: вид
  rationale: Передаёт зримый облик природного явления; это естественнее по-русски, чем буквальное «форма», и не сужает значение до одной лишь красоты.
- source_word: לבנה
  choice: снег
  rationale: Еврейское слово допускает значение «белизна», однако греческая параллель прямо говорит о снеге (χιόνα), что соответствует метеорологическому контексту главы.
- source_word: יגהה עינים
  choice: ослепляет глаза
  rationale: Передаёт воздействие яркого сияния на зрение. Русское выражение сохраняет силу поэтического образа и согласуется с греческой параллелью, где подчёркнуто изумление глаза.
- source_word: ממטרו
  choice: при его выпадении
  rationale: В дошедшем еврейском тексте употреблено слово из семантического поля дождя или осадков. В контексте снега «выпадение» естественно передаёт нисхождение осадков, не превращая снег в дождь.
- source_word: יהמה לב
  choice: сердце трепещет
  rationale: Глагол выражает шум, волнение или внутреннее смятение. «Трепещет» сохраняет яркую эмоциональную силу еврейского текста, не уточняя однозначно, вызван ли трепет изумлением, восторгом или страхом.
