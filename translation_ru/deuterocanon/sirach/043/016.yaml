base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/043/016.yaml
  text: At the sound of his thunder the earth writhes[b][a]; the blasts of the north are storm and tempest.
translation:
  language: ru
  text: От звука Его грома содрогается земля[b]; порывы севера — буря и ураган[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «И при Его явлении поколеблются горы; по Его воле подует южный ветер». Это чтение существенно отличается от сохранившегося еврейского текста, где во второй строке говорится о порывах севера, буре и урагане.'
    reason: alternative_reading
  - marker: b
    text: Еврейский глагол допускает также переводы «трепещет» и «сотрясается»; он передаёт образ сильного, почти судорожного движения.
    reason: lexical_alternative
lexical_decisions:
- source_word: קול רעמו
  choice: от звука Его грома
  rationale: קול в сочетании с רעם обозначает слышимый звук грома; местоименный суффикс указывает на Бога. Формулировка естественна по-русски и сохраняет теоцентрическую образность.
- source_word: יחיל
  choice: содрогается
  rationale: Глагол חול/חיל может описывать дрожь, сотрясение или мучительное, судорожное движение. «Содрогается» передаёт интенсивность и телесную образность, не сводя смысл к простой вибрации.
- source_word: ארצו
  choice: земля
  rationale: Буквально возможно «Его земля», однако в космическом контексте речь идёт о земле как творении. По-русски опущение притяжательного местоимения здесь естественнее и не сужает смысл до отдельной страны.
- source_word: זלעפות צפון
  choice: порывы севера
  rationale: זלעפות обозначает яростные, опаляющие или бурные порывы; צפון буквально означает «север», здесь — источник северного ветра. Перевод сохраняет краткость и метеорологический образ, не добавляя спорного оттенка жара.
- source_word: סופה וסערה
  choice: буря и ураган
  rationale: Оба слова относятся к сильной, вихревой непогоде. Разведение их как «буря» и «ураган» сохраняет накопление и усиление образа без неестественного повтора.
theological_decisions:
- issue: Притяжательные суффиксы в образах грома и земли
  choice: Сохранено «Его» при слове «гром», но ארצו передано как «земля».
  alternative: «От звука Его грома содрогается Его земля» или «...содрогается Его страна».
  rationale: Принадлежность грома Богу значима в контексте гимна Творцу. Повтор «Его» при «земле» по-русски тяжеловесен, а «страна» неоправданно сужает космический масштаб.
- issue: Существенное расхождение еврейского и греческого текстов
  choice: В основном тексте принят сохранившийся еврейский текст о порывах севера.
  alternative: 'Греческий текст: «И при Его явлении поколеблются горы; по Его воле подует южный ветер».'
  rationale: При наличии еврейского текста он служит основным источником для Сираха. Существенно отличающаяся греческая традиция сохранена в примечании, а не смешана с основным текстом.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной поэтической интонацией. Синтаксический параллелизм и сжатость еврейской строки сохранены; местоимение «Его» написано с прописной буквы по принятой русской библейской издательской традиции.
