translation:
  language: ru
  text: 'Там — чудеса Его дивного творения: всевозможные живые существа и огромные морские создания.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная фраза на еврейском языке трудна и буквально может означать: «и великие/могучие…»; в греческой параллели: «создание морских чудовищ (огромных морских существ)».'
    reason: alternative_reading
lexical_decisions:
- source_word: שם
  choice: Там
  rationale: 'Буквально обозначает место: «там»; тире естественно передаёт безглагольную конструкцию и сохраняет связь с морем в контексте.'
- source_word: פלאות תמהי מעשהו
  choice: чудеса Его дивных деяний
  rationale: Передаёт сочетание слов со значением чуда, изумления и Божьего действия; множественное «деяний» естественно согласуется с собирательным описанием творения.
- source_word: מין כל חי
  choice: всевозможные живые существа
  rationale: Естественно передаёт классифицирующее значение מין и охват כל חי — живых существ всякого рода.
- source_word: וגבורות רבה
  choice: и огромные морские создания
  rationale: Еврейская фраза трудна и буквально допускает значение великих или могучих существ/сил; морской смысл уточняется по контексту и греческой параллели κτίσις κητῶν.
theological_decisions:
- issue: Уточнение трудной заключительной фразы по греческой параллели
  choice: огромные морские создания
  alternative: великие могучие существа; многочисленные силы
  rationale: Еврейский текст сжат и не вполне ясен, тогда как греческая параллель прямо говорит о морских существах. Основной текст передаёт наиболее вероятный контекстуальный смысл, а неопределённость еврейского чтения отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; торжественный, но понятный регистр. Сохранены лаконичность перечисления и указание на место; текстуальная неопределённость не скрыта.
