translation:
  language: ru
  text: Господь внушает величайший трепет, и дивны Его слова[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Господь страшен и весьма велик, и дивно Его владычество» (возможный перевод: «удивительна Его власть»).'
    reason: alternative_reading
lexical_decisions:
- source_word: נורא
  choice: внушает ... трепет
  rationale: Еврейское слово обозначает того, кто вызывает страх и благоговейный трепет. Такая передача сохраняет оба оттенка и не сводит смысл лишь к угрозе.
- source_word: ה׳
  choice: Господь
  rationale: Сокращённое написание указывает на Божье имя; традиционная и естественная русская передача — «Господь».
- source_word: מאד מאד
  choice: величайший
  rationale: Повтор наречия резко усиливает признак. Русская превосходная степень естественно передаёт это усиление без тяжеловесного «очень, очень».
- source_word: ונפלאות
  choice: и дивны
  rationale: Слово от корня פלא выражает необычайность и чудесность. Краткое прилагательное «дивны» сохраняет возвышенный, но понятный регистр без добавления отсутствующей в еврейском связки.
- source_word: דבריו
  choice: Его слова
  rationale: Прямое значение — «его слова/речения». Оно принято в основном тексте согласно сохранившемуся еврейскому чтению.
theological_decisions:
- issue: Передача Божьего имени, обозначенного сокращением ה׳
  choice: Господь
  alternative: ГОСПОДЬ
  rationale: Форма «Господь» естественна для современного русского текста и согласуется с греческим Κύριος, не меняя отождествления с Божьим именем.
- issue: Расхождение еврейского и греческого текста во второй части стиха
  choice: дивны Его слова
  alternative: дивно Его владычество
  rationale: Сохранившийся еврейский текст имеет דבריו — «Его слова», поэтому он определяет основной перевод. Существенно отличающееся греческое чтение сохранено в примечании, а не согласовано с еврейским молча.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Инверсия «дивны Его слова» передаёт краткость еврейской именной фразы; прописная буква в «Его» соответствует принятому благоговейному оформлению.
