translation:
  language: ru
  text: Красота небес и великолепие звезды — её свет сияет на Божьих высотах[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В рукописи из Масады начало строки читается несколько иначе: «…красота неба и великолепие звезды»; в приведённом тексте Каирской генизы: «Красота небес и великолепие звезды». Основной текст следует чтению Каирской генизы.'
    reason: textual_variant
  - marker: b
    text: 'В греческой версии: «красота неба, слава звёзд, сияющее украшение; в вышних — Господь». Здесь говорится о звёздах во множественном числе и о сияющем украшении; однако основной текст следует сохранившемуся еврейскому чтению.'
    reason: alternative_reading
lexical_decisions:
- source_word: תואר
  choice: краса
  rationale: В сочетании с «небесами» слово обозначает их зримую красоту и величие; «краса» сохраняет поэтическую возвышенность и звучит естественно в русском библейском контексте.
- source_word: שמים
  choice: небеса
  rationale: Форма и контекст допускают значение неба или небес; «небеса» сохраняет возвышенный поэтический регистр.
- source_word: הדר
  choice: великолепие
  rationale: Передаёт величественную красоту и при этом лексически отличается от תואר — «краса».
- source_word: כוכב
  choice: звёзд
  rationale: Хотя в данном еврейском свидетельстве стоит форма единственного числа, греческая параллель имеет множественное ἄστρων, а контекст предполагает собирательное значение.
- source_word: ואורו
  choice: их свет
  rationale: Еврейский суффикс формально единственного числа, но при коллективном понимании звёзд естественное русское согласование требует множественного «их»; неоднозначность свидетельства отмечена в сноске.
- source_word: מזהיר
  choice: сияет
  rationale: Причастие передаёт яркое излучение света; глагол «сияет» естественен и не добавляет отдельного наречия усиления.
- source_word: במרומי אל
  choice: в Божьих высотах
  rationale: Сохраняет явное упоминание Бога в אל и пространственный образ принадлежащих Ему небесных высот.
theological_decisions:
- issue: Передача אל в выражении במרומי אל
  choice: Божьих
  alternative: Всевышнего; в вышних
  rationale: Еврейский текст прямо называет Бога; притяжательное прилагательное прозрачно передаёт связь высот с Богом, не устраняя божественное имя и не вводя дополнительного титула.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической лексикой. Пара «краса — великолепие» сохраняет параллелизм и различает два еврейских существительных. Тире естественно связывает описание звёзд с их сиянием.
