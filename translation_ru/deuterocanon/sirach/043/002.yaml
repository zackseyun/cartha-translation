translation:
  language: ru
  text: 'Солнце[a] своим обликом и жаром возвещает: «Как внушают трепет дела Господа!»[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Солнце, возвещающее своим явлением при восходе, — дивное орудие, дело Всевышнего». Еврейский текст вместо этого подчёркивает видимый облик солнца и его жар.'
    reason: alternative_reading
  - marker: b
    text: 'Еврейская фраза сжата и несколько трудна. Глагол передан как «возвещает»: смысл в том, что облик солнца и его жар свидетельствуют о внушающих трепет делах Господа.'
    reason: lexical_alternative
  - marker: c
    text: Масадский еврейский текст сохранил эту строку лишь фрагментарно; более полная формулировка основного текста представлена каирскими рукописями из генизы.
    reason: textual_variant
lexical_decisions:
- source_word: שמש
  choice: Солнце
  rationale: Прямое обозначение небесного светила; в русском определённость не требует артикля.
- source_word: מביע
  choice: являясь
  rationale: Причастие допускает значения проявления, обнаружения или возвещения. «Являясь» сохраняет зрительный оттенок и не устраняет трудность еврейской формулировки; греческое ἐν ὀπτασίᾳ также указывает на видимое явление.
- source_word: בצורתו
  choice: в своём облике
  rationale: Передаёт видимую форму или наружный вид. «Облик» естественнее буквального «форма» в современном литературном русском и согласуется со зрительным контекстом.
- source_word: וחמה
  choice: и пылая
  rationale: Еврейский текст сжат и синтаксически труден; слово, вероятно, указывает на жар солнца. Деепричастие «пылая» естественно соединяется с «являясь» и сохраняет образ жара, не превращая строку в развёрнутую парафразу.
- source_word: מה נורא
  choice: как внушительны
  rationale: נורא выражает то, что вызывает трепет, благоговейный страх и изумление. «Внушительны» здесь сохраняет высокий регистр без разговорного оттенка слова «потрясающи»; необходимый смысл поясняется самим контекстом величия Божьих дел.
- source_word: מעשי ה׳
  choice: дела Господа
  rationale: Сохраняется множественное число מעשי. Почтительное сокращение Божьего имени ה׳ передано традиционным русским титулом «Господь».
theological_decisions:
- issue: Передача сокращённого Божьего имени ה׳
  choice: Господа
  alternative: ГОСПОДА
  rationale: Еврейское почтительное сокращение обозначает Божье имя. В данном русском издании форма «Господь» естественна для связного текста и не вводит дополнительного типографского толкования.
- issue: Связь солнца с Божьими делами
  choice: Солнце своим обликом и жаром свидетельствует о внушительности дел Господа
  alternative: Солнце само названо единственным чудесным орудием и делом Всевышнего
  rationale: Основной перевод следует еврейскому множественному מעשי ה׳ и сохраняет его обобщение о делах Господа; отличающееся греческое прочтение приведено в примечании.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим оттенком. Синтаксическая сжатость оригинала частично сохранена; тире обозначает переход к восклицательной оценке. Все примечания отмечены в основном тексте.
