base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/022.yaml
  text: There is one who destroys his own life through shame[b][a], and because of a foolish face he will lose it.
translation:
  language: ru
  text: Бывает, что человек губит собственную жизнь из-за стыда, а из-за неразумного выражения лица[a] он погубит её[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-за неразумного лица (облика)». Смысл греческого выражения не вполне ясен; вероятно, речь идёт о неразумном выражении лица или внешнем поведении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «погубит свою душу». Греческое ψυχή может означать жизнь, самого человека или душу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολλύων
  choice: губит
  rationale: Причастие ἀπολλύων передаёт действие, ведущее к гибели или утрате. «Губит» сохраняет силу глагола и его связь с будущим ἀπολεῖ.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: собственную жизнь
  rationale: ψυχή может означать жизнь, самого человека или душу. В данном наставлении «жизнь» естественно передаёт практический смысл, не навязывая узкого антропологического толкования; «собственную» выражает принадлежность субъекту.
- source_word: διʼ αἰσχύνην
  choice: из-за стыда
  rationale: διά с винительным падежом обозначает причину; современное русское «из-за стыда» ясно и непосредственно передаёт причинную связь.
- source_word: ἀπὸ ἄφρονος προσώπου
  choice: из-за неразумного выражения лица
  rationale: Оборот буквально связан с «неразумным лицом/обликом». «Выражение лица» естественно по-русски передаёт внешний вид или мимику, а «неразумного» сохраняет значение ἄφρων без усиления до «бесстыдного».
- source_word: ἀπολεῖ αὐτήν
  choice: он погубит её
  rationale: Будущее ἀπολεῖ повторяет тот же глагольный корень, что и ἀπολλύων. Повтор «губит… погубит» сохраняет риторическую связь; «её» отсылает к жизни.
theological_decisions:
- issue: Значение ψυχή в контексте книги Премудрости
  choice: жизнь
  alternative: душа; самого себя
  rationale: Контекст говорит о саморазрушительном поведении. «Жизнь» сохраняет практическую направленность высказывания, тогда как вариант «душа» мог бы неоправданно сузить смысл до метафизического утверждения.
- issue: Смысл ἀπὸ ἄφρονος προσώπου
  choice: из-за неразумного выражения лица
  alternative: из-за неразумного лица; перед лицом глупца
  rationale: Грамматически ἄφρονος согласуется с προσώπου, поэтому сохранено описание лица или внешнего выражения, а не введён отдельный персонаж — глупец. При этом образ остаётся необычным и отмечается сноской.
translation_notes:
  register: Современный литературный русский язык с достоинством, присущим тексту премудрости. Начальное ἔστιν передано безличной конструкцией «Бывает, что человек…», естественной для общего наблюдения. Сохранены причинные обороты и лексический повтор глагола «губить».
