  text: Мало даст, а упрёков выскажет много и откроет уста свои, словно глашатай.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλίγα δώσει
  choice: Мало даст
  rationale: Будущее время сохранено в соответствии с греческой формой; «мало» естественно передаёт субстантивированное среднее множественного числа ὀλίγα при глаголе «давать».
- source_word: πολλὰ ὀνειδίσει
  choice: попрекать будет много
  rationale: ὀνειδίζω означает «попрекать, укорять, поносить»; контекст дара особенно хорошо допускает «попрекать». Постпозиция вспомогательного глагола создаёт естественный контраст с «мало даст» и сохраняет значение будущего времени.
- source_word: ἀνοίξει τὸ στόμα αὐτοῦ
  choice: откроет уста свои
  rationale: Образ исходного текста сохранён буквально и остаётся прозрачным в русском; «уста» поддерживает достоинство афористического регистра без архаической тяжеловесности.
- source_word: ὡς κῆρυξ
  choice: словно глашатай
  rationale: κῆρυξ — публичный глашатай или вестник; «глашатай» передаёт образ громкого публичного объявления точнее, чем нейтральное «вестник».
