  text: Hidden wisdom and an unseen treasure—what benefit is there in either of them?[a]
translation:
  language: ru
  text: Скрытая мудрость и невидимое сокровище — какая польза от них обоих?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «какая польза в обоих?» Греческое выражение относится к двум названным предметам вместе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφία
  choice: мудрость
  rationale: Обычное значение слова в литературе мудрости; оно соответствует теме книги и параллели с сокровищем.
- source_word: κεκρυμμένη
  choice: скрытая
  rationale: Перфектное страдательное причастие обозначает то, что было скрыто и остаётся сокрытым; «скрытая» передаёт это естественно и кратко.
- source_word: θησαυρός
  choice: сокровище
  rationale: Здесь уместен конкретный образ ценности, поставленный в параллель с мудростью.
- source_word: ἀφανής
  choice: невидимое
  rationale: Слово означает невидимое, неявное или скрытое от взора; «невидимое» сохраняет различие с κεκρυμμένη и поэтический параллелизм.
- source_word: τίς ὠφέλεια
  choice: какая польза
  rationale: Естественная современная русская формула вопроса о практической пользе или выгоде.
- source_word: ἐν ἀμφοτέροις
  choice: от них обоих
  rationale: Передаёт формальное указание на оба названных предмета вместе, не заменяя его толкованием «ни от того, ни от другого».
