lexical_decisions:
- source_word: κρείσσων
  choice: лучше
  rationale: Сравнительная форма открывает краткое афористическое сопоставление; «лучше …, чем …» естественно передаёт греческую конструкцию.
- source_word: ἄνθρωπος
  choice: человек
  rationale: Ἄνθρωπος здесь имеет обобщающее значение. Русское «человек» сохраняет единственное число, повтор существительного и применимость изречения к любому человеку.
- source_word: ἀποκρύπτων
  choice: скрывающий
  rationale: Причастие настоящего времени передаёт характеристику человека и позволяет сохранить строгий параллелизм двух частей.
- source_word: μωρίαν
  choice: глупость
  rationale: «Глупость» — ясное современное соответствие μωρία, передающее нравственно-практическое безрассудство без излишнего усиления.
- source_word: σοφίαν
  choice: мудрость
  rationale: Основное соответствие σοφία и ключевое понятие книги; его следует сохранять без контекстуально неоправданного сужения.
