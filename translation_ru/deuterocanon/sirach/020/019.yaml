  text: Неприятный человек — неуместное слово[a]; в устах невоспитанных оно будет повторяться без конца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нелюбезный человек — несвоевременный рассказ». Обе части первой строки в греческом тексте предельно кратки и допускают несколько близких переводов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχαρις
  choice: неучтивый
  rationale: Прилагательное обозначает человека, которому недостаёт приятности, любезности или благожелательности. «Неучтивый» сохраняет характеристику поведения и не сужает смысл до одной лишь неблагодарности.
- source_word: μῦθος
  choice: слово
  rationale: В этом кратком изречении речь идёт скорее о высказанном замечании или речи, чем о развёрнутом рассказе. «Слово» естественно звучит в русском афористическом контексте.
- source_word: ἄκαιρος
  choice: неуместное
  rationale: Слово указывает на сказанное не вовремя, не к месту. «Неуместное» передаёт и временную, и социальную несообразность высказывания.
- source_word: ἀπαιδεύτων
  choice: невоспитанных
  rationale: Термин обозначает людей без должного обучения, воспитания и внутренней дисциплины. «Невоспитанных» здесь лучше передаёт нравственно-социальный смысл, чем узкое «необразованных».
- source_word: ἐνδελεχισθήσεται
  choice: будет повторяться без конца
  rationale: Будущая пассивная форма выражает постоянное продолжение или многократное повторение. Такой перевод ясно передаёт контекстуальную мысль о неуместном слове, которое вновь и вновь произносят.
- source_word: ἐν στόματι
  choice: в устах
  rationale: Сохранён традиционный и понятный русский образ речи, исходящей от человека.
