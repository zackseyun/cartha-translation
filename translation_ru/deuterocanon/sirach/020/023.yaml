  yaml_path: translation/deuterocanon/sirach/020/023.yaml
  text: There is one who promises a favor out of shame to a friend[a], and so acquires him as an enemy for nothing.
translation:
  language: ru
  text: Бывает, что человек из стыда обещает другу услугу и тем самым без всякой пользы приобретает в нём врага.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни за что»; греческое наречие может указывать как на напрасность, так и на отсутствие достаточной причины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάριν
  choice: услугу
  rationale: В данном контексте слово обозначает конкретное благодеяние или услугу, а не богословскую «благодать».
- source_word: αἰσχύνης
  choice: из стыда
  rationale: 'Родительный падеж выражает побуждение: человек обещает под давлением чувства стыда или неловкости.'
- source_word: ἐπαγγελλόμενος
  choice: обещает
  rationale: Естественно передаёт действие причастия без ненужного расширения смысла.
- source_word: φίλῳ
  choice: другу
  rationale: Дательный падеж указывает на получателя обещанной услуги.
- source_word: ἐκτήσατο
  choice: приобретает
  rationale: 'Сохраняет иронию греческого глагола: результатом обещания становится приобретение врага; русское настоящее уместно для общего мудрого изречения.'
- source_word: ἐχθρόν
  choice: врага
  rationale: Прямой и обычный эквивалент греческого существительного.
- source_word: δωρεάν
  choice: без всякой пользы
  rationale: Передаёт значение напрасности, то есть отсутствие выгоды или смысла, и сохраняет иронию высказывания.
