  yaml_path: translation/deuterocanon/sirach/020/029.yaml
  text: Hospitality and gifts blind the eyes of the wise[b][a], and like a muzzle on the mouth they turn away rebukes.
translation:
  language: ru
  text: Гостеприимство[a] и подарки[b] ослепляют глаза мудрых и, словно намордник на устах, отвращают обличения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дары гостю»; греческое ξένια может означать как гостеприимство, так и дары, связанные с отношениями гостеприимства.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «подарки» подразумевают дары и услуги, способные исказить суждение; греческий текст прямо не говорит «взятки».
    reason: lexical_alternative
lexical_decisions:
- source_word: ξένια
  choice: гостеприимство
  rationale: Слово может обозначать гостеприимство либо дары, связанные с отношениями гостеприимства. В сочетании с δῶρα перевод «гостеприимство» сохраняет различие двух понятий и передаёт социальное расположение, способное повлиять на суждение.
- source_word: δῶρα
  choice: подарки
  rationale: Буквально — «дары, подарки». Контекст допускает мысль о подкупе, но греческий текст прямо не называет их взятками.
- source_word: ἀποτυφλοῖ
  choice: ослепляют
  rationale: Сильный глагол со значением «делать слепым»; перевод сохраняет образ утраты нравственной проницательности.
- source_word: ὀφθαλμοὺς σοφῶν
  choice: глаза мудрых
  rationale: Прямо передаёт греческую конструкцию и сохраняет образ зрения.
- source_word: φιμός
  choice: намордник
  rationale: Конкретный образ приспособления, закрывающего рот; «намордник» точнее сохраняет метафору, чем пояснительное «кляп».
- source_word: ἀποτρέπει
  choice: отвращают
  rationale: Передаёт значение «отводить, отклонять, предотвращать» и сохраняет направительный образ греческого глагола.
- source_word: ἐλεγμούς
  choice: обличения
  rationale: В литературе мудрости обозначает порицания или исправляющие укоры; «обличения» сохраняет нравственную силу и уместно для возвышенного, но современного библейского регистра.
