  text: There is a gift that will not profit you[a], and there is a gift whose repayment is double.
translation:
  language: ru
  text: Бывает дар[a], который не принесёт тебе пользы, и бывает дар, воздаяние за который — двойное.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «даяние». Греческое слово может обозначать как сам акт даяния, так и то, что даётся.'
    reason: lexical_alternative
lexical_decisions:
- source_word: δόσις
  choice: дар
  rationale: Слово обозначает акт или результат даяния. «Дар» естественно и кратко звучит в русском изречении, не сужая смысл до обычного подарка.
- source_word: λυσιτελήσει
  choice: не принесёт пользы
  rationale: Будущая форма глагола передаёт отсутствие пользы или выгоды; выбранное выражение естественно в современном русском и не ограничивает смысл материальной прибылью.
- source_word: σοι
  choice: тебе
  rationale: Дательный падеж указывает на лицо, для которого дар оказывается полезным или бесполезным.
- source_word: ἀνταπόδομα
  choice: воздаяние
  rationale: Существительное означает то, что даётся в ответ или возвращается. «Воздаяние» сохраняет широкий взаимный смысл, не сводя его к погашению денежного долга.
- source_word: διπλοῦν
  choice: двойное
  rationale: Прямо передаёт значение «двойное, вдвое большее» и согласуется с существительным «воздаяние».
