translation:
  language: ru
  text: Те, кто ест мой хлеб, злы на язык. Как часто и сколь многие будут смеяться[a] над ним[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут насмехаться над ним» или «будут осмеивать его». Греческий глагол может обозначать не просто смех, а унизительную насмешку.'
    reason: lexical_alternative
  - marker: b
    text: Вторая фраза в греческом тексте необычно сжата, а переход от «мой» к «ним» резок. Перевод сохраняет дошедшую формулировку, не пытаясь её существенно сгладить.
    reason: textual_variant
lexical_decisions:
- source_word: οἱ ἐσθίοντες
  choice: те, кто ест
  rationale: Субстантивированное причастие настоящего времени обозначает людей, которые обычно или в данный период едят; русская конструкция естественно сохраняет этот общий смысл.
- source_word: τὸν ἄρτον μου
  choice: мой хлеб
  rationale: Буквальная и естественная передача образа хлеба как предоставленной пищи и участия в трапезе; более общее «мою пищу» неоправданно устранило бы конкретный образ.
- source_word: φαῦλοι γλώσσῃ
  choice: злы на язык
  rationale: φαῦλοι выражает нравственно отрицательную оценку, а дательный γλώσσῃ указывает на речь; современный русский оборот передаёт злую, недоброжелательную речь, сохраняя образ языка.
- source_word: ποσάκις
  choice: как часто
  rationale: Прямой и естественный эквивалент вопросительного наречия.
- source_word: καὶ ὅσοι
  choice: и сколь многие
  rationale: Формулировка сохраняет параллельный вопросительный элемент и нарочитую сжатость греческой фразы, не добавляя отсутствующего существительного «люди».
- source_word: καταγελάσονται
  choice: будут смеяться над
  rationale: Глагол означает смеяться над кем-либо, высмеивать или осмеивать; основной текст передаёт наиболее прямое значение, а более сильный оттенок указан в сноске.
- source_word: αὐτοῦ
  choice: ним
  rationale: Местоимение мужского рода в родительном падеже при καταγελάω естественно указывает на человека; неясность его референта в сжатом контексте не устраняется добавлением пояснения.
theological_decisions:
- issue: Резкий переход от первого лица «мой хлеб» к третьему лицу «над ним» и сжатость второго предложения
  choice: 'Сохранить смену лица и форму вопроса: «Как часто и сколь многие будут смеяться над ним?»'
  alternative: 'Сгладить: «Как часто и сколько людей смеются надо мной!»'
  rationale: Дошедший греческий текст синтаксически резок и, возможно, сжат или повреждён. Замена «ним» на «мной», времени глагола либо вопроса на восклицание разрешила бы неопределённость без достаточного основания.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формулировкой. Оборот «злы на язык» понятен широкому читателю и сохраняет конкретный образ речи; «сколь многие» слегка возвышенно, но уместно для библейской риторики и отражает сжатость оригинала.
