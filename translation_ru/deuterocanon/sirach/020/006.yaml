  text: There is one who keeps silent because there is no answer[b][a], and there is one who keeps silent because he sees the right time.
translation:
  language: ru
  text: Один молчит, потому что ему нечего ответить[b], другой — потому что видит подходящее время.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Мудрый человек будет молчать до подходящего времени, а болтун и глупец не соблюдёт надлежащего времени». Еврейская и греческая формы этой пословицы заметно различаются; основной текст следует сохранившемуся еврейскому свидетельству, а греческий текст подтверждает оттенок уместного времени.'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «из-за отсутствия ответа»; также возможно: «потому что у него нет ответа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲרִישׁ
  choice: молчит
  rationale: Причастие от חרש обозначает воздержание от речи. Настоящее время естественно передаёт обобщённый, пословичный характер высказывания.
- source_word: מֵאֵין מַעֲנֶה
  choice: потому что ему нечего ответить
  rationale: Еврейский оборот буквально указывает на отсутствие ответа. Русская формулировка естественна и сохраняет причинный смысл, не приписывая молчанию мудрости.
- source_word: עֵת
  choice: подходящее время
  rationale: עֵת означает «время, пора» и в контексте мудрости подразумевает уместный момент; греческая параллель с καιρός подтверждает оттенок своевременности.
- source_word: רֹאֶה עֵת
  choice: видит подходящее время
  rationale: Сохранён еврейский образ «видеть время», при этом прилагательное «подходящее» делает ясным подразумеваемый смысл уместного момента.
