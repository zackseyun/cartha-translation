translation_notes:
  register: Современный литературный русский язык с кратким афористическим ритмом. Парные обороты «бывает, кто… / а бывает, кого…» сохраняют структуру еврейской сентенции; тире подчёркивает следствие, не устраняя смысловой связи оригинала.
