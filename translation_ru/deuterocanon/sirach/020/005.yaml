translation:
  language: ru
  text: Есть тот, кто молчит и считается мудрым[a], и есть тот, кого презирают за многословие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Есть тот, кто молчит, потому что ему нечего ответить, и есть тот, кто молчит, зная подходящее время». Сохранившийся здесь еврейский текст существенно отличается; основной текст следует еврейскому свидетельству как первичному источнику для Книги Иисуса, сына Сирахова, там, где оно доступно.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁ
  choice: Бывает, кто
  rationale: Экзистенциальная конструкция вводит тип человека; русский оборот естественно передаёт обобщённый характер изречения и сохраняет параллелизм.
- source_word: מַחֲרִישׁ
  choice: молчит
  rationale: Причастие от חרש обозначает сохраняющего молчание; настоящее время передаёт характерное, повторяющееся поведение.
- source_word: וְנֶחְשָׁב
  choice: и его считают
  rationale: Нифаль выражает оценку человека другими; активная неопределённо-личная конструкция звучит по-русски естественнее буквального пассива.
- source_word: חָכָם
  choice: мудрым
  rationale: Прямо передаёт обычное для литературы мудрости значение прилагательного и согласуется с конструкцией «считают кем».
- source_word: נִמְאָס
  choice: кого презирают
  rationale: מאס здесь выражает отвержение и пренебрежение; «презирают» сохраняет резкий социально-оценочный контраст с признанием мудрым.
- source_word: בְּרוֹב שִׂיחַ
  choice: за многословие
  rationale: Сочетание указывает на причину презрения — избыток речи. «Многословие» кратко и естественно передаёт это значение, не сводя его непременно к разговорчивости.
