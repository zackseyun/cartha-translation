translation:
  language: ru
  text: Притча из уст глупца будет отвергнута[a], ибо он ни за что не скажет её в надлежащий момент.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мудрое изречение будет отвергнуто»; греч. παραβολή может обозначать притчу, сравнение или мудрое изречение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ στόματος μωροῦ
  choice: из уст глупца
  rationale: Предложное сочетание обозначает источник высказывания; конкретный греческий образ естественно сохраняется по-русски. «Глупец» в литературе мудрости указывает на нравственно и житейски неразумного человека.
- source_word: ἀποδοκιμασθήσεται
  choice: будет отвергнута
  rationale: Будущее страдательного залога сохранено без уточнения того, кем именно отвергается изречение.
- source_word: παραβολή
  choice: притча
  rationale: «Притча» сохраняет широкий диапазон παραβολή — образное мудрое изречение, сравнение или притчу — и избегает неоправданного сужения до пословицы.
- source_word: οὐ γὰρ μὴ εἴπῃ
  choice: потому что он непременно скажет… некстати
  rationale: 'Эмфатическое отрицание относится к своевременности речи: глупец никак не произнесёт притчу в подобающий момент. В естественном русском это передано утвердительной конструкцией с «непременно» и «некстати».'
- source_word: ἐν καιρῷ αὐτῆς
  choice: некстати
  rationale: καιρός означает подходящий, уместный момент; отрицательная конструкция естественно передаётся наречием «некстати», сохраняя временной и прагматический оттенки.
