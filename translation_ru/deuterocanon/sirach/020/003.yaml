  text: Like a eunuch’s desire to deflower a young woman, so is one who executes judgments by force.
translation:
  language: ru
  text: Как желание евнуха лишить девственности молодую женщину, таков и тот, кто силой[a] вершит суд[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с насилием». Греческое выражение может обозначать как принуждение, так и насильственное действие.'
    reason: lexical_alternative
  - marker: b
    text: Образ может подчёркивать недопустимость принудительного суда либо его несообразность и тщетность.
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπιθυμία
  choice: желание
  rationale: Нейтрально и точно передаёт желание или влечение, не усиливая без необходимости сексуальный оттенок, уже очевидный из контекста.
- source_word: εὐνούχου
  choice: евнуха
  rationale: Общепринятый и точный русский эквивалент, сохраняющий существенный для образа физический и культурный смысл.
- source_word: ἀποπαρθενῶσαι
  choice: лишить девственности
  rationale: Прямо передаёт конкретное значение глагола и звучит яснее для современного читателя, чем литературное «обесчестить».
- source_word: νεάνιδα
  choice: молодую женщину
  rationale: Естественно передаёт обозначение молодой женщины, не прибегая к архаичному «девица» и не сужая значение до ребёнка.
- source_word: οὕτως
  choice: таков и
  rationale: Ясно вводит вторую часть сравнения и естественно звучит в русском афористическом изречении.
- source_word: ὁ ποιῶν ... κρίματα
  choice: тот, кто ... вершит суд
  rationale: Передаёт действие по вынесению или осуществлению судебных решений; выражение «вершить суд» естественно и сохраняет судебный смысл κρίματα.
- source_word: ἐν βίᾳ
  choice: силой
  rationale: Кратко передаёт принуждение; возможный оттенок насилия отмечен в сноске.
theological_decisions:
- issue: Смысл сопоставления в притче
  choice: Образ и сравнение сохранены без поясняющего истолкования в основном тексте.
  alternative: Понимать сравнение исключительно как осуждение насильственного суда либо исключительно как указание на его нелепость, несообразность или тщетность.
  rationale: Греческий текст не раскрывает основание сравнения; сноска сохраняет заложенную в нём смысловую напряжённость, не закрепляя одну трактовку как единственную.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. Формулировка намеренно сохраняет резкость исходного образа и неоднозначность его нравственного акцента.
