  text: У человека бывает успех в злых делах[a], и бывает находка, ведущая к убытку.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «У человека бывает благополучие среди бедствий, и бывает обретение, ведущее к уменьшению». Греческое изречение кратко и неоднозначно: ἐν κακοῖς может означать как «в злых делах», так и «среди бедствий/несчастий».'
