lexical_decisions:
- source_word: εὐοδία
  choice: успех
  rationale: Слово обозначает благоприятный ход дела или успешный исход. «Успех» естественно передаёт иронию изречения, не ограничивая смысл материальным благополучием.
- source_word: ἐν κακοῖς
  choice: во зле
  rationale: Греческое выражение допускает понимание как нравственного зла, так и бедствий. В контексте афористического предостережения вероятнее нравственный смысл; краткое «во зле» сохраняет некоторую смысловую сжатость оригинала.
- source_word: ἀνδρί
  choice: человеку
  rationale: Дательный падеж обозначает лицо, которому выпадает такой успех. В русском языке родовое «человеку» естественно для универсального изречения и не меняет референциального объёма греческого текста.
- source_word: εὕρεμα
  choice: находка
  rationale: Сохраняет основной образ чего-либо найденного или обретённого и не превращает подразумеваемую выгоду в однозначно денежную прибыль.
- source_word: εἰς ἐλάττωσιν
  choice: ведущая к убытку
  rationale: Буквально выражение указывает на уменьшение. «Ведущая к убытку» естественно передаёт парадокс приобретения, итогом которого становится потеря.
theological_decisions:
- issue: Нравственный или обстоятельственный смысл ἐν κακοῖς
  choice: «во зле» — преимущественно нравственное понимание
  alternative: «в бедствиях» или «среди несчастий»
  rationale: Предостерегающий параллелизм с приобретением, ведущим к ущербу, поддерживает нравственное прочтение, однако греческая формулировка остаётся неоднозначной; это отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная форма изречения. Сохранены параллелизм и парадокс оригинала, а его подлинная неоднозначность вынесена в сноску.
