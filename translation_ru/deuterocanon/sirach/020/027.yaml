  terminology: «Мудрый» и «рассудительный человек» удачно различают σοφός и φρόνιμος. «Вельмож» допустимо передаёт μεγιστᾶσιν, не сужая его до конкретной официальной должности. Сноска надлежащим образом отмечает диапазон значений («знатные», «влиятельные люди», «правители») и объясняет широкую социально-властную референцию греческого слова.
