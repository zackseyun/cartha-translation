  yaml_path: translation/deuterocanon/sirach/020/027.yaml
  text: A wise man will advance himself by his words[a], and a prudent man will please great men.
translation:
  language: ru
  text: Мудрый своими словами проложит себе путь, а рассудительный человек снискает расположение вельмож.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знатных», «влиятельных людей» либо «правителей». Греческое слово в широком смысле обозначает людей высокого положения и власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σοφὸς
  choice: мудрый
  rationale: В контексте литературы мудрости слово обозначает человека, наделённого практической мудростью; субстантивированное «мудрый» естественно передаёт греческую форму.
- source_word: ἐν λόγοις
  choice: своими словами
  rationale: 'ἐν имеет здесь инструментальный оттенок: слова служат средством продвижения. Притяжательное «своими» естественно соотносит речь с подлежащим.'
- source_word: προάξει ἑαυτόν
  choice: проложит себе путь
  rationale: Буквально выражение означает «продвинет себя вперёд». Русская формулировка передаёт достижение продвижения благодаря речи, не придавая ему обязательно отрицательного оттенка саморекламы.
- source_word: ἄνθρωπος φρόνιμος
  choice: рассудительный человек
  rationale: φρόνιμος подчёркивает здравомыслие и практическую рассудительность; «человек» точно передаёт ἄνθρωπος и звучит естественно в параллельной строке.
- source_word: ἀρέσει
  choice: снискает расположение
  rationale: Глагол означает «угодит, будет приятен». В сочетании с влиятельными людьми оборот «снискает расположение» естественно передаёт социальный смысл, не усиливая его до покровительства.
- source_word: μεγιστᾶσιν
  choice: вельмож
  rationale: Слово обозначает высокопоставленных, влиятельных или знатных лиц. «Вельможи» сохраняет социальную значимость, не ограничивая значение конкретной государственной должностью.
