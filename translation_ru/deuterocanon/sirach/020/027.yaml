  source_fidelity: 'Текст точно передаёт греческий параллелизм и будущие формы: σοφὸς ἐν λόγοις προάξει ἑαυτόν — «Мудрый своими словами проложит себе путь», ἄνθρωπος φρόνιμος ἀρέσει μεγιστᾶσιν — «рассудительный человек снискает расположение вельмож». «Проложит себе путь» естественно выражает продвижение самого себя без неоправданно отрицательной окраски саморекламы; «снискает расположение» корректно передаёт ἀρέσει в данном социальном контексте.'
