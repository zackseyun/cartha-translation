translation:
  language: ru
  text: Вор предпочтительнее того, кто упорно лжёт; но оба унаследуют погибель.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱρετὸν
  choice: предпочтительнее
  rationale: Передаёт сравнительное значение «достойнее выбора, предпочтительнее» естественным для русского языка способом.
- source_word: κλέπτης
  choice: вор
  rationale: Обычное значение — тот, кто крадёт; слово не предполагает насильственного разбоя.
- source_word: ἐνδελεχίζων
  choice: тот, кто упорствует
  rationale: Причастие выражает продолжающееся, устойчивое действие; «упорствует» сохраняет его длительный и привычный характер.
- source_word: ψεύδει
  choice: во лжи
  rationale: Дательный падеж обозначает сферу постоянного поведения; сочетание «упорствует во лжи» естественно по-русски.
- source_word: ἀμφότεροι
  choice: оба
  rationale: Точно и кратко обозначает обоих сопоставленных людей.
- source_word: ἀπώλειαν
  choice: погибель
  rationale: Передаёт тяжёлый исход — гибель или уничтожение — не превращая слово в узкий богословский термин.
- source_word: κληρονομήσουσιν
  choice: унаследуют
  rationale: 'Сохраняет прямой образ наследования и иронию изречения: их уделом станет погибель.'
theological_decisions:
- issue: Нравственное сопоставление в изречении
  choice: 'Текст прямо называет вора предпочтительнее человека, упорствующего во лжи, однако не оправдывает воровство: погибель ожидает обоих.'
  alternative: Можно понимать сопоставление как гиперболический приём литературы мудрости, особо подчёркивающий пагубность постоянной лжи.
  rationale: Греческое αἱρετὸν выражает действительное предпочтение, а вторая часть сохраняет нравственное напряжение, осуждая обоих.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная и торжественно-сдержанная формулировка. Образ наследования сохранён буквально. Сноска не требуется, поскольку «предпочтительнее» прямо и ясно передаёт αἱρετὸν.
