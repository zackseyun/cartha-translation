lexical_decisions:
- source_word: ἐλάττωσις
  choice: унижение
  rationale: Существительное обозначает умаление, понижение или унижение. В данном изречении «унижение» естественно передаёт социально воспринимаемое низкое положение и сохраняет противопоставление славе.
- source_word: ἕνεκεν
  choice: ради
  rationale: Предлог может указывать на цель или причину. «Ради» кратко и естественно сохраняет связь унижения со славой, не разворачивая её в явное утверждение о результате.
- source_word: δόξης
  choice: славы
  rationale: Слово может означать славу, честь или почёт. «Слава» сохраняет широту значения и возвышенное противопоставление унижению.
- source_word: ταπεινώσεως
  choice: унижения
  rationale: Здесь речь идёт об исходном низком или униженном состоянии, а не обязательно о нравственной добродетели смирения.
- source_word: ἦρεν κεφαλήν
  choice: поднял голову
  rationale: Сохранён конкретный греческий образ, который обозначает выход из приниженного состояния, обретение достоинства или уверенности.
- source_word: ἔστιν ὃς
  choice: бывает тот, кто
  rationale: Такая формулировка естественно передаёт обобщённый, афористический характер греческой конструкции.
- source_word: ἀπὸ ταπεινώσεως
  choice: после унижения
  rationale: Буквальное «из унижения» по-русски неестественно. «После унижения» ясно передаёт исходное состояние, из которого человек возвысился, не уточняя способ этого перехода.
