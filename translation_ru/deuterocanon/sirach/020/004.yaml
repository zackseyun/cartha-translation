translation:
  language: ru
  text: Иной молчит — и его признают мудрым, а иной ненавистен из-за многословия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιν
  choice: иной
  rationale: Повторяющаяся конструкция ἔστιν вводит два противопоставленных типа людей; «иной… а иной…» естественно передаёт эту форму русской пословичной речи.
- source_word: σιωπῶν
  choice: молчит
  rationale: Причастие настоящего времени обозначает продолжающееся молчание; глагольная форма звучит по-русски естественно и не добавляет мотива намеренной сдержанности.
- source_word: εὑρισκόμενος σοφός
  choice: его находят мудрым
  rationale: Сохранён пассивный смысл «оказывается/признаётся мудрым» без окончательного решения, идёт ли речь об обнаруженном качестве или о мнении окружающих.
- source_word: μισητός
  choice: становится ненавистен
  rationale: Прилагательное передаёт положение человека как вызывающего ненависть; добавленное «становится» естественно связывает это положение с указанной далее причиной.
- source_word: ἀπὸ πολλῆς λαλιᾶς
  choice: из-за многословия
  rationale: Предлог ἀπό выражает причину, а πολλὴ λαλιά — чрезмерную разговорчивость; «многословие» кратко и уместно для афористического контекста.
