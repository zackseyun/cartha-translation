    issue: «Поднимет свой ворох зерна» двусмысленно и неестественно по-русски.
    rationale: Буквальное «поднимет» обычно описывает физическое действие. В данном аграрном изречении ἀνυψώσει по смыслу говорит о возрастании/увеличении хлебной кучи.
  - severity: medium
    issue: «Искупит несправедливость» — неустойчивое современное словосочетание.
    rationale: По-русски обычно искупают вину, грех или проступок. «Загладит несправедливость» естественно выражает исправление или искупление неправды; сноска сохраняет более буквальную экспиаторную альтернативу.
