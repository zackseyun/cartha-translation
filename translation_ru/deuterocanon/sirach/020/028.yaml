  yaml_path: translation/deuterocanon/sirach/020/028.yaml
  text: The one who works the land will raise up his grain heap[a], and the one who pleases great men will atone for injustice.
translation:
  language: ru
  text: Кто возделывает землю, тот увеличит свой ворох зерна, а кто угождает вельможам, тот загладит несправедливость.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искупит неправду». Греческий глагол может обозначать искупление или умилостивление; возможно, речь идёт о практическом результате расположения влиятельных людей.'
    reason: Лексическая альтернатива и сохранение неоднозначности второй половины стиха.
lexical_decisions:
- source_word: ὁ ἐργαζόμενος γῆν
  choice: кто возделывает землю
  rationale: Субстантивированное причастие передано естественной для русского языка обобщающей конструкцией; «возделывает» ясно выражает земледельческий контекст.
- source_word: ἀνυψώσει
  choice: поднимет
  rationale: Сохранено основное образное значение глагола — «поднять, возвысить»; в сочетании с ворохом оно также подразумевает увеличение урожая.
- source_word: θιμωνιὰν αὐτοῦ
  choice: свой ворох зерна
  rationale: θιμωνιά обозначает сложенный в кучу урожай, зерно или снопы. «Ворох зерна» сохраняет земледельческий образ и понятно современному читателю.
- source_word: ὁ ἀρέσκων
  choice: кто угождает
  rationale: Глагол означает «быть угодным, нравиться, угождать». Перевод не добавляет явно отрицательного оттенка заискивания.
- source_word: μεγιστᾶσιν
  choice: вельможам
  rationale: Слово обозначает знатных и влиятельных людей. «Вельможи» передаёт высокий общественный статус, не сужая значение до правителей.
- source_word: ἐξιλάσεται
  choice: искупит
  rationale: Сохранена сильная искупительная семантика глагола, а не только прагматический смысл сокрытия или заглаживания проступка.
- source_word: ἀδικίαν
  choice: несправедливость
  rationale: Передаёт морально-социальное значение ἀδικία и сохраняет необычное, напряжённое сочетание с глаголом «искупит».
theological_decisions:
- issue: Означает ли вторая половина стиха собственно искупление несправедливости или практическое заглаживание проступка благодаря расположению влиятельных людей?
  choice: 'Сохранить в основном тексте: «искупит несправедливость».'
  alternative: «загладит неправду» или «покроет проступок»
  rationale: ἐξιλάσεται несёт искупительно-умилостивительное значение. Контекст допускает прагматический или иронический смысл, но перевод не должен устранять заложенное в греческом тексте смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического изречения. Параллельная конструкция «кто… тот…» делает две части ясными; «ворох зерна» сохраняет конкретный земледельческий образ, а необычное «искупит несправедливость» намеренно удерживает смысловое и богословское напряжение оригинала.
