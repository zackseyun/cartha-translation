- from: Кто возделывает землю, тот поднимет свой ворох зерна, а кто угождает вельможам, тот искупит несправедливость.[a]
  to: Кто возделывает землю, тот увеличит свой ворох зерна, а кто угождает вельможам, тот загладит несправедливость.[a]
