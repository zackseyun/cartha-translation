  text: There is a rebuke that is not timely[a], and there is one who keeps silent and is himself wise.
translation:
  language: ru
  text: Бывает обличение не ко времени[a], а иной молчит — и сам он благоразумен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неуместно» либо «несвоевременно». Греческое слово может означать «своевременный», «уместный», а в других контекстах — «прекрасный»; здесь речь, вероятно, об уместности момента.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγχος
  choice: обличение
  rationale: Слово обозначает словесное выявление проступка и порицание. «Обличение» сохраняет строгость греческого термина и уместно в афористическом контексте.
- source_word: ὡραῖος
  choice: ко времени
  rationale: В сочетании с обличением прилагательное выражает своевременность и уместность, а не обычное для иных контекстов значение «прекрасный».
- source_word: σιωπῶν
  choice: молчит
  rationale: Личная форма естественно передаёт причастие и представляет молчание как осознанное поведение человека.
- source_word: φρόνιμος
  choice: благоразумен
  rationale: Здесь подразумевается практическая мудрость — способность разумно поступить в конкретной ситуации; «благоразумен» точнее передаёт этот оттенок, чем более широкое «мудр».
- source_word: καὶ αὐτός
  choice: и сам он
  rationale: Оборот сохраняет эмфатическое указание на самого молчащего и не устраняет возможную смысловую напряжённость второй части изречения.
