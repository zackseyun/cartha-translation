revisions:
- from: Как хорошо обличить, вместо того чтобы гневаться, — и тот, кто признаёт вину[a], будет убережён от ущерба[b].
  to: Как хорошо обличить, а не гневаться; признающийся будет избавлен от ущерба[a].
  rationale: Убрано добавленное «вину», поскольку греческий текст не уточняет объект признания. Объединённая сноска документирует эту неопределённость и допустимые оттенки слова ἐλάττωσις. Смысл, регистр и афористическая лаконичность исходного текста сохранены.
