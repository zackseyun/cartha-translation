  text: How good it is to reprove rather than to become angry[a], and the one who confesses will be kept from loss.
translation:
  language: ru
  text: Как хорошо обличить, а не гневаться; признающийся будет избавлен от ущерба[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет удержан от потери». Буквально: «признающийся» или «открыто признающий»; что именно он признаёт, в греческом тексте не сказано. Слово, переданное как «ущерб», также может означать потерю, урон или неблагоприятное положение.'
    reason: Сохраняет невыраженный объект ἀνθομολογούμενος и передаёт смысловую широту ἐλάττωσις.
lexical_decisions:
- source_word: Ὡς καλὸν
  choice: Как хорошо
  rationale: Сохраняет восклицательную нравственную оценку греческого оборота и естественно звучит по-русски.
- source_word: ἐλέγξαι
  choice: обличить
  rationale: Передаёт словесное выявление проступка и порицание; в контексте наставления точнее, чем общее «исправить», и не обязательно столь резко, как «осудить».
- source_word: ἢ θυμοῦσθαι
  choice: вместо того чтобы гневаться
  rationale: В данном сопоставлении ἤ имеет сравнительное значение «нежели / вместо того чтобы», а θυμοῦσθαι обозначает проявление или возникновение гнева.
- source_word: ὁ ἀνθομολογούμενος
  choice: тот, кто признаёт вину
  rationale: Причастие обозначает того, кто открыто признаёт или исповедует; «вину» естественно восполняет подразумеваемый объект, однако его отсутствие в греческом отмечено сноской.
- source_word: ἀπὸ ἐλαττώσεως
  choice: от ущерба
  rationale: ἐλάττωσις может означать уменьшение, утрату, ущерб или невыгодное положение. «Ущерб» сохраняет широту возможных неблагоприятных последствий.
- source_word: κωλυθήσεται
  choice: будет убережён от
  rationale: Будущее страдательного залога κωλύω с ἀπό выражает предотвращение неблагоприятного последствия; эта формулировка естественна для русского изречения.
