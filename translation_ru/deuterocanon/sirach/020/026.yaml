  text: Нрав лживого человека — бесчестье, и стыд его постоянно с ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦθος
  choice: нрав
  rationale: В данном контексте слово обозначает устойчивый склад характера или привычный образ поведения. «Нрав» естественно и ёмко передаёт эту моральную характеристику.
- source_word: ἀνθρώπου ψευδοῦς
  choice: лживого человека
  rationale: Родительное словосочетание характеризует человека как склонного ко лжи. «Лживого человека» звучит естественно по-русски и передаёт устойчивую черту, не делая акцента на одном отдельном случае лжи.
- source_word: ἀτιμία
  choice: бесчестье
  rationale: Слово указывает на утрату чести и постыдное состояние. «Бесчестье» сохраняет связь с понятием чести и не сливается по значению со следующим αἰσχύνη.
- source_word: αἰσχύνη
  choice: позор
  rationale: '«Позор» передаёт общественно заметный стыд, сопровождающий лжеца, и позволяет различить два близких греческих существительных: ἀτιμία и αἰσχύνη.'
- source_word: μετʼ αὐτοῦ
  choice: с ним
  rationale: Прямой и естественный перевод предложного оборота без добавочного толкования.
- source_word: ἐνδελεχῶς
  choice: неизменно
  rationale: Наречие выражает постоянство и непрерывное пребывание. «Неизменно» естественно сочетается с «с ним» и передаёт устойчивый характер позора.
