  yaml_path: translation/deuterocanon/sirach/020/018.yaml
  text: A slip is better from the ground than from the tongue[a]; so the downfall of the wicked will come in haste.
translation:
  language: ru
  text: Лучше поскользнуться на земле, чем поскользнуться языком; так и падение нечестивых наступит поспешно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «так и зло (или бедствия) быстро обрушится»; греческое κακῶν может обозначать как нечестивых людей, так и зло или бедствия.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὀλίσθημα ἀπὸ ἐδάφους
  choice: поскользнуться на земле
  rationale: Передаёт конкретный образ физического скольжения из-за поверхности земли; русская глагольная конструкция звучит естественнее буквального существительного.
- source_word: μᾶλλον ἢ ἀπὸ γλώσσης
  choice: лучше… чем оступиться языком
  rationale: Восполняет эллиптическое сравнение и сохраняет словесную перекличку между телесным и речевым падением.
- source_word: γλώσσης
  choice: языком
  rationale: Сохраняет конкретную метафору языка как органа речи, характерную для литературы мудрости.
- source_word: πτῶσις
  choice: падение
  rationale: Ближайшее соответствие греческому слову, способное обозначать как падение, так и крах.
- source_word: κακῶν
  choice: нечестивых
  rationale: Личный родительный понимается как обозначение дурных, нечестивых людей; это естественно сочетается с «падением» в контексте нравственного изречения.
- source_word: κατὰ σπουδήν
  choice: поспешно
  rationale: Передаёт быстроту и оттенок спешки, а не только нейтральное «быстро».
- source_word: ἥξει
  choice: наступит
  rationale: По-русски естественно сочетается с событием «падение», сохраняя значение будущего прихода.
theological_decisions:
- issue: Референт κακῶν
  choice: 'личное значение: «нечестивых»'
  alternative: 'отвлечённое значение: «зол» или «бедствий»'
  rationale: Форма допускает оба прочтения. Личное прочтение образует естественное выражение «падение нечестивых», однако подлинная лексико-грамматическая неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным построением. Пара «поскользнуться — оступиться» делает противопоставление физического и речевого промаха ясным, не устраняя образ языка. Примечание сохраняет неоднозначность κακῶν.
