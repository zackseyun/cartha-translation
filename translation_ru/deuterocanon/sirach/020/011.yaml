translation:
  language: ru
  text: Иной покупает многое за малую цену, а платит за это всемеро.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза сжата; более буквально: «и возмещает их всемеро». Местоимение «их» имеет форму множественного числа и может относиться к купленным вещам либо к тому, что за них следует отдать. Возможен также более общий смысл: кажущаяся дешёвой покупка обходится всемеро.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔστιν ἀγοράζων
  choice: Иной … покупает
  rationale: Греческая бытийная конструкция с причастием вводит типичный случай или человека. «Иной … покупает» естественно передаёт афористическую форму без лишнего уточнения субъекта.
- source_word: πολλὰ
  choice: многое
  rationale: Субстантивированное среднее множественное обозначает множество покупаемого; «многое» сохраняет сжатость оригинала.
- source_word: ὀλίγου
  choice: за малую цену
  rationale: Родительный указывает цену покупки. Этот вариант точнее, чем более образное «за бесценок», и не преувеличивает степень дешевизны.
- source_word: ἀποτιννύων
  choice: расплачивается
  rationale: Глагол означает выплату или возмещение должного. «Расплачивается» сохраняет финансовый образ и допускает как буквальное, так и более общее понимание последствий невыгодной сделки.
- source_word: αὐτὰ
  choice: за это
  rationale: Местоимение формально стоит во множественном числе и может относиться к приобретённым вещам, но по-русски собирательное «за это» естественно связывает последующую выплату со всей покупкой. Формальная особенность отмечена в сноске.
- source_word: ἑπταπλάσιον
  choice: всемеро
  rationale: Слово обозначает семикратную меру. «Всемеро» сохраняет краткий афористический стиль и не уточняет сверх текста, идёт ли речь о цене, стоимости или возмещении.
