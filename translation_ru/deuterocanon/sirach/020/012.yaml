lexical_decisions:
- source_word: σοφὸς
  choice: мудрый
  rationale: Субстантивированное прилагательное мужского рода в единственном числе; русское «мудрый» сохраняет представительный мужской образ и звучит естественно для литературы мудрости.
- source_word: ἐν λόγῳ
  choice: своей речью
  rationale: Предложная конструкция обозначает средство или сферу действия. «Своей речью» естественно передаёт инструментальный смысл и соотносится с подлежащим.
- source_word: ἑαυτὸν προσφιλῆ ποιήσει
  choice: сделает себя любимым
  rationale: Сохранены возвратная конструкция и будущее время; προσφιλής передано как «любимый», то есть дорогой и вызывающий расположение.
- source_word: χάριτες
  choice: благодеяния
  rationale: Множественное число χάριτες может обозначать благосклонные поступки, любезности или привлекательность. В данном контексте «благодеяния» ясно выражает возможный предметный смысл, не устраняя лексическую неоднозначность, отмеченную в сноске.
- source_word: μωρῶν
  choice: глупцов
  rationale: Краткая и идиоматичная передача родительного падежа принадлежности.
- source_word: ἐκχυθήσονται
  choice: будут излиты
  rationale: Сохранены будущее страдательное значение и образ глагола ἐκχέω. Возможный оттенок расточительности не внесён непосредственно в основной текст.
