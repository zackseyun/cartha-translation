  text: A fool will say[a], “I have no friend, and there is no gratitude for my good deeds.”
translation:
  language: ru
  text: 'Глупец скажет: «Нет у меня друга, и нет благодарности за мои добрые дела»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и нет благодарности за мои благодеяния». Греческое χάρις может означать «благодарность», «признательность» или «благосклонность», а τοῖς ἀγαθοῖς μου — «мои добрые дела», «мои благодеяния» или «моё добро».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρός
  choice: глупец
  rationale: В литературе мудрости слово обозначает не просто малообразованного человека, а того, кому недостаёт здравого нравственного рассуждения; «глупец» естественно передаёт обобщённое единственное число.
- source_word: ἐρεῖ
  choice: скажет
  rationale: Будущее время греческого изъявительного наклонения передано прямо, что сохраняет форму изречения и естественно звучит по-русски.
- source_word: Οὐχ ὑπάρχει μοι φίλος
  choice: Нет у меня друга
  rationale: Оборот ὑπάρχει с дательным выражает наличие или обладание; русская конструкция «нет у меня» точно и естественно передаёт этот смысл.
- source_word: χάρις
  choice: благодарность
  rationale: В данном контексте речь, вероятнее всего, об ответной признательности за сделанное добро, а не о богословском понятии благодати; при этом лексическая многозначность отмечена в сноске.
- source_word: τοῖς ἀγαθοῖς μου
  choice: за мои добрые дела
  rationale: Субстантивированное множественное прилагательное может обозначать добрые поступки, благодеяния или принадлежащие говорящему блага; «добрые дела» понятно современному читателю, а альтернативный оттенок отражён в сноске.
