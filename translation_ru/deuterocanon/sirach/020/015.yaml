  text: Today he lends[a], and tomorrow he demands it back; such a man is hateful.
translation:
  language: ru
  text: Сегодня он даст взаймы, а завтра потребует вернуть; такой человек ненавистен.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «такого человека ненавидят»; возможно также: «такой человек отвратителен». Греческое μισητός может обозначать как того, кто вызывает ненависть, так и того, кого ненавидят.'
    reason: lexical_alternative
lexical_decisions:
- source_word: σήμερον
  choice: Сегодня
  rationale: Прямо передаёт временное наречие и сохраняет резкое противопоставление слову «завтра».
- source_word: δανιεῖ
  choice: он даст взаймы
  rationale: Будущая форма передана будущим временем; выражение «дать взаймы» естественно для современного русского языка и сохраняет смысл одалживания.
- source_word: αὔριον
  choice: завтра
  rationale: Сохраняет краткое временное противопоставление σήμερον — αὔριον.
- source_word: ἀπαιτήσει
  choice: потребует вернуть
  rationale: Передаёт значение настойчивого требования возврата; подразумеваемый объект естественно восполнен глаголом «вернуть».
- source_word: μισητός
  choice: ненавистен
  rationale: 'Сохраняет возможную двунаправленность прилагательного: такой человек вызывает ненависть и оказывается ненавидимым, без сведения смысла только к оценке его характера.'
- source_word: ἄνθρωπος ὁ τοιοῦτος
  choice: такой человек
  rationale: Естественно передаёт обозначение описанного человеческого типа; «человек» не вносит в общий афоризм ненужного указания на мужской пол.
theological_decisions:
- issue: Неоднозначность μισητός
  choice: ненавистен
  alternative: отвратителен; такого человека ненавидят
  rationale: Греческое слово может характеризовать человека как вызывающего ненависть либо указывать на отношение к нему. Русское «ненавистен» в краткой форме лучше всего удерживает эту смысловую напряжённость.
- issue: Обобщающее ἄνθρωπος в изречении мудрости
  choice: человек
  alternative: мужчина
  rationale: ἄνθρωπος обозначает здесь представителя человеческого типа, а не специально лицо мужского пола; нейтральное «человек» точно и естественно по-русски.
translation_notes:
  register: Краткое, афористичное и достойное изложение на современном литературном русском языке. Будущие формы оригинала сохранены; точка с запятой передаёт двухчастное строение изречения.
