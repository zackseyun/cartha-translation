base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/021.yaml
  text: There is one who is prevented from sinning by poverty[b][a], and in his rest he will feel no remorse.
translation:
  language: ru
  text: Бывает, что человека удерживает от греха нужда[a], и в покое своём он не почувствует угрызений совести[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедность», «нехватка». Греческое выражение указывает на нужду как на причину, удерживающую человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не будет пронзён (уколот)». Речь может идти о внутреннем сокрушении, угрызениях совести или раскаянии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόμενος
  choice: удерживает
  rationale: Передаёт значение внешнего препятствия или ограничения; конструкция «человека удерживает» сохраняет пассивную по смыслу роль человека и естественно звучит по-русски.
- source_word: ἁμαρτάνειν
  choice: от греха
  rationale: Сохраняет нравственно-религиозный смысл глагола ἁμαρτάνω; русская конструкция «удерживать от греха» здесь естественнее буквального «удерживать от того, чтобы грешить».
- source_word: ἀπὸ ἐνδείας
  choice: нужда
  rationale: ἐνδεία означает недостаток, нужду или бедность. «Нужда» сохраняет широкий смысл нехватки средств и ясно выражает причину, препятствующую греху.
- source_word: ἀναπαύσει
  choice: в покое
  rationale: Буквально передаёт состояние покоя или отдохновения, не уточняя, идёт ли речь о физическом отдыхе, облегчении или спокойном состоянии.
- source_word: οὐ κατανυγήσεται
  choice: не почувствует угрызений совести
  rationale: Глагол буквально обозначает внутреннее пронзение или укол; выражение «угрызения совести» естественно передаёт переносный смысл внутреннего сокрушения, сохраняя образ укола.
theological_decisions:
- issue: Нравственный смысл нужды, препятствующей греху
  choice: 'Стих представлен как наблюдение: нужда может внешне удерживать человека от греха.'
  alternative: Можно было бы понять нужду как нравственно благотворное состояние или как признак добродетели человека.
  rationale: Греческий текст говорит об ограничивающей причине, но не называет бедность праведностью и не утверждает, что человек внутренне отверг грех.
- issue: Смысл отсутствия внутреннего укола «в покое»
  choice: Сохранена связь с отсутствием угрызений совести без объяснения причины.
  alternative: Можно истолковать фразу как отсутствие раскаяния либо как отсутствие мучительной вины благодаря несовершённому греху.
  rationale: Форма οὐ κατανυγήσεται допускает оттенки внутреннего укола, сокрушения или раскаяния; текст не позволяет окончательно выбрать между ними.
translation_notes:
  register: Современный литературный русский язык с достоинством текста премудрости. Оборот «Бывает, что…» естественно передаёт греческое ἔστιν с причастием; порядок фразы сохранён без излишней буквальности. Все примечания отмечены в основном тексте.
