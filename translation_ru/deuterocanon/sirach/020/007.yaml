  text: A wise man keeps silent until the right time[a], but a fool does not observe the right time.
translation:
  language: ru
  text: Мудрый молчит до подходящего времени[a], а глупец не считается со временем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до времени»; во второй части — «не хранит (или: не соблюдает) время». Греческий текст этого стиха значительно отличается: «Кто многословен, тот станет отвратителен, и кто ведёт себя властно, тот будет ненавистен».'
    reason: Альтернативное чтение и существенное расхождение между еврейским и греческим текстами.
lexical_decisions:
- source_word: חָכָם
  choice: мудрый
  rationale: Существительное в единственном числе употреблено как типичный персонаж притчи; субстантивированное «мудрый» естественно и сохраняет мужскую грамматическую форму еврейского текста.
- source_word: יַחֲרִישׁ
  choice: молчит
  rationale: Глагол означает «молчать, хранить молчание». Настоящее время естественно передаёт обобщённое наставление.
- source_word: עַד עֵת
  choice: до подходящего времени
  rationale: Буквально — «до времени»; в контексте мудрости речь идёт о своевременности речи, поэтому «подходящее время» передаёт подразумеваемый смысл без чрезмерного уточнения.
- source_word: וּכְסִיל
  choice: а глупец
  rationale: Союз формально может означать «и», но здесь противопоставлены мудрый и глупец, поэтому русское «а» естественно выражает контраст.
- source_word: לֹא יִשְׁמוֹר עֵת
  choice: не считается со временем
  rationale: Буквально выражение означает «не хранит/не соблюдает время». Русская формулировка передаёт неспособность глупца учитывать уместный момент и сохраняет некоторую широту еврейского оборота.
