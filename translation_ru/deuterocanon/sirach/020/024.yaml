base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/020/024.yaml
  text: A lie is a shameful blemish in a person[b][a]; in the mouth of the undisciplined it will be continually present.
translation:
  language: ru
  text: Ложь — постыдное пятно на человеке[a]; в устах невоспитанных людей[b] она будет пребывать постоянно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дурное пятно» или «позор для человека»; μῶμος может означать пятно, порок, позор или предмет нарекания.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «невоспитанных», может также означать «не наставленных», «необученных» или «необразованных»; здесь оно, вероятно, относится прежде всего к недостатку нравственного воспитания.
    reason: lexical_alternative
lexical_decisions:
- source_word: μῶμος πονηρός
  choice: постыдное пятно
  rationale: Сочетание сохраняет конкретный образ пятна (μῶμος) и естественно передаёт резко отрицательную нравственно-общественную оценку прилагательного πονηρός.
- source_word: ἐν ἀνθρώπῳ
  choice: на человеке
  rationale: Единственное число имеет обобщающий смысл. Предлог «на» естественен в русском сочетании с образом пятна, тогда как буквальное «в человеке» звучало бы менее ясно.
- source_word: ψεῦδος
  choice: ложь
  rationale: Краткое и точное соответствие, сохраняющее афористичность изречения.
- source_word: ἀπαιδεύτων
  choice: невоспитанных людей
  rationale: В контексте литературы мудрости слово указывает прежде всего на отсутствие нравственного воспитания и дисциплины, а не только школьного образования.
- source_word: ἐνδελεχισθήσεται
  choice: будет пребывать постоянно
  rationale: Передаёт будущее время и продолжительное, устойчивое присутствие лжи в устах таких людей, не усиливая смысл до абсолютной невозможности перемены.
theological_decisions:
- issue: Обобщающее ἐν ἀνθρώπῳ
  choice: на человеке
  alternative: на мужчине
  rationale: ἄνθρωπος здесь обозначает любого человека, а не лицо мужского пола; русское «человек» естественно сохраняет обобщающее единственное число.
- issue: Нравственный смысл ἀπαίδευτος
  choice: невоспитанных людей
  alternative: необразованных людей
  rationale: В контексте премудростной традиции речь идёт о недостатке нравственного формирования; перевод «необразованных» мог бы неоправданно свести порок к отсутствию учёности.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Пребывать» слегка возвышенно, но понятно и уместно для премудростного текста; оно помогает сохранить длительный оттенок греческого глагола.
