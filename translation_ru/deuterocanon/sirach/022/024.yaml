  text: Before bloodshed come the furnace’s vapor and smoke[b][a]; so before bloodshed comes abuse.
translation:
  language: ru
  text: Огню предшествуют пар из печи и дым; так и кровопролитию[a] — оскорбительная речь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кровям»; греческое множественное число может обозначать кровопролитие или насильственные деяния.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «брань», «поношение», «оскорбление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ
  choice: предшествуют / предшествует
  rationale: Предлог с родительным падежом в обеих частях выражает временное предшествование. Глагольная передача создаёт естественную русскую пословичную фразу.
- source_word: πυρός
  choice: огню
  rationale: Основное значение — «огонь». Оно сохранено отдельно от образа печи и не сведено к самой печи.
- source_word: ἀτμίς
  choice: испарение
  rationale: Слово обозначает пар, испарение или исходящую влагу. «Испарение» хорошо сочетается с печью и не предполагает непременно водяной пар.
- source_word: καμίνου
  choice: из печи
  rationale: Родительный указывает на источник испарения. «Печь» в современном русском понятнее, чем более узкое или архаичное «горнило», и сохраняет образ сильного жара.
- source_word: καπνός
  choice: дым
  rationale: Прямой и естественный русский эквивалент.
- source_word: οὕτως
  choice: так и
  rationale: Ясно вводит сопоставление физического образа с нравственным предостережением.
- source_word: αἱμάτων
  choice: кровопролитию
  rationale: Буквальное множественное «кровей» является греческим идиоматическим обозначением кровопролития или насильственных деяний; русский эквивалент передаёт смысл без неестественного буквализма.
- source_word: λοιδορία
  choice: оскорбления
  rationale: Существительное обозначает оскорбительную, поносительную речь. Множественное «оскорбления» естественно по-русски и сохраняет движение мысли от враждебных слов к насилию.
theological_decisions:
- issue: Нравственная последовательность от речи к насилию
  choice: Стих передан как изречение о том, что оскорбительная речь предшествует кровопролитию.
  alternative: Понимать λοιδορία как сопровождающую кровопролитие либо усиливать высказывание до утверждения, что оскорбление неизбежно вызывает убийство.
  rationale: Повторённое πρὸ естественнее всего указывает на последовательность. Перевод сохраняет предостерегающую силу сравнения, но не превращает его в абсолютное учение о неизбежной причинности.
translation_notes:
  register: Современный литературный русский с краткой, афористичной структурой. Синтаксис перестроен в естественную русскую конструкцию с глаголом «предшествовать», при этом параллелизм двух частей и последовательность исходного текста сохранены.
