  yaml_path: translation/deuterocanon/sirach/022/023.yaml
  text: Gain faith with your neighbor in poverty[a], so that in his good things you may be filled together. In a time of distress remain with him[b], so that you may inherit along with him in his inheritance.
translation:
  language: ru
  text: Обрети доверие ближнего в бедности[a], чтобы вместе с ним насытиться его благами[b]. Во время бедствия оставайся с ним, чтобы вместе с ним получить долю в его наследстве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «когда ближний беден» или «в общей бедности». В греческом тексте не уточняется, чья именно это бедность.'
    reason: syntactic_ambiguity
  - marker: b
    text: 'Или: «его достатком», «его добром». Греческое выражение может обозначать как материальное имущество и благополучие, так и блага в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν κτῆσαι
  choice: приобретай доверие
  rationale: В контексте отношений между людьми πίστις естественно обозначает доверие, надёжность или верность, а не отвлечённую веру; κτάομαι передано прямым значением «приобретать».
- source_word: ἐν πτωχείᾳ μετὰ τοῦ πλησίον
  choice: вместе с ближним в бедности
  rationale: Формулировка сохраняет прямые значения πτωχεία («бедность») и πλησίον («ближний»), не добавляя отсутствующего в греческом притяжательного местоимения.
- source_word: ἐν τοῖς ἀγαθοῖς αὐτοῦ ὁμοῦ πλησθῇς
  choice: вместе с ним насытиться его благами
  rationale: ἀγαθά охватывает блага, добро и достаток; πληρόω сохраняет образ насыщения, а ὁμοῦ — совместности.
- source_word: ἐν καιρῷ θλίψεως διάμενε αὐτῷ
  choice: во время бедствия оставайся с ним
  rationale: θλῖψις означает бедствие, скорбь или тяжёлые обстоятельства; διαμένω выражает неизменное пребывание рядом и верность человеку.
- source_word: ἐν τῇ κληρονομίᾳ αὐτοῦ συνκληρονομήσῃς
  choice: вместе с ним получить долю в его наследстве
  rationale: Сложный глагол συνκληρονομέω означает наследовать совместно; выражение «получить долю в наследстве» естественно по-русски и сохраняет идею сонаследования.
theological_decisions:
- issue: Значение πίστις в наставлении о взаимоотношениях
  choice: доверие
  alternative: вера; верность
  rationale: Контекст бедности, бедствия и совместного наследования говорит о проверенной дружеской надёжности. «Доверие» передаёт межличностный смысл, не превращая слово в специальный богословский термин; возможные оттенки верности при этом не отрицаются.
- issue: Образ совместного наследования
  choice: вместе с ним получить долю в его наследстве
  alternative: стать его сонаследником
  rationale: Выбранная формулировка сохраняет смысл συνκληρονομέω, но не привносит более позднего технического богословского употребления слова «сонаследник».
translation_notes:
  register: Современный литературный русский язык с достоинством назидательной речи. Повелительные формы единственного числа сохраняют личное обращение оригинала. Формулировки умеренно буквальны, но синтаксис сделан естественным для русского читателя.
