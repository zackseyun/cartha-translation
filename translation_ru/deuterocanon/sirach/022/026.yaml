  text: And if harm comes to me through him[a], everyone who hears will guard himself from him.
translation:
  language: ru
  text: И если из-за него меня постигнет беда[a], всякий, кто услышит, станет его остерегаться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если из-за него со мной случится что-нибудь дурное… всякий, кто услышит, будет держаться от него подальше».'
    reason: Передаёт возможный более разложенный перевод κακά и συμβήσεται, а также оттенок удаления в φυλάξεται ἀπʼ αὐτοῦ.
lexical_decisions:
- source_word: κακά
  choice: беда
  rationale: Средний род множественного числа обозначает неблагоприятные последствия или несчастье; собирательное «беда» естественно по-русски и не сводит смысл к нравственному злу.
- source_word: μοι
  choice: меня
  rationale: Дательный падеж указывает на человека, которого затрагивает случившееся; в русском обороте «меня постигнет» это передаётся винительным падежом.
- source_word: συμβήσεται
  choice: постигнет
  rationale: Глагол означает «случиться, постигнуть». Сочетание «меня постигнет беда» современно, естественно и сохраняет событийный смысл.
- source_word: διʼ αὐτόν
  choice: из-за него
  rationale: διά с винительным падежом здесь естественно выражает причину или обусловленность; перевод не уточняет, был ли этот человек непосредственным виновником.
- source_word: πᾶς ὁ ἀκούων
  choice: всякий, кто услышит
  rationale: Субстантивированное причастие имеет обобщающий смысл. Объект слуха в греческом не выражен, поэтому он не добавлен в основном тексте.
- source_word: φυλάξεται ἀπʼ αὐτοῦ
  choice: станет его остерегаться
  rationale: Будущее среднего залога передаёт предосторожность ради собственной безопасности, а ἀπό — удаление или защиту от человека; русский глагол «остерегаться» естественно объединяет эти оттенки.
theological_decisions:
- issue: Обобщающее значение πᾶς ὁ ἀκούων
  choice: всякий, кто услышит
  alternative: каждый мужчина, который услышит
  rationale: Мужской род греческого причастия употреблён обобщённо и не ограничивает высказывание мужчинами.
- issue: Степень причинности в διʼ αὐτόν
  choice: из-за него
  alternative: через него
  rationale: Оборот указывает на связь беды с этим человеком, но не требует уточнять, является ли он непосредственным деятелем или косвенной причиной.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизации. «Всякий» сохраняет краткий обобщающий строй изречения; «станет его остерегаться» звучит естественнее буквального «будет оберегать себя от него».
