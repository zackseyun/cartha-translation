  - marker: b
    text: 'Или: «оскорбляет друга». Греческий глагол может означать попрекать, поносить или оскорблять.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλων λίθον ἐπὶ πετεινὰ
  choice: Кто бросает камень в птиц
  rationale: Причастный оборот имеет обобщённый, пословичный смысл. Конструкция «кто…» естественно передаёт его по-русски; πετεινά в данном контексте означает птиц, а ἐπί указывает на цель броска.
- source_word: ἀποσοβεῖ αὐτά
  choice: тот разгонит их
  rationale: Глагол означает заставить удалиться или обратиться в бегство. «Разгонит» сохраняет причинный смысл и не сводит действие только к испугу.
- source_word: ὁ ὀνειδίζων φίλον
  choice: кто попрекает друга
  rationale: ὀνειδίζω может обозначать укор, попрёк или оскорбление. «Попрекать» сохраняет нравственно-реляционный оттенок и не усиливает выражение до открытой брани.
- source_word: διαλύσει φιλίαν
  choice: тот разрушит дружбу
  rationale: διαλύω здесь описывает распад отношений. «Разрушит дружбу» звучит естественно и передаёт выраженный будущим временем результат.
