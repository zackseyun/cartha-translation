translation:
  language: ru
  text: Кто бросает камень в птиц, тот разгоняет их[a], а кто попрекает друга[b], тот разрушит дружбу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спугнёт их». Греческий глагол означает прогнать или заставить обратиться в бегство.'
