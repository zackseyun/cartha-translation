base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/003.yaml
  text: A father’s shame is the birth of an undisciplined son[b][a], and a daughter is born for loss.
translation:
  language: ru
  text: Рождение невоспитанного сына[a] — позор для отца; дочь же рождается к убытку[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «невоспитанного»; слово «сын» подразумевается прилагательным мужского рода.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к ущербу», «к умалению». Греческое выражение означает уменьшение или потерю, но не уточняет их характер и того, кто их несёт.'
    reason: alternative_reading
lexical_decisions:
- source_word: αἰσχύνη
  choice: позор
  rationale: Передаёт бесчестье и общественный стыд, сохраняя резкость афористического высказывания.
- source_word: πατρὸς
  choice: для отца
  rationale: Родительный падеж выражает отношение к отцу; по-русски конструкция «позор для отца» яснее и естественнее буквального «позор отца».
- source_word: ἐν γεννήσει
  choice: рождение
  rationale: В данном контексте обозначает рождение или произведение на свет потомка. Существительное «рождение» сохраняет сжатость греческой фразы и звучит естественно.
- source_word: ἀπαιδεύτου
  choice: невоспитанного сына
  rationale: Прилагательное означает человека, лишённого воспитания, наставления или дисциплины; в литературе мудрости особенно заметен нравственный смысл. Существительное «сын» подразумевается формой мужского рода и противопоставлением дочери.
- source_word: θυγάτηρ
  choice: дочь
  rationale: Прямое соответствие греческому слову, сохраняющее гендерно конкретное построение изречения.
- source_word: ἐπʼ ἐλαττώσει
  choice: к убытку
  rationale: Фраза указывает на уменьшение, ущерб или потерю. «К убытку» кратко передаёт отрицательный итог, не уточняя, кому именно причиняется ущерб.
- source_word: γίνεται
  choice: рождается
  rationale: Хотя глагол шире и может означать «становится» или «появляется», контекст рождения детей естественно допускает «рождается».
theological_decisions:
- issue: Гендерно конкретные обозначения потомков в изречении мудрости
  choice: Сохранены «отец», подразумеваемый «сын» и «дочь».
  alternative: 'Передать обобщённо: «родитель» и «ребёнок».'
  rationale: Греческий текст прямо называет отца и дочь, а прилагательное мужского рода в первой части подразумевает сына. Нейтрализация стёрла бы намеренное противопоставление.
- issue: Отрицательная социальная оценка рождения дочери
  choice: Высказывание переведено прямо, а неоднозначность выражения об ущербе пояснена в сноске.
  alternative: Смягчить текст или истолковать его как указание на конкретные семейные расходы и приданое.
  rationale: Перевод не должен устранять отражённое в тексте древнее социальное представление или приписывать ему более узкое объяснение, которого в греческом нет.
translation_notes:
  register: Современный литературный русский язык; сохранены краткость, параллелизм и резкость изречения. Частица «же» передаёт греческое δέ, а точка с запятой подчёркивает двухчастное построение.
