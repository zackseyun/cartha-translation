base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/009.yaml
  text: Weep over the dead[a], for the light has failed; and weep over the fool[b], for understanding has failed.
translation:
  language: ru
  text: Плачь об умершем, ибо угас свет[a]; плачь и о глупце[b], ибо он утратил разумение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом сохранён образ света; текст не говорит прямо: «жизнь ушла».'
    reason: lexical_alternative
  - marker: b
    text: 'Это изречение мудрости: о глупце велено плакать из-за утраты разумения; о его физической смерти здесь прямо не сказано.'
    reason: cultural_note
lexical_decisions:
- source_word: κλαῦσον
  choice: плачь
  rationale: Повелительная форма κλαίω прямо выражает плач и скорбь; повтор сохранён, чтобы передать параллелизм изречения.
- source_word: νεκρῷ
  choice: об умершем
  rationale: Дательный падеж с ἐπί обозначает того, о ком плачут. «Об умершем» естественно по-русски и сохраняет обобщённый характер изречения.
- source_word: ἐξέλιπεν
  choice: угас / утратил
  rationale: ἐκλείπω может означать прекращение, исчезновение или утрату. В сочетании со «светом» естественно «угас», а при винительном σύνεσιν — «утратил разумение»; лексическая связь передана общей мыслью об утрате, без неестественного русского единообразия.
- source_word: φῶς
  choice: свет
  rationale: Сохранён непосредственный образ греческого φῶς, не заменённый толкованием «жизнь».
- source_word: μωρῷ
  choice: о глупце
  rationale: «Глупец» передаёт устойчивую категорию литературы мудрости — человека, которому недостаёт не только интеллекта, но и здравого нравственного суждения.
- source_word: σύνεσιν
  choice: разумение
  rationale: σύνεσις означает понимание, рассудительность и способность различать. «Разумение» уместно в литературе мудрости и сохраняет более широкий смысл, чем просто «ум».
theological_decisions:
- issue: Образ света применительно к смерти
  choice: 'Сохранить образ: «угас свет»'
  alternative: «ушла жизнь»
  rationale: В греческом стоит φῶς, а не ζωή. Образ не следует раскрывать в основном тексте так, будто слово «жизнь» названо прямо.
- issue: Смысл плача о глупце
  choice: Плач связан с утратой разумения, без утверждения о физической смерти глупца
  alternative: Понять обе половины как плач по умершим
  rationale: Вторая половина прямо говорит о глупце и разумении; физическая смерть там не названа. Так сохраняются напряжение и острота изречения мудрости.
- issue: Синтаксис ἐξέλιπεν … σύνεσιν
  choice: «он утратил разумение»
  alternative: «разумение угасло»
  rationale: σύνεσιν имеет форму винительного падежа, поэтому перевод с подразумеваемым субъектом и прямым дополнением лучше отражает представленное греческое чтение, хотя ослабляет точный словесный параллелизм.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Повтор «плачь» и резкое обозначение «глупец» сохранены; архаизирующая лексика сведена к уместному для литературы мудрости слову «разумение».
