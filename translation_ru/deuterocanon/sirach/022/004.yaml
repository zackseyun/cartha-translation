  terminology: Гендерно маркированный мужской референт γεννήσαντος следует передать как «отец»; уточняющее «породивший её» сохраняет образ причастия γεννήσαντος. «Навлекающая позор» передаёт активную семантику καταισχύνουσα, не приписывая конкретный объект позора, отсутствующий в греческом тексте.
