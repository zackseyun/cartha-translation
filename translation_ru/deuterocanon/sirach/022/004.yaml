revisions:
- from: Благоразумная дочь приобретёт мужа[a], а позорящая — горе для породившего её.
  to: Благоразумная дочь обретёт мужа[a], а дочь, навлекающая позор, — горе для отца, породившего её.
  rationale: Правка делает вторую половину стилистически и синтаксически ясной, сохраняя активную семантику греческого причастия и не добавляя отсутствующий в источнике объект действия. «Обретёт» — более естественный русский эквивалент контекстуального смысла κληρονομήσει; сноска по-прежнему фиксирует буквальное «унаследует». «Отец, породивший её» прямо передаёт мужской род γεννήσαντος и его причастную образность.
