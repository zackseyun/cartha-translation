  text: A prudent daughter will obtain a husband[a], but one who brings shame is a grief to the one who fathered her.
translation:
  language: ru
  text: Благоразумная дочь обретёт мужа[a], а дочь, навлекающая позор, — горе для отца, породившего её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «унаследует мужа»; здесь, вероятно, имеется в виду, что она обретёт мужа.'
    reason: Сохраняет буквальное значение κληρονομήσει и отмечает необычность выражения, не устраняя возможной смысловой напряжённости.
lexical_decisions:
- source_word: θυγάτηρ
  choice: дочь
  rationale: Прямое обозначение дочери; обобщение здесь не требуется.
- source_word: φρονίμη
  choice: благоразумная
  rationale: Передаёт практическую мудрость, рассудительность и достойное поведение; звучит естественно и достойно в контексте изречения.
- source_word: κληρονομήσει
  choice: приобретёт
  rationale: Буквально глагол означает «унаследует», однако при дополнении ἄνδρα контекст указывает на обретение мужа; основной текст передаёт идиоматический смысл, а буквальное значение отмечено в сноске.
- source_word: ἄνδρα
  choice: мужа
  rationale: В данном брачном контексте ἀνήρ означает именно мужа, а не просто мужчину.
- source_word: ἡ καταισχύνουσα
  choice: позорящая
  rationale: Активное причастие указывает на дочь, которая навлекает позор, а не только сама испытывает стыд.
- source_word: εἰς λύπην
  choice: горе для
  rationale: 'Передаёт результат и направленность: её поведение становится причиной скорби породившего её.'
- source_word: γεννήσαντος
  choice: породившего её
  rationale: Сохраняет выраженный в греческом тексте мужской род единственного числа и образ рождения; местоимение «её» естественно восполняет подразумеваемое дополнение.
theological_decisions:
- issue: Мужской род родительского обозначения в γεννήσαντος
  choice: породившего её
  alternative: её отца; родителя, породившего её
  rationale: Греческое причастие стоит в мужском роде единственного числа. Перевод не нейтрализует эту грамматическую и смысловую особенность, но и не подменяет причастную формулировку существительным «отец».
translation_notes:
  register: Современный литературный русский язык с краткой афористической структурой. «Благоразумная» передаёт практическую мудрость, а эллиптическое «позорящая» сохраняет параллелизм и подразумеваемое слово «дочь».
