  to: Сердце, твёрдо утверждённое на вдумчивом понимании, — словно песчаная отделка гладко обработанной стены.[a]
  rationale: Сохранены образ сердца, утверждённого «на» понимании, и архитектурное сравнение. «Вдумчивое понимание» точнее передаёт сжатую пару διανοία и σύνεσις в современном литературном русском. Небольшая правка примечания делает заявленную неопределённость строительной лексики последовательной и не навязывает спорную реконструкцию.
