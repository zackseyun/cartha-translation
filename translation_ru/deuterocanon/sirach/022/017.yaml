  text: A heart set firm on thoughtful understanding is like a plastered wall with a sanded finish[a].
translation:
  language: ru
  text: Сердце, твёрдо утверждённое на вдумчивом понимании, — словно песчаная отделка гладко обработанной стены.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий строительный образ предельно сжат. Точное значение слов, обозначающих отделку и обработку поверхности стены, а также их взаимная связь не вполне ясны; буквально говорится о «песчаной» отделке и гладко обработанной стене. Сравнение подчёркивает прочность и надёжность.
    reason: cultural_note
lexical_decisions:
- source_word: καρδία
  choice: сердце
  rationale: Сохраняет библейское обозначение внутреннего средоточия мысли и воли, не сводя значение к эмоциям.
- source_word: ἠδρασμένη
  choice: утверждённое
  rationale: 'Передаёт результативное значение причастия: сердце сделано устойчивым, прочно утверждено.'
- source_word: ἐπὶ διανοίας συνέσεως
  choice: на разумном размышлении
  rationale: Предлог «на» сохраняет образ основания, а сочетание «разумное размышление» передаёт оба тесно связанных понятия — мысль/размышление и разумение — без искусственной русской цепочки родительных падежей.
- source_word: κόσμος
  choice: отделка
  rationale: В архитектурном контексте слово обозначает украшение или оформленную поверхность; «отделка» естественно сохраняет оба оттенка.
- source_word: ψαμμωτός
  choice: песчаная
  rationale: Редкое прилагательное связано с песком и, вероятно, указывает на песчаное покрытие или фактуру; точный древний строительный приём неясен.
- source_word: τοίχου ξυστοῦ
  choice: гладко обработанной стены
  rationale: τοῖχος прямо означает стену, а ξυστός — поверхность, обработанную скоблением, выравниванием или полировкой; перевод не навязывает более узкое «оштукатуренной».
- source_word: ὡς
  choice: словно
  rationale: Естественно вводит сравнение и сохраняет его образный характер.
