  text: Teaching a fool is like gluing a potsherd[a], like waking one from a deep sleep.
translation:
  language: ru
  text: Кто учит глупца, тот словно склеивает черепок[a], словно будит спящего от глубокого сна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте нет явного сравнительного союза; буквально: «Склеивающий черепок — [это] тот, кто учит глупца; [как] пробуждающий спящего от глубокого сна». Два причастных образа сопоставлены параллельно.'
    reason: Уточняет форму греческого изречения и сохраняет параллелизм двух образов без ошибочного синтаксического связывания второго с «тем, кто учит глупца».
lexical_decisions:
- source_word: συγκολλῶν
  choice: склеивает
  rationale: Причастие обозначает соединение посредством склеивания; конкретный глагол сохраняет образ попытки восстановить разбитую керамику.
- source_word: ὄστρακον
  choice: черепок
  rationale: Существительное в единственном числе обычно означает кусок разбитой глиняной посуды; «черепок» точно и естественно передаёт этот предметный образ.
- source_word: ὁ διδάσκων
  choice: кто учит
  rationale: Субстантивированное причастие имеет обобщённое значение; русская конструкция «кто учит» естественно передаёт форму поучительного изречения.
- source_word: μωρόν
  choice: глупца
  rationale: В литературе мудрости слово характеризует человека как неразумного в более широком, в том числе нравственном, смысле; традиционное «глупец» сохраняет эту ёмкость.
- source_word: ἐξεγείρων
  choice: будит
  rationale: Передаёт действие пробуждения прямо и современно, не усиливая его значением принуждения.
- source_word: καθεύδοντα
  choice: спящего
  rationale: Причастие буквально обозначает того, кто спит; явное «спящего» сохраняет содержание греческого текста.
- source_word: ἐκ βαθέος ὕπνου
  choice: от глубокого сна
  rationale: Естественное русское соответствие, сохраняющее образ и степень сна.
theological_decisions:
- issue: Характер двух образов по отношению к обучению глупца
  choice: Добавлено «словно» перед каждым образом
  alternative: 'Формально сохранить цепочку причастных оборотов без сравнительного слова: «Склеивающий черепок — тот, кто учит глупца, будящий спящего от глубокого сна»'
  rationale: Греческий текст сополагает причастные конструкции без явного сравнительного союза, однако их пословичная функция сравнительна. «Словно» делает синтаксис ясным, не превращая образ в более определённое богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с краткой, достоинственной формой изречения. «Черепок» сохраняет конкретность древнего образа; «глупец» соответствует лексике литературы мудрости и не сводит смысл к недостатку умственных способностей.
