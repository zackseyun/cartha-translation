base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/013.yaml
  text: Do not multiply words with a fool[a], and do not go to an unintelligent man. Keep away from him, so that you may not have trouble and may not be defiled by his shaking-off. Turn aside from him, and you will find rest, and you will not grow weary because of his madness.
translation:
  language: ru
  text: Не умножай слов с глупцом и не подходи к неразумному. Берегись его, чтобы не нажить себе хлопот и не оскверниться от его встряски[a]. Уклонись от него — и найдёшь покой, и не изнеможёшь от его безумия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «встряска», встречается редко, и его точный смысл неясен; возможно, речь шире идёт о буйной выходке глупца или об оскверняющем воздействии его поведения.
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἄφρονος μὴ πληθύνῃς λόγον
  choice: Не умножай слов с глупцом
  rationale: Сохраняет буквальный образ греческого выражения и краткий афористический строй; «глупец» передаёт устойчивую нравственно-назидательную категорию ἄφρων.
- source_word: πρὸς ἀσύνετον μὴ πορεύου
  choice: не ходи к неразумному
  rationale: «Ходи к» сохраняет значение движения πορεύου, а «неразумный» передаёт недостаток понимания и рассудительности без современного оттенка оценки интеллекта.
- source_word: φύλαξαι ἀπʼ αὐτοῦ
  choice: Берегись его
  rationale: Естественно выражает самозащиту и предостережение, заключённые в форме среднего залога.
- source_word: κόπον ἔχῃς
  choice: не нажить себе тягот
  rationale: Передаёт возникающее вследствие общения бремя, хлопоты и изнурительный труд; возвратная конструкция естественна по-русски.
- source_word: μολυνθῇς
  choice: не оскверниться
  rationale: Сохраняет сильную семантику загрязнения или нравственного осквернения, не сводя её к более слабому «испачкаться».
- source_word: ἐν τῷ ἐντιναγμῷ αὐτοῦ
  choice: от его встряски
  rationale: Редкое и неясное существительное связано со встряхиванием или резким отбрасыванием. Сравнительно буквальный вариант сохраняет образ и неопределённость; сноска отмечает возможный смысл буйной выходки.
- source_word: ἔκκλινον ἀπʼ αὐτοῦ
  choice: Уклонись от него
  rationale: Сохраняет направительный образ сознательного удаления или избегания.
- source_word: ἀνάπαυσιν
  choice: покой
  rationale: Прямой и стилистически уместный эквивалент, способный означать как отдых, так и избавление от тревог.
- source_word: οὐ μὴ ἀκηδιάσῃς
  choice: не изнеможёшь
  rationale: Передаёт усиленное отрицание и значение утомления, душевного истощения или изнурения.
- source_word: ἐν τῇ ἀπονοίᾳ αὐτοῦ
  choice: от его безумия
  rationale: Сохраняет более сильную окраску ἀπόνοια, чем нейтральное «неразумие», и естественно обозначает причину изнеможения.
