base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/008.yaml
  text: Telling a story to one who is drowsy is like telling it to a fool[a], and at the end he will say, “What was it?”
translation:
  language: ru
  text: 'Рассказывать дремлющему — всё равно что рассказывать глупцу[a]: когда рассказ окончится, он спросит: «О чём это?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза несколько необычна по форме: в ней повторяется слово «рассказывающий» (διηγούμενος … ὁ διηγούμενος). По смыслу это сравнение: рассказывать дремлющему — всё равно что рассказывать глупцу.'
    reason: textual_variant
lexical_decisions:
- source_word: διηγούμενος / ὁ διηγούμενος
  choice: рассказывать
  rationale: Причастие от διηγέομαι означает подробно излагать или рассказывать. Инфинитив делает русскую сравнительную конструкцию естественной, а повтор греческой формы отражён повтором глагола.
- source_word: νυστάζοντι
  choice: дремлющему
  rationale: νυστάζω обозначает сонливость, дремоту; «дремлющему» кратко и наглядно передаёт человека, который не способен внимательно слушать.
- source_word: μωρῷ
  choice: глупцу
  rationale: В литературе мудрости μωρός — не просто человек с низкими умственными способностями, а глупец в нравственно-практическом смысле; «глупец» сохраняет традиционную библейскую окраску.
- source_word: ἐπὶ συντελείᾳ
  choice: когда рассказ окончится
  rationale: Выражение указывает на завершение повествования. Контекстуальное дополнение «рассказ» ясно обозначает, что именно подошло к концу.
- source_word: Τί ἐστιν;
  choice: О чём это?
  rationale: 'Буквально: «Что это?» В данном контексте вопрос показывает, что слушатель не уловил содержания. «О чём это?» естественно звучит по-русски и сохраняет резкую краткость вопроса.'
