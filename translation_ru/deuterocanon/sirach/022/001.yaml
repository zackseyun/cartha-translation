lexical_decisions:
- source_word: Λίθῳ ἠρδαλωμένῳ
  choice: испачканному камню
  rationale: Редкое причастие ἠρδαλωμένῳ, по-видимому, обозначает камень как загрязнённый или запачканный. «Испачканному» сохраняет отрицательный образ, не придавая неясному слову чрезмерно узкого значения.
- source_word: συνεβλήθη
  choice: подобен
  rationale: 'В данном афористическом контексте глагол выражает сопоставление: ленивый уподобляется камню. Настоящее время по-русски естественно передаёт общее утверждение, хотя греческая форма — аорист страдательного залога.'
- source_word: ὀκνηρός
  choice: ленивый
  rationale: Субстантивированное прилагательное мужского рода обозначает ленивого человека. Русское «ленивый» сохраняет грамматический род и лаконичность притчи.
- source_word: πᾶς
  choice: всякий
  rationale: 'Передаёт обобщающее значение: так отреагирует любой человек.'
- source_word: ἐκσυριεῖ
  choice: будет свистеть ему вслед
  rationale: Глагол обозначает свист или шипение как выражение насмешки и презрения. Оборот «свистеть ему вслед» естественно передаёт публичное осмеяние, сохраняя конкретный звуковой образ.
- source_word: ἐπὶ τῇ ἀτιμίᾳ αὐτοῦ
  choice: из-за его позора
  rationale: Предлог ἐπί с дательным здесь указывает на основание реакции, а ἀτιμία означает бесчестье, позор или унижение.
theological_decisions:
- issue: Мужской род субстантивированного ὀκνηρός
  choice: ленивый
  alternative: ленивый человек
  rationale: Форма мужского рода сохранена без расширения до гендерно-нейтральной формулировки; при этом русское субстантивированное прилагательное звучит естественно и по-пословичному.
- issue: Объект насмешки в ἐκσυριεῖ ἐπὶ τῇ ἀτιμίᾳ αὐτοῦ
  choice: будет свистеть ему вслед из-за его позора
  alternative: будет освистывать его за бесчестье
  rationale: Выбранный вариант сохраняет неоднозначность звука — свист или шипение — и не превращает нравственную оценку в более узкий термин. Богословского уточнения сверх текста не внесено.
translation_notes:
  register: Современный литературный русский язык с кратким, пословичным строем. Сохранены конкретный образ камня, мужской род характеристики и неоднозначность насмешливого свиста или шипения.
