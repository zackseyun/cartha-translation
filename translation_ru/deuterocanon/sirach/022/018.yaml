base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/018.yaml
  text: Stakes set on a height opposite the wind will never hold out[a]; so a timid heart, set on a foolish thought[b], will never hold out against any fear.
translation:
  language: ru
  text: Колья, поставленные на возвышении навстречу ветру[a], никак не устоят; так и робкое сердце, опирающееся на глупую мысль[b], никак не устоит перед любым страхом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лицом к ветру»; речь идёт о кольях на открытой высоте, прямо подставленных ветру.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово может означать также замысел или намерение.
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρακες
  choice: колья
  rationale: Слово обозначает заострённые колья или столбы; «колья» конкретно и естественно передаёт образ.
- source_word: ἐπὶ μετεώρου κείμενοι
  choice: поставленные на возвышении
  rationale: Оборот указывает на открытое высокое место; перевод не создаёт ошибочного образа предметов, висящих в воздухе.
- source_word: κατέναντι ἀνέμου
  choice: навстречу ветру
  rationale: Передаёт пространственное значение «лицом к ветру, против ветра» и подчёркивает прямое воздействие ветра.
- source_word: οὐ μὴ ὑπομείνωσιν / οὐ μὴ ὑπομείνῃ
  choice: никак не устоят / никак не устоит
  rationale: Сочетание οὐ μή выражает усиленное отрицание, а «устоять» естественно относится и к физическому образу кольев, и к нравственному сравнению.
- source_word: καρδία δειλή
  choice: робкое сердце
  rationale: «Робкое» передаёт боязливость без излишне осуждающего оттенка слова «трусливое».
- source_word: ἐπὶ διανοήματος μωροῦ
  choice: опирающееся на глупую мысль
  rationale: Сохраняется параллель с неустойчивой опорой кольев; «мысль» оставляет открытым диапазон значения от представления до намерения.
- source_word: παντὸς φόβου
  choice: перед любым страхом
  rationale: 'Передаёт распределительный смысл: сердце не выдержит страха, каким бы он ни был.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством афористического изречения. Повтор «никак не устоят / никак не устоит» сохраняет параллелизм и усиленное греческое отрицание.
