base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/022.yaml
  text: If you open your mouth against a friend[a], do not be afraid, for there can be reconciliation—except in the case of insult and arrogance and the revealing of a secret and a treacherous blow; in these things every friend will flee.
translation:
  language: ru
  text: 'Если откроешь уста против друга, не бойся, ибо примирение возможно — кроме случаев оскорбления, высокомерия, разглашения тайны и вероломного удара: в таких случаях всякий друг отдалится.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ φίλον
  choice: против друга
  rationale: В сочетании с ἀνοίξῃς στόμα предлог ἐπί с винительным падежом указывает на речь, направленную против друга; последующее упоминание примирения подтверждает, что речь идёт о нанесённой обиде.
- source_word: ἀνοίξῃς στόμα
  choice: откроешь уста
  rationale: Сохранён конкретный греческий образ; выражение понятно по-русски и соответствует достоинству поучительного стиля.
- source_word: μὴ εὐλαβηθῇς
  choice: не бойся
  rationale: Передаёт обычное значение глагола — страх или опасение — и сохраняет связь с пояснением о возможности примирения, не подменяя исходное слово более интерпретирующим «не отчаивайся».
- source_word: διαλλαγή
  choice: примирение
  rationale: Точно обозначает восстановление отношений после размолвки.
- source_word: πλὴν
  choice: кроме случаев
  rationale: В данном контексте вводит перечень исключений из общей возможности примирения.
- source_word: ὀνειδισμοῦ
  choice: оскорбления
  rationale: Естественно передаёт словесное унижение или поношение.
- source_word: ὑπερηφανίας
  choice: высокомерия
  rationale: Передаёт надменную гордость, проявляемую по отношению к другому человеку.
- source_word: μυστηρίου ἀποκαλύψεως
  choice: разглашения тайны
  rationale: В контексте житейской мудрости μυστήριον означает доверенную тайну, а ἀποκάλυψις — её раскрытие; «разглашение» естественно выражает нарушение доверия.
- source_word: πληγῆς δολίας
  choice: вероломного удара
  rationale: Сохраняет одновременно образ причинённой раны и оттенок предательства или коварства.
- source_word: ἀποφεύξεται πᾶς φίλος
  choice: всякий друг уйдёт
  rationale: Передаёт распределительное πᾶς и окончательное удаление друга; буквальное «убежит» в современном русском могло бы звучать неоправданно физически.
