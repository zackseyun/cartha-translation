  yaml_path: translation/deuterocanon/sirach/022/010.yaml
  text: Weep more sweetly over the dead[a], because he has found rest,
translation:
  language: ru
  text: Не так горько плачь об умершем[a], ведь он обрёл покой,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «плачь приятнее (или слаще) об умершем»; по смыслу, вероятно: плачь более умеренно, не так горько.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥδιον
  choice: не так горько
  rationale: Сравнительное наречие от ἡδύς буквально означает «приятнее», «слаще». В речи о плаче буквальная передача по-русски звучала бы неестественно и могла бы создать ложное впечатление удовольствия от смерти. Идиоматическое «не так горько» сохраняет сравнительный смысл и передаёт призыв к более умеренному плачу; буквальный оттенок отмечен в сноске.
- source_word: κλαῦσον
  choice: плачь
  rationale: Аорист повелительного наклонения от κλαίω. «Плачь» прямо и естественно передаёт глагол, не усиливая его до более обрядового «оплакивай».
- source_word: ἐπὶ νεκρῷ
  choice: об умершем
  rationale: ἐπί с дательным обозначает того, о ком плачут. «Об умершем» — естественное русское выражение; форма сохраняет единственное число и не уточняет пол вопреки греческому существительному.
- source_word: ὅτι
  choice: ведь
  rationale: Союз вводит основание для призыва. «Ведь» естественно выражает причинно-пояснительную связь в данном наставлении.
- source_word: ἀνεπαύσατο
  choice: обрёл покой
  rationale: Средняя форма означает, что умерший успокоился, получил отдых. «Обрёл покой» передаёт достигнутое состояние и не добавляет отсутствующего в греческом указания на погребение.
theological_decisions:
- issue: Образ смерти как покоя
  choice: обрёл покой
  alternative: уснул; был упокоен; перестал страдать
  rationale: Греческий текст говорит о покое, но не раскрывает здесь учение о состоянии после смерти. Перевод сохраняет образ, не превращая его ни в утверждение о сне души, ни в указание на погребение, ни в явно высказанное прекращение страданий.
translation_notes:
  register: Современный литературный русский язык с краткой, наставительной интонацией. Необычная буквальная образность ἥδιον раскрыта в сноске, а в основном тексте передана естественным русским выражением. Запятая в конце сохранена, поскольку предоставленный греческий фрагмент синтаксически продолжается.
