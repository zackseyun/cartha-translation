  yaml_path: translation/deuterocanon/sirach/022/027.yaml
  text: Who will set a guard over my mouth, and a shrewd seal over my lips, so that I may not fall because of it, and my tongue destroy me?
translation:
  language: ru
  text: Кто поставит стражу у моих уст и наложит на мои губы хитроумную печать, чтобы мне не пасть из-за неё[a] и чтобы язык мой не погубил меня?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от неё»; к чему именно относится местоимение, в греческом тексте не вполне ясно.'
    reason: Греческое ἀπ’ αὐτῆς имеет женский род; примечание сохраняет неоднозначность связи, не выдавая один возможный антецедент за несомненный.
lexical_decisions:
- source_word: φυλακήν
  choice: стражу
  rationale: Передаёт образ охраны, поставленной у уст, и естественно сочетается с глаголом «поставит».
- source_word: σφραγῖδα πανοῦργον
  choice: искусную печать
  rationale: πανοῦργος здесь обозначает умело устроенное, действенное средство удержания; «искусную» сохраняет оттенок изобретательности без отрицательного смысла «коварную».
- source_word: ἀπολέσῃ με
  choice: не погубил меня
  rationale: Сохраняет сильное значение глагола ἀπόλλυμι, не ослабляя его до «не навредил».
theological_decisions:
- issue: Неясный антецедент местоимения αὐτῆς
  choice: «из-за неё» с примечанием
  alternative: «из-за этого» или «из-за них»
  rationale: Сохранено женское число греческого местоимения и связанная с ним неоднозначность; более свободные варианты либо устранили бы грамматическую связь, либо изменили бы число.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного вопроса. Параллелизм «у моих уст / на мои губы» и сильный заключительный образ языка сохранены.
