  text: But for a fool[a], an evil life is worse than death.
translation:
  language: ru
  text: А для глупца дурная жизнь[a] хуже смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злая жизнь» или «несчастная жизнь»; греческое выражение допускает как нравственный, так и бедственный оттенок смысла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μωροῦ
  choice: глупца
  rationale: Существительное «глупец» кратко и естественно передаёт обозначение неразумного человека и соответствует языку литературы мудрости.
- source_word: ὑπὲρ θάνατον
  choice: хуже смерти
  rationale: В этой краткой сравнительной конструкции ὑπέρ имеет смысл «больше, сверх»; по-русски мысль естественно выражается сравнением «хуже смерти».
- source_word: ζωὴ πονηρά
  choice: дурная жизнь
  rationale: Прилагательное πονηρά допускает как нравственный смысл («злая, порочная»), так и более общий смысл тяжёлого, бедственного качества жизни. «Дурная жизнь» сохраняет эту многозначность лучше, чем однозначные «порочная» или «несчастная».
- source_word: τοῦ δὲ
  choice: А для
  rationale: Частица δέ обозначает мягкий переход или противопоставление; «А для» естественно связывает изречение с предшествующим контекстом.
theological_decisions:
- issue: Значение πονηρά в контексте литературы мудрости
  choice: Сохранить в выражении «дурная жизнь» напряжение между нравственным злом и бедственным существованием.
  alternative: «порочная жизнь» или «несчастная жизнь»
  rationale: Греческий текст не требует выбора исключительно между нравственной испорченностью и жизненным несчастьем; более широкая формулировка не устраняет эту намеренную смысловую открытость.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая форма сохранена. «Глупец» соответствует традиционному, но понятному языку литературы мудрости, а «дурная жизнь» звучит естественно и не сужает многозначность оригинала.
