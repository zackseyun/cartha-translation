translation:
  language: ru
  text: 'Если обнажишь меч против друга[a], не отчаивайся: ведь возвращение возможно[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если вытащишь меч против друга». Греческий глагол означает «тянуть, вытаскивать».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ведь есть возвращение»; также возможно: «ведь есть путь назад» или «восстановление возможно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ φίλον
  choice: против друга
  rationale: При глаголе враждебного действия ἐπί с винительным падежом передаёт направленность против кого-либо; «против друга» ясно и естественно выражает этот смысл.
- source_word: ἐὰν σπάσῃς
  choice: если обнажишь
  rationale: σπάω буквально означает «тянуть, вытаскивать»; в сочетании с мечом речь идёт о его извлечении из ножен. Русское «обнажить меч» естественно передаёт этот образ, не подразумевая удара.
- source_word: ῥομφαίαν
  choice: меч
  rationale: ῥομφαία обозначает меч, нередко большой или широкий. Нейтральное «меч» сохраняет образ и не добавляет излишней конкретизации.
- source_word: μὴ ἀπελπίσῃς
  choice: не отчаивайся
  rationale: ἀπελπίζω означает «терять надежду, отчаиваться»; выбранный вариант краток и сохраняет силу запрета.
- source_word: ἔστιν γὰρ ἐπάνοδος
  choice: ведь возвращение возможно
  rationale: ἐπάνοδος буквально означает «возвращение». Формулировка сохраняет метафору возврата и вместе с тем естественно передаёт подразумеваемую возможность восстановления отношений, не сводя значение однозначно к полному примирению.
theological_decisions:
- issue: Возможность восстановления отношений после тяжёлого проступка против друга
  choice: Сохранить конкретный образ обнажённого меча и открытое понятие «возвращения».
  alternative: 'Передать смысл истолковательно: «примирение ещё возможно»; либо понимать образ меча как гиперболу любого тяжкого оскорбления.'
  rationale: Греческий текст соединяет конкретный воинский образ с абстрактным ἐπάνοδος. Перевод не решает, идёт ли речь о буквальном насилии или образном тяжком проступке, и не отождествляет «возвращение» без остатка с полным примирением.
translation_notes:
  register: Современный литературный русский язык с кратким афористичным строем. «Обнажишь меч» сохраняет достоинство и конкретность исходного образа; «возвращение возможно» намеренно удерживает смысловую открытость греческого ἐπάνοδος.
