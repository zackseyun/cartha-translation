translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. «Укрыть друга» сохраняет метафору защиты, а усиленное «ни за что» передаёт греческое οὐ μή. Запятая исходного текста заменена союзом «и» без разделения стиха.
