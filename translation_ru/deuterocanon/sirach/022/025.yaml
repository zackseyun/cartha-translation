lexical_decisions:
- source_word: φίλον
  choice: друга
  rationale: Винительный падеж единственного числа употреблён без выраженного притяжательного значения; русское «друга» естественно передаёт неопределённый, обобщённый объект, не добавляя «моего».
- source_word: σκεπάσαι
  choice: укрыть
  rationale: Инфинитив σκεπάσαι может означать «покрыть», «укрыть», «защитить». «Укрыть» сохраняет образ и допускает смысл деятельной защиты или поддержки друга.
- source_word: οὐκ αἰσχυνθήσομαι
  choice: не постыжусь
  rationale: 'Будущая форма естественно передаётся русским «не постыжусь»: говорящий не сочтёт постыдным открыто встать на сторону друга.'
- source_word: ἀπὸ προσώπου αὐτοῦ
  choice: от него
  rationale: Оборот буквально связан с «лицом», но идиоматически означает «от лица/присутствия кого-либо». «От него» звучит естественно по-русски и сохраняет направленность действия относительно друга.
- source_word: οὐ μὴ κρυβῶ
  choice: ни за что не стану прятаться
  rationale: Сочетание οὐ μή с аористом сослагательного наклонения выражает усиленное отрицание. «Ни за что не стану» передаёт эту эмфазу; «прятаться» отражает вероятное возвратное значение при сохранении в примечании возможного пассивного прочтения.
