translation:
  language: ru
  text: 'Ленивый подобен комку навоза[a]: всякий, кто поднимет его, отряхнёт руку.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «был брошен вместе с комком навоза», если понимать συνεβλήθη в физическом, а не сравнительном смысле; однако смысл сравнения лучше соответствует форме изречения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: βολβίτῳ κοπρίων
  choice: комку навоза
  rationale: Сочетание обозначает округлый комок или кусок нечистот; «комок навоза» естественно по-русски и сохраняет намеренно уничижительный, наглядный образ.
- source_word: συνεβλήθη
  choice: подобен
  rationale: 'В контексте изречения страдательная форма лучше всего выражает сопоставление: «был уподоблен / сравнен». Краткое «подобен» естественно для русской пословичной речи; буквальная пространственная трактовка сохранена в сноске.'
- source_word: ὀκνηρός
  choice: ленивый
  rationale: Субстантивированное прилагательное передаёт ленивого, праздного человека. «Ленивый» сохраняет мужской род и звучит современно, не прибегая к более архаичному «ленивец».
- source_word: πᾶς ὁ ἀναιρούμενος αὐτόν
  choice: всякий, кто поднимет его
  rationale: ἀναιρέω здесь имеет конкретное значение «поднять, взять». Местоимение «его» грамматически относится к мужскому «комку» и одновременно поддерживает перенос образа на ленивого.
- source_word: ἐκτινάξει χεῖρα
  choice: отряхнёт руку
  rationale: Глагол передаёт резкое стряхивание приставшего или оскверняющего вещества. «Отряхнёт руку» — ясное и естественное выражение инстинктивной реакции после прикосновения к навозу; единственное число χεῖρα сохранено.
