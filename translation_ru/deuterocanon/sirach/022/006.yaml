translation:
  language: ru
  text: Музыка во время скорби — несвоевременная речь[a], а удары и вразумление всегда мудры[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неуместный рассказ»; греческое слово может означать речь, рассказ или повествование.'
    reason: lexical_alternative
