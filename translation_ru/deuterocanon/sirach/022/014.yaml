    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ μόλυβον
  choice: тяжелее свинца
  rationale: В сравнительной конструкции ὑπὲρ передаёт значение «больше, чем»; по-русски естественно выразить его сравнительной степенью.
- source_word: τί βαρυνθήσεται
  choice: что тяжелее
  rationale: Будущая пассивно-медиальная форма употреблена в сжатом риторическом вопросе. Настоящее время по-русски естественно передаёт общее утверждение пословичного характера.
- source_word: τί αὐτῷ ὄνομα
  choice: каково его имя
  rationale: Так сохраняются сжатость греческой фразы и неоднозначность местоимения αὐτῷ, которое грамматически отсылает к названному ранее и подводит к личному обозначению «глупец».
- source_word: ἀλλʼ ἢ
  choice: если не
  rationale: В риторическом вопросе оборот вводит единственно возможный ответ; русское «если не» передаёт эту исключительность естественно и точно.
- source_word: μωρός
  choice: глупец
  rationale: В литературе мудрости слово обозначает не просто человека с низкими умственными способностями, а того, кому недостаёт здравомыслия; «глупец» сохраняет нравственно-поучительный оттенок.
