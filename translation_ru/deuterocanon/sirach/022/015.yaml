translation:
  language: ru
  text: Легче нести песок, соль и глыбу железа, чем неразумного человека[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человека, лишённого разумения»; «глупого человека».'
    reason: 'Лексические варианты ἀσύνετον: слово указывает на отсутствие понимания или здравого смысла и допускает несколько близких переводов.'
lexical_decisions:
- source_word: ἄμμον
  choice: песок
  rationale: Прямое соответствие греческому существительному; в русском естественно употребляется как вещественное существительное.
- source_word: ἅλα
  choice: соль
  rationale: Греческая форма множественного числа имеет собирательное значение; русское вещественное существительное «соль» естественно передаёт смысл.
- source_word: βῶλον σιδήρου
  choice: глыбу железа
  rationale: βῶλος обозначает ком, глыбу или цельную массу; «глыба железа» сохраняет образ тяжёлого груза и звучит естественно в изречении.
- source_word: εὔκοπον
  choice: легче
  rationale: Хотя прилагательное буквально означает «легко, нетрудно», союз ἢ вводит прямое сравнение, поэтому по-русски требуется сравнительная степень.
- source_word: ὑπενεγκεῖν
  choice: нести
  rationale: Глагол допускает значения «нести», «выносить», «переносить». «Нести» сохраняет буквальный образ физических грузов и одновременно подразумевает тягость общения с человеком.
- source_word: ἄνθρωπον
  choice: человека
  rationale: «Человек» точно передаёт общее обозначение человеческого существа в ἄνθρωπος и в русском сохраняет форму мужского рода, не сужая значение до взрослого мужчины.
- source_word: ἀσύνετον
  choice: неразумного
  rationale: Слово обозначает человека, лишённого разумения или здравого смысла. «Неразумный» подходит регистру литературы мудрости и не сводит смысл к уровню интеллекта.
theological_decisions:
- issue: Оттенок значения ἀσύνετον
  choice: неразумного
  alternative: глупого; лишённого разумения; неспособного понимать
  rationale: Выбранный вариант сохраняет акцент на недостатке понимания, не усиливая его до нравственной порочности и не придавая современного психологического или IQ-оттенка.
- issue: Передача ἄνθρωπον
  choice: человека
  alternative: мужчину
  rationale: Греческое ἄνθρωπος здесь называет человека как человеческое существо; перевод «мужчина» неоправданно сузил бы значение. Русское «человек» при этом сохраняет грамматический мужской род исходной формы.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для афористической литературы мудрости. Прямой порядок сравнительной конструкции делает изречение ясным, а конкретные образы песка, соли и железной глыбы сохранены.
