lexical_decisions:
- source_word: ὁ νύσσων
  choice: кто колет
  rationale: Причастие обозначает укол или удар остриём. «Колет» сохраняет конкретный образ и естественно повторяется в обеих частях изречения.
- source_word: ὀφθαλμόν
  choice: глаз
  rationale: Единственное число имеет обобщённое значение; в русском языке такое значение естественно передаётся без артикля.
- source_word: κατάξει δάκρυα
  choice: вызывает слёзы
  rationale: Греческий глагол буквально рисует слёзы как нисходящие или падающие; по-русски «вызывает слёзы» ясно и естественно передаёт причинный смысл.
- source_word: καρδίαν
  choice: сердце
  rationale: Здесь сердце понимается как внутренний центр переживаний; обобщённое единственное число сохранено.
- source_word: ἐκφαίνει
  choice: выявляет
  rationale: Глагол означает вывести наружу, сделать явным. «Выявляет» передаёт переход внутреннего переживания в явное выражение.
- source_word: αἴσθησιν
  choice: чувство
  rationale: Существительное может обозначать ощущение, восприятие или чувствительность. В сочетании с сердцем «чувство» естественно сохраняет эмоциональный смысл, не исключая более широкого значения.
