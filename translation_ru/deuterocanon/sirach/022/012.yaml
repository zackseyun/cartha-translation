base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/012.yaml
  text: Mourning for the dead is seven days[a], but for a fool and an ungodly man, all the days of his life.
translation:
  language: ru
  text: По умершему скорбят семь дней, а по глупцу и нечестивцу[a] — во все дни его жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте употреблены формы мужского рода единственного числа; в этом изречении они имеют обобщающий смысл.
    reason: Пояснение репрезентативного мужского рода оригинала.
lexical_decisions:
- source_word: πένθος νεκροῦ
  choice: по умершему скорбят
  rationale: Греческое именное выражение обозначает траур или скорбь, вызванные смертью человека. Глагольная конструкция естественна для современного русского языка и сохраняет смысл обычая оплакивания умершего.
- source_word: ἑπτὰ ἡμέραι
  choice: семь дней
  rationale: Прямо передаёт временной промежуток и сохраняет параллель с последующим выражением о всех днях жизни.
- source_word: μωροῦ
  choice: по глупцу
  rationale: В литературе мудрости μωρός означает не просто человека с низкими умственными способностями, а того, кому недостаёт нравственного и практического благоразумия. «Глупец» сохраняет эту традиционную категорию.
- source_word: ἀσεβοῦς
  choice: нечестивцу
  rationale: ἀσεβής обозначает человека, лишённого благоговения и поступающего вопреки почитанию Бога. «Нечестивец» ясно и уместно передаёт религиозно-нравственный оттенок.
- source_word: πᾶσαι αἱ ἡμέραι τῆς ζωῆς αὐτοῦ
  choice: во все дни его жизни
  rationale: Формулировка сохраняет структуру греческого текста и временной контраст между семью днями и всей продолжительностью жизни.
theological_decisions:
- issue: Мужской род в обобщающем изречении мудрости
  choice: Сохранены формы «глупцу», «нечестивцу» и «его жизни»
  alternative: «глупому и нечестивому человеку … во все дни жизни такого человека»
  rationale: В греческом стоят формы мужского рода единственного числа, употреблённые как обобщающие типы. Перевод сохраняет грамматическую форму источника, а примечание поясняет её общий смысл.
- issue: Соотнесение местоимения αὐτοῦ
  choice: «его жизни» относится к глупцу и нечестивцу
  alternative: Понимать выражение как жизнь скорбящего
  rationale: Ближайший грамматический антецедент — названный глупец и нечестивец; контекст изречения противопоставляет краткий срок скорби по умершему скорби, вызываемой таким человеком на протяжении его жизни.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой, характерной для изречения мудрости. Тире передаёт опущенный во второй части сказуемый элемент и подчёркивает контраст.
