translation:
  language: ru
  text: Бесстыдная женщина[a] позорит отца и мужа и будет обесчещена обоими.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наглая женщина» или «дерзкая женщина». Греческое слово обозначает женщину, чья дерзость доходит до бесстыдства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα
  choice: отца
  rationale: Прямое дополнение при καταισχύνει. Как и в греческом, притяжательное местоимение не выражено, но родственная связь ясна из контекста.
- source_word: ἄνδρα
  choice: мужа
  rationale: В сочетании с «отцом» и в контексте семейной чести ἀνήρ естественнее всего означает супруга, а не мужчину вообще.
- source_word: καταισχύνει
  choice: позорит
  rationale: Глагол означает навлекать стыд или бесчестье; «позорит» кратко и естественно передаёт его каузативный смысл.
- source_word: ἡ θρασεῖα
  choice: бесстыдная женщина
  rationale: Субстантивированное прилагательное женского рода обозначает женщину, отличающуюся вызывающей дерзостью и бесстыдством. В данном контексте это порицаемое качество, а не похвальная смелость.
- source_word: ὑπὸ ἀμφοτέρων
  choice: оба
  rationale: Форма ἀμφοτέρων отсылает к двум ранее названным лицам — отцу и мужу. В русском активная конструкция с «оба» звучит естественнее буквального пассива.
- source_word: ἀτιμασθήσεται
  choice: будут её презирать
  rationale: Будущее страдательного залога от ἀτιμάζω указывает на бесчестье, которому она подвергнется с их стороны. «Будут её презирать» естественно передаёт отношение неуважения и сохраняет отрицательную социально-нравственную силу выражения, избегая двусмысленности русского «обесчестят».
