base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/022/016.yaml
  text: A wooden binding fastened into a building will not be loosened in an earthquake[c][b][a]; so a heart made firm by deliberate counsel will not lose courage in time of trouble.
translation:
  language: ru
  text: Деревянное крепление, закреплённое в строении, не распадётся при землетрясении[a]; так и сердце, утверждённое на обдуманном решении[b], не падёт духом в час[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не разойдётся» или «не разрушится». Греческий глагол может обозначать распад или разъединение скреплённых частей.'
    reason: lexical_alternative
  - marker: b
    text: 'Сжатое греческое выражение можно также передать: «на разумном замысле» или «благодаря рассудительному совету».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в час» или «в пору». Контекст может подразумевать критический момент, испытание или кризис, но это не выражено прямо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱμάντωσις ξυλίνη
  choice: деревянное крепление
  rationale: ἱμάντωσις обозначает связывающее или скрепляющее устройство, а ξυλίνη указывает на материал. «Деревянное крепление» естественно передаёт строительный образ, не уточняя без достаточных оснований его точную форму.
- source_word: ἐνδεδεμένη εἰς οἰκοδομήν
  choice: закреплённое в строении
  rationale: Перфектное причастие выражает устойчивое состояние после закрепления, а εἰς указывает на включённость крепления в сооружение.
- source_word: ἐν συσσεισμῷ
  choice: при землетрясении
  rationale: Существительное обозначает сильное совместное сотрясение и в строительном контексте естественно понимается как землетрясение.
- source_word: οὐ διαλυθήσεται
  choice: не распадётся
  rationale: Глагол может означать разъединение, разрушение связей или распад на части; этот вариант сохраняет образ целостности строительной конструкции.
- source_word: καρδία
  choice: сердце
  rationale: Сохранён библейский антропологический образ, охватывающий внутренние мысли, волю и мужество человека.
- source_word: ἐστηριγμένη
  choice: утверждённое
  rationale: Перфектное причастие обозначает приобретённую и сохраняющуюся твёрдость; слово также поддерживает параллель со строительным креплением.
- source_word: ἐπὶ διανοήματος βουλῆς
  choice: на обдуманном решении
  rationale: Сжатое греческое сочетание соединяет мысль или намерение с советом, обдумыванием либо решением. Русская формулировка передаёт рассудительность и определённость, не сводя выражение только к чужому совету.
- source_word: ἐν καιρῷ
  choice: в час испытания
  rationale: Буквально выражение означает «в пору, в час»; образ землетрясения и упоминание мужества подразумевают критическое время. Уточнение вынесено также в примечание как контекстуальное.
- source_word: οὐ δειλιάσει
  choice: не падёт духом
  rationale: Глагол означает проявить робость, оробеть или утратить мужество. Русская идиома естественно передаёт внутреннюю стойкость.
theological_decisions:
- issue: Значение καρδία
  choice: сердце
  alternative: ум; внутренний человек
  rationale: «Сердце» сохраняет библейскую целостность внутренней жизни — рассудка, воли и мужества — и не ограничивает смысл одной интеллектуальной способностью.
- issue: Основание внутренней стойкости в ἐπὶ διανοήματος βουλῆς
  choice: на обдуманном решении
  alternative: на разумном замысле; благодаря рассудительному совету
  rationale: Греческая конструкция допускает оттенки замысла, решения и совета. Основной текст сохраняет связь стойкости с продуманным внутренним основанием, не превращая стих в утверждение о конкретном источнике совета.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской мудрости. Строительная метафора сохранена и последовательно связана с внутренней твёрдостью сердца; идиома «не падёт духом» понятна широкому кругу читателей.
