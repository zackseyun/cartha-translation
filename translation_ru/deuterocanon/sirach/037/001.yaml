  text: Every friend says[a], “I love him,” but there is a friend who is a friend in name only.
translation:
  language: ru
  text: 'Всякий друг говорит: «И я люблю его», но бывает друг лишь по имени.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская фраза в конце стиха очень сжата; греческий параллельный текст передаёт её смысл как «друг только по имени».
    reason: lexical_alternative
lexical_decisions:
- source_word: כל אוהב
  choice: Всякий друг
  rationale: Причастие אוהב может означать «любящий» или «друг». Греческое Πᾶς φίλος и контраст с номинальной дружбой подтверждают социальное значение «друг».
- source_word: אומר
  choice: говорит
  rationale: Простой глагол речи; нейтральная передача сохраняет лаконичность притчи.
- source_word: אהבתי
  choice: И я люблю его
  rationale: Еврейская форма буквально допускает «я любил», но в прямой речи естественно выражает заверение в любви. Местоимение «его» проясняется греческим αὐτῷ, а «и» — κἀγώ; они также помогают восстановить сжатый смысл еврейского текста.
- source_word: אך
  choice: но
  rationale: Кратко и естественно передаёт противопоставление заявления о дружбе её действительности.
- source_word: יש
  choice: бывает
  rationale: Экзистенциальное יש в русском афористическом высказывании естественно передаётся словом «бывает».
- source_word: אהב שם אהב
  choice: друг лишь по имени
  rationale: Еврейское выражение сжато и несколько неясно; греческое ὀνόματι μόνον φίλος прямо подтверждает смысл «друг только по имени».
