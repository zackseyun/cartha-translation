base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/018.yaml
  text: But with one whose heart is like your heart[a], if you stumble[b], he will be affected also.
translation:
  language: ru
  text: Но у того, чьё сердце подобно твоему[a], — если ты споткнёшься[b], это коснётся и его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его сердце — как твоё». Здесь может подразумеваться человек, близкий тебе по внутреннему складу или мыслям.'
    reason: lexical_alternative
  - marker: b
    text: 'Последняя часть по-еврейски предельно кратка: «если ты споткнёшься, [это] достигнет его». То, что именно коснётся другого человека, прямо не названо.'
    reason: alternative_reading
lexical_decisions:
- source_word: אך
  choice: Но
  rationale: Передаёт противопоставление или ограничение по отношению к предыдущему наставлению; кратко и естественно по-русски.
- source_word: עם
  choice: будь с тем
  rationale: Еврейский предлог буквально означает «с»; для связного русского высказывания добавлено подразумеваемое сказуемое «будь», не уточняющее сверх текста характер отношения.
- source_word: לבבו כלבבך
  choice: чьё сердце подобно твоему
  rationale: Сохраняет образ сердца как внутреннего склада, намерений и разумения, не сводя его только к эмоциям или единомыслию.
- source_word: אם תכשל
  choice: если ты споткнёшься
  rationale: Сохраняет метафору преткновения и допускает как нравственную ошибку, так и практическую неудачу.
- source_word: יגיע אליו
  choice: это коснётся и его
  rationale: Еврейская фраза буквально говорит, что нечто «достигнет его»; русское «это коснётся и его» естественно передаёт воздействие, сохраняя неявность субъекта.
theological_decisions:
- issue: Антропологическое значение לבב
  choice: сердце
  alternative: разум; внутренний человек; единомышленник
  rationale: '«Сердце» сохраняет широкую библейскую антропологию: внутренние намерения, мысли и расположение человека, без конфессионального сужения.'
- issue: Неявный субъект в יגיע אליו
  choice: это коснётся и его
  alternative: он тоже споткнётся; твоя беда затронет и его; это достигнет и его
  rationale: Исходный текст не называет прямо то, что достигает другого человека. Перевод не отождествляет это однозначно ни с падением, ни с бедой, сохраняя смысловую сжатость и неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Слово «сердце» и метафора преткновения сохранены; синтаксис слегка развёрнут ради естественности. Греческий параллельный текст существенно расходится с данным еврейским чтением, поэтому перевод следует высокоуверенному еврейскому источнику.
