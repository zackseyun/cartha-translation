  text: And there is a wise man who is wise for himself[b][a]; the fruit of his understanding is upon his own body.
translation:
  language: ru
  text: И бывает мудрец, мудрый для самого себя[a]; плод его разумения — на его собственном теле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для своей души»; здесь, вероятно, в значении «для себя самого» или «для собственной жизни».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово означает «тело», а в некоторых контекстах — «труп»; здесь речь идёт о живом человеке, на котором сказывается плод его разумения.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ
  choice: Есть
  rationale: Передаёт еврейскую бытийную конструкцию и вводит ещё один тип мудреца без добавочного истолкования связки.
- source_word: חָכָם
  choice: мудрец
  rationale: Естественно и точно передаёт существительное мужского рода в единственном числе, сохраняя форму притчи.
- source_word: לְנַפְשׁוֹ
  choice: для себя самого
  rationale: 'В данном обороте נֶפֶשׁ имеет рефлексивный смысл: мудрость направлена на благо самого человека. Буквальное значение отмечено в сноске.'
- source_word: יֶחְכָּם
  choice: мудр
  rationale: Сохраняет словесный повтор корня חכם и не уточняет без необходимости, идёт ли речь о состоянии, проявлении или приобретении мудрости.
- source_word: פְּרִי
  choice: плод
  rationale: Сохраняет конкретную метафору результата или пользы, естественную для русской речи.
- source_word: דַעְתּוֹ
  choice: его разумения
  rationale: В контексте литературы мудрости слово обозначает не только обладание сведениями, но и практическое понимание; «разумение» сохраняет этот оттенок.
- source_word: עַל
  choice: на
  rationale: Сохраняет пространственный образ еврейского предлога и не сводит неоднозначную фразу лишь к значению пользы.
- source_word: גְוִיָּתוֹ
  choice: его собственном теле
  rationale: В контексте подразумевается живой человек, испытывающий последствия своего разумения. «Собственном» подчёркивает соотнесённость с самим мудрецом, уже выраженную первой половиной строки.
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ
  choice: рефлексивное «для себя самого»
  alternative: «для своей души» или «для своей жизни»
  rationale: Изречение говорит о том, кому приносит пользу мудрость; рефлексивный перевод не навязывает тексту представление о душе как об обособленной части человека.
- issue: Значение גְוִיָּה
  choice: живое «тело»
  alternative: «труп»
  rationale: Контекст описывает плод разумения, относящийся к самому мудрецу; значение «труп» здесь создало бы не подкреплённый контекстом мотив смерти.
translation_notes:
  register: Современный литературный русский язык с достоинством мудростного изречения. Необычный образ «плод… на теле» сохранён ради близости к еврейскому тексту и его смысловой напряжённости; пунктуация делает его читаемым без внесения в основной текст дополнительного толкования.
