  text: The beginning of every deed is a word[c][b][a], and the beginning of every work is a thought.
translation:
  language: ru
  text: Начало всякого дела — слово[b], и начало всякого труда — мысль[c].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом свидетельстве здесь стоит другое изречение: «Есть человек, мудрый для самого себя, и плоды его разумения на его устах заслуживают доверия».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «дело» либо «предмет»; еврейское слово דבר может обозначать как слово, так и дело или предмет.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «замысел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ראש
  choice: начало
  rationale: В афористическом контексте указывает на то, что стоит первым или лежит у истока; «начало» естественно сохраняет параллелизм обеих частей.
- source_word: כל
  choice: всякого
  rationale: Передаёт распределительное обобщение, характерное для изречения.
- source_word: מעשה
  choice: дело
  rationale: Естественное русское соответствие для поступка или совершаемого дела; позволяет отличить слово от פועל во второй части.
- source_word: דבר
  choice: слово
  rationale: דבר может означать «слово», «дело» или «предмет». Здесь «слово» создаёт содержательную параллель с внутренней мыслью, однако лексическая неоднозначность отмечена в сноске.
- source_word: פועל
  choice: труд
  rationale: Передаёт работу или деятельность и сохраняет некоторое различие с מעשה, переведённым как «дело».
- source_word: היא
  choice: —
  rationale: Именное сказуемое в настоящем времени по-русски естественно оформляется тире без выраженной связки «есть».
- source_word: מחשבת
  choice: мысль
  rationale: Сохраняет широкий смысл размышления, намерения или замысла, не сужая его исключительно до заранее составленного плана.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческого параллельного свидетельства
  choice: Основной текст переведён по еврейскому свидетельству; существенно иной греческий текст приведён в сноске.
  alternative: 'Греческое чтение: «Бывает мудрый для собственной души, и плоды его разумения достойны доверия в его устах».'
  rationale: При наличии еврейского текста он служит первичным источником. Греческое свидетельство содержит не близкий перевод, а другое изречение, поэтому смешивать чтения нельзя; расхождение сохранено для прозрачности.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная афористическая форма. Параллелизм еврейского текста сохранён, а тире естественно передаёт именную конструкцию настоящего времени.
