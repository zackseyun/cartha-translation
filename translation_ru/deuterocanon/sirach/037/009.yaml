translation:
  language: ru
  text: Остерегайся советчика[a] и заранее узнай, что ему нужно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в чём состоит его интерес». Еврейское слово может обозначать не только нужду в строгом смысле, но и то, что занимает человека или движет им. Греческий параллельный текст развивает мысль иначе: «и скажет тебе: „Хорош твой путь“, а сам станет напротив, чтобы увидеть, что с тобой случится».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מיועץ
  choice: советчика
  rationale: Предлог מן при יועץ выражает, от кого следует беречься. «Советчик» прямо передаёт роль человека, дающего совет, и естественно сочетается с «остерегайся».
- source_word: שמור נפשך
  choice: остерегайся
  rationale: 'Буквально: «береги себя (свою душу/жизнь)». В данном предостережении русское «остерегайся» естественно передаёт направленную на себя осторожность, не сужая смысл до физической защиты жизни.'
- source_word: ודע לפנים
  choice: и заранее узнай
  rationale: לפנים здесь имеет временное значение «заранее, предварительно». Глагол «узнай» в русском лучше, чем статичное «знай», передаёт призыв предварительно выяснить мотив советчика.
- source_word: מה צרכו
  choice: что ему нужно
  rationale: צרך может обозначать нужду, потребность или личный интерес. Формулировка «что ему нужно» близка к еврейскому тексту, естественна по-русски и сохраняет возможность подразумеваемой личной заинтересованности.
