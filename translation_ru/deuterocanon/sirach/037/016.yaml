translation:
  language: ru
  text: Тщетно трудится работник над своим делом, тщетно сторожит страж того, кто порождает зло.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте вместо этого: «И обо всём этом молись Всевышнему, чтобы Он направил твой путь в истине». Еврейский и греческий тексты здесь существенно расходятся.'
    reason: textual_variant
lexical_decisions:
- source_word: פועל
  choice: работник
  rationale: Существительное обозначает того, кто действует или трудится; «работник» сохраняет конкретный образ и параллелизм со «стражем».
- source_word: שוא
  choice: тщетен
  rationale: Слово выражает пустоту, бесплодность или бесполезность. «Тщетен» естественно повторяется в обеих частях и сохраняет сжатый характер изречения.
- source_word: מלאכתו
  choice: в своём деле
  rationale: Слово означает работу, занятие или порученное дело. Оборот «в своём деле» передаёт отношение работника к его работе без тяжеловесного повтора.
- source_word: שומר
  choice: страж
  rationale: Форма обозначает того, кто сторожит или охраняет; «страж» кратко и выразительно соответствует параллельному «работнику».
- source_word: מוציא רע
  choice: кто порождает зло
  rationale: Буквально — «выводящий/производящий зло». Перевод сохраняет образ возникновения зла и не сужает неясное выражение до однозначного «злодея» или «злословящего».
theological_decisions:
- issue: Существенное расхождение между сохранившимся еврейским текстом и греческой параллелью
  choice: Основной текст переведён по еврейскому свидетельству, а совершенно иное греческое чтение приведено в сноске.
  alternative: «И обо всём этом молись Всевышнему, чтобы Он направил твой путь в истине».
  rationale: Поскольку еврейский текст этого стиха сохранился, он принят за основу. Однако греческое чтение представляет не малый вариант, а иной стих, поэтому расхождение нельзя скрывать или сглаживать.
translation_notes:
  register: Современный литературный русский язык с кратким, несколько возвышенным ритмом изречения. Повтор «тщетен» воспроизводит симметрию еврейского текста; неясность заключительного оборота сохранена без конфессионального истолкования.
