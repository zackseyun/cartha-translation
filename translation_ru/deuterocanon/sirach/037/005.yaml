lexical_decisions:
- source_word: אוהב
  choice: друг
  rationale: Причастие буквально обозначает «любящего», но здесь употреблено как существительное в значении близкого человека, друга; такое понимание согласуется и с греческой параллелью.
- source_word: טוב
  choice: выгода
  rationale: Слово может означать «добро», «благо» или «выгоду». В данном трудном контексте «выгода» естественно передаёт возможный предмет спора, не исключая более общего значения «благо».
- source_word: נלחם עם זר
  choice: вступает в борьбу с чужим
  rationale: Предлог עם допускает значение совместности или противостояния; сочетание с глаголом борьбы естественно передать как конфликт с человеком, не принадлежащим к своему кругу.
- source_word: זר
  choice: чужой
  rationale: «Чужой» сохраняет широкое значение человека вне своего круга и не привносит этнического оттенка слова «иноземец».
- source_word: נגד ערים
  choice: против городов
  rationale: Нגד выражает положение напротив или направленность против. Хотя чтение «городов» необычно и расходится с греческим «войны», основной текст следует сохранившемуся еврейскому свидетельству.
- source_word: יחזיק צנה
  choice: поднимает щит
  rationale: Буквально речь о том, чтобы держать или взять щит; «поднимает щит» естественно передаёт вооружённое выступление и сохраняет образ.
- source_word: צנה
  choice: щит
  rationale: Общее современное обозначение защитного вооружения; возможный оттенок большого щита не требуется выражать в основном тексте.
