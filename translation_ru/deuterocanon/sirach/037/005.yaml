  terminology: '«Чужак» хорошо передаёт זר без этнической конкретизации «иноземец». «Благо» сохраняет необходимую широту טוב; в примечании указаны «добро» и «выгода». Примечание к греческому параллельному тексту уточнено: συνπονεῖ означает «страдает/терпит вместе», а не обязательно «разделяет тяготы».'
