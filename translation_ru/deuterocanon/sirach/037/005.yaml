  text: A friend fights with a stranger over a good thing[b][a], and against cities he will take up a shield.
translation:
  language: ru
  text: Друг вступает в борьбу с чужаком из-за блага[b] и против городов берёт щит[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч.: «Товарищ терпит вместе с другом ради желудка и перед лицом войны берёт щит». Еврейский и греческий тексты заметно различаются в первой части стиха, а также чтениями «города» и «война». Основной текст следует сохранившемуся еврейскому свидетельству.'
    reason: alternative_reading
  - marker: b
