translation:
  language: ru
  text: Не советуйся со своим тестем[a] и скрой тайну от завистливого человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь существенно отличается: «Но постоянно общайся с благочестивым человеком, о котором знаешь, что он соблюдает заповеди». Данный перевод следует сохранившемуся еврейскому тексту, предостерегающему против совета с тестем и открытия тайны завистливому человеку.'
    reason: textual_variant
lexical_decisions:
- source_word: אל תועץ
  choice: Не советуйся
  rationale: Отрицательная форма выражает запрет искать совета; возвратный глагол «советоваться» естественно передаёт это по-русски.
- source_word: חמיך
  choice: со своим тестем
  rationale: Еврейское слово обозначает именно отца жены; «тесть» — точный и современный русский эквивалент.
- source_word: וממקנא
  choice: от завистливого
  rationale: Предлог מן требует значения «от», а מקנא обозначает завистливого или ревнивого человека. «Завистливый» наиболее естественно в контексте доверенной тайны.
- source_word: העלים סוד
  choice: скрывай тайну
  rationale: Выражение означает утаивать или не открывать тайну. Императив «скрывай» сохраняет параллель с первым запретом.
theological_decisions:
- issue: Существенное расхождение еврейского текста с греческой параллелью
  choice: Перевести сохранившийся еврейский текст непосредственно
  alternative: 'Следовать греческому чтению: постоянно общаться с благочестивым человеком, соблюдающим заповеди'
  rationale: Еврейское свидетельство здесь имеется и обладает высокой уверенностью, поэтому оно остаётся основным. Существенно отличающееся греческое чтение отмечено в сноске, но не подменяет еврейский текст.
translation_notes:
  register: Современный литературный русский язык с краткой афористической формой. «Тесть» точнее общего «родственник по браку»; «завистливый» оставлено субстантивированным, чтобы не добавлять отсутствующее в источнике указание на пол.
