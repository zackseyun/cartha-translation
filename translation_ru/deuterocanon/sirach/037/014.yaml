  text: Do not bargain with a merchant[a], nor over buying and selling.
translation:
  language: ru
  text: Не торгуйся с купцом[a] и не препирайся о покупке и продаже.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой традиции здесь: «Утверди совет своего сердца, ведь нет для тебя ничего вернее его». Сохранившийся еврейский текст в этом месте существенно отличается от греческого.'
    reason: alternative_reading
lexical_decisions:
- source_word: עם סוחר
  choice: с купцом
  rationale: Предлог עם обозначает участие или взаимодействие, а סוחר — человека, профессионально занимающегося торговлей; «с купцом» естественно вводит ситуацию переговоров.
- source_word: אל תתגר
  choice: не торгуйся
  rationale: Хотя глагол может иметь более общее значение «вступать в спор, состязаться», непосредственный торговый контекст с купцом и последующей парой «покупка — продажа» поддерживает смысл торга.
- source_word: ממקנה על ממכר
  choice: не препирайся о покупке и продаже
  rationale: מקנה и ממכר образуют коммерческую пару, связанную с приобретением и продажей. «О покупке и продаже» передаёт оба понятия, а «не препирайся» продолжает запрет без искусственного буквального воспроизведения предлогов מן и על.
- source_word: ו־
  choice: и не
  rationale: Союз связывает параллельные предостережения; повтор отрицания делает синтаксис ясным и естественным по-русски.
- source_word: καὶ βουλὴν καρδίας στήσον
  choice: указано в сноске как существенно отличающееся греческое чтение
  rationale: Сохранившийся еврейский текст имеет приоритет для основного перевода, однако греческая традиция содержит совершенно иной текст и потому должна быть засвидетельствована в примечании.
theological_decisions:
- issue: Существенное расхождение сохранившегося еврейского текста и греческой параллели
  choice: Основной текст следует еврейскому чтению — предостережению о торге с купцом и споре при сделке.
  alternative: 'Греческий текст: «Утверди совет своего сердца, ведь нет для тебя ничего вернее его».'
  rationale: Поскольку еврейский текст данного места сохранился с высокой степенью уверенности, он положен в основу перевода. Греческое чтение не сглажено и не смешано с ним, а приведено отдельно как значимая альтернативная традиция.
translation_notes:
  register: Современный литературный русский язык с краткой формой наставления. «Торговаться» сохраняет конкретный коммерческий контекст; «препираться» передаёт оттенок состязательного спора, не превращая вторую часть в общий запрет торговли. Маркер [a] помещён сразу после слова, к которому относится текстологическое примечание.
