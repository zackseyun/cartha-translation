translation:
  language: ru
  text: Горе злому замыслу! Для чего ты был создан — чтобы наполнить весь мир обманом?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Горе злому замыслу! Откуда ты вкатился, чтобы покрыть сушу обманом?» Греческий текст помогает понять трудное еврейское слово как «замысел», но вместо еврейского «наполнить» читает «покрыть».'
    reason: alternative_reading
lexical_decisions:
- source_word: הוי
  choice: Горе
  rationale: Междометие выражает скорбное осуждение; «горе» сохраняет вес и обличительный тон еврейского текста.
- source_word: רע יאמר
  choice: злому замыслу
  rationale: Переданное еврейское чтение затруднительно, если понимать יאמר как форму глагола «говорить». Греческая параллель ἐνθύμημα («мысль, замысел») убедительно указывает на персонифицированный злой замысел.
- source_word: מדוע כן נוצרתי
  choice: для чего ты был создан
  rationale: Риторический вопрос передан как обращение к персонифицированному замыслу. «Для чего» естественно связывает вопрос с последующей конструкцией цели.
- source_word: למלא
  choice: наполнить
  rationale: Прямо передаёт еврейский инфинитив «наполнить»; отличающееся греческое «покрыть» отмечено в сноске.
- source_word: פני תבל
  choice: весь мир
  rationale: Еврейская идиома буквально означает «лицо мира/обитаемой земли». В современном русском «весь мир» естественно передаёт её объём без неясного буквализма.
- source_word: תרמית
  choice: обманом
  rationale: Существительное обозначает обман, коварство; «обман» кратко и ясно передаёт основной смысл и согласуется с греческим δολιότης.
theological_decisions:
- issue: Еврейский текст как основной свидетель при использовании греческой параллели для прояснения трудного слова
  choice: Обращение к «злому замыслу»
  alternative: «злое изречение» или «злой товарищ»
  rationale: Форма יאמר в дошедшем еврейском тексте трудна, тогда как греческое ἐνθύμημα прямо поддерживает значение «мысль/замысел». Такое чтение создаёт связное персонифицированное обращение, не привнося конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством мудростной поэзии. Синтаксис прямой и понятный; персонификация замысла сохранена. Буквальное «лицо мира» заменено естественным «весь мир», при этом образный и всеохватный смысл выражения сохранён.
