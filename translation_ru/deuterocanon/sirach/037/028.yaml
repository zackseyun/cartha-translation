  text: For not everything is beneficial for everyone, and not every person delights in every kind of thing.[a]
translation:
  language: ru
  text: Ведь не всё полезно всем, и не всякому человеку всё по душе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст из Каирской генизы в этом месте труден и заметно расходится с греческим: буквально: «И есть мудрец, который мудр для своего народа; плод его знания — в их телах». Поэтому основной текст здесь переведён по греческому свидетельству, а еврейское чтение отмечено в примечании.'
    reason: textual_variant
lexical_decisions:
- source_word: οὐ γὰρ πάντα πᾶσιν συμφέρει
  choice: Ведь не всё полезно всем
  rationale: Сохраняет пояснительное γάρ и обычное значение συμφέρει — «быть полезным, идти на пользу». Греческое свидетельство здесь даёт связный текст стиха, тогда как дошедшая еврейская строка существенно расходится с ним.
- source_word: οὐ πᾶσα ψυχὴ
  choice: не всякому человеку
  rationale: ψυχή здесь означает человека как отдельную личность, а не специально «душу» в антропологическом смысле. Дательный оборот естественно сочетается по-русски с выражением «по душе».
- source_word: ἐν παντὶ εὐδοκεῖ
  choice: всё по душе
  rationale: Идиоматически передаёт значение «находить удовольствие, быть довольным чем-либо», не сужая широкого ἐν παντί до определённого рода предметов.
- source_word: וְיֵשׁ חָכָם לְעַמּוֹ יֶחְכָּם, פְּרִי דַעְתּוֹ בִּגְוִיָתָם
  choice: И есть мудрец, который мудр для своего народа; плод его знания — в их телах
  rationale: Буквальный смысл сохранившегося еврейского чтения приводится в примечании, поскольку оно не соответствует греческому тексту данного стиха и, вероятно, отражает текстовую или нумерационную проблему.
