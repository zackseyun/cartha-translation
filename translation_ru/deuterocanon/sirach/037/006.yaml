translation_notes:
  register: Современный литературный русский язык с краткой наставительной формой. Перевод исходит прежде всего из связного чтения еврейского текста, а отличия древнего греческого параллельного текста сохраняет в сносках. Формулировка не уточняет, каким именно образом друг должен участвовать в добыче, поскольку исходный текст этого прямо не говорит.
