    reason: textual_variant
lexical_decisions:
- source_word: אל תשכח
  choice: Не забывай
  rationale: Прямой запрет, естественно и точно передающий еврейскую конструкцию с отрицанием; соответствует также греческому μὴ ἐπιλάθῃ.
- source_word: חבר
  choice: друга
  rationale: В данном нравственном наставлении существительное обозначает друга или близкого товарища; «друг» наиболее естественно по-русски и соответствует греческому φίλου.
- source_word: בקרב
  choice: в бою
  rationale: 'При чтении קרב как «бой, сражение» выражение образует ясную параллель со следующей строкой: друга нельзя забывать ни во время опасности, ни при обретении добычи. Однако те же согласные допускают связь со значением «внутри», а греческий текст читает «в душе твоей»; вариант отмечен в сноске.'
- source_word: ואל תעזבהן
  choice: и не оставляй его
  rationale: Глагол עזב обычно значит «оставлять, покидать». Необычная форма местоименного суффикса в дошедшем еврейском тексте сглажена по очевидному отнесению к единственному числу «друг»; это поддерживает греческое αὐτοῦ.
- source_word: בשללך
  choice: когда у тебя будет добыча
  rationale: Слово שלל в еврейском тексте естественно означает военную добычу. Ситуативная русская конструкция передаёт буквальное «при твоей добыче» без неестественного оборота и связывает строку с упоминанием боя.
