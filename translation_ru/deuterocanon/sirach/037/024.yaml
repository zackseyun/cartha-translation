  text: Good and evil[a], life and death—over them all the tongue rules.
translation:
  language: ru
  text: Добро и зло[a], жизнь и смерть — над ними всеми властвует язык.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческой параллели: «Мудрый человек исполнится благословения, и все, кто видит его, назовут его счастливым». Греческий текст здесь существенно отличается от сохранившегося еврейского.'
    reason: alternative_reading
lexical_decisions:
- source_word: טוב
  choice: добро
  rationale: В паре с רעה слово передаёт широкий смысл добра как нравственного и жизненного блага; более узкое «благополучие» неоправданно сужало бы контраст.
- source_word: רעה
  choice: зло
  rationale: Прямой антоним к טוב сохраняет всеохватный контраст; варианты «беда» или «несчастье» возможны в литературе мудрости, но здесь параллель с жизнью и смертью поддерживает более широкое значение.
- source_word: חיים
  choice: жизнь
  rationale: Прямое и естественное соответствие; вместе со словом «смерть» образует традиционную всеохватную пару.
- source_word: מות
  choice: смерть
  rationale: Прямое соответствие, сохраняющее краткую и сильную антитезу «жизнь и смерть».
- source_word: ומושלת
  choice: властвует
  rationale: Глагол משל обозначает господство или власть. «Властвует» естественно передаёт силу выражения и подходит к афористическому стилю.
- source_word: בם כליל
  choice: над ними всеми
  rationale: Передаёт полный охват всех четырёх названных явлений, не ослабляя категоричности еврейского текста.
- source_word: לשון
  choice: язык
  rationale: Сохранён конкретный библейский образ языка как обозначения речи и её силы; замена на «речь» сделала бы метафору менее выразительной.
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и существенно отличающейся греческой параллели
  choice: 'Основной текст переведён по сохранившемуся еврейскому чтению: «Добро и зло, жизнь и смерть — над ними всеми властвует язык».'
  alternative: 'Греческая параллель: «Мудрый человек исполнится благословения, и все, кто видит его, назовут его счастливым».'
  rationale: Там, где еврейский текст Сираха сохранился с высокой степенью надёжности, он служит первичным источником. Греческое свидетельство здесь передаёт не близкий вариант той же фразы, а существенно иной текст, поэтому оно вынесено в примечание без попытки искусственно согласовать оба чтения.
translation_notes:
  register: Краткий, афористичный синтаксис сохранён. Лексика современная и литературная; «властвует язык» звучит торжественно, но не архаично, и удерживает конкретную метафору еврейского текста.
