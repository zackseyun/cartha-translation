translation:
  language: ru
  text: 'Каждый советчик говорит: «Смотри!»[a] — но бывает советчик, который попирает его[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское «Смотри!» здесь не вполне ясно: это может быть краткое указание или уверенное заявление советчика о своей проницательности. В греческом тексте дано более пространное предостережение: следует беречься советчика, поскольку он и сам советует в собственных интересах.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «ступает по нему» или «наступает на него»; возможно, имеется в виду советчик, который причиняет человеку вред или использует его в своих интересах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כל
  choice: каждый
  rationale: 'Передаёт распределительное значение в кратком назидательном изречении: речь идёт о всяком советчике.'
- source_word: יועץ
  choice: советчик
  rationale: Естественное русское обозначение человека, дающего совет; повтор существительного сохранён.
- source_word: אומר
  choice: говорит
  rationale: Настоящее время соответствует обобщающему характеру изречения.
- source_word: חזה
  choice: «Смотри!»
  rationale: Сохраняет краткость и повелительное звучание трудной еврейской формы, не устраняя её неясности.
- source_word: אך
  choice: но
  rationale: Ясно передаёт противопоставление между обычным заявлением советчика и последующим предостережением.
- source_word: דורך עליו
  choice: попирает его
  rationale: Сохраняет образ хождения или наступания на человека и одновременно допускает переносный смысл причинения вреда либо использования в своих интересах.
theological_decisions:
- issue: Выбор между кратким трудным еврейским текстом и более пространным греческим параллельным чтением
  choice: Основной текст следует сохранившемуся еврейскому чтению, а греческая версия приводится в примечании как свидетельство иной, более полной формы предостережения.
  alternative: «Береги себя от советчика и прежде узнай, что ему нужно, ведь он будет советовать и в собственных интересах».
  rationale: Еврейский текст имеет приоритет там, где он сохранился. Его краткость и неоднозначность не следует молча заменять более гладким греческим чтением.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Слово «попирает» несколько возвышенное, но понятно в контексте Премудрости и сохраняет резкий телесный образ еврейского текста.
