  text: And more than all this, pray to the Most High that he may direct your way in truth.
translation:
  language: ru
  text: Ведь душа человека порой сообщает ему больше, чем семь дозорных, сидящих на возвышенном месте, на страже.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленные текстовые свидетельства здесь не совпадают. Сохранившаяся еврейская строка приблизительно гласит: «С дурным человеком — о воздаянии за добро, и с жестоким — о благе плоти» и, по-видимому, относится к иному месту или повреждена. Приведённая греческая параллель говорит о душе человека и семи дозорных; именно она переведена в основном тексте. Чтение «А сверх всего этого молись Всевышнему, чтобы Он направил твой путь в истине» известно как соседний стих греческой традиции, но отсутствует в предоставленной греческой строке.'
    reason: textual_variant
lexical_decisions:
- source_word: ψυχὴ ἀνδρός
  choice: душа человека
  rationale: Передаёт греческое выражение без сведения ψυχή только к разуму или совести; в данном контексте речь идёт о внутреннем восприятии человека.
- source_word: ἀπαγγέλλειν ἐνίοτε εἴωθεν
  choice: порой подсказывает ему
  rationale: Буквально оборот означает «иногда имеет обыкновение сообщать». Русское «подсказывает» естественно выражает внутреннее свидетельство, а местоимение «ему» проясняет подразумеваемого адресата, не меняя смысла.
- source_word: ἢ ἑπτὰ σκοποί
  choice: лучше, чем семь дозорных
  rationale: 'Сравнительное «лучше» восполняет подразумеваемое основание сравнения: внутреннее чувство может дать человеку более надёжное указание, чем множество наблюдателей.'
- source_word: ἐπὶ μετεώρου καθήμενοι ἐπὶ σκοπῆς
  choice: сидящих на высокой наблюдательной башне
  rationale: Передаёт образ дозорных, размещённых на возвышенном сторожевом пункте; «наблюдательная башня» звучит по-русски яснее буквального «на высоте, на страже».
theological_decisions:
- issue: Расхождение между указанным еврейским текстом, приведённой греческой параллелью и английским консультационным слоем
  choice: Основной текст переводит непосредственно приведённую греческую параллель и отмечает расхождение в сноске.
  alternative: Следовать английскому тексту о молитве Всевышнему либо переводить несвязный еврейский фрагмент.
  rationale: Приведённый греческий текст не содержит призыва молиться Всевышнему, а говорит о душе человека и семи дозорных. Поскольку перевод должен исходить прежде всего из реально предоставленных оригинальных свидетельств, недопустимо приписывать этому греческому тексту отсутствующие в нём слова. Еврейская строка также явно не соответствует данному месту и контексту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской книги мудрости. Формулировка ясна обычному читателю; образ дозорных сохранён, а текстологическая неопределённость не скрыта.
