translation:
  language: ru
  text: Не советуйся с женщиной о её сопернице и с трусом — о его войне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст этого места труден и резко отличается от греческого, где сказано приблизительно: «тот, чья душа созвучна твоей, и кто, если ты оступишься, будет скорбеть вместе с тобой», — то есть о близком по духу друге, разделяющем твою боль. Значение еврейского слова, переведённого как «трус», неясно; возможны также варианты «мятежник», «тот, кто отступает», или «дезертир».'
    reason: textual_variant
lexical_decisions:
- source_word: עִם
  choice: не советуйся с
  rationale: Предлог означает «с», а глагольный смысл и отрицание восполняются из контекста перечня людей, у которых не следует искать совета. Такое восполнение делает русский текст понятным и не превращает предостережение в рекомендацию.
- source_word: אִשָּׁה
  choice: женщиной
  rationale: Обычное значение — «женщина» или «жена»; отсутствие притяжательного уточнения не позволяет уверенно выбрать более узкое «жена».
- source_word: צָרָהּ
  choice: её сопернице
  rationale: Слово может обозначать соперницу, в том числе другую жену, а также противницу. «Соперница» сохраняет широкий личный смысл, не сужая его до «второй жены».
- source_word: מָרֵד
  choice: трусом
  rationale: Чтение и значение трудны. В сочетании с «его войной» слово, вероятно, обозначает ненадёжного в бою человека — того, кто отступает, уклоняется или дезертирует. «Трус» естественно передаёт этот смысл, а неопределённость отмечена в сноске.
- source_word: מִלְחַמְתּוֹ
  choice: о его войне
  rationale: Существительное означает «война, сражение» и имеет притяжательный суффикс «его». Формулировка сохраняет этот элемент еврейского текста.
theological_decisions:
- issue: Резкое расхождение сохранившегося еврейского текста с греческим свидетельством
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству, а существенно иное греческое чтение приведено в сноске.
  alternative: 'Следовать греческому тексту: «тому, чья душа сродни твоей душе и кто, если ты оступишься, будет скорбеть вместе с тобой».'
  rationale: При наличии еврейского текста он служит основой перевода, однако греческое чтение представляет не мелкий вариант, а, вероятно, совершенно иную строку; поэтому различие нельзя скрывать или согласовывать искусственно.
translation_notes:
  register: Современный литературный русский язык, краткий и назидательный. Отрицательная форма восполняет эллипсис по контексту перечня неподходящих советчиков; тире передаёт естественное русское членение второй параллельной части.
