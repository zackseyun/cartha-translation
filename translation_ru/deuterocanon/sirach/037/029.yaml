base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/029.yaml
  text: A man's life is a numbered span of days, but the life of the people of Israel is days without number.
translation:
  language: ru
  text: Жизнь человека — число дней, а[a] жизнь народа Израиля — дни без числа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и жизнь народа Израиля». Еврейский союз может означать простое «и», хотя параллелизм здесь выражает противопоставление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֵּי אִישׁ
  choice: Жизнь человека
  rationale: Передаёт родовое единственное число без ненужного сужения до конкретного мужчины; по-русски звучит естественно и достойно.
- source_word: מִסְפַּר יָמִים
  choice: определённое число дней
  rationale: Сохраняет прямой образ исчислимого, конечного срока жизни и избегает русского оборота «считаные дни», который может подразумевать близкую смерть.
- source_word: וְחַיֵּי עַם יִשְׂרָאֵל
  choice: а жизнь народа Израиля
  rationale: Союз «а» естественно выражает заложенное параллелизмом противопоставление, не превращая его в чрезмерно резкое «но».
- source_word: עַם יִשְׂרָאֵל
  choice: народ Израиля
  rationale: Прямо сохраняет коллективное значение еврейского выражения и не сводит его лишь к имени «Израиль».
- source_word: יְמֵי אֵין מִסְפָּר
  choice: дни без числа
  rationale: Близко воспроизводит еврейскую идиому и поддерживает словесный контраст с «числом дней» в первой части.
theological_decisions:
- issue: Противопоставление смертности отдельного человека и продолжительности жизни Израиля как народа
  choice: Сохранено сильное противопоставление конечного числа дней человека и дней без числа у народа Израиля.
  alternative: Понять вторую часть лишь как указание на очень долгую историю Израиля.
  rationale: Еврейский параллелизм подчёркивает контраст между исчислимым и не имеющим числа, однако перевод не разворачивает этот образ в дополнительное догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с лаконичным, афористичным строем. Синтаксический параллелизм и повтор слова «дни» сохранены; избегнут оборот «считаные дни» из-за его дополнительного значения близкой смерти.
