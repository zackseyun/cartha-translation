lexical_decisions:
- source_word: מרע אוהב
  choice: дурной друг
  rationale: Сочетание обозначает человека, который оказывается плохим или ненадёжным именно как друг. «Дурной друг» естественно по-русски и сохраняет нравственную оценку без чрезмерного уточнения.
- source_word: מביט אל שלחן
  choice: смотрит на стол
  rationale: Сохранён конкретный образ стола и буквальное направление взгляда; в контексте подразумевается интерес к угощению или выгодам общения, что пояснено в сноске.
- source_word: בעת מצוקה
  choice: в час беды
  rationale: מצוקה означает бедствие, тесноту, тяжёлое положение. «В час беды» — ясное и достойное русское выражение, передающее временную конструкцию.
- source_word: מנגד יעמד
  choice: встанет напротив
  rationale: Передаёт пространственно неоднозначное מנגד и согласуется с греческим ἀπέναντι. Формулировка не решает молча, означает ли это отстранённость или активное противостояние.
theological_decisions:
- issue: Характер поведения ложного друга в беде
  choice: сохранить образ «встанет напротив»
  alternative: «останется в стороне» или «выступит против тебя»
  rationale: Еврейский и греческий тексты допускают спектр от отсутствия поддержки до противостояния; основной текст сохраняет эту напряжённую неоднозначность, а сноска объясняет её.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура сохранена. Конкретный образ стола оставлен в основном тексте, а неоднозначность заключительного оборота не устранена толкованием.
