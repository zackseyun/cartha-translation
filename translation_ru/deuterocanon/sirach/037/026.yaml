  text: There is a wise man who is despised for his words[a], and he is deprived of every pleasant food.
translation:
  language: ru
  text: Бывает мудрец, которого презирают за его слова[a], и всякая приятная пища ему недоступна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «Мудрец среди своего народа унаследует доверие, и имя его будет жить вовеки». Еврейский и греческий тексты здесь существенно различаются.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵשׁ
  choice: Бывает
  rationale: Естественно передаёт бытийное начало и вместе с тем обобщённый характер высказывания; начальный союз не нуждается в отдельном выражении по-русски.
- source_word: חָכָם
  choice: мудрец
  rationale: Краткое и литературно естественное обозначение мудрого человека, соответствующее существительному мужского рода в единственном числе.
- source_word: בִּדְבָרוֹ
  choice: за его слова
  rationale: 'Предлог ב здесь понимается причинно: мудреца презирают из-за того, что он говорит. Множественное «слова» естественно передаёт собирательный смысл единственного דָּבָר.'
- source_word: נִמְאָס
  choice: которого презирают
  rationale: Передаёт страдательное значение нифаля от מאס и социальную оценку человека; придаточная конструкция звучит естественнее буквального «презираемый».
- source_word: וּמִכָּל מַאֲכָל תַּעֲנוּג
  choice: всякая приятная пища
  rationale: Сохраняет конкретный образ пищи, доставляющей удовольствие, без сужения значения до одних лишь деликатесов.
- source_word: נִבְצָר
  choice: ему недоступна
  rationale: В сочетании с מן форма указывает на лишённость или недоступность; выбранный вариант ясно передаёт результат, не уточняя без основания, кто именно лишает его пищи.
- source_word: ὁ σοφὸς ἐν τῷ λαῷ αὐτοῦ κληρονομήσει πίστιν, καὶ τὸ ὄνομα αὐτοῦ ζήσεται εἰς τὸν αἰῶνα
  choice: учтено как существенно отличающееся греческое чтение, но не принято в основной текст
  rationale: Сохранившийся еврейский текст положен в основу перевода; самостоятельное греческое чтение приведено в сноске как важное свидетельство иной текстовой традиции.
theological_decisions:
- issue: Существенное расхождение еврейской и греческой традиций в Сир 37:26
  choice: Основной текст переведён по сохранившемуся еврейскому свидетельству.
  alternative: «Мудрец среди своего народа унаследует доверие, и имя его будет жить вовеки».
  rationale: Еврейское свидетельство здесь сохранно и потому служит основой; греческий текст выражает совершенно другую мысль, которую нельзя молча смешивать с еврейской, поэтому он полностью представлен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством афористической мудрой речи. Формулировка остаётся ясной для обычного читателя; синтаксис слегка сглажен по-русски без устранения необычной связи между презрением к словам мудреца и недоступностью приятной пищи.
