  text: But a man is always fearful[a]; whom you know keeps the commandment.
translation:
  language: ru
  text: Начало всякого дела — слово, и перед всяким действием — совет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сохранившийся еврейский текст из Каирской генизы здесь читается совсем иначе, приблизительно: «Но человек всегда боится — тот, кого ты знаешь как соблюдающего заповедь». По-видимому, еврейское свидетельство в этом месте повреждено или нарушено; основной текст переведён по связному греческому чтению.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀρχὴ / אך
  choice: начало
  rationale: Сохранившийся еврейский текст этого стиха существенно расходится с контекстуально связным греческим свидетельством и, по-видимому, повреждён. В основном тексте принято греческое ἀρχή — «начало».
- source_word: παντὸς ἔργου
  choice: всякого дела
  rationale: Ἔργον обозначает дело, труд или деяние; «всякого дела» естественно передаёт обобщённую форму изречения.
- source_word: λόγος
  choice: слово
  rationale: Λόγος может означать слово, речь, рассуждение или замысел. «Слово» близко к форме источника и сохраняет ёмкость афоризма, не сводя значение исключительно к планированию.
- source_word: πρὸ πάσης πράξεως
  choice: перед всяким действием
  rationale: Πρό выражает предшествование, а πρᾶξις — действие или поступок. «Действием» сохраняет отличие от ἔργον, переданного как «дело».
- source_word: βουλή
  choice: совет
  rationale: Βουλή охватывает значения совета, обдумывания и продуманного решения. «Совет» краток, естественен для литературы мудрости и не устраняет смысловую широту слова.
theological_decisions:
- issue: Расхождение сохранившегося еврейского текста и греческого параллельного свидетельства
  choice: Основной текст переведён по связному греческому чтению; еврейское чтение приведено в примечании.
  alternative: 'Перевести сохранившийся еврейский текст приблизительно так: «Но человек всегда боится — тот, кого ты знаешь как соблюдающего заповедь».'
  rationale: Предоставленный еврейский текст синтаксически возможен лишь с трудом, резко расходится с греческим и отмечен как major_mismatch. Греческий текст образует ясное изречение и служит здесь реальным источником для восстановления стиха; примечание сохраняет прозрачность относительно еврейского свидетельства.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная форма изречения. Параллелизм сохранён посредством конструкций «всякого дела» и «перед всяким действием», а тире подчёркивают афористическое строение.
