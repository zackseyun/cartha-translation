base_translation:
  language: en
  yaml_path: translation/deuterocanon/sirach/037/011.yaml
  text: He will speak to you of the good of your way[a], and then stand opposite to watch your downfall.
translation:
  language: ru
  text: Он будет говорить тебе, что твой путь хорош, а потом встанет напротив, чтобы смотреть на твою беду[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь краток и не вполне ясен. Последнее слово можно также перевести: «несчастье» или «нищета». В греческом параллельном тексте вместо этого краткого изречения содержится более пространное предостережение о людях, на чей совет не следует полагаться.'
    reason: alternative_reading
lexical_decisions:
- source_word: ואמר לך
  choice: Он будет говорить тебе
  rationale: Обычное значение אמר — «говорить, сказать»; будущее время и личное обращение сохранены.
- source_word: מטוב דרכך
  choice: что путь твой хорош
  rationale: Сжатая еврейская конструкция, вероятно, означает одобрительную речь о выбранном человеком пути. Русская формулировка передаёт оттенок лести и сохраняет образ пути.
- source_word: דרכך
  choice: путь твой
  rationale: דרך буквально и метафорически означает «путь»; этот образ естествен для русской литературы мудрости.
- source_word: וקם מנגד
  choice: а потом встанет напротив
  rationale: מנגד обозначает положение напротив или поодаль перед кем-либо. Союз «а» естественно выражает контекстуальный контраст, не превращая его в явно враждебное действие.
- source_word: להביט
  choice: чтобы смотреть
  rationale: הביט означает направленно смотреть, наблюдать; «смотреть» не усиливает смысл сверх исходного текста.
- source_word: רישך
  choice: твою беду
  rationale: Трудная форма, вероятно связанная с нуждой, бедностью или несчастьем. «Беда» сохраняет широту возможного отрицательного смысла и не навязывает более конкретное «падение».
theological_decisions:
- issue: Соотношение сохранившегося еврейского текста и значительно более пространного греческого параллельного текста
  choice: Основной текст переведён с еврейского; греческий использован только как контекстуальное свидетельство.
  alternative: Перевести греческий перечень людей, на чей совет нельзя полагаться.
  rationale: Еврейское чтение здесь сохранилось и имеет высокую степень достоверности, хотя оно кратко и местами неясно. Поэтому его следует сохранить в основном тексте, а расхождение с греческим отметить в сноске.
- issue: Неоднозначность רישך
  choice: твою беду
  alternative: твою нищету; твоё несчастье; твоё падение
  rationale: Выбор «беду» передаёт общий смысл несчастья или нужды и не устраняет реальную лексическую неопределённость, которая раскрыта в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным книге Премудрости. Сохранён библейский образ «пути», но сжатая конструкция передана естественной русской фразой; инверсия «путь твой» поддерживает возвышенный, не архаичный регистр.
