  text: There is a wise man who is wise for many[b][a], but for himself he is worthless.
translation:
  language: ru
  text: Бывает мудрец, который мудр для многих[b], но для самого себя он бесполезен[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово גוֹאָל имеет неясное значение. Оно может указывать на осквернённость, запятнанность или непригодность; перевод «бесполезен» передаёт противопоставление в данном контексте.
    reason: lexical_alternative
  - marker: b
    text: 'В греческой традиции на этом месте находится иное изречение: «Жизнь человека исчисляется днями, а дни Израиля неисчислимы». Еврейский и греческий тексты здесь существенно расходятся.'
    reason: textual_variant
lexical_decisions:
- source_word: יֵשׁ
  choice: Бывает
  rationale: Экзистенциальная частица вводит общее наблюдение. «Бывает» естественно звучит в русском афористическом изречении.
- source_word: חָכָם
  choice: мудрец
  rationale: Существительное мужского рода обозначает представителя определённого типа; «мудрец» точно и лаконично передаёт это значение.
- source_word: לְרַבִּים
  choice: для многих
  rationale: 'Предлог לְ здесь выражает отношение или пользу: мудрость этого человека служит многим, без уточнения того, каким именно образом.'
- source_word: נֶחְכָּם
  choice: мудр
  rationale: Форма нифаля может означать, что человек оказывается или проявляет себя мудрым. В данном контексте простое «мудр» не навязывает идею постепенного приобретения мудрости и сохраняет параллелизм изречения.
- source_word: וּלְנַפְשׁוֹ
  choice: но для самого себя
  rationale: נֶפֶשׁ здесь относится к самому человеку, а не специально к его душе; усиленное «самого» ясно выражает противопоставление многим другим.
- source_word: גוֹאָל
  choice: бесполезен
  rationale: Трудное еврейское слово в контексте противопоставляет общественную мудрость личной несостоятельности. «Бесполезен» передаёт этот смысл, а лексическая неопределённость отмечена в сноске.
