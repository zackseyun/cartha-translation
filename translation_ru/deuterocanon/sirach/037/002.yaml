  text: Is there not grief that reaches to death[a], when a companion as your own soul turns into an enemy?
translation:
  language: ru
  text: Разве не бывает скорби, доходящей до смерти, когда друг, близкий тебе как собственная душа[a], становится врагом?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «друг, как твоя душа»; в греческой версии — «товарищ и друг».'
    reason: Сноска сохраняет буквальный образ еврейского текста и отмечает вариант греческой параллели.
lexical_decisions:
- source_word: הלא
  choice: Разве не бывает
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ; вопросительный характер подтверждается греческим οὐχί.
- source_word: דין
  choice: скорби
  rationale: В данном контексте слово обозначает душевное страдание, а не судебное решение; это значение подтверждает греческое λύπη.
- source_word: מגיע אל מות
  choice: доходящей до смерти
  rationale: Сохраняет еврейский образ скорби, достигающей предела смерти, не уточняя без необходимости, идёт ли речь о смертельной силе скорби или о её продолжительности.
- source_word: רע כנפשך
  choice: друг, близкий тебе как собственная душа
  rationale: רע здесь обозначает близкого друга или товарища, а כנפשך буквально выражает близость «как твоя душа». Русская формулировка передаёт эту глубокую личную связь естественно и сохраняет образ оригинала.
- source_word: נהפך לצר
  choice: становится врагом
  rationale: Передаёт резкий поворот прежнего друга к вражде; соответствует и греческой параллели τρεπόμενος εἰς ἔχθραν.
