  text: And with all these things[a], pray earnestly to God, who will truly direct your steps.
translation:
  language: ru
  text: И при всём этом усердно молись Богу, который верно направит твои шаги.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом свидетельстве: «Ибо не дана ему благодать от Господа, потому что он лишён всякой мудрости». Еврейский и греческий тексты здесь существенно различаются; основной текст следует сохранившемуся еврейскому свидетельству.'
    reason: textual_variant
lexical_decisions:
- source_word: ועם כל אלה
  choice: И при всём этом
  rationale: 'Передаёт добавочную и связующую силу оборота: молитва должна сопровождать всё сказанное ранее. Формулировка естественна для современного русского языка.'
- source_word: עתר
  choice: усердно молись
  rationale: Глагол обозначает настойчивое, искреннее моление, а не просто нейтральное обращение; наречие сохраняет интенсивность.
- source_word: אל אל
  choice: Богу
  rationale: Первое אל является предлогом «к», второе — обозначением Бога. По-русски предложное управление глагола «молиться» естественно передаётся дательным падежом.
- source_word: אשר
  choice: который
  rationale: Личное относительное местоимение ясно относит последующее действие к Богу.
- source_word: יכין
  choice: направит
  rationale: В сочетании с «шагами» глагол буквально выражает утверждение, устроение или упрочение пути; «направит» естественно передаёт контекстуальный смысл Божьего водительства, не устраняя образ шагов.
- source_word: באמת
  choice: верно
  rationale: Наречие может указывать на истинность, надёжность или верность действия. «Верно» сохраняет эту смысловую широту лучше, чем усилительное «действительно».
- source_word: צעדיך
  choice: твои шаги
  rationale: Сохранена понятная библейская метафора жизненного пути и непосредственный образ еврейского текста.
theological_decisions:
- issue: Соотношение еврейского и греческого свидетельств
  choice: 'Основной текст следует сохранившемуся еврейскому чтению: призыву к молитве и обещанию Божьего направления.'
  alternative: 'Греческое свидетельство: «Ибо не дана ему благодать от Господа, потому что он лишён всякой мудрости».'
  rationale: Еврейский текст для этой строки засвидетельствован с высокой уверенностью и является основным источником. Греческий содержит существенно иной текст, поэтому различие нельзя сводить к обычному лексическому варианту; оно открыто отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; тон краткий, наставительный и достойный. Сохранена метафора шагов, а конструкция с молитвой сделана естественной для обычного читателя.
