lexical_decisions:
- source_word: כל יועץ
  choice: Всякий советчик
  rationale: Передаёт обобщённо-дистрибутивный смысл כל и сохраняет характерный для литературы мудрости образ человека, дающего совет.
- source_word: יניף יד
  choice: взмахивает рукой
  rationale: Сохраняет несколько неясный, но выразительный еврейский образ буквального поднятия или движения руки; вероятный смысл — готовность выступить с советом — поясняется в сноске.
- source_word: אך יש יועץ
  choice: но бывает советчик
  rationale: Естественно по-русски выражает контраст אך и экзистенциальную конструкцию יש, переходя от общего наблюдения к предостережению.
- source_word: דרך אל לץ
  choice: который советует ради себя
  rationale: Конец имеющегося еврейского текста труден и, вероятно, повреждён; греческое εἰς αὐτόν ясно указывает на совет в собственных интересах. Формулировка сохраняет связь с контекстом и не маскирует текстологическую проблему, отмеченную в сноске.
