  text: A man's heart tells of his thoughts[b][a], more than seven watchmen on a lookout.
translation:
  language: ru
  text: Сердце человека расскажет о его тревогах[a] лучше, чем семь стражей на наблюдательном посту.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово שעיותיו имеет неясное значение; возможны переводы: «его заботах», «его переживаниях» или «его мыслях». Греческий текст здесь существенно отличается: в нём говорится о человеке, искусном в речах, но ненавистном и лишённом всякой пищи.'
    reason: textual_variant
lexical_decisions:
- source_word: לב
  choice: сердце
  rationale: Сохраняет древнееврейский образ внутреннего человека — средоточия мысли, чувства и воли — и естественно звучит по-русски.
- source_word: אנוש
  choice: человека
  rationale: Обозначает отдельного человека и здесь употреблено обобщённо; русское «человека» передаёт это без неоправданного сужения до мужчины.
- source_word: יגיד
  choice: расскажет
  rationale: Порода hифиль от נגד означает «сообщать, объявлять, давать знать»; «расскажет о» естественно сочетается с внутренними тревогами.
- source_word: שעיותיו
  choice: о его тревогах
  rationale: Форма неясна; вероятно, речь идёт о тревогах, заботах или внутренних переживаниях. «Тревогах» сохраняет психологический смысл, не выдавая спорное значение за вполне определённое.
- source_word: משבעה
  choice: лучше, чем семь
  rationale: Сравнительное מן указывает на превосходство. В контексте того, насколько верно сердце обнаруживает внутреннее состояние, по-русски естественнее «лучше, чем».
- source_word: צופים
  choice: стражей
  rationale: Причастие от צפה обозначает тех, кто наблюдает и несёт дозор; «стражи» ясно передаёт этот образ современному читателю.
- source_word: על מצפה
  choice: на наблюдательном посту
  rationale: מצפה — место наблюдения или дозорный пункт; перевод не сужает значение до башни, которой в тексте прямо не названо.
