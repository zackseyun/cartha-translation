translation:
  language: ru
  text: 'Ведь и он будет строить расчёты на твой счёт: «Почему это должно выпасть ему?»[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь краток и труден. Выражение, переданное словами «строить расчёты на твой счёт», буквально содержит «для твоей души (жизни)» и может означать расчёт, касающийся самого адресата. В греческом тексте: «Не советуйся с тем, кто смотрит на тебя косо, и скрой свой замысел от тех, кто тебе завидует». Это поддерживает понимание, что советчик действует с недоброжелательным или своекорыстным расчётом.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «Ведь и он будет думать о себе: „Почему это должно случиться с ним?“» Еврейская формулировка не позволяет с полной уверенностью определить, относится ли последнее «ему» к самому советчику или к другому человеку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כי
  choice: Ведь
  rationale: Союз вводит основание для предшествующего предостережения; «ведь» естественно передаёт пояснительную силу в русском изречении.
- source_word: גם הוא
  choice: и он
  rationale: 'Сохраняет добавочное значение: этот человек тоже принимает в расчёт собственные интересы.'
- source_word: לנפשך
  choice: о собственной выгоде
  rationale: Переданный еврейский текст буквально труден («для твоей души/жизни»). С учётом контекста и греческого параллельного текста выражение понято как указание на своекорыстный расчёт; неясность отмечена в сноске.
- source_word: יחשב
  choice: будет думать
  rationale: Глагол обозначает обдумывание или расчёт. Нейтральное «будет думать» ясно современному читателю, а дополнение раскрывает подразумеваемую заинтересованность.
- source_word: למה זה
  choice: почему это должно
  rationale: Естественно передаёт краткий риторический вопрос, не превращая его в категорическое утверждение.
- source_word: אליו יפול
  choice: достаться ему
  rationale: Передаёт образ того, что выпадает кому-либо на долю. Русское «достаться» сохраняет возможность понимать речь о выгоде или уделе; отнесение местоимения остаётся неоднозначным и поясняется в сноске.
