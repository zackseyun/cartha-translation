lexical_decisions:
- source_word: עקרת תחבולות לבב
  choice: '[не положено в основу основного текста]'
  rationale: Сохранившийся еврейский текст крайне труден и не даёт уверенного связного смысла. Поэтому основной текст следует ясному греческому параллельному свидетельству, а еврейское чтение приводится в примечании.
- source_word: ἀνὴρ σοφός
  choice: мудрый человек
  rationale: Передаёт явно выраженное в греческом тексте существительное мужского рода, сохраняя при этом естественное современное русское выражение.
- source_word: τὸν ἑαυτοῦ λαόν
  choice: свой народ
  rationale: «Народ» естественно передаёт λαός, а возвратное «свой» точно и кратко отражает ἑαυτοῦ.
- source_word: παιδεύσει
  choice: наставит
  rationale: Сохранено будущее время греческой формы; «наставит» передаёт образовательный смысл παιδεύω без излишнего оттенка наказания.
- source_word: οἱ καρποὶ
  choice: плоды
  rationale: Сохранены множественное число и метафора греческого текста.
- source_word: τῆς συνέσεως αὐτοῦ
  choice: его разумения
  rationale: «Разумение» передаёт способность понимать и рассуждать, соответствующую σύνεσις, и уместно в литературном языке мудрости.
- source_word: πιστοί
  choice: достойны доверия
  rationale: В данном контексте слово характеризует плоды мудрости как надёжные; это выражение естественнее по-русски, чем буквальное «верны» применительно к плодам.
