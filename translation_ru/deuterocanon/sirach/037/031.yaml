  source_fidelity: 'Еврейский текст в целом передан верно: חכם, ינחל כבוד и שמו עומד отражены точно. Однако в עם отсутствует притяжательный суффикс; «своего народа» добавляет значение, которого в представленном еврейском тексте нет. Заключительное «в жизни вечной» формально близко, но в русском языке слишком прямо связывает «имя» с состоянием вечной жизни и тем самым сужает неоднозначный образ оригинала.'
