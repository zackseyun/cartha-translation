translation:
  language: ru
  text: Мудрец среди народа унаследует почёт, и имя его будет жить вечно.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «имя его пребудет навеки». Буквально по-еврейски: «имя его стоит в жизни вечности». Выражение может означать неувядающую память, но может также иметь оттенок вечной жизни.'
    reason: lexical_alternative
  - marker: b
    text: 'Греческий параллельный текст существенно отличается: «Из-за ненасытности многие умерли, а внимательный продлит жизнь». Основной перевод следует сохранившемуся еврейскому тексту.'
    reason: alternative_reading
lexical_decisions:
- source_word: חכם
  choice: мудрец
  rationale: Субстантивированное прилагательное обозначает мудрого человека; «мудрец» естественно и точно передаёт единственное число и смысл слова.
- source_word: עם
  choice: среди своего народа
  rationale: Предлог עם здесь передаёт пребывание в среде народа или общины; притяжательное «своего» ясно выражает социальную соотнесённость мудреца с его народом.
- source_word: ינחל
  choice: унаследует
  rationale: Глагол נחל означает «наследовать, получить во владение»; перевод сохраняет конкретную метафору почёта как наследственного достояния.
- source_word: כבוד
  choice: почёт
  rationale: В контексте литературы мудрости речь прежде всего об общественном уважении; «почёт» естественнее передаёт это значение, чем более широкая «слава».
- source_word: שמו
  choice: имя его
  rationale: Буквальный перевод сохраняет характерный для литературы мудрости образ имени как репутации и памяти о человеке.
- source_word: עומד
  choice: пребудет
  rationale: Причастие буквально значит «стоит, остаётся»; «пребудет» передаёт устойчивость и продолжительность, сохраняя возвышенный, но понятный регистр.
- source_word: בחיי עולם
  choice: в жизни вечной
  rationale: Перевод сохраняет необычное буквальное сочетание жизненной и временной семантики — «в жизни вечности», не сводя его однозначно ни к вечной памяти, ни к личной вечной жизни.
theological_decisions:
- issue: Смысл выражения בחיי עולם
  choice: в жизни вечной
  alternative: навеки; во все времена; в вечной жизни
  rationale: Еврейское выражение допускает понимание как неувядающей памяти, но также может иметь оттенок вечной жизни. Основной текст сохраняет жизненную образность и богословскую напряжённость, а примечание обозначает неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром, уместным для премудростной книги. «Мудрец», «унаследует почёт» и «пребудет» сохраняют краткость и достоинство еврейской строки; необычность заключительного оборота намеренно сохранена и пояснена в сноске.
