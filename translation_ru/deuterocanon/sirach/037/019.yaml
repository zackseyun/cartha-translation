translation:
  language: ru
  text: 'Также есть совет разумного сердца: кто будет для тебя надёжнее его?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст читается совсем иначе: «Есть человек искусный и наставник многих, но для собственной души он бесполезен». Вероятно, он отражает иную еврейскую форму стиха или значительно отличающуюся текстовую традицию.'
    reason: alternative_reading
  - marker: b
    text: Еврейский текст краток и синтаксически труден. «Совет сердца» означает внутреннее размышление и распознавание. Неогласованную форму הבין можно также понять как побуждение «вникни, пойми» или как указание на понимающего человека; заключительное «его» может относиться к совету либо к такому человеку.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וגם
  choice: также
  rationale: Связывает изречение с предшествующим рассуждением и добавляет ещё одно наставление.
- source_word: עצת לבב
  choice: совет своего сердца
  rationale: Буквально «совет сердца»; выражение обозначает внутреннее рассуждение и распознавание. Возвратное «своего» естественно передаёт подразумеваемую отнесённость сердца к адресату.
- source_word: הבין
  choice: вникни
  rationale: Непунктованный текст допускает понимание формы как побуждения осмыслить или распознать. «Вникни» естественно сочетается с «советом» и не сводит внутреннее распознавание к простому чувству.
- source_word: מי יאמן לך
  choice: кому ты можешь доверять
  rationale: Пассивную еврейскую конструкцию «кто будет надёжен/кому поверят для тебя» по-русски естественно передаёт активный вопрос о доверии, сохраняя второе лицо.
- source_word: אמן ממנו
  choice: больше, чем ему
  rationale: Передаёт сравнительный смысл трудной эллиптической концовки; местоимение соотносится с сердцем и сохраняет риторический вопрос без добавочного объяснения в основном тексте.
theological_decisions:
- issue: Отношение внутреннего совета сердца к мудрости
  choice: Сохранить положительное наставление вникнуть в совет сердца
  alternative: Представить «понимающего человека», доверяющего собственному разумению
  rationale: Синтаксис непунктованного еврейского текста естественно позволяет прочитать הבין как побуждение, а עצת לבב — как его дополнение. Перевод не превращает сердце ни в безошибочный божественный голос, ни в нечто заведомо ненадёжное.
- issue: Резкое расхождение еврейского и греческого свидетелей
  choice: Основной текст перевести по сохранившемуся еврейскому, греческий вариант привести в примечании
  alternative: 'Следовать греческому: «Есть человек искусный и наставник многих, но для собственной души бесполезный»'
  rationale: При наличии еврейского свидетеля он имеет первенство; греческий здесь, вероятно, отражает иной еврейский протограф или существенно отличающуюся текстовую традицию.
translation_notes:
  register: Современный литературный русский язык с назидательным, но не архаичным звучанием. Риторический вопрос и обращение во втором лице сохранены; «вникни» передаёт вдумчивое распознавание, не вводя конфессионально окрашенной терминологии.
