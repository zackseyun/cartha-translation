id: 1PE.3.9
reference: 1 Peter 3:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: ru
  text: Не воздавайте злом за зло или оскорблением за оскорбление[a], но, напротив[b], благословляйте, потому что вы к этому призваны[c], чтобы унаследовать благословение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злословием за злословие». Греческое слово обозначает бранную, унизительную или оскорбительную речь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но вместо этого». Греческое выражение подчёркивает резкий переход к прямо противоположному поведению.'
    reason: lexical_alternative
  - marker: c
    text: То есть призваны Богом отвечать на дурное обращение благословением, а не возмездием. Выражение «к этому» может также охватывать более широкий путь христианской жизни, включающий страдание и отказ от ответного зла.
    reason: cross_reference
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: не воздавайте
  rationale: Причастие с μή в контексте увещевания естественно передаётся по-русски повелительной формой; «воздавать» сохраняет смысл ответного действия и звучит достойно, но понятно.
- source_word: κακὸν ἀντὶ κακοῦ
  choice: злом за зло
  rationale: Устойчивая русская формула точно сохраняет нравственный вес κακόν и значение ответного возмездия у ἀντί.
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: оскорблением за оскорбление
  rationale: Передаёт словесную брань и унижение, сохраняя параллелизм исходного текста; вариант «злословием» возможен, но менее прозрачен в современной речи.
- source_word: τοὐναντίον δὲ
  choice: но, напротив
  rationale: Выражает подчёркнутый поворот к прямо противоположному поведению.
- source_word: εὐλογοῦντες
  choice: благословляйте
  rationale: 'Сохраняет ёмкость греческого глагола: говорить добро и призывать Божье благоволение; отсутствующий в оригинале объект не добавлен.'
- source_word: ὅτι
  choice: потому что
  rationale: Ясно передаёт причинную связь между призванием и данным увещеванием.
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: вы к этому призваны
  rationale: Сохраняет указательную неопределённость «к этому» и подразумеваемое Божье призвание, не вводя имени действующего лица в основной текст.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно выражает цель или задуманный результат, не устраняя присущую конструкции смысловую напряжённость.
- source_word: εὐλογίαν
  choice: благословение
  rationale: Повторяет корень предыдущего глагола, как и греческий текст, и может обозначать даруемое Богом благо.
- source_word: κληρονομήσητε
  choice: унаследовать
  rationale: Сохраняет образ получения удела как наследниками, а не просто нейтрального получения.
theological_decisions:
- issue: К чему относится «к этому» в εἰς τοῦτο ἐκλήθητε
  choice: Формулировка оставлена открытой, но ближайшим образом указывает на благословение вместо возмездия.
  alternative: Отнести призвание шире ко всей христианской жизни, включающей страдание и отказ от возмездия.
  rationale: Ближайший контекст поддерживает связь с предшествующим увещеванием, однако указательное местоимение не следует искусственно сужать пояснением в основном тексте.
- issue: Связь призвания и наследования благословения
  choice: Сохранена целевая конструкция «призваны... чтобы унаследовать».
  alternative: 'Передать ἵνα преимущественно как результат: «и потому унаследуете».'
  rationale: «Чтобы» сохраняет грамматическую целевую направленность и не превращает высказывание в безусловное причинно-следственное обещание.
translation_notes:
  register: Современный литературный русский язык с кратким, увещевательным ритмом. Устойчивое «злом за зло» сочетается с прозрачным «оскорблением за оскорбление». Повелительные формы естественно раскрывают паранетическую функцию греческих причастий. Повтор «благословляйте — благословение» намеренно сохраняет лексическую связь оригинала.
