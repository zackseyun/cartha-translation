  source_fidelity: 'Русский текст точно передаёт греческий параллелизм μή ἀποδιδόντες ... ἢ ...: запрет отвечать злом на зло и оскорблением на оскорбление. «Но, напротив» адекватно выражает сильный контраст τοὐναντίον δέ; «благословляйте» корректно передаёт εὐλογοῦντες без внесения отсутствующего объекта. «Вы к этому призваны, чтобы унаследовать благословение» сохраняет причинную связь ὅτι, неуточнённый референт εἰς τοῦτο и целевую конструкцию ἵνα ... κληρονομήσητε.'
