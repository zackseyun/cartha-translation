reference: 1 Peter 3:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ ⸂πραέως καὶ ἡσυχίου⸃ πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/004.yaml
  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: ru
  text: но сокровенный человек сердца[a] — в нетленной красоте[b] кроткого и спокойного духа[c]. Это весьма драгоценно в глазах Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокровенный внутренний человек». Греческое слово ἄνθρωπος означает здесь человека как личность, а не мужчину; всё выражение относится к внутреннему человеку.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в нетленном». Слово «красота» восполнено по смыслу из противопоставления внешнему украшению в предыдущем стихе.'
    reason: lexical_alternative
  - marker: c
    text: «Спокойный» означает мирный, невозмутимый; речь не обязательно идёт о молчании.
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: сокровенный человек сердца
  rationale: 'Так сохраняются образность и синтаксическая сжатость греческого выражения: речь идёт о скрытом от внешнего взгляда внутреннем человеке. Слово «человек» здесь не указывает на мужской пол.'
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: в нетленной красоте
  rationale: Субстантивированное прилагательное в греческом тексте эллиптично. Слово «красота» восполняет подразумеваемое понятие из противопоставления внешнему украшению в предыдущем стихе; «нетленная» точно передаёт ἄφθαρτος.
- source_word: πραέως
  choice: кроткого
  rationale: «Кроткий» — естественное и устойчивое русское соответствие, выражающее мягкость и отсутствие агрессивной напористости, а не слабость.
- source_word: ἡσυχίου
  choice: спокойного
  rationale: В данном контексте слово обозначает мирное, невозмутимое состояние духа. «Спокойный» позволяет не создавать впечатления, будто речь обязательно идёт о молчании.
- source_word: πνεύματος
  choice: духа
  rationale: Прямое соответствие сохраняет антропологический язык текста; более пояснительные варианты вроде «нрава» чрезмерно сужают значение.
- source_word: ὅ ἐστιν
  choice: Это
  rationale: Греческое местоимение среднего рода указывает на предшествующую нетленную внутреннюю красоту как целое. Отдельное предложение естественно передаёт эту связь по-русски.
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: перед Богом
  rationale: Краткое и точное выражение оценки с точки зрения Бога.
- source_word: πολυτελές
  choice: весьма драгоценно
  rationale: Передаёт значение большой ценности и поддерживает контраст с дорогостоящими внешними украшениями.
theological_decisions:
- issue: Антропологическое выражение в обращении к женщинам
  choice: Сохранить «человек» в выражении «сокровенный человек сердца», понимая его родово, а не как указание на мужчину.
  alternative: внутреннее «я»; сокровенная сущность
  rationale: ἄνθρωπος здесь обозначает человеческую личность, а не мужской пол. «Человек» сохраняет исходную антропологическую метафору, тогда как «я» или «сущность» сильнее истолковывают её.
- issue: Восполнение подразумеваемого существительного при ἐν τῷ ἀφθάρτῳ
  choice: 'Добавить «красоте»: «в нетленной красоте».'
  alternative: в нетленности; в нетленном свойстве
  rationale: Греческая конструкция эллиптична. Контраст с внешним украшением в стихе 3 делает «красоту» контекстуально обоснованным восполнением, но это отмечено в сноске, чтобы не скрывать буквальную форму текста.
- issue: Референт относительного местоимения ὅ
  choice: Передать отдельным «Это», относя оценку к нетленной красоте кроткого и спокойного духа в целом.
  alternative: который весьма драгоценен перед Богом
  rationale: Форма ὅ среднего рода не согласуется непосредственно с πνεύματος; вероятнее, она подводит итог всему предшествующему качеству. Русское «Это» сохраняет такую широкую отсылку.
translation_notes:
  register: 'Современный литературный русский язык с сохранением достоинства и образной сжатости оригинала. Выражение «сокровенный человек сердца» намеренно несколько необычно: оно сохраняет исходную метафору, а сноска разъясняет её. Тире отмечает эллиптическую конструкцию и связь с предыдущим стихом.'
