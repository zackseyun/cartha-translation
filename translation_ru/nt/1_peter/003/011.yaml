  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: ru
  text: Пусть же он отвернётся от зла и творит добро[a]; пусть ищет мира и стремится к нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть человек отвернётся от зла и творит добро; пусть ищет мира и стремится к нему». В греческом тексте употреблены формы повелительного наклонения третьего лица единственного числа; в данном контексте они имеют обобщающее значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: пусть … отвернётся
  rationale: 'Передаёт повелительное значение третьего лица и направленность действия: необходимо отойти, отвернуться от зла.'
- source_word: δὲ
  choice: же
  rationale: Частица мягко связывает эту строку с предыдущей и в данном контексте естественнее передаёт продолжение с оттенком противопоставления, чем резкое «но».
- source_word: ἀπὸ κακοῦ
  choice: от зла
  rationale: Речь идёт о нравственном зле, противопоставленном добру; краткое выражение сохраняет широту греческого текста.
- source_word: ποιησάτω ἀγαθόν
  choice: делает добро
  rationale: Естественное русское этическое выражение, передающее деятельный характер добра. Несовершенный вид по-русски указывает на устойчивое поведение и избегает неестественного «пусть сделает добро».
- source_word: ζητησάτω
  choice: пусть ищет
  rationale: «Искать» сохраняет отличие от последующего более сильного διώκω и риторическое нарастание.
- source_word: εἰρήνην
  choice: мира
  rationale: '«Мир» сохраняет широкий библейский смысл: отсутствие вражды, согласие и благополучие отношений.'
- source_word: διωξάτω αὐτήν
  choice: и стремится к нему
  rationale: В этом контексте διώκω означает настойчиво добиваться мира. «Стремится к нему» естественно по-русски и сохраняет усиление после «ищет».
- source_word: ἐκκλινάτω … ποιησάτω … ζητησάτω … διωξάτω
  choice: пусть он …; пусть …
  rationale: Конструкция с «пусть» передаёт повелительные формы третьего лица единственного числа, не превращая цитату в прямое обращение во втором лице.
theological_decisions:
- issue: Обобщающее значение мужского рода в повелительных формах единственного числа
  choice: Сохранить в основном тексте «пусть … он», понимая это как обобщённое обозначение человека.
  alternative: '«Пусть человек…» или прямое обращение: «уклоняйся…»'
  rationale: Греческие формы стоят в третьем лице единственного числа и в контексте цитаты имеют представительное, а не исключительно мужское значение. Сноска поясняет это, не меняя грамматический облик основного текста.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской поэзии. «Пусть же» поддерживает связь с предыдущей строкой; пара «ищет… стремится» сохраняет смысловое нарастание. Видовые формы выбраны по нормам русского языка: «отвернётся» подчёркивает решительный поворот, а «делает», «ищет», «стремится» — продолжающийся образ жизни.'
