  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: ru
  text: Ибо очи Господа обращены к праведным, и уши Его — к их мольбе[a]; но лик Господа — против тех, кто делает зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «уши Его — к их мольбе»; то есть Господь внимает их мольбе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание для предшествующего наставления; русское «потому что» естественно передаёт причинную связь.
- source_word: ὀφθαλμοὶ κυρίου
  choice: очи Господа
  rationale: Сохраняет антропоморфный образ и возвышенную библейскую окраску цитаты, оставаясь понятным современному читателю.
- source_word: ἐπὶ δικαίους
  choice: обращены к праведным
  rationale: Передаёт направленность и благосклонное внимание; субстантивированное прилагательное сохранено как «праведные».
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: уши Его — к их мольбе
  rationale: Сохраняет эллиптический параллелизм оригинала, не добавляя прямо отсутствующего глагола «открыты»; «мольба» передаёт δέησις как настойчивое молитвенное прошение.
- source_word: πρόσωπον δὲ κυρίου
  choice: но лик Господа
  rationale: «Но» выражает контраст, а «лик» сохраняет образ πρόσωπον и согласуется с возвышенным регистром цитаты.
- source_word: ἐπὶ ποιοῦντας κακά
  choice: против тех, кто делает зло
  rationale: В отрицательном контексте ἐπί обозначает направленную враждебность; развёрнутый оборот сохраняет глагольный характер причастия.
theological_decisions:
- issue: Антропоморфные образы очей, ушей и лика Бога
  choice: Сохранить образы непосредственно
  alternative: 'Передать толковательно: «Господь наблюдает… слышит… противостоит…»'
  rationale: Образы намеренно унаследованы из псалма и выражают Божье благоволение, внимание и противодействие; их сохранение передаёт литературную и богословскую силу текста без утверждения телесности Бога.
- issue: Эллипсис в выражении об ушах Господа
  choice: 'Сохранить: «уши Его — к их мольбе»'
  alternative: 'Добавить толкование: «уши Его открыты к их молитве» или «Он слышит их молитву»'
  rationale: Оригинал буквально говорит о направленности ушей к мольбе. Эллиптическая русская конструкция понятна и не устраняет образную недосказанность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой («очи», «лик»), уместной для поэтической цитаты. Синтаксический параллелизм и антропоморфные образы оригинала сохранены.
