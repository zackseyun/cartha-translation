  text: And who will harm you if you become zealous for what is good?[a]
translation:
  language: ru
  text: И кто причинит вам вред, если вы станете ревнителями добра?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если будете ревностно стремиться к добру».'
    reason: Лексема ζηλωτής может обозначать как ревнителя, так и человека, горячо стремящегося к чему-либо; вариант раскрывает смысл естественным современным выражением.
lexical_decisions:
- source_word: Καὶ
  choice: И
  rationale: Нейтрально сохраняет связь с предшествующим наставлением.
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: кто причинит вам зло
  rationale: Передаёт субстантивированное причастие будущего времени и сохраняет риторический вопрос; выражение «причинит зло» естественно охватывает вред и дурное обращение.
- source_word: ἐὰν
  choice: если
  rationale: Обычная и точная передача условного союза с сослагательным наклонением.
- source_word: τοῦ ἀγαθοῦ
  choice: добра
  rationale: Субстантивированное прилагательное среднего рода обозначает то, что является добрым; родительный падеж естественно зависит от «ревнителями».
- source_word: ζηλωταὶ γένησθε
  choice: станете ревнителями
  rationale: Сохраняет именную конструкцию оригинала и значение становления в γένησθε, а также сильную направленность ζηλωταί к добру.
theological_decisions:
- issue: Смысл риторического вопроса в связи со страданием за праведность
  choice: Сохранён общий риторический вопрос без превращения его в абсолютное обещание отсутствия страданий.
  alternative: Передать как категорическое утверждение, что верующим никто не способен причинить подлинного вреда.
  rationale: Следующий стих прямо допускает страдание за праведность; поэтому перевод сохраняет напряжение контекста и не добавляет богословского разъяснения.
translation_notes:
  register: Современный литературный русский язык; риторическая форма и достоинство апостольского наставления сохранены. «Ревнителями добра» несколько возвышенно, но понятно и близко к структуре греческого текста; сноска предлагает более разговорно-прозрачную передачу.
