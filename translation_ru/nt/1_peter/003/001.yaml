revisions:
- from: Так же и вы, жёны, подчиняйтесь своим мужьям, чтобы даже те из них, кто не повинуется слову[a], без слова были приобретены благодаря поведению своих жён.
  to: Также и вы, жёны, подчиняйтесь своим мужьям, чтобы, даже если некоторые из них не повинуются слову[a], они могли быть приобретены без слова благодаря поведению своих жён.
  rationale: Исправлены русская временная форма и синтаксис целевой конструкции, чтобы передать κερδηθήσονται и ἵνα без изменения смысла. Уточнена орфография «Также» и слегка выровнено согласование в сноске; смысловой объём основного текста и его намеренная неоднозначность сохранены.
