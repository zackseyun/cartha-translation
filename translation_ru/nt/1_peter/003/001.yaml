id: 1PE.3.1
reference: 1 Peter 3:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: ru
  text: Также и вы, жёны, подчиняйтесь своим мужьям, чтобы, даже если некоторые из них не повинуются слову[a], они могли быть приобретены без слова благодаря поведению своих жён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не верят вести»; то есть отвергают провозглашённую евангельскую весть.'
    reason: Сохраняет возможный оттенок неверия в ἀπειθέω и поясняет, что «слово» в данном контексте означает евангельскую весть.
lexical_decisions:
- source_word: Ὁμοίως
  choice: Так же и вы
  rationale: Передаёт связь с предшествующими наставлениями и естественно вводит обращение к жёнам в современном русском языке.
- source_word: γυναῖκες
  choice: жёны
  rationale: Сочетание с τοῖς ἰδίοις ἀνδράσιν и семейный контекст требуют значения «жёны», а не общего «женщины».
- source_word: ὑποτασσόμεναι
  choice: подчиняйтесь
  rationale: Русская форма повеления естественно передаёт увещевательную силу причастия, не добавляя идеи безусловного послушания или неполноценности.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: своим мужьям
  rationale: Передаёт как супружеское значение ἀνήρ, так и уточнение ἴδιος — каждый своей супруге или своему супругу.
- source_word: ἵνα καὶ εἴ τινες
  choice: чтобы даже те из них, кто
  rationale: «Чтобы» сохраняет целевую направленность ἵνα, а «даже» — уступительный оттенок καὶ εἴ; «из них» естественно указывает на некоторых мужей.
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: не повинуется слову
  rationale: Сохраняет нравственно-волевой оттенок ἀπειθέω и библейское обозначение провозглашённой вести словом λόγος, не устраняя возможного смысла неверия.
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: благодаря поведению своих жён
  rationale: ἀναστροφή означает образ жизни или поведение; выбранная формулировка ясна и естественна, а «своих жён» выражает супружеское отношение.
- source_word: ἄνευ λόγου
  choice: без слова
  rationale: Сохраняет единственное число и намеренный словесный контраст с «словом» ранее в стихе; речь идёт об отсутствии словесного убеждения со стороны жён.
- source_word: κερδηθήσονται
  choice: были приобретены
  rationale: Сохраняет метафору κερδαίνω — «приобретать, выигрывать кого-либо» — и пассивную форму, не добавляя прямо не выраженного дополнения «для Бога».
theological_decisions:
- issue: Характер подчинения, выраженного ὑποτασσόμεναι
  choice: «подчиняйтесь» без усиления до абсолютного послушания
  alternative: «повинуйтесь» или «будьте покорны»
  rationale: В тексте употреблено ὑποτάσσω, а не более прямой глагол «слушаться». Перевод сохраняет семейно-реляционное наставление, но не вносит утверждений о неполноценности или неограниченной власти.
- issue: Соотношение неверия и неповиновения в ἀπειθοῦσιν τῷ λόγῳ
  choice: «не повинуется слову» с пояснением альтернативы в сноске
  alternative: «не верит вести»
  rationale: Греческое выражение допускает взаимосвязанные значения неверия и неповиновения. Основной текст сохраняет более буквальный нравственно-волевой оттенок, а сноска отмечает евангельский контекст.
- issue: Смысл κερδηθήσονται
  choice: сохранить метафору «были приобретены» без уточнения результата
  alternative: «были обращены» или «приобретены для Бога»
  rationale: Контекст подразумевает обращение неверующих мужей, однако греческий текст использует метафору приобретения и не называет прямо того, для кого они приобретены.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан ясным для обычного читателя; повтор «слову — без слова» намеренно сохранён как риторическая связь оригинала.
