    rationale: Русская форма прошедшего времени не соответствует будущему страдательному κερδηθήσονται. В придаточном цели уместно «могли быть приобретены», передающее ожидаемый результат без излишней категоричности.
  - severity: low
    issue: Орфография связующего наречия
    rationale: В данном значении («likewise») нормативнее и глаже «Также», а не раздельное «Так же».
