  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: ru
  text: Но даже если вам придётся пострадать за праведность, вы блаженны. И не бойтесь их страха[a], и не приходите в смятение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не бойтесь страха перед ними» или «не бойтесь того, чего боятся они». Греческое выражение «их страх» намеренно сохранено в основном тексте: оно перекликается с Ис 8:12 и допускает оба понимания.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ πάσχοιτε
  choice: Но даже если вам придётся пострадать
  rationale: Сочетание ἀλλ’ εἰ καὶ вводит уступительное условие, а оптатив πάσχοιτε указывает на возможную, но вполне реальную ситуацию. Оборот «если вам придётся» естественно передаёт эту потенциальность.
- source_word: διὰ δικαιοσύνην
  choice: за праведность
  rationale: διά с винительным обозначает причину. «За праведность» сохраняет широкий нравственно-богословский смысл δικαιοσύνη и не сводит его только к отдельным правильным поступкам или к общественной справедливости.
- source_word: μακάριοι
  choice: вы блаженны
  rationale: Именная часть сказуемого обращена к читателям; добавленное «вы» необходимо для естественной русской фразы. «Блаженны» сохраняет библейское звучание и смысл Божьего благоволения, в отличие от более бытовых «счастливы» или «вам повезло».
- source_word: τὸν ... φόβον αὐτῶν
  choice: их страха
  rationale: 'Буквальное сочетание сохраняет словесную связь с Ис 8:12 в Септуагинте и не устраняет заложенную в греческом неоднозначность: речь может идти о страхе перед ними либо о том, чего боятся они сами.'
- source_word: μὴ φοβηθῆτε
  choice: не бойтесь
  rationale: Запрет передан естественным русским глаголом, однокоренным слову «страх», чтобы сохранить повтор φόβον / φοβηθῆτε.
- source_word: μηδὲ ταραχθῆτε
  choice: и не приходите в смятение
  rationale: Оборот передаёт внутреннюю тревогу и потрясение, выраженные ταράσσω, оставаясь естественным и достойным по регистру.
theological_decisions:
- issue: Значение δικαιοσύνη
  choice: праведность
  alternative: справедливость; правильные поступки
  rationale: В данном контексте речь идёт о страдании из-за угодной Богу нравственной жизни. «Праведность» сохраняет богословскую широту термина и не сужает его до социальной справедливости или отдельных действий.
- issue: Неоднозначность τὸν φόβον αὐτῶν
  choice: их страха
  alternative: страха перед ними; того, чего боятся они
  rationale: Греческая конструкция допускает разные отношения родительного αὐτῶν. Основной текст сохраняет эту напряжённость и отголосок Ис 8:12, а возможные толкования указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Слова «праведность» и «блаженны» сохранены как понятные богословски значимые термины; формулировка «их страха» намеренно несколько необычна ради межтекстовой связи и подлинной неоднозначности оригинала.
