  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: ru
  text: Пусть вашим украшением будет не внешнее убранство — заплетание волос, ношение золотых украшений или надевание одежды —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: вашим
  rationale: Родительное множественного числа относительного местоимения отсылает к женщинам, названным ранее; по-русски притяжательное значение естественно передаётся словом «вашим».
- source_word: ἔστω οὐχ
  choice: Пусть … будет не
  rationale: Сохраняет побудительную силу формы настоящего времени повелительного наклонения и прямое отрицание, не превращая наставление в отвлечённое утверждение.
- source_word: ὁ ἔξωθεν … κόσμος
  choice: украшением … не внешнее
  rationale: κόσμος здесь означает «украшение, убранство», а ἔξωθεν — его внешний характер; формулировка подготавливает противопоставление внутреннему человеку в следующем стихе.
- source_word: ἐμπλοκῆς τριχῶν
  choice: заплетание волос
  rationale: Передаёт действие, выраженное отглагольным существительным ἐμπλοκή, и конкретную связь с волосами без добавления оценки сложности или роскоши причёски.
- source_word: περιθέσεως χρυσίων
  choice: ношение золотых украшений
  rationale: περίθεσις обозначает надевание или размещение на себе, а χρυσία — золотые предметы, в данном контексте украшения.
- source_word: ἐνδύσεως ἱματίων
  choice: надевание одежды
  rationale: Формально передаёт действие ἔνδυσις и значение ἱμάτια, не добавляя отсутствующего в греческом тексте определения «дорогая» или «нарядная».
theological_decisions:
- issue: Является ли стих абсолютным запретом причёсок, украшений и одежды или ставит внутренний характер выше внешнего убранства
  choice: В основном тексте сохранено прямое греческое отрицание, а контекстуальное сопоставление с внутренним человеком разъяснено в сноске
  alternative: 'Передать сравнительный смысл прямо: «Пусть вашим украшением будет не только внешнее» или «не столько внешнее»'
  rationale: В греческом тексте нет слова «только» или «столько», поэтому добавлять его в основной текст не следует. Вместе с тем упоминание надевания одежды и противопоставление в стихе 4 показывают, что речь идёт о приоритете внутреннего качества, а не о буквальном запрете всякой одежды и ухода за собой.
translation_notes:
  register: Современный литературный русский язык с умеренно формальной, достойной библейского текста интонацией. Параллельные отглагольные существительные сохраняют структуру греческого перечня; конечное тире показывает, что мысль продолжается в следующем стихе.
