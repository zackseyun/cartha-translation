source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: ru
  text: Как Сарра слушалась Авраама, называя его господином. Вы стали её детьми, если делаете добро и не страшитесь никакого ужаса[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не боитесь никакого испуга»; возможно также: «ничего пугающего».'
    reason: πτόησις может означать ужас или испуг, а также нечто, вызывающее страх. Основной перевод сохраняет широкий смысл и не ограничивает его внешними угрозами.
lexical_decisions:
- source_word: ὡς
  choice: как
  rationale: Естественно вводит Сарру как пример, соответствующий предшествующему наставлению.
- source_word: ὑπήκουσεν
  choice: слушалась
  rationale: Передаёт обычное значение ὑπακούω — повиноваться, слушаться — и естественно звучит по-русски с дополнением «Авраама».
- source_word: κύριον αὐτὸν καλοῦσα
  choice: называя его господином
  rationale: Сохраняет значение уважительного обращения без намёка на божественный титул; поэтому слово написано со строчной буквы.
- source_word: ἧς ἐγενήθητε τέκνα
  choice: Вы стали её детьми
  rationale: Передаёт вхождение в образно выраженное родство и сохраняет широкое значение τέκνα, хотя непосредственные адресаты — женщины.
- source_word: ἀγαθοποιοῦσαι
  choice: если делаете добро
  rationale: Условная конструкция естественно выражает подразумеваемую связь причастия с главным сказуемым, не превращая её в безусловное утверждение.
- source_word: μὴ φοβούμεναι μηδεμίαν πτόησιν
  choice: не страшитесь никаких угроз
  rationale: Передаёт отсутствие страха перед тем, что пугает или запугивает; поскольку πτόησις допускает также значение внутреннего ужаса или испуга, неоднозначность отмечена в сноске.
theological_decisions:
- issue: Характер послушания Сарры как примера для христианских жён
  choice: Сохранено прямое «слушалась», без расширения стиха до всеобъемлющего учения о браке.
  alternative: Ослабить до «подчинялась» либо «уважала».
  rationale: ὑπήκουσεν прямо обозначает послушание; перевод не должен смягчать его по культурным причинам, но и не должен добавлять к тексту более широкие доктринальные выводы.
- issue: Связь причастий ἀγαθοποιοῦσαι и μὴ φοβούμεναι с утверждением о детях Сарры
  choice: 'Передана условно: «если делаете добро и не страшитесь».'
  alternative: 'Передать описательно: «делая добро и ничего не страшась».'
  rationale: Условное прочтение естественно в увещевательном контексте, однако не утверждает отдельного богословского условия вне логики самого стиха.
translation_notes:
  register: Современный литературный русский язык; тон ясный и достойный. «Господином» написано со строчной буквы, поскольку речь не о божественном титуле. Образ «её детьми» сохранён без гендерного сужения до «дочерей».
