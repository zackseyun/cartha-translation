  text: οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι ⸀εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: ru
  text: Ибо именно так некогда украшали себя и святые женщины, надеявшиеся на Бога[a], подчиняясь своим мужьям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возлагавшие надежду на Бога».'
    reason: Лексический вариант для ἐλπίζουσαι εἰς θεόν, сохраняющий направленность надежды на Бога.
lexical_decisions:
- source_word: οὕτως γάρ
  choice: Именно так
  rationale: οὕτως указывает на описанный выше образ украшения, а γάρ вводит обоснование. В русском связное пояснение естественно передаётся без отдельного «ибо»; «именно так» сохраняет указательную и пояснительную силу выражения.
- source_word: ποτε καὶ αἱ ἅγιαι γυναῖκες
  choice: некогда украшали себя и святые женщины
  rationale: «Некогда» обозначает прежние времена; «и» сохраняет καί, представляющее этих женщин как дополнительный пример. «Святые» прямо передаёт ἅγιαι без ослабления до «благочестивые».
- source_word: αἱ ἐλπίζουσαι εἰς θεὸν
  choice: надеявшиеся на Бога
  rationale: Причастный оборот характеризует этих женщин. «Надеяться на Бога» — естественное современное русское выражение, сохраняющее направленность надежды.
- source_word: ἐκόσμουν ἑαυτάς
  choice: украшали себя
  rationale: Передаёт значение κοσμέω и сохраняет смысловую связь с темой украшения в ближайшем контексте.
- source_word: ὑποτασσόμεναι
  choice: они подчинялись
  rationale: Греческое причастие обозначает способ, которым женщины украшали себя. Двоеточие и личная форма естественно выражают эту связь по-русски, не превращая действие в отдельное повеление.
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: своим мужьям
  rationale: В семейном контексте ἀνήρ означает мужа, а ἰδίοις ограничивает отношение собственным супругом каждой женщины. Русское «своим мужьям» точно и естественно передаёт оба элемента.
theological_decisions:
- issue: Подчинение в браке
  choice: они подчинялись своим мужьям
  alternative: будучи покорны своим мужьям
  rationale: Формулировка сохраняет описание поведения святых женщин и прямо ограничивает его отношениями с собственными мужьями. Она не расширяет высказывание до общего положения об отношении всех женщин ко всем мужчинам.
- issue: Связь подчинения с украшением
  choice: 'двоеточие: «они подчинялись»'
  alternative: «подчиняясь»
  rationale: Двоеточие передаёт обстоятельственную связь греческого причастия с глаголом «украшали», представляя подчинение как пояснение того, каким образом они себя украшали, а не как независимое утверждение.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для русского: причастие ὑποτασσόμεναι раскрыто личной формой после двоеточия. Маркер [a] помещён непосредственно после относящегося к нему оборота.'
