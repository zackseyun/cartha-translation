  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: ru
  text: Ведь кто хочет любить жизнь и видеть добрые дни, пусть удерживает свой язык от зла и свои уста — чтобы не говорить лжи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы не говорить обмана»; греческое слово может означать обман, коварство или хитрость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: кто хочет
  rationale: Субстантивированное причастие обозначает любого человека; русская конструкция «кто хочет» естественно передаёт обобщённое значение без указания пола.
- source_word: γὰρ
  choice: ведь
  rationale: Союз вводит обоснование предшествующего наставления; «ведь» естественно выражает пояснительно-обосновывающую связь.
- source_word: ζωὴν ἀγαπᾶν
  choice: любить жизнь
  rationale: Прямо и естественно передаёт инфинитивное сочетание, не добавляя отсутствующего в греческом притяжательного значения.
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: видеть добрые дни
  rationale: Сохраняет конкретный глагол «видеть» и широкое значение ἀγαθός, не сужая смысл до материального благополучия.
- source_word: παυσάτω
  choice: пусть удерживает
  rationale: Передаёт повелительную силу аористного императива и в сочетании с ἀπό выражает требование воздерживать орган речи от зла; настоящее несовершенное звучит по-русски как общий нравственный призыв.
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: свой язык от зла
  rationale: Притяжательное местоимение естественно для русского обозначения части тела, а «зло» сохраняет широту исходного выражения.
- source_word: χείλη
  choice: свои уста
  rationale: Сохраняется множественный поэтический образ; «уста» уместны в достоинственном регистре ветхозаветной цитаты и хорошо сочетаются с речью.
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: от лживых слов
  rationale: Естественно передаёт запрет говорить δόλος. Формулировка раскрывает речевой смысл, хотя существительное также может означать обман или коварство; эта широта отмечена в сноске.
theological_decisions:
- issue: Обобщённое единственное число и указание пола
  choice: «кто хочет» с возвратными притяжательными «свой/свои»
  alternative: «желающий» с формально мужским грамматическим оформлением
  rationale: Исходный текст говорит обобщённо о любом человеке. Русское «кто» и возвратное «свой» сохраняют единственное число и не создают мужского ограничения.
- issue: Характер обещания о «добрых днях»
  choice: сохранить «видеть добрые дни» без пояснения
  alternative: «наслаждаться благополучными днями»
  rationale: Буквальная образность оставляет открытым широкий смысл благих дней и не превращает наставление в обещание материального процветания.
translation_notes:
  register: Современный литературный русский с достоинственным, слегка поэтическим звучанием, соответствующим цитате из Псалма. Синтаксис ясен обычному читателю; архаизирующее «уста» сохранено как понятный библейско-поэтический образ.
