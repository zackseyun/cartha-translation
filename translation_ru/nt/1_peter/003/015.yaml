  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: ru
  text: Но в своих сердцах святым почитайте Мессию как Господа[a] и будьте всегда готовы дать отчёт каждому, кто просит у вас объяснения надежды, которая в вас,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «освятите Мессию как Господа в ваших сердцах». Греческое Χριστός означает «Помазанник», то есть «Мессия»; традиционная передача — «Христос».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριον ... τὸν Χριστόν
  choice: Мессию как ... Господа
  rationale: Передаёт Χριστός как титул «Мессия», а κύριος — как «Господь»; конструкция связывается с повелением ἁγιάσατε и сохраняет христологический смысл и отзвук Ис 8:13.
- source_word: ἁγιάσατε
  choice: почитайте ... как святого
  rationale: Глагол буквально означает «освятите, признайте святым». Выбранная формулировка ясно выражает благоговейное признание святости Мессии, не создавая впечатления, будто люди делают Его святым.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: в своих сердцах
  rationale: Естественная русская передача внутреннего, личного признания; возвратное «своих» ясно соотносится с адресатами.
- source_word: ἕτοιμοι ἀεὶ
  choice: будьте всегда готовы
  rationale: В русском для завершённости предложения уместно восстановить подразумеваемую связку «будьте»; наречие ἀεί передано словом «всегда».
- source_word: πρὸς ἀπολογίαν
  choice: дать ответ в свою защиту
  rationale: Сохраняет значение обоснованного ответа или защиты, присущее ἀπολογία, и звучит естественно по-русски.
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον
  choice: каждому, кто просит у вас объяснения
  rationale: Передаёт всеобщность παντί, продолжающийся характер причастия αἰτοῦντι и контекстуальное значение λόγος как объяснения или отчёта.
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: надежды, которая живёт в вас
  rationale: «Живёт в вас» естественно выражает внутреннее присутствие надежды, обозначенное ἐν ὑμῖν, не сводя его только к владению.
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь Χριστός употреблено как титул в сочетании с κύριος; «Мессия» раскрывает титульный смысл, не превращая его в личное имя.
- issue: Смысл ἁγιάσατε при Мессии как объекте
  choice: почитайте Мессию как святого Господа
  alternative: освятите Мессию как Господа
  rationale: Выбранный вариант сохраняет повеление признавать Его святым и чтить как Господа, избегая ложного смысла, будто верующие наделяют Его святостью.
- issue: Смысл ἀπολογία
  choice: ответ в свою защиту
  alternative: защита веры
  rationale: Текст говорит об обоснованном ответе спрашивающему, но прямо не добавляет объект «вера»; перевод не вносит его от себя.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис слегка разгружен за счёт явного «будьте», подразумеваемого греческой конструкцией. Конечная запятая сохранена, поскольку данный стиховой фрагмент продолжается в следующей части предложения.
