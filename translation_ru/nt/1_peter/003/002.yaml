lexical_decisions:
- source_word: ἐποπτεύσαντες
  choice: увидев
  rationale: Причастие аориста передаёт непосредственное наблюдение; «увидев» естественно продолжает синтаксис предыдущего стиха и не добавляет значения простого слуха.
- source_word: ἁγνὴν ἀναστροφὴν
  choice: чистую жизнь
  rationale: ἀναστροφή обозначает образ жизни или поведение; в данном контексте «чистая жизнь» естественно по-русски передаёт нравственную чистоту, не сужая смысл до отдельных поступков.
- source_word: ἐν φόβῳ
  choice: в страхе
  rationale: 'Сохранена формальная и богословская неоднозначность выражения: текст прямо не уточняет объект страха и не позволяет безоговорочно заменить его словами «уважение» или «благоговение».'
theological_decisions:
- issue: Объект и характер φόβος
  choice: в страхе
  alternative: с благоговением / с уважением
  rationale: Буквальная формулировка сохраняет напряжение и не решает за читателя, относится ли страх прежде всего к Богу, к почтительности в браке или к более широкому благоговейному устроению жизни.
translation_notes:
  register: Современный литературный русский язык; краткая конструкция рассчитана на продолжение предложения из 1 Пет. 3:1. Выражение «в страхе» намеренно сохранено, несмотря на некоторую необычность, ради точности и богословской открытости.
