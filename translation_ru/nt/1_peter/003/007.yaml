  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: ru
  text: 'Так же и вы, мужья: живите с жёнами с пониманием[a], оказывая женщине честь как более слабому сосуду[b] и как сонаследнице[c] благодати жизни, чтобы ваши молитвы не встречали препятствий.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «согласно знанию»; также возможно: «с пониманием».'
    reason: Греческое κατὰ γνῶσιν допускает более буквальную передачу и характеризует отношение, основанное на знании или понимании.
  - marker: b
    text: «Более слабый сосуд» — метафора, вероятно указывающая на относительную физическую слабость или общественную уязвимость, а не на меньшее достоинство; далее жена названа сонаследницей благодати жизни.
    reason: Культурно-смысловое пояснение предотвращает ошибочное отождествление сравнительной слабости с меньшей человеческой или духовной ценностью.
  - marker: c
    text: 'В греческом тексте стоит множественное число: «сонаследникам». Вероятно, оно относится к жёнам как к группе; в русском обобщённое единственное число согласовано с «женщине».'
    reason: Сноска сохраняет формальную особенность чтения SBLGNT, не заявляя неподтверждённый рукописный вариант.
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: мужья
  rationale: В контексте наставления жёнам в 3:1 речь идёт о мужьях, а не о мужчинах вообще.
- source_word: ὁμοίως
  choice: так же и вы
  rationale: Передаёт связь с предшествующим наставлением и сравнительную силу наречия, не уточняя сверх текста, в чём именно состоит сходство.
- source_word: συνοικοῦντες κατὰ γνῶσιν
  choice: живите с жёнами со знанием дела
  rationale: Естественно передаёт совместную супружескую жизнь и поведение, основанное на знании и понимании; объект «с жёнами» ясен из контекста и формы τῷ γυναικείῳ.
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: женщине ... как более слабому сосуду
  rationale: Сохраняет сравнительную степень и образ сосуда, не сводя его к одной конкретной разновидности слабости и не подразумевая меньшего достоинства.
- source_word: ἀπονέμοντες τιμήν
  choice: оказывая ... честь
  rationale: Современное и естественное русское выражение для предоставления подобающей чести.
- source_word: συγκληρονόμοις
  choice: сонаследнице
  rationale: Передаёт совместное участие жены в наследии. Русское единственное число согласуется с собирательно-типическим τῷ γυναικείῳ; греческое чтение SBLGNT имеет множественное число и отражено в сноске.
- source_word: χάριτος ζωῆς
  choice: благодати жизни
  rationale: 'Сохраняет неоднозначность родительного оборота: это может быть благодать, состоящая в жизни, либо благодать, дарующая жизнь.'
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν
  choice: чтобы вашим молитвам не было преграды
  rationale: Естественно передаёт целевое значение и пассивную идею воспрепятствования.
theological_decisions:
- issue: Смысл выражения «более слабый сосуд»
  choice: Метафора и сравнительная характеристика сохранены без уточнения вида слабости.
  alternative: Передать как «физически слабее» или «более уязвима в обществе».
  rationale: Текст не называет конкретную сферу слабости. Последующее требование оказывать честь и упоминание совместного наследия не позволяют понимать выражение как утверждение о меньшем достоинстве или духовном статусе.
- issue: Совместное наследование благодати жизни
  choice: Жена названа сонаследницей благодати жизни.
  alternative: Истолковать выражение прямо как «сонаследница вечной жизни» или как «получившая вместе с вами дар земной жизни».
  rationale: Греческий оборот утверждает совместное наследование, но не уточняет здесь значение «жизни»; перевод сохраняет эту содержательную широту.
- issue: Связь ὡς καὶ συγκληρονόμοις с повелением о чести
  choice: 'Передано вторым сравнительно-оснóвным оборотом: «и как сонаследнице».'
  alternative: «Поскольку она также сонаследница».
  rationale: Так сохраняется ὡς καὶ без внесения явно причинного союза, хотя сама фраза служит основанием для почтительного отношения.
translation_notes:
  register: Современный литературный русский, понятный широкому читателю, с умеренно торжественным библейским звучанием. «Сосуд» сохранён как значимая метафора; тяжеловесное буквальное «согласно знанию» заменено естественным «со знанием дела», а более истолковывающий вариант вынесен в сноску. Все маркеры [a], [b], [c] присутствуют в основном тексте.
