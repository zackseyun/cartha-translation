  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: ru
  text: которые некогда не покорились, когда Бог в Своём долготерпении ожидал во дни Ноя, пока строился ковчег. В него вошли немногие — всего восемь человек[a], — и были благополучно проведены через воду[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «восемь душ».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «были спасены через воду».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν ποτε
  choice: некогда не покорились
  rationale: Передаёт прежний, конкретно отнесённый к прошлому отказ повиноваться, не сужая значение до одного лишь интеллектуального неверия.
- source_word: ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία
  choice: Бог в Своём долготерпении ожидал
  rationale: Естественная русская передача продолжающегося ожидания и Божьего долготерпения; грамматическая перестройка устраняет неестественное олицетворение «долготерпение ожидало», сохраняя смысл исходного выражения.
- source_word: ἐν ἡμέραις Νῶε
  choice: во дни Ноя
  rationale: Устоявшееся, понятное и достойное по регистру библейское выражение, соответствующее значению «во времена Ноя».
- source_word: κατασκευαζομένης κιβωτοῦ
  choice: пока строился ковчег
  rationale: Контекст показывает подготовку ковчега посредством строительства; форма «пока строился» естественно выражает длительное одновременное действие.
- source_word: εἰς ἣν
  choice: в него вошли
  rationale: Явно сохраняет направительное значение εἰς — движение внутрь ковчега, хотя для естественного русского синтаксиса подразумеваемое движение выражено отдельным глаголом.
- source_word: ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί
  choice: немногие — всего восемь человек
  rationale: «Человек» ясно обозначает считаемых людей и не навязывает антропологического различения души и тела; «всего» естественно раскрывает пояснительное τοῦτ’ ἔστιν и подчёркивает малое число.
- source_word: διεσώθησαν
  choice: были благополучно проведены
  rationale: Передаёт усиленное значение сохранения и безопасного проведения через опасность, не устраняя при этом возможную связь со значением «спасены».
- source_word: δι’ ὕδατος
  choice: через воду
  rationale: 'Сохраняет намеренную смысловую напряжённость: вода была средой смертельной опасности, через которую люди были сохранены; возможное инструментальное понимание не исключается.'
theological_decisions:
- issue: Сотериологически значимая передача διεσώθησαν
  choice: были благополучно проведены через воду
  alternative: были спасены через воду
  rationale: Основной текст прежде всего описывает сохранение людей при потопе, но греческий глагол допускает «спасены», что важно для связи со следующим стихом; поэтому этот вариант сохранён в примечании.
- issue: Передача ψυχαί при подсчёте людей
  choice: восемь человек
  alternative: восемь душ
  rationale: Здесь ψυχαί обозначает людей как целых личностей, а не формулирует учение о составе человека. Буквальная передача сохранена в примечании.
- issue: Значение δι’ ὕδατος
  choice: через воду
  alternative: посредством воды
  rationale: «Через воду» сохраняет как пространственно-средовое прочтение рассказа о потопе, так и напряжённость возможного инструментального оттенка διά, не предрешая толкование связи с крещением в следующем стихе.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Выражение «во дни Ноя» сохранено как широко понятное и торжественное; остальной синтаксис сделан естественным для современного читателя. Начальное «которые» намеренно сохраняет зависимость стиха от предыдущего контекста.
