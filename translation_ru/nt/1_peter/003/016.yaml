id: 1PE.3.16
reference: 1 Peter 3:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: ru
  text: но с кротостью и страхом[a], имея добрую совесть, чтобы в том, за что вас злословят[b], были посрамлены те, кто поносит ваш добрый образ жизни в Мессии[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с кротостью и благоговением»; или: «с кротостью и уважением».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в том, в чём против вас говорят».'
    reason: lexical_alternative
  - marker: c
    text: 'По-гречески: «в Мессии»; традиционно: «во Христе».'
    reason: alternative_reading
lexical_decisions:
- source_word: πραΰτητος
  choice: кротостью
  rationale: «Кротость» передаёт смиренную, незлобивую и ненасильственную манеру поведения; это естественное и достойное слово в русском библейском контексте.
- source_word: φόβου
  choice: страхом
  rationale: Сохранено широкое значение греческого слова без уточнения объекта страха; возможные оттенки благоговения и уважения вынесены в примечание.
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: имея добрую совесть
  rationale: Причастная конструкция передана близко к форме и смыслу оригинала, как сопутствующее постоянное состояние.
- source_word: ἐν ᾧ
  choice: в том, за что
  rationale: Фраза естественна по-русски и сохраняет отсылку к предмету обвинений, не уточняя его сверх текста.
- source_word: καταλαλεῖσθε
  choice: вас злословят
  rationale: Глагол обозначает враждебную речь против человека; «злословят» сохраняет речевой характер действия и не требует юридически точного смысла клеветы.
- source_word: καταισχυνθῶσιν
  choice: были посрамлены
  rationale: Передаёт пассивный залог и целевой либо результативный оттенок формы после ἵνα.
- source_word: ἐπηρεάζοντες
  choice: те, кто поносит
  rationale: «Поносит» выражает активное враждебное и оскорбительное отношение, особенно уместное рядом с упоминанием злословия.
- source_word: ἀναστροφήν
  choice: образ жизни
  rationale: ἀναστροφή означает поведение или уклад жизни; «образ жизни» ясно и естественно передаёт более широкий смысл, чем отдельные поступки.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Χριστός здесь сохраняет значение титула; «Мессия» передаёт его смысл, а традиционное «Христос» указано в примечании.
- source_word: ἀγαθὴν
  choice: добрую / добрый
  rationale: Повтор одного корня в выражениях о совести и образе жизни сохраняет лексическое повторение оригинала.
theological_decisions:
- issue: Значение φόβου в сочетании «с кротостью и страхом»
  choice: Сохранить слово «страх» без указания его объекта.
  alternative: «с благоговением» или «с уважением»
  rationale: Ближайший контекст прямо не называет объект страха. Основной текст сохраняет смысловую напряжённость и не решает, идёт ли речь о страхе Божьем, благоговении или уважительной серьёзности.
- issue: Передача Χριστῷ
  choice: Мессии
  alternative: Христе
  rationale: В обороте ἐν Χριστῷ титульный смысл остаётся значимым, поэтому он передан как «в Мессии»; традиционный вариант сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сохраняет связь с предыдущим стихом, поэтому текст начинается со строчной буквы «но». Термины «кротость», «добрая совесть» и «посрамлены» понятны современному читателю и сохраняют достоинство оригинала.
