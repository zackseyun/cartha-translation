  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: ru
  text: Ведь и Мессия однажды пострадал за грехи[a] — праведный за неправедных, — чтобы привести вас к Богу. Он был умерщвлён во плоти, но оживлён в духе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «умер» вместо «пострадал».'
    reason: textual_variant
  - marker: b
    text: 'Или: «оживлён Духом». Греческая форма может указывать либо на сферу или аспект, относящийся к духу, либо на действие Святого Духа.'
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: Мессия
  rationale: Передаёт Χριστός как титул и сохраняет его мессианский смысл, не превращая его лишь в привычную часть имени.
- source_word: ἅπαξ
  choice: однажды
  rationale: Точно передаёт значение «один раз», не добавляя отсутствующего в самом наречии усиления «раз и навсегда».
- source_word: περὶ ἁμαρτιῶν
  choice: за грехи
  rationale: В данном искупительном контексте περί с родительным естественно обозначает отношение страдания к грехам.
- source_word: ἔπαθεν
  choice: пострадал
  rationale: Следует основному чтению SBLGNT; вариант «умер» вынесен в примечание.
- source_word: δίκαιος ὑπὲρ ἀδίκων
  choice: праведный за неправедных
  rationale: Сохраняет краткий контраст и значение действия ради других, не разворачивая его в отдельную теорию искупления.
- source_word: προσαγάγῃ
  choice: привести
  rationale: Естественно выражает введение в Божье присутствие и обретение доступа к Богу.
- source_word: θανατωθεὶς σαρκὶ
  choice: был умерщвлён по плоти
  rationale: Сохраняет страдательный залог и дательный отношения/сферы, а также параллель с πνεύματι.
- source_word: ζῳοποιηθεὶς δὲ πνεύματι
  choice: но оживлён по духу
  rationale: Сохраняет страдательный залог, противопоставление плоти и духа и не устраняет неоднозначность дательного падежа.
theological_decisions:
- issue: Противопоставление σαρκὶ и πνεύματι
  choice: «по плоти … по духу»
  alternative: «в теле … духом» или «оживлён Духом»
  rationale: Параллельная передача двух дательных сохраняет возможность понимать их как сферы или аспекты; вариант с действием Святого Духа отмечен, но не навязан основным текстом.
- issue: Значение δίκαιος ὑπὲρ ἀδίκων
  choice: «праведный за неправедных»
  alternative: «невиновный вместо виновных»
  rationale: Основной текст сохраняет заместительный или представительский оттенок ὑπέρ, не уточняя сверх греческого текста конкретную модель искупления.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Тире выделяют сжатое противопоставление «праведный за неправедных», а отдельное предложение делает длинную греческую конструкцию понятнее без изменения её логики.
