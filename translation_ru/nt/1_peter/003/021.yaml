  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: ru
  text: Крещение, соответствующее этому, теперь спасает и вас — не удаление грязи с тела, а просьба к Богу о доброй совести[a] — через воскресение Иисуса Мессии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обещание (или обязательство) доброй совести перед Богом». Греческое слово ἐπερώτημα может означать просьбу или обращение, а также обещание, обязательство либо ответ.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίτυπον
  choice: соответствующее этому
  rationale: Форма согласуется с «крещением» и указывает назад на спасение через воду во время потопа. Формулировка передаёт типологическое соответствие без малопонятного технического термина «антитип».
- source_word: σῴζει
  choice: спасает
  rationale: Прямой перевод настоящего времени сохраняет недвусмысленное утверждение текста; последующее пояснение ограничивает его смысл, не отменяя сказанного.
- source_word: βάπτισμα
  choice: крещение
  rationale: Обычный и контекстуально точный эквивалент; далее автор прямо отличает крещение от простого телесного очищения.
- source_word: σαρκὸς ἀπόθεσις ῥύπου
  choice: удаление грязи с тела
  rationale: В данном буквальном, телесном контексте русское «с тела» звучит естественнее, чем «с плоти», и ясно обозначает внешнее очищение.
- source_word: συνειδήσεως ἀγαθῆς
  choice: о доброй совести
  rationale: Родительный оборот допускает несколько связей. Предложная конструкция естественно сочетается с пониманием ἐπερώτημα как просьбы и не вводит представления, будто речь идёт лишь о уже достигнутом нравственном состоянии.
- source_word: ἐπερώτημα
  choice: просьба
  rationale: Значение обращения или просьбы хорошо согласуется с направлением εἰς θεόν. Возможное значение «обещание/обязательство» сохранено в сноске.
- source_word: εἰς θεόν
  choice: к Богу
  rationale: Передаёт направленность просьбы к Богу.
- source_word: δι’ ἀναστάσεως
  choice: через воскресение
  rationale: Передаёт инструментальное значение διά с родительным падежом и сохраняет связь спасения с воскресением.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняет силу титула; «Мессия» понятно современному читателю и не превращает титул в непрозрачную часть имени.
theological_decisions:
- issue: Связь крещения со спасением
  choice: Сохранено прямое утверждение «крещение спасает и вас», смысл которого далее уточняется самим автором.
  alternative: Ослабить его до «крещение символизирует спасение» либо расширить конфессиональным объяснением действия крещения.
  rationale: Греческий текст прямо употребляет σῴζει, но исключает понимание крещения как простого внешнего омовения и связывает его с обращением к Богу и воскресением Иисуса. Перевод сохраняет эту напряжённость без догматического уточнения.
- issue: Значение ἐπερώτημα
  choice: В основном тексте — «просьба», в сноске — «обещание» или «обязательство».
  alternative: Сделать основным переводом «обещание Богу, данное с доброй совестью».
  rationale: Слово толкуется по-разному. Значение просьбы хорошо подходит к εἰς θεόν, однако значение обещания имеет серьёзные основания и потому явно отмечено.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и умеренно формальным звучанием. Синтаксис сохраняет плотность и богословскую напряжённость оригинала, а тире отчётливо выделяют авторское пояснение.
