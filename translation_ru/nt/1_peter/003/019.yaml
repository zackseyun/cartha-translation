  text: ἐν ᾧ καὶ τοῖς ἐν φυλακῇ πνεύμασιν πορευθεὶς ἐκήρυξεν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/019.yaml
  text: in which also he went and proclaimed to the spirits in prison[c][b][a],
translation:
  language: ru
  text: в котором[a] Он также, пойдя, возвестил[b] духам, находящимся в темнице[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «в Ком» или «посредством которого». Греческое выражение допускает разные понимания связи с предыдущей фразой.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «проповедал». Глагол означает провозглашать весть, но её точное содержание здесь не указано.'
    reason: lexical_alternative
  - marker: c
    text: 'Кого именно Пётр называет «духами в темнице», остаётся спорным: среди возможных толкований — умершие люди и падшие ангельские существа.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: в котором
  rationale: Сохраняет относительную конструкцию и её связь с предшествующим πνεύματι, не сводя возможный смысл только к орудию действия или к личному референту.
- source_word: καὶ
  choice: также
  rationale: 'Передаёт добавочное значение: к предшествующему действию присоединяется ещё одно.'
- source_word: τοῖς ... πνεύμασιν
  choice: духам
  rationale: Прямой эквивалент πνεύμασιν; не подменяет его словом «душам» и не уточняет природу этих духов.
- source_word: ἐν φυλακῇ
  choice: находящимся в темнице
  rationale: Естественно передаёт состояние заключения или содержания под стражей; причастный оборот ясно связывает выражение с духами.
- source_word: πορευθεὶς
  choice: пойдя
  rationale: Сохраняет значение движения аористного причастия, не делая временную последовательность более определённой, чем в греческом тексте.
- source_word: ἐκήρυξεν
  choice: возвестил
  rationale: Передаёт публичное провозглашение и, в отличие от «проповедал», не предполагает, что речь непременно шла о благовестии.
theological_decisions:
- issue: Референт и значение ἐν ᾧ
  choice: Нейтральное «в котором» с пояснением в сноске.
  alternative: «в Ком» применительно непосредственно ко Христу; «посредством которого» в орудийном смысле.
  rationale: Греческая конструкция допускает разные понимания её связи с предыдущей фразой. Основной текст не должен разрешать этот синтаксический и богословский спор.
- issue: Кто такие «духи в темнице»
  choice: Их природа в основном тексте не уточняется.
  alternative: Умершие люди, в частности современники Ноя; падшие ангельские существа; более широкий круг заключённых духов.
  rationale: Само выражение τοῖς ἐν φυλακῇ πνεύμασιν не позволяет однозначно определить этих духов.
- issue: Характер возвещения
  choice: «возвестил» без указания содержания вести.
  alternative: Проповедал Благую весть; объявил суд; провозгласил победу.
  rationale: Глагол κηρύσσω обозначает провозглашение, но в данном стихе содержание вести прямо не названо.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис следует греческому тексту, но остаётся естественным по-русски; подлинные лексические и богословские неоднозначности вынесены в сноски.
