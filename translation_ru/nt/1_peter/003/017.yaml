id: 1PE.3.17
reference: 1 Peter 3:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἀγαθοποιοῦντας, εἰ θέλοι τὸ θέλημα τοῦ θεοῦ, πάσχειν ἢ κακοποιοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: ru
  text: Ведь лучше страдать, делая добро[a], если на то будет Божья воля[b], чем делая зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страдать за добрые дела… чем за злые». Причастия могут указывать как на причину страдания, так и в более общем смысле на обстоятельства, при которых оно происходит.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «если бы того пожелала воля Бога». В греческом тексте однокоренные по смыслу слова «воля» и «желать» образуют подчёркнутый оборот; по-русски его смысл передан идиоматически.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: лучше
  rationale: Предикативное сравнительное прилагательное в безличной конструкции; «лучше» — прямой и естественный русский эквивалент.
- source_word: γὰρ
  choice: ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предшествующим наставлением естественнее для современного русского текста.
- source_word: ἀγαθοποιοῦντας
  choice: делая добро
  rationale: Причастие настоящего времени описывает обстоятельство страдания и само по себе не требует исключительно причинного понимания.
- source_word: εἰ θέλοι
  choice: если ... будет
  rationale: Условная конструкция с оптативом выражает возможное, не категорически утверждаемое условие; русское будущее время в обороте «если на то будет» естественно сохраняет эту условность.
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: на то будет Божья воля
  rationale: Идиоматический русский оборот сохраняет прямую отсылку к Божьей воле, не воспроизводя неестественное дословное повторение существительного и однокоренного глагола.
- source_word: πάσχειν
  choice: страдать
  rationale: Прямой эквивалент инфинитива, зависящего от κρεῖττον.
- source_word: ἢ
  choice: чем
  rationale: Стандартный русский сравнительный союз после «лучше».
- source_word: κακοποιοῦντας
  choice: делая зло
  rationale: Сохраняет грамматический и смысловой параллелизм с «делая добро», не навязывая причинного прочтения.
theological_decisions:
- issue: Связь страдания с Божьей волей
  choice: Стих допускает, что страдание за добрые дела может происходить по Божьей воле, но не уточняет характер Божьего волеизъявления.
  alternative: Понимать фразу либо как утверждение о прямом предопределении каждого страдания, либо только как пассивное Божье допущение.
  rationale: εἰ θέλοι τὸ θέλημα τοῦ θεοῦ указывает на условную связь с Божьей волей, не разрешая более широкий богословский вопрос о предопределении и допущении.
- issue: Смысл обстоятельственных причастий
  choice: «делая добро / делая зло» сохраняет общий обстоятельственный смысл.
  alternative: «за добрые дела / за злые дела» однозначно выражало бы причинную связь.
  rationale: Греческие причастия допускают причинное прочтение, но формально его не закрепляют; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; тон ясный и достойный. Оборот «если на то будет Божья воля» естественен, сохраняет условность греческого оптатива и не вводит дополнительной доктринальной определённости. Деепричастные конструкции удерживают параллелизм оригинала и его смысловую неоднозначность.
