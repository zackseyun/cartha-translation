lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: И наконец
  rationale: Оборот вводит заключительный ряд наставлений. «И наконец» естественно передаёт его функцию в рассуждении, не понимая τέλος буквально как конец во временном или эсхатологическом смысле.
- source_word: πάντες
  choice: все
  rationale: Слово обращено ко всей общине; постановка после «будьте» сохраняет прямой и естественный русский порядок слов.
- source_word: ὁμόφρονες
  choice: единомысленны
  rationale: Передаёт общность образа мыслей и единство настроя, сохраняя мыслительный компонент греческого сложного слова.
- source_word: συμπαθεῖς
  choice: чутки друг к другу
  rationale: Передаёт готовность разделять чувства и переживания других. Добавление «друг к другу» ясно выражает взаимную направленность наставления и естественно звучит по-русски.
- source_word: φιλάδελφοι
  choice: любите друг друга как братья
  rationale: Сохраняет семейный образ братской любви, употреблённый применительно ко всей общине, и звучит понятнее современному читателю, чем книжное «братолюбивы».
- source_word: εὔσπλαγχνοι
  choice: милосердны
  rationale: Передаёт глубокое внутреннее сострадание и сердечную доброту, не сводя значение лишь к эмоциональной мягкости.
- source_word: ταπεινόφρονες
  choice: смиренны в мыслях
  rationale: Сохраняет как смирение, так и указание на внутренний образ мыслей, заключённое в греческом сложном прилагательном.
theological_decisions:
- issue: Родовая семейная образность в φιλάδελφοι
  choice: любите друг друга как братья
  alternative: любите друг друга как братья и сёстры
  rationale: Основной текст сохраняет форму семейного образа источника, тогда как сноска поясняет, что обращение относится ко всем членам смешанной христианской общины.
- issue: Текст последнего прилагательного
  choice: ταπεινόφρονες — «смиренны в мыслях»
  alternative: φιλόφρονες — «дружелюбны» или «обходительны»
  rationale: Основной текст следует SBLGNT и его лучше засвидетельствованному чтению; значимый разночтение сохраняется в сноске без подмены исходного текста.
translation_notes:
  register: Современный литературный русский язык с краткими прилагательными в ряду наставлений. Формулировка сохраняет достоинство апостольского увещания, избегая как архаичного «братолюбивы», так и избыточного истолкования. Эллиптический греческий ряд прилагательных естественно развёрнут с повтором «будьте».
