  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: ru
  text: который, отправившись на небо[a], находится по правую руку от Бога; Ему покорены ангелы, власти и силы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение буквально указывает на движение «в небо»; по-русски обычно говорят «на небо».
    reason: Сочетание εἰς οὐρανόν выражает направленность движения; сноска отмечает более буквальный предлог без ложного утверждения, будто русский вариант «на небо» менее точен по смыслу.
lexical_decisions:
- source_word: ὅς
  choice: который
  rationale: Относительное местоимение сохраняет грамматическую связь с Иисусом Христом, упомянутым в предыдущем стихе, не добавляя нового подлежащего.
- source_word: ἐν δεξιᾷ θεοῦ
  choice: по правую руку от Бога
  rationale: Современное и понятное русское выражение сохраняет библейский образ почётного и возвышенного положения рядом с Богом.
- source_word: πορευθεὶς εἰς οὐρανόν
  choice: отправившись на небо[a]
  rationale: Деепричастный оборот передаёт предшествующее действие аористного причастия; «отправившись» не добавляет прямо не выраженной глаголом идеи восхождения, а «на небо» естественно по-русски передаёт направление.
- source_word: ὑποταγέντων αὐτῷ
  choice: Ему покорены
  rationale: Краткая пассивная конструкция сохраняет завершённость и направленность подчинения Христу, оставаясь естественной в современном русском языке.
- source_word: ἀγγέλων
  choice: ангелы
  rationale: В контексте небесных и космических сил речь идёт о сверхъестественных существах, а не о человеческих вестниках.
- source_word: ἐξουσιῶν
  choice: власти
  rationale: Передаёт название духовных или космических чинов и отличает ἐξουσίαι от следующего δυνάμεις.
- source_word: δυνάμεων
  choice: силы
  rationale: Краткий традиционный эквивалент сохраняет трёхчастный перечень и не уточняет природу этих сил сверх сказанного в тексте.
theological_decisions:
- issue: Возвышение Христа по правую руку от Бога
  choice: Сохранить пространственно-реляционный библейский образ «по правую руку от Бога».
  alternative: 'Передать толковательно: «на высшем почётном месте рядом с Богом».'
  rationale: Исходное выражение несёт богословски значимый образ, который не следует сводить лишь к пояснению о почёте.
- issue: Кого обозначают «ангелы, власти и силы»
  choice: Оставить широкий перечень небесных или космических существ и сил, покорённых Христу.
  alternative: Уточнить, что речь идёт исключительно о добрых ангелах либо исключительно о враждебных духовных силах.
  rationale: Греческий текст не определяет нравственную принадлежность всех названных категорий, поэтому перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Порядок частей слегка перестроен ради естественного русского синтаксиса; точка с запятой ясно связывает возвышение Христа с подчинением Ему небесных сил.
