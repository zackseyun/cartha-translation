review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Христос находится по правую руку Бога после того, как вошёл/отправился на небо; ангелы, власти и силы подчинены Ему. Однако пояснение сноски неточно противопоставляет греческое εἰς русскому «на»: в данном контексте εἰς обозначает направленность движения к небесной сфере, а не обязательно буквальное «внутрь» в смысле, который русский предлог «в» передаёт лучше, чем «на».'
  naturalness: Текст в целом литературен. «Находится» нейтральнее и точнее, чем «пребывает», поскольку ἐστιν — простая форма «есть/находится» и сама по себе не акцентирует длительное пребывание. «По правую руку от Бога» сохраняет узнаваемый библейский образ и понятно современному читателю.
  terminology: '«Ангелы, власти и силы» удачно сохраняет трёхчленный перечень и различение ἀρχ? Нет: ἐξουσίαι и δυνάμεις. «Ему покорены» точно передаёт пассивное подчинение без конфессиональных уточнений. Образ положения «по правую руку от Бога» следует сохранить без толковательного сведения к почётному статусу.'
  issues:
  - severity: medium
    issue: Неточная формулировка сноски к «на небо».
    rationale: εἰς οὐρανόν действительно выражает движение с направлением к небу, но утверждение, что оно «буквально выражает движение внутрь — “в небо”», создаёт искусственное и семантически чрезмерное противопоставление русскому нормативному «на небо». Сноска должна пояснять направительное значение, не навязывая неестественный русский вариант как единственно буквальный.
  - severity: low
    issue: «Пребывает» несколько усиливает значение ἐστιν.
    rationale: Греческое ἐστιν здесь прежде всего сообщает местонахождение/положение. «Находится» сохраняет это без дополнительного оттенка длительного пребывания.
  revised_text: который, отправившись на небо[a], находится по правую руку от Бога; Ему покорены ангелы, власти и силы.
