lexical_decisions:
- source_word: Χριστοῦ
  choice: Христос
  rationale: В современном русском «Христос» естественно сохраняет традиционный титул и соответствует греческому Χριστός; форма родительного падежа обусловлена причастной конструкцией.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предшествующего рассуждения естественно и без излишне формального оттенка.
- source_word: παθόντος
  choice: поскольку Христос пострадал
  rationale: Генитив абсолютный передан придаточным с причинно-обстоятельственным оттенком, не сводя связь исключительно ко времени.
- source_word: σαρκὶ
  choice: во плоти
  rationale: Сохраняет повтор и буквальный образ σάρξ, обозначающий здесь телесное человеческое существование, а не обязательно «греховную природу».
- source_word: ἔννοιαν
  choice: мыслью
  rationale: Близко передаёт мысль, установку или намерение; в сочетании с «вооружитесь» сохраняет сжатую метафору оригинала.
- source_word: ὁπλίσασθε
  choice: вооружитесь
  rationale: Сохраняет военную метафору и возвратное значение среднего залога.
- source_word: ὅτι
  choice: ведь
  rationale: Естественно вводит обоснование повеления; причинная связь остаётся ясной.
- source_word: ὁ παθὼν
  choice: тот, кто пострадал
  rationale: Сохраняет грамматически общее обозначение лица и не фиксирует спорный референт.
- source_word: πέπαυται ἁμαρτίας
  choice: перестал грешить
  rationale: Естественный современный русский эквивалент конструкции «прекратил/перестал в отношении греха»; совершенный вид передаёт наступившее и сохраняющееся прекращение.
theological_decisions:
- issue: К кому относится формула «тот, кто пострадал во плоти, перестал грешить»
  choice: 'Референт оставлен неопределённым: «тот, кто пострадал»'
  alternative: Уточнить, что речь исключительно о Христе, о верующих либо сформулировать общий принцип
  rationale: Греческий текст сжат и допускает разные толкования. Перевод не добавляет субъекта и сохраняет богословское напряжение.
- issue: Смысл πέπαυται ἁμαρτίας
  choice: перестал грешить
  alternative: «покончил с грехом» или «освободился от греха»
  rationale: Выбранная формулировка не вносит отсутствующей в тексте идеи освобождения и передаёт прекращение греха, хотя точный характер этого прекращения остаётся предметом толкования.
translation_notes:
  register: Современный литературный русский с сохранением торжественности и военной метафоры. Пунктуация раскрывает причинное обоснование, не устраняя смысловой неоднозначности.
