base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: ru
  text: Если вас оскорбляют за имя Мессии[a], вы блаженны, потому что на вас покоится Дух славы и Дух Божий[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. «Христа»; здесь переведено «Мессии», поскольку Χριστός употреблено как титул.
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «славный Дух Божий» или «Дух славы, то есть Дух Божий».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: вас оскорбляют
  rationale: Настоящее время страдательного залога описывает словесные оскорбления и публичное бесчестье; эта формулировка естественна в современном русском языке.
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: за имя Мессии
  rationale: Оборот указывает на оскорбления из-за принадлежности к Мессии и исповедания его имени. «За имя» естественно передаёт причинный смысл, не устраняя образ имени.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь сохраняет силу титула, поэтому выбран эквивалент «Мессия», а не ставшее именеподобным «Христос».
- source_word: μακάριοι
  choice: блаженны
  rationale: «Блаженны» передаёт богословскую и формульную окраску μακάριοι точнее, чем субъективное «счастливы».
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: Дух славы и Бога
  rationale: Формулировка сохраняет оба родительных определения при одном слове «Дух» и не решает однозначно, являются ли они однородными или второе поясняет первое.
- source_word: ἀναπαύεται
  choice: покоится на вас
  rationale: Глагол означает «почивать, покоиться» и перекликается с библейским образом Духа, пребывающего на человеке.
theological_decisions:
- issue: Как понимать τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: Дух славы и Бога
  alternative: славный Дух Божий; Дух славы, то есть Дух Божий
  rationale: Греческая конструкция допускает как соотнесение двух родительных определений с одним Духом, так и пояснительное понимание второго определения. Основной текст сохраняет эту неоднозначность.
- issue: Передача Χριστός как титула
  choice: Мессия
  alternative: Христос
  rationale: В выражении «имя Мессии» титульное значение остаётся заметным; перевод не превращает титул в личное имя.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Блаженны» и «покоится» сохраняют достоинство и межтекстовые ассоциации, а синтаксис остаётся доступным обычному читателю.
