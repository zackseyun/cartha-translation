  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: ru
  text: чтобы оставшееся время жизни во плоти[a] жить уже не по человеческим желаниям, а по воле Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оставшееся время в теле». Греческое выражение «во плоти» здесь означает земную жизнь в теле и не обязательно относится к «греховной природе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ
  choice: чтобы
  rationale: Предлог с субстантивированным инфинитивом выражает цель или результат по отношению к предыдущему стиху; «чтобы» естественно передаёт эту связь по-русски.
- source_word: μηκέτι
  choice: уже не
  rationale: Передаёт прекращение прежнего образа жизни и звучит естественно в современном русском.
- source_word: ἀνθρώπων
  choice: человеческим
  rationale: Родительный множественного числа имеет обобщённое значение и относится ко всем людям, а не только к мужчинам.
- source_word: ἐπιθυμίαις
  choice: желаниям
  rationale: Слово обозначает желания или влечения; «похоти» было бы уже по смыслу и могло бы создать преимущественно сексуальную ассоциацию.
- source_word: ἀλλὰ
  choice: а
  rationale: Выражает резкое противопоставление двух направляющих начал жизни; в конструкции «не… а…» это наиболее естественный русский эквивалент.
- source_word: θελήματι θεοῦ
  choice: по воле Бога
  rationale: Дательный указывает на норму или направляющее начало жизни. «По воле Бога» ясно сохраняет противопоставление человеческим желаниям.
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: оставшееся время жизни
  rationale: Передаёт оставшийся срок земной жизни человека; добавление «жизни» естественно для русского и проясняет подразумеваемый смысл без его богословского расширения.
- source_word: ἐν σαρκὶ
  choice: во плоти
  rationale: Сохраняет ключевой образ греческого текста. Здесь выражение обозначает телесную земную жизнь, а не обязательно греховную природу; возможное пояснение дано в сноске.
- source_word: βιῶσαι
  choice: жить
  rationale: Инфинитив обозначает проживание или проведение оставшегося времени; прямой русский эквивалент «жить» сохраняет словесную форму исходного текста.
theological_decisions:
- issue: Значение σάρξ в выражении ἐν σαρκὶ
  choice: телесная земная жизнь («во плоти»)
  alternative: греховная природа
  rationale: Контекст говорит об оставшемся времени смертной человеческой жизни. Хотя рядом противопоставлены прежнее греховное поведение и исполнение Божьей воли, само выражение здесь не называет внутреннее греховное начало.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Конструкция «не по… а по…» естественно передаёт контраст исходного текста; буквальное «во плоти» сохранено и пояснено сноской.
