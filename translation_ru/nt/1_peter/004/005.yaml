lexical_decisions:
- source_word: οἳ
  choice: Они
  rationale: Относительное местоимение отсылает к людям, упомянутым в предыдущем стихе; самостоятельное «Они» естественно начинает новое русское предложение.
- source_word: ἀποδώσουσιν λόγον
  choice: дадут отчёт
  rationale: Греческое выражение означает, что человек должен ответить за свои поступки; «дадут отчёт» сохраняет судебный оттенок и понятно современному читателю.
- source_word: τῷ
  choice: Тому
  rationale: Артикль с причастным оборотом употреблён субстантивно. «Тому, кто» не называет Судью прямо и тем самым сохраняет формулировку источника.
- source_word: ἑτοίμως ἔχοντι κρῖναι
  choice: кто готов судить
  rationale: Оборот буквально передаёт состояние готовности судить. Русское «готов судить» естественно и точно, не добавляя образа или временного оттенка, отсутствующего в греческом тексте.
- source_word: ζῶντας καὶ νεκρούς
  choice: живых и мёртвых
  rationale: Краткая традиционная формула точно передаёт два субстантивированных прилагательных и сохраняет всеобщий эсхатологический охват.
theological_decisions:
- issue: Кто именно назван готовым судить живых и мёртвых
  choice: 'Судья прямо не назван: «Тому, кто готов судить»'
  alternative: Явно назвать Бога или Христа
  rationale: В данном греческом стихе Судья не назван по имени. Хотя более широкий контекст Нового Завета связывает суд и с Богом, и с Христом, перевод не должен устранять сохраняемую текстом богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная, сдержанная и торжественная. Прописная буква в «Тому» указывает на божественного Судью, не уточняя вопреки греческому тексту, идёт ли речь непосредственно о Боге или о Христе.
