source:
  edition: SBLGNT
  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: ru
  text: Но если кто страдает как христианин, пусть не стыдится, а как носитель этого имени прославляет Бога[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «в этом имени». Вероятнее всего, речь идёт об имени «христианин». Возможно также понимание: «в этом деле» или «в этом отношении».'
    reason: Сохраняет буквальную форму греческого выражения и отмечает альтернативное понимание предложного оборота.
lexical_decisions:
- source_word: εἰ δὲ
  choice: Но если
  rationale: Передаёт условие и мягкое противопоставление, выраженное δέ.
- source_word: ὡς Χριστιανός
  choice: как христианин
  rationale: Χριστιανός — уже сложившееся наименование последователя Христа; обычное русское «христианин» точно и понятно передаёт его значение.
- source_word: μὴ αἰσχυνέσθω
  choice: пусть не стыдится
  rationale: Сохраняет побудительную силу формы третьего лица и естественно звучит по-русски.
- source_word: δοξαζέτω δὲ τὸν θεόν
  choice: а прославляет Бога
  rationale: Передаёт повелительное значение δοξαζέτω и подчёркнутое δέ противопоставление стыду.
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: за это имя
  rationale: 'Естественно передаёт вероятный смысл: прославлять Бога в связи с тем, что человек носит имя «христианин». Более буквальная, но неестественная для современного русского конструкция «в этом имени» и иные возможные понимания сохранены в сноске.'
theological_decisions:
- issue: К чему относится выражение ἐν τῷ ὀνόματι τούτῳ
  choice: 'К наименованию «христианин»: человек прославляет Бога за то, что носит это имя.'
  alternative: «В этом деле / в этом отношении», то есть в данных обстоятельствах страдания.
  rationale: Ближайшее предшествующее слово — Χριστιανός, а ὄνομα обычно означает имя или наименование. Сноска сохраняет неоднозначность предложного оборота.
- issue: Подразумеваемое действие после εἰ δὲ ὡς Χριστιανός
  choice: Явно передать «кто страдает», восстановив смысл из контекста предыдущего стиха.
  alternative: 'Сохранить эллипсис: «Но если как христианин…»'
  rationale: В греческом глагол подразумевается из непосредственного контекста. В русском без него фраза звучит обрывочно; его восстановление не добавляет новой мысли, а делает подразумеваемую связь ясной.
translation_notes:
  register: Современный литературный русский язык; ясная и достойная форма без архаизации. Подразумеваемый из контекста глагол «страдает» восстановлен ради естественного русского синтаксиса.
