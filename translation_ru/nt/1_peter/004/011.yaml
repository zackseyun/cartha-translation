source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: ru
  text: Если кто говорит, пусть говорит как тот, кто возвещает Божьи изречения[a]; если кто служит, пусть служит той силой, которую даёт Бог[b], чтобы во всём прославлялся Бог через Иисуса Мессию. Ему принадлежат слава и владычество во веки веков[c][d]. Аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как Божьи речения». Греческое слово λόγια означает изречения, имеющие божественный авторитет.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как от силы, которую предоставляет Бог».'
    reason: syntactical_alternative
  - marker: c
    text: Слово «Ему» грамматически естественнее всего отнести к Иисусу Мессии, ближайшему названному лицу. Однако возможен и смысл, при котором славословие обращено к Богу Отцу, упомянутому непосредственно перед этим.
    reason: alternative_reading
  - marker: d
    text: 'Буквально: «в века веков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: говорит
  rationale: Обычный глагол речи сохраняет широту греческого слова и не сужает смысл до проповеди или официального учительства.
- source_word: λόγια θεοῦ
  choice: изречения Божьи
  rationale: λόγια обозначает изречения, прежде всего божественные; «изречения Божьи» передаёт возвышенный смысл точнее, чем просто «слова Бога», и остаётся понятным современному читателю.
- source_word: διακονεῖ
  choice: служит
  rationale: Передаёт широкий смысл практического служения, не ограничивая его церковной должностью.
- source_word: ἐξ ἰσχύος
  choice: от силы
  rationale: 'Предлог ἐξ указывает на источник: служение должно исходить из силы, которую предоставляет Бог.'
- source_word: χορηγεῖ
  choice: даёт
  rationale: Естественное современное соответствие со значением предоставления необходимого; контекст ясно указывает, что Бог является источником силы.
- source_word: ἐν πᾶσιν
  choice: во всём
  rationale: Кратко и естественно передаёт всеохватный смысл выражения.
- source_word: δοξάζηται
  choice: прославлялся
  rationale: Сохраняет пассивный залог и целевое значение конструкции с ἵνα.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: через Иисуса Мессию
  rationale: διά передано как «через», а Χριστός — как титул «Мессия» в естественной русской форме винительного падежа.
- source_word: κράτος
  choice: владычество
  rationale: В славословии слово обозначает действенную верховную власть; «владычество» сохраняет царственный и торжественный оттенок.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устоявшееся и понятное русское библейское выражение, близко воспроизводящее греческую идиому.
theological_decisions:
- issue: К кому относится ᾧ («Ему») в заключительном славословии
  choice: В основном тексте местоимение отнесено к ближайшему предшествующему именованию — Иисусу Мессии.
  alternative: Славословие может относиться к Богу Отцу, упомянутому как тот, кто прославляется через Иисуса Мессию.
  rationale: Ближайший грамматический антецедент — Ἰησοῦ Χριστοῦ, однако ход всей целевой части позволяет понимать адресатом Бога. Неоднозначность отмечена в сноске, а не устранена догматически.
- issue: Эллиптическая сила ὡς в двух наставлениях
  choice: 'В первой части восполнено «пусть говорит», а во второй сравнительная конструкция сохранена кратко: «как от силы».'
  alternative: Во второй части возможно более разъяснительное «пусть служит силой, которую даёт Бог».
  rationale: Греческий текст эллиптичен. Русская формулировка сохраняет параллелизм и источник силы, не превращая сравнение в более категоричное отождествление.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранены параллелизм двух условных наставлений, целевая конструкция и неоднозначность адресата славословия. «Божьи» употреблено как естественная современная форма, а «владычество» и «во веки веков» поддерживают достойный доксологический регистр.
