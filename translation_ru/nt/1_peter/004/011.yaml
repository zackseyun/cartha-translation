  terminology: «Божьи изречения», «служит», «Иисуса Мессию», «владычество» и «во веки веков» соответствуют регистру и терминологии. «Мессия» сохраняет титульный характер Χριστός. Сноска о возможной отнесённости славословия к Богу Отцу уместно сохраняет синтаксически обсуждаемую неоднозначность.
