- from: Потому что настало время суду начаться с Божьего дома[a]. Если же он начинается прежде с нас, то какой конец[b] ожидает тех, кто не повинуется[c] Божьей Благой Вести?
  to: Ибо пришло время, чтобы суд начался с Божьего народа[a]. А если суд начинается прежде с нас, то каков будет исход[b] тех, кто не повинуется[c] Евангелию Божьему?
