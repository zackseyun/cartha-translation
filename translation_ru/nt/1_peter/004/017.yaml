  source_fidelity: 'Основной смысл передан верно: καιρός — наступившее время, κρίμα — «суд», ἀπό — исходная точка суда, а ἀπειθέω — неповиновение Благой Вести. Однако «Божий дом» в современном русском может прежде всего означать храм/здание, тогда как контекст и повтор «с нас» указывают на общину Божьего народа; «Божья семья» — неудачная лексическая альтернатива для οἶκος. Кроме того, «Благая Весть» с прописных букв выглядит как конфессионально-редакционное оформление, а не как необходимость текста.'
  naturalness: '«Потому что настало время суду начаться» грамматически возможно, но тяжеловесно. «Ибо пришло время, чтобы суд начался…» — естественный современный литературный вариант с сохранением причинной связи и смысла. «Если же он начинается прежде с нас» лучше заменить на «а если суд начинается прежде с нас»: это снимает не вполне ясную анафору «он» и воспроизводит эллиптически повторяемое κρίμα.'
  terminology: «Суд» удачно сохраняет широту κρίμα, не навязывая значения осуждения либо дисциплины. «Божий народ» в тексте точнее передаёт личный/общинный референт οἶκος; образ «дома» можно сохранить в сноске как буквальную альтернативу. «Евангелие Божье» — устойчивый современный библейский термин и точнее соответствует τῷ τοῦ θεοῦ εὐαγγελίῳ без излишней капитализации.
