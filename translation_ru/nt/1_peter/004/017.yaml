  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: ru
  text: Ибо пришло время, чтобы суд начался с Божьего народа[a]. А если суд начинается прежде с нас, то каков будет исход[b] тех, кто не повинуется[c] Евангелию Божьему?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с дома Божьего». Греческое слово может означать «дом» или «домашние»; здесь, вероятнее всего, речь идёт о Божьем народе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «конец». Греческое слово может означать «конец», «исход» или «результат».'
    reason: lexical_alternative
  - marker: c
    text: 'Также возможно: «тех, кто отказывается верить». Греческое слово может выражать и неповиновение, и неверие как отклик на Евангелие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: Потому что
  rationale: Союз вводит основание для предшествующего наставления; причинная связь в русском языке выражена ясно и естественно.
- source_word: ὁ καιρός
  choice: настало время
  rationale: Имеется в виду наступивший, уместный или назначенный момент, а не просто хронологическое время.
- source_word: τοῦ ἄρξασθαι τὸ κρίμα
  choice: суду начаться
  rationale: Конструкция с артиклевым инфинитивом после καιρός естественно передана русским оборотом «время суду начаться»; «суд» сохраняет широту κρίμα и не сводит его ни к осуждению, ни к воспитательной мере.
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: с Божьего дома
  rationale: «Дом» сохраняет образ и многозначность οἶκος, а контекстуальное «с нас» показывает, что речь идёт о Божьем народе; предлог «с» точно передаёт исходную точку ἀπό.
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: Если же он начинается прежде с нас
  rationale: Глагол «начинается» восполнен из первой части для ясности; «прежде» передаёт πρῶτον как первоочерёдность суда над Божьим народом.
- source_word: τέλος
  choice: конец
  rationale: Буквальное и естественное соответствие, сохраняющее эсхатологическую силу и допустимое значение «исход»; эта вариативность отмечена в сноске.
- source_word: ἀπειθούντων
  choice: тех, кто не повинуется
  rationale: Передаёт неповиновение Благой Вести и не устраняет возможный оттенок неверия или отказа поверить, отмеченный в сноске.
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: Божьей Благой Вести
  rationale: Дательный падеж обусловлен управлением «повиноваться»; родительный τοῦ θεοῦ передан притяжательным прилагательным, а εὐαγγέλιον — понятным современным выражением «Благая Весть».
theological_decisions:
- issue: Характер κρίμα применительно к Божьему народу
  choice: «суд» без уточнения его как осуждения или наказания
  alternative: «осуждение»; «наказание»; «вразумление»
  rationale: Греческое слово обозначает Божье судебное действие в широком смысле. Более узкие варианты преждевременно разрешили бы напряжение между судом над Божьим домом и концом непокорных Благой Вести.
- issue: Значение «Божьего дома»
  choice: Сохранён образ «дом», при этом следующая фраза «с нас» указывает на Божий народ
  alternative: Эксплицитное «Божья семья» или «Божий народ»; буквальное понимание здания или храма
  rationale: οἶκος допускает значения дома и домашних. Сохранение образа отражает греческую формулировку и её связь с образом духовного дома в 1 Пет. 2:5, не создавая впечатления, будто речь идёт лишь о здании.
- issue: Связь неповиновения и неверия в ἀπειθούντων
  choice: «не повинуется» с указанием альтернативы в сноске
  alternative: «не верит»; «отказывается поверить»
  rationale: Форма обозначает непокорный отклик на Благую Весть и может включать неверие. Основной текст сохраняет значение неповиновения, не исключая оттенка неверия.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Порядок слов слегка приближен к русской норме, при этом сохранены повтор исходной точки («с Божьего дома», «с нас»), риторический вопрос и богословская напряжённость текста. «Благая Весть» выбрана как ясное современное обозначение εὐαγγέλιον.
