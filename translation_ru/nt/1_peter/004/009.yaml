lexical_decisions:
- source_word: φιλόξενοι
  choice: Будьте гостеприимны
  rationale: Прилагательное употреблено в контексте как призыв; форма «будьте гостеприимны» естественно передаёт побудительную силу и сохраняет образ состояния или качества, не заменяя его более свободным выражением.
- source_word: εἰς ἀλλήλους
  choice: друг к другу
  rationale: Выражение передаёт взаимную направленность внутри общины; «друг к другу» естественно и точно сохраняет взаимный смысл.
- source_word: ἄνευ
  choice: без
  rationale: Прямо передаёт значение отсутствия чего-либо.
- source_word: γογγυσμοῦ
  choice: ропота
  rationale: «Ропот» передаёт недовольное, нередко вполголоса выражаемое возражение или жалобу в общинном контексте. Это слово уместно в современном литературном библейском регистре, хотя несколько более нейтральное «недовольство» также возможно.
