base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: ru
  text: Итак, пусть и те, кто страдает по воле Бога, вверяют свои души[a] верному Творцу, делая добро.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «свои жизни» или «самих себя»: греческое слово может означать душу, жизнь или самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения и естественно звучит в современном русском языке.
- source_word: οἱ πάσχοντες
  choice: страдающие
  rationale: Субстантивированное причастие настоящего времени обозначает людей, которые терпят страдания.
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: по воле Бога
  rationale: Кратко и естественно передаёт соответствие Божьей воле, не уточняя, идёт ли речь о дозволении, предопределении или иной форме отношения Бога к страданию.
- source_word: πιστῷ κτίστῃ
  choice: верному Творцу
  rationale: «Верному» передаёт надёжность и постоянство πιστός; «Творцу» точно соответствует κτίστῃ и в русском естественно употребляется с определённым референтом без артикля.
- source_word: παρατιθέσθωσαν
  choice: пусть вверяют
  rationale: Передаёт повелительное наклонение и значение поручения себя чьей-либо надёжной заботе; несовершенный вид уместен для продолжающегося поведения.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: свои души
  rationale: Возвратное «свои» естественно соотносит души с подлежащим; «души» сохраняет ключевой образ ψυχή, а более широкие значения отмечены в сноске.
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: делая добро
  rationale: 'Естественно передаёт образ действия или сопутствующее обстоятельство: вверение Богу совершается при продолжающемся доброделании.'
theological_decisions:
- issue: Отношение страдания к Божьей воле
  choice: по воле Бога
  alternative: в соответствии с волей Бога
  rationale: Формулировка сохраняет утверждение греческого текста, но не определяет точный механизм Божьего отношения к страданию.
- issue: Значение ψυχή в контексте
  choice: души
  alternative: жизни; самих себя
  rationale: Основной текст сохраняет традиционное и богословски значимое соответствие, тогда как семантическая широта слова обозначена в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис с «пусть» ясно передаёт побуждение. Формулировка торжественная, но понятная; богословская неоднозначность оригинала сохранена.
