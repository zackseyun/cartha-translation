  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: ru
  text: Но конец всего уже близок.[a] Поэтому будьте рассудительны и сохраняйте ясность ума для молитв.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конец всего приблизился». Греческий перфект можно передать как совершившееся приближение («приблизился») или как нынешнее состояние, возникшее в результате этого приближения («уже близок»).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будьте здравомыслящи и бодрствуйте, чтобы молиться». Оба повеления подчёркивают здравость суждения и духовную собранность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: всему
  rationale: 'Субстантивированное среднее множественное πᾶς в сочетании с τέλος естественно передаётся по-русски местоимением «всему»: «всему конец».'
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает мягкий переход с оттенком противопоставления предшествующему контексту; «но» сохраняет этот поворот мысли.
- source_word: τὸ τέλος
  choice: конец
  rationale: В данном эсхатологическом контексте прямое значение «конец» предпочтительнее вариантов «итог» или «цель».
- source_word: ἤγγικεν
  choice: приблизился
  rationale: Перфект выражает наступившее в результате приближения состояние. «Приблизился» сохраняет аспект греческой формы, а вариант «близок» указан в примечании.
- source_word: σωφρονήσατε
  choice: будьте благоразумны
  rationale: Глагол призывает к здравому, уравновешенному суждению и владению собой. «Будьте благоразумны» естественно выражает прежде всего ясность и здравость мышления.
- source_word: οὖν
  choice: Поэтому
  rationale: Союз явно вводит практический вывод из утверждения о близости конца.
- source_word: νήψατε
  choice: трезвы
  rationale: В Новом Завете νήφω употребляется образно и обозначает духовную бдительность и ясность ума. «Трезвы» сохраняет метафору оригинала без добавления прямого требования воздержания от вина.
- source_word: εἰς προσευχάς
  choice: ради молитв
  rationale: εἰς указывает здесь на цель, а множественное προσευχάς сохранено как «молитв», что может подразумевать неоднократные молитвенные действия.
theological_decisions:
- issue: Эсхатологический смысл выражения «всему конец»
  choice: Сохранено прямое утверждение о приблизившемся конце без уточнения хронологии или эсхатологической системы.
  alternative: Понимать τέλος преимущественно как «цель» либо ослабить будущую эсхатологическую направленность.
  rationale: Контекст связывает близость конца с настоятельным призывом к благоразумию, бдительности и молитве; перевод сохраняет эту напряжённость, не вводя конфессиональной схемы.
- issue: Связь благоразумия и трезвости с молитвами
  choice: Оба повеления представлены как необходимые ради молитв.
  alternative: Связать цель только со вторым повелением или передать προσευχάς отвлечённым единственным числом «молитва».
  rationale: Греческий порядок естественно позволяет отнести εἰς προσευχάς к обоим повелениям, а множественное число следует сохранить.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Конструкция «всему конец» кратка и естественна; «благоразумны и трезвы» сохраняет различие двух близких греческих призывов. Все примечания отмечены в основном тексте.
