  source_fidelity: 'Основной смысл передан верно: τέλος имеет эсхатологический смысл, ἤγγικεν выражает близость как настоящее состояние, а два повеления направлены к молитве. Однако «ради молитв» в современном русском неестественно передаёт целевое εἰς, а одиночное «трезвы» без уточнения легко воспринимается как указание на воздержание от алкоголя, а не как образ ясности и духовной собранности.'
