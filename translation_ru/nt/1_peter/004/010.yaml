source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: ru
  text: Служите друг другу[a], каждый тем даром, какой получил, как добрые распорядители многообразной Божьей благодати.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди вас»; букв. «себе самим».'
    reason: 'Лексико-синтаксическая альтернатива для εἰς ἑαυτούς: выражение может подчёркивать как взаимную направленность, так и общину как сферу служения.'
lexical_decisions:
- source_word: ἕκαστος
  choice: каждый
  rationale: 'Сохраняет распределительное значение: увещание относится к каждому члену общины лично.'
- source_word: καθὼς ἔλαβεν χάρισμα
  choice: тем даром, какой получил
  rationale: Передаёт соответствие между полученным даром и служением; «дар» сохраняет широту χάρισμα и не сужает значение до специального термина «духовный дар».
- source_word: εἰς ἑαυτοὺς
  choice: друг другу
  rationale: В данном контексте возвратное местоимение во множественном числе естественно выражает взаимную направленность служения внутри общины. Более буквальная пространственно-общинная передача отмечена в сноске.
- source_word: αὐτὸ διακονοῦντες
  choice: служите … тем даром
  rationale: Русская конструкция с творительным падежом естественно передаёт использование полученного дара в служении; форма повелительного наклонения выражает увещевательную силу причастия.
- source_word: καλοὶ οἰκονόμοι
  choice: добрые распорядители
  rationale: «Распорядители» передаёт доверенное управление принадлежащим другому, а «добрые» сохраняет широкую положительную характеристику καλοί без добавления значения «верные».
- source_word: ποικίλης χάριτος θεοῦ
  choice: многообразной Божьей благодати
  rationale: «Многообразной» передаёт множество форм проявления благодати, а притяжательное прилагательное «Божьей» естественно выражает греческий генитив.
theological_decisions:
- issue: Следует ли понимать χάρισμα как узкий технический термин «духовный дар»
  choice: дар
  alternative: духовный дар; благодатный дар
  rationale: Само существительное не требует узкого технического смысла. «Дар» сохраняет лексическую широту, тогда как связь с Божьей благодатью ясно выражена во второй части стиха.
- issue: Как передать общинную направленность εἰς ἑαυτούς
  choice: друг другу
  alternative: среди вас; для самих себя
  rationale: В контексте служения русское «друг другу» наиболее естественно передаёт взаимность внутри общины. Сноска сохраняет более буквальную форму и возможный акцент на общине как сфере служения.
- issue: Как выразить увещевательную силу διακονοῦντες
  choice: повелительное «служите»
  alternative: служа; пусть каждый служит
  rationale: Независимое повелительное предложение ясно передаёт функцию греческого причастия в контексте наставления и позволяет избежать неестественной русской конструкции.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Перестановка «каждый тем даром» после основного повеления устраняет грамматическое столкновение единственного числа ἕκαστος с обращённым ко всей общине призывом и сохраняет индивидуальный акцент.
