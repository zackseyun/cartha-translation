  rationale: Заменено «осуждены» на нейтральное «судимы», чтобы не навязывать исход суда, которого κριθῶσι само по себе не выражает. Усилена передача εἰς τοῦτο γὰρ καί, уточнена сноска к антитезе «плоть — дух» и сохранена намеренная неоднозначность спорных выражений.
