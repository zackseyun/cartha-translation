  naturalness: Текст в целом литературен. «Ведь именно для этого и» яснее передаёт сочетание εἰς τοῦτο γὰρ καί, чем «Ведь для того и». Строчная буква в «благая весть» естественна, если это не оформленное как собственное имя наименование.
  terminology: «Во плоти» и «в духе» удачно сохраняют исходную антитезу и не отождествляют πνεύματι со Святым Духом. «По Богу» оставлено как краткая библейская формула, соответствующая исходной неоднозначности. Сноска к «плоти» уточнена, чтобы не приравнивать её без остатка к телесной жизни.
