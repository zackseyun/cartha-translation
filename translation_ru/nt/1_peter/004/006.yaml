id: 1PE.4.6
reference: 1 Peter 4:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: ru
  text: 'Ведь именно для этого и мёртвым была возвещена благая весть: чтобы они, хотя и были судимы по-человечески во плоти[a], жили по Богу в духе[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по меркам людей» или «в отношении плоти». Греческое выражение буквально означает «по людям» и может указывать на человеческую оценку или норму; «во плоти» противопоставлено «в духе».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Духом». Выражение может обозначать духовную сферу жизни в противопоставлении плоти; некоторые понимают его как жизнь посредством Святого Духа.'
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: для того
  rationale: Естественно передаёт целевое значение выражения в связи с последующим ἵνα; частица «ведь» отражает объяснительную силу γάρ.
- source_word: νεκροῖς
  choice: мёртвым
  rationale: Субстантивированное прилагательное в дательном падеже; перевод намеренно не уточняет, в каком смысле и в какой момент они названы мёртвыми.
- source_word: εὐηγγελίσθη
  choice: была возвещена Благая Весть
  rationale: Пассивная форма εὐαγγελίζω передана без указания проповедника; «Благая Весть» ясно выражает содержание глагола и сохраняет возвышенный современный регистр.
- source_word: ἵνα
  choice: чтобы
  rationale: Передаёт целевое или целево-результативное значение союза.
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: хотя и были осуждены ... жили
  rationale: Уступительная конструкция по-русски естественно выражает контраст μέν...δέ. «Осуждены» здесь лучше, чем нейтральное «судимы», передаёт неблагоприятный исход суда, не уточняя его субъект.
- source_word: κατὰ ἀνθρώπους
  choice: по-человечески
  rationale: Передаёт стандарт или перспективу людей и естественно противопоставляется выражению «по Богу»; возможные оттенки пояснены в сноске.
- source_word: σαρκί
  choice: во плоти
  rationale: Сохраняет явную параллель с πνεύματι и не подменяет «плоть» понятием греховной природы.
- source_word: κατὰ θεόν
  choice: по Богу
  rationale: Сохраняет краткую и намеренно неоднозначную параллель κατὰ ἀνθρώπους ... κατὰ θεόν, не сводя смысл только к Божьей оценке или воле.
- source_word: πνεύματι
  choice: в духе
  rationale: Передаёт дательный сферы в параллели с «во плоти»; строчная буква не навязывает отождествление со Святым Духом.
theological_decisions:
- issue: Кто такие «мёртвые»
  choice: Оставлено нейтральное «мёртвым» без пояснения в основном тексте.
  alternative: Умершие к настоящему времени, духовно мёртвые либо мёртвые, связанные с возвещением из 3:19.
  rationale: Греческий текст сам не разрешает спор о том, были ли адресаты физически мертвы во время возвещения и как стих связан с 3:19.
- issue: Смысл противопоставления суда во плоти и жизни в духе
  choice: Сохранена антитеза «осуждены по-человечески во плоти — жили по Богу в духе».
  alternative: Осуждены людьми в земной жизни; подверглись общей людям телесной смерти; судимы Богом в телесной сфере, но живут духовно.
  rationale: Формулировка сохраняет богословское напряжение и не определяет сверх текста ни субъект суда, ни точное значение сфер плоти и духа.
- issue: Значение πνεύματι
  choice: «в духе» со строчной буквы.
  alternative: «Духом», то есть посредством Святого Духа.
  rationale: Дательный падеж наиболее непосредственно параллелен σαρκί и может обозначать сферу жизни; явного указания на Святого Духа нет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены симметрия «по-человечески — по Богу» и «во плоти — в духе». Формулировка не уточняет личность мёртвых, субъект суда и референт «духа».
