  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: ru
  text: Их удивляет, что вы не устремляетесь вместе с ними в тот же поток распутства[b], и они злословят вас[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Буквально: «в тот же разлив (или: излияние) распутства».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «поносят вас»; возможен также более общий перевод: «говорят хулу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: что
  rationale: Оборот связывает удивление с последующим обстоятельством — отказом адресатов участвовать в прежнем образе жизни. В современном русском эта связь естественно выражается изъяснительным союзом «что»; отдельное «в этом» было бы тяжеловесно.
- source_word: ξενίζονται
  choice: удивляются
  rationale: Глагол означает, что нечто кажется странным или вызывает удивление. «Удивляются» ясно и естественно передаёт значение настоящего времени.
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: вы не устремляетесь вместе с ними
  rationale: Причастный оборот передан личным придаточным. «Устремляетесь вместе» сохраняет заложенный в συντρέχω образ совместного движения и смысл соучастия.
- source_word: εἰς τὴν αὐτὴν
  choice: в тот же
  rationale: Предлог εἰς обозначает направленность внутрь, а αὐτήν — тождественность тому образу жизни, которому предаются окружающие.
- source_word: τῆς ἀσωτίας
  choice: распутства
  rationale: ἀσωτία обозначает нравственно необузданную, расточительную жизнь. «Распутство» понятно современному читателю и сохраняет сильную отрицательную оценку, не сужая смысл исключительно до сексуального поведения.
- source_word: ἀνάχυσιν
  choice: поток
  rationale: Существительное обозначает излияние или разлив. «Поток» сохраняет метафору неудержимого избытка и естественно сочетается с глаголом движения.
- source_word: βλασφημοῦντες
  choice: и злословят вас
  rationale: В данном контексте речь идёт о враждебной речи в адрес верующих. «Злословят» передаёт широкий смысл оскорбительной и порочащей речи; подразумеваемое дополнение «вас» прояснено из контекста.
theological_decisions:
- issue: Направленность βλασφημοῦντες
  choice: 'враждебная речь против верующих: «злословят вас»'
  alternative: «богохульствуют» или «говорят хулу» без указанного объекта
  rationale: Ближайший контекст описывает реакцию окружающих на изменившееся поведение адресатов. Перевод «богохульствуют» без достаточного основания направил бы речь исключительно против Бога, тогда как греческий глагол может обозначать поношение людей.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Сохранена образность совместного движения в поток и нравственная сила ἀσωτία; архаичное или вводящее в заблуждение «богохульствуют» в основном тексте не использовано.
