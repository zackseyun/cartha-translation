    text: Ср. Притч 10:12. Здесь «покрывает» может подразумевать, что любовь не разжигает раздоры из-за проступков, однако сама метафора допускает более широкий смысл.
    reason: cross_reference
lexical_decisions:
- source_word: πρὸ πάντων
  choice: прежде всего
  rationale: Устойчивое русское выражение ясно обозначает первостепенную важность наставления, а не только временную последовательность.
- source_word: εἰς ἑαυτοὺς
  choice: друг к другу
  rationale: В контексте общины возвратное местоимение имеет взаимное значение; этот вариант естественно передаёт направленность любви членов общины друг к другу.
- source_word: ἀγάπην
  choice: любовь
  rationale: Прямой и общепринятый русский эквивалент, уместный в данном контексте.
- source_word: ἐκτενῆ
  choice: горячую
  rationale: Передаёт напряжённость и искреннюю силу любви; возможные оттенки усердия и постоянства отмечены в сноске.
- source_word: ἔχοντες
  choice: сохраняйте
  rationale: Причастие продолжает ряд наставлений и имеет побудительную силу. «Сохраняйте» естественно по-русски передаёт продолжающееся обладание такой любовью.
- source_word: ὅτι
  choice: потому что
  rationale: Ясно выражает причинную связь между наставлением и следующим изречением.
- source_word: καλύπτει
  choice: покрывает
  rationale: Сохраняет исходную метафору и отзвук Притч 10:12, не сводя смысл исключительно к прощению, сокрытию или пренебрежению проступками.
- source_word: πλῆθος
  choice: множество
  rationale: Точно и естественно передаёт собирательное значение существительного и его риторическую весомость.
- source_word: ἁμαρτιῶν
  choice: грехов
  rationale: Прямой эквивалент родительного падежа без неоправданного смыслового сужения.
theological_decisions:
- issue: Смысл выражения «любовь покрывает множество грехов»
  choice: Сохранить метафору «покрывает», не уточняя, чьи именно это грехи и каким образом любовь их покрывает.
  alternative: «Любовь не замечает многих проступков» или «любовь приносит прощение многих грехов».
  rationale: Греческое изречение допускает несколько взаимосвязанных толкований и перекликается с Притч 10:12. Буквенная метафора сохраняет эту богословскую напряжённость и не вводит отсутствующее в тексте учение о заслуге, автоматическом прощении или простом сокрытии проступков.
translation_notes:
  register: Современный литературный русский язык с ясной побудительной формой. Синтаксис сделан самостоятельным и естественным для отдельного стиха, при этом сохранены ключевая метафора и лаконичность оригинала.
