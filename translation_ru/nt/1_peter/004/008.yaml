  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: ru
  text: Прежде всего, горячо любите друг друга[a], потому что любовь покрывает множество грехов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «усердно», «неослабевающе». Греческое слово может подчёркивать как силу, так и постоянство любви.'
