  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: ru
  text: Возлюбленные, не удивляйтесь огненному испытанию среди вас, которое происходит, чтобы испытать вас, словно с вами происходит нечто странное.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не удивляйтесь огненному испытанию, происходящему среди вас, чтобы испытать вас». Греческое слово буквально вызывает образ горения или огня, а слово, переданное как «испытать», может означать также «подвергать испытанию», «проверять» или, в других контекстах, «искушать».'
    reason: Лексические и синтаксические варианты πυρώσει и πρὸς πειρασμόν.
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Возлюбленные
  rationale: Сохраняет форму обращения, тёплый пастырский тон и связь с лексикой любви; в современном литературном русском звучит возвышенно, но понятно.
- source_word: μὴ ξενίζεσθε
  choice: не удивляйтесь
  rationale: Естественно передаёт запрет считать происходящее неожиданным или чуждым; смысловая связь с ξένου далее частично сохраняется через «нечто странное».
- source_word: τῇ ἐν ὑμῖν πυρώσει
  choice: огненному испытанию, происходящему среди вас
  rationale: «Огненное испытание» сохраняет образ огня и в контексте ясно обозначает тяжёлое страдание; ἐν ὑμῖν передано корпоративно как «среди вас».
- source_word: πρὸς πειρασμὸν ὑμῖν γινομένῃ
  choice: происходящему среди вас для вашего испытания
  rationale: Причастная конструкция сохраняет продолжающееся событие, а πρὸς πειρασμόν передано как цель или результат проверки. Повтор «испытание» отражает тесную смысловую связь, хотя в русском он заметнее, чем в греческом.
- source_word: ὡς ξένου ὑμῖν συμβαίνοντος
  choice: словно с вами происходит нечто странное
  rationale: Естественная русская конструкция сохраняет значение ξένος как странного, непривычного события и перекличку с ξενίζεσθε.
theological_decisions:
- issue: Значение πειρασμός в контексте
  choice: испытание, проверяющее верующих
  alternative: искушение к греху
  rationale: Контекст страданий и образ огня указывают на проверяющее испытание, а не на побуждение ко злу.
- issue: Направленность πρὸς πειρασμόν
  choice: «для вашего испытания» — цель или назначение происходящего
  alternative: «как испытание» — характеристика самого бедствия
  rationale: Предлог πρός допускает целевое понимание; формулировка не уточняет, кто является непосредственным устроителем испытания, и тем самым не вносит лишнего богословского вывода.
translation_notes:
  register: Современный литературный русский с достоинством пастырского обращения. Сохранены огненная метафора, общинное «среди вас» и намеренный смысловой повтор, присутствующий в исходной конструкции.
