    rationale: Причастие среднего рода «предназначенному» формально согласуется с «испытанию», но сочетание утяжеляет фразу. Более прозрачна конструкция «которое происходит, чтобы испытать вас».
  revised_text: Возлюбленные, не удивляйтесь огненному испытанию среди вас, которое происходит, чтобы испытать вас, словно с вами происходит нечто странное.[a]
