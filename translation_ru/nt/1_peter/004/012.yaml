  rationale: Перестроена причастная конструкция, чтобы γινομένῃ ясно относилось к «огненному испытанию», а πρὸς πειρασμόν было передано естественной целевой конструкцией. Сохранены образ огня, общинный оттенок ἐν ὑμῖν, продолжающееся происходящее событие и смысловая перекличка «не удивляйтесь» — «странное».
