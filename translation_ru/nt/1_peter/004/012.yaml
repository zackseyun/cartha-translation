    rationale: Повтор «испытанию ... для вашего испытания» в русском значительно сильнее, чем смысловая близость πυρώσει и πειρασμός в греческом. Формулировка также размывает то, что именно огненное испытание происходит с целью испытать адресатов.
  - severity: low
