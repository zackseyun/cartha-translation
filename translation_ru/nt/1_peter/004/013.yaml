id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: ru
  text: Но в той мере, в какой вы участвуете в страданиях Мессии[a], радуйтесь, чтобы и при явлении Его славы вы возрадовались с ликованием[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа». Греческое Χριστός означает «Помазанник», то есть «Мессия».'
    reason: Альтернативная традиционная передача титула.
  - marker: b
    text: 'Буквально: «возрадовались, ликуя». «Явление Его славы» также можно перевести как «откровение Его славы».'
    reason: Указывает усилительное причастие ἀγαλλιώμενοι и допустимую лексическую альтернативу для ἀποκάλυψις.
lexical_decisions:
- source_word: καθὸ
  choice: поскольку
  rationale: В данном увещевании передаёт основание для радости и допускает оттенок меры участия; по-русски звучит естественнее буквального «в той мере, в какой».
- source_word: κοινωνεῖτε
  choice: вы участвуете в
  rationale: Сохраняет значение реального приобщения к страданиям, не сводя его к сочувствию и не уточняя богословский характер участия.
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: в страданиях Мессии
  rationale: Передаёт генитивную конструкцию естественно и сохраняет связь страданий с Мессией без пояснительного сужения смысла.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Передаёт значение греческого титула Χριστός и его мессианский контекст.
- source_word: χαίρετε
  choice: радуйтесь
  rationale: Прямо передаёт повелительное наклонение и сохраняет лексическую связь с последующим χαρῆτε.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно выражает целевую или результативную связь, не устраняя присущую греческому обороту смысловую широту.
- source_word: ἀποκαλύψει
  choice: явлении
  rationale: В эсхатологическом контексте означает раскрытие, становящееся явным; «явление» естественно по-русски, а более формальное «откровение» дано в примечании.
- source_word: δόξης αὐτοῦ
  choice: Его славы
  rationale: Кратко и точно передаёт притяжательное отношение.
- source_word: χαρῆτε ἀγαλλιώμενοι
  choice: вы возрадовались и возликовали
  rationale: Сохраняет оба выражения радости и передаёт усилительный смысл причастия естественной русской координацией.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Здесь слово сохраняет функцию титула; перевод «Мессия» раскрывает его значение и еврейско-мессианский фон, тогда как традиционный вариант указан в примечании.
- issue: Характер участия в страданиях Мессии
  choice: участвуете в страданиях Мессии
  alternative: страдаете за Мессию
  rationale: Греческий текст говорит об участии в Его страданиях и не определяет здесь точнее его отношение к искупительным страданиям или страданиям верующих; перевод сохраняет эту богословскую напряжённость.
- issue: Связь ἵνα с будущей радостью
  choice: чтобы ... вы возрадовались
  alternative: так что ... вы возрадуетесь
  rationale: Форма с «чтобы» сохраняет целевой/результативный диапазон ἵνα и сослагательное наклонение, не превращая высказывание в простое предсказание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Напротив» передаёт противопоставление ἀλλά; «возрадовались и возликовали» сохраняет торжественное усиление без архаической перегруженности. Заглавное «Его» соответствует распространённой русской библейской издательской практике.
