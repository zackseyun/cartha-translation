  source_fidelity: 'Смысловой ряд передан точно: запрет страдать вследствие убийства, воровства, злодеяния или вмешательства в чужую сферу сохранён. Однако «Только бы» ослабляет и несколько преобразует объяснительное γάρ; «Ибо пусть» точнее воспроизводит связь с предыдущим контекстом и запретительную форму πασχέτω.'
