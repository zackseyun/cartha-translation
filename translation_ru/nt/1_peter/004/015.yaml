  terminology: '«Убийца», «вор» и «злодей» приемлемо передают φονεύς, κλέπτης и широкое κακοποιός. Описательное «тот, кто вмешивается в чужие дела» удачно передаёт редкое ἀλλοτριεπίσκοπος без неуместных церковно-должностных ассоциаций. Сноска уточнена: прежнее «надзирающий за чужим» по-русски неполно и может быть неверно понято.'
