  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: ru
  text: Ибо пусть никто из вас не страдает как убийца, вор, злодей или как тот, кто вмешивается в чужие дела[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тот, кто вмешивается не в свои дела»; буквальнее: «надзирающий за чужими делами».'
    reason: Лексическая альтернатива для редкого слова ἀλλοτριεπίσκοπος.
lexical_decisions:
- source_word: μὴ γάρ τις ὑμῶν
  choice: Только бы никто из вас не
  rationale: Отрицание с повелительной формой передано как предостережение, естественное для современного русского; γάρ здесь связывает стих с контекстом, но отдельное «ведь» сделало бы фразу тяжеловесной, поэтому связь выражена оборотом «только бы».
- source_word: πασχέτω
  choice: не страдал
  rationale: Сохраняет широкое значение πάσχω и сквозную тему страдания в послании, не добавляя прямо не названного понятия наказания.
- source_word: ὡς φονεύς
  choice: как убийца
  rationale: φονεύς обозначает совершающего убийство; «убийца» точнее более широкого «тот, кто убивает».
- source_word: κλέπτης
  choice: вор
  rationale: Обычное и точное русское соответствие, не привносящее оттенка насильственного грабежа.
- source_word: κακοποιός
  choice: злодей
  rationale: Передаёт общее нравственное значение человека, делающего зло, не сужая его до юридического «преступника».
- source_word: ἀλλοτριεπίσκοπος
  choice: тот, кто вмешивается в чужие дела
  rationale: Редкое сложное слово буквально связано с надзором за чужим; описательный перевод ясно передаёт порицаемое вторжение в дела других и не создаёт неуместного церковно-должностного оттенка.
theological_decisions:
- issue: Значение редкого слова ἀλλοτριεπίσκοπος
  choice: тот, кто вмешивается в чужие дела
  alternative: надзирающий за чужим; вмешивающийся не в своё дело
  rationale: Контекст перечисляет порочные поступки, за которые страдание не заслуживает похвалы. Выбранный вариант передаёт отрицательную направленность слова, сохраняя в сноске его буквальную образность и лексическую неуверенность.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Синтаксис сохраняет форму пастырского предостережения; редкий последний термин раскрыт без конфессиональных или должностных ассоциаций.
