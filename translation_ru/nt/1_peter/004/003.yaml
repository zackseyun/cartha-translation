source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: ru
  text: Ведь довольно уже прожитого времени, в течение которого вы исполняли волю язычников, предаваясь распутству[a], страстям, пьянству[b], разгулу, попойкам и беззаконному идолопоклонству[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесстыдной распущенности».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пьяным кутежам»; греческое слово указывает на чрезмерное употребление вина и пьяный разгул.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «недозволенному идолопоклонству».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: Ведь довольно того, что в прошедшее время
  rationale: Передаёт достаточность уже истекшего времени и объяснительную функцию γάρ естественным современным русским оборотом.
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: волю язычников
  rationale: βούλημα обозначает волю или намерение, а ἔθνη в данном контексте — язычников, то есть живущих вне народа Божьего и его образа жизни, а не государства или народы в политическом смысле.
- source_word: κατειργάσθαι
  choice: исполняли
  rationale: Глагол выражает осуществление на деле; форма в русском придаточном естественно передаёт прежнюю, уже оставленную практику, к которой относится прошедшее время.
- source_word: πεπορευμένους
  choice: предаваясь
  rationale: Причастие описывает прежний образ жизни. Буквальное «ходя» здесь в современном русском звучит неестественно; «предаваясь» плавно вводит последующий перечень пороков.
- source_word: ἐν ἀσελγείαις
  choice: распутству
  rationale: ἀσέλγεια означает бесстыдную необузданность, нередко половую; «распутство» сохраняет нравственную и чувственную окраску без искусственного множественного числа.
- source_word: ἐπιθυμίαις
  choice: страстям
  rationale: В перечне пороков слово обозначает дурные, неупорядоченные желания; «страсти» передают отрицательный смысл, не сужая его исключительно до сексуальной похоти.
- source_word: οἰνοφλυγίαις
  choice: пьянству
  rationale: Редкое слово обозначает чрезмерное употребление вина и состояние опьянения; собирательное «пьянство» естественно по-русски передаёт повторяющийся образ поведения.
- source_word: κώμοις
  choice: разгулу
  rationale: κῶμος — буйное праздничное веселье, обычно связанное с пьянством и нравственной распущенностью; «разгул» краток и стилистически уместен.
- source_word: πότοις
  choice: попойкам
  rationale: πότος обозначает совместные застолья, сосредоточенные на выпивке; «попойки» ясно отличает их от общего пьянства и разгула.
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: беззаконному идолопоклонству
  rationale: ἀθέμιτος означает недозволенное, противное установленному порядку; «беззаконное» сохраняет объективную нравственно-правовую оценку, а собирательное «идолопоклонство» естественно в русском.
theological_decisions:
- issue: Значение ἐθνῶν
  choice: язычников
  alternative: народов / неевреев
  rationale: В контексте речь не о политических народах как таковых, а о прежнем образе жизни, характерном для языческого окружения. «Язычники» точно передают религиозно-нравственный контраст, не вводя конфессиональной специфики.
- issue: Нравственная сила ἀθεμίτοις εἰδωλολατρίαις
  choice: беззаконному идолопоклонству
  alternative: мерзкому идолопоклонству / недозволенным видам идолопоклонства
  rationale: Определение подчёркивает, что такие практики противны дозволенному и установленному порядку, а не только вызывают отвращение; поэтому «беззаконному» ближе к смыслу, чем эмоционально усиленное «мерзкому».
- issue: Соотношение главной мысли и причастия πεπορευμένους
  choice: вы исполняли волю язычников, предаваясь…
  alternative: довольно времени, прожитого по воле язычников, когда вы ходили…
  rationale: Русская личная конструкция ясно выражает подразумеваемых адресатов и сохраняет зависимость перечня пороков от прежнего исполнения языческой воли, не превращая причастие в отдельное утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Перечень пороков сделан ритмичным и естественным; искусственные множественные числа греческого оригинала переданы русскими собирательными существительными. «Ведь» сохраняет пояснительную связь с предыдущей мыслью.
