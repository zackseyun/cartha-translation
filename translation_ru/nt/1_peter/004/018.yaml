  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: ru
  text: И если праведник с трудом спасается[a], то где явятся нечестивый и грешник?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «едва спасается». Здесь речь может идти о спасении через тяжёлые испытания, а не о том, что само спасение сомнительно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «где найдутся нечестивый и грешник?»'
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιος
  choice: праведник
  rationale: Субстантивированное прилагательное в единственном числе передано естественным русским существительным в обобщающем значении; сохраняется краткий, афористичный строй.
- source_word: μόλις
  choice: с трудом
  rationale: Передаёт идею затруднённости и тяжести пути точнее и естественнее современного «едва»; не утверждает сомнительность конечного спасения.
- source_word: σῴζεται
  choice: спасается
  rationale: Настоящее время и медиально-пассивная форма естественно передаются возвратным глаголом; формулировка сохраняет возможность процессуального оттенка.
- source_word: ἀσεβής
  choice: нечестивый
  rationale: Сохраняет нравственно-религиозный смысл человека, лишённого благоговения перед Богом, и соответствует библейскому регистру.
- source_word: ἁμαρτωλός
  choice: грешник
  rationale: Обычный и точный русский эквивалент; оставлен отдельно от «нечестивый», как и в греческом тексте.
- source_word: ποῦ
  choice: где
  rationale: Прямо передаёт вопросительное наречие и сохраняет риторическую силу вопроса.
- source_word: φανεῖται
  choice: окажутся
  rationale: В данном риторическом контексте естественно передаёт φαίνω в значении «явиться, обнаружиться, оказаться»; множественное согласование обусловлено двумя однородными обозначениями лиц в русском предложении.
theological_decisions:
- issue: Смысл μόλις σῴζεται
  choice: «С трудом спасается» указывает на тяжесть испытаний и суда, через которые проходит праведник, не снимая напряжения самой формулировки.
  alternative: «Едва спасается» может быть понято как сомнение в конечном спасении праведника.
  rationale: Ближайший контекст говорит о страданиях и суде, начинающемся с Божьего дома. Перевод сохраняет трудность спасительного пути, не добавляя утверждения о неопределённости исхода.
- issue: Обобщающее единственное число
  choice: «праведник» в единственном числе
  alternative: «праведные» или «праведный человек»
  rationale: Так сохраняются грамматическое число, лаконичность и пословичный характер греческой формулировки.
- issue: Два обозначения виновных
  choice: «нечестивый и грешник»
  alternative: Объединить их в одно выражение, например «нечестивый грешник».
  rationale: Греческий текст координирует два отдельных субстантивированных определения; перевод сохраняет их различие.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохраняет краткость и риторическую форму исходного текста; «нечестивый» оставлено как понятное традиционное религиозно-нравственное обозначение.
