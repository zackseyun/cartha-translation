source:
  edition: SBLGNT
  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: ru
  text: 'Ведь в Писании сказано: «Вот, Я полагаю на Сионе избранный, драгоценный краеугольный камень, и верующий в него[a] ни в коем случае не будет посрамлён[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое местоимение грамматически относится к «камню»: «верующий в него». В окружающем контексте Пётр применяет образ камня ко Христу.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «никогда не будет посрамлён». В греческом тексте отрицание особо усилено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Ведь
  rationale: Вводит подтверждение предыдущей мысли цитатой из Писания; «ведь» естественно передаёт пояснительную связь.
- source_word: περιέχει ἐν γραφῇ
  choice: в Писании сказано
  rationale: Естественно передаёт безличный греческий оборот, буквально близкий к «содержится в Писании», без неясного местоимения.
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Сохраняет призыв обратить внимание и торжественный пророческий тон, оставаясь современным русским выражением.
- source_word: τίθημι
  choice: полагаю
  rationale: Подходит к образу закладки строительного камня и сохраняет возвышенный регистр цитаты.
- source_word: ἐν Σιὼν
  choice: на Сионе
  rationale: В русском библейском и литературном употреблении местоположение на горе Сион естественно выражается предлогом «на».
- source_word: λίθον ἀκρογωνιαῖον
  choice: краеугольный камень
  rationale: Устоявшееся и понятное русское обозначение важнейшего углового камня строительного образа.
- source_word: ἐκλεκτὸν
  choice: избранный
  rationale: Прямо передаёт значение выбора и сохраняет связь с контекстом 1 Пет. 2.
- source_word: ἔντιμον
  choice: драгоценный
  rationale: Слово может обозначать как почитаемое, так и высоко ценимое; применительно к камню «драгоценный» естественно выражает высокую ценность и перекликается с 2:4, 7.
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: верующий в Него
  rationale: Передаёт субстантивированное причастие и личное, христологическое применение образа камня в ближайшем контексте.
- source_word: οὐ μὴ καταισχυνθῇ
  choice: ни в коем случае не будет посрамлён
  rationale: «Ни в коем случае» передаёт усиленное отрицание οὐ μή, а «будет посрамлён» — значение пассивной формы καταισχυνθῇ.
theological_decisions:
- issue: Референт αὐτῷ в цитате из Исаии в применении Петра
  choice: личное «в Него»
  alternative: «в него» о камне как о неодушевлённом образе
  rationale: Грамматически местоимение относится к камню, однако окружающий контекст 1 Пет. 2:4–8 прямо применяет образ камня к Христу. Личное написание передаёт это применение, а сноска сохраняет метафорическую двусмысленность.
- issue: Значение ἔντιμον
  choice: «драгоценный»
  alternative: «почитаемый» или «ценный»
  rationale: Греческое слово совмещает оттенки высокой ценности и чести. В сочетании с камнем «драгоценный» звучит естественно, но не исключает тематически важного оттенка почёта.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным тоном пророческой цитаты. Синтаксис сделан ясным для обычного читателя; традиционные слова «Сион», «краеугольный» и «посрамлён» сохранены как понятные и уместные в библейском контексте.
