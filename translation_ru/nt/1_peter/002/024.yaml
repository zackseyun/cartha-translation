source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: ru
  text: Он Сам понёс наши грехи на древо[a] в Своём теле, чтобы мы, умерев для грехов, жили для праведности. Его раной[b] вы были исцелены[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на крест»; по-гречески буквально «на древо», вероятно с отсылкой ко Второзаконию 21:23.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «следом от удара» или «кровоподтёком»; употреблённое в единственном числе слово перекликается с Исаией 53:5.'
    reason: lexical_alternative
  - marker: c
    text: Исцеление выражено здесь широко. В контексте оно связано с грехами и праведностью, но само выражение не ограничивает его исключительно телесным или исключительно духовным смыслом.
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: понёс
  rationale: Глагол ἀναφέρω может означать «возносить», «приносить в жертву» или «нести». «Понёс» естественно передаёт несение грехов, сохраняет связь с Ис 53 и не сводит выражение к одному техническому жертвенному значению.
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: в Своём теле
  rationale: Буквально и ясно сохраняет телесный, конкретный характер страдания; возвратное «Своём» естественно по-русски соотносится с подлежащим.
- source_word: ἐπὶ τὸ ξύλον
  choice: на древо
  rationale: ξύλον означает «дерево, древесина» и здесь обозначает орудие распятия. «Древо» сохраняет форму греческого выражения и вероятную перекличку со Втор 21:23, не заменяя её истолковывающим словом «крест».
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: умерев для грехов
  rationale: ἀπογίνομαι выражает решительный разрыв или удаление. «Умерев для грехов» передаёт эту силу естественным русским оборотом и сохраняет множественное число.
- source_word: τῇ δικαιοσύνῃ
  choice: для праведности
  rationale: Дательный падеж обозначает направленность новой жизни. «Жили для праведности» понятно выражает жизнь, посвящённую праведности, не сужая δικαιοσύνη до одной лишь общественной справедливости.
- source_word: μώλωπι
  choice: раной
  rationale: μώλωψ — след от удара, рана или кровоподтёк. «Рана» естественна в современном русском и сохраняет единственное число и отзвук Ис 53:5.
- source_word: ἰάθητε
  choice: вы были исцелены
  rationale: Аорист пассивного залога прямо передан формой «были исцелены»; она сохраняет широту образа и не ограничивает исцеление только телесной или только духовной сферой.
- source_word: αὐτὸς
  choice: Сам
  rationale: Усилительное местоимение подчёркивает, что именно Он понёс грехи; прописная буква соответствует принятому благоговейному русскому оформлению местоимений о Христе.
theological_decisions:
- issue: Объём значения исцеления в заключительной фразе
  choice: Оставить «вы были исцелены» без уточнения вида исцеления.
  alternative: «Вы были духовно исцелены от греха» или «вы были физически исцелены».
  rationale: Контекст связывает исцеление с грехами, праведностью и страданием Христа, однако сам текст не вводит ограничивающего определения. Широкая формулировка сохраняет образ Ис 53 и не разрешает богословское напряжение за автора.
- issue: Передача ξύλον
  choice: «древо» в основном тексте
  alternative: «крест»
  rationale: Речь несомненно идёт о распятии, но источник употребляет ξύλον, а не σταυρός. «Древо» сохраняет лексическую форму и вероятную связь со Втор 21:23.
- issue: Характер несения грехов
  choice: «понёс наши грехи» без дополнительного догматического пояснения
  alternative: «принёс наши грехи в жертву»
  rationale: ἀναφέρω допускает жертвенный оттенок, но перевод «принёс в жертву» сделал бы один возможный оттенок единственным и создал бы неясное представление, будто в жертву принесены сами грехи.
translation_notes:
  register: Современный литературный русский с достоинством и умеренным сохранением библейской образности. «Древо» несколько возвышенно, но оправдано межтекстовой связью; остальной синтаксис прост и доступен. Формы «Сам», «Своём», «Его» оформлены по принятой русской библейской традиции.
