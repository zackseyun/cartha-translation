  text: Οἱ οἰκέται ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: ru
  text: Домашние рабы[a], подчиняйтесь своим господам со всяким почтением[b] — не только добрым и мягким, но и несправедливым[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «домашние слуги». Греческое слово обозначает зависимых людей, служивших в доме.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «со всяким страхом»; здесь возможен смысл глубокого уважения и почтительности.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «кривым»; также возможно: «жестоким», «неправым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: домашние рабы
  rationale: Слово обозначает зависимых людей, служивших в доме; «домашние рабы» ясно передаёт и домашнюю сферу, и их несвободное общественное положение, не смягчая историческую реальность.
- source_word: ὑποτασσόμενοι
  choice: подчиняйтесь
  rationale: Причастие в данном контексте имеет побудительную силу; русский императив естественно продолжает увещание и передаёт призыв поставить себя под власть господ.
- source_word: ἐν παντὶ φόβῳ
  choice: со всяким почтением
  rationale: Буквально выражение означает «со всяким страхом», но здесь φόβος допускает смысл благоговейного уважения и почтительности. Основной вариант избегает ложного сужения до испуга, а буквальная форма сохранена в примечании.
- source_word: δεσπόταις
  choice: господам
  rationale: δεσπότης обозначает господина, обладающего властью над домашним рабом; «господам» точно и естественно передаёт это отношение в историческом контексте.
- source_word: ἀγαθοῖς
  choice: добрым
  rationale: Прямо передаёт общую положительную нравственную характеристику ἀγαθός.
- source_word: ἐπιεικέσιν
  choice: снисходительным
  rationale: ἐπιεικής выражает мягкость, уступчивость и разумную незлобивость; «снисходительным» естественно отличает это качество от более общего «добрым».
- source_word: σκολιοῖς
  choice: несправедливым
  rationale: Буквально «кривым, искривлённым»; применительно к господам слово характеризует их как неправых, жестоких или несправедливых. Контекстуальное «несправедливым» понятно современному читателю, а исходная метафора отмечена в сноске.
theological_decisions:
- issue: Как передать общественное положение οἰκέται, не смягчая и не расширяя значение
  choice: «домашние рабы»
  alternative: «домашние слуги»
  rationale: Хотя слово специально указывает на домашних зависимых, речь идёт не просто о современных наёмных слугах. «Домашние рабы» сохраняет историческую несвободу адресатов и домашнюю сферу термина.
- issue: Означает ли φόβος страх перед господами или почтительное отношение
  choice: «со всяким почтением» с буквальным вариантом в сноске
  alternative: «со всяким страхом»
  rationale: Греческая конструкция действительно сохраняет оттенок страха, поэтому он не должен быть скрыт; однако в увещательном контексте слово может обозначать почтительную боязнь или глубокое уважение. Сноска сохраняет подлинную смысловую напряжённость.
- issue: Следует ли понимать σκολιοῖς только как жестокость
  choice: «несправедливым»
  alternative: «жестоким», «кривым»
  rationale: Метафора «кривизны» шире одной суровости и может включать нравственную неправоту, нечестность и несправедливость. Основной вариант не сводит значение лишь к грубому обращению.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского увещания. Императив выбран ради естественного русского синтаксиса. Исторически точное «домашние рабы» не переносит текст на современные трудовые отношения; сноски сохраняют важные лексические альтернативы и образность оригинала.
