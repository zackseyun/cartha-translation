  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: ru
  text: Как новорождённые младенцы, жаждите чистого духовного молока[a], чтобы благодаря ему вы возрастали к спасению[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чистого разумного молока». Греческое слово может обозначать относящееся к разуму или внутренней жизни; здесь речь идёт не о буквальном молоке, а о духовной пище.'
    reason: lexical_alternative
  - marker: b
    text: В некоторых рукописях слова «к спасению» отсутствуют.
    reason: textual_variant
lexical_decisions:
- source_word: ὡς ἀρτιγέννητα βρέφη
  choice: как новорождённые младенцы
  rationale: Передаёт сравнение и образ детей, только что появившихся на свет, естественным современным русским языком.
- source_word: τὸ λογικὸν
  choice: духовного
  rationale: В метафоре молока обозначает пищу, относящуюся не к телу, а к внутренней, разумной жизни; значимая буквальная возможность «разумного» сохранена в сноске.
- source_word: ἄδολον
  choice: чистого
  rationale: Передаёт смысл неразбавленного, неподдельного молока и естественно сочетается с существительным «молоко».
- source_word: ἐπιποθήσατε
  choice: жаждите
  rationale: Выражает настойчивое, сильное желание, заложенное в повелительной форме, и сохраняет достоинство стиля.
- source_word: ἐν αὐτῷ
  choice: благодаря ему
  rationale: Указывает на молоко как средство роста; такое выражение естественнее русского буквального «в нём».
- source_word: αὐξηθῆτε εἰς σωτηρίαν
  choice: возрастать к спасению
  rationale: Сохраняет направленность εἰς к цели и не сводит спасение исключительно к уже завершённой или исключительно будущей реальности.
theological_decisions:
- issue: Значение λογικός в образе молока
  choice: В основном тексте — «духовного»
  alternative: «разумного» или «относящегося к разуму»
  rationale: «Духовное молоко» ясно обозначает метафорическую пищу внутренней жизни и звучит естественно по-русски. Поскольку греческое слово непосредственно связано с разумностью и допускает более буквальный перевод, эта неоднозначность отмечена в сноске.
- issue: Направленность выражения εἰς σωτηρίαν
  choice: «к спасению»
  alternative: «для спасения» или «во спасение»
  rationale: Предлог εἰς выражает цель или направление. Формулировка сохраняет напряжение между настоящей реальностью спасения и его будущей полнотой, не вводя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, возвышенным, но не архаичным звучанием. «Жаждите» сохраняет силу повеления, а «возрастать к спасению» — направленность исходной фразы и её богословскую напряжённость.
