  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: ru
  text: Ведь какая вам похвала, если вы, согрешая и терпя побои, стойко переносите это? Но если вы, делая добро и страдая, стойко переносите это, — это угодно Богу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «это находит благоволение у Бога» или «это заслуживает одобрения в глазах Бога»; буквально: «это — благодать у Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κλέος
  choice: честь
  rationale: В риторическом вопросе слово обозначает заслуженную похвалу или честь, а не широкую известность; «какая вам честь» естественно передаёт смысл по-русски.
- source_word: ἁμαρτάνοντες
  choice: за свои грехи
  rationale: Передаёт прямой нравственно-богословский смысл причастия и в русском предложении ясно связывает побои с виновным поведением.
- source_word: κολαφιζόμενοι
  choice: терпите побои
  rationale: Глагол обозначает физические удары; «побои» конкретно и современно, без архаического оттенка.
- source_word: ὑπομενεῖτε
  choice: терпите
  rationale: Передаёт стойкое перенесение страдания и позволяет сохранить повтор ключевого глагола в обеих частях стиха.
- source_word: ἀγαθοποιοῦντες
  choice: делая добро
  rationale: Прямое и естественное соответствие причастию, обозначающему добрые и правильные поступки.
- source_word: πάσχοντες
  choice: терпите страдания
  rationale: Сохраняет широкое значение страдания, не сужая его до конкретного вида дурного обращения.
- source_word: χάρις
  choice: угодно
  rationale: В сочетании τοῦτο χάρις παρὰ θεῷ контекстуальный смысл — то, что встречает Божье благоволение или одобрение. Буквальная «благодать» здесь по-русски могла бы ошибочно восприниматься как обозначение дара спасительной благодати.
- source_word: παρὰ θεῷ
  choice: Богу
  rationale: 'Вместе со сказуемым «угодно» естественно выражает оценку со стороны Бога: «это угодно Богу».'
theological_decisions:
- issue: Значение χάρις в заключительной фразе
  choice: «это угодно Богу» с примечанием о буквальном выражении
  alternative: «это благодать перед Богом»; «это заслуживает одобрения перед Богом»
  rationale: Контекст говорит о Божьем благоволении к терпеливому перенесению незаслуженных страданий. Основной текст передаёт этот смысл естественно, а примечание сохраняет лексическую многозначность χάρις и формальную структуру греческого выражения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Причастные конструкции частично перестроены ради естественного русского синтаксиса; повтор «терпите» сохраняет композиционный акцент оригинала.
