revisions:
- from: И какая вам честь, если вы терпите побои за свои грехи? Но если вы терпите страдания, делая добро, — это угодно Богу.[a]
  to: Ведь какая вам похвала, если вы, согрешая и терпя побои, стойко переносите это? Но если вы, делая добро и страдая, стойко переносите это, — это угодно Богу.[a]
  rationale: Перевод исправлен, чтобы не превращать два греческих причастия первой части в явно выраженное отношение «наказания за грехи». Сохранены параллельные деепричастные конструкции, конкретность физических ударов и повтор идеи стойкого перенесения страданий. Заключительная фраза передана современно и контекстуально, а сноска сохраняет буквальное значение χάρις и альтернативы, связанные с Божьим благоволением.
