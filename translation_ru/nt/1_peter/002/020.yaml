review_pass:
  verdict: revise
  source_fidelity: Черновик верно передаёт общий контраст между страданием за грех и страданием при делании добра, а также повтор ὑπομενεῖτε. Однако «за свои грехи» превращает одновременное описание («согрешая и терпя побои») в причинно-следственное утверждение, которого греческий текст прямо не формулирует. Исправление сохраняет обе причастные конструкции и не снимает этой нюансировки.
  naturalness: «Какая вам похвала» — естественная современная передача риторического ποῖον κλέος. Конструкции с деепричастиями и «стойко переносите это» литературны и ясно отражают параллелизм оригинала. «Угодно Богу» естественно в русском, а примечание поясняет лексическую многозначность χάρις.
  terminology: «Согрешая» сохраняет нравственно-богословское значение ἁμαρτάνοντες; «побои» передаёт конкретный физический характер κολαφιζόμενοι; «делая добро» соответствует ἀγαθοποιοῦντες. Для χάρις основной текст выбирает контекстуальное «угодно Богу», не навязывая сотериологического значения «благодать»; примечание сохраняет буквальный вариант и варианты смысла Божьего благоволения.
