    rationale: Ἁμαρτάνοντες καὶ κολαφιζόμενοι означает «согрешая и будучи битыми/терпя побои». Хотя причинная связь подразумевается контекстом, предлог «за» её эксплицирует и тем самым сужает синтаксическую неоднозначность оригинала.
  - severity: low
    issue: «Честь» менее точно выражает риторическое κλέος, чем «похвала».
    rationale: В данном контексте κλέος означает признание, похвалу или заслугу за стойкость, а не личную честь как качество или достоинство.
  - severity: low
