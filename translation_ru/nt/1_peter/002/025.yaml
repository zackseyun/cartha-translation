lexical_decisions:
- source_word: ἦτε γὰρ
  choice: Ведь вы были
  rationale: «Ведь» естественно передаёт пояснительное γάρ и связывает стих с предыдущим утверждением; несовершенный вид «были» описывает прежнее состояние адресатов.
- source_word: ὡς πρόβατα
  choice: как овцы
  rationale: Сохраняется прямое сравнение и пастушеский образ.
- source_word: πλανώμενοι
  choice: сбившиеся с пути
  rationale: Передаёт значение блуждания и уклонения, естественно звучит применительно к овцам и не уточняет, произошло ли это по собственной ошибке или под чужим воздействием.
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: но теперь возвратились
  rationale: Передаёт резкое противопоставление, завершённость перемены и её нынешнюю значимость. Возвратное русское выражение сохраняет возможный непереходный оттенок греческой пассивной формы.
- source_word: ἐπὶ τὸν ποιμένα
  choice: к Пастырю
  rationale: «Пастырь» точно сохраняет метафору ποιμήν и уместен как христологическое наименование.
- source_word: καὶ ἐπίσκοπον
  choice: и Блюстителю
  rationale: «Блюститель» передаёт идею надзора и заботы, оставаясь титулом, параллельным слову «Пастырь», и не сводит выражение к позднейшему церковному сану.
- source_word: τῶν ψυχῶν ὑμῶν
  choice: ваших душ
  rationale: Сохраняет прямое и традиционно понятное соответствие ψυχή в контексте духовного попечения, не исключая заботы о человеке в целом.
theological_decisions:
- issue: Передача ἐπίσκοπος как наименования Христа
  choice: Блюститель
  alternative: Хранитель; Надзирающий; епископ
  rationale: Выбор сохраняет смысл наблюдения и попечения, но не вносит в текст представление о позднейшем церковном сане. Заглавная буква указывает на употребление слова как наименования Христа.
- issue: Залоговый оттенок ἐπεστράφητε
  choice: возвратились
  alternative: были возвращены; обратились
  rationale: Форма допускает пассивный оттенок, однако глагол может иметь непереходное значение «возвратиться, обратиться». Основной текст не разрешает однозначно напряжение между Божьим действием и человеческим возвращением; пассивная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского регистра. «Пастырь» и «Блюститель» сохранены как параллельные христологические наименования; второе слово несколько возвышенное, но понятно из контекста и точнее нейтральных или конфессионально нагруженных вариантов. Образ заблудившихся овец передан естественным выражением «сбившиеся с пути».
