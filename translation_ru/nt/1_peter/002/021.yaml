base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: ru
  text: Ведь к этому вы были призваны, потому что и Мессия пострадал за вас, оставив вам образец[a], чтобы вы шли по Его следам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «пример для подражания». Греческое слово могло обозначать также пропись — начертанный учителем образец, который ученик должен был повторять.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: к этому
  rationale: Выражение указывает назад, на терпеливое перенесение несправедливых страданий в предыдущем контексте, не добавляя отсутствующего в тексте уточнения.
- source_word: ἐκλήθητε
  choice: вы были призваны
  rationale: Пассивная форма сохраняет богословский оттенок Божьего призвания, не конкретизируя его сверх сказанного.
- source_word: ὅτι
  choice: потому что
  rationale: Передаёт причинно-пояснительную связь между призванием верующих и страданием Мессии.
- source_word: Χριστὸς
  choice: Мессия
  rationale: Передаёт значение титула «Помазанник» и соответствует его функции в данном контексте.
- source_word: ἔπαθεν
  choice: пострадал
  rationale: Точно и без необоснованного расширения передаёт аорист πάσχω.
- source_word: ὑπὲρ ὑμῶν
  choice: за вас
  rationale: Естественная русская формулировка сохраняет широкий смысл действия ради адресатов, включая возможный заместительный оттенок, но не сужает его до одной догматической трактовки.
- source_word: ὑμῖν ὑπολιμπάνων
  choice: оставив вам
  rationale: Причастный оборот относится к Мессии, а дательный ὑμῖν обозначает тех, кому оставлен образец.
- source_word: ὑπογραμμὸν
  choice: образец
  rationale: Слово означает модель для подражания и может обозначать пропись, которую ученик обводит или копирует; «образец» естественно передаёт основной смысл, а конкретный учебный образ пояснён в сноске.
- source_word: ἵνα
  choice: чтобы
  rationale: Сохраняет целевое значение союза.
- source_word: ἐπακολουθήσητε
  choice: вы шли
  rationale: В сочетании со «следами» естественно выражает предусмотренное следование примеру; целевая конструкция с «чтобы» передаёт значение греческого сослагательного наклонения.
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: по Его следам
  rationale: Сохраняет метафору следования по оставленным следам и звучит естественно по-русски.
theological_decisions:
- issue: Смысл ὑπὲρ ὑμῶν применительно к страданию Мессии
  choice: «за вас» с сохранением смысловой широты
  alternative: «ради вас», «за вас и вместо вас»
  rationale: Греческий текст ясно говорит о страдании Мессии ради адресатов, а непосредственный контекст подчёркивает также Его пример. «За вас» сохраняет представительный и возможный заместительный оттенок, не превращая его в более узкую формулу, которой в самой фразе нет.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Частица «и» сохранена перед сказуемым в первой части и перед «Мессия», отражая καί и связь с контекстом. Местоимение «Его» написано с прописной буквы по принятой русской библейской традиции.
