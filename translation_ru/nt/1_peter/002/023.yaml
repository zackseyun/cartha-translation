  text: ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: ru
  text: Он, когда Его оскорбляли[a], не оскорблял в ответ; страдая, не угрожал, но продолжал вверять Себя[b] Тому, Кто судит справедливо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Его злословили, не злословил в ответ».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально объект действия не назван; возможно также: «передавал Своё дело Тому, Кто судит справедливо».'
    reason: source_ambiguity
lexical_decisions:
- source_word: ὃς
  choice: Он
  rationale: Относительное местоимение отсылает к Христу из предыдущего стиха. В самостоятельной подаче стиха русское «Он» естественно продолжает мысль, не меняя референта.
- source_word: λοιδορούμενος
  choice: когда Его оскорбляли
  rationale: Причастие обозначает словесное поношение. Временная конструкция естественна по-русски, а «оскорбляли» ясно передаёт словесное унижение.
- source_word: οὐκ ἀντελοιδόρει
  choice: не оскорблял в ответ
  rationale: Глагол выражает ответное словесное поношение; несовершенный вид «не оскорблял» соответствует имперфекту и изображает устойчивое отсутствие возмездия.
- source_word: πάσχων
  choice: страдая
  rationale: Настоящее причастие сохранено как обстоятельство, параллельное первой причастной конструкции.
- source_word: οὐκ ἠπείλει
  choice: не угрожал
  rationale: «Угрожал» прямо передаёт произнесение угроз, а несовершенный вид соответствует аспекту греческого имперфекта.
- source_word: παρεδίδου
  choice: продолжал вверять Себя
  rationale: Имперфект указывает на продолжающееся действие. «Вверять Себя» естественно выражает доверительное предание Богу, однако подразумеваемое дополнение в греческом не названо явно, что отмечено в сноске.
- source_word: τῷ κρίνοντι δικαίως
  choice: Тому, Кто судит справедливо
  rationale: Описательная конструкция сохраняет действующего Судью без добавления отсутствующего в тексте титула; наречие передано наречием «справедливо».
- source_word: δὲ
  choice: но
  rationale: Союз подчёркивает контраст между отказом Христа от ответной угрозы и Его доверительным обращением к справедливому Судье.
theological_decisions:
- issue: Кого обозначает «Тот, Кто судит справедливо»
  choice: Референт оставлен описательным, как в греческом тексте; по контексту подразумевается Бог.
  alternative: Явно назвать «Бога Отца».
  rationale: Греческий текст не употребляет ни имени, ни титула «Отец», поэтому перевод не конкретизирует Лицо сверх сказанного.
- issue: Неназванное дополнение при παρεδίδου
  choice: 'В основном тексте: «вверять Себя».'
  alternative: «передавал Своё дело» или более общее «всё предавал».
  rationale: Контекст страдания естественно допускает понимание, что Христос вверял Себя Богу, но объект в греческом не выражен. Сноска сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным звучанием. Повтор «оскорбляли — не оскорблял» намеренно сохраняет ответный характер греческого глагола. Заглавные буквы в местоимениях, относящихся ко Христу и Богу, использованы в соответствии с распространённой русской библейской издательской традицией, без добавления богословских титулов.
