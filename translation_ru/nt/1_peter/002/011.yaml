  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: ru
  text: Возлюбленные, призываю вас, как пришельцев и странников[a], воздерживаться от плотских желаний[b], которые ведут войну против души[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземцев и временных жителей». Оба слова подчёркивают положение людей, живущих не у себя на родине и пребывающих в чужой стране.'
    reason: lexical_alternative
  - marker: b
    text: 'Также можно перевести: «желаний плоти». В более пояснительном переводе: «греховных желаний». Выражение не ограничивается сексуальными влечениями.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «против жизни» или «против самого человека». Здесь слово «душа» не обязательно обозначает лишь бесплотную часть человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: Возлюбленные
  rationale: Форма обращения передаёт тёплое отношение автора и сохраняет связь с лексикой любви, не добавляя отсутствующего в тексте слова «друзья».
- source_word: παρακαλῶ
  choice: призываю
  rationale: В данном контексте глагол выражает настойчивое нравственное увещание; «призываю» звучит естественно и весомо в современном литературном русском языке.
- source_word: ὡς
  choice: как
  rationale: Сохраняет прямое указание на положение, в котором автор обращается к читателям, не превращая его в явно причинную конструкцию.
- source_word: παροίκους καὶ παρεπιδήμους
  choice: пришельцев и странников
  rationale: Парное выражение передаёт положение людей, живущих не на своей родине и не принадлежащих этому месту вполне; два разных слова сохраняют усиление исходного текста.
- source_word: ἀπέχεσθαι
  choice: воздерживаться
  rationale: Передаёт продолжающееся сознательное удаление от названных желаний и естественно сочетается с родительным падежом.
- source_word: σαρκικῶν ἐπιθυμιῶν
  choice: плотских желаний
  rationale: Сохраняет образ «плоти» и нравственную напряжённость выражения, не сужая его до сексуальных влечений и не заменяя толкованием «греховные».
- source_word: αἵτινες
  choice: которые
  rationale: Естественно вводит поясняющее определение, характеризующее эти желания.
- source_word: στρατεύονται
  choice: ведут войну
  rationale: Сохраняет яркую военную метафору и активную враждебность желаний.
- source_word: κατὰ τῆς ψυχῆς
  choice: против души
  rationale: Формально сохраняет ψυχή и его антропологическую ёмкость, не добавляя отсутствующего в греческом притяжательного местоимения.
theological_decisions:
- issue: Смысл σαρκικῶν в нравственном контексте
  choice: плотских
  alternative: греховных; исходящих от плоти
  rationale: «Плотских» сохраняет исходную метафору и не вводит в основной текст более узкое богословское толкование. Слово здесь обозначает желания, связанные с человеческой плотью в её нравственно падшем измерении, но сам текст не раскрывает это в виде отдельной доктринальной формулы.
- issue: Смысл ψυχή
  choice: души
  alternative: жизни; самого человека
  rationale: «Души» сохраняет традиционную и лексически прямую передачу слова, при этом перевод не навязывает строгого разделения человека на тело и душу. Возможные более целостные значения отмечены в сноске.
- issue: Статус адресатов как παροίκους καὶ παρεπιδήμους
  choice: пришельцев и странников
  alternative: чужеземцев и временных жителей
  rationale: Основной текст сохраняет образ неполной принадлежности нынешнему месту или порядку, не решая однозначно, относится ли выражение прежде всего к общественному положению адресатов или к их богословскому статусу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Возлюбленные» и «душа» сохраняют важные смысловые связи исходного текста, а синтаксис остаётся понятным обычному читателю. Военная метафора передана без ослабления.
