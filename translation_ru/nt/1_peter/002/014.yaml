  naturalness: Сочетание «для наказания делающих зло и похвалы делающим добро» грамматически возможно, но в современном русском тяжеловесно и допускает нежелательную неясность генитивной связи. Явное «тех, кто…» и повтор «для» дают естественную и ясную параллельную конструкцию.
  terminology: «Правителям», «наказания», «похвалы» и «делает зло/добро» подходят гражданскому и этическому контексту. «Через него» сохраняет исходную неоднозначность референта без богословского уточнения в основном тексте.
