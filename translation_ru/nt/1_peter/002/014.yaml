id: 1PE.2.14
reference: 1 Peter 2:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: ru
  text: или правителям, как посланным через него для наказания тех, кто делает зло, и для похвалы тех, кто делает добро.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «него», вероятнее всего, относится к царю (императору), упомянутому в предыдущем стихе; некоторые понимают его шире — как указание на то, что власть установлена Богом.
    reason: Сохраняет неоднозначность референта αὐτοῦ, не меняя в основном тексте значение διά («через»).
lexical_decisions:
- source_word: ἡγεμόσιν
  choice: правителям
  rationale: В гражданском контексте обозначает представителей верховной власти; «правителям» естественно по-русски и не сужает значение до строго определённой римской должности.
- source_word: ὡς
  choice: как
  rationale: Передаёт характеристику правителей как посланных верховным властителем и сохраняет связь с предыдущим стихом.
- source_word: δι’ αὐτοῦ
  choice: им
  rationale: Сочетание διά с родительным при причастии «посланным» естественно передаёт посредничество или агентность; ближайший антецедент — царь/император из предыдущего стиха.
- source_word: πεμπομένοις
  choice: посланным
  rationale: Точно и кратко передаёт причастие, не усиливая его до значения официального уполномочивания.
- source_word: εἰς ἐκδίκησιν
  choice: для наказания
  rationale: В контексте гражданской власти речь идёт о карательном осуществлении правосудия; «наказание» передаёт это без эмоционального оттенка личной мести.
- source_word: κακοποιῶν
  choice: делающих зло
  rationale: Сохраняет отглагольный характер греческого слова и образует ясную параллель с «делающим добро».
- source_word: ἔπαινον
  choice: похвалы
  rationale: Прямо передаёт положительное признание доброго поведения и сохраняет параллелизм с «наказанием».
- source_word: ἀγαθοποιῶν
  choice: делающим добро
  rationale: Естественно передаёт людей, чьё поведение характеризуется добрыми делами, сохраняя словесную параллель с «делающих зло».
- source_word: εἴτε
  choice: или
  rationale: 'Продолжает начатую в предыдущем стихе конструкцию выбора: «будь то… или…».'
theological_decisions:
- issue: К кому относится αὐτοῦ в выражении δι’ αὐτοῦ
  choice: К царю/императору, упомянутому в предыдущем стихе
  alternative: К Богу как к Тому, Кто устанавливает власть
  rationale: Ближайший грамматический антецедент — царь из стиха 13, однако форма местоимения сама по себе не исключает более широкого понимания, поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Стих оформлен как продолжение синтаксической конструкции предыдущего стиха; сохранён параллелизм «делающих зло — делающим добро».
