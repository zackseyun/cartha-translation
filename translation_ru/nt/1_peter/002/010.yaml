source:
  edition: SBLGNT
  text: οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: ru
  text: вы, некогда не народ[a], а теперь — народ Божий; вы, не получившие милости[b], а теперь помилованные.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пётр перекликается с Ос. 1:9–10; 2:23, относя язык восстановления Израиля к нынешней принадлежности своих читателей к Божьему народу.
    reason: cross_reference
  - marker: b
    text: 'Или: «те, над кем не была явлена милость, а теперь явлена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: вы
  rationale: Относительное местоимение во множественном числе относится к адресатам предыдущего стиха; «вы» естественно продолжает обращение и не добавляет нового содержания.
- source_word: ποτε
  choice: некогда
  rationale: Передаёт прежнее состояние и образует ясное противопоставление с νῦν — «теперь».
- source_word: λαὸς
  choice: народ / народ Божий
  rationale: «Народ» сохраняет собирательный смысл и библейский язык принадлежности к Божьему народу; в первой части не добавлено отсутствующее в греческом определение «Божий».
- source_word: θεοῦ
  choice: Божий
  rationale: Естественно передаёт родительный падеж принадлежности в выражении λαὸς θεοῦ.
- source_word: οὐκ ἠλεημένοι
  choice: не помилованные
  rationale: Пассивное причастие сохраняет акцент на милости, оказанной адресатам, и результирующем состоянии; параллельная форма усиливает риторическую симметрию стиха.
- source_word: ἐλεηθέντες
  choice: помилованные
  rationale: Пассивное причастие передаёт совершившееся действие милости и нынешний статус адресатов, сохраняя параллелизм с οὐκ ἠλεημένοι.
- source_word: δὲ
  choice: а
  rationale: Русский противительный союз «а» естественно выражает контраст между «некогда» и «теперь» в обеих частях.
- source_word: νῦν
  choice: теперь
  rationale: Прямо обозначает нынешнее состояние в противоположность прежнему.
theological_decisions:
- issue: Аллюзия на Осию и язык идентичности Божьего народа
  choice: Сохранено различие между «не народ» и «народ Божий».
  alternative: Передать первую часть как «не Божий народ», сделав подразумеваемую связь явной.
  rationale: В греческом тексте сначала сказано οὐ λαός — «не народ», а затем λαὸς θεοῦ — «народ Божий». Такой перевод сохраняет формулировку и напряжение исходного текста, позволяя услышать отсылку к Осии без лишнего уточнения.
- issue: Способ передачи божественной милости
  choice: Использованы пассивные формы «не помилованные… помилованные».
  alternative: «Не получившие милости… получившие милость».
  rationale: Пассивные формы ближе к грамматике оригинала и оставляют подразумеваемого деятеля — Бога — не названным прямо, как и в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Эллиптический параллелизм оригинала сохранён; тире помогает ясно обозначить резкий переход от прежнего состояния к нынешнему.
