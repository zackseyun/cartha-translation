  - marker: b
    text: 'Или: «по совести перед Богом»; греческое выражение может указывать как на памятование о Боге, так и на совесть, обращённую к Нему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: благодать
  rationale: Сохраняет ключевую новозаветную лексическую связь и оценочный смысл слова в данном контексте; возможные значения «угодное» или «заслуживающее одобрения» пояснены в сноске, а не внесены в основной текст.
- source_word: διὰ συνείδησιν θεοῦ
  choice: памятуя о Боге
  rationale: Естественно передаёт направленную к Богу осознанность как причину стойкости. Компактная греческая фраза допускает также оттенок совести перед Богом, поэтому эта возможность сохранена в сноске.
- source_word: ὑποφέρει
  choice: переносит
  rationale: Передаёт терпеливую стойкость под тяжестью страданий естественным современным русским глаголом.
- source_word: λύπας
  choice: скорби
  rationale: Охватывает душевную боль, тяготы и страдания, не сужая значение до физической боли.
- source_word: πάσχων ἀδίκως
  choice: страдая несправедливо
  rationale: 'Близко передаёт обстоятельственное причастие и наречие: человек терпит страдание, которого не заслуживает.'
- source_word: τις
  choice: кто
  rationale: Русское неопределённое «кто» естественно передаёт обобщённое единственное число без ненужного указания пола.
- source_word: τοῦτο γὰρ
  choice: Ибо это
  rationale: Сохраняет объяснительную связь γάρ с предыдущим контекстом и указательное значение τοῦτο.
theological_decisions:
- issue: Значение χάρις в данном контексте
  choice: Сохранено слово «благодать».
  alternative: «Это угодно», «это похвально», «это заслуживает благоволения».
  rationale: Основной текст не добавляет прямо выражения «перед Богом» и сохраняет богословскую многозначность χάρις, тогда как оценочный оттенок раскрывается в сноске.
- issue: Значение συνείδησις θεοῦ
  choice: «памятуя о Боге» как осознанная обращённость к Богу.
  alternative: «ради совести перед Богом», «из сознания Бога».
  rationale: Выбранный вариант понятен по-русски и связывает стойкость с памятью о Боге, не превращая трудную фразу исключительно в указание на моральную совесть; альтернативный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Порядок слов ставит «памятуя о Боге» рядом с «переносит», чтобы ясно показать мотив стойкости, а не причину несправедливого обращения.
