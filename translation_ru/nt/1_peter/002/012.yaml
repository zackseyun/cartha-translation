source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: ru
  text: Живите среди язычников достойно, чтобы они в том, за что злословят вас как злодеев, видя ваши добрые дела, прославили Бога в день Его посещения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в день, когда Бог посетит людей». Выражение может указывать на Божье вмешательство ради спасения или суда; здесь его смысл не уточняется.'
    reason: Поясняет смысловую широту ἐπισκοπή, не снимая заложенную в оригинале неоднозначность.
lexical_decisions:
- source_word: ἀναστροφή
  choice: живите
  rationale: Слово обозначает образ жизни и поведение; русское «живите» естественно передаёт продолжительный характер призыва в сочетании с наречием «достойно».
- source_word: ἔθνη
  choice: язычники
  rationale: В данном контексте речь идёт о неверующем нееврейском окружении адресатов; традиционное «язычники» сохраняет библейское социально-религиозное значение.
- source_word: καλήν / καλῶν
  choice: достойно / добрые
  rationale: 'Разные русские соответствия позволяют естественно передать один корень в двух употреблениях: достойный образ жизни и добрые дела.'
- source_word: καταλαλοῦσιν
  choice: злословя
  rationale: Передаёт враждебную порочащую речь, не усиливая её до формального обвинения или клеветы.
- source_word: ἐποπτεύοντες
  choice: увидели
  rationale: Глагол подразумевает внимательное наблюдение очевидца; в русском контексте «увидели ваши добрые дела» звучит естественно, хотя оттенок наблюдения несколько сжат.
- source_word: ἐπισκοπή
  choice: посещение
  rationale: Сохраняет намеренно открытую библейскую формулировку о Божьем посещении, не решая заранее, означает ли оно спасительное явление, суд или и то и другое.
theological_decisions:
- issue: Значение выражения ἐν ἡμέρᾳ ἐπισκοπῆς
  choice: в день Его посещения
  alternative: в день, когда Бог посетит людей
  rationale: Буквальное существительное «посещение» сохраняет эсхатологическую и богословскую неоднозначность исходного текста. Местоимение «Его» ясно связывает посещение с Богом, не уточняя его характер.
- issue: Связь ἐν ᾧ с последующим καταλαλοῦσιν
  choice: чтобы они, злословя вас как злодеев, ...
  alternative: чтобы в том, за что они злословят вас как злодеев, ...
  rationale: Греческое выражение допускает значение «в чём / в том, за что» или более идиоматическое обстоятельственное «хотя / когда». Основной текст передаёт ситуацию естественным русским деепричастным оборотом без добавления уступительного «хотя», которого формально нет.
- issue: Кто прославит Бога
  choice: они ... прославили Бога
  alternative: язычники ... прославили Бога
  rationale: 'Сохраняется грамматический субъект, подразумеваемый из «среди язычников»: именно наблюдающие недоброжелатели могут прийти к прославлению Бога.'
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Императивное значение причастной конструкции передано естественным призывом «Живите достойно». Избегнуты архаизмы «добродетельно», «посещение Божие» и неестественная калька «в том, в чём злословят».
