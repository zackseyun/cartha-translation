lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: отложив
  rationale: Аористное причастие обозначает действие, предшествующее призыву в ст. 2, и сохраняет образ снятия или устранения чего-либо.
- source_word: οὖν
  choice: Итак
  rationale: Передаёт вывод из предшествующего контекста, особенно 1:22–25, естественно и ясно для современного русского текста.
- source_word: πᾶσαν κακίαν
  choice: всякую злобу
  rationale: В данном перечне пороков κακία указывает прежде всего на злой умысел и недоброжелательность по отношению к другим, а не просто на зло вообще.
- source_word: πάντα δόλον
  choice: всякое коварство
  rationale: δόλος означает обман, хитрость или вероломный умысел; «коварство» естественно сочетается с нравственным перечнем и передаёт намеренную обманчивость.
- source_word: ὑποκρίσεις
  choice: лицемерие
  rationale: Хотя в греческом стоит множественное число, в современном русском абстрактное существительное естественнее употребляется в единственном числе и охватывает различные проявления лицемерия.
- source_word: φθόνους
  choice: зависть
  rationale: Русское абстрактное существительное в единственном числе естественно передаёт греческое множественное число, обозначающее проявления зависти.
- source_word: πάσας καταλαλιάς
  choice: всякое злословие
  rationale: καταλαλιά обозначает речь против других, включая порочащие и недоброжелательные высказывания; «злословие» сохраняет этот широкий смысл без сужения до юридической клеветы.
theological_decisions:
- issue: Формулировка перечня пороков и широта нравственного смысла
  choice: Передать каждый порок конкретным современным нравственным термином без доктринального расширения.
  alternative: Перевести κακία более широко как «всякое зло», а καταλαλιάς — более узко как «клевету».
  rationale: Контекст содержит практическое нравственное наставление. Выбранные соответствия передают направленность пороков против других людей и не вносят в текст дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Причастная конструкция и завершающая запятая сохранены, поскольку мысль продолжается главным призывом в 2:2. Греческие формы множественного числа ὑποκρίσεις и φθόνους переданы естественными для русского языка собирательными формами единственного числа.
