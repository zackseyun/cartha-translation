  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Ὑποτάγητε — призыв подчиняться; πάσῃ ἀνθρωπίνῃ κτίσει в контексте относится к человеческому гражданскому порядку; διὰ τὸν κύριον передано без неоправданного уточнения референта. Однако в данном синтаксисе «будь то царь» стоит в именительном падеже, тогда как греческий βασιλεῖ зависит от призыва «подчиняйтесь» и требует в русском дательного: «царю».'
  naturalness: «Подчиняйтесь всякому человеческому установлению ради Господа» — современная литературная и понятная формулировка. Исправление падежа и замена несколько отвлечённого приложения «как высшая власть» на характеристику лица делают продолжение фразы грамматически и стилистически естественнее.
  terminology: «Господь» сохраняет исходную неопределённость κύριον. «Царь» точно отражает βασιλεῖ, не сужая его до «императора». «Стоящему выше других» передаёт сравнительно-иерархический смысл ὑπερέχοντι, не приписывая царю безусловного верховенства.
