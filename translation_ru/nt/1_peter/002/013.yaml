  text: ⸀Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει διὰ τὸν κύριον· εἴτε βασιλεῖ ὡς ὑπερέχοντι,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/013.yaml
  text: Submit yourselves to every human institution for the Lord’s sake[a], whether to a king as one in authority[b],
translation:
  language: ru
  text: Подчиняйтесь всякому человеческому установлению ради Господа[a] — будь то царю, как тому, кто стоит выше других[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «всякому человеческому созданию»; традиционно также: «всякому человеческому постановлению». Здесь выражение относится к человеческим гражданским установлениям или властям, как показывают следующие упоминания царя и правителей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как верховному правителю»; буквально: «как стоящему выше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: Подчиняйтесь
  rationale: Аористный императив передаёт прямое увещание добровольно признавать установленный порядок; «подчиняйтесь» естественно и ясно звучит в современном русском языке.
- source_word: πάσῃ
  choice: всякому
  rationale: 'При существительном в единственном числе слово имеет распределительное значение: «всякому», «каждому».'
- source_word: ἀνθρωπίνῃ κτίσει
  choice: человеческому установлению
  rationale: Буквально сочетание допускает значение «человеческое создание», однако последующие примеры царя и правителей указывают на общественно-гражданские установления или органы власти. «Установление» сохраняет институциональный смысл, не превращая его прямо в обозначение отдельного лица.
- source_word: διὰ τὸν κύριον
  choice: ради Господа
  rationale: διά с винительным обозначает основание или побуждение; краткое «ради Господа» естественно передаёт мотив подчинения.
- source_word: κύριον
  choice: Господа
  rationale: Перевод сохраняет титул без уточнения «Иисуса» или «Бога», поскольку в греческом тексте такое уточнение отсутствует.
- source_word: εἴτε
  choice: будь то
  rationale: Оборот вводит первый элемент продолжающейся в следующем стихе соотносительной конструкции и естественно звучит перед перечислением.
- source_word: βασιλεῖ
  choice: царь
  rationale: Основное значение βασιλεύς — «царь». Хотя в римском контексте возможен «император», более широкое лексическое значение не следует сужать без необходимости.
- source_word: ὡς ὑπερέχοντι
  choice: как высшая власть
  rationale: Причастие обозначает того, кто занимает более высокое положение или обладает превосходящей властью. Формулировка передаёт официальный статус, не утверждая абсолютного верховенства во всех отношениях.
theological_decisions:
- issue: Значение ἀνθρωπίνῃ κτίσει применительно к гражданской власти
  choice: человеческое установление
  alternative: человеческое создание; всякое постановление людей; человеческая власть
  rationale: Ближайший контекст называет царя и правителей, поэтому речь идёт о человеческих общественно-гражданских структурах. При этом примечание сохраняет необычную буквальную семантику κτίσις и не приписывает фразе более определённую доктрину происхождения власти, чем выражено в тексте.
- issue: Референт κύριον
  choice: Господь без дополнительного уточнения
  alternative: Иисус; Бог
  rationale: Исходный текст содержит только титул κύριος. Сохранение неоднозначности не вносит отсутствующего в стихе уточнения.
- issue: Степень превосходства в ὑπερέχοντι
  choice: высшая власть в рамках названного гражданского порядка
  alternative: верховный; превосходящий других
  rationale: Слово выражает более высокое положение, но перевод не должен создавать впечатление безусловного духовного или метафизического верховенства царя.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Подчиняйтесь» сохраняет силу увещания; «человеческое установление» передаёт контекстуальный институциональный смысл, а сноска удерживает буквальную неоднозначность. Двоеточие и «будь то» показывают, что перечисление продолжается в следующем стихе.
