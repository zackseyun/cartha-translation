source:
  edition: SBLGNT
  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: ru
  text: Приходя к Нему[a] — к живому камню, отвергнутому людьми[b], но у Бога избранному и драгоценному, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к Которому приходя»; возможно также: «когда вы приходите к Нему».'
    reason: Сохраняется формальная и аспектуально-временная альтернатива передачи греческого причастного оборота.
  - marker: b
    text: Греческое слово может означать «людьми», «человеческими существами» или «народом».
    reason: Поясняется общий человеческий референт греческого ἀνθρώπων; сноска соответствует аудиторскому следу.
lexical_decisions:
- source_word: Πρὸς ὃν
  choice: к Нему
  rationale: Сочетание с глаголом движения естественно передаётся направительным оборотом «к Нему»; местоимение сохраняет форму исходного текста и связь с Господом из ближайшего контекста.
- source_word: προσερχόμενοι
  choice: приходя
  rationale: Причастие настоящего времени выражает продолжающееся приближение адресатов; деепричастие сохраняет связь с последующим контекстом и не превращает оборот в отдельное повеление.
- source_word: λίθον ζῶντα
  choice: живому камню
  rationale: Сохраняется парадоксальная строительная метафора; «камень» точнее, чем «скала».
- source_word: ὑπὸ ἀνθρώπων
  choice: людьми
  rationale: ἄνθρωποι здесь обозначает людей в противопоставлении Богу; русское «людьми» точно и естественно передаёт общий человеческий референт без необоснованного ограничения мужчинами.
- source_word: ἀποδεδοκιμασμένον
  choice: отвергнутому
  rationale: Передаёт результат предшествующей отрицательной оценки, выраженный перфектным страдательным причастием.
- source_word: παρὰ δὲ θεῷ
  choice: но … у Бога
  rationale: Παρά с дательным обозначает положение и оценку в отношении Бога; «у Бога» кратко сохраняет исходную конструкцию и её оценочный смысл.
- source_word: ἐκλεκτὸν
  choice: избранному
  rationale: Точно передаёт выбор Богом и сохраняет согласование с образом камня.
- source_word: ἔντιμον
  choice: драгоценному
  rationale: Передаёт высокую ценность и почёт, одновременно естественно сочетаясь с образом камня.
theological_decisions:
- issue: К кому относится местоимение и образ живого камня
  choice: Сохранено местоимение «Нему», относящееся в контексте к Господу Иисусу Христу.
  alternative: Явно вставить имя «Иисусу Христу».
  rationale: Контекст 1 Пет. 2:3–8 указывает на Христа, однако греческий текст этого стиха использует местоимение; вставка имени устранила бы формальную связь и сделала перевод более истолковательным.
- issue: Соотношение человеческой и Божьей оценки
  choice: 'Сохранено противопоставление: отвергнут людьми, но избран и драгоценен у Бога.'
  alternative: «В глазах Бога» или «перед Богом».
  rationale: Формулировка не сглаживает богословское напряжение между человеческим отвержением и Божьим избранием и признанием ценности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис сохраняет незавершённость стиха и его переход к следующему предложению. Прописная буква в «Нему» служит ясности традиционного русского библейского письма, не добавляя имени в основной текст.
