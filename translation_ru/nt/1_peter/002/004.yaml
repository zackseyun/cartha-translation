  source_fidelity: 'Смысл передан в целом точно: сохраняются направленность «к Нему», образ живого камня, человеческое отвержение и Божье избрание с высокой ценностью. Однако сноска b в проекте не соответствует английскому аудиторскому следу: в нём она поясняет ἀνθρώπων («людьми»), тогда как русский черновик привязывает её к «Бога» и поясняет παρά с дательным. Кроме того, постановка «у Бога» после обоих однородных определений менее ясна, чем «но у Бога избранному и драгоценному».'
