translation:
  language: ru
  text: если вы действительно вкусили, что благ Господь[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поскольку вы вкусили». Греческий союз εἰ вводит условный оборот, который здесь может подразумевать, что условие действительно исполнено.'
    reason: alternative_reading
  - marker: b
    text: «Благ» можно также перевести как «добр» или «милостив». Эта формулировка перекликается с Пс. 33:9.
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: если действительно
  rationale: Сохраняет условную форму греческого εἰ и одновременно передаёт риторически предполагаемую истинность условия; не превращает его безоговорочно в причинное «поскольку».
- source_word: ἐγεύσασθε
  choice: вы вкусили
  rationale: Сохраняет буквальный образ вкушения, важный и для ближайшего образа духовного питания в 1 Пет. 2:2–3, и для отсылки к Пс. 33:9 (LXX 34:8); русская форма совершенного вида естественно выражает состоявшийся опыт.
- source_word: ὅτι
  choice: что
  rationale: 'Прямо передаёт союз, вводящий содержание пережитого: вкусили, что Господь благ.'
- source_word: χρηστὸς
  choice: благ
  rationale: «Благ» передаёт широкое значение доброты и благости, сохраняет торжественный библейский оттенок и отсылку к псалму, не сужая смысл до одной лишь доброты или милости.
- source_word: κύριος
  choice: Господь
  rationale: Обычный эквивалент κύριος; сохраняет как связь контекста с Христом, так и намеренное созвучие с формулировкой псалма.
theological_decisions:
- issue: Сила условного оборота с εἰ
  choice: «если вы действительно вкусили»
  alternative: «поскольку вы вкусили»
  rationale: Хотя условие, вероятно, предполагается исполненным, греческий текст сохраняет условную форму. Основной перевод удерживает эту риторическую напряжённость, а «действительно» указывает на ожидаемую реальность опыта.
- issue: Кого обозначает «Господь»
  choice: Оставить «Господь» без пояснения в основном тексте
  alternative: «Господь Христос»
  rationale: В контексте речь тесно связана с Иисусом Христом, однако формулировка одновременно отсылает к Пс. 33:9. Простое «Господь» сохраняет обе стороны этой связи и не вносит толкование прямо в текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Вкусили» и «благ» сохраняют образность и межтекстовую связь, оставаясь понятными современному читателю.
