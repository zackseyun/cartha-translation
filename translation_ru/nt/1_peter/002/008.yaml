  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: ru
  text: 'и: «камень преткновения и скала соблазна». Они спотыкаются, потому что не повинуются слову; к этому они и были предназначены.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к этому они и были поставлены». Выражение «к этому» в греческом тексте может относиться к их преткновению, неповиновению или ко всему описанному исходу.'
    reason: Сохраняет синтаксическую неоднозначность εἰς ὃ и отмечает более буквальную передачу ἐτέθησαν, не разрешая спорный антецедент.
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: камень преткновения
  rationale: Сохраняет образ и устойчивую библейскую формулировку, оставаясь понятным в современном русском языке.
- source_word: πέτρα σκανδάλου
  choice: скала соблазна
  rationale: Передаёт различие между λίθος («камень») и πέτρα («скала»); «соблазн» здесь означает причину падения, что пояснено сноской.
- source_word: προσκόπτουσιν
  choice: претыкаются
  rationale: Сохраняет лексическую связь с προσκόμματος и развивает образ столкновения с камнем.
- source_word: τῷ λόγῳ ἀπειθοῦντες
  choice: не повинуясь слову
  rationale: Дательный τῷ λόγῳ естественно понимается при ἀπειθοῦντες как объект неповиновения; причастный оборот сохраняет связь неповиновения с преткновением.
- source_word: εἰς ὃ καὶ ἐτέθησαν
  choice: на это они и были определены
  rationale: Сохраняет пассивную форму и неоднозначность указания εἰς ὃ, не уточняя сверх текста, относится ли оно непосредственно к преткновению, неповиновению или описанному исходу в целом.
theological_decisions:
- issue: К чему относится εἰς ὃ («на это»)
  choice: Сохранено обобщённое «на это»
  alternative: «к этому преткновению» или «к этому неповиновению»
  rationale: Греческое относительное местоимение допускает спор о точном антецеденте; перевод не должен молча разрешать богословское напряжение.
- issue: Значение ἐτέθησαν
  choice: «были определены»
  alternative: «были поставлены» / «были предназначены»
  rationale: «Определены» естественно передаёт божественный пассив и назначение, не добавляя указания на действующее лицо; «предназначены» могло бы звучать более жёстко и детерминистично, чем требуется контекстом.
translation_notes:
  register: Современный литературный русский с достоинством библейского стиля. Устойчивые выражения «камень преткновения» и «скала соблазна» сохранены; менее очевидный исторический смысл слова «соблазн» раскрывается контекстом преткновения. Сноска [a] присутствует в основном тексте.
