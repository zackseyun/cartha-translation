  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: ru
  text: И вы сами[a], как живые камни, созидаетесь в духовный дом, в святое священство[b][d], чтобы приносить духовные жертвы, угодные Богу через Иисуса Мессию[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «и вы тоже, подобно живым камням».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен перевод: «для святого священства» или «чтобы быть святым священством». Греческий предлог может обозначать цель или результат.'
    reason: alternative_reading
  - marker: c
    text: 'По-гречески: «Иисуса Христа»; здесь Χριστός передано по значению титула: «Мессия».'
    reason: lexical_alternative
  - marker: d
    text: 'Возможное понимание связи образов: «созидаетесь как духовный дом для святого священства».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: и вы сами
  rationale: «Сами» передаёт эмфатическое αὐτοί, а «и» сохраняет связь с предшествующим образом Христа как живого камня.
- source_word: ὡς λίθοι ζῶντες
  choice: как живые камни
  rationale: Сохраняет прямое сравнение и повторяет образ «живого камня» из ближайшего контекста.
- source_word: οἰκοδομεῖσθε
  choice: созидаетесь
  rationale: Настоящее страдательное сохраняет продолжающееся действие и не называет прямо действующего, которого сам стих не указывает.
- source_word: οἶκος πνευματικός
  choice: в духовный дом
  rationale: Передаёт результат строительного образа; «духовный» не конкретизируется сверх сказанного в тексте.
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: в святое священство
  rationale: Предлог «в» сохраняет направленность или результат εἰς, а «священство» обозначает совокупное священническое тело, а не только отдельных священников.
- source_word: ἀνενέγκαι πνευματικὰς θυσίας
  choice: чтобы приносить духовные жертвы
  rationale: В жертвенном контексте ἀναφέρω означает «приносить»; цель инфинитива естественно выражена союзом «чтобы».
- source_word: εὐπροσδέκτους θεῷ
  choice: угодные Богу
  rationale: Естественно передаёт мысль о жертвах, которые Бог благосклонно принимает, не добавляя причины их приемлемости.
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: через Иисуса Мессию
  rationale: «Через» передаёт посредство διά с родительным падежом; Χριστός передан как титул «Мессия».
theological_decisions:
- issue: Залог и подразумеваемый деятель в οἰκοδομεῖσθε
  choice: страдательное «созидаетесь» без названного деятеля
  alternative: «созидайте из себя» или явное «Бог созидает вас»
  rationale: Форма допускает сохранение страдательного смысла; перевод не превращает её в повеление и не вводит прямо Бога как деятеля, хотя контекст может подразумевать его действие.
- issue: Значение εἰς перед ἱεράτευμα ἅγιον
  choice: «в святое священство» с пояснением неоднозначности
  alternative: «для святого священства» или «чтобы быть святым священством»
  rationale: εἰς может указывать на цель либо результат. Основной текст сохраняет направленность, а примечание не позволяет молча устранить неоднозначность.
- issue: Передача Χριστοῦ
  choice: «Мессию» как титул
  alternative: традиционное «Христа»
  rationale: В сочетании с личным именем слово сохраняет мессианский титульный смысл; примечание сообщает традиционный русский эквивалент.
- issue: Связь οἶκος πνευματικός и εἰς ἱεράτευμα ἅγιον
  choice: два тесно связанных образа, разделённые тире
  alternative: понимать всё выражение как «духовный дом для святого священства»
  rationale: Греческий синтаксис с двумя именными образами допускает разные способы соотнесения. Тире сохраняет их тесную связь, не сводя один образ однозначно к назначению другого.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Созидаетесь» сохранено ради строительного образа и страдательного залога; тире помогает прочитать трудную греческую конструкцию, не устраняя её смыслового напряжения.
