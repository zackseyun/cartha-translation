  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: ru
  text: Но вы — избранный род[a], царственное священство, святой народ, народ, принадлежащий Богу[b], чтобы возвещать совершенства[c] Того, кто призвал вас из тьмы в Свой дивный свет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избранный народ». Греческое слово может обозначать род, племя или народ как общность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «народ для особого достояния»; также возможно: «народ, взятый в удел».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «достоинства», «деяния, достойные хвалы»; возможный смысл — «великие дела».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: Но вы
  rationale: δὲ обозначает противопоставление предыдущему описанию неверующих, а выраженное местоимение Ὑμεῖς придаёт обращению акцент. «Но вы» естественно передаёт обе особенности.
- source_word: γένος ἐκλεκτόν
  choice: избранный род
  rationale: γένος может обозначать род, происхождение или народ. «Избранный род» сохраняет собирательный смысл и ветхозаветное звучание, не сводя выражение к современной расовой категории.
- source_word: βασίλειον ἱεράτευμα
  choice: царственное священство
  rationale: Компактно передаёт как царское, так и священническое измерение выражения и сохраняет связь с Исх. 19:6 в Септуагинте.
- source_word: ἔθνος ἅγιον
  choice: святой народ
  rationale: Прямой и естественный перевод, сохраняющий смысл посвящённости Богу и отделённости для Него.
- source_word: λαὸς εἰς περιποίησιν
  choice: народ, принадлежащий Богу
  rationale: περιποίησις здесь выражает особое обладание или приобретение. Имя Бога эксплицирует очевидного из контекста владельца и делает фразу естественной по-русски, не добавляя идеи, отсутствующей в тексте.
- source_word: ὅπως
  choice: чтобы
  rationale: Передаёт целевое значение союза.
- source_word: τὰς ἀρετὰς
  choice: совершенства
  rationale: ἀρετή во множественном числе может обозначать превосходные, достойные хвалы качества и проявления. «Совершенства» сохраняет широту значения, не ограничивая его только словами хвалы или только деяниями.
- source_word: ἐξαγγείλητε
  choice: возвещать
  rationale: Передаёт публичный, провозгласительный характер глагола ἐξαγγέλλω и естественно сочетается с целевым оборотом.
- source_word: τοῦ ... καλέσαντος
  choice: Того, кто призвал
  rationale: Сохраняет личную характеристику Бога через Его действие, не вставляя Его имя непосредственно в эту конструкцию.
- source_word: ἐκ σκότους
  choice: из тьмы
  rationale: Передаёт движение из прежней области или состояния.
- source_word: εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: в Свой дивный свет
  rationale: «Дивный» естественно и возвышенно передаёт θαυμαστός, а возвратное «Свой» ясно связывает свет с призвавшим.
theological_decisions:
- issue: Коллективные титулы, восходящие к языку завета с Израилем
  choice: Сохранить прямые наименования «избранный род», «царственное священство» и «святой народ».
  alternative: Ослабить их до отвлечённых метафорических характеристик.
  rationale: Автор намеренно применяет к адресатам ветхозаветные наименования народа завета. Перевод сохраняет это богословское напряжение, не объясняя его в рамках какой-либо поздней системы.
- issue: Подразумеваемый обладатель в λαὸς εἰς περιποίησιν
  choice: Передать как «народ, принадлежащий Богу».
  alternative: 'Более буквально: «народ для обладания» или традиционно: «народ, взятый в удел».'
  rationale: В греческой фразе обладатель не назван, но из контекста им является Бог. Экспликация необходима для ясного и естественного русского выражения и не вносит отдельного вероучительного утверждения.
- issue: Объём значения τὰς ἀρετὰς
  choice: Передать как «совершенства».
  alternative: «Достоинства», «хвалы» или «великие дела».
  rationale: Слово может охватывать достойные хвалы качества Бога и их проявление в Его делах. Основной вариант не разрешает неоднозначность в пользу только качеств или только действий; альтернативы отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной библейской возвышенностью. Синтаксический параллелизм четырёх коллективных наименований сохранён. Заглавные буквы в «Того» и «Свой» следуют распространённой русской издательской норме для местоименных обозначений Бога, не меняя смысла исходного текста.
