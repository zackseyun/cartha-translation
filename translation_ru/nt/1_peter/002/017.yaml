  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: ru
  text: Всех почитайте, братство[a] любите, Бога бойтесь, царя[b] почитайте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Братство» — сообщество братьев и сестёр по вере.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «императора». Греческое слово буквально означает «царь», но в римском контексте Пётр, вероятно, имеет в виду императора.'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: всех
  rationale: Субстантивированное множественное число πᾶς охватывает всех людей; краткое «всех» естественно в русском языке и сохраняет всеобщий охват повеления.
- source_word: τιμήσατε / τιμᾶτε
  choice: почитайте / почитайте
  rationale: Одинаковый перевод сохраняет повтор глагола τιμάω в начале и конце стиха. «Почитайте» передаёт уважение и признание достоинства точнее и весомее, чем нейтральное «уважайте»; различие видовременных форм греческого императива здесь не следует искусственно усиливать по-русски.
- source_word: ἀδελφότητα
  choice: братство
  rationale: Слово обозначает братское сообщество, в данном контексте — общину верующих. «Братство» сохраняет семейный и собирательный образ греческого слова; значение пояснено в сноске.
- source_word: ἀγαπᾶτε
  choice: любите
  rationale: Прямой и естественный перевод настоящего повелительного наклонения ἀγαπάω; длительный характер действия в русском повелении достаточно выражен контекстом.
- source_word: τὸν θεὸν
  choice: Бога
  rationale: Прямой перевод определённого объекта глагола φοβεῖσθε.
- source_word: φοβεῖσθε
  choice: бойтесь
  rationale: Сохраняет прямое, сильное значение φοβέομαι и не ослабляет его до одного лишь почтения. Сопоставление с «почитайте царя» подчёркивает различие между отношением к Богу и к правителю.
- source_word: τὸν βασιλέα
  choice: царя
  rationale: βασιλεύς буквально означает царя или правителя, но в римском контексте, вероятно, указывает на императора. Основной текст сохраняет прямое значение, а исторически вероятный референт отмечен в сноске.
theological_decisions:
- issue: Различие между отношением к Богу и отношением к гражданскому правителю
  choice: «Бога бойтесь, царя почитайте»
  alternative: «Бога чтите, правителя уважайте»
  rationale: Разные греческие глаголы намеренно разграничивают должное Богу и должное земному правителю. «Бойтесь» и «почитайте» сохраняют эту смысловую и богословскую иерархию, не развивая из краткого повеления более широкую политическую доктрину.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным рядом из четырёх повелений. Порядок слов сохраняет параллелизм оригинала и обрамляющий повтор «почитайте». Библейски узнаваемые «братство» и «бойтесь» оставлены без архаической грамматики; сноски снимают возможную лексическую и историческую неясность.
