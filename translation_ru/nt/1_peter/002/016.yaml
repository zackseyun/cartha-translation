  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: ru
  text: как свободные люди, но не как те, кто использует свободу как прикрытие для зла, а как рабы Бога[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуги Бога». Греческое слово может обозначать и раба, и слугу; вариант «рабы» сохраняет более резкий контраст со «свободными людьми».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: свободные люди
  rationale: Прилагательное во множественном числе обозначает всех адресатов. «Свободные люди» естественно передаёт их положение и подготавливает контраст с «рабами Бога».
- source_word: ἐπικάλυμμα
  choice: прикрытие
  rationale: Слово обозначает покрытие, скрывающее что-либо. «Прикрытие» сохраняет образ и в современном русском языке естественно выражает средство сокрытия дурных поступков.
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: использует свободу
  rationale: Буквально конструкция говорит об «имеющих свободу как прикрытие», но по-русски инструментальный смысл естественнее передать глаголом «использует».
- source_word: κακίας
  choice: зло
  rationale: В данном контексте κακία обозначает нравственное зло в широком смысле; «злоба» неоправданно сузила бы значение.
- source_word: δοῦλοι
  choice: рабы
  rationale: 'Слово указывает на несвободное положение и принадлежность господину. «Рабы» сохраняет намеренный парадокс: верующие свободны и вместе с тем всецело принадлежат Богу.'
- source_word: θεοῦ δοῦλοι
  choice: рабы Бога
  rationale: Родительный падеж выражает принадлежность Богу. Эта формулировка ясна и сохраняет резкий контраст со «свободными людьми».
theological_decisions:
- issue: Передача δοῦλοι как обозначения принадлежности верующих Богу
  choice: рабы Бога
  alternative: слуги Бога
  rationale: В стихе свобода намеренно сопоставлена с полной принадлежностью Богу. «Рабы» сохраняет эту богословскую напряжённость, тогда как «слуги» смягчило бы социальный и риторический смысл исходного слова.
translation_notes:
  register: Современный литературный русский язык; конструкция перестроена для естественности, при этом сохранены метафора прикрытия и парадокс свободы и рабства. Тире помогает ясно связать противопоставленные характеристики с зависимым оборотом «как».
