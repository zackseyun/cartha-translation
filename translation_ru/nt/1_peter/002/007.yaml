  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: ru
  text: 'Итак, вам, верующим, — честь[a], а для неверующих[b]: «Камень, который отвергли строители, стал краеугольным камнем[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «драгоценность — для вас, верующих»; то есть этот камень драгоценен для верующих.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «для непокорных»; этот глагол может обозначать отказ верить, проявляющийся в неповиновении.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «главой угла»; или: «главным краеугольным камнем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: честь
  rationale: Сохраняет наиболее прямой смысл греческого выражения ὑμῖν ... ἡ τιμή и его противопоставление участи неверующих, не сводя значение исключительно к драгоценности камня.
- source_word: τοῖς πιστεύουσιν
  choice: вам, верующим
  rationale: Передаёт и личное обращение ὑμῖν, и субстантивированное причастие, оставаясь естественным по-русски.
- source_word: ἀπιστοῦσιν
  choice: для неверующих
  rationale: Непосредственно противопоставлено πιστεύουσιν и прежде всего означает тех, кто не верит; возможный оттенок неповиновения отмечен в сноске.
- source_word: λίθος
  choice: камень
  rationale: Обычный и точный эквивалент в строительном образе и в цитате из Псалма.
- source_word: ἀπεδοκίμασαν
  choice: отвергли
  rationale: Естественно передаёт отказ после оценки или испытания, не перегружая русский текст пояснением.
- source_word: οἰκοδομοῦντες
  choice: строители
  rationale: Естественная русская передача субстантивированного причастия в строительной метафоре.
- source_word: κεφαλὴν γωνίας
  choice: главой угла
  rationale: Прозрачно сохраняет буквальный образ греческой цитаты и не сужает его заранее до одного конкретного архитектурного толкования.
theological_decisions:
- issue: Значение ἡ τιμή применительно к верующим и Христу как камню
  choice: Честь принадлежит верующим.
  alternative: Для верующих этот камень драгоценен.
  rationale: Конструкция ὑμῖν ... ἡ τιμή естественнее всего указывает на честь, предназначенную верующим, и перекликается с темой отсутствия стыда; возможная отсылка к драгоценности самого камня сохранена в сноске.
- issue: Передача κεφαλὴ γωνίας
  choice: Сохранён прозрачный образ «глава угла».
  alternative: краеугольный камень; главный краеугольный камень
  rationale: Буквальный образ цитаты допускает разные представления об архитектурной функции камня; традиционный истолковывающий эквивалент дан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской цитаты. Тире после «верующим» восполняет опущенную в греческом связку; двоеточие естественно вводит относящуюся к неверующим цитату. Порядок маркеров следует месту соответствующих выражений в русском тексте.
