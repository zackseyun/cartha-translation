  text: ὃς ἁμαρτίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/022.yaml
  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: ru
  text: Он не совершил греха[b], и не нашлось лукавства в устах Его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обмана», «коварства»; греческое слово может обозначать обман, мошенничество или вероломство.'
    reason: lexical_alternative
  - marker: b
    text: Эти слова перекликаются с Ис 53:9.
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: Он
  rationale: Относительное местоимение относится к Христу в предыдущем контексте. В отдельном русском стихе личное местоимение звучит естественнее, не меняя референта.
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: не совершил греха
  rationale: Сочетание ποιέω с ἁμαρτία передаёт совершение греха; родительный падеж при отрицании естественен в литературном русском и сохраняет категориальное единственное число.
- source_word: οὐδὲ
  choice: и не
  rationale: Передаёт присоединительную отрицательную связь между двумя однородными утверждениями без искусственно книжного оборота.
- source_word: εὑρέθη
  choice: не нашлось
  rationale: Сохраняет значение пассивной конструкции и отзвук Ис 53:9, не уточняя того, кто мог искать или обнаружить.
- source_word: δόλος
  choice: лукавство
  rationale: Обозначает обман, коварство или вероломство; «лукавство» естественно сочетается с образом уст и сохраняет библейский, но понятный регистр.
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: в устах Его
  rationale: Сохраняет телесную метафору оригинала и связь с формулировкой Ис 53:9; «уста» уместны в современном литературном библейском регистре.
theological_decisions:
- issue: Отзвук Ис 53:9 в описании безгрешности и правдивости Христа
  choice: Сохранить близкие к греческому формулировки «не совершил греха» и «не нашлось лукавства в устах Его».
  alternative: «Он никогда не грешил и никогда не говорил неправды».
  rationale: Более формальная передача удерживает мессианский отзвук Исайи и богословскую силу утверждения, не превращая текст в разъясняющий пересказ.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис остаётся ясным для обычного читателя; образ «в устах» и пассивная формулировка сохранены ради связи с Исайей.
