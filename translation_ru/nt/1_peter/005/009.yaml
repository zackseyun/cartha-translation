source:
  edition: SBLGNT
  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: ru
  text: Противостойте ему, твёрдо держась веры и зная, что ваше братство[a] в мире переживает такие же страдания.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Братство» означает всё сообщество верующих — и мужчин, и женщин.
    reason: Культурное пояснение собирательного значения ἀδελφότης.
  - marker: b
    text: 'Греческий глагол может также передаваться более буквально: «такие же страдания осуществляются» или «доводятся до конца» в вашем братстве.'
    reason: Сохранение лексико-синтаксической неоднозначности страдательного глагола ἐπιτελεῖσθαι.
lexical_decisions:
- source_word: ᾧ
  choice: ему
  rationale: Дательный падеж относительного местоимения отсылает к дьяволу в ст. 8; по-русски естественно передать его личным местоимением после «противостойте».
- source_word: ἀντίστητε
  choice: противостойте
  rationale: Аорист повелительного наклонения выражает решительный призыв к сопротивлению; «противостойте» точно и естественно передаёт эту силу.
- source_word: στερεοὶ τῇ πίστει
  choice: твёрдые в вере
  rationale: 'Предикативное прилагательное характеризует тех, кто противостоит. Формулировка сохраняет возможную широту τῇ πίστει: личную веру и укоренённость в исповедуемой вере.'
- source_word: εἰδότες
  choice: зная
  rationale: Деепричастие естественно сохраняет греческую причастную конструкцию, обозначающую сопутствующее основание призыва.
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: такие же страдания
  rationale: Конструкция указывает на страдания того же рода, а не обязательно на полностью тождественные события.
- source_word: τῇ ἐν τῷ κόσμῳ ὑμῶν ἀδελφότητι
  choice: ваше братство по всему миру
  rationale: ἀδελφότης — собирательное обозначение сообщества верующих. «По всему миру» естественно передаёт мировую распространённость этого сообщества.
- source_word: ἐπιτελεῖσθαι
  choice: претерпевает
  rationale: Пассивный инфинитив допускает оттенок исполнения или доведения до конца, но применительно к страданиям русское «претерпевает» ясно передаёт переживание и перенесение страданий без неестественной формулировки.
theological_decisions:
- issue: Значение τῇ πίστει
  choice: в вере
  alternative: в исповедуемой вере / верою
  rationale: Артикль и контекст допускают отсылку к христианской вере как исповеданию, однако форма «в вере» не устраняет возможный смысл личного доверия и стойкости.
- issue: Значение ἀδελφότητι
  choice: братство
  alternative: семья верующих / братья и сёстры
  rationale: Сохранён собирательный семейный образ греческого существительного без сведения его только к мужчинам; это пояснено в сноске.
- issue: Значение ἐπιτελεῖσθαι
  choice: претерпевает
  alternative: исполняются / доводятся до конца
  rationale: Глагол может обозначать осуществление или завершение. В данном синтаксическом контексте речь естественно понимается как перенесение тех же страданий сообществом верующих, но альтернативный оттенок сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. Инверсия «твёрдые в вере» сохраняет связь с повелением и звучит естественно; «братство» оставляет исходный собирательный образ, а сноска предупреждает ошибочное понимание как исключительно мужской группы.
