  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: ru
  text: Через Силуана[a], которого считаю верным братом, я вкратце написал вам, увещевая и свидетельствуя, что это истинная благодать Божья. Стойте в ней твёрдо.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «через Силуана» указывает на его посредничество, но не уточняет, доставил ли он письмо, записал его или исполнил иную роль.
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «в ней вы стоите» вместо «Стойте в ней твёрдо».'
    reason: textual_variant
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: Через Силуана
  rationale: διά с родительным падежом выражает посредничество. Перевод сохраняет возможность того, что Силуан был доставившим письмо или участвовал в его составлении, но не уточняет его роль сверх сказанного в тексте.
- source_word: τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι
  choice: которого считаю верным братом
  rationale: Естественная русская формулировка передаёт личную оценку Петра и связывает πιστοῦ с характеристикой Силуана. «Верным» сохраняет возможные оттенки преданности и надёжности.
- source_word: δι’ ὀλίγων ἔγραψα
  choice: я вкратце написал вам
  rationale: Идиома δι’ ὀλίγων означает краткое, немногословное изложение. Совершенный вид «написал» естественно передаёт эпистолярный аорист в заключении письма.
- source_word: παρακαλῶν
  choice: увещевая
  rationale: Слово сочетает призыв, ободрение и наставление; «увещевая» сохраняет серьёзный побудительный характер контекста.
- source_word: ἐπιμαρτυρῶν
  choice: свидетельствуя
  rationale: Передаёт усиленное, торжественное подтверждение истинности сказанного, а не только нейтральное утверждение.
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: что это истинная благодать Божья
  rationale: Сохраняется указательное «это» без искусственного сужения его референции, а ἀληθῆ передаётся как «истинная».
- source_word: εἰς ἣν στῆτε
  choice: Стойте в ней твёрдо
  rationale: Императив στῆτε выражает призыв к стойкости; местоимение женского рода ясно отсылает к благодати. «Твёрдо» естественно выражает подразумеваемую устойчивость.
theological_decisions:
- issue: К чему относится «это» во фразе «это истинная благодать Божья»
  choice: 'Оставить объём указания открытым: оно естественно охватывает содержание написанного и засвидетельствованного Петром.'
  alternative: Сузить указание до нынешнего переживания благодати читателями или только до вести, переданной Силуаном.
  rationale: Контекст связывает «это» с письмом, увещеванием и свидетельством, однако грамматика не требует более узкого догматического уточнения.
- issue: Наклонение στῆτε в заключительной фразе
  choice: 'Повелительное: «Стойте в ней твёрдо».'
  alternative: 'Изъявительное чтение варианта: «в ней вы стоите».'
  rationale: Основной текст SBLGNT имеет повелительную форму στῆτε; вариант рукописей сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярного заключения. Синтаксис сделан естественным для широкого читателя; богословская неоднозначность указательного «это» и неопределённость роли Силуана не устранены.
