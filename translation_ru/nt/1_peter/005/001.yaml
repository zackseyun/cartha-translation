  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: ru
  text: 'Итак, старейшин среди вас я призываю — как ваш собрат-старейшина, свидетель страданий Мессии[a] и участник славы, которой предстоит открыться:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа». Греческий титул Χριστός можно передать как «Мессия» или, по традиции, как «Христос».'
    reason: alternative_reading
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: старейшин
  rationale: В данном контексте слово обозначает руководителей общины, а не просто пожилых мужчин. «Старейшины» передаёт функцию, не привнося более поздней конфессиональной терминологии.
- source_word: οὖν
  choice: Итак
  rationale: Передаёт вывод или переход, связывающий призыв с предшествующим рассуждением.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: Естественно передаёт нахождение этих старейшин внутри общины адресатов.
- source_word: παρακαλῶ
  choice: я призываю
  rationale: Выражает настойчивое пастырское обращение; современнее и естественнее, чем «увещеваю», при сохранении серьёзного тона.
- source_word: συμπρεσβύτερος
  choice: такой же старейшина
  rationale: Передаёт, что автор разделяет со старейшинами их положение и обращается к ним как равный по служению.
- source_word: μάρτυς
  choice: свидетель
  rationale: Сохраняет возможный смысл как очевидца, так и того, кто свидетельствует, не сводя слово к позднейшему значению «мученик».
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: страданий Мессии
  rationale: Генитив естественно понимается как указание на страдания, перенесённые Мессией; краткая русская конструкция сохраняет этот смысл.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Здесь Χριστός сохраняет значение титула Помазанника; вариант «Христа» дан в примечании как традиционная передача.
- source_word: κοινωνός
  choice: соучастник
  rationale: Передаёт реальное участие в будущей славе, а не только наблюдение за ней.
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: славы, которой предстоит открыться
  rationale: Сохраняет пассивное значение «быть открытой» и оттенок ожидаемого будущего события в μέλλω с инфинитивом, не устанавливая точных сроков.
theological_decisions:
- issue: Передача Χριστοῦ как христологического титула
  choice: Мессии
  alternative: Христа
  rationale: «Мессия» раскрывает титульный смысл Χριστός, тогда как традиционная форма «Христос» остаётся допустимой и отмечена в сноске.
- issue: Сила выражения μελλούσης ἀποκαλύπτεσθαι
  choice: которой предстоит открыться
  alternative: которая будет открыта
  rationale: Выбранный вариант сохраняет ожидание грядущего откровения и не устраняет присущую выражению эсхатологическую напряжённость.
- issue: Характер свидетельства автора о страданиях
  choice: свидетель
  alternative: тот, кто свидетельствует
  rationale: Формулировка намеренно не решает однозначно, говорится ли прежде всего о личном очевидце или о носителе свидетельства.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. «Старейшины» избегает как бытового значения «пожилые мужчины», так и привнесения поздней конфессиональной структуры; поясняющий контекст указывает на руководителей общины. Тире оформляет приложение и делает длинную фразу ясной без изменения её синтаксической связи.
