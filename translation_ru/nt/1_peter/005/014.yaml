  text: ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: ru
  text: Приветствуйте друг друга поцелуем любви. Мир всем вам — тем, кто в Мессии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, в более традиционном переводе: «во Христе».'
    reason: Альтернативная традиционная передача греческого титула Χριστός.
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Аорист, медиальный императив второго лица множественного числа выражает призыв к взаимному приветствию; «приветствуйте» естественно для современного русского языка и соответствует заключительной эпистолярной формуле.
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Взаимное местоимение передаёт обоюдное действие внутри общины.
- source_word: ἐν φιλήματι ἀγάπης
  choice: поцелуем любви
  rationale: Предлог ἐν здесь обозначает способ приветствия и естественно передаётся творительным падежом. Формулировка сохраняет как существительное φίλημα («поцелуй»), так и определяющий родительный ἀγάπης («любви»), не сводя выражение лишь к «сердечному поцелую».
- source_word: εἰρήνη
  choice: Мир
  rationale: Краткая именная формула благословения сохранена без добавления глагола «да будет».
- source_word: ὑμῖν πᾶσιν
  choice: всем вам
  rationale: Дательный падеж обозначает адресатов благословения, а πᾶσιν подчёркивает, что оно относится ко всем.
- source_word: τοῖς ἐν Χριστῷ
  choice: тем, кто в Мессии
  rationale: Артикль с предложным оборотом употреблён субстантивированно; пояснительная конструкция «тем, кто» ясно передаёт это по-русски. Χριστός передан как титул «Мессия», то есть «Помазанник».
theological_decisions:
- issue: Передача Χριστῷ в выражении ἐν Χριστῷ
  choice: в Мессии
  alternative: во Христе
  rationale: Χριστός исторически и семантически является титулом «Мессия / Помазанник». Основной текст сохраняет значение титула, а глубоко укоренившийся традиционный русский вариант «во Христе» приведён в сноске. Оборот «в Мессии» оставлен без разъясняющего перефразирования, чтобы сохранить богословскую ёмкость греческого выражения.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным эпистолярным звучанием. Тире проясняет, что «тем, кто в Мессии» относится к «всем вам», не добавляя нового смыслового содержания.
