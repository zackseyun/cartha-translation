base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: ru
  text: Сохраняйте ясность ума[a], будьте бдительны. Ваш противник, дьявол, ходит вокруг, как рычащий лев[b], ища, кого поглотить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будьте трезвы». Буквально глагол связан с трезвостью, но здесь означает ясность мысли и самообладание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рыщет, как рычащий лев». Греческий глагол буквально означает «ходит» или «расхаживает», тогда как «рыщет» сильнее подчёркивает образ хищника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε
  choice: Сохраняйте ясность ума
  rationale: Глагол νήφω буквально связан с трезвостью, но в новозаветном употреблении здесь выражает ясность мысли и самообладание. Такой перевод передаёт переносный смысл и не сливает его с последующим призывом к бдительности.
- source_word: γρηγορήσατε
  choice: будьте бдительны
  rationale: Императив обозначает бодрствующую настороженность; выражение естественно для современного литературного русского языка и отличается по смысловому оттенку от νήψατε.
- source_word: ἀντίδικος
  choice: противник
  rationale: Слово может иметь судебный оттенок, но здесь шире обозначает враждебную сторону. «Противник» сохраняет этот смысл без неоправданного сужения.
- source_word: διάβολος
  choice: дьявол
  rationale: В данном контексте слово служит общепринятым обозначением личного противника верующих, а не просто нарицательным «клеветник».
- source_word: ὡς λέων ὠρυόμενος
  choice: как рыкающий лев
  rationale: Передаёт явное сравнение и яркий образ угрожающего хищника.
- source_word: περιπατεῖ
  choice: ходит вокруг
  rationale: Сохраняет основное значение глагола «ходить, расхаживать»; хищный характер движения уже сообщается образом льва. Более контекстуальное «рыщет» отмечено в сноске.
- source_word: ζητῶν τινα καταπιεῖν
  choice: ища, кого поглотить
  rationale: Естественная русская конструкция точно передаёт поиск неопределённой жертвы и инфинитив цели; «поглотить» сохраняет буквальную силу καταπίνω и уместно в образе льва.
theological_decisions:
- issue: Передавать ли διάβολος как нарицательное «клеветник» или как обозначение личного духовного противника
  choice: дьявол
  alternative: клеветник
  rationale: Контекст представляет конкретного противника верующих; «дьявол» соответствует обычному новозаветному употреблению, не добавляя к тексту конфессиональных уточнений.
- issue: Насколько усиливать хищный оттенок περιπατεῖ
  choice: ходит вокруг
  alternative: рыщет
  rationale: Основной текст сохраняет обычное значение греческого глагола, позволяя сравнению со львом нести угрозу; более образный контекстуальный вариант приведён в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным библейским звучанием. Два кратких императива сохранены как разные, но взаимодополняющие призывы. Синтаксис второй фразы близок к греческому и при этом естественен по-русски.
