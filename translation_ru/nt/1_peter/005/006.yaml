id: 1PE.5.6
reference: 1 Peter 5:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ταπεινώθητε οὖν ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ, ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: ru
  text: Итак, смиритесь[a] под могучей рукой Бога, чтобы Он возвысил вас в должное время.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будьте смирены… чтобы Он возвысил вас в должное время». Греческое повеление имеет форму страдательного залога, хотя здесь его часто понимают в возвратном смысле: «смиритесь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: смиритесь
  rationale: Аористный пассивный императив здесь естественно понимается в возвратно-медиальном смысле как призыв добровольно занять смиренное положение. Русское «смиритесь» сохраняет повелительную силу и связь с последующим подчинением Божьей власти.
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод из предыдущего утверждения о том, что Бог противится гордым, а смиренным даёт благодать.
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα
  choice: под могучей рукой
  rationale: Сохраняет библейский образ сильного и властного действия Бога; «могучей» звучит естественно и достойно в современном русском языке.
- source_word: τοῦ θεοῦ
  choice: Бога
  rationale: Родительный падеж прямо указывает, кому принадлежит рука.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно передаёт целевое, с возможным оттенком результата, значение греческого союза.
- source_word: ὑμᾶς ὑψώσῃ
  choice: Он возвысил вас
  rationale: Подразумеваемый субъект — Бог. «Возвысил» передаёт дарование чести или оправдание смиренных, не сводя образ к физическому поднятию.
- source_word: ἐν καιρῷ
  choice: в должное время
  rationale: Передаёт καιρός как подходящее, определённое Богом время, а не просто хронологический момент.
theological_decisions:
- issue: Залог и действующее лицо в Ταπεινώθητε
  choice: «смиритесь» — возвратное понимание повеления, при этом слова «под могучей рукой Бога» показывают подчинение Божьей власти
  alternative: «будьте смирены» / «позвольте смирить себя»
  rationale: Так сохраняются и человеческая ответственность откликнуться на призыв, и Божья власть, под которой совершается это смирение. Формально пассивная форма отмечена в сноске, чтобы не устранять залоговую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением узнаваемого библейского образа «руки Бога». Формулировка краткая, ясная и торжественная без архаизмов; местоимение «Он» употреблено для ясности подразумеваемого субъекта.
