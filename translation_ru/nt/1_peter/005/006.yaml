  source_fidelity: «Итак, смиритесь под могучей рукой Бога» точно передаёт выводное οὖν, формально пассивное, но контекстуально возвратно понимаемое Ταπεινώθητε и библейский образ ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ. «Чтобы Он возвысил вас в должное время» адекватно выражает цель ἵνα и значение ἐν καιρῷ как надлежащего/назначенного времени.
  naturalness: Текст звучит естественно на современном литературном русском, сохраняя сжатый торжественный регистр. Сочетание «под могучей рукой Бога» понятно и уместно для библейского образа; «в должное время» ясно передаёт не просто хронологический момент.
  terminology: «Смиритесь», «могучей рукой Бога» и «возвысил» последовательно сохраняют ключевые образы и не вносят конфессионального истолкования. Сноска корректно отмечает формально страдательный залог и не устраняет залоговую неоднозначность из текста.
