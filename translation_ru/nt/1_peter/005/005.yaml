revisions:
- from: Так же и вы, молодые мужчины[a], подчиняйтесь пресвитерам. Все же облекитесь смирением в отношениях друг с другом[b], потому что «Бог гордым противится, а смиренным даёт благодать»[c].
  to: Так и вы, младшие[a], подчиняйтесь пресвитерам. И все вы облекитесь смирением[b] в отношениях друг с другом, потому что «Бог гордым противится, а смиренным даёт благодать»[c].
  rationale: Исправлен ложный уступительный оттенок «все же» и сделан явным переход от обращения к младшим к призыву, обращённому ко всем. «Младшие» точнее передаёт сравнительную семантику νεώτεροι и естественнее для русского прямого обращения; сноска сохраняет информацию о мужском грамматическом роде и варианте «молодые мужчины». Перемещена сноска об образе облачения к соответствующему словосочетанию.
  reviewer_model: gpt-5.6-terra
