id: 1PE.5.5
reference: 1 Peter 5:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: ru
  text: Так и вы, младшие[a], подчиняйтесь пресвитерам. И все вы облекитесь смирением[b] в отношениях друг с другом, потому что «Бог гордым противится, а смиренным даёт благодать»[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молодые мужчины». Греческое слово стоит во множественном числе мужского рода и означает тех, кто моложе; оно может пониматься шире — как обращение к младшим членам общины.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «подвяжитесь смирением». Глагол создаёт образ одежды, которую надевают или закрепляют на себе.'
    reason: lexical_alternative
  - marker: c
    text: Цитата или отсылка к Притчам 3:34 по Септуагинте.
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: так же и
  rationale: Связывает наставление с обращением к пресвитерам в предыдущих стихах; по-русски естественно передаёт преемственность увещеваний.
- source_word: νεώτεροι
  choice: молодые мужчины
  rationale: Форма мужского рода во множественном числе противопоставлена пресвитерам; перевод сохраняет грамматически выраженный гендер, а возможное более широкое понимание отмечено в сноске.
- source_word: ὑποτάγητε
  choice: подчиняйтесь
  rationale: Естественный современный эквивалент повелительной формы со значением добровольного признания установленного руководства.
- source_word: πρεσβυτέροις
  choice: пресвитерам
  rationale: Ближайший контекст 5:1–4 указывает на служителей общины, а не просто на старших по возрасту.
- source_word: πάντες δὲ
  choice: все же
  rationale: Расширяет обращение на всю общину и сохраняет переход, выраженный δέ.
- source_word: ἀλλήλοις
  choice: в отношениях друг с другом
  rationale: Передаёт взаимную направленность смирения и создаёт естественное русское сочетание.
- source_word: ταπεινοφροσύνην
  choice: смирением
  rationale: Ясный и устойчивый современный эквивалент, сохраняющий нравственно-религиозный смысл слова.
- source_word: ἐγκομβώσασθε
  choice: облекитесь
  rationale: Сохраняет образ намеренно надеваемой или закрепляемой одежды, не делая русский текст чрезмерно буквальным.
- source_word: ἀντιτάσσεται
  choice: противится
  rationale: Сильное и привычное в данном библейском изречении обозначение того, что Бог ставит Себя против гордых.
- source_word: χάριν
  choice: благодать
  rationale: В данном богословском контексте χάρις обозначает благосклонный дар Бога; «благодать» точно и узнаваемо передаёт этот смысл.
theological_decisions:
- issue: Кого обозначает πρεσβυτέροις
  choice: пресвитеров как руководителей общины
  alternative: старших по возрасту мужчин
  rationale: В непосредственном контексте 5:1–4 Пётр обращается к пресвитерам и описывает их пастырское служение, поэтому здесь вероятнее та же группа.
- issue: Объём обращения νεώτεροι
  choice: молодые мужчины
  alternative: младшие по возрасту члены общины вообще
  rationale: Греческая форма имеет мужской род, что отражено в основном тексте; возможное родовое или более широкое употребление не исключено и вынесено в сноску.
- issue: Образ ἐγκομβώσασθε
  choice: облекитесь смирением
  alternative: подвяжитесь смирением / наденьте смирение как рабочую одежду
  rationale: Перевод сохраняет метафору одежды, не уточняя спорный конкретный предмет одежды и не вводя не выраженную прямо аллюзию.
translation_notes:
  register: Современный литературный русский с достоинством библейского увещевания. «Пресвитеры» выбрано ради связи с непосредственным церковным контекстом; «облекитесь» сохраняет яркую метафору, оставаясь понятным обычному читателю. Пунктуация и кавычки показывают переход к цитате из Писания.
