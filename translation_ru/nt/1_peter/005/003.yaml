  text: μηδ’ ὡς κατακυριεύοντες τῶν κλήρων ἀλλὰ τύποι γινόμενοι τοῦ ποιμνίου·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/003.yaml
  text: not domineering over those allotted to your care[a], but becoming examples to the flock.
translation:
  language: ru
  text: не господствуя над теми, кто поручен вашему попечению[a], но становясь образцами для стада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не господствуя над доставшимися вам уделами». Буквально: «над уделами (жребиями)»; вероятно, имеются в виду части Божьего стада, порученные попечению каждого старейшины.'
    reason: Лексическая альтернатива и пояснение буквального образа τῶν κλήρων.
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: не
  rationale: Продолжает отрицательное наставление предыдущего стиха и естественно вводит запрещённый образ действий.
- source_word: κατακυριεύοντες
  choice: господствуя над
  rationale: Передаёт не всякое руководство, а властное, подавляющее обращение; в современном русском выражение ясно и сохраняет связь с понятием господства.
- source_word: τῶν κλήρων
  choice: вверенными вам
  rationale: Буквально — «жребиями, уделами». В контексте пастырского попечения речь, вероятно, идёт о частях Божьего стада, порученных отдельным старейшинам. Основной текст естественно передаёт смысл попечения, а буквальный образ сохранён в сноске.
- source_word: ἀλλὰ
  choice: но
  rationale: Выражает прямое противопоставление запрещённого поведения требуемому.
- source_word: τύποι
  choice: примером
  rationale: Обозначает образец для подражания. Единственное число по-русски естественно при собирательном обращении к старейшинам.
- source_word: γινόμενοι
  choice: становясь
  rationale: 'Сохраняет динамический смысл причастия: старейшины должны воплощать такой образ поведения на деле.'
- source_word: τοῦ ποιμνίου
  choice: для стада
  rationale: Сохраняет обычную пастырскую метафору общины верующих и естественно сочетается со словом «пример».
theological_decisions:
- issue: Значение τῶν κλήρων применительно к церковному руководству
  choice: люди, вверенные попечению старейшин
  alternative: буквально «уделы» или «жребии»; отдельные области ответственности старейшин
  rationale: Контекст говорит о том, что старейшины пасут Божье стадо. Перевод подчёркивает порученное попечение, а не собственность старейшин, при этом буквальная образность отмечена в сноске.
- issue: Сила κατακυριεύοντες
  choice: запрет властного, подавляющего господства
  alternative: запрет всякого осуществления руководящей власти
  rationale: Глагол обозначает злоупотребление властью. Противопоставление господства личному примеру не отменяет руководство как таковое.
translation_notes:
  register: Современный литературный русский язык, краткий и dignified библейский регистр. «Господствуя» сохраняет силу греческого глагола без вывода, будто запрещено всякое руководство; сноска сохраняет неоднозначность образного τῶν κλήρων.
