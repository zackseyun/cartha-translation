translation:
  language: ru
  text: возложив[b] на Него[c] все свои тревоги[a], потому что Он заботится о вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заботы», «беспокойства»; здесь μέριμνα означает заботу, вызывающую тревогу или беспокойство.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «бросив на Него»; эта форма связана с призывом в предыдущем стихе.'
    reason: lexical_alternative
