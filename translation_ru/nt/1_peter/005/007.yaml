    text: То есть на Бога, о котором говорится непосредственно перед этим (ст. 6).
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσαν τὴν μέριμναν ὑμῶν
  choice: все свои тревоги
  rationale: Единственное число с πᾶσαν имеет собирательный смысл. Русское множественное число естественно передаёт полноту выражения, а «тревоги» обозначает именно беспокоящие заботы, не нейтральную попечительность.
- source_word: ἐπιρίψαντες
  choice: возложив
  rationale: Аористное причастие зависит от призыва в предыдущем стихе. Русское деепричастие сохраняет эту синтаксическую связь, а «возложив» естественно передаёт образ перенесения бремени на другого.
- source_word: ἐπ’ αὐτόν
  choice: на Него
  rationale: Предлог ἐπί с винительным после ἐπιρίπτω указывает на перенесение чего-либо на кого-либо; «на Него» сохраняет этот образ и местоименную форму греческого текста.
- source_word: ὅτι
  choice: потому что
  rationale: Союз вводит основание для предшествующего призыва; русский эквивалент ясно выражает причинную связь.
- source_word: αὐτῷ μέλει περὶ ὑμῶν
  choice: Он заботится о вас
  rationale: Идиоматическое выражение передаёт личную деятельную заинтересованность. Формулировка естественна по-русски и не сводит смысл лишь к чувствам или мыслям о читателях.
theological_decisions:
- issue: К кому относятся αὐτόν и αὐτῷ
  choice: «Него» и «Он» относятся к Богу
  alternative: Более общее указание на Господа, чья личность определяется контекстом
  rationale: Непосредственный контекст, «под могучей рукой Бога» в стихе 6, делает Бога естественным референтом. Местоимения сохраняют форму оригинала, а пояснение выносится в сноску, чтобы не добавлять имя прямо в текст.
translation_notes:
  register: Современный литературный русский язык с достоинством и пастырской теплотой. Деепричастная конструкция намеренно сохраняет зависимость стиха 7 от увещания в стихе 6; заглавные буквы в местоимениях следуют принятому русскому библейскому регистру.
