base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: ru
  text: И когда явится[a] Верховный Пастырь, вы получите неувядающий венец[b] славы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет явлен».'
    reason: alternative_reading
  - marker: b
    text: Греческое слово может обозначать почётный или победный венок, вручавшийся как награда, а не обязательно царскую корону.
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: когда явится
  rationale: Аористное страдательное причастие в родительном самостоятельном обороте имеет временное значение. Русское «когда явится» естественно передаёт явление прежде сокрытого; более буквальное «когда будет явлен» возможно, но звучит тяжеловесно.
- source_word: ἀρχιποίμενος
  choice: Главный Пастырь
  rationale: Сложное существительное обозначает главного, высшего пастыря. Заглавные буквы уместны, поскольку в контексте это титул Христа.
- source_word: κομιεῖσθε
  choice: вы получите
  rationale: Будущее время среднего залога здесь означает получение награды. «Получите» ясно и естественно передаёт смысл.
- source_word: ἀμαράντινον
  choice: неувядающий
  rationale: Прилагательное означает то, что не увядает и не теряет свежести; «неувядающий» сохраняет образ венка и не усиливает значение до общего «нетленный».
- source_word: τῆς δόξης
  choice: славы
  rationale: Родительный падеж сохранён без поясняющей переработки, чтобы не устранять компактность и возможную смысловую многогранность выражения.
- source_word: στέφανον
  choice: венец
  rationale: στέφανος — почётный или победный венок, а не собственно царская корона. «Венец» естественен в возвышенном русском библейском регистре, а конкретный образ поясняется в сноске.
theological_decisions:
- issue: Личность «Главного Пастыря»
  choice: Христологический титул, относящийся к Иисусу
  alternative: Нарицательное обозначение главного пастуха
  rationale: Контекст пастырского наставления и будущего явления указывает на Иисуса; титульное написание обозначает это без добавления имени в основной текст.
- issue: Язык эсхатологического явления
  choice: явится
  alternative: будет явлен
  rationale: «Явится» естественно по-русски передаёт проявление прежде невидимого и сохраняет эсхатологическую открытость формулировки, хотя не воспроизводит грамматически страдательную форму столь явно, как альтернатива.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Порядок слов сделан естественным для русского; метафора венца славы и лаконичность исходного текста сохранены.
