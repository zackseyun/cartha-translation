lexical_decisions:
- source_word: αὐτῷ
  choice: Ему
  rationale: Дательный падеж местоимения отсылает к Богу в предшествующем контексте; форма «Ему» сохраняет греческое доксологическое построение.
- source_word: κράτος
  choice: владычество
  rationale: В доксологии слово обозначает не просто физическую силу, а могущественную верховную власть. «Владычество» передаёт оба оттенка и сохраняет возвышенный, но понятный регистр.
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: во веки веков
  rationale: Устойчивое русское доксологическое выражение естественно передаёт усиленное указание на бесконечную продолжительность и близко к образу исходного текста.
- source_word: ἀμήν
  choice: Аминь
  rationale: Традиционная транслитерация сохраняет литургическую силу заключительного подтверждения.
theological_decisions:
- issue: Подразумеваемое сказуемое в безглагольной доксологии
  choice: Ему принадлежит владычество
  alternative: Ему владычество
  rationale: В греческом тексте глагол отсутствует. Добавление нейтрального «принадлежит» делает фразу естественной для современного русского языка, не меняя смысла и не превращая славословие в пожелание.
- issue: Смысл κράτος
  choice: владычество
  alternative: могущество; власть
  rationale: Выбор сохраняет сочетание силы и верховной власти, не сводя слово ни к отвлечённой мощи, ни только к административной власти.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным доксологическим звучанием. Не добавлено отсутствующее в греческом тексте слово «слава». Формула «во веки веков» традиционна, понятна и сохраняет образ исходного выражения.
