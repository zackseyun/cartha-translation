  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: ru
  text: А Бог всякой благодати, призвавший вас к Своей вечной славе в Мессии[a], после того как вы недолго пострадаете, Сам восстановит[b] вас, утвердит, укрепит и поставит на прочное основание[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во Христе». Греческий титул Χριστός означает «Мессия»; его традиционная русская форма — «Христос».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «приведёт в совершенство», «сделает совершенными». Глагол может обозначать восстановление или приведение в надлежащее, завершённое состояние.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «утвердит на твёрдом основании» или «положит основание». В греческом тексте использован образ прочного фундамента; глагол относится к адресатам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: всякой благодати
  rationale: Естественная русская генитивная конструкция, сохраняющая всеохватный смысл выражения без уточнения отдельных видов благодати.
- source_word: καλέσας
  choice: призвавший
  rationale: Причастие прошедшего времени естественно передаёт греческий аорист и связывает определение непосредственно со словом «Бог».
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: к Своей вечной славе
  rationale: Предлог «к» естественно выражает направленность εἰς в русском языке; возвратное притяжательное местоимение однозначно относит славу к Богу.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Χριστός здесь является титулом; «Мессия» передаёт его смысл, а «в» сохраняет характерную и богословски ёмкую конструкцию ἐν Χριστῷ.
- source_word: ὀλίγον παθόντας
  choice: после того как вы недолго пострадаете
  rationale: ὀλίγον понято как обозначение краткой продолжительности страданий; оборот ясно передаёт предшествование страдания последующим действиям Бога.
- source_word: αὐτὸς
  choice: Сам
  rationale: Сохраняет эмфатическое указание на то, что Бог лично совершит названные действия.
- source_word: καταρτίσει
  choice: восстановит
  rationale: Передаёт приведение в надлежащее состояние после страдания, не сужая значение до нравственного совершенства.
- source_word: στηρίξει
  choice: утвердит
  rationale: Передаёт придание стойкости и устойчивости и естественно звучит в данном ряду глаголов.
- source_word: σθενώσει
  choice: укрепит
  rationale: Прямой и современный эквивалент со значением наделения силой.
- source_word: θεμελιώσει
  choice: заложит для вас прочное основание
  rationale: Развёрнутая передача сохраняет образ фундамента и отличает этот глагол от соседнего «утвердит».
theological_decisions:
- issue: Передача Χριστῷ
  choice: в Мессии
  alternative: во Христе
  rationale: Смысл титула передан переводом «Мессия»; традиционный вариант отмечен в сноске, поскольку оба обозначают греческое Χριστός.
- issue: 'Направленность призвания: εἰς τὴν αἰώνιον αὐτοῦ δόξαν'
  choice: к Своей вечной славе
  alternative: в Свою вечную славу
  rationale: «К» естественнее по-русски обозначает цель призвания, тогда как «в» сильнее подчёркивает вхождение и участие; греческое εἰς допускает эту смысловую напряжённость.
- issue: Отношение страдания к действиям Бога
  choice: после того как вы недолго пострадаете
  alternative: пострадав немного
  rationale: Выбранный вариант ясно передаёт временную последовательность, не объясняя богословскую причину страданий и не устраняя их реальность.
translation_notes:
  register: Современный литературный русский язык с достоинством новозаветного послания. Синтаксис сохраняет единое длинное предложение оригинала, но остаётся понятным. Заглавные буквы в «Своей» и «Сам» подчёркивают отнесённость к Богу согласно распространённой русской библейской практике; местоимение «вас» добавлено при последнем ряде глаголов один раз ради естественности.
