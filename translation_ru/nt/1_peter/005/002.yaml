source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: ru
  text: Пасите Божье стадо, которое среди вас, надзирая за ним не по принуждению, а добровольно, как угодно Богу[a]; не ради постыдной наживы, а с готовностью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по Богу»; возможно также: «в согласии с Божьей волей».'
    reason: alternative_reading
lexical_decisions:
- source_word: ποιμάνατε
  choice: пасите
  rationale: Повелительная форма сохраняет образ пастуха и стада, не превращая глагол в название церковной должности.
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: Божье стадо, которое среди вас
  rationale: «Стадо» сохраняет пастырскую метафору; «Божье» подчёркивает принадлежность Богу, а «среди вас» не представляет стадо собственностью старейшин.
- source_word: ἐπισκοποῦντες
  choice: надзирая за ним
  rationale: Причастный оборот описывает осуществление попечения и надзора, не вводя позднейшее техническое название церковной должности.
- source_word: μὴ ἀναγκαστῶς
  choice: не по принуждению
  rationale: Передаёт служение не под давлением или по необходимости и естественно противопоставляется добровольности.
- source_word: ἀλλὰ ἑκουσίως
  choice: а добровольно
  rationale: Кратко и ясно выражает свободную готовность действовать, противопоставленную принуждению.
- source_word: κατὰ θεόν
  choice: как угодно Богу
  rationale: Естественная по-русски передача сжатого греческого выражения; примечание сохраняет его буквальную форму и возможную смысловую широту.
- source_word: μηδὲ αἰσχροκερδῶς
  choice: не ради постыдной наживы
  rationale: Сохраняет нравственную оценку корыстного стремления к материальной выгоде.
- source_word: ἀλλὰ προθύμως
  choice: а с усердием
  rationale: Передаёт готовность и рвение, при этом не повторяет уже использованное «добровольно».
theological_decisions:
- issue: Следует ли передавать ἐπισκοποῦντες как техническое название церковной должности
  choice: 'Деятельность передана описательно: «надзирая за ним».'
  alternative: «служа надзирателями»; «исполняя епископское служение»
  rationale: В контексте причастие описывает действие старейшин, а не обязательно обозначает позднее установившуюся должность; описательный перевод не навязывает определённое церковное устройство.
- issue: Насколько явно истолковывать κατὰ θεόν
  choice: 'В основном тексте: «как угодно Богу», с буквальным вариантом в примечании.'
  alternative: «по Богу»; «в согласии с Божьей волей»
  rationale: Греческое выражение сжато и может указывать на Божью волю, Божий образец или соответствие Богу. Основной перевод должен быть понятен, а примечание сохраняет неоднозначность исходной формулировки.
translation_notes:
  register: Современный литературный русский язык с сохранением пастырской метафоры. Синтаксис остаётся торжественным, но понятным; избегаются как канцелярское «осуществляя надзор», так и конфессионально нагруженные названия должностей.
