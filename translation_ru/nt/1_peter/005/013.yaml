id: 1PE.5.13
reference: 1 Peter 5:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: ru
  text: Вас приветствует та, что в Вавилоне[a][b], избранная вместе с вами, а также Марк, сын мой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с более явным истолкованием: «Церковь в Вавилоне, избранная вместе с вами». В греческом тексте употреблено выражение женского рода единственного числа, а определяемое существительное подразумевается.'
    reason: alternative_reading
  - marker: b
    text: В раннехристианской речи «Вавилон» мог быть символическим обозначением Рима; однако в самом тексте сказано «Вавилон».
    reason: cultural_note
  - marker: c
    text: Слова «сын мой», вероятно, выражают духовное, а не биологическое родство.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: приветствует
  rationale: Обычное эпистолярное значение глагола — «приветствовать, передавать привет». Краткое «приветствует» естественно по-русски и не добавляет отсутствующих в тексте оттенков.
- source_word: ἡ ... συνεκλεκτὴ
  choice: та, что ... избранная вместе с вами
  rationale: Артикль и прилагательное стоят в женском роде единственного числа, но определяемое существительное не названо. Формулировка сохраняет женский род и не подставляет в основной текст слово «церковь».
- source_word: ἐν Βαβυλῶνι
  choice: в Вавилоне
  rationale: В греческом тексте прямо назван Вавилон. Возможное символическое указание на Рим отмечено в сноске, а не внесено в перевод.
- source_word: συνεκλεκτὴ
  choice: избранная вместе с вами
  rationale: Передаёт значение совместной избранности ясным современным русским языком; буквальное сложное соответствие звучало бы неестественно.
- source_word: Μᾶρκος
  choice: Марк
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: ὁ υἱός μου
  choice: сын мой
  rationale: Сохраняет буквальный образ родства. Вероятный смысл духовного сыновства не вносится непосредственно в основной текст.
theological_decisions:
- issue: Кого обозначает ἡ ... συνεκλεκτὴ
  choice: 'В основном тексте оставлена неназванная референтка женского рода: «та, что… избранная вместе с вами».'
  alternative: «Церковь в Вавилоне, избранная вместе с вами»; также возможно указание на жену Петра или другую христианку.
  rationale: В греческом тексте существительное отсутствует. Хотя часто подразумевают церковь, подстановка этого слова устранила бы подлинную неоднозначность.
- issue: Значение названия «Вавилон»
  choice: В основном тексте сохранено «Вавилон».
  alternative: Символическое обозначение Рима либо буквальный Вавилон в Месопотамии.
  rationale: Текст называет Вавилон непосредственно, а его историческая референция остаётся предметом обсуждения.
- issue: Смысл слов «сын мой» применительно к Марку
  choice: Сохранено буквальное обозначение родства.
  alternative: «Мой духовный сын».
  rationale: Духовное родство весьма вероятно, однако сам греческий текст не уточняет это прямо.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным эпистолярным звучанием. Порядок слов делает фразу естественной, а оборот «та, что» сохраняет эллипсис и женский род оригинала. Союз «а также» ясно присоединяет приветствие Марка.
