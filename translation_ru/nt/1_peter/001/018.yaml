  source_fidelity: 'Смысл исходного греческого текста в целом передан верно: εἰδότες отражено деепричастием «зная», ἐλυτρώθητε — «были искуплены», а образ освобождения от унаследованного суетного образа жизни сохранён. Однако конструкция «не чем-то тленным — серебром или золотом» менее точно и менее естественно передаёт прямое приложение в греческом; «тленным серебром или золотом» яснее показывает, что оба названных предмета характеризуются как тленные.'
