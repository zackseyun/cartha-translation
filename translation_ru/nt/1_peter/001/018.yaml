  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: ru
  text: зная, что вы были искуплены[a] от вашего суетного образа жизни, унаследованного от отцов[b], не тленным серебром или золотом,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выкуплены». Греческий глагол подразумевает освобождение посредством выкупа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от предков». Буквально: «переданного от отцов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: зная
  rationale: Деепричастная форма сохраняет обстоятельственную связь причастия с окружающим наставлением и не превращает её однозначно в причинное придаточное.
- source_word: ἐλυτρώθητε
  choice: вы были искуплены
  rationale: Глагол обозначает освобождение посредством выкупа. «Искуплены» сохраняет образ выкупа и естественно сочетается с последующим противопоставлением серебру и золоту.
- source_word: φθαρτοῖς
  choice: чем-то тленным
  rationale: Субстантивированное прилагательное обозначает то, что подвержено тлению и утрате; форма единственного обобщающего значения естественна по-русски.
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: серебром или золотом
  rationale: Творительный падеж передаёт средство, а тире показывает, что серебро и золото поясняют выражение «чем-то тленным».
- source_word: ἐκ
  choice: от
  rationale: Предлог передаёт удаление и освобождение от прежнего образа жизни.
- source_word: ματαίας
  choice: суетного
  rationale: «Суетный» передаёт пустоту, бесплодность и тщетность, сохраняя привычное для библейского русского языка смысловое поле без архаической тяжеловесности.
- source_word: ἀναστροφῆς
  choice: образа жизни
  rationale: Выражение охватывает не только отдельные поступки, но и весь сложившийся уклад поведения.
- source_word: πατροπαραδότου
  choice: переданного вам от отцов
  rationale: Сохраняется буквальный образ передачи от отцов и одновременно ясно выражается унаследованный характер прежнего образа жизни.
theological_decisions:
- issue: Терминология выкупа и искупления
  choice: искуплены
  alternative: выкуплены
  rationale: «Искуплены» сохраняет библейско-богословскую весомость слова, но само по себе не уточняет механизм искупления; образ платы раскрывается упоминанием серебра и золота и продолжением фразы в следующем стихе.
- issue: Обозначение унаследованной традиции
  choice: от отцов
  alternative: от предков
  rationale: Греческое слово прямо содержит указание на отцов. Основной текст сохраняет эту форму, а более широкое значение родовых предшественников отмечено в сноске.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной библейской лексикой. Порядок слов слегка перестроен ради ясности: сначала названо освобождение от прежнего образа жизни, затем — средство, которым оно не было совершено. Конечная запятая сохраняет синтаксическую незавершённость фразы, продолжающейся в 1 Пет. 1:19.'
