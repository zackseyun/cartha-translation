  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: ru
  text: Очистив свои души послушанием истине для искренней братской любви[a], горячо любите друг друга, от сердца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «любви к братьям и сёстрам по вере». Греческое слово обозначает семейную привязанность между верующими и относится как к мужчинам, так и к женщинам.'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях: «от чистого сердца».'
    reason: textual_variant
lexical_decisions:
- source_word: ἡγνικότες
  choice: очистив
  rationale: Перфектное действительное причастие обозначает совершившееся очищение с сохраняющимся результатом; деепричастие передаёт его предшествование главному повелению, не уточняя сверх текста причинную связь.
- source_word: ψυχὰς ὑμῶν
  choice: свои души
  rationale: «Души» — прямое и уместное соответствие ψυχαί; здесь слово охватывает самих людей в их внутренней жизни, а возвратное «свои» естественно по-русски соотносится с подразумеваемым субъектом.
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: послушанием истине
  rationale: 'Творительный падеж естественно передаёт возможное инструментальное значение ἐν с дательным: очищение совершается посредством послушания. Определённость ἀληθείας в контексте подразумевает истину благой вести, не требуя тяжеловесного «этой истине».'
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: для искренней братской любви
  rationale: «Для» сохраняет целевое значение εἰς, «искренней» идиоматично передаёт отсутствие лицемерия, а «братской любви» сохраняет семейную семантику φιλαδελφία и её отличие от следующего ἀγαπάω.
- source_word: ἐκ καρδίας
  choice: от всего сердца
  rationale: Устойчивое современное русское выражение естественно передаёт искренность и внутреннюю полноту действия; слово «чистого», отсутствующее в основном тексте SBLGNT, не добавляется.
- source_word: ἀλλήλους ἀγαπήσατε ἐκτενῶς
  choice: горячо любите друг друга
  rationale: Простой императив «любите» естественно передаёт аористное повеление, «друг друга» — взаимность, а «горячо» выражает напряжённость и силу ἐκτενῶς без архаического оттенка.
theological_decisions:
- issue: Различие между φιλαδελφία и ἀγαπάω в одном стихе
  choice: «братская любовь» и «любите»
  alternative: Передать оба греческих выражения одним словом «любовь» без различения.
  rationale: Разные, хотя и близкие слова оригинала сохраняются без навязывания им жёсткого богословского противопоставления.
- issue: Гендерный охват φιλαδελφία
  choice: Сохранить «братская любовь» в тексте и пояснить в сноске, что речь идёт обо всех верующих.
  alternative: «любовь к братьям и сёстрам» или «любовь к единоверцам» в основном тексте.
  rationale: Так сохраняются семейный образ и лексическое отличие от ἀγαπάω, а фактическая включённость женщин разъясняется читателю.
- issue: Разночтение при ἐκ καρδίας
  choice: Следовать SBLGNT и переводить без прилагательного «чистого».
  alternative: «от чистого сердца».
  rationale: Основной текст содержит ἐκ καρδίας; чтение с καθαρᾶς следует отметить как текстовый вариант, но не вводить в перевод.
translation_notes:
  register: Современный литературный русский язык с достойным увещательным тоном. Синтаксис сохраняет движение греческой фразы от совершившегося очищения к повелению любить; лексика понятна широкому читателю и не содержит конфессионально маркированных добавлений.
