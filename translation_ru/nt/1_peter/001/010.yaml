    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: Об этом спасении
  rationale: περί с родительным падежом обозначает тему, а относительное ἧς отсылает к уже упомянутому спасению. «Об этом спасении» естественно передаёт эту связь в русском языке.
- source_word: σωτηρίας
  choice: спасении
  rationale: В данном контексте σωτηρία означает спасение в полном богословском смысле; вариант «избавление» был бы уже по значению.
- source_word: ἐξεζήτησαν
  choice: усердно старались разузнать
  rationale: Глагол передаёт настойчивый, старательный поиск. Такая формулировка естественна по-русски и отличает первый глагол от последующего тщательного исследования.
- source_word: ἐξηραύνησαν
  choice: тщательно его исследовали
  rationale: Глагол обозначает основательное исследование. Наречие «тщательно» сохраняет усиление, создаваемое сочетанием двух близких глаголов.
- source_word: προφῆται
  choice: пророки
  rationale: Существительное уточняется следующим определительным причастным оборотом; в русском языке нулевой артикль не требует отдельного показателя определённости.
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: пророчествовавшие о благодати для вас
  rationale: Причастный оборот определяет пророков; περί передаёт содержание пророчества, а εἰς ὑμᾶς сохраняет направленно-бенефактивный смысл без добавления прямо не выраженного будущего значения.
- source_word: χάριτος
  choice: благодати
  rationale: «Благодать» сохраняет устойчивый и богословски значимый смысл χάρις в контексте Божьего спасительного дара.
- source_word: εἰς ὑμᾶς
  choice: для вас
  rationale: «Для вас» естественно выражает направленность благодати к адресатам и её благотворный для них характер.
theological_decisions:
- issue: Следует ли явно выражать будущее значение в словах о благодати
  choice: В основном тексте оставить «о благодати для вас»
  alternative: «о благодати, которой предстояло прийти к вам»
  rationale: Будущая направленность следует из контекста пророчества, однако в греческом тексте этого стиха нет отдельной глагольной или причастной формы со значением будущего. Основной текст не делает подразумеваемое явным, а возможное толкование сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка избегает архаизмов и сохраняет два последовательных глагола поиска и исследования, а также открытую временную отнесённость выражения о благодати.
