  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: ru
  text: Об этом спасении усердно стремились узнать и тщательно его исследовали пророки, пророчествовавшие о благодати для вас[a].
  philosophy: optimal-equivalence
  footnotes:
