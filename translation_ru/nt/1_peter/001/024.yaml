  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: ru
  text: потому что всякая плоть — как трава[a], и вся слава её[b] — как цветок травы; засохла трава, и цветок опал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё человечество». Греческий текст буквально говорит «всякая плоть», перекликаясь с Ис 40:6 и подчёркивая смертность людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всё её великолепие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: потому что
  rationale: 'Передаёт причинное значение союза: цитата из Писания обосновывает предыдущее утверждение.'
- source_word: πᾶσα σὰρξ
  choice: всякая плоть
  rationale: Сохраняет образный язык и отсылку к Ис 40:6; здесь речь идёт о смертности и бренности всего человечества, а не о нравственной испорченности.
- source_word: ὡς χόρτος
  choice: как трава
  rationale: Естественно передаёт сравнение и образ недолговечности.
- source_word: πᾶσα δόξα αὐτῆς
  choice: вся слава её
  rationale: Сохраняет широкий смысл δόξα — человеческая слава, величие или великолепие — и местоименную связь с собирательным выражением «всякая плоть».
- source_word: ὡς ἄνθος χόρτου
  choice: как цветок травы
  rationale: Близко передаёт греческий образ и не заменяет χόρτος более привычным, но менее точным словом «поле».
- source_word: ἐξηράνθη
  choice: засохла
  rationale: Точно и естественно описывает высыхание травы; прошедшее время сохраняет форму цитаты.
- source_word: ἐξέπεσεν
  choice: опал
  rationale: В отношении цветка русское «опал» естественно выражает его падение или осыпание со стебля.
theological_decisions:
- issue: Значение σάρξ в высказывании о человеческой смертности
  choice: всякая плоть
  alternative: всё человечество
  rationale: Контекст говорит не о греховной природе, а о бренности смертных людей. Буквальный образ также сохраняет связь с Ис 40:6.
- issue: Объём значения δόξα
  choice: слава
  alternative: великолепие
  rationale: '«Слава» сохраняет намеренно широкое значение слова: всё, чем человек может блистать, гордиться или пользоваться почётом, столь же преходяще.'
translation_notes:
  register: Современный литературный русский с сохранением достоинства и поэтического параллелизма ветхозаветной цитаты. Точка с запятой удерживает стих как единое развёрнутое высказывание.
