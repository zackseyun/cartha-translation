  source_fidelity: 'Смысловые элементы греческого текста в целом переданы точно: славословие обращено к Богу и Отцу Господа Иисуса; Божья великая милость, новое рождение, живая надежда и воскресение Иисуса из мёртвых сохранены. Однако ἀναγεννήσας — причастие, определяющее Бога («[Бог], возродивший нас»), а разделение на два самостоятельных предложения с «он возродил» несколько ослабляет эту синтаксическую связь. Безопасно сохранить её в русском тексте.'
