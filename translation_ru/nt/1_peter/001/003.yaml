id: 1PE.1.3
reference: 1 Peter 1:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: ru
  text: Благословен Бог и Отец нашего Господа Иисуса Мессии[a], по Своей великой милости возродивший нас[b] к живой надежде через воскресение Иисуса Мессии из мёртвых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа». Греческое Χριστός — титул со значением «Помазанник», то есть «Мессия».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «дал нам родиться заново». Греческий глагол сохраняет образ повторного, нового рождения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: Благословен
  rationale: Предикативное прилагательное вводит славословие. Краткая форма «Благословен» естественна для возвышенной русской речи и сохраняет богослужебную силу выражения.
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: Бог и Отец
  rationale: Сохранены оба связанных существительных и их единая отнесённость к Господу Иисусу.
- source_word: τοῦ κυρίου ἡμῶν
  choice: нашего Господа
  rationale: κύριος передано титулом «Господь», а русский порядок слов выбран ради естественности.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός здесь сохраняется как значимый титул — «Мессия», а не как непрозрачная часть имени.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: по своей великой милости
  rationale: «По» передаёт сообразность или меру, выраженную κατά; «великая милость» естественно передаёт πολὺ ἔλεος.
- source_word: ἀναγεννήσας
  choice: возродил нас
  rationale: Глагол обозначает новое рождение и прямо представляет Бога действующим лицом. «Возродил» кратко и естественно сохраняет как божественную инициативу, так и образ рождения, разъяснённый в примечании.
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: к живой надежде
  rationale: Предлог «к» передаёт направленность или результат εἰς, не устраняя возможной смысловой широты оборота.
- source_word: δι’ ἀναστάσεως
  choice: через воскресение
  rationale: διά с родительным падежом обозначает средство; «через» прямо и естественно выражает эту связь.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Это устойчивое русское соответствие новозаветному выражению о воскресении, сохраняющее значение ἐκ.
theological_decisions:
- issue: Передача христологического титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: «Мессия» раскрывает титульный смысл Χριστός и не превращает его без пояснения в элемент личного имени; привычный вариант отмечен в сноске.
- issue: Действующее лицо нового рождения в ἀναγεννήσας
  choice: он возродил нас
  alternative: он дал нам новое рождение
  rationale: Перевод прямо сохраняет Бога как совершающего действие, не развивая это утверждение в более широкую конфессиональную систему.
- issue: Связь нового рождения с живой надеждой
  choice: к живой надежде
  alternative: для живой надежды
  rationale: «К» сохраняет направленность εἰς и не сужает оборот исключительно до значения цели.
translation_notes:
  register: Современный литературный русский язык с достоинством славословия. Длинная греческая конструкция разделена восклицательным знаком на славословие и поясняющее предложение ради ясности; местоимения, относящиеся к Богу, набраны со строчной буквы по нейтральной современной норме.
