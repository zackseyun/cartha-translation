id: 1PE.1.7
reference: 1 Peter 1:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: ru
  text: чтобы испытанная подлинность вашей веры — более драгоценная, чем гибнущее золото, хотя и испытываемое огнём, — при явлении Иисуса Мессии[a][b][c] оказалась достойной похвалы, славы и чести.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испытание вашей веры»; греческое слово может указывать как на процесс испытания, так и на подтверждённую им подлинность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Иисуса Христа». Здесь слово «Мессия» передаёт значение титула Χριστός.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «послужила к похвале, славе и чести».'
    reason: translation_alternative
lexical_decisions:
- source_word: δοκίμιον
  choice: испытанная подлинность
  rationale: Передаёт прежде всего выявленную испытанием подлинность веры, сохраняя при этом связь с процессом испытания.
- source_word: πίστεως
  choice: веры
  rationale: В контексте речь идёт о вере адресатов, проходящей испытания.
- source_word: πολυτιμότερον
  choice: более драгоценная
  rationale: Естественно выражает сравнительную ценность и поддерживает образ золота.
- source_word: χρυσίου
  choice: золото
  rationale: Прямое соответствие в конструкции сравнения.
- source_word: ἀπολλυμένου
  choice: гибнущее
  rationale: Сохраняет глагольный оттенок и подчёркивает преходящую природу золота.
- source_word: διὰ πυρὸς ... δοκιμαζομένου
  choice: испытываемое огнём
  rationale: Передаёт испытание золота посредством огня и сохраняет лексическую связь с испытанной подлинностью веры.
- source_word: εὑρεθῇ εἰς
  choice: оказалась к
  rationale: Сохраняет пассивно-результативную конструкцию и её некоторую смысловую открытость без тяжеловесного буквального оборота.
- source_word: ἔπαινον καὶ δόξαν καὶ τιμήν
  choice: похвале, славе и чести
  rationale: Передаёт все три существительных, не уточняя не названного в греческом тексте получателя или источника.
- source_word: ἐν ἀποκαλύψει
  choice: при явлении
  rationale: Передаёт временной смысл события, когда Иисус Мессия будет явлен.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός передано по значению как титул «Мессия», естественно оформленный по-русски.
theological_decisions:
- issue: Значение τὸ δοκίμιον ὑμῶν τῆς πίστεως
  choice: «испытанная подлинность вашей веры» — подлинность, выявленная испытаниями
  alternative: «испытание вашей веры» — акцент на самом процессе испытания
  rationale: В данном сравнении с испытываемым огнём золотом δοκίμιον вероятнее обозначает подтверждённое испытанием качество, но альтернативный процессуальный оттенок отмечен в сноске.
- issue: К кому относятся похвала, слава и честь
  choice: Не уточнять получателя или источник
  alternative: Честь, даруемая верующим; хвала Богу или Христу; совмещённый смысл эсхатологического оправдания
  rationale: Греческий текст не выражает это явно, поэтому перевод сохраняет богословскую неоднозначность.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: Передача титула по его значению делает его смысл доступным современному читателю; традиционная форма дана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Причастные обороты сохранены ради образной и синтаксической связи с греческим текстом; «оказалась к» намеренно оставляет открытым точное отношение веры к похвале, славе и чести.
