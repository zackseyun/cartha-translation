  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: ru
  text: В этом вы ликуете, хотя теперь, если это необходимо, ненадолго опечалены различными испытаниями[a],
  philosophy: optimal-equivalence
