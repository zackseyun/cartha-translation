lexical_decisions:
- source_word: ἐν ᾧ
  choice: Об этом
  rationale: Относительное выражение, вероятно, отсылает ко всему сказанному ранее о спасении и наследии. «Об этом» естественно по-русски и не усиливает причинное значение, как «поэтому».
- source_word: ἀγαλλιᾶσθε
  choice: вы ликуете
  rationale: Глагол обозначает сильную, торжествующую радость; «ликуете» передаёт интенсивность и сохраняет достоинство стиля.
- source_word: ὀλίγον ἄρτι
  choice: теперь ненадолго
  rationale: 'Переданы оба временных оттенка: нынешнее время и краткость периода.'
- source_word: εἰ δέον
  choice: если так должно быть
  rationale: Формулировка сохраняет условный оттенок εἰ и идею необходимости в δέον, не объясняя источник или цель этой необходимости.
- source_word: λυπηθέντες
  choice: опечалены
  rationale: Краткая страдательная форма передаёт пережитую скорбь и пассивный смысл причастия; связь с «хотя» ясно выражает уступку.
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: различными испытаниями
  rationale: В контексте страданий и проверки веры речь прежде всего о разнообразных тяжёлых обстоятельствах. Творительный падеж естественно передаёт обстоятельство или причину печали.
theological_decisions:
- issue: Значение πειρασμοῖς в контексте страданий
  choice: испытаниями
  alternative: искушениями; проверками
  rationale: Ближайший контекст говорит о скорби и проверке подлинности веры, поэтому «испытаниями» охватывает внешние трудности, не сужая смысл до склонения ко греху. Возможная многозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет напряжение между нынешней скорбью и сильной радостью. «Если так должно быть» намеренно не уточняет, кем или чем обусловлена необходимость.
