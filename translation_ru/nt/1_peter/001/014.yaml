  source_fidelity: 'В основной фразе верно переданы призыв, «дети послушания», отрицательное сообразование с желаниями и связь с прежним неведением. Однако «которым вы следовали» добавляет не выраженное в греческом тексте действие следования желаниям и несколько изменяет синтаксическую связь: ἐν τῇ ἀγνοίᾳ ὑμῶν характеризует прежние желания как относящиеся ко времени неведения, а не прямо утверждает, что адресаты им следовали.'
  naturalness: «Дети послушания» намеренно необычно, но допустимо при поясняющем примечании. Уточнение «которые прежде были у вас во времена вашего неведения» устраняет неестественную и смыслово расширенную конструкцию «желаниями, которым вы следовали в своём неведении», сохраняя современный литературный строй.
  terminology: «Послушание», «желания» и «неведение» хорошо соответствуют ὑπακοή, ἐπιθυμίαι и ἀγνοία. Буквальная родительная конструкция сохранена, а естественный вариант дан в примечании без конфессионального истолкования.
