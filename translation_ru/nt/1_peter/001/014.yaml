  text: ὡς τέκνα ὑπακοῆς, μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience[a], not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: ru
  text: Как дети послушания[a], не сообразуйтесь с теми желаниями, которые прежде были у вас во времена вашего неведения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как послушные дети». Буквально по-гречески: «как дети послушания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: как
  rationale: Передаёт значение образа и качества, в котором читатели должны поступать.
- source_word: τέκνα ὑπακοῆς
  choice: дети послушания
  rationale: 'Сохраняет необычную родительную конструкцию оригинала и её смысл: послушание характеризует саму принадлежность и образ жизни адресатов. Более гладкий вариант дан в примечании.'
- source_word: μὴ συσχηματιζόμενοι
  choice: не сообразуйтесь
  rationale: Передаёт призыв не принимать образ и не строить поведение по заданному образцу; возвратная форма сохраняет нравственную ответственность адресатов.
- source_word: ταῖς πρότερον ... ἐπιθυμίαις
  choice: с прежними желаниями
  rationale: «Желания» современно и достаточно широко передаёт ἐπιθυμίαι; контекст указывает на их нравственно порочный характер без сужения значения только до сексуальной похоти.
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: в своём неведении
  rationale: Сохраняет образ прежнего состояния недостаточного знания; «неведение» уместно в современном литературном и библейском регистре.
theological_decisions:
- issue: Следует ли сгладить выражение τέκνα ὑπακοῆς до обычного прилагательного
  choice: дети послушания
  alternative: послушные дети
  rationale: Основной текст сохраняет формулу идентичности, в которой послушание не просто отдельное качество, а определяющая черта адресатов; примечание предлагает естественный русский эквивалент без догматического расширения.
- issue: Как передать связь прежних желаний с неведением
  choice: желаниями, которым вы следовали в своём неведении
  alternative: желаниями времён вашего неведения
  rationale: Формулировка естественно связывает прежний образ поведения с состоянием неведения. Добавленное «следовали» эксплицирует подразумеваемое подчинение желаниям, не уточняя сверх текста природу этого неведения.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Необычное «дети послушания» намеренно сохранено как значимая формула оригинала и разъяснено примечанием; остальная фраза сделана доступной для обычного читателя.
