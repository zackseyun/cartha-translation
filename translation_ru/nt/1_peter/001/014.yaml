    rationale: Греческий текст не содержит глагола «следовать» или прямого утверждения подчинения желаниям. Хотя такая мысль может быть контекстуально вероятна, её не следует вносить в перевод.
  - severity: low
    issue: Связь «прежде» и «в вашем неведении» нуждается в более точном выражении.
    rationale: Оба определения относятся к желаниям; формулировка «которые прежде были у вас во времена вашего неведения» передаёт эту связь без добавочного действия.
