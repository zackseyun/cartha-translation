reference: 1 Peter 1:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: ru
  text: исследуя, на кого или на какое время указывал пребывавший в них Дух Мессии, заранее свидетельствовавший о страданиях, связанных с Мессией[a], и о славах, которые должны были последовать за ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о страданиях Мессии».'
    reason: Сохраняется возможное и традиционное понимание спорной конструкции τὰ εἰς Χριστὸν παθήματα как указания непосредственно на страдания, пережитые Мессией.
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: стараясь выяснить
  rationale: Причастие продолжает описание деятельности пророков из предыдущего стиха; выражение передаёт настойчивое исследование и естественно вводит последующий косвенный вопрос.
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: на кого или на какое именно время
  rationale: 'Сохранены обе части трудной конструкции: возможная личная отнесённость τίνα и временно-качественный оттенок ποῖον καιρόν. Слово «именно» передаёт поиск конкретного времени, не сводя вопрос лишь к дате.'
- source_word: ἐδήλου
  choice: указывал
  rationale: Несовершенный вид русского глагола соответствует продолженному действию имперфекта и не делает откровение одномоментным.
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: пребывавший в них Дух Мессии
  rationale: Сохранены нахождение Духа в пророках и его прямая связь с Мессией; Χριστός передан как титул «Мессия».
- source_word: προμαρτυρόμενον
  choice: заранее свидетельствуя
  rationale: Переданы как значение свидетельства, так и временной элемент приставки προ-.
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: страдания, предстоявшие Мессии
  rationale: Формулировка естественна по-русски и передаёт страдания, направленно относящиеся к Мессии в пророческой перспективе, не превращая εἰς в простой родительный падеж. Более прямое традиционное понимание вынесено в сноску.
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: последующие за ними проявления славы
  rationale: «Проявления славы» позволяет естественно сохранить греческое множественное число δόξας, а «последующие за ними» передаёт μετὰ ταῦτα и связывает славу со страданиями.
theological_decisions:
- issue: Связь «Духа Мессии» с пророками
  choice: Сохранить прямое выражение «пребывавший в них Дух Мессии».
  alternative: «Дух, говоривший в них о Мессии» или «Дух, данный Мессией».
  rationale: Греческий текст прямо называет действовавшего в пророках Духа «Духом Мессии». Перевод не устраняет эту богословски значимую формулировку толкующим пересказом.
- issue: Значение εἰς в выражении τὰ εἰς Χριστὸν παθήματα
  choice: «страдания, предстоявшие Мессии» в основном тексте.
  alternative: «страдания Мессии».
  rationale: Конструкция с εἰς допускает смысл страданий, относящихся или направленных к Мессии, тогда как контекст предварительного свидетельства поддерживает перспективу предстоящего. Поскольку традиционное притяжательное понимание также сильно и возможно, оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сохраняет связь с предыдущим стихом посредством деепричастного оборота. Необычная двойная постановка вопроса и богословская напряжённость выражения «Дух Мессии» намеренно не сглажены.
