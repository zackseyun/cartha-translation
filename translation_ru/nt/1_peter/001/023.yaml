  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: ru
  text: Вы были возрождены не от тленного семени, а от нетленного — через живое и пребывающее слово Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через слово живого и пребывающего Бога». Греческие причастия «живого» и «пребывающего» могут относиться как к «слову», так и к «Богу», хотя контекст скорее указывает на «слово».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: возрождённые
  rationale: Перфектное страдательное причастие обозначает совершившееся действие с сохраняющимся результатом. «Возрождённые» естественно передаёт повторное рождение и пассивный смысл, сохраняя причастную форму.
- source_word: σπορᾶς
  choice: семени
  rationale: В сочетании с противопоставлением тленного и нетленного это наиболее естественная передача, поддерживающая образ рождения.
- source_word: φθαρτῆς
  choice: тленного
  rationale: «Тленный» точно передаёт подверженность порче и гибели и образует ясную, традиционно понятную пару с «нетленным».
- source_word: ἀφθάρτου
  choice: нетленного
  rationale: Сохраняет прямое лексическое противопоставление слову φθαρτῆς и естественно звучит в данном контексте.
- source_word: διὰ
  choice: через
  rationale: С родительным падежом διά обозначает средство или посредство; «через» передаёт это кратко и естественно.
- source_word: λόγου
  choice: слово
  rationale: «Слово» прямо передаёт λόγος и соответствует дальнейшему контексту отрывка; «весть» было бы допустимо, но более истолковательно.
- source_word: ζῶντος
  choice: живое
  rationale: Причастие употреблено определительно; «живое» — его прямая и естественная передача при слове «слово».
- source_word: θεοῦ
  choice: Бога
  rationale: 'Родительный падеж естественно выражает принадлежность или источник: «слово Бога». Такая конструкция также помогает не скрывать возможное иное присоединение определений.'
- source_word: μένοντος
  choice: пребывающее
  rationale: Передаёт длительный смысл настоящего причастия и согласуется с ближайшим контекстом о слове, которое остаётся вовек.
theological_decisions:
- issue: 'К чему относятся ζῶντος и μένοντος: к «слову» или к «Богу»'
  choice: 'Оба причастия отнесены к «слову»: «живое и пребывающее слово Бога»'
  alternative: «через слово живого и пребывающего Бога»
  rationale: Формы ζῶντος и μένοντος могут грамматически согласовываться как с λόγου, так и с θεοῦ, поскольку все они стоят в родительном падеже мужского рода единственного числа. Ближайший контекст, особенно стих 25, поддерживает отнесение определений к «слову», однако подлинная синтаксическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. «Возрождённые», «тленный / нетленный» и «пребывающее» сохраняют богословскую точность и достоинство без архаической синтаксической тяжеловесности. Тире делает противопоставление ясным.
