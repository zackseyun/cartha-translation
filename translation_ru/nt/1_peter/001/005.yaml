source:
  edition: SBLGNT
  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: ru
  text: которых сила Божья через веру[a] оберегает для спасения, готового открыться в последнее время[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через доверие»; менее вероятно: «через верность».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «при последнем времени».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς
  choice: которых
  rationale: Определённый артикль с причастием продолжает описание адресатов из предыдущего стиха. Относительное местоимение естественно передаёт эту синтаксическую связь.
- source_word: ἐν δυνάμει θεοῦ
  choice: сила Божья
  rationale: В сочетании с пассивным φρουρουμένους предлог ἐν указывает на средство, которым совершается охрана. Активная русская конструкция «сила Божья… хранит» ясно и естественно передаёт эту инструментальную роль, не представляя веру источником охраны.
- source_word: φρουρουμένους
  choice: хранит
  rationale: Настоящее пассивное причастие обозначает продолжающееся охранение адресатов. Русская активная конструкция с подлежащим «сила Божья» звучит естественнее буквального «охраняемых силой Божьей» и сохраняет защитный оттенок φρουρέω.
- source_word: διὰ πίστεως
  choice: через веру
  rationale: διά с родительным падежом обозначает посредствующее средство. «Вера» является обычным и наиболее уместным здесь соответствием πίστις; возможные значения «доверие» и, с меньшей вероятностью, «верность» сохранены в примечании.
- source_word: εἰς σωτηρίαν
  choice: для спасения
  rationale: εἰς выражает цель или направленность. «Для спасения» сохраняет устремлённость к будущему спасению, которое далее названо готовым открыться.
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: готового открыться
  rationale: Сочетание прилагательного ἑτοίμην с пассивным инфинитивом естественно передаётся как «готового открыться»; согласование со «спасением» сохраняет структуру греческой фразы.
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: в последние времена
  rationale: καιρός обозначает особое, определённое время. Русское единственное число «в последнее время» обычно означает «недавно» и может ввести читателя в заблуждение, поэтому идиоматическое эсхатологическое выражение «в последние времена» выбрано в основном тексте; более буквальная форма отмечена в сноске.
theological_decisions:
- issue: Соотношение Божьего сохранения и человеческой веры в διὰ πίστεως
  choice: Божья сила хранит адресатов, а вера названа средством, через которое совершается это хранение.
  alternative: Понимать веру как необязательную характеристику либо переводить πίστις прежде всего как «верность».
  rationale: Синтаксис связывает охранение с Божьей силой и одновременно вводит веру посредством διά. Перевод сохраняет оба элемента, не разрешая сверх сказанного споры о стойкости, отпадении или природе веры.
- issue: Временная направленность спасения
  choice: Спасение представлено как готовое открыться в будущем, в последние времена.
  alternative: Ограничить спасение только настоящим обращением или, напротив, выводить из стиха отрицание всякого настоящего аспекта спасения.
  rationale: Фраза «готового открыться» ясно ориентирована на будущее явление спасения, но сам стих не определяет всего новозаветного учения о временных аспектах спасения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Активная конструкция «сила Божья… хранит» выбрана ради естественности и ясности; она сохраняет продолжающееся Божье охранение, выраженное греческим настоящим пассивным причастием. Форма «в последние времена» предотвращает обычное современное понимание выражения «в последнее время» как «недавно».
