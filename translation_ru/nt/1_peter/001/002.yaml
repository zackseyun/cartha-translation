reference: 1 Peter 1:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: ru
  text: по предведению Бога Отца[b], в освящении Духом, для послушания и окропления кровью Иисуса Мессии[a][c]. Благодать вам и мир да умножатся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса Христа». Греческий титул Χριστός в некоторых контекстах употребляется почти как часть имени; здесь он переведён словом «Мессия», чтобы сохранить его титульный смысл.'
    reason: alternative_reading
  - marker: b
    text: Словом «предведение» переведено греческое πρόγνωσις. Толкователи расходятся во мнениях, подчёркивает ли оно Божье предварительное знание, Его предварительный выбор или и то и другое.
    reason: lexical_alternative
  - marker: c
    text: Выражение «окропление кровью», вероятно, отсылает к ветхозаветным образам завета и очищения, особенно к Исходу 24:8.
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: по предведению
  rationale: Предлог κατά с винительным выражает соответствие или норму; «предведение» сохраняет смысл предварительного знания и не решает спор о том, включает ли слово также предызбрание.
- source_word: θεοῦ πατρός
  choice: Бога Отца
  rationale: Естественно передаёт сочетание родительных падежей и приложение «Отец».
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: в освящении Духа
  rationale: Формально сохраняет ἐν и родительный πνεύματος, не сводя выражение только к инструментальному значению «Духом»; в трёхчастной структуре стиха «Дух» понимается как Святой Дух.
- source_word: εἰς ὑπακοὴν
  choice: для послушания
  rationale: Передаёт целевую или результативную силу εἰς, сохраняя лаконичность и неоднозначность связи.
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: и окропления кровью
  rationale: Естественное русское выражение, сохраняющее образ окропления и его ветхозаветные заветные и очистительные ассоциации.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός передано как титул «Мессия», а не как ставшая именеподобной форма «Христос».
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: Благодать вам и мир да умножатся
  rationale: Сохраняет форму пожелания, выраженную оптативом, и естественный для русского библейского текста торжественный регистр.
theological_decisions:
- issue: Значение πρόγνωσις в связи с избранием
  choice: «предведение» без разъясняющей догматической перефразировки
  alternative: «предопределение», «предызбирающая любовь», «предварительное знание»
  rationale: Греческое слово допускает разное понимание соотношения Божьего знания и решения; перевод сохраняет эту богословскую напряжённость.
- issue: Референт πνεύματος
  choice: «Духа» с прописной буквы, то есть Святого Духа
  alternative: «духа» как человеческого духа или безличного начала
  rationale: Трёхчастная последовательность «Бог Отец — Дух — Иисус Мессия» убедительно указывает на Святого Духа.
- issue: Сила титула Χριστοῦ
  choice: «Мессии»
  alternative: «Христа»
  rationale: Здесь титульный смысл остаётся богословски значимым; «Мессия» делает его явным, не добавляя отдельного толкования.
- issue: Связь послушания и окропления
  choice: сохранена единая конструкция «для послушания и окропления»
  alternative: уточнить, кому именно принадлежит послушание или как логически соотносятся оба элемента
  rationale: Сам греческий текст не раскрывает эти отношения, поэтому перевод не должен устранять его синтаксическую и богословскую ёмкость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Термины «предведение», «освящение» и «окропление» сохранены ради точности и богословской насыщенности; синтаксис близок к греческому, но остаётся понятным современному читателю.
