base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: ru
  text: Бог предузнал Его ещё до основания мира[a], но в конце времён Он был явлен ради вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он был заранее избран». Буквально греческий текст говорит: «Он был предузнан»; это может подразумевать Божий замысел, но не требует такого более узкого толкования в основном тексте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в последние времена».'
    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: Бог знал Его заранее
  rationale: Передаёт значение пассивного причастия «предузнанный» естественным современным русским оборотом. Бог назван как подразумеваемый деятель; формулировка сохраняет смысл предведения, не подменяя его предопределением или избранием.
- source_word: πρὸ καταβολῆς κόσμου
  choice: ещё до основания мира
  rationale: Сохраняет устойчивый библейский образ начала мира; «ещё» естественно подчёркивает предшествование, не меняя смысла.
- source_word: φανερωθέντος
  choice: был явлен
  rationale: Пассивная форма передаёт то, что Христос был сделан явным, открыт людям. «Явлен» точнее сохраняет оттенок проявления, чем простое «явился».
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: в конце времён
  rationale: Близко передаёт эсхатологический временной оборот и не добавляет отсутствующего в греческом указательного слова «эти».
- source_word: δι’ ὑμᾶς
  choice: ради вас
  rationale: Ясно выражает направленность действия на благо адресатов.
theological_decisions:
- issue: Значение προεγνωσμένου применительно ко Христу до сотворения мира
  choice: Передать как «Бог знал Его заранее», сохранив значение предведения.
  alternative: «Он был заранее избран» или «предназначен заранее».
  rationale: Греческий глагол допускает связь с Божьим замыслом, но сам по себе не требует заменять предведение избранием или предопределением. Основной текст сохраняет эту богословскую напряжённость, а возможное толкование отмечено в сноске.
- issue: Временное значение ἐπ’ ἐσχάτου τῶν χρόνων
  choice: «в конце времён»
  alternative: «в эти последние времена»
  rationale: Выбранный вариант сохраняет эсхатологический смысл и не вводит указательное «эти», которого нет в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Необычное для повседневной речи «был предузнан» вынесено в сноску, тогда как основной текст передаёт тот же смысл естественным активным оборотом. «Был явлен» сохранено ради точности пассивной формы и богословского оттенка откровения.
