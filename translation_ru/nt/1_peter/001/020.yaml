  source_fidelity: 'Греческое προεγνωσμένου — страдательное причастие, относящееся к Христу (антецедент из ст. 19): «предузнанный / заранее известный». В черновике «Бог знал Его заранее» смысл в целом передан, однако более точное «Бог предузнал Его» яснее отражает προγινώσκω и согласуется с пояснительной сноской, не навязывая значения избрания. Остальные элементы переданы верно: «до основания мира», «был явлен», «в конце времён», «ради вас».'
  naturalness: «Бог предузнал Его» — понятный современному литературному русскому вариант в умеренно возвышенном библейском регистре. Он естественнее, чем пассивное «Он был предузнан», и точнее, чем нейтральное «Бог знал Его заранее». «Был явлен» и «в конце времён» уместны и литературны.
  terminology: «Предузнал» сохраняет различие между предведением и интерпретирующими «избрал» или «предназначил». «Основание мира» — устоявшийся библейский термин. «Явлен» адекватно передаёт φανερωθέντος как раскрытие/проявление, а не просто появление.
