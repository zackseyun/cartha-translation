  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: ru
  text: Хотя вы Его не видели, вы любите Его. Хотя и теперь вы Его не видите, вы веруете в Него и ликуете неизреченной и прославленной радостью[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «радостью, исполненной славы»; или: «славной радостью».'
    reason: Греческое δεδοξασμένῃ — перфектное пассивное причастие; «прославленной» ближе передаёт его форму, тогда как варианты «исполненной славы» и «славной» возможны как более идиоматические передачи.
lexical_decisions:
- source_word: ὃν οὐκ ἰδόντες
  choice: Хотя вы Его не видели
  rationale: Уступительная связь естественно выражает смысл причастной конструкции; аорист передаёт отсутствие прежнего личного видения с актуальным результатом.
- source_word: ἀγαπᾶτε
  choice: вы любите Его
  rationale: Настоящее время указывает на продолжающуюся любовь; повторение местоимения естественно и проясняет объект.
- source_word: εἰς ὃν ... πιστεύοντες
  choice: веруя в Него
  rationale: Сочетание πιστεύω с εἰς обозначает направленную на Христа веру; «веруя» сохраняет причастную связь и библейское достоинство без архаической неясности.
- source_word: ἄρτι μὴ ὁρῶντες
  choice: и теперь не видите Его
  rationale: ἄρτι отмечает нынешнее отсутствие видения, противопоставленное вере; «и» подчёркивает, что это положение продолжается.
- source_word: ἀγαλλιᾶσθε
  choice: ликуете
  rationale: Глагол выражает сильную, торжествующую радость; «ликуете» точнее передаёт интенсивность, чем нейтральное «радуетесь».
- source_word: χαρᾷ ἀνεκλαλήτῳ
  choice: неизреченной ... радостью
  rationale: Дательный передаёт сопутствующее состояние или образ действия; «неизреченной» означает радость, которую невозможно вполне выразить словами.
- source_word: δεδοξασμένῃ
  choice: исполненной славы
  rationale: Перфектное пассивное причастие буквально связано с наделением славой. Оборот сохраняет эту связь и звучит по-русски естественнее, чем «прославленной радостью».
theological_decisions:
- issue: Объект веры в конструкции πιστεύοντες εἰς ὃν
  choice: веруя в Него
  alternative: доверяя Ему
  rationale: Основной текст сохраняет явную лексику веры и направленность εἰς на Христа, не сводя значение только к психологическому доверию.
- issue: Значение δεδοξασμένῃ применительно к радости
  choice: исполненной славы
  alternative: прославленной; славной
  rationale: Выбранный вариант сохраняет связь с δόξα и необычную богословскую насыщенность выражения, но не утверждает сверх текста, кем именно или каким образом эта радость прославлена.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. «Ликуете» передаёт усиленное значение ἀγαλλιᾶσθε; «неизреченной» сохраняет достоинство речи и остаётся понятным современному читателю. Местоимение о Христе дано с прописной буквы по принятой русской библейской традиции.
