  text: εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: ru
  text: к наследству нетленному, незапятнанному и неувядающему, сохранённому на небесах для вас,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομίαν
  choice: наследству
  rationale: Передаёт обычный смысл «наследство» и сохраняет связь с предлогом εἰς в продолжающейся конструкции предыдущего стиха.
- source_word: ἄφθαρτον
  choice: нетленному
  rationale: Точно выражает неподверженность порче и гибели, сохраняя возвышенный, но понятный библейский регистр.
- source_word: ἀμίαντον
  choice: незапятнанному
  rationale: Передаёт отсутствие осквернения или нечистоты без ненужного сужения смысла до обрядовой категории.
- source_word: ἀμάραντον
  choice: неувядающему
  rationale: Сохраняет образ того, что не вянет и не утрачивает своей славы или красоты.
- source_word: τετηρημένην
  choice: хранящемуся
  rationale: 'Передаёт результативное значение перфекта: наследство остаётся сохранным и предназначенным адресатам.'
- source_word: ἐν οὐρανοῖς
  choice: на небесах
  rationale: Естественный русский эквивалент греческого множественного числа в данном религиозном контексте.
- source_word: εἰς ὑμᾶς
  choice: для вас
  rationale: Естественно выражает направленность и предназначение наследства адресатам.
theological_decisions:
- issue: Характер сохранности наследства
  choice: хранящемуся на небесах для вас
  alternative: сохранённому на небесах для вас
  rationale: Настоящее причастное выражение естественно по-русски передаёт устойчивый результат греческого перфекта, не уточняя сверх текста, кем именно оно хранится.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Три однородных определения сохранены, а запятая в конце показывает синтаксическое продолжение фразы.
