base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: ru
  text: которые через Него веруют в Бога[a], воскресившего Его из мёртвых и давшего Ему славу, так что[b] ваша вера и надежда направлены к Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верны Богу»; однако здесь, вероятнее всего, имеются в виду те, кто через Христа верует в Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и потому»; греческое выражение указывает на следствие и может также иметь оттенок цели.'
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: через Него
  rationale: 'διά с родительным падежом выражает посредство: именно через Христа эти люди веруют в Бога.'
- source_word: πιστοὺς εἰς θεόν
  choice: веруют в Бога
  rationale: Хотя πιστός может означать «верный», сочетание с εἰς θεόν здесь естественнее всего указывает на веру, направленную к Богу. Глагольная передача звучит по-русски яснее, чем существительное «верующие» в данном синтаксическом окружении.
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: воскресившего Его из мёртвых
  rationale: Это естественная русская передача новозаветного выражения о воскресении; причастная конструкция сохраняет связь с определяемым словом «Бога».
- source_word: δόξαν αὐτῷ δόντα
  choice: давшего Ему славу
  rationale: Прямая передача параллельного аористного причастия сохраняет мысль о даровании Христу славы Богом.
- source_word: ὥστε
  choice: так что
  rationale: Оборот передаёт следствие Божьего действия, не исключая целевого оттенка исходной конструкции.
- source_word: τὴν πίστιν ὑμῶν καὶ ἐλπίδα
  choice: ваша вера и надежда
  rationale: Сохраняются обычные и контекстуально точные соответствия πίστις и ἐλπίς; притяжательное местоимение по-русски естественно относится к обоим существительным.
- source_word: εἶναι εἰς θεόν
  choice: — в Боге
  rationale: Именная конструкция с тире естественна в современном русском и передаёт направленность веры и надежды к Богу без тяжеловесного повторения глагола.
theological_decisions:
- issue: Значение πιστούς
  choice: «веруют» — речь о тех, кто через Христа верит в Бога
  alternative: «верны Богу»
  rationale: Сочетание πιστούς с εἰς θεόν сильнее поддерживает значение веры или доверия, однако лексическая возможность значения «верные» отмечена в сноске.
- issue: Посредническая роль Христа
  choice: «через Него»
  alternative: «благодаря Ему»
  rationale: Передача сохраняет выраженное διά + родительный падежом посредство, не разворачивая его в более подробную догматическую формулу.
- issue: Смысл конструкции с ὥστε
  choice: «так что»
  alternative: «и потому»; «с тем чтобы»
  rationale: «Так что» сохраняет прежде всего оттенок результата и при этом не устраняет возможный целевой оттенок.
- issue: Направленность веры и надежды
  choice: «в Боге»
  alternative: «обращены к Богу»
  rationale: Формулировка сохраняет повтор εἰς θεόν по смыслу и звучит идиоматично, не добавляя отдельного толкования характера этой направленности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Местоимения, относящиеся к Богу и Христу, написаны с прописной буквы по принятой русской библейской традиции. Перевод сохраняет причастную структуру оригинала и его неоднозначность в отношении оттенка результата или цели.
