source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: ru
  text: Им было открыто, что не самим себе, а вам они служили этим[a] — тем, что теперь возвещено вам через тех, кто благовествовал вам[b] Святым Духом, посланным с небес. Ангелы жаждут заглянуть во всё это[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «они служили не для себя, а для вас». Греческий дательный падеж указывает на тех, кому предназначалось служение пророков.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «кто возвещал вам благую весть» или «кто проповедовал вам Евангелие». В греческом тексте употреблён глагол со значением «сообщать благую весть».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «пристально вглядеться», «наклонившись, заглянуть». Греческий глагол рисует образ напряжённого, заинтересованного рассматривания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς ἀπεκαλύφθη
  choice: Им было открыто
  rationale: Местоимение относится к пророкам из предыдущего стиха; пассивная форма сохраняет откровенный характер сообщения, не называя прямо действующее лицо.
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά
  choice: во всём этом они служили не самим себе, а вам
  rationale: Формулировка сохраняет подразумеваемое подлежащее «они» (пророки), длительный характер их служения и резкое противопоставление получателей пользы; «во всём этом» естественно передаёт отсылку αὐτά к только что названным пророческим предметам.
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: Теперь это возвещено вам
  rationale: «Возвещено» соответствует торжественному, но не узкотехническому значению ἀναγγέλλω; «теперь» сохраняет контраст между временем пророков и нынешним провозглашением.
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: через тех, кто благовествовал вам
  rationale: «Благовествовал» передаёт глагольную форму εὐαγγελίζω и остаётся понятным в современном литературном русском; «через» сохраняет значение посредничества διά.
- source_word: πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: Святым Духом, посланным с небес
  rationale: Творительный падеж естественно допускает инструментальное понимание дательного; причастный оборот ясно относится к Святому Духу и сохраняет пассивную форму.
- source_word: εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι
  choice: Во всё это жаждут заглянуть ангелы
  rationale: «Во всё это» сохраняет направленность εἰς, «жаждут» — продолжающееся сильное желание, а «заглянуть» — зрительный и направленный внутрь образ παρακύπτω.
theological_decisions:
- issue: Кого обозначает πνεύματι ἁγίῳ
  choice: Святого Духа как божественного участника возвещения
  alternative: святой дух как безличную духовную силу или расположение
  rationale: Контекст ниспослания с небес и связь с провозглашением благой вести естественно указывают на Святого Духа; прописные буквы обозначают этот референт, не добавляя к тексту нового утверждения.
- issue: Соотношение служения пророков и нынешнего благовестия
  choice: пророки своим прежним служением приносили пользу адресатам, которым теперь возвещена благая весть
  alternative: пророки служили только своим современникам
  rationale: Противопоставление «не самим себе, а вам» и последующее «теперь» прямо связывают пророческое служение с нынешним возвещением, не отождествляя полностью два исторических момента.
- issue: Функция дательного πνεύματι ἁγίῳ
  choice: преимущественно средство или действующая сила возвещения
  alternative: 'сфера возвещения: «в Святом Духе»'
  rationale: Творительный «Святым Духом» наиболее естественно передаёт инструментальный смысл, но русская конструкция не требует развёрнутого толкования характера действия Духа.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи, без архаических местоимений и тяжёлых церковнославянизмов. «Благовествовал» сохранено как широко узнаваемое библейское слово; более разговорное пояснение дано в сноске. Короткое отдельное последнее предложение подчёркивает образ ангелов и устраняет синтаксическую перегрузку.
