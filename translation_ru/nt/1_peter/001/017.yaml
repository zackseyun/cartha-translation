  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: ru
  text: И если вы называете Отцом Того, Кто беспристрастно судит каждого по его делу, то живите в страхе[a] в течение времени вашего странствования[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с благоговением»; также возможно: «в благогейном трепете».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «временного пребывания на чужбине». Греческое слово обозначает жизнь пришельца или временного жителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: называете Отцом
  rationale: В сочетании с предикативным πατέρα глагол обозначает обращение к Богу как к Отцу; эта формулировка естественна по-русски и сохраняет синтаксическую связь.
- source_word: ἀπροσωπολήμπτως
  choice: нелицеприятно
  rationale: Наречие означает отсутствие пристрастия и предпочтения по внешнему положению; «нелицеприятно» точно и уместно в современном литературном библейском регистре.
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: каждого по его делу
  rationale: κατά обозначает меру или основание суда, а единственное ἔργον может иметь собирательный смысл; перевод сохраняет личную ответственность и число исходного выражения.
- source_word: ἐν φόβῳ
  choice: в страхе
  rationale: Сохраняет прямое значение φόβος и напряжение между Божьим отцовством и беспристрастным судом, не сводя смысл заранее лишь к почтению.
- source_word: παροικίας
  choice: странствования
  rationale: Передаёт временное проживание вдали от постоянного отечества и образ жизни пришельца, не уточняя его как политическое изгнание.
- source_word: ἀναστράφητε
  choice: проводите
  rationale: В сочетании с винительным времени выражает образ жизни в течение указанного периода; по-русски «проводите время» естественно передаёт этическую силу повеления.
theological_decisions:
- issue: Значение φόβος при обращении к Богу как Отцу и Судье
  choice: Сохранено «в страхе»
  alternative: «с благоговением» или «в благоговейном трепете»
  rationale: Прямой перевод сохраняет нравственную серьёзность и богословское напряжение текста, не смягчая его однозначно до почтительности.
- issue: Суд по делу каждого
  choice: 'Переведено прямо: «судит каждого по его делу»'
  alternative: Истолковать как определённую систему суда, заслуг или воздаяния
  rationale: Исходный текст утверждает беспристрастный суд по делу каждого, но не разъясняет здесь его догматический механизм; перевод не должен вносить конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Нелицеприятно» и «странствование» понятны в контексте и сохраняют смысловые связи послания; синтаксис упрощён настолько, чтобы стих звучал естественно, без устранения его богословского напряжения.
