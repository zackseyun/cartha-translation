  text: κομιζόμενοι τὸ τέλος τῆς πίστεως ⸀ὑμῶν σωτηρίαν ψυχῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/009.yaml
  text: as you receive the outcome of your faith[b][a], the salvation of your souls.
translation:
  language: ru
  text: получая итог вашей веры[a] — спасение ваших душ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конец», «цель» или «результат вашей веры».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «спасение ваших жизней» либо «спасение вас самих». Греческое слово может означать «души», «жизни» или «людей» в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: получая
  rationale: Причастие настоящего времени передаёт продолжающееся обретение того, к чему ведёт вера, и естественно связывается с контекстом предыдущего стиха.
- source_word: τέλος
  choice: итог
  rationale: «Итог» выражает достигнутый результат веры, не сводя значение лишь к временному завершению и не усиливая оттенок заранее поставленной цели.
- source_word: πίστεως ὑμῶν
  choice: вашей веры
  rationale: Родительный оборот естественно указывает на веру адресатов; «вера» сохраняет основной смысл πίστις в данном контексте.
- source_word: σωτηρίαν
  choice: спасение
  rationale: Стандартное и контекстуально уместное соответствие, сохраняющее богословскую связь с полнотой спасения, о которой говорится в ближайшем контексте.
- source_word: ψυχῶν
  choice: душ
  rationale: Прямое соответствие традиционной формулировке; при этом греческое ψυχή может обозначать также жизнь или самого человека, что отмечено в сноске без навязывания строгого противопоставления души и тела.
theological_decisions:
- issue: Значение πίστις в выражении «вашей веры»
  choice: вера
  alternative: доверие; верность
  rationale: В контексте естественнее всего имеется в виду вера адресатов. Перевод не переосмысливает её как верность, хотя такая лексическая возможность существует.
- issue: Значение ψυχή в выражении «спасение душ»
  choice: душ
  alternative: жизней; вас самих
  rationale: Основной текст близко следует греческой формулировке, но не утверждает тем самым спасение одной лишь нематериальной части человека; более широкие значения слова сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая причастная конструкция сохраняет связь с предыдущим контекстом. Тире ясно представляет «спасение ваших душ» как итог веры. Все сноски отмечены в основном тексте.
