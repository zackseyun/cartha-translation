  text: ἀλλὰ κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον καὶ αὐτοὶ ἅγιοι ἐν πάσῃ ἀναστροφῇ γενήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/015.yaml
  text: but as the Holy One who called you is holy[a], you yourselves also be holy in all your conduct[b],
translation:
  language: ru
  text: но, как свят Призвавший вас, так и вы сами будьте святы[a] во всём своём образе жизни[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «станьте святы». Греческая форма может подчёркивать вступление в это состояние или его проявление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во всех своих поступках». Греческое слово может обозначать как поведение, так и весь образ жизни человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: но
  rationale: Передаёт противопоставление прежним желаниям, о которых говорится в предыдущем стихе.
- source_word: κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον
  choice: как свят Призвавший вас
  rationale: κατά выражает соответствие образцу; такая конструкция сохраняет сопоставление святости Бога со святостью призванных им людей и естественно звучит по-русски.
- source_word: καὶ αὐτοὶ
  choice: так и вы сами
  rationale: «Так и» передаёт сопоставительное καί, а «сами» сохраняет усиление, выраженное αὐτοί.
- source_word: ἅγιοι
  choice: святы
  rationale: Сохраняет намеренный лексический повтор ἅγιον — ἅγιοι и связь между святостью Призвавшего и призванных.
- source_word: ἐν πάσῃ ἀναστροφῇ
  choice: во всём своём образе жизни
  rationale: ἀναστροφή обозначает поведение или весь уклад жизни; выбранная формулировка естественна для современного русского языка и передаёт всеохватность πάσῃ.
- source_word: γενήθητε
  choice: будьте
  rationale: Аористный императив γίνομαι допускает буквальное «станьте», однако в русском увещевании «будьте святы» звучит естественно и не навязывает особой модели процесса освящения.
theological_decisions:
- issue: Соотношение святости Бога и призвания верующих к святости
  choice: как свят Призвавший вас, так и вы сами будьте святы
  alternative: по примеру Святого, призвавшего вас, и сами станьте святы
  rationale: Выбранный вариант сохраняет явное соответствие между святостью Призвавшего и призванных, не превращая прилагательное ἅγιον в титул и не добавляя отсутствующего в тексте объяснения.
- issue: Смысл повеления γενήθητε
  choice: будьте святы
  alternative: станьте святы
  rationale: «Будьте» ясно передаёт повеление и сохраняет богословскую открытость текста; возможный оттенок вхождения в состояние отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Причастное «Призвавший» позволяет кратко и точно передать субстантивированное греческое причастие; прописная буква указывает на Бога без превращения слова «свят» в добавленный титул.
