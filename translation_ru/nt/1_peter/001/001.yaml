  to: Пётр, апостол Иисуса — Мессии, — избранным странникам, живущим в рассеянии, в Понте, Галатии, Каппадокии, Азии и Вифинии,
  rationale: Правка оформляет «Мессия» как титул Иисуса в нормативном современном русском и делает отношение к «рассеянию» понятным без утраты заложенной в греческом выражении неоднозначности. Запятая после «рассеянии» разграничивает оборот и географический перечень. Смысл и незавершённая синтаксическая форма стиха сохранены.
