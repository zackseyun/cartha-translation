  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: ru
  text: Пётр, апостол Иисуса — Мессии, — избранным странникам, живущим в рассеянии, в Понте, Галатии, Каппадокии, Азии и Вифинии,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πέτρος
  choice: Пётр
  rationale: Устоявшаяся русская форма имени, соответствующая новозаветной традиции и современному литературному употреблению.
- source_word: ἀπόστολος
  choice: апостол
  rationale: Здесь слово обозначает признанное служение и полномочие отправителя, а не просто посланника.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Χριστός передано как титул «Мессия», чтобы сохранить его смысл, а не свести выражение только к привычному составному имени.
- source_word: ἐκλεκτοῖς
  choice: избранным
  rationale: Прямо передаёт значение выбранности, не уточняя в переводе её богословский механизм.
- source_word: παρεπιδήμοις
  choice: странникам
  rationale: Слово передаёт положение людей, временно живущих не у себя и не вполне принадлежащих окружающему обществу; более буквальные оттенки приведены в примечании.
- source_word: διασπορᾶς
  choice: рассеяния
  rationale: Сохранена родительная конструкция и связь с понятием диаспоры без принудительного выбора между этническим и богословско-метафорическим пониманием.
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: в Понте, Галатии, Каппадокии, Азии и Вифинии
  rationale: Использованы традиционные русские формы географических названий; предлог «в» естественно выражает подразумеваемое местонахождение адресатов.
theological_decisions:
- issue: Значение ἐκλεκτοῖς
  choice: избранным
  alternative: избранникам
  rationale: Форма прилагательного ближе к греческому тексту и утверждает избранность адресатов, не превращая её в конфессионально нагруженный термин.
- issue: Связь παρεπιδήμοις διασπορᾶς
  choice: странникам рассеяния
  alternative: изгнанникам диаспоры
  rationale: Выбранная формулировка сохраняет одновременно социально-географический смысл чужеземного проживания и богословский образ Божьего народа вдали от родины.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Передача титула через «Мессия» делает явным его смысл и не отрицает традиционного варианта «Христос», указанного в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярного обращения. Тире помогает естественно оформить адресную формулу при сохранении незавершённости греческого предложения; конечная запятая показывает, что обращение продолжается в следующем стихе.
