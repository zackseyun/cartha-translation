review_pass:
  verdict: revise
  source_fidelity: 'Передача основных лексем в целом точна: ἀπόστολος — «апостол», ἐκλεκτοῖς — «избранным», а перечень областей передан корректно. «Странникам рассеяния» формально возможно, но в современном русском сочетание звучит не вполне прозрачно. Главная проблема — «Иисуса Мессии»: без поясняющей пунктуации такая генитивная титульная конструкция неестественна по-русски.'
  naturalness: Требуется небольшая стилистико-синтаксическая правка. Тире при «Иисуса — Мессии» ясно передаёт, что «Мессия» является титулом Иисуса, а не вторым компонентом неосвоенного имени. «Странникам, живущим в рассеянии» естественно по-русски и сохраняет двоякую — социально-географическую и образную — открытость оригинала.
  terminology: «Мессия» обоснованно сохраняет титульный смысл Χριστός; «Христа» остаётся допустимой традиционной альтернативой в примечании. «Рассеяние» соответствует διασπορά и не предрешает этническое либо исключительно метафорическое понимание.
  issues:
  - severity: medium
    issue: Неестественная конструкция «апостол Иисуса Мессии».
    rationale: В современном литературном русском «Мессия» как титул после имени Иисус требует синтаксического оформления; иначе фраза воспринимается как неуклюжее, неосвоенное двойное имя. Тире позволяет сохранить именно титульное значение Χριστοῦ.
  - severity: low
    issue: Сочетание «странникам рассеяния» недостаточно прозрачно.
    rationale: Оно буквально воспроизводит генитив, но для современного читателя может неясно обозначать отношение странников к рассеянию. Оборот «странникам, живущим в рассеянии» передаёт тот же смысл без богословской или этнической конкретизации.
  revised_text: Пётр, апостол Иисуса — Мессии, — избранным странникам, живущим в рассеянии, в Понте, Галатии, Каппадокии, Азии и Вифинии,
