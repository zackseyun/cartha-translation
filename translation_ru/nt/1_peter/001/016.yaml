  text: because it is written[a], “You shall be holy, because I am holy.”
translation:
  language: ru
  text: 'потому что написано: «Будьте святы, потому что Я свят».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально, с будущей формой, как в греческом тексте цитаты: «Вы будете святы»; здесь она имеет силу повеления.'
    reason: alternative_reading
lexical_decisions:
- source_word: διότι
  choice: потому что
  rationale: Вводит основание предшествующего призыва, выражая причинную связь естественно для современного русского языка.
- source_word: γέγραπται
  choice: написано
  rationale: Устойчивая русская формула введения цитаты из Писания; передаёт сохраняющую силу результата перфекта.
- source_word: ὅτι (первое)
  choice: не выражено отдельно; передано двоеточием и кавычками
  rationale: Союз вводит прямую цитату, что в русском естественно передать пунктуацией.
- source_word: Ἅγιοι ἔσεσθε
  choice: Будьте святы
  rationale: Будущее изъявительное в цитате имеет предписывающую силу. Русское «будьте» ясно и естественно передаёт призыв, тогда как «будете святы» может быть воспринято лишь как предсказание; формальная особенность отмечена в сноске.
- source_word: ὅτι (второе)
  choice: потому что
  rationale: Передаёт основание призыва — святость Бога — без устранения причинной связи.
- source_word: ἐγὼ ἅγιος
  choice: Я свят
  rationale: Сохраняет подчёркнутое местоимение и лексическую связь между святостью Бога и призванной святостью людей.
theological_decisions:
- issue: Сила будущей формы ἔσεσθε в цитате о святости
  choice: 'В основном тексте передать как предписание: «Будьте святы», а форму источника пояснить в сноске.'
  alternative: «Вы будете святы» / «Да будете святы»
  rationale: В греческой библейской речи будущее время здесь несёт императивную силу. «Будьте святы» понятно современному читателю и не превращает повеление в простое предсказание; сноска сохраняет межтекстовую формальную особенность.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формула цитирования Писания. Заглавная буква в «Я» обозначает речь Бога. Маркер сноски поставлен непосредственно после цитаты.
