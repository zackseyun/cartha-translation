  source_fidelity: «Потому что написано» точно передаёт διότι γέγραπται как причинное основание и обычную формулу введения библейской цитаты. «Будьте святы» адекватно воспроизводит предписывающую силу Ἅγιοι ἔσεσθε, а сноска корректно сохраняет формальную будущую форму греческого текста. Второе «потому что» верно передаёт причинное ὅτι; «Я свят» сохраняет явное ἐγώ и повтор ключевого определения ἅγιος.
  naturalness: Текст краток, ясен и естественен для современного литературного русского. Формула цитаты имеет уместный возвышенный библейский регистр, не становясь архаичной. Начальная строчная буква допустима, поскольку стих начинается как продолжение синтаксиса предыдущего предложения.
  terminology: «Святы/свят» последовательно передаёт ἅγιοι/ἅγιος и является устоявшимся, точным термином в данном этико-библейском контексте. Заглавное «Я» в божественной речи соответствует принятому русскому издательскому употреблению и не добавляет богословского истолкования.
