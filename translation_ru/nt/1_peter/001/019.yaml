source:
  edition: SBLGNT
  text: ἀλλὰ τιμίῳ αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/019.yaml
  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: ru
  text: но драгоценной кровью Мессии[a] — словно кровью ягнёнка без порока и пятна,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа». Греческий титул Χριστός означает «Мессия»; традиционно его также передают как «Христос».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: но
  rationale: 'Передаёт сильное противопоставление отрицанию в предыдущем стихе: искуплены не тленным, но драгоценной кровью.'
- source_word: τιμίῳ
  choice: драгоценной
  rationale: Сохраняет значения высокой ценности и чести и естественно сочетается в русском языке со словом «кровь».
- source_word: αἵματι
  choice: кровью
  rationale: Конкретный образ сохранён буквально; подразумеваемая жертвенная смерть не подменяет исходное существительное.
- source_word: ὡς
  choice: словно кровью
  rationale: Передаёт сравнение и естественно уточняет в русском, что речь идёт о крови ягнёнка; повтор слова «кровью» подразумевается греческой конструкцией.
- source_word: ἀμνοῦ
  choice: ягнёнка
  rationale: Прямой современный эквивалент, сохраняющий жертвенные ассоциации без их разъяснения в основном тексте.
- source_word: ἀμώμου
  choice: без порока
  rationale: Отражает лексику пригодности жертвенного животного и не сводит выражение лишь к нравственной безупречности.
- source_word: καὶ
  choice: и
  rationale: Сохраняет простое соединение двух характеристик.
- source_word: ἀσπίλου
  choice: без пятна
  rationale: Сохраняет отдельный образ отсутствия пятна и параллелизм с выражением «без порока».
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Передаёт значение титула Χριστός прозрачно и сохраняет мессианский смысл; традиционный вариант «Христа» указан в сноске.
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В данном контексте слово допускает понимание как мессианского титула. Основной вариант раскрывает значение титула, а традиционная передача сохранена в сноске.
- issue: Связь сравнения с ягнёнком
  choice: «словно кровью ягнёнка»
  alternative: «как непорочного и незапятнанного ягнёнка»
  rationale: Греческий родительный оборот буквально относится к крови ягнёнка и одновременно уподобляет Мессию жертвенному ягнёнку. Русская формулировка ясно выражает сравнение крови, не устраняя жертвенного образа.
translation_notes:
  register: Современный литературный русский с dignified библейским звучанием. Формулы «без порока и пятна» сохраняют жертвенную образность и параллелизм, оставаясь понятными обычному читателю.
