source:
  edition: SBLGNT
  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: ru
  text: Но слово Господа остаётся навеки». И это то слово, которое было возвещено вам как добрая весть.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которое было проповедано вам как Евангелие».'
    reason: Лексическая альтернатива передачи εὐαγγελισθέν.
lexical_decisions:
- source_word: ῥῆμα
  choice: слово
  rationale: «Слово» сохраняет прямую связь с цитатой из Исайи 40:8 и естественно употребляется в обоих предложениях; при этом вторая часть раскрывает его как возвещённую весть.
- source_word: κυρίου
  choice: Господа
  rationale: Обычный и уместный эквивалент κύριος; родительный падеж точно передаёт значение «слово Господа» и сохраняет библейскую формулу.
- source_word: μένει
  choice: пребывает
  rationale: Передаёт длительное, неизменное продолжение существования; в литературном русском звучит достойно и не является непонятным архаизмом.
- source_word: εἰς τὸν αἰῶνα
  choice: вовеки
  rationale: Устойчивый русский библейский эквивалент идеи непреходящей длительности, естественный в контексте цитаты.
- source_word: τοῦτο δέ ἐστιν
  choice: И это то
  rationale: δέ обозначает мягкий переход, а такая конструкция естественно связывает цитату с её применением к читателям.
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: то слово, которое было возвещено как Благая весть
  rationale: Сохраняет повтор ῥῆμα и явно передаёт глагольное значение εὐαγγελίζω — возвещать благую весть, не сводя его просто к общему «проповедовать».
- source_word: εἰς ὑμᾶς
  choice: вам
  rationale: Естественно передаёт направленность возвещения к адресатам.
theological_decisions:
- issue: Соотношение «слова Господа» в цитате из Исайи 40:8 и возвещённой читателям Благой вести
  choice: Сохранить в цитате «слово Господа», а затем отождествить его со словом, возвещённым читателям как Благая весть.
  alternative: 'Во всём стихе передать более истолковательно: «весть от Господа».'
  rationale: Так сохраняются и формулировка Писания, и сделанное Петром применение к благовестию, без преждевременного устранения напряжения между цитатой и её толкованием.
- issue: Передача εὐαγγελισθέν
  choice: «было возвещено вам как Благая весть»
  alternative: «было проповедано вам как Евангелие»
  rationale: Выбранный вариант делает явным значение «возвещать благую весть», остаётся понятным современному читателю и не добавляет содержания, отсутствующего в греческом тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Пребывает вовеки» сохраняет торжественный характер цитаты, а «возвещено вам как Благая весть» ясно передаёт смысл для обычного современного читателя. Закрывающая кавычка оставлена после первой фразы, поскольку стих завершает начатую ранее цитату.
