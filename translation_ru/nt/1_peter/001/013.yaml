language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: ru
  text: Поэтому, опоясав чресла своего разума[a] и будучи вполне ясными умом[b], всецело возложите надежду на благодать, приносимую вам при явлении Иисуса Мессии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «опоясав чресла своего разума»; то есть приготовив разум к действию.'
    reason: lexical_alternative
  - marker: b
    text: Греческое слово «полностью, всецело» можно связать как с ясностью ума, так и с повелением всецело возложить надежду.
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего рассуждения естественным для современного русского языка способом.
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: опоясав чресла своего разума
  rationale: Сохраняет яркую телесную метафору приготовления к действию; её смысл пояснён в сноске.
- source_word: νήφοντες
  choice: сохраняя ясность ума
  rationale: В данном контексте глагол имеет переносный смысл умственной собранности и трезвой рассудительности, а не буквального воздержания от вина.
- source_word: τελείως
  choice: полную / всецело
  rationale: Наречие синтаксически может относиться как к νήφοντες, так и к ἐλπίσατε; основной текст позволяет услышать обе связи, а сноска прямо отмечает неоднозначность.
- source_word: ἐλπίσατε ἐπί
  choice: возложите надежду на
  rationale: Передаёт решительный характер аористного повелительного наклонения и управление с ἐπί.
- source_word: τὴν φερομένην ὑμῖν χάριν
  choice: на благодать, приносимую вам
  rationale: Сохраняет настоящее страдательное причастие и направленность благодати к адресатам, не превращая его без необходимости в простое будущее время.
- source_word: ἐν ἀποκαλύψει
  choice: при явлении
  rationale: Передаёт временную связь благодати с будущим открытым явлением Иисуса; «явление» здесь звучит естественнее русского «откровение Иисуса», которое может быть понято как сообщённое им откровение.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Мессии
  rationale: Передаёт Χριστός как титул «Мессия»; русский падеж ясно выражает сочетание имени и титула без дополнительного артикля, отсутствующего в русском языке.
theological_decisions:
- issue: Сохранение метафоры опоясывания чресл разума
  choice: Сохранить метафору в основном тексте и пояснить её смысл в сноске.
  alternative: «приготовив свой разум к действию»
  rationale: Образ намеренно выразителен и связывает внутреннюю готовность с подготовкой человека к действию; полная замена толкованием обеднила бы текст.
- issue: Синтаксическая связь τελείως
  choice: 'Не устранять неоднозначность: отразить полноту и в ясности ума, и в возложении надежды, снабдив сноской.'
  alternative: Связать наречие только с «возложите надежду» либо только с «сохраняя ясность ума».
  rationale: Положение наречия допускает обе связи; однозначный перевод чрезмерно сузил бы греческий текст.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В эсхатологическом контексте титульное значение Χριστός остаётся отчётливым; «Мессия» прямо передаёт его смысл, не вводя особого конфессионального толкования.
- issue: Значение ἀποκάλυψις
  choice: явление Иисуса Мессии
  alternative: откровение Иисуса Мессии
  rationale: Контекст указывает на эсхатологическое раскрытие, то есть явление его самого; выбранная формулировка избегает ложного понимания родительного падежа как обозначения автора откровения.
translation_notes:
  register: Современный литературный русский с достоинством библейского регистра. Архаизирующее «чресла» сохранено только внутри намеренно необычной исходной метафоры и сразу пояснено; остальная фраза сформулирована современно и понятно.
