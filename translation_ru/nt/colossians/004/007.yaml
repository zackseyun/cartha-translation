    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: обо всём, что касается меня
  rationale: Оборот обозначает все дела и обстоятельства, относящиеся к Павлу; перевод сохраняет широкий смысл πάντα и не сужает его только до внешних обстоятельств.
- source_word: γνωρίσει ὑμῖν
  choice: вам расскажет
  rationale: Будущее время γνωρίσει передаёт сообщение сведений. «Расскажет» естественно по-русски в данном контексте и не меняет содержания глагола.
- source_word: Τυχικὸς
  choice: Тихик
  rationale: Использована устоявшаяся русская форма библейского имени.
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: возлюбленный брат
  rationale: Перевод сохраняет теплоту и достоинство характеристики Павла; мужской род соответствует конкретному лицу.
- source_word: πιστὸς διάκονος
  choice: верный служитель
  rationale: διάκονος здесь обозначает служение, но контекст не требует понимать слово как название определённой церковной должности; «верный» передаёт надёжность и преданность.
- source_word: σύνδουλος
  choice: мой сораб
  rationale: Сложное слово указывает на того, кто вместе с Павлом находится в положении раба и служит одному Господину. Краткое «сораб» сохраняет эту более сильную смысловую окраску, хотя является книжным словом; значение пояснено в сноске.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Сохранена характерная для Павла формула, выражающая сферу принадлежности, отношений и служения, без её разъясняющего сужения.
theological_decisions:
- issue: Передача σύνδουλος и заложенного в нём значения δοῦλος
  choice: мой сораб
  alternative: мой товарищ по служению; раб Господа вместе со мной
  rationale: Основной текст сохраняет представление о совместной принадлежности и подчинённом служении Господу, не сводя слово к нейтральному сотрудничеству. Сноска предупреждает, что по-русски возможен более мягкий вариант «слуга», и не навязывает отдельной конфессиональной трактовки.
- issue: Отнесение ἐν κυρίῳ
  choice: сохранить фразу в конце ряда характеристик
  alternative: связать её только с «сораб» или развернуть как «в служении Господу»
  rationale: Положение оборота в греческом допускает его естественное распространение на ряд характеристик либо особенно на последнюю. Конечная позиция в русском сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский с достоинством апостольского письма. Инверсия греческого предложения передана естественным русским порядком слов. «Сораб» — намеренно книжное, но прозрачное слово, позволяющее кратко сохранить силу σύνδουλος; сноска обеспечивает понятность обычному читателю.
