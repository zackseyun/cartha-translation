  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: ru
  text: 'Я послал его к вам именно для этого: чтобы вы узнали, как идут наши дела[a], и чтобы он ободрил ваши сердца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «чтобы мы узнали, как идут ваши дела».'
    reason: textual_variant
lexical_decisions:
- source_word: ὃν
  choice: его
  rationale: Винительный падеж относительного местоимения относится к Тихику из предыдущего стиха; в самостоятельной русской фразе естественно местоимение «его».
- source_word: ἔπεμψα
  choice: Я послал
  rationale: Аорист передан простым прошедшим временем без добавления оттенков, которых форма сама по себе не требует.
- source_word: πρὸς ὑμᾶς
  choice: к вам
  rationale: После глагола посылания πρός с винительным обозначает направление к людям; «к вам» естественно по-русски.
- source_word: εἰς αὐτὸ τοῦτο
  choice: именно для того
  rationale: Фраза выражает подчёркнутую цель; «именно» передаёт усиление αὐτό и не утяжеляет предложение.
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит придаточное цели и сохраняет целевое значение греческой конструкции.
- source_word: γνῶτε
  choice: вы узнали
  rationale: Аорист конъюнктива после ἵνα обозначает намеченную цель; совершенный вид «узнали» хорошо передаёт достижение знания.
- source_word: τὰ περὶ ἡμῶν
  choice: каковы наши обстоятельства
  rationale: Оборот означает сведения о положении Павла и его спутников. Эта формулировка ясна и сохраняет широту выражения, не сводя его лишь к самочувствию.
- source_word: παρακαλέσῃ
  choice: ободрил
  rationale: В данном контексте παρακαλέω подразумевает утешение и укрепление; «ободрил» естественно охватывает оба оттенка, не превращая речь в формальное наставление.
- source_word: τὰς καρδίας ὑμῶν
  choice: ваши сердца
  rationale: Прямой перевод сохраняет библейский образ сердца как внутреннего человека и хорошо сочетается с глаголом «ободрил».
theological_decisions:
- issue: Текстовый вариант меняет направление получения сведений
  choice: 'Основной текст следует SBLGNT: «чтобы вы узнали, каковы наши обстоятельства» (γνῶτε τὰ περὶ ἡμῶν).'
  alternative: 'В некоторых рукописях: «чтобы мы узнали, каковы ваши обстоятельства» (γνῶμεν τὰ περὶ ὑμῶν или близкие варианты).'
  rationale: Основной перевод следует указанному греческому изданию, а значимый вариант, меняющий субъект и предмет узнавания, открыт читателю в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены библейский образ «сердца» и параллельная конструкция двух целей; текстовый вариант отмечен без попытки скрыто разрешить разночтение.
