  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: ru
  text: Пусть ваша речь всегда будет доброжелательной[a], приправленной солью[b], чтобы вы знали, как следует отвечать каждому.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в благодати». Речь может подразумеваться как доброжелательная, любезная или отмеченная благодатью.'
    reason: lexical_alternative
  - marker: b
    text: «Приправленная солью» — образ уместной, выразительной и мудрой речи, а не безвкусной или разлагающей.
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος ὑμῶν
  choice: ваша речь
  rationale: В данном наставлении λόγος означает речь и манеру говорить, а не отдельное слово или формальное послание.
- source_word: ἐν χάριτι
  choice: благодатной
  rationale: Прилагательное естественно по-русски передаёт речь, отмеченную добротой и расположением, при этом сохраняет более широкий смысловой отзвук χάρις — «благодать».
- source_word: ἅλατι ἠρτυμένος
  choice: приправленной солью
  rationale: Сохранена метафора речи уместной, выразительной и мудрой; причастная конструкция передаёт устойчивое качество речи.
- source_word: πάντοτε
  choice: всегда
  rationale: Прямой и естественный эквивалент, сохраняющий всеохватность наставления.
- source_word: εἰδέναι
  choice: чтобы вы знали
  rationale: Инфинитив синтаксически неоднозначен; целевой оборот ясно связывает умение отвечать с предшествующим наставлением, не перегружая русский текст.
- source_word: δεῖ
  choice: следует
  rationale: Передаёт необходимость и уместность, не усиливая её до безусловного «должны».
- source_word: ἑνὶ ἑκάστῳ
  choice: каждому
  rationale: Кратко и естественно сохраняет распределительное значение — каждому отдельному человеку.
- source_word: ἀποκρίνεσθαι
  choice: отвечать
  rationale: Прямой русский эквивалент, подходящий к подразумеваемой беседе.
theological_decisions:
- issue: Значение ἐν χάριτι
  choice: благодатной
  alternative: любезной; исполненной благодати
  rationale: Выбор сохраняет напряжение между человеческой доброжелательностью речи и богословским оттенком благодати, не ограничивая выражение только одним из этих смыслов.
- issue: Связь инфинитива εἰδέναι с предыдущей фразой
  choice: 'цель или следствие: «чтобы вы знали»'
  alternative: 'прямое продолжение наставления: «зная» или «знать»'
  rationale: Греческая конструкция с инфинитивом допускает некоторую синтаксическую неопределённость; русский целевой оборот лучше всего передаёт смысловую связь, а неоднозначность отмечена в примечании.
translation_notes:
  register: Современный литературный русский язык; тон краткий, наставительный и достойный. Метафора соли сохранена, а тяжеловесные буквальные конструкции устранены.
