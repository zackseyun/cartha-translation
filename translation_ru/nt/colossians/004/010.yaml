base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: ru
  text: 'Вас приветствуют Аристарх, мой товарищ по заключению, и Марк, двоюродный брат Варнавы[a] (о нём вы получили указания: если он придёт к вам, примите его[b]).'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный вариант перевода: «племянник Варнавы». Греческое слово здесь точнее означает «двоюродный брат».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть примите его гостеприимно; возможный перевод: «радушно примите его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται ὑμᾶς
  choice: Вас приветствуют
  rationale: Глагол в единственном числе согласован с первым названным лицом, но далее к приветствию присоединён Марк; русское множественное число естественно охватывает обоих и сохраняет эпистолярный смысл выражения.
- source_word: συναιχμάλωτός μου
  choice: мой соузник
  rationale: «Соузник» кратко и точно передаёт человека, находящегося в заключении вместе с говорящим, не уточняя, следует ли понимать заключение буквально или образно.
- source_word: ἀνεψιὸς Βαρναβᾶ
  choice: двоюродный брат Варнавы
  rationale: В греческом языке эпохи Нового Завета ἀνεψιός обозначает двоюродного брата; этот перевод точнее традиционного варианта «племянник».
- source_word: ἐλάβετε ἐντολάς
  choice: вы получили указания
  rationale: Сочетание выражает полученные распоряжения или наставления. «Указания» передаёт их обязательный характер, не придавая фразе излишне жёсткого оттенка.
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: если он придёт к вам
  rationale: Естественная русская передача условия, относящегося к возможному будущему событию.
- source_word: δέξασθε αὐτόν
  choice: примите его
  rationale: В данном контексте глагол означает принять прибывшего человека, вероятно с оттенком гостеприимства. Основной текст сохраняет присущую греческому слову широту, а примечание поясняет контекстуальный смысл.
theological_decisions:
- issue: Характер отношений Павла и Аристарха в выражении συναιχμάλωτός μου
  choice: мой соузник
  alternative: заключённый вместе со мной; мой товарищ по плену
  rationale: Перевод сохраняет прямой смысл слова, но не добавляет отсутствующего в стихе уточнения «во Христе» и не решает за читателя, буквально или метафорически описано заключение.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным эпистолярным звучанием. «Соузник» несколько возвышенно, но ясно и уместно для библейского текста. Порядок слов слегка приспособлен к естественной русской речи; скобки оригинала сохранены.
