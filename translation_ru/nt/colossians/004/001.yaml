id: COL.4.1
reference: Colossians 4:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: ru
  text: Хозяева, обеспечивайте рабам справедливое и равное обращение[a], зная, что и у вас есть Господь на небе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость и равенство». Греческое слово, переведённое как «равное», может также означать «равенство», «беспристрастность» или «справедливость».'
    reason: Лексическая многозначность ἰσότητα; сноска сохраняет существенную возможность перевода «равенство».
lexical_decisions:
- source_word: οἱ κύριοι
  choice: Хозяева
  rationale: В контексте наставлений членам дома слово обозначает земных хозяев по отношению к рабам. «Хозяева» ясно и естественно передаёт эту социальную роль, не смешивая её с титулом «Господь» во второй части стиха.
- source_word: τὸ δίκαιον
  choice: должное
  rationale: Субстантивированное прилагательное обозначает то, что правильно и справедливо. В сочетании со следующим существительным «должное» естественно передаёт обязанность хозяев дать рабам то, что им полагается.
- source_word: τὴν ἰσότητα
  choice: справедливое
  rationale: Ἰσότης может обозначать равенство, беспристрастность или справедливое, равноправное отношение. В основном тексте «справедливое» звучит естественно; значимая возможность перевода «равенство» сохранена в сноске.
- source_word: τοῖς δούλοις
  choice: рабам
  rationale: Прямое противопоставление хозяев и δοῦλοι делает подневольный социальный статус явным; «слуги» неоправданно смягчило бы смысл.
- source_word: παρέχεσθε
  choice: предоставляйте
  rationale: Императив призывает хозяев давать или обеспечивать рабам должное обращение. «Предоставляйте» сохраняет направленность действия и сочетается с предметным оборотом.
- source_word: εἰδότες
  choice: зная
  rationale: Деепричастная конструкция сохраняет форму причастия и не сужает его смысл до исключительно причинного.
- source_word: καὶ ὑμεῖς
  choice: и у вас
  rationale: Оборот подчёркивает, что земные хозяева сами находятся под властью Господа.
- source_word: κύριον
  choice: Господь
  rationale: Заглавная буква и традиционный титул передают богословский вес κύριος и отличают небесного Господа от земных хозяев.
- source_word: ἐν οὐρανῷ
  choice: на небе
  rationale: Это естественный современный русский эквивалент выражения с ἐν и формой единственного числа.
theological_decisions:
- issue: Передача δοῦλοι в контексте отношений хозяев и подвластных им людей
  choice: рабы
  alternative: слуги; рабы-слуги
  rationale: Здесь социальная несвобода обозначена явно через обращение к хозяевам, поэтому прямое слово «рабы» точнее и не смягчает историческую реальность.
- issue: Многозначность ἰσότητα
  choice: справедливое
  alternative: равенство; равное отношение; беспристрастность
  rationale: Контекст допускает смысл справедливого или равного обращения, но само слово также может прямо обозначать равенство. Основной текст остаётся естественным, а более буквальная и богословски значимая возможность отмечена в сноске.
- issue: Соотношение земных κυρίοι и небесного κύριος
  choice: Хозяева … Господь
  alternative: Господа … Господин; хозяева … Хозяин
  rationale: 'Разные русские соответствия ясно различают социальную роль людей и богословский титул, сохраняя при этом смысловой контраст: имеющие власть сами подчинены небесному Господу.'
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным повелительным тоном. Формулировка не смягчает исторический смысл слова «рабы» и избегает архаичного обращения «господа», которое сегодня прежде всего воспринимается как вежливая форма обращения.
