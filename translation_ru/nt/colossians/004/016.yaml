  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: ru
  text: Когда это послание будет прочитано среди вас[a], позаботьтесь, чтобы его прочитали также в церкви лаодикийцев и чтобы вы тоже прочитали послание из Лаодикии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятно, имеется в виду чтение вслух перед собравшейся церковью, хотя греческий глагол сам по себе означает просто «читать».
    reason: lexical_alternative
  - marker: b
    text: Неизвестно, о каком именно послании идёт речь. Греческий текст буквально говорит о послании «из Лаодикии» и не уточняет, было ли оно адресовано лаодикийцам или лишь находилось там.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: будет прочитано / прочитайте
  rationale: Глагол ἀναγινώσκω означает «читать» и в данном контексте, вероятно, подразумевает чтение вслух перед общиной. В основном тексте сохранено более широкое «читать», а вероятный публичный характер чтения отмечен в сноске.
- source_word: παρ’ ὑμῖν
  choice: у вас
  rationale: Сочетание παρά с дательным падежом здесь указывает на чтение в среде колосской общины. Русское «у вас» естественно передаёт этот локально-социальный смысл.
- source_word: ἡ ἐπιστολή
  choice: это послание
  rationale: Артикль указывает на послание, которое сейчас направляется колоссянам. Указательное «это» ясно передаёт такую отсылку; «послание» соответствует достоинству и жанру текста.
- source_word: ποιήσατε ἵνα
  choice: позаботьтесь, чтобы
  rationale: Эта конструкция выражает настойчивое требование обеспечить названный результат. «Позаботьтесь, чтобы» звучит естественно и сохраняет повелительную силу.
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: в церкви лаодикийцев
  rationale: Формулировка близко передаёт греческую конструкцию и обозначает церковь, состоящую из жителей Лаодикии, не вводя лишней конфессиональной окраски.
- source_word: τὴν ἐκ Λαοδικείας
  choice: послание из Лаодикии
  rationale: Существительное «послание» в греческом опущено, но подразумевается из контекста; в русском его восстановление необходимо для ясности. Предлог ἐκ передан своим обычным значением «из», без замены на «к» или «для».
theological_decisions:
- issue: Тождество послания из Лаодикии
  choice: Нейтрально передать как «послание из Лаодикии», не отождествляя его с каким-либо известным текстом.
  alternative: Послание, адресованное лаодикийцам; письмо, находившееся в Лаодикии; циркулярное послание, иногда отождествляемое с Посланием к эфесянам.
  rationale: Греческий текст указывает лишь на связь послания с Лаодикией посредством ἐκ («из») и не раскрывает его происхождения, адресата или тождества. Перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык; синтаксис плавный и понятный, при этом сохранены повелительная сила стиха и неопределённость относительно послания из Лаодикии. «Церковь лаодикийцев» следует структуре оригинала, а «послание» поддерживает достойный библейский регистр без архаизации.
