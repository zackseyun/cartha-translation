base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: ru
  text: вместе с Онисимом, верным и возлюбленным братом, который — один из вас[a]. Они сообщат вам обо всём здешнем[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который происходит из вашей среды».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обо всём, что здесь происходит».'
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν Ὀνησίμῳ
  choice: вместе с Онисимом
  rationale: Предлог σύν выражает сопровождение; «вместе с» ясно связывает Онисима с Тихиком из предыдущего стиха. Имя передано в принятой русской библейской форме.
- source_word: πιστῷ καὶ ἀγαπητῷ ἀδελφῷ
  choice: верным и любимым братом
  rationale: «Верный» сохраняет этико-религиозный смысл πιστός, «любимый» естественно передаёт теплоту ἀγαπητός, а «брат» сохраняет семейный язык христианской общины без пояснительной вставки.
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: который один из вас
  rationale: Оборот естественно выражает принадлежность Онисима к адресатам, не уточняя сверх текста, идёт ли речь прежде всего о происхождении или об общинной принадлежности.
- source_word: πάντα ὑμῖν γνωρίσουσιν
  choice: Они сообщат вам обо всём
  rationale: Будущее время и множественное число сохранены; «сообщат» естественно передаёт γνωρίζω — сделать известным, известить.
- source_word: τὰ ὧδε
  choice: обо всём здешнем
  rationale: Краткий русский оборот сохраняет неопределённо-широкую ссылку на находящееся или происходящее там, где пребывает Павел, не сводя её только к событиям.
theological_decisions:
- issue: Церковно-общинный смысл ἀδελφῷ
  choice: братом
  alternative: братом по вере
  rationale: Контекст обозначает единоверца, однако греческий текст говорит просто «брат». Сохранён образ родства без добавленного толкования.
- issue: Значение ἐξ ὑμῶν
  choice: который один из вас
  alternative: который происходит из вашей среды
  rationale: Основной вариант подчёркивает принадлежность Онисима к кругу адресатов, но не привносит сведения о его общественном положении или отношениях, известные из Послания к Филимону.
- issue: Объём выражения τὰ ὧδε
  choice: обо всём здешнем
  alternative: обо всём, что здесь происходит
  rationale: 'Выбранный вариант сохраняет широту греческого выражения: речь может идти не только о событиях, но и вообще о местных обстоятельствах и делах.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным эпистолярным тоном. Формулировки кратки и понятны; сохранены общинное обращение «брат» и смысловая широта выражения τὰ ὧδε.
