  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: ru
  text: 'И скажите Архиппу: «Позаботься о том, чтобы исполнить служение, которое ты принял в Господе[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «которое ты принял от Господа».'
    reason: Альтернативное понимание ἐν κυρίῳ как указания на источник служения.
lexical_decisions:
- source_word: εἴπατε
  choice: скажите
  rationale: Аористный императив множественного числа обращён к общине; «скажите» естественно и точно передаёт прямое повеление.
- source_word: Ἀρχίππῳ
  choice: Архиппу
  rationale: Имя передано в традиционной русской библейской форме и поставлено в дательном падеже согласно греческому тексту.
- source_word: Βλέπε
  choice: смотри
  rationale: Императив настоящего времени выражает внимательное, продолжающееся попечение; в сочетании с последующим повелением «смотри» звучит естественно и сохраняет образ греческого глагола.
- source_word: διακονίαν
  choice: служение
  rationale: Слово обозначает порученное христианское служение, не уточняя церковной должности.
- source_word: παρέλαβες
  choice: принял
  rationale: Передаёт получение вверенного поручения, а не самостоятельно избранной роли.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Буквально сохраняет предлог ἐν и оставляет открытым оттенок сферы, связи или, косвенно, источника поручения.
- source_word: ἵνα αὐτὴν πληροῖς
  choice: исполни служение
  rationale: Греческая конструкция выражает цель увещания, а πληρόω здесь означает полностью осуществить порученное служение. Русский императив естественно передаёт целевую силу фразы без тяжеловесного «чтобы ты его исполнял».
theological_decisions:
- issue: Значение ἐν κυρίῳ
  choice: «в Господе» в основном тексте
  alternative: «от Господа»
  rationale: Предлог ἐν прежде всего указывает на сферу или связь, хотя контекст допускает понимание Господа как источника поручения. Основной текст сохраняет формулировку и богословскую открытость оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского увещания. Формулировка краткая и понятная; церковная должность Архиппа не конкретизируется.
