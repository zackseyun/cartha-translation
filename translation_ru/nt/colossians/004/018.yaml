  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: ru
  text: Приветствие — моей собственной рукой. Павел.[a] Помните о моих узах.[b] Благодать да будет с вами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заключительное приветствие». Слова «Павел» передают личную подпись автора; речь идёт о заключительном приветствии, написанном им собственноручно.'
    reason: clarification
  - marker: b
    text: 'Или: «о моих оковах»; по смыслу также: «о моём заключении». Буквально: «о моих узах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασμός
  choice: приветствие
  rationale: В данном эпистолярном контексте обозначает заключительное приветствие, собственноручно написанное Павлом. «Приветствие» естественно и точно передаёт смысл.
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: написано моей рукой — Павловой
  rationale: Дательный оборот указывает на собственноручную запись Павла. Эллиптическая греческая формулировка развёрнута по нормам русского языка, а уточнение «Павловой» сохраняет личное заверение авторства.
- source_word: μνημονεύετέ
  choice: Помните
  rationale: Настоящее повелительное наклонение может подразумевать постоянное памятование, но простое «Помните» естественно выражает продолжающийся призыв без избыточного уточнения вида действия.
- source_word: μου τῶν δεσμῶν
  choice: о моих узах
  rationale: δεσμοί буквально означает узы, оковы или цепи и метонимически указывает на заключение. «Узы» сохраняет конкретный образ несвободы и соответствует достоинству контекста.
- source_word: ἡ χάρις
  choice: Благодать
  rationale: Обычная для Павла заключительная формула. Определённый артикль по-русски отдельно не передаётся; добавление «Божья» внесло бы не выраженное прямо уточнение.
- source_word: μεθ’ ὑμῶν
  choice: да будет с вами
  rationale: В греческом благословение безглагольное. Русская формула «да будет с вами» естественно восполняет подразумеваемую связку и сохраняет благословительный характер фразы.
theological_decisions:
- issue: Безглагольное заключительное благословение
  choice: Благодать да будет с вами
  alternative: Благодать с вами
  rationale: Добавление «да будет» необходимо для естественной русской благословительной формулы и не вносит нового богословского содержания.
- issue: Образ δεσμοί как обозначение заключения
  choice: мои узы
  alternative: моё заключение
  rationale: Сохранён конкретный образ физических уз, который одновременно может обозначать состояние Павла как узника; более абстрактный вариант снял бы эту образность.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной интонацией заключения послания. Синтаксическая эллиптичность оригинала раскрыта лишь там, где этого требует естественная русская речь; образ уз сохранён.
