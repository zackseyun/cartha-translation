id: COL.4.11
reference: Colossians 4:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: ru
  text: и Иисус, называемый Иустом. Из обрезанных только они — соработники ради Царства Божьего[a], и они стали для меня утешением[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соработники для Царства Божьего».'
    reason: Предлог εἰς обозначает направленность или цель труда; возможны обе русские формулировки.
  - marker: b
    text: 'Или: «поддержкой»; также возможно: «оказались для меня утешением».'
    reason: παρηγορία может обозначать утешение, ободрение или поддержку, а ἐγενήθησαν допускает контекстуальную передачу «стали» либо «оказались».
lexical_decisions:
- source_word: Ἰησοῦς
  choice: Иисус
  rationale: Обычная новозаветная передача личного имени; форма «Иисус» сохраняет узнаваемость и соответствует русской библейской традиции.
- source_word: ὁ λεγόμενος Ἰοῦστος
  choice: называемый Иустом
  rationale: Причастный оборот указывает на другое имя или римское прозвище; русская формулировка естественна и близка структуре источника.
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: из обрезанных
  rationale: Передаёт буквальный образ иудейской принадлежности, не сводя его безоговорочно ни к этническому обозначению, ни к названию отдельной партии.
- source_word: οὗτοι μόνοι
  choice: только они
  rationale: Сохраняет акцент на исключительности именно внутри ранее названной группы.
- source_word: συνεργοὶ
  choice: мои соработники
  rationale: «Соработники» — понятное и достойное обозначение тех, кто трудится вместе с Павлом; притяжательное «мои» естественно следует из контекста и последующего μοι.
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: ради Царства Божьего
  rationale: Передаёт направленность их совместного труда на служение Царству; «ради» звучит естественнее буквального «в Царство» и не утверждает, что они создают Царство.
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: они стали для меня утешением
  rationale: Прямо отражает аорист ἐγενήθησαν и существительное παρηγορία, сохраняя возможный оттенок утешения и поддержки.
theological_decisions:
- issue: Кого обозначает выражение «из обрезанных»
  choice: Сохранено буквальное обозначение иудейской принадлежности.
  alternative: «Из иудеев» либо «из сторонников обрезания».
  rationale: Контекст соработников наиболее естественно указывает на верующих иудейского происхождения, но сама формулировка не позволяет без остатка решить, является ли это только этническим обозначением или также связано с определённой группой; буквальный образ сохраняет эту напряжённость.
- issue: Связь μόνοι с группой «из обрезанных»
  choice: «Из обрезанных только они — мои соработники».
  alternative: «Только они — соработники ради Царства Божьего, принадлежащие к обрезанным».
  rationale: Греческий порядок сначала выделяет группу «из обрезанных», а затем утверждает, что только названные лица из этой группы являются соработниками; основной текст сохраняет эту логику.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. Начальное «и» сохранено, поскольку стих продолжает перечень предыдущего контекста. Тире помогает ясно выразить греческую именную конструкцию без тяжеловесности.
