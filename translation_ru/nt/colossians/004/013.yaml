  text: Ибо я свидетельствую о нём, что он много трудится ради вас, ради тех, кто в Лаодикии, и тех, кто в Иераполе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он тяжело трудится», «он проявляет большую заботу» или «он глубоко страдает». Греческое выражение может обозначать тяжёлый, напряжённый труд, а в данном контексте — также глубокую заботу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ γὰρ αὐτῷ
  choice: Ибо я свидетельствую о нём
  rationale: «Ибо» сохраняет пояснительную связь с предыдущим стихом; дательный αὐτῷ при μαρτυρέω естественно передан как лицо, о котором Павел свидетельствует. Русская формулировка не добавляет модального оттенка «могу засвидетельствовать».
- source_word: ὅτι ἔχει πολὺν πόνον
  choice: что он много трудится
  rationale: Идиоматическая русская передача буквально более именной конструкции «имеет великий/многий труд». Она сохраняет основное значение напряжённого труда, не ограничивая смысл исключительно заботой или душевной мукой.
- source_word: ὑπὲρ ὑμῶν
  choice: ради вас
  rationale: ὑπέρ выражает направленность усилий на благо адресатов; «ради» здесь естественно и яснее сочетается с глаголом «трудится».
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: тех, кто в Лаодикии
  rationale: Субстантивированное сочетание с артиклем обозначает находящихся в Лаодикии людей, по контексту — верующих; слово «верующих» не добавлено, поскольку его нет в исходном тексте.
- source_word: τῶν ἐν Ἱεραπόλει
  choice: тех, кто в Иераполе
  rationale: Сохранена параллельная структура исходного текста; название города передано в принятой русской библейской форме.
theological_decisions:
- issue: Значение πόνος применительно к служению Епафраса
  choice: много трудится
  alternative: испытывает великую заботу; тяжко мучается; несёт великий труд
  rationale: Основное значение πόνος связано с тяжёлым трудом и усилием, тогда как ближайший контекст молитвенной борьбы допускает также оттенок глубокой заботы или мучительного переживания. Основной текст сохраняет широкий смысл труда, а сноска отмечает реальную лексическую неоднозначность.
- issue: Отношение свидетельства Павла к Епафрасу в μαρτυρῶ αὐτῷ
  choice: свидетельствую о нём
  alternative: свидетельствую в его пользу; свидетельствую ему
  rationale: Дательный может пониматься как указание на лицо, о котором или в пользу которого даётся свидетельство. «О нём» естественно по-русски и соответствует контексту личного свидетельства Павла, не усиливая судебно-защитный оттенок.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Синтаксический параллелизм географических групп сохранён; буквальное «имеет великий труд» заменено естественным русским «много трудится». Маркер сноски помещён в основном тексте.
