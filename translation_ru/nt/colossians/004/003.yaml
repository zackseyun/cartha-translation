  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: ru
  text: молясь также и о нас, чтобы Бог открыл нам дверь для слова[a], чтобы мы возвещали тайну Мессии[b], из-за которой я и нахожусь в узах[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дверь слову»; по смыслу также возможно: «возможность возвещать слово».'
    reason: lexical_alternative
  - marker: b
    text: Греч. «тайну Христа»; Χριστός означает «Мессия», то есть «Помазанник».
    reason: alternative_reading
  - marker: c
    text: 'Или: «из-за которой я и скован»; речь идёт о заключении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν
  choice: молясь также и о нас
  rationale: Причастие продолжает наставление предыдущего стиха; «также» естественно передаёт включающее значение ἅμα καὶ без тяжеловесного буквального оборота.
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν
  choice: чтобы Бог открыл нам
  rationale: Оборот с ἵνα выражает содержание и цель молитвы; русский союз «чтобы» сохраняет просительный смысл.
- source_word: θύραν τοῦ λόγου
  choice: дверь для слова
  rationale: Сохранена метафора открытой двери и многозначность λόγος, которое здесь обозначает возвещаемое слово или весть.
- source_word: λαλῆσαι
  choice: возвещать
  rationale: В данном контексте речь идёт о публичном сообщении тайны; «возвещать» звучит по-русски естественнее, чем буквальное «говорить тайну», не превращая глагол в узкотехнический термин.
- source_word: τὸ μυστήριον
  choice: тайну
  rationale: «Тайна» сохраняет характерное для Павла обозначение прежде сокрытого, но ныне открываемого Божьего замысла.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь имеет смысл титула; «Мессия» передаёт значение «Помазанник», а не обращается с титулом как с личным именем.
- source_word: δι’ ὃ καὶ δέδεμαι
  choice: из-за которой я и нахожусь в узах
  rationale: διά с винительным выражает причину, а перфект δέδεμαι — продолжающееся состояние заключения как результат связывания.
theological_decisions:
- issue: Значение Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В сочетании «тайна Мессии» слово сохраняет титульный смысл; вариант «Христа» привычнее церковной традиции, но менее явно передаёт значение греческого титула.
- issue: Образ θύραν τοῦ λόγου
  choice: дверь для слова
  alternative: возможность возвещать слово
  rationale: Основной текст сохраняет образ двери и не сводит его к одному истолкованию — возможности, доступу или свободному пути для вести.
- issue: Референт δι’ ὃ
  choice: из-за которой
  alternative: за которую
  rationale: Местоимение естественно соотносится с ближайшим существительным «тайна»; причинное «из-за» непосредственно передаёт διά с винительным, не уточняя сверх текста обстоятельства заключения.
translation_notes:
  register: Современный литературный русский с достойным апостольским регистром. Синтаксис сохраняет связь с предыдущим стихом через деепричастие «молясь». Тире помогает естественно присоединить цель открытой двери. Конечная запятая сохранена, поскольку греческий текст и ссылка представляют часть продолжающегося предложения.
