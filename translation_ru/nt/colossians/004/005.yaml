lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: мудро
  rationale: Творительный по смыслу наречный оборот естественно передаёт образ действия; существительное σοφία здесь обозначает практическую мудрость в поведении.
- source_word: περιπατεῖτε
  choice: поступайте
  rationale: Глагол употреблён метафорически в значении образа жизни и поведения. «Поступайте» ясно и естественно передаёт эту мысль по-русски, не создавая неуместного образа физической ходьбы.
- source_word: πρὸς τοὺς ἔξω
  choice: с теми, кто вне общины
  rationale: πρός указывает, как верующие должны вести себя по отношению к другим людям; οἱ ἔξω — устойчивое обозначение находящихся вне верующей общины. «С теми» естественно выражает отношения и взаимодействие, а пояснение «вне общины» сохраняет пространственную метафору оригинала.
- source_word: τὸν καιρόν
  choice: каждую возможность
  rationale: καιρός здесь означает подходящий момент или благоприятную возможность, а не время как отвлечённое понятие. Слово «каждую» идиоматично передаёт полноту использования таких случаев, выраженную сочетанием с ἐξαγοραζόμενοι.
- source_word: ἐξαγοραζόμενοι
  choice: используя
  rationale: В данном сочетании причастие означает полностью пользоваться благоприятным случаем. «Используя каждую возможность» ясно передаёт идиоматический смысл; буквальный торговый образ отмечен в сноске.
theological_decisions:
- issue: Возможное богословское переосмысление ἐξαγοραζόμενοι как указания на искупление
  choice: Призыв мудро использовать возможности в отношениях с неверующими
  alternative: Буквальное «выкупая время», способное вызвать ассоциацию с доктриной искупления
  rationale: В этом контексте глагол образно говорит о полном использовании благоприятного времени, а не об искуплении от греха. Перевод не вносит отсутствующего в стихе догматического утверждения.
- issue: Кого обозначает τοὺς ἔξω
  choice: Людей вне верующей общины
  alternative: Чужих или посторонних вообще
  rationale: В раннехристианском употреблении выражение обозначает не принадлежащих к общине верующих. Формулировка и сноска поясняют социально-религиозное разграничение, не добавляя оценки этих людей.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Инверсия выносит отношения с людьми вне общины в тематическую позицию, следуя смысловому строю греческой фразы. Метафора хождения передана естественным русским глаголом «поступайте», а буквальная торговая метафора второго оборота сохранена в сноске.
