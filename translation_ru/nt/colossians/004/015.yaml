base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: ru
  text: Передайте привет братьям в Лаодикии, Нимфе[a] и церкви, собирающейся у неё дома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «Нимфасу и церкви, собирающейся у него дома»; в других: «Нимфе и церкви, собирающейся у них дома».'
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: Приветствуйте
  rationale: Аорист, медиальный императив второго лица множественного числа; обычное повеление передать приветствие. «Приветствуйте» естественно и прямо сохраняет побудительную силу.
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: братьев в Лаодикии
  rationale: Существительное ἀδελφούς грамматически стоит в мужском роде и множественном числе; у Павла оно нередко охватывает всю общину верующих. Русское «братьев» сохраняет форму исходного текста и традиционно может употребляться собирательно.
- source_word: Νύμφαν
  choice: Нимфу
  rationale: В тексте SBLGNT стоит винительный падеж Νύμφαν, наиболее прямо понимаемый как женское имя Нимфа. Иные рукописные чтения отражены в сноске.
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: церковь в её доме
  rationale: Оборот κατ’ οἶκον в данном контексте обозначает общину, собиравшуюся в доме; буквальное и естественное русское выражение «церковь в её доме» сохраняет локативный смысл без лишнего пояснения.
- source_word: ἐκκλησίαν
  choice: церковь
  rationale: В посланиях Павла ἐκκλησία обозначает христианскую общину. «Церковь» — стандартный и уместный в контексте русский эквивалент.
theological_decisions:
- issue: Личность и пол Νύμφαν, а также соответствующее местоимение
  choice: Нимфу… церковь в её доме
  alternative: Нимфаса… церковь в его доме; либо церковь в их доме
  rationale: Печатный текст SBLGNT содержит αὐτῆς («её») и поддерживает понимание Νύμφαν как женского имени. Поскольку в рукописной традиции имеются варианты с мужским и множественным местоимением, они документированы в сноске, а основной текст следует указанному критическому изданию.
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Синтаксис близок к греческому, но естественен по-русски; «а также» ясно связывает вторую группу адресатов приветствия.
