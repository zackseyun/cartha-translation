- from: Приветствуйте братьев в Лаодикии, а также Нимфу и церковь в её доме.[a]
  to: Передайте привет братьям в Лаодикии, Нимфе[a] и церкви, собирающейся у неё дома.
  rationale: Главный текст сохраняет женское единственное чтение SBLGNT («Нимфе… у неё дома»), а сноска честно отмечает мужское и множественное варианты. Изменения делают эпистолярную формулу и обозначение домашней общины более естественными для современного литературного русского, не изменяя смысла.
