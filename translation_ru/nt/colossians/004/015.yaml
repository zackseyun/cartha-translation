review_pass:
  verdict: revise
  source_fidelity: Основной текст верно передаёт повеление ἀσπάσασθε, адресатов приветствия, женское чтение Νύμφαν и притяжательное αὐτῆς критического текста SBLGNT. «Церковь в её доме» в целом возможно, однако менее ясно выражает значение κατ’ οἶκον как домашнего собрания общины.
  naturalness: «Приветствуйте» допустимо, но в эпистолярном русском более естественно «Передайте привет». Формулировка «церковь, собирающуюся у неё дома» естественна и ясно обозначает общину, а не здание или учреждение, находящееся в доме.
  terminology: «Братьям», «Лаодикии», «Нимфе» и «церкви» уместны. Сноску следует привязать непосредственно к имени, поскольку варианты затрагивают как имя/род, так и последующее местоимение. Во втором варианте следует повторить имя, чтобы не создавать впечатления, будто меняется только местоимение.
  issues:
  - severity: low
    issue: Недостаточно конкретная передача κατ’ οἶκον
    rationale: Оборот «церковь в её доме» может быть понят как церковь, расположенная в доме, тогда как в контексте Павла речь о собрании общины в доме. Добавление «собирающуюся» уточняет смысл без существенной интерпретационной надстройки.
  - severity: low
    issue: Расположение и формулировка сноски о текстовом варианте
    rationale: Сноска поставлена после всей фразы, хотя вариант начинается с имени Нимфы. Во второй приведённой альтернативе лучше повторить имя, поскольку чтение «в их доме» относится к той же синтаксической группе и не должно выглядеть как изолированная замена местоимения.
  revised_text: Передайте привет братьям в Лаодикии, Нимфе[a] и церкви, собирающейся у неё дома.
