lexical_decisions:
- source_word: ἵνα
  choice: чтобы
  rationale: Естественно вводит цель и сохраняет целевое значение греческого союза.
- source_word: φανερώσω
  choice: ясно раскрыл
  rationale: Передаёт значение «явить, сделать известным»; наречие «ясно» уместно отражает в контексте понятное раскрытие тайны, не сводя глагол только к разъяснению.
- source_word: αὐτὸ
  choice: её
  rationale: Местоимение сохраняется и согласуется с подразумеваемым словом «тайна» из предыдущего стиха.
- source_word: ὡς
  choice: как
  rationale: 'Вводит образ действия или норму: говорить так, как надлежит.'
- source_word: δεῖ
  choice: должен
  rationale: Естественно передаёт необходимость или обязанность, выраженную безличным δεῖ.
- source_word: με
  choice: я
  rationale: Греческое με является логическим субъектом инфинитива после δεῖ; по-русски требуется личная конструкция «я должен».
- source_word: λαλῆσαι
  choice: говорить
  rationale: Широкий и прямой эквивалент; «возвещать» было бы контекстуально возможно, но несколько конкретизировало бы глагол.
