  text: Неустанно молитесь, бодрствуя в молитве с благодарностью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будьте постоянны в молитве, бодрствуя в ней с благодарностью».'
    reason: 'Лексическая альтернатива: προσκαρτερεῖτε может быть передано прямым призывом проявлять постоянство и стойкость в молитве.'
lexical_decisions:
- source_word: Τῇ προσευχῇ
  choice: молитесь / в молитве
  rationale: Сочетание артикля с дательным падежом обозначает молитву как постоянную практику, а не одну определённую молитву. Русская глагольная конструкция естественно передаёт смысл.
- source_word: προσκαρτερεῖτε
  choice: неустанно
  rationale: Форма настоящего времени в повелительном наклонении призывает к постоянству и упорству. В сочетании «неустанно молитесь» этот смысл передан кратко и естественно.
- source_word: γρηγοροῦντες
  choice: бодрствуя
  rationale: 'Причастие описывает, как следует пребывать в молитве: сохраняя духовную бдительность. «Бодрствуя» удерживает образ греческого слова, не сводя его лишь к физическому отсутствию сна.'
- source_word: ἐν αὐτῇ
  choice: в молитве
  rationale: Местоимение женского рода естественно относится к προσευχή, «молитве». Повтор существительного по-русски яснее, чем буквальное «в ней».
- source_word: ἐν εὐχαριστίᾳ
  choice: с благодарностью
  rationale: Оборот выражает сопровождающее молитву расположение духа; «с благодарностью» естественно передаёт этот смысл.
