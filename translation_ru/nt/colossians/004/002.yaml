  source_fidelity: «Неустанно молитесь» точно передаёт продолжающийся повелительный характер προσκαρτερεῖτε и связь с молитвой. «Бодрствуя в молитве» адекватно отражает γρηγοροῦντες ἐν αὐτῇ, а «с благодарностью» — ἐν εὐχαριστίᾳ. Перевод не устраняет и не добавляет смысловых ограничений.
