  text: ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/014.yaml
  text: Luke, the beloved physician, and Demas greet you.
translation:
  language: ru
  text: Приветствуют вас Лука, любимый врач, и Димас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάζεται
  choice: приветствуют
  rationale: 'Эпистолярная формула передачи привета. Хотя в греческом стоит глагол в единственном числе перед составным подлежащим, в современном русском естественно согласование во множественном числе: Лука и Димас приветствуют адресатов.'
- source_word: ὑμᾶς
  choice: вас
  rationale: Местоимение второго лица множественного числа обращено ко всей общине; русское «вас» точно передаёт число и падежную функцию.
- source_word: Λουκᾶς
  choice: Лука
  rationale: Традиционная и общеупотребительная русская форма имени.
- source_word: ἰατρὸς
  choice: врач
  rationale: Современное, точное и стилистически нейтральное соответствие греческому ἰατρός; понятнее обычному читателю, чем устаревающее «лекарь».
- source_word: ἀγαπητὸς
  choice: любимый
  rationale: Передаёт тёплую характеристику ἀγαπητός и сохраняет более сильный оттенок привязанности, чем «дорогой».
- source_word: καὶ
  choice: и
  rationale: Простой соединительный союз, связывающий Луку и Димаса как передающих привет.
- source_word: Δημᾶς
  choice: Димас
  rationale: Традиционная русская библейская форма имени, соответствующая греческому Δημᾶς.
theological_decisions:
- issue: К кому относится определение ὁ ἀγαπητός («любимый»)
  choice: «любимый» относится только к Луке и вместе со словом «врач» характеризует его
  alternative: Понять характеристику как относящуюся также к Димасу
  rationale: Греческая конструкция Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητός представляет оба определения как приложение к имени Лука; Димас присоединён затем союзом καί.
translation_notes:
  register: Современный литературный русский язык с естественной эпистолярной формулой. Начальная позиция сказуемого сохраняет движение греческой фразы, а запятые ясно показывают, что «любимый врач» — характеристика Луки.
