source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: ru
  text: Вас приветствует Епафрас, один из вас, раб Мессии[a]. Он всегда борется за вас в своих молитвах, чтобы вы твёрдо стояли, зрелые и вполне убеждённые во всей воле Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционная передача: «Христа». Греческое Χριστός — титул со значением «Помазанник», то есть «Мессия».'
    reason: Передача титула и традиционная лексическая альтернатива.
  - marker: b
    text: 'Или: «полностью утвердившимися». Греческое слово может указывать как на полную убеждённость, так и на состояние полной утверждённости.'
    reason: Сохранение значимой лексической неоднозначности.
lexical_decisions:
- source_word: ἀσπάζεται
  choice: приветствует
  rationale: Обычное эпистолярное значение глагола; краткая и естественная передача личного приветствия.
- source_word: ὁ ἐξ ὑμῶν
  choice: один из вас
  rationale: Естественно передаёт принадлежность Епафраса к колосской общине.
- source_word: δοῦλος
  choice: раб
  rationale: Сохраняет значение полной принадлежности и подчинения; русское «служитель» было бы слабее и менее точно.
- source_word: Χριστοῦ
  choice: Мессии
  rationale: Передаёт Χριστός как титул («Помазанник»), не добавляя отсутствующее в данном греческом тексте имя Иисуса.
- source_word: πάντοτε ἀγωνιζόμενος
  choice: всегда борется
  rationale: Сохраняет значение постоянного напряжённого усилия и образ борьбы, не уточняя его сверх текста.
- source_word: ἐν ταῖς προσευχαῖς
  choice: в своих молитвах
  rationale: Естественная русская передача множественного числа с ясным указанием на молитвы Епафраса.
- source_word: ἵνα σταθῆτε
  choice: чтобы вы стояли
  rationale: Сохраняет образ стояния и не вводит прямо отсутствующее наречие «твёрдо»; некоторая необычность синтаксиса оправдана связью с последующими предикативными определениями.
- source_word: τέλειοι
  choice: зрелыми
  rationale: В данном контексте обозначает достигнутую цельность и духовную зрелость, а не безгрешное совершенство.
- source_word: πεπληροφορημένοι
  choice: вполне убеждёнными
  rationale: Передаёт состояние полной уверенности; возможный оттенок полной утверждённости сохранён в примечании.
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: во всей воле Бога
  rationale: 'Формальная передача сохраняет неоднозначность отношения к Божьей воле: речь может идти о её полноте, сфере или соответствии ей.'
theological_decisions:
- issue: Передача Χριστοῦ в выражении δοῦλος Χριστοῦ
  choice: раб Мессии
  alternative: раб Христа
  rationale: «Мессия» раскрывает значение греческого титула Χριστός, тогда как традиционная форма «Христос» указана в примечании. Имя «Иисус» не добавлено, поскольку его нет в представленном основном тексте SBLGNT.
- issue: Передача δοῦλος
  choice: раб
  alternative: слуга / служитель
  rationale: В формуле принадлежности Мессии слово обозначает не просто исполнение служения, но полную зависимость и верность; «раб» сохраняет эту силу.
- issue: Значение πεπληροφορημένοι
  choice: вполне убеждёнными
  alternative: полностью утвердившимися
  rationale: Основной текст отражает распространённое значение полной убеждённости, а примечание сохраняет возможное статическое значение утверждённости.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Порядок первого предложения сделан естественным для русского. Более формальное выражение «стояли зрелыми… во всей воле Бога» намеренно сохраняет синтаксис и смысловую широту греческого текста, не сводя их к одному толкованию.
