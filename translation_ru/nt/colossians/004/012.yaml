  to: Вас приветствует Епафрас, один из вас, раб Мессии[a]. Он всегда борется за вас в своих молитвах, чтобы вы твёрдо стояли, зрелые и вполне убеждённые во всей воле Бога[b].
  rationale: Добавлено «твёрдо» как естественный русский способ передать образ «стоять» в целевой конструкции; запятая после «стояли» делает «зрелые и вполне убеждённые» ясными именными характеристиками. Смысл, терминология и обе примечательные неоднозначности сохранены.
