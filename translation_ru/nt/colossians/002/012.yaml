  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: ru
  text: Будучи погребены с Ним в крещении[a], в котором вы также были воскрешены вместе с Ним через веру[b] в действие Бога, воскресившего Его из мёртвых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «в Нём», если относительное местоимение относится не к крещению, а ко Христу.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «через доверие». Греческое слово в некоторых контекстах может означать также «верность», но здесь основным переводом выбрано слово «вера».'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνταφέντες
  choice: погребённые с Ним
  rationale: Аористное страдательное причастие во множественном числе сохраняется как причастие; приставка συν- передана словами «с Ним», выражающими совместность и единение.
- source_word: ἐν τῷ βαπτισμῷ
  choice: в крещении
  rationale: Предлог ἐν передан естественным русским «в», не сужая возможный местный или инструментальный оттенок.
- source_word: ἐν ᾧ
  choice: в котором
  rationale: Ближайший грамматический антецедент — «крещение»; форма среднего рода в русском ясно выражает это прочтение. Возможная отсылка ко Христу отмечена в сноске.
- source_word: συνηγέρθητε
  choice: вы были и воскрешены с Ним
  rationale: Страдательная форма и значение приставки συν- переданы явно; частица «и» соответствует καί и связывает воскресение с предшествующим погребением.
- source_word: διὰ τῆς πίστεως
  choice: через веру
  rationale: Передаёт средство или путь участия; «вера» является основным и наиболее естественным соответствием πίστις в данном контексте.
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: в действие Бога
  rationale: Зависимость от «веры» естественно выражена конструкцией «вера в»; ἐνέργεια обозначает деятельную, действенную работу Бога, а «действие» не сводит её к отвлечённой силе.
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: воскресившего Его из мёртвых
  rationale: Причастный оборот сохраняет определительное описание Бога; «из мёртвых» — устойчивое и точное русское выражение воскресения.
theological_decisions:
- issue: К чему относится ἐν ᾧ
  choice: 'К крещению: «в котором»'
  alternative: 'К Мессии/Христу: «в Котором»'
  rationale: Ближайший антецедент — βαπτισμῷ, и синтаксис прежде всего поддерживает эту связь; менее вероятное христологическое прочтение сохранено в сноске.
- issue: Смысл связи крещения, веры и воскресения со Христом
  choice: Сохранена тесная связь погребения и воскресения со Христом, крещения и веры без уточнения механизма этой связи
  alternative: Истолковать формулировку либо строго сакраментально, либо исключительно символически
  rationale: Греческий текст выражает сильную связь этих понятий, но сам по себе не разрешает позднейшие конфессиональные споры; перевод не добавляет такой интерпретации.
- issue: Объект веры в конструкции πίστεως τῆς ἐνεργείας τοῦ θεοῦ
  choice: «через веру в действие Бога»
  alternative: «через веру, произведённую действием Бога» или «через верность действия Бога»
  rationale: Контекст и обычное употребление лучше поддерживают понимание Божьего действия как объекта веры, при этом формулировка не подменяет действие Бога отвлечённым понятием силы.
translation_notes:
  register: Современный литературный русский язык с сохранением причастной структуры оригинала. Формулировка звучит возвышенно, но остаётся понятной; традиционные выражения «в крещении» и «из мёртвых» сохранены. Заглавные буквы в местоимениях, относящихся ко Христу, соответствуют распространённой русской библейской издательской норме.
