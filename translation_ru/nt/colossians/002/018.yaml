  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: ru
  text: Пусть никто не лишает вас награды, находя удовольствие в смирении и поклонении ангелам[a], погружаясь в то, что он видел[b], безосновательно надмеваясь своим плотским умом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «религии ангелов»; или: «поклонении вместе с ангелами». Греческое выражение допускает разные толкования.'
    reason: alternative_reading
  - marker: b
    text: 'Смысл редкого греческого глагола не вполне ясен; его можно также передать: «подробно останавливаясь на том, что он видел» или «входя в то, что он видел». В некоторых рукописях: «в то, чего он не видел».'
    reason: lexical_and_textual_variant
lexical_decisions:
- source_word: καταβραβευέτω
  choice: лишает вас награды
  rationale: Глагол обозначает неблагоприятное судейское решение, ведущее к утрате награды; такой перевод сохраняет образ состязания яснее, чем более общее «осуждает».
- source_word: θέλων ἐν
  choice: находя удовольствие в
  rationale: В данной конструкции причастие, вероятно, выражает склонность или удовольствие от названных практик, а не простое волеизъявление.
- source_word: ταπεινοφροσύνῃ
  choice: смирении
  rationale: Сохранено обычное значение слова; полемический контекст позволяет услышать оттенок показного или аскетического смирения без внесения этого толкования прямо в текст.
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: поклонении ангелам
  rationale: Основной текст передаёт наиболее естественное понимание родительного падежа как объекта поклонения, а реальные альтернативы отмечены в сноске.
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: погружаясь в то, что он видел
  rationale: Редкий глагол ἐμβατεύω может означать вступать, углубляться или подробно останавливаться на чём-либо. Формулировка сохраняет образность и некоторую неоднозначность.
- source_word: εἰκῇ
  choice: безосновательно
  rationale: Передаёт смысл необоснованности и пустоты надменности.
- source_word: φυσιούμενος
  choice: надмеваясь
  rationale: Естественный литературный русский эквивалент павловской метафоры раздувшейся гордости.
- source_word: ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ
  choice: своим плотским умом
  rationale: Передаёт инструментальную или причинную силу ὑπό и сохраняет связь σάρξ с «плотью», не заменяя её систематизирующим выражением «греховная природа».
theological_decisions:
- issue: Значение θρησκείᾳ τῶν ἀγγέλων
  choice: поклонение, обращённое к ангелам
  alternative: религия ангелов; поклонение вместе с ангелами
  rationale: Греческий генитив допускает несколько синтаксических отношений. В основном тексте принято распространённое объектное понимание, но альтернативы сохранены, чтобы не устранять подлинную неоднозначность.
- issue: Значение σάρξ в νοὸς τῆς σαρκὸς αὐτοῦ
  choice: плотский ум
  alternative: ум его плоти; ум греховной природы
  rationale: Перевод сохраняет павловское понятие плоти и его богословское напряжение, не сводя его заранее к одной доктринальной парафразе.
- issue: Текстологический вариант при ἃ ἑόρακεν
  choice: то, что он видел
  alternative: то, чего он не видел
  rationale: Основной текст следует SBLGNT; значимый вариант с отрицанием указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского предостережения. Сохранены состязательный образ «лишать награды», богословски значимое «плотский» и неоднозначность редкого ἐμβατεύω; громоздкая буквальная конструкция «ум его плоти» естественно передана как «свой плотский ум».
