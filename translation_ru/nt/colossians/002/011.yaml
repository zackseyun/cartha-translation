lexical_decisions:
- source_word: ἐν ᾧ
  choice: В Нём
  rationale: Относительное местоимение относится к Мессии из предшествующего контекста; формулировка сохраняет смысл единения с Ним и естественна по-русски.
- source_word: περιετμήθητε
  choice: вы были обрезаны
  rationale: Аорист пассивного залога передан как завершённое действие над адресатами; образ обрезания сохранён без истолковывающего перифраза.
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: обрезанием нерукотворным
  rationale: Творительный падеж естественно передаёт инструментально-ассоциативный дательный; «нерукотворным» сохраняет библейский контраст с действием человеческих рук.
- source_word: ἐν τῇ ἀπεκδύσει
  choice: совлечением
  rationale: Существительное обозначает снятие, совлечение или полное устранение; «совлечение» сохраняет метафору снятой одежды и связь с последующим контекстом.
- source_word: τοῦ σώματος τῆς σαρκός
  choice: тела плоти
  rationale: Буквально сохраняет трудную генитивную конструкцию и не предрешает, идёт ли речь о физическом теле, существовании во плоти или иной антропологической категории.
- source_word: σαρκός
  choice: плоти
  rationale: Сохраняет многозначный павловский термин и не сужает его до толкования «греховная природа».
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: обрезанием Мессии
  rationale: Творительный падеж согласуется с русским управлением и параллельной конструкцией; родительный «Мессии» намеренно оставлен открытым в отношении субъекта, принадлежности и связи.
theological_decisions:
- issue: Значение выражения «обрезание Мессии»
  choice: 'Сохранён открытый родительный: «обрезанием Мессии»'
  alternative: обрезанием, совершённым Мессией; обрезанием самого Мессии; обрезанием, принадлежащим Мессии
  rationale: Греческое τοῦ Χριστοῦ допускает несколько отношений. Основной текст не выбирает одну богословски нагруженную трактовку.
- issue: Смысл выражения «тело плоти»
  choice: Сохранено буквальное «тела плоти»
  alternative: плотского тела; греховной природы; тела, подвластного плоти
  rationale: Фраза трудна и неоднозначна. Перевод следует тексту SBLGNT и не вносит пояснений из позднейших вариантов или отдельных антропологических толкований.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Нерукотворным» и «совлечением» точны и узнаваемы, хотя менее разговорны; они оправданы плотностью и образностью исходного текста. Тире помогает показать, что последующие обороты раскрывают духовное обрезание, не устраняя их грамматической неоднозначности.
