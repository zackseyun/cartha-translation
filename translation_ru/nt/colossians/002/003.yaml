  text: ἐν ᾧ εἰσιν πάντες οἱ θησαυροὶ τῆς σοφίας ⸀καὶ γνώσεως ἀπόκρυφοι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/003.yaml
  text: in whom are hidden all the treasures of wisdom and knowledge[a][b].
translation:
  language: ru
  text: в Котором сокрыты все сокровища мудрости и знания[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в которой», если относить эти слова шире — к Божьей тайне, а не лично ко Христу.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «хранятся»; греческое прилагательное может указывать как на сокрытое, так и на сбережённое, хранимое в запасе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: в Котором
  rationale: Относительное местоимение в дательном падеже естественнее всего относится к ближайшему личному антецеденту — Христу (2:2). Предлог ἐν передан как «в».
- source_word: πάντες οἱ θησαυροὶ
  choice: все сокровища
  rationale: Артикль с существительным во множественном числе выражает определённую совокупность; перевод сохраняет всеохватность утверждения.
- source_word: τῆς σοφίας καὶ γνώσεως
  choice: мудрости и знания
  rationale: Перевод сохраняет два различных, но связанных понятия и параллельную структуру родительных падежей.
- source_word: ἀπόκρυφοι
  choice: сокрыты
  rationale: «Сокрыты» прямо передаёт значение прилагательного и звучит естественно и достойно в данном контексте, не уточняя сверх текста, идёт ли речь о недоступности или о сбережении.
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: сокрыты
  rationale: Связка с предикативным прилагательным естественно передаётся русской краткой формой без выраженного глагола «быть» в настоящем времени.
theological_decisions:
- issue: Относится ли ἐν ᾧ лично ко Христу или шире — к Божьей тайне
  choice: 'Основной текст: «в Котором», с отнесением ко Христу'
  alternative: «в которой», если антецедентом считать Божью тайну в более широком смысле
  rationale: Ближайший личный антецедент в 2:2 — Христос, однако грамматико-контекстуальная возможность более широкого отнесения сохранена в примечании.
- issue: Означает ли ἀπόκρυφοι эзотерическую тайность или надёжное хранение во Христе
  choice: Нейтральное «сокрыты»
  alternative: «сберегаются» или «хранятся», с акцентом на сохранности и доступности
  rationale: Греческое слово допускает оттенки скрытости и хранения; основной перевод не разрешает эту богословскую напряжённость сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной синтаксической формой. Заглавная буква в «Котором» указывает на личное отнесение ко Христу; подлинная неоднозначность отражена в сноске.
