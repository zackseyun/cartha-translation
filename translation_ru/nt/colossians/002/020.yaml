  source_fidelity: 'Текст точно передаёт греческую конструкцию: условное «Если», аорист «умерли», единение «со Христом», отделение от στοιχεῖα, риторический вопрос и зависимое «словно ... живущие в мире». Оборот «умерли ... для стихий мира» — естественный русский способ выразить освобождение/отделение, подразумеваемое ἀπό в данном контексте, без неоправданного уточнения природы στοιχεῖα.'
