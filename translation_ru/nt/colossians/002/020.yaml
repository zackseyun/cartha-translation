id: COL.2.20
reference: Colossians 2:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: ru
  text: 'Если вы умерли со Христом для стихий мира[a], то почему вы, словно всё ещё живущие в мире, подчиняетесь предписаниям[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для основных начал мира»; возможно также: «для духовных сил мира».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «позволяете навязывать вам предписания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: Если
  rationale: Сохраняет условную форму греческого текста; контекст может предполагать истинность условия, но перевод не превращает её явно в причинное «поскольку».
- source_word: ἀπεθάνετε
  choice: вы умерли
  rationale: Простой прошедший вид естественно передаёт аорист и указывает на решающее событие в единении со Христом.
- source_word: σὺν Χριστῷ
  choice: со Христом
  rationale: В современном русском библейском и литературном употреблении «Христос» естественно сохраняет мессианский титул и узнаваемость выражения.
- source_word: ἀπὸ τῶν στοιχείων τοῦ κόσμου
  choice: для стихий мира
  rationale: 'При глаголе «умереть» русский оборот «умереть для» естественно выражает отделение и освобождение от прежней сферы. «Стихии» сохраняют многозначность στοιχεῖα: первоначала, основные начала или космические силы.'
- source_word: τί
  choice: то почему
  rationale: Передаёт риторический вопрос и естественно связывает его с условным придаточным.
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: словно всё ещё живущие в мире
  rationale: «Словно» передаёт сравнительно-предположительный смысл ὡς; «всё ещё» ясно выражает подразумеваемое противопоставление смерти со Христом продолжающейся жизни по порядкам мира.
- source_word: δογματίζεσθε
  choice: подчиняетесь предписаниям
  rationale: Передаёт практический смысл управления предписаниями и допускаемый формой глагола возвратно-средний оттенок; пассивное понимание отмечено в сноске.
theological_decisions:
- issue: Значение στοιχεῖα в данном контексте
  choice: «стихии мира»
  alternative: «основные начала мира» или «духовные силы мира»
  rationale: Греческое слово допускает как безличное, так и космически-личностное понимание. Традиционно понятное русское «стихии» сохраняет эту напряжённую многозначность, а варианты вынесены в сноску.
- issue: Залог δογματίζεσθε
  choice: «подчиняетесь предписаниям»
  alternative: «позволяете навязывать вам предписания»
  rationale: Форма может пониматься как средняя или пассивная. Основной перевод сохраняет участие адресатов, не исключая внешнего воздействия; пассивная возможность указана в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Формулировка рассчитана на продолжение перечнем предписаний в следующем стихе, поэтому сохранено двоеточие.
