  text: ἅ ἐστιν σκιὰ τῶν μελλόντων, τὸ δὲ σῶμα ⸀τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/017.yaml
  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: ru
  text: Всё это — тень того, что грядёт, а тело принадлежит Мессии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а реальность принадлежит Мессии».'
    reason: 'Лексическая альтернатива: в противопоставлении тени слово «тело» может обозначать подлинную реальность.'
lexical_decisions:
- source_word: ἅ
  choice: Всё это
  rationale: Относительное местоимение среднего рода множественного числа отсылает к перечисленным в предыдущем стихе вопросам пищи, праздника, новомесячия и субботы. В самостоятельной подаче стиха «всё это» естественно сохраняет эту анафорическую связь.
- source_word: σκιὰ
  choice: тень
  rationale: Сохраняется образ тени как предварительного очертания в противопоставлении σῶμα.
- source_word: τῶν μελλόντων
  choice: того, что грядёт
  rationale: Субстантивированное причастие обозначает будущее, не уточняя, идёт ли речь об эсхатологических событиях, мессианском исполнении или обоих аспектах. Формулировка «то, что грядёт» сохраняет эту открытость.
- source_word: δὲ
  choice: а
  rationale: Русский противительный союз «а» естественно передаёт контраст между тенью и телом, не делая его резче, чем в греческом.
- source_word: σῶμα
  choice: тело
  rationale: Выбрано прямое соответствие основному значению σῶμα, чтобы сохранить исходную метафору и её подлинную неоднозначность. Возможное метафорическое понимание как «реальность» вынесено в сноску.
- source_word: τοῦ Χριστοῦ
  choice: принадлежит Мессии
  rationale: Греческий родительный падеж эллиптически выражает принадлежность. Русское «принадлежит Мессии» ясно передаёт эту связь; «Мессия» сохраняет титульный смысл Χριστός.
theological_decisions:
- issue: Значение σῶμα в противопоставлении σκιὰ
  choice: В основном тексте оставлено «тело», с возможностью понять метафору без навязанного толкования.
  alternative: «реальность» или «сущность» как то, чему соответствует тень
  rationale: Противопоставление тени и тела допускает метафорический смысл «подлинная реальность», однако буквальное «тело» точнее сохраняет лексику, образ и возможную богословскую многозначность текста.
- issue: Передача Χριστοῦ
  choice: «Мессии»
  alternative: «Христу» или «Христово»
  rationale: В данном утверждении Χριστός сохраняет значение титула. «Мессия» делает это значение прозрачным и не превращает титул в простое имя.
translation_notes:
  register: Современный литературный русский язык с краткой, dignified формулировкой. «Всё это» обеспечивает понятную связь с предыдущим стихом; образ «тень — тело» сохранён, а поясняющий вариант дан в сноске.
