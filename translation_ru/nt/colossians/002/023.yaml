  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: ru
  text: Всё это лишь кажется мудрым — в самовольном богослужении[a], смирении и суровом обращении с телом, — но не имеет никакой силы против потворства плоти[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самочинного поклонения»; буквально речь идёт о поклонении, избранном по собственной воле.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная часть стиха трудна для понимания. Возможны также переводы: «не оказывая телу никакой чести, они служат насыщению плоти» или «но не имеют никакой ценности в отношении насыщения плоти».'
    reason: alternative_reading
  - marker: c
    text: «Плоть» здесь может означать падшие человеческие желания; слово намеренно сохранено без однозначного истолкования.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: Всё это
  rationale: Отсылает к предписаниям в ст. 21–22 и естественно передаёт собирательную анафорическую силу местоимения.
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: лишь кажется мудрым
  rationale: Идиома выражает видимость или репутацию мудрости, а μέν подготавливает последующее противопоставление; «лишь» ясно передаёт уступительно-иронический оттенок.
- source_word: ἐθελοθρησκίᾳ
  choice: самовольного богослужения
  rationale: Редкое слово обозначает культовую практику, определяемую собственной волей человека; вариант сохраняет религиозный смысл θρησκεία и отрицательный оттенок контекста.
- source_word: ταπεινοφροσύνῃ
  choice: смирения
  rationale: Прямой русский эквивалент сохраняет лексическую форму, не решая сверх текста, искреннее это смирение или показное самоуничижение.
- source_word: ἀφειδίᾳ σώματος
  choice: сурового обращения с телом
  rationale: Передаёт аскетическую беспощадность к телу естественным современным русским выражением.
- source_word: οὐκ ἐν τιμῇ τινι
  choice: не имеет никакой силы
  rationale: В трудной заключительной фразе выражение понято как отрицание действенной ценности этих предписаний; «силы» естественно сочетается с «против» и отражает их неспособность обуздать плоть.
- source_word: πρὸς πλησμονὴν
  choice: против потворства
  rationale: В принятом контекстуальном прочтении πρός указывает на то, чему эти практики должны были бы противодействовать, а πλησμονή — на насыщение или удовлетворение желаний.
- source_word: τῆς σαρκός
  choice: плоти
  rationale: Сохраняет павловский термин и его богословскую многозначность, не подменяя его однозначным толкованием вроде «греховной природы».
theological_decisions:
- issue: Смысл οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός
  choice: Аскетические предписания не способны противостоять потворству плоти.
  alternative: Они не оказывают телу никакой чести и служат насыщению плоти; либо они лишены чести в отношении насыщения плоти.
  rationale: 'Греческая конструкция сжата и допускает несколько синтаксических связей. Основной текст следует наиболее связному в контексте пониманию: предписания выглядят мудрыми, но бессильны обуздать плотские желания. Подлинная неоднозначность отмечена в сноске.'
- issue: Значение σάρξ
  choice: Сохранить «плоть».
  alternative: Передать толковательно как «греховные желания» или «греховная природа».
  rationale: В данном контексте слово, вероятно, относится к падшим человеческим влечениям, однако буквальный термин сохраняет напряжение между телесностью и нравственно-богословским употреблением у Павла.
translation_notes:
  register: Современный литературный русский язык с достойным библейским регистром. Синтаксис сделан ясным для обычного читателя, но редкий термин ἐθελοθρησκία и спорная заключительная фраза не сглажены; альтернативы вынесены в сноски. Все маркеры сносок присутствуют в основном тексте.
