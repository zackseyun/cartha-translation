base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: ru
  text: всё это обречено на уничтожение при употреблении[a] — по заповедям и учениям человеческим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё это уничтожается при употреблении». Греческое выражение может подчёркивать, что такие вещи расходуются и потому временны.'
    reason: lexical_alternative
  - marker: b
    text: Слова «по заповедям и учениям человеческим», вероятно, перекликаются с Ис 29:13 и подчёркивают человеческое происхождение этих предписаний.
    reason: cross_reference
lexical_decisions:
- source_word: ἅ ἐστιν πάντα
  choice: всё это
  rationale: Оборот указывает на предметы, которых касаются запреты предыдущего стиха; естественное русское выражение сохраняет собирательный смысл среднего рода множественного числа.
- source_word: εἰς φθοράν
  choice: уничтожается
  rationale: φθορά обозначает гибель, разрушение или уничтожение; в контексте употребляемых вещей речь идёт об их исчезновении в процессе использования.
- source_word: τῇ ἀποχρήσει
  choice: при употреблении
  rationale: ἀπόχρησις означает использование вплоть до израсходования; предложная конструкция естественно передаёт обстоятельственный смысл дательного падежа, не сужая его до одного лишь потребления в пищу.
- source_word: κατὰ
  choice: по
  rationale: Кратко и естественно вводит норму или основание, которому соответствуют предписания.
- source_word: ἐντάλματα
  choice: заповедям
  rationale: Сохраняет нормативный характер слова и вероятное созвучие с Ис 29:13 в греческой традиции.
- source_word: διδασκαλίας
  choice: учениям
  rationale: Передаёт содержание наставлений без более позднего узкотехнического оттенка слова «доктрины».
- source_word: τῶν ἀνθρώπων
  choice: человеческим
  rationale: Передаёт источник этих предписаний и естественно подчёркивает противопоставление человеческого Божественному, не ограничивая значение только мужчинами.
theological_decisions:
- issue: 'К чему относится критика: к предметам запретов или к самим установлениям'
  choice: Первая часть описывает преходящие предметы, а заключение связывает правила с человеческими заповедями и учениями.
  alternative: Можно понять фразу как более резкое обесценивание самих правил, поскольку они касаются вещей, исчезающих при употреблении.
  rationale: Грамматика прежде всего относит ἅ к предметам из предыдущего стиха, однако сжатая конструкция сохраняет направленную на установления полемическую силу и не устраняет смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской лексикой. Тире помогает показать пояснительно-оценочный поворот фразы. Слово «человеческим» здесь обозначает человеческое, а не Божье происхождение предписаний.
