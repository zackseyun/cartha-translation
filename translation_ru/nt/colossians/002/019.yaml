  source_fidelity: 'Основной образ и синтаксические связи переданы верно: «Глава» является источником для всего тела; πᾶν τὸ σῶμα, διά τῶν ἁφῶν καὶ συνδέσμων и αὔξει τὴν αὔξησιν τοῦ θεοῦ отражены без смысловых потерь. Однако «не держится Главы» в современном русском не вполне естественно и не выражает явного направления, присущего κρατῶν с прямым дополнением в этой метафоре. «Скрепляясь» ослабляет пассивный смысл обоих греческих причастий: тело получает снабжение и приводится к связности, а не совершает эти действия само.'
