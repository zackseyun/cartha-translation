base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: ru
  text: и не держится за Главу[a], от которой всё тело, снабжаемое и скрепляемое посредством суставов и связок[b], растёт ростом Божьим[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не держится крепко за Главу»; также возможно: «не остаётся привязанным к Главе».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «получая питание и соединяясь посредством суставов и связок».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «растёт ростом Бога». Вероятнее всего, имеется в виду рост, который исходит от Бога или который даёт Бог.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατῶν
  choice: держится
  rationale: Глагол передаёт не просто прикосновение, а прочную, сохраняемую связь; русское «держаться кого-либо» естественно выражает верность и приверженность.
- source_word: κεφαλήν
  choice: Главы
  rationale: Сохраняется телесная метафора; прописная буква указывает на Христа как на Главу тела, не добавляя нового смысла.
- source_word: ἐξ οὗ
  choice: от которой
  rationale: Местоимение мужского рода в греческом согласуется с κεφαλήν; в русском грамматический род слова «Глава» женский, поэтому требуется «от которой». Предлог «от» сохраняет значение источника.
- source_word: πᾶν τὸ σῶμα
  choice: всё тело
  rationale: Естественное русское обозначение тела как единого целого.
- source_word: διὰ τῶν ἁφῶν καὶ συνδέσμων
  choice: посредством суставов и связок
  rationale: Передаёт анатомический образ точек соединения и скрепляющих частей; «посредством» точно отражает διά с родительным падежом.
- source_word: ἐπιχορηγούμενον
  choice: получая питание
  rationale: В контексте живого тела значение снабжения естественно включает питание; конструкция сохраняет пассивную направленность — тело получает необходимое извне.
- source_word: συμβιβαζόμενον
  choice: скрепляясь
  rationale: Передаёт соединение частей в одно согласованное целое и хорошо сочетается с образом связок.
- source_word: αὔξει
  choice: растёт
  rationale: Продолжает образ живого тела и является наиболее естественным русским эквивалентом.
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: ростом Божьим
  rationale: Близко воспроизводит необычную греческую конструкцию и сохраняет неоднозначность генитива; примечание разъясняет наиболее вероятный смысл источника роста.
theological_decisions:
- issue: Референт κεφαλήν
  choice: «Глава» с прописной буквы как указание на Христа
  alternative: «глава» со строчной буквы
  rationale: Контекст Послания к колоссянам отождествляет Главу тела с Христом; прописная буква делает референт ясным, не заменяя метафору толкованием.
- issue: Значение родительного падежа в τὴν αὔξησιν τοῦ θεοῦ
  choice: Сохранить формально неоднозначное «ростом Божьим» и пояснить вероятное значение в примечании
  alternative: «растёт благодаря Богу» или «растёт ростом, который даёт Бог»
  rationale: Генитив, вероятнее всего, обозначает источник или качество роста, но буквальная конструкция допускает некоторую смысловую напряжённость. Основной текст её сохраняет, а примечание предотвращает ошибочное понимание, будто растёт Сам Бог.
translation_notes:
  register: Современный литературный русский с достоинством апостольского наставления. Синтаксис сохраняет единую развёрнутую телесную метафору; необычное «ростом Божьим» намеренно оставлено как формально близкое и богословски не переуточнённое выражение.
