  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Передаёт причинную связь с предшествующим предостережением; в русском контексте союз «потому что» естественно выражает основание сказанного.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Прямо передаёт местное значение выражения и его отнесённость ко Христу, не добавляя отсутствующего в греческом значения исключительности.
- source_word: κατοικεῖ
  choice: обитает
  rationale: Сохраняет значение постоянного, укоренённого пребывания и возвышенный, но понятный современному читателю регистр.
- source_word: πᾶν τὸ πλήρωμα
  choice: вся полнота
  rationale: Идиоматично передаёт совокупное значение πᾶν с определённым πλήρωμα и подчёркивает полноту без утраты краткости.
- source_word: τῆς θεότητος
  choice: Божества
  rationale: Передаёт сильное значение θεότης — сущность и состояние бытия Богом, а не только божественные свойства или неопределённую божественность.
- source_word: σωματικῶς
  choice: телесно
  rationale: Наиболее прямо и кратко передаёт наречие, сохраняя возможный объём его христологического смысла без поясняющего сужения до формулировок «в теле» или «в телесном виде».
theological_decisions:
- issue: Христологическая сила сочетания θεότης и σωματικῶς
  choice: Сохранено утверждение, что вся полнота Божества обитает во Христе телесно.
  alternative: Ослабить смысл до присутствия во Христе божественных качеств или Божьего присутствия.
  rationale: θεότης обозначает Божество, а не просто божественные свойства; σωματικῶς придаёт утверждению телесный характер. Перевод сохраняет высокое христологическое утверждение греческого текста, не уточняя сверх текста способ этого обитания.
translation_notes:
  register: Современный литературный русский язык с достоинством и краткостью оригинала. Местоимение «Нём» написано с прописной буквы как устойчивая русская библейская норма при отнесении ко Христу; порядок слов сохраняет акцент на телесном обитании всей полноты Божества.
