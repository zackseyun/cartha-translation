lexical_decisions:
- source_word: Θέλω γὰρ
  choice: Ибо я хочу
  rationale: γάρ связывает стих с предшествующим рассуждением и естественно передаётся словом «ибо»; θέλω выражено прямым и современным «хочу».
- source_word: ὑμᾶς εἰδέναι
  choice: чтобы вы знали
  rationale: Инфинитивная конструкция после θέλω по-русски естественно передаётся придаточным предложением с «чтобы».
- source_word: ἡλίκον ἀγῶνα
  choice: сколь великую борьбу
  rationale: ἡλίκον подчёркивает величину и напряжённость, а ἀγών здесь означает тяжёлую борьбу или усилие, а не буквальное состязание.
- source_word: ἔχω ὑπὲρ ὑμῶν
  choice: я веду ради вас
  rationale: Буквальное «имею борьбу» по-русски неестественно; «веду борьбу» сохраняет образ, а «ради вас» передаёт действие в интересах адресатов.
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: тех, кто в Лаодикии
  rationale: Артикль с предложным оборотом употреблён субстантивно и обозначает находящихся в Лаодикии людей.
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: всех, кто не видел
  rationale: «Всех» сохраняет широкий, включающий смысл ὅσοι; русское прошедшее время естественно передаёт результативный смысл греческого перфекта в данном контексте.
- source_word: τὸ πρόσωπόν μου
  choice: моего лица
  rationale: Сохранён конкретный образ греческого текста без замены более толковательным «меня лично».
- source_word: ἐν σαρκί
  choice: во плоти
  rationale: Фраза буквально указывает на физическое, телесное присутствие. Основной текст сохраняет формулировку источника, а сноска поясняет её смысл.
theological_decisions:
- issue: Передача σάρξ в неметафорическом контексте
  choice: во плоти
  alternative: лично; в телесном облике
  rationale: Здесь σάρξ не обозначает греховную природу, а относится к физическому присутствию Павла. Буквальная передача сохраняет лексику и образ исходного текста, не вводя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Оборот «сколь великую» сохраняет риторическую силу оригинала, а повтор «ради» ясно показывает, к кому относится борьба Павла.
