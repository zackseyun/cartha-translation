    text: «Необрезанность вашей плоти» прежде всего означает телесную необрезанность, но в этом контексте имеет и духовное значение.
    reason: cultural_note
  - marker: b
    text: 'В греческом тексте происходит переход от «вас» к «нам»: «простив нам все прегрешения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: мёртвых
  rationale: Русское согласованное определение естественно передаёт причастную конструкцию и сохраняет состояние духовной смерти.
- source_word: ἐν τοῖς παραπτώμασιν
  choice: из-за ваших проступков
  rationale: В данном сочетании ἐν допускает причинное понимание; оно ясно связывает смерть с проступками. Слово «проступки» передаёт παράπτωμα без излишне узкой конфессиональной окраски.
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: необрезанности вашей плоти
  rationale: Сохраняет конкретный телесный образ и его возможный духовный смысл, не подменяя σάρξ выражением «греховная природа».
- source_word: συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ
  choice: Он оживил вместе с Ним
  rationale: Передаёт совместность, выраженную и сложным глаголом, и σύν; местоимение сохраняется, как в греческом тексте.
- source_word: χαρισάμενος
  choice: простив
  rationale: Деепричастие естественно связывает прощение с главным действием; контекстуальное значение χαρίζομαι — даровать прощение.
- source_word: ἡμῖν πάντα τὰ παραπτώματα
  choice: нам все проступки
  rationale: Сохраняет значимую смену лица с «вас/ваших» на «нам» и повтор того же существительного παράπτωμα.
theological_decisions:
- issue: Значение σάρξ в τῆς σαρκὸς ὑμῶν
  choice: буквальное «плоть» с возможным духовным подтекстом
  alternative: «греховная природа»
  rationale: В ближайшем контексте речь об обрезании, поэтому телесный смысл первичен; метафорический перевод неоправданно снял бы напряжение образа.
- issue: Референт αὐτῷ
  choice: сохранить местоимение «с Ним»
  alternative: эксплицировать «со Христом»
  rationale: Контекст 2:12 указывает на Христа, однако греческий текст использует местоимение; его сохранение не вносит лишней экспликации.
- issue: Смена ὑμᾶς/ὑμῶν на ἡμῖν
  choice: сохранить переход от «вас» к «нам»
  alternative: гармонизировать как «вам»
  rationale: Смена грамматического лица присутствует в исходном тексте и может обозначать расширение мысли до сообщества верующих; её не следует устранять.
translation_notes:
  register: Современный литературный русский язык, сдержанный и торжественный без архаизмов. Заглавные буквы в местоимениях «Он/Ним» помогают прояснить божественного референта, не заменяя его именем. Порядок фразы сохраняет вынесенное вперёд «И вас» и последующее главное действие.
