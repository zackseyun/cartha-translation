base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/013.yaml
  text: And you[a], being dead in your trespasses and the uncircumcision of your flesh, he made alive together with him, having forgiven us all our trespasses[c][b],
translation:
  language: ru
  text: И вас, мёртвых в ваших прегрешениях и в необрезанности вашей плоти[a], Он оживил вместе с Ним, простив нам все прегрешения[b].
  philosophy: optimal-equivalence
  footnotes:
