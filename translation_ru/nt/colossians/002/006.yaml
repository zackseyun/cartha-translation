id: COL.2.6
reference: Colossians 2:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: ru
  text: Итак, как вы приняли Мессию[a] Иисуса — Господа, так и живите в Нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христа Иисуса».'
    reason: Традиционная передача Χριστός транслитерацией вместо смыслового перевода титула.
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Итак, как … так и
  rationale: '«Итак» передаёт выводное значение οὖν, а соотносительная конструкция «как … так и» естественно выражает сравнение, вводимое ὡς: дальнейшая жизнь должна соответствовать тому, как верующие приняли Иисуса.'
- source_word: παρελάβετε
  choice: вы приняли
  rationale: Глагол обозначает состоявшееся принятие переданного учения и самого возвещённого Господа; «приняли» сохраняет эту смысловую широту без лишнего уточнения.
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: Мессию Иисуса
  rationale: Χριστός здесь сохраняет значение титула; «Мессия» передаёт его смысл, тогда как «Иисус» остаётся именем. Более привычный вариант «Христа Иисуса» дан в сноске.
- source_word: τὸν κύριον
  choice: Господа
  rationale: Слово передано как утвердившийся новозаветный титул. Тире ясно оформляет приложение в современном русском и не добавляет значения «как Господа», которого греческая конструкция прямо не выражает.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Краткая формулировка сохраняет многозначность Павлова языка пребывания и жизни во Христе, не сводя её к пояснительному «в единении с Ним».
- source_word: περιπατεῖτε
  choice: живите
  rationale: Настоящее повелительное выражает продолжающийся образ жизни. В современном русском «живите» естественно передаёт метафорическое значение περιπατεῖτε; буквальное «ходите в Нём» звучит архаично и менее понятно.
theological_decisions:
- issue: Передача Χριστός в титульной последовательности
  choice: Мессию Иисуса
  alternative: Христа Иисуса
  rationale: Артикль и приложение допускают понимание Χριστός как титула. Основной текст раскрывает значение титула, а традиционная форма сохранена в сноске.
- issue: Богословски насыщенное выражение ἐν αὐτῷ
  choice: в Нём
  alternative: в единении с Ним
  rationale: Буквенно компактный вариант сохраняет как идею принадлежности Христу, так и идею пребывания в Нём, не разрешая заложенную в греческом смысловую напряжённость.
- issue: Метафора περιπατεῖτε
  choice: живите
  alternative: ходите
  rationale: 'Выбран естественный русский способ обозначить образ поведения и всю повседневную жизнь. При этом связь с ἐν αὐτῷ сохранена: речь идёт не просто о нравственном поведении, а о жизни в Нём.'
translation_notes:
  register: Современный литературный русский, с достоинством и без архаической конструкции «ходите в Нём». Тире оформляет приложение «Господа» и помогает избежать двусмысленного нанизывания падежных форм.
