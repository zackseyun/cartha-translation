id: COL.2.5
reference: Colossians 2:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: ru
  text: Ибо хотя телом я и отсутствую, но духом я с вами, радуясь и видя ваш добрый порядок и твёрдость вашей веры в Мессию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «стойкость вашей верности Мессии».'
    reason: Существительное στερέωμα может означать «твёрдость» или «стойкость», а πίστις — «веру» либо, возможно, «верность».
lexical_decisions:
- source_word: τῇ σαρκί
  choice: телом
  rationale: В данном противопоставлении σάρξ обозначает физическое присутствие Павла, а не греховную природу; русское «телом» естественно передаёт смысл и сохраняет параллель с «духом».
- source_word: τῷ πνεύματι
  choice: духом
  rationale: Наиболее естественно речь идёт о личном, нефизическом присутствии Павла. Строчная буква не навязывает отождествление со Святым Духом, хотя полностью не устраняет возможную богословскую многозначность.
- source_word: χαίρων
  choice: радуясь
  rationale: Деепричастие сохраняет одновременность действия с «я с вами» и близко передаёт форму настоящего причастия.
- source_word: βλέπων
  choice: видя
  rationale: Прямой перевод не уточняет без необходимости, идёт ли речь о буквальном наблюдении или мысленном восприятии.
- source_word: τάξιν
  choice: добрый порядок
  rationale: τάξις обозначает упорядоченность или надлежащее устройство; «добрый порядок» передаёт одобрительный оттенок контекста, не сводя образ к военной дисциплине.
- source_word: στερέωμα
  choice: твёрдость
  rationale: Слово выражает прочность, устойчивость; «твёрдость веры» естественно и образно звучит по-русски.
- source_word: πίστεως
  choice: веры
  rationale: Основное значение в конструкции — вера, направленная на Мессию; возможный оттенок верности отмечен в сноске.
- source_word: εἰς Χριστόν
  choice: в Мессию
  rationale: εἰς указывает на объект или направленность веры, а Χριστός здесь сохраняет значение титула «Мессия».
theological_decisions:
- issue: К кому относится «духом» в противопоставлении «телом… духом»
  choice: Павел говорит о собственном нефизическом присутствии с общиной.
  alternative: Павел говорит о присутствии с ними посредством Святого Духа.
  rationale: Непосредственное противопоставление физическому отсутствию прежде всего указывает на личный дух Павла. Написание со строчной буквы не усиливает пневматологическое толкование сверх необходимого.
- issue: Передача Χριστόν
  choice: Мессию
  alternative: Христа
  rationale: Здесь Χριστός функционирует как титул, поэтому выбран эквивалент «Мессия».
- issue: Значение πίστις в сочетании с εἰς Χριστόν
  choice: вера в Мессию
  alternative: верность Мессии
  rationale: «Вера» является наиболее естественным значением в этой конструкции; возможный оттенок «верности» сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского текста звучанием. Синтаксическая структура и парные причастия оригинала сохранены естественными русскими средствами; архаизмы и конфессионально нагруженные уточнения исключены.
