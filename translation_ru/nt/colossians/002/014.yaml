base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: ru
  text: Он стёр долговую расписку против нас, выраженную в постановлениях[a] и враждебную нам, и устранил её[b], пригвоздив её ко кресту.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долговую расписку против нас, состоявшую из постановлений» или «с постановлениями». Греческая конструкция допускает разные способы связи документа с постановлениями: документ мог быть выражен в них или состоять из них.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «убрал её из середины», то есть удалил как стоявшее на пути препятствие.'
    reason: idiom
lexical_decisions:
- source_word: ἐξαλείψας
  choice: стёр
  rationale: Передаёт образ удаления написанного и естественно звучит по-русски; деепричастная связь в русском преобразована в личную форму ради ясности.
- source_word: χειρόγραφον
  choice: долговую расписку
  rationale: Сохраняет как рукописно-документальный, так и долговой смысл слова, не сводя образ ни к самому закону, ни исключительно к перечню грехов.
- source_word: καθ’ ἡμῶν
  choice: против нас
  rationale: Прямо передаёт направленность документа против людей.
- source_word: τοῖς δόγμασιν
  choice: состоявшую в постановлениях
  rationale: Отражает вероятное отношение дательного как содержания или формы документа, не добавляя отсутствующего в греческом притяжательного значения.
- source_word: ὑπεναντίον
  choice: враждебную нам
  rationale: Передаёт усиленную противительную силу слова и согласуется с «расписку».
- source_word: ἦρκεν ἐκ τοῦ μέσου
  choice: устранил её
  rationale: Естественный русский эквивалент идиомы об удалении препятствия; совершенный вид выражает завершённость действия и сохраняющийся результат.
- source_word: προσηλώσας αὐτὸ τῷ σταυρῷ
  choice: пригвоздив ко кресту
  rationale: Сохраняет конкретный образ пригвождения и обстоятельство способа, выраженное причастием.
theological_decisions:
- issue: Значение χειρόγραφον τοῖς δόγμασιν
  choice: долговая расписка, состоявшая в постановлениях
  alternative: сам Моисеев закон; перечень грехов; юридическое обвинение
  rationale: Перевод сохраняет метафору долгового документа и трудную связь с постановлениями, не отождествляя документ с какой-либо одной богословской категорией.
- issue: Субъект ἦρκεν
  choice: Он
  alternative: перестроить фразу без явно выраженного субъекта
  rationale: Из более широкого контекста субъектом является Бог; русское предложение требует ясного выражения действующего лица. Прописная буква уместна в начале предложения и сама по себе не вводит дополнительного толкования.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского стиля. Синтаксис слегка перестроен ради естественности: цепочка греческих причастий передана личным глаголом и деепричастием. Формулировка сохраняет юридико-долговой образ и смысловую неоднозначность τοῖς δόγμασιν.'
