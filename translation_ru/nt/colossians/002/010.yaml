  text: καὶ ἐστὲ ἐν αὐτῷ πεπληρωμένοι, ὅς ἐστιν ἡ κεφαλὴ πάσης ἀρχῆς καὶ ἐξουσίας,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/010.yaml
  text: and in him you have been made full, who is the head of every ruler and authority.
translation:
  language: ru
  text: и вы обрели полноту в Нём[a]. Он — глава всякого начальства и власти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вы в Нём наполнены»; возможны также переводы: «доведены до полноты» или «обрели завершённость».'
    reason: lexical_alternative
  - marker: b
    text: «Глава» сохраняет греческую метафору. Здесь она указывает на верховенство Христа над всяким начальством и властью; эти слова могут обозначать также сверхъестественные властные силы.
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: и
  rationale: Союз сохраняет связь с предшествующим утверждением о полноте, обитающей во Христе.
- source_word: ἐστὲ ἐν αὐτῷ πεπληρωμένοι
  choice: вы обрели полноту в Нём
  rationale: Сочетание личной формы настоящего времени с перфектным страдательным причастием передаёт нынешнее состояние как результат совершившегося действия. Формулировка сохраняет образ полноты и естественно звучит по-русски, не сводя смысл ни к субъективной наполненности, ни к отвлечённой завершённости.
- source_word: ὅς ἐστιν
  choice: Он —
  rationale: В русском отдельное предложение с явным местоимением ясно относит высказывание ко Христу и избегает тяжеловесного оборота «Который есть».
- source_word: ἡ κεφαλὴ
  choice: глава
  rationale: Сохраняется греческая метафора; слово «глава» в современном литературном русском может обозначать верховенство, не подменяя метафору толкованием.
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: всякого начальства и власти
  rationale: Традиционная и понятная для библейского контекста пара сохраняет возможность видеть как носителей власти, так и космические властные силы. Единственное число после πάσης передано словом «всякого».
theological_decisions:
- issue: Полнота верующих во Христе
  choice: «обрели полноту в Нём» — участие верующих в полноте, находящейся во Христе, без уточнения в пользу позднейшей доктринальной схемы
  alternative: «вы совершенны в Нём»; «вы наполнены Им»; «вы достигли полноты в Нём»
  rationale: Перевод удерживает связь с πλήρωμα в предыдущем стихе, передаёт результирующее состояние и не утверждает ни безгрешного совершенства, ни исключительно юридической достаточности.
- issue: Смысл κεφαλή по отношению к властям
  choice: Сохранить метафору «глава», подразумевающую здесь верховенство Христа
  alternative: «правитель»; «источник»
  rationale: Контекст космических властей поддерживает смысл превосходства и верховенства, но основной текст не должен заменять образ его истолкованием.
- issue: Референт ἀρχή и ἐξουσία
  choice: «начальство и власть» с примечанием о возможном обозначении властителей или духовных сил
  alternative: «всякий правитель и всякая власть»
  rationale: Греческие существительные допускают как личностное, так и более абстрактное прочтение; русский текст и примечание сохраняют эту смысловую широту.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Местоимение «Нём» написано с прописной буквы согласно распространённой русской издательской практике для ясного указания на Христа. Разделение на два предложения делает синтаксис естественным, не меняя логической связи.
