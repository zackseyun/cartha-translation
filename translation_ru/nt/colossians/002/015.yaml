  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: ru
  text: Обезоружив начальства и власти, Он открыто выставил их напоказ, торжествуя над ними в Нём.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посредством Него» или «на нём». Греческое выражение допускает отнесение ко Христу; в контексте также возможно отнесение к кресту.'
    reason: Сохраняет неоднозначность ἐν αὐτῷ, не представляя один из контекстуально возможных референтов как несомненный.
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: Обезоружив
  rationale: В данном контексте передаёт лишение враждебных сил власти и оружия; средняя форма допускает образ снятия или совлечения, однако «обезоружив» естественно связывается с последующим публичным триумфом.
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: начальства и власти
  rationale: Сохраняет традиционные, но понятные обозначения надчеловеческих властвующих сил, не добавляя прямо определения «духовные» или «злые», которого в стихе нет.
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: открыто выставил их на позор
  rationale: Передаёт публичность и унизительный характер выставления побеждённых напоказ.
- source_word: θριαμβεύσας αὐτούς
  choice: провёл как пленников в триумфальном шествии, одержав над ними победу
  rationale: Глагол вызывает образ римского триумфа, в котором побеждённых проводят как пленников; формулировка сохраняет образ и ясно выражает победу.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Следует засвидетельствованному пониманию местоимения как указания на Христа, но неоднозначность референта отмечена в сноске.
theological_decisions:
- issue: Кто совершает действие
  choice: Местоимение «Он» написано с прописной буквы без добавления имени
  alternative: Явно назвать Бога или Христа
  rationale: Греческий текст сохраняет подразумеваемое подлежащее; перевод не должен без необходимости уточнять его сверх контекста.
- issue: Референт выражения ἐν αὐτῷ
  choice: «в Нём», то есть во Христе
  alternative: «на нём / посредством него», то есть на кресте или посредством креста
  rationale: Грамматическая форма допускает несколько контекстуальных отнесений. Основной текст сохраняет чтение «в Нём», а сноска сообщает о реальной альтернативе.
- issue: Природа «начальств и властей»
  choice: Не определять их прямо как демонов
  alternative: «духовные правители и власти зла»
  rationale: Контекст указывает на враждебные космические силы, но сам стих не содержит уточняющих слов; нейтральная формулировка сохраняет богословскую сдержанность оригинала.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным строем. Образ римского триумфального шествия раскрыт достаточно ясно для обычного читателя; архаизмы и конфессионально окрашенные добавления исключены.
