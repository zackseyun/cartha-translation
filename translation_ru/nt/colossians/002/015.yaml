  to: Обезоружив начальства и власти, Он открыто выставил их напоказ, торжествуя над ними в Нём.[a]
  rationale: Перевод уточнён для более прямой передачи публичного выставления напоказ и для нейтральной передачи образа триумфа. Убраны усиление «на позор», интерпретация побеждённых именно как пленников и смысловое дублирование. Неоднозначность заключительного ἐν αὐτῷ оставлена в тексте и чётко обозначена в сноске.
