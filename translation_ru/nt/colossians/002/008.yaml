  source_fidelity: Текст точно передаёт предупреждение Βλέπετε μή τις, образ συλαγωγέω («увлёк вас в плен»), средство διὰ («философией и пустым обманом») и трёхчастный параллелизм κατὰ… κατὰ… οὐ κατὰ. «Стихии мира» оправданно сохраняют неоднозначность στοιχεῖα τοῦ κόσμου, не предрешая вопроса о принципах, первоначалах или духовных силах.
