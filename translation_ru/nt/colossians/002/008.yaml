  terminology: «Мессия» последовательно передаёт титульное Χριστόν. «Человеческое предание» корректно передаёт обобщённое τῶν ἀνθρώπων. Примечание к «стихиям мира» адекватно фиксирует существенные альтернативы и не навязывает конфессионального решения.
