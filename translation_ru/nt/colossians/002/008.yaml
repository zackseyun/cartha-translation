reference: Colossians 2:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: ru
  text: Смотрите, чтобы никто не увлёк вас в плен философией и пустым обманом — по человеческому преданию, по стихиям мира[a], а не по Мессии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по основным началам мира»; возможно также: «по духовным силам мира». Греческое выражение может обозначать как первоначала или основные принципы миропорядка, так и космические духовные силы.'
    reason: alternative_reading
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: Смотрите, чтобы никто не
  rationale: Настоящее повелительное Βλέπετε вводит настойчивое предостережение; эта конструкция естественна в современном русском и сохраняет значение возможной угрозы.
- source_word: ἔσται ὁ συλαγωγῶν
  choice: не увлёк вас в плен
  rationale: Перифрастическая конструкция указывает на того, кто может захватить адресатов; συλαγωγέω буквально связано с уводом как добычи. Выражение «увлечь в плен» сохраняет образ и подходит к средству обольщения.
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: философией и пустым обманом
  rationale: διά с родительным обозначает средство. Союз καί сохранён как соединяющий два понятия, без навязывания возможного приложения «философией, то есть пустым обманом».
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: по человеческому преданию
  rationale: κατά выражает норму или основание; «человеческое» передаёт обобщённое ἀνθρώπων без гендерного сужения.
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: по стихиям мира
  rationale: 'Традиционное и достаточно широкое русское «стихии» сохраняет неоднозначность στοιχεῖα: это могут быть первоначала, основные начала миропорядка или космические силы.'
- source_word: οὐ κατὰ Χριστόν
  choice: а не по Мессии
  rationale: κατά повторно обозначает норму или мерило. «Мессия» передаёт титульное значение Χριστός и сохраняет контраст с человеческим преданием и стихиями мира.
theological_decisions:
- issue: Значение στοιχεῖα τοῦ κόσμου
  choice: стихии мира
  alternative: основные начала мира; духовные силы мира
  rationale: Греческое выражение допускает несколько пониманий. Основной текст не определяет, идёт ли речь о начальных принципах миропорядка или о личностных космических силах; примечание прямо сохраняет эту смысловую напряжённость.
- issue: Значение Χριστόν как титула
  choice: Мессии
  alternative: Христу
  rationale: В противопоставлении норм и источников учения титульный смысл остаётся заметным; «Мессия» прозрачно передаёт значение греческого титула, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский, с достоинством и ясностью. Синтаксический параллелизм двух оборотов с «по» сохранён. «Стихии мира» выбрано ради смысловой ёмкости; неоднозначность пояснена в примечании.
