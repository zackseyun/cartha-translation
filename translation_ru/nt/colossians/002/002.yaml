- source_word: τοῦ μυστηρίου
  choice: тайны
  rationale: Обычное русское соответствие павловскому обозначению прежде сокрытого, а теперь открытого Божьего замысла.
- source_word: τοῦ θεοῦ, Χριστοῦ
