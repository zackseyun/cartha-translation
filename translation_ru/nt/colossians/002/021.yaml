  text: Μὴ ἅψῃ μηδὲ γεύσῃ μηδὲ θίγῃς,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/021.yaml
  text: “Do not handle[a], nor taste, nor touch,”
translation:
  language: ru
  text: «Не бери в руки[a], не пробуй, не прикасайся»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не касайся, не пробуй, не прикасайся». Первый глагол (ἅψῃ) может также означать «касаться» или «браться за»; здесь выражение «брать в руки» отличает его от последующего θίγῃς («прикасаться»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ
  choice: не
  rationale: Частица μή с аористом сослагательного наклонения выражает запрет; в русском ряду однородных запретов естественно повторить «не» перед каждым глаголом.
- source_word: ἅψῃ
  choice: бери в руки
  rationale: Средний залог ἅπτω может означать «касаться» или «браться, браться за». Вариант «бери в руки» естественен по-русски и позволяет отличить этот глагол от последующего θίγῃς.
- source_word: μηδὲ
  choice: не
  rationale: Повторяющийся отрицательный союз связывает запреты. В современном русском накопительный ряд наиболее естественно передаётся повторением «не», без тяжеловесного «и не».
- source_word: γεύσῃ
  choice: пробуй
  rationale: Глагол γεύομαι буквально означает «пробовать на вкус»; краткое «пробуй» сохраняет прямой смысл и соответствует контексту запретов, связанных с пищей.
- source_word: θίγῃς
  choice: прикасайся
  rationale: Глагол θιγγάνω означает «касаться, прикасаться». «Прикасайся» сохраняет отличие от первого глагола и звучит естественно в запретительной формуле.
theological_decisions:
- issue: Характер запретов в контексте
  choice: Передать стих как краткий, похожий на цитату ряд аскетических правил без поясняющих дополнений.
  alternative: Добавить объекты запретов или прямо обозначить их как человеческие предписания.
  rationale: Греческий текст стиха состоит только из трёх резких запретов. Следует сохранить эту лаконичность и не вносить в сам стих толкование из ближайшего контекста.
translation_notes:
  register: Современный литературный русский язык; краткая и ритмичная запретительная формула. Сохранены кавычки, указывающие на цитатный характер ряда в контексте, и различие между двумя близкими греческими глаголами.
