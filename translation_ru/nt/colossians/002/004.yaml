id: COL.2.4
reference: Colossians 2:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸀τοῦτο λέγω ἵνα ⸀μηδεὶς ὑμᾶς παραλογίζηται ἐν πιθανολογίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: ru
  text: Я говорю это, чтобы никто не обманул вас убедительными доводами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правдоподобными доводами»; или: «правдоподобной речью».'
    reason: Лексема πιθανολογία может обозначать как убедительную, так и кажущуюся правдоподобной аргументацию или речь.
lexical_decisions:
- source_word: τοῦτο
  choice: это
  rationale: Указательное местоимение среднего рода в единственном числе отсылает к предшествующему высказыванию или ходу мысли Павла, не уточняя его объём.
- source_word: λέγω
  choice: говорю
  rationale: Настоящее время естественно передаётся русским настоящим временем и сохраняет прямоту высказывания.
- source_word: ἵνα
  choice: чтобы
  rationale: Союз вводит цель высказывания; «чтобы» естественно и ясно передаёт целевое значение.
- source_word: μηδεὶς
  choice: никто не
  rationale: Стандартная русская передача отрицательного неопределённого местоимения с требуемым двойным отрицанием.
- source_word: ὑμᾶς
  choice: вас
  rationale: Форма сохраняет обращение ко множеству адресатов.
- source_word: παραλογίζηται
  choice: обманул
  rationale: В данном контексте глагол обозначает введение в заблуждение посредством ошибочных или обманчивых рассуждений; «обманул» ясно и естественно передаёт основной смысл.
- source_word: ἐν πιθανολογίᾳ
  choice: убедительными доводами
  rationale: Предлог выражает средство или способ, а πιθανολογία указывает на убедительную либо правдоподобную аргументацию. Выражение не утверждает, что доводы истинны или основательны.
theological_decisions:
- issue: Характер предостережения в παραλογίζηται ἐν πιθανολογίᾳ
  choice: Общее предостережение против обмана убедительной аргументацией без указания конкретной системы учения.
  alternative: Предостережение именно против ложной философии либо только против красноречия.
  rationale: Сам стих не называет определённую доктрину или философскую систему; более узкий смысл не следует вносить в перевод, хотя дальнейший контекст раскрывает характер угрозы.
translation_notes:
  register: Современный литературный русский язык; формулировка проста, достойна и понятна широкому кругу читателей. Синтаксис сохраняет прямую связь между целью высказывания Павла и предостережением.
