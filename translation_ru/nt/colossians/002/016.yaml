  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: ru
  text: Итак, пусть никто не судит вас в вопросах пищи или питья[a] или по поводу праздника, новолуния или суббот.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также перевод: «за пищу или питьё»; греческие слова могут обозначать как пищу и питьё, так и еду и питьё.'
    reason: lexical_alternative
  - marker: b
    text: 'Последовательность «праздник, новолуние, субботы» перекликается с иудейским священным календарём: ежегодными праздниками, ежемесячными новолуниями и еженедельными субботами.'
    reason: cultural_note
lexical_decisions:
- source_word: Μὴ οὖν τις ὑμᾶς κρινέτω
  choice: Итак, пусть никто не судит вас
  rationale: «Итак» передаёт выводное οὖν и связь с предшествующим рассуждением; сочетание μή с императивом выражает запрет, а κρίνω здесь означает судить или выносить оценку относительно соблюдения предписаний.
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: за то, что вы едите или пьёте
  rationale: βρῶσις и πόσις могут обозначать как пищу и питьё, так и действие еды и питья. В русском эта формулировка естественно передаёт предмет осуждения и не сужает смысл исключительно до вида продуктов.
- source_word: ἐν μέρει ἑορτῆς
  choice: по поводу праздника
  rationale: Идиома ἐν μέρει означает «относительно, по поводу», а не «в части»; ἑορτή обозначает религиозный праздник.
- source_word: νουμηνίας
  choice: новолуния
  rationale: Слово обозначает ежемесячное празднование новолуния; форма родительного падежа естественно включается в однородный ряд после «по поводу».
- source_word: σαββάτων
  choice: суббот
  rationale: Множественное число греческого текста сохранено; оно соответствует традиционному календарному ряду ежегодных праздников, ежемесячных новолуний и еженедельных суббот.
theological_decisions:
- issue: Характер перечисленных практик
  choice: Стих запрещает судить верующих в вопросах пищи, питья и календарных соблюдений, не утверждая сам по себе, что все такие практики безусловно отменены.
  alternative: Понять стих либо как полную отмену всех перечисленных соблюдений, либо как относящийся только к аскетическим и человеческим установлениям.
  rationale: Греческий текст сосредоточен на недопустимости осуждения «относительно» этих вопросов и в пределах данного стиха не разрешает более широкий богословский спор.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная, без архаических оборотов. Повтор греческого ἐν передан естественными для русского связями. Все сноски отмечены в основном тексте.
