  text: ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ ⸀βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, ⸀περισσεύοντες ἐν εὐχαριστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: ru
  text: укоренённые и созидаемые в Нём, утверждаемые в вере[a], как вы были научены, и переполняющиеся благодарностью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верой»; возможно также: «в верности». Греческое слово πίστις может означать веру, доверие или верность, однако здесь выражение, вероятнее всего, относится к вере, которой колоссяне были научены.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: укоренённые
  rationale: Страдательное причастие сохраняет земледельческий образ и передаёт результат совершившегося укоренения, который продолжается в настоящем.
- source_word: ἐποικοδομούμενοι
  choice: созидаемые
  rationale: Причастие настоящего времени передаёт продолжающееся действие и сохраняет строительный образ. «Созидаемые» уместно в возвышенной, но понятной библейской речи.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Местоимение сохранено, поскольку греческий текст отсылает к Христу из непосредственного контекста, не повторяя Его имени или титула.
- source_word: βεβαιούμενοι
  choice: утверждаемые
  rationale: Передаёт значение обретения твёрдости и прочности, не сужая его до одного лишь внутреннего усиления.
- source_word: τῇ πίστει
  choice: в вере
  rationale: Сочетание с артиклем и последующее упоминание о полученном учении, вероятно, указывают на веру как усвоенное содержание христианской вести; русский перевод оставляет возможным и личное доверие.
- source_word: καθὼς ἐδιδάχθητε
  choice: как вы и были научены
  rationale: Естественно передаёт сравнение с ранее полученным наставлением; частица «и» подчёркивает соответствие ему.
- source_word: περισσεύοντες
  choice: переполняющиеся
  rationale: Передаёт продолжающееся изобилие и сохраняет выразительный образ избытка.
- source_word: ἐν εὐχαριστίᾳ
  choice: благодарностью
  rationale: Творительный падеж после «переполняющиеся» естественно выражает то, чем исполнены адресаты, и точно передаёт εὐχαριστία без добавления не названного в стихе объекта благодарения.
theological_decisions:
- issue: Значение τῇ πίστει
  choice: «в вере» — вероятнее всего, в вере как принятой и преподанной христианской вести
  alternative: «верой» как личным доверием; «в верности»
  rationale: Артикль и слова «как вы и были научены» склоняют к пониманию веры как содержания или сферы полученного учения. Однако само слово πίστις допускает значения доверия и верности, поэтому возможные оттенки не исключены и отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Цепочка причастий сохранена, поскольку стих синтаксически продолжает наставление предыдущего стиха; земледельческий и строительный образы не сглажены.
