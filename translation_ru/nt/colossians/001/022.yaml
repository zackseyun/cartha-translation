  - marker: b
    text: Слово, переведённое как «непорочными», можно также передать «без изъяна»; такой перевод яснее сохраняет возможный жертвенный оттенок греческого слова.
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: Но теперь
  rationale: Передаёт временной контраст с прежним состоянием адресатов, описанным в предыдущем стихе.
- source_word: ἀποκατηλλάγητε
  choice: Он примирил вас
  rationale: Греческая форма страдательная, однако в русском активная конструкция с подразумеваемым из контекста действующим лицом звучит яснее; формальная пассивная передача отмечена в сноске.
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: в Своём теле, во плоти
  rationale: Сохраняет конкретное указание на реальное телесное существование Христа и не приписывает слову σάρξ значения «греховная природа». Приложение «во плоти» естественнее для современного русского, чем буквальное «в теле Его плоти».
- source_word: διὰ τοῦ θανάτου
  choice: через смерть
  rationale: Передаёт διά с родительным как средство, посредством которого совершено примирение, не добавляя отсутствующее в греческом местоимение «Его».
- source_word: παραστῆσαι
  choice: чтобы представить
  rationale: Передаёт целевое значение инфинитива и сохраняет образ предстояния перед оценивающим лицом.
- source_word: ἁγίους
  choice: святыми
  rationale: Устоявшийся и понятный эквивалент, сохраняющий значения посвящённости и нравственной чистоты.
- source_word: ἀμώμους
  choice: непорочными
  rationale: Естественное русское слово, способное передать нравственную безупречность и отчасти сохранить оттенок отсутствия жертвенного изъяна.
- source_word: ἀνεγκλήτους
  choice: не подлежащими обвинению
  rationale: 'Сохраняет судебно-правовой оттенок слова: против таких людей нельзя обоснованно выдвинуть обвинение; не сливает его по смыслу с ἀμώμους.'
- source_word: κατενώπιον αὐτοῦ
  choice: пред Ним
  rationale: Кратко и торжественно передаёт положение перед лицом оценивающего; местоимение оставляет референта в той же мере зависимым от контекста, что и греческий текст.
theological_decisions:
- issue: Действующее лицо при страдательной форме ἀποκατηλλάγητε
  choice: В основном тексте использована активная конструкция «Он примирил вас», а страдательная форма указана в сноске.
  alternative: «Вы были примирены» или «вы примирены».
  rationale: Греческая форма грамматически страдательная и подчёркивает, что примирение совершено над адресатами, но контекст указывает на божественную инициативу. Активная русская фраза яснее, а сноска сохраняет формальную неоднозначность источника.
- issue: Значение σάρξ в выражении о теле
  choice: «во плоти» в буквальном, телесном смысле.
  alternative: «в человеческом теле»; недопустимое в данном контексте толкование — «в греховной природе».
  rationale: Контекст говорит о подлинном телесном существовании и смерти Христа, а не о нравственно отрицательной сфере или греховной природе.
- issue: Различение ἀμώμους и ἀνεγκλήτους
  choice: «непорочными и не подлежащими обвинению».
  alternative: «без изъяна и безупречными».
  rationale: Выбранная пара сохраняет различие между образом непорочности, имеющим возможный жертвенный оттенок, и судебным отсутствием основания для обвинения.
- issue: Референт αὐτοῦ в κατενώπιον αὐτοῦ
  choice: Сохранено местоименное «пред Ним» без поясняющего имени.
  alternative: «пред Богом» или «пред Христом».
  rationale: Греческий текст использует местоимение; явное именование сняло бы сохраняющуюся контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Оборот «пред Ним» выбран как краткий и возвышенный, но понятный; тяжеловесное буквальное «в теле Его плоти» заменено приложением «в Своём теле, во плоти» без утраты телесного акцента.
