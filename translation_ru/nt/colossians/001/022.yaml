  source_fidelity: 'Требуется исправление основной формы ἀποκατηλλάγητε: в тексте SBLGNT это аорист страдательного залога («вы были/оказались примирены»), тогда как «Он примирил вас» вводит в основной текст невыраженное действующее лицо. Контекст позволяет такое истолкование, но не оправдывает замену залога без необходимости. Выражение «в теле Его плоти» передаёт намеренно конкретную и несколько усиленную формулировку ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ точнее, чем приложение «в Своём теле, во плоти».'
  naturalness: «Но теперь вы примирены в теле Его плоти через смерть» сохраняет умеренно торжественный библейский регистр и остаётся понятным современному литературному читателю. «Пред Ним», «непорочными» и «не подлежащими обвинению» стилистически уместны; последнее удачно удерживает юридический оттенок ἀνεγκλήτους.
