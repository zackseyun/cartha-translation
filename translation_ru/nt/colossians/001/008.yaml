  text: and who also made known to us your love in the Spirit[a].
translation:
  language: ru
  text: Он также сообщил нам о вашей любви в Духе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о вашей духовной любви»; возможно также: «о вашей любви в духе».'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: Он же сообщил
  rationale: Артикль с аористным причастием относится к Епафрасу из предыдущего стиха. В русском языке естественно передать конструкцию личным местоимением и сказуемым; δηλόω здесь означает «сообщить, дать знать».
- source_word: καὶ
  choice: же
  rationale: Частица связывает это дополнительное действие Епафраса с предыдущим описанием. В данном русском контексте «же» естественно сохраняет связующе-добавочный оттенок, не утяжеляя фразу сочетанием «и который также».
- source_word: ἡμῖν
  choice: нам
  rationale: 'Дательный падеж передан как косвенное дополнение: Епафрас сообщил это Павлу и его спутникам.'
- source_word: τὴν ὑμῶν ἀγάπην
  choice: о вашей любви
  rationale: При русском глаголе «сообщил» содержание сообщения естественно вводится предлогом «о»; ἀγάπη передано обычным соответствием «любовь».
- source_word: ἐν πνεύματι
  choice: в Духе
  rationale: Фраза, вероятнее всего, указывает на Святого Духа и при этом сохраняет краткость и образ исходного текста. Отсутствие артикля в греческом не исключает такого понимания; иное толкование отмечено в сноске.
theological_decisions:
- issue: Кого или что обозначает πνεύματι
  choice: 'Святого Духа: «вашей любви в Духе»'
  alternative: «вашей духовной любви» или «вашей любви в духе»
  rationale: В языке Павла сочетание ἐν πνεύματι может обозначать действие или жизнь в сфере Святого Духа, однако грамматически возможно и более общее указание на духовный характер любви. Основной текст отражает вероятное значение, а сноска сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык, краткий и достойный по тону. Формулировка предполагает связь с предыдущим стихом, где назван Епафрас. Прописная буква в слове «Дух» отражает основное понимание, а сноска сохраняет альтернативу.
