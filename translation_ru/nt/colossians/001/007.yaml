  text: ⸀καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν, ὅς ἐστιν πιστὸς ὑπὲρ ⸀ἡμῶν διάκονος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow servant, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: ru
  text: как вы и научились у Епафраса, нашего возлюбленного сораба[a], который верно служит Мессии[b] от нашего имени[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «того, кто вместе с нами является рабом одного господина»; возможно также: «нашего возлюбленного товарища по служению».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Христу». Греческое Χριστός означает «Помазанник» и соответствует титулу «Мессия».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ради нас», «для нас». В некоторых рукописях вместо «нас» стоит «вас».'
    reason: textual_variant
lexical_decisions:
- source_word: καθὼς
  choice: как … и
  rationale: Передаёт связь и соответствие с предшествующей мыслью; русская конструкция «как … и» звучит естественно.
- source_word: ἐμάθετε ἀπὸ
  choice: вы … научились у
  rationale: Сохраняет значение усвоения учения от определённого наставника. Дополнение не добавлено, поскольку в греческом оно подразумевается контекстом.
- source_word: Ἐπαφρᾶ
  choice: Епафраса
  rationale: Традиционная и узнаваемая русская передача имени Ἐπαφρᾶς.
- source_word: ἀγαπητοῦ
  choice: возлюбленного
  rationale: Передаёт тёплое отношение автора и сохраняет достоинство библейского стиля.
- source_word: συνδούλου
  choice: сораба
  rationale: Кратко сохраняет образ совместного рабства у одного господина, не ослабляя δοῦλος до общего понятия «служитель».
- source_word: πιστὸς … διάκονος
  choice: верно служит
  rationale: Естественная русская глагольная передача сочетания «верный служитель»; выражает надёжность Епафраса в его служении, не превращая διάκονος в название церковной должности.
- source_word: ὑπὲρ ἡμῶν
  choice: от нашего имени
  rationale: Передаёт наиболее вероятный представительский смысл ὑπέρ с родительным падежом; возможный более широкий смысл пользы отмечен в сноске.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Передаёт смысл титула Χριστός («Помазанник»), а не воспринимает его только как личное имя.
theological_decisions:
- issue: Образ совместного рабства в σύνδουλος
  choice: сораб
  alternative: товарищ по служению
  rationale: Выбрано слово, сохраняющее отношение обоих людей к одному господину; более мягкий вариант скрывает рабский образ греческого слова.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном сочетании слово обозначает того, кому служит Епафрас, и сохраняет силу титула. Традиционный вариант дан в сноске.
- issue: Значение ὑπὲρ ἡμῶν
  choice: от нашего имени
  alternative: ради нас
  rationale: Основной текст отражает представительский оттенок, но греческий предлог допускает также значение действия в чью-либо пользу, поэтому неоднозначность сохранена сноской.
- issue: Текстовый вариант местоимения при ὑπέρ
  choice: ἡμῶν — «нашего»
  alternative: ὑμῶν — «вашего»
  rationale: Основной текст следует SBLGNT; значимый вариант рукописной традиции указан в сноске без попытки устранить текстологическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Сораб» менее разговорно, но точно и компактно сохраняет исходный образ; значение пояснено в сноске. Глагольное «верно служит» естественнее тяжёлой цепочки определений и не приписывает Епафрасу формальную должность диакона.
