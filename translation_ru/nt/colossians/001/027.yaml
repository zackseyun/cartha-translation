base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: ru
  text: 'Им Бог пожелал открыть, каково богатство славы этой тайны среди язычников: Мессия в вас[a] — надежда славы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди вас». Греческое выражение может указывать как на пребывание Мессии в верующих, так и на его присутствие среди верующих как общины.'
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: Им
  rationale: Дательный падеж относительного местоимения отсылает к святым из предыдущего стиха; «им» естественно выступает косвенным дополнением при «открыть».
- source_word: ἠθέλησεν
  choice: пожелал
  rationale: Передаёт осознанную волю Бога, не усиливая значение до предопределённого выбора.
- source_word: γνωρίσαι
  choice: открыть
  rationale: В данном контексте означает сделать прежде сокрытое известным; «открыть» естественно сочетается с последующим упоминанием тайны.
- source_word: τί τὸ πλοῦτος τῆς δόξης
  choice: каково богатство славы
  rationale: Сохраняет образ богатства и плотную родительную конструкцию оригинала, оставаясь грамматичным в современном русском языке.
- source_word: μυστηρίου
  choice: тайны
  rationale: Речь идёт о прежде сокрытом, а теперь открытом Божьем замысле, а не о неразрешимой загадке.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди язычников
  rationale: В контексте послания ἔθνη обозначает прежде всего неевреев; это важнее, чем буквальное «среди народов».
- source_word: Χριστὸς
  choice: Христос
  rationale: Общеупотребительное русское соответствие греческому титулу Χριστός; здесь оно одновременно сохраняет титульный смысл и звучит естественно.
- source_word: ἐν ὑμῖν
  choice: в вас
  rationale: Наиболее прямое соответствие греческому выражению; его возможный корпоративный смысл «среди вас» сохранён в сноске.
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: надежда славы
  rationale: Сохраняет ёмкую родительную конструкцию и не уточняет сверх текста, понимается ли слава как предмет или ожидаемый итог надежды.
theological_decisions:
- issue: Смысл ἐν ὑμῖν
  choice: в вас
  alternative: среди вас
  rationale: Греческое выражение допускает как пребывание Христа в верующих, так и его присутствие среди них как общины. Основной текст передаёт наиболее прямой смысл, а сноска сохраняет альтернативу.
- issue: Передача Χριστός
  choice: Христос
  alternative: Мессия
  rationale: «Христос» — прямое и укоренившееся русское соответствие греческому слову; контекст допускает его понимание как титула без обязательной замены на «Мессия».
- issue: Связь тайны с выражением «Христос в вас»
  choice: пояснение после двоеточия
  alternative: которая есть Христос в вас
  rationale: Двоеточие ясно передаёт пояснительную функцию ὅ ἐστιν и избегает неестественной для современного русского формулы, не меняя отождествления содержания тайны с Христом в верующих.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской прозы. Синтаксис слегка перестроен ради естественности: пояснительное ὅ ἐστιν передано двоеточием. Формула «богатство славы» намеренно сохранена, чтобы не сглаживать образность и смысловую плотность греческого текста.'
