  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: ru
  text: 'Святым и верным[a] братьям[b] в Мессии[c], находящимся в Колоссах: благодать вам и мир от Бога, нашего Отца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верующим»; греческое πιστοῖς может обозначать как тех, кто верит, так и тех, кто верен.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально в греческом тексте: «братьям»; в этом контексте Павел, вероятно, обращается ко всей общине, включая женщин.'
    reason: lexical_alternative
  - marker: c
    text: 'Традиционный перевод: «во Христе». Греческий титул Χριστός означает «Мессия».'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: находящимся в Колоссах
  rationale: Оборот с ἐν и названием места указывает, где находятся адресаты. Причастная конструкция естественна для русского адресного приветствия и ясно связывает местонахождение со всей общиной.
- source_word: ἁγίοις
  choice: святым
  rationale: Прилагательное передаёт основное значение посвящённости Богу и не привносит позднейших ассоциаций, которые могут возникать у существительного «святые».
- source_word: πιστοῖς
  choice: верным
  rationale: πιστός может означать как верность, так и веру. «Верным» естественно характеризует адресатов, а возможное значение «верующим» сохранено в сноске.
- source_word: ἀδελφοῖς
  choice: братьям
  rationale: Перевод сохраняет грамматически мужскую форму греческого слова. Контекстуальная возможность обращения ко всей общине, включая женщин, поясняется в сноске.
- source_word: ἐν Χριστῷ
  choice: в Мессии
  rationale: Χριστός здесь сохраняет значение титула — «Мессия». Предлог ἐν передан буквально, чтобы сохранить характерный для Павла язык принадлежности и единения.
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: благодать вам и мир
  rationale: Сохранены порядок и структура обычной формулы приветствия Павла; по-русски выражение звучит ясно и торжественно.
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: от Бога, нашего Отца
  rationale: 'Сочетание понято как приложение: Бог назван нашим Отцом. Запятая ясно передаёт эту связь без добавления отсутствующего в греческом союза.'
theological_decisions:
- issue: Передача Χριστῷ в выражении ἐν Χριστῷ
  choice: в Мессии
  alternative: во Христе
  rationale: Греческое Χριστός является титулом со значением «Мессия». Традиционная русская передача «Христос» дана в сноске, чтобы не скрывать привычное чтение.
- issue: Родовая форма ἀδελφοῖς
  choice: братьям
  alternative: братьям и сёстрам
  rationale: Основной текст отражает мужской род греческой формы, а сноска поясняет, что в данном общинном обращении слово, вероятно, охватывает и женщин.
- issue: Смысловой диапазон πιστοῖς
  choice: верным
  alternative: верующим
  rationale: Контекст не устраняет двусмысленность между верностью и верой, поэтому один смысл выбран для связного основного текста, а другой сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского приветствия. Синтаксис сделан естественным для русского читателя, при этом сохранены ключевые богословские формулировки, неоднозначность πιστοῖς и мужская форма ἀδελφοῖς.
