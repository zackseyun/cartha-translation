  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: ru
  text: Ради этого я также тружусь[a], борясь[b] сообразно его действию[c], которое действует во мне с силой[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для этого»; или: «ради чего».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прилагая напряжённые усилия»; греческое слово может описывать борьбу или состязание.'
    reason: lexical_alternative
  - marker: c
    text: В греческом тексте сказано «его действию», без прямого уточнения, относится ли местоимение к Богу или к Мессии.
    reason: alternative_reading
  - marker: d
    text: 'Или: «которое могущественно действует во мне»; буквально возможно также: «которое действует во мне в силе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: Ради этого
  rationale: Оборот отсылает к цели служения, названной выше. «Ради этого» естественно передаёт как ретроспективную связь, так и целевую направленность, не уточняя её сверх греческого текста.
- source_word: καὶ
  choice: и
  rationale: Частица присоединяет собственный напряжённый труд Павла к предшествующему описанию его служения; в русском эту добавочную связь естественно выражает «и».
- source_word: κοπιῶ
  choice: тружусь
  rationale: Глагол обозначает тяжёлый, изнурительный труд. «Тружусь» сохраняет серьёзность усилия и звучит естественно и достойно в современном русском.
- source_word: ἀγωνιζόμενος
  choice: борясь
  rationale: Причастие передаёт напряжённое усилие, подобное борьбе или состязанию. «Борясь» сохраняет этот образ и усиливает значение предшествующего глагола.
- source_word: κατὰ
  choice: сообразно
  rationale: 'Предлог с винительным падежом указывает здесь на соответствие или меру: борьба Павла совершается в соответствии с действующей в нём силой. «Сообразно» сохраняет эту связь точнее, чем чисто инструментальное «благодаря».'
- source_word: τὴν ἐνέργειαν
  choice: действию
  rationale: Существительное обозначает действенную, осуществляющую себя силу. «Действие» позволяет сохранить смысл и связь с однокоренным причастием ἐνεργουμένην, не внося современных научных ассоциаций слова «энергия».
- source_word: αὐτοῦ
  choice: его
  rationale: Греческий текст содержит местоимение, но не называет прямо его референта в самом стихе. Строчная форма «его» не добавляет типографического толкования и сохраняет возможность соотнести местоимение с Богом или Мессией по контексту.
- source_word: τὴν ἐνεργουμένην
  choice: которое действует
  rationale: Настоящее причастие описывает продолжающееся действенное проявление. «Которое действует» сохраняет однокоренную связь с «действием» и не вынуждает выбирать между средним и пассивным оттенками формы.
- source_word: ἐν ἐμοὶ
  choice: во мне
  rationale: Прямое пространственное значение ἐν сохраняет представление о внутреннем действии, не превращая его без необходимости в инструментальное «через меня».
- source_word: ἐν δυνάμει
  choice: с силой
  rationale: Оборот характеризует действие как совершающееся силой или могущественным образом. «С силой» естественно по-русски и сохраняет именную форму, не сводя выражение к наречию.
theological_decisions:
- issue: К кому относится αὐτοῦ («его»)
  choice: Сохранить местоимение «его», не называя прямо Бога или Мессию.
  alternative: «действию Бога» или «действию Мессии»
  rationale: В самом стихе референт местоимения прямо не назван, а контекст допускает его установление читателем. Сохранение местоимения не устраняет присущую исходному тексту неоднозначность.
- issue: Соотношение труда Павла и действующей в нём силы
  choice: Передать κατὰ как «сообразно», а внутреннее действие — буквально «действует во мне с силой».
  alternative: «борясь благодаря его силе» или «силой, действующей через меня»
  rationale: Такой перевод сохраняет напряжение между настоящим трудом Павла и действием иной силы в нём, не представляя одно из них как отменяющее другое и не заменяя внутреннее действие инструментальным.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Тружусь» и «сообразно» сохраняют достоинство и точность без церковнославянизма «подвизаясь». Однокоренные «действию — действует» намеренно отражают греческую фигуру ἐνέργεια — ἐνεργουμένην. Местоимение «его» оставлено со строчной буквы, чтобы типографически не разрешать неоднозначность референта.
