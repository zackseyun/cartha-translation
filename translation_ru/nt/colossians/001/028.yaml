- from: Его мы возвещаем, вразумляя каждого человека и обучая каждого человека со всей мудростью, чтобы представить каждого человека зрелым во Христе.
  to: Его мы возвещаем, предостерегая каждого человека и наставляя каждого человека со всей мудростью, чтобы представить каждого человека зрелым во Христе.
  rationale: 'Внесены две безопасные лексико-стилистические правки: «предостерегая» точнее передаёт увещевательно-предупредительный аспект νουθετοῦντες, а «наставляя» естественнее передаёт διδάσκοντες в данном контексте. Тройной риторический повтор «каждого человека», синтаксическая связь «со всей мудростью» с обоими действиями и значение τέλειον сохранены.'
