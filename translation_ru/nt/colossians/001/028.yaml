  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: ru
  text: Его мы возвещаем, предостерегая каждого человека и наставляя каждого человека со всей мудростью, чтобы представить каждого человека зрелым во Христе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: возвещаем
  rationale: Передаёт публичное и настойчивое провозглашение; естественно сочетается с личным дополнением «Его».
- source_word: νουθετοῦντες
  choice: вразумляя
  rationale: Сохраняет смысл наставления, включающего предостережение и исправление, не сводя его только к предупреждению об опасности.
- source_word: διδάσκοντες
  choice: обучая
  rationale: Передаёт целенаправленное наставление и позволяет избежать близкого повтора со словом «вразумляя».
- source_word: ἐν πάσῃ σοφίᾳ
  choice: со всей мудростью
  rationale: Естественно передаёт способ совершения обоих действий и сохраняет широкое значение πάσῃ.
- source_word: τέλειον
  choice: зрелым
  rationale: В данном контексте обозначает духовную зрелость или полноту, а не безупречность.
- source_word: ἐν Χριστῷ
  choice: во Христе
  rationale: Сохраняет устойчивую павловскую формулу союза и сферы принадлежности Христу; греческое Χριστός здесь естественно переводится традиционным титулом «Христос».
theological_decisions:
- issue: Значение τέλειον
  choice: зрелым
  alternative: совершенным
  rationale: «Зрелым» лучше выражает цель наставления — достижение полноты христианской зрелости — и не навязывает смысл абсолютной безгрешности.
- issue: Передача Χριστῷ
  choice: Христе
  alternative: Мессии
  rationale: В русском новозаветном контексте «Христос» — естественный и узнаваемый эквивалент греческого титула; он не превращает титул в личное имя и не меняет богословский смысл.
- issue: Повтор πάντα ἄνθρωπον
  choice: сохранить трёхкратное «каждого человека»
  alternative: частично заменить местоимениями или опустить повторы
  rationale: Повтор риторически подчёркивает всеобщий охват служения и потому сохранён, несмотря на некоторую тяжеловесность по-русски.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского наставления. Синтаксический параллелизм и трёхкратный повтор «каждого человека» сохранены ради авторского акцента.
