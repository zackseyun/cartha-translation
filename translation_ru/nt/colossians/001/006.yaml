lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: которое пришло к вам
  rationale: Причастный оборот продолжает описание «слова истины — благой вести» из стиха 5. «Пришло к вам» естественно передаёт как направленность, так и наступившее присутствие вести.
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: во всём мире
  rationale: Сохраняет широкий, риторически всеохватный язык Павла, не превращая его в пояснительное географическое утверждение.
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: приносит плод и растёт
  rationale: Сохраняет сельскохозяйственный образ и продолжающееся действие; в русском простое настоящее звучит естественнее буквальной перифрастической конструкции.
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: так и среди вас
  rationale: Передаёт сопоставление всемирного действия благой вести с её действием в общине; сноска сохраняет возможность более буквального «в вас».
- source_word: ἀφ’ ἧς ἡμέρας
  choice: с того дня
  rationale: Естественное русское обозначение исходного момента продолжающегося действия.
- source_word: ἠκούσατε καὶ ἐπέγνωτε
  choice: услышали и познали
  rationale: «Познали» передаёт не только получение сведений, но и действительное узнавание благодати, не усиливая значение до «полностью постигли».
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: благодать Бога
  rationale: Ясно и с должным богословским весом передаёт устойчивое павловское выражение.
- source_word: ἐν ἀληθείᾳ
  choice: в истине
  rationale: Формулировка сохраняет возможные оттенки образа действия («истинно») и сферы или содержания («в истине»), не разрешая неоднозначность.
theological_decisions:
- issue: Охват выражения «во всём мире»
  choice: Сохранена универсальная формулировка греческого текста как широкое риторическое описание распространения благой вести.
  alternative: Понимать как строго буквальное утверждение, что к тому времени была охвачена каждая область земного шара.
  rationale: Перевод не ослабляет всеохватный язык Павла, но и не добавляет толкования, будто речь обязательно идёт о каждом человеке или регионе без исключения.
- issue: Значение ἐν ἀληθείᾳ
  choice: «в истине»
  alternative: «истинно» или «в самой истине»
  rationale: Греческое выражение допускает оттенок образа действия либо сферы и содержания; буквальная русская формулировка сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Повтор сравнительной конструкции передан естественно для русского синтаксиса; метафоры плода и роста сохранены. Все смысловые альтернативы, необходимые для сохранения неоднозначности оригинала, вынесены в сноски.
