source:
  edition: SBLGNT
  text: διὰ τὴν ἐλπίδα τὴν ἀποκειμένην ὑμῖν ἐν τοῖς οὐρανοῖς, ἣν προηκούσατε ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/005.yaml
  text: because of the hope laid up for you in the heavens[a], which you heard before in the word of truth[d][c][b], the gospel
translation:
  language: ru
  text: благодаря надежде, которая хранится для вас на небесах[a] и о которой вы прежде услышали[b] в слове истины[c] — Евангелии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на небесах»; по-русски возможно также «на небе». В греческом тексте стоит множественное число.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «о которой вы услышали раньше» или «о которой вы услышали заранее».'
    reason: lexical_alternative
  - marker: c
    text: «Слово истины» можно также перевести как «весть истины». Слово «Евангелие» служит приложением и поясняет, что это за слово, или весть.
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: благодаря надежде
  rationale: διά с винительным падежом выражает здесь причину или основание. «Благодаря» ясно передаёт положительную причинную связь и по-русски звучит естественнее, чем имеющее нередко отрицательный оттенок «из-за»; при этом ἐλπίς передано обычным словом «надежда».
- source_word: τὴν ἀποκειμένην ὑμῖν
  choice: которая хранится для вас
  rationale: ἀπόκειμαι обозначает то, что отложено, сохраняется или предназначено на будущее. «Хранится для вас» естественно сохраняет образ и передаёт дательный падеж выгоды ὑμῖν.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: на небесах
  rationale: Русское «на небесах» сохраняет множественное число греческого выражения и соответствует современному возвышенному библейскому употреблению.
- source_word: ἣν προηκούσατε
  choice: о которой вы прежде услышали
  rationale: Женское относительное местоимение прямо соотносится с «надеждой». Предлог «о» необходим в естественном русском сочетании «услышать о надежде», а «прежде» передаёт значение приставки προ- без излишнего уточнения момента.
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: в слове истины
  rationale: λόγος допускает значения «слово» и «весть». Основной текст сохраняет близкое к греческому и устойчивое выражение «слово истины», смысл которого поясняет последующее приложение.
- source_word: τοῦ εὐαγγελίου
  choice: Евангелии
  rationale: Родительный оборот лучше всего понимать как приложение, отождествляющее «слово истины» с Евангелием. Тире ясно показывает это отношение в русском синтаксисе.
theological_decisions:
- issue: К чему относится относительное предложение
  choice: «о которой вы прежде услышали» относится к надежде
  alternative: Отнести его в более широком смысле ко всей евангельской вести
  rationale: ἣν стоит в женском роде и единственном числе, непосредственно согласуясь с ἐλπίδα. Такое прочтение сохраняет явную грамматику исходного текста.
- issue: Причинное значение διὰ τὴν ἐλπίδα
  choice: 'Передать как основание упомянутых ранее веры и любви: «благодаря надежде»'
  alternative: 'Понять как цель: «ради надежды»'
  rationale: διά с винительным падежом здесь естественно обозначает причину или основание. Перевод не превращает надежду в цель действия.
- issue: Связь τοῦ εὐαγγελίου со «словом истины»
  choice: Передать «Евангелие» как приложение, отождествляющее его со «словом истины»
  alternative: 'Понять как зависимый родительный оборот: «слово истины Евангелия»'
  rationale: Приложение наиболее естественно объясняет синтаксис и сохраняет отождествление истинной вести с Евангелием, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Относительное предложение вместо причастного оборота облегчает восприятие. «Благодаря» выбрано ради ясной положительной причинной связи; «на небесах» и «слово истины» сохраняют образность и форму исходного текста.
