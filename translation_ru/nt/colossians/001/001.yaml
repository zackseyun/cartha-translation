lexical_decisions:
- source_word: Παῦλος
  choice: Павел
  rationale: Устоявшаяся русская форма греческого личного имени Παῦλος.
- source_word: ἀπόστολος
  choice: апостол
  rationale: В самопредставлении Павла это признанное служение и звание, а не просто общее обозначение посланника.
- source_word: Χριστοῦ Ἰησοῦ
  choice: Мессии Иисуса
  rationale: Сохранён порядок греческих слов и титульный смысл Χριστός; оба имени стоят в родительном падеже после слова «апостол».
- source_word: διὰ θελήματος θεοῦ
  choice: по воле Бога
  rationale: Естественная русская формула, передающая основание и определяющее действие Божьей воли в призвании Павла.
- source_word: Τιμόθεος
  choice: Тимофей
  rationale: Устоявшаяся русская форма греческого личного имени Τιμόθεος.
- source_word: ὁ ἀδελφὸς
  choice: наш брат
  rationale: Местоимение «наш» естественно выражает подразумеваемую общинную связь; греческий текст буквально использует определённое обозначение «брат».
theological_decisions:
- issue: Передача титула Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном самопредставлении слово сохраняет значение титула Помазанника; вариант «Христос» дан в примечании как традиционная передача, не устраняющая возможного восприятия слова как имени.
- issue: Общинный смысл ὁ ἀδελφός
  choice: наш брат
  alternative: брат
  rationale: «Наш брат» ясно и естественно передаёт принадлежность Тимофея к общине верующих, не превращая обозначение в родственное по крови.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярного вступления. Сохранён незавершённый синтаксис прескрипта и конечная запятая, поскольку предложение продолжается в следующем стихе.
