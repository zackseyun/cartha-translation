  text: ⸀περιπατῆσαι ἀξίως τοῦ κυρίου εἰς πᾶσαν ἀρεσκείαν ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες καὶ αὐξανόμενοι ⸂τῇ ἐπιγνώσει⸃ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/010.yaml
  text: so as to walk worthily of the Lord[a], to all pleasing, bearing fruit in every good work and growing in the knowledge of God[b],
translation:
  language: ru
  text: чтобы поступать достойно Господа, во всём угождая Ему[a], принося плод во всяком добром деле и возрастая в познании Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ко всякому угождению»; кому именно угождать, прямо не сказано, но из контекста подразумевается Господь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «возрастая в полном познании Бога». Это слово может подразумевать более полное или глубокое познание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατῆσαι
  choice: поступать
  rationale: Сохраняет распространённую у Павла метафору образа жизни, но звучит естественнее в современном русском, чем буквальное «ходить».
- source_word: ἀξίως τοῦ κυρίου
  choice: достойно Господа
  rationale: Передаёт наречное значение ἀξίως и сохраняет прямую связь поведения с Господом без лишнего истолкования.
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: во всём угождая Ему
  rationale: Естественно передаёт цель — быть угодными во всех отношениях; местоимение «Ему» делает по-русски ясной подразумеваемую контекстом отсылку к Господу.
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ
  choice: во всяком добром деле
  rationale: Сохраняет распределительное значение παντί и естественно связывается с образом принесения плода.
- source_word: καρποφοροῦντες
  choice: принося плод
  rationale: Сохраняет органическую метафору и перекличку с Кол 1:6.
- source_word: αὐξανόμενοι
  choice: возрастая
  rationale: Передаёт продолжающийся рост и сохраняет несколько возвышенный, но понятный библейский регистр.
- source_word: τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: в познании Бога
  rationale: «Познание» естественно выражает не просто наличие сведений, а углубляющееся знание; дательный падеж понят как сфера, в которой происходит рост.
theological_decisions:
- issue: Подразумеваемый объект при ἀρεσκείαν
  choice: «во всём угождая Ему» с пояснением в сноске
  alternative: «во всём будучи угодными» без выраженного объекта
  rationale: В греческом объект прямо не назван, однако из контекста им является Господь. Русская формулировка с местоимением естественна, а сноска сохраняет осведомлённость о синтаксической невыраженности объекта.
- issue: Оттенок значения ἐπίγνωσις
  choice: «познание»
  alternative: «полное познание» или «глубокое познание»
  rationale: Основной текст не превращает возможный оттенок полноты в обязательное техническое значение; возможное усиление отмечено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством новозаветного увещания. Формы «поступать», «принося плод» и «возрастая» сохраняют павловские образы, оставаясь понятными обычному читателю.
