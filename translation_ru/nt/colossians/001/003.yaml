source:
  edition: SBLGNT
  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: ru
  text: Мы всегда благодарим Бога, Отца нашего Господа Иисуса Христа[a], когда молимся о вас,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иисуса, Мессии».'
    reason: Передаёт возможное явное титульное значение греческого Χριστός.
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: благодарим
  rationale: Обычный и естественный русский эквивалент глагола со значением выражения благодарности; уместен в контексте молитвы и эпистолярного благодарения.
- source_word: τῷ θεῷ πατρὶ
  choice: Бога, Отца
  rationale: 'Два дательных падежа переданы как приложение: Бог назван Отцом. Запятая ясно выражает эту синтаксическую связь.'
- source_word: τοῦ κυρίου ἡμῶν
  choice: нашего Господа
  rationale: Передаёт родительный оборот и сохраняет κύριος как титул «Господь»; порядок слов естественен для современного литературного русского языка.
- source_word: Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  rationale: «Иисус Христос» — закрепившаяся и понятная русская форма; при этом возможное титульное значение Χριστός («Мессия») отмечено в сноске.
- source_word: πάντοτε
  choice: всегда
  rationale: Прямой эквивалент наречия; по наиболее естественной синтаксической связи относится к благодарению.
- source_word: περὶ ὑμῶν
  choice: о вас
  rationale: В сочетании с глаголом молитвы περί с родительным обозначает тех, за кого возносится молитва; по-русски это естественно выражается оборотом «молиться о ком-либо».
- source_word: προσευχόμενοι
  choice: когда молимся
  rationale: Причастие обозначает сопутствующее обстоятельство благодарения. Придаточное времени звучит естественно и сохраняет связь благодарения с молитвой.
theological_decisions:
- issue: Значение Χριστός в сочетании Ἰησοῦ Χριστοῦ
  choice: Иисуса Христа
  alternative: Иисуса, Мессии
  rationale: В русском языке «Христос» остаётся общепонятным традиционным обозначением и не требует понимать слово как фамилию. Сноска раскрывает исходное титульное значение, не навязывая решение относительно степени превращения титула в имя.
- issue: К кому относится πάντοτε («всегда»)
  choice: 'к благодарению: «Мы всегда благодарим»'
  alternative: 'к молитве: «всегда молясь о вас»'
  rationale: Положение наречия допускает некоторую синтаксическую гибкость, но начало предложения и обычная структура Павлова благодарения делают связь с главным глаголом наиболее вероятной. Перевод не добавляет утверждения о непрерывной молитве.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаизмов. Формулировка пригодна как начало продолжающегося предложения; конечная запятая сохранена в соответствии с исходным фрагментом.
