    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: через него
  rationale: Предлог διά с родительным падежом обозначает посредничество или средство. «Через него» естественно передаёт посредническую роль Сына и сохраняет повтор этой формулы в стихе.
- source_word: ἀποκαταλλάξαι
  choice: примирить
  rationale: Глагол обозначает восстановление нарушенных отношений. Вариант «полностью примирить» чрезмерно подчёркивал бы усилительное значение приставки ἀπο-.
- source_word: τὰ πάντα
  choice: всё
  rationale: Субстантивированное нейтральное множественное число имеет всеобъемлющий смысл. Русское «всё» сохраняет широту выражения и согласуется с последующим пояснением о земном и небесном.
- source_word: εἰς αὐτόν
  choice: с собой
  rationale: При глаголе «примирить» русская конструкция «примирить с собой» естественно выражает направленность восстановления отношений и контекстуальный возврат к действующему лицу.
- source_word: εἰρηνοποιήσας
  choice: установив мир
  rationale: Деепричастная конструкция передаёт аористное причастие и показывает, каким образом совершается примирение. «Установив мир» звучит естественно и не сводит смысл лишь к субъективному умиротворению.
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: через его кровь, пролитую на кресте
  rationale: Формулировка сохраняет конкретные образы крови и креста, но передаёт непривычное для современного русского сочетание «кровь его креста» ясным и естественным образом. Слово «пролитую» эксплицирует подразумеваемую связь крови с распятием, не заменяя кровь общим словом «смерть».
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: через него
  rationale: Повтор сохранён и выделен тире как возобновляющее и подчёркивающее уточнение; наличие разночтения отмечено в сноске.
- source_word: εἴτε ... εἴτε
  choice: будь то ... или
  rationale: Эта парная конструкция естественно передаёт исчерпывающее греческое сопоставление.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: то, что на земле
  rationale: Формулировка сохраняет предметно широкое значение среднего рода и космическое противопоставление земле и небесам.
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: то, что на небесах
  rationale: Множественное число «на небесах» соответствует греческому οὐρανοῖς и сохраняет библейскую космологическую образность.
theological_decisions:
- issue: Объём примирения в выражении τὰ πάντα
  choice: Всеобъемлющее «всё» сохранено без сужения значения и без утверждения всеобщего конечного спасения.
  alternative: «всех людей» или прямое истолкование как спасительного примирения каждого существа
  rationale: Сам стих связывает выражение с земным и небесным, поэтому его космическую широту следует сохранить. При этом он не уточняет, каким образом такое примирение соотносится с окончательным спасением личных существ.
- issue: К кому относится εἰς αὐτόν
  choice: «с собой» понимается как указание на Бога, примиряющего всё с собой через Сына.
  alternative: Мессия примиряет всё с самим собой.
  rationale: Синтаксически целевая конструкция продолжается из стиха 19, где подразумеваемым действующим лицом является Бог. Однако перевод не добавляет имени и сохраняет зависимость понимания от контекста.
- issue: Смысл выражения о крови и кресте
  choice: Сохранены конкретные упоминания крови и креста.
  alternative: Обобщающее «через его смерть на кресте».
  rationale: Греческий текст прямо называет кровь и крест. Их сохранение передаёт жертвенную и историческую силу высказывания, не навязывая отдельной теории искупления.
translation_notes:
  register: Современный литературный русский язык с достойным, но общедоступным звучанием. Синтаксис сохраняет связь с предшествующим стихом и намеренно оставляет начало как продолжение более длинного предложения. Местоимения, относящиеся к Богу и Сыну, даны со строчной буквы согласно современной редакционной практике; это не выражает богословской оценки.
