  text: и через него примирить с собой всё[a][b], установив мир кровью его креста, — через него[c] — будь то то, что на земле, или то, что на небесах[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В обоих случаях выражение «через него» можно также перевести как «посредством него».
    reason: lexical_alternative
  - marker: b
    text: Слово «всё» оставлено столь же широким, как в греческом тексте и в последующем пояснении «то, что на земле… то, что на небесах». Сам стих не уточняет, как это примирение соотносится с окончательным спасением.
    reason: alternative_reading
  - marker: c
    text: В некоторых рукописях второй оборот «через него» отсутствует.
    reason: textual_variant
  - marker: d
