  source_fidelity: 'Основной смысл передан верно: αὐτός подчеркнуто отнесено ко Христу, τὰ πάντα — ко «всему», ἐν αὐτῷ сохранено как «в Нём», а συνέστηκεν передано как продолжающееся состояние. Однако «прежде всего» в современном русском преимущественно означает «в первую очередь» или «главным образом» и неясно передаёт временное предшествование πρὸ πάντων.'
  naturalness: '«И Он — прежде всего, и всё в Нём держится» формально кратко, но первая часть звучит двусмысленно и неполно: читатель скорее поймёт её как утверждение первенства по важности. «Прежде всего сущего» — литературная, ясная и достаточно сжатая формулировка.'
  terminology: «Всё в Нём держится» удачно и современно передаёт συνέστηκεν без излишней систематизации смысла. Местоимение «Он» с прописной буквы соответствует заявленному издательскому регистру. В сноске следует также говорить о «предшествовании всему сущему», а не воспроизводить двусмысленное «прежде всего».
