  text: И Он — прежде всего сущего, и всё в Нём держится[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё в Нём существует»; или: «всё в Нём связано воедино».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: Он
  rationale: Самостоятельное местоимение и конструкция с тире передают позиционное усиление греческого αὐτός без тяжеловесного «Он Сам».
- source_word: πρὸ πάντων
  choice: прежде всего
  rationale: Предлог πρό с родительным падежом прежде всего указывает на предшествование. Русское выражение кратко сохраняет форму оригинала и не сводит смысл только к превосходству по положению.
- source_word: τὰ πάντα
  choice: всё
  rationale: Субстантивированное «всё» естественно и всеохватно передаёт τὰ πάντα, не сужая его до одной лишь формулировки «всё сотворённое».
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Сохранён предлог «в», поскольку греческое ἐν выражает отношение пребывания и поддерживающей связи; варианты «Им» и «через Него» были бы более толковательными.
- source_word: συνέστηκεν
  choice: держится
  rationale: Настоящее состояние, выраженное греческим перфектом, естественно передано глаголом настоящего времени. «Держится» ясно сообщает продолжающуюся целостность и устойчивость всего сущего.
theological_decisions:
- issue: Отношение Христа ко всему в выражении πρὸ πάντων
  choice: 'В основном тексте сохранено предшествование: «прежде всего».'
  alternative: «Выше всего», то есть превосходство по положению.
  rationale: Греческая конструкция непосредственно выражает приоритет, прежде всего временной, тогда как контекст допускает и смысл превосходства. Перевод не разворачивает это в догматический пересказ.
- issue: Смысл συνέστηκεν
  choice: 'Всё сохраняет целостность и устойчивость в Нём: «всё в Нём держится».'
  alternative: «Всё в Нём существует» или «всё в Нём связано воедино».
  rationale: Так передаётся нынешнее состояние, возникшее и сохраняющееся благодаря описанной связи со Христом, без чрезмерно технической или онтологически суженной формулировки.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным синтаксисом. Тире подчёркивает местоимение «Он», а повтор союза «и» сохраняет строение греческой фразы. Заглавные буквы в местоимениях относятся к принятому благоговейному издательскому регистру.
