revisions:
- from: И Он — прежде всего[a], и всё в Нём держится[b].
  to: И Он — прежде всего сущего, и всё в Нём держится[a].
  rationale: '«Прежде всего сущего» точно выражает πρὸ πάντων как предшествование всему, сохраняя возможный оттенок превосходства лишь в сноске. Сноски приведены к корректной привязке: текстовая сноска о συνέστηκεν поставлена после «держится», а примечание к πρὸ πάντων дано отдельной сноской b; поскольку в основном тексте она не обязательна для понимания и не должна разрывать короткую первую часть, её следует разместить после слова «сущего» в окончательной вёрстке: «И Он — прежде всего сущего[b], и всё в Нём держится[a]».'
  reviewer_model: gpt-5.6-terra
