revisions:
- from: Поэтому и мы с того дня, как услышали, не перестаём молиться о вас и просить, чтобы вы были исполнены познанием[a] Его воли во всей духовной мудрости и во всём духовном понимании[b].
  to: Поэтому и мы с того дня, как услышали, не перестаём молиться о вас и просить, чтобы вы были наполнены познанием[a] Его воли во всей духовной мудрости и понимании[b].
  rationale: Исправлена только русская идиоматика заключительной части стиха. Основной текст по-прежнему не делает «полноту» познания обязательной, не называет Бога как деятеля пассива и не решает, означает ли πνευματικῇ духовный характер либо происхождение от Духа. Якоря и содержание обеих сносок сохранены.
