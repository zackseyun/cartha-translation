  source_fidelity: 'Смысловые компоненты греческого текста переданы верно: причинный вывод, длительность молитвы, два связанных действия («молиться» и «просить»), пассивность πληρωθῆτε и неуточнённый смысл πνευματικῇ сохранены. Однако повтор «духовной/духовном» чрезмерно эксплицирует синтаксическое отнесение единственного греческого прилагательного и делает финальную фразу тяжеловесной.'
  naturalness: «Быть исполненными познанием» допустимо, но «быть наполненными познанием» заметно естественнее в современном литературном русском при сохранении пассивной конструкции. Сочетание «во всём духовном понимании» звучит неестественно; «во всей духовной мудрости и понимании» плавнее и не навязывает повторным согласованием отдельную квалификацию каждому существительному.
  terminology: «Познание», «воля», «мудрость» и «понимание» подходят по регистру и достаточно близки к ἐπίγνωσις, θέλημα, σοφία и σύνεσις. Сноски корректно сохраняют соответственно возможный усиленный оттенок ἐπίγνωσις и открытую связь πνευματικῇ с Духом.
