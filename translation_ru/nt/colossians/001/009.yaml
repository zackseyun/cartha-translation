id: COL.1.9
reference: Colossians 1:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: ru
  text: Поэтому и мы с того дня, как услышали, не перестаём молиться о вас и просить, чтобы вы были наполнены познанием[a] Его воли во всей духовной мудрости и понимании[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «полным познанием». Греческое слово может обозначать более полное или глубокое знание.
    reason: lexical_alternative
  - marker: b
    text: Слово «духовный» может указывать либо на характер мудрости и понимания, либо на то, что они дарованы Духом.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим сообщением о вере и любви колоссян.
- source_word: καὶ ἡμεῖς
  choice: и мы
  rationale: Сохраняет эмфатическое включение Павла и его сотрудников в описываемый отклик.
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: с того дня, как услышали
  rationale: Естественно по-русски обозначает начальную точку продолжающегося действия; подразумеваемое дополнение не вводится в текст.
- source_word: οὐ παυόμεθα
  choice: не перестаём
  rationale: Настоящее время передаёт непрерывность молитвы вплоть до момента речи.
- source_word: ὑπὲρ ὑμῶν
  choice: о вас
  rationale: Это обычное и естественное русское выражение для молитвы за благо других людей.
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: молиться о вас и просить
  rationale: Сохраняет различие между молитвой вообще и конкретным прошением, не делая сочетание тяжеловесным.
- source_word: ἵνα πληρωθῆτε
  choice: чтобы вы были исполнены
  rationale: Сохраняет пассивную форму и не называет прямо подразумеваемого деятеля — Бога.
- source_word: τὴν ἐπίγνωσιν
  choice: познанием
  rationale: Инструментальная конструкция естественно передаёт содержание наполнения; слово допускает оттенок полного или углублённого знания, отмеченный в сноске.
- source_word: τοῦ θελήματος αὐτοῦ
  choice: Его воли
  rationale: Прямо и естественно передаёт греческую родительную конструкцию.
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: во всей духовной мудрости и во всём духовном понимании
  rationale: Передаёт сферу или сопровождающий образ познания и ясно относит определение «духовный» к обоим существительным, не уточняя в основном тексте, означает ли оно качество или дар Духа.
- source_word: σοφίᾳ
  choice: мудрости
  rationale: Обычный русский эквивалент, охватывающий как богословскую, так и практическую мудрость.
- source_word: συνέσει
  choice: понимании
  rationale: Современное прозрачное слово для способности постигать смысл и взаимосвязи; естественно сочетается с «мудростью».
theological_decisions:
- issue: Смысл ἐπίγνωσις в молитве Павла
  choice: познание
  alternative: полное познание
  rationale: Слово может обозначать более полное или глубокое знание, но усиление не обязательно выражено настолько явно, чтобы закреплять его в основном тексте; оттенок сохранён в сноске.
- issue: Отнесение и смысл πνευματικῇ
  choice: «духовный» относится и к мудрости, и к пониманию, без прямого называния Святого Духа
  alternative: мудрость и понимание, даруемые Духом
  rationale: Позиция прилагательного допускает его отнесение к обоим существительным, однако греческая формулировка не снимает неоднозначности между духовным характером и происхождением от Духа.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис остаётся близким к греческому, но читается естественно; повторение «духовной/духовном» нужно для однозначного отнесения определения к обоим существительным.
