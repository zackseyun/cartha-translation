  source_fidelity: 'Причастие δυναμούμενοι стоит в настоящем времени страдательного залога: «укрепляясь» в русском обычно воспринимается как возвратная/средняя форма и способно представить действие как исходящее от самих адресатов. Нужна явно страдательная форма «укрепляемые». «Всякой силой», «по могуществу Его славы», «стойкость и долготерпение» в целом точно передают греческие соответствия; не следует добавлять «иметь», которого в тексте нет.'
  naturalness: «Укрепляемые всякой силой» ясно выражает зависимость от подразумеваемого Бога и остаётся естественным в современном литературно-библейском русском. «Чтобы иметь» излишне эксплицирует конструкцию цели и утяжеляет фразу; «для всякой стойкости и долготерпения» ближе к εἰς и достаточно естественно. Конечное «с радостью» оставлено без перестройки, чтобы не предрешать его связь с данным стихом либо с последующим благодарением.
  terminology: «Могущество» удачно отличает κράτος от ранее употреблённой δύναμις; «слава» и родительная конструкция «Его славы» сохранены. «Долготерпение» — несколько возвышенный, но понятный современному читателю термин и полезно сохраняет различие между ὑπομονή и μακροθυμία.
