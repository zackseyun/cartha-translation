lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει δυναμούμενοι
  choice: укрепляясь всякой силой
  rationale: Причастие настоящего времени передаёт продолжающееся укрепление, а пассивный залог подразумевает Бога как действующего. Творительный падеж естественно выражает средство или сферу укрепления; сочетание сохраняет повтор корня силы, хотя по-русски он менее заметен.
- source_word: κατὰ τὸ κράτος τῆς δόξης αὐτοῦ
  choice: по могуществу Его славы
  rationale: Предлог κατά выражает меру или соответствие. «Могущество» отличает κράτος от δύναμις, а родительная конструкция «Его славы» сохраняет плотную и несколько необычную формулировку греческого текста.
- source_word: εἰς πᾶσαν ὑπομονὴν
  choice: чтобы иметь всякую стойкость
  rationale: εἰς здесь указывает на цель или результат. «Стойкость» передаёт устойчивое перенесение испытаний; добавление «иметь» делает целевую связь естественной по-русски, не определяя её исключительно как цель либо результат.
- source_word: μακροθυμίαν
  choice: долготерпение
  rationale: «Долготерпение» сохраняет отличие от ὑπομονή и передаёт длительное терпение, нередко проявляемое по отношению к людям; слово остаётся понятным в современном литературном и библейском регистре.
- source_word: μετὰ χαρᾶς
  choice: с радостью
  rationale: Прямой и естественный эквивалент, сохраняющий существительное и возможную связь фразы как со стойкостью и долготерпением, так и с последующим контекстом.
theological_decisions:
- issue: Связь укрепления верующих с Божьей славой
  choice: «по могуществу Его славы»
  alternative: «по Его славному могуществу»
  rationale: Родительная конструкция сохраняет богословскую насыщенность и подлинную необычность греческого выражения, не сводя славу лишь к характеристике могущества.
- issue: Синтаксическая связь «с радостью»
  choice: Фраза оставлена в конце стиха без поясняющего расширения
  alternative: «радостно проявляя всякую стойкость и долготерпение»
  rationale: 'Так сохраняется возможная неоднозначность: μετὰ χαρᾶς естественно относится к стойкости и долготерпению, но пунктуация древней рукописной традиции не исключает связи с дальнейшим благодарением.'
translation_notes:
  register: Современный литературный русский с достоинством библейского регистра. «Долготерпение» сохранено как точный и всё ещё понятный термин; тяжеловесная, но значимая конструкция «могущество Его славы» оставлена и разъяснена в сноске.
