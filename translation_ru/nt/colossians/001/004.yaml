  text: услышав о вашей вере в Иисуса Мессию и о вашей любви ко всем святым.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о вашем доверии Иисусу Мессии»; возможно также: «о вашей верности Иисусу Мессии». Греческое слово πίστις в зависимости от контекста может означать веру, доверие или верность.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  choice: услышав о
  rationale: Деепричастие сохраняет связь аористного причастия с подразумеваемым субъектом предыдущего стиха; предлог «о» естественен в русском при сообщении о чьей-либо вере и любви.
- source_word: πίστιν
  choice: вере
  rationale: «Вера» — основное и контекстуально наиболее вероятное значение πίστις при ἐν Χριστῷ Ἰησοῦ; возможные оттенки доверия и верности отмечены в сноске.
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: в Иисуса Мессию
  rationale: В современном русском вера обычно направлена «в» кого-либо; порядок «Иисуса Мессию» естественно передаёт личное имя и переводит Χριστός как титул.
- source_word: ἀγάπην ἣν ἔχετε
  choice: о любви, которую вы питаете
  rationale: Сохраняется текстуально засвидетельствованное относительное предложение; «питаете любовь» естественно выражает устойчивое отношение, обозначенное ἔχετε.
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: ко всем святым
  rationale: При существительном «любовь» направление εἰς идиоматично передаётся конструкцией «любовь к»; «святые» сохраняет обычное павловское обозначение верующих.
theological_decisions:
- issue: Передача Χριστῷ как титула или имени
  choice: Иисуса Мессию
  alternative: Христа Иисуса
  rationale: Χριστός переведено как титул «Мессия», а Ἰησοῦ — как имя; русская конструкция после «вере в» требует винительного падежа.
- issue: Смысл πίστις в данном контексте
  choice: вера
  alternative: доверие; верность
  rationale: В контексте отношения адресатов к Иисусу Мессии «вера» наиболее естественна, но многозначность πίστις не устраняется и отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апостольского послания. Деепричастное начало намеренно продолжает синтаксис предыдущего стиха. Термин «святые» сохранён как ключевое павловское обозначение Божьего народа.
