  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: ru
  text: Теперь я радуюсь в своих страданиях за вас и в своей плоти восполняю недостающее в скорбях Мессии[a] ради его тела, то есть церкви.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «довожу до полноты то, чего недостаёт в скорбях Мессии». Формулировка сохраняет неоднозначность греческого текста; она не уточняет, в каком именно смысле эти скорби названы «недостающими».'
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: Теперь
  rationale: Кратко и естественно передаёт временной указатель, относящийся к нынешним обстоятельствам Павла.
- source_word: χαίρω ἐν τοῖς παθήμασιν
  choice: радуюсь в своих страданиях
  rationale: Сохраняет парадоксальную связь радости со страданиями; притяжательное «своих» естественно следует из первого лица и контекста.
- source_word: ὑπὲρ ὑμῶν
  choice: за вас
  rationale: Передаёт значение пользы и действия ради адресатов без излишне тяжеловесной конструкции.
- source_word: ἀνταναπληρῶ τὰ ὑστερήματα
  choice: восполняю то, чего недостаёт
  rationale: Сохраняет образ восполнения и напряжённую формулировку оригинала, не подменяя её заранее истолкованным выражением.
- source_word: τῶν θλίψεων
  choice: в скорбях
  rationale: Отличает θλίψεις от предшествующего παθήματα («страдания») и передаёт оттенок тягот и притеснений.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь сохраняет титульный смысл; «Мессия» ясно выражает его для современного русского читателя.
- source_word: ἐν τῇ σαρκί μου
  choice: в своей плоти
  rationale: Буквально сохраняет образ σάρξ как телесного существования Павла, не придавая слову значения «греховная природа».
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: ради Его тела
  rationale: Передаёт благотворно-целевое значение ὑπέρ и сохраняет метафору тела.
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: то есть церкви
  rationale: Естественно по-русски выражает пояснительное отождествление тела с церковью.
theological_decisions:
- issue: Что означает «то, чего недостаёт в скорбях Мессии»
  choice: 'Сохранить сильную и неоднозначную формулировку: Павел в собственной плоти восполняет недостающее в скорбях Мессии ради церкви.'
  alternative: Истолковать непосредственно в переводе как участие Павла в продолжающихся страданиях, связанных с миссией Мессии, либо как восполнение недостаточности искупительных страданий.
  rationale: Греческий текст не раскрывает здесь механизм этого «недостающего». Контекст тела-церкви поддерживает понимание служебного участия Павла в мессианских скорбях, однако перевод не должен устранять подлинное напряжение формулировки или приписывать тексту утверждение о недостаточности искупления.
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: В данном богословском высказывании слово сохраняет титульную силу; сноска сообщает более привычный церковный эквивалент.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной буквальностью. Сохранены повтор «ради/за», телесный образ «в плоти» и богословское напряжение выражения о недостающих скорбях; архаизмы и конфессионально окрашенные пояснения избегаются.
