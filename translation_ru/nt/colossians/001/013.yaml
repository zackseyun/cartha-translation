lexical_decisions:
- source_word: ἐρρύσατο
  choice: избавил
  rationale: Глагол ῥύομαι означает спасение или избавление от опасности либо враждебной силы. «Избавил» естественно звучит по-русски и передаёт решительное действие без добавления отсутствующих в тексте пояснений.
- source_word: ἐξουσίας
  choice: власти
  rationale: ἐξουσία обозначает власть, право распоряжаться или господство. «Власть» прямо передаёт смысл и сохраняет образ противостоящего господства.
- source_word: σκότους
  choice: тьмы
  rationale: σκότος буквально означает «тьма». Нравственные и духовные оттенки контекста оставлены неразвёрнутыми, как и в греческом тексте.
- source_word: μετέστησεν
  choice: перенёс
  rationale: μεθίστημι описывает перемещение из одного места, состояния или владения в другое. «Перенёс» ясно выражает переход из-под одной власти в другое Царство.
- source_word: βασιλείαν
  choice: Царство
  rationale: βασιλεία может обозначать царство или царствование. При εἰς и образе перемещения «Царство» естественно обозначает сферу правления Сына; прописная буква уместна для конкретного Божьего Царства.
- source_word: υἱοῦ
  choice: Сына
  rationale: υἱός буквально означает «сын». Прописная буква указывает на Христа в данном контексте, не меняя лексического значения.
- source_word: ἀγάπης
  choice: любви
  rationale: ἀγάπη передано обычным соответствием «любовь»; родительная конструкция греческого текста сохранена.
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: Сына Своей любви
  rationale: Буквальная родительная конструкция «Сын Его любви» в современном русском допускает неясную привязку местоимения. «Сына Своей любви» сохраняет необычную структуру оригинала и однозначно относит любовь к действующему Отцу; более идиоматические толкования вынесены в примечание.
theological_decisions:
- issue: Передача родительной конструкции τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: Сына Своей любви
  alternative: Своего возлюбленного Сына; Сына, Которого Он любит
  rationale: Основной текст сохраняет выразительную и богословски насыщенную конструкцию оригинала, не сводя её без необходимости к одному идиоматическому толкованию. Примечание показывает два естественных способа раскрыть её вероятный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Синтаксис краток и естественен; необычная греческая родительная конструкция намеренно сохранена в понятной русской форме. Местоимение «Своей» написано с прописной буквы согласно принятому благоговейному издательскому употреблению.
