  terminology: «Вера», «Благая весть» и «служитель» уместны. Родительный оборот «надежда Благой вести» намеренно сохранён в основном тексте, а его возможное истолкование вынесено в сноску. Для κτίσις сохранено «творение» с альтернативой «всякое создание/существо» в сноске. «Служитель» не навязывает понимания διάκονος как должности.
