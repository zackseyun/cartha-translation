language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: ru
  text: если вы действительно пребываете в вере, прочно утверждённые и непоколебимые, не отступая от надежды Благой вести[a], которую вы услышали и которая была возвещена во всём творении[b] под небом, — той Благой вести, служителем[c] которой стал я, Павел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от надежды, которую даёт Благая весть». Буквально: «от надежды Благой вести»; родительный оборот может обозначать надежду, связанную с Благой вестью или порождённую ею.'
    reason: Сохраняет в основном тексте компактный греческий родительный оборот и поясняет его возможные смысловые отношения, не закрепляя одно толкование.
  - marker: b
    text: 'Или: «среди всякого создания (существа) под небом». Греческое κτίσις может означать «творение» или, в зависимости от контекста, отдельное создание/существо.'
    reason: Отмечает лексическую неоднозначность κτίσις при сохранении более прямого общего значения «творение» в основном тексте.
  - marker: c
    text: 'Или: «слугой» или «служителем-проповедником». Греческое διάκονος обозначает того, кто служит, и само по себе не обязательно называет официальную церковную должность.'
    reason: Передаёт возможный диапазон διάκονος и не приписывает термину институциональный статус, отсутствующий в самом слове.
lexical_decisions:
- source_word: εἴ γε
  choice: если только
  rationale: Сохраняет реальное условие и усилительный оттенок γε, не превращая его ни в утверждение «поскольку», ни в жёсткую формулу угрозы.
- source_word: ἐπιμένετε τῇ πίστει
  choice: остаётесь в вере
  rationale: Передаёт продолжающееся пребывание в сфере веры; определённость греческого выражения естественно выражается по-русски без обязательного добавления «этой».
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: укоренённые и твёрдые
  rationale: «Укоренённые» естественно передаёт образ прочного основания и достигнутое состояние перфектного страдательного причастия; «твёрдые» сохраняет идею устойчивости.
- source_word: μὴ μετακινούμενοι
  choice: не отступаете
  rationale: Естественно выражает отсутствие смещения с занимаемого положения, сохраняя продолжающийся характер призыва.
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: от надежды, которую даёт Благая весть
  rationale: Развёртывание родительного оборота делает связь понятной современному читателю, не сводя её к единственно возможному логическому отношению.
- source_word: τοῦ κηρυχθέντος
  choice: возвещённая
  rationale: Передаёт публичное провозглашение без узкоцерковного оттенка слова «проповеданная».
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: среди всего творения под небом
  rationale: Сохраняет значение κτίσις как совокупного творения и конструкцию с ἐν; альтернативное понимание как «всякому творению» отмечено в сноске.
- source_word: διάκονος
  choice: служитель
  rationale: Передаёт служебную роль Павла по отношению к Благой вести без обязательного указания на формальную церковную должность.
theological_decisions:
- issue: Условный смысл εἴ γε и стойкость в вере
  choice: «если только вы остаётесь» как действительное условие
  alternative: «поскольку вы остаётесь» или формулировка, прямо предполагающая возможность утраты спасения
  rationale: Греческий текст связывает примирение и предстояние перед Богом с продолжением в вере, но сам стих не разрешает более широкий богословский спор о стойкости и отпадении.
- issue: Значение πίστις в τῇ πίστει
  choice: вера
  alternative: верность; доверие
  rationale: В данном контексте обычное значение «вера» наиболее вероятно и сохраняет как личное доверие, так и возможную отсылку к исповедуемой вере.
- issue: Референт οὗ перед ἐγενόμην
  choice: Благая весть
  alternative: возвещение или служение в более общем смысле
  rationale: Относительное местоимение естественнее всего относится к εὐαγγέλιον; перевод не добавляет институционального понимания служения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Благая весть» выбрана как ясная передача εὐαγγέλιον; синтаксис слегка перестроен ради естественности, но условие, образы устойчивости и универсальный размах возвещения сохранены.
