lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: благодаря
  rationale: Причастие настоящего времени продолжает синтаксическое течение предыдущего предложения; деепричастие сохраняет эту связь и длительный характер действия.
- source_word: τῷ πατρὶ
  choice: Отца
  rationale: Передаёт прямо названный в греческом тексте определённый родственный титул без добавления слова «Бог».
- source_word: ἱκανώσαντι
  choice: Который сделал … способными
  rationale: Глагол ἱκανόω означает сделать достаточным, пригодным или способным. Такое выражение естественно по-русски и не вносит оттенка человеческой заслуги, возможного у слова «удостоил».
- source_word: ὑμᾶς
  choice: вас
  rationale: Основной текст следует чтению SBLGNT ὑμᾶς; вариант ἡμᾶς отмечен в сноске.
- source_word: εἰς τὴν μερίδα
  choice: получить долю
  rationale: μερίς обозначает долю или часть; конструкция с εἰς выражает направленность к участию в ней. Добавление «получить» делает русскую фразу естественной, не меняя её смысла.
- source_word: τοῦ κλήρου
  choice: в наследии
  rationale: κλῆρος может означать жребий, удел или наследие. В данном контексте «наследие» ясно передаёт эсхатологический смысл и сохраняет ветхозаветный образ удела.
- source_word: τῶν ἁγίων
  choice: святых
  rationale: Традиционное и краткое обозначение посвящённого Богу народа, сохраняющее устойчивую лексику Павла.
- source_word: ἐν τῷ φωτί
  choice: во свете
  rationale: Сохраняет образ света и вероятную связь с долей или наследием святых, не уточняя сверх текста природу этого света.
theological_decisions:
- issue: Разночтение в объектном местоимении
  choice: вас
  alternative: нас
  rationale: В предоставленном тексте SBLGNT стоит ὑμᾶς («вас»). Значимое рукописное чтение ἡμᾶς («нас») сохранено в сноске.
- issue: Характер участия в наследии
  choice: сделал вас способными получить долю
  alternative: удостоил вас доли
  rationale: Выбранный вариант подчёркивает действие Отца и соответствие, созданное Им, не вводя возможного представления о награде за заслуги.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Деепричастие сохраняет связь с предшествующим контекстом; запятая в конце показывает, что предложение продолжается.
