  text: καὶ ὑμᾶς ποτε ὄντας ἀπηλλοτριωμένους καὶ ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς—
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/021.yaml
  text: And you[a], who once were alienated and hostile in mind in evil deeds—
translation:
  language: ru
  text: И вас, некогда отчуждённых и враждебно настроенных в мыслях, совершавших злые дела,[a] —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «враждебных в мыслях, в злых делах». Греческая конструкция кратка; она может описывать связь внутренней враждебности со злыми делами без уточнения её характера.'
    reason: лексическая и синтаксическая неоднозначность
lexical_decisions:
- source_word: ποτε
  choice: некогда
  rationale: Передаёт прежнее состояние адресатов и подготавливает контраст с последующим примирением.
- source_word: ὄντας
  choice: некогда отчуждённых
  rationale: Причастная конструкция естественно передана русским согласованным причастным оборотом при «вас».
- source_word: ἀπηλλοτριωμένους
  choice: отчуждённых
  rationale: Сохраняет значение устойчивого состояния отделённости и отчуждения.
- source_word: ἐχθροὺς
  choice: враждебных
  rationale: В сочетании с τῇ διανοίᾳ прилагательное естественнее русского существительного «врагов» и передаёт внутреннюю враждебность.
- source_word: τῇ διανοίᾳ
  choice: в мыслях
  rationale: Передаёт сферу внутреннего настроя; множественное число звучит по-русски естественно и не сводит значение только к интеллекту.
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: что проявлялось в злых делах
  rationale: Делает понятной вероятную связь внутренней враждебности с поступками, не превращая её в явно причинную связь.
- source_word: ἔργοις
  choice: делах
  rationale: Обычное современное обозначение поступков в данном нравственном контексте.
- source_word: πονηροῖς
  choice: злых
  rationale: Прямо и ясно сохраняет нравственную оценку исходного слова.
- source_word: καὶ ὑμᾶς
  choice: И вас
  rationale: Сохраняет связь с предыдущим контекстом и винительный падеж, синтаксически ожидающий продолжения в следующем стихе.
theological_decisions:
- issue: Связь внутренней враждебности со злыми делами
  choice: «что проявлялось в злых делах»
  alternative: «враждебных в мыслях среди злых дел»; «враждебных в мыслях из-за злых дел»
  rationale: Греческое ἐν допускает понимание сферы или проявления, но не требует причинного смысла. Формулировка сохраняет связь внутреннего состояния с внешним поведением, не утверждая, что дела были его причиной.
- issue: Незавершённость синтаксиса стиха
  choice: Сохранить тире в конце
  alternative: Завершить стих самостоятельным предложением
  rationale: Стих представляет собой часть предложения, продолжающегося в Кол 1:22; тире сохраняет это ожидание и соответствует источнику.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранена синтаксическая связь с последующим стихом; компактная греческая конструкция раскрыта минимально, а буквальная форма отмечена в сноске.
