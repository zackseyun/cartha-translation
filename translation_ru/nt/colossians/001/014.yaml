translation:
  language: ru
  text: В Котором мы имеем искупление[a], прощение грехов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «освобождение». И «искупление», и «прощение» могут передавать идею освобождения; по-видимому, здесь Павел словами «прощение грехов» уточняет, в чём состоит это искупление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: в Котором
  rationale: Относительное местоимение мужского рода относится к возлюбленному Сыну из предыдущего стиха. «В Котором» сохраняет личный и реляционный смысл греческого выражения, не сводя его к инструментальному «через Которого».
- source_word: ἔχομεν
  choice: мы имеем
  rationale: Настоящее время изъявительного наклонения прямо выражает нынешнее обладание названным благом; «мы имеем» естественно и точно передаёт форму оригинала.
- source_word: ἀπολύτρωσιν
  choice: искупление
  rationale: «Искупление» — естественный библейский и богословски содержательный эквивалент, сохраняющий значение освобождения, тогда как «освобождение» не передаёт всех смысловых ассоциаций слова в Павловом употреблении.
- source_word: ἄφεσιν
  choice: прощение
  rationale: В контексте грехов слово означает прощение. Эта именная группа стоит в приложении к «искуплению» и уточняет его содержание в данном месте.
- source_word: τῶν ἁμαρτιῶν
  choice: грехов
  rationale: Родительный падеж обозначает объект прощения. В русском языке форма без местоименного или иного уточнения естественно передаёт греческое выражение.
theological_decisions:
- issue: Соотношение «искупления» и «прощения грехов»
  choice: 'Передать вторую именную группу как приложение: «искупление, прощение грехов».'
  alternative: «искупление, то есть прощение грехов»
  rationale: Греческий текст ставит τὴν ἄφεσιν τῶν ἁμαρτιῶν в приложение к τὴν ἀπολύτρωσιν. Пунктуационное приложение сохраняет тесное отождествление и уточнение, не добавляя отсутствующего в оригинале пояснительного оборота «то есть».
translation_notes:
  register: Современный литературный русский язык с традиционно-библейским, но понятным словом «искупление». Заглавная буква в «Котором» указывает на Сына согласно принятой русской религиозной орфографической практике; она не устраняет грамматическую связь с предыдущим стихом.
