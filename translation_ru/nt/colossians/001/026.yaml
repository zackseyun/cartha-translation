  text: τὸ μυστήριον τὸ ἀποκεκρυμμένον ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν,— ⸀νῦν δὲ ἐφανερώθη τοῖς ἁγίοις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/026.yaml
  text: the mystery hidden from the ages and from the generations—but now revealed to his saints[b][a],
translation:
  language: ru
  text: тайну, скрытую от веков и поколений, — ныне же она явлена Его святым[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его святым людям». Здесь «святые» — принадлежащие Богу верующие, а не только особо почитаемые лица.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ μυστήριον
  choice: тайну
  rationale: «Тайна» естественно передаёт павловское обозначение Божьего замысла, прежде сокрытого, а теперь открытого; слово «секрет» звучало бы слишком бытово и сужало бы смысл.
- source_word: τὸ ἀποκεκρυμμένον
  choice: скрытую
  rationale: Причастие сохраняет значение совершившегося сокрытия и возникшего вследствие этого состояния, не утяжеляя русскую фразу.
- source_word: ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν
  choice: от веков и поколений
  rationale: Сохраняются повторяющаяся идея ἀπό и параллелизм двух временных обозначений; артикли по нормам русского языка отдельно не передаются.
- source_word: νῦν δὲ
  choice: ныне же
  rationale: «Ныне» поддерживает возвышенный, но понятный библейский регистр, а частица «же» подчёркивает контраст с прежним сокрытием.
- source_word: ἐφανερώθη
  choice: она явлена
  rationale: Личная конструкция делает конечную форму греческого пассивного аориста явной и не превращает её в зависимое причастие; «явлена» сохраняет торжественный оттенок и идею раскрытия.
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: Его святым
  rationale: «Святые» — укоренённое в русском библейском языке обозначение посвящённого Богу сообщества верующих; местоимение с прописной буквы ясно указывает на Бога в принятом русском религиозном письме.
theological_decisions:
- issue: Кого обозначают «Его святые»
  choice: Всё сообщество принадлежащих Богу верующих, а не особая позднее канонизированная группа.
  alternative: «Его святому народу» или «Его святым людям».
  rationale: В посланиях Павла οἱ ἅγιοι обычно обозначает верующих как отделённых для Бога. Основной вариант сохраняет значимый термин, а сноска предупреждает возможное узкое понимание.
- issue: Характер «тайны»
  choice: Божий замысел, прежде сокрытый и теперь открытый.
  alternative: Неизвестный людям эзотерический секрет.
  rationale: Противопоставление ἀποκεκρυμμένον и ἐφανερώθη внутри стиха определяет «тайну» как прежде скрытое, но ныне явленное, не устраняя содержательной напряжённости самого термина.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Тире сохраняет резкий переход от прежнего сокрытия к нынешнему откровению; конечная форма греческого глагола передана отдельным сказуемым.
