lexical_decisions:
- source_word: ὅτι
  choice: Ибо
  rationale: Союз вводит основание предшествующих утверждений о Сыне. «Ибо» естественно передаёт пояснительно-причинную связь, не сводя её к единственно возможному толкованию.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Местоимение отсылает к Сыну в ближайшем контексте. Перевод сохраняет местоименную форму греческого текста, не подставляя в сам стих титулы «Христос» или «Мессия».
- source_word: εὐδόκησεν
  choice: было угодно
  rationale: Безличная русская конструкция передаёт благоволение и намерение, при этом не называет прямо того, кому было угодно, поскольку в греческом подлежащее глагола явно не выражено.
- source_word: πᾶν τὸ πλήρωμα
  choice: вся полнота
  rationale: Так сохраняются и обобщающая сила πᾶν, и богословски значимое существительное πλήρωμα без добавления отсутствующих в стихе слов «Божья» или «Бога».
- source_word: κατοικῆσαι
  choice: обитала
  rationale: Глагол обозначает пребывание, поселение или постоянное обитание. «Обитала» звучит естественно и сохраняет возвышенный тон высказывания.
theological_decisions:
- issue: Невыраженное подлежащее εὐδόκησεν
  choice: Оставить того, кому «было угодно», неназванным посредством безличной конструкции.
  alternative: «Ибо Богу было угодно, чтобы в Нём обитала вся полнота» или «Ибо Отцу было угодно…»
  rationale: Греческий текст прямо не называет ни Бога, ни Отца подлежащим εὐδόκησεν. Распространённое контекстуальное понимание отмечено в сноске, но не внесено в основной текст.
- issue: Смысл выражения πᾶν τὸ πλήρωμα
  choice: Передать как «вся полнота», не раскрывая дополнение.
  alternative: «вся полнота Бога» или «вся Его полнота»
  rationale: Контекст, особенно Колоссянам 2:9, указывает на полноту Божества, однако в данном стихе соответствующее определение отсутствует. Нерасширенный перевод сохраняет и богословскую весомость, и формальную открытость выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Безличное «было угодно» понятно современному читателю и позволяет не вводить отсутствующее в греческом тексте подлежащее. Написание «Нём» с прописной буквы следует принятой русской библейской практике для местоименного указания на Сына.
