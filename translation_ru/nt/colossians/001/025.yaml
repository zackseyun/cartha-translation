    rationale: Русский глагол «исполнить» с дополнением «слово Божье/Бога» обычно означает исполнить заповедь или повиноваться сказанному Богом. В греческом объектом действия является провозглашаемое Божье слово; в контексте ближайших стихов речь идёт о его полном возвещении/раскрытии. Поэтому исходный вариант может быть понят как призыв к послушанию, чего в тексте нет.
