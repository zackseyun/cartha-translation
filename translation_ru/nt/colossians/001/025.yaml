  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: ru
  text: которой я стал служителем согласно поручению от Бога, данному мне для вас, чтобы во всей полноте возвестить слово Божье[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы довести слово Божье до полноты»; букв. «чтобы исполнить слово Божье».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: которой
  rationale: Относительное местоимение женского рода относится к слову ἐκκλησία («церковь») в предыдущем стихе; русское «которой» естественно связывает служение Павла с церковью.
- source_word: ἐγενόμην ἐγὼ διάκονος
  choice: я стал служителем
  rationale: Передаёт вступление Павла в роль служителя, не превращая διάκονος в название позднейшей церковной должности.
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι
  choice: по поручению от Бога, вверенному мне
  rationale: В данном контексте οἰκονομία обозначает доверенную ответственность или управление. «Поручение» понятно современному читателю, а «вверенному» сохраняет идею доверенного служения; «от Бога» передаёт источник поручения.
- source_word: εἰς ὑμᾶς
  choice: ради вас
  rationale: Выражает направленность и благотворную цель данного Павлу поручения по отношению к адресатам.
- source_word: πληρῶσαι
  choice: исполнить
  rationale: 'Сохраняет широту и неоднозначность глагола: речь может идти о полном возвещении, осуществлении поручения или доведении Божьего слова до полноты. Более узкие толкования вынесены в сноску.'
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: слово Бога
  rationale: Передаёт Божье откровение и возвещаемую весть, сохраняя библейскую формулировку и межтекстовые связи.
theological_decisions:
- issue: Смысл выражения πληρῶσαι τὸν λόγον τοῦ θεοῦ
  choice: исполнить слово Бога
  alternative: возвестить слово Бога во всей полноте; довести слово Бога до завершения
  rationale: Основной вариант не сводит смысл исключительно к проповеди или к завершению откровения и сохраняет напряжение между возможными оттенками греческого выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством и без узкоконфессиональной терминологии. «Поручение» выбрано вместо архаичного «домостроительство», а «служитель» — вместо должностного «диакон».
