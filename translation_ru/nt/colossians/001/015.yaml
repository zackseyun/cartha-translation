lexical_decisions:
- source_word: ὅς ἐστιν
  choice: Он —
  rationale: Относительное местоимение относится к Сыну в предыдущем стихе. Начало нового русского предложения с личного местоимения естественно; именное сказуемое в настоящем времени передано тире без избыточного «есть».
- source_word: εἰκὼν
  choice: образ
  rationale: «Образ» прямо передаёт значение εἰκών и сохраняет как идею явления невидимого Бога, так и более глубокий смысл отношения Сына к Богу, не сводя его к простому внешнему сходству.
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: невидимого Бога
  rationale: Естественная русская атрибутивная конструкция, точно передающая греческую группу в родительном падеже.
- source_word: πρωτότοκος
  choice: первенец
  rationale: «Первенец» сохраняет библейскую метафору, которая может включать первенство, достоинство и права наследника. Перевод непосредственно как «главнее всех» был бы толкованием вместо перевода.
- source_word: πάσης κτίσεως
  choice: всего творения
  rationale: Родительный падеж прямо отражает греческую конструкцию и сохраняет её подлинную смысловую напряжённость. Значение превосходства над творением не внесено в основной текст, но поясняется в сноске с учётом ближайшего контекста.
theological_decisions:
- issue: Смысл выражения πρωτότοκος πάσης κτίσεως и отношение Сына к творению
  choice: первенец всего творения
  alternative: первенец над всем творением
  rationale: Основной текст сохраняет форму греческого родительного падежа, не разрешая переводом спор о точном оттенке отношения. При этом слово «первенец» в библейском употреблении может обозначать ранг и наследственное достоинство, а стихи 16–17 представляют Сына как того, через кого и для кого всё сотворено и кто существует прежде всего. Поэтому сноска предохраняет от слишком узкого понимания выражения как утверждения, будто Сын является частью творения, не подменяя сам текст догматическим пересказом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Тире вместо «есть» соответствует нормальному русскому именному предложению. Выражение «первенец всего творения» намеренно оставлено компактным и традиционно узнаваемым; пояснение помещено при самой спорной фразе, а не после слов «невидимого Бога».
