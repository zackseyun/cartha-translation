  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: ru
  text: И Он — глава тела, Церкви. Он — начало[a], первенец из мёртвых, чтобы Он Сам стал первым во всём[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «источник»; возможно также: «властитель».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы Он Сам занимал первое место во всём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: Он / Он Сам
  rationale: Местоимение имеет усилительный оттенок. В начале стиха он естественно передаётся конструкцией «И Он», а в заключительной цели — «Он Сам», что сохраняет явное смысловое ударение.
- source_word: κεφαλή
  choice: глава
  rationale: «Глава» прямо сохраняет метафору Христа и тела, не сводя её исключительно к значению власти или источника.
- source_word: σῶμα
  choice: тело
  rationale: Стандартное и естественное соответствие, сохраняющее корпоративную метафору в сочетании со словом «глава».
- source_word: ἐκκλησία
  choice: Церковь
  rationale: В данном христологическом контексте речь идёт о сообществе Божьего народа как теле Христа; «Церковь» является точным и привычным обозначением.
- source_word: ἀρχή
  choice: начало
  rationale: В сочетании с выражением «первенец из мёртвых» слово указывает на Христа как начало воскресения и нового порядка жизни. Перевод сохраняет многозначность греческого слова; возможные значения отмечены в сноске.
- source_word: πρωτότοκος
  choice: первенец
  rationale: Сохраняет лексическую форму и библейские ассоциации слова, включающего оттенки как первенства по последовательности, так и превосходства по положению.
- source_word: ἐκ τῶν νεκρῶν
  choice: из мёртвых
  rationale: Устоявшееся и естественное русское выражение для языка воскресения, соответствующее греческой конструкции.
- source_word: ἵνα γένηται
  choice: чтобы … стал
  rationale: Передаёт целевой или результативный оттенок ἵνα и динамическое значение γένηται, не заменяя его простым состоянием «был».
- source_word: ἐν πᾶσιν
  choice: во всём
  rationale: Естественно передаёт нейтральное множественное число и сохраняет широкий, космический охват контекста.
- source_word: πρωτεύων
  choice: первым
  rationale: В конструкции «стал первым во всём» кратко и естественно передаёт значение обладания первым местом; более развёрнутый вариант дан в сноске.
theological_decisions:
- issue: Значение κεφαλή в образе Христа и тела
  choice: Сохранить метафору «глава», не уточняя её как исключительно власть или источник.
  alternative: «руководитель тела» или «источник тела»
  rationale: Греческий образ богаче любого одного толкования. Его прямое сохранение не разрешает спорный богословский вопрос средствами перевода.
- issue: Значение ἀρχή в связи с воскресением и новым творением
  choice: «начало»
  alternative: «источник» или «властитель»
  rationale: Ближайшая фраза «первенец из мёртвых» поддерживает значение начала нового порядка воскресения, однако многозначность слова остаётся подлинной и отмечена в сноске.
- issue: Смысл πρωτότοκος ἐκ τῶν νεκρῶν
  choice: Сохранить выражение «первенец из мёртвых» как язык первенства в воскресении.
  alternative: «первый воскресший из мёртвых»
  rationale: «Первенец» сохраняет библейскую образность и оттенок превосходства, тогда как пояснительный вариант чрезмерно сужает слово до одной лишь временной последовательности.
- issue: Смысл γένηται в заключительной цели
  choice: «стал первым»
  alternative: «был первым» или «занимал первое место»
  rationale: Форма γένηται имеет динамический смысл «стать», а контекст связывает это выражение с воскресением и явленным первенством Христа, не утверждая возникновения его божественного достоинства.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Тире делает именные конструкции ясными и естественными. Прописная буква в слове «Церковь» подчёркивает конкретное сообщество как тело Христа, а не здание; местоимения о Христе написаны с прописной буквы в соответствии с принятой русской благоговейной традицией. Маркеры сносок помещены непосредственно после слов и выражений, к которым относятся.
