reference: Colossians 1:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: ru
  text: 'Ибо в Нём было сотворено всё[a] — на небесах и на земле, видимое и невидимое: престолы ли, господства ли, начальства ли, власти ли; всё сотворено через Него и для Него[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что в Нём было сотворено всё».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «к Нему»; выражение указывает на Него как на цель творения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: потому что
  rationale: Передаёт причинную связь с предшествующим утверждением; в русском синтаксисе здесь естественно продолжение со строчной буквы.
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Сохраняет значение ἐν и отличие от последующего δι’ αὐτοῦ («через Него»), не сводя обе формулы к инструментальному «Им».
- source_word: ἐκτίσθη / ἔκτισται
  choice: было сотворено / сотворено
  rationale: Первый глагол передаёт аорист как событие творения, второй перфект — как совершившийся факт с сохраняющимся результатом; по-русски это различие выражено сочетанием «было сотворено» и краткой формой «сотворено».
- source_word: τὰ πάντα
  choice: всё
  rationale: Естественное и всеохватное русское соответствие, не добавляющее толкования вроде «вся вселенная».
- source_word: ἐν τοῖς οὐρανοῖς καὶ ἐπὶ τῆς γῆς
  choice: на небесах и на земле
  rationale: Сохраняет множественное число οὐρανοῖς и естественно передаёт космический охват выражения.
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: видимое и невидимое
  rationale: Субстантивированные прилагательные переданы столь же краткой и ясной русской парой.
- source_word: εἴτε ... εἴτε ... εἴτε ... εἴτε
  choice: престолы ли, господства ли, начальства ли, власти ли
  rationale: Повтор частицы «ли» естественно воспроизводит перечислительную и всеохватную силу греческой конструкции.
- source_word: θρόνοι
  choice: престолы
  rationale: Прямой традиционно понятный эквивалент, сохраняющий образ без уточнения природы этих сил.
- source_word: κυριότητες
  choice: господства
  rationale: Передаёт категорию владычества и сохраняет различие между четырьмя терминами; не уточняет, ангельские это или земные структуры.
- source_word: ἀρχαί
  choice: начальства
  rationale: Передаёт смысл правящих начал и сохраняет терминологическое отличие от ἐξουσίαι.
- source_word: ἐξουσίαι
  choice: власти
  rationale: Прямой и понятный русский эквивалент для носителей или структур власти.
- source_word: δι’ αὐτοῦ καὶ εἰς αὐτόν
  choice: через Него и для Него
  rationale: «Через» передаёт посредничество, а «для» ясно выражает направленность и цель εἰς, сохраняя различие предлогов.
theological_decisions:
- issue: Соотношение формул ἐν αὐτῷ / δι’ αὐτοῦ / εἰς αὐτόν
  choice: «в Нём … через Него и для Него»
  alternative: «Им … через Него и к Нему»
  rationale: 'Разные греческие предлоги намеренно сохранены: Сын представлен в связи с творением как его сфера или основание, посредник и цель. Перевод не сглаживает эту многослойность.'
- issue: Природа «престолов, господств, начальств и властей»
  choice: Оставить названия разрядов без поясняющего определения
  alternative: «ангельские чины» или «земные правители»
  rationale: Сам стих не ограничивает эти категории исключительно духовными либо земными властями, поэтому перевод не навязывает конкретную онтологию.
- issue: Значение εἰς αὐτόν
  choice: «для Него»
  alternative: «к Нему»
  rationale: В контексте творения εἰς указывает на конечную направленность и цель. «Для Него» естественно выражает это по-русски, а буквальная альтернатива указана в примечании.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным библейским регистром. Заглавные буквы в местоимениях, относящихся к Сыну, применены как русская издательская норма благоговейного стиля. Единое предложение и точка с запятой сохраняют структуру греческого текста; двоеточие делает перечень читаемым.
