base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: ru
  text: Дети, слушайтесь своих родителей во всём, ибо это угодно Господу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в Господе». Это может означать, что такое послушание угодно в сфере отношений с Господом или в единении с Ним; возможно также понимание: «угодно Господу».'
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: Дети
  rationale: τέκνα — обычное обозначение детей, без ограничения по полу; форма прямого обращения естественно передаётся словом «Дети».
- source_word: ὑπακούετε
  choice: слушайтесь
  rationale: Повелительная форма ὑπακούω означает повиноваться, слушаться. В обращении к детям «слушайтесь» звучит естественно и сохраняет требование послушания.
- source_word: τοῖς γονεῦσιν
  choice: своих родителей
  rationale: γονεῖς означает обоих родителей. Местоимение «своих» естественно для русского языка и передаёт подразумеваемое отношение детей к родителям, не добавляя нового участника.
- source_word: κατὰ πάντα
  choice: во всём
  rationale: Оборот выражает полноту или сферу послушания — «во всём», а не временное значение «всегда».
- source_word: τοῦτο
  choice: это
  rationale: Указательное местоимение отсылает к только что данному повелению и сохраняет структуру греческой фразы.
- source_word: γὰρ
  choice: ибо
  rationale: γάρ вводит основание повеления. «Ибо» ясно передаёт причинно-пояснительную связь и соответствует достойному литературному регистру.
- source_word: εὐάρεστόν ἐστιν
  choice: угодно
  rationale: εὐάρεστος обозначает то, что приятно, угодно или приемлемо. «Угодно» естественно в данном религиозно-нравственном контексте.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Буквальное и характерное для Павла выражение сохраняет возможное значение сферы или отношений с Господом и не сужает его до однозначного «Господу».
theological_decisions:
- issue: Связь выражения «во всём» с фразой «в Господе»
  choice: Обе фразы сохранены без добавленного ограничения; «в Господе» грамматически оставлено при утверждении о том, что угодно.
  alternative: 'Понимать «в Господе» как прямое ограничение повеления: слушаться во всём, что согласно воле Господа.'
  rationale: Греческий текст не содержит явной оговорки после κατὰ πάντα и не связывает ἐν κυρίῳ непосредственно с повелительным глаголом. Перевод не добавляет отсутствующего уточнения и сохраняет богословское напряжение.
- issue: Значение ἐν κυρίῳ при εὐάρεστόν ἐστιν
  choice: «угодно в Господе» — то есть угодно в сфере отношений с Господом или в единении с Ним.
  alternative: «угодно Господу» — Господь понимается как тот, кому это угодно.
  rationale: Предлог ἐν буквально выражает «в», однако в контексте возможно смысловое сближение с указанием на того, кому угодно действие. Основной текст сохраняет форму оригинала, а примечание сообщает естественную альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным союзом «ибо». Формулировка «слушайтесь своих родителей» естественна для семейного наставления; необычность оборота «угодно в Господе» сознательно сохранена ради смысловой открытости греческого ἐν κυρίῳ и пояснена в сноске.
