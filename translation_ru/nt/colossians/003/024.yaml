  text: εἰδότες ὅτι ἀπὸ κυρίου ⸀ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· ⸀τῷ κυρίῳ Χριστῷ δουλεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: ru
  text: зная, что от Господа вы получите в награду наследие[a]. Вы служите Господу Мессии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «воздаяние наследия»; то есть наследие, получаемое в награду.'
    reason: Сохранение компактного и допускающего разные способы истолкования греческого родительного оборота.
  - marker: b
    text: 'Или, в традиционной передаче: «Господу Христу». Глагол стоит в изъявительном наклонении: «вы служите», а не в повелительном: «служите».'
    reason: Альтернативная передача титула Χριστός и пояснение грамматической формы δουλεύετε.
lexical_decisions:
- source_word: εἰδότες
  choice: зная
  rationale: Деепричастие сохраняет связь с предшествующим наставлением и не делает причинный оттенок более явным, чем в греческом тексте.
- source_word: ἀπὸ κυρίου
  choice: от Господа
  rationale: Предлог ἀπό с родительным падежом указывает на источник; «Господь» сохраняет здесь христологический титул.
- source_word: ἀπολήμψεσθε
  choice: вы получите
  rationale: Будущее время изъявительного наклонения передано естественным русским эквивалентом; оттенок получения в ответ выражен сочетанием «в награду».
- source_word: ἀνταπόδοσιν τῆς κληρονομίας
  choice: в награду наследие
  rationale: Формулировка естественна по-русски и передаёт воздаяние, состоящее в наследии, не сводя κληρονομία к обычному имуществу.
- source_word: τῷ κυρίῳ Χριστῷ
  choice: Господу Мессии
  rationale: Дательный падеж обусловлен глаголом δουλεύετε; Χριστός передан как титул «Мессия», а κύριος — как «Господь».
- source_word: δουλεύετε
  choice: вы служите
  rationale: Греческая форма — настоящее время изъявительного наклонения, второе лицо множественного числа; перевод сохраняет утверждение, а не превращает его в прямое повеление.
theological_decisions:
- issue: Смысл родительного оборота τῆς κληρονομίας
  choice: «в награду наследие» — награда состоит в наследии
  alternative: «воздаяние наследия»
  rationale: Русская буквальная калька неясна и неестественна; выбранный вариант ясно передаёт наиболее вероятное отношение, а буквальное строение отмечено в сноске.
- issue: Значение Χριστῷ как титула
  choice: Мессии
  alternative: Христу
  rationale: В сочетании «Господь Мессия» титульное значение Χριστός остаётся явным; традиционный вариант приведён в сноске.
- issue: Наклонение δουλεύετε
  choice: 'изъявительное: «вы служите»'
  alternative: 'побудительное по смыслу: «служите»'
  rationale: Морфологически это форма изъявительного, а не повелительного наклонения; она напоминает адресатам, кому в действительности направлено их служение.
translation_notes:
  register: Современный литературный русский язык с достоинством новозаветного наставления. Порядок «от Господа вы получите» сохраняет акцент на источнике награды; «наследие» выбрано вместо бытового «наследство». Начальное «зная» предполагает синтаксическое продолжение предыдущего стиха, как и греческий причастный оборот.
