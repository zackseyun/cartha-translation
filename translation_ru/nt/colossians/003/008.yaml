source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: ru
  text: 'А теперь и вы отложите всё это: гнев, ярость, злобу, клевету и непристойную речь из ваших уст.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: отложите
  rationale: Образ снятия и откладывания сохраняет метафору греческого текста и естественно связывает стих с контекстом прежнего образа жизни.
- source_word: ὀργήν
  choice: гнев
  rationale: Обычное и широкое обозначение гнева; позволяет отличить его от следующего, более вспыльчивого θυμός.
- source_word: θυμόν
  choice: ярость
  rationale: Передаёт сильную, бурную вспышку гнева и сохраняет смысловое различие между двумя соседними словами.
- source_word: κακίαν
  choice: злобу
  rationale: В данном перечне пороков слово естественно обозначает злонамеренность и недоброжелательность, а не зло вообще.
- source_word: βλασφημίαν
  choice: клевету
  rationale: В контексте человеческой речи означает порочащие, оскорбительные высказывания; «клевета» кратко и понятно передаёт эту направленность.
- source_word: αἰσχρολογίαν
  choice: непристойные речи
  rationale: Передаёт постыдную, непристойную речь без неоправданного сужения только до ругани или сексуальной лексики.
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: ваших уст
  rationale: Сохраняет буквальный образ источника речи и достоинство библейского регистра, оставаясь понятным современному читателю.
theological_decisions:
- issue: Сила повеления ἀπόθεσθε
  choice: повелительное «отложите»
  alternative: модальное «вы должны отбросить»
  rationale: Греческая форма является прямым императивом; перевод не ослабляет и не усиливает нравственное требование.
- issue: Значение βλασφημία в перечне межличностных пороков
  choice: клевету
  alternative: хулу / оскорбления
  rationale: Контекст речи, исходящей из уст верующих, поддерживает межличностное значение, однако перевод не вводит специального богословского смысла богохульства, которого объект в стихе не требует.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис следует греческому перечислению; различие между ὀργή и θυμός передано парой «гнев, ярость». Маркеры сносок не требуются.
