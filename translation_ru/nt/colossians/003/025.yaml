base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/025.yaml
  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: ru
  text: Ведь кто совершает несправедливость, получит воздаяние за совершённую им несправедливость[a], и здесь нет лицеприятия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «получит обратно то зло, которое совершил».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть нет пристрастия или предпочтения по положению либо внешнему статусу человека; буквально: «принятие лица».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: Ведь тот, кто поступает несправедливо
  rationale: Субстантивированное причастие обозначает всякого человека, совершающего несправедливость; конструкция «тот, кто» естественно передаёт обобщённый смысл, а «ведь» — пояснительную функцию γάρ.
- source_word: κομίσεται
  choice: получит за
  rationale: Будущая форма κομίσεται указывает на получение должного воздаяния. «Получит за» ясно передаёт смысл возмездия, не уточняя его механизм или время сверх сказанного в тексте.
- source_word: ὃ ἠδίκησεν
  choice: за ту несправедливость, которую совершил
  rationale: Формулировка сохраняет лексическую связь с ἀδικῶν и представляет совершённое зло как то, за что человек получит воздаяние.
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: лицеприятия нет
  rationale: «Лицеприятие» точно и достойно передаёт προσωπολημψία — пристрастное отношение, обусловленное положением или внешним статусом человека; выражение остаётся понятным в современном литературном русском.
theological_decisions:
- issue: Характер суда и беспристрастного воздаяния
  choice: 'Стих выражает общий принцип: совершающий несправедливость получит за неё, а лицеприятия нет.'
  alternative: Понимать слова исключительно как указание на эсхатологический суд либо ограничивать их только отношениями рабов и господ.
  rationale: Греческий текст не уточняет ни время, ни механизм воздаяния и формулирует принцип широко; перевод не сужает это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством назидательного предупреждения. Конструкция «тот, кто» сохраняет обобщённость греческого мужского единственного числа без ненужного акцента на биологическом поле; «лицеприятие» выбрано как точный библейско-литературный термин, пояснённый в сноске.
