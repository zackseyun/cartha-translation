id: COL.3.15
reference: Colossians 3:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἡ εἰρήνη τοῦ ⸀Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: ru
  text: И пусть мир Мессии[a] правит[b] в ваших сердцах; к этому миру вы и были призваны в одном теле[c]. И будьте благодарны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мир Христа». Греческое Χριστός — титул со значением «Помазанник»; его можно передать словами «Мессия» или «Христос».'
    reason: lexical_alternative
  - marker: b
    text: Глагол может также означать «выступать судьёй», «быть арбитром» или «решать», представляя мир Мессии как определяющее начало во внутренней и общинной жизни.
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «в одно тело», с акцентом на соединении призванных в единое тело.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: мир
  rationale: Обычный и естественный русский эквивалент, передающий как отсутствие вражды, так и согласие внутри общины.
- source_word: τοῦ Χριστοῦ
  choice: Мессии
  rationale: Χριστός здесь сохраняет титульный смысл — «Помазанник»; «Мессия» передаёт его в естественной для современного русского языка форме.
- source_word: βραβευέτω
  choice: пусть ... правит
  rationale: Глагол обозначает решающее, направляющее действие и может вызывать образ судьи или арбитра; «правит» естественно передаёт его повелительную и руководящую силу.
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: в ваших сердцах
  rationale: Сохраняется множественное число и традиционный, понятный образ внутренней жизни, воли и чувств; контекст также допускает общинное измерение.
- source_word: εἰς ἣν
  choice: к этому миру
  rationale: Явно обозначен антецедент относительного местоимения, чтобы русская фраза была ясной; предлог εἰς передаёт мир как цель призвания.
- source_word: καὶ ἐκλήθητε
  choice: вы и были призваны
  rationale: Частица «и» естественно передаёт усилительное значение καί в русском порядке слов.
- source_word: ἐν ἑνὶ σώματι
  choice: в одном теле
  rationale: Сохраняются предлог ἐν, числительное «одно» и метафора тела без поясняющего добавления «церковь».
- source_word: εὐχάριστοι γίνεσθε
  choice: будьте благодарны
  rationale: Естественное русское увещание, передающее требуемое состояние; буквальное «становитесь благодарными» здесь звучало бы тяжелее и могло бы неоправданно подчёркивать постепенность.
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Основной текст передаёт титульное значение греческого слова, а традиционный вариант «Христа» сохраняется в примечании как допустимая русская передача.
- issue: Смысл выражения «одно тело»
  choice: Сохранить метафору без расшифровки
  alternative: Явно пояснить как церковь или общину
  rationale: Контекст подразумевает единство общины, однако сам стих говорит образно; перевод не устраняет эту образность и не добавляет отсутствующее в тексте существительное.
- issue: Направленность εἰς ἣν
  choice: Мир как цель призвания
  alternative: Вхождение в мир как сферу
  rationale: Форма допускает оттенки цели и направленности; основной текст использует нейтральное «к этому миру», не превращая его в более определённое толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис краток и понятен; метафоры «сердца» и «одно тело» сохранены. Повтор «к этому миру» употреблён ради ясности референции относительного местоимения.
