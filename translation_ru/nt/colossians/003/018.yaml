  text: Αἱ γυναῖκες, ὑποτάσσεσθε ⸀τοῖς ἀνδράσιν, ὡς ἀνῆκεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/018.yaml
  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: ru
  text: Жёны, подчиняйтесь[a] своим мужьям, как подобает[b] в Господе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будьте покорны».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как подобало в Господе»; греческий глагол стоит в форме прошедшего времени, но здесь, вероятно, выражает общее, сохраняющее силу правило.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αἱ γυναῖκες
  choice: Жёны
  rationale: В контексте наставлений семье и в паре с τοῖς ἀνδράσιν слово γυνή обозначает замужних женщин, а не женщин вообще.
- source_word: ὑποτάσσεσθε
  choice: подчиняйтесь
  rationale: Настоящее повелительное среднего/страдательного залога призывает занимать подчинённое положение в указанных отношениях. Возвратная форма русского глагола естественно передаёт направленность действия самих жён, не превращая призыв в пассивное «быть подчинёнными».
- source_word: τοῖς ἀνδράσιν
  choice: своим мужьям
  rationale: В семейном контексте ἀνήρ означает «муж». Местоимение «своим» естественно выражает подразумеваемое отношение между супругами.
- source_word: ὡς
  choice: как
  rationale: Союз вводит меру или характеристику подобающего поведения, а не однозначно причинное обоснование.
- source_word: ἀνῆκεν
  choice: подобает
  rationale: Хотя греческая форма морфологически является имперфектом, в этом нравственном наставлении она, вероятнее всего, выражает общую норму с силой настоящего времени. «Подобает» сохраняет этический оттенок уместности и соответствует достоинству регистра.
- source_word: ἐν κυρίῳ
  choice: в Господе
  rationale: Буквальная и естественная передача сохраняет связь подобающего поведения с отношением к Господу, не разворачивая краткую фразу в толкование.
theological_decisions:
- issue: Пределы и основание призыва
  choice: Фраза «как подобает в Господе» сохранена как богословское уточнение самого призыва.
  alternative: Понимать наставление как безусловную общественную норму либо связывать «в Господе» только с жёнами.
  rationale: Расположение ἐν κυρίῳ связывает уместность наставления с Господом. Перевод сохраняет это ограничивающее и определяющее уточнение, не добавляя отсутствующих в стихе выводов.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и понятным синтаксисом. «Подобает» слегка возвышенно, но общеупотребительно в нравственном наставлении; формулировка не усиливает и не ослабляет напряжение исходного текста.
