  text: ἀνεχόμενοι ἀλλήλων καὶ χαριζόμενοι ἑαυτοῖς ἐάν τις πρός τινα ἔχῃ μομφήν· καθὼς καὶ ὁ ⸀κύριος ἐχαρίσατο ὑμῖν οὕτως καὶ ὑμεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/013.yaml
  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: ru
  text: С терпением относитесь друг к другу и прощайте друг друга, если у кого есть претензия к кому-либо[a]; подобно тому как Господь простил вас, так и вы прощайте[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если кто имеет жалобу на кого-либо».'
    reason: Лексема μομφή может обозначать претензию, жалобу или основание для упрёка.
  - marker: b
    text: 'В греческом: «так и вы»; глагол «прощайте» подразумевается из контекста.'
    reason: Отмечает сохранённый в оригинале эллипсис, который в основном тексте раскрыт ради естественности русского языка.
lexical_decisions:
- source_word: ἀνεχόμενοι ἀλλήλων
  choice: будьте терпимы друг к другу
  rationale: Причастие выражает продолжающееся взаимное действие в ряду наставлений. В русском побудительная конструкция естественно передаёт его увещевательную силу, а «будьте терпимы» сохраняет межличностный смысл без резкого оттенка слова «терпите».
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: прощайте друг друга
  rationale: В данном контексте χαρίζομαι означает прощать нанесённую обиду, а формально возвратное ἑαυτοῖς имеет взаимное значение внутри общины.
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: если у кого есть претензия к кому-либо
  rationale: Обобщённое условие передано естественной современной русской конструкцией. «Претензия» выражает основание для упрёка, не превращая его в формальное обвинение.
- source_word: καθὼς καὶ
  choice: подобно тому как
  rationale: Передаёт сравнительную связь между прощением со стороны Господа и требуемым взаимным прощением.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Традиционное и контекстуально уместное соответствие титулу κύριος; перевод не уточняет прямо референта сверх сказанного в греческом тексте.
- source_word: ἐχαρίσατο
  choice: простил
  rationale: Аорист обозначает совершившееся прощение и лексически перекликается с χαριζόμενοι; русское «простил» ясно сохраняет эту связь.
- source_word: οὕτως καὶ ὑμεῖς
  choice: так и вы прощайте
  rationale: В греческом глагол опущен, но однозначно восстанавливается из контекста. В русском его повторение делает увещевание завершённым и естественным.
theological_decisions:
- issue: Референт ὁ κύριος
  choice: сохранить титул «Господь» без поясняющего имени
  alternative: уточнить как «Христос» или понимать более общо как Бога
  rationale: В контексте Послания к колоссянам наиболее вероятен Христос, однако сам греческий текст использует только титул. Перевод сохраняет эту формальную открытость.
- issue: Эллипсис в заключительной части
  choice: восполнить подразумеваемый глагол словом «прощайте»
  alternative: 'сохранить дословный эллипсис: «так и вы»'
  rationale: Греческая конструкция оставляет действие подразумеваемым из контекста. По-русски явное повторение глагола звучит естественнее и не добавляет нового содержания; сноска отмечает особенность оригинала.
- issue: Побудительная сила причастий
  choice: передать причастия формами повелительного наклонения
  alternative: 'сохранить деепричастия: «терпимо относясь… и прощая…»'
  rationale: Причастия входят в увещевательный ряд и зависят от предшествующего наставления. Самостоятельный русский стих с императивами яснее передаёт их функцию, не меняя этического содержания.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Взаимность действий передана повтором «друг друга» и конструкцией «друг к другу»; синтаксис сохраняет сопоставление прощения Господа с прощением внутри общины.
