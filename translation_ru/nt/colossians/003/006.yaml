  text: Из-за всего этого грядёт гнев Божий [на сынов непокорности][a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детей непокорности»; то есть людей, для которых характерна непокорность.'
