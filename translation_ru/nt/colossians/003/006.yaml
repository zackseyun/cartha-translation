    reason: textual_variant
lexical_decisions:
- source_word: δι’ ἃ
  choice: Из-за этого
  rationale: διά с винительным падежом выражает причину. Русское «из-за этого» естественно отсылает к перечисленным в предыдущем стихе порокам; единственное число «этого» собирательно передаёт греческое множественное ἃ.
- source_word: ἔρχεται
  choice: грядёт
  rationale: Настоящее время ἔρχομαι здесь указывает на приближающийся суд. «Грядёт» сохраняет эсхатологическую направленность и звучит достойно, не превращая высказывание в отвлечённую закономерность.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: гнев Божий
  rationale: ὀργή обозначает Божий гнев в контексте суда. Устоявшееся русское сочетание сохраняет богословский вес и генитивную связь.
- source_word: ἐπὶ
  choice: на
  rationale: ἐπί с винительным обозначает направленность гнева на тех, кого постигает суд; «на» прямо и естественно передаёт эту связь по-русски.
- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: сынов непокорности
  rationale: Сохранён семитизм с мужским υἱούς и родительным качества. «Непокорность» передаёт ἀπείθεια как отказ повиноваться; смысл идиомы пояснён в сноске.
theological_decisions:
- issue: Сохранять ли идиому «сыны непокорности» или передать её смысл описательно
  choice: Сохранить «сынов непокорности» в основном тексте
  alternative: «непокорных людей» или «тех, кто непокорен»
  rationale: Греческий текст использует образное выражение, обозначающее людей, для которых характерна непокорность. Его сохранение передаёт текстуру оригинала, а сноска устраняет возможную неясность.
- issue: Временная направленность Божьего гнева
  choice: Передать ἔρχεται как «грядёт»
  alternative: «приходит»
  rationale: Форма настоящего времени допускает оттенок приближающегося эсхатологического суда. «Грядёт» сохраняет эту направленность, не уточняя срок или способ исполнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Грядёт» и «гнев Божий» естественны для речи о Божьем суде; сохранён понятный, но непривычный семитизм, разъяснённый сноской.
