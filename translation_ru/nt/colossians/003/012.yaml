    issue: Несоответствие маркеров и содержания в английских контрольных сносках
    rationale: В English POB сноска [b] стоит после “gentleness”, но сообщает об альтернативе для «God’s chosen ones»; [c] стоит после “patience”, но сообщает об альтернативе для “gentleness”. Русские сноски структурно и содержательно согласованы, поэтому исправление русского текста не требуется.
