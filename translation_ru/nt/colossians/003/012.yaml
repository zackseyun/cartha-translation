id: COL.3.12
reference: Colossians 3:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἐνδύσασθε οὖν ὡς ἐκλεκτοὶ τοῦ θεοῦ, ἅγιοι καὶ ἠγαπημένοι, σπλάγχνα οἰκτιρμοῦ, χρηστότητα, ταπεινοφροσύνην, πραΰτητα, μακροθυμίαν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/012.yaml
  text: Put on[a], then, as God’s chosen ones, holy and beloved, compassion, kindness, humility, gentleness[b], and patience[c],
translation:
  language: ru
  text: Итак, как избранные Богом, святые и возлюбленные, облекитесь в сердечное сострадание[a], доброту, смирение, кротость[b] и долготерпение[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «внутренности милосердия» — образ глубокого, идущего изнутри сострадания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мягкость».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «терпение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: облекитесь
  rationale: Передаёт аористный императив и сохраняет метафору одежды; форма естественна для возвышенного, но современного русского библейского стиля.
- source_word: οὖν
  choice: итак
  rationale: Ясно обозначает вывод из предшествующего наставления и естественно связывает ход речи.
- source_word: ὡς
  choice: как
  rationale: 'Сохраняет отождествительно-сопоставительный оттенок: поступать сообразно тому, кем адресаты являются, не сводя связь исключительно к причинной.'
- source_word: ἐκλεκτοὶ τοῦ θεοῦ
  choice: избранные Богом
  rationale: Точно передаёт избрание, исходящее от Бога, без внесения позднейшей конфессиональной терминологии.
- source_word: ἅγιοι καὶ ἠγαπημένοι
  choice: святые и возлюбленные
  rationale: Сохраняет два определения адресатов; «возлюбленные» передаёт устойчивое состояние тех, кого любят, при естественном библейском регистре.
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: сердечное сострадание
  rationale: Передаёт идиому о глубоком внутреннем милосердии без неестественного буквального «внутренности сострадания»; слово «сердечное» сохраняет телесно-внутренний образ.
- source_word: χρηστότητα
  choice: доброту
  rationale: Наиболее ясное и естественное русское обозначение деятельной благожелательности в перечне добродетелей.
- source_word: ταπεινοφροσύνην
  choice: смирение
  rationale: Точно и привычно передаёт смиренный образ мыслей, не утяжеляя фразу буквальным сложением.
- source_word: πραΰτητα
  choice: кротость
  rationale: «Кротость» точно передаёт нравственную мягкость и сдержанность и сохраняет устоявшийся, понятный современному читателю библейский термин.
- source_word: μακροθυμίαν
  choice: долготерпение
  rationale: Точнее общего «терпения» выражает длительную выдержку и терпеливость по отношению к людям.
theological_decisions:
- issue: Передача ἐκλεκτοὶ τοῦ θεοῦ без догматического уточнения природы избрания
  choice: избранные Богом
  alternative: избранники Божьи
  rationale: Формулировка сохраняет божественную инициативу, но не определяет механизм, порядок или индивидуальный либо общинный аспект избрания сверх сказанного в стихе.
- issue: Связь ἅγιοι καὶ ἠγαπημένοι с выражением об избранных
  choice: 'сохранить как однородные определения: «святые и возлюбленные»'
  alternative: 'развернуть причинно: «поскольку вы святы и возлюблены»'
  rationale: Греческий текст даёт определения без явной причинной связки; буквальная структура сохраняет содержательную напряжённость между дарованной идентичностью и следующим повелением.
- issue: Передача πραΰτης
  choice: кротость
  alternative: мягкость
  rationale: «Кротость» сохраняет этическую и богословскую весомость понятия, тогда как «мягкость» могла бы сузить его до особенности темперамента.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Сохранена метафора облачения; синтаксис близок греческому, но естественен по-русски. Термины «кротость» и «долготерпение» несколько возвышенны, однако понятны и точнее передают оттенки исходных слов.
