  text: μὴ ψεύδεσθε εἰς ἀλλήλους· ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: ru
  text: Не лгите друг другу, ведь вы сняли с себя прежнего человека вместе с его делами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «Не лгите друг другу, сняв с себя прежнего человека вместе с его делами». Греческое причастие можно передать более буквально; вероятнее всего, здесь оно указывает на основание запрета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: Не лгите
  rationale: Прямой и естественный перевод запрета с μή и формой настоящего времени ψεύδεσθε; контекст не требует более узкого «перестаньте лгать».
- source_word: εἰς ἀλλήλους
  choice: друг другу
  rationale: Естественно передаёт взаимное отношение, выраженное εἰς ἀλλήλους при ψεύδεσθε.
- source_word: ἀπεκδυσάμενοι
  choice: ведь вы сняли с себя
  rationale: Аористное причастие обозначает завершённое действие и, вероятнее всего, обосновывает повеление. «Сняли с себя» сохраняет образ одежды.
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: прежнего человека
  rationale: Сохраняет существительное «человек» и связь с «новым человеком» в следующем стихе; «прежний» по-русски естественно указывает на прежнее состояние, не вызывая представления о возрасте.
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: вместе с его делами
  rationale: «Вместе с» ясно передаёт сопутствие, а «дела» естественно и достаточно широко передаёт πράξεις; «его» сохраняет грамматическую связь с «человеком».
theological_decisions:
- issue: Значение τὸν παλαιὸν ἄνθρωπον
  choice: прежнего человека
  alternative: прежнюю сущность; ветхого человека
  rationale: Основной текст сохраняет антропологический образ Павла и параллель с «новым человеком», не сводя выражение только к внутреннему «я». «Прежний» понятнее современному читателю, чем традиционное «ветхий».
- issue: Смысловая связь причастия ἀπεκδυσάμενοι с запретом
  choice: 'причинное основание: «ведь вы сняли с себя»'
  alternative: формальное «сняв с себя» или временное «после того как сняли»
  rationale: В контексте причастие, вероятнее всего, обосновывает запрет изменившимся положением адресатов, однако иная синтаксическая связь остаётся возможной и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением образа снятой одежды и противопоставления прежнего и нового человека. Формулировка достоинственная и понятная, без конфессионально окрашенной терминологии.
