source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: ru
  text: Итак, если вы были воскрешены вместе с Мессией, ищите того, что вверху, где Мессия сидит по правую руку от Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Итак, поскольку вы были воскрешены вместе с Христом…» Греческий текст сохраняет условную форму («если»), хотя в данном контексте условие, вероятно, предполагается истинным. Греч. Χριστός можно также передать традиционным словом «Христос»; здесь переведено как «Мессия», поскольку это титул.'
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: Εἰ οὖν
  choice: Итак, если
  rationale: Сохраняет условную форму εἰ и выводное значение οὖν, не превращая подразумеваемую истинность условия в прямое утверждение.
- source_word: συνηγέρθητε τῷ Χριστῷ
  choice: вы были воскрешены вместе с Мессией
  rationale: Передаёт аорист пассивного залога и заложенную в συνεγείρω идею совместного воскресения; дательный τῷ Χριστῷ выражает сопричастность.
- source_word: τὰ ἄνω
  choice: того, что вверху
  rationale: Естественно по-русски передаёт субстантивированное сочетание со значением принадлежащего высшей, небесной сфере, не конкретизируя его как «небесные блага».
- source_word: ζητεῖτε
  choice: ищите
  rationale: Прямо передаёт настоящее повелительное наклонение и допускает подразумеваемую продолжающуюся направленность действия.
- source_word: ὁ Χριστός
  choice: Мессия
  rationale: Передаёт Χριστός как значимый титул Помазанника, а не только как ставшее именем обозначение.
- source_word: ἐν δεξιᾷ τοῦ θεοῦ καθήμενος
  choice: сидит по правую руку от Бога
  rationale: Сохраняет образ почётного и царственного положения; личная глагольная конструкция естественнее русского причастного оборота.
theological_decisions:
- issue: Сила условной конструкции Εἰ
  choice: Сохранить «если»
  alternative: «Поскольку вы были воскрешены»
  rationale: В контексте Павел, вероятно, исходит из истинности условия, однако греческий текст сохраняет условную форму; перевод не должен молча устранять эту риторическую напряжённость.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: 'Здесь титульный смысл остаётся содержательным: речь идёт о сопричастности верующих воскресшему и возвышенному Помазаннику.'
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранена условная структура оригинала; синтаксис второй половины сделан естественным для русского языка без добавления толкования.
