    reason: lexical_alternative
  - marker: c
    text: 'Буквальнее по форме греческого глагола: «будете явлены». Тот же глагол употреблён и о явлении Мессии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: Когда
  rationale: С союзом и сослагательным наклонением вводит ожидаемое будущее событие; «когда» естественно передаёт эту временную связь.
- source_word: ὁ Χριστὸς
  choice: Мессия
  rationale: Χριστός здесь имеет силу титула; «Мессия» передаёт его значение, а не просто транслитерирует греческую форму.
- source_word: φανερωθῇ / φανερωθήσεσθε
  choice: явится / явитесь
  rationale: Одинаковый русский корень сохраняет намеренный повтор греческого φανερόω. Возвратные формы естественно выражают открытое явление, тогда как буквальное «будет явлен / будете явлены» звучало бы тяжеловесно.
- source_word: ἡ ζωὴ ὑμῶν
  choice: ваша жизнь
  rationale: 'Сохранена краткая греческая аппозиция: Мессия прямо отождествляется с жизнью адресатов без пояснительного расширения.'
- source_word: τότε καὶ ὑμεῖς
  choice: тогда и вы
  rationale: Сохраняются как временное следствие, так и подчёркнутое включение адресатов.
- source_word: σὺν αὐτῷ
  choice: вместе с Ним
  rationale: «Вместе с» ясно передаёт тесную сопричастность, выраженную σύν.
- source_word: ἐν δόξῃ
  choice: во славе
  rationale: 'Сохраняет краткость, образность и возможную смысловую широту оборота: сферу, состояние или образ явления.'
theological_decisions:
- issue: Передача Χριστός как титула или имени
  choice: Мессия
  alternative: Христос
  rationale: Артикль и контекст допускают ясное титульное прочтение; «Мессия» передаёт смысл греческого титула. Привычная форма «Христос» указана в примечании.
- issue: Отождествление Мессии с жизнью верующих
  choice: «Мессия, ваша жизнь»
  alternative: «Мессия, Который есть ваша жизнь»
  rationale: Прямая аппозиция ближе к греческому тексту и сохраняет богословскую насыщенность высказывания, не объясняя её сверх сказанного.
- issue: Залог и характер будущего явления
  choice: «явится… явитесь»
  alternative: «будет явлен… будете явлены»
  rationale: Русские возвратные формы естественны и сохраняют лексический параллелизм. При этом примечание отмечает формально страдательный залог греческих форм, не определяя явно подразумеваемого деятеля.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского стиля. Краткая аппозиция «Мессия, ваша жизнь» намеренно сохранена; повтор «явится… явитесь» делает связь двух событий слышимой и не перегружает фразу.
