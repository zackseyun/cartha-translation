  text: Когда явится Мессия[a] — ваша жизнь[b], тогда и вы явитесь[c] вместе с Ним во славе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Христос». Греческое Χριστός — титул со значением «Мессия», «Помазанник».'
