  text: οἱ πατέρες, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/021.yaml
  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: ru
  text: Отцы, не раздражайте своих детей, чтобы они не падали духом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не унывали».'
    reason: Лексический вариант для ἀθυμῶσιν; основной текст передаёт образное значение «не падали духом».
lexical_decisions:
- source_word: οἱ πατέρες
  choice: Отцы
  rationale: Греческое πατέρες прямо обозначает отцов; перевод сохраняет конкретного адресата наставления, не расширяя его до «родителей».
- source_word: μὴ ἐρεθίζετε
  choice: не раздражайте
  rationale: В данном контексте ἐρεθίζω означает отрицательно воздействовать на детей, вызывая у них раздражение или болезненную реакцию. «Не раздражайте» естественно звучит по-русски и передаёт продолжительное провоцирующее поведение.
- source_word: τὰ τέκνα ὑμῶν
  choice: своих детей
  rationale: τέκνα — общее обозначение детей обоих полов; возвратное «своих» естественно выражает принадлежность при обращении к отцам.
- source_word: ἵνα μὴ
  choice: чтобы ... не
  rationale: Оборот сохраняет целевое или результативное значение ἵνα μή, не устраняя присущую конструкции смысловую близость цели и последствия.
- source_word: ἀθυμῶσιν
  choice: не падали духом
  rationale: ἀθυμέω означает терять мужество, унывать, лишаться внутренней решимости. Русское выражение «падать духом» точно и естественно передаёт этот смысл.
theological_decisions:
- issue: Круг адресатов οἱ πατέρες в семейном наставлении
  choice: Наставление обращено именно к отцам
  alternative: 'Передать обобщённо: «родители»'
  rationale: Форма πατέρες лексически означает «отцы». Хотя принцип может применяться шире, перевод не должен заменять конкретного адресата более общим.
- issue: 'Оттенок ἵνα μή: цель или последствие'
  choice: Сохранить открытую формулировку «чтобы ... не»
  alternative: Однозначно представить уныние только как последствие или только как намеренно предотвращаемую цель
  rationale: Греческая конструкция допускает целевой оттенок и оттенок ожидаемого результата; русский оборот сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткое, прямое и достойное наставление. «Отцы» сохраняет точность адресации, а «не падали духом» остаётся понятным общеупотребительным выражением.
