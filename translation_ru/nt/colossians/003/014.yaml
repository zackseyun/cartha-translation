id: COL.3.14
reference: Colossians 3:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: ru
  text: А поверх всего этого облекитесь в любовь — узы совершенства[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узы полноты»; или: «узы зрелости».'
    reason: Лексема τελειότης может обозначать совершенство, полноту или зрелость.
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: А поверх всего этого
  rationale: «Поверх» сохраняет образ одежды из ближайшего контекста и одновременно передаёт особое, завершающее место любви среди названных добродетелей; союз «а» естественно передаёт δέ.
- source_word: τὴν ἀγάπην
  choice: в любовь
  rationale: ἀγάπη передано обычным и ясным словом «любовь»; форма с предлогом обусловлена восстановленным из контекста глаголом «облекитесь».
- source_word: '[подразумеваемый глагол из контекста: ἐνδύσασθε, ст. 12]'
  choice: облекитесь
  rationale: В греческом стихе глагол не повторён, но винительный падеж τὴν ἀγάπην зависит от повелительного ἐνδύσασθε в стихе 12. Его восстановление необходимо для естественного русского предложения и сохраняет образ облачения.
- source_word: ὅ ἐστιν
  choice: —
  rationale: Тире естественно оформляет пояснительное отождествление в русском языке. Оно не вынуждает согласовывать греческое местоимение среднего рода ὅ с существительным женского рода ἀγάπη и позволяет воспринимать пояснение как относящееся к любви или ко всей мысли в целом.
- source_word: σύνδεσμος
  choice: узы
  rationale: Слово обозначает то, что связывает и соединяет. «Узы» кратко и выразительно передают объединяющую функцию любви; анатомическое «связка» здесь было бы неуместно, а «связь» слабее сохраняет образ связывания.
- source_word: τῆς τελειότητος
  choice: совершенства
  rationale: «Совершенство» сохраняет компактность греческого родительного оборота и не сужает τελειότης исключительно до зрелости или завершённости.
theological_decisions:
- issue: Смысл выражения σύνδεσμος τῆς τελειότητος
  choice: Любовь названа «узами совершенства» без уточнения точного отношения между узами и совершенством.
  alternative: Любовь — узы, которые создают полноту, либо узы, присущие совершенству, либо то, что соединяет добродетели в зрелое целое.
  rationale: Родительный падеж допускает несколько близких толкований. Компактное «узы совершенства» сохраняет эту смысловую открытость и не превращает одно из толкований в единственно возможное.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного, но понятного образа облачения. Порядок слов подчёркивает любовь как то, что надевается поверх всего перечисленного; тире делает вторую часть естественной и сохраняет лаконичность оригинала.
