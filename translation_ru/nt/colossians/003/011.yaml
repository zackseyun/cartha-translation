id: COL.3.11
reference: Colossians 3:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: ru
  text: где нет ни грека, ни иудея, ни обрезания, ни необрезания, ни варвара, ни скифа, ни раба, ни свободного, но Мессия — всё и во всех.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мессия — всё и в каждом». Греческое выражение «во всех» кратко и в данном контексте, вероятнее всего, относится ко всем членам обновлённого сообщества; возможно также более широкое понимание: «во всём».'
    reason: alternative_reading
  - marker: b
    text: 'Греч. Христос; здесь переведено как титул «Мессия». Традиционный вариант: «Христос».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου οὐκ ἔνι
  choice: где нет
  rationale: Сохраняет образ сферы новой жизни из предыдущего стиха и категорическое отрицание, оставаясь естественным по-русски.
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: ни грека, ни иудея
  rationale: Передаёт конкретное этнокультурное противопоставление «грек — иудей», не расширяя Ἕλλην до общего понятия «язычник».
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: ни обрезания, ни необрезания
  rationale: Сохраняет абстрактные существительные оригинала, выступающие как религиозно-социальные признаки принадлежности.
- source_word: βάρβαρος, Σκύθης
  choice: ни варвара, ни скифа
  rationale: Сохраняет резкое древнее обозначение культурного чужака и конкретный этноним.
- source_word: δοῦλος, ἐλεύθερος
  choice: ни раба, ни свободного
  rationale: Пара обозначает прямое социально-правовое противопоставление, поэтому δοῦλος передано словом «раб», а не более мягким «слуга».
- source_word: τὰ πάντα
  choice: всё
  rationale: Кратко передаёт всеобъемлющее значение Христа, не уточняя его метафизически сверх сказанного в тексте.
- source_word: ἐν πᾶσιν
  choice: во всех
  rationale: Сохраняет краткость греческого выражения; ближайший контекст указывает на членов обновлённого сообщества, однако возможная широта выражения отмечена в сноске.
- source_word: Χριστός
  choice: Мессия
  rationale: Передаёт смысл титула Χριστός, а не только его традиционную транслитерацию «Христос».
theological_decisions:
- issue: Объём значения ἐν πᾶσιν
  choice: во всех
  alternative: во всём; в каждом
  rationale: Контекст перечисляет людей и общественные различия, поэтому личное понимание наиболее вероятно; сноска сохраняет лаконичность и некоторую смысловую открытость греческого выражения.
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном утверждении слово естественно воспринимается как богословский титул; перевод раскрывает его исходное значение.
- issue: Передача δοῦλος
  choice: раб
  alternative: слуга; невольник
  rationale: Сопоставление со «свободным» делает несвободный социальный статус центральным и требует прямого эквивалента.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным ритмом. Повтор «ни» делает длинное перечисление естественным и ясно выражает общее отрицание; строчная буква в названиях народов и социальных категорий соответствует современной русской норме.
