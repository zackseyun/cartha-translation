id: COL.3.5
reference: Colossians 3:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: ru
  text: 'Итак, умертвите земные члены[a]: блуд, нечистоту, страсть, злое вожделение и алчность[b], которая есть идолопоклонство.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «члены, находящиеся на земле»; возможно также: «всё земное в вас».'
    reason: Лаконичное «земные члены» сохраняет метафору, а сноска показывает буквальную форму и распространённое смысловое понимание.
  - marker: b
    text: 'Или: «корыстолюбие», «ненасытное стремление иметь больше».'
    reason: Греческое πλεονεξία обозначает жадное стремление получать и иметь всё больше; один русский эквивалент не охватывает всех оттенков.
lexical_decisions:
- source_word: Νεκρώσατε
  choice: умертвите
  rationale: Аористный повелительный глагол призывает к решительному действию; «умертвите» сохраняет сильный образ смерти и остаётся понятным в возвышенном современном русском.
- source_word: οὖν
  choice: Итак
  rationale: Передаёт вывод из предшествующего рассуждения естественнее для русского связного текста, чем более тяжеловесное «поэтому» в начале стиха.
- source_word: μέλη τὰ ἐπὶ τῆς γῆς
  choice: земные члены
  rationale: Сохраняет метафору членов тела и их принадлежность земной сфере, не заменяя её толкованием «земная природа».
- source_word: πορνείαν
  choice: блуд
  rationale: Устойчивый и достаточно широкий русский библейский термин для половой безнравственности; он краток и соответствует перечню пороков.
- source_word: ἀκαθαρσίαν
  choice: нечистоту
  rationale: Прямой и традиционно понятный эквивалент павловского обозначения нравственной нечистоты.
- source_word: πάθος
  choice: страсть
  rationale: Сохраняет лексическую широту слова, обозначающего сильное неупорядоченное влечение, без добавления отсутствующего в греческом определения.
- source_word: ἐπιθυμίαν κακήν
  choice: злое вожделение
  rationale: «Вожделение» передаёт сильное нравственно порочное желание, а «злое» явно отражает κακήν.
- source_word: πλεονεξίαν
  choice: алчность
  rationale: Передаёт ненасытное стремление иметь больше и в современном русском звучит естественнее, чем «лихоимство»; возможное «корыстолюбие» отмечено в сноске.
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: которая есть идолопоклонство
  rationale: Женский род относительного местоимения естественно связывает придаточное с ближайшим словом «алчность» и сохраняет резкое отождествление без смягчения.
theological_decisions:
- issue: К чему относится выражение «которая есть идолопоклонство»
  choice: К алчности
  alternative: Ко всему предшествующему перечню пороков
  rationale: Греческое относительное местоимение женского рода единственного числа ἥτις грамматически согласуется с ближайшим существительным πλεονεξίαν; русский женский род также сохраняет эту связь.
- issue: Толкование выражения «члены, находящиеся на земле»
  choice: Сохранить метафору телесных членов в сжатом выражении «земные члены»
  alternative: Передать как «всё земное в вас» или «вашу земную природу»
  rationale: В греческом прямо употреблено μέλη, «члены»; отвлечённая перефразировка преждевременно снимает намеренную образность и неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством библейского регистра. Синтаксис перечня сохранён; двоеточие показывает, что последующие пороки поясняют образ «земных членов». Термин «блуд» несколько традиционен, но широко понятен и здесь точнее кратких разговорных замен.
