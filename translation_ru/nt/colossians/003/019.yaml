  text: οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καὶ μὴ πικραίνεσθε πρὸς αὐτάς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/019.yaml
  text: Husbands[a], love your wives, and do not be harsh toward them.
translation:
  language: ru
  text: Мужья, любите своих жён и не будьте с ними суровы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не озлобляйтесь на них». Греческий глагол может означать, что человек становится озлобленным или ожесточённым; здесь, вероятно, имеется в виду суровое, неприязненное отношение к жене.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: Мужья
  rationale: Хотя ἀνήρ может означать «мужчина» или «муж», контекст наставлений членам семьи и упоминание жён ясно указывают на значение «мужья».
- source_word: ἀγαπᾶτε
  choice: любите
  rationale: Прямой и естественный эквивалент настоящего повелительного наклонения; сохраняет смысл продолжающейся обязанности любить.
- source_word: τὰς γυναῖκας
  choice: своих жён
  rationale: γυνή может означать «женщина» или «жена», но семейный контекст требует значения «жён». Русское «своих» естественно выражает подразумеваемое отношение к адресатам.
- source_word: μὴ πικραίνεσθε
  choice: не будьте суровы
  rationale: Форма может передавать состояние или становление ожесточённым, озлобленным; в сочетании с πρὸς αὐτάς здесь естественно выражает суровое, неприязненное отношение. Основной текст передаёт контекстуальный смысл, а буквальный оттенок сохранён в сноске.
- source_word: πρὸς αὐτάς
  choice: с ними
  rationale: πρός с винительным обозначает направленность отношения к жёнам. В русском сочетание «быть суровым с кем-либо» наиболее естественно; «к ним» было бы формальнее, но менее идиоматично в этой конструкции.
theological_decisions:
- issue: Гендерно и брачно определённое обращение
  choice: Сохранить обращение к мужьям и указание на их жён.
  alternative: 'Передать более широко: «мужчины» и «женщины».'
  rationale: Греческие слова допускают более широкие значения вне контекста, однако в данном семейном наставлении отношения мужа и жены однозначны. Перевод не расширяет адресата и не устраняет гендерную конкретность.
- issue: Характер запрета μὴ πικραίνεσθε
  choice: Передать как запрет сурового отношения, сохранив оттенок озлобления в сноске.
  alternative: «Не озлобляйтесь на них» или «не будьте ожесточены против них».
  rationale: Глагол буквально связан с горечью и озлоблением, но контекст допускает как внутреннее ожесточение, так и вытекающее из него суровое обращение. Основной текст звучит естественно, а сноска сохраняет подлинную лексическую широту.
translation_notes:
  register: Современный литературный русский язык; краткое, прямое и достойное наставление. «Жён» дано с обязательной буквой «ё» для ясности. Конструкция «не будьте с ними суровы» естественна для широкой аудитории, а сноска сохраняет буквальный образ горечи и возможную неоднозначность внутреннего отношения и внешнего поведения.
