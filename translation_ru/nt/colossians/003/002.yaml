  text: Set your minds on the things above[b][a], not on the things on the earth.
translation:
  language: ru
  text: Устремляйте мысли к тому, что в вышине[a], а не к тому, что на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Помышляйте о том, что в вышине». Греческий глагол означает не только размышление, но и направленность мыслей, установки и интересов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἄνω
  choice: к тому, что в вышине
  rationale: Субстантивированное сочетание во множественном числе обозначает небесные реалии или всё относящееся к высшей сфере; формулировка сохраняет пространственное противопоставление земному.
- source_word: φρονεῖτε
  choice: устремляйте мысли
  rationale: Глагол означает не просто размышление, а устойчивую направленность мышления, установки и интересов. Несовершенный вид передаёт продолжающийся характер повеления настоящего времени.
- source_word: μὴ
  choice: а не
  rationale: Отрицание вводит контраст со вторым объектом той же заповеди; русский противительный оборот естественно выражает этот смысл.
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: к тому, что на земле
  rationale: Формулировка сохраняет предметный и пространственный параллелизм с «тем, что в вышине», не заменяя его более толковательным прилагательным «земное».
- source_word: γῆς
  choice: земле
  rationale: В космическом противопоставлении вышине речь идёт о земле, а не об отдельной стране или территории.
theological_decisions:
- issue: Смысл увещания φρονεῖτε
  choice: Постоянно направлять мышление и внутреннюю установку к небесным реалиям
  alternative: Лишь интеллектуально размышлять о небесном
  rationale: Семантический диапазон φρονέω охватывает образ мыслей, установку и направленность интересов. Перевод сохраняет широкую нравственную и духовную силу призыва, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; повелительная форма во множественном числе звучит достойно и естественно. «В вышине» сохраняет образный пространственный контраст, а «устремляйте мысли» передаёт более широкий смысл φρονεῖτε без избыточного истолкования.
