  source_fidelity: Текст точно передаёт противопоставление τὰ ἄνω и τὰ ἐπὶ τῆς γῆς и повелительный характер φρονεῖτε. Обороты «к тому, что в вышине» и «к тому, что на земле» естественно передают субстантивированные греческие выражения, хотя русский использует собирательное относительное местоимение вместо формального множественного числа.
  naturalness: «Устремляйте мысли к тому, что в вышине» — литературная и понятная формулировка. Она несколько возвышенна по тону, но уместна для послания и хорошо сочетается с «а не к тому, что на земле».
