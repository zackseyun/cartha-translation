  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: ru
  text: Рабы[a], во всём повинуйтесь своим господам по плоти[b] — не служа лишь напоказ[c], как человекоугодники, но с искренностью сердца, боясь Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово δοῦλοι можно также перевести как «слуги» или «невольники», однако обычно оно обозначает людей, находящихся под властью господина в рабском состоянии.
    reason: lexical_alternative
  - marker: b
    text: '«По плоти» можно передать как «земным»: речь идёт о господах в человеческих, земных отношениях.'
    reason: lexical_alternative
  - marker: c
    text: То есть выполняя работу усердно лишь тогда, когда за ней наблюдают.
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: рабы
  rationale: В контексте античного домашнего уклада δοῦλοι обозначает людей, находящихся в рабской зависимости; «слуги» неоправданно смягчило бы выраженную в тексте социальную реальность.
- source_word: ὑπακούετε κατὰ πάντα
  choice: во всём повинуйтесь
  rationale: Передаёт повелительное наклонение ὑπακούετε и полный охват выражения κατὰ πάντα естественным современным русским языком.
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: своим господам по плоти
  rationale: «Господам» соответствует отношению господина и раба, а «по плоти» сохраняет буквальный павловский ограничитель земной, человеческой сферы власти.
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: не служа лишь напоказ
  rationale: Редкое сложное слово обозначает службу, усердную только под наблюдением; буквальная калька «глазослужение» неестественна для современного русского языка.
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: как человекоугодники
  rationale: Традиционное, понятное и ёмкое слово сохраняет неодобрительный оттенок поведения, нацеленного на одобрение людей.
- source_word: ἀλλ’ ἐν ἁπλότητι καρδίας
  choice: но от чистого сердца
  rationale: Здесь ἁπλότης выражает искренность и цельность намерения, а не простодушие; русское выражение передаёт этический смысл естественно.
- source_word: φοβούμενοι τὸν κύριον
  choice: боясь Господа
  rationale: Сохраняет причастную конструкцию и библейское понятие страха Господня, не ослабляя его до одного лишь почтения; «Господь» отличает божественного Владыку от человеческих господ.
theological_decisions:
- issue: Наставление в условиях рабства
  choice: Прямо назвать адресатов «рабами», а владельцев — «господами», не превращая древнее рабство в современные трудовые отношения.
  alternative: Смягчить до «слуги» и понимать господ как работодателей.
  rationale: Греческие слова и контекст домашнего уклада отражают реальность рабства. Перевод не должен ни скрывать эту этическую напряжённость, ни добавлять отсутствующее в стихе одобрение института.
- issue: Соотношение человеческих господ и Господа
  choice: Сохранить выражение «по плоти» и графически различить «господ» и «Господа».
  alternative: Передать как «земным хозяевам» и тем самым истолковать метафору внутри основного текста.
  rationale: Так сохраняются и павловская формулировка, и контраст между ограниченной человеческой властью и властью Господа, не устраняя смысловую глубину σάρξ.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Сохранены исторически точные «рабы», «господа» и павловское «по плоти»; редкое ὀφθαλμοδουλίαις передано естественным выражением «служа лишь напоказ». Конструкция краткая и пригодна для публичного чтения.
