base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: ru
  text: И что бы вы ни делали — словом или делом, — всё делайте во имя Господа Иисуса[a], воздавая благодарность Богу Отцу через Него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «во имя» может также означать «под властью Господа Иисуса» или «как Его представители».
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: что бы вы ни делали
  rationale: 'Естественная русская конструкция передаёт неопределённо-всеохватное значение греческого оборота: речь идёт о любом поступке без исключения.'
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: словом или делом
  rationale: Устойчивая и компактная русская пара сохраняет риторическое равновесие и охватывает как речь, так и практические действия.
- source_word: πάντα
  choice: всё
  rationale: Повторно подчёркивает всеохватность наставления и естественно подводит итог предшествующему обороту.
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: во имя Господа Иисуса
  rationale: Прямой перевод сохраняет библейский оборот и его широкий смысловой диапазон, включающий власть, представительство и принадлежность.
- source_word: κυρίου
  choice: Господа
  rationale: Передаёт κύριος как христологический титул, сохраняя его новозаветный смысл и богословский вес.
- source_word: εὐχαριστοῦντες
  choice: благодаря
  rationale: Деепричастие естественно передаёт одновременное и сопутствующее действие греческого причастия настоящего времени.
- source_word: τῷ θεῷ πατρὶ
  choice: Бога Отца
  rationale: Естественно передаёт приложение πατρί к θεῷ и соответствует ясному современному русскому употреблению.
- source_word: δι’ αὐτοῦ
  choice: через Него
  rationale: Сохраняет посредническое значение διά с родительным падежом; местоимение естественно относится к непосредственно названному Господу Иисусу.
theological_decisions:
- issue: Смысл выражения «во имя Господа Иисуса»
  choice: Сохранить в основном тексте оборот «во имя Господа Иисуса».
  alternative: «под властью Господа Иисуса»; «как представители Господа Иисуса»
  rationale: Греческое выражение допускает связанные оттенки власти, представительства и отождествления с Иисусом. Прямой оборот сохраняет эту смысловую полноту, не сводя её к одному толкованию.
- issue: К кому относится «через Него»
  choice: Местоимение относится к Господу Иисусу, через Которого возносится благодарность Богу Отцу.
  alternative: Неопределённая отсылка без выраженного христологического акцента.
  rationale: Ближайший антецедент — «Господа Иисуса»; такой разбор непосредственно следует синтаксису и не требует добавления отсутствующей в тексте формулировки.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной библейской ритмикой. Конструкция «словом или делом» лаконична и понятна; тире помогают ясно обозначить вставную пару. Местоимение «Него» написано с прописной буквы согласно распространённой русской библейской традиции.
