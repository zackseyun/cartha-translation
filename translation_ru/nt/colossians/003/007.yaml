- source_word: ἐν οἷς
  choice: Этими путями
  rationale: Оборот отсылает к перечисленным выше порокам. Такое выражение естественно по-русски сочетается с метафорическим «ходили» и сохраняет образ жизненного пути; более буквальный вариант отмечен в сноске.
- source_word: καὶ ὑμεῖς
  choice: и вы
  rationale: Сочетание καί с выраженным местоимением подчёркивает, что колоссяне также прежде вели подобную жизнь.
- source_word: περιεπατήσατε
  choice: ходили
  rationale: Сохранена характерная для Павла метафора хождения как образа поведения и жизненного уклада, без смешения с последующим ἐζῆτε.
- source_word: ποτε
  choice: когда-то
  rationale: Передаёт неопределённое прошлое время и ясно указывает на прежний период жизни.
- source_word: ὅτε
  choice: когда
  rationale: Естественно вводит придаточное времени и связывает прежнее поведение с прежней средой жизни.
- source_word: ἐζῆτε
  choice: жили
  rationale: Передаёт длительное состояние в прошлом, выраженное имперфектом, и сохраняет отличие ζάω от метафорического περιπατέω.
- source_word: ἐν τούτοις
  choice: среди всего этого
  rationale: Указывает на прежнюю среду и совокупность названных пороков; «всего» делает множественный и собирательный референт ясным, не сводя его к людям.
theological_decisions:
- issue: Соотношение «ходили» и «жили» в описании прежней жизни
  choice: Сохранить различие между образом поведения («ходили») и продолжительным пребыванием в прежней среде («жили среди всего этого»).
  alternative: Передать оба глагола одним глаголом «жили».
  rationale: Различение отражает разные греческие глаголы περιπατέω и ζάω и сохраняет многослойность нравственного описания без добавления вероучительных выводов.
