  text: ἀπεθάνετε γάρ, καὶ ἡ ζωὴ ὑμῶν κέκρυπται σὺν τῷ Χριστῷ ἐν τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/003.yaml
  text: For you died, and your life has been hidden with the Messiah in God.
translation:
  language: ru
  text: Ведь вы умерли, и ваша жизнь сокрыта[b] с Мессией[a] в Боге.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со Христом». Греческий титул Χριστός можно передать словами «Мессия» или «Христос».'
    reason: alternative_reading
  - marker: b
    text: То есть была сокрыта и остаётся сокрытой. Греческая форма подчёркивает нынешнее состояние как результат совершившегося действия.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: вы умерли
  rationale: Аорист изъявительного наклонения обозначает решительное событие в прошлом; простое прошедшее время естественно и точно передаёт эту форму по-русски.
- source_word: γάρ
  choice: ведь
  rationale: Частица вводит обоснование предыдущего наставления. «Ведь» естественно выражает пояснительно-причинную связь, не утяжеляя фразу.
- source_word: ἡ ζωὴ ὑμῶν
  choice: ваша жизнь
  rationale: Прямой и естественный перевод; контекстуальный смысл жизни верующих в единении с Мессией не разворачивается в тексте сверх сказанного по-гречески.
- source_word: κέκρυπται
  choice: сокрыта
  rationale: Краткое страдательное причастие передаёт наличное состояние, возникшее вследствие совершившегося действия, что соответствует перфекту. «Сокрыта» сохраняет возвышенный, но понятный современному читателю регистр.
- source_word: σὺν τῷ Χριστῷ
  choice: с Мессией
  rationale: σύν выражает совместность и единение. Χριστός здесь сохраняет смысл титула Помазанника, поэтому переведено как «Мессия», а традиционное «Христос» дано как допустимый вариант.
- source_word: ἐν τῷ θεῷ
  choice: в Боге
  rationale: Предлог ἐν указывает на сферу или местопребывание; буквальное «в Боге» сохраняет образ и его богословскую напряжённость без поясняющей вставки.
theological_decisions:
- issue: Передача Χριστῷ как смыслового титула или традиционной формы
  choice: с Мессией
  alternative: со Христом
  rationale: Греческое Χριστός означает Помазанника и в данном контексте допускает прочтение как титул. «Мессия» явно сохраняет титульный смысл, тогда как общеупотребительное церковное «Христос» отмечено в сноске.
- issue: Характер сокрытости жизни верующих
  choice: сокрыта
  alternative: была сокрыта и остаётся сокрытой
  rationale: Перфект κέκρυπται соединяет предшествующее действие с продолжающимся состоянием. Краткая форма «сокрыта» естественно подчёркивает состояние и не устраняет результативного оттенка.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «Сокрыта» выбрано вместо более разговорного «спрятана», поскольку речь идёт не о бытовом действии, а о сохраняющемся состоянии; при этом синтаксис остаётся простым и понятным.
