  text: καὶ ἐνδυσάμενοι τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατ’ εἰκόνα τοῦ κτίσαντος αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/010.yaml
  text: and have put on the new self[a], which is being renewed in knowledge according to the image of the one who created it[b],
translation:
  language: ru
  text: и облеклись в нового человека[a], который обновляется в познании[b] по образу Создавшего его,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в новое „я“» либо «в новую личность». Буквально подразумевается «новый человек», противопоставленный «ветхому человеку» в предыдущем стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к полному познанию». Греческое слово может означать более полное или глубокое познание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: облеклись
  rationale: Аористное причастие согласуется с предшествующим «совлекшись» (Кол. 3:9); личная форма естественно продолжает русское предложение и сохраняет метафору одежды.
- source_word: τὸν νέον
  choice: нового человека
  rationale: Субстантивированное прилагательное подразумевает «человека» из ближайшего контекста (ср. «ветхого человека» в 3:9). Русское «человек» может обозначать человека вообще и сохраняет как личностный, так и возможный общинный смысл.
- source_word: ἀνακαινούμενον
  choice: который обновляется
  rationale: Настоящее страдательное причастие обозначает продолжающееся обновление; конструкция с «который» естественна по-русски и сохраняет страдательный залог.
- source_word: εἰς ἐπίγνωσιν
  choice: для познания
  rationale: Предлог εἰς выражает направленность или результат процесса. «Для познания» звучит естественно и не сводит выражение однозначно лишь к сфере обновления; усилительный оттенок ἐπίγνωσις отмечен в сноске.
- source_word: κατ’ εἰκόνα
  choice: по образу
  rationale: Передаёт соответствие образцу и сохраняет вероятную отсылку к языку Бытия о Божьем образе.
- source_word: τοῦ κτίσαντος αὐτόν
  choice: Создавшего его
  rationale: Причастный оборот сохраняет личное обозначение Творца и мужской объектный pronoun, соотносящийся с «новым человеком». Заглавная буква ясно указывает на Бога в принятом русском религиозно-литературном употреблении.
theological_decisions:
- issue: Передача τὸν νέον в антропологическом и, возможно, общинном контексте
  choice: нового человека
  alternative: новое «я»; новую личность
  rationale: «Новый человек» непосредственно поддерживает противопоставление «ветхому человеку» и сохраняет библейский образ, не ограничивая речь мужчиной как полом.
- issue: Смысл εἰς ἐπίγνωσιν
  choice: для познания
  alternative: в познании; к полному познанию
  rationale: Греческое выражение допускает оттенки цели, направления и результата. Основной текст не усиливает ἐπίγνωσις словом «полное» и не решает молча, что познание является только сферой обновления.
- issue: Соотношение образа и Творца
  choice: по образу Создавшего его
  alternative: по образу своего Создателя
  rationale: Выбранная формулировка близко следует греческому синтаксису и сохраняет аллюзию на сотворение человека по Божьему образу, не добавляя пояснений о природе этого образа.
translation_notes:
  register: Современный литературный русский язык с сохранением узнаваемой библейской метафоры «облечься». Формулировка рассчитана на продолжение предложения из Кол. 3:9, поэтому начинается со строчной буквы и завершается запятой. «Новый человек» употреблено в общем, а не исключительно мужском значении.
