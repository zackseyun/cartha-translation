lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: Что бы вы ни делали
  rationale: 'Неопределённо-относительная конструкция с ἐάν выражает общее условие: речь идёт обо всём, что адресаты могут делать. Русская конструкция «что бы… ни» естественно передаёт эту всеохватность.'
- source_word: ἐκ ψυχῆς
  choice: от души
  rationale: Выражение буквально означает «из души» и указывает на искренность и полную внутреннюю отдачу. Русское «от души» сохраняет образ и звучит естественно, не сводя смысл лишь к усердию.
- source_word: ἐργάζεσθε
  choice: трудитесь
  rationale: Форма имеет значение повелительного наставления и обозначает деятельное, усердное исполнение работы. «Трудитесь» соответствует контексту наставления рабам и сохраняет широкий смысл глагола.
- source_word: ὡς τῷ κυρίῳ
  choice: как для Господа
  rationale: 'ὡς задаёт образ действия и его направленность: работать следует так, как работают для Господа. Дательный падеж естественно передаётся русским оборотом «для Господа».'
- source_word: καὶ οὐκ ἀνθρώποις
  choice: а не для людей
  rationale: В данном противопоставлении καί вместе с οὐ естественно передаётся противительным «а не». ἄνθρωποι обозначает людей вообще, поэтому современное русское «людей» точнее и естественнее, чем гендерно маркированное «мужчин».
theological_decisions:
- issue: Передача κύριος в контексте наставления рабам
  choice: Господь
  alternative: господин
  rationale: Непосредственный бытовой контекст допускает оттенок «господин», однако здесь адресат труда противопоставлен людям, что указывает прежде всего на возвышенного Господа. Перевод «Господь» сохраняет этот титул, а возможный контекстуальный оттенок отмечен в сноске.
- issue: Характер противопоставления Господа и людей
  choice: как для Господа, а не для людей
  alternative: словно для Господа, а не для людей
  rationale: «Как для» передаёт не мнимую ситуацию, а действительную направленность труда Господу. Вариант «словно» мог бы создать нежелательное впечатление, будто это лишь воображаемое сравнение.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и наставительным звучанием. «От души» сохраняет греческий образ, оставаясь понятным обычному читателю; «трудитесь» соответствует рабочему контексту и не звучит канцелярски. Все сноски привязаны к соответствующим словам основного текста.
