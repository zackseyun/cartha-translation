id: COL.3.16
reference: Colossians 3:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: ru
  text: Пусть слово Мессии обильно пребывает в вас[a] во всякой мудрости; учите и вразумляйте друг друга псалмами, гимнами и духовными песнями, с благодатью[b] пойте Богу в своих сердцах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди вас». Греческое местоимение стоит во множественном числе и может указывать как на общину в целом, так и на отдельных верующих.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «с благодарностью». Греческое выражение может обозначать благодать, сердечную расположенность или благодарность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ Χριστοῦ
  choice: слово Мессии
  rationale: «Слово» сохраняет широту λόγος, а родительный оборот не сужается до значения только «о Мессии» или только «от Мессии». Χριστός передан как титул «Мессия».
- source_word: ἐνοικείτω
  choice: пусть ... пребывает
  rationale: Передаёт длительное состояние, выраженное настоящим императивом, и сохраняет образ постоянного внутреннего присутствия.
- source_word: ἐν ὑμῖν
  choice: в вас
  rationale: Прямо передаёт греческий оборот; множественное число допускает как пребывание в общине в целом, так и в отдельных верующих.
- source_word: πλουσίως
  choice: обильно
  rationale: Естественно по-русски выражает полноту и изобилие, подразумеваемые наречием.
- source_word: ἐν πάσῃ σοφίᾳ
  choice: во всякой мудрости
  rationale: 'Близко сохраняет синтаксическую открытость греческого текста: оборот может относиться к пребыванию слова и/или к последующему наставлению.'
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς
  choice: учите и вразумляйте друг друга
  rationale: Взаимное значение множественного ἑαυτούς естественно передано словами «друг друга»; «вразумляйте» сохраняет исправляющий и наставительный оттенок νουθετέω.
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: псалмами, гимнами и духовными песнями
  rationale: Сохранены три различимых музыкально-поэтических обозначения; дательный падеж передан инструментально.
- source_word: ἐν χάριτι
  choice: с благодатью
  rationale: Сохраняет прямую связь с χάρις и смысловую открытость между благодатью, благозвучной сердечностью и благодарностью; последний вариант отмечен в сноске.
- source_word: ᾄδοντες ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: воспевая Бога в своих сердцах
  rationale: Естественный русский порядок слов сохраняет адресата пения и внутреннюю, сердечную сферу действия.
theological_decisions:
- issue: Передача Χριστοῦ
  choice: Мессии
  alternative: Христа
  rationale: Здесь Χριστός сохраняет функцию титула; «Мессия» раскрывает его смысл и иудейский мессианский контекст.
- issue: Общинный или индивидуальный смысл ἐν ὑμῖν
  choice: в вас
  alternative: среди вас
  rationale: Основной текст следует форме греческого выражения и не исключает ни общинного, ни личного измерения; смысловая широта пояснена в сноске.
- issue: Значение ἐν χάριτι
  choice: с благодатью
  alternative: с благодарностью
  rationale: Оборот допускает значения благодати, сердечной расположенности и благодарности. Основной вариант сохраняет лексическую форму, а распространённая альтернатива дана в сноске.
- issue: Связь ἐν πάσῃ σοφίᾳ
  choice: сохранена синтаксическая неоднозначность
  alternative: однозначно связать либо с «пребывает», либо с «учите и вразумляйте»
  rationale: Пунктуация и строение греческой фразы не требуют исключительной связи только с одной частью предложения.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским регистром. «Вразумляйте» сохраняет нравственно-наставительный оттенок без архаизации; «гимнами» позволяет отличить ὕμνοις от «псалмов» и «песен».
