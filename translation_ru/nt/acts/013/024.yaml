  variant: modern literary Russian
source:
  edition: SBLGNT
  text: προκηρύξαντος Ἰωάννου πρὸ προσώπου τῆς εἰσόδου αὐτοῦ βάπτισμα μετανοίας ⸂παντὶ τῷ λαῷ⸃ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/024.yaml
  text: before his coming[b][a], John had proclaimed to all the people of Israel a baptism of repentance.
translation:
  language: ru
  text: Перед Его приходом[a] Иоанн возвестил всему народу Израиля крещение покаяния[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Его прибытием». Буквально по-гречески: «перед лицом Его входа» — идиоматический оборот, означающий, что нечто происходит прежде чьего-либо прихода.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «крещение для покаяния».'
    reason: lexical_alternative
lexical_decisions:
- source_word: προκηρύξαντος
  choice: возвестил
  rationale: Аористное причастие обозначает предшествовавшее публичное провозглашение. «Возвестил» естественно передаёт смысл глашатайского объявления, тогда как временное предшествование уже выражено оборотом «перед Его приходом».
- source_word: πρὸ προσώπου τῆς εἰσόδου αὐτοῦ
  choice: перед Его приходом
  rationale: Греческий оборот буквально говорит «перед лицом Его входа», но идиоматически означает, что действие совершилось прежде чьего-либо прибытия. Русское «перед Его приходом» ясно и естественно передаёт этот смысл.
- source_word: εἰσόδου
  choice: приходом
  rationale: Существительное может означать «вход», «прибытие» или «приход»; в данном контексте речь идёт о появлении Иисуса, поэтому «приход» звучит естественно и сохраняет широту выражения.
- source_word: βάπτισμα μετανοίας
  choice: крещение покаяния
  rationale: Родительный падеж сохранён без истолковывающего уточнения причинно-целевого отношения, благодаря чему не устраняется возможная смысловая напряжённость греческого оборота.
- source_word: παντὶ τῷ λαῷ Ἰσραήλ
  choice: всему народу Израиля
  rationale: Передаёт и значение παντί («всему»), и λαῷ («народу»), сохраняя представление об Израиле как народе.
- source_word: Ἰωάννου
  choice: Иоанн
  rationale: Традиционная и общеупотребительная русская форма имени Ἰωάννης.
theological_decisions:
- issue: К кому относится местоимение αὐτοῦ в выражении о приходе
  choice: Местоимение сохранено как «Его» и по контексту относится к Иисусу, Спасителю из рода Давида.
  alternative: Прямо назвать Иисуса в данном стихе.
  rationale: В Деяниях 13:23–25 референт понятен из контекста, но в самом стихе имя не повторяется; местоимение сохраняет форму исходного текста без добавленного уточнения.
- issue: Смысл родительного падежа в βάπτισμα μετανοίας
  choice: крещение покаяния
  alternative: крещение для покаяния
  rationale: Формулировка не навязывает исключительно целевое понимание связи между крещением и покаянием и сохраняет компактность греческого выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Возвестил» передаёт публичный характер служения Иоанна без архаичного синтаксиса; порядок слов остаётся ясным для широкого читателя.
