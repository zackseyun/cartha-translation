  text: ἀναστὰς δὲ Παῦλος καὶ κατασείσας τῇ χειρὶ εἶπεν· Ἄνδρες Ἰσραηλῖται καὶ οἱ φοβούμενοι τὸν θεόν, ἀκούσατε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/016.yaml
  text: So Paul stood up[a], and motioning with his hand said, “Men of Israel and you who fear God, listen.”
translation:
  language: ru
  text: 'Павел встал, сделал знак рукой и сказал: «Мужи израильские и вы, боящиеся Бога[a], послушайте!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «боящиеся Бога», вероятно, относится к неевреям, которые почитали Бога Израиля и посещали синагогу.
    reason: Уточнение вероятного исторического значения выражения без превращения этого толкования в основной текст.
lexical_decisions:
- source_word: ἀναστὰς
  choice: встал
  rationale: Причастие обозначает конкретное действие Павла перед речью; «встал» естественно и точно передаёт движение.
- source_word: δὲ
  choice: не выражено отдельным словом
  rationale: Здесь частица служит переходом к следующему событию, который в русском повествовании естественно передаётся самим порядком предложений; противительного значения нет.
- source_word: κατασείσας τῇ χειρὶ
  choice: сделал знак рукой
  rationale: Выражение описывает жест, призывающий присутствующих к вниманию; перевод естественен и не создаёт образа беспорядочного размахивания рукой.
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: мужи израильские
  rationale: Сохранены мужской род обращения ἄνδρες и принадлежность адресатов к Израилю. Несколько торжественный оборот уместен в публичной речи и понятен современному читателю.
- source_word: οἱ φοβούμενοι τὸν θεόν
  choice: вы, боящиеся Бога
  rationale: Перевод сохраняет глагольный характер греческого причастия и не превращает выражение в неясный технический термин.
- source_word: ἀκούσατε
  choice: послушайте
  rationale: Повелительная форма призывает к внимательному слушанию; «послушайте» естественно звучит в современном русском публичном обращении.
theological_decisions:
- issue: Различение израильтян и второй группы слушателей в синагоге
  choice: «мужи израильские и вы, боящиеся Бога»
  alternative: «израильтяне и богобоязненные»
  rationale: Греческий текст различает израильтян и людей, описанных как боящиеся Бога, вероятно, неевреев, связанных с синагогой. Основной текст сохраняет это различение, не навязывая выражению однозначный технический статус.
translation_notes:
  register: Современный литературный русский с достоинством публичной речи. Оборот «мужи израильские» намеренно несколько торжественен, чтобы сохранить мужское обращение оригинала; остальная формулировка остаётся простой и понятной.
