base_translation:
  language: en
  yaml_path: translation/nt/acts/013/048.yaml
  text: When the Gentiles heard this[a], they began rejoicing and glorifying the word of the Lord, and all who had been appointed for eternal life believed.
translation:
  language: ru
  text: Услышав это, язычники стали радоваться и прославлять слово Господа, и уверовали все, кто был предназначен[a] к вечной жизни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто был расположен к вечной жизни». Греческое причастие допускает разные толкования, однако пассивное значение «был предназначен» здесь наиболее прямое.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούοντα
  choice: услышав это
  rationale: Причастие передано деепричастным оборотом, естественным для русского повествования; «это» восполняет подразумеваемый из контекста объект.
- source_word: τὰ ἔθνη
  choice: язычники
  rationale: В данном контексте Деяний речь идёт о неевреях, противопоставленных иудеям; это устойчивый и понятный русский библейский термин.
- source_word: ἔχαιρον καὶ ἐδόξαζον
  choice: стали радоваться и прославлять
  rationale: Имперфекты выражают разворачивающееся действие; «стали» естественно передаёт его начало, не утяжеляя фразу.
- source_word: τὸν λόγον τοῦ κυρίου
  choice: слово Господа
  rationale: «Слово» сохраняет библейскую образность и обозначает возвещённую весть; родительный оборот точно передаёт греческую конструкцию.
- source_word: ἐπίστευσαν
  choice: уверовали
  rationale: Аорист передан совершенным видом; «уверовали» кратко и без дополнительных толкований обозначает приход к вере.
- source_word: ὅσοι
  choice: все, кто
  rationale: Естественно передаёт количественно-относительное значение греческого местоимения в современном русском языке.
- source_word: τεταγμένοι
  choice: был предназначен
  rationale: Перфектное пассивное причастие τάσσω наиболее прямо указывает на ранее состоявшееся назначение или определение; пассивный смысл сохранён без уточнения действующего лица.
- source_word: εἰς ζωὴν αἰώνιον
  choice: к вечной жизни
  rationale: Предлог «к» естественно передаёт направленность εἰς и сохраняет связь причастия с целью или исходом назначения.
theological_decisions:
- issue: Смысл τεταγμένοι и соотношение назначения с человеческим откликом
  choice: кто был предназначен к вечной жизни
  alternative: кто был расположен к вечной жизни
  rationale: Пассивное причастие от τάσσω наиболее естественно означает назначение или определение. Перевод сохраняет грамматический пассив и не разворачивает его в более широкое учение о предопределении; спорная альтернатива указана в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства библейского стиля. Синтаксис сделан плавным и доступным; традиционные термины «язычники», «слово Господа», «уверовали» сохранены как понятные и контекстуально точные.
