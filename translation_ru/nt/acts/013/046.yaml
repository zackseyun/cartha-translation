  text: παρρησιασάμενοί ⸀τε ὁ Παῦλος καὶ ὁ Βαρναβᾶς εἶπαν· Ὑμῖν ἦν ἀναγκαῖον πρῶτον λαληθῆναι τὸν λόγον τοῦ θεοῦ· ⸀ἐπειδὴ ἀπωθεῖσθε αὐτὸν καὶ οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς, ἰδοὺ στρεφόμεθα εἰς τὰ ἔθνη·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/046.yaml
  text: So Paul and Barnabas spoke boldly and said[a], “It was necessary that the word of God be spoken first to you. Since you are rejecting it and judging yourselves unworthy of eternal life, look, we are turning to the Gentiles.”
translation:
  language: ru
  text: 'Павел же и Варнава смело сказали: «Слово Божье необходимо было прежде возвестить вам. Ибо вы отвергаете его и сами считаете себя недостойными вечной жизни; вот, мы обращаемся к язычникам[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к народам». Здесь имеются в виду неевреи в противопоставлении слушателям в синагоге, поэтому в основном тексте употреблено слово «язычникам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησιασάμενοι
  choice: смело сказали
  rationale: Причастие описывает открытую, бесстрашную манеру речи; в русском естественно передать его наречием при основном глаголе εἶπαν.
- source_word: τε
  choice: же
  rationale: Частица легко связывает эту реплику с предшествующим повествованием; «же» сохраняет связь и оттенок ответной реакции без утяжеления фразы.
- source_word: Ὑμῖν
  choice: вам
  rationale: Дательный падеж обозначает первых адресатов возвещения.
- source_word: ἀναγκαῖον
  choice: необходимо
  rationale: Передаёт выраженную в тексте необходимость, не уточняя её источник сверх сказанного.
- source_word: πρῶτον
  choice: прежде
  rationale: 'Обозначает последовательность: сначала слово обращено к слушателям в синагоге, затем — к язычникам.'
- source_word: λαληθῆναι
  choice: возвестить
  rationale: Пассивный инфинитив буквально означает «быть сказанным». В сочетании со «Словом Божьим» глагол «возвестить» естественно передаёт публичное провозглашение и избегает тяжеловесного «чтобы было сказано».
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: Слово Божье
  rationale: Сохраняет устойчивое библейское выражение и значение Божьей вести; написание с прописной буквы соответствует принятой русской библейской традиции, не превращая выражение в отдельное христологическое утверждение.
- source_word: ἐπειδὴ
  choice: Но раз
  rationale: Передаёт причинную связь с последующим поворотом к язычникам; «но» ясно выражает контраст, подразумеваемый ходом мысли.
- source_word: ἀπωθεῖσθε
  choice: отвергаете
  rationale: Настоящее время передаёт совершающийся сознательный отказ от возвещённого слова.
- source_word: αὐτόν
  choice: его
  rationale: Местоимение относится к λόγον, «Слову»; мужской род русского местоимения сохраняет эту грамматическую связь.
- source_word: οὐκ ἀξίους κρίνετε ἑαυτούς
  choice: сами считаете себя недостойными
  rationale: 'Сохраняет рефлексивную конструкцию: слушатели своим решением выносят суждение о самих себе. «Считаете» звучит естественно, не устраняя оценочный оттенок κρίνετε.'
- source_word: τῆς αἰωνίου ζωῆς
  choice: вечной жизни
  rationale: Родительный падеж естественно зависит от прилагательного «недостойными» и точно передаёт греческую конструкцию.
- source_word: ἰδού
  choice: вот
  rationale: Сохраняет указательно-эмфатическую силу слова, привлекающего внимание к решающему повороту.
- source_word: στρεφόμεθα εἰς τὰ ἔθνη
  choice: мы обращаемся к язычникам
  rationale: «Обращаемся» передаёт смену адресата служения, а «язычники» в данном контексте ясно обозначает неевреев, противопоставленных аудитории синагоги.
theological_decisions:
- issue: Значение τὰ ἔθνη в контексте перемены адресатов проповеди
  choice: язычникам
  alternative: народам
  rationale: Непосредственный контраст проходит между слушателями в синагоге и неевреями. «Язычникам» сохраняет этнический смысл контекста, тогда как «народам» может быть понято лишь географически; буквальная альтернатива отмечена в сноске.
- issue: Смысл οὐκ ἀξίους κρίνετε ἑαυτοὺς τῆς αἰωνίου ζωῆς
  choice: сами считаете себя недостойными вечной жизни
  alternative: Павел объявляет их недостойными вечной жизни
  rationale: Греческий текст прямо относит действие κρίνετε к самим слушателям посредством ἑαυτούς. Перевод сохраняет эту рефлексивную направленность и не добавляет более широкого богословского вывода.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; сохранены причинная связь, рефлексивная сила высказывания и эмфатическое «вот». Сноска [a] поставлена непосредственно после слова «язычникам», к которому она относится.
