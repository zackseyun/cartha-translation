  text: Ἄνδρες ἀδελφοί, υἱοὶ γένους Ἀβραὰμ καὶ οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν, ⸀ἡμῖν ὁ λόγος τῆς σωτηρίας ταύτης ⸀ἐξαπεστάλη.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/026.yaml
  text: Brothers[a], sons of the family of Abraham, and those among you who fear God[c][b], to us the message of this salvation has been sent.
translation:
  language: ru
  text: Братья[a], потомки рода Авраама, и те из вас, кто боится Бога[b], — нам послана весть об этом спасении[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мужи, братья». Греческое обращение имеет мужскую форму; в собрании оно могло быть обращено и к более широкой аудитории.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «богобоязненные среди вас». Это выражение может относиться к неиудеям, почитавшим Бога Израиля и связанным с синагогой.'
    reason: cultural_note
  - marker: c
    text: 'Или: «слово этого спасения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνδρες ἀδελφοί
  choice: Мужи братья
  rationale: Сохраняет явно мужскую форму греческого обращения и его торжественный характер; в современном русском выражение понятно, хотя несколько возвышенно. Возможный более широкий охват собравшихся отмечен в сноске.
- source_word: υἱοὶ γένους Ἀβραὰμ
  choice: сыны рода Авраама
  rationale: «Сыны» передаёт υἱοί, а «род» — значение γένος как происхождения, родовой линии или народа, не сводя выражение просто к духовному сыновству.
- source_word: οἱ ἐν ὑμῖν φοβούμενοι τὸν θεόν
  choice: те среди вас, кто боится Бога
  rationale: Описательный перевод сохраняет буквальный смысл причастия и не навязывает ему исключительно специальное историческое значение названия группы.
- source_word: ἡμῖν
  choice: нам
  rationale: Дательный падеж передаёт адресата действия ἐξαπεστάλη; начальная позиция в русском подчёркивает адресованность вести всей названной аудитории.
- source_word: ὁ λόγος
  choice: слово
  rationale: «Слово» сохраняет традиционный и широкий смысл λόγος; контекст ясно показывает, что имеется в виду возвещаемая весть.
- source_word: τῆς σωτηρίας ταύτης
  choice: об этом спасении
  rationale: Передаёт содержательную связь родительного падежа с λόγος естественным современным русским оборотом, не исключая более буквального «слово этого спасения».
- source_word: ἐξαπεστάλη
  choice: было послано
  rationale: Аорист пассивного залога выражен завершённым прошедшим действием; такая форма естественна по-русски и не добавляет отсутствующего в греческом явного указания на отправителя.
theological_decisions:
- issue: Обозначение φοβούμενοι τὸν θεόν
  choice: 'Описательно: «те среди вас, кто боится Бога»'
  alternative: «богобоязненные среди вас» как полутехническое обозначение язычников, связанных с синагогой
  rationale: Описательный вариант сохраняет смысл греческого и одновременно оставляет открытой исторически вероятную отсылку к неиудейским почитателям Бога Израиля.
- issue: Мужская форма обращения Ἄνδρες ἀδελφοί
  choice: «Мужи братья»
  alternative: «Братья и сёстры» или просто «братья»
  rationale: Основной текст сохраняет грамматически мужское обращение и не конкретизирует сверх оригинала состав аудитории; возможный широкий охват пояснён в сноске.
- issue: Связь λόγος и σωτηρία
  choice: «слово об этом спасении»
  alternative: «слово этого спасения»
  rationale: Содержательное понимание родительного падежа естественно в контексте проповеди, но более буквальная формулировка остаётся возможной и приведена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Мужи братья» и «сыны рода Авраама» намеренно сохраняют риторическую форму публичной речи и мужскую маркированность оригинала; остальной синтаксис сделан естественным и понятным.
