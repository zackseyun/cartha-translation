  text: Ἀναχθέντες δὲ ἀπὸ τῆς Πάφου οἱ ⸀περὶ Παῦλον ἦλθον εἰς Πέργην τῆς Παμφυλίας· Ἰωάννης δὲ ἀποχωρήσας ἀπ’ αὐτῶν ὑπέστρεψεν εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/013.yaml
  text: After setting sail from Paphos[a], those with Paul came to Perga in Pamphylia; but John, departing from them[b], returned to Jerusalem.
translation:
  language: ru
  text: Отплыв из Пафоса[a], Павел со спутниками[b] прибыли в Пергию, в Памфилию; Иоанн же, покинув их, возвратился в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выйдя в море из Пафоса».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «те, кто был вокруг Павла»; оборот означает Павла и сопровождавших его людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναχθέντες
  choice: Отплыв
  rationale: В контексте морского путешествия ἀνάγω означает «выйти в море, отплыть». Деепричастие естественно передаёт предшествующее действие греческого аористного причастия.
- source_word: οἱ περὶ Παῦλον
  choice: Павел со спутниками
  rationale: Оборот οἱ περὶ с винительным обозначает человека вместе с окружающей его группой. Этот перевод естественен по-русски и включает самого Павла, не затемняя группового смысла выражения.
- source_word: ἦλθον
  choice: прибыли
  rationale: В рассказе о путешествии контекстуальное «прибыли» естественно передаёт достижение названного места, выраженное глаголом ἔρχομαι.
- source_word: Πέργην τῆς Παμφυλίας
  choice: Пергию Памфилийскую
  rationale: Генитив указывает, к какой области относится город; традиционная русская географическая конструкция кратко и ясно передаёт «Пергию в Памфилии».
- source_word: ἀποχωρήσας ἀπ’ αὐτῶν
  choice: отделившись от них
  rationale: Перевод сохраняет нейтральное значение ухода или отделения и не приписывает Иоанну мотивов, которых данный стих не называет.
- source_word: ὑπέστρεψεν
  choice: возвратился
  rationale: Стандартная передача значения ὑποστρέφω в повествовании.
- source_word: Ἱεροσόλυμα
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города.
theological_decisions:
- issue: Оценка ухода Иоанна
  choice: Нейтральное «отделившись от них»
  alternative: «бросив их» или «оставив их»
  rationale: Сам стих сообщает о поступке Иоанна, но не объясняет его мотив и не даёт ему прямой нравственной оценки. Перевод не переносит в этот стих возможную оценку из последующего повествования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Синтаксис сохраняет последовательность греческого повествования, но избегает неестественной буквальности. Маркеры сносок приведены в соответствие с теми словами, которые они поясняют.
