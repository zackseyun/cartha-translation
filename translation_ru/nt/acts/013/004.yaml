  text: ⸀Αὐτοὶ μὲν οὖν ἐκπεμφθέντες ὑπὸ τοῦ ⸂ἁγίου πνεύματος⸃ κατῆλθον ⸀εἰς Σελεύκειαν, ἐκεῖθέν ⸀τε ἀπέπλευσαν ⸁εἰς Κύπρον,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/004.yaml
  text: So they[a], having been sent out by the Holy Spirit, went down to Seleucia, and from there sailed away to Cyprus.
translation:
  language: ru
  text: Итак, они, посланные Святым Духом[a], спустились в Селевкию и оттуда отплыли на Кипр.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святым духом». Греческое выражение буквально: «святым духом»; в книге Деяний оно обычно понимается как указание на Святого Духа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Αὐτοὶ
  choice: они
  rationale: Явно выраженное местоимение сохраняет лёгкое смысловое выделение действующих лиц; усиленное «они сами» в данном контексте звучало бы избыточно.
- source_word: μὲν οὖν
  choice: Итак
  rationale: Передаёт как вывод из предшествующего поручения, так и переход к следующему этапу повествования.
- source_word: ἐκπεμφθέντες
  choice: посланные
  rationale: Причастие сохраняет пассивное значение и обозначает действие, предшествующее основным глаголам, без тяжеловесного «будучи посланы».
- source_word: ὑπὸ τοῦ ἁγίου πνεύματος
  choice: Святым Духом
  rationale: Творительный падеж естественно передаёт действующее лицо при пассивной конструкции; контекст Деяний указывает на личного божественного деятеля.
- source_word: κατῆλθον
  choice: спустились
  rationale: Сохраняет конкретное значение движения вниз, здесь — из Антиохии к прибрежной Селевкии.
- source_word: εἰς Σελεύκειαν
  choice: в Селевкию
  rationale: Обычное русское обозначение направления к городу.
- source_word: ἐκεῖθεν
  choice: оттуда
  rationale: Прямо и естественно обозначает место отправления.
- source_word: τε
  choice: а
  rationale: В русском повествовании естественно связывает последовательные действия и смену пункта отправления; противительного значения не вносит.
- source_word: ἀπέπλευσαν
  choice: отплыли
  rationale: Передаёт морское отправление и заложенный в приставочном глаголе оттенок удаления от исходного места.
- source_word: εἰς Κύπρον
  choice: на Кипр
  rationale: Нормативная русская конструкция для направления на остров.
theological_decisions:
- issue: Передача ἁγίου πνεύματος
  choice: Святым Духом
  alternative: святым духом
  rationale: В греческом письме регистр букв сам по себе не решает вопрос, однако личная деятельность — Дух посылает миссионеров — и словоупотребление Деяний поддерживают традиционное понимание как Святого Духа. Альтернатива отмечена без утверждения, будто она основана на различии прописных и строчных букв в оригинале.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Географическое движение передано конкретными глаголами «спустились» и «отплыли»; синтаксис остаётся близким к греческому, но не звучит тяжеловесно.
