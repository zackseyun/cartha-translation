  yaml_path: translation/nt/acts/013/037.yaml
  text: But the one whom God raised up did not see decay[a].
translation:
  language: ru
  text: Но Тот, Кого воскресил Бог, не увидел тления[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разложения». Греческое слово обозначает телесное разрушение, разложение; «тление» сохраняет формулировку, перекликающуюся с Псалмом 15:10 в греческом переводе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃν
  choice: Тот, Кого
  rationale: Субстантивированная конструкция естественно передаёт относительное местоимение и ясно указывает на Иисуса без добавления Его имени.
- source_word: δὲ
  choice: Но
  rationale: Союз обозначает противопоставление Давиду, о котором говорится в предыдущем стихе.
- source_word: ὁ θεὸς
  choice: Бог
  rationale: Обычная и естественная передача подлежащего с артиклем в данном контексте.
- source_word: ἤγειρεν
  choice: воскресил
  rationale: В непосредственном контексте глагол означает воскрешение из мёртвых; русское «воскресил» ясно передаёт переходный глагол с Богом как действующим лицом.
- source_word: οὐκ εἶδεν
  choice: не увидел
  rationale: Буквальная передача сохраняет библейскую идиому и словесную связь с Псалмом 15:10 в греческой традиции.
- source_word: διαφθοράν
  choice: тления
  rationale: «Тление» обозначает телесное разложение и одновременно сохраняет узнаваемую лексику цитируемого псалма; более бытовое «разложение» было бы яснее, но ослабило бы межтекстовую связь.
theological_decisions:
- issue: Значение ἤγειρεν
  choice: «воскресил», то есть поднял Иисуса из мёртвых
  alternative: «воздвиг» в смысле избрал или вывел на историческую сцену
  rationale: Противопоставление умершему и подвергшемуся тлению Давиду, а также слова об отсутствии тления делают значение воскресения контекстуально определённым.
- issue: Образное выражение «увидеть тление»
  choice: Сохранить форму «не увидел тления»
  alternative: 'Передать толкованием: «не подвергся разложению»'
  rationale: Буквальная идиома понятна по контексту и сохраняет отзвук Псалма 15:10, не устраняя образность исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Заглавные буквы в «Тот, Кого» помогают обозначить личного референта в самостоятельном стихе, не добавляя имени Иисуса. Конструкция сохраняет краткость и контраст оригинала.
