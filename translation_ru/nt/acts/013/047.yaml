id: ACT.13.47
reference: Acts 13:47
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὕτως γὰρ ἐντέταλται ἡμῖν ὁ κύριος· Τέθεικά σε εἰς φῶς ἐθνῶν τοῦ εἶναί σε εἰς σωτηρίαν ἕως ἐσχάτου τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/047.yaml
  text: 'For so the Lord has commanded us: ‘I have set you as a light for the nations[b][a], so that you may be for salvation to the end of the earth.’'
translation:
  language: ru
  text: 'Ведь так заповедал нам Господь: «Я поставил тебя светом для народов[a], чтобы ты был во спасение до самого края земли[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «светом для язычников». Греческое слово ἐθνῶν может означать как «народы», так и, во многих контекстах, «язычники».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «до краёв земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως γὰρ
  choice: Ведь так
  rationale: Передаёт обосновывающую силу γάρ и указательное значение οὕτως естественным современным русским оборотом.
- source_word: ἐντέταλται
  choice: заповедал
  rationale: Перфект выражает данное ранее повеление, которое сохраняет силу; «заповедал» передаёт его авторитетный и библейский характер без архаической тяжеловесности.
- source_word: ὁ κύριος
  choice: Господь
  rationale: Обычное богословски ёмкое соответствие κύριος в контексте речи Бога в цитируемом Писании.
- source_word: Τέθεικά σε
  choice: Я поставил тебя
  rationale: Перфект τίθημι указывает на состоявшееся назначение с сохраняющимся результатом; «поставил» близко к образу исходного текста и естественно в речи о поручении.
- source_word: εἰς φῶς ἐθνῶν
  choice: светом для народов
  rationale: εἰς передаёт назначение, а ἐθνῶν допускает значения «народы» и «язычники». Основной вариант сохраняет широкий смысл пророческой цитаты; контекстуально возможная альтернатива вынесена в сноску.
- source_word: τοῦ εἶναί σε εἰς σωτηρίαν
  choice: чтобы ты был во спасение
  rationale: Конструкция с τοῦ и инфинитивом передаёт цель или результат. Формулировка сохраняет сжатость и намеренную смысловую напряжённость греческого текста, не уточняя, является ли адресат спасением лично или служит его средством.
- source_word: ἕως ἐσχάτου τῆς γῆς
  choice: до самого края земли
  rationale: Передаёт единственное число ἐσχάτου и значение крайнего предела; «самого» естественно подчёркивает удалённость этого предела.
theological_decisions:
- issue: Применение Павлом и Варнавой пророческого обращения в единственном числе
  choice: Сохранено прямое обращение «тебя/ты» в единственном числе без пояснения его адресата.
  alternative: Перефразировать цитату во множественном числе как прямое поручение апостолам или явно назвать адресата пророчества.
  rationale: Греческий текст дословно цитирует Писание и не объясняет, каким образом слова о служителе применяются к миссии Павла и Варнавы. Сохранение единственного числа не снимает заложенную в тексте богословскую напряжённость.
- issue: Значение εἰς σωτηρίαν
  choice: «во спасение»
  alternative: «чтобы через тебя пришло спасение» или «чтобы ты нёс спасение»
  rationale: Выбранная формулировка не определяет сверх текста, является ли адресат самим спасением, его носителем или средством, через которое оно достигает людей.
translation_notes:
  register: Современный литературный русский с достоинством библейской цитаты. «Ведь так» звучит естественнее буквального «ибо так», тогда как «во спасение» сознательно сохраняет лаконичность и смысловую открытость оригинала. Все обращения внутри цитаты оставлены в единственном числе.
