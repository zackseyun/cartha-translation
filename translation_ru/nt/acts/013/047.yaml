  source_fidelity: 'Текст точно передаёт структуру и смысл греческого оригинала: γὰρ и οὕτως естественно отражены в «Ведь так», перфект ἐντέταλται — в «заповедал», а прямая цитата сохраняет единственное число адресата. «Я поставил тебя светом для народов» адекватно передаёт τέθεικά σε εἰς φῶς ἐθνῶν. Формула «чтобы ты был во спасение» сохраняет намеренно неразъяснённую ёмкость εἰς σωτηρίαν, а «до самого края земли» верно передаёт единственное число ἐσχάτου.'
