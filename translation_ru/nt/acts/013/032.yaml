  text: καὶ ἡμεῖς ὑμᾶς εὐαγγελιζόμεθα τὴν πρὸς τοὺς πατέρας ἐπαγγελίαν γενομένην
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/032.yaml
  text: And we ourselves proclaim to you the good news of the promise made to the fathers,[a]
translation:
  language: ru
  text: И мы возвещаем вам благую весть об обещании, данном отцам,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предкам». В греческом тексте буквально сказано «отцам» — так названы праотцы Израиля в истории завета.'
    reason: Лексический вариант и пояснение историко-заветного употребления.
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Обычный соединительный союз, сохраняющий связь с предшествующим рассуждением без добавления нового смыслового оттенка.
- source_word: ἡμεῖς
  choice: мы
  rationale: Явно выраженное греческое местоимение несёт некоторое ударение; в русском его отдельное употребление перед личной формой глагола достаточно передаёт этот акцент, тогда как «мы сами» могло бы создать чрезмерное противопоставление.
- source_word: ὑμᾶς
  choice: вам
  rationale: При εὐαγγελιζόμεθα адресат естественно передаётся в русском языке дательным падежом.
- source_word: εὐαγγελιζόμεθα
  choice: возвещаем ... как благую весть
  rationale: Передаёт значение провозглашения доброй вести и позволяет сохранить обещание как непосредственный предмет возвещения, не прибегая к более узкому церковному термину «благовествуем».
- source_word: τὴν ... ἐπαγγελίαν
  choice: обещание
  rationale: В данном контексте речь идёт о Божьем обещании Израилю; «обещание» точно и естественно передаёт существительное.
- source_word: πρὸς τοὺς πατέρας
  choice: отцам
  rationale: Πρός обозначает здесь направленность обещания к его получателям. «Отцам» сохраняет буквальный семейный и историко-заветный язык оригинала без внесения отсутствующего притяжательного местоимения «нашим».
- source_word: γενομένην
  choice: данное
  rationale: Причастие характеризует обещание как данное отцам. Такой перевод естественен по-русски и не предвосхищает выраженную в следующем стихе мысль об исполнении.
theological_decisions:
- issue: Передача πατέρες
  choice: отцам
  alternative: предкам
  rationale: Основной текст сохраняет мужской семейный термин оригинала и его историко-заветное звучание; более общее «предкам» указано в сноске как допустимый смысловой вариант.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Оборот «возвещаем вам как благую весть обещание» сохраняет обещание как прямой предмет греческого глагола и избегает как церковного жаргона, так и излишней буквальности. Конечная запятая отражает продолжение предложения в следующем стихе.
