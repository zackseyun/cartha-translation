  text: λυθείσης δὲ τῆς συναγωγῆς ἠκολούθησαν πολλοὶ τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων τῷ Παύλῳ καὶ τῷ Βαρναβᾷ, οἵτινες προσλαλοῦντες ⸀αὐτοῖς ἔπειθον· αὐτοὺς ⸀προσμένειν τῇ χάριτι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/043.yaml
  text: After the synagogue had been dismissed[a], many of the Jews and devout proselytes followed Paul and Barnabas, who, speaking with them[c][b], were urging them to continue in the grace of God.
translation:
  language: ru
  text: Когда собрание в синагоге закончилось[a], многие из иудеев и благочестивых прозелитов последовали за Павлом и Варнавой. Павел и Варнава беседовали с ними и убеждали их оставаться в благодати Божьей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда собравшиеся в синагоге разошлись». Греческое выражение указывает на окончание собрания, а не на закрытие здания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «уговаривали их и дальше пребывать в благодати Божьей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: λυθείσης δὲ τῆς συναγωγῆς
  choice: Когда собрание в синагоге закончилось
  rationale: Генитив абсолютный обозначает предшествующее обстоятельство. Здесь συναγωγή по контексту означает собравшуюся общину или её собрание, а λυθείσης — его завершение; перевод не создаёт впечатления, будто речь идёт о закрытии здания.
- source_word: ἠκολούθησαν
  choice: последовали за
  rationale: Прямо передаёт движение людей вслед за Павлом и Варнавой после собрания, не исключая интереса к их учению.
- source_word: τῶν Ἰουδαίων καὶ τῶν σεβομένων προσηλύτων
  choice: из иудеев и благочестивых прозелитов
  rationale: Прозелиты — принявшие иудаизм, а не просто сочувствующие ему; σεβομένων передано как «благочестивых», что сохраняет указание на их религиозное благоговение.
- source_word: προσλαλοῦντες αὐτοῖς
  choice: беседовали с ними
  rationale: Передаёт сопровождающее и продолжающееся личное общение; русское «беседовали» естественно выражает обращённую к слушателям речь.
- source_word: ἔπειθον αὐτοὺς
  choice: убеждали их
  rationale: Имперфект указывает на продолженное действие, а πείθω непосредственно означает убеждать; этот выбор сохраняет оттенок настойчивого увещания.
- source_word: προσμένειν τῇ χάριτι τοῦ θεοῦ
  choice: оставаться в благодати Божьей
  rationale: προσμένω означает оставаться, продолжать пребывать; конструкция с дательным падежом естественно передаётся по-русски как «оставаться в». Формулировка сохраняет смысловую широту χάρις.
theological_decisions:
- issue: Значение выражения «благодать Божья» в апостольском увещании
  choice: оставаться в благодати Божьей
  alternative: держаться вести о Божьей благодати / сохранять Божье благоволение
  rationale: Греческое выражение может охватывать и благодатное действие Бога, и жизнь в сфере этой благодати. Буквальная и естественная формулировка сохраняет эту богословскую ёмкость, не сужая её до одного толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. Во втором предложении относительная конструкция заменена самостоятельной, чтобы однозначно отнести действие к Павлу и Варнаве и избежать тяжеловесности.
