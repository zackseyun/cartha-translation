lexical_decisions:
- source_word: βλέπετε
  choice: смотрите
  rationale: Форма настоящего времени повелительного наклонения во втором лице множественного числа вводит настойчивое предостережение. «Смотрите» естественно для современного русского и в сочетании «смотрите, чтобы не» точно передаёт предупредительную силу.
- source_word: οὖν
  choice: итак
  rationale: Связывает предостережение с предшествующим возвещением и выводом из него; «итак» ясно и естественно обозначает логическое следствие.
- source_word: μὴ ἐπέλθῃ
  choice: чтобы не постигло вас
  rationale: μή с аористом сослагательного наклонения после императива выражает предупреждение о нежелательном исходе. «Чтобы не постигло вас» естественно передаёт угрозу наступающего суда.
- source_word: τὸ εἰρημένον
  choice: сказанное
  rationale: Субстантивированное причастие совершенного вида обозначает то, что было изречено и сохраняет силу; русское «сказанное» кратко передаёт этот смысл.
- source_word: ἐν τοῖς προφήταις
  choice: у пророков
  rationale: В русском библейском и литературном употреблении «у пророков» естественно указывает на место, где содержится изречение, то есть в корпусе пророческих Писаний, не сводя выражение к указанию на деятеля.
theological_decisions:
- issue: Кого или что обозначают «пророки»
  choice: пророческие книги как часть Писания
  alternative: люди-пророки как непосредственные говорящие
  rationale: Далее Павел цитирует Аввакума, поэтому выражение прежде всего указывает на текст пророческих Писаний. Перевод «у пророков» сохраняет связь с письменным корпусом и не исключает того, что слова были произнесены самими пророками.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Конструкция «смотрите, чтобы не» передаёт настойчивое предупреждение без архаизма; «у пророков» звучит естественнее буквального «в пророках» и сохраняет отсылку к пророческим Писаниям.
