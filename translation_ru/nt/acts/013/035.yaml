  yaml_path: translation/nt/acts/013/035.yaml
  text: Therefore he also says in another psalm[c][b][a], ‘You will not let your Holy One see decay.’
translation:
  language: ru
  text: 'Поэтому и в другом псалме[a] Он говорит: «Ты не дашь Твоему Святому[b] увидеть тление[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в другом»; возможно также: «в другом месте» или «в другом отрывке».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Твоему верному».'
    reason: lexical_alternative
  - marker: c
    text: 'То есть разложение; возможно также: «порча».'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: Поэтому
  rationale: В контексте слово вводит вывод из предшествующего рассуждения и следующую подтверждающую цитату; «поэтому» естественно передаёт причинно-следственную связь.
- source_word: καὶ
  choice: и
  rationale: Частица добавляет ещё одно свидетельство Писания; русское «и» сохраняет эту присоединительную функцию.
- source_word: ἐν ἑτέρῳ
  choice: в другом псалме
  rationale: В греческом буквально «в другом», с подразумеваемым существительным. Цитата взята из Псалма 15 (16), поэтому восполнение «псалме» ясно и контекстуально обосновано; буквальная неопределённость отмечена в сноске.
- source_word: λέγει
  choice: Он говорит
  rationale: Настоящее время сохранено как формула цитирования Писания. Местоимение с прописной буквы указывает на Бога как подразумеваемого говорящего в контексте, не исключая того, что речь представлена через Писание.
- source_word: Οὐ δώσεις
  choice: Ты не дашь
  rationale: Сочетание δίδωμι с инфинитивом имеет разрешительное значение, однако русское «не дашь увидеть» естественно передаёт идиому и сохраняет образ исходной формулировки.
- source_word: τὸν ὅσιόν σου
  choice: Твоему Святому
  rationale: ὅσιος может означать святого, благочестивого или верного Богу человека. «Святому» сохраняет традиционный и контекстуально мессианский смысл; иной лексический оттенок указан в сноске.
- source_word: ἰδεῖν
  choice: увидеть
  rationale: Сохранено прямое значение глагола ὁράω; выражение «увидеть тление» уместно в возвышенной библейской речи и не заменяет образ толкованием.
- source_word: διαφθοράν
  choice: тление
  rationale: В контексте воскресения речь идёт о посмертном разложении. «Тление» точно и ёмко передаёт смысл, сохраняя связь с русской библейской лексикой; более современное пояснение дано в сноске.
theological_decisions:
- issue: Мессианское/христологическое отнесение цитаты из псалма
  choice: «Твоему Святому» с прописной буквы
  alternative: «твоему святому» или «твоему верному»
  rationale: В речи Павла цитата непосредственно применяется к воскресению Иисуса. Прописная буква обозначает контекстуального референта, не меняя лексического диапазона ὅσιος; вариант «верному» сохранён в сноске.
- issue: Восполнение подразумеваемого существительного после ἐν ἑτέρῳ
  choice: «в другом псалме»
  alternative: «в другом месте» или «в другом отрывке»
  rationale: Греческий текст оставляет существительное подразумеваемым, но источник цитаты — псалом, а контекст содержит ряд ссылок на Писание. Восполнение делает русский текст понятным без существенного снятия неоднозначности, которая отмечена в сноске.
- issue: Подразумеваемый субъект λέγει
  choice: «Он говорит» как указание на Бога
  alternative: «сказано» или «Писание говорит»
  rationale: Форма третьего лица единственного числа буквально означает «говорит». Контекст допускает понимание Бога как говорящего через Писание; выбранная форма сохраняет личный субъект, не вводя его имени в текст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Тление» сохраняет поэтическую форму цитаты и точно соответствует теме телесного разложения; сноска поясняет его обычным современным словом. Все маркеры сносок размещены непосредственно после соответствующих выражений.
