source:
  edition: SBLGNT
  text: καὶ νῦν ἰδοὺ χεὶρ κυρίου ἐπὶ σέ, καὶ ἔσῃ τυφλὸς μὴ βλέπων τὸν ἥλιον ἄχρι καιροῦ. παραχρῆμα ⸀δὲ ⸀ἔπεσεν ἐπ’ αὐτὸν ἀχλὺς καὶ σκότος, καὶ περιάγων ἐζήτει χειραγωγούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/011.yaml
  text: And now[a], behold, the hand of the Lord is upon you, and you will be blind, not seeing the sun for a time. Immediately a mist and darkness fell upon him, and going about[c][b], he was seeking people to lead him by the hand.
translation:
  language: ru
  text: 'И вот теперь рука Господа на тебе: ты ослепнешь и на некоторое время не будешь видеть солнца. И тотчас его окутали мгла и тьма; он ходил, ища тех, кто повёл бы его за руку.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: вот
  rationale: Естественная для современного русского языка частица, сохраняющая указательную и привлекающую внимание силу греческого слова.
- source_word: χεὶρ κυρίου
  choice: рука Господа
  rationale: Сохранён прозрачный библейский образ непосредственного действия Господа; контекст указывает на суд, но перевод не заменяет метафору толкованием.
- source_word: ἔσῃ τυφλὸς
  choice: ты ослепнешь
  rationale: По-русски естественно выражает наступление состояния слепоты, обозначенного будущей связкой с прилагательным.
- source_word: μὴ βλέπων τὸν ἥλιον
  choice: не будешь видеть солнца
  rationale: Сохраняет конкретное упоминание солнца и передаёт сопровождающее описание слепоты естественной русской конструкцией.
- source_word: ἄχρι καιροῦ
  choice: до времени
  rationale: Передаёт временный, но не уточнённый предел; не конкретизирует продолжительность.
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Кратко и выразительно передаёт немедленность события в достойном литературном регистре.
- source_word: ἀχλὺς καὶ σκότος
  choice: мгла и тьма
  rationale: Сохраняет два различных, усиливающих друг друга образа помрачения зрения и полной темноты.
- source_word: περιάγων
  choice: ходил вокруг
  rationale: Близко передаёт значение движения туда и сюда, не добавляя отсутствующего в самом причастии явного указания на ощупывание.
- source_word: ἐζήτει χειραγωγούς
  choice: ища тех, кто повёл бы его за руку
  rationale: Раскрывает конкретный смысл существительного χειραγωγούς — людей, ведущих слепого за руку, — без неестественного русского сложного слова.
theological_decisions:
- issue: Значение выражения «рука Господа»
  choice: Сохранить буквальный библейский образ «рука Господа на тебе».
  alternative: «Господь карает тебя» или «суд Господа постиг тебя».
  rationale: В контексте выражение означает действенное вмешательство Господа в суде, однако исходный текст оставляет это в форме образа, который перевод также должен сохранить.
- issue: Продолжительность слепоты
  choice: «до времени» — временный, но неопределённый срок.
  alternative: «на некоторое время».
  rationale: ἄχρι καιροῦ подчёркивает предел состояния, не сообщая ни точной длительности, ни определённого момента окончания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской выразительностью. Синтаксис сделан ясным для чтения вслух; метафора «рука Господа» и парный образ «мгла и тьма» сохранены.
