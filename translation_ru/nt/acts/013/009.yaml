  terminology: 'Традиционные формы «Савл» и «Павел» корректны. «Святого Духа» с прописных букв соответствует контексту Деяний и общепринятому русскому библейскому употреблению. Специальная сноска не требуется: «он же Павел» не создаёт существенной неоднозначности и не навязывает толкования.'
