  text: Σαῦλος δέ, ὁ καὶ Παῦλος, πλησθεὶς πνεύματος ⸀ἁγίου ἀτενίσας εἰς αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/009.yaml
  text: But Saul[a], who was also called Paul, filled with the Holy Spirit, looked intently at him
translation:
  language: ru
  text: Но Савл, он же Павел, исполнившись Святого Духа, пристально посмотрел на него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαῦλος
  choice: Савл
  rationale: Традиционная и общепонятная русская передача личного имени, различающая формы Σαῦλος и Παῦλος.
- source_word: δέ
  choice: Но
  rationale: Передаёт мягкий контраст и переход от действий Елимы к ответу Савла.
- source_word: ὁ καὶ Παῦλος
  choice: он же Павел
  rationale: Естественно по-русски обозначает второе имя того же человека, не добавляя отсутствующего в греческом глагола «назывался».
- source_word: πλησθεὶς
  choice: исполнившись
  rationale: Передаёт аористное пассивное причастие и устойчиво сочетается в русском библейском повествовании с выражением «Святого Духа».
- source_word: πνεύματος ἁγίου
  choice: Святого Духа
  rationale: Родительный падеж обусловлен управлением «исполнившись»; контекст Деяний указывает на Божьего Святого Духа.
- source_word: ἀτενίσας
  choice: пристально посмотрел
  rationale: Передаёт сосредоточенный, неотрывный взгляд естественным современным русским выражением.
- source_word: εἰς αὐτόν
  choice: на него
  rationale: При глаголе зрительного восприятия εἰς указывает на объект направленного взгляда; местоимение относится к Елиме.
theological_decisions:
- issue: Передача πνεύματος ἁγίου
  choice: Святого Духа
  alternative: святого духа
  rationale: В контексте Деяний это устойчивое обозначение Божьего Духа, действующего и наделяющего силой; написание с прописных букв ясно передаёт личный божественный референт.
- issue: Связь πλησθεὶς с последующим действием
  choice: исполнившись Святого Духа, пристально посмотрел
  alternative: полный Святого Духа, пристально смотрел
  rationale: Аористное причастие лучше передать как событие, связанное с последующим решительным действием, не превращая его в одно лишь постоянное качество.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Краткое «он же Павел» сохраняет пояснительную конструкцию оригинала и избегает лишнего утверждения о переименовании.
