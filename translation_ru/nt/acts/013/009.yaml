  source_fidelity: 'Текст точно передаёт все элементы греческого оригинала: Σαῦλος — «Савл»; δέ — уместное «Но»; пояснительное ὁ καὶ Παῦλος — «он же Павел»; πλησθεὶς πνεύματος ἁγίου — «исполнившись Святого Духа»; ἀτενίσας εἰς αὐτόν — «пристально посмотрел на него». «Он же Павел» сохраняет значение дополнительного имени, не утверждая ни переименования, ни его причины. Это также допустимое, более компактное русское соответствие английскому audit trail «who was also called Paul».'
