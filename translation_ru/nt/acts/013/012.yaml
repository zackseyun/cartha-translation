  text: τότε ἰδὼν ὁ ἀνθύπατος τὸ γεγονὸς ἐπίστευσεν ἐκπλησσόμενος ἐπὶ τῇ διδαχῇ τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/012.yaml
  text: Then[a], when the proconsul saw what had happened, he believed[b], being astonished at the teaching of the Lord.
translation:
  language: ru
  text: Тогда проконсул, увидев, что произошло[a], поверил, изумляясь учению Господа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что случилось».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможны также значения: «учению, исходящему от Господа» или «учению о Господе». Греческий родительный падеж допускает несколько толкований.'
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Кратко и естественно передаёт временно-последовательный переход к следующему событию.
- source_word: ἰδὼν
  choice: увидев
  rationale: Деепричастие естественно передаёт аористное причастие и сохраняет временную, а возможно и причинную, связь с главным глаголом.
- source_word: ὁ ἀνθύπατος
  choice: проконсул
  rationale: Сохраняет точное наименование римской должности, а не заменяет его общим словом «правитель».
- source_word: τὸ γεγονός
  choice: что произошло
  rationale: Субстантивированное перфектное причастие обозначает уже совершившееся событие; выбранный оборот естественен в современном русском языке.
- source_word: ἐπίστευσεν
  choice: поверил
  rationale: Объект веры в греческом тексте не назван; перевод сохраняет эту краткость и не добавляет «в Господа» или «благой вести».
- source_word: ἐκπλησσόμενος
  choice: изумляясь
  rationale: Деепричастие сохраняет сопутствующее обстоятельство настоящего причастия и передаёт сильное удивление.
- source_word: ἐπὶ τῇ διδαχῇ
  choice: учению
  rationale: Дательный оборот с ἐπί обозначает основание или повод для изумления; русское управление «изумляться чему» передаёт это естественно.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: 'Родительный падеж сохраняет широкий спектр возможных связей: учение может пониматься как принадлежащее Господу, исходящее от Него или повествующее о Нём.'
theological_decisions:
- issue: Значение πιστεύω без выраженного дополнения
  choice: «поверил» без добавления объекта
  alternative: «уверовал в Господа» или «поверил вести»
  rationale: Контекст подразумевает принятие христианской веры, однако сам греческий текст не называет объекта; перевод не устраняет эту сжатость.
- issue: Значение родительного оборота διδαχῇ τοῦ κυρίου
  choice: «учению Господа»
  alternative: «учению от Господа» или «учению о Господе»
  rationale: Такая форма не вынуждает выбирать между субъектным, притяжательным и объектным пониманием греческого родительного падежа.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Исторически точный термин «проконсул» сохранён; синтаксис остаётся ясным для широкого круга читателей. Маркеры сносок поставлены при тех выражениях, которые они поясняют.
