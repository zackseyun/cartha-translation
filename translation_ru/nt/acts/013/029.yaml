  text: ὡς δὲ ἐτέλεσαν πάντα τὰ περὶ αὐτοῦ γεγραμμένα, καθελόντες ἀπὸ τοῦ ξύλου ἔθηκαν εἰς μνημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/029.yaml
  text: And when they had carried out all that had been written concerning him[a], they took him down from the tree and laid him in a tomb.
translation:
  language: ru
  text: Когда же они исполнили всё написанное о Нём, то сняли Его с дерева[a] и положили в гробницу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с креста». Греч. ξύλον — «дерево»; это слово могло обозначать также деревянное орудие казни и, возможно, отсылает ко Второзаконию 21:23.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Когда же
  rationale: Передаёт временной переход и сохраняет естественное повествовательное течение.
- source_word: ἐτέλεσαν
  choice: исполнили
  rationale: Глагол означает довести до завершения, осуществить; в сочетании с написанным естественно выражает совершение предсказанного, не уточняя сверх текста степень намеренности действующих лиц.
- source_word: πάντα τὰ περὶ αὐτοῦ γεγραμμένα
  choice: всё написанное о Нём
  rationale: Кратко и естественно передаёт совершенное страдательное причастие и всеохватность πάντα.
- source_word: καθελόντες
  choice: сняли Его
  rationale: Предшествующее главному глаголу аористное причастие естественно передано личной формой, обозначающей последовательное действие.
- source_word: ἀπὸ τοῦ ξύλου
  choice: с дерева
  rationale: Сохраняет прямое значение ξύλον и возможный отзвук Второзакония 21:23; контекстуальный вариант «с креста» указан в сноске.
- source_word: ἔθηκαν
  choice: положили
  rationale: Естественный русский глагол для помещения тела при погребении.
- source_word: εἰς μνημεῖον
  choice: в гробницу
  rationale: В данном контексте μνημεῖον обозначает место погребения; «гробница» точно и понятно современному читателю.
theological_decisions:
- issue: Передача ξύλον в повествовании о казни Иисуса
  choice: дерево
  alternative: крест
  rationale: В греческом тексте стоит ξύλον, а не σταυρός. «Дерево» сохраняет лексическую форму и вероятную связь с формулой о повешенном на дереве, не подменяя её более привычным контекстуальным термином.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис умеренно формальный; местоимения, относящиеся к Иисусу, написаны с прописной буквы согласно распространённой русской библейской традиции.
