  text: διεφέρετο δὲ ὁ λόγος τοῦ κυρίου δι’ ὅλης τῆς χώρας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/049.yaml
  text: And the word of the Lord was being spread throughout the whole region[a].
translation:
  language: ru
  text: А слово Господа распространялось по всей области.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весть Господа».'
    reason: Лексическое значение λόγος в данном контексте допускает явную передачу как «весть».
lexical_decisions:
- source_word: διεφέρετο
  choice: распространялось
  rationale: Имперфект передаёт продолжавшееся в прошлом действие. Русская возвратная форма естественно выражает распространение слова, не уточняя названных исполнителей действия.
- source_word: δὲ
  choice: А
  rationale: Здесь δέ служит мягкой повествовательной связкой. «А» естественно продолжает рассказ, не создавая резкого противопоставления.
- source_word: ὁ λόγος
  choice: слово
  rationale: «Слово» сохраняет характерный для Деяний оборот; в контексте оно обозначает возвещаемую весть.
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: Традиционное и контекстуально точное соответствие κύριος, сохраняющее богословскую и литературную выразительность оборота.
- source_word: δι’ ὅλης
  choice: по всей
  rationale: διά с родительным падежом обозначает распространение по всему пространству, а ὅλης подчёркивает его полный охват.
- source_word: τῆς χώρας
  choice: той области
  rationale: χώρα обозначает окружающую местность или регион, а не современное государство. Указательное «той» по-русски естественно отсылает к области, о которой идёт речь в контексте.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» сохраняет обычное новозаветное наименование и возможный христологический и библейский резонанс, не сводя смысл лишь к власти или положению.
- issue: Смысл выражения ὁ λόγος τοῦ κυρίου
  choice: слово Господа
  alternative: весть Господа
  rationale: 'Буквально-идиоматическая передача сохраняет повторяющуюся лексику Луки и не устраняет смысловую широту родительного оборота: слово может пониматься как исходящее от Господа и как возвещение о нём.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка проста и понятна; «распространялось» передаёт длительность действия, а примечание сохраняет лексическую альтернативу.
