  text: ὁ θεὸς τοῦ λαοῦ τούτου ⸀Ἰσραὴλ ἐξελέξατο τοὺς πατέρας ἡμῶν, καὶ τὸν λαὸν ὕψωσεν ἐν τῇ παροικίᾳ ἐν γῇ ⸀Αἰγύπτου, καὶ μετὰ βραχίονος ὑψηλοῦ ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/017.yaml
  text: The God of this people Israel chose our fathers[a], and made the people great during their sojourn in the land of Egypt[d][c][b], and with an uplifted arm he led them out from it.
translation:
  language: ru
  text: Бог этого народа — Израиля — избрал наших отцов[a], возвысил народ[b] во время его пребывания на чужбине в земле Египта и могучей рукой[c] вывел их оттуда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наших предков». Буквально: «наших отцов».'
    reason: lexical_alternative
  - marker: b
    text: «Возвысил» может также означать здесь «сделал великим» или «умножил».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «высокой рукой»; это связанный с исходом образ могущественного Божьего избавления.'
    reason: cultural_note
lexical_decisions:
- source_word: ὁ θεὸς τοῦ λαοῦ τούτου Ἰσραήλ
  choice: Бог этого народа, Израиля
  rationale: Сохраняет аппозиционную структуру греческого текста, при этом русская пунктуация ясно показывает, что «Израиль» называет этот народ.
- source_word: ἐξελέξατο τοὺς πατέρας ἡμῶν
  choice: избрал наших отцов
  rationale: «Избрал» естественно передаёт ἐξελέξατο в библейско-историческом контексте; «отцов» сохраняет прямо выраженное πατέρας.
- source_word: ὕψωσεν
  choice: возвысил
  rationale: Передаёт основной образ глагола ὑψόω и не сужает его спорный смысл исключительно до численного умножения народа.
- source_word: ἐν τῇ παροικίᾳ ἐν γῇ Αἰγύπτου
  choice: во время его пребывания на чужбине в земле Египетской
  rationale: Передаёт παροικία как проживание в чужой стране и сохраняет явное упоминание земли Египта.
- source_word: μετὰ βραχίονος ὑψηλοῦ
  choice: могучей рукой
  rationale: Естественно по-русски передаёт ветхозаветный образ «высокой/вознесённой руки» как проявление Божьей силы при избавлении.
- source_word: ἐξήγαγεν αὐτοὺς ἐξ αὐτῆς
  choice: вывел их оттуда
  rationale: Точно передаёт направленность ἐξάγω и естественно отсылает к земле Египетской без неуклюжего местоименного оборота.
theological_decisions:
- issue: Кого обозначает τοὺς πατέρας ἡμῶν
  choice: наших отцов
  alternative: наших предков
  rationale: Греческий текст буквально говорит об «отцах»; этот вариант сохраняет родовое и заветно-историческое звучание речи Павла.
- issue: Смысл ὕψωσεν применительно к Израилю в Египте
  choice: возвысил народ
  alternative: умножил народ / сделал народ великим
  rationale: Глагол допускает оттенки возвышения, усиления и умножения. Основной текст сохраняет более формальный образ, а примечание отмечает смысловую широту.
- issue: Передача μετὰ βραχίονος ὑψηλοῦ
  choice: могучей рукой
  alternative: вознесённой рукой / высокой рукой
  rationale: Буквальный образ может быть неясен современному русскому читателю; «могучей рукой» передаёт традиционный исходный мотив Божьего властного избавления, а примечание сохраняет буквальную форму.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейско-историческим звучанием. Синтаксис остаётся ясным для обычного читателя; неоднозначность ὕψωσεν и буквальный образ βραχίονος ὑψηλοῦ сохранены в примечаниях.
