lexical_decisions:
- source_word: καθελὼν
  choice: уничтожив
  rationale: Аористное причастие от καθαιρέω в контексте завоевания Ханаана обозначает устранение и сокрушение населявших его народов; «уничтожив» ясно и естественно передаёт силу действия.
- source_word: ἔθνη ἑπτὰ
  choice: семь народов
  rationale: ἔθνη может означать как народы, так и нации; для древнего исторического контекста русское «народы» звучит естественнее и не вызывает современных политических ассоциаций.
- source_word: ἐν γῇ Χανάαν
  choice: в земле Ханаанской
  rationale: Перевод сохраняет явно присутствующее γῇ («земля»); традиционная форма «земля Ханаанская» понятна современному читателю и соответствует возвышенному историческому регистру.
- source_word: κατεκληρονόμησεν
  choice: отдал ... в наследство
  rationale: Глагол выражает передачу или распределение земли как наследственного удела. Эта формулировка сохраняет тему наследства и естественно звучит по-русски.
- source_word: τὴν γῆν αὐτῶν
  choice: их землю
  rationale: Местоимение αὐτῶν относится к только что упомянутым семи народам; прямое «их землю» сохраняет эту связь.
theological_decisions:
- issue: Субъект действия и подразумеваемый получатель земли
  choice: Бог является субъектом обоих действий, а земля передана израильтянам.
  alternative: Бог распределил их землю / отдал их землю в наследство без указания получателя.
  rationale: Контекст перечисляет деяния Бога в истории Израиля. В греческом получатель прямо не назван, однако исторический контекст однозначно указывает на Израиль; слово «израильтянам» делает подразумеваемое понятным, не добавляя отдельного богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейско-историческим звучанием. Местоимение «Он» написано с прописной буквы для ясного указания на Бога в пределах отдельно цитируемого стиха; синтаксис остаётся простым и доступным.
