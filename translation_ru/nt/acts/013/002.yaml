  text: λειτουργούντων δὲ αὐτῶν τῷ κυρίῳ καὶ νηστευόντων εἶπεν τὸ πνεῦμα τὸ ἅγιον· Ἀφορίσατε δή μοι τὸν Βαρναβᾶν ⸀καὶ Σαῦλον εἰς τὸ ἔργον ὃ προσκέκλημαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/002.yaml
  text: While they were ministering to the Lord and fasting[a], the Holy Spirit said, “Set apart for me Barnabas and Saul for the work to which I have called them.”
translation:
  language: ru
  text: 'Когда они служили Господу[a] и постились, Святой Дух сказал: «Отделите же Мне Варнаву и Савла для дела, к которому Я их призвал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершали служение Господу». Греческий глагол может обозначать служение с богослужебным или литургическим оттенком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργούντων
  choice: служили
  rationale: Глагол обозначает служение, в том числе с богослужебными оттенками. Русское «служили Господу» естественно сохраняет широкий смысл, не сводя действие исключительно к формальному богослужению.
- source_word: τῷ κυρίῳ
  choice: Господу
  rationale: Дательный падеж указывает, кому направлено служение; форма «Господу» естественна в русском языке.
- source_word: νηστευόντων
  choice: постились
  rationale: Прямой и общеупотребительный эквивалент; обозначает действие, происходившее одновременно со служением.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святой Дух
  rationale: Традиционное и современное русское обозначение; сохраняет Святого Духа как личного субъекта речи.
- source_word: Ἀφορίσατε
  choice: Отделите
  rationale: Передаёт требование выделить людей для особого назначения, не вводя более узкого понятия рукоположения или назначения на должность.
- source_word: δή
  choice: же
  rationale: Частица «же» кратко передаёт усилительно-побудительный оттенок греческого δή, не утяжеляя повеление.
- source_word: μοι
  choice: Мне
  rationale: Передаёт лицо, для которого Варнава и Савл должны быть отделены; в сочетании «отделите Мне» сохраняет целевую направленность оригинала.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Варнаву и Савла
  rationale: Имена переданы в принятых русских библейских формах и поставлены в требуемом винительном падеже.
- source_word: εἰς τὸ ἔργον
  choice: для дела
  rationale: Сохраняет широту ἔργον и не сужает смысл до технического «служения», «миссии» или церковной должности.
- source_word: ὃ προσκέκλημαι αὐτούς
  choice: к которому Я их призвал
  rationale: Перфект передаёт состоявшийся ранее призыв, сохраняющий силу в настоящем. Русская форма совершенного вида естественно выражает этот смысл.
theological_decisions:
- issue: Значение λειτουργούντων в контексте общей духовной практики
  choice: служили Господу
  alternative: поклонялись Господу; совершали служение Господу
  rationale: Формулировка сохраняет как практический, так и богослужебный оттенок глагола, не ограничивая его конкретной литургической формой.
- issue: Святой Дух как субъект речи
  choice: Святой Дух сказал
  alternative: —
  rationale: Греческий текст прямо представляет Святого Духа говорящим субъектом; перевод сохраняет это без обезличивания.
- issue: Характер отделения Варнавы и Савла
  choice: Отделите же Мне... для дела
  alternative: Назначьте... на служение
  rationale: Текст говорит о выделении для порученного Богом дела, но сам по себе не определяет это как рукоположение или вступление в технически установленную должность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис остаётся ясным для широкого круга читателей; заглавные буквы в «Мне» и «Я» указывают на говорящего Святого Духа в соответствии с принятой русской библейской практикой.
