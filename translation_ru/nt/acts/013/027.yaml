    rationale: Оригинал ставит «осудив» в один ряд с «не узнав» как причастный оборот перед главным «исполнили». Правка делает инструментально-результативную связь явной без добавления «тем самым».
  - severity: low
    issue: Формулировка сноски a «не узнав Этого» неудачна.
    rationale: Буквальный русский эквивалент τοῦτον — «этого»; прописная буква здесь не мотивирована оригиналом и создаёт ненужную стилистическую неровность.
