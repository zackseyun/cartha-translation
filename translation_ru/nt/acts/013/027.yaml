  text: οἱ γὰρ κατοικοῦντες ἐν Ἰερουσαλὴμ καὶ οἱ ἄρχοντες αὐτῶν τοῦτον ἀγνοήσαντες καὶ τὰς φωνὰς τῶν προφητῶν τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας κρίναντες ἐπλήρωσαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/027.yaml
  text: For those who live in Jerusalem and their rulers[a], because they did not recognize this one and by condemning him fulfilled the voices of the prophets that are read every Sabbath[b],
translation:
  language: ru
  text: Ведь жители Иерусалима и их правители, не узнав Его[a] и осудив Его, исполнили слова пророков, которые читаются каждую субботу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «этого»; указательное местоимение может особо выделять Иисуса, о Котором говорит Павел.'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «голоса пророков».'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐν Ἰερουσαλήμ
  choice: жители Иерусалима
  rationale: Субстантивированное причастие обозначает живущих в городе людей; краткая русская формулировка естественна и точно передаёт смысл.
- source_word: οἱ ἄρχοντες αὐτῶν
  choice: их правители
  rationale: Сохраняет властный и судебный оттенок ἄρχοντες в данном контексте.
- source_word: τοῦτον
  choice: Его
  rationale: В русском «этого» или «Сего» здесь звучало бы неестественно либо архаично; местоимение ясно отсылает к Иисусу, а буквальная форма отмечена в сноске.
- source_word: ἀγνοήσαντες
  choice: не узнав
  rationale: Передаёт не простое отсутствие сведений, а неспособность распознать, кто Он; причастная форма сохраняет связь с последующим главным глаголом.
- source_word: τὰς φωνὰς τῶν προφητῶν
  choice: слова пророков
  rationale: Буквальное «голоса пророков» возможно, но в современном русском применительно к читаемому Писанию менее естественно; «слова» передаёт пророческие изречения, а буквальный образ отмечен в сноске.
- source_word: τὰς κατὰ πᾶν σάββατον ἀναγινωσκομένας
  choice: которые читаются каждую субботу
  rationale: Естественно передаёт атрибутивное причастие и регулярность публичного чтения.
- source_word: κρίναντες
  choice: осудили Его
  rationale: Контекст требует судебного смысла κρίνω — вынесения осуждающего решения, а не нейтрального суждения.
- source_word: ἐπλήρωσαν
  choice: исполнили
  rationale: Обычное и точное русское выражение для исполнения пророческого Писания.
- source_word: γὰρ
  choice: Ведь
  rationale: Выражает пояснительную связь с предыдущим высказыванием и естественно звучит в русском начале предложения.
theological_decisions:
- issue: Характер незнания Иисуса
  choice: не узнав Его
  alternative: не зная Его
  rationale: Формулировка сохраняет смысл нераспознания личности и значения Иисуса, не утверждая полного отсутствия знакомства с Ним.
- issue: Связь осуждения с исполнением пророчеств
  choice: осудили Его и тем самым исполнили
  alternative: осудив Его, исполнили
  rationale: «Тем самым» ясно передаёт инструментально-результативную связь κρίναντες с ἐπλήρωσαν, не добавляя причины вне текста.
translation_notes:
  register: Современный литературный русский, понятный при публичном чтении. Синтаксис сделан естественным без устранения напряжения между нераспознанием Иисуса, Его осуждением и исполнением пророческих слов.
