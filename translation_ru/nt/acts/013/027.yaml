- from: Ведь жители Иерусалима и их правители, не узнав Его[a], осудили Его и тем самым исполнили слова пророков, которые читаются каждую субботу[b].
  to: Ведь жители Иерусалима и их правители, не узнав Его[a] и осудив Его, исполнили слова пророков, которые читаются каждую субботу[b].
  rationale: Причастная конструкция «не узнав Его и осудив Его» восстанавливает зависимость обоих действий от главного глагола «исполнили» и сохраняет связь осуждения с исполнением пророческих слов. Сноска a исправлена стилистически и формально; смысл текста не изменён.
