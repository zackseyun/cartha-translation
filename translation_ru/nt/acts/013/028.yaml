id: ACT.13.28
reference: Acts 13:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ μηδεμίαν αἰτίαν θανάτου εὑρόντες ᾐτήσαντο Πιλᾶτον ἀναιρεθῆναι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/028.yaml
  text: And though they found no basis for a death sentence[b][a], they asked Pilate to have him executed.
translation:
  language: ru
  text: И хотя они не нашли никаких оснований для смертного приговора[a], всё же попросили Пилата казнить Его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никакого обвинения, заслуживающего смерти»; или: «никаких законных оснований для казни».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «предать Его смерти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: И
  rationale: Союз продолжает повествование; русское «И» сохраняет простую связующую функцию.
- source_word: μηδεμίαν αἰτίαν θανάτου
  choice: никаких оснований для смертного приговора
  rationale: В судебном контексте αἰτία обозначает основание или обвинение, а θανάτου указывает на смертную казнь. Такая формулировка естественно передаёт отсутствие законных оснований для вынесения смертного приговора.
- source_word: εὑρόντες
  choice: хотя они не нашли
  rationale: 'Аористное причастие предшествует главному действию, а контекст придаёт ему уступительный оттенок: оснований не нашли, но казни всё же потребовали.'
- source_word: ᾐτήσαντο
  choice: попросили
  rationale: Глагол означает «просить, обращаться с просьбой». В данном контексте объект и инфинитив передают официальное обращение к Пилату, не требуя более канцелярского «ходатайствовали».
- source_word: Πιλᾶτον
  choice: Пилата
  rationale: Использована устоявшаяся русская форма имени в требуемом падеже.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: казнить Его
  rationale: В судебном контексте ἀναιρέω означает предать смерти, казнить. Русское «казнить» кратко и ясно сохраняет юридический характер действия; прописная буква в местоимении соответствует традиционному достоинству библейского русского регистра, не меняя смысла.
theological_decisions:
- issue: Следует ли явно передавать уступительное отношение причастного оборота к главному глаголу
  choice: «И хотя они не нашли… всё же попросили…»
  alternative: «И, не найдя… попросили…»
  rationale: 'Греческая конструкция формально допускает обстоятельственное прочтение, однако контекст подчёркивает напряжение: просьба о казни последовала вопреки отсутствию оснований. «Хотя… всё же» делает эту связь ясной, не добавляя конфессионального толкования.'
- issue: Юридическая или общая формулировка смерти
  choice: «оснований для смертного приговора»
  alternative: «причины для смерти» / «обвинения, заслуживающего смерти»
  rationale: Контекст разбирательства перед Пилатом требует юридического смысла, при этом сноска сохраняет допустимые оттенки αἰτία θανάτου.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным звучанием. Юридический контекст передан без тяжеловесного канцелярита; уступительное напряжение оригинала сохранено явно.
