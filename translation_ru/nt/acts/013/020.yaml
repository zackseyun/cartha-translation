  yaml_path: translation/nt/acts/013/020.yaml
  text: For about four hundred and fifty years[a]. And after these things he gave judges until Samuel the prophet.
translation:
  language: ru
  text: Около четырёхсот пятидесяти лет[a]. После этого Бог дал им судей — вплоть до пророка Самуила.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при иной синтаксической связи и пунктуации: «Он дал им судей около четырёхсот пятидесяти лет, вплоть до пророка Самуила». Греческий текст и его пунктуация в этом месте являются предметом споров.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς
  choice: около
  rationale: Перед числительным указывает на приблизительность срока, а не на точное число.
- source_word: ἔτεσι τετρακοσίοις καὶ πεντήκοντα
  choice: четырёхсот пятидесяти лет
  rationale: Передаёт длительность времени полностью и естественно для русского языка.
- source_word: καὶ μετὰ ταῦτα
  choice: После этого
  rationale: Естественно обозначает последующую последовательность событий; начальное καί не требует отдельного «и» в русском.
- source_word: ἔδωκεν
  choice: Бог дал им
  rationale: Сохраняет значение «дал» и библейский образ Божьего дарования руководителей; подлежащее и косвенное дополнение восстановлены из контекста ради ясности.
- source_word: κριτὰς
  choice: судей
  rationale: Это устоявшееся историко-библейское обозначение руководителей Израиля до монархии.
- source_word: ἕως
  choice: вплоть до
  rationale: Ясно обозначает конечную границу периода и естественно сочетается с именем лица.
- source_word: Σαμουὴλ τοῦ προφήτου
  choice: пророка Самуила
  rationale: Естественная русская конструкция сохраняет имя и определяющий титул Самуила.
theological_decisions:
- issue: Синтаксическая связь указания «около четырёхсот пятидесяти лет» в текстуально и пунктуационно трудном месте
  choice: Сохранить временную фразу как отдельное предложение, после которого говорится о даровании судей.
  alternative: 'Связать срок непосредственно с периодом судей: «Он давал им судей около четырёхсот пятидесяти лет, вплоть до пророка Самуила».'
  rationale: Предоставленный текст SBLGNT располагает временную фразу перед καὶ μετὰ ταῦτα; перевод следует этому представлению текста, не устраняя реальную неоднозначность, а выносит альтернативную синтаксическую связь в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Отдельная краткая временная фраза намеренно сохранена вслед за исходным представлением греческого текста; тире помогает естественно выразить конечную временную границу.
