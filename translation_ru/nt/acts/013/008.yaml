base_translation:
  language: en
  yaml_path: translation/nt/acts/013/008.yaml
  text: But Elymas the magician opposed them—for that is how his name is translated—seeking to turn the proconsul away from the faith[a][b].
translation:
  language: ru
  text: Но маг Элима[b] противился им — ибо так истолковывается его имя, — стараясь отвратить проконсула от веры[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны два оттенка: «от христианской веры» или от веры (доверия) как верующего отклика.'
    reason: alternative_reading
  - marker: b
    text: Имя «Элима» здесь объясняется как переведённое или истолкованное; его точное происхождение и значение неясны.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθίστατο
  choice: противился
  rationale: Имперфект передаёт продолжавшееся противодействие; «противился» естественно и точно выражает направленность действия против Павла и Варнавы.
- source_word: δὲ
  choice: Но
  rationale: Союз отмечает контраст с благосклонным интересом проконсула в предыдущем стихе.
- source_word: αὐτοῖς
  choice: им
  rationale: Сохранено местоимение греческого текста без избыточного уточнения уже известных из контекста Павла и Варнавы.
- source_word: Ἐλύμας ὁ μάγος
  choice: Элима-маг
  rationale: Имя транслитерировано в принятой русской форме, а μάγος передано словом «маг», которое здесь обозначает занятие или статус и не усиливает отрицательную окраску до «колдуна».
- source_word: οὕτως γὰρ μεθερμηνεύεται τὸ ὄνομα αὐτοῦ
  choice: так переводится его имя
  rationale: μεθερμηνεύεται допускает перевод или истолкование имени; основной текст сохраняет краткое пояснение автора, а неопределённость вынесена в примечание.
- source_word: ζητῶν
  choice: стараясь
  rationale: Причастие выражает сопутствующее намерение; «стараясь» звучит естественнее буквального «ища» и сохраняет смысл целенаправленной попытки.
- source_word: διαστρέψαι
  choice: отвратить
  rationale: При личном дополнении и конструкции ἀπό глагол означает попытку увести человека от чего-либо; «отвратить» точно и ёмко передаёт это значение.
- source_word: τὸν ἀνθύπατον
  choice: проконсула
  rationale: Сохранён точный римский административный титул, а не обобщённое «правитель».
- source_word: ἀπὸ τῆς πίστεως
  choice: от веры
  rationale: Артикль и контекст позволяют понимать πίστις как христианскую веру, однако русское «от веры» сохраняет и возможность значения верующего отклика; неоднозначность пояснена в примечании.
theological_decisions:
- issue: Значение πίστις в выражении ἀπὸ τῆς πίστεως
  choice: от веры
  alternative: от принятия веры / от христианской веры
  rationale: Контекст поддерживает определённое понимание — христианская вера, но греческое выражение может также указывать на верующий отклик проконсула. Основной перевод не устраняет эту смысловую напряжённость, а примечание называет обе возможности.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Конструкция «Элима-маг» компактно сохраняет приложение, а парные тире передают авторское пояснение. Все примечания отмечены в основном тексте.
