base_translation:
  language: en
  yaml_path: translation/nt/acts/013/007.yaml
  text: who was with the proconsul Sergius Paulus[a], an intelligent man[b]. This man summoned Barnabas and Saul and sought to hear the word of God.
translation:
  language: ru
  text: Он находился при проконсуле Сергии Павле, человеке разумном.[a] Этот человек призвал Варнаву и Савла и пожелал услышать слово Божье.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассудительном человеке»; или: «человеке проницательном».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «весть от Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθυπάτῳ
  choice: проконсуле
  rationale: Точный римский административный титул правителя сенатской провинции; он уместнее общего «правитель».
- source_word: σὺν
  choice: находился при
  rationale: В данном контексте передаёт пребывание или служебную близость к проконсулу естественнее, чем буквальное «был с».
- source_word: ἀνδρὶ συνετῷ
  choice: человеке разумном
  rationale: συνετός обозначает разумность, понятливость и рассудительность; выбранное выражение сохраняет широту значения и звучит естественно по-русски.
- source_word: οὗτος
  choice: Тот
  rationale: Указательное местоимение возобновляет речь о Сергии Павле после пояснительного оборота и устраняет двусмысленность относительно действующего лица.
- source_word: προσκαλεσάμενος
  choice: призвал
  rationale: Причастие означает, что проконсул велел Варнаве и Савлу прийти к нему; «призвал» передаёт инициативу должностного лица без обязательного оттенка принуждения.
- source_word: ἐπεζήτησεν
  choice: захотел
  rationale: Глагол выражает настойчивое желание или стремление. В сочетании с инфинитивом «услышать» русское «захотел» естественно передаёт смысл, не добавляя идеи поиска местонахождения.
- source_word: ἀκοῦσαι
  choice: услышать
  rationale: Прямое и естественное соответствие инфинитиву, здесь означающему восприятие провозглашаемой вести.
- source_word: λόγον τοῦ θεοῦ
  choice: слово Божье
  rationale: Сохраняет традиционную и формально прозрачную библейскую формулу, при этом контекстуально обозначает весть от Бога.
- source_word: Σεργίῳ Παύλῳ
  choice: Сергии Павле
  rationale: Имена переданы в принятой русской библейской форме с падежным согласованием.
- source_word: Βαρναβᾶν καὶ Σαῦλον
  choice: Варнаву и Савла
  rationale: Имена переданы в принятой русской библейской форме и поставлены в винительный падеж согласно синтаксису.
theological_decisions:
- issue: Передача λόγον τοῦ θεοῦ
  choice: слово Божье
  alternative: весть от Бога
  rationale: Выбранный вариант сохраняет образ и формулировку оригинала, не сводя λόγος исключительно к одному оттенку значения; динамическая альтернатива пояснена в сноске.
- issue: Оттенок συνετῷ в характеристике Сергия Павла
  choice: человеке разумном
  alternative: рассудительном человеке; человеке понимающем
  rationale: Слово положительно характеризует ум и способность понимать, но само по себе не утверждает духовную или нравственную добродетель.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. «Проконсул» сохраняет историческую точность, а «слово Божье» — узнаваемую формулу без архаического синтаксиса. Все сноски отмечены в основном тексте.
