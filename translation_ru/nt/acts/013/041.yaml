  text: Ἴδετε, οἱ καταφρονηταί, καὶ θαυμάσατε καὶ ἀφανίσθητε, ὅτι ἔργον ⸂ἐργάζομαι ἐγὼ⸃ ἐν ταῖς ἡμέραις ὑμῶν, ⸀ἔργον ὃ οὐ μὴ πιστεύσητε ἐάν τις ἐκδιηγῆται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/041.yaml
  text: Look[a], you scoffers, and marvel, and perish; for I am doing a work in your days[c][b], a work that you will certainly not believe if someone tells it to you.
translation:
  language: ru
  text: «Смотрите, презрители[a], изумитесь и погибните[b], ведь в ваши дни Я совершаю дело — дело, которому вы ни за что не поверите, если кто-нибудь расскажет[c] вам о нём».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «насмешники». Греческое слово обозначает тех, кто относится к чему-либо с презрением или пренебрежением.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «исчезните». Цитата следует греческому тексту Аввакума 1:5 и содержит суровое предупреждение о гибели.'
    reason: alternative_reading
  - marker: c
    text: Греческий глагол может означать «подробно перескажет» или «обстоятельно изложит».
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἴδετε
  choice: Смотрите
  rationale: Аористный императив во множественном числе призывает обратить внимание. «Смотрите» естественно для современного русского языка и сохраняет настойчивость обращения.
- source_word: καταφρονηταί
  choice: презирающие
  rationale: Слово обозначает людей, относящихся к чему-либо с пренебрежением или презрением. Субстантивированное причастие передаёт смысл без архаичного «презрители» и без чрезмерного сужения до насмешки.
- source_word: θαυμάσατε
  choice: изумитесь
  rationale: Императив передаёт сильное потрясение и сохраняет резкую, отчасти ироническую силу пророческого предупреждения.
- source_word: ἀφανίσθητε
  choice: сгиньте
  rationale: Пассивный императив выражает исчезновение или гибель. «Сгиньте» кратко и сильно передаёт грозное предупреждение, тогда как возможные оттенки отмечены в сноске.
- source_word: ἔργον
  choice: дело
  rationale: Широкое и естественное обозначение значимого Божьего деяния, соответствующее повтору исходного текста.
- source_word: ἐργάζομαι ἐγώ
  choice: Я совершаю
  rationale: Настоящее время и выраженное местоимение ἐγώ подчёркивают действие самого Бога. «Совершаю дело» звучит естественно и торжественно.
- source_word: ἐν ταῖς ἡμέραις ὑμῶν
  choice: в ваши дни
  rationale: Сохраняет временную отнесённость и непосредственность пророческого обращения.
- source_word: οὐ μὴ πιστεύσητε
  choice: вы ни за что не поверите
  rationale: Сочетание οὐ μή с аористным сослагательным выражает усиленное отрицание. Русская конструкция ясно и естественно передаёт эту категоричность.
- source_word: ἐάν τις ἐκδιηγῆται ὑμῖν
  choice: даже если кто-нибудь расскажет вам о нём
  rationale: Глагол означает обстоятельно пересказывать или излагать. «Даже если» естественно передаёт уступительный смысл условия при усиленном отрицании; местоимение «о нём» относится к делу.
theological_decisions:
- issue: Сила пророческого предупреждения в цитате из Аввакума
  choice: Сохранить прямую угрозу гибели словом «сгиньте» и категоричность неверия оборотом «ни за что не поверите».
  alternative: Передать ἀφανίσθητε более буквально как «исчезните» и ослабить οὐ μή до простого «не поверите».
  rationale: В речи Павла цитата служит суровым предупреждением против презрительного отвержения Божьего деяния. Перевод сохраняет эту силу, не уточняя сверх текста характер суда или природу неверия.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой цитаты. Синтаксический повтор «дело — дело» сохранён ради риторической силы оригинала; прописное «Я» указывает на Бога в рамках принятой русской библейской традиции, не меняя смысла исходного текста.
