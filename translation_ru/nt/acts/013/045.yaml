  text: ἰδόντες δὲ οἱ Ἰουδαῖοι τοὺς ὄχλους ἐπλήσθησαν ζήλου καὶ ἀντέλεγον τοῖς ⸀ὑπὸ Παύλου ⸀λαλουμένοις ⸀βλασφημοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/045.yaml
  text: But when the Jews saw the crowds[a], they were filled with jealousy and began contradicting what was spoken by Paul[c][b], blaspheming.
translation:
  language: ru
  text: Но иудеи, увидев толпы[a], исполнились зависти[b] и стали возражать против сказанного Павлом[c] и злословить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть местная группа иудеев, противостоявшая Павлу в этом эпизоде, а не весь еврейский народ.
    reason: cultural_note
  - marker: b
    text: 'Или: «исполнились рвения»; в данном контексте более вероятно отрицательное значение — «зависти».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «против того, что говорил Павел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: увидев
  rationale: Аористное причастие передаёт предшествующее обстоятельство естественной для русского языка деепричастной конструкцией.
- source_word: δὲ
  choice: Но
  rationale: Частица отмечает контраст с предшествующим благоприятным откликом на проповедь.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Сохраняется прямое обозначение греческого текста без необоснованного сужения до руководителей; примечание уточняет локальный референт.
- source_word: τοὺς ὄχλους
  choice: толпы народа
  rationale: Сохраняет множественное число и естественно обозначает большие скопления людей.
- source_word: ἐπλήσθησαν ζήλου
  choice: исполнились зависти
  rationale: Образ исходной конструкции сохранён; враждебный контекст указывает на отрицательное значение ζῆλος, хотя возможное значение «рвение» отмечено в примечании.
- source_word: ἀντέλεγον
  choice: стали возражать
  rationale: Имперфект допускает начинательное и продолжающееся действие; «стали» естественно передаёт начало противодействия.
- source_word: τοῖς ὑπὸ Παύλου λαλουμένοις
  choice: против того, что говорил Павел
  rationale: Передаёт содержание субстантивированного причастия и длительный характер речи без тяжеловесного русского пассива.
- source_word: βλασφημοῦντες
  choice: хуля его слова
  rationale: «Хуля» сохраняет религиозно весомый смысл βλασφημέω; добавление «его слова» естественно связывает причастие с непосредственно названной Павловой речью, не утверждая, что хула была направлена лично на Павла.
theological_decisions:
- issue: Возможность антиеврейского обобщения οἱ Ἰουδαῖοι
  choice: иудеи с пояснительным примечанием
  alternative: иудейские вожди / противники Павла из числа иудеев
  rationale: Основной текст сохраняет явное обозначение источника, а примечание предотвращает необоснованное распространение характеристики местной противостоящей группы на весь еврейский народ.
- issue: Объект хулы в βλασφημοῦντες не выражен прямо
  choice: хуля его слова
  alternative: богохульствуя / произнося хулу
  rationale: Контекст непосредственно связывает хулу с возражениями против сказанного Павлом, однако перевод не уточняет её как прямую хулу на Бога и тем самым не снимает полностью смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой («исполнились», «хуля»). Синтаксис сделан ясным для широкого читателя; неоднозначность ζῆλος и локальный смысл «иудеев» отражены в примечаниях.
