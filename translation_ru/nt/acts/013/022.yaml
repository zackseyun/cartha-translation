  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ μεταστήσας αὐτὸν ἤγειρεν ⸂τὸν Δαυὶδ αὐτοῖς⸃ εἰς βασιλέα, ᾧ καὶ εἶπεν μαρτυρήσας· Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί, ἄνδρα κατὰ τὴν καρδίαν μου, ὃς ποιήσει πάντα τὰ θελήματά μου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/022.yaml
  text: And after removing him[a], he raised up David for them as king, to whom he also bore witness and said, ‘I have found David the son of Jesse, a man according to my heart[b], who will do all my will.’
translation:
  language: ru
  text: 'Устранив его, Бог воздвиг им царём Давида, о котором и засвидетельствовал, сказав: «Я нашёл Давида, сына Иессея, человека по сердцу Моему[a], который исполнит всю Мою волю[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человека согласно Моему сердцу»; возможно также: «человека, угодного Мне».'
    reason: lexical_alternative
  - marker: b
    text: 'В греческом существительное стоит во множественном числе: буквально «все Мои желания (намерения)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταστήσας αὐτόν
  choice: устранив его
  rationale: Причастие указывает на устранение Саула от царской власти; «устранив» передаёт смысл, не сужая его до политического термина «свергнув».
- source_word: ἤγειρεν
  choice: воздвиг
  rationale: Сохраняет библейский образ поставления Богом избранного правителя; контекст «царём» исключает понимание как воскресения.
- source_word: αὐτοῖς εἰς βασιλέα
  choice: им царём
  rationale: Естественно передаёт дательный заинтересованного лица и назначение Давида царём для Израиля.
- source_word: ᾧ καὶ εἶπεν μαρτυρήσας
  choice: о котором и засвидетельствовал, сказав
  rationale: По-русски свидетельство относится к Давиду, а деепричастная конструкция естественно передаёт сопутствующее μαρτυρήσας.
- source_word: Εὗρον Δαυὶδ τὸν τοῦ Ἰεσσαί
  choice: Я нашёл Давида, сына Иессея
  rationale: «Сына Иессея» раскрывает подразумеваемое родственное обозначение и звучит естественно по-русски.
- source_word: ἄνδρα κατὰ τὴν καρδίαν μου
  choice: человека по сердцу Моему
  rationale: Сохраняет образ и близко передаёт κατά; «человека» здесь естественнее современному читателю, чем стилистически архаичное «мужа».
- source_word: πάντα τὰ θελήματά μου
  choice: всю Мою волю
  rationale: Идиоматичное русское выражение для полного исполнения Божьих намерений; множественное число греческого существительного отмечено в сноске.
theological_decisions:
- issue: Характеристика Давида как человека κατὰ τὴν καρδίαν Бога
  choice: по сердцу Моему
  alternative: угодного Мне; соответствующего Моим намерениям
  rationale: Сохранён образ исходного текста и его традиционная узнаваемость без сведения смысла только к эмоциональной близости или только к послушанию.
- issue: Значение ἤγειρεν применительно к Давиду
  choice: воздвиг им царём
  alternative: поставил им царём
  rationale: «Воздвиг» сохраняет библейский образ Божьего действия, тогда как упоминание царского достоинства ясно задаёт нересуррекционный смысл.
- issue: Множественное число θελήματα
  choice: всю Мою волю
  alternative: все Мои желания; все Мои намерения
  rationale: Русское «всю Мою волю» естественно выражает совокупность Божьих повелений и намерений; формальная множественность источника не скрыта, а вынесена в сноску.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Слово «воздвиг» сохранено ради образности и межтекстовой связи, а синтаксис упрощён для ясного чтения. Слово «Бог» добавлено как явный субъект длинной русской фразы; в греческом субъект восстанавливается из контекста.
