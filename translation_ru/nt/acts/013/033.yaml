id: ACT.13.33
reference: Acts 13:33
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὅτι ταύτην ὁ θεὸς ἐκπεπλήρωκεν τοῖς τέκνοις ⸀ἡμῶν ἀναστήσας Ἰησοῦν, ὡς καὶ ἐν τῷ ⸂ψαλμῷ γέγραπται τῷ δευτέρῳ⸃· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/033.yaml
  text: 'that God has fulfilled this for our children by raising up Jesus[a], as it is also written in the second Psalm: ‘You are my Son[b]; today I have begotten you.’'
translation:
  language: ru
  text: 'что Бог исполнил это для наших детей[a], воздвигнув Иисуса[b], как и написано во втором псалме:


    «Ты — Сын Мой;

    сегодня Я родил Тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «для нас, их детей»; другие поддерживают чтение «для наших детей».'
    reason: textual_variant
  - marker: b
    text: 'Или: «воскресив Иисуса из мёртвых». Греческое выражение может также означать, что Бог «воздвиг» Иисуса, то есть явил или поставил Его для исполнения служения.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπεπλήρωκεν
  choice: исполнил
  rationale: Перфект обозначает совершившееся исполнение с сохраняющимся результатом; «исполнил» естественно передаёт язык исполнения обещания в контексте.
- source_word: ταύτην
  choice: это
  rationale: Указательное местоимение отсылает к обещанию из предыдущего стиха; существительное не добавляется в основной текст.
- source_word: τοῖς τέκνοις ἡμῶν
  choice: для наших детей
  rationale: Так прямо передано основное чтение SBLGNT; дательный падеж выражает тех, для кого Бог исполнил обещание. Текстовый вариант отмечен в сноске.
- source_word: ἀναστήσας Ἰησοῦν
  choice: воздвигнув Иисуса
  rationale: '«Воздвигнув» сохраняет возможную двусмысленность: Бог мог воздвигнуть Иисуса как посланного Им Спасителя либо воскресить Его. Более определённые толкования вынесены в сноску.'
- source_word: γέγραπται
  choice: написано
  rationale: Устойчивая русская формула введения цитаты из Писания, естественно передающая греческий перфект пассива.
- source_word: ψαλμῷ ... τῷ δευτέρῳ
  choice: во втором псалме
  rationale: Следует формулировке греческого текста и звучит естественно по-русски.
- source_word: Υἱός μου εἶ σύ
  choice: Ты — Сын Мой
  rationale: Естественный русский порядок слов с именным сказуемым сохраняет торжественность и определённость утверждения.
- source_word: σήμερον γεγέννηκά σε
  choice: сегодня Я родил Тебя
  rationale: Прямо передаёт γεννάω и не заменяет образ толкованием вроде «стал Твоим Отцом»; форма остаётся понятной современному читателю и сохраняет межтекстовую и христологическую значимость цитаты.
theological_decisions:
- issue: Значение ἀναστήσας Ἰησοῦν в данном контексте
  choice: «воздвигнув Иисуса» — формулировка, сохраняющая смысловую напряжённость
  alternative: «воскресив Иисуса» или «поставив/явив Иисуса»
  rationale: В ближайшем контексте речь идёт о воскресении, но ἀνίστημι в Деяниях может также обозначать воздвижение Богом посланника. Перевод не должен без необходимости устранять эту неоднозначность.
- issue: Христологический смысл слов «сегодня Я родил Тебя»
  choice: Цитата передана непосредственно, без поясняющей вставки
  alternative: Истолковать её в основном тексте как воцарение, усыновление или подтверждение воскресением
  rationale: Псалом 2:7 цитируется без авторского пояснения значения слова «сегодня»; перевод сохраняет текст и не решает внутри него последующие богословские споры.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для чтения Писания. «Воздвигнув» намеренно сохранено как несколько возвышенное, но понятное слово, позволяющее не устранять неоднозначность оригинала. В цитате использованы традиционные прописные буквы в местоимениях, относящихся к Богу и Его Сыну.
