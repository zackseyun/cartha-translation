lexical_decisions:
- source_word: διελθόντες δὲ ὅλην τὴν νῆσον
  choice: Пройдя весь остров
  rationale: Аористное причастие передаёт действие, предшествующее основному глаголу; русская деепричастная конструкция естественно сохраняет последовательность событий. Частица δέ здесь лишь продолжает повествование и не требует отдельного перевода.
- source_word: ἄχρι Πάφου
  choice: до самого Пафоса
  rationale: ἄχρι обозначает конечный пункт пути; «до самого» естественно передаёт пространственный предел без добавления нового смысла.
- source_word: εὗρον
  choice: встретили
  rationale: В данном повествовательном контексте русское «встретили» естественно передаёт обнаружение человека; буквальное «нашли» могло бы ошибочно подразумевать целенаправленный поиск.
- source_word: ἄνδρα τινὰ
  choice: некоего человека
  rationale: «Некоего» сохраняет неопределённо-индивидуализирующую силу τινά, не утяжеляя фразу.
- source_word: μάγον
  choice: магом
  rationale: «Маг» является прямым и понятным соответствием μάγος и сохраняет некоторую широту греческого слова; «колдун» сильнее истолковывает характер его занятий.
- source_word: ψευδοπροφήτην
  choice: лжепророком
  rationale: Устоявшееся русское соответствие точно передаёт как притязание на пророческий статус, так и его ложность.
- source_word: Ἰουδαῖον
  choice: иудея
  rationale: Слово употреблено субстантивированно и характеризует этнорелигиозную принадлежность человека; географическое «житель Иудеи» контекстом не требуется.
- source_word: ᾧ ὄνομα Βαριησοῦ
  choice: по имени Вариисус
  rationale: Русская именная формула естественно передаёт греческий оборот. «Вариисус» следует сложившейся русской передаче имени, не заменяя имя переводом его предполагаемого значения.
theological_decisions:
- issue: Передача имени Βαριησοῦ
  choice: Вариисус
  alternative: Бар-Иисус
  rationale: Собственное имя транслитерировано в соответствии со сложившейся русской библейской формой. Вариант «Бар-Иисус» яснее показывает семитское строение имени, но в основном тексте мог бы восприниматься как его истолкование; он указан в примечании.
- issue: Характеристика μάγος
  choice: маг
  alternative: колдун
  rationale: «Маг» сохраняет лексическую широту исходного слова и не усиливает отрицательную оценку сверх уже явного обозначения «лжепророк».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным ритмом. Перечень характеристик перестроен в придаточную конструкцию ради естественности, при этом все смысловые элементы греческого текста сохранены.
