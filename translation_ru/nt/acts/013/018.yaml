lexical_decisions:
- source_word: καί
  choice: И
  rationale: Обычный соединительный союз, продолжающий историческое повествование Павла.
- source_word: ὡς
  choice: около
  rationale: При обозначении времени указывает на приблизительность срока.
- source_word: τεσσερακονταετῆ χρόνον
  choice: сорока лет
  rationale: Естественная русская передача периода продолжительностью примерно сорок лет; длительность выражена формой родительного падежа при «около».
- source_word: ἐτροποφόρησεν
  choice: терпел
  rationale: В основном тексте SBLGNT глагол означает, что Бог сносил или терпел народ; лаконичное «терпел» естественно передаёт этот смысл по-русски.
- source_word: αὐτοὺς
  choice: их
  rationale: Местоимение относится к народу Израиля.
- source_word: ἐν τῇ ἐρήμῳ
  choice: в пустыне
  rationale: Традиционное и естественное обозначение местности странствий Израиля, сохраняющее библейские переклички.
theological_decisions:
- issue: Характер Божьего отношения к Израилю в пустыне
  choice: Он терпел их
  alternative: Он заботился о них
  rationale: Предоставленный текст SBLGNT содержит ἐτροποφόρησεν — «терпел, сносил», поэтому основной перевод не смягчает этот смысл. Иное рукописное чтение, выражающее заботу, отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Местоимение «Он» написано с прописной буквы как указание на Бога; пунктуация ставит маркер сноски после завершённого предложения.
