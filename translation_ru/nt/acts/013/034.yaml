  text: ὅτι δὲ ἀνέστησεν αὐτὸν ἐκ νεκρῶν μηκέτι μέλλοντα ὑποστρέφειν εἰς διαφθοράν, οὕτως εἴρηκεν ὅτι Δώσω ὑμῖν τὰ ὅσια Δαυὶδ τὰ πιστά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/034.yaml
  text: 'And that he raised him from the dead, no longer about to return to decay, he has spoken in this way: ‘I will give you the holy and sure blessings of David.’'
translation:
  language: ru
  text: 'А о том, что Бог воскресил Его из мёртвых и что Он уже не вернётся к тлению, Он сказал так: «Я дам вам святые и непреложные благословения Давида»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по традиции: «верные милости Давидовы». Греческие слова перекликаются с Ис 55:3 и говорят о святых, надёжных заветных обещаниях и благах, связанных с Давидом.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέστησεν αὐτὸν ἐκ νεκρῶν
  choice: воскресил Его из мёртвых
  rationale: В сочетании с ἐκ νεκρῶν глагол однозначно обозначает воскресение. Русское «воскресил» естественно передаёт действие Бога и сохраняет переходность греческой конструкции.
- source_word: μηκέτι μέλλοντα ὑποστρέφειν
  choice: Ему уже не предстояло возвратиться
  rationale: Оборот с μέλλω и инфинитивом указывает на последующее событие, которому уже не надлежит произойти. «Не предстояло» сохраняет этот оттенок точнее, чем категорическое пояснение «никогда больше не возвратится».
- source_word: διαφθοράν
  choice: тлению
  rationale: В контексте смерти и воскресения речь идёт о телесном разложении. «Тление» — понятное в библейском контексте русское слово, не создающее преимущественно нравственного смысла, возможного у слова «порча».
- source_word: οὕτως εἴρηκεν
  choice: Он сказал так
  rationale: Естественная русская формула введения цитаты. Результативность перфекта здесь выражена сохраняющей силу цитатой и не требует тяжеловесного «Он изрёк» или «Он сказал и это остаётся сказанным».
- source_word: Δώσω ὑμῖν
  choice: Я дам вам
  rationale: Прямо и естественно передаёт будущее обещание.
- source_word: τὰ ὅσια Δαυὶδ τὰ πιστά
  choice: святые и непреложные благословения Давида
  rationale: Эллиптическое выражение, восходящее к Ис 55:3, обозначает священные и надёжные заветные блага, связанные с Давидом. «Благословения» естественно передаёт субстантивированное множественное τὰ ὅσια, а «непреложные» выражает надёжность τὰ πιστά, не сводя её лишь к субъективной верности.
theological_decisions:
- issue: Смысл цитаты τὰ ὅσια Δαυὶδ τὰ πιστά из Ис 55:3
  choice: святые и непреложные благословения Давида
  alternative: верные милости Давидовы; святые и верные обещания, данные Давиду
  rationale: Фраза допускает понимание как милостей, благ, обещаний или священных установлений, связанных с Давидом. Основной текст сохраняет её заветный характер и связь с Давидом, но не уточняет сверх текста, являются ли это исключительно обещания, данные Давиду, или блага, через него предназначенные другим. Традиционный вариант приведён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Слово «тление» сохранено как точный и узнаваемый термин контекста воскресения; устаревшие синтаксические обороты избегаются. Имена Бога в местоимениях оформлены с прописной буквы для ясности референции в данном контексте.
