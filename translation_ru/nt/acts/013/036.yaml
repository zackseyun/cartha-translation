  - severity: medium
    issue: «Подвергся тлению» вместо «увидел тление»
    rationale: Перевод объясняет смысл, но заменяет образ и устойчивую формулу εἶδεν διαφθοράν. В следующем стихе этот оборот повторяется в отрицательной форме, поэтому его следует сохранить.
