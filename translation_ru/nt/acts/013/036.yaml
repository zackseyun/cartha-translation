  text: Δαυὶδ μὲν γὰρ ἰδίᾳ γενεᾷ ὑπηρετήσας τῇ τοῦ θεοῦ βουλῇ ἐκοιμήθη καὶ προσετέθη πρὸς τοὺς πατέρας αὐτοῦ καὶ εἶδεν διαφθοράν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/036.yaml
  text: For David[a], after serving God's purpose in his own generation[d][c][b], fell asleep and was gathered to his fathers and saw decay.
translation:
  language: ru
  text: Ведь Давид, послужив в своём поколении Божьему замыслу, уснул[a], присоединился к своим предкам[b] и увидел тление[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Уснул» — библейское образное выражение, означающее смерть.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «был присоединён к своим отцам» — семитский оборот о присоединении к предкам после смерти.'
    reason: lexical_alternative
  - marker: c
    text: То есть его тело подверглось разложению; ср. противопоставление в следующем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: ἰδίᾳ γενεᾷ
  choice: в своём поколении
  rationale: Дательный оборот естественно указывает на время и историческую среду служения Давида, не превращая поколение в получателя этого служения.
- source_word: ὑπηρετήσας
  choice: послужив
  rationale: Аористное причастие обозначает действие, предшествующее основным глаголам; «послужив» кратко и естественно сохраняет эту связь.
- source_word: τῇ τοῦ θεοῦ βουλῇ
  choice: Божьему замыслу
  rationale: βουλή здесь означает намерение, замысел или волю Бога. «Божий замысел» понятно современному читателю и не сужает значение до совета как высказывания.
- source_word: ἐκοιμήθη
  choice: уснул
  rationale: Сохранена исходная библейская метафора смерти, важная для образности текста.
- source_word: προσετέθη πρὸς τοὺς πατέρας αὐτοῦ
  choice: был приобщён к своим предкам
  rationale: Формулировка передаёт семитский оборот о присоединении умершего к праотцам, избегая неестественного буквального «был добавлен».
- source_word: εἶδεν διαφθοράν
  choice: подвергся тлению
  rationale: Оборот означает телесное разложение. Такое выражение по-русски естественнее буквального «увидел тление» и сохраняет контраст со следующим стихом.
theological_decisions:
- issue: Метафорическое обозначение смерти Давида
  choice: уснул
  alternative: умер
  rationale: Греческий текст употребляет κοιμάομαι, а не прямой глагол смерти. Сохранение метафоры передаёт библейский образ, не добавляя особого учения о состоянии умерших.
- issue: Значение βουλή применительно к Богу
  choice: Божьему замыслу
  alternative: Божьей воле / Божьему совету
  rationale: «Замысел» передаёт Божье целенаправленное намерение, сохраняя смысловую широту слова и не навязывая узкой богословской схемы.
- issue: Синтаксическая связь дательных оборотов ἰδίᾳ γενεᾷ и τῇ τοῦ θεοῦ βουλῇ
  choice: послужив в своём поколении Божьему замыслу
  alternative: послужив своему поколению по Божьему замыслу
  rationale: 'Порядок слов допускает известную синтаксическую неоднозначность. Основной текст следует наиболее вероятному пониманию: Божий замысел — объект служения, а поколение — временная сфера; альтернативу отмечает сноска.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Слова «уснул» и «тление» сохраняют ключевую образность исходного текста; значение идиом пояснено в сносках.
