  footnotes:
  - marker: a
    text: 'Или: «женщин, боящихся Бога». Это выражение может обозначать женщин, поклонявшихся Богу Израиля, возможно, язычниц, связанных с синагогой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из их пределов», «из их области» или «из их территории». Греческое слово может означать как территориальные границы, так и заключённую в них область.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παρώτρυναν
  choice: подстрекнули
  rationale: Передаёт активное побуждение к враждебным действиям и естественно звучит в данном контексте.
- source_word: σεβομένας γυναῖκας
  choice: набожных женщин
  rationale: Сохраняет значение религиозного почитания, не превращая возможную связь с синагогой в однозначный технический статус.
- source_word: εὐσχήμονας
  choice: влиятельных
  rationale: В контексте общественной верхушки указывает на высокий статус и вес этих женщин в обществе.
- source_word: τοὺς πρώτους τῆς πόλεως
  choice: первых людей города
  rationale: Естественное русское обозначение наиболее видных и влиятельных мужчин города; сохраняет мужскую референцию греческого выражения.
- source_word: ἐπήγειραν διωγμὸν
  choice: возбудили гонение
  rationale: 'Передаёт каузативный смысл: они вызвали и развернули преследование.'
- source_word: ἐπὶ τὸν Παῦλον καὶ Βαρναβᾶν
  choice: на Павла и Варнаву
  rationale: Обычное русское управление при слове «гонение», ясно выражающее направленность преследования.
- source_word: ἐξέβαλον
  choice: изгнали
  rationale: Кратко и точно передаёт принудительное удаление.
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: из своих пределов
  rationale: 'Сохраняет пространственную широту ὅρια: это могут быть границы либо заключённая в них территория.'
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: Но иудеи
  rationale: «Но» передаёт контрастный поворот относительно предшествующего повествования.
theological_decisions:
- issue: Статус женщин, обозначенных причастием σεβομένας
  choice: набожных женщин
  alternative: женщин, боящихся Бога
  rationale: Выбранный вариант сохраняет религиозный смысл, но не утверждает безусловно, что выражение является специальным обозначением язычниц, связанных с синагогой.
- issue: Мужская референция τοὺς πρώτους τῆς πόλεως
  choice: первых людей города
  alternative: руководителей города
  rationale: Греческий текст явно использует форму мужского рода; перевод сохраняет это указание и одновременно звучит естественно по-русски.
