base_translation:
  language: en
  yaml_path: translation/nt/acts/013/042.yaml
  text: As they were going out[b][a], they were urging that these words be spoken to them on the next Sabbath.
translation:
  language: ru
  text: Когда же они выходили[a], они настойчиво просили, чтобы в следующую субботу им сказали эти слова[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях сказано подробнее: «Когда Павел и Варнава выходили, народ просил, чтобы в следующую субботу им сказали эти слова».'
    reason: textual_variant
  - marker: b
    text: 'Возможный перевод: «Когда они уходили, они просили, чтобы в ближайшую субботу им были сказаны эти слова».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξιόντων
  choice: Когда … выходили
  rationale: Генитив абсолютный с причастием настоящего времени передан придаточным времени; несовершенный вид «выходили» сохраняет характер протекающего действия.
- source_word: δὲ
  choice: же
  rationale: Слабая соединительно-переходная частица естественно передаётся русским «же», не создающим резкого противопоставления.
- source_word: αὐτῶν
  choice: они
  rationale: Местоименная форма не уточняет, о ком именно идёт речь; перевод не подставляет имена и сохраняет обусловленную текстом неоднозначность.
- source_word: παρεκάλουν
  choice: настойчиво просили
  rationale: Имперфект указывает на продолжавшуюся просьбу, а παρακαλέω в данном контексте выражает настоятельное обращение, а не утешение или нравственное увещание.
- source_word: εἰς τὸ μεταξὺ σάββατον
  choice: в следующую субботу
  rationale: Идиоматическое сочетание обозначает ближайшую, следующую субботу; буквальное «в промежуточную субботу» в современном русском неясно.
- source_word: λαληθῆναι
  choice: сказали
  rationale: Пассивный инфинитив передан естественной для русского неопределённо-личной конструкцией, без указания не названного в греческом исполнителя.
- source_word: αὐτοῖς
  choice: им
  rationale: Дательный падеж обозначает адресатов речи и прямо соответствует русскому «им».
- source_word: τὰ ῥήματα ταῦτα
  choice: эти слова
  rationale: Перевод сохраняет конкретную отсылку к только что произнесённым словам Павла и не заменяет её более толковательным «эту весть».
theological_decisions:
- issue: К кому относятся местоимения в стихе
  choice: В основном тексте сохранены местоимения «они» и «им» без подстановки Павла, Варнавы, народа или иной группы.
  alternative: Явно указать, что народ просил Павла и Варнаву, либо понять Павла и Варнаву как просящих народ.
  rationale: Греческий текст данной редакции не называет участников существительными, а текстологическая история и синтаксис допускают разное соотнесение местоимений. Перевод не должен разрешать эту трудность за исходный текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксическая повторяемость местоимения «они» оставлена намеренно ради неоднозначности исходного текста; «настойчиво просили» передаёт силу глагола без архаичного «умоляли».
