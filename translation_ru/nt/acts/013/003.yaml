    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: Тогда
  rationale: Передаёт временную и последовательную связь с предшествующим повелением Святого Духа.
- source_word: νηστεύσαντες καὶ προσευξάμενοι
  choice: после поста и молитвы
  rationale: Естественно по-русски передаёт предшествование действий, выраженных аористными причастиями, главному глаголу.
- source_word: ἐπιθέντες τὰς χεῖρας αὐτοῖς
  choice: они возложили на них руки
  rationale: Сохраняет конкретный жест исходного текста, не определяя его как таинство, рукоположение или иной специальный обряд.
- source_word: ἀπέλυσαν
  choice: отпустили их
  rationale: Сохраняет основной и контекстуально уместный смысл — позволили Варнаве и Савлу отправиться в путь, — а также лексическую неоднозначность глагола лучше, чем более интерпретирующее «послали».
theological_decisions:
- issue: Значение возложения рук
  choice: 'Описать действие буквально: «возложили на них руки»'
  alternative: «рукоположили их», «благословили их», «официально поручили им служение»
  rationale: Стих сообщает о жесте, но сам не устанавливает его точного сакраментального или церковно-правового значения.
- issue: Роль общины в отправлении Варнавы и Савла
  choice: «отпустили их»
  alternative: «послали их»
  rationale: Греческое ἀπολύω может означать отпустить или дать уйти; такая передача не затмевает сказанного в следующем стихе о том, что их послал Святой Дух.
translation_notes:
  register: Современный литературный русский язык с традиционно узнаваемым, но естественным выражением «возложили руки». Синтаксис упрощён по сравнению с цепочкой греческих причастий, при этом последовательность действий сохранена.
