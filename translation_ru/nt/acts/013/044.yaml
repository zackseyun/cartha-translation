  text: Τῷ ⸀δὲ ἐρχομένῳ σαββάτῳ σχεδὸν πᾶσα ἡ πόλις συνήχθη ἀκοῦσαι τὸν λόγον τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/044.yaml
  text: On the coming Sabbath[b][a], nearly the whole city gathered together to hear the word of the Lord.
translation:
  language: ru
  text: В следующую субботу[a] почти весь город собрался послушать слово Господа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В наступающую субботу»; «В ближайшую субботу».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «слово Господа» можно также понимать как «весть Господа» или, с учётом контекста, «весть о Господе».
    reason: alternative_reading
lexical_decisions:
- source_word: Τῷ δὲ ἐρχομένῳ σαββάτῳ
  choice: В следующую субботу
  rationale: Дательный оборот имеет временное значение. «В следующую субботу» естественно звучит по-русски и передаёт ἐρχομένῳ как указание на наступающую, следующую субботу.
- source_word: σχεδὸν
  choice: почти
  rationale: Прямое и естественное соответствие значению «почти, едва не».
- source_word: πᾶσα ἡ πόλις
  choice: весь город
  rationale: Обычный русский способ обозначить население города в широком, риторически обобщённом смысле; выражение не обязательно подразумевает каждого жителя без исключения.
- source_word: συνήχθη
  choice: собрался
  rationale: Форма συνάγω здесь описывает собрание людей и по-русски естественно передаётся возвратным глаголом в единственном числе при собирательном подлежащем «город».
- source_word: ἀκοῦσαι
  choice: послушать
  rationale: Инфинитив выражает цель собрания. В данном контексте «послушать» естественнее русского «услышать» и указывает на намеренное слушание, не добавляя содержания к сказанному.
- source_word: τὸν λόγον
  choice: слово
  rationale: Сохраняет повторяющуюся в Деяниях формулу и более широкий смысл λόγος, не сводя его заранее к одному толкованию вроде «весть» или «проповедь».
- source_word: τοῦ κυρίου
  choice: Господа
  rationale: 'Родительный падеж прямо воспроизводит греческую конструкцию и сохраняет её смысловую ёмкость: слово принадлежит Господу, исходит от Него или возвещает о Нём.'
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: «Господь» — укоренившееся и уместное соответствие κύριος в языке раннехристианского возвещения; оно не сужает референцию сверх того, что сказано в стихе.
- issue: Смысл выражения τὸν λόγον τοῦ κυρίου
  choice: Сохранить формулу «слово Господа»
  alternative: «весть Господа» или «весть о Господе»
  rationale: Родительный оборот допускает взаимосвязанные оттенки принадлежности, источника и содержания. Буквенная формула сохраняет характерную для Луки лексику и не устраняет богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Синтаксис прост и естественен; традиционная формула «слово Господа» сохранена ради лексической связности книги и смысловой открытости.
