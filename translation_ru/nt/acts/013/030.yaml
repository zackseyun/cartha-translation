  text: But God raised him from the dead.
translation:
  language: ru
  text: Но Бог воскресил Его из мёртвых.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: Но
  rationale: 'Частица выражает контраст с предшествующим сообщением о человеческих действиях: Иисуса убили и положили в гроб, но Бог воскресил Его.'
- source_word: θεὸς
  choice: Бог
  rationale: Существительное прямо обозначает Бога как совершающего действие.
- source_word: ἤγειρεν
  choice: воскресил
  rationale: В контексте воскресения переходный глагол «воскресил» естественно и точно передаёт действие Бога по отношению к умершему Иисусу; вариант «поднял» по-русски был бы двусмыслен.
- source_word: αὐτὸν
  choice: Его
  rationale: Местоимение относится к Иисусу; написание с прописной буквы соответствует принятому благоговейному русскому употреблению и не меняет смысла исходного текста.
- source_word: ἐκ νεκρῶν
  choice: из мёртвых
  rationale: Устойчивое библейское выражение, передающее возвращение из числа и состояния умерших без дополнительного толкования.
theological_decisions:
- issue: Формулировка воскресения
  choice: Но Бог воскресил Его из мёртвых.
  alternative: Но Бог поднял Его из мёртвых.
  rationale: Текст прямо приписывает Богу воскресение Иисуса. «Воскресил» в современном русском языке ясно выражает воскресение из смерти и не требует поясняющего расширения, тогда как «поднял» может восприниматься как обычное физическое движение.
translation_notes:
  register: Краткая, естественная и торжественная формулировка современного литературного русского языка. Сохранён резкий контраст, выраженный δέ; синтаксис оригинала передан без ненужных добавлений.
