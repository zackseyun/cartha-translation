lexical_decisions:
- source_word: ἐν τούτῳ
  choice: В Нём
  rationale: Указательное местоимение имеет личный анафорический смысл и относится к Иисусу, названному в ближайшем контексте. «В Нём» естественно по-русски и сохраняет предложную конструкцию греческого текста.
- source_word: πᾶς ὁ πιστεύων
  choice: каждый верующий
  rationale: Субстантивированное причастие настоящего времени имеет обобщённый смысл. «Каждый верующий» кратко и естественно передаёт значение «всякий, кто верит».
- source_word: δικαιοῦται
  choice: получает оправдание
  rationale: Глагол употреблён в настоящем времени и страдательном залоге. «Получает оправдание» передаёт судебно-правовой смысл δικαιόω и при этом звучит естественнее современного русского «оправдывается», которое может быть понято как попытка оправдать себя.
theological_decisions:
- issue: Референт ἐν τούτῳ
  choice: 'личное указание на Иисуса: «В Нём»'
  alternative: «через Него» / более буквально «в Этом»
  rationale: Предыдущий контекст говорит об Иисусе как о Том, через Кого возвещается прощение. «В Нём» сохраняет личную и предложную форму выражения, не сводя её исключительно к инструментальному значению.
- issue: Значение δικαιοῦται
  choice: судебно-правовое «получает оправдание»
  alternative: «признаётся праведным» / «оправдывается»
  rationale: Контекст противопоставляет оправдание тому, чего нельзя было достичь посредством закона Моисея. Выбранная формулировка сохраняет судебный оттенок и не превращает оправдание в описание нравственного изменения.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, ясная и достойная. Местоимение «Нём» написано с прописной буквы как уважительное указание на Иисуса. Термин «оправдание» сохраняет богословскую и судебную напряжённость оригинала, не навязывая конфессионального толкования.
