  text: τούτου ὁ θεὸς ἀπὸ τοῦ σπέρματος κατ’ ἐπαγγελίαν ἤγαγεν τῷ Ἰσραὴλ ⸂σωτῆρα Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/023.yaml
  text: From this man's offspring[a], God has brought to Israel a Savior, Jesus[b], according to promise.
translation:
  language: ru
  text: Из потомства этого человека[b] Бог, по обещанию[a], вывел для Израиля Спасителя — Иисуса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в соответствии с обещанием»; «как и обещал».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из семени этого человека»; речь идёт о происхождении от Давида.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτου
  choice: этого человека
  rationale: Указательное местоимение в родительном падеже отсылает к Давиду в предыдущем стихе. Явное «этого человека» сохраняет связь с контекстом и не заменяет её толкованием.
- source_word: ἀπὸ τοῦ σπέρματος
  choice: из потомства
  rationale: σπέρμα здесь обозначает происхождение по линии Давида. «Потомство» естественно в современном русском и сохраняет родословный смысл; буквальное «семя» возможно, но звучит более архаично.
- source_word: κατ’ ἐπαγγελίαν
  choice: согласно обещанию
  rationale: Оборот выражает соответствие данному прежде обещанию, не уточняя в самом стихе его содержание или адресата.
- source_word: ἤγαγεν
  choice: дал
  rationale: Греческое ἄγω буквально связано со значением «привести», однако сочетание «привёл Израилю Спасителя» по-русски неестественно. «Дал Израилю» ясно передаёт действие Бога в пользу и по отношению к Израилю, не внося возможной ассоциации с воскресением, возникающей у варианта «воздвиг».
- source_word: τῷ Ἰσραήλ
  choice: Израилю
  rationale: Дательный падеж передан русским дательным и допускает как направительный, так и благотворный оттенок.
- source_word: σωτῆρα
  choice: Спасителя
  rationale: Обычный и контекстуально уместный эквивалент титула σωτήρ; прописная буква отмечает употребление титула применительно к Иисусу.
- source_word: Ἰησοῦν
  choice: Иисуса
  rationale: Имя передано в принятой русской библейской форме; тире естественно оформляет пояснительное приложение к слову «Спасителя».
theological_decisions:
- issue: Связь Иисуса с обещанием и потомством Давида
  choice: Стих утверждает, что Бог дал Израилю Иисуса как Спасителя из потомства упомянутого Давида, согласно обещанию.
  alternative: Развернуть фразу как «во исполнение обещания, данного Давиду».
  rationale: Греческий текст связывает происхождение Иисуса и обещание, но прямо не называет здесь ни адресата, ни содержание обещания. Перевод сохраняет эту сдержанность.
translation_notes:
  register: 'Современный литературный русский, ясный и dignified по тону. Порядок компонентов близок к греческому, но сказуемое «дал» выбрано ради естественности русского выражения. Маркеры сносок размещены при тех словах, к которым относятся: [a] при обещании, [b] при потомстве.'
