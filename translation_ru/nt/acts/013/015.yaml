  text: μετὰ δὲ τὴν ἀνάγνωσιν τοῦ νόμου καὶ τῶν προφητῶν ἀπέστειλαν οἱ ἀρχισυνάγωγοι πρὸς αὐτοὺς λέγοντες· Ἄνδρες ἀδελφοί, εἴ ⸀τίς ἐστιν ⸂ἐν ὑμῖν λόγος⸃ παρακλήσεως πρὸς τὸν λαόν, λέγετε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/015.yaml
  text: After the reading of the Law and the Prophets[a], the synagogue rulers sent word to them, saying, “Brothers, if there is among you any word of encouragement for the people[b], speak.”
translation:
  language: ru
  text: 'После чтения Закона и Пророков начальники синагоги послали к ним с такими словами: «Братья[b], если у вас есть слово ободрения[a] для народа, говорите».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слово увещания». Греческое выражение может означать и ободрение, и увещание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Мужи братья» — уважительное братское обращение к мужчинам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάγνωσιν
  choice: чтения
  rationale: Обозначает чтение Писания вслух во время синагогального собрания; по-русски контекст делает публичный характер чтения ясным без добавления слова «публичного».
- source_word: τοῦ νόμου καὶ τῶν προφητῶν
  choice: Закона и Пророков
  rationale: Названия признанных разделов Писания переданы с прописной буквы.
- source_word: ἀπέστειλαν ... πρὸς αὐτοὺς
  choice: послали сказать им
  rationale: Передаёт не физическое отправление самих начальников, а посланное ими приглашение или сообщение.
- source_word: οἱ ἀρχισυνάγωγοι
  choice: начальники синагоги
  rationale: Точное и понятное обозначение ответственных за порядок синагогального собрания, без значения гражданских правителей.
- source_word: Ἄνδρες ἀδελφοί
  choice: Братья
  rationale: Естественно передаёт уважительное братское обращение к мужчинам; буквальное «мужи братья» в современном русском звучит архаично.
- source_word: εἴ τίς ἐστιν ἐν ὑμῖν λόγος
  choice: если у вас есть слово
  rationale: Естественная русская конструкция, сохраняющая образ «слова», то есть подготовленного устного обращения.
- source_word: παρακλήσεως
  choice: ободрения
  rationale: В данном контексте обозначает обращение, способное ободрить слушателей, но греческое слово допускает также оттенок увещания, отмеченный в сноске.
- source_word: πρὸς τὸν λαόν
  choice: для народа
  rationale: Передаёт адресованность и предназначение предлагаемого слова собравшемуся народу.
- source_word: λέγετε
  choice: говорите
  rationale: Форма множественного числа естественно передаёт приглашение адресатам выступить перед собранием.
theological_decisions:
- issue: Мужское обращение в синагоге
  choice: Братья
  alternative: Братья и сёстры
  rationale: Греческое Ἄνδρες ἀδελφοί имеет явно мужскую форму и непосредственно обращено к Павлу и его спутникам, которым предлагают выступить.
- issue: Значение παράκλησις
  choice: ободрение
  alternative: увещание
  rationale: 'Не устраняется смысловая широта слова: в основном тексте дано естественное «ободрение», а возможный призывно-наставительный оттенок сохранён в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис сделан естественным, но сохранены ключевые формальные связи исходного текста и неоднозначность παράκλησις. Все сносочные маркеры присутствуют в основном тексте.
