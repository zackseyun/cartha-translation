  variant: modern literary Russian
source:
  edition: SBLGNT
  text: κἀκεῖθεν ᾐτήσαντο βασιλέα, καὶ ἔδωκεν αὐτοῖς ὁ θεὸς τὸν Σαοὺλ υἱὸν Κίς, ἄνδρα ἐκ φυλῆς Βενιαμίν, ἔτη τεσσεράκοντα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/021.yaml
  text: And from there they asked for a king[a], and God gave them Saul son of Kish, a man from the tribe of Benjamin[b], for forty years.
translation:
  language: ru
  text: После этого они попросили себе царя[a], и Бог дал им Саула, сына Киса, человека из колена Вениамина, на сорок лет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И оттуда они попросили себе царя». Первое слово может обозначать как переход к следующему событию, так и движение от предыдущего этапа повествования.'
    reason: lexical_alternative
  - marker: b
    text: Слова «на сорок лет» могут вызывать хронологические вопросы при сопоставлении с данными Ветхого Завета; перевод сохраняет формулировку Луки, не пытаясь согласовать эти сведения.
    reason: cross_reference
lexical_decisions:
- source_word: κἀκεῖθεν
  choice: После этого
  rationale: В данном историческом обзоре сложное наречие естественно выполняет переходную функцию. «После этого» передаёт последовательность событий, не навязывая буквальный пространственный смысл «оттуда».
- source_word: ᾐτήσαντο βασιλέα
  choice: они попросили себе царя
  rationale: Средняя форма глагола допускает оттенок просьбы для себя; такая формулировка естественна по-русски и не усиливает тон до «потребовали».
- source_word: ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: Бог дал им
  rationale: Сохранены обычное значение ἔδωκεν и явно выраженный субъект; «дал» не сужает смысл до назначения или утверждения на царство.
- source_word: τὸν Σαοὺλ υἱὸν Κίς
  choice: Саула, сына Киса
  rationale: Использованы традиционные русские формы библейских имён и естественная патронимическая конструкция.
- source_word: ἄνδρα ἐκ φυλῆς Βενιαμίν
  choice: человека из колена Вениамина
  rationale: «Человека» передаёт описание конкретного мужчины без неестественного повтора имени; φυλή в библейском контексте традиционно и понятно передаётся словом «колено».
- source_word: ἔτη τεσσεράκοντα
  choice: на сорок лет
  rationale: В русском языке эта форма ясно выражает длительность того периода, на который Бог дал им Саула, и естественно присоединяется к основной клаузе.
theological_decisions:
- issue: Отнесение оборота ἔτη τεσσεράκοντα
  choice: «на сорок лет» отнесено к тому, что Бог дал Израилю Саула
  alternative: Понимать выражение более свободно как длительность одного из этапов исторического обзора
  rationale: По синтаксису греческого текста указание длительности естественнее всего относится к непосредственно предшествующему сообщению о Сауле. Перевод сохраняет формулировку Луки и не пытается устранять возможные хронологические вопросы.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой («царь», «колено»). Синтаксис сделан ясным и пригодным для публичного чтения; историческая и хронологическая неоднозначность не сглажена.
