source:
  edition: SBLGNT
  text: Ἦσαν ⸀δὲ ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν προφῆται καὶ διδάσκαλοι ὅ τε Βαρναβᾶς καὶ Συμεὼν ὁ καλούμενος Νίγερ, καὶ Λούκιος ὁ Κυρηναῖος, Μαναήν τε Ἡρῴδου τοῦ τετραάρχου σύντροφος καὶ Σαῦλος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/001.yaml
  text: 'In Antioch[a], in the church there, there were prophets and teachers: Barnabas, Simeon who was called Niger, Lucius the Cyrenian, Manaen, a close companion of Herod the tetrarch[c][b], and Saul.'
translation:
  language: ru
  text: 'В антиохийской церкви были пророки и учители: Варнава, Симеон, которого называли Нигером[a], Луций Киринеянин[b], Манаин, воспитывавшийся вместе с тетрархом Иродом[c], и Савл.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Нигер» — латинское имя, означающее «чёрный»; оно сохранено без перевода.
    reason: lexical_alternative
  - marker: b
    text: То есть Луций был родом из Кирены, города в Северной Африке.
    reason: cultural_note
  - marker: c
    text: 'Или: «товарищ детства тетрарха Ирода»; также возможно: «близкий друг тетрарха Ирода». Греческое слово может обозначать человека, воспитанного вместе с другим.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: были
  rationale: Ἦσαν передаёт наличие названных людей, а слабая связка δέ в русском контексте не требует отдельного выражения.
- source_word: ἐν Ἀντιοχείᾳ κατὰ τὴν οὖσαν ἐκκλησίαν
  choice: в антиохийской церкви
  rationale: 'Естественно передаёт местное значение оборота: речь идёт о существовавшей в Антиохии общине, без тяжеловесного повтора места.'
- source_word: προφῆται καὶ διδάσκαλοι
  choice: пророки и учители
  rationale: Прямое и понятное обозначение служений, не навязывающее более поздней церковной структуры.
- source_word: Συμεὼν ὁ καλούμενος Νίγερ
  choice: Симеон, прозванный Нигером
  rationale: Сохраняется форма имени Συμεών и латинское прозвище; причастие καλούμενος естественно передано словом «прозванный».
- source_word: Λούκιος ὁ Κυρηναῖος
  choice: Луций Киринеянин
  rationale: Прилагательное обозначает происхождение Луция из Кирены; традиционная русская форма остаётся краткой и точной.
- source_word: Μαναήν
  choice: Манаин
  rationale: Употреблена устоявшаяся русская библейская передача имени.
- source_word: Ἡρῴδου τοῦ τετραάρχου σύντροφος
  choice: воспитывавшийся вместе с тетрархом Иродом
  rationale: σύντροφος буквально указывает на совместное воспитание или взросление; этот вариант точнее широкого «близкий друг», но не утверждает более узкое родство.
- source_word: Σαῦλος
  choice: Савл
  rationale: Устоявшаяся русская библейская форма имени в повествовании до регулярного употребления имени Павел.
theological_decisions:
- issue: Характер служений в антиохийской церкви
  choice: «пророки и учители» передано как обозначение присутствовавших в общине служителей без уточнения институционального статуса.
  alternative: Понимать эти слова как названия строго оформленных позднейших церковных должностей.
  rationale: Текст называет роли, но не определяет их место в поздней церковной иерархии.
- issue: Связь Манаина с Иродом
  choice: «воспитывавшийся вместе с тетрархом Иродом»
  alternative: «молочный брат тетрарха Ирода» или «близкий друг тетрарха Ирода»
  rationale: Слово σύντροφος допускает связь через совместное воспитание, однако не требует утверждать ни родство, ни просто дружеские отношения; примечание сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис упрощён до естественного «в антиохийской церкви», имена переданы в привычных русских библейских формах. Неоднозначность σύντροφος сохранена в примечании.
