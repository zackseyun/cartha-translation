  text: And the disciples were filled with joy and the Holy Spirit[a].
translation:
  language: ru
  text: А ученики исполнялись радостью и Святым Духом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Можно также перевести: «были исполнены радостью и Святым Духом». Греческая форма глагола может указывать на продолжавшееся или повторявшееся исполнение.'
    reason: Передача вида греческого имперфекта допускает как более простую, так и подчёркнуто длительную формулировку.
lexical_decisions:
- source_word: οἵ τε
  choice: А
  rationale: Частица τε связывает стих с предшествующим повествованием; начальное «А» естественно передаёт продолжение и одновременно мягкий контраст с изгнанием апостолов в предыдущем стихе.
- source_word: μαθηταὶ
  choice: ученики
  rationale: Обычное новозаветное обозначение последователей Иисуса; здесь речь идёт о местных верующих.
- source_word: ἐπληροῦντο
  choice: исполнялись
  rationale: Форма имперфекта страдательного залога представляет исполнение как продолжавшееся либо повторявшееся в прошлом. Русское «исполнялись» сохраняет залог и позволяет не выбирать жёстко между длительностью и повторяемостью.
- source_word: χαρᾶς
  choice: радостью
  rationale: После глагола «исполняться» современный русский естественно употребляет творительный падеж; «радость» прямо и ясно передаёт χαρά.
- source_word: πνεύματος ἁγίου
  choice: Святым Духом
  rationale: В контексте Деяний выражение обозначает действующего в Церкви Божьего Святого Духа. Творительный падеж обусловлен русским управлением глагола «исполняться».
theological_decisions:
- issue: Следует ли понимать πνεύματος ἁγίου лично — как Святого Духа — или качественно, как «святой дух»
  choice: Святым Духом
  alternative: святым духом
  rationale: В книге Деяний это выражение обычно относится к Божьему Духу, лично действующему в свидетельстве и жизни верующих; ближайший повествовательный контекст поддерживает такое понимание.
translation_notes:
  register: Современный литературный и вместе с тем достойный библейский регистр. «Исполнялись» звучит естественно, сохраняет образ полноты и передаёт незавершённый характер греческого имперфекта без добавления излишне сильного «постоянно».
