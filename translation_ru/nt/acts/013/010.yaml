  yaml_path: translation/nt/acts/013/010.yaml
  text: And he said[a], “You who are full of every kind of deceit and every kind of villainy, son of the devil, enemy of all righteousness, will you not stop twisting the straight ways of the Lord?”
translation:
  language: ru
  text: 'И сказал: «Ты, исполненный всякого коварства и всякого злодейства, сын дьявола, враг всякой праведности[a], не перестанешь ли ты искажать прямые пути Господа?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «враг всякой справедливости». Греческое слово в зависимости от контекста может означать праведность или справедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης παντὸς δόλου
  choice: исполненный всякого коварства
  rationale: πλήρης с родительным падежом обозначает наполненность или устойчивую характеристику. «Коварство» передаёт не просто ложь, а обман с вероломным умыслом; «всякого» сохраняет всеохватность παντός.
- source_word: πάσης ῥᾳδιουργίας
  choice: всякого злодейства
  rationale: ῥᾳδιουργία обозначает беспринципность, мошенническое или злодейское поведение. «Злодейство» сохраняет резкость обвинения и не сливается по смыслу с «коварством».
- source_word: υἱὲ διαβόλου
  choice: сын дьявола
  rationale: Буквально сохранено υἱέ — «сын». Библейское выражение указывает на принадлежность и нравственное подобие, не требуя поясняющего перефразирования в основном тексте.
- source_word: ἐχθρὲ πάσης δικαιοσύνης
  choice: враг всякой праведности
  rationale: Здесь δικαιοσύνη прежде всего означает нравственную правоту и жизнь согласно Божьей воле. Возможное значение «справедливость» сохранено в сноске.
- source_word: οὐ παύσῃ
  choice: не перестанешь ли ты
  rationale: Будущее среднее изъявительное употреблено как резкий риторический вопрос. Такая русская форма естественно передаёт упрёк, не усиливая его до «никогда не перестанешь».
- source_word: διαστρέφων
  choice: искажать
  rationale: Глагол означает искривлять, искажать или направлять от правильного курса. «Искажать» естественно сочетается с метафорическими «путями» и сохраняет образ нарушения их прямоты.
- source_word: τὰς ὁδοὺς κυρίου τὰς εὐθείας
  choice: прямые пути Господа
  rationale: «Пути» сохраняют буквальный и переносный диапазон ὁδοί, а «прямые» непосредственно передаёт εὐθείας и поддерживает противопоставление глаголу «искажать».
- source_word: Ὦ
  choice: Ты, исполненный…
  rationale: Частица вводит эмоционально усиленное прямое обращение. Конструкция с «ты» передаёт эту силу на современном литературном русском без архаичного «о».
theological_decisions:
- issue: Передача δικαιοσύνη
  choice: праведность
  alternative: справедливость
  rationale: 'В данном контексте речь шире судебной справедливости: Вариисус противится всему нравственно правильному и Божьему. «Праведность» оставлена в основном тексте, а реальная лексическая альтернатива отмечена в сноске.'
translation_notes:
  register: Современный литературный русский с сохранением торжественной резкости апостольского обличения. Синтаксис прямого обращения сделан естественным для устной речи, при этом ключевые библейские образы — «сын дьявола» и «пути Господа» — сохранены.
