base_translation:
  language: en
  yaml_path: translation/nt/acts/013/031.yaml
  text: He appeared for many days to those who had gone up with him from Galilee to Jerusalem[b][a], who are now his witnesses to the people.
translation:
  language: ru
  text: Он в течение многих дней являлся[a] тем, кто вместе с Ним пришёл из Галилеи в Иерусалим и кто теперь является Его свидетелями перед народом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был видим в течение многих дней». Греческий глагол допускает такую более буквальную передачу, особенно когда речь идёт о явлениях после воскресения.'
    reason: lexical_alternative
  - marker: b
    text: Здесь под «народом», вероятнее всего, подразумевается народ Израиля.
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: Он
  rationale: Относительное местоимение относится к Иисусу из предыдущего стиха; в отдельном русском стихе естественно возобновить повествование личным местоимением.
- source_word: ὤφθη
  choice: являлся
  rationale: В контексте явлений воскресшего Иисуса пассивная форма ὁράω обычно имеет значение «явился». Несовершенный вид естественно передаёт неоднократные явления в течение многих дней, не превращая глагол в утверждение о непрерывном действии.
- source_word: ἐπὶ ἡμέρας πλείους
  choice: в течение многих дней
  rationale: Оборот обозначает продолжительность времени; выбран современный и ясный русский эквивалент.
- source_word: τοῖς συναναβᾶσιν αὐτῷ
  choice: тем, кто вместе с Ним пришёл
  rationale: Причастие указывает на людей, сопровождавших Иисуса в пути. «Пришёл» естественнее по-русски, тогда как направление к Иерусалиму уже ясно из географического оборота.
- source_word: ἀπὸ τῆς Γαλιλαίας εἰς Ἰερουσαλήμ
  choice: из Галилеи в Иерусалим
  rationale: Прямая передача исходного пункта и направления движения.
- source_word: οἵτινες νῦν εἰσὶ
  choice: Теперь они
  rationale: Разделение длинного греческого предложения на два делает русский текст яснее, сохраняя указание на нынешнее служение той же группы людей.
- source_word: μάρτυρες αὐτοῦ
  choice: свидетельствуют о Нём
  rationale: Предикативное «являются Его свидетелями» допустимо, но глагольная формулировка звучит естественнее и ясно передаёт их роль как свидетелей об Иисусе.
- source_word: πρὸς τὸν λαόν
  choice: народу
  rationale: Дательный падеж естественно выражает адресата свидетельства; слово λαός не расширено в основном тексте до «народа Израиля».
theological_decisions:
- issue: Характер языка о явлениях воскресшего Иисуса
  choice: являлся
  alternative: был видим
  rationale: «Являлся» естественно передаёт принятое для ὤφθη значение в контексте воскресения, не ослабляя исторического характера свидетельства. Более формальная пассивная передача отмечена в сноске.
- issue: Кого обозначает «народ»
  choice: народ
  alternative: народ Израиля
  rationale: Контекст указывает прежде всего на еврейский народ, однако сам греческий текст употребляет простое λαός; конкретизация вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Длинное греческое предложение разделено на два для естественности; прописное «Ним/Нём» использовано как традиционный русский знак уважения к Иисусу, без добавления смыслового содержания.
