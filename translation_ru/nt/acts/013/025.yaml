  text: ὡς δὲ ἐπλήρου ⸀Ἰωάννης τὸν δρόμον, ἔλεγεν· ⸂Τί ἐμὲ⸃ ὑπονοεῖτε εἶναι; οὐκ εἰμὶ ἐγώ· ἀλλ’ ἰδοὺ ἔρχεται μετ’ ἐμὲ οὗ οὐκ εἰμὶ ἄξιος τὸ ὑπόδημα τῶν ποδῶν λῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/025.yaml
  text: And as John was completing his course[a], he kept saying, ‘What do you suppose me to be? I am not he. But look, one is coming after me[b], the sandals of whose feet I am not worthy to untie.’
translation:
  language: ru
  text: 'Когда Иоанн завершал свой путь, он говорил: «За кого вы меня принимаете? Я — не он[a]. Но вот, вслед за мной идёт тот, у кого я недостоин развязать сандалии на его ногах[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с явным указанием подразумеваемого смысла: «Я не Мессия». В греческом тексте отрицаемая личность не названа, хотя контекст указывает на Мессию.'
    reason: Альтернативная, более пояснительная передача эллиптической фразы.
  - marker: b
    text: 'В некоторых рукописях и переводах сказано конкретнее: «развязать ремень его сандалий». Однако в принятом здесь греческом тексте говорится просто о том, чтобы «развязать сандалию (сандалии) на ногах».'
    reason: Текстуальный вариант и пояснение буквального состава принятого греческого текста.
lexical_decisions:
- source_word: ἐπλήρου ... τὸν δρόμον
  choice: завершал свой путь
  rationale: Сочетание обозначает завершение назначенного жизненного пути или служения. «Завершал» передаёт длительный вид имперфекта, а «путь» сохраняет метафору δρόμος, не сводя её только к состязанию.
- source_word: ἔλεγεν
  choice: говорил
  rationale: Русский несовершенный вид естественно передаёт продолженное или повторявшееся действие греческого имперфекта; усиление вроде «не раз говорил» было бы более определённым, чем исходный текст.
- source_word: Τί ἐμὲ ὑπονοεῖτε εἶναι;
  choice: За кого вы меня принимаете?
  rationale: Передаёт вопрос о приписываемой Иоанну личности и естественно звучит по-русски. Глагол ὑπονοέω выражает предположение или представление о ком-либо.
- source_word: οὐκ εἰμὶ ἐγώ
  choice: Я — не он
  rationale: Сохраняет краткость и эллиптичность греческого текста, где отрицаемая личность прямо не названа, а местоимение ἐγώ выделено.
- source_word: ἀλλ’ ἰδοὺ
  choice: Но вот
  rationale: «Вот» естественно передаёт указательно-привлекающую внимание функцию ἰδού без архаического оттенка.
- source_word: ἔρχεται μετ’ ἐμὲ
  choice: вслед за мной идёт тот
  rationale: Настоящее время передано живо и непосредственно; «тот» восполняет подразумеваемое лицо, не уточняя его сверх текста.
- source_word: οὗ ... τὸ ὑπόδημα τῶν ποδῶν λῦσαι
  choice: у кого ... развязать сандалии на ногах
  rationale: Формулировка сохраняет упоминание обуви и ног, оставаясь понятной по-русски. Множественное «сандалии» естественно передаёт собирательное или обобщённое единственное число ὑπόδημα; слово «ремни» в основной текст не добавлено.
- source_word: ἄξιος
  choice: достоин
  rationale: Прямо и традиционно передаёт значение достоинства или соответствия, сохраняя выражение глубокого смирения.
theological_decisions:
- issue: Кого Иоанн отрицает в словах οὐκ εἰμὶ ἐγώ
  choice: Я — не он
  alternative: Я не Мессия
  rationale: Контекст указывает на ожидаемого Мессию, однако греческая фраза оставляет это имя подразумеваемым. Основной текст сохраняет недосказанность, а примечание поясняет вероятный смысл.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю. Тон сдержанный и достойный; архаизмы устранены, а метафора пути, эллиптическое отрицание и формула смирения сохранены.
