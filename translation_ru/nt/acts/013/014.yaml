base_translation:
  language: en
  yaml_path: translation/nt/acts/013/014.yaml
  text: But they went on from Perga and came to Antioch in Pisidia[a], and on the Sabbath day they entered the synagogue and sat down.
translation:
  language: ru
  text: Они же, продолжив путь из Пергии, прибыли в Антиохию Писидийскую[a]. В субботу они вошли в синагогу и сели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Антиохию Писидийскую»; возможно также: «Антиохию в Писидии».'
    reason: Греческое Ἀντιόχειαν τὴν Πισιδίαν допускает передачу как регионального наименования города и как указания на его расположение.
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: Они же
  rationale: Явное местоимение αὐτοί сохранено, а δέ передано частицей «же», которая естественно обозначает продолжение повествования с лёгким сопоставлением.
- source_word: διελθόντες ἀπὸ τῆς Πέργης
  choice: продолжив путь из Пергии
  rationale: Причастие от διέρχομαι в контексте путешествия указывает на дальнейшее продвижение; такой перевод естественно выражает продолжение пути и исходный пункт.
- source_word: παρεγένοντο
  choice: прибыли
  rationale: В повествовании о путешествии παραγίνομαι означает прибытие в названное место.
- source_word: Ἀντιόχειαν τὴν Πισιδίαν
  choice: Антиохию Писидийскую
  rationale: Греческое определение различает этот город среди одноимённых Антиохий. Традиционная и ясная русская форма сохраняет региональную привязку; буквальная конструкция отмечена в сноске.
- source_word: εἰσελθόντες εἰς τὴν συναγωγήν
  choice: они вошли в синагогу
  rationale: Обстоятельственное причастие естественно развёрнуто в отдельное личное предложение без изменения последовательности действий.
- source_word: τῇ ἡμέρᾳ τῶν σαββάτων
  choice: В субботу
  rationale: Это обычное греческое обозначение дня субботнего покоя; современная русская форма передаёт его ясно и без ненужной буквальности множественного числа.
- source_word: ἐκάθισαν
  choice: сели
  rationale: Аорист обозначает простое завершённое действие; «сели» естественно передаёт переход в сидячее положение.
