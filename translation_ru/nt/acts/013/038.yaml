  text: γνωστὸν οὖν ἔστω ὑμῖν, ἄνδρες ἀδελφοί, ὅτι διὰ τούτου ὑμῖν ἄφεσις ἁμαρτιῶν καταγγέλλεται, καὶ ἀπὸ πάντων ὧν οὐκ ἠδυνήθητε ⸀ἐν νόμῳ Μωϋσέως δικαιωθῆναι
base_translation:
  language: en
  yaml_path: translation/nt/acts/013/038.yaml
  text: Therefore let it be known to you[a], brothers, that through this one forgiveness of sins is proclaimed to you, and from all the things from which you could not be justified by the law of Moses[c][b], everyone who believes is justified.
translation:
  language: ru
  text: Итак, пусть будет вам известно, братья[a], что через Него[b] вам возвещается прощение грехов и что от всего, от чего вы не могли быть оправданы[c] законом Моисея…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «братья и сёстры», если обращение относится ко всем собравшимся.'
    reason: lexical_alternative
  - marker: b
    text: То есть через Иисуса, о котором только что говорилось.
    reason: cross_reference
  - marker: c
    text: 'Или: «быть признаны праведными».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γνωστὸν οὖν ἔστω ὑμῖν
  choice: Итак, пусть будет вам известно
  rationale: Передаёт следственное οὖν и повелительную силу безличной конструкции, сохраняя торжественный, но современный русский строй.
- source_word: ἄνδρες ἀδελφοί
  choice: братья
  rationale: Естественное русское обращение, сохраняющее мужскую форму и семейно-общинный оттенок греческого выражения.
- source_word: διὰ τούτου
  choice: через Него
  rationale: Местоимение естественно указывает на упомянутого непосредственно перед этим Иисуса; буквальное «через этого» по-русски звучало бы неясно или пренебрежительно.
- source_word: ἄφεσις ἁμαρτιῶν
  choice: прощение грехов
  rationale: Ясный и устоявшийся эквивалент в данном контексте; «отпущение» менее современно.
- source_word: καταγγέλλεται
  choice: возвещается
  rationale: Сохраняет значение публичного и авторитетного провозглашения и форму страдательного залога.
- source_word: ἀπὸ πάντων ὧν
  choice: от всего, от чего
  rationale: Сохраняет повтор предлога и связь с продолжающейся в следующем стихе конструкцией.
- source_word: οὐκ ἠδυνήθητε
  choice: вы не могли
  rationale: Прямой и естественный эквивалент выражения невозможности.
- source_word: ἐν νόμῳ Μωϋσέως
  choice: законом Моисея
  rationale: 'Творительный падеж естественно передаёт инструментальное значение ἐν: посредством закона Моисея.'
- source_word: δικαιωθῆναι
  choice: быть оправданы
  rationale: Сохраняет судебно-богословскую ёмкость δικαιόω и страдательную форму, не сводя смысл только к нравственному исправлению.
theological_decisions:
- issue: Значение δικαιωθῆναι в сопоставлении с законом Моисея
  choice: быть оправданы
  alternative: быть признаны праведными
  rationale: «Быть оправданы» сохраняет традиционный и юридический смысл термина, а сноска делает его доступным без устранения богословской многозначности.
- issue: Состав адресатов в ἄνδρες ἀδελφοί
  choice: братья
  alternative: братья и сёстры
  rationale: Основной текст сохраняет грамматически мужскую форму источника; возможное включение женщин в собравшуюся аудиторию отмечено в сноске.
- issue: Граница стиха и незавершённость синтаксиса
  choice: сохранить открытое продолжение многоточием
  alternative: добавить из Деян 13:39 фразу «оправдывается всякий верующий»
  rationale: Предоставленный греческий текст Деян 13:38 заканчивается инфинитивом δικαιωθῆναι, тогда как грамматическая конструкция завершается в следующем стихе. Добавление слов из 13:39 изменило бы объём переводимого стиха.
translation_notes:
  register: 'Современный литературный русский язык с достоинством публичной апостольской речи. Синтаксическая незавершённость отражает предоставленную границу стиха: мысль продолжается в Деян 13:39. Все сноски отмечены в основном тексте.'
