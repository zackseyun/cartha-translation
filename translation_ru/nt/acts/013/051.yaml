    reason: cultural_note
lexical_decisions:
- source_word: οἱ δὲ
  choice: Они же
  rationale: Частица δέ обозначает лёгкое противопоставление или переход в повествовании, а субстантивированное причастие относится к Павлу и Варнаве. «Они же» естественно сохраняет обе функции.
- source_word: ἐκτιναξάμενοι
  choice: отряхнув
  rationale: Аористное причастие обозначает завершённое действие, предшествующее переходу в Иконию. «Отряхнув» точно и естественно передаёт резкое удаление праха.
- source_word: τὸν κονιορτὸν τῶν ποδῶν
  choice: прах со своих ног
  rationale: κονιορτός — мелкая дорожная пыль, прах. Возвратное «своих» ясно связывает ноги с Павлом и Варнавой; предлог «со» естественно передаёт отношение источника.
- source_word: ἐπ’ αὐτοὺς
  choice: против них
  rationale: ἐπί с винительным здесь выражает направленность символического действия против отвергнувших весть. Формулировка сохраняет краткость и не добавляет в основной текст толкование жеста.
- source_word: ἦλθον εἰς Ἰκόνιον
  choice: пошли в Иконию
  rationale: В повествовании ἔρχομαι обозначает движение к названному месту; по-русски естественно «пошли». εἰς передано предлогом «в» с винительным падежом.
theological_decisions:
- issue: Смысл отряхивания праха с ног
  choice: Жест передан буквально, с направленностью «против них»; его значение пояснено в сноске.
  alternative: 'Включить в основной текст: «в знак свидетельства против них» или «в знак осуждения».'
  rationale: Греческий текст прямо называет действие и его направленность, но не раскрывает смысл формулой. Буквальный основной текст сохраняет культурную и богословскую напряжённость, не подменяя её толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Прах» выбран вместо более бытового «пыль», поскольку он естественен для символического жеста и остаётся понятным современному читателю; синтаксис краток и близок к структуре греческого текста.
