  text: But they shook off the dust from their feet against them and went to Iconium[a].
translation:
  language: ru
  text: В знак протеста против них они отряхнули прах со своих ног и пошли в Иконию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
