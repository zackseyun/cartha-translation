base_translation:
  language: en
  yaml_path: translation/nt/acts/013/005.yaml
  text: And when they arrived at Salamis[a], they proclaimed the word of God in the synagogues of the Jews[b]; and they also had John as an assistant.
translation:
  language: ru
  text: Прибыв в Саламин, они возвещали слово Божье в иудейских синагогах; с ними был также Иоанн в качестве помощника.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иоанн как служитель» или «Иоанн как помощник (сопровождающий)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενοι ἐν Σαλαμῖνι
  choice: прибыв в Саламин
  rationale: Оборот с аористным причастием γίνομαι и указанием места естественно обозначает прибытие; деепричастная конструкция сохраняет его обстоятельственный характер и звучит по-русски ясно.
- source_word: κατήγγελλον
  choice: возвещали
  rationale: Глагол обозначает открытое, публичное провозглашение; «возвещали» передаёт это без сужения смысла до формальной проповеди.
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: слово Божье
  rationale: Традиционное и прозрачное выражение, сохраняющее образ «слова» и допускающее смысл Божьей вести или откровения.
- source_word: ἐν ταῖς συναγωγαῖς τῶν Ἰουδαίων
  choice: в иудейских синагогах
  rationale: В данном контексте Ἰουδαῖοι имеет этнорелигиозный, а не узко региональный смысл; русское прилагательное естественно передаёт греческую родительную конструкцию.
- source_word: εἶχον δὲ καὶ Ἰωάννην ὑπηρέτην
  choice: С ними был и Иоанн как помощник
  rationale: Такое построение естественно по-русски передаёт наличие Иоанна в их группе, добавочное καί и его вспомогательную роль; ὑπηρέτης здесь не требует значения раба или слуги.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. «Слово Божье» сохраняет библейскую формулу, а «помощник» не приписывает Иоанну более определённой церковной должности, чем выражено в греческом тексте.
