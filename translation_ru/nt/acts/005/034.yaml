  text: ἀναστὰς δέ τις ἐν τῷ συνεδρίῳ Φαρισαῖος ὀνόματι Γαμαλιήλ, νομοδιδάσκαλος τίμιος παντὶ τῷ λαῷ, ἐκέλευσεν ἔξω ⸀βραχὺ τοὺς ⸀ἀνθρώπους ποιῆσαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/034.yaml
  text: But a Pharisee named Gamaliel stood up in the council[a], a teacher of the law honored by all the people[b], and ordered the men to be put outside for a short time.
translation:
  language: ru
  text: Но в синедрионе[a] встал фарисей по имени Гамалиил, учитель Закона, пользовавшийся уважением у всего народа. Он велел ненадолго вывести этих людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Синедрион — иудейский верховный совет.
    reason: cultural_note
lexical_decisions:
- source_word: ἀναστὰς δέ τις
  choice: Но ... встал один
  rationale: δέ обозначает поворот в повествовании, а τις вводит нового участника; сочетание «Но ... встал один» естественно передаёт оба элемента.
- source_word: ἐν τῷ συνεδρίῳ
  choice: в синедрионе
  rationale: В данном контексте συνέδριον обозначает иудейский верховный совет; традиционный русский термин точен и компактен, а сноска поясняет его.
- source_word: Φαρισαῖος ὀνόματι Γαμαλιήλ
  choice: фарисей по имени Гамалиил
  rationale: Естественная русская передача обозначения группы и оборота ὀνόματι с личным именем.
- source_word: νομοδιδάσκαλος
  choice: учитель Закона
  rationale: Передаёт человека, который учит Закону Моисея; прописная буква показывает, что речь идёт не о законодательстве вообще.
- source_word: τίμιος παντὶ τῷ λαῷ
  choice: уважаемый всем народом
  rationale: τίμιος здесь выражает общественное почтение; творительный падеж естественно передаёт того, кем Гамалиил был уважаем.
- source_word: ἐκέλευσεν
  choice: велел
  rationale: Передаёт властное распоряжение без излишне тяжеловесного «приказал».
- source_word: ἔξω βραχὺ ... ποιῆσαι
  choice: ненадолго вывести
  rationale: Греческий идиоматический оборот буквально означает сделать так, чтобы они оказались снаружи; по-русски естественно передать его как временное удаление.
- source_word: τοὺς ἀνθρώπους
  choice: апостолов
  rationale: В контексте это мужчины-апостолы, находившиеся перед советом. Контекстуальное наименование устраняет неестественное и потенциально двусмысленное «людей»; сноска сохраняет буквальную форму.
theological_decisions:
- issue: Кого обозначает τοὺς ἀνθρώπους
  choice: апостолов
  alternative: мужчин / людей
  rationale: В повествовательном контексте перед синедрионом стоят апостолы-мужчины. Перевод не расширяет референт до людей вообще и не вносит богословского уточнения сверх контекста.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранён повествовательный поворот «Но», а длинное греческое предложение разделено на два русских для естественности и прозрачности.
