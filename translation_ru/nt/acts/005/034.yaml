  source_fidelity: 'В целом смысл передан верно: Гамалиил встаёт в синедрионе, назван фарисеем и учителем Закона, пользующимся всеобщим уважением, и распоряжается временно удалить обвиняемых. Однако «апостолов» — контекстуально верное, но добавленное к буквальному τοὺς ἀνθρώπους («этих людей / мужчин») уточнение; в данном стихе его лучше не вносить в основной текст.'
