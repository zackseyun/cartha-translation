  rationale: Исправление устраняет не выраженное непосредственно в греческом тексте уточнение «апостолов» и сохраняет его определённое, контекстуальное обозначение как «этих людей». Также слегка выровнена русская формулировка общественного уважения. Смысл временного удаления и повествовательный поворот сохранены.
