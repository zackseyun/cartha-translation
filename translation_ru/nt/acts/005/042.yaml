  text: πᾶσάν τε ἡμέραν ἐν τῷ ἱερῷ καὶ κατ’ οἶκον οὐκ ἐπαύοντο διδάσκοντες καὶ εὐαγγελιζόμενοι ⸂τὸν χριστὸν Ἰησοῦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/042.yaml
  text: And every day[a], in the temple and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Messiah.
translation:
  language: ru
  text: И каждый день в храме и по домам они не переставали учить и возвещать благую весть о том, что Иисус — Мессия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «возвещать благую весть об Иисусе Мессии»; возможно также: «возвещать Иисуса как Мессию».'
    reason: Лексико-синтаксическая альтернатива для τὸν χριστὸν Ἰησοῦν.
lexical_decisions:
- source_word: πᾶσάν τε ἡμέραν
  choice: И каждый день
  rationale: Передаёт обстоятельство продолжительности/повторяемости и связующее τε; современная и естественная русская формулировка.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν обозначает храмовый комплекс, а не внутреннее святилище; краткое русское соответствие сохраняет объём исходного выражения.
- source_word: κατ’ οἶκον
  choice: по домам
  rationale: 'Передаёт распределительное значение κατά с существительным в единственном числе: деятельность происходила в частных домах, дом за домом.'
- source_word: οὐκ ἐπαύοντο
  choice: не переставали
  rationale: Имперфект выражает продолжавшееся действие; формулировка естественна по-русски и сохраняет подчёркнутую непрерывность.
- source_word: διδάσκοντες
  choice: учить
  rationale: Прямое и общепонятное соответствие διδάσκω, согласованное с конструкцией «не переставали».
- source_word: εὐαγγελιζόμενοι
  choice: возвещать благую весть
  rationale: Передаёт значение объявления доброй вести без конфессионально окрашенного или менее прозрачного глагола.
- source_word: τὸν χριστὸν Ἰησοῦν
  choice: о том, что Иисус — Мессия
  rationale: Идиоматично выражает содержание возвещения и переводит Χριστός как титул, сохраняя утверждение о мессианской идентичности Иисуса.
theological_decisions:
- issue: Передача Χριστός
  choice: Мессия
  alternative: Христос
  rationale: В данном контексте Χριστός функционирует как титул и содержание апостольского возвещения; «Мессия» раскрывает значение титула, не превращая его в имя.
- issue: Синтаксическая функция τὸν χριστὸν Ἰησοῦν после εὐαγγελιζόμενοι
  choice: 'содержание возвещения: «что Иисус — Мессия»'
  alternative: 'объектная формулировка: «возвещать Иисуса Мессию» / «благую весть об Иисусе Мессии»'
  rationale: Винительный оборот допускает более буквальное объектное прочтение, однако по-русски придаточное ясно и естественно передаёт вероятный смысл, не устраняя подлинную синтаксическую неоднозначность, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский язык; ясный, достойный и общедоступный стиль. «По домам» естественно передаёт распределительность, а тире в именной части сказуемого соответствует современной русской норме.
