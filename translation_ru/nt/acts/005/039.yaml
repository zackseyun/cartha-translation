  text: εἰ δὲ ἐκ θεοῦ ἐστιν, οὐ ⸀δυνήσεσθε καταλῦσαι ⸀αὐτούς·) μήποτε καὶ θεομάχοι εὑρεθῆτε. ἐπείσθησαν δὲ αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/039.yaml
  text: But if it is from God[a], you will not be able to overthrow them. You may even be found to be fighting against God.” So they were persuaded by him[c][b],
translation:
  language: ru
  text: Но если это от Бога, вы не сможете погубить их[a]. Как бы вам не оказаться ещё и богоборцами!» И они согласились с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уничтожить их», «сокрушить их». Местоимение «их» вероятнее всего относится к апостолам; возможно также более широкое понимание — их дела или движения.'
    reason: Уточняет смысловой диапазон καταλῦσαι и сохраняет возможную, но менее прямую связь αὐτούς с упомянутыми ранее «замыслом» и «делом».
lexical_decisions:
- source_word: ἐκ θεοῦ
  choice: от Бога
  rationale: Предлог ἐκ обозначает источник или происхождение; «от Бога» естественно передаёт этот смысл по-русски.
- source_word: δυνήσεσθε
  choice: сможете
  rationale: Будущая форма δύναμαι выражает способность в будущем; «сможете» сохраняет и время, и модальность.
- source_word: καταλῦσαι
  choice: низложить
  rationale: Здесь глагол означает привести к падению, уничтожить силу или свести на нет. «Низложить» подходит к противодействию людям и их делу, не делая смысл чрезмерно абсолютным.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение мужского рода во множественном числе естественнее всего относится к апостолам, а не к отвлечённому замыслу или делу.
- source_word: μήποτε
  choice: как бы не
  rationale: Оборот вводит предостережение о возможном нежелательном исходе; русское «как бы вам не…» естественно сохраняет предупредительный оттенок.
- source_word: θεομάχοι
  choice: богоборцами
  rationale: Сложное слово буквально обозначает тех, кто борется против Бога. «Богоборцами» кратко и точно сохраняет образ исходного текста.
- source_word: εὑρεθῆτε
  choice: оказаться
  rationale: Пассивная форма имеет смысл «быть обнаруженными, явиться кем-либо»; «оказаться» естественно передаёт возможное выявление их истинного положения.
- source_word: ἐπείσθησαν δὲ αὐτῷ
  choice: И они послушались его
  rationale: πείθομαι с дательным лицом может означать поддаться убеждению и последовать совету. В контексте решение совета показывает, что они его послушались.
theological_decisions:
- issue: К кому относится αὐτούς в утверждении о невозможности низложить
  choice: К апостолам, стоящим перед советом
  alternative: К их движению, замыслу или делу как продолжению мысли стиха 38
  rationale: Греческое местоимение стоит в мужском роде множественного числа и непосредственно указывает на людей. Сноска сохраняет связь с более широким делом апостолов, не превращая слова Гамалиила в безоговорочное общее обещание о любом религиозном движении.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной речи. «Богоборцами» сохраняет выразительный образ греческого θεομάχοι; «как бы вам не оказаться» передаёт предостережение, не устраняя его напряжённости.
