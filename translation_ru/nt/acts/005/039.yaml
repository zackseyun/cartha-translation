    rationale: Фраза передаёт практический результат, но способна подразумевать послушание распоряжению. «И они согласились с ним» яснее выражает, что совет принял убеждение Гамалиила.
  revised_text: Но если это от Бога, вы не сможете погубить их[a]. Как бы вам не оказаться ещё и богоборцами!» И они согласились с ним.
