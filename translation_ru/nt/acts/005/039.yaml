  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: ἐκ θεοῦ — «от Бога», будущее δυνήσεσθε — «не сможете», а предупреждение μήποτε… θεομάχοι εὑρεθῆτε удачно отражено. Однако «низложить их» в современном русском обычно относится к правителю или власти и потому неоправданно сужает καταλῦσαι; в данном контексте естественнее «погубить их» (с возможным более широким оттенком уничтожения/сведения на нет).'
  naturalness: «Как бы вам не оказаться и богоборцами» понятно, но «ещё и» естественнее передаёт усилительное καί. «Они послушались его» возможно, но может звучать как подчинение приказу; «они согласились с ним» точнее передаёт принятие совета после убеждения.
  terminology: «Богоборцами» — точное, литературное и достаточно прозрачное соответствие θεομάχοι. «От Бога» и «погубить их» сохраняют публично-религиозный регистр без конфессионального истолкования.
