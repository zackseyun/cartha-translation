  text: 'Но служители, придя, не нашли их в тюрьме и, возвратившись, доложили:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι
  choice: придя
  rationale: Деепричастие естественно передаёт предшествующее прибытие служителей, сохраняя компактность греческой конструкции.
- source_word: ὑπηρέται
  choice: служители
  rationale: В контексте это должностные исполнители при иудейских властях. «Служители» сохраняет институциональный смысл, не добавляя более узкого толкования «храмовая стража».
- source_word: οὐχ εὗρον
  choice: не нашли
  rationale: Прямое и естественное соответствие повествовательному употреблению εὑρίσκω.
- source_word: ἐν τῇ φυλακῇ
  choice: в темнице
  rationale: Определённый контекст указывает на уже упомянутое место заключения; «темница» соответствует возвышенному, но понятному библейскому повествовательному регистру.
- source_word: ἀναστρέψαντες
  choice: возвратившись
  rationale: Передаёт возвращение к пославшим их и сохраняет форму сопутствующего деепричастного действия.
- source_word: ἀπήγγειλαν
  choice: доложили
  rationale: Глагол обозначает передачу официального сообщения; «доложили» естественно звучит применительно к служителям, исполняющим поручение.
- source_word: δέ
  choice: но / и
  rationale: Первое δέ выражает контраст с ожидаемым обнаружением апостолов; второе служит связкой в последовательности действий и естественно передаётся союзом «и».
