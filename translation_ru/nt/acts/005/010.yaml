  yaml_path: translation/nt/acts/005/010.yaml
  text: Then she immediately fell at his feet and died. When the young men came in, they found her dead, and they carried her out and buried her beside her husband.
translation:
  language: ru
  text: И тотчас она упала к его ногам и испустила дух. Войдя, юноши нашли её мёртвой, вынесли и похоронили рядом с мужем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Передаёт непосредственность события кратким и естественным русским наречием.
- source_word: ἐξέψυξεν
  choice: испустила дух
  rationale: Сохраняет образность греческого глагола со значением «перестала дышать, умерла» и звучит достойно и понятно в повествовании о смерти.
- source_word: οἱ νεανίσκοι
  choice: юноши
  rationale: Прямое соответствие обозначению молодых мужчин; сохраняет связь с участниками предыдущего эпизода.
- source_word: πρὸς τὸν ἄνδρα αὐτῆς
  choice: рядом с мужем
  rationale: В данном погребальном контексте πρός естественно указывает на место рядом с ранее погребённым мужем.
