id: ACT.5.38
reference: Acts 5:38
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ τὰ νῦν λέγω ὑμῖν, ἀπόστητε ἀπὸ τῶν ἀνθρώπων τούτων καὶ ⸀ἄφετε αὐτούς· (ὅτι ἐὰν ᾖ ἐξ ἀνθρώπων ἡ βουλὴ ⸀αὕτη ἢ τὸ ἔργον τοῦτο, καταλυθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/038.yaml
  text: And now I tell you[a], keep away from these men and leave them alone; for if this plan or this work is from men, it will be overthrown[b],
translation:
  language: ru
  text: 'И теперь говорю вам: отступитесь от этих людей и оставьте их в покое. Ведь если этот замысел или это дело — от людей[a], оно разрушится[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человеческого происхождения».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет уничтожено»; «сойдёт на нет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ νῦν
  choice: теперь
  rationale: Идиоматическое указание на нынешнюю ситуацию, вводящее совет Гамалиила; «теперь» естественно передаёт временное и дискурсивное значение.
- source_word: ἀπόστητε
  choice: отступитесь от
  rationale: Аористный императив требует прекратить противодействие и держаться в стороне; «отступитесь от» сохраняет образ удаления и ясно звучит по-русски.
- source_word: ἄφετε αὐτούς
  choice: оставьте их в покое
  rationale: В контексте речь идёт о прекращении вмешательства и преследования; эта русская идиома точно передаёт практический смысл.
- source_word: ὅτι
  choice: ведь
  rationale: Союз вводит основание данного совета; «ведь» естественно выражает пояснительно-причинную связь.
- source_word: ἐὰν ᾖ ἐξ ἀνθρώπων
  choice: если ... от людей
  rationale: ἐξ обозначает источник или происхождение. Формулировка сохраняет прямой контраст с «от Бога» в следующем стихе и не ограничивает ἀνθρώπων только мужчинами.
- source_word: βουλή
  choice: замысел
  rationale: Слово обозначает намерение, решение или план; «замысел» уместно отличает внутреннее намерение от осуществляемого дела.
- source_word: ἔργον
  choice: дело
  rationale: Широкое обозначение действия или начинания; «дело» естественно сочетается с «замыслом» и сохраняет смысловую широту.
- source_word: καταλυθήσεται
  choice: разрушится
  rationale: Будущая пассивная форма выражает разрушение, распад или сведение на нет. Русская возвратная форма естественно передаёт пассивно-результативный смысл без уточнения действующего лица.
theological_decisions:
- issue: Происхождение, выраженное ἐξ ἀνθρώπων
  choice: от людей
  alternative: человеческого происхождения
  rationale: Буквальная и естественная формулировка сохраняет богословски значимый контраст человеческого и Божьего источника в следующем стихе, не разрешая его сверх текста.
- issue: Смысл καταλυθήσεται
  choice: разрушится
  alternative: будет уничтожено; сойдёт на нет
  rationale: Выбранный вариант сохраняет неопределённость относительно того, произойдёт ли внешнее уничтожение или внутренний распад, и не добавляет явно названного деятеля.
translation_notes:
  register: Современный литературный русский язык с достойным, ясным синтаксисом. Сохранены параллель «замысел или дело» и контраст происхождения, продолжающийся в следующем стихе. Местоимение среднего рода «оно» соотнесено со всем составным начинанием, выраженным парой существительных.
