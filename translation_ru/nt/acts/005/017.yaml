base_translation:
  language: en
  yaml_path: translation/nt/acts/005/017.yaml
  text: But the high priest rose up[a], and all those with him—that is[b], the party of the Sadducees—and were filled with jealousy.
translation:
  language: ru
  text: Но первосвященник поднялся; он и все, кто был с ним, — то есть партия саддукеев[a], — исполнились зависти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «секта саддукеев». Греческое слово может обозначать партию, течение или секту.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ревнивое негодование»; греческое слово может также означать «ревность» или «рвение», но здесь контекст указывает на враждебное чувство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναστὰς
  choice: выступили
  rationale: Причастие от ἀνίστημι здесь идиоматически вводит решительное действие, а не просто описывает вставание; из-за составного русского подлежащего значение естественно передано личной формой во множественном числе.
- source_word: δὲ
  choice: Но
  rationale: Передаёт лёгкое противопоставление благоприятной реакции народа в предыдущем контексте враждебному действию руководителей.
- source_word: ὁ ἀρχιερεὺς
  choice: первосвященник
  rationale: Устоявшееся и точное русское обозначение этой должности.
- source_word: πάντες οἱ σὺν αὐτῷ
  choice: все его сторонники
  rationale: Передаёт людей, связанных с первосвященником и поддерживавших его, не уточняя их официального статуса.
- source_word: ἡ οὖσα αἵρεσις τῶν Σαδδουκαίων
  choice: принадлежавшие к партии саддукеев
  rationale: Передаёт пояснительное приложение и значение αἵρεσις как религиозно-общественной группировки, не вкладывая позднейшего смысла ереси.
- source_word: ἐπλήσθησαν
  choice: исполнились
  rationale: Сохраняет образ греческой конструкции «наполниться чем-либо» и звучит достойно и понятно в библейском повествовании.
- source_word: ζήλου
  choice: зависти
  rationale: Контекст враждебного противодействия указывает на отрицательное чувство; «зависть» естественно объясняет реакцию на успех апостолов, хотя слово допускает и другие оттенки.
theological_decisions:
- issue: Передача αἵρεσις
  choice: партия
  alternative: секта
  rationale: Здесь слово обозначает течение или группировку внутри иудаизма; «партия» не привносит позднейшего догматического осуждения, а вариант «секта» сохранён в примечании.
- issue: Передача ζῆλος в данном контексте
  choice: зависть
  alternative: ревность; ревнивое негодование
  rationale: Многозначность слова включает как положительное рвение, так и враждебную зависть. Последующие действия против апостолов поддерживают отрицательное прочтение, но подлинная лексическая широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Перестройка греческого причастного оборота в единое сказуемое «выступили» устраняет двусмысленность согласования и сохраняет динамику повествования; тире ясно выделяют пояснение о саддукеях.
