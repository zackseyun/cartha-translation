  yaml_path: translation/nt/acts/005/008.yaml
  text: But Peter answered her[a], “Tell me, did you sell the land for this much?” And she said, “Yes, for this much.”
translation:
  language: ru
  text: 'Пётр же ответил ей: «Скажи мне, за такую ли сумму вы продали участок?» Она ответила: «Да, за такую».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη δὲ πρὸς αὐτὴν
  choice: Пётр же спросил её
  rationale: Буквально оборот означает «Пётр же ответил ей», однако здесь ἀποκρίνομαι вводит реплику в диалоге, а сама реплика является вопросом. «Спросил её» естественно передаёт функцию выражения в современном русском; частица же отмечает повествовательный переход.
- source_word: Εἰπέ μοι
  choice: Скажи мне
  rationale: Прямое и естественное соответствие аористному повелительному наклонению λέγω с дательным местоимением.
- source_word: εἰ
  choice: ли
  rationale: εἰ вводит косвенный общий вопрос после «скажи мне»; русская частица «ли» естественно сохраняет эту синтаксическую зависимость.
- source_word: τοσούτου
  choice: за такую сумму / за такую
  rationale: Слово указывает на уже известный размер выручки. В вопросе добавлено «сумму» для ясности, а в кратком ответе сохранён естественный эллипсис.
- source_word: τὸ χωρίον
  choice: участок
  rationale: χωρίον обозначает участок земли, поле или земельное владение. «Участок» естественно и без излишней конкретизации передаёт здесь проданную недвижимость.
- source_word: ἀπέδοσθε
  choice: вы продали
  rationale: В коммерческом контексте ἀποδίδωμι означает «продавать». Форма второго лица множественного числа передана местоимением «вы», относящимся к Сапфире и Анании.
- source_word: Ναί
  choice: Да
  rationale: Простое утвердительное подтверждение.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; диалог передан ясно и сдержанно. Сохранены обращение к одной женщине («её», «скажи») и множественное число глагола продажи («вы продали»), подразумевающее совместное действие супругов.
