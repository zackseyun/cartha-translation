  text: καὶ προσκαλεσάμενοι τοὺς ἀποστόλους δείραντες παρήγγειλαν μὴ λαλεῖν ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ καὶ ⸀ἀπέλυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/040.yaml
  text: And after summoning the apostles[a], they beat them, ordered them not to speak in the name of Jesus, and released them.
translation:
  language: ru
  text: Созвав апостолов, они избили их, приказали им не говорить во имя Иисуса[a] и отпустили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «об имени Иисуса»; возможен также оттенок: «на основании имени Иисуса». Греческий оборот может включать как речь об Иисусе, так и речь, произносимую под его властью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενοι
  choice: призвали
  rationale: Аористное причастие обозначает действие, предшествующее последующим распоряжениям; в русском последовательность естественно передаётся личной формой в ряду действий.
- source_word: τοὺς ἀποστόλους
  choice: апостолов
  rationale: Устоявшийся и контекстуально точный термин для уполномоченных свидетелей Иисуса в Деяниях.
- source_word: δείραντες
  choice: избили их
  rationale: δέρω означает бить, избивать; глагол сам по себе не уточняет форму судебного телесного наказания, поэтому «высекли» было бы излишне конкретным.
- source_word: παρήγγειλαν
  choice: приказали
  rationale: Передаёт властное распоряжение совета ясно и естественно для современного русского языка.
- source_word: μὴ λαλεῖν
  choice: не говорить
  rationale: Инфинитив с μή выражает содержание запрета; нейтральное «говорить» сохраняет широту исходного выражения.
- source_word: ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: во имя Иисуса
  rationale: 'Сохраняет привычную библейскую формулу и её смысловую широту: речь может идти о свидетельстве об Иисусе, обращении к его имени и действии на основании его власти.'
- source_word: ἀπέλυσαν
  choice: отпустили
  rationale: В контексте задержания естественно обозначает освобождение из-под стражи или прекращение удержания.
theological_decisions:
- issue: Значение оборота ἐπὶ τῷ ὀνόματι τοῦ Ἰησοῦ
  choice: во имя Иисуса
  alternative: об имени Иисуса; опираясь на имя Иисуса
  rationale: Греческий оборот допускает одновременно отсылку к Иисусу, публичное свидетельство о нём и речь под его властью. Основной перевод сохраняет эту богословскую многозначность, а примечание делает её явной.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достойный. Цепочка личных глагольных форм звучит естественнее буквального воспроизведения двух греческих причастий. «Тогда» служит плавной связью с предыдущим контекстом, передавая последовательность повествования.
