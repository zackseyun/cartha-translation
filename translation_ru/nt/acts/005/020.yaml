  text: Πορεύεσθε καὶ σταθέντες λαλεῖτε ἐν τῷ ἱερῷ τῷ λαῷ πάντα τὰ ῥήματα τῆς ζωῆς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/020.yaml
  text: Go and stand in the temple[c][b][a], and speak to the people all the words of this life.
translation:
  language: ru
  text: Идите, встаньте в храме[a] и говорите народу все слова этой жизни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть на территории храмового комплекса, а не обязательно внутри святилища.
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «все слова об этой жизни» или «все слова этого образа жизни». Это выражение может относиться к жизни, возвещаемой в Благой вести.'
    reason: alternative_reading
lexical_decisions:
- source_word: Πορεύεσθε
  choice: Идите
  rationale: Прямой и естественный русский императив, передающий повеление отправиться и действовать.
- source_word: σταθέντες
  choice: встаньте
  rationale: 'Аористное причастие передано однородным повелительным глаголом как сопутствующее действие; это естественно по-русски и сохраняет последовательность: идти, встать, говорить.'
- source_word: λαλεῖτε
  choice: говорите
  rationale: Широкое и точное соответствие глаголу со значением речи; «возвещайте» добавило бы не выраженный самим глаголом оттенок провозглашения.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: Естественная русская формулировка; ἱερόν обозначает весь храмовый комплекс, что пояснено в сноске.
- source_word: τῷ λαῷ
  choice: народу
  rationale: Точно передаёт адресата без добавления отсутствующего в стихе уточнения об этнической принадлежности или составе собравшихся.
- source_word: πάντα τὰ ῥήματα
  choice: все слова
  rationale: Сохраняет как всеохватность πάντα, так и конкретное существительное ῥήματα; вариант «всю весть» был бы более истолковывающим.
- source_word: τῆς ζωῆς ταύτης
  choice: этой жизни
  rationale: 'Формально близко передаёт родительный оборот и сохраняет его смысловую открытость: речь может идти о возвещаемой жизни, новой жизни или вести, несущей жизнь.'
theological_decisions:
- issue: Значение выражения τῆς ζωῆς ταύτης
  choice: Сохранить компактное выражение «этой жизни» без поясняющего расширения.
  alternative: «об этой жизни», «этого образа жизни», «жизнеутверждающей вести»
  rationale: Греческое выражение допускает несколько связанных прочтений и не уточняет однозначно характер связи между «словами» и «жизнью». Перевод не должен преждевременно устранять эту богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повелительным строем. Синтаксис сглажен для естественного русского звучания, но последовательность действий и неоднозначность заключительного оборота сохранены.
