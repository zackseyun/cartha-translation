source:
  edition: SBLGNT
  text: ὥστε ⸂καὶ εἰς⸃ τὰς πλατείας ἐκφέρειν τοὺς ἀσθενεῖς καὶ τιθέναι ἐπὶ ⸀κλιναρίων καὶ κραβάττων, ἵνα ἐρχομένου Πέτρου κἂν ἡ σκιὰ ⸀ἐπισκιάσῃ τινὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/015.yaml
  text: so that they even carried the sick out into the streets and laid them on cots and mats[a], so that as Peter was coming by[c][b], even his shadow might overshadow some of them.
translation:
  language: ru
  text: так что больных выносили даже на улицы[a] и клали на постели и подстилки[b], чтобы, когда Пётр проходил мимо, хотя бы его тень осенила кого-нибудь из них[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на площади». Греческое слово πλατεῖαι может обозначать широкие улицы или открытые общественные места.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на кровати и тюфяки». В греческом тексте употреблены два слова, обозначающие разные виды постелей или спальных подстилок.'
    reason: lexical_alternative
  - marker: c
    text: 'Здесь говорится о намерении людей: они располагали больных так, чтобы их осенила хотя бы тень Петра. Сам этот стих прямо не утверждает, что исцеляла именно тень.'
    reason: theological_clarification
lexical_decisions:
- source_word: ὥστε
  choice: так что
  rationale: Передаёт следствие описанного в предыдущем контексте возрастания влияния апостолов.
- source_word: καὶ εἰς τὰς πλατείας
  choice: даже на улицы
  rationale: «Даже» передаёт усилительное καί, а «улицы» естественно обозначает широкие общественные места, куда выносили больных.
- source_word: ἐκφέρειν τοὺς ἀσθενεῖς
  choice: больных выносили
  rationale: В контексте исцелений ἀσθενεῖς — больные, а ἐκφέρειν указывает на вынесение их наружу.
- source_word: τιθέναι ἐπὶ κλιναρίων καὶ κραβάττων
  choice: клали на постели и подстилки
  rationale: Сохраняется различие между двумя видами спальных поверхностей без чрезмерно узкой технической конкретизации.
- source_word: ἐρχομένου Πέτρου
  choice: когда Пётр проходил мимо
  rationale: Генитив абсолютный описывает движение Петра рядом с лежавшими больными; формулировка естественна по-русски.
- source_word: κἂν
  choice: хотя бы
  rationale: 'Передаёт надежду на минимальный возможный контакт: чтобы больного коснулась хотя бы тень Петра.'
- source_word: ἡ σκιὰ ἐπισκιάσῃ
  choice: его тень осенила
  rationale: «Осенила» точно и кратко передаёт ἐπισκιάζω, сохраняя образ тени и не добавляя утверждения об исцелении.
- source_word: τινὶ αὐτῶν
  choice: кого-нибудь из них
  rationale: Передаёт неопределённое лицо в единственном числе среди множества больных.
theological_decisions:
- issue: Следует ли утверждать, что тень Петра сама исцеляла больных
  choice: 'Текст сообщает о намерении и надежде людей: они укладывали больных так, чтобы их осенила хотя бы тень Петра.'
  alternative: Сформулировать стих так, будто тень Петра действительно обладала самостоятельной целительной силой.
  rationale: Конструкция ἵνα с сослагательным наклонением выражает цель или ожидаемую возможность. Сам стих не говорит прямо, что тень произвела исцеление, хотя более широкий контекст сообщает об исцелениях.
translation_notes:
  register: Современный литературный русский язык с ясным, повествовательным и умеренно возвышенным звучанием. «Осенила» сохраняет образ исходного глагола и уместна в библейском контексте, не будучи архаичной или конфессионально окрашенной.
