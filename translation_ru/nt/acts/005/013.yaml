  text: τῶν δὲ λοιπῶν οὐδεὶς ἐτόλμα κολλᾶσθαι αὐτοῖς, ἀλλ’ ἐμεγάλυνεν αὐτοὺς ὁ λαός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/013.yaml
  text: But none of the rest dared to join them; rather, the people held them in high esteem.
translation:
  language: ru
  text: Из остальных же никто не осмеливался присоединиться к ним, однако народ высоко их почитал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῶν δὲ λοιπῶν
  choice: Из остальных же
  rationale: Сохраняет родительный оборот и контраст δέ; «остальные» оставлено без уточнения референта, поскольку греческий текст его прямо не называет.
- source_word: ἐτόλμα
  choice: не осмеливался
  rationale: Передаёт значение решимости или смелости совершить действие; имперфект естественно выражен несовершенным видом.
- source_word: κολλᾶσθαι αὐτοῖς
  choice: присоединиться к ним
  rationale: В данном контексте κολλάομαι означает тесно примкнуть или присоединиться; русский вариант звучит естественно и не уточняет сверх текста характер принадлежности.
- source_word: ἀλλ’
  choice: однако
  rationale: Передаёт сильное противопоставление без искусственной конструкции «но, напротив».
- source_word: ἐμεγάλυνεν αὐτοὺς ὁ λαός
  choice: народ высоко их почитал
  rationale: Контекстуально передаёт признание величия и уважение со стороны народа; порядок слов остаётся естественным для современного русского языка.
theological_decisions:
- issue: К кому относятся «остальные» и «они»
  choice: Не уточнять референты в переводе
  alternative: Передать как «никто из посторонних не решался присоединиться к верующим/апостолам»
  rationale: Греческий стих использует субстантивированное «остальные» и местоимение «к ним», поэтому прямое обозначение конкретной группы внесло бы толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный. Синтаксис сохраняет контраст двух частей стиха, а неоднозначные местоименные референты не конкретизируются.
