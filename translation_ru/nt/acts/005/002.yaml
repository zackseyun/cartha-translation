base_translation:
  language: en
  yaml_path: translation/nt/acts/005/002.yaml
  text: And he kept back some of the price[a], with his wife also knowing it, and bringing a certain part[b], he laid it at the apostles’ feet.
translation:
  language: ru
  text: И он утаил часть вырученной суммы[a] — жена его тоже знала об этом, — и, принеся некоторую часть, положил её у ног апостолов.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тайно оставил себе часть суммы, полученной от продажи»; греческий глагол подразумевает нечестное удержание для себя.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «у ног апостолов»; конкретный образ того, как он положил деньги перед апостолами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνοσφίσατο
  choice: утаил
  rationale: Глагол передаёт не просто нейтральное удержание, а присвоение или сокрытие для себя; «утаил» естественно выражает скрытый и предосудительный характер поступка, не вводя излишне узкой юридической квалификации.
- source_word: ἀπὸ τῆς τιμῆς
  choice: часть вырученной суммы
  rationale: В данном контексте τιμή — сумма, полученная при продаже. Такое выражение по-русски естественнее буквального «от цены» и сохраняет финансовый смысл оборота с ἀπό.
- source_word: συνειδυίης καὶ τῆς γυναικός
  choice: жена его тоже знала об этом
  rationale: Генитив абсолютный обозначает сопутствующее обстоятельство; «тоже» передаёт καί, а «об этом» указывает на совершённое утаивание.
- source_word: ἐνέγκας μέρος τι
  choice: а некоторую часть принёс
  rationale: Аористное причастие обозначает действие, предшествующее главному глаголу; русская личная конструкция звучит естественно, а «некоторую часть» сохраняет неопределённость μέρος τι.
- source_word: παρὰ τοὺς πόδας τῶν ἀποστόλων ἔθηκεν
  choice: положил у ног апостолов
  rationale: Сохранён конкретный образ исходного текста и его связь с повторяющейся в Деяниях формулой передачи денег апостолам.
theological_decisions:
- issue: Нравственная окраска поступка Анании
  choice: Передать действие как скрытое и предосудительное утаивание.
  alternative: «Оставил себе часть суммы» — более нейтральная передача.
  rationale: Значение νοσφίζομαι и ближайший повествовательный контекст указывают на нечестное сокрытие, хотя текст не требует добавлять специальную юридическую характеристику.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Тире выделяют генитивную абсолютную конструкцию как сопутствующее обстоятельство. Конкретный образ «у ног апостолов» сохранён; маркер [b] поставлен непосредственно после соответствующей фразы.
