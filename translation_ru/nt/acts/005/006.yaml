lexical_decisions:
- source_word: ἀναστάντες
  choice: встали
  rationale: Аористное причастие от ἀνίστημι обозначает, что они поднялись, чтобы действовать; «встали» естественно передаёт последовательность повествования.
- source_word: δὲ
  choice: Тогда
  rationale: Здесь δέ продвигает повествование вперёд; «тогда» естественно связывает действие с предшествующим событием.
- source_word: οἱ νεώτεροι
  choice: молодые люди
  rationale: Форма сравнительной степени может означать «младшие» или в более общем смысле «молодые»; основной текст выбирает естественное современное выражение, а неоднозначность отмечается в сноске.
- source_word: συνέστειλαν
  choice: завернули его
  rationale: В данном погребальном контексте глагол, вероятно, обозначает оборачивание тела перед выносом; это конкретнее и менее истолковательно, чем «приготовили к погребению».
- source_word: ἐξενέγκαντες
  choice: вынесли
  rationale: Причастие от ἐκφέρω указывает на вынос тела из помещения; по-русски объект естественно подразумевается после «завернули его».
- source_word: ἔθαψαν
  choice: похоронили
  rationale: Обычный современный русский эквивалент θάπτω, подходящий по регистру и контексту.
