  text: συνήρχετο δὲ καὶ τὸ πλῆθος τῶν πέριξ ⸀πόλεων Ἰερουσαλήμ, φέροντες ἀσθενεῖς καὶ ὀχλουμένους ὑπὸ πνευμάτων ἀκαθάρτων, οἵτινες ἐθεραπεύοντο ἅπαντες.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/016.yaml
  text: And even the multitude from the towns around Jerusalem was coming together[a], bringing the sick and those troubled by unclean spirits[b], and they were all being healed.
translation:
  language: ru
  text: Сходилось также множество людей из городов в окрестностях Иерусалима[a]. Они приносили больных и тех, кого мучили нечистые духи[b], и все они исцелялись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собиралась также толпа из окрестных городов Иерусалима».'
    reason: Лексическая альтернатива для συνήρχετο, τὸ πλῆθος и конструкции τῶν πέριξ πόλεων Ἰερουσαλήμ.
  - marker: b
    text: 'Или: «тех, кого тревожили нечистые духи».'
    reason: Более нейтральная лексическая альтернатива для ὀχλουμένους.
lexical_decisions:
- source_word: συνήρχετο
  choice: сходилось
  rationale: Имперфект передаёт продолжавшееся или повторявшееся в прошлом действие; форма «сходилось» естественно сохраняет этот оттенок.
- source_word: τὸ πλῆθος
  choice: множество людей
  rationale: Передаёт собирательное значение большого числа людей и звучит естественно в современном русском повествовании.
- source_word: τῶν πέριξ πόλεων Ἰερουσαλήμ
  choice: из городов в окрестностях Иерусалима
  rationale: πέριξ указывает на населённые пункты поблизости от Иерусалима; такой перевод ясно выражает географическую связь, не создавая впечатления, будто города принадлежали Иерусалиму.
- source_word: φέροντες
  choice: они приносили
  rationale: Причастие описывает сопутствующее действие собиравшихся людей; отдельное предложение делает длинную греческую конструкцию ясной по-русски.
- source_word: ἀσθενεῖς
  choice: больных
  rationale: В контексте исцелений слово обозначает физически больных.
- source_word: ὀχλουμένους
  choice: тех, кого мучили
  rationale: Глагол выражает причиняемое беспокойство или страдание; «мучили» естественно передаёт здесь воздействие нечистых духов, не уточняя его характер сверх текста.
- source_word: ὑπὸ πνευμάτων ἀκαθάρτων
  choice: нечистые духи
  rationale: Сохраняет устойчивое новозаветное обозначение личных злых духов и присущие слову ἀκάθαρτος нравственно-ритуальные оттенки.
- source_word: οἵτινες
  choice: и все они
  rationale: Местоимение возобновляет упоминание обеих групп — больных и мучимых духами; по-русски это естественно выражается сочинительной конструкцией.
- source_word: ἐθεραπεύοντο
  choice: исцелялись
  rationale: Имперфект и страдательное значение передают происходившие неоднократно исцеления без добавления субъекта действия.
- source_word: ἅπαντες
  choice: все
  rationale: 'Сохраняет подчёркнутую полноту: исцелялись все из названных групп.'
theological_decisions:
- issue: Передача πνευμάτων ἀκαθάρτων
  choice: нечистые духи
  alternative: нечистые силы / злые духи
  rationale: Буквально и в соответствии с устойчивым библейским словоупотреблением сохраняется указание на личных духов, без психологизации или метафорического переосмысления.
- issue: Сфера действия ἅπαντες
  choice: все они исцелялись
  alternative: все больные исцелялись
  rationale: Форма мужского рода множественного числа естественно относится ко всем только что названным людям — как к больным, так и к мучимым нечистыми духами; перевод не сужает эту сферу.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным регистром. Греческая длинная конструкция разделена на два предложения ради ясности; видовременные оттенки имперфектов сохранены несовершенным видом. Оба маркера сносок включены в основной текст.
