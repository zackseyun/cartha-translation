id: ACT.5.21
reference: Acts 5:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἀκούσαντες δὲ εἰσῆλθον ὑπὸ τὸν ὄρθρον εἰς τὸ ἱερὸν καὶ ἐδίδασκον. Παραγενόμενος δὲ ὁ ἀρχιερεὺς καὶ οἱ σὺν αὐτῷ συνεκάλεσαν τὸ συνέδριον καὶ πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ, καὶ ἀπέστειλαν εἰς τὸ δεσμωτήριον ἀχθῆναι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/021.yaml
  text: When they heard this[a], they entered the temple courts at daybreak and were teaching. But when the high priest arrived, and those with him, they called together the Sanhedrin and the whole council of the sons of Israel, and sent to the prison to have them brought.
translation:
  language: ru
  text: Услышав это, они на рассвете вошли в храм и учили. Когда пришёл первосвященник вместе с теми, кто был с ним, они созвали Синедрион и весь совет старейшин Израиля[a], а затем послали в темницу, чтобы их привели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «весь совет старейшин сынов Израиля». Или: «весь совет Израиля».'
    reason: Лексическая альтернатива для γερουσία и традиционной формулы τῶν υἱῶν Ἰσραήλ; сноска сохраняет буквальную родовую формулу при идиоматичном основном тексте.
lexical_decisions:
- source_word: ἀκούσαντες
  choice: Услышав это
  rationale: Аористное причастие выражает предшествующее обстоятельство и отсылает к повелению ангела в предыдущем стихе; местоимение «это» естественно передаёт данную связь.
- source_word: ὑπὸ τὸν ὄρθρον
  choice: на рассвете
  rationale: Кратко и естественно передаёт указание на раннее утреннее время, близкое к рассвету.
- source_word: εἰς τὸ ἱερὸν
  choice: вошли во дворы храма
  rationale: ἱερόν обозначает храмовый комплекс, а не собственно святилище; «дворы храма» делает это различие понятным современному читателю.
- source_word: ἐδίδασκον
  choice: стали учить
  rationale: Русская конструкция естественно описывает начавшееся и продолжавшееся действие, соответствуя несовершенному виду греческого глагола.
- source_word: οἱ σὺν αὐτῷ
  choice: его сторонники
  rationale: Передаёт лиц, действующих вместе с первосвященником, не уточняя их должностей; это естественнее буквального «бывшие с ним», хотя допускает оттенок приверженности.
- source_word: συνεκάλεσαν τὸ συνέδριον
  choice: созвали Синедрион
  rationale: Сохраняется историческое название высшего иудейского совета и значение глагола «созывать».
- source_word: πᾶσαν τὴν γερουσίαν τῶν υἱῶν Ἰσραήλ
  choice: весь совет старейшин сынов Израиля
  rationale: γερουσία передано как собрание старейшин, а традиционная национально-родовая формула τῶν υἱῶν Ἰσραήλ сохранена без нейтрализации.
- source_word: δεσμωτήριον
  choice: темницу
  rationale: Достоинственное и понятное библейское обозначение места заключения, уместное в повествовательном регистре.
- source_word: ἀχθῆναι αὐτούς
  choice: чтобы привести их
  rationale: Пассивный инфинитив цели после «послали» естественно передан русским придаточным цели; референт местоимения эксплицирован как «апостолы» ради ясности.
theological_decisions:
- issue: Передача τῶν υἱῶν Ἰσραήλ
  choice: сынов Израиля
  alternative: Израиля; израильского народа
  rationale: Сохранена явно родовая формула оригинала, функционирующая здесь как традиционное обозначение народа; более идиоматический смысл указан в сноске.
- issue: Соотношение συνέδριον и γερουσία
  choice: Синедрион и весь совет старейшин
  alternative: Синедрион, то есть весь совет старейшин
  rationale: Союз καί сохранён как соединительный, поскольку текст допускает перечисление или расширительное описание и не требует однозначно считать вторую фразу приложением.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным регистром. Исторический термин «Синедрион» сохранён. «Темница» выбрана вместо разговорного «тюрьма». Сноска обозначена в основном тексте как [a].
