revisions:
- from: Услышав это, они на рассвете вошли во дворы храма и стали учить. Тем временем первосвященник и его сторонники, придя, созвали Синедрион и весь совет старейшин сынов Израиля[a], а затем послали в темницу за апостолами, чтобы привести их.
  to: Услышав это, они на рассвете вошли в храм и учили. Когда пришёл первосвященник вместе с теми, кто был с ним, они созвали Синедрион и весь совет старейшин Израиля[a], а затем послали в темницу, чтобы их привели.
  rationale: Правки устраняют неоправданные смысловые добавления и точнее передают видовую и залоговую характеристики греческого текста. «В храм» в русском естественно обозначает храмовый комплекс в данном повествовательном контексте и не утверждает вход во внутреннее святилище. Соединение «Синедрион и весь совет старейшин» сохранено без принудительного истолкования второй группы как приложения к первой.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:48:58Z'
review_pass:
  verdict: revise
  source_fidelity: Требуются небольшие правки. «Стали учить» акцентирует начало действия, тогда как ἐδίδασκον — имперфект и лучше передаётся формой «учили». «Его сторонники» добавляет отсутствующий в οἱ σὺν αὐτῷ смысл политической или личной приверженности. В заключительной цели греческий пассивный инфинитив означает, что их должны были привести; русская безлично-пассивная конструкция передаёт это точнее.
  naturalness: Исправленный вариант остаётся современным литературным русским. «Те, кто был с ним» нейтрально и естественно; «совет старейшин Израиля» существенно более гладок, чем тяжеловесное «совет старейшин сынов Израиля».
  terminology: «Синедрион» и «темница» уместны. Национально-родовая формула τῶν υἱῶν Ἰσραήλ передана в основном тексте идиоматично как «Израиля», а её буквальная форма сохранена в сноске. Это не устраняет возможной неоднозначности отношений между συνέδριον и γερουσία.
  issues:
  - severity: medium
    issue: «стали учить»
    rationale: Форма вносит ингрессивный оттенок («начали учить»), которого имперфект ἐδίδασκον сам по себе не выражает.
  - severity: medium
    issue: «его сторонники»
    rationale: οἱ σὺν αὐτῷ означает «те, кто был с ним»; слово «сторонники» без основания добавляет оттенок лояльности или партийной принадлежности.
  - severity: medium
    issue: «послали в темницу за апостолами, чтобы привести их»
    rationale: 'В греческом после ἀπέστειλαν стоит пассивный инфинитив ἀχθῆναι: послали [людей] в тюрьму, чтобы заключённых привели. Предложенный оборот менее точно передаёт пассивную перспективу и добавляет явное «апостолами», отсутствующее в стихе.'
  - severity: low
    issue: Основной текст с «сынов Израиля»
    rationale: Буквальная формула понятна, но в сочетании «совет старейшин сынов Израиля» тяжеловесна для современного русского. Идиоматическое «совет старейшин Израиля» с буквальным вариантом в сноске сохраняет и смысл, и прозрачность.
