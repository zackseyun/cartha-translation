  text: ⸀λέγων· Παραγγελίᾳ παρηγγείλαμεν ὑμῖν μὴ διδάσκειν ἐπὶ τῷ ὀνόματι τούτῳ, καὶ ἰδοὺ πεπληρώκατε τὴν Ἰερουσαλὴμ τῆς διδαχῆς ὑμῶν, καὶ βούλεσθε ἐπαγαγεῖν ἐφ’ ἡμᾶς τὸ αἷμα τοῦ ἀνθρώπου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/028.yaml
  text: saying[a], “We strictly ordered you not to teach in this name, and look, you have filled Jerusalem with your teaching, and you intend to bring this man's blood upon us.”
translation:
  language: ru
  text: 'говоря: «Мы строго приказали вам не учить во имя этого человека. И вот, вы наполнили Иерусалим своим учением и хотите возложить на нас кровь этого человека[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть сделать нас ответственными за смерть этого человека. Греческий текст буквально говорит о том, чтобы навлечь на них «кровь» этого человека; это образ ответственности за пролитую кровь.
    reason: lexical_alternative
lexical_decisions:
- source_word: Παραγγελίᾳ παρηγγείλαμεν
  choice: Мы строго приказали
  rationale: Сочетание существительного и однокоренного глагола усиливает приказ; по-русски это естественно передаётся наречием «строго».
- source_word: μὴ διδάσκειν
  choice: не учить
  rationale: Передаёт содержание запрета без дополнительного толкования «перестать учить».
- source_word: ἐπὶ τῷ ὀνόματι τούτῳ
  choice: от имени этого человека
  rationale: Оборот указывает на действие с опорой на имя и связанный с ним авторитет. Добавление «человека» естественно по-русски и сохраняет намеренное избегание имени Иисуса в речи обвинителей.
- source_word: ἰδοὺ
  choice: Но вот
  rationale: Сохраняет указательную и обвинительную силу междометия; «но» естественно обозначает резкий контраст между запретом и результатом.
- source_word: πεπληρώκατε τὴν Ἰερουσαλὴμ
  choice: вы наполнили Иерусалим
  rationale: Сохраняет метафору и результативное значение перфекта.
- source_word: τῆς διδαχῆς ὑμῶν
  choice: своим учением
  rationale: Творительный падеж естественно передаёт содержимое, которым наполнен город; «учение» здесь яснее и нейтральнее слова «доктрина».
- source_word: βούλεσθε
  choice: хотите
  rationale: Прямо передаёт волеизъявление и сохраняет возможность как намерения, так и желания, не усиливая текст до «решили».
- source_word: ἐπαγαγεῖν ἐφ’ ἡμᾶς
  choice: возложить на нас
  rationale: Естественный русский оборот, сохраняющий образ перенесения ответственности или вины на обвинителей.
- source_word: τὸ αἷμα τοῦ ἀνθρώπου τούτου
  choice: кровь этого человека
  rationale: Сохраняет библейский образ крови как ответственности за смерть и отчуждённое обозначение Иисуса словами «этот человек».
theological_decisions:
- issue: Смысл выражения «возложить на нас кровь этого человека»
  choice: Сохранить образ крови в основном тексте как указание на вменение ответственности за смерть.
  alternative: «Сделать нас ответственными за смерть этого человека».
  rationale: Развёрнутый вариант яснее объясняет идиому, но устраняет исходный образ и частично разрешает заложенное в нём напряжение; поэтому пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой обвинительной речи. Сохранены повтор «учить — учением», метафора наполнения города и образ возложения крови; архаичное «се» не используется.
