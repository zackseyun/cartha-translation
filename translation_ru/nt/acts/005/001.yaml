base_translation:
  language: en
  yaml_path: translation/nt/acts/005/001.yaml
  text: But a man named Ananias[a], with Sapphira his wife, sold a piece of property.
translation:
  language: ru
  text: Но один человек по имени Анания вместе со своей женой Сапфирой продал владение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собственность»; греческое слово может обозначать владение или имущество, а в данном контексте — также недвижимость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνὴρ … τις
  choice: один человек
  rationale: Сочетание вводит нового участника повествования как неопределённое лицо. «Один человек» естественно по-русски и не придаёт лишнего акцента, возможного в более книжном «некий человек».
- source_word: δέ
  choice: Но
  rationale: Союз отмечает мягкое противопоставление предыдущему рассказу о Варнаве; «но» ясно сохраняет контраст.
- source_word: Ἁνανίας ὀνόματι
  choice: по имени Анания
  rationale: Оборот с ὀνόματι естественно передаётся русским выражением «по имени»; имя дано в принятой русской библейской форме.
- source_word: σὺν Σαπφίρῃ τῇ γυναικὶ αὐτοῦ
  choice: вместе со своей женой Сапфирой
  rationale: σύν выражает совместное участие, а γυνή в данном притяжательном обороте означает жену. Возвратное «своей» естественно соотносится с подлежащим.
- source_word: ἐπώλησεν
  choice: продал
  rationale: Аорист πωλέω обозначает завершённое событие в повествовании и естественно передаётся совершенным видом.
- source_word: κτῆμα
  choice: имение
  rationale: В контексте продажи недвижимости слово обозначает принадлежащий человеку объект собственности. «Имение» кратко и конкретно, но не уточняет вид или размер владения сверх греческого текста.
theological_decisions:
- issue: Контраст с предшествующим примером Варнавы
  choice: Передать δέ союзом «но»
  alternative: «А» как более мягкий повествовательный переход
  rationale: Ближайший контекст сопоставляет поступок Варнавы с последующим обманом Анании и Сапфиры. «Но» сохраняет допустимую контрастную силу δέ, не раскрывая заранее содержание следующих стихов.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. Имена переданы в традиционной русской библейской форме. Маркер сноски поставлен непосредственно после слова, к которому относится лексическая альтернатива.
