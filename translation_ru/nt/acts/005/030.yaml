  text: ὁ θεὸς τῶν πατέρων ἡμῶν ἤγειρεν Ἰησοῦν, ὃν ὑμεῖς διεχειρίσασθε κρεμάσαντες ἐπὶ ξύλου·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/030.yaml
  text: The God of our fathers raised up Jesus[b][a], whom you killed by hanging on a tree.
translation:
  language: ru
  text: Бог наших отцов воскресил Иисуса[a], которого вы убили, повесив на дереве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воздвиг Иисуса». В этом контексте глагол может обозначать воскресение, хотя слов «из мёртвых» в данном стихе нет.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на кресте». Буквально: «на дереве»; вероятно, это отсылка ко Второзаконию 21:23.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ θεὸς τῶν πατέρων ἡμῶν
  choice: Бог наших отцов
  rationale: Сохраняет библейскую формулу, связывающую Бога с праотцами Израиля; в русском языке определённый артикль отдельно не передаётся.
- source_word: ἤγειρεν
  choice: воскресил
  rationale: В непосредственном контексте речь идёт о смерти Иисуса и Божьем действии после неё, поэтому глагол естественно передаёт воскресение; при этом отсутствие в стихе слов «из мёртвых» отмечено в сноске.
- source_word: Ἰησοῦν
  choice: Иисуса
  rationale: Общепринятая русская форма личного имени в требуемом винительном падеже.
- source_word: διεχειρίσασθε
  choice: убили
  rationale: В данном контексте глагол обозначает насильственное лишение жизни; прямое «убили» ясно и естественно передаёт обвинение.
- source_word: κρεμάσαντες ἐπὶ ξύλου
  choice: повесив на дереве
  rationale: Деепричастный оборот сохраняет обстоятельственную связь с основным глаголом, а «дерево» передаёт ξύλον и вероятную отсылку к Второзаконию 21:23.
theological_decisions:
- issue: Следует ли понимать ἤγειρεν как воскресение или более широко как воздвижение/явление Иисуса
  choice: воскресил
  alternative: воздвиг
  rationale: Последовательность «Бог воскресил — вы убили» и ближайший контекст Деяний указывают на воскресение. Однако греческий текст этого стиха не добавляет «из мёртвых», что честно отражено в примечании.
- issue: Следует ли переводить ξύλον как «крест»
  choice: на дереве
  alternative: на кресте
  rationale: В оригинале употреблено ξύλον, а не σταυρός. Буквальный образ сохраняет вероятную связь с Второзаконием 21:23, не отрицая исторической отсылки к распятию.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и библейской образности. Формула «Бог наших отцов» оставлена как понятный традиционный оборот; обвинение передано прямо, без смягчения.
