  naturalness: «Руками апостолов» и «среди народа» звучат в современном литературном русском естественнее, чем «через руки» и «в народе». «Были вместе» естественно передаёт совместное присутствие; примечание сохраняет дополнительный оттенок ὁμοθυμαδόν — единодушие.
  terminology: «Знамения и чудеса» сохранено. «Портик Соломона» точно передаёт Στοὰ Σολομῶντος; вариант «колоннада Соломона» дан в сноске. Референт «все они» не конкретизируется.
