    text: 'Или: «в колоннаде Соломона».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «единодушно»; греческое слово подчёркивает не только совместное присутствие, но и единство группы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ ... τῶν χειρῶν τῶν ἀποστόλων
  choice: Через руки апостолов
  rationale: Сохранён конкретный греческий оборот, выражающий посредство или орудие действия; по-русски он понятен и подчёркивает, что знамения совершались через апостолов.
- source_word: δὲ
  choice: и
  rationale: Частица обозначает продолжение повествования, без обязательного противопоставления; союз «и» естественно связывает стих с контекстом.
- source_word: ἐγίνετο
  choice: совершалось
  rationale: Имперфект передаёт продолжительное или повторяющееся действие в прошлом. Единственное число сказуемого допустимо при стоящем после него сочетании однородных подлежащих и позволяет естественно передать греческую конструкцию.
- source_word: σημεῖα καὶ τέρατα
  choice: знамений и чудес
  rationale: Традиционная и прозрачная передача устойчивой пары Луки без добавления толковательного определения «чудесных».
- source_word: πολλὰ
  choice: много
  rationale: Наречное количественное сочетание «много знамений и чудес» естественно в современном русском языке и относится к обоим существительным.
- source_word: ἐν τῷ λαῷ
  choice: в народе
  rationale: Передаёт сферу, в которой происходили события, не уточняя этническую принадлежность сверх явно сказанного в греческом тексте.
- source_word: ὁμοθυμαδὸν
  choice: единодушно собирались
  rationale: «Единодушно» сохраняет смысл общего настроя и согласия, а «собирались» естественно выражает совместное пребывание в указанном месте, хотя глагол движения в оригинале не выражен напрямую.
- source_word: ἅπαντες
  choice: все они
  rationale: Передаёт полноту группы, сохраняя неуточнённым, относится ли выражение только к апостолам или к более широкому кругу верующих.
- source_word: Στοᾷ Σολομῶντος
  choice: притворе Соломона
  rationale: «Притвор Соломона» — понятное и укоренившееся русское название крытой храмовой колоннады; архитектурное значение пояснено в сноске.
theological_decisions:
- issue: К кому относится выражение «все они»
  choice: 'Референт оставлен неуточнённым: это собравшаяся группа, связанная с апостолами.'
  alternative: Только апостолы; либо все верующие.
  rationale: В греческом тексте подлежащее при ἦσαν подразумевается, а ближайший контекст допускает разные объёмы группы. Перевод не разрешает эту неоднозначность искусственно.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. Оборот «через руки» намеренно сохраняет образность оригинала. «Единодушно собирались» передаёт одновременно единство группы и её совместное пребывание, не прибегая к архаичному «единодушно пребывали».
