  text: τοῦτον ὁ θεὸς ἀρχηγὸν καὶ σωτῆρα ὕψωσεν τῇ δεξιᾷ αὐτοῦ, ⸀τοῦ δοῦναι μετάνοιαν τῷ Ἰσραὴλ καὶ ἄφεσιν ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/031.yaml
  text: God exalted this one to his right hand as Leader and Savior[a], to give repentance to Israel and forgiveness of sins.
translation:
  language: ru
  text: Его Бог возвысил по правую руку от Себя как Вождя и Спасителя[a], чтобы даровать Израилю покаяние и прощение грехов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своей правой рукой». Греческий оборот допускает такой смысл, хотя в данном контексте, вероятнее всего, говорится о возвышении на место высшей чести по правую руку Бога.'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτον
  choice: Его
  rationale: Указательное местоимение подчёркнуто указывает на Иисуса; в русском контексте «Его» перед подлежащим сохраняет выделение и звучит естественнее буквального «Этого».
- source_word: ἀρχηγὸν
  choice: Вождя
  rationale: Слово обозначает стоящего во главе, предводителя или основателя. В сочетании со «Спасителем» и в контексте возвышения «Вождь» передаёт руководящее главенство, не сужая значение до политического титула «Князь».
- source_word: σωτῆρα
  choice: Спасителя
  rationale: Устоявшийся и точный русский эквивалент, сохраняющий смысл избавления и богословскую значимость слова.
- source_word: ὕψωσεν
  choice: возвысил
  rationale: Здесь речь идёт о возведении Иисуса в положение чести и власти, а не просто о поднятии или воскресении.
- source_word: τῇ δεξιᾷ αὐτοῦ
  choice: по правую руку от Себя
  rationale: 'Передаёт наиболее вероятный локативный смысл: Бог возвысил Иисуса на почётное место по Свою правую руку. Возможный инструментальный смысл сохранён в сноске.'
- source_word: τοῦ δοῦναι
  choice: чтобы даровать
  rationale: Артикулированный инфинитив выражает цель; конструкция «чтобы даровать» ясно и естественно передаёт её по-русски.
- source_word: μετάνοιαν
  choice: покаяние
  rationale: Устоявшийся русский библейский термин, обозначающий не простую перемену мнения, а обращение внутреннего настроя и жизни к Богу.
- source_word: τῷ Ἰσραὴλ
  choice: Израилю
  rationale: Дательный падеж естественно обозначает получателя дара.
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: прощение грехов
  rationale: Ясное, естественное и общепринятое соответствие новозаветному выражению.
theological_decisions:
- issue: Смысл возвышения Иисуса и дательного оборота τῇ δεξιᾷ αὐτοῦ
  choice: Бог возвысил Иисуса на место высшей чести и власти по правую руку от Себя.
  alternative: Бог возвысил Иисуса Своей правой рукой.
  rationale: Контекст возвышения и новозаветный образ пребывания по правую руку Бога поддерживают локативное понимание, однако грамматика допускает инструментальное, поэтому оно приведено в сноске.
- issue: Характер покаяния в выражении δοῦναι μετάνοιαν
  choice: Покаяние представлено как дар, который возвышенный Иисус даёт Израилю.
  alternative: Передать μετάνοια лишь как «перемену мнения».
  rationale: «Покаяние» сохраняет обычный новозаветный смысл обращения к Богу и не сводит его к интеллектуальному пересмотру, при этом формулировка не разрешает сверх текста вопрос о соотношении Божьего дара и человеческого отклика.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. «По правую руку от Себя» ясно передаёт образ почётного положения; «Вождь» сохраняет смысл главенства ἀρχηγός, а «покаяние» является естественным и богословски ёмким эквивалентом μετάνοια.
