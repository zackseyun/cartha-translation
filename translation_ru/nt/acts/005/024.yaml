  yaml_path: translation/nt/acts/005/024.yaml
  text: When the captain of the temple and the chief priests heard these words[a], they were perplexed about them, wondering what this might come to.
translation:
  language: ru
  text: Когда начальник храмовой стражи и первосвященники услышали эти слова, они недоумевали, чем всё это может кончиться[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что из всего этого выйдет». Греческое выражение передаёт неуверенность в том, каков будет исход происходящего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ
  choice: Когда
  rationale: Естественно вводит следующее событие как временное придаточное; связующая сила δέ понятна из хода повествования и не требует отдельного «же».
- source_word: ἤκουσαν τοὺς λόγους τούτους
  choice: услышали эти слова
  rationale: Сохраняет прямое значение выражения и указывает на только что переданное сообщение.
- source_word: ὅ τε στρατηγὸς τοῦ ἱεροῦ
  choice: начальник храмовой стражи
  rationale: Стратег храма был должностным лицом, руководившим храмовой охраной; такой перевод понятнее современному читателю, чем буквальное «начальник храма».
- source_word: οἱ ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшееся русское обозначение представителей высшего священнического руководства; множественное число не подразумевает непременно нескольких одновременно действующих верховных первосвященников.
- source_word: διηπόρουν
  choice: пришли в замешательство и недоумевали
  rationale: Передаёт усиленное значение глагола — состояние глубокой растерянности и неуверенности; форма несовершенного вида отражает длительность состояния.
- source_word: περὶ αὐτῶν
  choice: всё это
  rationale: По контексту относится к услышанному сообщению и описанным в нём обстоятельствам; русское выражение избегает неясного местоименного «о них».
- source_word: τί ἂν γένοιτο τοῦτο
  choice: к чему всё это может привести
  rationale: Передаёт выраженную сочетанием ἄν с оптативом неуверенность относительно возможного исхода событий, не превращая вопрос об исходе в вопрос о значении.
