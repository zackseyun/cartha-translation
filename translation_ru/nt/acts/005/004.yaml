id: ACT.5.4
reference: Acts 5:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὐχὶ μένον σοὶ ἔμενεν καὶ πραθὲν ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν; τί ὅτι ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο; οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/004.yaml
  text: While it remained unsold[a], did it not remain yours? And after it was sold[b], was it not under your authority? Why is it that you have set this matter in your heart? You have not lied to men but to God.
translation:
  language: ru
  text: Разве, пока земля оставалась непроданной, она не была твоей? И разве после продажи выручка[a] не была в твоей власти? Почему ты задумал это в своём сердце? Ты солгал не людям, а Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «после того как оно было продано»; по контексту подразумевается выручка от продажи.'
    reason: Уточнение эллиптической конструкции оригинала.
lexical_decisions:
- source_word: μένον σοὶ ἔμενεν
  choice: Пока земля оставалась непроданной, разве она не была твоей?
  rationale: Повтор μένω передан через «оставалась», а дательный σοὶ — естественной русской конструкцией принадлежности «была твоей». Слово «земля» восстановлено из ближайшего контекста (Деян 5:3), чтобы по-русски субъект не оставался неясным.
- source_word: πραθὲν
  choice: после продажи
  rationale: Аористное страдательное причастие естественно передано обстоятельственным оборотом, сохраняющим значение совершившейся продажи.
- source_word: ἐν τῇ σῇ ἐξουσίᾳ ὑπῆρχεν
  choice: не были в твоей власти
  rationale: ἐξουσία здесь обозначает право распоряжения и реальный контроль. Формулировка «в твоей власти» естественна и сохраняет мысль о свободе распорядиться выручкой.
- source_word: τί ὅτι
  choice: Зачем
  rationale: В данном контексте идиома вводит укоризненный вопрос о мотиве поступка; «зачем» звучит естественно и передаёт направленность вопроса на сознательный замысел.
- source_word: ἔθου ἐν τῇ καρδίᾳ σου τὸ πρᾶγμα τοῦτο
  choice: ты замыслил это в своём сердце
  rationale: Сохранён библейский образ сердца как средоточия внутреннего решения, а «замыслил» передаёт сознательное помещение намерения в сердце без излишнего уточнения характера замысла.
- source_word: οὐκ ἐψεύσω ἀνθρώποις ἀλλὰ τῷ θεῷ
  choice: Ты солгал не людям, а Богу
  rationale: Аорист передан простым прошедшим временем. «Людям» точно и естественно выражает родовое значение ἀνθρώποις и сохраняет резкое противопоставление Богу.
theological_decisions:
- issue: Связь слов «Богу» с упоминанием Святого Духа в Деян 5:3
  choice: Передать буквально «Богу», не добавляя пояснения.
  alternative: «Богу, то есть Святому Духу»
  rationale: Сам стих называет Бога; связь со Святым Духом устанавливается контекстом и не нуждается в догматическом дополнении внутри перевода.
- issue: Право Анании распоряжаться имуществом и выручкой
  choice: Подчеркнуть, что и земля принадлежала ему, и выручка находилась в его власти.
  alternative: Передать лишь факт владения без указания на свободу распоряжения.
  rationale: Аргумент Петра состоит в том, что вина заключалась не в отказе отдать всё, а во лжи; ἐξουσία прямо указывает на право распоряжения.
- issue: Референт среднего рода в πραθὲν и единственное число ὑπῆρχεν
  choice: В основном тексте назвать «вырученные деньги» и согласовать сказуемое по нормам русского языка во множественном числе.
  alternative: Сохранить формально единственное число посредством «вырученное».
  rationale: Греческая конструкция подразумевает полученное после продажи; по-русски «вырученные деньги» ясно передаёт смысл, а примечание отмечает эллиптичность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Риторические вопросы сохранены; архаичные «доколе», «неужели же» и родовое «человекам» не используются. Формулировка понятна широкому читателю и не вносит конфессиональных толкований.
