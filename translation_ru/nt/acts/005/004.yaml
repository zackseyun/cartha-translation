  source_fidelity: 'Первая часть верно передаёт принадлежность имущества Анании, а заключительное противопоставление «не людям, а Богу» точно. Однако «вырученные деньги» — эксплицитное смысловое развёртывание: в греческом стоит среднее единственное число πραθέν («то, что было продано»), при этом контекст подразумевает распоряжение выручкой. Это следует обозначить более точно в сноске. «Почему» ближе к τί ὅτι, чем целевое «зачем».'
  naturalness: Предлагаемая редакция сохраняет современный литературный строй и риторические вопросы. «Выручка» естественнее, чем множественное «вырученные деньги», и позволяет не менять число сказуемого вслед за русской нормой.
  terminology: «В твоей власти» адекватно передаёт ἐν τῇ σῇ ἐξουσίᾳ и не сужает значение до простого владения. «Людям» точно передаёт ἀνθρώποις в общем значении. «Богу» оставлено без богословского пояснения, как в исходном тексте.
