review_pass:
  verdict: approve
  source_fidelity: Текст точно передаёт греческую формулу ответа ἀποκριθεὶς … εἶπαν одним естественным русским глаголом «ответили». «Но» приемлемо передаёт δέ, а «Пётр и апостолы» сохраняет состав названных говорящих. «Должно повиноваться Богу больше, чем людям» верно воспроизводит необходимость δεῖ, значение πειθαρχεῖν и сравнительное μᾶλλον ἢ без неоправданного усиления до «а не людям».
  naturalness: Фраза звучит как современный литературный русский в сдержанном библейском регистре. Безличное «должно» грамматически и стилистически естественно; «повиноваться» уместно в контексте власти и обязанности.
  terminology: «Апостолы», «Богу» и «людям» употреблены точно и общепринято. «Людям» корректно передаёт родовое ἀνθρώποις в противопоставлении Богу и не сужает значение до лиц мужского пола. Английская сноска о возможных вариантах для “men” не требуется в русском, поскольку «людям» не создаёт сопоставимой двусмысленности.
