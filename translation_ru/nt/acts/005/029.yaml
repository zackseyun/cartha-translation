  text: ἀποκριθεὶς δὲ Πέτρος καὶ οἱ ἀπόστολοι εἶπαν· Πειθαρχεῖν δεῖ θεῷ μᾶλλον ἢ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/029.yaml
  text: But Peter and the apostles answered[a], “We must obey God rather than men.”
translation:
  language: ru
  text: 'Но Пётр и апостолы ответили: «Должно повиноваться Богу больше, чем людям».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπαν
  choice: ответили
  rationale: Причастие вместе с личной формой образует обычную повествовательную формулу ответа; одно русское «ответили» естественно передаёт её без избыточного «отвечая, сказали».
- source_word: δὲ
  choice: Но
  rationale: Частица обозначает переход с оттенком противопоставления ответу властей в предшествующем контексте.
- source_word: Πέτρος καὶ οἱ ἀπόστολοι
  choice: Пётр и апостолы
  rationale: Сохраняются личное имя и укоренившееся русское обозначение признанной апостольской группы.
- source_word: Πειθαρχεῖν
  choice: повиноваться
  rationale: Глагол означает подчиняться законной власти или слушаться её; «повиноваться» сохраняет оттенок признания авторитета и соответствует возвышенному, но современному библейскому регистру.
- source_word: δεῖ
  choice: Должно
  rationale: Безличная конструкция точно передаёт необходимость и всеобщий принцип, не вводя прямо отсутствующее в греческом тексте местоимение «мы».
- source_word: θεῷ
  choice: Богу
  rationale: Дательный падеж обозначает того, кому повинуются.
- source_word: μᾶλλον ἢ
  choice: больше, чем
  rationale: Сравнительная конструкция сохранена без превращения её в более абсолютное «а не»; это оставляет присущую тексту риторическую форму и напряжение.
- source_word: ἀνθρώποις
  choice: людям
  rationale: ἄνθρωποι употреблено родовым образом и противопоставляет Бога человеческим властям вообще; современное русское «людям» точно и естественно передаёт этот смысл без неоправданного ограничения мужчинами.
theological_decisions:
- issue: Характер противопоставления послушания Богу и людям
  choice: «Богу больше, чем людям»
  alternative: «Богу, а не людям»
  rationale: Греческое μᾶλλον ἢ формально является сравнением «больше, чем». Выбранный вариант не усиливает формулировку до безусловного отрицания всякого послушания людям и сохраняет заложенную в оригинале приоритетность Божьего авторитета.
- issue: Родовое значение ἀνθρώποις
  choice: «людям»
  alternative: «мужчинам» / «человекам»
  rationale: В данном контексте речь идёт о человеческих властях в противопоставлении Богу, а не о поле этих лиц. «Людям» передаёт родовое значение и не добавляет богословского ограничения.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. «Повиноваться» выбрано вместо более разговорного «слушаться»; порядок слов сохраняет выразительное противопоставление Бога и людей.
