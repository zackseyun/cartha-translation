  source_fidelity: 'Основной смысл передан точно: Πέτρος обращается к Сапфире; συνεφωνήθη ὑμῖν передано как взаимное соглашение, πειράσαι — как «испытать», τὸ πνεῦμα κυρίου — как «Дух Господа», а образ «ноги тех, кто похоронил» сохранён. Однако «уже» не выражено непосредственно в греческом тексте, а частица «и» в «вынесут и тебя» добавляет явное значение «тоже/также», которое лишь подразумевается контекстом.'
