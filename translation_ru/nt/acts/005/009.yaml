  terminology: «Дух Господа» — точная и нейтральная передача τὸ πνεῦμα κυρίου, не подменяющая форму оригинала конфессионально расширенным «Святой Дух». «Испытать» уместнее, чем «искушать», для πειράσαι в данном контексте. «Муж» корректно передаёт ἀνήρ.
