id: ACT.5.9
reference: Acts 5:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Πέτρος πρὸς αὐτήν· Τί ὅτι συνεφωνήθη ὑμῖν πειράσαι τὸ πνεῦμα κυρίου; ἰδοὺ οἱ πόδες τῶν θαψάντων τὸν ἄνδρα σου ἐπὶ τῇ θύρᾳ καὶ ἐξοίσουσίν σε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/009.yaml
  text: But Peter said to her[a], “Why did you agree together to test the Spirit of the Lord? Look, the feet of those who buried your husband are at the door[b], and they will carry you out.”
translation:
  language: ru
  text: 'Но Пётр сказал ей: «Зачем вы договорились между собой испытать Дух Господа?[a] Вот, у двери ноги тех, кто похоронил твоего мужа,[b] и они вынесут тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сговорились между собой, чтобы испытать Дух Господа».'
    reason: Альтернативная передача подчёркивает преступный характер совместного решения, подразумеваемый контекстом, но выраженный сильнее, чем собственное значение συμφωνέω.
  - marker: b
    text: 'То есть у двери находятся те, кто похоронил твоего мужа; буквально: «ноги тех, кто похоронил».'
    reason: Поясняется яркая греческая метонимия, сохранённая в основном тексте.
lexical_decisions:
- source_word: Τί ὅτι συνεφωνήθη ὑμῖν
  choice: Зачем вы договорились между собой
  rationale: Оборот Τί ὅτι передаёт укоризненный вопрос о причине, а пассивная форма συνεφωνήθη с ὑμῖν идиоматически обозначает взаимное соглашение. «Договорились между собой» сохраняет значение согласия и не усиливает его до однозначного «сговора».
- source_word: πειράσαι
  choice: испытать
  rationale: πειράζω здесь означает подвергнуть испытанию, проверить. «Искушать» применительно к Духу Господа в современном русском могло бы создать неверное впечатление.
- source_word: τὸ πνεῦμα κυρίου
  choice: Дух Господа
  rationale: Сохраняется греческая конструкция с родительным падежом без поясняющей замены на «Святой Дух», хотя контекст Деян 5:3 ясно указывает на Святого Духа.
- source_word: ἰδοὺ
  choice: Вот
  rationale: «Вот» естественно передаёт указательное и привлекающее внимание значение ἰδού и сохраняет внезапность предупреждения.
- source_word: οἱ πόδες τῶν θαψάντων
  choice: ноги тех, кто похоронил
  rationale: Сохранён буквальный и зловещий образ греческого текста. Речь идёт о присутствии у входа людей, только что похоронивших Ананию.
- source_word: τὸν ἄνδρα σου
  choice: твоего мужа
  rationale: В данном контексте ἀνήρ обозначает супруга Сапфиры, а не просто мужчину.
- source_word: ἐπὶ τῇ θύρᾳ
  choice: у двери
  rationale: Оборот обозначает непосредственное нахождение при входе; «у двери» естественно по-русски.
- source_word: ἐξοίσουσίν σε
  choice: они вынесут и тебя
  rationale: Глагол ἐκφέρω означает «выносить». Перевод сохраняет прямоту и не добавляет отсутствующее в греческом слово «тело»; частица «и» естественно передаёт подразумеваемую параллель с участью мужа.
theological_decisions:
- issue: Кого обозначает «Дух Господа»
  choice: Сохранить формулировку «Дух Господа» как указание на Святого Духа без расширения текста
  alternative: «Святой Дух» или «Господень Дух»
  rationale: Ближайший контекст связывает выражение со Святым Духом, однако сам стих говорит πνεῦμα κυρίου. Буквенная форма сохраняет как связь с Господом, так и формулировку источника.
- issue: Сила обвинения Петра
  choice: «договорились между собой»
  alternative: «сговорились»
  rationale: Контекст предполагает виновное тайное соглашение, но συμφωνέω само по себе означает согласиться или договориться. Основной текст не усиливает лексическое значение, а примечание отмечает допустимую контекстуальную передачу.
translation_notes:
  register: Современный литературный русский с достойной повествовательной интонацией. Обращение сохраняет переход от множественного «вы» (Сапфира и Анания как сообщники) к единственному «тебя» (непосредственно Сапфире). Буквальный образ «ноги тех» намеренно оставлен ради выразительности источника и снабжён пояснением.
