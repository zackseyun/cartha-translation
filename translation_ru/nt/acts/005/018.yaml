lexical_decisions:
- source_word: ἐπέβαλον τὰς χεῖρας ἐπὶ
  choice: схватили
  rationale: Греческий оборот буквально говорит о возложении рук, но в данном враждебном контексте означает задержание. «Схватили» естественно передаёт действие и не вызывает ложной ассоциации с обрядовым возложением рук.
- source_word: ἀποστόλους
  choice: апостолов
  rationale: В Деяниях это устойчивое обозначение уполномоченных посланников Иисуса, поэтому сохраняется общепринятый термин.
- source_word: ἔθεντο
  choice: заключили
  rationale: В сочетании с обозначением содержания под стражей глагол естественно передаётся по-русски как «заключили».
- source_word: ἐν τηρήσει
  choice: в тюрьму
  rationale: τήρησις может обозначать как состояние содержания под стражей, так и место заключения. В основном тексте выбран естественный для данного контекста вариант, а более широкое значение отмечено в сноске.
- source_word: δημοσίᾳ
  choice: городскую
  rationale: Здесь слово указывает на публичное, официальное место заключения, в отличие от частного содержания под стражей. «Городскую» естественно звучит по-русски в данном историческом контексте, хотя несколько конкретизирует греческое слово; поэтому границы значения пояснены в сноске.
