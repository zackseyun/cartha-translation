lexical_decisions:
- source_word: Οἱ δὲ
  choice: они
  rationale: Субстантивированный артикль указывает на ранее названных членов совета; оттенок δέ естественно передаётся сменой хода повествования без обязательного отдельного союза.
- source_word: ἀκούσαντες
  choice: услышав это
  rationale: Аористное причастие передаёт предшествующее обстоятельство времени; «это» естественно восполняет подразумеваемое содержание речи апостолов.
- source_word: διεπρίοντο
  choice: пришли в ярость
  rationale: Глагол буквально создаёт образ рассечения или распиливания, но в данном контексте обозначает крайне сильную и враждебную внутреннюю реакцию. Русское выражение ясно передаёт смысл, не смешивая его с покаянным сокрушением.
- source_word: ἐβούλοντο
  choice: хотели
  rationale: Имперфект выражает продолжавшееся желание или намерение; нейтральное «хотели» сохраняет эту модальность, не усиливая её до окончательного решения.
- source_word: ἀνελεῖν
  choice: убить
  rationale: В контексте ἀναιρέω означает лишить жизни; прямой современный эквивалент сохраняет суровость намерения.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение относится к апостолам, находившимся перед советом.
theological_decisions:
- issue: Характер реакции, выраженной διεπρίοντο
  choice: пришли в ярость
  alternative: были пронзены до глубины сердца
  rationale: Контекст последующего желания убить апостолов указывает на враждебное неистовство. Более буквальный образ может по-русски ошибочно прозвучать как раскаяние, поэтому он сохранён в примечании.
translation_notes:
