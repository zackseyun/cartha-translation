  text: καὶ ἡμεῖς ⸀ἐσμεν μάρτυρες τῶν ῥημάτων τούτων, καὶ τὸ ⸀πνεῦμα τὸ ἅγιον ὃ ἔδωκεν ὁ θεὸς τοῖς πειθαρχοῦσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/032.yaml
  text: And we are witnesses of these things[a], and so is the Holy Spirit[c][b], whom God has given to those who obey him.
translation:
  language: ru
  text: И мы — свидетели всего этого[a], как и Святой Дух[b], которого Бог дал тем, кто повинуется Ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этих слов»; возможно: «этого», «того, о чём идёт речь».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и Святой Дух»; подразумеваемое сказуемое переносится из предыдущей части: «и Святой Дух [свидетель]».'
    reason: alternative_reading
lexical_decisions:
- source_word: μάρτυρες
  choice: свидетели
  rationale: Обычное и точное русское соответствие в контексте свидетельства об увиденном и совершившемся.
- source_word: τῶν ῥημάτων τούτων
  choice: этих событий
  rationale: Здесь ῥήματα обозначает то, о чём апостолы свидетельствуют; «событий» естественно передаёт контекст, не исключая общего значения «вещей/дел».
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святой Дух
  rationale: Устоявшееся и современное русское наименование.
- source_word: ὃ
  choice: которого
  rationale: Хотя греческое местоимение среднего рода согласуется с πνεῦμα, по-русски личный референт естественно обозначается формой мужского рода.
- source_word: ἔδωκεν
  choice: дал
  rationale: Простое прошедшее время прямо передаёт греческий аорист, а продолжающаяся значимость дара ясна из контекста.
- source_word: πειθαρχοῦσιν
  choice: повинуется
  rationale: Глагол выражает послушание тому, кто обладает властью; выбор также сохраняет связь с Деян 5:29.
- source_word: αὐτῷ
  choice: Ему
  rationale: Местоимение относится к Богу; сохранена местоименная связь оригинала.
theological_decisions:
- issue: Святой Дух как свидетель наряду с апостолами
  choice: «как и Святой Дух»
  alternative: «и Святой Дух [свидетель]»
  rationale: Во второй части греческого предложения подразумевается сказуемое из первой части. Русская конструкция делает эту связь ясной, не добавляя нового содержания.
- issue: Личное обозначение Святого Духа
  choice: «которого»
  alternative: «который» при перестройке фразы или буквальное согласование среднего рода, невозможное при русском наименовании «Дух»
  rationale: Русская грамматика требует согласования с существительным мужского рода «Дух»; форма также естественно передаёт личный референт.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет торжественную простоту и ясность апостольского свидетельства. Заглавная буква в «Ему» использована согласно распространённой русской библейской издательской норме.
