  text: ἄγγελος δὲ κυρίου ⸀διὰ νυκτὸς ⸀ἤνοιξε τὰς θύρας τῆς φυλακῆς ἐξαγαγών τε αὐτοὺς εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/019.yaml
  text: But an angel of the Lord opened the doors of the prison during the night, brought them out, and said,
translation:
  language: ru
  text: 'Но ночью ангел Господа открыл двери тюрьмы, вывел их и сказал:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: ангел
  rationale: Контекст сверхъестественного освобождения указывает на небесного посланника; неопределённость греческого существительного в русском естественно передаётся без артикля.
- source_word: κυρίου
  choice: Господень
  rationale: Устойчивое и точное библейское соответствие выражению ἄγγελος κυρίου; краткая притяжательная форма естественна в современном литературном русском.
- source_word: διὰ νυκτός
  choice: ночью
  rationale: Передаёт временное значение конструкции ясно, естественно и без излишнего уточнения продолжительности.
- source_word: ἤνοιξε
  choice: открыл
  rationale: Точно передаёт ἀνοίγω и не добавляет отсутствующей в тексте детали об отпирании замков.
- source_word: τὰς θύρας τῆς φυλακῆς
  choice: двери темницы
  rationale: Сохраняет множественное число θύρας и смысл места заключения; «темница» поддерживает достоинство библейского повествования и остаётся понятной современному читателю.
- source_word: ἐξαγαγών
  choice: вывел их
  rationale: 'Естественно передаёт результативное действие ἐξάγω: ангел вывел заключённых наружу.'
- source_word: τε
  choice: и
  rationale: Русский союз естественно связывает последующее действие с предшествующими.
- source_word: εἶπεν
  choice: сказал
  rationale: Стандартное повествовательное соответствие; двоеточие указывает, что содержание речи следует в следующем стихе.
theological_decisions:
- issue: Природа ἄγγελος в данном контексте
  choice: небесный ангел
  alternative: человек-посланник
  rationale: Сверхъестественное открытие дверей темницы и освобождение апостолов убедительно указывают на ангельское существо, но перевод не добавляет пояснений сверх слова «ангел».
- issue: Передача κύριος
  choice: Господь в форме «Господень»
  alternative: Владыка / господин
  rationale: Выражение «ангел Господень» точно сохраняет традиционную библейскую формулу и не сужает возможную референцию слова κύριος.
translation_notes:
  register: Современный литературный русский с умеренно высоким библейским регистром. Порядок действий сохранён; причастная конструкция естественно развёрнута в ряд однородных сказуемых. Маркеры сносок не требуются.
