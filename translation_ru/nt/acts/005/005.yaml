source:
  edition: SBLGNT
  text: ἀκούων δὲ ὁ Ἁνανίας τοὺς λόγους τούτους πεσὼν ἐξέψυξεν· καὶ ἐγένετο φόβος μέγας ἐπὶ πάντας τοὺς ⸀ἀκούοντας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/005.yaml
  text: But when Ananias heard these words[a], he fell down and died. And great fear came upon all who heard.
translation:
  language: ru
  text: Услышав эти слова, Анания упал и испустил дух.[a] И великий страх охватил всех, кто слышал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «испустил дыхание»; то есть умер.'
    reason: Поясняет образное значение греческого глагола ἐξέψυξεν.
lexical_decisions:
- source_word: ἀκούων
  choice: услышав
  rationale: 'Причастие естественно передаёт временную связь: смерть последовала после того, как Анания услышал слова Петра.'
- source_word: δὲ
  choice: не передано отдельным союзом
  rationale: В русском повествовании переход и лёгкое противопоставление достаточно выражены последовательностью событий; союз «но» здесь звучал бы несколько тяжеловесно.
- source_word: λόγους τούτους
  choice: эти слова
  rationale: Речь идёт о только что произнесённых словах Петра; это прямой и естественный русский эквивалент.
- source_word: πεσὼν
  choice: упал
  rationale: Сохраняется конкретный физический образ греческого текста без более истолковывающего «рухнул».
- source_word: ἐξέψυξεν
  choice: испустил дух
  rationale: Выражение передаёт образное значение глагола — прекращение дыхания и наступление смерти — и остаётся понятным в современном литературном русском.
- source_word: ἐγένετο φόβος μέγας ἐπὶ
  choice: великий страх охватил
  rationale: Естественная русская конструкция, ясно передающая внезапное распространение сильного страха.
- source_word: πάντας τοὺς ἀκούοντας
  choice: всех, кто об этом услышал
  rationale: Субстантивированное причастие обозначает людей, услышавших о случившемся; добавление «об этом» естественно восполняет подразумеваемый объект, не сужая круг слушателей.
- source_word: Ἁνανίας
  choice: Анания
  rationale: Использована устоявшаяся русская форма библейского имени.
theological_decisions:
- issue: Причина и механизм смерти Анании
  choice: Сообщить о немедленной смерти, не уточняя её механизм
  alternative: Прямо сказать, что Бог поразил его смертью, либо что он умер от потрясения
  rationale: Греческий текст описывает падение и смерть, но не объясняет физиологическую или непосредственную сверхъестественную причину; перевод не должен добавлять такое объяснение.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного стиля. «Испустил дух» несколько возвышенно, но понятно и близко к образности исходного глагола; сноска раскрывает буквальный смысл. Все местоименные и причинные связи оставлены без конфессионального истолкования.
