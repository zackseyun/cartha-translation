  text: Ἀγαγόντες δὲ αὐτοὺς ἔστησαν ἐν τῷ συνεδρίῳ. καὶ ἐπηρώτησεν αὐτοὺς ὁ ἀρχιερεὺς
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/027.yaml
  text: After bringing them in, they stood them before the council, and the high priest questioned them.
translation:
  language: ru
  text: Приведя их, они поставили их перед советом[a], и первосвященник спросил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед Синедрионом». Греческое слово συνέδριον обозначает иудейский верховный совет.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀγαγόντες
  choice: Приведя их
  rationale: Аористное действительное причастие обозначает действие, предшествующее сказуемому; деепричастная конструкция естественно и кратко передаёт последовательность.
- source_word: δὲ
  choice: —
  rationale: Слабая повествовательная связка; в русском её можно не выражать отдельно, поскольку последовательность событий ясна без «же» или «и».
- source_word: ἔστησαν
  choice: поставили перед
  rationale: Переходное употребление ἵστημι означает «поставить, поместить»; формулировка сохраняет конкретный образ официального представления обвиняемых перед советом.
- source_word: ἐν τῷ συνεδρίῳ
  choice: перед советом
  rationale: συνέδριον обозначает и собрание, и иудейский верховный совет. Предлог «перед» в сочетании с «поставили» естественно передаёт судебную ситуацию, не подменяя греческое нарицательное слово традиционным названием.
- source_word: ἐπηρώτησεν
  choice: стал расспрашивать
  rationale: ἐπερωτάω означает «спрашивать, расспрашивать». В данном официальном контексте это передаёт направленный опрос, но не усиливает значение до «допрашивать».
- source_word: ὁ ἀρχιερεὺς
  choice: первосвященник
  rationale: Устоявшийся и точный русский эквивалент титула ἀρχιερεύς в данном контексте.
theological_decisions:
- issue: Передача συνέδριον
  choice: совет
  alternative: Синедрион
  rationale: В основном тексте сохранено нарицательное значение греческого слова. Исторически речь идёт о Синедрионе, что указано в сноске, без превращения традиционного названия в единственно возможное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного и судебного контекста. Безличное «поставили» естественно сохраняет не названный прямо субъект греческого ἔστησαν; «стал расспрашивать» передаёт начало официального опроса без чрезмерно жёсткого оттенка слова «допрашивать».
