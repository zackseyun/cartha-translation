  text: εἶπέν τε πρὸς αὐτούς· Ἄνδρες Ἰσραηλῖται, προσέχετε ἑαυτοῖς ἐπὶ τοῖς ἀνθρώποις τούτοις τί μέλλετε πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/035.yaml
  text: And he said to them[a], “Men of Israel, be careful what you are about to do with these men.”
translation:
  language: ru
  text: 'И сказал им: «Израильтяне, будьте осторожны в том, что вы собираетесь сделать с этими людьми».


    [a] Или: «Будьте осмотрительны относительно того, что собираетесь сделать с этими людьми»; буквально: «Смотрите за собой относительно того, что собираетесь сделать с этими людьми».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будьте осмотрительны относительно того, что собираетесь сделать с этими людьми»; буквально: «Смотрите за собой относительно того, что собираетесь сделать с этими людьми».'
    reason: Греческое προσέχετε ἑαυτοῖς буквально содержит возвратный оттенок («смотрите за собой»), а ἐπὶ τοῖς ἀνθρώποις τούτοις может быть передано как «относительно этих людей». Основной текст выбирает более естественную русскую конструкцию, не усиливая значение до «против этих людей».
lexical_decisions:
- source_word: εἶπέν τε πρὸς αὐτούς
  choice: И сказал им
  rationale: τέ слегка связывает слова Гамалиила с предшествующим повествованием; простое «и» не усиливает ни временную последовательность, ни причинное следствие. πρός с λέγω естественно передаётся дательным падежом «им».
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Израильтяне
  rationale: Формальное обращение к мужчинам — членам совета. В современном русском «израильтяне» естественно обозначает адресатов мужского пола в данном контексте; буквальное «мужи израильские» звучит архаично.
- source_word: προσέχετε ἑαυτοῖς
  choice: Будьте осторожны
  rationale: Императив с возвратным дательным выражает призыв к осмотрительности и самоконтролю. «Будьте осторожны» естественно передаёт предостережение, не добавляя более сильного значения.
- source_word: ἐπὶ τοῖς ἀνθρώποις τούτοις
  choice: с этими людьми
  rationale: ἐπί с дательным указывает на предмет предостережения — предполагаемое обращение с апостолами. «С этими людьми» сохраняет практический смысл и не вводит явно враждебного «против», которого греческий текст прямо не требует.
- source_word: τί μέλλετε πράσσειν
  choice: решая, что вы намерены сделать
  rationale: μέλλω с инфинитивом выражает предстоящее или намеченное действие. «Намерены сделать» сохраняет оттенок намерения, а «решая» естественно связывает вопросительное придаточное с призывом к осторожности.
theological_decisions: []
translation_notes:
  register: Современный литературный русский, dignified but accessible. Архаичное «мужи израильские» заменено естественным обращением «израильтяне». Основной текст слегка перестроен ради ясной русской синтаксической связи, а более буквальная структура сохранена в сноске.
