  yaml_path: translation/nt/acts/005/014.yaml
  text: And even more believers in the Lord were being added—multitudes of both men and women[a].
translation:
  language: ru
  text: И всё больше верующих в Господа прибавлялось — множество мужчин и женщин[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «присоединялось». Греческий глагол описывает продолжавшееся увеличение числа; его пассивная форма может подразумевать Бога как того, кто прибавлял людей.'
    reason: Лексическая и залоговая неоднозначность προσετίθεντο.
lexical_decisions:
- source_word: μᾶλλον δὲ
  choice: И всё больше
  rationale: Передаёт мягкую повествовательную связь δέ и сравнительно-усилительное значение μᾶλλον естественным современным русским оборотом.
- source_word: προσετίθεντο
  choice: присоединялось
  rationale: Имперфект передаёт продолжавшийся рост, а форма допускает как смысл присоединения людей, так и пассивный оттенок «их прибавляли». Выбор сохраняет естественность русского и не называет подразумеваемого деятеля.
- source_word: πιστεύοντες τῷ κυρίῳ
  choice: верующих в Господа
  rationale: Субстантивированное причастие обозначает людей, характеризуемых верой, а дательный τῷ κυρίῳ — того, на кого направлена вера. Русское «верующие в Господа» точно и идиоматично.
- source_word: πλήθη
  choice: множество
  rationale: Передаёт большую численность; единственное собирательное «множество» звучит в современном русском естественнее буквального «множества».
- source_word: ἀνδρῶν τε καὶ γυναικῶν
  choice: мужчин и женщин
  rationale: Сохраняет прямое упоминание обеих групп и соотносится с собирательным словом «множество».
theological_decisions:
- issue: К кому относится титул «Господь»
  choice: Сохранён титул «Господь» без поясняющей подстановки имени; в контексте Деяний наиболее вероятен Иисус.
  alternative: Понимать κύριος более общо как Бога.
  rationale: Перевод сохраняет исходный титул и его возможное смысловое напряжение, не устраняя контекстуально вероятную христологическую отсылку.
- issue: Залог и вид προσετίθεντο
  choice: «присоединялось» с примечанием о возможном пассивном понимании.
  alternative: «их прибавлялось» / «были присоединяемы».
  rationale: Греческая форма описывает продолжавшийся процесс и может подразумевать Бога как того, кто прибавляет людей, но не называет его прямо. Основной текст остаётся естественным, а неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Тире перед «множество мужчин и женщин» сохраняет пояснительный характер приложения. Согласование «множество… присоединялось» нормативно для собирательного существительного.
