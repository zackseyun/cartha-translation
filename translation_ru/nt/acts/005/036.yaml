source:
  edition: SBLGNT
  text: πρὸ γὰρ τούτων τῶν ἡμερῶν ἀνέστη Θευδᾶς, λέγων εἶναί τινα ἑαυτόν, ᾧ ⸀προσεκλίθη ⸂ἀνδρῶν ἀριθμὸς ὡς⸃ τετρακοσίων· ὃς ἀνῃρέθη, καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διελύθησαν καὶ ἐγένοντο εἰς οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/036.yaml
  text: For before these days Theudas rose up[a], claiming to be somebody, and a number of men, about four hundred, joined him. He was killed[c][b], and all who had been persuaded by him were scattered and came to nothing.
translation:
  language: ru
  text: Ведь незадолго до этого появился Февда, выдававший себя за важного человека[a]. К нему примкнуло около четырёхсот мужчин[b]. Его убили, а все, кого он убедил следовать за собой[c], рассеялись, и всё сошло на нет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говоривший, что он — некто»; то есть представлявший себя значительной личностью.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «К нему присоединилось около четырёхсот мужчин».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «все, кто был убеждён им»; возможно также: «все, кто ему поверил» или «подчинился ему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ γὰρ τούτων τῶν ἡμερῶν
  choice: Ведь незадолго до этого
  rationale: πρό с родительным указывает на предшествующее время, а γάρ вводит обоснование в рассуждении Гамалиила. Русское «ведь» естественно сохраняет пояснительную связь; «незадолго до этого» передаёт контекстуальный смысл фразы без буквального, но неестественного «до этих дней».
- source_word: ἀνέστη Θευδᾶς
  choice: появился Февда
  rationale: Здесь ἀνίστημι обозначает появление или выдвижение вождя, а не буквальное вставание или воскресение. «Появился» ясно и естественно передаёт этот смысл. Имя Θευδᾶς передано в принятой русской библейской форме «Февда».
- source_word: λέγων εἶναί τινα ἑαυτόν
  choice: выдававший себя за важного человека
  rationale: Оборот τινα ἑαυτόν идиоматически означает притязание на значительность. «Выдававший себя» сохраняет оттенок самопровозглашения, а «за важного человека» делает подразумеваемое значение понятным современному читателю.
- source_word: ᾧ προσεκλίθη
  choice: К нему примкнуло
  rationale: Глагол описывает присоединение к человеку и поддержку его движения. «Примкнуло» естественно выражает добровольное присоединение к вождю и сохраняет политико-социальный оттенок контекста.
- source_word: ἀνδρῶν ἀριθμὸς ὡς τετρακοσίων
  choice: около четырёхсот мужчин
  rationale: ὡς обозначает приблизительность, а ἀνδρῶν конкретно указывает на мужчин. Сжатая русская конструкция передаёт все значимые компоненты без тяжеловесного «число мужчин около четырёхсот».
- source_word: ὃς ἀνῃρέθη
  choice: Его убили
  rationale: ἀναιρέω здесь означает лишение жизни. Неопределённо-личная активная конструкция по-русски естественнее буквального пассива «он был убит» и не добавляет субъекта действия.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: все, кого он убедил следовать за собой
  rationale: Форма ἐπείθοντο передаёт людей, поддавшихся убеждению или доверившихся Февде. Добавление «следовать за собой» проясняет направленность убеждения в данном контексте, не сводя выражение к простому физическому следованию.
- source_word: διελύθησαν καὶ ἐγένοντο εἰς οὐδέν
  choice: рассеялись, и всё сошло на нет
  rationale: διελύθησαν описывает распад группы, а идиома ἐγένοντο εἰς οὐδέν — полную безрезультатность движения. «Всё сошло на нет» по-русски естественно относится к делу и движению в целом, избегая неясного буквального «они стали ничем».
theological_decisions:
- issue: Историческое сообщение о Февде в речи Гамалиила
  choice: Передать утверждение прямо как часть аргумента Гамалиила, не выражая в переводе сомнения и не согласовывая его с внешними историческими реконструкциями.
  alternative: Добавить оттенок легендарности или неопределённости либо изменить временную формулировку ради исторической гармонизации.
  rationale: Греческий текст представляет этот эпизод как пример, приведённый Гамалиилом. Задача перевода — сохранить данное свидетельство и его риторическую функцию, не вынося исторического суждения и не разрешая возможные напряжения за читателя.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сделан естественным для устного аргумента Гамалиила; сохранены причинное «ведь», приблизительное число мужчин, пассивно-неопределённый характер убийства и последовательность распада движения.
