  terminology: Имя «Февда» соответствует устойчивой русской библейской передаче. «Мужчин» корректно сохраняет специфику ἀνδρῶν. Формулировка «выдававший себя за важного человека» адекватно передаёт идиоматическое τινα ἑαυτόν, а сноска уместно отмечает буквальный оборот и его смысл. Сноска c надлежащим образом сохраняет лексическую вариативность ἐπείθοντο.
