  source_fidelity: Перевод точно передаёт аргументативное γάρ («Ведь»), предшествование во времени, появление Февды как лидера, его притязание на значительность, приблизительное число именно мужчин, его убийство, распад сторонников и конечную безрезультатность движения. «Всё сошло на нет» естественно выражает ἐγένοντο εἰς οὐδέν в контексте распавшейся группы и не вносит исторической гармонизации.
