  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οἱ μὲν οὖν ἐπορεύοντο χαίροντες ἀπὸ προσώπου τοῦ συνεδρίου ὅτι ⸂κατηξιώθησαν ὑπὲρ τοῦ ὀνόματος⸃ ἀτιμασθῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/041.yaml
  text: So they went on their way from the presence of the council[a], rejoicing that they had been counted worthy to be dishonored for the Name.
translation:
  language: ru
  text: Они же ушли из синедриона, радуясь, что удостоились быть обесчещенными за Имя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за имя Иисуса». В греческом тексте: «за Имя» — благоговейное сокращённое обозначение, чей смысл понятен из контекста.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: ушли
  rationale: Имперфект описывает их удаление от синедриона; «ушли» естественно передаёт движение прочь в русском повествовании, не утяжеляя фразу буквальным «шли».
- source_word: χαίροντες
  choice: радуясь
  rationale: Причастие настоящего времени выражает сопутствующее действие и сохраняет прямую связь радости с последующим указанием её причины.
- source_word: ἀπὸ προσώπου τοῦ συνεδρίου
  choice: из синедриона
  rationale: Греческое выражение буквально означает удаление «от лица/из присутствия» совета. По-русски «ушли из синедриона» естественно передаёт как оставление заседания, так и удаление от присутствия совета.
- source_word: συνεδρίου
  choice: синедриона
  rationale: В данном историческом контексте речь идёт о высшем иудейском совете. Устоявшееся русское «синедрион» точно обозначает этот орган и избегает неясного общего слова «совет».
- source_word: κατηξιώθησαν
  choice: удостоились
  rationale: Глагол передаёт признание или почитание достойными. «Удостоились» кратко и естественно сохраняет оценочный смысл и намеренный парадокс фразы.
- source_word: ὑπὲρ
  choice: за
  rationale: Предлог здесь указывает, ради кого или чего переносится бесчестие; русское «за» ёмко и естественно выражает эту связь.
- source_word: τοῦ ὀνόματος
  choice: Имя
  rationale: В греческом тексте стоит абсолютное «Имя» без прямо названного носителя. Эта благоговейная сокращённая формула сохранена, а прописная буква помогает передать её особое употребление в современном русском тексте.
- source_word: ἀτιμασθῆναι
  choice: быть обесчещенными
  rationale: Пассивный инфинитив обозначает подвергнуться бесчестию. Выбор сохраняет пассивную форму и контраст между тем, что апостолы «удостоились», и тем, что их обесчестили.
theological_decisions:
- issue: Абсолютное употребление выражения «Имя»
  choice: Сохранить «Имя» без раскрытия в основном тексте.
  alternative: имя Иисуса
  rationale: Контекст ясно связывает Имя с Иисусом, однако греческий текст оставляет носителя имени невыраженным. Сохранение этой формы передаёт благоговейную краткость оригинала и не устраняет его намеренную имплицитность.
- issue: Парадокс достоинства и бесчестия
  choice: «удостоились быть обесчещенными»
  alternative: «удостоились пострадать за Имя»
  rationale: Оригинал намеренно сополагает признание достойными и подвергание бесчестию. Более общее «пострадать» ослабило бы характерную для стиха богословскую и риторическую напряжённость.
translation_notes:
  register: 'Современный литературный русский язык с кратким, dignified повествовательным строем. «Синедрион» употреблён как устоявшееся историко-библейское название. Формулировка сохраняет резкий парадокс оригинала: апостолы сочли честью подвергнуться бесчестию.'
