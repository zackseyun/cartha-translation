  text: Then the captain went with the officers and brought them[a], not with force, for they were afraid of the people, lest they be stoned.
translation:
  language: ru
  text: 'Тогда начальник храмовой стражи[a] пошёл со стражниками и привёл апостолов, не применяя силы, потому что они боялись народа: как бы их не побили камнями.'
  philosophy: optimal-equivalence
  footnotes:
