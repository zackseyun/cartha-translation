    text: Греч. στρατηγός. Здесь имеется в виду начальник храмовой стражи — должностное лицо, отвечавшее за порядок при храме.
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατηγὸς
  choice: начальник храмовой стражи
  rationale: В контексте Деяний речь идёт не о римском военачальнике, а о должностном лице, отвечавшем за порядок при храме. Развёрнутый перевод сразу проясняет функцию.
- source_word: ὑπηρέταις
  choice: служителями
  rationale: Слово обозначает подчинённых должностных лиц, сопровождавших начальника. «Служители» естественно для храмового контекста и не вводит современное понятие полиции.
- source_word: ἤγαγεν αὐτούς
  choice: привёл апостолов
  rationale: ἄγω означает «вести, приводить». Уточнение «апостолов» естественно восстанавливает референт местоимения по контексту, не добавляя нового участника.
- source_word: οὐ μετὰ βίας
  choice: но без применения силы
  rationale: Передаёт отсутствие насильственного принуждения; «но» естественно выражает контраст с задержанием и сопровождением.
- source_word: ἐφοβοῦντο γὰρ τὸν λαόν
  choice: потому что они боялись народа
  rationale: Сохраняет причинную связь γάρ и несовершенный вид страха в данной ситуации.
- source_word: μὴ λιθασθῶσιν
  choice: как бы их не побили камнями
  rationale: Естественная русская конструкция после глагола боязни сохраняет значение опасаемого результата и пассивную направленность угрозы.
- source_word: τότε ἀπελθὼν
  choice: Тогда ... пошёл
  rationale: Причастие передано как последовательное повествовательное действие, что естественно по-русски и сохраняет временную связь.
