source:
  edition: SBLGNT
  text: μετὰ τοῦτον ἀνέστη Ἰούδας ὁ Γαλιλαῖος ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς καὶ ἀπέστησε ⸀λαὸν ὀπίσω αὐτοῦ· κἀκεῖνος ἀπώλετο καὶ πάντες ὅσοι ἐπείθοντο αὐτῷ διεσκορπίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/037.yaml
  text: After this[a], Judas the Galilean rose up in the days of the census and drew away people after him. He also perished[b], and all who were persuaded by him were scattered.
translation:
  language: ru
  text: После него поднялся Иуда Галилеянин во время переписи[a] и увёл за собой людей[b]. Он тоже погиб, и все, кого он убедил, рассеялись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во время регистрации». Греческое слово может обозначать перепись населения или официальную регистрацию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «побудил людей отложиться и последовать за ним». Глагол может подразумевать отход от прежней верности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ τοῦτον
  choice: После него
  rationale: Предлог μετά с винительным выражает временную последовательность; местоимение τοῦτον указывает на ранее названного человека, поэтому по-русски естественно «после него».
- source_word: ἀνέστη
  choice: поднялся
  rationale: В контексте появления предводителя означает «выступил, поднялся», а не воскресение. «Поднялся» сохраняет образность греческого глагола.
- source_word: Ἰούδας ὁ Γαλιλαῖος
  choice: Иуда Галилеянин
  rationale: Традиционная русская передача имени и естественное обозначение происхождения.
- source_word: ἐν ταῖς ἡμέραις τῆς ἀπογραφῆς
  choice: во время переписи
  rationale: ἀπογραφή означает официальную запись населения или перепись; «во время переписи» точно и естественно передаёт временное значение оборота.
- source_word: ἀπέστησε λαὸν ὀπίσω αὐτοῦ
  choice: увёл за собой людей
  rationale: Каузативная форма ἀφίστημι может означать, что Иуда отвратил людей от прежней верности и привлёк их на свою сторону. «Увёл за собой» сохраняет этот оттенок, не добавляя прямо не названного в тексте восстания.
- source_word: λαὸν
  choice: людей
  rationale: Существительное употреблено без артикля и имеет собирательное значение; перевод не подразумевает весь народ.
- source_word: κἀκεῖνος
  choice: Он тоже
  rationale: Передаёт соединение καί с указательным местоимением и сопоставляет участь Иуды с участью ранее названного человека.
- source_word: ἀπώλετο
  choice: погиб
  rationale: Глагол указывает на гибель, не уточняя её способ; «погиб» естественно сохраняет эту неопределённость.
- source_word: πάντες ὅσοι ἐπείθοντο αὐτῷ
  choice: все, кого он убедил
  rationale: πείθομαι с дательным обозначает тех, кто поддался его убеждению или доверился ему. Формулировка отличает это действие от предшествующего «увёл за собой».
- source_word: διεσκορπίσθησαν
  choice: рассеялись
  rationale: Точно и естественно передаёт аорист пассивного залога διασκορπίζω.
theological_decisions:
- issue: Историко-политическая характеристика движения Иуды
  choice: Иуда «увёл за собой людей»
  alternative: Иуда «поднял восстание» или «увлёк людей в мятеж»
  rationale: Хотя исторический контекст связан с сопротивлением власти, данный стих прямо не называет движение восстанием. Перевод сохраняет политически значимый оттенок отпадения, но не усиливает его сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Галилеянин» сохраняет традиционно-библейское достоинство, а остальные обороты понятны современному читателю. Сноски поставлены непосредственно при словах, к которым относятся.
