lexical_decisions:
- source_word: παραγενόμενος δέ τις
  choice: Но тут кто-то пришёл
  rationale: Причастная конструкция вводит прибытие неизвестного вестника перед основным глаголом; «тут» естественно передаёт развитие событий и лёгкий поворот, выраженный δέ.
- source_word: ἀπήγγειλεν αὐτοῖς
  choice: сообщил им
  rationale: Глагол обозначает передачу сведений; «сообщил» уместен в официальной обстановке и сохраняет местоименное указание адресатов.
- source_word: Ἰδοὺ
  choice: Смотрите!
  rationale: Побудительная частица привлекает внимание к неожиданной новости; современное «Смотрите!» передаёт её выразительность без архаизма.
- source_word: οἱ ἄνδρες
  choice: Люди
  rationale: В данном контексте речь идёт о ранее заключённых апостолах; «люди» звучит по-русски естественнее, чем формальное «мужи», и не меняет референцию.
- source_word: οὓς ἔθεσθε ἐν τῇ φυλακῇ
  choice: которых вы посадили в тюрьму
  rationale: Идиоматическое русское выражение точно передаёт помещение людей под стражу и сохраняет прямое обращение к властям.
- source_word: ἐν τῷ ἱερῷ
  choice: в храме
  rationale: ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище; традиционное и понятное «в храме» сохраняется, а пространственная точность поясняется в сноске.
- source_word: ἑστῶτες καὶ διδάσκοντες τὸν λαόν
  choice: стоят … и учат народ
  rationale: Переданы оба одновременных действия и буквальное значение ἑστῶτες; настоящее время подчёркивает происходящее в данный момент.
