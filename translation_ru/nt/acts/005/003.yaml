  text: εἶπεν δὲ ⸀ὁ Πέτρος· Ἁνανία, διὰ τί ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου, ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον καὶ ⸀νοσφίσασθαι ἀπὸ τῆς τιμῆς τοῦ χωρίου;
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/003.yaml
  text: But Peter said[a], “Ananias[d][c][b], why has Satan filled your heart to lie to the Holy Spirit and to keep back some of the price of the land?”
translation:
  language: ru
  text: 'Но Пётр сказал: «Анания, почему Сатана наполнил твоё сердце, чтобы ты солгал Святому Духу и утаил часть суммы, вырученной за участок?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «часть цены участка». «Участок» также можно перевести как «земля», «поле» или «владение».'
    reason: Греческое τιμή может означать цену или вырученные средства, а χωρίον — участок земли, поле либо владение.
lexical_decisions:
- source_word: εἶπεν δὲ ὁ Πέτρος
  choice: Но Пётр сказал
  rationale: δέ — мягкая связка, однако здесь «но» естественно передаёт переход к обличению Анании.
- source_word: ἐπλήρωσεν ὁ Σατανᾶς τὴν καρδίαν σου
  choice: сатана наполнил твоё сердце
  rationale: Сохранена метафора исходного текста и сатана оставлен грамматическим субъектом; перевод не добавляет идеи полного овладения человеком или непреодолимого принуждения.
- source_word: ψεύσασθαί σε τὸ πνεῦμα τὸ ἅγιον
  choice: чтобы ты солгал Святому Духу
  rationale: Конструкция с винительным падежом и инфинитивом передана естественным русским придаточным. «Солгал Святому Духу» прямо отражает личный объект глагола и не ослабляет выражение до безличного обмана.
- source_word: νοσφίσασθαι
  choice: утаил часть
  rationale: Глагол означает тайно удержать для себя часть чего-либо. «Утаил часть» передаёт одновременно удержание и обман, не вводя более узкого юридического понятия хищения.
- source_word: ἀπὸ τῆς τιμῆς τοῦ χωρίου
  choice: часть платы за землю
  rationale: ἀπό с родительным указывает на часть от целого; τιμή здесь — цена или полученная плата, а χωρίον — участок земли, поле либо владение. Формулировка близка к исходному тексту и понятна по-русски.
theological_decisions:
- issue: Действие сатаны и ответственность Анании
  choice: 'Сохранить буквальный образ: «сатана наполнил твоё сердце»'
  alternative: «ты позволил сатане овладеть тобой»
  rationale: Греческий текст называет сатану субъектом действия, но продолжает обращаться к Анании как к ответственному лицу. Перевод не разрешает это напряжение добавлением дозволения, одержимости или принуждения.
- issue: Ложь Святому Духу
  choice: «солгал Святому Духу»
  alternative: «пытался обмануть Святого Духа»
  rationale: Прямое выражение сохраняет личностную направленность действия и не добавляет идеи лишь неудавшейся попытки, которой в стихе нет.
- issue: Смысл инфинитивов после «наполнил твоё сердце»
  choice: Передать посредством «чтобы ты…»
  alternative: «так что ты…»
  rationale: Греческие инфинитивы допускают оттенки цели и результата. «Чтобы» сохраняет тесную зависимость последующих действий от глагола «наполнил», не поясняя сверх текста, было ли это целью или итогом.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой апостольской речи. Синтаксис остаётся прозрачным для обычного читателя; метафора сердца и резкость обличения сохранены без архаизации.
