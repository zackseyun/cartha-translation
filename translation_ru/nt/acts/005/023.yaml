lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: 'говоря: «'
  rationale: Причастие связывает донесение служителей с предшествующим повествованием и естественно вводит прямую речь.
- source_word: δεσμωτήριον
  choice: тюрьму
  rationale: Естественное современное обозначение места заключения в данном контексте.
- source_word: κεκλεισμένον ἐν πάσῃ ἀσφαλείᾳ
  choice: запертой самым надёжным образом
  rationale: Передаёт как состояние запертости, выраженное перфектным страдательным причастием, так и усиление ἐν πάσῃ ἀσφαλείᾳ.
- source_word: φύλακας ἑστῶτας
  choice: стражников — стоящими
  rationale: 'Сохраняет зрительную деталь исходного текста: стражники находились на месте и стояли у дверей.'
- source_word: ἐπὶ τῶν θυρῶν
  choice: у дверей
  rationale: Передаёт местонахождение стражников непосредственно возле дверей без излишнего уточнения.
- source_word: ἀνοίξαντες
  choice: открыв двери
  rationale: Аористное причастие естественно передаётся деепричастием; объект «двери» восполнен из непосредственно предшествующего выражения и устраняет неясность русского местоимения.
- source_word: ἔσω
  choice: внутри
  rationale: Кратко и естественно обозначает внутреннее пространство тюрьмы.
- source_word: οὐδένα
  choice: никого
  rationale: Точный и идиоматичный русский эквивалент отрицательного местоимения.
