  text: Ἐγένετο δὲ ὡς ὡρῶν τριῶν διάστημα καὶ ἡ γυνὴ αὐτοῦ μὴ εἰδυῖα τὸ γεγονὸς εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/005/007.yaml
  text: After an interval of about three hours, his wife came in, not knowing what had happened.
translation:
  language: ru
  text: Примерно через три часа вошла его жена, не зная о том, что произошло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: Примерно через
  rationale: Идиоматическая повествовательная связка вместе с последующим временным оборотом естественно передаётся переходом к следующему событию; отдельное «и случилось» было бы тяжеловесным, а δέ не требует самостоятельного слова.
- source_word: ὡς ὡρῶν τριῶν διάστημα
  choice: примерно через три часа
  rationale: ὡς при указании меры выражает приблизительность, а διάστημα обозначает промежуток времени. Русский оборот естественно передаёт истечение этого промежутка.
- source_word: ἡ γυνὴ αὐτοῦ
  choice: его жена
  rationale: По контексту γυνή обозначает супругу Анании, а не женщину вообще.
- source_word: μὴ εἰδυῖα
  choice: не зная
  rationale: Причастный оборот описывает состояние жены в момент её появления и сохраняется в русском естественной деепричастной конструкцией.
- source_word: τὸ γεγονὸς
  choice: о том, что произошло
  rationale: Субстантивированное причастие перфекта указывает на уже совершившееся событие; этот оборот передаёт его идиоматично и ясно.
- source_word: εἰσῆλθεν
  choice: вошла
  rationale: Глагол означает движение внутрь; «вошла» точно и естественно для русского повествования.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткое и естественное повествовательное предложение без архаичного «и было». Приблизительность временного указания сохранена.
