lexical_decisions:
- source_word: ἐγένετο φόβος μέγας ἐπί
  choice: великий страх охватил
  rationale: Сочетание ἐγένετο с φόβος и ἐπί описывает наступившее состояние; «страх охватил» естественно передаёт событие и направленность воздействия, не прибегая к буквальному «страх произошёл».
- source_word: φόβος μέγας
  choice: великий страх
  rationale: После суда над Ананией и Сапфирой φόβος означает прежде всего сильный страх, а μέγας прямо передан прилагательным «великий» в достоинственном библейском регистре.
- source_word: ἐφ’ ὅλην τὴν ἐκκλησίαν
  choice: всю церковь
  rationale: ἐκκλησία здесь обозначает всё сообщество верующих. «Всю» сохраняет полноту ὅλην, а значение предлога ἐπί выражено русским глаголом «охватил».
- source_word: πάντας τοὺς ἀκούοντας ταῦτα
  choice: всех, кто услышал об этом
  rationale: Субстантивированное причастие естественно передано придаточным «кто услышал». В данном контексте русское «об этом» идиоматично обозначает известие о совокупности происшедших событий, хотя греческое ταῦτα формально имеет множественное число.
theological_decisions:
- issue: Передача ἐκκλησία
  choice: церковь
  alternative: собрание; община
  rationale: В Деяниях слово обозначает сообщество верующих; «церковь» — стандартный и понятный русский эквивалент. Сноска сохраняет возможные лексические оттенки, не навязывая дополнительной экклезиологии.
translation_notes:
  register: Современный литературный русский язык с достоинственным библейским звучанием. Порядок двух охваченных страхом групп сохранён; повтор предлога из греческого не воспроизводится, поскольку управление глагола «охватил» делает русскую фразу естественной и ясной.
