  text: ὅτε δὲ ἐγένετο ⸂ἐξαρτίσαι ἡμᾶς⸃ τὰς ἡμέρας, ἐξελθόντες ἐπορευόμεθα προπεμπόντων ἡμᾶς πάντων σὺν γυναιξὶ καὶ τέκνοις ἕως ἔξω τῆς πόλεως, καὶ θέντες τὰ γόνατα ἐπὶ τὸν αἰγιαλὸν ⸀προσευξάμενοι
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/005.yaml
  text: When it came time for us to complete those days[a], we departed and went on our way, while they all, with wives and children, were accompanying us as far as outside the city. And after kneeling down on the beach[b], we prayed.
translation:
  language: ru
  text: Когда эти дни закончились, мы вышли и продолжили путь, а все они — с жёнами и детьми — провожали[a] нас за город. На берегу[b] мы преклонили колени и помолились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сопровождали». Греческий глагол может обозначать сопровождение отъезжающего человека при проводах.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на прибрежной полосе» или «на пляже».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐξαρτίσαι ἡμᾶς τὰς ἡμέρας
  choice: нам пришло время завершить эти дни
  rationale: Оборот с ἐγένετο и инфинитивом передаёт наступление времени для действия, а ἐξαρτίζω — завершение определённого периода. Формулировка сохраняет указание на конкретные «эти дни», не добавляя отсутствующего в тексте пояснения о сроке пребывания.
- source_word: ἐξελθόντες ἐπορευόμεθα
  choice: мы вышли и отправились в путь
  rationale: 'Перевод передаёт оба последовательных элемента: выход и последующее продолжение пути; несовершенный вид ἐπορευόμεθα естественно выражен русским оборотом «отправились в путь».'
- source_word: προπεμπόντων ἡμᾶς πάντων
  choice: Все они ... провожали нас
  rationale: προπέμπω обозначает сопровождение отъезжающих как часть прощания. «Провожали» естественно передаёт это значение по-русски, а возможный оттенок простого сопровождения отмечен в сноске.
- source_word: σὺν γυναιξὶ καὶ τέκνοις
  choice: вместе с жёнами и детьми
  rationale: При πάντων мужского рода множественного числа и в контексте целых семей γυναιξὶ естественнее понимать как «жёнами», а не просто «женщинами».
- source_word: ἕως ἔξω τῆς πόλεως
  choice: за город
  rationale: Краткий современный русский оборот передаёт движение до точки вне городской черты без тяжеловесного буквализма «до места вне города».
- source_word: θέντες τὰ γόνατα
  choice: преклонили колени
  rationale: Устойчивое и достойное русское выражение естественно передаёт греческую идиому «положив колени», то есть встав на колени.
- source_word: ἐπὶ τὸν αἰγιαλόν
  choice: на берегу
  rationale: αἰγιαλός означает берег, прибрежную полосу или пляж. «На берегу» точно и стилистически нейтрально; более узкое «на пляже» может вызвать современную рекреационную ассоциацию.
- source_word: προσευξάμενοι
  choice: помолились
  rationale: Аористное причастие естественно передано личной формой, завершающей последовательность действий; первое лицо сохраняет повествование от лица участников путешествия.
