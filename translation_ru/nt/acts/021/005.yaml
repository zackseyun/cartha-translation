translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. «Преклонили колени» сохраняет достоинство сцены, а «за город» избегает неестественного буквального синтаксиса. Все сноски поставлены непосредственно при соответствующих словах.
