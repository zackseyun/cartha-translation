  text: εἶπεν δὲ ὁ Παῦλος· Ἐγὼ ἄνθρωπος μέν εἰμι Ἰουδαῖος, Ταρσεὺς τῆς Κιλικίας, οὐκ ἀσήμου πόλεως πολίτης· δέομαι δέ σου, ἐπίτρεψόν μοι λαλῆσαι πρὸς τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/039.yaml
  text: But Paul said[a], “I am indeed a Jewish man, a citizen of Tarsus in Cilicia, of no insignificant city. And I beg you, permit me to speak to the people.”
translation:
  language: ru
  text: 'Но Павел сказал: «Я — иудей, из Тарса в Киликии, гражданин небезызвестного города. Прошу тебя, позволь мне обратиться к народу».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωπος μέν εἰμι Ἰουδαῖος
  choice: Я иудей
  rationale: Естественная русская самохарактеристика, сохраняющая этнорелигиозный смысл Ἰουδαῖος. Слово ἄνθρωπος отдельно не передано, поскольку выражение «я человек-иудей» в современном русском неестественно; μέν здесь придаёт утверждению оттенок акцента, который достаточно выражен порядком и контекстом.
- source_word: Ταρσεὺς τῆς Κιλικίας
  choice: родом из Тарса в Киликии
  rationale: Передаёт происхождение Павла естественным современным русским языком, не смешивая Ταρσεύς с последующим отдельным указанием на гражданство.
- source_word: οὐκ ἀσήμου πόλεως
  choice: города небезызвестного
  rationale: Сохраняет греческую литоту «не безвестного / не незначительного», не заменяя её прямым утверждением «знаменитого» или «важного».
- source_word: πολίτης
  choice: гражданин
  rationale: Передаёт именно гражданскую принадлежность, значимую в обращении Павла к римскому военному начальнику.
- source_word: δέομαι δέ σου
  choice: Прошу тебя
  rationale: Выражает настойчивую почтительную просьбу, но звучит естественнее по-русски, чем более эмоциональное «умоляю тебя» в данном официальном разговоре.
- source_word: ἐπίτρεψόν μοι λαλῆσαι
  choice: позволь мне обратиться
  rationale: «Обратиться» естественно передаёт намерение выступить перед собравшимися; глагол «позволь» соответствует просьбе о разрешении.
- source_word: πρὸς τὸν λαόν
  choice: к народу
  rationale: Сохраняет λαός как «народ», не сужая значение до непосредственной «толпы», хотя толпа имеется в виду в повествовательном контексте.
theological_decisions:
- issue: Значение Ἰουδαῖος в самоназвании Павла
  choice: иудей
  alternative: уроженец Иудеи / иудеянин
  rationale: Павел отдельно называет Тарс в Киликии местом своего происхождения, поэтому здесь Ἰουδαῖος обозначает его этнорелигиозную принадлежность, а не происхождение из области Иудеи.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной речи. Сохранена литота оригинала; синтаксис слегка перестроен ради естественности без устранения смысловых различий между происхождением и гражданством.
