base_translation:
  language: en
  yaml_path: translation/nt/acts/021/029.yaml
  text: For they had previously seen Trophimus the Ephesian in the city with him[a], and they supposed that Paul had brought him into the temple.
translation:
  language: ru
  text: Ведь раньше они видели в городе эфесянина Трофима вместе с Павлом и полагали, что Павел ввёл его на храмовую территорию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово здесь обозначает храмовый комплекс или его священную территорию, а не обязательно внутреннее святилище.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν … προεωρακότες
  choice: прежде они видели
  rationale: Перифрастическая конструкция передаёт действие, предшествовавшее описываемым событиям; «прежде они видели» естественно выражает эту временную соотнесённость по-русски.
- source_word: Τρόφιμον τὸν Ἐφέσιον
  choice: эфесянина Трофима
  rationale: Субстантивированное обозначение происхождения естественно передаётся русским «эфесянин»; порядок слов сохраняет ясность и литературность.
- source_word: ἐν τῇ πόλει
  choice: в городе
  rationale: Стандартная передача πόλις; здесь имеется в виду город Иерусалим в отличие от храмовой территории.
- source_word: σὺν αὐτῷ
  choice: вместе с ним
  rationale: Прямо передаёт совместность; местоимение в контексте относится к Павлу.
- source_word: ἐνόμιζον
  choice: решили
  rationale: В данном контексте глагол обозначает вывод или предположение на основании увиденного, а не достоверное знание. Русское «решили, что» естественно передаёт такой ошибочный вывод.
- source_word: εἰς τὸ ἱερόν
  choice: на территорию храма
  rationale: ἱερόν обозначает весь храмовый комплекс или его священную территорию, а не только внутреннее святилище; такая передача точнее исторически и естественна по-русски.
- source_word: εἰσήγαγεν
  choice: ввёл
  rationale: Глагол выражает введение человека внутрь определённой территории; форма прошедшего времени после «решили, что» естественно обозначает предполагаемое предшествующее действие.
theological_decisions:
- issue: Значение ἱερόν в обвинении против Павла
  choice: на территорию храма
  alternative: в храм / во дворы храма
  rationale: Термин относится к храмовому комплексу, а не специально к внутреннему святилищу (ναός). Перевод сохраняет исторически важную широту значения и не утверждает, будто Трофима обвиняли во входе именно во внутреннее святилище.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. «Ведь» сохраняет пояснительную функцию γάρ. Формулировка «решили, что» подчёркивает вывод обвинителей, не представляя его как установленный факт.
