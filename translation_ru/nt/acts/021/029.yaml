  to: Ведь раньше они видели в городе эфесянина Трофима вместе с Павлом и полагали, что Павел ввёл его на храмовую территорию.[a]
  rationale: Заменено «решили» на «полагали» для точной передачи ἐνόμιζον как предположения. Павел назван при обороте «вместе с Павлом», чтобы снять синтаксическую неясность. Сноска сохранена и привязана к «храмовой территории», поскольку она передаёт существенную широту ἱερόν.
