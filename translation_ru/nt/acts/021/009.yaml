lexical_decisions:
- source_word: τούτῳ
  choice: у него
  rationale: Дательный падеж οὗτος отсылает к Филиппу в ближайшем контексте; вместе с ἦσαν естественно передаётся русской конструкцией обладания «у него были».
- source_word: δὲ
  choice: —
  rationale: Здесь δέ служит слабой продолжительной связкой; в естественном русском отдельного соответствия не требует.
- source_word: ἦσαν
  choice: были
  rationale: 'В сочетании с τούτῳ образует конструкцию обладания: «у него были».'
- source_word: θυγατέρες
  choice: дочери
  rationale: Прямое и естественное обозначение родства.
- source_word: τέσσαρες
  choice: четыре
  rationale: Количественное числительное непосредственно определяет слово «дочери».
- source_word: παρθένοι
  choice: незамужние
  rationale: В данном повествовательном контексте слово указывает на женщин, не состоявших в браке; более буквальное «девственницы» сохранено в сноске, чтобы не скрывать точный лексический смысл.
- source_word: προφητεύουσαι
  choice: которые пророчествовали
  rationale: Причастие настоящего времени женского рода множественного числа характеризует дочерей по их продолжающейся или обычной деятельности.
theological_decisions:
- issue: Передача παρθένοι применительно к женщинам, обладавшим пророческим даром
  choice: незамужние
  alternative: девственницы
  rationale: Основной текст естественно сообщает их общественно-семейное положение, не устанавливая богословской связи между ним и пророчествованием. Более буквальное значение вынесено в сноску, чтобы сохранить смысловую напряжённость и проверяемость перевода.
translation_notes:
  register: Современный литературный русский язык; простая, ясная и достойная повествовательная формулировка. Маркер сноски поставлен после всего предложения, к которому относится лексическое уточнение.
