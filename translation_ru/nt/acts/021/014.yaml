  text: μὴ πειθομένου δὲ αὐτοῦ ἡσυχάσαμεν εἰπόντες· ⸂Τοῦ κυρίου τὸ θέλημα⸃ ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/014.yaml
  text: And since he would not be persuaded[a], we became quiet, saying, “The Lord’s will be done.”
translation:
  language: ru
  text: 'Поскольку он не поддавался уговорам, мы умолкли и сказали: «Да исполнится воля Господа».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πειθομένου δὲ αὐτοῦ
  choice: Но так как он не поддавался уговорам
  rationale: Генитив абсолютный передаёт обстоятельство и причину прекращения уговоров. Оборот «не поддавался уговорам» естественно выражает в контексте то, что Павел не позволил убедить себя, не сводя смысл к более толковательному «не слушал».
- source_word: ἡσυχάσαμεν
  choice: мы умолкли
  rationale: Здесь глагол означает, что спутники прекратили настаивать и замолчали. Совершенный вид естественно передаёт результативное значение аориста.
- source_word: εἰπόντες
  choice: сказав
  rationale: Деепричастие сохраняет связь греческого аористического причастия с главным глаголом и ясно вводит последующие слова.
- source_word: Τοῦ κυρίου
  choice: Господа
  rationale: «Господь» — естественный и традиционно понятный эквивалент κύριος; перевод не уточняет референта сверх того, что выражено в греческом тексте.
- source_word: τὸ θέλημα
  choice: воля
  rationale: «Воля» точно и естественно передаёт θέλημα в формуле покорности намерению Господа.
- source_word: γινέσθω
  choice: Да исполнится
  rationale: Форма с «да» естественно передаёт повелительное наклонение третьего лица и выражает согласие с осуществлением воли Господа. «Исполнится» сохраняет библейскую торжественность без ненужной архаики.
theological_decisions:
- issue: Передача κύριος
  choice: Господь
  alternative: Владыка
  rationale: В данном контексте «Господь» является наиболее естественным эквивалентом. Вероятным референтом в повествовании служит Иисус, однако перевод не делает этого явным, сохраняя степень определённости оригинала.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и слегка возвышенным звучанием прямой речи. Формулировка понятна широкому читателю и сохраняет молитвенно-библейский характер заключительных слов.
