id: ACT.21.7
reference: Acts 21:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: Ἡμεῖς δὲ τὸν πλοῦν διανύσαντες ἀπὸ Τύρου κατηντήσαμεν εἰς Πτολεμαΐδα, καὶ ἀσπασάμενοι τοὺς ἀδελφοὺς ἐμείναμεν ἡμέραν μίαν παρ’ αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/007.yaml
  text: We[a], having finished the voyage from Tyre, arrived at Ptolemais, and after greeting the brothers, we stayed with them one day.
translation:
  language: ru
  text: Завершив плавание из Тира, мы прибыли в Птолемаиду, приветствовали братьев[a] и пробыли у них один день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «братьев и сестёр»; греческое слово буквально означает «братьев», но может шире обозначать единоверцев.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡμεῖς δὲ
  choice: мы
  rationale: Явное местоимение обозначает участников повествования, а δέ служит переходом к следующему событию. В русском естественный порядок слов и продолжение рассказа позволяют не передавать δέ отдельным союзом.
- source_word: τὸν πλοῦν διανύσαντες
  choice: завершив плавание
  rationale: διανύω указывает на завершение пути, а πλοῦς — на путешествие морем. Деепричастный оборот сохраняет последовательность действий и звучит естественно.
- source_word: ἀπὸ Τύρου
  choice: из Тира
  rationale: ἀπό обозначает исходный пункт движения; с названием города по-русски естественно «из Тира».
- source_word: κατηντήσαμεν εἰς Πτολεμαΐδα
  choice: прибыли в Птолемаиду
  rationale: В контексте путешествия καταντάω означает достижение места назначения, а εἰς указывает направление.
- source_word: ἀσπασάμενοι
  choice: приветствовали
  rationale: ἀσπάζομαι означает приветствовать. Однородный глагол точнее и естественнее передаёт последовательность событий после прибытия.
- source_word: τοὺς ἀδελφοὺς
  choice: братьев
  rationale: Греческое существительное стоит в мужском роде множественного числа и в христианской среде может обозначать собратьев по вере, включая общину в целом. Основной текст сохраняет форму оригинала, а возможный широкий охват поясняется в сноске.
- source_word: ἐμείναμεν ἡμέραν μίαν
  choice: пробыли один день
  rationale: μένω означает оставаться или пребывать, а винительный ἡμέραν μίαν выражает продолжительность. «Пробыли один день» естественно для повествования о путешествии.
- source_word: παρ’ αὐτοῖς
  choice: у них
  rationale: παρά с дательным здесь указывает на пребывание у этих людей, вероятно в их среде или доме; русское «у них» сохраняет эту намеренную неопределённость.
theological_decisions:
- issue: Передача ἀδελφοὺς применительно к христианской общине
  choice: братьев
  alternative: братьев и сестёр; единоверцев
  rationale: Форма оригинала — мужское множественное число, но по контексту она может охватывать всех членов местной общины. Перевод сохраняет формальную гендерную характеристику слова и отмечает более широкий возможный смысл в сноске, не сужая и не расширяя его без пояснения.
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный стиль. Географические названия переданы в традиционной русской форме. Синтаксис упрощён до естественной цепочки действий без потери временной последовательности греческих причастий.
