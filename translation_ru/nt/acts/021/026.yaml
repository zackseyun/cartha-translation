  naturalness: «Территория храма» понятно, но «храмовый комплекс» естественнее и точнее для ἱερόν. Объединение фразы в одно предложение с деепричастным оборотом и тире делает русский синтаксис ясным и литературным.
  terminology: «Очищение» и «приношение» подходят для ритуального контекста и не навязывают богословских выводов. Для προσφορά допустимо также «жертва», но основное «приношение» сохраняет широту греческого слова.
