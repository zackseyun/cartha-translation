  to: Тогда Павел взял с собой этих людей и на следующий день, совершив очищение вместе с ними, вошёл в храмовый комплекс[a], объявляя о завершении дней очищения — до тех пор, пока за каждого из них не будет принесено приношение[b].
  rationale: Исправление восстанавливает формальную временную связь исходного текста, заменяет менее естественное «территория храма» на точное «храмовый комплекс» и уточняет неудачный вариант в сноске. Совершенный вид «вошёл» оставлен как естественное русское повествовательное соответствие греческому имперфекту в данном контексте; аспектуальная оттеночность не должна создавать в русском впечатление незавершённого действия.
