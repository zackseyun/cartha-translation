source:
  edition: SBLGNT
  text: τότε ὁ Παῦλος παραλαβὼν τοὺς ἄνδρας τῇ ἐχομένῃ ἡμέρᾳ σὺν αὐτοῖς ἁγνισθεὶς εἰσῄει εἰς τὸ ἱερόν, διαγγέλλων τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ ἕως οὗ προσηνέχθη ὑπὲρ ἑνὸς ἑκάστου αὐτῶν ἡ προσφορά.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/026.yaml
  text: Then Paul took the men[a], and on the next day, having purified himself with them, he entered the temple, giving notice of the completion of the days of purification[b], until the offering was presented for each one of them.
translation:
  language: ru
  text: Тогда Павел взял с собой этих людей и на следующий день, совершив очищение вместе с ними, вошёл в храмовый комплекс[a], объявляя о завершении дней очищения — до тех пор, пока за каждого из них не будет принесено приношение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в храм»; греческое ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет принесена жертва». Греческое слово обозначает культовое приношение в широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαβὼν τοὺς ἄνδρας
  choice: взял с собой этих людей
  rationale: Причастие передаёт сопровождение; «взял с собой» естественно выражает, что Павел повёл упомянутых мужчин вместе с собой. «Этих людей» в современном русском звучит естественнее, чем формальное «мужей».
- source_word: τῇ ἐχομένῃ ἡμέρᾳ
  choice: на следующий день
  rationale: Обычное современное обозначение непосредственно следующего дня.
- source_word: σὺν αὐτοῖς ἁγνισθεὶς
  choice: совершив вместе с ними очищение
  rationale: Контекст указывает на обрядовое очищение. Такая формулировка сохраняет участие Павла в процедуре, не вынуждая выбирать между строго возвратным и пассивным пониманием формы ἁγνισθείς.
- source_word: εἰσῄει
  choice: вошёл
  rationale: Хотя имперфект может обозначать развёрнутое или повторявшееся действие, в данном повествовательном контексте русское «входил» звучало бы незавершённо и могло бы создать ложное впечатление, что Павел так и не вошёл. Совершенный вид естественно передаёт событие.
- source_word: τὸ ἱερόν
  choice: территорию храма
  rationale: ἱερόν обозначает весь храмовый комплекс, а не собственно внутреннее святилище (ναός). Выбор делает это различие явным и остаётся понятным современному читателю.
- source_word: διαγγέλλων
  choice: уведомил
  rationale: Глагол указывает на официальное сообщение в процедурном храмовом контексте. Отдельное сказуемое обеспечивает естественный русский синтаксис.
- source_word: τὴν ἐκπλήρωσιν τῶν ἡμερῶν τοῦ ἁγνισμοῦ
  choice: когда завершатся дни очищения
  rationale: Передаёт достижение установленного срока очищения без тяжеловесного буквального оборота «завершение дней».
- source_word: ἕως οὗ προσηνέχθη
  choice: и … будет принесено
  rationale: В контексте уведомления конструкция указывает на срок, завершающийся принесением приношения. Будущее относительно момента повествования естественно выражено формой «будет принесено»; связь с окончанием срока передана общей конструкцией предложения.
- source_word: ὑπὲρ ἑνὸς ἑκάστου αὐτῶν
  choice: за каждого из них
  rationale: Кратко и точно передаёт совершение приношения в отношении каждого участника.
- source_word: ἡ προσφορά
  choice: приношение
  rationale: Общий культовый термин, не сужающий значение до конкретного вида жертвы.
theological_decisions:
- issue: Характер участия Павла в храмовом обряде очищения
  choice: Передать участие Павла прямо, без богословской оценки.
  alternative: Добавить формулировку, подразумевающую одобрение либо отрицание обязательности храмовых обрядов для христиан.
  rationale: Стих повествует о поступке Павла, но сам по себе не разрешает более широкий вопрос о действии закона и храмовых установлений.
- issue: Залог ἁγνισθείς
  choice: «совершив … очищение»
  alternative: «очистив себя» или «будучи очищен»
  rationale: Греческая форма морфологически допускает пассивное значение, тогда как контекст допускает участие в обрядовой процедуре. Нейтральная русская формулировка не устраняет эту напряжённость искусственным выбором.
- issue: Временное отношение ἕως οὗ к завершению очищения и приношению
  choice: Представить уведомление как указание срока завершения очищения и последующего принесения приношения.
  alternative: 'Буквально: «уведомляя о завершении дней очищения, пока не было принесено приношение».'
  rationale: Буквальный порядок в русском синтаксически неясен. Выбранная формулировка передаёт процедурную последовательность, не уточняя сверх текста, кто приносит приношение.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного стиля. Избегаются архаизмы «мужи», «на другой день» и тяжеловесная калька «исполнение дней». Смысл храмовой процедуры выражен ясно, без конфессиональных пояснений.
