source:
  edition: SBLGNT
  text: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα ἀσμένως ⸀ἀπεδέξαντο ἡμᾶς οἱ ἀδελφοί.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/017.yaml
  text: When we arrived in Jerusalem[a], the brothers welcomed us gladly.
translation:
  language: ru
  text: Когда мы прибыли в Иерусалим, братья[a] с радостью приняли нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «братья и сёстры»; по-гречески буквально «братья», но это слово может обозначать единоверцев в целом.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένων δὲ ἡμῶν εἰς Ἱεροσόλυμα
  choice: Когда мы прибыли в Иерусалим
  rationale: Генитив абсолютный обозначает обстоятельство времени, а εἰς — направление движения. По-русски естественно передать это конструкцией «когда мы прибыли в Иерусалим».
- source_word: ἀσμένως
  choice: с радостью
  rationale: Наречие выражает радость и готовность принимающих; «с радостью» точно и естественно передаёт этот смысл.
- source_word: ἀπεδέξαντο
  choice: приняли
  rationale: В данном контексте глагол означает радушно принять прибывших. Сочетание «с радостью приняли» ясно выражает гостеприимный характер встречи.
- source_word: οἱ ἀδελφοί
  choice: братья
  rationale: Сохраняется мужская форма греческого существительного; при этом в раннехристианском употреблении оно могло обозначать более широкий круг единоверцев, что отмечено в сноске.
theological_decisions:
- issue: Гендерный охват οἱ ἀδελφοί применительно к иерусалимской общине
  choice: братья
  alternative: братья и сёстры; верующие
  rationale: Основной текст сохраняет грамматическую форму и родственный образ оригинала, не исключая возможности того, что выражение охватывает всю общину; эта возможность указана в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, естественная и достойная повествовательная формулировка. Союз δέ отдельно не выражен, поскольку здесь он служит мягкому продолжению рассказа, которое русский контекст обычно передаёт без явного союза.
