source:
  edition: SBLGNT
  text: τούτους παραλαβὼν ἁγνίσθητι σὺν αὐτοῖς καὶ δαπάνησον ἐπ’ αὐτοῖς ἵνα ⸀ξυρήσονται τὴν κεφαλήν, καὶ ⸀γνώσονται πάντες ὅτι ὧν κατήχηνται περὶ σοῦ οὐδέν ἐστιν, ἀλλὰ στοιχεῖς καὶ αὐτὸς ⸂φυλάσσων τὸν νόμον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/024.yaml
  text: Take these men[a], purify yourself along with them, and pay their expenses so that they may shave their heads. Then everyone will know that there is nothing to the things they have been told about you[b], but that you yourself also are living in observance of the law.
translation:
  language: ru
  text: Возьми этих людей с собой, очистись вместе с ними и оплати их расходы, чтобы они обрили головы. Тогда все узнают, что в том, что им рассказывали о тебе[a], нет правды и что ты и сам живёшь, соблюдая Закон[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в чём их наставляли относительно тебя». Греческий глагол может означать «наставлять» или, шире, «сообщать, осведомлять»; здесь речь идёт о распространявшихся сведениях о Павле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «идёшь в установленном порядке, соблюдая Закон», то есть живёшь в соответствии с ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τούτους παραλαβὼν
  choice: Возьми этих людей с собой
  rationale: Причастие παραλαβών при повелительном ἁγνίσθητι естественно передаётся однородным побуждением. «Людей» уточняет подразумеваемых четырёх мужчин из предыдущего стиха, а «с собой» выражает сопровождающий оттенок παραλαμβάνω.
- source_word: ἁγνίσθητι σὺν αὐτοῖς
  choice: очистись вместе с ними
  rationale: Речь идёт об обрядовом очищении. Возвратная форма естественна по-русски и передаёт смысл греческого повеления без излишнего пояснения.
- source_word: δαπάνησον ἐπ’ αὐτοῖς
  choice: оплати их расходы
  rationale: Сочетание означает понести расходы за этих людей, вероятно связанные с обетом; выбранная формулировка ясна и естественна.
- source_word: ἵνα ξυρήσονται τὴν κεφαλήν
  choice: чтобы они могли обрить головы
  rationale: Оборот с ἵνα выражает цель или предполагаемый результат. Единственное число «голову» в греческом имеет распределительное значение, тогда как по-русски естественно множественное «головы».
- source_word: γνώσονται πάντες
  choice: Тогда все узнают
  rationale: «Тогда» естественно показывает ожидаемое следствие предпринятых действий.
- source_word: ὧν κατήχηνται περὶ σοῦ
  choice: в том, что им рассказывали о тебе
  rationale: κατηχέω может означать как наставлять, так и сообщать. В контексте распространявшихся сведений о Павле «рассказывали» сохраняет общий смысл, не предполагая формального наставления.
- source_word: οὐδέν ἐστιν
  choice: нет правды
  rationale: Идиоматически передаёт утверждение, что распространявшиеся сообщения не соответствуют действительности, не уточняя сверх текста конкретную степень их необоснованности.
- source_word: ἀλλὰ στοιχεῖς καὶ αὐτὸς φυλάσσων τὸν νόμον
  choice: и что ты и сам живёшь, соблюдая Закон
  rationale: στοιχέω обозначает упорядоченную жизнь или следование определённой норме, а φυλάσσω — соблюдение. Формулировка сохраняет оба смысловых компонента и эмфазу καὶ αὐτός.
- source_word: νόμον
  choice: Закон
  rationale: В контексте имеется в виду иудейский Закон. Написание с прописной буквы указывает на конкретный религиозный Закон, не добавляя отсутствующего в греческом определения «Моисеев».
theological_decisions:
- issue: Характер отношения Павла к Закону в этом повествовании
  choice: ты и сам живёшь, соблюдая Закон
  alternative: ты и сам держишься установленного порядка и соблюдаешь Закон
  rationale: Перевод передаёт вывод, который окружающие должны сделать из видимого поведения Павла. Он не превращает повествовательное утверждение в исчерпывающее богословское объяснение отношения Павла к Закону и сохраняет напряжение с другими местами.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет последовательность побуждений и ожидаемого результата. Термин «Закон» оставлен без конфессионального или богословского уточнения.
