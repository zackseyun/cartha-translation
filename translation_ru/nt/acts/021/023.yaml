base_translation:
  language: en
  yaml_path: translation/nt/acts/021/023.yaml
  text: 'Therefore do what we tell you: we have four men who are under a vow of their own[a][b].'
translation:
  language: ru
  text: 'Итак, сделай то, что мы тебе говорим: у нас есть четверо мужчин, на которых лежит обет[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имеющих обет на себе». Возможный перевод: «давших обет».'
    reason: lexical_alternative
  - marker: b
    text: Из дальнейшего контекста можно предположить обет назорейского типа, однако в самом этом стихе сказано только «обет».
    reason: cultural_note
lexical_decisions:
- source_word: τοῦτο οὖν
  choice: Итак
  rationale: οὖν вводит вывод из предшествующего; русское «итак» естественно передаёт логический переход, а τοῦτο раскрывается последующим «то, что».
- source_word: ποίησον ὅ σοι λέγομεν
  choice: сделай то, что мы тебе скажем
  rationale: Аористный императив передан прямым повелением «сделай». В данном контексте настоящее λέγομεν естественно по-русски выражается будущим «скажем», поскольку далее непосредственно следует содержание совета.
- source_word: εἰσὶν ἡμῖν
  choice: у нас есть
  rationale: Экзистенциальная конструкция с дательным ἡμῖν идиоматично передаётся русской конструкцией принадлежности «у нас есть».
- source_word: ἄνδρες τέσσαρες
  choice: четверо мужчин
  rationale: Собирательное числительное «четверо» с обозначением лиц мужского пола звучит естественно и точно передаёт ἄνδρες τέσσαρες.
- source_word: εὐχὴν ἔχοντες
  choice: давших обет
  rationale: Греческое выражение буквально означает «имеющих обет». Русское «давших обет» идиоматично обозначает сохраняющее силу обязательство, не уточняя его вид.
- source_word: ἀφ’ ἑαυτῶν
  choice: давших обет (самим связавших себя им)
  rationale: Оборот указывает на обет, лежащий на самих этих мужчинах. В основном тексте это естественно выражено конструкцией «давших обет»; буквальный оттенок разъяснён в сноске.
theological_decisions:
- issue: Характер обета
  choice: обет
  alternative: обет назорея
  rationale: Хотя дальнейший контекст может указывать на обет назорейского типа, сам стих употребляет только общее слово εὐχή и не называет обет назорейским.
- issue: Значение ἀφ’ ἑαυτῶν
  choice: не уточнять, что обет был принят исключительно по собственной инициативе
  alternative: собственный обет / добровольно данный обет
  rationale: Фраза может подчёркивать, что обет лежит на самих мужчинах, но не обязательно их независимую инициативу; перевод не должен искусственно снимать эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; прямой и достойный повествовательный стиль. «Давших обет» предпочтено более буквальному, но неестественному «имеющих на себе обет»; смысловая граница исходного текста сохранена с помощью сносок.
