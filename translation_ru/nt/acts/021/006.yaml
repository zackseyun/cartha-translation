base_translation:
  language: en
  yaml_path: translation/nt/acts/021/006.yaml
  text: After we had said farewell to one another[a], we boarded the ship[b], and they returned to their own homes.
translation:
  language: ru
  text: Попрощавшись друг с другом[a], мы поднялись на корабль, а они вернулись домой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простившись друг с другом». Греческое выражение может означать как приветствие, так и прощание; здесь контекст отъезда указывает на прощание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к своему» (греч. множественное число), то есть домой или в своё место.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπησπασάμεθα ἀλλήλους
  choice: попрощавшись друг с другом
  rationale: В форме среднего залога с взаимным местоимением выражение может обозначать приветствие или прощание; контекст отъезда ясно указывает на прощание. Деепричастие естественно передаёт предшествующее действие аориста.
- source_word: ἐνέβημεν
  choice: мы взошли
  rationale: Глагол означает войти или подняться на борт; сочетание «взошли на корабль» звучит естественно и сохраняет образ движения на судно.
- source_word: πλοῖον
  choice: корабль
  rationale: Слово может обозначать лодку или корабль; в повествовании о морском путешествии уместно традиционное «корабль».
- source_word: ὑπέστρεψαν
  choice: они вернулись
  rationale: Прямо передаёт простое повествовательное значение глагола — возвращение.
- source_word: εἰς τὰ ἴδια
  choice: домой
  rationale: Субстантивированное выражение буквально указывает на «своё», то есть собственное место или дом; русское «домой» кратко и идиоматично выражает смысл в данном контексте.
