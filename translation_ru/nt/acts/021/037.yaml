  text: Μέλλων τε εἰσάγεσθαι εἰς τὴν παρεμβολὴν ὁ Παῦλος λέγει τῷ χιλιάρχῳ· Εἰ ἔξεστίν μοι εἰπεῖν ⸀τι πρὸς σέ; ὁ δὲ ἔφη· Ἑλληνιστὶ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/037.yaml
  text: As Paul was about to be brought into the barracks[a], he said to the tribune, “Is it permitted for me to say something to you?” And he said[c][b], “Do you know Greek?”
translation:
  language: ru
  text: 'Когда Павла уже собирались ввести в казармы[a], он сказал тысяченачальнику[b]: «Можно мне кое-что сказать тебе?» Тот спросил: «Ты знаешь греческий?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть в помещения римского гарнизона, вероятно находившиеся в крепости Антония.
    reason: cultural_note
  - marker: b
    text: 'Римский военный офицер; традиционно этот титул передают словом «тысяченачальник», также возможно: «военачальник» или «трибун».'
    reason: cultural_note
lexical_decisions:
- source_word: Μέλλων τε εἰσάγεσθαι
  choice: когда Павла уже собирались ввести
  rationale: Передаёт близость предстоящего действия и сохраняет пассивный смысл греческого инфинитива; временная конструкция естественна по-русски.
- source_word: παρεμβολή
  choice: казармы
  rationale: В данном иерусалимском контексте речь идёт о помещении римского гарнизона в крепостном комплексе, а не о походном лагере.
- source_word: χιλίαρχος
  choice: тысяченачальник
  rationale: Традиционный и достаточно точный русский эквивалент названия римского военного начальника; историческое значение пояснено в сноске.
- source_word: Εἰ ἔξεστίν μοι εἰπεῖν τι πρὸς σέ
  choice: Можно мне кое-что сказать тебе?
  rationale: Естественно передаёт вежливую просьбу о разрешении, не превращая ἔξεστιν в утверждение о законности.
- source_word: τι
  choice: кое-что
  rationale: В контексте просьбы естественно передаёт неопределённое «что-то, нечто».
- source_word: Ἑλληνιστί γινώσκεις
  choice: Ты знаешь греческий?
  rationale: Близко к лексической форме оригинала и естественно обозначает знание языка; возможные оттенки понимания и владения речью остаются открытыми.
