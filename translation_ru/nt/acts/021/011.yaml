id: ACT.21.11
reference: Acts 21:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν πρὸς ἡμᾶς καὶ ἄρας τὴν ζώνην τοῦ Παύλου δήσας ⸀ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας εἶπεν· Τάδε λέγει τὸ πνεῦμα τὸ ἅγιον Τὸν ἄνδρα οὗ ἐστιν ἡ ζώνη αὕτη, οὕτως δήσουσιν ἐν Ἰερουσαλὴμ οἱ Ἰουδαῖοι καὶ παραδώσουσιν εἰς χεῖρας ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/011.yaml
  text: 'And coming to us[a], and taking Paul’s belt, he bound his own feet and hands and said[b], “Thus says the Holy Spirit: ‘In this way the Jews in Jerusalem will bind the man to whom this belt belongs and will hand him over into the hands of the Gentiles.’”'
translation:
  language: ru
  text: 'Подойдя к нам, он взял пояс Павла, связал себе ноги и руки и сказал: «Так говорит Святой Дух: “Мужа, которому принадлежит этот пояс, иудеи в Иерусалиме свяжут вот так и предадут в руки язычников”».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζώνην
  choice: пояс
  rationale: Современное и естественное обозначение пояса или кушака, носимого на талии; не требует уточнения формы предмета.
- source_word: δήσας ἑαυτοῦ τοὺς πόδας καὶ τὰς χεῖρας
  choice: связал себе ноги и руки
  rationale: 'Передаёт возвратное ἑαυτοῦ: Агав связал собственные ноги и руки. Глагол «связал» сохраняет связь с будущим δήσουσιν.'
- source_word: Τάδε λέγει
  choice: Так говорит
  rationale: Сохраняет торжественную пророческую формулу и при этом естественно звучит в современном русском языке.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: Святой Дух
  rationale: Общепринятое современное русское соответствие греческому выражению.
- source_word: Τὸν ἄνδρα
  choice: мужа
  rationale: В пророческой формуле «мужа» сохраняет указание на взрослого мужчину и возвышенный, но понятный регистр; винительный падеж обусловлен вынесением дополнения перед глаголом.
- source_word: οὗ ἐστιν ἡ ζώνη αὕτη
  choice: которому принадлежит этот пояс
  rationale: Ясно и естественно передаёт отношение принадлежности без изменения смысла.
- source_word: οὕτως
  choice: вот так
  rationale: Непосредственно связывает предсказание с только что совершённым наглядным пророческим действием.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Передаёт этнорелигиозное обозначение без необоснованного сужения до руководителей и без смешения с современным словоупотреблением слова «евреи».
- source_word: παραδώσουσιν
  choice: предадут
  rationale: В данном контексте означает передачу человека во власть другой стороны; «предадут в руки» сохраняет библейскую идиому, не обязательно вводя значение личного предательства.
- source_word: εἰς χεῖρας ἐθνῶν
  choice: в руки язычников
  rationale: Сохраняет образное выражение передачи во власть; ἔθνη здесь обозначает неиудеев.
theological_decisions:
- issue: Пророческая формула как прямая речь Духа
  choice: Так говорит Святой Дух
  alternative: Вот что говорит Святой Дух
  rationale: Выбранный вариант ближе к традиционной формуле пророческого провозглашения и сохраняет заявленную текстом власть источника речи, не добавляя толкования.
- issue: Референт ἑαυτοῦ
  choice: Агав связал собственные ноги и руки
  alternative: Агав связал ноги и руки Павла
  rationale: 'Возвратное местоимение естественно относится к субъекту причастия: символическое действие Агав совершает над собой.'
translation_notes:
  register: Современный литературный русский с умеренно торжественным пророческим регистром. Порядок «ноги и руки» сохранён по греческому тексту. Вложенная цитата оформлена русскими кавычками второго уровня; сносок нет, поэтому маркеры в основном тексте не требуются.
