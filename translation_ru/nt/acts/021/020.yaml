  text: οἱ δὲ ἀκούσαντες ἐδόξαζον τὸν ⸀θεόν, ⸂εἶπόν τε⸃ αὐτῷ· Θεωρεῖς, ἀδελφέ, πόσαι μυριάδες εἰσὶν ⸂ἐν τοῖς Ἰουδαίοις⸃ τῶν πεπιστευκότων, καὶ πάντες ζηλωταὶ τοῦ νόμου ὑπάρχουσιν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/020.yaml
  text: When they heard this[a], they glorified God, and they said to him, “You see, brother, how many myriads there are among the Jews who have believed[b], and they are all zealous for the law.”
translation:
  language: ru
  text: 'Услышав это, они прославляли Бога и сказали ему: «Видишь, брат, сколько десятков тысяч[a] уверовавших среди иудеев[b], и все они ревностно преданы Закону».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «какое несметное множество». Греческое слово μυριάδες может обозначать десятки тысяч либо, шире, очень большое число.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «среди жителей Иудеи», если понимать выражение географически, а не как указание на этнорелигиозную принадлежность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσαντες
  choice: услышав это
  rationale: Аористное причастие выражает предшествующее действие; подразумеваемое дополнение естественно восстанавливается из предыдущего рассказа.
- source_word: ἐδόξαζον
  choice: прославляли
  rationale: Имперфект передаёт действие в развитии, а «прославляли» сохраняет смысл воздаяния славы Богу.
- source_word: εἶπόν τε
  choice: и сказали
  rationale: Простая сочинительная связь естественно передаёт продолжение повествования.
- source_word: Θεωρεῖς
  choice: видишь
  rationale: Риторическое обращение направляет внимание Павла на очевидное положение дел.
- source_word: ἀδελφέ
  choice: брат
  rationale: Форма звательного обращения к конкретному мужчине; по-русски звательное значение передаётся именительным падежом.
- source_word: πόσαι μυριάδες
  choice: сколько десятков тысяч
  rationale: μυριάς буквально обозначает десяток тысяч, а во множественном числе может также указывать на неопределённо огромное множество; основной текст сохраняет числовой образ греческого выражения.
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: среди иудеев
  rationale: В данном контексте речь прежде всего об этнорелигиозной общности, хотя возможно и географическое понимание «среди жителей Иудеи».
- source_word: τῶν πεπιστευκότων
  choice: уверовавших
  rationale: Перфектное причастие обозначает людей, которые уверовали и остаются верующими; русское субстантивированное причастие сохраняет глагольный оттенок.
- source_word: ζηλωταὶ τοῦ νόμου ὑπάρχουσιν
  choice: они ревностно преданы Закону
  rationale: Передаёт устойчивую сильную приверженность, выраженную именным сказуемым с ζηλωταί, не утверждая сверх текста конкретных форм соблюдения.
theological_decisions:
- issue: Значение ἐν τοῖς Ἰουδαίοις
  choice: среди иудеев
  alternative: среди жителей Иудеи
  rationale: Контекст подчёркивает иудейскую принадлежность уверовавших и их ревность к Моисееву Закону, но географический оттенок слова не исключён и отмечен в сноске.
- issue: Сила выражения μυριάδες
  choice: десятки тысяч
  alternative: несметное множество
  rationale: Основной вариант сохраняет буквальный числовой образ, не исключая употребления слова как общего обозначения очень большого числа; эта неоднозначность указана в сноске.
- issue: Характер ревности к Закону
  choice: ревностно преданы Закону
  alternative: ревнители Закона
  rationale: Выбран современный и понятный оборот, сохраняющий положенную в греческом тексте интенсивность, но не выносящий богословской оценки этой приверженности.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. «Закон» написан с прописной буквы как обозначение Моисеева Закона. Формулировка избегает архаичного «ревнители», но сохраняет напряжение между верой этих иудеев и их продолжающейся преданностью Закону.
