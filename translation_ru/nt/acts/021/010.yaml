lexical_decisions:
- source_word: ἐπιμενόντων
  choice: пока мы оставались там
  rationale: Причастие настоящего времени в родительном самостоятельном обороте имеет временное значение; подразумеваемый субъект по контексту — Павел и его спутники, включая рассказчика.
- source_word: δὲ
  choice: пока
  rationale: Слабый переходный оттенок δέ естественно передан вместе с временным значением родительного самостоятельного оборота, без отдельного союза.
- source_word: ἡμέρας πλείους
  choice: ещё несколько дней
  rationale: Оборот обозначает продолжительность и в данном контексте указывает на дополнительные дни пребывания; «ещё несколько дней» естественно передаёт это значение.
- source_word: κατῆλθέν
  choice: пришёл
  rationale: Глагол буквально содержит идею движения вниз, однако по-русски при прибытии человека из Иудеи в Кесарию нейтральное «пришёл» звучит естественно; географическое направление не несёт здесь необходимой смысловой нагрузки.
- source_word: τις
  choice: пророк
  rationale: Неопределённость вводимого участника естественно выражена отсутствием определённого артикля в русском; отдельное «некий» было бы стилистически маркированным.
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: из Иудеи
  rationale: Прямое и естественное обозначение места, откуда прибыл Агав.
- source_word: προφήτης
  choice: пророк
  rationale: Стандартное и понятное обозначение названного в тексте служения, не требующее поясняющего парафраза.
- source_word: ὀνόματι Ἅγαβος
  choice: по имени Агав
  rationale: Естественная русская передача греческого идиоматического оборота с дательным ὀνόματι; «Агав» — традиционная русская форма имени.
