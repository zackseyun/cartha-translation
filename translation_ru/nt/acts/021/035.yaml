  text: ὅτε δὲ ἐγένετο ἐπὶ τοὺς ἀναβαθμούς, συνέβη βαστάζεσθαι αὐτὸν ὑπὸ τῶν στρατιωτῶν διὰ τὴν βίαν τοῦ ὄχλου,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/035.yaml
  text: When he came to the steps[a], it happened that he was being carried by the soldiers because of the violence of the crowd[b],
translation:
  language: ru
  text: Когда он подошёл к ступеням[a], солдатам пришлось нести его из-за насилия толпы,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть к лестнице, которая вела в римскую казарму (см. Деян. 21:34, 37).
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: Когда
  rationale: ὅτε вводит придаточное времени, а слабое связующее δέ естественно не выражать отдельно по-русски.
- source_word: ἐγένετο ἐπὶ τοὺς ἀναβαθμούς
  choice: он оказался на ступенях
  rationale: Оборот γίνομαι с ἐπί и винительным здесь означает достижение места; «оказался на ступенях» естественно передаёт переход к лестнице.
- source_word: ἀναβαθμούς
  choice: ступенях
  rationale: Слово обозначает ступени или лестницу; контекст указывает на лестницу, ведущую в римскую казарму.
- source_word: συνέβη βαστάζεσθαι αὐτὸν
  choice: солдатам пришлось нести его
  rationale: Буквально конструкция сообщает, что произошло так, что его несли; русское «пришлось» естественно выражает обусловленную натиском толпы необходимость, сохраняя его как объект действия.
- source_word: ὑπὸ τῶν στρατιωτῶν
  choice: солдатам
  rationale: Творитель действия при греческом пассиве естественно становится субъектом русской безличной конструкции.
- source_word: διὰ τὴν βίαν τοῦ ὄχλου
  choice: из-за натиска толпы
  rationale: διά с винительным обозначает причину; βία здесь может указывать на силу или насилие толпы. «Натиск» естественно передаёт физическое давление в данной сцене, не усиливая значение до отдельного акта насилия.
theological_decisions: []
