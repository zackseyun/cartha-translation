source:
  edition: SBLGNT
  text: ⸀ἀναφάναντες δὲ τὴν Κύπρον καὶ καταλιπόντες αὐτὴν εὐώνυμον ἐπλέομεν εἰς Συρίαν, καὶ ⸀κατήλθομεν εἰς Τύρον, ἐκεῖσε γὰρ ⸂τὸ πλοῖον ἦν⸃ ἀποφορτιζόμενον τὸν γόμον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/003.yaml
  text: After sighting Cyprus and leaving it on our left[a], we sailed on to Syria and came down to Tyre[d][c][b], for there the ship was unloading its cargo.
translation:
  language: ru
  text: Увидев Кипр и оставив его слева[a], мы поплыли дальше в Сирию и прибыли в Тир[b], потому что там с корабля выгружали груз[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Кипр оставался по левую сторону от корабля.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «спустились в Тир»; по смыслу — прибыли туда.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «корабль выгружал свой груз» или «корабль разгружали».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναφάναντες
  choice: увидев
  rationale: Аористное причастие обозначает действие, предшествующее плаванию; в контексте морского пути речь о том, что Кипр показался в поле зрения. «Увидев» кратко и естественно передаёт этот смысл.
- source_word: καταλιπόντες αὐτὴν εὐώνυμον
  choice: оставив его слева
  rationale: 'εὐώνυμος буквально указывает на левую сторону: по ходу плавания Кипр оставался слева от путешественников. Формулировка понятна без специального морского термина.'
- source_word: ἐπλέομεν εἰς Συρίαν
  choice: мы поплыли дальше в Сирию
  rationale: Имперфект описывает продолжавшееся плавание; «дальше» естественно передаёт продолжение пути, не перегружая русскую фразу.
- source_word: κατήλθομεν εἰς Τύρον
  choice: прибыли в Тир
  rationale: В рассказе о морском путешествии κατέρχομαι обозначает прибытие к месту назначения. Буквальное «спустились» по-русски здесь может ошибочно восприниматься как указание на рельеф, поэтому оно вынесено в примечание.
- source_word: ἀποφορτιζόμενον τὸν γόμον
  choice: с корабля выгружали груз
  rationale: Перифрастическая конструкция с причастием описывает шедшую в тот момент разгрузку. Безличная русская формулировка звучит естественно и сохраняет допустимый пассивный оттенок греческой формы.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Специальная морская терминология вроде «по левому борту» не использована, поскольку нейтральное «слева» точнее соответствует общедоступному регистру. Буквальный направительный оттенок κατήλθομεν сохранён в примечании, а в основном тексте выбран естественный русский глагол прибытия.
