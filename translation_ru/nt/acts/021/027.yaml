revisions:
- from: Когда семь дней уже подходили к концу, иудеи из Асии, увидев Павла на территории храма[a], возмутили всю толпу[b] и схватили его[c].
  to: Когда семь дней были уже на исходе, иудеи из Асии, увидев его в храме[a], привели всю толпу в смятение[b] и схватили его[c].
  rationale: Заменено семантически неудачное «возмутили всю толпу» на «привели всю толпу в смятение», которое передаёт значение συγχέω в описании беспорядка. Основной текст также упрощён до естественного «в храме», а пространственный объём ἱερόν сохранён в сноске. Местоимение «его» следует греческому тексту; его референт ясен из ближайшего контекста.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:54:12Z'
