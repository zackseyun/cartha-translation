  text: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι, οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι θεασάμενοι αὐτὸν ἐν τῷ ἱερῷ συνέχεον πάντα τὸν ὄχλον καὶ ἐπέβαλον ⸂ἐπ’ αὐτὸν τὰς χεῖρας⸃,
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/027.yaml
  text: As the seven days were about to be completed[a], the Jews from Asia, seeing him in the temple, stirred up the whole crowd and laid hands on him[c][b],
translation:
  language: ru
  text: Когда семь дней были уже на исходе, иудеи из Асии, увидев его в храме[a], привели всю толпу в смятение[b] и схватили его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в храме». Греческое слово обозначает весь храмовый комплекс, а не только внутреннее святилище.'
    reason: cultural_note
  - marker: b
    text: 'Или: «возбудили всю толпу». Греческий глагол может означать привести толпу в смятение или вызвать беспорядок.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «наложили на него руки»; это выражение означает, что его силой схватили.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἔμελλον αἱ ἑπτὰ ἡμέραι συντελεῖσθαι
  choice: Когда семь дней уже подходили к концу
  rationale: Передаёт близость завершения семидневного срока, выраженную конструкцией μέλλω с инфинитивом, естественным современным русским языком.
- source_word: οἱ ἀπὸ τῆς Ἀσίας Ἰουδαῖοι
  choice: иудеи из Асии
  rationale: Ἀσία здесь обозначает римскую провинцию Асия, а не современную Азию; традиционная русская форма «Асия» помогает сохранить историко-географическое различие.
- source_word: θεασάμενοι αὐτὸν
  choice: увидев Павла
  rationale: Имя восстанавливается из непосредственного контекста для ясности по-русски; θεάομαι означает увидеть или заметить.
- source_word: ἐν τῷ ἱερῷ
  choice: на территории храма
  rationale: ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище; выбранная формулировка точна и понятна.
- source_word: συνέχεον πάντα τὸν ὄχλον
  choice: возмутили всю толпу
  rationale: συγχέω может обозначать приведение в смятение, беспорядок или возбуждение; «возмутили» сохраняет сочетание смятения и подстрекательства, не уточняя его сверх текста.
- source_word: ἐπέβαλον ἐπ’ αὐτὸν τὰς χεῖρας
  choice: схватили его
  rationale: Греческая идиома буквально говорит о возложении рук, но в данном контексте означает насильственно схватить человека; буквальное русское «возложили руки» было бы двусмысленным.
