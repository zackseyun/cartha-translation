source:
  edition: SBLGNT
  text: ⸂τότε ἀπεκρίθη⸃ ὁ Παῦλος· Τί ποιεῖτε κλαίοντες καὶ συνθρύπτοντές μου τὴν καρδίαν; ἐγὼ γὰρ οὐ μόνον δεθῆναι ἀλλὰ καὶ ἀποθανεῖν εἰς Ἰερουσαλὴμ ἑτοίμως ἔχω ὑπὲρ τοῦ ὀνόματος τοῦ κυρίου Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/013.yaml
  text: Then Paul answered[a], “What are you doing[b], weeping and breaking my heart? For I am ready not only to be bound but even to die in Jerusalem for the name of the Lord Jesus.”
translation:
  language: ru
  text: 'Тогда Павел ответил: «Что же вы делаете — плачете и сокрушаете моё сердце?[a] Ведь я готов не только быть связанным, но и умереть в Иерусалиме за имя Господа Иисуса[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разбиваете мне сердце». Греческий глагол выражает сильное внутреннее сокрушение, а не просто печаль.'
    reason: lexical_alternative
  - marker: b
    text: То есть ради имени Господа Иисуса. В библейской речи «имя» указывает на самого Иисуса, его власть и дело, с которым он отождествляется.
    reason: lexical_explanation
lexical_decisions:
- source_word: Τί ποιεῖτε
  choice: Что же вы делаете
  rationale: Сохраняет форму прямого вопроса и эмоциональный протест Павла; частица «же» естественно передаёт выразительность реплики, не превращая вопрос однозначно в «зачем».
- source_word: κλαίοντες
  choice: плачете
  rationale: Естественно передаёт причастие в составе русского вопроса и сохраняет эмоциональную напряжённость сцены.
- source_word: συνθρύπτοντές μου τὴν καρδίαν
  choice: сокрушаете моё сердце
  rationale: Сохраняет метафору и сильное значение глагола — внутренне разбивать, сокрушать; выражение звучит достойно и понятно по-русски.
- source_word: δεθῆναι
  choice: быть связанным
  rationale: Передаёт пассивный инфинитив δέω без сужения смысла до заключения в тюрьму или ареста.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалиме
  rationale: В данном сочетании по-русски естественно обозначает место предстоящих уз и смерти; буквальное «в Иерусалим» создало бы ложное впечатление, будто речь лишь о направлении движения.
- source_word: ἑτοίμως ἔχω
  choice: я готов
  rationale: Кратко и естественно передаёт греческую идиому состояния готовности.
- source_word: ὑπὲρ τοῦ ὀνόματος
  choice: за имя
  rationale: Сохраняет значимый библейский оборот, не сводя «имя» только к репутации или делу.
- source_word: κυρίου Ἰησοῦ
  choice: Господа Иисуса
  rationale: Передаёт κύριος как христологический титул «Господь» и естественно оформляет родительный падеж после слова «имя».
theological_decisions:
- issue: Передача κύριος применительно к Иисусу
  choice: Господа Иисуса
  alternative: Владыки Иисуса
  rationale: «Господь» — прямой, общепринятый и богословски весомый эквивалент; более узкое «Владыка» здесь неоправданно меняло бы привычный титул.
- issue: Сохранение оборота «имя Господа Иисуса»
  choice: за имя Господа Иисуса
  alternative: ради Господа Иисуса
  rationale: Греческий текст прямо говорит об «имени»; этот библейский оборот может охватывать самого Иисуса, его власть и связанную с ним миссию, поэтому его смысл не следует сужать в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Вопрос передан живо, но без разговорной сниженности; метафора сердца и богословски значимый оборот «за имя» сохранены.
