source:
  edition: SBLGNT
  text: Ὡς δὲ ἐγένετο ἀναχθῆναι ἡμᾶς ἀποσπασθέντας ἀπ’ αὐτῶν, εὐθυδρομήσαντες ἤλθομεν εἰς τὴν ⸀Κῶ, τῇ δὲ ἑξῆς εἰς τὴν Ῥόδον, κἀκεῖθεν εἰς Πάταρα·
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/001.yaml
  text: After we had torn ourselves away from them and put out to sea[a], we ran a straight course and came to Cos, and on the next day to Rhodes, and from there to Patara.
translation:
  language: ru
  text: Когда мы, оторвавшись от них, вышли в море, то взяли прямой курс и прибыли на Кос, на следующий день — на Родос, а оттуда — в Патары.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς δὲ ἐγένετο
  choice: Когда… то
  rationale: Греческая повествовательная конструкция вводит следующее событие; русская конструкция «когда… то» естественно передаёт временной переход.
- source_word: ἀναχθῆναι
  choice: вышли в море
  rationale: В морском контексте ἀνάγω означает отплыть или выйти в море; выбран естественный современный русский оборот.
- source_word: ἀποσπασθέντας ἀπ’ αὐτῶν
  choice: с трудом оторвавшись от них
  rationale: ἀποσπάω передаёт не просто расставание, а болезненный отрыв; добавление «с трудом» естественно выражает эмоциональную силу глагола без буквальной тяжеловесности.
- source_word: εὐθυδρομήσαντες
  choice: взяли прямой курс
  rationale: Морской глагол обозначает движение прямым курсом; русский оборот сохраняет морскую образность и указание на прямой путь.
- source_word: ἤλθομεν εἰς
  choice: прибыли на
  rationale: В описании путешествия «прибыли» естественно передаёт достижение места назначения; предлог согласован с названиями островов.
- source_word: Κῶ
  choice: Кос
  rationale: Современная общепринятая русская передача названия греческого острова Κῶς.
- source_word: τῇ δὲ ἑξῆς
  choice: на следующий день
  rationale: Точно и естественно передаёт временной дательный оборот.
- source_word: Ῥόδον
  choice: Родос
  rationale: Современная общепринятая русская форма названия острова.
- source_word: κἀκεῖθεν
  choice: а оттуда
  rationale: Передаёт καί + ἐκεῖθεν и естественно связывает очередной этап маршрута.
- source_word: Πάταρα
  choice: Патары
  rationale: Традиционная и узнаваемая русская библейская форма названия города Патара, употреблённая с нормативным направительным оборотом «в Патары».
