  text: οὐκ ἄρα σὺ εἶ ὁ Αἰγύπτιος ὁ πρὸ τούτων τῶν ἡμερῶν ἀναστατώσας καὶ ἐξαγαγὼν εἰς τὴν ἔρημον τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων;
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/038.yaml
  text: Then you are not the Egyptian who some days ago stirred up a revolt and led the four thousand men of the assassins out into the wilderness?[a]
translation:
  language: ru
  text: — Так ты не тот египтянин, который незадолго до этого поднял мятеж и увёл в пустыню четыре тысячи сикариев[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «четыре тысячи убийц с кинжалами». Сикарии — название людей, известных нападениями с тайно носимыми кинжалами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἄρα
  choice: Так ты не
  rationale: Передаёт вывод, который тысяченачальник выражает вопросом, и естественно звучит в современной русской речи.
- source_word: ὁ Αἰγύπτιος
  choice: тот египтянин
  rationale: Артикль указывает на конкретного, известного собеседнику человека; «тот египтянин» ясно передаёт эту определённость.
- source_word: πρὸ τούτων τῶν ἡμερῶν
  choice: незадолго до этого
  rationale: Идиома обозначает недавнее прошлое, не уточняя точного числа дней.
- source_word: ἀναστατώσας
  choice: поднял мятеж
  rationale: В данном политическом контексте глагол обозначает возбуждение серьёзных беспорядков или восстания, а не простое замешательство.
- source_word: ἐξαγαγὼν
  choice: увёл
  rationale: Передаёт направленное ведение группы из одного места в другое и естественно сочетается с «в пустыню».
- source_word: εἰς τὴν ἔρημον
  choice: в пустыню
  rationale: ἔρημος здесь означает безлюдную, пустынную местность; традиционное русское «пустыня» не обязательно подразумевает пески.
- source_word: τοὺς τετρακισχιλίους ἄνδρας τῶν σικαρίων
  choice: четыре тысячи сикариев
  rationale: Родительный τῶν σικαρίων определяет названную группу людей; по-русски её численность естественно выражается без отдельного слова «мужчин».
