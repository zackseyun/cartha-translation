  text: τί οὖν ἐστιν; πάντως ⸀ἀκούσονται ὅτι ἐλήλυθας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/022.yaml
  text: What then is to be done? They will certainly hear that you have come[a].
translation:
  language: ru
  text: Что же теперь делать? Они непременно услышат, что ты пришёл[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Что же это?» В данном контексте греческий оборот означает вопрос о том, как следует поступить в сложившейся ситуации.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν ἐστιν;
  choice: Что же теперь делать?
  rationale: 'Буквально: «Что же это?» Однако в данном контексте оборот служит практическим вопросом о том, как поступить в сложившейся ситуации. Русское «Что же теперь делать?» естественно передаёт эту функцию, не устраняя буквальную возможность, отмеченную в сноске.'
- source_word: πάντως
  choice: непременно
  rationale: Наречие подчёркивает несомненность того, что община узнает о прибытии Павла. «Непременно» точно и естественно передаёт усиленное утверждение.
- source_word: ἀκούσονται
  choice: они ... услышат
  rationale: Форма будущего времени здесь имеет активное значение. Подлежащее подразумевается из контекста и естественно выражено русским местоимением «они».
- source_word: ὅτι
  choice: что
  rationale: Союз вводит содержание того, что они услышат, а не причину.
- source_word: ἐλήλυθας
  choice: ты пришёл
  rationale: 'Греческий перфект обозначает совершившееся прибытие с сохраняющимся результатом: Павел теперь находится здесь. В современном русском естественный эквивалент — прошедшее совершенного вида «пришёл»; форма «ты пришёл» в данном контексте подразумевает нынешнее присутствие.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; речь естественная, сдержанная и понятная. Частица «же» сохраняет связность с предшествующим рассуждением, а «теперь» ясно обозначает практическую неотложность вопроса.
