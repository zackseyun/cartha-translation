  yaml_path: translation/nt/acts/021/012.yaml
  text: When we heard these things[a], we and the local people urged him not to go up to Jerusalem.
translation:
  language: ru
  text: Когда мы услышали это, и мы, и местные жители уговаривали его[a] не подниматься в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умоляли его не подниматься в Иерусалим». Глагол может обозначать настойчивую, горячую просьбу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἠκούσαμεν ταῦτα
  choice: Услышав это
  rationale: Естественная русская деепричастная конструкция передаёт временную связь; «это» указывает на содержание предшествующего пророчества, не добавляя уточнений.
- source_word: παρεκαλοῦμεν
  choice: стали уговаривать
  rationale: В данном контексте παρακαλέω обозначает настойчивую просьбу или убеждение. Сочетание «стали уговаривать» естественно передаёт начавшееся и продолжавшееся действие несовершенного вида.
- source_word: ἡμεῖς τε καὶ οἱ ἐντόπιοι
  choice: и мы, и местные жители
  rationale: 'Парная конструкция ясно выделяет обе участвовавшие группы: спутников рассказчика и жителей той местности.'
- source_word: τοῦ μὴ ἀναβαίνειν αὐτὸν
  choice: его не подниматься
  rationale: Передаёт содержание просьбы; местоимение «его» сохраняет отсылку к Павлу без замены имени, которого в данном стихе по-гречески нет.
- source_word: εἰς Ἰερουσαλήμ
  choice: в Иерусалим
  rationale: Нормальное русское обозначение направления движения к городу.
theological_decisions:
- issue: Направительный оборот о пути в Иерусалим
  choice: не подниматься в Иерусалим
  alternative: не идти в Иерусалим
  rationale: Глагол ἀναβαίνω буквально означает движение вверх и традиционно употребляется о путешествии в Иерусалим. «Подниматься» сохраняет образ исходного текста, не придавая ему дополнительного богословского смысла.
- issue: Степень настойчивости обращения к Павлу
  choice: уговаривать
  alternative: умолять
  rationale: Контекст допускает эмоционально сильное «умолять», однако сам глагол παρακαλέω имеет широкий диапазон значений. Основной текст сохраняет умеренное «уговаривать», а более сильная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «и мы, и местные жители» сохранён ради подчёркивания двух групп; оборот «подниматься в Иерусалим» удерживает направительный образ оригинала.
