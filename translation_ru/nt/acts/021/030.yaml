  text: ἐκινήθη τε ἡ πόλις ὅλη καὶ ἐγένετο συνδρομὴ τοῦ λαοῦ, καὶ ἐπιλαβόμενοι τοῦ Παύλου εἷλκον αὐτὸν ἔξω τοῦ ἱεροῦ, καὶ εὐθέως ἐκλείσθησαν αἱ θύραι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/030.yaml
  text: And the whole city was stirred up[a], and a crowd of the people formed; and after seizing Paul, they dragged him outside the temple[c][b], and immediately the doors were shut.
translation:
  language: ru
  text: Весь город пришёл в волнение, и собралась толпа народа. Схватив Павла, они тащили его за пределы храмовой территории[a], и тотчас двери[b] были закрыты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть за пределы всей храмовой территории, а не только внутреннего святилища.
    reason: cultural_note
  - marker: b
    text: 'Или: «ворота». Греческое слово может обозначать двери или ворота; здесь речь идёт о входах на храмовую территорию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκινήθη ... ἡ πόλις ὅλη
  choice: Весь город пришёл в волнение
  rationale: Передаёт идиоматическое пассивное значение κινέω — всеобщее возбуждение и смятение в городе, а не буквальное движение.
- source_word: ἐγένετο συνδρομὴ τοῦ λαοῦ
  choice: народ сбежался
  rationale: συνδρομή обозначает быстрое совместное стечение людей; глагольная русская конструкция естественна и сохраняет динамику внезапного сбора.
- source_word: ἐπιλαβόμενοι τοῦ Παύλου
  choice: Схватив Павла
  rationale: Причастие выражает предшествующее физическое захватывание Павла.
- source_word: εἷλκον αὐτόν
  choice: его поволокли
  rationale: εἷλκον — имперфект от ἕλκω, описывающий насильственное волочение; совершенный вид здесь естественно передаёт последовательность повествования, тогда как лексема «поволокли» сохраняет начало и последующее развитие действия.
- source_word: ἔξω τοῦ ἱεροῦ
  choice: из храмового комплекса
  rationale: ἱερόν здесь означает всю храмовую территорию с дворами и постройками, а не внутреннее святилище; явное обозначение предупреждает неверное сужение смысла.
- source_word: εὐθέως
  choice: тотчас
  rationale: Кратко и в достойном повествовательном регистре передаёт немедленность.
- source_word: ἐκλείσθησαν αἱ θύραι
  choice: ворота закрыли
  rationale: В контексте входов на храмовую территорию θύραι естественно обозначить как «ворота»; безлично-неопределённая активная конструкция по-русски звучит естественнее греческого пассива.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с динамичным повествовательным ритмом. «Народ сбежался» непосредственно передаёт внезапное стечение людей. Термин «храмовый комплекс» выбран ради точного различения ἱερόν и внутреннего святилища; примечания поясняют историко-пространственный контекст и вариант передачи θύραι.
