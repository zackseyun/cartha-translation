  text: ἠκολούθει γὰρ τὸ πλῆθος τοῦ λαοῦ ⸀κράζοντες· Αἶρε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/036.yaml
  text: For the crowd of the people was following[a], shouting, “Take him away!”
translation:
  language: ru
  text: 'Ведь за ним шла толпа народа, крича: «Долой его!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Убери его!»'
    reason: Глагол αἴρω допускает более буквальную передачу требования удалить или увести Павла; основной вариант воспроизводит идиоматическую силу возгласа.
lexical_decisions:
- source_word: ἠκολούθει
  choice: шла за ним
  rationale: Имперфект передаёт продолжавшееся в прошлом действие; по-русски естественно выразить его несовершенным видом. Местоимение «ним» ясно из контекста и соответствует подразумеваемому объекту следования.
- source_word: γὰρ
  choice: ведь
  rationale: Сохраняет пояснительную связь с предыдущим повествованием без тяжеловесного придаточного с «потому что».
- source_word: τὸ πλῆθος τοῦ λαοῦ
  choice: толпа народа
  rationale: Передаёт собирательное значение πλῆθος и нейтральное обозначение λαός, не добавляя уничижительной окраски слова «чернь» или «сброд».
- source_word: κράζοντες
  choice: крича
  rationale: Деепричастие естественно передаёт сопутствующее действие и сохраняет смысловое согласование по множеству людей, заключённых в собирательном слове «толпа».
- source_word: Αἶρε αὐτόν
  choice: Долой его!
  rationale: В данном враждебном возгласе αἴρω означает требование устранить человека; «Долой его!» кратко и естественно передаёт силу коллективного крика, не уточняя способ устранения.
