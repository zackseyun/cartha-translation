  text: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν ἡμεῖς ⸀ἀπεστείλαμεν ⸀κρίναντες φυλάσσεσθαι αὐτοὺς τό τε εἰδωλόθυτον ⸀καὶ αἷμα καὶ πνικτὸν καὶ πορνείαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/025.yaml
  text: But concerning the Gentiles who have believed[a], we sent word, having decided that they should keep themselves from what is sacrificed to idols, and from blood, and from what is strangled[c][b], and from sexual immorality.
translation:
  language: ru
  text: А что касается уверовавших из язычников, мы отправили постановление, решив, что они должны воздерживаться от пищи, принесённой в жертву идолам, от крови, от мяса удавленных животных и от сексуальной безнравственности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ δὲ τῶν πεπιστευκότων ἐθνῶν
  choice: А что касается уверовавших из язычников
  rationale: Оборот вводит новую тему с лёгким противопоставлением предыдущему разговору об уверовавших иудеях. Причастие перфекта обозначает язычников, которые уверовали и остаются верующими.
- source_word: ἡμεῖς ἀπεστείλαμεν κρίναντες
  choice: мы послали им решение
  rationale: В греческом объект глагола «послали» не назван, однако контекст Деян 15 указывает на ранее отправленное постановление. «Послали им решение» естественно передаёт контекст, не уточняя способ отправки как письмо.
- source_word: φυλάσσεσθαι αὐτοὺς
  choice: они должны воздерживаться
  rationale: Средняя форма означает хранить себя от перечисленного; «воздерживаться» ясно и естественно передаёт требование.
- source_word: τό τε εἰδωλόθυτον
  choice: принесённого в жертву идолам
  rationale: Передаёт пищу, связанную с идольским жертвоприношением, не ограничивая выражение одним только мясом.
- source_word: αἷμα
  choice: крови
  rationale: Сохраняется краткая формулировка греческого текста без добавления богословского толкования.
- source_word: πνικτόν
  choice: мяса удавленных животных
  rationale: В контексте пищевого запрета речь идёт о мясе животных, умерщвлённых без удаления крови; такая формулировка понятнее буквального «удавленины».
- source_word: πορνείαν
  choice: разврата
  rationale: «Разврат» в современном литературном русском охватывает запрещённые половые отношения и не сужает значение до добрачной связи.
theological_decisions:
- issue: Характер и продолжительность запретов апостольского постановления
  choice: Передать четыре запрета прямо, не определяя в переводе срок и богословское основание их действия.
  alternative: Истолковать пищевые запреты либо как временную уступку ради общения за столом, либо как постоянно обязательный универсальный закон.
  rationale: Сам стих повторяет содержание ранее принятого решения, но не разъясняет продолжительность и полное богословское основание каждого запрета.
- issue: Значение πορνεία
  choice: разврат
  alternative: блуд; половая распущенность
  rationale: Выбранное слово сохраняет широкое нравственное значение, не привязывая его к частной конфессиональной классификации.
translation_notes:
  register: Современный литературный русский язык; ясный, dignified повествовательный стиль. Синтаксис слегка упрощён ради естественности, при этом сохранены переход к теме язычников и содержание четырёх запретов.
