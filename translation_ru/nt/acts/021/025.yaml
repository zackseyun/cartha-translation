revisions:
- from: 'А что касается уверовавших из язычников, мы послали им решение: они должны воздерживаться от принесённого в жертву идолам, от крови, от мяса удавленных животных и от разврата.'
  to: А что касается уверовавших из язычников, мы отправили постановление, решив, что они должны воздерживаться от пищи, принесённой в жертву идолам, от крови, от мяса удавленных животных и от сексуальной безнравственности.
  rationale: Исправление явно передаёт «решив» (κρίναντες), не вводит невыраженного адресата отправки и делает обозначения идоложертвенной пищи и πορνείαν более точными и естественными для современного литературного русского. Четырёхчленный перечень и его нейтральная, неинтерпретирующая подача сохранены.
