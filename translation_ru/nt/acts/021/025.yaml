review_pass:
  verdict: revise
  source_fidelity: В черновике верно переданы адресаты, четыре пункта постановления и общий смысл. Однако «мы послали им решение» одновременно добавляет невыраженного получателя и не передаёт явно причастие κρίναντες («решив/постановив»).
  naturalness: Русский текст в целом понятен, но «послали им решение» звучит менее естественно, чем «отправили постановление», а «принесённого в жертву идолам» без подразумеваемого существительного стилистически тяжеловесно.
  terminology: «Мясо удавленных животных» уместно конкретизирует πνικτόν в пищевом контексте. Для πορνείαν «сексуальная безнравственность» точнее и нейтральнее современного «разврат», которое может обозначать распущенность вообще и имеет более оценочную окраску.
  issues:
  - severity: medium
    issue: Не выражено значение κρίναντες.
    rationale: Греческое «ἀπεστείλαμεν κρίναντες» сообщает как об отправке постановления, так и о предшествовавшем решении. Формула «послали им решение» заменяет это значение предметом отправки, но не передаёт действие «решив/постановив».
  - severity: low
    issue: «Им» не имеет прямого соответствия в греческой формулировке.
    rationale: Контекст позволяет понять, что постановление относилось к уверовавшим язычникам, но в данном стихе получатель при ἀπεστείλαμεν не назван. Его лучше не добавлять в основной текст.
  - severity: low
    issue: «Разврат» менее точен для πορνείαν.
    rationale: Слово может иметь более широкий смысл моральной распущенности; «сексуальная безнравственность» сохраняет предметную и широкую семантику греческого термина, не сужая её.
  revised_text: А что касается уверовавших из язычников, мы отправили постановление, решив, что они должны воздерживаться от пищи, принесённой в жертву идолам, от крови, от мяса удавленных животных и от сексуальной безнравственности.
