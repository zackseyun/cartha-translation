  text: ⸂ἀνευρόντες δὲ τοὺς⸃ μαθητὰς ἐπεμείναμεν αὐτοῦ ἡμέρας ἑπτά, οἵτινες τῷ Παύλῳ ἔλεγον διὰ τοῦ πνεύματος μὴ ⸀ἐπιβαίνειν εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/004.yaml
  text: After finding the disciples[a], we stayed there seven days. They kept telling Paul through the Spirit not to go up to Jerusalem.
translation:
  language: ru
  text: Разыскав учеников, мы пробыли там семь дней. Они по внушению Духа[a] не раз говорили Павлу, чтобы он не поднимался в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «через Духа». Возможно, Дух открыл ученикам, какие страдания ожидают Павла, а они сами сделали из этого вывод, что ему не следует идти в Иерусалим.'
    reason: Сохраняет неоднозначность выражения διὰ τοῦ πνεύματος и богословское напряжение в повествовании Деяний.
lexical_decisions:
- source_word: ἀνευρόντες
  choice: Разыскав
  rationale: Аористное причастие обозначает действие, предшествующее основному; глагол передаёт не просто случайную встречу, а успешный поиск.
- source_word: μαθητάς
  choice: учеников
  rationale: Обычное и контекстуально точное обозначение последователей Иисуса в Деяниях.
- source_word: ἐπεμείναμεν αὐτοῦ
  choice: мы пробыли там
  rationale: ἐπιμένω означает оставаться, а αὐτοῦ здесь употреблено в локальном значении «там».
- source_word: ἡμέρας ἑπτά
  choice: семь дней
  rationale: Винительный падеж выражает продолжительность времени; русская конструкция естественно передаёт этот смысл без предлога.
- source_word: οἵτινες
  choice: Они
  rationale: Местоимение отсылает к ученикам; новое предложение ясно и естественно сохраняет связь.
- source_word: ἔλεγον
  choice: не раз говорили
  rationale: Имперфект передаёт повторявшееся или продолжавшееся действие; «не раз говорили» естественно выражает эту аспектуальную окраску.
- source_word: διὰ τοῦ πνεύματος
  choice: по внушению Духа
  rationale: Передаёт посредство или действие Духа естественным современным русским языком, не добавляя отсутствующее в греческом тексте определение «Святого».
- source_word: μὴ ἐπιβαίνειν
  choice: чтобы он не поднимался
  rationale: Инфинитив с μή зависит от глагола речи и выражает запрет или предостережение; «поднимался» сохраняет традиционное направление движения в Иерусалим.
- source_word: εἰς Ἱεροσόλυμα
  choice: в Иерусалим
  rationale: Естественное русское обозначение пункта назначения.
theological_decisions:
- issue: Связь слов учеников с действием Духа и решением Павла идти в Иерусалим
  choice: по внушению Духа
  alternative: через Духа; Духом
  rationale: Формулировка сохраняет прямое указание текста на участие Духа, но не устраняет напряжение с Деян. 19:21 и 20:22–23. Примечание оставляет открытой возможность, что Дух открыл ученикам грядущие страдания Павла, а запрет идти был их выводом из этого откровения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Разыскав» и «не раз говорили» точны и понятны; «поднимался в Иерусалим» сохраняет исходную пространственную идиому.
