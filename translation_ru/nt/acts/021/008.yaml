  text: τῇ δὲ ἐπαύριον ἐξελθόντες ⸀ἤλθομεν εἰς Καισάρειαν, καὶ εἰσελθόντες εἰς τὸν οἶκον Φιλίππου τοῦ εὐαγγελιστοῦ ὄντος ἐκ τῶν ἑπτὰ ἐμείναμεν παρ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/008.yaml
  text: On the next day we departed and came to Caesarea[a], and entering the house of Philip the evangelist, who was one of the seven, we stayed with him.
translation:
  language: ru
  text: На следующий день мы отправились в путь и прибыли в Кесарию. Войдя в дом Филиппа, благовестника, одного из семи[a], мы остановились у него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Речь идёт об одном из семи мужчин, ранее избранных для служения в Иерусалиме (см. Деян. 6:3–6).
    reason: cross_reference
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: На следующий день
  rationale: Естественно передаёт временную последовательность повествования; δέ не требует отдельного перевода в данном контексте.
- source_word: ἐξελθόντες
  choice: мы отправились в путь
  rationale: Передаёт выход из прежнего места как начало следующего этапа путешествия и звучит естественно по-русски.
- source_word: ἤλθομεν εἰς Καισάρειαν
  choice: прибыли в Кесарию
  rationale: Глагол движения с указанием пункта назначения здесь естественно передать как прибытие, не меняя смысла последовательности действий.
- source_word: εἰσελθόντες εἰς τὸν οἶκον
  choice: Войдя в дом
  rationale: Сохраняет последовательность действий и прямое значение οἶκος в естественной русской конструкции.
- source_word: Φιλίππου τοῦ εὐαγγελιστοῦ
  choice: благовестника Филиппа
  rationale: «Благовестник» — краткий и укоренившийся русский эквивалент εὐαγγελιστής, обозначающий человека, возвещающего Благую весть.
- source_word: ὄντος ἐκ τῶν ἑπτὰ
  choice: одного из семи
  rationale: Сохраняет историческую отсылку без превращения выражения в позднейшее название церковной должности.
- source_word: ἐμείναμεν παρ’ αὐτῷ
  choice: мы остановились у него
  rationale: В контексте путешествия и гостеприимства естественно означает, что спутники разместились и оставались у Филиппа.
theological_decisions:
- issue: Кем были «семеро»
  choice: Сохранить формулировку «одного из семи» без указания церковного сана.
  alternative: «одного из семи диаконов»
  rationale: Текст отсылает к семерым, избранным в Деян 6:3–6, но не называет их здесь диаконами и не определяет их служение позднейшим должностным термином.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Длинное греческое предложение разделено на два русских ради естественности и удобочитаемости; смысловая последовательность сохранена. Маркер сноски поставлен после выражения «одного из семи», к которому относится пояснение.
