lexical_decisions:
- source_word: ζητούντων τε αὐτὸν ἀποκτεῖναι
  choice: Когда они пытались убить его
  rationale: Родительный самостоятельный оборот с причастием настоящего времени обозначает продолжающееся действие, одновременное с главным; «пытались убить» прямо и естественно передаёт смысл.
- source_word: ἀνέβη φάσις
  choice: дошло известие
  rationale: Греческий оборот буквально говорит, что сообщение «поднялось», вероятно, к расположенной выше крепости; по-русски естественный оборот «дошло известие» сохраняет факт передачи донесения без неясной буквальности.
- source_word: τῷ χιλιάρχῳ τῆς σπείρης
  choice: до командира когорты
  rationale: χιλίαρχος здесь — римский военачальник, приблизительно военный трибун, а σπεῖρα — когорта. Формулировка исторически точна и не перегружена специальной терминологией.
- source_word: ὅλη συγχύννεται Ἰερουσαλήμ
  choice: весь Иерусалим охвачен смятением
  rationale: Метонимия «весь Иерусалим» сохранена; настоящее пассивное συγχύννεται передаёт состояние охватившего город беспорядка и смятения.
