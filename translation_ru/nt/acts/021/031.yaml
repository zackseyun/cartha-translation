  text: And as they were seeking to kill him[b][a], a report went up to the commander of the cohort that all Jerusalem was in an uproar.
translation:
  language: ru
  text: Когда они пытались убить его, до командира когорты[b] дошло известие, что весь Иерусалим охвачен смятением.[a]
