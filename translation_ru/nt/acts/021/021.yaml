  text: κατηχήθησαν δὲ περὶ σοῦ ὅτι ἀποστασίαν διδάσκεις ἀπὸ Μωϋσέως τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους, λέγων μὴ περιτέμνειν αὐτοὺς τὰ τέκνα μηδὲ τοῖς ἔθεσιν περιπατεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/021.yaml
  text: But they have been informed about you that you are teaching all the Jews among the Gentiles to forsake Moses[c][b][a], telling them not to circumcise their children nor to walk according to the customs.
translation:
  language: ru
  text: Но им сообщили о тебе, что ты учишь всех иудеев, живущих среди язычников, отступать от Моисея[a][b], говоря им, чтобы они не обрезывали своих детей и не жили по обычаям[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «учишь отступничеству от Моисея». В греческом употреблено существительное ἀποστασία — «отступление, оставление».'
    reason: lexical_alternative
  - marker: b
    text: Имя «Моисей» здесь обозначает данный через него закон и унаследованный иудейский уклад.
    reason: cultural_note
  - marker: c
    text: 'Или: «не следовать обычаям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηχήθησαν
  choice: им сообщили
  rationale: Пассивная форма здесь передаёт полученное устное сообщение о Павле; «им сообщили» естественно выражает этот смысл по-русски.
- source_word: ἀποστασίαν ... ἀπὸ Μωϋσέως
  choice: отступать от Моисея
  rationale: Отглагольная конструкция естественно передаёт существительное ἀποστασία («отступление, оставление») и сохраняет прямое упоминание Моисея без поясняющей вставки в основной текст.
- source_word: τοὺς κατὰ τὰ ἔθνη πάντας Ἰουδαίους
  choice: всех иудеев, живущих среди язычников
  rationale: Оборот относится к иудеям рассеяния, находящимся среди неиудейских народов; добавление «живущих» делает русскую фразу ясной, не меняя смысла.
- source_word: λέγων
  choice: говоря им
  rationale: Причастие раскрывает содержание приписываемого Павлу наставления и сохраняет связь с упомянутыми иудеями.
- source_word: μὴ περιτέμνειν αὐτοὺς τὰ τέκνα
  choice: чтобы они не обрезывали своих детей
  rationale: Местоимение передано как субъект зависимого действия, а принадлежность детей естественно выражена словом «своих»; более узкое «сыновей» не вводится, поскольку в греческом стоит τέκνα — «дети».
- source_word: μηδὲ τοῖς ἔθεσιν περιπατεῖν
  choice: и не жили по обычаям
  rationale: περιπατεῖν буквально означает «ходить», но здесь идиоматически описывает образ жизни; «жили по обычаям» ясно передаёт смысл в современном русском языке.
theological_decisions:
- issue: Характер обвинения Павла в отношении Моисеева закона
  choice: Передать сообщение как обвинение в том, что Павел учит «отступать от Моисея», не подтверждая и не опровергая его истинность.
  alternative: «учишь отступничеству от Моисея» или «учишь оставлять закон Моисея»
  rationale: Стих сообщает о распространённом утверждении относительно Павла, а не формулирует авторский богословский вывод. Формулировка сохраняет силу обвинения и не превращает его в более широкое учение о законе.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным стилем. Сохранено прямое «Моисея», а буквальная метафора «ходить по обычаям» передана естественным русским выражением «жить по обычаям».
