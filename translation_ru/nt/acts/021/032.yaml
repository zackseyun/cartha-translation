    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: тотчас
  rationale: Передаёт немедленность действия естественным и достаточно торжественным современным русским словом.
- source_word: παραλαβὼν
  choice: взял с собой
  rationale: Ясно выражает, что начальник повёл воинов и сотников вместе с собой.
- source_word: στρατιώτας
  choice: воины
  rationale: Точный и уместный в библейском повествовании эквивалент для отдельных военнослужащих.
- source_word: ἑκατοντάρχας
  choice: сотники
  rationale: Устоявшееся русское название римских офицеров-центурионов, понятное в библейском контексте.
- source_word: κατέδραμεν ἐπ’ αὐτούς
  choice: сбежал к ним
  rationale: Сохраняет и быстроту движения, и направленность вниз от крепости, не приписывая движению дополнительной враждебности.
- source_word: χιλίαρχον
  choice: тысяченачальника
  rationale: Традиционный прозрачный русский эквивалент римского χιλίαρχος; историческое значение уточняется в сноске.
- source_word: ἐπαύσαντο
  choice: перестали
  rationale: Естественно передаёт прекращение продолжавшегося действия.
- source_word: τύπτοντες
  choice: бить
  rationale: Передаёт повторяющиеся удары и продолжающееся насилие без ослабления смысла.
