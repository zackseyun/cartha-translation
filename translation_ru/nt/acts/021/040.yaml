  yaml_path: translation/nt/acts/021/040.yaml
  text: 'And when he had given permission[a], Paul, standing on the steps, motioned with his hand to the people. And when a great silence had come, he addressed them in the Hebrew language, saying:'
translation:
  language: ru
  text: 'Получив разрешение, Павел, стоя на ступенях, сделал народу знак рукой. Когда наступила глубокая тишина, он обратился к ним на еврейском языке[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «на арамейском». В греческом тексте буквально: «на еврейском наречии (или языке)»; в данном контексте так могла называться местная семитская речь, обычно именуемая арамейским языком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιτρέψαντος δὲ αὐτοῦ
  choice: Получив разрешение
  rationale: Генитив абсолютный указывает на разрешение, данное тысяченачальником из предыдущего контекста; русская конструкция естественно передаёт временную связь, не повторяя явно субъекта.
- source_word: ἑστὼς ἐπὶ τῶν ἀναβαθμῶν
  choice: стоя на ступенях
  rationale: Перфектное причастие описывает положение Павла; «ступени» естественно обозначают ступени лестницы, ведущей в крепость.
- source_word: κατέσεισε τῇ χειρὶ τῷ λαῷ
  choice: сделал народу знак рукой
  rationale: Глагол обозначает жест рукой, призванный привлечь внимание или успокоить собравшихся; формулировка сохраняет λαός как «народ».
- source_word: πολλῆς δὲ σιγῆς γενομένης
  choice: Когда наступила глубокая тишина
  rationale: Второй генитив абсолютный передаёт наступление полной, значительной тишины; по-русски «глубокая тишина» звучит естественно и достойно.
- source_word: προσεφώνησεν
  choice: он обратился к ним
  rationale: Глагол означает публично обратиться к слушателям; местоимение «к ним» естественно указывает на народ.
- source_word: τῇ Ἑβραΐδι διαλέκτῳ
  choice: на еврейском языке
  rationale: Основной текст прямо сохраняет греческое обозначение «еврейский язык/наречие», не разрешая в переводе вопрос о том, имеется ли в виду арамейский.
- source_word: λέγων
  choice: ':'
  rationale: Причастие вводит следующую прямую речь; в современном русском двоеточие естественно выполняет эту функцию без тяжеловесного «говоря».
