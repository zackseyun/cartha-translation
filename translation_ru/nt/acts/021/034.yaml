base_translation:
  language: en
  yaml_path: translation/nt/acts/021/034.yaml
  text: But some in the crowd were shouting one thing[a], and others another. Since he was not able to learn the facts because of the uproar[b], he ordered him to be brought into the barracks.
translation:
  language: ru
  text: В толпе одни кричали одно, другие — другое. Поскольку из-за шума и суматохи он не мог выяснить ничего достоверного[a], он приказал отвести его в казармы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не мог установить истину»; букв.: «не мог узнать достоверное».'
    reason: lexical_alternative
  - marker: b
    text: Имеются в виду помещения римского гарнизона, вероятно находившиеся в крепости Антония, примыкавшей к храмовой территории.
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλοι δὲ ἄλλο τι ἐπεφώνουν ἐν τῷ ὄχλῳ
  choice: В толпе одни кричали одно, другие — другое
  rationale: Передаёт распределительное противопоставление ἄλλοι… ἄλλο τι и длительный характер имперфекта ἐπεφώνουν. «Толпа» нейтральнее, чем «чернь» или «мятежники», и не усиливает враждебность сверх текста.
- source_word: μὴ δυναμένου δὲ αὐτοῦ γνῶναι
  choice: Поскольку … он не мог выяснить
  rationale: Родительный самостоятельный оборот выражает обстоятельство с причинным оттенком; γνῶναι здесь означает получение или установление сведений, поэтому естественно передано глаголом «выяснить».
- source_word: τὸ ἀσφαλές
  choice: ничего достоверного
  rationale: Сохраняет значение «то, что надёжно установлено, несомненно», не конкретизируя его как отдельные «факты» и не устраняя присущую греческому выражению смысловую широту.
- source_word: διὰ τὸν θόρυβον
  choice: из-за смятения
  rationale: θόρυβος обозначает не только громкий шум, но и беспорядок, суматоху; «смятение» уместно передаёт оба аспекта происходящего.
- source_word: ἐκέλευσεν ἄγεσθαι αὐτὸν
  choice: приказал отвести его
  rationale: Безличная русская конструкция сохраняет неопределённость исполнителей приказа и передаёт пассивный инфинитив без тяжеловесности.
- source_word: εἰς τὴν παρεμβολήν
  choice: в казармы
  rationale: В данном контексте παρεμβολή означает место размещения римского военного подразделения в крепостном комплексе у храма; «казармы» понятно современному читателю и не создаёт образ временного лагеря.
