translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и сдержанный. Сохранены шумная неразбериха сцены, неопределённость содержания выкриков и смысловая широта τὸ ἀσφαλές. Местоимение «его» оставлено в соответствии с греческим текстом, без эксплицитной замены именем Павла.
