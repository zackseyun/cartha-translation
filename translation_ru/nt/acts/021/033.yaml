  text: ⸂τότε ἐγγίσας⸃ ὁ χιλίαρχος ἐπελάβετο αὐτοῦ καὶ ἐκέλευσε δεθῆναι ἁλύσεσι δυσί, καὶ ἐπυνθάνετο ⸀τίς εἴη καὶ τί ἐστιν πεποιηκώς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/033.yaml
  text: Then the commander came up[a], seized him, and ordered him to be bound with two chains[b], and was asking who he was and what he had done.
translation:
  language: ru
  text: Тогда тысяченачальник подошёл, схватил его и приказал сковать двумя цепями[a]. Он спрашивал, кто этот человек и что он сделал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Две цепи» могут перекликаться с пророчеством в Деян. 21:11 о том, что Павел будет связан в Иерусалиме.
    reason: cross_reference
lexical_decisions:
- source_word: χιλίαρχος
  choice: тысяченачальник
  rationale: Точный и понятный библейско-исторический термин для римского офицера, буквально начальника тысячи; должность приблизительно соответствовала военному трибуну.
- source_word: ἐγγίσας
  choice: подошёл
  rationale: Естественно передаёт предшествующее основным действиям приближение.
- source_word: ἐπελάβετο αὐτοῦ
  choice: схватил его
  rationale: Передаёт физическое и властное задержание Павла в данном контексте.
- source_word: ἐκέλευσε δεθῆναι
  choice: приказал сковать
  rationale: Сохраняет властный приказ и смысл связывания; по-русски исполнитель действия естественно остаётся неуказанным.
- source_word: ἁλύσεσι δυσί
  choice: двумя цепями
  rationale: Прямо передаёт число и обычное значение существительного в контексте заключения.
- source_word: ἐπυνθάνετο
  choice: стал спрашивать
  rationale: Передаёт начавшийся и продолжавшийся расспрос, выраженный имперфектом.
- source_word: τίς εἴη
  choice: кто этот человек
  rationale: Естественная русская косвенная речь; явное «этот человек» устраняет неуклюжее соседство местоимений без добавления нового референта.
- source_word: τί ἐστιν πεποιηκώς
  choice: что он сделал
  rationale: Передаёт совершённое действие с сохраняющейся значимостью; русская форма совершенного вида естественна в косвенном вопросе.
