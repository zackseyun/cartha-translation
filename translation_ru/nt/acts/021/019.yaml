  yaml_path: translation/nt/acts/021/019.yaml
  text: And after greeting them[b][a], he began to relate one by one the things that God had done among the Gentiles through his ministry.
translation:
  language: ru
  text: Поприветствовав их, Павел подробно рассказывал им, одно за другим, о том, что Бог совершил среди язычников[a] через его служение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди народов». Здесь имеются в виду язычники, то есть нееврейские народы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подробно излагал» или «объяснял». Греческий глагол указывает на развёрнутый рассказ или изложение; оборот «одно за другим» подчёркивает, что речь шла о каждом случае по отдельности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπασάμενος
  choice: поприветствовав
  rationale: 'Аористное причастие обозначает действие, предшествующее основному: Павел сначала приветствует собравшихся, затем начинает рассказ. Деепричастие естественно передаёт эту последовательность по-русски.'
- source_word: ἐξηγεῖτο
  choice: стал подробно рассказывать
  rationale: Имперфект представляет развёрнутый процесс повествования. Сочетание «стал подробно рассказывать» передаёт его продолжительный характер, не превращая глагол исключительно в «объяснять».
- source_word: καθ’ ἓν ἕκαστον
  choice: одно за другим
  rationale: Греческий оборот имеет распределительное значение и показывает, что Павел излагал события по отдельности, последовательно.
- source_word: ὧν ἐποίησεν ὁ θεὸς
  choice: обо всём, что Бог совершил
  rationale: Формулировка сохраняет Бога как явно названного деятеля и естественно сочетается с русским глаголом «рассказывать».
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди язычников
  rationale: В данном контексте ἔθνη обозначает не политические государства, а нееврейские народы. «Язычники» — традиционное и понятное в новозаветном контексте обозначение этой группы.
- source_word: διὰ τῆς διακονίας αὐτοῦ
  choice: через его служение
  rationale: 'διά с родительным падежом обозначает средство: Бог действовал посредством служения Павла. «Служение» точно передаёт διακονία в контексте его миссионерского труда, а местоимение сохраняет форму исходного текста.'
theological_decisions:
- issue: Кто действует в миссионерском повествовании Павла
  choice: Бог представлен совершающим дела среди язычников, а служение Павла — средством этого действия.
  alternative: Павел рассказывает прежде всего о собственных достижениях среди язычников.
  rationale: В выражении ὧν ἐποίησεν ὁ θεὸς Бог прямо назван субъектом действия, тогда как διὰ τῆς διακονίας αὐτοῦ указывает на служение Павла как на средство. Перевод сохраняет и божественную инициативу, и человеческое участие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан естественным для чтения вслух; выражение «одно за другим» сохраняет предметно-последовательный характер отчёта. Имя «Павел», ясное из ближайшего контекста, употреблено вместо неназванного подлежащего, чтобы последующее «его служение» однозначно относилось к Павлу, а не к Богу.
