source:
  edition: SBLGNT
  text: κράζοντες· Ἄνδρες Ἰσραηλῖται, βοηθεῖτε· οὗτός ἐστιν ὁ ἄνθρωπος ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας ⸀πανταχῇ διδάσκων, ἔτι τε καὶ Ἕλληνας εἰσήγαγεν εἰς τὸ ἱερὸν καὶ κεκοίνωκεν τὸν ἅγιον τόπον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/021/028.yaml
  text: shouting[a], “Men of Israel, help! This is the man who teaches everyone everywhere against the people and the law and this place. And besides that, he has even brought Greeks into the temple and has defiled this holy place.”
translation:
  language: ru
  text: 'Крича: «Мужи Израиля, на помощь! Это тот человек, который учит всех и повсюду выступать против народа, Закона и этого места. Более того, он даже ввёл греков в храм[a] и осквернил это святое место».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое ἱερόν означает весь храмовый комплекс, включая дворы, а не только внутреннее святилище.
    reason: lexical_alternative
lexical_decisions:
- source_word: κράζοντες
  choice: крича
  rationale: 'Причастие настоящего времени передаёт способ, которым выдвигалось обвинение: громким, настойчивым криком.'
- source_word: Ἄνδρες Ἰσραηλῖται
  choice: Мужи Израиля
  rationale: Естественное торжественно-публичное обращение, сохраняющее мужскую форму исходного текста и понятное современному читателю.
- source_word: βοηθεῖτε
  choice: на помощь!
  rationale: Краткий русский призыв о помощи без добавления отсутствующего в греческом тексте дополнения «нам».
- source_word: οὗτός ἐστιν ὁ ἄνθρωπος
  choice: Это тот человек
  rationale: Сохраняет указательный и обвинительный характер опознания.
- source_word: ὁ κατὰ τοῦ λαοῦ καὶ τοῦ νόμου καὶ τοῦ τόπου τούτου πάντας πανταχῇ διδάσκων
  choice: который всех и повсюду учит тому, что направлено против народа, Закона и этого места
  rationale: Формулировка естественна по-русски, сохраняет двойное обобщение «всех и повсюду» и значение противодействия у κατά с родительным падежом.
- source_word: ἔτι τε καὶ
  choice: Более того
  rationale: Передаёт нарастание обвинения и присоединение ещё одного, более тяжёлого пункта.
- source_word: Ἕλληνας
  choice: греков
  rationale: Передано конкретное лексическое значение «греки», а не более широкое «язычники».
- source_word: εἰσήγαγεν εἰς τὸ ἱερὸν
  choice: даже ввёл греков в храм
  rationale: Глагол передан как завершённое действие в рамках обвинения; «храм» естественно в основном тексте, а более точный объём значения ἱερόν пояснён в сноске.
- source_word: κεκοίνωκεν
  choice: осквернил
  rationale: В культовом контексте κοινόω означает сделать нечистым или профанным; «осквернил» ясно передаёт это обвинение.
- source_word: τὸν ἅγιον τόπον τοῦτον
  choice: это святое место
  rationale: Сохраняет указательное ударение и сакральный характер места.
theological_decisions:
- issue: Значение τοῦ νόμου
  choice: Закон с прописной буквы как указание на Моисеев Закон
  alternative: закон со строчной буквы как более общее понятие
  rationale: В контексте Иерусалима, храма и обвинения против Павла речь идёт об иудейском Законе; прописная буква проясняет референт, не добавляя конфессионального толкования.
- issue: Объём значения ἱερόν
  choice: «храм» в основном тексте со сноской о храмовом комплексе
  alternative: «храмовый комплекс» или «храмовые дворы» непосредственно в основном тексте
  rationale: ἱερόν обозначает весь храмовый комплекс, а не только внутреннее святилище; краткое «храм» обеспечивает естественность, а сноска сохраняет историко-лексическую точность.
translation_notes:
  register: Современный литературный русский с достоинством публичной библейской речи. Обращение «Мужи Израиля» несколько возвышенно, но уместно для торжественного призыва к собравшимся мужчинам; остальная синтаксическая структура сделана естественной и ясной для обычного читателя.
