  yaml_path: translation/nt/acts/021/018.yaml
  text: On the next day[a], Paul went in with us to James[b], and all the elders were present.
translation:
  language: ru
  text: На следующий день Павел вместе с нами вошёл к Иакову, и пришли все старейшины.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и все старейшины были там». Греческий глагол может подчёркивать как прибытие, так и присутствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ ἐπιούσῃ
  choice: На следующий день
  rationale: Устойчивое временное выражение означает следующий день; этот вариант естественен в современном русском языке.
- source_word: εἰσῄει
  choice: пошёл
  rationale: Глагол передаёт движение внутрь или в направлении места встречи. В сочетании «к Иакову» русское «пошёл» звучит естественно, не добавляя отсутствующих в тексте подробностей.
- source_word: σὺν ἡμῖν
  choice: вместе с нами
  rationale: Прямо передаёт значение сопровождения, выраженное σύν с дательным падежом.
- source_word: πρὸς Ἰάκωβον
  choice: к Иакову
  rationale: Предлог πρός с винительным обозначает движение к человеку; перевод не уточняет ни цель посещения, ни место встречи.
- source_word: πάντες τε
  choice: и ... все
  rationale: Частица τέ имеет мягкую соединительную функцию, которую естественно передаёт русский союз «и».
- source_word: παρεγένοντο
  choice: туда пришли
  rationale: παραγίνομαι может указывать как на прибытие, так и на присутствие. «Туда пришли» сохраняет динамическое значение прибытия; альтернативное понимание отмечено в сноске.
- source_word: οἱ πρεσβύτεροι
  choice: пресвитеры
  rationale: В Деяниях слово обозначает признанных руководителей общины. «Пресвитеры» — понятный и устойчивый русский библейский термин, не уточняющий позднейшую конфессиональную структуру.
theological_decisions:
- issue: Личность и роль Ἰάκωβον
  choice: Передать только имя «Иаков», без поясняющего приложения.
  alternative: «Иаков, брат Господа» или «Иаков, руководитель Иерусалимской церкви».
  rationale: В самом стихе Иаков назван без дополнительного определения. Добавление его родства или должности внесло бы сведения, которых этот текст прямо не сообщает.
- issue: Церковный смысл οἱ πρεσβύτεροι
  choice: «пресвитеры» без конфессионального уточнения их полномочий.
  alternative: «старейшины» или «руководители церкви».
  rationale: Слово обозначает признанных руководителей иерусалимской общины, но стих не определяет точную форму их служения или позднейшую церковную структуру.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет повествовательную простоту оригинала. Частица δέ отдельно не выражена, поскольку переход к следующему событию естественно передаётся начальной временной фразой.
