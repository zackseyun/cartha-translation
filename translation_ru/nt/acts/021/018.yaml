  naturalness: Текст в целом естественен, но «туда пришли все пресвитеры» звучит несколько тяжеловесно и создаёт ненужную пространственную отсылку. «Вошёл к Иакову» и «пришли все старейшины» более плавны в современном литературном русском.
  terminology: «Пресвитеры» возможно как традиционный термин, но в современном русском оно сильнее связано с поздней церковной терминологией. «Старейшины» прямо и нейтрально передаёт πρεσβύτεροι, не навязывая конфессиональную структуру.
