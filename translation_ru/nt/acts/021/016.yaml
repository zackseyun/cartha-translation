  - severity: low
    issue: «Давнему ученику» двусмысленно по-русски.
    rationale: Вне библейского контекста оборот может означать бывшего учащегося. «Давнему последователю» точнее выражает продолжительное ученичество и сохраняет историческую неопределённость ἀρχαίῳ μαθητῇ.
