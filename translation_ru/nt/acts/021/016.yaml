base_translation:
  language: en
  yaml_path: translation/nt/acts/021/016.yaml
  text: And some of the disciples from Caesarea also went with us, bringing us to Mnason, a certain Cypriot, an early disciple, with whom we were to stay.
translation:
  language: ru
  text: Вместе с нами пошли и некоторые ученики из Кесарии. Они привели нас к некоему Мнасону с Кипра, давнему последователю[b], у которого нам предстояло остановиться.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведя нас к Мнасону, у которого мы могли бы остановиться»; также возможно: «к дому Мнасона». Греческая форма допускает оттенок предполагаемого или намеченного ночлега.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «одному из ранних учеников». Выражение может означать, что Мнасон был последователем уже долгое время, возможно с раннего периода христианского движения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆλθον δὲ καὶ τῶν μαθητῶν
  choice: Вместе с нами пошли и некоторые ученики
  rationale: 'Конструкция имеет партитивный смысл: речь идёт о некоторых из учеников; συνῆλθον в сочетании с σὺν ἡμῖν обозначает совместное путешествие.'
- source_word: ἀπὸ Καισαρείας
  choice: из Кесарии
  rationale: Естественно передаёт исходный пункт или место, откуда были эти ученики.
- source_word: ἄγοντες
  choice: Они привели нас
  rationale: 'Причастие ἄγοντες поясняет роль сопровождавших учеников: они вели путешественников к месту ночлега. Отдельное предложение делает длинную греческую конструкцию ясной по-русски.'
- source_word: Μνάσωνί τινι Κυπρίῳ
  choice: к киприоту Мнасону
  rationale: Передаёт имя и происхождение естественным современным русским оборотом; неопределённое τινι вводит ранее не упомянутого человека, но буквальное «некоему» здесь звучало бы отчуждённо и могло бы неуместно снижать его значимость.
- source_word: παρ’ ᾧ ξενισθῶμεν
  choice: у которого нам предстояло остановиться
  rationale: ξενίζω в данном контексте относится к размещению гостя; сослагательная форма выражает предполагаемый или намеченный ночлег.
- source_word: ἀρχαίῳ μαθητῇ
  choice: давнему ученику
  rationale: ἀρχαῖος может указывать на принадлежность к раннему времени или на длительность ученичества. «Давний ученик» естественно передаёт временной оттенок, не утверждая, что Мнасон непременно был одним из самых первых учеников.
theological_decisions:
- issue: Значение ἀρχαίῳ μαθητῇ
  choice: давнему ученику
  alternative: одному из ранних учеников
  rationale: Греческое выражение допускает понимание как ученика раннего периода или человека, давно ставшего учеником. Основной текст сохраняет осторожную временную характеристику, а сноска отмечает альтернативу без лишнего исторического уточнения.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Длинная греческая фраза разделена на два предложения для естественности; сохранены географическая деталь, гостеприимство Мнасона и неоднозначность временной характеристики его ученичества.
