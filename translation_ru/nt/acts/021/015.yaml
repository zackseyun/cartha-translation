lexical_decisions:
- source_word: Μετὰ δὲ τὰς ἡμέρας ταύτας
  choice: После этих дней
  rationale: μετά с винительным падежом обозначает временную последовательность; формулировка сохраняет прямую отсылку к только что упомянутому периоду, не добавляя отсутствующего в тексте уточнения.
- source_word: ἐπισκευασάμενοι
  choice: собравшись в дорогу
  rationale: Причастие означает приготовиться или снарядиться; в контексте путешествия естественное русское выражение передаёт общую подготовку к отъезду, не сужая смысл исключительно до упаковки багажа.
- source_word: ἀνεβαίνομεν
  choice: мы пошли
  rationale: Имперфект служит повествованию о движении в прошлом. Русское «пошли» естественно обозначает начало и совершение пути; значение подъёма к Иерусалиму отмечено как возможная более буквальная передача.
- source_word: εἰς Ἱεροσόλυμα
  choice: в Иерусалим
  rationale: εἰς выражает направленное движение; в русском языке при названии города нормативно и естественно «в Иерусалим».
