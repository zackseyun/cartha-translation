lexical_decisions:
- source_word: εὑρόντες
  choice: найдя
  rationale: Аористное причастие обозначает действие, предшествующее отплытию; русское деепричастие естественно и точно передаёт последовательность.
- source_word: πλοῖον
  choice: корабль
  rationale: В контексте морского путешествия это обычное современное обозначение судна, пригодного для перехода по Средиземному морю.
- source_word: διαπερῶν
  choice: направлявшийся
  rationale: Причастие характеризует маршрут корабля. Такой перевод естественен по-русски, а более буквальное значение «переправлявшийся» отражено в сноске.
- source_word: εἰς Φοινίκην
  choice: в Финикию
  rationale: Предлог εἰς указывает направление и пункт назначения.
- source_word: ἐπιβάντες
  choice: мы поднялись на борт
  rationale: В морском контексте глагол означает взойти на судно; личная конструкция делает русский текст плавным и сохраняет последовательность действий.
- source_word: ἀνήχθημεν
  choice: отплыли
  rationale: В морском употреблении ἀνάγω означает выйти в море, отплыть; выбран краткий и естественный русский эквивалент.
