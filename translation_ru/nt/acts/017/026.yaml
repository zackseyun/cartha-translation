  text: ἐποίησέν τε ἐξ ⸀ἑνὸς πᾶν ἔθνος ἀνθρώπων κατοικεῖν ἐπὶ ⸂παντὸς προσώπου⸃ τῆς γῆς, ὁρίσας προστεταγμένους καιροὺς καὶ τὰς ὁροθεσίας τῆς κατοικίας αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/026.yaml
  text: And he made from one man every nation of mankind to live on the whole face of the earth[a], having determined their appointed times and the boundaries of their dwelling place[b],
translation:
  language: ru
  text: От одного человека Он произвёл все народы человечества, чтобы они жили по всему лицу земли[a], определив установленные для них времена[b] и границы их обитания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «от одной крови» вместо «от одного». Основной текст следует чтению SBLGNT «от одного»; слово «человека» добавлено для ясности.'
    reason: textual_variant
  - marker: b
    text: 'Или: «назначенные им времена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐποίησέν
  choice: произвёл
  rationale: Передаёт действие Бога как происхождение народов от общего начала, не сужая значение до творения из ничего.
- source_word: τε
  choice: не выражено отдельным словом
  rationale: Частица связывает эту мысль с предыдущей; в русском языке связь естественно передаётся продолжением речи без дополнительного союза.
- source_word: ἐξ ἑνὸς
  choice: от одного человека
  rationale: В греческом буквально сказано «от одного»; слово «человека» восполняет подразумеваемый человеческий референт и делает фразу естественной по-русски, не вводя вариант «от одной крови».
- source_word: πᾶν ἔθνος ἀνθρώπων
  choice: все человеческие народы
  rationale: Сохраняется значение ἔθνος как отдельных народов и одновременно указывается, что речь идёт о народах человечества.
- source_word: κατοικεῖν
  choice: чтобы они жили
  rationale: Естественно передаёт инфинитив результата или предназначения; множественное число согласовано по смыслу с русским «народы».
- source_word: ἐπὶ παντὸς προσώπου τῆς γῆς
  choice: по всему лицу земли
  rationale: Сохраняет понятный библейский образ «лица земли» и значение всей земной поверхности.
- source_word: ὁρίσας
  choice: определив
  rationale: Передаёт установление Богом временных и пространственных пределов.
- source_word: προστεταγμένους καιρούς
  choice: установленные для них времена
  rationale: καιροί обозначает назначенные периоды, а причастие указывает, что они были установлены; «для них» проясняет связь с народами.
- source_word: ὁροθεσίας
  choice: границы
  rationale: Это естественный русский эквивалент для пространственных пределов или рубежей.
- source_word: τῆς κατοικίας αὐτῶν
  choice: их обитания
  rationale: Сохраняет собирательное значение места или области проживания народов без излишнего уточнения.
theological_decisions:
- issue: Подразумеваемый референт в ἐξ ἑνὸς
  choice: от одного человека
  alternative: от одного
  rationale: Слово «человека» не стоит в греческой фразе прямо, но естественно восполняет подразумеваемый референт и сохраняет мысль об общем происхождении человечества. Вариант «от одной крови» оставлен только в примечании как разночтение.
- issue: Соотношение единства человечества и множества народов
  choice: все человеческие народы
  alternative: весь человеческий род
  rationale: Перевод сохраняет ἔθνος как «народ», не сводя текст лишь к человечеству как единому целому, и одновременно передаёт родительный ἀνθρώπων.
- issue: Характер установленных времён и границ
  choice: определив установленные для них времена и границы их обитания
  alternative: назначив им времена и пределы проживания
  rationale: Формулировка сохраняет утверждение о Божьем определении временных и пространственных пределов, не уточняя сверх текста, относятся ли времена к эпохам существования, историческим срокам или иным назначенным периодам.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Оборот «по всему лицу земли» сохранён как понятный традиционный образ; синтаксис упрощён настолько, чтобы стих был доступен обычному современному читателю.
