base_translation:
  language: en
  yaml_path: translation/nt/acts/017/022.yaml
  text: So Paul[a], standing in the midst of the Areopagus, said, “Men of Athens, I see that in every way you are very religious.”
translation:
  language: ru
  text: 'Тогда Павел, встав посреди Ареопага, сказал: «Афиняне! Я вижу, что вы во всём особенно религиозны[a].»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слишком суеверны»; возможно также: «более религиозны». Греческое слово может иметь как отрицательную, так и положительную окраску.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Σταθεὶς
  choice: встав
  rationale: Аористное причастие задаёт сцену; деепричастие «встав» естественно передаёт предшествующее речи действие.
- source_word: δὲ
  choice: тогда
  rationale: δέ обозначает мягкий повествовательный переход; «тогда» естественно связывает стих с предшествующим контекстом, не внося противопоставления.
- source_word: ἐν μέσῳ τοῦ Ἀρείου Πάγου
  choice: посреди Ареопага
  rationale: Сохранено буквальное локативное значение выражения без истолкования его как указания исключительно на совет.
- source_word: Ἀρείου Πάγου
  choice: Ареопага
  rationale: Использовано общепринятое русское наименование, непосредственно соответствующее греческому топониму.
- source_word: ἔφη
  choice: сказал
  rationale: В повествовательном введении прямой речи имперфект φημί естественно передаётся простым прошедшим временем.
- source_word: Ἄνδρες Ἀθηναῖοι
  choice: Афиняне!
  rationale: Естественная и торжественная русская форма обращения к мужчинам — гражданам Афин; буквальное «мужи афинские» в современном русском звучит архаично.
- source_word: κατὰ πάντα
  choice: во всём
  rationale: Кратко и естественно передаёт широкий охват наблюдения Павла.
- source_word: ὡς
  choice: что
  rationale: В данном построении вводит содержание наблюдения и естественно передаётся союзом «что».
- source_word: δεισιδαιμονεστέρους
  choice: особенно религиозны
  rationale: Сравнительная форма допускает как благоприятный смысл «более/особенно религиозные», так и отрицательный «суеверные». Основной текст сохраняет риторически тактичный и сравнительно нейтральный тон, а неоднозначность отмечена в сноске.
- source_word: θεωρῶ
  choice: вижу
  rationale: Передаёт непосредственное наблюдение и звучит естественно в устной речи.
theological_decisions:
- issue: Тон характеристики афинской религиозности в δεισιδαιμονεστέρους
  choice: В основном тексте — относительно нейтральное «особенно религиозны»
  alternative: «слишком суеверны» или «более религиозны»
  rationale: Греческое слово допускает положительную, нейтральную и отрицательную окраску. Нейтральная формулировка не предрешает риторический тон Павла, а варианты вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной речи. Архаическое «мужи афинские» заменено естественным обращением «Афиняне!». Неоднозначность ключевой характеристики сохранена посредством сноски.
