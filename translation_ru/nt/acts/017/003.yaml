reference: Acts 17:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: διανοίγων καὶ παρατιθέμενος ὅτι τὸν χριστὸν ἔδει παθεῖν καὶ ἀναστῆναι ἐκ νεκρῶν, καὶ ὅτι οὗτός ἐστιν ⸂ὁ χριστός, ὁ⸃ Ἰησοῦς ὃν ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/003.yaml
  text: explaining and demonstrating that the Messiah had to suffer and rise from the dead[a], and that this Jesus, whom I proclaim to you[b], is the Messiah.
translation:
  language: ru
  text: объясняя и показывая, что Мессии[a] надлежало пострадать и воскреснуть из мёртвых[b] и что этот Иисус, которого я возвещаю вам, и есть Мессия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «Христу»; соответственно, в конце стиха — «Христос».
    reason: alternative_reading
  - marker: b
    text: 'Греческий текст буквально использует активную форму: «воскреснуть». Возможный перевод по смыслу: «быть воскрешённым из мёртвых»; в других местах Новый Завет говорит, что Иисуса воскресил Бог.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διανοίγων
  choice: объясняя
  rationale: Причастие передаёт раскрытие смысла Писаний, упомянутых в предыдущем стихе. «Объясняя» естественно звучит по-русски и не требует добавлять отсутствующее здесь дополнение.
- source_word: παρατιθέμενος
  choice: показывая
  rationale: Глагол обозначает изложение доводов или свидетельств. «Показывая» передаёт доказательный характер речи, не усиливая его до строго формального доказательства.
- source_word: τὸν χριστόν / ὁ χριστός
  choice: Мессия
  rationale: В обоих случаях Χριστός употреблено как титул ожидаемого Помазанника, а не как часть имени. «Мессия» сохраняет иудейско-библейский контекст рассуждения.
- source_word: ἔδει
  choice: надлежало
  rationale: Слово выражает необходимость, обусловленную Божьим замыслом и Писанием. «Надлежало» сохраняет силу этой необходимости и соответствует достоинству повествования.
- source_word: παθεῖν
  choice: пострадать
  rationale: Стандартно и точно передаёт страдания Мессии; совершенный вид естественен после «надлежало» в связи с завершёнными событиями.
- source_word: ἀναστῆναι ἐκ νεκρῶν
  choice: воскреснуть из мёртвых
  rationale: Активный инфинитив непосредственно означает «воскреснуть»; выражение «из мёртвых» сохраняет форму и образ греческого текста.
- source_word: οὗτός ἐστιν ὁ χριστός, ὁ Ἰησοῦς
  choice: этот Иисус ... и есть Мессия
  rationale: Такой порядок естественен для русского языка и сохраняет смысловое отождествление возвещаемого Иисуса с Мессией.
- source_word: καταγγέλλω ὑμῖν
  choice: возвещаю вам
  rationale: «Возвещаю» передаёт публичное провозглашение вести и не сужает значение до конкретной формы проповеди.
theological_decisions:
- issue: Передача Χριστός как титула в обоих случаях
  choice: Мессия
  alternative: Христос
  rationale: Аргумент стиха состоит в том, что ожидаемому Помазаннику надлежало пострадать и воскреснуть и что этим Помазанником является Иисус. «Мессия» яснее сохраняет титульный и иудейско-библейский смысл; традиционный вариант указан в сноске.
- issue: Залог и смысл ἀναστῆναι
  choice: воскреснуть из мёртвых
  alternative: быть воскрешённым из мёртвых
  rationale: В исходном тексте стоит активный инфинитив, поэтому «воскреснуть» формально и естественно передаёт именно данную конструкцию. Это не отрицает новозаветных высказываний о том, что Бог воскресил Иисуса, но не привносит сюда иной залог.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Надлежало» выбрано ради выражения обусловленной Писанием необходимости; остальная лексика остаётся ясной для широкого круга современных читателей.
