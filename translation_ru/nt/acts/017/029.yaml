reference: Acts 17:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: γένος οὖν ὑπάρχοντες τοῦ θεοῦ οὐκ ὀφείλομεν νομίζειν χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ, χαράγματι τέχνης καὶ ἐνθυμήσεως ἀνθρώπου, τὸ θεῖον εἶναι ὅμοιον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/029.yaml
  text: Therefore[a], since we are God’s offspring, we ought not to think that the Divine Being is like gold or silver or stone[b], an image formed by human skill and imagination.
translation:
  language: ru
  text: Итак, поскольку мы — Божий род, нам не следует думать, что Божество[a] подобно изваянию[b] из золота, серебра или камня, созданному человеческим искусством и замыслом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «божественная природа», «божественное» или «Божественное Существо». Греческое τὸ θεῖον — широкое обозначение того, что божественно; в рассуждении Павла здесь имеется в виду истинный Бог.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «резному изображению» или «тому, что высечено».'
    reason: lexical_alternative
lexical_decisions:
- source_word: γένος
  choice: род
  rationale: Передаёт происхождение и родство с Богом, продолжая цитату предыдущего стиха, но не сужает смысл до этнической принадлежности или домашней семьи.
- source_word: οὖν
  choice: Итак
  rationale: Естественно обозначает вывод из предшествующего рассуждения Павла.
- source_word: ὑπάρχοντες
  choice: поскольку мы —
  rationale: Причастие имеет здесь причинный оттенок; такая конструкция ясно связывает основание с последующим выводом.
- source_word: τοῦ θεοῦ
  choice: Божий
  rationale: Естественная русская передача родительного падежа, выражающего принадлежность или происхождение.
- source_word: οὐκ ὀφείλομεν
  choice: нам не следует
  rationale: Передаёт долженствование и неуместность такого представления, не усиливая его до прямого запрета.
- source_word: νομίζειν
  choice: думать
  rationale: Современный и широкий по значению глагол, соответствующий умственному предположению.
- source_word: χρυσῷ ἢ ἀργύρῳ ἢ λίθῳ
  choice: золоту, серебру или камню
  rationale: Сохраняет все три названных материала и параллельную структуру оригинала.
- source_word: χαράγματι
  choice: изваянию
  rationale: Обозначает изготовленное резьбой или иным художественным способом изображение; существительное естественно поясняет перечисленные материалы.
- source_word: τέχνης
  choice: искусством
  rationale: Передаёт ремесленное мастерство и художественную деятельность без отрицательной добавочной оценки.
- source_word: ἐνθυμήσεως
  choice: замыслом
  rationale: Передаёт мысленную концепцию или проект создателя образа точнее и естественнее, чем более широкое «воображение».
- source_word: ἀνθρώπου
  choice: человеческим
  rationale: Сохраняет обобщённое значение единственного числа и не создаёт впечатления, будто речь идёт о конкретном мужчине.
- source_word: τὸ θεῖον
  choice: Божество
  rationale: Сохраняет широкий, философски окрашенный субстантивированный термин для божественного и в контексте относится к истинному Богу, не превращая выражение в позднейший технический догматический термин.
theological_decisions:
- issue: Передача τὸ θεῖον в монотеистической, но философски сформулированной речи
  choice: Божество
  alternative: божественная природа; божественное; Божественное Существо
  rationale: «Божество» естественно для возвышенной современной русской речи и сохраняет философскую широту выражения. При этом контекст речи Павла указывает на истинного Бога, но перевод не устраняет исходную лексическую неоднозначность.
- issue: Смысл выражения «Божий род»
  choice: Сохранить язык происхождения и родства без догматического уточнения
  alternative: Божьи дети; потомки Бога
  rationale: γένος связано с цитатой в предыдущем стихе и не тождественно новозаветному учению об усыновлении верующих; «род» сохраняет эту напряжённость и не вводит лишнего богословского уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством публичной философско-богословской речи. Тире перед «изваянию» показывает, что последующая фраза поясняет сравнение с материалами. Все сноски отмечены в основном тексте.
