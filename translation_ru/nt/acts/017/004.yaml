id: ACT.17.4
reference: Acts 17:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: καί τινες ἐξ αὐτῶν ἐπείσθησαν καὶ προσεκληρώθησαν τῷ Παύλῳ καὶ τῷ Σιλᾷ, τῶν τε σεβομένων Ἑλλήνων ⸂πλῆθος πολὺ⸃ γυναικῶν τε τῶν πρώτων οὐκ ὀλίγαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/004.yaml
  text: And some of them were persuaded and joined Paul and Silas[a], along with a large number of the God-fearing Greeks and not a few of the leading women.
translation:
  language: ru
  text: Некоторые из них убедились и присоединились к Павлу и Силе[a], как и множество греков, почитавших Бога, и немало знатных женщин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «были причислены к Павлу и Силе»; то есть связали с ними свою судьбу.'
    reason: Лексическая альтернатива для редкого глагола προσεκληρώθησαν, сохраняющая образ причисления или присоединения по жребию.
lexical_decisions:
- source_word: τινες ἐξ αὐτῶν
  choice: некоторые из них
  rationale: Естественно передаёт партитивное выражение и отсылает к слушателям в синагоге из предыдущего стиха.
- source_word: ἐπείσθησαν
  choice: убедились
  rationale: Сохраняет значение πείθω и не заменяет его более явным термином веры, которого в греческом тексте нет.
- source_word: προσεκληρώθησαν
  choice: присоединились
  rationale: Редкий глагол обозначает присоединение или установление связи с кем-либо; выбран ясный современный эквивалент.
- source_word: τῷ Παύλῳ καὶ τῷ Σιλᾷ
  choice: к Павлу и Силе
  rationale: Предлог «к» естественно передаёт отношение, выраженное дательным падежом при προσεκληρώθησαν.
- source_word: τῶν τε σεβομένων Ἑλλήνων
  choice: греков, почитавших Бога
  rationale: Передаёт характерное для Деяний обозначение неевреев, связанных с почитанием Бога Израиля, понятным современным русским языком.
- source_word: πλῆθος πολὺ
  choice: множество
  rationale: Кратко и естественно выражает значительное число людей.
- source_word: γυναικῶν τε τῶν πρώτων
  choice: знатных женщин
  rationale: πρῶτος здесь указывает на высокое общественное положение, а не на временную или порядковую первичность.
- source_word: οὐκ ὀλίγαι
  choice: немало
  rationale: Сохраняет литоту Луки и её сдержанное усиление.
- source_word: τε ... τε
  choice: как и ... и
  rationale: Естественно связывает две дополнительные группы с некоторыми из первоначальных слушателей.
theological_decisions:
- issue: Передавать ли ἐπείσθησαν явно конверсионным термином
  choice: убедились
  alternative: уверовали
  rationale: Греческий текст использует πείθω, а не πιστεύω; выбранный вариант сохраняет лексическое различие и не устраняет богословскую нюансировку.
- issue: Насколько явно обозначить религиозный статус σεβομένων Ἑλλήνων
  choice: греки, почитавшие Бога
  alternative: богобоязненные греки
  rationale: Описательный вариант ясно передаёт почитание Бога и исторический контекст, не превращая выражение в малопонятный специальный термин.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и доступным синтаксисом. Лукина литота «немало» сохранена; социальный смысл «первых женщин» передан словом «знатных».
