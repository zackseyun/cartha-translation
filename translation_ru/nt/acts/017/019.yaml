  terminology: «Ареопаг» корректно сохранён как собственное название; примечание уместно поясняет его возможное значение. «Учение» — точный, нейтральный и современный эквивалент διδαχή. Конфессионально окрашенные или интерпретирующие формулировки не внесены.
