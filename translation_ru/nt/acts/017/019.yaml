  source_fidelity: 'Текст точно передаёт последовательность греческих действий: участники берут Павла, приводят его в Ареопаг и обращаются с вопросом. «Взяли его» сохраняет намеренную сдержанность ἐπιλαβόμενοι, не превращая действие ни в формальный арест, ни в простое приглашение. «В Ареопаг» вместе с примечанием не снимает историческую неоднозначность места и совета. Вопросительное «Можно нам узнать» адекватно передаёт вежливо-вопросительную функцию Δυνάμεθα γνῶναι.'
