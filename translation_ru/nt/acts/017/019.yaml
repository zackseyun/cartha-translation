reference: Acts 17:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ἐπιλαβόμενοί ⸀τε αὐτοῦ ἐπὶ τὸν Ἄρειον Πάγον ἤγαγον, λέγοντες· Δυνάμεθα γνῶναι τίς ἡ καινὴ αὕτη ἡ ὑπὸ σοῦ λαλουμένη διδαχή;
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/019.yaml
  text: So they took hold of him and brought him to the Areopagus, saying, “May we know what this new teaching is that is being spoken by you?”
translation:
  language: ru
  text: 'Тогда они взяли его и привели в Ареопаг[a], говоря: «Можно нам узнать, что это за новое учение, о котором ты говоришь?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Ареопаг» может означать как сам холм, так и связанный с ним совет.
    reason: cultural_note
lexical_decisions:
- source_word: ἐπιλαβόμενοί
  choice: взяли его
  rationale: Глагол может означать «схватить», «взяться за» или «взять с собой». «Взяли его» сохраняет физическую инициативу сопровождавших, но не представляет происходящее как несомненный арест.
- source_word: τε
  choice: тогда
  rationale: Слабая соединительная частица связывает действие с предыдущим повествованием; «тогда» естественно передаёт последовательность событий.
- source_word: ἐπὶ τὸν Ἄρειον Πάγον
  choice: в Ареопаг
  rationale: Транслитерация сохраняет собственное название и не решает однозначно, имеется ли в виду холм или связанный с ним совет.
- source_word: ἤγαγον
  choice: привели
  rationale: Обычное значение ἄγω; по-русски естественно сочетается с указанием места назначения.
- source_word: λέγοντες
  choice: говоря
  rationale: Деепричастие сохраняет одновременность речи с основным действием и формальную связь греческого причастия.
- source_word: Δυνάμεθα γνῶναι
  choice: Можно нам узнать
  rationale: В контексте это вежливый запрос, а не отвлечённый вопрос о способности; оборот звучит естественно и сохраняет вопросительную форму.
- source_word: καινὴ
  choice: новое
  rationale: Передаёт новизну учения для слушателей без добавочного оттенка подозрительности.
- source_word: ἡ ὑπὸ σοῦ λαλουμένη
  choice: о котором ты говоришь
  rationale: Естественная русская передача пассивной конструкции «говоримое тобой»; связь местоимения с существительным «учение» ясна, а смысл исходного текста не меняется.
- source_word: διδαχή
  choice: учение
  rationale: Современный и понятный эквивалент, менее узкоконфессиональный и технический, чем «доктрина».
theological_decisions:
- issue: Характер сопровождения Павла в Ареопаг
  choice: Решительное физическое сопровождение, не обозначенное прямо как арест
  alternative: «Схватили его» как указание на насильственное задержание либо «пригласили его» как сугубо учтивое действие
  rationale: ἐπιλαμβάνομαι допускает более сильный оттенок, однако контекст прямо не называет действие арестом. Перевод не устраняет физическую инициативу сопровождавших и не усиливает её до несомненного насилия.
- issue: Значение названия Ἄρειος Πάγος
  choice: Сохранено собственное название «Ареопаг» без уточнения
  alternative: «Холм Ареса» как место либо «совет Ареопага» как учреждение
  rationale: Выражение может относиться как к месту, так и к связанному с ним совету; основной текст сохраняет эту историческую неоднозначность.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис близок к повествовательной форме греческого текста, но вопрос передан естественно для русского читателя. Маркер [a] помещён в основном тексте.
