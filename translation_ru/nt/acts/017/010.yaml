  text: Οἱ δὲ ἀδελφοὶ εὐθέως ⸀διὰ νυκτὸς ἐξέπεμψαν τόν τε Παῦλον καὶ τὸν Σιλᾶν εἰς Βέροιαν, οἵτινες παραγενόμενοι εἰς τὴν συναγωγὴν ⸂τῶν Ἰουδαίων ἀπῄεσαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/010.yaml
  text: Then the brothers immediately sent both Paul and Silas away by night to Berea[a], and when they arrived[c][b], they went into the synagogue of the Jews.
translation:
  language: ru
  text: Братья[a] тотчас же ночью отослали в Верию обоих — Павла и Силу. Прибыв туда, они пошли в синагогу иудеев[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «братья и сёстры»; греческое слово «братья» может обозначать всю общину верующих.
    reason: lexical_alternative
  - marker: c
    text: Или «в иудейскую синагогу».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοὶ
  choice: братья
  rationale: Сохраняет грамматически мужскую форму и семейно-общинное обращение; в данном контексте слово может обозначать всю общину верующих.
- source_word: εὐθέως
  choice: тотчас же
  rationale: Естественно и точно передаёт незамедлительность действия.
- source_word: διὰ νυκτός
  choice: ночью
  rationale: Идиоматично передаёт действие, совершавшееся в ночное время, без добавления отсутствующего в тексте мотива тайного бегства.
- source_word: ἐξέπεμψαν
  choice: отослали
  rationale: Передаёт значение отправления прочь, уместное в контексте срочного удаления Павла и Силы.
- source_word: τόν τε Παῦλον καὶ τὸν Σιλᾶν
  choice: Павла и Силу
  rationale: Русская парная конструкция с союзом «и» естественно охватывает обоих названных лиц; отдельное «обоих» здесь необязательно.
- source_word: Βέροιαν
  choice: Верию
  rationale: Использована устоявшаяся русская библейская форма названия города.
- source_word: οἵτινες παραγενόμενοι
  choice: Прибыв туда, они
  rationale: 'Деепричастный оборот естественно передаёт временную последовательность: после прибытия Павел и Сила направились в синагогу.'
- source_word: συναγωγὴν τῶν Ἰουδαίων
  choice: синагогу иудеев
  rationale: Сохраняет греческую родительную конструкцию и обозначает синагогу местной иудейской общины без оценочного оттенка.
- source_word: ἀπῄεσαν
  choice: пошли в
  rationale: Естественно передаёт направленное движение к указанному месту; простая форма прошедшего времени подходит для повествовательного контекста.
theological_decisions:
- issue: Значение ἀδελφοὶ применительно к общине верующих
  choice: братья
  alternative: братья и сёстры; верующие
  rationale: Основной текст сохраняет мужскую форму греческого существительного и привычное общинное обозначение. Возможность включения женщин отмечена в сноске, чтобы не сужать вероятный круг участников.
- issue: Передача τῶν Ἰουδαίων
  choice: синагога иудеев
  alternative: иудейская синагога
  rationale: Родительная конструкция прозрачно воспроизводит формулировку источника; здесь речь о принадлежности синагоги местной иудейской общине, а не о богословской или отрицательной оценке.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным ритмом. «Тотчас же» сохраняет достоинство библейского рассказа без архаизации; «отослали» передаёт срочное удаление из города. Все сноски поставлены непосредственно после соответствующих выражений.
