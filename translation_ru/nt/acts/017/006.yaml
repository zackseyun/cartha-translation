lexical_decisions:
- source_word: μὴ εὑρόντες δὲ αὐτοὺς
  choice: Но, не найдя их
  rationale: Аористное причастие передаёт обстоятельство, предшествующее основному действию; деепричастный оборот естественен по-русски и сохраняет связь с предыдущим повествованием через «но».
- source_word: ἔσυρον
  choice: потащили
  rationale: Глагол обозначает принудительное волочение или грубое ведение силой; «потащили» сохраняет физическую резкость действия.
- source_word: τινας ἀδελφοὺς
  choice: некоторых братьев
  rationale: Сохранено буквальное общинное наименование верующих; контекст ясно указывает на братьев по вере.
- source_word: ἐπὶ τοὺς πολιτάρχας
  choice: к городским властям
  rationale: Политархи были местными македонскими городскими должностными лицами. Функциональный перевод понятен современному читателю, а специальный титул отмечен в сноске.
- source_word: βοῶντες
  choice: крича
  rationale: Передаёт громкий публичный выкрик, сопровождающий насильственное приведение обвиняемых.
- source_word: οἱ τὴν οἰκουμένην ἀναστατώσαντες
  choice: эти люди, возмутившие весь обитаемый мир
  rationale: «Возмутившие» передаёт причинение беспорядка и потрясения без внесения отсутствующего в греческом образа перевёрнутого мира; «обитаемый мир» сохраняет исторический объём οἰκουμένη.
- source_word: οὗτοι καὶ ἐνθάδε πάρεισιν
  choice: явились и сюда
  rationale: Передаёт как прибытие, так и нынешнее присутствие; «и сюда» сохраняет усилительное καί.
