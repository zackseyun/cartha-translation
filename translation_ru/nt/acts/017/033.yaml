  text: ⸀οὕτως ὁ Παῦλος ἐξῆλθεν ἐκ μέσου αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/033.yaml
  text: So Paul went out from among them[a].
translation:
  language: ru
  text: Так Павел вышел из их среды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Так Павел удалился от них».'
    reason: 'Лексическая альтернатива: ἐξῆλθεν ἐκ μέσου αὐτῶν может передаваться как конкретное «вышел из их среды» или более идиоматическое «удалился от них».'
lexical_decisions:
- source_word: οὕτως
  choice: Так
  rationale: В данном контексте слово подводит итог эпизоду и связывает уход Павла с предшествующей сценой; «так» естественно передаёт повествовательно-итоговую силу греческого наречия.
- source_word: ὁ Παῦλος
  choice: Павел
  rationale: Традиционная и общепринятая русская форма имени.
- source_word: ἐξῆλθεν
  choice: вышел
  rationale: Аорист ἐξέρχομαι обозначает выход или удаление; «вышел» сохраняет конкретный образ движения и естественно сочетается с «из их среды».
- source_word: ἐκ μέσου αὐτῶν
  choice: из их среды
  rationale: Выражение обозначает уход из окружения собравшихся людей; формулировка близка к греческому образу и понятна в современном литературном русском языке.
theological_decisions: []
