base_translation:
  language: en
  yaml_path: translation/nt/acts/017/016.yaml
  text: While Paul was waiting for them in Athens[b][a], his spirit was provoked within him as he saw that the city was full of idols.
translation:
  language: ru
  text: Пока Павел ждал их в Афинах, он испытывал глубокое возмущение в духе[a], видя, что город полон идолов[b].
  philosophy: optimal-equivalence
  footnotes:
