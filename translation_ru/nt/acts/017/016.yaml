    reason: lexical_alternative
  - marker: b
    text: 'Или: «город был весь во власти идолов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκδεχομένου
  choice: ждал
  rationale: Причастие в родительном абсолютном обороте задаёт одновременное обстоятельство и передаёт продолжительное ожидание Павлом своих спутников.
- source_word: παρωξύνετο
  choice: возмущался
  rationale: Глагол обозначает острое внутреннее возбуждение или раздражение; форма имперфекта передаёт продолжавшуюся реакцию. «Возмущался» сохраняет силу выражения, а сноска отмечает возможные оттенки тревоги и сильного волнения.
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: его дух
  rationale: Прямо передаёт притяжательную конструкцию и указывает на внутренний дух Павла, не добавляя явной ссылки на Святого Духа.
- source_word: ἐν αὐτῷ
  choice: в нём
  rationale: Сохраняет подчёркнутую в греческом тексте внутреннюю локализацию переживания, несмотря на намеренную смысловую близость к выражению «его дух».
- source_word: θεωροῦντος
  choice: когда он видел
  rationale: Передаёт одновременное внимательное восприятие Павлом состояния города естественным современным русским оборотом.
- source_word: κατείδωλον
  choice: полон идолов
  rationale: Редкое прилагательное описывает город как наполненный идолами; этот вариант ясен, образен и менее истолковательный, чем «предан идолам».
- source_word: πόλιν
  choice: город
  rationale: Сохраняет прямое обозначение греческого текста; из уже названных Афин ясно, о каком городе идёт речь.
- source_word: δὲ
  choice: пока
  rationale: 'Связующая частица не получает отдельного формального соответствия: переход повествования естественно выражен временной конструкцией «Пока Павел ждал…» без добавления отсутствующего в источнике наречия «теперь».'
theological_decisions:
- issue: К кому относится «дух»
  choice: Собственный человеческий дух Павла
  alternative: Побуждение Павла Святым Духом
  rationale: Притяжательное выражение «его дух» и уточнение «в нём» непосредственно описывают внутреннюю реакцию Павла. Перевод не исключает более широкого богословского понимания действия Бога, но не вносит его в стих, где оно прямо не выражено.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным для обычного читателя; повтор «его дух… в нём» сохранён ради подчёркивания внутренней реакции в греческом тексте.
