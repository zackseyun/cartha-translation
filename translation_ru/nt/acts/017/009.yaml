lexical_decisions:
- source_word: λαβόντες
  choice: взяв
  rationale: Аористное причастие обозначает действие, предшествующее основному; русское деепричастие естественно и точно передаёт последовательность.
- source_word: τὸ ἱκανὸν
  choice: достаточное обеспечение
  rationale: В данном правовом контексте выражение, вероятно, означает принятую властями достаточную гарантию, в том числе возможный денежный залог. Формулировка сохраняет определённость греческого выражения и не сужает его до конкретной юридической процедуры.
- source_word: παρὰ τοῦ Ἰάσονος καὶ τῶν λοιπῶν
  choice: с Иасона и остальных
  rationale: παρά с родительным обозначает источник; в русском выражение «взять обеспечение с кого-либо» идиоматично. «Остальных» указывает на других задержанных или связанных с Иасоном лиц в непосредственном контексте.
- source_word: ἀπέλυσαν
  choice: отпустили
  rationale: В контексте действий городских властей глагол означает освобождение задержанных; «отпустили» звучит естественно и не добавляет отсутствующих в тексте процессуальных деталей.
- source_word: αὐτούς
  choice: их
  rationale: Местоимение во множественном числе относится к Иасону и другим лицам, находившимся перед городскими властями.
