lexical_decisions:
- source_word: Ἀθηναῖοι δὲ πάντες
  choice: Все афиняне
  rationale: πάντες передано прямо как «все»; δὲ вводит пояснительное отступление и в естественном русском не требует отдельного союза.
- source_word: οἱ ἐπιδημοῦντες ξένοι
  choice: жившие там чужеземцы
  rationale: ἐπιδημοῦντες обозначает находившихся или временно проживавших в городе людей; «жившие там» естественно передаёт локальный смысл, не утверждая постоянного проживания.
- source_word: εἰς οὐδὲν ἕτερον ηὐκαίρουν
  choice: проводили время только за тем
  rationale: Идиоматически передаёт отрицательно-ограничительную конструкцию «не занимались ничем иным» и несовершенный вид, описывающий обычное занятие.
- source_word: λέγειν τι ἢ ἀκούειν
  choice: рассказывали или слушали что-нибудь
  rationale: Сохраняет параллель двух инфинитивов и общий объект τι; «рассказывали» здесь естественнее русского буквального «говорили что-нибудь».
- source_word: καινότερον
  choice: поновее
  rationale: Разговорно-нейтральная сравнительная форма сохраняет буквальное значение «более новое» и оттенок тяги к последней новости или новинке.
