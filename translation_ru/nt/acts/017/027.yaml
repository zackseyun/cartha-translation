  text: ζητεῖν τὸν ⸀θεὸν εἰ ἄρα γε ψηλαφήσειαν αὐτὸν καὶ εὕροιεν, καί γε οὐ μακρὰν ἀπὸ ἑνὸς ἑκάστου ἡμῶν ὑπάρχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/027.yaml
  text: that they should seek God[a], if perhaps they might grope for him and find him—though indeed he is not far from each one of us.
translation:
  language: ru
  text: чтобы они искали Бога — может быть, им удастся на ощупь[a] найти Его, хотя на самом деле Он недалеко от каждого из нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ощупывать»; образ поиска на ощупь передаёт ограниченность человеческого восприятия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητεῖν
  choice: чтобы они искали
  rationale: Инфинитив зависит от предшествующей мысли и выражает цель; русское придаточное с «чтобы» естественно сохраняет целевое значение.
- source_word: τὸν θεόν
  choice: Бога
  rationale: Определённый артикль отдельно не передаётся, поскольку с именованием единого Бога в русском языке он не имеет прямого соответствия.
- source_word: εἰ ἄρα γε
  choice: не … ли
  rationale: Конструкция передаёт предположительность и неуверенность результата; русская форма «не … ли» естественно выражает попытку с возможным исходом.
- source_word: ψηλαφήσειαν
  choice: нащупают
  rationale: Глагол обозначает поиск посредством ощупывания и сохраняет образ ограниченного восприятия, при этом звучит естественно по-русски.
- source_word: αὐτόν
  choice: Его
  rationale: Местоимение относится к Богу; личная форма сохраняет референцию исходного текста.
- source_word: καὶ εὕροιεν
  choice: и не найдут ли
  rationale: Второй оптатив согласован с первым; повтор частицы «ли» ясно сохраняет предположительность обоих действий.
- source_word: καί γε
  choice: хотя
  rationale: В контексте оборот вводит уступительное уточнение, противопоставляя неуверенный человеческий поиск действительной близости Бога.
- source_word: οὐ μακρὰν
  choice: недалеко
  rationale: Прямой и естественный русский эквивалент пространственной метафоры.
- source_word: ἀπὸ ἑνὸς ἑκάστου ἡμῶν
  choice: от каждого из нас
  rationale: Передаёт дистрибутивный акцент выражения ἑνὸς ἑκάστου без тяжеловесного «от каждого одного».
- source_word: ὑπάρχοντα
  choice: Он … недалеко
  rationale: Причастная конструкция естественно преобразована в русское личное предложение, утверждающее действительную близость Бога.
theological_decisions:
- issue: Доступность Бога и человеческий поиск
  choice: Сохранены как неуверенность человеческого поиска («не нащупают ли… и не найдут ли»), так и утверждение близости Бога («хотя Он и недалеко»).
  alternative: Сгладить образ ощупывания до общего «попытаются найти» либо усилить уверенность результата.
  rationale: Греческий текст соединяет ограниченность человеческого восприятия с реальной близостью Бога; перевод не должен делать поиск ни заведомо успешным, ни безнадёжным.
translation_notes:
  register: Современный литературный русский язык; формулировка dignified и доступная. «Нащупают» сохраняет осязательную метафору без архаичного «осязать». Тире обозначает поясняющее развитие цели поиска.
