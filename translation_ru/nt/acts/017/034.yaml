  text: τινὲς δὲ ἄνδρες κολληθέντες αὐτῷ ἐπίστευσαν, ἐν οἷς καὶ Διονύσιος ὁ Ἀρεοπαγίτης καὶ γυνὴ ὀνόματι Δάμαρις καὶ ἕτεροι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/034.yaml
  text: But some men joined him and believed[a], among whom were also Dionysius the Areopagite, and a woman named Damaris[b], and others with them.
translation:
  language: ru
  text: Но некоторые мужчины присоединились к нему[a] и уверовали. Среди них были также Дионисий Ареопагит[b], женщина по имени Дамарь и другие вместе с ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «примкнули к нему», «тесно связали себя с ним»; греческое слово указывает на близкое личное присоединение к Павлу.'
    reason: lexical_alternative
  - marker: b
    text: «Ареопагит» может означать члена совета Ареопага или человека, иным образом связанного с Ареопагом.
    reason: cultural_note
lexical_decisions:
- source_word: τινὲς δὲ ἄνδρες
  choice: Но некоторые мужчины
  rationale: δὲ выражает лёгкое противопоставление предыдущим реакциям, τινὲς обозначает часть слушателей, а ἄνδρες здесь имеет явно мужское значение.
- source_word: κολληθέντες αὐτῷ
  choice: присоединились к нему
  rationale: Передаёт тесное личное присоединение к Павлу и связь с ним, не сводя выражение к простому физическому следованию.
- source_word: ἐπίστευσαν
  choice: уверовали
  rationale: Прямо передаёт возникновение веры в ответ на проповедь Павла, не добавляя в текст невыраженный объект веры.
- source_word: ἐν οἷς καὶ
  choice: Среди них были
  rationale: Естественно вводит названных далее представителей группы уверовавших; добавочное значение καὶ достаточно выражено самой конструкцией перечисления.
- source_word: Διονύσιος ὁ Ἀρεοπαγίτης
  choice: Дионисий Ареопагит
  rationale: Традиционная и понятная русская передача имени и обозначения связи Дионисия с Ареопагом; точный характер этой связи пояснён в сноске.
- source_word: γυνὴ ὀνόματι Δάμαρις
  choice: женщина по имени Дамарь
  rationale: Естественная русская конструкция, сохраняющая указание на пол и личное имя; «Дамарь» — закрепившаяся русская форма имени.
- source_word: ἕτεροι σὺν αὐτοῖς
  choice: другие вместе с ними
  rationale: Сохраняет указание на дополнительных уверовавших и выраженное σύν сопровождение.
theological_decisions:
- issue: Значение πιστεύω в данном контексте
  choice: уверовали
  alternative: поверили; пришли к вере
  rationale: Глагол сообщает о подлинной вере как отклике на возвещение Павла, но не формулирует здесь её объект или полное вероучительное содержание. «Уверовали» сохраняет эту краткость и богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис разделён на два предложения ради ясности; мужское значение ἄνδρες сохранено. Сноски отмечены в основном тексте.
