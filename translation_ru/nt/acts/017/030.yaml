  text: τοὺς μὲν οὖν χρόνους τῆς ἀγνοίας ὑπεριδὼν ὁ θεὸς τὰ νῦν ⸀παραγγέλλει τοῖς ἀνθρώποις ⸀πάντας πανταχοῦ μετανοεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/030.yaml
  text: Therefore[a], having overlooked the times of ignorance, God now commands all people everywhere to repent[b],
translation:
  language: ru
  text: Итак, оставив без внимания времена неведения[a], Бог теперь повелевает всем людям повсюду покаяться,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пройдя мимо времён неведения». Речь идёт о том, что прежде Бог долготерпеливо не подвергал людей немедленному суду за их неведение, а не о том, что Он одобрял это неведение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὺς μὲν οὖν χρόνους
  choice: Итак, ... времена
  rationale: Оборот вводит переход и сопоставляет прежние времена с нынешним положением; «итак» естественно передаёт οὖν, а контраст раскрывается словами «теперь».
- source_word: τῆς ἀγνοίας
  choice: неведения
  rationale: «Неведение» точно передаёт отсутствие знания в данном контексте, не добавляя отсутствующего в греческом уточнения «о Боге».
- source_word: ὑπεριδὼν
  choice: оставив без внимания
  rationale: Деепричастный оборот сохраняет форму аористного причастия и передаёт смысл прежнего долготерпения, не утверждая одобрения этих времён.
- source_word: τὰ νῦν
  choice: теперь
  rationale: Наречие ясно обозначает нынешнее положение в противоположность прежним временам.
- source_word: παραγγέλλει
  choice: повелевает
  rationale: Передаёт властную силу данного Богом повеления и соответствует возвышенному, но понятному русскому регистру.
- source_word: τοῖς ἀνθρώποις πάντας πανταχοῦ
  choice: всем людям повсюду
  rationale: Сохраняет универсальный охват греческого выражения и не ограничивает его мужчинами.
- source_word: μετανοεῖν
  choice: покаяться
  rationale: Общепринятый библейский глагол сохраняет как изменение внутренней направленности, так и нравственный поворот, не сводя смысл лишь к перемене мыслей.
theological_decisions:
- issue: Смысл прежнего отношения Бога ко «временам неведения»
  choice: Бог оставлял эти времена без внимания в смысле долготерпения и отсутствия немедленного суда.
  alternative: Бог одобрял, полностью извинял или просто игнорировал грех.
  rationale: ὑπεριδών допускает смысл оставления без внимания или прохождения мимо, тогда как нынешнее повеление покаяться сохраняет нравственную ответственность. Примечание удерживает это напряжение, не внося его целиком в текст.
- issue: Охват повеления покаяться
  choice: все люди повсюду
  alternative: только мужчины или только язычники
  rationale: Сочетание τοῖς ἀνθρώποις πάντας πανταχοῦ имеет всеобщий человеческий охват.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Покаяться» выбрано вместо пояснительного «изменить образ мыслей», поскольку оно естественно и сохраняет полноту значения μετανοεῖν. Запятая в конце сохранена по представленному фрагменту стиха.
