source:
  edition: SBLGNT
  text: διερχόμενος γὰρ καὶ ἀναθεωρῶν τὰ σεβάσματα ὑμῶν εὗρον καὶ βωμὸν ἐν ᾧ ἐπεγέγραπτο· Ἀγνώστῳ θεῷ. ⸀ὃ οὖν ἀγνοοῦντες εὐσεβεῖτε, ⸀τοῦτο ἐγὼ καταγγέλλω ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/023.yaml
  text: For as I was passing through and observing your objects of worship[a], I even found an altar on which had been inscribed, ‘To an unknown god.’ Therefore[b], what you worship in ignorance—this I proclaim to you.
translation:
  language: ru
  text: 'Ибо, проходя и внимательно рассматривая ваши святыни, я нашёл также жертвенник с надписью: «Неведомому богу».[a] Итак, то, чему вы поклоняетесь в неведении,[b] я и возвещаю вам.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Неведомому богу». В греческом тексте перед словом «бог» нет артикля; в языках с артиклями возможны переводы «неведомому богу» и «тому неведомому богу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Того, Кого вы почитаете, не зная Его». Однако в греческом употреблено относительное местоимение среднего рода — буквально «то, чему».'
    reason: alternative_reading
lexical_decisions:
- source_word: διερχόμενος
  choice: проходя
  rationale: Настоящее причастие передано деепричастием, естественно выражающим сопутствующее действие.
- source_word: ἀναθεωρῶν
  choice: внимательно рассматривая
  rationale: Передаёт не беглый взгляд, а пристальное наблюдение за религиозными предметами города.
- source_word: τὰ σεβάσματα
  choice: ваши святыни
  rationale: «Святыни» — широкое и естественное русское обозначение почитаемых культовых предметов; оно не сужает значение до храмов или изображений.
- source_word: βωμὸν
  choice: жертвенник
  rationale: Точное традиционное обозначение культового сооружения для жертвоприношений.
- source_word: ἐπεγέγραπτο
  choice: с надписью
  rationale: Естественно по-русски передаёт наличие ранее сделанной надписи на жертвеннике без тяжеловесной пассивной конструкции.
- source_word: Ἀγνώστῳ θεῷ
  choice: НЕВЕДОМОМУ БОГУ
  rationale: Дательный падеж естественно передаёт посвятительную формулу; отсутствие артикля в греческом не позволяет однозначно различить «некому неведомому» и «тому неведомому» богу.
- source_word: ὃ οὖν
  choice: Итак, то
  rationale: «Итак» передаёт вывод οὖν, а средний род ὃ сохраняется посредством безличного «то», без преждевременной персонализации объекта поклонения.
- source_word: ἀγνοοῦντες
  choice: не зная этого
  rationale: Сохраняет игру между «неведомому» и незнанием и выражает обстоятельство, сопровождающее поклонение.
- source_word: εὐσεβεῖτε
  choice: поклоняетесь
  rationale: Ясно передаёт религиозное почитание в данном контексте, не вводя конфессионально специфической терминологии.
- source_word: καταγγέλλω
  choice: возвещаю
  rationale: Передаёт публичное и весомое провозглашение; слово уместно для речи Павла и сохраняет достоинство регистра.
theological_decisions:
- issue: Референт среднего относительного местоимения ὃ
  choice: «то, чему вы поклоняетесь»
  alternative: «Тот, Кому вы поклоняетесь»
  rationale: В греческом стоит местоимение среднего рода. Безличная формулировка сохраняет грамматическую форму и риторическое напряжение, не подменяя её личным «Кому».
- issue: Характер незнания афинян
  choice: «не зная этого»
  alternative: «не ведая Кого»
  rationale: 'Выражение не утверждает сверх того, что сказано в греческом: афиняне оказывают религиозное почитание объекту, которого не знают. Персонализация оставлена как переводческая альтернатива.'
translation_notes:
  register: Современный литературный русский с достоинством публичной речи. Синтаксис остаётся ясным для обычного читателя; «святыни», «жертвенник» и «возвещаю» сохраняют религиозный контекст без архаизации. Прописные буквы визуально отмечают текст надписи.
