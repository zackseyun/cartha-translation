  text: εὐθέως δὲ τότε τὸν Παῦλον ἐξαπέστειλαν οἱ ἀδελφοὶ πορεύεσθαι ⸀ἕως ἐπὶ τὴν θάλασσαν· ⸂ὑπέμεινάν τε⸃ ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/014.yaml
  text: Then the brothers immediately sent Paul away to go as far as the sea[b][a], but both Silas and Timothy remained there.
translation:
  language: ru
  text: Тогда братья[a] сразу же отправили Павла к самому морю[b], а Сила и Тимофей остались там.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «братья и сёстры»; греческое слово буквально означает «братья», но может собирательно обозначать всех верующих.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к морю» или «в сторону моря»; греческий оборот указывает на движение к морскому побережью, не уточняя дальнейший путь.'
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως δὲ τότε
  choice: Тогда … сразу же
  rationale: Передаёт и переход к следующему событию, и безотлагательность действий естественными средствами современного русского языка.
- source_word: ἐξαπέστειλαν
  choice: отправили
  rationale: Глагол обозначает отправление человека из данного места; в русском контексте сам глагол «отправили» ясно подразумевает отбытие.
- source_word: οἱ ἀδελφοὶ
  choice: братья
  rationale: Сохраняет форму и принятую в раннехристианской среде лексику оригинала; возможное собирательное значение пояснено в сноске.
- source_word: πορεύεσθαι ἕως ἐπὶ τὴν θάλασσαν
  choice: к морю
  rationale: Естественно выражает направление движения к морскому побережью, не утверждая, что Павел непременно продолжил путь морем; нюансы греческого оборота сохранены в сноске.
- source_word: ὑπέμεινάν
  choice: остались
  rationale: В данном контексте глагол означает пребывание на прежнем месте, а не перенесение страданий.
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: Сила и Тимофей
  rationale: Русская парная конструкция с союзом «и» естественно передаёт совместное упоминание обоих лиц; противопоставление отъезду Павла уже выражено союзом «а».
- source_word: ἐκεῖ
  choice: там
  rationale: Прямой и естественный русский эквивалент наречия места.
theological_decisions:
- issue: Значение ἀδελφοί как обозначения общины верующих
  choice: братья
  alternative: братья и сёстры; верующие
  rationale: Основной текст сохраняет грамматическую форму и образность греческого слова, не исключая того, что в контексте оно могло обозначать всю общину; это поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и динамичное. «Сразу же» звучит естественнее канцелярского «немедленно», а «к морю» сохраняет пространственную неопределённость исходного оборота.
