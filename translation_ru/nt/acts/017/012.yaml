  text: πολλοὶ μὲν οὖν ἐξ αὐτῶν ἐπίστευσαν, καὶ τῶν Ἑλληνίδων γυναικῶν τῶν εὐσχημόνων καὶ ἀνδρῶν οὐκ ὀλίγοι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/012.yaml
  text: Therefore many of them believed[b][a], and not a few of the prominent Greek women and men.
translation:
  language: ru
  text: Поэтому многие из них поверили, в том числе немало видных гречанок и немало мужчин.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ μὲν οὖν
  choice: Поэтому многие
  rationale: 'Сочетание μὲν οὖν обозначает переход и вывод из предыдущего стиха: верийцы исследовали Писания, и поэтому многие поверили.'
- source_word: ἐξ αὐτῶν
  choice: из них
  rationale: Естественно передаёт партитивное значение ἐξ и отсылает к упомянутым ранее людям.
- source_word: ἐπίστευσαν
  choice: поверили
  rationale: Прямой эквивалент πιστεύω; объект веры понятен из контекста, поэтому его не следует добавлять.
- source_word: τῶν Ἑλληνίδων γυναικῶν
  choice: гречанок
  rationale: Краткое и естественное русское обозначение женщин греческого происхождения; брачные отношения текстом не подразумеваются.
- source_word: τῶν εὐσχημόνων
  choice: знатных
  rationale: В данном контексте слово указывает на заметное, высокое общественное положение, а не только на личную порядочность.
- source_word: καὶ ἀνδρῶν οὐκ ὀλίγοι
  choice: а также немало ... мужчин
  rationale: «Немало» сохраняет литоту οὐκ ὀλίγοι и при этом звучит естественно по-русски; «а также» ясно присоединяет ещё одну группу.
theological_decisions:
- issue: Следует ли конкретизировать содержание веры в переводе ἐπίστευσαν
  choice: поверили
  alternative: уверовали в Мессию / поверили проповеди
  rationale: В самом стихе объект не назван и восстанавливается из контекста. Простой глагол сохраняет формулировку и не вносит отсутствующего здесь doctrинального уточнения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. Сохранена литота «немало»; компактное «гречанок» устраняет тяжеловесность сочетания «греческих женщин». Порядок групп передан естественно для русского языка без изменения смысла.
