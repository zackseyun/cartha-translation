id: ACT.17.24
reference: Acts 17:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ὁ θεὸς ὁ ποιήσας τὸν κόσμον καὶ πάντα τὰ ἐν αὐτῷ, οὗτος οὐρανοῦ καὶ γῆς ⸂ὑπάρχων κύριος⸃ οὐκ ἐν χειροποιήτοις ναοῖς κατοικεῖ
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/024.yaml
  text: The God who made the world and everything in it[a], being Lord of heaven and earth, does not dwell in temples made by hands.
translation:
  language: ru
  text: Бог, сотворивший мир и всё, что в нём, будучи Господом неба и земли, не обитает в рукотворных храмах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в храмах, сделанных человеческими руками».'
    reason: Лексическая альтернатива поясняет значение слова «рукотворных».
lexical_decisions:
- source_word: ποιήσας
  choice: сотворивший
  rationale: Аористное причастие определяет Бога. «Сотворивший» естественно для современного литературного русского языка и передаёт действие Творца без синтаксической тяжеловесности.
- source_word: κόσμον
  choice: мир
  rationale: Здесь κόσμος обозначает сотворённый мир как целое; «мир» — ясный и традиционный русский эквивалент.
- source_word: πάντα τὰ ἐν αὐτῷ
  choice: всё, что в нём
  rationale: Оборот сохраняет всеохватность πάντα и естественно раскрывает субстантивированную греческую конструкцию.
- source_word: ὑπάρχων κύριος
  choice: будучи Господом
  rationale: Причастный оборот передаёт существующее положение Бога как Господа и не навязывает причинного смысла («поскольку Он Господь»).
- source_word: οὐρανοῦ καὶ γῆς
  choice: неба и земли
  rationale: Родительные падежи зависят от κύριος; устойчивое сочетание «неба и земли» точно и естественно.
- source_word: χειροποιήτοις
  choice: рукотворных
  rationale: Слово означает сделанное человеческими руками. «Рукотворных» кратко, точно и сохраняет контраст между Творцом и человеческими сооружениями.
- source_word: ναοῖς
  choice: храмах
  rationale: ναός обозначает храм как священное место или предполагаемое жилище божества; «храмах» ясно соответствует контексту Ареопага.
- source_word: κατοικεῖ
  choice: обитает
  rationale: «Обитает» передаёт длительное пребывание или жительство, сохраняет храмовую образность и остаётся понятным в современном русском языке.
theological_decisions:
- issue: Божественная трансцендентность и локализация Бога в храме
  choice: Прямо сказано, что Творец и Господь неба и земли не обитает в созданных людьми храмах.
  alternative: 'Можно было бы пояснительно перевести: «не ограничен храмами» или «не заключён в храмах».'
  rationale: Перевод сохраняет прямое утверждение греческого текста и не расширяет его богословским истолкованием о «неограниченности», хотя оно согласуется с контекстом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Причастные обороты сохранены ради структуры и богословской напряжённости оригинала, но фраза остаётся естественной и понятной.
