  variant: modern literary Russian
source:
  edition: SBLGNT
  text: οὗτοι δὲ ἦσαν εὐγενέστεροι τῶν ἐν Θεσσαλονίκῃ, οἵτινες ἐδέξαντο τὸν λόγον μετὰ πάσης προθυμίας, ⸀τὸ καθ’ ἡμέραν ἀνακρίνοντες τὰς γραφὰς εἰ ἔχοι ταῦτα οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/011.yaml
  text: These were more noble-minded than those in Thessalonica[a], for they received the word with all eagerness[b], examining the Scriptures daily to see whether these things were so.
translation:
  language: ru
  text: 'Они были благороднее[a] жителей Фессалоники: приняли слово с полной готовностью[b], ежедневно исследуя Писания, чтобы проверить, так ли всё это.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «более благородного склада ума». Греческое слово может обозначать также более знатное происхождение или положение, хотя здесь контекст скорее указывает на достойный образ мыслей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с большим усердием»; «с горячим желанием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐγενέστεροι
  choice: благороднее
  rationale: Сравнительное прилагательное допускает значение как знатности по происхождению, так и благородства характера. Последующее описание — готовность принять слово и исследование Писаний — указывает прежде всего на достойный образ мыслей; краткое «благороднее» сохраняет и оценочный оттенок, и исходную неоднозначность.
- source_word: οἵτινες
  choice: двоеточие и продолжение «приняли»
  rationale: Местоимение вводит пояснение, в чём проявилось их благородство. В русском языке это естественно передаётся бессоюзным пояснением после двоеточия.
- source_word: ἐδέξαντο τὸν λόγον
  choice: приняли слово
  rationale: Передаёт обычную для Деяний формулу и сохраняет смысловую связь λόγος с библейским «словом», не сужая его до нейтрального «сообщения».
- source_word: μετὰ πάσης προθυμίας
  choice: со всей готовностью
  rationale: προθυμία обозначает готовность, усердие и горячее желание; выбранный вариант естественен по-русски и передаёт усиление πάσης.
- source_word: τὸ καθ’ ἡμέραν
  choice: каждый день
  rationale: Ясно и естественно выражает регулярность действия.
- source_word: ἀνακρίνοντες
  choice: исследовали
  rationale: Глагол означает тщательно рассматривать, проверять или расследовать. «Исследовали» хорошо сочетается с Писаниями и не вносит излишне судебной окраски.
- source_word: τὰς γραφὰς
  choice: Писания
  rationale: В данном контексте речь идёт о священных иудейских Писаниях; прописная буква отражает это устойчивое употребление.
- source_word: εἰ ἔχοι ταῦτα οὕτως
  choice: проверяя, так ли всё это
  rationale: Передаёт косвенный вопрос и цель ежедневного исследования — установить, соответствуют ли услышанные утверждения Писаниям, не подменяя формулировку более категоричным «правда ли это».
theological_decisions:
- issue: Значение εὐγενέστεροι
  choice: В основном характеристика благородства склада ума и поведения, при сохранении краткого «благороднее»
  alternative: Знатнее по происхождению или общественному положению
  rationale: Контекст объясняет сравнительную оценку их готовым принятием слова и проверкой по Писаниям. Однако само греческое слово способно обозначать и знатность, поэтому альтернативное значение вынесено в примечание.
- issue: Передача λόγος
  choice: слово
  alternative: весть / учение
  rationale: «Слово» сохраняет лексику оригинала и повествовательно-богословскую связь с употреблением λόγος в Деяниях, не добавляя конфессионального толкования.
- issue: Отношение принятия слова к проверке Писаний
  choice: Оба действия представлены как взаимодополняющие признаки достойного отношения
  alternative: Проверка как выражение недоверия или принятие как некритическое согласие
  rationale: Текст соединяет готовность принять слово с ежедневным исследованием Писаний и не противопоставляет их.
translation_notes:
  register: Современный литературный русский, ясный и dignified. Синтаксис с двоеточием естественно выражает пояснительную функцию οἵτινες. «Фессалоникийцев» избегает тяжеловесного повтора «тех, кто был в Фессалонике». Все маркеры примечаний присутствуют в основном тексте.
