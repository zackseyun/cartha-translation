id: ACT.17.20
reference: Acts 17:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ξενίζοντα γάρ τινα εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν· βουλόμεθα οὖν γνῶναι ⸂τίνα θέλει⸃ ταῦτα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/020.yaml
  text: For you are bringing some strange things to our ears[b][a]. Therefore we want to know what these things mean.
translation:
  language: ru
  text: Ведь ты доносишь до наших ушей нечто непривычное[a]. Поэтому мы хотим знать, что всё это означает[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечто чуждое»; «нечто незнакомое». Греческое слово может обозначать то, что кажется странным, поскольку оно ново или чуждо слушателю.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чем всё это хочет быть» — греческий оборот со значением «что всё это означает» или «какой в этом смысл».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ξενίζοντα τινα
  choice: нечто непривычное
  rationale: Передаёт неопределённость τινα и значение ξενίζοντα как нового, чуждого или незнакомого слушателям, не усиливая смысл до «поразительного».
- source_word: εἰσφέρεις εἰς τὰς ἀκοὰς ἡμῶν
  choice: ты доносишь до наших ушей
  rationale: Сохраняет телесную метафору греческого выражения и при этом естественно звучит по-русски.
- source_word: βουλόμεθα οὖν γνῶναι
  choice: Поэтому мы хотим знать
  rationale: Прямо передаёт волеизъявление βουλόμεθα, значение инфинитива γνῶναι и логическое следствие, отмеченное οὖν.
- source_word: τίνα θέλει ταῦτα εἶναι
  choice: что всё это означает
  rationale: Естественно передаёт греческий идиоматический вопрос о смысле и значении сказанного, а не только о его формальном определении.
- source_word: γάρ
  choice: Ведь
  rationale: Связывает реплику с предшествующей просьбой и естественно выражает пояснительно-причинное значение частицы.
