  text: Ἀκούσαντες δὲ ἀνάστασιν νεκρῶν οἱ μὲν ἐχλεύαζον οἱ δὲ εἶπαν Ἀκουσόμεθά σου ⸂περὶ τούτου καὶ πάλιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/032.yaml
  text: When they heard of the resurrection of the dead[a], some mocked, but others said, “We will hear you again about this.”
translation:
  language: ru
  text: 'Когда же они услышали о воскресении мёртвых, одни стали насмехаться, а другие сказали: «Мы послушаем тебя об этом ещё раз».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσαντες δὲ
  choice: Когда же они услышали
  rationale: Аористное причастие передаёт обстоятельство времени, а δὲ отмечает переход и лёгкое противопоставление; сочетание «когда же» естественно для современного русского повествования.
- source_word: ἀνάστασιν νεκρῶν
  choice: о воскресении мёртвых
  rationale: Передаёт воскресение умерших как обсуждаемое понятие, не уточняя сверх текста, идёт ли речь здесь об общем воскресении или о воскресении из среды мёртвых.
- source_word: οἱ μὲν ... οἱ δὲ
  choice: одни ... а другие
  rationale: Естественно и точно воспроизводит сопоставление двух групп слушателей.
- source_word: ἐχλεύαζον
  choice: стали насмехаться
  rationale: Имперфект описывает разворачивавшуюся реакцию; «стали насмехаться» естественно передаёт её возникновение после услышанного, не усиливая значение до «глумились».
- source_word: Ἀκουσόμεθά σου
  choice: Мы послушаем тебя
  rationale: Глагол ἀκούω с местоимением в родительном падеже означает слушать человека; «послушаем тебя» в русском ясно передаёт обещание снова выслушать Павла.
- source_word: περὶ τούτου καὶ πάλιν
  choice: об этом ещё раз
  rationale: Сохраняет и предмет речи, и явное значение καὶ πάλιν; русское расположение слов звучит естественно.
theological_decisions:
- issue: Смысл выражения ἀνάστασιν νεκρῶν в обращении к языческой аудитории
  choice: воскресение мёртвых
  alternative: воскресение из мёртвых
  rationale: Родительный νεκρῶν естественно обозначает мёртвых как тех, кто воскресает. Формулировка не добавляет к словам Павла конфессионального толкования и сохраняет широту греческого выражения.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанно торжественное. Реплика передана естественно, без архаизмов и без устранения явного καὶ πάλιν.
