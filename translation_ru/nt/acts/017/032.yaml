  source_fidelity: 'Текст точно передаёт синтаксис и смысл греческого оригинала: обстоятельственное «Когда же они услышали», противопоставление «одни ... а другие», реакцию на «воскресение мёртвых» и будущую реплику второй группы. «Ещё раз» корректно сохраняет явное καὶ πάλιν.'
  naturalness: Современный литературный русский, плавный и естественный для повествовательного контекста. «Стали насмехаться» допустимо передаёт разворачивающуюся реакцию, выраженную имперфектом, без ненужной грубости.
