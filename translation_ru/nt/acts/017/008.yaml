  source_fidelity: Греческий глагол ἐτάραξαν стоит в действительном залоге и имеет подразумеваемое из контекста подлежащее («они»), тогда как исходный русский вариант превращает «толпу и городские власти» в самостоятельный субъект состояния. Исправление сохраняет действие подразумеваемых лиц над обеими группами. Временное значение ἀκούοντας ταῦτα передано конструкцией «когда те услышали это».
  naturalness: «Они встревожили толпу и городских должностных лиц, когда те услышали это» — ясная и естественная для современного литературного русского повествовательная фраза. Указательное «те» однозначно относит слышание к толпе и должностным лицам, а не к подразумеваемым деятелям.
  terminology: «Толпа» точнее передаёт ὄχλος как собравшуюся группу, не придавая слову обязательно значение «моба». «Городские должностные лица» сохраняет личный и служебный характер πολιτάρχας; сноска уместно сообщает исторический македонский титул.
