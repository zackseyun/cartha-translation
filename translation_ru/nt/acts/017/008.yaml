lexical_decisions:
- source_word: ἐτάραξαν
  choice: пришли в смятение
  rationale: Глагол передаёт вызванное услышанным беспокойство или волнение. Русская конструкция естественно относится одновременно и к народу, и к городским властям, не усиливая значение до открытого мятежа.
- source_word: δὲ
  choice: не выражено отдельно
  rationale: Здесь δέ служит слабой повествовательной связкой; в современном русском при продолжении рассказа её естественно оставить без отдельного соответствия.
- source_word: τὸν ὄχλον
  choice: народ
  rationale: В данном общественном контексте ὄχλος обозначает собравшихся людей. «Народ» звучит естественно рядом с городскими властями и не привносит враждебного оттенка слова «толпа».
- source_word: τοὺς πολιτάρχας
  choice: городские власти
  rationale: πολιτάρχης — местный македонский титул должностных лиц. Функциональный перевод понятен современному читателю, а историческая точность отмечена в сноске.
- source_word: ἀκούοντας ταῦτα
  choice: услышав это
  rationale: Причастный оборот относится к обоим объектам глагола. В русском единственное «это» естественно обозначает совокупность только что сказанного, хотя греческое ταῦτα формально имеет множественное число.
