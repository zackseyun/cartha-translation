translation_notes:
  register: Современный литературный русский язык с естественным повествовательным синтаксисом. «Сопровождавшие» и «поручение» сохраняют достоинство стиля без канцелярской тяжеловесности; неоднозначность силы слова ἐντολή не превращена в авторитарное «приказ».
