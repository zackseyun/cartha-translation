  text: οἱ δὲ ⸀καθιστάνοντες τὸν Παῦλον ⸀ἤγαγον ἕως Ἀθηνῶν, καὶ λαβόντες ἐντολὴν πρὸς τὸν Σιλᾶν καὶ ⸀τὸν Τιμόθεον ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτὸν ἐξῄεσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/015.yaml
  text: Those who were escorting Paul brought him as far as Athens[a], and after receiving instructions for Silas and Timothy to come to him as quickly as possible[b], they departed.
translation:
  language: ru
  text: Сопровождавшие Павла довели его до Афин[a] и, получив распоряжение для Силы и Тимофея, чтобы они как можно скорее пришли к нему[b], ушли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «привели его в Афины». Греческое выражение подчёркивает предел сопровождения — вплоть до Афин.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «получив повеление». Греческое слово может означать как распоряжение или указание, так и более властный приказ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καθιστάνοντες
  choice: сопровождавшие
  rationale: Причастие обозначает людей, сопровождавших Павла в пути; этот выбор естественно передаёт помощь в дороге, не добавляя прямо не выраженной идеи вооружённой охраны.
- source_word: ἤγαγον
  choice: довели
  rationale: Глагол описывает завершённое сопровождение Павла до места назначения и хорошо сочетается с «до Афин».
- source_word: ἕως Ἀθηνῶν
  choice: до Афин
  rationale: ἕως с названием места указывает на предел движения — вплоть до указанного пункта.
- source_word: λαβόντες ἐντολήν
  choice: получив поручение
  rationale: ἐντολή допускает значения «повеление» и «поручение»; в данном контексте речь идёт о передаче указания сотрудникам Павла, поэтому «поручение» звучит естественно и не ослабляет обязательности сообщения.
- source_word: πρὸς τὸν Σιλᾶν καὶ τὸν Τιμόθεον
  choice: для Силы и Тимофея
  rationale: πρός указывает на адресатов поручения; русский оборот ясно передаёт, кому его следовало доставить.
- source_word: ἵνα ὡς τάχιστα ἔλθωσιν πρὸς αὐτόν
  choice: как можно скорее прийти к нему
  rationale: Переданы содержание поручения, предельная срочность ὡς τάχιστα и явное местоимение αὐτόν.
- source_word: ἐξῄεσαν
  choice: отправились обратно
  rationale: В контексте сопровождавшие, доставив Павла и получив поручение для оставшихся в Македонии Силы и Тимофея, уходят от него; «обратно» естественно обозначает подразумеваемое направление, однако оно отмечено сноской как контекстуальное уточнение.
