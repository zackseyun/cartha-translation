base_translation:
  language: en
  yaml_path: translation/nt/acts/017/007.yaml
  text: These men[a], whom Jason has welcomed, are all acting against Caesar’s decrees[c][b], saying that there is another king—Jesus.
translation:
  language: ru
  text: Все эти люди, которых Иасон принял у себя[a], поступают вопреки указам[b] кесаря, говоря, что есть другой царь[c] — Иисус.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приютил»; греческий глагол может означать, что Иасон принял их как гостей и оказал им гостеприимство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «постановлениям кесаря»; речь идёт об официальных решениях или предписаниях.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «иной царь». Греческий текст говорит о другом царе; в контексте обвинения это представляет Иисуса как соперника власти кесаря.'
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποδέδεκται
  choice: принял их у себя
  rationale: Перфектная форма передаёт состоявшийся приём с сохраняющимся значением для обвинения; выражение естественно обозначает гостеприимство Иасона, не добавляя сверх текста идеи длительного укрывательства.
- source_word: ἀπέναντι
  choice: вопреки
  rationale: В сочетании с родительным падежом слово выражает противоречие или противостояние; «вопреки» естественно звучит в контексте обвинения в нарушении официальных предписаний.
- source_word: δογμάτων
  choice: указам
  rationale: В римском гражданско-политическом контексте речь идёт об официальных постановлениях или предписаниях; «указы» понятно современному читателю и сохраняет официальный оттенок.
- source_word: πράσσουσι
  choice: поступают
  rationale: Настоящее время представляет это как совершаемое ими поведение; «поступают вопреки» идиоматично передаёт обвинение в продолжающемся нарушении.
- source_word: βασιλέα ἕτερον
  choice: другой царь
  rationale: βασιλεύς означает именно «царь», а ἕτερος указывает на другого, отличного претендента; прямой перевод сохраняет политическую остроту обвинения.
- source_word: λέγοντες
  choice: говоря
  rationale: Причастие поясняет, в чём обвинители видят противодействие указам кесаря. Нейтральное «говоря» не усиливает слова до «утверждая» или «провозглашая».
- source_word: εἶναι Ἰησοῦν
  choice: что есть … Иисус
  rationale: Русская конструкция с придаточным передаёт содержание инфинитивного оборота, а конечное приложение «Иисус» сохраняет смысловое ударение на имени.
- source_word: οὗτοι πάντες
  choice: все они
  rationale: Формулировка сохраняет собирательный и всеохватывающий характер обвинения и естественно связывает указание с уже названными людьми.
theological_decisions:
- issue: Политический смысл обвинения, связанного с царским достоинством Иисуса
  choice: Сохранить прямое обвинение в том, что они говорят об Иисусе как о другом царе.
  alternative: Передать βασιλεύς более общо как «правитель» или истолковать царство исключительно в духовном смысле.
  rationale: Упоминание указов кесаря придаёт обвинению явный политический смысл. Перевод «царь» сохраняет историческую и богословскую напряжённость текста, не объясняя заранее характер царствования Иисуса.
translation_notes:
  register: Современный литературный русский язык с умеренно официальной лексикой, соответствующей судебно-политическому обвинению. «Кесарь» сохранён как традиционное библейское обозначение римского императора; синтаксис остаётся ясным и доступным, а политический смысл не смягчается.
