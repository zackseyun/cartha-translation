  text: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ εἰσῆλθεν πρὸς αὐτοὺς καὶ ἐπὶ σάββατα τρία διελέξατο αὐτοῖς ἀπὸ τῶν γραφῶν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/002.yaml
  text: And according to Paul's custom[a], he went in to them, and on three Sabbaths he reasoned with them from the Scriptures[c][b],
translation:
  language: ru
  text: По своему обыкновению Павел вошёл к ним и три субботы рассуждал с ними на основании Писаний.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на протяжении трёх суббот».'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ δὲ τὸ εἰωθὸς τῷ Παύλῳ
  choice: По своему обыкновению Павел
  rationale: Оборот с κατά и субстантивированным причастием от εἴωθα обозначает установившийся обычай. «По своему обыкновению» естественно и точно передаёт привычный образ действий Павла.
- source_word: εἰσῆλθεν πρὸς αὐτοὺς
  choice: вошёл к ним
  rationale: Сохраняет значение движения внутрь у εἰσέρχομαι и направленность πρὸς αὐτούς, не подставляя прямо названную синагогу из контекста вместо местоимения исходного текста.
- source_word: ἐπὶ σάββατα τρία
  choice: три субботы
  rationale: В сочетании с глаголом продолженного речевого взаимодействия естественно обозначает три субботних дня, когда Павел встречался с ними. Русская формулировка сохраняет некоторую допустимую неоднозначность между повторением по субботам и временной протяжённостью.
- source_word: διελέξατο αὐτοῖς
  choice: рассуждал с ними
  rationale: διαλέγομαι здесь подразумевает содержательное обсуждение с доводами. «Рассуждал с ними» передаёт и диалогический, и аргументативный оттенки, не предполагая враждебного спора.
- source_word: ἀπὸ τῶν γραφῶν
  choice: на основании Писаний
  rationale: Предлог ἀπό указывает на источник доводов; «на основании» ясно передаёт опору рассуждения на признанные священные тексты. Множественное «Писаний» сохраняет форму и религиозный смысл γραφῶν.
theological_decisions:
- issue: К кому Павел вошёл
  choice: Сохранить местоимение «к ним»
  alternative: «вошёл в синагогу» или «пришёл к иудеям»
  rationale: Хотя предшествующий контекст указывает на синагогу и находившихся там людей, сам стих использует местоимение. Перевод не добавляет отсутствующей в данном предложении конкретизации.
- issue: Характер общения Павла со слушателями
  choice: «рассуждал с ними»
  alternative: «спорил с ними» или «беседовал с ними»
  rationale: Выбранная формулировка сохраняет богословски значимое сочетание диалога и доказательного обращения к Писаниям, не изображая разговор непременно конфликтным и не ослабляя его аргументативности.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный библейского повествования. «Обыкновение» несколько возвышенно, но общеупотребительно и уместно; синтаксис остаётся ясным. Маркер сноски поставлен непосредственно после относящегося к ней предложения.
