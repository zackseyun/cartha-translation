base_translation:
  language: en
  yaml_path: translation/nt/acts/017/025.yaml
  text: Nor is he served by human hands[a], as though he needed anything, since he himself gives to all life and breath and all things.
translation:
  language: ru
  text: И Ему не служат человеческими руками[a], как если бы Он в чём-либо нуждался, ведь Он Сам даёт всем жизнь, дыхание и всё остальное.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ему не оказывают служения человеческими руками». Греческий глагол может обозначать служение или заботу, в том числе в религиозном контексте; здесь подчёркнуто, что Бог не зависит от человеческого служения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: И … не
  rationale: Продолжает отрицательное утверждение предыдущего стиха; по-русски связь естественно передаётся сочетанием «И … не».
- source_word: ὑπὸ χειρῶν ἀνθρωπίνων
  choice: человеческие руки
  rationale: Сохранён конкретный библейский образ; пассивная греческая конструкция естественно передана русским неопределённо-личным оборотом.
- source_word: θεραπεύεται
  choice: Ему … служат
  rationale: В контексте речь идёт не об исцелении, а об услужении, в том числе религиозном; формулировка подчёркивает, что Бог не зависит от человеческого служения.
- source_word: προσδεόμενός τινος
  choice: как если бы Он в чём-либо нуждался
  rationale: Передаёт обстоятельственный и риторический смысл причастия, не превращая его в отдельное категорическое утверждение.
- source_word: αὐτὸς
  choice: Он Сам
  rationale: 'Сохраняет эмфатическое противопоставление: Бог не получает необходимое от людей, но Сам всё даёт.'
- source_word: διδοὺς
  choice: даёт
  rationale: Личная форма естественно передаёт по-русски причинную связь причастного оборота с предшествующим утверждением.
- source_word: πᾶσι
  choice: всем
  rationale: Сохраняет широкий, не ограниченный явно только людьми охват греческого слова.
- source_word: ζωὴν
  choice: жизнь
  rationale: Прямое и общеупотребительное соответствие.
- source_word: πνοὴν
  choice: дыхание
  rationale: В сочетании с «жизнью» обозначает дыхание живых существ; перевод «дух» неоправданно сужал бы толкование.
- source_word: καὶ τὰ πάντα
  choice: и всё остальное
  rationale: 'Естественно выражает итоговое расширение: помимо жизни и дыхания Бог даёт всё вообще, избегая стилистически тяжёлого «всё» после перечисления.'
theological_decisions:
- issue: Следует ли передавать θεραπεύεται явно культовым словом «поклоняются» или более широким «служат»
  choice: Ему не служат
  alternative: Ему не поклоняются; Ему не прислуживают
  rationale: Глагол допускает религиозный контекст, но довод Павла сосредоточен на том, что Бог не нуждается в человеческих услугах. «Служат» сохраняет культовый оттенок, не сводя смысл только к поклонению.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены образ «человеческих рук», эмфаза «Он Сам» и причинная логика стиха; неоднозначность культового оттенка θεραπεύεται отмечена в сноске.
