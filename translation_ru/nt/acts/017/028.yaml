source:
  edition: SBLGNT
  text: ἐν αὐτῷ γὰρ ζῶμεν καὶ κινούμεθα καὶ ἐσμέν, ὡς καί τινες τῶν καθ’ ὑμᾶς ποιητῶν εἰρήκασιν· Τοῦ γὰρ καὶ γένος ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/028.yaml
  text: For in him we live and move and exist, as even some of your own poets have said, ‘For we also are his offspring.’
translation:
  language: ru
  text: 'Ведь в Нём мы живём, движемся и существуем, как говорили даже некоторые из ваших поэтов: «Мы ведь также Его потомство».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мы ведь также Его род». Греческое слово γένος может обозначать род, происхождение или потомство.'
    reason: Указывает буквальный и более широкий вариант передачи γένος, сохраняя в основном тексте естественную для данного контекста формулировку.
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: в Нём
  rationale: Сохраняет пространственно-сферическую метафору греческого текста и её богословскую ёмкость.
- source_word: κινούμεθα
  choice: движемся
  rationale: Прямой и естественный эквивалент среднего/пассивного глагола; не сужает смысл до физического перемещения или божественного побуждения.
- source_word: ἐσμέν
  choice: существуем
  rationale: В данном трёхчленном ряду передаёт значение бытия естественнее, чем повторное «есть», и соответствует контексту зависимости существования от Бога.
- source_word: γένος
  choice: род
  rationale: Сохраняет широкий смысл происхождения и родства, не вводя более узкое биологическое «потомство» и не приравнивая людей к Божьим детям в специальном богословском смысле.
theological_decisions:
- issue: Смысл утверждения «Его род»
  choice: Сохранена формулировка о роде/происхождении без уточнения характера сыновства.
  alternative: «Его дети» или «Его потомство»
  rationale: γένος выражает родство или происхождение, но само по себе не утверждает усыновление или спасительное сыновство; более конкретный перевод мог бы снять намеренную широту выражения.
- issue: Сфера человеческого существования «в Нём»
  choice: Буквально сохранено «в Нём».
  alternative: «благодаря Ему»
  rationale: Причинное толкование возможно по смыслу, но греческое ἐν αὐτῷ формально шире; буквальная метафора сохраняет неоднозначность отношения Бога к жизни, движению и бытию людей.
translation_notes:
  register: Современный литературный русский язык с достойным публично-речевым звучанием. «Ведь» естественно передаёт двукратное γάρ; тире в цитате делает именное сказуемое ясным. Местоимение «Нём/Его» написано с прописной буквы по принятой русской библейской традиции.
