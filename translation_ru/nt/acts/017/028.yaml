- from: 'Ведь в Нём мы живём, движемся и существуем, как сказали и некоторые из ваших поэтов: «Ведь и мы — Его род».[a]'
  to: 'Ведь в Нём мы живём, движемся и существуем, как говорили даже некоторые из ваших поэтов: «Мы ведь также Его потомство».[a]'
  rationale: 'Исправлены естественность синтаксиса и передача γένος в цитате. Смысл исходного текста, включая два γάρ и два καί, сохранён: «Ведь» и «ведь» передают γάρ, «даже» и «также» передают соответствующие καί. Сноска оставляет читателю широкий вариант «род» без доктринального уточнения.'
