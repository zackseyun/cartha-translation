source:
  edition: SBLGNT
  text: τινὲς δὲ καὶ τῶν Ἐπικουρείων ⸀καὶ Στοϊκῶν φιλοσόφων συνέβαλλον αὐτῷ, καί τινες ἔλεγον· Τί ἂν θέλοι ὁ σπερμολόγος οὗτος λέγειν; οἱ δέ· Ξένων δαιμονίων δοκεῖ καταγγελεὺς εἶναι· ὅτι τὸν Ἰησοῦν καὶ τὴν ἀνάστασιν εὐηγγελίζετο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/018.yaml
  text: Some of the Epicurean and Stoic philosophers also engaged with him[a], and some were saying, “What is this babbler trying to say?” But others said[d][c][b], “He seems to be a proclaimer of foreign deities,” because he was proclaiming the good news about Jesus and the resurrection.
translation:
  language: ru
  text: 'Некоторые из эпикурейских и стоических философов также обсуждали с ним[a]. Одни говорили: «Что пытается сказать этот болтун[b]?» Другие же говорили: «Похоже, он — провозвестник чужеземных божеств»[c][d], — потому что он возвещал благую весть об Иисусе и воскресении.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спорили с ним» или «беседовали с ним»; греческий глагол может обозначать как беседу, так и спор.'
    reason: lexical_alternative
  - marker: b
    text: Греческое бранное слово буквально связано с подбором семян и обозначало человека, который собирает и повторяет обрывки чужих мыслей.
    reason: cultural_note
  - marker: c
    text: 'Или: «чужеземных духов» или «странных богов». Здесь имеются в виду незнакомые божественные существа в представлении самих афинян, а не обязательно злые духи в христианском понимании.'
    reason: alternative_reading
  - marker: d
    text: Возможно, афиняне приняли «воскресение» за имя ещё одного божества, поскольку Павел возвещал об Иисусе и воскресении.
    reason: alternative_reading
lexical_decisions:
- source_word: συνέβαλλον αὐτῷ
  choice: вступали с ним в беседу
  rationale: Глагол обозначает встречу и взаимодействие в разговоре, которое могло включать спор. Формулировка сохраняет широкий смысл и естественна для философской среды.
- source_word: σπερμολόγος
  choice: пустослов
  rationale: Презрительное обозначение человека, подбирающего обрывки чужих мыслей и повторяющего их. «Пустослов» передаёт насмешливую оценку без неясной буквальной метафоры.
- source_word: Τί ἂν θέλοι ... λέγειν
  choice: Что хочет сказать... ?
  rationale: Передаёт предположительный и пренебрежительный оттенок конструкции с ἄν и оптативом естественным русским вопросом.
- source_word: Ξένων δαιμονίων
  choice: чужеземных божеств
  rationale: В устах афинских язычников δαιμόνια означает незнакомых им божественных существ, а не обязательно злых духов в христианском понимании.
- source_word: καταγγελεὺς
  choice: возвещает
  rationale: Предикативное существительное естественно передано русским глаголом публичного объявления; смысл сохранён без тяжеловесного «возвеститель».
- source_word: εὐηγγελίζετο
  choice: возвещал благую весть
  rationale: Явно сохраняет значение сообщения благой вести, а не сводит его к более общему «проповедовал».
- source_word: ἀνάστασιν
  choice: воскресении
  rationale: Оставлено нарицательным существительным как содержание проповеди Павла; возможное ошибочное восприятие его афинянами вынесено в примечание.
- source_word: Ἐπικουρείων καὶ Στοϊκῶν φιλοσόφων
  choice: эпикурейских и стоических философов
  rationale: Естественно и точно называет представителей двух философских школ.
theological_decisions:
- issue: Передача δαιμόνια в речи язычников
  choice: чужеземных божеств
  alternative: чужеземных демонов; странных богов
  rationale: Выбранная формулировка передаёт категории самих афинян и не привносит в их слова более позднее христианское понимание демонов.
- issue: Возможная персонификация ἀνάστασις
  choice: воскресении со строчной буквы
  alternative: Воскресении как имени божества
  rationale: Пояснение Луки сообщает содержание благовестия Павла. Возможность того, что слушатели приняли воскресение за отдельное божество, реальна, но не утверждается текстом и потому отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис упрощён без потери противопоставления реакций; терминология философских школ сохранена. Сноски помещены у слов, к которым относятся.
