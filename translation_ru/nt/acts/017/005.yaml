id: ACT.17.5
reference: Acts 17:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: SBLGNT
  text: ⸂ζηλώσαντες δὲ οἱ Ἰουδαῖοι καὶ προσλαβόμενοι⸃ τῶν ἀγοραίων ⸂ἄνδρας τινὰς⸃ πονηροὺς καὶ ὀχλοποιήσαντες ἐθορύβουν τὴν πόλιν, ⸂καὶ ἐπιστάντες⸃ τῇ οἰκίᾳ Ἰάσονος ἐζήτουν αὐτοὺς ⸀προαγαγεῖν εἰς τὸν δῆμον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/017/005.yaml
  text: But the Jews[a], becoming jealous and taking along some wicked men from the marketplace, formed a mob and were throwing the city into an uproar; and coming to Jason’s house, they were seeking to bring them out to the assembly.
translation:
  language: ru
  text: Но иудеи, позавидовав, взяли с собой нескольких негодных мужчин с рыночной площади, собрали толпу и стали будоражить город. Придя к дому Иасона, они пытались вывести их к народному собранию[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к публичному собранию» или «перед народом». Греческое δῆμος обозначает собравшийся гражданский корпус, а не просто неопределённую толпу.'
    reason: 'Лексическая альтернатива: сохранение общественно-гражданского значения δῆμος без добавления судебного значения.'
lexical_decisions:
- source_word: ζηλώσαντες
  choice: позавидовав
  rationale: Аористное причастие обозначает мотив, предшествующий последующим действиям. «Позавидовав» естественно передаёт возникшую зависть, не превращая её в постоянное состояние.
- source_word: οἱ Ἰουδαῖοι
  choice: иудеи
  rationale: Греческий текст прямо говорит «иудеи» и не уточняет «иудейские руководители». Контекст ограничивает референта конкретными противниками в Фессалонике.
- source_word: προσλαβόμενοι
  choice: привлекли к себе
  rationale: Средний залог передаёт присоединение других людей к собственной группе; выражение не предполагает непременно формального найма.
- source_word: τῶν ἀγοραίων
  choice: с рыночной площади
  rationale: Слово указывает на людей, находившихся на агоре, то есть рыночной и общественной площади. Перевод не добавляет отсутствующей в тексте характеристики вроде «бездельники».
- source_word: ἄνδρας τινὰς πονηρούς
  choice: нескольких негодных мужчин
  rationale: «Мужчин» сохраняет значение ἄνδρας, а «негодных» передаёт отрицательную нравственную оценку πονηρούς без чрезмерного усиления.
- source_word: ὀχλοποιήσαντες
  choice: собрали толпу
  rationale: Глагол означает создание или собирание толпы; враждебный характер собрания раскрывается дальнейшими действиями.
- source_word: ἐθορύβουν τὴν πόλιν
  choice: стали вызывать беспорядки в городе
  rationale: Имперфект передаёт разворачивающееся и продолжающееся возмущение; формулировка естественна для современного русского языка.
- source_word: ἐπιστάντες τῇ οἰκίᾳ Ἰάσονος
  choice: придя к дому Иасона
  rationale: Причастие здесь естественно обозначает прибытие к дому. Перевод «напав» был бы сильнее того, что прямо выражено глаголом.
- source_word: ἐζήτουν
  choice: пытались
  rationale: В контексте имперфект обозначает продолжающуюся попытку осуществить намерение; «пытались» звучит естественнее буквального «искали возможности».
- source_word: αὐτούς
  choice: их
  rationale: Сохранено местоимение исходного текста без подстановки имён Павла и Силы.
- source_word: προαγαγεῖν
  choice: вывести их
  rationale: Глагол означает вывести или привести вперёд; «вывести» учитывает предполагаемое нахождение разыскиваемых в доме.
- source_word: εἰς τὸν δῆμον
  choice: к народному собранию
  rationale: δῆμος здесь может обозначать публично собравшийся гражданский корпус, а не просто неопределённую толпу; «народное собрание» сохраняет этот институциональный оттенок.
theological_decisions:
- issue: Передача οἱ Ἰουδαῖοι в повествовании о конфликте
  choice: иудеи
  alternative: иудейские руководители; некоторые иудеи; жители Иудеи
  rationale: Основной текст сохраняет исходное этнорелигиозное обозначение и не сужает его до руководителей без прямого основания. При этом повествовательный контекст ясно показывает, что речь идёт о конкретной группе противников в Фессалонике, а не обо всех иудеях вообще.
translation_notes:
  register: Современный литературный русский язык с повествовательной ясностью и умеренно dignified регистром. Синтаксис разделён на два предложения ради естественного чтения; временная последовательность греческих причастий сохранена. Маркер сноски поставлен при «народному собранию», к которому относится примечание.
