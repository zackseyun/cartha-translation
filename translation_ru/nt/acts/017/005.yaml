  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: мотив зависти, привлечение людей с агоры, создание толпы, продолжающееся возмущение города, прибытие к дому Иасона и попытка вывести «их» к δῆμος сохранены. Однако примечание добавляет не вполне оправданное значение «на суд народа»: δῆμος обозначает гражданское публичное собрание (гражданский корпус), но не обязательно судебное разбирательство.'
  naturalness: «Привлекли к себе» здесь может пониматься как «вызвали симпатию/интерес», тогда как προσλαβόμενοι означает, что они взяли этих людей с собой или присоединили к своей группе. «Взяли с собой» естественнее и точнее. Формулировка «нескольких негодных мужчин» возможна, но несколько тяжеловесна; сохранена ради явного обозначения мужчин в ἄνδρας.
  terminology: «Иудеи» корректно передаёт οἱ Ἰουδαῖοι без интерпретирующего сужения. Имя «Иасон» нормативно. «Народное собрание» хорошо передаёт институционально-гражданский оттенок δῆμος; сноска должна ограничиваться действительно возможными лексическими вариантами.
